  es: "Abd al-Jalil ibn Abi al-Mawahib al-Ba'li"
  ur: "عبد الجلیل ابن ابی المواہب البالی"
roles: [poet, linguist, teacher]
gender: male
summary:
  ar: "عبد الجليل بن أبي المواهب محمد بن عبد الباقي، المواهبي الحنبلي البعلي الدمشقي، فاضل أصله من بعلبك ولد ومات في دمشق، ١٠٧٩ إلى ١١١٩هـ، له نظم الشافية في الصرف وتشطير الألفية وأرجوزة في العروض."
  en: "Abd al-Jalil ibn Abi al-Mawahib Muhammad ibn Abd al-Baqi al-Mawahibi al-Hanbali al-Ba'li al-Dimashqi, a man of learning whose family came from Baalbek, born and died in Damascus, 1079 to 1119 AH (1669 to 1707); author of a versification of al-Shafiya in morphology, a tashtir of the Alfiyya and a rajaz poem on prosody."
  fr: "Abd al-Jalil ibn Abi al-Mawahib Muhammad ibn Abd al-Baqi al-Mawahibi al-Hanbali al-Ba'li al-Dimashqi, lettré dont la famille venait de Baalbek, né et mort à Damas, 1079 à 1119 H (1669 à 1707) ; auteur d'une versification d'al-Shafiya en morphologie, d'un tashtir de l'Alfiyya et d'un poème en rajaz sur la prosodie."
  es: "Abd al-Jalil ibn Abi al-Mawahib Muhammad ibn Abd al-Baqi al-Mawahibi al-Hanbali al-Ba'li al-Dimashqi, un hombre de letras cuya familia procedía de Baalbek, nacido y muerto en Damasco, 1079 a 1119 d. H. (1669 a 1707); autor de una versificación de al-Shafiya en morfología, un tashtir de Alfiyya y un poema rajaz en prosodia."
  ur: "عبد الجلیل ابن ابی المواہیب محمد بن عبد الباقی المواحیبی الحنبلی البالی الدمشقی ایک صاحب علم جن کا خاندان بعلبیک سے تھا، دمشق میں پیدا ہوا اور وفات پائی، 1079 تا 1119 ہجری ⁦(1669 تا 170)⁩؛ مورفولوجی میں الشافیہ کی ایک توثیق کے مصنف، الفیہ کی تشریع اور پرسوڈی پر ایک رجز نظم۔"
  tr: "Aslen Baalbekli bir alim olan Abdul Celil bin Ebi El-Mevahib Muhammed bin Abdul Baqi, El-Mawahibi El-Hanbali El-Ba'li El-Dimashqi, H. 1079'dan 1119'a kadar Şam'da doğdu ve öldü. Şafiyye'yi morfolojik olarak besteledi, El-Elfiyye'yi böldü ve vezin üzerine bir şiir yazdı."
  id: "Abdul Jalil bin Abi Al-Mawahib Muhammad bin Abdul Baqi, Al-Mawahibi Al-Hanbali Al-Ba’li Al-Dimashqi, seorang ulama asal Baalbek, lahir dan meninggal di Damaskus, tahun 1079 hingga 1119 H. Ia menggubah Al-Shafiya secara morfologi, membagi Al-Alfiyya, dan menulis puisi tentang prosodi."
