summary:
  ar: "باحث وأستاذ جامعي ⁦(1934–1990)⁩، عمل أستاذاً بكلية الشريعة في جامعة الكويت. كتب في مقارنة الأديان والفِرق وفي العقيدة والأخلاق، وصدرت كتبه الأربعة المعروفة عن دار القلم بالكويت بين 1984 و1989: «منهج السلف في العقيدة»، و«الأخلاق ومعيارها بين الوضعية والدين»، و«السبئيون: منهجاً وغاية»، و«الملة والنحلة في اليهودية والمسيحية والإسلام»."
  en: "Researcher and university professor (1934–1990) who taught at the Faculty of Sharia, Kuwait University. He wrote on comparative religion and the sects and on creed and ethics; his four known books were published by Dar al-Qalam, Kuwait, between 1984 and 1989: 'Manhaj al-Salaf fi al-Aqidah', 'al-Akhlaq wa-Mi'yaruha bayna al-Wad'iyya wa-al-Din', 'al-Saba'iyyun: Manhajan wa-Ghayah', and 'al-Milla wa-al-Nihla fi al-Yahudiyya wa-al-Masihiyya wa-al-Islam'."
  ur: "محقق اور جامعہ پروفیسر ⁦(1934–1990)⁩ جو کلیۂ شریعہ، جامعہ کویت میں تدریس کرتے رہے۔ انہوں نے تقابلِ ادیان اور فرقوں اور عقیدہ و اخلاق پر لکھا؛ ان کی چار معروف کتابیں دار القلم کویت سے 1984 تا 1989 شائع ہوئیں: «منہج السلف فی العقیدۃ»، «الأخلاق ومعیارہا بین الوضعیۃ والدین»، «السبئیون: منہجاً وغایۃ»، اور «الملۃ والنحلۃ فی الیہودیۃ والمسیحیۃ والإسلام»۔"
  es: "Investigador y profesor universitario (1934-1990) que enseñó en la Facultad de Sharia de la Universidad de Kuwait. Escribió sobre religión comparada y las sectas y sobre credo y ética; sus cuatro libros conocidos fueron publicados por Dar al-Qalam, Kuwait, entre 1984 y 1989: 'Manhaj al-Salaf fi al-Aqidah', 'al-Akhlaq wa-Mi'yaruha bayna al-Wad'iyya wa-al-Din', 'al-Saba'iyyun: Manhajan wa-Ghayah' y 'al-Milla wa-al-Nihla fi al-Yahudiyya wa-al-Masihiyya wa-al-Islam'."
  fr: "Chercheur et professeur d'université (1934-1990) qui a enseigné à la Faculté de charia de l'Université du Koweït. Il a écrit sur la religion comparée et les sectes ainsi que sur la croyance et l'éthique; ses quatre livres connus ont été publiés par Dar al-Qalam, Koweït, entre 1984 et 1989: « Manhaj al-Salaf fi al-Aqidah », « al-Akhlaq wa-Mi'yaruha bayna al-Wad'iyya wa-al-Din », « al-Saba'iyyun: Manhajan wa-Ghayah » et « al-Milla ». wa-al-Nihla fi al-Yahudiyya wa-al-Masihiyya wa-al-Islam'."
