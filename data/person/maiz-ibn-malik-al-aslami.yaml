summary:
  ar: "ماعز بن مالك الأسلمي، معدود في المدنيين، كتب له النبي كتاباً بإسلام قومه، وهو الذي اعترف على نفسه بالزنى تائباً منيباً وكان محصناً فرُجم، وروى عنه ابنه عبد الله بن ماعز حديثاً واحداً {cite:istiab-alam-2002 p. 686}."
  en: "Ma'iz ibn Malik al-Aslami, counted among the Medinans; the Prophet wrote him a document confirming his people's Islam; he is the one who confessed to adultery, repentant and turning back to God, and, being married, was stoned; his son 'Abd Allah ibn Ma'iz narrated a single hadith from him {cite:istiab-alam-2002 p. 686}."
  ur: "ماعز بن مالک اسلمی، اہلِ مدینہ میں شمار؛ نبی نے ان کے لیے ان کی قوم کے اسلام کی تحریر لکھی؛ یہ وہی ہیں جنہوں نے توبہ اور رجوع کرتے ہوئے اپنے بارے میں زنا کا اعتراف کیا، اور شادی شدہ ہونے کی وجہ سے رجم کیے گئے؛ ان کے بیٹے عبد اللہ بن ماعز نے ان سے ایک حدیث روایت کی {cite:istiab-alam-2002 p. 686}۔"
