summary:
  ar: "صانع مخللات لندني (1888-1947) اعتنق الإسلام فتىً واتخذ اسم خالد، فأسس مساجد في جنوب لندن وجمعية غرب الإسلام، ورعى الأعمال الخيرية للمسلمين؛ وفي 1934 قبل دعوة جمهورية تركستان الشرقية الأولى لتتويجه ملكاً على «إسلامستان» فارتحل شرقاً ولم يبلغ الحكم قط."
  en: "London pickle manufacturer (1888-1947) who converted to Islam as a schoolboy, taking the name Khalid; he founded mosques in south London and the Western Islamic Association and funded Muslim charities. In 1934 he accepted the First East Turkestan Republic's invitation to become king of 'Islamestan' and travelled east, but the state collapsed before he could take power."
  ur: "لندن کے اچار ساز (1888ء–1947ء) جنہوں نے لڑکپن میں اسلام قبول کر کے خالد کا نام اختیار کیا؛ جنوبی لندن میں مساجد اور ویسٹرن اسلامک ایسوسی ایشن قائم کی اور مسلم فلاحی کاموں کی سرپرستی کی۔ 1934ء میں انہوں نے پہلی مشرقی ترکستان جمہوریہ کی «اسلامستان» کی بادشاہت کی دعوت قبول کی اور مشرق کا سفر کیا، مگر حکومت سنبھالنے سے پہلے ہی وہ ریاست ختم ہو گئی۔"
