    note: "FLAGGED for a founder ruling. Received into Islam as a schoolboy — in 1903 on the English article's account, in 1904 at Abdullah Suhrawardy's hand on the National Archives account — he supported the Woking Muslim Mission before breaking away to found his own Western Islamic Association. Ryad's scholarship shows him anxious to prove his closeness to mainstream Islam, hoping for Sunni-Shi'i unity and demanding that the Lahore Ahmadiyya disavow Mirza Ghulam Ahmad altogether; the English article's category filings call him a Sunni convert, but category filings never count, and no two independent sources name a school for him personally. Both readings — the Woking adjacency and the mainstream self-presentation — are preserved unclassified."
