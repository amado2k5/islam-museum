summary:
  ar: "الشهاب الطوسي أبو الفتح محمد بن محمود بن محمد بن شهاب الدين، نزيل مصر وشيخ المتكلمين؛ توفي بمصر عن أربع وسبعين سنة، ودرس وأفتى ووعظ وتخرج به الأصحاب، وكان يركب بالغاشية والسيوف المسلولة وبين يديه ينادي «هذا ملك العلماء»، وبنى له الملك عمر بن شاهنشاه المدرسة المعروفة بمال العز؛ وذكر أبو شامة أنه لما قدم بغداد كان يركب بسنجق والسيوف مسللة والغاشية على رأسه والعليق في عنق بغلته فأنكر من ذلك، فذهب إلى مصر ووعظ وأظهر مذهب الأشعري ووقع بينه وبين الحنابلة أمور، وكان معظماً عند الخاص والعام طويلاً مهيباً مقداماً يرتاع منه كل أحد، وعليه مدار الفتوى في مذهب الشافعي؛ توفي في ذي القعدة سنة ست وتسعين وخمسمائة {cite:shadharat-dhahab p. 807-808}."
  en: "Al-Shihab al-Tusi Abu al-Fath Muhammad b. Mahmud, resident of Egypt and shaykh of the mutakallimin; he taught, gave fatwa and preached, disciples training under him — he used to ride with a caparison, drawn swords, and a herald before him crying 'this is the king of scholars', and al-Malik Umar b. Shahanshah built him the madrasa known as Mal al-Izz. Abu Shama records that at Baghdad he rode with a sanjak, swords drawn and trappings jingling, was rebuked for it, and went to Egypt where he preached, displayed the Ash'ari madhhab, and ran into quarrels with the Hanbalis; revered by high and low alike, feared by all — and the pivot of Shafi'i fatwa. He died in Dhu al-Qa'da 596, aged seventy-four {cite:shadharat-dhahab p. 807-808}."
  fr: "Al-Shihab al-Tusi Abu al-Fath Muhammad b. Mahmud, résident d'Égypte et cheikh des moutakallimin ; il enseignait, donnait la fatwa et prêchait, les disciples s'entraînaient sous lui - il avait l'habitude de monter avec un caparison, des épées tirées, et un héraut devant lui criant \"c'est le roi des savants\", et al-Malik Umar b. Shahanshah lui a construit la madrasa connue sous le nom de Mal al-Izz. Abu Shama rapporte qu'à Bagdad, il chevauchait avec un sanjak, les épées tirées et les pièges jingling, a été réprimandé pour cela, et est allé en Égypte où il a prêché, affiché le madhhab Ash'ari, et a couru dans des querelles avec les Hanbalis ; vénéré par les hauts et les bas, craint par tous – et le pivot de la fatwa Shafi’i. Il est mort à dhou al-qi‘da 596, âgé de soixante-quatorze ans {cite:shadharat-dhahab p. 807-808}."
  es: "Al-Shihab al-Tusi Abu al-Fath Muhammad b. Mahmud, residente de Egipto y shaykh de los mutakallimin, enseñó, emitió fatwas y predicó, formando discípulos bajo su tutela. Solía cabalgar con una gualdrapa, espadas desenvainadas y un heraldo delante que gritaba: «¡Este es el rey de los eruditos!». Al-Malik Umar b. Shahanshah le construyó la madrasa conocida como Mal al-Izz. Abu Shama relata que en Bagdad cabalgó con un sanjak, espadas desenvainadas y arreos tintineantes, fue reprendido por ello y se fue a Egipto, donde predicó, exhibió la escuela de pensamiento Ash'ari y tuvo disputas con los Hanbalis. Reverenciado por altos y bajos por igual, temido por todos, fue el eje de las fatwas Shafi'i. Murió en Dhu al-Qa'da 596, a la edad de setenta y cuatro años {cite:shadharat-dhahab p. 807-808}."
  ur: "الشہاب الطوسی ابو الفتح محمد بن۔ محمود، مصر کا رہنے والا اور متکلمین کے شیخ؛ اس نے تعلیم دی، فتویٰ دیا اور تبلیغ کی، شاگردوں کو اپنے زیر تربیت تربیت دی - وہ قیلولہ کے ساتھ سواری کرتا تھا، تلواریں کھینچتا تھا اور اس کے سامنے یہ پکارتا تھا کہ یہ عالموں کا بادشاہ ہے، اور الملک عمر بن شہنشاہ نے ان کے لیے مدرسہ بنوایا جسے مال العز کہتے ہیں۔ ابو شمع نے بیان کیا ہے کہ بغداد میں وہ سنجق، تلواریں اور پھندے کے ساتھ سوار ہوئے، اس پر ملامت کی گئی، اور مصر چلا گیا جہاں اس نے تبلیغ کی، اشعری مذہب کا مظاہرہ کیا، اور حنبلیوں کے ساتھ جھگڑا کیا۔ اعلیٰ اور ادنیٰ کی طرف سے یکساں تعظیم کی جاتی ہے، جس سے سب ڈرتے ہیں — اور شافعی فتویٰ کا محور۔ آپ کی وفات ذوالقعدہ 596 میں، چوہتر سال کی عمر میں ہوئی۔ 807-808}۔"
  tr: "El-Şihab el-Tusi Ebu el-Feth Muhammed bin Mahmud ibn Muhammed ibn Şihab al-Din, Mısır'da yaşayan ve teologların ustası; yetmiş dört yaşında Mısır'da öldü. Öğretti, fetva verdi, vaaz verdi ve yoldaşlarıyla mezun oldu. Kılıç sürer, kılıç çeker ve önünde 'Bu alimlerin kralıdır.' diye ilan ederdi. Kral Ömer bin Şahanşah ona 'Onur Zenginliği' olarak bilinen okulu inşa ettirdi. Ebu Şama Bağdat'a geldiğinde başında kılıçlar ve katırının boynunda katır olan bir sancağa bindiğini, ancak bunu reddedip Mısır'a gittiğini belirtmiştir Ash'ari düşünce okulunu vaaz etti ve gösterdi, kendisiyle Hanbaliler arasında anlaşmazlıklar vardı. Hem seçkinler hem de halk tarafından saygı görüyordu; uzun, onurlu ve cesurdu, herkes tarafından korkulan biriydi. Şafii okuluna göre fetvaların temelini takip etti; beş yüz doksan altıncı yılda Dhu al-Qi'dah'ta öldü {atıf: shadharat-dhahab, s. 807-808}."
  id: "Al-Shihab al-Tusi Abu al-Fath Muhammad ibn Mahmoud ibn Muhammad ibn Shihab al-Din, seorang penduduk Mesir dan ahli teologi; ia meninggal di Mesir pada usia tujuh puluh empat tahun. Ia mengajar, mengeluarkan fatwa, berkhotbah, dan lulus bersama teman-temannya. Ia biasa menunggang pedang dan menghunus pedang, dan di hadapannya ia sering menyatakan, 'Inilah raja para cendekiawan.' Raja Umar ibn Shahanshah membangun sekolah yang dikenal sebagai 'Kekayaan Kehormatan.' Abu Shama menyebutkan bahwa ketika tiba di Baghdad, ia akan menunggang sanjak, dengan pedang di kepalanya, dan keledai di leher keledai, yang ia tolak dan pergi ke Mesir Ia mengajarkan dan menunjukkan aliran pemikiran Ash'ari, dan terjadi perselisihan antara dirinya dan Hanbali. Ia dihormati oleh kalangan elit maupun masyarakat umum, tinggi, bermartabat, dan berani, ditakuti semua orang. Ia mengikuti dasar fatwa menurut mazhab Shafi'i; ia meninggal di Dhu al-Qi'dah pada tahun lima ratus sembilan puluh enam {cite:shadharat-dhahab, hlm. 807-808}."
