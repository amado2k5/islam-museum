summary:
  ar: "الشهاب الطوسي أبو الفتح محمد بن محمود بن محمد بن شهاب الدين، نزيل مصر وشيخ المتكلمين؛ توفي بمصر عن أربع وسبعين سنة، ودرس وأفتى ووعظ وتخرج به الأصحاب، وكان يركب بالغاشية والسيوف المسلولة وبين يديه ينادي «هذا ملك العلماء»، وبنى له الملك عمر بن شاهنشاه المدرسة المعروفة بمال العز؛ وذكر أبو شامة أنه لما قدم بغداد كان يركب بسنجق والسيوف مسللة والغاشية على رأسه والعليق في عنق بغلته فأنكر من ذلك، فذهب إلى مصر ووعظ وأظهر مذهب الأشعري ووقع بينه وبين الحنابلة أمور، وكان معظماً عند الخاص والعام طويلاً مهيباً مقداماً يرتاع منه كل أحد، وعليه مدار الفتوى في مذهب الشافعي؛ توفي في ذي القعدة سنة ست وتسعين وخمسمائة {cite:shadharat-dhahab p. 807-808}."
  en: "Al-Shihab al-Tusi Abu al-Fath Muhammad b. Mahmud, resident of Egypt and shaykh of the mutakallimin; he taught, gave fatwa and preached, disciples training under him — he used to ride with a caparison, drawn swords, and a herald before him crying 'this is the king of scholars', and al-Malik Umar b. Shahanshah built him the madrasa known as Mal al-Izz. Abu Shama records that at Baghdad he rode with a sanjak, swords drawn and trappings jingling, was rebuked for it, and went to Egypt where he preached, displayed the Ash'ari madhhab, and ran into quarrels with the Hanbalis; revered by high and low alike, feared by all — and the pivot of Shafi'i fatwa. He died in Dhu al-Qa'da 596, aged seventy-four {cite:shadharat-dhahab p. 807-808}."
