  ar: رجل أعمال وعالم دين وسياسي هندي وُلد سنة 1956 في أسام. مؤسّس مجموعة عجمل للعطور ⁦(العود العربي)⁩، ورئيس حزب الجبهة المتحدة الديمقراطية لعموم الهند ⁦(AIUDF)⁩، ومن كبار مموّلي المدارس الإسلامية والمؤسسات
