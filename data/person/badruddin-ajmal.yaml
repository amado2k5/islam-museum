  en: Indian businessman, theologian and politician, born 1956 in Assam. Founder of the Ajmal perfume group, president of the All India United Democratic Front (AIUDF), and a major funder of Islamic seminaries
    and charities in India.
  ur: بھارتی کاروباری، ماہر الٰہیات اور سیاست دان، 1956 میں آسام میں پیدا ہوئے۔ عجمل عطریات گروپ کے بانی، آل انڈیا یونائیٹڈ ڈیموکریٹک فرنٹ ⁦(AIUDF)⁩ کے صدر، اور بھارت میں اسلامی مدارس و خیریاتی اداروں کے
    بڑے معاون۔
  es: "Empresario, teólogo y político indio, nacido en 1956 en Assam. Fundador del grupo de perfumes Ajmal, presidente del Frente Democrático Unido de Toda la India (AIUDF) y uno de los principales financiadores de seminarios islámicos y organizaciones benéficas en la India."
  fr: "Homme d'affaires, théologien et homme politique indien, né en 1956 en Assam. Fondateur du groupe de parfums Ajmal, président du Front démocratique uni de toute l'Inde (AIUDF) et important donateur de séminaires et d'œuvres caritatives islamiques en Inde."
