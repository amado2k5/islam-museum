summary:
  ar: "من قيس في الجاهلية، كان يُوصف بالحمق؛ يُروى أنه ربط عجل ثور ليسابق عليه، فصار مثلاً لمن يروم ما لا يكون. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 21}"
  en: "A man of Qays in pre-Islamic times, described as foolish; he tied a bull calf to race with, and the proverb about him is used for someone who attempts the impossible. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 21}"
  ur: "جاہلیت میں قیس کا ایک شخص، جسے بے وقوف کہا گیا؛ کہتے ہیں اس نے بچھڑے کو باندھ کر دوڑ لگانے کی کوشش کی، اور یہ مثل ناممکن کی خواہش کرنے والے کے لیے بنی۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 21}"
