  id: "Thamestius adalah komentator buku-buku Aristoteles, dan ia adalah penulis Liulienus, yang beralih ke doktrin filsuf dari Kekristenan setelah Galen. Ia menulis sebuah buku untuk Julian tentang manajemen dan sebuah buku tentang jiwa, dua esai, serta surat kepada Raja Julian {cite:fihrist-ibn-al-nadim hlm. 355}."
