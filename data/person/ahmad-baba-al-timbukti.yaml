summary:
  ar: "أحمد بابا بن أحمد التنبكتي، فقيه مالكي ومؤرخ للتراجم من أسرة آقيت في تنبكتو، ولد سنة 963هـ/1556م، ونُفي إلى مراكش بعد غزو السعديين للسودان سنة 1000هـ/1592م، وألّف «نيل الابتهاج بتطريز الديباج» تكملة لابن فرحون، و«كفاية المحتاج» مختصره، وتوفي بتنبكتو سنة 1036هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 301}."
  en: "Ahmad Baba b. Ahmad al-Takruri al-Massufi, Sudanese Maliki jurist and biographer of the Aqit family of Timbuktu, born 963/1556. After the Sa'di conquest of the Sudan in 1000/1592 he was exiled to Marrakesh, where he taught fiqh and hadith. He wrote Nayl al-Ibtihaj, the supplement to Ibn Farhun's Dibaj, and its abridgement Kifayat al-Muhtaj, and died at Timbuktu in 1036 {cite:encyclopaedia-of-islam-2 vol. 1 p. 301}."
