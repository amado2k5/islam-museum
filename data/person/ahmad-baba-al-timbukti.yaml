summary:
  ar: "أحمد بابا بن أحمد التنبكتي، فقيه مالكي ومؤرخ للتراجم من أسرة آقيت في تنبكتو، ولد سنة 963هـ/1556م، ونُفي إلى مراكش بعد غزو السعديين للسودان سنة 1000هـ/1592م، وألّف «نيل الابتهاج بتطريز الديباج» تكملة لابن فرحون، و«كفاية المحتاج» مختصره، وتوفي بتنبكتو سنة 1036هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 301}."
  en: "Ahmad Baba b. Ahmad al-Takruri al-Massufi, Sudanese Maliki jurist and biographer of the Aqit family of Timbuktu, born 963/1556. After the Sa'di conquest of the Sudan in 1000/1592 he was exiled to Marrakesh, where he taught fiqh and hadith. He wrote Nayl al-Ibtihaj, the supplement to Ibn Farhun's Dibaj, and its abridgement Kifayat al-Muhtaj, and died at Timbuktu in 1036 {cite:encyclopaedia-of-islam-2 vol. 1 p. 301}."
  fr: "Ahmad Baba b. Ahmad al-Takruri al-Massufi, juriste malikite et biographe soudanais de la famille Aqit de Tombouctou, né en 963 H/1556 ap. J.-C. Après la conquête saadienne du Soudan en 1000 H/1592 ap. J.-C., il fut exilé à Marrakech, où il enseigna le fiqh et le hadith. Il écrivit Nayl al-Ibtihaj, supplément au Dibaj d'Ibn Farhun, et son abrégé Kifayat al-Muhtaj, et mourut à Tombouctou en 1036 H {cite:encyclopaedia-of-islam-2 vol. 1 p. 301}."
  es: "Ahmad Baba b. Ahmad al-Takruri al-Massufi, jurista malikí sudanés y biógrafo de la familia Aqit de Tombuctú, nació en 963/1556. Tras la conquista saadí de Sudán en 1000/1592, fue exiliado a Marrakech, donde enseñó fiqh y hadiz. Escribió Nayl al-Ibtihaj, el suplemento del Dibaj de Ibn Farhun, y su compendio Kifayat al-Muhtaj, y murió en Tombuctú en 1036 {cite:encyclopaedia-of-islam-2 vol. 1 p. 301}."
  ur: "احمد بابا بی۔ احمد التکوری المصوفی، سوڈانی مالکی فقیہ اور ٹمبکٹو کے اکیت خاندان کے سوانح نگار، پیدائش 963/1556۔ 1000/1592 میں سعدی کی سوڈان کی فتح کے بعد اسے مراکش میں جلاوطن کر دیا گیا، جہاں اس نے فقہ اور حدیث کی تعلیم دی۔ اس نے ابن فرحون کے دیباج کا ضمیمہ نائل ابتہاج اور اس کا خلاصہ کفایت المحتاج لکھا اور 1036 میں ٹمبکٹو میں وفات پائی۔ 1 ص۔ 301}۔"
  tr: "Timbuktu'da Akit ailesinden Maliki fıkıhçısı ve biyografi yazarı Ahmed Baba ibn Ahmed el-Timbukti, 963 Hicri/1556 Miladi yılında doğmuştur. 1000 Hicri/1592 Miladi yılında Saadi'nin Sudan'ı işgalinden sonra Marakeş'e sürgün edilmiştir. İbn Farhun'a ek olarak \"Nayl al-Ibtihaj bi-Tatriz al-Dibaj\" ve onun özeti olan \"Kifayat al-Muhtaj\" adlı eserleri kaleme almıştır. 1036 Hicri yılında Timbuktu'da vefat etmiştir. {cite:encyclopaedia-of-islam-2 vol. 1 p. 301}"
  id: "Ahmad Baba ibn Ahmad al-Timbukti, seorang ahli hukum dan penulis biografi mazhab Maliki dari keluarga Aqit di Timbuktu, lahir pada tahun 963 H/1556 M. Ia diasingkan ke Marrakesh setelah invasi Saadian ke Sudan pada tahun 1000 H/1592 M. Ia menulis “Nayl al-Ibtihaj bi-Tatriz al-Dibaj,” sebuah tambahan untuk Ibn Farhun, dan “Kifayat al-Muhtaj,” sebuah ringkasan dari karya tersebut. Ia meninggal di Timbuktu pada tahun 1036 H. {cite:encyclopaedia-of-islam-2 vol. 1 p. 301}."
