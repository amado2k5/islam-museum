summary:
  ar: "عبد الرحمن بن محمد بن خلدون الحضرمي، مؤلف المقدمة والكتاب العار في أخبار العرب والعجم والبربر، المتوفى سنة ثمان وثمانمائة {cite:muqaddima-ibn-khaldun pdf1}. وافتتح مقدمته بأن فن التاريخ فن عزيز المذهب جم الفوائد شريف الغاية يوقفنا على أحوال الماضين من الأمم في أخلاقهم والأنبياء في سيرهم والملوك في دولهم وسياستهم حتى تتم فائدة الاقتداء في أحوال الدين والدنيا، وجعل موضوع علمه الجديد العمران وهو الاجتماع الإنساني الضروري لأن الإنسان مدني بالطبع {cite:muqaddima-ibn-khaldun p. 22,48}، وفي خاتمة مقدمته أخبر أنه أتمها بالوضع والتأليف في خمسة أشهر انتهت منتصف عام تسعة وسبعين وسبعمائة ثم نقحها وهذبها وألحق بها تواريخ العرب والبربر في كتاب العبر {cite:muqaddima-ibn-khaldun p. 652} وفي تذكرة العبر بضمير المتكلم أنه استأذن الناصر فرج في زيارة المسجد فزار الخليل وتعفف عن الدخول إلى القيامة ودخل في ركابه أواخر رمضان سنة اثنتين وثمان مئة ثم لما قصد تيمور الشام سافر مع العسكر منتصف ربيع الأول سنة ثلاث وبقي بمدرسة العادلية بدمشق بعد فرار السلطان فدلي من السور وأدخل على تيمور وهو متكئ على مرفقه وأقعد الفقيه عبد الجبار بن النعمان الخوارزمي الحنفي يترجم بينهما وسأله عن المغرب ومجيئه فقال جئت من بلادي لقضاء الفرض ووافيت مرسى الإسكندرية يوم الفطر سنة أربع وثمانين وكان تيمور كما وصفه ابن خلدون شديد الفطنة والذكاء كثير البحث واللجاج بما يعلم وبما لا يعلم عمره بين الستين والسبعين وركبته اليمنى عاطلة من سهم أصابه في الغارة أيام صباه يجرها في قريب المشي ويتناوله الرجال على الأيدي عند طول المسافة {cite:tarikh-ibn-khaldun-ibar p. 2118-2126}. وفي خاتمة العبر ساق بضمير المتكلم خبر اتصاله بالسلطان أبي عنان آخر سنة 757هـ واستعماله في كتابته، واعتقاله في ثامن عشر صفر سنة 758هـ إلى أن هلك السلطان، وكتابته عن السلطان أبي سالم سراً وإنشاءه حتى دخل به البلد الجديد منتصف شعبان سنة 760هـ فاستعمله في كتابة سره {cite:tarikh-ibn-khaldun-ibar p. 2058-2060}."
  en: "Abd al-Rahman b. Muhammad b. Khaldun al-Hadrami, author of the Muqaddima and the Kitab al-'Ibar (d. 808 AH) {cite:muqaddima-ibn-khaldun pdf1}."
