label: { ar: "ابن خلدون", en: "Ibn Khaldun" }
summary:
  ar: "عبد الرحمن بن محمد بن خلدون الحضرمي، مؤلف المقدمة والكتاب العار في أخبار العرب والعجم والبربر، المتوفى سنة ثمان وثمانمائة {cite:muqaddima-ibn-khaldun pdf1}.، وافتتح مقدمته بأن فن التاريخ فن عزيز المذهب جم الفوائد شريف الغاية يوقفنا على أحوال الماضين من الأمم في أخلاقهم والأنبياء في سيرهم والملوك في دولهم وسياستهم حتى تتم فائدة الاقتداء في أحوال الدين والدنيا، وجعل موضوع علمه الجديد العمران وهو الاجتماع الإنساني الضروري لأن الإنسان مدني بالطبع {cite:muqaddima-ibn-khaldun p. 22,48}، وفي خاتمة مقدمته أخبر أنه أتمها بالوضع والتأليف في خمسة أشهر انتهت منتصف عام تسعة وسبعين وسبعمائة ثم نقحها وهذبها وألحق بها تواريخ العرب والبربر في كتاب العبر {cite:muqaddima-ibn-khaldun p. 652}"
  en: "Abd al-Rahman b. Muhammad b. Khaldun al-Hadrami, author of the Muqaddima and the Kitab al-'Ibar (d. 808 AH) {cite:muqaddima-ibn-khaldun pdf1}."
