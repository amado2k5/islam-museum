summary:
  ar: "ولي الدين أبو زيد عبد الرحمن بن محمد بن خلدون الحضرمي، مؤلف المقدمة وكتاب العبر، وُلد بتونس سنة 732هـ/1332م لأسرة حضرمية الأصل استقرت في إشبيلية ثم تونس، وتوفي بالقاهرة سنة 808هـ/1406م. تنقل بين بلاطات فاس وغرناطة وبجاية وتلمسان وتونس، وألّف مقدمته في قلعة ابن سلامة، ثم ولي قضاء المالكية في القاهرة وتدريس الفقه والحديث وإدارة خانقاه بيبرس، ولقي تيمورلنك بدمشق. وتصفه دائرة المعارف الإسلامية بأنه من أقوى شخصيات الثقافة العربية الإسلامية في عصر انحطاطها، وتعدّه عبقرياً منفرداً قامت مقدمته على علم جديد للعمران والعصبية."
  en: "Wali al-Din Abu Zayd Abd al-Rahman ibn Muhammad ibn Khaldun al-Hadrami, author of the Muqaddima and the Kitab al-Ibar, was born at Tunis in 732 AH, 1332 CE, into a family of Hadrami origin that had settled in Seville and then Tunis, and died at Cairo in 808 AH, 1406 CE. He served at the courts of Fez, Granada, Bougie, Tlemcen and Tunis, composed his Muqaddima at the castle of Ibn Salama, then became Maliki chief judge and teacher in Cairo, head of the khanqah of Baybars, and met Timur at Damascus. The Encyclopaedia of Islam calls him one of the strongest personalities of Arabo-Muslim culture in its period of decline and a solitary genius whose Muqaddima rests on a new science of civilization and group feeling."
  ur: "ولی الدین ابو زید عبد الرحمن بن محمد بن خلدون الحضرمی، المقدمہ اور کتاب العبر کے مؤلف، 732ھ/1332ء میں تیونس میں ایک حضرمی الاصل خاندان میں پیدا ہوئے جو اشبیلیہ اور پھر تیونس میں آباد ہوا، اور 808ھ/1406ء میں قاہرہ میں فوت ہوئے۔ وہ فاس، غرناطہ، بجایہ، تلمسان اور تیونس کے درباروں میں رہے، قلعۂ ابن سلامہ میں مقدمہ تصنیف کیا، پھر قاہرہ میں مالکی قاضی القضاۃ اور استاد بنے، بیبرس کی خانقاہ کے سربراہ رہے، اور دمشق میں تیمور سے ملے۔ اسلامی دائرۂ معارف انہیں زوال کے دور میں عربی اسلامی ثقافت کی مضبوط ترین شخصیات میں اور ایک تنہا نابغہ قرار دیتا ہے جس کا مقدمہ تہذیب اور عصبیت کے نئے علم پر قائم ہے۔"
