summary:
  ar: "ولي الدين أبو زيد عبد الرحمن بن محمد بن خلدون الحضرمي، مؤلف المقدمة وكتاب العبر، وُلد بتونس سنة 732هـ/1332م لأسرة حضرمية الأصل استقرت في إشبيلية ثم تونس، وتوفي بالقاهرة سنة 808هـ/1406م. تنقل بين بلاطات فاس وغرناطة وبجاية وتلمسان وتونس، وألّف مقدمته في قلعة ابن سلامة، ثم ولي قضاء المالكية في القاهرة وتدريس الفقه والحديث وإدارة خانقاه بيبرس، ولقي تيمورلنك بدمشق. وتصفه دائرة المعارف الإسلامية بأنه من أقوى شخصيات الثقافة العربية الإسلامية في عصر انحطاطها، وتعدّه عبقرياً منفرداً قامت مقدمته على علم جديد للعمران والعصبية."
  en: "Wali al-Din Abu Zayd Abd al-Rahman ibn Muhammad ibn Khaldun al-Hadrami, author of the Muqaddima and the Kitab al-Ibar, was born at Tunis in 732 AH, 1332 CE, into a family of Hadrami origin that had settled in Seville and then Tunis, and died at Cairo in 808 AH, 1406 CE. He served at the courts of Fez, Granada, Bougie, Tlemcen and Tunis, composed his Muqaddima at the castle of Ibn Salama, then became Maliki chief judge and teacher in Cairo, head of the khanqah of Baybars, and met Timur at Damascus. The Encyclopaedia of Islam calls him one of the strongest personalities of Arabo-Muslim culture in its period of decline and a solitary genius whose Muqaddima rests on a new science of civilization and group feeling."
  ur: "ولی الدین ابو زید عبد الرحمن بن محمد بن خلدون الحضرمی، المقدمہ اور کتاب العبر کے مؤلف، 732ھ/1332ء میں تیونس میں ایک حضرمی الاصل خاندان میں پیدا ہوئے جو اشبیلیہ اور پھر تیونس میں آباد ہوا، اور 808ھ/1406ء میں قاہرہ میں فوت ہوئے۔ وہ فاس، غرناطہ، بجایہ، تلمسان اور تیونس کے درباروں میں رہے، قلعۂ ابن سلامہ میں مقدمہ تصنیف کیا، پھر قاہرہ میں مالکی قاضی القضاۃ اور استاد بنے، بیبرس کی خانقاہ کے سربراہ رہے، اور دمشق میں تیمور سے ملے۔ اسلامی دائرۂ معارف انہیں زوال کے دور میں عربی اسلامی ثقافت کی مضبوط ترین شخصیات میں اور ایک تنہا نابغہ قرار دیتا ہے جس کا مقدمہ تہذیب اور عصبیت کے نئے علم پر قائم ہے۔"
  es: "Wali al-Din Abu Zayd Abd al-Rahman ibn Muhammad ibn Khaldun al-Hadrami, autor de la Muqaddima y el Kitab al-Ibar, nació en Túnez en el año 732 de la Hégira (1332 d. C.) en el seno de una familia de origen hadrami que se había establecido en Sevilla y posteriormente en Túnez, y falleció en El Cairo en el año 808 de la Hégira (1406 d. C.). Sirvió en las cortes de Fez, Granada, Bougie, Tlemcen y Túnez, compuso su Muqaddima en el castillo de Ibn Salama, y posteriormente se convirtió en juez principal y maestro malikí en El Cairo, jefe de la khanqah de Baybars, y conoció a Tamerlán en Damasco. La Enciclopedia del Islam lo describe como una de las personalidades más destacadas de la cultura árabe-musulmana en su época de decadencia y un genio singular cuya Muqaddima se fundamenta en una nueva ciencia de la civilización y el sentimiento colectivo."
  fr: "Wali al-Din Abu Zayd Abd al-Rahman ibn Muhammad ibn Khaldun al-Hadrami, auteur de la Muqaddima et du Kitab al-Ibar, naquit à Tunis en 732 AH (1332 ap. J.-C.), au sein d'une famille d'origine hadramie établie à Séville puis à Tunis. Il mourut au Caire en 808 AH (1406 ap. J.-C.). Il exerça ses fonctions aux cours de Fès, Grenade, Bougie, Tlemcen et Tunis, composa sa Muqaddima au château d'Ibn Salama, puis devint juge en chef et enseignant malikite au Caire, chef de la khanqah de Baybars, et rencontra Tamerlan à Damas. L'Encyclopédie de l'Islam le qualifie de l'une des figures les plus marquantes de la culture arabo-musulmane durant son déclin et de génie solitaire dont la Muqaddima repose sur une nouvelle science de la civilisation et du sentiment d'appartenance à une communauté."
  tr: "Velistdin Ebu Zayd Abdülrahman ibn Muhammed ibn Haldun el-Hadrami, 'El-İbar' kitabının ve önsözü yazarıdır, 732 Hicri / 1332 yılında Tunus'ta, önce Sevilla'ya ve ardından Tunus'a yerleşen Hadrami kökenli bir ailede doğdu. 808 Hicri/1406 yılında Kahire'de öldü. Fez, Granada, Bejaia, Tlemcen ve Tunus sarayları arasında gidip geldi; İbn Salama Kalesi'nde giriş yazdı, ardından Kahire'de Maliki yargıcı olarak atandı, fıkıh ve hadis öğretti ve hankah beybarlarını yönetti. Şam'da Timur ile tanıştı. İslam Ansiklopedisi, onu Arap-İslam kültürünün gerileme dönemindeki en güçlü figürlerden biri olarak tanımlar ve temeli yeni bir kentleşme ve asabiye bilimine dayanan eşsiz bir dahi olarak kabul eder."
  id: "Wali al-Din Abu Zayd Abd al-Rahman ibn Muhammad ibn Khaldun al-Hadrami, penulis pengantar dan buku 'Al-Ibar,' lahir di Tunis pada tahun 732 H / 1332 M dari keluarga keturunan Hadrami yang menetap di Sevilla dan kemudian Tunis. Ia meninggal di Kairo pada tahun 808 H/1406 M. Ia berpindah-pindah antara istana Fez, Granada, Bejaia, Tlemcen, dan Tunis, menulis pengantar di Benteng Ibn Salama, kemudian diangkat sebagai hakim Maliki di Kairo, mengajar yurisprudensi dan hadis, serta mengelola Khanqah Baybars. Ia bertemu Timur di Damaskus. Ensiklopedia Islam menggambarkannya sebagai salah satu tokoh terkuat dalam budaya Arab-Islam selama masa kemunduran dan menganggapnya sebagai jenius unik yang fondasinya didasarkan pada ilmu baru urbanisme dan asabiyyah."
