summary:
  ar: "أبو خالد سليمان بن حيان الأحمر، من أهل الراوية والنصيحة، كتب إلى من يروي عنه أن الصديقين كانوا يستحيون من الله أن يكونوا اليوم على منزلة أمس."
  en: "Abu Khalid Sulayman ibn Hayyan al-Ahmar, a transmitter and adviser, who wrote in a letter that the truthful ones were ashamed before God to be today on the same station as yesterday."
  ur: "ابو خالد سلیمان بن حیان احمر روایت اور نصیحت کے آدمی تھے۔ انہوں نے ایک خط میں لکھا کہ صدیقین اللہ سے شرماتے تھے کہ آج وہ کل والے درجے پر ہوں۔"
  es: "Abu Khalid Sulayman ibn Hayyan al-Ahmar, transmisor y consejero, escribió en una carta que los veraces se avergonzaban ante Dios de estar hoy en la misma emisora que ayer."
  fr: "Abou Khalid Sulayman ibn Hayyan al-Ahmar, transmetteur et conseiller, écrivait dans une lettre que les véridiques avaient honte devant Dieu d'être aujourd'hui sur la même station qu'hier."
  tr: "Ebu Halid Süleyman ibn Hayyan el-Ahmar, bir rivayetçi ve danışman, kendisinden rivayet edenlere, doğruların dün oldukları gibi olmaktan Allah huzurunda utandıklarını yazmıştır."
  id: "Abu Khalid Sulayman ibn Hayyan al-Ahmar, seorang narator dan penasihat, menulis kepada mereka yang menceritakan darinya bahwa orang-orang yang benar malu di hadapan Tuhan karena menjadi seperti kemarin."
