label:
  ar: "أبو سعيد ميرزا التيموري"
  en: "Abu Sa'id Mirza (Timurid sultan)"
  ur: "ابو سعید مرزا تیموری"
summary:
  ar: "أبو سعيد ميرزا، سلطان تيموري، بدأ سنة 853هـ/1449م وهو في الخامسة والعشرين محاولًا الاستيلاء على ما وراء النهر، ثم استولى على خراسان بعد أن أخذ هراة سنة 862هـ/1458م، وتمدد نفوذه شرقًا وغربًا. {cite:encyclopaedia-of-islam-2 vol. 1 p. 166}"
  en: "Abu Sa'id Mirza, Timurid sultan, who at the age of twenty-five in 853/1449 tried to take Transoxiana, failed at Samarkand and Bukhara, and then made himself master of Khurasan by taking Harat in 862/1458; his power reached Transoxiana, Turkistan, Kabulistan and beyond. {cite:encyclopaedia-of-islam-2 vol. 1 p. 166}"
  ur: "ابو سعید مرزا، تیموری سلطان، جنہوں نے 853ھ/1449ء میں پچیس سال کی عمر میں ماورا النہر پر قبضے کی کوشش کی، سمرقند اور بخارا میں ناکام رہے، اور پھر 862ھ/1458ء میں ہرات لے کر خراسان پر قابض ہو گئے؛ ان کا اقتدار ماورا النہر، ترکستان اور کابلستان تک پہنچا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 166}"
