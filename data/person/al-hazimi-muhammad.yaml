summary:
  ar: "أبو بكر محمد بن موسى بن عثمان الحازمي الهمذاني الملقب زين الدين؛ أحد الحفاظ المتقنين والعباد الصالحين، سمع بهمذان من عبد الأول بن عيسى السجزي وأبي منصور شهردار الديلمي وابن المقرئ، وتفقه ببغداد على واثق بن فضلان، ثم ارتحل في طلب الحديث إلى بلاد العراق والشام والموصل وفارس وأصبهان وكثير من بلاد أذربيجان؛ من كتبه «الناسخ والمنسوخ» في الحديث و«الفيصل» في مشكلة النسبة و«العجالة» في النسب و«ما اتفق لفظه وافترق مسمّاه» في الأماكن والبلدان المشتبهة في الخط و«سلسلة الذهب» و«شروط الأئمة»، واستوطن بغداد بالجانب الشرقي {cite:wafayat-ayan}."
  en: "al-Hazimi al-Hamadhani (548/549–584) — the precise hafiz of Baghdad's east side; traveller through Iraq, Syria, Persia and Azerbaijan; author of al-Nasikh wa-l-Mansukh and Shurut al-A'imma {cite:wafayat-ayan}."
