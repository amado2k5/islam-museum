summary:
  ar: "صاحب ميورقة ومنورقة ويابسة الجزر الثلاث المتجاورة في البحر الغربي؛ توفي أبوه إسحاق المعروف بابن غانية سنة ثمانين وخمس مئة فخرج علي وأخوه يحيى إلى بلاد إفريقية وفعلا الأفاعيل العجيبة المشهورة بين الناس من الحروب والعيث في البلاد، وكان علي حياً في سنة إحدى وتسعين {cite:wafayat-ayan p. 16}."
  en: "Ibn Ghaniya's son, of the Majorca-Menorca-Iviza islands in the western sea; after his father's death in 580 he and his brother Yahya carried their famous wars and ravages through Ifriqiya, Ali living past 591 {cite:wafayat-ayan p. 16}."
  es: "Hijo de Ibn Ghaniya, de las islas de Mallorca, Menorca e Iviza en el mar occidental; tras la muerte de su padre en 580, él y su hermano Yahya llevaron sus famosas guerras y devastaciones a través de Ifriqiya, Ali vivió más allá de 591 {cite:wafayat-ayan p. 16}."
  fr: "Le fils d'Ibn Ghaniya, des îles Majorque-Minorque-Iviza dans la mer occidentale; après la mort de son père en 580, lui et son frère Yahya ont mené leurs célèbres guerres et ravages à travers Ifriqiya, Ali vivant au-delà de 591 {cite:wafayat-ayan p. 16}."
  ur: "ابن ثنیہ کا بیٹا، مغربی سمندر میں میجرکا-مینورکا-ایویزا جزیروں کا؛ 580 میں اپنے والد کی وفات کے بعد اس نے اور اس کے بھائی یحییٰ نے اپنی مشہور جنگیں اور تباہی افریقیہ کے ذریعے کی، علی 591 سے گزر رہے ہیں 16}۔"
  tr: "Majorca, Menorca ve batı denizindeki üç bitişik adanın sahibiydi; babası İshaq, İbn Ghaniyyah olarak bilinir, 580 Hicri yılında öldü. Ali ve kardeşi Yahya, halkın savaş ve kaosun ünlü olaylarının yaşandığı İfrikiye topraklarına gittiler. Ali, doksan birinci yılda hayattaydı {atıf:wafayat-ayan s. 16}."
  id: "Ia adalah pemilik Majorca, Menorca, dan tiga pulau di laut barat yang berdekatan; ayahnya Ishaq, yang dikenal sebagai Ibn Ghaniyyah, meninggal pada tahun 580 H. Ali dan saudaranya Yahya pergi ke tanah Ifriqiya, di mana perbuatan luar biasa yang terkenal di antara orang-orang perang dan kekacauan terjadi di tanah tersebut. Ali hidup pada tahun sembilan puluh satu {cite:wafayat-ayan hlm. 16}."
