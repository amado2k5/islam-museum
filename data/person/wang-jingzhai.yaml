  source: "English Wikipedia 'Wang Jingzhai' (revision 1286967538 of 23 April 2025), Chinese Wikipedia '王靜齋' (revision 94707739 of 2 October 2026), Urdu Wikipedia 'وانگ جنگژائی' (revision 9962505 of 20 April 2026) and Wikidata item Q1240846 (item revision 2554063659 of 6 October 2026), each fetched through the MediaWiki/Wikidata APIs on 27 October 2026, each article fetched by its recorded revision id with the returned id asserted equal, and the Wikidata item read twice with identical claims and revision. The QID was grounded through the English article's page properties and confirmed through the Chinese and Urdu articles'. Existence was checked both ways before building: no record under data/person/ carries his name in Latin, Arabic or Chinese fragments or the QID Q1240846, and no Arabic label is shared with any existing record, so no homonym entry is required. The lived_in edge to place/cairo is scoped to his study residence of 1922–1924 at al-Azhar, attested by the Chinese article; the English article likewise has him attend al-Azhar, though it places the attendance after his hajj where the Chinese itinerary places the hajj in the autumn of 1923, between two periods of study. The traveled_to edge to place/mecca rests on that hajj. No student_of edges are written: his teachers — his father Wang Lanting, Yu Mianzhai and the other ahongs named in the Chinese article — have no museum records. The claim in Ma Linyi's English article that Ma Linyi and Ma Fuxiang sponsored his hajj in 1921 is contradicted by this article's itinerary (departure 1922, four named sponsors, hajj autumn 1923) and is written as an edge in neither record."
