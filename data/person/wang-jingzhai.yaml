summary:
  ar: "عالم مسلم صيني من تيانجين (1880–1949)، من كبار الأئمة «الأهونغ» في جمهورية الصين وأحد «الأئمة الأربعة الكبار» في الصين الحديثة؛ درس في الجامع الأزهر وحجّ سنة 1923، وأصدر مجلة «إي غوانغ» اثني عشر عامًا، وترجم القرآن الكريم كاملًا إلى الصينية في ثلاث صيغ متعاقبة."
  en: "Chinese Muslim scholar from Tianjin (1880–1949), a leading ahong of the Republic of China and one of the four great ahongs of modern China. He studied at al-Azhar and performed the hajj in 1923, published the journal Yi Guang for twelve years, and translated the whole Qur'an into Chinese in three successive versions."
  ur: "تیانجن سے تعلق رکھنے والے ایک چینی مسلمان عالم (1880ء–1949ء)، جمہوریہ چین کے ممتاز آہونگ اور جدید چین کے چار بڑے آہونگوں میں سے ایک؛ انہوں نے جامعہ ازہر میں تعلیم حاصل کی اور 1923ء میں حج کیا، بارہ سال تک رسالہ «ای گوانگ» جاری کیا، اور قرآن مجید کا مکمل چینی ترجمہ تین مسلسل صورتوں میں پیش کیا۔"
