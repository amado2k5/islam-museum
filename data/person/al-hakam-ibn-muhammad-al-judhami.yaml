label: { ar: "الحكم بن محمد بن حكم الجذعمي القرطبي" }
summary:
  ar: "أبو العاص الحكم بن محمد بن حكم الجذعمي — نسبة إلى جذعم قبيلة باليمن — القرطبي مسند الأندلس؛ حج فسمع من أبي محمد بن أبي زيد وإبراهيم بن علي التمار وأبي بكر المهندس وقرأ على عبد المنعم بن غلبون؛ كان صالحاً ثقة وربما صلى في السنة ألفاً، زاهداً؛ توفي في ربيع الآخر سنة سبع وأربعين وأربعمائة عن نيف وتسعين سنة {cite:shadharat-dhahab p. 276}."
  en: "Abu al-As al-Hakam b. Muhammad al-Judhami al-Qurtubi, musnid of al-Andalus; made hajj and heard Abu Muhammad b. Abi Zayd, Ibrahim b. Ali al-Tammar and Abu Bakr al-Muhandis, and read under Abd al-Mun'im b. Ghulbun; a pious trustworthy ascetic who might pray a thousand rak'as a year; died Rabi' II 447 aged past ninety {cite:shadharat-dhahab p. 276}."
