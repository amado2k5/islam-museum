id: person/al-hakam-ibn-muhammad-al-judhami
class: person
label: { ar: "الحكم بن محمد بن حكم الجذعمي القرطبي", en: "al-Hakam ibn Muhammad ibn Hakam al-Judhami al-Qurtubi", fr: "Al-Hakam ibn Muhammad ibn Hakam al-Judhami al-Qurtubi", es: "al-Hakam ibn Muhammad ibn Hakam al-Judhami al-Qurtubi", ur: "الحکم بن محمد بن حکم الجوثمی القرطبی" }
summary:
  ar: "أبو العاص الحكم بن محمد بن حكم الجذعمي — نسبة إلى جذعم قبيلة باليمن — القرطبي مسند الأندلس؛ حج فسمع من أبي محمد بن أبي زيد وإبراهيم بن علي التمار وأبي بكر المهندس وقرأ على عبد المنعم بن غلبون؛ كان صالحاً ثقة وربما صلى في السنة ألفاً، زاهداً؛ توفي في ربيع الآخر سنة سبع وأربعين وأربعمائة عن نيف وتسعين سنة {cite:shadharat-dhahab p. 276}."
  en: "Abu al-As al-Hakam b. Muhammad al-Judhami al-Qurtubi, musnid of al-Andalus; made hajj and heard Abu Muhammad b. Abi Zayd, Ibrahim b. Ali al-Tammar and Abu Bakr al-Muhandis, and read under Abd al-Mun'im b. Ghulbun; a pious trustworthy ascetic who might pray a thousand rak'as a year; died Rabi' II 447 aged past ninety {cite:shadharat-dhahab p. 276}."
  fr: "Abu al-As al-Hakam ibn Muhammad al-Judhami al-Qurtubi, musnid d’al-Andalus ; il fit le pèlerinage, entendit Abu Muhammad ibn Abi Zayd, Ibrahim ibn Ali al-Tammar et Abu Bakr al-Muhandis et lut auprès d’Abd al-Mun’im ibn Ghulbun. Ascète pieux et digne de confiance, il lui arrivait de prier mille rak’as par an ; mort en rabi II 447 H à plus de quatre-vingt-dix ans {cite:shadharat-dhahab p. 276}."
  es: "Abu al-As al-Hakam b. Muhammad al-Judhami al-Qurtubi, musnid de al-Andalus; Hizo el Hayy y escuchó a Abu Muhammad b. Abi Zayd, Ibrahim b. Ali al-Tammar y Abu Bakr al-Muhandis, y leído bajo Abd al-Mun'im b. Ghulbun; un asceta piadoso y confiable que podría rezar mil rak'as al año; murió Rabi' II 447 a la edad de más de noventa años {cita: shadharat-dhahab p. 276}."
  ur: "ابو العاص الحکم ب۔ محمد الجدمی القرطبی، مسند الاندلس؛ حج کیا اور ابو محمد بن کو سنا۔ ابی زید، ابراہیم بن علی التمر اور ابوبکر المہندس، اور عبد المنعیم کے ذیل میں پڑھتے ہیں۔ غلبون; ایک متقی ثقہ سنی جو سال میں ہزار رکعت نماز پڑھ سکتا ہے۔ وفات ربیع الثانی 447 عمر نوے سے زائد 276}۔"
  tr: "Ebu el-Hakam ibn Muhammed bin Hakam el-Cudh'ami — Yemen'de bir kabileye atfedilen — el-Kurtubi, Endülüs'ün Musnadı; Hac yaptı ve Ebu Muhammed bin Ebi Zeyd, İbrahim bin Ali el-Tammar ve Ebu Bekir el-Muhendis'ten dinledi, Abdülmünim bin Ghalbun'un yanında eğitim aldı; doğru, güvenilir ve belki de yılda bin namaz kılan bir zahi idi; dört yüz kırk yedi yılında, doksan yaşından büyük yaşta Rabi'al-Akhir'de öldü {atıf: Shadharat-Dhahab, s. 276}."
  id: "Abu al-As al-Hakam ibn Muhammad ibn Hakam al-Judh'ami — yang dikaitkan dengan sebuah suku di Yaman — al-Qurtubi, Musnad al-Andalus; ia menunaikan Haji dan mendengar dari Abu Muhammad ibn Abi Zayd, Ibrahim ibn Ali al-Tammar, dan Abu Bakr al-Muhandis, serta belajar di bawah Abd al-Mun'im ibn Ghalbun; ia adalah orang yang benar, dapat dipercaya, dan mungkin berdoa seribu salat dalam setahun, seorang pertapa; ia meninggal di Rabi' al-Akhir pada tahun empat ratus empat puluh tujuh pada usia lebih dari sembilan puluh {cite:shadharat-dhahab, hlm. 276}."
