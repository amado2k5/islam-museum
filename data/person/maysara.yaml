  en: "Khadija's servant who accompanied Muhammad on her trade trip to Syria and reported back the honesty and noble character he saw — the testimony that led her to seek his hand."
  ar: "غلام خديجة رافق محمداً في رحلتها التجارية إلى الشام، فأخبرها بما رأى فيه من خلال عذبة وشمائل كريمة وفكر راجح ومنطق صادق ونهج أمين؛ فكان من أسباب رغبتها في زواجه.، ومعه خرج النبي إلى الشام في تجارة خديجة فنظر إليه نسطورا الراهب من صومعته وقد أظلته غمامة فقال هذا نبي وهذا آخر الأنبياء {cite:muruj-al-dhahab p. 569-570}"
