summary:
  en: "Khadija's servant who accompanied Muhammad on her trade trip to Syria and reported back the honesty and noble character he saw — the testimony that led her to seek his hand."
  ar: "غلام خديجة رافق محمداً في رحلتها التجارية إلى الشام، فأخبرها بما رأى فيه من خلال عذبة وشمائل كريمة وفكر راجح ومنطق صادق ونهج أمين؛ فكان من أسباب رغبتها في زواجه. ومعه خرج النبي إلى الشام في تجارة خديجة فنظر إليه نسطورا الراهب من صومعته وقد أظلته غمامة فقال هذا نبي وهذا آخر الأنبياء {cite:muruj-al-dhahab p. 569-570}، وعند ابن خلدون وبايعه البربر لنفسه بالخلافة داعياً إلى نحلته من الخارجية على مذهب الصفرية ثم ساءت سيرته فنقم عليه البربر ما جاء به فقتلوه وقدموا على أنفسهم خالد بن حميد الزناتي {cite:tarikh-ibn-khaldun-ibar p. 1608}"
  es: "El sirviente de Jadiya que acompañó a Mahoma en su viaje comercial a Siria y que relató la honestidad y el noble carácter que vio en él, testimonio que la llevó a pedir su mano."
  fr: "Le serviteur de Khadija qui accompagna Muhammad lors de son voyage commercial en Syrie et rapporta l'honnêteté et la noblesse de caractère qu'il avait constatées — le témoignage qui la conduisit à demander sa main."
  ur: "خدیجہ کی خادمہ جو محمد کے ساتھ شام کے تجارتی سفر پر گئی تھی اور اس نے دیانتداری اور اعلیٰ کردار کی اطلاع دی تھی - وہ گواہی جس نے اسے اس کا ہاتھ تلاش کرنے پر مجبور کیا۔"
  tr: "Hadijah'ın hizmetçisi, Muhammed'in ticari yolculuğunda Levant'a eşlik etti, ona asil nitelikleri, sağduyulu düşüncesi, samimi mantığı ve güvenilir yaklaşımı aracılığıyla onda gördüklerini anlattı; bu, onun evlenmesini istemesinin nedenlerinden biriydi. Peygamber, Hadica'nın ticareti için onunla birlikte Levant'a gitti ve keşiş Nestura onu manastırından, bir bulutun gölgesinde gördü ve dedi ki: Bu bir peygamberdir ve bu peygamberlerin sonuncusudur. {alıntı:) Muruj-al-Dhahab, s. 569-570}. İbn Haldun ve Berberiler, Sufari okuluna göre Harice'den soyundan gelenleri çağırarak ona halife olarak bağlılık yemini ettiler. Sonra davranışları kötüleşti, Berberiler getirdiği şey nedeniyle ona saldırdı ve onu öldürdü, ardından Halid bin Hümeyd el-Zanati'yi kendi başlarına aldılar {atıf:Tarih-ibn-haldun-ibar s. 1608}"
  id: "Pelayan Khadijah menemani Muhammad dalam perjalanan dagangnya ke Levant, memberitahunya apa yang ia lihat dari Muhammad melalui sifat mulia, pemikiran yang bijaksana, logika yang tulus, dan pendekatan yang dapat dipercaya; inilah salah satu alasan mengapa ia menginginkan pernikahan Khadijah. Bersamanya, Nabi pergi ke Levant dalam perdagangan Khadijah, dan Nestura sang biksu melihatnya dari biaranya, yang tertutup awan, dan berkata: Ini adalah nabi, dan ini adalah nabi terakhir. {cite:Muruj-al-Dhahab, hlm. 569-570}. Ibn Khaldun dan orang Berber bersumpah setia kepadanya sebagai khalifah, memanggil keturunannya dari Kharijah menurut mazhab Sufari. Kemudian perilakunya memburuk, dan orang Berber menyerangnya atas apa yang ia bawa dan membunuhnya, dan mereka mengambil Khalid ibn Humayd al-Zanati atas diri mereka {cite:History-ibn-khaldun-ibar hlm. 1608}"
