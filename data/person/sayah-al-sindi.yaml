summary:
  ar: "زعيم سندي طلب من أبي موسى الأشعري في فتح الأهواز، في خلافة عمر بن الخطاب، أن يدخل هو وقومه في الإسلام على أن يقاتلوا مع المسلمين العجم، واشترط لهم العطاء والسكن حيث شاؤوا؛ فكتب أبو موسى إلى عمر فوافق. بعد الفتح نزلوا البصرة وحالفوا بني تميم، وعمل كثير منهم في بيت المال والصيرفة {cite:umayyad-birth-to-fall-2006 p. 111}."
