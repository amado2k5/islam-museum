id: person/sayah-al-sindi
class: person
label: { ar: "سياة السندي" }
gender: male
summary:
  ar: "زعيم سندي طلب من أبي موسى الأشعري في فتح الأهواز، في خلافة عمر بن الخطاب، أن يدخل هو وقومه في الإسلام على أن يقاتلوا مع المسلمين العجم، واشترط لهم العطاء والسكن حيث شاؤوا؛ فكتب أبو موسى إلى عمر فوافق. بعد الفتح نزلوا البصرة وحالفوا بني تميم، وعمل كثير منهم في بيت المال والصيرفة {cite:umayyad-birth-to-fall-2006 p. 111}."
  tr: "Bir Sindi lideri, Ömer bin el-Hattab'ın halifeliği sırasında Ahwaz'ın fethinde Ebu Musa el-Eş'ari'den, kendisini ve halkını İslam'a dönüştürmesini istedi; ancak Arap olmayan Müslümanlarla birlikte savaşmaları şartıyla ve istedikleri yere yerleştirilmeleri şartı vardı; Ebu Musa Ömer'e yazdı ve Ömer kabul etti. Fetihten sonra Basra'ya yerleştiler ve Banu Tamim ile ittifak kurdular; birçoğu hazine ve bankacılıkta çalıştı {cite:umayyad-birth-to-autumn-2006, s. 111}."
  id: "Seorang pemimpin Sindi meminta Abu Musa al-Ash'ari dalam penaklukan Ahwaz, pada masa kekhalifahan Umar ibn al-Khattab, untuk memeluk Islam dengan syarat mereka berperang bersama Muslim non-Arab, dengan syarat mereka diberikan dan ditempatkan di mana pun mereka mau; Abu Musa menulis surat kepada Umar dan dia setuju. Setelah penaklukan, mereka menetap di Basra dan bersekutu dengan Banu Tamim, dan banyak dari mereka bekerja di perbendaharaan dan perbankan {cite:umayyad-birth-to-fall-2006, hlm. 111}."
