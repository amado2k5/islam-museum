id: person/yazid-ibn-muawiya
class: person
label: { ar: "يزيد بن معاوية", en: "Yazid ibn Mu'awiya" }
summary:
  ar: "يزيد بن معاوية بن أبي سفيان، ثاني خلفاء بني أمية؛ عند البلاذري: لما توفي معاوية وولي بعده ابنه يزيد أقفل جند قبرس الذين رتّبهم أبوه بالجزيرة وأمر بهدم مدينتهم — وروى محمد بن مصفى أنه رُشي مالاً عظيماً حتى أقفلهم فهدم أهل قبرس مدينتهم ومساجدهم —؛ وهو الذي وضع الخراج على أراضي السامرة بالأردن وجعل على رأس كل امرئ منهم خمسة دنانير. وعند المسعودي دخل منزله فلم يظهر للناس ثلاثاً حتى خرج أشعث أغبر فخطب وقال كان معاوية حبلاً من حبال الله مده الله ما شاء أن يمده ثم قطعه حين شاء أن يقطعه وكان دون من كان قبله وخير من بعده، وكان صاحب طرب وجوارح وكلاب وقرود وفهود ومنادمة على الشراب، وكان له قرد يكنى بأبي قيس يحمله على أتان وحشية بسرج ولجام ويسابق بها الخيل يوم الحلبة، وفي أيامه ظهر الغناء بمكة والمدينة واستعملت الملاهي {cite:muruj-al-dhahab p. 63-66} ولما أخرج أهل المدينة عامله عثمان بن محمد بن أبي سفيان وبني أمية سنة ثلاث وستين سير إليهم مسلم بن عقبة المري فأخافها ونهبها وبايعهم على أنهم عبيد، ومن هدم الكعبة بمجانيق الحصين بن نمير قبل وفاته بأحد عشر يوماً {cite:muruj-al-dhahab p. 66-69}"
  en: "Yazid ibn Mu'awiya ibn Abi Sufyan, second Umayyad caliph; in al-Baladhuri: when Mu'awiya died and his son Yazid succeeded, he withdrew the garrison his father had stationed in Cyprus and ordered their city demolished — Muhammad ibn Musaffa's report holds he was bribed with great wealth to withdraw them, whereupon the Cypriots demolished their city and mosques; it was he who laid kharaj on the Samaritans' lands in the Jordan, at five dinars on every man's head."
