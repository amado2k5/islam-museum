id: person/yazid-ibn-muawiya
class: person
roles: [caliph]
label: { ar: "يزيد بن معاوية", en: "Yazid ibn Mu'awiya", es: "Yazid ibn Mu'awiya", fr: "Yazid ibn Mu'awiya", ur: "یزید بن معاویہ" }
summary:
  ar: "يزيد بن معاوية بن أبي سفيان، ثاني خلفاء بني أمية، حكم من 60 إلى 64هـ/680 إلى 683م بعدما سمّاه أبوه معاوية خليفة له. وأمه ميسون أخت زعيم كلب ابن بحدل. وفي عهده بدأت أزمة الفتنة: قُتل الحسين بن علي في كربلاء، وخلع أهل المدينة بيعته فجاء جيش الشام ووقعت وقعة الحرة، ثم حوصر ابن الزبير بمكة وأصاب الكعبة حريق. وتقول دائرة المعارف الإسلامية إن الرواية التقليدية عدائية له في الجملة وإن الدارسين يختلفون في قراءتها، وإن الأدلة المتاحة قد لا تسمح بحكم على كفاءته أو شخصه."
  en: "Yazid ibn Mu'awiya ibn Abi Sufyan, second Umayyad caliph, reigned 60 to 64 AH, 680 to 683 CE, after his father Mu'awiya named him successor. His mother Maysun was a sister of the Kalbi leader Ibn Bahdal. His reign opened the crisis called the fitna: al-Husayn ibn Ali was killed at Karbala, the people of Medina withdrew their allegiance and a Syrian army fought at al-Harra, and Ibn al-Zubayr was then besieged in Mecca, where the Ka'ba was damaged by fire. The Encyclopaedia of Islam says the traditional narrative is generally hostile to him, that modern scholars read it differently, and that the evidence may not allow a judgement of his ability or character."
  ur: "یزید بن معاویہ بن ابی سفیان، بنو امیہ کے دوسرے خلیفہ، نے 60 سے 64ھ/680 سے 683ء تک حکومت کی، جب ان کے والد معاویہ نے انھیں جانشین مقرر کیا۔ ان کی والدہ میسون کلبی سردار ابن بحدل کی بہن تھیں۔ ان کے عہد میں فتنہ کا بحران شروع ہوا: حسین بن علی کربلا میں قتل ہوئے، اہلِ مدینہ نے بیعت توڑ دی اور شامی فوج سے حرہ میں معرکہ ہوا، پھر مکہ میں ابن زبیر کا محاصرہ ہوا اور کعبہ کو آگ سے نقصان پہنچا۔ اسلامی دائرۃ المعارف کہتا ہے کہ روایتی بیان عموماً ان کے خلاف ہے، جدید محققین اسے مختلف طرح پڑھتے ہیں، اور دستیاب شواہد شاید ان کی قابلیت یا شخصیت پر فیصلے کی اجازت نہ دیں۔"
  es: "Yazid ibn Mu'awiya ibn Abi Sufyan, segundo califa omeya, reinó entre el 60 y el 64 d. H. (680-683 d. C.), tras ser nombrado sucesor por su padre, Mu'awiya. Su madre, Maysun, era hermana del líder kalbi Ibn Bahdal. Su reinado desencadenó la crisis conocida como la fitna: al-Husayn ibn Ali fue asesinado en Karbala, los habitantes de Medina retiraron su lealtad y un ejército sirio combatió en al-Harra. Posteriormente, Ibn al-Zubayr fue asediado en La Meca, donde la Kaaba resultó dañada por un incendio. La Enciclopedia del Islam afirma que la narrativa tradicional es generalmente hostil hacia él, que los estudiosos modernos la interpretan de manera diferente y que las pruebas disponibles no permiten juzgar su capacidad ni su carácter."
  fr: "Yazid ibn Mu'awiya ibn Abi Sufyan, deuxième calife omeyyade, régna de 60 à 64 AH (680 à 683 ap. J.-C.), après avoir été désigné successeur par son père Mu'awiya. Sa mère, Maysun, était la sœur d'Ibn Bahdal, chef kalbi. Son règne marqua le début de la crise appelée fitna: al-Husayn ibn Ali fut tué à Karbala, les habitants de Médine se désolidarisèrent de lui, une armée syrienne combattit à al-Harra, et Ibn al-Zubayr fut assiégé à La Mecque, où la Kaaba fut endommagée par un incendie. L'Encyclopédie de l'Islam indique que le récit traditionnel lui est généralement hostile, que les érudits modernes l'interprètent différemment et que les preuves ne permettent pas de juger de ses compétences ni de son caractère."
  tr: "Emeviyelerin ikinci halifesi Yezid bin Muaviye bin Ebi Sufyan, babası Muaviyeden sonra 60-64 Hicri / 680-683 yılları arasında hüküm sürdü. Annesi, Kalb bin Behdel'in liderinin kız kardeşi Maysun'du. Saltanatı sırasında isyan krizi başladı: Hüseyin bin Ali Kerbel'de öldürüldü, Medine halkı ittikatini bozdu, Suriye ordusu geldi ve Harra Savaşı gerçekleşti. Daha sonra İbn el-Zubeyr Mekke'de kuşatıldı ve Kabe yandı. İslam Ansiklopedisi, geleneksel anlatımın genellikle ona karşı düşmanca olduğunu, alimlerin yorumlarında farklı olduğunu ve mevcut kanıtların onun yetkinliği veya kişiliği hakkında yargı yapmaya olanak vermeyebileceğini belirtir."
  id: "Yazid ibn Muawiyah ibn Abi Sufyan, khalifah kedua Umayyah, memerintah dari tahun 60 hingga 64 H / 680 hingga 683 M setelah ayahnya Muawiya menunjuknya sebagai penerusnya. Ibunya adalah Maysun, saudara perempuan pemimpin Kalb ibn Bahdal. Selama masa pemerintahannya, krisis hasutan dimulai: Husayn ibn Ali tewas di Karbala, rakyat Madinah memutuskan kesetiaannya, tentara Suriah datang, dan Pertempuran Al-Harra terjadi. Kemudian Ibn al-Zubayr dikepung di Mekah dan Ka'bah terbakar. Ensiklopedia Islam menyatakan bahwa narasi tradisional umumnya bermusuhan dengannya, dan para ulama berbeda dalam penafsirannya, dan bukti yang ada mungkin tidak memungkinkan penilaian atas kompetensi atau kepribadiannya."
