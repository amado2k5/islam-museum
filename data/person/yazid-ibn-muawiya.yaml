roles: [caliph]
label: { ar: "يزيد بن معاوية", en: "Yazid ibn Mu'awiya" }
summary:
  ar: "يزيد بن معاوية بن أبي سفيان، ثاني خلفاء بني أمية، حكم من 60 إلى 64هـ/680 إلى 683م بعدما سمّاه أبوه معاوية خليفة له. وأمه ميسون أخت زعيم كلب ابن بحدل. وفي عهده بدأت أزمة الفتنة: قُتل الحسين بن علي في كربلاء، وخلع أهل المدينة بيعته فجاء جيش الشام ووقعت وقعة الحرة، ثم حوصر ابن الزبير بمكة وأصاب الكعبة حريق. وتقول دائرة المعارف الإسلامية إن الرواية التقليدية عدائية له في الجملة وإن الدارسين يختلفون في قراءتها، وإن الأدلة المتاحة قد لا تسمح بحكم على كفاءته أو شخصه."
  en: "Yazid ibn Mu'awiya ibn Abi Sufyan, second Umayyad caliph, reigned 60 to 64 AH, 680 to 683 CE, after his father Mu'awiya named him successor. His mother Maysun was a sister of the Kalbi leader Ibn Bahdal. His reign opened the crisis called the fitna: al-Husayn ibn Ali was killed at Karbala, the people of Medina withdrew their allegiance and a Syrian army fought at al-Harra, and Ibn al-Zubayr was then besieged in Mecca, where the Ka'ba was damaged by fire. The Encyclopaedia of Islam says the traditional narrative is generally hostile to him, that modern scholars read it differently, and that the evidence may not allow a judgement of his ability or character."
  ur: "یزید بن معاویہ بن ابی سفیان، بنو امیہ کے دوسرے خلیفہ، نے 60 سے 64ھ/680 سے 683ء تک حکومت کی، جب ان کے والد معاویہ نے انھیں جانشین مقرر کیا۔ ان کی والدہ میسون کلبی سردار ابن بحدل کی بہن تھیں۔ ان کے عہد میں فتنہ کا بحران شروع ہوا: حسین بن علی کربلا میں قتل ہوئے، اہلِ مدینہ نے بیعت توڑ دی اور شامی فوج سے حرہ میں معرکہ ہوا، پھر مکہ میں ابن زبیر کا محاصرہ ہوا اور کعبہ کو آگ سے نقصان پہنچا۔ اسلامی دائرۃ المعارف کہتا ہے کہ روایتی بیان عموماً ان کے خلاف ہے، جدید محققین اسے مختلف طرح پڑھتے ہیں، اور دستیاب شواہد شاید ان کی قابلیت یا شخصیت پر فیصلے کی اجازت نہ دیں۔"
