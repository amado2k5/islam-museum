summary:
  ar: "\u0645\u0646\u0634\u062f \u0648\u0645\u062f\u0651\u0627\u062d \u0645\u0635\u0631\u064a \u0643\u0641\u064a\u0641 \u0645\u0646 \u0623\u0633\u0648\u0627\u0646 (1939\u20132015)\u060c \u062e\u0631\u0651\u064a\u062c \u0623\u0635\u0648\u0644 \u0627\u0644\u062f\u064a\u0646 \u0628\u0627\u0644\u0623\u0632\u0647\u0631\u060c \u0627\u0633\u062a\u0642\u0631 \u0641\u064a \u0627\u0644\u062f\u064a\u0631 \u0628\u0625\u0633\u0646\u0627\u060c \u0648\u0639\u064f\u0631\u0641 \u0628\u0631\u0627\u0648\u064a\u0629 \u0627\u0644\u062a\u0631\u0627\u062b \u0627\u0644\u0634\u0639\u0628\u064a \u0627\u0644\u0635\u0639\u064a\u062f\u064a: \u0627\u0644\u0645\u062f\u064a\u062d \u0627\u0644\u0646\u0628\u0648\u064a \u0648\u0627\u0644\u0645\u0648\u0627\u0644 \u0648\u0642\u0635\u0635 \u0627\u0644\u0623\u0646\u0628\u064a\u0627\u0621\u060c \u0648\u0643\u0627\u0646 \u062e\u0627\u0644 \u0627\u0644\u0645\u0646\u0634\u062f \u0645\u062d\u0645\u062f \u0627\u0644\u0639\u062c\u0648\u0632 \u0648\u0634\u0631\u064a\u0643\u0647\u060c \u0648\u0623\u062d\u064a\u0627 \u0643\u0630\u0644\u0643 \u0644\u064a\u0627\u0644\u064a \u0642\u0628\u0637\u064a\u0629 \u0648\u0623\u0646\u0634\u062f \u0641\u064a \u0645\u0648\u0644\u062f \u0627\u0644\u0639\u0630\u0631\u0627\u0621 \u0628\u0623\u0633\u064a\u0648\u0637."
  en: "Blind Egyptian munshid and praise singer from Aswan (1939\u20132015), a graduate in theology from al-Azhar, who settled at al-Dayr near Esna and was known as a bearer of Upper Egyptian folk heritage \u2014 praise of the Prophet, the mawwal and stories of the prophets; uncle and partner of the munshid Muhammad al-Agouz, he also sang at Coptic nights and at the Virgin's mawlid in Asyut."
  ur: "\u0627\u0633\u0648\u0627\u0646 \u06a9\u06d2 \u0646\u0627\u0628\u06cc\u0646\u0627 \u0645\u0635\u0631\u06cc \u0645\u0646\u0634\u062f \u0627\u0648\u0631 \u0645\u062f\u0627\u062d \u2066(1939\u0621\u20132015\u0621)\u2069\u060c \u0627\u0632\u06c1\u0631 \u0633\u06d2 \u0627\u0635\u0648\u0644\u0650 \u062f\u06cc\u0646 \u06a9\u06d2 \u0641\u0627\u0636\u0644\u060c \u062c\u0648 \u0627\u0633\u0646\u0627 \u06a9\u06d2 \u0642\u0631\u06cc\u0628 \u0627\u0644\u062f\u06cc\u0631 \u0645\u06cc\u06ba \u0628\u0633 \u06af\u0626\u06d2 \u0627\u0648\u0631 \u0628\u0627\u0644\u0627\u0626\u06cc \u0645\u0635\u0631 \u06a9\u06d2 \u0644\u0648\u06a9 \u0648\u0631\u062b\u06d2 \u2014 \u0646\u0639\u062a\u0650 \u0646\u0628\u0648\u06cc\u060c \u0645\u0648\u0627\u0644 \u0627\u0648\u0631 \u0642\u0635\u0635\u0650 \u0627\u0646\u0628\u06cc\u0627 \u2014 \u06a9\u06d2 \u0631\u0627\u0648\u06cc \u06a9\u06d2 \u0637\u0648\u0631 \u067e\u0631 \u0645\u0639\u0631\u0648\u0641 \u06c1\u0648\u0626\u06d2\u061b \u0645\u0646\u0634\u062f \u0645\u062d\u0645\u062f \u0627\u0644\u0639\u062c\u0648\u0632 \u06a9\u06d2 \u0645\u0627\u0645\u0648\u06ba \u0627\u0648\u0631 \u0634\u0631\u06cc\u06a9\u060c \u0627\u0646\u06be\u0648\u06ba \u0646\u06d2 \u0642\u0628\u0637\u06cc \u0645\u062d\u0627\u0641\u0644 \u0627\u0648\u0631 \u0627\u0633\u06cc\u0648\u0637 \u0645\u06cc\u06ba \u0645\u0648\u0644\u062f\u0650 \u0645\u0631\u06cc\u0645 \u0645\u06cc\u06ba \u0628\u06be\u06cc \u06af\u0627\u06cc\u0627\u06d4"
