summary:
  ar: "منشد ومدّاح مصري كفيف من أسوان (1939–2015)، خرّيج أصول الدين بالأزهر، استقر في الدير بإسنا، وعُرف براوية التراث الشعبي الصعيدي: المديح النبوي والموال وقصص الأنبياء، وكان خال المنشد محمد العجوز وشريكه، وأحيا كذلك ليالي قبطية وأنشد في مولد العذراء بأسيوط."
  en: "Blind Egyptian munshid and praise singer from Aswan (1939–2015), a graduate in theology from al-Azhar, who settled at al-Dayr near Esna and was known as a bearer of Upper Egyptian folk heritage — praise of the Prophet, the mawwal and stories of the prophets; uncle and partner of the munshid Muhammad al-Agouz, he also sang at Coptic nights and at the Virgin's mawlid in Asyut."
  ur: "اسوان کے نابینا مصری منشد اور مداح ⁦(1939ء–2015ء)⁩، ازہر سے اصولِ دین کے فاضل، جو اسنا کے قریب الدیر میں بس گئے اور بالائی مصر کے لوک ورثے — نعتِ نبوی، موال اور قصصِ انبیا — کے راوی کے طور پر معروف ہوئے؛ منشد محمد العجوز کے ماموں اور شریک، انھوں نے قبطی محافل اور اسیوط میں مولدِ مریم میں بھی گایا۔"
