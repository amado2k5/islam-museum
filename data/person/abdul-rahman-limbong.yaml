id: person/abdul-rahman-limbong
class: person
label:
  ar: "عبد الرحمن ليمبونغ"
  en: "Abdul Rahman Limbong"
  ur: "حاجی عبد الرحمان لمبونگ"
summary:
  ar: "عالم ملايوي من ترنغانو (1868–1929)، عُرف بحاجي عبد الرحمن ليمبونغ من تعليمه وتجارته في ليمبونغ بكيمامان. قاد مقاومة قوانين الأراضي البريطانية في ترنغانو، ومثّل المزارعين في محاكمتهم سنة 1922 وترأّس انتفاضة أيار 1928؛ نُفي إلى مكة وتوفي فيها سنة 1929."
  en: "Malay ulama of Terengganu (1868–1929), known as Haji Abdul Rahman Limbong from his teaching and trading at Limbong, Kemaman. He led the resistance to British land laws in Terengganu, represented farmers on trial in 1922 and headed the rising of May 1928; exiled to Mecca, he died there in 1929."
  ur: "تیرنگانو کے مالے عالم (1868ء–1929ء)، جو لمبونگ، کیمامان میں اپنی تعلیم و تجارت کی وجہ سے حاجی عبد الرحمان لمبونگ کے نام سے مشہور ہوئے۔ انہوں نے تیرنگانو میں برطانوی اراضی قوانین کے خلاف مزاحمت کی قیادت کی، 1922ء میں کسانوں کے مقدمے میں ان کی نمائندگی کی اور مئی 1928ء کی بغاوت کی سربراہی کی؛ مکہ جلاوطن کیے گئے اور 1929ء میں وہیں وفات پائی۔"
