id: person/ibn-al-dahhak-rebel-at-khiwan-286
class: person
label:
  ar: ابن الضحاك، خصم أبي القاسم ليلة خيوان
  en: Ibn al-Dahhak, who fought Abu al-Qasim on the night at Khiwan
  ur: ابن ضحاک، جس نے خیوان کی رات ابو القاسم سے لڑائی کی
summary:
  ar: رجل ذكره الكتاب بـ«ابن الضحاك» هجم على أبي القاسم ليلة خيوان وهزم قائده، ثم طلبه الهادي بالغبيب فلم يأته وأقام في بلد بني معمر.
  en: A man the book calls "Ibn al-Dahhak", who attacked Abu al-Qasim on the night at Khiwan and routed his commander; al-Hadi sought him at al-Ghubayb, and he did not come but stayed in the land of Banu Ma'mar.
  ur: کتاب جسے «ابن ضحاک» کہتی ہے؛ اس نے خیوان کی رات ابو القاسم پر حملہ کیا اور ان کے سالار کو شکست دی؛ ہادی نے غبیب میں اسے ڈھونڈا مگر وہ نہ آیا اور بنو معمر کی سرزمین میں رہا۔
