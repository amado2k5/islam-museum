summary:
  ar: "تقي الدين الشمني القسطنطيني؛ ولد بالإسكندرية في رمضان سنة إحدى وثمانمائة وقدم القاهرة مع والده وكان من علماء المالكية فتلا على الزراتيتي وأخذ عن الشمس الشطنوفي ولازم القاضي شمس الدين البساطي وانتفع به في الأصلين والمعاني والبيان وأخذ الحديث عن الولي العراقي، قال السيوطي في بغية الوعاة: هو شيخنا الإمام العلامة المفسر المحدث الأصولي المتكلم النحوي البياني، إمام النحاة في زمانه وشيخ العلماء في أوانه، وأثنى عليه بالقصيدة الشهيرة «هو البحر لا بل دون ما علمه البحر»، وخرج له صاحب الشذرات الشمس السخاوي مشيخة وحدث بها، وأقام بالجمالية ثم ولى المشيخة والخطابة بتربة قايتباي الجركسي بقرب الجبل وطلب لقضاء الحنفية بالقاهرة سنة ثمان وستين فامتنع، وصنف شرح المغني لابن هشام وحاشية على الشفا وشرح مختصر الوقاية في الفقه وشرح نظم النخبة في الحديث، ولم يزل الشيخ يودني ويحبني ويعظمني قال ابن العماد، توفي قرب العشاء ليلة الأحد سابع عشري ذي الحجة سنة اثنتين وسبعين وثمانمائة {cite:shadharat-dhahab p. 313-314}."
  en: "Al-Shamni (b. Alexandria Ramadan 801) — al-Suyuti's own shaykh, praised in the Bughya as 'imam of the grammarians of his age' in every field; companion of al-Bisati and al-'Iraqi; refused the Cairo Hanafi qadiship in 868; author of sharh al-Mughni of Ibn Hisham and sharh Nazm al-Nukhba; died near nightfall Sunday 17 Dhu'l-Hijja 872 {cite:shadharat-dhahab p. 313-314}."
  fr: "Al-Shamni (b Alexandrie Ramadan 801) – le cheikh d’al-Suyuti, loué dans le Bughya comme « l’imam des grammairiens de son âge  » dans tous les domaines  ; compagnon d'al-Bisati et al-'Iraqi ; a refusé la qadiship Hanafi du Caire en 868 ; auteur de sharh al-Mughni d'Ibn Hisham et sharh Nazm al-Nukhba ; est mort près de la nuit dimanche 17 Dhu'l-Hijja 872 {cite:shadharat-dhahab p. 313-314}."
  es: "Al-Shamni (n. Alejandría, Ramadán 801) — el propio shaykh de al-Suyuti, elogiado en el Bughya como 'imán de los gramáticos de su época' en todos los campos; compañero de al-Bisati y al-'Iraqi; rechazó el cadí hanafí de El Cairo en 868; autor de Sharh al-Mughni de Ibn Hisham y Sharh Nazm al-Nukhba; murió cerca del anochecer del domingo 17 de Dhu'l-Hijja 872 {cite:shadharat-dhahab p. 313-314}."
  ur: "الشمنی ⁦(پیدائش اسکندریہ رمضان 801)⁩ - السیوطی کے اپنے شیخ نے، بغیہ میں ہر میدان میں 'اپنے زمانے کے گرامر کے امام' کے طور پر تعریف کی ہے۔ البصاتی اور العراقی کے ساتھی؛ قاہرہ حنفی نے 868 میں قادیانیت سے انکار کیا۔ ابن ہشام کی شرح المغنی اور شرح ناظم النخبہ کے مصنف؛ آپ کا انتقال اتوار 17 ذی الحجہ 872 کو رات کے وقت ہوا۔ 313-314}۔"
  tr: "Taqi al-Din al-Shamni al-Constantini; Ramazan ayında 801 Hicri yılında İskenderiye'de doğdu. Babasıyla birlikte Kahire'ye geldi ve Maliki alimleri arasındaydı. El-Zeretiti'nin yanında eğitim aldı, El-Şems el-Şatnufi'nin yanında eğitim aldı, El-Şemseddin el-Basati'nin yanında eğitim aldı ve iki kaynak, anlam ve retorik açısından ondan faydalandı, Iraklı azizden hadis öğrendi. El-Süyuti Bughiyat al-Wu'at'ta şöyle demiştir: O bizim şeyhimiz, seçkin imamımız, tersmeci, hadis âlimi, usuli âlim, ilahiyatçı, dilbilgici ve retorik âlim, zamanının önde gelen dilbilgicisi ve zamanının alimlerinin şeyhidir. Onu ünlü şiiriyle övdü: \"O denizdir, ne bile değil Ona denizi öğretti.\" Şederat el-Şems el-Sakhavi'nin yazarı şeyh oldu ve orada konuşmalar yaptı. Cemaliye'de ikamet etti, ardından dağ yakınındaki Kaitbay el-Cerrahisi türbesinde şeyhlik ve vaiz oldu. 1968'de Kahire'de Hanefi yargıtlığına başvurdu ancak reddetti. İbn Hişam'ın el-Mughni üzerine bir şerh, el-Şifa üzerine bir kenar şerhi, Mukhtasar al-Wiqayah fi al-Fiqh üzerine bir şerh ve el-Nühbe'nin hadis şiiri üzerine bir şerh yazdı. Şeyh her zaman beni sevdi, sevdi ve onurlandırdı. İbn el-İmad, 872 Hicce yılının on yedinci Zuli gecesi İsha gecesi yakınlarında öldüğünü söyledi {atıf: şadharat-dhahab, s. 313-314}."
  id: "Taqi al-Din al-Shamni al-Constantini; ia lahir di Alexandria pada bulan Ramadan tahun 801 H. Ia datang ke Kairo bersama ayahnya dan termasuk di antara ulama Maliki. Ia belajar di bawah al-Zaratiti, belajar di bawah Al-Shams al-Shatnufi, belajar di bawah Al-Shams al-Din al-Basati, dan mendapat manfaat darinya dalam dua sumber, makna, dan retorika, serta mempelajari hadis dari wali Irak tersebut. Al-Suyuti berkata dalam Bughiyat al-Wu'at: Ia adalah sheikh kita, imam terkemuka, penafsir, ulama hadits, ulama usuli, ahli tata bahasa dan retorika teologi, tata bahasa terkemuka pada zamannya dan sheikh para ulama di zamannya. Ia memujinya dengan puisi terkenal: \"Itu adalah laut, bahkan bukan apa Dia mengajarinya tentang laut.\" Penulis Al-Shadharat al-Shams al-Sakhawi menjadi seorang sheikh dan berbicara di sana. Dia tinggal di Al-Jamaliyah, kemudian menjabat sebagai sheikh dan pengkhotbah di makam Qaitbay al-Jarkasi dekat gunung. Dia mengajukan permohonan untuk menjadi hakim Hanafi di Kairo pada tahun 1968 tetapi menolak. Dia menulis komentar tentang al-Mughni oleh Ibn Hisham, sebuah marginalia tentang al-Shifa, komentar tentang Mukhtasar al-Wiqayah fi al-Fiqh, dan komentar atas puisi al-Nukhba dalam hadis. Sheikh selalu mencintaiku, mencintaiku, dan menghormatiku. Ibn al-Imad berkata, dia meninggal dekat malam Isha pada hari Minggu, tanggal tujuh belas Dhu al-Hijjah, tahun 872 H {cite:shadharat-dhahab, hlm. 313-314}."
