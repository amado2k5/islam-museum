summary:
  ar: "تقي الدين الشمني القسطنطيني؛ ولد بالإسكندرية في رمضان سنة إحدى وثمانمائة وقدم القاهرة مع والده وكان من علماء المالكية فتلا على الزراتيتي وأخذ عن الشمس الشطنوفي ولازم القاضي شمس الدين البساطي وانتفع به في الأصلين والمعاني والبيان وأخذ الحديث عن الولي العراقي، قال السيوطي في بغية الوعاة: هو شيخنا الإمام العلامة المفسر المحدث الأصولي المتكلم النحوي البياني، إمام النحاة في زمانه وشيخ العلماء في أوانه، وأثنى عليه بالقصيدة الشهيرة «هو البحر لا بل دون ما علمه البحر»، وخرج له صاحب الشذرات الشمس السخاوي مشيخة وحدث بها، وأقام بالجمالية ثم ولى المشيخة والخطابة بتربة قايتباي الجركسي بقرب الجبل وطلب لقضاء الحنفية بالقاهرة سنة ثمان وستين فامتنع، وصنف شرح المغني لابن هشام وحاشية على الشفا وشرح مختصر الوقاية في الفقه وشرح نظم النخبة في الحديث، ولم يزل الشيخ يودني ويحبني ويعظمني قال ابن العماد، توفي قرب العشاء ليلة الأحد سابع عشري ذي الحجة سنة اثنتين وسبعين وثمانمائة {cite:shadharat-dhahab p. 313-314}."
  en: "Al-Shamni (b. Alexandria Ramadan 801) — al-Suyuti's own shaykh, praised in the Bughya as 'imam of the grammarians of his age' in every field; companion of al-Bisati and al-'Iraqi; refused the Cairo Hanafi qadiship in 868; author of sharh al-Mughni of Ibn Hisham and sharh Nazm al-Nukhba; died near nightfall Sunday 17 Dhu'l-Hijja 872 {cite:shadharat-dhahab p. 313-314}."
