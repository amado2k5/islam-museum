summary:
  ar: "ربيعة بن كعب الأسلمي، صحابي من بني أسلم من أهل الصفة، لزم خدمة النبي نهاره وبات على بابه ليله، وسأله أن يدعو له بمرافقته في الجنة فقال له: أعني على نفسك بكثرة السجود؛ وزوّجه النبي وجمع له قومه مهره ووليمته، ومنحه أرضاً إلى جانب أرض أبي بكر، كما يرويه عبد الرحمن رأفت الباشا في «صور من حياة الصحابة»."
  en: "Rabi'a ibn Ka'b al-Aslami, a Companion of Banu Aslam among the people of the Suffa, who served the Prophet by day and slept at his door by night; when he asked the Prophet to pray that he be his companion in Paradise, the Prophet told him to help him by much prostration. The Prophet arranged his marriage, had his clan gather the dowry and wedding feast, and granted him land next to Abu Bakr's, as Abd al-Rahman Ra'fat al-Basha retells in Suwar min Hayat al-Sahaba."
