id: person/pecevi-ibrahim
class: person
label:
  ar: "إبراهيم أفندي البجوي (بتشوي)"
  en: "İbrahim Peçevi"
  ur: "ابراہیم پیچوی"
summary:
  ar: "إبراهيم أفندي البجوي (Peçuylu) المعروف بـ«بتشوي»؛ تخرّج في المالية وخدم حسابياً في الجيش، فصار دفتردار الكور الثاني سنة ١٠١٤هـ/١٦٠٥م ثم دفتردار البوسنة فتوفي بها؛ يصفه «سجلي عثماني» بأنه كان ذا رأي وحزم وقد «كتب تاريخاً ممتازاً» — تاريخ بتشوي المعروف {cite:sicill-i-osmani vol. 3, 'İbrahim Efendi Peçuylu'}."
  en: "İbrahim Efendi of Pečuj, known as Peçevi; finance-service trained, he served in the army's accounts, became defterdar of the second fiscal district in 1014/1605–06 then defterdar of Bosnia, where he died; the Sicill-i Osmani calls him 'a man of resolve and wise counsel' who 'wrote an excellent History' — the well-known Tarih-i Peçevi {cite:sicill-i-osmani vol. 3, 'İbrahim Efendi Peçuylu'}."
  ur: "ابراہیم پیچوی؛ مالیہ کے شعبے سے نکلا اور فوج میں حساب کے مناصب پر رہا، سنہ ١٠١٤ھ/١٦٠٥ء میں دوم مالیاتی ضلعے کا دفتردار بنا اور پھر بوسنہ کا دفتردار ہوا جہاں وفات پائی؛ سجلی عثمانی اسے صاحب تدبیر کہتا ہے جس نے «ایک عمدہ تاریخ لکھی» — مشہور تاریخِ پیچوی {cite:sicill-i-osmani vol. 3, 'İbrahim Efendi Peçuylu'}."
