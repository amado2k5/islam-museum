id: person/pecevi-ibrahim
class: person
label:
  ar: "إبراهيم أفندي البجوي ⁦(بتشوي)⁩"
  en: "İbrahim Peçevi"
  ur: "ابراہیم پیچوی"
  es: "İbrahim Peçevi"
  fr: "İbrahim Peçevi"
summary:
  ar: "إبراهيم أفندي البجوي (Peçuylu) المعروف بـ«بتشوي»؛ تخرّج في المالية وخدم حسابياً في الجيش، فصار دفتردار الكور الثاني سنة ١٠١٤هـ/١٦٠٥م ثم دفتردار البوسنة فتوفي بها؛ يصفه «سجلي عثماني» بأنه كان ذا رأي وحزم وقد «كتب تاريخاً ممتازاً» — تاريخ بتشوي المعروف {cite:sicill-i-osmani vol. 3, 'İbrahim Efendi Peçuylu'}."
  en: "İbrahim Efendi of Pečuj, known as Peçevi; finance-service trained, he served in the army's accounts, became defterdar of the second fiscal district in 1014/1605–06 then defterdar of Bosnia, where he died; the Sicill-i Osmani calls him 'a man of resolve and wise counsel' who 'wrote an excellent History' — the well-known Tarih-i Peçevi {cite:sicill-i-osmani vol. 3, 'İbrahim Efendi Peçuylu'}."
  ur: "ابراہیم پیچوی؛ مالیہ کے شعبے سے نکلا اور فوج میں حساب کے مناصب پر رہا، سنہ ١٠١٤ھ/١٦٠٥ء میں دوم مالیاتی ضلعے کا دفتردار بنا اور پھر بوسنہ کا دفتردار ہوا جہاں وفات پائی؛ سجلی عثمانی اسے صاحب تدبیر کہتا ہے جس نے «ایک عمدہ تاریخ لکھی» — مشہور تاریخِ پیچوی {cite:sicill-i-osmani vol. 3, 'İbrahim Efendi Peçuylu'}."
  es: "İbrahim Efendi de Pečuj, conocido como Peçevi; formado en el servicio financiero, sirvió en las cuentas del ejército, se convirtió en defterdar del segundo distrito fiscal en 1014/1605–06 y luego en defterdar de Bosnia, donde murió; el Sicill-i Osmani lo llama 'un hombre de resolución y sabio consejo' que 'escribió una excelente Historia' — el conocido Tarih-i Peçevi {cite:sicill-i-osmani vol. 3, 'İbrahim Efendi Peçuylu'}."
  fr: "İbrahim Efendi de Pečuj, connu sous le nom de Peçevi; formé aux services financiers, il travailla dans les comptes de l'armée, devint defterdar du deuxième district fiscal en 1014/1605-06 puis defterdar de Bosnie, où il mourut; le Sicill-i Osmani le décrit comme « un homme résolu et de sages conseils » qui « a écrit une excellente Histoire » — le célèbre Tarih-i Peçevi {cite: sicill-i-osmani vol. 3, « İbrahim Efendi Peçuylu »}."
  tr: "İbrahim Efendi Peçuylu, 'Petchoy' olarak bilinir; finans bölümünden mezun oldu ve orduda görev yaptı, 1014 H/1605 M.S.'de ikinci Kafrdar oldu, ardından Peçuylu'da öldü; Osmanlı Sağildi' onu görüş ve kararlılığa sahip ve 'mükemmel bir tarih yazmış' olarak tanımlar — Peçuylu Tarihi {atıf:sicill-i-osmani cilt 3, 'İbrahim Efendi Peçuylu'}."
  id: "Ibrahim Effendi Peçuylu, dikenal sebagai 'Petchoy'; ia lulus di bidang keuangan dan bertugas di militer, menjadi Kafrdar kedua pada tahun 1014 H/1605 M, kemudian menjadi Peçuylu, tempat ia meninggal; Sagildi Ottoman menggambarkannya sebagai seseorang yang memiliki pendapat dan ketegasan serta telah 'menulis sejarah yang sangat baik' — Sejarah Peçuylu {cite:sicill-i-osmani vol. 3, 'İbrahim Efendi Peçuylu'}."
