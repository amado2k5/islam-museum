summary:
  ar: "شاعر كوفي ظريف، اشتهر بالزندقة في الأخبار، وتنقل بين الوليد بن يزيد وغيره، وفي الباب أخبار مع المغنين. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 56}"
  en: "A witty Kufan poet with a reputation for heresy in the anecdotes; he moved between patrons, including al-Walid ibn Yazid, and the section includes his dealings with singers. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 56}"
  ur: "کوفہ کے ایک ظریف شاعر جن کی زندقہ کی شہرت مشہور ہے؛ انہوں نے ولید بن یزید سمیت کئی سرپرستوں کا ساتھ دیا۔ {cite:nihayat-al-arab-nuwayri-vol4-scan p. 56}"
  es: "Un ingenioso poeta de Kufa con fama de hereje según las anécdotas; tuvo varios mecenas, entre ellos al-Walid ibn Yazid, y la sección incluye sus tratos con los cantantes. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 56}"
  fr: "Poète spirituel de Koufa, réputé pour ses anecdotes hérétiques; il changea de mécène, notamment d’al-Walid ibn Yazid, et cette section relate ses relations avec des chanteurs. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 56}"
  tr: "Haberlerdeki sapkınlığıyla tanınan esprili bir Kufan şairi olan Sculi, Al-Walid ibn Yazid ile diğerleri arasında gidip gelir ve bölümde şarkıcılarla hikayeler paylaşır. {Kaynak:nihayat-al-arab-nuwayri-cilt s. 56}"
  id: "Seorang penyair Kufan yang cerdas, terkenal karena bidaahnya dalam laporan, ia berpindah antara Al-Walid ibn Yazid dan lainnya, dan dalam bab itu ia berbagi cerita dengan para penyanyi. {cite:nihayat-al-arab-nuwayri-vol4-scan hlm. 56}"
