summary:
  ar: "صحابي تميمي حنظلي، حليف قريش، ويعرف بيعلى بن منية؛ شهد حنيناً والطائف وتبوك، واستعمله أبو بكر على حلوان وعمر على بعض اليمن وعثمان على صنعاء، وخرج مع عائشة في وقعة الجمل ثم شهد صفين مع علي، ويقال إنه قتل بها."
  en: "A Tamimi Hanzali Companion, an ally of Quraysh, also called Ya'la ibn Muniya; he witnessed Hunayn, al-Ta'if and Tabuk. Abu Bakr appointed him over Hulwan, Umar over part of Yemen and Uthman over San'a'; he went out with A'isha at the Camel, then fought at Siffin with Ali, where he is said to have been killed."
