roles: [companion]
summary:
  ar: "صحابي تميمي حنظلي، حليف قريش، ويعرف بيعلى بن منية؛ شهد حنيناً والطائف وتبوك، واستعمله أبو بكر على حلوان وعمر على بعض اليمن وعثمان على صنعاء، وخرج مع عائشة في وقعة الجمل ثم شهد صفين مع علي، ويقال إنه قتل بها."
  en: "A Tamimi Hanzali Companion, an ally of Quraysh, also called Ya'la ibn Muniya; he witnessed Hunayn, al-Ta'if and Tabuk. Abu Bakr appointed him over Hulwan, Umar over part of Yemen and Uthman over San'a'; he went out with A'isha at the Camel, then fought at Siffin with Ali, where he is said to have been killed."
  ur: "تمیمی حنظلی صحابی، قریش کا حلیف، یعلا بن منیہ بھی کہلاتا؛ حنین، طائف اور تبوک میں شریک رہا؛ ابو بکر نے اسے ایک عہدے پر مقرر کیا۔"
  es: "Un compañero de Tamimi Hanzali, aliado de Quraysh, también llamado Ya'la ibn Muniya; fue testigo de Hunayn, al-Ta'if y Tabuk. Abu Bakr lo designó al mando de Hulwan, a Umar al mando de parte de Yemen y a Uthman al mando de Sana'; salió con Aisha en Camello y luego luchó en Siffin con Ali, donde se dice que murió."
  fr: "Compagnon de l'école Tamimi Hanzali et allié des Qurayshites, également appelé Ya'la ibn Muniya, il fut témoin des batailles de Hunayn, al-Ta'if et Tabuk. Abou Bakr le nomma gouverneur de Hulwan, Umar gouverneur d'une partie du Yémen et Uthman gouverneur de Sanaa. Il partit avec Aïcha à la bataille du Chameau, puis combattit à Siffin aux côtés d'Ali, où il aurait trouvé la mort."
