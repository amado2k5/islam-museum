summary:
  ar: "معلّم وإمام أمريكي؛ نال البكالوريوس في تدريس الإنجليزية والدراسات الدينية من جامعة إلينوي في شيكاغو، ويعمل منذ سنة 2009 مديرا للشباب وإماما مساعدا ومرشدا دينيا للمسلمين بدوام كامل؛ أكمل برنامج شهادة الإمامة في مكة، وتخرج في معهد قلم سنة 2014 تحت عبد الناصر جانغدا، ثم انتقل إلى دالاس حيث يدير «روتس كوميونيتي سبيس» في إيرفينغ ويدرّس في معهد قلم، وتُبث محاضراته في سلسلة «مسلم سنترال» الصوتية."
  en: "American Muslim teacher and imam: he took a bachelor's degree in the Teaching of English and Religious Studies at the University of Illinois at Chicago and has served full-time as a youth director, Muslim chaplain and assistant imam since 2009; he completed an Imam Certificate Program in Makkah and graduated from the Qalam Seminary in May 2014 under AbdulNasir Jangda, then moved to Dallas, where he directs the Roots Community Space in Irving and teaches at the Qalam Institute; his lectures are carried in Muslim Central's podcast series."
  ur: "امریکی مسلم استاد و امام؛ انہوں نے یونیورسٹی آف الینوائے شکاگو سے انگریزی کی تدریس اور مذہبی مطالعات میں بیچلر کیا اور 2009 سے نوجوانوں کے ڈائریکٹر، مسلم چیپلن اور معاون امام کے طور پر کل وقتی خدمات انجام دے رہے ہیں؛ انہوں نے مکہ میں امام سرٹیفکیٹ پروگرام مکمل کیا اور مئی 2014 میں عبد الناصر جانگڈا کے زیرِ تربیت قلم سیمینری سے فارغ ہوئے، پھر ڈیلاس منتقل ہوئے جہاں وہ ارونگ میں «روٹس کمیونٹی اسپیس» کے ڈائریکٹر اور قلم انسٹی ٹیوٹ میں استاد ہیں؛ ان کے خطبات «مسلم سینٹرل» کی پوڈکاسٹ سیریز میں نشر ہوتے ہیں۔"
