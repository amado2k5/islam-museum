summary:
  ar: "شاعر وكاتب ومسرحي تركي (1904–1983)، من أبرز منظّري التيار الإسلامي في تركيا الحديثة. اشتهر بديوانه «الأرصفة» وبمجلته «الشرق الكبير» (بويوك دوغو) التي أصدرها من 1943، وبأطروحته في «الإسلامة من الأعلى»، وأثّرت كتاباته في أجيال من الإسلاميين الأتراك."
  en: "Turkish poet, novelist and playwright (1904–1983), a leading ideologue of the Islamist current in modern Turkey. He is known for his poetry collection Pavements (Kaldırımlar), for the magazine Büyük Doğu (Great East) he published from 1943, and for his doctrine of 'Islamisation from above'; his writings influenced generations of Turkish Islamists."
  ur: "ترک شاعر، ناول نگار اور ڈراما نویس (1904–1983)، جدید ترکی میں اسلامی رجحان کے نمایاں نظریہ ساز۔ اپنے شعری مجموعے «قالدریملار» (فٹ پاتھ)، 1943 سے جاری کردہ مجلہ «بویوک دوغو» (مشرقِ عظیم) اور «اوپر سے اسلام کاری» کے نظریے کے لیے معروف؛ ان کی تحریروں نے ترک اسلام پسندوں کی نسلوں کو متاثر کیا۔"
