summary:
  ar: "مغنّي راب ومنتج أمريكي، وُلد باسم جيسون دوغلاس نيومان في ماديسون بولاية ويسكونسن سنة 1977، ونشأ في مينيابوليس. اعتنق الإسلام في الخامسة عشرة من عمره، وأصدر ألبومات منها «الحقيقة المطلقة» (2007) و«نحن» (2009) و«حداد في أمريكا وحلم ملوّن» (2012) ضمن جماعة رايمسايرز، ويُعرف بنشاطه المناصر لفلسطين."
  en: "American rapper and producer, born Jason Douglas Newman in Madison, Wisconsin, in 1977 and raised in Minneapolis. He converted to Islam at the age of 15, released albums including The Undisputed Truth (2007), Us (2009) and Mourning in America and Dreaming in Color (2012) with the Rhymesayers collective, and is known for his advocacy for Palestinian liberation."
  ur: "امریکی ریپر و پروڈیوسر، جو 1977 میں میڈیسن، وسکونسن میں جیسن ڈگلس نیومین کے نام سے پیدا ہوئے اور منیاپولس میں پلے بڑھے۔ انہوں نے پندرہ سال کی عمر میں اسلام قبول کیا، رائم سیئرز جماعت کے ساتھ «دی ان ڈسپیوٹڈ ٹرتھ» (2007)، «اَس» (2009) اور «مورننگ ان امریکا اینڈ ڈریمنگ ان کلر» (2012) جیسے البم جاری کیے، اور فلسطین کی حمایت میں اپنی سرگرمی کے لیے معروف ہیں۔"
