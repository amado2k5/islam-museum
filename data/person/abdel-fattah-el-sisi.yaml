summary:
  ar: "عبد الفتاح السيسي (وُلد في 19 نوفمبر 1954)، ضابط وسياسي مصري وُلد في حي الجمالية بالقاهرة، وتدرج في الجيش حتى أضحى مديرا للمخابرات الحربية ثم وزيرا للدفاع سنة 2012، وقاد في يوليو 2013 الإطاحة بالرئيس محمد مرسي، ثم انتُخب رئيسا لمصر فتولى المنصب في يونيو 2014 وأعيد انتخابه في 2018 و2023، ويصفه معظم المراقبين المستقلين بأنه حاكم سلطوي يعتمد على الجيش وأجهزة الأمن."
  en: "Abdel Fattah el-Sisi (born 19 November 1954) is an Egyptian officer and politician born in Cairo's Gamaleya district. He rose through the army to direct military intelligence and became defence minister in 2012, led the July 2013 removal of President Mohamed Morsi, and was then elected president of Egypt, taking office in June 2014 and winning re-election in 2018 and 2023; most independent observers describe him as an authoritarian ruler resting on the military and security services."
  ur: "عبدالفتاح السیسی (پیدائش 19 نومبر 1954ء) مصری افسر اور سیاست دان ہیں جو قاہرہ کے محلے الجمالیہ میں پیدا ہوئے۔ وہ فوج میں ترقی پا کر عسکری اطلاعات کے ڈائریکٹر اور 2012ء میں وزیر دفاع بنے، جولائی 2013ء میں صدر محمد مرسی کی برطرفی کی قیادت کی، پھر جون 2014ء میں مصر کے صدر بنے اور 2018ء و 2023ء میں دوبارہ منتخب ہوئے۔"
