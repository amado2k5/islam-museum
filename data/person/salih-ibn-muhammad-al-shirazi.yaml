summary:
  ar: "أبو الفضل الشيرازي، كان يسكن الجانب الشرقي ببغداد وحدّث عن عفان وعلي بن الجعد وخالد بن خداش، روى عنه أبو عمر وابن السماك وأبو بكر الشافعي وكان ثقة مأمونًا قارئًا للقرآن يقول: قد ختمت أربعة آلاف ختمة؛ توفي في شوال سنة ثلاث وثمانين ومائتين {cite:muntazam-ibn-al-jawzi p. 183}."
  en: "Abu'l-Fadl al-Shirazi of East Baghdad, trustworthy transmitter from 'Affan and 'Ali ibn al-Ja'd — and a Quran-reciter who said he had completed the Book four thousand times; he died in Shawwal 283 {cite:muntazam-ibn-al-jawzi p. 183}."
  es: "Abu'l-Fadl al-Shirazi de Bagdad Oriental, transmisor fidedigno de 'Affan y 'Ali ibn al-Ja'd, y recitador del Corán que decía haberlo recitado cuatro mil veces; murió en Shawwal 283 {cite:muntazam-ibn-al-jawzi p. 183}."
  fr: "Abu'l-Fadl al-Shirazi de Bagdad-Est, transmetteur digne de confiance d'Affan et d'Ali ibn al-Ja'd — et un récitateur du Coran qui disait avoir terminé le Livre quatre mille fois; il est mort en Shawwal 283 {cite:muntazam-ibn-al-jawzi p. 183}."
  ur: "مشرقی بغداد کا ابوالفضل الشیرازی، عفان اور علی ابن الجعد کا ثقہ ٹرانسمیٹر - اور ایک قرآن پڑھنے والا جس نے کہا کہ اس نے کتاب کو چار ہزار مرتبہ مکمل کیا ہے۔ آپ کی وفات شوال 283 میں ہوئی۔ 183}۔"
  tr: "Bağdat'ın doğu tarafında yaşayan Ebu el-Fadl el-Şirazi, Affan, Ali ibn al-Ja'd ve Halid bin Khadash'tan rivayet etti. Ebu Ömer, İbn el-Samak ve Ebu Bekir el-Şafii ondan rivayet etti. Güvenilir, güvenilir ve Kur'an okuyan biriydi. Şöyle dedi: Dört bin mühür tamamlandı; iki yüz seksen üçüncü yılda Şavval'da öldü {atıf:Muntazam-ibn-al-Jawzi, s. 183}."
  id: "Abu al-Fadl al-Shirazi, yang tinggal di sisi timur Baghdad, menceritakan dari Affan, Ali ibn al-Ja'd, dan Khalid ibn Khadash. Abu Umar, Ibn al-Samak, dan Abu Bakr al-Shafi'i menceritakan darinya. Ia dapat dipercaya, dapat diandalkan, dan seorang pembaca Al-Qur'an. Ia berkata: Empat ribu segel telah selesai; ia meninggal di Shawwal pada tahun dua ratus delapan puluh tiga {cite:muntazam-ibn-al-jawzi, hlm. 183}."
