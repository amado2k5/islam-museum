summary:
  ar: "إسحاق بن مسلم العقيلي؛ كان في مقدمة سعيد بن عمرو الحرشي إلى أرمينية هو وإخوته، وولّاه مروان بن محمد أرمينية فلم يزل يقاتل مسافراً القصّاب وكان مسافر في قلعة الكلاب بالسيسجان."
  en: "Ishaq ibn Muslim al-Uqayli; he and his brothers rode in Sa'id ibn Amr al-Harashi's vanguard to Armenia, and Marwan ibn Muhammad gave him Armenia, where he fought Musafir al-Qassab without cease while Musafir held Qal'at al-Kilab in Sisajan."
  es: "Ishaq ibn Muslim al-Uqayli; él y sus hermanos cabalgaron en la vanguardia de Sa'id ibn Amr al-Harashi hacia Armenia, y Marwan ibn Muhammad le dio Armenia, donde luchó sin cesar contra Musafir al-Qassab mientras Musafir mantenía Qal'at al-Kilab en Sisajan."
  fr: "Ishaq ibn Muslim al-Uqayli; lui et ses frères chevauchèrent dans l'avant-garde de Sa'id ibn Amr al-Harashi jusqu'en Arménie, et Marwan ibn Muhammad lui donna l'Arménie, où il combattit Musafir al-Qassab sans relâche tandis que Musafir tenait Qal'at al-Kilab à Sisajan."
  ur: "اسحاق بن مسلم العقیلی؛ وہ اور اس کے بھائی سعید بن عمرو الحرشی کے ہراول دستے میں سوار ہوکر آرمینیا گئے، اور مروان ابن محمد نے اسے آرمینیا دے دیا، جہاں اس نے بغیر کسی روک ٹوک کے مسافر القصاب کا مقابلہ کیا جبکہ مسافیر نے سیسجان میں قلات الکلاب پر قبضہ کیا۔"
