summary:
  ar: "أبان بن عثمان بن عفان؛ من فقهاء المدينة وكان عليها يوماً، عاقب من يقطع الدراهم بضرب ثلاثين وطاف به فيمن قطعها ودس فيها المفرغة والزيوف."
  en: "Aban ibn Uthman ibn Affan; a Medinan jurist once its governor, who lashed the dirham-cutter thirty and paraded him — for hollowing and salting with counterfeits."
  fr: "Aban ibn Uthman ibn Affan ; juriste de Médine qui en fut gouverneur, et qui fit donner trente coups de fouet au rogneur de dirhams et le fit promener devant les gens — pour avoir mêlé pièces creuses et fausses monnaies."
  es: "Aban ibn Uthman ibn Affan; un jurista de Medina que fue su gobernador, quien castigó al cortador de dirhams con treinta años de castigo y lo exhibió públicamente, por ahuecar y salar monedas falsificadas."
  ur: "ابان بن عثمان بن عفان؛ ایک مدینے کا فقیہ جو کبھی اس کا گورنر تھا، جس نے درہم کاٹنے والے کو تیس کوڑے مارے اور اس کی پریڈ کی - جعلی چیزوں سے کھوکھلا کرنے اور نمکین کرنے پر۔"
