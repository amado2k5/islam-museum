summary:
  ar: "معلّم وكاتب وناشر أمريكي ⁦(1971 – 11 يوليو 2026)⁩، وُلد جون جوزيف إيميريك في أسرة معمدانية بالغرب الأوسط الأمريكي، واعتنق الإسلام في شتاء 1988–1989 وهو طالب في السنة الأولى بجامعة ولاية ميشيغان بعد نحو ستة أشهر من قراءة القرآن. أسّس دار «أميرة» للنشر سنة 1992، وكتب كتبًا تعريفية بالإسلام ومنها «الدليل الكامل إلى فهم الإسلام»، وعمل نائب مدير مدرسة إسلامية وقاد مؤسسة الإسلام في أمريكا الشمالية."
  en: "American teacher, writer and publisher (1971 – 11 July 2026), born John Joseph Emerick into a Baptist family in the American Midwest. He embraced Islam in the winter of 1988–1989 in his first year at Michigan State University, after about six months of reading the Qur'an. He founded Amirah Publishing in 1992, wrote books introducing Islam, among them the Complete Idiot's Guide to Understanding Islam, served as vice-principal of an Islamic school and led the Islamic Foundation of North America."
  ur: "امریکی استاد، مصنف اور ناشر ⁦(1971 – 11 جولائی 2026)⁩، جو امریکی وسطی مغرب میں ایک بپتسمہ پرست گھرانے میں جان جوزف ایمریک کے نام سے پیدا ہوئے۔ انھوں نے مشی گن اسٹیٹ یونیورسٹی کے پہلے سال میں، تقریباً چھ ماہ قرآن پڑھنے کے بعد، 1988–1989 کے موسمِ سرما میں اسلام قبول کیا۔ انھوں نے 1992 میں امیرہ پبلشنگ قائم کی، اسلام کے تعارف پر کتابیں لکھیں جن میں «کمپلیٹ آئیڈیٹ گائیڈ ٹو انڈرسٹینڈنگ اسلام» شامل ہے، ایک اسلامی اسکول کے وائس پرنسپل رہے اور اسلامک فاؤنڈیشن آف نارتھ امریکا کی قیادت کی۔"
  fr: "Enseignant, écrivain et éditeur américain (1971 – 11 juillet 2026), né John Joseph Emerick dans une famille baptiste du Midwest américain. Il embrassa l'islam durant l'hiver 1988–1989, en première année à la Michigan State University, après environ six mois de lecture du Coran. Il fonda Amirah Publishing en 1992, écrivit des livres d'introduction à l'islam, dont le *Complete Idiot's Guide to Understanding Islam*, fut directeur adjoint d'une école islamique et dirigea l'Islamic Foundation of North America."
  es: "Maestro, escritor y editor estadounidense (1971 – 11 de julio de 2026), nacido John Joseph Emerick en una familia bautista del Medio Oeste de Estados Unidos. Abrazó el islam en el invierno de 1988–1989, en su primer año en la Michigan State University, tras unos seis meses de lectura del Corán. Fundó Amirah Publishing en 1992, escribió libros de introducción al islam, entre ellos *The Complete Idiot's Guide to Understanding Islam*, fue subdirector de una escuela islámica y dirigió la Islamic Foundation of North America."
