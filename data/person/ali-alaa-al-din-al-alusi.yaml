roles: [scholar, qadi]
gender: male
summary:
  ar: "علي بن نعمان بن محمود الآلوسي، علاء الدين، قاض فاضل من أهل بغداد، تخرج بمدرسة القضاة بالآستانة وولي القضاء في عدة مدن وانتخب مبعوثاً عن بغداد، مؤلف «الدر المنتثر في رجال القرن الثاني عشر والثالث عشر»، توفي سنة 1340 هـ."
  en: "Ali ibn Nu'man ibn Mahmud al-Alusi, Ala al-Din, a learned judge of Baghdad, graduate of the school of judges in Istanbul, judge in several towns and deputy for Baghdad in the Ottoman parliament, author of al-Durr al-Muntathir on the scholars of the 12th and 13th centuries AH; died 1340 AH (1921)."
  fr: "Ali ibn Nu'man ibn Mahmud al-Alusi, Ala al-Din, un savant juge de Bagdad, diplômé de l'école des juges à Istanbul, juge dans plusieurs villes et député de Bagdad au parlement ottoman, auteur d'al-Durr al-Muntathir sur les savants des XIIe et XIIIe siècles AH ; 1340 de l’hégire (1921)."
  es: "Ali ibn Nu'man ibn Mahmud al-Alusi, Ala al-Din, un juez erudito de Bagdad, graduado de la escuela de jueces de Estambul, juez en varias ciudades y diputado por Bagdad en el parlamento otomano, autor de al-Durr al-Muntathir sobre los eruditos de los siglos XII y XIII de la Hégira; murió en 1340 de la Hégira (1921)."
  ur: "علی بن نعمان بن محمود الآلوسی، علاء الدین، بغداد کا ایک عالم جج، استنبول میں قاضیوں کے اسکول سے فارغ التحصیل، متعدد قصبوں میں جج اور عثمانی پارلیمنٹ میں بغداد کے لیے نائب، 12ویں اور 12 ویں صدی کے علماء پر الدر المنتظر کے مصنف؛ وفات 1340ھ (1921)"
  tr: "Ali bin Nu'man bin Mahmud Al-Alusi, Alaa al-Din, Bağdat'tan erdemli bir yargıçtı. İstanbul'daki Yargıçlar Okulu'ndan mezun oldu, birkaç şehirde yargıç olarak görev yaptı ve Bağdat'tan temsilci olarak seçildi. \"Al-Durr Al-Muntashar fi Rijal al-Qarn al-Hasan al-Hasani\" (13. ve 13. yüzyıllar) adlı kitabın yazarıdır; 1340 Hicri yılında vefat etti."
  id: "Ali bin Nu'man bin Mahmoud Al-Alusi, Alaa al-Din, adalah seorang hakim yang berbudi luhur dari Baghdad. Ia lulus dari Sekolah Hakim di Istanbul, menjabat sebagai hakim di beberapa kota, dan terpilih sebagai perwakilan dari Baghdad. Ia adalah penulis \"Al-Durr Al-Muntashar fi Rijal al-Qarn al-Hasan al-Hasani\" (abad ke-13 dan ke-13), yang meninggal pada tahun 1340 H."
