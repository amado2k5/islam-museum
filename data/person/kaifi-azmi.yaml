summary:
  ar: "شاعر أردي هندي وكاتب أغانٍ وسيناريو (1919–2002)، وُلد باسم أطهر حسين رضوي في قرية مجوان بمنطقة أعظم كره، انضم إلى الحزب الشيوعي الهندي سنة 1943 وصار من أعلام حركة الكتاب التقدميين، وأدخل الشعر الأردي إلى السينما الهندية بأغانٍ خالدة ومسرحية «هير رانجها» المنظومة كلها شعراً."
  en: "Indian Urdu poet, film lyricist and screenwriter (1919–2002), born Athar Husain Rizvi at Mijwan village in Azamgarh district, who joined the Communist Party of India in 1943, became a leading figure of the Progressive Writers' Movement, and carried Urdu poetry into Hindi cinema, writing the whole dialogue of Heer Raanjha (1970) in verse."
  ur: "بھارتی اردو شاعر، نغمہ نگار اور منظر نویس (1919–2002)، جو ضلع اعظم گڑھ کے گاؤں مجوان میں اطہر حسین رضوی کے نام سے پیدا ہوئے؛ انھوں نے 1943 میں کمیونسٹ پارٹی آف انڈیا میں شمولیت اختیار کی، ترقی پسند مصنفین کی تحریک کے نمایاں رہنما بنے اور اردو شاعری کو بھارتی سنیما تک پہنچایا، یہاں تک کہ «ہیر رانجھا» (1970) کے مکالمے مکمل نظم میں لکھے۔"
