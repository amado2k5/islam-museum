summary:
  ar: "السلطان الحفصي في تونس في عهد خير الدين بربروسة؛ يصفه الصلابي بأنه أساء السيرة في البلاد وقتل عدداً من إخوته حتى اضطربت الأحوال وخرج البعض عن طاعته، وهرب أخوه الأمير الرشيد منه فلجأ إلى خير الدين في الجزائر. وحين دخل خير الدين تونس سنة ١٥٣٤م هرب الحسن إلى أسبانيا، فاستنجد بشارل الخامس الذي أعاد السيطرة الإسبانية على تونس سنة ٩٤٢هـ/١٥٣٥م ونصّبه حاكماً عليها ملزماً بتسليم بونة والمهدية وبتحمل نفقات حامية ألفي جندي إسباني في قلعة حلق الواد {cite:dawlat-uthmaniyya-salabi p. 215-220}."
  en: "The Hafsid sultan of Tunis in Khayr al-Din's day; al-Salabi depicts misrule and fratricide that drove his brother al-Rashid to seek protection in Algiers. Fleeing to Spain at Khayr al-Din's entry in 1534, his appeal brought Charles V's 1535 reconquest — which reinstalled him bound to surrender Bône and Mahdia and to fund a 2,000-man Spanish garrison at La Goulette {cite:dawlat-uthmaniyya-salabi p. 215-220}."
  es: "El sultán hafsí de Túnez en tiempos de Khayr al-Din; al-Salabi describe el mal gobierno y el fratricidio que llevaron a su hermano al-Rashid a buscar protección en Argel. Huyendo a España a la entrada de Khayr al-Din en 1534, su petición propició la reconquista de Carlos V en 1535, que lo reinstaló obligado a entregar Bône y Mahdia y a financiar una guarnición española de 2000 hombres en La Goulette {cite:dawlat-uthmaniyya-salabi p. 215-220}."
  fr: "Le sultan hafside de Tunis à l'époque de Khayr al-Din; al-Salabi décrit la mauvaise gouvernance et le fratricide qui poussèrent son frère al-Rashid à chercher refuge à Alger. Fuyant en Espagne lors de l'entrée en guerre de Khayr al-Din en 1534, son appel entraîna la reconquête de Charles Quint en 1535 — qui le rétablit sur le trône, contraint de céder Bône et Mahdia et de financer une garnison espagnole de 2 000 hommes à La Goulette {cite: dawlat-uthmaniyya-salabi p. 215-220}."
  ur: "خضر الدین کے دور میں تیونس کا حفصید سلطان؛ السلابی نے بدانتظامی اور برادرانہ قتل کی تصویر کشی کی جس نے اپنے بھائی الرشید کو الجزائر میں تحفظ حاصل کرنے پر مجبور کیا۔ 1534 میں خیرالدین کے داخلے پر اسپین فرار ہونے پر، اس کی اپیل نے چارلس پنجم کی 1535 میں فتح حاصل کی - جس نے اسے بون اور مہدیہ کو ہتھیار ڈالنے اور لا گولیٹ میں 2,000 آدمیوں پر مشتمل ہسپانوی گیریژن کو فنڈ دینے کے لیے دوبارہ بحال کیا۔ 215-220}۔"
