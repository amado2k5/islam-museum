summary:
  ar: "السلطان الحفصي في تونس في عهد خير الدين بربروسة؛ يصفه الصلابي بأنه أساء السيرة في البلاد وقتل عدداً من إخوته حتى اضطربت الأحوال وخرج البعض عن طاعته، وهرب أخوه الأمير الرشيد منه فلجأ إلى خير الدين في الجزائر. وحين دخل خير الدين تونس سنة ١٥٣٤م هرب الحسن إلى أسبانيا، فاستنجد بشارل الخامس الذي أعاد السيطرة الإسبانية على تونس سنة ٩٤٢هـ/١٥٣٥م ونصّبه حاكماً عليها ملزماً بتسليم بونة والمهدية وبتحمل نفقات حامية ألفي جندي إسباني في قلعة حلق الواد {cite:dawlat-uthmaniyya-salabi p. 215-220}."
  en: "The Hafsid sultan of Tunis in Khayr al-Din's day; al-Salabi depicts misrule and fratricide that drove his brother al-Rashid to seek protection in Algiers. Fleeing to Spain at Khayr al-Din's entry in 1534, his appeal brought Charles V's 1535 reconquest — which reinstalled him bound to surrender Bône and Mahdia and to fund a 2,000-man Spanish garrison at La Goulette {cite:dawlat-uthmaniyya-salabi p. 215-220}."
