  ar: "داعية وقارئ قرآن سعودي، وُلد في جدة سنة 1983، يعمل إماما في جدة ومدرّس تربية إسلامية فيها، واشتهر بتلاواته ومحاضراته الدعوية، وبمشاركاته المتكررة مع الداعية نايف الصحفي، وتصل تلاواته عبر قناته الرسمية على يوتيوب إلى ملايين المستمعين."
  en: "Saudi preacher and Quran reciter, born in Jeddah in 1983. He serves as an imam in Jeddah and teaches Islamic education there, and became known for his recitations and dawah lectures, his frequent joint appearances with the preacher Nayef Al-Sahfi, and recitation recordings on his official YouTube channel that reach millions of listeners."
