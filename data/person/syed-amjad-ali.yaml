summary:
  ar: "موظف مدني وسياسي باكستاني (1907–1997)، ابن التاجر اللاهوري سيد مراتب علي، خدم في مجلس البنجاب التشريعي والجمعية التأسيسية للهند قبل الاستقلال، ثم كان سفير باكستان لدى الولايات المتحدة (1953–1955) ووزير ماليتها الثالث (1956–1958) ومندوبها الدائم لدى الأمم المتحدة (1964–1967)، وله مؤلفات منها سيرته الذاتية «لمحات» (Glimpses)."
  en: "Pakistani civil servant and politician (1907–1997), the eldest son of the Lahore businessman Sir Syed Maratib Ali, who sat in the Punjab Legislative Assembly and the Constituent Assembly of India before independence, then served as Pakistan's ambassador to the United States (1953–1955), its third minister of finance (1956–1958) and its permanent representative to the United Nations (1964–1967); his books include the autobiography Glimpses (1992)."
  ur: "پاکستانی سرکاری ملازم و سیاست دان (1907ء–1997ء)، لاہور کے تاجر سید مراتب علی کے بڑے بیٹے، جو آزادی سے قبل پنجاب قانون ساز اسمبلی اور مجلس دستور ساز میں رہے، پھر امریکا میں پاکستان کے سفیر (1953ء–1955ء)، تیسرے وزیر خزانہ (1956ء–1958ء) اور اقوام متحدہ میں مستقل نمائندہ (1964ء–1967ء) رہے؛ ان کی کتابوں میں خود نوشت «جھلکیاں» (Glimpses) شامل ہے۔"
