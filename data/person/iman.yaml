summary:
  ar: عارضة أزياء وسيدة أعمال صومالية أمريكية وُلدت في مقديشو سنة 1955؛ اكتشفها المصور بيتر بيرد، وصارت من أشهر عارضات العالم في السبعينيات والثمانينيات، وأسست شركة «إيمان كوزمتكس» لمستحضرات التجميل، وتزوجت
    الموسيقي ديفيد بوي.
  en: Somali-American supermodel and businesswoman born in Mogadishu in 1955; discovered by photographer Peter Beard, she became one of the world's most famous models of the 1970s and 1980s, founded IMAN
    Cosmetics for women of colour, and was married to David Bowie.
  ur: صومالی امریکی سپر ماڈل اور کاروباری خاتون جو 1955 میں موگادیشو میں پیدا ہوئیں؛ فوٹوگرافر پیٹر بیرڈ نے دریافت کیا، 70 اور 80 کی دہائی کی مشہور ترین ماڈل بنیں، رنگین خواتین کے لیے IMAN Cosmetics قائم
    کی اور ڈیوڈ بووی کی شریک حیات رہیں۔
  es: "Supermodelo y empresaria somalí-estadounidense nacida en Mogadiscio en 1955; descubierta por el fotógrafo Peter Beard, se convirtió en una de las modelos más famosas del mundo en las décadas de 1970 y 1980, fundó IMAN Cosmetics para mujeres de color y estuvo casada con David Bowie."
