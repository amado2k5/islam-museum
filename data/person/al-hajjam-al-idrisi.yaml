id: person/al-hajjam-al-idrisi
class: person
label:
  ar: الحسن بن محمد الإدريسي الحجّام
  en: al-Hasan ibn Muhammad al-Idrisi "al-Hajjam"
  fr: "Al-Hasan ibn Muhammad al-Idrisi, « al-Hajjam »"
  es: "al-Hasan ibn Muhammad al-Idrisi \"al-Hajjam\""
  ur: "الحسن بن محمد الادریسی \"الحجام\""
summary:
  ar: "الحسن بن محمد بن القاسم بن إدريس الإدريسي، الملقب بالحجّام؛ كان مقداماً شجاعاً فثار بفاس سنة 313هـ فقتل ريحاناً الكتامي واليها واجتمع الناس على بيعته، وخرج لقتاله موسى بن أبي العافية فتزاحفا بفحص أداذ بين تازا وفاس المعروف يومئذ بوادي المطاحن واشتدت الحرب بينهما، وكانت العاقبة لابن أبي العافية فانفضّ عسكر الحسن ورجع مفلولاً إلى فاس، فغدر به عامله على عدوة القرويين حامد بن حمدان الهمداني فدس إليه بالفرار وأمكن ابن أبي العافية من البلد، وكان آخر ملوك الأدارسة بالمغرب."
  en: "al-Hasan ibn Muhammad ibn al-Qasim ibn Idris, nicknamed al-Hajjam ('the cupper'); brave and daring, he rose at Fez in 313 AH, killed its Kutama governor Rayhan and drew the city to his bay'a — then fought Musa ibn Abi al-Afiya at the Fahs Adadh field between Taza and Fez, known then as Wadi al-Matahin; the day went to Ibn Abi al-Afiya, and when al-Hajjam's own governor on the Qarawiyyin bank, Hamid ibn Hamdan al-Hamdani, betrayed him and advised flight, Fez fell and the Idrisid kingship in the Maghreb ended."
  fr: "Al-Hasan ibn Muhammad ibn al-Qasim ibn Idris, surnommé al-Hajjam (« le praticien des ventouses ») ; courageux et audacieux, il se souleva à Fès en 313 H, tua son gouverneur kutama Rayhan et rallia la ville à son allégeance ; il combattit ensuite Musa ibn Abi al-Afiya sur le terrain de Fahs Adadh entre Taza et Fès, connu alors comme Wadi al-Matahin. La journée revint à Ibn Abi al-Afiya ; lorsque le propre gouverneur d’al-Hajjam sur la rive des Qarawiyyin, Hamid ibn Hamdan al-Hamdani, le trahit et lui conseilla la fuite, Fès tomba et la royauté idrisside au Maghreb prit fin."
  es: "Al-Hasan ibn Muhammad ibn al-Qasim ibn Idris, apodado al-Hajjam ('el cuprero'); valiente y audaz, se alzó en Fez en el año 313 AH, mató a su gobernador de Kutama, Rayhan, y atrajo la ciudad a su bay'a (juramento de lealtad). Luego luchó contra Musa ibn Abi al-Afiya en el campo de Fahs Adadh, entre Taza y Fez, conocido entonces como Wadi al-Matahin. La victoria fue para Ibn Abi al-Afiya, y cuando el propio gobernador de al-Hajjam en la orilla del Qarawiyyin, Hamid ibn Hamdan al-Hamdani, lo traicionó y le aconsejó huir, Fez cayó y el reinado de los Idrisíes en el Magreb llegó a su fin."
  ur: "الحسن بن محمد بن القاسم ابن ادریس، عرفی نام الحجام ⁦('دی کپپر')⁩؛ بہادر اور جرأت مند، اس نے 313 ہجری میں فیز پر چڑھائی کی، اس کے کوٹامہ کے گورنر ریحان کو قتل کیا اور شہر کو اپنی بیع کی طرف متوجہ کیا - پھر موسیٰ بن ابی العفیہ سے طزا اور فیز کے درمیان فہس ادا کے میدان میں لڑا، جسے اس وقت وادی المطحین کہا جاتا تھا۔ وہ دن ابن ابی العفیہ کے پاس گیا اور جب قراویین کے کنارے پر الحجام کے اپنے گورنر حامد بن حمدان الحمدانی نے اسے دھوکہ دیا اور پرواز کا مشورہ دیا تو فیز گر گیا اور مغرب میں ادریس کی بادشاہت ختم ہو گئی۔"
  tr: "El-Hasan ibn Muhammed ibn el-Kâsim ibn İdris el-İdrisi, lakabı el-Hajjam olan cesur ve yürekli bir liderdi. Hicri 313 yılında Fez'de isyan çıkardı ve vali Rayhan el-Kutami'yi öldürdü. Halk ona biat etmek için toplandı. Musa ibn Abi el-Afiya onunla savaşmak için yola çıktı ve Taza ile Fez arasındaki Adad vadisinde, o zamanlar Vadi el-Matahin olarak bilinen yerde çatıştılar. Aralarındaki savaş şiddetlendi ve sonuç İbn Abi el-Afiya'nın lehine oldu. El-Hasan'ın ordusu dağıldı ve yenilmiş olarak Fez'e döndü. Karaviyye tarafındaki ajanı Hamid ibn Hamdan el-Hamdani ona ihanet etti ve kaçması için bir mesaj gönderdi, böylece İbn Abi el-Afiya şehrin kontrolünü ele geçirdi. Fas'taki son İdrisli krallardan biriydi."
  id: "Al-Hasan ibn Muhammad ibn al-Qasim ibn Idris al-Idrisi, yang dijuluki al-Hajjam, adalah seorang pemimpin yang berani dan gagah perkasa. Ia memberontak di Fez pada tahun 313 H, membunuh Rayhan al-Kutami, gubernurnya. Rakyat berkumpul untuk menyatakan kesetiaan kepadanya. Musa ibn Abi al-Afiya keluar untuk melawannya, dan mereka bertempur di lembah Adad antara Taza dan Fez, yang pada waktu itu dikenal sebagai Wadi al-Matahin. Perang antara mereka semakin intensif, dan hasilnya menguntungkan Ibn Abi al-Afiya. Pasukan Al-Hasan tercerai-berai dan kembali ke Fez dengan kekalahan. Agennya di pihak Qarawiyyin, Hamid ibn Hamdan al-Hamdani, mengkhianatinya dan mengirimkan pesan kepadanya untuk melarikan diri, sehingga memungkinkan Ibn Abi al-Afiya untuk menguasai kota tersebut. Ia adalah raja Idrisid terakhir di Maroko."
