id: person/al-hajjam-al-idrisi
class: person
label:
  ar: الحسن بن محمد الإدريسي الحجّام
  en: al-Hasan ibn Muhammad al-Idrisi "al-Hajjam"
summary:
  ar: "الحسن بن محمد بن القاسم بن إدريس الإدريسي، الملقب بالحجّام؛ كان مقداماً شجاعاً فثار بفاس سنة 313هـ فقتل ريحاناً الكتامي واليها واجتمع الناس على بيعته، وخرج لقتاله موسى بن أبي العافية فتزاحفا بفحص أداذ بين تازا وفاس المعروف يومئذ بوادي المطاحن واشتدت الحرب بينهما، وكانت العاقبة لابن أبي العافية فانفضّ عسكر الحسن ورجع مفلولاً إلى فاس، فغدر به عامله على عدوة القرويين حامد بن حمدان الهمداني فدس إليه بالفرار وأمكن ابن أبي العافية من البلد، وكان آخر ملوك الأدارسة بالمغرب."
  en: "al-Hasan ibn Muhammad ibn al-Qasim ibn Idris, nicknamed al-Hajjam ('the cupper'); brave and daring, he rose at Fez in 313 AH, killed its Kutama governor Rayhan and drew the city to his bay'a — then fought Musa ibn Abi al-Afiya at the Fahs Adadh field between Taza and Fez, known then as Wadi al-Matahin; the day went to Ibn Abi al-Afiya, and when al-Hajjam's own governor on the Qarawiyyin bank, Hamid ibn Hamdan al-Hamdani, betrayed him and advised flight, Fez fell and the Idrisid kingship in the Maghreb ended."
