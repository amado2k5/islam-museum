summary:
  ar: "عبد القادر بن علي بن يوسف، أبو محمد الفاسي المالكي، فقيه ومحدث ومفسر متفق على عدالته وفضله، أخذ عن والده وأخيه أحمد وابن عاشر وابن أبي نعيم، وعنه ابناه محمد وعبد الرحمن وعيسى الثعالبي، لم يشتغل بالتأليف وإنما صدرت عنه أجوبة جمعها أصحابه في مجلد، ونسبت إليه عقيدة اشتهرت بعده. (١٠٩١-١٠٠٧ه، كما طبع). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13361}"
  en: "Abd al-Qadir ibn Ali ibn Yusuf, Abu Muhammad al-Fasi, a Maliki jurist, hadith scholar and exegete whose probity and merit are agreed. He studied with his father, his brother Ahmad, Ibn Ashir and Ibn Abi Nu'aym. He wrote no books; his answers to questions were collected by his students in one volume, and a creed is attributed to him. The dates as printed are 1091 and 1007 H, which do not agree; they are given as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13361}"
