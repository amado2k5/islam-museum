summary:
  ar: "مؤرخ ومحدث ولغوي وأديب وشاعر من بلنسية في شرق الأندلس، صاحب «التكملة لكتاب الصلة». وعند المقري كاتب سلطان إفريقية مستغيثاً حين حوصرت بلنسية بقصيدة هزت منه عطف ارتياح فأمر شعراء حضرته بمجاوبتها وشحن الأساطيل بالمدد ثم رجع بأهله إلى تونس بعد سقوطها سنة 636هـ {cite:nafh-tib-maqqari p. 464}. وعند ابن خلدون كان علامة في الحديث ولسان العرب وبليغاً في الترسيل والشعر، كتب علامة السلطان أبي زكريا في صدور رسائله، فلما أُثِر عليه بالخط المشرقي رمى بالقلم ومثّل «واطلب العز في لظى وذر الذل ولو كان في جنان الخلود»، ثم عاد فقتله المستنصر بالرماح وسط محرم سنة 658هـ {cite:tarikh-ibn-khaldun-ibar p. 1716-1717}."
  en: "A historian, hadith scholar, linguist and poet from Valencia (Balansiya) in eastern al-Andalus, author of al-Takmila li-Kitab al-Silla."
