summary:
  ar: "مؤرخ ومحدث ولغوي وأديب وشاعر من بلنسية في شرق الأندلس، صاحب «التكملة لكتاب الصلة». وعند المقري كاتب سلطان إفريقية مستغيثاً حين حوصرت بلنسية بقصيدة هزت منه عطف ارتياح فأمر شعراء حضرته بمجاوبتها وشحن الأساطيل بالمدد ثم رجع بأهله إلى تونس بعد سقوطها سنة 636هـ {cite:nafh-tib-maqqari p. 464}. وعند ابن خلدون كان علامة في الحديث ولسان العرب وبليغاً في الترسيل والشعر، كتب علامة السلطان أبي زكريا في صدور رسائله، فلما أُثِر عليه بالخط المشرقي رمى بالقلم ومثّل «واطلب العز في لظى وذر الذل ولو كان في جنان الخلود»، ثم عاد فقتله المستنصر بالرماح وسط محرم سنة 658هـ {cite:tarikh-ibn-khaldun-ibar p. 1716-1717}."
  en: "A historian, hadith scholar, linguist and poet from Valencia (Balansiya) in eastern al-Andalus, author of al-Takmila li-Kitab al-Silla."
  es: "Historiador, erudito en hadices, lingüista y poeta de Valencia (Balansiya), en el este de al-Ándalus, autor de al-Takmila li-Kitab al-Silla."
  fr: "Historien, spécialiste du hadith, linguiste et poète originaire de Valence (Balansiya) dans l'est d'al-Andalus, auteur d'al-Takmila li-Kitab al-Silla."
  ur: "مشرقی الاندلس میں والنسیا ⁦(بلانسیہ)⁩ سے ایک مورخ، عالم حدیث، ماہر لسانیات اور شاعر، التکمیلہ لِکتاب السلا کے مصنف۔"
  tr: "Doğu Endülüs'teki Valencia'dan bir tarihçi, hadis âlimi, dilbilimci, edebi figür ve şair, 'Al-Takmila li Kitab al-Sila' adlı eserin yazarıdır. al-Maqri'ye göre, Ifriqiya Sultanı, onu rahatlatan bir şiirle kuşatılmıştı. Şairlerine filoları takviye etmelerini ve karşılık vermelerini emretti, ardından ailesiyle birlikte 636 Hicri Tunus'un düşüşünden sonra geri döndü {cite:nafh-tib-maqqari, s. 464}. İbn Haldun'a göre, hadis, Arapça dilinde seçkin bir âlimdi ve şiirde ve aktarımda etkili bir bilgindi. Mektuplarında Sultan Ebu Zekeriye'nin âlimini yazdı. Ona Doğu alfabesiyle yazdığında, kalemi yere atar ve şöyle derdi: \"Onuru aşağılanma ateşinde bile olsa, sonsuzluk bahçelerinde bile olsa.\" Derdi. Sonra geri döndü ve el-Mustansir onu Muharrem 658 Hicri'nin ortasında mızraklarla öldürdü {atıf:Tarikh-ibn-khaldun-ibar s. 1716-1717}."
  id: "Seorang sejarawan, cendekiawan hadis, ahli bahasa, tokoh sastra, dan penyair dari Valencia di Andalusia timur, penulis 'Al-Takmila li Kitab al-Sila'. Menurut al-Maqri, Sultan Ifriqiya dikepung oleh sebuah puisi yang mengguncangnya dengan rasa lega. Ia memerintahkan para penyairnya untuk merespons dan memperkuat armada, lalu kembali bersama keluarganya ke Tunisia setelah jatuhnya pada tahun 636 H {cite:nafh-tib-maqqari, hlm. 464}. Menurut Ibn Khaldun, ia adalah ulama terkemuka dalam hadis, bahasa Arab, dan fasih dalam menyampaikan dan puisi. Ia menulis surat kepada ulama Sultan Abu Zakariya. Ketika menulis surat dalam aksara Timur, ia akan meletakkan pena dan berkata, \"Carilah kehormatan dalam panas penghinaan bahkan jika itu di taman keabadian.\" Kemudian ia kembali dan al-Mustansir membunuhnya dengan tombak di tengah Muharram 658 H {cite:Tarikh-ibn-khaldun-ibar hlm. 1716-1717}."
