died: { edtf: "1191~", hijri: "0587", calendar: julian, precision: month, status: tradition, derived: true, note: "خُنق بقلعة حلب في خامس رجب سنة 587، وعن سبط ابن الجوزي يوم الجمعة 7 ذي الحجة {cite:wafayat-ayan}؛ وعن ابن العماد: خُيّره فاختار أن يموت جوعاً فمُنع من الطعام حتى تلف وعاش ستاً وثلاثين سنة {cite:shadharat-dhahab p. 770}.", sources: [source/wafayat-ayan, source/shadharat-dhahab] }
summary:
  ar: "أبو الفتوح يحيى بن حبش بن أميرك الملقب شهاب الدين السهروردي، وقيل اسمه محمد وقيل كنيته اسمه وذكر صاحب طبقات الأطباء أن اسمه عمر؛ قرأ الحكمة وأصول الفقه على الشيخ مجد الدين الجيلي بمدينة مراغة حتى برع فيهما، وكان أوحد أهل زمانه في العلوم الحكمية جامعاً للعلوم الفلسفية بارعاً في الأصول الفقهية مقرح الذكاء فصيح العبارة، وكان شافعي المذهب يُلقَّب بالمقتول ويُتَّهم بالتعطيل ويعتقد مذهب الحكماء المتقدمين؛ فلما وصل حلب أفتى علماؤها بإباحة قتله فأُلقي في الحبس ثم خُنق بقلعة حلب بإشارة السلطان صلاح الدين على يد ابنه الملك الظاهر، وذلك سنة سبع وثمانين وخمسمائة وله ثمان وثلاثون سنة؛ وذكره القاضي بهاء الدين ابن شداد في أوائل سيرة صلاح الدين {cite:wafayat-ayan}."
  en: "Yahya b. Habash b. Amirak — Suhrawardi al-Maqtul, the master of illuminationist hikma and student of Majd al-Din al-Jili at Maragha; the fuqaha of Aleppo licensed his killing and he was strangled in the citadel in 587 on Salah al-Din's order to al-Malik al-Zahir, aged 38; Ibn Khallikan, who lived at Aleppo, reports the city was divided over him {cite:wafayat-ayan}."
