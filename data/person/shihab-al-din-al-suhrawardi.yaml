summary:
  ar: "أبو الفتوح يحيى بن حبش بن أميرك الملقب شهاب الدين السهروردي، وقيل اسمه محمد وقيل كنيته اسمه وذكر صاحب طبقات الأطباء أن اسمه عمر؛ قرأ الحكمة وأصول الفقه على الشيخ مجد الدين الجيلي بمدينة مراغة حتى برع فيهما، وكان أوحد أهل زمانه في العلوم الحكمية جامعاً للعلوم الفلسفية بارعاً في الأصول الفقهية مقرح الذكاء فصيح العبارة، وكان شافعي المذهب يُلقَّب بالمقتول ويُتَّهم بالتعطيل ويعتقد مذهب الحكماء المتقدمين؛ فلما وصل حلب أفتى علماؤها بإباحة قتله فأُلقي في الحبس ثم خُنق بقلعة حلب بإشارة السلطان صلاح الدين على يد ابنه الملك الظاهر، وذلك سنة سبع وثمانين وخمسمائة وله ثمان وثلاثون سنة؛ وذكره القاضي بهاء الدين ابن شداد في أوائل سيرة صلاح الدين {cite:wafayat-ayan}."
  en: "Yahya b. Habash b. Amirak — Suhrawardi al-Maqtul, the master of illuminationist hikma and student of Majd al-Din al-Jili at Maragha; the fuqaha of Aleppo licensed his killing and he was strangled in the citadel in 587 on Salah al-Din's order to al-Malik al-Zahir, aged 38; Ibn Khallikan, who lived at Aleppo, reports the city was divided over him {cite:wafayat-ayan}."
  es: "Yahya b. Habash b. Amirak: Suhrawardi al-Maqtul, maestro del hikma iluminacionista y alumno de Majd al-Din al-Jili en Maragha; los fuqaha de Alepo autorizaron su asesinato y fue estrangulado en la ciudadela en 587 por orden de Salah al-Din a al-Malik al-Zahir, de 38 años; Ibn Khallikan, que vivía en Alepo, informa que la ciudad estaba dividida por él {citar:wafayat-ayan}."
  fr: "Yahya b. Habash b. Amirak — Suhrawardi al-Maqtul, maître de la hikma illuminationniste et élève de Majd al-Din al-Jili à Maragha; la fuqaha d'Alep a autorisé son meurtre et il a été étranglé dans la citadelle en 587 sur ordre de Salah al-Din à al-Malik al-Zahir, âgé de 38 ans; Ibn Khallikan, qui vivait à Alep, rapporte que la ville était divisée entre lui {cite: wafayat-ayan}."
  ur: "یحییٰ بی۔ حبش ب۔ امیرک — سہروردی المقتول، روشن خیالی کے ماہر اور مراثہ میں مجد الدین الجیلی کے شاگرد؛ حلب کے فقہاء نے اس کے قتل کی اجازت دی اور 587 میں صلاح الدین کے حکم پر 38 سال کی عمر کے مالک الظاہر کو قلعہ میں اس کا گلا گھونٹ دیا گیا۔ ابن خلقان، جو حلب میں رہتا تھا، بیان کرتا ہے کہ شہر اس پر تقسیم ہو گیا تھا۔"
  tr: "Ebu el-Futuh Yahya ibn Habash ibn Amirak, lakabı Şihabdin el-Sührevverdi, adı Muhammed olduğu ve kunya'sı (kunya) olarak da bilinir. Tabaqat al-Atibbat yazarı adının Ömer olduğunu belirtmiştir. Maragha şehrinde Şeyh Majd el-Din el-Cili'nin yanında hikmet ve fıkıh ilkeleri öğrendi ve her ikisinde de üstün oldu. Zamanının önde gelen âlimi, felsefi bilimlerin ustası, fıkıh ilkelerinde yetenekli, zekası keskin ve hitabetti ifadesi doğrultusunda. Şafii okulu olarak bilinen 'al-Muqtawl' olarak biliniyordu ve önceki bilgelerin öğretisine inanarak ihmalkarlıkla suçlanıyordu. Halep'e vardığında, alimleri onun idamına izin verdi. Sultan Salahdin'in emriyle oğlu Malik al-Zahir tarafından 587 H.C. yılında, otuz sekiz yaşındayken hapsedildi ve ardından boğularak öldürüldü. Yargıç Baha'eddin İbn Shaddad, Salah al-Din'in erken biyografisinde onu anmıştır {alıntı: Wafayat-ayan}."
  id: "Abu al-Futuh Yahya ibn Habash ibn Amirak, dijuluki Shihab al-Din al-Suhrawardi, yang juga disebut Muhammad dan juga kunya (kunya). Penulis Tabaqat al-Atibbat menyebutkan bahwa namanya adalah Umar. Ia mempelajari kebijaksanaan dan prinsip fiksi di bawah Sheikh Majd al-Din al-Jili di kota Maragha hingga ia unggul dalam keduanya. Ia adalah ulama terkemuka pada zamannya, ahli ilmu filsafat, mahir dalam prinsip firisprudensi, tajam dalam kecerdasan, dan fasih dalam ekspresi. Ia dikenal sebagai aliran pemikiran Syafi'i yang dikenal sebagai 'al-Muqtawl' dan dituduh lalai, mempercayai doktrin para bijak terdahulu. Ketika ia tiba di Aleppo, para ulama mengizinkan eksekusinya. Ia dipenjara dan kemudian dicekik di benteng Aleppo atas perintah Sultan Salah al-Din oleh putranya Malik al-Zahir, pada tahun 587 H, di usia tiga puluh delapan tahun. Hakim Baha' al-Din Ibn Shaddad menyebutkannya dalam biografi awal Salah al-Din {cite:Wafayat-Ayan}."
