summary:
  ar: "محمد بن سباع النميري، كان من المشتهرين بذكر الله والمستأنسين بروحه، وروى عنه المثنى بن معاذ المنبري حكاية عيسى بن مريم في الشام: لم يجد مأوى فأعطي عند الله مأوى ورحمة وعرسًا بمائة حوراء."
  en: "Muhammad ibn Sabba' al-Numayri, known for the remembrance of God; al-Muthanna ibn Mu'adh al-Minbari relates from him the story of Jesus in Syria, who had no shelter and was given a shelter with God and a wedding of a hundred houris."
  ur: "محمد بن سباع نمیری اللہ کے ذکر میں مشہور اور اس کی روح سے انس رکھنے والے تھے۔ مثنیٰ بن معاذ منبری نے ان سے عیسیٰ کی شام میں حکایت نقل کی، جن کے پاس کوئی پناہ نہ تھی تو انہیں اللہ کے پاس پناہ، رحمت اور سو حوروں کے ساتھ شادی کا وعدہ ملا۔"
