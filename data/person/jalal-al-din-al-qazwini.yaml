summary:
  ar: "بطاقة أولية لجلال الدين محمد بن عبد الرحمن القزويني الخطيب، بلاغي وفقيه القرن الرابع عشر صاحب «التلخيص» و«الإيضاح»، توفي سنة ١٣٣٨م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Jalal al-Din Muhammad ibn Abd al-Rahman al-Qazwini al-Khatib, the fourteenth-century rhetorician and jurist author of al-Talkhis and al-Idah, d. 1338; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar de Jalal al-Din Muhammad ibn Abd al-Rahman al-Qazwini al-Khatib, retórico y jurista del siglo XIV, autor de al-Talkhis y al-Idah, fallecido en 1338; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet pour Jalal al-Din Muhammad ibn Abd al-Rahman al-Qazwini al-Khatib, le rhéteur et juriste du XIVe siècle auteur d'al-Talkhis et d'al-Idah, mort en 1338; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "جلال الدین محمد بن عبدالرحمٰن القزوینی الخطیب کے لیے مسودہ کارڈ، چودھویں صدی کے خطیب اور فقیہ مصنف الطلخیس اور الاداح، ڈی۔ 1338; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "14. yüzyılın hitabeti ve hukukçusu, 'Al-Talkhis' ve 'Al-Idhah' kitaplarının yazarı Celaleddin Muhammed bin Abdülrahman el-Kâzwini el-Hatib'in ön kartı; biyografik kitaplarda anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Jalal al-Din Muhammad ibn Abd al-Rahman al-Qazwini al-Khatib, seorang ahli retorika dan ahli hukum abad keempat belas, penulis 'Al-Talkhis' dan 'Al-Idhah', yang meninggal pada tahun 1338 M; ia dikenang dalam buku biografi, dan biografinya belum pernah diulas di halaman."
