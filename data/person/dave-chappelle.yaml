summary:
  ar: "كوميدي وقوف وممثل أمريكي، وُلد في واشنطن العاصمة سنة 1973، واعتنق الإسلام في السابعة عشرة من عمره. شارك في ابتكار المسلسل الساخر «عرض شبيل» (2003–2006) وبطولته، ثم تركه في ذروة نجاحه، وعاد بسلسلة عروض خاصة على نتفليكس، ونال جائزة مارك توين للفكاهة الأمريكية سنة 2019 وست جوائز غرامي لأفضل ألبوم كوميدي."
  en: "American stand-up comedian and actor, born in Washington, D.C. in 1973, who converted to Islam at seventeen. He co-created and starred in the sketch series Chappelle's Show (2003–2006), walked away from it at the height of its success, and returned with a run of Netflix stand-up specials. He received the Mark Twain Prize for American Humor in 2019 and has won six Grammy Awards for Best Comedy Album."
  ur: "امریکی اسٹینڈ اپ کامیڈین اور اداکار، 1973 میں واشنگٹن ڈی سی میں پیدا ہوئے اور سترہ برس کی عمر میں اسلام قبول کیا۔ انھوں نے اسکیچ سیریز «چیپلس شو» (2003ء–2006ء) کی مشترکہ تخلیق اور اس میں اداکاری کی، عروج کے دور میں اسے چھوڑ دیا، پھر نیٹ فلکس کے خصوصی پروگراموں سے واپسی کی۔ انھیں 2019 میں مارک ٹوین پرائز ملا اور چھ گریمی ایوارڈ مل چکے ہیں۔"
