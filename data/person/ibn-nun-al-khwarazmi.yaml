summary:
  ar: "ابن نون الخوارزمي الحنفي المعروف بالمعيد نزيل مكة وإمام مقام الحنفية بها؛ جاور بمكة زيادة على أربعين سنة وسمع الحديث وتفقه وبرع وأفتى ودرس واستقر معيداً بدرس الحنفية للأتابك يلبغا العمري بمكة فعرف بالمعيد، وكان بارعاً في الفقه والأصول والعربية وتصدر للإقراء بالمسجد الحرام عدة سنين وانتفع الناس به مع الديانة والصيانة، توفي بمكة في آخر جمادى الأولى وقد جاوز الثمانين {cite:shadharat-dhahab p. 112-113}."
  en: "Ibn Nun 'al-Mu'id' — forty-plus years Mecca's mujawir, imam of the Hanafi maqam and assistant teacher at the Atabak Yalbugha madrasa, brilliant in fiqh, usul and Arabic, reading publicly at the Haram for years; died at Mecca end-Jumada I 812, past eighty {cite:shadharat-dhahab p. 112-113}."
