summary:
  ar: "ابن نون الخوارزمي الحنفي المعروف بالمعيد نزيل مكة وإمام مقام الحنفية بها؛ جاور بمكة زيادة على أربعين سنة وسمع الحديث وتفقه وبرع وأفتى ودرس واستقر معيداً بدرس الحنفية للأتابك يلبغا العمري بمكة فعرف بالمعيد، وكان بارعاً في الفقه والأصول والعربية وتصدر للإقراء بالمسجد الحرام عدة سنين وانتفع الناس به مع الديانة والصيانة، توفي بمكة في آخر جمادى الأولى وقد جاوز الثمانين {cite:shadharat-dhahab p. 112-113}."
  en: "Ibn Nun 'al-Mu'id' — forty-plus years Mecca's mujawir, imam of the Hanafi maqam and assistant teacher at the Atabak Yalbugha madrasa, brilliant in fiqh, usul and Arabic, reading publicly at the Haram for years; died at Mecca end-Jumada I 812, past eighty {cite:shadharat-dhahab p. 112-113}."
  es: "Ibn Nun 'al-Mu'id' —mujawir de La Meca durante más de cuarenta años, imán del maqam Hanafi y profesor asistente en la madrasa Atabak Yalbugha, brillante en fiqh, usul y árabe, leyendo públicamente en el Haram durante años; murió en La Meca el viernes final de 1812, pasados los ochenta {cite:shadharat-dhahab p. 112-113}."
  fr: "Ibn Nun 'al-Mu'id' — mujawir de La Mecque pendant plus de quarante ans, imam du maqam Hanafi et professeur adjoint à la madrasa Atabak Yalbugha, brillant en fiqh, usul et arabe, lisant publiquement au Haram pendant des années; mort à La Mecque fin vendredi 1 812, plus de quatre-vingts ans {cite:shadharat-dhahab p. 112-113}."
  ur: "ابن نون المعید - چالیس سے زیادہ سال مکہ کا مجاور، حنفی مقام کا امام اور اتبک یلبغہ مدرسہ میں معاون استاد، فقہ، اصول اور عربی میں شاندار، برسوں تک حرم میں کھلے عام پڑھتا رہا۔ ان کی وفات مکہ کے آخر میں جمادی الثانی 812 میں، اسّی کے بعد ہوئی 112-113}۔"
  tr: "İbn Nun el-Horezmi el-Hanefi, nam-ı diğer El-Mu'id, Mekke'de ikamet etmiş ve oradaki Hanefi makamının imamı olmuştur; kırk yıldan fazla Mekke'de yaşamış, hadis dinlemiş, fıkıh öğrenmiş, üstün başarılar göstermiş, fetva çıkarmış, öğretmiş ve Mekke'deki El-Atabik Yalbugha el-Umari Hanefi okulunda öğretim asistanı olarak yerleşmiş ve burada 'Mu'id' olarak tanınmıştır. Fıkıh, ilkeler ve Arapça'da yetkindi ve birkaç yıl boyunca Mes-Camii'de kılatlar düzenleyerek dininin ve korumasının yanı sıra insanlara fayda sağladı. Cemadevi'nin sonunda Mekke'de öldü, seksenin üzerinde bir yaşla (atıf: şadharat-dhahab, s. 112-113}."
  id: "Ibn Nun al-Khwarizmi al-Hanafi, yang dikenal sebagai Al-Mu'id, adalah seorang penduduk Mekah dan imam maqam Hanafi di sana; ia tinggal di Mekah selama lebih dari empat puluh tahun, mendengarkan hadis, mempelajari hukum, unggul, mengeluarkan fatwa, mengajar, dan menetap sebagai asisten pengajar di sekolah Hanafi Al-Atabik Yalbugha Al-Umari di Mekah, di mana ia dikenal sebagai 'Mu'id. Ia mahir dalam firisprudensi, prinsip, dan bahasa Arab, serta memimpin pembacaan di Masjid Agung selama beberapa tahun, yang bermanfaat bagi masyarakat bersama dengan agamanya dan pelestariannya. Ia meninggal di Mekah pada akhir Jumada al-Awwal, setelah berusia lebih dari delapan puluh {cite:shadharat-dhahab, hlm. 112-113}."
