summary:
  ar: "منظّر بلشفي تتري (1892–1940)، مهندس فكرة «الشيوعية القومية المسلمة». ترأس المجلس العسكري الإسلامي المركزي وعمل في مفوضية القوميات، ثم اتُهم بالانحراف القومي والجامعة الإسلامية، فاعتُقل سنة 1923 مرة بعد أخرى، وأُعدم في موسكو سنة 1940، ورُدّ اعتباره بعد وفاته سنة 1990."
  en: "Tatar Bolshevik theorist (1892–1940), the architect of Muslim 'national communism'. He chaired the Central Muslim Military Collegium and worked in the People's Commissariat for Nationalities, was then accused of nationalist and pan-Islamic deviation, arrested in 1923 and again in 1928 and 1937, and executed at Moscow in 1940; he was posthumously rehabilitated in 1990."
  ur: "تاتار بالشویک نظریہ ساز (1892–1940)، «مسلم قومی اشتراکیت» کے معمار۔ مرکزی مسلم عسکری مجلس کے صدر اور قومیتوں کی وزارت میں افسر رہے، پھر قوم پرستی اور جامعہ اسلامیہ کے الزامات میں 1923، 1928 اور 1937 میں گرفتار ہوئے اور 1940 میں ماسکو میں انہیں گولی مار دی گئی؛ 1990 میں بعد از وفات بری الذمہ قرار پائے۔"
