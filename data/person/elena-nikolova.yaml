summary:
  ar: "مؤسِّسة مدونة «مسلمة تسافر» (MuslimTravelGirl.com) ومنشئتها، وهي مدونة للسفر الحلال تساعد المسلمين على التخطيط لعطلاتهم ورحلات العمرة الذاتية. يصفها ملفها في موقع ترافل ماسيف بأنها أول امرأة تحصل على اعتماد المُسوِّق الإسلامي المعتمد في المملكة المتحدة؛ نشأت في كورفو حيث أدارت أسرتها فندقًا، وتكتب مقالات سفر شهرية لمجلات نمط الحياة الإسلامية وتتحدث في مؤتمرات السفر الحلال."
  en: "Founder and creator of MuslimTravelGirl.com, a halal-travel blog helping Muslims plan holidays and DIY Umrah trips. Her Travel Massive profile describes her as the first woman to become a Chartered Islamic Marketer in the UK. She grew up in Corfu, where her family ran a hotel, writes monthly travel pieces for Muslim lifestyle magazines and speaks at halal-travel conferences."
  ur: "MuslimTravelGirl.com کی بانی و خالق، جو حلال سفر کی بلاگ ہے اور مسلمانوں کو چھٹیوں اور خود منصوبہ بند عمرہ سفروں میں مدد دیتی ہے۔ ان کے ٹریول میسیو پروفائل کے مطابق وہ برطانیہ میں چارٹرڈ اسلامک مارکیٹر بننے والی پہلی خاتون ہیں؛ وہ کورفو میں پلی بڑھیں جہاں ان کے خاندان کا ہوٹل تھا، اسلامی لائف اسٹائل رسائل کے لیے ماہانہ سفری مضامین لکھتی ہیں اور حلال سفر کانفرنسوں میں خطاب کرتی ہیں۔"
