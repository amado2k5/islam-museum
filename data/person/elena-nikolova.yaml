summary:
  ar: "مؤسِّسة مدونة «مسلمة تسافر» (MuslimTravelGirl.com) ومنشئتها، وهي مدونة للسفر الحلال تساعد المسلمين على التخطيط لعطلاتهم ورحلات العمرة الذاتية. يصفها ملفها في موقع ترافل ماسيف بأنها أول امرأة تحصل على اعتماد المُسوِّق الإسلامي المعتمد في المملكة المتحدة؛ نشأت في كورفو حيث أدارت أسرتها فندقًا، وتكتب مقالات سفر شهرية لمجلات نمط الحياة الإسلامية وتتحدث في مؤتمرات السفر الحلال."
  en: "Founder and creator of MuslimTravelGirl.com, a halal-travel blog helping Muslims plan holidays and DIY Umrah trips. Her Travel Massive profile describes her as the first woman to become a Chartered Islamic Marketer in the UK. She grew up in Corfu, where her family ran a hotel, writes monthly travel pieces for Muslim lifestyle magazines and speaks at halal-travel conferences."
  ur: "MuslimTravelGirl.com کی بانی و خالق، جو حلال سفر کی بلاگ ہے اور مسلمانوں کو چھٹیوں اور خود منصوبہ بند عمرہ سفروں میں مدد دیتی ہے۔ ان کے ٹریول میسیو پروفائل کے مطابق وہ برطانیہ میں چارٹرڈ اسلامک مارکیٹر بننے والی پہلی خاتون ہیں؛ وہ کورفو میں پلی بڑھیں جہاں ان کے خاندان کا ہوٹل تھا، اسلامی لائف اسٹائل رسائل کے لیے ماہانہ سفری مضامین لکھتی ہیں اور حلال سفر کانفرنسوں میں خطاب کرتی ہیں۔"
  es: "Fundadora y creadora de MuslimTravelGirl.com, un blog de viajes halal que ayuda a los musulmanes a planificar vacaciones y viajes de Umrah por su cuenta. Su perfil en Travel Massive la describe como la primera mujer en obtener la certificación de Especialista en Marketing Islámico en el Reino Unido. Creció en Corfú, donde su familia regentaba un hotel, escribe artículos mensuales sobre viajes para revistas de estilo de vida musulmán y participa como ponente en conferencias sobre viajes halal."
  fr: "Fondatrice et créatrice de MuslimTravelGirl.com, un blog de voyage halal aidant les musulmans à organiser leurs vacances et leurs pèlerinages à La Mecque (Umrah) en toute autonomie. Son profil Travel Massive la décrit comme la première femme à avoir obtenu la certification de spécialiste du marketing islamique au Royaume-Uni. Elle a grandi à Corfou, où sa famille tenait un hôtel, rédige des articles de voyage mensuels pour des magazines de style de vie musulmans et intervient lors de conférences sur le tourisme halal."
  tr: "Müslümanların tatillerini ve kendi istekleriyle yaptıkları Umre gezilerini planlamalarına yardımcı olan helal seyahat blogu 'Muslim Travels' (MuslimTravelGirl.com) adlı blogu kurup kurdu. Travel Massive'deki profilinde, Birleşik Krallık'ta akredite İslami pazarlamacı olarak sertifika alan ilk kadın olarak tanımlanıyor; Korfu'da büyüdü; ailesi burada bir otel işletiyor, İslami yaşam tarzı dergileri için aylık seyahat makaleleri yazıyor ve helal seyahat konferanslarında konuşmalar yapıyor."
  id: "Ia mendirikan dan mendirikan blog 'Muslim Travels' (MuslimTravelGirl.com), blog perjalanan halal yang membantu Muslim merencanakan liburan dan perjalanan Umrah yang mereka tetapkan sendiri. Profilnya di Travel Massive menggambarkannya sebagai wanita pertama yang menerima sertifikasi sebagai pemasar Islam terakreditasi di Inggris; ia tumbuh besar di Corfu, di mana keluarganya mengelola hotel, menulis artikel perjalanan bulanan untuk majalah gaya hidup Islam, dan berbicara di konferensi perjalanan halal."
