summary:
  ar: "الإمام المفسر العلامة الحنبلي، مدرس العاشورية بالقاهرة؛ قدم مصر وسمع من يوسف بن المخيلي، وصنّف تفسيراً كبيراً إلى الغاية، وكان إماماً زاهداً عابداً مقصوداً بالزيارة متبركاً به أمّاراً بالمعروف كبير القدر {cite:shadharat-dhahab p. 773}."
  tr: "Kahire'de Ashuriyya'nın öğretmeni olan âlim ve âlim Hanbali; Mısır'a geldi, Yusuf ibn al-Mukhayli'den dinledi, en kapsamlı tefsirler yazdı ve ziyarete adanmış, onun tarafından kutsanmış, iyiliği emreden ve çok değerli bir imamdı {atıf:shadharat-dhahab, s. 773}."
  id: "Cendekiawan dan cendekiawan Hanbali, seorang guru Ashuriyya di Kairo; ia datang ke Mesir, mendengar dari Yusuf ibn al-Mukhayli, menulis tafsiran dengan sepenuh hati, dan merupakan seorang imam yang pertapa dan taat yang setia pada kunjungan, diberkati olehnya, mengajak kebaikan dan sangat dihargai {cite:shadharat-dhahab, hlm. 773}."
