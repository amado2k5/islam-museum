id: person/abdallah-ibn-amr-al-kawsaj
class: person
label: { ar: "عبد الله بن عمرو الكوسج", en: "Abdallah ibn Amr al-Kawsaj", fr: "Abdallah ibn Amr al-Kawsaj", es: "Abdallah ibn Amr al-Kawsaj", ur: "عبداللہ بن عمرو الکوسج" }
summary:
  ar: "عبد الله بن عمرو الثقفي الكوسج؛ كانت كوسجان لأبي بكرة فخاصمه أخوه نافع فخرج إليهما الكوسج فقال أراكما تختصمان فحكماني فحكماه فقال قد حكمت بها لنفسي فسلماها له؛ ويقال سألهما شرباً بقدر وثبة فوثب ثلاثين ذراعاً."
  en: "Abdallah ibn Amr al-Thaqafi al-Kawsaj; when Abu Bakra and his brother Nafi' contested the Kawsajan tract, he offered himself as arbiter, ruled it to himself and they yielded — or, as told, asked a leap's-width water share and leapt thirty cubits."
  fr: "Abdallah ibn Amr al-Thaqafi al-Kawsaj ; lorsque Abu Bakra et son frère Nafi' se disputèrent le domaine de Kawsajan, il s'offrit comme arbitre, se l'attribua à lui-même et ils cédèrent — ou, selon un récit, il demanda une part d'eau de la largeur d'un saut et sauta trente coudées."
  es: "Abdallah ibn Amr al-Thaqafi al-Kawsaj; cuando Abu Bakra y su hermano Nafi' disputaron el territorio de Kawsajan, se ofreció como árbitro, se lo adjudicó y ellos cedieron, o, según se cuenta, pidieron una porción de agua equivalente al ancho de un salto y dieron un salto de treinta codos."
  ur: "عبداللہ بن عمرو الثقفی الکوصج؛ جب ابوبکرہ اور اس کے بھائی نافع نے کاوساجن کے راستے پر مقابلہ کیا تو اس نے اپنے آپ کو ثالث کے طور پر پیش کیا، اس پر خود فیصلہ کیا اور انہوں نے نتیجہ اخذ کیا - یا جیسا کہ بتایا گیا ہے، ایک چھلانگ چوڑائی پانی کا حصہ مانگا اور تیس ہاتھ چھلانگ لگا دی۔"
  tr: "Abdullah bin Amr Al-Thaqafi Al-Kawsaj; Kawsan, Ebu Bekre'ye aitti ve kardeşi Nafi' onunla ihtilaf halindeydi. Al-Kawsaj yanlarına gidip, \"Görüyorum ki ikiniz de ihtilaf halindesiniz, o halde hakemlik yapayım\" dedi. Onlar da onu yargıladılar ve o, \"Karar verdim, kendi lehime olsun\" dedi. Bunun üzerine mülkü ona verdiler. Rivayet olunur ki, onlardan bir sıçrama büyüklüğünde bir su istedi ve otuz arşın sıçradı."
  id: "Abdullah bin Amr Al-Thaqafi Al-Kawsaj; Kawsan adalah milik Abu Bakra, dan saudaranya Nafi’ berselisih dengannya. Al-Kawsaj keluar menemui mereka dan berkata, “Aku melihat kalian berdua berselisih, jadi biarlah aku yang menjadi hakim.” Maka mereka menghakiminya, dan dia berkata, “Aku telah memutuskan bahwa itu untuk diriku sendiri.” Maka mereka menyerahkannya kepadanya. Dikatakan bahwa dia meminta mereka minuman sebesar lompatan, dan dia melompat sejauh tiga puluh hasta."
