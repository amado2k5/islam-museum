summary:
  ar: "عبد الله بن عمرو الثقفي الكوسج؛ كانت كوسجان لأبي بكرة فخاصمه أخوه نافع فخرج إليهما الكوسج فقال أراكما تختصمان فحكماني فحكماه فقال قد حكمت بها لنفسي فسلماها له؛ ويقال سألهما شرباً بقدر وثبة فوثب ثلاثين ذراعاً."
  en: "Abdallah ibn Amr al-Thaqafi al-Kawsaj; when Abu Bakra and his brother Nafi' contested the Kawsajan tract, he offered himself as arbiter, ruled it to himself and they yielded — or, as told, asked a leap's-width water share and leapt thirty cubits."
