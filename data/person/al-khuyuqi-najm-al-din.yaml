id: person/al-khuyuqi-najm-al-din
class: person
label: { ar: "نجم الدين الخيوقي", en: "Najm al-Din al-Khuyuqi" }
summary:
  ar: "الشيخ الزاهد القدوة نجم الدين أبو الجناب الخيوقي أحمد بن عمر بن محمد الصوفي المحدث شيخ خوارزم، يقال له الكبرى؛ رحل الأقطار راكباً وماشياً وأدرك من المشايخ ما لا يحصى كثرة ولبس خرقة التصوف النهرجورية من الشيخ إسماعيل القصري والسهردية للتبرك من الشيخ أبي ناصر عمار بن ياسر، وسبق أقرانه في صغره إلى فهم المشكلات والغوامض فلقبوه الطامة الكبرى ثم كثر استعماله فحذفوا الطامة وأبقوا الكبرى؛ سمع بهمدان من الحافظ أبي العلاء وبالإسكندرية من السلفي وعنى بمذهب الشافعي والتفسير وله تفسير في اثنتي عشرة مجلدة واجتمع به الإمام فخر الدين الرازي فاعتف بفضله؛ كان صاحب حديث وسنة ملجأ للغرباء عظيم الجاه لا يخاف في الله لومة لائم؛ وقال ابن الأهدل استشهد بخوارزم في فتنة التتار: لما قدم جمع الشيخ أصحابه نحو ستيناً فقال لهم ارتحلوا فإنه قد خرجت نار من المشرق تحرق إلى قرب المغرب وهي فتنة عظيمة ما وقع في هذه الأمة مثلها، فقالوا له لو دعوت برفعها فقال هذا قضاء محكم لا ينفع فيه الدعاء، فقالوا له تخرج معنا فقال إني أُقتل ههنا، فخرج أصحابه فلما دخل الكفار البلد نادى الشيخ وأصحابه الباقون الصلاة جامعة ثم قال قوموا نقاتل في سبيل الله ولبس خرقة شيخه وحمل على العدو فرماهم بالحجارة ورموه بالنبل فأصابه سهم في صدره فنزعه ورمى به نحو السماء وفار الدم وهو يقول «إن أردت فاقتلني بالوصال أو بالفراق» ثم مات ودفن في رباطه {cite:shadharat-dhahab p. 79-80}."
  en: "Shaykh Najm al-Din Abu al-Janab al-Khuyuqi, Ahmad ibn Umar ibn Muhammad, the ascetic Sufi and hadith scholar, shaykh of Khwarazm, known as al-Kubra. He travelled the lands on foot and on horseback and met shaykhs beyond counting. He took the Nahrajuriyya Sufi cloak from Shaykh Isma'il al-Qasri and, for blessing, the Suhrawardiyya cloak from Shaykh Abu Nasr Ammar ibn Yasir. As a boy he outstripped his peers in grasping problems and obscurities, so they called him 'the Great Calamity'; as the usage became common they dropped 'Calamity' and kept 'the Great'. He heard hadith at Hamadhan from al-Hafiz Abu al-Ala and at Alexandria from al-Silafi. He devoted himself to the Shafi'i school and to tafsir, and wrote a tafsir in twelve volumes. Fakhr al-Din al-Razi met him and acknowledged his merit. He was a man of hadith and sunna, a refuge for strangers, of great standing, who feared no blame in God's cause. Ibn al-Ahdal says he was martyred at Khwarazm in the Tatar troubles. When they came, the shaykh gathered about sixty of his companions and told them to leave, for a fire had come out of the east spreading toward the west, a great turmoil the like of which had not befallen this community. They said, 'Pray that it be lifted.' He said, 'This is a decree that prayer cannot avert.' They said, 'Come with us.' He said, 'I am to be killed here,' and his companions left. When the unbelievers entered the city, the shaykh and the companions who remained called out, 'Prayer, to the congregation!', then said, 'Rise, let us fight in the way of God.' He put on his master's cloak and charged the enemy. They pelted him with stones and shot arrows at him, and an arrow struck his chest. He pulled it out and threw it toward the sky as the blood gushed, saying, 'If you will, kill me by union or by separation.' Then he died and was buried in his ribat {cite:shadharat-dhahab p. 79-80}."
