id: person/al-khuyuqi-najm-al-din
class: person
label: { ar: "نجم الدين الخيوقي", en: "Najm al-Din al-Khuyuqi", es: "Najm al-Din al-Khuyuqi", fr: "Najm al-Din al-Khuyuqi", ur: "نجم الدین الخوقی" }
summary:
  ar: "الشيخ الزاهد القدوة نجم الدين أبو الجناب الخيوقي أحمد بن عمر بن محمد الصوفي المحدث شيخ خوارزم، يقال له الكبرى؛ رحل الأقطار راكباً وماشياً وأدرك من المشايخ ما لا يحصى كثرة ولبس خرقة التصوف النهرجورية من الشيخ إسماعيل القصري والسهردية للتبرك من الشيخ أبي ناصر عمار بن ياسر، وسبق أقرانه في صغره إلى فهم المشكلات والغوامض فلقبوه الطامة الكبرى ثم كثر استعماله فحذفوا الطامة وأبقوا الكبرى؛ سمع بهمدان من الحافظ أبي العلاء وبالإسكندرية من السلفي وعنى بمذهب الشافعي والتفسير وله تفسير في اثنتي عشرة مجلدة واجتمع به الإمام فخر الدين الرازي فاعتف بفضله؛ كان صاحب حديث وسنة ملجأ للغرباء عظيم الجاه لا يخاف في الله لومة لائم؛ وقال ابن الأهدل استشهد بخوارزم في فتنة التتار: لما قدم جمع الشيخ أصحابه نحو ستيناً فقال لهم ارتحلوا فإنه قد خرجت نار من المشرق تحرق إلى قرب المغرب وهي فتنة عظيمة ما وقع في هذه الأمة مثلها، فقالوا له لو دعوت برفعها فقال هذا قضاء محكم لا ينفع فيه الدعاء، فقالوا له تخرج معنا فقال إني أُقتل ههنا، فخرج أصحابه فلما دخل الكفار البلد نادى الشيخ وأصحابه الباقون الصلاة جامعة ثم قال قوموا نقاتل في سبيل الله ولبس خرقة شيخه وحمل على العدو فرماهم بالحجارة ورموه بالنبل فأصابه سهم في صدره فنزعه ورمى به نحو السماء وفار الدم وهو يقول «إن أردت فاقتلني بالوصال أو بالفراق» ثم مات ودفن في رباطه {cite:shadharat-dhahab p. 79-80}."
  en: "Shaykh Najm al-Din Abu al-Janab al-Khuyuqi, Ahmad ibn Umar ibn Muhammad, the ascetic Sufi and hadith scholar, shaykh of Khwarazm, known as al-Kubra. He travelled the lands on foot and on horseback and met shaykhs beyond counting. He took the Nahrajuriyya Sufi cloak from Shaykh Isma'il al-Qasri and, for blessing, the Suhrawardiyya cloak from Shaykh Abu Nasr Ammar ibn Yasir. As a boy he outstripped his peers in grasping problems and obscurities, so they called him 'the Great Calamity'; as the usage became common they dropped 'Calamity' and kept 'the Great'. He heard hadith at Hamadhan from al-Hafiz Abu al-Ala and at Alexandria from al-Silafi. He devoted himself to the Shafi'i school and to tafsir, and wrote a tafsir in twelve volumes. Fakhr al-Din al-Razi met him and acknowledged his merit. He was a man of hadith and sunna, a refuge for strangers, of great standing, who feared no blame in God's cause. Ibn al-Ahdal says he was martyred at Khwarazm in the Tatar troubles. When they came, the shaykh gathered about sixty of his companions and told them to leave, for a fire had come out of the east spreading toward the west, a great turmoil the like of which had not befallen this community. They said, 'Pray that it be lifted.' He said, 'This is a decree that prayer cannot avert.' They said, 'Come with us.' He said, 'I am to be killed here,' and his companions left. When the unbelievers entered the city, the shaykh and the companions who remained called out, 'Prayer, to the congregation!', then said, 'Rise, let us fight in the way of God.' He put on his master's cloak and charged the enemy. They pelted him with stones and shot arrows at him, and an arrow struck his chest. He pulled it out and threw it toward the sky as the blood gushed, saying, 'If you will, kill me by union or by separation.' Then he died and was buried in his ribat {cite:shadharat-dhahab p. 79-80}."
  es: "Shaykh Najm al-Din Abu al-Janab al-Khuyuqi, Ahmad ibn Umar ibn Muhammad, el asceta sufí y erudito de hadices, shaykh de Khwarazm, conocido como al-Kubra. Recorrió las tierras a pie y a caballo y conoció a innumerables shaykhs. Recibió la capa sufí Nahrajuriyya de Shaykh Isma'il al-Qasri y, como bendición, la capa Suhrawardiyya de Shaykh Abu Nasr Ammar ibn Yasir. De niño, superaba a sus compañeros en la comprensión de problemas y oscuridades, por lo que lo llamaban «la Gran Calamidad»; con el tiempo, dejaron de usar «Calamidad» y conservaron «la Gran». Escuchaba hadices en Hamadhan de al-Hafiz Abu al-Ala y en Alejandría de al-Silafi. Se dedicó a la escuela Shafi'i y al tafsir, y escribió un tafsir en doce volúmenes. Fakhr al-Din al-Razi lo conoció y reconoció su mérito. Era un hombre de hadices y sunna, un refugio para los extranjeros, de gran prestigio, que no temía ser criticado por la causa de Dios. Ibn al-Ahdal dice que fue martirizado en Khwarazm durante los disturbios tártaros. Cuando llegaron, el jeque reunió a unos sesenta de sus compañeros y les dijo que se marcharan, pues un fuego había surgido del este extendiéndose hacia el oeste, una gran conmoción como nunca antes había azotado a esta comunidad. Dijeron: «Oren para que se levante». Él dijo: «Este es un decreto que la oración no puede evitar». Dijeron: «Vengan con nosotros». Él dijo: «Aquí me matarán», y sus compañeros se fueron. Cuando los incrédulos entraron en la ciudad, el jeque y los compañeros que se quedaron gritaron: «¡Oración a la congregación!», y luego dijeron: «¡Levántense, luchemos en el camino de Dios!». Se puso el manto de su maestro y cargó contra el enemigo. Lo apedrearon y le dispararon flechas, y una flecha le alcanzó el pecho. Se la arrancó y la arrojó al cielo mientras la sangre brotaba, diciendo: «Si quieren, mátenme por la unión o por la separación». Entonces murió y fue sepultado en su ribat {cite:shadharat-dhahab p. 79-80}."
  fr: "Cheikh Najm al-Din Abu al-Janab al-Khuyuqi, Ahmad ibn Umar ibn Muhammad, ascète soufi et érudit du hadith, cheikh du Khwarezm, connu sous le nom d'al-Kubra. Il parcourut le pays à pied et à cheval et rencontra d'innombrables cheikhs. Il reçut la tunique soufie Nahrajuriyya du cheikh Isma'il al-Qasri et, en guise de bénédiction, la tunique Suhrawardiyya du cheikh Abu Nasr Ammar ibn Yasir. Enfant, il surpassait ses pairs dans la compréhension des problèmes et des subtilités, ce qui lui valut le surnom de « Grande Calamité »; avec le temps, le terme « Calamité » fut abandonné au profit de « Grande ». Il étudia le hadith à Hamadhan auprès d'al-Hafiz Abu al-Ala et à Alexandrie auprès d'al-Silafi. Il se consacra à l'école shafi'ite et à l'exégèse (tafsir), et rédigea un tafsir en douze volumes. Fakhr al-Din al-Razi le rencontra et reconnut son mérite. C'était un homme de hadith et de sunna, un refuge pour les étrangers, d'une grande renommée, qui ne craignait aucun reproche pour la cause de Dieu. Ibn al-Ahdal rapporte qu'il fut martyrisé à Khwarezm lors des troubles tatars. À leur arrivée, le cheikh rassembla une soixantaine de ses compagnons et leur dit de partir, car un feu s'était déclaré à l'est et se propageait vers l'ouest, un grand bouleversement sans précédent pour cette communauté. Ils dirent: « Priez pour que ce feu s'éteigne. » Il répondit: « C'est un décret que la prière ne peut conjurer. » Ils insistèrent: « Venez avec nous. » Il déclara: « Je dois mourir ici », et ses compagnons partirent. Lorsque les incrédules entrèrent dans la ville, le cheikh et les compagnons restés sur place s'écrièrent: « Prière, assemblée ! » puis dirent: « Levez-vous, combattons pour la cause de Dieu ! » Il revêtit le manteau de son maître et chargea l'ennemi. Ils le lapidèrent et lui tirèrent des flèches; une flèche le frappa à la poitrine. Il l'arracha et la jeta vers le ciel, tandis que le sang jaillissait, en disant: « Si vous le voulez, tuez-moi par l'union ou par la séparation. » Puis il mourut et fut enterré dans son ribat (ci-après: shadharat-dhahab, p. 79-80)."
  ur: "شیخ نجم الدین ابو الجناب الخوقی، احمد بن عمر بن محمد، صوفی اور حدیث کے عالم، خوارزم کے شیخ، الکبریٰ کے نام سے مشہور ہیں۔ اس نے پیدل اور گھوڑے پر زمین کا سفر کیا اور گنتی سے باہر شیخوں سے ملاقات کی۔ انہوں نے شیخ اسماعیل القاسری سے نہرجوریہ صوفی چادر اور برکت کے لیے شیخ ابو نصر عمار بن یاسر سے سہروردیہ چادر لی۔ لڑکپن میں اس نے اپنے ساتھیوں کو مسائل اور دھندلاپن کو سمجھنے میں پیچھے چھوڑ دیا، اس لیے انہوں نے اسے 'عظیم آفت' کہا۔ جیسے جیسے استعمال عام ہوا انہوں نے 'Calamity' کو چھوڑ دیا اور 'The Great' کو برقرار رکھا۔ اس نے حماد میں حافظ ابو العلا سے اور اسکندریہ میں السلفی سے حدیث سنی۔ اس نے اپنے آپ کو شافعی مکتب اور تفسیر کے لیے وقف کر دیا اور بارہ جلدوں میں ایک تفسیر لکھی۔ فخر الدین الرازی نے ان سے ملاقات کی اور ان کی قابلیت کا اعتراف کیا۔ وہ حدیث و سنت کے حامل، اجنبیوں کے لیے پناہ گاہ، عظیم مرتبے کے حامل، خدا کی راہ میں کسی عیب سے ڈرنے والے انسان تھے۔ ابن الاحدل کہتے ہیں کہ وہ تاتاری مصیبتوں میں خوارزم میں شہید ہوئے۔ جب وہ آئے تو شیخ نے اپنے ساٹھ کے قریب ساتھیوں کو اکٹھا کیا اور ان سے کہا کہ وہ چلے جائیں کیونکہ مشرق سے ایک آگ نکل کر مغرب کی طرف پھیلی ہوئی تھی، ایک بڑا ہنگامہ جو اس امت پر نہیں پڑا تھا۔ کہنے لگے دعا کرو کہ اسے اٹھا لیا جائے۔ فرمایا یہ وہ حکم ہے جسے نماز ٹال نہیں سکتی۔ کہنے لگے ہمارے ساتھ چلو۔ اس نے کہا مجھے یہیں قتل کیا جائے گا اور اس کے ساتھی چلے گئے۔ جب کافر شہر میں داخل ہوئے تو شیخ اور باقی رہ جانے والے اصحاب نے پکارا، 'نماز، جماعت کے لیے!'، پھر کہا، 'اٹھو، خدا کی راہ میں جہاد کریں۔' اس نے اپنے آقا کی چادر اوڑھ کر دشمن پر الزام لگایا۔ انہوں نے اس پر پتھر برسائے اور اس پر تیر برسائے اور ایک تیر اس کے سینے میں لگا۔ اس نے اسے نکال کر آسمان کی طرف پھینکا جیسے خون بہہ رہا ہو اور کہا، 'اگر تم چاہو تو مجھے اتحاد سے یا علیحدگی سے مار ڈالو۔' پھر ان کی وفات ہوئی اور ان کی رباط میں دفن ہوئے۔ 79-80}۔"
  tr: "Asket Şeyh El-Kudve Necmeddin Ebu el-Canab el-Hayyuqi Ahmed ibn Ömer bin Muhammed el-Sufi, hadis âlimi olarak anılırdı; çeşitli topraklarda at binip yürüyerek seyahat etti, sayısız şeyhle karşılaştı ve Şeyh İsmail el-Kasri'den Nahrjur Sufi pelerinini, Şeyh Ebu Nasser Emmar bin Yasir'den bereket almak için Sahradiyye'den aldı. Gençliğinde sorunları ve gizemleri anlamada akranlarını geride bıraktı, bu yüzden ona Büyük Felaket adını verdi, o zaman yaygın olarak kullanıldı, böylece felaketi kaldırdılar ve Büyük Felaketi korudular; Hamdan'da Hafız Ebu Ala ve İskenderiye'de Selefi'den duydu Şafii mezhepi ve tefsirle ilgileniyordu ve on iki cilt halinde tefsir yazdı. İmam Fakhr al-Din al-Razi onunla birlikte toplandı ve erdemini itiraf etti; kendisi bir hadis ve sünnet âlimi, Allah'ın yolunda suçlunun suçundan korkmayan büyük statülü yabancılar için sığınaktı. İbn el-Ahdal, Tatar isyanı sırasında Harezm'i aktararak şöyle dedi: Şeyh geldiğinde, yaklaşık altmış kişiyi topladı ve onlara gitmelerini söyledi, çünkü doğudan batıya yakın yanan ateş çıkmıştı, bu bu ülkede şimdiye kadar yaşananlara benzemeyen büyük bir sınavdır. Onlar ona, 'Keşke onun yükseltilmesini isteseydin,' dediler. O da şöyle yanıtladı, Bu, namaz kılmanın işe yaramadığı katı bir fermandır. Ona bizimle gitmesini söylediler, o da 'Burada öldürüleceğim.' dedi. Böylece sahabeleri ayrıldı. Kafirler şehre girdiğinde, şeyh ve kalan sahabeleri cemaat namazını çağırdılar ve 'Kalkın, Allah yolunda savaşacağız.' dediler. Şeyhinin pelerinini giydi ve düşmana saldırdı, sonra onlara taş attı ve oklarla vurdu, bir ok göğsüne isabet etti, o da ok çıkardı ve gökyüzüne fırlattı, kan fışkırdı ve 'İsterseniz, beni birlik ya da ayrılıkla öldürün.' dedi. Sonra öldü ve bağıyla gömüldü {atıf:shadharat-dhahab, s. 79-80}."
  id: "Sheikh asketik Al-Qudwa Najm al-Din Abu al-Janab al-Khayyuqi Ahmad ibn Umar ibn Muhammad al-Sufi, sang ulama hadits, disebut sebagai Ulama Agung; ia melakukan perjalanan melintasi berbagai negeri dengan menunggang kuda dan berjalan, bertemu banyak sheikh, dan mengenakan jubah Sufi Nahrjur dari Sheikh Ismail al-Qasri serta Sahradiyya untuk berkah dari Sheikh Abu Nasser Ammar ibn Yasser. Ia melampaui teman-temannya di masa muda dalam memahami masalah dan misteri, sehingga ia menjulukinya Bencana Besar, lalu istilah itu digunakan secara luas, sehingga mereka menghilangkan bencana dan mempertahankan Bencana Besar; ia mendengar dalam Hamdan dari Hafiz Abu Al-Ala dan di Alexandria dari Salafi Ia peduli dengan aliran dan tafsir Syafi'i, dan menulis tafsir dalam dua belas jilid. Imam Fakhr al-Din al-Razi berkumpul dengannya dan mengaku kebajikan; ia adalah seorang ulama hadis dan Sunnah, tempat perlindungan bagi orang asing, berstatus tinggi, yang tidak takut disalahkan oleh pelaku atas perjuangan Tuhan. Ibn al-Ahdal berkata, mengutip Khwarezm selama pemberontakan Tatar: Ketika Sheikh tiba, ia mengumpulkan sekitar enam puluh sahabatnya dan menyuruh mereka pergi, karena api telah keluar dari timur membakar dekat barat, yang merupakan ujian besar yang belum pernah terjadi di negara ini. Mereka berkata kepadanya, 'Andai saja engkau memanggil pengangkatannya.' Ia menjawab, Ini adalah perintah tegas di mana doa tidak berguna. Mereka menyuruhnya pergi bersama kami, dan dia berkata, 'Aku akan dibunuh di sini.' Maka teman-temannya pergi. Ketika orang kafir masuk ke kota, sheikh dan teman-temannya yang tersisa memanggil shalat berjamaah, lalu berkata, 'Bangkitlah, kita akan bertempur di jalan Allah.' Dia mengenakan jubah sheikh dan menyerang musuh, lalu dia melempar batu ke arah mereka dan menembaknya dengan panah, sehingga sebuah panah mengenai dadanya, lalu dia menariknya dan melemparkannya ke langit, dan darah mengalir sambil berkata, 'Jika kamu mau, bunuh aku dengan persatuan atau pemisahan.' Kemudian dia meninggal dan dikubur dalam ikatannya {cite:shadharat-dhahab, hlm. 79-80}."
