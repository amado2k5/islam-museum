label: { ar: "علاء الدين تكش خوارزم شاه", en: "Ala al-Din Tekish, Khwarazmshah", ur: "علاء الدین تکش، خوارزم شاہ" }
summary:
  ar: "علاء الدين تكش خوارزم شاه والد علاء الدين محمد؛ ملك الري سنة ثمان وثمانين وخمسمائة بدعوة قتلغ اينانج بن البهلوان، وكان أخوه سلطان شاه قد قصد خوارزم فمنعه أهلها فمات كمداً سلخ رمضان سنة تسع وثمانين فتسلم مرو ومملكته وخزائنه وولى ابنه قطب الدين محمد نيسابور، وسنة تسعين قتل عسكره السلطان طغرل آخر سلاجقة العراق قرب الري فملك همذان وبلاد الجبل وسلمها إلى قتلغ اينانج وجعل مقدم مماليكه مياجق وعاد إلى خوارزم {cite:kamil-ibn-al-athir p. 232-233}."
  en: "Ala al-Din Tekish, Khwarazmshah (567–596/1172–1200), father of Ala al-Din Muhammad; he took Rayy in 588 AH, inherited his brother Sultanshah's Merv in 589, and his army killed Tughril, last of the Iraq Seljuks, in 590 {cite:kamil-ibn-al-athir p.232-233}; 59 of his coins, of 22 types, are known from Khwarazm and Nishapur {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 103} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 118}."
  ur: "علاء الدین تکش، خوارزم شاہ (567–596ھ/1172–1200ء)، علاء الدین محمد کے والد؛ انہوں نے 588ھ میں رے لیا، 589ھ میں بھائی سلطان شاہ کا مرو حاصل کیا، اور 590ھ میں ان کے لشکر نے عراق کے آخری سلجوقی طغرل کو قتل کیا {cite:kamil-ibn-al-athir p.232-233}؛ ان کے 22 اقسام کے 59 سکے خوارزم اور نیشاپور سے معلوم ہیں {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 103} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 118}۔"
