summary:
  ar: "موسى بن كعب التميمي؛ عقده له أبو مسلم ووجهه إلى السند فهزم منصور بن جمهور وجيشه وقتل أخاه فمات منصور عطشاً بالرمل وولى السند فرم المنصورة وزاد في مسجدها وغزا وافتتح."
  en: "Musa ibn Ka'b al-Tamimi; Abu Muslim's appointee who routed Mansur ibn Jawhur to his sand-death, then governed Sind — al-Mansura repaired, mosque enlarged, conquests won."
  es: "Musa ibn Ka'b al-Tamimi, designado por Abu Muslim, derrotó a Mansur ibn Jawhur y lo llevó a la muerte en las arenas; luego gobernó Sind: reparó al-Mansura, amplió la mezquita y obtuvo conquistas."
  fr: "Musa ibn Ka'b al-Tamimi; nommé par Abu Muslim, il mit en déroute Mansur ibn Jawhur jusqu'à sa mort dans le sable, puis gouverna le Sind — al-Mansura réparé, mosquée agrandie, conquêtes remportées."
  ur: "موسیٰ بن کعب التمیمی؛ ابو مسلم کا مقرر جس نے منصور بن جوہر کو اس کی ریت کی موت تک پہنچایا، پھر سندھ پر حکومت کی - المنصورہ کی مرمت کی، مسجد کو بڑھایا گیا، فتوحات حاصل کی گئیں۔"
  tr: "Musa ibn Ka'b al-Tamimi; Ebu Müslüm onu aktarma zincirine atadı; burada Mansur ibn Cumhur ve ordusu yenildi, kardeşi öldürüldü. Mansur susuzluktan kumda öldü ve Sindh, Mansura tarafından ele geçirildi, bu da camiyi de kapsayacak şekilde genişletildi ve Mansura onu fethetti ve fethedi."
  id: "Musa ibn Ka'b al-Tamimi; Abu Muslim mengangkatnya ke rantai transmisi, di mana Mansur ibn Jumhur dan pasukannya dikalahkan, dan saudaranya tewas. Mansur meninggal karena haus di pasir, dan Sindh diambil alih oleh Mansurah, yang kemudian diperluas untuk mencakup masjidnya, dan ia menaklukkan dan menaklukkannya."
