label: { ar: "الحسن بن بويه ركن الدولة" }
summary:
  ar: "الحسن بن بويه الديلمي، أخو علي عماد الدولة وأحمد معز الدولة، لقبه المستكفي ركن الدولة لما دخل أخوه بغداد وضربت ألقاب الأخوة على السكة {cite:tarikh-khulafa-minhaj-1434 p. 613}، وأقامه المطيع مكان أخيه عماد الدولة سنة ثمان وثلاثين وهو والد عضد الدولة {cite:tarikh-khulafa-minhaj-1434 p. 616}.، وعند ابن الأثير استولى منصور بن قراتكين الساماني على الري سنة 340هـ وأخرج خليفته علي بن كاما إلى أصبهان وملكوا بلاد الجبل إلى قرميسين فكتب ركن الدولة وهو بفارس إلى أخيه معز الدولة يأمره بإنفاذ عسكر يدفعهم عن نواحي العراق {cite:kamil-ibn-al-athir p. 364-365}، وعند ابن الأثير سار سنة 351هـ إلى طبرستان فحصر سارية وملكها ففارق وشمكير طبرستان إلى جرجان فأقام بطبرستان حتى ملكها وسار في طلبه إلى جرجان فأزاحه عنها واستأمن إليه ثلاثة آلاف من عسكره {cite:kamil-ibn-al-athir p. 401-402}"
  en: "Hasan ibn Buya, brother of Imad and Mu'izz al-Dawla, titled Rukn al-Dawla when the three laqabs went on the coinage {cite:tarikh-khulafa-minhaj-1434 p. 613}."
