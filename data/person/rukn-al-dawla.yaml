label: { ar: "الحسن بن بويه ركن الدولة" }
summary:
  ar: "الحسن بن بويه الديلمي، أخو علي عماد الدولة وأحمد معز الدولة، لقبه المستكفي ركن الدولة لما دخل أخوه بغداد وضربت ألقاب الأخوة على السكة {cite:tarikh-khulafa-minhaj-1434 p. 613}، وأقامه المطيع مكان أخيه عماد الدولة سنة ثمان وثلاثين وهو والد عضد الدولة {cite:tarikh-khulafa-minhaj-1434 p. 616}. وعند ابن الأثير استولى منصور بن قراتكين الساماني على الري سنة 340هـ وأخرج خليفته علي بن كاما إلى أصبهان وملكوا بلاد الجبل إلى قرميسين فكتب ركن الدولة وهو بفارس إلى أخيه معز الدولة يأمره بإنفاذ عسكر يدفعهم عن نواحي العراق {cite:kamil-ibn-al-athir p. 364-365}، وعند ابن الأثير سار سنة 351هـ إلى طبرستان فحصر سارية وملكها ففارق وشمكير طبرستان إلى جرجان فأقام بطبرستان حتى ملكها وسار في طلبه إلى جرجان فأزاحه عنها واستأمن إليه ثلاثة آلاف من عسكره {cite:kamil-ibn-al-athir p. 401-402}"
  en: "Hasan ibn Buya, brother of Imad and Mu'izz al-Dawla, titled Rukn al-Dawla when the three laqabs went on the coinage {cite:tarikh-khulafa-minhaj-1434 p. 613}."
  es: "Hasan ibn Buya, hermano de Imad y Mu'izz al-Dawla, tituló Rukn al-Dawla cuando los tres laqabs acuñaron {cita:tarikh-khulafa-minhaj-1434 p. 613}."
  fr: "Hasan ibn Buya, frère d'Imad et Mu'izz al-Dawla, a intitulé Rukn al-Dawla lorsque les trois laqabs se sont lancés dans la monnaie {cite:tarikh-khulafa-minhaj-1434 p. 613}."
  ur: "عماد اور معاذ الدولہ کے بھائی حسن بن بویا نے رکن الدولہ کا لقب دیا جب تینوں لقب سکے پر چل پڑے۔ 613}۔"
  tr: "Ali İmam el-Devle ve Ahmed Muizz el-Devla'nın kardeşi El-Hasan bin Buyah el-Daylami, kardeşi Bağdat'a girdiğinde el-Mustakfi Rukn al-Dawla lakabını almıştır ve kardeşlerin unvanları kullanılmıştır {cite:History-Khulafa-minhaj-1434 s. 613} ve 38 Hicri yılında kardeşi İmad el-Devle'nin yerine el-Muti' tarafından atanmıştır. O, 'Adud al-Dawla'nın babasıdır {atıf:Tarikh-Kulafa-minhaj-1434, s. 616}. İbn al-Athir ile birlikte, Mansur bin Karatakin el-Samani 340 Hicri'de Rayı'yı ele geçirdi, halefi Ali ibn Kama'yı İsfahan'a gönderdi ve dağlık toprakları Karmisin'e yöneltti. Rukn al-Dawla, Pers'teyken kardeşi Mu'izz al-Dawla'ya mektupta, onları Irak bölgelerinden çıkarmak için bir ordu göndermesini emretti {alıntı: Kamil ibn-al-Athir s. 364-365}. İbn al-Athir ile birlikte 351 Hicri yılında Tabaristan'a yürüdü, bir sarayı kuşattı ve şehri yönetti. Şamkir Tabaristan'dan ayrılarak Jurjan'a gitti, Tabaristan'da kaldı ve Jurjan'ı aramaya çıktı, ancak onu görevden aldı ve üç bin askerini emanet etti {cite:kamil-ibn-al-athir s. 401-402}"
  id: "Al-Hasan ibn Buyah al-Daylami, saudara Ali Imad al-Dawla dan Ahmad Mu'izz al-Dawla, dijuluki al-Mustakfi Rukn al-Dawla ketika saudaranya masuk ke Baghdad dan gelar saudara-saudara itu digunakan {cite:History-Khulafa-minhaj-1434 hlm. 613}, dan ia diangkat oleh al-Muti' menggantikan saudaranya Imad al-Dawla pada tahun 38 H. Ia adalah ayah dari 'Adud al-Dawla {cite:Tarikh-Kulafa-minhaj-1434, hlm. 616}. Bersama Ibn al-Athir, Mansur ibn Qaratakin al-Samani merebut Rayy pada tahun 340 H, mengirim penerusnya Ali ibn Kama ke Isfahan, dan mereka memerintah wilayah pegunungan ke Qarmisin. Rukn al-Dawla menulis surat kepada saudaranya Mu'izz al-Dawla saat di Persia, memerintahkannya mengirim pasukan untuk mengusir mereka dari wilayah Irak {cite:kamil-ibn-al-athir hlm. 364-365}. Bersama Ibn al-Athir, ia berbaris pada tahun 351 H ke Tabaristan, mengepung sebuah saray, dan memerintahnya. Shamkir meninggalkan Tabaristan menuju Jurjan, tinggal di Tabaristan sampai ia memerintahnya, dan berbaris mencari Jurjan, namun ia mengusirnya dan mempercayakan tiga ribu tentaranya {cite:kamil-ibn-al-athir hlm. 401-402}"
