  ar: "ناصر بن سلمان بن ناصر بن عمران، أبو الفتح الأنصاري النيسابوري، من علماء الشافعية، محدث إمام مناظر بارع في الكلام، سمع أباه وغيره، وروى عنه سعد بن السمعاني. من تصانيفه كتاب في علم الكلام. عاش بين 489 و552هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053}"
