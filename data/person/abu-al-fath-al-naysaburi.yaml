summary:
  ar: "ناصر بن سلمان بن ناصر بن عمران، أبو الفتح الأنصاري النيسابوري، من علماء الشافعية، محدث إمام مناظر بارع في الكلام، سمع أباه وغيره، وروى عنه سعد بن السمعاني. من تصانيفه كتاب في علم الكلام. عاش بين 489 و552هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053}"
  en: "Nasir ibn Sulayman ibn Nasir ibn Imran, Abu al-Fath al-Ansari al-Naysaburi, a Shafi'i scholar, an imam in hadith and a skilled disputant in theology, who heard from his father and others, and from whom Sa'd al-Sam'ani transmitted. His work includes a book in theology. He lived from 489 to 552 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053}"
  fr: "Nasir ibn Sulayman ibn Nasir ibn Imran, Abu al-Fath al-Ansari al-Naysaburi, savant shafi'ite, imam du hadith et débatteur habile en théologie, qui entendit son père et d'autres, et de qui transmit Sa'd al-Sam'ani. Son œuvre comprend un livre de théologie. Il vécut de 489 à 552 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053}"
  es: "Nasir ibn Sulayman ibn Nasir ibn Imran, Abu al-Fath al-Ansari al-Naysaburi, erudito shafi'í, imán en hadices y hábil argumentador en teología, recibió enseñanzas de su padre y de otros, y de quien Sa'd al-Sam'ani transmitió. Su obra incluye un libro de teología. Vivió entre los años 489 y 552 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053}"
  ur: "ناصر بن سلیمان بن ناصر ابن عمران، ابو الفتح الانصاری النیسابوری، ایک شافعی عالم، حدیث میں ایک امام اور علم دین میں ماہر، جنہوں نے اپنے والد اور دوسروں سے سنا، اور جن سے سعد السمانی نے نقل کیا ہے۔ اس کے کام میں الہیات میں ایک کتاب شامل ہے۔ وہ 489 سے 552 ہجری تک زندہ رہا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 2053}"
  tr: "Nasir ibn Salman ibn Nasir ibn İmran, Ebu el-Feth el-Ensari el-Naysaburi, Şafiî âlimi, hadis üstadı, önde gelen münazaracı ve yetenekli bir ilahiyatçıydı. Babasından ve diğerlerinden eğitim gördü ve Sa'd ibn el-Sam'ani ondan rivayet etti. Eserleri arasında bir ilahiyat kitabı da bulunmaktadır. 489 ile 552 Hicri yılları arasında yaşamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2053}"
  id: "Nasir ibn Salman ibn Nasir ibn Imran, Abu al-Fath al-Ansari al-Naysaburi, adalah seorang ulama mazhab Syafi'i, ahli hadits, pendebat terkemuka, dan teolog yang terampil. Ia belajar di bawah bimbingan ayahnya dan ulama lainnya, dan Sa'd ibn al-Sam'ani meriwayatkan hadits darinya. Di antara karya-karyanya adalah sebuah buku tentang teologi. Ia hidup antara tahun 489 dan 552 Hijriah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053}"
