summary:
  ar: "صحفي وسياسي تونسي (1876–1918)؛ وُلد في تونس في أسرة من أصل تركي، ودرس القانون في فرنسا، وأسس مع البشير صفر حركة الشباب التونسي وجريدة «التونسي» سنة 1907، ونُفي سنة 1912 بعد مظاهرات الترام، وتوفي في إسطنبول سنة 1918 ودُفن في مقبرة الجلاز بتونس."
  en: "Tunisian journalist and politician (1876–1918). Born in Tunis into a family of Turkish origin, he studied law in France, co-founded the Young Tunisians movement and the newspaper Le Tunisien with Béchir Sfar in 1907, was exiled in 1912 after the tram boycott protests, and died in Istanbul in 1918; he is buried in the Jellaz cemetery in Tunis."
  ur: "تونسی صحافی اور سیاست دان (1876–1918)؛ تونس میں ترک نژاد خاندان میں پیدا ہوئے، فرانس میں قانون پڑھا، 1907 میں بشیر صفر کے ساتھ نوجوان تونسی تحریک اور اخبار «التونسی» کی بنیاد رکھی، 1912 میں ٹرام بائیکاٹ کے احتجاج کے بعد جلاوطن ہوئے، اور 1918 میں استنبول میں انتقال ہوا؛ تونس کے جلاز قبرستان میں دفن ہیں۔"
