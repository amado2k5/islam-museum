id: person/aqsunqur-qasim-al-dawla
class: person
label:
  ar: قسيم الدولة أقسنقر
  en: Qasim al-Dawla Aqsunqur
  es: "Qasim al-Dawla Aqsunqur"
  fr: "Qasim al-Dawla Aqsunqur"
  ur: "قاسم الدولہ اقسنکور"
summary:
  ar: "قسيم الدولة أقسنقر، أمير السلطان ملك شاه على حلب وهو جد نور الدين العادل؛ أعطاه الطاعة لصغر أولاد ملك شاه، ثم لما ولى تتش ملك حلب بعده وقويت رجاله لقيه تتش على عدة فراسخ من حلب فانهزم وجيء به أسيراً فقتله صبراً، وكان ثأر أصحابه بقتل تتش بالري سنة 488هـ."
  en: "Qasim al-Dawla Aqsunqur, Malikshah's amir of Aleppo and ancestor of Nur al-Din al-Adil's line; after Malikshah's death he yielded Aleppo, then met Tutush a few parasangs from the city, was routed, brought in captive and killed cold-bloodedly — his men took their revenge in Tutush's own killing at Rayy in 488 AH."
  es: "Qasim al-Dawla Aqsunqur, emir de Malikshah en Alepo y antepasado del linaje de Nur al-Din al-Adil; tras la muerte de Malikshah, cedió Alepo, luego se encontró con Tutush a unos pocos parasangs de la ciudad, fue derrotado, capturado y asesinado a sangre fría; sus hombres se vengaron asesinando a Tutush en Rayy en el año 488 de la Hégira."
  fr: "Qasim al-Dawla Aqsunqur, émir d'Alep de Malikshah et ancêtre de la lignée de Nur al-Din al-Adil; après la mort de Malikshah, il céda Alep, puis rencontra Tutush à quelques parasangs de la ville, fut mis en déroute, fait prisonnier et tué de sang-froid — ses hommes se vengèrent en tuant Tutush lui-même à Rayy en 488 AH."
  ur: "قاسم الدولہ اقسنکور، حلب کے ملک شاہ کے امیر اور نورالدین العادل کے سلسلے کے آباؤ اجداد؛ ملکشاہ کی موت کے بعد اس نے حلب کو حاصل کیا، پھر شہر کے چند پارسانگوں سے توتش سے ملاقات کی، اسے مار بھگایا گیا، اسیر لایا گیا اور سرد خون کے ساتھ قتل کر دیا گیا- اس کے آدمیوں نے 488 ہجری میں رے کے مقام پر توتش کے اپنے قتل کا بدلہ لیا۔"
  tr: "Sultan Malik Şah'ın Halep prensi ve Nur al-Din al-Adil'in büyükbabası Kasım al-Dawla Aksanqur, Malik Şah'ın küçük çocukları nedeniyle ona itaat etti. Sonra, Tutush ve adamları güçlendikten sonra Halep kralı olduğunda, Tutush Halep'ten birkaç farsakh ile karşılaştı, yenildi, esir alındı ve Sabra tarafından öldürüldü. Yoldaşları, 488 Hicri'de Tutush'un öldürülmesinin intikamını Rayı'da aldı."
  id: "Qasim al-Dawla Aksanqur, pangeran Sultan Malik Shah atas Aleppo dan kakek Nur al-Din al-Adil, memberinya ketaatan karena anak-anak kecil Malik Shah. Kemudian, ketika Tutush menjadi raja Aleppo setelah dia dan pasukannya diperkuat, Tutush bertemu dengannya beberapa farsakh dari Aleppo, dikalahkan, ditawan, dan dibunuh oleh Sabra. Rekan-rekannya membalas kematian Tutush di Rayy pada 488 H."
