summary:
  ar: "قسيم الدولة أقسنقر، أمير السلطان ملك شاه على حلب وهو جد نور الدين العادل؛ أعطاه الطاعة لصغر أولاد ملك شاه، ثم لما ولى تتش ملك حلب بعده وقويت رجاله لقيه تتش على عدة فراسخ من حلب فانهزم وجيء به أسيراً فقتله صبراً، وكان ثأر أصحابه بقتل تتش بالري سنة 488هـ."
  en: "Qasim al-Dawla Aqsunqur, Malikshah's amir of Aleppo and ancestor of Nur al-Din al-Adil's line; after Malikshah's death he yielded Aleppo, then met Tutush a few parasangs from the city, was routed, brought in captive and killed cold-bloodedly — his men took their revenge in Tutush's own killing at Rayy in 488 AH."
