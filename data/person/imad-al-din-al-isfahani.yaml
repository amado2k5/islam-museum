summary:
  ar: "أبو عبد الله محمد بن محمد بن حامد، عماد الدين الكاتب الأصبهاني؛ كاتب السلطان نور الدين محمود ثم السلطان صلاح الدين، صنّف «البرق الشامي» في انتقاله من العراق إلى الشام وخدمة السلطانين وشيئاً من الفتوحات — سماه بذلك لأنه شبه أوقاته بالبرق الخاطف لطيبها وسرعة انقضائها — و«الفتح القصي» في فتح بيت المقدس في مجلدين، و«السمل على الذيل» ذيلاً على ذيل السمعاني لتاريخ بغداد، و«خريدة القصر»، و«نصرة الفترة وعصرة الفطرة» في اختلال الدولة السلجوقية، وله ديوان رسائل وديوان شعر في أربع مجلدات؛ ولما توفي صلاح الدين اختلت أحواله فاعتزل وأقبل على التصانيف {cite:wafayat-ayan}."
  en: "Imad al-Din al-Isfahani (519–597) — katib of Nur al-Din and Salah al-Din; author of al-Barq al-Shami, al-Fath al-Qussi on Jerusalem's conquest, the Kharidat al-Qasr anthology, and Nasrat al-Fatra on the Seljuk collapse {cite:wafayat-ayan}."
  es: "Imad al-Din al-Isfahani (519–597): katib de Nur al-Din y Salah al-Din; autor de al-Barq al-Shami, al-Fath al-Qussi sobre la conquista de Jerusalén, la antología Kharidat al-Qasr y Nasrat al-Fatra sobre el colapso selyúcida {cita:wafayat-ayan}."
  fr: "Imad al-Din al-Isfahani (519-597) — katib de Nur al-Din et Salah al-Din; auteur d'al-Barq al-Shami, d'al-Fath al-Qussi sur la conquête de Jérusalem, de l'anthologie Kharidat al-Qasr et de Nasrat al-Fatra sur l'effondrement de Seldjoukide {cite: wafayat-ayan}."
  ur: "عماد الدین اصفہانی (519-597) - نورالدین اور صلاح الدین کے کاتب؛ البرق الشامی کے مصنف، فتح القسی پر یروشلم کی فتح، خردات القصر انتھولوجی، اور نصرۃ الفطرہ سلجوق کے سقوط پر"
  tr: "Ebu Abdullah Muhammed bin Muhammed bin Hamid, İmaddin el-Katib el-İsfahani; Sultan Nureddin Mahmud'un ve ardından Sultan Salahdin'in katibi, Irak'tan Şam'a geçişini, sultanlara hizmetini ve bazı fetihlerini anlatan 'Al-Barq al-Shami' adlı eserini yazmıştır—zamanlamasını onun iyiliğinin yıldırım çarpması ve hızlı sona benzetmesiyle böyle adlandırmıştır—ve 'Al-Fath al-- Kudüs'ün fethi üzerine iki ciltlik Qussi'; el-Sam'ani'nin Bağdat tarihine ek olarak 'Al-Samal 'ala al-Dhayl'; Selçuklu devletinin yıkımı üzerine 'Khuridat al-Kasr' ve 'Nasrat al-Fatra'. Ayrıca dört ciltlik bir mektup ve şiir koleksiyonu vardı; Salah al-Din öldüğünde durumu kötüleşti, bu yüzden emekli olup yazılara kendini adadı."
  id: "Abu Abdullah Muhammad ibn Muhammad ibn Hamid, Imad al-Din al-Katib al-Isfahani; juru tulis Sultan Nur al-Din Mahmud dan kemudian Sultan Salah al-Din, menulis 'Al-Barq al-Shami' tentang transisinya dari Irak ke Levant, melayani para sultan, dan beberapa penaklukannya—ia menyebutnya demikian karena ia menyamakan waktunya dengan kilatan kebaikan dan akhir yang cepat—dan 'Al-Fami th al-Qussi' dalam penaklukan Yerusalem dalam dua jilid; 'Al-Samal 'ala al-Dhayl' sebagai pelengkap sejarah Baghdad oleh al-Sam'ani; 'Khuridat al-Qasr' dan 'Nasrat al-Fatra' tentang perpecahan negara Seljuk. Ia juga memiliki kumpulan surat dan kumpulan puisi dalam empat jilid; ketika Salah al-Din meninggal, kondisinya memburuk, sehingga ia pensiun dan mendedikasikan diri pada penulisan."
