summary:
  ar: "أبو عبد الله محمد بن محمد بن حامد، عماد الدين الكاتب الأصبهاني؛ كاتب السلطان نور الدين محمود ثم السلطان صلاح الدين، صنّف «البرق الشامي» في انتقاله من العراق إلى الشام وخدمة السلطانين وشيئاً من الفتوحات — سماه بذلك لأنه شبه أوقاته بالبرق الخاطف لطيبها وسرعة انقضائها — و«الفتح القصي» في فتح بيت المقدس في مجلدين، و«السمل على الذيل» ذيلاً على ذيل السمعاني لتاريخ بغداد، و«خريدة القصر»، و«نصرة الفترة وعصرة الفطرة» في اختلال الدولة السلجوقية، وله ديوان رسائل وديوان شعر في أربع مجلدات؛ ولما توفي صلاح الدين اختلت أحواله فاعتزل وأقبل على التصانيف {cite:wafayat-ayan}."
  en: "Imad al-Din al-Isfahani (519–597) — katib of Nur al-Din and Salah al-Din; author of al-Barq al-Shami, al-Fath al-Qussi on Jerusalem's conquest, the Kharidat al-Qasr anthology, and Nasrat al-Fatra on the Seljuk collapse {cite:wafayat-ayan}."
