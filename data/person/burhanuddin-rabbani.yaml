summary:
  ar: "سياسي أفغاني وأستاذ للشريعة الإسلامية، قاد الجمعية الإسلامية الأفغانية منذ 1972 وشغل رئاسة أفغانستان ⁦(1992–1996، ثم لفترة وجيزة أواخر 2001 بعد سنوات رئيساً معترفاً به دولياً في المنفى)⁩. ترأس لاحقاً الجبهة الوطنية الأفغانية والمجلس الأعلى للسلام، واغتيل في بيته بكابل في 20 سبتمبر 2011، يوم عيد ميلاده الحادي والسبعين، على يد انتحاري تظاهر بأنه مبعوث سلام من طالبان."
  en: "Afghan politician and professor of Islamic law who led the Jamiat-e Islami from 1972 and served as president of Afghanistan (1992–1996, and briefly again in late 2001 after years as the internationally recognised president in exile). He later headed the Afghanistan National Front and the High Peace Council, and was assassinated at his Kabul home on 20 September 2011, his seventy-first birthday, by a suicide bomber posing as a Taliban peace emissary."
  ur: "افغان سیاست دان اور شریعت اسلامی کے استاد، جنھوں نے 1972ء سے جمعیت اسلامی کی قیادت کی اور افغانستان کے صدر رہے ⁦(1992ء–1996ء، اور پھر 2001ء کے اواخر میں مختصر مدت کے لیے، درمیان کے برسوں میں جلاوطنی میں بین الاقوامی طور پر تسلیم شدہ صدر کی حیثیت سے)⁩۔ بعد ازاں وہ افغانستان نیشنل فرنٹ اور ہائی پیس کونسل کے سربراہ رہے اور 20 ستمبر 2011ء کو، اپنی اکہترویں سالگرہ کے دن، کابل میں اپنے گھر پر طالبان کے امن ایلچی کا روپ دھارے ایک خودکش بمبار کے ہاتھوں قتل ہوئے۔"
  es: "Político afgano y profesor de derecho islámico que lideró el Jamiat-e Islami desde 1972 y fue presidente de Afganistán (1992-1996, y brevemente de nuevo a finales de 2001 tras años como presidente en el exilio reconocido internacionalmente). Posteriormente, dirigió el Frente Nacional Afgano y el Alto Consejo de Paz, y fue asesinado en su casa de Kabul el 20 de septiembre de 2011, el día de su septuagésimo primer cumpleaños, por un atacante suicida que se hizo pasar por un emisario de paz talibán."
  fr: "Homme politique afghan et professeur de droit islamique, il dirigea le Jamiat-e Islami à partir de 1972 et fut président de l'Afghanistan (de 1992 à 1996, puis brièvement fin 2001 après avoir été pendant des années président internationalement reconnu en exil). Il dirigea ensuite le Front national afghan et le Haut Conseil pour la paix. Il fut assassiné à son domicile de Kaboul le 20 septembre 2011, jour de son soixante-et-onzième anniversaire, par un kamikaze se faisant passer pour un émissaire de paix des talibans."
  tr: "Afgan siyasetçi ve İslam hukuku profesörü olan Scully, 1972'den beri Afgan İslam Derneği'ni yönetti ve Afganistan cumhurbaşkanı olarak görev yaptı (1992–1996, ardından yıllarca sürgünde uluslararası tanınan bir cumhurbaşkanı olarak yıllar geçirdikten sonra 2001 sonlarında kısa bir süre). Daha sonra Afgan Ulusal Cephesi ve Yüksek Barış Konseyi'nin başkanlığını yaptı ve 20 Eylül 2011'de, yetmiş birinci doğum gününde, Taliban barış elçisi kılığına giren bir intihar bombacısı tarafından Kabil'deki evinde suikaste uğradı."
  id: "Sebagai politisi Afghanistan dan profesor hukum Islam, ia memimpin Asosiasi Islam Afghanistan sejak 1972 dan menjabat sebagai presiden Afghanistan (1992–1996, kemudian singkat pada akhir 2001 setelah bertahun-tahun menjadi presiden pengasingan yang diakui secara internasional). Ia kemudian memimpin Front Nasional Afghanistan dan Dewan Perdamaian Tinggi, dan dibunuh di rumahnya di Kabul pada 20 September 2011, tepat ulang tahunnya yang ke-71, oleh seorang pelaku bom bunuh diri yang menyamar sebagai utusan perdamaian Taliban."
