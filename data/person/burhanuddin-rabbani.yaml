summary:
  ar: "سياسي أفغاني وأستاذ للشريعة الإسلامية، قاد الجمعية الإسلامية الأفغانية منذ 1972 وشغل رئاسة أفغانستان (1992–1996، ثم لفترة وجيزة أواخر 2001 بعد سنوات رئيساً معترفاً به دولياً في المنفى). ترأس لاحقاً الجبهة الوطنية الأفغانية والمجلس الأعلى للسلام، واغتيل في بيته بكابل في 20 سبتمبر 2011، يوم عيد ميلاده الحادي والسبعين، على يد انتحاري تظاهر بأنه مبعوث سلام من طالبان."
  en: "Afghan politician and professor of Islamic law who led the Jamiat-e Islami from 1972 and served as president of Afghanistan (1992–1996, and briefly again in late 2001 after years as the internationally recognised president in exile). He later headed the Afghanistan National Front and the High Peace Council, and was assassinated at his Kabul home on 20 September 2011, his seventy-first birthday, by a suicide bomber posing as a Taliban peace emissary."
  ur: "افغان سیاست دان اور شریعت اسلامی کے استاد، جنھوں نے 1972ء سے جمعیت اسلامی کی قیادت کی اور افغانستان کے صدر رہے (1992ء–1996ء، اور پھر 2001ء کے اواخر میں مختصر مدت کے لیے، درمیان کے برسوں میں جلاوطنی میں بین الاقوامی طور پر تسلیم شدہ صدر کی حیثیت سے)۔ بعد ازاں وہ افغانستان نیشنل فرنٹ اور ہائی پیس کونسل کے سربراہ رہے اور 20 ستمبر 2011ء کو، اپنی اکہترویں سالگرہ کے دن، کابل میں اپنے گھر پر طالبان کے امن ایلچی کا روپ دھارے ایک خودکش بمبار کے ہاتھوں قتل ہوئے۔"
