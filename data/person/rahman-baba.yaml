  ur: "مشہور دیوان کے پشتون صوفی شاعر عبدالرحمٰن 'رحمان بابا' کے لیے ڈرافٹ کارڈ، ڈی۔ 1706; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Rahman Baba olarak bilinen Abdul Rahman'ın, ünlü Peştu Sufi şairi ve ünlü Peştuca Diwan'ın yazarı, 1706 yılında ölen ön kart; önemli kişilerin sözlükleriyle anılmaktadır ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Abdul Rahman, yang dikenal sebagai Rahman Baba, penyair Sufi Pashtun dan penulis Diwan Pashto terkenal, yang meninggal pada tahun 1706 M; ia dikenang oleh kamus tokoh-tokoh terkemuka, dan biografinya belum pernah diulas di halaman tersebut."
