  ar: "بطاقة أولية لعبد الرحمن المعروف برحمن بابا، الشاعر الصوفي البشتوني صاحب الديوان البشتوني الشهير، توفي سنة ١٧٠٦م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abd al-Rahman 'Rahman Baba', the Pashtun Sufi poet of the celebrated Diwan, d. 1706; the biographical entry is not yet checked on the page."
