id: person/sahl-al-tustari
class: person
label: { ar: "سهل التستري", en: "Sahl Al Tustari", es: "Sahl Al Tustari", fr: "Sahl Al Tustari", ur: "سہل الطستری" }
summary:
  ar: "سهل التستري بن عبد الله بن يونس بن عيسى بن عبد الله بن رافع التستري المتصوف وله كتاب دقائق المحبين وكتاب مواعظ العارفين {cite:fihrist-ibn-al-nadim p. 263}. وعند ابن الجوزي لقي ذا النون المصري وكان من الزهاد وله كلام حسن، ومن كلامه: أمس قد مات واليوم في النزع وغدا لم يولد؛ وتوفي سنة ثلاث وثمانين وقيل سنة ثلاث وسبعين ومائتين {cite:muntazam-ibn-al-jawzi p. 182}."
  en: "Sahl al-Tustari — the subtleties-of-lovers author {cite:fihrist-ibn-al-nadim}"
  es: "Sahl al-Tustari — autor de Las sutilezas de los amantes {cite:fihrist-ibn-al-nadim}"
  fr: "Sahl al-Tustari — l'auteur des subtilités des amants {cite:fihrist-ibn-al-nadim}"
  ur: "سہل الطستری - عاشقوں کی باریکیوں کا مصنف"
  tr: "Sahl al-Tustari ibn Abdullah ibn Yunus ibn İsa ibn Abdullah ibn Rafi' al-Tustari, Sufi, 'Daqa'iq al-Muhibbin' ve 'Mawa'a' al-'Arifeen kitaplarını (atı:Fihrist-ibn-al-nadim s. 263} (atı:Fihrist-ibn-al-nadim s. 263} adlı kitabı yazmıştır. İbn al-Jawzi'ye göre, kendisi bir münzevi ve iyi konuşan Dhu al-Nun al-Masri ile tanışmıştır. Söylediği sözler arasında şunlar vardır: 'Dün öldü, bugün tercide, yarın doğmadı.' Seksen üçüncü yılda öldü ve bazıları 273 Hicri yılında olduğunu söyler {atıf:Muntazam-ibn-al-jawzi s. 182}."
  id: "Sahl al-Tustari ibn Abdullah ibn Yunus ibn Isa ibn Abdullah ibn Rafi' al-Tustari, seorang Sufi, menulis buku 'Daqa'iq al-Muhibbin' dan buku 'Mawa'a' al-'Arifeen {cite:fihrist-ibn-al-nadim hlm. 263}. Menurut Ibn al-Jawzi, ia bertemu Dhu al-Nun al-Masri, seorang pertapa dan berbicara dengan baik. Di antara pepatahnya adalah: 'Kemarin ia meninggal, hari ini di masa pelepasan, dan besok ia belum lahir.' Ia meninggal pada tahun delapan puluh tiga, dan beberapa mengatakan pada tahun 273 H {cite:Muntazam-ibn-al-jawzi hlm. 182}."
