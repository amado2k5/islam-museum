summary:
  ar: "سهل التستري بن عبد الله بن يونس بن عيسى بن عبد الله بن رافع التستري المتصوف وله كتاب دقائق المحبين وكتاب مواعظ العارفين {cite:fihrist-ibn-al-nadim p. 263}. وعند ابن الجوزي لقي ذا النون المصري وكان من الزهاد وله كلام حسن، ومن كلامه: أمس قد مات واليوم في النزع وغدا لم يولد؛ وتوفي سنة ثلاث وثمانين وقيل سنة ثلاث وسبعين ومائتين {cite:muntazam-ibn-al-jawzi p. 182}."
  en: "Sahl al-Tustari — the subtleties-of-lovers author {cite:fihrist-ibn-al-nadim}"
