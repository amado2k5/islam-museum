summary:
  ar: "أخو السلطان الحفصي الحسن بن محمد؛ هرب من أخيه خوفاً من القتل فلجأ إلى العرب في البادية ثم إلى خير الدين بربروسة في الجزائر طالباً الحماية والعون. وحين دخل خير الدين تونس سنة ١٥٣٤م عيّن الرشيد عليها وأعلن ضمها للأملاك العثمانية {cite:dawlat-uthmaniyya-salabi p. 215-218}."
  en: "Brother of the Hafsid sultan al-Hasan b. Muhammad; fleeing his brother's executions he sought refuge among the Arabs of the steppe, then with Khayr al-Din in Algiers — who on taking Tunis in 1534 installed al-Rashid over it and declared it Ottoman {cite:dawlat-uthmaniyya-salabi p. 215-218}."
  fr: "Frère du sultan hafside al-Hasan b. Muhammad ; fuyant les exécutions de son frère, il a cherché refuge parmi les Arabes de la steppe, puis avec Khayr al-Din à Alger - qui, en prenant Tunis en 1534, a installé al-Rashid dessus et l'a déclaré ottoman {cite:dawlat-uthmaniyya-salabi p. 215-218}."
  es: "Hermano del sultán hafsí al-Hasan b. Muhammad; huyendo de la ejecución de su hermano, buscó refugio entre los árabes de la estepa, luego con Khayr al-Din en Argel, quien al tomar Túnez en 1534 instaló a al-Rashid al frente y la declaró otomana {cite:dawlat-uthmaniyya-salabi p. 215-218}."
