summary:
  ar: "كامن دار بنت نرسى ابنة عم النوشجان بن جسنسما صاحبة قصر نهر المرأة؛ زودت أبا موسى الأشعري خبيصاً حين نزل بها فسمي النهر بها."
  en: "Kamandar bint Narsi, cousin of al-Nushajan and lady of the Nahr al-Mar'a palace; she provisioned Abu Musa al-Ash'ari khabis when he lodged there — the canal taking its 'Woman' name from her."
  es: "Kamandar bint Narsi, prima de al-Nushajan y señora del palacio Nahr al-Mar'a, aprovisionó a Abu Musa al-Ash'ari khabis cuando se hospedó allí; el canal debe su nombre a ella, que significa \"Mujer\"."
  fr: "Kamandar bint Narsi, cousine d'al-Nushajan et dame du palais de Nahr al-Mar'a; elle a approvisionné Abu Musa al-Ash'ari khabis lorsqu'il y a séjourné — le canal tirant son nom de « Femme » d'elle."
  ur: "کمندر بنت نرسی، النشاجان کی کزن اور نہر المرعہ محل کی خاتون؛ اس نے ابو موسیٰ اشعری کو خبیث مہیا کیا جب وہ وہاں ٹھہرے - نہر نے اس سے 'عورت' کا نام لیا۔"
  tr: "Kamin Dar bint Narsi, Nahr Al-Mar'ah Sarayı'nın sahibi Al-Nushjan bin Jasnasma'nın kuzeni; Abu Musa Al-Ash'ari oraya yerleştiğinde ona bir kılıç verdi ve nehir onun adını aldı."
  id: "Kamin Dar bint Narsi, sepupu Al-Nushjan bin Jasnasma, pemilik Istana Nahr Al-Mar'ah; ia memberikan Abu Musa Al-Ash'ari sebuah pedang saat ia menetap di sana, dan sungai itu dinamai menurut namanya."
