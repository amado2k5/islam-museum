summary:
  ar: "ريتنو مارسودي (وُلدت ريتنو ليستاري بريانساري في 27 تشرين الثاني 1962 في سمارانغ) دبلوماسية إندونيسية، أول امرأة تتولى وزارة الخارجية الإندونيسية (2014–2024)؛ تخرجت في العلاقات الدولية في جامعة غادجاه مادا سنة 1985، وكانت سفيرة في النرويج وآيسلندا ثم في هولندا، وعُينت سنة 2024 مبعوثة الأمين العام للأمم المتحدة الخاصة للمياه."
  en: "Retno Marsudi (born Retno Lestari Priansari on 27 November 1962 in Semarang) is an Indonesian diplomat, the first woman to serve as Indonesia's minister of foreign affairs (2014-2024); she graduated in international relations from Gadjah Mada University in 1985, was ambassador to Norway and Iceland and then to the Netherlands, and in 2024 was appointed the UN Secretary-General's Special Envoy on Water."
  ur: "ریٹنو مارسودی (پیدائش ریٹنو لیستاری پریانساری، 27 نومبر 1962، سیمارانگ) انڈونیشیائی سفارت کار ہیں، انڈونیشیا کی پہلی خاتون وزیر خارجہ (2014–2024)؛ انھوں نے 1985 میں گادجاہ مادا یونیورسٹی سے بین الاقوامی تعلقات میں گریجویشن کیا، ناروے و آئس لینڈ اور پھر نیدرلینڈز میں سفیر رہیں، اور 2024 میں اقوام متحدہ کے سیکرٹری جنرل کی خصوصی ایلچی برائے پانی مقرر ہوئیں۔"
