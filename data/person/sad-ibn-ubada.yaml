summary:
  ar: سيد الخزرج، شهد العقبة وكان أحد النقباء، واختُلف في شهوده بدراً؛ اشتهر بالجود هو وأبوه وجده وولده، وكانت راية الأنصار معه، وقصة تخلفه عن بيعة أبي بكر مشهورة، ومات بحوران سنة 15هـ أو 16هـ.
  en: The chief of the Khazraj, present at al-Aqaba and one of the twelve naqibs; whether he was at Badr is disputed; he and his father, grandfather and son were famed for generosity, he carried the banner of the Ansar, his holding back from
    the pledge to Abu Bakr is well known, and he died at Hawran in 15 or 16 AH.
