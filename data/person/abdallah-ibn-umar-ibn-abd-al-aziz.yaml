label: { ar: "عبد الله بن عمر بن عبد العزيز", en: "Abdallah ibn Umar ibn Abd al-Aziz", fr: "Abdallah ibn Umar ibn Abd al-Aziz", es: "Abdallah ibn Umar ibn Abd al-Aziz", ur: "عبداللہ بن عمر بن عبدالعزیز" }
summary:
  ar: "عبد الله بن عمر بن عبد العزيز؛ عامل يزيد بن الوليد على الأعمال؛ حفر نهر ابن عمر بالبصرة بعد أن شكا إليه أهلها ملوحة مائهم بقارورتي ماء البصرة والبطيحة وقال لو بلغت نفقته خراج العراق لأنفقته عليه."
  en: "Abdallah ibn Umar ibn Abd al-Aziz; Yazid ibn al-Walid's governor — the two-flask complaint of Basra's brackish water moved him to dig Nahr Ibn Umar: 'were the cost Iraq's whole kharaj, I would spend it'."
  fr: "Abdallah ibn Umar ibn Abd al-Aziz ; gouverneur pour Yazid ibn al-Walid — la plainte des deux flacons sur l'eau saumâtre de Bassora le poussa à creuser le Nahr Ibn Umar : « dût-il coûter tout le kharaj de l'Irak, je le dépenserais »."
  es: "Abdallah ibn Umar ibn Abd al-Aziz, gobernador de Yazid ibn al-Walid, se quejó en dos frascos del agua salobre de Basora y decidió cavar el Nahr. Ibn Umar dijo: \"Si costara todo el kharaj de Irak, lo gastaría\"."
  ur: "عبداللہ بن عمر بن عبد العزیز؛ یزید بن الولید کے گورنر - بصرہ کے کھارے پانی کی دو فلاسک شکایت نے اسے نہر ابن عمر کو کھودنے پر مجبور کیا: 'اگر یہ خرچ عراق کا سارا خرج ہوتا تو میں اسے خرچ کرتا'۔"
  tr: "Yezid bin el-Velid valisi Abdullah bin Ömer bin Abdul Aziz, çalışmaları denetledi; Basra ve El-Batiha sularının tuzluluğundan şikayet eden Basra halkı üzerine İbn Ömer Kanalı'nı kazdırdı ve \"Eğer maliyeti Irak'ın vergi gelirlerine ulaşırsa, hepsini bu işe harcarım\" dedi."
  id: "Abdullah bin Omar bin Abdul Aziz, gubernur Yazid bin Al-Walid, mengawasi pekerjaan tersebut; ia menggali Kanal Ibn Omar di Basra setelah penduduknya mengeluh kepadanya tentang kadar garam air mereka di dua sumber air Basra dan Al-Batiha, dan ia berkata jika biayanya mencapai pendapatan pajak Irak, saya akan membelanjakannya untuk itu."
