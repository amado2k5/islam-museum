label:
  ar: أبو الحسن علي بن مزيد الأسدي
  en: Abu al-Hasan Ali ibn Mazyad al-Asadi
  es: "Abu al-Hasan Ali ibn Mazyad al-Asadi"
  fr: "Abu al-Hasan Ali ibn Mazyad al-Asadi"
  ur: "ابو الحسن علی ابن مازیاد الاسدی"
summary:
  ar: "أبو الحسن علي بن مزيد الأسدي، كبير بني مزيد ومؤسس أمرهم؛ طلب ثأر أخيه أبي الغنائم الذي قُتل سنة 401هـ فهزم بني دبيس وقتل حساناً ونبهان واستولى على الجزيرة الدبيسية، وقلده فخر الدولة أمرها إلا الطيب وقرقوب، ثم ثار به مضر بن دبيس فانتزعها، وتوفي سنة 408هـ وقد قام الأمر في حياته لابنه دبيس فخلع عليه سلطان الدولة وأذن في ولايته. وفي رمضان سنة سبع وتسعين قلد أبا الحسن علي بن مزيد ما كان لقرواش وخلع عليه ولقبه سند الدولة، وفي سنة ثلاث وأربعمائة أرسله فخر الملك في طلب بني خفاجة الذين قطعوا على الحاج بواقصة فلحقهم قرب البصرة وقتل منهم وأسر أبا فليتة ورؤساءهم، وفي سنة ثمان وأربعمائة مرض في طريقه إلى السلطان فعهد إلى ابنه دبيس وتوفي في تلك السنة {cite:muntazam-ibn-al-jawzi j.7 p.235,261,289}."
  en: "Abu al-Hasan Ali ibn Mazyad al-Asadi, chief of Banu Mazyad and founder of their fortune; seeking revenge for his brother Abu al-Ghana'im (killed 401 AH) he defeated Banu Dubays, slew Hasan and Nubhan and took the Dubaysi islands, Fakhr al-Dawla investing him with them save al-Tayyib and Qarqub — until Mudar ibn Dubays retook them; he died in 408 AH having in his lifetime settled the command on his son Dubays, whom the sultan of the state robed and licensed."
  es: "Abu al-Hasan Ali ibn Mazyad al-Asadi, jefe de Banu Mazyad y fundador de su fortuna; buscando venganza por su hermano Abu al-Ghana'im (asesinado en 401 AH), derrotó a Banu Dubays, mató a Hasan y Nubhan y tomó las islas Dubaysi, Fakhr al-Dawla lo investió con ellas excepto al-Tayyib y Qarqub, hasta que Mudar ibn Dubays las retomó; murió en 408 AH habiendo establecido en vida el mando en su hijo Dubays, a quien el sultán del estado vistió y otorgó licencia."
  fr: "Abu al-Hasan Ali ibn Mazyad al-Asadi, chef des Banu Mazyad et fondateur de leur fortune, cherchant à venger son frère Abu al-Ghana'im (tué en 401 AH), vainquit les Banu Dubays, tua Hasan et Nubhan et s'empara des îles Dubaysi, Fakhr al-Dawla lui en confiant le commandement à l'exception d'al-Tayyib et de Qarqub — jusqu'à ce que Mudar ibn Dubays les reprenne; il mourut en 408 AH après avoir, de son vivant, confié le commandement à son fils Dubays, que le sultan de l'État revêtit de la robe et lui accorda une licence."
  ur: "ابو الحسن علی ابن مازیاد الاسدی، بنو مازیاد کے سربراہ اور ان کی خوش قسمتی کے بانی؛ اپنے بھائی ابو الغنائم ⁦(مقتول 401ھ)⁩ کا بدلہ لینے کے لیے اس نے بنو دوبئی کو شکست دی، حسن اور نوبھان کو قتل کر دیا اور دبئی کے جزیروں پر قبضہ کر لیا، فخر الدولہ نے اسے الطیب اور قرقوب کے علاوہ ان کے ساتھ سرمایہ کاری کر دی- یہاں تک کہ مدر ابن دوبس نے ان پر قبضہ کر لیا۔ اس کی وفات 408 ہجری میں ہوئی اور اس نے اپنی زندگی میں ہی اپنے بیٹے دوبئیس کو حکم دیا، جسے ریاست کے سلطان نے لباس پہنایا اور لائسنس دیا تھا۔"
  tr: "Banu Mazid'in reisi ve kurucusu Ebu el-Hasan Ali bin Mazid el-Esadi, 401 Hicri'de öldürülen kardeşi Ebu el-Ganaim için intikam almak istedi. Banu Dubays'ı yendi, Hasan ve Nabhan'ı öldürdü ve Dubaysiya adasını ele geçirdi. Fakhr al-Dawla, onu adayı yönetmesi için atadı, el-Tayyib ve Qarqub hariç. Bunun üzerine Mudar bin Dubays ona karşı isyan etti ve adayı ele geçirdi. 408 Hicri'de öldü. Hayatı boyunca oğlu Dubays tahta geçti, Sultan al-Dawla'yı tahttan indirdi ve valilik izni verdi. Doksan yedinci yılın Ramazanında, Ebu el-Hasan Ali ibn Mazid, Karavaş'a ait olanı atadı, tahttan indirdi ve ona Kum al-Dawla unvanını verdi. Dört yüz otuz üçüncü yılda, Fakhr al-Mulk onu Buaqissa'da el-Hacc'ı kuşatan Banu Hafajah'ı aramaya gönderdi. Onları Basra yakınlarında takip etti, bazılarını öldürdü ve Ebu Falita ile liderlerini esir aldı. Dört yüz sekizinci yılda, sultanlığa giderken hastalandı ve sultanlığa giderken oğlu Dubays'a emanet etti; Dubays o yıl öldü {atıf:Muntazam-ibn-al-jawzi J.7, s.235,261,289}."
  id: "Abu al-Hasan Ali ibn Mazid al-Asadi, kepala dan pendiri Banu Mazid, mencari balas dendam atas saudaranya Abu al-Ghanaim, yang tewas pada tahun 401 H. Ia mengalahkan Banu Dubays, membunuh Hasan dan Nabhan, serta merebut pulau Dubaysiya. Fakhr al-Dawla menunjuknya untuk memerintah pulau itu kecuali al-Tayyib dan Qarqub. Kemudian Mudar ibn Dubays memberontak dan merebutnya. Ia meninggal pada tahun 408 H. Selama hidupnya, putranya Dubays mengambil alih takhta, menggulingkan Sultan al-Dawla, dan memberikan izin untuk menjabat sebagai gubernur. Pada Ramadan tahun sembilan puluh tujuh, Abu al-Hasan Ali ibn Mazid mengangkat wilayah yang sebelumnya milik Qarawash, menggulingkannya, dan memberinya gelar Sand al-Dawla. Pada tahun empat ratus tiga puluh tiga, Fakhr al-Mulk mengirimnya mencari Banu Khafajah, yang telah mengepung al-Hajj di Buaqissa. Ia mengejar mereka di dekat Basra, membunuh beberapa dari mereka, dan menangkap Abu Falita beserta para pemimpinnya. Pada tahun empat ratus delapan, ia jatuh sakit dalam perjalanan ke kesultanan, sehingga ia mempercayakannya kepada putranya Dubays, yang meninggal pada tahun itu {cite:Muntazam-ibn-al-jawzi J.7, hlm.235,261,289}."
