label:
  ar: أبو الحسن علي بن مزيد الأسدي
  en: Abu al-Hasan Ali ibn Mazyad al-Asadi
summary:
  ar: "أبو الحسن علي بن مزيد الأسدي، كبير بني مزيد ومؤسس أمرهم؛ طلب ثأر أخيه أبي الغنائم الذي قُتل سنة 401هـ فهزم بني دبيس وقتل حساناً ونبهان واستولى على الجزيرة الدبيسية، وقلده فخر الدولة أمرها إلا الطيب وقرقوب، ثم ثار به مضر بن دبيس فانتزعها، وتوفي سنة 408هـ وقد قام الأمر في حياته لابنه دبيس فخلع عليه سلطان الدولة وأذن في ولايته."
  en: "Abu al-Hasan Ali ibn Mazyad al-Asadi, chief of Banu Mazyad and founder of their fortune; seeking revenge for his brother Abu al-Ghana'im (killed 401 AH) he defeated Banu Dubays, slew Hasan and Nubhan and took the Dubaysi islands, Fakhr al-Dawla investing him with them save al-Tayyib and Qarqub — until Mudar ibn Dubays retook them; he died in 408 AH having in his lifetime settled the command on his son Dubays, whom the sultan of the state robed and licensed."
