summary:
  ar: "رائد أعمال ومحسن بريطاني، وُلد سنة 1975 في غوجارات بالهند. تخرّج في جامعة مانشستر وتدرّب في ديلويت ثم أسّس شركة 1st Ethical سنة 2001، أول شركة خدمات مالية متوافقة مع الشريعة مرخّصة في بريطانيا، ومجموعة OneE الاستشارية؛ وفي سنة 2014 اعتزل العمل التجاري ليتفرغ للعمل الخيري وأسّس منظمة MEND لمكافحة الإسلاموفوبيا ورفع الوعي الإعلامي والسياسي لدى مسلمي بريطانيا."
  en: "British serial entrepreneur and philanthropist, born 2 September 1975 in Gujarat, India. A University of Manchester graduate who trained at Deloitte, he founded 1st Ethical in 2001 — the UK's first FSA-authorised Shariah-compliant financial services firm — and the OneE consultancy group; in 2014 he retired from full-time business to found MEND ⁦(Muslim Engagement and Development)⁩, the advocacy group tackling Islamophobia and building media and political literacy among British Muslims."
  ur: "برطانوی سلسلہ وار کاروباری اور مخیر شخصیت، 2 ستمبر 1975 کو بھارت کے گجرات میں پیدا ہوئے۔ یونیورسٹی آف مانچسٹر سے فارغ التحصیل اور ڈیلوائٹ میں تربیت کے بعد 2001 میں 1st Ethical قائم کی — برطانیہ کی پہلی FSA سے منظور شدہ شریعتی مالیاتی کمپنی — اور کنسلٹنسی گروپ OneE؛ 2014 میں مکمل کاروبار سے ریٹائر ہو کر MEND قائم کی، جو اسلاموفوبیا کے مقابلہ اور برطانوی مسلمانوں کی میڈیا و سیاسی شعور کے لیے کام کرتی ہے۔"
  es: "Emprendedor y filántropo británico, nacido el 2 de septiembre de 1975 en Gujarat, India. Graduado por la Universidad de Manchester y formado en Deloitte, fundó 1st Ethical en 2001 —la primera empresa de servicios financieros del Reino Unido autorizada por la FSA y que cumple con la ley islámica— y el grupo de consultoría OneE; en 2014 se retiró de su actividad empresarial a tiempo completo para fundar MEND (Muslim Engagement and Development), el grupo de defensa que lucha contra la islamofobia y fomenta la alfabetización mediática y política entre los musulmanes británicos."
