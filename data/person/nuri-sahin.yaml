summary:
  ar: "مدرب كرة قدم تركي-ألماني ولاعب وسط سابق، وُلد في لودنشايد بألمانيا سنة 1988 لأبوين تركيين. أصغر لاعب ثم أصغر هداف في تاريخ البوندسليغا مع بوروسيا دورتموند، وفاز معه بالدوري سنة 2011، وانتقل إلى ريال مدريد ثم عاد إلى دورتموند، ولعب بعدها لفيردر بريمن وأنطاليا سبور. درّب أنطاليا سبور وبوروسيا دورتموند ويقود حاليًا إسطنبول باشاك شهير، وخاض 52 مباراة دولية مع منتخب تركيا."
  en: "Turkish-German football manager and former midfielder, born in Lüdenscheid, Germany, in 1988 to Turkish parents. He became the youngest player and then the youngest scorer in Bundesliga history with Borussia Dortmund, won the Bundesliga with them in 2011, moved to Real Madrid and returned to Dortmund, and later played for Werder Bremen and Antalyaspor. As a coach he has managed Antalyaspor and Borussia Dortmund and now leads İstanbul Başakşehir; he earned 52 caps for Turkey."
  ur: "ترک-جرمن فٹبال مینیجر اور سابق مڈفیلڈر، 1988 میں جرمنی کے شہر لوڈنشائیڈ میں ترک والدین کے ہاں پیدا ہوئے۔ وہ بوروسیا ڈورٹمنڈ کے ساتھ بنڈس لیگا کی تاریخ کے سب سے کم عمر کھلاڑی اور پھر سب سے کم عمر گول اسکورر بنے، 2011 میں ان کے ساتھ بنڈس لیگا جیتا، ریئل میڈرڈ گئے اور ڈورٹمنڈ واپس آئے، اور بعد میں ویردر بریمن اور انطالیا سپور کے لیے کھیلے۔ کوچ کے طور پر انطالیا سپور اور بوروسیا ڈورٹمنڈ کی سربراہی کی اور اب استنبول باشاک شہر کی قیادت کر رہے ہیں؛ ترکی کے لیے 52 بین الاقوامی میچ کھیلے۔"
