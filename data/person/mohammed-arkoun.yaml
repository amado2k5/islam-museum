summary:
  ar: "محمد أركون ⁦(1928–2010)⁩ فيلسوف ومؤرخ جزائري-فرنسي، أستاذ تاريخ الفكر الإسلامي بالسوربون، طبّق أدوات النقد الحديث على الدراسات الإسلامية في مشروع «نقد العقل الإسلامي». من كتبه «Pour une critique de la raison islamique» و«Rethinking Islam»."
  en: "Mohammed Arkoun (1928–2010) was an Algerian-French philosopher and historian of Islamic thought, professor at the Sorbonne, who applied the tools of modern criticism to Islamic studies in his 'critique of Islamic reason' project. His books include Pour une critique de la raison islamique and Rethinking Islam."
  ur: "محمد ارکون ⁦(1928–2010)⁩ الجزائری-فرانسیسی فلسفی اور اسلامی فکر کے مؤرخ تھے، سوربون کے پروفیسر، جنہوں نے «نقد العقل الإسلامي» کے منصوبے میں جدید تنقید کے اوزار اسلامی مطالعات پر استعمال کیے۔ کتب میں Pour une critique de la raison islamique اور Rethinking Islam شامل ہیں۔"
  es: "Mohammed Arkoun (1928-2010) fue un filósofo e historiador del pensamiento islámico argelino-francés, profesor de la Sorbona, que aplicó las herramientas de la crítica moderna a los estudios islámicos en su proyecto «Crítica de la razón islámica». Entre sus libros destacan Pour une critique de la raison islamique y Rethinking Islam."
