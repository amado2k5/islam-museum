  ar: "بركات بن محمد، شريف مكة المكرمة. لما بلغه مقتل السلطان المملوكي قانصوه الغوري ونائبه طومان باي بيد العثمانيين بادر بتقديم السمع والطاعة إلى السلطان سليم الأول وسلّمه مفاتيح الكعبة وبعض الآثار، فأقره سليم شريفاً للحجاز أميراً على مكة والحجاز ومنحه صلاحيات واسعة {cite:dawlat-uthmaniyya-salabi p. 191}."
