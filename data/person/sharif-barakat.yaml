summary:
  ar: "بركات بن محمد، شريف مكة المكرمة. لما بلغه مقتل السلطان المملوكي قانصوه الغوري ونائبه طومان باي بيد العثمانيين بادر بتقديم السمع والطاعة إلى السلطان سليم الأول وسلّمه مفاتيح الكعبة وبعض الآثار، فأقره سليم شريفاً للحجاز أميراً على مكة والحجاز ومنحه صلاحيات واسعة {cite:dawlat-uthmaniyya-salabi p. 191}."
  en: "Barakat ibn Muhammad, Sharif of Mecca — on hearing of the Mamluk defeat he submitted to Selim I and handed him the keys of the Kaaba; Selim confirmed him as emir of Mecca and the Hijaz with wide powers {cite:dawlat-uthmaniyya-salabi p. 191}."
  es: "Barakat ibn Muhammad, Sharif de La Meca, al enterarse de la derrota de los mamelucos, se sometió a Selim I y le entregó las llaves de la Kaaba; Selim lo confirmó como emir de La Meca y el Hiyaz con amplios poderes {cite:dawlat-uthmaniyya-salabi p. 191}."
  fr: "Barakat ibn Muhammad, Sharif de La Mecque — apprenant la défaite des Mamelouks, il se soumit à Selim I et lui remit les clés de la Kaaba; Selim le confirma comme émir de La Mecque et du Hedjaz avec de larges pouvoirs {cite:dawlat-uthmaniyya-salabi p. 191}."
  ur: "برکات بن محمد، شریف مکہ - مملوک کی شکست کی خبر سن کر اس نے سلیم اول کے سامنے عرض کیا اور اسے کعبہ کی چابیاں دیں۔ سیلم نے وسیع اختیارات کے ساتھ انہیں مکہ اور حجاز کا امیر قرار دیا {حوالہ: دولت عثمانیہ صلابی ص۔ 191}۔"
  tr: "Barakat bin Muhammed, Mekke'nin Şerifi. Memlük Sultanı Qansuh al-Ghuri ve yardımcısı Tuman Bey'in Osmanlılar tarafından öldürüldüğünü öğrenince, hemen Sultan Selim I'e boyun eğdi, Selim de Kabe'nin anahtarlarını ve bazı kutsal emanetleri ona verdi. Selim, onu Hicaz Şerifi olarak Mekke ve Hicaz Emiri olarak atadı ve geniş yetkiler verdi {cite:dawlat-uthmaniyya-salabi, s. 191}."
  id: "Barakat bin Muhammad, Sharif Mekah. Ketika ia mengetahui pembunuhan Sultan Mamluk Qansuh al-Ghuri dan wakilnya Tuman Bey oleh tangan Ottoman, ia segera tunduk kepada Sultan Selim I, yang memberinya kunci Ka'bah dan beberapa relik. Selim mengangkatnya sebagai Sharif Hijaz sebagai Emir Mekah dan Hijaz serta memberinya kekuasaan luas {cite:dawlat-uthmaniyya-salabi, hlm. 191}."
