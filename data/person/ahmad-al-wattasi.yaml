  ar: "الملك الوطاسي الذي تلقى هزيمة سنة ٩٤٣هـ/١٥٣٦م من السعديين في موقعة بئر عقبة قرب وادي العبيد بسبب تخلي قبائل الخلوط التي كانت القوة الأمامية لجيشه. قرّبته الهزيمة من البرتغال فوقّع معها معاهدة أحد عشر عاماً تضع المغاربة المقيمين في ضواحي أصيلا وطنجة والقصر الصغير تحت قضاء ملك فاس وتحظر شراء الغنائم المأخوذة من المغاربة من المراكب العثمانية والفرنسية {cite:dawlat-uthmaniyya-salabi p. 221-222}."
  en: "The Wattasid king defeated by the Sa'dis at Bi'r 'Uqba near Wadi al-'Abid in 943/1536 when the Khalut tribes deserted his vanguard; the defeat pushed him toward Portugal, with whom he signed an eleven-year treaty placing Moroccans around Asilah, Tangier and Qasr al-Saghir under Fas's jurisdiction and barring purchase of booty from Ottoman or French ships {cite:dawlat-uthmaniyya-salabi p. 221-222}."
