summary:
  ar: "الملك الوطاسي الذي تلقى هزيمة سنة ٩٤٣هـ/١٥٣٦م من السعديين في موقعة بئر عقبة قرب وادي العبيد بسبب تخلي قبائل الخلوط التي كانت القوة الأمامية لجيشه. قرّبته الهزيمة من البرتغال فوقّع معها معاهدة أحد عشر عاماً تضع المغاربة المقيمين في ضواحي أصيلا وطنجة والقصر الصغير تحت قضاء ملك فاس وتحظر شراء الغنائم المأخوذة من المغاربة من المراكب العثمانية والفرنسية {cite:dawlat-uthmaniyya-salabi p. 221-222}."
  en: "The Wattasid king defeated by the Sa'dis at Bi'r 'Uqba near Wadi al-'Abid in 943/1536 when the Khalut tribes deserted his vanguard; the defeat pushed him toward Portugal, with whom he signed an eleven-year treaty placing Moroccans around Asilah, Tangier and Qasr al-Saghir under Fas's jurisdiction and barring purchase of booty from Ottoman or French ships {cite:dawlat-uthmaniyya-salabi p. 221-222}."
  fr: "Roi wattasside vaincu par les Saadiens à Bi'r 'Uqba près de Wadi al-'Abid en 943 H/1536 ap. J.-C., lorsque les tribus Khalut désertèrent son avant-garde. La défaite le poussa vers le Portugal, avec lequel il conclut un traité de onze ans plaçant les Marocains des environs d'Asilah, de Tanger et de Qasr al-Saghir sous la juridiction de Fès et interdisant l'achat de butin auprès de navires ottomans ou français {cite:dawlat-uthmaniyya-salabi p. 221-222}."
  es: "El rey Wattasid fue derrotado por los Sa'dis en Bi'r 'Uqba, cerca de Wadi al-'Abid, en 943/1536, cuando las tribus Khalut desertaron de su vanguardia; la derrota lo empujó hacia Portugal, con quien firmó un tratado de once años que colocaba a los marroquíes de los alrededores de Asilah, Tánger y Qasr al-Saghir bajo la jurisdicción de Fas y prohibía la compra de botín de barcos otomanos o franceses {cite:dawlat-uthmaniyya-salabi p. 221-222}."
  ur: "وطاصد بادشاہ نے 943/1536 میں وادی العابد کے قریب بئر عقبہ میں سعدیوں کے ہاتھوں شکست کھائی جب خلوت قبائل نے اس کے ہراول دستے کو چھوڑ دیا۔ شکست نے اسے پرتگال کی طرف دھکیل دیا، جس کے ساتھ اس نے گیارہ سالہ معاہدے پر دستخط کیے جس کے تحت اسیلہ، تانگیر اور قصر الصغیر کے گرد مراکش کو فاس کے دائرہ اختیار میں رکھا گیا اور عثمانی یا فرانسیسی بحری جہازوں سے مال غنیمت کی خریداری پر پابندی لگا دی گئی۔ 221-222}۔"
