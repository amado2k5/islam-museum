gender: male
roles: []
summary:
  ar: "حلقة في القسم المختلف فيه من النسب النبوي بين عدنان وإسماعيل؛ يذكره ابن إسحاق والطبري وابن سعد في سلسلة «عدنان بن أُدّ بن أدد بن الحميسع…» الصاعدة إلى قيدار بن إسماعيل {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad}، وهو القسم الذي جمعه المنصورفوري عن الكلبي وابن سعد مع كثرة الاختلاف بين الروايات {cite:mubarakpuri-raheeq p.48-49}."
  en: "A link in the disputed part of the Prophet's lineage between Adnan and Ismail, in the chain «Adnan ibn Udd ibn Adad ibn al-Humaysa…» up to Qaydar ibn Ismail, as transmitted by Ibn Ishaq, al-Tabari and Ibn Sa'd {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad} — the part al-Mansurfuri compiled from al-Kalbi and Ibn Sa'd amid wide disagreement among the versions {cite:mubarakpuri-raheeq p.48-49}."
  es: "Un vínculo en la parte disputada del linaje del Profeta entre Adnan e Ismail, en la cadena «Adnan ibn Udd ibn Adad ibn al-Humaysa…» hasta Qaydar ibn Ismail, según lo transmitido por Ibn Ishaq, al-Tabari e Ibn Sa'd {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad} — la parte que al-Mansurfuri compiló de al-Kalbi e Ibn Sa'd en medio de un amplio desacuerdo entre las versiones {cite:mubarakpuri-raheeq p.48-49}."
  fr: "Un maillon de la chaîne contestée de la lignée du Prophète entre Adnan et Ismail, dans la chaîne « Adnan ibn Udd ibn Adad ibn al-Humaysa… » jusqu'à Qaydar ibn Ismail, telle que transmise par Ibn Ishaq, al-Tabari et Ibn Sa'd {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad} — la partie compilée par al-Mansurfuri à partir d'al-Kalbi et d'Ibn Sa'd, malgré de larges divergences entre les versions {cite:mubarakpuri-raheeq p.48-49}."
  ur: "عدنان اور اسماعیل کے درمیان نبی کے نسب کے متنازعہ حصے کا ایک ربط، سلسلہ «عدنان ابن عود ابن عد بن الحمیصہ...» میں قیر ابن اسماعیل تک، جیسا کہ ابن اسحاق، الطبری اور ابن سعد نے نقل کیا ہے {حوالہ: ابن ہشام/1-4} {حوالہ:تاریخ الطبری} {حوالہ:طبقات ابن سعد} — المنصورفوری کا حصہ الکلبی اور ابن سعد سے مرتب کیا گیا ہے جس میں نسخوں کے درمیان وسیع اختلاف ہے۔"
  tr: "Peygamberlik soyunun tartışmalı bölümünde Adnan ile İsmail arasında bir bağlantı; İbn İshak, Taberi ve İbn Saad tarafından “Adnan bin Ud bin Adad bin Al-Humaysa…”dan Kaydar bin İsmail'e uzanan rivayet zincirinde zikredilmiştir {kaynak:ibn-hisham-sira 1/1-4} {kaynak:tarikh-al-tabari} {kaynak:tabaqat-ibn-sad} ve bu bölüm, Al-Mansurfuri'nin Al-Kalbi ve İbn Saad'dan derlediği ve rivayetler arasında birçok farklılık bulunan bölümdür {kaynak:mubarakpuri-raheeq s.48-49}."
  id: "Sebuah mata rantai dalam bagian silsilah kenabian yang diperselisihkan antara Adnan dan Ismail; disebutkan oleh Ibn Ishaq, Al-Tabari dan Ibn Saad dalam rantai “Adnan bin Ud bin Adad bin Al-Humaysa…” yang naik ke Qaydar bin Ismail {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad}, dan merupakan bagian yang dikumpulkan oleh Al-Mansurfuri dari Al-Kalbi dan Ibn Saad dengan banyak perbedaan di antara riwayat-riwayat tersebut {cite:mubarakpuri-raheeq p.48-49}."
