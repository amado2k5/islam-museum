label: { ar: "عمر بن أبي سلمة", en: "Umar ibn Abi Salama", es: "Umar ibn Abi Salama", fr: "Umar ibn Abi Salama", ur: "عمر بن ابی سلمہ" }
summary:
  ar: "عمر بن أبي سلمة ربيب النبي؛ فرض له عمر أربعة آلاف فاحتج محمد بن عبد الله بن جحش فقال عمر أفضله لكانه من النبي فليأت الذي يستغيث بأم مثل أم سلمة أغيثه."
  en: "Umar ibn Abi Salama, the Prophet's step-son; given four thousand he was defended by Umar — 'I favor his nearness: bring a mother like Umm Salama'."
  es: "Umar ibn Abi Salama, hijastro del Profeta; dados cuatro mil, fue defendido por Umar: \"Prefiero su cercanía: trae una madre como Umm Salama\"."
  fr: "Umar ibn Abi Salama, le beau-fils du Prophète; on lui donna quatre mille et il fut défendu par Umar — « Je préfère sa proximité: amenez une mère comme Umm Salama »."
  ur: "عمر بن ابی سلمہ، رسول اللہ کے سوتیلے بیٹے؛ چار ہزار دے کر عمر نے اس کا دفاع کیا - 'میں اس کے قرب کا حامی ہوں: ام سلمہ جیسی ماں لاؤ'۔"
  tr: "Peygamber'in üvey babası Ömer bin Ebi Selame; Ömer ona dört bin vermiştir. Muhammed ibn Abdullah ibn Jahsh itiraz etti ve Ömer dedi ki: En iyisi, Peygamber'den gelmiş gibidir. Um Selama gibi bir anneden yardım isteyen ona yardım etsin."
  id: "Umar ibn Abi Salamah, ayah tiri Nabi; Umar mewajibkan dia empat ribu. Muhammad ibn Abdullah ibn Jahsh berdebat, dan Umar berkata: Yang terbaik adalah seolah-olah dia berasal dari Nabi. Siapa yang mencari pertolongan dari ibu seperti um Salama membantunya."
