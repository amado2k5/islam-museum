summary:
  ar: "فريد الدين مسعود گنج شكر، المعروف بابا فريد ⁦(ت 1266)⁩ صوفي بنجابي وشاعر وواعظ، من مؤسسي الطريقة الجشتية ورئيسها بعد شيخه قطب الدين بختيار كاكي، استقر في أجودهن ⁦(باك بتن)⁩، وكان نظام الدين أولياء أشهر مريديه وخليفته."
  en: "Farid al-Din Mas'ud Ganjshakar, known as Baba Farid (died 1266), was a Punjabi Sufi mystic, poet and preacher, one of the founding fathers of the Chishti order and its head after his teacher Qutbuddin Bakhtiar Kaki; he settled at Ajodhan (Pakpattan), and Nizamuddin Auliya was his most prominent disciple and successor."
  ur: "فرید الدین مسعود گنج شکر، معروف بابا فرید (وفات 1266ء) پنجابی صوفی، شاعر اور مبلغ تھے، سلسلہ چشتیہ کے بانیوں میں سے ایک اور اپنے شیخ قطب الدین بختیار کاکی کے بعد اس کے سربراہ؛ وہ اجودھن (پاکپتن) میں مقیم ہوئے اور نظام الدین اولیاء ان کے مشہور ترین مرید و خلیفہ تھے۔"
