summary:
  ar: "الملا حسن بن عبد الصمد الساموني؛ قال في الشقائق كان عالماً فاضلاً محباً للفقراء والمساكين ومريد المشايخ المتصوفة، قرأ على علماء الروم ثم وصل إلى خدمة الملا خسرو وحصل جميع العلوم أصليها وفرعيها وعقليها وشرعيها، ثم صار مدرساً ببعض المدارس ثم انتقل إلى إحدى المدارس الثمان، ثم صار معلماً للسلطان محمد خان الفاتح، ثم جعله قاضياً بالعسكر المنصور ثم قاضياً بمدينة قسطنطينية، وكان مرضي السيرة محمود الطريقة في قضائه سليم الطبع قوي الإسلام متشرعاً متورعاً، وكتب بخطه كثيراً، توفي سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 420-421}."
  en: "In the service of Molla Khosrow he acquired 'all the sciences, root and branch, rational and legal'; teacher in the madrasas then one of the Eight, tutor to Mehmed II, judge of the victorious army then qadi of Constantinople — of upright conduct and sound nature, scrupulous, a prolific copyist; d. 901 {cite:shadharat-dhahab p. 420-421}."
