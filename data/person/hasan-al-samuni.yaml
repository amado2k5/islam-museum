summary:
  ar: "الملا حسن بن عبد الصمد الساموني؛ قال في الشقائق كان عالماً فاضلاً محباً للفقراء والمساكين ومريد المشايخ المتصوفة، قرأ على علماء الروم ثم وصل إلى خدمة الملا خسرو وحصل جميع العلوم أصليها وفرعيها وعقليها وشرعيها، ثم صار مدرساً ببعض المدارس ثم انتقل إلى إحدى المدارس الثمان، ثم صار معلماً للسلطان محمد خان الفاتح، ثم جعله قاضياً بالعسكر المنصور ثم قاضياً بمدينة قسطنطينية، وكان مرضي السيرة محمود الطريقة في قضائه سليم الطبع قوي الإسلام متشرعاً متورعاً، وكتب بخطه كثيراً، توفي سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 420-421}."
  en: "In the service of Molla Khosrow he acquired 'all the sciences, root and branch, rational and legal'; teacher in the madrasas then one of the Eight, tutor to Mehmed II, judge of the victorious army then qadi of Constantinople — of upright conduct and sound nature, scrupulous, a prolific copyist; d. 901 {cite:shadharat-dhahab p. 420-421}."
  es: "Al servicio de Molla Khosrow adquirió «todas las ciencias, de raíz y rama, racionales y legales»; maestro en las madrasas, luego uno de los Ocho, tutor de Mehmed II, juez del ejército victorioso, luego cadí de Constantinopla; de conducta recta y naturaleza sana, escrupuloso, un copista prolífico; murió en 901 {cita: shadharat-dhahab págs. 420-421}."
  fr: "Au service de Molla Khosrow, il acquit « toutes les sciences, de la racine à la branche, rationnelles et juridiques »; enseignant dans les madrasas, puis l'un des Huit, précepteur de Mehmed II, juge de l'armée victorieuse, puis cadi de Constantinople — d'une conduite droite et d'une nature saine, scrupuleux, un copiste prolifique; mort en 901 {cite: shadharat-dhahab p. 420-421}."
  ur: "مولا خسرو کی خدمت میں اس نے 'تمام علوم، جڑ اور شاخ، عقلی اور قانونی' حاصل کیے۔ مدرسوں میں استاد پھر آٹھوں میں سے ایک، محمد دوم کا ٹیوٹر، فاتح فوج کا قاضی پھر قسطنطنیہ کا قاضی - راست اخلاق اور اچھی فطرت کا، بے غیرت، ایک زبردست نقل کرنے والا؛ d 901 {حوالہ: شدھارت ذہاب ص۔ 420-421}۔"
  tr: "Mele Hasan bin Abdülsamad el-Samuni Al-Shaqa'iq'ta şöyle demiştir: O, fakirleri ve muhtaçları seven erdemli bir âlimdi ve Sufi şeyhlerinin öğrencisiydi. Roma âlimlerinin yanında eğitim aldı, sonra Mele Hüzrav'ın hizmetine geçti ve tüm bilimleri—orijinal, dal, rasyonel ve hukuk bilimlerini edindi. Daha sonra bazı okullarda öğretmen oldu, ardından sekiz okuldan birine geçti, ardından Fatih Sultan Muhammed Han'ın öğretmeni oldu, ardından onu Al-Mansur ordusunda yargıç, ardından İstanbul şehrinde yargıç olarak atadı. Sufi tarikatının iyi terbiyeli bir yargıcı, yargısında güçlü, güçlü bir İslam âlimi, hukuki ve dindar biriydi ve el yazısıyla çokça yazdı. 901 yılında vefat etti {atıf: shadharat-dhahab, s. 420-421}."
  id: "Mulla Hassan bin Abd al-Samad al-Samuni berkata dalam Al-Shaqa'iq: Ia adalah ulama yang berbudi luhur yang mencintai orang miskin dan membutuhkan, serta murid para sheikh Sufi. Ia belajar di bawah bimbingan ulama Romawi, kemudian melayani Mulla Khusraw, memperoleh semua ilmu—ilmu asli, cabang, rasional, dan ilmu hukum. Ia kemudian menjadi guru di beberapa sekolah, kemudian pindah ke salah satu dari delapan sekolah, kemudian menjadi guru Sultan Muhammad Sang Penakluk, kemudian mengangkatnya sebagai hakim di militer Al-Mansur, lalu hakim di kota Konstantinopel. Ia adalah hakim sopan dari tarekat Sufi, kuat dalam peradilannya, ulama Islam yang kuat, taat dan saleh, serta menulis banyak dengan tulisan tangannya. Ia wafat pada tahun 901 {cite:shadharat-dhahab, hlm. 420-421}."
