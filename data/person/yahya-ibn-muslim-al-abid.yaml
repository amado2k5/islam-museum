summary:
  ar: "أبو زكريا العابد، سمع وهب بن جرير، روى عنه ابن مخلد وكان ثقة زاهدًا؛ حكى أن فتى كان يتنسك مع بشر بن الحارث فسأله أين تنزل فقال بدرب البقر فقال بشر: أين أنت من منزل ذلك العابد يحيى بن مسلم؟ فاقرأ عليه مني السلام؛ وكان يحيى يردّ عليه تحيته بيده، ثم رآه مرة فلم يكلمه فالتفت إليه فإذا هو قائم ملتفت ينظر إليه؛ توفي في جمادى الآخرة سنة ثلاث وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 133}."
  en: "Abu Zakariya the ascetic, transmitter from Wahb ibn Jarir; the youth who kept company with Bishr al-Hafi lived in his quarter, and Bishr sent his greeting to him. He died in Jumada II 263 {cite:muntazam-ibn-al-jawzi p. 133}."
  es: "Abu Zakariya el asceta, transmisor de Wahb ibn Jarir, el joven que frecuentaba a Bishr al-Hafi, vivía en su mismo barrio, y Bishr le envió saludos. Murió en Jumada II 263 {cite:muntazam-ibn-al-jawzi p. 133}."
  fr: "Abou Zakariya l'ascète, transmetteur de Wahb ibn Jarir, le jeune homme qui fréquentait Bishr al-Hafi, vivait dans son quartier et Bishr lui adressa ses salutations. Il mourut en Jumada II 263 (cf. Muntazam ibn al-Jawzi, p. 133)."
  ur: "ابو زکریا سنیاسی، وہب بن جریر سے ٹرانسمیٹر؛ جو نوجوان بشر الحفی کی صحبت میں تھا وہ ان کے کوارٹر میں رہتا تھا اور بشر نے ان کو سلام بھیجا۔ آپ کی وفات جمادی الثانی 263 میں ہوئی۔ 133}۔"
