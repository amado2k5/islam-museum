summary:
  ar: "أبو زكريا العابد، سمع وهب بن جرير، روى عنه ابن مخلد وكان ثقة زاهدًا؛ حكى أن فتى كان يتنسك مع بشر بن الحارث فسأله أين تنزل فقال بدرب البقر فقال بشر: أين أنت من منزل ذلك العابد يحيى بن مسلم؟ فاقرأ عليه مني السلام؛ وكان يحيى يردّ عليه تحيته بيده، ثم رآه مرة فلم يكلمه فالتفت إليه فإذا هو قائم ملتفت ينظر إليه؛ توفي في جمادى الآخرة سنة ثلاث وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 133}."
  en: "Abu Zakariya the ascetic, transmitter from Wahb ibn Jarir; the youth who kept company with Bishr al-Hafi lived in his quarter, and Bishr sent his greeting to him. He died in Jumada II 263 {cite:muntazam-ibn-al-jawzi p. 133}."
