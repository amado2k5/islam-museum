summary:
  ar: "ولي عهد أفغانستان (شاهزاده)، الابن الثاني للأمير عبد الرحمن خان، وأمير البلاد لأسبوع واحد (21-28 فبراير 1919) عقب اغتيال أخيه الأكبر حبيب الله خان. كان القائد العام للجيش ورئيس مجلس الدولة في عهد أخيه وأبرز محافظي البلاط دينيا؛ فخلعه ابن أخيه أمان الله، وأُدين بأدلة ملفقة بالضلوع في الاغتيال، وقُتل في سجن القصر بكابل سنة 1920."
  en: "Shahzada (crown prince) of Afghanistan, second son of Emir Abdur Rahman Khan, and Emir for one week, 21–28 February 1919, after the assassination of his elder brother Habibullah Khan. Commander-in-chief and president of the State Council under his brother, and the court's leading religious conservative, he was deposed by his nephew Amanullah, convicted on manufactured evidence of complicity in the assassination, and killed in the royal jail at Kabul in 1920."
  ur: "افغانستان کے شہزادے (ولی عہد)، امیر عبد الرحمٰن خان کے دوسرے بیٹے، اور بڑے بھائی حبیب اللہ خان کے قتل کے بعد ایک ہفتے (21–28 فروری 1919ء) کے لیے افغانستان کے امیر۔ بھائی کے عہد میں سپہ سالار اور مجلسِ ریاست کے صدر اور دربار کے نمایاں دینی قدامت پسند رہنما تھے؛ بھتیجے امان اللہ نے انہیں معزول کیا، قتل میں ملوث ہونے کے من گھڑت شواہد پر سزا ہوئی اور 1920ء میں کابل کے شاہی قید خانے میں قتل کر دیے گئے۔"
