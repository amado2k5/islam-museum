summary:
  ar: "لاعب كريكت جنوب أفريقي، وُلد في جوهانسبرغ سنة 1990. رامٍ يدور الكرة بالمعصم بالذراع اليسرى على الطريقة غير المألوفة، ظهر دوليا مع جنوب أفريقيا سنة 2016 في مباريات اليوم الواحد والاختبار، وهو أكثر آخذي الويكيت في تاريخ جنوب أفريقيا في العشرينيات الدولية، وتصدّر تصنيف المجلس الدولي لراميي العشرينيات في مارس 2021، وأخذ أول خمسة ويكيت له في مباريات اليوم الواحد أمام سريلانكا في سبتمبر 2021 وخمسة ويكيت أمام إنجلترا سنة 2022 تجاوز بها ديل ستاين في صدارة ويكيت جنوب أفريقيا في العشرينيات، واشتهر باحتفالاته المتحمسة عند أخذ الويكيت، ويلعب في دوريات الامتياز حول العالم منها الدوري الباكستاني الممتاز ودوري بيغ باش الأسترالي."
  en: "South African cricketer, born in Johannesburg in 1990. A left-arm unorthodox wrist-spin bowler, he made his international debut for South Africa in 2016 in both One Day Internationals and Tests, is South Africa's highest wicket-taker in Twenty20 Internationals, topped the ICC T20I bowling rankings in March 2021, took his first ODI five-wicket haul against Sri Lanka in September 2021 and a T20I five-for against England in 2022 that carried him past Dale Steyn as South Africa's leading T20I wicket-taker, is known for his passionate wicket celebrations, and plays in franchise leagues worldwide including the Pakistan Super League and Australia's Big Bash League."
  ur: "جنوبی افریقی کرکٹ کھلاڑی، جو 1990 میں جوہانسبرگ میں پیدا ہوئے۔ بائیں ہاتھ سے غیر روایتی کلائی اسپن گیند بازی کرنے والے کھلاڑی کی حیثیت سے انھوں نے 2016 میں جنوبی افریقہ کے لیے ایک روزہ اور ٹیسٹ دونوں میں بین الاقوامی آغاز کیا، وہ ٹی ٹوئنٹی بین الاقوامی کرکٹ میں جنوبی افریقہ کے سب سے زیادہ وکٹیں لینے والے گیند باز ہیں، مارچ 2021 میں آئی سی سی ٹی ٹوئنٹی گیند بازوں کی درجہ بندی میں سرفہرست رہے، ستمبر 2021 میں سری لنکا کے خلاف اپنی پہلی ایک روزہ پانچ وکٹیں لیں اور 2022 میں انگلینڈ کے خلاف ٹی ٹوئنٹی میں پانچ وکٹیں لے کر ڈیل اسٹین کو پیچھے چھوڑ کر جنوبی افریقہ کے سب سے زیادہ ٹی ٹوئنٹی وکٹیں لینے والے گیند باز بن گئے، وکٹ پر پرجوش جشن کے لیے مشہور ہیں، اور پاکستان سپر لیگ اور آسٹریلیا کی بگ بیش لیگ سمیت دنیا بھر کی فرنچائز لیگز میں کھیلتے ہیں۔"
