summary:
  ar: "لاعب كريكت جنوب أفريقي، وُلد في جوهانسبرغ سنة 1990. رامٍ يدور الكرة بالمعصم بالذراع اليسرى على الطريقة غير المألوفة، ظهر دوليا مع جنوب أفريقيا سنة 2016 في مباريات اليوم الواحد والاختبار، وهو أكثر آخذي الويكيت في تاريخ جنوب أفريقيا في العشرينيات الدولية، وتصدّر تصنيف المجلس الدولي لراميي العشرينيات في مارس 2021، وأخذ أول خمسة ويكيت له في مباريات اليوم الواحد أمام سريلانكا في سبتمبر 2021 وخمسة ويكيت أمام إنجلترا سنة 2022 تجاوز بها ديل ستاين في صدارة ويكيت جنوب أفريقيا في العشرينيات، واشتهر باحتفالاته المتحمسة عند أخذ الويكيت، ويلعب في دوريات الامتياز حول العالم منها الدوري الباكستاني الممتاز ودوري بيغ باش الأسترالي."
  en: "South African cricketer, born in Johannesburg in 1990. A left-arm unorthodox wrist-spin bowler, he made his international debut for South Africa in 2016 in both One Day Internationals and Tests, is South Africa's highest wicket-taker in Twenty20 Internationals, topped the ICC T20I bowling rankings in March 2021, took his first ODI five-wicket haul against Sri Lanka in September 2021 and a T20I five-for against England in 2022 that carried him past Dale Steyn as South Africa's leading T20I wicket-taker, is known for his passionate wicket celebrations, and plays in franchise leagues worldwide including the Pakistan Super League and Australia's Big Bash League."
  ur: "جنوبی افریقی کرکٹ کھلاڑی، جو 1990 میں جوہانسبرگ میں پیدا ہوئے۔ بائیں ہاتھ سے غیر روایتی کلائی اسپن گیند بازی کرنے والے کھلاڑی کی حیثیت سے انھوں نے 2016 میں جنوبی افریقہ کے لیے ایک روزہ اور ٹیسٹ دونوں میں بین الاقوامی آغاز کیا، وہ ٹی ٹوئنٹی بین الاقوامی کرکٹ میں جنوبی افریقہ کے سب سے زیادہ وکٹیں لینے والے گیند باز ہیں، مارچ 2021 میں آئی سی سی ٹی ٹوئنٹی گیند بازوں کی درجہ بندی میں سرفہرست رہے، ستمبر 2021 میں سری لنکا کے خلاف اپنی پہلی ایک روزہ پانچ وکٹیں لیں اور 2022 میں انگلینڈ کے خلاف ٹی ٹوئنٹی میں پانچ وکٹیں لے کر ڈیل اسٹین کو پیچھے چھوڑ کر جنوبی افریقہ کے سب سے زیادہ ٹی ٹوئنٹی وکٹیں لینے والے گیند باز بن گئے، وکٹ پر پرجوش جشن کے لیے مشہور ہیں، اور پاکستان سپر لیگ اور آسٹریلیا کی بگ بیش لیگ سمیت دنیا بھر کی فرنچائز لیگز میں کھیلتے ہیں۔"
  es: "Jugador de críquet sudafricano, nacido en Johannesburgo en 1990. Lanzador de muñeca poco ortodoxo con el brazo izquierdo, debutó internacionalmente con Sudáfrica en 2016 tanto en One Day Internationals como en Tests, es el máximo anotador de wickets de Sudáfrica en Twenty20 Internationals, encabezó la clasificación de bolos de T20I de la ICC en marzo de 2021, logró su primer ODI de cinco wickets contra Sri Lanka en septiembre de 2021 y un T20I de cinco wickets contra Inglaterra en 2022 que lo llevó a superar a Dale Steyn como el máximo anotador de wickets de T20I de Sudáfrica, es conocido por sus apasionadas celebraciones de wickets y juega en ligas de franquicias en todo el mundo, incluyendo la Pakistan Super League y la Big Bash League de Australia."
  fr: "Joueur de cricket sud-africain, né à Johannesburg en 1990. Lanceur gaucher atypique de spin au poignet, il a fait ses débuts internationaux pour l'Afrique du Sud en 2016 en ODI et en Test, est le meilleur preneur de guichets sud-africain en Twenty20 International, a dominé le classement ICC des lanceurs T20I en mars 2021, a réalisé son premier quintuplé en ODI contre le Sri Lanka en septembre 2021 et un quintuplé en T20I contre l'Angleterre en 2022, ce qui lui a permis de dépasser Dale Steyn en tant que meilleur preneur de guichets sud-africain en T20I, est connu pour ses célébrations de guichets passionnées et joue dans des ligues de franchises du monde entier, notamment la Super League du Pakistan et la Big Bash League australienne."
  tr: "1990 yılında Johannesburg'da doğmuş Güney Afrikalı bir kriketçi. Ram, topu bileği ve sol koluyla alışılmadık bir şekilde döndürür. 2016'da Güney Afrika ile tek günlük ve Test maçlarında uluslararası debutunu yaptı. Uluslararası yirmili yıllarda Güney Afrika tarihinin en çok wicket alan oyuncusudur. Mart 2021'de Uluslararası Yirmiler Bowlerları Konseyi sıralamasında zirveye çıktı, Eylül 2021'de Sri Lanka'ya karşı tek günlük maçlarda ilk beş wicketini aldı ve 2022'de İngiltere'ye karşı beş wicket aldı; 1920'lerde Güney Afrika'nın kaleci-vurucusu olarak Dale Steyn'i geride bıraktı. Hevesli wicket alma kutlamalarıyla ünlüyor ve Pakistan Premier League ile Avustralya Big Bash League dahil olmak üzere dünya çapında elit liglerde oynuyor."
  id: "Seorang pemain kriket Afrika Selatan, lahir di Johannesburg pada tahun 1990. Ram memutar bola dengan pergelangan tangan dan lengan kirinya dengan cara yang tidak biasa. Ia melakukan debut internasionalnya bersama Afrika Selatan pada tahun 2016 dalam pertandingan satu hari dan Test. Ia adalah pengambil wicket terbanyak dalam sejarah Afrika Selatan selama tahun dua puluhan internasional. Ia memimpin peringkat International Council of Twenties Bowlers pada Maret 2021, mengambil lima wicket pertamanya dalam pertandingan satu hari melawan Sri Lanka pada September 2021, dan lima wicket melawan Inggris pada 2022, melampaui Dale Steyn sebagai wicketkeeper-batsman Afrika Selatan pada tahun 1920-an. Ia terkenal karena perayaan pengambilan wicket yang antusias dan bermain di liga elit dunia, termasuk Pakistan Premier League dan Australian Big Bash League."
