label:
  ar: "هلال الرأي ⁦(هلال بن يحيى)⁩"
  en: "Hilal al-Ra'y (Hilal ibn Yahya)"
  es: "Hilal al-Ra'y (Hilal ibn Yahya)"
  fr: "Hilal al-Ra'y (Hilal ibn Yahya)"
  ur: "ہلال الرعی ⁦(ہلال ابن یحییٰ)⁩"
summary:
  ar: "هلال بن يحيى بن مسلم الرأي البصري، لقب بالرأي لسعة علمه وكثرة فقهه، أخذ الفقه عن أبي يوسف وزفر، ورَوى الحديث عن أبي عوانة وابن مهدي، وأخذ عنه بكار بن قتيبة وعبد الله بن قحطبة والحسن بن أحمد بن بسطام. من تصانيفه كتاب في الشروط كان مقدماً فيه، وكتاب أحكام الوقف الذي تداوله العلماء. توفي سنة 245 هـ على ما يذكره العنوان بعلامة الاستفهام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
  en: "Hilal ibn Yahya ibn Muslim al-Ra'y al-Basri, called al-Ra'y for the breadth of his learning and his abundant fiqh. He learned fiqh from Abu Yusuf and Zufar and related hadith from Abu Awana and Ibn Mahdi; Bakkar ibn Qutayba, Abd Allah ibn Qahtaba and al-Hasan ibn Ahmad ibn Bastam took from him. His book on contracts made him a leader in the subject, and his work Ahkam al-Waqf was passed among scholars. The header gives 245 AH with a question mark. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
  es: "Hilal ibn Yahya ibn Muslim al-Ra'y al-Basri, llamado al-Ra'y por la amplitud de sus conocimientos y su abundante fiqh (jurisprudencia islámica). Aprendió fiqh de Abu Yusuf y Zufar, y hadices relacionados de Abu Awana e Ibn Mahdi; Bakkar ibn Qutayba, Abd Allah ibn Qahtaba y al-Hasan ibn Ahmad ibn Bastam aprendieron de él. Su libro sobre contratos lo convirtió en un referente en la materia, y su obra Ahkam al-Waqf se transmitió entre los eruditos. El encabezado indica 245 AH con un signo de interrogación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
  fr: "Hilal ibn Yahya ibn Muslim al-Ra'y al-Basri, dit al-Ra'y pour l'étendue de son savoir et sa profonde connaissance du fiqh, étudia le fiqh auprès d'Abu Yusuf et Zufar, et le hadith transmis par Abu Awana et Ibn Mahdi. Bakkar ibn Qutayba, Abd Allah ibn Qahtaba et al-Hasan ibn Ahmad ibn Bastam furent ses disciples. Son ouvrage sur les contrats fit de lui une référence en la matière, et son œuvre Ahkam al-Waqf fut largement diffusée parmi les savants. L'en-tête indique l'an 245 de l'Hégire avec un point d'interrogation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15828}"
  ur: "ہلال بن یحییٰ بن مسلم الرعی البصری کو الرعی کہا جاتا ہے اس کے علم کی وسعت اور اس کی کثرت فقہ کی وجہ سے۔ انہوں نے ابو یوسف اور زفر سے فقہ سیکھا اور ابو عوانہ اور ابن مہدی سے حدیثیں سیکھیں۔ بکر بن قتیبہ، عبداللہ بن قحطبہ اور حسن بن احمد بن بسطام نے ان سے لیا ہے۔ معاہدوں پر ان کی کتاب نے انھیں اس موضوع میں ایک رہنما بنا دیا، اور ان کا کام 'احکام الوفاق' اہل علم میں گزرا۔ ہیڈر سوالیہ نشان کے ساتھ 245ھ بتاتا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص15828}"
  tr: "Hilal ibn Yahya ibn Muslim al-Ra'i al-Basri, geniş bilgisi ve geniş hukuk anlayışı nedeniyle 'al-Ra'i' lakabını aldı. Ebu Yusuf ve Zafar'dan fıkıh aldı, Ebu Evanah ve İbn Mehdi'den hadisleri selayet etti ve onun yanında Bakkar ibn Qutaybah, Abdullah ibn Kahtabah ve Hasan ibn Ahmed ibn Bastam'ı aldı. Eserleri arasında, öncü olduğu koşulları anlatan bir kitap ve alimler arasında dağıtılan 'Vakıfların Hükümleri' kitabı yer alır. Başlıkta da belirtildiği gibi, 245 Hicri yılında soru işaretiyle öldü. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15828}"
  id: "Hilal ibn Yahya ibn Muslim al-Ra'i al-Basri dijuluki 'al-Ra'i' karena pengetahuan luas dan yurisprudensinya yang luas. Ia mempelajari hukum dari Abu Yusuf dan Zafar, menceritakan hadis dari Abu 'Awanah dan Ibn Mahdi, serta mempelajari di bawah bimbingan Bakkar ibn Qutaybah, Abdullah ibn Qahtabah, dan Hasan ibn Ahmad ibn Bastam. Di antara karyanya terdapat buku tentang kondisi di mana ia menjadi pelopor, dan buku 'Rulings of Endowments,' yang beredar di kalangan ulama. Ia meninggal pada tahun 245 H, seperti yang tercantum dalam judulnya dengan tanda tanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15828}"
