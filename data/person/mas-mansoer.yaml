summary:
  ar: "عالم وقائد ديني إندونيسي (1896–1946)، درس في مكة والأزهر، ورأس المحمدية (1937–1942) فأعاد تنظيمها بخطواته الاثنتي عشرة، وشارك في تأسيس مجلس الإسلام الأعلى و«الأربعة المتسلسلين» في عهد الاحتلال الياباني، ومات في سجن كاليسوسوك بسورابايا سنة 1946 فسمّي بطلًا قوميًّا. عُرف بفتاواه التطهيرية ومنها تحريم فائدة البنوك."
  en: "Indonesian scholar and religious leader (1896–1946) who studied in Mecca and at al-Azhar, chaired Muhammadiyah (1937–1942) and reorganised it with his Twelve Steps, helped found the Majelis Islam A'la Indonesia and served among the 'Four Series' of the Japanese occupation, and died in Kalisosok Prison, Surabaya, in 1946; he was named a National Hero. He was known for purifying rulings, among them the prohibition of bank interest."
  ur: "انڈونیشی عالم اور مذہبی رہنما (1896ء–1946ء)، مکہ اور الازہر میں پڑھے، محمدیہ کے صدر (1937ء–1942ء) رہے اور اسے اپنے بارہ اقدامات سے منظم کیا، مجلس اسلام اعلیٰ انڈونیشیا کے قیام میں حصہ لیا اور جاپانی قبضے کے «چار سلسلہ» میں شامل رہے، 1946ء میں سورابایا کی کالی سوسوک جیل میں وفات پائی اور قومی ہیرو قرار پائے۔ بینک کے سود کی حرمت سمیت تطہیری فتاوٰی سے مشہور تھے۔"
