summary:
  ar: "بطاقة أولية لعرفجة بن هرثمة البارقي، صحابي وقائد فتوحات الفرس في القرن السابع الذي غزا المشرق نحو مكران، توفي سنة ٦٥٤م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Arfaja ibn Harthama al-Bariqi, the seventh-century companion and commander who campaigned eastward to Makran, d. 654; the biographical entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Arfaja ibn Harthama al-Bariqi, compañero y comandante del siglo VII que hizo campaña hacia el este, a Makrán, fallecido en 654; la entrada biográfica aún no se ha revisado en la página."
  fr: "Fiche provisoire d'Arfaja ibn Harthama al-Bariqi, compagnon et commandant du VIIe siècle qui a mené campagne vers l'est jusqu'à Makran, mort en 654; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "ساتویں صدی کے ساتھی اور کمانڈر عرفجہ ابن حارثمہ الباریقی کے لیے ڈرافٹ کارڈ جس نے مشرق کی طرف مکران کی طرف مہم چلائی، ڈی۔ 654; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Yedinci yüzyılda Pers fetihlerinin yoldaşı ve komutanı olan Arfajah ibn Harthama al-Barqi'nin ön kartı 654 yılında ölmüştür; biyografik kitaplarda kendisi geçer ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Arfajah ibn Harthama al-Barqi, seorang sahabat dan komandan penaklukan Persia pada abad ketujuh yang menyerbu Timur menuju Makran, meninggal pada tahun 654 M; buku biografi menyebutkannya dan biografinya belum ditinjau di halaman tersebut."
