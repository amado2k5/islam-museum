summary:
  ar: "الحسن بن أحمد بن متويه، المعروف بابن متويه، متكلم معتزلي تتلمذ على القاضي عبد الجبار ⁦(ت. 415هـ / 1025م)⁩ في الري وعاش بعده؛ لا يُعرف عن حياته شيء مؤكد، وتاريخا الوفاة المنسوبان إليه، 468هـ و469هـ، لا يُعتمد عليهما، ومن مؤلفاته «المجموع في المحيط بالتكليف» و«التذكرة» {cite:encyclopaedia-of-islam-2}."
  en: "Al-Hasan ibn Ahmad ibn Mattawayh, known as Ibn Mattawayh, was a Mu'tazili theologian, a pupil of Qadi 'Abd al-Jabbar (d. 415/1025) at Rayy who outlived him. Virtually nothing certain is known of his life; the death dates sometimes given for him, 468/1075 and 469/1076, are stated without a source and are not reliable, so no death date is recorded. His works include al-Majmu' fi'l-muhit bi'l-taklif and al-Tadhkira {cite:encyclopaedia-of-islam-2}."
  es: "Al-Hasan ibn Ahmad ibn Mattawayh, conocido como Ibn Mattawayh, fue un teólogo mu'tazilí, discípulo de Qadi 'Abd al-Jabbar (m. 415/1025) en Rayy, quien le sobrevivió. Prácticamente no se sabe nada con certeza de su vida; las fechas de muerte que a veces se le atribuyen, 468/1075 y 469/1076, se mencionan sin fuente y no son fiables, por lo que no se registra ninguna fecha de fallecimiento. Entre sus obras se encuentran al-Majmu' fi'l-muhit bi'l-taklif y al-Tadhkira {cite:encyclopaedia-of-islam-2}."
  fr: "Al-Hasan ibn Ahmad ibn Mattawayh, plus connu sous le nom d'Ibn Mattawayh, était un théologien mu'tazilite, disciple du cadi 'Abd al-Jabbar (mort en 415/1025) à Rayy, auquel il survécut. On ne sait pratiquement rien de certain de sa vie; les dates de décès parfois avancées, 468/1075 et 469/1076, sont données sans source et ne sont pas fiables, de sorte qu'aucune date de décès n'est consignée. Parmi ses œuvres figurent al-Majmu' fi'l-muhit bi'l-taklif et al-Tadhkira."
  ur: "الحسن بن احمد بن متاویہ، جسے ابن متویہ کے نام سے جانا جاتا ہے، معتزلی عالم دین تھا، قادی عبدالجبار ⁦(متوفی 415/1025)⁩ کا رے میں شاگرد تھا جو اس سے آگے رہ گیا۔ اس کی زندگی کے بارے میں عملی طور پر کچھ بھی معلوم نہیں ہے۔ اس کے لیے بعض اوقات موت کی تاریخیں دی جاتی ہیں، 468/1075 اور 469/1076، بغیر کسی ماخذ کے بیان کی گئی ہیں اور قابل اعتبار نہیں ہیں، اس لیے موت کی کوئی تاریخ درج نہیں ہے۔ ان کی تصانیف میں المجموۃ فی المحیط بل تکلف اور التذکرہ شامل ہیں۔"
