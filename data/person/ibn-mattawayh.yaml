summary:
  ar: "الحسن بن أحمد بن متويه، المعروف بابن متويه، متكلم معتزلي تتلمذ على القاضي عبد الجبار ⁦(ت. 415هـ / 1025م)⁩ في الري وعاش بعده؛ لا يُعرف عن حياته شيء مؤكد، وتاريخا الوفاة المنسوبان إليه، 468هـ و469هـ، لا يُعتمد عليهما، ومن مؤلفاته «المجموع في المحيط بالتكليف» و«التذكرة» {cite:encyclopaedia-of-islam-2}."
  en: "Al-Hasan ibn Ahmad ibn Mattawayh, known as Ibn Mattawayh, was a Mu'tazili theologian, a pupil of Qadi 'Abd al-Jabbar (d. 415/1025) at Rayy who outlived him. Virtually nothing certain is known of his life; the death dates sometimes given for him, 468/1075 and 469/1076, are stated without a source and are not reliable, so no death date is recorded. His works include al-Majmu' fi'l-muhit bi'l-taklif and al-Tadhkira {cite:encyclopaedia-of-islam-2}."
