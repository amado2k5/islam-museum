summary:
  ar: "شاعر وصحفي باكستاني ⁦(1911–1984)⁩ من أعظم شعراء الأردية في القرن العشرين. جمع بين الغزل الكلاسيكي وشعر الالتزام السياسي، ومن دواوينه «نقش فريادي» و«دستِ صبا» و«زندان نامه»، وحاز جائزة لينين للسلام سنة 1962، وعاش سنوات في المنفى بلندن وبيروت."
  en: "Pakistani poet and journalist (1911–1984), among the greatest Urdu poets of the twentieth century. He joined classical ghazal to politically committed verse; his collections include Naqsh-e-Faryadi, Dast-e-Saba and Zindan-Nama. He won the Lenin Peace Prize in 1962 and spent years in exile in London and Beirut."
  ur: "پاکستانی شاعر اور صحافی ⁦(1911–1984)⁩ جو بیسویں صدی کے اردو کے عظیم شعراء میں شمار ہوتے ہیں۔ انہوں نے کلاسیکی غزل کو سیاسی شعرِ التزام سے جوڑا؛ ان کے مجموعوں میں «نقشِ فریادی»، «دستِ صبا» اور «زندان نامہ» شامل ہیں۔ 1962 میں لینن امن انعام جیتا اور برسوں لندن اور بیروت میں جلاوطن رہے۔"
  es: "Poeta y periodista pakistaní (1911-1984), considerado uno de los más grandes poetas urdu del siglo XX. Combinó el ghazal clásico con la poesía de compromiso político; entre sus colecciones destacan Naqsh-e-Faryadi, Dast-e-Saba y Zindan-Nama. Ganó el Premio Lenin de la Paz en 1962 y pasó años exiliado en Londres y Beirut."
