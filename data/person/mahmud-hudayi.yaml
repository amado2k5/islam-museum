label:
  ar: "عزيز محمود هدائي"
  en: "Mahmud Hüdayi"
  es: "Mahmud Hüdayi"
  fr: "Mahmud Hüdayi"
  ur: "محمود ہودائی"
roles: [preacher, scholar, writer]
gender: male
summary:
  ar: "محمود، ويقال عزيز محمود، بن فضل الله الرومي القسطنطيني الهدائي الأسكداري، واعظ رومي حنفي من مشايخ الجلوتية، له تصانيف بالعربية والتركية وتنسب إليه زاوية الجلوتية في أسكدار، توفي سنة 1038 هـ."
  en: "Mahmud, also called Aziz Mahmud, ibn Fadlallah al-Rumi al-Qustantini al-Hudai al-Uskudari, a Hanafi preacher and shaykh of the Jalwatiyya (Celveti) who wrote in Arabic and Turkish and to whom the lodge at Uskudar is attributed; died 1038 AH (1628)."
  es: "Mahmud, también llamado Aziz Mahmud, ibn Fadlallah al-Rumi al-Qustantini al-Hudai al-Uskudari, predicador hanafi y shaykh de la Jalwatiyya (Celveti) que escribió en árabe y turco y a quien se le atribuye la logia de Uskudar; murió en 1038 AH (1628)."
  fr: "Mahmud, également appelé Aziz Mahmud, ibn Fadlallah al-Rumi al-Qustantini al-Hudai al-Uskudari, prédicateur hanafite et cheikh de la Jalwatiyya (Celveti) qui écrivait en arabe et en turc et à qui la loge d'Uskudar est attribuée; mort en 1038 AH (1628)."
  ur: "محمود، جسے عزیز محمود بھی کہا جاتا ہے، ابن فضل اللہ الرومی القستنطینی الہدائی الاسقداری، حنفی مبلغ اور جلواتیہ ⁦(سیلویٹی)⁩ کے شیخ جنہوں نے عربی اور ترکی میں لکھا اور جن سے اسکودر میں لاج منسوب ہے؛ وفات 1038ھ (1628)۔"
