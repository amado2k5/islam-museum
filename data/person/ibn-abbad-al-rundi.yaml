summary:
  ar: "محمد بن إبراهيم النفزي الرندي المعروف بابن عباد، صوفي أندلسي مالكي من أهل الطريقة الشاذلية، ولد برندة سنة 733هـ، وتتلمذ بسلا على ابن عاشر، وتولى الإمامة والخطابة بجامع القرويين بفاس خمس عشرة سنة، وتوفي بفاس في رجب سنة 792هـ؛ أول من شرح الحكم العطائية {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 28} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 30} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 33} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36}."
  en: "Muhammad ibn Ibrahim al-Nafzi al-Rundi, known as Ibn 'Abbad, an Andalusian Maliki Sufi of the Shadhili way, born in Ronda in 733 AH, a pupil of Ibn 'Ashir at Salé, imam and preacher of the Qarawiyyin mosque in Fez for fifteen years, who died in Fez in Rajab 792 AH; the first commentator on the Hikam of Ibn 'Ata' Allah {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 28} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 30} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 33} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36}."
  ur: "محمد بن ابراہیم نفزی رندی، المعروف ابن عباد، شاذلی طریقے کے اندلسی مالکی صوفی، 733ھ میں رندہ میں پیدا ہوئے، سلا میں ابن عاشر کے شاگرد رہے، پندرہ برس فاس کی جامع القرویین کے امام و خطیب رہے، اور رجب 792ھ میں فاس میں فوت ہوئے؛ الحکم العطائیہ کے پہلے شارح {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 28} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 30} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 33} {cite:hikam-ibn-abbad-haykal-ahram-1988 p. 36}۔"
