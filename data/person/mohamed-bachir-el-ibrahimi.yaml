summary:
  ar: "عالم وأديب جزائري (1889–1965)؛ درس بالمدينة المنورة ودمشق، وكان رفيق عبد الحميد بن باديس ونائبه في قيادة الحركة الإصلاحية الجزائرية ثم خليفته في رئاسة جمعية العلماء المسلمين الجزائريين (1940)، واشتهر بخطابته ومقالاته في «البصائر» حتى غدا من أبرز أعلام الفكر والأدب في العالم العربي."
  en: "Algerian scholar and man of letters (1889–1965). Educated in Medina and Damascus, he was Abdelhamid Ben Badis's companion and deputy in the Algerian reform movement and succeeded him as president of the Association of Algerian Muslim Ulama (1940); his sermons and his articles in al-Basa'ir made him one of the leading intellectual figures of the Arab world."
  ur: "جزائری عالم اور ادیب (1889–1965)؛ مدینہ منورہ اور دمشق میں تعلیم پائی، عبد الحمید بن بادس کے رفیق اور نائب رہے اور جمعیۃ العلماء المسلمین الجزائریین کی صدارت میں ان کے جانشین بنے (1940)؛ اپنے خطبات اور «البصائر» کے مضامین سے عرب دنیا کے ممتاز اہل قلم میں شمار ہوئے۔"
