summary:
  ar: "امرأة قالت بيتين في قتل أبي عفك تخاطبه فيهما: إنه يكذّب دين الله والمرء أحمد، وإن مسلماً حباه آخر الليل طعنة فليأخذها على كبر السن؛ لا يُعرف عنها عند ابن إسحاق غير ذلك."
  en: "A woman who spoke two verses on the killing of Abu Afak, addressing him: that he gave the lie to God's religion and to the man Ahmad, and that a Muslim had granted him a thrust at the end of the night which he should take in his old age; nothing more is known of her from Ibn Ishaq."
  es: "Una mujer que recitó dos versículos sobre el asesinato de Abu Afak, dirigiéndose a él: que había traicionado la religión de Dios y al hombre Ahmad, y que un musulmán le había concedido una estocada al final de la noche que debía recibir en su vejez; no se sabe nada más de ella por medio de Ibn Ishaq."
  fr: "Une femme qui récita deux versets sur le meurtre d'Abu Afak, s'adressant à lui: qu'il avait menti à la religion de Dieu et à l'homme Ahmad, et qu'un musulman lui avait accordé une faveur à la fin de la nuit qu'il devrait recevoir dans sa vieillesse; on ne sait rien de plus à son sujet d'après Ibn Ishaq."
