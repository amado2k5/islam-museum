  ar: "امرأة قالت بيتين في قتل أبي عفك تخاطبه فيهما: إنه يكذّب دين الله والمرء أحمد، وإن مسلماً حباه آخر الليل طعنة فليأخذها على كبر السن؛ لا يُعرف عنها عند ابن إسحاق غير ذلك."
  en: "A woman who spoke two verses on the killing of Abu Afak, addressing him: that he gave the lie to God's religion and to the man Ahmad, and that a Muslim had granted him a thrust at the end of the night which he should take in his old age; nothing more is known of her from Ibn Ishaq."
