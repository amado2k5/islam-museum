summary:
  ar: "اقتصادي ومفكر وسياسي باكستاني (1932–2025)، من رواد علم الاقتصاد الإسلامي، شارك في تأسيس المؤسسة الإسلامية في ليستر، وكان من قادة الجماعة الإسلامية، ورأس لجنة التخطيط في باكستان، وعضو مجلس الشيوخ (2002–2012)، ألّف وحرّر أكثر من سبعين كتابًا، ونال جائزة الملك فيصل لخدمة الإسلام (1990) ونيشان امتياز (2011)."
  en: "Pakistani economist, thinker and politician (1932–2025), a founder of Islamic economics as an academic field, co-founder of the Islamic Foundation in Leicester, a Jamaat-e-Islami leader, head of Pakistan's Planning Commission and senator (2002–2012); author and editor of more than seventy books, King Faisal Prize for Service to Islam (1990) and Nishan-e-Imtiaz (2011)."
  ur: "پاکستانی ماہرِ معاشیات، مفکر اور سیاست دان ⁦(1932ء–2025ء)⁩، اسلامی معاشیات کو علمی شعبہ بنانے والوں میں سے، لیسٹر کی اسلامک فاؤنڈیشن کے شریک بانی، جماعتِ اسلامی کے رہنما، پاکستان کے پلاننگ کمیشن کے سربراہ اور سینیٹر ⁦(2002ء–2012ء)⁩؛ ستر سے زیادہ کتب کے مصنف و مرتب، شاہ فیصل انعام برائے خدمتِ اسلام ⁦(1990ء)⁩ اور نشانِ امتیاز ⁦(2011ء)⁩۔"
