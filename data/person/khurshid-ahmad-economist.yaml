summary:
  ar: "اقتصادي ومفكر وسياسي باكستاني (1932–2025)، من رواد علم الاقتصاد الإسلامي، شارك في تأسيس المؤسسة الإسلامية في ليستر، وكان من قادة الجماعة الإسلامية، ورأس لجنة التخطيط في باكستان، وعضو مجلس الشيوخ (2002–2012)، ألّف وحرّر أكثر من سبعين كتابًا، ونال جائزة الملك فيصل لخدمة الإسلام (1990) ونيشان امتياز (2011)."
  en: "Pakistani economist, thinker and politician (1932–2025), a founder of Islamic economics as an academic field, co-founder of the Islamic Foundation in Leicester, a Jamaat-e-Islami leader, head of Pakistan's Planning Commission and senator (2002–2012); author and editor of more than seventy books, King Faisal Prize for Service to Islam (1990) and Nishan-e-Imtiaz (2011)."
  ur: "پاکستانی ماہرِ معاشیات، مفکر اور سیاست دان ⁦(1932ء–2025ء)⁩، اسلامی معاشیات کو علمی شعبہ بنانے والوں میں سے، لیسٹر کی اسلامک فاؤنڈیشن کے شریک بانی، جماعتِ اسلامی کے رہنما، پاکستان کے پلاننگ کمیشن کے سربراہ اور سینیٹر ⁦(2002ء–2012ء)⁩؛ ستر سے زیادہ کتب کے مصنف و مرتب، شاہ فیصل انعام برائے خدمتِ اسلام ⁦(1990ء)⁩ اور نشانِ امتیاز ⁦(2011ء)⁩۔"
  es: "Economista, pensador y político pakistaní (1932-2025), fundador de la economía islámica como campo académico, cofundador de la Fundación Islámica en Leicester, líder de Jamaat-e-Islami, jefe de la Comisión de Planificación de Pakistán y senador (2002-2012); autor y editor de más de setenta libros, Premio Rey Faisal al Servicio del Islam (1990) y Nishan-e-Imtiaz (2011)."
  fr: "Économiste, penseur et homme politique pakistanais (1932-2025), fondateur de l'économie islamique en tant que domaine académique, cofondateur de la Fondation islamique de Leicester, dirigeant de Jamaat-e-Islami, chef de la Commission de planification du Pakistan et sénateur (2002-2012); auteur et éditeur de plus de soixante-dix livres, prix du roi Faisal pour services rendus à l'islam (1990) et Nishan-e-Imtiaz (2011)."
  tr: "Pakistanlı ekonomist, düşünür ve politikacı (1932–2025), İslami ekonominin öncüsü, Leicester'da İslami Vakfı'nın kurucu ortaklarından biri, İslami Grup'un liderlerinden biri, Pakistan'da Planlama Komitesi'ne başkanlık etti ve Senato üyesiydi (2002–2012). Yetmişten fazla kitap yazdı ve editörlüğünü yaptı, İslam'a Hizmet için Kral Faysal Ödülü (1990) ve Mükemmeliyet Nişanı (2011) aldı."
  id: "Ekonom, pemikir, dan politisi Pakistan (1932–2025), pelopor ekonomi Islam, ikut mendirikan Islamic Foundation di Leicester, menjadi pemimpin Kelompok Islam, memimpin Komite Perencanaan di Pakistan, dan menjadi anggota Senat (2002–2012). Ia menulis dan mengedit lebih dari tujuh puluh buku, menerima King Faisal Prize for Service to Islam (1990) dan Order of Excellence (2011)."
