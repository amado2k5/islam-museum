summary:
  ar: "لاعب وسط مهاجم سعودي معتزل، وُلد في الرياض سنة 1967، وقضى مسيرته كلها مع نادي الشباب. خاض 85 مباراة دولية سجل فيها 34 هدفًا، واشتهر عالميًا بهدفه الفردي في مرمى بلجيكا في كأس العالم 1994، الذي جاء سادسًا في تصويت فيفا على هدف القرن، فلقّبه الإعلام «مارادونا الصحراء». اختير أفضل لاعب في آسيا سنة 1994."
  en: "Saudi Arabian former professional footballer (attacking midfielder and forward), born in Riyadh in 1967, who spent his entire club career at Al-Shabab. He won 85 caps and scored 34 goals for Saudi Arabia and is renowned for his solo goal against Belgium at the 1994 FIFA World Cup, voted sixth in FIFA's Goal of the Century rankings, which earned him the nickname 'the Maradona of the desert'. He was named Asian Footballer of the Year in 1994."
  ur: "سعودی سابق پیشہ ور فٹبالر (حملہ آور مڈفیلڈر اور فارورڈ)، 1967 میں ریاض میں پیدا ہوئے اور اپنا پورا کلب کیریئر الشباب میں گزارا۔ انہوں نے سعودی عرب کے لیے 85 میچوں میں 34 گول کیے اور 1994 فیفا ورلڈ کپ میں بیلجیئم کے خلاف اپنے انفرادی گول کے لیے مشہور ہیں، جو فیفا کی «صدی کا بہترین گول» فہرست میں چھٹے نمبر پر آیا اور جس کی وجہ سے انہیں «صحرا کا میراڈونا» کہا گیا۔ وہ 1994 میں ایشیا کے بہترین فٹبالر قرار پائے۔"
