summary:
  ar: "طبيب العرب المشهور؛ أكل مع أبي بكر خزيرة مسمومة فقال له ارفع يدك إن فيها لسم سنة وأنا وأنت نموت في يوم واحد فماتا معاً عند انقضاء السنة. وعند المسعودي سمت اليهود أبا بكر في شيء من الطعام فأكل معه الحارث بن كلدة فعمي وكان السم لسنة ومرض أبو بكر قبل وفاته بخمسة عشر يوماً {cite:muruj-al-dhahab p. 598}"
  en: "the famed physician of the Arabs; ate the poisoned khazira with Abu Bakr — 'a year's poison is in it, we die in one day' — and both died in one day at year's end."
