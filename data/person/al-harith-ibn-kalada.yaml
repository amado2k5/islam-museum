label: { ar: "الحارث بن كلدة", en: "al-Harith ibn Kalada", fr: "Al-Harith ibn Kalada", es: "al-Harith ibn Kalada", ur: "حارث ابن کلدہ" }
summary:
  ar: "طبيب العرب المشهور؛ أكل مع أبي بكر خزيرة مسمومة فقال له ارفع يدك إن فيها لسم سنة وأنا وأنت نموت في يوم واحد فماتا معاً عند انقضاء السنة. وعند المسعودي سمت اليهود أبا بكر في شيء من الطعام فأكل معه الحارث بن كلدة فعمي وكان السم لسنة ومرض أبو بكر قبل وفاته بخمسة عشر يوماً {cite:muruj-al-dhahab p. 598}"
  en: "the famed physician of the Arabs; ate the poisoned khazira with Abu Bakr — 'a year's poison is in it, we die in one day' — and both died in one day at year's end."
  fr: "Célèbre médecin des Arabes ; selon le récit, il mangea une khazira empoisonnée avec Abu Bakr et l’avertit qu’elle contenait un poison agissant pendant un an et qu’ils mourraient le même jour ; tous deux moururent le même jour à la fin de l’année."
  es: "El famoso médico de los árabes comió el khazira envenenado con Abu Bakr —«tiene veneno para un año, moriremos en un día»— y ambos murieron en un solo día al final del año."
  ur: "عربوں کے مشہور طبیب؛ ابوبکر کے ساتھ زہر آلود خزیرہ کھایا - 'اس میں ایک سال کا زہر ہے، ہم ایک دن میں مر گئے' - اور دونوں سال کے آخر میں ایک ہی دن میں مر گئے۔"
