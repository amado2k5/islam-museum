summary:
  ar: "كاتب ودبلوماسي وناشر إيراني مجدد (1833–1908) من جلفا الجديدة، تعلّم في باريس، ودرّس في دار الفنون، وأسس فراموش‌خانه الشبيهة بالماسونية، وكان سفيرًا في لندن وروما، ونشر من المنفى صحيفة «قانون»، فصار أنفذ دعاة حكم القانون في فارس في قرنه."
  en: "Iranian modernist writer, diplomat and publicist (1833–1908) of New Julfa, educated in Paris, who taught at the Dar ol-Fonun, founded the Freemason-like Faramushkhaneh, served as ambassador in London and Rome, and from exile published the newspaper Qanun, becoming the century's most influential Persian advocate of government by law."
  ur: "جدید جلفا کے ایرانی جدیدیت پسند مصنف، سفارت کار اور ناشر (1833–1908)؛ پیرس میں تعلیم پائی، دار الفنون میں پڑھایا، فری میسن نما فراموش خانہ قائم کیا، لندن اور روم میں سفیر رہے، اور جلاوطنی سے «قانون» اخبار نکالا؛ وہ اپنے قرن میں فارس کے قانون کی حکمرانی کے سب سے بااثر داعی بنے۔"
