summary:
  ar: "يذكر الشيخ عمر عبد الكافي ذا القرنين في باب التمكين، مثالًا لمن أعطاه الله الأسباب فاتبعها، ويصفه بالعلم والتمكين في الأرض، ويذكر السد الذي أقامه لقوم شكوا الإفساد. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:12:00} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:19:30}"
  en: "Sheikh Omar Abdelkafy cites Dhu al-Qarnayn in his teaching on empowerment, as one given the means who followed them, describes his knowledge and empowerment, and recounts the barrier he built for a people who complained of corruption {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:12:00} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:19:30}."
  ur: "شیخ عمر عبدالکافی ذوالقرنین کو تمکین کے باب میں ایسی مثال کے طور پر پیش کرتے ہیں جنہیں اسباب دیے گئے اور انہوں نے ان کی پیروی کی، ان کے علم اور تمکین کا ذکر کرتے ہیں، اور اس دیوار کا ذکر کرتے ہیں جو انہوں نے فساد کی شکایت کرنے والی قوم کے لیے بنائی {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:12:00} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep11 00:19:30}۔"
