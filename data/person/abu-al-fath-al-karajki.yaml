summary:
  ar: "أبو الفتح محمد بن علي الكراجكي، أي الخيمي، من علماء الشيعة، وصفه ابن العماد بأنه رأس الشيعة وصاحب التصانيف، كان نحويا لغويا منجما طبيبا متكلما ومن كبار أصحاب الشريف المرتضى، وله «تلقين أولاد المؤمنين»، ومات بصور في ربيع الآخر سنة 449 هـ."
  en: "Abu al-Fath Muhammad ibn Ali al-Karajki, that is al-Khaymi, a Shia scholar whom the Hanbali chronicler Ibn al-Imad calls the head of the Shia and a prolific author; grammarian, philologist, astrologer, physician and theologian, a chief companion of al-Sharif al-Murtada and author of Talqin Awlad al-Mu'minin; died at Tyre in Rabi' al-Akhir 449 AH (1057 CE)."
  fr: "Abu al-Fath Muhammad ibn Ali al-Karajki, c'est-à-dire al-Khaymi, savant chiite que le chroniqueur hanbalite Ibn al-Imad appelle le chef des chiites et un auteur prolifique ; grammairien, philologue, astrologue, médecin et théologien, l'un des principaux compagnons d'al-Sharif al-Murtada et auteur du Talqin Awlad al-Mu'minin ; mort à Tyr en Rabi' al-Akhir 449 H (1057 ap. J.-C.)."
  es: "Abu al-Fath Muhammad ibn Ali al-Karajki, es decir, al-Khaymi, un erudito chiíta a quien el cronista hanbalí Ibn al-Imad llama el jefe de los chiítas y un autor prolífico; gramático, filólogo, astrólogo, médico y teólogo, compañero principal de al-Sharif al-Murtada y autor de Talqin Awlad al-Mu'minin; murió en Tiro en Rabi' al-Akhir 449 AH (1057 d. C.)."
