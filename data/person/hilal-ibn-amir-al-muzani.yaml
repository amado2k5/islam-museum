summary:
  ar: "هلال بن عامر بن عمرو المزني الكوفي، صحابي، روى عن أبيه ورافع بن عمرو المزني، وعنه سيف بن عمر التميمي ويحيى بن سعيد الأموي وأبو معاوية الضرير ومروان بن معاوية. قال إسحاق بن منصور عن ابن معين: ثقة، وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  en: "Hilal ibn Amir ibn Amr al-Muzani of Kufa, a Companion who narrated from his father and from Rafi' ibn Amr al-Muzani. Sayf ibn Umar al-Tamimi, Yahya ibn Sa'id al-Umawi, Abu Mu'awiya al-Darir and Marwan ibn Mu'awiya narrated from him. Ishaq ibn Mansur reported from Ibn Ma'in that he was reliable, and Ibn Hibban listed him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  ur: "کوفہ کا ہلال بن عامر بن عمرو المزنی، صحابی، اپنے والد اور رافع بن عمرو المزنی سے روایت کیا؛ سیف بن عمر تمیمی نے روایت کیا۔"
  es: "Hilal ibn Amir ibn Amr al-Muzani de Kufa, un Compañero que narró de su padre y de Rafi' ibn Amr al-Muzani. Sayf ibn Umar al-Tamimi, Yahya ibn Sa'id al-Umawi, Abu Mu'awiya al-Darir y Marwan ibn Mu'awiya narraron de él. Ishaq ibn Mansur informó de Ibn Ma'in que era confiable, e Ibn Hibban lo incluyó entre los dignos de confianza. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  fr: "Hilal ibn Amir ibn Amr al-Muzani de Kufa, un compagnon qui a raconté de son père et de Rafi' ibn Amr al-Muzani. Sayf ibn Umar al-Tamimi, Yahya ibn Sa'id al-Umawi, Abu Mu'awiya al-Darir et Marwan ibn Mu'awiya ont rapporté de lui. Ishaq ibn Mansur a rapporté d'Ibn Ma'in qu'il était fiable, et Ibn Hibban l'a classé parmi les dignes de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
