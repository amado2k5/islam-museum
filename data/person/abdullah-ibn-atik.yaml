education:
  did_you_know:
    ar: "عبد الله بن عتيك صحابي من بني سلمة كان يرطن باليهودية؛ أمّره النبي على سرية خيبر لقتل أبي رافع، فتسلل إلى مخدعه وضربه بسيفه، وانكسرت ساقه في عودته."
    en: "Abd Allah ibn Atik, a Companion of Banu Salama who spoke the Jewish tongue, led the Prophet's Khaybar raid against Abu Rafi'; he struck him with his sword and broke his leg on the way back."
    ur: "عبداللہ بن عتیک، بنو سلمہ کے صحابی جو یہودی زبان بولتے تھے، خیبر کی مہم کے سردار بنے ابو رافع کو مارنے کے لیے؛ انہوں نے تلوار مارا اور واپسی میں ٹانگ ٹوٹ گئی۔"
    sources: [source/sahih-al-bukhari, source/ibn-hisham-sira]
