summary:
  en: "A heroic Companion from Banu Salima of the Khazraj fluent in Jewish dialect; chosen by the Prophet to lead the five-man covert mission to Khaybar to assassinate Sallam ibn Abi al-Huqayq (Abu Rafi'); though his leg was fractured on withdrawal, the Prophet wiped it and it healed instantly."
  ar: "صحابي فارس من بني سلمة من الخزرج، كان يرطن باليهودية؛ أمره النبي على السرية التي قصدت خيبر لاغتيال أبي رافع سلام بن أبي الحقيق محرض الأحزاب، فتسلل إلى مخدعه وضربه بسيفه حتى قتله، وانكسرت ساقه في عودته فمسحها النبي فبرأت في الحين."
