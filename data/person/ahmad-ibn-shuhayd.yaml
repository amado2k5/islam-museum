summary:
  ar: "وزير عبد الرحمن الناصر؛ استوزره الناصر فأهدى له هديته المشهورة سنة سبع وعشرين وثلاثمائة لثمان خلون من جمادى الأولى، وفيها على ما ثبت في كتاب ابن خلدون خمسمائة ألف مثقال من الذهب العين وأربعمائة رطل من التبر وخمسة وأربعون ألف دينار من سبائك الفضة في مائتي بدرة ومائتا أوقية من المسك وخمسمائة أوقية من العنبر وثلاثون شقة من الحرير المختم وعشرة أفرية من جلود الفنك الخراسانية، واتفق على أنه لم يهاد أحد من ملوك الأندلس بمثلها، فأضعف له الناصر رزق الوزارة وبلغه ثمانين ألف دينار وسماه ذا الوزارتين لذلك، وكان أول من تسمى بذلك بالأندلس امتثالاً لاسم صاعد بن مخلد وزير بني العباس ببغداد {cite:nafh-tib-maqqari p. 392-393}."
  en: "Al-Nasir's wazir whose gift of Jumada I 327 — half a million mithqals of coined gold, ambergris, musk, camphor and Khalifal silks — was the greatest present ever made to an Andalusi king, earning him the doubled stipend and the title Dhu'l-Wizaratayn, first so called in al-Andalus {cite:nafh-tib-maqqari p. 392-393}."
  es: "El visir de Al-Nasir, cuyo regalo de Jumada I 327 —medio millón de mithqals de oro acuñado, ámbar gris, almizcle, alcanfor y sedas Khalifal— fue el mayor regalo jamás hecho a un rey andalusí, lo que le valió el doble de estipendio y el título de Dhu'l-Wizaratayn, llamado así por primera vez en al-Andalus {cite:nafh-tib-maqqari p. 392-393}."
  fr: "Le vizir d'Al-Nasir dont le cadeau de Jumada I 327 — un demi-million de mithqals d'or frappé, d'ambre gris, de musc, de camphre et de soies Khalifal — fut le plus grand cadeau jamais fait à un roi andalou, lui valant le doublement de la pension et le titre de Dhu'l-Wizaratayn, premier titre ainsi donné en al-Andalus {cite:nafh-tib-maqqari p. 392-393}."
  ur: "الناصر کا وزیر جس کا جمعۃ اول 327 کا تحفہ — نصف ملین مثقال سکہ بند سونا، عنبر، کستوری، کافور اور خلیفہ ریشم — اندلس کے بادشاہ کو دیا گیا اب تک کا سب سے بڑا تحفہ تھا، جس نے اسے دوگنا وظیفہ اور ذوال وزارتین کا لقب دیا، جسے سب سے پہلے التقویٰ کے نام سے جانا جاتا ہے۔ ص 392-393}۔"
  tr: "Bakan Abdülrahman el-Nasır; el-Nasır onu veziri olarak atadı ve Hicri 327 yılında, Cemâde el-Ula'nın sekizinci gününde ona meşhur hediyesini sundu. İbn Haldun'un kitabında kaydedildiği üzere, bu hediye beş yüz bin miskal saf altın, dört yüz pound altın tozu, iki yüz kesede kırk beş bin dinar gümüş külçe, iki yüz ons misk, beş yüz ons ambergris, otuz parça mühürlü ipek ve on adet Horasan tilki derisi pelerin içeriyordu. Endülüs'te başka hiçbir krala böyle bir hediye verilmediği konusunda fikir birliği vardı. El-Nasır, vezir maaşını ikiye katlayarak seksen bin dinara çıkardı ve bu nedenle ona \"İki Bakanlığın Sahibi\" adını verdi. Bağdat'taki Abbasilerin veziri Sa'id ibn Mukhallad'ın örneğini izleyerek, Endülüs'te bu isimle anılan ilk kişi oldu. {alıntı:nafh-tib-maqqari s. 392-393}"
  id: "Menteri Abd al-Rahman al-Nasir; al-Nasir mengangkatnya sebagai menterinya dan memberinya hadiah terkenal pada tahun 327 H, pada tanggal delapan Jumada al-Ula. Hadiah itu, sebagaimana tercatat dalam kitab Ibn Khaldun, berisi lima ratus ribu mithqal emas murni, empat ratus pon serbuk emas, empat puluh lima ribu dinar batangan perak dalam dua ratus kantong, dua ratus ons musk, lima ratus ons ambergris, tiga puluh potong sutra yang disegel, dan sepuluh jubah dari kulit rubah Khorasani. Disepakati bahwa tidak ada raja Andalusia lain yang pernah menerima hadiah seperti itu. Al-Nasir menggandakan gaji menterinya, menjadikannya delapan puluh ribu dinar, dan menyebutnya \"Pemegang Dua Kementerian\" karena alasan ini. Dia adalah orang pertama di Andalusia yang disebut dengan nama ini, mengikuti contoh Sa'id ibn Mukhallad, menteri Abbasiyah di Baghdad. {mengutip:nafh-tib-maqqari hal. 392-393}"
