gender: male
summary:
  ar: "وزير عبد الرحمن الناصر؛ استوزره الناصر فأهدى له هديته المشهورة سنة سبع وعشرين وثلاثمائة لثمان خلون من جمادى الأولى، وفيها على ما ثبت في كتاب ابن خلدون خمسمائة ألف مثقال من الذهب العين وأربعمائة رطل من التبر وخمسة وأربعون ألف دينار من سبائك الفضة في مائتي بدرة ومائتا أوقية من المسك وخمسمائة أوقية من العنبر وثلاثون شقة من الحرير المختم وعشرة أفرية من جلود الفنك الخراسانية، واتفق على أنه لم يهاد أحد من ملوك الأندلس بمثلها، فأضعف له الناصر رزق الوزارة وبلغه ثمانين ألف دينار وسماه ذا الوزارتين لذلك، وكان أول من تسمى بذلك بالأندلس امتثالاً لاسم صاعد بن مخلد وزير بني العباس ببغداد {cite:nafh-tib-maqqari p. 392-393}."
  en: "Al-Nasir's wazir whose gift of Jumada I 327 — half a million mithqals of coined gold, ambergris, musk, camphor and Khalifal silks — was the greatest present ever made to an Andalusi king, earning him the doubled stipend and the title Dhu'l-Wizaratayn, first so called in al-Andalus {cite:nafh-tib-maqqari p. 392-393}."
