class: person
label: { ar: "أبو ذؤيب الهذلي", en: "Abu Dhu'ayb al-Hudhali", fr: "Abu Dhu'ayb al-Hudhali", es: "Abu Dhu'ayb al-Hudhali", ur: "ابو ذہیب الحذلی" }
summary:
  ar: "أبو ذؤيب خويلد بن خالد الهذلي الشاعر؛ خرج في جيش عبد الله بن سعد بن أبي سرح إلى إفريقية في غزوة عثمان فتوفي بها فقام بأمره عبد الله بن الزبير حتى واراه في لحده."
  en: "Abu Dhu'ayb Khuwaylid ibn Khalid al-Hudhali the poet; he rode out in Abdallah ibn Sa'd ibn Abi Sarh's army to Ifriqiya in Uthman's raid and died there — Abdallah ibn al-Zubayr attending him until he laid him in his grave."
  fr: "Abu Dhu'ayb Khuwaylid ibn Khalid al-Hudhali le poète ; il partit avec l'armée d'Abdallah ibn Sa'd ibn Abi Sarh vers l'Ifriqiya lors de l'expédition d'Uthman et y mourut — Abdallah ibn al-Zubayr s'occupant de lui jusqu'à le déposer dans sa tombe."
  es: "Abu Dhu'ayb Khuwaylid ibn Khalid al-Hudhali, el poeta, partió con el ejército de Abdallah ibn Sa'd ibn Abi Sarh hacia Ifriqiya durante la incursión de Uthman y murió allí. Abdallah ibn al-Zubayr lo acompañó hasta que lo depositó en su tumba."
  ur: "ابو ذویب خویلد بن خالد الہدلی شاعر؛ وہ عبداللہ بن سعد بن ابی سرح کے لشکر میں عثمان کے چھاپے میں افریقیہ کی طرف روانہ ہوا اور وہیں فوت ہو گیا - عبداللہ بن الزبیر ان کے ساتھ رہے یہاں تک کہ اس نے اسے قبر میں رکھ دیا۔"
  tr: "Şair Ebu Züeyb Huveylid ibn Halid el-Hudali; Abdullah ibn Sa'd ibn Abi Sarh'ın ordusunda Osman'ın seferinde Afrika'ya gitti ve orada öldü. Abdullah ibn el-Zübeyr, onu mezarına defnedene kadar işlerini yönetti."
  id: "Abu Dhu’ayb Khuwaylid ibn Khalid al-Hudhali, sang penyair; ia ikut serta dalam pasukan Abdullah ibn Sa’d ibn Abi Sarh ke Afrika dalam kampanye Utsman, dan ia meninggal di sana. Abdullah ibn al-Zubayr mengurus urusannya hingga ia menguburkannya."
