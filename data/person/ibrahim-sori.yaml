summary:
  ar: "إبراهيم سوري (توفي 1784 بحسب سطور التواريخ في المصادر، وتجعل رواياتها وفاته 1791/1792)، قائد عسكري فولاني وابن عم كرمخو ألفا، كان الذراع العسكرية لجهاد فوتا جلون، فصار قائداً فعلياً سنة 1748 وخلف ألفا رسمياً سنة 1751، وبعد نصره على السوليما سنة 1776 اتخذ لقب الألمامي ولُقّب «سوري مودو» أي سوري الأكبر، فثبّت دولة المقاطعات التسع من تمبو وصفّى مجلس فوغومبا المعارض له. ابنه عبد الرحمن إبراهيم سوري أُسر وبيع عبداً في أمريكا وله في المتحف بطاقته الخاصة."
  en: "Ibrahim Sori (died 1784 by the sources' date lines; their narratives put his death in 1791-1792) was a Fula military leader and Karamokho Alfa's cousin, the armed arm of the Futa Jallon jihad. De facto leader from 1748, he formally succeeded Alfa in 1751, and after his decisive victory over the Solima in 1776 took the title almami and the name Sori Mawdo, Sori the Great, organising the nine-province state from Timbo and purging the Fugumba council that opposed him. His son Abdul Rahman Ibrahima Sori was enslaved in America and has his own museum record."
  ur: "ابراہیم سوری (وفات 1784 ذرائع کی سطری تاریخ کے مطابق؛ ان کی بیانیہ روایات وفات 1791-1792 بتاتی ہیں) فولانی عسکری قائد اور کرمخو الفا کے چچا زاد بھائی تھے، جو فوٹا جالون کے جہاد کا مسلح بازو تھے۔ 1748 سے عملاً قائد، 1751 میں باقاعدہ الفا کے جانشین ہوئے، اور 1776 میں سولیما پر فیصلہ کن فتح کے بعد المامی کا لقب اور «سوری مودو» یعنی سوریِ اعظم کا نام اختیار کیا، ٹمبو سے نو صوبوں کی ریاست منظم کی اور فوگومبا کی مخالف مجلس کو ختم کیا۔ ان کے بیٹے عبد الرحمن ابراہیم سوری امریکہ میں غلام بنائے گئے اور میوزیم میں ان کی الگ بطاقہ موجود ہے۔"

