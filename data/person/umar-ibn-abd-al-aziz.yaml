label: { ar: "عمر بن عبد العزيز" }
summary:
  ar: "خليفة أموي استُخلف في سنة تسع وتسعين بدابق {cite:tabari-tarikh-abu-al-fadl j.6 p.550}، وذكر الطبري وفاته في سنة إحدى ومائة {cite:tabari-tarikh-abu-al-fadl j.6 p.565}.، وعند المسعودي استخلف يوم الجمعة لعشر بقين من صفر سنة تسع وتسعين وتوفي بدير سمعان من أعمال حمص لخمس بقين من رجب سنة إحدى ومائة فكانت خلافته سنتين وخمسة أشهر وخمسة أيام وهو ابن تسع وثلاثين سنة وأمه بنت عاصم بن عمر بن الخطاب وقبره بدير سمعان معظم يغشاه الناس، ولما قرأ الزهري كتاب سليمان كان أول من بايعه يزيد بن عبد الملك وتأخر سعيد وهشام يومين، وترك لعن علي على المنابر وجعل مكانه إن الله يأمر بالعدل والإحسان وقيل ربنا اغفر لنا ولإخواننا وقيل جعلهما جميعاً فاستعمل الناس ذلك إلى هذه الغاية، وكتب إلى عامله بالمدينة أن اقسم في ولد علي عشرة آلاف دينار فكتب في أي ولده فكتب اقسم في ولد علي من فاطمة فطالما تخطتهم حقوقهم، وقال في خطبته لست بقاض ولكني منفذ لست بمبتدع ولكني متبع إن الرجل الهارب من الإمام الظالم ليس بعاص ولكن الإمام الظالم هو العاصي ألا لا طاعة لمخلوق في معصية الخالق، وكان سبب توبته أن عبداً له جنى عليه فهم بضربه فقال العبد هل جنيت أنت جناية غضب بها عليك مولاك فهل عجل عليك العقوبة فقال اللهم لا فقال فلم تعجل عليّ ولم يعجل عليك فقال قم فأنت حر لوجه الله، وقال ملك الروم لوفده لقد بلغني من بره ما لو كان أحد بعد عيسى يحيي الموتى لظننت أنه يحيي الموتى {cite:muruj-al-dhahab p. 172-176}، وجادل حبشياً وشيبانياً من الخوارج حتى قال أرأيتم لعن أهل الذنوب فريضة فأخبرني متى عهدك بلعن فرعون قال ما أذكر متى لعنته قال لم لا تلعن فرعون وهو أخبث الخلق، فآمن الحبشي ومكث عنده خمسة عشر يوماً وذهب الشيباني ليعرض قوله على أصحابه {cite:muruj-al-dhahab p. 181-182}. وقال فيه عمرو بن عبيد أخذ عمر بن عبد العزيز الخلافة بغير حقها ولا باستحقاق لها ثم استحقها بالعدل حين أخذها {cite:muruj-al-dhahab p. 184}"
