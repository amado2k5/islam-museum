label: { ar: "عمر بن عبد العزيز", ur: "عمر بن عبد العزیز", en: "Umar ibn Abd al-Aziz" }
summary:
  ar: "خليفة أموي استُخلف في سنة تسع وتسعين بدابق {cite:tabari-tarikh-abu-al-fadl j.6 p.550}، وذكر الطبري وفاته في سنة إحدى ومائة {cite:tabari-tarikh-abu-al-fadl j.6 p.565}. وعند المسعودي استخلف يوم الجمعة لعشر بقين من صفر سنة تسع وتسعين وتوفي بدير سمعان من أعمال حمص لخمس بقين من رجب سنة إحدى ومائة فكانت خلافته سنتين وخمسة أشهر وخمسة أيام وهو ابن تسع وثلاثين سنة وأمه بنت عاصم بن عمر بن الخطاب وقبره بدير سمعان معظم يغشاه الناس، ولما قرأ الزهري كتاب سليمان كان أول من بايعه يزيد بن عبد الملك وتأخر سعيد وهشام يومين، وترك لعن علي على المنابر وجعل مكانه إن الله يأمر بالعدل والإحسان وقيل ربنا اغفر لنا ولإخواننا وقيل جعلهما جميعاً فاستعمل الناس ذلك إلى هذه الغاية، وكتب إلى عامله بالمدينة أن اقسم في ولد علي عشرة آلاف دينار فكتب في أي ولده فكتب اقسم في ولد علي من فاطمة فطالما تخطتهم حقوقهم، وقال في خطبته لست بقاض ولكني منفذ لست بمبتدع ولكني متبع إن الرجل الهارب من الإمام الظالم ليس بعاص ولكن الإمام الظالم هو العاصي ألا لا طاعة لمخلوق في معصية الخالق، وكان سبب توبته أن عبداً له جنى عليه فهم بضربه فقال العبد هل جنيت أنت جناية غضب بها عليك مولاك فهل عجل عليك العقوبة فقال اللهم لا فقال فلم تعجل عليّ ولم يعجل عليك فقال قم فأنت حر لوجه الله، وقال ملك الروم لوفده لقد بلغني من بره ما لو كان أحد بعد عيسى يحيي الموتى لظننت أنه يحيي الموتى {cite:muruj-al-dhahab p. 172-176}، وجادل حبشياً وشيبانياً من الخوارج حتى قال أرأيتم لعن أهل الذنوب فريضة فأخبرني متى عهدك بلعن فرعون قال ما أذكر متى لعنته قال لم لا تلعن فرعون وهو أخبث الخلق، فآمن الحبشي ومكث عنده خمسة عشر يوماً وذهب الشيباني ليعرض قوله على أصحابه {cite:muruj-al-dhahab p. 181-182}. وقال فيه عمرو بن عبيد أخذ عمر بن عبد العزيز الخلافة بغير حقها ولا باستحقاق لها ثم استحقها بالعدل حين أخذها {cite:muruj-al-dhahab p. 184} ويذكر الكتاب أن عبد الملك أوصى أبناءه بالاستماع إلى عمر بن عبد العزيز وصحبته ومشورته، وأنه لما تولى الحجاز في عهد الوليد أحسن التعامل مع العلماء واتخذهم مستشاريه، وخص سعيد بن المسيب بمزيد من التقدير. {cite:salabi-umayyad-state-2020 p.116-122} ويذكر الكتاب أنه وُلد على الراجح سنة 61هـ بالمدينة، وأن أباه عبد العزيز بن مروان ولي مصر أكثر من عشرين سنة، وأن أمه أم عاصم بنت عاصم بن عمر بن الخطاب، وأنه توفي سنة 101هـ عن نحو أربعين سنة. وذكر الكتاب أن سليمان عهد إليه بالخلافة في مرض موته، وأن هشام بن عبد الملك اعترض على البيعة له. {cite:salabi-umayyad-state-2020 p.157-161} ويذكر الكتاب أنه تربى في المدينة على يد علمائها، منهم صالح بن كيسان الذي أدّبه، وعبيد الله بن عبد الله بن عتبة، وأنه ولي إمارة المدينة في ربيع الأول سنة 87هـ، ثم ضُم إليه الطائف سنة 91هـ. وذكر الكتاب شروطه لقبول الإمارة: العدل وعدم الظلم، والإذن له بالحج في أول سنة، والإذن بالعطاء للناس في المدينة. وأنشأ مجلساً للشورى من فقهاء المدينة العشرة. {cite:salabi-umayyad-state-2020 p.168-173} ويذكر الكتاب أنه ولي المدينة في عهد الوليد، وأن الوليد وسّع المسجد النبوي بأمره، ونصح الوليد بألا يُقتل أحد إلا بعد ثبوت ذنبه كتابةً وشهادة، فكتب الوليد بذلك إلى الأمصار، وأن الوليد حين ثار على سليمان أنكر عمر ذلك، ثم استقر بدمشق مستشاراً لسليمان. ويذكر الكتاب أن عمر ندم على قتل خبيب بن عبد الله بن الزبير تحت التعذيب في ولايته، فاستعفى من الإمارة. {cite:salabi-umayyad-state-2020 p.174-183} ويذكر الكتاب أن سليمان كتب عهده لعمر ثم ليزيد بن عبد الملك، وأنه لم يكن يريد أن يستخلف ابنه أيوب، وأن هشاماً لم يُعلم بالعهد وسأل رجاء عنه فامتنع رجاء. ويذكر الكتاب أن عمر بُويع يوم الجمعة لعشر خلون من صفر سنة 99هـ، وأنه قال في خطبته الأولى إنه ابتُلي بالأمر من غير رأيه ولا طلبه، وأنه لا طاعة لمخلوق في معصية الله، وأنه يقبل من أعوانه خمساً: أن يرفعوا حاجة من لا يستطيع الوصول إليه، وأن يعينوه على الخير، وأن يرشدوه إليه، وأن لا يغتابوا الرعية، وأن لا يتدخلوا فيما لا يعنيهم، وأنه أرسل الكتب إلى الأمصار يطلب البيعة منها. ويذكر الكتاب أنه أكد الشورى بقوله إنه لم يُعيّن بمشورة، وأن أقرب الناس إليه يشيرون عليه، وأنه رد المظالم وبدأ بنفسه فباع ما عنده من فضول المال وجعله في سبيل الله. {cite:salabi-umayyad-state-2020 p.184-193} ويذكر الكتاب أن عمر رد المظالم بدءاً من نفسه، فرد الإقطاعات والفصوص والأموال التي لم يثبت حقه فيها، ورد فدك وجبل الورس وقطائع اليمامة إلى بيت المال، وأقرّ ما كان من أمر السويداء وجعله من صلب عطائه. ويذكر أنه جرّد بني أمية مما أخذوه بغير حق، فاعترضوا عليه، ثم فتح باب الشكوى لمن ظُلم منهم، فرد الحقوق إلى أصحابها، وعزل الولاة الظلمة كيزيد بن أبي مسلم وأسامة بن زيد التنوخي. وكتب إلى عماله بإسقاط الجزية عمن أسلم من أهل الذمة، وأن أرض الفيء لجماعة المسلمين. {cite:salabi-umayyad-state-2020 p.194-203} ويذكر الكتاب أن عمر كتب إلى عامله على مصر أن يضع الجزية عمن أسلم من أهل الذمة، وأن عامل الكوفة وعامل البصرة سألاه مثل ذلك فأجاب بأن الإسلام لم يُبعث به جابياً، وأنه يتمنى أن يسلم الناس كلهم حتى يكون هو والعامل حراثين يأكلان من كسب أيديهما. ويذكر أنه أبطل ما أحدثه الحجاج من منع الموالي من الهجرة، وأسقط عن أهل قبرص زيادة الجزية وعن أهل العراق ما زيد عليهم، وأمر بإنفاق بيت المال على من كبر من أهل الذمة وضعف عن العمل. ويذكر أنه أمر بعدم تعذيب الناس لاستخراج الخراج منهم، وأنه نهى عن المكس وأمر بهدم مكانه. وأنه اكتفى من البينة باليسير في رد المظالم، وأنه أمر بمكافأة من يدل على ظلم أو خطأ بين مئة وثلاثمئة دينار. ويذكر أن عمر ساوى بين أمراء بني أمية وعامة الناس في العطاء، وقضى في نزاع حلوان ضد أبيه. {cite:salabi-umayyad-state-2020 p.203-212} ويذكر الكتاب أنه أمر بألا يخص أحد بالدعاء في الخطب، وأنه أعطى الحرية للهجرة والتجارة في البر والبحر، وأن من أراد التنقل فليفعل، وأنه خيّر جواريه بين العتق والإمساك. ويصف الكتاب زهده، ومنه أن غلته حين استخلف كانت أربعين ألف دينار ثم صارت أربعمائة دينار عند وفاته، وأنه لم يرتزق من بيت مال المسلمين شيئاً، وأن زوجته قالت إنه لم يغتسل من جنابة إلا ثلاث مرات. {cite:salabi-umayyad-state-2020 p.213-222} ويصف الكتاب تواضعه وورعه: كان يصلح سراجه بنفسه، ويرد هدايا عماله خشية الرشوة، ويعيد ما زاد من المال إلى بيت المال، وكان يعفو عمن شجّ ابنه أو آذاه، وكان يقول إن التقي ملجم عن رد من شتمه. ويذكر الكتاب حزمه مع بني مروان حين طالبهم بردّ ما أخذوه، ومع الخوارج الذين أمر بمحاورتهم قبل قتالهم. ويذكر أن عمر ضرب الدراهم بعبارة «أمر الله بالوفاء والعدل»، وأنه كان يقول إن أحداً لا يجوز أن يُقام عليه حد إلا بعد علمه، ونقل الكتاب قول بعض العلماء إن عمر هو المجدد الأول على رأس المئة الأولى. {cite:salabi-umayyad-state-2020 p.223-234} ويذكر الكتاب أن عمر كتب إلى عماله في إصلاح المجتمع وأنه كان يقول: لا قيمة لحياة المرء إلا بسنة يحييها أو بدعة يميتها، وأن الناس في زمانه صاروا يتذاكرون أحوال الدين بعد أن كانوا يتذاكرون البناء والنكاح. ويذكر أن كتاباً له إلى أحد عماله يقرر أن المنكر إذا ظهر ولم يُنهَ عنه أصاب الله أهله بالعذاب، وأن السكوت عن المنكر ليس من قلة التكلف بل معصية. ويذكر أنه دعا الله أن يميته على الإيمان، ونقل الكتاب عن أهل العلم أنه من المجددين على رأس المئة الأولى ويرد الكتاب ذلك على أنه لم يُعدّ المجدد الكامل. {cite:salabi-umayyad-state-2020 p.236-249} ويذكر الكتاب أنه أنكر العصبية القبلية والأحلاف الجاهلية في كتاب إلى الضحاك بن عبد الرحمن، وأنه رفض أن يقوم الناس له، وقال إنما يقوم الناس لرب العالمين. ويذكر أنه فدى الأسرى في القسطنطينية ووعدهم بفدائهم، وأنه أمر بقضاء ديون الغارمين وإن كانوا يملكون بيتاً وخادماً، وأنه أعطى البنات الخمس في العراق نصيباً من بيت المال، وأنه أحيا سنة العطاء بين الناس وقسمه على الجميع، وأنه دفع المهور من بيت المال لمن لا يقدر عليها. {cite:salabi-umayyad-state-2020 p.252-260} ويذكر الكتاب أن عمر لم يقبل مديح الشعراء وأوقف عطاءهم، ونقل خبر جرير الذي مدحه وقال له إن الحق بالعطاء للفقراء، وأن الشعراء لم يكونوا يعودون إلى هذه العادة إلا بعد وفاته، وأنه قرب سابقاً البربري الذي كان ينشده شعر الزهد، وأنه كان يبكي حين يسمع المواعظ. ويصف الكتاب إدارته بأنها دولة للعلماء، فقد قرب العلماء وجعلهم بطانته ووزراءه ومستشاريه. {cite:salabi-umayyad-state-2020 p.261-271} ويذكر الكتاب أن عمر أمر بجمع السنن وتدوينها، وكتب إلى أبي بكر بن حزم أن ينظر ما كان من حديث رسول الله فيكتبه لأنه خاف دروس العلم وذهاب أهله، وأمر ابن شهاب الزهري بجمع السنن فكتبت دفتراً دفتراً وأرسل إلى كل أرض له عليها سلطان دفتراً، وأنه كان يطلب من يدونون السنة أن يميزوا الصحيح من السقيم، ويعد الكتاب هذا التدوين الرسمي من إنجازات عمر. {cite:salabi-umayyad-state-2020 p.297-302} ويذكر الكتاب أنه أوقف التوسع في الأطراف النائية، وكتب إلى مسلمة بن عبد الملك بالقفول من القسطنطينية بعد حصار دام نحو سنتين، وأرسل إليه خيلاً وطعاماً. وكتب إلى عامله على خراسان ألا يغزو ما وراء النهر، وإلى السند أن يدعو ملوكه إلى الإسلام. وولى إسماعيل بن عبيد الله بن أبي المهاجر على إفريقية في المحرم سنة 99هـ، فأسلم البربر في أيامه. وأمر الجراح بن عبد الله الحكمي بإسقاط الجزية عمن أسلم من أهل الذمة، فأسلم في خراسان نحو أربعة آلاف ذمي. {cite:salabi-umayyad-state-2020 p.332-343}"
