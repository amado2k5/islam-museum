label: { ar: "عمر بن عبد العزيز", ur: "عمر بن عبد العزیز", en: "Umar ibn Abd al-Aziz", es: "Umar ibn Abd al-Aziz", fr: "Umar ibn Abd al-Aziz" }
summary:
  ar: "عمر بن عبد العزيز، المكنى أبا حفص، خامس خلفاء الفرع المرواني من الأمويين، حكم من سنة 99هـ/717م إلى سنة 101هـ/720م. ولد على الأرجح في المدينة نحو سنة 60هـ، وولي المدينة سنة 87هـ، ثم استُخلف بعهد من سليمان بن عبد الملك بإشارة رجاء بن حيوة، وتوفي بدير سمعان قرب معرة النعمان. وتذكر دائرة المعارف الإسلامية أن سياسته المالية ما تزال غير واضحة وأن صورته اللاحقة معقدة.  خليفة أموي استُخلف في سنة تسع وتسعين بدابق {cite:tabari-tarikh-abu-al-fadl j.6 p.550}، وذكر الطبري وفاته في سنة إحدى ومائة {cite:tabari-tarikh-abu-al-fadl j.6 p.565}. وعند المسعودي استخلف يوم الجمعة لعشر بقين من صفر سنة تسع وتسعين وتوفي بدير سمعان من أعمال حمص لخمس بقين من رجب سنة إحدى ومائة فكانت خلافته سنتين وخمسة أشهر وخمسة أيام وهو ابن تسع وثلاثين سنة وأمه بنت عاصم بن عمر بن الخطاب وقبره بدير سمعان معظم يغشاه الناس، ولما قرأ الزهري كتاب سليمان كان أول من بايعه يزيد بن عبد الملك وتأخر سعيد وهشام يومين، وترك لعن علي على المنابر وجعل مكانه إن الله يأمر بالعدل والإحسان وقيل ربنا اغفر لنا ولإخواننا وقيل جعلهما جميعاً فاستعمل الناس ذلك إلى هذه الغاية، وكتب إلى عامله بالمدينة أن اقسم في ولد علي عشرة آلاف دينار فكتب في أي ولده فكتب اقسم في ولد علي من فاطمة فطالما تخطتهم حقوقهم، وقال في خطبته لست بقاض ولكني منفذ لست بمبتدع ولكني متبع إن الرجل الهارب من الإمام الظالم ليس بعاص ولكن الإمام الظالم هو العاصي ألا لا طاعة لمخلوق في معصية الخالق، وكان سبب توبته أن عبداً له جنى عليه فهم بضربه فقال العبد هل جنيت أنت جناية غضب بها عليك مولاك فهل عجل عليك العقوبة فقال اللهم لا فقال فلم تعجل عليّ ولم يعجل عليك فقال قم فأنت حر لوجه الله، وقال ملك الروم لوفده لقد بلغني من بره ما لو كان أحد بعد عيسى يحيي الموتى لظننت أنه يحيي الموتى {cite:muruj-al-dhahab p. 172-176}، وجادل حبشياً وشيبانياً من الخوارج حتى قال أرأيتم لعن أهل الذنوب فريضة فأخبرني متى عهدك بلعن فرعون قال ما أذكر متى لعنته قال لم لا تلعن فرعون وهو أخبث الخلق، فآمن الحبشي ومكث عنده خمسة عشر يوماً وذهب الشيباني ليعرض قوله على أصحابه {cite:muruj-al-dhahab p. 181-182}. وقال فيه عمرو بن عبيد أخذ عمر بن عبد العزيز الخلافة بغير حقها ولا باستحقاق لها ثم استحقها بالعدل حين أخذها {cite:muruj-al-dhahab p. 184} ويذكر الكتاب أن عبد الملك أوصى أبناءه بالاستماع إلى عمر بن عبد العزيز وصحبته ومشورته، وأنه لما تولى الحجاز في عهد الوليد أحسن التعامل مع العلماء واتخذهم مستشاريه، وخص سعيد بن المسيب بمزيد من التقدير. {cite:salabi-umayyad-state-2020 p.116-122} ويذكر الكتاب أنه وُلد على الراجح سنة 61هـ بالمدينة، وأن أباه عبد العزيز بن مروان ولي مصر أكثر من عشرين سنة، وأن أمه أم عاصم بنت عاصم بن عمر بن الخطاب، وأنه توفي سنة 101هـ عن نحو أربعين سنة. وذكر الكتاب أن سليمان عهد إليه بالخلافة في مرض موته، وأن هشام بن عبد الملك اعترض على البيعة له. {cite:salabi-umayyad-state-2020 p.157-161} ويذكر الكتاب أنه تربى في المدينة على يد علمائها، منهم صالح بن كيسان الذي أدّبه، وعبيد الله بن عبد الله بن عتبة، وأنه ولي إمارة المدينة في ربيع الأول سنة 87هـ، ثم ضُم إليه الطائف سنة 91هـ. وذكر الكتاب شروطه لقبول الإمارة: العدل وعدم الظلم، والإذن له بالحج في أول سنة، والإذن بالعطاء للناس في المدينة. وأنشأ مجلساً للشورى من فقهاء المدينة العشرة. {cite:salabi-umayyad-state-2020 p.168-173} ويذكر الكتاب أنه ولي المدينة في عهد الوليد، وأن الوليد وسّع المسجد النبوي بأمره، ونصح الوليد بألا يُقتل أحد إلا بعد ثبوت ذنبه كتابةً وشهادة، فكتب الوليد بذلك إلى الأمصار، وأن الوليد حين ثار على سليمان أنكر عمر ذلك، ثم استقر بدمشق مستشاراً لسليمان. ويذكر الكتاب أن عمر ندم على قتل خبيب بن عبد الله بن الزبير تحت التعذيب في ولايته، فاستعفى من الإمارة. {cite:salabi-umayyad-state-2020 p.174-183} ويذكر الكتاب أن سليمان كتب عهده لعمر ثم ليزيد بن عبد الملك، وأنه لم يكن يريد أن يستخلف ابنه أيوب، وأن هشاماً لم يُعلم بالعهد وسأل رجاء عنه فامتنع رجاء. ويذكر الكتاب أن عمر بُويع يوم الجمعة لعشر خلون من صفر سنة 99هـ، وأنه قال في خطبته الأولى إنه ابتُلي بالأمر من غير رأيه ولا طلبه، وأنه لا طاعة لمخلوق في معصية الله، وأنه يقبل من أعوانه خمساً: أن يرفعوا حاجة من لا يستطيع الوصول إليه، وأن يعينوه على الخير، وأن يرشدوه إليه، وأن لا يغتابوا الرعية، وأن لا يتدخلوا فيما لا يعنيهم، وأنه أرسل الكتب إلى الأمصار يطلب البيعة منها. ويذكر الكتاب أنه أكد الشورى بقوله إنه لم يُعيّن بمشورة، وأن أقرب الناس إليه يشيرون عليه، وأنه رد المظالم وبدأ بنفسه فباع ما عنده من فضول المال وجعله في سبيل الله. {cite:salabi-umayyad-state-2020 p.184-193} ويذكر الكتاب أن عمر رد المظالم بدءاً من نفسه، فرد الإقطاعات والفصوص والأموال التي لم يثبت حقه فيها، ورد فدك وجبل الورس وقطائع اليمامة إلى بيت المال، وأقرّ ما كان من أمر السويداء وجعله من صلب عطائه. ويذكر أنه جرّد بني أمية مما أخذوه بغير حق، فاعترضوا عليه، ثم فتح باب الشكوى لمن ظُلم منهم، فرد الحقوق إلى أصحابها، وعزل الولاة الظلمة كيزيد بن أبي مسلم وأسامة بن زيد التنوخي. وكتب إلى عماله بإسقاط الجزية عمن أسلم من أهل الذمة، وأن أرض الفيء لجماعة المسلمين. {cite:salabi-umayyad-state-2020 p.194-203} ويذكر الكتاب أن عمر كتب إلى عامله على مصر أن يضع الجزية عمن أسلم من أهل الذمة، وأن عامل الكوفة وعامل البصرة سألاه مثل ذلك فأجاب بأن الإسلام لم يُبعث به جابياً، وأنه يتمنى أن يسلم الناس كلهم حتى يكون هو والعامل حراثين يأكلان من كسب أيديهما. ويذكر أنه أبطل ما أحدثه الحجاج من منع الموالي من الهجرة، وأسقط عن أهل قبرص زيادة الجزية وعن أهل العراق ما زيد عليهم، وأمر بإنفاق بيت المال على من كبر من أهل الذمة وضعف عن العمل. ويذكر أنه أمر بعدم تعذيب الناس لاستخراج الخراج منهم، وأنه نهى عن المكس وأمر بهدم مكانه. وأنه اكتفى من البينة باليسير في رد المظالم، وأنه أمر بمكافأة من يدل على ظلم أو خطأ بين مئة وثلاثمئة دينار. ويذكر أن عمر ساوى بين أمراء بني أمية وعامة الناس في العطاء، وقضى في نزاع حلوان ضد أبيه. {cite:salabi-umayyad-state-2020 p.203-212} ويذكر الكتاب أنه أمر بألا يخص أحد بالدعاء في الخطب، وأنه أعطى الحرية للهجرة والتجارة في البر والبحر، وأن من أراد التنقل فليفعل، وأنه خيّر جواريه بين العتق والإمساك. ويصف الكتاب زهده، ومنه أن غلته حين استخلف كانت أربعين ألف دينار ثم صارت أربعمائة دينار عند وفاته، وأنه لم يرتزق من بيت مال المسلمين شيئاً، وأن زوجته قالت إنه لم يغتسل من جنابة إلا ثلاث مرات. {cite:salabi-umayyad-state-2020 p.213-222} ويصف الكتاب تواضعه وورعه: كان يصلح سراجه بنفسه، ويرد هدايا عماله خشية الرشوة، ويعيد ما زاد من المال إلى بيت المال، وكان يعفو عمن شجّ ابنه أو آذاه، وكان يقول إن التقي ملجم عن رد من شتمه. ويذكر الكتاب حزمه مع بني مروان حين طالبهم بردّ ما أخذوه، ومع الخوارج الذين أمر بمحاورتهم قبل قتالهم. ويذكر أن عمر ضرب الدراهم بعبارة «أمر الله بالوفاء والعدل»، وأنه كان يقول إن أحداً لا يجوز أن يُقام عليه حد إلا بعد علمه، ونقل الكتاب قول بعض العلماء إن عمر هو المجدد الأول على رأس المئة الأولى. {cite:salabi-umayyad-state-2020 p.223-234} ويذكر الكتاب أن عمر كتب إلى عماله في إصلاح المجتمع وأنه كان يقول: لا قيمة لحياة المرء إلا بسنة يحييها أو بدعة يميتها، وأن الناس في زمانه صاروا يتذاكرون أحوال الدين بعد أن كانوا يتذاكرون البناء والنكاح. ويذكر أن كتاباً له إلى أحد عماله يقرر أن المنكر إذا ظهر ولم يُنهَ عنه أصاب الله أهله بالعذاب، وأن السكوت عن المنكر ليس من قلة التكلف بل معصية. ويذكر أنه دعا الله أن يميته على الإيمان، ونقل الكتاب عن أهل العلم أنه من المجددين على رأس المئة الأولى ويرد الكتاب ذلك على أنه لم يُعدّ المجدد الكامل. {cite:salabi-umayyad-state-2020 p.236-249} ويذكر الكتاب أنه أنكر العصبية القبلية والأحلاف الجاهلية في كتاب إلى الضحاك بن عبد الرحمن، وأنه رفض أن يقوم الناس له، وقال إنما يقوم الناس لرب العالمين. ويذكر أنه فدى الأسرى في القسطنطينية ووعدهم بفدائهم، وأنه أمر بقضاء ديون الغارمين وإن كانوا يملكون بيتاً وخادماً، وأنه أعطى البنات الخمس في العراق نصيباً من بيت المال، وأنه أحيا سنة العطاء بين الناس وقسمه على الجميع، وأنه دفع المهور من بيت المال لمن لا يقدر عليها. {cite:salabi-umayyad-state-2020 p.252-260} ويذكر الكتاب أن عمر لم يقبل مديح الشعراء وأوقف عطاءهم، ونقل خبر جرير الذي مدحه وقال له إن الحق بالعطاء للفقراء، وأن الشعراء لم يكونوا يعودون إلى هذه العادة إلا بعد وفاته، وأنه قرب سابقاً البربري الذي كان ينشده شعر الزهد، وأنه كان يبكي حين يسمع المواعظ. ويصف الكتاب إدارته بأنها دولة للعلماء، فقد قرب العلماء وجعلهم بطانته ووزراءه ومستشاريه. {cite:salabi-umayyad-state-2020 p.261-271} ويذكر الكتاب أن عمر أمر بجمع السنن وتدوينها، وكتب إلى أبي بكر بن حزم أن ينظر ما كان من حديث رسول الله فيكتبه لأنه خاف دروس العلم وذهاب أهله، وأمر ابن شهاب الزهري بجمع السنن فكتبت دفتراً دفتراً وأرسل إلى كل أرض له عليها سلطان دفتراً، وأنه كان يطلب من يدونون السنة أن يميزوا الصحيح من السقيم، ويعد الكتاب هذا التدوين الرسمي من إنجازات عمر. {cite:salabi-umayyad-state-2020 p.297-302} ويذكر الكتاب أنه أوقف التوسع في الأطراف النائية، وكتب إلى مسلمة بن عبد الملك بالقفول من القسطنطينية بعد حصار دام نحو سنتين، وأرسل إليه خيلاً وطعاماً. وكتب إلى عامله على خراسان ألا يغزو ما وراء النهر، وإلى السند أن يدعو ملوكه إلى الإسلام. وولى إسماعيل بن عبيد الله بن أبي المهاجر على إفريقية في المحرم سنة 99هـ، فأسلم البربر في أيامه. وأمر الجراح بن عبد الله الحكمي بإسقاط الجزية عمن أسلم من أهل الذمة، فأسلم في خراسان نحو أربعة آلاف ذمي. {cite:salabi-umayyad-state-2020 p.332-343}"
  en: "Umar ibn Abd al-Aziz, called Abu Hafs, was the fifth caliph of the Marwanid branch of the Umayyads and reigned from 99/717 to 101/720. Probably born in Medina around 60/680, he governed Medina from 87/706, was named heir by Sulayman ibn Abd al-Malik, and died at Dayr Sim'an near Ma'arrat al-Nu'man. The Encyclopaedia of Islam says his fiscal policies remain unclear and his later image is complex."
  ur: "عمر بن عبد العزیز، کنیت ابو حفص، اموی خاندان کی مروانی شاخ کے پانچویں خلیفہ تھے اور 99ھ/717ء سے 101ھ/720ء تک حکمران رہے۔ غالباً 60ھ/680ء کے لگ بھگ مدینہ میں پیدا ہوئے، 87ھ/706ء سے مدینہ کے گورنر رہے، سلیمان بن عبد الملک نے انھیں جانشین نامزد کیا، اور ان کی وفات معرۃ النعمان کے قریب دیر سمعان میں ہوئی۔ دائرۃ المعارف الاسلامیہ کے مطابق ان کی مالیاتی پالیسیاں اب بھی واضح نہیں اور ان کی بعد کی تصویر پیچیدہ ہے۔"
  es: "Umar ibn Abd al-Aziz, llamado Abu Hafs, fue el quinto califa de la rama marwaní de los omeyas y reinó desde el año 99/717 hasta el 101/720. Probablemente nació en Medina alrededor del año 60/680, gobernó Medina desde el año 87/706, fue nombrado heredero por Sulayman ibn Abd al-Malik y murió en Dayr Sim'an, cerca de Ma'arrat al-Nu'man. La Enciclopedia del Islam señala que sus políticas fiscales siguen sin estar claras y que su imagen posterior es compleja."
  fr: "Umar ibn Abd al-Aziz, dit Abou Hafs, fut le cinquième calife de la branche marwanide des Omeyyades et régna de 99/717 à 101/720. Probablement né à Médine vers 60/680, il gouverna la capitale à partir de 87/706, fut désigné comme son successeur par Sulayman ibn Abd al-Malik et mourut à Dayr Sim'an, près de Ma'arrat al-Nu'man. L'Encyclopédie de l'Islam indique que sa politique fiscale demeure obscure et que son image postérieure est complexe."
  tr: "Ömer bin Abdülaziz, lakabı Ebu Hafs, Emevillerin Merwani kolunun beşinci halifesi olup, 99 Hicri/717 M.S.'den 101 Hicri/720'ye kadar hüküm sürmüştür. Muhtemelen yaklaşık 60 Hicri Medine'de doğmuş, 87 Hicri'de Medine valisi olmuştur, ardından Raja' ibn Haywa'nın isteğiyle Süleyman ibn Abdül-Malik'ten bir antlaşmayla devralınmış ve Ma'arrat al-Numan yakınlarındaki Deyr Simeon'da ölmüştür. İslami Ansiklopedi, mali politikasının belirsiz olduğunu ve sonraki halinin karmaşık olduğunu belirtmektedir. Doksan doksan dokuz yılında Dabiq'ta bir Emevi halifesi atanmıştır {alıntı:Tabari-tarikh-abu-al-fadl j.6 s.550} ve al-Tabari, onun 11. yıldaki ölümünü belirtmiştir {cite:tabari-tarikh-abu-al-fadl j.6 s.565}. al-Mas'udi'ye göre, doksan dokuzuncu yılın Safar'ının onuncusu Cuma günü vekil olarak atandı. Yüz bir Recep'in beşinde Homs bölgesindeki Deir Simeon'da öldü. Halifeliği otuz dokuz yaşında iki yıl, beş ay ve beş gün sürdü. Annesi Asim ibn Umar ibn al-Khattab'ın kızıydı. Deir Simeon'daki mezarı halk tarafından geniş şekilde haber edildi. Al-Zuhri Süleyman'ın kitabını okuduğunda, Yezid bin Abd al-Malik ona ilk bağlılık yemini etti, Sa'id ve Hisham ise kürsüden Ali'yi lanetlemekten kaçınarak iki gün gecikti ve yerini aldı... Allah adalet ve iyilik emreder, \"Rabbimiz, bizi ve kardeşlerimizi affet,\" denirdi ve \"Hepsini bir araya getirdi.\" Halk bunu bu amaçla kullandı. Medine'deki valisine yazdı, \"Ali'nin oğlu için on bin dinar yemin ederim,\" dedi ve oğluna yazdı. \"Hakları aşıldığı sürece, Ali'nin Fatimah'tan gelen çocukları adına yemin ederim.\" dedi. Vaazında şöyle dedi: \"Ben bir yargıç değilim, bir vasiyim; yenilikçi değilim, takipçiyim. Haksız bir imamdan kaçan adam günahkar değildir, ama haksız bir imam günahkardır.\" Yaratılmış bir varlığa itaat yok mu, Yaratıcıya itaatsizlik eder mi? Tövbe etmesinin sebebi, bir hizmetkârının ona kötülük etmesiydi, bu yüzden ona vurdu. Hizmetçi dedi ki, \"Efendinin sana kızdığı bir suç mu işledin? Cezayı hızlandırdı mı?\" dedi. \"Ey Allah, hayır.\" dedi. \"Neden bana karşı acele ettin?\" dedi. Dedi ki, \"Kalk, çünkü Allah için özgürsün.\" Roma kralı heyetine şöyle dedi: \"Onun doğruluğundan duydum ki, İsa'dan sonra biri ölüleri diriltirse, ölüleri dirilttiğini sanırım.\" {alıntı: Muruj-al-Dhahab s. 172-176} ve Haricilerden bir Habeşli ile bir Şeybani ile tartıştı, ta ki 'Günahkarları lanetlemenin bir zorunluluk olduğunu mu sanıyorsunuz? Bana söyleyin, Firavun'u lanetlediğinizi ne zaman bildiniz?' dedi. O dedi ki, 'Firavun'u ne zaman lanetlediğini hatırlamıyorum, o en kötü yaratıktır.' Habeşli inandı ve onunla on beş gün kaldı. El-Şeybani sözlerini yoldaşlarına sunmaya gitti {atıf:Muruj-al-Dhahab s. 181-182}. Amr bin Ubeyd bu mektupta, Ömer bin Abdülaziz'in haklı ya da haklı hak etmeden halifeliği aldığını, sonra hak ettiğini belirtmiştir. {cit:) Muruj-al-Dhahab, s. 184} Kitapta Abd al-Malik'in oğullarına Ömer ibn Abdülaziz'i dinlemelerini, kendisine eşlik etmelerini ve danışmalarını tavsiye ettiği belirtilir. Vedrid'in saltanatı sırasında Hicaz'ı yönetirken alimlere iyi davrandı ve onları danışman olarak atadı; böylece Seyid bin Musayib'e daha büyük saygı gösterdi. {alıntı:Selabi-Umayyad-devlet-2020, s.116-122} Kitapta, onun 61 Hicri yılında Medine'de el-Rajih'in oğlu olduğu, babası Abdülaziz bin Mervan'ın yirmi yıldan fazla Mısır valisi olduğu, annesinin Um Asim bint Asim bin Ömer bin Ömer bin Hattab olduğu ve 101 Hicri yılında, yaklaşık kırk yaşında öldüğü belirtilir. Kitapta, Süleyman'ın ölümcül hastalığı sırasında halifeliğin sorumluluğu verildiği ve Hişam ibn Abdülmelik'in ona bağlılık yemini etmeye karşı çıktığı belirtilmiştir. {kaynak:Selabi-Umayyad-devlet-2020 s.157-161} Kitapta, Salih ibn Kaysan'ın kendisine öğreten Übeydullah ibn Abdullah ibn Utbah gibi alimleri altında Medine'de yetiştirildiği ve 87 Hicri yılında Rabi'l-Avval'da Medine valisi olduğu, ardından 91 Hicri'de Taif'i ilhak ettiği belirtilmiştir. Mektupta emirliği kabul etme koşulları belirtilmiştir: adalet, adaletsizliğin olmaması, ilk yıl Hac yapma izni ve Medine halkına izin verilmesi. Medine'nin on hukukçusundan oluşan bir danışma konseyi kurdu. {cite:Selabi-Umayyad-State-2020 s.168-173} Kitapta, el-Velid'in saltanatı sırasında Medine valisi olduğu, el-Velid'in emriyle Peygamber Camii'ni genişlettiği ve el-Velid'e suçu yazılı ve tanıklıkla kanıtlanmadıkça kimseyi öldürmemesini tavsiye ettiği belirtilir. El-Velid bu konuda vilayetlere yazdı ve el-Velid Süleyman'a karşı isyan ettiğinde Ömer bunu reddetti. Daha sonra Süleyman'ın danışmanı olarak Şam'a yerleşti. Kitapta, Ömer'in valiliği sırasında Habib bin Abdullah ibn el-Zubeyr'i işkence altında öldürdüğü için pişman olduğu ve bu yüzden valilikten istifa ettiği belirtilir. {alıntı:Selabi-Emeyyad-devlet-2020 s.174-183} Kitapta Süleyman'ın önce Ömer'e, sonra Yezid ibn Abdülmelik'e yemin ettiğini, oğlu Eyyub'un yerine geçmek istemediğini, Hişam'ın antlaşmadan habersiz olup Raja'dan istediğini, ancak Raja'nın reddettiğini belirtir. Kitap, Ömer'in Cuma günü, Safar'dan on gün önce, 99 Hicri yılında, bağlılık yemini ettiğini ve ilk vaazında bu konudan kendi görüşü veya isteği olmadan etkilendiğini, Tanrı'ya itaatsizlik etmenin hiçbir yaratığa itaat olmadığını ve yardımcılarından beş şeyi kabul ettiğini belirtir: ulaşamadığı insanların ihtiyaçlarını karşılamak, ona iyi yardım etmek, ona rehberlik etmek, tebaaları sırtından kırmamak, onları ilgilendirmeyen işlere karışmamak ve eyaletlere bağlılık istemek için mektuplar gönderdiği. Kitap, danışma yoluyla atanmadığını, en yakınlarının ona işaret ettiğini, şikayetlerini karşılık verdiğini ve kendisiyle başlayıp fazla servetini satıp Tanrı'nın işine adadığını belirtir. {alıntı:Salabi-umayyad-state-2020 s.184-193} Kitap, Umar'ın şikayetlerini kendisinden başlayarak, haklarının yerleşilmediği toprakları, toprakları ve servetleri yeniden taahhüt ettiğini, Fadak, Cebel-savaşlar ve el-Yamama mülklerini hazineye geri verdiğini, Suwayda'da olanları kabul ettiğini ve bağışlarının bir parçası haline getirdiğini belirtir. Emeviyelerin haksız yere aldıkları şeylerden mahrum bıraktığı, bunun üzerine ona itiraz ettikleri, haksızlığa uğrayanların şikayet kapısını açtığı, haklarını sahiplerine geri verdiği ve Yazid bin Abi Muslim ile Usama ibn Zayd al-Tanukhi gibi baskıcı valileri görevden aldığı belirtilir. Yetkililerine, İslam'ı benimseyenlerden cizyeden muaf tutulmasını ve el-Fay' topraklarının Müslüman topluluğa ait olduğunu yazdı. {cite:Salabi-umayyad-state-2020 s.194-203} Kitapta, Umar'ın Mısır valisine Islam'ı benimsemiş zimmilere cizye dayatması için yazdığı ve Kufa ile Basra valisinin de aynı şeyi kendisine sorduğu, onun da İslam'ın onu tahsildar olarak göndermediğini, herkesin din değiştirmesini istediğini, böylece kendisi ve valinin kendi kazançlarından sürüp kazanç sağlamasını istediğini belirtir. Al-Hacac'ın mevelinin göçünü önlemek için yaptığı şeyi geçersiz kıldığı, Kıbrıs halkı için fazladan cizye ve Irak halkına eklenen hakları kaldırdığı ve işlerinde yaşlanıp zayıflayan zimmiler için kamu hazinesinin harcanmasını emrettiği belirtilir. İnsanların kharacı toplamak için işkence görmemelerini, vergileri yasakladığını ve yerlerinin yıkılmasını emrettiği belirtilir. Şikayetlerin giderilmesini kolaylaştıracak kadar kanıt sundu ve haksızlık veya hata gösteren herkese yüz ila üç yüz dinar arasında ödül emretti. Ömer'in Emevi prensleri ile halkı cömertlikle eşitlediği ve Helvan anlaşmazlığında babasına karşı hüküm verdiği belirtilir. {alıntı:salabi-umayyad-state-2020 s.203-212} Kitapta, kimsenin vaazlarda yalvarmakla sınırlı kalmamasını emrettiğini, karasal ve deniz yoluyla göç ve ticaret özgürlüğü verdiğini, hareket etmek isteyenin hareket etmesi gerektiğini ve özgürleştirme ile çekimser kalma arasında en iyi köle olduğunu belirtir. Kitap, onun münzeviyetini anlatır; milletvekili olarak atandığında gelirinin kırk bin dinar olduğunu, ölümünde dört yüz dinara yükseldiğini, Müslümanların kamu hazinesinden hiç geçimini sağlamadığını ve eşinin cenaba'dan sadece üç kez ghusl yaptığını söylediğini belirtir. {cite:Salabi-umayyad-state-2020 s.213-222} Kitap, onun alçakgönüllülüğünü ve dindarlığını anlatır: Kendisi lambasını tamir eder, rüşvet korkusuyla işçilerinden hediyeleri geri verir, fazla servetini kamu hazinesine geri verir, oğluna zarar veren veya rahatsız edenleri affeder ve dindarların kendisine hakaret edenleri geri püskürtmesinin engellendiğini söyler. Mektupta, Banu Merwan'a karşı kararlılığından bahseder; Hanı ile savaşmadan önce onlarla müzakere etmelerini emrettiği belirtilir. Mektupta, Ömer'in \"Allah sadakat ve adalet emretti\" ifadesiyle paraları bastığı ve kimsenin bunu bilmeden cezalandırılmaması gerektiğini söylediği belirtilir. Kitap, bazı alimlerin Ömer'in birinci yüzyılın başında ilk yenileyici olduğunu söylediğini aktarır. {cite:salabi-umayyad-state-2020 s.223-234} Kitapta, Ömer'in toplumu reform eden ajanlarına yazdığı ve şöyle dediği belirtilir: Bir insanın hayatı, sadece bir sünnet ile canlandırır ya da onu öldüren bir yenilikle olur ve onun zamanında insanlar inşaat ve evlilik üzerine konuşulduktan sonra dini koşulları tartışmaya başlamıştır. Mektupta, bir yetkilisine yazdığı bir mektupta, kötülük ortaya çıkarsa ve yasaklamazsa Allah'ın halkını cezalandıracağı ve kötülük hakkında sessiz kalmanın gayret değil, günah olduğu belirtilir. Kitapta, iman için Tanrı'ya onu öldürmesi için dua ettiği ve birinci yüzyılın başındaki yenileyicilerden biri olarak alıntı yaptığı belirtilir. Kitap, onun artık tam bir yenileyici olmadığını belirterek bunu çürütmektedir. {Kaynak:Selabi-Umayyad-State-2020 s.236-249} Kitapta, Al-Dhahhak ibn Abd al-Rahman'a yazdığı bir mektupta aşiret kabileciliğini ve İslam öncesi ittifakları reddettiğini ve insanların kendisi için ayağa kalkmasına izin vermediğini, insanların sadece dünyaların Rabbi için durduğunu söylediğini belirtir. Kitapta, Konstantinopolis'teki esirleri fidye verdiği ve fidye sözü verdiği, borçluların ev ve hizmetçi olsa bile borçlarının ödenmesini emrettiği, Irak'taki beş kızına kamu hazinesinden pay verdiği, insanlar arasında bağış geleneğini canlandırıp herkes arasında dağıttığı ve kamu hazinesinden çeyiz ödediği, karşılayamayanlara ise çeyiz ödediği belirtilir. {cite:Salabi-umayyad-state-2020 s.252-260} Kitap, Umar'ın şairlerin övgüsünü kabul etmediğini ve onları vermeyi bıraktığını belirtir. Jarir'in hikayesini aktarır; Jarir, onu överek verme hakkının fakirlere ait olduğunu, şairlerin bu geleneğe ancak ölümünden sonra döndüğünü, daha önce Berbi'ye yakın olduğunu, onun münzevi şiir okuduğunu ve vaazları dinlerken ağladığını söyler. Kitap, yönetimini alimler için bir devlet olarak tanımlar; alimleri yakınlaştırır ve onları maiyeti, bakanları ve danışmanları yapar. {kaynak:salabi-umayyad-state-2020 s.261-271} Kitap, Ömer'in Sünnet'in toplanmasını ve belgelenmesini emrettiği ve Ebu Bekir bin Hazm'a, bilginin derslerinden ve ailesinin kaybından korktuğu için Allah'ın Resul'un hadislerini gözden geçirmesi ve yazması için yazdığı belirtilir. İbn Şihab al-Zuhri sünnetin toplanmasını emretti, bu yüzden bir deftere yazıldı ve yetkili olduğu her ülkeye bir defter gönderdi. Sünneti kaydedenlerden gerçek olanı zayıftan ayırt etmelerini istedi. Bu resmi kayıt, Umar'ın başarılarından biri olarak kabul edilir. {cite:Selabi-Umayyad-state-2020 s.297-302} Kitapta, uzak çevrelerdeki genişlemeyi durdurduğu ve yaklaşık iki yıl süren kuşatmanın ardından Maslama bin Abdülmelik'e kitapları Konstantinopolis'ten kilitlemesini, ona at ve yiyecek gönderdiğini belirtir. Horasan valisine nehrin ötesine saldırmamasını ve krallarını İslam'a çağırmasını yazdı. İsmail ibn Ubeyd Allah ibn Ebi el-Muhacir 99 Hicri Muharrem'de İfrikiye'yi atadı ve Berberiler onun döneminde İslam'ı benimsediler. El-Cerrah ibn Abdullah el-Haki, zimmilerden cizyenin çıkarılmasını emretti, böylece yaklaşık dört bin zimmi Horasan'da İslam'ı benimsedi. {kaynak:Selabi-Umayyad-devlet-2020 s.332-343}"
  id: "Umar ibn Abd al-Aziz, yang dijuluki Abu Hafs, adalah khalifah kelima dari cabang Marwanid Umayyah, memerintah dari tahun 99 H/717 M hingga 101 H/720 M. Ia kemungkinan besar lahir di Madinah sekitar tahun 60 H, menjadi gubernur Madinah pada tahun 87 H, kemudian digantikan oleh perjanjian dari Sulayman ibn Abd al-Malik atas perintah Raja' ibn Haywa, dan meninggal di Deir Simeon dekat Ma'arrat al-Numan. Ensiklopedia Islam mencatat bahwa kebijakan keuangannya masih belum jelas dan bentuknya yang kemudian rumit. Seorang khalifah Umayyah diangkat di Dabiq pada tahun sembilan puluh sembilan {cite:tabari-tarikh-abu-al-fadl j.6 hlm.550}, dan al-Tabari menyebutkan kematiannya pada tahun seratus satu {cite:tabari-tarikh-abu-al-fadl j.6 hlm.565}. Menurut al-Mas'udi, ia diangkat sebagai wakil pada hari Jumat, tanggal sepuluh Safar, tahun sembilan puluh sembilan. Ia meninggal di Deir Simeon, distrik Homs, pada tanggal lima Rajab tahun seratus satu. Khalifahnya berlangsung selama dua tahun, lima bulan, dan lima hari pada usia tiga puluh sembilan. Ibunya adalah putri Asim ibn Umar ibn al-Khattab. Makamnya di Deir Simeon banyak dipenuhi oleh masyarakat. Ketika al-Zuhri membaca buku Suleiman, Yazid ibn Abd al-Malik adalah yang pertama bersumpah setia kepadanya, sementara Sa'id dan Hisham tertunda dua hari, menahan diri untuk tidak mengutuk Ali dari mimbar, dan tempatnya ditempatkan dalam... Allah memerintahkan keadilan dan kebaikan, dan dikatakan, \"Tuhan kami, ampunilah kami dan saudara-saudara kami,\" dan dikatakan, \"Dia menciptakan mereka semua bersama.\" Orang-orang menggunakan itu untuk tujuan ini. Dia menulis kepada gubernurnya di Madinah, berkata, \"Aku bersumpah sepuluh ribu dinar untuk anak Ali,\" jadi dia menulis kepada salah satu putranya. Dia menulis, \"Aku bersumpah demi anak-anak Ali dari Fatimah, selama hak mereka telah terlampau.\" Dalam khotbahnya, dia berkata, \"Aku bukan hakim, tapi aku adalah pelaksana; aku bukan inovator, tapi aku pengikut. Orang yang melarikan diri dari imam yang tidak adil bukanlah pendosa, tetapi imam yang tidak adil adalah pendosa.\" Apakah tidak ada ketaatan kepada makhluk ciptaan yang tidak taat kepada Pencipta? Alasan pertobatannya adalah karena seorang hambanya telah menyakitinya, sehingga dia memukulnya. Hamba itu berkata, \"Apakah engkau telah melakukan kejahatan yang membuat tuanmu marah padamu? Apakah Dia mempercepat hukuman untukmu?\" Dia berkata, \"Ya Allah, tidak.\" Dia berkata, \"Mengapa engkau terburu-buru melawanku?\" Dia berkata, \"Bangkitlah, karena kamu bebas demi Allah.\" Raja orang Romawi berkata kepada delegasinya: \"Aku telah mendengar dari kebenaran-Nya bahwa jika ada yang menghidupkan orang mati setelah Yesus, aku akan mengira dia sedang menghidupkan orang mati.\" {cite: Muruj-al-Dhahab hlm. 172-176}, dan ia berdebat dengan seorang Abyssinian dan seorang Shaybani dari Kharijit sampai ia berkata, 'Apakah kalian pikir mengutuk orang berdosa adalah kewajiban? Katakan padaku, kapan kau tahu saat kau mengutuk Firaun?' Ia berkata, 'Aku tidak ingat kapan kau mengutuk Firaun, yang merupakan makhluk paling jahat.' Orang Abyssinia itu percaya dan tinggal bersamanya selama lima belas hari. Al-Shaybani pergi menyampaikan kata-katanya kepada para sahabatnya {cite:Muruj-al-Dhahab hlm. 181-182}. Amr ibn Ubayd mengatakan dalam surat itu bahwa Umar ibn Abd al-Aziz mengambil kekhalifahan tanpa klaim yang sah atau sah, maka dia memang pantas mendapatkannya saat mengambilnya. {cite:muruj-al-dhahab, hlm. 184} Buku tersebut menyebutkan bahwa Abd al-Malik menyarankan putra-putranya untuk mendengarkan Umar ibn Abd al-Aziz, menemaninya, dan berkonsultasi dengannya. Ketika ia memerintah Hijaz selama masa pemerintahan al-Walid, ia memperlakukan para ulama dengan baik dan menunjuk mereka sebagai penasihat, sehingga Sa'id ibn al-Musayyib semakin dihormati. {cite:salabi-umayyad-state-2020, hlm.116-122} Buku tersebut menyebutkan bahwa ia lahir dari al-Rajih pada tahun 61 H di Madinah, bahwa ayahnya Abd al-Aziz ibn Marwan menjadi gubernur Mesir selama lebih dari dua puluh tahun, dan bahwa ibunya adalah um Asim bint Asim ibn Umar ibn al-Khattab, dan bahwa ia meninggal pada tahun 101 H pada usia sekitar empat puluh tahun. Buku tersebut menyebutkan bahwa Salomo dipercayakan menjadi khalifah selama penyakit terminalnya, dan bahwa Hisham ibn Abd al-Malik menolak untuk bersumpah setia kepadanya. {cite:salabi-umayyad-state-2020 hlm.157-161} Buku tersebut menyebutkan bahwa ia dibesarkan di Madinah di bawah para ulama tersebut, termasuk Salih ibn Kaysan, yang mengajarinya, Ubayd Allah ibn Abdullah ibn Utbah, dan bahwa ia menjadi gubernur Madinah di Rabi' al-Awwal pada tahun 87 H, kemudian menganeksasi Taif pada tahun 91 H. Surat tersebut menyatakan syarat-syaratnya untuk menerima emirat: keadilan, tidak adanya ketidakadilan, izin untuk melaksanakan Haji pada tahun pertama, dan izin untuk memberikan kepada rakyat Madinah. Ia membentuk dewan konsultatif dari sepuluh ahli hukum Madinah. {cite:salabi-umayyad-state-2020 hlm.168-173} Buku tersebut menyebutkan bahwa ia adalah gubernur Madinah selama masa pemerintahan al-Walid, dan bahwa al-Walid memperluas Masjid Nabi atas perintahnya serta menyarankan al-Walid untuk tidak membunuh siapa pun kecuali setelah kesalahannya terbukti secara tertulis dan kesaksian. Al-Walid menulis kepada provinsi-provinsi tentang hal ini, dan ketika al-Walid memberontak melawan Suleiman, Umar menyangkalnya. Ia kemudian menetap di Damaskus sebagai penasihat Sulayman. Buku tersebut menyebutkan bahwa Umar menyesali telah membunuh Khabib ibn Abdullah ibn al-Zubayr di bawah penyiksaan selama masa jabatannya, sehingga ia mengundurkan diri dari jabatan gubernur. {cite:salabi-umayyad-state-2020 hlm.174-183} Buku tersebut menyebutkan bahwa Sulayman menulis janjinya kepada Umar dan kemudian kepada Yazid ibn Abd al-Malik, dan bahwa ia tidak ingin menggantikan putranya Ayyub, dan bahwa Hisham tidak mengetahui perjanjian tersebut dan meminta kepada Raja, tetapi Raja menolak. Kitab tersebut menyebutkan bahwa Umar telah bersumpah setia pada hari Jumat, sepuluh hari sebelum Safar, 99 H, dan bahwa dalam khotbah pertamanya ia disiksa oleh hal itu tanpa pendapat atau permintaannya, bahwa tidak ada ketaatan kepada makhluk mana pun dalam membangkang Tuhan, dan bahwa ia menerima lima hal dari para pembantunya: memenuhi kebutuhan mereka yang tidak dapat dijangkau, membantunya dalam kebaikan, membimbingnya ke sana, tidak memandang rendah rakyat, tidak ikut campur dalam urusan yang bukan urusan mereka, dan bahwa ia mengirim surat kepada provinsi meminta kesetiaan dari mereka. Buku tersebut menyebutkan bahwa ia mengonfirmasi konsultasi dengan mengatakan bahwa ia tidak diangkat melalui konsultasi, bahwa orang-orang terdekatnya menunjukkannya, bahwa ia membalas keluhan dan memulai dari dirinya sendiri, menjual kekayaan berlebih yang dimilikinya dan mendedikasikannya untuk tujuan Allah. {cite:salabi-umayyad-state-2020 hlm.184-193} Buku tersebut menyebutkan bahwa Umar mengembalikan keluhan dimulai dari dirinya sendiri, mengikat kembali wilayah feodalis, lum, dan kekayaan yang haknya tidak ditetapkan, mengembalikan Fadak, Jabal al-Wars, dan tanah al-Yamama ke kas negara, mengakui apa yang pernah ada di Suwayda dan menjadikannya bagian dari pemberiannya. Disebutkan bahwa ia merampas apa yang telah diambil secara tidak adil oleh Umayyah, sehingga mereka menolaknya, lalu membuka pintu untuk keluhan bagi mereka yang dirugikan, mengembalikan hak kepada pemiliknya, dan memberhentikan gubernur yang menindas seperti Yazid ibn Abi Muslim dan Usama ibn Zayd al-Tanukhi. Ia menulis kepada para pejabatnya untuk melepaskan jizya dari mereka yang memeluk Islam, dan bahwa tanah al-Fay' milik komunitas Muslim. {cite:salabi-umayyad-state-2020 hlm.194-203} Buku tersebut menyebutkan bahwa Umar menulis surat kepada gubernurnya di Mesir untuk memaksakan jizya kepada mereka yang di antara para dhimmi yang telah memeluk Islam, dan gubernur Kufa serta Basra juga menanyakan hal yang sama, dan ia menjawab bahwa Islam tidak mengirimnya sebagai pemungut gereja, dan ia berharap semua orang akan berpindah agama agar ia dan gubernur dapat membajak dan menghasilkan dari penghasilan mereka sendiri. Disebutkan bahwa ia membatalkan apa yang telah dilakukan al-Hajjaj untuk mencegah para mawali bermigrasi, menghapus jizya tambahan untuk rakyat Siprus dan apa yang ditambahkan ke rakyat Irak, serta memerintahkan pengeluaran kas negara untuk mereka yang menua dan lemah dalam pekerjaannya. Disebutkan bahwa ia memerintahkan agar orang-orang tidak disiksa untuk mengambil kharaj dari mereka, melarang pajak, dan memerintahkan pembongkaran tempat mereka. Ia cukup dengan bukti untuk meringankan penyelesaian keluhan, dan memerintahkan hadiah antara seratus hingga tiga ratus dinar bagi siapa pun yang menunjukkan ketidakadilan atau kesalahan. Disebutkan bahwa Umar menyamakan kemurahan hati para pangeran Umayyah dan rakyat biasa, dan memutuskan sengketa Helwan melawan ayahnya. {cite:salabi-umayyad-state-2020 hlm.203-212} Buku tersebut menyebutkan bahwa ia memerintahkan agar tidak ada yang terbatas pada permohonan dalam khotbah, bahwa ia memberikan kebebasan untuk bermigrasi dan berdagang melalui darat dan laut, bahwa siapa pun yang ingin pindah harus melakukannya, dan bahwa ia adalah budak terbaik antara membebaskan dan menjauh. Buku tersebut menggambarkan asketismenya, termasuk bahwa penghasilannya saat diangkat sebagai wakil adalah empat puluh ribu dinar, lalu menjadi empat ratus dinar saat wafat, bahwa ia sama sekali tidak mencari nafkah dari kas umum umat Islam, dan bahwa istrinya mengatakan ia hanya melakukan ghusl dari janaba sebanyak tiga kali. {cite:salabi-umayyad-state-2020 hlm.213-222} Buku ini menggambarkan kerendahan hati dan kesalehannya: ia akan memperbaiki lampunya sendiri, mengembalikan hadiah dari pekerjanya karena takut suap, mengembalikan kekayaan berlebih ke kas negara, memaafkan siapa pun yang mengganggu atau menyakiti putranya, dan mengatakan bahwa orang saleh dilarang mengusir mereka yang menghina dirinya. Surat tersebut menyebutkan ketegasannya terhadap Banu Marwan ketika ia menuntut agar mereka mengembalikan apa yang telah diambil, dan dengan Khawarij, yang ia perintahkan untuk bernegosiasi sebelum bertarung dengan mereka. Surat itu menyebutkan bahwa Umar mencetak koin dengan frasa \"Tuhan memerintahkan kesetiaan dan keadilan,\" dan ia mengatakan tidak ada seorang pun yang boleh dikenakan hukuman kecuali setelah mengetahuinya. Buku tersebut mengutip beberapa sarjana yang mengatakan bahwa Umar adalah pembaharu pertama di puncak abad pertama. {cite:salabi-umayyad-state-2020 hlm.223-234} Buku tersebut menyebutkan bahwa Umar menulis kepada agen-agennya dalam reformasi masyarakat dan biasa berkata: Hidup seseorang tidak bernilai kecuali melalui Sunnah yang ia hidupkan kembali atau inovasi yang membunuhnya, dan bahwa orang-orang pada zamannya mulai membahas kondisi agama setelah membahas pembangunan dan pernikahan. Buku tersebut menyebutkan bahwa surat yang ia tulis kepada salah satu pejabatnya menyatakan bahwa jika kejahatan menjadi jelas dan tidak melarangnya, Allah akan menghukum umatnya, dan bahwa diam tentang kejahatan bukanlah karena ketekunan, melainkan dosa. Buku tersebut menyebutkan bahwa ia berdoa kepada Tuhan agar membunuhnya demi iman, dan buku tersebut mengutip para sarjana sebagai salah satu pembaharu di puncak abad pertama. Buku tersebut membantah hal ini dengan menyatakan bahwa ia bukan lagi seorang pembaharu yang lengkap. {cite:salabi-umayyad-state-2020 hlm.236-249} Buku tersebut menyebutkan bahwa ia menyangkal tribalism suku dan aliansi pra-Islam dalam surat kepada Al-Dhahhak ibn Abd al-Rahman, dan bahwa ia menolak membiarkan orang membelanya, dengan mengatakan bahwa manusia hanya berdiri untuk Tuhan alam semesta. Buku tersebut menyebutkan bahwa ia menebus para tawanan di Konstantinopel dan menjanjikan tebusan, memerintahkan pembayaran utang kepada para pengutang meskipun mereka memiliki rumah dan pelayan, memberikan lima putri di Irak bagian dari kas negara, menghidupkan kembali tradisi memberi kepada rakyat dan membagikannya kepada semua, serta membayar mas kawin dari kas negara kepada mereka yang tidak mampu. {cite:salabi-umayyad-state-2020 hlm.252-260} Buku tersebut menyebutkan bahwa Umar tidak menerima pujian dari para penyair dan menghentikan pemberian mereka. Ia mengutip kisah Jarir, yang memujinya, mengatakan bahwa hak untuk memberi milik orang miskin, bahwa para penyair baru kembali ke kebiasaan ini setelah kematiannya, bahwa ia sebelumnya dekat dengan Berbi, yang membacakan puisi asketis, dan bahwa ia biasa menangis saat mendengar khotbah. Buku tersebut menggambarkan pemerintahannya sebagai negara bagi para cendekiawan, karena ia mendekatkan para sarjana dan menjadikan mereka sebagai pengiring, menteri, dan penasihatnya. {cite:salabi-umayyad-state-2020 hlm.261-271} Kitab tersebut menyebutkan bahwa Umar memerintahkan pengumpulan dan dokumentasi Sunnah, dan menulis kepada Abu Bakr ibn Hazm untuk meninjau hadits Rasulullah dan menuliskannya karena ia takut akan pelajaran ilmu pengetahuan dan kehilangan keluarganya. Ibn Shihab al-Zuhri memerintahkan pengumpulan Sunnah, sehingga surat-surat tersebut ditulis dalam buku catatan, dan ia mengirimkan buku catatan ke setiap negeri yang ia kuasai. Ia meminta mereka yang mencatat Sunnah untuk membedakan yang otentik dari yang lemah. Pencatatan resmi ini dianggap sebagai salah satu pencapaian Umar. {cite:salabi-umayyad-state-2020 hlm.297-302} Kitab tersebut menyebutkan bahwa ia menghentikan perluasan di pinggiran terpencil dan menulis kepada Maslama ibn Abd al-Malik untuk mengunci buku-buku dari Konstantinopel setelah pengepungan yang berlangsung sekitar dua tahun, mengirimkan kuda dan makanan. Ia menulis kepada gubernurnya di Khorasan agar tidak menyerang ke luar sungai dan memanggil raja-rajanya untuk memeluk Islam. Ismail ibn Ubayd Allah ibn Abi al-Muhajir mengangkat Ifriqiya pada Muharram 99 H, dan bangsa Berber memeluk Islam pada masanya. Al-Jarrah ibn Abdullah al-Hakami memerintahkan penghapusan jizya dari dhimmi, sehingga sekitar empat ribu dhimmi memeluk Islam di Khorasan. {sitasi: Salabi-Umayyad-State-2020 hlm.332-343}"
