id: person/abdallah-ibn-al-habhab
class: person
label: { ar: "عبد الله بن الحبحاب", en: "Abdallah ibn al-Habhab", fr: "Abdallah ibn al-Habhab", es: "Abdallah ibn al-Habhab", ur: "عبداللہ بن حباب" }
summary:
  ar: "عند البلاذري: مولى بني سلول استُعمل على إفريقية بعد عبيدة بن عبد الرحمن القيسي فأغزى عبد الرحمن بن حبيب الفهري السوس وأرض السودان وولّي بعده كلثوم بن عياض القصيري سنة ثلاث وعشرين ومائة."
  en: "In al-Baladhuri: mawla of Banu Salul, employed over Ifriqiya after Ubayda ibn Abd al-Rahman al-Qaysi — he sent Abd al-Rahman ibn Habib al-Fihri raiding to Sus and the Sudan lands; Kulthum ibn Iyad al-Qushayri was given it after him in year 123."
  fr: "Chez al-Baladhuri : client des Banu Salul, nommé sur l'Ifriqiya après Ubayda ibn Abd al-Rahman al-Qaysi — il envoya Abd al-Rahman ibn Habib al-Fihri en expédition vers le Sous et les pays du Soudan ; Kulthum ibn Iyad al-Qushayri reçut la charge après lui en l'an 123."
  es: "En al-Baladhuri: mawla de Banu Salul, empleado en Ifriqiya después de Ubayda ibn Abd al-Rahman al-Qaysi: envió a Abd al-Rahman ibn Habib al-Fihri a atacar Sus y las tierras de Sudán; Kulthum ibn Iyad al-Qushayri lo recibió después de él en el año 123."
  ur: "البلادوری میں ہے: بنو سلول کا مولا، عبیدہ بن عبدالرحمٰن القیسی کے بعد افریقیہ پر ملازم تھا- اس نے عبدالرحمٰن بن حبیب الفہری کو سوس اور سوڈان کی سرزمین پر چڑھائی کرنے کے لیے بھیجا؛ کلثوم ابن ایاد القشیری کو ان کے بعد سنہ 123 میں عطا کیا گیا۔"
  tr: "El-Baladhuri'ye göre: Ubayda bin Abdülrahman el-Kaysi'den sonra İfrikiye'nin başına Mevla Beni Salul atandı. Abdülrahman bin Habib el-Fihri, Suus'a ve Sudan topraklarına baskın düzenledi ve ondan sonra 123 yılında Kulsum bin Ayad el-Kasiri atandı."
  id: "Menurut Al-Baladhuri: Mawla Bani Salul diangkat sebagai penguasa Ifriqiya setelah Ubayda bin Abd al-Rahman al-Qaysi. Abd al-Rahman bin Habib al-Fihri menyerbu Sous dan tanah Sudan, dan setelahnya, Kulthum bin Ayad al-Qasiri diangkat pada tahun seratus dua puluh tiga."
