  es: "Ahmad Mohamed Ali al-Madani (nacido en 1934) es un economista saudí, presidente fundador del Banco Islámico de Desarrollo (BID), que dirigió durante cuatro décadas (1975-2016), lo que lo convierte en uno de los principales impulsores de las finanzas islámicas para el desarrollo."
