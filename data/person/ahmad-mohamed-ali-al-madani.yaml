  ar: أحمد محمد علي المدني ⁦(1934–)⁩ اقتصادي سعودي، الرئيس المؤسس والأول للبنك الإسلامي للتنمية ⁦(1975–2016)⁩ الذي قاده أربعة عقود، ومن أعمدة التمويل الإسلامي للتنمية في العالم.
