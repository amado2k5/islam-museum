summary:
  ar: ناشطة حقوقية سعودية وُلدت سنة 1989. من أبرز وجوه حملة حق قيادة المرأة للسيارة في السعودية، اعتُقلت مرات وقضت نحو ثلاث سنوات سجينة ⁦(2018–2021)⁩، وصارت رمزًا دوليًا لقضية حقوق المرأة السعودية.
  en: Saudi women's rights activist, born 1989. A leading face of the campaign for women's right to drive in Saudi Arabia; arrested repeatedly and imprisoned for nearly three years (2018–2021), she became
    an international symbol of Saudi women's rights.
  ur: سعودی خواتین کے حقوق کی کارکن، 1989 میں پیدا ہوئیں۔ سعودی عرب میں خواتین کے گاڑی چلانے کے حق کی مہم کے ممتاز چہرے؛ بار بار گرفتار ہوئیں اور تقریباً تین سال قید کاٹیں ⁦(2018–2021)⁩، سعودی خواتین کے
    حقوق کی بین الاقوامی علامت بنیں۔
  es: "Activista saudí por los derechos de las mujeres, nacida en 1989. Figura destacada de la campaña por el derecho de las mujeres a conducir en Arabia Saudí; arrestada repetidamente y encarcelada durante casi tres años (2018-2021), se convirtió en un símbolo internacional de los derechos de las mujeres saudíes."
  fr: "Militante saoudienne pour les droits des femmes, née en 1989. Figure de proue de la campagne pour le droit des femmes à conduire en Arabie saoudite; arrêtée à plusieurs reprises et emprisonnée pendant près de trois ans (2018-2021), elle est devenue un symbole international des droits des femmes saoudiennes."
  tr: "1989 doğumlu bir Suudi insan hakları aktivisti. Suudi Arabistan'da kadınların araç kullanma hakkı kampanyasının en önde gelen isimlerinden biri olan Suud, birkaç kez tutuklandı ve yaklaşık üç yıl hapis yattı (2018–2021) ile Suudi kadın hakları davasının uluslararası bir sembolü haline geldi."
  id: "Seorang aktivis hak asasi manusia Saudi yang lahir pada tahun 1989. Salah satu tokoh paling menonjol dalam kampanye hak perempuan mengemudi mobil di Arab Saudi, ia beberapa kali ditangkap dan menghabiskan sekitar tiga tahun di penjara (2018–2021), menjadi simbol internasional perjuangan hak perempuan Saudi."
