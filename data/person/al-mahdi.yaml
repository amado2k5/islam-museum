class: person
roles: [caliph]
label: { ar: "محمد المهدي", en: "Muhammad al-Mahdi", ur: "محمد المہدی", es: "Muhammad al-Mahdi", fr: "Muhammad al-Mahdi" }
summary:
  ar: "محمد بن عبد الله المنصور المهدي، ثالث خلفاء بني العباس؛ عند البلاذري: أغزى ابنه هارون بلاد الروم سنة 163 فحاصر ضمالو — وقيل أنزل أهلها ببغداد على حكمه فاستحياهم وسمى موضعهم — واستتم ما بقي من عمارة مدن الثغور والحصون بعد أبيه المنصور وزاد في شحنها، وأمر ببناء الحدث وأوصى ببناء طرسوس بعد وصف الحسن بن قحطبة إياها؛ وفي خلافته أسلم جماعة من حاضر قنسرين فكتب على أيديهم بالخضرة، وعند السيوطي ولد بإيذج سنة سبع وعشرين ومئة وقيل ست وعشرين وأمه أم موسى بنت منصور الحميرية، ولما حصلت الخزائن في يده أخذ في رد المظالم وأخرج أكثر الذخائر ففرقها وبر أهله ومواليه، وبايع بولاية العهد لموسى الهادي ثم من بعده لهارون الرشيد ولديه في سنة تسع وخمسين {cite:tarikh-khulafa-minhaj-1434 p. 440-442}، وعند المسعودي أن المهدي كان سمحاً سخياً يحمل معه بدر الدنانير والدراهم فلا يسأله أحد إلا أعطاه، وأمعن في قتل الملحدين لظهورهم في أيامه لما انتشر من كتب ماني وابن ديصان ومرقيون مما نقله عبد الله بن المقفع وغيره وما صنفه ابن أبي العوجاء وحماد عجرد ويحيى بن زياد ومطيع بن إياس، وكان أول من أمر الجدليين من المتكلمين بتصنيف الكتب على الملحدين وإقامة البراهين، وشرع في بناء المسجد الحرام ومسجد النبي على ما هما عليه وبنى بيت المقدس وقد كانت هدمته الزلازل {cite:muruj-al-dhahab p. 669}، وعند المسعودي أخذ له البيعة بمكة الربيع مولاه يوم السبت لست خلون من ذي الحجة سنة ثمان وخمسين، وفرق في عشرة أيام عشرة آلاف ألف درهم حتى فرغت بيوت الأموال ووردت بعد أيام، وأكرم مزنة امرأة مروان فأقامت في قصره، وجلد أبا العتاهية في عتبة ثم أمر له بمائة ألف درهم، وخرج سنة تسع وستين يريد بلاد قرماسين فعدل إلى أرزن والران فمات بقرية ردين ليلة الخميس لسبع بقين من المحرم وكانت خلافته عشر سنين وشهراً وخمسة عشر يوماً {cite:muruj-al-dhahab p. 298-303}، وقال العبدي عند المسعودي كان سمحاً سخياً جواداً يحمل معه بدر الدنانير والدراهم لا يسأله أحد إلا أعطاه، وأمعن في قتل الملحدين والمداهنين لما انتشر من كتب ماني وابن ديصان ومرقيون مما نقله عبد الله بن المقفع وما صنفه ابن أبي العوجاء وحماد عجرد ويحيى بن زياد ومطيع بن إياس من تأييد المذاهب المانية والديصانية والمرقيونية، وكان أول من أمر الجدليين من المتكلمين بتصنيف الكتب على الملحدين، وشرع في بناء المسجد الحرام ومسجد النبي وبنى بيت المقدس وكانت هدمته الزلازل {cite:muruj-al-dhahab p. 669-670}"
  en: "Muhammad ibn Abdullah al-Mansur, al-Mahdi, third Abbasid caliph; in al-Baladhuri: he sent his son Harun raiding Byzantine lands in year 163, besieging Damalu — its people by some reports settled at Baghdad on his ruling, spared and named for their town — and he completed what remained of the march-cities' and fortresses' works after his father al-Mansur, adding to their garrisons, ordered al-Hadath built and bequeathed the building of Tarsus on al-Hasan ibn Qahtaba's description; in his caliphate a body of Qinnasrin's hadir converted and he had the khadra written at their hands."
  ur: "محمد بن عبداللہ المنصور المہدی، تیسرے عباسی خلیفہ؛ بلاذری سرحدی تعمیرات اور ہارون کی مہم بیان کرتے ہیں، جبکہ سیوطی ان کی ذاتی نماز کی ایک روایت نقل کرتے ہیں؛ بوزکورت حسابی نگرانی اور مرکزی زمام کی تنظیم کو ان کے عہد سے منسوب کرتی ہیں {cite:futuh-buldan-maarif-1407} {cite:tarikh-khulafa-minhaj-1434 p.447} {cite:tdv-mehdi-bozkurt p.377–379}۔"
  es: "Muhammad ibn Abdullah al-Mansur, al-Mahdi, tercer califa abasí; en al-Baladhuri: envió a su hijo Harun a saquear tierras bizantinas en el año 163, sitiando Damalu —su gente, según algunos informes, se estableció en Bagdad bajo su gobierno, perdonada y nombrada en honor a su ciudad— y completó lo que quedaba de las obras de las ciudades fronterizas y fortalezas después de su padre al-Mansur, aumentando sus guarniciones, ordenó la construcción de al-Hadath y legó la construcción de Tarso según la descripción de al-Hasan ibn Qahtaba; en su califato, un grupo de hadir de Qinnasrin se convirtió y mandó escribir el khadra de sus manos."
  fr: "Muhammad ibn Abdullah al-Mansur, al-Mahdi, troisième calife abbasside; selon al-Baladhuri: il envoya son fils Harun piller les terres byzantines en l'an 163, assiégeant Damalu — ses habitants, selon certains rapports, installés à Bagdad sous son règne, furent épargnés et nommés d'après leur ville — et il acheva ce qui restait des travaux des villes de marche et des forteresses après son père al-Mansur, augmentant leurs garnisons, ordonna la construction d'al-Hadath et légua la construction de Tarse selon la description d'al-Hasan ibn Qahtaba; durant son califat, un corps de hadir de Qinnasrin se convertit et il fit rédiger le khadra par eux."
  tr: "Muhammed bin Abdullah el-Mansur el-Mehdi, üçüncü Abbasi halifesi; el-Baladhuri'ye göre: Oğlu Harun, 163 Hicri yılında Bizans topraklarına saldırdı ve Demalus'u kuşattı — ve söylenene göre, halkını kendi yönetimi altında Bağdat'a yerleştirdi, bu yüzden onları utandırdı ve yerlerini adlandırdı — ve babası el-Mansur'dan sonra kalelerin ve kalelerin yeniden inşasını tamamladı, sevkiyatlarını artırdı, el-Hadat'ın inşasını emretti ve el-Hasan bin Kahtaba'nın anlattıktan sonra Tarsus'un inşasını önerdi; halifeliği sırasında Qinnasrin'den bir grupla birlikte İslam'a geçti, elleri altında el-Khadra'ya yazdırdı ve el-Suyuti'ye göre, 127 Hicri yılında İdhj'de doğdu Yirmi altı yaşındaydı ve annesi Um Musa bint Mansur al-Himyarit idi. Hazineler eline geçtiğinde, şikayetleri geri getirmeye başladı ve hazinelerin çoğunu çıkardı, dağıttı ve ailesini ve müşterilerini onurlandırdı. Elli dokuzuncu yılda veliaht prens olarak Musa el-Hadi'ye, ardından onun ardından iki oğlu Harun el-Raşid'e bağlılık yemini etti {atıf:Tarih-Khulafa-minhaj-1434, s. 440-442}. El-Mes'udi'ye göre, el-Mehdi cömert ve cömertti, yanında dinar ve dirhem dolunayı taşıyordu, bu yüzden kimse ondan sadece vermesini istedi. Mani ve İbn kitapları yayılırken ateistlerin ortaya çıkması nedeniyle onların öldürülmesini artırdı Alimler ve Yorumcular, Abdullah ibn Muqaffa ve diğerlerinin aktardıklarından ve İbn Ebi Ewce, Hammad Ajrad, Yahya ibn Ziyad ve Muti' ibn Iyas'ın yazdıklarından yola çıkar. Tartışmacı ilahiyatçılara ateistlere karşı kitapları sınıflandırmalarını ve kanıtlar sunmalarını emreden ilk kişiydi; Mescid-Camii ve Peygamber'in Camii'ni olduğu gibi inşa etmeye başladı ve Kudüs'ü depremlerle yıkıldıktan sonra inşa etti {atıf:Muruj-al-Dhahab, s. 669}. El-Mes'udi'ye göre, özgür bırakılan kölesi, sekizinci yılda Zulhice'ye çok uzak olmayan Cumartesi günü Mekke'de bağlılık yemini etti ve elli ve on gün içinde on bin dirhem dağıttı, ta ki servet evleri boşaltıp birkaç gün sonra gelene kadar. Marwan'ın sarayında kalan eşini onurlandırdı. Ebu el-Atahiye'yi kapıda kırbaçladı, sonra ona yüz bin dirhem emretti. Altmış dokuzuncu yılda Qarmasin topraklarına gitti, Arzan ve Al-Ran'a yerleşti ve Muharremin yedinci günü Perşembe gecesi Rudin köyünde öldü. Halifeliği on yıl, ay ve on beş gün sürdü {alıntı: Muruj-al-Dhahab, s. 298-303} ve Al-Mas'udi'ye göre Al-Mas'udi'ye göre cömert, cömert ve cömert olduğunu, yanında dinar ve dirhem taşıdığını ve kimsenin ondan sadece vermesini istediğini söyledi. Ateistleri ve yatıştırıcıları öldürme çabalarını yoğunlaştırdı; bunlar Mani, İbn Dizan ve Marqiyun'un yaygın kitapları tarafından aktarıldı; bunlar Abdullah ibn Muqaffa tarafından aktarıldı ve İbn Ebi el-Avca, Hammad Ajrad, Yahya ibn Ziyad ve Muti'bin İyas'ın Alman, Disani ve Marqiyun okullarını desteklemek için yazdıklarını söyledi. Tartışmacı teologlara ateistlere karşı kitapları sınıflandırmalarını emreden ilk kişi oldu ve camiyi inşa etmeye başladı Kutsal Camii, Peygamber Camii ve depremlerde yıkılan Kudüs binaları {kaynak:muruj-al-dhahab s. 669-670}"
  id: "Muhammad ibn Abdullah al-Mansur al-Mahdi, khalifah Abbasiyah ketiga; menurut al-Baladhuri: Putranya Harun menyerbu tanah Bizantium pada tahun 163 H dan mengepung Damalu — dan dikatakan bahwa ia menempatkan rakyatnya di Baghdad di bawah pemerintahannya, sehingga ia mempermalukan mereka dan menamai tempat mereka — dan menyelesaikan rekonstruksi benteng dan benteng setelah ayahnya al-Mansur, menambah pengiriman mereka, memerintahkan pembangunan al-Hadath, dan merekomendasikan pembangunan Tarsus setelah al-Hasan ibn Qahtaba menceritakannya kepadanya; selama masa khalifahnya, ia memeluk Islam bersama kelompok dari Qinnasrin saat ini, menuliskannya di bawah tangan mereka dalam al-Khadra, dan menurut al-Suyuti, ia lahir di Idhj pada tahun 127 H Dikatakan ia berusia dua puluh enam tahun, dan ibunya adalah um Musa bint Mansur al-Himyarit. Ketika harta karun sudah dimilikinya, ia mulai mengembalikan keluhan dan mengambil sebagian besar harta, membagikannya serta menghormati keluarga dan kliennya. Ia bersumpah setia sebagai putra mahkota kepada Musa al-Hadi, kemudian setelahnya kepada Harun al-Rashid, kedua putranya, pada tahun lima puluh sembilan {cite:History-Khulafa-minhaj-1434, hlm. 440-442}. Menurut al-Mas'udi, al-Mahdi murah hati dan murah hati, membawa bulan purnama dinar dan dirham, sehingga tidak ada yang memintanya kecuali memberikannya. Ia memperkuat pembunuhan ateis karena kemunculan mereka pada masa-masanya ketika kitab Mani dan Ibn menyebar Para ulama dan penafsir dari apa yang disampaikan oleh Abdullah ibn al-Muqaffa' dan lainnya, serta yang ditulis oleh Ibn Abi al-Awja, Hammad Ajrad, Yahya ibn Ziyad, dan Muti' ibn Iyas. Ia adalah yang pertama memerintahkan para teolog polemik untuk mengklasifikasikan buku-buku melawan ateis dan membuktikan buktinya, dan ia mulai membangun Masjid Suci dan Masjid Nabi sebagaimana adanya, serta membangun Yerusalem setelah hancur akibat gempa {cite:muruj-al-dhahab, hlm. 669}. Menurut al-Mas'udi, budaknya yang telah dibebaskan mengucapkan sumpah setia di Mekah pada hari Sabtu, tidak jauh dari Dhu al-Hijjah pada tahun kedelapan dan lima puluh, dan membagikan sepuluh ribu dirham dalam sepuluh hari sampai rumah-rumah kekayaan kosong dan tiba setelah beberapa hari. Dia menghormati istri Marwan, yang tinggal di istananya. Dia mencambuk Abu al-Atahiyah di ambang pintu, lalu memerintahkan seratus ribu dirham. Pada tahun enam puluh sembilan, dia pergi ke tanah Qarmasin, sehingga dia menetap di Arzan dan Al-Ran, dan meninggal di desa Rudin pada Kamis malam, tanggal tujuh Muharram. Khalifahnya berlangsung sepuluh tahun, bulan, dan lima belas hari {cite: Muruj-al-Dhahab, hlm. 298-303}, dan Al-Abdi mengatakan menurut Al-Mas'udi bahwa ia sangat murah hati, murah hati, dan murah hati, membawa dinar dan dirham, dan tidak ada yang memintanya kecuali untuk memberikannya. Ia meningkatkan upayanya membunuh ateis dan penenangkan karena tersebarnya buku-buku Mani, Ibn Disan, dan Marqiyun, yang disampaikan oleh Abdullah ibn al-Muqaffa' serta apa yang ditulis Ibn Abi al-Awja, Hammad Ajrad, Yahya ibn Ziyad, dan Muti' ibn Iyas untuk mendukung aliran Jerman, Disani, dan Marqiyun. Ia adalah orang pertama yang memerintahkan teolog polemik untuk mengklasifikasikan buku-buku melawan ateis dan mulai membangun masjid Masjid Suci, Masjid Nabi, dan bangunan-bangunan di Yerusalem, yang hancur akibat gempa bumi {cite:muruj-al-dhahab hlm. 669-670}"
