id: person/al-mahdi
class: person
label: { ar: "محمد المهدي", en: "Muhammad al-Mahdi" }
summary:
  ar: "محمد بن عبد الله المنصور المهدي، ثالث خلفاء بني العباس؛ عند البلاذري: أغزى ابنه هارون بلاد الروم سنة 163 فحاصر ضمالو — وقيل أنزل أهلها ببغداد على حكمه فاستحياهم وسمى موضعهم — واستتم ما بقي من عمارة مدن الثغور والحصون بعد أبيه المنصور وزاد في شحنها، وأمر ببناء الحدث وأوصى ببناء طرسوس بعد وصف الحسن بن قحطبة إياها؛ وفي خلافته أسلم جماعة من حاضر قنسرين فكتب على أيديهم بالخضرة، وعند السيوطي ولد بإيذج سنة سبع وعشرين ومئة وقيل ست وعشرين وأمه أم موسى بنت منصور الحميرية، ولما حصلت الخزائن في يده أخذ في رد المظالم وأخرج أكثر الذخائر ففرقها وبر أهله ومواليه، وبايع بولاية العهد لموسى الهادي ثم من بعده لهارون الرشيد ولديه في سنة تسع وخمسين {cite:tarikh-khulafa-minhaj-1434 p. 440-442}، وعند المسعودي أن المهدي كان سمحاً سخياً يحمل معه بدر الدنانير والدراهم فلا يسأله أحد إلا أعطاه، وأمعن في قتل الملحدين لظهورهم في أيامه لما انتشر من كتب ماني وابن ديصان ومرقيون مما نقله عبد الله بن المقفع وغيره وما صنفه ابن أبي العوجاء وحماد عجرد ويحيى بن زياد ومطيع بن إياس، وكان أول من أمر الجدليين من المتكلمين بتصنيف الكتب على الملحدين وإقامة البراهين، وشرع في بناء المسجد الحرام ومسجد النبي على ما هما عليه وبنى بيت المقدس وقد كانت هدمته الزلازل {cite:muruj-al-dhahab p. 669}، وعند المسعودي أخذ له البيعة بمكة الربيع مولاه يوم السبت لست خلون من ذي الحجة سنة ثمان وخمسين، وفرق في عشرة أيام عشرة آلاف ألف درهم حتى فرغت بيوت الأموال ووردت بعد أيام، وأكرم مزنة امرأة مروان فأقامت في قصره، وجلد أبا العتاهية في عتبة ثم أمر له بمائة ألف درهم، وخرج سنة تسع وستين يريد بلاد قرماسين فعدل إلى أرزن والران فمات بقرية ردين ليلة الخميس لسبع بقين من المحرم وكانت خلافته عشر سنين وشهراً وخمسة عشر يوماً {cite:muruj-al-dhahab p. 298-303}"
  en: "Muhammad ibn Abdullah al-Mansur, al-Mahdi, third Abbasid caliph; in al-Baladhuri: he sent his son Harun raiding Byzantine lands in year 163, besieging Damalu — its people by some reports settled at Baghdad on his ruling, spared and named for their town — and he completed what remained of the march-cities' and fortresses' works after his father al-Mansur, adding to their garrisons, ordered al-Hadath built and bequeathed the building of Tarsus on al-Hasan ibn Qahtaba's description; in his caliphate a body of Qinnasrin's hadir converted and he had the khadra written at their hands."
