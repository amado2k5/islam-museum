id: person/al-mahdi
class: person
label: { ar: "محمد المهدي", en: "Muhammad al-Mahdi" }
summary:
  ar: "محمد بن عبد الله المنصور المهدي، ثالث خلفاء بني العباس؛ عند البلاذري: أغزى ابنه هارون بلاد الروم سنة 163 فحاصر ضمالو — وقيل أنزل أهلها ببغداد على حكمه فاستحياهم وسمى موضعهم — واستتم ما بقي من عمارة مدن الثغور والحصون بعد أبيه المنصور وزاد في شحنها، وأمر ببناء الحدث وأوصى ببناء طرسوس بعد وصف الحسن بن قحطبة إياها؛ وفي خلافته أسلم جماعة من حاضر قنسرين فكتب على أيديهم بالخضرة، وعند السيوطي ولد بإيذج سنة سبع وعشرين ومئة وقيل ست وعشرين وأمه أم موسى بنت منصور الحميرية، ولما حصلت الخزائن في يده أخذ في رد المظالم وأخرج أكثر الذخائر ففرقها وبر أهله ومواليه، وبايع بولاية العهد لموسى الهادي ثم من بعده لهارون الرشيد ولديه في سنة تسع وخمسين {cite:tarikh-khulafa-minhaj-1434 p. 440-442}"
  en: "Muhammad ibn Abdullah al-Mansur, al-Mahdi, third Abbasid caliph; in al-Baladhuri: he sent his son Harun raiding Byzantine lands in year 163, besieging Damalu — its people by some reports settled at Baghdad on his ruling, spared and named for their town — and he completed what remained of the march-cities' and fortresses' works after his father al-Mansur, adding to their garrisons, ordered al-Hadath built and bequeathed the building of Tarsus on al-Hasan ibn Qahtaba's description; in his caliphate a body of Qinnasrin's hadir converted and he had the khadra written at their hands."
