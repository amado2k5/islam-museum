  did_you_know:
    ar: "المهدي ثالث خلفاء بني العباس؛ عند البلاذري أغزى ابنه هارون بلاد الروم سنة ١٦٣هـ فحاصر ضمالو وأنزل أهلها ببغداد على حكمه."
    en: "Al-Mahdi, third Abbasid caliph — per al-Baladhuri he sent his son Harun against Byzantine lands in 163 AH; Harun besieged Dimalu and settled its people in Baghdad on his decree."
    ur: "مہدی، تیسرے عباسی خلیفہ — بلاذری کے مطابق انہوں نے 163ھ میں اپنے بیٹے ہارون کو روم کی سرزمین پر بھیجا؛ ہارون نے ضمالو کا محاصرہ کیا اور اس کے لوگوں کو اپنے فیصلے پر بغداد میں بسایا۔"
