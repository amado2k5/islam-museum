  ar: "مدرب كرة قدم مغربي وحارس مرمى سابق (وُلد سنة 1959 في سيدي قاسم)، اختير أفضل لاعب أفريقي سنة 1986 وكان ضمن منتخب المغرب الذي بلغ ثمن نهائي كأس العالم 1986، وقاد مدرباً منتخب المغرب إلى نهائي كأس الأمم الأفريقية 2004 ثم تولى تدريب منتخب الأردن سنة 2026."
