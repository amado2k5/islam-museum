gender: male
summary:
  ar: محمد بن الحسين بن محمد بن الحسين بن علي الأزدي الزاغولي، حافظ للحديث من فقهاء الشافعية وعالم باللغة والتفسير، ولد في زاغول وأقام بمرو، صاحب «قيد الأوابد»، 472 إلى 559 هـ.
  en: Muhammad ibn al-Husayn ibn Muhammad ibn al-Husayn ibn Ali al-Azdi al-Zaghuli, a hadith hafiz and Shafi'i jurist learned in language and exegesis, born in Zaghul and settled in Marw; author of 'Qayd al-Awabid', 472 to 559 AH.
  es: "Muhammad ibn al-Husayn ibn Muhammad ibn al-Husayn ibn Ali al-Azdi al-Zaghuli, un hadiz hafiz y jurista shafi'i versado en lengua y exégesis, nacido en Zaghul y establecido en Marw; autor de 'Qayd al-Awabid', 472 a 559 AH."
  fr: "Muhammad ibn al-Husayn ibn Muhammad ibn al-Husayn ibn Ali al-Azdi al-Zaghuli, hafiz hadith et juriste shafi'i appris en langue et en exégèse, né à Zaghul et installé à Marw; auteur de « Qayd al-Awabid », 472 à 559 AH."
  ur: "محمد بن الحسین بن محمد بن الحسین ابن علی الازدی الزغولی، ایک حدیثی حافظ اور شافعی فقیہ جو زبان و تفسیر میں سیکھے تھے، زغول میں پیدا ہوئے اور مرو میں آباد ہوئے؛ \"قید العوابد\" کے مصنف، 472 تا 559 ہجری۔"
  tr: "Muhammed ibn el-Hüseyin ibn Muhammed ibn el-Hüseyin ibn Ali el-Azdi el-Zaghuli, Şafii hukukçularından bir hadis ezbercisi ve dil ile tefsir alimi, Zaghoul doğumlu ve Merw'de yaşamış, 'Qayd al-Awad'ın yazarı, 472-559 H."
  id: "Muhammad ibn al-Husayn ibn Muhammad ibn al-Husayn ibn Ali al-Azdi al-Zaghuli, seorang penghafal hadis dari ahli hukum Shafi'i dan seorang ulama bahasa serta tafsir, lahir di Zaghoul dan tinggal di Marw, penulis 'Qayd al-Awad', 472 hingga 559 H."
