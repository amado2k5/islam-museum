summary:
  ar: "قطب الدين الرازي المعروف بالقطب التحتاني، أحد أئمة المعقول، أخذ عن العضد وغيره وقدم دمشق فشرح الحاوي وكتب حاشية على الكشاف وشرح المطالع والإشارات؛ وصفه الأسنوي بأنه ذو علوم متعددة وابن كثير بأنه أوحد المتكلمين بالمنطق وعلوم الأوائل، وسكن الظاهرية بدمشق إلى أن مات بها في ذي القعدة سنة 766 هـ وقد جاوز السبعين، ويختلف في اسمه بين محمود ومحمد {cite:durar-kamina-hyderabad-1972 vol. 6 pp. 99-100}."
  en: "Qutb al-Din al-Razi, known as al-Qutb al-Tahtani, one of the leading authorities of the rational sciences, who took from al-Adud and others, came to Damascus and wrote a commentary on al-Hawi, a gloss on al-Kashshaf and commentaries on al-Matali' and al-Isharat. Al-Asnawi called him a man of many sciences and Ibn Kathir the foremost of the theologians in logic and the sciences of the ancients; he lived at the Zahiriyya in Damascus until he died there in Dhu al-Qa'da 766 AH, over seventy, and his name is reported as Mahmud or Muhammad {cite:durar-kamina-hyderabad-1972 vol. 6 pp. 99-100}."
  es: "Qutb al-Din al-Razi, conocido como al-Qutb al-Tahtani, una de las principales autoridades de las ciencias racionales, quien tomó de al-Adud y otros, llegó a Damasco y escribió un comentario sobre al-Hawi, una glosa sobre al-Kashshaf y comentarios sobre al-Matali' y al-Isharat. Al-Asnawi lo llamó un hombre de muchas ciencias e Ibn Kathir el más destacado de los teólogos en lógica y ciencias de los antiguos; vivió en la Zahiriyya de Damasco hasta su muerte allí en Dhu al-Qa'da del año 766 de la Hégira, con más de setenta años, y su nombre se menciona como Mahmud o Muhammad {cite:durar-kamina-hyderabad-1972 vol. 6 pp. 99-100}."
  fr: "Qutb al-Din al-Razi, connu sous le nom d'al-Qutb al-Tahtani, l'une des plus grandes autorités en sciences rationnelles, qui s'inspira notamment d'al-Adud, vint à Damas et rédigea un commentaire sur al-Hawi, une glose sur al-Kashshaf et des commentaires sur al-Matali' et al-Isharat. Al-Asnawi le qualifiait d'homme aux multiples talents et Ibn Kathir de plus éminent théologien en logique et en sciences antiques. Il vécut à la Zahiriyya de Damas jusqu'à sa mort en Dhu al-Qa'da 766 AH, à plus de soixante-dix ans. Son nom est rapporté comme Mahmud ou Muhammad (source: Durar-Kamina-Hyderabad-1972, vol. 6, p. 99-100)."
