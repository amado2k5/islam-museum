summary:
  ar: "برهان الدين إبراهيم البقاعي؛ ولد في ربيع الأول سنة خمس وثمانين وثمانمائة وقرأ على البدر الغزي في الأصول والعربية وقرأ عليه البخاري كاملاً في ستة أيام أولها يوم السبت حادي عشر رمضان سنة ثلاثين وتسعمائة، وصحيح مسلم كاملاً في شهر رمضان سنة إحدى وثلاثين في خمسة أيام متفرقة في عشرين يوماً، وقرأ عليه نصف الشفا الأول وغير ذلك، وترجمه البدر بأنه كان من الأولياء الذين لا يعلمون بأنفسهم؛ توفي شهيداً بالبطن يوم الثلاثاء حادي عشر شعبان سنة خمس وثلاثين وتسعمائة {cite:shadharat-dhahab p. 594}."
  en: "The speed-reader mystic — read all of Sahih al-Bukhari on al-Badr al-Ghazzi in six days and Sahih Muslim in five sittings within twenty days; al-Ghazzi wrote him up as 'one of the saints who do not know themselves'; martyred by dysentery Tuesday 11 Sha'ban 935 {cite:shadharat-dhahab p. 594}."
