summary:
  ar: "برهان الدين إبراهيم البقاعي؛ ولد في ربيع الأول سنة خمس وثمانين وثمانمائة وقرأ على البدر الغزي في الأصول والعربية وقرأ عليه البخاري كاملاً في ستة أيام أولها يوم السبت حادي عشر رمضان سنة ثلاثين وتسعمائة، وصحيح مسلم كاملاً في شهر رمضان سنة إحدى وثلاثين في خمسة أيام متفرقة في عشرين يوماً، وقرأ عليه نصف الشفا الأول وغير ذلك، وترجمه البدر بأنه كان من الأولياء الذين لا يعلمون بأنفسهم؛ توفي شهيداً بالبطن يوم الثلاثاء حادي عشر شعبان سنة خمس وثلاثين وتسعمائة {cite:shadharat-dhahab p. 594}."
  en: "The speed-reader mystic — read all of Sahih al-Bukhari on al-Badr al-Ghazzi in six days and Sahih Muslim in five sittings within twenty days; al-Ghazzi wrote him up as 'one of the saints who do not know themselves'; martyred by dysentery Tuesday 11 Sha'ban 935 {cite:shadharat-dhahab p. 594}."
  es: "El místico lector veloz: leyó todo el Sahih al-Bukhari sobre al-Badr al-Ghazzi en seis días y el Sahih Muslim en cinco sesiones en veinte días; al-Ghazzi lo describió como \"uno de los santos que no se conocen a sí mismos\"; fue martirizado por disentería el martes 11 de Sha'ban de 935 {cita: shadharat-dhahab pág. 594}."
  fr: "Le mystique lecteur rapide — a lu tout le Sahih al-Bukhari sur al-Badr al-Ghazzi en six jours et le Sahih Muslim en cinq séances en vingt jours; al-Ghazzi l'a décrit comme « l'un des saints qui ne se connaissent pas eux-mêmes »; martyrisé par la dysenterie le mardi 11 Sha'ban 935 {cite:shadharat-dhahab p. 594}."
  ur: "سپیڈ ریڈر صوفیانہ - البدر الغازی کی تمام صحیح البخاری کو چھ دنوں میں اور صحیح مسلم کو بیس دن کے اندر پانچ نشستوں میں پڑھیں۔ الغازی نے اسے 'اولیاء میں سے ایک کے طور پر لکھا ہے جو اپنے آپ کو نہیں جانتے'؛ 11 شعبان 935 بروز منگل پیچش سے شہید ہوئے۔ 594}۔"
  tr: "Burhan al-Din İbrahim el-Bukai; Rabi'd-Evval'de sekiz yüz seksen beşinci yılında doğdu, el-Bedr el-Gazi'nin yanında prensipler ve Arapça okudu ve ona altı gün boyunca tüm Buhari'yi okudu; ilki dokuz yüz otuz yılın Ramazan ayının on birinci cumartesi, Sahih Müslüman'ı ise otuz bir yıl Ramazan ayında beş gün boyunca tam olarak okudu. Ayrıca kendisine ilk el-Şifa'nın yarısını ve diğer bölümlerini okudu. El-Badr bunu, kendini tanımayan azizlerden biri olarak çevirdi; Şaban ayının on birinci Salı günü, 935 Hicri karnından şehit olarak öldü. {alıntı:Shadharat-Dhahab, s. 594}."
  id: "Burhan al-Din Ibrahim al-Buqa'i; lahir di Rabi' al-Awwal pada tahun delapan ratus delapan puluh lima, ia belajar di bawah bimbingan al-Badr al-Ghazi dalam prinsip dan bahasa Arab, dan membacakan seluruh Bukhari kepadanya selama enam hari, yang pertama adalah Sabtu, tanggal sebelas Ramadan, tahun sembilan ratus tiga puluh, dan Sahih Muslim secara penuh pada Ramadan pada tahun tiga puluh satu selama lima hari selama dua puluh hari. Ia juga membacakan setengah dari al-Shifa pertama dan bagian-bagian lainnya kepadanya. Al-Badr menerjemahkannya sebagai salah satu wali yang tidak mengenal diri mereka sendiri; ia meninggal sebagai syahid di perut pada hari Selasa, tanggal sebelas Sha'ban, 935 H. {cite:shadharat-dhahab, hlm. 594}."
