summary:
  ar: "أبو إسحاق الثقفي يعرف بابن الشاعر، وكان أبوه شاعرًا صحب إياس بن معاوية وأخذ عنه ويُلقب يوسف القوي، ومنشؤه بالكوفة وأما حجاج فبغدادي المولد، سمع يعقوب بن إبراهيم بن سعد وأبا أحمد الزبيري وشبابة وعبد الرزاق، روى عنه أبو داود ومسلم وآخرهم الحسين بن إسماعيل المحاملي، وكان ثقة فصيحًا حافظًا صدوقًا، قال أبو حاتم الرازي هو صدوق وقال النسائي ثقة؛ توفي سنة تسع وخمسين ومائتين {cite:muntazam-ibn-al-jawzi p. 106}."
  en: "Abu Ishaq 'Ibn al-Sha'ir' of Baghdad, son of the poet Yusuf who attended Iyas ibn Mu'awiya; a trustworthy, eloquent traditionist — Muslim and Abu Dawud transmitted from him — who died in 259 {cite:muntazam-ibn-al-jawzi p. 106}."
