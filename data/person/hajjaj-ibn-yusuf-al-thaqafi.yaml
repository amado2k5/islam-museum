summary:
  ar: "أبو إسحاق الثقفي يعرف بابن الشاعر، وكان أبوه شاعرًا صحب إياس بن معاوية وأخذ عنه ويُلقب يوسف القوي، ومنشؤه بالكوفة وأما حجاج فبغدادي المولد، سمع يعقوب بن إبراهيم بن سعد وأبا أحمد الزبيري وشبابة وعبد الرزاق، روى عنه أبو داود ومسلم وآخرهم الحسين بن إسماعيل المحاملي، وكان ثقة فصيحًا حافظًا صدوقًا، قال أبو حاتم الرازي هو صدوق وقال النسائي ثقة؛ توفي سنة تسع وخمسين ومائتين {cite:muntazam-ibn-al-jawzi p. 106}."
  en: "Abu Ishaq 'Ibn al-Sha'ir' of Baghdad, son of the poet Yusuf who attended Iyas ibn Mu'awiya; a trustworthy, eloquent traditionist — Muslim and Abu Dawud transmitted from him — who died in 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  es: "Abu Ishaq 'Ibn al-Sha'ir' de Bagdad, hijo del poeta Yusuf que asistió a Iyas ibn Mu'awiyah; un tradicionalista elocuente y digno de confianza (musulmán y Abu Dawud heredado de él) que murió en 259 {cita:muntazam-ibn-al-jawzi p. 106}."
  fr: "Abu Ishaq 'Ibn al-Sha'ir' de Bagdad, fils du poète Yusuf qui fréquentait Iyas ibn Mu'awiyah; un traditionniste digne de confiance et éloquent – Muslim et Abu Dawud transmis de lui – décédé en 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  ur: "ابو اسحاق 'ابن الشعر' بغداد کا، شاعر یوسف کا بیٹا جس نے ایاس بن معاویہ میں شرکت کی؛ ایک ثقہ، فصیح روایت دان - مسلم اور ابوداؤد نے ان سے نقل کیا ہے - جو 259 میں فوت ہوئے {حوالہ: منتظر ابن الجوزی ص. 106}۔"
  tr: "Ebu İshaq el-Tekafi, İbn el-Şair olarak bilinir. Babası, İyas bin Muaviye'ye eşlik eden ve onun yanında eğitim gören bir şairdi; Yusuf el-Kawi olarak bilinir. Kökeni Kufe'dir. Hac ise Bağdat'ta doğmuştur. Ya'qub bin İbrahim ibn Sa'd, Ebu Ahmed el-Zubeyri, Şababa ve Abdülrezak'ı dinlemiştir. Müslüman Ebu Davud ve sonuncusu el-Hüseyin bin İsmail el-Mahamili ondan rivayet etmiştir. Güvenilir, etkileyici ve dürüst biriydi. Ebu Hatim el-Razi onun dürüst olduğunu söyledi, el-Nasai ise güvenilir olduğunu söyledi; 259 Hicri yılında vefat etti {atıf:Müslim-ibn el-Cavazi, s. 106}."
  id: "Abu Ishaq al-Thaqafi dikenal sebagai Ibn al-Sha'ir. Ayahnya adalah seorang penyair yang menemani Iyas ibn Mu'awiyah dan belajar di bawahnya, dikenal sebagai Yusuf al-Qawi. Asal-usulnya berasal dari Kufa. Adapun Hajjaj, ia lahir di Baghdad. Ia mendengar Ya'qub ibn Ibrahim ibn Sa'd, Abu Ahmad al-Zubayri, Shababa, dan Abd al-Razzaq. Abu Dawud, seorang Muslim, dan yang terakhir dari mereka al-Husayn ibn Ismail al-Mahamili menceritakan darinya. Ia dapat dipercaya, fasih, dan jujur. Abu Hatim al-Razi mengatakan ia jujur, dan al-Nasa'i mengatakan ia dapat dipercaya; ia meninggal pada tahun 259 H {cite:muntazam-ibn-al-jawzi, hlm. 106}."
