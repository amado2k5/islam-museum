label: { ar: "حبيب بن عبد الرحمن الفهري" }
summary:
  ar: "عند البلاذري: ولّي ثغر المغرب بعد إلياس بن حبيب — أي بعد أخيه — ثم غلب البربر والإباضية من الخوارج."
  en: "In al-Baladhuri: governed the Maghreb frontier after Ilyas ibn Habib — that is, after his brother — then the Berbers and the Ibadis of the Khawarij prevailed."
  es: "En al-Baladhuri: gobernó la frontera del Magreb después de Ilyas ibn Habib —es decir, después de su hermano— entonces prevalecieron los bereberes y los ibadíes de los jariyíes."
  fr: "Dans al-Baladhuri: gouverna la frontière du Maghreb après Ilyas ibn Habib — c'est-à-dire après son frère — puis les Berbères et les Ibadites des Kharijites l'emportèrent."
  ur: "البلادوری میں ہے: الیاس بن حبیب کے بعد مغرب کی سرحد پر حکومت کی - یعنی اپنے بھائی کے بعد - پھر خوارج کے بربر اور عبادیوں نے غلبہ حاصل کیا۔"
  tr: "Al-Baladhuri'ye göre: Fas sınırını İlyas ibn Habib'den — yani kardeşinden — sonra Berberiler ve İbadileri Haricilerden yönetti."
  id: "Menurut Al-Baladhuri: Ia mengambil alih perbatasan Maroko setelah Ilyas ibn Habib — yaitu, setelah saudaranya — lalu ia menguasai Berber dan Ibadi dari Kharijit."
