summary:
  ar: "محمد أبو السعود بن السيد علي، فقيه حنفي، من تصانيفه فتح الله المعين على شرح كنز الدقائق للعلامة منلا مسكين، ورسالة في كرامات الأولياء، وحاشيته على شرح منلا مسكين. (كان حياً سنة ١١٥٥ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13366}"
  en: "Muhammad Abu al-Su'ud ibn al-Sayyid Ali, a Hanafi jurist. His works include Fath Allah al-Mu'in, a commentary on the Kanz al-Daqa'iq of Mulla Miskin, a treatise on the marvels of saints, and a gloss on Mulla Miskin's commentary. The book says he was alive in 1155 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13366}"
