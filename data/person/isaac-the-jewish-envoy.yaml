label: { ar: "إسحاق مبعوث شارلمان" }
gender: male
roles: [agent]
summary:
  ar: "إسحاق، اليهودي الذي رافق بعثة شارلمان إلى هارون الرشيد سنة ١٨١هـ/٧٩٧م مترجماً مع فرنجيين اثنين؛ استغرقت الرحلة ثلاثة أعوام توفي أثناءها الفرنجيان فعاد إسحاق وحده ومعه فيل هدية من الرشيد إلى شارلمان، ووصل آخن سنة ١٨٣هـ/٧٩٩م في الوقت نفسه الذي وصلت فيه سفارة الرشيد — وهي تفاصيل تنفرد بها المصادر اللاتينية كإينهارد وسانت جول والأخبار الملكية {cite:tarikh-dawla-abbasiyya-taqqush p. 106-107}."
  en: "Isaac — the Jewish interpreter of Charlemagne's 797 embassy to al-Rashid who alone survived the three-year journey, returning to Aachen with the caliph's elephant {cite:tarikh-dawla-abbasiyya-taqqush p. 106-107}."
  es: "Isaac — el intérprete judío de la embajada de Carlomagno a al-Rashid en 797, el único que sobrevivió al viaje de tres años, regresando a Aquisgrán con el elefante del califa {cite:tarikh-dawla-abbasiyya-taqqush p. 106-107}."
  fr: "Isaac — l'interprète juif de l'ambassade de Charlemagne à al-Rashid en 797, qui fut le seul à survivre au voyage de trois ans, retournant à Aix-la-Chapelle avec l'éléphant du calife {cite:tarikh-dawla-abbasiyya-taqqush p. 106-107}."
  ur: "اسحاق - شارلیمین کے 797 سفارت خانے کا یہودی مترجم الرشید کے لیے جو تنہا تین سال کے سفر سے بچ گیا، خلیفہ کے ہاتھی کے ساتھ آچن واپس آیا۔ 106-107}۔"
  tr: "İshaq, 181 Hicri / 797 M.S.'de iki Frank ile birlikte Şarlman'ın Harun el-Reşid'e yaptığı göreve tercüman olarak eşlik eden Yahudi İshaq; yolculuk üç yıl sürdü ve bu süre zarfında Franklar öldü, bu yüzden İshak, el-Reşid'den Şarlman'a hediye olarak bir fil ile tek başına döndü ve 183 Hicri/799 yılında el-Raşid'in elçiliğiyle aynı zamanda Aahen'e vardı — bu detaylar Inhard, Aziz Jules ve kraliyet haberleri gibi Latince kaynaklara özgü {atıf:Tarikh-dawla-abbasiyya-taqqush s. 106-107}."
  id: "Ishaq, orang Yahudi yang menemani misi Charlemagne ke Harun al-Rashid pada tahun 181 H / 797 M sebagai penerjemah bersama dua orang Frank; perjalanan itu berlangsung selama tiga tahun di mana orang Frank meninggal, sehingga Isaac kembali sendirian dengan seekor gajah sebagai hadiah dari al-Rashid kepada Charlemagne, dan tiba di Aachen pada tahun 183 H/799 M bersamaan dengan kedutaan al-Rashid — detail yang unik dari sumber Latin seperti Inhard, Saint Jules, dan berita kerajaan {cite:Tarikh-dawla-abbasiyya-taqqush hlm. 106-107}."
