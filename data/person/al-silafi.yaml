summary:
  ar: "الحافظ العلامة الكبير مسند الدنيا ومعمر الحفاظ أبو طاهر السلفي الأصبهاني؛ سمع من أبي عبد الله الثقفي وخلق بأصبهان وأخرج عنهم في معجم، ورحل سنة ثلاث فأدرك أبا الخطاب بن البطر ببغداد وتفقه بالكيا الهراسي وأبي بكر الشاشي وعمل معجماً لشيوخ بغداد ثم حج وسمع بالحرمين والكوفة والبصرة وهمدان وزنجان والري ودينور وقزوين وأذربيجان والشام ومصر فأكثر وأطاب، وتفقه فأتقن مذهب الشافعي وبرع في الأدب وجود القرآن بالروايات واستوطن الإسكندرية بضعاً وستين سنة ملازماً الاشتغال والمطالعة والنسخ وتحصيل الكتب ومكث ثمانين سنة يسمع عليه — قال الذهبي لا أعلم أحداً مثله في هذا — وجاوز المائة بلا ريب وإنما الاختلاف في مقدار الزيادة؛ تزوج بالإسكندرية امرأة ذات يسار فحصلت له ثروة بعد فقر وبنى له العادل علي بن أيبك بن السلار أمير مصر مدرسة بالإسكندرية؛ توفي يوم الجمعة بكرة خامس ربيع الآخر سنة ست وسبعين وخمسمائة {cite:shadharat-dhahab p. 735-736}."
  en: "The great hafiz Abu Tahir al-Silafi of Isfahan, musnid al-dunya and longest-lived of the huffaz; he heard his elders at Isfahan, reached Baghdad in 503 to hear Ibn al-Batr, made a mu'jam of Baghdad's shaykhs, then heard across the Haramayn, Kufa, Basra, Hamadan, Rayy, Qazvin, Azerbaijan, Syria and Egypt; he settled at Alexandria sixty-odd years copying and collecting books, with eighty years of being listened to — al-Dhahabi: 'I know none like him in this' — past a hundred without doubt; al-Adil, Egypt's amir, built him an Alexandria madrasa; he died Friday morning 5 Rabi' II 576 {cite:shadharat-dhahab p. 735-736}."
