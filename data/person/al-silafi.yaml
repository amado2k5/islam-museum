names:
  - { value: "أبو طاهر السلفي أحمد بن محمد بن أحمد بن حمد بن إبراهيم الأصبهاني الحرواني", kind: full }
summary:
  ar: "الحافظ العلامة الكبير مسند الدنيا ومعمر الحفاظ أبو طاهر السلفي الأصبهاني؛ سمع من أبي عبد الله الثقفي وخلق بأصبهان وأخرج عنهم في معجم، ورحل سنة ثلاث فأدرك أبا الخطاب بن البطر ببغداد وتفقه بالكيا الهراسي وأبي بكر الشاشي وعمل معجماً لشيوخ بغداد ثم حج وسمع بالحرمين والكوفة والبصرة وهمدان وزنجان والري ودينور وقزوين وأذربيجان والشام ومصر فأكثر وأطاب، وتفقه فأتقن مذهب الشافعي وبرع في الأدب وجود القرآن بالروايات واستوطن الإسكندرية بضعاً وستين سنة ملازماً الاشتغال والمطالعة والنسخ وتحصيل الكتب ومكث ثمانين سنة يسمع عليه — قال الذهبي لا أعلم أحداً مثله في هذا — وجاوز المائة بلا ريب وإنما الاختلاف في مقدار الزيادة؛ تزوج بالإسكندرية امرأة ذات يسار فحصلت له ثروة بعد فقر وبنى له العادل علي بن أيبك بن السلار أمير مصر مدرسة بالإسكندرية؛ توفي يوم الجمعة بكرة خامس ربيع الآخر سنة ست وسبعين وخمسمائة {cite:shadharat-dhahab p. 735-736}."
  en: "The great hafiz Abu Tahir al-Silafi of Isfahan, musnid al-dunya and longest-lived of the huffaz; he heard his elders at Isfahan, reached Baghdad in 503 to hear Ibn al-Batr, made a mu'jam of Baghdad's shaykhs, then heard across the Haramayn, Kufa, Basra, Hamadan, Rayy, Qazvin, Azerbaijan, Syria and Egypt; he settled at Alexandria sixty-odd years copying and collecting books, with eighty years of being listened to — al-Dhahabi: 'I know none like him in this' — past a hundred without doubt; al-Adil, Egypt's amir, built him an Alexandria madrasa; he died Friday morning 5 Rabi' II 576 {cite:shadharat-dhahab p. 735-736}."
  fr: "Le grand hafiz Abu Tahir al-Silafi d'Ispahan, musnid al-dunya et la plus longue durée de vie du huffaz ; il entendit ses aînés à Ispahan, arriva à Bagdad en 503 pour entendre Ibn al-Batr, fit un mu'jam des cheikhs de Bagdad, puis entendit à travers le Haramayn, Koufa, Bassorah, Hamadan, Rayy, Qazvin, l'Azerbaïdjan, la Syrie et l'Égypte ; Il s'installa à Alexandrie soixante et quelques années pour copier et collectionner des livres, avec quatre-vingts ans d'écoute - al-Dhahabi : \"Je ne connais personne comme lui dans ce domaine\" - passé une centaine sans aucun doute ; Al-Adil, l'émir d'Égypte, lui a construit une madrasa d'Alexandrie ; il est mort vendredi matin 5 Rabi' II 576 {cite:shadharat-dhahab p. 735-736}."
  es: "El gran hafiz Abu Tahir al-Silafi de Isfahán, musnid al-dunya y el huffaz de mayor edad; escuchó a sus mayores en Isfahán, llegó a Bagdad en 503 para escuchar a Ibn al-Batr, hizo un mu'jam de los shaykhs de Bagdad, luego escuchó en todo el Haramayn, Kufa, Basora, Hamadán, Rayy, Qazvin, Azerbaiyán, Siria y Egipto; se estableció en Alejandría durante más de sesenta años copiando y coleccionando libros, con ochenta años de ser escuchado —al-Dhahabi: 'No conozco a nadie como él en esto'— más de cien sin duda; al-Adil, el emir de Egipto, le construyó una madrasa en Alejandría; murió el viernes por la mañana del 5 de Rabi' II de 576 {cite:shadharat-dhahab p. 735-736}."
  ur: "اصفہان کے عظیم حافظ ابو طاہر السلفی، مسند الدنیا اور حفاظ کے سب سے طویل عرصے تک رہنے والے؛ اس نے اصفہان میں اپنے بزرگوں سے سنا، ابن البطر کو سننے کے لیے 503 میں بغداد پہنچا، بغداد کے شیوخ کی مجلس کی، پھر حرمین، کوفہ، بصرہ، ہمدان، رے، قزوین، آذربائیجان، شام اور مصر میں سنا۔ وہ اسکندریہ میں ساٹھ سال تک کتابیں نقل کرنے اور جمع کرنے میں مقیم رہا، اسّی سال تک سنا جاتا رہا - الذہبی: 'میں اس جیسا کوئی نہیں جانتا' - بغیر کسی شک کے سو گزر چکے ہیں۔ العادل، مصر کے امیر نے اس کے لیے اسکندریہ کا مدرسہ بنایا۔ جمعہ کی صبح 5 ربیع الثانی 576 میں وفات پائی 735-736}۔"
  tr: "Ezberci, büyük âlim, dünyanın iletici ve adanmış ezberci Ebu Tahir el-Selefi el-İsfahani; Ebu Abdullah el-Tekafi'den duymuş, İsfahan'da doğmuş ve onlardan bir sözlük derlemiştir. Üçüncü yılda seyahat etti ve Bağdat'ta Ebu el-Hattab bin el-Bedr ile tanıştı; burada el-Kiya el-Harasi ve Ebu Bekir el-Şa'da fıkıh eğitimi aldı şi, Bağdat şeyhleri için bir sözlük derledi, ardından Hac yaptı ve Kufa, Basra, Hamadan, Zencan, Rayy, Dinur, Kazvin, Azerbaycan, Şam, Mısır ve daha fazlasından dinledi ve daha da gelişti. Şafii okulunu ustalıkla öğrendi, edebiyatta, Kur'an da dahil olmak üzere rivayetler aracılığıyla üstün başarı gösterdi ve altmış küsur yıl boyunca İskenderiye'de yaşadı, sürekli olarak çalışmalarına devam etti. Kitap okudu, kopyaladı ve edindi, seksen yıl boyunca onu dinledi — El-Dhahabi şöyle dedi: Bu konuda onun gibi birini tanımıyorum — ve şüphesiz yüzü aştı, ama fark artışın miktarındadır. İskenderiye'de soldan bir kadınla evlendi, yoksulluktan sonra zenginleşti ve Mısır Emiri Ali ibn Aybak ibn al-Sallar, onun için İskenderiye'de bir okul inşa etti. Cuma günü, 576 Hicri yılında Rabi'al-Thani'nin beşincisi olarak vefat etti {atıf:shadharat-dhahab, s. 735-736}."
  id: "Sang penghafal, ulama besar, penyampai dunia, dan penghafal setia Abu Tahir al-Salafi al-Isfahani; ia mendengar dari Abu Abdullah al-Thaqafi, lahir di Isfahan, dan menyusun dari mereka dalam kamus. Ia melakukan perjalanan pada tahun ketiga dan bertemu Abu al-Khattab ibn al-Batr di Baghdad, di mana ia mempelajari hukum al-Kiya al-Harasi dan Abu Bakr al-Shashi, menyusun kamus untuk para sheikh Baghdad, lalu melaksanakan Haji dan mendengar dari Dua Masjid Suci, Kufa, Basra, Hamadan, Zanjan, Rayy, Dinur, Qazvin, Azerbaijan, Levant, Mesir, dan lainnya, serta menjadi lebih matang. Ia menguasai aliran pemikiran Shafi'i dan unggul dalam sastra, termasuk Al-Qur'an melalui riwayat, dan menetap di Alexandria selama lebih dari enam puluh tahun, terus terlibat dalam pekerjaannya. Membaca, menyalin, dan membeli buku, dan ia tinggal selama delapan puluh tahun mendengarkan — Al-Dhahabi berkata: Saya tidak mengenal siapa pun seperti dia dalam hal ini — dan ia jelas melebihi seratus orang, tetapi perbedaannya terletak pada jumlah pertumbuhan. Ia menikahi seorang wanita kiri di Alexandria, yang menjadi kaya setelah kemiskinan, dan Ali ibn Aybak ibn al-Sallar, Emir Mesir, yang adil, membangun sekolah untuknya di Alexandria. Ia meninggal pada hari Jumat, tanggal lima Rabi' al-Thani tahun 576 H {cite:shadharat-dhahab, hlm. 735-736}."
