roles: [mystic, transmitter]
summary:
  ar: "إبراهيم المغربي. رفسته بغلة فكسرت رجله، فقال: لولا مصائب الدنيا لقد منّا على الله مفاليس. روى عنه إبراهيم بن الوليد هذا القول."
  en: "Ibrahim al-Maghribi; a mule kicked him and broke his leg, and he said: were it not for the calamities of the world, we would come before God as paupers; Ibrahim ibn al-Walid relates the saying."
  ur: "ابراہیم مغربی۔ ایک خچر نے انہیں لات مار کر ان کی ٹانگ توڑ دی، تو انہوں نے کہا: اگر دنیا کی مصیبتیں نہ ہوتیں تو ہم اللہ کے سامنے مفلس بن کر آتے۔ یہ قول ابراہیم بن ولید نے نقل کیا۔"
  es: "Ibrahim al-Maghribi; una mula lo pateó y le rompió la pierna, y él dijo: si no fuera por las calamidades del mundo, vendríamos ante Dios como mendigos; Ibrahim ibn al-Walid relata este dicho."
  fr: "Ibrahim al-Maghribi; une mule lui donna un coup de pied et lui cassa la jambe, et il dit: sans les calamités du monde, nous nous présenterions devant Dieu comme des pauvres; Ibrahim ibn al-Walid rapporte ce dicton."
  tr: "İbrahim el-Mağribi. Bir katır tarafından tekmeledi ve bacağı kırdı, bu yüzden dedi ki: Bu dünyanın felaketleri olmasaydı, Allah'a borçlu olurduk. İbrahim bin el-Velid bu sözü ondan aktardı."
  id: "Ibrahim al-Maghribi. Dia ditendang keledai dan kakinya patah, lalu dia berkata: Seandainya bukan karena bencana dunia ini, kita akan berhutang budi kepada Allah. Ibrahim ibn al-Walid menceritakan pernyataan ini darinya."
