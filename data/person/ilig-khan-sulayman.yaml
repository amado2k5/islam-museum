id: person/ilig-khan-sulayman
class: person
label:
  ar: ايلك خان سليمان الخاقاني
  en: Ilig Khan Sulayman al-Qarakhani
summary:
  ar: "ايلك خان سليمان أخو بقراخان، لقبه شهير الدولة؛ ولي ملك الترك بكاشغر بعد أخيه فاستوثق ملكه بتركستان وأعمالها، وأكرم فائق الخادم لما لحق به من حروب خراسان وشفع فيه عند الأمير نوح فولاه سمرقند، ثم طمع في ملك بخارى فسار في جموع الترك مورياً بالمحاماة عن عبد الملك، وقبض على بكثرزون والأمراء والقواد، ودخل بخارى عاشر ذي القعدة سنة تسع وثمانين من المائة الرابعة على قراءة النص ونزل دار الإمارة وحبس عبد الملك فانكدر حتى مات وحبس معه المخلوع أبا الحارث منصور، وانقرضت دولة بني سامان، واشتبك بعد ذلك مع إسماعيل المستنصر الساماني فهزمه بنواحي أسروشنة."
  en: "Ilig Khan Sulayman, Bughra Khan's brother, laqab Shihab al-Dawla; he secured the Turkestan kingship after his brother, sheltered the refugee amir Fa'iq and interceded to seat him at Samarkand — then, coveting Bukhara, marched the Turkic hosts in feigned protection of Abd al-Malik, seized Buktuzun and the amirs, entered Bukhara on 10 Dhu'l-Qa'da of year 389 on the text's reading, imprisoned Abd al-Malik till he died of grief and the deposed Abu'l-Harith Mansur with him — ending the Samanid state — and later routed Ismail al-Muntasir the last Samanid near Usrushana."
