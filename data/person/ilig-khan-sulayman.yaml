id: person/ilig-khan-sulayman
class: person
label:
  ar: ايلك خان سليمان الخاقاني
  en: Ilig Khan Sulayman al-Qarakhani
  es: "Ilig Khan Sulayman al-Qarakhani"
  fr: "Ilig Khan Sulayman al-Qarakhani"
  ur: "الیگ خان سلیمان القراخانی۔"
summary:
  ar: "ايلك خان سليمان أخو بقراخان، لقبه شهير الدولة؛ ولي ملك الترك بكاشغر بعد أخيه فاستوثق ملكه بتركستان وأعمالها، وأكرم فائق الخادم لما لحق به من حروب خراسان وشفع فيه عند الأمير نوح فولاه سمرقند، ثم طمع في ملك بخارى فسار في جموع الترك مورياً بالمحاماة عن عبد الملك، وقبض على بكثرزون والأمراء والقواد، ودخل بخارى عاشر ذي القعدة سنة تسع وثمانين من المائة الرابعة على قراءة النص ونزل دار الإمارة وحبس عبد الملك فانكدر حتى مات وحبس معه المخلوع أبا الحارث منصور، وانقرضت دولة بني سامان، واشتبك بعد ذلك مع إسماعيل المستنصر الساماني فهزمه بنواحي أسروشنة."
  en: "Ilig Khan Sulayman, Bughra Khan's brother, laqab Shihab al-Dawla; he secured the Turkestan kingship after his brother, sheltered the refugee amir Fa'iq and interceded to seat him at Samarkand — then, coveting Bukhara, marched the Turkic hosts in feigned protection of Abd al-Malik, seized Buktuzun and the amirs, entered Bukhara on 10 Dhu'l-Qa'da of year 389 on the text's reading, imprisoned Abd al-Malik till he died of grief and the deposed Abu'l-Harith Mansur with him — ending the Samanid state — and later routed Ismail al-Muntasir the last Samanid near Usrushana."
  es: "Ilig Khan Sulayman, hermano de Bughra Khan, laqab Shihab al-Dawla; aseguró el trono de Turkestán tras la muerte de su hermano, dio refugio al emir refugiado Fa'iq e intercedió para que se estableciera en Samarcanda; luego, codiciando Bujará, marchó con las huestes turcas fingiendo proteger a Abd al-Malik, se apoderó de Buktuzun y de los emires, entró en Bujará el 10 de Dhu'l-Qa'da del año 389 según la lectura del texto, encarceló a Abd al-Malik hasta que murió de pena y al depuesto Abu'l-Harith Mansur con él, poniendo fin al estado samaní, y más tarde derrotó a Ismail al-Muntasir, el último samaní, cerca de Usrushana."
  fr: "Ilig Khan Sulayman, frère de Bughra Khan, laqab Shihab al-Dawla; il s'assura la royauté du Turkestan après son frère, abrita l'émir réfugié Fa'iq et intercéda pour qu'il s'installe à Samarcande — puis, convoitant Boukhara, il fit marcher les armées turques sous la protection feinte d'Abd al-Malik, s'empara de Buktuzun et des émirs, entra dans Boukhara le 10 Dhu'l-Qa'da de l'an 389 selon la lecture du texte, emprisonna Abd al-Malik jusqu'à ce qu'il meure de chagrin et détrôna Abu'l-Harith Mansur avec lui — mettant fin à l'État samanide — et plus tard mit en déroute Ismail al-Muntasir, le dernier Samanide, près d'Usrushana."
  ur: "الیگ خان سلیمان، بغرا خان کا بھائی، لقب شہاب الدولہ؛ اس نے اپنے بھائی کے بعد ترکستان کی بادشاہت حاصل کی، مہاجر امیر فائق کو پناہ دی اور اسے سمرقند میں بٹھانے کی سفارش کی - پھر بخارا کی لالچ میں، عبد الملک کی حفاظت میں ترک فوجوں پر چڑھائی کی، بکطزون اور امیروں کو پکڑ لیا، 10 ذی الحجہ کو 3 ذی الحجہ کو بخارا میں داخل ہوا۔ عبد الملک کو قید میں رکھا یہاں تک کہ وہ غم سے مر گیا اور معزول ابو الحارث منصور نے اس کے ساتھ - سامانی ریاست کا خاتمہ کیا - اور بعد میں عروشنہ کے قریب اسماعیل المنتصر کو آخری سامانی سے شکست دی۔"
  tr: "Bakarakhan'ın kardeşi İlik Han Süleyman, Şahir el-Devle olarak bilinir; kardeşinden sonra Kaşgar'da Türklerin kralı oldu, böylece Türkistan ve işlerinin yönetimini sağlamlaştırdı. Horasan savaşlarında Faiq al-Khadim'i onurlandırdı ve Prens Nuh'a aracılık etti; Nuh onu Semerkant valisi olarak atadı. Sonra Buhara'nın krallığını arzuladı ve Murya Türkleri arasında yürüyüp Abdülmalik'i savundu, Babe'yi ele geçirdi Katharzon, prensler ve komutanlar. 89 Hicri yılının Zulü Kı'dah'ın onuncusunda metni okuduktan sonra Buhara'ya girdi, vali konutunda kaldı ve Abdül-Malik'i hapse attı; Abd al-Malik, ölümüne kadar üzüntüye kapıldı. Tahttan indirilen Ebu el-Harit Mansur onunla birlikte hapsedildi. Samani devleti yok oldu ve daha sonra İsmail el-Mustansir el-Samani ile çatıştı, onu Asroşna yakınlarında yendi."
  id: "Ilik Khan Suleiman, saudara Baqarakhan, yang dikenal sebagai Shahir al-Dawla; ia menjadi raja Turki di Kashgar setelah saudaranya, sehingga ia mengamankan kekuasaannya atas Turkestan dan urusannya. Ia menghormati Faiq al-Khadim atas perang Khorasan dan menjadi perantara untuknya kepada Pangeran Nuh, yang mengangkatnya sebagai gubernur Samarkand. Ia kemudian menginginkan kerajaan Bukhara dan berjalan di antara orang Turki Murya untuk membela Abd al-Malik, merebut Bakathar zon, para pangeran, dan para komandan. Ia memasuki Bukhara pada tanggal sepuluh Dhu al-Qi'dah tahun 89 H, setelah membaca teks tersebut, tinggal di kediaman gubernur, dan memenjarakan Abd al-Malik, yang menjadi gelisah hingga ia meninggal. Abu al-Harith Mansur yang digulingkan dipenjara bersamanya. Negara Samani punah, dan ia kemudian bertempur dengan Ismail al-Mustansir al-Samani, mengalahkannya di dekat Asroshna."
