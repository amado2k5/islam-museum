died: { edtf: "1223~", hijri: "0620", calendar: julian, precision: month, status: tradition, derived: true, note: "مات في شوال أو في ذي القعدة سنة عشرين وستمائة ولم يخلف ولداً {cite:wafayat-ayan}." }
summary:
  ar: "أبو يعقوب يوسف بن محمد بن الأمير يعقوب المنصور الموحدي، الملقب بالمستنصر؛ وُلي الخلافة بعد أبيه الناصر وكان شاباً مشغوفاً براحته، وعند موته اتفق أن بايعت الدولة عمه عبد الواحد بن يوسف بن عبد المؤمن لكبر سنه {cite:wafayat-ayan}."
  en: "Abu Ya'qub Yusuf ibn Muhammad ibn Amir Ya'qub al-Mansur al-Muwahhidi, called al-Mustansir. He succeeded his father al-Nasir; he was a young man fond of his ease. At his death, because his uncle was of advanced age, the state gave its allegiance to his uncle Abd al-Wahid ibn Yusuf ibn Abd al-Mu'min {cite:wafayat-ayan}."
  fr: "Abu Ya'qub Yusuf ibn Muhammad ibn Amir Ya'qub al-Mansur al-Muwahhidi, appelé al-Mustansir. Il succéda à son père al-Nasir  ; c’était un jeune homme qui aimait son aisance. À sa mort, parce que son oncle était d'âge avancé, l'État a donné son allégeance à son oncle Abd al-Wahid ibn Yusuf ibn Abd al-Mu'min {cite:wafayat-ayan}."
  es: "Abu Ya'qub Yusuf ibn Muhammad ibn Amir Ya'qub al-Mansur al-Muwahhidi, llamado al-Mustansir. Sucedió a su padre al-Nasir; era un joven amante de la comodidad. A su muerte, debido a la avanzada edad de su tío, el estado juró lealtad a su tío Abd al-Wahid ibn Yusuf ibn Abd al-Mu'min {cite:wafayat-ayan}."
  ur: "ابو یعقوب یوسف بن محمد بن عامر یعقوب المنصور المواحدی المستنصر کہلاتے ہیں۔ اس نے اپنے والد النصیر کی جگہ لی۔ وہ اپنی آسانی کا دلدادہ نوجوان تھا۔ ان کی وفات کے وقت چونکہ ان کے چچا بڑی عمر کے تھے، ریاست نے ان کے چچا عبد الواحد بن یوسف بن عبد المومن کی بیعت کی۔"
  tr: "Ebu Yaqub Yusuf bin Muhammed bin el-Amir Yaqub el-Mansur el-Muvehddi, lakaplı adıyla el-Mustansir, babası el-Nasir'in ardından halifeliği devraldı ve rahatlığına tutkuyla bağlı genç bir adamdı. Ölümünden sonra, devletin amcası Abd al-Wahid ibn Yusuf ibn Abd al-Mu'min'e ileri yaşı nedeniyle bağlılık yemini ettiği kabul edildi {atıf:wafayat-ayan}."
  id: "Abu Yaqub Yusuf ibn Muhammad ibn al-Amir Yaqub al-Mansur al-Muwahdi, yang dijuluki al-Mustansir, mengambil alih kekhalifahan setelah ayahnya al-Nasir dan merupakan seorang pemuda yang sangat peduli pada kenyamanannya. Setelah kematiannya, disepakati bahwa negara bersumpah setia kepada pamannya Abd al-Wahid ibn Yusuf ibn Abd al-Mu'min karena usianya yang sudah lanjut {cite:wafayat-ayan}."
