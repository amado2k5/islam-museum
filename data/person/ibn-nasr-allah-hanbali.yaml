summary:
  ar: "قاضي القضاة محب الدين ابن نصر الله البغدادي ثم المصري الحنبلي شيخ الإسلام وعلم الأعلام شيخ المذهب ومفتي الديار المصرية؛ ولد ببغداد في ضحوة يوم السبت سابع عشر رجب سنة خمس وستين وسبعمائة وسمع بها من والده ومن نجم الدين أبي بكر بن قاسم ونور الدين علي بن أحمد المقري وعني بالحديث ثم قدم القاهرة مع والده وأخذ عن مشايخ منهم سراج الدين البلقيني وزين الدين العراقي وابن الملقن وأخذ عن الشيخ زين الدين بن رجب بالشام وسمع بحلب من الشهاب بن المرحل، وولي تدريس الظاهرية البرقوقية وغيرها وناب في الحكم عن ابن المغلي ونافذ وأفتى وانتفع به الناس وكان متضلعاً في العلوم الشرعية من تفسير وحديث وفقه وأصول، قال برهان الدين بن مفلح في طبقاته وهو من أجل مشايخنا وانتهت إليه مشيخة الحنابلة بعد موت مستخلفه علاء الدين بن مغلي، وله عمل كثير في شرح مسلم وحواش على المحرر حسنة وعلى الفروع وكتابه على الفتوى نهاية، وأفتى بصحة الخلع حيلة وعدم وقوع الطلاق بفعل المحاوف عليه في مزمن البينونة، وكان لا ينظر بإحدى عينيه مع حسن شكله وأبهته واستقل بقضاء مصر مدداً، وتوفي بالقاهرة صبيحة يوم الأربعاء النصف من جمادى الآخرة سنة أربع وأربعين وثمانمائة عن مائة وسبعين سنة وعشرة أشهر إلا يومين واستقر ولده يوسف بعده في تدريس المنصورية والأشرفية {cite:shadharat-dhahab p. 250-251}."
  en: "Ibn Nasr Allah (b. Baghdad 17 Rajab 765) — shaykh al-Islam, mufti of Egypt and head of the Hanbalis after Ibn Mughli, one-eyed and august; judge of Egypt for long stretches, author of a large work on Sharh Muslim and praised hawashi on al-Muharrar; died Cairo Wednesday mid-Jumada II 844 at 79 {cite:shadharat-dhahab p. 250-251}."
  es: "Ibn Nasr Allah (n. Bagdad 17 Rajab 765) — shaykh al-Islam, muftí de Egipto y jefe de los hanbalíes después de Ibn Mughli, tuerto y augusto; juez de Egipto durante largos períodos, autor de una gran obra sobre Sharh Muslim y elogió a hawashi sobre al-Muharrar; murió en El Cairo el miércoles de mediados de Jumada II 844 a los 79 años {cite:shadharat-dhahab p. 250-251}."
  fr: "Ibn Nasr Allah (né à Bagdad le 17 Rajab 765) — cheikh al-Islam, mufti d'Égypte et chef des Hanbalites après Ibn Mughli, borgne et auguste; juge d'Égypte pendant de longues périodes, auteur d'un grand ouvrage sur Sharh Muslim et hawashi élogieux sur al-Muharrar; mort au Caire le mercredi mi-Jumada II 844 à 79 ans {cite:shadharat-dhahab p. 250-251}."
  ur: "ابن نصر اللہ ⁦(بغداد 17 رجب 765)⁩ - شیخ الاسلام، مصر کے مفتی اور ابن مغلی کے بعد حنبلیوں کے سربراہ، یک چشم اور اگست؛ طویل عرصے تک مصر کے جج، شرح مسلم پر ایک بڑے کام کے مصنف اور المحرر پر حواشی کی تعریف کی۔ قاہرہ بدھ کے روز وسط جمادی الثانی 844ھ 79 میں وفات پائی۔ 250-251}۔"
  tr: "Baş Yargıç Muhib al-Din İbn Nasrallah el-Bağdadi, o dönemde Mısır Hanbali'si, İslam mezhebi şeyhi, İslam mezhebi alimi ve Mısır Müftüsü; yedi yüz altmış beş, Cumesi günü Cumesi sabahı doğdu. Orada babası Necmeddin Ebu Bekir bin Kasım, Nur al-Din Ali ibn Ahmed al-Maqri'den eğitim aldı ve orada hadis okudu. Daha sonra babasıyla birlikte Kahire'ye geldi ve Siraj al-Din al-Bulqini, Zain al-Din al-Iraqi, İbn al-Mulqin ve Şeyh Zain al-Din ibn al-Muqqin gibi öğretmenlerin yanında eğitim aldı. Şeyh Zeyn el-Din ibn'in yanında eğitim aldı Levant'ta Rajab ve Halep'te El-Şihab bin el-Merhel'den dinledi. Zahiriyye Barkıkıya okulu ve diğerlerini öğretmek üzere atandı, İbn el-Mugli'nin yönetiminde görevlendirildi, etkiliydi, fetvalar verdi ve insanlara fayda sağladı. Tefsir, hadis, fıkıh ve ilkeler dahil olmak üzere İslami ilimlerde iyi bilgiliydi. Burhan al-Din bin Müflih Tebakatında şöyle demiştir: O, en önde gelen şeyhlerimizden biridir ve halefi Ala'ddin bin Mughli'nin ölümünden sonra Hanbali şeyhdiliği kuruldu. Müslümanlık üzerine kapsamlı bir tefsir, al-Muharrar iyi ve el-Furu üzerine notlar yazdı ve fetvalar üzerine kitabı bir sonuç niteliğindeydi. Hul'un (boşanma ve boşanma) geçerliliği üzerine fetvalar yayımladı. Kurnazdı ve sanığın el-Baynunah dönemindeki eylemleri nedeniyle boşanmadı. İyi görünüşüne ve prestijine rağmen, Mısır yargısında uzun süre bağımsızlığını korudu. 844 yılında, Cumedõl-Ahira'nın ortasında, Çarşamba sabahı, 170 yaş on aylıkken, iki gün hariç Kahire'de öldü. Oğlu Yusuf, ondan sonra Mansuriya ve Ashrafiyya'da öğretmenlik yapmaya başladı {cite:shadharat-dhahab, s. 250-251}."
  id: "Ketua Hakim Muhib al-Din Ibn Nasrallah al-Baghdadi, yang saat itu Hanbali Mesir, Sheikh Islam, ulama aliran Islam, dan Mufti Mesir; lahir di Baghdad pada pagi hari Sabtu, tanggal tujuh belas Rajab, tujuh ratus enam puluh lima. Ia belajar di sana dari ayahnya, Najm al-Din Abu Bakr ibn Qasim, Nur al-Din Ali ibn Ahmad al-Maqri, dan belajar hadits di sana. Kemudian ia datang ke Kairo bersama ayahnya dan belajar di bawah guru-guru seperti Siraj al-Din al-Bulqini, Zain al-Din al-Iraqi, Ibn al-Mulqin, dan Sheikh Zain al-Din ibn al-Muqqin. Ia belajar di bawah bimbingan Sheikh Zain al-Din ibn Rajab di Levant, dan di Aleppo ia mendengar dari Al-Shihab ibn al-Marhal. Ia ditunjuk untuk mengajar mazhab Zahiriyya Barquqiyya dan lainnya, diangkat dalam pemerintahan di bawah Ibn al-Mughli, berpengaruh dan mengeluarkan fatwa serta memberikan manfaat bagi masyarakat. Ia sangat menguasai ilmu Islam termasuk tafsir, hadis, fiqh, dan prinsip-prinsip. Burhan al-Din ibn Muflih berkata dalam Tabaqat-nya: Ia adalah salah satu sheikh terkemuka kita, dan sheikh Hanbali didirikan setelah kematian penerusnya, Ala' al-Din ibn Mughli. Ia menulis secara luas dalam komentar tentang Muslim, catatan tentang al-Muharrar sebagai baik dan al-Furu', dan bukunya tentang fatwa adalah kesimpulan. Ia mengeluarkan fatwa tentang keabsahan khul' (perceraian perceraian). Ia licik dan tidak bercerai karena tindakan terdakwa selama masa al-Baynunah. Meskipun penampilannya baik dan bergengsi, ia tetap independen dalam peradilan Mesir untuk waktu yang lama. Ia meninggal di Kairo pada pagi hari Rabu, pertengahan Jumada al-Akhirah tahun 844, pada usia 170 tahun sepuluh bulan, kecuali dua hari. Putranya Yusuf menetap setelahnya mengajar di Mansuriya dan Ashrafiyya {cite:shadharat-dhahab, hlm. 250-251}."
