gender: male
summary:
  ar: "قاضي القضاة محب الدين ابن نصر الله البغدادي ثم المصري الحنبلي شيخ الإسلام وعلم الأعلام شيخ المذهب ومفتي الديار المصرية؛ ولد ببغداد في ضحوة يوم السبت سابع عشر رجب سنة خمس وستين وسبعمائة وسمع بها من والده ومن نجم الدين أبي بكر بن قاسم ونور الدين علي بن أحمد المقري وعني بالحديث ثم قدم القاهرة مع والده وأخذ عن مشايخ منهم سراج الدين البلقيني وزين الدين العراقي وابن الملقن وأخذ عن الشيخ زين الدين بن رجب بالشام وسمع بحلب من الشهاب بن المرحل، وولي تدريس الظاهرية البرقوقية وغيرها وناب في الحكم عن ابن المغلي ونافذ وأفتى وانتفع به الناس وكان متضلعاً في العلوم الشرعية من تفسير وحديث وفقه وأصول، قال برهان الدين بن مفلح في طبقاته وهو من أجل مشايخنا وانتهت إليه مشيخة الحنابلة بعد موت مستخلفه علاء الدين بن مغلي، وله عمل كثير في شرح مسلم وحواش على المحرر حسنة وعلى الفروع وكتابه على الفتوى نهاية، وأفتى بصحة الخلع حيلة وعدم وقوع الطلاق بفعل المحاوف عليه في مزمن البينونة، وكان لا ينظر بإحدى عينيه مع حسن شكله وأبهته واستقل بقضاء مصر مدداً، وتوفي بالقاهرة صبيحة يوم الأربعاء النصف من جمادى الآخرة سنة أربع وأربعين وثمانمائة عن مائة وسبعين سنة وعشرة أشهر إلا يومين واستقر ولده يوسف بعده في تدريس المنصورية والأشرفية {cite:shadharat-dhahab p. 250-251}."
  en: "Ibn Nasr Allah (b. Baghdad 17 Rajab 765) — shaykh al-Islam, mufti of Egypt and head of the Hanbalis after Ibn Mughli, one-eyed and august; judge of Egypt for long stretches, author of a large work on Sharh Muslim and praised hawashi on al-Muharrar; died Cairo Wednesday mid-Jumada II 844 at 79 {cite:shadharat-dhahab p. 250-251}."
