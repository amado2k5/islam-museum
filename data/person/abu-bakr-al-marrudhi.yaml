summary:
  ar: "أحمد بن محمد بن الحجاج، أبو بكر المروذي ⁦(المروزي)⁩، عالم بالفقه والحديث وأجل أصحاب الإمام أحمد بن حنبل وخصيص بخدمته، روى عنه مسائل كثيرة وتولى إغماضه وغسله، وتوفي ببغداد في 6 جمادى الأولى سنة 275 هـ ⁦(888 م)⁩ ودفن إلى جانبه."
  en: "Ahmad ibn Muhammad ibn al-Hajjaj, Abu Bakr al-Marrudhi (al-Marwazi), a scholar of fiqh and hadith and one of the most eminent companions of Ahmad ibn Hanbal, devoted to his service; transmitted many of his questions, closed his eyes and washed his body, and died in Baghdad on 6 Jumada al-Ula 275 AH (888 CE), buried beside him."
