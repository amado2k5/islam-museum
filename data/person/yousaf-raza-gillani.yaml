summary:
  ar: "سياسي باكستاني (وُلد 1952)، رئيس وزراء باكستان من مارس 2008 إلى يونيو 2012، ورئيس الجمعية الوطنية (1993–1997)، ورئيس مجلس الشيوخ الباكستاني منذ 2024، وأول رئيس وزراء من العرقية السرائيكية، من أسرة غيلاني الملتانية من السادة."
  en: "Pakistani politician (born 1952), prime minister of Pakistan from March 2008 to June 2012, speaker of the National Assembly (1993–1997), chairman of the Senate of Pakistan since 2024, and the country's first ethnic Saraiki prime minister, of the Gillani family of Multan."
  ur: "پاکستانی سیاست دان (پیدائش 1952ء)، مارچ 2008ء سے جون 2012ء تک پاکستان کے وزیرِ اعظم، قومی اسمبلی کے اسپیکر (1993ء–1997ء)، 2024ء سے سینیٹ آف پاکستان کے چیئرمین، اور ملک کے پہلے سرائیکی وزیرِ اعظم، جن کا تعلق ملتان کے گیلانی خاندان سے ہے۔"
