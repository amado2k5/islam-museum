roles:
- muhaddith
gender: male
summary:
  ar: عبد المؤمن بن خلف الدمياطي، أبو محمد شرف الدين، حافظ للحديث من أكابر الشافعية، ولد بدمياط وتوفي فجأة في القاهرة سنة 705 هـ، صاحب «المعجم» و«كشف المغطى».
  en: Abd al-Mu'min ibn Khalaf al-Dimyati, Abu Muhammad, Sharaf al-Din, a hadith hafiz and one of the great Shafi'is; born at Damietta, he died suddenly in Cairo in 705 AH. Author of a 'Mu'jam' of his teachers and of 'Kashf al-Mughatta'.
  fr: "Abd al-Mu’min ibn Khalaf al-Dimyati, Abu Muhammad, Sharaf al-Din, hafiz du hadith et l’un des grands chaféites ; né à Damiette, il mourut subitement au Caire en 705 H. Auteur d’un Mu’jam de ses maîtres et de Kashf al-Mughatta."
  es: "Abd al-Mu'min ibn Khalaf al-Dimyati, Abu Muhammad, Sharaf al-Din, memorizador del hadiz y uno de los grandes shafiíes; nacido en Damietta, falleció repentinamente en El Cairo en el año 705 de la Hégira. Autor de un 'Mu'jam' de sus maestros y de 'Kashf al-Mughatta'."
  ur: "عبد المومن بن خلف الدمیاتی، ابو محمد، شرف الدین، ایک حافظ حدیث اور بڑے شافعیوں میں سے ایک؛ دمیتہ میں پیدا ہوئے اور 705 ہجری میں قاہرہ میں اچانک انتقال کر گئے۔ اپنے اساتذہ کے 'معجم' اور 'کشف المغطہ' کے مصنف۔"
  tr: "Abdülmümin ibn Halef el-Dumyati, Ebu Muhammed Şaraf el-Din, büyük Şafiî alimlerinden hadisleri ezberleyen bir kişiydi. Dumyati'de doğdu ve Hicri 705 yılında Kahire'de aniden vefat etti. \"El-Mu'cem\" ve \"Keşf el-Muğatta\" adlı eserlerin yazarıdır."
  id: "Abd al-Mu’min ibn Khalaf al-Dumyati, Abu Muhammad Sharaf al-Din, seorang penghafal hadits dari ulama-ulama besar mazhab Syafi'i, lahir di Dumyati dan meninggal mendadak di Kairo pada tahun 705 Hijriah. Beliau adalah penulis kitab “al-Mu’jam” dan “Kashf al-Mughatta”."
