label: { ar: "بيروز دهقان الأهواز", en: "Piruz, Dahqan of al-Ahwaz", es: "Piruz, Dahqan of al-Ahwaz", fr: "Piruz, Dahqan of al-Ahwaz", ur: "پیروز، الاہواز کا دہقان" }
summary:
  ar: "بيروز دهقان سوق الأهواز؛ قاتله المغيرة بن شعبة ثم صالحه على مال ثم نكث فافتتح أبو موسى المدينة عنوة سنة ١٧."
  en: "Piruz, dahqan of Suq al-Ahwaz; he fought al-Mughira ibn Shu'ba, truced on money, broke, and Abu Musa took the town by force in 17h."
  es: "Piruz, dahqan de Suq al-Ahwaz; luchó contra al-Mughira ibn Shu'ba, pagó una tregua por dinero, se quebró y Abu Musa tomó la ciudad por la fuerza en el año 17."
  fr: "Piruz, dahqan de Suq al-Ahwaz; il combattit al-Mughira ibn Shu'ba, fit une trêve sur l'argent, rompit les liens, et Abu Musa prit la ville par la force en 17 h."
  ur: "پیروز، صق الاحواز کا دہقان؛ اس نے مغیرہ بن شعبہ سے جنگ کی، رقم پر صلح کر لی، ٹوٹ گیا اور ابو موسیٰ نے 17ھ میں اس شہر پر زبردستی قبضہ کر لیا۔"
  tr: "Ahvaz pazarının çiftçisi Piruz; el-Muğira bin Şu'ba tarafından öldürüldü, sonra para yüzünden barıştı, ardından sözünü bozdu ve Ebu Musa 17. yılında Medine'yi zorla fethetti."
  id: "Piruz, petani pasar Ahvaz; ia dibunuh oleh al-Mughira ibn Shu'ba, lalu berdamai dengannya soal uang, lalu melanggar janjinya, dan Abu Musa secara paksa menaklukkan Madinah pada tahun 17."
