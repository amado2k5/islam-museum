label:
  ar: أدفنش ملك قشتالة (الطاغية)
  en: Alfonso XI of Castile
summary:
  ar: "أدفنش صاحب قشتالة، المسمى في كتب المغاربة بالطاغية؛ لقي السلطان أبا الحسن المريني في حرب طريف فتغلب أسطوله على بحر الزقاق وقطع المرافق عن معسكر المسلمين، واحتشد إليه أمم النصرانية وظاهره البرتغال صاحب أشبونة فجاء معه في قومه، ودسّ إلى طريف جيشاً كميناً فلما نشبت الحرب انهزم معسكر المغرب والأندلس هزيمة عظيمة سنة 741هـ، واستولى على حظايا السلطان وذخائره."
  en: "Alfonso of Castile, called al-Taghiya in the Maghrebi chronicles; facing Sultan Abu al-Hasan al-Marini in the Tarifa campaign, his fleet won the Strait and cut the Muslim camp's supply, he gathered the Christian nations with Afonso of Portugal beside him, slipped a hidden force into Tarifa by night, and when battle joined in 741 the combined Maghreb-Andalus host broke in a great rout — the sultan's women and treasure falling into his hands."
