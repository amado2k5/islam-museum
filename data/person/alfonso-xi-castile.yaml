id: person/alfonso-xi-castile
class: person
label:
  ar: أدفنش ملك قشتالة ⁦(الطاغية)⁩
  en: Alfonso XI of Castile
  fr: "Alfonso XI of Castile"
  es: "Alfonso XI of Castile"
  ur: "کاسٹائل کے الفانسو XI"
summary:
  ar: "أدفنش صاحب قشتالة، المسمى في كتب المغاربة بالطاغية؛ لقي السلطان أبا الحسن المريني في حرب طريف فتغلب أسطوله على بحر الزقاق وقطع المرافق عن معسكر المسلمين، واحتشد إليه أمم النصرانية وظاهره البرتغال صاحب أشبونة فجاء معه في قومه، ودسّ إلى طريف جيشاً كميناً فلما نشبت الحرب انهزم معسكر المغرب والأندلس هزيمة عظيمة سنة 741هـ، واستولى على حظايا السلطان وذخائره."
  en: "Alfonso of Castile, called al-Taghiya in the Maghrebi chronicles; facing Sultan Abu al-Hasan al-Marini in the Tarifa campaign, his fleet won the Strait and cut the Muslim camp's supply, he gathered the Christian nations with Afonso of Portugal beside him, slipped a hidden force into Tarifa by night, and when battle joined in 741 the combined Maghreb-Andalus host broke in a great rout — the sultan's women and treasure falling into his hands."
  fr: "Alphonse de Castille, appelé al-Taghiya dans les chroniques maghrébines  ; face au sultan Abu al-Hasan al-Marini dans la campagne de Tarifa, sa flotte gagna le détroit et coupa l'approvisionnement du camp musulman, il rassembla les nations chrétiennes avec Afonso du Portugal à ses côtés, glissa une force cachée dans Tarifa de nuit, et quand la bataille a rejoint en 741 l'hôte combiné Maghreb-Andalousie a éclaté dans une grande déroute - les femmes du sultan et le trésor tombant entre ses mains."
  es: "Alfonso de Castilla, llamado al-Taghiya en las crónicas magrebíes, se enfrentó al sultán Abu al-Hasan al-Marini en la campaña de Tarifa. Su flota conquistó el estrecho y cortó el suministro del campamento musulmán, reunió a las naciones cristianas con Alfonso de Portugal a su lado, introdujo una fuerza oculta en Tarifa durante la noche, y cuando se entabló la batalla en 741, el ejército combinado del Magreb y Al-Ándalus se desmoronó en una gran derrota, y las mujeres y el tesoro del sultán cayeron en sus manos."
  ur: "کاسٹائل کا الفانسو، جسے مغرب کی تاریخ میں الطاغیہ کہا جاتا ہے۔ طاریفا مہم میں سلطان ابو الحسن المرینی کا سامنا تھا، اس کے بحری بیڑے نے آبنائے پر فتح حاصل کی اور مسلمانوں کے کیمپ کی سپلائی کاٹ دی، اس نے عیسائی قوموں کو پرتگال کے افونسو کے ساتھ اپنے پاس جمع کیا، رات کو ایک چھپی ہوئی فوج کو طاریفا میں گھسایا، اور جب 741 میں جنگ ہوئی تو مغرب کے ایک عظیم الشان میزبان نے مشترکہ رومیوں کو شکست دی۔ عورتیں اور خزانہ اس کے ہاتھوں میں گرنا۔"
