id: person/dukhtanus-bint-al-numan
class: person
label: { ar: "دختنوس بنت النعمان" }
summary:
  ar: "دختنوس ابنة النعمان بن المنذر صاحب الحيرة، امرأة لقيط بن زرارة التميمي؛ لما قتل لقيط يوم شعب جبلة وضربته بنو عبس وهو ميت قالت «لقد ضربوا وجهاً عليه مهابة... فلو أنكم لقيتم لقيطاً صبرتم للأسنة والقنا»، وكان لقيط يترثاها عند موته «يا ليت شعري عنك دختنوس إذا أتاها خبر المرموس» {cite:ansab-al-ashraf p. 30-31}."
  en: "Dukhtanus, the Lakhmid princess daughter of al-Nu'man ibn al-Mundhir, wife of Laqit ibn Zurara; hearing how Banu Abs struck her husband's corpse she answered with the famous taunt-elegy {cite:ansab-al-ashraf p. 30-31}."
  es: "Dukhtanus, la princesa Lakhmid, hija de al-Nu'man ibn al-Mundhir, esposa de Laqit ibn Zurara; al oír cómo Banu Abs golpeó el cadáver de su marido, respondió con la famosa elegía de burla {cite:ansab-al-ashraf p. 30-31}."
  fr: "Dukhtanus, la princesse Lakhmid, fille d'al-Nu'man ibn al-Mundhir, épouse de Laqit ibn Zurara; apprenant comment Banu Abs a frappé le cadavre de son mari, elle a répondu par la célèbre élégie railleuse {cite:ansab-al-ashraf p. 30-31}."
  ur: "دختنوس، لقط بن زرارہ کی بیوی النعمان بن المنذر کی لخمی شہزادی بیٹی؛ یہ سن کر کہ بنو عباس نے اپنے شوہر کی لاش کو کس طرح مارا تھا، اس نے مشہور طعن و تشنیع کے ساتھ جواب دیا۔ 30-31}۔"
  tr: "Dakhtanus, el-Hirah'ın hükümdarı el-Nu'man ibn el-Mundhir'in kızı, Laqit ibn Zurara el-Tamimi'nin eşi, Laqit Şa'b Cibla günü öldürüldüğünde ve Banu Abs tarafından ölüyken vurulduğunda, 'Bir yüze hayranlıkla çarptılar...' dedi. Bir ile karşılaşsaydın, mızraklara ve mızraklara sabırlı olurdun.' Bir onun ölümünde yas tutardı: 'Keşke ölen haberini aldığında seni düşünebilseydim Dakhtnus.' {alıntı:ansab-al-ashraf, s. 30-31}."
  id: "Dakhtanus, putri al-Nu'man ibn al-Mundhir, penguasa al-Hirah, istri Laqit ibn Zurara al-Tamimi, ketika Laqit dibunuh pada hari Sha'b Jibla dan dibunuh oleh Banu Abs saat ia mati, berkata, 'Mereka telah memukul wajah dengan rasa takdih...' Jika kau bertemu, kau akan bersabar dengan tombak dan tombak.' Seorang akan meratapi dia saat kematiannya: 'Andai saja aku bisa memikirkan kau Dakhtnus saat menerima kabar tentang almarhum.' {cite:ansab-al-ashraf, hlm. 30-31}."
