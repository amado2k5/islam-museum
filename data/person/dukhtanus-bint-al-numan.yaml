summary:
  ar: "دختنوس ابنة النعمان بن المنذر صاحب الحيرة، امرأة لقيط بن زرارة التميمي؛ لما قتل لقيط يوم شعب جبلة وضربته بنو عبس وهو ميت قالت «لقد ضربوا وجهاً عليه مهابة... فلو أنكم لقيتم لقيطاً صبرتم للأسنة والقنا»، وكان لقيط يترثاها عند موته «يا ليت شعري عنك دختنوس إذا أتاها خبر المرموس» {cite:ansab-al-ashraf p. 30-31}."
  en: "Dukhtanus, the Lakhmid princess daughter of al-Nu'man ibn al-Mundhir, wife of Laqit ibn Zurara; hearing how Banu Abs struck her husband's corpse she answered with the famous taunt-elegy {cite:ansab-al-ashraf p. 30-31}."
