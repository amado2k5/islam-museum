summary:
  ar: "عالم وفقيه مغربي، وُلد سنة 1953 بقرية أولاد سلطان قرب القصر الكبير. درس الشريعة في جامعة القرويين ثم أصول الفقه ومقاصد الشريعة في جامعة محمد الخامس، ودرّس فيهما، وأسس رابطة المستقبل الإسلامي ثم ترأس حركة التوحيد والإصلاح (1996–2003)، وكان عضوًا مؤسسًا للاتحاد العالمي لعلماء المسلمين فترأسه من 2018 حتى استقالته سنة 2022 إثر تصريحاته عن وجود موريتانيا. عُرف بكتابه «نظرية المقاصد عند الإمام الشاطبي»."
  en: "Moroccan Muslim scholar and jurist, born in 1953 in the village of Ouled Soltane near Ksar el-Kebir. He studied Sharia at the University of al-Qarawiyyin and then usul al-fiqh and the higher objectives of the law at Mohammed V University, where he taught; he founded the Islamic Future Association and headed the Movement of Unity and Reform (1996–2003), and was a founding member of the International Union of Muslim Scholars, presiding over it from 2018 until his resignation in 2022 after his remarks on Mauritania's existence. He is known for his book on Imam al-Shatibi's theory of the higher objectives of Islamic law."
  ur: "مراکشی مسلمان عالم اور فقیہ، 1953ء میں القصر الکبیر کے قریب گاؤں اولاد سلطان میں پیدا ہوئے۔ انھوں نے جامعہ قرویین میں شریعت اور جامعہ محمد خامس میں اصولِ فقہ اور مقاصدِ شریعت کی تعلیم حاصل کی اور وہیں تدریس کی؛ رابطۂ مستقبلِ اسلامی کی بنیاد رکھی اور حرکتِ توحید و اصلاح کی قیادت کی (1996ء–2003ء)، اور عالمی اتحاد برائے مسلم علما کے بانی رکن رہے اور 2018ء سے 2022ء میں موریتانیہ کے وجود پر اپنے بیانات کے بعد استعفے تک اس کے صدر رہے۔ وہ امام شاطبی کے نظریۂ مقاصد پر اپنی کتاب کے لیے معروف ہیں۔"
