    basis: documented
    note: "Said was not a Muslim, and nothing in this record presents him as one; he stands in the founder's century list as a major Palestinian intellectual whose life and work belong to the history of the modern Muslim world. His Christian identity is attested by two independent sources: the English Wikipedia article records that he was born into a family of Palestinian Christians, that both his parents were Arab Christians adhering to Protestantism, and that he was raised Protestant (his Jerusalem schooling was at the Anglican St George's School, and he was buried in a Protestant cemetery); and Encyclopaedia Britannica calls him outright 'an Arab Christian'. His adult position is recorded just as plainly: the English article states that although raised Protestant he became an agnostic in his later years, and the scholars Adel Iskander and Hakem Rustom, quoted in its references, describe him as 'of Christian background, a confirmed agnostic, perhaps even an atheist'. The segment records the documented Christian upbringing and identity, following the precedent of person/leopold-sedar-senghor; the later agnosticism is carried here and in the prose, not hidden."
