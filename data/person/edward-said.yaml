summary:
  ar: "ناقد أدبي ومفكر فلسطيني-أمريكي، وُلد في القدس سنة 1935 في أسرة مسيحية بروتستانتية، ودرّس الأدب الإنجليزي والمقارن في جامعة كولومبيا أربعة عقود، وأسس بكتابه «الاستشراق» (1978) دراسات ما بعد الاستعمار، ودافع عن الحقوق الفلسطينية في العالم، وتوفي في نيويورك سنة 2003. وهو مدرج في هذا المتحف بوصفه مفكرًا فلسطينيًا كبيرًا من مفكري عالم الإسلام الحديث، لا بوصفه مسلمًا."
  en: "Palestinian-American literary critic and public intellectual, born in Jerusalem in 1935 into a Protestant Christian family. He taught English and comparative literature at Columbia University for four decades, founded postcolonial studies with Orientalism (1978), and argued the Palestinian case before the world; he died in New York in 2003. He is included as a major Palestinian intellectual of the modern Muslim world — not as a Muslim."
  ur: "فلسطینی نژاد امریکی ادبی نقاد اور دانشور، جو 1935 میں یروشلم کے ایک پروٹسٹنٹ مسیحی گھرانے میں پیدا ہوئے؛ کولمبیا یونیورسٹی میں چار دہائیوں تک انگریزی و تقابلی ادب پڑھایا، «استشراق» (1978) سے مابعد نوآبادیاتی مطالعات کی بنیاد رکھی اور دنیا بھر میں فلسطینی حقوق کی وکالت کی؛ 2003 میں نیویارک میں وفات پائی۔ وہ اس میوزیم میں عالمِ اسلام کے ایک بڑے فلسطینی مفکر کے طور پر شامل ہیں — مسلمان کے طور پر نہیں۔"
