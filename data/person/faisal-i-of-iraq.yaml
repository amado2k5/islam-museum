summary:
  ar: "فيصل الأول بن الحسين (20 مايو 1885 – 8 سبتمبر 1933)، ثالث أبناء الشريف حسين بن علي، وقائد الجيش الشمالي في الثورة العربية الكبرى (1916–1918) الذي دخل دمشق في أكتوبر 1918 وقاد الوفد العربي في مؤتمر باريس للسلام سنة 1919 ووقّع اتفاقًا مع حاييم وايزمان. نادى به المؤتمر السوري العام ملكًا على المملكة العربية السورية في 8 مارس 1920، فأزاحه الفرنسيون بعد معركة ميسلون في 24 يوليو 1920؛ ثم صار ملكًا على العراق في 23 أغسطس 1921 برعاية بريطانية، ورعى الوحدة بين السنة والشيعة وسياسة عربية جامعة، وأشرف على استقلال العراق ودخوله عصبة الأمم سنة 1932، وتوفي بأزمة قلبية في برن فخلفه ابنه غازي."
  en: "Faisal I bin Hussein (20 May 1885 – 8 September 1933) was the third son of Sharif Hussein bin Ali and commander of the Northern Army in the Great Arab Revolt (1916–1918), who entered Damascus in October 1918, led the Arab delegation at the Paris Peace Conference in 1919 and signed an agreement with Chaim Weizmann. Proclaimed King of the Arab Kingdom of Syria by the Syrian National Congress on 8 March 1920, he was expelled by the French after the Battle of Maysalun on 24 July 1920; he then became King of Iraq on 23 August 1921 under British sponsorship, fostered unity between Sunni and Shia Muslims in a pan-Arab policy, presided over Iraq's independence and entry into the League of Nations in 1932, and died of a heart attack at Bern, succeeded by his son Ghazi."
  ur: "فیصل اول بن حسین (20 مئی 1885ء – 8 ستمبر 1933ء) شریف حسین بن علی کے تیسرے بیٹے اور ثورۂ عربیہ کبریٰ (1916ء–1918ء) میں شمالی فوج کے سالار تھے؛ اکتوبر 1918ء میں دمشق میں داخل ہوئے، 1919ء میں پیرس امن کانفرنس میں عرب وفد کی قیادت کی اور حائیم وائزمین سے معاہدہ کیا۔ 8 مارچ 1920ء کو سوری قومی کانگریس نے انہیں مملکتِ عربیہ سوریہ کا بادشاہ قرار دیا، مگر میسلون کی لڑائی (24 جولائی 1920ء) کے بعد فرانسیسیوں نے انہیں نکال دیا؛ پھر 23 اگست 1921ء کو برطانوی سرپرستی میں عراق کے بادشاہ بنے، سنی و شیعہ اتحاد اور پان عرب پالیسی کو فروغ دیا، 1932ء میں عراق کی آزادی کی نگرانی کی، اور برن میں دل کے دورے سے وفات پائی؛ جانشین ان کے بیٹے غازی ہوئے۔"
