summary:
  ar: "عز الدين القيلوي نزيل القاهرة الحنفي الإمام العلامة؛ ولد سنة ثمانين وسبعمائة تقريباً بالجانب الشرقي من بغداد وقرأ بها القرآن برواية عاصم وحفظ كتباً في الفقه والأصول والنحو والمعاني فأكثر من المحفوظات جداً ثم سمع البخاري على الشيخ محمد بن الجاردي وأخذ عنه فقه الحنابلة وبحث في فقه الشافعية أيضاً ثم تحنف وأخذ الأصول عن الشيخ أحمد الدواليبي والنحو عن الشيخ أحمد بن المقداد والطب عن الموفق الهمذاني والفرائض عن الشيخ عبد القادر الواسطي، ثم ارتحل إلى العجم لما نجاه الله من فتنة تيمورلنك العظمى فلازم ضياء الدين الهروي الحنفي وأخذ عنه فقه الحنفية بعد أن حفظ مجمع البحرين ثم ارتحل إلى أرزنجان من بلاد الروم فأخذ التصوف عن الشيخ بار علي السيواسي ثم دخل بلاد الشام وحلب وبيت المقدس فاجتمع بالقدوة العلامة شهاب الدين ابن الهايم ثم رحل إلى القاهرة فأخذ الحديث عن الولي العراقي والجمال الحنفي الجندي والشمس الشامي وهذه الطبقة فأكثر جداً ودرس بالقاهرة بعدة أماكن ولازمه الناس وانتفعوا به جداً، وهو رجل خير زاهد مؤثر للانقطاع عن الناس والعفة والتقنع بزراعات يزرعها ولم يحصل له أنصاف من رؤساء الزمان في أمر الدنيا وعنده رياضة زائدة وصبر على أشغال الناس له واحتمال جفاهم ولم يعتن بالتصنيف، وتوفي في رمضان سنة تسع وخمسين وثمانمائة بالقاهرة وقد تجاوز الثمانين {cite:shadharat-dhahab p. 294-295}."
  en: "Al-Qaylawi (b. Baghdad's east side ~780) — the survivor of Timur's sack who fled to 'Ajam, learned Hanafi fiqh from al-Harawi, took tasawwuf from Bar 'Ali al-Siwasi at Erzincan, sat with Ibn al-Ha'im at Jerusalem, and settled at Cairo as a sowing ascetic 'patient under people's burdens' who never sought office; died Ramadan 859 past eighty {cite:shadharat-dhahab p. 294-295}."
  fr: "Al-Qaylawi (b780) – le survivant du sac de Timur qui s’est enfui à ‘Ajam, a appris le fiqh Hanafi d’al-Harawi, a pris le tasawwuf de Bar ‘Ali al-Siwasi à Erzincan, s’est assis avec Ibn al-Ha’im à Jérusalem et s’est installé au Caire comme un « patient  » semant l’astique. mort Ramadan 859 passé quatre-vingts {cite:shadharat-dhahab p. 294-295}."
  es: "Al-Qaylawi (n. lado este de Bagdad ~780) — el superviviente del saqueo de Timur que huyó a 'Ajam, aprendió fiqh hanafi de al-Harawi, tomó tasawwuf de Bar 'Ali al-Siwasi en Erzincan, se sentó con Ibn al-Ha'im en Jerusalén y se estableció en El Cairo como un asceta sembrador 'paciente bajo las cargas de la gente' que nunca buscó un cargo; murió en Ramadán de 859 pasado los ochenta {cite:shadharat-dhahab p. 294-295}."
  ur: "القیلوی ⁦(بغداد کا مشرق کی طرف ~ 780)⁩ - تیمور کی بوری سے بچ جانے والا جو عجم کی طرف بھاگا، الحروی سے حنفی فقہ سیکھا، ایرزنکن میں بار علی السیواسی سے تصوف لیا، ابن الحیثم کے ساتھ بیٹھا اور قیصر کے مقام پر بیٹھا۔ 'لوگوں کے بوجھ تلے دبے مریض' جنہوں نے کبھی دفتر نہیں ڈھونڈا۔ رمضان المبارک کی وفات 859بجے اسّی {حوالہ:شدارت ذہاب ص۔ 294-295}۔"
  tr: "Kahire Hanefi sakini ve bilgili imam İzzeddin el-Qaylawi; yaklaşık yedi yüz seksen yıl sonra Bağdat'ın doğu tarafında doğdu ve Asim'in rivayetine göre orada Kur'an'ı çalıştı. Fıkıh, ilkeler, dilbilgisi ve anlamlar üzerine birçok ezberlenmiş eser ezberledi. Daha sonra Şeyh Muhammed bin el-Cerdi'den el-Buhari dinledi ve ondan Hanbali fıkıhı inceledi, Şafii fıkıhını da araştırdı. Daha sonra Hanefi fıkıhı ve temelleri Şeyh Ahmed el-Davalibi'den, dilbilgisi Şeyh Ahmed bin el-Miqdad'dan, tıpı el-Muwaffaq el-Hamadhani'den, miras kanunlarını Şeyh Abdul Kadir el-Vasiti'den öğrendi, ardından Tanrı onu Büyük Timur'un büyük ayartmasından kurtardığında Perslere doğru yola çıktı. Diaa al-Din el-Haravi el-Hanafi'yi takip etti ve Bahreyn Akademisi'ni ezberledikten sonra ondan Hanefi fıkıhı öğrendi. Daha sonra Romalıların topraklarındaki Erzincan'a giderek Şeyh Bar Ali el-Siwasi'den tasavvuf eğitimi aldı. Daha sonra Şam, Halep ve Kudüs'e girdi ve burada rol model alim Şihabeddin İbn el-Hayem ile tanıştı. Daha sonra Kahire'ye giderek Irak azizi El-Cemal-Hanafi, el-Cundi ve el-Şems el-Şems'ten hadis öğrendi. Kahire'de çeşitli yerlerde eğitim aldı ve onunla kaldı. İnsanlar ondan büyük fayda sağladı. O, insanlardan uzaklaşan, iffetini arındıran ve yetiştirdiği ürünlerle yetinen iyi, münzevi, etkili bir insandı. Zamanının liderlerinden dünyevi işlerin yarısını almaz, aşırı spor yapar, insanların işlerine sabırlıydı, onların kuruluğuna katlanırdı ve yazıya dikkat etmezdi. Kahire'de sekiz yüz elli dokuz yılında, seksen yaşını aşarak Ramazan'da vefat etti {atıf:shadharat-dhahab, s. 294-295}."
  id: "Izz al-Din al-Qaylawi, penduduk Kairo Hanafi dan Imam yang terpelajar; ia lahir sekitar tujuh ratus delapan puluh tahun di sisi timur Baghdad dan mempelajari Al-Qur'an di sana sesuai dengan riwayat Asim. Ia menghafal buku-buku tentang firih, prinsip, tata bahasa, dan makna, termasuk banyak karya yang dihafal. Ia kemudian mendengar al-Bukhari dari Sheikh Muhammad ibn al-Jardi dan mempelajari hukum Hanbali darinya, juga meneliti fiqhtur Shafi'i. Kemudian ia mempelajari fiqhèn Hanafi dan meneliti dasar-dasar dari Sheikh Ahmad al-Dawalibi, tata bahasa dari Sheikh Ahmad ibn al-Miqdad, kedokteran dari al-Muwaffaq al-Hamadhani, hukum warisan dari Sheikh Abdul Qadir al-Wasiti, kemudian Ia melakukan perjalanan ke Persia ketika Tuhan menyelamatkannya dari godaan besar Timur yang Agung. Ia mengikuti Diaa al-Din al-Harawi al-Hanafi dan mempelajari hukum Hanafi darinya setelah menghafal Akademi Bahrain. Ia kemudian pergi ke Erzincan di tanah Romawi, di mana ia mempelajari Sufisme dari Sheikh Bar Ali al-Siwasi. Ia kemudian memasuki Levant, Aleppo, dan Yerusalem, di mana ia bertemu dengan ulama teladan Shihab al-Din Ibn al-Hayem. Ia kemudian pergi ke Kairo, di mana ia mempelajari hadis dari wali Irak, Al-Jamal al-Hanafi, al-Jundi, dan al-Shams al-Shams, di antara banyak lainnya. Ia belajar di Kairo di beberapa tempat dan tinggal bersamanya. Orang-orang sangat diuntungkan darinya. Dia adalah pria yang baik, asketik, berpengaruh yang menarik diri dari orang-orang, memurnikan kesucian, dan puas dengan tanaman yang dia tanam. Dia tidak menerima setengah dari urusan duniawi dari para pemimpin zamannya, memiliki olahraga berlebihan, sabar dengan urusan orang, dan menahan kekeringan mereka, dan tidak memperhatikan menulis. Dia meninggal pada bulan Ramadan tahun delapan ratus lima puluh sembilan di Kairo, setelah melebihi delapan puluh {cite:shadharat-dhahab, hlm. 294-295}."
