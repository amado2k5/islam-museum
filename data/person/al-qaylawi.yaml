summary:
  ar: "عز الدين القيلوي نزيل القاهرة الحنفي الإمام العلامة؛ ولد سنة ثمانين وسبعمائة تقريباً بالجانب الشرقي من بغداد وقرأ بها القرآن برواية عاصم وحفظ كتباً في الفقه والأصول والنحو والمعاني فأكثر من المحفوظات جداً ثم سمع البخاري على الشيخ محمد بن الجاردي وأخذ عنه فقه الحنابلة وبحث في فقه الشافعية أيضاً ثم تحنف وأخذ الأصول عن الشيخ أحمد الدواليبي والنحو عن الشيخ أحمد بن المقداد والطب عن الموفق الهمذاني والفرائض عن الشيخ عبد القادر الواسطي، ثم ارتحل إلى العجم لما نجاه الله من فتنة تيمورلنك العظمى فلازم ضياء الدين الهروي الحنفي وأخذ عنه فقه الحنفية بعد أن حفظ مجمع البحرين ثم ارتحل إلى أرزنجان من بلاد الروم فأخذ التصوف عن الشيخ بار علي السيواسي ثم دخل بلاد الشام وحلب وبيت المقدس فاجتمع بالقدوة العلامة شهاب الدين ابن الهايم ثم رحل إلى القاهرة فأخذ الحديث عن الولي العراقي والجمال الحنفي الجندي والشمس الشامي وهذه الطبقة فأكثر جداً ودرس بالقاهرة بعدة أماكن ولازمه الناس وانتفعوا به جداً، وهو رجل خير زاهد مؤثر للانقطاع عن الناس والعفة والتقنع بزراعات يزرعها ولم يحصل له أنصاف من رؤساء الزمان في أمر الدنيا وعنده رياضة زائدة وصبر على أشغال الناس له واحتمال جفاهم ولم يعتن بالتصنيف، وتوفي في رمضان سنة تسع وخمسين وثمانمائة بالقاهرة وقد تجاوز الثمانين {cite:shadharat-dhahab p. 294-295}."
  en: "Al-Qaylawi (b. Baghdad's east side ~780) — the survivor of Timur's sack who fled to 'Ajam, learned Hanafi fiqh from al-Harawi, took tasawwuf from Bar 'Ali al-Siwasi at Erzincan, sat with Ibn al-Ha'im at Jerusalem, and settled at Cairo as a sowing ascetic 'patient under people's burdens' who never sought office; died Ramadan 859 past eighty {cite:shadharat-dhahab p. 294-295}."
