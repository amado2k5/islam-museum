summary:
  ar: "عالم جيولوجيا وداعية مصري (1933–2025)، تخرج في كلية العلوم بجامعة القاهرة ونال الدكتوراه من جامعة ويلز سنة 1963، ودرّس الجيولوجيا في جامعات عربية عدة، ورأس لجنة الإعجاز العلمي للقرآن في المجلس الأعلى للشؤون الإسلامية بمصر، واشتهر بالكتابة والمحاضرة في الإعجاز العلمي في القرآن والسنة، وتوفي في عمّان."
  en: "Egyptian geologist and preacher (1933–2025) who graduated from Cairo University's Faculty of Science, took his doctorate at the University of Wales in 1963, taught geology at several Arab universities, chaired the committee on scientific miracles of the Qur'an at Egypt's Supreme Council for Islamic Affairs, became widely known for writing and lecturing on 'scientific miracles' in the Qur'an and Sunna, and died in Amman."
  ur: "مصری ماہرِ ارضیات اور داعی (1933–2025)، جو جامعہ قاہرہ کے کلیۂ سائنس سے فارغ ہوئے، 1963 میں یونیورسٹی آف ویلز سے ڈاکٹریٹ کی، کئی عرب جامعات میں ارضیات پڑھائی، مصر کی مجلسِ اعلیٰ برائے اسلامی امور کی قرآنی سائنسی اعجاز کمیٹی کے سربراہ رہے، قرآن و سنت میں «سائنسی اعجاز» پر تحریر و تقریر سے مشہور ہوئے، اور عمان میں وفات پائی۔"
  es: "Geólogo y predicador egipcio (1933-2025) que se graduó en la Facultad de Ciencias de la Universidad de El Cairo, obtuvo su doctorado en la Universidad de Gales en 1963, enseñó geología en varias universidades árabes, presidió el comité sobre milagros científicos del Corán en el Consejo Supremo de Asuntos Islámicos de Egipto, se hizo ampliamente conocido por escribir y dar conferencias sobre \"milagros científicos\" en el Corán y la Sunna, y murió en Amán."
  fr: "Géologue et prédicateur égyptien (1933-2025), diplômé de la faculté des sciences de l'université du Caire, a obtenu son doctorat à l'université de Galles en 1963, a enseigné la géologie dans plusieurs universités arabes, a présidé le comité sur les miracles scientifiques du Coran au Conseil suprême des affaires islamiques d'Égypte, est devenu largement connu pour ses écrits et ses conférences sur les « miracles scientifiques » du Coran et de la Sunna, et est décédé à Amman."
  tr: "Mısırlı jeolog ve vaiz (1933–2025) olan Sher, Kahire Üniversitesi Fen Fakültesi'nden mezun oldu ve 1963'te Galler Üniversitesi'nden doktora derecesi aldı. Birçok Arap üniversitesinde jeoloji okudu, Mısır'daki İslami İşler Yüksek Konseyi'nde Kur'an'ın Bilimsel Mucizeleri Komitesi'ne başkanlık etti ve Kur'an ile Sünnet'in bilimsel mucizeleri üzerine yazıp konferanslar vermesiyle tanındı. Amman'da hayatını kaybetti."
  id: "Sebagai ahli geologi dan pengkhotbah Mesir (1933–2025), ia lulus dari Fakultas Sains di Universitas Kairo dan meraih gelar doktor dari Universitas Wales pada tahun 1963. Ia belajar geologi di beberapa universitas Arab, memimpin Komite Mukjizat Ilmiah Al-Quran di Dewan Tertinggi Urusan Islam di Mesir, dan dikenal karena menulis dan memberi kuliah tentang mukjizat ilmiah Al-Qur'an dan Sunnah. Ia meninggal di Amman."
