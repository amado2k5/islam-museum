summary:
  ar: "عالم جيولوجيا وداعية مصري (1933–2025)، تخرج في كلية العلوم بجامعة القاهرة ونال الدكتوراه من جامعة ويلز سنة 1963، ودرّس الجيولوجيا في جامعات عربية عدة، ورأس لجنة الإعجاز العلمي للقرآن في المجلس الأعلى للشؤون الإسلامية بمصر، واشتهر بالكتابة والمحاضرة في الإعجاز العلمي في القرآن والسنة، وتوفي في عمّان."
  en: "Egyptian geologist and preacher (1933–2025) who graduated from Cairo University's Faculty of Science, took his doctorate at the University of Wales in 1963, taught geology at several Arab universities, chaired the committee on scientific miracles of the Qur'an at Egypt's Supreme Council for Islamic Affairs, became widely known for writing and lecturing on 'scientific miracles' in the Qur'an and Sunna, and died in Amman."
  ur: "مصری ماہرِ ارضیات اور داعی (1933–2025)، جو جامعہ قاہرہ کے کلیۂ سائنس سے فارغ ہوئے، 1963 میں یونیورسٹی آف ویلز سے ڈاکٹریٹ کی، کئی عرب جامعات میں ارضیات پڑھائی، مصر کی مجلسِ اعلیٰ برائے اسلامی امور کی قرآنی سائنسی اعجاز کمیٹی کے سربراہ رہے، قرآن و سنت میں «سائنسی اعجاز» پر تحریر و تقریر سے مشہور ہوئے، اور عمان میں وفات پائی۔"
