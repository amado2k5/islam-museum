summary:
  ar: "قاضٍ ودبلوماسي ووزير هندي (1900–1981)، رئيس قضاة محكمة بومباي العالية من 1947 إلى 1958، ثم سفير بلاده لدى الولايات المتحدة (1958–1961) ومفوضها السامي لدى المملكة المتحدة (1962–1963). دخل الحكومة المركزية وزيرا للتعليم (1963–1966) ثم تولى الشؤون الخارجية (1966–1967). سيرته الذاتية «ورود في ديسمبر» (1973) من كلاسيكيات الحياة القانونية الهندية؛ وكان ناقدا صريحا لحالة الطوارئ."
  en: "Indian jurist, diplomat and minister (1900–1981), chief justice of the Bombay High Court from 1947 to 1958, then ambassador to the United States (1958–1961) and high commissioner to the United Kingdom (1962–1963). He entered the Union cabinet as minister of education (1963–1966) and served as minister of external affairs (1966–1967). His autobiography, Roses in December (1973), remains a classic of Indian legal life; he was an outspoken critic of the Emergency."
  ur: "ہندوستانی قاضی، سفارت کار اور وزیر (1900ء–1981ء)، 1947ء سے 1958ء تک بومبے ہائی کورٹ کے چیف جسٹس، پھر امریکا میں سفیر (1958ء–1961ء) اور برطانیہ میں ہائی کمشنر (1962ء–1963ء)۔ مرکزی کابینہ میں وزیرِ تعلیم (1963ء–1966ء) بنے اور وزیرِ خارجہ (1966ء–1967ء) رہے۔ ان کی خود نوشت «روزز اِن ڈسمبر» (1973ء) ہندوستانی قانونی زندگی کی کلاسیک تصانیف میں شمار ہوتی ہے؛ وہ ایمرجنسی کے صریح ناقد تھے۔"
