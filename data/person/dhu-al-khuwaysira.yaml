summary:
  en: "A man of Banu Tamim (identified as Hurqus ibn Zuhayr al-Sa'di) who brazenly challenged the Prophet during the distribution of spoils at al-Ji'rana, saying 'Act justly, for you have not acted justly'; the Prophet rebuked him and foretold that from his progeny would emerge a sect that passes out of religion (the Kharijites)."
  ar: "رجل من بني تميم (هو حرقوص بن زهير السعدي) واجه النبي بوقاحة في قسمة الجعرانة قائلاً: «يا محمد اعدل فوالله ما عدلت!»؛ فأنكر عليه النبي صنيعه وأخبر أنه يخرج من صلبه قوم يمرقون من الدين (الخوارج)."
