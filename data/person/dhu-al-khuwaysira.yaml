summary:
  en: "A man of Banu Tamim (identified as Hurqus ibn Zuhayr al-Sa'di) who brazenly challenged the Prophet during the distribution of spoils at al-Ji'rana, saying 'Act justly, for you have not acted justly'; the Prophet rebuked him and foretold that from his progeny would emerge a sect that passes out of religion (the Kharijites)."
  ar: "رجل من بني تميم ⁦(هو حرقوص بن زهير السعدي)⁩ واجه النبي بوقاحة في قسمة الجعرانة قائلاً: «يا محمد اعدل فوالله ما عدلت!»؛ فأنكر عليه النبي صنيعه وأخبر أنه يخرج من صلبه قوم يمرقون من الدين ⁦(الخوارج)⁩."
  es: "Un hombre de Banu Tamim (identificado como Hurqus ibn Zuhayr al-Sa'di) desafió descaradamente al Profeta durante el reparto del botín en al-Ji'rana, diciéndole: «Actúa con justicia, porque no has actuado con justicia»; el Profeta lo reprendió y predijo que de su descendencia surgiría una secta que se apartaría de la religión (los jariyitas)."
  fr: "Un homme de Banu Tamim (identifié comme Hurqus ibn Zuhayr al-Sa'di) qui défia effrontément le Prophète lors de la distribution du butin à al-Ji'rana, disant 'Agis avec justice, car tu n'as pas agi avec justice'; le Prophète le réprimanda et prédit que de sa descendance émergerait une secte qui s'éloigne de la religion (les Kharijites)."
  ur: "بنو تمیم کا ایک شخص ⁦(جس کی شناخت حرقس بن زہیر السعدی کے نام سے ہوئی)⁩ جس نے الجیرانہ میں مال غنیمت کی تقسیم کے دوران ڈھٹائی کے ساتھ پیغمبر کو للکارا اور کہا کہ انصاف کرو کیونکہ تم نے انصاف نہیں کیا۔ نبی نے اس کی سرزنش کی اور پیشین گوئی کی کہ ان کی نسل سے ایک فرقہ نکلے گا جو دین سے خارج ہو جائے گا۔"
  tr: "Banu Tamim'den bir adam (Harqus ibn Zuhayr al-Sa'di), Ce'ranah'ı bölürken Peygamber'e kaba bir şekilde karşı çıktı ve şöyle dedi: \"Ey Muhammed, adil ol, Allah'a yemin ederim, adalet etmedin!\" Peygamber, onun yaptığı iş için onu azarladı ve soyundan bir halkın (Hariciler) dinden ayrılacağını bildirdi."
  id: "Seorang pria dari Banu Tamim (yang merupakan Harqus ibn Zuhayr al-Sa'di) dengan kasar menghadapi Nabi dalam membagi Ja'ranah, berkata: \"Wahai Muhammad, jadilah adil, demi Allah, engkau tidak benar!\" Nabi menegur perbuatannya dan memberitahukan bahwa dari garis keturunannya suatu umat akan meninggalkan agama (Kharijit)."
