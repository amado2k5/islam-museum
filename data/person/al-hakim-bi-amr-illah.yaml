id: person/al-hakim-bi-amr-illah
class: person
label: { ar: "الحاكم بأمر الله أحمد القبي", en: "al-Hakim bi-Amr Allah Ahmad al-Qabi", fr: "Al-Hakim bi-Amr Allah Ahmad al-Qabi", es: "al-Hakim bi-Amr Allah Ahmad al-Qabi", ur: "الحاکم با امر اللہ احمد القبی" }
summary:
  ar: "ثاني خلفاء القاهرة [٦٦١–٧٠١هـ]، أبو العباس أحمد بن أبي علي الحسن القبي ابن علي بن أبي بكر ابن المسترشد، اختفى وقت أخذ بغداد ونجا فقصد حسين بن فلاح أمير بني خفاجة ثم الأمير عيسى بن مهنأ فأرسل المظفر في طلبه قليج البغدادي فبايع بالخلافة وافتتح عانة والحديثة وهيت والأنبار وصاف التتار وانتصر عليهم ثم أقام بحلب خليفة رتبته أميرها أقوش وبايعه عبد الحليم بن تيمية وجمع من أهلها، فلما عدم المستنصر قدم إلى مصر فتولى الخلافة إلى أن توفي ليلة الجمعة ثامن عشر جمادى الأولى سنة إحدى وسبع مئة ودفن بقرب السيدة نفيسة وهو أول من دفن منهم هناك واستمر مدفنهم إلى الآن وعهد بالخلافة لولده سليمان المستكفي {cite:tarikh-khulafa-minhaj-1434 p. 725,731}."
  en: "Second Cairo caliph [661–701], of al-Mustarshid's line — he escaped the sack to the Arabs, fought the Tatars at Ana, Haditha, Hit and Anbar, reigned first at Aleppo where Abd al-Halim ibn Taymiyya swore him, then ruled Cairo forty years, first Abbasid buried by Sayyida Nafisa {cite:tarikh-khulafa-minhaj-1434 p. 725,731}. At his Cairo bay'a on 8 Muharram 661 Baybars extended his hand and swore first, then the notables, and al-Hakim invested Baybars with the sultanate; next day's khutba opened 'Praise God who raised for the Abbasid house a pillar and a backer' — and the caliph was sequestered at the Citadel of the Mountain in 663 {cite:shadharat-dhahab p. 528-529, 542}."
  fr: "Deuxième calife du Caire (661–701 H), de la lignée d’al-Mustarshid ; il échappa au sac et se réfugia auprès des Arabes, combattit les Tatars à Ana, Haditha, Hit et Anbar, régna d’abord à Alep, où Abd al-Halim ibn Taymiyya lui prêta serment, puis gouverna au Caire quarante ans, premier Abbasside enterré près de Sayyida Nafisa {cite:tarikh-khulafa-minhaj-1434 p. 725,731}. Lors de son allégeance au Caire le 8 muharram 661 H, Baybars tendit la main et prêta serment le premier, suivi des notables, et al-Hakim investit Baybars du sultanat ; la khutba du lendemain s’ouvrit sur la louange de Dieu qui avait suscité un pilier et un soutien pour la maison abbasside. Le calife fut confiné à la Citadelle de la Montagne en 663 H {cite:shadharat-dhahab p. 528-529, 542}."
  es: "Segundo califa de El Cairo [661–701], de la línea de al-Mustarshid, escapó del saqueo a los árabes, luchó contra los tártaros en Ana, Haditha, Hit y Anbar, reinó primero en Alepo donde Abd al-Halim ibn Taymiyya le juró lealtad, luego gobernó El Cairo durante cuarenta años, el primer abasí enterrado por Sayyida Nafisa {cite:tarikh-khulafa-minhaj-1434 p. 725,731}. En su bay'a de El Cairo el 8 de Muharram de 661, Baybars extendió su mano y juró primero, luego los notables, y al-Hakim invistió a Baybars con el sultanato; la jutba del día siguiente comenzó con 'Alabado sea Dios que levantó para la casa abasí un pilar y un respaldo', y el califa fue recluido en la Ciudadela de la Montaña en 663 {cite:shadharat-dhahab p. 528-529, 542}."
  ur: "قاہرہ کا دوسرا خلیفہ [661-701]، المسترشد کے سلسلہ میں - وہ عربوں کی بوری سے بچ گیا، انا، حدیدہ، ہٹ اور انبار میں تاتاریوں سے لڑا، پہلے حلب میں حکومت کی جہاں عبد الحلیم ابن تیمیہ نے اس سے قسم کھائی، پھر سال بھر قاہرہ پر حکمرانی کی، سب سے پہلے نافع بنی عباسی نے قاہرہ پر حکومت کی۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 725,731}۔ 8 محرم 661 کو اپنے قاہرہ میں بیبرس نے اپنا ہاتھ بڑھایا اور پہلے قسم کھائی، پھر معززین نے، اور الحکیم نے بیبار کو سلطنت کے ساتھ لگایا۔ اگلے دن کے خطبے میں 'الحمد اللہ جس نے عباسیوں کے گھر کے لیے ایک ستون اور پشتی کھڑا کیا' کھولا - اور خلیفہ کو 663 میں پہاڑ کے قلعے میں الگ کر دیا گیا۔ 528-529، 542}۔"
  tr: "Kahire'nin ikinci halifesi [661–701 H) Ebu el-Abbas Ahmed bin Abi Ali el-Hasan el-Hasan el-Kübi ibn Ali ibn Ebi Bekir bin Mustarshid, Bağdat'ın ele geçirilmesi sırasında ortadan kayboldu ve hayatta kaldı. Banu Hafaca Emiri Hüseyin bin Falah'a, ardından Prens İsa ibn Muhanna'ya gitti. El-Muzaffar, Qulij al-Baghdi'yi onu araması için gönderdi; Bağdadi halifeliğe bağlılık yemini etti, Ana, El-Hadisa, Hit ve Anbar'ı fethetti, Tatarları savundu, onları yendi ve ardından Halep'te, Kuş rütbesinde bir halife kurdu, Abdülhalim bin Teymiye'ye bağlılık yemini etti ve halkından topladı. El-Mustansir artık müsait olunca Mısır'da halifeliği üstlendi ve 7000 Cuma gecesi, on sekizinci Cuma gecesi öldü ve Lady Nafisa'nın yanına defnedildi. Oraya gömülen ilk kişi oydu ve defnişleri günümüze kadar devam ediyor; halifelik oğlu Süleyman el-Mustakfi'ye emanet edildi {cite:Tarikh-khulafa-minhaj-1434, s. 725,731}."
  id: "Khalifah kedua Kairo [661–701 H], Abu al-Abbas Ahmad ibn Abi Ali al-Hasan al-Qubi ibn Ali ibn Abi Bakr ibn al-Mustarshid, menghilang saat penaklukan Baghdad dan selamat. Ia pergi ke Husayn ibn Falah, Emir Banu Khafaja, kemudian Pangeran Isa ibn Muhanna. Al-Muzaffar mengirim Qulij al-Baghdadi untuk mencarinya, yang kemudian bersumpah setia kepada kekhalifahan, menaklukkan 'Ana, Al-Haditha, Hit, dan Anbar, membela Tatar, mengalahkan mereka, lalu mendirikan khalifah di Aleppo yang emir berpangkat Qush, bersumpah setia kepada Abd al-Halim ibn Taymiyyah dan mengumpulkan dari rakyatnya. Ketika al-Mustansir tidak lagi tersedia, ia pergi ke Ia mengambil alih kekhalifahan di Mesir hingga meninggal pada malam Jumat, tanggal delapan belas Jumada al-Awwal, tahun tujuh ratus seratus dan dimakamkan di dekat Lady Nafisa. Ia adalah yang pertama dimakamkan di sana, dan pemakaman mereka masih berlangsung hingga hari ini, dan kekhalifahan dipercayakan kepada putranya Suleiman al-Mustakfi {cite:Tarikh-khulafa-minhaj-1434, hlm. 725,731}."
