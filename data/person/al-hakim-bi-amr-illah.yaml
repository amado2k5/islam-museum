id: person/al-hakim-bi-amr-illah
class: person
label: { ar: "الحاكم بأمر الله أحمد القبي" }
summary:
  ar: "ثاني خلفاء القاهرة [٦٦١–٧٠١هـ]، أبو العباس أحمد بن أبي علي الحسن القبي ابن علي بن أبي بكر ابن المسترشد، اختفى وقت أخذ بغداد ونجا فقصد حسين بن فلاح أمير بني خفاجة ثم الأمير عيسى بن مهنأ فأرسل المظفر في طلبه قليج البغدادي فبايع بالخلافة وافتتح عانة والحديثة وهيت والأنبار وصاف التتار وانتصر عليهم ثم أقام بحلب خليفة رتبته أميرها أقوش وبايعه عبد الحليم بن تيمية وجمع من أهلها، فلما عدم المستنصر قدم إلى مصر فتولى الخلافة إلى أن توفي ليلة الجمعة ثامن عشر جمادى الأولى سنة إحدى وسبع مئة ودفن بقرب السيدة نفيسة وهو أول من دفن منهم هناك واستمر مدفنهم إلى الآن وعهد بالخلافة لولده سليمان المستكفي {cite:tarikh-khulafa-minhaj-1434 p. 725,731}."
  en: "Second Cairo caliph [661–701], of al-Mustarshid's line — he escaped the sack to the Arabs, fought the Tatars at Ana, Haditha, Hit and Anbar, reigned first at Aleppo where Abd al-Halim ibn Taymiyya swore him, then ruled Cairo forty years, first Abbasid buried by Sayyida Nafisa {cite:tarikh-khulafa-minhaj-1434 p. 725,731}."
