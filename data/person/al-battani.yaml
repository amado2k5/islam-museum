issue:
  ar: "هل كان البتاني مسلمًا أم صابئيًا؟"
  en: "Was al-Battani a Muslim or a Sabian?"
perspectives:
  - tradition: sunni
    id: ibn-khallikan-abu-al-fida
    standing: main
    stance: { ar: "اسمه «محمد» يدل على إسلامه", en: "His name Muhammad indicates he was a Muslim" }
    summary:
      ar: "قال ابن خلكان إنه لم يقف على أنه أسلم، لكن اسمه محمدًا يدل على إسلامه؛ وزاد أبو الفداء أن مقدمة زيجه تدل على ذلك أيضًا، كما ينقل نالينو."
      en: "Ibn Khallikan said he had not found that al-Battani embraced Islam, but that his name Muhammad shows he became a Muslim; Abu al-Fida added that the preface of his Zij shows it too, as Nallino reports."
    holders: [person/ibn-khallikan, person/abu-al-fida]
    sources: [source/nallino-albatenii-opus-astronomicum]
  - tradition: academic
    id: nallino
    standing: secondary
    stance: { ar: "مسلم يقينًا، ونسبة «الصابئ» موروثة عن آبائه", en: "Certainly a Muslim; the nisba al-Sabi was inherited from his forebears" }
    summary:
      ar: "يرى نالينو أن أوثق شاهد على إسلامه مقدمة الزيج التي يستشهد فيها بآيات كثيرة، والعبارات الإسلامية المنثورة في أواخر الأبواب، وأن لقب «الصابئ» قد ينتقل من الأب إلى الابن كما سمي مسلمون بالنصراني والمجوسي والإسرائيلي، وقد يكون لصق به لأنه حراني. وينقل أن بعض المتأخرين من الأوروبيين كرايسكه ومونتوكلا ورينو جعلوه صابئيًا بلا أساس."
      en: "Nallino holds that the surest witness to his Islam is the Zij's preface, which cites many Qur'anic verses, and the Muslim formulas closing its chapters; the nisba al-Sabi could pass from father to son, as Muslims bore names like al-Nasrani, al-Majusi or al-Isra'ili, or could have stuck to him as a Harranian. He reports that some later Europeans (Reiske, Montucla, Reinaud) called him a Sabian without basis."
    sources: [source/nallino-albatenii-opus-astronomicum]
