summary:
  ar: "أبو عبد الله محمد بن جابر بن سنان الحراني الرقي البتاني (قبل 244–317هـ)، فلكي ورياضي من أهل حران سكن الرقة ورصد فيها الكواكب من سنة 264 إلى 306هـ، وصاحب «الزيج» الذي صحح فيه أرصاد بطليموس وحركاته، وتوفي عائدًا من بغداد في قصر الجص قرب سامراء {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 23} {cite:nallino-albatenii-opus-astronomicum p. 27}. وعند المسعودي أنه ممن عني بعلم الهيئة بعد ظهور الإسلام {cite:muruj-al-dhahab p. 519}."
  en: "Abu Abd Allah Muhammad ibn Jabir ibn Sinan al-Harrani al-Raqqi al-Battani (born before 244, died 317 AH / 929 CE), astronomer and mathematician from Harran who lived in al-Raqqa, observed there from 264 to 306 AH, wrote the Zij that corrected Ptolemy's observations and motions, and died on his way back from Baghdad at Qasr al-Jiss near Samarra {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 23} {cite:nallino-albatenii-opus-astronomicum p. 27}."
  ur: "ابو عبد اللہ محمد بن جابر بن سنان حرانی رقی البتانی (244ھ سے پہلے – 317ھ)، حران کے ماہرِ فلکیات و ریاضی دان جو رقہ میں رہے، وہاں 264 سے 306ھ تک رصد کیا، اور «زیج» لکھی جس میں بطلیموس کے ارصاد و حرکات کی تصحیح کی؛ بغداد سے واپسی پر سامرا کے قریب قصر الجص میں فوت ہوئے {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 27}."
