born: { edtf: "1161", hijri: "0556", calendar: julian, precision: month, status: tradition, derived: true, note: "ولد في ذي الحجة سنة ست وخمسين وخمسمائة {cite:wafayat-ayan}." }
summary:
  ar: "تاج الملوك أبو سعيد بوري بن أيوب بن شاذي بن مروان، الملقب مجد الدين؛ أخو السلطان صلاح الدين وكان أصغر أولاد أبيه؛ كانت فيه فضيلة وله ديوان شعر فيه الغث والسمين؛ توفي بجراحة أصابته طعنةً في ركبته يوم نزول العسكر على حلب لما حاصرها أخوه السلطان صلاح الدين، وكان قد أصابته يوم السادس عشر من المحرم {cite:wafayat-ayan}."
  en: "Taj al-Muluk Buri b. Ayyub — youngest of Salah al-Din's brothers; a prince of some refinement with a poetry diwan; died of a knee wound received at Salah al-Din's siege of Aleppo {cite:wafayat-ayan}."
  es: "Taj al-Muluk Buri b. Ayyub — el menor de los hermanos de Salah al-Din; un príncipe de cierto refinamiento con un diwan de poesía; murió de una herida en la rodilla recibida durante el asedio de Alepo por Salah al-Din {cite:wafayat-ayan}."
  fr: "Taj al-Muluk Buri b. Ayyub — le plus jeune des frères de Salah al-Din; un prince d'un certain raffinement avec un diwan de poésie; mort d'une blessure au genou reçue lors du siège d'Alep par Salah al-Din {cite:wafayat-ayan}."
  ur: "تاج الملوک بری بی۔ ایوب - صلاح الدین کے بھائیوں میں سب سے چھوٹا؛ شاعری کے دیوان کے ساتھ کچھ تطہیر کا شہزادہ؛ حلب کے صلاح الدین کے محاصرے میں گھٹنے کے زخم کی وجہ سے انتقال کر گئے۔"
  tr: "Tac al-Muluk Ebu Sa'id Buri ibn Eyyüb ibn Şadhi ibn Mervan, lakaplı Médeddin; Sultan Salaheddin'in kardeşi ve babasının en küçük oğlu; erdemli bir figürdü ve hem zenginleri hem de şişmanları içeren bir şiir koleksiyonuna sahipti; ordunun Halep'e indiği gün, kardeşi Sultan Salah-Din kuşattığı gün dizinden aldığı yaralardan öldü ve Muharrem'in on altıncı ayında vurulmuştu {alıntı:vafayat-ayan}."
  id: "Taj al-Muluk Abu Sa'id Buri ibn Ayyub ibn Shadhi ibn Marwan, dijuluki Majd al-Din; saudara Sultan Salah al-Din dan anak bungsu ayahnya; ia adalah sosok yang berbudi luhur dan memiliki kumpulan puisi yang berisi orang kaya dan gemuk; ia meninggal akibat luka di lututnya pada hari pasukan menyerbu Aleppo ketika saudaranya Sultan Salah al-Din mengepungnya, dan ia telah terkena serangan pada tanggal keenam belas Muharram {cite:wafayat-ayan}."
