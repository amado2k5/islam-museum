summary:
  ar: "سالم بن حمد بن عقيل النابت فريق ركن ⁦(طيار)⁩ قطري تولى رئاسة أركان القوات المسلحة القطرية في تشرين الأول 2021. وفي آذار 2024 تلقى في باريس وسام جوقة الشرف الفرنسي برتبة قائد. لا يُعرف له تاريخ مولد موثق علنًا، ولا توجد عنه مقالة ويكيبيديا ولا عنصر ويكي بيانات؛ وهذا سجل موجز مبني على التقارير القطرية الرسمية."
  en: "Salem bin Hamad bin Aqeel Al Nabit is a Qatari staff lieutenant general (pilot) who took over as Chief of Staff of the Qatar Armed Forces in October 2021. In March 2024 he received the French National Order of the Legion of Honour with the rank of Commander in Paris. No birth date is publicly attested, and he has no Wikipedia article or Wikidata item; this is a minimal record built from official Qatari reporting."
  ur: "سالم بن حمد بن عقیل النابت قطری اسٹاف لیفٹیننٹ جنرل (پائلٹ) ہیں جنھوں نے اکتوبر 2021 میں قطر کی مسلح افواج کے چیف آف اسٹاف کا عہدہ سنبھالا۔ مارچ 2024 میں انھیں پیرس میں فرانسیسی نیشنل آرڈر آف دی لیجن آف آنر (کمانڈر) سے نوازا گیا۔"
