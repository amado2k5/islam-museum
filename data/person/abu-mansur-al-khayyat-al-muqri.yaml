id: person/abu-mansur-al-khayyat-al-muqri
class: person
label: { ar: "أبو منصور الخياط مقرئ العميان ببغداد" }
summary:
  ar: "أبو منصور الخياط محمد بن أحمد بن عبد الرزاق الشيرازي الأصل البغدادي الصفار الحنبلي المقرئ الزاهد؛ ولد سنة إحدى وأربعمائة في شوال أو ذي القعدة، وقرأ القراءات على أبي نصر أحمد بن عبد الوهاب بن مسرور وتفقه على القاضي أبي يعلى وصنف كتاب المهذب في القراءات؛ كان إماماً بمسجد ابن حردة ببغداد بحريم دار الخلافة اعتكف فيه مدة طويلة يعلم العميان القرآن لوجه الله ويسأل لهم وينفق عليهم حتى بلغ عدد من أقرأهم القرآن من العميان سبعين ألفاً على ما وجده ابن النجار بخط أبي نصر اليونارتي؛ توفي سنة سبع وتسعين وأربعمائة {cite:shadharat-dhahab p. 406}."
  en: "Abu Mansur al-Khayyat Muhammad b. Ahmad al-Shirazi al-Baghdadi, the Hanbali muqri'-ascetic born 401; author of al-Muhadhdhab on the readings and imam of Ibn Harida's mosque in the caliphal sanctuary, where he long dwelt teaching blind men the Qur'an for God's face and spending on them — Ibn al-Najjar found in Abu Nasr al-Yunarti's hand that he had taught seventy thousand blind men; died 497 {cite:shadharat-dhahab p. 406}."
