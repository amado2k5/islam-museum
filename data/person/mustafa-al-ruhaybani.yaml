summary:
  ar: "مصطفى بن سعد بن عبده السيوطي شهرة، الرحيباني مولدا، مفتي الحنابلة بدمشق، فقيه فرضي، أخذ الفقه عن أحمد البعلي ومحمد بن مصطفى اللبدي النابلسي وآخرين، وانتهت إليه رئاسة الفقه، وتولى نظارة الجامع الأموي والإفتاء على مذهب أحمد. من تصانيفه «مطالب أولي النهى في شرح غاية المنتهى» في ثلاثة مجلدات. عاش بين 1164 و1243هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
  en: "Mustafa ibn Sa'd ibn Abduh, called al-Suyuti, and al-Ruhaybani by birth, mufti of the Hanbalis in Damascus, a jurist and expert in inheritance. He studied law with Ahmad al-Ba'li and Muhammad ibn Mustafa al-Labdi al-Nabulusi and others; leadership of the law came to him, and he supervised the Umayyad Mosque and gave fatwas on the school of Ahmad ibn Hanbal. His work is 'Matalib uli al-nuha' in three large volumes. He lived from 1164 to 1243 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
