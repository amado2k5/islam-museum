summary:
  ar: "مصطفى بن سعد بن عبده السيوطي شهرة، الرحيباني مولدا، مفتي الحنابلة بدمشق، فقيه فرضي، أخذ الفقه عن أحمد البعلي ومحمد بن مصطفى اللبدي النابلسي وآخرين، وانتهت إليه رئاسة الفقه، وتولى نظارة الجامع الأموي والإفتاء على مذهب أحمد. من تصانيفه «مطالب أولي النهى في شرح غاية المنتهى» في ثلاثة مجلدات. عاش بين 1164 و1243هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
  en: "Mustafa ibn Sa'd ibn Abduh, called al-Suyuti, and al-Ruhaybani by birth, mufti of the Hanbalis in Damascus, a jurist and expert in inheritance. He studied law with Ahmad al-Ba'li and Muhammad ibn Mustafa al-Labdi al-Nabulusi and others; leadership of the law came to him, and he supervised the Umayyad Mosque and gave fatwas on the school of Ahmad ibn Hanbal. His work is 'Matalib uli al-nuha' in three large volumes. He lived from 1164 to 1243 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
  es: "Mustafa ibn Sa'd ibn Abduh, llamado al-Suyuti y al-Ruhaybani de nacimiento, fue muftí de los hanbalíes en Damasco, jurista y experto en derecho sucesorio. Estudió derecho con Ahmad al-Ba'li y Muhammad ibn Mustafa al-Labdi al-Nabulusi, entre otros. Ostentó el liderazgo jurídico, supervisó la Mezquita Omeya y emitió fatuas sobre la escuela de Ahmad ibn Hanbal. Su obra es «Matalib uli al-nuha», en tres volúmenes. Vivió entre 1164 y 1243 d. H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
  fr: "Mustafa ibn Sa'd ibn Abduh, dit al-Suyuti, né al-Ruhaybani, fut mufti de l'école hanbalite de Damas, juriste et expert en droit successoral. Il étudia le droit auprès d'Ahmad al-Ba'li, de Muhammad ibn Mustafa al-Labdi al-Nabulusi et d'autres érudits. Il exerça une haute fonction juridique, supervisa la mosquée des Omeyyades et émit des fatwas sur l'école d'Ahmad ibn Hanbal. Son œuvre majeure, « Matalib uli al-nuha », est en trois volumes. Il vécut de 1164 à 1243 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
