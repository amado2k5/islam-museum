summary:
  ar: "أزاد فيروز بن جشيش، عامل كسرى على البحرين؛ سمته العرب المكعبر لأنه كان يقطع الأيدي والأرجل، وهو الذي أمره كسرى بقتل بني تميم فاستدرجهم إلى حصن المشقر بهجر بدعوى الميرة فقتل رجالهم واستبقى غلمانهم فعبر بهم إلى فارس {cite:kamil-ibn-al-athir p. 349}."
  en: "Azad Firuz ibn Jushish, Khusraw's governor of Bahrayn, called al-Muka'bbir by the Arabs for cutting off hands and feet; ordered to destroy Tamim he lured them into al-Mushaqqar fort at Hajar with a promise of rations, killed their men and shipped their boys to Persia {cite:kamil-ibn-al-athir p. 349}."
