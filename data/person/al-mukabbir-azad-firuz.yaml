gender: male
summary:
  ar: "أزاد فيروز بن جشيش، عامل كسرى على البحرين؛ سمته العرب المكعبر لأنه كان يقطع الأيدي والأرجل، وهو الذي أمره كسرى بقتل بني تميم فاستدرجهم إلى حصن المشقر بهجر بدعوى الميرة فقتل رجالهم واستبقى غلمانهم فعبر بهم إلى فارس {cite:kamil-ibn-al-athir p. 349}."
  en: "Azad Firuz ibn Jushish, Khusraw's governor of Bahrayn, called al-Muka'bbir by the Arabs for cutting off hands and feet; ordered to destroy Tamim he lured them into al-Mushaqqar fort at Hajar with a promise of rations, killed their men and shipped their boys to Persia {cite:kamil-ibn-al-athir p. 349}."
  fr: "Azad Firuz ibn Jushish, gouverneur de Khusraw à Bahrayn, appelé al-Muka'bbir par les Arabes pour avoir coupé les mains et les pieds  ; Il les a attirés dans le fort al-Mushaqqar à Hajar avec une promesse de rations, tué leurs hommes et expédié leurs garçons en Perse {cite:kamil-ibn-al-athir p. 349}."
  es: "Azad Firuz ibn Jushish, gobernador de Bahrayn por Khusraw, llamado al-Muka'bbir por los árabes por cortar manos y pies; recibió la orden de destruir Tamim, los atrajo al fuerte de al-Mushaqqar en Hajar con la promesa de raciones, mató a sus hombres y envió a sus muchachos a Persia {cite:kamil-ibn-al-athir p. 349}."
  ur: "بحرین کے خسرو کے گورنر آزاد فیروز ابن جُشیش کو عربوں نے ہاتھ پاؤں کاٹنے پر المکبیر کہا۔ تمیم کو تباہ کرنے کا حکم دیا، اس نے انہیں راشن کے وعدے کے ساتھ حجر کے مشاق قلعہ میں گھسایا، ان کے آدمیوں کو قتل کر دیا اور ان کے لڑکوں کو فارس بھیج دیا۔ 349}۔"
