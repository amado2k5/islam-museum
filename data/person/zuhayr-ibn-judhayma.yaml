id: person/zuhayr-ibn-judhayma
class: person
label: { ar: "زهير بن جذيمة العبسي" }
summary:
  ar: "زهير بن جذيمة بن رواحة العبسي، سيد بني عبس؛ اضطرب هو وخالد بن جعفر الكلابي بسيفيهما فسقط زهير تحت خالد فضربه خندج بن البكاء فقتله، فغضبت غطفان لقتله وضمن لهم الحارث بن ظالم أن يفتك بخالد فقتله غيلة {cite:ansab-al-ashraf p. 40}."
  en: "Zuhayr ibn Judhayma al-Absi, chief of Banu Abs; grappled with Khalid ibn Ja'far sword to sword, fell beneath him and was finished off by Khunduj — his death brought the Ghatafan vendetta and Khalid's own murder {cite:ansab-al-ashraf p. 40}."
  es: "Zuhayr ibn Judhayma al-Absi, jefe de Banu Abs, luchó espada a espada con Khalid ibn Ja'far, cayó bajo su peso y fue rematado por Khunduj; su muerte provocó la venganza de Ghatafan y el asesinato del propio Khalid {cite:ansab-al-ashraf p. 40}."
  fr: "Zuhayr ibn Judhayma al-Absi, chef des Banu Abs, s'est battu avec Khalid ibn Ja'far épée contre épée, est tombé sous lui et a été achevé par Khunduj — sa mort a entraîné la vendetta des Ghatafan et le propre meurtre de Khalid {cite:ansab-al-ashraf p. 40}."
  ur: "زہیر بن جُدائمہ العبسی، بنو عباس کے سربراہ؛ خالد بن جعفر نے تلوار سے تلوار سے مقابلہ کیا، اس کے نیچے گرا اور خندوج کے ہاتھوں مارا گیا - اس کی موت نے غطفان کا انتقام لیا اور خالد کا اپنا قتل {حوالہ: انساب الاشرف صفحہ 40}۔"
  tr: "Zuhayr ibn Judaymah ibn Rawaha al-Absi, Banu Abs'ın reisi; o ve Halid ibn Ja'far al-Kilabi kılıçlarıyla karıştılar, bu yüzden Zuhayr Halid'in eline geçti ve Khandaj ibn al-Bakka onu vurup öldürdü. Ghatafan onu öldürmek için öfkelendi ve al-Harith ibn Zalim onlara Halid'i öldüreceğine söz verdi, ancak Halid'i hainlikle öldürdü {atıf:ansab-al-ashraf, s. 40}."
  id: "Zuhayr ibn Judaymah ibn Rawaha al-Absi, kepala Banu Abs; ia dan Khalid ibn Ja'far al-Kilabi menjadi bingung dengan pedang mereka, sehingga Zuhayr jatuh di bawah Khalid, dan Khandaj ibn al-Bakka memukulnya dan membunuhnya. Ghatafan marah untuk membunuhnya, dan al-Harith ibn Zalim berjanji akan membunuh Khalid, tetapi ia membunuhnya dengan pengkhianatan {cite:ansab-al-ashraf, hlm. 40}."
