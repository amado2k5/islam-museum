summary:
  ar: "زهير بن جذيمة بن رواحة العبسي، سيد بني عبس؛ اضطرب هو وخالد بن جعفر الكلابي بسيفيهما فسقط زهير تحت خالد فضربه خندج بن البكاء فقتله، فغضبت غطفان لقتله وضمن لهم الحارث بن ظالم أن يفتك بخالد فقتله غيلة {cite:ansab-al-ashraf p. 40}."
  en: "Zuhayr ibn Judhayma al-Absi, chief of Banu Abs; grappled with Khalid ibn Ja'far sword to sword, fell beneath him and was finished off by Khunduj — his death brought the Ghatafan vendetta and Khalid's own murder {cite:ansab-al-ashraf p. 40}."
