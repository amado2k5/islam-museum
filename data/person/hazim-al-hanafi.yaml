summary:
  ar: "حازم الحنفي، كان عند الذكر مغلوبًا، وكان رأسه معصوبًا من الشجاج. روى خالد بن السفر أنه كان إذا ذكر الله وهو إلى جنب الحائط ينطح رأسه بالحائط، وأن سُليمًا المقرئ قال إنه لا يسمع القرآن فينطح رأسه."
  en: "Hazim al-Hanafi, overcome in the presence of remembrance, whose head was bound from the wounds he suffered; Khalid ibn al-Safar relates that when he remembered God beside a wall he would strike his head against it, and that Sulaym the reciter said he strikes his head because he does not hear the Qur'an."
  ur: "حازم حنفی ذکر کے وقت بے قابو ہو جاتے تھے، اور ان کا سر زخموں کی وجہ سے پٹی میں بندھا رہتا تھا۔ خالد بن سفر نے نقل کیا کہ جب وہ دیوار کے پاس بیٹھ کر اللہ کا ذکر کرتے تو سر دیوار سے ٹکراتے، اور سلیم قاری نے کہا کہ وہ قرآن نہیں سنتے اس لیے سر دیوار سے مارتے ہیں۔"
