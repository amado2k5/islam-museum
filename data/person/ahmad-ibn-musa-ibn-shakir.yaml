summary:
  ar: "أبو القاسم أحمد بن موسى بن شاكر (توفي في القرن التاسع)، الأخ الأوسط في بني موسى ببغداد ومهندس الأسرة: صاحب «كتاب الحيل» الذي يصف مئة جهاز ميكانيكي — مصابيح ذاتية الفتيل وأواني خداع وعازف ناي آلي يُعدّ من أوائل الآلات القابلة للبرمجة — وهو العمل الوحيد الباقي من أعماله، وله رسالة في تثليث الزاوية وكتاب في وصف الآلة التي تزمّر بنفسها. لا تثبت الدراسات التي تعتمدها المقالة الإنجليزية سنة ميلاد أو وفاة له؛ وسنوات المقالة العربية (803–873) محفوظة في ترجمته بوصفها رواية غير محققة."
  en: "Abu al-Qasim Ahmad ibn Musa ibn Shakir (died in the 9th century), middle brother of the Banu Musa of Baghdad and the family's engineer: author of the Book of Ingenious Devices (Kitab al-Hiyal), describing a hundred mechanical inventions — self-trimming lamps, trick vessels and an automatic flute player counted among the earliest programmable machines — the only one of his works to survive, and of treatises on the trisection of the angle and on the instrument that sounds by itself. No birth or death year is attested for him by the scholarship the English article rests on; the Arabic article's years (803-873) are preserved in his record as an unverified tradition."
  ur: "ابو القاسم احمد بن موسی بن شاکر (وفات نویں صدی)، بغداد کے بنو موسی کے منجھلے بھائی اور خاندان کے انجینئر: «کتاب الحیل» کے مصنف، جس میں سو میکانکی ایجادات — خودکار فتیلہ تراش چراغ، شعبدہ برتن اور خودکار بانسری نواز جو اولین قابلِ پروگرام مشینوں میں شمار ہوتا ہے — بیان ہیں، اور یہ ان کی واحد باقی ماندہ تصنیف ہے؛ زاویے کی تثليث اور خود بخود بجنے والے آلے پر بھی ان کے رسالے ہیں۔ انگریزی مضمون کی بنیاد بننے والی تحقیق کے مطابق ان کی پیدائش یا وفات کا کوئی سال ثابت نہیں؛ عربی مضمون کے سال (803–873ء) ان کے ریکارڈ میں غیر مصدقہ روایت کے طور پر محفوظ ہیں۔"

