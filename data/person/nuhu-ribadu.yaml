summary:
  ar: "محام وشرطي متقاعد وسياسي نيجيري وُلد في يولا سنة 1960. أسّس رئاسة لجنة الجرائم الاقتصادية والمالية (2003–2007) وذاع صيته محاربا للفساد، ثم فُصل من الشرطة ولجأ إلى المنفى قبل أن يعود ويرشّح نفسه للرئاسة سنة 2011، وعُيّن مستشارا للأمن القومي سنة 2023."
  en: "Nigerian lawyer, retired police officer and politician born in Yola in 1960. He was the founding chairman of the Economic and Financial Crimes Commission (2003–2007) and became known as an anti-corruption campaigner; he was later dismissed from the police and lived in exile before returning to run for president in 2011, and was appointed National Security Adviser in 2023."
  ur: "نائجریائی وکیل، ریٹائرڈ پولیس افسر اور سیاست دان، 1960 میں یولا میں پیدا ہوئے۔ وہ اقتصادی و مالی جرائم کمیشن کے بانی چیئرمین رہے ⁦(2003ء–2007ء)⁩ اور بدعنوانی کے خلاف آواز کے طور پر معروف ہوئے؛ بعد میں پولیس سے برطرفی اور جلاوطنی کے بعد وطن لوٹے، 2011 میں صدارت کے امیدوار بنے اور 2023 میں قومی سلامتی کے مشیر مقرر ہوئے۔"
  es: "Abogado nigeriano, policía retirado y político nacido en Yola en 1960. Fue el presidente fundador de la Comisión de Delitos Económicos y Financieros (2003-2007) y se dio a conocer como activista anticorrupción; posteriormente fue destituido de la policía y vivió en el exilio antes de regresar para postularse a la presidencia en 2011, y fue nombrado Asesor de Seguridad Nacional en 2023."
  fr: "Avocat nigérian, ancien policier et homme politique né à Yola en 1960. Il a été le président fondateur de la Commission des crimes économiques et financiers (2003-2007) et s'est fait connaître comme militant anticorruption; il a ensuite été renvoyé de la police et a vécu en exil avant de revenir se présenter à la présidence en 2011, et a été nommé conseiller à la sécurité nationale en 2023."
  tr: "1960 yılında Yola'da doğmuş emekli Nijeryalı avukat, polis memuru ve siyasetçidir. Ekonomik ve Mali Suçlar Komisyonu'nun başkanlığını (2003–2007) kurdu ve yolsuzlukla mücadeleci olarak ün kazandı. Daha sonra polisten çıkarıldı ve sürgüne gitti, 2011'de cumhurbaşkanlığına aday olmak üzere geri döndü ve 2023'te Ulusal Güvenlik Danışmanı olarak atandı."
  id: "Seorang pengacara, polisi, dan politisi Nigeria yang sudah pensiun, lahir di Yola pada tahun 1960. Ia mendirikan kepemimpinan Komisi Kejahatan Ekonomi dan Keuangan (2003–2007) dan dikenal sebagai pejuang anti-korupsi. Ia kemudian diberhentikan dari kepolisian dan pergi ke pengasingan sebelum kembali mencalonkan diri sebagai presiden pada tahun 2011, dan diangkat sebagai Penasihat Keamanan Nasional pada tahun 2023."
