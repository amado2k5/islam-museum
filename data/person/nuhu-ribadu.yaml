summary:
  ar: "محام وشرطي متقاعد وسياسي نيجيري وُلد في يولا سنة 1960. أسّس رئاسة لجنة الجرائم الاقتصادية والمالية (2003–2007) وذاع صيته محاربا للفساد، ثم فُصل من الشرطة ولجأ إلى المنفى قبل أن يعود ويرشّح نفسه للرئاسة سنة 2011، وعُيّن مستشارا للأمن القومي سنة 2023."
  en: "Nigerian lawyer, retired police officer and politician born in Yola in 1960. He was the founding chairman of the Economic and Financial Crimes Commission (2003–2007) and became known as an anti-corruption campaigner; he was later dismissed from the police and lived in exile before returning to run for president in 2011, and was appointed National Security Adviser in 2023."
  ur: "نائجریائی وکیل، ریٹائرڈ پولیس افسر اور سیاست دان، 1960 میں یولا میں پیدا ہوئے۔ وہ اقتصادی و مالی جرائم کمیشن کے بانی چیئرمین رہے (2003ء–2007ء) اور بدعنوانی کے خلاف آواز کے طور پر معروف ہوئے؛ بعد میں پولیس سے برطرفی اور جلاوطنی کے بعد وطن لوٹے، 2011 میں صدارت کے امیدوار بنے اور 2023 میں قومی سلامتی کے مشیر مقرر ہوئے۔"
