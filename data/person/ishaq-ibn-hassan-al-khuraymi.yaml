summary:
  ar: "شاعر عربي من بلاط العباسيين الأوائل، مولى لبني خريم، مات على الأرجح في خلافة المأمون نحو سنة 206 للهجرة، وكان يمدح ويرثي أصحاب الحظوة عنده، وانحاز في الحرب بين الأمين والمأمون إلى الأمين."
  en: "An Arab poet of the early Abbasid court, a client of the Banu Khuraym, who probably died under al-Ma'mun about 206/821. He wrote panegyrics and elegies for his patrons and sided with al-Amin in the civil war {cite:encyclopaedia-of-islam-2 vol. 1 p. 178}."
  ur: "عباسی درباروں کے ابتدائی دور کے عرب شاعر، بنو خریم کے مولیٰ، جو غالباً مامون کے عہد میں 206 ھ کے قریب وفات پائی۔ انہوں نے اپنے سرپرستوں کی مدح اور مرثیے کہے اور امین و مامون کی جنگ میں امین کا ساتھ دیا۔"
  es: "Poeta árabe de la corte abasí temprana, cliente de los Banu Khuraym, que probablemente murió bajo el reinado de al-Ma'mun alrededor del año 206/821. Escribió panegíricos y elegías para sus mecenas y se puso del lado de al-Amin en la guerra civil {cite:encyclopaedia-of-islam-2 vol. 1 p. 178}."
  fr: "Poète arabe de la cour du début de l'Abbasside, client des Banu Khuraym, probablement mort sous al-Ma'mun vers 206/821. Il a écrit des panégyriques et des élégies pour ses mécènes et s'est rangé du côté d'al-Amin pendant la guerre civile {cite:encyclopaedia-of-islam-2 vol. 1 p. 178}."
  tr: "Erken Abbasi sarayından bir Arap şair, Banu Huram'ın özgür bırakılmış bir şairi olan Khure, muhtemelen 206 Hicri yıllarında el-Memun halifeliği sırasında öldü. Kendisinin sevdiği kişileri övdü ve yas tuttu, el-Emin ile el-Mevun arasındaki savaşta el-Amin'in yanında yer aldı."
  id: "Seorang penyair Arab dari istana Abbasiyah awal, mantan Banu Khuraym, kemungkinan besar ia meninggal saat kekhalifahan al-Ma'mun sekitar tahun 206 H. Ia memuji dan meratapi mereka yang disukainya, serta berpihak pada al-Amin dalam perang antara al-Amin dan al-Ma'mun."
