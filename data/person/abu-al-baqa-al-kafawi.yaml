gender: male
summary:
  ar: أيوب بن موسى الحسيني القريمي الكفوي، أبو البقاء، صاحب «الكليات»، من قضاة الأحناف، ولي القضاء في كفه وبالقدس وبغداد وتوفي بإستانبول سنة 1094 هـ.
  en: Ayyub ibn Musa al-Husayni al-Qirimi al-Kafawi, Abu al-Baqa, author of 'al-Kulliyyat', one of the Hanafi judges; he served as judge in Kaffa, Jerusalem and Baghdad and died in Istanbul in 1094 AH.
  fr: "Ayyub ibn Musa al-Husayni al-Qirimi al-Kafawi, Abu al-Baqa, auteur d'« al-Kulliyyat », l'un des cadis hanafites ; il fut cadi à Kaffa, à Jérusalem et à Bagdad et mourut à Istanbul en 1094 H."
  es: "Ayyub ibn Musa al-Husayni al-Qirimi al-Kafawi, Abu al-Baqa, autor de 'al-Kulliyyat', uno de los jueces hanafi; sirvió como juez en Kaffa, Jerusalén y Bagdad y murió en Estambul en 1094 AH."
  ur: "ایوب بن موسیٰ الحسینی الکریمی الکفوی، ابو البقا، 'الکلیات' کے مصنف، حنفی ججوں میں سے ایک؛ آپ نے کفا، یروشلم اور بغداد میں جج کے طور پر خدمات انجام دیں اور 1094 ہجری میں استنبول میں وفات پائی۔"
  tr: "“El-Külliyat” adlı eserin yazarı Eyüp ibn Musa el-Hüseyni el-Karimi el-Kafavi, Ebu el-Baka, Hanefi kadılarından biriydi. Kaffa, Kudüs ve Bağdat'ta kadılık yapmış ve Hicri 1094 yılında İstanbul'da vefat etmiştir."
  id: "Ayub ibn Musa al-Husseini al-Qarimi al-Kafawi, Abu al-Baqa, penulis “al-Kulliyat”, adalah salah satu hakim mazhab Hanafi. Beliau memegang jabatan hakim di Kaffa, Yerusalem, dan Baghdad, dan meninggal di Istanbul pada tahun 1094 Hijriah."
