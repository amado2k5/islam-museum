summary:
  ar: "محمد بن أحمد الرِّقوطي المرسي ⁦(وردت نسبته في النسخة المقرؤة «القرموطي»)⁩، من أعرف أهل الأندلس بالعلوم القديمة — المنطق والهندسة والعدد والموسيقى والطب — فيلسوفاً طبيباً ماهراً يقرئ الأمم بألسنتهم؛ ولما تغلّب ملكُ الروم على مرسية عرف له حقّه فبنى له مدرسة يقرئ فيها المسلمين والنصارى واليهود، ولما دعاه إلى التنصّر مُغرِياً بالمنزلة أبى وقال لأصحابه إنه عجز عما يجب لإله واحد فكيف حاله لو عبد ثلاثة {cite:nafh-tib-maqqari p. 130}."
  en: "Muhammad al-Riquti of Murcia, among the most learned Andalusis in the ancient sciences — logic, geometry, arithmetic, music and medicine; when the Christian king took Murcia he recognised his worth and built him a school in which he taught Muslims, Christians and Jews, and refused the offer of conversion {cite:nafh-tib-maqqari p. 130}."
  es: "Muhammad al-Riquti de Murcia, uno de los andalusíes más eruditos en las ciencias antiguas: lógica, geometría, aritmética, música y medicina; cuando el rey cristiano tomó Murcia reconoció su valía y le construyó una escuela en la que enseñó a musulmanes, cristianos y judíos, y rechazó la oferta de conversión {cite:nafh-tib-maqqari p. 130}."
  fr: "Muhammad al-Riquti de Murcie, parmi les Andalous les plus savants dans les sciences anciennes — logique, géométrie, arithmétique, musique et médecine; lorsque le roi chrétien prit Murcie, il reconnut sa valeur et lui construisit une école où il enseigna aux musulmans, aux chrétiens et aux juifs, et refusa l'offre de conversion {cite:nafh-tib-maqqari p. 130}."
  ur: "مرسیا کا محمد الرقتی، قدیم علوم میں سب سے زیادہ سیکھنے والے اندلس میں سے ایک - منطق، جیومیٹری، ریاضی، موسیقی اور طب؛ جب عیسائی بادشاہ نے مرسیا کو لیا تو اس نے اس کی قدر کو پہچان لیا اور اس کے لیے ایک اسکول بنایا جس میں وہ مسلمانوں، عیسائیوں اور یہودیوں کو پڑھاتا تھا، اور مذہب کی تبدیلی کی پیشکش سے انکار کر دیا تھا۔ 130}۔"
  tr: "Muhammed bin Ahmed el-Rakouti el-Mursi (soyu 'al-Qarmouti' adlı okunan el yazmasında geçmektedir), eski bilimlerde—mantık, geometri, numeroloji, müzik ve tıp—Endülüs'ün en tanınmış kişilerinden biriydi—milletlere dillerinde okuyan yetenekli bir filozof ve hekimdi. Roma kralı Murcia'yı fethettiğinde, hakkını tanıdı ve Müslümanlara, Hristiyanlara ve Yahudilere eğitim vermesi için bir okul inşa etti. Statüsü nedeniyle onu Hristiyanlığa geçmeye davet ettiğinde, reddetti ve yoldaşlarına, tek bir tanrıdan istenenleri yapamayacağını, o halde üç tanrıya nasıl tapabileceğini söyledi {cite:nafh-tib-maqqari, s. 130}."
  id: "Muhammad ibn Ahmad al-Raqouti al-Mursi (garis keturunannya tercantum dalam naskah 'al-Qarmouti'), salah satu tokoh paling terkenal dari al-Andalus dalam ilmu kuno—logika, geometri, numerologi, musik, dan kedokteran—adalah seorang filsuf dan dokter yang terampil yang membaca kepada bangsa-bangsa dalam bahasa mereka. Ketika raja Romawi menaklukkan Murcia, ia mengakui haknya dan membangun sebuah sekolah untuknya mengajar Muslim, Kristen, dan Yahudi. Ketika ia mengundangnya untuk memeluk agama Kristen, tergoda oleh statusnya, ia menolak dan mengatakan kepada teman-temannya bahwa ia tidak mampu melakukan apa yang diwajibkan dari satu dewa, jadi bagaimana mungkin ia menyembah tiga {cite:nafh-tib-maqqari, hlm. 130}."
