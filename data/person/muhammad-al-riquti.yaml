summary:
  ar: "محمد بن أحمد الرِّقوطي المرسي (وردت نسبته في النسخة المقرؤة «القرموطي»)، من أعرف أهل الأندلس بالعلوم القديمة — المنطق والهندسة والعدد والموسيقى والطب — فيلسوفاً طبيباً ماهراً يقرئ الأمم بألسنتهم؛ ولما تغلّب ملكُ الروم على مرسية عرف له حقّه فبنى له مدرسة يقرئ فيها المسلمين والنصارى واليهود، ولما دعاه إلى التنصّر مُغرِياً بالمنزلة أبى وقال لأصحابه إنه عجز عما يجب لإله واحد فكيف حاله لو عبد ثلاثة {cite:nafh-tib-maqqari p. 130}."
  en: "Muhammad al-Riquti of Murcia, among the most learned Andalusis in the ancient sciences — logic, geometry, arithmetic, music and medicine; when the Christian king took Murcia he recognised his worth and built him a school in which he taught Muslims, Christians and Jews, and refused the offer of conversion {cite:nafh-tib-maqqari p. 130}."
