summary:
  ar: "وهب بن مسرة بن مفرج بن حكيم، أبو الحزم، المالكي التميمي الحجاري، نسبة إلى وادي الحجارة، بلد بالأندلس. فقيه ومحدث وحافظ عارف بالرجال. سمع بقرطبة من ابن وضاح وعبيد الله وأحمد بن إبراهيم الفرضي وأحمد بن خالد ومحمد بن قاسم وقاسم بن أصبغ وغيرهم، وحدث عنه أبو محمد القليعي وعبد الرحيم بن العجوز وغيرهما. وصفه ابن فرحون بأنه إمام ثقة مأمون، وكانت إليه الرحلة في أيامه. من تصانيفه «السنة وإثبات القدر والرؤية». توفي سنة 346هـ على ما أثبته الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
  en: "Wahb ibn Masarra ibn Mufarrij ibn Hakim, Abu al-Hazm, of the Maliki school, of the Tamim and of Wadi al-Hijara, a town in al-Andalus. He was a jurist, a transmitter of hadith, a hafiz and an expert in the men who transmitted it. In Cordova he heard from Ibn Wadah, Ubayd Allah, Ahmad ibn Ibrahim al-Faradi, Ahmad ibn Khalid, Muhammad ibn Qasim and Qasim ibn Asbagh among others; Abu Muhammad al-Qali'i and Abd al-Rahim ibn al-Ajuz transmitted from him. Ibn Farhun described him as a reliable and trustworthy imam, and in his lifetime people travelled to him for learning. His book «The Sunna and the Affirmation of Qadar and the Vision» is listed. The book gives his death as 346 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
  es: "Wahb ibn Masarra ibn Mufarrij ibn Hakim, Abu al-Hazm, de la escuela Maliki, de Tamim y de Wadi al-Hijara, una ciudad en al-Ándalus. Fue jurista, transmisor de hadices, hafiz y experto en los hombres que los transmitieron. En Córdoba escuchó de Ibn Wadah, Ubayd Allah, Ahmad ibn Ibrahim al-Faradi, Ahmad ibn Khalid, Muhammad ibn Qasim y Qasim ibn Asbagh, entre otros; Abu Muhammad al-Qali'i y Abd al-Rahim ibn al-Ajuz transmitieron de él. Ibn Farhun lo describió como un imán fiable y digno de confianza, y en vida la gente viajaba a él para aprender. Su libro «La Sunna y la Afirmación del Qadar y la Visión» está catalogado. El libro indica que murió en el año 346 de la Hégira. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
  fr: "Wahb ibn Masarra ibn Mufarrij ibn Hakim, dit Abu al-Hazm, de l'école malikite, de l'école tamim et originaire de Wadi al-Hijara, ville d'al-Andalus, était un juriste, un transmetteur de hadiths, un hafiz et un expert des transmetteurs. À Cordoue, il reçut l'enseignement d'Ibn Wadah, d'Ubayd Allah, d'Ahmad ibn Ibrahim al-Faradi, d'Ahmad ibn Khalid, de Muhammad ibn Qasim et de Qasim ibn Asbagh, entre autres. Abu Muhammad al-Qali'i et Abd al-Rahim ibn al-Ajuz reçurent également son enseignement. Ibn Farhun le décrit comme un imam fiable et digne de confiance, et de son vivant, on venait à lui pour étudier. Son ouvrage « La Sunna et l'affirmation du Qadar et de la Vision » est mentionné. Ce livre indique sa mort en 346 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
  ur: "وھب بن مسررہ ابن مفرج ابن حکیم، ابو الحزم، مالکی مکتب، تمیم اور وادی الحجرہ، اندلس کے ایک قصبے سے۔ وہ ایک فقیہ، حدیث کی ترسیل کرنے والے، حافظ اور اسے منتقل کرنے والوں میں ماہر تھے۔ کورڈووا میں اس نے ابن ودہ، عبید اللہ، احمد بن ابراہیم الفرادی، احمد بن خالد، محمد بن قاسم اور قاسم ابن اصبغ سے سنا۔ ابو محمد القلی اور عبد الرحیم بن العوج نے ان سے روایت کی ہے۔ ابن فرحون نے انہیں ایک قابل اعتماد اور قابل اعتماد امام قرار دیا، اور ان کی زندگی میں لوگ علم حاصل کرنے کے لیے ان کے پاس جاتے تھے۔ ان کی کتاب \"سنت و اثبات قدر و نظر\" درج ہے۔ کتاب ان کی وفات 346ھ بتاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص6457}"
  tr: "Vahb ibn Masarah ibn Mufarrij ibn Hakim, Abu al-Hazm, Maliki al-Tamimi al-Hajjari, Endülüs'teki bir kasaba olan Wadi al-Hijarah'ın adını taşır. Bir hukukçu, hadis âlimi ve hafıberci, rivayetçileri iyi tanıyan biridir. Cordoba'da İbn Waddah, Ubayd Allah, Ahmed ibn İbrahim el-Fardhi, Ahmed ibn Khalid, Muhammed bin Kasım, Kasım ib'den dinlemiştir n Asbag ve diğerleri. Ebu Muhammed el-Küksel'i, Abdülrahim bin el-'Acaz ve diğerleri ondan rivayet etmiştir. İbn Farhun onu güvenilir ve güvenilir bir imam olarak tanımlamış ve onun döneminde ona seyahat etmiştir. Eserleri arasında \"Sünnet, İtibat el-Kadr ve Ru'ya\" bulunmaktadır. Kitapta doğrulandığı üzere, 346 Hicri yılında ölmüştür. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s. 6457}"
  id: "Wahb ibn Masarah ibn Mufarrij ibn Hakim, Abu al-Hazm, Maliki al-Tamimi al-Hajjari, dinamai menurut Wadi al-Hijarah, sebuah kota di al-Andalus. Seorang ahli hukum, ulama hadis, dan penghafal yang memahami para narator. Ia mendengar di Cordoba dari Ibn Waddah, Ubayd Allah, Ahmad ibn Ibrahim al-Fardhi, Ahmad ibn Khalid, Muhammad ibn Qasim, Qasim ibn Asbagh, dan lainnya. Abu Muhammad al-Qulay'i, Abd al-Rahim ibn al-'Ajuz, dan lainnya menceritakan darinya. Ibn Farhun menggambarkannya sebagai imam yang dapat dipercaya dan dapat dipercaya, dan ia pernah bepergian kepadanya pada masanya. Di antara karya-karyanya adalah \"Sunnah, Ithibat al-Qadr, dan Ru'ya.\" Ia wafat pada tahun 346 H, sebagaimana dikonfirmasi oleh kitab tersebut. {cite:Fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
