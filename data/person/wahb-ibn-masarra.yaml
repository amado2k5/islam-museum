  en: "Wahb ibn Masarra (Andalusian Maliki jurist)"
summary:
  ar: "وهب بن مسرة بن مفرج بن حكيم، أبو الحزم، المالكي التميمي الحجاري، نسبة إلى وادي الحجارة، بلد بالأندلس. فقيه ومحدث وحافظ عارف بالرجال. سمع بقرطبة من ابن وضاح وعبيد الله وأحمد بن إبراهيم الفرضي وأحمد بن خالد ومحمد بن قاسم وقاسم بن أصبغ وغيرهم، وحدث عنه أبو محمد القليعي وعبد الرحيم بن العجوز وغيرهما. وصفه ابن فرحون بأنه إمام ثقة مأمون، وكانت إليه الرحلة في أيامه. من تصانيفه «السنة وإثبات القدر والرؤية». توفي سنة 346هـ على ما أثبته الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
  en: "Wahb ibn Masarra ibn Mufarrij ibn Hakim, Abu al-Hazm, of the Maliki school, of the Tamim and of Wadi al-Hijara, a town in al-Andalus. He was a jurist, a transmitter of hadith, a hafiz and an expert in the men who transmitted it. In Cordova he heard from Ibn Wadah, Ubayd Allah, Ahmad ibn Ibrahim al-Faradi, Ahmad ibn Khalid, Muhammad ibn Qasim and Qasim ibn Asbagh among others; Abu Muhammad al-Qali'i and Abd al-Rahim ibn al-Ajuz transmitted from him. Ibn Farhun described him as a reliable and trustworthy imam, and in his lifetime people travelled to him for learning. His book «The Sunna and the Affirmation of Qadar and the Vision» is listed. The book gives his death as 346 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6457}"
