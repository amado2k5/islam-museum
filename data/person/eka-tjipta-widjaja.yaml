summary:
  ar: "إيكا تجيبتا ويدجاجا (وُلد باسم أوي إك تجونغ في 27 شباط 1921 في تشيوانتشو بالصين، وتوفي في 26 كانون الثاني 2019 في جاكرتا) رجل أعمال إندونيسي من أصل صيني، مؤسس مجموعة سينار ماس؛ هاجر طفلًا إلى ماكاسار وباع الحلوى من دراجة، ثم تاجر بالكوبرا، وأسس سي في سينار ماس في سورابايا سنة 1962 ومصنع تجيوي كيميا للورق سنة 1972 وبنك إندونيسيا الدولي سنة 1982، وموّل بمنح مؤسسته الدراسية آلاف الطلاب."
  en: "Eka Tjipta Widjaja (born Oei Ek Tjong on 27 February 1921 in Quanzhou, China; died 26 January 2019 in Jakarta) was an Indonesian businessman of Chinese descent, founder of the Sinar Mas Group; he migrated to Makassar as a child and sold candy from a bicycle, traded copra, founded CV Sinar Mas in Surabaya in 1962, the Tjiwi Kimia paper mill in 1972 and Bank Internasional Indonesia in 1982, and funded thousands of scholarships through his foundation."
  ur: "ایکا تجپتا ودجاجا (پیدائش بطور اوئی ایک تجونگ 27 فروری 1921، چوانژو، چین؛ وفات 26 جنوری 2019، جکارتہ) چینی نسل کے انڈونیشیائی کاروباری تھے، سینار ماس گروپ کے بانی؛ بچپن میں مکاسر ہجرت کی اور سائیکل سے مٹھائی بیچی، کوپرا کی تجارت کی، 1962 میں سورابایا میں سی وی سینار ماس، 1972 میں تجوی کیمیا کاغذ فیکٹری اور 1982 میں بینک انٹرنیشنل انڈونیشیا قائم کیا، اور اپنی فاؤنڈیشن سے ہزاروں وظائف دیے۔"
