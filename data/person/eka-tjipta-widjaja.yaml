    note: >-
      Two texts attest a faith for the man himself, and
      both are published by the Tzu Chi foundation: its
      English commemoration article reports his own words
      at the Malam Cinta Kasih gathering of 19 March 2002,
      where he told the audience that he is a Christian,
      and Master Cheng Yen's lecture of 15 November 2017,
      published separately by the same foundation in
      Indonesian, calls him in the speaker's own voice a
      very devout Christian (umat Kristen yang sangat
      taat). The two texts have different authors,
      occasions and languages and neither copies the
      other, but they issue from the one foundation — the
      Buddhist charity he supported for decades — so
      under the founder's one-source-family rule they do
      not settle the value: his faith is recorded as
      unknown and FLAGGED for the founder's ruling, with
      both attestations preserved here in full. The
      English, Indonesian and Chinese Wikipedia articles
      are silent on his religion and Wikidata carries no
      religion statement. His support for Tzu Chi and his
      philanthropy through the Eka Tjipta Foundation are
      activity, not attestation either way.
    sources: [source/tzuchi-eka-tjipta-widjaja-commemoration, source/tzuchi-cheng-yen-lecture-eka-tjipta]
