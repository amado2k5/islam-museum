id: person/al-fasihi-al-istrabadhi
class: person
label: { ar: "الفصيحي الإستراباذي", en: "al-Fasihi al-Istrabadhi" }
summary:
  ar: "أبو الحسن علي بن أبي زيد بن محمد بن علي النحوي المعروف بالفصيحي الإستراباذي؛ أخذ النحو عن عبد القاهر صاحب الجمل الإستراباذي وتبحر فيه حتى صار أعرف أهل زمانه؛ قدم بغداد واستوطنها ودرّس النحو بالمدرسة النظامية مدة وانتفع به خلق كثير ومن جملة من أخذ عنه ملك النحاة الحسن بن صافي، وروى عنه أبو طاهر السلفي؛ توفي يوم الأربعاء ثالث عشر ذي الحجة سنة ست عشرة وستمائة ببغداد؛ وقال ابن خلكان لم يُعرف أنسبه بالفصيحي إلى كتاب الفصيح لثعلب أم لشيء آخر {cite:shadharat-dhahab p. 70}."
  en: "Abu al-Hasan Ali ibn Abi Zayd ibn Muhammad ibn Ali, the grammarian known as al-Fasihi al-Istrabadhi. He studied grammar with Abd al-Qahir al-Istrabadhi, author of al-Jumal, and became so deep in it that he was the best informed man of his age. He came to Baghdad, settled there, and taught grammar for a time at the Nizamiyya madrasa; many benefited from him. Among those who studied with him was the king of the grammarians al-Hasan ibn Safi, and Abu Tahir al-Silafi narrated from him. He died in Baghdad on Wednesday, 13 Dhu al-Hijja 616. Ibn Khallikan said it was not known whether his nisba al-Fasihi refers to Tha'lab's book al-Fasih or to something else {cite:shadharat-dhahab p. 70}."
