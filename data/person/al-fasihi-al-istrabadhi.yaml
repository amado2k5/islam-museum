label: { ar: "الفصيحي الإستراباذي", en: "al-Fasihi al-Istrabadhi", fr: "Al-Fasihi al-Istrabadhi", es: "al-Fasihi al-Istrabadhi", ur: "الفصیحی الاسترآبادی" }
summary:
  ar: "أبو الحسن علي بن أبي زيد بن محمد بن علي النحوي المعروف بالفصيحي الإستراباذي؛ أخذ النحو عن عبد القاهر صاحب الجمل الإستراباذي وتبحر فيه حتى صار أعرف أهل زمانه؛ قدم بغداد واستوطنها ودرّس النحو بالمدرسة النظامية مدة وانتفع به خلق كثير ومن جملة من أخذ عنه ملك النحاة الحسن بن صافي، وروى عنه أبو طاهر السلفي؛ توفي يوم الأربعاء ثالث عشر ذي الحجة سنة ست عشرة وستمائة ببغداد؛ وقال ابن خلكان لم يُعرف أنسبه بالفصيحي إلى كتاب الفصيح لثعلب أم لشيء آخر {cite:shadharat-dhahab p. 70}."
  en: "Abu al-Hasan Ali ibn Abi Zayd ibn Muhammad ibn Ali, the grammarian known as al-Fasihi al-Istrabadhi. He studied grammar with Abd al-Qahir al-Istrabadhi, author of al-Jumal, and became so deep in it that he was the best informed man of his age. He came to Baghdad, settled there, and taught grammar for a time at the Nizamiyya madrasa; many benefited from him. Among those who studied with him was the king of the grammarians al-Hasan ibn Safi, and Abu Tahir al-Silafi narrated from him. He died in Baghdad on Wednesday, 13 Dhu al-Hijja 616. Ibn Khallikan said it was not known whether his nisba al-Fasihi refers to Tha'lab's book al-Fasih or to something else {cite:shadharat-dhahab p. 70}."
  fr: "Abu al-Hasan Ali ibn Abi Zayd ibn Muhammad ibn Ali, grammairien connu comme al-Fasihi al-Istrabadhi. Il étudia la grammaire auprès d’Abd al-Qahir al-Istrabadhi, auteur d’al-Jumal, et l’approfondit tant qu’il devint l’homme le plus savant de son temps. Il vint à Bagdad, s’y établit et enseigna quelque temps la grammaire à la madrasa Nizamiyya ; beaucoup en bénéficièrent. Parmi ses élèves figurait le roi des grammairiens al-Hasan ibn Safi, et Abu Tahir al-Silafi rapporta de lui. Il mourut à Bagdad le mercredi 13 dhu al-hijja 616 H. Ibn Khallikan dit qu’on ignorait si sa nisba al-Fasihi renvoyait au livre al-Fasih de Tha’lab ou à autre chose {cite:shadharat-dhahab p. 70}."
  es: "Abu al-Hasan Ali ibn Abi Zayd ibn Muhammad ibn Ali, el gramático conocido como al-Fasihi al-Istrabadhi. Estudió gramática con Abd al-Qahir al-Istrabadhi, autor de al-Jumal, y se adentró tanto en ella que fue el hombre mejor informado de su época. Llegó a Bagdad, se estableció allí y enseñó gramática durante un tiempo en la madrasa Nizamiyya; muchos se beneficiaron de sus enseñanzas. Entre sus discípulos se encontraba el rey de los gramáticos, al-Hasan ibn Safi, y Abu Tahir al-Silafi narró de él. Falleció en Bagdad el miércoles 13 de Dhu al-Hijja de 616. Ibn Khallikan afirmó que se desconocía si su nisba al-Fasihi se refería al libro de Tha'lab, al-Fasih, o a otra obra {cite:shadharat-dhahab p. 70}."
  ur: "ابو الحسن علی ابن ابی زید ابن محمد ابن علی، گرامر دان الفصیحی الاسترابادی کے نام سے جانا جاتا ہے۔ اس نے الجمال کے مصنف عبد القاہر الاسترابادی سے گرائمر کا مطالعہ کیا اور اس میں اتنا گہرا ہو گیا کہ وہ اپنی عمر کے بہترین باخبر آدمی تھے۔ وہ بغداد آئے، وہاں سکونت اختیار کی، اور مدرسہ نظامیہ میں کچھ عرصہ گرامر پڑھایا۔ بہت سے لوگ اس سے مستفید ہوئے۔ ان سے تعلیم حاصل کرنے والوں میں گرامر کے بادشاہ الحسن بن صفی بھی تھے اور ابو طاہر السلفی نے ان سے روایت کی ہے۔ ان کی وفات بدھ 13 ذی الحجہ 616 کو بغداد میں ہوئی۔ ابن خلیقان نے کہا کہ یہ معلوم نہیں ہے کہ ان کی نسبۃ الفصیحی سے مراد ثعلب کی کتاب الفصیح ہے یا کسی اور چیز سے۔ 70}۔"
  tr: "Ebu el-Hasan Ali ibn Abi Zeyd ibn Muhammed ibn Ali el-Nehvi, el-Fasihi el-İstrabadi olarak da bilinir, el-Cümal el-İstrabadi'nin yazarı Abd el-Kahir'den dilbilgisi öğrenmiş ve zamanının en bilgili kişisi olana kadar bu konuda yetkinleşmiştir. Bağdat'a gelip oraya yerleşmiş ve bir süre Nizamiye Okulu'nda dilbilgisi dersleri vermiş, birçok kişi ondan faydalanmıştır. Ondan öğrenenler arasında dilbilgisi ustaları el-Hasan ibn Safi de bulunmaktaydı ve Ebu Tahir el-Selefi ondan rivayet etmiştir. 1616 yılında, Zilhicce ayının on üçüncü Çarşamba günü Bağdat'ta vefat etmiştir. İbn Hallikan şöyle demiştir: El-Fasihi'yi Tha'lab'ın el-Fasih kitabına mı yoksa başka bir şeye mi atfettiği bilinmemektedir. {kaynak: Şadharat-Dhaba s. 70}"
  id: "Abu al-Hasan Ali ibn Abi Zayd ibn Muhammad ibn Ali al-Nahwi, yang dikenal sebagai al-Fasihi al-Istrabadi, mempelajari tata bahasa dari Abd al-Qahir, penulis al-Jumal al-Istrabadi, dan menjadi mahir dalam bidang tersebut hingga menjadi orang yang paling berilmu pada zamannya. Ia datang ke Baghdad dan menetap di sana, serta mengajar tata bahasa di Sekolah Nizamiyya selama beberapa waktu, dan banyak orang yang mendapat manfaat darinya. Di antara mereka yang belajar darinya adalah raja ahli tata bahasa, al-Hasan ibn Safi, dan Abu Tahir al-Salafi meriwayatkan darinya. Ia wafat pada hari Rabu, tanggal 13 Dzul Hijjah, tahun 1661 di Baghdad. Ibnu Khallikan berkata: Tidak diketahui apakah ia mengaitkan al-Fasihi dengan kitab al-Fasih karya Tha’lab atau dengan sesuatu yang lain. {cite:shadharat-dhahab hlm. 70}."
