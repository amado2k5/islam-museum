born: { edtf: "1125", hijri: "0519", calendar: julian, precision: year, status: tradition, derived: true, note: "ولادته يوم الاثنين ثاني جمادى الآخرة وقيل في شعبان سنة تسع عشرة وخمسمائة بأصبهان {cite:wafayat-ayan}." }
summary:
  ar: "أبو عبد الله محمد بن صفي الدين أبي الفرج محمد بن نفيس الدين أبي الرجا حامد الأصبهاني، المعروف بابن سابق العز، الملقب عماد الدين الكاتب؛ كاتب السلطان صلاح الدين وصاحب «البرق الشامي» و«الفتح القصي في الفتح القدسي» و«خريدة القصر»؛ لم يزل على مكانته ورفعة منزلته حتى توفي السلطان صلاح الدين فاختلت أحواله وعزم على بيته وأقبل على الاشتغال بالتصانيف؛ وتوفي بدمشق يوم الاثنين مستهل شهر رمضان {cite:wafayat-ayan}."
  en: "Imad al-Din al-Katib al-Isfahani (b. 519) — Salah al-Din's chancellor, author of al-Barq al-Shami and al-Fath al-Qussi; after Salah al-Din's death he withdrew to writing, and died at Damascus at the start of Ramadan {cite:wafayat-ayan}."
  es: "Imad al-Din al-Katib al-Isfahani (n. 519) — Canciller de Salah al-Din, autor de al-Barq al-Shami y al-Fath al-Qussi; Después de la muerte de Salah al-Din se retiró a escribir y murió en Damasco al comienzo del Ramadán {cite:wafayat-ayan}."
  fr: "Imad al-Din al-Katib al-Isfahani (né en 519) — Chancelier de Salah al-Din, auteur d'al-Barq al-Shami et d'al-Fath al-Qussi; Après la mort de Salah al-Din, il se retira pour écrire et mourut à Damas au début du Ramadan {cite:wafayat-ayan}."
  ur: "عماد الدین الکاتب اصفہانی ⁦(متوفی 519)⁩ - صلاح الدین کے چانسلر، البرق الشامی اور الفتح القوسی کے مصنف؛ صلاح الدین کی وفات کے بعد اس نے لکھنا چھوڑ دیا اور رمضان کے شروع میں دمشق میں وفات پائی۔"
  tr: "Ebu Abdullah Muhammed bin Safi el-Din Ebu el-Farac Muhammed bin Nefis el-Din Ebu el-Raca Hamid el-İsfahani, İbn Sabiq el-İzz olarak bilinir, Lakabı İmadeddin Yazman; Sultan Salah-Din'in kâtipi ve 'Al-Barq al-Shami', 'Al-Fath al-Qudsi' ve 'Kharida al-Kasr' kitaplarının yazarıdır; Sultan Salah al-Din vefat edene kadar yüksek statüde kalmıştır, bu da durumu kötüleşmesine neden olmuş ve evine dönmeye karar verip kendini yazmaya adamıştır; Ramazan başlangıcı Pazartesi günü Şam'da vefat etti {atıf:wafayat-ayan}."
  id: "Abu Abdullah Muhammad ibn Safi al-Din Abu al-Faraj Muhammad ibn Nafis al-Din Abu al-Raja Hamid al-Isfahani, dikenal sebagai Ibn Sabiq al-Izz, dijuluki Imad al-Din Sang Juru Tulis; juru tulis Sultan Salah al-Din dan penulis 'Al-Barq al-Shami' serta 'Al-Fath al-Qudsi' dan 'Kharida al-Qasr'; ia tetap berada dalam status tinggi hingga Sultan Salah al-Din wafat, menyebabkan kondisinya memburuk dan ia memutuskan untuk pulang dan mendedikasikan dirinya untuk menulis; ia meninggal di Damaskus pada hari Senin, awal Ramadan {cite:wafayat-ayan}."
