summary:
  ar: "أبو عبد الله محمد بن صفي الدين أبي الفرج محمد بن نفيس الدين أبي الرجا حامد الأصبهاني، المعروف بابن سابق العز، الملقب عماد الدين الكاتب؛ كاتب السلطان صلاح الدين وصاحب «البرق الشامي» و«الفتح القصي في الفتح القدسي» و«خريدة القصر»؛ لم يزل على مكانته ورفعة منزلته حتى توفي السلطان صلاح الدين فاختلت أحواله وعزم على بيته وأقبل على الاشتغال بالتصانيف؛ وتوفي بدمشق يوم الاثنين مستهل شهر رمضان {cite:wafayat-ayan}."
  en: "Imad al-Din al-Katib al-Isfahani (b. 519) — Salah al-Din's chancellor, author of al-Barq al-Shami and al-Fath al-Qussi; after Salah al-Din's death he withdrew to writing, and died at Damascus at the start of Ramadan {cite:wafayat-ayan}."
