summary:
  ar: "قائد فارسي كان موكلاً بقصر سابور — الذي يعرف يوم البلاذري بقصر عيسى بن علي — فخرج إلى النسير والمسلمين فقاتلوه وهزموه فلجأ أصحابه إلى عين التمر."
  en: "Persian commander garrisoned at Qasr Sabur — known in al-Baladhuri's day as Qasr Isa ibn Ali — who came out against al-Nusayr's raiders, fought and was routed, his men withdrawing to Ayn al-Tamr."
  es: "Un comandante persa acantonado en Qasr Sabur —conocido en tiempos de al-Baladhuri como Qasr Isa ibn Ali— salió en contra de los asaltantes de al-Nusayr, luchó y fue derrotado, y sus hombres se retiraron a Ayn al-Tamr."
  fr: "Le commandant perse en garnison à Qasr Sabur — connu à l'époque d'al-Baladhuri sous le nom de Qasr Isa ibn Ali — sortit contre les pillards d'al-Nusayr, combattit et fut mis en déroute, ses hommes se retirant à Ayn al-Tamr."
  ur: "قصر صبور میں فارسی کمانڈر کی چوکی - جسے البلادھوری کے زمانے میں قصر عیسیٰ ابن علی کے نام سے جانا جاتا تھا - جو النصیر کے حملہ آوروں کے خلاف نکلا، لڑا اور شکست کھا گیا، اس کے آدمی عین التمر کی طرف واپس چلے گئے۔"
