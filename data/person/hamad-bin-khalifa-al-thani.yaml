summary:
  ar: "حمد بن خليفة آل ثاني ⁦(1 يناير 1952 – 12 يوليو 2026)⁩ أمير قطر من 1995 حتى تنازله عن الحكم سنة 2013، ويُلقّب بعدها بالأمير الوالد. تخرّج في ساندهيرست سنة 1971 وصعد في القوات المسلحة إلى رئاسة الأركان ووزارة الدفاع وولاية العهد، ثم أطاح بوالده في انقلاب أبيض سنة 1995. في حكمه طوّر الغاز الطبيعي المسال حتى بلغ 77 مليون طن سنويًا فصارت قطر الأغنى للفرد في العالم، وأسّس مؤسسة قطر (1995) وقناة الجزيرة وهيئة متاحف قطر، وفازت قطر في عهده باستضافة كأس العالم 2022، ثم تنازل لابنه تميم في خطوة غير مسبوقة خليجيًا."
  en: "Hamad bin Khalifa Al Thani (1 January 1952 – 12 July 2026) was Emir of Qatar from 1995 until his abdication in 2013, after which he was styled the Father Emir. He graduated from Sandhurst in 1971 and rose through the armed forces to chief of staff, minister of defence and heir apparent, then deposed his father in a bloodless coup in 1995. Under his rule liquefied natural gas production reached 77 million tonnes a year and Qatar became the richest country per capita in the world; he founded Qatar Foundation (1995), Al Jazeera and the Qatar Museums Authority, Qatar won the right to host the 2022 FIFA World Cup, and he then handed power to his son Tamim in a step without Gulf precedent."
  ur: "حمد بن خلیفہ آل ثانی ⁦(1 جنوری 1952ء – 12 جولائی 2026ء)⁩ 1995ء سے 2013ء میں دستبرداری تک قطر کے امیر رہے، بعد ازاں «امیر الوالد» کہلائے۔ 1971ء میں سینڈہرسٹ سے فارغ ہوئے اور افواج میں رئیسِ ارکان، وزیرِ دفاع اور ولی عہد کے مناصب تک پہنچے، پھر 1995ء میں اپنے والد کو بے خون انقلاب میں ہٹا کر اقتدار سنبھالا۔ ان کے دور میں قطر قدرتی گیس کی بدولت فی کس آمدنی میں دنیا کا امیر ترین ملک بنا، قطر فاؤنڈیشن اور الجزیرہ قائم ہوئے اور قطر کو 2022ء فیفا عالمی کپ کی میزبانی ملی، پھر انھوں نے اپنے بیٹے تمیم کو اقتدار سونپ دیا۔"
  es: "Hamad bin Khalifa Al Thani (1 de enero de 1952 - 12 de julio de 2026) fue emir de Qatar desde 1995 hasta su abdicación en 2013, tras la cual pasó a ser conocido como el Padre Emir. Se graduó en Sandhurst en 1971 y ascendió en las fuerzas armadas hasta convertirse en jefe del Estado Mayor, ministro de Defensa y heredero al trono, para luego deponer a su padre en un golpe de Estado incruento en 1995. Bajo su mandato, la producción de gas natural licuado alcanzó los 77 millones de toneladas anuales y Qatar se convirtió en el país más rico del mundo per cápita; fundó la Fundación Qatar (1995), Al Jazeera y la Autoridad de Museos de Qatar; Qatar obtuvo el derecho a organizar la Copa Mundial de la FIFA 2022, y posteriormente cedió el poder a su hijo Tamim en un hecho sin precedentes en el Golfo."
  fr: "Hamad ben Khalifa Al Thani (1er janvier 1952 – 12 juillet 2026) fut émir du Qatar de 1995 à son abdication en 2013, après quoi il reçut le titre d'Émir Père. Diplômé de Sandhurst en 1971, il gravit les échelons des forces armées jusqu'à devenir chef d'état-major, ministre de la Défense et prince héritier, avant de destituer son père lors d'un coup d'État sans effusion de sang en 1995. Sous son règne, la production de gaz naturel liquéfié atteignit 77 millions de tonnes par an et le Qatar devint le pays le plus riche du monde par habitant. Il fonda la Fondation du Qatar (1995), Al Jazeera et l'Autorité des musées du Qatar. Le Qatar obtint le droit d'organiser la Coupe du monde de la FIFA 2022, et il transmit ensuite le pouvoir à son fils Tamim, une décision sans précédent dans le Golfe."
  tr: "Hamad bin Halife Al Thani (1 Ocak 1952 – 12 Temmuz 2026), 1995'ten 2013'te tahttan çekilmesine kadar Katar Emiri olarak görev yaptı ve ardından Baba Prens lakabını aldı. 1971'de Sandhurst'tan mezun oldu ve silahlı kuvvetlerde Savunma Bakanlığı Genelkurmay Başkanı ve Veliaht Prens oldu, ardından 1995'te beyaz darbeyle babasını devirdi. Saltanatı sırasında sıvılaştırılmış doğal gaz üretimini yılda 77 milyon tona ulaşarak Katar'ı kişi başına en zengin ülke yaptı. Katar Vakfı'nı (1995), Al Jazeera ve Katar Müzeleri Otoritesi'ni kurdu. Görev süresi boyunca Katar, 2022 Dünya Kupası'nın ev sahipliği hakkını kazandı, ardından eşi benzeri görülmemiş bir Körfez hamlesiyle oğlu Tamim'e ayrıldı."
  id: "Hamad bin Khalifa Al Thani (1 Januari 1952 – 12 Juli 2026) adalah Emir Qatar dari tahun 1995 hingga turun tahta pada tahun 2013, setelah itu ia dijuluki Ayah Pangeran. Ia lulus dari Sandhurst pada tahun 1971 dan naik jabatan di angkatan bersenjata hingga menjadi Kepala Staf, Kementerian Pertahanan, dan Putra Mahkota, kemudian menggulingkan ayahnya dalam kudeta putih pada tahun 1995. Selama masa pemerintahannya, ia mengembangkan gas alam cair hingga mencapai 77 juta ton per tahun, menjadikan Qatar negara terkaya per kapita di dunia. Ia mendirikan Qatar Foundation (1995), Al Jazeera, dan Qatar Museums Authority. Selama masa jabatannya, Qatar memenangkan hak penyelenggaraan Piala Dunia 2022, lalu ia beralih kepada putranya Tamim dalam langkah yang belum pernah terjadi sebelumnya di Teluk."
