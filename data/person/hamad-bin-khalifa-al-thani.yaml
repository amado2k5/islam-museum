summary:
  ar: "حمد بن خليفة آل ثاني (1 يناير 1952 – 12 يوليو 2026) أمير قطر من 1995 حتى تنازله عن الحكم سنة 2013، ويُلقّب بعدها بالأمير الوالد. تخرّج في ساندهيرست سنة 1971 وصعد في القوات المسلحة إلى رئاسة الأركان ووزارة الدفاع وولاية العهد، ثم أطاح بوالده في انقلاب أبيض سنة 1995. في حكمه طوّر الغاز الطبيعي المسال حتى بلغ 77 مليون طن سنويًا فصارت قطر الأغنى للفرد في العالم، وأسّس مؤسسة قطر (1995) وقناة الجزيرة وهيئة متاحف قطر، وفازت قطر في عهده باستضافة كأس العالم 2022، ثم تنازل لابنه تميم في خطوة غير مسبوقة خليجيًا."
  en: "Hamad bin Khalifa Al Thani (1 January 1952 – 12 July 2026) was Emir of Qatar from 1995 until his abdication in 2013, after which he was styled the Father Emir. He graduated from Sandhurst in 1971 and rose through the armed forces to chief of staff, minister of defence and heir apparent, then deposed his father in a bloodless coup in 1995. Under his rule liquefied natural gas production reached 77 million tonnes a year and Qatar became the richest country per capita in the world; he founded Qatar Foundation (1995), Al Jazeera and the Qatar Museums Authority, Qatar won the right to host the 2022 FIFA World Cup, and he then handed power to his son Tamim in a step without Gulf precedent."
  ur: "حمد بن خلیفہ آل ثانی (1 جنوری 1952ء – 12 جولائی 2026ء) 1995ء سے 2013ء میں دستبرداری تک قطر کے امیر رہے، بعد ازاں «امیر الوالد» کہلائے۔ 1971ء میں سینڈہرسٹ سے فارغ ہوئے اور افواج میں رئیسِ ارکان، وزیرِ دفاع اور ولی عہد کے مناصب تک پہنچے، پھر 1995ء میں اپنے والد کو بے خون انقلاب میں ہٹا کر اقتدار سنبھالا۔ ان کے دور میں قطر قدرتی گیس کی بدولت فی کس آمدنی میں دنیا کا امیر ترین ملک بنا، قطر فاؤنڈیشن اور الجزیرہ قائم ہوئے اور قطر کو 2022ء فیفا عالمی کپ کی میزبانی ملی، پھر انھوں نے اپنے بیٹے تمیم کو اقتدار سونپ دیا۔"
