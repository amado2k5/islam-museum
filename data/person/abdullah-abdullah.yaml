summary:
  ar: "طبيب عيون وسياسي أفغاني، وُلد في كابل سنة 1960 لأب بشتوني من قندهار وأم طاجيكية من بنشير. كان من كبار قادة التحالف الشمالي ومستشارا لأحمد شاه مسعود، ثم وزيرا للخارجية (2001-2005)، ورئيسا تنفيذيا لأفغانستان (2014-2020)، ورئيسا للمجلس الأعلى للمصالحة الوطنية (2020-2021)، ونافس على الرئاسة ثلاث مرات."
  en: "Afghan ophthalmologist and politician, born at Kabul in 1960 to a Pashtun father from Kandahar and a Tajik mother from Panjshir. A senior Northern Alliance figure and adviser to Ahmad Shah Massoud, he served as foreign minister (2001–2005), Chief Executive of Afghanistan (2014–2020) and chairman of the High Council for National Reconciliation (2020–2021), and stood for the presidency three times."
  ur: "افغان ماہرِ چشم اور سیاست دان، جو 1960ء میں کابل میں ایک قندھاری پشتون والد اور پنجشیری تاجک والدہ کے ہاں پیدا ہوئے۔ شمالی اتحاد کے سینئر رہنما اور احمد شاہ مسعود کے مشیر رہے، پھر وزیرِ خارجہ (2001ء–2005ء)، افغانستان کے چیف ایگزیکٹیو (2014ء–2020ء) اور اعلیٰ کونسل برائے قومی مفاہمت کے چیئرمین (2020ء–2021ء) رہے اور تین بار صدارت کے امیدوار بنے۔"
