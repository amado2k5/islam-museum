summary:
  ar: "أبو بكر محمد بن الفضل الكماري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} تفقه على الأستاذ أبي محمد عبد الله بن محمد بن يعقوب السبذموني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} وتفقه عليه القاضي الحسين بن الخضر النسفي، والإمام الحاكم عبد الرحمن بن محمد الكاتب، وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} حفظ كتاب «المبسوط» وورد نيسابور وأقام بها متفقهاً، ثم قدمها حاجاً فحدث بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} قال اللكنوي إنه كان إماماً كبيراً وشيخاً جليلاً، معتمداً في الرواية، مقلداً في الدراية، ومشاهير كتب الفتاوى مشحونة بفتاواه ورواياته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} والمصادر المذكورة: الجواهر المضية، والفوائد البهية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} وفي رأس الترجمة تاريخان مكتوبان «٥٠٨» و«٤٢٦» هجرية، ولم يُبيَّن أيهما الوفاة، فلا يُذكر تاريخ هنا."
  en: "Abu Bakr Muhammad ibn al-Fadl al-Kammari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} He studied fiqh under the master Abu Muhammad Abd Allah ibn Muhammad ibn Ya'qub al-Sabadhmuni. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Al-Qadi al-Husayn ibn al-Khidr al-Nasafi and the imam al-Hakim Abd al-Rahman ibn Muhammad al-Katib, among others, studied fiqh under him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} He memorised al-Mabsut, came to Nishapur and stayed there studying fiqh, and then came back from the pilgrimage and transmitted there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Al-Lucknawi said he was a great imam and an honoured shaykh, reliable in transmission and an imitator in reasoning, and the famous books of fatwas are full of his fatwas and reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} The sources cited are al-Jawahir al-mudiyya and al-Fawa'id al-bahiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} The heading gives two dates, 508 and 426 AH, without saying which is the date of death, so no date is stated here."
