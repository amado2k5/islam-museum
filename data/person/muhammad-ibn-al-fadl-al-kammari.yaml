summary:
  ar: "أبو بكر محمد بن الفضل الكماري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} تفقه على الأستاذ أبي محمد عبد الله بن محمد بن يعقوب السبذموني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} وتفقه عليه القاضي الحسين بن الخضر النسفي، والإمام الحاكم عبد الرحمن بن محمد الكاتب، وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} حفظ كتاب «المبسوط» وورد نيسابور وأقام بها متفقهاً، ثم قدمها حاجاً فحدث بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} قال اللكنوي إنه كان إماماً كبيراً وشيخاً جليلاً، معتمداً في الرواية، مقلداً في الدراية، ومشاهير كتب الفتاوى مشحونة بفتاواه ورواياته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} والمصادر المذكورة: الجواهر المضية، والفوائد البهية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} وفي رأس الترجمة تاريخان مكتوبان «٥٠٨» و«٤٢٦» هجرية، ولم يُبيَّن أيهما الوفاة، فلا يُذكر تاريخ هنا."
  en: "Abu Bakr Muhammad ibn al-Fadl al-Kammari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} He studied fiqh under the master Abu Muhammad Abd Allah ibn Muhammad ibn Ya'qub al-Sabadhmuni. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Al-Qadi al-Husayn ibn al-Khidr al-Nasafi and the imam al-Hakim Abd al-Rahman ibn Muhammad al-Katib, among others, studied fiqh under him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} He memorised al-Mabsut, came to Nishapur and stayed there studying fiqh, and then came back from the pilgrimage and transmitted there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Al-Lucknawi said he was a great imam and an honoured shaykh, reliable in transmission and an imitator in reasoning, and the famous books of fatwas are full of his fatwas and reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} The sources cited are al-Jawahir al-mudiyya and al-Fawa'id al-bahiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} The heading gives two dates, 508 and 426 AH, without saying which is the date of death, so no date is stated here."
  es: "Abu Bakr Muhammad ibn al-Fadl al-Kammari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Estudió fiqh con el maestro Abu Muhammad Abd Allah ibn Muhammad ibn Ya'qub al-Sabadhmuni. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Al-Qadi al-Husayn ibn al-Khidr al-Nasafi y el imán al-Hakim Abd al-Rahman ibn Muhammad al-Katib, entre otros, estudiaron fiqh con él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Memorizó al-Mabsut, vino a Nishapur y se quedó allí estudiando fiqh, y luego regresó de la peregrinación y transmitió allí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Al-Lucknawi dijo que era un gran imán y un jeque honrado, confiable en la transmisión y un imitador en el razonamiento, y los famosos libros de fatwas están llenos de sus fatwas e informes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Las fuentes citadas son al-Jawahir al-mudiyya y al-Fawa'id al-bahiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} El encabezado da dos fechas, 508 y 426 AH, sin decir cuál es la fecha de muerte, por lo que no se indica ninguna fecha aquí."
  fr: "Abou Bakr Muhammad ibn al-Fadl al-Kammari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Il a étudié le fiqh sous la direction du maître Abu Muhammad Abd Allah ibn Muhammad ibn Ya'qub al-Sabadhmuni. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Al-Qadi al-Husayn ibn al-Khidr al-Nasafi et l'imam al-Hakim Abd al-Rahman ibn Muhammad al-Katib, entre autres, ont étudié le fiqh sous lui. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.17712} Il a mémorisé al-Mabsut, est venu à Nishapur et y est resté pour étudier le fiqh, puis est revenu du pèlerinage et s'y est transmis. Al-Lucknawi le qualifiait de grand imam et de cheikh respecté, fiable dans la transmission du savoir et imitateur dans le raisonnement; les recueils de fatwas les plus célèbres regorgent de ses fatwas et de ses hadiths. Les sources citées sont al-Jawahir al-mudiyya et al-Fawa'id al-bahiyya. L'en-tête mentionne deux dates, 508 et 426 AH, sans préciser laquelle est la date du décès; aucune date n'est donc mentionnée."
  ur: "ابوبکر محمد بن الفضل الکماری۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17712} اس نے ماسٹر ابو محمد عبد اللہ بن محمد ابن یعقوب الصبدھمونی سے فقہ کی تعلیم حاصل کی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17712} القادی الحسین ابن الخضر النصفی اور امام الحکیم عبد الرحمن بن محمد الکاتب سمیت دیگر نے ان کے ماتحت فقہ کی تعلیم حاصل کی۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17712} اس نے المبسوط حفظ کیا، نیشاپور آئے اور وہاں رہ کر فقہ کی تعلیم حاصل کی، پھر زیارت سے واپس آئے اور وہاں منتقل ہوئے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17712} لکھنوی نے کہا کہ وہ ایک عظیم امام اور معزز شیخ، نقل میں قابل اعتماد اور استدلال میں تقلید کرنے والے تھے، اور فتاویٰ کی مشہور کتابیں ان کے فتووں اور رپورٹوں سے بھری پڑی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17712} جن ذرائع کا حوالہ دیا گیا ہے وہ الجواہر المدیہ اور الفوائد البحیہ ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17712} عنوان میں دو تاریخیں ہیں، 508 اور 426 ہجری، بغیر یہ کہے کہ کون سی تاریخ وفات ہے، اس لیے یہاں کوئی تاریخ بیان نہیں کی گئی ہے۔"
