summary:
  ar: "عيسى بن لهيعة المصري صاحب كتاب الحلائب والجلائب الذي ذكر فيه كل حلبة أجريت فيها الخيل في الجاهلية والإسلام، وذكر أن سليمان بن داود زود أناساً من الأزد فرساً يصيدون عليه فسمي زاد الراكب {cite:muruj-al-dhahab p. 529}."
  en: "The Egyptian author of al-Hala'ib wa-al-Jala'ib, recording every horse-race run in Jahiliyya and Islam, and of Solomon's mount given to Azdi hunters called 'the rider's provision' {cite:muruj-al-dhahab p. 529}."
  es: "El autor egipcio de al-Hala'ib wa-al-Jala'ib, que registra todas las carreras de caballos en Jahiliyya y el Islam, y de la montura de Salomón entregada a los cazadores azdi, llamó 'la provisión del jinete' {citar:muruj-al-dhahab p. 529}."
  fr: "L'auteur égyptien d'al-Hala'ib wa-al-Jala'ib, enregistrant toutes les courses de chevaux organisées en Jahiliyya et dans l'Islam, et de la monture de Salomon donnée aux chasseurs Azdi appelée « la provision du cavalier » {cite: muruj-al-dhahab p. 529}."
  ur: "الحلائب و الجلائب کے مصری مصنف نے جاہلیت اور اسلام میں گھوڑوں کی دوڑ کی ہر دوڑ اور ازدی شکاریوں کو دیے گئے سلیمان کے پہاڑ کو 'سوار کا رزق' کہا ہے۔ 529}۔"
  tr: "İsa ibn Lahi'ah al-Masri, El-Halayeb ve Cel'ib adlı kitabın yazarı, İslam öncesi ve İslam dönemlerinde atların tutulduğu her arenadan bahsetmiş ve Süleyman bin Davud'un Azd'dan insanlara avlanmaları için bir at sağladığını, bu yüzden bunun binicinin erzakı olarak adlandırıldığını belirtmiştir {atıf:muruj-al-dhahab, s. 529}."
  id: "Isa ibn Lahi'ah al-Masri, penulis buku Al-Halayeb wa al-Jal'ib, di mana ia menyebutkan setiap arena tempat kuda ditahan pada masa pra-Islam dan Islam, serta menyebutkan bahwa Sulayman ibn Dawud menyediakan kuda kepada orang-orang Azd untuk berburu di atasnya, sehingga disebut penyediaan penunggang {cite:muruj-al-dhahab, hlm. 529}."
