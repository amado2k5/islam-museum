summary:
  ar: "معلّم وباحث مصري من أصل أرمني، وكيل نظارة المعارف المصرية من 1884 إلى 1906، ومن أوائل الداعين إلى إنشاء جامعة مصرية، وأول من كتب الحكايات الشعبية المصرية ودوّنها، ورئيس المعهد المصري. كان مسيحيًا، ولاحظت صحافة عصره أن «غير مسلم» يتولى تعليم بلد أغلب أهله مسلمون."
  en: "Egyptian educator and scholar of Armenian origin, undersecretary of the Egyptian Ministry of Public Instruction from 1884 to 1906, among the first advocates of an Egyptian university, the first to write down and record Egyptian folk tales, and president of the Institut Égyptien. He was a Christian, and the press of his day noted that a 'non-Muslim' was in charge of education in a majority-Muslim country."
  ur: "آرمینی نژاد مصری معلم اور محقق، 1884 سے 1906 تک مصری وزارتِ تعلیم کے وکیل، مصری یونیورسٹی کے قیام کے اولین حامیوں میں سے، مصری لوک کہانیوں کو تحریر و تدوین کرنے والے پہلے شخص، اور مصری انسٹی ٹیوٹ کے صدر۔ وہ مسیحی تھے، اور ان کے زمانے کے اخبارات نے نوٹ کیا کہ ایک «غیر مسلم» اکثریتی مسلم ملک کی تعلیم کا نگران ہے۔"
