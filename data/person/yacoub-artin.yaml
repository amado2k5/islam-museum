    note: "Recorded christian on two independent text traditions, which diverge on the branch. The English article states in its text that he was an Armenian Apostolic Christian, and records that a French newspaper in 1888 noted him among the 'non-Muslim' Egyptians in government service, and that in 1895 it was again noted that a 'non-Muslim' was in charge of education for a predominantly Muslim population. The French article describes the Tcherakian family as an Armenian Catholic family from Sivas, and states that he was buried with his family in the Armenian Catholic cemetery in Old Cairo. Each tradition thus names him personally a Christian — the English text by denomination, the French by his family's church and his burial in its cemetery — but they do not agree on whether that church was the Armenian Apostolic or the Armenian Catholic church, so christian is recorded without a branch, under the doubt rule. The Arabic article names no religion for him, and Wikidata carries no religion value at all. His Armenian descent alone would not have been a basis for this value; the two text attestations are."
