id: person/al-sabuni
class: person
label: { ar: "أبو عثمان الصابوني إسماعيل بن عبد الرحمن النيسابوري", en: "Abu Uthman al-Sabuni Isma'il ibn Abd al-Rahman al-Nisaburi", fr: "Abu Uthman al-Sabuni Isma'il ibn Abd al-Rahman al-Nisaburi", es: "Abu Uthman al-Sabuni Isma'il ibn Abd al-Rahman al-Nisaburi", ur: "ابو عثمان الصبونی اسماعیل بن عبدالرحمٰن النسابوری" }
summary:
  ar: "شيخ الإسلام أبو عثمان الصابوني إسماعيل بن عبد الرحمن النيسابوري الشافعي الواعظ المفسر المصنف؛ كان إماماً حافظاً عمدة مقدماً في البلاغة والأدب غريباً من العلوم، جلس للوعظ وله عشر سنين فحضر أول مجلسه أئمة وقته كالسعلوكي وأبي بكر الفراوي وأبي إسحاق الإسفراييني فلازموا مجلسه ويتعجبون من فصاحته وكمال ذكائه؛ وعظ المسلمين سبعين سنة وخطب وصلى في الجامع نحو عشرين سنة، وكان سيف السنة وأفعى أهل البدعة، ومن مصنفاته كتاب الفصول في الأصول؛ قال البيهقي: شيخ الإسلام صدقاً وإمام المسلمين حقاً؛ توفي في صفر سنة تسع وأربعين وأربعمائة وله سبع وسبعون سنة {cite:shadharat-dhahab p. 290-291}."
  en: "Shaykh al-Islam Abu Uthman al-Sabuni Isma'il b. Abd al-Rahman al-Nisaburi — the Shafi'i preacher-exegete who first sat to preach aged ten, with the era's imams (al-Sa'luki, al-Farawi, al-Isfarayini) attending and marvelling; preached seventy years, led the jami' twenty; 'the sword of the Sunna and the asp of the innovators'; author of *al-Fusul fi al-usul*; died Safar 449 aged seventy-seven {cite:shadharat-dhahab p. 290-291}."
  fr: "Cheikh al-Islam Abu Uthman al-Sabuni Isma'il b. Abd al-Rahman al-Nisaburi – le prédicateur-exégète Shafi'i qui s'est assis pour la première fois pour prêcher à l'âge de dix ans, avec les imams de l'époque (al-Sa'luki, al-Farawi, al-Isfarayini) présents et émerveillés ; prêchait soixante-dix ans, a conduit le jami' vingt ; « l'épée de la Sunna et l'asp des innovateurs » ; auteur de *al-Fusul fi al-usul* ; décédé Safar 449 âgé de soixante-dix-sept ans {cite:shadharat-dhahab p. 290-291}."
  es: "Shaykh al-Islam Abu Uthman al-Sabuni Isma'il b. Abd al-Rahman al-Nisaburi — el predicador y exégeta shafi'í que se sentó a predicar por primera vez a los diez años, con los imanes de la época (al-Sa'luki, al-Farawi, al-Isfarayini) presentes y maravillados; predicó setenta años, dirigió el jami' veinte; 'la espada de la Sunna y la víbora de los innovadores'; autor de *al-Fusul fi al-usul*; murió en Safar 449 a los setenta y siete años {cite:shadharat-dhahab p. 290-291}."
  ur: "شیخ الاسلام ابو عثمان الصبونی اسماعیل ب. عبد الرحمٰن النسابوری - ایک شافعی مبلغ - مفسر جو پہلی بار دس سال کی عمر میں تبلیغ کرنے کے لیے بیٹھا تھا، اس دور کے ائمہ ⁦(الصلوکی، الفاروی، الاسفرائنی)⁩ نے شرکت کی اور حیرت زدہ کیا۔ ستر سال تبلیغ کی، بیس کی امامت کی۔ 'سنت کی تلوار اور بدعتیوں کی پشت'؛ مصنف *الفصل فی الاصول*؛ وصال صفر 449 عمر 77۔ 290-291}۔"
  tr: "Şeyh el-İslam Ebu Osman el-Sabuni İsmail ibn Abd al-Rahman al-Nisaburi el-Şafii, vaiz, tefsir ve yazar; imam, ezberci ve hitabet ile edebiyat alanında önde gelen bir figürdü; bilimlerinde seçkin bir figürdü. On yıl boyunca vaaz verdi ve ilk oturumlarına döneminin imamları, el-Sa'luki, Ebu Bekir el-Feravi ve Ebu İshaq el-İsfarayini' gibi dönemin imamları katıldı. Toplantısına katıldılar ve onun hitabeti ve olağanüstü zekası karşısında hayran kaldılar. Yetmiş yıl boyunca Müslümanlara vaaz verdi, vaaz verdi ve yaklaşık yirmi yıl camide namaz kaldı. Sünnetin kılıcı ve yenilik halkının yılanıydı. Eserleri arasında 'El-Fusul el-Usul' adlı kitap da vardır. El-Bayhaki şöyle dedi: İslam şeyhi doğruydu ve Müslümanların İmamı doğruydu; 449 Hicri yılında Sefer'de öldü ve yetmiş yedi yaşındaydı."
  id: "Shaykh al-Islam Abu Uthman al-Sabuni Ismail ibn Abd al-Rahman al-Nisaburi al-Shafi'i, seorang pengkhotbah, penafsir, dan penulis; ia adalah seorang imam, penghafal, dan tokoh terkemuka dalam kefasihan serta sastra, yang terkenal dalam ilmu pengetahuannya. Ia duduk untuk berkhotbah selama sepuluh tahun, dan sesi pertamanya dihadiri oleh imam-imam pada zamannya, seperti al-Sa'luki, Abu Bakr al-Farawi, dan Abu Ishaq al-Isfarayini. Mereka menghadiri mereka terpesona oleh kefasihan dan kecerdasan luar biasanya. Ia berkhotbah kepada umat Muslim selama tujuh puluh tahun, menyampaikan khotbah, dan berdoa di masjid selama sekitar dua puluh tahun. Ia adalah pedang Sunnah dan ular bagi umat inovasi. Di antara karyanya adalah buku 'Al-Fusul fi al-Usul'. Al-Bayhaqi berkata: Sheikh Islam adalah orang yang jujur dan benar-benar Imam umat Islam; ia wafat di Safar pada tahun 449 H dan berusia tujuh puluh tujuh tahun."
