id: person/al-sabuni
class: person
label: { ar: "أبو عثمان الصابوني إسماعيل بن عبد الرحمن النيسابوري", en: "Abu Uthman al-Sabuni Isma'il ibn Abd al-Rahman al-Nisaburi" }
summary:
  ar: "شيخ الإسلام أبو عثمان الصابوني إسماعيل بن عبد الرحمن النيسابوري الشافعي الواعظ المفسر المصنف؛ كان إماماً حافظاً عمدة مقدماً في البلاغة والأدب غريباً من العلوم، جلس للوعظ وله عشر سنين فحضر أول مجلسه أئمة وقته كالسعلوكي وأبي بكر الفراوي وأبي إسحاق الإسفراييني فلازموا مجلسه ويتعجبون من فصاحته وكمال ذكائه؛ وعظ المسلمين سبعين سنة وخطب وصلى في الجامع نحو عشرين سنة، وكان سيف السنة وأفعى أهل البدعة، ومن مصنفاته كتاب الفصول في الأصول؛ قال البيهقي: شيخ الإسلام صدقاً وإمام المسلمين حقاً؛ توفي في صفر سنة تسع وأربعين وأربعمائة وله سبع وسبعون سنة {cite:shadharat-dhahab p. 290-291}."
  en: "Shaykh al-Islam Abu Uthman al-Sabuni Isma'il b. Abd al-Rahman al-Nisaburi — the Shafi'i preacher-exegete who first sat to preach aged ten, with the era's imams (al-Sa'luki, al-Farawi, al-Isfarayini) attending and marvelling; preached seventy years, led the jami' twenty; 'the sword of the Sunna and the asp of the innovators'; author of *al-Fusul fi al-usul*; died Safar 449 aged seventy-seven {cite:shadharat-dhahab p. 290-291}."
