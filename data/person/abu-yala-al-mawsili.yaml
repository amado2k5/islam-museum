summary:
  ar: "أبو يعلى أحمد بن علي بن المثنى التميمي الموصلي ⁦(210-307هـ)⁩، محدث الموصل والجزيرة وصاحب «المسند» و«المعجم»؛ ولد في 3 شوال 210هـ، وارتحل صغيراً باعتناء أبيه وخاله، وسمع من أبي خيثمة وعلي بن الجعد وأبي بكر بن أبي شيبة وطبقتهم، وروى عنه النسائي وابن حبان والطبراني وابن عدي وابن حمدان الحيري؛ وثقه الدارقطني والحاكم وابن حبان، وكان على رأي أبي حنيفة، وعاش سبعاً وتسعين سنة {cite:musnad-abu-yala-marifa-2005 p. 4-11}."
  en: "Abu Ya'la Ahmad ibn 'Ali ibn al-Muthanna al-Tamimi al-Mawsili (210-307 AH), the hadith scholar of Mosul and the Jazira and author of the Musnad and the Mu'jam; born on 3 Shawwal 210, he travelled young under the care of his father and maternal uncle, heard Abu Khaythama, 'Ali ibn al-Ja'd, Abu Bakr ibn Abi Shayba and their generation, and was heard by al-Nasa'i, Ibn Hibban, al-Tabarani, Ibn 'Adi and Ibn Hamdan al-Hiri; al-Daraqutni, al-Hakim and Ibn Hibban declared him trustworthy, he followed Abu Hanifa's school, and he lived ninety-seven years {cite:musnad-abu-yala-marifa-2005 p. 4-11}."
  fr: "Abu Ya'la Ahmad ibn 'Ali ibn al-Muthanna al-Tamimi al-Mawsili (210-307 H), traditionniste de Mossoul et de la Jazira, auteur du Musnad et du Mu'jam. Né le 3 chawwal 210, il voyagea jeune sous la conduite de son père et de son oncle maternel, entendit Abu Khaythama, 'Ali ibn al-Ja'd, Abu Bakr ibn Abi Shayba et leur génération ; al-Nasa'i, Ibn Hibban, al-Tabarani, Ibn 'Adi et Ibn Hamdan al-Hiri l'entendirent. Al-Daraqutni, al-Hakim et Ibn Hibban le déclarèrent fiable ; il suivait l'école d'Abu Hanifa et vécut quatre-vingt-dix-sept ans {cite:musnad-abu-yala-marifa-2005 p. 4-11}."
  ur: "ابو یعلیٰ احمد بن علی بن المثنیٰ تمیمی موصلی ⁦(210-307ھ)⁩، موصل اور جزیرہ کے محدث اور «المسند» و «المعجم» کے مصنف؛ 3 شوال 210ھ کو پیدا ہوئے، کم عمری میں اپنے والد اور ماموں کی سرپرستی میں سفر کیا، ابو خیثمہ، علی بن الجعد، ابو بکر بن ابی شیبہ اور ان کے طبقے سے سنا، اور ان سے نسائی، ابن حبان، طبرانی، ابن عدی اور ابن حمدان حیری نے روایت کی؛ دارقطنی، حاکم اور ابن حبان نے انہیں ثقہ کہا، وہ ابو حنیفہ کے مسلک پر تھے، اور ستانوے برس زندہ رہے {cite:musnad-abu-yala-marifa-2005 p. 4-11}۔"
  es: "Abu Ya'la Ahmad ibn 'Ali ibn al-Muthanna al-Tamimi al-Mawsili (210-307 AH), erudito de hadices de Mosul y la Jazira y autor del Musnad y el Mu'jam; nació el 3 de Shawwal de 210, viajó joven bajo el cuidado de su padre y su tío materno, escuchó a Abu Khaythama, 'Ali ibn al-Ja'd, Abu Bakr ibn Abi Shayba y su generación, y fue escuchado por al-Nasa'i, Ibn Hibban, al-Tabarani, Ibn 'Adi e Ibn Hamdan al-Hiri; al-Daraqutni, al-Hakim e Ibn Hibban lo declararon digno de confianza, siguió la escuela de Abu Hanifa y vivió noventa y siete años {cite:musnad-abu-yala-marifa-2005 p. 4-11}."
  tr: "Musul ve Cezire hadis alimi, “el-Musnad” ve “el-Mu'cem” eserlerinin yazarı Ebu Yala Ahmed ibn Ali ibn el-Muthanna el-Tamimi el-Mevsili (210-307 Hicri); Hicri 210 yılının Şevval ayının 3. gününde doğmuş, genç yaşta babası ve dayısının himayesinde yolculuk etmiş, Ebu Hayteme, Ali ibn el-Câd, Ebu Bekr ibn Ebu Şeybe ve çağdaşlarından hadisler işitmiş, el-Nesai, İbn Hibban, el-Taberani, İbn Adi ve İbn Hamdan el-Hiri ondan rivayet etmişlerdir; el-Daraqutni, el-Hakim ve İbn Hibban onu güvenilir kabul etmiş, Ebu Hanife'nin görüşünü benimsemiş ve doksan yedi yıl yaşamıştır. {Kaynak:musnad-abu-yala-marifa-2005 s. 4-11}"
  id: "Abu Yala Ahmad ibn Ali ibn al-Muthanna al-Tamimi al-Mawsili (210-307 H), ulama hadits dari Mosul dan Jazira, dan penulis “al-Musnad” dan “al-Mu’jam”; beliau lahir pada tanggal 3 Syawal 210 H, dan beliau melakukan perjalanan sebagai anak kecil di bawah pengawasan ayah dan paman dari pihak ibunya, dan beliau mendengar hadits dari Abu Khaythama, Ali ibn al-Ja’d, Abu Bakr ibn Abi Shayba dan para sezaman mereka, dan al-Nasa’i, Ibn Hibban, al-Tabarani, Ibn Adi dan Ibn Hamdan al-Hiri meriwayatkan darinya; al-Daraqutni, al-Hakim dan Ibn Hibban menganggapnya dapat dipercaya, dan beliau mengikuti pendapat Abu Hanifa, dan beliau hidup selama sembilan puluh tujuh tahun {cite:musnad-abu-yala-marifa-2005 p. 4-11}."
