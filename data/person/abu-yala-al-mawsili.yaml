summary:
  ar: "أبو يعلى أحمد بن علي بن المثنى التميمي الموصلي (210-307هـ)، محدث الموصل والجزيرة وصاحب «المسند» و«المعجم»؛ ولد في 3 شوال 210هـ، وارتحل صغيراً باعتناء أبيه وخاله، وسمع من أبي خيثمة وعلي بن الجعد وأبي بكر بن أبي شيبة وطبقتهم، وروى عنه النسائي وابن حبان والطبراني وابن عدي وابن حمدان الحيري؛ وثقه الدارقطني والحاكم وابن حبان، وكان على رأي أبي حنيفة، وعاش سبعاً وتسعين سنة {cite:musnad-abu-yala-marifa-2005 p. 4-11}."
  en: "Abu Ya'la Ahmad ibn 'Ali ibn al-Muthanna al-Tamimi al-Mawsili (210-307 AH), the hadith scholar of Mosul and the Jazira and author of the Musnad and the Mu'jam; born on 3 Shawwal 210, he travelled young under the care of his father and maternal uncle, heard Abu Khaythama, 'Ali ibn al-Ja'd, Abu Bakr ibn Abi Shayba and their generation, and was heard by al-Nasa'i, Ibn Hibban, al-Tabarani, Ibn 'Adi and Ibn Hamdan al-Hiri; al-Daraqutni, al-Hakim and Ibn Hibban declared him trustworthy, he followed Abu Hanifa's school, and he lived ninety-seven years {cite:musnad-abu-yala-marifa-2005 p. 4-11}."
  ur: "ابو یعلیٰ احمد بن علی بن المثنیٰ تمیمی موصلی (210-307ھ)، موصل اور جزیرہ کے محدث اور «المسند» و «المعجم» کے مصنف؛ 3 شوال 210ھ کو پیدا ہوئے، کم عمری میں اپنے والد اور ماموں کی سرپرستی میں سفر کیا، ابو خیثمہ، علی بن الجعد، ابو بکر بن ابی شیبہ اور ان کے طبقے سے سنا، اور ان سے نسائی، ابن حبان، طبرانی، ابن عدی اور ابن حمدان حیری نے روایت کی؛ دارقطنی، حاکم اور ابن حبان نے انہیں ثقہ کہا، وہ ابو حنیفہ کے مسلک پر تھے، اور ستانوے برس زندہ رہے {cite:musnad-abu-yala-marifa-2005 p. 4-11}۔"
