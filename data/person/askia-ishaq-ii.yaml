summary:
  ar: "آخر حاكم فعلي لإمبراطورية صنغاي (حكم 1588–1591)، ابن أسكيا داود. بُويع في جاو في 10 أبريل 1588، فواجه الغزو المغربي السعدي الذي أرسله أحمد المنصور، فانهار جيشه أمام أسلحة المغاربة النارية في معركة تونديبي (مارس 1591) ونُهبت جاو وتمبكتو وجيني. وبعد خلعه في المنفى قُتل في بيلانغا في أبريل 1592."
  en: "Last effective Askia of the Songhai Empire (r. 1588-1591), a son of Askia Dawud. Proclaimed at Gao on 10 April 1588, he faced the Saadian Moroccan invasion sent by Ahmad al-Mansur; his army broke before Moroccan firearms at the Battle of Tondibi (March 1591) and Gao, Timbuktu and Djenne were looted. Deposed in exile, he was killed at Bilanga in April 1592."
  ur: "سلطنت سونگھائی کے آخری مؤثر آسکیا (دورِ حکومت 1588ء–1591ء)، آسکیا داؤد کے بیٹے۔ 10 اپریل 1588ء کو گاؤ میں تخت نشین ہوئے؛ احمد المنصور کی بھیجی ہوئی سعدی مراکشی فوج کا سامنا کیا، توندیبی کی لڑائی (مارچ 1591ء) میں ان کی فوج مراکشی آتشیں اسلحے کے سامنے بکھر گئی اور گاؤ، تمبکٹو اور جینے لوٹے گئے۔ جلاوطنی میں معزولی کے بعد اپریل 1592ء میں بیلانگا میں قتل ہوئے۔"

