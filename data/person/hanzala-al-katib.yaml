id: person/hanzala-al-katib
class: person
label: { ar: "حنظلة الكاتب" }
summary:
  ar: "عند البلاذري: حنظلة بن الربيع بن رباح الأسدي من بني تميم الملقب حنظلة الكاتب بعثه خالد مع المثنى بن حارثة إلى جابان بمستر فهرب جابان لما انتهيا إليه."
  en: "In al-Baladhuri: Hanzala ibn al-Rabi' ibn Rabah al-Asadi of Banu Tamim, nicknamed Hanzala the Scribe; Khalid sent him with al-Muthanna ibn Haritha against Jaban at Tustar, who fled at their approach."
  es: "En al-Baladhuri: Hanzala ibn al-Rabi' ibn Rabah al-Asadi de Banu Tamim, apodado Hanzala el Escriba; Khalid lo envió con al-Muthanna ibn Haritha contra Jaban en Tustar, quien huyó cuando se acercaron."
  fr: "Dans al-Baladhuri: Hanzala ibn al-Rabi' ibn Rabah al-Asadi de Banu Tamim, surnommé Hanzala le Scribe; Khalid l'envoya avec al-Muthanna ibn Haritha contre Jaban à Tustar, qui s'enfuit à leur approche."
  ur: "البلادوری میں ہے: بنو تمیم کے حنظلہ بن الربیع بن رباح الاسدی، جن کا نام حنظلہ فقیہ ہے۔ خالد نے اسے المثنیٰ بن حارثہ کے ساتھ جبان کے خلاف تستار کے مقام پر بھیجا، جو ان کے قریب پہنچ کر بھاگ گئے۔"
  tr: "Al-Baladhuri'ye göre: Banu Tamim'den Hanzala ibn al-Rabi' ibn Rabah al-Asadi, lakaplı Hanzala the scribe, Halid tarafından al-Muthanna ibn Haritha ile birlikte Jaban'a Mister'a gönderildi, ancak onlar ona ulaştığında Jaban'a kaçtı."
  id: "Menurut Al-Baladhuri: Hanzala ibn al-Rabi' ibn Rabah al-Asadi dari Banu Tamim, dijuluki Hanzala sang juru tulis, dikirim oleh Khalid bersama al-Muthanna ibn Haritha ke Jaban di Mister, tetapi ia melarikan diri ke Jaban ketika mereka sampai kepadanya."
