roles: [writer]
summary:
  ar: "خالد محمد خالد، كاتب مصري صاحب «رجال حول الرسول» وكتب في الخلفاء الأربعة ⁦(«وجاء أبو بكر»، «بين يدي عمر»، «في رحاب علي»، «وداعاً عثمان»)⁩ وكتب في الحرية والديمقراطية منها «من هنا نبدأ» و«مواطنون لا رعايا» و«الديمقراطية أبداً»، كما تعدّها قائمة مؤلفاته في طبعة دار المقطم."
  en: "Khalid Muhammad Khalid, an Egyptian writer, author of Rijal Hawl al-Rasul and of books on the four caliphs (Wa-Ja'a Abu Bakr, Bayna Yaday Umar, Fi Rihab Ali, Wada'an Uthman) and on freedom and democracy, among them Min Huna Nabda', Muwatinun la Ra'aya and al-Dimuqratiyya Abadan, as listed in the Dar al-Muqattam edition."
  es: "Khalid Muhammad Khalid, escritor egipcio, autor de Rijal Hawl al-Rasul y de libros sobre los cuatro califas (Wa-Ja'a Abu Bakr, Bayna Yaday Umar, Fi Rihab Ali, Wada'an Uthman) y sobre la libertad y la democracia, entre ellos Min Huna Nabda', Muwatinun la Ra'aya y al-Dimuqratiyya Abadan, como se enumera en la edición de Dar al-Muqattam."
  fr: "Khalid Muhammad Khalid, écrivain égyptien, auteur de Rijal Hawl al-Rasul et de livres sur les quatre califes (Wa-Ja'a Abu Bakr, Bayna Yaday Umar, Fi Rihab Ali, Wada'an Uthman) et sur la liberté et la démocratie, parmi lesquels Min Huna Nabda', Muwatinun la Ra'aya et al-Dimuqratiyya Abadan, répertoriés dans l'édition Dar al-Muqattam."
  ur: "خالد محمد خالد، مصری مصنف، رجال حول الرسول کے مصنف اور چاروں خلفاء ⁦(و جع ابوبکر، بینا یاد عمر، فی رحاب علی، وداعان عثمان)⁩ اور آزادی اور جمہوریت پر کتابوں کے مصنف، ان میں سے من حنا نبدہ، موطنون لا رعایا اور دارالعظیم میں کتابیں ہیں۔ المقطم ایڈیشن۔"
  tr: "Halid Muhammed Halid, 'Peygamberin Etrafındaki Adamlar' adlı eseriyle Mısırlı bir yazardı ve dört halife hakkında yazdı ('Ve Ebu Bekir Uzaklaştı', 'Ömer'den Önce', 'Ali'nin İnzivasında', 'Osman'a Veda'), ayrıca özgürlük ve demokrasi üzerine yazdı; bunlar arasında 'Buradan Başlıyoruz', 'Vatandaşlar Olmadan Vatandaşlar' ve 'Demokrasi Dahil' gibi eserleri Dar Al-Mokattam tarafından yayımlanmıştır."
  id: "Khaled Muhammad Khaled adalah seorang penulis Mesir dengan 'Men Around the Prophet' dan menulis tentang empat khalifah ('Dan Abu Bakr Pergi Jauh,' 'Sebelum Umar,' 'Dalam Mundurnya Ali,' 'Selamat Tinggal Uthman'), serta menulis tentang kebebasan dan demokrasi, termasuk 'Dari Sini Kita Mulai,' 'Warga Tanpa Subjek,' dan 'Demokrasi Selamanya,' sebagaimana tercantum dalam karya-karyanya yang diterbitkan oleh Dar Al-Mokattam."
