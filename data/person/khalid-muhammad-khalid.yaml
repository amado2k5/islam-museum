summary:
  ar: "خالد محمد خالد، كاتب مصري صاحب «رجال حول الرسول» وكتب في الخلفاء الأربعة ⁦(«وجاء أبو بكر»، «بين يدي عمر»، «في رحاب علي»، «وداعاً عثمان»)⁩ وكتب في الحرية والديمقراطية منها «من هنا نبدأ» و«مواطنون لا رعايا» و«الديمقراطية أبداً»، كما تعدّها قائمة مؤلفاته في طبعة دار المقطم."
  en: "Khalid Muhammad Khalid, an Egyptian writer, author of Rijal Hawl al-Rasul and of books on the four caliphs (Wa-Ja'a Abu Bakr, Bayna Yaday Umar, Fi Rihab Ali, Wada'an Uthman) and on freedom and democracy, among them Min Huna Nabda', Muwatinun la Ra'aya and al-Dimuqratiyya Abadan, as listed in the Dar al-Muqattam edition."
