summary:
  ar: "زعيم تاوسوغ من سولو في الفلبين، قاتل في الحرب العالمية الثانية، ثم قاد بين 1948 و1955 تمردًا مسلحًا ضد الحكومة الفلبينية مطالبًا بسيادة سلطنة سولو، واستسلم مرارًا وسُجن وحُكم عليه بالسجن المؤبد، ثم عفا عنه الرئيس ماركوس، ويُعد بطلًا شعبيًا عند التاوسوغ."
  en: "Tausūg leader from Sulu in the Philippines who fought in the Second World War and then, between 1948 and 1955, led an armed uprising against the Philippine government asserting the sovereignty of the Sultanate of Sulu. He surrendered repeatedly, was sentenced to life imprisonment, and was finally pardoned by President Ferdinand Marcos; he is regarded as a folk hero among the Tausūg."
  ur: "فلپائن کے سولو سے تعلق رکھنے والے تاوسوگ رہنما، جنھوں نے دوسری جنگ عظیم میں حصہ لیا اور پھر 1948 سے 1955 تک فلپائنی حکومت کے خلاف مسلح بغاوت کی قیادت کی جس کا مقصد سلطنت سولو کی خودمختاری کا دعویٰ تھا۔ وہ بارہا ہتھیار ڈالتے رہے، انھیں عمر قید کی سزا ہوئی اور آخرکار صدر فرڈیننڈ مارکوس نے انھیں معاف کر دیا؛ تاوسوگ عوام میں وہ لوک ہیرو مانے جاتے ہیں۔"
