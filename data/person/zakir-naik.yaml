summary:
  ar: "داعية هندي وطبيب، وُلد في مومباي سنة 1965. أسس مؤسسة البحوث الإسلامية وترأسها، وأسس سنة 2006 شبكة «بيس تي في» الفضائية، واشتهر بمحاضرات بالإنجليزية ومناظرات في مقارنة الأديان بلغت بحسب المصادر أكثر من أربعة آلاف محاضرة. ومنذ 2016 يقيم في ماليزيا بصفة مقيم دائم، وتتهمه السلطات الهندية بخطاب الكراهية وغسل الأموال، وهي اتهامات ينفيها."
  en: "Indian preacher and physician, born in Bombay (Mumbai) in 1965. He founded and presides over the Islamic Research Foundation and founded the Peace TV satellite network in 2006, becoming known for English-language lectures and debates in comparative religion — more than 4,000 lectures, according to the sources. Since 2016 he has lived in Malaysia as a permanent resident; the Indian authorities accuse him of hate speech and money laundering, charges he denies."
  ur: "ہندوستانی مبلغ اور طبیب، جو 1965 میں ممبئی میں پیدا ہوئے۔ انہوں نے اسلامی ریسرچ فاؤنڈیشن کی بنیاد رکھی اور اس کے صدر ہیں، اور 2006 میں پیس ٹی وی سیٹلائٹ نیٹ ورک قائم کیا؛ انگریزی میں تقاریر اور تقابلِ ادیان کے مباحثوں سے مشہور ہوئے — ماخذوں کے مطابق چار ہزار سے زائد لیکچر۔ 2016 سے وہ ملائیشیا میں مستقل رہائشی کی حیثیت سے مقیم ہیں؛ ہندوستانی حکام ان پر نفرت انگیز تقریر اور منی لانڈرنگ کے الزامات لگاتے ہیں، جن کی وہ تردید کرتے ہیں۔"
