summary:
  ar: محمد ماجد ⁦(1965–)⁩ إمام سوداني أمريكي، مدير مركز ADAMS في فرجينيا ورئيس سابق للجمعية الإسلامية لأمريكا الشمالية ⁦(ISNA)⁩، معروف ببناء الجسور بين الأديان وبمكافحة التطرف.
  en: Mohammed Magid (born 1965) is a Sudanese-American imam, executive director and imam of the ADAMS Centre in Virginia and a past president of the Islamic Society of North America (ISNA), known for interfaith
    bridge-building and counter-extremism work.
  ur: محمد ماجد ⁦(1965–)⁩ سوڈانی نژاد امریکی امام ہیں، ورجینیا کے ADAMS سینٹر کے ایگزیکٹو ڈائریکٹر و امام اور ISNA کے سابق صدر؛ بین المذاہب پُل اور انتہا پسندی کے خلاف کام کے لیے مشہور ہیں۔
  es: "Mohammed Magid (nacido en 1965) es un imán sudanés-estadounidense, director ejecutivo e imán del Centro ADAMS en Virginia y expresidente de la Sociedad Islámica de América del Norte (ISNA), conocida por su labor en la construcción de puentes interreligiosos y la lucha contra el extremismo."
  fr: "Mohammed Magid (né en 1965) est un imam soudano-américain, directeur exécutif et imam du centre ADAMS en Virginie et ancien président de la Société islamique d'Amérique du Nord (ISNA), connu pour son travail de construction de ponts interreligieux et de lutte contre l'extrémisme."
  tr: "Mohammed Majid (1965–), Sudanlı-Amerikalı bir imam, Virginia'daki ADAMS Merkezi'nin direktörü ve Kuzey Amerika İslam Cemiyeti'nin (ISNA) eski başkanıdır; dinler arasında köprüler kurması ve aşırılıkla mücadelesiyle tanınır."
  id: "Mohammed Majid (1965–) adalah seorang imam Sudan-Amerika, direktur ADAMS Center di Virginia, dan mantan presiden Islamic Society of North America (ISNA), yang dikenal karena membangun jembatan antara agama dan memerangi ekstremisme."
