summary:
  ar: "إتش إم نقوي (وُلد سنة 1973 بتأريخ المقالة الإنجليزية) روائي باكستاني يقيم في كراتشي. وُلد في لندن ونشأ في كراتشي، وتخرج في جامعة جورج تاون سنة 1996، وعمل في البنك الدولي من 1997 إلى 2003، ودرس الكتابة الإبداعية في جامعة بوسطن بإشراف ها جين. فازت روايته الأولى «Home Boy» (2009)، عن ثلاثة شبان باكستانيين في نيويورك بعد هجمات أيلول 2001، بجائزة «دي إس سي» الأولى لأدب جنوب آسيا سنة 2011؛ وصدرت روايته الثانية «The Selected Works of Abdullah the Cossack» سنة 2019."
  en: "H. M. Naqvi (born 1973 on the English article's dating) is a Pakistani novelist based in Karachi. Born in London and brought up in Karachi, he graduated from Georgetown University in 1996, worked at the World Bank from 1997 to 2003, and studied creative writing at Boston University under Ha Jin. His debut novel Home Boy (2009), about three young Pakistanis in New York after the September 2001 attacks, won the inaugural DSC Prize for South Asian Literature in 2011; his second novel, The Selected Works of Abdullah the Cossack, appeared in 2019."
  ur: "ایچ ایم نقوی (پیدائش 1973، انگریزی مقالے کی تاریخ کے مطابق) کراچی میں مقیم پاکستانی ناول نگار ہیں۔ لندن میں پیدا ہوئے، کراچی میں پلے بڑھے، 1996 میں جارج ٹاؤن یونیورسٹی سے فارغ التحصیل ہوئے، 1997 سے 2003 تک ورلڈ بینک میں کام کیا، اور بوسٹن یونیورسٹی میں ہا جن کے زیرِ نگرانی تخلیقی تحریر پڑھی۔ ان کے پہلے ناول «Home Boy» (2009) نے، جو ستمبر 2001 کے حملوں کے بعد نیویارک میں تین نوجوان پاکستانیوں کی کہانی ہے، 2011 میں جنوبی ایشیائی ادب کا پہلا ڈی ایس سی انعام جیتا؛ دوسرا ناول «The Selected Works of Abdullah the Cossack» 2019 میں آیا۔"

