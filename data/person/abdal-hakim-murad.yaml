summary:
  ar: "باحث بريطاني في الدراسات الإسلامية، وُلد في لندن سنة 1960 باسم تيموثي جون وينتر واعتنق الإسلام في شبابه، وأسس كلية كامبريدج الإسلامية سنة 2009 ويتولى عمادتها، وهو محاضر كرسي الشيخ زايد للدراسات الإسلامية في جامعة كامبريدج، عُرف بكتاباته في التقليدية الإسلامية الجديدة وترجماته لنصوص كلاسيكية."
  en: "British Islamic scholar, born Timothy John Winter in London in 1960; he converted to Islam in his youth, founded the Cambridge Muslim College in 2009 and serves as its dean, and is the Shaykh Zayed Lecturer in Islamic Studies at the University of Cambridge, known for neo-traditionalist writing and translations of classical texts."
  fr: "Savant musulman britannique, né Timothy John Winter à Londres en 1960 ; converti à l'islam dans sa jeunesse, il fonda le Cambridge Muslim College en 2009 et en est le doyen, et il est Shaykh Zayed Lecturer en études islamiques à l'université de Cambridge, connu pour ses écrits néo-traditionalistes et ses traductions de textes classiques."
  ur: "برطانوی ماہرِ اسلامیات، جو 1960 میں لندن میں ٹموتھی جان ونٹر کے نام سے پیدا ہوئے اور جوانی میں اسلام قبول کیا؛ وہ 2009 سے کیمبرج مسلم کالج کے بانی اور ڈین ہیں اور جامعہ کیمبرج میں شیخ زاید لیکچرر برائے اسلامی مطالعات ہیں، اور اپنی نئی روایت پسند تحریروں اور کلاسیکی متون کے تراجم کے لیے جانے جاتے ہیں۔"
  es: "Timothy John Winter, erudito islámico británico nacido en Londres en 1960, se convirtió al islam en su juventud, fundó el Cambridge Muslim College en 2009 y ejerce como su decano. Además, es profesor titular de la cátedra Shaykh Zayed de Estudios Islámicos en la Universidad de Cambridge, conocido por sus escritos neotradicionalistas y sus traducciones de textos clásicos."
  tr: "1960 yılında Londra'da Timothy John Winter olarak doğan, İslam araştırmaları alanında uzmanlaşmış İngiliz bir akademisyendir. Genç yaşta İslamiyet'i kabul etmiştir. 2009 yılında Cambridge İslam Koleji'ni kurmuş ve dekanlığını yapmaktadır. Cambridge Üniversitesi'nde Şeyh Zayed İslam Araştırmaları Kürsüsü'nde öğretim görevlisidir. Neo-geleneksel İslam üzerine yazıları ve klasik metinlerin çevirileriyle tanınmaktadır."
  id: "Seorang cendekiawan Inggris di bidang studi Islam, lahir di London pada tahun 1960 dengan nama Timothy John Winter, ia memeluk Islam di masa mudanya. Ia mendirikan Cambridge Islamic College pada tahun 2009 dan menjabat sebagai dekan di sana. Ia adalah dosen di Kursi Sheikh Zayed untuk Studi Islam di Universitas Cambridge. Ia dikenal karena tulisannya tentang Islam neo-tradisional dan terjemahannya atas teks-teks klasik."
