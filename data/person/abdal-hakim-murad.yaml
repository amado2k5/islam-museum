summary:
  ar: "باحث بريطاني في الدراسات الإسلامية، وُلد في لندن سنة 1960 باسم تيموثي جون وينتر واعتنق الإسلام في شبابه، وأسس كلية كامبريدج الإسلامية سنة 2009 ويتولى عمادتها، وهو محاضر كرسي الشيخ زايد للدراسات الإسلامية في جامعة كامبريدج، عُرف بكتاباته في التقليدية الإسلامية الجديدة وترجماته لنصوص كلاسيكية."
  en: "British Islamic scholar, born Timothy John Winter in London in 1960; he converted to Islam in his youth, founded the Cambridge Muslim College in 2009 and serves as its dean, and is the Shaykh Zayed Lecturer in Islamic Studies at the University of Cambridge, known for neo-traditionalist writing and translations of classical texts."
  ur: "برطانوی ماہرِ اسلامیات، جو 1960 میں لندن میں ٹموتھی جان ونٹر کے نام سے پیدا ہوئے اور جوانی میں اسلام قبول کیا؛ وہ 2009 سے کیمبرج مسلم کالج کے بانی اور ڈین ہیں اور جامعہ کیمبرج میں شیخ زاید لیکچرر برائے اسلامی مطالعات ہیں، اور اپنی نئی روایت پسند تحریروں اور کلاسیکی متون کے تراجم کے لیے جانے جاتے ہیں۔"
