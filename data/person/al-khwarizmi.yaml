summary:
  ar: "محمد بن موسى الخوارزمي، عالم رياضيات وفلك وجغرافيا عمل في بيت الحكمة ببغداد في خلافة المأمون، وعدّه المسعودي فيمن عُني بعلوم الهيئة بعد ظهور الإسلام {cite:muruj-al-dhahab p. 519}. ترجمت إلى اللاتينية في إسبانيا أعمال له كثيرة، منها كتابه في الجبر وجداوله الفلكية، وصار اسمه أصل كلمة الخوارزمية. ألّف أيضاً كتاباً في صورة الأرض ذكر فيه إحداثيات البلدان في توافق مع بطليموس، وكتباً في الأسطرلاب والتقويم اليهودي والتاريخ."
  en: "Muhammad ibn Musa al-Khwarizmi was a mathematician, astronomer and geographer who worked in the House of Wisdom in Baghdad under al-Ma'mun, and al-Mas'udi numbered him among Islam's astronomers {cite:muruj-al-dhahab p. 519}. Many of his works, among them his algebra and his astronomical tables, were translated into Latin in Spain, and his name gave rise to the word algorithm. He also wrote a geography listing coordinates in harmony with Ptolemy, and works on the astrolabe, the Jewish calendar and history."
  ur: "محمد بن موسیٰ خوارزمی ریاضی دان، ماہرِ فلکیات اور جغرافیہ دان تھے جنہوں نے مامون کے عہد میں بغداد کے بیت الحکمہ میں کام کیا، اور مسعودی نے انہیں اسلام کے ماہرینِ ہیئت میں شمار کیا {cite:muruj-al-dhahab p. 519}۔ ان کی بہت سی تصانیف، جن میں الجبرا کی کتاب اور فلکیاتی جدولیں شامل ہیں، ہسپانیہ میں لاطینی میں ترجمہ ہوئیں، اور ان کے نام سے لفظ الگورتھم نکلا۔ انہوں نے بطلیموس سے ہم آہنگ محددات کی جغرافیہ، اور اسطرلاب، یہودی تقویم اور تاریخ پر بھی کتابیں لکھیں۔"
