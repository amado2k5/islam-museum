label: { ar: "ابنة النعمان بن بشير زوجة المختار", en: "al-Nu'man ibn Bashir's daughter", es: "al-Nu'man ibn Bashir's daughter", fr: "al-Nu'man ibn Bashir's daughter", ur: "نعمان بن بشیر کی بیٹی" }
summary:
  ar: "إحدى حرم المختار بن أبي عبيد، لما أتى مصعب بن الزبير بهن فدعاهن إلى البراءة منه أبت وقالت شهادة أرزقها فأتركها آتي مع ابن هند فأتبعه وأترك ابن أبي طالب اللهم اشهد أني متبعة لنبيك وابن بنته وأهل بيته وشيعته فقدمها فقتلت صبراً، وفيها قال الشاعر إن من أعجب الأعاجيب عندي قتل بيضاء حرة عطبول {cite:muruj-al-dhahab p. 93}."
  en: "al-Mukhtar's wife who refused the sword-point recantation — 'shall I follow Ibn Hind and abandon Ibn Abi Talib? God, I follow Your prophet and his daughter's son' — and was martyred, the elegy mourning 'a noble free woman killed for no crime' {cite:muruj-al-dhahab p. 93}."
  es: "La esposa de al-Mukhtar, que se negó a la retractación a punta de espada —«¿Debo seguir a Ibn Hind y abandonar a Ibn Abi Talib? Dios, yo sigo a Tu profeta y al hijo de su hija»— y fue martirizada, la elegía lamenta a «una noble mujer libre asesinada sin crimen alguno» {cite:muruj-al-dhahab p. 93}."
  fr: "L'épouse d'al-Mukhtar qui refusa l'abjuration sous la menace de l'épée — « Dois-je suivre Ibn Hind et abandonner Ibn Abi Talib ? Ô Dieu, je suis Ton prophète et le fils de sa fille » — et fut martyrisée, l'élégie pleurant « une noble femme libre tuée sans crime » {cite: muruj-al-dhahab p. 93}."
  ur: "المختار کی بیوی جس نے تلوار کی نوک سے انکار کیا تھا - کیا میں ابن ہند کی پیروی کروں اور ابن ابی طالب کو چھوڑ دوں؟ خدا، میں تیرے نبی اور ان کی بیٹی کے بیٹے کی پیروی کرتا ہوں' - اور شہید کیا گیا تھا، عالیشان ماتم 'ایک عظیم آزاد عورت کو بغیر کسی جرم کے قتل کیا گیا' {حوالہ: مروج الذہاب صفحہ 93}۔"
  tr: "el-Muhtar bin Ebi Übeyd'in haremlerinden biri. Mus'ab ibn al-Zubeyr onlara gelip kendisinden vazgeçmelerini istediğinde, reddetti ve dedi ki, 'Ona bir tanıklık edeceğim, bırak onu. İbn Hind ile gidip onu takip edeceğim ve İbn Ebi Talib'i bırakacağım.' Ey Allah, şahit ol ki Peygamberin, kızının oğlu, ailesi ve Şii'nin peşinden gittiğimi. O onu verdi ve o da Sabra'yı öldürdü. Bu bağlamda şair şöyle dedi: Bulduğum mucizelerden biri, özgür beyaz bir kadının öldürülmesi, Atbul {cite:muruj-al-dhahab, s. 93}."
  id: "Salah satu harem al-Mukhtar ibn Abi Ubaid. Ketika Mus'ab ibn al-Zubayr datang kepada mereka dan memanggil mereka untuk mencacatnya, dia menolak dan berkata, 'Aku akan memberinya kesaksian, jadi tinggalkan dia. Aku akan pergi bersama Ibn Hind dan mengikutinya, dan meninggalkan Ibn Abi Talib.' Ya Allah, bersaksilah bahwa aku mengikuti Nabi-Mu, putra putrinya, keluarganya, dan Syiah-nya. Dia menyerahkannya, dan dia membunuh Sabra. Dalam hal ini, penyair berkata: Di antara keajaiban yang kutemukan adalah pembunuhan seorang wanita kulit putih merdeka, Atbul {cite:muruj-al-dhahab, hlm. 93}."
