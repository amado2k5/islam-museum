summary:
  ar: "أبو نصر ابن الحناط الشيرازي، أخذ الفقه عن أبيه أبي عبد الله الحناط، فقيه أصولي فصيح صوفي شاعر، ومات بفيد في طريق مكة، وله مصنفات كثيرة في الفقه وأصوله، وعنه أخذ فقهاء شيراز {cite:tabaqat-fuqaha-abbas-1981 p. 64}. يحكي الكتاب أنه أو أباه تكلم في مجلس نظر فأعجب الحاضرين، فاعترض عليه أبو سعد بشر بن الحسين الداودي، فأجاب بما نقله الكتاب {cite:tabaqat-fuqaha-abbas-1981 p. 64}. لم يذكر الشيرازي سنة وفاته."
  en: "Abu Nasr ibn al-Hannat al-Shirazi studied fiqh under his father Abu Abd Allah al-Hannat; a jurist and theorist of legal method (usuli), eloquent, a Sufi and a poet, he died at Fayd on the road to Mecca. He wrote many works on fiqh and its principles, and the jurists of Shiraz learned from him {cite:tabaqat-fuqaha-abbas-1981 p. 64}. The book relates that he, or his father, spoke in a session of disputation and impressed those present; Abu Sa'd Bishr ibn al-Husayn al-Dawudi objected to him, and he answered with what the book transmits {cite:tabaqat-fuqaha-abbas-1981 p. 64}. The author (al-Shirazi) does not record the year of his death."
  fr: "Abu Nasr ibn al-Hannat al-Shirazi étudia le fiqh auprès de son père Abu Abd Allah al-Hannat ; juriste et théoricien de la méthode juridique (usuli), éloquent, soufi et poète, il mourut à Fayd sur la route de La Mecque. Il écrivit de nombreux ouvrages sur le fiqh et ses fondements, et les juristes de Shiraz apprirent de lui {cite:tabaqat-fuqaha-abbas-1981 p. 64}. Le livre rapporte que lui, ou son père, prit la parole dans une séance de disputation et impressionna l'assistance ; Abu Sa'd Bishr ibn al-Husayn al-Dawudi lui fit une objection, et il répondit par ce que le livre transmet {cite:tabaqat-fuqaha-abbas-1981 p. 64}. L'auteur (al-Shirazi) ne consigne pas l'année de sa mort."
  es: "Abu Nasr ibn al-Hannat al-Shirazi estudió fiqh con su padre, Abu Abd Allah al-Hannat, jurista y teórico del método jurídico (usuli), elocuente, sufí y poeta. Murió en Fayd, en el camino a La Meca. Escribió numerosas obras sobre fiqh y sus principios, y los juristas de Shiraz aprendieron de él {cite:tabaqat-fuqaha-abbas-1981 p. 64}. El libro relata que él, o su padre, intervino en una sesión de debate e impresionó a los presentes; Abu Sa'd Bishr ibn al-Husayn al-Dawudi le rebatió, y él respondió con lo que transmite el libro {cite:tabaqat-fuqaha-abbas-1981 p. 64}. El autor (al-Shirazi) no registra el año de su muerte."
