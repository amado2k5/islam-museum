summary:
  ar: "أبو نصر ابن الحناط الشيرازي، أخذ الفقه عن أبيه أبي عبد الله الحناط، فقيه أصولي فصيح صوفي شاعر، ومات بفيد في طريق مكة، وله مصنفات كثيرة في الفقه وأصوله، وعنه أخذ فقهاء شيراز {cite:tabaqat-fuqaha-abbas-1981 p. 64}. يحكي الكتاب أنه أو أباه تكلم في مجلس نظر فأعجب الحاضرين، فاعترض عليه أبو سعد بشر بن الحسين الداودي، فأجاب بما نقله الكتاب {cite:tabaqat-fuqaha-abbas-1981 p. 64}. لم يذكر الشيرازي سنة وفاته."
  en: "Abu Nasr ibn al-Hannat al-Shirazi studied fiqh under his father Abu Abd Allah al-Hannat; a jurist and theorist of legal method (usuli), eloquent, a Sufi and a poet, he died at Fayd on the road to Mecca. He wrote many works on fiqh and its principles, and the jurists of Shiraz learned from him {cite:tabaqat-fuqaha-abbas-1981 p. 64}. The book relates that he, or his father, spoke in a session of disputation and impressed those present; Abu Sa'd Bishr ibn al-Husayn al-Dawudi objected to him, and he answered with what the book transmits {cite:tabaqat-fuqaha-abbas-1981 p. 64}. The author (al-Shirazi) does not record the year of his death."
