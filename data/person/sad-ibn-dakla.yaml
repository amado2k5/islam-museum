summary:
  ar: "أتابك عز الدين سعد بن دكلة السلغري صاحب شيراز وفارس؛ لجأ إليه قطب الدين سنجر مملوك الخليفة لما عصى بخوزستان فأكرمه وقام دونه، فلما عزم عسكر الخليفة على قصد شيراز شفع فيه وطلب العهد على أن لا يؤذى فسلمه هو وماله وأهله إلى عساكر الخليفة {cite:kamil-ibn-al-athir p. 352-353}."
  en: "The Salghurid Atabeg of Fars — sheltered the fugitive mamluk Sanjar 'honouring him and standing up for him', then surrendered him only under a sworn guarantee of his safety {cite:kamil-ibn-al-athir p. 352-353}."
  es: "El Atabeg Salghurid de Fars — dio refugio al mameluco fugitivo Sanjar, \"honrándolo y defendiéndolo\", y luego lo entregó solo bajo una garantía jurada de su seguridad {cite:kamil-ibn-al-athir p. 352-353}."
  fr: "L'Atabeg Salghuride de Fars a abrité le mamelouk fugitif Sanjar « l'honorant et le défendant », puis l'a livré seulement sous une garantie solennelle de sa sécurité {cite:kamil-ibn-al-athir p. 352-353}."
  ur: "فارس کے سلغورید عتابیگ نے مملوک سنجار کو پناہ دی 'اس کی عزت کرتے ہوئے اور اس کے لیے کھڑے ہوئے'، پھر اسے صرف اس کی حفاظت کی قسم کھا کر ہتھیار ڈال دیا۔ 352-353}۔"
