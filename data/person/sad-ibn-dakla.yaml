id: person/sad-ibn-dakla
class: person
label: { ar: "سعد بن دكلة أتابك شيراز", en: "Sa'd ibn Dakla, Atabeg of Shiraz", es: "Sa'd ibn Dakla, Atabeg of Shiraz", fr: "Sa'd ibn Dakla, Atabeg of Shiraz", ur: "سعد بن ڈاکلہ، شیراز کے عتبیگ" }
summary:
  ar: "أتابك عز الدين سعد بن دكلة السلغري صاحب شيراز وفارس؛ لجأ إليه قطب الدين سنجر مملوك الخليفة لما عصى بخوزستان فأكرمه وقام دونه، فلما عزم عسكر الخليفة على قصد شيراز شفع فيه وطلب العهد على أن لا يؤذى فسلمه هو وماله وأهله إلى عساكر الخليفة {cite:kamil-ibn-al-athir p. 352-353}."
  en: "The Salghurid Atabeg of Fars — sheltered the fugitive mamluk Sanjar 'honouring him and standing up for him', then surrendered him only under a sworn guarantee of his safety {cite:kamil-ibn-al-athir p. 352-353}."
  es: "El Atabeg Salghurid de Fars — dio refugio al mameluco fugitivo Sanjar, \"honrándolo y defendiéndolo\", y luego lo entregó solo bajo una garantía jurada de su seguridad {cite:kamil-ibn-al-athir p. 352-353}."
  fr: "L'Atabeg Salghuride de Fars a abrité le mamelouk fugitif Sanjar « l'honorant et le défendant », puis l'a livré seulement sous une garantie solennelle de sa sécurité {cite:kamil-ibn-al-athir p. 352-353}."
  ur: "فارس کے سلغورید عتابیگ نے مملوک سنجار کو پناہ دی 'اس کی عزت کرتے ہوئے اور اس کے لیے کھڑے ہوئے'، پھر اسے صرف اس کی حفاظت کی قسم کھا کر ہتھیار ڈال دیا۔ 352-353}۔"
  tr: "Şiraz ve Fars hükümdarı Atabeg İzzeddin Sa'd bin Dakla el-Salghari, halifenin memlükü Qutb al-Din Sanjar ona itaat etmeyince, ona saygı gösterip ona karşı durunca ona sığındı. Halifenin ordusu Şiraz'a yürümeye karar verdiğinde, müdahale etti ve zarar görmeyeceğine dair bir söz istedi, bu yüzden kendisini, servetini ve ailesini halifenin askerlerine teslim etti {cite:kamil-ibn-al-athir s. 352-353}."
  id: "Atabeg Izz al-Din Sa'd ibn Dakla al-Salghari, penguasa Shiraz dan Fars, mencari perlindungan kepadanya ketika Qutb al-Din Sanjar, mamluk khalifah, membangkang, menghormatinya dan berdiri teguh melawannya. Ketika pasukan khalifah memutuskan untuk berbaris ke Shiraz, ia turun tangan dan meminta janji bahwa ia tidak akan disakiti, sehingga ia menyerahkan Izz al-Din Sanjar, kekayaannya, dan keluarganya kepada pasukan khalifah {cite:kamil-ibn-al-athir hlm. 352-353}."
