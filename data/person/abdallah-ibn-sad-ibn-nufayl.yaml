summary:
  ar: "أحد الرؤساء الخمسة الذين فزعت إليهم الشيعة لما تحركت سنة خمس وستين ندماً على تخلفهم عن الحسين، فعسكروا بالنخيلة ثم ساروا إلى عين الوردة {cite:muruj-al-dhahab p. 87}."
  en: "One of the five chiefs of the Penitent movement mustered at Nukhayla in 65 AH for the march to 'Ayn al-Warda {cite:muruj-al-dhahab p. 87}."
  fr: "L'un des cinq chefs du mouvement des Pénitents rassemblés à Nukhayla en 65 H pour la marche vers 'Ayn al-Warda {cite:muruj-al-dhahab p. 87}."
  es: "Uno de los cinco jefes del movimiento penitente se reunió en Nukhayla en el año 65 AH para la marcha a 'Ayn al-Warda {cite:muruj-al-dhahab p. 87}."
  ur: "توبہ کی تحریک کے پانچ سرداروں میں سے ایک 65 ہجری میں عین الوردہ کی طرف مارچ کے لیے نخائلہ میں جمع ہوئے۔ 87}۔"
  tr: "Şiilerin, 65. yılda Hüseyin'i desteklemedikleri için pişmanlık duyarak, Nukhaila'da kamp kurup ardından Ain el-Warda'ya doğru yürüyüşe geçtiklerinde başvurdukları beş liderden biri. {kaynak: Muruj el-Dhahab s. 87}"
  id: "Salah satu dari lima pemimpin yang dituju kaum Syiah dalam kesusahan ketika mereka pindah pada tahun enam puluh lima, menyesali kegagalan mereka untuk mendukung Al-Hussein. Mereka berkemah di Al-Nukhaila dan kemudian berbaris ke Ain Al-Warda {cite:muruj-al-dhahab p. 87}."
