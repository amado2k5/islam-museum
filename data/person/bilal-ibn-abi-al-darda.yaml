summary:
  ar: بلال بن أبي الدرداء الأنصاري، حدث عن أبيه وأم الدرداء، ووصفه البخاري بأمير الشام، وولي القضاء بعد النعمان بن بشير ثم عزله عبد الملك بن مروان بأبي إدريس الخولاني؛ وقال أبو عبيد إنه مات سنة ٩٣هـ.
  en: Bilal ibn Abi al-Darda al-Ansari, a narrator from his father and Umm al-Darda whom al-Bukhari calls the emir of al-Sham; he held the judgeship after al-Nu'man ibn Bashir until Abd al-Malik replaced him with Abu Idris al-Khawlani, and Abu Ubayd says he died in 93 AH.
  es: "Bilal ibn Abi al-Darda al-Ansari, narrador de su padre y Umm al-Darda, a quien al-Bujari llama el emir de al-Sham; ocupó el cargo de juez después de al-Nu'man ibn Bashir hasta que Abd al-Malik lo reemplazó con Abu Idris al-Khawlani, y Abu Ubayd dice que murió en el año 93 AH."
  fr: "Bilal ibn Abi al-Darda al-Ansari, un narrateur de son père et d'Umm al-Darda que al-Bukhari appelle l'émir d'al-Sham; il a occupé la fonction de juge après al-Nu'man ibn Bashir jusqu'à ce qu'Abd al-Malik le remplace par Abu Idris al-Khawlani, et Abu Ubayd dit qu'il est mort en 93 AH."
  ur: "بلال بن ابی الدرداء الانصاری، اپنے والد سے راوی اور ام الدرداء جنہیں البخاری نے الشام کا امیر کہا ہے۔ وہ نعمان بن بشیر کے بعد قاضی پر فائز رہے یہاں تک کہ عبد الملک نے ان کی جگہ ابو ادریس الخولانی کو لے لیا اور ابو عبید کہتے ہیں کہ ان کی وفات 93 ہجری میں ہوئی۔"
