summary:
  ar: بلال بن أبي الدرداء الأنصاري، حدث عن أبيه وأم الدرداء، ووصفه البخاري بأمير الشام، وولي القضاء بعد النعمان بن بشير ثم عزله عبد الملك بن مروان بأبي إدريس الخولاني؛ وقال أبو عبيد إنه مات سنة ٩٣هـ.
  en: Bilal ibn Abi al-Darda al-Ansari, a narrator from his father and Umm al-Darda whom al-Bukhari calls the emir of al-Sham; he held the judgeship after al-Nu'man ibn Bashir until Abd al-Malik replaced him with Abu Idris al-Khawlani, and Abu Ubayd says he died in 93 AH.
