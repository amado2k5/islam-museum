summary:
  ar: "صحابي يروي عنه حديث «الطهور شطر الإيمان والحمد لله تملأ الميزان… كل الناس يغدو فبائع نفسه فمعتقها أو موبقها» وهو الحديث الثالث والعشرون من الأربعين النووية، أخرجه مسلم (223) من رواية أبي سلام عنه، وفي رواية النسائي وابن ماجه يتوسط بينهما عبد الرحمن بن غنم."
  en: "An Ash'ari Companion who transmits 'purity is half of faith; praise belongs to God fills the scale … every person sets out each day selling his own soul, freeing it or destroying it', the twenty-third hadith of al-Nawawi's Forty, transmitted by Muslim (223) through Abu Salam from him, while the al-Nasa'i–Ibn Majah route inserts Abd al-Rahman ibn Ghunam between them."
