summary:
  ar: "صحابي يروي عنه حديث «الطهور شطر الإيمان والحمد لله تملأ الميزان» و«كل الناس يغدو فبائع نفسه فمعتقها أو موبقها» وهو الحديث الثالث والعشرون من الأربعين النووية، أخرجه مسلم (223) من رواية أبي سلام عنه، وفي رواية النسائي وابن ماجه يتوسط بينهما عبد الرحمن بن غنم."
  en: "An Ash'ari Companion who transmits 'purity is half of faith; praise belongs to God fills the scale' and 'every person sets out each day selling his own soul, freeing it or destroying it', the twenty-third hadith of al-Nawawi's Forty, transmitted by Muslim (223) through Abu Salam from him, while the al-Nasa'i–Ibn Majah route inserts Abd al-Rahman ibn Ghunam between them."
  ur: "اشعری صحابی جن سے «طہارت ایمان کی نصف ہے» اور «ہر شخص روز اپنی جان بیچتا ہے» کی حدیث منقول ہے۔"
  fr: "Compagnon ash'arite qui transmet « la purification est la moitié de la foi ; la louange à Dieu remplit la balance », jusqu'à « chaque personne part chaque jour vendre son âme, la libérant ou la perdant », le vingt-troisième hadith des Quarante d'al-Nawawi, transmis par Muslim (223) par Abu Salam d'après lui, tandis que la voie d'al-Nasa'i et d'Ibn Majah insère Abd al-Rahman ibn Ghunam entre eux."
  es: "Un Compañero Ash'ari que transmite \"la pureza es la mitad de la fe; la alabanza pertenece a Dios llena la balanza\" y \"cada persona se dispone cada día a vender su propia alma, liberándola o destruyéndola\", el vigésimo tercer hadiz de los Cuarenta de al-Nawawi, transmitido por Muslim (223) a través de Abu Salam de él, mientras que la ruta al-Nasa'i-Ibn Majah inserta a Abd al-Rahman ibn Ghunam entre ellos."
