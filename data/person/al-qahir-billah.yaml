label: { ar: "محمد القاهر بالله" }
summary:
  ar: "بويع له بالخلافة في سنة عشرين وثلاثمائة بعد مقتل المقتدر، ولُقّب بالقاهر بالله {cite:tabari-tarikh-abu-al-fadl j.11 p.152} {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}، وعند السيوطي هو محمد بن المعتضد، بايعه مؤنس والأمراء لما خلعوا المقتدر ليلة أربع عشر المحرم سنة سبع عشرة ولقبوه القاهر بالله فجلس يوم الأحد وعمل الموكب يوم الاثنين فجاء العسكر يطلبون المقتدر ليردوه فأخذ القاهر فجيء به وهو يبكي ويقول الله الله في نفسي فقبله المقتدر وقال أنت والله لا ذنب لك فطب نفساً {cite:tarikh-khulafa-minhaj-1434 p. 591-592}."
