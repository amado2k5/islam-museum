id: person/al-qahir-billah
class: person
label: { ar: "محمد القاهر بالله" }
summary:
  ar: "بويع له بالخلافة في سنة عشرين وثلاثمائة بعد مقتل المقتدر، ولُقّب بالقاهر بالله {cite:tabari-tarikh-abu-al-fadl j.11 p.152} {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}، وعند السيوطي هو محمد بن المعتضد، بايعه مؤنس والأمراء لما خلعوا المقتدر ليلة أربع عشر المحرم سنة سبع عشرة ولقبوه القاهر بالله فجلس يوم الأحد وعمل الموكب يوم الاثنين فجاء العسكر يطلبون المقتدر ليردوه فأخذ القاهر فجيء به وهو يبكي ويقول الله الله في نفسي فقبله المقتدر وقال أنت والله لا ذنب لك فطب نفساً {cite:tarikh-khulafa-minhaj-1434 p. 591-592}، ولما قتل المقتدر أحضره ومحمد بن المكتفي فسئل ابن المكتفي أن يتولى فقال لا حاجة لي في ذلك وعمي هذا أحق به فبويع القاهر فأول ما فعل أن صادر آل المقتدر وعذبهم وضرب أم المقتدر حتى ماتت في العذاب، وتحيل على الخارجين عليه من مؤنس وابن مقلة حتى أمسكهم وذبحهم وطين على ابن المكتفي بين حيطين وزيد في ألقابه المنتقم من أعداء دين الله ونقش على السكة، وكان أهوج سفاكاً للدماء قبيح السيرة مدمن الخمر وصنع حربة لا يطرحها حتى يقتل بها إنساناً، ثم خلع وسمل وقال المسعودي أنكر المال فعذب ثم قال للراضي المال مدفون في البستان فحفر البستان والقصر فلم يجد شيئاً فقال وهل عندي مال إنما كان حسرتي في جلوسك فيه فأردت أن أفجعك فيه، ووقف بعد إطلاقه بجامع المنصور يتصدق عليه في أيام المستكفي فمنع من الخروج حتى مات في جمادى الأولى سنة تسع وثلاثين عن ثلاث وخمسين سنة {cite:tarikh-khulafa-minhaj-1434 p. 597-602}، ولما بلغه أن المتقي سمل قال صرنا اثنين ونحتاج إلى ثالث فكان كذلك سمل المستكفي {cite:tarikh-khulafa-minhaj-1434 p. 612}."
