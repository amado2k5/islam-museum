summary:
  en: "Chief of Thaqif who led the six-man delegation to the Prophet in Ramadan 9 AH after initially refusing the mission for fear of meeting Urwa ibn Mas'ud's fate; he negotiated the terms and the demolition of al-Lat."
  fr: "Chef des Thaqif qui conduisit la délégation de six hommes auprès du Prophète en ramadan 9 H après avoir d'abord refusé la mission par crainte de subir le sort d'Urwa ibn Mas'ud ; il négocia les conditions et la destruction d'al-Lat."
  ar: "سيد ثقيف الذي قاد وفدهم الستة إلى النبي في رمضان سنة 9هـ بعد أن أبى أولاً خوفاً أن يُصنع به ما صُنع بعروة بن مسعود؛ فاوض على شروط الصلح وهدم اللات."
  es: "Jefe de Thaqif, quien dirigió la delegación de seis hombres ante el Profeta en Ramadán del año 9 de la Hégira, después de haber rechazado inicialmente la misión por temor a correr la misma suerte que Urwa ibn Mas'ud; negoció los términos y la demolición de al-Lat."
  ur: "ثقیف کا سربراہ جس نے رمضان 9 ہجری میں رسول اللہ کے پاس چھ رکنی وفد کی قیادت کی تھی جب کہ ابتدا میں عروہ بن مسعود کی قسمت سے ملنے کے خوف سے مشن سے انکار کر دیا تھا۔ اس نے شرائط اور اللات کے انہدام پر بات چیت کی۔"
  tr: "Hicri 9. yılın Ramazan ayında altı kişilik heyetle Peygamber'i ziyaret eden Sakif lideri, Urva bin Mesud'a yapılanların kendisine de yapılmasından korkarak başlangıçta reddetmiş olsa da, barış şartlarını ve El-Lat'ın imhasını müzakere etmiştir."
  id: "Pemimpin Thaqif, yang memimpin delegasi mereka yang terdiri dari enam orang kepada Nabi pada bulan Ramadan tahun 9 Hijriah, setelah awalnya menolak karena takut apa yang dilakukan kepada Urwa bin Masoud akan dilakukan kepadanya, kemudian menegosiasikan syarat-syarat perdamaian dan penghancuran Al-Lat."
