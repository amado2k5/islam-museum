summary:
  ar: "محامٍ وناشط باكستاني (نحو 1901–1973)، من أبناء حركة باكستان ومصمّم علمها الوطني. بدأ نشاطه في حركة الخلافة، وشارك رفاقه في عليكرة في صياغة «مخطط باكستان»، ثم هاجر إلى لاهور سنة 1947 ومارس المحاماة ودرّس في كلية الحقوق بجامعة البنجاب، وكان من مؤسسي جمعية علماء باكستان."
  en: "Pakistani barrister and activist (c. 1901–1973), a figure of the Pakistan Movement and the designer of Pakistan's national flag. He began in the Khilafat movement, helped draft the 'Pakistan Scheme' with his Aligarh companions, migrated to Lahore in 1947, practised law and taught at the University of the Punjab's law college, and was a founding member of Jamiat Ulema-e-Pakistan."
  ur: "پاکستانی وکیل اور کارکن (تقریباً 1901ء–1973ء)، تحریکِ پاکستان کی شخصیت اور پاکستان کے قومی پرچم کے خالق۔ انھوں نے تحریکِ خلافت سے آغاز کیا، علی گڑھ کے ساتھیوں کے ساتھ «پاکستان اسکیم» کا مسودہ تیار کیا، 1947ء میں لاہور ہجرت کی، وکالت کی اور جامعہ پنجاب کے لا کالج میں تدریس کی، اور جمعیت علمائے پاکستان کے بانی ارکان میں سے تھے۔"
