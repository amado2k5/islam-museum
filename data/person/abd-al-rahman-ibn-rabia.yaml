summary:
  ar: "أمير الباب (باب الأبواب) في خلافة عثمان؛ كتب إليه عثمان: إن الرعية قد أبطرها البطنة فلا تقتحم بالمسلمين فإني أخشى أن يقتلوا، فلم يرجع عن مقصده وغزا نحو بلنجر سنة ٣٢هـ فاجتمع عليه الترك والخزر فقاتلوه قتالاً شديداً وقتل — وكان يقال له ذو النور وهو اسم سيفه — وأخذ أهل بلنجر جسده فجعلوه في تابوت يستسقون به {cite:kamil-ibn-al-athir p. 503 v.2}."
  en: "Commander of Derbent under Uthman: warned in writing not to plunge the army into the Caucasus, he marched on Balanjar in AH 32, fell against the Turk-Khazar host, and his body was kept by Balanjar's people in a coffin used in rain-prayers — his sword was named Dhu'l-Nur {cite:kamil-ibn-al-athir v.2 p. 503}."
