class: person
label: { ar: "عبد الرحمن بن ربيعة", en: "Abd al-Rahman ibn Rabia", fr: "Abd al-Rahman ibn Rabia", es: "Abd al-Rahman ibn Rabia", ur: "عبدالرحمٰن بن ربیعہ" }
summary:
  ar: "أمير الباب ⁦(باب الأبواب)⁩ في خلافة عثمان؛ كتب إليه عثمان: إن الرعية قد أبطرها البطنة فلا تقتحم بالمسلمين فإني أخشى أن يقتلوا، فلم يرجع عن مقصده وغزا نحو بلنجر سنة ٣٢هـ فاجتمع عليه الترك والخزر فقاتلوه قتالاً شديداً وقتل — وكان يقال له ذو النور وهو اسم سيفه — وأخذ أهل بلنجر جسده فجعلوه في تابوت يستسقون به {cite:kamil-ibn-al-athir p. 503 v.2}."
  en: "Commander of Derbent under Uthman: warned in writing not to plunge the army into the Caucasus, he marched on Balanjar in AH 32, fell against the Turk-Khazar host, and his body was kept by Balanjar's people in a coffin used in rain-prayers — his sword was named Dhu'l-Nur {cite:kamil-ibn-al-athir v.2 p. 503}."
  fr: "Commandant de Derbent sous Uthman : averti par écrit de ne pas lancer l'armée dans le Caucase, il marcha sur Balanjar en 32 H, tomba face à l'armée turco-khazare, et son corps fut gardé par les gens de Balanjar dans un cercueil dont ils se servaient pour les prières de pluie — son épée se nommait Dhu'l-Nur {cite:kamil-ibn-al-athir v.2 p. 503}."
  es: "Comandante de Derbent bajo Uthman: advertido por escrito de no lanzar al ejército al Cáucaso, marchó sobre Balanjar en el año 32 de la Hégira, cayó contra el ejército turco-jázaro, y su cuerpo fue conservado por la gente de Balanjar en un ataúd utilizado en oraciones para pedir lluvia; su espada se llamaba Dhu'l-Nur {cite:kamil-ibn-al-athir v.2 p. 503}."
  ur: "عثمان کے ماتحت Derbent کے کمانڈر: فوج کو قفقاز میں نہ پھینکنے کے لیے تحریری طور پر تنبیہ کی گئی، اس نے 32 ہجری میں بالنجر پر کوچ کیا، ترک-خزار کے میزبان کے خلاف گرا، اور اس کی لاش کو بالنجر کے لوگوں نے بارش کی دعا میں استعمال ہونے والے ایک تابوت میں رکھا - اس کی تلوار کا نام ذوالنثیر-النقطیل تھا۔ ص 503}۔"
  tr: "Osman halifeliği dönemindeki Kapı Emiri (Bab el-Abwab); Osman ona şöyle yazmıştı: \"Halk oburluktan haram oldu, bu yüzden Müslümanlarla savaşa acele etme, çünkü öldürüleceklerinden korkuyorum.\" O, amacından dönmedi ve Hicri 32 yılında Belancar'a baskın düzenledi. Türkler ve Hazarlar ona karşı toplandılar ve onunla şiddetli bir şekilde savaştılar ve öldürüldü - ve kılıcının adı olan Zul Nur diye anıldı - ve Belancar halkı cesedini alıp bir tabuta koydu ve onunla yağmur duası etti. {Kaynak: Kamil ibn el-Athir s. 503 c.2}"
  id: "Bab al-Abwab, sang Emir Gerbang, pada masa kekhalifahan Utsmaniyah; Utsmaniyah menulis kepadanya: \"Rakyat telah dimanjakan oleh kerakusan, jadi jangan terburu-buru berperang dengan kaum Muslimin, karena aku khawatir mereka akan terbunuh.\" Ia tidak mundur dari tujuannya dan menyerbu Balanjar pada tahun 32 Hijriah. Orang-orang Turki dan Khazar berkumpul melawannya dan melawannya dengan sengit, dan ia terbunuh — dan ia disebut Dhu al-Nur, yang merupakan nama pedangnya — dan penduduk Balanjar mengambil jenazahnya dan memasukkannya ke dalam peti mati untuk berdoa memohon hujan dengannya {cite:kamil-ibn-al-athir p. 503 v.2}."
