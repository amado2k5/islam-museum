  fr: "Fiche d'identité d'al-Nasir Muhammad Salah al-Din ibn al-Mahdi, l'imam zaydite du XIVe siècle du Yémen, mort en 1391; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "یمن کے چودھویں صدی کے زیدی امام النصیر محمد صلاح الدین ابن المہدی کے لیے مسودہ کارڈ 1391; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Yemen'in 14. yüzyılda Zaydi imamı olan El-Nasir Salah el-Din Muhammed bin el-Mehdi'nin ön kartı; kendisi İslam Devletleri Sözlükleri'nde anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Al-Nasir Salah al-Din Muhammad ibn al-Mahdi, Imam Zaydi Yaman pada abad keempat belas, yang meninggal pada tahun 1391 M; ia disebutkan dalam Kamus Negara-Negara Islam dan biografinya belum ditinjau di halaman tersebut."
