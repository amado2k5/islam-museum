summary:
  ar: "بطاقة أولية للناصر صلاح الدين محمد بن المهدي، إمام اليمن الزيدي في القرن الرابع عشر، توفي سنة ١٣٩١م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for al-Nasir Muhammad Salah al-Din ibn al-Mahdi, the fourteenth-century Zaydi imam of Yemen, d. 1391; the dynastic handbook entry is not yet checked on the page."
