summary:
  ar: "ناصر الدين محمد بن سالم الطبلاوي الشافعي، الإمام العلامة أحد العلماء الأفراد بمصر؛ أجازه العلامة محمد البيلوني كتابة في مستهل جمادى الأولى سنة اثنتين وتسعين وتسعمائة وقال فيها تلقيت العلم عن أجلة من المشايخ منهم قاضي القضاة زكريا وحافظ عصرهم الفخر بن عثمان الديمي والسيوطي والبرهان القلقشندي، وبالإجازة العالية مشافهة عن الشيخ شهاب الدين البيجودي شارح جامع المختصرات نزيل الثغر المحروس بدمياط عن شيخ القراء والمحدثين محمد بن الجزري؛ وقال الشعراني: صحبته نحو خمسين سنة فما رأيت في أقرانه أكثر عبادة لله منه، وكان مشهوراً في مصر بكثرة رؤية رسول الله فأقبل عليه الخلائق إقبالاً كثيراً بسبب ذلك فأشار عليه بعض الأولياء بإخفاء ذلك فأخفاه، وليس في مصر الآن أحد يقرئ في سائر العلوم الشرعية وآلاتها كله حفظاً وقد عدوا ذلك من جملة إمامته فإنه من المتبحرين في التفسير والقراءات والفقه والنحو والحديث والأصول والمعاني والبيان والحساب والمنطق والكلام والتصوف، وجمع على البهجة شرحين، وولي تدريس الخشابية وهي من أجل تدريس في مصر، وشهد له الخلائق بأنه أعلم من جميع أقرانه وأكثرهم تواضعاً وأحسنهم خلقاً؛ وتوفي بمصر عاشر جمادى الآخرة ودُفن في حوش الإمام الشافعي وعمر نحو مائة سنة {cite:shadharat-dhahab p. 348-349}."
  en: "Al-Tablawi — Egypt's encyclopedist and al-Sha'rani's companion of fifty years; licensed by Muhammad al-Bayluni in writing (892), his chain running through Zakariyya, al-Suyuti and Ibn al-Jazari's Damiettan student; 'famous in Egypt for the frequency of his dreams of the Prophet' until a saint advised concealment; holder of the Khushabiyya chair and 'the most learned of all his peers and the humblest'; died 10 Jumada II [966] near a hundred years old, buried in Imam al-Shafi'i's hawsh {cite:shadharat-dhahab p. 348-349}."
  fr: "Al-Tablawi – encyclopédiste égyptien et compagnon d’al-Sha’rani depuis cinquante ans  ; autorisé par Muhammad al-Bayluni par écrit (892), sa chaîne passant par Zakariyya, al-Suyuti et l’étudiant de Damiettan d’Ibn al-Jazari  ; « célèbre en Égypte pour la fréquence de ses rêves du Prophète  » jusqu’à ce qu’un saint conseille la dissimulation  ; titulaire de la chaise Khushabiyya et « le plus savant de tous ses pairs et le plus humble  »  ; décédé 10 Jumada II [966] près d'un siècle, enterré dans le hawsh de l'Imam al-Shafi'i {cite:shadharat-dhahab p. 348-349}."
  es: "Al-Tablawi — el enciclopedista de Egipto y compañero de al-Sha'rani durante cincuenta años; fue autorizado por escrito por Muhammad al-Bayluni (892), su cadena de transmisión pasó por Zakariyya, al-Suyuti y el alumno de Ibn al-Jazari en Damiettan; \"famoso en Egipto por la frecuencia de sus sueños con el Profeta\" hasta que un santo le aconsejó que los ocultara; titular de la cátedra Khushabiyya y \"el más erudito de todos sus pares y el más humilde\"; murió el 10 de Jumada II [966] cerca de los cien años de edad, enterrado en el hawsh del Imam al-Shafi'i {cite:shadharat-dhahab p. 348-349}."
  ur: "الطبلوی - مصر کا انسائیکلوپیڈسٹ اور الشرانی کا پچاس سال ساتھی؛ محمد البیلونی کے ذریعہ تحریری طور پر لائسنس یافتہ (892)، اس کا سلسلہ زکریا، السیوطی اور ابن الجزری کے دمیطان کے طالب علم کے ذریعے چلتا ہے۔ 'مصر میں پیغمبر کے خوابوں کی تعدد کے لیے مشہور' یہاں تک کہ ایک ولی نے پردہ پوشی کا مشورہ دیا۔ خوشابیہ کرسی کا حامل اور 'اپنے تمام ساتھیوں میں سب سے زیادہ عالم اور سب سے زیادہ حلیم'؛ وفات 10 جمادی الثانی [966] تقریباً سو سال کی عمر میں، امام شافعی کے حوض میں مدفون ہیں 348-349}۔"
  tr: "Nasır el-Din Muhammed bin Salim el-Tablavi el-Şafii, seçkin imam, Mısır'daki bireysel alimlerden biri, 992 Hicri yılının başında Cumedül-Avval'ın başında alim Muhammed el-Bayluni tarafından yazılı olarak yetki aldı ve şöyle dedi: Başyargıç Zekeriye ve dönemlerinin ezbercisi Fakhr bin Osman el-Dimi, el-Süyuti ve el-Burhan el-Kalqasendi dahil seçkin şeyhlerden bilgi aldım. Ayrıca, Mukhtasarat koleksiyonunun yorumcusu ve Damietta'daki el-Tahhr el-Mahru'nun sakini Şeyh Şihab al-Din el-Bicudi'den, şiir ustası ve hadis alimi Muhammed bin el-Cezeri'den sözlü olarak en yüksek yetkiyi aldı. El-Şa'rani şöyle dedi: Yaklaşık elli yıl boyunca ona eşlik ettim ve akranlarında Tanrı'ya onun kadar çok ibadet görmedim. Mısır'da sık sık Allah'ın Elçisi'ni görmesiyle ünlüydü ve insanlar bu yüzden ona büyük bir coşkuyla yöneldi. Bazı azizler ona bunu saklamasını tavsiye etti, o da sakladı. Şu anda Mısır'da kimse tüm dini bilimleri ve aletlerini ezberleyerek okumaz ve bunu onun İmamı sayırlar; çünkü tefsir, Kur'an okumaları, fıkhâr, dilbilgisi, hadis, ilkeler, anlamlar, retorik, aritmetik, mantık, teoloji ve tasavvuf konularında derin yetkinliğe sahiptir. Al-Bahja üzerine iki tefsir derledi ve öğretim görevlerinde bulundu Mısır'ın önde gelen öğretmenlerinden biri olan El-Haşabiyye, akranları arasında en bilgili, alçakgönüllü ve en terbiyeli kişi olarak tanındı; Cumada'l-Ahhirah'ın onuncusunda Mısır'da öldü ve İmam el-Şafii'nin avlusuna defnedildi; yaklaşık yüz yıl yaşadı {atıf:Shadharat-dhahab, s. 348-349}."
  id: "Nasir al-Din Muhammad ibn Salim al-Tablawi al-Shafi'i, imam terkemuka, salah satu ulama individu di Mesir, mendapat otorisasi tertulis dari ulama Muhammad al-Bayluni pada awal Jumada al-Awwal tahun 992 H, di mana ia berkata: Saya menerima pengetahuan dari para sheikh terkemuka, termasuk hakim utama Zakariya dan pengapal pada zamannya, Fakhr ibn Uthman al-Dimi, al-Suyuti, dan al-Burhan al-Qalqashandi. Ia juga menerima otorisasi lisan tertinggi dari Sheikh Shihab al-Din al-Bijudi, komentator koleksi Mukhtasarat dan residen al-Thaghr al-Mahrous di Damietta, dari guru pembaca dan ulama hadis Muhammad ibn al-Jazari. Al-Sha'rani berkata: Saya menemaninya selama sekitar lima puluh tahun, dan saya belum pernah melihat di antara teman-temannya penyembahan Tuhan sebanyak yang dia alami. Dia terkenal di Mesir karena sering bertemu Rasul Allah, dan orang-orang beralih kepadanya dengan antusiasme besar karena itu. Beberapa wali menyarankan dia untuk menyembunyikannya, dan dia menyembunyikannya. Saat ini, tidak ada seorang pun di Mesir yang membaca semua ilmu agama dan alatnya, semuanya dengan hafalan, dan mereka menganggap ini sebagai salah satu imamatnya, karena dia sangat mahir dalam tafsir, pembacaan Al-Quran, firisprudensi, tata bahasa, hadits, prinsip, makna, retorika, aritmetika, logika, teologi, dan Sufisme. Dia menyusun dua komentar tentang Al-Bahja dan memegang posisi mengajar Al-Khashabiyyah, yang merupakan salah satu guru terkemuka di Mesir, diakui oleh masyarakat sebagai yang paling berpengetahuan, rendah hati, dan berperilaku baik di antara rekan-rekannya; ia meninggal di Mesir pada tanggal sepuluh Jumada al-Akhirah dan dimakamkan di halaman Imam al-Shafi'i, hidup sekitar seratus tahun {cite:shadharat-dhahab, hlm. 348-349}."
