summary:
  ar: "ناصر الدين محمد بن سالم الطبلاوي الشافعي، الإمام العلامة أحد العلماء الأفراد بمصر؛ أجازه العلامة محمد البيلوني كتابة في مستهل جمادى الأولى سنة اثنتين وتسعين وتسعمائة وقال فيها تلقيت العلم عن أجلة من المشايخ منهم قاضي القضاة زكريا وحافظ عصرهم الفخر بن عثمان الديمي والسيوطي والبرهان القلقشندي، وبالإجازة العالية مشافهة عن الشيخ شهاب الدين البيجودي شارح جامع المختصرات نزيل الثغر المحروس بدمياط عن شيخ القراء والمحدثين محمد بن الجزري؛ وقال الشعراني: صحبته نحو خمسين سنة فما رأيت في أقرانه أكثر عبادة لله منه، وكان مشهوراً في مصر بكثرة رؤية رسول الله فأقبل عليه الخلائق إقبالاً كثيراً بسبب ذلك فأشار عليه بعض الأولياء بإخفاء ذلك فأخفاه، وليس في مصر الآن أحد يقرئ في سائر العلوم الشرعية وآلاتها كله حفظاً وقد عدوا ذلك من جملة إمامته فإنه من المتبحرين في التفسير والقراءات والفقه والنحو والحديث والأصول والمعاني والبيان والحساب والمنطق والكلام والتصوف، وجمع على البهجة شرحين، وولي تدريس الخشابية وهي من أجل تدريس في مصر، وشهد له الخلائق بأنه أعلم من جميع أقرانه وأكثرهم تواضعاً وأحسنهم خلقاً؛ وتوفي بمصر عاشر جمادى الآخرة ودُفن في حوش الإمام الشافعي وعمر نحو مائة سنة {cite:shadharat-dhahab p. 348-349}."
  en: "Al-Tablawi — Egypt's encyclopedist and al-Sha'rani's companion of fifty years; licensed by Muhammad al-Bayluni in writing (892), his chain running through Zakariyya, al-Suyuti and Ibn al-Jazari's Damiettan student; 'famous in Egypt for the frequency of his dreams of the Prophet' until a saint advised concealment; holder of the Khushabiyya chair and 'the most learned of all his peers and the humblest'; died 10 Jumada II [966] near a hundred years old, buried in Imam al-Shafi'i's hawsh {cite:shadharat-dhahab p. 348-349}."
died: { edtf: "1559-03-19~", hijri: "0966-06-10~", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي بمصر عاشر جمادى الآخرة وعمره نحو مائة سنة؛ التحويل مشتق {cite:shadharat-dhahab p. 349}", sources: [source/shadharat-dhahab] }
