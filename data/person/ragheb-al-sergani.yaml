summary:
  ar: "داعية ومؤرخ مصري وأستاذ جراحة المسالك البولية بكلية طب جامعة القاهرة، وُلد في المحلة الكبرى سنة 1964. يشرف على موقع «قصة الإسلام» (Islam Story)، وله أكثر من ستين كتابا في التاريخ والفكر الإسلامي تُرجم عدد منها إلى لغات عدة، ونال جوائز عربية ودولية."
  en: "Egyptian preacher and historian, and professor of urology at Cairo University's Faculty of Medicine, born in El Mahalla El Kubra in 1964. He oversees the Islam Story website (islamstory.com), has written more than sixty books on Islamic history and thought, several of them translated, and has received Arab and international prizes."
  ur: "مصری مبلغ اور مؤرخ، اور قاہرہ یونیورسٹی کے شعبہ طب میں یورولوجی کے پروفیسر، جو 1964 میں المحلہ الکبریٰ میں پیدا ہوئے۔ وہ «قصة الاسلام» (Islam Story) ویب سائٹ کے نگراں ہیں، اسلامی تاریخ و فکر پر ان کی ساٹھ سے زائد کتابیں ہیں جن میں سے کئی کے ترجمے ہوئے، اور انہیں عرب اور بین الاقوامی انعامات ملے۔"
