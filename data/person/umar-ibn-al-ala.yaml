label: { ar: "عمر بن العلاء", en: "Umar ibn al-Ala'", es: "Umar ibn al-Ala'", fr: "Umar ibn al-Ala'", ur: "عمر بن العلاء" }
summary:
  ar: "عمر بن العلاء جزّار من أهل الري؛ جمع جمعاً وقاتل سنباذ حين خرج بها فأبلى ونكى فأوفده جهور بن مرار المجلي على المنصور فقوده وحضنه وجعل له مرتبة ثم ولي طبرستان فاستشهد بها في خلافة المهدي."
  en: "Umar ibn al-Ala', a butcher of Rayy; he gathered a company and fought Sanbadh on his rising — brave work — Jahwar ibn Marrar presented him to al-Mansur who honoured and ranked him; he governed Tabaristan and was martyred there under al-Mahdi."
  es: "Umar ibn al-Ala', un carnicero de Rayy; reunió una compañía y luchó contra Sanbadh en su ascenso —una hazaña valiente— Jahwar ibn Marrar lo presentó a al-Mansur, quien lo honró y lo ascendió de rango; gobernó Tabaristán y fue martirizado allí bajo el mando de al-Mahdi."
  fr: "Umar ibn al-Ala', un boucher de Rayy; il rassembla une compagnie et combattit Sanbadh lors de son soulèvement — action courageuse — Jahwar ibn Marrar le présenta à al-Mansur qui l'honora et le classa; il gouverna le Tabaristan et y fut martyrisé sous al-Mahdi."
  ur: "عمر بن العلاء، رے کا قصاب؛ اس نے ایک کمپنی اکٹھی کی اور سنبد سے لڑا اس کے بڑھتے ہوئے - بہادر کام پر - جوہور ابن مرار نے اسے المنصور کے سامنے پیش کیا جس نے اسے عزت اور درجہ دیا۔ اس نے طبرستان پر حکومت کی اور وہاں المہدی کی قیادت میں شہید ہوئے۔"
  tr: "Ömer bin el-Ala', Rayy halkından bir kasaptı; bir grup topladı ve Sanbadh oraya gittiğinde onunla savaştı, fakat Sanbadh şikayet ediyor ve ağıt tutuyordu. Jahur bin Marar al-Majli onu el-Mansur'a gönderdi, ancak onu kaybetti, kucakladı ve bir rütbeye yükseltti. Sonra Tabaristan valisi olarak atandı ve el-Mehdi halifeliği sırasında orada şehit oldu."
  id: "Umar ibn al-Ala' adalah seorang jagal dari masyarakat Rayy; ia mengumpulkan sekelompok orang dan berperang melawan Sanbadh saat pergi ke sana, tetapi ia mengeluh dan meratapi. Jahur ibn Marar al-Majli mengirimnya kepada al-Mansur, yang kehilangan Sanbadh, memeluknya, dan mengangkatnya ke pangkat. Kemudian ia diangkat menjadi gubernur Tabaristan dan menjadi martir di sana selama kekhalifahan al-Mahdi."
