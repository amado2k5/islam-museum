summary:
  ar: "عباس بن فرناس، الفلكي المسلم بالأندلس، كشف في معمله طريقة لصنع البلور، وهو الذي قذف بنفسه في تجربة رائعة مدهشة على متن طائرة شراعية سبح بها عالياً في الفضاء ثم وقع ونهض سالماً، وكان بذلك مبشراً بفكرة الطيران منذ العصور الوسطى."
  en: "Abbas ibn Firnas, the Andalusi astronomer who discovered in his workshop a way of making crystal — and who, in a remarkable experiment, launched himself on a glider, sailed high in the air, fell and rose unharmed, thus foreshadowing the idea of flight in the Middle Ages."
