summary:
  ar: "الفريعة بنت مالك بن سنان الخدرية الأنصارية، أخت أبي سعيد الخدري، ويقال لها الفارعة. شهدت بيعة الرضوان مع النبي، وروى لها أصحاب السنن الأربعة. لم يتضح في عنوان المدخل تاريخ وفاتها، إذ ورد بصيغة (؟ - ٢). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
  en: "al-Furay'a bint Malik ibn Sinan al-Khudriyya al-Ansariyya, sister of Abu Sa'id al-Khudri; she is also called al-Fari'a. She took part in the Pledge of al-Ridwan with the Prophet, and the four books of the Sunan transmitted for her. The heading gives her death date as unclear (? - 2), which is not read as a date here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
