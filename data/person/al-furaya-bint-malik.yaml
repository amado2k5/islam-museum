summary:
  ar: "الفريعة بنت مالك بن سنان الخدرية الأنصارية، أخت أبي سعيد الخدري، ويقال لها الفارعة. شهدت بيعة الرضوان مع النبي، وروى لها أصحاب السنن الأربعة. لم يتضح في عنوان المدخل تاريخ وفاتها، إذ ورد بصيغة ⁦(؟ - ٢)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
  en: "al-Furay'a bint Malik ibn Sinan al-Khudriyya al-Ansariyya, sister of Abu Sa'id al-Khudri; she is also called al-Fari'a. She took part in the Pledge of al-Ridwan with the Prophet, and the four books of the Sunan transmitted for her. The heading gives her death date as unclear (? - 2), which is not read as a date here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
  fr: "Al-Furay’a bint Malik ibn Sinan al-Khudriyya al-Ansariyya, sœur d’Abu Sa’id al-Khudri, aussi appelée al-Fari’a. Elle participa au pacte d’al-Ridwan avec le Prophète et les quatre livres des Sunan transmirent d’elle. Le titre donne une date de mort peu claire (? - 2), qui n’est pas lue ici comme une date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
  ur: "فریعہ بنت مالک بن سنان الخدریہ الانصاریہ، ابو سعید الخدری کی بہن؛ انہیں فریعہ بھی کہا جاتا ہے؛ انہوں نے بیعت میں شرکت کی۔"
  es: "Al-Furay'a bint Malik ibn Sinan al-Khudriyya al-Ansariyya, hermana de Abu Sa'id al-Khudri; también conocida como al-Fari'a. Participó en el Juramento de al-Ridwan con el Profeta, y los cuatro libros del Sunan fueron transmitidos para ella. El encabezado indica que su fecha de fallecimiento es incierta (? - 2), lo cual no se interpreta como una fecha en este texto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
  tr: "Malik ibn Sinan el-Hudriyye el-Ensariyye'nin kız kardeşi olan El-Fari'ye bint Malik ibn Sinan el-Hudriyye el-Ensariyye, Ebu Sa'id el-Hudri'nin kız kardeşidir ve El-Fari'ye olarak da bilinir. Peygamberimizle yapılan Rıdvan Biatına şahitlik etmiş ve dört Sünen derlemesinin derleyicileri ondan hadisler rivayet etmişlerdir. Ölüm tarihi, giriş başlığında (? - 2) şeklinde belirtildiği için net değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17457}"
  id: "Al-Fari'ah bint Malik ibn Sinan al-Khudriyyah al-Ansariyyah, saudara perempuan Abu Sa'id al-Khudri, juga dikenal sebagai al-Fari'ah. Ia menyaksikan Ikrar Ridwan bersama Nabi, dan para penyusun empat koleksi Sunan meriwayatkan hadits darinya. Tanggal kematiannya tidak jelas dalam judul entri, karena muncul sebagai (? - 2). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
