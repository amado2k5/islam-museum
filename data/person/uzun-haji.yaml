summary:
  ar: "أوزون حاجي السالطي (1848–1920)، المعروف في المصادر العربية بالحاج أُذُن خير، شيخ نقشبندي من قرية سالطا في داغستان؛ تتلمذ مريدًا على الشيخ عبد الرحمن حاجي السوغوري وتلقى منه الإجازة، وصار أمير إمارة شمال القوقاز سنة 1919، وتوفي بالتيفوس في فيدينو في 30 مارس 1920."
  en: "Uzun-Haji Saltinsky (1848–1920), known in Arabic sources as Hajji Udhun Khayr, was a Naqshbandi sheikh from the village of Salta in Dagestan. He studied as a murid under Sheikh Abdurrahman-Hajji as-Suguri and received the ijazah from him, became Emir of the North Caucasian Emirate in 1919, and died of typhus at Vedeno on 30 March 1920."
  ur: "ازون حاجی سالتنسکی (1848–1920)، جو عربی مآخذ میں حاجی اذن خیر کے نام سے معروف ہیں، داغستان کے گاؤں سالطا سے تعلق رکھنے والے نقشبندی شیخ تھے؛ وہ شیخ عبدالرحمن حاجی السوغوری کے مرید رہے اور ان سے اجازہ پایا، 1919 میں شمالی قفقازی امارت کے امیر بنے، اور 30 مارچ 1920 کو ویدینو میں ٹائیفس سے وفات پائی۔"
