summary:
  ar: "نجم الدين أبو محمد عبد المنعم بن علي النهري الحراني الفقيه الحنبلي الواعظ؛ رحل إلى بغداد في صباه سنة ثمان وسبعين وتفقه على أبي الفتح ابن المني، ثم عاد إلى حران فقدم بغداد ثانية سنة ست وتسعين ومعه ولداه النجيب عبد اللطيف والعز عبد العزيز، واستوطنها وعقد مجلس الوعظ وكان مليح الكلام رشيق الألفاظ عزيز النفس مع فقر شديد، قال سبط ابن الجوزي كان كثير الحياء يزور جدي ويسمع معنا الحديث وذكر أنه استوطن بغداد لوحشة جرت بينه وبين خطيب حران ابن تيمية خشي أن يتقدم عليه؛ توفي يوم الخميس سادس عشر ربيع الأول سنة إحدى وستمائة {cite:shadharat-dhahab p. 11-12}."
  en: "Najm al-Din Abd al-Mun'im al-Nahri of Harran, Hanbali jurist-preacher; travelled to Baghdad in his youth in 578, trained under Ibn al-Mani, then settled there for good in 596 with his sons al-Najib Abd al-Latif and al-Izz Abd al-Aziz, holding a preaching circle — pleasant-tongued, proud despite deep poverty. Sibt Ibn al-Jawzi says he visited his grandfather and settled in Baghdad only because of a breach with Harran's khatib Ibn Taymiyya, whom he feared would precede him. He died Thursday 16 Rabi' I 601 {cite:shadharat-dhahab p. 11-12}."
