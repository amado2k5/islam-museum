names:
  - { value: "أبو محمد عبد المنعم بن علي بن نصر بن منصور ابن هبة الله النهري الحراني الفقيه الحنبلي الواعظ", kind: full }
summary:
  ar: "نجم الدين أبو محمد عبد المنعم بن علي النهري الحراني الفقيه الحنبلي الواعظ؛ رحل إلى بغداد في صباه سنة ثمان وسبعين وتفقه على أبي الفتح ابن المني، ثم عاد إلى حران فقدم بغداد ثانية سنة ست وتسعين ومعه ولداه النجيب عبد اللطيف والعز عبد العزيز، واستوطنها وعقد مجلس الوعظ وكان مليح الكلام رشيق الألفاظ عزيز النفس مع فقر شديد، قال سبط ابن الجوزي كان كثير الحياء يزور جدي ويسمع معنا الحديث وذكر أنه استوطن بغداد لوحشة جرت بينه وبين خطيب حران ابن تيمية خشي أن يتقدم عليه؛ توفي يوم الخميس سادس عشر ربيع الأول سنة إحدى وستمائة {cite:shadharat-dhahab p. 11-12}."
  en: "Najm al-Din Abd al-Mun'im al-Nahri of Harran, Hanbali jurist-preacher; travelled to Baghdad in his youth in 578, trained under Ibn al-Mani, then settled there for good in 596 with his sons al-Najib Abd al-Latif and al-Izz Abd al-Aziz, holding a preaching circle — pleasant-tongued, proud despite deep poverty. Sibt Ibn al-Jawzi says he visited his grandfather and settled in Baghdad only because of a breach with Harran's khatib Ibn Taymiyya, whom he feared would precede him. He died Thursday 16 Rabi' I 601 {cite:shadharat-dhahab p. 11-12}."
  es: "Najm al-Din Abd al-Mun'im al-Nahri de Harran, jurista y predicador hanbalí, viajó a Bagdad en su juventud, en 578, donde se formó con Ibn al-Mani y se estableció allí definitivamente en 596 con sus hijos al-Najib Abd al-Latif y al-Izz Abd al-Aziz, dirigiendo un círculo de predicación. Era de verbo afable y orgulloso a pesar de su profunda pobreza. Sibt Ibn al-Jawzi afirma que visitó a su abuelo y se estableció en Bagdad únicamente debido a un desacuerdo con el khatib de Harran, Ibn Taymiyya, a quien temía que le precediera. Falleció el jueves 16 de Rabi' I de 601 {cita: shadharat-dhahab, págs. 11-12}."
  fr: "Najm al-Din Abd al-Mun'im al-Nahri de Harran, juriste et prédicateur hanbalite, se rendit à Bagdad dans sa jeunesse, en 578, où il fut formé par Ibn al-Mani. Il s'y installa définitivement en 596 avec ses fils al-Najib Abd al-Latif et al-Izz Abd al-Aziz, et y dirigea un cercle de prédication. Orateur affable et fier malgré sa grande pauvreté, il était, selon Sibt Ibn al-Jawzi, un homme qui rendit visite à son grand-père et s'établit à Bagdad uniquement en raison d'une rupture avec le khatib de Harran, Ibn Taymiyya, dont il craignait qu'il ne lui succède. Il mourut le jeudi 16 Rabi' I 601 (cf. shadharat-dhahab, p. 11-12)."
  ur: "نجم الدین عبد المنعیم النہری آف حران، حنبلی فقیہ مبلغ؛ 578 میں اپنی جوانی میں بغداد کا سفر کیا، ابن المنی کے تحت تربیت حاصل کی، پھر 596 میں اپنے بیٹوں النجیب عبداللطیف اور العز عبدالعزیز کے ساتھ، ایک تبلیغی حلقے کے ساتھ، خوش گوار، گہری غربت کے باوجود فخر کرنے کے لیے وہاں سکونت اختیار کی۔ سبط ابن الجوزی کا کہنا ہے کہ وہ اپنے دادا کے پاس گئے اور بغداد میں صرف حران کے خطیب ابن تیمیہ کے ساتھ نااتفاقی کی وجہ سے آباد ہوئے، جن کے بارے میں انہیں خدشہ تھا کہ وہ ان سے آگے نکل جائیں گے۔ آپ کا انتقال جمعرات 16 ربیع الثانی 601ء کو ہوا 11-12}۔"
  tr: "Necmeddin Ebu Muhammed Abd al-Mun'im ibn Ali el-Nehri el-Harrani, Hanbali hukukçusu ve vaizi; yetmiş sekizinci yılında gençliğinde Bağdat'a seyahat etti ve Ebu el-Feth bin el-Munna'nın yanında hukuk eğitimi aldı. Daha sonra Harran'a döndü ve 1996'da oğulları el-Necib Abdul Latif ve el-İzz Abdulaziz ile birlikte tekrar Bağdat'a döndü. Yerleşti Orada vaaz oturumları düzenlerdi, ağır yoksulluğa rağmen etkili, etkileyici ve saygındı. Subt İbn al-Jawzi şöyle dedi: Çok mütevazıydı, büyükbabamı ziyaret etti ve konuşmamızı dinledi, Harran İbn Teymiye ile aralarındaki anlaşmazlık nedeniyle Bağdat'a yerleştiğini, onun onu geçmesinden korktuğunu söyledi. 611 Hicri yılında, Rabi'al-Awwal'ın on altıncı günü Perşembe günü vefat etti. {cit:) Shadharat-Dhahab, s. 11-12}."
  id: "Najm al-Din Abu Muhammad Abd al-Mun'im ibn Ali al-Nahri al-Harrani, ahli hukum dan pengkhotbah Hanbali; ia pergi ke Baghdad saat muda pada tahun tujuh puluh delapan dan belajar hukum di bawah bimbingan Abu al-Fath ibn al-Munna. Ia kemudian kembali ke Harran dan kembali ke Baghdad pada tahun 1996 ditemani oleh putra-putranya al-Najib Abdul Latif dan al-Izz Abdul Aziz. Ia menetap di sana, mengadakan sesi khotbah, fasih, fasih, dan bermartabat meski dalam kemiskinan berat. Subt Ibn al-Jawzi berkata: Ia sangat rendah hati, mengunjungi kakek saya dan mendengarkan percakapan kami, dan menyebutkan bahwa ia menetap di Baghdad karena perselisihan antara dirinya dan pengkhotbah Harran Ibn Taymiyyah, takut ia akan melampauinya. Ia meninggal pada hari Kamis, tanggal enam belas Rabi' al-Awwal tahun 611 H. {cite::Shadharat-Dhahab, hlm. 11-12}."
