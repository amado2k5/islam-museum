summary:
  ar: "بطاقة أولية لقره يوسف، مؤسس قوة دولة قره قويونلو في أذربيجان والعراق، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Qara Yusuf, founder of the Qara Qoyunlu power in Azerbaijan and Iraq, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha preliminar de Qara Yusuf, fundador del poder Qara Qoyunlu en Azerbaiyán e Irak, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche provisoire de Qara Yusuf, fondateur du pouvoir Qara Qoyunlu en Azerbaïdjan et en Irak, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "قرا یوسف کے لیے ڈرافٹ کارڈ، آذربائیجان اور عراق میں قارا قونلو پاور کے بانی، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا ہے؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Azerbaycan ve Irak'taki Kara-Qoyunlu devlet gücünün kurucusu Kara Yusuf için ön hazırlık kartı, açık referans açıklamasında (Wikidata) belirtilmiştir. Hassan İbrahim'in İslam Tarihi adlı çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal untuk Qara Yusuf, pendiri kekuasaan negara Kara-Qoyunlu di Azerbaijan dan Irak, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
