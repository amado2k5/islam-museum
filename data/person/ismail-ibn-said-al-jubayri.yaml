summary:
  ar: "إسماعيل بن سعيد بن عبيد الله بن جبير بن حية الثقفي الجبيري البصري، من رواة الحديث. روى عن أبيه، وروى عنه بشر بن دام وغيره. روى له الترمذي حديثا واحدا في الجنائز وصححه، وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10353}"
  en: "Isma'il ibn Sa'id ibn 'Ubayd Allah ibn Jubayr ibn Hayya al-Thaqafi al-Jubayri of Basra, a transmitter of hadith. He narrated from his father; Bishr ibn Dam and others narrated from him. al-Tirmidhi reported one hadith from him on funerals and graded it sound, and Ibn Hibban listed him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10353}"
