id: person/ismail-ibn-said-al-jubayri
class: person
label: { ar: "إسماعيل بن سعيد الجبيري", en: "Isma'il ibn Sa'id al-Jubayri", es: "Isma'il ibn Sa'id al-Jubayri", fr: "Isma'il ibn Sa'id al-Jubayri", ur: "اسماعیل بن سعید الجبیری۔" }
summary:
  ar: "إسماعيل بن سعيد بن عبيد الله بن جبير بن حية الثقفي الجبيري البصري، من رواة الحديث. روى عن أبيه، وروى عنه بشر بن دام وغيره. روى له الترمذي حديثا واحدا في الجنائز وصححه، وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10353}"
  en: "Isma'il ibn Sa'id ibn 'Ubayd Allah ibn Jubayr ibn Hayya al-Thaqafi al-Jubayri of Basra, a transmitter of hadith. He narrated from his father; Bishr ibn Dam and others narrated from him. al-Tirmidhi reported one hadith from him on funerals and graded it sound, and Ibn Hibban listed him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10353}"
  es: "Isma'il ibn Sa'id ibn 'Ubayd Allah ibn Jubayr ibn Hayya al-Thaqafi al-Jubayri de Basora, transmisor de hadices. Lo narró de su padre; Bishr ibn Dam y otros narraron sobre él. al-Tirmidhi relató un hadiz suyo sobre funerales y lo calificó como sano, e Ibn Hibban lo incluyó entre los dignos de confianza. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10352} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10353}"
  fr: "Isma'il ibn Sa'id ibn 'Ubayd Allah ibn Jubayr ibn Hayya al-Thaqafi al-Jubayri de Bassorah, un transmetteur de hadith. Il a raconté de son père; Bishr ibn Dam et d'autres ont rapporté de lui. al-Tirmidhi a rapporté un hadith de lui sur les funérailles et l'a jugé valable, et Ibn Hibban l'a classé parmi les dignes de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10353}"
  ur: "اسماعیل بن سعید بن عبید اللہ بن جبیر بن حیا الثقفی الجبیری بصرہ، حدیث کا ایک ٹرانسمیٹر۔ انہوں نے اپنے والد سے روایت کی ہے؛ بشر بن دام وغیرہ نے ان سے روایت کی ہے۔ ترمذی نے جنازہ کے بارے میں ان سے ایک حدیث روایت کی ہے اور اسے صحیح قرار دیا ہے اور ابن حبان نے اسے ثقہ قرار دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10352} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10353}"
  tr: "İsmayıl ibn Sa'id ibn Ubayd Allah ibn Jubeyr ibn Hayat al-Thaqafi al-Jubayri al-Basri, hadis rivayetçilerinden biridir. Babasından rivayet etti, Bişr ibn Dam ve diğerleri ise ondan rivayet etti. El-Tirmidi, 'Cenazeler'de ondan bir hadis anlattı ve doğruladı, İbn Hibben ise güvenilir kişiler arasında bahsetti. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.10352} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.10353}"
  id: "Isma'il ibn Sa'id ibn Ubayd Allah ibn Jubayr ibn Hayat al-Thaqafi al-Jubayri al-Basri, salah satu narator hadits. Ia menceritakan dari ayahnya, dan Bishr ibn Dam serta lainnya menceritakan darinya. Al-Tirmidhi menceritakan satu hadis darinya dalam 'Pemakaman' dan mengotentiknya, dan Ibn Hibban menyebutkannya di antara hadits yang dapat dipercaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10353}"
