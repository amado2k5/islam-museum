summary:
  ar: "محمد شياع صبار السوداني (وُلد 4 آذار 1970)، سياسي عراقي، رئيس وزراء العراق من 27 تشرين الأول 2022 إلى 14 أيار 2026 خلفًا لمصطفى الكاظمي. مهندس زراعي من أسرة من ميسان أُعدم والده سنة 1980 لعضويته في حزب الدعوة، وكان محافظًا لميسان 2009–2010 ووزيرًا لحقوق الإنسان 2010–2014 ووزيرًا للعمل والشؤون الاجتماعية 2014–2018 قبل رئاسته للحكومة."
  en: "Mohammed Shia' Sabbar al-Sudani (born 4 March 1970) is an Iraqi politician who was prime minister of Iraq from 27 October 2022 to 14 May 2026, in succession to Mustafa Al-Kadhimi. An agricultural engineer from a Maysan family whose father was executed in 1980 for Islamic Dawa Party membership, he was governor of Maysan in 2009–2010, Minister of Human Rights in 2010–2014 and Minister of Labour and Social Affairs in 2014–2018 before his premiership."
  ur: "محمد شیاع صبار السودانی (پیدائش 4 مارچ 1970ء) ایک عراقی سیاست دان ہیں جو 27 اکتوبر 2022ء سے 14 مئی 2026ء تک مصطفى الکاظمی کے جانشین کے طور پر عراق کے وزیرِ اعظم رہے۔ وہ زرعی انجینئر ہیں، میسان کے ایک خاندان سے ہیں جن کے والد کو 1980ء میں حزب الدعوۃ کی رکنیت پر پھانسی دی گئی؛ وہ 2009ء–2010ء میں گورنر میسان، 2010ء–2014ء میں وزیرِ انسانی حقوق اور 2014ء–2018ء میں وزیرِ محنت و سماجی امور رہے۔"
