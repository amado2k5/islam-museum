summary:
  ar: "محدّث معاصر، محقق «جامع الأصول» لابن الأثير الذي صدرت طبعته الأولى سنة 1389هـ/1969م، وظل يصححه ويراجعه حتى وفاته يوم الجمعة 13 شوال 1425هـ ⁦(26 تشرين الثاني 2004م)⁩، ودفن بتربة الحقلة في حي الميدان الفوقاني؛ وأتم مساعدوه طبعة الكتاب الثانية بعده {cite:jami-al-usul-arnaut-2016 p. 5-8}."
  en: "A modern hadith scholar, editor of Ibn al-Athir's Jami' al-Usul, first published in 1389 AH/1969 CE, which he kept correcting and revising until his death on Friday 13 Shawwal 1425 AH (26 November 2004), when he was buried in the al-Haqla cemetery in the upper Midan quarter; his assistants completed the book's second edition after him {cite:jami-al-usul-arnaut-2016 p. 5-8}."
  ur: "معاصر محدث، ابن الاثیر کی «جامع الاصول» کے محقق جس کا پہلا ایڈیشن 1389ھ/1969ء میں آیا؛ وہ اپنی وفات تک اس کی تصحیح و مراجعت کرتے رہے، جو جمعہ 13 شوال 1425ھ (26 نومبر 2004ء) کو ہوئی، اور محلہ المیدان الفوقانی کے مقبرہ الحقلہ میں دفن ہوئے؛ ان کے بعد ان کے معاونین نے کتاب کا دوسرا ایڈیشن مکمل کیا {cite:jami-al-usul-arnaut-2016 p. 5-8}۔"
died: { edtf: "2004-11-26", hijri: "1425-10-13", calendar: gregorian, precision: day, status: historical, note: "«الجمعة (١٣ شوال ٢٦/١٤٢٥ تشرين الثاني ٢٠٠٤)» كما في مقدمة الطبعة الثانية لجامع الأصول (ص 5 من المسح).", sources: [source/jami-al-usul-arnaut-2016] }
