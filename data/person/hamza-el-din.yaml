summary:
  ar: "موسيقي نوبي مصري، عازف عود وتار ومغنٍّ وملحّن، وُلد في قرية توشكي بجنوب مصر سنة 1929 وتوفي في بيركلي بكاليفورنيا سنة 2006. درس هندسة الكهرباء ثم الموسيقى في القاهرة وروما، وجمع الأغاني النوبية القديمة قبل أن يغمر السد العالي قرى النوبة، وحمل الموسيقى النوبية إلى المسارح والجامعات في الغرب، ويُعرف بأبي الموسيقى النوبية الحديثة."
  en: "Egyptian Nubian musician — oud and tar player, vocalist and composer — born in the village of Toshka in southern Egypt in 1929 and died at Berkeley, California, in 2006. Trained first as an electrical engineer, he studied music in Cairo and Rome, collected the old songs of Nubia before the Aswan High Dam flooded its villages, and carried Nubian music to Western stages and universities; he is known as the father of modern Nubian music."
  ur: "مصری نوبی موسیقار، عود و تار نواز، گلوکار و موسیقی ساز، جو 1929 میں جنوبی مصر کے گاؤں توشکا میں پیدا ہوئے اور 2006 میں برکلے، کیلیفورنیا میں وفات پائی۔ پہلے برقی انجینئر بنے، پھر قاہرہ اور روم میں موسیقی کی تعلیم حاصل کی، اسوان بند کے نوبیا کے گاؤں ڈبونے سے پہلے وہاں کے قدیم گیت جمع کیے اور نوبی موسیقی کو مغربی اسٹیجوں اور جامعات تک پہنچایا؛ انہیں جدید نوبی موسیقی کا بانی کہا جاتا ہے۔"
