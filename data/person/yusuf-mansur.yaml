summary:
  ar: "داعية وكاتب إندونيسي وُلد في جاكرتا سنة 1976 في أسرة من البيتاوي، يدير معهد دار القرآن في تانغيرانغ وأسس سنة 2003 برنامجاً لحفظ القرآن، واشتهر بدعوة الصدقة حتى لُقّب بـ«أستاذ الصدقة»، وأسس تطبيق الدفع «بايترن»، وكتب كتباً من أشهرها «البحث عن الإله المفقود»."
  en: "Indonesian preacher and writer born in Jakarta in 1976 into a Betawi family. He leads the Daarul Qur'an pesantren in Tangerang, founded a Qur'an-memorisation programme in 2003, became famous for charity-centred preaching that earned him the nickname 'Ustadz Sedekah', founded the Paytren payment app, and has written books including Mencari Tuhan yang Hilang (Seeking the Lost God)."
  ur: "انڈونیشی مبلغ و مصنف، جو 1976ء میں جکارتا میں ایک بیٹاوی خاندان میں پیدا ہوئے۔ تانگیرانگ کے دار القرآن مدرسے کے سربراہ ہیں، 2003ء میں حفظِ قرآن کا پروگرام شروع کیا، صدقے پر مرکوز دعوت سے «استاذ صدقہ» کے لقب سے مشہور ہوئے، پےٹرین ایپ قائم کی، اور «تلاشِ گم شدہ خدا» سمیت متعدد کتب لکھیں۔"
  es: "Predicador y escritor indonesio nacido en Yakarta en 1976 en el seno de una familia Betawi. Dirige el pesantren Daarul Qur'an en Tangerang, fundó un programa de memorización del Corán en 2003, se hizo famoso por su predicación centrada en la caridad, que le valió el apodo de 'Ustadz Sedekah', fundó la aplicación de pagos Paytren y ha escrito libros como Mencari Tuhan yang Hilang (Buscando al Dios perdido)."
  fr: "Prédicateur et écrivain indonésien né à Jakarta en 1976 dans une famille bétawi. Il dirige le pesantren Daarul Qur'an à Tangerang, a fondé un programme de mémorisation du Coran en 2003, est devenu célèbre pour ses prédications axées sur la charité qui lui ont valu le surnom d'« Ustadz Sedekah », a fondé l'application de paiement Paytren et a écrit des livres, dont Mencari Tuhan yang Hilang (À la recherche du Dieu perdu)."
  tr: "1976'da Cakarta'da Pitawi ailesinden bir ailede doğan Endonezyalı vaiz ve yazar olan Jakart, Tangirang'da Dar al-Quran Enstitüsü'nü yönetiyor. 2003 yılında Kur'an ezberleme programı kurdu, hayır çağrılarıyla ünlendi, 'Hayırseverlik Öğretmeni' lakabını kazandı, 'Paytern' ödeme uygulamasını kurdu ve en ünlü 'Kayıp Tanrı'nın Peşinde kitaplar yazdı."
  id: "Seorang pengkhotbah dan penulis Indonesia, lahir di Jakarta pada tahun 1976 dari keluarga Pitawi, ia menjalankan Institut Dar al-Quran di Tangirang. Pada tahun 2003, ia mendirikan program hafalan Al-Qur'an, menjadi terkenal karena menyerukan amal, sehingga dijuluki 'Guru Amal', mendirikan aplikasi pembayaran 'Paytern,' dan menulis buku di antara yang paling terkenal 'Mencari Tuhan yang Hilang.'"
