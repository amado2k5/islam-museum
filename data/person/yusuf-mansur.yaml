summary:
  ar: "داعية وكاتب إندونيسي وُلد في جاكرتا سنة 1976 في أسرة من البيتاوي، يدير معهد دار القرآن في تانغيرانغ وأسس سنة 2003 برنامجاً لحفظ القرآن، واشتهر بدعوة الصدقة حتى لُقّب بـ«أستاذ الصدقة»، وأسس تطبيق الدفع «بايترن»، وكتب كتباً من أشهرها «البحث عن الإله المفقود»."
  en: "Indonesian preacher and writer born in Jakarta in 1976 into a Betawi family. He leads the Daarul Qur'an pesantren in Tangerang, founded a Qur'an-memorisation programme in 2003, became famous for charity-centred preaching that earned him the nickname 'Ustadz Sedekah', founded the Paytren payment app, and has written books including Mencari Tuhan yang Hilang (Seeking the Lost God)."
  ur: "انڈونیشی مبلغ و مصنف، جو 1976ء میں جکارتا میں ایک بیٹاوی خاندان میں پیدا ہوئے۔ تانگیرانگ کے دار القرآن مدرسے کے سربراہ ہیں، 2003ء میں حفظِ قرآن کا پروگرام شروع کیا، صدقے پر مرکوز دعوت سے «استاذ صدقہ» کے لقب سے مشہور ہوئے، پےٹرین ایپ قائم کی، اور «تلاشِ گم شدہ خدا» سمیت متعدد کتب لکھیں۔"
