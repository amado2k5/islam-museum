id: person/al-aziz-fatimid
class: person
label: { ar: "العزيز بالله نزار بن المعز" }
summary:
  ar: "خامس ملوك الدولة العبيدية، نزار بن المعز لدين الله، قام بعد أبيه سنة خمس وستين، وورد رسوله إلى بغداد سنة تسع وستين وسأل عضد الدولة الطائع أن يزيد في ألقابه تاج الملة، وقال الذهبي فتحت له زيادة على آبائه حمص وحماة وحلب وخطب له بالموصل وباليمن وضرب اسمه فيها على السكة والأعلام ومات وقام بعده ابنه منصور ولقب الحاكم بأمر الله {cite:tarikh-khulafa-minhaj-1434 p. 627-636}. وعند ابن الأثير هو نزار بن المعز؛ استر موت أبيه سنة 365هـ حتى عيد النصر فصلى بالناس وخطهم ودعا لنفسه وعزى بأبيه، ولما استقر في الملك امتعض عليه العسكر فاجتمعوا عليه وكان يدبر الأمور منذ مرض أبيه، وأخرج يوسف بلكين على ولاية إفريقية {cite:kamil-ibn-al-athir p. 488}"
  en: "Nizar ibn al-Mu'izz, fifth Ubaydid caliph as al-Aziz bi'llah; his envoy reached Baghdad in 369, and per al-Dhahabi Hims, Hama and Aleppo were opened for him beyond his forebears' gains, he was preached at Mosul and Yemen, his name on their coinage and banners — succeeded by his son al-Hakim bi-Amr Allah {cite:tarikh-khulafa-minhaj-1434 p. 627-636}."
