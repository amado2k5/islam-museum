id: person/al-aziz-fatimid
class: person
label: { ar: "العزيز بالله نزار بن المعز", en: "al-Aziz bi'llah Nizar ibn al-Mu'izz", fr: "Al-Aziz bi-llah Nizar ibn al-Mu’izz", es: "al-Aziz bi'llah Nizar ibn al-Mu'izz", ur: "العزیز باللہ نزار ابن المعز" }
summary:
  ar: "خامس ملوك الدولة العبيدية، نزار بن المعز لدين الله، قام بعد أبيه سنة خمس وستين، وورد رسوله إلى بغداد سنة تسع وستين وسأل عضد الدولة الطائع أن يزيد في ألقابه تاج الملة، وقال الذهبي فتحت له زيادة على آبائه حمص وحماة وحلب وخطب له بالموصل وباليمن وضرب اسمه فيها على السكة والأعلام ومات وقام بعده ابنه منصور ولقب الحاكم بأمر الله {cite:tarikh-khulafa-minhaj-1434 p. 627-636}. وعند ابن الأثير هو نزار بن المعز؛ استر موت أبيه سنة 365هـ حتى عيد النصر فصلى بالناس وخطهم ودعا لنفسه وعزى بأبيه، ولما استقر في الملك امتعض عليه العسكر فاجتمعوا عليه وكان يدبر الأمور منذ مرض أبيه، وأخرج يوسف بلكين على ولاية إفريقية {cite:kamil-ibn-al-athir p. 488}"
  en: "Nizar ibn al-Mu'izz, fifth Ubaydid caliph as al-Aziz bi'llah; his envoy reached Baghdad in 369, and per al-Dhahabi Hims, Hama and Aleppo were opened for him beyond his forebears' gains, he was preached at Mosul and Yemen, his name on their coinage and banners — succeeded by his son al-Hakim bi-Amr Allah {cite:tarikh-khulafa-minhaj-1434 p. 627-636}."
  fr: "Nizar ibn al-Mu’izz, cinquième calife ubaydide sous le nom d’al-Aziz bi-llah ; son envoyé atteignit Bagdad en 369 H et, selon al-Dhahabi, Homs, Hama et Alep lui furent ouvertes au-delà des conquêtes de ses ancêtres ; la prédication fut faite en son nom à Mossoul et au Yémen, son nom figurant sur leurs monnaies et étendards — son fils al-Hakim bi-Amr Allah lui succéda {cite:tarikh-khulafa-minhaj-1434 p. 627-636}."
  es: "Nizar ibn al-Mu'izz, quinto califa ubaydí como al-Aziz bi'llah; su enviado llegó a Bagdad en 369, y por al-Dhahabi Hims, Hama y Alepo se abrieron para él más allá de las ganancias de sus antepasados, predicó en Mosul y Yemen, su nombre en sus monedas y estandartes, sucedido por su hijo al-Hakim bi-Amr Allah {cite:tarikh-khulafa-minhaj-1434 p. 627-636}."
  ur: "نزار بن المعز، پانچویں عبیدید خلیفہ بطور العزیز باللہ؛ اس کا ایلچی 369 میں بغداد پہنچا، اور الذہبی حمص، حما اور حلب کو اس کے آباؤ اجداد سے بڑھ کر اس کے لیے کھول دیا گیا، موصل اور یمن میں اس کی تبلیغ کی گئی، ان کے سکوں اور جھنڈوں پر اس کا نام لکھا گیا- اس کے بعد اس کے بیٹے الحکیم بن عمرو اللہ کے بعد اس کے بیٹے الحاکم بن عمرو اللہ نے اس کی جگہ لے لی۔ 627-636}۔"
  tr: "Fatımi Halifeliğinin beşinci halifesi Nizar ibn al-Mu'izz li-Din Allah, babasının yerine Hicri 65 yılında geçti. Elçisi Hicri 69 yılında Bağdat'a geldi ve Adud al-Dawla al-Ta'i'den unvanlarına \"Ummetin Tacı\" unvanını eklemesini istedi. Al-Dhahabi, atalarının fethettiği şehirlerin yanı sıra Humus, Hama ve Halep'i de fethettiğini, Musul ve Yemen'de cuma hutbesinin onun adına okunduğunu ve orada sikkeler ve sancaklar üzerine adının yazıldığını söyledi. Vefat etti ve oğlu Mansur, \"al-Hakim bi-Amr Allah\" unvanını alarak yerine geçti (bkz:tarikh-khulafa-minhaj-1434 AH, s. 627-636). İbn al-Athir'e göre, o Nizar ibn al-Mu'izz idi; Hicri 365 yılında babasının ölümünü zafer kutlamalarına kadar gizledi; zafer kutlamalarında halka namaz kıldırdı, isimlerini yazdı, kendisi için dua etti ve babası için taziye diledi. Yönetimini sağlamlaştırdığında, ordu ondan hoşnutsuzlaştı ve ona karşı ayaklandı. Babasının hastalığından beri işleri yönetiyordu ve Yusuf Buluggin'i İfrikiye valisi olarak atadı (bkz: Kamil ibn al-athir, s. 488)."
  id: "Khalifah kelima Kekhalifahan Fatimiyah, Nizar ibn al-Mu'izz li-Din Allah, menggantikan ayahnya pada tahun 65 H. Utusannya tiba di Baghdad pada tahun 69 H dan meminta Adud al-Dawla al-Ta'i untuk menambahkan gelar \"Mahkota Bangsa\" pada gelar-gelarnya. Al-Dhahabi mengatakan bahwa ia menaklukkan Homs, Hama, dan Aleppo, selain kota-kota leluhurnya, dan bahwa khutbah Jumat disampaikan atas namanya di Mosul dan Yaman, dan bahwa namanya diabadikan pada koin dan panji-panji di sana. Ia wafat, dan putranya Mansur menggantikannya, mengambil gelar al-Hakim bi-Amr Allah (lihat: Tarikh Khulafa Minhaj 1434 H, hlm. 627-636). Menurut Ibn al-Athir, ia adalah Nizar ibn al-Mu'izz; Ia menyembunyikan kematian ayahnya pada tahun 365 Hijriah hingga perayaan kemenangan, ketika ia memimpin orang-orang dalam salat, mencatat nama-nama mereka, berdoa untuk dirinya sendiri, dan menyampaikan belasungkawa atas kematian ayahnya. Setelah ia memperkuat kekuasaannya, tentara menjadi tidak puas dengannya dan memberontak melawannya. Ia telah mengelola urusan sejak ayahnya sakit, dan ia menunjuk Yusuf Buluggin sebagai gubernur Ifriqiya (lihat: Kamil Ibnu Al-Athir, hlm. 488)."
