id: person/abu-dulaf-al-yanbui
class: person
label: { ar: "أبو دلف الينبوعي", en: "Abu Dulaf al-Yanbui" }
summary:
  ar: "أبو دلف الينبوعي وكان جوالة، حكى لابن النديم عن بيوت بدد الهند: بيت الذهب المبني بالذهب المرصع بالجواهر الذي لا يصله مطر ولا سيل، وبيتا بقمار حيطانه من الذهب وسقوفه من أعواد العود الهندي التي طول كل عود خمسون ذراعا رصعت بددته ومحاريبه بالدر الفاخر واليواقيت العظام، وأن أهل الصنف لهم بيتا قديما جميع ما فيه من البددة تكلم العباد وتجيبهم عما يسألونها {cite:fihrist-ibn-al-nadim p. 486-487}. وحكى لابن النديم عن الصين أن اسم مدينة الملك الأعظم حمدان ومدينة التجار والأموال خانقو وطولها أربعون فرسخا، وأن للصين ثلاثمائة مدينة كلها عامرة، وأن من سنة الصين تعظيم الملوك والعبادة لها ومذهب الملك وأكابر الناس ثنوية وسمنية، وأن المسافر في بلاد الصين إذا سافر كتب نسبه وحليته ومبلغ سنه وما معه ولا يولى الملك عاملا ولا أميرا إلا وله أربعون سنة {cite:fihrist-ibn-al-nadim p. 491-493}"
  en: "Abu Dulaf al-Yanbui — the traveller who described India's gold-walled and talking-idol temples to Ibn al-Nadim {cite:fihrist-ibn-al-nadim}"
