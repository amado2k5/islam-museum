id: person/abu-dulaf-al-yanbui
class: person
label: { ar: "أبو دلف الينبوعي", en: "Abu Dulaf al-Yanbui", fr: "Abu Dulaf al-Yanbu'i", es: "Abu Dulaf al-Yanbui", ur: "ابو دلف ال ینبوی۔" }
summary:
  ar: "أبو دلف الينبوعي وكان جوالة، حكى لابن النديم عن بيوت بدد الهند: بيت الذهب المبني بالذهب المرصع بالجواهر الذي لا يصله مطر ولا سيل، وبيتا بقمار حيطانه من الذهب وسقوفه من أعواد العود الهندي التي طول كل عود خمسون ذراعا رصعت بددته ومحاريبه بالدر الفاخر واليواقيت العظام، وأن أهل الصنف لهم بيتا قديما جميع ما فيه من البددة تكلم العباد وتجيبهم عما يسألونها {cite:fihrist-ibn-al-nadim p. 486-487}. وحكى لابن النديم عن الصين أن اسم مدينة الملك الأعظم حمدان ومدينة التجار والأموال خانقو وطولها أربعون فرسخا، وأن للصين ثلاثمائة مدينة كلها عامرة، وأن من سنة الصين تعظيم الملوك والعبادة لها ومذهب الملك وأكابر الناس ثنوية وسمنية، وأن المسافر في بلاد الصين إذا سافر كتب نسبه وحليته ومبلغ سنه وما معه ولا يولى الملك عاملا ولا أميرا إلا وله أربعون سنة {cite:fihrist-ibn-al-nadim p. 491-493}"
  en: "Abu Dulaf al-Yanbui — the traveller who described India's gold-walled and talking-idol temples to Ibn al-Nadim {cite:fihrist-ibn-al-nadim}"
  fr: "Abu Dulaf al-Yanbu'i — le voyageur qui décrivit à Ibn al-Nadim les temples de l'Inde aux murs d'or et aux idoles parlantes {cite:fihrist-ibn-al-nadim}"
  es: "Abu Dulaf al-Yanbui — el viajero que describió los templos de la India con paredes de oro e ídolos parlantes {cite:fihrist-ibn-al-nadim}"
  ur: "ابو دلف ال ینبوی - وہ مسافر جس نے ہندوستان کے سونے کی دیواروں اور بات کرنے والے بت مندروں کو ابن الندیم کو بیان کیا"
  tr: "Seyyah Ebu Dulaf el-Yanbu'i, İbn el-Nadim'e Hint udunun evlerinden bahsetmiştir: Altınla yapılmış, mücevherlerle süslü, ne yağmurun ne de selin ulaşamadığı bir ev; duvarları altından, çatısı Hint ud ağacından yapılmış, her bir ağacın elli arşın uzunluğunda olduğu, udunun ve nişlerinin ince inciler ve büyük yakutlarla süslü olduğu bir ud evi; ve bu sınıfın insanlarının, ibadet edenlerle konuşan ve onlara sordukları soruları cevaplayan, her şeyi ud ağacından yapılmış eski bir evleri vardır. {Kaynak: Fihrist İbn el-Nadim, s. 486-487} İbn el-Nadim'e Çin hakkında şunları anlattı: Büyük kral Hamdan'ın ve tüccarların ve paranın şehri olan şehrin adı Hanku'dur ve uzunluğu kırk fersahtır; Çin'de üç yüz şehir vardır ve hepsi müreffehtir; Çin'de krallara saygı göstermek ve onlara tapmak adettir; kralın ve büyük halkın öğretisi düalizm ve Samnizm'dir; Çin topraklarında seyahat eden bir gezgin soyunu, tanımını, yaşını ve yanında ne olduğunu yazar ve kral, kırk yaşından önce bir işçi veya prens atamaz. {cite:fihrist-ibn-al-nadim p. 491-493}"
  id: "Abu Dulaf al-Yanbu’i, seorang musafir, menceritakan kepada Ibn al-Nadim tentang rumah-rumah kayu oud India: rumah emas yang dibangun dengan emas bertabur permata yang tidak terkena hujan maupun banjir, dan rumah kayu oud yang dindingnya terbuat dari emas dan atapnya dari kayu oud India, setiap kayunya sepanjang lima puluh hasta, dan kayu oud serta ceruknya bertabur mutiara halus dan batu rubi besar, dan bahwa orang-orang dari golongan tersebut memiliki rumah tua yang segala sesuatunya terbuat dari kayu oud yang berbicara kepada para penyembah dan menjawab apa yang mereka minta darinya {kutipan:fihrist-ibn-al-nadim hlm. 486-487}. Ia menceritakan kepada Ibn al-Nadim tentang Tiongkok bahwa nama kota raja besar Hamdan dan kota para pedagang dan uang adalah Khanqu dan panjangnya empat puluh farsakh, dan bahwa Tiongkok memiliki tiga ratus kota, semuanya makmur, dan bahwa merupakan kebiasaan Tiongkok untuk menghormati raja dan menyembah mereka, dan doktrin raja dan orang-orang besar adalah dualisme dan Samnisme, dan bahwa ketika seorang musafir melakukan perjalanan di negeri-negeri Tiongkok, ia menuliskan silsilahnya, deskripsinya, usianya dan apa yang dibawanya, dan raja tidak mengangkat seorang pekerja atau pangeran kecuali ia berusia empat puluh tahun. {cite:fihrist-ibn-al-nadim p. 491-493}"
