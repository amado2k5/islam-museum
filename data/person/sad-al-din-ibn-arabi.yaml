summary:
  ar: "محمد المدعو سعد الدين ابن الشيخ محيي الدين ابن العربي؛ ولد بملطية في رمضان سنة 618هـ وسمع الحديث ودرس وقال الشعر الجيد وله ديوان شعر مشهور، وقدم القاهرة وسكن حلباً وتوفي بدمشق سنة 656هـ سنة دخل هولاكو بغداد وقتل الخليفة المستعصم ودفن عند والده بسفح قاسيون {cite:nafh-tib-maqqari p. 172}."
  en: "Ibn Arabi's son Sa'd al-Din Muhammad — born at Malatya in Ramadan 618, a hadith-hearer and poet with a famous diwan, who died at Damascus in 656, the year Hülegü took Baghdad, and was buried beside his father on Qasiyun {cite:nafh-tib-maqqari p. 172}."
  es: "El hijo de Ibn Arabi, Sa'd al-Din Muhammad, nacido en Malatya en Ramadán 618, fue un oyente de hadices y poeta con un famoso diwan, que murió en Damasco en 656, el año en que Hülegü tomó Bagdad, y fue enterrado junto a su padre en Qasiyun {cite:nafh-tib-maqqari p. 172}."
  fr: "Le fils d'Ibn Arabi, Sa'd al-Din Muhammad — né à Malatya en Ramadan 618, un auditeur de hadiths et poète avec un diwan célèbre, qui mourut à Damas en 656, l'année où Hülegü prit Bagdad, et fut enterré aux côtés de son père sur Qasiyun {cite:nafh-tib-maqqari p. 172}."
  ur: "ابن عربی کا بیٹا سعد الدین محمد - رمضان 618 میں ملاتیا میں پیدا ہوا، ایک حدیث سننے والا اور مشہور دیوان کے ساتھ شاعر، جس کا انتقال 656 میں دمشق میں ہوا، جس سال حلیگو نے بغداد لیا، اور قصیون میں اپنے والد کے پاس دفن کیا گیا۔ 172}۔"
  tr: "Muhammed, Saad al-Din olarak bilinir, Şeyh Muhyiddin İbn el-Arabi'nin oğlu, 618 Hicri yılında Ramazan ayında Malati'de doğdu. Hadis dinledi, okudu, iyi şiirler yazdı ve ünlü bir şiir koleksiyonuna sahipti. Kahire'ye geldi, Halep'te yerleşti ve 656 H yılında Şam'da öldü. Hulagu Bağdat'a girdi, Halife el-Musta'sim'i öldürdü ve babasıyla birlikte Kasioun'un eteğine gömüldü {cite:nafh-tib-maqqari, s. 172}."
  id: "Muhammad, yang dikenal sebagai Saad al-Din, putra Sheikh Muhyiddin Ibn al-Arabi, lahir di Malatya pada Ramadan tahun 618 H. Ia mendengarkan hadits, belajar, menulis puisi yang baik, dan memiliki kumpulan puisi terkenal. Ia datang ke Kairo, menetap di Aleppo, dan meninggal di Damaskus pada tahun 656 H. Hulagu memasuki Baghdad, membunuh Khalifah al-Musta'sim, dan dimakamkan bersama ayahnya di kaki Qasioun {cite:nafh-tib-maqqari, hlm. 172}."
