summary:
  ar: "الحكم بن أبان، كان في سؤدده مجتهدًا، ومع السابحين مسبحًا. كان يصلي الليل، فإذا غلبه النوم ألقى نفسه في البحر وقال: أسبح الله مع الحيتان. يروي عنه إسحاق بن الضيف عن مشيخة من أهل عوف."
  en: "al-Hakam ibn Aban, diligent in his leadership and glorifying God among those who swim; he prayed through the night, and when sleep overcame him he cast himself into the sea, saying: I glorify God with the fish. Ishaq ibn al-Dayf relates it from elders of the people of Awf."
  ur: "حکم بن ابان اپنی سرداری میں محنت کرنے والے تھے، اور تیرنے والوں کے ساتھ اللہ کی تسبیح کرنے والے۔ رات کو نماز پڑھتے، اور جب نیند غالب آتی تو خود کو سمندر میں ڈال دیتے اور کہتے: میں مچھلیوں کے ساتھ اللہ کی تسبیح کرتا ہوں۔ اسحاق بن ضیف نے اہلِ عوف کے بزرگوں سے یہ روایت کی۔"
