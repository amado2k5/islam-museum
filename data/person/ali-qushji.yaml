summary:
  ar: "العلامة علي القوشجي، من أكبر علماء عصره في الرياضيات والفلك؛ ينقل الصلابي أنه كان كلما ألف كتاباً بالفارسية نقله إلى العربية وأهداه إلى السلطان محمد الفاتح {cite:dawlat-uthmaniyya-salabi p. 142}، ويعده ابن العماد فيمن استجلبه الفاتح من أقصى الديار فصارت أصطنبول بهم أم الدنيا {cite:shadharat-dhahab p. 344-345}."
  en: "The scholar Ali Qushji, among the greatest mathematicians and astronomers of his age; al-Salabi records that whenever he composed a book in Persian he would render it into Arabic and present it to Sultan Mehmed the Conqueror {cite:dawlat-uthmaniyya-salabi p. 142}, and Ibn al-Imad counts him among the great scholars Mehmed drew from the farthest lands until Istanbul became mother of the world {cite:shadharat-dhahab p. 344-345}."
  es: "El erudito Ali Qushji, uno de los más grandes matemáticos y astrónomos de su época; al-Salabi registra que cada vez que componía un libro en persa, lo traducía al árabe y se lo presentaba al sultán Mehmed el Conquistador {cite:dawlat-uthmaniyya-salabi p. 142}, e Ibn al-Imad lo cuenta entre los grandes eruditos que Mehmed atrajo de las tierras más lejanas hasta que Estambul se convirtió en la madre del mundo {cite:shadharat-dhahab p. 344-345}."
  fr: "Le savant Ali Qushji, parmi les plus grands mathématiciens et astronomes de son époque; al-Salabi rapporte que chaque fois qu'il composait un livre en persan, il le traduisait en arabe et le présentait au sultan Mehmed le Conquérant {cite:dawlat-uthmaniyya-salabi p. 142}, et Ibn al-Imad le compte parmi les grands savants que Mehmed a attirés des terres les plus lointaines jusqu'à ce qu'Istanbul devienne la mère du monde {cite:shadharat-dhahab p. 344-345}."
  ur: "اسکالر علی قشجی، اپنے دور کے عظیم ترین ریاضی دانوں اور فلکیات دانوں میں؛ الصلبی نے لکھا ہے کہ جب بھی وہ فارسی میں کوئی کتاب لکھتے تو اسے عربی میں پیش کرتے اور سلطان محمد فاتح کو پیش کرتے۔ 142}، اور ابن عماد نے اسے ان عظیم علماء میں شمار کیا ہے جب تک کہ محمد نے دور دراز علاقوں سے استنبول دنیا کی ماں نہیں بنا۔ 344-345}۔"
