  ar: "العلامة علي القوشجي، من أكبر علماء عصره في الرياضيات والفلك؛ ينقل الصلابي أنه كان كلما ألف كتاباً بالفارسية نقله إلى العربية وأهداه إلى السلطان محمد الفاتح {cite:dawlat-uthmaniyya-salabi p. 142}، ويعده ابن العماد فيمن استجلبه الفاتح من أقصى الديار فصارت أصطنبول بهم أم الدنيا {cite:shadharat-dhahab p. 344-345}."
  en: "The scholar Ali Qushji, among the greatest mathematicians and astronomers of his age; al-Salabi records that whenever he composed a book in Persian he would render it into Arabic and present it to Sultan Mehmed the Conqueror {cite:dawlat-uthmaniyya-salabi p. 142}, and Ibn al-Imad counts him among the great scholars Mehmed drew from the farthest lands until Istanbul became mother of the world {cite:shadharat-dhahab p. 344-345}."
