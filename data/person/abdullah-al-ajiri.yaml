  ar: "باحث ومفكر ومهندس سعودي، وُلد في الخبر سنة 1976، يدير مركز تكوين للدراسات والأبحاث، واشتهر بنقد الإلحاد ونظرية التطور وإلمامه بتراث ابن تيمية، وله مؤلفات مطبوعة في الفكر والدعوة."
