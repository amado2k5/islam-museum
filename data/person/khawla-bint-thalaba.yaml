summary:
  ar: "صحابية أنصارية نجدية اشتكت للنبي ظهار زوجها أوس بن الصامت منها وأبانت حالها وحال أولادها، فنزلت في شأنها مطالع سورة المجادلة حتى ورد التشريع بكفارة الظهار؛ ومن حديثها قصة كفارة أم المنذر بنت قيس، وسلّم عليها عمر بن الخطاب يوماً وعَرّف الناس بها قائلاً إنها التي سمع الله شكواها من فوق سبع سماوات."
  en: "An Ansari Companion who complained to the Prophet of her husband Aws ibn al-Samit's zihar and laid out her case and her children's, so the opening verses of Surat al-Mujadila were revealed concerning her, carrying the expiation ruling; Umar ibn al-Khattab once greeted her and told the people she was the woman whose plea God heard from above seven heavens."
