summary:
  ar: "لاعب كريكت باكستاني دولي وقائد سابق لمنتخب باكستان في الصيغ الثلاث، وُلد في لاهور سنة 1994 لأسرة من المدينة المسوّرة. ضارب أيمن في أعلى الترتيب عُرف بتقنيته الكلاسيكية وتوقيته، بدأ دوليا سنة 2015، وكان في فريق باكستان الفائز بكأس الأبطال 2017، وسجّل ثلاث مئات متتالية في مباريات اليوم الواحد سنة 2016، وقاد باكستان في الاختبار ومباريات اليوم الواحد ومباريات العشرين، وقادها إلى نهائي كأس العالم للعشرين سنة 2022، ونال جائزة المجلس الدولي للكريكت لأفضل لاعب في مباريات اليوم الواحد سنتي 2021 و2022، ويقود بيشاور زلمي في الدوري الباكستاني الممتاز."
  en: "Pakistani international cricketer and former captain of the Pakistan national team in all three formats, born in Lahore in 1994 to a family of the Walled City. A right-handed top-order batter known for classical technique and timing, he debuted internationally in 2015, was in the Pakistan team that won the 2017 Champions Trophy, scored three consecutive ODI centuries in 2016, captained Pakistan in Tests, ODIs and T20Is and led them to the 2022 T20 World Cup final, won the ICC Men's ODI Cricketer of the Year award in 2021 and 2022, and captains Peshawar Zalmi in the Pakistan Super League."
  ur: "پاکستانی بین الاقوامی کرکٹ کھلاڑی اور تینوں فارمیٹس میں قومی ٹیم کے سابق کپتان، جو 1994 میں لاہور میں اندرون شہر کے ایک خاندان میں پیدا ہوئے۔ دائیں ہاتھ کے ٹاپ آرڈر بلے باز، جو کلاسیکی تکنیک اور ٹائمنگ کے لیے مشہور ہیں، انھوں نے 2015ء میں بین الاقوامی آغاز کیا، 2017ء چیمپئنز ٹرافی جیتنے والی پاکستانی ٹیم میں شامل تھے، 2016ء میں مسلسل تین ایک روزہ سنچریاں بنائیں، ٹیسٹ، ایک روزہ اور ٹی ٹوئنٹی میں پاکستان کی قیادت کی اور ٹیم کو 2022ء ٹی ٹوئنٹی ورلڈ کپ کے فائنل تک پہنچایا، 2021ء اور 2022ء میں آئی سی سی مینز ون ڈے کرکٹر آف دی ایئر کا اعزاز جیتا، اور پاکستان سپر لیگ میں پشاور زلمی کی قیادت کرتے ہیں۔"
