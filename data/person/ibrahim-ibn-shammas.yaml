roles: [mystic, transmitter]
summary:
  ar: "إبراهيم بن شماس السمرقندي، سكن بغداد، مشهور بالتعبد الدائم، هائم في المحبة، أسند الحديث، وتروي عنه «حلية الأولياء» حديثًا عن أبي هريرة في ملك سليمان وخشوعه."
  en: "Ibrahim ibn Shammas al-Samarqandi, who settled in Baghdad, known for constant worship and for his love of God; a transmitter of hadith, from whom Hilyat al-Awliya relates a hadith from Abu Hurayra about Solomon's kingdom and humility."
  ur: "ابراہیم بن شماس سمرقندی بغداد میں رہے، دائمی عبادت اور محبت میں مشہور تھے، اور حدیث روایت کرتے تھے۔ «حلیۃ الاولیاء» میں ان سے ابو ہریرہ کی حدیث سلیمان کی بادشاہی اور خشوع کے بارے میں ہے۔"
  es: "Ibrahim ibn Shammas al-Samarqandi, quien se estableció en Bagdad, conocido por su constante devoción y por su amor a Dios; transmisor de hadices, de quien Hilyat al-Awliya relata un hadiz de Abu Hurayra sobre el reino y la humildad de Salomón."
  fr: "Ibrahim ibn Shammas al-Samarqandi, qui s'était installé à Bagdad, était connu pour sa dévotion constante et son amour de Dieu; transmetteur de hadiths, de qui Hilyat al-Awliya rapporte un hadith d'Abu Hurayra concernant le royaume et l'humilité de Salomon."
  tr: "Bağdatlı İbrahim ibn Şamas el-Samarqandi, sürekli bağlılığı, aşkta dolaşmasıyla tanınır, hadisler anlatmış ve Süleyman'ın saltanatı dönemindeki Ebu Hureyre ve alçakgönüllülüğü hakkında bir hadis olan 'Hilyat al-Evliya'da ondan rivayet etmiştir."
  id: "Ibrahim ibn Shammas al-Samarqandi, seorang penduduk Baghdad, terkenal karena pengabdiannya yang terus-menerus, suka mengembara dalam cinta, menceritakan hadits, dan menceritakan hadits darinya dalam 'Hilyat al-Awliya' tentang Abu Huraira pada masa pemerintahan Salomo dan kerendahan hatinya."
