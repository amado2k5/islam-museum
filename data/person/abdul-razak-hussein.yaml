summary:
  ar: "سياسي ماليزي، وُلد في بيكان بولاية بهانغ سنة 1922. كان نائب رئيس الوزراء من سنة 1957، وقاد مجلس العمليات الوطني بعد أعمال شغب 1969، فخلف تونكو عبد الرحمن رئيسا ثانيا لوزراء ماليزيا سنة 1970، وأطلق السياسة الاقتصادية الجديدة، وأعاد توجيه بلاده نحو عدم الانحياز، وتوفي في منصبه بلندن سنة 1976. وابنه الأكبر نجيب رزاق صار رئيس وزراء لاحقا."
  en: "Malaysian statesman, born at Pekan, Pahang, in 1922. Deputy prime minister from 1957, he directed the National Operations Council after the 1969 riots, succeeded Tunku Abdul Rahman as Malaysia's second prime minister in 1970, launched the New Economic Policy, and realigned the country towards non-alignment; he died in office at London in 1976. His eldest son, Najib Razak, later became prime minister."
  ur: "ملائیشیائی سیاست دان، جو 1922ء میں پیکان، پہانگ میں پیدا ہوئے۔ 1957ء سے نائب وزیرِ اعظم رہے، 1969ء کے فسادات کے بعد نیشنل آپریشنز کونسل کی قیادت کی، 1970ء میں تونکو عبدالرحمان کے جانشین کے طور پر ملائیشیا کے دوسرے وزیرِ اعظم بنے، نئی اقتصادی پالیسی شروع کی اور ملک کو غیر جانبداری کی طرف لے گئے؛ 1976ء میں لندن میں عہدے پر رہتے ہوئے وفات پائی۔ ان کے بڑے بیٹے نجیب رزاق بعد میں وزیرِ اعظم بنے۔"
