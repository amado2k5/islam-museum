summary:
  ar: "أبو الفضل جعفر بن الخليفة العباسي المكتفي بالله ⁦(294–377هـ)⁩، عالم متفنن في علوم كثيرة وفي أخبار الحكماء القدماء والمحدثين، حاور البتاني في شبابه وروى عنه تاريخ أرصاده، وكان من مصادر ابن النديم {cite:nallino-albatenii-opus-astronomicum p. 17}."
  en: "Abu al-Fadl Ja'far, son of the Abbasid caliph al-Muktafi (294–377 AH), a man learned in many sciences and in the history of ancient and recent sages, who as a young man questioned al-Battani and transmitted the dates of his observations; one of Ibn al-Nadim's sources {cite:nallino-albatenii-opus-astronomicum p. 17}."
  ur: "ابو الفضل جعفر، عباسی خلیفہ المکتفی باللہ کے بیٹے ⁦(294–377ھ)⁩، بہت سے علوم اور قدیم و جدید حکماء کی تاریخ کے ماہر، جنہوں نے جوانی میں البتانی سے گفتگو کی اور ان کے ارصاد کی تاریخیں روایت کیں؛ ابن الندیم کے مآخذ میں سے {cite:nallino-albatenii-opus-astronomicum p. 17}."
  es: "Abu al-Fadl Ja'far, hijo del califa abasí al-Muktafi (294–377 AH), un hombre versado en muchas ciencias y en la historia de los sabios antiguos y recientes, que de joven interrogó a al-Battani y transmitió las fechas de sus observaciones; una de las fuentes de Ibn al-Nadim {cite:nallino-albatenii-opus-astronomicum p. 17}."
  fr: "Abu al-Fadl Ja'far, fils du calife abbasside al-Muktafi (294-377 AH), homme versé dans de nombreuses sciences et dans l'histoire des sages anciens et récents, qui, jeune homme, a interrogé al-Battani et a transmis les dates de ses observations; une des sources d'Ibn al-Nadim {cite:nallino-albatenii-opus-astronomicum p. 17}."
  tr: "Abbasi Halifesi Ebu el-Fadl Ca'far bin Muktafi Billah (294–377 H) birçok bilim alanında ve eski ile modern bilginlerin anlatımlarında seçkin bir alimdi. Gençliğinde el-Battani ile tartışmış ve gözlemlerinin tarihini ondan anlatmıştır. İbn el-Nadim'in kaynakları arasında yer almıştır {cite:nallino-albatenii-opus-astronomicum s. 17}."
  id: "Abu al-Fadl Ja'far ibn Khalifah Abbasiyah al-Muktafi Billah (294–377 H) adalah seorang ulama terkemuka dalam banyak ilmu pengetahuan dan dalam catatan para bijak kuno dan modern. Ia berdebat tentang al-Battani di masa mudanya dan menceritakan sejarah pengamatan-pengamatannya. Ia termasuk di antara sumber Ibn al-Nadim {cite:nallino-albatenii-opus-astronomicum hlm. 17}."
