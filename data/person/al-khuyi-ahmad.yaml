summary:
  ar: "قاضي القضاة شمس الدين الخوئي الشافعي، نسبة إلى خوي مدينة بآذربيجان؛ دخل خراسان وقرأ بها الأصول على القطب المصري صاحب الإمام فخر الدين الرازي، وقرأ الفقه على الرافعي وعلم الجدل على علاء الدين الطوسي، وولي قضاء القضاة بالشام؛ وله كتاب في الأصول وكتاب فيه رموز حكمية وكتاب في النحو وكتاب في العروض، قال الذهبي كان فقيهاً إماماً مناظراً خبيراً بعلم الكلام أستاذاً في الطب والحكمة وديناً كثير الصلاة والصيام {cite:shadharat-dhahab p. 183}."
  en: "Qadi al-qudat al-Khuyi (b. 583, d. Sha'ban 637, buried below Qasyun) — al-Razi's usul pupil and al-Rafi'i's fiqh pupil, master of kalam, medicine and hikma; the Sham's chief judge {cite:shadharat-dhahab p. 183}."
