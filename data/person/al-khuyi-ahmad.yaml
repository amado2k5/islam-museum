summary:
  ar: "قاضي القضاة شمس الدين الخوئي الشافعي، نسبة إلى خوي مدينة بآذربيجان؛ دخل خراسان وقرأ بها الأصول على القطب المصري صاحب الإمام فخر الدين الرازي، وقرأ الفقه على الرافعي وعلم الجدل على علاء الدين الطوسي، وولي قضاء القضاة بالشام؛ وله كتاب في الأصول وكتاب فيه رموز حكمية وكتاب في النحو وكتاب في العروض، قال الذهبي كان فقيهاً إماماً مناظراً خبيراً بعلم الكلام أستاذاً في الطب والحكمة وديناً كثير الصلاة والصيام {cite:shadharat-dhahab p. 183}."
  en: "Qadi al-qudat al-Khuyi (b. 583, d. Sha'ban 637, buried below Qasyun) — al-Razi's usul pupil and al-Rafi'i's fiqh pupil, master of kalam, medicine and hikma; the Sham's chief judge {cite:shadharat-dhahab p. 183}."
  es: "Qadi al-qudat al-Khuyi (n. 583, m. Sha'ban 637, enterrado debajo de Qasyun): alumno usul de al-Razi y alumno de fiqh de al-Rafi'i, maestro de kalam, medicina y hikma; el juez principal del Sham {citar: shadharat-dhahab p. 183}."
  fr: "Qadi al-qudat al-Khuyi (né en 583, décédé Sha'ban en 637, enterré sous Qasyun) — élève usul d'al-Razi et élève fiqh d'al-Rafi'i, maître de kalam, de médecine et de hikma; le juge en chef du Sham {cite: shadharat-dhahab p. 183}."
  ur: "قادی القدۃ الخوی ⁦(متوفی 583، وفات: شعبان 637، قصیون کے نیچے دفن)⁩ — الرازی کے اصولی شاگرد اور الرافی کے فقہ کے شاگرد، کلام، طب اور حکمت کے ماہر؛ شام کے چیف جج {حوالہ دیں: شدارت ذہاب ص۔ 183}۔"
  tr: "Baş Yargıç Şemseddin el-Khoei el-Şafii, Azerbaycan'daki Khoy şehrinin adını taşıyor; Horasan'a girdi ve Mısırlı şair Sahib Fakhr al-Din al-Razi'nin yanında prensipleri öğrendi, al-Rafi'i'nin yanında fıkıh ve Ala al-Din al-Tusi'nin yanında hukuk eğitimi aldı. Levant'ta yargıç olarak görev yaptı. Temeller üzerine bir kitap, felsefi semboller içeren bir kitap, dilbilgisi üzerine bir kitap ve prosodi üzerine bir kitap yazdı. El-Dhahabi, kendisinin bir hukukçu, imam, münazaracı, teoloji uzmanı, tıp ve bilgelik profesörü, dua ve oruç tutan dindar bir adam olduğunu söyledi {atıf:shadharat-dhahab, s. 183}."
  id: "Ketua Hakim Shams al-Din al-Khoei al-Shafi'i, dinamai menurut Khoy, sebuah kota di Azerbaijan; ia masuk ke Khorasan dan mempelajari prinsip-prinsip di bawah penyair Mesir Sahib Fakhr al-Din al-Razi, mempelajari hukum di bawah al-Rafi'i, dan yurisprudensi di bawah Ala al-Din al-Tusi. Ia menjabat sebagai hakim di Levant. Ia menulis buku tentang dasar-dasar, buku yang memuat simbol filosofis, buku tata bahasa, dan buku tentang prosodi. Al-Dhahabi mengatakan ia adalah seorang ahli hukum, imam, debater, ahli teologi, profesor kedokteran dan kebijaksanaan, serta seorang yang taat dalam doa dan puasa {cite:shadharat-dhahab, hlm. 183}."
