summary:
  ar: "معاوية بن عمرو الموصلي الطائي؛ نزل ترير بأذربيجان فبنى بها وأسكنها ولده فبنوا قصوراً ومدّنوها وبنوا سوق باجروان وأفرده السلطان لهم."
  en: "Mu'awiya ibn Amr al-Mawsili al-Ta'i; he settled Tarir in Azerbaijan, built and housed his sons who raised palaces, made it a town and built the Bajirwan Market the Sultan set apart for them."
  es: "Mu'awiya ibn Amr al-Mawsili al-Ta'i fundó Tarir en Azerbaiyán, construyó palacios para sus hijos, quienes a su vez los construyeron, convirtiéndola en una ciudad y edificando el mercado de Bajirwan que el sultán había reservado para ellos."
  fr: "Mu'awiya ibn Amr al-Mawsili al-Ta'i; il établit Tarir en Azerbaïdjan, y construisit et logea ses fils qui érigèrent des palais, en firent une ville et construisirent le marché de Bajirwan que le sultan leur avait réservé."
  ur: "معاویہ بن عمرو الموسیلی الطائی، اس نے آذربائیجان میں تاریر کو آباد کیا، اپنے بیٹوں کو تعمیر اور رہائش دی جنہوں نے محلات بنائے، اسے ایک شہر بنایا اور سلطان نے ان کے لیے الگ الگ بجیروان مارکیٹ بنائی۔"
  tr: "Muaviye bin Amr el-Mevsili el-Tay; Azerbaycan'da Trir'de yerleşti, orada inşa etti ve oğlu da orada yerleşti. Saraylar ve şehirler inşa ettiler, Bajrawan'da bir pazar kurdular ve Sultan burayı onlara adadı."
  id: "Muawiyah ibn Amr al-Mawsili al-; ia menetap di Trir, Azerbaijan, membangunnya di sana, dan putranya menetap di sana. Mereka membangun istana dan kota, membangun pasar di Bajrawan, dan Sultan mendedikasikannya untuk mereka."
