summary:
  ar: "قاضي القضاة شمس الدين أبو البقاء محمد بن جماعة الكناني المقدسي الشافعي، ولد في أواخر صفر سنة ثلاث وثلاثين وثمانمائة بالقدس ونشأ بها واشتغل في صغره على جده، وأذن له تقي الدين بن قاضي شهبة بالإفتاء والتدريس مشافهة حين قدم إلى القدس، وتعيّن في حياة والده وجده وولي تدريس الصلاحية عن جده فباشره أحسن مباشرة وحضره الأعيان، وجمع له في صفر سنة اثنتين وسبعين بين قضاء القضاة وتدريس الصلاحية وخطابة الأقصى، ولم يلتمس على القضاء ولا الدرهم الواحد حتى تنزّه عن معالم الانتظار ما يستحقه شرعاً، ثم صُرف عن القضاء والتدريس بالعز الكناني فانقطع في منزله بالمسجد الأقصى يفتي ويدرّس؛ وله من المؤلفات شرح على جمع الجوامع سماه بالنجم اللامع وتعليق على الروضة إلى آثناء الحيض في مجلدات وتعليق على المنهاج في مجلدات والدر النظيم في أخبار موسى؛ توفي بالقدس في حدود سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 425-427}."
  en: "Third-generation Jerusalem chief qadi, b. Safar 833 — licensed to give fatwa by Taqi al-Din Ibn Qadi Shuhba, held in Safar 872 the combined offices of chief qadi, Salahiyya teacher and Aqsa preacher without ever taking an unlawful dirham; dismissed under al-'Aziz al-Kinani he withdrew into his house in the Aqsa compound; works include al-Najm al-Lami' on Jami' al-Jawami', volume-length ta'liqs on the Rawda and Minhaj, and al-Durr al-Nazim on the tale of Musa; d. ~901 at Jerusalem {cite:shadharat-dhahab p. 425-427}."
  es: "Cadí jefe de Jerusalén de tercera generación, b. Safar 833: autorizado para dar fatwa por Taqi al-Din Ibn Qadi Shuhba, ocupó en Safar 872 los cargos combinados de cadí principal, maestro de Salahiyya y predicador de Aqsa sin tomar nunca un dirham ilegal; despedido bajo el mando de al-'Aziz al-Kinani, se retiró a su casa en el complejo de Aqsa; las obras incluyen al-Najm al-Lami' sobre Jami' al-Jawami', ta'liqs de volumen sobre Rawda y Minhaj, y al-Durr al-Nazim sobre la historia de Musa; d. ~901 en Jerusalén {cita:shadharat-dhahab p. 425-427}."
  fr: "Cadi en chef de Jérusalem de troisième génération, b. Safar 833 — autorisé à prononcer des fatwa par Taqi al-Din Ibn Qadi Shuhba, a occupé à Safar 872 les fonctions combinées de cadi en chef, d'enseignant de Salahiyya et de prédicateur Aqsa sans jamais prendre de dirham illégal; renvoyé sous al-'Aziz al-Kinani, il s'est retiré dans sa maison située dans l'enceinte d'Aqsa; les travaux incluent al-Najm al-Lami' sur Jami' al-Jawami', des ta'liqs en volume sur le Rawda et le Minhaj, et al-Durr al-Nazim sur le conte de Musa; d. ~ 901 à Jérusalem {cite: shadharat-dhahab p. 425-427}."
  ur: "تیسری نسل یروشلم کے سربراہ قادی، بی. صفر 833 — تقی الدین ابن قادی شعبہ کی طرف سے فتویٰ دینے کا لائسنس، صفر 872 میں چیف قاضی، صالحیہ کے استاد اور اقصیٰ کے مبلغ کے مشترکہ دفاتر میں کبھی بھی غیر قانونی درہم لیے بغیر؛ العزیز الکنانی کے ماتحت برطرف وہ اقصیٰ کے احاطے میں اپنے گھر میں واپس چلا گیا۔ تصانیف میں جامع الجوامی پر النجم اللامی، روضہ اور منہاج پر حجم کی لمبائی، اور موسیٰ کی کہانی پر الدر الناظم شامل ہیں۔ d ~901 یروشلم میں {حوالہ: شدھارت ذہاب صفحہ۔ 425-427}۔"
  tr: "Baş Yargıç Şemseddin Ebu el-Baka Muhammed bin Cemaah el-Kinani el-Makdisi el-Şafii, 833 Hicri yılının geç Sefer'inde Kudüs'te doğdu, orada büyüdü ve gençliğinde büyükbabasının yanında çalıştı. Taqi al-Din ibn Qadi Shahba, Kudüs'e geldiğinde fetva vermesine ve sözlü ders vermesine izin verdi. Babası ve dedesi yaşarken otoriteyi dedesinden öğretmek üzere atandı, bu yüzden doğrudan aldı ve önemli kişiler eşlik etti. Yetmiş iki yılındaki Sefer'de, yargıcılığı yetki öğretimi ve Aksa'da yargı görevi almadan vaaz vererek birleştirdi. İslam hukukuna göre hak ettiğini bekleme izlerinden kurtulana kadar tek bir dirhem bile vermedi. Sonra yargı ve öğretimden Al-Izz al-Kinani'de görevden alındı, bu yüzden fetva vermek ve ders çalışmak için El-Aksa Camii'ndeki evine uğradı. Eserleri arasında, parlayan yıldız adını verdiği el-Cevami koleksiyonuna yapılan bir tefsir, adet başına kadar ciltler halinde bahçe üzerine bir şerh, ciltler halinde Minhaj üzerine bir şerh ve Musa'nın haberinde İlahi Yol ile el-Dürr el-Nazim üzerine bir şerh bulunmaktadır; yaklaşık 901 yılında Kudüs'te öldü {kaynak: şadharat-dhahab, s. 425-427}."
  id: "Hakim Agung Shams al-Din Abu al-Baqa Muhammad ibn Jama'ah al-Kinani al-Maqdisi al-Shafi'i lahir pada akhir Safar tahun 833 H di Yerusalem, tumbuh besar di sana, dan bekerja di masa mudanya di bawah kakeknya. Taqi al-Din ibn Qadi Shahba memberinya wewenang untuk mengeluarkan fatwa dan mengajar secara lisan ketika tiba di Yerusalem. Selama masa hidup ayah dan kakeknya, ia ditunjuk untuk mengajarkan otoritas dari kakeknya, sehingga ia menerimanya langsung dan dihadiri oleh tokoh-tokoh terkemuka. Di Safar pada tahun tujuh puluh dua, ia menggabungkan jabatan hakim dengan mengajar otoritas dan berkhotbah di Al-Aqsa tanpa mencari jabatan hakim. Tidak ada satu dirham pun sampai ia bebas dari tanda-tanda menunggu apa yang pantas ia terima menurut hukum Islam. Kemudian ia diberhentikan dari pengadilan dan pengajaran di Al-Izz al-Kinani, sehingga ia singgah di rumahnya di Masjid Al-Aqsa untuk memberikan fatwa dan belajar. Di antara karyanya adalah komentar atas koleksi al-Jawami' yang ia sebut bintang bersinar, komentar tentang taman hingga awal menstruasi dalam volume, komentar tentang Minhaj dalam volume, dan komentar tentang Jalan Ilahi dalam volume serta al-Durr al-Nazim dalam berita Musa; ia meninggal di Yerusalem sekitar tahun 901 {cite:shadharat-dhahab, hlm. 425-427}."
