summary:
  ar: "قاضي القضاة شمس الدين أبو البقاء محمد بن جماعة الكناني المقدسي الشافعي، ولد في أواخر صفر سنة ثلاث وثلاثين وثمانمائة بالقدس ونشأ بها واشتغل في صغره على جده، وأذن له تقي الدين بن قاضي شهبة بالإفتاء والتدريس مشافهة حين قدم إلى القدس، وتعيّن في حياة والده وجده وولي تدريس الصلاحية عن جده فباشره أحسن مباشرة وحضره الأعيان، وجمع له في صفر سنة اثنتين وسبعين بين قضاء القضاة وتدريس الصلاحية وخطابة الأقصى، ولم يلتمس على القضاء ولا الدرهم الواحد حتى تنزّه عن معالم الانتظار ما يستحقه شرعاً، ثم صُرف عن القضاء والتدريس بالعز الكناني فانقطع في منزله بالمسجد الأقصى يفتي ويدرّس؛ وله من المؤلفات شرح على جمع الجوامع سماه بالنجم اللامع وتعليق على الروضة إلى آثناء الحيض في مجلدات وتعليق على المنهاج في مجلدات والدر النظيم في أخبار موسى؛ توفي بالقدس في حدود سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 425-427}."
  en: "Third-generation Jerusalem chief qadi, b. Safar 833 — licensed to give fatwa by Taqi al-Din Ibn Qadi Shuhba, held in Safar 872 the combined offices of chief qadi, Salahiyya teacher and Aqsa preacher without ever taking an unlawful dirham; dismissed under al-'Aziz al-Kinani he withdrew into his house in the Aqsa compound; works include al-Najm al-Lami' on Jami' al-Jawami', volume-length ta'liqs on the Rawda and Minhaj, and al-Durr al-Nazim on the tale of Musa; d. ~901 at Jerusalem {cite:shadharat-dhahab p. 425-427}."
