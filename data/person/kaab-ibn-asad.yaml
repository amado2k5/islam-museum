summary:
  en: "The paramount leader of the Jewish tribe of Banu Qurayza in Medina; bound by treaty to the Prophet, he resisted Huyayy ibn Akhtab's persuasion before finally consenting to tear up the pact during the Battle of the Trench; he was judged and executed following the tribe's surrender."
  ar: "سيد بني قريظة وصاحب عهدهم وميثاقهم مع النبي؛ أغراه حيي بن أخطب بنقض العهد وممالأة الأحزاب حتى مزق الصحيفة في ذروة حصار الخندق؛ فلما حوصروا ونزلوا على حكم سعد بن معاذ قُتل مع مقاتلة قريظة. وقبل الإسلام كان هو الذي دعت إليه الأوس للمحالفة على الخزرج قبل بعاث ففعل، وذكّر الخزرج حين أخذوا في قتل رهن اليهود أن بينهم وبين الحلف ليلة وتسعة أشهر {cite:samhudi-wafa-al-wafa p. 229}."
  es: "Líder supremo de la tribu judía de Banu Qurayza en Medina; vinculado por tratado al Profeta, resistió la persuasión de Huyayy ibn Akhtab antes de finalmente acceder a romper el pacto durante la Batalla de la Trinchera; fue juzgado y ejecutado tras la rendición de la tribu."
  fr: "Chef suprême de la tribu juive des Banu Qurayza à Médine, lié par traité au Prophète, il résista aux tentatives de persuasion de Huyayy ibn Akhtab avant de finalement consentir à rompre le pacte lors de la bataille du Fossé; il fut jugé et exécuté après la reddition de la tribu."
  ur: "مدینہ میں یہودی قبیلے بنو قریظہ کا سب سے بڑا رہنما؛ نبی کے ساتھ معاہدے کے پابند ہونے کے بعد، اس نے خندق کی جنگ کے دوران معاہدے کو ختم کرنے پر رضامندی ظاہر کرنے سے پہلے حیا بن اخطب کے قائل کی مزاحمت کی۔ قبیلے کے ہتھیار ڈالنے کے بعد اس کا فیصلہ کیا گیا اور اسے پھانسی دے دی گئی۔"
  tr: "Banu Kurayza'nın efendisi ve Peygamber ile yaptıkları antlaşmanın sahibi; Huyyy ibn Ahtab, onu antlaşmayı bozmaya ve taraflara boyun eğmeye zorladı, ta ki siper kuşatmasının zirvesinde kaydı yırtana kadar; kuşatma altına alındıklarında ve Sa'd bin Muadh'ın yönetimi altına girdiklerinde, Kurayza savaşıyla birlikte öldürüldü. İslam'dan önce, Aws'ın Baath'tan önce Hazraj'a karşı ittifak çağrısı yaptığı kişiydi ve o da bunu yaptı. Hazraj, Yahudileri öldürmeye başladıklarında ittifak ile aralarında bir gece dokuz ay olduğunu belirtti {atıf:samhudi-wafa-al-wafa, s. 229}."
  id: "Tuan Banu Qurayza dan pemilik perjanjian serta perjanjian mereka dengan Nabi; Huyyy ibn Akhtab menggodanya untuk melanggar perjanjian dan menyerah kepada pihak-pihak, hingga ia merobek catatan pada puncak pengepungan parit; ketika mereka dikepung dan berada di bawah pemerintahan Sa'd ibn Muadh, ia tewas bersama pertempuran Quraizah. Sebelum Islam, dialah yang dipanggil oleh Aws untuk bersekutu melawan Khazraj sebelum Baath, dan ia melakukannya. Khazraj menyebutkan ketika mereka mulai membunuh orang Yahudi bahwa antara mereka dan aliansi adalah satu malam dan sembilan bulan {cite:samhudi-wafa-al-wafa, hlm. 229}."
