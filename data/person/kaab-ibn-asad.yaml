summary:
  en: "The paramount leader of the Jewish tribe of Banu Qurayza in Medina; bound by treaty to the Prophet, he resisted Huyayy ibn Akhtab's persuasion before finally consenting to tear up the pact during the Battle of the Trench; he was judged and executed following the tribe's surrender."
  ar: "سيد بني قريظة وصاحب عهدهم وميثاقهم مع النبي؛ أغراه حيي بن أخطب بنقض العهد وممالأة الأحزاب حتى مزق الصحيفة في ذروة حصار الخندق؛ فلما حوصروا ونزلوا على حكم سعد بن معاذ قُتل مع مقاتلة قريظة. وقبل الإسلام كان هو الذي دعت إليه الأوس للمحالفة على الخزرج قبل بعاث ففعل، وذكّر الخزرج حين أخذوا في قتل رهن اليهود أن بينهم وبين الحلف ليلة وتسعة أشهر {cite:samhudi-wafa-al-wafa p. 229}."
