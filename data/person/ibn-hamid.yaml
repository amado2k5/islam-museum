  ur: "اپنے وقت کے معروف حنبلی عالم اور استاد، قاضی ابو یعلٰی کے استاد؛ اس نے الجامع فی المذھب اور الخراقی کی تفسیر لکھی۔"
  tr: "Kendi döneminde Hanbalilerin imamı ve öğretmeni olup, 'Al-Jami' fi al-Madhhab' ve 'Sharh al-Khurqi' adlı eserlerin yazarı Hakim Abu Ya'la'nın öğretmenidir."
  id: "Imam Hanbal pada zamannya dan guru mereka, serta guru Hakim Abu Ya'la, penulis 'Al-Jami' fi al-Madhhab' dan 'Sharh al-Khurqi'."
