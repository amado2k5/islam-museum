summary:
  ar: "قائد المكتفي بالله، أرسله مع جماعة من القواد إلى زكرويه القرمطي فنفذ من القادسية على طريق خفان فلقيه يوم السبت لثمان بقين من ربيع الأول سنة أربع وتسعين ومائتين فاقتتلوا يومهم فقتل من القرامطة مقتلة عظيمة ووُضع زكرويه ضربة خالطت دماغه فعاش خمسة أيام ثم مات {cite:muntazam-ibn-al-jawzi p. 352}."
  en: "Al-Muktafi's commander sent against Zikrawayh the Qarmatian; he met him via al-Qadisiyya on the Khaffan road on Saturday 8 Rabi' I 294, slaughtered his host and struck Zikrawayh a blow that entered his brain — he died five days later {cite:muntazam-ibn-al-jawzi p. 352}."
