summary:
  ar: "قائد المكتفي بالله، أرسله مع جماعة من القواد إلى زكرويه القرمطي فنفذ من القادسية على طريق خفان فلقيه يوم السبت لثمان بقين من ربيع الأول سنة أربع وتسعين ومائتين فاقتتلوا يومهم فقتل من القرامطة مقتلة عظيمة ووُضع زكرويه ضربة خالطت دماغه فعاش خمسة أيام ثم مات {cite:muntazam-ibn-al-jawzi p. 352}."
  en: "Al-Muktafi's commander sent against Zikrawayh the Qarmatian; he met him via al-Qadisiyya on the Khaffan road on Saturday 8 Rabi' I 294, slaughtered his host and struck Zikrawayh a blow that entered his brain — he died five days later {cite:muntazam-ibn-al-jawzi p. 352}."
  es: "El comandante de Al-Muktafi envió contra Zikrawayh el Cármata; lo encontró a través de al-Qadisiyya en el camino de Khaffan el sábado 8 de Rabi' I de 294, masacró a su anfitrión y golpeó a Zikrawayh con un golpe que le alcanzó el cerebro; murió cinco días después {cite:muntazam-ibn-al-jawzi p. 352}."
  fr: "Le commandant d'Al-Muktafi envoya contre Zikrawayh le Qarmate; il le rencontra via al-Qadisiyya sur la route de Khaffan le samedi 8 Rabi' I 294, massacra son armée et frappa Zikrawayh d'un coup qui pénétra dans son cerveau — il mourut cinq jours plus tard {cite:muntazam-ibn-al-jawzi p. 352}."
