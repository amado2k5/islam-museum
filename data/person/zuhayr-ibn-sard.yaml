summary:
  en: "A chieftain of Hawazin who headed the fourteen-man delegation that came to the Prophet at al-Ji'rana as Muslims, pleading foster-kinship for the return of their captured women and children; the Prophet and the Muslims released six thousand captives in response."
  ar: "سيد من هوازن رأس وفدهم الأربعة عشر رجلاً الذين قدموا على النبي بالجعرانة مسلمين، فناشدوه قرابة الرضاع في بني سعد بن بكر وسألوه ردّ نسائهم وأبنائهم؛ فوهب لهم النبي نصيبه وتنازل المسلمون عن أنصبائهم فرُدّ ستة آلاف أسير."
  es: "Un jefe de Hawazin, que encabezaba la delegación de catorce hombres que acudió al Profeta en al-Ji'rana haciéndose pasar por musulmanes, implorando protección por parentesco para la devolución de sus mujeres y niños capturados, fue liberado por el Profeta y los musulmanes en respuesta."
  fr: "Un chef de Hawazin qui dirigeait la délégation de quatorze hommes venue trouver le Prophète à al-Ji'rana en tant que musulmans, plaidant pour la libération de leurs femmes et enfants capturés grâce à un lien de parenté adoptive; le Prophète et les musulmans libérèrent six mille captifs en réponse."
  ur: "ہوازن کا ایک سردار جو چودہ رکنی وفد کی سربراہی کر رہا تھا جو مسلمانوں کے طور پر الجیرانہ میں رسول اللہ کے پاس آیا تھا اور ان کی گرفتار شدہ عورتوں اور بچوں کی واپسی کے لیے رضاعی رشتہ داری کی درخواست کرتا تھا۔ رسول اللہ اور مسلمانوں نے جواب میں چھ ہزار قیدیوں کو رہا کیا۔"
  tr: "Hawazin'den bir usta, Müslüman olarak Peygamber'e gelen on dört adamlarını Peygamber'e götürdü. Banu Sa'd ibn Bakr arasında ona hemşire akrabası olarak başvurdular ve eşlerini ve çocuklarını geri vermesini istediler; Peygamber payını verdi, Müslümanlar paylarını bırakıp altı bin esir aldılar."
  id: "Seorang guru dari Hawazin memimpin empat belas orang mereka yang datang kepada Nabi di Al-Ja'ranah sebagai Muslim. Mereka memohon kepadanya sebagai kerabat perawat di antara Banu Sa'd ibn Bakr dan memohon agar ia mengembalikan istri dan anak-anak mereka; Nabi memberikan bagiannya, dan umat Muslim menyerahkan bagian mereka dan menangkap enam ribu tawanan."
