summary:
  en: "A chieftain of Hawazin who headed the fourteen-man delegation that came to the Prophet at al-Ji'rana as Muslims, pleading foster-kinship for the return of their captured women and children; the Prophet and the Muslims released six thousand captives in response."
  ar: "سيد من هوازن رأس وفدهم الأربعة عشر رجلاً الذين قدموا على النبي بالجعرانة مسلمين، فناشدوه قرابة الرضاع في بني سعد بن بكر وسألوه ردّ نسائهم وأبنائهم؛ فوهب لهم النبي نصيبه وتنازل المسلمون عن أنصبائهم فرُدّ ستة آلاف أسير."
