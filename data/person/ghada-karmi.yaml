summary:
  ar: "طبيبة وكاتبة فلسطينية (وُلدت في القدس سنة 1939). هُجّرت مع أسرتها سنة 1948، ودرست الطب في بريستول ونالت الدكتوراه في تاريخ الطب العربي، وأصبحت من أبرز الأصوات الفلسطينية في بريطانيا؛ ومذكراتها «البحث عن فاطمة» (2002) من أشهر شهادات جيل النكبة."
  en: "Palestinian physician and writer (born 1939 in Jerusalem). Exiled with her family in 1948, she qualified in medicine at Bristol, took a doctorate in the history of Arabic medicine, and became a leading Palestinian voice in Britain; her memoir In Search of Fatima (2002) is a classic account of the Nakba generation."
  ur: "فلسطینی معالج اور مصنفہ (پیدائش 1939ء، قدس)۔ 1948ء میں خاندان سمیت بے گھر ہوئیں، برسٹل سے طب کی تعلیم حاصل کی اور عربی طب کی تاریخ میں ڈاکٹریٹ کیا؛ برطانیہ میں ممتاز فلسطینی آواز بنیں، اور ان کی یادداشتیں «فاطمہ کی تلاش میں» (2002ء) نسلِ نکبہ کی مشہور شہادتوں میں سے ہیں۔"
