summary:
  ar: "أمير أفغانستان (1901-1919) من أسرة بركزاي، أكبر أبناء الأمير عبد الرحمن خان. حاكم إصلاحي نسبيا: أدخل الطب والتقنية الحديثة، وأسس مدرسة حبيبية وأكاديمية عسكرية، وخفف أشد العقوبات، وحفظ حياد أفغانستان في الحرب العالمية الأولى رغم ضغوط الدولة العثمانية وألمانيا. اغتيل أثناء رحلة صيد في لغمان في فبراير 1919، وهو والد الملك أمان الله خان."
  en: "Emir of Afghanistan (1901–1919) of the Barakzai dynasty, eldest son of Emir Abdur Rahman Khan. A relatively reform-minded ruler: he brought in modern medicine and technology, founded the Habibia High School and a military academy, repealed the harshest criminal penalties, and kept Afghanistan neutral in the First World War despite Ottoman and German pressure. He was assassinated on a hunting trip in Laghman in February 1919; he was the father of King Amanullah Khan."
  ur: "افغانستان کے امیر (1901ء–1919ء)، بارکزئی خاندان سے، امیر عبد الرحمن خان کے سب سے بڑے بیٹے۔ نسبتاً اصلاح پسند حکمران: جدید طب اور ٹیکنالوجی متعارف کرائی، حبیبیہ ہائی اسکول اور فوجی اکیڈمی قائم کی، سخت ترین سزائیں ختم کیں اور پہلی جنگِ عظیم میں عثمانی اور جرمن دباؤ کے باوجود افغانستان کو غیر جانبدار رکھا۔ فروری 1919ء میں لغمان میں شکار کے دوران قتل کیے گئے؛ بادشاہ امان اللہ خان کے والد تھے۔"
