summary:
  ar: "أمير أفغانستان (1901-1919) من أسرة بركزاي، أكبر أبناء الأمير عبد الرحمن خان. حاكم إصلاحي نسبيا: أدخل الطب والتقنية الحديثة، وأسس مدرسة حبيبية وأكاديمية عسكرية، وخفف أشد العقوبات، وحفظ حياد أفغانستان في الحرب العالمية الأولى رغم ضغوط الدولة العثمانية وألمانيا. اغتيل أثناء رحلة صيد في لغمان في فبراير 1919، وهو والد الملك أمان الله خان."
  en: "Emir of Afghanistan (1901–1919) of the Barakzai dynasty, eldest son of Emir Abdur Rahman Khan. A relatively reform-minded ruler: he brought in modern medicine and technology, founded the Habibia High School and a military academy, repealed the harshest criminal penalties, and kept Afghanistan neutral in the First World War despite Ottoman and German pressure. He was assassinated on a hunting trip in Laghman in February 1919; he was the father of King Amanullah Khan."
  ur: "افغانستان کے امیر ⁦(1901ء–1919ء)⁩، بارکزئی خاندان سے، امیر عبد الرحمن خان کے سب سے بڑے بیٹے۔ نسبتاً اصلاح پسند حکمران: جدید طب اور ٹیکنالوجی متعارف کرائی، حبیبیہ ہائی اسکول اور فوجی اکیڈمی قائم کی، سخت ترین سزائیں ختم کیں اور پہلی جنگِ عظیم میں عثمانی اور جرمن دباؤ کے باوجود افغانستان کو غیر جانبدار رکھا۔ فروری 1919ء میں لغمان میں شکار کے دوران قتل کیے گئے؛ بادشاہ امان اللہ خان کے والد تھے۔"
  es: "Emir de Afganistán (1901-1919), de la dinastía Barakzai, hijo mayor del emir Abdur Rahman Khan. Gobernante con una mentalidad relativamente reformista, introdujo la medicina y la tecnología modernas, fundó la escuela secundaria Habibia y una academia militar, abolió las penas más severas y mantuvo a Afganistán neutral durante la Primera Guerra Mundial a pesar de la presión otomana y alemana. Fue asesinado durante una cacería en Laghman en febrero de 1919; fue padre del rey Amanullah Khan."
  fr: "Émir d'Afghanistan (1901-1919) de la dynastie Barakzai, fils aîné de l'émir Abdur Rahman Khan. Souverain relativement réformateur, il introduisit la médecine et les technologies modernes, fonda le lycée Habibia et une académie militaire, abolit les peines criminelles les plus sévères et maintint la neutralité de l'Afghanistan durant la Première Guerre mondiale malgré les pressions ottomanes et allemandes. Il fut assassiné lors d'une partie de chasse à Laghman en février 1919; il était le père du roi Amanullah Khan."
  tr: "Afganistan Emiri (1901-1919), Barakzai ailesinden, Prens Abdurrahman Han'ın en büyük oğlu. Görece reformcu bir hükümdar: modern tıp ve teknolojiyi tanıttı, Habibiya okulu ve askeri akademisi kurdu, en ağır cezaları hafifletti ve Osmanlı İmparatorluğu ile Almanya'nın baskısına rağmen I. Dünya Savaşı'nda Afganistan'ın tarafsızlığını korudu. Şubat 1919'da Laghman'da bir av gezisi sırasında suikaste uğradı. Kral Amanullah Han'ın babasıydı."
  id: "Emir Afghanistan (1901-1919) dari keluarga Barakzai, putra sulung Pangeran Abdur Rahman Khan. Penguasa yang relatif reformis: memperkenalkan pengobatan dan teknologi modern, mendirikan sekolah Habibiya dan akademi militer, melonggarkan hukuman paling berat, dan mempertahankan netralitas Afghanistan dalam Perang Dunia I meskipun mendapat tekanan dari Kekaisaran Ottoman dan Jerman. Ia dibunuh saat berburu di Laghman pada Februari 1919. Ia adalah ayah dari Raja Amanullah Khan."
