summary:
  ar: "حارس مرمى تونسي سابق ومسؤول كروي ⁦(وُلد سنة 1966 في تونس العاصمة)⁩، قضى مسيرته الكروية بأكملها تقريباً في الترجي الرياضي التونسي وفاز معه بأربع كؤوس قارية ولعب في كأس العالم 1998، ثم أصبح في مايو 2026 نائب رئيس النادي مكلفاً بكرة القدم."
  en: "Tunisian former footballer and football administrator (born 1966 in Tunis), a goalkeeper who spent nearly his whole career at Espérance de Tunis, won four CAF Champions League titles and played at the 1998 World Cup; in May 2026 he became the club's vice-president in charge of football."
  ur: "تیونسی سابق فٹبالر اور فٹبال منتظم ⁦(پیدائش 1966، تیونس شہر)⁩، گول کیپر جنہوں نے اپنا تقریباً پورا کیریئر ایسپیرانس تیونس میں گزارا، چار افریقی چیمپئنز لیگ خطابات جیتے اور 1998 کے ورلڈ کپ میں کھیلے؛ مئی 2026 میں وہ ایسپیرانس کے نائب صدر برائے فٹبال بنے۔"
  es: "Exfutbolista y dirigente deportivo tunecino (nacido en 1966 en Túnez), portero que pasó casi toda su carrera en el Espérance de Tunis, ganó cuatro títulos de la Liga de Campeones de la CAF y participó en la Copa del Mundo de 1998; en mayo de 2026 se convirtió en vicepresidente del club a cargo del área de fútbol."
  fr: "Ancien footballeur et dirigeant de football tunisien (né en 1966 à Tunis), gardien de but ayant passé la quasi-totalité de sa carrière à l'Espérance de Tunis, a remporté quatre titres de Ligue des champions de la CAF et a participé à la Coupe du monde de 1998; en mai 2026, il est devenu vice-président du club en charge du football."
  tr: "Eski bir Tunuslu kaleci ve futbol hakemi olan Espérance Sportive de Tunis'te oynadı; futbol kariyerinin neredeyse tamamını Espérance Sportive de Tunis'te geçirdi; burada dört kıta kupası kazandı, 1998 Dünya Kupası'nda oynadı ve Mayıs 2026'da kulübün futboldan sorumlu başkan yardımcısı oldu."
  id: "Mantan kiper dan pejabat sepak bola Tunisia (lahir tahun 1966 di Tunis), ia menghabiskan hampir seluruh karier sepak bolanya di Espérance Sportive de Tunis, memenangkan empat piala kontinental bersama mereka, bermain di Piala Dunia 1998, dan kemudian pada Mei 2026 menjadi wakil presiden klub yang bertanggung jawab atas sepak bola."
