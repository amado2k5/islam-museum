  ar: اختُلف في صحبتها، وأبعد من قال إنه لا رؤية لها لثبوت حديثها في البخاري تعليقاً؛ روت عن عائشة وأم حبيبة وأم سلمة وأسماء، وذكرها ابن حبان في ثقات التابعين.
  en: Whether she was a Companion is disputed, and the view that she never saw the Prophet is called the most remote because her hadith is established in al-Bukhari in suspended form; she narrated from Aisha, Umm Habiba, Umm Salama and Asma,
    and Ibn Hibban counts her among the trustworthy Successors.
