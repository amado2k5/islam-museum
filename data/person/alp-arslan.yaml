label: { ar: "ألب أرسلان عضد الدولة بن جغري بك" }
summary:
  ar: "ثاني سلاطين السلاجقة، أقيم في السلطنة بعد عمه طغرل بك سنة خمس وخمسين وبعث إليه القائم بالخلع والتقليد، وقال الذهبي هو أول من ذكر بالسلطان على منابر بغداد وبلغ ما لم يبلغه أحد من الملوك وافتتح بلاداً كثيرة من بلاد النصارى واستوزر نظام الملك فأبطل ما كان عليه الوزير قبله عميد الملك من سب الأشعرية وانتصر للشافعية وأكرم إمام الحرمين وأبا القاسم القشيري وبنى النظامية وقيل وهي أول مدرسة بنيت للفقهاء {cite:tarikh-khulafa-minhaj-1434 p. 644-645}."
  en: "Second Seljuk sultan, succeeding his uncle Tughrul in 455 with al-Qa'im's investiture; al-Dhahabi: the first called 'sultan' on Baghdad's minbars, he reached what no king had reached, opened many Christian lands, and took Nizam al-Mulk as vizier — who ended his predecessor's cursing of the Ash'aris, championed the Shafi'is, honoured Imam al-Haramayn and al-Qushayri, and built the Nizamiyya, 'said to be the first school built for the jurists' {cite:tarikh-khulafa-minhaj-1434 p. 644-645}."
