id: person/alp-arslan
class: person
label: { ar: "ألب أرسلان عضد الدولة بن جغري بك" , ur: "الپ ارسلان", en: "Alp Arslan", es: "Alp Arslan", fr: "Alp Arslan"}
summary:
  ar: "ثاني سلاطين السلاجقة، أقيم في السلطنة بعد عمه طغرل بك سنة خمس وخمسين وبعث إليه القائم بالخلع والتقليد، وقال الذهبي هو أول من ذكر بالسلطان على منابر بغداد وبلغ ما لم يبلغه أحد من الملوك وافتتح بلاداً كثيرة من بلاد النصارى واستوزر نظام الملك فأبطل ما كان عليه الوزير قبله عميد الملك من سب الأشعرية وانتصر للشافعية وأكرم إمام الحرمين وأبا القاسم القشيري وبنى النظامية وقيل وهي أول مدرسة بنيت للفقهاء {cite:tarikh-khulafa-minhaj-1434 p. 644-645}، وقصد بلاد الترك بمائتي ألف فارس فعبر جيحون على جسر في شهر وقصر على بلدة يقال لها فربر فأحضر إليه مستحفظ قلعتها يوسف الخوارزمي وأمر أن تضرب له أربعة أوتاد يعذب ثم يقتل فقال له يا مخنث مثلي يقتل هذه القتلة فاحتد السلطان ورماه فأخطأه فبادره يوسف وضربه بسكين في خاصرته فمات يوم السبت عاشر ربيع الأول سنة خمس وستين وأربع مئة ونقل إلى مرو ودفن عند أبيه وعمه ولم يدخل بغداد ولا رآها مع أنها ثانية داخلة في مملكته وهو الذي بنى على قبر أبي حنيفة القبة {cite:shadharat-dhahab p. 326-327}."
  en: "Second Seljuk sultan, succeeding his uncle Tughrul in 455 with al-Qa'im's investiture; al-Dhahabi: the first called 'sultan' on Baghdad's minbars, he reached what no king had reached, opened many Christian lands, and took Nizam al-Mulk as vizier — who ended his predecessor's cursing of the Ash'aris, championed the Shafi'is, honoured Imam al-Haramayn and al-Qushayri, and built the Nizamiyya, 'said to be the first school built for the jurists' {cite:tarikh-khulafa-minhaj-1434 p. 644-645}. He died of Yushk the Khwarizmian fortress-keeper's knife at Barbar on the Jihun in 465, entrusting the realm to Malikshah and Nizam al-Mulk; he never saw Baghdad though it lay within his kingdom, and it was he who domed Abu Hanifa's grave {cite:shadharat-dhahab p. 326-327}."
  ur: "سلجوقی سلطان جو طغرل کے بعد تخت نشین ہوا؛ اس کے عہد میں سلجوقی اقتدار پھیلا اور ملازگرد کی جنگ ہوئی۔ {cite:shadharat-dhahab}"
  es: "Segundo sultán selyúcida, sucediendo a su tío Tughrul en 455 con la investidura de al-Qa'im; al-Dhahabi: el primero llamado 'sultán' en los minbares de Bagdad, llegó a donde ningún rey había llegado, abrió muchas tierras cristianas y tomó a Nizam al-Mulk como visir, quien puso fin a la maldición de su predecesor contra los ash'aris, defendió a los shafi'is, honró al imán al-Haramayn y a al-Qushayri, y construyó la Nizamiyya, 'que se dice que fue la primera escuela construida para los juristas' {cite:tarikh-khulafa-minhaj-1434 p. 644-645}. Murió a manos de Yushk, el guardián de la fortaleza de Khwarizm, en Barbar en el Jihun en 465, confiando el reino a Malikshah y Nizam al-Mulk; Nunca vio Bagdad, aunque estaba dentro de su reino, y fue él quien colocó la cúpula en la tumba de Abu Hanifa {cite:shadharat-dhahab p. 326-327}."
  fr: "Deuxième sultan seldjoukide, succédant à son oncle Tughrul en 455 avec l'investiture d'al-Qa'im; al-Dhahabi: le premier appelé « sultan » sur les minbars de Bagdad, il accomplit ce qu'aucun roi n'avait accompli auparavant, ouvrit de nombreuses terres chrétiennes et prit Nizam al-Mulk comme vizir — qui mit fin aux malédictions de son prédécesseur contre les Ash'arites, défendit les Shafi'ites, honora l'imam al-Haramayn et al-Qushayri et fit construire la Nizamiyya, « considérée comme la première école construite pour les juristes » {cite: tarikh-khulafa-minhaj-1434 p. 644-645}. Il mourut du couteau de Yushk, le gardien de forteresse khwarezmien, à Barbar sur le Jihun en 465, confiant le royaume à Malikshah et à Nizam al-Mulk; Il n'a jamais vu Bagdad bien qu'elle se trouvât dans son royaume, et c'est lui qui a recouvert la tombe d'Abu Hanifa {cite:shadharat-dhahab p. 326-327}."
  tr: "İkinci Selçuklu sultanı, amcası Tuğril Beg'den sonra 55 H. yılında sultanlığa yerleşmiş ve tahttan indirip taklit eden kişiyi ona göndermiştir. El-Dhahabi, Bağdat kürsüsünde sultanı ilk kez anan olduğunu, başka hiçbir kralın ulaşamadığı bir seviyeye ulaştığını söylemiştir. Birçok Hristiyan topraklarını fethetmiş ve önceki vezirin Aş'arilere yönelik hakaretlerini geçersiz kılan Nizam al-Mulk'un danışmanlık otoritesini aramıştır; Nizam Mülk, önceki vezirin Aş'arilere yönelik hakaretlerini geçersiz kılmıştır, Şafiileri desteklemiştir, İki Kutsal Cami imamı Ebu el-Kasim el-Kuşayri'yi onurlandırmış ve Nizamiyye'yi inşa etmiştir. Söylendiğine göre bu, hukukçular için inşa edilen ilk okuldur. {alıntı: Tarikh-khulafa-minhaj-1434, s. 644-645} ve iki yüz bin süvarıyla Türklerin topraklarına doğru yola çıktı. Jayhun bir ayda bir köprüyü geçti ve Farbar adında bir kasabayı kuşattı. Kalenin valisi Yusuf el-Horizmi ona getirildi ve işkence için dört kazık vurulmasını emretti, sonra öldürüldü. Sultan ona, 'Sen de benim gibi kadınsın, bu katilleri öldür.' dedi. Sultan huzursuzlandı ve onu vurdu, ama isabet etmedi. Yusuf araya girip onu bıçakla bıçakladı. Cumartesi günü, Rabi'al-Awwal'ın onuncusu günü, 465 Hâriet'te öldü ve Marw'a nakledildi, burada babası ve amcasıyla birlikte gömüldü, içeri girmedi. Bağdat'ı görmedi, oysa krallığının ikinci kısmı olmasına rağmen ve Ebu Hanife türbesinin üzerine kubbeyi inşa eden kişi oydu {cite:shadharat-dhahab, s. 326-327}."
  id: "Sultan Seljuk kedua, didirikan di kesultanan setelah pamannya Tughril Beg pada tahun 55 H, dan mengirimkan kepadanya orang yang menggulingkan dan meniru tahta. Al-Dhahabi mengatakan bahwa ia adalah yang pertama menyebut sultan di mimbar Baghdad, mencapai tingkat yang belum pernah dicapai raja lain. Ia menaklukkan banyak wilayah Kristen dan mencari otoritas penasihat Nizam al-Mulk, yang membatalkan hinaan wazir sebelumnya terhadap Ash'ari, mendukung Syhafi'i, menghormati Imam Dua Masjid Suci, Abu al-Qasim al-Qushayri, dan membangun Nizamiyya. Konon ini adalah sekolah pertama yang dibangun untuk para ahli hukum. {cite: Tarikh-khulafa-minhaj-1434, hlm. 644-645}, dan menuju ke tanah Turki bersama dua ratus ribu penunggang kuda. Jayhun menyeberangi sebuah jembatan dalam sebulan dan mengepung sebuah kota bernama Farbar. Gubernur bentengnya, Yusuf al-Khwarizmi, dibawa kepadanya dan memerintahkan agar empat tiang dipukul untuk menyiksanya lalu dibunuh. Ia berkata kepadanya, 'Kau seperti aku, bunuh para pembunuh ini.' Sultan menjadi gelisah dan menembaknya, tetapi ia meleset. Yusuf turun tangan dan menusuk sisi tubuhnya dengan pisau. Ia meninggal pada hari Sabtu, tanggal sepuluh Rabi' al-Awwal, 465 H, dan dipindahkan ke Marw, di mana ia dimakamkan bersama ayah dan pamannya dan tidak masuk. Baghdad, dan dia tidak melihatnya, meskipun itu adalah bagian kedua dari kerajaannya, dan dialah yang membangun kubah di atas makam Abu Hanifa {cite:shadharat-dhahab, hlm. 326-327}."
