summary:
  ar: "معلم وناشر وسياسي قرِمي تاتاري (1851–1914)، مؤسس صحيفة «ترجمان» ومبتكر إصلاح «أصول جديد» (الأسلوب الجديد) في مدارس المسلمين، والملهم الأبرز لحركة الجديد بين مسلمي الإمبراطورية الروسية. دعا إلى لغة أدبية تركية مشتركة وإلى وحدة الشعوب التركية والمسلمة وتحديثها عبر التعليم."
  en: "Crimean Tatar educator, publisher and politician (1851–1914), founder of the newspaper Terciman and of the usul-ü cedit (new method) reform of Muslim schooling, and the leading inspiration of the Jadid movement among the Muslims of the Russian Empire. He campaigned for a common Turkic literary language and for the unity and modernisation of the Turkic and Muslim peoples of the empire through education."
  ur: "قریمی تاتار معلم، ناشر اور سیاست دان (1851–1914)، اخبار «ترجمان» کے بانی اور مسلم مکاتب کی اصلاح «اصولِ جدید» کے موجد، اور سلطنتِ روس کے مسلمانوں میں تحریکِ جدید کے سب سے بڑے محرک۔ انہوں نے مشترکہ ترک ادبی زبان اور تعلیم کے ذریعے ترک و مسلم اقوام کے اتحاد اور تجدید کی دعوت دی۔"
