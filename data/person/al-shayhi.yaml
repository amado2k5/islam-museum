  - value: sufi
    basis: documented
    note: "His Sufi affiliation is attested for the man himself. The TDV Islam Ansiklopedisi entry (Biltekin), read in full, reports on Latifi's Tezkire that returning from his studies in Iran he stopped at Ankara and bound himself (intisab) to Haci Bayram Veli, and adds that later scholarship has accepted the inference that he took his pen name Seyhi from this affiliation; the Turkish Wikipedia article carries the same affiliation, in its stronger strand as his becoming Haci Bayram's khalifa. The affiliation is attested by two independent families, and intisab is order membership attested for the man himself, so the value stands as documented. The TDV entry states expressly that whether he ever practised sheikhdom is unknown. The rival attachment to Emir Sultan of Bursa belongs to a conflation with a later Seyh Sinan which the TDV entry examines and rejects on documentary grounds. No source read names a legal school for him, and Wikidata gives Islam generically (Q432), which under the founder's ruling never settles faith, so no madhhab is recorded - tariqa is not madhhab."
    sources: [source/tdv-seyhi, source/wikipedia-seyhi-tr]
