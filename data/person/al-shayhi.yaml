  note: "Born at Kutahya, capital of the Germiyan beylik; Kutahya has no place entity, so the birthplace is recorded here only. No early source gives a birth year. Latifi places his birth in the reign of Murad I, and the TDV entry reasons that a man already famous as the eye-physician Hekim Sinan when he treated Sultan Mehmed I's eye in 818/1415 must then have been about forty to forty-five years old, which puts the birth in 773-778/1371-1376; the range is recorded as the scholarship gives it. The century queue's single year 1376 is the range's upper end, and Wikidata's 1350 is supported by no text read. No Hijri year is recorded, as the range spans 773-778 AH rather than a single year."
  sources: [source/tdv-seyhi]
died:
  edtf: "1431"
  hijri: "0834"
  calendar: julian
  precision: year
  status: debated
  derived: false
  note: "He died in all likelihood at Kutahya after returning to the Germiyan court, and his tomb stands at Dumlupinar outside the city; neither place has an entity, so both are recorded here only. No early source fixes the year. Faik Resad's 826/1423 is baseless on the TDV entry's showing, the Sicill-i Osmani gives 829/1426 and the Mecelletu'n-nisab 855/1451, while Koprulu and Uzuncarsili showed from his elegy for Yakub Bey (d. 832/1429) that he died after 1429, which is the TDV entry's own heading. Timurtas's 834/1431, whose Hijri pairing is recorded here, is the date later scholarship accepted, and the Turkish article and Wikidata agree on 1431."
