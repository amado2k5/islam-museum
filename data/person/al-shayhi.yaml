summary:
  ar: "شيخي (يوسف سنان، ت 1431م)، شاعر وطبيب عيون من كوتاهية يُعدّ من مؤسسي الأدب التركي الكلاسيكي. تلقّى تعليمه في كوتاهية وإيران، وخدم أمير الكرميان يعقوب الثاني مصاحباً وطبيباً خاصاً، وعالج عين السلطان محمد الأول سنة 818هـ/1415م فصار أول رئيس أطباء في الدولة العثمانية. قامت شهرته على مثنويين: «خسرو وشيرين»، صياغة تركية حرّة لرومانسية نظامي تركها ناقصة عند وفاته فأتمّها ابن أخته جمالي، و«هارنامه» في 126 بيتاً، الهجائية الكلاسيكية في الحمار الذي حسد الثيران الفارهة. ويروي لطيفي أنه انتسب في طريق عودته من إيران إلى حاجي بيرام ولي بأنقرة، ومن هذا الانتساب اشتقّ العلماء تخلّصه «شيخي»."
  en: "Şeyhi (Yusuf Sinan, d. 1431), divan poet and eye-physician of Kütahya, counted among the founders of classical Turkish literature. Trained at Kütahya and in Iran, he served the Germiyan bey Yakub II as companion and personal physician, treated Sultan Mehmed I's eye in 818/1415 and became the first chief physician of the Ottoman state. His fame rests on two mesnevis: his Hüsrev ü Şirin, a free Turkish reworking of Nizami's romance left unfinished at his death and completed by his nephew Cemali, and the 126-couplet Harname, the classic satire of the worn-out donkey that envied the fat oxen. Latifi reports that on his return from Iran he bound himself to Haci Bayram Veli at Ankara, the affiliation from which scholarship derives his pen name Şeyhi."
  ur: "شیخی (یوسف سنان، وفات 1431ء)، کوتاہیہ کے دیوان شاعر اور چشم پزشک، کلاسیکی ترکی ادب کے بانیوں میں شمار ہوتے ہیں۔ کوتاہیہ اور ایران میں تعلیم پائی، گرمیان کے امیر یعقوب ثانی کے مصاحب اور ذاتی طبیب رہے، 818ھ/1415ء میں سلطان محمد اول کی آنکھ کا علاج کیا اور عثمانی ریاست کے پہلے رئیس الاطباء بنے۔ ان کی شہرت دو مثنویوں پر قائم ہے: «خسرو و شیریں»، نظامی کی رومانوی نظم کی آزاد ترک صیاغت جو ان کی وفات پر نامکمل رہ گئی اور ان کے بھانجے جمالی نے پوری کی، اور 126 اشعار کی «ہارنامہ»، اس تھکے ماندے گدھے کی کلاسیکی ہجویہ نظم جس نے موٹے بیلوں پر رشک کیا۔ لطیفی کی روایت ہے کہ ایران سے واپسی پر انھوں نے انقرہ میں حاجی بیرام ولی سے انتساب کیا، اور اہلِ علم کے نزدیک ان کا تخلص «شیخی» اسی انتساب سے ماخوذ ہے۔"
