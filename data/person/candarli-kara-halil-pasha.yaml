summary:
  ar: "بطاقة أولية لقرة خليل حير الدين باشا الجاندرلي، أول من لُقّب بالصدر الأعظم في الدولة العثمانية في عهد مراد الأول، توفي سنة ١٣٨٧م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Candarli Kara Halil Hayreddin Pasha, remembered as the first grand vizier of the Ottoman state under Murad I, d. 1387; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Candarli Kara Halil Hayreddin Pasha, recordado como el primer gran visir del estado otomano bajo Murad I, fallecido en 1387; la entrada de la fuente aún no se ha verificado en la página."
  fr: "Fiche de convocation de Candarli Kara Halil Hayreddin Pacha, connu comme le premier grand vizir de l'État ottoman sous Murad Ier, mort en 1387; la source n'est pas encore vérifiée sur la page."
  ur: "کارڈلی کارا حلیل حیر الدین پاشا کے لیے ڈرافٹ کارڈ، جسے مراد اول کے تحت عثمانی ریاست کے پہلے عظیم الشان وزیر کے طور پر یاد کیا جاتا ہے۔ 1387; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Halil Hayr al-Din Paşa el-Ganderli'nin kitabı için ön kart, Osmanlı İmparatorluğu'nda Sadrazam unvanını alan ilk kişi olan Murad I döneminde 1387 yılında vefat etti; Osmanlı tarih kitaplarında anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk buku Khalil Hayr al-Din Pasha al-Ganderli, yang pertama berjudul Grand Vizier di Kekaisaran Ottoman pada masa pemerintahan Murad I, meninggal pada tahun 1387 M; ia dikenang dalam buku sejarah Ottoman, dan biografinya belum pernah diulas di halaman."
