  fr: "Le commandant kalbite d'Abd al-Malik, envoyé avec les armées syriennes pour secourir al-Hajjaj de Shabib, l'a mis en déroute, a tué Ghazala et Umm Shabib, et l'a poursuivi jusqu'à Ahwaz {cite:muruj-al-dhahab p. 130}."
