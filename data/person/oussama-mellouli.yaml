summary:
  ar: "سبّاح تونسي، وُلد في المرسى سنة 1984. فاز بذهبية 1500 متر حرة في أولمبياد بكين 2008، وبذهبية ماراثون 10 كيلومترات وبرونزية 1500 متر في لندن 2012، فكان أول سبّاح يفوز بميداليات في المياه المفتوحة والمسبح في دورة أولمبية واحدة، وشارك في ست دورات أولمبية بين 2000 و2020."
  en: "Tunisian swimmer, born in La Marsa in 1984. He won the 1500 m freestyle at the Beijing 2008 Olympics, then the 10 km marathon gold and the 1500 m freestyle bronze at London 2012 — the first swimmer to medal in both open water and the pool at a single Olympics — and competed at six Olympic Games between 2000 and 2020."
  ur: "تیونس کے تیراک، 1984 میں لا مرسا میں پیدا ہوئے۔ انہوں نے بیجنگ 2008 اولمپکس میں 1500 میٹر فری اسٹائل جیتا، پھر لندن 2012 میں 10 کلومیٹر میراتھن کا سونا اور 1500 میٹر فری اسٹائل کا کانسی کا تمغہ جیتا — ایک ہی اولمپکس میں کھلے پانی اور پول دونوں میں تمغہ جیتنے والے پہلے تیراک — اور 2000 سے 2020 تک چھ اولمپک کھیلوں میں حصہ لیا۔"
  es: "Nadador tunecino, nacido en La Marsa en 1984. Ganó los 1500 metros estilo libre en los Juegos Olímpicos de Pekín 2008, y posteriormente la medalla de oro en la maratón de 10 km y la de bronce en los 1500 metros estilo libre en Londres 2012 —convirtiéndose en el primer nadador en conseguir medallas tanto en aguas abiertas como en piscina en unos mismos Juegos Olímpicos— y compitió en seis Juegos Olímpicos entre 2000 y 2020."
  fr: "Nageur tunisien, né à La Marsa en 1984. Il a remporté le 1500 m nage libre aux Jeux olympiques de Pékin en 2008, puis l'or du marathon de 10 km et le bronze du 1500 m nage libre à Londres en 2012 — le premier nageur à remporter une médaille à la fois en eau libre et en piscine lors d'une même édition des Jeux olympiques — et a participé à six Jeux olympiques entre 2000 et 2020."
  tr: "1984 yılında Marsa'da doğmuş Tunuslu bir yüzücü. 2008 Pekin Olimpiyatları'nda 1500 metre serbestte altın, 10 kilometre maratonunda altın ve 2012 Londra'da 1500 metrede bronz madalya kazandı. Açık su ve yüzmede tek bir Olimpiyat Oyunları'nda madalya kazanan ilk yüzücü oldu ve 2000 ile 2020 yılları arasında altı Olimpiyat Oyunları'na katıldı."
  id: "Seorang perenang Tunisia, lahir di Marsa pada tahun 1984. Ia meraih emas di nomor 1500 meter gaya bebas di Olimpiade Beijing 2008, emas di maraton 10 kilometer, dan perunggu di nomor 1500 meter di London 2012. Ia menjadi perenang pertama yang memenangkan medali di perairan terbuka dan renang dalam satu Olimpiade, serta berpartisipasi dalam enam Olimpiade antara tahun 2000 dan 2020."
