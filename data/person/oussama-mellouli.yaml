summary:
  ar: "سبّاح تونسي، وُلد في المرسى سنة 1984. فاز بذهبية 1500 متر حرة في أولمبياد بكين 2008، وبذهبية ماراثون 10 كيلومترات وبرونزية 1500 متر في لندن 2012، فكان أول سبّاح يفوز بميداليات في المياه المفتوحة والمسبح في دورة أولمبية واحدة، وشارك في ست دورات أولمبية بين 2000 و2020."
  en: "Tunisian swimmer, born in La Marsa in 1984. He won the 1500 m freestyle at the Beijing 2008 Olympics, then the 10 km marathon gold and the 1500 m freestyle bronze at London 2012 — the first swimmer to medal in both open water and the pool at a single Olympics — and competed at six Olympic Games between 2000 and 2020."
  ur: "تیونس کے تیراک، 1984 میں لا مرسا میں پیدا ہوئے۔ انہوں نے بیجنگ 2008 اولمپکس میں 1500 میٹر فری اسٹائل جیتا، پھر لندن 2012 میں 10 کلومیٹر میراتھن کا سونا اور 1500 میٹر فری اسٹائل کا کانسی کا تمغہ جیتا — ایک ہی اولمپکس میں کھلے پانی اور پول دونوں میں تمغہ جیتنے والے پہلے تیراک — اور 2000 سے 2020 تک چھ اولمپک کھیلوں میں حصہ لیا۔"
