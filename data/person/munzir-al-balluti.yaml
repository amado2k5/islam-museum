summary:
  ar: "قاضي الجماعة بقرطبة في دولة الناصر؛ كان الناصر كلفاً بالعمارة حتى ابتنى مدينة الزهراء وعطل شهود الجمعة بالمسجد الجامع ثلاث جمع، فافتتح منذر خطبته بقوله تعالى أتبنون بكل ريع آية تعبثون ومضى في ذم تشييد البنيان حتى بكى الحاضرون وبكى خليفتهم، فوجد الناصر على منذر وأقسم ألا يصلي خلفه الجمعة، فلما سأله الحكم ما يمنعك من عزله انتهره وقال أمثل منذر بن سعيد في فضله وعلمه يعزل لإرضاء نفس ناكبة عن الرشد، وإني لأستحي من الله أن لا أجعل بيني وبينه في صلاة الجمعة شفيعاً مثل منذر في ورعه وصدقه ولكنه أحرجني فأقسمت {cite:nafh-tib-maqqari p. 606-607}."
  en: "Qadi al-jama'a of Cordoba under al-Nasir; when the caliph's mania for building al-Zahra' kept him from three consecutive Fridays at the mosque, Mundhir opened his sermon with 'Do ye build a sign on every height?' until the caliph wept — then, refusing to dismiss him, swore he would be ashamed before God to lose so pious an intercessor at Friday prayer {cite:nafh-tib-maqqari p. 606-607}."
  es: "Qadi al-jama'a de Córdoba bajo al-Nasir; cuando la manía del califa por construir al-Zahra' le impidió asistir a la mezquita durante tres viernes consecutivos, Mundhir comenzó su sermón con \"¿Construís un letrero en cada altura?\" hasta que el califa lloró; entonces, negándose a despedirlo, juró que se avergonzaría ante Dios de perder a un intercesor tan piadoso en la oración del viernes {cite:nafh-tib-maqqari p. 606-607}."
  fr: "Le cadi al-jama'a de Cordoue sous al-Nasir; lorsque la manie du calife pour la construction d'al-Zahra' l'empêcha de se rendre à la mosquée pendant trois vendredis consécutifs, Mundhir commença son sermon par « Construisez-vous un signe sur chaque hauteur ? » jusqu'à ce que le calife pleure — puis, refusant de le renvoyer, jura qu'il aurait honte devant Dieu de perdre un intercesseur aussi pieux à la prière du vendredi {cite:nafh-tib-maqqari p. 606-607}."
  ur: "قادی الجماعۃ قرطبہ الناصر کے تحت؛ جب خلیفہ کی الزہرا کی تعمیر کے جنون نے انہیں مسجد میں لگاتار تین جمعہ تک روکے رکھا تو منڈھیر نے اپنے خطبہ کا آغاز اس کے ساتھ کیا کہ کیا تم ہر بلندی پر نشان بناتے ہو؟ یہاں تک کہ خلیفہ روئے - پھر، اس کو برطرف کرنے سے انکار کرتے ہوئے، قسم کھائی کہ وہ جمعہ کی نماز میں اتنے متقی شفاعت کرنے والے کو کھوتے ہوئے خدا کے سامنے شرمندہ ہوں گے۔ 606-607}۔"
  tr: "El-Nasir'in saltanatı sırasında Kordoba'daki cemaatin hakimi olan El-Nasir, Zahra şehrini inşa edene kadar inşaat görevi verildi ve Cuma namazı şahitlerini üç Cuma boyunca askıya aldı. Mundhir vaazına, \"Tüm yağmurla bir ayet mi inşa ediyorsun ki tüm parayla oynadın?\" diyerek başladı. Orada bulunanlar ağlayana ve halefleri ağlayana kadar inşaatı eleştirmeye devam etti. El-Nasir kendini Mundhir'de buldu ve arkasında cuma namazını kılmayacağına yemin etti. Hakim ona görevden alınmasını engelleyen şeyi sorduğunda, azarladı ve şöyle dedi: Mundhir bin Saeed'in erdemi ve bilgisi, aklı yüzünden eksik bir ruhu memnun etmek için kaldırılsın. Allah'ın huzurunda, Cuma namazında aramızda Mundhir gibi bir aracı yapmadığım için utanıyorum, ama beni utandırdı ve yemin ettim. nafh-tib-maqqari s. 606-607}."
  id: "Hakim komunitas di Cordoba pada masa pemerintahan Al-Nasir; Al-Nasir ditugaskan membangun hingga ia membangun kota Zahra dan menangguhkan salat Jumat di Masjid Agung selama tiga Jumat. Mundhir membuka khotbahnya dengan berkata, \"Apakah kau membangun bait dengan hujan yang kau mainkan dengan semua uang?\" Ia terus mengkritik pembangunan hingga mereka menangis dan penerusnya menangis. Al-Nasir mendapati dirinya di Mundhir dan bersumpah tidak akan berdoa Jumat di belakangnya. Ketika hakim bertanya apa yang mencegahnya dipecat, ia menegur dan berkata: Saya ingin Mundhir ibn Saeed dalam kebajikan dan pengetahuannya dipindahkan untuk menyenangkan jiwa yang telah kehilangan kewarasan. Saya malu di hadapan Tuhan karena tidak membuat antara saya dan Dia dalam shalat Jumat menjadi perantara seperti Mundhir dalam kesalehan dan kejujurannya, tetapi dia mempermalukan saya, jadi saya bersumpah {cite:nafh-tib-maqqari hlm. 606-607}."
