summary:
  ar: "قاضي الجماعة بقرطبة في دولة الناصر؛ كان الناصر كلفاً بالعمارة حتى ابتنى مدينة الزهراء وعطل شهود الجمعة بالمسجد الجامع ثلاث جمع، فافتتح منذر خطبته بقوله تعالى أتبنون بكل ريع آية تعبثون ومضى في ذم تشييد البنيان حتى بكى الحاضرون وبكى خليفتهم، فوجد الناصر على منذر وأقسم ألا يصلي خلفه الجمعة، فلما سأله الحكم ما يمنعك من عزله انتهره وقال أمثل منذر بن سعيد في فضله وعلمه يعزل لإرضاء نفس ناكبة عن الرشد، وإني لأستحي من الله أن لا أجعل بيني وبينه في صلاة الجمعة شفيعاً مثل منذر في ورعه وصدقه ولكنه أحرجني فأقسمت {cite:nafh-tib-maqqari p. 606-607}."
  en: "Qadi al-jama'a of Cordoba under al-Nasir; when the caliph's mania for building al-Zahra' kept him from three consecutive Fridays at the mosque, Mundhir opened his sermon with 'Do ye build a sign on every height?' until the caliph wept — then, refusing to dismiss him, swore he would be ashamed before God to lose so pious an intercessor at Friday prayer {cite:nafh-tib-maqqari p. 606-607}."
