  ur: "مصر کے عبد السلام بن ابراہیم اللاقانی، قاہرہ میں اپنے زمانے میں مالکیوں کے شیخ اور تفسیروں کے مصنف؛ ان کی وفات خلصۃ اطہر کے مطابق 1078ھ میں ہوئی۔"
  tr: "Kahire'de döneminin önde gelen Maliki alimi ve tefsir yazarı Abdül-Selam ibn İbrahim el-Lakkani el-Mısır, Hulasat el-Athar'a göre 1078 Hicri yılında vefat etmiştir."
