  ar: "عبد السلام بن إبراهيم اللقاني المصري، شيخ المالكية في وقته بالقاهرة وصاحب شروح، توفي سنة ١٠٧٨هـ بحسب خلاصة الأثر."
  en: "Abd al-Salam ibn Ibrahim al-Laqani of Egypt, the shaykh of the Malikis in his time at Cairo and an author of commentaries; he died in 1078 AH according to Khulasat al-Athar."
