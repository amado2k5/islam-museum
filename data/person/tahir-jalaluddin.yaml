summary:
  ar: "عالم من مينانغكابو (1869–1956) اشتهر بعلم الفلك الشرعي في عالم الملايو، تتلمذ في مكة على ابن عمّه أحمد الخطيب المنكباوي ثم درس في الأزهر، واستقر في ملايا فأسّس مع سيد شيخ الهادي مجلة «الإمام» الإصلاحية في سنغافورة (1906–1908)، وخدم فيرق وجوهر معلّمًا ومسؤولًا دينيًا، وألّف كتبًا مرجعية في التقويم الهجري ومواقيت الصلاة واتجاه القبلة."
  en: "Minangkabau-born scholar of Islamic astronomy (1869–1956) who studied in Mecca under his cousin Ahmad Khatib al-Minangkabawi and then at al-Azhar, settled in Malaya, co-founded the reformist journal Al-Imam in Singapore with Syed Sheikh al-Hadi (1906–1908), served Perak and Johor as a religious official and teacher, and wrote standard Malay works on the Hijri calendar, prayer times and the qibla direction."
  ur: "مینانگکاباؤ نژاد عالم (1869ء–1956ء) جو اسلامی فلکیات کے لیے مشہور ہوئے، مکہ میں اپنے چچا زاد بھائی احمد خطیب المنانگکباوی سے پڑھا، پھر الازہر میں تعلیم حاصل کی، ملایا میں آباد ہوئے، سید شیخ الہادی کے ساتھ سنگاپور میں اصلاحی مجلہ «الامام» (1906ء–1908ء) جاری کیا، پیراک اور جوہر میں دینی عہدوں اور تدریس کی خدمت کی اور ہجری تقویم، نماز کے اوقات اور قبلہ کی سمت پر معیاری کتابیں لکھیں۔"
