    note: "No source names his own school. The Malay and Indonesian articles present him as a leading figure of the Kaum Muda reform movement, formed at al-Azhar by the thought of al-Afghani and Muhammad Abduh, and the Indonesian article stresses his advocacy of hisab (astronomical calculation) for the start of Ramadan against the rukyat tradition: a movement and a scholarly position, not a madhhab. The Indonesian article's category filings place him under the Shafi'i school, but category filings are not attestations, and his qibla treatise compiles the texts of Shafi'i scholars without stating his personal affiliation. His teacher and cousin Ahmad Khatib was imam of the Shafi'i school at the Meccan sanctuary, but a teacher's school is not the student's. Wikidata gives Islam in general only. Recorded unknown; the movement-without-school configuration is flagged for the founder."
