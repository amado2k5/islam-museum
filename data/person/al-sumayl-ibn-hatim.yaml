label: { ar: "الصميل بن حاتم الكلابي", en: "al-Sumayl ibn Hatim al-Kilabi", fr: "al-Sumayl ibn Hatim al-Kilabi", es: "al-Sumayl ibn Hatim al-Kilabi", ur: "سمیل بن حاتم الکلبی" }
gender: male
summary:
  ar: "كبير القيسية بالأندلس وأميرها يومئذ وزعيمها وهو من طوالع بلج؛ ألب على أبي الخطار حسام بن ضرار فخلع سنة ثمان وعشرين ومائة، وقام بأمر ثوابة بن سلامة فاجتمع عليه الفريقان، ومالأ يوسف الفهري على بيتة اليمانية بشقندة، ثم قاتل أبا الخطار حين ثار وهزمه وقتله سنة تسع وعشرين {cite:nafh-tib-maqqari p. 273-274}."
  en: "Chief of the Qaysi party in al-Andalus, one of Balj's elite; he drove Abu'l-Khattar's deposition, backed Thawaba's amirate, joined Yusuf al-Fihri's night massacre of the Yamani leaders at Shaqunda, then defeated and killed Abu'l-Khattar in 129 {cite:nafh-tib-maqqari p. 273-274}."
  fr: "Chef du parti Qaysi à al-Andalus, l'un des leaders de Balj  ; il a conduit la déposition d'Abu'l-Khattar, soutenu l'amirat de Thawaba, rejoint le massacre nocturne de Yusuf al-Fihri des dirigeants Yamani à Shaqunda, puis vaincu et tué Abu'l-Khattar en 129 {cite:nafh-tib-maqqari p. 273-274}."
  es: "Jefe del partido Qaysi en al-Andalus, uno de los miembros de la élite de Balj; impulsó la deposición de Abu'l-Khattar, apoyó el emirato de Thawaba, se unió a la masacre nocturna de Yusuf al-Fihri contra los líderes Yamani en Shaqunda, y luego derrotó y mató a Abu'l-Khattar en 129 {cite:nafh-tib-maqqari p. 273-274}."
  ur: "الاندلس میں قصی پارٹی کے سربراہ، بلج کی اشرافیہ میں سے ایک؛ اس نے ابو الخطر کی معزولی کو ختم کیا، ثوبہ کی امارت کی حمایت کی، یوسف الفہری کی شب یمنی لیڈروں کے شکوندہ کے قتل عام میں شامل ہوا، پھر 129 میں ابو الخطر کو شکست دی اور قتل کر دیا۔ 273-274}۔"
  tr: "O dönemde el-Endülüs'teki el-Kaysiyya'nın reisi ve lideri olan Yusuf, Balaj'ın Tula'i kabilelerinden biriydi; Ebu el-Hattar Hüssam bin Dirar'a karşı isyan etti ve 128 Hicri yılında tahttan indirildi. Thawabah ibn Salama'nın komutasını devraldı ve iki grup ona karşı birleşti. Yusuf el-Fihri ile Şaqanda'daki Yemen hanedanı için ittifak kurdu, ardından 29 Hicri yılında Ebu el-Hattar isyan ettiğinde onu yenerek öldürdü {atıf:nafh-tib-maqqari, s. 273-274}."
  id: "Kepala al-Qaysiyya di al-Andalus dan pemimpinnya pada masa itu, dan ia adalah salah satu suku Tula'i Balaj; ia memberontak melawan Abu al-Khattar Hussam ibn Dirar dan digulingkan pada tahun 128 H. Ia mengambil alih komando Thawabah ibn Salama, dan kedua faksi bersatu melawannya. Ia bersekutu dengan Yusuf al-Fihri atas rumahnya di Yaman di Shaqanda, lalu melawan Abu al-Khattar ketika ia memberontak, mengalahkannya, dan membunuhnya pada tahun 29 H {cite:nafh-tib-maqqari, hlm. 273-274}."
