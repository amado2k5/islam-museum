  ar: "كبير القيسية بالأندلس وأميرها يومئذ وزعيمها وهو من طوالع بلج؛ ألب على أبي الخطار حسام بن ضرار فخلع سنة ثمان وعشرين ومائة، وقام بأمر ثوابة بن سلامة فاجتمع عليه الفريقان، ومالأ يوسف الفهري على بيتة اليمانية بشقندة، ثم قاتل أبا الخطار حين ثار وهزمه وقتله سنة تسع وعشرين {cite:nafh-tib-maqqari p. 273-274}."
