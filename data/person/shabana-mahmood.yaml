summary:
  ar: "سياسية ومحامية بريطانية من حزب العمال، وُلدت في برمنغهام سنة 1980 لأبوين من أصل باكستاني، وعاشت طفولتها سنوات في الطائف. درست القانون في كلية لينكولن بأوكسفورد وتخصصت محامية في التعويضات المهنية، وانتُخبت سنة 2010 نائبة عن برمنغهام ليديوود ضمن أوائل النائبات المسلمات في بريطانيا، ثم وزيرة للعدل والسيد المستشار (2024-2025) فكانت أول مسلم يشغل منصب السيد المستشار، ثم وزيرة للداخلية منذ سبتمبر 2025."
  en: "British Labour Party politician and barrister, born in Birmingham in 1980 to parents of Pakistani origin, who spent part of her childhood in Taif. She read law at Lincoln College, Oxford, practised as a barrister specialising in professional indemnity, was elected MP for Birmingham Ladywood in 2010 as one of the UK's first female Muslim MPs, served as Secretary of State for Justice and Lord Chancellor (2024–2025) — the first Muslim to hold the lord chancellorship — and has been Home Secretary since September 2025."
  ur: "برطانوی لیبر پارٹی کی سیاست دان اور بیرسٹر، جو 1980 میں برمنگھم میں پاکستانی نژاد والدین کے ہاں پیدا ہوئیں اور بچپن کا کچھ حصہ طائف میں گزارا۔ انھوں نے لنکن کالج، آکسفورڈ سے قانون پڑھا اور پیشہ ورانہ معاوضے کے شعبے میں بیرسٹر رہیں، 2010 میں برمنگھم لیڈی وڈ سے رکنِ پارلیمان منتخب ہو کر برطانیہ کی پہلی مسلم خواتین ارکان میں شامل ہوئیں، پھر وزیرِ انصاف اور لارڈ چانسلر (2024ء–2025ء) بنیں — اس عہدے پر فائز ہونے والی پہلی مسلمان — اور ستمبر 2025 سے وزیرِ داخلہ ہیں۔"
