summary:
  ar: "عالم جيولوجيا وفضاء مصري أمريكي، وُلد في الزقازيق سنة 1938، عمل مع ناسا في التخطيط العلمي لاستكشاف القمر ضمن برنامج أبولو (1967–1972)، فاختار مواقع الهبوط ودرّب رواد الفضاء، ثم أسس وأدار مركز الاستشعار عن بعد في جامعة بوسطن واشتهر بأبحاث الصحارى والمياه الجوفية من صور الأقمار الصناعية."
  en: "Egyptian-American geologist and space scientist, born in Zagazig in 1938, who worked with NASA on the scientific exploration of the Moon in the Apollo programme (1967–1972), selecting landing sites and training astronauts, then founded and directed Boston University's Center for Remote Sensing and became known for desert and groundwater research from satellite images."
  ur: "مصری نژاد امریکی ماہرِ ارضیات اور خلائی سائنس دان، جو 1938 میں زقازیق میں پیدا ہوئے، جنہوں نے اپولو پروگرام میں چاند کی سائنسی تحقیق کی منصوبہ بندی میں ناسا کے ساتھ کام کیا (1967–1972)، نزول کی جگہیں منتخب کیں اور خلابازوں کو تربیت دی، پھر بوسٹن یونیورسٹی کے مرکزِ استشعارِ بعید کی بنیاد رکھی اور اس کے ڈائریکٹر رہے۔"
