summary:
  ar: "من علماء المعتزلة وحذاقها وزهادها، وأخوه حنش بن المبشر من علماء أصحاب الحديث ورؤساء الحشوية بالضد منه، وطالت بينهما المناظرة والمباغضة وآلى كل منهما ألا يخاطب الآخر حتى الممات {cite:muruj-al-dhahab p. 183}."
  en: "A Mu'tazilite scholar-ascetic whose brother Hanash led the hadith-folk against him — they swore mutual silence to the grave {cite:muruj-al-dhahab p. 183}."
  es: "Un erudito-asceta mu'tazilita cuyo hermano Hanash lideró a los seguidores del hadiz en su contra; juraron silencio mutuo hasta la tumba {cite:muruj-al-dhahab p. 183}."
  fr: "Un érudit-ascète mu'tazilite dont le frère Hanash a mené les adeptes du hadith contre lui — ils ont juré un silence mutuel jusqu'à la tombe {cite:muruj-al-dhahab p. 183}."
  ur: "ایک معتزلی عالم دین جس کے بھائی حناش نے اس کے خلاف احادیث کی رہنمائی کی - انہوں نے قبر پر باہمی خاموشی کی قسم کھائی۔ 183}۔"
  tr: "Mu'tazila'nın alimleri arasında, onların yetenekli ve münzevi kişileri ile hadis âlimlerinden ve Haşviyye'nin başlarından olan kardeşi Haneş bin el-Mübeşir ona karşıydı. Aralarında sık sık tartışma ve nefret yaşandı ve her biri diğerine ölümüne kadar hitap etmemeye karar verdi {atıf:muruj-al-dhahab, s. 183}."
  id: "Di antara para ulama Mu'tazila, para ahli dan pertapa mereka, serta saudaranya Hanash ibn al-Mubashir, salah satu ulama hadits dan kepala Hashwiyya, menentangnya. Perdebatan dan kebencian sering terjadi di antara mereka, dan masing-masing memutuskan untuk tidak saling berbicara sampai kematian {cite:muruj-al-dhahab, hlm. 183}."
