summary:
  ar: "ابن هشام بن عبد الملك، حكى مؤانسه العلاء بن بنت ذي الكلاع أنه رأى في آخر أيام يزيد الناقص وهما يشربان حذاء رصافة أبيه كأنه في مسجد دمشق ورجل بيده خنجر وعليه تاج ينشد أبني أمية قد دنا تشتيتكم وذهاب ملككم وألا يرجع، فقال يا حميري بعيد ما يأتي به الزمان قريب، فما اجتمعا على شراب بعد ذلك وكانت سنة اثنتين وثلاثين ومائة من أمر المسودة ما كان {cite:muruj-al-dhahab p. 212-213}. واتصل بالخوارج بالجزيرة خوفاً من مروان {cite:muruj-al-dhahab p. 229}"
  en: "Hisham's son — in his drinking-companion's tale he dreamt the crowned khanjar-man in Damascus mosque chanting 'sons of Umayya, your scattering and kingdom's end is near', and never drank again before the Black Banners' year {cite:muruj-al-dhahab p. 212-213}."
  es: "El hijo de Hisham —en el relato de su compañero de bebida, soñó con el khanjar coronado en la mezquita de Damasco cantando \"hijos de Omayya, vuestra dispersión y el fin de vuestro reino está cerca\", y nunca volvió a beber hasta el año de las Banderas Negras {cite:muruj-al-dhahab p. 212-213}."
  fr: "Le fils d'Hisham — dans le récit de son compagnon de beuverie, il rêva du khanjar couronné dans la mosquée de Damas chantant « fils d'Omayya, votre dispersion et la fin du royaume sont proches », et ne but plus jamais avant l'année des Bannières Noires {cite:muruj-al-dhahab p. 212-213}."
  ur: "ہشام کے بیٹے - اپنے شراب نوشی کے ساتھی کی کہانی میں اس نے دمشق کی مسجد میں تاج پوش خنجر آدمی کو خواب میں دیکھا کہ 'بنو امیہ، تمہاری بکھرنے اور بادشاہی کا خاتمہ قریب ہے'، اور سیاہ بینرز کے سال سے پہلے دوبارہ کبھی نہیں پیا۔ 212-213}۔"
