summary:
  ar: "ابن هشام بن عبد الملك، حكى مؤانسه العلاء بن بنت ذي الكلاع أنه رأى في آخر أيام يزيد الناقص وهما يشربان حذاء رصافة أبيه كأنه في مسجد دمشق ورجل بيده خنجر وعليه تاج ينشد أبني أمية قد دنا تشتيتكم وذهاب ملككم وألا يرجع، فقال يا حميري بعيد ما يأتي به الزمان قريب، فما اجتمعا على شراب بعد ذلك وكانت سنة اثنتين وثلاثين ومائة من أمر المسودة ما كان {cite:muruj-al-dhahab p. 212-213}. واتصل بالخوارج بالجزيرة خوفاً من مروان {cite:muruj-al-dhahab p. 229}"
  en: "Hisham's son — in his drinking-companion's tale he dreamt the crowned khanjar-man in Damascus mosque chanting 'sons of Umayya, your scattering and kingdom's end is near', and never drank again before the Black Banners' year {cite:muruj-al-dhahab p. 212-213}."
