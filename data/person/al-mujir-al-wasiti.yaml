summary:
  ar: "المجير الإمام أبو القاسم محمود بن المبارك الواسطي ثم البغدادي الفقيه الشافعي، أحد الأذكياء والمناظرين؛ ولد سنة سبع عشرة وخمسمائة وتفقه بالنظامية على أبي منصور ابن الرزاز وغيره، وأخذ علم الكلام عن أبي الفتوح محمد بن الفضل الإسفراييني، وصار المشار إليه في زمانه والمقدم على أقرانه، ودرس بالنظامية وكان ذكياً طوالاً غواصاً على المعالي، وقدم دمشق وبنيت له مدرسة جاروخ ثم توجه إلى شيراز وبنى له ملكها مدرسة، ثم أحضره ابن القصاب وقدمه؛ قال ابن الدبيثي ما رأينا أجمع لفنون العلم منه مع حسن العبارة؛ وخرج رسولاً إلى خوارزم شاه إلى أصبهان فمات بهمدان في ذي القعدة سنة اثنتين وتسعين وخمسمائة {cite:shadharat-dhahab p. 791}."
  en: "Al-Mujir the imam Abu al-Qasim Mahmud b. al-Mubarak, of Wasit then Baghdad, the Shafi'i jurist — one of the sharp debaters; b. 517, trained at the Nizamiyya under Ibn al-Razzaz, took kalam from al-Isfarayini, and became the noted man of his time ahead of his peers; he taught at the Nizamiyya, brilliant, persistent, diving for the heights; at Damascus the Jarukh madrasa was built for him, at Shiraz its king built him another, then Ibn al-Qassab brought him forward — Ibn al-Dubaythi: 'we never saw one who joined more sciences with finer expression'; sent as envoy to Khwarazmshah, he died at Hamadan in Dhu al-Qa'da 592 {cite:shadharat-dhahab p. 791}."
