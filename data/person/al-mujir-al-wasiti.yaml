summary:
  ar: "المجير الإمام أبو القاسم محمود بن المبارك الواسطي ثم البغدادي الفقيه الشافعي، أحد الأذكياء والمناظرين؛ ولد سنة سبع عشرة وخمسمائة وتفقه بالنظامية على أبي منصور ابن الرزاز وغيره، وأخذ علم الكلام عن أبي الفتوح محمد بن الفضل الإسفراييني، وصار المشار إليه في زمانه والمقدم على أقرانه، ودرس بالنظامية وكان ذكياً طوالاً غواصاً على المعالي، وقدم دمشق وبنيت له مدرسة جاروخ ثم توجه إلى شيراز وبنى له ملكها مدرسة، ثم أحضره ابن القصاب وقدمه؛ قال ابن الدبيثي ما رأينا أجمع لفنون العلم منه مع حسن العبارة؛ وخرج رسولاً إلى خوارزم شاه إلى أصبهان فمات بهمدان في ذي القعدة سنة اثنتين وتسعين وخمسمائة {cite:shadharat-dhahab p. 791}."
  en: "Al-Mujir the imam Abu al-Qasim Mahmud b. al-Mubarak, of Wasit then Baghdad, the Shafi'i jurist — one of the sharp debaters; b. 517, trained at the Nizamiyya under Ibn al-Razzaz, took kalam from al-Isfarayini, and became the noted man of his time ahead of his peers; he taught at the Nizamiyya, brilliant, persistent, diving for the heights; at Damascus the Jarukh madrasa was built for him, at Shiraz its king built him another, then Ibn al-Qassab brought him forward — Ibn al-Dubaythi: 'we never saw one who joined more sciences with finer expression'; sent as envoy to Khwarazmshah, he died at Hamadan in Dhu al-Qa'da 592 {cite:shadharat-dhahab p. 791}."
  fr: "Al-Mujir l'imam Abu al-Qasim Mahmud b. al-Moubarak, de Wasit puis Bagdad, le juriste chaféite - l'un des débatteurs pointus ; b. 517, formé à la Nizamiyya sous Ibn al-Razzaz, prit kalam d'al-Isfarayini, et devint l'homme célèbre de son temps en avance sur ses pairs ; il enseignait à la Nizamiyya, brillant, persévérant, plongeant pour les hauteurs ; à Damas la madrasa Jarukh a été construite pour lui, à Chiraz son roi lui en a construit un autre, puis Ibn al-Qassab l'a fait avancer - Ibn al-Dubaythi : « nous n'avons jamais vu quelqu'un qui joignait plus de sciences avec une expression plus fine » ; envoyé comme envoyé à Khwarazmshah, il est mort à Hamadan dans dhou al-qi‘da 592 {cite:shadharat-dhahab p. 791}."
  es: "Al-Mujir el imán Abu al-Qasim Mahmud b. al-Mubarak, de Wasit y luego de Bagdad, el jurista shafi'í, uno de los más agudos debatientes; n. 517, se formó en la Nizamiyya con Ibn al-Razzaz, tomó kalam de al-Isfarayini y se convirtió en el hombre más destacado de su tiempo, por delante de sus compañeros; enseñó en la Nizamiyya, brillante, persistente, buscando siempre las alturas; en Damasco se construyó para él la madrasa Jarukh, en Shiraz su rey le construyó otra, luego Ibn al-Qassab lo impulsó — Ibn al-Dubaythi: 'nunca vimos a nadie que uniera más ciencias con una expresión más fina'; enviado como enviado a Khwarazmshah, murió en Hamadán en Dhu al-Qa'da 592 {cite:shadharat-dhahab p. 791}."
  ur: "المجیر امام ابو القاسم محمود ب۔ المبارک، واسط پھر بغداد کا، شافعی فقیہ - ایک تیز بحث کرنے والوں میں سے ایک؛ ب 517، ابن الرزاز کے ماتحت نظامیہ میں تربیت یافتہ، اسفارائنی سے کلام لیا، اور اپنے ساتھیوں سے آگے اپنے وقت کے مشہور آدمی بن گئے۔ اس نے نظامیہ میں پڑھایا، شاندار، مستقل مزاج، بلندیوں کے لیے غوطہ خوری؛ دمشق میں جاروخ مدرسہ اس کے لیے بنایا گیا، شیراز میں اس کے بادشاہ نے اسے ایک اور تعمیر کیا، پھر ابن القصاب اسے آگے لے آئے - ابن الدبیثی: 'ہم نے کبھی ایسا نہیں دیکھا جس نے زیادہ علوم میں عمدہ اظہار کے ساتھ شمولیت اختیار کی'؛ خوارزمشاہ میں ایلچی بنا کر بھیجا گیا، ذوالقعدہ 592 میں حمدان میں وفات پائی۔ 791}۔"
