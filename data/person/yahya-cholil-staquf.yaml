summary:
  ar: "عالم إندونيسي، وُلد في رمبانغ بجاوة الوسطى سنة 1966، من أسرة علماء في نهضة العلماء ⁦(نهضة العلماء إندونيسيا)⁩. كان المتحدث باسم الرئيس عبد الرحمن واحد، ثم عضوًا في المجلس الاستشاري الرئاسي، وانتُخب رئيسًا عامًا للمجلس التنفيذي لنهضة العلماء في ديسمبر 2021؛ يدعو إلى ما يسميه «الإسلام الإنساني»."
  en: "Indonesian scholar, born in Rembang, Central Java, in 1966, from a family of Nahdlatul Ulama ulama. He served as spokesman for President Abdurrahman Wahid and later on the Presidential Advisory Council, and was elected general chairman of the NU executive board in December 2021; he promotes what he calls Humanitarian Islam."
  ur: "انڈونیشیائی عالم، 1966 میں وسطی جاوا کے ریمبانگ میں نحضۃ العلماء کے علماء کے گھرانے میں پیدا ہوئے۔ وہ صدر عبدالرحمٰن وحید کے ترجمان رہے اور پھر صدارتی مشاورتی کونسل کے رکن، اور دسمبر 2021 میں این یو کے ایگزیکٹو بورڈ کے سربراہ منتخب ہوئے؛ وہ اپنے متعارف کردہ «انسانیت پسند اسلام» کی تبلیغ کرتے ہیں۔"
  es: "Erudito indonesio, nacido en Rembang, Java Central, en 1966, en el seno de una familia de ulemas de Nahdlatul Ulama. Fue portavoz del presidente Abdurrahman Wahid y posteriormente miembro del Consejo Asesor Presidencial, y fue elegido presidente general de la junta ejecutiva de NU en diciembre de 2021; promueve lo que él denomina Islam humanitario."
  fr: "Érudit indonésien, né à Rembang (Java central) en 1966, issu d'une famille d'oulémas de Nahdlatul Ulama, il a été porte-parole du président Abdurrahman Wahid, puis membre du Conseil consultatif présidentiel, et a été élu président général du conseil exécutif de la Nahdlatul Ulama en décembre 2021; il promeut ce qu'il appelle l'islam humanitaire."
  tr: "1966'da Orta Cava'nın Rampang kentinde, Nahdlat al-Ulama (Nahdlat al-Ulama Endonezya) adlı bir akademisyen ailesinde doğan Endonezyalı bir akademisyen. O dönemde Cumhurbaşkanı Danışma Konseyi üyesi olan Abdul Rahman Wahid'in sözcüsüydü ve Aralık 2021'de Nahdlatul Ulama Yürütme Konseyi Genel Başkanı seçildi; 'hümanist İslam' olarak adlandırdığı yaklaşımı savundu."
  id: "Seorang ulama Indonesia, lahir di Rampang, Jawa Tengah pada tahun 1966, dari keluarga ulama di Nahdlat al-Ulama Indonesia. Ia pernah menjadi juru bicara Presiden Abdul Rahman Wahid, yang saat itu menjadi anggota Dewan Penasihat Presiden, dan terpilih sebagai Ketua Jenderal Dewan Eksekutif Nahdlatul Ulama pada Desember 2021; ia mengadvokasi apa yang ia sebut 'Islam humanis.'"
