summary:
  ar: "مهندس كهربائي كوري-أمريكي ⁦(1931–1992)⁩، وُلد في كيجو ⁦(سول اليوم)⁩ ودرس الفيزياء في جامعة سول الوطنية ثم هاجر إلى الولايات المتحدة 1955 ونال الدكتوراه من جامعة ولاية أوهايو 1959. باحث في مختبرات بِل بموراي هيل، صنع مع محمد عطا الله أول ترانزستور موسفت عام 1959 بعمليتي PMOS وNMOS، وشاركه ريادة دَيودات شوتكي العملية وترانزستور القاعدة النانوية، ثم اخترع مع سيمون من تسي موسفت البوابة العائمة 1967 التي قامت عليها ذاكرات EPROM وEEPROM والوميضية؛ رئيس مؤسس لمعهد NEC للبحوث وأُدخل قاعة مشاهير المخترعين 2009 {cite:wikipedia-dawon-kahng-en}."
  en: "Korean-American electrical engineer and inventor ⁦(1931–1992)⁩, born in Keijo ⁦(now Seoul)⁩, educated in physics at Seoul National University, emigrated to the United States in 1955 and took his doctorate at Ohio State University in 1959. A researcher at Bell Telephone Laboratories in Murray Hill, he built the first MOSFET with Mohamed Atalla in 1959 with both PMOS and NMOS processes, co-pioneered practical Schottky diodes and the metal nanolayer-base transistor, then invented the floating-gate MOSFET with Simon Min Sze in 1967 — the basis of EPROM, EEPROM and flash memory; founding president of the NEC Research Institute and a 2009 National Inventors Hall of Fame inductee {cite:wikipedia-dawon-kahng-en}."
  ur: "کوریائی نژاد امریکی برقی انجینئر اور ایجاد کنندہ ⁦(1931–1992)⁩، کيجو ⁦(آج کا سیول)⁩ میں پیدا ہوئے، سیول قومی جامعہ سے طبیعیات پڑھی، 1955 میں امریکہ ہجرت کی اور 1959 میں اوہائیو اسٹیٹ سے ڈاکٹریٹ لی۔ مورے ہل کی بیل لیبارٹریوں میں محقق رہے؛ 1959 میں محمد عطا اللہ کے ساتھ پہلا موسفیٹ بنایا ⁦(PMOS اور NMOS دونوں عملوں سے)⁩، شوٹکی ڈائی اوڈ اور نینو پرت والی قاعدے کے ٹرانزسٹر کے مشترک پیش رو رہے، پھر 1967 میں سائمن من سی کے ساتھ فلوٹنگ گیٹ موسفیٹ ایجاد کی جو EPROM، EEPROM اور فلیش میموری کی بنیاد بنا؛ NEC ریسرچ انسٹیٹیوٹ کے بانی صدر اور 2009 میں قومی ایجاد کنندگان ہال آف فیم کے رکن {cite:wikipedia-dawon-kahng-en}۔"
kids:
  ar: "داون كانغ مهندس كوري عمل مع محمد عطا الله في مختبرات بِل، فصنعا معاً عام 1959 أول موسفت — المفتاح الإلكتروني الصغير الذي تعمل به اليوم أجهزتنا كلها تقريباً."
  en: "Dawon Kahng was a Korean engineer who worked with Mohamed Atalla at Bell Labs; together they built the first MOSFET in 1959 — the tiny switch almost all our devices run on today."
  ur: "داون کانگ ایک کوریائی انجینئر تھے جو بیل لیبز میں محمد عطا اللہ کے ساتھ کام کرتے تھے؛ دونوں نے مل کر 1959 میں پہلا موسفیٹ بنایا — وہ چھوٹا سوئچ جس پر آج تقریباً ہر آلہ چلتا ہے۔"
