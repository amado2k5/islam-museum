summary:
  ar: "أبو حنش اللائي وقيل النميري، واسمه حضير بن قيس البصري؛ عاش مائة سنة، ورثى الوزير يعقوب بن داود لما مات بأبيات أوردها أبو تمام في كتاب «الحماسة» أولها: يعقوب لا تبعد... {cite:wafayat-ayan}."
  en: "Abu Hansh al-La'i, also said to be al-Numayri, whose name was Hudayr ibn Qays al-Basri; he lived a hundred years. When the vizier Yaqub ibn Dawud died he composed elegiac verses, which Abu Tammam included in his 'al-Hamasa'; the first of them opens with Yaqub's name {cite:wafayat-ayan}."
