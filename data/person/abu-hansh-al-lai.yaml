id: person/abu-hansh-al-lai
class: person
label: { ar: "أبو حنش اللائي", en: "Abu Hansh al-La'i", es: "Abu Hansh al-La'i", fr: "Abu Hansh al-La'i", ur: "ابو حنش اللاعی" }
summary:
  ar: "أبو حنش اللائي وقيل النميري، واسمه حضير بن قيس البصري؛ عاش مائة سنة، ورثى الوزير يعقوب بن داود لما مات بأبيات أوردها أبو تمام في كتاب «الحماسة» أولها: يعقوب لا تبعد... {cite:wafayat-ayan}."
  en: "Abu Hansh al-La'i, also said to be al-Numayri, whose name was Hudayr ibn Qays al-Basri; he lived a hundred years. When the vizier Yaqub ibn Dawud died he composed elegiac verses, which Abu Tammam included in his 'al-Hamasa'; the first of them opens with Yaqub's name {cite:wafayat-ayan}."
  es: "Abu Hansh al-La'i, también llamado al-Numayri, cuyo nombre era Hudayr ibn Qays al-Basri; vivió cien años. Cuando murió el visir Yaqub ibn Dawud, compuso versos elegíacos, que Abu Tammam incluyó en su 'al-Hamasa'; el primero de ellos comienza con el nombre de Yaqub {cite:wafayat-ayan}."
  fr: "Abou Hansh al-La'i, également connu sous le nom d'al-Numayri, de son vrai nom Hudayr ibn Qays al-Basri, vécut cent ans. À la mort du vizir Yaqub ibn Dawud, celui-ci composa des vers élégiaques qu'Abou Tammam intégra à son ouvrage « al-Hamasa »; le premier d'entre eux s'ouvre sur le nom de Yaqub."
  ur: "ابو حنش اللاعی، جسے النمیری بھی کہا جاتا ہے، جس کا نام حدیر بن قیس البصری تھا۔ وہ سو سال زندہ رہا۔ جب وزیر یعقوب بن داؤد کا انتقال ہوا تو اس نے خوبصورت آیات لکھیں، جنہیں ابو تمام نے اپنی 'الحمسہ' میں شامل کیا۔ ان میں سے پہلا یعقوب کے نام سے شروع ہوتا ہے۔"
  tr: "Ebu Haneş el-La'i, diğer adıyla el-Numairi, asıl adı Hudhayr ibn Qays el-Basri olan ve yüz yıl yaşamış bir kişidir. Vezir Yakub ibn Davud'un ölümü üzerine bir ağıt bestelemiştir; bu ağıt, Ebu Tammam'ın \"el-Hamasa\" adlı kitabına dahil edilmiştir ve ilk dizesi şöyledir: Yakub, uzaklara gitme... {cite:wafayat-ayan}."
  id: "Abu Hanash al-La’i, juga dikenal sebagai al-Numairi, yang nama aslinya adalah Hudhayr ibn Qays al-Basri, hidup selama seratus tahun. Ia menggubah elegi untuk menteri Yaqub ibn Dawud ketika ia meninggal, yang kemudian dimasukkan Abu Tammam ke dalam bukunya “al-Hamasa,” yang pertama berbunyi: Yaqub, jangan pergi jauh... {cite:wafayat-ayan}."
