summary:
  ar: "ست الشام زمرّد خاتون بنت أيوب؛ شقيقة شمس الدولة توران شاه بن أيوب؛ زوجها ناصر الدين بن أسد الدين شيركوه صاحب حمص؛ بنت مدرسة داخل دمشق قبلي البيمارستان النوري وبنت المدرسة الأخرى ظاهر دمشق وبها قبرها وقبر أخيها وزوجها؛ وكان ابن الصلاح يتولى تدريس مدرستها مع الناصرية بالقدس والرواحية ودار الحديث {cite:wafayat-ayan}."
  en: "Sitt al-Sham (Zumurrud Khatun) bint Ayyub (d. 616) — Salah al-Din's sister, wife of Nasir al-Din b. Shirkuh lord of Homs; founded two Damascus madrasas — one inside by the Nuriyya bimaristan and one outside where she and her husband lie; Ibn al-Salah taught at her school among four posts {cite:wafayat-ayan}."
