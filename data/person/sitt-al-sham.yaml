died: { edtf: "1220-01", hijri: "0616-11-16", calendar: julian, precision: day, status: historical, derived: true, note: "توفيت يوم الجمعة سادس عشر ذي القعدة سنة ست عشرة وستمائة {cite:wafayat-ayan}؛ و«كانت وفاتها في ذي القعدة» سنة 616هـ عند سبط ابن الجوزي ⁦(مرآة الزمان 22/241)⁩. التحويل الميلادي مشتق ومُثبت بالشهر.", sources: [source/wafayat-ayan, source/mirat-al-zaman-risala-2013-v22] }
summary:
  ar: "ست الشام زمرّد خاتون بنت أيوب؛ شقيقة شمس الدولة توران شاه بن أيوب؛ زوجها ناصر الدين بن أسد الدين شيركوه صاحب حمص؛ بنت مدرسة داخل دمشق قبلي البيمارستان النوري وبنت المدرسة الأخرى ظاهر دمشق وبها قبرها وقبر أخيها وزوجها؛ وكان ابن الصلاح يتولى تدريس مدرستها مع الناصرية بالقدس والرواحية ودار الحديث {cite:wafayat-ayan}. وعند سبط ابن الجوزي كانت كثيرة البر والصدقات، يُعمل في دارها كل سنة من الأشربة والمعاجين والعقاقير بألوف الدنانير تفرقها على الناس، وهي أم حسام الدين لاجين، ووقفت دارها مدرسة قبيل وفاتها، ودفنت بتربتها في العوينة، وكان لها ولأختها ربيعة خاتون «نيف وثلاثون محرماً من الملوك» {cite:mirat-al-zaman-risala-2013-v22 p. 241-242}."
  en: "Sitt al-Sham (Zumurrud Khatun) bint Ayyub (d. 616) — Salah al-Din's sister, wife of Nasir al-Din b. Shirkuh lord of Homs; founded two Damascus madrasas — one inside by the Nuriyya bimaristan and one outside where she and her husband lie; Ibn al-Salah taught at her school among four posts {cite:wafayat-ayan}. Sibt ibn al-Jawzi adds that every year her house prepared syrups, electuaries and drugs worth thousands of dinars to give away, that she was the mother of Husam al-Din Lajin, endowed her house as a madrasa shortly before her death, and that she and her sister Rabi'a Khatun counted 'thirty-odd kings' among their close kin {cite:mirat-al-zaman-risala-2013-v22 p. 241-242}."
  es: "Sitt al-Sham (Zumurrud Khatun) bint Ayyub (m. 616) — Hermana de Salah al-Din, esposa de Nasir al-Din b. Shirkuh, señor de Homs; fundó dos madrasas en Damasco: una en el interior, junto al Nuriyya bimaristan, y otra en el exterior, donde ella y su esposo yacen; Ibn al-Salah enseñó en su escuela, entre cuatro puestos {cite:wafayat-ayan}. Sibt ibn al-Jawzi añade que cada año su casa preparaba jarabes, electuarios y medicamentos por valor de miles de dinares para regalar, que fue la madre de Husam al-Din Lajin, dotó su casa como madrasa poco antes de su muerte, y que ella y su hermana Rabi'a Khatun contaban entre sus parientes cercanos a \"unos treinta reyes\" {cite:mirat-al-zaman-risala-2013-v22 p. 241-242}."
  fr: "Sitt al-Sham (Zumurrud Khatun) bint Ayyub (décédée en 616) — sœur de Saladin, épouse de Nasir al-Din b. Shirkuh, seigneur de Homs; fonda deux madrasas à Damas — l'une à l'intérieur, près du bimaristan de Nuriyya, et l'autre à l'extérieur, où reposent son époux et elle-même; Ibn al-Salah y enseigna, parmi quatre autres postes {cite:wafayat-ayan}. Sibt ibn al-Jawzi ajoute que chaque année, sa maison préparait des sirops, des électuaires et des médicaments d'une valeur de plusieurs milliers de dinars destinés à être distribués gratuitement, qu'elle était la mère de Husam al-Din Lajin, qu'elle dota sa maison d'une madrasa peu avant sa mort, et qu'elle et sa sœur Rabi'a Khatun comptaient une trentaine de rois parmi leurs proches parents {cite:mirat-al-zaman-risala-2013-v22 p. 241-242}."
  ur: "سیٹ الشام ⁦(زمرد خاتون)⁩ بنت ایوب ⁦(متوفی 616)⁩ — صلاح الدین کی بہن، ناصر الدین کی بیوی۔ حمص کا رب شرقو؛ دمشق کے دو مدارس کی بنیاد رکھی — ایک نوریہ بیمارستان کے اندر اور ایک باہر جہاں وہ اور اس کے شوہر پڑے ہیں۔ ابن الصلاح نے اپنے اسکول میں چار خطوط کے درمیان پڑھایا۔ سبط ابن الجوزی کا مزید کہنا ہے کہ ہر سال ان کے گھر سے ہزاروں دینار مالیت کا شربت، الیکٹوریز اور ادویات تیار کی جاتی تھیں، کہ وہ حسام الدین لاجین کی والدہ تھیں، ان کی وفات سے کچھ عرصہ قبل اس نے اپنے گھر کو ایک مدرسہ کے طور پر مختص کیا تھا، اور وہ اور اس کی بہن ربیعہ خاتون اپنے تیس قریبی رشتہ داروں میں شمار کرتی تھیں۔ {حوالہ:میرات الزمان رسالہ 2013-v22 صفحہ۔ 241-242}۔"
