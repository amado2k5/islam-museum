summary:
  ar: "عبد الله بن عبد الله بن الأهثم أبو حاقان؛ كان خليفة قتيبة على مرو إذا غزا فكتب إلى الحجاج يسعى بقتيبة فطوى الحجاج كتابه إليه فأحس بالشر فهرب إلى الشام فباع الخمر والكتانيات ثم تنكر باسم أبي طينة زياتاً بخرقة وقطنة على عينه حتى مات الوليد فقام فخطب في سليمان متهنئاً وواقعاً في الحجاج وقتيبة فقال الناس أبو طينة الزيات أبلغ الناس."
  en: "Abdallah ibn al-Ahtham, Abu Haqan — Qutayba's Marw deputy whose denunciation al-Hajjaj returned; forewarned he fled to Syria peddling wine, flax, then oil as one-eyed 'Abu Tutayna' — until al-Walid's death, when his unmasking sermon for Sulayman made him 'the most eloquent of men'."
