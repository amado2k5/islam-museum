id: person/abdallah-ibn-abdallah-ibn-al-ahtham
class: person
label: { ar: "عبد الله بن عبد الله بن الأهثم أبو حاقان", en: "Abdallah ibn Abdallah ibn al-Ahtham (Abu Haqan / Abu Tutayna)", fr: "Abdallah ibn Abdallah ibn al-Ahtham (Abu Haqan / Abu Tutayna)", es: "Abdallah ibn Abdallah ibn al-Ahtham (Abu Haqan / Abu Tutayna)", ur: "عبداللہ بن عبداللہ ابن الاحثم ⁦(ابو حقان / ابو طوطینا)⁩" }
summary:
  ar: "عبد الله بن عبد الله بن الأهثم أبو حاقان؛ كان خليفة قتيبة على مرو إذا غزا فكتب إلى الحجاج يسعى بقتيبة فطوى الحجاج كتابه إليه فأحس بالشر فهرب إلى الشام فباع الخمر والكتانيات ثم تنكر باسم أبي طينة زياتاً بخرقة وقطنة على عينه حتى مات الوليد فقام فخطب في سليمان متهنئاً وواقعاً في الحجاج وقتيبة فقال الناس أبو طينة الزيات أبلغ الناس."
  en: "Abdallah ibn al-Ahtham, Abu Haqan — Qutayba's Marw deputy whose denunciation al-Hajjaj returned; forewarned he fled to Syria peddling wine, flax, then oil as one-eyed 'Abu Tutayna' — until al-Walid's death, when his unmasking sermon for Sulayman made him 'the most eloquent of men'."
  fr: "Abdallah ibn al-Ahtham, Abu Haqan — suppléant de Qutayba à Merv, dont al-Hajjaj renvoya la dénonciation ; averti, il s'enfuit en Syrie, vendant du vin, du lin, puis de l'huile sous le nom d'« Abu Tutayna », un œil couvert — jusqu'à la mort d'al-Walid, où son sermon révélateur devant Sulayman fit de lui « le plus éloquent des hommes »."
  es: "Abdallah ibn al-Ahtham, Abu Haqan — lugarteniente de Qutayba en Marw, cuya denuncia fue devuelta por al-Hajjaj; advertido de antemano, huyó a Siria traficando vino, lino y luego aceite como el tuerto 'Abu Tutayna' — hasta la muerte de al-Walid, cuando su sermón desenmascarador para Sulayman lo convirtió en 'el más elocuente de los hombres'."
  ur: "عبداللہ ابن الاحثم، ابو حقان - قتیبہ کے مرو نائب جن کی مذمت الحجاج واپس آئے؛ پہلے سے خبردار کیا گیا تھا کہ وہ شراب، سن، پھر ایک آنکھ والے 'ابو طوطینا' کی طرح تیل بیچتا ہوا شام چلا گیا - الولید کی موت تک، جب سلیمان کے لیے اس کے بے نقاب خطبے نے اسے 'مردوں میں سب سے زیادہ فصیح' بنا دیا۔"
  tr: "Abdullah bin Abdullah bin Al-Ahtham Ebu Hakan; Kuteybe sefere çıktığında Merv'de onun yardımcısıydı. Haccac'a Kuteybe'yi bilgilendiren bir mektup yazdı, Haccac da mektubunu gizledi. Bunun üzerine kötülüğü sezdi ve Levant'a kaçtı. Şarap ve keten kumaş sattı, sonra da gözünü bir bez ve pamukla kapatarak yağ tüccarı Ebu Tina kılığına girdi, ta ki El-Valid ölene kadar. Sonra Süleyman'da ayağa kalkıp bir konuşma yaptı, onu tebrik etti ve Haccac ile Kuteybe'ye saldırdı. Bunun üzerine insanlar, \"Yağ tüccarı Ebu Tina, insanların en güzel konuşanıdır\" dediler."
  id: "Abdullah bin Abdullah bin Al-Ahtham Abu Haqan; dia adalah wakil Qutaybah di Merv ketika Qutaybah pergi berperang. Dia menulis surat kepada Al-Hajjaj untuk memberitahukan tentang Qutaybah, sehingga Al-Hajjaj menyembunyikan suratnya. Maka dia merasakan ada sesuatu yang tidak beres dan melarikan diri ke Levant. Dia menjual anggur dan kain, lalu menyamar sebagai Abu Tina, seorang pedagang minyak, dengan kain dan kapas menutupi matanya, sampai Al-Walid meninggal. Kemudian dia berdiri dan berpidato di Sulayman, mengucapkan selamat kepadanya dan menyerang Al-Hajjaj dan Qutaybah. Maka orang-orang berkata, \"Abu Tina si pedagang minyak adalah orang yang paling fasih berpidato.\""
