label: { ar: "عبد الله بن عبد الله بن الأهثم أبو حاقان", en: "Abdallah ibn Abdallah ibn al-Ahtham (Abu Haqan / Abu Tutayna)", fr: "Abdallah ibn Abdallah ibn al-Ahtham (Abu Haqan / Abu Tutayna)", es: "Abdallah ibn Abdallah ibn al-Ahtham (Abu Haqan / Abu Tutayna)" }
summary:
  ar: "عبد الله بن عبد الله بن الأهثم أبو حاقان؛ كان خليفة قتيبة على مرو إذا غزا فكتب إلى الحجاج يسعى بقتيبة فطوى الحجاج كتابه إليه فأحس بالشر فهرب إلى الشام فباع الخمر والكتانيات ثم تنكر باسم أبي طينة زياتاً بخرقة وقطنة على عينه حتى مات الوليد فقام فخطب في سليمان متهنئاً وواقعاً في الحجاج وقتيبة فقال الناس أبو طينة الزيات أبلغ الناس."
  en: "Abdallah ibn al-Ahtham, Abu Haqan — Qutayba's Marw deputy whose denunciation al-Hajjaj returned; forewarned he fled to Syria peddling wine, flax, then oil as one-eyed 'Abu Tutayna' — until al-Walid's death, when his unmasking sermon for Sulayman made him 'the most eloquent of men'."
  fr: "Abdallah ibn al-Ahtham, Abu Haqan — suppléant de Qutayba à Merv, dont al-Hajjaj renvoya la dénonciation ; averti, il s'enfuit en Syrie, vendant du vin, du lin, puis de l'huile sous le nom d'« Abu Tutayna », un œil couvert — jusqu'à la mort d'al-Walid, où son sermon révélateur devant Sulayman fit de lui « le plus éloquent des hommes »."
  es: "Abdallah ibn al-Ahtham, Abu Haqan — lugarteniente de Qutayba en Marw, cuya denuncia fue devuelta por al-Hajjaj; advertido de antemano, huyó a Siria traficando vino, lino y luego aceite como el tuerto 'Abu Tutayna' — hasta la muerte de al-Walid, cuando su sermón desenmascarador para Sulayman lo convirtió en 'el más elocuente de los hombres'."
