summary:
  ar: "بافاغوثو راغورام شيتي (وُلد في 1 آب 1942) رجل أعمال هندي من أودوبي بولاية كارناتاكا، هاجر إلى الإمارات العربية المتحدة سنة 1973 وأسس إن إم سي هيلث والإمارات للصرافة ونيوفارما، وبنى واحدة من أكبر الإمبراطوريات التجارية الهندية في الخليج قبل انهيار إن إم سي إلى الحراسة القضائية سنة 2020 وسط تحقيقات في ديون غير معلنة. نال وسام برافاسي بهاراتيا سامان سنة 2007 ووسام بادما شري سنة 2009."
  en: "Bavaguthu Raghuram Shetty (born 1 August 1942) is an Indian businessman from Udupi in Karnataka who emigrated to the United Arab Emirates in 1973 and founded NMC Health, UAE Exchange and Neopharma, building one of the Gulf's largest Indian business empires before NMC's collapse into administration in 2020 amid investigations into undisclosed debts. He received the Pravasi Bharatiya Samman in 2007 and the Padma Shri in 2009."
  ur: "باواگوتھو رگھورام شیٹی (پیدائش 1 اگست 1942) کرناٹک کے اڈوپی سے تعلق رکھنے والے بھارتی تاجر ہیں جو 1973 میں متحدہ عرب امارات چلے گئے اور این ایم سی ہیلتھ، یو اے ای ایکسچینج اور نیوفارما قائم کیے؛ انھوں نے خلیج کی سب سے بڑی بھارتی کاروباری سلطنتوں میں سے ایک بنائی، مگر این ایم سی 2020 میں غیر ظاہر شدہ قرضوں کی تحقیقات کے درمیان انتظامیہ میں چلی گئی۔ انھیں 2007 میں پرواسی بھارتیا سمان اور 2009 میں پدم شری ملا۔"
