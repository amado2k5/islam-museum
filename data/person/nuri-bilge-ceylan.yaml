  ar: "مخرج ومصوّر تركي، وُلد في إسطنبول سنة 1959؛ بدأ مهندسًا ومصوّرًا ثم صنع ثلاثيته الريفية «البلدة الصغيرة» (1997) و«غيوم مايو» (1999) و«بعيد» (2002)، وفاز في كان بالجائزة الكبرى عن «بعيد» و«حدث ذات مرة في الأناضول» (2011) وبجائزة أفضل مخرج عن «ثلاثة قرود» (2008) وبالسعفة الذهبية عن «سبات شتوي» (2014)."
  en: "Turkish film director and photographer, born in Istanbul in 1959. He began as an engineer and photographer, then made his provincial trilogy The Small Town (1997), Clouds of May (1999) and Distant (2002); at Cannes he won the Grand Prix for Distant and Once Upon a Time in Anatolia (2011), Best Director for Three Monkeys (2008), and the Palme d'Or for Winter Sleep (2014)."
  ur: "ترک فلم ہدایت کار اور فوٹوگرافر، 1959 میں استنبول میں پیدا ہوئے؛ انجینئر اور فوٹوگرافر کے طور پر آغاز کیا، پھر اپنی دیہی سہ فلم «چھوٹا قصبہ» (1997)، «مئی کے بادل» (1999) اور «دور» (2002) بنائی؛ کان میں «دور» اور «اناطولیہ میں ایک دفعہ» (2011) پر گرینڈ پرکس، «تین بندر» (2008) پر بہترین ہدایت کار اور «سرمائی نیند» (2014) پر پام ڈی اور جیتا۔"
