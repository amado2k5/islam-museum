summary:
  ar: "أبو المنصور ميرزا محمد واجد علي شاه (30 يوليو 1822 – 1887)، آخر ملوك أوده، حكم من 1847 حتى ضمّ البريطانيون دولته سنة 1856 فنفوه إلى متيابروز بكلكتا، حيث عاش بقية عمره وبنى حسينية سبطين آباد ودُفن فيها. كان شاعراً وكاتباً غزير الإنتاج وراعياً عظيماً للفنون، أعاد إحياء رقص الكاثاك وجعل لكناو في عهده مركزاً للثقافة."
  en: "Abu al-Mansur Mirza Muhammad Wajid Ali Shah (30 July 1822 – 1887) was the eleventh and last King of Awadh, reigning from 1847 until the British annexed his state in 1856 and exiled him to Metiabruz, Calcutta, where he lived out his life, built the Sibtainabad Imambara and was buried in it. He was a poet and prolific writer and a great patron of the arts who revived Kathak dance and made Lucknow a cultural capital."
  ur: "ابو المنصور مرزا محمد واجد علی شاہ (30 جولائی 1822ء – 1887ء) اودھ کے گیارہویں اور آخری بادشاہ تھے، 1847ء سے حکمران رہے حتیٰ کہ 1856ء میں انگریزوں نے ان کی ریاست ضم کر کے انھیں کلکتہ کے مٹیابرج جلا وطن کر دیا، جہاں انھوں نے بقیہ زندگی گزاری، سبطین آباد امام باڑہ بنوایا اور وہیں دفن ہوئے۔ وہ شاعر اور کثیر التصانیف مصنف تھے اور فنون کے عظیم سرپرست، جنھوں نے کتھک رقص کو از سر نو زندہ کیا اور لکھنؤ کو ثقافت کا مرکز بنایا۔"

