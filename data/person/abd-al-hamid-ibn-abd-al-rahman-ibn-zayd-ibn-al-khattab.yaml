label: { ar: "عبد الحميد بن عبد الرحمن بن زيد بن الخطاب", en: "Abd al-Hamid ibn Abd al-Rahman ibn Zayd ibn al-Khattab", fr: "Abd al-Hamid ibn Abd al-Rahman ibn Zayd ibn al-Khattab", es: "Abd al-Hamid ibn Abd al-Rahman ibn Zayd ibn al-Khattab", ur: "عبد الحمید بن عبد الرحمن بن زید ابن الخطاب" }
gender: male
roles: [emir]
summary:
  ar: "ولاه عمر بن عبد العزيز إمرة الكوفة، ويصفه الكتاب بأنه الإمام الثقة الأمير العادل، وقليل الرواية كبير القدر، وتوفي سنة 115هـ {cite:salabi-umayyad-state-2020 p.387}."
  en: "Umar ibn Abd al-Aziz appointed him amir of Kufa. The book describes him as a trustworthy imam and a just amir, who narrated little and was of great standing, and says he died in 115 AH {cite:salabi-umayyad-state-2020 p.387}."
  fr: "Umar ibn Abd al-Aziz le nomma émir de Koufa. Le livre le décrit comme un imam digne de confiance et un émir juste, qui transmit peu et était de grand rang, et dit qu'il mourut en 115 H {cite:salabi-umayyad-state-2020 p.387}."
  es: "Umar ibn Abd al-Aziz lo nombró emir de Kufa. El libro lo describe como un imán digno de confianza y un emir justo, que narraba poco y gozaba de gran prestigio, y dice que murió en el año 115 de la Hégira {cite:salabi-umayyad-state-2020 p.387}."
  ur: "عمر بن عبدالعزیز نے انہیں کوفہ کا امیر مقرر کیا۔ کتاب میں ان کو ایک ثقہ امام اور عادل امیر کے طور پر بیان کیا گیا ہے، جس نے بہت کم بیان کیا اور بڑے مرتبے والے تھے، اور کہتے ہیں کہ ان کی وفات 115 ہجری میں ہوئی۔"
  tr: "Ömer bin Abdül Aziz onu Kufa valisi olarak atadı ve kitapta kendisi, az rivayete rağmen büyük bir şahsiyet olan, güvenilir imam ve adil prens olarak tanımlanmaktadır. Hicri 115 yılında vefat etti. {cite:salabi-umayyad-state-2020 s.387}"
  id: "Umar bin Abdul Aziz mengangkatnya sebagai gubernur Kufa, dan buku tersebut menggambarkannya sebagai imam yang terpercaya, pangeran yang adil, dengan sedikit riwayat tetapi memiliki kedudukan yang tinggi. Ia wafat pada tahun 115 H {cite:salabi-umayyad-state-2020 p.387}."
