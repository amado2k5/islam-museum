summary:
  ar: "عبد الله بن إسماعيل بن إبراهيم بن عيسى بن أبي جعفر المنصور، أبو جعفر الهاشمي المعروف بابن بُرَيَّة ⁦(ت 350هـ)⁩؛ كان إمام جامع المنصور، وحدّث عن ابن أبي الدنيا وغيره وروى عنه ابن رزقويه. وحُكي عنه أنه قال: رقيت هذا المنبر — يعني منبر جامع المدينة بالجانب الغربي — في سنة ثلاثين ومائتين ورقيته في سنة ثلاثين وثلثمائة وبين الرقيتين مائة سنة، وأنا وهو — يعني الواثق — في العدد إلى المنصور سواء؛ توفي في صفر سنة خمسين وثلثمائة وقيل سنة اثنتين وخمسين {cite:muntazam-ibn-al-jawzi j.7 p.9}."
  en: "'Abd Allah b. Isma'il b. Ibrahim b. 'Isa b. Abi Ja'far al-Mansur, Abu Ja'far al-Hashimi known as Ibn Burayya (d. 350), imam of the Mansur mosque: he once said he had mounted the minbar of the western city's mosque in 230 and again in 330 — a century between the two ascents — and that he and al-Wathiq stood at equal remove from al-Mansur; he died Safar 350, some say 352 {cite:muntazam-ibn-al-jawzi j.7 p.9}."
  es: "'Abd Allah b. Isma'il b. Ibrahim b. 'Isa b. Abi Ja'far al-Mansur, Abu Ja'far al-Hashimi conocido como Ibn Burayya (m. 350), imán de la mezquita de Mansur: una vez dijo que había subido al minbar de la mezquita de la ciudad occidental en 230 y de nuevo en 330 —un siglo entre los dos ascensos— y que él y al-Wathiq estaban a igual distancia de al-Mansur; murió en Safar 350, algunos dicen 352 {cite:muntazam-ibn-al-jawzi j.7 p.9}."
  fr: "'Abd Allah b. Isma'il b. Ibrahim b. 'Isa b. Abi Ja'far al-Mansur, Abu Ja'far al-Hashimi connu sous le nom d'Ibn Burayya (d. 350), imam de la mosquée de Mansur: il a dit un jour qu'il était monté sur le minbar de la mosquée de la ville occidentale en 230 et de nouveau en 330 — un siècle entre les deux ascensions — et que lui et al-Wathiq se tenaient à égale distance d'al-Mansur; il est mort Safar 350, certains disent 352 {cite:muntazam-ibn-al-jawzi j.7 p.9}."
  ur: "عبداللہ بی۔ اسماعیل بی۔ ابراہیم بی۔ عیسیٰ بی۔ ابی جعفر المنصور، ابو جعفر الہاشمی جسے ابن بریدہ ⁦(متوفی 350)⁩ کے نام سے جانا جاتا ہے، منصور کی مسجد کا امام: اس نے ایک بار کہا کہ اس نے 230 میں مغربی شہر کی مسجد کے منبر پر چڑھائی کی تھی اور پھر 330 میں - دونوں چڑھائیوں کے درمیان ایک صدی تھی - اور یہ کہ وہ اور السورود المصطفٰی سے مساوی ہیں۔ ان کی وفات صفر 350 ہے، بعض کہتے ہیں کہ 352 {حوالہ:منتظم ابن الجوزی ج7 ص9}۔"
  tr: "Abdullah ibn İsmail ibn İbrahim ibn İsa ibn Abi Ca'fer el-Mansur, Ebu Ca'far el-Haşimi, İbn Bariye olarak bilinir (ö. 350 H), el-Mensur Camii'nin imamı olmuştur; İbn Ebi Dunya ve diğerlerinden rivayet edilmiştir, İbn Rizqaviye ise ondan rivayet edilmiştir. Ondan rivayet edilir: Ben bu kürsüye—yani batıdaki Medine camisinin minaberine—230 Hicri yılında, rükiyesi 330 Hile yılında, iki rukıya arasında yüz elli yıl vardı ve Ben, yani el-Vathi, el-Mansur ile eşittim; 350 Hicri yılında Safar'de öldü ve 52 Hicri denir {atıf:Muntazam-ibn-al-Jawzi j.7 s.9}."
  id: "Abdullah ibn Ismail ibn Ibrahim ibn Isa ibn Abi Ja'far al-Mansur, Abu Ja'far al-Hashimi, dikenal sebagai Ibn Bariyah (wafat 350 H), adalah imam Masjid al-Mansur, yang diceritakan dari Ibn Abi Dunya dan lainnya, dan Ibn Rizqawiyah menceritakan darinya. Diceritakan darinya bahwa ia berkata: Aku diangkat ke mimbar ini—yang berarti mimbar masjid Madinah di sisi barat—pada tahun 230 H, dan ruqyahnya pada tahun 330 H, dan di antara kedua ruqyyah itu adalah seratus lima puluh tahun, dan I, yang berarti al-Wathiq, jumlahnya sama dengan al-Mansur; ia meninggal di Safar pada tahun 350 H, dan dikatakan 52 H {cite:muntazam-ibn-al-jawzi j.7 hlm.9}."
