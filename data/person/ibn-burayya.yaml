summary:
  ar: "عبد الله بن إسماعيل بن إبراهيم بن عيسى بن أبي جعفر المنصور، أبو جعفر الهاشمي المعروف بابن بُرَيَّة (ت 350هـ)؛ كان إمام جامع المنصور، وحدّث عن ابن أبي الدنيا وغيره وروى عنه ابن رزقويه. وحُكي عنه أنه قال: رقيت هذا المنبر — يعني منبر جامع المدينة بالجانب الغربي — في سنة ثلاثين ومائتين ورقيته في سنة ثلاثين وثلثمائة وبين الرقيتين مائة سنة، وأنا وهو — يعني الواثق — في العدد إلى المنصور سواء؛ توفي في صفر سنة خمسين وثلثمائة وقيل سنة اثنتين وخمسين {cite:muntazam-ibn-al-jawzi j.7 p.9}."
  en: "'Abd Allah b. Isma'il b. Ibrahim b. 'Isa b. Abi Ja'far al-Mansur, Abu Ja'far al-Hashimi known as Ibn Burayya (d. 350), imam of the Mansur mosque: he once said he had mounted the minbar of the western city's mosque in 230 and again in 330 — a century between the two ascents — and that he and al-Wathiq stood at equal remove from al-Mansur; he died Safar 350, some say 352 {cite:muntazam-ibn-al-jawzi j.7 p.9}."
