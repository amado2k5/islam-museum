summary:
  ar: "صحابي من الأنصار، يروي عنه حديث «إن الحلال بين وإن الحرام بين وبينهما أمور مشتبهات» وهو الحديث السادس من الأربعين النووية، رواه عنه الشعبي وأخرجه الشيخان في صحيحيهما؛ ذكر ابن رجب أن حديثه هذا أصح أحاديث الباب. وكان أميراً على الكوفة حين قدم مسلم بن عقيل، ولما دخلها ابن زياد متلثماً والناس يظنونه الحسين تحصن في القصر فأشرف عليه وقال يا ابن رسول الله ما لي ولك وما حملك على قصد بلدي فقال ابن زياد لقد طال نومك يا نعيم وحسر اللثام عن فيه فعرفه ففتح له {cite:muruj-al-dhahab p. 56}"
  en: "A companion of the Prophet from the Ansar; he transmits the hadith 'the lawful is clear and the unlawful is clear and between them are doubtful matters', the sixth hadith of al-Nawawi's Forty, transmitted from him by al-Sha'bi and included by both Shaykhs in their Sahihs; Ibn Rajab calls it the soundest hadith of its chapter."
  fr: "Un compagnon du Prophète de l'Ansar, il transmet le hadith « le légitime est clair et l'illégal est clair et entre eux sont des questions douteuses », le sixième hadith d'al-Nawawi Quarante, transmis de lui par al-Sha'bi et inclus par les deux Cheikhs dans leurs Sahihs ; Ibn Rajab l’appelle le hadith le plus solide de son chapitre."
  ur: "انصار کے نبی کے صحابی؛ ان سے «حلال واضح ہے اور حرام واضح ہے اور ان کے درمیان مشتبہ امور ہیں» کی حدیث منقول ہے۔"
  es: "Un compañero del Profeta de los Ansar; transmite el hadiz \"lo lícito es claro y lo ilícito es claro y entre ellos hay asuntos dudosos\", el sexto hadiz de los Cuarenta de al-Nawawi, transmitido por al-Sha'bi e incluido por ambos Shaykhs en sus Sahihs; Ibn Rajab lo llama el hadiz más sólido de su capítulo."
  tr: "Ensar'dan bir sahabe, ondan \"Gerçekten şeramet olan açıktır, yasa dışı da açıktır ve aralarında belirsiz meseleler vardır\" adlı hadisi rivayet etti; bu, kırk en-Nevewiye göreminden altıncı hadistir. Bu hadis el-Şa'bi tarafından ve iki Şeyh tarafından kendi Sahihlerinde rivayet edilmiştir; İbn Receb bu hadisin en doğrusu olduğunu belirtmiştir. Müslüman ibn Aqil geldiğinde Kufe'nin valisiydi. İbn Ziyad maskeli olarak girdiğinde ve insanlar onu Hüseyin sandığında, sarayda kendini güçlendirdi, onu gözetledi ve dedi ki: Ey Allah'ın Resulü'nün oğlu, seninle ne işim var ve seni şehrime ne getirdi? İbn Ziyad dedi ki, \"Uykun uzun sürdü, ey Na'im, ve perde açıldı.\" Onu tanıdı ve açtı. {alıntı:) Muruj-al-Dhahab s. 56}"
  id: "Seorang sahabat dari Ansar menceritakan hadits darinya \"Sesungguhnya, yang sah itu jelas dan yang tidak sah itu jelas, dan di antara keduanya ada hal-hal yang samar,\" yang merupakan hadis keenam dari tradisi empat puluh an-Nawawiyyah. Hadits ini diceritakan darinya oleh al-Sha'bi dan oleh dua Syekh dalam Syahi mereka; Ibn Rajab menyebutkan bahwa hadis ini adalah yang paling otentik di antara bab-bab tersebut. Dia adalah gubernur Kufa ketika Muslim ibn Aqil tiba. Ketika Ibn Ziyad masuk dengan topeng dan orang-orang mengira dia adalah Husayn, dia menguatkan diri di istana dan mengawasinya dan berkata: Wahai putra Rasulullah, apa hubunganku denganmu dan apa yang membawamu ke kotaku? Ibn Ziyad berkata, \"Tidurmu panjang, wahai Na'im, dan tirai itu terbuka.\" Dia mengenalinya dan membukanya untuknya. {cite:muruj-al-dhahab hlm. 56}"
