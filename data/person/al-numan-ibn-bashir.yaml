summary:
  ar: "صحابي من الأنصار، يروي عنه حديث «إن الحلال بين وإن الحرام بين وبينهما أمور مشتبهات» وهو الحديث السادس من الأربعين النووية، رواه عنه الشعبي وأخرجه الشيخان في صحيحيهما؛ ذكر ابن رجب أن حديثه هذا أصح أحاديث الباب. وكان أميراً على الكوفة حين قدم مسلم بن عقيل، ولما دخلها ابن زياد متلثماً والناس يظنونه الحسين تحصن في القصر فأشرف عليه وقال يا ابن رسول الله ما لي ولك وما حملك على قصد بلدي فقال ابن زياد لقد طال نومك يا نعيم وحسر اللثام عن فيه فعرفه ففتح له {cite:muruj-al-dhahab p. 56}"
  en: "A companion of the Prophet from the Ansar; he transmits the hadith 'the lawful is clear and the unlawful is clear and between them are doubtful matters', the sixth hadith of al-Nawawi's Forty, transmitted from him by al-Sha'bi and included by both Shaykhs in their Sahihs; Ibn Rajab calls it the soundest hadith of its chapter."
  ur: "انصار کے نبی کے صحابی؛ ان سے «حلال واضح ہے اور حرام واضح ہے اور ان کے درمیان مشتبہ امور ہیں» کی حدیث منقول ہے۔"
