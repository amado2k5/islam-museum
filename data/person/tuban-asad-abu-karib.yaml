summary:
  ar: "ملك حمير الذي دخلت اليهودية في اليمن من قبله: ذهب مقاتلاً إلى يثرب واعتنق هناك اليهودية وجاء بحبرين من بني قريظة إلى اليمن فأخذت اليهودية إلى التوسع والانتشار فيها؛ وابنه يوسف ذو نواس صاحب أخدود نجران، في رواية الرحيق المختوم. وفي رواية ابن زبالة عند السمهودي أنه لما قدم المدينة وأراد إخرابها جاءه حبران من قريظة — سحيت ومنبه — فأخبراه أنها محفوظة وأنها مهاجر نبي من بني إسماعيل اسمه أحمد، فصدّقهما وكفّ عن أهلها، وبنى لكل عالم داراً وزوّجه، وكتب كتاباً فيه إسلامه وشهد فيه على أحمد وختمه بالذهب ودفعه إلى كبيرهم ليبلغ النبي أو من أدركه من ولده، وبنى له داراً تداولها الملاك حتى صارت لأبي أيوب من ولد ذلك العالم {cite:samhudi-wafa-al-wafa p. 200-201}. وفي الحديث «لا تسبوا تبعاً فإنه كان قد أسلم»."
  en: "The Himyarite king through whom Judaism entered Yemen: he went to fight at Yathrib, adopted Judaism there and brought two rabbis of Banu Qurayza back to Yemen, where Judaism then spread; his son Yusuf Dhu Nuwas was the king of the Najran trench, in al-Raheeq al-Makhtum's account. In Ibn Zabala's version preserved by al-Samhudi, he came meaning to destroy the town until two rabbis of Qurayza — Suhayt and Munabba — told him it was protected, the future refuge of a prophet of the Ishmaelites named Ahmad, so he believed them and desisted, built each scholar a house and married him off, wrote a gold-sealed letter attesting his Islam and testifying to Ahmad to be passed to the Prophet or whichever descendant met him, and built the Prophet a house that passed through heirs until it reached Abu Ayyub, a descendant of that scholar {cite:samhudi-wafa-al-wafa p. 200-201}. The hadith says: 'Do not curse Tubba', for he had become Muslim.'"
