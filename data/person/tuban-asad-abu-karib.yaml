summary:
  ar: "ملك حمير الذي دخلت اليهودية في اليمن من قبله: ذهب مقاتلاً إلى يثرب واعتنق هناك اليهودية وجاء بحبرين من بني قريظة إلى اليمن فأخذت اليهودية إلى التوسع والانتشار فيها؛ وابنه يوسف ذو نواس صاحب أخدود نجران، في رواية الرحيق المختوم. وفي رواية ابن زبالة عند السمهودي أنه لما قدم المدينة وأراد إخرابها جاءه حبران من قريظة — سحيت ومنبه — فأخبراه أنها محفوظة وأنها مهاجر نبي من بني إسماعيل اسمه أحمد، فصدّقهما وكفّ عن أهلها، وبنى لكل عالم داراً وزوّجه، وكتب كتاباً فيه إسلامه وشهد فيه على أحمد وختمه بالذهب ودفعه إلى كبيرهم ليبلغ النبي أو من أدركه من ولده، وبنى له داراً تداولها الملاك حتى صارت لأبي أيوب من ولد ذلك العالم {cite:samhudi-wafa-al-wafa p. 200-201}. وفي الحديث «لا تسبوا تبعاً فإنه كان قد أسلم»."
  en: "The Himyarite king through whom Judaism entered Yemen: he went to fight at Yathrib, adopted Judaism there and brought two rabbis of Banu Qurayza back to Yemen, where Judaism then spread; his son Yusuf Dhu Nuwas was the king of the Najran trench, in al-Raheeq al-Makhtum's account. In Ibn Zabala's version preserved by al-Samhudi, he came meaning to destroy the town until two rabbis of Qurayza — Suhayt and Munabba — told him it was protected, the future refuge of a prophet of the Ishmaelites named Ahmad, so he believed them and desisted, built each scholar a house and married him off, wrote a gold-sealed letter attesting his Islam and testifying to Ahmad to be passed to the Prophet or whichever descendant met him, and built the Prophet a house that passed through heirs until it reached Abu Ayyub, a descendant of that scholar {cite:samhudi-wafa-al-wafa p. 200-201}. The hadith says: 'Do not curse Tubba', for he had become Muslim.'"
  es: "El rey himyarita a través del cual el judaísmo entró en Yemen: fue a luchar en Yathrib, adoptó el judaísmo allí y trajo de vuelta a Yemen a dos rabinos de Banu Qurayza, donde el judaísmo se extendió posteriormente; su hijo Yusuf Dhu Nuwas fue el rey de la trinchera de Najrán, según el relato de al-Raheeq al-Makhtum. En la versión de Ibn Zabala, conservada por al-Samhudi, llegó con la intención de destruir la ciudad hasta que dos rabinos de Qurayza —Suhayt y Munabba— le dijeron que estaba protegida, que era el futuro refugio de un profeta de los ismaelitas llamado Ahmad. Entonces les creyó y desistió, construyó una casa para cada erudito y lo casó, escribió una carta sellada con oro que atestiguaba su Islam y daba testimonio de Ahmad para que se la entregara al Profeta o a cualquier descendiente que lo encontrara, y construyó una casa para el Profeta que pasó por sus herederos hasta llegar a Abu Ayyub, descendiente de ese erudito {cite:samhudi-wafa-al-wafa p. 200-201}. El hadiz dice: «No maldigas a Tubba, pues se había convertido al Islam»."
  fr: "Le roi himyarite par lequel le judaïsme pénétra au Yémen: il partit combattre à Yathrib, se convertit au judaïsme et ramena deux rabbins des Banu Qurayza au Yémen, où le judaïsme se répandit ensuite; son fils Yusuf Dhu Nuwas était roi du fossé de Najran, selon le récit d'al-Raheeq al-Makhtum. Dans la version d'Ibn Zabala conservée par al-Samhudi, il vint avec l'intention de détruire la ville jusqu'à ce que deux rabbins de Qurayza — Suhayt et Munabba — lui disent qu'elle était protégée, le futur refuge d'un prophète des Ismaélites nommé Ahmad. Il les crut et renonça, fit construire une maison pour chaque savant et le maria, rédigea une lettre scellée d'or attestant de sa conversion à l'islam et témoignant de la présence d'Ahmad, lettre qui devait être transmise au Prophète ou à tout descendant qui le rencontrerait, et fit construire pour le Prophète une maison qui passa de génération en génération jusqu'à Abu Ayyub, un descendant de ce savant. 200-201}. Le hadith dit: « Ne maudissez pas Tubba, car il s'était converti à l'islam. »"
