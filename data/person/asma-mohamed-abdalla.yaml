summary:
  ar: "دبلوماسية سودانية وُلدت سنة 1946 في الخرطوم؛ من أول ثلاث نساء التحقن بوزارة الخارجية السودانية بعد تخرّجها في الاقتصاد والعلوم السياسية بجامعة الخرطوم، فُصلت في عهد البشير وعاشت منفية في المغرب تعمل مستشارة لمنظمات دولية، ثم صارت أول امرأة تتولى وزارة الخارجية السودانية في حكومة عبد الله حمدوك الانتقالية ⁦(سبتمبر 2019 – يوليو 2020)⁩."
  en: "Sudanese diplomat, born 1946 in Khartoum. One of the first three women to join Sudan's Foreign Ministry after graduating in economics and political science from the University of Khartoum, she was dismissed under Omar al-Bashir and lived in exile in Morocco consulting for international organisations, then became Sudan's first female Minister of Foreign Affairs in Abdalla Hamdok's transitional cabinet ⁦(September 2019 – July 2020)⁩."
  ur: "سوڈانی سفارت کار، 1946 میں کھارٹوم میں پیدا ہوئیں۔ جامعہ کھارٹوم سے معاشیات اور سیاسیات کی ڈگری لے کر سوڈانی وزارتِ خارجہ میں شامل ہونے والی پہلی تین خواتین میں سے ایک رہیں؛ عمر البشیر کے دور میں برطرف ہو کر مراکش میں جلاوطن رہیں اور بین الاقوامی اداروں کی مشیر رہیں، پھر عبداللہ حمدوک کی عبوری کابینہ ⁦(ستمبر 2019 – جولائی 2020)⁩ میں سوڈان کی پہلی خاتون وزیرِ خارجہ بنیں۔"
  es: "Diplomática sudanesa, nacida en 1946 en Jartum. Fue una de las tres primeras mujeres en incorporarse al Ministerio de Asuntos Exteriores de Sudán tras graduarse en economía y ciencias políticas por la Universidad de Jartum. Fue destituida durante el gobierno de Omar al-Bashir y vivió exiliada en Marruecos, donde trabajó como consultora para organizaciones internacionales. Posteriormente, se convirtió en la primera mujer ministra de Asuntos Exteriores de Sudán en el gabinete de transición de Abdalla Hamdok (septiembre de 2019 - julio de 2020)."
  fr: "Diplomate soudanaise, née en 1946 à Khartoum. L'une des trois premières femmes à intégrer le ministère des Affaires étrangères du Soudan après avoir obtenu un diplôme en économie et en sciences politiques à l'université de Khartoum, elle a été limogée sous Omar el-Béchir et a vécu en exil au Maroc où elle a travaillé comme consultante pour des organisations internationales, avant de devenir la première femme ministre des Affaires étrangères du Soudan au sein du cabinet de transition d'Abdalla Hamdok (septembre 2019 – juillet 2020)."
  tr: "1946 yılında Hartum'da doğmuş Sudanlı bir diplomat; Hartum Üniversitesi'nden ekonomi ve siyaset bilimi alanlarından mezun olduktan sonra Sudan Dışişleri Bakanlığı'na katılan ilk üç kadından biri. Bashir döneminde görevden alındı ve sürgünde Fas'ta uluslararası kuruluşlara danışmanlık yaptı, ardından Abdullah Hamdok'un geçici hükümetinde (Eylül 2019 – Temmuz 2020) Sudan Dışişleri Bakanlığı'nı görev yapan ilk kadın oldu."
  id: "Seorang diplomat Sudan yang lahir pada tahun 1946 di Khartoum; salah satu dari tiga perempuan pertama yang bergabung dengan Kementerian Luar Negeri Sudan setelah lulus dalam bidang ekonomi dan ilmu politik dari Universitas Khartoum. Ia dipecat pada masa Bashir dan hidup dalam pengasingan di Maroko sebagai penasihat organisasi internasional, kemudian menjadi perempuan pertama yang memegang Kementerian Luar Negeri Sudan dalam pemerintahan transisi Abdullah Hamdok (September 2019 – Juli 2020)."
