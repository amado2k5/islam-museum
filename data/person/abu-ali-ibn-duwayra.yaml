summary:
  ar: "شيخ الحنابلة بالبصرة ورئيسهم ومدرّسهم؛ اشتغل عليه أمم وختم عليه القرآن أزيد من ألف إنسان، وكان صالحاً زاهداً ورعاً؛ حدّث بجامع الترمذي بإجازة الحافظ أبي محمد ابن الأخضر؛ توفي بالبصرة وولي بعده التدريس بمدرسته تلميذه نور الدين عبد الرحمن بن عمر البصري {cite:shadharat-dhahab p. 267}."
  en: "Shaykh of Basra's Hanbalis (d. 652) — more than a thousand finished the Qur'an under him; his pupil Nur al-Din Abd al-Rahman al-Basri succeeded him at the madrasa {cite:shadharat-dhahab p. 267}."
  fr: "Shaykh des hanbalites de Bassora (mort en 652) — plus de mille personnes achevèrent le Coran sous sa direction ; son élève Nur al-Din Abd al-Rahman al-Basri lui succéda à la madrasa {cite:shadharat-dhahab p. 267}."
  es: "Shaykh de los Hanbalis de Basora (m. 652): más de mil terminaron el Corán bajo su tutela; su discípulo Nur al-Din Abd al-Rahman al-Basri le sucedió en la madrasa {cite:shadharat-dhahab p. 267}."
  ur: "بصرہ کے شیخ حنبلی ⁦(متوفی 652)⁩ - ایک ہزار سے زیادہ نے ان کے ماتحت قرآن ختم کیا۔ ان کے شاگرد نورالدین عبد الرحمن البصری نے مدرسہ میں ان کی جگہ لی۔ 267}۔"
  tr: "Basra'daki Hanbeli Şeyhi, liderleri ve öğretmenleriydi; milletler onun yanında eğitim gördü ve binden fazla kişi onun rehberliğinde Kur'an tilavetini tamamladı. O, salih, zühd sahibi ve takva sahibiydi; Hafız Ebu Muhammed İbn el-Ehdar'ın izniyle Cami' el-Tirmizi'de rivayet etti; Basra'da vefat etti ve ondan sonra öğrencisi Nur el-Din Abdülrahman İbn Ömer el-Basri, okulunda öğretim görevini devraldı. {Kaynak: Şadharat-Dhaba, s. 267}"
  id: "Syekh mazhab Hanbali di Basra, pemimpin dan guru mereka; banyak bangsa belajar di bawah bimbingannya dan lebih dari seribu orang menyelesaikan hafalan Al-Qur'an di bawah bimbingannya. Beliau adalah orang yang saleh, laku asketis, dan taat; beliau meriwayatkan dalam Jami' al-Tirmidhi dengan izin Hafiz Abu Muhammad Ibn al-Akhdar; beliau wafat di Basra dan setelahnya muridnya Nur al-Din Abd al-Rahman Ibn Umar al-Basri mengambil alih pengajaran di sekolahnya {cite:shadharat-dhahab p. 267}."
