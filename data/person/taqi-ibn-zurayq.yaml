summary:
  ar: "الشيخ التقي ابن زريق الدمشقي الشافعي ولد سنة سبع وثلاثين وثمانمائة، واشتغل بعمل مدرسة جولاق بعد تمامها فكان أول من جلس فيه، وولي مشيخة الزوايا ونظره والحسبة ودرس وتدرس في زمانه وكثر نقله وتوفي بدمشق سنة سبع عشرة وتسعمائة {cite:shadharat-dhahab p. 468}."
  en: "Damascene Shafi'i (b. 837) — first to sit teaching at the Jawlaq madrasa upon its completion, held the zawiya mashyakha and the hisba, 'profuse in transmission'; d. Damascus 917 {cite:shadharat-dhahab p. 468}."
