summary:
  ar: "قارئ قرآن يمني يحمل الجنسية الإماراتية، وُلد في جدة سنة 1395هـ/1975م. حفظ القرآن في السابعة عشرة في مساجد جدة، وأمَّ في مساجد عدة في السعودية، وهو الآن إمام جامع الشيخ زايد في الإمارات؛ ويُعرف أيضًا بالنشيد الإسلامي."
  en: "Yemeni Qur'an reciter holding Emirati nationality, born in Jeddah in 1395 AH / 1975 CE. He memorised the Qur'an at seventeen in Jeddah's mosques, served as imam in a series of mosques in Saudi Arabia, and is currently imam of the Sheikh Zayed Mosque in the United Arab Emirates; he is also known for Islamic nasheed."
  ur: "یمنی قاریِ قرآن، جو اماراتی شہریت رکھتے ہیں اور 1395ھ/1975ء میں جدہ میں پیدا ہوئے۔ انھوں نے سترہ سال کی عمر میں جدہ کی مساجد میں قرآن حفظ کیا، سعودی عرب کی کئی مساجد میں امامت کی، اور اب متحدہ عرب امارات میں جامع شیخ زاید کے امام ہیں؛ وہ اسلامی نشید کے لیے بھی معروف ہیں۔"
