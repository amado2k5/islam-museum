summary:
  ar: "عماد الدين أبو الفداء إسماعيل بن عمر بن كثير بن ضوء القرشي البصروي ثم الدمشقي، الإمام المفسر المحدث الواعظ الفقيه صاحب «البداية والنهاية»؛ ولد سنة سبعمائة أو بعدها بيسير في قرية من أعمال بصرى الشام، ونشأ بدمشق ولازم المزي وصاهره على ابنته زينب، وأخذ عن ابن تيمية فامتلأ بحبه وامتُحن بسببه، وجمع التفسير والتاريخ و«طبقات الشافعية» وشرع في شرح البخاري، وتوفي يوم الخميس سادس عشر شعبان سنة ٧٧٤هـ بدمشق عن أربع وسبعين سنة {cite:durar-kamina-jil-1993 1/374} {cite:suluk-maqrizi j.3 q.1 p. 208} {cite:al-aalam 1/112-113}."
  en: "'Imad al-Din Abu l-Fida' Isma'il ibn 'Umar ibn Kathir ibn Daw' al-Qurashi al-Busrawi then al-Dimashqi, the imam, mufassir, muhaddith, preacher and jurist of al-Bidaya wa'l-Nihaya; born in 700 or shortly after in a village of the Busra al-Sham district, raised at Damascus, he kept close to al-Mizzi and married his daughter Zaynab, took from Ibn Taymiyya and was tried on his account, compiled the Tafsir, the history and the Tabaqat al-Shafi'iyya and began a Sharh al-Bukhari; he died on Thursday 16 Sha'ban 774 at Damascus, aged seventy-four {cite:durar-kamina-jil-1993 1/374} {cite:suluk-maqrizi j.3 q.1 p. 208} {cite:al-aalam 1/112-113}."
  ur: "عماد الدین ابوالفدا اسماعیل بن عمر بن کثیر بن ضوء قرشی بصروی و بعد میں دمشقی — امام، مفسر، محدث، واعظ اور فقیہ، «البدایہ والنہایہ» کے مصنف؛ سنہ 700 یا اس کے کچھ بعد بصریٰ الشام کے ضلع کے ایک گاؤں میں پیدا ہوئے، دمشق میں پلے، مزی کے ہاں تلمذ اختیار کیا اور ان کی بیٹی زینب سے نکاح کیا، ابن تیمیہ سے علم لیا اور ان کی وجہ سے آزمائش اٹھائی، تفسیر، تاریخ اور «طبقات الشافعیہ» مرتب کیں اور شرح بخاری کا آغاز کیا؛ جمعرات 16 شعبان 774ھ کو دمشق میں چوہتر برس کی عمر میں فوت ہوئے {cite:durar-kamina-jil-1993 1/374} {cite:suluk-maqrizi j.3 q.1 p. 208} {cite:al-aalam 1/112-113}۔"
