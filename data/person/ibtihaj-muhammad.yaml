summary:
  ar: "مبارزة أمريكية بالسيف (السابر) وكاتبة ورائدة أعمال، وُلدت سنة 1985 في نيوجيرسي، فازت مع فريق الولايات المتحدة بذهبية بطولة العالم 2014، وفي أولمبياد ريو 2016 أصبحت أول أمريكية تنافس في الأولمبياد مرتدية الحجاب وأول مسلمة أمريكية تفوز بميدالية أولمبية، إذ نالت برونزية فرق السابر."
  en: "American sabre fencer, author and entrepreneur, born in New Jersey in 1985. She won World Championship team gold in 2014, and at the Rio 2016 Olympics became the first American woman to compete at the Olympics in hijab and the first Muslim American woman to win an Olympic medal, taking bronze in the women's team sabre."
  ur: "امریکی سیبر شمشیر باز، مصنفہ اور کاروباری خاتون، جو 1985 میں نیو جرسی میں پیدا ہوئیں۔ انہوں نے 2014 میں عالمی ٹیم طلائی تمغا جیتا، اور ریو 2016 اولمپکس میں اولمپکس میں حجاب پہن کر حصہ لینے والی پہلی امریکی خاتون اور اولمپک تمغا جیتنے والی پہلی مسلم امریکی خاتون بنیں، جب انہوں نے خواتین کی ٹیم سیبر میں کانسی کا تمغا حاصل کیا۔"
