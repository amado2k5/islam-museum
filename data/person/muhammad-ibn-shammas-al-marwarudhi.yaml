summary:
  ar: "محمد بن أحمد بن حميد بن نعيم بن شماس المروروذي، توفي سنة 282 هـ بحسب ما ذكره الكتاب. سمع من عفان بن مسلم وسليمان بن حرب وعبد الصمد بن حسان وزكريا بن عدي، وروى عنه أحمد بن كامل القاضي وابن خزيمة. ذكره أبو بكر الخلال فقال: روى عن أبي عبد الله مسائل لم تقع إلى غيره، ثقة من أهل مرو الروذ. من تصانيفه «مسائل ابن شماس» عن الإمام أحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15419}"
  en: "Muhammad ibn Ahmad ibn Hamid ibn Na'im ibn Shammas al-Marwarudhi, who died in 282 AH as the book gives. He heard from Affan ibn Muslim, Sulayman ibn Harb, Abd al-Samad ibn Hassan and Zakariyya ibn Adi; Ahmad ibn Kamil the judge and Ibn Khuzayma transmitted from him. Abu Bakr al-Khallal says he related questions from Abu Abd Allah (Ahmad) that reached no one else, and was trustworthy among the people of Marw al-Rudh. His work is the Masa'il of Ibn Shammas, questions from Imam Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15419}"
  es: "Muhammad ibn Ahmad ibn Hamid ibn Na'im ibn Shammas al-Marwarudhi, quien murió en el año 282 de la Hégira, según el libro. Recibió enseñanzas de Affan ibn Muslim, Sulayman ibn Harb, Abd al-Samad ibn Hassan y Zakariyya ibn Adi; Ahmad ibn Kamil, el juez, e Ibn Khuzayma transmitieron de él. Abu Bakr al-Khallal afirma que transmitió preguntas de Abu Abd Allah (Ahmad) que no llegaron a nadie más y que eran fidedignas entre la gente de Marw al-Rudh. Su obra es el Masa'il de Ibn Shammas, preguntas del Imam Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15419}"
  fr: "Muhammad ibn Ahmad ibn Hamid ibn Na'im ibn Shammas al-Marwarudhi, décédé en 282 AH, selon l'ouvrage, reçut des enseignements d'Affan ibn Muslim, Sulayman ibn Harb, Abd al-Samad ibn Hassan et Zakariyya ibn Adi; le juge Ahmad ibn Kamil et Ibn Khuzayma les lui transmirent. Abu Bakr al-Khallal rapporte qu'il transmit des questions d'Abu Abd Allah (Ahmad) restées secrètes et qu'il était digne de confiance parmi les habitants de Marw al-Rudh. Son œuvre est le Masa'il d'Ibn Shammas, recueil de questions de l'imam Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15419}"
  ur: "محمد بن احمد بن حمید بن نعیم ابن شماس المروضی، جن کی وفات 282 ہجری میں ہوئی جیسا کہ کتاب بتاتی ہے۔ انہوں نے عفان بن مسلم، سلیمان بن حرب، عبد الصمد بن حسن اور زکریا بن عدی سے سنا۔ احمد بن کامل قاضی اور ابن خزیمہ نے ان سے روایت کی ہے۔ ابوبکر الخلال کہتے ہیں کہ انہوں نے ابو عبد اللہ ⁦(احمد)⁩ سے ایسے سوالات بیان کیے جو کسی اور تک نہیں پہنچے اور مرو الرض کے لوگوں میں ثقہ تھے۔ ان کا تصنیف ابن شماس کی مساعیل ہے، امام احمد کے سوالات۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 15419}"
  tr: "Muhammed ibn Ahmed ibn Humayd ibn Nu'aym ibn Shammas al-Marwudhi, kitabın belirttiğine göre 282 Hicri yılında öldü. Affan ibn Muslim, Sulayman ibn Harb, Abd al-Samad ibn Hassan, Zakeriye ibn 'Adi'den dinledi ve Ahmed ibn Kamil al-Qadi ile Ibn Khuzaymah tarafından ondan rivayet edildi. Abu Bakr al-Khallal onu şöyle andı: Ebu Abdullah'tan kimsenin aklına gelmeyen, Marw al-Rudh halkından güvenilir olan meseleleri anlattı. Eserleri arasında İmam Ahmad'dan \"Masa'il Ibn Shamas\" da bulunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15419}"
  id: "Muhammad ibn Ahmad ibn Humayd ibn Nu'aym ibn Shammas al-Marwudhi, wafat pada tahun 282 H menurut apa yang disebutkan dalam kitab tersebut. Ia mendengar dari Affan ibn Muslim, Sulayman ibn Harb, Abd al-Samad ibn Hassan, Zakariya ibn 'Adi, dan diceritakan darinya oleh Ahmad ibn Kamil al-Qadi dan Ibn Khuzaymah. Abu Bakr al-Khallal menyebutkannya, mengatakan: Ia menceritakan dari Abu Abdullah isu-isu yang tidak terpikir oleh orang lain, yang dapat dipercaya oleh masyarakat Marw al-Rudh. Di antara karyanya adalah \"Masa'il Ibn Shamas\" dari Imam Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15419}"
