  en: "Muhammad ibn Ahmad al-Marwarudhi (Ibn Shammas)"
summary:
  ar: "محمد بن أحمد بن حميد بن نعيم بن شماس المروروذي، توفي سنة 282 هـ بحسب ما ذكره الكتاب. سمع من عفان بن مسلم وسليمان بن حرب وعبد الصمد بن حسان وزكريا بن عدي، وروى عنه أحمد بن كامل القاضي وابن خزيمة. ذكره أبو بكر الخلال فقال: روى عن أبي عبد الله مسائل لم تقع إلى غيره، ثقة من أهل مرو الروذ. من تصانيفه «مسائل ابن شماس» عن الإمام أحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15419}"
  en: "Muhammad ibn Ahmad ibn Hamid ibn Na'im ibn Shammas al-Marwarudhi, who died in 282 AH as the book gives. He heard from Affan ibn Muslim, Sulayman ibn Harb, Abd al-Samad ibn Hassan and Zakariyya ibn Adi; Ahmad ibn Kamil the judge and Ibn Khuzayma transmitted from him. Abu Bakr al-Khallal says he related questions from Abu Abd Allah (Ahmad) that reached no one else, and was trustworthy among the people of Marw al-Rudh. His work is the Masa'il of Ibn Shammas, questions from Imam Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15419}"
