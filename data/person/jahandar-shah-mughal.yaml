  id: "Kartu pendahuluan Jahandar Shah, kaisar Mughal kedelapan, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam karya Hasan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
