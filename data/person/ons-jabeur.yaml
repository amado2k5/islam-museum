summary:
  ar: "لاعبة تنس تونسية، وُلدت في قصر هلال سنة 1994. بلغت التصنيف الثاني عالميا في يونيو 2022 وهو أعلى تصنيف حققه أي لاعب أو لاعبة من أفريقيا أو العرب في تاريخ تصنيفي رابطة المحترفات ورابطة المحترفين، وخاضت ثلاث نهائيات في البطولات الكبرى ⁦(ويمبلدون 2022 و2023 وأمريكا المفتوحة 2022)⁩ فكانت أول امرأة أفريقية وعربية تبلغ نهائي فردي في بطولة كبرى، وفازت بخمسة ألقاب فردية في جولة المحترفات منها بطولة مدريد 2022 من فئة الألف نقطة. تلقَّب في تونس بـ«وزيرة السعادة»، وأعلنت في يوليو 2025 توقفا مفتوحا عن التنس ثم أعلنت حملها الأول في نوفمبر 2025."
  en: "Tunisian professional tennis player, born in Ksar Hellal in 1994. She reached a career-high singles ranking of world No. 2 in June 2022, the highest ranking achieved by any African or Arab player in WTA or ATP history, and contested three major singles finals (Wimbledon in 2022 and 2023, the US Open in 2022) as the first African and Arab woman to reach a major singles final. She has won five WTA singles titles, including the 2022 Madrid Open, a WTA 1000 event. Known in Tunisia as the 'Minister of Happiness', she announced an indefinite break from tennis in July 2025 and her first pregnancy in November 2025."
  ur: "تیونس کی پیشہ ور ٹینس کھلاڑی، جو 1994 میں قصر ہلال میں پیدا ہوئیں۔ وہ جون 2022 میں عالمی نمبر 2 تک پہنچیں، جو کسی افریقی یا عرب کھلاڑی کا بلند ترین درجہ ہے، اور تین بڑے سنگلز فائنل کھیلے ⁦(ومبلڈن 2022 اور 2023، یو ایس اوپن 2022)⁩ — کسی بڑے سنگلز فائنل تک پہنچنے والی پہلی افریقی اور عرب خاتون۔ انھوں نے پانچ ڈبلیو ٹی اے سنگلز خطاب جیتے، جن میں 2022 کا میڈرڈ اوپن بھی شامل ہے، اور تیونس میں انھیں ”وزیرِ سعادت“ کہا جاتا ہے۔"
  es: "Tenista profesional tunecina, nacida en Ksar Hellal en 1994. Alcanzó el puesto número 2 del ranking mundial en individuales en junio de 2022, el más alto logrado por una jugadora africana o árabe en la historia de la WTA o la ATP, y disputó tres finales de Grand Slam (Wimbledon en 2022 y 2023, y el US Open en 2022), convirtiéndose en la primera mujer africana y árabe en llegar a una final de Grand Slam. Ha ganado cinco títulos de la WTA, incluyendo el Mutua Madrid Open 2022, un torneo WTA 1000. Conocida en Túnez como la \"Ministra de la Felicidad\", anunció un descanso indefinido del tenis en julio de 2025 y su primer embarazo en noviembre de 2025."
  fr: "Joueuse de tennis professionnelle tunisienne, née à Ksar Hellal en 1994. Elle a atteint le 2e rang mondial en simple en juin 2022, le meilleur classement de sa carrière, un record pour une joueuse africaine ou arabe dans l'histoire de la WTA et de l'ATP. Elle a disputé trois finales de Grand Chelem en simple (Wimbledon en 2022 et 2023, l'US Open en 2022), devenant ainsi la première femme africaine et arabe à atteindre une finale de Grand Chelem en simple. Elle a remporté cinq titres WTA en simple, dont le Masters de Madrid 2022, un tournoi WTA 1000. Surnommée la « Ministre du Bonheur » en Tunisie, elle a annoncé une pause indéterminée dans sa carrière en juillet 2025 et sa première grossesse en novembre 2025."
  tr: "1994 yılında Ksar Hellal'da doğan Tunuslu bir tenisçi. Haziran 2022'de ikinci dünya sıralamasına yükseldi; bu, Kadınlar Profesyonel Ligi ve ATP sıralamalarında Afrika veya Arap dünyasından herhangi bir oyuncunun elde ettiği en yüksek sıralamadır. Üç Grand Slam finalinde (Wimbledon 2022, 2023 ve ABD Açık 2022) mücadele etti, büyük bir turnuvada tekler finaline ulaşan ilk Afrikalı ve Arap kadın oldu ve profesyonel turda 2022 Madrid 1000 sayı turnuvası da dahil olmak üzere beş tekler şampiyonluğu kazandı. Tunus'ta 'Mutluluk Bakanı' lakabını almış, Temmuz 2025'te tenisten açık emekliliğini açıklamış ve Kasım 2025'te ilk hamileliğini açıklamıştır."
  id: "Seorang pemain tenis Tunisia, lahir di Ksar Hellal pada tahun 1994. Ia mencapai peringkat dunia kedua pada Juni 2022, peringkat tertinggi yang dicapai oleh pemain dari Afrika atau dunia Arab dalam sejarah Liga Profesional Wanita dan peringkat ATP. Ia telah berkompetisi di tiga final Grand Slam (Wimbledon 2022, 2023, dan US Open 2022), menjadi wanita Afrika dan Arab pertama yang mencapai final tunggal di turnamen besar, dan telah memenangkan lima gelar tunggal di tur profesional, termasuk turnamen Madrid 1000 poin 2022. Ia dijuluki 'Menteri Kebahagiaan' di Tunisia, mengumumkan pensiun terbuka dari tenis pada Juli 2025, dan kemudian mengumumkan kehamilan pertamanya pada November 2025."
