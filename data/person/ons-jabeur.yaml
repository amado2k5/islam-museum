summary:
  ar: "لاعبة تنس تونسية، وُلدت في قصر هلال سنة 1994. بلغت التصنيف الثاني عالميا في يونيو 2022 وهو أعلى تصنيف حققه أي لاعب أو لاعبة من أفريقيا أو العرب في تاريخ تصنيفي رابطة المحترفات ورابطة المحترفين، وخاضت ثلاث نهائيات في البطولات الكبرى (ويمبلدون 2022 و2023 وأمريكا المفتوحة 2022) فكانت أول امرأة أفريقية وعربية تبلغ نهائي فردي في بطولة كبرى، وفازت بخمسة ألقاب فردية في جولة المحترفات منها بطولة مدريد 2022 من فئة الألف نقطة. تلقَّب في تونس بـ«وزيرة السعادة»، وأعلنت في يوليو 2025 توقفا مفتوحا عن التنس ثم أعلنت حملها الأول في نوفمبر 2025."
  en: "Tunisian professional tennis player, born in Ksar Hellal in 1994. She reached a career-high singles ranking of world No. 2 in June 2022, the highest ranking achieved by any African or Arab player in WTA or ATP history, and contested three major singles finals (Wimbledon in 2022 and 2023, the US Open in 2022) as the first African and Arab woman to reach a major singles final. She has won five WTA singles titles, including the 2022 Madrid Open, a WTA 1000 event. Known in Tunisia as the 'Minister of Happiness', she announced an indefinite break from tennis in July 2025 and her first pregnancy in November 2025."
  ur: "تیونس کی پیشہ ور ٹینس کھلاڑی، جو 1994 میں قصر ہلال میں پیدا ہوئیں۔ وہ جون 2022 میں عالمی نمبر 2 تک پہنچیں، جو کسی افریقی یا عرب کھلاڑی کا بلند ترین درجہ ہے، اور تین بڑے سنگلز فائنل کھیلے (ومبلڈن 2022 اور 2023، یو ایس اوپن 2022) — کسی بڑے سنگلز فائنل تک پہنچنے والی پہلی افریقی اور عرب خاتون۔ انھوں نے پانچ ڈبلیو ٹی اے سنگلز خطاب جیتے، جن میں 2022 کا میڈرڈ اوپن بھی شامل ہے، اور تیونس میں انھیں ”وزیرِ سعادت“ کہا جاتا ہے۔"
