summary:
  ar: "أبو غسان رجاء بن صهيب الجروانى، أحد المعرضين عن الدنية الراحلين عنها. كان يقول: نعم الدار الدنيا طريقًا إلى الجنة، ومن اتخذ الدنيا طريقًا لم يمرج على ما فيها، فالدنيا طريق الأكياس، غنموا فيها النفوس ورحلوا بها عنها."
  en: "Abu Ghassan Raja' ibn Suhayb al-Jurwani, one of those who turned away from the base world and left it. He used to say: how good a house the world is as a road to Paradise; whoever takes the world as a road does not stop at what is in it; the world is the road of the wise, who gained their souls in it and departed from it."
  ur: "ابو غسان رجاء بن صہیب جروانی، ان لوگوں میں سے جنہوں نے گھٹیا دنیا سے منہ موڑا اور اسے چھوڑ کر چلے گئے۔ وہ کہا کرتے: دنیا جنت کی طرف جانے کا کیا اچھا راستہ ہے؛ جو دنیا کو راستہ بنائے وہ اس کی چیزوں پر نہیں رکتا؛ دنیا دانا لوگوں کا راستہ ہے، جنہوں نے اس میں اپنی جانیں کمائیں اور اسے چھوڑ کر چلے گئے۔"
