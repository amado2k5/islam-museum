id: person/khalil-al-fatimi
class: person
label: { ar: "خليل عامل القيروان" }
summary:
  ar: "عامل المهدي على القيروان؛ لما نزل أبو يزيد شرق رقادة في مائة ألف مقاتل لم يلتفت إليه خليل ولا يبالي به وأمر أن لا يخرج أحد لقتاله منتظراً وصول ميسور، فزحف أبو يزيد وانهزم أهل القيروان وخرج خليل متكارهاً من باب تونس فدخل أبو يزيد القيروان ونزل بداره وحُصر خليل في داره ثم حُمل إلى أبي يزيد فقتله {cite:kamil-ibn-al-athir p. 316-317}."
  en: "The Fatimid governor of Qayrawan who disdained Abu Yazid's hundred thousand until the city broke; dragged from his own house to Abu Yazid and killed {cite:kamil-ibn-al-athir p. 316-317}."
  es: "El gobernador fatimí de Qayrawan, que despreció a los cien mil hombres de Abu Yazid hasta que la ciudad se derrumbó, fue arrastrado desde su propia casa hasta Abu Yazid y asesinado {cite:kamil-ibn-al-athir p. 316-317}."
  fr: "Le gouverneur fatimide de Qayrawan qui a méprisé les cent mille d'Abu Yazid jusqu'à ce que la ville s'effondre; traîné de sa propre maison à Abu Yazid et tué {cite:kamil-ibn-al-athir p. 316-317}."
  ur: "قیروان کا فاطمی گورنر جس نے ابو یزید کے لاکھوں لوگوں کو اس وقت تک حقیر سمجھا جب تک کہ شہر ٹوٹ گیا۔ اپنے گھر سے گھسیٹ کر ابو یزید کے پاس لے گئے اور قتل کر دیا۔ 316-317}۔"
