id: person/muadha-al-adawiyya
class: person
label: { ar: "معاذة بنت عبد الله العدوية", en: "Mu'adha bint Abd Allah al-Adawiyya", ur: "معاذہ بنت عبد اللہ العدویہ" }
gender: female
roles: [mystic]
summary:
  ar: "معاذة بنت عبد الله العدوية، أم الصهباء، عابدة تابعية من البصرة، زوجة صلة بن أشيم؛ أدركت عائشة وروت عنها، وروى عنها الحسن البصري وأبو قلابة ويزيد الرشك، ويروي ابن الجوزي في «صفة الصفوة» شدة اجتهادها وصبرها يوم قُتل زوجها وابنها."
  en: "Mu'adha bint Abd Allah al-Adawiyya, Umm al-Sahba', a Successor and ascetic of Basra and wife of Sila ibn Ashyam; she met Aisha and transmitted from her, and al-Hasan al-Basri, Abu Qilaba and Yazid al-Rishk transmitted from her. Ibn al-Jawzi's Sifat al-Safwa records her night vigils and her composure when her husband and son were killed."
  ur: "معاذہ بنت عبد اللہ العدویہ، ام الصہباء، بصرہ کی ایک تابعی عابدہ اور صلہ بن اشیم کی اہلیہ؛ انہوں نے عائشہ کو پایا اور ان سے روایت کی، اور ان سے حسن بصری، ابو قلابہ اور یزید الرشک نے روایت کی۔ ابن الجوزی کی «صفۃ الصفوہ» ان کی شب بیداری اور شوہر و بیٹے کی شہادت پر ان کے صبر کا ذکر کرتی ہے۔"
died: { edtf: "0702", hijri: "0083", calendar: julian, precision: year, status: tradition, derived: true, note: "يحيل محقق صفة الصفوة في ترجمتها إلى المنتظم لابن الجوزي تحت سنة 83هـ {cite:sifat-al-safwa-tartusi-2012 p.704}.", sources: [source/sifat-al-safwa-tartusi-2012] }
