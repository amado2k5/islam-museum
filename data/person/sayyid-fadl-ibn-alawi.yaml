summary:
  ar: "عالم وزعيم ديني وسياسي (1824-1900) من السادة الحضارم الباعلوي، وُلد في مامبورام بمالابار في جنوب الهند لأب صوفي مهاجر من حضرموت، وخلف والده سنة 1844 في قيادة الطريقة العلوية ومسلمي مالابار. اتهمته السلطات البريطانية بتحريض ثورات المابيلا ففرّ سنة 1853 إلى مكة بعد أمر باعتقاله، ولم يُسمح له بالعودة قط. جاب بعدها الحجاز ومصر، وصار واليا على ظفار في جنوب الجزيرة العربية (1876-1879)، ثم انتقل إلى إسطنبول فصار من وجهاء بلاط السلطان عبد الحميد الثاني ولُقّب بفضل باشا، وكتب في السياسة الشرعية والتصوف، ومن أشهر كتبه «عدة الأمراء والحكام»، وتوفي في إسطنبول."
  en: "Scholar, religious and political leader (1824–1900) of the Hadrami Ba Alawi sayyids, born at Mampuram in Malabar, south India, to a Sufi father who had migrated from Hadramawt; in 1844 he succeeded his father as leader of the Alawiyya order and of the Muslims of Malabar. The British accused him of instigating the Mappila revolts, and in 1853, faced with an order for his arrest, he escaped to Mecca and was never allowed to return. He afterwards travelled in the Hijaz and Egypt, became governor of Dhofar in southern Arabia (1876–1879), then settled in Istanbul as a dignitary at the court of Sultan Abdulhamid II with the title Fadl Pasha, wrote on politics, law and spirituality — his best-known work is the Uddat al-Umara wa-l-Hukkam — and died in Istanbul."
  ur: "حضرمی باعلوی سادات کے عالم اور دینی و سیاسی رہنما (1824ء–1900ء) جو جنوبی ہندوستان کے مالابار کے مامپورم میں ایک صوفی مہاجر والد کے گھر پیدا ہوئے اور 1844ء میں اپنے والد کے جانشین کے طور پر سلسلہ علویہ اور مالابار کے مسلمانوں کے رہنما بنے۔ برطانوی حکومت نے ان پر ماپلا بغاوتوں کی تحریک کا الزام لگایا، تو 1853ء میں گرفتاری کے حکم کے بعد وہ مکہ فرار ہو گئے اور پھر کبھی واپس نہ آ سکے۔ بعد ازاں وہ حجاز اور مصر میں رہے، جنوبی عرب کے ظفار کے والی بنے (1876ء–1879ء)، پھر استنبول جا کر سلطان عبدالحمید ثانی کے دربار کے معززین میں شامل ہوئے اور فضل پاشا کا لقب پایا، سیاست و تصوف پر کتابیں لکھیں جن میں «عدۃ الامراء والحکام» مشہور ہے، اور استنبول ہی میں وفات پائی۔"
