  note: "Died at Istanbul in October 1900: Abu-Manneh gives Istanbul, October 1900, and expressly rejects the stray death years 1844 and 1866 in some reference works; Jacob's monograph likewise gives d. 1900, and a funeral at the Hagia Sophia mosque on 26 October 1900 is reported in the secondary literature. The English Wikipedia article and Randathani give 1901, from the Hijri year 1318, which runs from May 1900 to May 1901; October 1900 falls within 1318 (Jumada al-Akhira), so the Hijri year is not in dispute, only its Gregorian rendering. The Hijri year (1318) is derived by tabular conversion and agrees with the sources' own pairing."
