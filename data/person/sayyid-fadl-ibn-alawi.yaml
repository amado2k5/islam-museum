  note: "Born at Mampuram (Mambram) in Malabar in 1824: Abu-Manneh gives the year expressly, Jacob's monograph title dates agree, and Randathani pairs 1240/1824. The English Wikipedia article gives only circa 1820, and no source gives a day or month. The Hijri year (1239) follows the convention of the year in which the Gregorian year began (1 January 1824 falls in Jumada al-Ula 1239); Randathani's pairing gives 1240, the difference being the usual year-boundary effect. Mampuram has no place entity in the museum yet, so no born_in relation is written."
