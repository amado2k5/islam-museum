    basis: documented
    note: "His place in the Alawiyya Sufi order is attested of him personally, not only of his family, by two independent academic sources. (1) Abu-Manneh: his father had succeeded as leader of the Alawiyya in Malabar, Fadl was trained in Alawiyya principles, and on his father's death in 1844 Fadl himself succeeded to that leadership and to the leadership of Malabar's Muslim community. (2) Jacob's monograph: Fadl was a renowned Sufi scholar, formed in the Ba Alawi Sufi pathway that his family's tradition carried across the Indian Ocean. No second segment is recorded: the Ba Alawi are a Sunni, Shafi'i tradition in general, but no two independent sources fetched attest a Sunni or Shafi'i affiliation for Fadl personally — his own books on the Shafi'i and Hanafi schools are works about those schools, not attestations of his adherence — so under the two-source rule and the doubt rule no sunni value is added, and the Shafi'i connection is stated here only."
    sources: [source/abu-manneh-sayyid-fadl-pasha, source/jacob-for-god-or-empire-2019]
