summary:
  ar: "عبد الحق بن محمد بن هارون، أبو محمد السهمي القرشي الصقلي، فقيه من أعيان المالكية تعلم في صقلية وحج مرتين ولقي إمام الحرمين الجويني بمكة سنة 450 هـ، وله «تهذيب المطالب» في شرح المدونة، وتوفي بالإسكندرية سنة 466 هـ ⁦(1073 م)⁩ بحسب الأعلام."
  en: "Abd al-Haqq ibn Muhammad ibn Harun, Abu Muhammad al-Sahmi al-Qurashi al-Siqilli, a notable Maliki jurist educated in Sicily who made the pilgrimage twice and met Imam al-Haramayn al-Juwayni in Mecca in 450 AH; author of Tahdhib al-Matalib, a commentary on the Mudawwana; died in Alexandria in 466 AH (1073 CE according to al-A'lam)."
