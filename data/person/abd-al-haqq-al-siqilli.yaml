summary:
  ar: "عبد الحق بن محمد بن هارون، أبو محمد السهمي القرشي الصقلي، فقيه من أعيان المالكية تعلم في صقلية وحج مرتين ولقي إمام الحرمين الجويني بمكة سنة 450 هـ، وله «تهذيب المطالب» في شرح المدونة، وتوفي بالإسكندرية سنة 466 هـ ⁦(1073 م)⁩ بحسب الأعلام."
  en: "Abd al-Haqq ibn Muhammad ibn Harun, Abu Muhammad al-Sahmi al-Qurashi al-Siqilli, a notable Maliki jurist educated in Sicily who made the pilgrimage twice and met Imam al-Haramayn al-Juwayni in Mecca in 450 AH; author of Tahdhib al-Matalib, a commentary on the Mudawwana; died in Alexandria in 466 AH (1073 CE according to al-A'lam)."
  fr: "Abd al-Haqq ibn Muhammad ibn Harun, Abu Muhammad al-Sahmi al-Qurashi al-Siqilli, juriste malikite notable formé en Sicile, qui fit deux fois le pèlerinage et rencontra l'imam al-Haramayn al-Juwayni à La Mecque en 450 H ; auteur du Tahdhib al-Matalib, commentaire de la Mudawwana ; mort à Alexandrie en 466 H (1073 ap. J.-C. selon al-A'lam)."
  es: "Abd al-Haqq ibn Muhammad ibn Harun, Abu Muhammad al-Sahmi al-Qurashi al-Siqilli, un notable jurista Maliki educado en Sicilia que hizo la peregrinación dos veces y conoció al Imam al-Haramayn al-Juwayni en La Meca en 450 AH; autor de Tahdhib al-Matalib, un comentario sobre el Mudawwana; Murió en Alejandría en 466 d. H. (1073 d. C. según al-A'lam)."
  ur: "عبد الحق بن محمد بن ہارون، ابو محمد السہمی القرشی السقلی، سسلی میں تعلیم یافتہ ایک قابل ذکر مالکی فقیہ جس نے دو بار زیارت کی اور 450 ہجری میں مکہ میں امام الحرمین الجوینی سے ملاقات کی۔ تہذیب المطلب کے مصنف، مدوانہ کی تفسیر؛ اسکندریہ میں 466ھ ⁦(الاعلام کے مطابق 1073ء)⁩ میں وفات پائی۔"
  tr: "Maliki mezhebinin önde gelenlerinden bir hukukçu olan Abdül-Haqk ibn Muhammed ibn Harun, Ebu Muhammed el-Sahmi el-Kureşi el-Siqilli, Sicilya'da eğitim görmüş, iki kez Hac yapmış ve Hicri 450 yılında Mekke'de İmam el-Haramayn el-Cüveyni ile görüşmüştür. Mudavvana'nın açıklaması üzerine \"Tahdhib el-Matalib\" adlı eseri kaleme almış ve bayraklara göre Hicri 466 yılında (Miladi 1073) İskenderiye'de vefat etmiştir."
  id: "Abd al-Haqq ibn Muhammad ibn Harun, Abu Muhammad al-Sahmi al-Qurashi al-Siqilli, seorang ahli hukum dari kalangan terkemuka mazhab Maliki, belajar di Sisilia, menunaikan ibadah haji dua kali, dan bertemu dengan Imam al-Haramayn al-Juwayni di Mekah pada tahun 450 H. Beliau menulis kitab “Tahdhib al-Matalib” yang menjelaskan tentang Mudawwana, dan meninggal di Alexandria pada tahun 466 H (1073 M) menurut catatan sejarah."
