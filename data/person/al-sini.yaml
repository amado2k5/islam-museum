label: { ar: "الصيني", en: "Al Sini", fr: "Al Sini", es: "Al Sini", ur: "السینی" }
summary:
  ar: "حبيش بن موسى الصيني صاحب كتاب الأغاني على حروف المعجم ألفه للمتوكل وذكر فيه أشياء من الأغاني لم يذكرها إسحاق ولا عمرو بن بانة وذكر من أسماء المغنين والمغنيات في الجاهلية والإسلام كل طريف غريب، وله كتاب مجردات المغنين {cite:fihrist-ibn-al-nadim p. 448}."
  en: "Author of al-Aghani on alphabetical order for al-Mutawakkil {cite:fihrist-ibn-al-nadim}"
  fr: "Auteur de al-Aghani par ordre alphabétique pour al-Mutawakkil {cite:fihrist-ibn-al-nadim}"
  es: "Autor de al-Aghani sobre el orden alfabético de al-Mutawakkil {cita:fihrist-ibn-al-nadim}"
  ur: "المتوکل کے حروف تہجی کی ترتیب پر الاغانی کے مصنف {حوالہ: فہرست ابن الندیم}"
  tr: "Habish ibn Musa al-Sini, Al-Mutawakkil tarafından yazılan Al-Aghani 'ala Haruf al-Mu'jam adlı kitabın yazarıdır; bu kitapta İshaq veya Amr ibn Banna'nın bahsetmediği bazı şarkılardan bahsetmiştir. İslam öncesi ve İslam dönemindeki erkek ve kadın şarkıcıların isimleri arasında her türlü tuhaf ve eğlenceli şeyler de yer almıştır. Ayrıca 'Mujarradat al-Mughnin' adlı kitabı da yazmıştır {atıf:fihrist-ibn-al-nadim s. 448}."
  id: "Habish ibn Musa al-Sini, penulis buku Al-Aghani 'ala Haruf al-Mu'jam, yang ditulis oleh Al-Mutawakkil, di mana ia menyebutkan beberapa lagu yang tidak disebutkan oleh Ishaq atau Amr ibn Banna. Di antara nama-nama penyanyi pria dan wanita pada periode pra-Islam dan Islam, semua hal aneh dan menghibur disebutkan. Ia juga menulis buku 'Mujarradat al-Mughnin' {cite:fihrist-ibn-al-nadim hlm. 448}."
