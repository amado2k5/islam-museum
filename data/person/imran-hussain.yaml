summary:
  ar: "عمران حسين (وُلد في 7 حزيران 1978 في برادفورد، غرب يوركشاير)، سياسي ومحامٍ بريطاني من حزب العمال، عضو البرلمان عن برادفورد إيست منذ 2015. كان عضوًا في مجلس مدينة برادفورد منذ 2002 ونائبًا لقائد المجلس 2010–2015، وتولى مناصب وزارية ظلّية من 2016، فاستقال من منصبه الظلّي في تشرين الثاني 2023 احتجاجًا على رفض كير ستارمر الدعوة إلى وقف إطلاق النار في غزة، وجلس مستقلًا من تموز 2024 إلى شباط 2025 بعد تعليق سوط الحزب عنه لتصويته لإلغاء حد الطفلين للإعانات."
  en: "Imran Hussain (born 7 June 1978 in Bradford, West Yorkshire) is a British Labour politician and barrister who has been MP for Bradford East since 2015. A Bradford city councillor from 2002 and deputy leader of the council from 2010 to 2015, he held Labour shadow posts from 2016, resigning as a shadow minister in November 2023 over Keir Starmer's refusal to call for a ceasefire in Gaza; he sat as an independent from July 2024 to February 2025 after the whip was suspended over his vote to scrap the two-child benefit cap."
  ur: "عمران حسین (پیدائش 7 جون 1978، بریڈفورڈ، ویسٹ یارکشائر) برطانوی لیبر پارٹی کے سیاست دان اور بیرسٹر ہیں، جو 2015 سے بریڈفورڈ ایسٹ کے رکن پارلیمنٹ ہیں۔ وہ 2002 سے بریڈفورڈ سٹی کونسل کے رکن اور 2010 سے 2015 تک کونسل کے ڈپٹی لیڈر رہے، 2016 سے لیبر کے شیڈو عہدوں پر رہے، نومبر 2023 میں غزہ میں جنگ بندی کے مطالبے سے کیئر اسٹارمر کے انکار پر شیڈو وزیر کے عہدے سے مستعفی ہوئے؛ اور جولائی 2024 سے فروری 2025 تک، دو بچوں کی حد ختم کرنے کے حق میں ووٹ دینے پر پارٹی وہپ معطل ہونے کے بعد، آزاد رکن کی حیثیت سے بیٹھے۔"

