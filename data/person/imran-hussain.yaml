summary:
  ar: "عمران حسين ⁦(وُلد في 7 حزيران 1978 في برادفورد، غرب يوركشاير)⁩، سياسي ومحامٍ بريطاني من حزب العمال، عضو البرلمان عن برادفورد إيست منذ 2015. كان عضوًا في مجلس مدينة برادفورد منذ 2002 ونائبًا لقائد المجلس 2010–2015، وتولى مناصب وزارية ظلّية من 2016، فاستقال من منصبه الظلّي في تشرين الثاني 2023 احتجاجًا على رفض كير ستارمر الدعوة إلى وقف إطلاق النار في غزة، وجلس مستقلًا من تموز 2024 إلى شباط 2025 بعد تعليق سوط الحزب عنه لتصويته لإلغاء حد الطفلين للإعانات."
  en: "Imran Hussain (born 7 June 1978 in Bradford, West Yorkshire) is a British Labour politician and barrister who has been MP for Bradford East since 2015. A Bradford city councillor from 2002 and deputy leader of the council from 2010 to 2015, he held Labour shadow posts from 2016, resigning as a shadow minister in November 2023 over Keir Starmer's refusal to call for a ceasefire in Gaza; he sat as an independent from July 2024 to February 2025 after the whip was suspended over his vote to scrap the two-child benefit cap."
  ur: "عمران حسین ⁦(پیدائش 7 جون 1978، بریڈفورڈ، ویسٹ یارکشائر)⁩ برطانوی لیبر پارٹی کے سیاست دان اور بیرسٹر ہیں، جو 2015 سے بریڈفورڈ ایسٹ کے رکن پارلیمنٹ ہیں۔ وہ 2002 سے بریڈفورڈ سٹی کونسل کے رکن اور 2010 سے 2015 تک کونسل کے ڈپٹی لیڈر رہے، 2016 سے لیبر کے شیڈو عہدوں پر رہے، نومبر 2023 میں غزہ میں جنگ بندی کے مطالبے سے کیئر اسٹارمر کے انکار پر شیڈو وزیر کے عہدے سے مستعفی ہوئے؛ اور جولائی 2024 سے فروری 2025 تک، دو بچوں کی حد ختم کرنے کے حق میں ووٹ دینے پر پارٹی وہپ معطل ہونے کے بعد، آزاد رکن کی حیثیت سے بیٹھے۔"
  es: "Imran Hussain (nacido el 7 de junio de 1978 en Bradford, West Yorkshire) es un político laborista británico y abogado que ha sido diputado por Bradford East desde 2015. Concejal de la ciudad de Bradford desde 2002 y teniente de alcalde de 2010 a 2015, ocupó cargos en la sombra del Partido Laborista desde 2016, dimitiendo como ministro en la sombra en noviembre de 2023 por la negativa de Keir Starmer a pedir un alto el fuego en Gaza; ocupó un escaño como independiente desde julio de 2024 hasta febrero de 2025 después de que se le suspendiera la disciplina de partido por su voto a favor de eliminar el límite de dos hijos en las prestaciones por hijos."
  fr: "Imran Hussain (né le 7 juin 1978 à Bradford, dans le West Yorkshire) est un homme politique travailliste britannique et avocat, député de Bradford East depuis 2015. Conseiller municipal de Bradford à partir de 2002 et chef adjoint du conseil de 2010 à 2015, il a occupé des postes au sein du cabinet fantôme travailliste à partir de 2016, démissionnant de son poste de ministre fantôme en novembre 2023 suite au refus de Keir Starmer d'appeler à un cessez-le-feu à Gaza; il a siégé comme indépendant de juillet 2024 à février 2025 après avoir été suspendu du groupe parlementaire travailliste suite à son vote en faveur de la suppression du plafond de deux allocations familiales."
  tr: "Imran Hussein (7 Haziran 1978, Bradford, West Yorkshire doğumlu) İşçi Partisi'nden Britanyalı bir politikacı ve avukattır ve 2015'ten beri Bradford East milletvekilidir. 2002'den beri Bradford Belediye Meclisi üyesi ve 2010–2015 yılları arasında Konsey Başkan Yardımcısı olarak görev yapmıştır. 2016'dan itibaren gölge bakanlık görevlerinde bulunmuş, Kasım 2023'te Keir Starmer'ın Gazze'de ateşkes çağrısı yapmayı reddetmesine karşı protesto olarak gölge görevinden istifa etmiştir. Temmuz 2024'ten Şubat 2025'e kadar bağımsız olarak görev yaptı; partinin iki çocuk ödeneği sınırının kaldırılması yönünde oy kullanması nedeniyle partinin kamçısı askıya alınmıştır."
  id: "Imran Hussein (lahir 7 Juni 1978 di Bradford, West Yorkshire) adalah seorang politikus dan pengacara Inggris dari Partai Buruh, dan telah menjadi Anggota Parlemen untuk Bradford East sejak 2015. Ia telah menjadi anggota Dewan Kota Bradford sejak 2002 dan Wakil Pemimpin Dewan dari 2010–2015. Ia memegang posisi menteri bayangan sejak 2016, mengundurkan diri dari posisi bayangannya pada November 2023 sebagai protes atas penolakan Keir Starmer untuk menyerukan gencatan senjata di Gaza. Ia duduk sebagai independen dari Juli 2024 hingga Februari 2025 setelah whip partai tersebut ditangguhkan karena suaranya menghapus batas tunjangan dua anak."

