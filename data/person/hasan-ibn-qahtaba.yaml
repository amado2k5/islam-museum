summary:
  ar: "الحسن بن قحطبة من أمراء جنود أهل خراسان؛ عند البلاذري: أغزاه المنصور من حديثة الموصل سنة 149 ثم سار مع العباس بن محمد إلى ملطية فحصار كمخ، وكان في جيش عبد الوهاب بن إبراهيم ببناء ملطية سنة 140 ربما حمل الحجر حتى يناوله البناء وأغدى الناس من ماله بمطابخه حتى كتب فيه عبد الوهاب إلى أبي جعفر فردّ عليه «يا صبيّ يطعم الحسن من ماله وتطعم من مالي» وأذن له في الإطعام دون المنادي، وأغزاه المهدي سنة 162 ساح في بلاد الروم فارتاد موضع مدينة الحدث فكلّم المهدي في بنائها وبناء طرسوس."
  en: "al-Hasan ibn Qahtaba, a commander of the Khurasani armies; in al-Baladhuri: al-Mansur sent him raiding from Hadithat al-Mawsil in year 149, and he went with al-Abbas ibn Muhammad to Malatya and the siege of Kamkh; in Abd al-Wahhab ibn Ibrahim's army at Malatya's building in year 140 he would carry stone to hand the builder and fed the people from his own purse with field-kitchens — Abd al-Wahhab denounced him to Abu Ja'far, who answered 'O boy! al-Hasan feeds from his own money, and you feed from mine' and let him feed without a caller — and al-Mahdi sent him raiding in year 162, when he ranged Byzantine lands, chose the site of Madinat al-Hadath and spoke to al-Mahdi of building it and Tarsus."
  es: "al-Hasan ibn Qahtaba, comandante de los ejércitos de Jorasán; en al-Baladhuri: al-Mansur lo envió a saquear desde Hadithat al-Mawsil en el año 149, y fue con al-Abbas ibn Muhammad a Malatya y al asedio de Kamkh; en el ejército de Abd al-Wahhab ibn Ibrahim en la construcción de Malatya en el año 140, llevaba piedras para entregar al constructor y alimentaba a la gente de su propio bolsillo con cocinas de campaña —Abd al-Wahhab lo denunció a Abu Ja'far, quien respondió: \"¡Oh, muchacho! al-Hasan se alimenta de su propio dinero, y tú te alimentas del mío\" y lo dejó alimentar sin que nadie lo llamara— y al-Mahdi lo envió a saquear en el año 162, cuando recorrió tierras bizantinas, eligió el sitio de Madinat al-Hadath y habló con al-Mahdi sobre la construcción de esta y Tarso."
  fr: "Al-Hasan ibn Qahtaba, commandant des armées du Khorasan, est mentionné dans al-Baladhuri: al-Mansur l’envoya piller Hadithat al-Mawsil en l’an 149, et il accompagna al-Abbas ibn Muhammad à Malatya et au siège de Kamkh. Dans l’armée d’Abd al-Wahhab ibn Ibrahim, lors de la construction de Malatya en l’an 140, il apportait des pierres au bâtisseur et nourrissait la population de sa propre poche grâce à des cuisines de campagne. Abd al-Wahhab le dénonça à Abu Ja’far, qui répondit: « Ô garçon ! al-Hasan se nourrit de son propre argent, et toi du mien », et le laissa se nourrir sans qu’on le dérange. Enfin, al-Mahdi l’envoya piller en l’an 162; il parcourut alors les terres byzantines, choisit l’emplacement de Madinat al-Hadath et parla à al-Mahdi de la construction de cette ville et de Tarse."
  ur: "حسن بن قحطبہ، خراسانی فوجوں کا ایک کمانڈر؛ البلادوری میں ہے: المنصور نے اسے 149 میں حدیث الموسل سے چھاپہ مارنے کے لیے بھیجا، اور وہ عباس ابن محمد کے ساتھ ملطیہ اور کامخ کے محاصرے میں چلا گیا۔ سال 140 میں عبد الوہاب بن ابراہیم کی فوج میں ملاتیا کی عمارت میں وہ پتھر لے کر تعمیر کرنے والے کے حوالے کرتا اور اپنے پرس سے لوگوں کو کھیت کا کچن کھلاتا - عبد الوہاب نے ابو جعفر کو اس کی مذمت کی، جس نے جواب دیا کہ اے لڑکے! الحسن اپنے پیسے سے کھانا کھلاتا ہے اور تم میرے پیسے سے کھانا کھلاتے ہو'' اور اسے بغیر کسی پکارنے والے کو کھلانے دو - اور المہدی نے اسے سنہ 162 میں چھاپہ مارنے کے لیے بھیجا، جب اس نے بازنطینی سرزمینوں پر حملہ کیا، مدینۃ الحدث کی جگہ کا انتخاب کیا اور المہدی سے اس کی تعمیر اور ترسوس کے بارے میں بات کی۔"
  tr: "El-Hasan bin Kahtaba, Horasan halkının askerlerinin komutanlarından biriydi; El-Baladhuri'ye göre: El-Mansur, 149 Hicri yılında Hadisa el-Musul'dan ona saldırmış, ardından Abbas ibn Muhammed ile birlikte Malatya'ya yürümüş ve Kamakh'ı kuşatmıştır. 140 H.'de Meletya'yı inşa eden Abdülvahhab bin İbrahim'in ordusunun bir parçasıydı. Taş taşıyor olabilir binayı ona verip kendi parasıyla mutfağında ziyafet çekene kadar; ta ki Abdülvahhab Ebu Ca'far'a mektup yazana kadar; o da \"Ey çocuk, el-Hasan'ı servetinden ve benim servetimden besle\" diye yanıt verdi ve çağıran olmadan beslenmesine izin verdi. 162 Hicri'de el-Mehdi ona saldırdı ve Romalıların topraklarında dolaştı, Hadas şehrini sıkça ziyaret etti ve şehri ile Tarsus'un inşası hakkında konuştu."
  id: "Al-Hasan ibn Qahtaba adalah salah satu komandan prajurit rakyat Khorasan; menurut Al-Baladhuri: Al-Mansur menyerangnya dari Haditha al-Mosul pada tahun 149 H, lalu berbaris bersama Abbas ibn Muhammad ke Malatya dan mengepung Kamakh. Ia merupakan bagian dari pasukan Abd al-Wahhab ibn Ibrahim dalam membangun Malatya pada tahun 140 H. Ia mungkin membawa batu untuk memberinya bangunan dan berpesta dengan uangnya sendiri di dapurnya sampai Abd al-Wahhab menulis kepada Abu Ja'far tentang hal itu, yang menjawab, \"Wahai anak, beri makan al-Hasan dari kekayaannya dan makanlah dari kekayaanku,\" dan memberinya izin untuk makan tanpa pemanggil. Pada tahun 162 H, al-Mahdi menyerbu dan berkeliaran di tanah Romawi, sering mengunjungi kota Al-Hadath dan berbicara dengan al-Mahdi tentang pembangunan dan pembangunan Tarsus."
