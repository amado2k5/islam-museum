summary:
  ar: "كاتب وباحث مصري ⁦(1889–1970)⁩ عُرف بكتابه الجدلي «أضواء على السنة النبوية» ⁦(1958)⁩ الذي شكّك في كثير من أحاديث الصحيحين ومنهج الرواية، فأثار ردودًا واسعة من علماء الحديث. وله أيضًا «شيخ المضيرة» وردود ورسائل في المناظرة الحديثية."
  en: "Egyptian writer and researcher (1889–1970) known for his polemical book Adwa' ala al-Sunna al-Nabawiyya (1958), which questioned many hadiths of the two Sahihs and the method of transmission, provoking wide rejoinders from hadith scholars. He also wrote Shaykh al-Mudira and polemical treatises."
  ur: "مصری مصنف اور محقق ⁦(1889–1970)⁩ جو اپنی مباحثی کتاب «اضواء علی السنۃ النبویہ» ⁦(1958)⁩ کے لیے جانے جاتے ہیں جس نے صحیحین کی بہت سی احادیث اور اسناد کے منہج پر سوال اٹھایا، جس سے محدثین کی جانب سے وسیع ردود آئے۔ ان کی دیگر تصانیف میں «شیخ المضیرہ» اور مباحثی رسائل ہیں۔"
  es: "Escritor e investigador egipcio (1889-1970), conocido por su libro polémico Adwa' ala al-Sunna al-Nabawiyya (1958), que cuestionaba numerosos hadices de los dos Sahihs y el método de transmisión, provocando numerosas réplicas entre los eruditos del hadiz. También escribió Shaykh al-Mudira y tratados polémicos."
