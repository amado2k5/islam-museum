  source: "Urdu Wikipedia 'حکیم نابینا انصاری' (revision 9218961) and Wikidata item Q111549961 (item revision 2555237581), each fetched by its recorded revision id through the MediaWiki API with the returned id asserted equal before use; the Wikidata item was queried twice with identical item revisions. Existence checks by name fragments (nabina, ansari, wahhab) across data/person, by QID and by biography (blind Unani physician of Ghazipur and Delhi, 1868–1941) found no prior record for this man. No English or Arabic Wikipedia article exists for him (searches in both return no article under 'Hakim Nabina', 'Hakeem Nabina Ansari' or his full name), so the English and Arabic prose are written from the Urdu source and say so. 'Nabina' is his byname, from his loss of sight to smallpox in childhood, as the article explains; his full name is Abdul Wahhab Ansari. His bay'ah to Rashid Ahmad Gangohi (who has a person record) is recorded in the faith note and prose rather than as a relation, because the predicate registry has no discipleship predicate and the registry's student_of would misstate it: the article names other men as his teachers. The lane queue gives 'Hakim Nabina (1860–1920)': both Wikipedia-derived sources agree on 1868–1941, and the record follows them, with the conflict disclosed in the date notes."
