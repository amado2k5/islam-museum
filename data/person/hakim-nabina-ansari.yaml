summary:
  ar: "حكيم عبد الوهاب أنصاري (1868–1941)، المعروف بحكيم نابينا أنصاري، طبيب يوناني هندي أعمى منذ طفولته، اشتهر بالتشخيص من النبض، ودرس في دار العلوم ديوبند وبايع رشيد أحمد الكنكوهي، وعالج محمد إقبال من حصاة الكلى."
  en: "Hakim Abdul Wahhab Ansari (1868–1941), known as Hakim Nabina Ansari, was an Indian Unani physician blinded in childhood who became famous for diagnosis by pulse; he studied at Darul Uloom Deoband, took bay'ah with Rashid Ahmad Gangohi, and treated Muhammad Iqbal's kidney stone."
  ur: "حکیم عبد الوہاب انصاری (1868ء–1941ء)، جو حکیم نابینا انصاری کے نام سے مشہور ہوئے، ہندوستانی طبیبِ یونانی تھے جو بچپن میں بینائی سے محروم ہو گئے تھے اور نبض دیکھ کر تشخیص میں مشہور ہوئے؛ انھوں نے دارالعلوم دیوبند سے تعلیم پائی، رشید احمد گنگوہی سے بیعت کی اور علامہ اقبال کی گردے کی پتھری کا علاج کیا۔"
