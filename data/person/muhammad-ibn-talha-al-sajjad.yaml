class: person
label: { ar: "محمد بن طلحة السجاد", en: "Muhammad ibn Talha al-Sajjad", es: "Muhammad ibn Talha al-Sajjad", fr: "Muhammad ibn Talha al-Sajjad", ur: "محمد بن طلحہ السجاد" }
summary:
  ar: "ابن طلحة بن عبيد الله الملقب بالسجاد، قتل مع أبيه يوم الجمل فمر به علي فقال هذا رجل قتله بره بأبيه وطاعته له، وتنوزع في كنيته فقال الواقدي أبو سليمان وقال الهيثم بن عدي أبو القاسم، وفي قتله قال قاتله شككت له بالرمح جيب قميصه على غير شيء غير أن ليس تابعاً علياً {cite:muruj-al-dhahab p. 659}."
  en: "Talha's son 'the Worshipful' — killed beside his father at the Camel, Ali pausing to say 'his filial piety killed him'; his kunya disputed between al-Waqidi and al-Haytham ibn 'Adi {cite:muruj-al-dhahab p. 659}."
  es: "El hijo de Talha, 'el Venerable', fue asesinado junto a su padre en el Camello, y Ali se detuvo para decir que 'su piedad filial lo mató'; su kunya fue disputada entre al-Waqidi y al-Haytham ibn 'Adi {cite:muruj-al-dhahab p. 659}."
  fr: "Le fils de Talha, « le Vénérable », tué aux côtés de son père au Chameau, Ali s'arrêtant pour dire « sa piété filiale l'a tué »; sa kunya est contestée entre al-Waqidi et al-Haytham ibn 'Adi {cite: muruj-al-dhahab p. 659}."
  ur: "طلحہ کا بیٹا 'عبادت کرنے والا' - اپنے باپ کے ساتھ اونٹ پر مارا گیا، علی یہ کہتے ہوئے رک گیا کہ 'اس کی پرہیزگاری نے اسے مار ڈالا'؛ اس کی کنیت کا الواقدی اور الہیثم بن عدی کے درمیان اختلاف ہے۔ 659}۔"
  tr: "İbn Talha ibn Ubeyd Allah, lakaplı El-Sejced, Deve Günü'nde babasıyla birlikte öldürüldü. Ali yanından geçip dedi ki: Bu, babasına karşı doğruluk için onu öldüren ve ona itaat eden bir adamdır. Onun kunyası herkes tarafından bilinir, bu yüzden El-Vakidi Ebu Süleyman, El-Haytham bin Adi ise Ebu el-Kasim dedi. Öldürmesiyle ilgili olarak: Mızrağını ve gömlek cebinin başka bir sebepten olduğunu düşündüm, ama Ali'nin takipçisi olmadığını söyledi {atı:muruj-al-dhahab, s. 659}."
  id: "Ibn Talha ibn Ubayd Allah, yang dijuluki Al-Sajjad, dibunuh bersama ayahnya pada Hari Unta. Ali melewatinya dan berkata: Ini adalah orang yang membunuhnya karena benar kepada ayahnya dan menaatinya. Kunya beliau dikenal luas, sehingga Al-Waqidi mengatakan Abu Sulayman, dan Al-Haytham ibn Adi mengatakan Abu al-Qasim. Mengenai pembunuhannya, beliau berkata: Saya curiga tombak dan saku bajunya untuk hal lain, kecuali bahwa beliau bukan pengikut Ali {cite:muruj-al-dhahab, hlm. 659}."
