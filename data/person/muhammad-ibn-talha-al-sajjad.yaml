summary:
  ar: "ابن طلحة بن عبيد الله الملقب بالسجاد، قتل مع أبيه يوم الجمل فمر به علي فقال هذا رجل قتله بره بأبيه وطاعته له، وتنوزع في كنيته فقال الواقدي أبو سليمان وقال الهيثم بن عدي أبو القاسم، وفي قتله قال قاتله شككت له بالرمح جيب قميصه على غير شيء غير أن ليس تابعاً علياً {cite:muruj-al-dhahab p. 659}."
  en: "Talha's son 'the Worshipful' — killed beside his father at the Camel, Ali pausing to say 'his filial piety killed him'; his kunya disputed between al-Waqidi and al-Haytham ibn 'Adi {cite:muruj-al-dhahab p. 659}."
