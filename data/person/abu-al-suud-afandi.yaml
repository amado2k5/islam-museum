summary:
  ar: "مفتي الدولة العثمانية المعروف بخوجة جلبي، صاحب تفسير إرشاد العقل السليم الذي أتم تبييضه في سنة واشتهر حتى سمي خطيب المفسرين {cite:kashf-zunun-furqan p. 348-349}. وفي شذرات الذهب أنه ولد سنة ثمان وتسعين وتسعمائة وتوفي في مستهل جمادى الأولى سنة اثنتين وثمانين وتسعمائة {cite:shadharat-dhahab}."
  en: "The Ottoman shaykh al-islam Abu al-Su'ud Afandi, whose Irshad al-aql al-salim became the most celebrated tafsir since al-Baydawi's {cite:kashf-zunun-furqan p. 348-349}. Shadharat al-Dhahab dates his birth to 898 and his death to early Jumada I 982 {cite:shadharat-dhahab}."
