  fr: "Ali b. al-Jawzi — fils du grand historien Ibn al-Jawzi, copiste qui transcrivait beaucoup pour un salaire et homme sociable du monde; il a transmis d'Ibn al-Batti et d'Abu Zur'a et est mort en Ramadan 630 {cite:shadharat-dhahab p. 137}."
