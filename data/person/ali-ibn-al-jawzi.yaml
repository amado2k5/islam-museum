id: person/ali-ibn-al-jawzi
class: person
label: { ar: "علي بن الجوزي" }
summary:
  ar: "علي بن الجوزي أبو الحسن ولد العلامة جمال الدين أبي الفرج عبد الرحمن بن علي البغدادي؛ ناسخ نسخ الكثير بالأجرة وكان معاشراً لاعباً، روى عن ابن البطي وأبي زرعة وجماعة، وتوفي في رمضان سنة ثلاثين وستمائة {cite:shadharat-dhahab p. 137}."
  en: "Ali b. al-Jawzi — son of the great historian Ibn al-Jawzi, a copyist who transcribed much for wages and a sociable man-about-town; he transmitted from Ibn al-Batti and Abu Zur'a and died in Ramadan 630 {cite:shadharat-dhahab p. 137}."
  es: "Ali b. al-Jawzi — hijo del gran historiador Ibn al-Jawzi, copista que transcribía mucho a cambio de dinero y un hombre sociable y conocido en la ciudad; transmitió de Ibn al-Batti y Abu Zur'a y murió en Ramadán 630 {cite:shadharat-dhahab p. 137}."
  fr: "Ali b. al-Jawzi — fils du grand historien Ibn al-Jawzi, copiste qui transcrivait beaucoup pour un salaire et homme sociable du monde; il a transmis d'Ibn al-Batti et d'Abu Zur'a et est mort en Ramadan 630 {cite:shadharat-dhahab p. 137}."
  ur: "علی بی الجوزی - عظیم مورخ ابن الجوزی کا بیٹا، ایک نقل نگار جس نے اجرت کے لیے بہت کچھ نقل کیا اور شہر کے بارے میں ایک ملنسار آدمی؛ انہوں نے ابن بطی اور ابو زرعہ سے نقل کیا اور رمضان 630 میں وفات پائی۔ 137}۔"
  tr: "Ali ibn al-Jawzi Ebu el-Hasan, âlim Cemaleddin Ebu el-Farac Abdülrahman ibn Ali el-Bağdadi'nin oğlu; birçok kopyayı kiralanmak için kopyalayan ve oyunbaz, sosyal bir adamdı. İbn el-Batti, Ebu Zur'ah ve diğerlerinden rivayet etti ve Ramazan'da altı yüz otuz yılda vefat etti {atıf:şadharat-dhahab, s. 137}."
  id: "Ali ibn al-Jawzi Abu al-Hasan, putra ulama Jamal al-Din Abu al-Faraj Abd al-Rahman ibn Ali al-Baghdadi; seorang penyalin yang menyalin banyak salinan untuk disewa dan merupakan pria yang suka bermain dan bersosialisasi. Ia menceritakan dari Ibn al-Batti, Abu Zur'ah, dan lainnya, dan meninggal pada Ramadan tahun enam ratus tiga puluh {cite:shadharat-dhahab, hlm. 137}."
