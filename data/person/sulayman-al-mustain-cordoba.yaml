label:
  ar: سليمان المستعين بالله الأموي
summary:
  ar: سليمان بن الحكم بن سليمان بن عبد الرحمن الناصر الأموي، خرج على ابن عبد الجبار المهدي فبويع له أصحاب عبد الرحمن بن أبي
    عامر وأكثرهم البربر ولُقّب أولاً بالمستعين بالله ثم بالظاهر بالله، وسار إلى النصارى فصالحهم واستنجدهم فانتجدوه وساروا
    معه إلى قرطبة فالقتلوا وابن عبد الجبار بالوقعة المشهورة قُتل فيها ما لا يُحصى عدد القتلى خمسة وثلاثين ألفاً، فانهزم ابن
    عبد الجبار ودخل سليمان البلد وحصره في القصر حتى هرب، فبايعه الناس بالخلافة في شوال سنة أربعمائة، وأغار البربر والروم على
    قرطبة فنهبوها وسبوا وأسروا عدداً عظيماً، ثم خرج عليه ابن عبد الجبار عائداً فانهزم سليمان ومضى إلى شاطبة {cite:kamil-ibn-al-athir
    p. 500-502}.
  en: Sulayman ibn al-Hakam, the Umayyad hailed as al-Musta'in then al-Zahir, who marched on Cordoba with Christian allies
    and Berbers, defeated al-Mahdi in the great battle (35,000 dead), took the caliphal bay'a in 400 — while Berbers and Christians
    sacked the city — then lost it again to the returning usurper {cite:kamil-ibn-al-athir p. 500-502}.
  es: "Sulayman ibn al-Hakam, el omeya aclamado como al-Musta'in y luego al-Zahir, que marchó sobre Córdoba con aliados cristianos y bereberes, derrotó a al-Mahdi en la gran batalla (35.000 muertos), tomó la bay'a califal en el año 400 —mientras los bereberes y los cristianos saqueaban la ciudad— y luego la perdió de nuevo ante el usurpador que regresaba {cite:kamil-ibn-al-athir p. 500-502}."
  fr: "Sulayman ibn al-Hakam, l'Omeyyade salué comme al-Musta'in puis al-Zahir, qui marcha sur Cordoue avec des alliés chrétiens et des Berbères, vainquit al-Mahdi lors de la grande bataille (35 000 morts), prit la bay'a califale en 400 — tandis que les Berbères et les chrétiens pillaient la ville — puis la perdit à nouveau au profit de l'usurpateur de retour {cite:kamil-ibn-al-athir p. 500-502}."
  ur: "سلیمان بن الحکم، اموی کو المستعین کہا جاتا تھا پھر الظاہر، جس نے عیسائی اتحادیوں اور بربروں کے ساتھ قرطبہ پر کوچ کیا، المہدی کو عظیم جنگ میں شکست دی ⁦(35000 ہلاک)⁩، 400 میں خلیفہ بیع پر قبضہ کر لیا - جب کہ بربر اور عیسائیوں نے اس شہر کو دوبارہ کھو دیا - پھر اسے واپس لوٹا دیا۔ {حوالہ: کامل ابن الاثیر ص۔ 500-502}۔"
