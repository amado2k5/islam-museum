label: { ar: "سليمان المستعين بالله الأموي" }
summary:
  ar: "سليمان بن الحكم بن سليمان بن عبد الرحمن الناصر الأموي، خرج على ابن عبد الجبار المهدي فبويع له أصحاب عبد الرحمن بن أبي عامر وأكثرهم البربر ولُقّب أولاً بالمستعين بالله ثم بالظاهر بالله، وسار إلى النصارى فصالحهم واستنجدهم فانتجدوه وساروا معه إلى قرطبة فالقتلوا وابن عبد الجبار بالوقعة المشهورة قُتل فيها ما لا يُحصى عدد القتلى خمسة وثلاثين ألفاً، فانهزم ابن عبد الجبار ودخل سليمان البلد وحصره في القصر حتى هرب، فبايعه الناس بالخلافة في شوال سنة أربعمائة، وأغار البربر والروم على قرطبة فنهبوها وسبوا وأسروا عدداً عظيماً، ثم خرج عليه ابن عبد الجبار عائداً فانهزم سليمان ومضى إلى شاطبة {cite:kamil-ibn-al-athir p. 500-502}."
  en: "Sulayman ibn al-Hakam, the Umayyad hailed as al-Musta'in then al-Zahir, who marched on Cordoba with Christian allies and Berbers, defeated al-Mahdi in the great battle (35,000 dead), took the caliphal bay'a in 400 — while Berbers and Christians sacked the city — then lost it again to the returning usurper {cite:kamil-ibn-al-athir p. 500-502}."
