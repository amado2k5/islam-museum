summary:
  ar: "قتادة بن دعامة السدوسي، عند ابن الإخشيد أنه لما مات الحسن جلس مجلسه فاعتزله عمرو بن عبيد ونفر معه فسماها قتادة المعتزلة فأظهر عمرو تقبله وقال إن الاعتزال وصف مدحه الله في كتابه {cite:fihrist-ibn-al-nadim p. 557}."
  en: "Successor to al-Hasan's seat who named the seceders al-Mu'tazila {cite:fihrist-ibn-al-nadim}"
