id: person/abu-bakr-ibn-al-arabi-qadi
class: person
label: { ar: "القاضي أبو بكر ابن العربي" }
summary:
  ar: "أبو بكر محمد بن عبد الله ابن العربي المعافري؛ رحل إلى المشرق مع أبيه مستهل ربيع الأول سنة 485هـ وسمع بالأندلس وببجاية والمهدية والإسكندرية ومصر ودمشق ومكة وبغداد ولقي ببغداد الشاشي أبا بكر والإمام أبا حامد الغزالي ونقل عنه أنه قال: كل من رحل لم يأت بمثل ما أتيت به من العلم إلا الباجي، وقرأ الأدب على التبريزي، وعاد إلى الأندلس سنة 493هـ وولي قضاء إشبيلية وقام بأمر القضاء أحمد قيام مع الصرامة في الحق وقد روي أنه أمر بثقب أشداق زامر ثم صرف عن القضاء فأقبل على نشر العلم وبثه؛ مولده ليلة الخميس لثمان بقين من شعبان سنة 468هـ وتوفي بمغيلة قرية من مدينة فاس ودفن بفاس في ربيع الآخر سنة 543هـ {cite:nafh-tib-maqqari p. 30-31}."
  en: "Qadi Abu Bakr b. al-Arabi, the 'seal of al-Andalus's scholars'; travelled east at seventeen, heard al-Ghazali in Baghdad who said none who journeyed brought back his like save al-Baji, then judged Seville until dismissed for rigour — born 468, buried at Fez 543 {cite:nafh-tib-maqqari p. 30-31}."
