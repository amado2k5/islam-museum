id: person/abu-bakr-ibn-al-arabi-qadi
class: person
label: { ar: "القاضي أبو بكر ابن العربي", en: "Qadi Abu Bakr ibn al-Arabi", fr: "Le cadi Abu Bakr ibn al-Arabi", es: "Qadi Abu Bakr ibn al-Arabi", ur: "قاضی ابوبکر ابن العربی" }
summary:
  ar: "أبو بكر محمد بن عبد الله ابن العربي المعافري؛ رحل إلى المشرق مع أبيه مستهل ربيع الأول سنة 485هـ وسمع بالأندلس وببجاية والمهدية والإسكندرية ومصر ودمشق ومكة وبغداد ولقي ببغداد الشاشي أبا بكر والإمام أبا حامد الغزالي ونقل عنه أنه قال: كل من رحل لم يأت بمثل ما أتيت به من العلم إلا الباجي، وقرأ الأدب على التبريزي، وعاد إلى الأندلس سنة 493هـ وولي قضاء إشبيلية وقام بأمر القضاء أحمد قيام مع الصرامة في الحق وقد روي أنه أمر بثقب أشداق زامر ثم صرف عن القضاء فأقبل على نشر العلم وبثه؛ مولده ليلة الخميس لثمان بقين من شعبان سنة 468هـ وتوفي بمغيلة قرية من مدينة فاس ودفن بفاس في ربيع الآخر سنة 543هـ {cite:nafh-tib-maqqari p. 30-31}."
  en: "Qadi Abu Bakr b. al-Arabi, the 'seal of al-Andalus's scholars'; travelled east at seventeen, heard al-Ghazali in Baghdad who said none who journeyed brought back his like save al-Baji, then judged Seville until dismissed for rigour — born 468, buried at Fez 543 {cite:nafh-tib-maqqari p. 30-31}."
  fr: "Le cadi Abu Bakr b. al-Arabi, « sceau des savants d'al-Andalus » ; il partit vers l'Orient à dix-sept ans, entendit à Bagdad al-Ghazali, qui dit que nul de ceux qui voyagèrent n'en rapporta autant que lui sauf al-Baji, puis fut cadi de Séville jusqu'à sa destitution pour sa rigueur — né en 468, enterré à Fès en 543 {cite:nafh-tib-maqqari p. 30-31}."
  es: "Qadi Abu Bakr b. al-Arabi, el 'sello de los eruditos de al-Ándalus'; viajó al este a los diecisiete años, escuchó a al-Ghazali en Bagdad, quien dijo que nadie que viajó trajo de vuelta a alguien como él, salvo al-Baji, luego juzgó Sevilla hasta que fue destituido por su rigor — nació en 468, enterrado en Fez en 543 {cite:nafh-tib-maqqari p. 30-31}."
  ur: "قادی ابوبکر ب۔ العربی، 'اندلس کے علماء کی مہر'؛ سترہ میں مشرق کا سفر کیا، بغداد میں الغزالی کو سنا جس نے کہا کہ الباجی کے علاوہ کوئی بھی سفر کرنے والے کو واپس نہیں لایا، پھر سیویل کو سختی کی وجہ سے برخاست کرنے تک فیصلہ کیا - پیدائش 468، فیز 543 میں دفن ہوا 30-31}۔"
  tr: "Ebu Bekir Muhammed ibn Abdullah ibn el-Arabi el-Ma'afiri; Hicri 485 yılının Rebiü'l-Evvel ayının başında babasıyla birlikte Doğu'ya seyahat etti ve Endülüs, Becayya, Mehdi, İskenderiye, Mısır, Şam, Mekke ve Bağdat'ta hadis öğrendi. Bağdat'ta el-Şaşi Ebu Bekir ve İmam Ebu Hamid el-Gazali ile görüştü ve şöyle dediği rivayet edilir: \"Seyahate çıkanların hiçbiri, el-Bacı hariç, benim kadar bilgi getirmedi.\" Tebrizi'den edep eğitimi aldı ve Hicri 493 yılında Endülüs'e döndü ve Sevilla kadısı olarak atandı. Hakikati savunmada kararlılıkla yargı işlerini yürüttü. Bir flütçünün ağzının delinmesini emrettiği rivayet edilir, daha sonra yargıdan azledildi ve kendini bilgi yaymaya ve dağıtmaya adadı. O, Hicri 468 yılının Şaban ayının sekizinci Perşembe gecesi doğmuş, Fez şehrinin Maghila köyünde vefat etmiş ve Hicri 543 yılında Rebiü'l-Sani ayında Fez'e defnedilmiştir. {Kaynak: Nafh-tib-makqkari, s. 30-31}"
  id: "Abu Bakr Muhammad ibn Abdullah ibn al-Arabi al-Ma’afiri; beliau melakukan perjalanan ke Timur bersama ayahnya pada awal Rabi’ al-Awwal tahun 485 H dan mendengar hadits di Andalusia, Bejaia, Mahdia, Alexandria, Mesir, Damaskus, Mekah, dan Baghdad. Di Baghdad beliau bertemu dengan al-Shashi Abu Bakr dan Imam Abu Hamid al-Ghazali, dan diriwayatkan bahwa beliau berkata: “Tidak semua orang yang melakukan perjalanan membawa kembali ilmu sebanyak yang saya bawa, kecuali al-Baji.” Beliau belajar sastra dengan al-Tabrizi, dan kembali ke Andalusia pada tahun 493 H dan diangkat menjadi hakim di Sevilla. Beliau menjalankan urusan peradilan dengan tegas dalam menegakkan kebenaran. Diriwayatkan bahwa beliau memerintahkan agar mulut seorang pemain seruling ditusuk, kemudian beliau diberhentikan dari jabatannya sebagai hakim dan mengabdikan diri untuk menyebarkan dan menjabarkan ilmu pengetahuan. Ia lahir pada malam Kamis, tanggal delapan Sya'ban tahun 468 H, dan wafat di Maghila, sebuah desa di kota Fez, dan dimakamkan di Fez pada bulan Rabi' al-Thani tahun 543 H. {cite:nafh-tib-maqqari hlm. 30-31}."
