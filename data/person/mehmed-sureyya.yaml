summary:
  ar: "محمد ثريا بك (1845–1909م)، مؤرخ وموظف عثماني، صاحب «سجل عثماني» أوسع معجم لتراجم العثمانيين. وُلد بإسطنبول، وأبوه محمد حسني بك من موظفي الدولة، ودرس في رشدية دار المعارف وأخذ العربية والفارسية والفرنسية دروساً خاصة، وبدأ عمله في غرفة الترجمة بالباب العالي سنة 1279هـ، ثم صار عضواً في مجلس المعارف الكبير سنة 1304هـ، وتوفي في 12 يناير 1909م ودُفن في مقبرة قره جه أحمد {cite:sicill-i-osmani vol. 1 PDF p. 5-6}."
  en: "Mehmed Süreyya Bey (1845–1909), Ottoman historian and official, author of the Sicill-i Osmani, the largest dictionary of Ottoman biography. Born in Istanbul to Mehmed Hüsnü Bey, a state official, he studied at the Darülmaarif rüşdiye school and took private lessons in Arabic, Persian and French, began service in the translation office of the Sublime Porte in 1279 AH, became a member of the Grand Council of Education in 1304 AH, and died on 12 January 1909, being buried in the Karacaahmet cemetery."
