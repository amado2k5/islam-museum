id: person/ali-ibn-buya
class: person
label: { ar: "عماد الدولة علي بن بويه" }
aliases: [person/imad-al-dawla]
summary:
  ar: "ابن بويه الصياد الفقير الذي رأى كأنه بال فخرج من ذكره عمود نار حتى ملأ الدنيا فعبرت بأن أولاده يملكون الدنيا، صار قائداً لمرداويج فأرسله يستخرج مالاً من الكرخ فاستخرج خمس مئة ألف درهم ثم انفرد عنه فهزم نائب الخليفة محمد بن ياقوت واستولى على فارس سنة اثنتين وعشرين وبعث إلى الراضي يقاطعه على ما ملكه بثمان مئة ألف ألف درهم كل سنة فبعث له لواء وخلعاً ثم أخذ يماطل بحمل المال {cite:tarikh-khulafa-minhaj-1434 p. 598,603}، ولقبه المستكفي عماد الدولة لما دخل أخوه أحمد بغداد وضربت ألقاب الأخوة الثلاثة على السكة {cite:tarikh-khulafa-minhaj-1434 p. 613}، وسأل معز الدولة المطيع سنة ثمان وثلاثين أن يشرك معه في الأمر أخاه عماد الدولة ويكون من بعده فأجابه ثم لم ينشب أن مات عماد الدولة من عامه {cite:tarikh-khulafa-minhaj-1434 p. 616}."
  en: "Son of the poor fisherman Buya — who dreamed fire issued from him filling the world, read as his sons ruling it. Mardawij's captain, sent to extract Karkh's money, he broke away in 322, beat the caliph's deputy and took Fars; he bargained with al-Radi — a yearly eight hundred million dirhams for what he held — received a banner and robes, then stalled on payment {cite:tarikh-khulafa-minhaj-1434 p. 598,603}; he died at Shiraz in Jumada II 338 of a kidney ulcer {cite:kamil-ibn-al-athir p. 366}."
  es: "Hijo del pobre pescador Buya, quien soñó que el fuego emanaba de él llenando el mundo, interpretándose como que sus hijos lo gobernarían. Capitán de Mardawij, enviado para extraer el dinero de Karkh, se separó en 322, derrotó al lugarteniente del califa y tomó Fars; negoció con al-Radi —ochocientos millones de dirhams anuales por lo que poseía— recibió un estandarte y túnicas, pero luego retrasó el pago {cite:tarikh-khulafa-minhaj-1434 p. 598,603}; murió en Shiraz en Jumada II 338 de una úlcera renal {cite:kamil-ibn-al-athir p. 366}."
  fr: "Fils du pauvre pêcheur Buya, qui rêva que le feu jaillissait de lui et emplissait le monde (ce qui symbolise ses fils gouvernant le monde), il fut capitaine de Mardawij. Envoyé pour extorquer de l'argent à Karkh, il fit sécession en 322, vainquit le lieutenant du calife et s'empara de Fars. Il négocia avec al-Radi – huit cents millions de dirhams par an en échange de ce qu'il possédait – reçut une bannière et des vêtements, puis tarda à payer (voir: Tarikh Khulafa Minhaj, 1434, p. 598, 603). Il mourut à Shiraz en Jumada II 338 d'un ulcère rénal (voir: Kamil Ibn al-Athir, p. 366)."
  ur: "غریب مچھیرے بویا کا بیٹا - جس نے خواب دیکھا کہ اس سے آگ دنیا بھر رہی ہے، اس کے بیٹے اس پر حکمرانی کر رہے ہیں۔ مردویج کے کپتان کو کرخ کی رقم نکالنے کے لیے بھیجا گیا، اس نے 322 میں توڑ دیا، خلیفہ کے نائب کو مارا اور فارس لے لیا۔ اس نے الرادی کے ساتھ سودا کیا - جو اس کے پاس تھا اس کے لئے سالانہ آٹھ سو ملین درہم - ایک جھنڈا اور لباس ملا، پھر ادائیگی پر رک گیا {حوالہ:تاریخ-خلفاء منہاج-1434 صفحہ۔ 598,603}; آپ کا انتقال جمادی الثانی 338 میں گردے کے السر سے شیراز میں ہوا۔ 366}۔"
