id: person/ali-ibn-buya
class: person
label: { ar: "علي بن بويه الديلمي" }
summary:
  ar: "ابن بويه الصياد الفقير الذي رأى كأنه بال فخرج من ذكره عمود نار حتى ملأ الدنيا فعبرت بأن أولاده يملكون الدنيا، صار قائداً لمرداويج فأرسله يستخرج مالاً من الكرخ فاستخرج خمس مئة ألف درهم ثم انفرد عنه فهزم نائب الخليفة محمد بن ياقوت واستولى على فارس سنة اثنتين وعشرين وبعث إلى الراضي يقاطعه على ما ملكه بثمان مئة ألف ألف درهم كل سنة فبعث له لواء وخلعاً ثم أخذ يماطل بحمل المال {cite:tarikh-khulafa-minhaj-1434 p. 598,603}، ولقبه المستكفي عماد الدولة لما دخل أخوه أحمد بغداد وضربت ألقاب الأخوة الثلاثة على السكة {cite:tarikh-khulafa-minhaj-1434 p. 613}، وسأل معز الدولة المطيع سنة ثمان وثلاثين أن يشرك معه في الأمر أخاه عماد الدولة ويكون من بعده فأجابه ثم لم ينشب أن مات عماد الدولة من عامه {cite:tarikh-khulafa-minhaj-1434 p. 616}."
  en: "Son of the poor fisherman Buya — who dreamed fire issued from him filling the world, read as his sons ruling it. Mardawij's captain, sent to extract Karkh's money, he broke away in 322, beat the caliph's deputy and took Fars; he bargained with al-Radi — a yearly eight hundred million dirhams for what he held — received a banner and robes, then stalled on payment {cite:tarikh-khulafa-minhaj-1434 p. 598,603}."
