class: person
label: { ar: "ابن النديم", en: "Ibn al-Nadim", es: "Ibn al-Nadim", fr: "Ibn al-Nadim", ur: "ابن الندیم" }
summary:
  ar: "أبو الفرج محمد بن إسحاق النديم الوراق البغدادي، صاحب كتاب الفهرست في ذكر مؤلفات الأمم وعلومها وأسماء الكتب ومصنفيها، وهو نديم ووراق عاش في بغداد القرن الرابع الهجري {cite:fihrist-ibn-al-nadim p. 1-49}. ودون في صدر فهرسته أنه يأتي به إلى عصره سنة سبع وسبعين وثلاث مائة للهجرة {cite:fihrist-ibn-al-nadim p. 3}"
  en: "Abu al-Faraj Muhammad b. Ishaq al-Nadim al-Warraq — fourth-century Baghdadi bookseller and author of the Fihrist {cite:fihrist-ibn-al-nadim p. 1-49}."
  es: "Abu al-Faraj Muhammad b. Ishaq al-Nadim al-Warraq, librero bagdadí del siglo IV y autor del Fihrist {citar:fihrist-ibn-al-nadim p. 1-49}."
  fr: "Abou al-Faraj Muhammad b. Ishaq al-Nadim al-Warraq — libraire baghdadi du IVe siècle et auteur du Fihrist {cite:fihrist-ibn-al-nadim p. 1-49}."
  ur: "ابو الفراج محمد ب۔ اسحاق النادیم الوراق - چوتھی صدی کے بغدادی کتاب فروش اور فہرسٹ کے مصنف 1-49}۔"
  tr: "Ebu el-Faraj Muhammed bin İshaq el-Nadim el-Varrak el-Bağdadi, 'El-Fihrist' adlı Ulusların Yazıları, Bilimleri ve Kitapların İsimleri ile Yazarları üzerine kitabın yazarıdır. Dördüncü yüzyıl Hibri'de Bağdat'ta yaşamış bir yoldaş ve yazardı {atıf:fihrist-ibn-al-nadim s. 1-49}. Kataloğunun başında, onu 377 Hicri yılındaki kendi dönemine geri getirdiğini kaydetti {atıf:fihrist-ibn-al-nadim s. 3}"
  id: "Abu al-Faraj Muhammad ibn Ishaq al-Nadim al-Warraq al-Baghdadi, penulis buku 'Al-Fihrist' tentang Tulisan Bangsa-bangsa, Ilmu Mereka, dan Nama-nama Buku serta Penulisnya. Ia adalah teman dan penulis yang tinggal di Baghdad pada abad keempat H {cite:fihrist-ibn-al-nadim hlm. 1-49}. Ia mencatat di awal katalognya bahwa ia membawanya kembali ke zamannya pada tahun 377 H {cite:fihrist-ibn-al-nadim hlm. 3}"
