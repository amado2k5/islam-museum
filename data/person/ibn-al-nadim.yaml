label: { ar: "ابن النديم", en: "Ibn al-Nadim" }
summary:
  ar: "أبو الفرج محمد بن إسحاق النديم الوراق البغدادي، صاحب كتاب الفهرست في ذكر مؤلفات الأمم وعلومها وأسماء الكتب ومصنفيها، وهو نديم ووراق عاش في بغداد القرن الرابع الهجري {cite:fihrist-ibn-al-nadim p. 1-49}. ودون في صدر فهرسته أنه يأتي به إلى عصره سنة سبع وسبعين وثلاث مائة للهجرة {cite:fihrist-ibn-al-nadim p. 3}"
  en: "Abu al-Faraj Muhammad b. Ishaq al-Nadim al-Warraq — fourth-century Baghdadi bookseller and author of the Fihrist {cite:fihrist-ibn-al-nadim p. 1-49}."
