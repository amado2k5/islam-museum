summary:
  ar: "عالم وداعية مسلم كندي، مؤسس المنتدى الإسلامي الكندي في برامبتون بأونتاريو ورئيسه منذ عقود. عضو اللجنة الحكومية الكندية للحوار بين الأديان، وقاد وفودًا للحوار مع الفاتيكان، وله بثّ إذاعي ومرئي متواصل للعلوم الشرعية."
  en: "Canadian Muslim scholar and preacher, founder and longtime head of the Islamic Forum of Canada in Brampton, Ontario. A member of the Government of Canada's Interfaith Committee, he has led interfaith delegations to the Vatican and runs a continuous livestream broadcast of religious teaching."
  ur: "کینیڈین مسلمان عالم اور مبلغ، برامپٹن، اونٹاریو میں اسلامک فورم آف کینیڈا کے بانی اور برسوں سے اس کے سربراہ۔ حکومتِ کینیڈا کی بین المذاہب کمیٹی کے رکن رہے، ویٹیکن کو بین المذاہب وفود کی قیادت کی، اور علومِ شرعیہ کا مسلسل براہِ راست نشریاتی سلسلہ چلاتے ہیں۔"
  es: "Erudito y predicador musulmán canadiense, fundador y antiguo director del Foro Islámico de Canadá en Brampton, Ontario. Miembro del Comité Interreligioso del Gobierno de Canadá, ha liderado delegaciones interreligiosas al Vaticano y dirige una transmisión en directo continua de enseñanzas religiosas."
  fr: "Érudit et prédicateur musulman canadien, fondateur et ancien directeur du Forum islamique du Canada à Brampton, en Ontario. Membre du Comité interreligieux du gouvernement du Canada, il a dirigé des délégations interreligieuses au Vatican et anime une diffusion en direct et continue d'enseignements religieux."
  tr: "Kanadalı bir Müslüman alim ve vaiz, onlarca yıl boyunca Brampton, Ontario'daki Kanada İslam Forumu'nun kurucusu ve başkanıdır. Kanada Hükümeti Dinlerarası Diyalog Komitesi üyesi, Vatikan ile diyalog heyetlerine liderlik etmiş ve İslami bilimlerin sürekli radyo ve video yayınını yapmaktadır."
  id: "Seorang ulama dan pengkhotbah Muslim Kanada, pendiri dan presiden Canadian Islamic Forum di Brampton, Ontario, selama beberapa dekade. Anggota Komite Pemerintah Kanada untuk Dialog Antaragama, memimpin delegasi dialog dengan Vatikan, dan memiliki siaran radio serta video yang berkelanjutan tentang ilmu pengetahuan Islam."
