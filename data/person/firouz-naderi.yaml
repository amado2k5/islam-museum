summary:
  ar: "فيروز مايكل نادري (25 مارس 1946 – 9 يونيو 2023) مهندس كهرباء ومدير تنفيذي إيراني-أمريكي في وكالة ناسا، قضى 36 عامًا في مختبر الدفع النفاث. أدار برنامج ناسا لاستكشاف المريخ في فترة هبوط المسبارين سبيريت وأوبورتونيتي بنجاح، ثم شغل منصب المدير المساعد للمختبر ومدير استكشاف المجموعة الشمسية، ونال وسام الخدمة المتميزة من ناسا سنة 2005، وسُمي الكويكب 5515 نادري باسمه."
  en: "Firouz Michael Naderi (25 March 1946 – 9 June 2023) was an Iranian-American electrical engineer and NASA executive who spent 36 years at the Jet Propulsion Laboratory. He directed NASA's Mars Exploration Program through the successful landings of the Spirit and Opportunity rovers, later served as JPL's associate director and as Director for Solar System Exploration, received the NASA Distinguished Service Medal in 2005, and has asteroid 5515 Naderi named for him."
  ur: "فیروز مائیکل نادری (25 مارچ 1946ء – 9 جون 2023ء) ایرانی نژاد امریکی برقی انجینئر اور ناسا کے ایگزیکٹو تھے جنہوں نے جیٹ پروپلشن لیبارٹری میں 36 برس گزارے۔ انہوں نے ناسا کے مریخ ایکسپلوریشن پروگرام کی قیادت اسپرٹ اور آپرچیونٹی کی کامیاب لینڈنگ کے دور میں کی، بعد ازاں لیبارٹری کے ایسوسی ایٹ ڈائریکٹر اور نظام شمسی کی تحقیق کے ڈائریکٹر رہے، 2005ء میں ناسا کا ڈسٹنگوئشڈ سروس میڈل حاصل کیا، اور سیارچہ 5515 نادری ان کے نام پر رکھا گیا۔"
