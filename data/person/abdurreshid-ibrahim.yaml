summary:
  ar: "عالم وصحفي ورحّالة تتري (1857–1944)، وُلد في تارا بسيبيريا. كان قاضيًا في جمعية أورنبورغ الإسلامية، ومن قادة «اتفاق المسلمين»، وجاب أوروبا وآسيا داعيًا إلى وحدة المسلمين، ودون رحلاته في «عالم إسلام»، ثم عاد إلى اليابان سنة 1933 فبنى مسجد طوكيو وصار أول إمام له، وتوفي في طوكيو."
  en: "Tatar scholar, journalist and traveller (1857–1944), born at Tara in Siberia. He served as qadi of the Orenburg Muslim Spiritual Assembly, became a leader of Ittifaq al-Muslimin, travelled across Europe and Asia advocating Muslim unity and recorded his journeys in Alem-i Islam ('The World of Islam'), and in 1933 returned to Japan, where he built the Tokyo Mosque, became its first imam, and died at Tokyo."
  ur: "تاتار عالم، صحافی اور سیاح (1857–1944)، سائبیریا کے قصبے تارا میں پیدا ہوئے۔ اورنبرگ مسلم اسمبلی کے قاضی رہے، «اتفاق المسلمین» کے رہنماؤں میں شامل ہوئے، یورپ و ایشیا کا سفر کر کے مسلم اتحاد کی دعوت دی اور اپنے سفرنامے «عالمِ اسلام» میں قلم بند کیے، پھر 1933 میں جاپان لوٹ کر ٹوکیو مسجد بنائی اور اس کے پہلے امام بنے؛ وہیں وفات پائی۔"
