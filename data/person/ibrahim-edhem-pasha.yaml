summary:
  ar: "إبراهيم أدهم باشا (وُلد في جزيرة خيوس سنة 1818 أو 1819 – توفي في إسطنبول في مارس 1893)، رجل دولة عثماني من أصل يوناني، نشأ في كنف الصدر الأعظم خسرو باشا وتعلّم هندسة المناجم في باريس فكان أول مهندس مناجم تركي بالمعنى الحديث، وتولّى الصدارة العظمى بين فبراير 1877 ويناير 1878 في صدر الحرب الروسية العثمانية، وهو والد عثمان حمدي بك مؤسس متاحف الآثار في إسطنبول."
  en: "Ibrahim Edhem Pasha (born on Chios in 1818 or 1819 – died at Istanbul in March 1893) was an Ottoman statesman of Greek origin, raised in the household of Grand Vizier Hüsrev Pasha and trained as a mining engineer in Paris — the first Turkish mining engineer in the modern sense. He was Grand Vizier from February 1877 to January 1878, at the opening of the Russo-Turkish War, and the father of Osman Hamdi Bey."
  ur: "ابراہیم ادہم پاشا (پیدائش: خیوس، 1818ء یا 1819ء – وفات: استنبول، مارچ 1893ء)، یونانی الاصل عثمانی سیاست دان؛ صدرِ اعظم خسرو پاشا کے گھر پرورش پائی، پیرس میں کان کنی کی انجینئرنگ پڑھی، فروری 1877ء سے جنوری 1878ء تک صدرِ اعظم رہے؛ عثمان حمدی بے کے والد۔"
