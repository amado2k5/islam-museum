id: person/al-hakim-bi-amr-illah-ii
class: person
label: { ar: "الحاكم بأمر الله الثاني أحمد بن المستكفي", en: "al-Hakim bi-Amr Allah II Ahmad ibn al-Mustakfi", fr: "Al-Hakim bi-Amr Allah II Ahmad ibn al-Mustakfi", es: "al-Hakim bi-Amr Allah II Ahmad ibn al-Mustakfi", ur: "الحکیم بن عمرو اللہ ثانی احمد بن المستقفی" }
summary:
  ar: "خليفة القاهرة [٧٤١–٧٥٣هـ]، أبو العباس أحمد بن المستكفي، عهد إليه أبوه لما مات بقوص فقدم عليه ابن عمه إبراهيم فلما حضرت السلطان الوفاة أوصى برد الأمر إلى ولي العهد أحمد فعقد المنصور أبو بكر بن الناصر مجلساً يوم الخميس حادي عشر ذي الحجة سنة إحدى وأربعين وطلب الخليفة إبراهيم وولي العهد أحمد والقضاة وقال من يستحق الخلافة شرعاً فقال ابن جماعة إن المستكفي أوصى بالخلافة لولده أحمد وأشهد عليه أربعين عدلاً بقوص فخلع إبراهيم وبايع أحمد ولقب الحاكم بأمر الله لقب جده، وقال ابن فضل الله هو إمام عصرنا وغمام مصرنا أحيا رسوم الخلافة وسلك مناهج آبائه وقد طمست وجمع شمل بني أبيه وقد طال بهم الشتات {cite:tarikh-khulafa-minhaj-1434 p. 739-743}، وكان أولاً لقب المستنصر ثم لقب الحاكم ومات في الطاعون في نصف سنة ثلاث وخمسين وسبع مئة، وفي أيامه كان الطاعون العام سنة تسع وأربعين الذي لم يسمع بمثله {cite:tarikh-khulafa-minhaj-1434 p. 753-754}."
  en: "Cairo caliph [741–753]; his father's deed — witnessed by forty just men of Qus — was read in al-Mansur Abu Bakr's council of 11 Dhu'l-Hijja 741, Ibrahim deposed and Ahmad hailed as al-Hakim II. Ibn Fadl Allah: 'imam of our age, cloud of our Egypt — he revived the caliphate's rites and reunited his scattered house' {cite:tarikh-khulafa-minhaj-1434 p. 739-743}."
  fr: "Calife du Caire (741–753 H) ; l’acte de son père, attesté par quarante hommes intègres de Qus, fut lu au conseil d’al-Mansur Abu Bakr du 11 dhu al-hijja 741 H : Ibrahim fut déposé et Ahmad acclamé sous le nom d’al-Hakim II. Ibn Fadl Allah le qualifia d’« imam de notre temps, nuage de notre Égypte » et dit qu’il avait ranimé les rites du califat et réuni sa famille dispersée {cite:tarikh-khulafa-minhaj-1434 p. 739-743}."
  es: "Califa de El Cairo [741–753]; el acto de su padre —presenciado por cuarenta hombres justos de Qus— fue leído en el consejo de al-Mansur Abu Bakr del 11 de Dhu'l-Hijja de 741, Ibrahim fue depuesto y Ahmad aclamado como al-Hakim II. Ibn Fadl Allah: «Imán de nuestra época, nube de nuestro Egipto: revivió los ritos del califato y reunió a su casa dispersa» {cite:tarikh-khulafa-minhaj-1434 p. 739-743}."
  ur: "قاہرہ خلیفہ [741-753]؛ اس کے والد کا عمل - جس کی گواہی قوس کے چالیس عادل آدمی تھے - المنصور ابوبکر کی مجلس 11 ذی الحجہ 741 میں پڑھی گئی، ابراہیم معزول اور احمد کو الحاکم ثانی کہا گیا۔ ابن فضل اللہ: 'ہمارے زمانے کے امام، ہمارے مصر کے بادل - انھوں نے خلافت کے رسوم کو زندہ کیا اور اپنے بکھرے ہوئے گھر کو دوبارہ ملایا'۔ 739-743}۔"
  tr: "Kahire Halifesi [741–753 H.), Ebu el-Abbas Ahmed bin el-Mustaskafi, babası tarafından Kus'ta öldüğünde ona emanet edildi. Kuzeni İbrahim ona geldi. Sultan öldüğünde, konunun Veliaht Prens Ahmad'a geri verilmesini emretti. El-Mansur Ebu Bekir bin el-Nasir, kırk birinci yılın Zulhice ayının on birincisinde Perşembe günü bir konsey yaptı ve Halife İbrahim, Veliaht Prens Ahmed ve hakimleri çağırarak halifeliğe kimin yasal olarak hak ettiğini sordu. İbn Cema'ah, el-Mustaskafi'nin halifeliği oğlu Ahmad'a bıraktığını ve Kus'ta kırk yargıcın aleyhine tanıklık ettiğini, bu yüzden görevden alındığını söyledi İbrahim, Ahmed'e bağlılık yemini etti ve el-Hakim bi-Amr Allah unvanı dedesinin unvanıydı. İbn Fadlallah şöyle dedi: O, çağımızın ve Mısır'ımızın imamıdır, halifeliğin geleneklerini canlandırdı ve atalarının yollarını takip etti; bu yollar, babalarının oğulları tarafından silinip birleştirilmiş, büyük ölçüde dağılmıştı {atıf:History-Khulafa-minhaj-1434, s. 739-743}. İlk olarak El-Mustansir, sonra El-Hakim unvanı verildi ve 753 Hicri'nin yarısında veba nedeniyle öldü. Onun döneminde genel veba 49 yılında yaşandı, böyle bir şey daha önce duyulmamıştı {cite:History-Khulafa-minhaj-1434, s. 753-754}."
  id: "Khalifah Kairo [741–753 H], Abu al-Abbas Ahmad ibn al-Mustaskafi, dipercayakan kepadanya oleh ayahnya ketika ia meninggal di Qus. Sepupunya Ibrahim datang kepadanya. Ketika Sultan wafat, ia memerintahkan agar perkara itu dikembalikan kepada Putra Mahkota Ahmad. Al-Mansur Abu Bakr ibn al-Nasir mengadakan sidang pada hari Kamis, tanggal sebelas Dhu al-Hijjah tahun empat puluh satu, dan memanggil Khalifah Ibrahim, Putra Mahkota Ahmad, dan para hakim, menanyakan siapa yang secara hukum berhak atas kekhalifahan. Ibn Jama'ah mengatakan bahwa al-Mustaskafi telah mewariskan kekhalifahan kepada putranya Ahmad dan telah membuat empat puluh hakim di Qus bersaksi melawannya, sehingga ia digulingkan Ibrahim bersumpah setia kepada Ahmad, dan gelar al-Hakim bi-Amr Allah adalah gelar kakeknya. Ibn Fadlallah berkata: Ia adalah Imam zaman kita dan awan Mesir kita, menghidupkan kembali tradisi kekhalifahan dan mengikuti jejak leluhurnya, yang telah dihapus dan dipersatukan oleh putra-putra leluhurnya, yang sangat tersebar {cite:History-Khulafa-minhaj-1434, hlm. 739-743}. Ia pertama kali diberi gelar Al-Mustansir, kemudian gelar Al-Hakim, dan ia meninggal karena wabah pada setengah tahun 753 H. Pada masanya, wabah umum terjadi pada tahun 49, yang belum pernah terjadi {cite:History-Khulafa-minhaj-1434, hlm. 753-754}."
