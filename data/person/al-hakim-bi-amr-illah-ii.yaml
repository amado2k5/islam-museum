id: person/al-hakim-bi-amr-illah-ii
class: person
label: { ar: "الحاكم بأمر الله الثاني أحمد بن المستكفي", en: "al-Hakim bi-Amr Allah II Ahmad ibn al-Mustakfi", fr: "Al-Hakim bi-Amr Allah II Ahmad ibn al-Mustakfi", es: "al-Hakim bi-Amr Allah II Ahmad ibn al-Mustakfi" }
summary:
  ar: "خليفة القاهرة [٧٤١–٧٥٣هـ]، أبو العباس أحمد بن المستكفي، عهد إليه أبوه لما مات بقوص فقدم عليه ابن عمه إبراهيم فلما حضرت السلطان الوفاة أوصى برد الأمر إلى ولي العهد أحمد فعقد المنصور أبو بكر بن الناصر مجلساً يوم الخميس حادي عشر ذي الحجة سنة إحدى وأربعين وطلب الخليفة إبراهيم وولي العهد أحمد والقضاة وقال من يستحق الخلافة شرعاً فقال ابن جماعة إن المستكفي أوصى بالخلافة لولده أحمد وأشهد عليه أربعين عدلاً بقوص فخلع إبراهيم وبايع أحمد ولقب الحاكم بأمر الله لقب جده، وقال ابن فضل الله هو إمام عصرنا وغمام مصرنا أحيا رسوم الخلافة وسلك مناهج آبائه وقد طمست وجمع شمل بني أبيه وقد طال بهم الشتات {cite:tarikh-khulafa-minhaj-1434 p. 739-743}، وكان أولاً لقب المستنصر ثم لقب الحاكم ومات في الطاعون في نصف سنة ثلاث وخمسين وسبع مئة، وفي أيامه كان الطاعون العام سنة تسع وأربعين الذي لم يسمع بمثله {cite:tarikh-khulafa-minhaj-1434 p. 753-754}."
  en: "Cairo caliph [741–753]; his father's deed — witnessed by forty just men of Qus — was read in al-Mansur Abu Bakr's council of 11 Dhu'l-Hijja 741, Ibrahim deposed and Ahmad hailed as al-Hakim II. Ibn Fadl Allah: 'imam of our age, cloud of our Egypt — he revived the caliphate's rites and reunited his scattered house' {cite:tarikh-khulafa-minhaj-1434 p. 739-743}."
  fr: "Calife du Caire (741–753 H) ; l’acte de son père, attesté par quarante hommes intègres de Qus, fut lu au conseil d’al-Mansur Abu Bakr du 11 dhu al-hijja 741 H : Ibrahim fut déposé et Ahmad acclamé sous le nom d’al-Hakim II. Ibn Fadl Allah le qualifia d’« imam de notre temps, nuage de notre Égypte » et dit qu’il avait ranimé les rites du califat et réuni sa famille dispersée {cite:tarikh-khulafa-minhaj-1434 p. 739-743}."
  es: "Califa de El Cairo [741–753]; el acto de su padre —presenciado por cuarenta hombres justos de Qus— fue leído en el consejo de al-Mansur Abu Bakr del 11 de Dhu'l-Hijja de 741, Ibrahim fue depuesto y Ahmad aclamado como al-Hakim II. Ibn Fadl Allah: «Imán de nuestra época, nube de nuestro Egipto: revivió los ritos del califato y reunió a su casa dispersa» {cite:tarikh-khulafa-minhaj-1434 p. 739-743}."
