id: person/al-hakim-bi-amr-illah-ii
class: person
label: { ar: "الحاكم بأمر الله الثاني أحمد بن المستكفي" }
summary:
  ar: "خليفة القاهرة [٧٤١–٧٥٣هـ]، أبو العباس أحمد بن المستكفي، عهد إليه أبوه لما مات بقوص فقدم عليه ابن عمه إبراهيم فلما حضرت السلطان الوفاة أوصى برد الأمر إلى ولي العهد أحمد فعقد المنصور أبو بكر بن الناصر مجلساً يوم الخميس حادي عشر ذي الحجة سنة إحدى وأربعين وطلب الخليفة إبراهيم وولي العهد أحمد والقضاة وقال من يستحق الخلافة شرعاً فقال ابن جماعة إن المستكفي أوصى بالخلافة لولده أحمد وأشهد عليه أربعين عدلاً بقوص فخلع إبراهيم وبايع أحمد ولقب الحاكم بأمر الله لقب جده، وقال ابن فضل الله هو إمام عصرنا وغمام مصرنا أحيا رسوم الخلافة وسلك مناهج آبائه وقد طمست وجمع شمل بني أبيه وقد طال بهم الشتات {cite:tarikh-khulafa-minhaj-1434 p. 739-743}."
  en: "Cairo caliph [741–753]; his father's deed — witnessed by forty just men of Qus — was read in al-Mansur Abu Bakr's council of 11 Dhu'l-Hijja 741, Ibrahim deposed and Ahmad hailed as al-Hakim II. Ibn Fadl Allah: 'imam of our age, cloud of our Egypt — he revived the caliphate's rites and reunited his scattered house' {cite:tarikh-khulafa-minhaj-1434 p. 739-743}."
