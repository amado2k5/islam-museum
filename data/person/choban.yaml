summary:
  ar: "الأمير جوبان قائد مغولي من قبيلة السلدوز ادعت أسرته انحدارها من رجل أنقذ حياة جنكيز خان. خدم الإلخانات أرغون وغيخاتو وغازان وأولجايتو، وعيّنه أبو سعيد أمير الأمراء سنة 717هـ/1317م وتزوج أخته، فصار صاحب النفوذ الأكبر في الدولة، وحكم أبناؤه أقاليمها المهمة. ثم أراد أبو سعيد كسر شوكة الأسرة، فأعدم ابنه دمشق خواجه وأمر بقتله، ففرّ إلى هراة حيث قتله حاكمها الكرتي في أواخر 727 أو مطلع 728هـ/1327م {cite:encyclopaedia-of-islam-2 vol. 2 p. 82} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1155}."
  en: "Amir Choban was a Mongol commander of the Suldus tribe, whose family claimed descent from a man who once saved the life of Chingiz Khan. He served the Ilkhans Arghun, Gaykhatu, Ghazan and Oljeitu, was made amir al-umara by Abu Said in 717/1317 and married the Ilkhan's sister, and became the dominant power in the state, with his sons governing its main provinces. When Abu Said moved to break the family's power, he put Choban's son Dimashq Khwaja to death and ordered Choban's own execution; Choban fled to Herat, where its Kartid ruler had him killed in late 1327, in 727 or early 728 AH {cite:encyclopaedia-of-islam-2 vol. 2 p. 82} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1155}."
  ur: "امیر چوبان قبیلہ سلدوز کے ایک منگول سپہ سالار تھے جن کے خاندان کا دعویٰ تھا کہ وہ اس شخص کی نسل سے ہیں جس نے چنگیز خان کی جان بچائی تھی۔ انہوں نے ایل خانیوں ارغون، گیخاتو، غازان اور اولجایتو کی خدمت کی، ابو سعید نے 717ھ/1317ء میں انہیں امیر الامراء بنایا اور انہوں نے ایل خان کی بہن سے نکاح کیا، یوں وہ ریاست کی سب سے بڑی طاقت بن گئے اور ان کے بیٹے اہم صوبوں کے حاکم رہے۔ جب ابو سعید نے اس خاندان کی طاقت توڑنے کا ارادہ کیا تو چوبان کے بیٹے دمشق خواجہ کو قتل کرایا اور خود چوبان کے قتل کا حکم دیا؛ چوبان ہرات بھاگ گئے جہاں کرتی حاکم نے انہیں 1327ء کے آخر میں، 727 یا 728ھ کے آغاز میں، قتل کر دیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 82} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1155}."
