summary:
  ar: "عبد الغفار بن عبد الكريم بن عبد الغفار، نجم الدين القزويني، فقيه عالم بالحساب من فقهاء الشافعية. من تصانيفه «الحاوي الصغير» و«العجائب في شرح اللباب»، وكلاهما في فروع الفقه الشافعي، وكتاب في الحساب. توفي سنة 665 هـ بحسب ما ترجم له الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8202}"
  en: "Abd al-Ghaffar ibn Abd al-Karim ibn Abd al-Ghaffar, Najm al-Din al-Qazwini, a Shafi'i jurist who also knew arithmetic. His works include al-Hawi al-saghir and al-Aja'ib fi sharh al-lubab, both on Shafi'i law, and a book on arithmetic. The book gives 665 AH as his death year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8202}"
