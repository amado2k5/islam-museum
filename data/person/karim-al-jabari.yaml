summary:
  ar: "كريم الدين الجعبري المقرئ صاحب الشرح على الشاطبية والمصنفات المشهورة؛ قدم دمشق سنة اثنتين وثلاثين وأخذ عنه الشيخ شهاب الدين الطيبي الحديث ومصنفات ابن الجزري؛ توفي في نحو سنة تسع وثلاثين وتسعمائة {cite:shadharat-dhahab p. 586}."
  en: "The celebrated muqri' — author of the famous sharh on al-Shatibi's Shatibiyya; came to Damascus in 932 where Shihab al-Din al-Taybi took hadith and Ibn al-Jazari's works from him; d. about 939 {cite:shadharat-dhahab p. 586}."
  es: "El célebre muqri' —autor del famoso sharh sobre la Shatibiyya de al-Shatibi; llegó a Damasco en 932, donde Shihab al-Din al-Taybi tomó hadices y las obras de Ibn al-Jazari de él; murió alrededor de 939 {cita: shadharat-dhahab p. 586}."
  fr: "Le célèbre muqri' — auteur du célèbre sharh sur la Shatibiyya d'al-Shatibi; est venu à Damas en 932 où Shihab al-Din al-Taybi a pris de lui des hadiths et les œuvres d'Ibn al-Jazari; d. vers 939 {cite:shadharat-dhahab p. 586}."
  ur: "مشہور مقری - الشاطبی کے شاطبیہ پر مشہور شارح کے مصنف؛ 932 میں دمشق آیا جہاں شہاب الدین الطیبی نے ان سے حدیث اور ابن جزری کی تصانیف لی۔ d تقریباً 939 {حوالہ: شدھارت ذہاب ص۔ 586}۔"
  tr: "Kerim al-Din al-Ja'bari, şahiyet ve ünlü eserler üzerine tefsir yazarı; otuz iki yılında Şam'a geldi ve onun yanında Şeyh Şihabdin el-Teybi el-Hadis'i ve İbn al-Jazari'nin eserlerini inceledi; yaklaşık 939 Hicr yılında vefat etti {atıf:şadharat-zehab, s. 586}."
  id: "Karim al-Din al-Ja'bari, pembaca cerita, penulis komentar tentang al-Shatibiyyah dan karya-karya terkenal; ia datang ke Damaskus pada tahun tiga puluh dua dan mempelajari di bawah bimbingan Sheikh Shihab al-Din al-Taybi dan karya-karya Ibn al-Jazari; ia meninggal sekitar tahun 939 H {cite:shadharat-dhahab, hlm. 586}."
