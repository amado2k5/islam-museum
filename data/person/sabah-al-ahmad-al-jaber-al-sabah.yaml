summary:
  ar: "صباح الأحمد الجابر الصباح (16 يونيو 1929 – 29 سبتمبر 2020) أمير الكويت من يناير 2006 حتى وفاته. شغل وزارة الخارجية نحو أربعين عامًا (1963–2003) فصار عميد الدبلوماسية الكويتية ووسيطًا في نزاعات المنطقة، ثم رئاسة الوزراء (2003–2006)، وتولّى الإمارة بعد أزمة خلافة قصيرة تنازل فيها سعد العبد الله لأسباب صحية. كرّمته الأمم المتحدة سنة 2014 قائدًا للعمل الإنساني، وتوسّط في الأزمة الخليجية سنة 2017."
  en: "Sabah Al-Ahmad Al-Jaber Al-Sabah (16 June 1929 – 29 September 2020) was Emir of Kuwait from January 2006 until his death. He held the Foreign Ministry for some forty years (1963–2003), becoming the dean of Kuwaiti diplomacy and a mediator in the region's disputes, then the premiership (2003–2006), and took the emirate after a brief succession crisis in which Saad Al-Abdullah abdicated on health grounds. The United Nations honoured him in 2014 as a humanitarian leader, and he mediated in the Gulf crisis of 2017."
  ur: "صباح الاحمد الجابر الصباح (16 جون 1929ء – 29 ستمبر 2020ء) جنوری 2006ء سے اپنی وفات تک کویت کے امیر رہے۔ تقریباً چالیس برس (1963ء تا 2003ء) وزیرِ خارجہ رہے اور خطے کے تنازعات میں ثالث کے طور پر معروف ہوئے، پھر 2003ء تا 2006ء وزیر اعظم رہے اور سعد العبد اللہ کے صحت کی بنا پر دستبردار ہونے کے بعد امیر بنے۔"
