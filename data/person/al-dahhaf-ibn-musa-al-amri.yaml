  ar: "الدهف بن موسى العمري"
  en: "Al-Dahhaf ibn Musa al-Amri"
  fr: "Al-Dahhaf ibn Musa al-Amri"
  ur: "دہف بن موسیٰ العمری"
summary:
  ar: "رجل من بني الحارث، أغار ليلة النصف من رمضان سنة 294هـ على يدر بني مازن في نجران، فطلبه محمد بن عبيد الله، وأُسر في الموقحة مع رفاقه وأُودع الحبس، بحسب الكتاب."
  en: "A man of Banu al-Harith who raided Yadr of Banu Mazin in Najran on the night of 15 Ramadan 294 AH. Wanted by Muhammad ibn Ubaydallah, he was taken with companions at al-Muwaqqiha and jailed, as the book reports."
  fr: "Homme des Banu al-Harith qui attaqua Yadr des Banu Mazin à Najran la nuit du 15 ramadan 294 H. Recherché par Muhammad ibn Ubaydallah, il fut capturé avec des compagnons à al-Muwaqqiha et emprisonné, selon le récit du livre."
  ur: "بنی الحارث کا ایک آدمی، جس نے 294ھ کی پندرہ رمضان کی رات نجران میں بنی مازن کے یدر پر حملہ کیا۔ محمد بن عبید اللہ اسے ڈھونڈ رہے تھے، اور کتاب کے مطابق وہ الموقحہ میں اپنے ساتھیوں سمیت پکڑا گیا اور قید ہوا۔"
