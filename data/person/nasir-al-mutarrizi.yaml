summary:
  ar: "أبو الفتح ناصر بن عبد السيد بن علي المطرزي، الفقيه النحوي الأديب الخوارزمي؛ كان على مذهب الإمام أبي حنيفة في الفروع فصيحاً وكان في الفقه فاضلاً وله تصانيف نافعة منها شرح المقامات للحريري وكتاب المغرب الذي تكلم فيه على الألفاظ التي يستعملها الفقهاء من الغريب وهو للحنفية بمثابة كتاب الأزهري للشافعية؛ ودخل بغداد مجاوراً سنة إحدى وستمائة وكان معتزلي الاعتقاد وجرى له هناك مباحث مع جماعة من الفقهاء وأخذ أهل الأدب عنه {cite:wafayat-ayan}."
  en: "Abu al-Fath Nasir b. Abd al-Sayyid al-Mutarrizi of Khwarazm — Hanafi jurist, grammarian and adib; author of Sharh al-Maqamat and al-Mughrib on the jurists' technical vocabulary ('for the Hanafis what al-Azhari's Tahdhib is for the Shafi'is'); a Mu'tazili in belief {cite:wafayat-ayan}."
