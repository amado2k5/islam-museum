summary:
  ar: "مقرئ مصري للقرآن الكريم، يقرأ برواية حفص عن عاصم وله تسجيل صوتي كامل للقرآن تنشره منصات مثل «مسلم سنترال» و«قرآن سنترال» منذ 2019، وبنى جماهيرية عالمية عبر قناته الرسمية على يوتيوب التي تنشر تلاواته منذ نحو تسع سنوات وتجاوز مشتركوها 3.8 ملايين. لا توثّق المصادر المتاحة تاريخ ميلاده ولا أساتذته، فيبقى هذا السجل مختصراً عمداً."
  en: "Egyptian Qur'an reciter who recites in the Hafs 'an Asim narration. A complete recorded recitation of his has been circulated by platforms such as Muslim Central and Quran Central since 2019, and he has built a worldwide audience through his official YouTube channel, which has carried his recitations for about nine years and passed 3.8 million subscribers. The available sources document neither his birth nor his teachers, so this record is deliberately minimal."
  ur: "مصری قاریِ قرآن، جو حفص عن عاصم کی روایت میں تلاوت کرتے ہیں۔ ان کی مکمل ریکارڈ شدہ تلاوت 2019ء سے «مسلم سینٹرل» و «قرآن سینٹرل» جیسے پلیٹ فارم نشر کر رہے ہیں، اور ان کے سرکاری یوٹیوب چینل کے سبسکرائبرز 3.8 ملین سے تجاوز کر چکے ہیں۔ دستیاب ماخذ میں ان کی پیدائش یا اساتذہ کا ذکر نہیں، اس لیے یہ اندراج دانستہ مختصر ہے۔"
