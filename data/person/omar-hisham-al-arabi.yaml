summary:
  ar: "مقرئ مصري للقرآن الكريم، يقرأ برواية حفص عن عاصم وله تسجيل صوتي كامل للقرآن تنشره منصات مثل «مسلم سنترال» و«قرآن سنترال» منذ 2019، وبنى جماهيرية عالمية عبر قناته الرسمية على يوتيوب التي تنشر تلاواته منذ نحو تسع سنوات وتجاوز مشتركوها 3.8 ملايين. لا توثّق المصادر المتاحة تاريخ ميلاده ولا أساتذته، فيبقى هذا السجل مختصراً عمداً."
  en: "Egyptian Qur'an reciter who recites in the Hafs 'an Asim narration. A complete recorded recitation of his has been circulated by platforms such as Muslim Central and Quran Central since 2019, and he has built a worldwide audience through his official YouTube channel, which has carried his recitations for about nine years and passed 3.8 million subscribers. The available sources document neither his birth nor his teachers, so this record is deliberately minimal."
  ur: "مصری قاریِ قرآن، جو حفص عن عاصم کی روایت میں تلاوت کرتے ہیں۔ ان کی مکمل ریکارڈ شدہ تلاوت 2019ء سے «مسلم سینٹرل» و «قرآن سینٹرل» جیسے پلیٹ فارم نشر کر رہے ہیں، اور ان کے سرکاری یوٹیوب چینل کے سبسکرائبرز 3.8 ملین سے تجاوز کر چکے ہیں۔ دستیاب ماخذ میں ان کی پیدائش یا اساتذہ کا ذکر نہیں، اس لیے یہ اندراج دانستہ مختصر ہے۔"
  es: "Recitador egipcio del Corán que recita según la narración de Hafs 'an Asim. Una grabación completa de su recitación ha sido difundida por plataformas como Muslim Central y Quran Central desde 2019, y ha logrado una audiencia mundial a través de su canal oficial de YouTube, que ha publicado sus recitaciones durante aproximadamente nueve años y ha superado los 3,8 millones de suscriptores. Las fuentes disponibles no documentan ni su nacimiento ni a sus maestros, por lo que este registro es deliberadamente escueto."
  fr: "Ce récitateur égyptien du Coran récite selon la narration de Hafs an-Asim. Depuis 2019, un enregistrement complet de sa récitation est diffusé par des plateformes telles que Muslim Central et Quran Central. Grâce à sa chaîne YouTube officielle, qui diffuse ses récitations depuis environ neuf ans et compte plus de 3,8 millions d'abonnés, il a acquis une audience internationale. Les sources disponibles ne mentionnent ni sa naissance ni ses maîtres; cet enregistrement est donc volontairement succinct."
  tr: "Asim'in Hafs anlatımına göre okuyan Mısırlı bir Kur'an okuyucusu olan Sher, 2019'dan beri 'Muslim Central' ve 'Quran Central' gibi platformlarda yayımlanan tam bir Kur'an kaydına sahiptir. Resmi YouTube kanalı aracılığıyla küresel bir takipçi kitlesi oluşturmuş, yaklaşık dokuz yıldır okumalarını yayınlamaktadır ve 3,8 milyondan fazla abonesi vardır. Mevcut kaynaklar doğum tarihini veya öğretmenlerini belgelemediği için bu kayıt kasıtlı olarak kısa tutulmaktadır."
  id: "Sebagai pembaca Al-Qur'an Mesir yang membacakan menurut narasi Hafs dari Asim, ia memiliki rekaman audio lengkap Al-Qur'an yang diterbitkan oleh platform seperti 'Muslim Central' dan 'Quran Central' sejak 2019. Ia telah membangun pengikut global melalui saluran YouTube resminya, yang telah menerbitkan pembacaannya selama sekitar sembilan tahun dan memiliki lebih dari 3,8 juta pelanggan. Sumber yang tersedia tidak mendokumentasikan tanggal lahir atau gurunya, sehingga catatan ini sengaja dibuat singkat."
