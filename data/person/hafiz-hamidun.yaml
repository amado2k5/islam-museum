summary:
  ar: منشد وملحن ومنتج ماليزي وُلد سنة 1984 في جوهور؛ بدأ مع فرقة نداء ثم انطلق منفردًا بألبومات ناجحة، وأسس شركات للإنتاج والتجارة، ويُعدّ من مُحدِّثي الموسيقى الإسلامية في جنوب شرق آسيا.
  en: Malaysian nasheed artist, composer and producer born in Johor in 1984; after starting with the group Nada he launched a successful solo career, founded production and trading companies, and is counted
    among the modernisers of Southeast Asian Islamic music.
  ur: ملائشین نعت گلوکار، کمپوزر اور پروڈیوسر جو 1984 میں جوہور میں پیدا ہوا؛ گروپ ندا سے آغاز کے بعد کامیاب سولو کیریئر بنایا، پروڈکشن اور تجارتی کمپنیاں قائم کیں اور جنوب مشرقی ایشیائی اسلامی موسیقی کے
    جدید کاروں میں شمار ہوا۔
  es: "Artista, compositor y productor malasio de nasheed, nacido en Johor en 1984; tras comenzar con el grupo Nada, lanzó una exitosa carrera en solitario, fundó empresas de producción y comercialización, y se le considera uno de los modernizadores de la música islámica del sudeste asiático."
