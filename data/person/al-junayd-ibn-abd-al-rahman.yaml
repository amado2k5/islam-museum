class: person
label: { ar: "الجنيد بن عبد الرحمن المري", en: "al-Junayd ibn Abd al-Rahman al-Murri", es: "al-Junayd ibn Abd al-Rahman al-Murri", fr: "al-Junayd ibn Abd al-Rahman al-Murri", ur: "الجنید بن عبدالرحمٰن المری" }
summary:
  ar: "الجنيد بن عبد الرحمن المري؛ ولاه هشام خراسان سنة ١١٢ فحارب الترك وأخذت طلائعه ابن خاقان وهو سكران يتصيد فبعث به إلى هشام وأمده هشام بعشرين ألفاً وثلاثين ألف قناة وثلاثين ألف ترس وفرض لخمسة عشر ألفاً وكانت له مغاز وانتشرت دعاة بني هاشم في ولايته وتوفي بمرو وردت نواح من طخارستان كان نقضها إلى صلحها."
  en: "al-Junayd ibn Abd al-Rahman al-Murri; Hisham's governor from 112h — his scouts took the Khaqan's son drunk hunting, and Hisham armed him with twenty thousand men, thirty thousand spears and shields; the Hashimi da'is flourished in his rule. He died at Marw."
  es: "Al-Junayd ibn Abd al-Rahman al-Murri, gobernador de Hisham desde el año 112 de la Hégira, fue sorprendido por sus exploradores cazando al hijo del Khaqan, quien lo armó con veinte mil hombres, treinta mil lanzas y escudos. Los da'is Hashimi prosperaron durante su mandato. Murió en Marw."
  fr: "Al-Junayd ibn Abd al-Rahman al-Murri, gouverneur d'Hisham à partir de 112 H, fut arrêté par ses éclaireurs qui emmenèrent le fils du Khaqan à la chasse alors qu'il était ivre. Hisham l'arma alors de vingt mille hommes, trente mille lances et boucliers. Les da'is hasimi prospérèrent sous son règne. Il mourut à Marw."
  ur: "الجنید ابن عبدالرحمن المری؛ 112ھ میں ہشام کا گورنر - اس کے سپاہیوں نے خاقان کے بیٹے کو نشے میں شکار کیا اور ہشام نے اسے بیس ہزار آدمیوں، تیس ہزار نیزوں اور ڈھالوں سے مسلح کیا۔ ہاشمی داعی ان کے دور حکومت میں پروان چڑھا۔ مروہ میں وفات پائی۔"
  tr: "Al-Junayd ibn Abd al-Rahman al-Marri; Hisham onu 112 Hicri yılında Horasan'a atadı. Türklerle savaştı ve öncü birliği, sarhoşken avlanan İbn Khakan tarafından esir alındı, bu yüzden onu Hisham'a gönderdi, o da ona yirmi bin otuz bin kanal ve otuz bin kalkan sağladı ve on beş bin kalkan dayattı. Önemli bir etkisi vardı ve Banu Haşim'in misyonerleri eyaletine yayıldı. Marw'da öldü ve Tokharistan'dan ağıtlar alındı, daha sonra bu yer yeniden kuruldu."
  id: "Al-Junayd ibn Abd al-Rahman al-Marri; Hisham menunjuknya ke Khorasan pada tahun 112 H. Ia melawan Turki, dan pasukan depannya ditangkap oleh Ibn Khaqan yang sedang berburu dalam keadaan mabuk, sehingga ia mengirimnya ke Hisham, yang memberinya dua puluh ribu tiga puluh ribu kanal dan tiga puluh ribu perisai, serta memaksa lima belas ribu. Ia memiliki pengaruh besar, dan para misionaris Banu Hashim menyebar ke seluruh provinsinya. Ia meninggal di Marw, dan ratapan diterima dari Tokharistan, yang kemudian dipulihkan."
