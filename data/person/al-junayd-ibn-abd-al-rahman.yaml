summary:
  ar: "الجنيد بن عبد الرحمن المري؛ ولاه هشام خراسان سنة ١١٢ فحارب الترك وأخذت طلائعه ابن خاقان وهو سكران يتصيد فبعث به إلى هشام وأمده هشام بعشرين ألفاً وثلاثين ألف قناة وثلاثين ألف ترس وفرض لخمسة عشر ألفاً وكانت له مغاز وانتشرت دعاة بني هاشم في ولايته وتوفي بمرو وردت نواح من طخارستان كان نقضها إلى صلحها."
  en: "al-Junayd ibn Abd al-Rahman al-Murri; Hisham's governor from 112h — his scouts took the Khaqan's son drunk hunting, and Hisham armed him with twenty thousand men, thirty thousand spears and shields; the Hashimi da'is flourished in his rule. He died at Marw."
