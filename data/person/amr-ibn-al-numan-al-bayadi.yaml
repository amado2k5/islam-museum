id: person/amr-ibn-al-numan-al-bayadi
class: person
label: { ar: "عمرو بن النعمان البياضي", en: "Amr ibn al-Nu'man al-Bayadi", es: "Amr ibn al-Nu'man al-Bayadi", fr: "Amr ibn al-Nu'man al-Bayadi", ur: "عمرو بن النعمان البیادی" }
summary:
  ar: "رئيس الخزرج يوم بعاث — وعند ابن حزم أن رئيسهم يومئذ هو والد النعمان رُحَيْلَة بن ثعلبة البياضي؛ حلف أن لا يمس رأسه غسلاً حتى ينزل يهود يثرب منازل قريظة والنضير ويقتل رهنهم، فلما التقى الجمعان قال له عبد الله بن أُبيّ إنه يُقتل فيحمله أربعة في كفة، فعصى وقُتل وجيء به محمولاً على أربعة كما قال ابن أبيّ {cite:samhudi-wafa-al-wafa p. 229}."
  en: "Khazraj commander on the day of Bu'ath — though Ibn Hazm makes their chief that day al-Nu'man's father Ruhayla ibn Tha'laba al-Bayadi; he swore never to wash his head until he brought the Jews of Yathrib down to the dwellings of Qurayza and al-Nadir and killed their hostages, and when the hosts met 'Abdallah ibn Ubayy told him he would be carried off slain on four men's hands — he disobeyed, fell, and was borne in by four as foretold {cite:samhudi-wafa-al-wafa p. 229}."
  es: "Comandante de Khazraj el día de Bu'ath —aunque Ibn Hazm nombra a su jefe ese día, el padre de al-Nu'man, Ruhayla ibn Tha'laba al-Bayadi; juró no lavarse la cabeza hasta que llevara a los judíos de Yathrib a las moradas de Qurayza y al-Nadir y matara a sus rehenes, y cuando los ejércitos se encontraron, 'Abdallah ibn Ubayy le dijo que sería llevado muerto en manos de cuatro hombres — él desobedeció, cayó y fue llevado por cuatro como se predijo {cite:samhudi-wafa-al-wafa p. 229}."
  fr: "Le commandant Khazraj le jour de Bu'ath — bien qu'Ibn Hazm désigne comme chef ce jour-là le père d'al-Nu'man, Ruhayla ibn Tha'laba al-Bayadi; il jura de ne jamais se laver la tête avant d'avoir amené les Juifs de Yathrib aux demeures de Qurayza et d'al-Nadir et tué leurs otages, et lorsque les armées rencontrèrent 'Abdallah ibn Ubayy lui dit qu'il serait emporté et tué par quatre hommes — il désobéit, tomba et fut emporté par quatre comme prédit {cite:samhudi-wafa-al-wafa p. 229}."
  ur: "بعثت کے دن خزرج کا کمانڈر - حالانکہ ابن حزم اس دن نعمان کے والد روحیلہ بن ثعلبہ البیادی کو ان کا سردار بناتا ہے۔ اس نے قسم کھائی کہ وہ کبھی اپنا سر نہیں دھوئے گا جب تک کہ وہ یثرب کے یہودیوں کو قریظہ اور النضیر کی رہائش گاہوں تک نہ لے آئے اور ان کے یرغمالیوں کو قتل نہ کر دے، اور جب لشکر عبداللہ بن ابی سے ملے تو کہا کہ وہ چار آدمیوں کے ہاتھوں مارا جائے گا، اس نے نافرمانی کی، گرا، اور چاروں کو اٹھا کر لے جایا گیا۔ {حوالہ: سمہدی وفا الوفاء ص۔ 229}۔"
