summary:
  ar: "لاعب كريكت أسترالي سابق، رامي كسر ساق أيمن الذراع وُلد في صوابي بإقليم خيبر بختونخوا في باكستان. غادر باكستان سنة 2010 وطلب اللجوء في أستراليا قائلا إنه اضطُهد من متطرفين دينيين لممارسته الكريكت وتدريبه، فمُنح الإقامة الدائمة في نوفمبر 2012 والجنسية الأسترالية في يوليو 2013، ولعب ثلاث مباريات يوم واحد ومباراتين في العشرينيات الدولية لأستراليا في أغسطس وسبتمبر 2013، وهو أحد اثنين فقط من المولودين في باكستان مثّلا أستراليا. تصفه المصادر بأنه مسلم متدين أُزيل شعار شركة جعة عن قميصه سنة 2013، وأحرز أفضل أرقام رمي في تاريخ نهائيات درع شيفيلد بأخذه 8 ويكيت مقابل 89 جولة في نهائي 2014–15."
  en: "Australian former cricketer, a right-arm leg-spin bowler born in Swabi, Khyber Pakhtunkhwa, Pakistan. He left Pakistan in 2010 and sought asylum in Australia, saying he had been persecuted by religious extremists for playing and coaching cricket; he was granted permanent residency in November 2012 and Australian citizenship in July 2013, and played three One Day Internationals and two Twenty20 Internationals for Australia in August and September 2013 — one of only two Pakistan-born cricketers to represent Australia. The sources describe him as a devout Muslim who had a beer sponsor's logo removed from his shirt in 2013. In the 2014–15 Sheffield Shield final he took 8 for 89, the best bowling figures in a Shield final."
  ur: "آسٹریلیا کے سابق کرکٹ کھلاڑی، دائیں ہاتھ کے لیگ اسپن باؤلر، جو صوابی، خیبر پختونخوا، پاکستان میں پیدا ہوئے۔ وہ 2010 میں پاکستان چھوڑ کر آسٹریلیا آئے اور پناہ طلب کی، نومبر 2012 میں مستقل رہائش اور جولائی 2013 میں آسٹریلوی شہریت ملی، اور 2013 میں آسٹریلیا کے لیے تین ایک روزہ اور دو ٹی ٹوئنٹی بین الاقوامی میچ کھیلے۔ ماخذ انھیں پرہیزگار مسلمان قرار دیتا ہے جن کی شرٹ سے 2013 میں شراب ساز کمپنی کا لوگو ہٹایا گیا تھا۔"
  es: "Exjugador de críquet australiano, lanzador de pierna derecha nacido en Swabi, Khyber Pakhtunkhwa, Pakistán. Abandonó Pakistán en 2010 y solicitó asilo en Australia, alegando haber sido perseguido por extremistas religiosos por jugar y entrenar críquet; se le concedió la residencia permanente en noviembre de 2012 y la ciudadanía australiana en julio de 2013, y jugó tres partidos internacionales de un día y dos partidos internacionales Twenty20 para Australia en agosto y septiembre de 2013, siendo uno de los dos únicos jugadores de críquet nacidos en Pakistán en representar a Australia. Las fuentes lo describen como un musulmán devoto que hizo retirar el logotipo de un patrocinador de cerveza de su camiseta en 2013. En la final del Sheffield Shield de 2014-15 logró 8 wickets por 89 carreras, las mejores cifras de bolos en una final del Shield."
  fr: "Ancien joueur de cricket australien, lanceur de jambes droitier, né à Swabi, dans la province de Khyber Pakhtunkhwa, au Pakistan. Il a quitté le Pakistan en 2010 et a demandé l'asile en Australie, affirmant être persécuté par des extrémistes religieux pour avoir joué et entraîné au cricket. Il a obtenu la résidence permanente en novembre 2012 et la nationalité australienne en juillet 2013. Il a disputé trois matchs internationaux d'un jour et deux matchs internationaux de Twenty20 pour l'Australie en août et septembre 2013, devenant ainsi l'un des deux seuls joueurs de cricket nés au Pakistan à avoir représenté l'Australie. Selon certaines sources, il est un musulman pratiquant qui a fait retirer le logo d'un sponsor de bière de son maillot en 2013. Lors de la finale du Sheffield Shield 2014-2015, il a réalisé une performance de 8 guichets pour 89 courses concédées, la meilleure performance de bowling jamais enregistrée en finale du Shield."
  tr: "Eski Avustralyalı kriketçi Rami, sağ bacağını kırdı, Pakistan'ın Khyber Pakhtunkhwa eyaletine bağlı Swabi'de doğdu. 2010'da Pakistan'dan ayrıldı ve kriket oynadığı ve koçluk yaptığı için dini aşırılıkçılar tarafından zulme uğradığını iddia ederek Avustralya'da sığınma talebinde bulundu. Kasım 2012'de kalıcı oturma izni, Temmuz 2013'te ise Avustralya vatandaşlığı verildi ve Ağustos ve Eylül 2013'te üç tek günlük maç ve Avustralya T20'lerinde iki maç oynadı. Örneğin, Pakistan'da doğan sadece iki kişiden biridir, örneğin Avustralya. Kaynaklar, onu 2013'te gömleğinden Ja'ah Company logosunu çıkaran ve 2014–15 finalinde 89 inningde 8 kaleyi alarak Sheffield Shield finalleri tarihindeki en iyi bowling rakamlarını elde eden dindar bir Müslüman olarak tanımlar."
  id: "Mantan pemain kriket Australia, Rami mengalami patah kaki kanan, lahir di Swabi, provinsi Khyber Pakhtunkhwa, Pakistan. Ia meninggalkan Pakistan pada tahun 2010 dan mencari suaka di Australia, mengklaim ia dianiaya oleh ekstremis agama karena bermain dan melatih kriket. Ia diberikan izin tinggal permanen pada November 2012 dan kewarganegaraan Australia pada Juli 2013, serta bermain tiga pertandingan satu hari dan dua pertandingan di T20 Australia pada Agustus dan September 2013. Ia adalah salah satu dari hanya dua yang lahir di Pakistan, misalnya Australia. Sumber menggambarkannya sebagai Muslim taat yang menghapus logo Ja'ah Company dari bajunya pada tahun 2013 dan meraih angka bowling terbaik dalam sejarah final Sheffield Shield dengan mengambil 8 wicket melawan 89 inning di final 2014–15."
