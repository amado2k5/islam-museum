summary:
  ar: "لاعب كريكت أسترالي سابق، رامي كسر ساق أيمن الذراع وُلد في صوابي بإقليم خيبر بختونخوا في باكستان. غادر باكستان سنة 2010 وطلب اللجوء في أستراليا قائلا إنه اضطُهد من متطرفين دينيين لممارسته الكريكت وتدريبه، فمُنح الإقامة الدائمة في نوفمبر 2012 والجنسية الأسترالية في يوليو 2013، ولعب ثلاث مباريات يوم واحد ومباراتين في العشرينيات الدولية لأستراليا في أغسطس وسبتمبر 2013، وهو أحد اثنين فقط من المولودين في باكستان مثّلا أستراليا. تصفه المصادر بأنه مسلم متدين أُزيل شعار شركة جعة عن قميصه سنة 2013، وأحرز أفضل أرقام رمي في تاريخ نهائيات درع شيفيلد بأخذه 8 ويكيت مقابل 89 جولة في نهائي 2014–15."
  en: "Australian former cricketer, a right-arm leg-spin bowler born in Swabi, Khyber Pakhtunkhwa, Pakistan. He left Pakistan in 2010 and sought asylum in Australia, saying he had been persecuted by religious extremists for playing and coaching cricket; he was granted permanent residency in November 2012 and Australian citizenship in July 2013, and played three One Day Internationals and two Twenty20 Internationals for Australia in August and September 2013 — one of only two Pakistan-born cricketers to represent Australia. The sources describe him as a devout Muslim who had a beer sponsor's logo removed from his shirt in 2013. In the 2014–15 Sheffield Shield final he took 8 for 89, the best bowling figures in a Shield final."
  ur: "آسٹریلیا کے سابق کرکٹ کھلاڑی، دائیں ہاتھ کے لیگ اسپن باؤلر، جو صوابی، خیبر پختونخوا، پاکستان میں پیدا ہوئے۔ وہ 2010 میں پاکستان چھوڑ کر آسٹریلیا آئے اور پناہ طلب کی، نومبر 2012 میں مستقل رہائش اور جولائی 2013 میں آسٹریلوی شہریت ملی، اور 2013 میں آسٹریلیا کے لیے تین ایک روزہ اور دو ٹی ٹوئنٹی بین الاقوامی میچ کھیلے۔ ماخذ انھیں پرہیزگار مسلمان قرار دیتا ہے جن کی شرٹ سے 2013 میں شراب ساز کمپنی کا لوگو ہٹایا گیا تھا۔"
