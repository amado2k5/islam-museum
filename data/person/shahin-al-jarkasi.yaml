summary:
  ar: "شاهين بن عبد الله الجركسي العابد الزاهد الشيخ العارف الدال المرشد؛ كان من مماليك السلطان قايتباي وكان مقرباً عنده فسأل السلطان أن يعتقه ويخليه لعبادة ربه ففعل، وساح إلى بلاد العجم وغيرها وأخذ الطريق عن سيدي أحمد بن عقبة المدفون بحوش السلطان برقوق، فلما مات صحب نحو ستين شيخاً، ولما دخل العجم أخذ عن سيدي عمر روشني بتبريز ثم رجع إلى مصر وأقام بالمحل الذي دُفن فيه من جبل المقطم وبنى له فيه معبداً، وكان لا ينزل إلى مصر إلا لضرورة شديدة ثم انقطع لا ينزل من الجبل سبعاً وأربعين سنة واشتهر بالصلاح في الدولتين، وكان أمراء مصر وقضاتها وأكابرها يزورونه ويتبركون به وكان يغتسل لكل صلاة؛ ومن كراماته أنه قام للوضوء بالليل فلم يجد ما فيه فإذا بشخص طائر في الهواء وفي عنقه قربة ماء فأفرغها في الخابية ثم رجع طائراً نحو النيل؛ توفي في شوال ودُفن بزاويته في الجبل وبنى السلطان عليه قبة ووقف على مكانه أوقافاً {cite:shadharat-dhahab p. 718}."
  en: "Qaytbay's freed mamluk — he asked his master for manumission to worship, wandered to the 'Ajam lands, took the path from 'Umar Rawsani at Tabriz, then settled on the Muqattam where he did not descend for forty-seven years; Egypt's amirs, qadis and notables climbed to visit him; the flying water-skin karama; the sultan built a qubba over his zawiya {cite:shadharat-dhahab p. 718}."
  es: "El mameluco liberado de Qaytbay pidió a su amo la manumisión para adorar, vagó por las tierras de 'Ajam, tomó el camino de 'Umar Rawsani en Tabriz, y luego se estableció en el Muqattam donde no descendió durante cuarenta y siete años; los emires, cadíes y notables de Egipto subieron para visitarlo; el karama del odre de agua volador; el sultán construyó una qubba sobre su zawiya {cite:shadharat-dhahab p. 718}."
  fr: "Qaytbay, un mamelouk affranchi, demanda à son maître l'affranchissement pour pouvoir pratiquer son culte, erra jusqu'aux terres d'Ajam, prit le chemin d'Umar Rawsani à Tabriz, puis s'installa sur le Muqattam où il ne descendit pas pendant quarante-sept ans; les émirs, les cadis et les notables d'Égypte montèrent pour lui rendre visite; le karama, une outre volante; le sultan fit construire une qubba au-dessus de sa zawiya {cite: shadharat-dhahab p. 718}."
  ur: "قطبی کے آزاد کردہ مملوک - اس نے اپنے آقا سے عبادت کی اجازت طلب کی، سرزمینِ عجم کی طرف گھوم کر تبریز میں عمر راوثانی سے راستہ لیا، پھر مقطم پر سکونت اختیار کی جہاں وہ سینتالیس سال تک نہیں اترا۔ مصر کے امیر، قادیان اور معززین اس کی عیادت کے لیے چڑھے۔ اڑتا ہوا پانی کی جلد کا کراما؛ سلطان نے اپنی زاویہ پر قبہ تعمیر کروایا۔ 718}۔"
  tr: "Dindar, münzevi, bilgili ve rehber bir şeyh olan Shaheen bin Abdullah Al-Jarkasi, Sultan Qaitbay'in memlüklerinden biriydi ve ona yakındı. Sultan'dan onu serbest bırakmasını ve Rabbi'nin ibadetine bırakmasını istedi ve Padşah da bunu yaptı. Perslerin topraklarına ve başka yerlere seyahat etti, Sidi Ahmed bin Uqba'dan yola çıktı; Sultan Barquq'un sarayında gömülü. Öldüğünde yaklaşık altmış şeyhle birlikte kaldı. Perslere girdiğinde, Tebriz'de Sidi Omar Roshni'nin yanında eğitim aldı, sonra Mısır'a döndü ve gömülüldüğü yerde, kendisi için bir tapınak inşa edilen Mokattam Dağı'nda kaldı. O Mısır'a ancak acil bir zorunluluk olursa gelirdi, ardından kırk yedi yıl boyunca dağdan ayrılmamıştır. Her iki ülkede de doğruluğuyla tanınmıştır. Mısır'ın prensleri, yargıçları ve ileri gelenleri onu ziyaret eder, ondan bereket isterler ve her namazda hüsl yapardı. Mucizelerinden biri, gece abdest alma yapar ama içinde hiçbir şey bulamaz, boynunda bir su tankı olan havada uçan bir kuş görür, su deposuna boşaltır ve sonra Nil'e doğru uçarak geri dönerdi. Şavval'da öldü ve dağdaki zawiyasında gömüldü. Sultan üzerine bir kubbe inşa etti ve yerine vakıflar kurdu {atıf:shadharat-dhahab s. 718}."
  id: "Shaheen bin Abdullah Al-Jarkasi, sheikh yang taat, pertapa, berpengetahuan, dan bijaksana sebagai pembimbing, adalah salah satu mamluk Sultan Qaitbay dan dekat dengannya. Ia meminta Sultan untuk membebaskannya dan meninggalkannya untuk disembah kepada Tuhan, dan ia pun melakukannya. Ia melakukan perjalanan ke tanah Persia dan tempat lain, mengambil jalur dari Sidi Ahmad bin Uqba, yang dimakamkan di istana Sultan Barquq. Ketika ia meninggal, ia menemani sekitar enam puluh sheikh. Ketika ia memasuki wilayah Persia, ia belajar di bawah Sidi Omar Roshni di Tabriz, lalu kembali ke Mesir dan tinggal di tempat ia dimakamkan di Gunung Mokattam, di mana sebuah kuil dibangun untuknya. Ia adalah Ia tidak datang ke Mesir kecuali karena kebutuhan mendesak, lalu ia tidak berhenti meninggalkan gunung selama empat puluh tujuh tahun. Ia terkenal karena kebenarannya di kedua negara. Para pangeran, hakim, dan pejabat Mesir mengunjunginya dan memohon berkah darinya, dan ia melakukan ghusl untuk setiap doa. Di antara mukjizatnya adalah ia melakukan wudhu pada malam hari tetapi tidak menemukan apa pun di dalamnya, dan melihat seekor burung terbang di udara dengan tangki air di lehernya, yang ia tuangkan ke dalam gudang, lalu kembali terbang kembali ke arah Sungai Nil. Ia meninggal di Shawwal dan dimakamkan di zawiya miliknya di gunung. Sultan membangun kubah di atasnya dan mendirikan wakaf di lokasinya {cite:shadharat-dhahab hlm. 718}."
