summary:
  ar: "شاهين بن عبد الله الجركسي العابد الزاهد الشيخ العارف الدال المرشد؛ كان من مماليك السلطان قايتباي وكان مقرباً عنده فسأل السلطان أن يعتقه ويخليه لعبادة ربه ففعل، وساح إلى بلاد العجم وغيرها وأخذ الطريق عن سيدي أحمد بن عقبة المدفون بحوش السلطان برقوق، فلما مات صحب نحو ستين شيخاً، ولما دخل العجم أخذ عن سيدي عمر روشني بتبريز ثم رجع إلى مصر وأقام بالمحل الذي دُفن فيه من جبل المقطم وبنى له فيه معبداً، وكان لا ينزل إلى مصر إلا لضرورة شديدة ثم انقطع لا ينزل من الجبل سبعاً وأربعين سنة واشتهر بالصلاح في الدولتين، وكان أمراء مصر وقضاتها وأكابرها يزورونه ويتبركون به وكان يغتسل لكل صلاة؛ ومن كراماته أنه قام للوضوء بالليل فلم يجد ما فيه فإذا بشخص طائر في الهواء وفي عنقه قربة ماء فأفرغها في الخابية ثم رجع طائراً نحو النيل؛ توفي في شوال ودُفن بزاويته في الجبل وبنى السلطان عليه قبة ووقف على مكانه أوقافاً {cite:shadharat-dhahab p. 718}."
  en: "Qaytbay's freed mamluk — he asked his master for manumission to worship, wandered to the 'Ajam lands, took the path from 'Umar Rawsani at Tabriz, then settled on the Muqattam where he did not descend for forty-seven years; Egypt's amirs, qadis and notables climbed to visit him; the flying water-skin karama; the sultan built a qubba over his zawiya {cite:shadharat-dhahab p. 718}."
