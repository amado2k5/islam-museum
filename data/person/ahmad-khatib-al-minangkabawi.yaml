faith:
  - value: sunni-shafii
    basis: documented
    note: "Two independent text traditions present his Shafi'i affiliation as his own, beyond the Meccan office he held. The English article's text, resting on Von der Mehden (1993) and Mudhafier (2013), calls him an orthodox Sunni Muslim who served as the head (imam) of the Shafi'i school of law at the mosque of Mecca; his full name carries the nisba asy-Syafi'i, and his own works include Shafi'i fiqh writing (Ar-Riyadh al-Wardiyyah fi Ushul al-Tawhid wa-l-Fiqh asy-Syafi'i, and his supercommentary on the Shafi'i manual Fath al-Jawwad). The Indonesian article, an independent tradition resting on Indonesian scholarship, records that his students were generally taught Shafi'i fiqh by him and enrols him in Siradjuddin Abbas's Thabaqat asy-Syafi'iyah, the biographical dictionary of Shafi'i scholars. The English infobox (Sunni Islam, Shafi'i) is the same family as the English text; the Arabic and Urdu articles are translations of the English and count with its family. Wikidata gives Islam in general only. The al-Asy'ari element of his name is not recorded as a segment: the faith enum has no sunni-ashari compound. His critique of Naqshbandi grave-visitation and rabithah is noted in the prose; no Sufi affiliation is attested for him."
