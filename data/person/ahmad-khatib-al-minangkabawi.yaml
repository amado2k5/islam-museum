summary:
  ar: "عالم من مينانغكابو (1860–1916) صار إمام الشافعية وخطيبهم في المسجد الحرام بمكة، ودرّس فيه جيلًا من علماء الملايو وإندونيسيا، وألّف في الفقه الشافعي والعقيدة والحساب، وكتب في نقد بعض ممارسات الطريقة النقشبندية، وعُرف دفاعه عن المذهب في وجه الإصلاحيين الشباب."
  en: "Minangkabau scholar (1860–1916) who became imam and preacher of the Shafi'i school at the Grand Mosque of Mecca, taught a generation of Malay and Indonesian scholars there, wrote on Shafi'i fiqh, doctrine and arithmetic, criticised some Naqshbandi practices, and was known for defending the madhhab against the young reformers."
  ur: "مینانگکاباؤ عالم (1860ء–1916ء) جو مکہ کی مسجد الحرام میں شافعی مذہب کے امام و خطیب بنے، وہاں ملایو اور انڈونیشی علماء کی ایک نسل کو پڑھایا، فقہ شافعی، عقائد اور حساب پر کتابیں لکھیں، بعض نقشبندی اعمال پر تنقید کی اور نوجوان مصلحین کے مقابلے میں مذہب کے دفاع کے لیے مشہور ہوئے۔"
