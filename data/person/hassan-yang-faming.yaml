summary:
  ar: "عالم وإمام صيني من قومية هوي، وُلد سنة 1965 بقضاء خيلان في نينغشيا، اسمه الديني حسن. انتُخب رئيسًا للجمعية الإسلامية الصينية سنة 2016، وهي الهيئة الحكومية التي تربط الدولة بالمسلمين في الصين، وعضو المؤتمر الاستشاري السياسي للشعب الصيني."
  en: "Chinese Hui imam and religious leader, born in 1965 in Helan County, Ningxia, whose religious name is Hassan. Elected president of the China Islamic Association in 2016 — the government-linked body liaising between the state and China's Muslims — and a member of the Chinese People's Political Consultative Conference."
  ur: "چینی ہوئی مسلمان امام اور مذہبی رہنما، 1965ء میں نینگشیا کے ضلع ہیلان میں پیدا ہوئے، ان کا مذہبی نام حسن ہے۔ 2016ء میں چائنا اسلامک ایسوسی ایشن کے صدر منتخب ہوئے — وہ ریاستی منسلک ادارہ جو ریاست اور چین کے مسلمانوں کے درمیان رابطہ قائم رکھتا ہے — اور چینی عوامی سیاسی مشاورتی کانفرنس کے رکن ہیں۔"
  es: "Imán y líder religioso chino de la etnia Hui, nacido en 1965 en el condado de Helan, Ningxia, cuyo nombre religioso es Hassan. Fue elegido presidente de la Asociación Islámica de China en 2016 —el organismo vinculado al gobierno que sirve de enlace entre el Estado y los musulmanes de China— y es miembro de la Conferencia Consultiva Política del Pueblo Chino."
  fr: "Imam et chef religieux Hui chinois, né en 1965 dans le comté de Helan, au Ningxia, de son nom religieux Hassan. Élu président de l'Association islamique de Chine en 2016 – organe lié au gouvernement assurant la liaison entre l'État et les musulmans de Chine – et membre de la Conférence consultative politique du peuple chinois."
  tr: "1965 yılında Ningxia'nın Khilan Bölgesi'nde doğan Hui etnik kökenli Çinli bir alim ve imam olan Jennet'in dini adı Hassan'dır. 2016 yılında Çin İslam Derneği'nin başkanı seçildi; bu kurum devleti Çin'deki Müslümanlarla birleştiren devlet kurumu ve Çin Halk Siyasi Danışma Konferansı üyesidir."
  id: "Seorang ulama dan imam Tiongkok dari etnis Hui, lahir pada tahun 1965 di Distrik Khilan, Ningxia, nama agamanya adalah Hassan. Ia terpilih sebagai presiden Asosiasi Islam Tiongkok pada tahun 2016, badan pemerintahan yang menghubungkan negara dengan Muslim di Tiongkok, serta anggota Konferensi Konsultatif Politik Rakyat Tiongkok."
