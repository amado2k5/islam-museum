summary:
  ar: "تون بيراك (ت. 1498)، خامس بنداهارا (رئيس وزراء) لسلطنة ملقا وأشهرهم، وابن بنداهارا سري واك راجا. عُيّن حاكمًا على كلاغ سنة 1445، وقاد الدفاع عن ملقا ضد الهجوم السيامي سنة 1456، فعُيّن بنداهارا وخدم أربعة سلاطين — مظفر شاه ومنصور شاه وعلاء الدين رعاية شاه ومحمود شاه — حتى وفاته سنة 1498، وبلغت ملقا في وزارته أقصى اتساعها في شبه جزيرة الملايو وجزر رياو وسواحل سومطرة. وحين قتل الأمير راجا محمد ابنه تون بسار رفض الانتقام من بيت السلطان."
  en: "Tun Perak (d. 1498), fifth and most famous bendahara (chief minister) of the Malacca Sultanate, and son of the Bendahara Seri Wak Raja. Appointed chieftain of Klang in 1445, he led the defence of Malacca against the Siamese attack of 1456 and was made bendahara, serving four sultans — Muzaffar Shah, Mansur Shah, Alauddin Riayat Shah and Mahmud Shah — until his death in 1498, while Malacca reached its greatest extent across the Malay Peninsula, the Riau islands and the Sumatran coast. When the prince Raja Muhammad killed his son Tun Besar, he refused to take revenge on the sultan's house."
  ur: "تن پیراک (وفات 1498ء)، سلطنت ملاکا کے پانچویں اور سب سے مشہور بنداہارا (وزیر اعظم)، اور بنداہارا سری واک راجا کے بیٹے تھے۔ وہ 1445ء میں کلانگ کے سردار مقرر ہوئے، 1456ء میں سیامی حملے کے خلاف ملاکا کے دفاع کی قیادت کی اور بنداہارا بنائے گئے؛ انھوں نے چار سلطانوں — مظفر شاہ، منصور شاہ، علاء الدین رعایہ شاہ اور محمود شاہ — کی 1498ء میں اپنی وفات تک خدمت کی، اور ان کی وزارت میں ملاکا جزیرہ نما ملایا، جزائر ریاؤ اور سماٹرا کے ساحل تک اپنی وسیع ترین حد کو پہنچا۔ جب شہزادے راجا محمد نے ان کے بیٹے تن بیسار کو قتل کیا تو انھوں نے سلطان کے خاندان سے انتقام لینے سے انکار کر دیا۔"

