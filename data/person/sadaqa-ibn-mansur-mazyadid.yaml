id: person/sadaqa-ibn-mansur-mazyadid
class: person
label:
  ar: صدقة بن منصور المزيدي ملك العرب
  en: Sadaqa ibn Mansur al-Mazyadidi, King of the Arabs
  es: "Sadaqa ibn Mansur al-Mazyadidi, King of the Arabs"
  fr: "Sadaqa ibn Mansur al-Mazyadidi, King of the Arabs"
  ur: "صدقہ بن منصور المزیدیدی، عربوں کا بادشاہ"
summary:
  ar: "صدقة بن منصور بن دبيس بن علي بن مزيد الأسدي، أمير بني مزيد وباني الحلة بالعراق؛ كان من أعظم أنصار السلطان محمد بن ملك شاه على أخيه بركيارق فأقطعه واسطاً وأذن له في ملك البصرة، ثم أجرى سرخاب بن كيخسرو فنازعه السلطان في الملك، فلما لقيه آخر رجب سنة 501هـ تخاذلت عنه عبادة وخفاجة وحمل على الترك وهو ينادي «أنا ملك العرب أنا صدقة» فأصابه سهم وقتله غلام تركي يدعى برغش وحمل رأسه إلى السلطان، وذلك لإحدى وعشرين سنة من إمارته؛ كان جواداً حليماً صدوقاً عادلاً، يقرأ ولا يكتب، وله خزانة كتب منسوبة الخط."
  en: "Sadaqa ibn Mansur ibn Dubays ibn Ali ibn Mazyad al-Asadi, amir of Banu Mazyad and builder of al-Hilla in Iraq; among the strongest backers of Sultan Muhammad ibn Malikshah against Barkyaruq, who enfeoffed him Wasit and licensed him over Basra — but he sheltered Sarkhab ibn Kaykhusraw and the sultan contested the realm with him; meeting him at the end of Rajab 501 AH with Ubada and Khafaja deserting him, he charged the Turks crying 'I am the king of the Arabs, I am Sadaqa', an arrow pinned him and a Turkish ghulam named Barghash killed him and bore his head to the sultan — in the twenty-first year of his emirate; generous, forbearing, truthful and just, he could read but not write and kept a library of finely copied books."
  es: "Sadaqa ibn Mansur ibn Dubays ibn Ali ibn Mazyad al-Asadi, emir de Banu Mazyad y constructor de al-Hilla en Irak; uno de los más firmes partidarios del sultán Muhammad ibn Malikshah contra Barkyaruq, quien le otorgó el feudo de Wasit y le concedió el gobierno de Basora; pero él dio refugio a Sarkhab ibn Kaykhusraw y el sultán disputó el reino con él; al encontrarse con él a finales de Rajab del año 501 de la Hégira, con Ubada y Khafaja abandonándolo, cargó contra los turcos gritando \"Soy el rey de los árabes, soy Sadaqa\", una flecha lo clavó y un ghulam turco llamado Barghash lo mató y le mostró su cabeza al sultán, en el vigésimo primer año de su emirato; generoso, tolerante, veraz y justo, sabía leer pero no escribir y poseía una biblioteca de libros finamente copiados."
  fr: "Sadaqa ibn Mansur ibn Dubays ibn Ali ibn Mazyad al-Asadi, émir des Banu Mazyad et bâtisseur d'al-Hilla en Irak, fut l'un des plus fervents soutiens du sultan Muhammad ibn Malikshah contre Barkyaruq, qui lui confia Wasit et lui accorda le contrôle de Bassora. Cependant, il abrita Sarkhab ibn Kaykhusraw, et le sultan contesta le royaume avec lui. À la fin du mois de Rajab 501 AH, alors qu'Ubada et Khafaja l'avaient abandonné, il chargea les Turcs en criant: « Je suis le roi des Arabes, je suis Sadaqa ! ». Une flèche le transperça, et un ghulam turc nommé Barghash le tua et apporta sa tête au sultan, la vingt-et-unième année de son émirat. Généreux, indulgent, véridique et juste, il savait lire mais ne savait pas écrire, et possédait une bibliothèque de livres finement copiés."
  ur: "صدقہ ابن منصور ابن دبیس ابن علی ابن مازیاد الاسدی، بنو مازیاد کے امیر اور عراق میں الحلّہ کے معمار؛ برقیاروق کے خلاف سلطان محمد بن مالک شاہ کے سب سے مضبوط حامیوں میں سے تھے، جنہوں نے اسے وصیت پر قبضہ کیا اور اسے بصرہ پر لائسنس دیا - لیکن اس نے سرخاب بن کیخسرو کو پناہ دی اور سلطان نے اس کے ساتھ سلطنت کا مقابلہ کیا۔ رجب 501 ہجری کے آخر میں عبادہ اور خفجہ کے ساتھ اس سے ملاقات ہوئی، اس نے ترکوں پر الزام لگایا کہ 'میں عربوں کا بادشاہ ہوں، میں صدقہ ہوں'، ایک تیر اس کو لگا اور برگاش نامی ترک غلام نے اسے قتل کر دیا اور اس کا سر 25 سال میں سلطان کے سپرد کر دیا۔ سخی، بردبار، سچے اور انصاف پسند، وہ پڑھ تو سکتے تھے لیکن لکھ نہیں سکتے تھے اور باریک نقل شدہ کتابوں کی لائبریری رکھتے تھے۔"
  tr: "Sadaqah ibn Mansur ibn Dubays ibn Ali ibn Mazid al-Asadi, Banu Mazid Emiri ve Irak'ta Hillah'ın kurucusuydu; Sultan Muhammed bin Malik Şah'ın kardeşi Barkiyariq'e karşı en büyük destekçilerinden biriydi. Ona Arabulucu ve Basra'yı yönetme izni verdi. Sonra Sarkhab ibn Kaykhosrow'a başvurdu ve sultan taht için onunla tartıştı. 501 Hicri'nde Recep'in sonunda onunla karşılaştığında ibadet ve isyanı bıraktı. 'Ben Arapların Kralıyım, ben Sadaqah'ım.' diye bağırırken Türklere saldırdı. Türk çocuk Barghash tarafından bir ok isabet edildi ve öldürüldü; Barghash, sultanın yirmi bir yıl boyunca başını kesti. Cömert, hoşgörülü, dürüst ve adildi, okuyup yazabiliyordu ve hat sanatına atfedilen bir kitap kütüphanesi vardı."
  id: "Sadaqah ibn Mansur ibn Dubays ibn Ali ibn Mazid al-Asadi, Emir Banu Mazid dan pembangun Hillah di Irak, adalah salah satu pendukung terbesar Sultan Muhammad ibn Malik Shah atas saudaranya Barkiyariq. Ia memberinya mediator dan izin untuk memerintah Basra. Kemudian ia beralih kepada Sarkhab ibn Kaykhosrow, dan sultan memperebutkannya atas takhta. Ketika bertemu dengannya di akhir Rajab pada tahun 501 H, ia meninggalkan ibadah dan pemberontakannya. Ia menyerang Turki saat berteriak, 'Aku Raja Arab, aku Sadaqah.' Ia terkena panah dan dibunuh oleh seorang anak Turki bernama Barghash, yang memenggal kepala sultan selama dua puluh satu tahun pemerintahannya. Ia murah hati, pemaaf, jujur, dan adil, mampu membaca dan tidak menulis, serta memiliki perpustakaan buku yang dikaitkan dengan kaligrafi."
