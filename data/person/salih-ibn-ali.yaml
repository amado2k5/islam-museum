id: person/salih-ibn-ali
class: person
label: { ar: "صالح بن علي", en: "Salih ibn Ali" }
summary:
  ar: "صالح بن علي بن عبد الله بن العباس، من أمراء الدعوة العباسية وأول ولاتها على الشام؛ عند البلاذري: بلغه أن قوماً بجبل لبنان شكوا عامل خراج بعلبك وأن الروم مالؤهم فأمدّهم بمن قتل مقاتلهم وأقرّ من بقي على دينهم وردّهم إلى قراهم وأجلى قوماً من أهل لبنان، فكتب إليه الأوزاعي رسالته المشهورة في إنكار أخذ العامة بذنوب الخاصة؛ وصارت دار الصباغين بالرملة لورثته إذ قبضت مع أموال بني أمية. ورحل في طلب مروان بن محمد ومعه أبو عون عبد الملك بن يزيد وعامر بن إسماعيل المذحجي فلحقوه بمصر نازلاً ببوصير فهجموا على عسكره ليلاً ونادوا يا لثارات إبراهيم {cite:muruj-al-dhahab p. 233}"
  en: "Salih ibn Ali ibn Abdullah ibn al-Abbas, prince of the Abbasid da'wa and its first governor over Syria; in al-Baladhuri: when word reached him that a company in Mount Lebanon had complained of Ba'labakk's kharaj administrator and that the Byzantines had abetted them, he sent troops who killed their fighters, kept the rest on their religion, returned them to their villages and exiled a company of Lebanon's people — whereupon al-Awza'i wrote him his famous letter decrying punishment of the many for the sins of the few; the House of the Dyers at al-Ramla passed to his heirs, seized with Umayyad wealth."
