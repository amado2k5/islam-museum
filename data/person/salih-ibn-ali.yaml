id: person/salih-ibn-ali
class: person
label: { ar: "صالح بن علي", en: "Salih ibn Ali", es: "Salih ibn Ali", fr: "Salih ibn Ali" }
summary:
  ar: "صالح بن علي بن عبد الله بن العباس، من أمراء الدعوة العباسية وأول ولاتها على الشام؛ عند البلاذري: بلغه أن قوماً بجبل لبنان شكوا عامل خراج بعلبك وأن الروم مالؤهم فأمدّهم بمن قتل مقاتلهم وأقرّ من بقي على دينهم وردّهم إلى قراهم وأجلى قوماً من أهل لبنان، فكتب إليه الأوزاعي رسالته المشهورة في إنكار أخذ العامة بذنوب الخاصة؛ وصارت دار الصباغين بالرملة لورثته إذ قبضت مع أموال بني أمية. ورحل في طلب مروان بن محمد ومعه أبو عون عبد الملك بن يزيد وعامر بن إسماعيل المذحجي فلحقوه بمصر نازلاً ببوصير فهجموا على عسكره ليلاً ونادوا يا لثارات إبراهيم {cite:muruj-al-dhahab p. 233}"
  en: "Salih ibn Ali ibn Abdullah ibn al-Abbas, prince of the Abbasid da'wa and its first governor over Syria; in al-Baladhuri: when word reached him that a company in Mount Lebanon had complained of Ba'labakk's kharaj administrator and that the Byzantines had abetted them, he sent troops who killed their fighters, kept the rest on their religion, returned them to their villages and exiled a company of Lebanon's people — whereupon al-Awza'i wrote him his famous letter decrying punishment of the many for the sins of the few; the House of the Dyers at al-Ramla passed to his heirs, seized with Umayyad wealth."
  es: "Salih ibn Ali ibn Abdullah ibn al-Abbas, príncipe de la da'wa abasí y su primer gobernador sobre Siria; en al-Baladhuri: cuando le llegó la noticia de que un grupo en el Monte Líbano se había quejado del administrador del kharaj de Ba'labakk y que los bizantinos los habían instigado, envió tropas que mataron a sus combatientes, mantuvieron al resto en su religión, los devolvieron a sus aldeas y exiliaron a un grupo de libaneses, tras lo cual al-Awza'i le escribió su famosa carta denunciando el castigo de muchos por los pecados de unos pocos; la Casa de los Tintoreros en al-Ramla pasó a sus herederos, apoderándose de la riqueza omeya."
  fr: "Salih ibn Ali ibn Abdullah ibn al-Abbas, prince de la da'wa abbasside et son premier gouverneur de Syrie, rapporte dans al-Baladhuri: lorsqu'il apprit qu'une troupe du Mont-Liban s'était plainte de l'administrateur du kharaj de Ba'labakk et que les Byzantins les avaient soutenus, il envoya des troupes qui massacrèrent leurs combattants, maintinrent les autres fidèles dans leur religion, les renvoyèrent dans leurs villages et exilèrent une troupe de Libanais. Suite à cela, al-Awza'i lui écrivit sa fameuse lettre dénonçant le châtiment du plus grand nombre pour les fautes du petit nombre; la Maison des Teinturiers à al-Ramla passa à ses héritiers, saisie des richesses omeyyades."
