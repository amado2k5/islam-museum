summary:
  ar: "عالم حديث ومقدّم تلفزيوني تركي، وُلد في هزرو بولاية ديار بكر في 11 مايو 1955، نال الدكتوراه من كلية الإلهيات بجامعة أنقرة في دور الحديث في فهم القرآن وصار أستاذاً سنة 2012، وتولّى رئاسة جامعة غازي عنتاب للإسلام والعلوم والتقنية عند تأسيسها (2019–2023)، واشتهر لدى الجمهور ببرامج الإفطار والسحور الرمضانية التي قدّمها عبر عقدين في قنوات تركية عدة وانتهت إلى قناة «أ تي في»."
  en: "Turkish hadith scholar and television presenter, born in Hazro, Diyarbakır, on 11 May 1955. He took his doctorate at Ankara University's Faculty of Theology on the role of hadith in understanding the Qur'an, became a professor in 2012, served as founding rector of Gaziantep Islam Science and Technology University (2019–2023), and is best known to the public for the Ramadan iftar and sahur programmes he has presented for two decades across Turkish channels, latterly on ATV."
  ur: "ترک علمِ حدیث کے عالم اور ٹیلی ویژن میزبان، جو 11 مئی 1955ء کو دیار بکر کے علاقے ہزرو میں پیدا ہوئے۔ انہوں نے انقرہ یونیورسٹی کے شعبۂ الہیات سے قرآن فہمی میں حدیث کے کردار پر ڈاکٹریٹ کیا، 2012ء میں پروفیسر بنے، غازی عنتاب اسلام سائنس و ٹیکنالوجی یونیورسٹی کے بانی ریکٹر رہے ⁦(2019ء–2023ء)⁩، اور عوام میں ان رمضان افطار و سحور پروگراموں سے مشہور ہیں جو وہ دو دہائیوں سے مختلف ترک چینلوں پر، آخر میں اے ٹی وی پر، پیش کر رہے ہیں۔"
