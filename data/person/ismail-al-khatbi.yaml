summary:
  ar: "إسماعيل بن إسماعيل بن بنان أبو عمر الخطبي ⁦(269–350هـ)⁩، محدث بغداد ومؤرخها؛ كان ثقة فاضلاً نبيلاً فَهِماً عارفاً بأيام الناس وأخبار الخلفاء، وصنّف تاريخاً كبيراً على ترتيب السنين، توفي في جمادى الآخرة سنة خمسين وثلثمائة {cite:muntazam-ibn-al-jawzi j.7 p.8}."
  en: "Isma'il b. Isma'il b. Banan Abu 'Umar al-Khatbi (269–350), Baghdad's muhaddith-chronicler: trustworthy, accomplished, knowing the days of men and the reports of the caliphs, he composed a large chronicle ordered by the years; he died Jumada II 350 {cite:muntazam-ibn-al-jawzi j.7 p.8}."
  es: "Ismael b. Ismael b. Banan Abu 'Umar al-Khatbi (269–350), cronista de hadices de Bagdad: digno de confianza, consumado, conocedor de los días de los hombres y de los relatos de los califas, compuso una gran crónica ordenada por años; murió en Jumada II 350 {citar:Muntazam-ibn-al-Jawzi j.7 p.8}."
  fr: "Ishmael b. Ishmael b. Banan Abu 'Umar al-Khatbi (269–350), muhaddith-chroniqueur de Bagdad: digne de confiance, accompli, connaissant les jours des hommes et les rapports des califes, il a composé une grande chronique ordonnée par les années; il est mort Jumada II 350 {cite: Muntazam-ibn-al-Jawzi j.7 p.8}."
  ur: "اسماعیل بی۔ اسماعیل بی۔ بنان ابو عمر الخطبی (269-350)، بغداد کا محدث تاریخ نگار: ثقہ، باکمال، مردوں کے زمانے اور خلفائے راشدین کے احوال کو جانتے ہوئے، اس نے برسوں کے حساب سے ایک بڑی تاریخ مرتب کی۔ ان کی وفات جمادی الثانی 350 میں ہوئی۔"
  tr: "İsmail bin İsmail ibn Banan Ebu Ömer el-Hattabi (269–350 H) Bağdat'ın hadis âlimi ve tarihçisi, güvenilir, erdemli, soylu, bilgili, halkın günleri ve halifelerin haberleri hakkında bilgi sahibi biriydi ve yıl sırasına göre büyük bir kronik yazdı. Üç yüz elli yılda Cumada'l-Ahira'da öldü {atıf:muntazam-ibn-al-jawzi j.7 s.8}."
  id: "Ismail ibn Ismail ibn Banan Abu Umar al-Khattabi (269–350 H), seorang ulama hadis dan sejarawan Baghdad, adalah seorang yang dapat dipercaya, berbudi luhur, mulia, berpengetahuan, pengetahuan tentang zaman manusia dan berita para khalifah, serta menulis kronik besar berdasarkan urutan tahun. Ia meninggal di Jumada al-Akhirah pada tahun tiga ratus lima puluh {cite:muntazam-ibn-al-jawzi j.7 hlm.8}."
