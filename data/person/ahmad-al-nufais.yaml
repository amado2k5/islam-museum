summary:
  ar: "قارئ قرآن كويتي وإمام المسجد الكبير بدولة الكويت، وُلد في الكويت في 23 رجب 1411هـ الموافق 8 فبراير 1991م، وحفظ القرآن الكريم وتخرج في كلية الشريعة بالجامعة الإسلامية بالمدينة المنورة، وأُجيز في روايتي حفص وشعبة عن عاصم من طريق الشاطبية، وانتشرت تلاواته عبر قناته في يوتيوب ومنصات الاستماع."
  en: "Kuwaiti Quran reciter and imam of the Grand Mosque of Kuwait, born in Kuwait on 23 Rajab 1411 AH (8 February 1991). He memorised the Quran, graduated from the Faculty of Sharia at the Islamic University of Madinah, and holds ijaza in the Hafs and Shu'ba 'an 'Asim narrations via al-Shatibiyya; his recitations spread through his YouTube channel and listening platforms."
  fr: "Récitateur koweïtien du Coran et imam de la Grande Mosquée du Koweït, né au Koweït le 23 rajab 1411 H (8 février 1991 ap. J.-C.). Il mémorisa le Coran, fut diplômé de la faculté de charia de l'université islamique de Médine et détient une ijaza dans les transmissions Hafs et Shu'ba 'an 'Asim par al-Shatibiyya ; ses récitations se diffusent par sa chaîne YouTube et les plateformes d'écoute."
  ur: "کویتی قاریِ قرآن اور کویت کی جامع مسجدِ کبیر کے امام، جو 23 رجب 1411ھ ⁦(8 فروری 1991)⁩ کو کویت میں پیدا ہوئے۔ انہوں نے قرآن حفظ کیا، جامعہ اسلامیہ مدینہ منورہ کی کلیۃ الشریعہ سے فراغت حاصل کی، اور شاطبیہ کے طریق سے روایتِ حفص و شعبہ عن عاصم میں اجازہ رکھتے ہیں؛ ان کی تلاوتیں ان کے یوٹیوب چینل اور سماعتی پلیٹ فارموں سے پھیلیں۔"
  es: "Recitador del Corán kuwaití e imán de la Gran Mezquita de Kuwait, nació en Kuwait el 23 de Rajab de 1411 AH (8 de febrero de 1991). Memorizó el Corán, se graduó de la Facultad de Sharia de la Universidad Islámica de Medina y posee la ijaza en las narraciones de Hafs y Shu'ba 'an 'Asim a través de al-Shatibiyya; sus recitaciones se difunden a través de su canal de YouTube y plataformas de escucha."
  tr: "Kuveytli bir Kur'an okuyucusu ve Kuveyt'teki Büyük Cami'nin imamı olan bu kişi, Hicri 23 Receb 1411'de (Miladi 8 Şubat 1991) Kuveyt'te doğdu. Kur'an-ı Kerim'i ezberledi ve Medine İslam Üniversitesi Şeriat Fakültesi'nden mezun oldu. Şatibiyye yöntemiyle Asim'in rivayetine göre Hafs ve Şube rivayetlerinde sertifika aldı ve Kur'an tilavetleri YouTube kanalı ve dinleme platformları aracılığıyla yaygınlaştı."
  id: "Seorang qari Al-Quran asal Kuwait dan imam Masjidil Haram di Kuwait, ia lahir di Kuwait pada tanggal 23 Rajab 1411 H, bertepatan dengan 8 Februari 1991 M. Ia menghafal Al-Quran dan lulus dari Fakultas Syariah di Universitas Islam Madinah. Ia telah mendapatkan sertifikasi dalam riwayat Hafs dan Shu'bah berdasarkan otoritas Asim melalui metode Shatibiyyah, dan bacaannya telah tersebar melalui saluran YouTube dan platform mendengarkannya."
