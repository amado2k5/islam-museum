summary:
  ar: "قارئ قرآن كويتي وإمام المسجد الكبير بدولة الكويت، وُلد في الكويت في 23 رجب 1411هـ الموافق 8 فبراير 1991م، وحفظ القرآن الكريم وتخرج في كلية الشريعة بالجامعة الإسلامية بالمدينة المنورة، وأُجيز في روايتي حفص وشعبة عن عاصم من طريق الشاطبية، وانتشرت تلاواته عبر قناته في يوتيوب ومنصات الاستماع."
  en: "Kuwaiti Quran reciter and imam of the Grand Mosque of Kuwait, born in Kuwait on 23 Rajab 1411 AH (8 February 1991). He memorised the Quran, graduated from the Faculty of Sharia at the Islamic University of Madinah, and holds ijaza in the Hafs and Shu'ba 'an 'Asim narrations via al-Shatibiyya; his recitations spread through his YouTube channel and listening platforms."
  ur: "کویتی قاریِ قرآن اور کویت کی جامع مسجدِ کبیر کے امام، جو 23 رجب 1411ھ (8 فروری 1991) کو کویت میں پیدا ہوئے۔ انہوں نے قرآن حفظ کیا، جامعہ اسلامیہ مدینہ منورہ کی کلیۃ الشریعہ سے فراغت حاصل کی، اور شاطبیہ کے طریق سے روایتِ حفص و شعبہ عن عاصم میں اجازہ رکھتے ہیں؛ ان کی تلاوتیں ان کے یوٹیوب چینل اور سماعتی پلیٹ فارموں سے پھیلیں۔"
