summary:
  ar: "سياسي إسكتلندي من الحزب الوطني الإسكتلندي، وُلد في غلاسكو سنة 1985 لأبوين مهاجرين من أصول باكستانية وكينية. درس السياسة في جامعة غلاسكو وعمل مساعدا برلمانيا، وانتُخب عضوا في البرلمان الإسكتلندي سنة 2011، فوزيرا للعدل (2018-2021) ثم للصحة والرعاية الاجتماعية (2021-2023)، وفاز بزعامة حزبه سنة 2023 فصار الوزير الأول لإسكتلندا، أولَ مسلم وأصغر شخص يشغل المنصب، واستقال في أبريل 2024."
  en: "Scottish politician of the Scottish National Party, born in Glasgow in 1985 to immigrant parents of Pakistani and Kenyan background. He studied politics at the University of Glasgow, worked as a parliamentary assistant, was elected to the Scottish Parliament in 2011, served as justice secretary (2018–2021) and health secretary (2021–2023), won his party's leadership in 2023 and became First Minister of Scotland — the first Muslim and the youngest person to hold the office — and resigned in April 2024."
  ur: "اسکاٹش نیشنل پارٹی کے اسکاٹ لینڈ کے سیاست دان، جو 1985 میں گلاسگو میں پاکستانی اور کینیائی پس منظر کے مہاجر والدین کے ہاں پیدا ہوئے۔ انھوں نے یونیورسٹی آف گلاسگو میں سیاست پڑھی، پارلیمانی معاون رہے، 2011 میں اسکاٹش پارلیمان کے رکن منتخب ہوئے، وزیرِ انصاف (2018ء–2021ء) اور وزیرِ صحت (2021ء–2023ء) رہے، 2023 میں پارٹی قیادت جیت کر اسکاٹ لینڈ کے وزیرِ اول بنے — اس عہدے پر فائز ہونے والے پہلے مسلمان اور سب سے کم عمر شخص — اور اپریل 2024 میں مستعفی ہوئے۔"
