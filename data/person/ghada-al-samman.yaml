summary:
  ar: "كاتبة وصحفية وروائية سورية وُلدت في دمشق سنة 1942 لأسرة دمشقية مرموقة، ودرست في الجامعة السورية والجامعة الأمريكية في بيروت. من أعمالها «عيناك قدري» (1962) و«لا بحر في بيروت» (1965) وروايتا «بيروت 75» و«كوابيس بيروت»، وتعيش في باريس منذ منتصف الثمانينيات."
  en: "Syrian writer, journalist and novelist born in Damascus in 1942 to a prominent Damascene family; she studied at the Syrian University and the American University of Beirut. Her works include Your Eyes Are My Destiny (1962), No Sea in Beirut (1965) and the novels Beirut 75 and Beirut Nightmares. She has lived in Paris since the mid-1980s."
  ur: "سوری مصنفہ، صحافی اور ناول نگار، جو 1942 میں دمشق کے ایک ممتاز خاندان میں پیدا ہوئیں اور شامی یونیورسٹی اور امریکن یونیورسٹی آف بیروت میں تعلیم پائی۔ ان کی تصانیف میں «عيناك قدري» (1962)، «لا بحر في بيروت» (1965) اور ناول «بيروت 75» اور «كوابيس بيروت» شامل ہیں۔ وہ 1980 کی دہائی کے وسط سے پیرس میں رہ رہی ہیں۔"
  es: "Escritora, periodista y novelista siria nacida en Damasco en 1942 en el seno de una destacada familia damascena; estudió en la Universidad Siria y en la Universidad Americana de Beirut. Entre sus obras destacan Tus ojos son mi destino (1962), Sin mar en Beirut (1965) y las novelas Beirut 75 y Pesadillas de Beirut. Reside en París desde mediados de la década de 1980."
  fr: "Écrivaine, journaliste et romancière syrienne, née à Damas en 1942 dans une famille damascène influente, elle a étudié à l'Université syrienne et à l'Université américaine de Beyrouth. Parmi ses œuvres figurent « Tes yeux sont mon destin » (1962), « Pas de mer à Beyrouth » (1965) et les romans « Beyrouth 75 » et « Cauchemars de Beyrouth ». Elle vit à Paris depuis le milieu des années 1980."
  tr: "Suriyeli yazar, gazeteci ve romancı, 1942'de Şam'da önde gelen bir Şam ailesinde doğmuş, Suriye Üniversitesi ve Amerikan Beyrut Üniversitesi'nde eğitim görmüştür. Eserleri arasında \"Senin Gözlerin, Kaderim\" (1962), \"Beyrut'ta Deniz Yok\" (1965) ve \"Beyrut 75\" ile \"Beyrut Kabusları\" romanları yer almaktadır. 1980'lerin ortalarından beri Paris'te yaşamaktadır."
  id: "Seorang penulis, jurnalis, dan novelis Suriah, lahir di Damaskus pada tahun 1942 dari keluarga terkemuka Damaskus, belajar di Universitas Suriah dan Universitas Amerika Beirut. Di antara karyanya adalah \"Your Eyes, My Destiny\" (1962), \"No Sea in Beirut\" (1965), serta novel \"Beirut 75\" dan \"Beirut Nightmares.\" Ia telah tinggal di Paris sejak pertengahan 1980-an."
