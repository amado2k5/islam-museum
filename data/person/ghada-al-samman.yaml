summary:
  ar: "كاتبة وصحفية وروائية سورية وُلدت في دمشق سنة 1942 لأسرة دمشقية مرموقة، ودرست في الجامعة السورية والجامعة الأمريكية في بيروت. من أعمالها «عيناك قدري» (1962) و«لا بحر في بيروت» (1965) وروايتا «بيروت 75» و«كوابيس بيروت»، وتعيش في باريس منذ منتصف الثمانينيات."
  en: "Syrian writer, journalist and novelist born in Damascus in 1942 to a prominent Damascene family; she studied at the Syrian University and the American University of Beirut. Her works include Your Eyes Are My Destiny (1962), No Sea in Beirut (1965) and the novels Beirut 75 and Beirut Nightmares. She has lived in Paris since the mid-1980s."
  ur: "سوری مصنفہ، صحافی اور ناول نگار، جو 1942 میں دمشق کے ایک ممتاز خاندان میں پیدا ہوئیں اور شامی یونیورسٹی اور امریکن یونیورسٹی آف بیروت میں تعلیم پائی۔ ان کی تصانیف میں «عيناك قدري» (1962)، «لا بحر في بيروت» (1965) اور ناول «بيروت 75» اور «كوابيس بيروت» شامل ہیں۔ وہ 1980 کی دہائی کے وسط سے پیرس میں رہ رہی ہیں۔"
