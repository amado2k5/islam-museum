names:
  - { value: "تاج الإسلام أبو المحاسن عبد الواحد بن إسماعيل الروياني", kind: full }
summary:
  ar: "شيخ الشافعية وشافعي وقته؛ قال ابن قاضي شهبة: كانت له الوجاهة والرياسة والقبول التام عند الملوك، وبرع في المذهب حتى كان يقول لو احترقت كتب الشافعي لأمليتها من حفظي، وولي قضاء طبرستان وبنى مدرسة بآمل؛ من تصانيفه البحر والكافي والحلية والمبتدي وحقيقة القولين والوجهين؛ استشهد بجامع آمل بعد فراغه من الإملاء يوم الجمعة حادي عشر المحرم سنة اثنتين وخمسمائة قتله باطني {cite:shadharat-dhahab p. 484}."
  en: "Shaykh of the Shafi'is, 'the Shafi'i of his time' — he used to say that if al-Shafi'i's books burned he could dictate them from memory; qadi of Tabaristan who built a madrasa at Amol; martyred in Amol's mosque by a Batini just after dictation, Friday 11 Muharram 502 {cite:shadharat-dhahab p. 484}."
  fr: "Shaykh des shafi'ites, « le Shafi'i de son temps » — il disait que si les livres d'al-Shafi'i brûlaient, il pourrait les dicter de mémoire ; cadi du Tabaristan qui bâtit une madrasa à Amol ; tué en martyr dans la mosquée d'Amol par un batinite juste après une dictée, le vendredi 11 Muharram 502 {cite:shadharat-dhahab p. 484}."
  es: "Shaykh de los Shafi'is, 'el Shafi'i de su tiempo': solía decir que si los libros de al-Shafi'i ardieran, podría dictarlos de memoria; cadí de Tabaristán que construyó una madrasa en Amol; martirizado en la mezquita de Amol por un Batini justo después de dictar, el viernes 11 de Muharram de 502 {cita: shadharat-dhahab p. 484}."
  ur: "شافعیوں کے شیخ، 'اپنے زمانے کے شافعی' - وہ کہتے تھے کہ اگر الشافعی کی کتابیں جل جائیں تو وہ ان کو حافظہ سے لکھ سکتے ہیں۔ طبرستان کا قاضی جس نے امول میں مدرسہ بنایا۔ 11 محرم 502 بروز جمعہ ایک باطنی کے ہاتھوں امول کی مسجد میں شہید ہو گئے۔ 484}۔"
  tr: "Şafiî mezhebinin şeyhi ve zamanının Şafiîsi İbn Kadı Şahba şöyle demiştir: \"Şâfiî mezhebine mensuptu, saygınlığı, önderliği ve krallar arasında tam kabulü vardı ve düşünce ekolünde o kadar üstün bir bilginliğe sahipti ki, 'Şâfiî'nin kitapları yakılsa bile, onları ezberden dikte ederim' derdi.\" Taberistan'a kadı olarak atandı ve Amol'da bir okul kurdu. Eserleri arasında el-Bahr, el-Kafi, el-Hilya, el-Mubtadi ve Hakikat el-Kevleyn ve el-Vecveyyn bulunmaktadır. 502 yılında, Muharrem ayının on birinci Cuma günü, dikteyi bitirdikten sonra Amol camisinde şehit edildi. Bir Batiniyye tarafından öldürüldü. {kaynak: Şadharat-dhahab s. 484}"
  id: "Syekh dari mazhab Syafi'i dan tokoh Syafi'i pada zamannya, Ibnu Qadi Shahba, berkata: Beliau memiliki prestise, kepemimpinan, dan penerimaan penuh di kalangan raja-raja, dan beliau unggul dalam mazhab pemikiran hingga beliau biasa berkata, “Seandainya kitab-kitab Syafi'i dibakar, saya akan tetap mendiktekannya dari hafalan.” Beliau diangkat menjadi hakim Tabaristan dan membangun sebuah sekolah di Amol. Di antara karya-karyanya adalah al-Bahr, al-Kafi, al-Hilya, al-Mubtadi, dan Haqiqat al-Qawlayn wa al-Wajhayn. Beliau syahid di masjid Amol setelah selesai mendiktekan kitab pada hari Jumat, tanggal sebelas Muharram, tahun 502. Beliau dibunuh oleh seorang Batiniyyah. {cite:shadharat-dhahab p. 484}"
