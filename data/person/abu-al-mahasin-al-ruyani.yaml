names:
  - { value: "تاج الإسلام أبو المحاسن عبد الواحد بن إسماعيل الروياني", kind: full }
summary:
  ar: "شيخ الشافعية وشافعي وقته؛ قال ابن قاضي شهبة: كانت له الوجاهة والرياسة والقبول التام عند الملوك، وبرع في المذهب حتى كان يقول لو احترقت كتب الشافعي لأمليتها من حفظي، وولي قضاء طبرستان وبنى مدرسة بآمل؛ من تصانيفه البحر والكافي والحلية والمبتدي وحقيقة القولين والوجهين؛ استشهد بجامع آمل بعد فراغه من الإملاء يوم الجمعة حادي عشر المحرم سنة اثنتين وخمسمائة قتله باطني {cite:shadharat-dhahab p. 484}."
  en: "Shaykh of the Shafi'is, 'the Shafi'i of his time' — he used to say that if al-Shafi'i's books burned he could dictate them from memory; qadi of Tabaristan who built a madrasa at Amol; martyred in Amol's mosque by a Batini just after dictation, Friday 11 Muharram 502 {cite:shadharat-dhahab p. 484}."
  fr: "Shaykh des shafi'ites, « le Shafi'i de son temps » — il disait que si les livres d'al-Shafi'i brûlaient, il pourrait les dicter de mémoire ; cadi du Tabaristan qui bâtit une madrasa à Amol ; tué en martyr dans la mosquée d'Amol par un batinite juste après une dictée, le vendredi 11 Muharram 502 {cite:shadharat-dhahab p. 484}."
  es: "Shaykh de los Shafi'is, 'el Shafi'i de su tiempo': solía decir que si los libros de al-Shafi'i ardieran, podría dictarlos de memoria; cadí de Tabaristán que construyó una madrasa en Amol; martirizado en la mezquita de Amol por un Batini justo después de dictar, el viernes 11 de Muharram de 502 {cita: shadharat-dhahab p. 484}."
