summary:
  ar: "شيخ الشافعية وشافعي وقته؛ قال ابن قاضي شهبة: كانت له الوجاهة والرياسة والقبول التام عند الملوك، وبرع في المذهب حتى كان يقول لو احترقت كتب الشافعي لأمليتها من حفظي، وولي قضاء طبرستان وبنى مدرسة بآمل؛ من تصانيفه البحر والكافي والحلية والمبتدي وحقيقة القولين والوجهين؛ استشهد بجامع آمل بعد فراغه من الإملاء يوم الجمعة حادي عشر المحرم سنة اثنتين وخمسمائة قتله باطني {cite:shadharat-dhahab p. 484}."
  en: "Shaykh of the Shafi'is, 'the Shafi'i of his time' — he used to say that if al-Shafi'i's books burned he could dictate them from memory; qadi of Tabaristan who built a madrasa at Amol; martyred in Amol's mosque by a Batini just after dictation, Friday 11 Muharram 502 {cite:shadharat-dhahab p. 484}."
