summary:
  ar: صانع محتوى كويتي من أصل صومالي وُلد سنة 1998، اسمه حسن سليمان ويُعرف بـ«أبو فلة»؛ من أكبر يوتيوبرز العرب بالألعاب والترفيه، وسجّل أرقامًا قياسية بحملات بث خيرية جمعت ملايين الدولارات للاجئين والمحتاجين.
  en: Kuwaiti content creator of Somali descent born in 1998, real name Hassan Suleiman, known as AboFlah; one of the Arab world's biggest gaming and entertainment YouTubers, he set records with charity
    livestreams raising millions of dollars for refugees and the needy.
  ur: صومالی نژاد کویتی مواد ساز جو 1998 میں پیدا ہوا، اصل نام حسن سلیمان اور ابو فلہ کہلاتا ہے؛ عرب دنیا کے بڑے گیمنگ اور تفریحی یوٹیوبرز میں، اس نے مہاجرین اور ضرورت مندوں کے لیے لاکھوں ڈالر جمع کرنے
    والی خیراتی لائیو اسٹریمز سے ریکارڈ بنائے۔
  fr: "Créateur de contenus koweïtien d'origine somalienne né en 1998, de son vrai nom Hassan Suleiman, connu sous le nom d'AboFlah ; l'un des plus grands youtubeurs de jeux et de divertissement du monde arabe, il a établi des records avec des diffusions en direct caritatives qui ont réuni des millions de dollars pour les réfugiés et les personnes dans le besoin."
  es: "Creador de contenido kuwaití de ascendencia somalí, nacido en 1998, cuyo nombre real es Hassan Suleiman, conocido como AboFlah; uno de los YouTubers de videojuegos y entretenimiento más importantes del mundo árabe, batió récords con transmisiones benéficas en directo, recaudando millones de dólares para refugiados y personas necesitadas."
  tr: "1998 doğumlu, Somali kökenli Kuveytli içerik üreticisi Hassan Suleiman, \"Abu Fella\" olarak tanınıyor; oyun ve eğlence alanında en büyük Arap YouTuber'lardan biri olan Suleiman, mülteciler ve ihtiyaç sahipleri için milyonlarca dolar toplayan yardım amaçlı yayın kampanyalarıyla rekorlar kırdı."
  id: "Hassan Suleiman, seorang kreator konten asal Kuwait keturunan Somalia, lahir pada tahun 1998, dikenal sebagai “Abu Fella”; ia adalah salah satu YouTuber Arab terbesar di bidang game dan hiburan, dan telah mencetak rekor dengan kampanye siaran amal yang telah mengumpulkan jutaan dolar untuk para pengungsi dan mereka yang membutuhkan."
