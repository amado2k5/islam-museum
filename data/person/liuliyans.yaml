summary:
  ar: "ليوليانوس الملك المرتد إلى مذهب الفلاسفة عن النصرانية بعد جالينوس وكان ثامسطيوس كاتبه وله رسالته {cite:fihrist-ibn-al-nadim p. 355}. وعند المقري وكان يدين بطاعة القوط وبملتهم وكان ملك البرابرة بجبال غمارة، وحرض موسى بن نصير على غزو الأندلس للأمر الذي وقع بينه وبين لذريق، ولحق بطارق فكشف للعرب عورة القوط ودلهم {cite:nafh-tib-maqqari p. 267-268}"
  en: "Julian — the emperor who returned to the philosophers from Christianity {cite:fihrist-ibn-al-nadim}"
