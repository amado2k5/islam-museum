label: { ar: "ليوليانوس", en: "Liuliyans", es: "Liuliyans", fr: "Liuliyans", ur: "لیولیاں" }
summary:
  ar: "ليوليانوس الملك المرتد إلى مذهب الفلاسفة عن النصرانية بعد جالينوس وكان ثامسطيوس كاتبه وله رسالته {cite:fihrist-ibn-al-nadim p. 355}. وعند المقري وكان يدين بطاعة القوط وبملتهم وكان ملك البرابرة بجبال غمارة، وحرض موسى بن نصير على غزو الأندلس للأمر الذي وقع بينه وبين لذريق، ولحق بطارق فكشف للعرب عورة القوط ودلهم {cite:nafh-tib-maqqari p. 267-268}"
  en: "Julian — the emperor who returned to the philosophers from Christianity {cite:fihrist-ibn-al-nadim}"
  es: "Juliano — el emperador que regresó a los filósofos desde el cristianismo {cite:fihrist-ibn-al-nadim}"
  fr: "Julien — l'empereur qui est revenu aux philosophes après le christianisme {cite:fihrist-ibn-al-nadim}"
  ur: "جولین - وہ شہنشاہ جو عیسائیت سے فلسفیوں کے پاس واپس آیا۔"
  tr: "Galen'den sonra Hristiyanlıktan filozof doktrinine geçen kral Julianus, kitabın yazarıydı ve Thomastius onun risalesini {cite:fihrist-ibn-al-nadim s. 355} yazdı. al-Maqri'ye göre, Gotlara ve onların dinine itaat ediyordu ve Ghumara dağlarındaki barbarların kralıydı. Musa ibn Nusayr'ı, kendisi ile Dhariq arasındaki mesele yüzünden Endülüs'ü işgal etmeye kışkırttı ve Tariq'i takip ederek Araplara Gotların çıplaklığını ifşa etti {cite:nafh-tib-maqqari s. 267-268}"
  id: "Julianus, raja yang beralih ke doktrin filsuf dari Kristen setelah Galen, adalah penulisnya dan Thomastius menulis risalahnya {cite:fihrist-ibn-al-nadim hlm. 355}. Menurut al-Maqri, ia taat kepada bangsa Goth dan agama mereka, dan menjadi raja bangsa barbar di pegunungan Ghumara. Ia menghasut Musa ibn Nusayr untuk menyerang al-Andalus terkait masalah antara dirinya dan Dhariq, dan ia mengikuti Tariq serta mengungkapkan kepada orang Arab tentang ketelanjangan bangsa Goth dan mengungkap mereka {cite:nafh-tib-maqqari hlm. 267-268}"
