id: person/said-ibn-amir-al-jumahi
class: person
label: { ar: "سعيد بن عامر بن حذيم الجمحي", en: "Sa'id ibn Amir ibn Hudhaym al-Jumahi", es: "Sa'id ibn Amir ibn Hudhaym al-Jumahi", fr: "Sa'id ibn Amir ibn Hudhaym al-Jumahi", ur: "سعید بن عامر بن ہذیم الجمعی" }
summary:
  ar: "سعيد بن عامر بن حذيم الجمحي القرشي، من أصحاب رسول الله وقواد إياد بن غنم؛ عند البلاذري عن الواقدي: كان على ميمنة جيش إياد حين سار إلى الجزيرة للنصف من شعبان سنة 18 — وعلى مقدمته ميسرة بن مسروق وعلى ميسرته صفوان بن المعطل. وعند المسعودي شكاه أهل حمص إلى عمر فقالوا لا يخرج إلينا حتى يرتفع النهار لأنه يعجن ويخبز ليس لأهله خادم ولا يجيب بليل لأنه جعل الليل كله لربه وله يوم في الشهر لا يخرج ليغسل ثوبه ويجففه، فقال عمر الحمد لله الذي لم يفل فراستي فيك وبعث إليه بألف دينار فنصرها صرراً وفرقها في الأيتام والمساكين حتى لم يبق إلا اليسير {cite:muruj-al-dhahab p. 602-603}"
  en: "Sa'id ibn Amir ibn Hudhaym al-Jumahi the Qurashite, a Companion of the Messenger of God and commander under Iyad ibn Ghanm; in al-Baladhuri from al-Waqidi: he held the right wing of Iyad's army marching on the Jazira mid-Sha'ban year 18 — Maysara ibn Masruq on the vanguard and Safwan ibn al-Mu'attal on the left."
  es: "Sa'id ibn Amir ibn Hudhaym al-Jumahi el Qurajita, Compañero del Mensajero de Dios y comandante bajo Iyad ibn Ghanm; en al-Baladhuri de al-Waqidi: él comandaba el ala derecha del ejército de Iyad marchando hacia Jazira a mediados de Sha'ban del año 18: Maysara ibn Masruq en la vanguardia y Safwan ibn al-Mu'attal en la izquierda."
  fr: "Sa'id ibn Amir ibn Hudhaym al-Jumahi le Qurashite, un Compagnon du Messager de Dieu et commandant sous Iyad ibn Ghanm; dans al-Baladhuri d'al-Waqidi: il tenait l'aile droite de l'armée d'Iyad marchant sur la Jazira au milieu de l'année Sha'ban 18 — Maysara ibn Masruq à l'avant-garde et Safwan ibn al-Mu'attal à gauche."
  ur: "سعید بن عامر بن ہذیم الجمعی قراشی، رسول اللہ کے صحابی اور ایاد بن غنم کے ماتحت کمانڈر؛ البلادوری میں الواقدی سے: اس نے 18 شعبان کے وسط میں جزیرہ پر مارچ کرنے والی عیاض کی فوج کا دایاں بازو تھام رکھا تھا - میسرہ بن مسروق سب سے آگے اور صفوان بن المطلب بائیں طرف۔"
  tr: "Allah'ın Elçisi ve İyad bin Ghanam'ın komutanı olan Seyid bin Emir bin Emir bin Hudhaym el-Cumemi el-Kuraşi; el-Vekidi'den el-Baladhuri'ye göre: 18. yılda, Şaban ortasında Cezire'ye yürüdüğünde İyad'ın ordusunun sağ kanadındaydı — sol tarafında ustabaşısı Maysarah ibn Masruq ve Safvan ibn al-Mu'tal vardı. El-Mas' ile birlikte Hums halkı, Hums halkı Ömer'e gündüz dışarı çıkmayacağını, çünkü yoğurup pişirdiğini şikayet etti; ailesinin hizmetçisi ve geceleri cevap verecek kimse yoktu, çünkü tüm geceyi Rabbi için ayırmıştı ve ayda bir günü çamaşırlarını yıkamaya ya da kurutmaya çıkmadı. Ömer dedi ki, 'Senin için eksik olmayan Allah'a şükürler olsun, ona bin dinar gönderdi, böylece onları sağlam bir şekilde destekledi ve yetimlere ve yoksullara dağıttı, ta ki çok azı kalana kadar.' {alıntı:Muruj-al-Dhahab s. 602-603}"
  id: "Sa'id ibn Amir ibn Hudhaym al-Jumahi al-Qurashi, salah satu sahabat Rasulullah dan komandan Iyad ibn Ghanam; menurut al-Baladhuri dari al-Waqidi: Ia berada di sayap kanan pasukan Iyad ketika ia berbaris ke al-Jazira pada pertengahan Sha'ban tahun 18 — dengan mandor Maysarah ibn Masruq dan Safwan ibn al-Mu'tal di sisi kirinya. Bersama al-Mas'S udhi, orang-orang Homs mengeluh kepada Umar bahwa dia tidak mau keluar sampai fajar karena dia menguleni dan memanggang kue; keluarganya tidak memiliki pelayan dan tidak ada yang menjawab di malam hari, karena dia telah menyediakan seluruh malam untuk Tuhannya, dan dia memiliki satu hari dalam sebulan yang tidak keluar untuk mencuci atau mengeringkan pakaian. Umar berkata, 'Puji bagi Tuhan yang tidak gagal demi kamu, dan mengirimkan seribu dinar kepadanya, sehingga dia menopang dengan teguh dan membagikannya kepada anak yatim dan orang miskin sampai hanya sedikit yang tersisa.' {cite:Muruj-al-Dhahab hlm. 602-603}"
