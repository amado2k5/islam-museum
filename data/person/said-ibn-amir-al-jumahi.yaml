id: person/said-ibn-amir-al-jumahi
class: person
label: { ar: "سعيد بن عامر بن حذيم الجمحي", en: "Sa'id ibn Amir ibn Hudhaym al-Jumahi" }
summary:
  ar: "سعيد بن عامر بن حذيم الجمحي القرشي، من أصحاب رسول الله وقواد إياد بن غنم؛ عند البلاذري عن الواقدي: كان على ميمنة جيش إياد حين سار إلى الجزيرة للنصف من شعبان سنة 18 — وعلى مقدمته ميسرة بن مسروق وعلى ميسرته صفوان بن المعطل. وعند المسعودي شكاه أهل حمص إلى عمر فقالوا لا يخرج إلينا حتى يرتفع النهار لأنه يعجن ويخبز ليس لأهله خادم ولا يجيب بليل لأنه جعل الليل كله لربه وله يوم في الشهر لا يخرج ليغسل ثوبه ويجففه، فقال عمر الحمد لله الذي لم يفل فراستي فيك وبعث إليه بألف دينار فنصرها صرراً وفرقها في الأيتام والمساكين حتى لم يبق إلا اليسير {cite:muruj-al-dhahab p. 602-603}"
  en: "Sa'id ibn Amir ibn Hudhaym al-Jumahi the Qurashite, a Companion of the Messenger of God and commander under Iyad ibn Ghanm; in al-Baladhuri from al-Waqidi: he held the right wing of Iyad's army marching on the Jazira mid-Sha'ban year 18 — Maysara ibn Masruq on the vanguard and Safwan ibn al-Mu'attal on the left."
