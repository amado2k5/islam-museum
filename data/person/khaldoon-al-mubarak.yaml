summary:
  ar: "خلدون المبارك ⁦(وُلد سنة 1976 بحسب قراءة المقالة الإنجليزية)⁩ مسؤول حكومي ورجل أعمال إماراتي، الرئيس التنفيذي والعضو المنتدب لشركة مبادلة للاستثمار ورئيس مانشستر سيتي ومجموعة سيتي لكرة القدم. وهو عضو المجلس التنفيذي لإمارة أبو ظبي منذ 2006 والرئيس المؤسس لهيئة الشؤون التنفيذية، ويشغل منذ 2018 منصب مبعوث رئيس الدولة الخاص إلى الصين."
  en: "Khaldoon Al Mubarak (born 1976, on the English article's reading) is an Emirati government official and business leader, chief executive and managing director of Mubadala Investment Company and chairman of Manchester City and of City Football Group. A member of Abu Dhabi's Executive Council since 2006 and founding chairman of the Executive Affairs Authority, he has served as the UAE President's Special Envoy to China since 2018."
  ur: "خلدون المبارک ⁦(پیدائش 1976، انگریزی مضمون کی قراءت کے مطابق)⁩ اماراتی حکومتی عہدیدار اور کاروباری رہنما ہیں، مبادلہ انویسٹمنٹ کمپنی کے چیف ایگزیکٹو اور منیجنگ ڈائریکٹر اور مانچسٹر سٹی و سٹی فٹبال گروپ کے چیئرمین۔ وہ 2006 سے ابوظہبی کی ایگزیکٹو کونسل کے رکن اور ایگزیکٹو افیئرز اتھارٹی کے بانی چیئرمین ہیں، اور 2018 سے چین کے لیے صدرِ امارات کے خصوصی ایلچی ہیں۔"
  es: "Khaldoon Al Mubarak (nacido en 1976, según la lectura del artículo en inglés) es un funcionario del gobierno emiratí y líder empresarial, director ejecutivo y gerente general de Mubadala Investment Company y presidente del Manchester City y del City Football Group. Miembro del Consejo Ejecutivo de Abu Dabi desde 2006 y presidente fundador de la Autoridad de Asuntos Ejecutivos, se ha desempeñado como Enviado Especial del Presidente de los EAU a China desde 2018."
  fr: "Khaldoon Al Mubarak (né en 1976, selon la version anglaise de l'article) est un homme politique et d'affaires émirati, directeur général de Mubadala Investment Company et président de Manchester City et du City Football Group. Membre du Conseil exécutif d'Abu Dhabi depuis 2006 et président fondateur de l'Autorité des affaires exécutives, il est envoyé spécial du président des Émirats arabes unis en Chine depuis 2018."
  tr: "Khaldoon Al Mubarak (İngilizce makaleye göre 1976 doğumlu), Emirlikli bir hükümet yetkilisi ve iş insanı, Mubadala Yatırım Şirketi'nin CEO'su ve Genel Müdürüdür ile Manchester City ve City Football Group'un Başkanıdır. 2006'dan beri Abu Dabi Emirliği İcra Konseyi üyesi ve Yürütme İşleri Otoritesi'nin kurucu başkanıdır. 2018'den beri Çin'e Devlet Başkanı Özel Elçisi olarak görev yapmaktadır."
  id: "Khaldoon Al Mubarak (lahir tahun 1976 menurut artikel berbahasa Inggris) adalah seorang pejabat pemerintah Emirat dan pengusaha, CEO dan Managing Director Mubadala Investment Company, serta Ketua Manchester City and City Football Group. Ia telah menjadi anggota Dewan Eksekutif Emirat Abu Dhabi sejak tahun 2006 dan ketua pendiri Executive Affairs Authority. Sejak tahun 2018, ia menjabat sebagai Utusan Khusus Kepala Negara untuk Tiongkok."
