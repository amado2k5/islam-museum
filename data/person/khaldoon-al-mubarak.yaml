summary:
  ar: "خلدون المبارك (وُلد سنة 1976 بحسب قراءة المقالة الإنجليزية) مسؤول حكومي ورجل أعمال إماراتي، الرئيس التنفيذي والعضو المنتدب لشركة مبادلة للاستثمار ورئيس مانشستر سيتي ومجموعة سيتي لكرة القدم. وهو عضو المجلس التنفيذي لإمارة أبو ظبي منذ 2006 والرئيس المؤسس لهيئة الشؤون التنفيذية، ويشغل منذ 2018 منصب مبعوث رئيس الدولة الخاص إلى الصين."
  en: "Khaldoon Al Mubarak (born 1976, on the English article's reading) is an Emirati government official and business leader, chief executive and managing director of Mubadala Investment Company and chairman of Manchester City and of City Football Group. A member of Abu Dhabi's Executive Council since 2006 and founding chairman of the Executive Affairs Authority, he has served as the UAE President's Special Envoy to China since 2018."
  ur: "خلدون المبارک (پیدائش 1976، انگریزی مضمون کی قراءت کے مطابق) اماراتی حکومتی عہدیدار اور کاروباری رہنما ہیں، مبادلہ انویسٹمنٹ کمپنی کے چیف ایگزیکٹو اور منیجنگ ڈائریکٹر اور مانچسٹر سٹی و سٹی فٹبال گروپ کے چیئرمین۔ وہ 2006 سے ابوظہبی کی ایگزیکٹو کونسل کے رکن اور ایگزیکٹو افیئرز اتھارٹی کے بانی چیئرمین ہیں، اور 2018 سے چین کے لیے صدرِ امارات کے خصوصی ایلچی ہیں۔"
