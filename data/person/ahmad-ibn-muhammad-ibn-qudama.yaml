summary:
  ar: "الشيخ أبو العباس أحمد بن محمد بن قدامة، خطيب جمّاعيل من أرض نابلس، ووالد الشيخ أبي عمر والموفق ابن قدامة؛ يصفه ابن رجب بالصلاح والزهد والعبادة والمهابة وأنه قرأ في رمضان خمساً وستين ختمة، ونقل عن ابن الحنبلي ثناءً بالغاً عليه، وحدّث وروى عنه ابناه. هاجر بأهله إلى دمشق سنة 551هـ لاستيلاء الفرنج على الأرض المقدسة، وولد سنة 491هـ وتوفي سنة 558هـ ودفن بسفح قاسيون وإلى جانبه ابنه أبو عمر {cite:dhayl-tabaqat-hanabila-faqi-v2 p. 52}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 61}."
  en: "Shaykh Abu al-Abbas Ahmad ibn Muhammad ibn Qudama, preacher of Jamma'il in the land of Nablus and father of Shaykh Abu Umar and of al-Muwaffaq Ibn Qudama. Ibn Rajab describes him as righteous, ascetic, devoted to worship and held in awe, and says he completed the Qur'an sixty-five times in one Ramadan; he narrated hadith and his two sons transmitted from him. He took his family to Damascus in 551 AH because the Franks had taken the Holy Land. Born 491 AH, died 558 AH, buried on the slope of Qasyun with his son Abu Umar beside him."
  es: "El jeque Abu al-Abbas Ahmad ibn Muhammad ibn Qudama, predicador de Jamma'il en la tierra de Nablus y padre del jeque Abu Umar y de al-Muwaffaq Ibn Qudama. Ibn Rajab lo describe como justo, asceta, devoto y venerado, y afirma que recitó el Corán sesenta y cinco veces en un Ramadán; narró hadices que sus dos hijos transmitieron. Llevó a su familia a Damasco en el año 551 de la Hégira porque los francos habían tomado Tierra Santa. Nació en el año 491 de la Hégira y murió en el 558 de la Hégira; fue enterrado en la ladera de Qasyun junto a su hijo Abu Umar."
  fr: "Cheikh Abu al-Abbas Ahmad ibn Muhammad ibn Qudama, prédicateur de Jamma'il au pays de Naplouse et père de Cheikh Abu Umar et d'al-Muwaffaq Ibn Qudama. Ibn Rajab le décrit comme un homme pieux, ascétique, dévoué à la prière et empli de crainte révérencieuse. Il aurait récité le Coran soixante-cinq fois au cours d'un seul Ramadan. Il était un rapporteur de hadiths, transmis par ses deux fils. En 551 AH, il emmena sa famille à Damas, suite à la conquête de la Terre sainte par les Francs. Né en 491 AH, il mourut en 558 AH et fut inhumé sur les pentes du mont Qasyun, auprès de son fils Abu Umar."
  ur: "شیخ ابو العباس احمد بن محمد بن قدامہ، نابلس کی سرزمین میں جماعیل کے مبلغ اور شیخ ابو عمر اور الموفق ابن قدامہ کے والد۔ ابن رجب اسے صالح، متقی، عبادت کے لیے وقف اور خوف میں مبتلا قرار دیتے ہیں، اور کہتے ہیں کہ اس نے ایک رمضان میں پینسٹھ مرتبہ قرآن مجید مکمل کیا۔ اس نے حدیث بیان کی اور ان کے دو بیٹوں نے ان سے روایت کی۔ وہ 551 ہجری میں اپنے خاندان کو لے کر دمشق چلا گیا کیونکہ فرینکوں نے مقدس سرزمین پر قبضہ کر لیا تھا۔ پیدائش 491ھ، وفات 558ھ، قصیون کی ڈھلوان پر اپنے بیٹے ابو عمر کے ساتھ دفن ہوئے۔"
  tr: "Nablus bölgesindeki Cemmail mezhebinin vaizi ve Şeyh Ebu Ömer ile el-Muvefak ibn Kudame'nin babası Şeyh Ebu el-Abbas Ahmed ibn Muhammed ibn Kudame, İbn Receb tarafından dindar, zühd sahibi, takva sahibi ve saygıdeğer biri olarak tanımlanmıştır. Ramazan ayında Kur'an'ı altmış beş defa okuduğu rivayet edilir. İbn Receb ayrıca İbn el-Hanbeli'nin onun hakkındaki yüksek övgüsünü de aktarır ve iki oğlu onun adına hadisler rivayet etmiştir. Kutsal Toprakların Franklar tarafından fethi nedeniyle 551 Hicri yılında ailesiyle birlikte Şam'a hicret etmiştir. 491 Hicri yılında doğmuş ve 558 Hicri yılında vefat etmiştir. Oğlu Ebu Ömer'in yanına, Kasiye Dağı'nın eteğine defnedilmiştir."
  id: "Syekh Abu al-Abbas Ahmad ibn Muhammad ibn Qudamah, pendakwah Jamma'il di wilayah Nablus, dan ayah dari Syekh Abu Umar dan al-Muwaffaq ibn Qudamah, digambarkan oleh Ibn Rajab sebagai orang yang saleh, asketis, taat, dan dihormati. Beliau dikatakan telah membaca Al-Quran enam puluh lima kali selama bulan Ramadan. Ibn Rajab juga mengutip pujian tinggi Ibn al-Hanbali terhadapnya, dan kedua putranya meriwayatkan hadits atas namanya. Beliau berhijrah bersama keluarganya ke Damaskus pada tahun 551 H karena penaklukan Tanah Suci oleh bangsa Frank. Beliau lahir pada tahun 491 H dan wafat pada tahun 558 H. Beliau dimakamkan di kaki Gunung Qasiun, di samping putranya Abu Umar."
