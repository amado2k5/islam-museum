summary:
  ar: "الشيخ أبو العباس أحمد بن محمد بن قدامة، خطيب جمّاعيل من أرض نابلس، ووالد الشيخ أبي عمر والموفق ابن قدامة؛ يصفه ابن رجب بالصلاح والزهد والعبادة والمهابة وأنه قرأ في رمضان خمساً وستين ختمة، ونقل عن ابن الحنبلي ثناءً بالغاً عليه، وحدّث وروى عنه ابناه. هاجر بأهله إلى دمشق سنة 551هـ لاستيلاء الفرنج على الأرض المقدسة، وولد سنة 491هـ وتوفي سنة 558هـ ودفن بسفح قاسيون وإلى جانبه ابنه أبو عمر {cite:dhayl-tabaqat-hanabila-faqi-v2 p. 52}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 61}."
  en: "Shaykh Abu al-Abbas Ahmad ibn Muhammad ibn Qudama, preacher of Jamma'il in the land of Nablus and father of Shaykh Abu Umar and of al-Muwaffaq Ibn Qudama. Ibn Rajab describes him as righteous, ascetic, devoted to worship and held in awe, and says he completed the Qur'an sixty-five times in one Ramadan; he narrated hadith and his two sons transmitted from him. He took his family to Damascus in 551 AH because the Franks had taken the Holy Land. Born 491 AH, died 558 AH, buried on the slope of Qasyun with his son Abu Umar beside him."
