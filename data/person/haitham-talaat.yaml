summary:
  ar: "طبيب مصري وباحث وداعية في نقد الإلحاد، وُلد سنة 1981 في صعيد مصر، وحصل على بكالوريوس الطب والجراحة سنة 2004، وكان مدير قسم العلوم الإنسانية بمركز براهين، وله عشرات الكتب في الرد على الإلحاد والشبهات، وقناة عربية على يوتيوب تحمل مناظراته ومحاضراته وتصل مقاطعها إلى ملايين المشاهدات."
  en: "Egyptian physician, researcher and preacher known for his critique of atheism, born in 1981 in Upper Egypt. He took his bachelor's degree in medicine and surgery in 2004, formerly directed the Humanities Department at the Braheen Center, has written dozens of books answering atheism and religious doubts, and runs an Arabic YouTube channel carrying his debates and lectures, whose videos reach millions of views."
  ur: "مصری طبیب، محقق اور مبلغ جو الحاد کی تنقید کے لیے معروف ہیں، 1981 میں صعید مصر میں پیدا ہوئے۔ انہوں نے 2004 میں طب و جراحی میں بیچلر کی ڈگری پائی، مرکز براہین میں شعبۂ علومِ انسانیہ کے ڈائریکٹر رہے، الحاد اور شبہات کے جواب میں درجنوں کتابیں لکھیں، اور ایک عربی یوٹیوب چینل چلاتے ہیں جس پر ان کے مناظرے اور محاضرات ہیں اور جس کی ویڈیوز لاکھوں ناظرین تک پہنچتی ہیں۔"
