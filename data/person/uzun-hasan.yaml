summary:
  ar: "حسن بك بن علي بك بن قرا بلوك متملك العراقين وأذربيجان وديار بكر؛ توفي في جمادى الآخرة أو رجب سنة اثنتين وثمانين وثمانمائة {cite:shadharat-dhahab p. 335}. ويذكر الصلابي أن محمد الفاتح هزمه وهو «لا يلتزم بعهد ويناصر أعداء العثمانيين من أي ملة كانت»، وأنه لما وقع في يده عدد كبير من الأسرى استثنى الفاتح منهم العلماء وأصحاب المعارف كالقاضي محمد الشريحي فأكرمه غاية الإكرام {cite:dawlat-uthmaniyya-salabi p. 139}."
  en: "Uzun Hasan — Aq Qoyunlu lord of the two Iraqs, Azerbaijan and Diyar Bakr; died Jumada II or Rajab 882 {cite:shadharat-dhahab p. 335}. Al-Salabi adds that Mehmed II defeated him — 'a lord who kept no covenant and backed the Ottomans' foes of whatever creed' — and that of the many captives the sultan spared and honoured the scholar-judge Muhammad al-Sharihi {cite:dawlat-uthmaniyya-salabi p. 139}."
  es: "Uzun Hasan — Aq Qoyunlu señor de los dos Irak, Azerbaiyán y Diyar Bakr; murió en Jumada II o Rajab 882 {cite:shadharat-dhahab p. 335}. Al-Salabi añade que Mehmed II lo derrotó — 'un señor que no cumplió ningún pacto y apoyó a los enemigos de los otomanos de cualquier credo' — y que de los muchos cautivos, el sultán perdonó y honró al erudito y juez Muhammad al-Sharihi {cite:dawlat-uthmaniyya-salabi p. 139}."
  fr: "Uzun Hasan — seigneur Aq Qoyunlu des deux Iraks, de l'Azerbaïdjan et de Diyar Bakr; mort en Jumada II ou Rajab 882 {cite:shadharat-dhahab p. 335}. Al-Salabi ajoute que Mehmed II le vainquit — « un seigneur qui ne respecta aucun pacte et soutint les ennemis des Ottomans, quelle que soit leur croyance » — et que, parmi les nombreux captifs, le sultan épargna et honora le savant et juge Muhammad al-Sharihi {cite:dawlat-uthmaniyya-salabi p. 139}."
  ur: "ازون حسن - دو عراقوں، آذربائیجان اور دیار بکر کے آقا قیوونلو؛ جمادی الثانی یا رجب وفات 882۔ 335}۔ الصلابی مزید کہتے ہیں کہ محمد دوم نے اسے شکست دی - 'ایک ایسا رب جس نے کوئی عہد نہیں رکھا اور عثمانیوں کے دشمنوں کی کسی بھی مسلک کی حمایت کی' - اور یہ کہ سلطان نے بہت سے اسیروں کو بخشا اور عالم-جج محمد الشریحی کو عزت بخشی۔ 139}۔"
  tr: "Hasan Bey ibn Ali Bey ibn Qara Buluk, Irak, Azerbaycan ve Diyarbakır'ın hükümdarı; 882 Hicri yılında Cumada-el-Ahirah veya Receb'de öldü {atıf:şadharat-dhahab s. 335}. El-Sallabi, Fatih Muhammed'in onu \"bir antlaşmaya bağlı olmadan ve herhangi bir mezhebin Osmanlılarının düşmanlarını desteklediği\" halde yendiğini, çok sayıda esir aldığında fatihin Yargıç Muhammed el-Şurayhi gibi alimleri ve alimleri dışladığını belirtir; Şurayi en yüksek onurla onurlandırmıştır {atıf:davlat-uthmaniyya-salabi s. 139}."
  id: "Hasan Bey ibn Ali Bey ibn Qara Buluk, penguasa Irak, Azerbaijan, dan Diyarbakir; ia meninggal di Jumada al-Akhirah atau Rajab pada tahun 882 H {cite:shadharat-dhahab hlm. 335}. Al-Sallabi menyebutkan bahwa Muhammad Sang Penakluk mengalahkannya saat \"tidak terikat oleh perjanjian dan mendukung musuh Ottoman dari sekte manapun,\" dan ketika ia menangkap banyak tawanan, sang penakluk mengecualikan ulama dan ulama seperti Hakim Muhammad Al-Shurayhi, yang menghormatinya dengan kehormatan tertinggi {cite:dawlat-uthmaniyya-salabi hlm. 139}."
