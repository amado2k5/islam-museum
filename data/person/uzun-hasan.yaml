summary:
  ar: "حسن بك بن علي بك بن قرا بلوك متملك العراقين وأذربيجان وديار بكر؛ توفي في جمادى الآخرة أو رجب سنة اثنتين وثمانين وثمانمائة {cite:shadharat-dhahab p. 335}. ويذكر الصلابي أن محمد الفاتح هزمه وهو «لا يلتزم بعهد ويناصر أعداء العثمانيين من أي ملة كانت»، وأنه لما وقع في يده عدد كبير من الأسرى استثنى الفاتح منهم العلماء وأصحاب المعارف كالقاضي محمد الشريحي فأكرمه غاية الإكرام {cite:dawlat-uthmaniyya-salabi p. 139}."
  en: "Uzun Hasan — Aq Qoyunlu lord of the two Iraqs, Azerbaijan and Diyar Bakr; died Jumada II or Rajab 882 {cite:shadharat-dhahab p. 335}. Al-Salabi adds that Mehmed II defeated him — 'a lord who kept no covenant and backed the Ottomans' foes of whatever creed' — and that of the many captives the sultan spared and honoured the scholar-judge Muhammad al-Sharihi {cite:dawlat-uthmaniyya-salabi p. 139}."
