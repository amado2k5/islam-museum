summary:
  ar: "أبو الحسن علي بن المغيرة الأثرم، صاحب النحو والغريب واللغة، وكان وراقاً؛ سمع أبا عبيدة معمر بن المثنى وأبا سعيد الأصمعي، وروى عنه الزبير بن بكار والحسن بن مكرم وأحمد بن أبي خيثمة وأبو العباس ثعلب وغيرهم، وكان ببغداد من رواة اللغة: اللحياني والأصمعي وعلي بن المغيرة الأثرم. ومن نوادر خبره أن إسماعيل بن صبيح لما أقدم أبا عبيدة من البصرة إلى بغداد أيام الرشيد أحضر الأثرم وجعله في دار من دوره وأغلق عليه الباب ودفع إليه كتب أبي عبيدة وأمره بفسخها، وكان أصحاب أبي عبيدة يصيرون إلى الأثرم فيدفع إليهم الكتاب من تحت الباب ويوزع عليهم أجراً ويقول لهم انسخوه وسجلوه ويواعدهم وقت رده، وكان الأثرم يقرأ على أبي عبيدة ويسمع منه وهو لا يعلم، وكان أبو عبيدة من أضن الناس بكتبه. توفي في جمادى الأولى سنة اثنتين وثلاثين ومائتين {cite:tarikh-baghdad-khatib j.10 p.107-108}."
  en: "Abu'l-Hasan al-Athram — the warraq grammarian whom Isma'il b. Subayh famously locked in a house with Abu 'Ubayda's books to have them copied through the door-gap while al-Athram sat in his classes, Abu 'Ubayda, 'the most protective of men over his books', none the wiser; one of Baghdad's three transmitters of the lugha beside al-Lihyani and al-Asma'i. Died Jumada I 232 {cite:tarikh-baghdad-khatib j.10 p.107-108}."
