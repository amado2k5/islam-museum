summary:
  ar: "أبو الحسن علي بن المغيرة الأثرم، صاحب النحو والغريب واللغة، وكان وراقاً؛ سمع أبا عبيدة معمر بن المثنى وأبا سعيد الأصمعي، وروى عنه الزبير بن بكار والحسن بن مكرم وأحمد بن أبي خيثمة وأبو العباس ثعلب وغيرهم، وكان ببغداد من رواة اللغة: اللحياني والأصمعي وعلي بن المغيرة الأثرم. ومن نوادر خبره أن إسماعيل بن صبيح لما أقدم أبا عبيدة من البصرة إلى بغداد أيام الرشيد أحضر الأثرم وجعله في دار من دوره وأغلق عليه الباب ودفع إليه كتب أبي عبيدة وأمره بفسخها، وكان أصحاب أبي عبيدة يصيرون إلى الأثرم فيدفع إليهم الكتاب من تحت الباب ويوزع عليهم أجراً ويقول لهم انسخوه وسجلوه ويواعدهم وقت رده، وكان الأثرم يقرأ على أبي عبيدة ويسمع منه وهو لا يعلم، وكان أبو عبيدة من أضن الناس بكتبه. توفي في جمادى الأولى سنة اثنتين وثلاثين ومائتين {cite:tarikh-baghdad-khatib j.10 p.107-108}."
  en: "Abu'l-Hasan al-Athram — the warraq grammarian whom Isma'il b. Subayh famously locked in a house with Abu 'Ubayda's books to have them copied through the door-gap while al-Athram sat in his classes, Abu 'Ubayda, 'the most protective of men over his books', none the wiser; one of Baghdad's three transmitters of the lugha beside al-Lihyani and al-Asma'i. Died Jumada I 232 {cite:tarikh-baghdad-khatib j.10 p.107-108}."
  es: "Abu'l-Hasan al-Athram — el gramático warraq a quien Isma'il b. Subayh encerró en una casa con los libros de Abu 'Ubayda para copiarlos a través de la rendija de la puerta mientras al-Athram asistía a sus clases; Abu 'Ubayda, «el más protector de los hombres con sus libros», no se enteró de nada; fue uno de los tres transmisores de la lugha de Bagdad junto con al-Lihyani y al-Asma'i. Murió en Jumada I de 232 {cite:tarikh-baghdad-khatib j.10 p.107-108}."
  fr: "Abou al-Hasan al-Athram, le grammairien warraq, qu'Ismaïl ibn Subayh enferma dans une maison avec les livres d'Abou Ubayda pour les faire recopier à travers l'entrebâillement de la porte, tandis qu'al-Athram suivait ses cours. Abou Ubayda, « le plus protecteur des hommes envers ses livres », n'y voyait que du feu. Il était l'un des trois transmetteurs du lugha à Bagdad, avec al-Lihyani et al-Asma'i. Il mourut en Jumada I 232 (cite: tarikh-baghdad-khatib j.10 p.107-108)."
  ur: "ابو الحسن الاتھرام - ورق گرامر جسے اسماعیل بن۔ سبیح مشہور طور پر ابو عبیدہ کی کتابوں کے ساتھ ایک گھر میں بند تھی تاکہ انہیں دروازے کے خلا سے نقل کیا جاسکے جب کہ الاتھرام اپنی کلاسوں میں بیٹھا تھا، ابو عبیدہ، 'اپنی کتابوں کا سب سے زیادہ محافظ'، اس سے زیادہ عقلمند کوئی نہیں تھا۔ بغداد کے اللیانی اور الاسمائی کے ساتھ لغا کے تین ٹرانسمیٹروں میں سے ایک۔ متوفی جمادی الثانی 232 {حوالہ: تاریخ بغداد خطیب ج10 ص107-108}۔"
  tr: "Ebu el-Hasan Ali ibn al-Muhira el-Atram, dilbilgisi, rab ve dilbilimi ustasıydı. Usta bir alimdi; Ebu Ubeyde Muammer ibn al-Muthanna ve Ebu Seyid el-Esma'i, el-Zubeyr bin Bakkar, el-Hasan ibn Makram, Ahmed ibn Ebi Khaythamah, Ebu el-Abbas Telab ve diğerlerinin kendisinden rivayet ettiğini duydu. Bağdat'ta dilin anlatıcıları arasında el-Lihyani, el-Esmei ve Ali bin Muğhira el-Atram vardı. Nadir raporlarından biri, İsmail bin Subayh'in Ebu Ubeyde'yi el-Reşid zamanında Basra'dan Bağdat'a getirdiğinde, el-Atrem'i kendi evinde bir evine koyduğu, kapıyı kapattığı, Ebu Ubeyde'nin kitaplarını teslim ettiği ve iptal edilmesini emrettiği belirtilir. Ebu Ubeyde'nin yoldaşları al-Athram'a gelir, mektubu kapının altından verir, onlara ücret dağıtır, kopyalamalarını, kaydetmelerini söyler ve geri döndüğünde söz verirdi. El-Atrem, Ebu Ubeyde'ye okuyup onu bilmeden dinlerdi ve Ebu Ubeyde kitaplarıyla en güvensiz insanlardan biriydi. İki yüz otuz iki yılda Cumade'l-Evval'de öldü {citasyon:Tarikh-baghdad-khatib J.10, s.107-108}."
  id: "Abu al-Hasan Ali ibn al-Mughira al-Athram adalah seorang ahli tata bahasa, rab, dan linguistik. Ia adalah seorang cendekiawan yang terampil; ia mendengar Abu Ubaidah Mu'ammar ibn al-Muthanna dan Abu Sa'id al-Asma'i, serta al-Zubayr ibn Bakkar, al-Hasan ibn Makram, Ahmad ibn Abi Khaythamah, Abu al-Abbas Tha'lab, dan lainnya menceritakan darinya. Di Baghdad, di antara para narator bahasa ini adalah: al-Lihyani, al-Asma'i, dan Ali ibn al-Mughira al-Athram. Di antara laporan langka tentang laporannya adalah ketika Ismail ibn Subaih membawa Abu Ubaidah dari Basra ke Baghdad pada masa al-Rashid, ia membawa al-Athram, meletakkannya di rumah miliknya sendiri, menutup pintu untuknya, menyerahkan buku-buku Abu Ubaidah, dan memerintahkan agar buku-buku itu dibatalkan. Para sahabat Abu Ubaïdah akan datang kepada al-Athram, yang akan menyerahkan surat itu dari bawah pintu, membagikan upah kepada mereka, menyuruh mereka menyalin, mencatatnya, dan berjanji ketika surat itu dikembalikan. Al-Athram membacakan surat kepada Abu Ubaidah dan mendengarkannya tanpa mengetahuinya, dan Abu Ubaidah termasuk orang yang paling tidak percaya dengan buku-bukunya. Ia meninggal di Jumada al-Awwal pada tahun dua ratus tiga puluh dua {cite:Tarikh-baghdad-khatib J.10, hlm.107-108}."
