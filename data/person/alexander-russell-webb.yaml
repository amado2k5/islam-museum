summary:
  ar: "صحفي وناشر ودبلوماسي أمريكي (1846–1916)، قنصل الولايات المتحدة في مانيلا، واعتنق الإسلام سنة 1888 ⁦(وتذكر مصادر 1887)⁩، من أوائل الأمريكيين البارزين الذين فعلوا ذلك. زار الهند ومصر وتركيا، وأسّس في نيويورك «دار النشر الشرقية» ومجلة «العالم الإسلامي»، وكان الممثل الوحيد للإسلام تقريبًا في برلمان الأديان بشيكاغو سنة 1893."
  en: "American journalist, publisher and diplomat (1846–1916), United States consul at Manila, who embraced Islam in 1888 (one source says 1887) and is among the first prominent Americans to do so. He visited India, Egypt and Turkey, founded the Oriental Publishing Company and the journal The Moslem World in New York, and was apparently the only representative of Islam at the Parliament of the World's Religions in Chicago in 1893."
  ur: "امریکی صحافی، ناشر اور سفارت کار (1846–1916)، منیلا میں امریکی قونصل، جنھوں نے 1888 میں اسلام قبول کیا ⁦(ایک ماخذ کے مطابق 1887)⁩ اور ایسا کرنے والے ابتدائی نمایاں امریکیوں میں شمار ہوتے ہیں۔ انھوں نے ہندوستان، مصر اور ترکی کا سفر کیا، نیویارک میں «اورینٹل پبلشنگ کمپنی» اور رسالہ «دی مسلم ورلڈ» قائم کیا اور 1893 میں شکاگو کی پارلیمنٹ آف دی ورلڈز ریلیجنز میں بظاہر اسلام کے واحد نمائندے تھے۔"
  fr: "Journaliste, éditeur et diplomate américain (1846–1916), consul des États-Unis à Manille, qui embrassa l'islam en 1888 (une source dit 1887) et compte parmi les premiers Américains éminents à le faire. Il visita l'Inde, l'Égypte et la Turquie, fonda à New York l'Oriental Publishing Company et la revue *The Moslem World*, et fut apparemment le seul représentant de l'islam au Parlement des religions du monde de Chicago en 1893."
  es: "Periodista, editor y diplomático estadounidense (1846–1916), cónsul de Estados Unidos en Manila, que abrazó el islam en 1888 (una fuente dice 1887) y figura entre los primeros estadounidenses destacados en hacerlo. Visitó la India, Egipto y Turquía, fundó en Nueva York la Oriental Publishing Company y la revista *The Moslem World*, y fue al parecer el único representante del islam en el Parlamento de las Religiones del Mundo en Chicago en 1893."
