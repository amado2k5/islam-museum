summary:
  ar: "رسام وعالم آثار ومدير متاحف عثماني، وُلد في إسطنبول سنة 1842 وتوفي فيها سنة 1910. ابن الصدر الأعظم إبراهيم أدهم باشا، درس الرسم في باريس على جيروم وبولانجيه، وأدار المتحف الإمبراطوري من سنة 1881 فأسس متاحف إسطنبول الأثرية وأكاديمية الفنون الجميلة، وسنّ نظام الآثار العثماني، وقاد حفريات نمرود داغ وصيدا، ورسم لوحات منها «مدرب السلاحف» و«فتاة تتلو القرآن»."
  en: "Ottoman painter, archaeologist and museum director, born in Istanbul in 1842 and died there in 1910. Son of Grand Vizier Ibrahim Edhem Pasha, he trained in painting in Paris under Gérôme and Boulanger, directed the Imperial Museum from 1881, founded the Istanbul Archaeology Museums and the Academy of Fine Arts, wrote the Ottoman antiquities regulation, excavated at Nemrut Dağı and Sidon, and painted works including The Tortoise Trainer and Girl Reciting Qur'an."
  ur: "عثمانی مصور، ماہر آثار قدیمہ اور عجائب گھر کے مدیر، جو 1842 میں استنبول میں پیدا ہوئے اور 1910 میں وہیں وفات پائی۔ صدر اعظم ابراہیم ادہم پاشا کے بیٹے، انہوں نے پیرس میں ژیروم اور بولانژے سے مصوری سیکھی، 1881 سے شاہی عجائب گھر کے مدیر رہے، استنبول کے عجائب خانۂ آثار قدیمہ اور اکادمی فنون جمیلہ کی بنیاد رکھی، آثار قدیمہ کا قانون بنایا، نمرود داغ اور صیدا کی کھدائی کی، اور «مدرب السلاحف» جیسی لوحات بنائیں۔"
