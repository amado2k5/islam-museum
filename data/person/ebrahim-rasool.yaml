summary:
  ar: سياسي ودبلوماسي جنوب أفريقي من كيب تاون، كان خامس رئيس لحكومة مقاطعة كيب الغربية (2004–2008)، وسفير بلاده لدى الولايات المتحدة (2010–2015 ومرة أخرى سنة 2025) حتى أُعلن شخصًا غير مرغوب فيه وطُرد في مارس 2025.
  en: South African politician and diplomat from Cape Town who was the fifth premier of the Western Cape (2004–2008) and his country's ambassador to the United States (2010–2015, and again in 2025) until he was declared persona non grata and expelled in March 2025.
  ur: کیپ ٹاؤن سے تعلق رکھنے والے جنوبی افریقی سیاست دان اور سفارت کار جو مغربی کیپ کے پانچویں پریمیئر (2004–2008) اور امریکہ میں اپنے ملک کے سفیر (2010–2015 اور پھر 2025) رہے، یہاں تک کہ مارچ 2025 میں انہیں ناپسندیدہ شخص قرار دے کر نکال دیا گیا۔
