summary:
  ar: سليمان بن عبد الله بن علي بن عمار البحراني الماحوزي، فقيه إمامي خطيب شاعر من الماحوز في البحرين، من تصانيفه أزهار الرياض؛ ١٠٧٥ إلى ١١٢١هـ.
  en: Sulayman ibn Abd Allah ibn Ali ibn Ammar al-Bahrani al-Mahuzi, an Imami jurist, preacher and poet of al-Mahuz in Bahrain, author of Azhar al-Riyad; 1075 to 1121 AH.
  es: "Sulayman ibn Abd Allah ibn Ali ibn Ammar al-Bahrani al-Mahuzi, jurista imami, predicador y poeta de al-Mahuz en Bahrein, autor de Azhar al-Riyad; 1075 al 1121 d. H."
  fr: "Sulayman ibn Abd Allah ibn Ali ibn Ammar al-Bahrani al-Mahuzi, juriste Imami, prédicateur et poète d'al-Mahuz à Bahreïn, auteur d'Azhar al-Riyad; 1075 à 1121 AH."
  ur: "سلیمان بن عبد اللہ بن علی ابن عمار البحرانی المحوزی، امامی فقیہ، بحرین میں المحوز کے مبلغ اور شاعر، ازہر الریاض کے مصنف؛ 1075 تا 1121 ہجری۔"
