class: person
label: { ar: "صالح بن محمد الحريري", en: "Salih al-Hariri", es: "Salih al-Hariri", fr: "Salih al-Hariri", ur: "صالح الحریری" }
summary:
  ar: "من ندماء المنتصر في أيام إمارته، سأله هل عشقت قط فحكى له أنه أحب جارية قينة أم ولد الرشيد بالرصافة أيام المعتصم وهددته حين راسلها، فبعث المنتصر فأحضرها فإذا عجوز حدبت وعنست وبها بقية جمال فزوجه إياها وأمهرها ونثر عليه الجوز المرصص والفرك المخلق فأقامت معه مدة ثم ملها ففارقها {cite:muruj-al-dhahab p. 522-524}."
  en: "Al-Muntasir's drinking-companion whose decades-old love for Qayna's freedwoman was fulfilled with a hunched bride and a pelting of leaded walnuts — he soon divorced her {cite:muruj-al-dhahab p. 522-524}."
  es: "El compañero de bebida de Al-Muntasir, cuyo amor de décadas por la mujer liberada de Qayna se vio consumado con una novia encorvada y una lluvia de nueces con plomo, pronto se divorció de ella {cite:muruj-al-dhahab p. 522-524}."
  fr: "Le compagnon de beuverie d'Al-Muntasir dont l'amour de plusieurs décennies pour l'affranchie de Qayna fut comblé par une épouse voûtée et un jet de noix plombées — il divorça bientôt d'elle {cite:muruj-al-dhahab p. 522-524}."
  ur: "المنتصر کی شراب نوشی کرنے والی ساتھی جس کی قینہ کی آزاد عورت سے کئی دہائیوں پرانی محبت ایک شکاری دلہن اور سیسہ پلائی ہوئی اخروٹ سے پوری ہوئی - اس نے جلد ہی اسے طلاق دے دی۔ 522-524}۔"
  tr: "Al-Muntasir'in emirliği dönemindeki yakın dostlarından biri olan Al-Muntasir, ona hiç aşık olup olmadığını sordu. Ona, Al-Mu'tasim'in günlerinde Al-Rusafa'da Qayna'nın köle kızı Umm Walad Al-Rashid'i sevdiğini ve onu gönderdiğinde onu tehdit ettiğini söyledi. Al-Muntasir onu gönderip getirdi, fakat yaşlanıp iğne olunca ona birkaç deve bıraktı. Onunla evlendi, ona hediye verdi ve süslü cevizler ile üzerine yapılan sürtümlerle dağıttı. Bir süre onunla kaldı, sonra Qayna yoruldu ve ondan ayrıldı {cite:muruj-al-dhahab, s. 522-524}."
  id: "Salah satu rekan dekat Al-Muntasir selama emiratnya, ia bertanya apakah ia pernah jatuh cinta. Ia mengatakan bahwa ia mencintai gadis budak Qayna, um Walad Al-Rashid di Al-Rusafa pada masa Al-Mu'tasim, dan gadis itu mengancamnya ketika ia mengirimnya. Al-Muntasir mengirim dan membawanya, tetapi ketika ia tua dan menjadi spindle, ia meninggalkannya dengan beberapa unta. Ia menikahinya, menaburkannya dan menaburkannya dengan kenari yang dihias serta gosokan yang dibuat di tubuhnya. Gadis itu tinggal bersamanya untuk beberapa waktu, lalu ia kelelahan dan berpisah darinya {cite:muruj-al-dhahab, hlm. 522-524}."
