summary:
  ar: "جار الله بن عبد العزيز بن عمر بن محمد بن فهد الهاشمي المكي الشافعي الإمام العلامة المسند المؤرخ؛ ولد ليلة السبت العشرين من رجب سنة إحدى وتسعين وثمانمائة بمكة ونشأ بها في كفل أبويه، وسمع من السخاوي والمحب الطبري ولازم والده في القراءة والسماع وتوجه معه للمدينة فجاورا بها سنة تسع وتسعمائة وسمع بها من لفظ والده تجاه الحجرة الشريفة الكتب الستة والشفا لعياض وعلى السيد السمهودي بعضها وتاريته الوفا وفتاواه وألبسه خرقة التصوف، ورحل إلى مصر والشام وبيت المقدس وحلب وأنمين وأخذ بها وبغيرها عن نحو السبعين من المسندين وأجاز له خلق كثيرون جمعهم في مجمع حافل، ولازم الشيخ عبد الحق السنباطي والمحب النويري وبرع في العلوم العقلية والشرعية ودخل بلاد الروم وحدث بالحرمين؛ توفي ليلة الثلاثاء خامس عشر جمادى الآخرة سنة أربع وخمسين وتسعمائة {cite:shadharat-dhahab p. 717}."
  en: "Jar Allah Ibn Fahd — b. Saturday eve 20 Rajab 891 at Mecca; he heard the Six Books and Qadi 'Iyad's Shifa' read by his father opposite the Noble Chamber during the family's 909 Medina mujawara, received the khirqa, then journeyed through Egypt, Syria, Jerusalem, Aleppo and Armenia taking from some seventy musnids; companion of 'Abd al-Haqq al-Sunbati; died Tuesday eve 15 Jumada II 954 {cite:shadharat-dhahab p. 717}."
  es: "Jar Allah Ibn Fahd — n. la víspera del sábado 20 de Rajab de 891 en La Meca; escuchó los Seis Libros y el Shifa de Qadi Iyad leídos por su padre frente a la Cámara Noble durante la mudanza de la familia a Medina en 909, recibió la khirqa, luego viajó por Egipto, Siria, Jerusalén, Alepo y Armenia tomando de unos setenta musnids; compañero de 'Abd al-Haqq al-Sunbati; murió la víspera del martes 15 de Jumada II de 954 {cite:shadharat-dhahab p. 717}."
  fr: "Jar Allah Ibn Fahd — né le samedi soir 20 Rajab 891 à La Mecque; il entendit les Six Livres et le Shifa' du cadi 'Iyad lus par son père en face de la Chambre Noble lors du mujawara de la famille à Médine en 909, reçut la khirqa, puis voyagea à travers l'Égypte, la Syrie, Jérusalem, Alep et l'Arménie, recevant de quelque soixante-dix musnides; compagnon de 'Abd al-Haqq al-Sunbati; mort le mardi soir 15 Jumada II 954 {cite:shadharat-dhahab p. 717}."
  ur: "جار اللہ ابن فہد۔ ہفتہ کی شام 20 رجب 891 مکہ میں؛ اس نے خاندان کے 909 مدینہ مجاورہ کے دوران نوبل چیمبر کے سامنے اپنے والد کی طرف سے پڑھی جانے والی چھ کتابیں اور قاضی 'عیاد کی شفا' سنی، خرقہ حاصل کیا، پھر مصر، شام، یروشلم، حلب اور آرمینیا کا سفر کیا اور تقریباً 70 مسندوں سے لے کر؛ عبد الحق السنبتی کے ساتھی؛ وصال منگل کی شام 15 جمادی الثانی 954 717}۔"
  tr: "Jarallah bin Abdul Aziz bin Umar bin Muhammed bin Fahd Al-Hashimi Al-Makki Al-Shafi'i, imam, seçkin alim Musnad ve tarihçi; 891 Hicri yılında, yirminci Rajab'ın Cumartesi gecesi Mekke'de doğdu ve ailesinin bakımında büyüdü. Al-Sakhawi ve Al-Muhibb Al-Tabari'den haber aldı ve babasını okuma ve işitme konusunda yakından takip etti. Onunla birlikte Medine'ye seyahat etti ve 1999 yılında orada yaşadılar. Babası soylu odadaki sözlerinden, Iyad'ın altı kitabı ve El-Şifası, bazılarına sadık olduğu Ali Al-Samhudi ve Seyyid Al-Samhudi'nin fetvalarını duydu ve onu tasavvufun pelerinine giydirdi. Ayrıldı. Mısır, Levant, Kudüs, Halep ve Anmin'e kadar ve onları ve diğer yerlere yaklaşık yetmiş Müsnadin âliminden aldı. Birçok kişi onları büyük bir toplantıda toplamaya yetkilendirildi. Şeyh Abdul Hakk el-Sunbati ve el-Muhibb el-Nuveyri yanında eğitim aldı, akıl ve dini bilimlerde üstün oldu, Romalıların topraklarına girdi ve İki Kutsal Camii'de konuşmalar yaptı. Dokuz yüz elli dört yılın on beşinci Cumade'l-Ahhirah'ın Salı gecesi vefat etti {atıf:shadharat-dhahab, s. 717}."
  id: "Jarallah bin Abdul Aziz bin Umar bin Muhammad bin Fahd Al-Hashimi Al-Makki Al-Shafi'i, sang Imam, ulama terkemuka, Musnad, dan sejarawan; lahir pada malam Sabtu, tanggal dua puluh Rajab, tahun 891 H, di Mekah, tempat ia tumbuh di bawah asuhan orang tuanya. Ia mendengar dari Al-Sakhawi dan Al-Muhibb Al-Tabari, dan mengikuti ayahnya dengan dekat dalam membaca dan mendengar. Ia ikut pergi ke Madinah, tempat mereka tinggal di sana pada tahun 1999. Dari kata-kata ayahnya di ruang bangsawan, ia mendengar enam kitab dan Al-Shifa karya Iyad, Ali Al-Samhudi dan Sayyid Al-Samhudi, beberapa di antaranya ia setia padanya, fatwa-fatwanya, dan ia mengenakan jubah Sufisme. Ia pergi. ke Mesir, Levant, Yerusalem, Aleppo, dan Anmin, dan ia merebutnya serta tempat-tempat lain dari sekitar tujuh puluh ulama Musnadin. Banyak orang diberi wewenang untuk mengumpulkan mereka dalam satu pertemuan besar. Ia belajar di bawah bimbingan Sheikh Abdul Haqq al-Sunbati dan al-Muhibb al-Nuwayri, unggul dalam ilmu rasional dan agama, memasuki tanah Romawi, dan berbicara di Dua Masjid Suci. Ia meninggal pada malam Selasa, tanggal lima belas Jumada al-Akhirah tahun sembilan ratus lima puluh empat {cite:shadharat-dhahab, hlm. 717}."
