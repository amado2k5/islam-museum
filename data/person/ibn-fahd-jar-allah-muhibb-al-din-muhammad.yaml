summary:
  ar: "جار الله بن عبد العزيز بن عمر بن محمد بن فهد الهاشمي المكي الشافعي الإمام العلامة المسند المؤرخ؛ ولد ليلة السبت العشرين من رجب سنة إحدى وتسعين وثمانمائة بمكة ونشأ بها في كفل أبويه، وسمع من السخاوي والمحب الطبري ولازم والده في القراءة والسماع وتوجه معه للمدينة فجاورا بها سنة تسع وتسعمائة وسمع بها من لفظ والده تجاه الحجرة الشريفة الكتب الستة والشفا لعياض وعلى السيد السمهودي بعضها وتاريته الوفا وفتاواه وألبسه خرقة التصوف، ورحل إلى مصر والشام وبيت المقدس وحلب وأنمين وأخذ بها وبغيرها عن نحو السبعين من المسندين وأجاز له خلق كثيرون جمعهم في مجمع حافل، ولازم الشيخ عبد الحق السنباطي والمحب النويري وبرع في العلوم العقلية والشرعية ودخل بلاد الروم وحدث بالحرمين؛ توفي ليلة الثلاثاء خامس عشر جمادى الآخرة سنة أربع وخمسين وتسعمائة {cite:shadharat-dhahab p. 717}."
  en: "Jar Allah Ibn Fahd — b. Saturday eve 20 Rajab 891 at Mecca; he heard the Six Books and Qadi 'Iyad's Shifa' read by his father opposite the Noble Chamber during the family's 909 Medina mujawara, received the khirqa, then journeyed through Egypt, Syria, Jerusalem, Aleppo and Armenia taking from some seventy musnids; companion of 'Abd al-Haqq al-Sunbati; died Tuesday eve 15 Jumada II 954 {cite:shadharat-dhahab p. 717}."
