summary:
  ar: "الحافظ تقي الدين الفاسي ثم المكي؛ ذو تجربة وحذق وعشرة وحلاوة لسان يجلب القلوب بحسن عبارته ولطيف إشارته، قال ابن حجر رافقني في السماع كثيراً بمصر والشام واليمن وغيرها وكنت أوده وأعظمه وأقوم معه في مهماته ولقد ساءني موته وأسفت على فقد مثله، وكان قد أصيب ببصره وله في ذلك أخبار ومكث من قذحه فما أطاق ذلك ولا أفاده، ومن مصنفاته العقد الثمين في أخبار البلد الأمين وشفاء الغرام في أخبار البلد الحرام، توفي بمكة في رابع شوال سنة اثنتين وثلاثين وثمانمائة {cite:shadharat-dhahab p. 199}."
  en: "The hafiz Taqi al-Din al-Fasi of Mecca — Ibn Hajar's beloved study-companion across Egypt, Syria and Yemen ('his death grieved me'); author of al-'Iqd al-Thamin and Shifa' al-Gharam on the histories of Medina and Mecca; died at Mecca 4 Shawwal 832 {cite:shadharat-dhahab p. 199}."
  es: "El hafiz Taqi al-Din al-Fasi de La Meca, el querido compañero de estudio de Ibn Hajar a través de Egipto, Siria y Yemen («su muerte me afligió»); autor de al-'Iqd al-Thamin y Shifa' al-Gharam sobre las historias de Medina y La Meca; murió en La Meca el 4 de Shawwal de 832 {cita: shadharat-dhahab p. 199}."
  fr: "Le hafiz Taqi al-Din al-Fasi de La Mecque — le compagnon d'étude bien-aimé d'Ibn Hajar à travers l'Égypte, la Syrie et le Yémen (« sa mort m'a attristé »); auteur d'al-'Iqd al-Thamin et de Shifa' al-Gharam sur les histoires de Médine et de La Mecque; Il est mort à La Mecque le 4 Shawwal 832 {cite:shadharat-dhahab p. 199}."
  ur: "مکہ کے حافظ تقی الدین الفاسی - مصر، شام اور یمن میں ابن حجر کے پیارے مطالعہ کے ساتھی ⁦('ان کی موت نے مجھے غمگین کیا')⁩؛ مدینہ اور مکہ کی تاریخ پر العقد الثمین اور شفاء الغرام کے مصنف؛ آپ کی وفات مکہ 4 شوال 832 میں ہوئی۔ 199}۔"
  tr: "Ezberci Taqi al-Din al-Fasi, o zamanlar el-Makki; deneyimli, becerikli, tanınmış ve tatlı dilli, güzel ifadesi ve nazik jestleriyle kalpleri büyüleyen biriydi. İbn Hajar şöyle dedi: Mısır, Levant, Yemen ve başka yerlerde birçok kez bana eşlik etti. Onu sevdim, onurlandırdım ve görevlerinde yanında durdum. Onun ölümü beni üzdü ve onun gibi birinin kaybı için üzdü. Görme yetisini kaybetmişti ve bununla ilgili hikayeler anlattı, kederinde kaldı ama dayanamadı ve ona fayda sağlayamadı. Eserleri arasında 'Al-'Aqd al-Thamin fi Akhbar al-Balad al-Amin' ve 'Şifa' al-Gharam fi Akhbar al-Balad al-Haram vardır. Sekiz yüz otuz iki yılın 4'ünde Mekke'de vefat etti {cite:shadharat-dhahab, s. 199}."
  id: "Pengapal Taqi al-Din al-Fasi, saat itu al-Makki; berpengalaman, terampil, terkenal, dan lidah manis yang memikat hati dengan ekspresi indah dan gerak-geri lembutnya. Ibn Hajar berkata: Dia sering menemani saya mendengarkan di Mesir, Levant, Yaman, dan tempat lain. Saya mencintai dan menghormatinya serta berdiri di sisinya dalam misinya. Kematiannya membuat saya sedih dan sedih atas kehilangan seseorang seperti dia. Dia kehilangan penglihatannya dan memiliki cerita tentangnya, dan dia tetap dalam kesedihannya, tetapi dia tidak sanggup menanggung atau memberi manfaat baginya. Di antara karyanya adalah 'Al-'Aqd al-Thamin fi Akhbar al-Balad al-Amin' dan 'Shifa' al-Gharam fi Akhbar al-Balad al-Haram. Dia meninggal di Mekah pada tanggal empat Shawwal tahun delapan ratus tiga puluh dua {cite:shadharat-dhahab, hlm. 199}."
