summary:
  ar: "الحافظ تقي الدين الفاسي ثم المكي؛ ذو تجربة وحذق وعشرة وحلاوة لسان يجلب القلوب بحسن عبارته ولطيف إشارته، قال ابن حجر رافقني في السماع كثيراً بمصر والشام واليمن وغيرها وكنت أوده وأعظمه وأقوم معه في مهماته ولقد ساءني موته وأسفت على فقد مثله، وكان قد أصيب ببصره وله في ذلك أخبار ومكث من قذحه فما أطاق ذلك ولا أفاده، ومن مصنفاته العقد الثمين في أخبار البلد الأمين وشفاء الغرام في أخبار البلد الحرام، توفي بمكة في رابع شوال سنة اثنتين وثلاثين وثمانمائة {cite:shadharat-dhahab p. 199}."
  en: "The hafiz Taqi al-Din al-Fasi of Mecca — Ibn Hajar's beloved study-companion across Egypt, Syria and Yemen ('his death grieved me'); author of al-'Iqd al-Thamin and Shifa' al-Gharam on the histories of Medina and Mecca; died at Mecca 4 Shawwal 832 {cite:shadharat-dhahab p. 199}."
