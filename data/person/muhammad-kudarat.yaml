summary:
  ar: "محمد ديباتوان قدرة الله (1581–1671)، سابع سلاطين ماغوينداناو في مينداناو بالفلبين، حكم من نحو 1616 أو 1619 إلى وفاته. من نسل الشريف كابونغسوان الذي حمل الإسلام إلى مينداناو، صدّ الغزوات الإسبانية عقودًا وحال دون انتشار الكاثوليكية في الجزيرة، وخاطب داتوات لاناو سنة 1639 خطابًا مشهورًا في الدفاع عن الحرية، وعقد معاهدة مع الإسبان سنة 1645، وتُسمّى باسمه مقاطعة وبلدية في الفلبين اليوم."
  en: "Muhammad Dipatuan Kudarat (1581-1671) was the seventh sultan of Maguindanao in Mindanao, in the Philippines, reigning from about 1616 or 1619 until his death. A descendant of Shariff Kabungsuwan, who had brought Islam to Mindanao, he fought off Spanish invasions for decades and halted the spread of Catholicism on the island, addressed the datus of Lanao in 1639 in a famous speech in defence of liberty, and concluded a treaty with Spain in 1645; a Philippine province and municipality bear his name today."
  ur: "محمد دیپاتوان قدرت اللہ (1581ء–1671ء) فلپائن کے مینداناؤ میں ماگوئنداناؤ کے ساتویں سلطان تھے، جن کا دور تقریباً 1616ء یا 1619ء سے وفات تک رہا۔ شریف کابونگ سوان کی نسل سے تھے جنہوں نے مینداناؤ میں اسلام پہنچایا؛ انھوں نے دہائیوں تک ہسپانوی حملے روکے اور جزیرے میں کیتھولک مذہب کا پھیلاؤ روکا، 1639ء میں لاناؤ کے داتوؤں سے آزادی کے دفاع میں مشہور خطاب کیا اور 1645ء میں سپین سے معاہدہ کیا؛ آج فلپائن کا ایک صوبہ اور ایک بلدیہ ان کے نام پر ہے۔"

