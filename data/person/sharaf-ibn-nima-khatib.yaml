summary:
  ar: "خطيب دمشق ومفتيها وشيخ الشافعية بها؛ سمع من السخاوي وابن الصلاح وتفقه على ابن عبد السلام وبرع في الفقه والأصول والعربية، وناب في الحكم مدة ودرّس بالشامية والغزالية وكتب الخط المنسوب الفائق وألّف كتاباً في الأصول؛ وكان من محاسن الزمان وله ألغاز مشهورة منها لغزه في الناعورة {cite:shadharat-dhahab p. 742}."
  tr: "Şam'ın vaizi, müftüsünü ve oradaki Şafii şeyhiydi; el-Sakhavi ve İbn el-Salah'tan dinledi, İbn Abdülselam'dan fıkıh okudu, fıkıh, ilkeler ve Arapça'da üstün başarı gösterdi, bir süre yönetimde vekil olarak görev yaptı, el-Şamiyye ve el-Gazaliye dersleri verdi, seçkin atıfın seçkin yazısını yazdı ve temel bilgiler üzerine bir kitap yazdı. Zamanının güzelleştiricilerinden biriydi ve su çarkı bilmecesi de dahil olmak üzere ünlü bilmeceleri vardır {atıf:shadharat-dhahab, s. 742}."
  id: "Ia adalah pengkhotbah Damaskus, muftinya, dan sheikh Shafi'i di sana; ia mendengar dari al-Sakhawi dan Ibn al-Salah, mempelajari hukum di bawah bimbingan Ibn Abd al-Salam, unggul dalam firisprudensi, prinsip, dan bahasa Arab, pernah menjabat sebagai wakil pemerintahan untuk beberapa waktu, mengajar di al-Shamiyyah dan al-Ghazaliyya, menulis naskah terhormat atribusi terhormat, dan menulis buku tentang dasar-dasar. Ia termasuk di antara para pengindah pada zamannya dan memiliki teka-teki terkenal, termasuk teka-teki tentang roda air {cite:shadharat-dhahab, hlm. 742}."
