  ar: "أبو الطيب سهل بن محمد الصعلوكي الحنفي، من بني حنيفة، تفقه على أبيه أبي سهل، وكان فقيهاً أديباً، جمع رياسة الدين والدنيا، وأخذ عنه فقهاء نيسابور {cite:tabaqat-fuqaha-abbas-1981 p. 63}. لم يذكر الشيرازي وفاته."
  en: "Abu al-Tayyib Sahl ibn Muhammad al-Su'luki al-Hanafi, of the Banu Hanifa, studied jurisprudence under his father Abu Sahl. He was a jurist and man of letters who combined leadership in religion and in worldly affairs, and the jurists of Nishapur took from him {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Shirazi does not mention his death."
