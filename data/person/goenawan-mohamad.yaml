summary:
  ar: شاعر وكاتب وصحفي إندونيسي وُلد سنة 1941 في باتانغ؛ شارك في تأسيس مجلة «تيمبو» الإخبارية الأسبوعية سنة 1971 وقادها عقودًا مقاومًا رقابة سوهارتو، ويُعدّ من أعظم المثقفين العموميين الإندونيسيين.
  en: Indonesian poet, essayist and journalist born in Batang in 1941; co-founder of the weekly news magazine Tempo in 1971, he led it for decades resisting Suharto-era censorship, and is counted among
    Indonesia's greatest public intellectuals.
  ur: انڈونیشی شاعر، مضمون نگار اور صحافی جو 1941 میں باتانگ میں پیدا ہوا؛ ہفت روزہ نیوز میگزین Tempo کے 1971 کے شریک بانی، دہائیوں سوہارتو دور کی سینسرشپ کے خلاف اس کی قیادت کی اور انڈونیشیا کے عظیم ترین
    عوامی مفکرین میں شمار ہوئے۔
  es: "Poeta, ensayista y periodista indonesio nacido en Batang en 1941; cofundador de la revista semanal de noticias Tempo en 1971, la dirigió durante décadas resistiendo la censura de la era de Suharto, y es considerado uno de los más grandes intelectuales públicos de Indonesia."
  fr: "Poète, essayiste et journaliste indonésien né à Batang en 1941; cofondateur de l'hebdomadaire d'actualités Tempo en 1971, il l'a dirigé pendant des décennies en résistant à la censure de l'ère Suharto, et compte parmi les plus grands intellectuels publics d'Indonésie."
  tr: "1941 yılında Batang'da doğmuş Endonezyalı şair, yazar ve gazeteci; 1971'de haftalık haber dergisi 'Timboo'nun kurucularından oldu ve Suharto'nun sansürüne karşı onlarca yıl boyunca liderlik etti. Endonezya'nın en büyük kamu entelektüellerinden biri olarak kabul edilir."
  id: "Seorang penyair, penulis, dan jurnalis Indonesia yang lahir pada tahun 1941 di Batang; ia ikut mendirikan majalah berita mingguan 'Timboo' pada tahun 1971 dan memimpinnya selama puluhan tahun melawan sensor Suharto. Ia dianggap sebagai salah satu intelektual publik terbesar Indonesia."
