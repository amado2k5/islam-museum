summary:
  ar: "الأزدي الذي عطف نحو الحجاز في هجرة الأزد فأقام بين الثعلبية وذي قار، ثم سار إلى المدينة فاستوطنها لما كبر ولده؛ ومن أبنائه الأوس والخزرج ابنا حارثة بن ثعلبة، في رواية الرحيق المختوم."
  en: "The Azdi who turned toward the Hijaz in the Azd migration, lived between al-Tha'labiyya and Dhu Qar, then settled Medina when his sons grew; the Aws and the Khazraj, sons of Haritha ibn Tha'laba, descend from him in al-Raheeq al-Makhtum's account."
  es: "El Azdi que se dirigió hacia el Hiyaz durante la migración Azd, vivió entre al-Tha'labiyya y Dhu Qar, y luego se estableció en Medina cuando sus hijos crecieron; los Aws y los Khazraj, hijos de Haritha ibn Tha'laba, descienden de él según el relato de al-Raheeq al-Makhtum."
  fr: "L'Azdi qui se tourna vers le Hedjaz lors de la migration Azd, vécut entre al-Tha'labiyya et Dhu Qar, puis s'installa à Médine lorsque ses fils grandirent; les Aws et les Khazraj, fils de Haritha ibn Tha'laba, descendent de lui dans le récit d'al-Raheeq al-Makhtum."
