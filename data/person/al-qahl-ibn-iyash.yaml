summary:
  ar: "القحل بن عياش بن حسان بن عامر بن شراحيل الكلابي؛ قاتل يزيد بن المهلب؛ لما عطفت خيول أهل الشام على يزيد وأصحابه وثب القحل وقال: يا أهل الشام هذا لعن الله يزيد لأقتلنه أو ليقتلني؛ فحمل هو وأصحابه فضرب كل واحد منهما صاحبه فقتله فأومأ القحل إلى أصحابه يريهم مكان يزيد ومات من وقعته {cite:wafayat-ayan}."
  en: "Al-Qahl b. Iyash al-Kalabi — killer of Yazid b. al-Muhallab; charged crying 'cursed be Yazid, I shall kill him or he kills me,' and the two slew each other; al-Qahl lived long enough to point out Yazid's body {cite:wafayat-ayan}."
