summary:
  ar: "أخت ضرار بن الأزور، وبطلة أشهر أخبار «فتوح الشام» المنسوب إلى الواقدي: تخرج فارسةً ملثمةً بثياب سود حين أُسر أخوها قرب دمشق فتشق صفوف الروم حتى يسألها خالد بن الوليد عن اسمها، ثم تقود النساء الأسيرات بأعمدة الخيام على آسريهن، وتقاتل يوم اليرموك فتُجرح في رأسها {cite:futuh-al-sham-ilmiyya-1997-v1 p.40} {cite:futuh-al-sham-ilmiyya-1997-v1 p.41} {cite:futuh-al-sham-ilmiyya-1997-v1 p.47} {cite:futuh-al-sham-ilmiyya-1997-v1 p.208}. أخبارها في هذا الكتاب، ونسبة الكتاب إلى الواقدي محل خلاف."
  en: "Sister of Dirar ibn al-Azwar and heroine of the best-known episodes of the Futuh al-Sham ascribed to al-Waqidi: she rides out masked, in black, when her brother is captured near Damascus and cuts through the Byzantine ranks until Khalid ibn al-Walid asks her name; she leads the captive women against their captors with tent poles; and she fights at Yarmuk, where she is wounded in the head. Her story is told in this book, whose ascription to al-Waqidi is disputed."
