summary:
  ar: "روح الله الخميني (1900/1902–1989)، رجل دين شيعي وسياسي إيراني، قائد الثورة الإيرانية التي أطاحت بالشاه محمد رضا بهلوي ومؤسس الجمهورية الإسلامية ومرشدها الأعلى من 1979 حتى وفاته. فقيه ومرجع تقليد في التشيع الاثني عشري، درّس في قم ونُفي إلى تركيا ثم العراق، وعاد إلى إيران في شباط 1979، وترك كتبًا في الفقه والحكومة الإسلامية منها «الحكومة الإسلامية» و«تحرير الوسيلة»."
  en: "Ruhollah Khomeini (1900/1902–1989) was an Iranian Shia cleric and politician, the leader of the Iranian Revolution that overthrew Shah Mohammad Reza Pahlavi, founder of the Islamic Republic of Iran and its supreme leader from 1979 until his death. A jurist and marja' in Twelver Shi'ism, he taught at Qom, was exiled to Turkey and then Iraq, returned to Iran in February 1979, and left works on jurisprudence and Islamic government, among them Islamic Government and Tahrir al-Wasila."
  ur: "روح اللہ خمینی (1900/1902ء–1989ء) ایرانی شیعہ عالمِ دین اور سیاست دان تھے، انقلابِ ایران کے قائد جس نے شاہ محمد رضا پہلوی کا تختہ الٹا، اسلامی جمہوریہ ایران کے بانی اور 1979ء سے وفات تک اس کے رہبرِ اعلیٰ رہے۔ وہ شیعہ اثنا عشریہ کے فقیہ اور مرجع تھے، قم میں تدریس کی، ترکی اور پھر عراق جلاوطن رہے، فروری 1979ء میں ایران واپس آئے اور فقہ و اسلامی حکومت پر کتابیں چھوڑیں، جن میں «حکومتِ اسلامیہ» اور «تحریر الوسیلہ» شامل ہیں۔"
