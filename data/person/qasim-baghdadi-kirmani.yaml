summary:
  ar: "الملا قاسم البغدادي الكرماني ثم القسطنطيني الحنفي، ابن أخت الملا شيخي الشاعر؛ اشتغل في العلم واتصل بخدمة الملا عبد الكريم، ثم صار مدرساً ببلدة أماسية ثم بمدرسة أبي أيوب الأنصاري ثم بإحدى المدارس الثمان بالقسطنطينية، وكان ذكياً سليم القلب وافر العقل يدرّس كل يوم سطرين أو ثلاثة ويتكلم عليها بجميع ما يمكن إيراده من نحو وصرف ومعانٍ وبيان ومنطق وأصول مع رفع ما أشكل على الطلبة على أحسن الوجوه وألطفها، وله حواشٍ على شرح المواقف وأجوبة عن السبع الشداد التي علّقها الملا لطفي، واستعارة لطيفة تركية وفارسية، توفي سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 422-423}."
  en: "Nephew of the poet Molla Shaykhi, in the service of Molla 'Abd al-Karim; teacher at Amasya, then the Abu Ayyub madrasa, then one of the Eight Madrasas — a quick, sweet-natured scholar who lectured daily on two or three lines unpacking grammar, semantics, logic and usul and resolving every difficulty kindly; glosses on Sharh al-Mawaqif and answers to Molla Lutfi's Seven Difficulties, with fine Turkish and Persian metaphors; d. 901 {cite:shadharat-dhahab p. 422-423}."
  es: "Sobrino del poeta Molla Shaykhi, al servicio de Molla 'Abd al-Karim; maestro en Amasya, luego en la madrasa Abu Ayyub, y después en una de las Ocho Madrasas; un erudito rápido y de carácter afable que impartía clases diariamente en dos o tres líneas, desentrañando la gramática, la semántica, la lógica y el usul, y resolviendo amablemente cualquier dificultad; glosas sobre Sharh al-Mawaqif y respuestas a las Siete Dificultades de Molla Lutfi, con finas metáforas turcas y persas; murió en 901 {cite:shadharat-dhahab p. 422-423}."
  fr: "Neveu du poète Molla Shaykhi, au service de Molla 'Abd al-Karim; enseignant à Amasya, puis à la madrasa Abu Ayyub, puis à l'une des Huit Madrasas — un érudit vif et doux qui donnait quotidiennement des conférences de deux ou trois lignes expliquant la grammaire, la sémantique, la logique et l'usul et résolvant chaque difficulté avec bienveillance; gloses sur Sharh al-Mawaqif et réponses aux Sept Difficultés de Molla Lutfi, avec de belles métaphores turques et persanes; d. 901 {cite:shadharat-dhahab p. 422-423}."
  ur: "شاعر مولا شیخی کا بھتیجا، مولا عبد الکریم کی خدمت میں؛ اماسیہ میں استاد، پھر ابو ایوب مدرسہ، پھر آٹھ مدارس میں سے ایک - ایک تیز، میٹھے مزاج کے عالم جو روزانہ دو یا تین سطروں میں گرامر، سیمنٹکس، منطق اور اصول کو کھولتے ہوئے لیکچر دیتے تھے اور ہر مشکل کو احسن طریقے سے حل کرتے تھے۔ شارح الموقف پر اشعار اور ملا لطفی کی سات مشکلات کے جوابات، عمدہ ترکی اور فارسی استعاروں کے ساتھ؛ d 901 {حوالہ: شدھارت ذہاب ص۔ 422-423}۔"
