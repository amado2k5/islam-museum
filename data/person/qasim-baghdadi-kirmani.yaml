summary:
  ar: "الملا قاسم البغدادي الكرماني ثم القسطنطيني الحنفي، ابن أخت الملا شيخي الشاعر؛ اشتغل في العلم واتصل بخدمة الملا عبد الكريم، ثم صار مدرساً ببلدة أماسية ثم بمدرسة أبي أيوب الأنصاري ثم بإحدى المدارس الثمان بالقسطنطينية، وكان ذكياً سليم القلب وافر العقل يدرّس كل يوم سطرين أو ثلاثة ويتكلم عليها بجميع ما يمكن إيراده من نحو وصرف ومعانٍ وبيان ومنطق وأصول مع رفع ما أشكل على الطلبة على أحسن الوجوه وألطفها، وله حواشٍ على شرح المواقف وأجوبة عن السبع الشداد التي علّقها الملا لطفي، واستعارة لطيفة تركية وفارسية، توفي سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 422-423}."
  en: "Nephew of the poet Molla Shaykhi, in the service of Molla 'Abd al-Karim; teacher at Amasya, then the Abu Ayyub madrasa, then one of the Eight Madrasas — a quick, sweet-natured scholar who lectured daily on two or three lines unpacking grammar, semantics, logic and usul and resolving every difficulty kindly; glosses on Sharh al-Mawaqif and answers to Molla Lutfi's Seven Difficulties, with fine Turkish and Persian metaphors; d. 901 {cite:shadharat-dhahab p. 422-423}."
died: { edtf: "1495/1496", hijri: "0901", calendar: julian, precision: year, status: tradition, derived: true, note: "901؛ التحويل مشتق {cite:shadharat-dhahab p. 423}", sources: [source/shadharat-dhahab] }
