  ar: "أبو سعيد سنان بن ثابت بن قرة الحراني، كان طبيبا مقدما وأراده القاهر على الإسلام فهرب ثم أسلم وخاف من القاهر فمضى إلى خراسان وعاد وتوفي ببغداد مسلما سنة إحدى وثلاثين وثلاثمائة في غرة ذي الحجة {cite:fihrist-ibn-al-nadim p. 421}. وعند ابن الجوزي كان من أطباء المقتدر بالله {cite:muntazam-ibn-al-jawzi p. 360}."
