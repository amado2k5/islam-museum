id: person/sinan-ibn-thabit
class: person
label: { ar: "سنان بن ثابت بن قرة", en: "Sinan Ibn Thabit", es: "Sinan Ibn Thabit", fr: "Sinan Ibn Thabit", ur: "سنان ابن ثابت" }
summary:
  ar: "أبو سعيد سنان بن ثابت بن قرة الحراني، كان طبيبا مقدما وأراده القاهر على الإسلام فهرب ثم أسلم وخاف من القاهر فمضى إلى خراسان وعاد وتوفي ببغداد مسلما سنة إحدى وثلاثين وثلاثمائة في غرة ذي الحجة {cite:fihrist-ibn-al-nadim p. 421}. وعند ابن الجوزي كان من أطباء المقتدر بالله {cite:muntazam-ibn-al-jawzi p. 360}."
  en: "Harranian physician (d. 331) — al-Qahir pressed him to convert; he fled, converted, and died Muslim in Baghdad {cite:fihrist-ibn-al-nadim}"
  es: "Médico de Harran (m. 331) — al-Qahir lo presionó para que se convirtiera; huyó, se convirtió y murió musulmán en Bagdad {cite:fihrist-ibn-al-nadim}"
  fr: "Médecin harranien (mort en 331) — al-Qahir le pressa de se convertir; il s'enfuit, se convertit et mourut musulman à Bagdad {cite:fihrist-ibn-al-nadim}"
  ur: "ہررانی طبیب ⁦(متوفی 331)⁩ — القاہر نے اسے تبدیل کرنے کے لیے دباؤ ڈالا۔ وہ فرار ہو گیا، تبدیل ہوا اور بغداد میں مسلمان ہو کر مر گیا۔"
  tr: "Ebu Said Sinan ibn Tebit bin Kurra el-Harrani önceden bir hekimdi ve İslam'ı fetih eden tarafından arandı, bu yüzden kaçtı, ardından İslam'a geçti ve fatihten korktu, bu yüzden Horasan'a gitti, geri döndü ve 331 Hicc yılının ilk gününde Müslüman olarak Bağdat'ta öldü {atıf:Fihrist-ibn-al-Nadim s. 421}. İbn el-Cevzi'ye göre, el-Muqtadir Billah'ın hekimleri arasındaydı {atıf:Muntazam-ibn-al-jawzi s. 360}."
  id: "Abu Sa'id Sinan ibn Thabit ibn Qurra al-Harrani adalah seorang tabib sebelumnya dan dicari oleh penakluk Islam, sehingga ia melarikan diri, kemudian memeluk Islam dan takut pada sang penakluk, sehingga ia pergi ke Khorasan, kembali, dan meninggal di Baghdad sebagai Muslim pada tahun 331 H pada tanggal pertama Dhu al-Hijjah {cite:fihrist-ibn-al-nadim hlm. 421}. Menurut Ibn al-Jawzi, ia termasuk di antara tabib al-Muqtadir Billah {cite:Muntazam-ibn-al-jawzi hlm. 360}."
