  ar: "نايل بن ذي الحرة الحميري وفي الأصل باب؛ كان على مقدمة ربعي بن الكاس العنبري إلى سجستان وكان يسمى عبد الرحمن وهذا من سبي سجستان وكان فيروز حصين ينسب إلى ابن أبي الحر."
  en: "Na'il ibn Dhi al-Hurra al-Himyari — the manuscript reads 'Bab'; on Rubay'i ibn al-Kas's vanguard to Sijistan, also named Abd al-Rahman — of Sijistan's captives; Fayruz Husayn traced his line to Ibn Abi al-Hurr."
  es: "Na'il ibn Dhi al-Hurra al-Himyari — el manuscrito dice 'Bab'; sobre la vanguardia de Rubay'i ibn al-Kas a Sijistan, también llamado Abd al-Rahman — de los cautivos de Sijistan; Fayruz Husayn rastreó su linaje hasta Ibn Abi al-Hurr."
