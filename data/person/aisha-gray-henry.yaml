summary:
  ar: ناشرة أمريكية مسلمة؛ أسست دار «فونز فيتاي» للنشر المتخصصة في ترجمات كلاسيكيات الروح الإسلامية — خصوصًا أعمال الغزالي وابن عربي — ولها كتب في تربية الأطفال المسلمين وسلسلة تعليمية للمدارس.
  en: American Muslim publisher; founder of Fons Vitae, a non-profit press specialising in translations of Islamic spiritual classics — especially Ghazali and Ibn Arabi — and author of books and curricula
    on Muslim children's education.
  fr: "Éditrice musulmane américaine ; fondatrice de Fons Vitae, maison d’édition à but non lucratif spécialisée dans la traduction de classiques de la spiritualité islamique — en particulier Ghazali et Ibn Arabi — et autrice de livres et de programmes pour l’éducation des enfants musulmans."
  ur: امریکی مسلم ناشرہ؛ Fons Vitae کی بانی، غیر منافع بخش مطبع جو اسلامی روحانی کلاسیکیات — خاص طور پر غزالی اور ابن عربی — کے تراجم شائع کرتی ہے، اور مسلم بچوں کی تربیت پر کتابیں اور نصاب کی مصنفہ۔
  es: "Editora musulmana estadounidense; fundadora de Fons Vitae, una editorial sin ánimo de lucro especializada en traducciones de clásicos espirituales islámicos —especialmente Ghazali e Ibn Arabi— y autora de libros y planes de estudio sobre la educación de los niños musulmanes."
  tr: "Amerikalı bir Müslüman yayıncı olan Fonse Vitae, özellikle Gazali ve İbn Arabi'nin eserleri olmak üzere İslam ruhunun klasiklerinin çevirilerinde uzmanlaşmış \"Fonse Vitae\" yayınevini kurmuştur. Ayrıca Müslüman çocuk yetiştirme üzerine kitaplar ve okullar için bir eğitim serisi de yayınlamaktadır."
  id: "Seorang penerbit Muslim Amerika; ia mendirikan rumah penerbitan \"Fonse Vitae\", yang mengkhususkan diri dalam terjemahan karya klasik tentang semangat Islam — terutama karya Al-Ghazali dan Ibn Arabi — dan memiliki buku-buku tentang membesarkan anak-anak Muslim serta seri pendidikan untuk sekolah."
