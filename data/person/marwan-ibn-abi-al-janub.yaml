label: { ar: "مروان بن أبي الجنوب" }
summary:
  ar: "الشاعر، أجازه المتوكل على قصيدة بمئة ألف وعشرين ألفاً وخمسين ثوباً فقال فيه فقد خفت أن أطغى وأن أتجبرا فأمسك ندى كفيك عني ولا تزد فقال لا أمسك حتى يغرقك جودي {cite:tarikh-khulafa-minhaj-1434 p. 541-542}.، وعند المسعودي قال في بيعة المتوكل لأولاده الثلاثة ثلاثة أملاك فأما محمد فنور هدى فأولهم نور وثانيهم هدى وثالثهم رشد وكلهم مهدي، وقال للمتوكل يا عاشر الخلفاء دمت ممتعاً بالملك تعقد بعدهم للعاشر {cite:muruj-al-dhahab p. 519-520}"
  en: "The poet, rewarded by al-Mutawakkil with a hundred and twenty thousand and fifty robes for one ode — 'I feared to grow arrogant; hold back your hands' bounty' — 'I will not hold it till my generosity drowns you' {cite:tarikh-khulafa-minhaj-1434 p. 541-542}."
