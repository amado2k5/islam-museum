id: person/marwan-ibn-abi-al-janub
class: person
label: { ar: "مروان بن أبي الجنوب" }
summary:
  ar: "الشاعر، أجازه المتوكل على قصيدة بمئة ألف وعشرين ألفاً وخمسين ثوباً فقال فيه فقد خفت أن أطغى وأن أتجبرا فأمسك ندى كفيك عني ولا تزد فقال لا أمسك حتى يغرقك جودي {cite:tarikh-khulafa-minhaj-1434 p. 541-542}. وعند المسعودي قال في بيعة المتوكل لأولاده الثلاثة ثلاثة أملاك فأما محمد فنور هدى فأولهم نور وثانيهم هدى وثالثهم رشد وكلهم مهدي، وقال للمتوكل يا عاشر الخلفاء دمت ممتعاً بالملك تعقد بعدهم للعاشر {cite:muruj-al-dhahab p. 519-520}"
  en: "The poet, rewarded by al-Mutawakkil with a hundred and twenty thousand and fifty robes for one ode — 'I feared to grow arrogant; hold back your hands' bounty' — 'I will not hold it till my generosity drowns you' {cite:tarikh-khulafa-minhaj-1434 p. 541-542}."
  es: "El poeta, recompensado por al-Mutawakkil con ciento veinte mil cincuenta túnicas por una oda — 'Temía volverme arrogante; detén tus manos', 'no la detendré hasta que mi generosidad te ahogue' {cite:tarikh-khulafa-minhaj-1434 p. 541-542}."
  fr: "Le poète, récompensé par al-Mutawakkil avec cent vingt mille cinquante robes pour une ode — « J'ai craint de devenir arrogant; retenez votre générosité » — « Je ne la retiendrai pas jusqu'à ce que ma générosité vous submerge » {cite:tarikh-khulafa-minhaj-1434 p. 541-542}."
  ur: "متوکل کی طرف سے ایک شعر کے بدلے ایک لاکھ 20 ہزار اور پچاس لباس سے نوازا گیا شاعر - 'میں غرور بڑھنے سے ڈرتا تھا؛ اپنے ہاتھ روک لو 'فضل' - 'میں اسے اس وقت تک نہیں رکھوں گا جب تک کہ میری سخاوت تمہیں غرق نہ کر دے'۔ 541-542}۔"
  tr: "Şair el-Mutevakkil ona yüz yirmi bin elli giysi değerinde bir şiir için izin verdi. Şöyle dedi: Kibirli ve zalimce olacağımdan korktum, bu yüzden avucunun çiyini benden tut ve artırma. Dedi ki: Cömertliğim seni boğana kadar geri durmayacağım. {alıntı:History-Khulafa-minhaj-1434 s. 541-542}. al-Mas'udi'ye göre, el-Mutevakkil'in üç oğluna bağlılık yemininde üç mal mülkü olduğunu söyledi: Muhammed ise rehber ışığıydı. İlki ışıktı, ikincisi rehberlikti, üçüncüsü rehberlikti, hepsi yönlendirildi. El-Mutevakkil'e dedi ki: Ey onuncu halife, her zaman krallığın tadını çıkar, onlardan sonra onuncu halifeyle evleneceksin {atı:Muruj-al-Dhahab, s. 519-520}"
  id: "Penyair al-Mutawakkil memberinya izin untuk sebuah puisi senilai seratus dua puluh ribu lima puluh pakaian. Dia berkata di dalamnya: Aku takut aku akan sombong dan tiran, jadi tahan embun telapak tanganmu padaku dan jangan tambahkannya. Dia berkata: Aku tidak akan menahan sampai kemurahanku menenggelamkanmu. {cite:History-Khulafa-minhaj-1434 hlm. 541-542}. Menurut al-Mas'udi, dia berkata bahwa dalam janji kesetiaan al-Mutawakkil kepada tiga putranya, tiga harta adalah harta: sedangkan Muhammad adalah cahaya petunjuk. Yang pertama adalah cahaya, yang kedua adalah petunjuk, dan yang ketiga adalah petunjuk, semuanya dipandu. Dia berkata kepada al-Mutawakkil: Wahai khalifah kesepuluh, semoga engkau selalu menikmati kerajaan, dan setelah mereka kamu akan menikah dengan yang kesepuluh {cite:muruj-al-dhahab, hlm. 519-520}"
