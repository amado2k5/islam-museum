summary:
  ar: "صحابي قرشي فهري، فارس شاعر؛ قاتل مع المشركين في أحد والخندق ثم أسلم يوم الفتح، وقال ابن سعد إنه قتل باليمامة شهيداً، وقال الخطيب بل عاش إلى فتح المدائن ونزل الشام."
  en: "A Fihri Qurashi Companion, a horseman and poet; he fought on the side of the polytheists at Uhud and the Trench, then embraced Islam at the conquest. Ibn Sa'd says he was killed at al-Yamama as a martyr; al-Khatib says he lived to the conquest of al-Mada'in and settled in Syria."
  ur: "فہری قریشی صحابی، سوار اور شاعر؛ احد اور خندق میں مشرکین کی طرف لڑا، پھر فتح مکہ کے دن مسلمان ہوا۔"
