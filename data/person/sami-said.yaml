summary:
  ar: "كاتب وروائي سويدي مولود في إريتريا سنة 1979 في كرن؛ فرّت أسرته طفلًا من الحرب عبر السودان وألمانيا إلى غوتنبرغ، ودرس في جامعة لينشوبينغ، ونال إشادة نقدية واسعة عن رواياته المستمدة من تجربة المهاجر: «فالديغت سالان فين» (2012، جائزة كاتابولت)، و«مونوماني» (2013)، و«مانيسكان إر دن فاكراستي ستادين» (2018، القائمة القصيرة لجائزة أوغست وترشيح لجائزة الأدب لمجلس الشمال 2019)، و«ساتانسفيسكار» (2023)."
  en: "Eritrean-born Swedish writer and novelist, born in Keren in 1979. His family fled the war in his childhood via Sudan and Germany to Gothenburg, he studied at Linköping University, and his novels drawing on the immigrant experience have won wide critical acclaim: Väldigt sällan fin (2012, Katapult Prize), Monomani (2013), Människan är den vackraste staden (2018, August Prize shortlist and Sweden's nominee for the 2019 Nordic Council Literature Prize), and Satansviskningar (2023)."
  ur: "اریٹیریا میں پیدا ہونے والے سویڈش مصنف و ناول نگار، 1979 میں کرن میں پیدا ہوئے؛ بچپن میں ان کا خاندان جنگ سے بھاگ کر سوڈان و جرمنی کے راستے گوتنبرگ پہنچا، انھوں نے لنشوپنگ یونیورسٹی میں تعلیم حاصل کی، اور مہاجر تجربے پر مبنی ان کے ناولوں کو وسیع تنقیدی پذیرائی ملی: «ویلدگت سیلان فن» (2012، کیٹاپلٹ انعام)، «مونومانی» (2013)، «مانیسکان ار دن واکراستے اسٹاڈن» (2018، آگسٹ انعام کی مختصر فہرست اور 2019 کے نورڈک کونسل ادب انعام کے لیے سویڈن کی نامزدگی)، اور «ساتانس وسکار» (2023)۔"
