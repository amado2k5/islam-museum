summary:
  ar: "كاتب وروائي سويدي مولود في إريتريا سنة 1979 في كرن؛ فرّت أسرته طفلًا من الحرب عبر السودان وألمانيا إلى غوتنبرغ، ودرس في جامعة لينشوبينغ، ونال إشادة نقدية واسعة عن رواياته المستمدة من تجربة المهاجر: «فالديغت سالان فين» ⁦(2012، جائزة كاتابولت)⁩، و«مونوماني» (2013)، و«مانيسكان إر دن فاكراستي ستادين» ⁦(2018، القائمة القصيرة لجائزة أوغست وترشيح لجائزة الأدب لمجلس الشمال 2019)⁩، و«ساتانسفيسكار» (2023)."
  en: "Eritrean-born Swedish writer and novelist, born in Keren in 1979. His family fled the war in his childhood via Sudan and Germany to Gothenburg, he studied at Linköping University, and his novels drawing on the immigrant experience have won wide critical acclaim: Väldigt sällan fin (2012, Katapult Prize), Monomani (2013), Människan är den vackraste staden (2018, August Prize shortlist and Sweden's nominee for the 2019 Nordic Council Literature Prize), and Satansviskningar (2023)."
  ur: "اریٹیریا میں پیدا ہونے والے سویڈش مصنف و ناول نگار، 1979 میں کرن میں پیدا ہوئے؛ بچپن میں ان کا خاندان جنگ سے بھاگ کر سوڈان و جرمنی کے راستے گوتنبرگ پہنچا، انھوں نے لنشوپنگ یونیورسٹی میں تعلیم حاصل کی، اور مہاجر تجربے پر مبنی ان کے ناولوں کو وسیع تنقیدی پذیرائی ملی: «ویلدگت سیلان فن» ⁦(2012، کیٹاپلٹ انعام)⁩، «مونومانی» (2013)، «مانیسکان ار دن واکراستے اسٹاڈن» ⁦(2018، آگسٹ انعام کی مختصر فہرست اور 2019 کے نورڈک کونسل ادب انعام کے لیے سویڈن کی نامزدگی)⁩، اور «ساتانس وسکار» (2023)۔"
  es: "Escritor y novelista sueco de origen eritreo, nacido en Keren en 1979. Su familia huyó de la guerra durante su infancia, pasando por Sudán y Alemania, hasta Gotemburgo. Estudió en la Universidad de Linköping, y sus novelas, que reflejan la experiencia de la inmigración, han recibido un amplio reconocimiento de la crítica: Väldigt sällan fin (2012, Premio Katapult), Monomani (2013), Människan är den vackraste staden (2018, finalista del Premio August y nominado por Suecia al Premio de Literatura del Consejo Nórdico de 2019) y Satansviskningar (2023)."
  fr: "Écrivain et romancier suédois d'origine érythréenne, né à Keren en 1979. Sa famille a fui la guerre durant son enfance, passant par le Soudan et l'Allemagne pour s'installer à Göteborg. Il a étudié à l'université de Linköping et ses romans, inspirés par l'expérience de l'immigration, ont été largement salués par la critique: Väldigt sällan fin (2012, prix Katapult), Monomani (2013), Människan är den vackraste staden (2018, finaliste du prix August et candidat suédois au prix de littérature du Conseil nordique 2019), et Satansviskningar (2023)."
  tr: "1979'da Eritre'de Kern'de doğan İsveçli bir yazar ve romancı; ailesi çocukken Sudan ve Almanya üzerinden savaştan kaçarak Göteborg'a gitti. Linköping Üniversitesi'nde eğitim gördü ve göçmen deneyiminden ilham alan romanlarıyla geniş çapta eleştirel beğeni topladı: \"Waldigt Salan Veen\" (2012, Catapult Ödülü), \"Monomani\" (2013), \"Maniskan er den Vakrasti Stadin\" (2018, Ağustos Ödülü kısa listesine ve 2019 Kuzey Konseyi Edebiyat Ödülü'ne adaylık) ve \"Satansveskar\" (2023)."
  id: "Seorang penulis dan novelis Swedia yang lahir di Eritrea pada tahun 1979 di Kern; keluarganya melarikan diri dari perang saat masih anak-anak melintasi Sudan dan Jerman ke Gothenburg. Ia belajar di Universitas Linköping, menerima pujian kritis luas untuk novel-novelnya yang terinspirasi dari pengalaman imigran: \"Waldigt Salan Veen\" (2012, Hadiah Katapult), \"Monomani\" (2013), \"Maniskan er den Vakrasti Stadin\" (2018, masuk daftar pendek Hadiah Agustus dan nominasi Penghargaan Sastra Dewan Utara 2019), serta \"Satansveskar\" (2023)."
