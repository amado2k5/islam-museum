summary:
  ar: "بطاقة أولية لعلي بن عمر الإدريسي، أمير الأدارسة بالمغرب في أواسط القرن التاسع، توفي سنة ٨٨٣م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ali ibn Umar, the Idrisid emir of Morocco in the mid-ninth century, d. 883; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Ali ibn Umar, el emir idrisí de Marruecos a mediados del siglo IX, fallecido en 883; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature d'Ali ibn Umar, émir idrisside du Maroc au milieu du IXe siècle, mort en 883; l'entrée du manuel dynastique n'est pas encore cochée sur la page."
  ur: "نویں صدی کے وسط میں مراکش کے ادریسی امیر علی ابن عمر کے لیے ڈرافٹ کارڈ، ڈی۔ 883; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Dokuzuncu yüzyıl ortalarında Fas'ta İdrisi prensi olan Ali ibn Ömer el-İdrisi'nin ön kartı, 883 yılında ölmüştür; İslam devletleri sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Ali ibn Umar al-Idrisi, pangeran Idrisiyah di Maroko pada pertengahan abad kesembilan, yang meninggal pada tahun 883 M; ia disebutkan dalam kamus negara-negara Islam dan biografinya belum ditinjau di halaman tersebut."
