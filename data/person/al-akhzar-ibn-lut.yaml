summary:
  en: "A poet of Banu al-Dil who boasted in verse of driving Banu Ka'b of Khuza'a away from al-Watir; Budayl ibn Umm Asram answered him in a poem Ibn Hisham records under a non-Ibn-Ishaq strand."
  fr: "Poète des Banu al-Dil qui se vanta en vers d’avoir chassé les Banu Ka’b de Khuza’a d’al-Watir ; Budayl ibn Umm Asram lui répondit dans un poème qu’Ibn Hisham rapporte par une voie autre que celle d’Ibn Ishaq."
  ar: "شاعر من بني الديل تباهى بأنهم دحروا بني كعب عن الوتير؛ أجابه بديل بن أم أصرم بقصيدة أوردها ابن هشام عن غير ابن إسحاق."
  es: "Un poeta de Banu al-Dil que se jactaba en verso de haber expulsado a Banu Ka'b de Khuza'a de al-Watir; Budayl ibn Umm Asram le respondió en un poema que Ibn Hisham registra bajo una corriente que no pertenece a Ibn Ishaq."
