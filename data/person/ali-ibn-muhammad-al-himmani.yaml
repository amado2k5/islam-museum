class: person
label: { ar: "علي بن محمد الحماني العلوي", en: "'Ali al-Himmani", es: "'Ali al-Himmani", fr: "'Ali al-Himmani", ur: "علی الہیمانی۔" }
summary:
  ar: "علي بن محمد بن جعفر العلوي الحماني الشاعر أخو إسماعيل العلوي لأمه، نزل بالكوفة في حمان فأضيف إليهم، رثى يحيى بن عمر وقال يا بقايا السلف الصالح والتجر الربيح، وقعد عن لقائه حين دخل الحسن بن إسماعيل الكوفة {cite:muruj-al-dhahab p. 532-533}."
  en: "The 'Alawi poet of Himman — elegist of Yahya ibn 'Umar who sat out the fighting {cite:muruj-al-dhahab p. 532-533}."
  es: "El poeta 'Alawi de Himman — elegíaco de Yahya ibn 'Umar que se mantuvo al margen de la lucha {cite:muruj-al-dhahab p. 532-533}."
  fr: "Le poète 'Alawi de Himman — élégiste de Yahya ibn 'Umar qui s'est tenu à l'écart des combats {cite:muruj-al-dhahab p. 532-533}."
  ur: "ہمن کا علوی شاعر - یحییٰ بن عمر کا شاعر جو لڑائی میں بیٹھا تھا۔ 532-533}۔"
  tr: "Şair ve İsmail el-Alavi'nin annesinin kardeşi olan Ali ibn Muhammed bin Cefer el-Alavi el-Hamani, Hamman'daki Kufa'ya yerleşti ve onlara katıldı. Yahya ibn Umar'a övgü diledi ve şöyle dedi: 'Ey doğru ataların kalıntıları ve kârlı ticaret.' El-Hasan bin İsmail Kufa'ya girdiğinde onunla görüşmeyi kesti {atıf:Muruj-al-Dhahab, s. 532-533}."
  id: "Ali ibn Muhammad ibn Ja'far al-Alawi al-Hamani, penyair dan saudara Ismail al-Alawi dari ibunya, menetap di Kufa di Hamman dan ditambahkan ke dalam mereka. Ia memuji Yahya ibn Umar dan berkata, 'Wahai sisa-sisa leluhur yang benar dan perdagangan yang menguntungkan.' Ia berhenti bertemu dengannya ketika al-Hasan ibn Ismail memasuki Kufa {cite:muruj-al-dhahab, hlm. 532-533}."
