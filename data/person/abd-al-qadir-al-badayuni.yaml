summary:
  ar: "بطاقة أولية لعبد القادر بن ملوك شاه البدائوني، مؤرخ بلاط أكبر صاحب «منتخب التواريخ» ومترجم الريغ ويدا إلى الفارسية، توفي سنة ١٦١٥م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abd al-Qadir ibn Muluk Shah al-Bada'uni, Akbar's court historian author of Muntakhab al-Tawarikh and translator of the Rig Veda into Persian, d. 1615; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Abd al-Qadir ibn Muluk Shah al-Bada'uni, historiador de la corte de Akbar, autor de Muntakhab al-Tawarikh y traductor del Rig Veda al persa, fallecido en 1615; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature d'Abd al-Qadir ibn Muluk Shah al-Bada'uni, historien de la cour d'Akbar, auteur du Muntakhab al-Tawarikh et traducteur du Rig Veda en persan, mort en 1615; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "عبد القادر ابن ملوک شاہ البداعونی کے لیے ڈرافٹ کارڈ، اکبر کے درباری مؤرخ منتخب التواریخ کے مصنف اور رگ وید کے فارسی میں مترجم، ڈی۔ 1615; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
