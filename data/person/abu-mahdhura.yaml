summary:
  ar: "صحابي مؤذن من أهل مكة، روى عن النبي، وروى عنه ابنه عبد الملك وابن ابنه عبد العزيز وعبد الله بن عبيد الله بن أبي مليكة وغيرهم، وولاه النبي الأذان بمكة يوم الفتح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
  en: "A Companion from Mecca who was a muezzin. He narrated from the Prophet, and his son Abd al-Malik, his grandson Abd al-Aziz, Abd Allah ibn Ubayd Allah ibn Abi Mulayka and others narrated from him. The Prophet gave him the call to prayer in Mecca on the day of the conquest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
