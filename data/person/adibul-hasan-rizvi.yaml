  ar: جراح مسالك بولية باكستاني وُلد سنة 1938. مؤسّس ومدير معهد السند لأمراض المسالك البولية وزراعتها ⁦(SIUT)⁩ في كراتشي، أكبر مؤسسة صحية مجانية في باكستان تقدّم العلاج بالمجان للمحتاجين.
