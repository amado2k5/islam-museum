summary:
  ar: "بطاقة أولية للحاج عمر بن سعيد الفوتي تال، المجاهد التجانية والعالم التوكولوري الذي أسس دولة في غرب إفريقيا؛ توفي سنة ١٨٦٤م ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for al-Hajj Umar ibn Sa'id al-Futi Tal, the Tijani mujahid and Toucouleur scholar who founded a state in West Africa; he died in 1864 and his entry is not yet checked on the page."
  es: "Ficha de borrador para al-Hajj Umar ibn Sa'id al-Futi Tal, el muyahidín tijaní y erudito toucouleur que fundó un estado en África Occidental; murió en 1864 y su entrada aún no ha sido verificada en la página."
  fr: "Fiche de convocation d'al-Hajj Umar ibn Sa'id al-Futi Tal, le moudjahid tijani et érudit toucouleur qui a fondé un État en Afrique de l'Ouest; il est décédé en 1864 et son entrée n'est pas encore vérifiée sur la page."
  ur: "الحاج عمر بن سعید الفوطی تال کے لیے ڈرافٹ کارڈ، تیجانی مجاہد اور توکلور اسکالر جنہوں نے مغربی افریقہ میں ایک ریاست کی بنیاد رکھی۔ اس کا انتقال 1864 میں ہوا اور اس کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Batı Afrika'da bir devlet kuran Tijaniyya mücahidi ve Tokolor alimi Al-Hajj Omar bin Said Al-Futi Tall'ın ön profili; 1864 yılında vefat etmiştir ve biyografisi bu sayfada henüz incelenmemiştir."
  id: "Profil pendahuluan Al-Hajj Omar bin Said Al-Futi Tall, seorang mujahid Tijaniyya dan cendekiawan Tokolor yang mendirikan sebuah negara di Afrika Barat; beliau wafat pada tahun 1864 M dan biografinya belum diulas di halaman ini."
