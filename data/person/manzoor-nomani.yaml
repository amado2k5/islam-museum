summary:
  ar: "عالم هندي (1905–1997) من سنبهل، محدّث ديوبندي صاحب «معارف الحديث». تخرج في دار العلوم ديوبند سنة 1927 ودرّس الحديث في ندوة العلماء أربع سنوات، وكان عضواً مؤسساً في الجماعة الإسلامية ونائب أميرها ثم استقال منها سنة 1942 وانتسب إلى جماعة التبليغ، وكان عضواً في مجلس شورى دار العلوم ديوبند ورابطة العالم الإسلامي."
  en: "Indian scholar (1905–1997) of Sambhal, the Deobandi hadith scholar of Maariful Hadith. He graduated from Darul Uloom Deoband in 1927, taught hadith at Nadwatul Ulama for four years, was a founding member and deputy amir of Jamaat-e-Islami before resigning in 1942 and affiliating with the Tablighi Jamaat, and sat on the Majlis-e-Shura of Darul Uloom Deoband and in the Muslim World League."
  ur: "بھارتی عالم (1905ء–1997ء) جن کا تعلق سنبھل سے تھا، دیوبندی محدث اور «معارف الحدیث» کے مصنف۔ 1927ء میں دار العلوم دیوبند سے فارغ ہوئے، ندوۃ العلماء میں چار سال حدیث کی تدریس کی، جماعت اسلامی کے بانی رکن اور نائب امیر رہے، پھر 1942ء میں الگ ہو کر تبلیغی جماعت سے وابستہ ہو گئے، اور دار العلوم دیوبند کی مجلسِ شوریٰ اور رابطۂ عالم اسلامی کے رکن رہے۔"
