summary:
  ar: "روائي وباحث إنجليزي (1875-1936) اعتنق الإسلام سنة 1917، أشهر أعماله ترجمته لمعاني القرآن الكريم «معنى القرآن المجيد» (1930)، من أوسع الترجمات الإنجليزية انتشاراً؛ خطب الجمعة في ووكينغ ولندن وعمل في الهند محرراً ومدير مدرسة في حيدر آباد."
  en: "English novelist and scholar (1875-1936) who declared his Islam in 1917; his 'The Meaning of the Glorious Koran' (1930) is among the most widely used English translations of the Qur'an. He preached Friday sermons at Woking and in London and worked in India as a newspaper editor and school principal in Hyderabad."
  ur: "انگریز ناول نگار اور عالم (1875ء–1936ء) جنہوں نے 1917ء میں اسلام کا اعلان کیا؛ ان کا «قرآن مجید کے معانی» (1930ء) قرآن کے سب سے زیادہ مستعمل انگریزی تراجم میں سے ہے۔ وہ ووکنگ اور لندن میں خطبۂ جمعہ دیتے رہے اور ہندوستان میں اخبار کے مدیر اور حیدرآباد میں اسکول کے پرنسپل رہے۔"
