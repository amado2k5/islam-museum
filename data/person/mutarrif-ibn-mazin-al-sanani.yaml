died: { edtf: "0809", hijri: "0191", calendar: julian, precision: year, status: tradition, derived: true, note: "قال الباقي بن قانع: توفي سنة إحدى وتسعين ومائة، ويوافق القول بأنه توفي في أواخر خلافة هارون؛ ووقع عند غيره تاريخ يضعه بعد موت ابن المبارك بثلاث وستين سنة وقال ابن خلكان: لا أدري كيف وقع هذا الغلط {cite:wafayat-ayan}." }
summary:
  ar: "أبو أيوب مطرف بن مازن الكناني، وقيل القيسي بالولاء، الصنعاني؛ قاضي صنعاء، روى عن معمر وابن جريج، وروى عنه الشافعي وأهل العراق؛ واختلف فيه: نقل يحيى بن معين عنه قوله كذاب، وقال النسائي ليس بثقة، وقال أبو حاتم محمد بن حبان البستي قاضي اليمن يروي عن معمر وابن جريج وروى عنه الشافعي وأهل العراق وكان يحدث بما لم يسمع، وقال حاجب بن سليمان كان قاضي صنعاء وكان رجلاً صالحاً {cite:wafayat-ayan}."
  en: "Mutarrif b. Mazin al-San'ani (d. 191 per al-Baqi b. Qani') — qadi of San'a', transmitter from Ma'mar and Ibn Jurayj to al-Shafi'i; the critics split over his reliability (Ibn Ma'in: 'kadhdhab'; Ibn Hibban and Hajib b. Sulayman defended him) {cite:wafayat-ayan}."
