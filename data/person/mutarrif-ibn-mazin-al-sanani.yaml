label: { ar: "مطرف بن مازن الصنعاني", en: "Mutarrif ibn Mazin", es: "Mutarrif ibn Mazin", fr: "Mutarrif ibn Mazin", ur: "مطرف ابن مازن" }
died: { edtf: "0809", hijri: "0191", calendar: julian, precision: year, status: tradition, derived: true, note: "قال الباقي بن قانع: توفي سنة إحدى وتسعين ومائة، ويوافق القول بأنه توفي في أواخر خلافة هارون؛ ووقع عند غيره تاريخ يضعه بعد موت ابن المبارك بثلاث وستين سنة وقال ابن خلكان: لا أدري كيف وقع هذا الغلط {cite:wafayat-ayan}." }
summary:
  ar: "أبو أيوب مطرف بن مازن الكناني، وقيل القيسي بالولاء، الصنعاني؛ قاضي صنعاء، روى عن معمر وابن جريج، وروى عنه الشافعي وأهل العراق؛ واختلف فيه: نقل يحيى بن معين عنه قوله كذاب، وقال النسائي ليس بثقة، وقال أبو حاتم محمد بن حبان البستي قاضي اليمن يروي عن معمر وابن جريج وروى عنه الشافعي وأهل العراق وكان يحدث بما لم يسمع، وقال حاجب بن سليمان كان قاضي صنعاء وكان رجلاً صالحاً {cite:wafayat-ayan}."
  en: "Mutarrif b. Mazin al-San'ani (d. 191 per al-Baqi b. Qani') — qadi of San'a', transmitter from Ma'mar and Ibn Jurayj to al-Shafi'i; the critics split over his reliability (Ibn Ma'in: 'kadhdhab'; Ibn Hibban and Hajib b. Sulayman defended him) {cite:wafayat-ayan}."
  es: "Mutarrif b. Mazin al-San'ani (m. 191 por al-Baqi b. Qani') - cadí de San'a', transmisor de Ma'mar e Ibn Jurayj a al-Shafi'i; los críticos se dividieron sobre su confiabilidad (Ibn Ma'in: 'kadhdhab'; Ibn Hibban y Hajib b. Sulayman lo defendieron) {cita:wafayat-ayan}."
  fr: "Mutarrif b. Mazin al-San'ani (mort en 191 selon al-Baqi b. Qani') — cadi de San'a', émetteur de Ma'mar et Ibn Jurayj à al-Shafi'i; les critiques étaient divisées sur sa fiabilité (Ibn Ma'in: 'kadhdhab'; Ibn Hibban et Hajib b. Sulayman l'ont défendu) {cite: wafayat-ayan}."
  ur: "مطرف ب۔ مازن الصانعانی ⁦(متوفی 191 فی البقیع ابن قانی)⁩ - صنعاء کی قضا، معمر اور ابن جریج سے الشافعی تک پہنچانے والا؛ ناقدین اس کی معتبریت پر تقسیم ہو گئے ⁦(ابن معین: 'کذھب'؛ ابن حبان اور حاجب بن سلیمان نے اس کا دفاع کیا)⁩"
  tr: "Ebu Eyyüb Mutrif bin Mazin el-Kinani, ve rivayetle el-Kaisi el-San'ani'nin Sana'a'nın hakimiydi. Mu'ammar ve İbn Jureyc'den, Şafii ve Irak halkı ondan rivayet etti; onun hakkında anlaşmazlık vardır: Yahya ibn Ma'in ondan yalancı olarak rivayet etmiş, el-Nasa'i ise güvenilir olmadığını söylemiştir. Ebu Hatim Muhammed bin Hibban el-Busti Yemen'in hakimiydi, Muammer ve İbn Cüreyc'den rivayet eder, el-Şafii ve Irak halkı ondan ve ondan daha önce duymadığı şeyleri anlatmıştır. Hacı bin Süleyman, kendisinin Sana'a'nın hakimi ve doğru bir adam olduğunu söylemiştir {alıntı:vafayat-ayan}."
  id: "Abu Ayyub Mutrif ibn Mazin al-Kinani, dan dikatakan al-Qaisi dengan kesetiaan, al-San'ani, adalah hakim Sana'a. Ia menceritakan dari Mu'ammar dan Ibn Jurayj, dan al-Shafi'i serta rakyat Irak menceritakan darinya; ada perbedaan pendapat tentang dirinya: Yahya ibn Ma'in menceritakan darinya sebagai pembohong, dan al-Nasa'i mengatakan ia tidak dapat dipercaya. Abu Hatim Muhammad ibn Hibban al-Busti adalah hakim Yaman, menceritakan dari Muammar dan Ibn Jurayj, dan al-Shafi'i serta rakyat Irak menceritakan dari beliau dan menceritakan dari beliau apa yang belum pernah ia dengar. Hajib ibn Sulayman mengatakan bahwa ia adalah hakim Sana'a dan orang benar {cite:wafayat-ayan}."
