summary:
  ar: "قاضي القضاة شمس الدين العليمي الحنبلي المقدسي من ذرية عمر بن الخطاب؛ ولد سنة سبع وثمانمائة بالرملة ونشأ بها ثم توجه إلى صفد فأقام بها وحفظ القرآن برواية عاصم وأجيز بها ثم عاد إلى الرملة وحفظ الخرقي على مذهب الإمام أحمد ولم يكن في أسلافه الشافعية حنبلي سواه، واجتهد وسافر إلى الشام ومصر وبيت المقدس وتفقه بالشيخ يوسف المرداوي وبرع في المذهب وقرأ البخاري مراراً والشفا كذلك وصنف في الخطب وكان بارعاً في العربية خطيباً بليغاً، وولي قضاء الرملة استقلالاً ولم يعلم أن حنبلياً قبله وليها ثم ولى قضاء القدس مدة طويلة ثم أضيف إليه قضاء بلد الخليل ثم ولي قضاء الرملة تسعة وخمسين يوماً إلى أن دخل الوباء فتوفي بالطاعون يوم الثلاثاء رابع ذي القعدة سنة اثنتين وسبعين وثمانمائة {cite:shadharat-dhahab p. 316-317}."
  en: "Al-'Ulaymi (b. Ramla 807, of 'Umar's descent) — the first Hanbali to hold Ramla's judgeship, then qadi of Jerusalem and al-Khalil; pupil of al-Mardawi; died of the plague Tuesday 4 Dhu'l-Qa'da 872 — grandfather-line of the historian Mujir al-Din {cite:shadharat-dhahab p. 316-317}."
  fr: "Al-'Ulaymi (né Ramla 807, de la descendance d'Omar) - le premier Hanbali à détenir le poste de juge de Ramla, puis qadi de Jérusalem et al-Khalil ; élève d'al-Mardawi ; décédé de la peste mardi 4 Dhu'l-Qa'da 872 - ligne grand-père de l'historien Mujir al-Din {cite:shadharat-dhahab p. 316-317}."
  es: "Al-'Ulaymi (n. Ramla 807, descendiente de 'Umar) — el primer hanbalí en ocupar el cargo de juez en Ramla, luego cadí de Jerusalén y al-Khalil; discípulo de al-Mardawi; murió de peste el martes 4 de Dhu'l-Qa'da 872 — línea paterna del historiador Mujir al-Din {cite:shadharat-dhahab p. 316-317}."
  ur: "العلیمی ⁦(پیدائش رملہ 807، عمر کی نسل سے)⁩ - پہلے حنبلی جس نے رملہ کی عدالت کا عہدہ سنبھالا، پھر یروشلم اور الخلیل کا قاضی؛ المردوی کا شاگرد طاعون کی وجہ سے منگل 4 ذوالقعدہ 872ء کو انتقال ہوا — مورخ مجیر الدین کے دادا کا سلسلہ 316-317}۔"
  tr: "Baş Yargıç Şemseddin el-Alimi el-Hanbali el-Makdisi, Ömer bin el-Hattab'ın soyundan geliyordu; 807 Hicri yılında Ramla'da doğdu, orada büyüdü, sonra Safed'e taşındı; burada yaşadı ve Asim'in rivayetine göre Kur'an'ı ezberledi; Asim'e yetki verildi. Daha sonra Ramla'ya döndü ve İmam Ahmed okuluna göre el-Hurqi'yi ezberledi. Şafii selefleri arasında kendisi dışında Hanbali yoktu. Çaba gösterdi, Levant, Mısır ve Kudüs'e seyahat etti, Şeyh Yusuf el-Mardevi'den fıkıh okudu, okulda üstün başarı gösterdi, el-Buhari'yi ve el-Şifa'yı defalarca okudu, vaazlar yazdı ve vaiz olarak Arapça'da ustaydı. Bağımsız olarak Ramla'nın yargıcı olarak atandı ve ondan önce bir Hanbali olduğu bilinmiyordu. Daha sonra uzun süre Kudüs yargıcı olarak görev yaptı, ardından Hebron şehri eklendi ve salgın patlak verene kadar elli dokuz gün boyunca Ramla yargıcı olarak atandı ve 872 H yılının 4 Dhu al-Qi'dah Salı günü vebadan öldü. {atıf:shadharat-dhahab, s. 316-317}."
  id: "Ketua Hakim Shams al-Din al-Alimi al-Hanbali al-Maqdisi adalah keturunan Umar ibn al-Khattab; ia lahir pada tahun 807 H di Ramla, tumbuh besar di sana, kemudian pindah ke Safed, di mana ia tinggal dan menghafal Al-Qur'an sesuai dengan riwayat Asim, yang kemudian diberi izin. Ia kemudian kembali ke Ramla dan menghafal al-Khurqi sesuai dengan mazhab Imam Ahmad. Di antara para pendahulu Syafi'i, tidak ada Hanbali selain dirinya. Ia berusaha, melakukan perjalanan ke Levant, Mesir, dan Yerusalem, belajar hukum di bawah Sheikh Yusuf al-Mardawi, unggul di sekolah, berulang kali membaca al-Bukhari dan juga al-Shifa, menulis khotbah, dan mahir berbahasa Arab sebagai pengkhotbah. Ia diangkat sebagai hakim Ramla secara independen, dan tidak diketahui bahwa seorang Hanbali mendahuluinya. Ia kemudian menjabat sebagai hakim Yerusalem untuk waktu yang lama, kemudian distrik kota Hebron ditambahkan, dan ia diangkat menjadi hakim Ramla selama lima puluh sembilan hari hingga wabah meletus, dan ia meninggal karena wabah pada hari Selasa, tanggal 4 Dhu al-Qi'dah, 872 H. {cite:shadharat-dhahab, hlm. 316-317}."
