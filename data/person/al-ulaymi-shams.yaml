gender: male
summary:
  ar: "قاضي القضاة شمس الدين العليمي الحنبلي المقدسي من ذرية عمر بن الخطاب؛ ولد سنة سبع وثمانمائة بالرملة ونشأ بها ثم توجه إلى صفد فأقام بها وحفظ القرآن برواية عاصم وأجيز بها ثم عاد إلى الرملة وحفظ الخرقي على مذهب الإمام أحمد ولم يكن في أسلافه الشافعية حنبلي سواه، واجتهد وسافر إلى الشام ومصر وبيت المقدس وتفقه بالشيخ يوسف المرداوي وبرع في المذهب وقرأ البخاري مراراً والشفا كذلك وصنف في الخطب وكان بارعاً في العربية خطيباً بليغاً، وولي قضاء الرملة استقلالاً ولم يعلم أن حنبلياً قبله وليها ثم ولى قضاء القدس مدة طويلة ثم أضيف إليه قضاء بلد الخليل ثم ولي قضاء الرملة تسعة وخمسين يوماً إلى أن دخل الوباء فتوفي بالطاعون يوم الثلاثاء رابع ذي القعدة سنة اثنتين وسبعين وثمانمائة {cite:shadharat-dhahab p. 316-317}."
  en: "Al-'Ulaymi (b. Ramla 807, of 'Umar's descent) — the first Hanbali to hold Ramla's judgeship, then qadi of Jerusalem and al-Khalil; pupil of al-Mardawi; died of the plague Tuesday 4 Dhu'l-Qa'da 872 — grandfather-line of the historian Mujir al-Din {cite:shadharat-dhahab p. 316-317}."
