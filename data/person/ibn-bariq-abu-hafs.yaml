summary:
  ar: "طبيب أندلسي من القرن الرابع الهجري، رحل إلى القيروان ولازم طبيبها أبا جعفر أحمد بن إبراهيم بن أبي خالد ابن الجزار، ثم عاد إلى الأندلس بكتاب شيخه «زاد المسافر وقوت الحاضر» في الطب والعلاج والمفردات."
  en: "Andalusi physician of the fourth century AH who studied medicine in Qayrawan with Ibn al-Jazzar and returned to al-Andalus with his teacher's book on medicine and remedies."
  es: "Médico andalusí del siglo IV d. C. que estudió medicina en Qayrawan con Ibn al-Jazzar y regresó a al-Ándalus con el libro de su maestro sobre medicina y remedios."
  fr: "Médecin andalou du IVe siècle de l'Hégire qui étudia la médecine à Qayrawan auprès d'Ibn al-Jazzar et retourna en al-Andalus avec le livre de son maître sur la médecine et les remèdes."
  ur: "چوتھی صدی ہجری کا اندلسی طبیب جس نے ابن الجزار کے ساتھ قیروان میں طب کی تعلیم حاصل کی اور اپنے استاد کی کتاب طب اور علاج کے ساتھ اندلس واپس آئے۔"
  tr: "4. yüzyıl Hicri Dönemi'nden Endülüslü bir hekim olan Kvaruvan, Kairuan'a seyahat etti ve orada doktor Ebu Ca'far Ahmed bin İbrahim ibn Abi Halid ibn el-Jazzar'a eşlik etti, ardından öğretmenlik kitabı 'Zad al-Musafer wa Qut al-Hader' ile tıp, tedavi ve kelime dağarcığı üzerine yazdı."
  id: "Seorang tabib Andalusia dari abad ke-4 H, ia melakukan perjalanan ke Kairouan dan menemani dokternya Abu Ja'far Ahmad ibn Ibrahim ibn Abi Khalid ibn al-Jazzar, kemudian kembali ke al-Andalus dengan buku gurunya 'Zad al-Musafer wa Qut al-Hader' tentang kedokteran, pengobatan, dan kosakata."
