id: person/al-asmai
class: person
label: { ar: "الأصمعي", en: "al-Asma'i" }
summary:
  ar: "عبد الملك بن قريب الأصمعي صاحب اللغة والأخبار، حدث الرشيد بنهم سليمان بن عبد الملك وتناوله الفراريج بكمه من السفافيد فقال الرشيد إنه عرضت عليّ جباب بني أمية فرأيت في أكمام جباب سليمان أثراً كأنه أثر دهن، فكساه جبة منها فكان يقول هذه جبة سليمان التي كسانيها الرشيد {cite:muruj-al-dhahab p. 165-166}.، وروى عنه الرياشي تعزية عبد الله بن عمرو بن عتبة للمهدي بالمنصور {cite:muruj-al-dhahab p. 305}، وقال للفضل بن الربيع يوم حلبة الرقة أوصلني إلى أمير المؤمنين فتمثل بشعر الخنساء في الفرسين {cite:muruj-al-dhahab p. 350}، وقال فيه جعفر بن يحيى وقد أمر خادمه بألف دينار إن ضحك وصل إليه من أموالنا مائة ألف درهم فرأيت خبأه مكسوراً ودراعته خلقاً ومقعده وسخاً فقلت لسان النعمة أنطق من لسانه {cite:muruj-al-dhahab p. 357}"
  en: "The philologist whose tale of Sulayman's sleeve-snatched chickens explained the grease-marks in the Umayyad wardrobe — Harun gifted him Sulayman's very jubba {cite:muruj-al-dhahab p. 165-166}."
