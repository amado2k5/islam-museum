label: { ar: "الأصمعي", en: "al-Asma'i", fr: "Al-Asma’i", es: "al-Asma'i", ur: "الاسماء" }
summary:
  ar: "عبد الملك بن قريب الأصمعي صاحب اللغة والأخبار، حدث الرشيد بنهم سليمان بن عبد الملك وتناوله الفراريج بكمه من السفافيد فقال الرشيد إنه عرضت عليّ جباب بني أمية فرأيت في أكمام جباب سليمان أثراً كأنه أثر دهن، فكساه جبة منها فكان يقول هذه جبة سليمان التي كسانيها الرشيد {cite:muruj-al-dhahab p. 165-166}. وروى عنه الرياشي تعزية عبد الله بن عمرو بن عتبة للمهدي بالمنصور {cite:muruj-al-dhahab p. 305}، وقال للفضل بن الربيع يوم حلبة الرقة أوصلني إلى أمير المؤمنين فتمثل بشعر الخنساء في الفرسين {cite:muruj-al-dhahab p. 350}، وقال فيه جعفر بن يحيى وقد أمر خادمه بألف دينار إن ضحك وصل إليه من أموالنا مائة ألف درهم فرأيت خبأه مكسوراً ودراعته خلقاً ومقعده وسخاً فقلت لسان النعمة أنطق من لسانه {cite:muruj-al-dhahab p. 357}، وذكر الرياشي عنه عند المسعودي إذا كان الفرس طويل أوظفة اليدين قصير أوظفة الرجلين طويل الذراعين قصير الساقين طويل الفخذين طويل العضدين مفرع الكتفين لم يكد يسبق، وإذا سلم من الفرس شيئان لم يضره عيب سواهما مغروز عنقه في كاهله ومغروز عجزه في صلبه وإذا جادت حوافره فهو هو {cite:muruj-al-dhahab p. 697}، وأشار ابن خلدون إلى ما نقله صاحب العقد في مسامرة الرشيد له في باب الشعر والشعراء مما كان عليه الرشيد من المعرفة والرسوخ في الشعر والتبصر بجيد الكلام ورديئه وكثرة محفوظه منه {cite:muqaddima-ibn-khaldun p. 621}"
  en: "The philologist whose tale of Sulayman's sleeve-snatched chickens explained the grease-marks in the Umayyad wardrobe — Harun gifted him Sulayman's very jubba {cite:muruj-al-dhahab p. 165-166}."
  fr: "Philologue dont le récit des poulets saisis dans la manche par Sulayman expliqua les traces de graisse des vêtements omeyyades — Harun lui offrit la jubba même de Sulayman {cite:muruj-al-dhahab p. 165-166}."
  es: "El filólogo cuya historia de los pollos arrebatados de la manga de Sulayman explicaba las manchas de grasa en el vestuario omeya — Harun le regaló la misma jubba de Sulayman {cite:muruj-al-dhahab p. 165-166}."
  ur: "ماہر فلسفہ جس کی سلیمان کی آستین سے چھینے والی مرغیوں کی کہانی نے اموی الماری میں چکنائی کے نشانات کی وضاحت کی - ہارون نے اسے سلیمان کا بہت ہی جبہ تحفہ میں دیا۔ 165-166}۔"
  tr: "Dilbilimci ve tarihçi Abdul-Malik ibn Kurayb el-Esmaî, el-Raşid'in Süleyman ibn Abd el-Malik hakkında bir hikayesi olduğunu rivayet etmiştir. Süleyman, şişlerden yapılmış kollarıyla tavuk yiyordu. El-Raşid, \"Bana Emevilerin elbiseleri gösterildi ve Süleyman'ın elbisesinin kollarında yağ lekesine benzeyen bir iz gördüm.\" dedi. Bunun üzerine ona bu elbiselerden birini verdi ve Süleyman, \"Bu, el-Raşid'in bana verdiği Süleyman'ın elbisesidir.\" derdi. {kaynak: Muruj-al-Dhahab s. 165-166}. El-Riyaşi de ondan Abdullah ibn Amr ibn Utbah'ın el-Mansur'un ölümü üzerine el-Mehdi'ye taziyelerini nakletmiştir. {kaynak: Muruj-al-Dhahab s. 305}. Rakka'daki yarış günü el-Fadl ibn el-Rabi'ye, \"Beni Müminlerin Emiri'ne götür\" dedi ve el-Hans'ın iki at hakkındaki şiirini okudu. {kaynak:muruj-al-dhahab s. 350} Cafer ibn Yahya onun hakkında şöyle dedi: \"Eğer gülerse ona bin dinar vermesini, bizim paramızdan da yüz bin dirhem vereceğini hizmetçisine emretti. Ben onun pelerinini yırtık, cübbesini eskimiş ve oturduğu yeri kirli görünce, 'Zenginlerin dili onunkinden daha çok konuşur' dedim.\" {kaynak:muruj-al-dhahab s. 357} ve el-Riyaşi, el-Mas'udi'ye göre, onun rivayetine dayanarak, bir atın ön ayakları uzun, arka ayakları kısa, kolları uzun, baldırları kısa, uylukları uzun, üst kolları uzun ve omuzları geniş ise, neredeyse hiç yarış kazanamayacağını belirtmiştir. Ve bir atın iki özelliği sağlam ise, başka hiçbir kusur ona zarar vermez: boynu omuzlarına bağlı ve sağrısı omurgasına bağlıysa. Ve toynakları da iyiyse, durum aynıdır. {alıntı:muruj-al-dhahab s. 697} İbn Haldun, El-İkd'in yazarının, El-Raşid'in şiir ve şairler konusundaki konuşmasında El-Raşid'in şiir bilgisi ve ustalığı, iyi ve kötü sözlere dair içgörüsü ve ezberlediği şiirlerin bolluğu hakkında anlattıklarına atıfta bulunmuştur. {alıntı:mukaddima-ibn-haldun s. 621}"
  id: "Abdul-Malik ibn Qurayb al-Asma'i, seorang ahli bahasa dan sejarawan, meriwayatkan bahwa al-Rashid memiliki sebuah kisah tentang Sulaiman ibn Abd al-Malik, yang sedang makan ayam dengan lengan bajunya yang terbuat dari tusuk sate. Al-Rashid berkata, \"Aku diperlihatkan jubah-jubah Bani Umayyah, dan aku melihat sebuah tanda pada lengan jubah Sulaiman yang tampak seperti tanda minyak.\" Maka ia memberinya salah satu jubah itu, dan Sulaiman biasa berkata, \"Inilah jubah Sulaiman yang diberikan al-Rashid kepadaku.\" {kutip:muruj-al-dhahab hlm. 165-166}. Al-Riyashi juga meriwayatkan darinya ucapan belasungkawa Abdullah ibn Amr ibn Utbah kepada al-Mahdi atas wafatnya al-Mansur. {kutip:muruj-al-dhahab hlm. 305}. Pada hari perlombaan pacuan kuda di Raqqa, ia berkata kepada al-Fadl ibn al-Rabi', \"Bawalah aku kepada Amirul Mukminin,\" dan ia membacakan puisi al-Khansa tentang dua kuda. {cite:muruj-al-dhahab hlm. 350}, dan Ja'far ibn Yahya berkata tentangnya, dan ia memerintahkan pelayannya untuk memberinya seribu dinar jika ia tertawa, dan seratus ribu dirham akan sampai kepadanya dari uang kita. Aku melihat jubahnya robek, pakaiannya usang, dan tempat duduknya kotor, maka aku berkata, \"Lidah orang kaya berbicara lebih banyak daripada lidahnya.\" {cite:muruj-al-dhahab hlm. 357}, dan al-Riyashi menyebutkan atas otoritasnya, menurut al-Mas'udi, bahwa jika seekor kuda memiliki kaki depan yang panjang, kaki belakang yang pendek, lengan yang panjang, betis yang pendek, paha yang panjang, lengan atas yang panjang, dan bahu yang lebar, maka kuda itu hampir tidak akan pernah memenangkan perlombaan. Dan jika dua hal tentang seekor kuda itu sehat, tidak ada cacat lain yang akan membahayakannya: lehernya terhubung dengan pundaknya, dan pantatnya terhubung dengan tulang punggungnya. Dan jika kukunya bagus, maka sama saja. {kutip:muruj-al-dhahab hlm. 697} Ibn Khaldun merujuk pada apa yang dilaporkan oleh penulis Al-Iqd dalam percakapan Al-Rashid dengannya tentang topik puisi dan penyair, mengenai pengetahuan dan penguasaan Al-Rashid tentang puisi, wawasannya tentang ucapan yang baik dan buruk, dan banyaknya apa yang telah dihafalnya. {kutip:muqaddima-ibn-khaldun hlm. 621}"
