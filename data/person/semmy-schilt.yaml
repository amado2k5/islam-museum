summary:
  ar: "كيك بوكسر هولندي معتزل وممارس كاراتيه ومقاتل فنون قتالية مختلطة وُلد في روتردام سنة 1973. فاز ببطولة كي-وان للجائزة الكبرى العالمية أربع مرات وببطولة غلوري للوزن الثقيل سنة 2012، وهو الكيك بوكسر الوحيد الذي فاز بخمس بطولات كبرى للوزن الثقيل. اعتزل سنة 2013 بنصيحة طبية بسبب حالة في القلب، وعمل أيضًا ممثلًا."
  en: "Dutch retired kickboxer, karateka and mixed martial artist born in Rotterdam in 1973. He won the K-1 World Grand Prix four times and the Glory Heavyweight Grand Slam in 2012, and is the only kickboxer to have won five major heavyweight tournaments. He retired in 2013 on medical advice because of a heart condition, and has also worked as an actor."
