gender: male
roles: [scholar]
summary:
  ar: "يحيى بن كثير بن درهم، أبو غسان العنبري الخراساني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} روى عن قرة وشعبة وعلي بن المبارك وسليم بن أخضر وغيرهم، وروى عنه بندار والفلاس وأبو بكر الأعين والكديمي وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} قال أبو حاتم إنه صالح الحديث، وقال النسائي إنه ليس به بأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968}"
  en: "Yahya ibn Kathir ibn Dirham, Abu Ghassan al-Anbari al-Khurasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} He narrated from Qurra, Shu'ba, Ali ibn al-Mubarak, Sulaym ibn Akhdar and others; Bundar, al-Fallas, Abu Bakr al-A'yan and al-Kadimi narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} Abu Hatim called him sound in hadith, and al-Nasa'i said there was no harm in him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968}"
  es: "Yahya ibn Kathir ibn Dirham, Abu Ghassan al-Anbari al-Khurasani. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} Narró de Qurra, Shu'ba, Ali ibn al-Mubarak, Sulaym ibn Akhdar y otros; Bundar, al-Fallas, Abu Bakr al-A'yan y al-Kadimi narraron de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} Abu Hatim lo llamó sano en un hadiz, y al-Nasa'i dijo que no había ningún daño en él. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968}"
  fr: "Yahya ibn Kathir ibn Dirham, Abu Ghassan al-Anbari al-Khurasani. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} Il a rapporté de Qurra, Shu'ba, Ali ibn al-Mubarak, Sulaym ibn Akhdar et d'autres; Bundar, al-Fallas, Abu Bakr al-A'yan et al-Kadimi ont rapporté de lui. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} Abu Hatim l'a appelé sain dans le hadith, et al-Nasa'i a dit qu'il n'y avait aucun mal en lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968}"
  ur: "یحییٰ بن کثیر ابن درہم، ابو غسان الانباری الخراسانی۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 14968} انہوں نے قرہ، شعبہ، علی ابن المبارک، سلیم بن اخدر اور دیگر سے روایت کی ہے۔ ان سے بندر، الفلاس، ابوبکر العیان اور الکدیمی نے روایت کی ہے۔ ابو حاتم نے اسے حدیث میں صحیح کہا ہے اور نسائی نے کہا ہے کہ اس میں کوئی حرج نہیں ہے۔ {حوالہ: فقہ موسوعۃ کویتیہ نور v3 ص14968}"
