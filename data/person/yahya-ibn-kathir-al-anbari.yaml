summary:
  ar: "يحيى بن كثير بن درهم، أبو غسان العنبري الخراساني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} روى عن قرة وشعبة وعلي بن المبارك وسليم بن أخضر وغيرهم، وروى عنه بندار والفلاس وأبو بكر الأعين والكديمي وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} قال أبو حاتم إنه صالح الحديث، وقال النسائي إنه ليس به بأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968}"
  en: "Yahya ibn Kathir ibn Dirham, Abu Ghassan al-Anbari al-Khurasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} He narrated from Qurra, Shu'ba, Ali ibn al-Mubarak, Sulaym ibn Akhdar and others; Bundar, al-Fallas, Abu Bakr al-A'yan and al-Kadimi narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968} Abu Hatim called him sound in hadith, and al-Nasa'i said there was no harm in him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14968}"
