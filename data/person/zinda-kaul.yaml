summary:
  ar: "شاعر وكاتب ومعلم كشميري كتب بالفارسية والهندية والأردية والكشميرية، عُرف عند تلاميذه بلقب «ماسترجي»، وكان أول شاعر كشميري يفوز بجائزة أكاديمية ساهتيا (1956) عن ديوانه «سمران» ذي الطابع التعبدي."
  en: "Kashmiri poet, writer and teacher who composed in Persian, Hindi, Urdu and Kashmiri, was known to his students as Masterji, and in 1956 became the first Kashmiri poet to win the Sahitya Akademi Award, for his devotional collection Sumran."
  ur: "کشمیری شاعر، مصنف و استاد جنھوں نے فارسی، ہندی، اردو اور کشمیری میں لکھا، اپنے شاگردوں میں «ماسٹر جی» کہلائے، اور 1956ء میں اپنے عقیدتی مجموعے «سمرن» پر ساہتیہ اکادمی ایوارڈ پانے والے پہلے کشمیری شاعر بنے۔"
