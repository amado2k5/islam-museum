summary:
  ar: "صاحب خبر الرؤوس الأربعة في موضع واحد بدار إمارة الكوفة: رأس الحسين بين يدي ابن زياد، ثم رأس ابن زياد بين يدي المختار، ثم رأس المختار بين يدي مصعب، ثم رأس مصعب بين يدي عبد الملك، فوثب عبد الملك وأمر بهدم الطاق الذي على المجلس {cite:muruj-al-dhahab p. 101-102}."
  en: "Narrator of the four-heads report — Husayn's, Ibn Ziyad's, al-Mukhtar's and Mus'ab's on one spot in Kufa's emir-house, after which Abd al-Malik ordered the vault pulled down {cite:muruj-al-dhahab p. 101-102}."
  fr: "Narrateur du récit des quatre têtes — celles d'al-Husayn, d'Ibn Ziyad, d'al-Mukhtar et de Mus'ab, au même endroit de la maison de l'émir à Koufa —, après quoi Abd al-Malik ordonna d'abattre la voûte {cite:muruj-al-dhahab p. 101-102}."
  es: "Narrador del informe de las cuatro cabezas — Husayn, Ibn Ziyad, al-Mukhtar y Mus'ab en un lugar de la casa del emir de Kufa, después de lo cual Abd al-Malik ordenó derribar la bóveda {cite:muruj-al-dhahab p. 101-102}."
  ur: "چار سروں والی رپورٹ کا راوی - حسین، ابن زیاد، المختار اور مصعب کوفہ کے امیر کے گھر میں ایک جگہ پر، اس کے بعد عبد الملک نے تجوری کو نیچے اتارنے کا حکم دیا۔ 101-102}۔"
  tr: "Kufa Emirliği binasında dört başın bir arada bulunması haberinin sahibi şöyleydi: İbn Ziyad'ın önünde Hüseyin'in başı, sonra Mühter'in önünde İbn Ziyad'ın başı, sonra Musab'ın önünde Mühter'in başı, sonra da Abdülmalik'in önünde Musab'ın başı. Abdülmalik ayağa fırladı ve meclisin üzerindeki kemerli geçidin yıkılmasını emretti. {Kaynak: Muruj-al-Dhahab s. 101-102}"
  id: "Pemilik berita tentang empat kepala di satu tempat di Istana Emirat Kufa: kepala Al-Hussein di depan Ibn Ziyad, kemudian kepala Ibn Ziyad di depan Al-Mukhtar, kemudian kepala Al-Mukhtar di depan Musab, kemudian kepala Musab di depan Abdul-Malik. Abdul-Malik melompat dan memerintahkan penghancuran gapura di atas dewan {kutip:muruj-al-dhahab hlm. 101-102}."
