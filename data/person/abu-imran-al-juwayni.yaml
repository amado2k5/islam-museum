summary:
  ar: "موسى بن العباس بن محمد، أبو عمران الجويني النيسابوري، محدث حافظ من كبار المحدثين، سمع عبد الله بن هاشم وأحمد بن الأزهر ومحمد بن يحيى وغيرهم، وروى عنه الحسن بن سفيان وأبو علي الحافظ وأبو أحمد الحاكم وغيرهم، قال الحاكم إنه حسن الحديث بمرة، وله كتاب على صحيح مسلم. (؟ - ٣٢٣ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13347}"
  en: "Musa ibn al-Abbas ibn Muhammad, Abu Imran al-Juwayni al-Nishapuri, a great hadith scholar and memoriser. He heard from Abd Allah ibn Hashim, Ahmad ibn al-Azhar and others; al-Hasan ibn Sufyan, Abu Ali al-Hafiz and al-Hakim narrated from him. Al-Hakim called him good in hadith. He wrote a work on Sahih Muslim. Death 323 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13347}"
