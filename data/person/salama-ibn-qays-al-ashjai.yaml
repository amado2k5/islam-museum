gender: male
roles: [companion, general]
traditions: [sunni]
summary:
  ar: "سلمة بن قيس الأشجعي، صحابي ولاه عمر بن الخطاب الجيش المتوجه إلى الأهواز وأوصاه بوصايا القتال، فلما فتح الله عليه بعث بسفط حلية إلى عمر بطيب أنفس جنده، فردّه عمر وأمر بقسمته في الجند، كما يروي عبد الرحمن رأفت الباشا في «صور من حياة الصحابة»."
  en: "Salama ibn Qays al-Ashja'i, a Companion whom Umar ibn al-Khattab appointed to lead the army to al-Ahwaz with instructions on the conduct of war; after victory he sent Umar a casket of jewellery with his soldiers' consent, and Umar sent it back with orders to divide it among the troops, as Abd al-Rahman Ra'fat al-Basha retells in Suwar min Hayat al-Sahaba."
  ur: "سلامہ بن قیس الاشجعی، وہ صحابی جسے عمر بن خطاب نے اہواز کی فوج کی قیادت پر مقرر کیا۔"
  es: "Salama ibn Qays al-Ashja'i, un Compañero a quien Umar ibn al-Khattab designó para dirigir el ejército a al-Ahwaz con instrucciones sobre la conducción de la guerra; después de la victoria, envió a Umar un cofre de joyas con el consentimiento de sus soldados, y Umar se lo devolvió con órdenes de dividirlo entre las tropas, como relata Abd al-Rahman Ra'fat al-Basha en Suwar min Hayat al-Sahaba."
  fr: "Salama ibn Qays al-Ashja'i, un Compagnon qu'Umar ibn al-Khattab avait désigné pour mener l'armée à al-Ahwaz avec des instructions sur la conduite de la guerre; après la victoire, il envoya à Umar un coffret de bijoux avec le consentement de ses soldats, et Umar le lui renvoya avec l'ordre de le répartir entre les troupes, comme le raconte Abd al-Rahman Ra'fat al-Basha dans Suwar min Hayat al-Sahaba."
  tr: "Salama ibn Qays al-Ashja'i, Ömer bin el-Hattab tarafından Ahvaz'a giden orduda atanan bir yoldaştı ve ona savaşmasını emretti. Allah ona zafer verdiğinde, askerlerinin iyiliğiyle Ömer'e bir takı hediyesi gönderdi. Ömer mücevheri geri verdi ve mücevherin askerler arasında paylaştırılmasını emretti; bu, Abd al-Rahman Raafat al-Paşa'nın 'Sahabelerin Hayatlarından Resimler' adlı eserinde anlattığı gibi."
  id: "Salama ibn Qays al-Ashja'i adalah teman yang ditunjuk oleh Umar ibn al-Khattab dalam pasukan yang menuju Ahvaz dan memerintahkannya untuk bertempur. Ketika Tuhan memberinya kemenangan, ia mengirimkan hadiah perhiasan kepada Umar dengan kebaikan para prajuritnya. Umar mengembalikannya dan memerintahkan agar perhiasan itu dibagi di antara pasukan, seperti yang diceritakan oleh Abd al-Rahman Raafat al-Pasha dalam 'Gambar dari Kehidupan Para Sahabat.'"
