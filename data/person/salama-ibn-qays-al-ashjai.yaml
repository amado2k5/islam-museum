summary:
  ar: "سلمة بن قيس الأشجعي، صحابي ولاه عمر بن الخطاب الجيش المتوجه إلى الأهواز وأوصاه بوصايا القتال، فلما فتح الله عليه بعث بسفط حلية إلى عمر بطيب أنفس جنده، فردّه عمر وأمر بقسمته في الجند، كما يروي عبد الرحمن رأفت الباشا في «صور من حياة الصحابة»."
  en: "Salama ibn Qays al-Ashja'i, a Companion whom Umar ibn al-Khattab appointed to lead the army to al-Ahwaz with instructions on the conduct of war; after victory he sent Umar a casket of jewellery with his soldiers' consent, and Umar sent it back with orders to divide it among the troops, as Abd al-Rahman Ra'fat al-Basha retells in Suwar min Hayat al-Sahaba."
