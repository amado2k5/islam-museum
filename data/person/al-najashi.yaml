summary:
  ar: "أحمد بن علي بن أحمد بن العباس النجاشي الأسدي، أبو العباس، مؤرخ إمامي ببغدادي ⁦(372 - 450 هـ، 982 - 1058 م)⁩ يعرف بابن الكوفي، صاحب كتاب «الرجال» في تراجم علماء الشيعة وأسماء مصنفاتهم؛ وهو من الإمامية، وهم فرقة شيعية تختلف عن الإطار السني للمتحف."
  en: "Ahmad ibn Ali ibn Ahmad ibn al-Abbas al-Najashi al-Asadi, Abu al-Abbas (372-450 AH, 982-1058 CE), an Imami (Shi'i, distinct from the museum's Sunni default frame) historian of Baghdad known as Ibn al-Kufi, author of the Rijal on Shi'i scholars and their works."
