summary:
  ar: "أحمد بن علي بن أحمد بن العباس النجاشي الأسدي، أبو العباس، مؤرخ إمامي ببغدادي ⁦(372 - 450 هـ، 982 - 1058 م)⁩ يعرف بابن الكوفي، صاحب كتاب «الرجال» في تراجم علماء الشيعة وأسماء مصنفاتهم؛ وهو من الإمامية، وهم فرقة شيعية تختلف عن الإطار السني للمتحف."
  en: "Ahmad ibn Ali ibn Ahmad ibn al-Abbas al-Najashi al-Asadi, Abu al-Abbas (372-450 AH, 982-1058 CE), an Imami (Shi'i, distinct from the museum's Sunni default frame) historian of Baghdad known as Ibn al-Kufi, author of the Rijal on Shi'i scholars and their works."
  fr: "Ahmad ibn Ali ibn Ahmad ibn al-Abbas al-Najashi al-Asadi, Abu al-Abbas (372-450 de l’hégire, 982-1058 de notre ère), un imami (chiite, distinct du cadre sunnite par défaut du musée) historien de Bagdad connu sous le nom Ibn al-Kufi, auteur du Rijal sur les savants chiites et leurs œuvres."
  es: "Ahmad ibn Ali ibn Ahmad ibn al-Abbas al-Najashi al-Asadi, Abu al-Abbas (372-450 AH, 982-1058 CE), un historiador imamí (chií, distinto del marco suní predeterminado del museo) de Bagdad conocido como Ibn al-Kufi, autor del Rijal sobre los eruditos chiíes y sus obras."
  ur: "احمد بن علی بن احمد بن العباس النجاشی الاسدی، ابو العباس ⁦(372-450 ہجری، 982-1058 عیسوی)⁩، ایک امامی ⁦(شیعہ، جو عجائب گھر کے سنی ڈیفالٹ فریم سے الگ ہے)⁩ بغداد کے مؤرخ جو کہ ان کے اسکالر ابن الکل کے نام سے مشہور ہیں کام کرتا ہے"
  tr: "Ahmed ibn Ali ibn Ahmed ibn al-Abbas al-Najashi al-Asadi, Ebu el-Abbas, Bağdat'ta (372 - 450 H, 982 - 1058 yılları) İmam tarihçiydi, İbn el-Kufi olarak bilinir, Şii alimlerin biyografileri ve eserlerinin isimleri üzerine 'El-Ricel' kitabının yazarıdır; müzenin Sünni çerçevesinden farklı bir Şii mezhebi olan İmamiyiye'dendir."
  id: "Ahmad ibn Ali ibn Ahmad ibn al-Abbas al-Najashi al-Asadi, Abu al-Abbas, adalah seorang sejarawan Imami di Baghdad (372 - 450 H, 982 - 1058 M), dikenal sebagai Ibn al-Kufi, penulis buku 'Al-Rijal' tentang biografi ulama Syiah dan nama-nama karya mereka; ia berasal dari Imamiyyah, sebuah sekte Syiah yang berbeda dari kerangka Sunni di museum tersebut."
