summary: {ar: 'عبد الرحمن بن أحمد البهكلي الصبيائي التهامي اليماني: مؤرخ ولد بصبيا وتنقل بينها وبين صنعاء، ولاه المنصور علي بن العباس الحكم في بيت الفقيه، صاحب «نفح العود»، مات متأثراً من سم سنة ١٢٤٨ هـ الموافقة ١٨٣٢ م.', en: 'Abd al-Rahman ibn Ahmad al-Bahkali al-Sabiyi al-Tihami al-Yamani: a historian born in Sabya who moved between it and Sanaa, appointed ruler in Bayt al-Faqih by al-Mansur Ali ibn al-Abbas, author of «Nafh al-Ud», who died of poison in 1248 AH (1832 CE).', fr: "Abd al-Rahman ibn Ahmad al-Bahkali al-Sabiyi al-Tihami al-Yamani : historien né à Sabya qui partagea sa vie entre cette ville et Sanaa, nommé gouverneur de Bayt al-Faqih par al-Mansur Ali ibn al-Abbas, auteur du « Nafh al-Ud », mort empoisonné en 1248 H (1832 ap. J.-C.).", es: "Abd al-Rahman ibn Ahmad al-Bahkali al-Sabiyi al-Tihami al-Yamani: un historiador nacido en Sabya que se movía entre esta y Sanaa, nombrado gobernante en Bayt al-Faqih por al-Mansur Ali ibn al-Abbas, autor de «Nafh al-Ud», que murió envenenado en 1248 AH (1832 d. C.).", ur: "عبدالرحمٰن بن احمد البحکلی الصبیعی التہامی الیمانی: ایک مورخ جو سبیہ میں پیدا ہوا جو اس کے اور صنعاء کے درمیان منتقل ہوا، بیت الفقیہ کا حاکم المنصور علی ابن العباس کے ذریعہ مقرر کیا گیا، جو \"نفح العدون\" کے مصنف ہیں، جن کی وفات سنہ 2 1 ہجری میں ہوئی۔", tr: "Abdülrahman ibn Ahmed el-Bahkali el-Subai'i el-Tihami el-Yamani: Sabya'da doğmuş ve Sabya ile Sana'a arasında gidip gelmiş bir tarihçi. El-Mansur Ali ibn el-Abbas onu Beytül-Fakih'te yönetici olarak atamıştır. \"Nafh el-Ud\" adlı eserin yazarıdır. Hicri 1248 yılında (miladi 1832) zehirlenerek ölmüştür.", id: "Abd al-Rahman ibn Ahmad al-Bahkali al-Subai’i al-Tihami al-Yamani: Seorang sejarawan yang lahir di Sabya dan berpindah-pindah antara Sabya dan Sana’a. Al-Mansur Ali ibn al-Abbas menunjuknya untuk memerintah di Beit al-Faqih. Beliau adalah penulis kitab “Nafh al-Oud.” Beliau meninggal karena keracunan pada tahun 1248 H, yang bertepatan dengan tahun 1832 M."}
