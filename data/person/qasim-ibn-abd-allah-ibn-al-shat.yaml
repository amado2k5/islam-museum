summary:
  ar: قاسم بن عبد الله بن محمد بن الشاط، أبو محمد وأبو القاسم، الأنصاري الإشبيلي، فقيه مالكي وفرضي، شارك في بعض العلوم، أخذ عن أبي علي الحسن بن الربيع وأجازه أبو القاسم بن البراء وابن أبي الدنيا وابن الغماز وغيرهم، وروى عنه أبو زكرياء بن الهذيل وابن الحباب والقاضي أبو بكر بن شبرين وغيرهم. من تصانيفه أنوار البروق في تعقب مسائل القواعد والفروق، وتحفة الرافض في علم الفرائض، وتحرير الجواب في توفير الثواب. وذكر المصدر أنه توفي سنة 723 هـ، وأن ميلاده سنة 643 هـ بحسب العنوان. {C(5489,5490)}
  en: Qasim ibn Abd Allah ibn Muhammad ibn al-Shat, Abu Muhammad and Abu al-Qasim, of the Ansar, from Seville, a Maliki jurist and expert in inheritance shares, who also took part in some other sciences. He studied with Abu Ali al-Hasan ibn al-Rabi' and was licensed by Abu al-Qasim ibn al-Bara' and others, and transmitted from him Abu Zakariyya ibn al-Hudhayl and others. His works include Anwar al-Buruq, a critique of the problems of the Qawa'id and the Furuq, a work on the science of shares, and a treatise on the reward. The book gives his death as 723 AH and his birth as 643 AH in its heading. {C(5489,5490)}
  ur: قاسم بن عبداللہ بن محمد بن الشاط، ابو محمد اور ابو القاسم، انصاری اشبیلی، مالکی فقیہ اور علم فرائض کے ماہر، کچھ دوسرے علوم میں بھی شریک رہے۔ انہوں نے ابو علی حسن بن ربیع سے پڑھا اور ابو القاسم بن البراء وغیرہ سے اجازت پائی۔ تصانیف میں انوار البروق فی تعقب مسائل القواعد والفروق، علم فرائض پر ایک کتاب، اور تحریر الجواب فی توفیر الثواب شامل ہیں۔ کتاب کے مطابق وفات 723 ہجری اور عنوان میں ولادت 643 ہجری ہے۔ {C(5489,5490)}
