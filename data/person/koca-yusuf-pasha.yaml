label:
  ar: "يوسف باشا الكبير"
  en: "Koca Yusuf Pasha"
  ur: "کوجہ یوسف پاشا"
  es: "Koca Yusuf Pasha"
  fr: "Koca Yusuf Pasha"
summary:
  ar: "يوسف باشا المعروف بـ«كوجا يوسف»؛ أصله جورجي مولى معتق لخوجة حسن قبان ليمان، احترف بالقهوة في قاسم باشا ورافق القوافل البحرية؛ لازم حسن باشا الجزائري فولاه خزانته لما صار قبطان باشا، ثم بلغ الصدارة العظمى مرتين ⁦(١٢٠٠هـ/١٧٨٦م و١٢٠٥هـ/١٧٩١م)⁩ وكان سرداراً أعظم على جبهة روسيا والنمسا، وانتهى والياً على الشام وأميراً للحج {cite:sicill-i-osmani vol. 5, 'Yusuf Paşa (Koca)'}."
  en: "Yusuf Pasha, 'Koca Yusuf'; a Georgian freedman of the harbour reis Hacı Hasan, a coffee-seller in Kasımpaşa who sailed with the summer convoys to Egypt; attached to Cezayirli Hasan Pasha who made him treasurer when he became kapudan-ı derya; grand vizier twice (1200/1786 and 1205/1791) and serdâr-ı ekrem on the Russo-Austrian front, ending as governor of Damascus and amir of the Hajj {cite:sicill-i-osmani vol. 5, 'Yusuf Paşa (Koca)'}."
  ur: "یوسف پاشا المعروف بہ «کوجہ یوسف»؛ جارجیائی نژاد آزاد کردہ غلام جو قاسم پاشا میں قہوہ فروش تھا اور موسم گرما میں بیڑے کے ساتھ تجارت کرتا تھا؛ جزائری حسن پاشا سے وابستہ ہوا جس نے اسے خزانچی بنایا؛ دو بار صدر اعظم ⁦(١٢٠٠ھ/١٧٨٦ء اور ١٢٠٥ھ/١٧٩١ء)⁩ اور روس و آسٹریا کی جنگ میں سردارِ اکرم، آخر میں شام کا والی اور امیرِ حج بنا {cite:sicill-i-osmani vol. 5, 'Yusuf Paşa (Koca)'}."
  es: "Yusuf Pasha, 'Koca Yusuf'; un liberto georgiano del puerto reis Hacı Hasan, vendedor de café en Kasımpaşa que navegó con los convoyes de verano a Egipto; vinculado a Cezayirli Hasan Pasha, quien lo nombró tesorero cuando se convirtió en kapudan-ı derya; gran visir dos veces (1200/1786 y 1205/1791) y serdâr-ı ekrem en el frente ruso-austríaco, terminando como gobernador de Damasco y emir del Hajj {cite:sicill-i-osmani vol. 5, 'Yusuf Paşa (Koca)'}."
  fr: "Yusuf Pacha, « Koca Yusuf »; un affranchi géorgien du port, fils de Hacı Hasan, un vendeur de café à Kasımpaşa qui naviguait avec les convois d'été vers l'Égypte; attaché à Cezayirli Hasan Pacha qui le nomma trésorier lorsqu'il devint kapudan-ı derya; grand vizir à deux reprises (1200/1786 et 1205/1791) et serdâr-ı ekrem sur le front russo-autrichien, terminant comme gouverneur de Damas et émir du Hajj {cite: sicill-i-osmani vol. 5, « Yusuf Paşa (Koca) »}."
  tr: "Yusuf Paşa, 'Koja Yusuf' olarak bilinir; aslen Gürcü olan, Hoca Hasan Qaban Liman'ın özgür bırakılmış kölesi, Kasım Paşa'nın yanında kahve profesyoneli oldu ve deniz kervanlarına eşlik etti; Cezayirli Hasan Paşa'ya eşlik etti ve Paşa kaptan olduğunda onu hazinesine atadı. Daha sonra en yüksek rütbeye iki kez ulaştı (1200 H/1786 ve 1205 H/1791 M.S.). Rus ve Avusturya cephelerinde başkomutan olarak görev yaptı, sonunda Levant valisi ve hac prensi oldu {cite:sicill-i-osmani cilt 5, 'Yusuf Paşa (Koca)'}."
  id: "Yusuf Pasha, dikenal sebagai 'Koja Yusuf'; awalnya orang Georgia, seorang budak bebas Khoja Hassan Qaban Liman, ia menjadi profesional kopi di bawah Qasim Pasha dan mendampingi kafilah angkatan laut; ia mendampingi Hassan Pasha si Aljazair dan mengangkatnya ke kas saat menjadi kapten Pasha. Ia kemudian mencapai pangkat tertinggi dua kali (1200 H/1786 M dan 1205 H/1791 M). Ia adalah komandan utama di front Rusia dan Austria, akhirnya menjadi gubernur Levant dan pangeran ziarah {cite:sicill-i-osmani vol. 5, 'Yusuf Paşa (Koca)'}."
