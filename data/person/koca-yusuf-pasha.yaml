label:
  ar: "يوسف باشا الكبير"
  en: "Koca Yusuf Pasha"
  ur: "کوجہ یوسف پاشا"
summary:
  ar: "يوسف باشا المعروف بـ«كوجا يوسف»؛ أصله جورجي مولى معتق لخوجة حسن قبان ليمان، احترف بالقهوة في قاسم باشا ورافق القوافل البحرية؛ لازم حسن باشا الجزائري فولاه خزانته لما صار قبطان باشا، ثم بلغ الصدارة العظمى مرتين (١٢٠٠هـ/١٧٨٦م و١٢٠٥هـ/١٧٩١م) وكان سرداراً أعظم على جبهة روسيا والنمسا، وانتهى والياً على الشام وأميراً للحج {cite:sicill-i-osmani vol. 5, 'Yusuf Paşa (Koca)'}."
  en: "Yusuf Pasha, 'Koca Yusuf'; a Georgian freedman of the harbour reis Hacı Hasan, a coffee-seller in Kasımpaşa who sailed with the summer convoys to Egypt; attached to Cezayirli Hasan Pasha who made him treasurer when he became kapudan-ı derya; grand vizier twice (1200/1786 and 1205/1791) and serdâr-ı ekrem on the Russo-Austrian front, ending as governor of Damascus and amir of the Hajj {cite:sicill-i-osmani vol. 5, 'Yusuf Paşa (Koca)'}."
  ur: "یوسف پاشا المعروف بہ «کوجہ یوسف»؛ جارجیائی نژاد آزاد کردہ غلام جو قاسم پاشا میں قہوہ فروش تھا اور موسم گرما میں بیڑے کے ساتھ تجارت کرتا تھا؛ جزائری حسن پاشا سے وابستہ ہوا جس نے اسے خزانچی بنایا؛ دو بار صدر اعظم (١٢٠٠ھ/١٧٨٦ء اور ١٢٠٥ھ/١٧٩١ء) اور روس و آسٹریا کی جنگ میں سردارِ اکرم، آخر میں شام کا والی اور امیرِ حج بنا {cite:sicill-i-osmani vol. 5, 'Yusuf Paşa (Koca)'}."
