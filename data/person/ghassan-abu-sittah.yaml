summary:
  ar: جراح تجميل وترميم بريطاني فلسطيني، وُلد سنة 1969، اشتهر بعمله الجراحي الإنساني في مناطق الحروب ومنها غزة، وشغل منصب رئيس جامعة غلاسكو المنتخب من الطلبة سنة 2024.
  en: British-Palestinian plastic and reconstructive surgeon, born 1969, known for humanitarian surgical work in war zones including Gaza, and elected Rector of the University of Glasgow in 2024.
  ur: برطانوی فلسطینی پلاسٹک اور بحالی مابعد سرجن، پیدائش 1969، جنگی علاقوں بشمول غزہ میں انسانی جراحی کے کام سے مشہور، اور 2024 میں گلاسگو یونیورسٹی کے منتخب ریکٹر بنے۔
  es: "Cirujano plástico y reconstructivo británico-palestino, nacido en 1969, conocido por su labor quirúrgica humanitaria en zonas de guerra, incluida Gaza, y elegido rector de la Universidad de Glasgow en 2024."
  fr: "Chirurgien plasticien et reconstructeur britanno-palestinien, né en 1969, connu pour son travail chirurgical humanitaire dans des zones de guerre, notamment à Gaza, et élu recteur de l'Université de Glasgow en 2024."
  tr: "1969 doğumlu İngiliz-Filistinli plastik ve rekonstrüktif cerrah olan Gre, Gazze dahil savaş bölgelerindeki insani cerrahi çalışmalarıyla ün kazandı ve 2024'te öğrenciler arasından seçilmiş Glasgow Üniversitesi başkanı olarak görev yaptı."
  id: "Seorang ahli bedah plastik dan rekonstruktif Britania-Palestina, lahir pada tahun 1969, ia menjadi terkenal atas kerja bedah kemanusiaannya di zona perang termasuk Gaza, dan ia menjabat sebagai presiden terpilih Universitas Glasgow dari para mahasiswa pada tahun 2024."
