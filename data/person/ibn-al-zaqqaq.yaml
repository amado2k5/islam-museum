summary:
  ar: "الشاعر المشهور علي بن عطية اللخمي البلنسي المعروف بابن الزقاق؛ كان شاعراً مفلقاً حسن السبك رشيق العبارة؛ توفي في سنة تسع وعشرين وخمسمائة أو التي قبلها {cite:shadharat-dhahab p. 569}."
  en: "The celebrated Valencian poet Ali ibn Atiyya al-Lakhmi, known as Ibn al-Zaqqaq; a powerful poet of fine mould and graceful phrasing; d. in 529 or the year before {cite:shadharat-dhahab p. 569}."
  es: "El célebre poeta valenciano Ali ibn Atiyya al-Lakhmi, también conocido como Ibn al-Zaqqaq; un poderoso poeta de fino estilo y elegante fraseo; murió en 529 o el año anterior {citado: shadharat-dhahab p. 569}."
  fr: "Le célèbre poète valencien Ali ibn Atiyya al-Lakhmi, également connu sous le nom d'Ibn al-Zaqqaq; un poète puissant, de belle facture et au phrasé gracieux; mort en 529 ou l'année précédente {cité: shadharat-dhahab p. 569}."
  ur: "مشہور ویلنسیائی شاعر علی ابن عطیہ الخمی، ابن الزقاق کے نام سے جانا جاتا ہے؛ عمدہ مولڈ اور خوبصورت جملے کا ایک طاقتور شاعر؛ d 529 میں یا اس سے پہلے کا سال 569}۔"
  tr: "Ünlü şair Ali bin Atiyah Al-Lakhmi Al-Balansi, İbn Al-Zuqaq olarak bilinir; yetenekli bir şairdi, üslubu güzeldi ve ifade açısından etkileyici bir şairdi; 529 Hicri yılında veya öncesinde vefat etti {atıf:shadharat-dhahab, s. 569}."
  id: "Penyair terkenal Ali bin Atiyah Al-Lakhmi Al-Balansi, yang dikenal sebagai Ibn Al-Zuqaq; adalah penyair terampil, indah dalam gaya, dan fasih dalam ekspresi; ia meninggal pada tahun 529 H atau sebelum {cite:shadharat-dhahab, hlm. 569}."
