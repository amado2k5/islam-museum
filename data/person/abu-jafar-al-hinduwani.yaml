summary:
  ar: "محمد بن عبد الله بن محمد، أبو جعفر البلخي الهندواني، فقيه كان يقال له أبو حنيفة الصغير لبراعته في الفقه، توفي ببخارى سنة 362 هـ، ونسبته إلى باب هندوان محلة ببلخ، على ما يذكر ابن العماد."
  en: "Muhammad ibn Abdallah ibn Muhammad, Abu Ja'far al-Balkhi al-Hinduwani, a jurist called Little Abu Hanifa for his skill in jurisprudence; died in Bukhara in 362 AH (972-973) according to Ibn al-Imad; the nisba is to Bab Hinduwan, a quarter of Balkh."
  fr: "Muhammad ibn Abdallah ibn Muhammad, Abu Ja'far al-Balkhi al-Hinduwani, juriste surnommé le Petit Abu Hanifa pour son habileté en jurisprudence ; mort à Boukhara en 362 H (972-973) selon Ibn al-Imad ; la nisba renvoie à Bab Hinduwan, un quartier de Balkh."
