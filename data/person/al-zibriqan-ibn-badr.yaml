summary:
  en: "A Tamimi notable and poet of Banu Bahdala of Sa'd who came among his people's chiefs to Medina in 9 AH and declaimed a boast before the Prophet; Hassan ibn Thabit answered him, al-Aqra' conceded the Muslims' superiority, and he accepted Islam; later sources make him sadaqa collector over part of Banu Sa'd."
  ar: "سيد وشاعر من بني تميم، أحد بني بهدلة بن عوف من سعد؛ جاء في وفد رؤساء قومه سنة 9هـ وقام فأنشد قصيدته في الفخر بين يدي النبي، فأجابه حسان بن ثابت، وحكم الأقرع بن حابس للمسلمين، فأسلم؛ وتذكر المصادر المتأخرة أن النبي ولّاه الصدقة على قسم من بني سعد."
