label: { ar: "فلوطرخس", en: "Fulutarkhus", es: "Fulutarkhus", fr: "Fulutarkhus", ur: "فلترخس" }
summary:
  ar: "فلوطرخس، من كتبه كتاب الآراء الطبيعية ويحتوي على آراء الفلاسفة في الأمور الطبيعيات وهو خمس مقالات نقله قسطا بن لوقا البعلبكي، وكتاب الموراليا فيما دله عليه من مداراة العدو والانتفاع به وكتاب الغضب وكتاب الرياضة مقالة سرياني وكتاب النفس مقالة، ولفلوطرخس آخر كتاب الأنهار وخواصها وما فيها من العجائب والجبال {cite:fihrist-ibn-al-nadim p. 355-356}."
  en: "Plutarch — the Natural Opinions translated by Qusta ibn Luqa {cite:fihrist-ibn-al-nadim}"
  es: "Plutarco — Las opiniones naturales traducidas por Qusta ibn Luqa {cite:fihrist-ibn-al-nadim}"
  fr: "Plutarque — Les Opinions naturelles traduites par Qusta ibn Luqa {cite:fihrist-ibn-al-nadim}"
  ur: "پلوٹارک - قدرتی آراء کا ترجمہ جس کا ترجمہ قستہ ابن لقا نے کیا ہے"
  tr: "Plotrex'in kitapları arasında, filozofların doğal konular hakkındaki görüşlerini içeren 'Doğal Görüşler' adlı kitap bulunmaktadır. Bu kitap, Qusta ibn Luka al-Baalbaki tarafından aktarılan beş risalesten oluşur; 'Düşmanın hoşgörüsü ve bundan faydalanmak hakkında ona gösterdiği şeyler üzerine Moralia' kitabı, öfke üzerine kitap, 'Sports' (Süryanice bir deneme) ve 'Ruh' (bir deneme); ve Plotrex'in nehirler, onların özellikleri ve içlerindeki harikalar ve dağlar üzerine son kitabı {cite:Fihrist-ibn-al-Nadim s. 355-356}."
  id: "Plotrex, di antara bukunya adalah buku 'Pendapat Alami,' yang memuat pandangan para filsuf tentang hal-hal alam. Buku ini terdiri dari lima risalah yang disampaikan oleh Qusta ibn Luka al-Baalbaki; buku 'Moralia tentang apa yang dia tunjukkan kepadanya tentang toleransi musuh dan manfaat darinya,' buku tentang kemarahan, buku 'Olahraga' (esai Siria), dan buku 'Jiwa' (sebuah esai); serta buku terakhir Plotrex tentang sungai dan sifat-sifatnya serta keajaiban dan gunung di dalamnya {cite:fihrist-ibn-al-nadim hlm. 355-356}."
