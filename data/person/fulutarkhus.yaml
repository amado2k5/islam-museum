label: { ar: "فلوطرخس", en: "Fulutarkhus" }
summary:
  ar: "فلوطرخس، من كتبه كتاب الآراء الطبيعية ويحتوي على آراء الفلاسفة في الأمور الطبيعيات وهو خمس مقالات نقله قسطا بن لوقا البعلبكي، وكتاب الموراليا فيما دله عليه من مداراة العدو والانتفاع به وكتاب الغضب وكتاب الرياضة مقالة سرياني وكتاب النفس مقالة، ولفلوطرخس آخر كتاب الأنهار وخواصها وما فيها من العجائب والجبال {cite:fihrist-ibn-al-nadim p. 355-356}."
  en: "Plutarch — the Natural Opinions translated by Qusta ibn Luqa {cite:fihrist-ibn-al-nadim}"
