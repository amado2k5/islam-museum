summary:
  ar: "عالم أمريكي من أصل إيراني في الدراسات الإسلامية (وُلد سنة 1970 في جاكسونفيل بفلوريدا)، أستاذ الدراسات الآسيوية والشرق أوسطية في جامعة ديوك ومدير سابق لمركز ديوك للدراسات الإسلامية. متخصص في التصوف، حرّر «مسلمون تقدميون» (2003) وكتب «ذكريات محمد» (2009) و«الحب الراديكالي» (2018)."
  en: "Iranian-American scholar of Islam (born 1970 in Jacksonville, Florida), professor of Asian and Middle Eastern studies at Duke University and former director of the Duke Islamic Studies Center. A specialist in Sufism, he edited Progressive Muslims (2003) and wrote Memories of Muhammad (2009) and Radical Love (2018)."
  ur: "ایرانی نژاد امریکی عالمِ اسلام (پیدائش 1970ء، جیکسن ویل، فلوریڈا)، ڈیوک یونیورسٹی میں ایشیائی و مشرق وسطیٰ مطالعات کے پروفیسر اور ڈیوک اسلامک اسٹڈیز سینٹر کے سابق ڈائریکٹر۔ تصوف کے ماہر؛ ان کی کتابوں میں «یادِ محمد» (2009ء) اور «محبتِ جارحانہ» (2018ء) شامل ہیں۔"
