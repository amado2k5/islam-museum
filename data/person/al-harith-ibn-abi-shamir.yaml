summary:
  ar: "الحارث بن أبي شمر الغساني الملقب الأعرج، ملك غسان بالشام؛ غزا بني تغلب بعد أن ردّ عليه عمرو بن كلثوم وعيده فانهزم وقتل أخوه، وهو الذي كتب له السموأل بن عادياء ليوصل امرأ القيس بن حجر إلى قيصر يستنصره على ثأر أبيه {cite:kamil-ibn-al-athir p. 385, 403}."
  en: "Al-Harith ibn Abi Shamir 'the Lame' (Arethas), Ghassanid king of Syria: routed by Taghlib after Amr ibn Kulthum's defiance, losing his own brother; it was to him that Samaw'al ibn Adiya's letter commended Imru' al-Qays seeking passage to Caesar {cite:kamil-ibn-al-athir p. 385, 403}."
