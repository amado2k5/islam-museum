summary:
  ar: "الحارث بن أبي شمر الغساني الملقب الأعرج، ملك غسان بالشام؛ غزا بني تغلب بعد أن ردّ عليه عمرو بن كلثوم وعيده فانهزم وقتل أخوه، وهو الذي كتب له السموأل بن عادياء ليوصل امرأ القيس بن حجر إلى قيصر يستنصره على ثأر أبيه {cite:kamil-ibn-al-athir p. 385, 403}."
  en: "Al-Harith ibn Abi Shamir 'the Lame' (Arethas), Ghassanid king of Syria: routed by Taghlib after Amr ibn Kulthum's defiance, losing his own brother; it was to him that Samaw'al ibn Adiya's letter commended Imru' al-Qays seeking passage to Caesar {cite:kamil-ibn-al-athir p. 385, 403}."
  fr: "Al-Harith ibn Abi Shamir, « le Boiteux » (Arethas), roi ghassanide de Syrie : vaincu par les Taghlib après le défi d’Amr ibn Kulthum, il perdit son propre frère ; c’est à lui qu’une lettre de Samaw’al ibn Adiya recommanda Imru’ al-Qays cherchant passage auprès de César {cite:kamil-ibn-al-athir p. 385, 403}."
  es: "Al-Harith ibn Abi Shamir 'el Cojo' (Arethas), rey gasánida de Siria: derrotado por Taghlib tras el desafío de Amr ibn Kulthum, perdiendo a su propio hermano; fue a él a quien la carta de Samaw'al ibn Adiya elogió a Imru' al-Qays buscando paso ante César {cite:kamil-ibn-al-athir p. 385, 403}."
  ur: "الحارث ابن ابی شمر 'لنگڑا' ⁦(اریتھاس)⁩، شام کا غسانی بادشاہ: عمرو بن کلثوم کی مخالفت کے بعد تغلب نے اپنے بھائی کو کھو دیا۔ اسے سماول بن عدیہ کے خط نے قیصر کے پاس جانے کے لیے عمرو القیس کی تعریف کی تھی۔ 385، 403}۔"
