summary:
  ar: "شاعر جاهلي، خال طرفة بن العبد، نبذ الصحيفة التي كان يحملها إلى عامل البحرين فنجا، فصار مثلاً في الداهية: 'جاء بصحيفة المتلمس'. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 23}"
  en: "A pre-Islamic poet, maternal uncle of Tarafa ibn al-Abd; he threw away the letter he was carrying to the governor of Bahrain and survived, giving rise to the proverb 'he came with al-Mutalammis's letter'. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 23}"
  ur: "جاہلی شاعر، طرفہ بن العبد کے ماموں؛ انہوں نے بحرین کے عامل کو لے جانے والا خط پھینک دیا اور بچ گئے، اور 'متلمس کا خط لے آیا' مثل بن گیا۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 23}"
