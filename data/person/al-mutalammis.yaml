summary:
  ar: "جرير بن عبد العزى، أو عبد المسيح، المعروف بالمتلمس، شاعر جاهلي من بني ضبيعة من أهل البحرين وخال طرفة بن العبد، نادم عمرو بن هند ثم هجاه ففر إلى الشام ولحق بآل جفنة ومات ببصرى."
  en: "Jarir ibn Abd al-Uzza, or Abd al-Masih, known as al-Mutalammis, a pre-Islamic poet of the Banu Dubay'a from Bahrain and maternal uncle of Tarafa ibn al-Abd; he was a companion of Amr ibn Hind, then satirised him, fled to Syria, joined the Jafnids and died at Busra."
  fr: "Jarir ibn Abd al-Uzza, ou Abd al-Masih, connu sous le nom d'al-Mutalammis, poète préislamique des Banu Dubay'a de Bahreïn et oncle maternel de Tarafa ibn al-Abd ; Il était un compagnon d'Amr ibn Hind, puis le satirisa, s'enfuit en Syrie, rejoignit les Jafnids et mourut à Busra."
  es: "Jarir ibn Abd al-Uzza, o Abd al-Masih, conocido como al-Mutalammis, fue un poeta preislámico de los Banu Dubay'a de Bahréin y tío materno de Tarafa ibn al-Abd; fue compañero de Amr ibn Hind, luego lo satirizó, huyó a Siria, se unió a los Jafnids y murió en Busra."
  ur: "جریر بن عبد العزی، یا عبد المسیح، جو المتعلم کے نام سے جانا جاتا ہے، بحرین سے تعلق رکھنے والے بنو دبئی کے قبل از اسلام شاعر اور ترافہ ابن العبد کے ماموں؛ وہ عمرو بن ہند کا ساتھی تھا، پھر اس پر طنز کیا، شام کی طرف بھاگا، جعفریوں میں شامل ہوا اور بصرہ میں وفات پائی۔"
  tr: "Jarir ibn Abd al-Uzza ya da Abd al-Masih, al-Mutalemis olarak bilinir, Bahreyn'den Banu Dhubay'ah'dan İslam öncesi bir şair ve Tarafa ibn al-Abd'ın amcasıydı. Amr ibn Hind'e pişmanlık duydu, sonra onu hicvetti, Levant'a kaçtı, Al Jafna'ya katıldı ve Bosra'da öldü."
  id: "Jarir ibn Abd al-Uzza, atau Abd al-Masih, yang dikenal sebagai al-Mutalamis, adalah seorang penyair pra-Islam dari Banu Dhubay'ah dari Bahrain dan paman dari Tarafa ibn al-Abd. Ia menyesali Amr ibn Hind, lalu menyindir Amr ibn Hind, melarikan diri ke Levant, bergabung dengan Al Jafna, dan meninggal di Bosra."
