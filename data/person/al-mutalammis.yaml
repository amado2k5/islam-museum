  ar: "جرير بن عبد العزى، أو عبد المسيح، المعروف بالمتلمس، شاعر جاهلي من بني ضبيعة من أهل البحرين وخال طرفة بن العبد، نادم عمرو بن هند ثم هجاه ففر إلى الشام ولحق بآل جفنة ومات ببصرى."
  en: "Jarir ibn Abd al-Uzza, or Abd al-Masih, known as al-Mutalammis, a pre-Islamic poet of the Banu Dubay'a from Bahrain and maternal uncle of Tarafa ibn al-Abd; he was a companion of Amr ibn Hind, then satirised him, fled to Syria, joined the Jafnids and died at Busra."
