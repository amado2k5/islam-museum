summary:
  ar: "داود بن علي الأصبهاني المعروف بداود الظاهري؛ ولد بالكوفة نحو سنة ٢٠٠هـ ونشأ ببغداد وتوفي بها سنة ٢٧٠هـ، درس مذهب الشافعي وتعصب له وألّف في مناقبه، ثم استقل بمذهب يعرف بمذهب الظاهرية تبعه كثير من الناس خصوصاً في فارس والأندلس؛ أنكر القياس وتمسك بظاهر الكتاب والسنة، ولم يُبح القياس إلا حيث نُص على العلة، وقد هاجم القياسيين وبيّن ما ألجأهم إليه القياس من خطأ في الأحكام {cite:duha-islam p. 567-568}."
  en: "Dawud ibn Ali al-Isbahani — Kufa-born (c. 200), Baghdad-bred (d. 270); a zealous Shafi'i who wrote al-Shafi'i's virtues then broke away to found the literalist Zahiri school, rejecting qiyas and holding to the evident text {cite:duha-islam p. 567-568}."
