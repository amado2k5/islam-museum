summary:
  ar: "راجا محمود آباد (5 تشرين الثاني 1914 – 14 تشرين الأول 1973)، سياسي وشاعر وكاتب. ورث إقطاعية أبيه محمد علي محمد خان سنة 1931 وهو قاصر، وأدار مدرسة الواعظين (1940–1944)، وعارض تقسيم الهند أولًا رئيسًا لرابطة جمهور مسلمي عموم الهند ثم صار من قادة حركة باكستان وأسس اتحاد طلبة مسلمي عموم الهند (1937). هاجر إلى العراق (1945) ثم باكستان (1957) ثم لندن، حيث كان أول مدير للمركز الثقافي الإسلامي، ومات فيها ودُفن عند ضريح الإمام الرضا في مشهد."
  en: "Raja of Mahmudabad (5 November 1914 – 14 October 1973), politician, writer and poet. He inherited his father Mohammad Ali Mohammad Khan's estate in 1931 while still a minor, served as managing trustee of the Madrasatul Waizeen (1940–1944), first opposed the partition of India as president of the All-India Jamhur Muslim League and then became a leader of the Pakistan Movement, founding the All India Muslim Students Federation in 1937. He moved to Iraq (1945), then Pakistan (1957), then London, where he was the first director of the Islamic Cultural Centre; he died in London and was buried at the Imam Reza shrine in Mashhad."
  ur: "راجا صاحب محمود آباد (5 نومبر 1914 – 14 اکتوبر 1973)، سیاست دان، مصنف اور شاعر۔ 1931 میں کم عمری میں والد محمد علی محمد خان کی جاگیر کے وارث بنے، مدرسۃ الواعظین کے منتظم متولی رہے (1940–1944)، پہلے آل انڈیا جمہور مسلم لیگ کے صدر کی حیثیت سے تقسیم ہند کی مخالفت کی، پھر تحریک پاکستان کے رہنما بنے اور 1937 میں آل انڈیا مسلم اسٹوڈنٹس فیڈریشن قائم کی۔ عراق (1945)، پھر پاکستان (1957) اور پھر لندن منتقل ہوئے، جہاں اسلامک کلچرل سینٹر کے پہلے ڈائریکٹر رہے؛ لندن میں وفات پائی اور مشہد میں مزار امام رضا کے پاس دفن ہوئے۔"
