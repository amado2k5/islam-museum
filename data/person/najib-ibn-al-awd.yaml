summary:
  ar: "المتكلم الحلي، يصفه ابن العماد بأنه شيخ الشيعة وعالمهم؛ سكن حلب مدة فصفع بها لكونه سبّ الصحابة — بحسب رواية المصدر — ثم سكن جزين إلى أن مات بها في نصف شعبان وله نيف وتسعون سنة، وكان قد وقع في الهرم {cite:shadharat-dhahab p. 637}."
  en: "The Hilli mutakallim — 'shaykh of the Shi'a and their scholar' in this Sunni source's words; slapped at Aleppo for cursing the Companions (as the source relates), settled at Jizzin and died there mid-Sha'ban past ninety {cite:shadharat-dhahab p. 637}."
  es: "El Hilli mutakallim -'el shaykh de los chiítas y sus eruditos' en palabras de esta fuente sunita; abofeteado en Alepo por maldecir a los Compañeros (como relata la fuente), se estableció en Jizzin y murió allí a mediados de Sha'ban después de los noventa {citar: shadharat-dhahab p. 637}."
  fr: "Les Hilli mutakallim — « cheikh des chiites et leur érudit » selon les mots de cette source sunnite; giflé à Alep pour avoir maudit les Compagnons (comme le raconte la source), s'est installé à Jizzin et y est mort au milieu de Sha'ban après quatre-vingt-dix {cite: shadharat-dhahab p. 637}."
  ur: "ہلی متکلم - 'شیعوں کے شیخ اور ان کے عالم' اس سنی ماخذ کے الفاظ میں؛ صحابہ پر لعنت کرنے پر حلب میں تھپڑ مارا ⁦(جیسا کہ ماخذ بتاتا ہے)⁩ جزین میں سکونت اختیار کی اور وہیں شعبان کے وسط میں نوے کے قریب وفات پائی۔ 637}۔"
