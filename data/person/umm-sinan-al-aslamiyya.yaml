summary:
  ar: "صحابية من أسلم خرجت مع النبي إلى خيبر تخرز السقاء وتداوي المرضى والجرحى، فكانت مع أم سلمة وشهدت فتح خيبر، وروت عنها ابنتها ثبيتة بنت حنظلة؛ يذكرها كحالة في «أعلام النساء»."
  en: "A Companion of Aslam who went out with the Prophet to Khaybar to stitch water-skins and tend the sick and wounded; she stayed with Umm Salama and witnessed the conquest of Khaybar, and her daughter Thubayta bint Hanzala transmitted from her. Kahhala lists her in A'lam al-Nisa'."
  ur: "قبیلہ اسلم کی ایک صحابیہ جو نبی کے ساتھ خیبر گئیں تاکہ مشکیزے سییں اور بیماروں و زخمیوں کی دوا کریں؛ وہ ام سلمہ کے ساتھ رہیں اور فتح خیبر میں موجود تھیں، اور ان کی بیٹی ثبیتہ بنت حنظلہ نے ان سے روایت کی۔ کحالہ «اعلام النساء» میں ان کا ذکر کرتے ہیں۔"
