summary:
  ar: "كندي أُسر في أفغانستان سنة 2002 وهو في الخامسة عشرة، واحتُجز في غوانتانامو عشر سنوات، وأقرّ بالذنب أمام لجنة عسكرية أمريكية سنة 2010، وأُعيد إلى كندا سنة 2012، وأُفرج عنه بكفالة سنة 2015، وتوصّل سنة 2017 إلى تسوية مع الحكومة الكندية تضمّنت اعتذارًا رسميًا."
  en: "Canadian captured in Afghanistan in 2002 at the age of fifteen and held at Guantanamo for ten years; he pleaded guilty before a United States military commission in 2010, was repatriated to Canada in 2012, released on bail in 2015, and reached a settlement with the Canadian government in 2017 that included an official apology."
  ur: "کینیڈین شہری جنہیں 2002 میں پندرہ برس کی عمر میں افغانستان میں پکڑا گیا اور دس سال گوانتانامو میں رکھا گیا؛ انہوں نے 2010 میں امریکی فوجی کمیشن کے سامنے جرم قبول کیا، 2012 میں کینیڈا واپس آئے، 2015 میں ضمانت پر رہا ہوئے، اور 2017 میں کینیڈین حکومت سے ایک تصفیے پر پہنچے جس میں سرکاری معذرت شامل تھی۔"
