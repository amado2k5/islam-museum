summary:
  ar: "أبو الفضل الجوهري ⁦(وبعض الرواة يقول ابن أبي الليث بن الحارث بن عبد الرحمن)⁩؛ روى عن إسماعيل بن أبي أويس وغيره وعنه الباغندي وآخر من روى عنه ابن مخلد، وكان ثقة ثبتًا حافظًا؛ توفي سنة اثنتين وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 120}."
  en: "Abu'l-Fadl al-Jawhari, traditionist who transmitted from Isma'il ibn Abi Uways; graded trustworthy and exacting. He died in 262 {cite:muntazam-ibn-al-jawzi p. 120}."
  es: "Abu'l-Fadl al-Jawhari, tradicionalista que transmitió de Isma'il ibn Abi Uways; calificado de digno de confianza y riguroso. Murió en 262 {cite:muntazam-ibn-al-jawzi p. 120}."
  fr: "Abu'l-Fadl al-Jawhari, traditionaliste ayant transmis l'enseignement d'Isma'il ibn Abi Uways; réputé digne de confiance et rigoureux. Il mourut en 262 av. J.-C. (Muntazam ibn al-Jawzi, p. 120)."
  ur: "ابو الفضل الجوہری، محدث جو اسماعیل بن ابی اویس سے نقل کرتے ہیں۔ درجہ بندی قابل اعتماد اور سختی سے. ان کی وفات 262 میں ہوئی۔ 120}۔"
  tr: "Ebu el-Fadl el-Cevavi (bazı rivayetçiler İbn Ebi el-Leyt ibn el-Haris ibn Abdül-Rahman der) İsmail ibn Ebi Uveys ve diğerlerinden rivayet etmiştir; el-Baghandi ve son rivayetçi İbn Muhlid onlardan rivayet etmiş, güvenilir, ezberlenmiş ve ezberlenmiştir; 262 Hicri yılında vefat etmiş {atıf:Muntazam-ibn-al-Jawzi, s. 120}."
  id: "Abu al-Fadl al-Jawhari (dan beberapa narator mengatakan Ibn Abi al-Layth ibn al-Harith ibn Abd al-Rahman) menceritakan dari Isma'il ibn Abi Uways dan lainnya, dari siapa al-Baghandi dan narator terakhir Ibn Mukhlid menceritakan, dapat dipercaya, dapat diandalkan, dan dihafal; ia wafat pada tahun 262 H {cite:muntazam-ibn-al-jawzi, hlm. 120}."
