label: { ar: "فخر الدولة بن ركن الدولة" }
summary:
  ar: "ابن ركن الدولة، جعل له أبوه همذان والدينور سنة خمس وستين، ومات سنة سبع وثمانين وأقيم ابنه رستم مقامه في السلطنة بالري وأعمالها وهو ابن أربع سنين ولقبه القادر مجد الدولة، وكان من تسعة ملوك هلكوا على نسق في سنتي سبع وثمانين وثمان وثمانين كما قال الذهبي {cite:tarikh-khulafa-minhaj-1434 p. 627,635}."
  en: "Rukn al-Dawla's son, given Hamadhan and Dinawar in 365; he died in 387 — one of al-Dhahabi's nine kings dead in sequence within two years — his four-year-old Rustam succeeding at Rayy as Majd al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 627,635}."
