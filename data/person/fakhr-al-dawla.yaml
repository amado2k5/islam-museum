id: person/fakhr-al-dawla
class: person
label: { ar: "فخر الدولة بن ركن الدولة" }
summary:
  ar: "ابن ركن الدولة، جعل له أبوه همذان والدينور سنة خمس وستين، ومات سنة سبع وثمانين وأقيم ابنه رستم مقامه في السلطنة بالري وأعمالها وهو ابن أربع سنين ولقبه القادر مجد الدولة، وكان من تسعة ملوك هلكوا على نسق في سنتي سبع وثمانين وثمان وثمانين كما قال الذهبي {cite:tarikh-khulafa-minhaj-1434 p. 627,635}."
  en: "Rukn al-Dawla's son, given Hamadhan and Dinawar in 365; he died in 387 — one of al-Dhahabi's nine kings dead in sequence within two years — his four-year-old Rustam succeeding at Rayy as Majd al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 627,635}."
  es: "El hijo de Rukn al-Dawla, a quien se le concedieron Hamadhan y Dinawar en 365; murió en 387 —uno de los nueve reyes de al-Dhahabi que murieron en secuencia en un plazo de dos años— su hijo Rustam, de cuatro años, sucedió en Rayy como Majd al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 627,635}."
  fr: "Le fils de Rukn al-Dawla, Hamadhan et Dinawar reçus en 365; il mourut en 387 — l'un des neuf rois d'al-Dhahabi morts successivement en l'espace de deux ans — son fils Rustam, âgé de quatre ans, lui succédant à Rayy sous le nom de Majd al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 627,635}."
  ur: "رکن الدولہ کا بیٹا، 365 میں حماد اور دینار دیا گیا؛ اس کا انتقال 387 میں ہوا - الذہبی کے نو بادشاہوں میں سے ایک دو سالوں میں ترتیب وار مر گیا - اس کا چار سالہ رستم رے میں مجد الدولہ کے طور پر کامیاب ہوا 627,635}۔"
  tr: "Babası İbn Rukn al-Dawla, 65 yaşında onun yerine Hamaman ve el-Dinawar atadı, 1987'de vefat etti ve oğlu Rustem dört yaşında Rayy'de ve işlerinde Sultanlık'ta konumunu sağlamlaştırdı. El-Kadir Majd el-Devle unvanını aldı. 87 ve 1988 yıllarında aynı şekilde ölen dokuz kraldan biriydi, bu da el-Dhahabi'nin belirttiği gibi {cit:History-Khulafa-minhaj-1434, s. 627,635} tarafından belirtilmiştir."
  id: "Ibn Rukn al-Dawla, ayahnya menunjuk Hamadan dan al-Dinawar untuknya pada tahun enam puluh lima, meninggal pada tahun 1987, dan putranya Rustam mendirikan posisinya di Kesultanan Rayy dan urusannya pada usia empat tahun. Ia bergelar al-Qadir Majd al-Dawla. Ia termasuk di antara sembilan raja yang meninggal dengan cara yang sama pada tahun 87 dan 1988, seperti yang dinyatakan oleh al-Dhahabi {cite:History-Khulafa-minhaj-1434, hlm. 627,635}."
