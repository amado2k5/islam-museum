summary:
  ar: "ملاكمة محترفة أمريكية سابقة وشخصية تلفزيونية، وُلدت في ميامي بيتش سنة 1977، وهي ابنة الملاكم محمد علي. اعتزلت بلا هزيمة بسجل 24 فوزاً منها 21 بالضربة القاضية، حاملة ألقاب المجلس العالمي والرابطة الدولية واتحاد WIBA في وزن فوق المتوسط، ثم عملت مقدّمة ومشاركة في برامج تلفزيونية منها «الرقص مع النجوم» و«المصارعون الأمريكيون»."
  en: "American retired professional boxer and television personality, born in Miami Beach in 1977, the daughter of the boxer Muhammad Ali. She retired undefeated with 24 wins, 21 by knockout, holding the WBC, WIBA, IWBF and IBA super middleweight titles, and later worked in television, including Dancing with the Stars and American Gladiators."
  ur: "امریکی سابق پیشہ ور باکسر اور ٹیلی ویژن شخصیت، 1977 میں میامی بیچ میں پیدا ہوئیں، باکسر محمد علی کی بیٹی ہیں۔ وہ 24 فتوحات (21 ناک آؤٹ) کے ساتھ ناقابل شکست ریٹائر ہوئیں، ڈبلیو بی سی، ڈبلیو آئی بی اے، آئی ڈبلیو بی ایف اور آئی بی اے سپر مڈل ویٹ ٹائٹل اپنے نام کیے، اور بعد میں ٹیلی ویژن میں کام کیا، جس میں «ڈانسنگ ود دی سٹارز» اور «امریکن گلیڈی ایٹرز» شامل ہیں۔"
