summary:
  ar: "واعظ وكاتب تركي، وُلد سنة 1960 في أوف بولاية طرابزون، حفظ القرآن على يد أبيه، ودرس في كلية الإلهيات بجامعة مرمرة ثم تخرّج في أصول الفقه بجامعة أم القرى في مكة، وقاد تأسيس جمعية النسيج الاجتماعي ومؤسستها، واشتهر بدروسه وفتاواه في الأسرة والشباب والأخلاق. بلغت قناته على يوتيوب 999,000 مشترك كما في 11 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish preacher and writer, born in 1960 in Of, Trabzon. He memorised the Qur'an under his father, studied at Marmara University's theology faculty and then graduated in usul al-fiqh at Umm al-Qura University in Mecca, led the founding of the Sosyal Doku association and foundation, and is known for his lessons and fatwa answers on family, youth and ethics. His YouTube channel counted 999,000 subscribers as of 11 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک واعظ اور مصنف، جو 1960ء میں طرابزون کے علاقے اوف میں پیدا ہوئے، اپنے والد سے قرآن حفظ کیا، مرمرہ یونیورسٹی کے شعبۂ الہیات میں پڑھا اور پھر مکہ کی ام القریٰ یونیورسٹی سے اصولِ فقہ میں فارغ التحصیل ہوئے، سوسیال ڈوکو انجمن اور اس کی فاؤنڈیشن کے قیام کی قیادت کی، اور خاندان، نوجوانوں اور اخلاق پر اپنے دروس اور فتویٰ جوابات کے لیے جانے جاتے ہیں۔ vidIQ کے مطابق 11 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 999,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Predicador y escritor turco, nacido en 1960 en Of, Trabzon. Memorizó el Corán con su padre, estudió teología en la Universidad de Marmara y se graduó en usul al-fiqh en la Universidad Umm al-Qura de La Meca. Fue fundador de la asociación y fundación Sosyal Doku, y es conocido por sus lecciones y respuestas a fatwas sobre la familia, la juventud y la ética. Su canal de YouTube contaba con 999.000 suscriptores al 11 de noviembre de 2026, según vidIQ (dato antiguo de la plataforma, no verificado por ningún museo)."
  fr: "Prédicateur et écrivain turc, né en 1960 à Of, dans la province de Trabzon. Il a mémorisé le Coran auprès de son père, étudié la théologie à l'université de Marmara, puis obtenu un diplôme en usul al-fiqh à l'université Umm al-Qura de La Mecque. Il a fondé l'association et la fondation Sosyal Doku et est connu pour ses enseignements et ses réponses aux fatwas sur la famille, la jeunesse et l'éthique. Sa chaîne YouTube comptait 999 000 abonnés au 11 novembre 2026, selon vidIQ – un chiffre ancien, non vérifié par un musée."
