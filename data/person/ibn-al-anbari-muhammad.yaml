  fr: "Ibn al-Anbari, Muhammad"
  ur: "ابن الانباری، محمد"
roles: [scholar]
gender: male
summary:
  ar: "محمد بن القاسم بن محمد بن بشار، أبو بكر الأنباري: من أعلم أهل زمانه بالأدب واللغة وأكثرهم حفظا للشعر والأخبار، ولد في الأنبار وتوفي ببغداد، 271 إلى 328هـ؛ من كتبه «الزاهر» و«الأضداد» و«غريب الحديث»."
  en: "Muhammad ibn al-Qasim ibn Muhammad ibn Bashshar, Abu Bakr al-Anbari: among the most learned of his time in literature and language and the greatest memorisers of poetry and reports; born at al-Anbar, died in Baghdad, 271 to 328 AH; author of «al-Zahir», «al-Addad» and «Gharib al-hadith»."
  es: "Muhammad ibn al-Qasim ibn Muhammad ibn Bashshar, Abu Bakr al-Anbari: uno de los más eruditos de su tiempo en literatura y lengua, y el mayor memorizador de poesía y relatos; nació en al-Anbar y murió en Bagdad, entre los años 271 y 328 de la Hégira; autor de «al-Zahir», «al-Addad» y «Gharib al-hadith»."
  fr: "Muhammad ibn al-Qasim ibn Muhammad ibn Bashshar, Abu Bakr al-Anbari: parmi les plus savants de son temps en littérature et en langue et les plus grands mémorisateurs de poésie et de récits; né à al-Anbar, mort à Bagdad, 271 à 328 AH; auteur de « al-Zahir », « al-Addad » et « Gharib al-hadith »."
  ur: "محمد بن القاسم بن محمد بن بشر، ابوبکر الانباری: ادب اور زبان میں اپنے زمانے کے سب سے زیادہ ماہر اور شاعری اور رپورٹس کے سب سے بڑے یادگاروں میں۔ الانبار میں پیدا ہوئے، بغداد میں وفات 271 تا 328 ہجری۔ \"الظاہر\"، \"العاد\" اور \"غریب الحدیث\" کے مصنف۔"
  tr: "Muhammed ibn el-Kasim ibn Muhammed bin Beşar, Ebu Bekir el-Anbari: Zamanının edebiyat ve dil konusunda en bilgili kişilerinden biri, şiir ve haberlerde en çok ezberlenen kişidir. Anbar'da doğmuş ve 271-328 Hicri yılları arasında Bağdat'ta vefat etmiştir; kitapları arasında 'El-Zahir', 'El-Eddad' ve 'Garib al-Hadis' bulunmaktadır."
  id: "Muhammad ibn al-Qasim ibn Muhammad ibn Bashar, Abu Bakr al-Anbari: Salah satu orang paling berpengetahuan pada zamannya dalam sastra dan bahasa, serta paling hafal tentang puisi dan berita. Ia lahir di Anbar dan meninggal di Baghdad, 271 hingga 328 H; di antara bukunya adalah 'Al-Zahir', 'Al-Addad', dan 'Gharib al-Hadith'."
