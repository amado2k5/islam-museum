summary:
  ar: "تاسع سلاطين كشمير من أسرة شاه مير، حكم في 1418–1419 ثم 1420–1470، ويذكره الكشميريون بلقب بادشاه أي الملك العظيم. تُعدّ سنواته الخمسون عصرًا ذهبيًا من السلام والازدهار في كشمير الوسيطة: ألغى الجزية عن غير المسلمين، واستدعى الهندوس المهجّرين في الاضطهادات السابقة، وأعاد العطاءات والرعاية إلى علماء البراهمة، وسمح بإعادة بناء المعابد، وأنشأ دار ترجمة نقلت المهابهاراتا وراجاتارانغيني من السنسكريتية إلى الفارسية، وجلب الحرفيين من عالم سمرقند، وعمّر سريناغار بالأعمال العامة."
  en: "Ninth sultan of Kashmir of the Shah Mir dynasty, reigning in 1418–1419 and again in 1420–1470, remembered by Kashmiris as Budshah, the Great King. His fifty years on the throne are counted a golden age of peace and prosperity in medieval Kashmir. He abolished the jizya imposed on non-Muslims, recalled Hindus exiled under earlier persecution, restored stipends and patronage to Brahmin scholars, allowed temples to be rebuilt and Hindu personal law to be followed, founded a translation bureau that rendered the Mahabharata and the Rajatarangini from Sanskrit into Persian, brought artisans from the Samarkand world, and filled Srinagar with public works."
  ur: "کشمیر کے نویں سلطان، خاندانِ شاہ میر سے، جنہوں نے 1418–1419 اور پھر 1420–1470 میں حکومت کی؛ کشمیری انہیں بڈشاہ یعنی عظیم بادشاہ کے لقب سے یاد کرتے ہیں۔ ان کے پچاس سالہ دور کو قرونِ وسطیٰ کے کشمیر کا سنہری عہد شمار کیا جاتا ہے: انہوں نے غیر مسلموں پر عائد جزیہ ختم کیا، پہلے ظلم و ستم میں ملک بدر ہونے والے ہندوؤں کو واپس بلایا، برہمن علماء کی وظیفہ جات و سرپرستی بحال کی، مندروں کی تعمیرِ نو کی اجازت دی، ایک دارالترجمہ قائم کیا جس نے مہابھارت اور راج ترنگنی کا سنسکرت سے فارسی میں ترجمہ کیا، سمرقند کی دنیا سے کاریگر بلائے اور سرینگر کو عوامی تعمیرات سے بھر دیا۔"
