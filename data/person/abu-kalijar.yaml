id: person/abu-kalijar
class: person
label: { ar: "الملك أبو كاليجار بن سلطان الدولة", en: "al-Malik Abu Kalijar ibn Sultan al-Dawla" , ur: "الملک ابو کالیجار بن سلطان الدولہ", fr: "al-Malik Abu Kalijar ibn Sultan al-Dawla", es: "al-Malik Abu Kalijar ibn Sultan al-Dawla" }
summary:
  ar: "الملك أبو كاليجار بن سلطان الدولة بن بهاء الدولة بن عضد الدولة، كان وليّ عهد أبيه؛ لما مات السلطان شرف الدولة سنة ست عشرة وأربعمائة عدل الجند إليه ونوّهوا باسمه فخُطب له ببغداد {cite:shadharat-dhahab p. 204}. وعند ابن الجوزي خُطب له ببغداد بعد موت مشرف الدولة سنة ٤١٦ ثم عادت الخطبة لجلال الدولة؛ وفي سنة ٤٢٣ دعاه غلمان بغداد بعد طردهم جلال الدولة فأجاب بكتاب حذر يشترط خمسمائة غلام مقدمة {cite:muntazam-ibn-al-jawzi j.8 p.363, 405-406}. وحلف مع جلال الدولة في رجب ٤٢٩ ألا يجري من أحدهما ما يؤذي الآخر، وقطع الغلمان خطبة جلال الدولة فخطبوا له ثم عادوا فخطبوا له {cite:muntazam-ibn-al-jawzi j.8 p.433,438}. دخل همذان سنة ٤٣٣ ودفع الغز عنها، ودخل بغداد سنة ٤٣٦ وأحدث ضرب الطبل في الصلوات الخمس ولم يكن يُضرب للملوك ببغداد إلا ثلاث نوب لعضد الدولة فجعلها خمسًا {cite:muntazam-ibn-al-jawzi j.8 p.450,461}. توفي في رمضان ٤٤٠ عن أربعين سنة وأشهر بعد فصد ثلاث مرات، فانتهب الغلمان خزائنه وأحرقت جواريه الخيام وهو فيها مسجّى، وولي بعده ابنه أبو نصر الملقب الملك الرحيم، وكان قد وُلد بالبصرة في شوال ٣٩٩ وولي العراق أربع سنين وشهرين {cite:muntazam-ibn-al-jawzi j.8 p.478-479,481}."
  en: "Al-Malik Abu Kalijar b. Sultan al-Dawla — his father's designated heir; when Sultan Sharaf al-Dawla died in 416 the army went over to him and proclaimed his name, and he was given the khutba at Baghdad {cite:shadharat-dhahab p. 204}."
  ur: "بویہی حکمران اور اپنے والد کے نامزد وارث؛ ماخذ 416ھ میں لشکر کی طرف سے ان کی حمایت اور بغداد میں ان کے نام کے خطبے کا ذکر کرتے ہیں۔ {cite:shadharat-dhahab}"
  fr: "Al-Malik Abu Kalijar b. Sultan al-Dawla — l'héritier désigné de son père ; quand le sultan Sharaf al-Dawla mourut en 416, l'armée se rallia à lui et proclama son nom, et la khutba fut prononcée en son nom à Bagdad {cite:shadharat-dhahab p. 204}."
  es: "Al-Malik Abu Kalijar b. Sultan al-Dawla — el heredero designado de su padre; cuando el sultán Sharaf al-Dawla murió en 416 el ejército se dirigió a él y proclamó su nombre, y se le dio la jutba en Bagdad {cita: shadharat-dhahab p. 204}."
  tr: "Kral Ebu Kalijar ibn Sultan el-Davla ibn Baha' el-Davla ibn Adud el-Davla, babasının veliaht prensiydi. Sultan Şaraf el-Davla 416 Hicri yılında vefat ettiğinde, askerler ona yönelip adını övdüler ve böylece Bağdat'ta cuma hutbesi onun adına okundu {kaynak: Şadharat-Dhaba s. 204}. İbn el-Cevzi'ye göre, 416 Hicri yılında Müşrif el-Davla'nın ölümünden sonra Bağdat'ta cuma hutbesi onun adına okundu, sonra Celal el-Davla'ya geri döndü. 423 Hicri yılında, Bağdat hizmetkarları Celal el-Davla'yı kovduktan sonra onu çağırdılar ve o da beş yüz hizmetkarı şart koşan ihtiyatlı bir mektupla cevap verdi {kaynak: Muntazam-ibn-el-Cevzi j.8 s. 363, 405-406}. Hicri 429 yılının Receb ayında Celaleddin-Devla ile birbirlerine zarar vermeyeceklerine dair yemin etti. Bunun üzerine hizmetkârlar, Celaleddin-Devla adına kılınan Cuma hutbesini yarıda kesip onun adına kıldılar, sonra geri dönüp tekrar onun adına kıldılar. {Kaynak: Muntazam ibn el-Cevzi, 8. cilt, s. 433, 438}. Hicri 433 yılında Hamadan'a girdi ve oradan Guzz'ları kovdu. Hicri 436 yılında Bağdat'a girdi ve beş vakit namazda davul çalınmasını başlattı. Daha önce Bağdat'ta krallar için sadece üç kez davul çalınırdı, ancak Adud el-Devla için bunu beşe çıkardı. Hicri 440 yılının Ramazan ayında, kırk yaşını doldurduktan birkaç ay sonra, üç kez kanı akıtıldıktan sonra öldü. Hizmetkârları hazinesini yağmaladı ve kadın hizmetkârları o çadırda yatarken çadırları yaktılar. Oğlu Ebu Nasr, lakabı el-Malik el-Rahim (Merhametli Kral) olan, babasının yerine geçti. Hicri 399 yılının Şevval ayında Basra'da doğmuş ve Irak'ı dört yıl iki ay yönetmiştir."
  id: "Raja Abu Kalijar ibn Sultan al-Dawla ibn Baha' al-Dawla ibn 'Adud al-Dawla adalah putra mahkota ayahnya. Ketika Sultan Sharaf al-Dawla meninggal pada tahun 416 H, para prajurit berpaling kepadanya dan memuji namanya, sehingga khutbah Jumat disampaikan atas namanya di Baghdad {cite:shadharat-dhahab hlm. 204}. Menurut Ibn al-Jawzi, khutbah Jumat disampaikan atas namanya di Baghdad setelah kematian Mushrif al-Dawla pada tahun 416 H, kemudian kembali kepada Jalal al-Dawla. Pada tahun 423 H, para pelayan Baghdad memanggilnya setelah mereka mengusir Jalal al-Dawla, dan dia menanggapi dengan surat yang hati-hati yang menetapkan lima ratus pelayan sebagai pendahuluan {cite:muntazam-ibn-al-jawzi j.8 hlm. 363, 405-406}. Ia bersumpah dengan Jalal al-Dawla pada bulan Rajab 429 H bahwa keduanya tidak akan melakukan apa pun untuk menyakiti satu sama lain. Para pelayan kemudian menyela khutbah Jumat yang disampaikan atas nama Jalal al-Dawla dan menyampaikannya atas namanya sendiri, lalu mereka kembali dan menyampaikannya lagi atas namanya sendiri {kutip:muntazam-ibn-al-jawzi j.8 hlm. 433, 438}. Ia memasuki Hamadan pada tahun 433 H dan mengusir Ghuzz dari sana. Ia memasuki Baghdad pada tahun 436 H dan memperkenalkan pemukulan gendang selama lima shalat harian. Sebelumnya, gendang hanya dipukul tiga kali untuk raja-raja di Baghdad, tetapi untuk Adud al-Dawla, ia menjadikannya lima kali. Ia meninggal pada bulan Ramadhan 440 H pada usia empat puluh tahun dan beberapa bulan setelah disembelih tiga kali. Para pelayannya menjarah harta bendanya, dan para pelayan wanitanya membakar tenda-tenda saat ia terbaring di dalamnya. Putranya, Abu Nasr, yang dijuluki al-Malik al-Rahim (Raja yang Maha Penyayang), menggantikannya. Ia lahir di Basra pada bulan Syawal 399 H dan memerintah Irak selama empat tahun dua bulan."
