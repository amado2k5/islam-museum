died: { edtf: "1048~", hijri: "0440", calendar: julian, precision: year, status: tradition, derived: true, note: "مات بطريق كرمان سنة أربعين وأربعمائة، وهجم عليه في يوم ثلاث مرات وكان معه نحو أربعة آلاف من الترك والديلم فنُهبت خزائنه وحريمه وجواريه، وطلبوا شيراز فسلطنوا ابنه الملك الرحيم؛ وكانت مدته أربع سنين {cite:shadharat-dhahab p. 263}." }
