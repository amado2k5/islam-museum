id: person/abu-kalijar
class: person
label: { ar: "الملك أبو كاليجار بن سلطان الدولة" }
summary:
  ar: "الملك أبو كاليجار بن سلطان الدولة بن بهاء الدولة بن عضد الدولة، كان وليّ عهد أبيه؛ لما مات السلطان شرف الدولة سنة ست عشرة وأربعمائة عدل الجند إليه ونوّهوا باسمه فخُطب له ببغداد {cite:shadharat-dhahab p. 204}. وعند ابن الجوزي خُطب له ببغداد بعد موت مشرف الدولة سنة ٤١٦ ثم عادت الخطبة لجلال الدولة؛ وفي سنة ٤٢٣ دعاه غلمان بغداد بعد طردهم جلال الدولة فأجاب بكتاب حذر يشترط خمسمائة غلام مقدمة {cite:muntazam-ibn-al-jawzi j.8 p.363, 405-406}. وحلف مع جلال الدولة في رجب ٤٢٩ ألا يجري من أحدهما ما يؤذي الآخر، وقطع الغلمان خطبة جلال الدولة فخطبوا له ثم عادوا فخطبوا له {cite:muntazam-ibn-al-jawzi j.8 p.433,438}. دخل همذان سنة ٤٣٣ ودفع الغز عنها، ودخل بغداد سنة ٤٣٦ وأحدث ضرب الطبل في الصلوات الخمس ولم يكن يُضرب للملوك ببغداد إلا ثلاث نوب لعضد الدولة فجعلها خمسًا {cite:muntazam-ibn-al-jawzi j.8 p.450,461}. توفي في رمضان ٤٤٠ عن أربعين سنة وأشهر بعد فصد ثلاث مرات، فانتهب الغلمان خزائنه وأحرقت جواريه الخيام وهو فيها مسجّى، وولي بعده ابنه أبو نصر الملقب الملك الرحيم، وكان قد وُلد بالبصرة في شوال ٣٩٩ وولي العراق أربع سنين وشهرين {cite:muntazam-ibn-al-jawzi j.8 p.478-479,481}."
  en: "Al-Malik Abu Kalijar b. Sultan al-Dawla — his father's designated heir; when Sultan Sharaf al-Dawla died in 416 the army went over to him and proclaimed his name, and he was given the khutba at Baghdad {cite:shadharat-dhahab p. 204}."
