  ar: "الملك أبو كاليجار بن سلطان الدولة بن بهاء الدولة بن عضد الدولة، كان وليّ عهد أبيه؛ لما مات السلطان شرف الدولة سنة ست عشرة وأربعمائة عدل الجند إليه ونوّهوا باسمه فخُطب له ببغداد {cite:shadharat-dhahab p. 204}."
  en: "Al-Malik Abu Kalijar b. Sultan al-Dawla — his father's designated heir; when Sultan Sharaf al-Dawla died in 416 the army went over to him and proclaimed his name, and he was given the khutba at Baghdad {cite:shadharat-dhahab p. 204}."
