summary:
  ar: "بشير الطبري، سكن الشام، مُحِبٌّ مُمتحَن مُستسلم لما ابتُلي به، وأشهر ما يُروى عنه أنه أعتق عبيده حين أغارت الروم على جواميسه، وقال لابنه إن الله اختبره فأحب أن يزيده."
  en: "Bishr al-Tabari, who lived in Syria, a lover of God who was tested and submitted to what he was tried with; best known is the story that he freed his servants when the Byzantines raided his buffalo, telling his son that God had tested him and he wished to increase his reward."
  ur: "بشیر طبری شام میں رہتے تھے، اللہ کے محب تھے جو آزمائے گئے اور جو آزمائش آئی اس پر راضی رہے۔ مشہور واقعہ یہ ہے کہ رومیوں نے ان کی بھینسوں پر حملہ کیا تو انہوں نے اپنے غلاموں کو آزاد کر دیا، اور بیٹے سے کہا کہ اللہ نے انہیں آزمایا اور وہ اس کا اجر بڑھانا چاہتے تھے۔"
