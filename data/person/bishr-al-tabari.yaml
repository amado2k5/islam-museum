summary:
  ar: "بشير الطبري، سكن الشام، مُحِبٌّ مُمتحَن مُستسلم لما ابتُلي به، وأشهر ما يُروى عنه أنه أعتق عبيده حين أغارت الروم على جواميسه، وقال لابنه إن الله اختبره فأحب أن يزيده."
  en: "Bishr al-Tabari, who lived in Syria, a lover of God who was tested and submitted to what he was tried with; best known is the story that he freed his servants when the Byzantines raided his buffalo, telling his son that God had tested him and he wished to increase his reward."
  ur: "بشیر طبری شام میں رہتے تھے، اللہ کے محب تھے جو آزمائے گئے اور جو آزمائش آئی اس پر راضی رہے۔ مشہور واقعہ یہ ہے کہ رومیوں نے ان کی بھینسوں پر حملہ کیا تو انہوں نے اپنے غلاموں کو آزاد کر دیا، اور بیٹے سے کہا کہ اللہ نے انہیں آزمایا اور وہ اس کا اجر بڑھانا چاہتے تھے۔"
  es: "Bishr al-Tabari, que vivió en Siria, un amante de Dios que fue puesto a prueba y se sometió a la prueba; la historia más conocida es la de cuando liberó a sus sirvientes cuando los bizantinos asaltaron su búfalo, diciéndole a su hijo que Dios lo había puesto a prueba y que deseaba aumentar su recompensa."
  fr: "Bishr al-Tabari, qui vivait en Syrie, était un homme pieux qui a été mis à l'épreuve et s'est soumis à ce qui lui était imposé; l'histoire la plus connue est celle où il affranchit ses serviteurs lorsque les Byzantins pillèrent son troupeau de buffles, disant à son fils que Dieu l'avait mis à l'épreuve et qu'il souhaitait accroître sa récompense."
  tr: "Levant'ta yaşayan Bashir al-Tabari, bir aşıktı ve yaşadıklarını sınadı ve teslim oldu. En ünlüsü, Romalılar mandalarını yağmaladığında kölelerini özgür bırakması ve oğluna Tanrı'nın onu sınadığını ve yükseltmek istediğini söylemesidir."
  id: "Bashir al-Tabari, yang tinggal di Levant, adalah seorang kekasih dan diuji serta menyerah pada apa yang ia alami. Yang paling terkenal adalah ia membebaskan budaknya ketika Romawi menyerang kerbaunya, dan memberitahu putranya bahwa Tuhan telah mengujinya dan ingin memperbesar kemampuannya."
