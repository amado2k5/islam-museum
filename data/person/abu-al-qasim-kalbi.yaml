id: person/abu-al-qasim-kalbi
class: person
label: { ar: "أبو القاسم الكلبي", en: "Abu al-Qasim al-Kalbi", fr: "Abu al-Qasim al-Kalbi", es: "Abu al-Qasim al-Kalbi", ur: "ابو القاسم الکلبی" }
summary:
  ar: "أمير صقلية عن الفاطميين؛ سار سنة 373هـ في عساكر المسلمين ومعه جماعة من الصالحين والعلماء فنازل مدينة مسينى في رمضان فهرب العدو عنها وحصر كسنته حتى طلب أهلها الأمان وأخذ منهم مالاً ورحل إلى قلعة جلو ففعل بها كذلك وأمر أخاه القاسم أن يذهب بالأسطول إلى ناحية بربولة وبث السرايا في جميع قلورية، وفي سنة 366 كان قد أمر بعمارة رمطلة وكانت خربة وعاود الغزو فنازل قلعة أغائة ومدينة طارئت فهدمها وأحرقت وبلغت سراياه الرقة وغيرها ونزل على مدينة مرليته فبذل أهلها المال وصالحهم {cite:kamil-ibn-al-athir p. 489-490}."
  en: "The Kalbid amir of Sicily; in 373 he led the Muslim host with scholars and ascetics through Messina and the Calabrian fortresses — Casenta, Gallo, Taranto — taking tribute and spoils, and had earlier rebuilt Rametta and raided to the Straits {cite:kamil-ibn-al-athir p. 489-490}."
  fr: "L'émir kalbite de Sicile ; en 373, il mena l'armée musulmane, avec des savants et des ascètes, à travers Messine et les forteresses de Calabre — Casenta, Gallo, Tarente —, prenant tribut et butin, et il avait auparavant rebâti Rametta et lancé des raids jusqu'au détroit {cite:kamil-ibn-al-athir p. 489-490}."
  es: "El emir Kalbid de Sicilia; en 373 dirigió al ejército musulmán con eruditos y ascetas a través de Messina y las fortalezas calabresas — Casenta, Gallo, Taranto — tomando tributo y botín, y anteriormente había reconstruido Rametta y realizado incursiones hasta los estrechos {cite:kamil-ibn-al-athir p. 489-490}."
  ur: "سسلی کے کالبیڈ امیر؛ 373 میں اس نے میسینا اور کیلبرین قلعوں - کیسینٹا، گیلو، ترانٹو - کے ذریعے علماء اور سنیاسیوں کے ساتھ مسلم میزبان کی قیادت کی - خراج تحسین اور مال غنیمت لے کر، اور اس سے قبل رامیٹا کو دوبارہ تعمیر کیا اور آبنائے پر چھاپہ مارا۔ 489-490}۔"
  tr: "Fatımiler adına Sicilya Emiri; Hicri 373 yılında Müslüman ordusuyla ve yanında bir grup dindar adam ve âlimle birlikte yürüdü. Ramazan ayında Messina şehrini kuşattı, böylece düşman şehirden kaçtı. Önceki yılda yaptığı gibi şehri kuşattı, ta ki halkı güvenli geçiş isteyene kadar ve onlardan para aldı. Sonra Gelu kalesine gitti ve aynı şeyi orada da yaptı. Kardeşi el-Kasım'a filoyu Barbula bölgesine götürmesini emretti ve Calabria'nın her yerine akıncı birlikler gönderdi. Hicri 366 yılında, harabe halindeki Ramtella'nın yeniden inşasını emretti. Fetihlere devam etti ve Ağa kalesini ve Tarit şehrini kuşattı, böylece yıktı ve yaktı. Akıncı birlikleri Rakka ve diğer yerlere ulaştı. Marlitah şehrinde kamp kurdu, bunun üzerine halkı para teklif etti ve onlarla barıştı. {cite:kamil-ibn-al-athir s. 489-490}."
  id: "Emir Sisilia atas nama Dinasti Fatimiyah; ia berbaris pada tahun 373 H dengan pasukan Muslim dan bersamanya sekelompok orang saleh dan ulama. Ia mengepung kota Messina di bulan Ramadan, sehingga musuh melarikan diri darinya. Ia mengepungnya seperti yang telah dilakukannya pada tahun sebelumnya hingga penduduknya meminta jalan aman, dan ia mengambil uang dari mereka. Kemudian ia pergi ke benteng Gelu dan melakukan hal yang sama. Ia memerintahkan saudaranya, al-Qasim, untuk membawa armada ke wilayah Barbula dan mengirimkan pasukan penyerang ke seluruh Calabria. Pada tahun 366 H, ia memerintahkan pembangunan kembali Ramtella, yang telah hancur. Ia melanjutkan penaklukan dan mengepung benteng Agha dan kota Tarit, sehingga ia menghancurkan dan membakarnya. Pasukan penyerangnya mencapai Raqqa dan tempat-tempat lain. Ia berkemah di kota Marlitah, sehingga penduduknya menawarkan uang dan berdamai dengannya. {cite:kamil-ibn-al-athir p. 489-490}."
