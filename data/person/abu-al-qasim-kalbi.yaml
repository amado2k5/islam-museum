label: { ar: "أبو القاسم الكلبي" }
summary:
  ar: "أمير صقلية عن الفاطميين؛ سار سنة 373هـ في عساكر المسلمين ومعه جماعة من الصالحين والعلماء فنازل مدينة مسينى في رمضان فهرب العدو عنها وحصر كسنته حتى طلب أهلها الأمان وأخذ منهم مالاً ورحل إلى قلعة جلو ففعل بها كذلك وأمر أخاه القاسم أن يذهب بالأسطول إلى ناحية بربولة وبث السرايا في جميع قلورية، وفي سنة 366 كان قد أمر بعمارة رمطلة وكانت خربة وعاود الغزو فنازل قلعة أغائة ومدينة طارئت فهدمها وأحرقت وبلغت سراياه الرقة وغيرها ونزل على مدينة مرليته فبذل أهلها المال وصالحهم {cite:kamil-ibn-al-athir p. 489-490}."
  en: "The Kalbid amir of Sicily; in 373 he led the Muslim host with scholars and ascetics through Messina and the Calabrian fortresses — Casenta, Gallo, Taranto — taking tribute and spoils, and had earlier rebuilt Rametta and raided to the Straits {cite:kamil-ibn-al-athir p. 489-490}."
