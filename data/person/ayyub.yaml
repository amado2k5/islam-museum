summary:
  ar: "النبي المبتلى بالصبر. عند البخاري أنه اغتسل عرياناً فخرّ عليه جراد من ذهب فجعل يحثي في ثوبه فناداه ربه ألم أكن أغنيتك عما ترى، قال بلى وعزتك ولكن لا غنى بي عن بركتك {cite:sahih-al-bukhari 279}."
  en: "The prophet of patience: bathing unclothed when golden locusts rained on him, he answered his Lord 'yes, by Your might, but I cannot do without Your blessing' {cite:sahih-al-bukhari 279}."
