summary:
  ar: "أحمد بن لطف الله، الشهير بلقبه منجم باشي، أي رئيس المنجّمين (1631 – 28 شباط 1702)، مؤرخ وفلكي وشاعر صوفي عثماني من سلانيك. تربّى في التكايا المولوية، خمس عشرة سنة في مولوية قاسم باشا بإسطنبول، وصار منجّمًا باشيًا سنة 1668 ومصاحبًا للسلطان محمد الرابع، ثم نُفي إلى مصر سنة 1687 وانتهى شيخًا لمولوية مكة. كتابه «جامع الدول» تاريخ عام كتبه بالعربية واشتهر بترجمته التركية «صحائف الأخبار»، وهو مصدر فريد لأخبار دويلات ما وراء القفقاس المسلمة."
  en: "Ahmed ibn Lütfullah, known by his court title Müneccimbaşı, 'Chief Astrologer' (1631 – 28 February 1702), was an Ottoman historian, astronomer and Sufi poet from Salonica. Formed in the Mevlevi lodges — fifteen years at the Kasımpaşa lodge in Istanbul — he became chief court astrologer in 1668 and an imperial companion of Mehmed IV, was exiled to Egypt in 1687, and ended as sheikh of the Mevlevi lodge of Mecca. His Jami' al-Duwal, a world history written in Arabic and best known in its Turkish rendering Saha'if al-Akhbar, is a unique source for the minor Muslim dynasties of Transcaucasia."
  ur: "احمد بن لطف اللہ، اپنے عہدی لقب منجم باشی یعنی رئیسِ منجمین سے مشہور (1631ء – 28 فروری 1702ء)، سلانیک سے تعلق رکھنے والے عثمانی مؤرخ، ماہرِ فلکیات اور صوفی شاعر تھے۔ مولوی خانقاہوں میں تربیت پائی، استنبول کی قاسم پاشا مولوی خانقاہ میں پندرہ برس رہے، 1668ء میں منجم باشی اور محمد رابع کے مصاحب بنے، 1687ء میں مصر جلاوطن ہوئے اور آخر میں مکہ کی مولوی خانقاہ کے شیخ بنے۔ ان کی «جامع الدول» عربی میں لکھی گئی عالمی تاریخ ہے جو اپنے ترکی ترجمے «صحائف الاخبار» سے مشہور ہوئی۔"

