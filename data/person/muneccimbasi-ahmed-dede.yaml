faith:
  - value: sufi
    basis: documented
    note: >-
      Mevlevi affiliation is attested for the man himself in three
      independent texts. The Turkish article states that he formally
      affiliated himself (intisap) to Sheikh Mehmed Efendi of the
      Salonica Mevlevi lodge and thereby became a Mevlevi, later
      spending fifteen years in discipleship under Halil Efendi at
      the Kasımpaşa Mevlevihanesi and ending as sheikh of the Mecca
      Mevlevihanesi. The English article independently gives the
      fifteen years at the Kasımpaşa Mevlevi lodge under Sheikh
      Halil Dede and his later sheikhdom of the Mevlevi lodge of
      Mecca, and calls him a Sufi poet whose diwan, written under
      the pen name Âşık, treats mystical themes. The Arabic article
      names him al-Mawlawi, the Mevlevi, and likewise gives his
      sheikhdom of the order's Mecca zawiya. Attested order
      membership and completed discipleship settle sufi at basis
      documented under the founder's rules, on the Neşâtî precedent.
      No text names a legal school for him, and none is recorded.
    sources: [source/wikipedia-muneccimbasi-ahmed-dede-tr, source/wikipedia-muneccimbasi-ahmed-dede-en, source/wikipedia-muneccimbasi-ahmed-dede-ar]

