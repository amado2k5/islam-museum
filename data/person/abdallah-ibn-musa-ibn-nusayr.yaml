  ar: "عند البلاذري: ابن موسى بن نصير فاتح المغرب اتّهم بقتل يزيد بن أبي مسلم وتأليب الناس عليه فضرب بشر بن صفوان الكلبي عنقه."
  en: "In al-Baladhuri: son of Musa ibn Nusayr the Maghreb's conqueror; accused of killing Yazid ibn Abi Muslim and stirring the people against him — Bishr ibn Safwan al-Kalbi struck off his neck."
  fr: "Chez al-Baladhuri : fils de Musa ibn Nusayr, le conquérant du Maghreb ; accusé d'avoir tué Yazid ibn Abi Muslim et d'avoir soulevé les gens contre lui — Bishr ibn Safwan al-Kalbi lui fit trancher le cou."
  es: "En al-Baladhuri: hijo de Musa ibn Nusayr, el conquistador del Magreb; acusado de matar a Yazid ibn Abi Muslim e incitar al pueblo contra él, Bishr ibn Safwan al-Kalbi le cortó el cuello."
  ur: "البلادوری میں ہے: موسیٰ بن نصیر کا بیٹا مغرب کے فاتح؛ یزید بن ابی مسلم کو قتل کرنے اور اس کے خلاف لوگوں کو اکسانے کا الزام - بشر بن صفوان الکلبی نے اس کی گردن مار دی۔"
