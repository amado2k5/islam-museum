summary:
  ar: "منشد ومغنّي آر أند بي لبناني الأصل سويدي الجنسية، وُلد في طرابلس بلبنان سنة 1981، ونشأ في السويد وعمل منتجا موسيقيا فيها وفي نيويورك، قبل أن يتجه إلى الغناء الديني المعاصر، فحقق ألبومه الأول «شكرا يا الله» ⁦(Thank You Allah، 2009)⁩ انتشارا عالميا عبر الإنترنت، وتلته ألبومات «سامحني» (2012) و«واحد» (2016) و«العودة إليك» (2026)."
  en: "Lebanese-Swedish nasheed and R&B singer, born in Tripoli, Lebanon in 1981. Raised in Sweden, he worked as a music producer there and in New York before turning to contemporary Islamic singing; his debut album Thank You Allah (2009) reached a worldwide audience online, followed by Forgive Me (2012), One (2016) and Back To You (2026)."
  ur: "لبنانی نژاد سویڈش نعت خواں اور گلوکار، جو 1981 میں طرابلس، لبنان میں پیدا ہوئے۔ وہ سویڈن میں پلے بڑھے اور بطور پروڈیوسر کام کرنے کے بعد اسلامی گائیکی کی طرف آئے؛ ان کا پہلا البم «Thank You Allah» (2009) انٹرنیٹ کے ذریعے دنیا بھر میں پھیل گیا۔"
  es: "Cantante libanés-sueco de nasheed y R&B, nacido en Trípoli, Líbano, en 1981. Criado en Suecia, trabajó como productor musical allí y en Nueva York antes de dedicarse al canto islámico contemporáneo; su álbum debut Thank You Allah (2009) alcanzó una audiencia mundial en línea, seguido de Forgive Me (2012), One (2016) y Back To You (2026)."
  fr: "Chanteur libano-suédois de nasheed et de R&B, né à Tripoli, au Liban, en 1981. Élevé en Suède, il a travaillé comme producteur de musique là-bas et à New York avant de se tourner vers le chant islamique contemporain; son premier album Thank You Allah (2009) a atteint un public mondial en ligne, suivi de Forgive Me (2012), One (2016) et Back To You (2026)."
  tr: "Lübnan doğumlu İsveçli bir R&B şarkıcısı olan Sher, 1981 yılında Lübnan'ın Trablus'u şehrinde doğdu. İsveç'te büyüdü ve orada ve New York'ta müzik yapımcısı olarak çalıştıktan sonra çağdaş dini şarkıcılığa yöneldi. İlk albümü \"Thank You Allah\" (2009) çevrimiçi olarak dünya çapında popülerlik kazandı, ardından \"Forgive Me\" (2012), \"One\" (2016) ve \"Return to You\" (2026) albümleri geldi."
  id: "Penyanyi R&B Swedia kelahiran Lebanon, ia lahir di Tripoli, Lebanon pada tahun 1981. Ia tumbuh besar di Swedia dan bekerja sebagai produser musik di sana serta di New York sebelum beralih ke menyanyi religius kontemporer. Album pertamanya \"Thank You Allah\" (2009) meraih popularitas dunia secara online, diikuti oleh album \"Forgive Me\" (2012), \"One\" (2016), dan \"Return to You\" (2026)."
