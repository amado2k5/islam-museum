summary:
  ar: "منشد ومغنّي آر أند بي لبناني الأصل سويدي الجنسية، وُلد في طرابلس بلبنان سنة 1981، ونشأ في السويد وعمل منتجا موسيقيا فيها وفي نيويورك، قبل أن يتجه إلى الغناء الديني المعاصر، فحقق ألبومه الأول «شكرا يا الله» (Thank You Allah، 2009) انتشارا عالميا عبر الإنترنت، وتلته ألبومات «سامحني» (2012) و«واحد» (2016) و«العودة إليك» (2026)."
  en: "Lebanese-Swedish nasheed and R&B singer, born in Tripoli, Lebanon in 1981. Raised in Sweden, he worked as a music producer there and in New York before turning to contemporary Islamic singing; his debut album Thank You Allah (2009) reached a worldwide audience online, followed by Forgive Me (2012), One (2016) and Back To You (2026)."
  ur: "لبنانی نژاد سویڈش نعت خواں اور گلوکار، جو 1981 میں طرابلس، لبنان میں پیدا ہوئے۔ وہ سویڈن میں پلے بڑھے اور بطور پروڈیوسر کام کرنے کے بعد اسلامی گائیکی کی طرف آئے؛ ان کا پہلا البم «Thank You Allah» (2009) انٹرنیٹ کے ذریعے دنیا بھر میں پھیل گیا۔"
