summary:
  ar: "محمد أمين بن صدر الدين الشرواني، مفسر نسبته إلى شروان من نواحي بخارى، أقام بآمد وأقام مدة في الآستانة، وله حاشية على تفسير البيضاوي لم تكمل وتفسير سورة الفتح و«الفوائد الخاقانية» في ثلاثة وخمسين علما؛ توفي في ٣ ذي الحجة سنة ١٠٣٦هـ الموافق ١٥ أغسطس ١٦٢٧م."
  en: "Muhammad Amin ibn Sadr al-Din al-Shirwani, an exegete named for Shirwan, a district of Bukhara, who lived in Amid and for a time in al-Astana; al-Zirikli lists an unfinished gloss on al-Baydawi's commentary, a commentary on Surat al-Fath and «al-Fawa'id al-Khaqaniyya» in 53 sciences. He died on 3 Dhu al-Hijja 1036 AH, 15 August 1627 CE."
  es: "Muhammad Amin ibn Sadr al-Din al-Shirwani, un exegeta que recibió su nombre de Shirwan, un distrito de Bujará, vivió en Amid y durante un tiempo en al-Astana. Al-Zirikli menciona una glosa inconclusa sobre el comentario de al-Baydawi, un comentario sobre la Sura al-Fath y «al-Fawa'id al-Khaqaniyya» en 53 ciencias. Falleció el 3 de Dhu al-Hijjah de 1036 AH, el 15 de agosto de 1627 d. C."
  fr: "Muhammad Amin ibn Sadr al-Din al-Shirwani, exégète du nom de Shirwan, un quartier de Boukhara, vécut à Amid et un temps à al-Astana. Al-Zirikli mentionne une glose inachevée du commentaire d'al-Baydawi, un commentaire de la sourate al-Fath et « al-Fawa'id al-Khaqaniyya » en 53 sciences. Il mourut le 3 Dhu al-Hijja 1036 AH (15 août 1627)."
  ur: "محمد امین بن صدرالدین الشیروانی، بخارا کے ایک ضلع شیروان کے لیے ایک مفسر، جو امید میں اور کچھ عرصہ الاستانہ میں مقیم تھا۔ الزرکلی نے البیضاوی کی تفسیر، سورۃ الفتح کی تفسیر اور 53 علوم میں «الفوائد الخقانیہ» پر ایک نامکمل تالیف کی فہرست دی ہے۔ آپ کی وفات 3 ذی الحجہ 1036 ہجری بمطابق 15 اگست 1627 عیسوی کو ہوئی۔"
  tr: "Buhara'dan Şirvan'a atfedilen bir tefsir olan Muhammed Amin bin Sadr al-Din al-Sharwani, Amid'de ikamet etmiş ve bir süre İstanbul'da kalmıştır. El-Beydavi'nin tefsirine tamamlanmamış bir kenar tefsiri ile elli üç âlimde El-Feth suresi ve 'El-Fewa'id el-Hakaniyye' tefsirini yazmıştır; 3 Zulhicce 1036 Hicce'de, yani 15 Ağustos 1627'de vefat etmiştir."
  id: "Muhammad Amin ibn Sadr al-Din al-Sharwani, seorang tafsir yang dikaitkan dengan Shirwan dari wilayah Bukhara, tinggal di Amid dan tinggal untuk sementara waktu di Istanbul. Ia menulis komentar marginal atas tafsir al-Baydawi yang tidak selesai, serta tafsir Surah Al-Fath dan 'Al-Fawa'id al-Khaqaniyya' pada lima puluh tiga ulama; ia meninggal pada 3 Dhu al-Hijjah 1036 H, yang bertepatan dengan 15 Agustus 1627 M."
