summary:
  ar: "محمد أمين بن صدر الدين الشرواني، مفسر نسبته إلى شروان من نواحي بخارى، أقام بآمد وأقام مدة في الآستانة، وله حاشية على تفسير البيضاوي لم تكمل وتفسير سورة الفتح و«الفوائد الخاقانية» في ثلاثة وخمسين علما؛ توفي سنة ١٠٣٦هـ الموافقة ١٦٢٦م."
  en: "Muhammad Amin ibn Sadr al-Din al-Shirwani, an exegete named for Shirwan, a district of Bukhara, who lived in Amid and for a time in al-Astana; al-Zirikli lists an unfinished gloss on al-Baydawi's commentary, a commentary on Surat al-Fath and «al-Fawa'id al-Khaqaniyya» in 53 sciences. He died in 1036 AH, 1626 CE."
