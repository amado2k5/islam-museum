summary:
  ar: "العلامة الحافظ أبو الخطاب عمر بن الحسن، الظاهري المذهب؛ جال في مدن الأندلس والعدوة وحج في الكهولة وسمع بمصر من البوصيري وبالعراق مسند الإمام أحمد وبأصبهان معجم الطبراني وبنيسابور صحيح مسلم بعلو، وكان يقول إنه حفظ الصحيح كله؛ ضعفه جماعة وقال الذهبي ليس بالقوي وله دعاوى مدحضة، ونفق على الكامل فجعله شيخ دار الحديث بالقاهرة ثم انكشف حاله فأخذها منه وأهانه؛ ناظر الشيخ تاج الدين الكندي بدمشق فلامه على نسبه إلى دحية الكلبي لأن دحية ما أعقب بإجماع المحدثين؛ توفي بالقاهرة {cite:shadharat-dhahab p. 160-161}."
  en: "Ibn Dihya (~546–633) — the roving Andalusi hafiz who claimed to have memorized Sahih Muslim entire; showered by al-Kamil with Egypt's dar al-hadith then stripped and shamed when his standing collapsed; Ibn Unayn lampooned his claim to descent from Dihya al-Kalbi, who left no progeny; died at Cairo {cite:shadharat-dhahab p. 160-161}."
