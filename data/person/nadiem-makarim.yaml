summary:
  ar: "نديم مكارم ⁦(وُلد نديم أنور مكارم في 4 تموز 1984 في سنغافورة)⁩ رجل أعمال وسياسي إندونيسي، مؤسس غوجيك سنة 2010، أول شركة إندونيسية تتجاوز قيمتها عشرة مليارات دولار؛ درس في جامعة براون ونال ماجستير إدارة الأعمال من هارفارد، وتولى وزارة التعليم والثقافة ثم وزارة التعليم والثقافة والبحث والتكنولوجيا (2019–2024)، واعتُقل سنة 2025 في قضية شراء أجهزة كروم بوك وأُدين في 30 حزيران 2026 بحكم عشر سنوات، وقد نفى التهم وأعلن استئنافه."
  en: "Nadiem Makarim (born Nadiem Anwar Makarim on 4 July 1984 in Singapore) is an Indonesian businessman and politician, founder in 2010 of Gojek, Indonesia's first startup valued above ten billion dollars; he studied at Brown University and took his MBA at Harvard, served as minister of education and culture and then of education, culture, research and technology (2019-2024), was arrested in 2025 in the Chromebook procurement case, and on 30 June 2026 was convicted and sentenced to ten years, a verdict he denied and said he would appeal."
  ur: "ندیم مکارم ⁦(پیدائش ندیم انور مکارم، 4 جولائی 1984، سنگاپور)⁩ انڈونیشیائی کاروباری و سیاست دان ہیں، 2010 میں گوجیک کے بانی، جو انڈونیشیا کی پہلی دس ارب ڈالر سے زائد مالیت کی اسٹارٹ اپ کمپنی بنی؛ انھوں نے براؤن یونیورسٹی سے تعلیم حاصل کی اور ہارورڈ سے ایم بی اے کیا، وزیر تعلیم و ثقافت اور پھر وزیر تعلیم، ثقافت، تحقیق و ٹیکنالوجی (2019–2024) رہے، 2025 میں کروم بک خریداری مقدمے میں گرفتار ہوئے اور 30 جون 2026 کو دس سال قید کی سزا پائی، جس سے انھوں نے انکار کیا اور اپیل کا اعلان کیا۔"
  es: "Nadiem Makarim (nacido como Nadiem Anwar Makarim el 4 de julio de 1984 en Singapur) es un empresario y político indonesio, fundador en 2010 de Gojek, la primera empresa emergente de Indonesia valorada en más de diez mil millones de dólares; estudió en la Universidad de Brown y obtuvo su MBA en Harvard, se desempeñó como ministro de educación y cultura y luego de educación, cultura, investigación y tecnología (2019-2024), fue arrestado en 2025 en el caso de adquisición de Chromebooks, y el 30 de junio de 2026 fue declarado culpable y sentenciado a diez años, un veredicto que negó y dijo que apelaría."
  fr: "Nadiem Makarim (né Nadiem Anwar Makarim le 4 juillet 1984 à Singapour) est un homme d'affaires et homme politique indonésien, fondateur en 2010 de Gojek, la première start-up indonésienne valorisée à plus de dix milliards de dollars; il a étudié à l'université Brown et obtenu son MBA à Harvard, a été ministre de l'Éducation et de la Culture puis ministre de l'Éducation, de la Culture, de la Recherche et de la Technologie (2019-2024), a été arrêté en 2025 dans l'affaire d'acquisition de Chromebooks, et le 30 juin 2026, a été reconnu coupable et condamné à dix ans de prison, un verdict qu'il a nié et pour lequel il a déclaré qu'il ferait appel."
  tr: "Nadim Makarem (doğum adıyla Nadim Anwar Makarem, 4 Temmuz 1984, Singapur) Endonezyalı bir iş insanı ve siyasetçidir. 2010 yılında Gojik'i kurdu; bu, on milyar doların üzerinde değer elde eden ilk Endonezya şirketidir. Brown Üniversitesi'nde eğitim gördü ve Harvard'dan MBA derecesi aldı. Eğitim ve Kültür Bakanı, ardından Eğitim, Kültür, Araştırma ve Teknoloji Bakanı (2019–2024) olarak görev yaptı. 2025 yılında Chromebook alımıyla ilgili bir davada tutuklandı ve 30 Haziran 2026'da on yıl hapis cezasına çarptırıldı. Suçlamaları reddetti ve temyiz başvurusunu açıkladı."
  id: "Nadim Makarem (lahir dengan nama Nadim Anwar Makarem pada 4 Juli 1984 di Singapura) adalah seorang pengusaha dan politisi Indonesia. Ia mendirikan Gojik pada tahun 2010, perusahaan Indonesia pertama yang bernilai lebih dari sepuluh miliar dolar. Ia belajar di Universitas Brown dan meraih gelar MBA dari Harvard. Ia menjabat sebagai Menteri Pendidikan dan Kebudayaan, kemudian Menteri Pendidikan, Kebudayaan, Riset, dan Teknologi (2019–2024). Ia ditangkap pada tahun 2025 dalam kasus pembelian Chromebook dan dijatuhi hukuman sepuluh tahun pada 30 Juni 2026. Ia membantah tuduhan tersebut dan mengumumkan bandingnya."
