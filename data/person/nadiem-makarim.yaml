summary:
  ar: "نديم مكارم (وُلد نديم أنور مكارم في 4 تموز 1984 في سنغافورة) رجل أعمال وسياسي إندونيسي، مؤسس غوجيك سنة 2010، أول شركة إندونيسية تتجاوز قيمتها عشرة مليارات دولار؛ درس في جامعة براون ونال ماجستير إدارة الأعمال من هارفارد، وتولى وزارة التعليم والثقافة ثم وزارة التعليم والثقافة والبحث والتكنولوجيا (2019–2024)، واعتُقل سنة 2025 في قضية شراء أجهزة كروم بوك وأُدين في 30 حزيران 2026 بحكم عشر سنوات، وقد نفى التهم وأعلن استئنافه."
  en: "Nadiem Makarim (born Nadiem Anwar Makarim on 4 July 1984 in Singapore) is an Indonesian businessman and politician, founder in 2010 of Gojek, Indonesia's first startup valued above ten billion dollars; he studied at Brown University and took his MBA at Harvard, served as minister of education and culture and then of education, culture, research and technology (2019-2024), was arrested in 2025 in the Chromebook procurement case, and on 30 June 2026 was convicted and sentenced to ten years, a verdict he denied and said he would appeal."
  ur: "ندیم مکارم (پیدائش ندیم انور مکارم، 4 جولائی 1984، سنگاپور) انڈونیشیائی کاروباری و سیاست دان ہیں، 2010 میں گوجیک کے بانی، جو انڈونیشیا کی پہلی دس ارب ڈالر سے زائد مالیت کی اسٹارٹ اپ کمپنی بنی؛ انھوں نے براؤن یونیورسٹی سے تعلیم حاصل کی اور ہارورڈ سے ایم بی اے کیا، وزیر تعلیم و ثقافت اور پھر وزیر تعلیم، ثقافت، تحقیق و ٹیکنالوجی (2019–2024) رہے، 2025 میں کروم بک خریداری مقدمے میں گرفتار ہوئے اور 30 جون 2026 کو دس سال قید کی سزا پائی، جس سے انھوں نے انکار کیا اور اپیل کا اعلان کیا۔"
