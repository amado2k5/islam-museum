summary:
  ar: "أحمد بن محمود بن أبي بكر، نور الدين الصابوني البخاري، من علماء الكلام من الحنفية، مولده ووفاته في بخارى سنة 580 هـ، صاحب الكفاية في الهداية المسماة عقيدة الصابوني ومختصرها البداية من الكفاية."
  en: "Ahmad ibn Mahmud ibn Abi Bakr, Nur al-Din al-Sabuni al-Bukhari, a Hanafi scholar of kalam born and dead in Bukhara in 580 AH (1184); author of al-Kifaya fi l-Hidaya, called the Creed of al-Sabuni, and of its abridgement al-Bidaya min al-Kifaya."
  es: "Ahmad ibn Mahmud ibn Abi Bakr, Nur al-Din al-Sabuni al-Bukhari, un erudito hanafí de kalam nacido y muerto en Bukhara en 580 d.H. (1184); autor de al-Kifaya fi l-Hidaya, llamado Credo de al-Sabuni, y de su compendio al-Bidaya min al-Kifaya."
  fr: "Ahmad ibn Mahmud ibn Abi Bakr, Nur al-Din al-Sabuni al-Bukhari, un érudit Hanafi du kalam né et mort à Boukhara en 580 AH (1184); auteur d'al-Kifaya fi l-Hidaya, appelé le Credo d'al-Sabuni, et de son abrégé al-Bidaya min al-Kifaya."
  ur: "احمد بن محمود ابن ابی بکر، نورالدین الصابونی البخاری، بخارا میں 580 ہجری (1184) میں پیدا ہوئے اور وفات پانے والے کلام کے حنفی عالم؛ الکفایہ فی الہدایہ کا مصنف، جسے الصابونی کا عقیدہ کہا جاتا ہے، اور اس کا خلاصہ البدایہ من الکفایہ ہے۔"
  tr: "Ahmed ibn Mahmud ibn Ebi Bekir, Nur al-Din el-Sabuni el-Buhari, Hanefilerden bir teoloji âlimiydi; 580 H yılında Buhara'da doğup ölmüştür. El-Kifayah fi al-Hidayah adlı 'Akidah el-Sabuni'yi yazmıştır ve kısaltması el-Bidaya min el-Kifayah'dır."
  id: "Ahmad ibn Mahmoud ibn Abi Bakr, Nur al-Din al-Sabuni al-Bukhari, adalah seorang ulama teologi dari Hanafi, lahir dan meninggal di Bukhara pada tahun 580 H. Ia menulis al-Kifayah fi al-Hidayah yang disebut 'Aqidah al-Sabuni, dan singkatannya adalah al-Bidaya min al-Kifayah."
