label: { ar: "حبشة بن داهر", en: "Habsha ibn Dahir", es: "Habsha ibn Dahir", fr: "Habsha ibn Dahir", ur: "حبشہ بن دہر" }
summary:
  ar: "حبشة بن داهر؛ رجع إلى برهمباذ ملكاً حين قتل أبوه ثم كتب إليه عمر بن عبد العزيز مع ملوك الهند يدعوهم إلى الإسلام والطاعة على أن يملكهم فأسلم هو والملوك وتسموا بأسماء العرب."
  en: "Habsha ibn Dahir; restored to Brahmanabadh after his father's death, he answered Umar ibn Abd al-Aziz's letter — Islam for kept kingship — and he and the kings converted, taking Arab names."
  es: "Habsha ibn Dahir, restituido en Brahmanabad tras la muerte de su padre, respondió a la carta de Umar ibn Abd al-Aziz —el Islam para la realeza conservada— y él y los reyes se convirtieron, adoptando nombres árabes."
  fr: "Habsha ibn Dahir; rétabli à Brahmanabadh après la mort de son père, il répondit à la lettre d'Umar ibn Abd al-Aziz — Islam pour conserver la royauté — et lui et les rois se convertirent, prenant des noms arabes."
  ur: "حبشہ بن دہر؛ اپنے والد کی وفات کے بعد برہمن آباد میں بحال ہوئے، اس نے عمر بن عبدالعزیز کے خط کا جواب دیا - اسلام برائے بادشاہت - اور اس نے اور بادشاہوں نے عرب نام لے کر مذہب تبدیل کیا۔"
  tr: "Habeşistan bin Dahir; babası öldürüldüğünde kral olarak Brahmbadh'a döndü. Sonra Ömer bin Abdülaziz, Hindistan krallarıyla birlikte ona yazdı; onları İslam'a ve itaata davet etti, ancak onları yönetmesi şartıyla kabul etti. O ve krallar İslam'ı benimsediler ve Arapların adını aldılar."
  id: "Abyssinia ibn Dahir; ia kembali ke Brahmbadh sebagai raja ketika ayahnya dibunuh. Kemudian Umar ibn Abd al-Aziz menulis surat kepadanya bersama para raja India, mengundang mereka ke Islam dan taat dengan syarat ia memerintah mereka. Ia dan para raja memeluk Islam dan dinamai menurut bangsa Arab."
