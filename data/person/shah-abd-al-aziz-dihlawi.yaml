id: person/shah-abd-al-aziz-dihlawi
class: person
label: { ar: "شاه عبد العزيز الدهلوي", en: "Shah Abd al-Aziz al-Dihlawi", ur: "شاہ عبدالعزیز دہلوی", es: "Shah Abd al-Aziz al-Dihlawi", fr: "Shah Abd al-Aziz al-Dihlawi" }
summary:
  ar: "عالم هندي، الابن الأكبر للشاه ولي الله الدهلوي، وُلد في دلهي سنة 1159هـ / 1746م وتوفي فيها سنة 1239هـ / 1824م، وألّف كتباً بالعربية والفارسية في العقيدة والحديث والفتاوى، منها «تحفة اثني عشرية». {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
  en: "Indian theologian, eldest son of Shah Wali Allah al-Dihlawi. He was born in Delhi in 1159/1746 and died there in 1239/1824. He taught at the Madrasa Rahimiyya after his father's death in 1176/1762. His works in Arabic and Persian cover creed, hadith and law, and include the Persian Tuhfa Ithna 'Ashariyya, which the entry describes as a refutation of Shi'i doctrine. {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
  ur: "ہندوستان کے عالم، شاہ ولی اللہ دہلوی کے بڑے بیٹے، جو 1159/1746 میں دہلی میں پیدا ہوئے اور 1239/1824 میں وہیں وفات پائی۔ ان کی عربی اور فارسی تصانیف میں عقیدہ، حدیث اور فقہ شامل ہیں۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
  es: "Teólogo indio, hijo mayor de Shah Wali Allah al-Dihlawi. Nació en Delhi en 1159/1746 y falleció allí en 1239/1824. Tras la muerte de su padre en 1176/1762, impartió clases en la Madrasa Rahimiyya. Sus obras en árabe y persa abarcan el credo, el hadiz y la ley, e incluyen el Tuhfa Ithna 'Ashariyya en persa, que la entrada describe como una refutación de la doctrina chií. {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
  fr: "Théologien indien, fils aîné de Shah Wali Allah al-Dihlawi, il naquit à Delhi en 1159/1746 et y mourut en 1239/1824. Après la mort de son père en 1176/1762, il enseigna à la Madrasa Rahimiyya. Ses œuvres en arabe et en persan traitent de la religion, des hadiths et du droit, et comprennent le Tuhfa Ithna 'Ashariyya en persan, présenté comme une réfutation de la doctrine chiite. {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
  tr: "Hintli bir âlim olan Şah Veliullah Dehlawi'nin en büyük oğlu olan Şah, 1159 Hicri / 1746 yılında Delhi'de doğdu ve 1239 Hicri / 1824 yılında orada öldü. Arapça ve Farsça olarak inançlar, hadisler ve fetvalar üzerine kitaplar yazdı; bunlar arasında 'Tuhfat İthna Ashariyya' da vardı. {Kaynak: İslam Ansiklopedisi-2 cilt 1 s. 78}"
  id: "Seorang ulama India, putra sulung Shah Waliullah Dehlawi, ia lahir di Delhi pada tahun 1159 H / 1746 M dan meninggal di sana pada tahun 1239 H / 1824 M. Ia menulis buku dalam bahasa Arab dan Persia tentang kredo, hadits, dan fatwa, termasuk 'Tuhfat Ithna Ashariyya.' {cite:Encyclopaedia-of-Islam-2 vol. 1 hlm. 78}"
