id: person/shah-abd-al-aziz-dihlawi
class: person
label: { ar: "شاه عبد العزيز الدهلوي", en: "Shah Abd al-Aziz al-Dihlawi", ur: "شاہ عبدالعزیز دہلوی" }
summary:
  ar: "عالم هندي، الابن الأكبر للشاه ولي الله الدهلوي، وُلد في دلهي سنة 1159هـ / 1746م وتوفي فيها سنة 1239هـ / 1824م، وألّف كتباً بالعربية والفارسية في العقيدة والحديث والفتاوى، منها «تحفة اثني عشرية». {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
  en: "Indian theologian, eldest son of Shah Wali Allah al-Dihlawi. He was born in Delhi in 1159/1746 and died there in 1239/1824. He taught at the Madrasa Rahimiyya after his father's death in 1176/1762. His works in Arabic and Persian cover creed, hadith and law, and include the Persian Tuhfa Ithna 'Ashariyya, which the entry describes as a refutation of Shi'i doctrine. {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
  ur: "ہندوستان کے عالم، شاہ ولی اللہ دہلوی کے بڑے بیٹے، جو 1159/1746 میں دہلی میں پیدا ہوئے اور 1239/1824 میں وہیں وفات پائی۔ ان کی عربی اور فارسی تصانیف میں عقیدہ، حدیث اور فقہ شامل ہیں۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
