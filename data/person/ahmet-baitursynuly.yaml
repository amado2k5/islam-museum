summary:
  ar: "أحمد بايتورسينول (1872–1937)، لغوي وشاعر ومربٍّ كازاخي، أصلح الأبجدية العربية للغة الكازاخية، وشارك مع عليخان بوكيخانوف وميرجاقيب دولاتولي في تأسيس صحيفة «قازاق» سنة 1913 وفي قيادة حركة ألاش، وأُعدم رميًا بالرصاص في ألما آتا في التطهير الكبير سنة 1937."
  en: "Ahmet Baitursynuly (1872–1937) was a Kazakh linguist, poet and educator who reformed the Arabic-based alphabet for Kazakh, co-founded the newspaper Qazaq in 1913 with Alikhan Bukeikhanov and Mirjaqip Dulatuli, helped lead the Alash movement, and was shot at Alma-Ata in the Great Purge of 1937."
  ur: "احمد بایتورسینول (1872–1937) قازق ماہرِ لسانیات، شاعر اور معلم تھے جنہوں نے قازق زبان کے لیے عربی رسم الخط کی اصلاح کی، 1913 میں علی خان بوکیخانوف اور میر جاقیب دولاتولی کے ساتھ اخبار «قازق» کی بنیاد رکھی، علاش تحریک کی قیادت میں شریک رہے اور 1937 میں الما آتا میں گولی مار کر ہلاک کیے گئے۔"
