roles: [scholar]
summary:
  ar: "عاصم بن عمر بن قتادة الظفري الأنصاري، مدني كان جده قتادة من أهل بدر وروى أبوه عمر بن قتادة الأخبار عن أبيه وبلّغها ابنه عاصماً؛ قال فيه ابن سعد: «كان راوية للعلم، وله علم بالمغازي والسير، أمره عمر بن عبد العزيز أن يجلس في مسجد دمشق فيحدث الناس بالمغازي ومناقب الصحابة ففعل»؛ وأرّخ بعضهم موته بسنة ١٢٠ وبعضهم بسنة ١٢٩، وكان من المصادر التي اعتمد عليها ابن إسحاق والواقدي {cite:duha-islam p. 642-643}."
  en: "Asim ibn Umar ibn Qatada al-Zafari — Medinan Ansari whose grandfather fought at Badr; Umar II ordered him to teach maghazi in the Damascus mosque; a source for Ibn Ishaq and al-Waqidi {cite:duha-islam p. 642-643}."
  es: "Asim ibn Umar ibn Qatada al-Zafari - Medinan Ansari cuyo abuelo luchó en Badr; Umar II le ordenó enseñar maghazi en la mezquita de Damasco; una fuente para Ibn Ishaq y al-Waqidi {cita:duha-islam p. 642-643}."
  fr: "Asim ibn Umar ibn Qatada al-Zafari — Medinan Ansari dont le grand-père a combattu à Badr; Umar II lui ordonna d'enseigner le maghazi à la mosquée de Damas; une source pour Ibn Ishaq et al-Waqidi {cite:duha-islam p. 642-643}."
  ur: "عاصم بن عمر بن قتادہ الغفاری - مدین انصاری جن کے دادا نے بدر میں جنگ کی تھی۔ عمر ثانی نے اسے دمشق کی مسجد میں مغازی پڑھانے کا حکم دیا۔ ابن اسحاق اور الواقدی کے لیے ایک ماخذ 642-643}۔"
  tr: "Büyükbabası Katadah Bedr'den olan Medinalı Asim ibn Umar ibn Katadah el-Ektah el-Ensari, babası Ömer bin Katadah ise oğlu Asim'in aktardığı haberleri anlatmıştır; İbn Sad onun hakkında şöyle demiştir: \"O bir bilgi anlatıcısıydı ve seferler ile biyografiler hakkında bilgiye sahipti. Ömer bin Abdülaziz ona Şam camiyesinde oturup seferleri ve sahabelerin erdemlerini anlatmasını emretti ve o da bunu yaptı.\" Bazıları ölümünü 120 yılına, bazıları ise 129 yılına tarihlendirdi. Dayanılan kaynaklar arasında İbn İshaq ve el-Vaqidi de vardı {atıf:Duha-İslam, s. 642-643}."
  id: "Asim ibn Umar ibn Qatadah al-Dhafri al-Ansari, seorang Madinah yang kakeknya Qatadah berasal dari Badr, dan ayahnya Umar ibn Qatadah menceritakan laporan dari ayahnya, yang disampaikan oleh putranya Asim; Ibn Sa'd berkata tentangnya: \"Dia adalah narator pengetahuan, dan dia memiliki pengetahuan tentang ekspedisi dan biografi. Umar ibn Abd al-Aziz memerintahkannya duduk di masjid Damaskus dan menceritakan kepada orang-orang tentang kampanye dan kebajikan Para Sahabat, dan dia melakukannya.\" Beberapa mencatat kematiannya pada tahun 120, dan lainnya pada tahun 129. Di antara sumber yang dijadikan dasar adalah Ibn Ishaq dan al-Waqidi {cite:Duha-Islam, hlm. 642-643}."
died: { edtf: "0738", hijri: "0120", calendar: julian, precision: year, status: debated, note: "أرّخ بعضهم موته بسنة ١٢٠ وبعضهم بسنة ١٢٩ {cite:duha-islam p. 643}." }
