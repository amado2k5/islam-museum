summary:
  ar: "رجل دين ومحاضر إيراني من طهران، درس في حوزة قم حتى درس الخارج ودرس علم النفس جامعيًا، رأس «اتاق فكر» المرشد الأعلى في الجامعات وأسّس مدرسة دار الحكمة العلمية في طهران سنة 2013، وتدور محاضراته على المهدوية وآخر الزمان والأسرة ونشر التشيع؛ بلغ حسابه الرسمي على إنستغرام 1,352,604 متابعين في نوفمبر 2026 بحسب قراءة على المنصة نفسها."
  en: "Iranian cleric and lecturer from Tehran, educated at the Qom seminary to the kharij level with university studies in psychology, head of the Supreme Leader's think tank for universities and founder of the Dar al-Hikmah seminary in Tehran in 2013; his lectures treat Mahdism and the end of time, family and the raising of children, and the publishing of Shiism. His official Instagram account counted 1,352,604 followers in November 2026 per an on-platform profile read."
  ur: "تہران سے تعلق رکھنے والے ایرانی عالم و خطیب، جنھوں نے قم حوزے میں درس خارج تک تعلیم پائی اور جامعہ میں نفسیات پڑھی، رہبر کے جامعات کے لیے تھنک ٹینک کے سربراہ اور 2013ء میں تہران میں مدرسہ دار الحکمہ کے بانی؛ ان کے لیکچر مہدویت، آخر زمان، خاندان اور تشیع کی اشاعت پر ہوتے ہیں؛ نومبر 2026ء میں پلیٹ فارم پر پڑھے گئے اعداد کے مطابق ان کے سرکاری انسٹاگرام کے فالوور 1,352,604 تھے۔"
