id: person/al-wathiq-hafsi
class: person
label:
  ar: الواثق يحيى بن المستنصر الحفصي
  en: al-Wathiq Yahya ibn al-Mustansir al-Hafsi
summary:
  ar: "يحيى بن المستنصر الملقب بالواثق والمشهور بالمخلوع؛ بويع ليلة هلاك أبيه سنة 675هـ فافتتح أمره برفع المظالم وتسريح أهل السجون وإفاضة العطاء وإصلاح المساجد، واستبد عليه وزيره الأندلسي ابن الحبّر الذي أهلك الوزير ابن أبي الحسين عذاباً على ذخيرة من ماله، فلما دخل عمه أبو إسحاق بجاية ودعا له الجند استيقن الواثق ذهاب ملكه وانخلع عن الأمر لعمه غرة ربيع الأول سنة 678هـ وتحول عن قصور القصبة إلى دار الأقوري."
  en: "Yahya ibn al-Mustansir, titled al-Wathiq and known as the Deposed; acclaimed the night of his father's death in 675 AH, he opened with redress of grievances, freeing prisoners, largesse and restoring mosques, until his Andalusi vizier Ibn al-Habbar dominated him and tortured the vizier Ibn Abi al-Husayn to death over his hoard; when his uncle Abu Ishaq entered Bejaia and the army called for him, al-Wathiq knew his reign was spent and abdicated on 1 Rabi I 678, moving from the citadel's palaces to the Aquri house."
