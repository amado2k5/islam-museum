id: person/al-wathiq-hafsi
class: person
label:
  ar: الواثق يحيى بن المستنصر الحفصي
  en: al-Wathiq Yahya ibn al-Mustansir al-Hafsi
  fr: "al-Wathiq Yahya ibn al-Mustansir al-Hafsi"
  es: "al-Wathiq Yahya ibn al-Mustansir al-Hafsi"
  ur: "الوثیق یحییٰ ابن المستنصر الحفصی۔"
summary:
  ar: "يحيى بن المستنصر الملقب بالواثق والمشهور بالمخلوع؛ بويع ليلة هلاك أبيه سنة 675هـ فافتتح أمره برفع المظالم وتسريح أهل السجون وإفاضة العطاء وإصلاح المساجد، واستبد عليه وزيره الأندلسي ابن الحبّر الذي أهلك الوزير ابن أبي الحسين عذاباً على ذخيرة من ماله، فلما دخل عمه أبو إسحاق بجاية ودعا له الجند استيقن الواثق ذهاب ملكه وانخلع عن الأمر لعمه غرة ربيع الأول سنة 678هـ وتحول عن قصور القصبة إلى دار الأقوري."
  en: "Yahya ibn al-Mustansir, titled al-Wathiq and known as the Deposed; acclaimed the night of his father's death in 675 AH, he opened with redress of grievances, freeing prisoners, largesse and restoring mosques, until his Andalusi vizier Ibn al-Habbar dominated him and tortured the vizier Ibn Abi al-Husayn to death over his hoard; when his uncle Abu Ishaq entered Bejaia and the army called for him, al-Wathiq knew his reign was spent and abdicated on 1 Rabi I 678, moving from the citadel's palaces to the Aquri house."
  fr: "Yahya ibn al-Mustansir, intitulé al-Wathiq et connu sous le nom de Deposed ; acclamé la nuit de la mort de son père en 675 de l’hégire, il a ouvert avec réparation des griefs, la libération des prisonniers, des largesses et la restauration des mosquées, jusqu'à ce que son vizir andalou Ibn al-Habbar l'a dominé et torturé à mort le vizir Ibn Abi al-Husayn ; lorsque son oncle Abu Ishaq entra dans Bejaia et que l'armée l'appela, al-Wathiq savait que son règne était passé et abdiqua le 1 Rabi I 678, passant des palais de la citadelle à la maison Aquri."
  es: "Yahya ibn al-Mustansir, titulado al-Wathiq y conocido como el Depuesto, fue aclamado la noche de la muerte de su padre en el año 675 de la Hégira. Comenzó reparando agravios, liberando prisioneros, mostrando generosidad y restaurando mezquitas, hasta que su visir andalusí Ibn al-Habbar lo dominó y torturó hasta la muerte al visir Ibn Abi al-Husayn por su tesoro. Cuando su tío Abu Ishaq entró en Bejaia y el ejército lo llamó, al-Wathiq supo que su reinado había terminado y abdicó el 1 de Rabi I de 678, trasladándose de los palacios de la ciudadela a la casa de Aquri."
  ur: "یحییٰ بن المستنصر، جس کا لقب الوثیق ہے اور معزول کے نام سے جانا جاتا ہے۔ 675 ہجری میں اپنے والد کی وفات کی رات کی تعریف کی، اس نے شکایات کے ازالے، قیدیوں کو رہا کرنے، بڑی تعداد میں اور مساجد کی بحالی کے ساتھ کھولا، یہاں تک کہ اس کے اندلس کے وزیر ابن الحبر نے اس پر غلبہ حاصل کیا اور وزیر ابن ابی الحسین کو اس کے ذخیرے پر تشدد کرکے موت کے گھاٹ اتار دیا۔ جب اس کے چچا ابو اسحاق بیجعہ میں داخل ہوئے اور فوج نے اسے طلب کیا تو الوثیق کو معلوم تھا کہ اس کا دور حکومت 1 ربیع اول 678 کو ختم ہو گیا اور اس نے قلعہ کے محلات سے عقری کے گھر کی طرف منتقل ہو گئے۔"
  tr: "Yahya ibn al-Mustansir, lakaplı Al-Wathiq ve ünlü olarak görevden alınan, babasının ölüm gecesi 675 Hicri yılında bağlılık yemini etti. İşlerini, şikayetleri çözerek, mahkumları serbest bırakarak, cömertliği artırarak ve camileri reformlayarak başlattı. Endülüs veziri İbn el-Hibr onun lideri olarak atandı ve hazinesi için ceza olarak bakan İbn Ebi el-Hüseyin'i öldürdü. Amcası Ebu İshaq Bejaia'ya girip ordu çağırdığında, el-Vathiq krallığının kaybedileceğinden emindi ve Rebi'l-Avval'ın ilk günü, 678 Hicri'de amcası bu işten vazgeçip Kasbah saraylarından Dar al-Aquri'ye taşındı."
  id: "Yahya ibn al-Mustansir, yang dijuluki Al-Wathiq dan terkenal sebagai yang digulingkan, disumpah setia pada malam kematian ayahnya pada tahun 675 H. Ia memulai urusannya dengan menyelesaikan keluhan, membebaskan tawanan, meningkatkan kemurahan hati, dan mereformasi masjid. Wazir Andalusia-nya, Ibn al-Hibr, diangkat sebagai pemimpinnya, yang membunuh menteri Ibn Abi al-Husayn sebagai hukuman atas harta bendanya. Ketika pamannya Abu Ishaq memasuki Bejaia dan memanggil tentara, al-Wathiq yakin kerajaannya akan hilang, dan pada hari pertama Rabi' al-Awwal 678 H, pamannya turun tahta dan pindah dari istana Kasbah ke Dar al-Aquri."
