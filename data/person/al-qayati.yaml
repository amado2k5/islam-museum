summary:
  ar: "قاضي القضاة شمس الدين القاياتي القاهري الشافعي قاضي القضاة ومحقق الوقت وعلامة الآفاق؛ ولد سنة خمس وثمانين وسبعمائة تقريباً وحضر دروس السراج البلقيني وأخذ عن البدر الطنبذي والعز بن جماعة والعلاء البخاري وغيرهم وبرع في الفقه والعربية والأصلين والمعاني وسمع الحديث وحدث باليسير، وولي تدريس البرقوقية والأشرفية والشافعي والشيخونية وقضاء الشافعية بمصر فباشره بنزاهة وعفة وأقرأ زماناً وانتفع به خلق وشرح المنهاج، وتوفي في ليلة الاثنين ثامن عشر المحرم سنة خمسين وثمانمائة بالقاهرة {cite:shadharat-dhahab p. 268}."
  en: "Al-Qayati (b. ~785) — Shafi'i chief qadi of Egypt, 'verifier of the age and mark of the horizons'; taught at the Barquqiyya, Ashrafiyya and Shaykhuniyya, judged 'with probity and abstinence,' author of a Sharh al-Minhaj; died Sunday night 18 Muharram 850 at Cairo {cite:shadharat-dhahab p. 268}."
  fr: "Al-Qayati (né en 785) – chef Shafi'i d'Égypte, « vérificateur de l'âge et de la marque des horizons » ; enseigné à la Barquqiyya, Ashrafiyya et Shaykhuniyya, jugé « avec probité et abstinence  », auteur d'un Sharh al-Minhaj  ; décédé dimanche soir 18 Muharram 850 au Caire {cite:shadharat-dhahab p. 268}."
  es: "Al-Qayati (n. ~785) — cadí principal shafi'í de Egipto, 'verificador de la edad y marca de los horizontes'; enseñó en las escuelas Barquqiyya, Ashrafiyya y Shaykhuniyya, juzgado 'con probidad y abstinencia', autor de un Sharh al-Minhaj; murió la noche del domingo 18 de Muharram de 850 en El Cairo {cita: shadharat-dhahab p. 268}."
  ur: "القیاطی (b. ~ 785) - مصر کے شافعی چیف قاضی، 'افق کی عمر اور نشان کا تصدیق کنندہ'؛ برقعیہ، اشرفیہ اور شیخونیہ میں پڑھایا جاتا ہے، 'احتیاط اور پرہیزگاری کے ساتھ' فیصلہ کیا جاتا ہے، ایک شرح المنہاج کے مصنف؛ اتوار کی رات 18 محرم 850 کو قاہرہ میں وفات پائی۔ 268}۔"
  tr: "Baş Yargıç Şemseddin el-Qayati el-Kahiri el-Şafii, başyargıç, zamanın doğrulayıcısı ve ufuk âlimi; yaklaşık yedi yüz seksen beş hicri doğumlu, El-Siraj el-Balkini'nin derslerine katıldı, el-Bedr el-Tanbazi, el-İzz bin Cema'ah, el-Ala' el-Buhari ve diğerlerinden eğitim aldı. Fıkıh, Arapça, özgün kaynaklar ve anlamlarda üstün başarı gösterdi, hadisleri kolayca dinledi ve anlattı, Mısır'da Barquqiyya, Ashrafiyya, Şafii ve Şeyhuniyya okullarını dürüstlük ve iffetle öğretmeye başladı. Bir süre çalıştı ve metodolojinin oluşturulması ve açıklanmasından faydalandı. 850 Hicri yılında, Muharrem ayının on sekizinci Pazartesi gecesi Kahire'de vefat etti {alıntı: Shadharat-Dhahab, s. 268}."
  id: "Ketua Hakim Shams al-Din al-Qayati al-Qahiri al-Shafi'i, ketua hakim, pemeriksa waktu, dan ulama cakrawala; lahir sekitar tujuh ratus delapan puluh lima H, mengikuti pelajaran Al-Siraj al-Balqini, belajar di bawah bimbingan al-Badr al-Tanbazi, al-Izz ibn Jama'ah, al-Ala' al-Bukhari, dan lainnya. Ia unggul dalam bidang fiqh, Arab, sumber dan makna yang otentik, mendengarkan hadits dan bercerita dengan mudah, serta mengajar aliran Barquqiyya, Ashrafiyya, Shafi'i, dan Shaykhuniyya di Mesir, dimulai dengan integritas dan kesucian. Ia belajar untuk beberapa waktu dan mendapat manfaat dari penciptaan dan penjelasan metodologi tersebut. Ia meninggal pada malam Senin, tanggal delapan belas Muharram, tahun 850 H di Kairo {cite:shadharat-dhahab, hlm. 268}."
