summary:
  ar: "قاضي القضاة شمس الدين القاياتي القاهري الشافعي قاضي القضاة ومحقق الوقت وعلامة الآفاق؛ ولد سنة خمس وثمانين وسبعمائة تقريباً وحضر دروس السراج البلقيني وأخذ عن البدر الطنبذي والعز بن جماعة والعلاء البخاري وغيرهم وبرع في الفقه والعربية والأصلين والمعاني وسمع الحديث وحدث باليسير، وولي تدريس البرقوقية والأشرفية والشافعي والشيخونية وقضاء الشافعية بمصر فباشره بنزاهة وعفة وأقرأ زماناً وانتفع به خلق وشرح المنهاج، وتوفي في ليلة الاثنين ثامن عشر المحرم سنة خمسين وثمانمائة بالقاهرة {cite:shadharat-dhahab p. 268}."
  en: "Al-Qayati (b. ~785) — Shafi'i chief qadi of Egypt, 'verifier of the age and mark of the horizons'; taught at the Barquqiyya, Ashrafiyya and Shaykhuniyya, judged 'with probity and abstinence,' author of a Sharh al-Minhaj; died Sunday night 18 Muharram 850 at Cairo {cite:shadharat-dhahab p. 268}."
