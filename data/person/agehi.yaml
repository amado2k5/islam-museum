summary:
  ar: "شاعر ومؤرخ عثماني، ولد في يني جه وردار ⁦(يانيتسا)⁩، وعمل مدرّسًا وقاضيًا، واشتهر بقصيدة في لغة البحارة تغزّل فيها بشاب بحار، وله تاريخ عن غزوة سيكيتوار {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
  en: "An Ottoman poet and historian, born at Yenice-i Vardar (Giannitsa), who worked as mudarris and qadi. He is famous for a qasida in the slang of Turkish sailors addressed to a young sailor, full of galley terms, and wrote a history of Suleyman's siege of Szigetvar {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
  fr: "Poète et historien ottoman né à Yenice-i Vardar (Giannitsa), qui exerça comme mudarris et cadi. Célèbre pour une qasida en argot des marins turcs adressée à un jeune marin, riche en termes de galères, il écrivit une histoire du siège de Szigetvar par Soliman {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
  es: "Poeta e historiador otomano, nacido en Yenice-i Vardar (Giannitsa), que ejerció como mudarris y cadí. Es famoso por una qasida escrita en la jerga de los marineros turcos, dirigida a un joven marinero y repleta de términos marineros, y escribió una historia del asedio de Szigetvar por Solimán {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
  ur: "ایک عثمانی شاعر اور مورخ، ینیس وردار ⁦(گیانیتسا)⁩ میں پیدا ہوا، جس نے مدثر اور قاضی کے طور پر کام کیا۔ وہ ترک ملاحوں کی زبان میں قصیدہ کے لیے مشہور ہے جو کہ ایک نوجوان ملاح کو مخاطب کیا گیا تھا، جو کہ گیلی کی اصطلاحات سے بھرا ہوا تھا، اور اس نے سلیمان کے سیگیٹوار کے محاصرے کی تاریخ لکھی تھی۔ 1 ص۔ 267}۔"
  tr: "Yeni Çehverdar'da (Yanica) doğmuş bir Osmanlı şairi ve tarihçisi olan bu kişi, öğretmenlik ve kadılık yapmış, denizcilerin dilinde yazdığı ve genç bir denizciyi övdüğü bir şiiriyle ünlüdür; ayrıca Sikituar baskını hakkında da bir tarihçesi bulunmaktadır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}"
  id: "Seorang penyair dan sejarawan Ottoman, lahir di Yeni Cehverdar (Yanica), ia bekerja sebagai guru dan hakim, dan terkenal karena sebuah puisi dalam bahasa pelaut di mana ia memuji seorang pelaut muda, dan ia memiliki sejarah tentang penyerbuan Sikituar {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
