summary:
  ar: "سليمان بن عبد الله بن طاهر بن الحسين، أبو أيوب الخزاعي، من آل طاهر، ولي شرطة بغداد والسواد على ما نقل الصفدي عن الطبري، وكان أديبا شاعرا روى عنه المبرد، توفي سنة 266 هـ."
  en: "Sulayman ibn Abdallah ibn Tahir ibn al-Husayn, Abu Ayyub al-Khuza'i, of the Tahirid family; appointed to the police of Baghdad and the Sawad according to al-Safadi's report from al-Tabari; a man of letters and a poet from whom al-Mubarrad narrated; died 266 AH (879)."
  es: "Sulayman ibn Abdallah ibn Tahir ibn al-Husayn, Abu Ayyub al-Khuza'i, de la familia Tahirid; nombrado para la policía de Bagdad y Sawad según el informe de al-Safadi de al-Tabari; un hombre de letras y poeta del que narró al-Mubarrad; murió en el año 266 AH (879)."
