summary:
  ar: "محمود سامي باشا البارودي (١٨٣٩–١٩٠٤م)؛ «أول ناهض بالشعر العربي من كبوته» في عصر الزركلي وأحد القادة الشجعان. مولده ووفاته بمصر، تعلم في المدرسة الحربية بها ورحل إلى الآستانة فأتقن الفارسية والتركية وله فيهما قصائد ونثائح، وسافر إلى فرنسة وإنكلترة واطلع على التجارب الحربية، وعاد إلى مصر فتقلب في مناصب انتهت به إلى رئاسة النظار ثم استقال. وحدثت الثورة العرابية فكان في صفوف الثائرين فنُفي إلى جزيرة سيلان حيث أقام سبعة عشر عاماً تعلم في خلالها الإنكليزية وكفّ بصره، وعُفي عنه سنة ١٣١٧هـ فعاد إلى مصر. قال الزركلي: أما شعره فيصح انتهاجه ملاحة للأساليب المصرية الراقية بعد إسفاف المنظوم في العربية زمناً غير قصير. له «ديوان شعر» في جزأين و«مختارات البارودي» في أربعة أجزاء {cite:al-aalam tarjama}."
  en: "Mahmud Sami al-Barudi (1839–1904 CE) — the premier who rode with the Urabi revolt, was exiled to Ceylon for seventeen years, and revived classical Arabic poetry {cite:al-aalam tarjama}."
