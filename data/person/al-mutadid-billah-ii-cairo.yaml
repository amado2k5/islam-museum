id: person/al-mutadid-billah-ii-cairo
class: person
label: { ar: "المعتضد بالله داود بن المتوكل", en: "al-Mu'tadid bi-llah Dawud ibn al-Mutawakkil", fr: "al-Mu'tadid bi-llah Dawud ibn al-Mutawakkil", es: "al-Mu'tadid bi-llah Dawud ibn al-Mutawakkil" }
summary:
  ar: "خليفة القاهرة [٨١٥–٨٤٥هـ]، أبو الفتح داود بن المتوكل أمه أم ولد تركية كزل، بويع بالخلافة بعد خلع أخيه المستعين سنة خمس عشرة والسلطان المؤيد، وكان من سروات الخلفاء نبيلاً ذكياً فطناً يجالسه العلماء والفضلاء ويستفيد منهم ويشاركهم فيما هم فيه جواداً سمحاً إلى الغاية، قلد السلطنة للمظفر أحمد بن المؤيد ثم ططر فالصالح محمد بنه ثم برسباي ثم العزيز يوسف بنه، ومات يوم الأحد رابع ربيع الأول سنة خمس وأربعين وثمان مئة وقد قارب السبعين {cite:tarikh-khulafa-minhaj-1434 p. 769-770}."
  en: "Cairo caliph [815–845] — 'of the caliphs' elite: noble, bright, alert; scholars sat with him and he shared their pursuits; generous to a fault' — investing five sultans across thirty years; died Sunday 4 Rabi' I 845 near seventy {cite:tarikh-khulafa-minhaj-1434 p. 769-770}."
  fr: "Le calife du Caire [815-845] – « de l’élite des califes » : noble, brillant, alerte ; les érudits assis avec lui et il a partagé leurs activités ; généreux à une faute » – investir cinq sultans sur trente ans ; décédé dimanche 4 Rabi I 845 près de soixante-dix {cite:tarikh-khulafa-minhaj-1434 p. 769-770}."
  es: "Califa de El Cairo [815–845] — 'de la élite de los califas: noble, brillante, alerta; los eruditos se sentaban con él y compartía sus inquietudes; generoso en exceso' — investió a cinco sultanes a lo largo de treinta años; murió el domingo 4 de Rabi' I de 845 cerca de los setenta {cite:tarikh-khulafa-minhaj-1434 p. 769-770}."
