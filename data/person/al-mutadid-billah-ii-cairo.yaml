id: person/al-mutadid-billah-ii-cairo
class: person
label: { ar: "المعتضد بالله داود بن المتوكل" }
summary:
  ar: "خليفة القاهرة [٨١٥–٨٤٥هـ]، أبو الفتح داود بن المتوكل أمه أم ولد تركية كزل، بويع بالخلافة بعد خلع أخيه المستعين سنة خمس عشرة والسلطان المؤيد، وكان من سروات الخلفاء نبيلاً ذكياً فطناً يجالسه العلماء والفضلاء ويستفيد منهم ويشاركهم فيما هم فيه جواداً سمحاً إلى الغاية، قلد السلطنة للمظفر أحمد بن المؤيد ثم ططر فالصالح محمد بنه ثم برسباي ثم العزيز يوسف بنه، ومات يوم الأحد رابع ربيع الأول سنة خمس وأربعين وثمان مئة وقد قارب السبعين {cite:tarikh-khulafa-minhaj-1434 p. 769-770}."
  en: "Cairo caliph [815–845] — 'of the caliphs' elite: noble, bright, alert; scholars sat with him and he shared their pursuits; generous to a fault' — investing five sultans across thirty years; died Sunday 4 Rabi' I 845 near seventy {cite:tarikh-khulafa-minhaj-1434 p. 769-770}."
