id: person/thumama-ibn-ashras
class: person
label: { ar: "ثمامة بن أشرس", en: "Thumama ibn Ashras" }
summary:
  ar: "متكلم نديم المأمون، دارت بينه وبين يحيى بن أكثم مسألة فقه فقال في أصحاب رسول الله أخطأوا كلهم وأغفلوا وجه الدلالة فاستعظمها يحيى {cite:muruj-al-dhahab p. 402-403}. قال ابن النديم أبو بشر ثمامة بن الأشرس النميري من بني غير نبيه من جلة المتكلمين المعتزلة كاتب بليغ، وبلغ من المأمون منزلة جليلة وأراده على الوزارة فامتنع وله في ذلك كلام مشهور مدون في خطاب المأمون حتى أعفاه، وهو الذي أشار عليه أن يستوزر أحمد بن أبي خالد بدلا منه، وكان قبل المأمون مع الرشيد فوجد عليه محبسه عند غلامه وكان حبسه لما نقم على البرامكة لاختصاصه بهم فكتب إليه من الحبس أبياته، وبلغ المأمون أنه لا يقوم لطاهر بن الحسين ويقوم لأبي الهذيل ويأخذ بركابه حتى ينزل فسأله عن ذلك فقال أبو الهذيل أستاذي منذ ثلاثين سنة {cite:fihrist-ibn-al-nadim p. 526-527}"
  en: "Al-Ma'mun's mutakallim boon-companion who dared tell Yahya ibn Aktham the Companions had all erred {cite:muruj-al-dhahab p. 402-403}."
