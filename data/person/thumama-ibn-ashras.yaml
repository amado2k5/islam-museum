class: person
label: { ar: "ثمامة بن أشرس", en: "Thumama ibn Ashras", es: "Thumama ibn Ashras", fr: "Thumama ibn Ashras", ur: "ثمامہ بن اشراس" }
summary:
  ar: "متكلم نديم المأمون، دارت بينه وبين يحيى بن أكثم مسألة فقه فقال في أصحاب رسول الله أخطأوا كلهم وأغفلوا وجه الدلالة فاستعظمها يحيى {cite:muruj-al-dhahab p. 402-403}. قال ابن النديم أبو بشر ثمامة بن الأشرس النميري من بني غير نبيه من جلة المتكلمين المعتزلة كاتب بليغ، وبلغ من المأمون منزلة جليلة وأراده على الوزارة فامتنع وله في ذلك كلام مشهور مدون في خطاب المأمون حتى أعفاه، وهو الذي أشار عليه أن يستوزر أحمد بن أبي خالد بدلا منه، وكان قبل المأمون مع الرشيد فوجد عليه محبسه عند غلامه وكان حبسه لما نقم على البرامكة لاختصاصه بهم فكتب إليه من الحبس أبياته، وبلغ المأمون أنه لا يقوم لطاهر بن الحسين ويقوم لأبي الهذيل ويأخذ بركابه حتى ينزل فسأله عن ذلك فقال أبو الهذيل أستاذي منذ ثلاثين سنة {cite:fihrist-ibn-al-nadim p. 526-527}"
  en: "Al-Ma'mun's mutakallim boon-companion who dared tell Yahya ibn Aktham the Companions had all erred {cite:muruj-al-dhahab p. 402-403}."
  es: "El compañero benefactor de Al-Ma'mun que se atrevió a decirle a Yahya ibn Aktham que todos los Compañeros habían cometido un error {cite:muruj-al-dhahab p. 402-403}."
  fr: "Le compagnon bienfaiteur mutakallim d'Al-Ma'mun qui a osé dire à Yahya ibn Aktham que les Compagnons avaient tous erré {cite:muruj-al-dhahab p. 402-403}."
  ur: "المامون کے متکلم بون صحابی جنہوں نے یحییٰ بن اکثم کو بتانے کی جرأت کی کہ تمام صحابہ نے غلطی کی تھی۔ 402-403}۔"
  tr: "Nadim al-Ma'mun'un ilahiyatçısı, kendisi ile Yahya ibn Aktham arasında bir hukuk meselesiydi ve şöyle dedi: Allah'ın Resûlünün sahabeleri arasında hepsi hata yaptı ve anlamı ihmal etti; Yahya ise bu anlamı fazlasıyla abarttı {atı:muruj-al-dhahab s. 402-403}. Banu Ghayr Nabih'ten İbn el-Nedim Ebu Bişir Thumama ibn el-Eşra el-Nemiri, önde gelen Mu'tazillerden biri ve etkileyici bir yazardı. El-Memun'dan yüksek bir statü aldı ve onu vezir olarak istedi, ancak reddetti. El-Me'mun'un konuşmasında affedilene kadar bilinen anlatımları vardır. Yerine Ahmed bin Ebi Halid'i atamasını tavsiye etti. El-Memun'la birlikteydi ve hapsedilmesini hizmetkarıyla buldu. Barmakilerden hoşlanmadığı için hapsedildi; onlar ona hapsedilmesiyle ilgili şiirler yazdılar. El-Me'mun, Tahir ibn el-Hüseyin için durmayacağını, Ebu el-Hudhayl atından inene kadar bindireceğini öğrendi. Ebu el-Hudhayl ona bunu sordu. Ebu el-Hudhayl dedi ki: Öğretmenim otuz yıldır Fihrist-ibn-al-Nadim s. 526-527}"
  id: "Teolog Nadim al-Ma'mun adalah masalah hukum antara dia dan Yahya ibn Aktham, dan dia berkata: Di antara para sahabat Rasulullah, mereka semua keliru dan mengabaikan maknanya, yang sangat dibesar-besarkan oleh Yahya {cite:muruj-al-dhahab hlm. 402-403}. Ibn al-Nadim Abu Bishr Thumama ibn al-Ashras al-Namiri dari Banu Ghayr Nabih adalah salah satu Mu'tazilit terkemuka dan penulis yang fasih. Ia mencapai status tinggi dari al-Ma'mun dan menginginkannya sebagai wazir, tetapi ia menolak. Ia memiliki catatan terkenal yang tercatat dalam pidato al-Ma'mun hingga ia mengampuninya. Ia menyarankan agar Ahmad ibn Abi Khalid diangkat sebagai penggantinya. Ia bersama al-Ma'mun dan mendapati dirinya dipenjara bersama pelayannya. Ia dipenjara karena membenci Barmakid, yang menulis ayat-ayat tentang penahanannya. Al-Ma'mun mengetahui bahwa ia tidak akan membiarkan Tahir ibn al-Husayn, melainkan akan membawa Abu al-Hudhayl ke tunggangannya sampai ia turun. Abu al-Hudhayl menanyakan hal itu kepadanya. Abu al-Hudhayl berkata: Guruku telah berada di sana selama tiga puluh tahun {cite:Fihrist-ibn-al-Nadim hlm. 526-527}"
