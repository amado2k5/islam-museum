summary:
  ar: "سياسي ورجل أعمال باكستاني (وُلد 1958)، رئيس وزراء باكستان من أغسطس 2017 إلى مايو 2018، ووزير البترول والموارد الطبيعية (2013–2017)، ومؤسس شركة الطيران «إير بلو»، وقائد حزب «عوام باكستان» الذي أسسه سنة 2024."
  en: "Pakistani politician and businessman (born 1958), prime minister of Pakistan from August 2017 to May 2018, minister for petroleum and natural resources (2013–2017), founder of the airline Airblue, and chairman of the Awaam Pakistan party he founded in 2024."
  ur: "پاکستانی سیاست دان اور تاجر (پیدائش 1958ء)، اگست 2017ء سے مئی 2018ء تک پاکستان کے وزیرِ اعظم، وزیرِ پٹرولیم و قدرتی وسائل (2013ء–2017ء)، ایئر لائن ایئر بلو کے بانی، اور 2024ء میں قائم کردہ اپنی جماعت عوام پاکستان کے چیئرمین۔"
