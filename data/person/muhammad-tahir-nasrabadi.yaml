summary:
  ar: "ميرزا محمد طاهر نصرآبادي (وُلد سنة 1027 هـ / 1618م، وكان حيًّا سنة 1088 هـ / 1677–1678م)، أديب وشاعر من نصرآباد أصفهان، صاحب «تذكرة الشعراء» المعروفة بتذكرة نصرآبادي، وهي معجم تراجم لنحو ألف شاعر من العصر الصفوي ألّفه إهداءً إلى الشاه سليمان الأول. راسله الشعراء من إيران وماوراء النهر والهند، وكان صائب التبريزي أشهر معارفه. لم يُعرف تاريخ وفاته."
  en: "Mirza Muhammad Tahir Nasrabadi (b. 1027 AH / 1618 CE, alive in 1088 AH / 1677–78 CE) was a litterateur and poet of Nasrabad, Isfahan, author of the Tazkirat al-Shu'ara known as the Tazkira-ye Nasrabadi, a biographical dictionary of some one thousand poets of the Safavid age, dedicated to Shah Suleiman I. Poets of Iran, Transoxiana and India corresponded with him and sent him their verse, and Saib Tabrizi was the most famous of his associates. The date of his death is unrecorded."
  ur: "میرزا محمد طاہر نصرآبادی (پیدائش 1027ھ / 1618ء، 1088ھ / 1677ء–1678ء میں زندہ)، نصرآبادِ اصفہان کے ادیب اور شاعر، «تذکرۃ الشعراء» معروف بہ تذکرۂ نصرآبادی کے مصنف — صفوی عہد کے تقریباً ایک ہزار شعراء کی سوانح کا مجموعہ، جو شاہ سلیمان اول کی نذر کیا گیا۔ ایران، ماوراء النہر اور ہند کے شعراء ان سے خط کتابت کرتے اور اپنا کلام بھیجتے تھے، اور صائب تبریزی ان کے مشہور ترین معارف میں تھے۔ ان کی وفات کی تاریخ معلوم نہیں۔"

