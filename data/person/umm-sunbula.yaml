summary:
  ar: 'صحابية من أسلم؛ روت عنها عائشة أنها أهدت إلى النبي لبناً وهو في بيت عائشة، وقالت عائشة إن النبي نهى عن طعام الأعراب، فقال: «ليسوا بأعراب، هم أهل باديتنا ونحن أهل حاضرتهم، إذا دعوناهم أجابوا».'
  en: A Companion of Aslam about whom Aisha related that she brought the Prophet milk as a gift; Aisha remarked he had forbidden eating from bedouin, and he said 'They are not bedouin; they are the people of our desert and we are the people of
    their town, and when we call them they answer.'
