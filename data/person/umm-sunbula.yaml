summary:
  ar: 'صحابية من أسلم؛ روت عنها عائشة أنها أهدت إلى النبي لبناً وهو في بيت عائشة، وقالت عائشة إن النبي نهى عن طعام الأعراب، فقال: «ليسوا بأعراب، هم أهل باديتنا ونحن أهل حاضرتهم، إذا دعوناهم أجابوا».'
  en: A Companion of Aslam about whom Aisha related that she brought the Prophet milk as a gift; Aisha remarked he had forbidden eating from bedouin, and he said 'They are not bedouin; they are the people of our desert and we are the people of
    their town, and when we call them they answer.'
  ur: "اسلم کی صحابیہ جس کے بارے میں عائشہ نے روایت کیا کہ وہ نبی کو تحفے میں دودھ لائی؛ عائشہ نے کہا کہ انہوں نے کھانے سے منع کیا تھا۔"
  es: "Un compañero de Aslam, de quien Aisha relató que le llevó leche al Profeta como regalo, comentó que él había prohibido comer de los beduinos, y él dijo: «No son beduinos; son la gente de nuestro desierto y nosotros somos la gente de su ciudad, y cuando los llamamos, responden»."
  fr: "Un Compagnon d'Aslam, à qui Aïcha avait rapporté avoir apporté du lait en cadeau au Prophète, fit remarquer qu'il lui avait interdit de manger chez les Bédouins. Il répondit: « Ce ne sont pas des Bédouins; ce sont les gens de notre désert et nous sommes les gens de leur ville, et quand nous les appelons, ils répondent. »"
  tr: "İslam'dan bir kadın sahabe; Aişa, Peygamber'e Aişe'nin evindeyken ona süt verdiğini rivayet etti. Aişa, Peygamber'in bedevilerin yemesini yasakladığını söyledi ve şöyle dedi: \"Onlar bedevi değil; onlar çölümüzün insanlarıdır, biz de onların mahallesinin insanlarıyız. Onları çağırdığımızda cevap verirler.\""
  id: "Seorang teman wanita dari Islam; Aisha menceritakan darinya bahwa ia memberikan susu kepada Nabi saat Nabi berada di rumah Aisha. Aisha berkata bahwa Nabi melarang makan Badui, dengan berkata: \"Mereka bukan Badui; mereka adalah orang-orang gurun kita, dan kita adalah orang-orang di lingkungan mereka. Ketika kita memanggil mereka, mereka menjawab.\""
