id: person/muhammad-ibn-al-hanafiyya
class: person
label: { ar: "محمد بن الحنفية", en: "Muhammad ibn al-Hanafiyya" }
summary:
  ar: "ابن علي بن أبي طالب من امرأة من بني حنيفة، أوصى له أبوه وهو يجود بنفسه أن يوقر أخويه الحسن والحسين وأوصاهما به فقال إنه سيفكما وابن أبيكما فأكرماه واعرفا حقه {cite:muruj-al-dhahab p. 703}.، ولما نال ابن الزبير من علي في خطبته جاء محمد بن الحنفية فوضع له كرسياً قدام المنبر وقال يا معشر قريش شاهت الوجوه أينتقص علي وأنتم حضور، فلما قال ابن الزبير عذرت بني الفواطم يتكلمون فما بال ابن الحنفية قال يا ابن أم رومان أليست فاطمة بنت محمد حليلة أبي وأم أخوتي {cite:muruj-al-dhahab p. 76-77}"
  en: "Ali's son by a Hanifa woman — the dying caliph commended him to honour his brothers and charged them 'he is your sword and your father's son; honour him and know his right' {cite:muruj-al-dhahab p. 703}."
