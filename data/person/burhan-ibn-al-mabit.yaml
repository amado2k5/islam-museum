summary:
  ar: "برهان الدين إبراهيم بن المابط شاعر القاهرة؛ من شعره في القهوة: يا عائباً لسواد قهوتنا التي فيها — شفاء أنفس من أمراضها — أوما تراها وهي في فنجانها — تحكي سواد العين وسط بياضها {cite:shadharat-dhahab p. 688}."
  en: "A Cairo poet — his lines in praise of coffee survive in the Shadharat: 'O you who fault our coffee's blackness — in it is a cure for souls of their ills — do you not see it in its cup — telling of the black of the eye amid its whiteness' {cite:shadharat-dhahab p. 688}."
  es: "Un poeta de El Cairo —sus versos en alabanza del café se conservan en el Shadharat: «Oh, vosotros que criticáis la negrura de nuestro café —en él hay una cura para las almas de sus males— ¿no lo veis en su taza —que habla del negro del ojo en medio de su blancura?» {cita: shadharat-dhahab p. 688}."
  fr: "Un poète du Caire — ses vers à la gloire du café survivent dans le Shadharat: « Ô vous qui critiquez la noirceur de notre café — il y a en lui un remède pour les âmes de leurs maux — ne le voyez-vous pas dans sa tasse — parlant du noir de l'œil au milieu de sa blancheur » {cite: shadharat-dhahab p. 688}."
  ur: "قاہرہ کے ایک شاعر - کافی کی تعریف میں اس کی سطریں شہادات میں زندہ ہیں: 'اے وہ جو ہماری کافی کی سیاہی کو قصوروار ٹھہراتے ہیں - اس میں ان کی بیماریوں کی روح کا علاج ہے - کیا تم اسے اس کے پیالے میں نہیں دیکھتے - اس کی سفیدی کے درمیان آنکھ کی کالی کو بیان کرتے ہو'۔ 688}۔"
  tr: "Burhan al-Din İbrahim bin el-Mabit, Kahire'nin şairi; kahve üzerine yazdığı şiirden: Ey kahvemizin siyahlığına yas tutanlar, içinde ruhların hastalıklarından bir çare olan ya da fincanında gördüğünüz — gözün beyazlığı içindeki siyahlığını anlatır {atıf:shadharat-dhahab, s. 688}."
  id: "Burhan al-Din Ibrahim ibn al-Mabit, penyair Kairo; dari puisinya tentang kopi: Wahai kalian yang meratapi kegelapan kopi kami, yang mengandung — obat jiwa dari penyakit mereka — atau apa yang kalian lihat dalam cangkirnya — menceritakan kegelapan mata di tengah keputihannya {cite:shadharat-dhahab, hlm. 688}."
