summary:
  en: "Aunt of the Prophet, daughter of al-Harith ibn Abd al-Muttalib, remembered as the most eloquent of the Hashimite women at Mu'awiya's court: she rebuked Mu'awiya, Amr ibn al-As and Marwan ibn al-Hakam in turn, extracted six thousand dinars for her grievances, declared that Ali fulfilled the trust while Mu'awiya squandered his, and returned to Medina when Mu'awiya dismissed her."
  ar: "عمة النبي، ابنة الحارث بن عبد المطلب؛ وصفها كحالة بأنها كانت أغلظ الوافدات على معاوية بن أبي سفيان خطاباً، فأنكرته وعمرو بن العاص ومروان بن الحكم واحداً واحداً، وطلبت منه ستة آلاف دينار لما كانت لها من حق على آل علي، وقالت إن علياً أدى الأمانة وعمل بأمر الله وأنه ضيّع أمانته وخان الله في ماله، ثم عادت إلى المدينة بعد أن أكرمها معاوية."
