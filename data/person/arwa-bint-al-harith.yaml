summary:
  en: "Aunt of the Prophet, daughter of al-Harith ibn Abd al-Muttalib, remembered as the most eloquent of the Hashimite women at Mu'awiya's court: she rebuked Mu'awiya, Amr ibn al-As and Marwan ibn al-Hakam in turn, extracted six thousand dinars for her grievances, declared that Ali fulfilled the trust while Mu'awiya squandered his, and returned to Medina when Mu'awiya dismissed her."
  ar: "عمة النبي، ابنة الحارث بن عبد المطلب؛ وصفها كحالة بأنها كانت أغلظ الوافدات على معاوية بن أبي سفيان خطاباً، فأنكرته وعمرو بن العاص ومروان بن الحكم واحداً واحداً، وطلبت منه ستة آلاف دينار لما كانت لها من حق على آل علي، وقالت إن علياً أدى الأمانة وعمل بأمر الله وأنه ضيّع أمانته وخان الله في ماله، ثم عادت إلى المدينة بعد أن أكرمها معاوية."
  es: "Tía del Profeta, hija de al-Harith ibn Abd al-Muttalib, recordada como la más elocuente de las mujeres hachemíes en la corte de Mu'awiya: reprendió a Mu'awiya, Amr ibn al-As y Marwan ibn al-Hakam por turnos, obtuvo seis mil dinares por sus quejas, declaró que Ali cumplió con la confianza depositada en él mientras que Mu'awiya malgastó la suya, y regresó a Medina cuando Mu'awiya la despidió."
  fr: "Tante du Prophète, fille d'al-Harith ibn Abd al-Muttalib, dont on se souvient comme de la plus éloquente des femmes hachémites à la cour de Mu'awiya: elle réprimanda tour à tour Mu'awiya, Amr ibn al-As et Marwan ibn al-Hakam, exiga six mille dinars pour ses griefs, déclara qu'Ali avait rempli sa mission tandis que Mu'awiya avait dilapidé la sienne, et retourna à Médine lorsque Mu'awiya la congédia."
