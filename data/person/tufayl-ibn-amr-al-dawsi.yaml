summary:
  en: "A noble chief and renowned poet of the Daws tribe who arrived in Mecca around the eleventh year of prophethood; warned against listening to Muhammad, he stuffed his ears with cotton but upon hearing the recitation at the Kaaba embraced Islam, later calling his entire tribe to the faith."
  ar: "سيد قبيلة دوس وشاعرها الشريف الملقب بذي النور؛ حذّرته قريش من النبي فحشا أذنيه كرسفاً، حتى سمعه يصلي عند الكعبة فاستمع لكلامه وأسلم، ودعا قومه باليمن حتى قدم بهم مسلمين بخيبر. وفي الصحيح أنه قال للنبي «إن دوساً قد هلكت عصت وأبت فادع الله عليهم» فقال «اللهم اهد دوساً وائت بهم» {cite:sahih-al-bukhari 4392}."
  ur: "دوس قبیلے کا معزز سردار اور مشہور شاعر جو نبوت کے گیارہویں سال کے قریب مکہ آیا؛ نبی کو سننے سے روکا گیا مگر وہ سن کر مسلمان ہوا۔"
  es: "Un noble jefe y renombrado poeta de la tribu Daws, que llegó a La Meca alrededor del undécimo año de la profecía, fue advertido de no escuchar a Mahoma, por lo que se tapó los oídos con algodón, pero al oír la recitación en la Kaaba abrazó el Islam, y más tarde llamó a toda su tribu a la fe."
  fr: "Un chef noble et poète renommé de la tribu des Daws, arrivé à La Mecque vers la onzième année de la prophétie; mis en garde contre l'écoute de Mahomet, il se boucha les oreilles avec du coton, mais en entendant la récitation à la Kaaba, il embrassa l'islam, appelant plus tard toute sa tribu à la foi."
  tr: "Daws kabilesinin lideri ve soylu şairleri Dhu al-Nur, Kureyş'ten Peygamber'e karşı müstehcen bir sağır ve sağır uyarısı aldı; ta ki Peygamber'in Kabe'de namaz kıldığını duyana kadar; bu yüzden sözlerini dinledi, İslam'ı benimsedi ve halkını Yemen'e, Müslümanları Haybar'a getirene kadar davet etti. Gerçek rivayette Peygamber'e şöyle dedi: \"Gerçekten Dawlar yok oldu, itaatsizlik ettim ve reddettim, o yüzden onlara karşı Allah'a dua et,\" ve şöyle dedi: \"Ey Allah, Daws'u yönlendir ve onları geri getir\" {cite:sahih-al-bukhari 4392}."
  id: "Pemimpin suku Daws dan penyair mulia mereka, yang dijuluki Dhu al-Nur, diperingatkan oleh Quraisy terhadap Nabi dengan tuli dan tuli yang cabul, sampai ia mendengar Nabi berdoa di Ka'bah, maka ia mendengarkan kata-katanya dan memeluk Islam, serta mengundang umatnya ke Yaman sampai mereka membawa Muslim ke Khaybar. Dalam riwayat yang asli, ia berkata kepada Nabi: \"Sesungguhnya, Daws telah binasa, aku tidak taat dan menolak, maka berdoalah kepada Allah melawan mereka,\" dan ia berkata: \"Ya Allah, bimbinglah Daws dan bawa mereka kembali\" {cite:sahih-al-bukhari 4392}."
