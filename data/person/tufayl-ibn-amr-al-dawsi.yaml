summary:
  en: "A noble chief and renowned poet of the Daws tribe who arrived in Mecca around the eleventh year of prophethood; warned against listening to Muhammad, he stuffed his ears with cotton but upon hearing the recitation at the Kaaba embraced Islam, later calling his entire tribe to the faith."
  ar: "سيد قبيلة دوس وشاعرها الشريف الملقب بذي النور؛ حذّرته قريش من النبي فحشا أذنيه كرسفاً، حتى سمعه يصلي عند الكعبة فاستمع لكلامه وأسلم، ودعا قومه باليمن حتى قدم بهم مسلمين بخيبر. وفي الصحيح أنه قال للنبي «إن دوساً قد هلكت عصت وأبت فادع الله عليهم» فقال «اللهم اهد دوساً وائت بهم» {cite:sahih-al-bukhari 4392}."
