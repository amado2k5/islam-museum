label: { ar: "عجيف بن عنبسة", en: "Ujayf ibn Anbasa", es: "Ujayf ibn Anbasa", fr: "Ujayf ibn Anbasa", ur: "عجیف بن عنباسہ" }
summary:
  ar: "عجيف بن عنبسة رجل من أهل خراسان؛ ولاه المعتصم محاربة الزط الذين قطعوا الطريق بالبطيحة وضم إليه من القواد والجند خلقاً ولم يمنعه شيئاً طلبه من الأموال فرتب بين البطائح ومدينة السلام خيلاً مضمرة فكانت أخبار الزط تأتيه في ساعات وسد عنهم الماء بالمؤن العظام حتى أخذهم فلم ينج منهم أحد وقدم بهم إلى مدينة السلام في الزواريق."
  en: "Ujayf ibn Anbasa, a Khurasani; al-Mu'tasim's commander against the Zutt brigands of the batiha — given captains, troops and open funds, he staged lean horses to Baghdad so word came within hours, dammed the water against them with great works and took them all, barging them to Madinat al-Salam."
  es: "Ujayf ibn Anbasa, un jorasán; comandante de al-Mu'tasim contra los bandidos Zutt de la batiha: con capitanes, tropas y fondos disponibles, envió caballos flacos a Bagdad para que la noticia llegara en cuestión de horas, represó el agua contra ellos con grandes obras y los capturó a todos, transportándolos en barcazas a Madinat al-Salam."
  fr: "Ujayf ibn Anbasa, un Khurasani; commandant d'al-Mu'tasim contre les brigands Zutt de la batiha — ayant reçu des capitaines, des troupes et des fonds ouverts, il a envoyé des chevaux maigres à Bagdad afin que la nouvelle parvienne en quelques heures, a construit des barrages contre eux avec de grands ouvrages et les a tous emmenés, les transportant par barge à Madinat al-Salam."
  ur: "عجیف بن انبسہ، خراسانی؛ المعتصم کے کمانڈر نے بطیعہ کے زت بریگینڈز کے خلاف کپتانوں، فوجوں اور کھلے فنڈز کے ساتھ دبلے پتلے گھوڑے بغداد کی طرف روانہ کیے تو گھنٹوں میں بات آگئی، بڑے کاموں سے ان کے خلاف پانی بند کر دیا اور ان سب کو لے کر مدینہ الصلوٰۃ لے گئے۔"
