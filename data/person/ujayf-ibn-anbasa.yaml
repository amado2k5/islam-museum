summary:
  ar: "عجيف بن عنبسة رجل من أهل خراسان؛ ولاه المعتصم محاربة الزط الذين قطعوا الطريق بالبطيحة وضم إليه من القواد والجند خلقاً ولم يمنعه شيئاً طلبه من الأموال فرتب بين البطائح ومدينة السلام خيلاً مضمرة فكانت أخبار الزط تأتيه في ساعات وسد عنهم الماء بالمؤن العظام حتى أخذهم فلم ينج منهم أحد وقدم بهم إلى مدينة السلام في الزواريق."
  en: "Ujayf ibn Anbasa, a Khurasani; al-Mu'tasim's commander against the Zutt brigands of the batiha — given captains, troops and open funds, he staged lean horses to Baghdad so word came within hours, dammed the water against them with great works and took them all, barging them to Madinat al-Salam."
