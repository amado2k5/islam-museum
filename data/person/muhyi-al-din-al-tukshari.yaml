summary:
  ar: "الملا محيي الدين محمد بن إبراهيم التكشاري الرومي الحنفي، عالم بالعربية والعلوم الشرعية والعقلية ماهر في علوم الرياضة؛ أخذ عن الملا فتح الله الشرواني وقرأ على الحسام التوقاتي والملا يوسف بالي بن محمد الفناري والملا يكان، وكان حافظاً للقرآن عارفاً بالقراءات ماهراً في التفسير يذكّر الناس كل جمعة تارة بأياصوفيا وتارة بجامع السلطان محمد، حسن الأخلاق قنوعاً راضياً بالقليل من العيش؛ صنّف تفسير سورة الدخان وحواشي على تفسير القاضي البيضاوي وحاشية على شرح الوقاية لصدر الشريعة، ولما آن أوان القضاء مدّته ختم التفسير في أياصوفيا ثم قال «إني سألت الله أن يمهلني إلى ختم القرآن العظيم فلعل الله يختم لي بالخير والإيمان» ودعا فأمن الناس على دعائه، ثم أتى بيته بالقسطنطينية فمرض وتوفي سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 425}."
  en: "A master of Arabic, the legal and rational sciences and riyada; pupil of Fath Allah al-Shirwani, Husam al-Tuqati and Yusuf Bali b. Muhammad al-Fanari; Friday preacher alternately at Hagia Sophia and Mehmed II's mosque — and when 'the time of judgement' drew near he completed his tafsir recital at Hagia Sophia, told the people he had asked God to spare him only until the khatm of the Qur'an, prayed the amen with them, went home, sickened and died in 901 {cite:shadharat-dhahab p. 425}."
