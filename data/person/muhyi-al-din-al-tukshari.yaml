summary:
  ar: "الملا محيي الدين محمد بن إبراهيم التكشاري الرومي الحنفي، عالم بالعربية والعلوم الشرعية والعقلية ماهر في علوم الرياضة؛ أخذ عن الملا فتح الله الشرواني وقرأ على الحسام التوقاتي والملا يوسف بالي بن محمد الفناري والملا يكان، وكان حافظاً للقرآن عارفاً بالقراءات ماهراً في التفسير يذكّر الناس كل جمعة تارة بأياصوفيا وتارة بجامع السلطان محمد، حسن الأخلاق قنوعاً راضياً بالقليل من العيش؛ صنّف تفسير سورة الدخان وحواشي على تفسير القاضي البيضاوي وحاشية على شرح الوقاية لصدر الشريعة، ولما آن أوان القضاء مدّته ختم التفسير في أياصوفيا ثم قال «إني سألت الله أن يمهلني إلى ختم القرآن العظيم فلعل الله يختم لي بالخير والإيمان» ودعا فأمن الناس على دعائه، ثم أتى بيته بالقسطنطينية فمرض وتوفي سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 425}."
  en: "A master of Arabic, the legal and rational sciences and riyada; pupil of Fath Allah al-Shirwani, Husam al-Tuqati and Yusuf Bali b. Muhammad al-Fanari; Friday preacher alternately at Hagia Sophia and Mehmed II's mosque — and when 'the time of judgement' drew near he completed his tafsir recital at Hagia Sophia, told the people he had asked God to spare him only until the khatm of the Qur'an, prayed the amen with them, went home, sickened and died in 901 {cite:shadharat-dhahab p. 425}."
  es: "Maestro del árabe, de las ciencias jurídicas y racionales y de la riyada; discípulo de Fath Allah al-Shirwani, Husam al-Tuqati y Yusuf Bali b. Muhammad al-Fanari; predicador de los viernes alternativamente en Santa Sofía y en la mezquita de Mehmed II, y cuando se acercaba \"el tiempo del juicio\", completó su recitación de tafsir en Santa Sofía, dijo a la gente que le había pedido a Dios que lo perdonara solo hasta el khatm del Corán, rezó el amén con ellos, se fue a casa, enfermó y murió en 901 {cite:shadharat-dhahab p. 425}."
  fr: "Maître de l'arabe, des sciences juridiques et rationnelles et du riyada; élève de Fath Allah al-Shirwani, Husam al-Tuqati et Yusuf Bali b. Muhammad al-Fanari; prédicateur du vendredi alternativement à Sainte-Sophie et à la mosquée de Mehmed II — et lorsque « le temps du jugement » approcha, il termina sa récitation du tafsir à Sainte-Sophie, dit aux gens qu'il avait demandé à Dieu de l'épargner seulement jusqu'à la khatm du Coran, pria l'amen avec eux, rentra chez lui, tomba malade et mourut en 901 {cite:shadharat-dhahab p. 425}."
  ur: "عربی، قانونی اور عقلی علوم اور ریاض کا ماہر؛ فتح اللہ الشیروانی، حسام التقاتی اور یوسف بالی کے شاگرد۔ محمد الفناری؛ حجہ صوفیہ اور محمد دوم کی مسجد میں باری باری جمعہ کا مبلغ - اور جب 'فیصلے کا وقت' قریب آیا تو اس نے ہاگیہ صوفیہ میں اپنی تفسیر کی تلاوت مکمل کی، لوگوں سے کہا کہ اس نے خدا سے دعا کی تھی کہ وہ اسے صرف قرآن کے ختم ہونے تک بخش دے، ان کے ساتھ آمین کی دعا کی، گھر گئے، بیمار ہو کر وفات پائی۔ 425}۔"
  tr: "Arapça, şeriat ve rasyonel bilimler alanında uzman bir âlim olan Mele Muhyiddin Muhammed bin İbrahim el-Tekşari el-Rumi el-Hanafi, spor bilimlerinde yetenekli; Mela Fethallah el-Şervani'nin yanında eğitim aldı ve el-Hussam el-Tuqati, Molla Yusuf Bali bin Muhammed el-Fanari ve Mele Yakan'dan eğitim aldı. Kur'an'ı ezberleyen, okumalarda bilgili, tercüme konusunda yetenekli, her Cuma bazen Ayasofya'da, bazen Sultan Muhammed Camii'nde insanları hatırlatan biriydi. İyi karakterli, huzurlu ve mütevazı bir geçimle yetiniyordu. Dudhan Suresi'nin tefsirini, el-Kaddi el-Beydavinin yorumuna dair kenar notlarını ve Sadr tarafından Şerh al-Wiqaya üzerine kenar bir tefsir yazdı. Şeriat. Yargı zamanı geldiğinde, Ayasofya'da Tafsir'i tamamladı, ardından şöyle dedi: \"Büyük Kur'an'ı tamamlamam için bana zaman vermesini istedim ki belki Allah benim için iyilik ve imanla tamamlasın.\" Dua etti ve halk onun duasına güvendi. Sonra Konstantinopolis'teki evine döndü, hastalandı ve 921 yılında vefat etti {atıf:shadharat-dhahab, s. 425}."
  id: "Mulla Muhyiddin Muhammad ibn Ibrahim al-Takshari al-Rumi al-Hanafi, seorang ulama Arab, Syariah, dan ilmu rasional, ahli dalam ilmu olahraga; ia belajar di bawah bimbingan Mulla Fathallah al-Sharwani dan belajar di bawah bimbingan al-Hussam al-Tuqati, Mulla Yusuf Bali ibn Muhammad al-Fanari, dan Mulla Yakan. Ia adalah seorang penghafal Al-Qur'an, mahir dalam bacaan, mahir dalam penafsiran, mengingatkan orang setiap Jumat, kadang di Hagia Sophia dan kadang di Masjid Sultan Muhammad. Ia memiliki karakter yang baik, puas hati, dan puas dengan penghidupan yang sederhana. Ia menulis tafsiran Surah al-Dukhan, catatan pinggir tentang penafsiran al-Qadi al-Baydawi, dan komentar pinggiran tentang Sharh al-Wiqaya oleh Sadr. Syariah. Ketika waktunya untuk menghakimi, ia menyelesaikan tafsir di Hagia Sophia, lalu berkata, \"Saya memohon kepada Allah agar memberi saya waktu untuk menyelesaikan Al-Qur'an agung, agar mungkin Allah menyelesaikannya untuk saya dengan kebaikan dan iman.\" Ia berdoa, dan orang-orang mempercayai doanya. Kemudian ia kembali ke rumahnya di Konstantinopel, jatuh sakit, dan meninggal pada tahun 921 {cite:shadharat-dhahab, hlm. 425}."
