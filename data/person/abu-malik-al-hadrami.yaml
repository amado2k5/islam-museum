summary:
  ar: "خارجي المذهب من الشراة، قال في مجلس يحيى إن العشق نفث السحر وأخفى وأحر من الجمر وله نفوذ في القلب كنفوذ صيب المزن في خلل الرمل {cite:muruj-al-dhahab p. 358}."
  en: "The Kharijite speaker — 'sorcery's breath, subtler and hotter than embers' — at Yahya's majlis {cite:muruj-al-dhahab p. 358}."
  fr: "L'orateur kharijite — « un souffle de sortilège, plus subtil et plus brûlant que la braise » — au majlis de Yahya {cite:muruj-al-dhahab p. 358}."
  es: "El orador jariyí —'aliento de hechicería, más sutil y ardiente que las brasas'— en el majlis de Yahya {cite:muruj-al-dhahab p. 358}."
  ur: "خارجی مقرر - 'جادو کی سانس، انگارے سے زیادہ لطیف اور گرم' - یحییٰ کی مجلس میں۔ 358}۔"
  tr: "Şurat öğretisine yabancı olan bu kişi, Yahya'nın meclisinde aşkın, korlardan daha gizli ve daha sıcak olan bir sihir nefesi olduğunu ve kalbe, kumların arasındaki boşluklarda yağmur bulutlarının etkisi gibi bir etki bıraktığını söyledi. {kaynak: Muruj-al-Dhahab s. 358}"
  id: "Sebagai orang luar yang tidak mengenal doktrin Shurat, ia berkata dalam dewan Yahya bahwa cinta adalah napas sihir, lebih tersembunyi dan lebih panas daripada bara api, dan ia memiliki pengaruh pada hati seperti pengaruh awan hujan di celah-celah pasir {cite:muruj-al-dhahab p. 358}."
