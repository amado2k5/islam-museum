summary:
  ar: "\u0645\u0646\u0634\u062f \u0646\u0639\u062a \u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a (1956\u20132007) \u0623\u0646\u0634\u062f \u0622\u0644\u0627\u0641 \u0627\u0644\u0646\u0639\u0648\u062a \u0628\u0627\u0644\u0623\u0631\u062f\u064a\u0629 \u0648\u0627\u0644\u0628\u0646\u062c\u0627\u0628\u064a\u0629 \u0648\u0627\u0644\u0633\u0631\u0627\u0626\u064a\u0643\u064a\u0629 \u0648\u0627\u0644\u0628\u0634\u062a\u0648\u064a\u0629 \u0648\u0627\u0644\u0633\u0646\u062f\u064a\u0629\u060c \u0641\u0627\u0632 \u0628\u0623\u0648\u0644 \u0645\u0633\u0627\u0628\u0642\u0629 \u0644\u0644\u0646\u0639\u062a \u0641\u064a \u0627\u0644\u062a\u0644\u0641\u0632\u064a\u0648\u0646 \u0627\u0644\u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a \u0641\u064a 1978\u060c \u0648\u0627\u0634\u062a\u0647\u0631 \u0628\u0640\u00ab\u0632\u0645\u064a\u0646 \u0648 \u0632\u0645\u0627\u0646 \u062a\u0645\u0647\u0627\u0631\u06d2 \u0644\u06cc\u06d2\u00bb \u0648\u00ab\u06cc\u06c1 \u0633\u0628 \u062a\u0645\u06c1\u0627\u0631\u0627 \u06a9\u0631\u0645 \u06c1\u06d2 \u0622\u0642\u0627\u00bb\u060c \u0648\u0646\u0627\u0644 \u0648\u0633\u0627\u0645 \u062d\u0633\u0646 \u0627\u0644\u0623\u062f\u0627\u0621 \u0641\u064a 1996\u060c \u0648\u0643\u0627\u0646 \u0623\u0648\u0644 \u0646\u0639\u062a \u062e\u0648\u0627\u0646 \u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a \u064a\u064f\u0646\u0634\u062f \u0641\u064a \u0623\u0646\u062d\u0627\u0621 \u0627\u0644\u0639\u0627\u0644\u0645."
  en: "Pakistani naat reciter (1956\u20132007) who sang thousands of naats in Urdu, Punjabi, Saraiki, Pashto and Sindhi, won PTV's first naat competition in 1978, became famous for 'Zameen-o-Zaman Tumhare Liye' and 'Yeh Sab Tumhara Karam Hai Aaqa', received the Pride of Performance in 1996 and was the first Pakistani naat khawan to recite around the world."
  ur: "\u067e\u0627\u06a9\u0633\u062a\u0627\u0646\u06cc \u0646\u0639\u062a \u062e\u0648\u0627\u06ba \u2066(1956\u0621\u20132007\u0621)\u2069\u060c \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 \u0627\u0631\u062f\u0648\u060c \u067e\u0646\u062c\u0627\u0628\u06cc\u060c \u0633\u0631\u0627\u0626\u06cc\u06a9\u06cc\u060c \u067e\u0634\u062a\u0648 \u0627\u0648\u0631 \u0633\u0646\u062f\u06be\u06cc \u0645\u06cc\u06ba \u06c1\u0632\u0627\u0631\u0648\u06ba \u0646\u0639\u062a\u06cc\u06ba \u067e\u0691\u06be\u06cc\u06ba\u060c 1978\u0621 \u0645\u06cc\u06ba \u067e\u06cc \u0679\u06cc \u0648\u06cc \u06a9\u0627 \u067e\u06c1\u0644\u0627 \u0646\u0639\u062a\u06cc\u06c1 \u0645\u0642\u0627\u0628\u0644\u06c1 \u062c\u06cc\u062a\u0627\u060c \u00ab\u0632\u0645\u06cc\u0646 \u0648 \u0632\u0645\u0627\u06ba \u062a\u0645\u06c1\u0627\u0631\u06d2 \u0644\u06cc\u06d2\u00bb \u0627\u0648\u0631 \u00ab\u06cc\u06c1 \u0633\u0628 \u062a\u0645\u06c1\u0627\u0631\u0627 \u06a9\u0631\u0645 \u06c1\u06d2 \u0622\u0642\u0627\u00bb \u0633\u06d2 \u0645\u0634\u06c1\u0648\u0631 \u06c1\u0648\u0626\u06d2\u060c 1996\u0621 \u0645\u06cc\u06ba \u062a\u0645\u063a\u06c2 \u062d\u0633\u0646\u0650 \u06a9\u0627\u0631\u06a9\u0631\u062f\u06af\u06cc \u067e\u0627\u06cc\u0627\u060c \u0627\u0648\u0631 \u062f\u0646\u06cc\u0627 \u0628\u06be\u0631 \u0645\u06cc\u06ba \u0646\u0639\u062a \u067e\u0691\u06be\u0646\u06d2 \u0648\u0627\u0644\u06d2 \u067e\u06c1\u0644\u06d2 \u067e\u0627\u06a9\u0633\u062a\u0627\u0646\u06cc \u0646\u0639\u062a \u062e\u0648\u0627\u06ba \u062a\u06be\u06d2\u06d4"
