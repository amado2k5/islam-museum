  ar: "قائد الحلفاء العرب في صفوف هرقل يوم مؤتة، من قبيلة بلي ⁦(أحد إراش)⁩. قُتل على يد قطبة بن قتادة العذري قائد الميمنة المسلمة. روى ابن هشام اسمه أيضًا 'مالك بن رافلة'."
  en: "Commander of the Arab allies of Heraclius at Mu'tah, from Bali of Irash. Killed by Qutba ibn Qatada al-Udhri. Ibn Hisham records an alternate name, Ibn Raflah."
