summary:
  ar: "قائد الحلفاء العرب في صفوف هرقل يوم مؤتة، من قبيلة بلي ⁦(أحد إراش)⁩. قُتل على يد قطبة بن قتادة العذري قائد الميمنة المسلمة. روى ابن هشام اسمه أيضًا 'مالك بن رافلة'."
  en: "Commander of the Arab allies of Heraclius at Mu'tah, from Bali of Irash. Killed by Qutba ibn Qatada al-Udhri. Ibn Hisham records an alternate name, Ibn Raflah."
  es: "Comandante de los aliados árabes de Heraclio en Mu'tah, originario de Bali, en Irash. Fue asesinado por Qutba ibn Qatada al-Udhri. Ibn Hisham registra un nombre alternativo: Ibn Raflah."
  fr: "Commandant des alliés arabes d'Héraclius à Mu'tah, originaire de Bali (Irash). Tué par Qutba ibn Qatada al-Udhri. Ibn Hisham mentionne un autre nom: Ibn Raflah."
  ur: "عراق کے بالی سے موتہ کے مقام پر ہرقل کے عرب اتحادیوں کا کمانڈر۔ قطبہ بن قتادہ الذری کے ہاتھوں قتل۔ ابن ہشام نے ایک متبادل نام ابن رفلہ درج کیا ہے۔"
  tr: "Mu'tah Günü'nde Bali kabilesinden (Ahad Irash) Herakleios'un saflarındaki Arap müttefiklerin lideriydi. Müslüman sağın lideri Qutbah ibn Qatada al-Adhri tarafından öldürüldü. İbn Hisham da adını 'Malik ibn Rafala' olarak anlattı."
  id: "Ia adalah pemimpin sekutu Arab dalam barisan Heraclius pada Hari Mu'tah, dari suku Bali (Ahad Irash). Ia dibunuh oleh Qutbah ibn Qatada al-Adhri, pemimpin sayap kanan Muslim. Ibn Hisham juga menceritakan namanya sebagai 'Malik ibn Rafala'."
