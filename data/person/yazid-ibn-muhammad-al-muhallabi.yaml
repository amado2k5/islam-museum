id: person/yazid-ibn-muhammad-al-muhallabi
class: person
label: { ar: "يزيد بن محمد المهلبي" }
summary:
  ar: "الشاعر، قال لما عزم المتوكل على سكنى دمشق إذا عزم الإمام على انطلاق فإن تدع العراق وساكنيه أظن الشام تشمت بالعراق فقد تبلى المليحة بالطلاق فبدا له ورجع، ورثى المتوكل بقصيدته خليفة لم ينل ما ناله أحد {cite:tarikh-khulafa-minhaj-1434 p. 541,544}. وعند المسعودي قال في وفاة المنتصر وكان من شيعة آل أبي طالب ولقد بررت الطالبية بعدما ذموا زماناً بعدها رزماناً ورددت ألفة هاشم {cite:muruj-al-dhahab p. 519}"
  en: "The poet; when al-Mutawakkil resolved to dwell at Damascus he warned 'the lovely woman is worn out by divorce' — the caliph returned; he later elegized him 'a caliph none attained what he attained' {cite:tarikh-khulafa-minhaj-1434 p. 541,544}."
  es: "El poeta, cuando al-Mutawakkil decidió residir en Damasco, advirtió: «La bella mujer está agotada por el divorcio». El califa regresó y más tarde le dedicó una elegía: «Ningún califa alcanzó lo que él alcanzó» {cite:tarikh-khulafa-minhaj-1434 p. 541,544}."
  fr: "Le poète; lorsque al-Mutawakkil décida de demeurer à Damas, il avertit « la belle femme est épuisée par le divorce » — le calife revint; il l'éleva plus tard « un calife dont nul n'a atteint ce qu'il a atteint » {cite:tarikh-khulafa-minhaj-1434 p. 541,544}."
  ur: "شاعر؛ جب المتوکل نے دمشق میں رہنے کا ارادہ کیا تو اس نے خبردار کیا کہ 'خوبصورت عورت طلاق سے ختم ہو جاتی ہے' - خلیفہ واپس آیا؛ بعد میں اس نے اسے 'خلیفہ کسی نے حاصل نہیں کیا جو اس نے حاصل کیا'۔ 541,544}۔"
  tr: "Şair şöyle dedi: El-Mutavakkil Şam'a yerleşmeye karar verdiğinde, İmam yola çıkmaya karar verdiyse, Irak'tan ve halkını terk ederseniz Levant'ın Irak'a böbürleneceğini düşünüyorum, o zaman el-Maliha boşanma tehlikesi çekmiştir, bu yüzden geri döndü ve al-Mutevakkil şiiriyle kimsenin ulaşamadığı bir halefi yas tuttu {atıf:Tarih-Khulafa-minhaj-1434 s. 541,544}. al-Mas'udi'ye göre, Ebu Talib'in ailesinden olan el-Muntasir'in ölümü hakkında söylemiştir ve Talibiyyah, uzun süre bunu bir şiirle kınayıp Haşim'in uyumunu tekrarladıktan sonra haklı çıkarmıştır {atıf:Muruj-al-Dhahab, s. 519}"
  id: "Penyair berkata: Ketika al-Mutawakkil memutuskan untuk menetap di Damaskus, jika Imam memutuskan untuk berangkat, maka jika Anda meninggalkan Irak dan penduduknya saya pikir Levant akan membanggakan Irak, maka al-Maliha telah menderita perceraian, sehingga ia kembali dan al-Mutawakkil berduka dengan puisinya seorang penerus yang tidak dicapai oleh orang lain {cite:History-Khulafa-minhaj-1434 hlm. 541,544}. Menurut al-Mas'udi, ia berkata tentang kematian al-Muntasir, yang merupakan pengikut keluarga Abu Talib, dan Talibiyyah membenarkannya setelah lama mengutuknya dengan sebuah puisi dan mengulangi harmoni Hashim {cite:muruj-al-dhahab, hlm. 519}"
