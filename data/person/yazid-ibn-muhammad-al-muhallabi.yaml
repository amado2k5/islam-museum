label: { ar: "يزيد بن محمد المهلبي" }
summary:
  ar: "الشاعر، قال لما عزم المتوكل على سكنى دمشق إذا عزم الإمام على انطلاق فإن تدع العراق وساكنيه أظن الشام تشمت بالعراق فقد تبلى المليحة بالطلاق فبدا له ورجع، ورثى المتوكل بقصيدته خليفة لم ينل ما ناله أحد {cite:tarikh-khulafa-minhaj-1434 p. 541,544}.، وعند المسعودي قال في وفاة المنتصر وكان من شيعة آل أبي طالب ولقد بررت الطالبية بعدما ذموا زماناً بعدها رزماناً ورددت ألفة هاشم {cite:muruj-al-dhahab p. 519}"
  en: "The poet; when al-Mutawakkil resolved to dwell at Damascus he warned 'the lovely woman is worn out by divorce' — the caliph returned; he later elegized him 'a caliph none attained what he attained' {cite:tarikh-khulafa-minhaj-1434 p. 541,544}."
