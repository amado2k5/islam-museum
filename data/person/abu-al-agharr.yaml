id: person/abu-al-agharr
class: person
label: { ar: "أبو الأغر خليفة بن المبارك", en: "Abu al-Aghar Khalifa ibn al-Mubarak", fr: "Abu al-Aghar Khalifa ibn al-Mubarak", es: "Abu al-Aghar Khalifa ibn al-Mubarak", ur: "ابو الاثار خلیفہ ابن المبارک" }
summary:
  ar: "أمير الركب العراقي، قاتل طيء يوماً وليلة لما خرجت على الركب سنة سبع فنصره الله وقتل أميرهم صالحاً وأسر من قومه خلقاً كثيراً ودخل الحجاج بالأسرى وبالرؤوس على الرماح {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  en: "Commander of the Iraqi caravan; he fought Tayyi' a day and a night in 287, killed their amir Salih and took many captive — the pilgrims came in with heads on lances {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  fr: "Commandant de la caravane irakienne ; il combattit les Tayyi' un jour et une nuit en 287, tua leur émir Salih et fit de nombreux captifs — les pèlerins arrivèrent avec des têtes sur des lances {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  es: "Comandante de la caravana iraquí; luchó contra Tayyi' durante un día y una noche en 287, mató a su emir Salih y tomó muchos cautivos; los peregrinos llegaron con cabezas en lanzas {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  ur: "عراقی کاروان کے کمانڈر؛ اس نے 287 میں ایک دن رات طائی سے جنگ کی، ان کے امیر صالح کو قتل کر دیا اور بہت سے اسیر کر لیے - حجاج سروں پر نیزے کے ساتھ آئے۔ 575}۔"
  tr: "Irak kervanının emiri, yedinci yılda kervana isyan eden Tayy ile bir gün bir gece savaştı; Allah ona zafer verdi ve emir Salih'i öldürerek halkından birçok kişiyi esir aldı. El-Haccac ise esirlerle ve mızrakların ucundaki başlarla birlikte içeri girdi. {cite:tarikh-khulafa-minhaj-1434 s. 575}"
  id: "Amir kafilah Irak berperang melawan Tayy selama sehari semalam ketika mereka memberontak melawan kafilah pada tahun tujuh, lalu Allah menganugerahkan kemenangan kepadanya dan dia membunuh Amir mereka, Salih, dan menangkap banyak pengikutnya, dan Al-Hajjaj masuk dengan para tawanan dan kepala-kepala yang ditancapkan di tombak. {cite:tarikh-khulafa-minhaj-1434 p. 575}."
