summary:
  ar: صانعة محتوى طهي لبنانية وُلدت سنة 1997؛ من أكبر صنّاع المحتوى الغذائي في العالم العربي، تجمع في مقاطعها بين المطبخ العالمي والضيافة العربية بإخراج سينمائي، ولديها عشرات الملايين من المتابعين.
  en: Lebanese culinary content creator born in 1997; among the Arab world's biggest food creators, her cinematic videos blending global cuisine with Arab hospitality have earned tens of millions of followers.
  ur: لبنانی کھانوں کی مواد ساز جو 1997 میں پیدا ہوئی؛ عرب دنیا کی سب سے بڑی فوڈ کریٹروں میں، عالمگیر کھانوں اور عرب مہمان نوازی کو ملانے والی اس کی سنیمائی ویڈیوز نے کروڑوں فالوورز بنائے۔
  fr: "Créatrice libanaise de contenus culinaires née en 1997 ; parmi les plus grandes créatrices culinaires du monde arabe, ses vidéos cinématographiques mêlant cuisine du monde et hospitalité arabe lui ont valu des dizaines de millions d'abonnés."
  es: "Creadora de contenido culinario libanesa nacida en 1997; una de las creadoras de contenido gastronómico más importantes del mundo árabe, sus vídeos cinematográficos que combinan la cocina global con la hospitalidad árabe le han valido decenas de millones de seguidores."
  tr: "1997 doğumlu Lübnanlı bir yemek içerik üreticisi; Arap dünyasının en büyük yemek içerik üreticilerinden biri olan bu isim, videolarında uluslararası mutfağı ve Arap misafirperverliğini sinematik bir yaklaşımla birleştiriyor ve on milyonlarca takipçiye sahip."
  id: "Seorang kreator konten memasak asal Lebanon kelahiran 1997; salah satu kreator konten makanan terbesar di dunia Arab, ia menggabungkan masakan internasional dan keramahan Arab dalam video-videonya dengan arahan sinematik, dan memiliki puluhan juta pengikut."
