label: { ar: "يحيى بن خالد البرمكي", en: "Yahya ibn Khalid al-Barmaki" }
summary:
  ar: "وزير الرشيد، لما رام هارون الرشيد وصل بحر القلزم ببحر الروم من نحو الفرما وتنيس على أن يصب القلزم في بحر الروم قال له يحيى بن خالد يخطف الروم الناس من المسجد الحرام والطواف لأن مراكبهم تنتهي من بحر الروم إلى بحر الحجاز فتطرح سراياها مما يلي جدة فيخطف الناس من مكة والمدينة فامتنع الرشيد من ذلك {cite:muruj-al-dhahab p. 558}.، وحبسه الهادي وأراد قتله لأنه كان القيم بأمر الرشيد فقال له أرأيت إن نسا في أجل أمير المؤمنين أيظن أن الناس يسلمون لجعفر الأمر ولم يبلغ الحنث، فنبهه على أمر لم ينتبه له، ولما أفضت الخلافة إلى الرشيد قال له يا أبت أنت أجلستني في هذا المجلس ودفع خاتمه إليه فقلده الأمر {cite:muruj-al-dhahab p. 321-325}"
  en: "al-Rashid's vizier, who stopped the canal joining the Red Sea to the Mediterranean with one image — Roman squadrons landing near Jeddah to snatch pilgrims from the Haram {cite:muruj-al-dhahab p. 558}."
