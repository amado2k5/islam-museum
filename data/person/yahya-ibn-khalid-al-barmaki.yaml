label: { ar: "يحيى بن خالد البرمكي", en: "Yahya ibn Khalid al-Barmaki", es: "Yahya ibn Khalid al-Barmaki", fr: "Yahya ibn Khalid al-Barmaki", ur: "یحییٰ بن خالد البرمکی" }
summary:
  ar: "وزير الرشيد، لما رام هارون الرشيد وصل بحر القلزم ببحر الروم من نحو الفرما وتنيس على أن يصب القلزم في بحر الروم قال له يحيى بن خالد يخطف الروم الناس من المسجد الحرام والطواف لأن مراكبهم تنتهي من بحر الروم إلى بحر الحجاز فتطرح سراياها مما يلي جدة فيخطف الناس من مكة والمدينة فامتنع الرشيد من ذلك {cite:muruj-al-dhahab p. 558}. وحبسه الهادي وأراد قتله لأنه كان القيم بأمر الرشيد فقال له أرأيت إن نسا في أجل أمير المؤمنين أيظن أن الناس يسلمون لجعفر الأمر ولم يبلغ الحنث، فنبهه على أمر لم ينتبه له، ولما أفضت الخلافة إلى الرشيد قال له يا أبت أنت أجلستني في هذا المجلس ودفع خاتمه إليه فقلده الأمر {cite:muruj-al-dhahab p. 321-325}، وكان ذا علم ومعرفة وبحث ونظر وله مجلس يجتمع فيه أهل الكلام من أهل الإسلام وغيرهم من أهل الآراء والنحل {cite:muruj-al-dhahab p. 357-358}، وعنده قصد سيبويه العراق فجمع بينه وبين الكسائي والأخفش فناظراه وأجازه بعشرة آلاف درهم بعد أن خطآه {cite:fihrist-ibn-al-nadim p. 143}، وحكى ابن النديم أن يحيى بن خالد بعث برجل إلى الهند ليأتيه بمقاقير موجودة في بلادهم وأن يكتب له أديانهم فكتب له الكتاب الذي نقل عنه ابن النديم أخبار معابد الهند، وأن الذي عني بأمر الهند في دولة العرب يحيى بن خالد وجماعة البرامكة واهتمامها بأمر الهند وإحضارها علماء طبها وحكمائها {cite:fihrist-ibn-al-nadim p. 484}"
  en: "al-Rashid's vizier, who stopped the canal joining the Red Sea to the Mediterranean with one image — Roman squadrons landing near Jeddah to snatch pilgrims from the Haram {cite:muruj-al-dhahab p. 558}."
  es: "El visir de al-Rashid, que detuvo el canal que unía el Mar Rojo con el Mediterráneo con una sola imagen: escuadrones romanos desembarcando cerca de Yeda para arrebatar peregrinos del Haram {cite:muruj-al-dhahab p. 558}."
  fr: "Le vizir d'al-Rashid, qui a arrêté le canal reliant la mer Rouge à la Méditerranée avec une seule image — des escadrons romains débarquant près de Djeddah pour arracher des pèlerins au Haram {cite:muruj-al-dhahab p. 558}."
  ur: "الرشید کا وزیر، جس نے بحیرہ احمر سے بحیرہ روم میں شامل ہونے والی نہر کو ایک تصویر کے ساتھ روکا — رومی دستہ جدہ کے قریب حجاج کو حرم سے چھیننے کے لیے اتر رہا ہے۔ 558}۔"
  tr: "Harun el-Reşid, El-Kürze ve Tanis yakınlarındaki Roma Gölü ile birlikte Rom Denizi'ne ulaşmayı planladığında, El-Qulzam'ın Rom Denizi'ne akmasını amaçladığında, Yahya bin Halid ona Romalıların Kutsal Camii ve Tevaf'tan insanları kaçıracağını, çünkü gemileri Roma Denizi'nden Hicaz Denizi'ne gideceğini, filolarının Cidde yakınlarından dağıtılacağını ve Mekke ile Medine'den insanları kaçıracağını söyledi. El-Reşid bunu yapmaktan kaçındı {atıf:muruj-al-dhahab, s. 558}. El-Hadi onu hapsetti ve öldürmeyi planladı çünkü el-Raşid'in işlerinin koruyucusuydu. Ona, \"Eğer Müminler Komutanı'nın zamanını unutursa, insanların itaatsizlik noktasına gelmeden Caf'e teslim olacağını mı sanacak?\" dedi. Onu dikkat etmediği bir şey hakkında uyardı. Halifelik el-Reşid'e ulaştığında, ona \"Ey baba, beni bu meclise oturttun,\" dedi ve yüzüğünü ona verdi, böylece olay taklit edildi. {kaynak:Muruj-al-Dhahab, s. 321-325} O bilgili, bilgili, araştırmalı ve anlayışlıydı; İslam halkı ve diğerlerinden ilahiyat alimlerinin toplandığı bir toplantı düzenledi Al-Ara' wal-Nihal {atıf:Muruj-al-Dhahab s. 357-358}. Sibowh Irak'ı amaçladı ve onu Al-Kisai ve Al-Akhfash ile bir araya getirdi; onlar da onunla müzakere ederek hatasından sonra on bin dirhem izin verdi {atı:Fihrist-ibn-al-Nadim s. 143}. İbn al-Nadim, Yahya ibn Halid'in Hindistan'a bir adam göndererek topraklarında bulunan kitapları getirmesi ve dinlerini yazması gerektiğini anlattı. Onun için, İbn al-Nadim'in Hindistan'daki tapınakların haberlerini alıntıladığı kitabı yazdı ve Hindistan'ın Arap devletindeki işleriyle ilgilenenin Yahya ibn Halid ve Barmakiler grubu ve onların bu konudaki ilgisi olduğunu söyledi Hindistan ve tıp bilginleri ve bilgeleri {kaynak:fihrist-ibn-al-nadim s. 484}"
  id: "Ketika Harun al-Rashid bermaksud mencapai Laut Al-Qulzam bersama Laut Romawi di dekat Al-Farma dan Tanis, dengan niat agar Al-Qulzam mengalir ke Laut Rum, Yahya ibn Khalid memberitahunya bahwa orang Romawi akan menculik orang-orang dari Masjid Suci dan Tawaf, karena kapal mereka akan berakhir dari Laut Roma ke Laut Hijaz, dan armada mereka akan dibubarkan dari dekat Jeddah, merebut orang-orang dari Mekah dan Madinah. Al-Rashid menahan diri untuk tidak melakukannya {cite:muruj-al-dhahab, hlm. 558}. Al-Hadi memenjarakannya dan berniat membunuhnya karena dia adalah penjaga urusan al-Rashid. Dia berkata kepadanya, \"Bagaimana jika dia lupa tentang zaman Panglima Orang Beriman, apakah dia akan berpikir bahwa orang-orang akan menyerah kepada Ja'far tanpa mencapai titik ketidakpatuhan?\" Dia memperingatkan tentang sesuatu yang tidak dia perhatikan. Ketika kekhalifahan tiba di al-Rashid, dia berkata kepadanya, \"Wahai Bapa, kamu telah menempatkan aku dalam dewan ini,\" dan dia menyerahkan cincinnya kepadanya, sehingga hal itu ditiru. {cite:muruj-al-dhahab, hlm. 321-325} Dia berpengetahuan, berpengetahuan, meneliti, dan penuh wawasan, dan dia mengadakan pertemuan di mana para ulama teologi dari kalangan umat Islam dan lainnya berkumpul Al-Ara' wal-Nihal {cite:Muruj-al-Dhahab hlm. 357-358}. Sibawayh berniat untuk Irak dan mempertemukannya dengan Al-Kisai dan Al-Akhfash, yang kemudian bernegosiasi dengannya dan memberinya izin sepuluh ribu dirham setelah kesalahannya {cite:fihrist-ibn-al-nadim hlm. 143}. Ibn al-Nadim menceritakan bahwa Yahya ibn Khalid mengirim seorang pria ke India untuk membawakan buku-buku yang ditemukan di tanah mereka dan menuliskan agama mereka. Ia menulis untuk Yahya ibn Al-Nadim sebuah buku yang dari situ Ibn al-Nadim mengutip berita tentang kuil-kuil di India, dan bahwa yang berkaitan dengan urusan India di negara Arab adalah Yahya ibn Khalid dan kelompok Barmakid serta minat mereka dalam hal ini India dan para sarjana serta bijaksana kedokterannya {cite:fihrist-ibn-al-nadim hlm. 484}"
