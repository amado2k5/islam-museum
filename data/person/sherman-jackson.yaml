summary:
  ar: "باحث أمريكي في الشريعة واللاهوت الإسلامي، وُلد سنة 1956، أستاذ بجامعة جنوب كاليفورنيا. يجمع عمله بين الفقه الكلاسيكي وهوية المسلمين الأمريكيين من أصل أفريقي والعلمانية الحديثة، ومن كتبه «الإسلام والأمريكي الأسود» و«الشريعة والدولة»."
  en: "American scholar of Islamic law and theology, born in 1956, professor at the University of Southern California. His work bridges classical jurisprudence, Blackamerican Muslim identity and modern secularism, with books including Islam and the Blackamerican and Islamic Law and the State."
  ur: "شریعتِ اسلامی اور کلام کے امریکی محقق، 1956 میں پیدا ہوئے، یونیورسٹی آف سدرن کیلیفورنیا کے پروفیسر۔ ان کا کام کلاسیکی فقہ، افریقی نژاد امریکی مسلمانوں کی شناخت اور جدید سیکولرازم کو جوڑتا ہے؛ کتب میں Islam and the Blackamerican اور Islamic Law and the State شامل ہیں۔"
  es: "Erudito estadounidense de derecho y teología islámica, nacido en 1956, profesor en la Universidad del Sur de California. Su obra tiende puentes entre la jurisprudencia clásica, la identidad musulmana afroamericana y el secularismo moderno, con libros como Islam and the Blackamerican e Islamic Law and the State."
  fr: "Érudit américain en droit et théologie islamiques, né en 1956, professeur à l'Université de Californie du Sud. Ses travaux établissent des liens entre la jurisprudence classique, l'identité musulmane afro-américaine et la laïcité moderne; parmi ses ouvrages figurent « Islam and the Blackamerican » et « Islamic Law and the State »."
  tr: "1956 doğumlu, İslam hukuku ve teolojisi alanında Amerikalı bir araştırmacı, Güney Kaliforniya Üniversitesi'nde profesördür. Çalışmaları klasik hukuk, Afrikalı Amerikalı Müslümanların kimliği ve modern laikliği birleştirir. Kitapları arasında \"İslam ve Siyah Amerikalı\" ile \"Şeriat ve Devlet\" bulunmaktadır."
  id: "Seorang peneliti Amerika dalam hukum dan teologi Islam, lahir tahun 1956, seorang profesor di University of Southern California. Karyanya menggabungkan yurisprudensi klasik, identitas Muslim Afrika-Amerika, dan sekularisme modern. Di antara bukunya adalah \"Islam and the Black American\" dan \"Sharia and the State.\""
