id: person/abdallah-ibn-muawiya-ibn-abdallah-ibn-jafar
class: person
label: { ar: "عبد الله بن معاوية بن عبد الله بن جعفر", en: "'Abd Allah ibn Mu'awiya ibn Ja'far", fr: "'Abd Allah ibn Mu'awiya ibn Ja'far", es: "'Abd Allah ibn Mu'awiya ibn Ja'far", ur: "عبداللہ بن معاویہ بن جعفر" }
summary:
  ar: "طالبي احتوى على بلاد اصطخر وغيرها من أرض فارس في فتنة آخر بني أمية إلى أن رفع عنها فصار إلى خراسان فقبض عليه أبو مسلم، وله من يقول بإمامته وينقاد إلى دعوته {cite:muruj-al-dhahab p. 229}."
  en: "The Ja'farid Talibi who held Istakhr and Fars in the last Umayyad fitna, then fled to Khurasan where Abu Muslim seized him — a sect claiming his imamate {cite:muruj-al-dhahab p. 229}."
  fr: "Le Talibide ja'faride qui tint Istakhr et le Fars lors de la dernière fitna omeyyade, puis s'enfuit au Khorassan où Abu Muslim se saisit de lui — une secte revendiquait son imamat {cite:muruj-al-dhahab p. 229}."
  es: "El talibi ja'farid que mantuvo el Istakhr y el Fars en la última fitna omeya, luego huyó a Jorasán donde Abu Muslim lo capturó; una secta reclamaba su imamato {cite:muruj-al-dhahab p. 229}."
  ur: "جعفری طالبی جس نے آخری اموی فتنے میں استخارہ اور فارس کا انعقاد کیا، پھر خراسان کی طرف بھاگ گیا جہاں ابو مسلم نے اسے پکڑ لیا - ایک فرقہ جو اس کی امامت کا دعویٰ کرتا ہے۔ 229}۔"
  tr: "Talibi, son Emevi hanedanlığı döneminde İstakhr topraklarını ve İran'ın diğer bölgelerini yönetti, ta ki oradan uzaklaştırılıp Horasan'a gidene kadar. Orada Ebu Müslim tarafından tutuklandı. İmametine inanan ve çağrısına kulak veren insanları vardı. {cite:muruj-al-dhahab s. 229}"
  id: "Talibi meliputi wilayah Istakhr dan bagian lain Persia selama dinasti Umayyah terakhir hingga ia disingkirkan dari wilayah tersebut dan pergi ke Khorasan, tempat Abu Muslim menangkapnya. Ia memiliki pengikut yang percaya pada imamatnya dan tunduk pada seruannya. {cite:muruj-al-dhahab p. 229}"
