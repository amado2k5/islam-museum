  ar: "داعية وعالم إندونيسي، وُلد في جاكرتا في 26 يونيو 1967، عُرف بدراساته القرآنية وقيادته مركز AQL الإسلامي في جاكرتا، وقاد حركة GNPF-MUI في احتجاجات 2016–2017. بلغ حسابه في إكس 336,000 متابع في زحف مرايا بين نحو 9 و12 نوفمبر 2026، وهي قراءة مرآة أدنى درجة من قراءة المنصّة نفسها."
