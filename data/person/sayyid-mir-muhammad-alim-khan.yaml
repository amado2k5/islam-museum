summary:
  ar: "سيد مير محمد عالم خان (1880–1944)، آخر أمراء بخارى من سلالة المنغيط الأوزبكية، حكم من 1911 إلى 1920 رغم كون الإمارة محمية روسية منذ 1873، فأطاح به الجيش الأحمر سنة 1920، ففرّ إلى دوشانبه ثم كابل، حيث توفي سنة 1944."
  en: "Sayyid Mir Muhammad Alim Khan (1880–1944) was the last Emir of Bukhara of the Uzbek Manghud dynasty, reigning from 1911 to 1920 although the emirate had been a Russian protectorate since 1873. Deposed by the Red Army in 1920, he fled to Dushanbe and then to Kabul, where he died in 1944."
  ur: "سید میر محمد عالم خان (1880–1944) ازبک منغود خاندان کے آخری امیرِ بخارا تھے؛ انہوں نے 1911 سے 1920 تک حکومت کی حالانکہ امارت 1873 سے روسی محمیہ تھی۔ 1920 میں سرخ فوج نے انہیں معزول کیا تو وہ دوشنبہ اور پھر کابل فرار ہوئے، جہاں 1944 میں ان کا انتقال ہوا۔"
