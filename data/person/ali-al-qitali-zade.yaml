summary:
  ar: "المولى علي القتالي زاده؛ قال في الكواكب: كان من القضاة الفضلاء الشعراء الظرفاء، ولد سنة ثمان عشرة وتسعمائة، وخالف في مسألة الضرب بالمشباب وألّف فيه كتاباً، وكان له في حياة أبي السعود صيت جميل، وكان شاعراً حسن الذوق جميل الأدب له قصيدة «الطريد إلى الله ملتجي حرمه» شملت الفنون؛ وقُتل بالطلسم في أنطاكية وقيل سقاه زوجته شيئاً في مرهقه فمات في سابع رمضان {cite:shadharat-dhahab p. 388-389}."
  en: "Molla 'Ali al-Qitali-zade — b. 918, 'one of the excellent poet-courtier qadis'; author of a tract on the mashbab punishment, poet of 'al-Tarid ila'llah'; killed by a poisoned draught said to be given by his wife at Antioch, died 7 Ramadan 979 {cite:shadharat-dhahab p. 388-389}."
