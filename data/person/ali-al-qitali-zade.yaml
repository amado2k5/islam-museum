summary:
  ar: "المولى علي القتالي زاده؛ قال في الكواكب: كان من القضاة الفضلاء الشعراء الظرفاء، ولد سنة ثمان عشرة وتسعمائة، وخالف في مسألة الضرب بالمشباب وألّف فيه كتاباً، وكان له في حياة أبي السعود صيت جميل، وكان شاعراً حسن الذوق جميل الأدب له قصيدة «الطريد إلى الله ملتجي حرمه» شملت الفنون؛ وقُتل بالطلسم في أنطاكية وقيل سقاه زوجته شيئاً في مرهقه فمات في سابع رمضان {cite:shadharat-dhahab p. 388-389}."
  en: "Molla 'Ali al-Qitali-zade — b. 918, 'one of the excellent poet-courtier qadis'; author of a tract on the mashbab punishment, poet of 'al-Tarid ila'llah'; killed by a poisoned draught said to be given by his wife at Antioch, died 7 Ramadan 979 {cite:shadharat-dhahab p. 388-389}."
  fr: "Molla 'Ali al-Qitali-zade - né en 918, 'l'un des excellents poète-courtisier qadis' ; auteur d'un tract sur la punition des mashbab, poète de 'al-Tarid ila'llah' ; tué par un trait empoisonné que sa femme aurait donné à Antioche, est mort 7 Ramadan 979 {cite:shadharat-dhahab p. 388-389}."
  es: "Molla 'Ali al-Qitali-zade — n. 918, 'uno de los excelentes cadíes poetas y cortesanos'; autor de un tratado sobre el castigo mashbab, poeta de 'al-Tarid ila'llah'; asesinado por una poción envenenada que se dice que le dio su esposa en Antioquía, murió el 7 de Ramadán de 979 {cite:shadharat-dhahab p. 388-389}."
  ur: "مولا علی القتالی زادے - بی۔ 918، 'بہترین شاعر درباری قادیان میں سے ایک'؛ مشباب سزا پر ایک ٹریکٹ کے مصنف، 'التارید الا اللہ' کے شاعر؛ انطاکیہ میں اس کی بیوی کی طرف سے دیے جانے والے زہریلے مسودے سے ہلاک، وفات 7 رمضان 979 388-389}۔"
  tr: "Mawla Ali al-Qatali Zaddah şöyle demiştir: El-Kvakib'de şöyle demiştir: O, erdemli, esprili ve esprili yargıçlar arasındaydı. 1918 yılında doğmuştur. Lapa ile vurma meselesine karşı çıkmış ve bununla ilgili bir kitap yazmıştır. Ebu el-Suud yaşamı boyunca güzel bir üne sahipti ve iyi zevkli, güzel edebiyata sahip bir şairdi. 'Tanrı'ya Yolcu, Kutsallığının Sığınağı' adlı şiiri yazdı; bu şiir sanatları da içeriyordu. Antakya'da tılsımla öldürüldü ve eşinin yorgunluğunu hafifletmek için ona bir şey verdiği söylenir; Ramazan ayının yedinci gününde vefat etti {atıf: şadharat-dhahab, s. 388-389}."
  id: "Mawla Ali al-Qatali Zaddah berkata: Ia berkata dalam Al-Kawakib: Ia termasuk di antara hakim yang berbudi luhur, cerdas, dan cerdas. Ia lahir pada tahun 1918. Ia menentang masalah mogok dengan bubur dan menulis sebuah buku tentangnya. Selama masa hidup Abu al-Saud, ia memiliki reputasi yang indah dan merupakan penyair yang berniat baik serta memiliki sastra yang baik. Ia menulis puisi 'Sang Pengembara kepada Tuhan, Perlindungan Kesucian-Nya,' yang memuat seni tersebut. Ia dibunuh oleh jimat di Antiokhia, dan dikatakan bahwa istrinya memberinya sesuatu untuk meredakan kelelahannya, dan ia meninggal pada tanggal tujuh Ramadan {cite:shadharat-dhahab, hlm. 388-389}."
