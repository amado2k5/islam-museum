summary:
  ar: "المقريء النحوي الشافعي؛ قرأ القراءات على الشاطبي وغيره حتى فاق أهل زمانه في القراءات وانتهت إليه رياسة الإقراء والأدب بدمشق وقرأ عليه خلق لا يحصيهم إلا الله؛ قال الذهبي ما علمت أحداً في الإسلام حمل عنه القراءات أكثر مما حمل عنه؛ وقال ابن خلكان رأيته مراراً راكباً بهيمة وهو يصعد إلى جبل الصالحية وحوله اثنان أو ثلاثة كل واحد يقرأ ميعاده في غير موضع الآخر وهو يرد على الجميع؛ من تصانيفه التفسير إلى الكهف في أربع مجلدات وشرح الشاطبية في مجلدين وشرح المفصل للزمخشري في أربع مجلدات وجمال القراء وتاج الإقراء {cite:shadharat-dhahab p. 230-231}."
  en: "Damascus's master of qira'at (d. Jumada II 643, Qasyun) — pupil of al-Shatibi himself; Dhahabi knew no one in Islam who transmitted more readings; Ibn Khallikan watched him ride up Salihiyya answering three students at once; author of a four-volume tafsir to al-Kahf and a Sharh al-Mufassal {cite:shadharat-dhahab p. 230-231}."
