summary:
  ar: "المقريء النحوي الشافعي؛ قرأ القراءات على الشاطبي وغيره حتى فاق أهل زمانه في القراءات وانتهت إليه رياسة الإقراء والأدب بدمشق وقرأ عليه خلق لا يحصيهم إلا الله؛ قال الذهبي ما علمت أحداً في الإسلام حمل عنه القراءات أكثر مما حمل عنه؛ وقال ابن خلكان رأيته مراراً راكباً بهيمة وهو يصعد إلى جبل الصالحية وحوله اثنان أو ثلاثة كل واحد يقرأ ميعاده في غير موضع الآخر وهو يرد على الجميع؛ من تصانيفه التفسير إلى الكهف في أربع مجلدات وشرح الشاطبية في مجلدين وشرح المفصل للزمخشري في أربع مجلدات وجمال القراء وتاج الإقراء {cite:shadharat-dhahab p. 230-231}."
  en: "Damascus's master of qira'at (d. Jumada II 643, Qasyun) — pupil of al-Shatibi himself; Dhahabi knew no one in Islam who transmitted more readings; Ibn Khallikan watched him ride up Salihiyya answering three students at once; author of a four-volume tafsir to al-Kahf and a Sharh al-Mufassal {cite:shadharat-dhahab p. 230-231}."
  fr: "maître de Damas de qira'at (d. Jumada II 643, Qasyun) - élève d'al-Shatibi lui-même ; Dhahabi ne connaissait personne dans l'Islam qui transmettait plus de lectures ; Ibn Khallikan l'a regardé monter Salihiyya répondant à trois étudiants à la fois ; auteur d'un tafsir en quatre volumes à al-Kahf et un Sharh al-Mufassal {cite:shadharat-dhahab p. 230-231}."
  es: "Maestro de qira'at de Damasco (m. Jumada II 643, Qasyun) — discípulo del propio al-Shatibi; Dhahabi no conoció a nadie en el Islam que transmitiera más lecturas; Ibn Khallikan lo vio subir a Salihiyya respondiendo a tres estudiantes a la vez; autor de un tafsir de cuatro volúmenes sobre al-Kahf y un Sharh al-Mufassal {cite:shadharat-dhahab p. 230-231}."
  ur: "دمشق کا قاریات کا ماسٹر ⁦(متوفی جمعۃ دوم 643، قصیون)⁩ - خود الشاطبی کا شاگرد؛ ذہبی کو اسلام میں کسی ایسے شخص کے بارے میں نہیں معلوم تھا جس نے زیادہ تلاوت کی ہو۔ ابن خلیقان نے اسے صالحیہ پر سوار ہوتے ہوئے دیکھا جو بیک وقت تین طالب علموں کو جواب دیتے تھے۔ چار جلدوں پر مشتمل تفسیر الکہف اور شرح المفصل کے مصنف۔ 230-231}۔"
  tr: "Şafii dilbilgicisi; okumaları El-Şatibi ve diğerlerinin yanında okumuş, zamanının halkını okumalarda geride bırakmış ve Şam'da ilavet ve edebiyatın liderliğini elinde tutmuştur. Yalnızca Allah'ın sayabileceği kişiler tarafından eğitilmiştir; El-Dahabi şöyle demiştir: İslam'da kendisinden daha fazla okuma okuduğuna dair kimse tanımadım. İbn Hallikan şöyle demiştir: Onu birçok kez Salihiye Dağı'na tırmanırken, iki ya da üç kişinin etrafında farklı yerlerde okuma okurken ve herkese cevap verirken gördüm. Eserleri arasında dört ciltlik Tafsir'i ila-el-Kahf, iki ciltlik Şerhi şetmişibiyye, dört ciltlik el-Zemakşşari'nin El-Mufassal'ı, Cemal-Kurra'a ve Tac al-İkra' {cite:shadharat-dhahab, s. 230-231} bulunmaktadır."
  id: "Pembaca tata bahasa Syafi'i; ia membacakan bacaan di bawah Al-Shatibi dan lainnya hingga melampaui orang-orang sezamannya dalam pembacaan, dan ia memimpin pembacaan dan sastra di Damaskus. Ia diajarkan oleh orang-orang yang hanya Tuhan yang dapat menghitung; Al-Dhahabi berkata: Saya tidak pernah mengenal siapa pun dalam Islam yang ia bacakan lebih banyak daripada yang pernah ia baca. Ibn Khallikan berkata: Saya sering melihatnya menunggang hewan saat mendaki Gunung Al-Salihiyah, dikelilingi oleh dua atau tiga orang, masing-masing membacakan bacaannya di tempat berbeda dari yang lain, menjawab semua orang. Di antara karya-karyanya adalah Tafsir ila al-Kahf dalam empat jilid, Sharh al-Shatibiyyah dalam dua jilid, Al-Mufassal oleh al-Zamakhshari dalam empat jilid, Jamal al-Qurra'a, dan Taj al-Iqra' {cite:shadharat-dhahab, hlm. 230-231}."
