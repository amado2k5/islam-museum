summary:
  ar: "إسماعيل بن أبي خالد البجلي الأحسمي الكوفي، حافظ ومحدث الكوفة في زمانه وقد أدرك خمسة من الصحابة؛ توفي سنة ١٤٦هـ بحسب أبي نعيم."
  en: "Isma'il ibn Abi Khalid al-Bajali al-Ahmasi of Kufa, a hadith memoriser and the leading hadith scholar of Kufa in his time who heard from five Companions; he died in 146 AH according to Abu Nu'aym."
  es: "Isma'il ibn Abi Khalid al-Bajali al-Ahmasi de Kufa, memorizador de hadices y el principal erudito en hadices de Kufa en su época, que escuchó a cinco Compañeros; murió en el año 146 de la Hégira según Abu Nu'aym."
  fr: "Isma'il ibn Abi Khalid al-Bajali al-Ahmasi de Kufa, mémorisateur de hadiths et principal érudit en hadiths de Kufa à son époque, qui a reçu des enseignements de cinq Compagnons; il est mort en 146 AH selon Abu Nu'aym."
  ur: "کوفہ کے اسماعیل بن ابی خالد البجلی الاحماسی، ایک حدیث کے حافظ اور اپنے زمانے میں کوفہ کے معروف محدث تھے جنہوں نے پانچ صحابہ سے سنا؛ ان کی وفات ابو نعیم کے مطابق 146ھ میں ہوئی۔"
