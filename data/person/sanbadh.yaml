summary:
  ar: "سنباذ الخارج بالري في أول دولة بني العباس؛ قاتله عمر بن العلاء جزار الري في جمع جمعه فأبلى ونكى."
  en: "Sanbadh, who rose at Rayy in the first days of the Abbasid state; Umar ibn al-Ala' the butcher fought him with his gathered band and wounded him sore."
  es: "Sanbadh, que se alzó en Rayy en los primeros días del estado abasí; Umar ibn al-Ala' el carnicero luchó contra él con su banda reunida y lo hirió gravemente."
  fr: "Sanbadh, qui s'était soulevé à Rayy dans les premiers jours de l'État abbasside; Umar ibn al-Ala' le boucher l'a combattu avec sa bande rassemblée et l'a grièvement blessé."
  ur: "سنبد، جو عباسی ریاست کے پہلے دنوں میں رے میں طلوع ہوا؛ عمر بن الاعلٰی قصاب نے اپنے جمع شدہ دستے کے ساتھ اس سے لڑا اور اسے شدید زخمی کردیا۔"
  tr: "Erken Abbasi devletinde Rayy'de dışını yerinden edeceğiz; Cuma toplantısında Rayy'nin kasabı Ömer bin al-Alaa tarafından öldürüldü, ama reddetti ve haykırdı."
  id: "Kita akan menggeser bagian luar di Rayy pada masa awal negara Abbasiyah; ia dibunuh oleh Umar ibn al-Alaa, tukang jagal Rayy, dalam pertemuan Jumat, tetapi ia menolak dan berteriak."
