summary:
  ar: "قائد عسكري ببغداد؛ أنفذه المقتدر مع الغلمان الحجرية إلى المشهدى لما بلغ مسير مؤنس سنة 320هـ فلما قربوا جعل عسكره يتسللون ويهربون إلى بغداد فرجع إلى عكبرا ثم عادوا إلى بغداد، وأشار على المقتدر باللقاء وقوى نفسه بأن القوم متى رأوه صادوا بأجمعهم إليه {cite:kamil-ibn-al-athir p. 179-180}. وعند ابن الأثير ظهر وقام بالحجبة بعد القبض على مؤنس فرأى كراهية طريف السبكري والساجية له فاختفى وهرب إلى أبيه بفارس فكاتبه القاهر يلومه على عجلته بالهرب وقلده كور الأهواز {cite:kamil-ibn-al-athir p. 191}"
  en: "Baghdad commander sent against Mu'nis in 320 whose men deserted; he talked the despairing caliph out of flight to Wasit and into meeting the enemy {cite:kamil-ibn-al-athir p. 179-180}."
