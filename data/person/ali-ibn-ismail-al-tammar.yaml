  tr: "Ali ibn İsmail ibn Maytham al-Tammar, İmalık doktrini hakkında ilk konuşan kişiydi ve Maytham, Ali'nin önde gelen sahabeleri arasındaydı. İmamat Kitabı ve Liyakat Kitabı'nı yazdı {atıf:fihrist-ibn-al-nadim s. 249}."
  id: "Ali ibn Ismail ibn Maytham al-Tammar adalah yang pertama berbicara tentang doktrin Imamat, dan Maytham adalah salah satu sahabat terkemuka Ali. Ia menulis Kitab Imamate dan Kitab Merit {cite:fihrist-ibn-al-nadim hlm. 249}."
