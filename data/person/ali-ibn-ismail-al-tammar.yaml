summary:
  ar: "علي بن إسماعيل بن ميثم التمار أول من تكلم في مذهب الإمامة، وميثم من جلة أصحاب علي، وله كتاب الإمامة وكتاب الاستحقاق {cite:fihrist-ibn-al-nadim p. 249}."
