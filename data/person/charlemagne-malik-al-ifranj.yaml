id: person/charlemagne-malik-al-ifranj
class: person
label: { ar: "قارله بن تبين ملك الإفرنجة", en: "Qarla ibn Tabin", es: "Qarla ibn Tabin", fr: "Qarla ibn Tabin", ur: "قرلہ ابن تبین" }
summary:
  ar: "ملك الإفرنجة في قائمة عرماز أسقف جربدة، كانت ولايته ستاً وعشرين سنة وكان في أيام الحكم صاحب الأندلس، وتدافع أولاده بعده حتى تفانت الإفرنجة بسببهم؛ يعرف في التواريخ اللاتينية بشارلمان {cite:muruj-al-dhahab p. 358-359}."
  en: "'Qarla ibn Tabin', the Frankish king whose 26-year reign fell in al-Hakam's days and whose sons' strife nearly destroyed the Franks — the regnal list's rendering of Charlemagne {cite:muruj-al-dhahab p. 358-359}."
  es: "'Qarla ibn Tabin', el rey franco cuyo reinado de 26 años coincidió con la época de al-Hakam y cuyas luchas entre hijos casi destruyeron a los francos: la traducción de Carlomagno en la lista de reinados {cite:muruj-al-dhahab p. 358-359}."
  fr: "'Qarla ibn Tabin', le roi franc dont le règne de 26 ans s'est déroulé à l'époque d'al-Hakam et dont les luttes entre fils ont presque détruit les Francs — la traduction de Charlemagne dans la liste royale {cite:muruj-al-dhahab p. 358-359}."
  ur: "'قرلا ابن تبین'، فرینک کا بادشاہ جس کا 26 سالہ دور الحکم کے دنوں میں ختم ہوا اور جس کے بیٹوں کی لڑائی نے تقریباً فرینکوں کو تباہ کر دیا - شارلیمین کی رجال فہرست کی پیش کش {حوالہ: مروج الذہاب صفحہ۔ 358-359}۔"
  tr: "Frank kralı, Djerbada Piskoposu Armaz olarak listelenmiştir. Saltanatı yirmi altı yıl sürmüştür. El-Endülüs hükümdarının saltanatı sırasında, oğulları Franklar onların yüzünden ölene kadar onun peşinden mücadele etti; Latince tarihlerde Şarlman olarak bilinir {cite:muruj-al-dhahab s. 358-359}."
  id: "Raja Franka tercatat sebagai Armaz, Uskup Djerbada. Pemerintahannya berlangsung selama dua puluh enam tahun. Selama masa pemerintahan penguasa al-Andalus, putra-putranya berjuang mengejarnya hingga bangsa Franka meninggal karena mereka; ia dikenal dalam sejarah Latin sebagai Charlemagne {cite:muruj-al-dhahab hlm. 358-359}."
