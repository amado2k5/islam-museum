summary:
  ar: "من وجوه أهل المدينة، خرج هو وعبد الله بن حنظلة الغسيل على مسرف بن عقبة يوم الحرة، ثم استعمله ابن الزبير على الكوفة فأخرجه المختار بن أبي عبيد من قصر الإمارة وغلب عليها {cite:muruj-al-dhahab p. 67,71}."
  en: "The Medinan noble who commanded with Ibn Hanzala at the Harra, then governed Kufa for Ibn al-Zubayr until al-Mukhtar drove him from the citadel {cite:muruj-al-dhahab p. 67,71}."
  fr: "Le notable médinois qui commanda avec Ibn Hanzala à la Harra, puis gouverna Koufa pour Ibn al-Zubayr jusqu'à ce qu'al-Mukhtar le chasse de la citadelle {cite:muruj-al-dhahab p. 67,71}."
  es: "El noble medinense que comandó con Ibn Hanzala en Harra, luego gobernó Kufa para Ibn al-Zubayr hasta que al-Mukhtar lo expulsó de la ciudadela {cite:muruj-al-dhahab p. 67,71}."
  ur: "مدینہ کے رئیس جس نے ابن حنظلہ کے ساتھ حرہ میں حکم دیا، پھر ابن الزبیر کے لیے کوفہ پر حکومت کی یہاں تک کہ المختار نے اسے قلعہ سے نکال دیا۔ 67,71}۔"
  tr: "Medine'nin önde gelen şahsiyetlerinden biriydi. Abdullah bin Hanzala el-Ghasil ile birlikte Harra günü Musrif bin Ukba'ya karşı çıktılar. Daha sonra İbn el-Zübeyr onu Kufe valisi olarak atadı, ancak el-Muhtar bin Ebu Ubeyd onu valilik sarayından kovdu ve sarayın kontrolünü ele geçirdi. {kaynak: Muruj el-Dhahab s. 67,71}"
  id: "Dia adalah salah satu tokoh terkemuka di Madinah. Dia dan Abdullah bin Hanzala al-Ghasil ikut berperang melawan Musrif bin Uqba pada hari al-Harra. Kemudian Ibn al-Zubayr mengangkatnya sebagai gubernur Kufa, tetapi al-Mukhtar bin Abi Ubaid mengusirnya dari istana gubernur dan mengambil alihnya. {cite:muruj-al-dhahab hlm. 67,71}"
