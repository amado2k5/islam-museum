summary:
  ar: "فنسنت تان (وُلد في 23 شباط 1952 في باتو باهات بولاية جوهر) رجل أعمال ومستثمر ماليزي من أصل صيني، مؤسس ورئيس مجموعة برجايا المتنوعة، بدأ موظفًا في بنك وبائعًا للتأمين على الحياة قبل أن يحرز امتياز ماكدونالدز في ماليزيا سنة 1981 ويبني برجايا من شركة صغيرة إلى تكتل يضم سبورتس توتو والعقارات والأغذية والاتصالات، ومالك أندية كارديف سيتي وساراييفو البوسني وكورتريك البلجيكي، وأسس مؤسسة «ماليزيون أفضل» للعطاء التعليمي."
  en: "Vincent Tan (born 23 February 1952 at Batu Pahat, Johor) is a Malaysian business magnate and investor of Chinese descent, founder and chairman of the diversified Berjaya Corporation; he began as a bank clerk and life-insurance salesman, won the McDonald's franchise for Malaysia in 1981, and built Berjaya into a conglomerate spanning Sports Toto, property, food and telecommunications, owned the football clubs Cardiff City, FK Sarajevo and KV Kortrijk, and founded the Better Malaysia Foundation for educational giving."
  ur: "ونسنٹ ٹان (پیدائش 23 فروری 1952، باتو پاہت، جوہر) چینی نسل کے ملائیشیائی کاروباری و سرمایہ کار ہیں، متنوع برجایا کارپوریشن کے بانی و چیئرمین؛ انھوں نے بینک کلرک اور لائف انشورنس سیلزمین کے طور پر آغاز کیا، 1981 میں ملائیشیا کے لیے میکڈونلڈز کی فرنچائز حاصل کی، اور برجایا کو اسپورٹس ٹوٹو، جائیداد، خوراک و ٹیلی کمیونیکیشن پر مشتمل گروپ بنایا، کارڈف سٹی، ایف کے سرائیوو اور کے وی کورٹرائیک فٹبال کلبوں کے مالک رہے، اور تعلیمی عطیات کے لیے بیٹر ملائیشیا فاؤنڈیشن قائم کی۔"
