summary:
  ar: "ضابط عثماني وتركي، قائد حامية المدينة المنورة ومحافظها من 1916 إلى 1919، صمد في حصارها حتى بعد هدنة الحرب العالمية الأولى فعُرف بمدافع المدينة ونمر الصحراء. وبعد الحرب كان سفير تركيا في كابول من 1922 إلى 1926. توفي سنة 1948 ودُفن في مقبرة أشيان بإسطنبول."
  en: "Ottoman and Turkish officer, commander and governor of Medina from 1916 to 1919, who held the city through its siege until after the First World War armistice and became known as the Defender of Medina and the Tiger of the Desert. After the war he was Turkey's ambassador to Kabul from 1922 to 1926. He died in 1948 and was buried at Aşiyan Cemetery, Istanbul."
  ur: "عثمانی و ترک افسر، 1916 سے 1919 تک مدینہ کے کمانڈر اور گورنر، جنہوں نے پہلی جنگِ عظیم کی جنگ بندی کے بعد تک شہر کے محاصرے میں ثابت قدمی دکھائی اور مدینہ کے محافظ اور صحرا کے شیر کہلائے۔ جنگ کے بعد وہ 1922 سے 1926 تک کابل میں ترکی کے سفیر رہے۔ 1948 میں وفات پائی اور اسطنبول کے آشیان قبرستان میں دفن ہوئے۔"
