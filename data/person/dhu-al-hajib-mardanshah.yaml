summary:
  ar: "قائد فارسي بعثته الفرس إلى العرب يوم الجسر؛ عند البلاذري كان أنوشروان لقّبه بهمن لتبركه به وسُمي ذا الحاجب لأنه كان يعضب حاجبيه ليرفعهما عن عينه كبراً ويقال إن اسمه رستم ولقي المسلمين في أربعة آلاف مدجج ومعه فيل."
  en: "Persian commander sent against the Arabs at the Day of the Bridge; in al-Baladhuri Anushirwan had named him Bahman for blessing, he was called Dhu al-Hajib for tying his brows up over his eyes in pride — though his name is said to be Rustam — and he met the Muslims with four thousand mailed men and an elephant."
