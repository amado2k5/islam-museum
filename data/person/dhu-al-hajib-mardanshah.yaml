id: person/dhu-al-hajib-mardanshah
class: person
label: { ar: "ذو الحاجب مردانشاه", en: "Dhu al-Hajib Mardanshah", es: "Dhu al-Hajib Mardanshah", fr: "Dhu al-Hajib Mardanshah", ur: "ذی الحجیب مردان شاہ" }
summary:
  ar: "قائد فارسي بعثته الفرس إلى العرب يوم الجسر؛ عند البلاذري كان أنوشروان لقّبه بهمن لتبركه به وسُمي ذا الحاجب لأنه كان يعضب حاجبيه ليرفعهما عن عينه كبراً ويقال إن اسمه رستم ولقي المسلمين في أربعة آلاف مدجج ومعه فيل. وعند المسعودي هو بهمن بن جاذويه بارز القعقاع بن عمرو يوم أغواث فناداه القعقاع يا لثارات أبي عبيد وسليط وأصحابهم يوم الجسر فقتله {cite:muruj-al-dhahab p. 610}"
  en: "Persian commander sent against the Arabs at the Day of the Bridge; in al-Baladhuri Anushirwan had named him Bahman for blessing, he was called Dhu al-Hajib for tying his brows up over his eyes in pride — though his name is said to be Rustam — and he met the Muslims with four thousand mailed men and an elephant."
  es: "Comandante persa enviado contra los árabes en el Día del Puente; en al-Baladhuri Anushirwan lo había llamado Bahman por bendición, fue llamado Dhu al-Hajib por atarse las cejas sobre los ojos con orgullo —aunque se dice que su nombre es Rustam— y se enfrentó a los musulmanes con cuatro mil hombres armados y un elefante."
  fr: "Commandant perse envoyé contre les Arabes le jour du Pont; dans al-Baladhuri, Anushirwan l'avait nommé Bahman pour bénédiction, il était appelé Dhu al-Hajib pour avoir froncé les sourcils sur ses yeux par fierté — bien que son nom soit dit Rustam — et il a affronté les musulmans avec quatre mille hommes en armure et un éléphant."
  ur: "پل کے دن عربوں کے خلاف فارسی کمانڈر بھیجا۔ البلادوری میں انوشیروان نے اس کا نام برکت کے لیے بہمن رکھا تھا، اسے غرور میں اپنی آنکھوں پر بھوئیں باندھنے کی وجہ سے ذو الحجیب کہا گیا تھا- حالانکہ اس کا نام رستم بتایا جاتا ہے- اور اس نے چار ہزار ڈاکوؤں اور ایک ہاتھی کے ساتھ مسلمانوں سے ملاقات کی۔"
  tr: "Köprü günü Persler tarafından Araplara gönderilen bir Pers komutan; el-Baladhuri'ye göre, Anuşirvan ona kutsadığı için Bahman lakabını vermiş, kaşlarını gözünden kaldırmak için deldiği için Dhu al-Hajib olarak anılmıştır. Adının Rustam olduğu söylenir ve Müslümanlarla dört bin silahlı adam ve bir fil ile karşılaşmıştır. al-Mas'udi'ye göre, Agawath gününde el-Ka'ka ibn Amr'in önde gelen figürü Bahman ibn Jadhawayh'dir. Al-Ka'qa' ona 'Ey Ebu Ubeyd, Suleyt ve arkadaşlarının köprü günü intikamı' diye seslendi ve Ebu onu öldürdü {alıntı:muruj-al-dhahab, s. 610}"
  id: "Seorang komandan Persia yang dikirim oleh orang Persia kepada orang Arab pada hari jembatan berada; menurut al-Baladhuri, Anushirwan memberinya julukan Bahman karena berkatnya, dan ia disebut Dhu al-Hajib karena ia biasa menusuk alisnya untuk mengangkatnya dari matanya. Dikatakan namanya Rustam, dan ia bertemu dengan umat Muslim dengan empat ribu orang bersenjata dan seekor gajah. Menurut al-Mas'udi, ia adalah Bahman ibn Jadhawayh, tokoh terkemuka al-Qa'qa' ibn Amr pada hari Agawath. Al-Qa'qa' memanggilnya, 'O balas dendam Abu Ubayd, Sulayt, dan para sahabat mereka pada hari jembatan,' dan ia membunuhnya {cite:muruj-al-dhahab, hlm. 610}"
