summary:
  ar: "أبو بكر محمد بن أحمد بن علي بن شاهويه الفارسي الفقيه الشافعي؛ ذكره الحاكم أبو عبد الله في تاريخ نيسابور؛ أقام بنيسابور زماناً ثم خرج إلى بخارا ثم انصرف إلى نيسابور ورحل إلى بلاد فارس فوُلي القضاء بها ثم رجع إلى نيسابور فحدّث بها؛ وله في المذهب وجوه بعيدة تفرد بها {cite:wafayat-ayan}."
  en: "Abu Bakr Muhammad ibn Ahmad ibn Ali ibn Shahuya al-Farisi, the Shafi'i jurist. Al-Hakim Abu Abd Allah mentioned him in his History of Nishapur. He stayed in Nishapur for a time, then went out to Bukhara, then returned to Nishapur, and travelled to the lands of Fars, where he was appointed judge; then he came back to Nishapur and transmitted hadith there. He held unusual views within the school, which he alone held {cite:wafayat-ayan}."
