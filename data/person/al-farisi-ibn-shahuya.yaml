id: person/al-farisi-ibn-shahuya
class: person
label: { ar: "ابن شاهويه الفارسي", en: "Ibn Shahuya", fr: "Ibn Shahuya", es: "Ibn Shahuya", ur: "ابن شہویہ" }
died: { edtf: "0972~", hijri: "0362", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي سنة اثنتين وستين وثلاثمائة بنيسابور {cite:wafayat-ayan}." }
summary:
  ar: "أبو بكر محمد بن أحمد بن علي بن شاهويه الفارسي الفقيه الشافعي؛ ذكره الحاكم أبو عبد الله في تاريخ نيسابور؛ أقام بنيسابور زماناً ثم خرج إلى بخارا ثم انصرف إلى نيسابور ورحل إلى بلاد فارس فوُلي القضاء بها ثم رجع إلى نيسابور فحدّث بها؛ وله في المذهب وجوه بعيدة تفرد بها {cite:wafayat-ayan}."
  en: "Abu Bakr Muhammad ibn Ahmad ibn Ali ibn Shahuya al-Farisi, the Shafi'i jurist. Al-Hakim Abu Abd Allah mentioned him in his History of Nishapur. He stayed in Nishapur for a time, then went out to Bukhara, then returned to Nishapur, and travelled to the lands of Fars, where he was appointed judge; then he came back to Nishapur and transmitted hadith there. He held unusual views within the school, which he alone held {cite:wafayat-ayan}."
  fr: "Abu Bakr Muhammad ibn Ahmad ibn Ali ibn Shahuya al-Farisi, juriste chaféite. Al-Hakim Abu Abd Allah le mentionna dans son Histoire de Nishapur. Il séjourna quelque temps à Nishapur, puis partit à Boukhara, revint à Nishapur et voyagea dans les pays du Fars, où il fut nommé juge ; il revint ensuite à Nishapur et y transmit le hadith. Il professait au sein de l’école des opinions inhabituelles qui lui étaient propres {cite:wafayat-ayan}."
  es: "Abu Bakr Muhammad ibn Ahmad ibn Ali ibn Shahuya al-Farisi, el jurista shafi'í. Al-Hakim Abu Abd Allah lo menciona en su Historia de Nishapur. Permaneció en Nishapur durante un tiempo, luego se dirigió a Bujará, regresó a Nishapur y viajó a las tierras de Fars, donde fue nombrado juez; posteriormente volvió a Nishapur y transmitió hadices allí. Sostenía puntos de vista singulares dentro de la escuela, que él solo defendía {cite:wafayat-ayan}."
  ur: "ابوبکر محمد بن احمد بن علی ابن شاہویہ الفارسی، شافعی فقیہ۔ الحاکم ابو عبد اللہ نے اپنی تاریخ نیشاپور میں ان کا تذکرہ کیا ہے۔ وہ کچھ عرصہ نیشاپور میں رہے، پھر بخارا چلے گئے، پھر نیشاپور واپس آئے، اور فارس کی سرزمین کا سفر کیا، جہاں وہ قاضی مقرر ہوئے۔ پھر نیشاپور تشریف لے گئے اور وہاں حدیث سنائی۔ وہ اسکول کے اندر غیر معمولی خیالات رکھتا تھا، جسے وہ اکیلے ہی رکھتا تھا۔"
  tr: "Şafiî fıkıhçısı Ebu Bekir Muhammed ibn Ahmed ibn Ali ibn Şahveyh el-Farsi; El-Hakim Ebu Abdullah tarafından Nişapur Tarihi'nde anılmıştır; bir süre Nişapur'da kaldıktan sonra Buhara'ya gitmiş, ardından Nişapur'a dönerek İran'a seyahat etmiş, orada kadı olarak atanmış, daha sonra Nişapur'a dönerek hadis rivayet etmiştir; ve mezhebine dair kendine özgü, alışılmadık bazı görüşleri vardı."
  id: "Abu Bakr Muhammad ibn Ahmad ibn Ali ibn Shahwayh al-Farsi, seorang ahli hukum mazhab Syafi'i; disebutkan oleh al-Hakim Abu Abdullah dalam Sejarah Nishapur; beliau tinggal di Nishapur untuk beberapa waktu, kemudian pergi ke Bukhara, lalu kembali ke Nishapur dan melakukan perjalanan ke Persia, di mana beliau diangkat menjadi hakim, kemudian kembali ke Nishapur dan meriwayatkan hadits di sana; dan beliau memiliki beberapa pandangan yang tidak biasa tentang mazhab pemikiran yang unik baginya."
