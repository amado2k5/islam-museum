summary:
  ar: "أبو العلاء زهر بن عبد الملك الإيادي الإشبيلي طبيب الأندلس وصاحب التصانيف؛ أخذ عن أبيه وحدث عن أبي علي الغساني وجماعة، ونال دنيا عريضة ورياسة كبيرة وله شعر رائق نُكب في الآخر من الدولة؛ قال ابن الأبار له شعر رائق ورياسة عظيمة وأموال عظيمة وهو أحد شيوخ أبي الخطاب بن دحية، وكان يحفظ شعر ذي الرمة وهو ثلث اللغة مع معرفة الطب التامة وأهل بيته كلهم وزراء علماء؛ توفي سنة خمس وعشرين وخمسمائة {cite:shadharat-dhahab p. 554-555}."
  en: "Abu al-Ala Zuhr ibn Abd al-Malik al-Iyadi of Seville — physician of al-Andalus and author, who took from his father and transmitted from Abu Ali al-Ghassani; he won broad fortune and great leadership with fine poetry before being stricken late by the state; Ibn al-Abbar credits him with splendid verse and wealth, a shaykh of Abu al-Khattab Ibn Dihya, who kept Dhu al-Rumma's poetry — 'a third of the language' — alongside complete mastery of medicine, in a house whose men were all vizier-scholars; d. 525 {cite:shadharat-dhahab p. 554-555}."
