summary:
  ar: "أبو العلاء زهر بن عبد الملك الإيادي الإشبيلي طبيب الأندلس وصاحب التصانيف؛ أخذ عن أبيه وحدث عن أبي علي الغساني وجماعة، ونال دنيا عريضة ورياسة كبيرة وله شعر رائق نُكب في الآخر من الدولة؛ قال ابن الأبار له شعر رائق ورياسة عظيمة وأموال عظيمة وهو أحد شيوخ أبي الخطاب بن دحية، وكان يحفظ شعر ذي الرمة وهو ثلث اللغة مع معرفة الطب التامة وأهل بيته كلهم وزراء علماء؛ توفي سنة خمس وعشرين وخمسمائة {cite:shadharat-dhahab p. 554-555}."
  en: "Abu al-Ala Zuhr ibn Abd al-Malik al-Iyadi of Seville — physician of al-Andalus and author, who took from his father and transmitted from Abu Ali al-Ghassani; he won broad fortune and great leadership with fine poetry before being stricken late by the state; Ibn al-Abbar credits him with splendid verse and wealth, a shaykh of Abu al-Khattab Ibn Dihya, who kept Dhu al-Rumma's poetry — 'a third of the language' — alongside complete mastery of medicine, in a house whose men were all vizier-scholars; d. 525 {cite:shadharat-dhahab p. 554-555}."
  fr: "Abu al-Ala Zuhr ibn Abd al-Malik al-Iyadi de Séville — médecin d'al-Andalus et auteur, qui reçut de son père et transmit d'Abu Ali al-Ghassani ; il acquit une large fortune et une grande primauté, avec une belle poésie, avant d'être frappé tardivement par l'État ; Ibn al-Abbar lui reconnaît des vers splendides et de la richesse, et en fait l'un des shaykhs d'Abu al-Khattab Ibn Dihya, qui savait la poésie de Dhu al-Rumma — « un tiers de la langue » — avec une maîtrise complète de la médecine, dans une maison dont les hommes étaient tous des vizirs savants ; mort en 525 {cite:shadharat-dhahab p. 554-555}."
  es: "Abu al-Ala Zuhr ibn Abd al-Malik al-Iyadi de Sevilla — médico de al-Ándalus y autor, que heredó de su padre y transmitió de Abu Ali al-Ghassani; obtuvo gran fortuna y un importante liderazgo con su fina poesía antes de ser afectado tardíamente por el estado; Ibn al-Abbar le atribuye espléndidos versos y riqueza, fue shaykh de Abu al-Khattab Ibn Dihya, quien conservó la poesía de Dhu al-Rumma — 'un tercio del idioma' — junto con un dominio completo de la medicina, en una casa cuyos hombres eran todos visires-eruditos; murió en 525 {cite:shadharat-dhahab p. 554-555}."
  ur: "ابو العلا ظہر ابن عبد الملک العیادی آف سیویل - اندلس کے طبیب اور مصنف، جنہوں نے اپنے والد سے لیا اور ابو علی الغسانی سے نقل کیا؛ اس نے ریاست کی طرف سے دیر سے متاثر ہونے سے پہلے عمدہ شاعری کے ساتھ وسیع قسمت اور عظیم قیادت حاصل کی۔ ابن العبر نے اسے شاندار آیت اور دولت کا سہرا دیا، ابو الخطاب ابن دحیہ کے ایک شیخ، جنہوں نے ذو الرمہ کی شاعری - 'زبان کا ایک تہائی' - طب پر مکمل عبور کے ساتھ ساتھ، ایک ایسے گھر میں رکھا جس کے تمام مرد وزیر تھے؛ d 525 {حوالہ: شدھارت ذہاب ص۔ 554-555}۔"
