summary:
  ar: "محدث هندي ديوبندي ⁦(1898–1982)⁩، شيخ الحديث بمظاهر العلوم في سهارنبور. من أعلام الحديث في شبه القارة الهندية في القرن العشرين، من مؤلفاته «أوجز المسالك إلى موطأ مالك» الموسوعي في شرح الموطأ، و«لامع الدراري» في السيرة، و«فضائل أعمال» المقرؤ على نطاق واسع في جماعة الدعوة."
  en: "Indian Deobandi hadith scholar (1898–1982), Shaykh al-Hadith at Mazahir Uloom, Saharanpur. A leading hadith authority of twentieth-century South Asia; his works include the encyclopedic Awjaz al-Masalik commentary on Malik's Muwatta, Lami' al-Darari on the sira, and Faza'il-e-A'mal, widely read in the Tablighi Jamaat."
  ur: "ہندوستانی دیوبندی محدث ⁦(1898–1982)⁩ جو مظاہر علوم سہارنپور کے شیخ الحدیث تھے۔ بیسویں صدی کے برِصغیر کے ممتاز محدثین میں شمار ہوتے ہیں؛ ان کی تصانیف میں موطأ کی موسوعانہ شرح «اوجز المسالک»، سیرت پر «لامع الدراری» اور تبلیغی جماعت میں وسیع پڑھنے والی «فضائلِ اعمال» شامل ہیں۔"
