  did_you_know:
    ar: "عبد المطلب جدّ النبي وكافله ومن كبار شيوخ قريش، يذكره التقليد بحفر بئر زمزم وقيادته مكة زمن حملة أبرهة."
    en: "Abd al-Muttalib, the Prophet's grandfather and guardian and a leading Quraysh elder, is remembered for digging the Zamzam well and leading Mecca in Abraha's year."
