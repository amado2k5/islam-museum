summary:
  en: "The Prophet Muhammad's grandfather and guardian, a leading elder of Quraysh remembered in tradition for restoring the well of Zamzam and leading Mecca at the time of Abraha's campaign."
  fr: "Grand-père et tuteur du Prophète Muhammad, éminent ancien de Quraysh dont la tradition retient qu'il remit au jour le puits de Zamzam et dirigeait La Mecque au temps de la campagne d'Abraha."
  ar: "جدّ النبي محمد وكافله، ومن كبار شيوخ قريش، يُذكر في التقليد بحفره بئر زمزم وبقيادته مكة زمن حملة أبرهة. وتنازعت الفرق في إيمانه فمنهم من رآه كان مسلماً موحداً ومنهم من رآه وغيره من آباء النبي كان مشركاً إلا من صح إيمانه، وكان يوصي ولده بصلة الأرحام وإطعام الطعام وجعل السقاية والرفادة لابنه عبد مناف أبي طالب وأوصاه بالنبي {cite:muruj-al-dhahab p. 447}، وكان له عند المسعودي ستة عشر ولداً عشرة ذكور العباس وحمزة والزبير وحجل والمقوم وضرار والحارث وأبو لهب وعبد الله وأبو طالب وست إناث عاتكة وصفية وأميمة والبيضاء وبرة وأروى ولم يسلم منهن إلا صفية وتنوزع في إسلام أروى {cite:muruj-al-dhahab p. 583-584}"
  es: "El abuelo y tutor del profeta Mahoma, un destacado anciano de los Quraysh, recordado en la tradición por restaurar el pozo de Zamzam y liderar La Meca en la época de la campaña de Abraha."
  ur: "پیغمبر اسلام کے دادا اور سرپرست، قریش کے ایک سرکردہ بزرگ کو روایت میں ابرہہ کی مہم کے وقت زمزم کے کنویں کی بحالی اور مکہ کی قیادت کے لیے یاد کیا جاتا ہے۔"
  tr: "Peygamber Muhammed'in dedesi ve vasisi, Kureyş'in önde gelen büyüklerinden biri olan bu kişi, rivayetlerde Zemzem kuyusunu kazması ve İbrahim seferi sırasında Mekke'ye önderlik etmesiyle anılır. Alimler arasında inancı konusunda görüş ayrılığı vardır; bazıları onun tek tanrılı bir Müslüman olduğuna inanırken, diğerleri onun ve Peygamber'in diğer atalarının, inancı tasdik edilmiş olanlar hariç, çok tanrılı olduğuna inanmaktadır. Oğullarına akrabalık bağlarını korumalarını, açları doyurmalarını öğütlemiş ve su ve yiyecek temini sorumluluğunu oğlu Abd Manaf Ebu Talib'e emanet etmiş, Peygamber'i de ona emanet etmiştir. {cite:muruj-al-dhahab s. 447} El-Mes'udi'ye göre onun on altı çocuğu vardı: on oğlu - el-Abbas, Hamza, el-Zübeyr, Hacl, el-Mukavim, Dirar, el-Haris, Ebu Leheb, Abdullah ve Ebu Talib - ve altı kızı - Atika, Safiyye, Umeyme, el-Beyda, Barra ve Arwa. Bunlardan yalnızca Safiyye İslam'ı kabul etti ve Arwa'nın din değiştirmesi konusunda anlaşmazlıklar var. {alıntı:muruj-al-dhahab s. 583-584}"
  id: "Kakek dan wali Nabi Muhammad, dan salah satu tetua terkemuka Quraisy, dikenang dalam tradisi karena menggali sumur Zamzam dan memimpin Mekah selama kampanye Ibrahim. Terdapat perbedaan pendapat di antara para ulama mengenai keyakinannya; sebagian percaya bahwa ia adalah seorang Muslim monoteistik, sementara yang lain percaya bahwa ia dan leluhur Nabi lainnya adalah politeis, kecuali mereka yang imannya telah dikukuhkan. Ia menasihati putra-putranya untuk menjaga hubungan kekerabatan, memberi makan orang-orang yang lapar, dan mempercayakan tanggung jawab menyediakan air dan makanan kepada putranya, Abdullah Abu Talib, dan ia mempercayakan Nabi kepadanya. {cite:muruj-al-dhahab p. 447} Menurut al-Mas'udi, ia memiliki enam belas anak: sepuluh putra—al-Abbas, Hamzah, al-Zubayr, Hajl, al-Muqawwim, Dirar, al-Harith, Abu Lahab, Abdullah, dan Abu Thalib—dan enam putri—Atika, Safiyya, Umayma, al-Bayda, Barra, dan Arwa. Dari jumlah tersebut, hanya Safiyya yang memeluk Islam, dan terdapat perbedaan pendapat mengenai masuknya Arwa. {mengutip:muruj-al-dhahab hal. 583-584}"
