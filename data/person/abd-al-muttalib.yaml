summary:
  en: "The Prophet Muhammad's grandfather and guardian, a leading elder of Quraysh remembered in tradition for restoring the well of Zamzam and leading Mecca at the time of Abraha's campaign."
  ar: "جدّ النبي محمد وكافله، ومن كبار شيوخ قريش، يُذكر في التقليد بحفره بئر زمزم وبقيادته مكة زمن حملة أبرهة. وتنازعت الفرق في إيمانه فمنهم من رآه كان مسلماً موحداً ومنهم من رآه وغيره من آباء النبي كان مشركاً إلا من صح إيمانه، وكان يوصي ولده بصلة الأرحام وإطعام الطعام وجعل السقاية والرفادة لابنه عبد مناف أبي طالب وأوصاه بالنبي {cite:muruj-al-dhahab p. 447}، وكان له عند المسعودي ستة عشر ولداً عشرة ذكور العباس وحمزة والزبير وحجل والمقوم وضرار والحارث وأبو لهب وعبد الله وأبو طالب وست إناث عاتكة وصفية وأميمة والبيضاء وبرة وأروى ولم يسلم منهن إلا صفية وتنوزع في إسلام أروى {cite:muruj-al-dhahab p. 583-584}"
