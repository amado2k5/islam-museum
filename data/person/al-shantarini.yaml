summary:
  ar: "الحافظ أبو محمد عبد الله بن أحمد الشنتريني الأشبيلي؛ روى الصحيح عن ابن منصور عن أبي ذر وسمع من حاتم بن محمد وجماعة؛ قال ابن بشكوال كان حافظاً للحديث وعلله عارفاً برجاله وبالجرح والتعديل ثقة، كتب الكثير واختص بأبي علي الغساني وله تصانيف في الرجال؛ توفي في صفر سنة اثنتين وعشرين وخمسمائة عن ثمان وسبعين سنة {cite:shadharat-dhahab p. 546}."
  en: "The hafiz Abu Muhammad Abdallah ibn Ahmad al-Shantarini of Seville; transmitted the Sahih through Ibn Mansur from Abu Dharr and heard Hatim ibn Muhammad and others; Ibn Bashkuwal calls him a hafiz of hadith and its ʿilal, versed in rijal and jarh wa-ta'dil, trustworthy, prolific in writing, companion of Abu Ali al-Ghassani, with rijal works; d. Safar 522 at seventy-eight {cite:shadharat-dhahab p. 546}."
