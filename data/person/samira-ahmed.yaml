summary:
  ar: "صحفية وكاتبة ومذيعة بريطانية، وُلدت في واندزورث بلندن سنة 1968. تقدّم «فرونت رو» على إذاعة بي بي سي 4 و«نيوزواتش» على بي بي سي، وعملت قبل ذلك في أخبار القناة الرابعة، وفازت سنة 2020 بدعوى المساواة في الأجر ضد بي بي سي، وتكتب عمودًا منتظمًا في مجلة «نيو هيومانست»."
  en: "British journalist, writer and broadcaster, born in Wandsworth, London, in 1968. She presents Front Row on BBC Radio 4 and Newswatch on BBC One, previously worked at Channel 4 News, won a landmark equal-pay tribunal against the BBC in 2020, and writes a regular column for New Humanist magazine."
  ur: "برطانوی صحافی، مصنف اور نشریاتی پیش کار، جو 1968 میں لندن کے وینڈزورتھ میں پیدا ہوئیں۔ بی بی سی ریڈیو 4 پر «فرنٹ رو» اور بی بی سی پر «نیوزواچ» پیش کرتی ہیں، اس سے قبل چینل 4 نیوز میں کام کیا، 2020 میں بی بی سی کے خلاف مساوی اجرت کا مقدمہ جیتا، اور «نیو ہیومینسٹ» میگزین میں باقاعدہ کالم لکھتی ہیں۔"

