id: person/qarwash-ibn-al-muqallad
class: person
label:
  ar: "قرواش بن المقلد أبو المنيع معتمد الدولة"
  en: "Qarwash ibn al-Muqallad al-Uqayli"
summary:
  ar: "أمير بني عقيل بالموصل؛ جلس له القادر سنة ست وتسعين وثلاثمائة ولقّبه معتمد الدولة، ثم تفرد بالإمارة وكانت له بلاد الموصل والكوفة وشطّا الفرات، واستُنزل على ابن مزيد فيما كان إليه. جمع بين أختين فلامته العرب فقال «أيّ شيء أستعمل فما تُبيحه الشريعة؟»، وكان يقول «ما على رقبتي غير خمسة أو ستة من البادية قتلتهم، فأما الحاضرة فلا يُعبأ الله بهم». وكان الحاكم بمصر يكاتبه ويستميله حتى أقام له الدعوة بالموصل والكوفة ثم اعتذر إلى القادر. ودخل الغز الموصل سنة ٤٣٥ فأخذوا حرمه ونهبوا من داره ما يزيد على مائتي ألف دينار، فاجتمع هو ودبيس بن علي بن مزيد على الإيقاع بالغز فقتلوا منهم مقتلة عظيمة. توفي سنة اثنتين وأربعين وأربعمائة وقام بالأمر بعده قريش بن بدران بن المقلد {cite:muntazam-ibn-al-jawzi j.8 p.459,489-490}."
  en: "Uqaylid amir of Mosul — invested by al-Qadir in 396 with the laqab Mu'tamid al-Dawla, then sole ruler of Mosul, Kufa and the two banks of the Euphrates. Corresponded with the Fatimid al-Hakim and proclaimed his da'wa at Mosul and Kufa before apologizing to al-Qadir; when the Ghuzz took Mosul in 435 they plundered over 200,000 dinars from his palace, and he joined Dubays ibn Mazyad in slaughtering them. Died 442, succeeded by Quraysh ibn Badran {cite:muntazam-ibn-al-jawzi j.8 p.459,489-490}."
