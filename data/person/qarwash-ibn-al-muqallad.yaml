label:
  ar: "قرواش بن المقلد أبو المنيع معتمد الدولة"
  en: "Qarwash ibn al-Muqallad al-Uqayli"
  es: "Qarwash ibn al-Muqallad al-Uqayli"
  fr: "Qarwash ibn al-Muqallad al-Uqayli"
  ur: "قرواش ابن المقلد عقیلی"
summary:
  ar: "أمير بني عقيل بالموصل؛ جلس له القادر سنة ست وتسعين وثلاثمائة ولقّبه معتمد الدولة، ثم تفرد بالإمارة وكانت له بلاد الموصل والكوفة وشطّا الفرات، واستُنزل على ابن مزيد فيما كان إليه. جمع بين أختين فلامته العرب فقال «أيّ شيء أستعمل فما تُبيحه الشريعة؟»، وكان يقول «ما على رقبتي غير خمسة أو ستة من البادية قتلتهم، فأما الحاضرة فلا يُعبأ الله بهم». وكان الحاكم بمصر يكاتبه ويستميله حتى أقام له الدعوة بالموصل والكوفة ثم اعتذر إلى القادر. ودخل الغز الموصل سنة ٤٣٥ فأخذوا حرمه ونهبوا من داره ما يزيد على مائتي ألف دينار، فاجتمع هو ودبيس بن علي بن مزيد على الإيقاع بالغز فقتلوا منهم مقتلة عظيمة. توفي سنة اثنتين وأربعين وأربعمائة وقام بالأمر بعده قريش بن بدران بن المقلد {cite:muntazam-ibn-al-jawzi j.8 p.459,489-490}."
  en: "Uqaylid amir of Mosul — invested by al-Qadir in 396 with the laqab Mu'tamid al-Dawla, then sole ruler of Mosul, Kufa and the two banks of the Euphrates. Corresponded with the Fatimid al-Hakim and proclaimed his da'wa at Mosul and Kufa before apologizing to al-Qadir; when the Ghuzz took Mosul in 435 they plundered over 200,000 dinars from his palace, and he joined Dubays ibn Mazyad in slaughtering them. Died 442, succeeded by Quraysh ibn Badran {cite:muntazam-ibn-al-jawzi j.8 p.459,489-490}."
  es: "El emir uqaylid de Mosul fue investido por al-Qadir en 396 con el laqab Mu'tamid al-Dawla, entonces único gobernante de Mosul, Kufa y las dos orillas del Éufrates. Mantuvo correspondencia con el fatimí al-Hakim y proclamó su da'wa en Mosul y Kufa antes de disculparse con al-Qadir; cuando los ghuzz tomaron Mosul en 435, saquearon más de 200.000 dinares de su palacio, y él se unió a Dubays ibn Mazyad para masacrarlos. Murió en 442, sucedido por Quraysh ibn Badran {cite:muntazam-ibn-al-jawzi j.8 p.459,489-490}."
  fr: "Émir ukaylide de Mossoul, investi du laqab par al-Qadir en 396 par Mu'tamid al-Dawla, alors souverain unique de Mossoul, Koufa et des deux rives de l'Euphrate. Il correspondait avec le fatimide al-Hakim et proclamait son appel à la prière (da'wa) à Mossoul et Koufa avant de présenter ses excuses à al-Qadir. Lorsque les Ghuzz prirent Mossoul en 435, ils pillèrent son palais pour un butin de plus de 200 000 dinars, et il se joignit à Dubays ibn Mazyad pour les massacrer. Il mourut en 442 et fut remplacé par Quraysh ibn Badran (voir: Muntazam ibn al-Jawzi, vol. 8, p. 459, 489-490)."
  ur: "موصل کے عقیلد امیر - القادر نے 396 میں لقاب معتمد الدولہ کے ساتھ سرمایہ کاری کی، جو اس وقت موصل، کوفہ اور فرات کے دونوں کناروں کے واحد حکمران تھے۔ فاطمی الحکیم سے خط و کتابت کی اور القادر سے معافی مانگنے سے پہلے موصل اور کوفہ میں اپنی دعوت کا اعلان کیا۔ 435 میں جب غزوہ نے موصل پر قبضہ کیا تو انہوں نے اس کے محل سے 200,000 دینار لوٹ لئے اور وہ ان کو ذبح کرنے میں دوبیس ابن مازیاد کے ساتھ شامل ہوا۔ وفات 442، قریش ابن بدران نے جانشین بنایا۔"
  tr: "Musul'daki Banu Aqil Emiri; el-Kadir 396 Hicri yılında onun yerine oturdu ve ona Mu'temid al-Dawla unvanını verdi. Sonra tek yetkisini aldı ve Musul, Kufe ve Fırat nehri topraklarına sahip oldu; İbn Mazid'in yönetiminde olduğu gibi yerleşti. Araplar tarafından atanan iki kız kardeşi bir araya toplayarak, 'Ne kullanmalıyım? Şeriat neyi izinliyor?' dedi. Şöyle derdi ki, 'Omuzlarımda sadece beş ya da altı çöl insanı var, onları öldürdüm. Şehre gelince, Allah onları umursamıyor.' Mısır'daki hükümdar onunla yazıştı ve Musul ile Kufe'de bir misyon kurana kadar onun lütfunu istedi, ardından el-Kadir'den özür diledi. Gaziler 435 Hicri yılında Musul'a girdiler, onun sığınağını aldılar ve evinden iki yüz binden fazla dinarı yağmaladılar. O ve Days ibn Ali ibn Mazid savaşı bastırmak için toplandılar ve birçoğunu öldürdüler. Dört yüz kırk iki yaşında öldü ve yerine Kurayş ibn Badran ibn el-Muqallid geçti {atıf:muntazam-ibn-al-jawzi J.8 s.459,489-490}."
  id: "Emir Banu Aqil di Mosul; al-Qadir duduk untuknya pada tahun 396 H dan memberinya gelar Mu'tamid al-Dawla. Ia kemudian mengambil otoritas penuh dan memiliki tanah Mosul, Kufa, dan Sungai Efrat, dan ia menetap di bawah Ibn Mazid seperti yang ia miliki. Ia mengumpulkan dua saudari yang ditunjuk oleh orang Arab dan berkata, 'Apa yang harus saya gunakan? Apa yang diizinkan oleh Syariah?' Ia biasa berkata, 'Saya hanya memiliki lima atau enam orang gurun di pundakku, yang telah saya bunuh. Adapun kota, Tuhan tidak peduli pada mereka.' Penguasa di Mesir berkorespondensi dengannya dan meminta perhatiannya sampai ia mendirikan misi untuknya di Mosul dan Kufa, lalu meminta maaf kepada al-Qadir. Bangsa Ghazi memasuki Mosul pada tahun 435 H, mengambil tempat perlindungannya, dan menjarah lebih dari dua ratus ribu dinar dari rumahnya. Ia dan Days ibn Ali ibn Mazid berkumpul untuk menumpas pertempuran dan membunuh banyak dari mereka. Ia meninggal pada tahun empat ratus empat puluh dua, dan digantikan oleh Quraysh ibn Badran ibn al-Muqallid {cite:muntazam-ibn-al-jawzi J.8 hlm.459,489-490}."
