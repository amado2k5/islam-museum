summary:
  ar: "المنذر بن حرام النجاري الخزرجي، جد حسان بن ثابت؛ حكّمته الأوس في حرب سمير — أول حرب وقعت بين الأنصار — فحكم بأداء دية الصريح للحليف كعب بن العجلان والعودة إلى سنتهم القديمة فافترقوا وقد شبت البغضاء في نفوسهم {cite:kamil-ibn-al-athir p. 488}."
  en: "Al-Mundhir ibn Haram al-Najjari of Khazraj, grandfather of Hassan ibn Thabit; the Ansar's arbitrator in the Samir war, their first internal war, ruling full blood-money for the slain client and a return to the old custom {cite:kamil-ibn-al-athir p. 488}."
  fr: "Al-Mundhir ibn Haram al-Najjari de Khazraj, grand-père d'Hassan ibn Thabit ; l'arbitre des Ansars dans la guerre de Samir, leur première guerre interne, régnant plein argent du sang pour le client tué et un retour à l'ancienne coutume {cite:kamil-ibn-al-athir p. 488}."
  es: "Al-Mundhir ibn Haram al-Najjari de Khazraj, abuelo de Hassan ibn Thabit; árbitro de los Ansar en la guerra de Samir, su primera guerra interna, dictaminando el pago íntegro de la indemnización por sangre para el cliente asesinado y el retorno a la antigua costumbre {cite:kamil-ibn-al-athir p. 488}."
  ur: "خزرج کے المنذر بن حرام النجاری، حسن بن ثابت کے دادا؛ سمیر کی جنگ میں انصار کا ثالث، ان کی پہلی داخلی جنگ، مقتول کے لیے پوری خونریزی کا حکم اور پرانے رواج کی طرف واپسی {حوالہ: کامل ابن الثیر ص۔ 488}۔"
