summary:
  ar: "عالم مسلم صيني من ليوخه في جيانغسو (1874–1965)، عُرف باسمه الديني نور محمد، وكان إمامًا «أهونغ» ومن «الأئمة الأربعة الكبار» في الصين الحديثة؛ درس خليفةً عند الأهونغ وانغ هاوران في مسجد نيوجيه ببكين، وشارك سنة 1928 في إنشاء المدرسة الإسلامية النظامية في شنغهاي وتولّى إدارتها، وبعد 1949 ترأّس وفود الحج الصينية وكان نائب رئيس الجمعية الإسلامية الصينية."
  en: "Chinese Muslim scholar from Liuhe, Jiangsu (1874–1965), known by his religious name Nur Muhammad, an ahong counted among the four great ahongs of modern China. He studied as a khalifa under the ahong Wang Haoran at Beijing's Niujie Mosque, co-founded the Shanghai Islamic Normal School in 1928 and served as its principal, and after 1949 led China's hajj delegations and was a vice-chairman of the Islamic Association of China."
  ur: "لیوہے، جیانگسو سے تعلق رکھنے والے ایک چینی مسلمان عالم (1874ء–1965ء)، جن کا دینی نام نور محمد تھا؛ وہ جدید چین کے چار بڑے آہونگوں میں شمار ہوتے تھے۔ انہوں نے بیجنگ کی نیوجیے مسجد میں آہونگ وانگ ہاؤران کے یہاں خلیفہ کے طور پر تعلیم حاصل کی، 1928ء میں شنگھائی اسلامی نارمل اسکول کی تاسیس میں حصہ لیا اور اس کے پرنسپل رہے، اور 1949ء کے بعد چین کے حج وفود کی قیادت کی اور اسلامی ایسوسی ایشن آف چائنا کے نائب صدر رہے۔"
