summary:
  ar: "عالم مسلم صيني من ليوخه في جيانغسو (1874–1965)، عُرف باسمه الديني نور محمد، وكان إمامًا «أهونغ» ومن «الأئمة الأربعة الكبار» في الصين الحديثة؛ درس خليفةً عند الأهونغ وانغ هاوران في مسجد نيوجيه ببكين، وشارك سنة 1928 في إنشاء المدرسة الإسلامية النظامية في شنغهاي وتولّى إدارتها، وبعد 1949 ترأّس وفود الحج الصينية وكان نائب رئيس الجمعية الإسلامية الصينية."
  en: "Chinese Muslim scholar from Liuhe, Jiangsu (1874–1965), known by his religious name Nur Muhammad, an ahong counted among the four great ahongs of modern China. He studied as a khalifa under the ahong Wang Haoran at Beijing's Niujie Mosque, co-founded the Shanghai Islamic Normal School in 1928 and served as its principal, and after 1949 led China's hajj delegations and was a vice-chairman of the Islamic Association of China."
  ur: "لیوہے، جیانگسو سے تعلق رکھنے والے ایک چینی مسلمان عالم ⁦(1874ء–1965ء)⁩، جن کا دینی نام نور محمد تھا؛ وہ جدید چین کے چار بڑے آہونگوں میں شمار ہوتے تھے۔ انہوں نے بیجنگ کی نیوجیے مسجد میں آہونگ وانگ ہاؤران کے یہاں خلیفہ کے طور پر تعلیم حاصل کی، 1928ء میں شنگھائی اسلامی نارمل اسکول کی تاسیس میں حصہ لیا اور اس کے پرنسپل رہے، اور 1949ء کے بعد چین کے حج وفود کی قیادت کی اور اسلامی ایسوسی ایشن آف چائنا کے نائب صدر رہے۔"
  es: "Erudito musulmán chino de Liuhe, Jiangsu (1874-1965), conocido por su nombre religioso Nur Muhammad, fue un ahong considerado uno de los cuatro grandes ahongs de la China moderna. Estudió como khalifa bajo la tutela del ahong Wang Haoran en la mezquita Niujie de Pekín, cofundó la Escuela Normal Islámica de Shanghái en 1928 y fue su director, y después de 1949 dirigió las delegaciones chinas del Hajj y fue vicepresidente de la Asociación Islámica de China."
  fr: "Érudit musulman chinois originaire de Liuhe, dans le Jiangsu (1874-1965), connu sous son nom religieux de Nur Muhammad, il est considéré comme l'un des quatre grands ahongs de la Chine moderne. Il étudia comme calife auprès de l'ahong Wang Haoran à la mosquée Niujie de Pékin, co-fonda l'École normale islamique de Shanghai en 1928 et en fut le directeur, et après 1949, dirigea les délégations chinoises du hajj et fut vice-président de l'Association islamique de Chine."
  tr: "Jiangsu'daki Liuhe'den (1874–1965) Çinli Müslüman bir alim olan Nahun, dini adı Nur Muhammed olarak bilinir; Ahung'un imamı ve modern Çin'in 'Dört Büyük İmam'ından biriydi; Pekin'deki Nioje Camii'nde Ahung Wang Haoran'ın halefi olarak eğitim aldı, Niazhe'nin kurulmasına katıldı, 1928'de Şanghay'da düzenli İslami okulu yönetti ve 1949'dan sonra Çin hac heyetlerine başkanlık etti ve Çin İslam Derneği başkan yardımcısıydı."
  id: "Seorang ulama Muslim Tionghoa dari Liuhe di Jiangsu (1874–1965), dikenal dengan nama agamanya Nur Muhammad, ia adalah Imam Ahung dan salah satu dari 'Empat Imam Agung' di Tiongkok modern; ia belajar sebagai penerus di bawah Ahung Wang Haoran di Masjid Nioje di Beijing, berpartisipasi dalam pendirian Niazhe, mengelola sekolah Islam reguler di Shanghai pada tahun 1928, dan setelah tahun 1949, ia memimpin delegasi ziarah Tiongkok serta menjadi wakil presiden Asosiasi Islam Tionghoa."
