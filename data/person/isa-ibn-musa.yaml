label: { ar: "عيسى بن موسى", en: "Isa ibn Musa", es: "Isa ibn Musa", fr: "Isa ibn Musa", ur: "عیسیٰ ابن موسیٰ" }
summary:
  ar: "عيسى بن موسى العباسي؛ عند البلاذري عسكر له وهو يحارب إبراهيم بن عبد الله بن الحسن بن الحسن وعسكر أبو الأسد بينه وبين عسكره فحفر النهر المعروف بأبي أسد عند البطيحة. وعند المسعودي كلفه المنصور بقتل عمه عبد الله فشاور ابن أبي ليلى فقال امض بما أمرك وابن شبرمة فقال لا تفعل فأبى وأظهر أنه قتله وكان المنصور أحب أن يقتله فيقتله به فيستريح منهما فلما تخوف على نفسه قال هو عندي لم أقتله {cite:muruj-al-dhahab p. 293}"
  en: "Isa ibn Musa al-Abbasi; in al-Baladhuri he campaigned against Ibrahim ibn Abdallah al-Hasani while Abu al-Asad camped between their forces and dug the canal named for him at the Batayih."
  es: "Isa ibn Musa al-Abbasi; en al-Baladhuri hizo campaña contra Ibrahim ibn Abdallah al-Hasani, mientras que Abu al-Asad acampó entre sus fuerzas y excavó el canal que lleva su nombre en Batayih."
  fr: "Isa ibn Musa al-Abbasi; à al-Baladhuri, il fit campagne contre Ibrahim ibn Abdallah al-Hasani tandis qu'Abu al-Asad campait entre leurs forces et creusa le canal qui porte son nom à Batayih."
  ur: "عیسیٰ ابن موسیٰ العباسی؛ البلادھوری میں اس نے ابراہیم بن عبداللہ الحسنی کے خلاف مہم چلائی جب کہ ابو الاسد نے ان کی فوجوں کے درمیان ڈیرے ڈالے اور بطیح میں اس کے نام سے نہر کھودی۔"
  tr: "İsa ibn Musa el-Abbasi; el-Baladhuri'ye göre, İbrahim ibn Abdullah ibn el-Hasan ibn el-Hasan ile savaşan bir ordusu vardı. Ebu el-Asad'ın ordusu onunla ordusunun arasında duruyordu, bu yüzden el-Beytiha yakınlarında Ebu Esad adlı nehri kazdı. El-Mes'udhi ile birlikte, el-Mansur ona amcası Abdullah'ı öldürmesi için görevlendirdi. İbn Abi Leyla'ya danışarak, 'İbn Şubrumah'ın emrettiğini yerine getir.' dedi. O da 'Yapma.' dedi. Reddetti, ancak onu öldürdüğünü açıkladı. El-Mansur onu öldürmek istedi ki her ikisinden de kurtulabilsin. Kendinden korktuğunda, 'Onu öldürmedim.' dedi. {alıntı:Muruj-al-Dhahab, s. 293}"
  id: "Isa ibn Musa al-Abbasi; menurut al-Baladhuri, ia memiliki pasukan yang berperang melawan Ibrahim ibn Abdullah ibn al-Hasan ibn al-Hasan. Pasukan Abu al-Asad berdiri di antara dirinya dan pasukannya, sehingga ia menggali sungai yang dikenal sebagai Abu Asad dekat al-Batiha. Bersama al-Mas'udhi, al-Mansur menugaskannya untuk membunuh pamannya Abdullah. Ia berkonsultasi dengan Ibn Abi Layla dan berkata, 'Lanjutkan apa yang diperintahkan Ibn Shubrumah kepadamu.' Ia berkata, 'Jangan.' Ia menolak, tetapi ia mengungkapkan bahwa ia telah membunuhnya. Al-Mansur ingin membunuhnya dengan itu agar ia bisa terbebas dari keduanya. Ketika ia merasa takut, ia berkata, 'Aku belum membunuhnya.' {cite:muruj-al-dhahab, hlm. 293}"
