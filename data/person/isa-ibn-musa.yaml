label: { ar: "عيسى بن موسى", en: "Isa ibn Musa" }
summary:
  ar: "عيسى بن موسى العباسي؛ عند البلاذري عسكر له وهو يحارب إبراهيم بن عبد الله بن الحسن بن الحسن وعسكر أبو الأسد بينه وبين عسكره فحفر النهر المعروف بأبي أسد عند البطيحة.، وعند المسعودي كلفه المنصور بقتل عمه عبد الله فشاور ابن أبي ليلى فقال امض بما أمرك وابن شبرمة فقال لا تفعل فأبى وأظهر أنه قتله وكان المنصور أحب أن يقتله فيقتله به فيستريح منهما فلما تخوف على نفسه قال هو عندي لم أقتله {cite:muruj-al-dhahab p. 293}"
  en: "Isa ibn Musa al-Abbasi; in al-Baladhuri he campaigned against Ibrahim ibn Abdallah al-Hasani while Abu al-Asad camped between their forces and dug the canal named for him at the Batayih."
