  en: "Abu Bakr ibn al-Fadl (Muhammad ibn al-Fadl al-Fadli)"
summary:
  ar: "محمد بن الفضل، أبو بكر الفضلي الكماري، نسبة إلى «كمار» قرية ببخارى، فقيه ومفتٍ، كان إماماً كبيراً معتمداً في الرواية، وتعلم الفقه عن عبد الله السبذموني وأبي حفص الصغير، وتفقه عليه القاضي أبو علي الحسين بن الخضر النسفي والحاكم عبد الرحمن بن محمد الكاتب وعبد الله الخيزاخزي وغيرهم. وفتاواه ورواياته تملأ كتب الفتاوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8195}"
  en: "Muhammad ibn al-Fadl, Abu Bakr al-Fadli al-Kamari, from Kamar near Bukhara, a jurist and mufti. He learned from Abd Allah al-Sabadhmuni and Abu Hafs al-Saghir, and among his students were Abu Ali al-Husayn ibn al-Khadir al-Nasafi and Abd al-Rahman ibn Muhammad al-Katib. His fatwas and transmissions fill the books of fatwa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8195}"
