label:
  ar: "أبو بكر بن الفضل"
  en: "Abu Bakr ibn al-Fadl (Muhammad ibn al-Fadl al-Fadli)"
  es: "Abu Bakr ibn al-Fadl (Muhammad ibn al-Fadl al-Fadli)"
  fr: "Abu Bakr ibn al-Fadl (Muhammad ibn al-Fadl al-Fadli)"
  ur: "ابو بکر بن الفضل ⁦(محمد ابن الفضل الفضلی)⁩"
summary:
  ar: "محمد بن الفضل، أبو بكر الفضلي الكماري، نسبة إلى «كمار» قرية ببخارى، فقيه ومفتٍ، كان إماماً كبيراً معتمداً في الرواية، وتعلم الفقه عن عبد الله السبذموني وأبي حفص الصغير، وتفقه عليه القاضي أبو علي الحسين بن الخضر النسفي والحاكم عبد الرحمن بن محمد الكاتب وعبد الله الخيزاخزي وغيرهم. وفتاواه ورواياته تملأ كتب الفتاوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8195}"
  en: "Muhammad ibn al-Fadl, Abu Bakr al-Fadli al-Kamari, from Kamar near Bukhara, a jurist and mufti. He learned from Abd Allah al-Sabadhmuni and Abu Hafs al-Saghir, and among his students were Abu Ali al-Husayn ibn al-Khadir al-Nasafi and Abd al-Rahman ibn Muhammad al-Katib. His fatwas and transmissions fill the books of fatwa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8195}"
  es: "Muhammad ibn al-Fadl, Abu Bakr al-Fadli al-Kamari, de Kamar, cerca de Bukhara, fue jurista y mufti. Estudió con Abd Allah al-Sabadhmuni y Abu Hafs al-Saghir, y entre sus alumnos se encontraban Abu Ali al-Husayn ibn al-Khadir al-Nasafi y Abd al-Rahman ibn Muhammad al-Katib. Sus fatwas y transmisiones llenan los libros de fatwas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8195}"
  fr: "Muhammad ibn al-Fadl, Abu Bakr al-Fadli al-Kamari, originaire de Kamar près de Boukhara, était juriste et mufti. Il a étudié sous Abd Allah al-Sabadhmuni et Abu Hafs al-Saghir, et ses étudiants comprenaient Abu Ali al-Husayn ibn al-Khadir al-Nasafi et Abd al-Rahman ibn Muhammad al-Katib. Ses fatwas et transmissions remplissent les livres de fatwa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8195}"
  ur: "محمد بن الفضل، ابو بکر الفدلی الکماری، بخارا کے قریب کمر سے، ایک فقیہ اور مفتی تھے۔ اس نے عبد اللہ الصبدھمونی اور ابو حفص الصغیر سے تعلیم حاصل کی، اور ان کے شاگردوں میں ابو علی الحسین بن الخدیر النصفی اور عبدالرحمٰن بن محمد الکاتب شامل تھے۔ ان کے فتاویٰ اور نشریات سے فتاویٰ کی کتابیں بھر جاتی ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 8195}"
  tr: "Muhammed ibn el-Fadl, Ebu Bekir el-Fadhli el-Kumari, Buhara'daki bir köyden 'Kamar'dan adını alan bir fıkıh ve müftüydü; rivayetlerde güvenilen kıdemli bir imamdı. Fıkıh eğitimini Abdullah el-Sabdhamuni ve Ebu Hafs el-Saghir'den öğrendi. Ayrıca Kadi Ebu Ali el-Hüseyin ibn el-Hidr el-Nasafi, el-Hakim Abd al-Rahman ibn Muhammed el-Katib, Abdullah el-Hizakhuzi ve diğerlerinden fıkıh öğrendi. Fetvaları ve rivayetleri fetva kitaplarını doldurur. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.8195}"
  id: "Muhammad ibn al-Fadl, Abu Bakr al-Fadhli al-Kumari, dinamai menurut 'Kamar' dari sebuah desa di Bukhara, adalah seorang ahli hukum dan mufti yang merupakan imam senior yang diandalkan dalam narasi. Ia mempelajari fiqdologi dari Abdullah al-Sabdhamuni dan Abu Hafs al-Saghir. Ia juga diajarkan fiksi oleh Qadi Abu Ali al-Husayn ibn al-Khidr al-Nasafi, al-Hakim Abd al-Rahman ibn Muhammad al-Katib, Abdullah al-Khizakhuzi, dan lainnya. Fatwa dan narasinya memenuhi buku-buku fatwa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8195}"
