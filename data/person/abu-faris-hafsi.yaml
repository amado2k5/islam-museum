summary:
  ar: "السلطان أبو فارس عبد العزيز الحفصي صاحب تونس؛ قال ابن عبد الحق السبتي كان لا ينام من الليل إلا قليلاً وليس له شغل إلا النظر في مصالح مملكته وكان يؤذن بنفسه ويؤم بالناس في الجماعة ويكثر الذكر ويقرب أهل الخير وقد أبطل كثيراً من المفاسد بتونس منها الصالة التي كان يباح فيها الخمر للفرنج ولم يكن ببلاده كلها شيء من المكوس لكنه يبالغ في أخذ الزكاة والعشر وكان محافظاً على عمارة الطرق حتى أمنت القوافل في أيامه في جميع بلاده وكان يرسل الصدقات إلى القاهرة والحرمين ولا يلبس الحرير ولا يتختم بالذهب ويسلم على الناس، توفي وهو قاصد تلمسان سنة سبع وثلاثين وثمانمائة {cite:shadharat-dhahab p. 222}."
  en: "Sultan Abu Faris Abd al-Aziz of Tunis — the sleepless ruler who called the adhan and led prayer himself, abolished the Frankish wine-market and every mukus in his realm, made the roads so safe caravans slept abroad, sent alms to Cairo and the Haramayn and wore neither silk nor gold; died en route to Tlemcen, 837 {cite:shadharat-dhahab p. 222}."
