summary:
  ar: "السلطان أبو فارس عبد العزيز الحفصي صاحب تونس؛ قال ابن عبد الحق السبتي كان لا ينام من الليل إلا قليلاً وليس له شغل إلا النظر في مصالح مملكته وكان يؤذن بنفسه ويؤم بالناس في الجماعة ويكثر الذكر ويقرب أهل الخير وقد أبطل كثيراً من المفاسد بتونس منها الصالة التي كان يباح فيها الخمر للفرنج ولم يكن ببلاده كلها شيء من المكوس لكنه يبالغ في أخذ الزكاة والعشر وكان محافظاً على عمارة الطرق حتى أمنت القوافل في أيامه في جميع بلاده وكان يرسل الصدقات إلى القاهرة والحرمين ولا يلبس الحرير ولا يتختم بالذهب ويسلم على الناس، توفي وهو قاصد تلمسان سنة سبع وثلاثين وثمانمائة {cite:shadharat-dhahab p. 222}."
  en: "Sultan Abu Faris Abd al-Aziz of Tunis — the sleepless ruler who called the adhan and led prayer himself, abolished the Frankish wine-market and every mukus in his realm, made the roads so safe caravans slept abroad, sent alms to Cairo and the Haramayn and wore neither silk nor gold; died en route to Tlemcen, 837 {cite:shadharat-dhahab p. 222}."
  fr: "Le sultan Abu Faris Abd al-Aziz de Tunis — souverain sans sommeil qui faisait lui-même l'appel à la prière et dirigeait la prière, abolit le marché au vin des Francs et toutes les taxes illégales (mukus) de son royaume, rendit les routes si sûres que les caravanes dormaient en plein air, envoya des aumônes au Caire et aux deux Sanctuaires, et ne portait ni soie ni or ; mort sur la route de Tlemcen, en 837 {cite:shadharat-dhahab p. 222}."
  es: "El sultán Abu Faris Abd al-Aziz de Túnez, el gobernante insomne que llamaba al adhan y dirigía la oración personalmente, abolió el mercado de vino franco y todos los mukus de su reino, hizo que los caminos fueran tan seguros que las caravanas dormían en el extranjero, enviaba limosnas a El Cairo y a los Haramayn y no vestía ni seda ni oro; murió de camino a Tremecén, 837 {cite:shadharat-dhahab p. 222}."
  ur: "تیونس کے سلطان ابو فارس عبد العزیز - بے خواب حکمران جس نے خود اذان دی اور نماز پڑھائی، فرینک شراب کے بازار اور اس کے دائرے میں موجود ہر مکس کو ختم کر دیا، سڑکوں کو اس قدر محفوظ بنا دیا کہ قافلے بیرون ملک سوتے تھے، قاہرہ اور حرمین میں خیرات بھیجتے تھے اور نہ ریشم اور نہ سونا پہنتے تھے۔ Tlemcen، 837 کے راستے میں انتقال کرگیا۔ 222}۔"
  tr: "Tunus hükümdarı Sultan Ebu Faris Abdül Aziz El Hafsi hakkında İbn Abdül Hak El Sabti şöyle demiştir: Geceleri çok az uyur ve krallığının çıkarlarını gözetmekten başka bir meşguliyeti olmazdı. Ezanı kendisi okur ve cemaat namazına önderlik ederdi. Sık sık Allah'ı anar ve hayırlı insanları yanına getirirdi. Tunus'taki birçok kötülüğü, Frankların şarap içmesine izin verilen salonu da dahil olmak üzere ortadan kaldırdı. Tüm topraklarında vergi yoktu, ancak zekât ve ondalık vergilerini toplamada çok titizdi. Kervanların tüm topraklarında güvenli bir şekilde seyahat edebilmesi için yolların bakımına çok önem verirdi. Kahire'ye ve Mescid-i Haram'a sadaka gönderirdi. İpek veya altın yüzük takmazdı ve insanları selamlardı. Hicri 837 yılında Tlemcen'e giderken vefat etti. {Kaynak: Şadharat-Dhaba s. 222}"
  id: "Sultan Abu Faris Abdul Aziz Al Hafsi, penguasa Tunis; Ibn Abdul Haq Al Sabti berkata: Beliau tidur sangat sedikit di malam hari dan tidak memiliki pekerjaan lain selain mengurus kepentingan kerajaannya. Beliau sendiri yang mengumandangkan azan dan memimpin orang-orang dalam salat berjamaah. Beliau sering berzikir kepada Allah dan mendekatkan diri kepada orang-orang baik. Beliau menghapuskan banyak kejahatan di Tunis, termasuk aula tempat anggur diperbolehkan bagi orang-orang Frank. Tidak ada pajak di seluruh wilayah kekuasaannya, tetapi beliau sangat ketat dalam mengumpulkan zakat dan persepuluhan. Beliau sangat memperhatikan pemeliharaan jalan agar kafilah aman di seluruh wilayah kekuasaannya. Beliau mengirimkan sedekah ke Kairo dan Dua Masjid Suci. Beliau tidak mengenakan sutra atau cincin emas dan beliau selalu menyapa orang-orang. Beliau wafat dalam perjalanan menuju Tlemcen pada tahun 837 Hijriah. {kutipan:shadharat-dhahab hlm. 222}."
