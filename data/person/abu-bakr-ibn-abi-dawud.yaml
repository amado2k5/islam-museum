label: { ar: "أبو بكر بن أبي داود السجستاني" }
summary:
  ar: "ابن أبي داود السجستاني، أراد الوزير علي بن عيسى أن يصلح بينه وبين ابن صاعد فقال أنت شيخ زيف فقال الشيخ الزيف الكذاب على رسول الله فقال من الكذاب على رسول الله قال هذا فقال تتوهم أني أذل لك لأجل أن رزقي يصل إلى على يديك والله لا أخذت من يدك شيئاً أبداً فبلغ المقتدر ذلك فصار يزن رزقه بيده ويبعث به في طبق على يد الخادم {cite:tarikh-khulafa-minhaj-1434 p. 595}."
  en: "Son of Abu Dawud; when the vizier Ali ibn Isa called him 'a false shaykh' he answered 'the false shaykh is the liar upon the Messenger of God', and swore never again to take anything from his hand — so al-Muqtadir himself thereafter weighed his stipend and sent it on a platter by a servant {cite:tarikh-khulafa-minhaj-1434 p. 595}."
