summary:
  ar: "رفاعة بن مالك بن العجلان الأنصاري الزرقي، أبو معاذ، صحابي شهد العقبة وبقية المشاهد، وروى عن النبي وعن أبي بكر الصديق وعبادة بن الصامت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8514} وقال ابن حجر إن أباه أول من أسلم من الأنصار، وقال ابن عبد البر إنه شهد مع علي الجمل وصفين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8514}"
  en: "Rifa'a ibn Malik ibn al-Ajlan al-Ansari al-Zuraqi, Abu Mu'adh, a Companion who witnessed the second pledge at Aqaba and the later battles. He narrated from the Prophet, from Abu Bakr al-Siddiq and from Ubada ibn al-Samit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8514} Ibn Hajar says his father was the first of the Ansar to embrace Islam, and Ibn Abd al-Barr says that Rifa'a fought with Ali at the battles of the Camel and Siffin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8514}"
