summary:
  ar: "عبد الله بن أسعد بن علي اليافعي، عفيف الدين، مؤرخ باحث متصوف من شافعية اليمن، ولد ونشأ في عدن وأقام بمكة وتوفي بها، صاحب «مرآة الجنان وعبرة اليقظان»، 698 إلى 768 هـ."
  en: "Abdallah ibn As'ad ibn Ali al-Yafi'i, Afif al-Din, historian, researcher and Sufi, one of the Shafi'is of Yemen, born and raised in Aden, who settled and died in Mecca, author of 'Mir'at al-Janan wa-'Ibrat al-Yaqzan', 698 to 768 AH."
  fr: "Abdallah ibn As'ad ibn Ali al-Yafi'i, Afif al-Din, historien, chercheur et soufi, l'un des chaféites du Yémen, né et élevé à Aden, qui s'établit et mourut à La Mecque, auteur de « Mir'at al-Janan wa-'Ibrat al-Yaqzan », 698 à 768 de l'hégire."
  es: "Abdallah ibn As'ad ibn Ali al-Yafi'i, Afif al-Din, historiador, investigador y sufí, uno de los shafi'ís de Yemen, nacido y criado en Adén, que se estableció y murió en La Meca, autor de 'Mir'at al-Janan wa-'Ibrat al-Yaqzan', 698 a 768 AH."
  ur: "عبداللہ بن اسعد بن علی یافعی، عفیف الدین، مورخ، محقق اور صوفی، یمن کے شافعیوں میں سے ایک، عدن میں پیدا اور پرورش پانے والے، جو مکہ میں آباد ہوئے اور انتقال کر گئے، 'میرات الجنان و' ابراط الیقزان' کے مصنف، 968ھ تک۔"
