summary:
  ar: "سلطان يوجياكارتا الثامن (1880–1939)، حكم من 8 شباط 1921 حتى وفاته، وُلد باسم غوستي رادن ماس سوجادي ابنًا للسلطان هامينغكوبوونو السابع، ورمّم مباني القصر ودفع بالتعليم والصحة، وكان من أوائل الداعمين لأحمد دحلان في تأسيس جمعية المحمدية، وخلفه ابنه هامينغكوبوونو التاسع."
  en: "Eighth Sultan of Yogyakarta (1880–1939), reigning from 8 February 1921 until his death. Born Gusti Raden Mas Sujadi, a son of Sultan Hamengkubuwono VII, he rebuilt parts of the palace, advanced education and health in the sultanate, and was among the first to support Ahmad Dahlan in the formation of Muhammadiyah; he was succeeded by his son Hamengkubuwono IX."
  ur: "یوگیاکارتا کے آٹھویں سلطان (1880ء–1939ء)، 8 فروری 1921ء سے وفات تک حکمراں رہے۔ پیدائشی نام گوستی رادن ماس سوجادی، سلطان ہامینگکوبوونو ہفتم کے بیٹے؛ انہوں نے محل کی عمارتوں کی مرمت کرائی، تعلیم و صحت کو فروغ دیا، اور احمد دہلان کی محمدیہ کی تشکیل میں اولین حامیوں میں سے تھے؛ ان کے جانشین ان کے بیٹے ہامینگکوبوونو نہم ہوئے۔"
