summary:
  ar: "محمد يوسف شاه عالم دين وسياسي كشميري تولّى منصب ميرواعظ كشمير منذ 1931، وشارك في تأسيس المؤتمر الإسلامي، وقاد مؤتمر المسلمين الأحرار في المنفى، وتولّى رئاسة كشمير الحرة مرتين، وألّف «بيان الفرقان» أول ترجمة وتفسير شامل للقرآن باللغة الكشميرية."
  en: "Mirwaiz Muhammad Yusuf Shah was a Kashmiri scholar and politician who held the hereditary office of Mirwaiz of Kashmir from 1931, co-founded the Muslim Conference, led the Azad Muslim Conference in exile, twice served as president of Azad Kashmir, and produced Bayan-ul-Furqan, the first comprehensive Kashmiri translation and commentary of the Quran."
  ur: "محمد یوسف شاہ کشمیری عالم دین و سیاست دان تھے جو 1931ء سے میرواعظ کشمیر رہے، مسلم کانفرنس کی تاسیس میں شریک ہوئے، جلاوطنی میں آزاد مسلم کانفرنس کی قیادت کی، دو بار آزاد کشمیر کے صدر بنے اور «بیان الفرقان» تصنیف کی، جو قرآن کی پہلی جامع کشمیری ترجمہ و تفسیر ہے۔"
