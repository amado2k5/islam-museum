summary:
  ar: "سياسي ورجل أعمال باكستاني، رئيس وزراء باكستان ثلاث مرات (1990–1993 و1997–1999 و2013–2017) وزعيم حزب الرابطة الإسلامية (ن)، وهو أطول رؤساء وزراء باكستان خدمة. انتهت ولاياته الثلاث جميعًا بإقالته أو إطاحته، آخرها بقرار المحكمة العليا في قضية وثائق بنما سنة 2017، ثم عاد من منفاه سنة 2023 وبُرّئ من قضايا الفساد."
  en: "Pakistani politician and businessman, three times prime minister of Pakistan (1990–1993, 1997–1999, 2013–2017) and leader of the Pakistan Muslim League (N); he is Pakistan's longest-serving prime minister. All three terms ended in his removal, the last by the Supreme Court in the Panama Papers case in 2017; he returned from exile in 2023 and was acquitted in the corruption cases."
  ur: "پاکستانی سیاست دان اور کاروباری شخصیت، تین بار پاکستان کے وزیرِ اعظم (1990ء–1993ء، 1997ء–1999ء، 2013ء–2017ء) اور پاکستان مسلم لیگ (ن) کے قائد؛ وہ پاکستان کے سب سے طویل عرصہ خدمت کرنے والے وزیرِ اعظم ہیں۔ ان کی تینوں مدتوں کا خاتمہ برطرفی پر ہوا، آخری بار 2017ء میں پاناما پیپرز کیس میں سپریم کورٹ کے فیصلے سے؛ 2023ء میں وہ جلا وطنی سے واپس آئے اور بدعنوانی کے مقدمات میں بری ہوئے۔"
