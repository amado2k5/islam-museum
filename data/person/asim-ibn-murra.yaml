summary:
  ar: "ابن مرة بن علي الرديني؛ عند البلاذري أخذت سيسر منه فأخرجت من يده في خلافة المأمون فرجعت إلى ضياع الخلافة."
  en: "son of Murra ibn Ali al-Rudhayni; in al-Baladhuri, from whom Sisar was taken under al-Ma'mun, returning to the caliphal estates."
  es: "hijo de Murra ibn Ali al-Rudhayni; en al-Baladhuri, de quien Sisar fue arrebatado bajo al-Ma'mun, regresando a las propiedades califales."
  fr: "fils de Murra ibn Ali al-Rudhayni; à al-Baladhuri, à qui Sisar fut pris sous al-Ma'mun, retournant aux domaines califaux."
  ur: "مرہ ابن علی الردعینی کے بیٹے؛ البلادوری میں، جس سے سیسار کو المامون کے ماتحت لے لیا گیا، وہ خلیفہ کی جاگیروں میں واپس آ گئے۔"
  tr: "İbn Murra ibn Ali el-Rudaini; el-Baladhuri'ye göre, el-Memun'un halifeliği sırasında ondan bir sisur almış ve elinden almıştır; bu da halifeliğin kaybına yol açmıştır."
  id: "Ibn Murrah ibn Ali al-Rudaini; menurut al-Baladhuri, ia mengambil sisur darinya dan mengambilnya dari tangannya selama kekhalifahan al-Ma'mun, yang menyebabkan kehilangan kekhalifahan tersebut."
