id: person/sandar-mawla-zinba
class: person
label:
  ar: سندر مولى زنباع الجذامي
  en: Sandar, freedman of Zinba' al-Judhami
  ur: سندر، زنباع جذامی کے آزاد کردہ
  es: "Sandar, freedman of Zinba' al-Judhami"
  fr: "Sandar, freedman of Zinba' al-Judhami"
gender: male
roles:
- companion
summary:
  ar: غلام كان لزنباع بن سلامة الجذامي فمثّل به، فأعتقه النبي وأوصى به كل مسلم، ثم أقطعه عمر منية الأصبغ بمصر، ولم يبلغ الليث أن عمر أقطع أحداً من أرض مصر غيره؛ ويقال له سندر وابن سندر {cite:futuh-misr-amir-1999 p. 186} {cite:futuh-misr-amir-1999 p. 187} {cite:futuh-misr-amir-1999 p. 188}.
  en: A slave of Zinba' ibn Salama al-Judhami, who mutilated him; the Prophet freed him and commended him to every Muslim, and Umar later granted him Munyat al-Asbagh in Egypt, al-Layth knowing of no other grant of Egyptian land by Umar; he is called both Sandar and Ibn Sandar {cite:futuh-misr-amir-1999 p. 186} {cite:futuh-misr-amir-1999 p. 187} {cite:futuh-misr-amir-1999 p. 188}.
  ur: زنباع بن سلامہ جذامی کے ایک غلام جنہیں ان کے مالک نے مثلہ کیا؛ نبی نے انہیں آزاد کیا اور ہر مسلمان کو ان کے بارے میں وصیت کی، اور بعد میں عمر نے انہیں مصر میں منیۃ الاصبغ جاگیر میں دی، اور لیث کو عمر کی طرف سے مصر کی زمین کی کوئی اور جاگیر معلوم نہ تھی؛ انہیں سندر اور ابن سندر دونوں کہا جاتا ہے {cite:futuh-misr-amir-1999 p. 186} {cite:futuh-misr-amir-1999 p. 187} {cite:futuh-misr-amir-1999 p. 188}۔
  es: "Un esclavo de Zinba' ibn Salama al-Judhami, quien lo mutiló; el Profeta lo liberó y lo recomendó a todos los musulmanes, y Umar más tarde le concedió Munyat al-Asbagh en Egipto, al-Layth no sabía de ninguna otra concesión de tierras egipcias por parte de Umar; se le llama tanto Sandar como Ibn Sandar {cite:futuh-misr-amir-1999 p. 186} {cite:futuh-misr-amir-1999 p. 187} {cite:futuh-misr-amir-1999 p. 188}."
  fr: "Esclave de Zinba' ibn Salama al-Judhami, qui le mutila; le Prophète l'affranchit et le recommanda à tous les musulmans, et Umar lui accorda plus tard Munyat al-Asbagh en Égypte, al-Layth n'ayant connaissance d'aucune autre donation de terres égyptiennes par Umar; il est appelé à la fois Sandar et Ibn Sandar {cite:futuh-misr-amir-1999 p. 186} {cite:futuh-misr-amir-1999 p. 187} {cite:futuh-misr-amir-1999 p. 188}."
  tr: "Zinba' ibn Salama al-Judhami'nin hizmetkarıydı ve onun taklit etmiştir. Peygamber onu özgür bırakmış ve her Müslümana tavsiye etmiştir. Sonra Ömer onu Mısır'daki Muniyat al-Asbagh'a atamıştır. Al-Layth, Umar'ın Mısır topraklarından kendisi dışında kimseyi kopardığını hiç bildirmemiştir; kendisine Sundar ve İbn Sundar denir {cite:futuh-misr-amir-1999, s. 186} {cite:futuh-misr-amir-1999, s. 187} {cite:futuh-misr-amir-1999, s. 188}."
  id: "Ia adalah hamba Zinba' ibn Salama al-Judhami dan ditiru olehnya. Nabi membebaskannya dan merekomendasikannya kepada setiap umat Muslim. Kemudian Umar menunjuknya ke Muniyat al-Asbagh di Mesir. Al-Layth tidak pernah melaporkan bahwa Umar memutuskan siapa pun dari tanah Mesir kecuali dirinya; ia disebut Sundar dan Ibn Sundar {cite:futuh-misr-amir-1999, hlm. 186} {cite:futuh-misr-amir-1999, hlm. 187} {cite:futuh-misr-amir-1999, hlm. 188}."
