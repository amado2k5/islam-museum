id: person/sandar-mawla-zinba
class: person
label:
  ar: سندر مولى زنباع الجذامي
  en: Sandar, freedman of Zinba' al-Judhami
  ur: سندر، زنباع جذامی کے آزاد کردہ
gender: male
roles:
- companion
summary:
  ar: غلام كان لزنباع بن سلامة الجذامي فمثّل به، فأعتقه النبي وأوصى به كل مسلم، ثم أقطعه عمر منية الأصبغ بمصر، ولم يبلغ الليث أن عمر أقطع أحداً من أرض مصر غيره؛ ويقال له سندر وابن سندر {cite:futuh-misr-amir-1999 p. 186} {cite:futuh-misr-amir-1999 p. 187} {cite:futuh-misr-amir-1999 p. 188}.
  en: A slave of Zinba' ibn Salama al-Judhami, who mutilated him; the Prophet freed him and commended him to every Muslim, and Umar later granted him Munyat al-Asbagh in Egypt, al-Layth knowing of no other grant of Egyptian land by Umar; he is called both Sandar and Ibn Sandar {cite:futuh-misr-amir-1999 p. 186} {cite:futuh-misr-amir-1999 p. 187} {cite:futuh-misr-amir-1999 p. 188}.
  ur: زنباع بن سلامہ جذامی کے ایک غلام جنہیں ان کے مالک نے مثلہ کیا؛ نبی نے انہیں آزاد کیا اور ہر مسلمان کو ان کے بارے میں وصیت کی، اور بعد میں عمر نے انہیں مصر میں منیۃ الاصبغ جاگیر میں دی، اور لیث کو عمر کی طرف سے مصر کی زمین کی کوئی اور جاگیر معلوم نہ تھی؛ انہیں سندر اور ابن سندر دونوں کہا جاتا ہے {cite:futuh-misr-amir-1999 p. 186} {cite:futuh-misr-amir-1999 p. 187} {cite:futuh-misr-amir-1999 p. 188}۔
