summary:
  ar: "خالد بن يزيد بن مزيد بن زائدة، أبو يزيد الشيباني، أحد الأمراء الولاة الأجواد في العصر العباسي وممدوح أبي تمام، ولاه المأمون مصر ثم الموصل وديار ربيعة، وتوفي سنة 230هـ في طريقه إلى أرمينية في أيام الواثق."
  en: "Khalid ibn Yazid ibn Mazyad al-Shaybani, Abu Yazid, one of the generous amir-governors of the Abbasid age and a patron praised by Abu Tammam; al-Ma'mun appointed him over Egypt, then Mosul and Diyar Rabi'a, and he died in 230 AH on the way to Armenia in the days of al-Wathiq."
  es: "Khalid ibn Yazid ibn Mazyad al-Shaybani, Abu Yazid, uno de los generosos emires-gobernadores de la época abasí y un mecenas elogiado por Abu Tammam; al-Ma'mun lo nombró gobernador de Egipto, luego de Mosul y Diyar Rabi'a, y murió en el año 230 de la Hégira de camino a Armenia, en tiempos de al-Wathiq."
  fr: "Khalid ibn Yazid ibn Mazyad al-Shaybani, Abu Yazid, l'un des généreux émirs-gouverneurs de l'époque abbasside et un mécène loué par Abu Tammam; al-Ma'mun le nomma à la tête de l'Égypte, puis de Mossoul et de Diyar Rabi'a, et il mourut en 230 AH sur le chemin de l'Arménie à l'époque d'al-Wathiq."
  ur: "خالد بن یزید ابن مازیاد الشیبانی، ابو یزید، عباسی دور کے سخی امیر گورنروں میں سے ایک اور ابو تمام کی طرف سے تعریف کردہ سرپرست؛ المامون نے اسے مصر، پھر موصل اور دیار ربیعہ پر مقرر کیا اور 230 ہجری میں آرمینیا جاتے ہوئے الوثیق کے دنوں میں وفات پائی۔"
  tr: "Halid bin Yezid bin Mazid ibn Zaidah, Ebu Yezîd el-Şeybani, Abbasi döneminin soylu prenslerinden ve valilerinden biriydi ve Ebu Temmam'ın övgüsünü kazandı. El-Memun onu Mısır, ardından Musul ve Rabi'ah toprakları üzerinde yönetti. 230 Hicri yılında, Ermenistan'a giderken el-Vatiq döneminde öldü."
  id: "Khalid ibn Yazid ibn Mazid ibn Zaidah, Abu Yazid al-Shaybani, adalah salah satu pangeran dan gubernur bangsawan pada era Abbasiyah dan mendapat pujian dari Abu Tammam. Al-Ma'mun memerintahnya atas Mesir, kemudian Mosul, dan wilayah Rabi'ah. Ia meninggal pada tahun 230 H dalam perjalanan ke Armenia pada masa al-Wathiq."
