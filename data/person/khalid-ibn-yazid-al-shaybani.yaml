  ar: "خالد بن يزيد بن مزيد بن زائدة، أبو يزيد الشيباني، أحد الأمراء الولاة الأجواد في العصر العباسي وممدوح أبي تمام، ولاه المأمون مصر ثم الموصل وديار ربيعة، وتوفي سنة 230هـ في طريقه إلى أرمينية في أيام الواثق."
  en: "Khalid ibn Yazid ibn Mazyad al-Shaybani, Abu Yazid, one of the generous amir-governors of the Abbasid age and a patron praised by Abu Tammam; al-Ma'mun appointed him over Egypt, then Mosul and Diyar Rabi'a, and he died in 230 AH on the way to Armenia in the days of al-Wathiq."
