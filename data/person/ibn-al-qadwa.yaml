id: person/ibn-al-qadwa
class: person
label: { ar: "ابن القدوة", en: "Ibn al-Qadwa", es: "Ibn al-Qadwa", fr: "Ibn al-Qadwa", ur: "ابن القدوی۔" }
summary:
  ar: "القاضي مجد الدين عبد المجيد بن عمر المعروف بابن القدوة، من الكرامية الهيصمية وله عندهم بفيروزكوه محل كبير لزهده وعلمه وبيته؛ ناظر فخر الدين الرازي في مجلس السلطان غياث الدين الغوري سنة خمس وتسعين وخمسمائة فطال الكلام بينهما واستطال عليه الفخر وسبّه، فوعظ ابن القدوة في الجامع في الغد وأعلن أنه لا يقول إلا ما صح عن رسول الله وأنه لا يعلم علم أرسطاطاليس وكفريات ابن سينا وفلسفة الفارابي، فبكى وضجّ الناس وامتلأ البلد فتنة حتى تدخل السلطان وأخرج الرازي من فيروزكوه {cite:kamil-ibn-al-athir p. 262}."
  en: "Majd al-Din Abd al-Majid ibn Umar, known as Ibn al-Qadwa — Karrami shaykh of the Haythamiyya branch, honoured at Firuzkuh for his asceticism and learning; debated Fakhr al-Din al-Razi before Sultan Ghiyath al-Din in 595 and, insulted at the session, preached the next day disavowing Aristotle, Ibn Sina and al-Farabi, moving the crowd to a riot the sultan had to put down {cite:kamil-ibn-al-athir p. 262}."
  es: "Majd al-Din Abd al-Majid ibn Umar, conocido como Ibn al-Qadwa, shaykh karrami de la rama Haythamiyya, honrado en Firuzkuh por su ascetismo y erudición; debatió con Fakhr al-Din al-Razi ante el sultán Ghiyath al-Din en 595 y, ofendido en la sesión, predicó al día siguiente renegando de Aristóteles, Ibn Sina y al-Farabi, lo que provocó un motín que el sultán tuvo que sofocar {cite:kamil-ibn-al-athir p. 262}."
  fr: "Majd al-Din Abd al-Majid ibn Umar, connu sous le nom d'Ibn al-Qadwa — cheikh Karrami de la branche Haythamiyya, honoré à Firuzkuh pour son ascétisme et son érudition; a débattu avec Fakhr al-Din al-Razi devant le sultan Ghiyath al-Din en 595 et, insulté lors de la session, a prêché le lendemain en désavouant Aristote, Ibn Sina et al-Farabi, provoquant une émeute dans la foule que le sultan a dû réprimer {cite:kamil-ibn-al-athir p. 262}."
  ur: "مجدالدین عبد الماجد ابن عمر، جسے ابن القدوا کے نام سے جانا جاتا ہے - ہیثمیہ شاخ کے کرامی شیخ، فیروزکوہ میں ان کی سنت اور علم کے لیے اعزاز یافتہ؛ 595 میں سلطان غیاث الدین کے سامنے فخرالدین الرازی سے بحث کی اور اجلاس میں توہین کی گئی، اگلے دن ارسطو، ابن سینا اور الفارابی کی مخالفت کرتے ہوئے تبلیغ کی، اور ہجوم کو فساد کی طرف لے جانے کے لیے سلطان کو نیچے رکھنا پڑا۔ 262}۔"
  tr: "Yargıç Majd al-Din Abdul Majid bin Umar, İbn al-Qudwa olarak bilinir, Haysamiyye'nin Keramisi'nden olup Firuzkuh'da asketizmi, bilgisi ve ailesi nedeniyle önemli bir yere sahipti; 595 Hicri yılında Sultan Giyath al-Din al-Ghuri'nin konseyinde Fakhr al-Din al-Razi'nin tartışmacısıydı. Aralarındaki konuşma uzun sürdü ve o Gurur ve hakaretle doluydu. İbn Kudva ertesi gün camide vaaz verdi; sadece Allah'ın Elçisi'nden doğru olanı söyleyeceğini, Aristoteles'in bilimini, İbn Sina'nın sapkınlıklarını ya da el-Farabi felsefesini bilmediğini ilan etti. Ağladı, insanlar karmaşa içindeydi ve şehir kargaşa içindeydi, ta ki Sultan müdahale edip el-Razi'yi evinden kovana kadar. {cite:) Kamil-ibn-al-Athir s. 262}."
  id: "Hakim Majd al-Din Abdul Majid ibn Umar, yang dikenal sebagai Ibn al-Qudwa, berasal dari Karami Haysamiyya dan menempati posisi penting di antara mereka di Firuzkuh karena asketisme, pengetahuan, dan rumah tangganya; ia adalah pendebat Fakhr al-Din al-Razi dalam dewan Sultan Ghiyath al-Din al-Ghuri pada tahun 595 H. Percakapan antara mereka berlangsung lama, dan ia dipenuhi kebanggaan serta hinaan. Ibn al-Qudwa berkhotbah di masjid keesokan harinya, menyatakan bahwa ia hanya akan mengatakan apa yang otentik dari Rasul Allah dan bahwa ia tidak mengetahui ilmu Aristoteles, ajaran sesat Ibn Sina, atau filsafat al-Farabi. Ia menangis, orang-orang dalam kekacauan, dan kota dipenuhi kekacauan sampai Sultan turun tangan dan mengusir al-Razi dari rumahnya. {cite:Kamil-ibn-al-Athir hlm. 262}."
