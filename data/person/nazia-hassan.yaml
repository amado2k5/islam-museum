summary:
  ar: "مغنية وكاتبة أغاني باكستانية (1965–2000) لُقّبت بـ«ملكة البوب في جنوب آسيا»؛ نالت الشهرة في الخامسة عشرة بأغنية «آپ جیسا کوئی» في الفيلم الهندي «قرباني» (1980)، وباعت مع أخيها زوهيب، في ثنائي «نازية وزوهيب»، أكثر من 65 مليون أسطوانة حول العالم؛ توفيت بسرطان الرئة في لندن عن 35 عامًا، ومُنحت وسام فخر الأداء بعد وفاتها سنة 2002."
  en: "Pakistani singer and songwriter (1965–2000), the 'Queen of South Asian Pop'. She shot to fame at fifteen with 'Aap Jaisa Koi' in the Indian film Qurbani (1980), and with her brother Zoheb, as the duo Nazia and Zoheb, sold over 65 million records worldwide; she died of lung cancer in London aged 35 and received the Pride of Performance posthumously in 2002."
  ur: "پاکستانی گلوکارہ اور نغمہ نگار (1965–2000)، جنہیں «جنوبی ایشیا کی پاپ کی ملکہ» کہا جاتا ہے؛ پندرہ برس کی عمر میں بھارتی فلم «قربانی» (1980) کے گیت «آپ جیسا کوئی» سے شہرت ملی، اور بھائی زوہیب کے ساتھ «نازیہ اور زوہیب» کے طور پر دنیا بھر میں ساڑھے چھ کروڑ سے زائد ریکارڈ فروخت کیے؛ 35 برس کی عمر میں لندن میں پھیپھڑوں کے سرطان سے وفات پائی اور 2002 میں بعد از مرگ تمغہ حسنِ کارکردگی سے نوازی گئیں۔"
