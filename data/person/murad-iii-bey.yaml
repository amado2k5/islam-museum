  note: "Born in 1680, son of Ali Bey, himself a son of Murad II Bey, and a Bedouin mother. The queue row's 1640 is contradicted by all three articles read, which give 1680; the Arabic article has him die aged about twenty-two, and the blinding his uncle Ramadan ordered belongs to the later 1690s, when a man born in 1640 would have been in his fifties. On his father's killer the texts divide: the English and French articles name his uncle Muhammad Bey, the Arabic article names Ramadan Bey; the English/French reading is followed in the prose and the conflict preserved here."
