summary:
  ar: "مراد باي الثالث (1680–حزيران 1702) آخر بايات تونس المراديين، حكم من 16 آذار 1699 حتى اغتياله {cite:wikipedia-murad-iii-bey-ar}. هو ابن علي باي الذي قتله أخوه محمد باي المرادي، فتبنّى مرادَ عمّاه محمد ثم رمضان باي، ففرّ من أمر رمضان بفقء عينيه، وثار من جبل وسلات فأخذ القيروان وتونس وقتل رمضان {cite:wikipedia-murad-iii-bey-fr}. أكسبته تصفياته لقب «مراد بو بالة»؛ نهب القيروان وحمل على قسنطينة الجزائرية قبل أن يغتاله إبراهيم الشريف بأمر عثماني عند وادي الزرقة في حزيران 1702 ويقضي على المراديين {cite:wikipedia-murad-iii-bey-en}. تذكر صدور المقالات الاغتيال في 9 حزيران ومتونها في 2 حزيران {cite:wikipedia-murad-iii-bey-fr}."
  en: "Murad III Bey (1680–June 1702) was the last Muradid Bey of Tunis, reigning from 16 March 1699 until his assassination {cite:wikipedia-murad-iii-bey-en}. Son of Ali Bey, who was murdered by his brother Muhammad Bey al-Muradi, the young Murad was adopted in turn by Muhammad and by his other uncle Ramadan Bey, escaped Ramadan's order to blind him, raised a revolt from Jebel Ousselat, took Kairouan and Tunis and had Ramadan executed {cite:wikipedia-murad-iii-bey-fr}. His purges earned him the nickname Murad Bu Bala; he sacked Kairouan and campaigned against Algiers-held Constantine before Ibrahim Sharif, acting on Ottoman orders, shot him at Wadi Zarka in June 1702 and extinguished the Muradid line {cite:wikipedia-murad-iii-bey-en}. The articles' leads date the killing to 9 June, their narratives to 2 June {cite:wikipedia-murad-iii-bey-fr}."
  ur: "مراد بای سوم (1680ء–جون 1702ء) تونس کے آخری مرادی بای تھے، 16 مارچ 1699ء سے اپنے قتل تک حکمران رہے {cite:wikipedia-murad-iii-bey-ar}۔ وہ علی بای کے بیٹے تھے جنہیں ان کے بھائی محمد بای المرادی نے قتل کیا تھا؛ مراد کو دونوں چچاؤں محمد اور پھر رمضان بای نے گود لیا، رمضان کے اندھا کرنے کے حکم سے بھاگ نکلے، جبل وسلات سے بغاوت کی، قیروان و تونس لے کر رمضان کو قتل کروایا {cite:wikipedia-murad-iii-bey-fr}۔ ان کی صفائی مہم سے لقب «مراد بو بالہ» پڑا؛ قیروان کو لوٹا اور الجزائری قسنطینہ پر چڑھائی کی، پھر ابراہیم الشریف نے عثمانی حکم پر جون 1702ء میں وادی الزرقہ کے پاس انہیں گولی مار کر مرادی سلسلہ ختم کر دیا {cite:wikipedia-murad-iii-bey-en}۔ مضامین کے آغاز میں قتل 9 جون اور متن میں 2 جون درج ہے {cite:wikipedia-murad-iii-bey-fr}۔"

