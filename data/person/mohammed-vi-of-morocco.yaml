summary:
  ar: "ملك المغرب منذ 23 يوليو 1999. وُلد في الرباط سنة 1963 وهو ابن الحسن الثاني وخلفه على العرش بعد وفاته، درس القانون في جامعة محمد الخامس ونال الدكتوراه من جامعة نيس سنة 1993، وأجرى إصلاحات منها مدونة الأسرة الجديدة، وقاد إعادة هيكلة الحقل الديني في المغرب، ووسّع علاقات بلاده في أفريقيا والعالم ووقّع اتفاق التطبيع مع إسرائيل سنة 2020."
  en: "King of Morocco since 23 July 1999. Born at Rabat in 1963, the son of Hassan II, whom he succeeded on the throne at his death, he studied law at Mohammed V University and took a doctorate at the University of Nice in 1993, introduced reforms including a new family code, led a restructuring of Morocco's religious field, widened his country's ties across Africa and the world, and signed the 2020 normalisation agreement with Israel."
  ur: "23 جولائی 1999 سے مراکش کے بادشاہ۔ وہ 1963 میں رباط میں پیدا ہوئے، حسن ثانی کے بیٹے اور ان کی وفات پر ان کے جانشین بنے، جامعہ محمد الخامس سے قانون کی تعلیم حاصل کی اور 1993 میں جامعہ نیس سے ڈاکٹریٹ لی، اصلاحات متعارف کرائیں جن میں نیا عائلی قانون شامل ہے، مراکش کے مذہبی شعبے کی تنظیم نو کی قیادت کی، اور 2020 میں اسرائیل کے ساتھ معمول کے تعلقات کا معاہدہ کیا۔"
