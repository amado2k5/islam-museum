summary:
  ar: "نبي من أنبياء بني إسرائيل في التراث الإسلامي؛ تروي نهاية الأرب للنويري عن الكسائي أنه كان فتى على دين إلياس أحياه الله بدعائه ثم استخلفه إلياس على المؤمنين، وعن الثعلبي أن الله نبّأه بعد رفع إلياس وبعثه إلى بني إسرائيل فآمنوا به {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 25} {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 26} {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 40}."
  en: "A prophet of the Children of Israel in Islamic tradition; al-Nuwayri's Nihayat al-Arab relates from al-Kisa'i that he was a boy of Ilyas's religion whom God revived at Ilyas's prayer and whom Ilyas made his successor over the believers, and from al-Tha'labi that God made him a prophet after Ilyas was raised up and sent him to the Children of Israel, who believed in him {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 25} {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 26} {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 40}."
  ur: "اسلامی روایت میں بنی اسرائیل کے ایک نبی؛ نویری کی نہایۃ الارب کسائی سے روایت کرتی ہے کہ وہ الیاس کے دین پر ایک لڑکے تھے جنہیں اللہ نے الیاس کی دعا سے زندہ کیا اور الیاس نے انہیں مومنوں پر جانشین بنایا، اور ثعلبی سے کہ الیاس کے اٹھا لیے جانے کے بعد اللہ نے انہیں نبوت دے کر بنی اسرائیل کی طرف بھیجا اور وہ ان پر ایمان لائے {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 25} {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 26} {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 40}۔"
