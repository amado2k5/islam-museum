class: person
label: { ar: "علي بن سليمان بن علي", en: "Ali ibn Sulayman ibn Ali", es: "Ali ibn Sulayman ibn Ali", fr: "Ali ibn Sulayman ibn Ali" }
summary:
  ar: "علي بن سليمان بن علي بن عبد الله بن العباس؛ عند البلاذري: كان على الجزيرة وقنسرين فأنشأ مدينة الحدث بلبن فسُمّيت المحمدية وتوفي المهدي مع فراغهم من بنائها سنة 169 فهي المهدية والحمدية — وقال أبو الخطاب فرض بها لأربعة آلاف فأسكنهم إياها ونقل إليها من ملطية وشمشاط وسميساط وكيسوم ودلوك ورعبان ألفي رجل — وكان قد قدم على الجزيرة والياً قبل ذلك فنقل أسواق الرقة إلى الفضاء الذي بينها وبين الرافقة، وعزله موسى الهادي وولّى مكانه محمد بن إبراهيم."
  en: "Ali ibn Sulayman ibn Ali ibn Abdallah ibn al-Abbas; in al-Baladhuri: while over the Jazira and Qinnasrin he founded Madinat al-Hadath in mud brick — named al-Muhammadiyya — and al-Mahdi died just at its completion in year 169, whence it is also al-Mahdiyya and al-Hamadiyya; Abu al-Khattab says he levied four thousand for it, settled them in it and transferred two thousand men from Malatya, Shimshat, Sumaysat, Kaysum, Duluk and Ra'ban; earlier, as governor of the Jazira, he had moved al-Raqqa's markets into the open space between it and al-Rafiqa; Musa al-Hadi removed him, appointing Muhammad ibn Ibrahim in his place."
  es: "Ali ibn Sulayman ibn Ali ibn Abdallah ibn al-Abbas; en al-Baladhuri: mientras que sobre el Jazira y Qinnasrin fundó Madinat al-Hadath en ladrillo de barro —llamada al-Muhammadiyya— y al-Mahdi murió justo cuando se terminó en el año 169, de donde también es al-Mahdiyya y al-Hamadiyya; Abu al-Khattab dice que recaudó cuatro mil para ella, los estableció en ella y transfirió dos mil hombres de Malatya, Shimshat, Sumaysat, Kaysum, Duluk y Ra'ban; anteriormente, como gobernador del Jazira, había trasladado los mercados de al-Raqqa al espacio abierto entre esta y al-Rafiqa; Musa al-Hadi lo destituyó, nombrando a Muhammad ibn Ibrahim en su lugar."
  fr: "Ali ibn Sulayman ibn Ali ibn Abdallah ibn al-Abbas, selon al-Baladhuri: alors qu'il régnait sur la Jazira et le Qinnasrin, il fonda Madinat al-Hadath en briques de terre crue – nommée al-Muhammadiyya – et al-Mahdi mourut juste après son achèvement en l'an 169, d'où son autre nom: al-Mahdiyya et al-Hamadiyya. Abu al-Khattab rapporte qu'il leva quatre mille hommes pour sa construction, les y installa et y transféra deux mille hommes de Malatya, Shimshat, Sumaysat, Kaysum, Duluk et Ra'ban. Auparavant, en tant que gouverneur de la Jazira, il avait déplacé les marchés d'al-Raqqa dans l'espace ouvert situé entre cette ville et al-Rafiqa. Musa al-Hadi le destitua et nomma Muhammad ibn Ibrahim à sa place."
