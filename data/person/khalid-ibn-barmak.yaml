summary:
  ar: "خالد بن برمك، جد أسرة البرامكة الوزراء؛ تنتسب الأسرة إلى برمك جدها وهو لقب سادن معبد النوبهار في مدينة بلخ. برز خالد في أوائل العهد العباسي بمقدرته الإدارية والمالية ورجاحة عقله وبعد نظره، فقلده السفاح ديوان الخراج وديوان الجند، وتولى وزارة التنفيذ بعد مصرع أبي سلمة الخلال، وعمل مستشاراً للمنصور ومشرفاً على الشؤون المالية ولمع اسمه في بناء مدينة بغداد، وظلت له مكانته في عهد المهدي الذي ولاه مقاطعة فارس سنة ١٦٣هـ {cite:tarikh-dawla-abbasiyya-taqqush p. 97}."
  en: "Khalid ibn Barmak — founder of the Barmakid viziers' fortunes, holder of the kharaj and army diwans under al-Saffah, al-Mansur's finance minister and Baghdad's builder, governor of Fars in 163 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 97}."
