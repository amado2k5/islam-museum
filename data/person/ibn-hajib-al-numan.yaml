label: { ar: "ابن حاجب النعمان كاتب الخليفتين", en: "Ibn Hajib al-Nu'man", es: "Ibn Hajib al-Nu'man", fr: "Ibn Hajib al-Nu'man", ur: "ابن حاجب النعمان" }
summary:
  ar: "علي بن عبد العزيز بن إبراهيم بن بيان أبو الحسن، ولد سنة أربعين وثلاثمائة؛ كتب للطائع ثم للقادر بالله من شوال سنة ٣٨٦ فكتب لخليفتين أربعين سنة، وكان أبوه قد خدم في وزارة أبي عمر المحلّة؛ وكان بليغًا. مات في رجب سنة ٤٢١ ودُفن ببركة زلزل ثم نُقل إلى مقابر قريش سنة ٤٢٥؛ وخلفه ابنه أبو الفضل في الكتابة ثمانية أشهر ثم عُزل لعدم بضاعته {cite:muntazam-ibn-al-jawzi j.8 p.393-394}."
  tr: "Ali ibn Abdülaziz ibn İbrahim ibn Bayan Ebu el-Hasan, 340 Hicri yılında doğdu; 386 Hicri Yılı'nda itaatkâr ve ardından El-Kadir Billah'a yazdı, kırk yıl boyunca iki halifeye yazdı. Babası Ebu Ömer el-Mahalla'nın hizmetinde görev yapmış ve etkileyici bir konuşma yapmıştı. 421 Hicri Recep'te öldü ve Beraka Zalzal'a defnedildi, ardından 425 Hicri'de Qureyş mezarlıklarına nakledildi. Oğlu Ebu el-Fadl, sekiz ay boyunca yazılı olarak onun yerine geçti, ancak mal eksikliği nedeniyle görevden alındı {atıf:Muntazam-ibn-al-Jawzi j.8 s.393-394}."
  id: "Ali ibn Abd al-Aziz ibn Ibrahim ibn Bayan Abu al-Hasan, lahir pada tahun 340 H; ia menulis kepada para taat dan kemudian kepada al-Qadir Billah pada Shawwal 386 H, menulis kepada dua khalifah selama empat puluh tahun. Ayahnya pernah melayani di pemerintahan Abu Umar al-Mahalla dan sangat fasih. Ia meninggal pada Rajab 421 H dan dimakamkan di Beraka Zalzal, kemudian dipindahkan ke pemakaman Quraisy pada 425 H. Putranya Abu al-Fadl menggantikannya dalam penulisan selama delapan bulan sebelum ia dipecat karena kekurangan barang {cite:muntazam-ibn-al-jawzi j.8 hlm.393-394}."
