summary:
  ar: "إسحاق بن عبد الله، المعروف بخوجه إسحاق أفندي وباش خوجه (نحو 1774 – 1836)، رياضي ومهندس ومربٍّ عثماني من آرطا (ناردا) من أعمال يانيا، وكبير معلّمي مدرسة الهندسة العسكرية السلطانية في إسطنبول. وهو من روّاد العلم الحديث في تركيا؛ أدخل حساب التفاضل والتكامل إلى التعليم العثماني، وجمع «مجموعة العلوم الرياضية» في أربعة مجلدات (1831–1834)، وترجم وألّف نحو ثلاثة عشر مجلدًا آخر من كتب العلوم."
  en: "İshak ibn Abdullah, known as Hoca İshak Efendi and as Başhoca (c. 1774 – 1836), was an Ottoman mathematician, engineer and educator from Arta (Narda) in the Yanya province, head instructor (başhoca) of the Imperial School of Military Engineering in Istanbul. A pioneer of modern science in Turkey, he was the first to treat differential and integral calculus in Ottoman teaching and compiled the four-volume Mecmua-i Ulum-i Riyaziyye (1831–1834), translating and writing some thirteen further volumes of scientific textbooks."
  ur: "اسحاق بن عبد اللہ، خوجہ اسحاق آفندی اور باش خوجہ کے نام سے مشہور (تقریباً 1774ء – 1836ء)، یانیہ کے علاقے آرطا (ناردا) سے تعلق رکھنے والے عثمانی ریاضی دان، انجینئر اور معلم تھے، اور استنبول کی سلطانی عسکری انجینئرنگ مدرسے کے باش خوجہ (سربراہ استاد) رہے۔ ترکی میں جدید سائنس کے بانیوں میں سے تھے؛ عثمانی تعلیم میں تفاضلی و تکاملی حساب کا ذکر سب سے پہلے انہوں نے کیا اور چار جلدوں پر مشتمل «مجموعۂ علومِ ریاضیہ» (1831–1834ء) مرتب کی، اس کے علاوہ سائنسی کتب کے تقریباً تیرہ مزید جلدوں کا ترجمہ و تصنیف کیا۔"

