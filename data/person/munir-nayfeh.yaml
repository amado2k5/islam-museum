summary:
  ar: "فيزيائي ذري ونانوتقني فلسطيني أمريكي، وُلد سنة 1945، أستاذ بجامعة إلينوي في أوربانا-شامبين. اشتهر بتحريك الذرات المفردة بالليزر وبتطوير جسيمات السيليكون النانوية المضيئة، وله كتب جامعية في الليزر."
  en: "Palestinian-American atomic physicist and nanotechnologist, born in 1945, professor at the University of Illinois Urbana-Champaign. Known for single-atom manipulation and luminescent silicon nanoparticles, and author of university textbooks on lasers."
  ur: "فلسطینی نژاد امریکی جوہری طبیعیات دان اور نینو ٹیکنالوجسٹ، 1945 میں پیدا ہوئے، یونیورسٹی آف الینوائے اربانا-شیمپین کے پروفیسر۔ وہ انفرادی جوہری رد و بدل اور چمکدار سلیکون نینو ذرّات کے لیے مشہور ہیں اور لیزر پر جامعاتی نصابی کتب کے مصنف۔"
  es: "Físico atómico y nanotecnólogo palestino-estadounidense, nacido en 1945, profesor de la Universidad de Illinois Urbana-Champaign. Conocido por la manipulación de átomos individuales y las nanopartículas de silicio luminiscentes, y autor de libros de texto universitarios sobre láseres."
  fr: "Physicien atomique et nanotechnologiste palestino-américain, né en 1945, professeur à l'Université de l'Illinois à Urbana-Champaign. Reconnu pour ses travaux sur la manipulation d'atomes uniques et les nanoparticules de silicium luminescentes, il est également l'auteur de manuels universitaires sur les lasers."
  tr: "1945 doğumlu, Filistin-Amerikalı nükleer fizikçi ve nanoteknikçi, Illinois Üniversitesi Urbana-Champaign'de profesördür. Lazerlerle tek atomları hareket ettirmesi ve parlak silikon nanoparçacıklar geliştirmesi ile ünlüdür ve lazerler üzerine üniversite kitapları vardır."
  id: "Seorang fisikawan nuklir dan nanoteknik Palestina-Amerika, lahir tahun 1945, seorang profesor di University of Illinois di Urbana-Champaign. Ia terkenal karena menggerakkan atom tunggal dengan laser dan mengembangkan nanopartikel silikon bercahaya, serta memiliki buku universitas tentang laser."
