summary:
  ar: "شاعر العشق الإلهي الملقب بسلطان العشاق وحجة أهل الوحدة وحامل لواء الشعراء؛ نشأ بمصر متعبداً يطوف في جبل المقطم وخرابات القرافة ثم انقطع بمكة نحو خمس عشرة سنة، وعاد فأقرأ ببقاعة الخطابة بالجامع الأزهر حتى كان الملك الكامل ينزل لزيارته؛ له الديوان المشهور الذي اعترف به الموافق والمخالف وفيه القصيدة التائية التي اعتنى بشرحها جماعة كالسراج الهندي والشمس البساطي والجلال القزويني والفرغاني والقاشاني والقيصري؛ قيل إن أحسن شعره القصيدة الفائية «قلبي يحدثني بأنك متلفي»، وتوفي بمصر ودفن بالمقطم {cite:shadharat-dhahab p. 149-153}."
  en: "Umar b. Ali Ibn al-Farid (566–632) — 'sultan of the lovers,' Egypt's supreme mystical poet; years of solitude at the Muqattam and a fifteen-year retreat at Mecca, then teaching at the Azhar's khitaba hall where even al-Kamil visited him; his diwan crowned by the Ta'iyya, commented on by the Siraj al-Hindi, al-Bisati, al-Qazwini, al-Farghani, al-Kashani and al-Qaysari; buried at the Muqattam {cite:shadharat-dhahab p. 149-153}."
  es: "Omar b. Ali Ibn al-Farid (566–632): 'sultán de los amantes', el poeta místico supremo de Egipto; años de soledad en el Muqattam y un retiro de quince años en La Meca, luego enseñando en la sala khitaba de Azhar, donde incluso al-Kamil lo visitó; su diwan coronado por los Ta'iyya, comentado por los Siraj al-Hindi, al-Bisati, al-Qazwini, al-Farghani, al-Kashani y al-Qaysari; enterrado en el Muqattam {cita: shadharat-dhahab p. 149-153}."
  fr: "Omar b. Ali Ibn al-Farid (566-632) — « sultan des amoureux », poète mystique suprême d'Égypte; des années de solitude au Muqattam et une retraite de quinze ans à La Mecque, puis un enseignement à la salle khitaba de l'Azhar où même al-Kamil lui rendit visite; son diwan couronné par les Ta'iyya, commenté par les Siraj al-Hindi, al-Bisati, al-Qazwini, al-Farghani, al-Kashani et al-Qaysari; enterré au Muqattam {cite: shadharat-dhahab p. 149-153}."
  ur: "عمر بی۔ علی ابن الفرید (566-632) - 'محبت کرنے والوں کا سلطان'، مصر کا اعلیٰ ترین صوفیانہ شاعر؛ مقطم میں برسوں کی تنہائی اور مکہ میں پندرہ سال کا اعتکاف، پھر ازہر کے خطبہ ہال میں درس دینا جہاں الکامل بھی ان سے ملنے گئے؛ اس کے دیوان کی تاج پوشی طائیہ نے کی ہے، جس پر سراج الہندی، البصاتی، القزوینی، الفرغانی، الکاشانی اور القیسری نے تبصرہ کیا ہے۔ مقطم میں دفن کیا گیا 149-153}۔"
