summary:
  ar: "شاعر العشق الإلهي الملقب بسلطان العشاق وحجة أهل الوحدة وحامل لواء الشعراء؛ نشأ بمصر متعبداً يطوف في جبل المقطم وخرابات القرافة ثم انقطع بمكة نحو خمس عشرة سنة، وعاد فأقرأ ببقاعة الخطابة بالجامع الأزهر حتى كان الملك الكامل ينزل لزيارته؛ له الديوان المشهور الذي اعترف به الموافق والمخالف وفيه القصيدة التائية التي اعتنى بشرحها جماعة كالسراج الهندي والشمس البساطي والجلال القزويني والفرغاني والقاشاني والقيصري؛ قيل إن أحسن شعره القصيدة الفائية «قلبي يحدثني بأنك متلفي»، وتوفي بمصر ودفن بالمقطم {cite:shadharat-dhahab p. 149-153}."
  en: "Umar b. Ali Ibn al-Farid (566–632) — 'sultan of the lovers,' Egypt's supreme mystical poet; years of solitude at the Muqattam and a fifteen-year retreat at Mecca, then teaching at the Azhar's khitaba hall where even al-Kamil visited him; his diwan crowned by the Ta'iyya, commented on by the Siraj al-Hindi, al-Bisati, al-Qazwini, al-Farghani, al-Kashani and al-Qaysari; buried at the Muqattam {cite:shadharat-dhahab p. 149-153}."
