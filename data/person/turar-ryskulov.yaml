summary:
  ar: "سياسي قازاقي سوفييتي (1894–1938): ترأس اللجنة التنفيذية المركزية ثم مجلس مفوضي الشعب في جمهورية تركستان السوفييتية، وعمل نائبا لمفوض القوميات وممثلا للكومنترن في منغوليا ونائب رئيس مجلس مفوضي الشعب في روسيا الاتحادية. اقترح حزبا شيوعيا تركيا مستقلا لتركستان فرفضه لينين. اعتُقل في التطهير الكبير وأُعدم في موسكو في 10 فبراير 1938 ورُدّ اعتباره سنة 1956."
  en: "Kazakh Soviet politician (1894–1938): he chaired the Central Executive Committee and then the Council of People's Commissars of the Turkestan ASSR, and served as deputy people's commissar for nationalities, as a Comintern representative in Mongolia and as deputy chairman of the Council of People's Commissars of the RSFSR. His proposal of a separate Turkic Communist Party for Turkestan was overruled by Lenin. Arrested in the Great Purge, he was shot in Moscow on 10 February 1938 and rehabilitated in 1956."
  ur: "قازاق سوویت سیاست دان (1894–1938): ترکستان خودمختار جمہوریہ کی مرکزی ایگزیکٹو کمیٹی اور پھر مفوضینِ عوام کی کونسل کے صدر رہے، قومیتوں کے نائب مفوض، منگولیا میں کومنٹرن کے نمائندے اور روسی وفاقی جمہوریہ کے مفوضین کی کونسل کے نائب صدر رہے۔ ترکستان کے لیے الگ ترک کمیونسٹ پارٹی کی ان کی تجویز لینن نے رد کر دی۔ عظیم تطہیر میں گرفتار ہوئے، 10 فروری 1938 کو ماسکو میں گولی مار دیے گئے اور 1956 میں بحالِ حیثیت ہوئے۔"
