summary:
  ar: "عبد السلام بن مشيش بن أبي بكر الإدريسي الحسني، أبو محمد، ناسك مغربي اشتهر برسالة له تدعى «الصلاة المشيشية» شرحها كثيرون، ولد في جبل العلم بثغر تطوان وقتل فيه ودفن بقمة الجبل؛ توفي سنة ٦٢٢هـ الموافقة ١٢٢٥م."
  en: "Abd al-Salam ibn Mashish ibn Abi Bakr al-Idrisi al-Hasani, Abu Muhammad, a Moroccan ascetic famed for a text called «al-Salat al-Mashishiyya», on which many have written commentaries; born on Jabal al-Alam by the port of Tetouan and killed there, he was buried at the mountain's summit. He died in 622 AH, 1225 CE."
