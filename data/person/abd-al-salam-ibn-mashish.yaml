summary:
  ar: "عبد السلام بن مشيش بن أبي بكر الإدريسي الحسني، أبو محمد، ناسك مغربي اشتهر برسالة له تدعى «الصلاة المشيشية» شرحها كثيرون، ولد في جبل العلم بثغر تطوان وقتل فيه ودفن بقمة الجبل؛ توفي سنة ٦٢٢هـ الموافقة ١٢٢٥م."
  en: "Abd al-Salam ibn Mashish ibn Abi Bakr al-Idrisi al-Hasani, Abu Muhammad, a Moroccan ascetic famed for a text called «al-Salat al-Mashishiyya», on which many have written commentaries; born on Jabal al-Alam by the port of Tetouan and killed there, he was buried at the mountain's summit. He died in 622 AH, 1225 CE."
  fr: "Abd al-Salam ibn Mashish ibn Abi Bakr al-Idrisi al-Hasani, Abu Muhammad, ascète marocain célèbre pour un texte appelé « al-Salat al-Mashishiyya », que beaucoup ont commenté ; né sur le Jabal al-Alam près du port de Tétouan et tué là, il fut inhumé au sommet de la montagne. Il mourut en 622 H, 1225 ap. J.-C."
  es: "Abd al-Salam ibn Mashish ibn Abi Bakr al-Idrisi al-Hasani, Abu Muhammad, un asceta marroquí famoso por un texto llamado «al-Salat al-Mashishiyya», sobre el cual se han escrito numerosos comentarios; nació en Jabal al-Alam, cerca del puerto de Tetuán, y fue asesinado allí. Fue enterrado en la cima de la montaña. Murió en el año 622 de la Hégira (1225 d. C.)."
  ur: "عبدالسلام ابن مشیش ابن ابی بکر الادریسی الحسنی، ابو محمد، ایک مراکشی سنی، جسے «الصلت المشیشیہ» نامی متن کے لیے شہرت ملی، جس پر بہت سے لوگوں نے تفسیریں لکھی ہیں۔ جبل العالم پر ٹیٹوان کی بندرگاہ پر پیدا ہوا اور وہیں قتل ہوا، اسے پہاڑ کی چوٹی پر دفن کیا گیا۔ ان کی وفات 622ھ بمطابق 1225ء میں ہوئی۔"
  tr: "Abdülsemîm ibn Meşiş ibn Ebu Bekr el-İdrisi el-Hasani, birçok kişi tarafından açıklanan “el-Salat el-Meşişîyye” adlı eseriyle ünlenen Faslı bir münzevidir. Tetuan limanındaki Cebel el-Alam'da doğmuş, orada öldürülmüş ve dağın tepesine gömülmüştür. Hicri 622 yılında, yani Miladi 1225 yılında vefat etmiştir."
  id: "Abd al-Salam ibn Mashish ibn Abi Bakr al-Idrisi al-Hasani, Abu Muhammad, seorang pertapa Maroko yang terkenal karena risalahnya yang berjudul “al-Salat al-Mashishiyya,” yang telah dijelaskan oleh banyak orang. Ia lahir di Jabal al-Alam di pelabuhan Tetouan, terbunuh di sana, dan dimakamkan di puncak gunung. Ia meninggal pada tahun 622 H, yang bertepatan dengan tahun 1225 M."
