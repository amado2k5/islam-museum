summary:
  ar: "قارئ وعالم سعودي من أصل أراكاني روهينغي (1952–2016)، وُلد بمكة، إمام المسجد النبوي بين 1990 و1997 وفي رمضان 2015، وعضو هيئة التدريس في التفسير بالجامعة الإسلامية بالمدينة، اشتهر بتلاوته الخاشعة."
  en: "Saudi reciter and scholar of Rohingya (Arakan) origin (1952–2016), born in Mecca, imam of the Prophet's Mosque from 1990 to 1997 and again for Ramadan 2015, and a tafsir faculty member at the Islamic University of Madinah, famed for his moving recitation."
  ur: "اراکانی روہنگیا نژاد سعودی قاری اور عالم (1952ء–2016ء)، مکہ میں پیدا ہوئے، 1990ء سے 1997ء تک اور رمضان 2015ء میں مسجد نبوی کے امام، مدینہ کی اسلامی یونیورسٹی میں تفسیر کے استاد، اپنی دل گداز تلاوت کے لیے مشہور۔"
