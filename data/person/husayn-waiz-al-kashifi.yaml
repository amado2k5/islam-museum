  ur: "سولہویں صدی کے ہرات کے مبلغ اور رودۃ الشہداء اور انور سہیلی کے کثیر الثانی مصنف حسین واعظ الکاشفی کے لیے ڈرافٹ کارڈ۔ 1504; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "On altıncı yüzyılda Herat'ın alimi ve vaizi, 'Rawdat al-Shuhada' ve 'Anwar Suhayli' kitaplarının yazarı Hüseyin Vaiz el-Kaşfi'nin ilk kartı; önemli kişilerin sözlüklerinde anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Hussein Wa'iz al-Kashfi, cendekiawan dan pengkhotbah Herat pada abad keenam belas, penulis 'Rawdat al-Shuhada' dan 'Anwar Suhayli', yang meninggal pada tahun 1504 M; ia dikenang dalam kamus tokoh-tokoh terkenal dan biografinya belum pernah diulas di halaman tersebut."
