label:
  ar: علاء الدين الحسين الغوري
  en: Ala al-Din al-Husayn al-Ghuri (Jahan-Suz)
summary:
  ar: "علاء الدين الحسين بن حسين، ملك الغور الملقب جهانسوز؛ ملك الغور بعد مقتل أخيه شوري واستولى على جبالها ومدينة بيروزكوه واستفحل ملكه وخطب فيها للسلطان سنجر، ثم سار يريد غزنة سنة 547هـ فملكها وأحرقها ثأراً لأخويه اللذين قتلهما بهرام شاه، وملك بلخ وقاتل السلطان سنجر فظفر به وأسره ثم خلع عليه ورده إلى بيروزكوه، فلما استفحل ملكه ثار عليه ابنا أخيه غياث الدين وشهاب الدين فقاتلاه حتى انهزم فأجلساه على التخت واستبدا عليه، وتوفي سنة 556هـ فقام غياث الدين بالأمر."
  en: "Ala al-Din al-Husayn ibn al-Husayn, king of Ghor called Jahan-Suz the World-Burner; succeeding his martyred brother Suri he mastered Ghor's mountains and Firuzkuh, proclaimed Sanjar in the khutba, marched on Ghazna in 547 AH and burned it in vengeance for the brothers Bahramshah killed, took Balkh, fought and was captured by Sultan Sanjar who released him back to Firuzkuh — and when his power swelled his nephews Ghiyath al-Din and Shihab al-Din rose, defeated him, yet seated him back on the throne as their puppet until his death in 556, when Ghiyath al-Din took the realm."
