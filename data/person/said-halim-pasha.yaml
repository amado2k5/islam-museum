summary:
  ar: "سياسي عثماني ومفكر إسلامي (1864-1921)، حفيد محمد علي باشا والي مصر، تولى الصدارة العظمى في الدولة العثمانية من 1913 إلى 1917 مع وزارة الخارجية، فوقّع التحالف العثماني الألماني رغم معارضته دخول الحرب، ووقّع أوامر ترحيل الأرمن، ونُفي إلى مالطا بعد الحرب وبُرّئ، ثم اغتيل في روما. كتب ثماني رسائل في الفكر الاجتماعي والسياسي جمعت في «برهاناتنا» (1919)، منها «إسلاملاشمق» (التأسلم)."
  en: "Ottoman statesman and Islamist thinker (1864–1921), a grandson of Muhammad Ali Pasha of Egypt. He was Grand Vizier of the Ottoman Empire from 1913 to 1917, holding the foreign ministry as well: he signed the Ottoman–German alliance despite opposing entry into the war, and signed the Armenian deportation orders; after the war he was exiled to Malta, acquitted, and assassinated in Rome. His eight treatises of social and political thought, mostly signed 'Mehmed', were collected as Buhranlarımız ('Our Crises', 1919); the best known is İslamlaşmak ('Islamisation')."
  ur: "عثمانی سیاست دان اور اسلامی مفکر (1864-1921)، محمد علی پاشا والیِ مصر کے پوتے؛ 1913 سے 1917 تک سلطنتِ عثمانیہ کے صدرِ اعظم اور وزیرِ خارجہ رہے، جنگ میں شمولیت کے مخالف ہونے کے باوجود عثمانی جرمن اتحاد پر دستخط کیے اور آرمنی بے دخلی کے احکامات پر بھی دستخط کیے؛ جنگ کے بعد مالٹا جلاوطن ہوئے، بری ہوئے اور روم میں قتل کر دیے گئے۔ ان کی آٹھ فکری رسائل «بحران‌لارمز» (1919) میں جمع ہوئے۔"
