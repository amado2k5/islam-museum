summary:
  ar: "سياسي عثماني ومفكر إسلامي (1864-1921)، حفيد محمد علي باشا والي مصر، تولى الصدارة العظمى في الدولة العثمانية من 1913 إلى 1917 مع وزارة الخارجية، فوقّع التحالف العثماني الألماني رغم معارضته دخول الحرب، ووقّع أوامر ترحيل الأرمن، ونُفي إلى مالطا بعد الحرب وبُرّئ، ثم اغتيل في روما. كتب ثماني رسائل في الفكر الاجتماعي والسياسي جمعت في «برهاناتنا» (1919)، منها «إسلاملاشمق» ⁦(التأسلم)⁩."
  en: "Ottoman statesman and Islamist thinker (1864–1921), a grandson of Muhammad Ali Pasha of Egypt. He was Grand Vizier of the Ottoman Empire from 1913 to 1917, holding the foreign ministry as well: he signed the Ottoman–German alliance despite opposing entry into the war, and signed the Armenian deportation orders; after the war he was exiled to Malta, acquitted, and assassinated in Rome. His eight treatises of social and political thought, mostly signed 'Mehmed', were collected as Buhranlarımız ('Our Crises', 1919); the best known is İslamlaşmak ('Islamisation')."
  ur: "عثمانی سیاست دان اور اسلامی مفکر (1864-1921)، محمد علی پاشا والیِ مصر کے پوتے؛ 1913 سے 1917 تک سلطنتِ عثمانیہ کے صدرِ اعظم اور وزیرِ خارجہ رہے، جنگ میں شمولیت کے مخالف ہونے کے باوجود عثمانی جرمن اتحاد پر دستخط کیے اور آرمنی بے دخلی کے احکامات پر بھی دستخط کیے؛ جنگ کے بعد مالٹا جلاوطن ہوئے، بری ہوئے اور روم میں قتل کر دیے گئے۔ ان کی آٹھ فکری رسائل «بحران‌لارمز» (1919) میں جمع ہوئے۔"
  es: "Estadista otomano y pensador islamista (1864-1921), nieto de Muhammad Ali Pasha de Egipto. Fue Gran Visir del Imperio Otomano de 1913 a 1917, ocupando también el cargo de Ministro de Asuntos Exteriores. Firmó la alianza otomano-alemana a pesar de oponerse a la entrada en la guerra y firmó las órdenes de deportación de Armenia. Tras la guerra, fue exiliado a Malta, absuelto y asesinado en Roma. Sus ocho tratados de pensamiento social y político, firmados en su mayoría como «Mehmed», se recopilaron en Buhranlarımız («Nuestras crisis», 1919); el más conocido es İslamlaşmak («Islamización»)."
  fr: "Homme d'État ottoman et penseur islamiste (1864-1921), petit-fils de Muhammad Ali Pacha d'Égypte, il fut grand vizir de l'Empire ottoman de 1913 à 1917, occupant également le ministère des Affaires étrangères. Il signa l'alliance germano-ottomane malgré son opposition à l'entrée en guerre et apposa les ordres de déportation des Arméniens. Après la guerre, il fut exilé à Malte, acquitté, puis assassiné à Rome. Ses huit traités de pensée sociale et politique, signés pour la plupart « Mehmed », furent réunis dans Buhranlarımız (« Nos crises », 1919); le plus connu est İslamlaşmak (« Islamisation »)."
  tr: "Osmanlı siyasetçisi ve İslami düşünür (1864-1921), Mısır valisi Muhammed Ali Paşa'nın torunu olan Sher, 1913'ten 1917'ye kadar Osmanlı İmparatorluğu'nda Dışişleri Bakanlığı'nda en yüksek makamı üstlendi. Savaşa girmeye karşı olmasına rağmen Osmanlı-Alman ittifakı kuruldu, Ermenilerin sınır dışı edilmesi için emirler imzaladı, savaş sonrası Malta'ya sürgün edildi, beraat etti ve ardından Roma'da suikasta uğradı. \"Kanıtlarımız\" (1919) adlı eserde toplanan sekiz sosyal ve siyasi düşünce risale yazdı; bunlar arasında \"İslam Utancımıza İslamlaşma\" (İslamlaşma) da vardı."
  id: "Seorang politikus Ottoman dan pemikir Islam (1864-1921), cucu Muhammad Ali Pasha, gubernur Mesir, ia memegang posisi tertinggi di Kekaisaran Ottoman dari tahun 1913 hingga 1917 di Kementerian Luar Negeri. Meskipun menentang masuk perang, aliansi Ottoman-Jerman terbentuk, ia menandatangani perintah untuk mendeportasi orang Armenia, diasingkan ke Malta setelah perang, dibebaskan, dan kemudian dibunuh di Roma. Ia menulis delapan risalah tentang pemikiran sosial dan politik yang dikumpulkan dalam \"Our Proofs\" (1919), termasuk \"Islam to Shame\" (Islamisasi)."
