id: person/abu-said-uthman-zayyanid
class: person
label:
  ar: أبو سعيد عثمان بن عبد الرحمن
  en: Abu Sa'id Uthman ibn Abd al-Rahman
  fr: "Abu Sa'id Uthman ibn Abd al-Rahman"
  es: "Abu Sa'id Uthman ibn Abd al-Rahman"
  ur: "ابو سعید عثمان بن عبدالرحمٰن"
summary:
  ar: "أبو سعيد عثمان بن عبد الرحمن بن أبي يحيى بن يغمراسن؛ من آل يغمراسن نقلهم السلطان أبو الحسن المريني من تلمسان إلى المغرب في جملة أعياصهم فاستأذنوه في المرابطة بثغور الأندلس فأنزلهم الجزيرة، ثم استنفرهم مع زناتة لغزو إفريقية سنة 748هـ فكانوا في جملته، ولما كانت نكبة القيروان انطلقت أيدي بني عبد الواد فمروا بتونس ثم لحقوا بشلف واجتمع إليهم بنو قومهم وبايعوا عثمان بن عبد الرحمن بباب مصلى العيد من تونس على درقة، وانصرف هو وأخوه أبو ثابت بعد أن أحكما العهد مع علي بن راشد أمير مغراوة، فاستردا ملك تلمسان في الكرة الثانية بعد مهلك السلطان أبي عنان."
  en: "Abu Sa'id Uthman ibn Abd al-Rahman ibn Abi Yahya ibn Yaghmurasan; of the Abd al-Wadid house carried off to Morocco in Abu al-Hasan's captivity, released to the frontier jihad in the Andalusian marches, then levied for the Ifriqiya campaign of 748 — when the Qayrawan disaster broke the army they slipped home by Tunis, the folk swearing to Uthman ibn Abd al-Rahman on a shield at Tunis's musalla gate, and he and his brother Abu Thabit, having sealed their pact with Ali ibn Rashid of Maghrawa, restored the Tlemcen kingship in the second round after Abu Inan's death."
  fr: "Abu Sa'id Uthman ibn Abd al-Rahman ibn Abi Yahya ibn Yaghmurasan ; membre de la maison abdelwadide emmenée captive au Maroc par Abu al-Hasan, autorisée ensuite à mener le jihad frontalier dans les marches andalouses, puis mobilisée pour la campagne d'Ifriqiya de 748. Lorsque le désastre de Kairouan brisa l'armée, ils regagnèrent leur pays par Tunis, où les leurs prêtèrent allégeance à Uthman ibn Abd al-Rahman sur un bouclier à la porte de la musalla. Lui et son frère Abu Thabit, après avoir scellé leur pacte avec Ali ibn Rashid des Maghrawa, rétablirent la royauté de Tlemcen dans un second temps après la mort d'Abu Inan."
  es: "Abu Sa'id Uthman ibn Abd al-Rahman ibn Abi Yahya ibn Yaghmurasan, de la casa Abd al-Wadid, fue llevado a Marruecos durante el cautiverio de Abu al-Hasan, liberado para la yihad fronteriza en las marcas andaluzas y luego reclutado para la campaña de Ifriqiya de 748. Cuando el desastre de Qayrawan destrozó el ejército, regresaron sigilosamente a casa por Túnez. El pueblo juró lealtad a Uthman ibn Abd al-Rahman sobre un escudo en la puerta de la mezquita de Túnez, y él y su hermano Abu Thabit, tras sellar su pacto con Ali ibn Rashid de Maghrawa, restauraron el reino de Tlemcen en la segunda ronda después de la muerte de Abu Inan."
  ur: "ابو سعید عثمان بن عبدالرحمٰن بن ابی یحییٰ بن یغموراسن۔ ابو الحسن کی قید میں عبد الودید کے گھر سے مراکش لے جایا گیا، اندلس کے مارچوں میں فرنٹیر جہاد کے لیے رہا کیا گیا، پھر 748 کی افریقیہ مہم کے لیے لگایا گیا - جب قیروان کی تباہی نے فوج کو توڑا تو وہ تیونس سے گھر پھسل گئے، یہ لوک عبد النساء النساء کے پاس عثمان النساء اللہ کی قسم کھاتے تھے۔ گیٹ، اور اس نے اور اس کے بھائی ابو ثابت نے، مغراوہ کے علی بن راشد کے ساتھ اپنے معاہدے پر مہر لگا کر، ابو انان کی موت کے بعد دوسرے دور میں ٹیلمسن کی بادشاہت کو بحال کیا۔"
  tr: "Ebu Said Osman bin Abdül Rahman bin Ebu Yahya bin Yaghmurasen; Sultan Ebu el-Hasan el-Marini'nin önderleriyle birlikte Tlemcen'den Fas'a gönderdiği Yaghmurasen ailesindendir. Onlar da Endülüs sınırlarında konuşlanmak için izin istediler ve Sultan onları adaya yerleştirdi. Daha sonra Sultan, 748 Hicri yılında Afrika'yı işgal etmek için Zenata kabilesiyle birlikte seferber etti ve onlar da Sultan'ın maiyetindeydiler. Kayrevan felaketi meydana geldiğinde, Beni Abdül-Vad kabilesinin elleri serbest kaldı, böylece Tunus'tan geçtiler, sonra Çlef'e katıldılar ve halkları onlarla birlikte toplanarak Tunus'taki bayram namazı kapısında bir kalkan üzerine Osman bin Abdül Rahman'a biat ettiler. Osman ve kardeşi Ebu Sabit, Mağrava Emiri Ali bin Raşid ile bir anlaşma yaptıktan sonra ayrıldılar ve Sultan Ebu Anan'ın ölümünden sonra ikinci turda Tlemcen krallığını geri aldılar."
  id: "Abu Saeed Othman bin Abdul Rahman bin Abi Yahya bin Yaghmurasen; dari keluarga Yaghmurasen, yang dipindahkan oleh Sultan Abu Al-Hassan Al-Marini dari Tlemcen ke Maroko di tengah-tengah para pemimpin mereka, sehingga mereka meminta izinnya untuk ditempatkan di perbatasan Andalusia, lalu beliau menempatkan mereka di pulau itu, kemudian beliau memobilisasi mereka dengan Zenata untuk menyerang Afrika pada tahun 748 H, sehingga mereka berada dalam rombongannya, dan ketika bencana Kairouan terjadi, tangan Bani Abd Al-Wad dibebaskan, sehingga mereka melewati Tunis, kemudian mereka bergabung dengan Chlef, dan orang-orang mereka berkumpul bersama mereka dan berjanji setia kepada Othman bin Abdul Rahman di gerbang shalat Id di Tunis di atas sebuah perisai, dan dia dan saudaranya Abu Thabit berangkat setelah mereka membuat perjanjian dengan Ali bin Rashid, Emir Maghrawa, sehingga mereka merebut kembali kerajaan Tlemcen pada putaran kedua setelah kematian Sultan Abu Anan."
