id: person/abu-said-uthman-zayyanid
class: person
label:
  ar: أبو سعيد عثمان بن عبد الرحمن
  en: Abu Sa'id Uthman ibn Abd al-Rahman
summary:
  ar: "أبو سعيد عثمان بن عبد الرحمن بن أبي يحيى بن يغمراسن؛ من آل يغمراسن نقلهم السلطان أبو الحسن المريني من تلمسان إلى المغرب في جملة أعياصهم فاستأذنوه في المرابطة بثغور الأندلس فأنزلهم الجزيرة، ثم استنفرهم مع زناتة لغزو إفريقية سنة 748هـ فكانوا في جملته، ولما كانت نكبة القيروان انطلقت أيدي بني عبد الواد فمروا بتونس ثم لحقوا بشلف واجتمع إليهم بنو قومهم وبايعوا عثمان بن عبد الرحمن بباب مصلى العيد من تونس على درقة، وانصرف هو وأخوه أبو ثابت بعد أن أحكما العهد مع علي بن راشد أمير مغراوة، فاستردا ملك تلمسان في الكرة الثانية بعد مهلك السلطان أبي عنان."
  en: "Abu Sa'id Uthman ibn Abd al-Rahman ibn Abi Yahya ibn Yaghmurasan; of the Abd al-Wadid house carried off to Morocco in Abu al-Hasan's captivity, released to the frontier jihad in the Andalusian marches, then levied for the Ifriqiya campaign of 748 — when the Qayrawan disaster broke the army they slipped home by Tunis, the folk swearing to Uthman ibn Abd al-Rahman on a shield at Tunis's musalla gate, and he and his brother Abu Thabit, having sealed their pact with Ali ibn Rashid of Maghrawa, restored the Tlemcen kingship in the second round after Abu Inan's death."
