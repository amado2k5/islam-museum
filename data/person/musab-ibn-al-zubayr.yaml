class: person
label: { ar: "مصعب بن الزبير", en: "Mus'ab ibn al-Zubayr", es: "Mus'ab ibn al-Zubayr", fr: "Mus'ab ibn al-Zubayr", ur: "مصعب بن الزبیر" }
summary:
  ar: "مصعب بن الزبير؛ أمير العراق لأخيه عبد الله بن الزبير، ضرب في أيامه دراهم قليلة كسرت بعد. وعند المسعودي أمنهم ثم قتلهم بعد ذلك، فكان جملة من أدركه الإحصاء ممن قتله مع المختار سبعة آلاف رجل وسماهم الخشبية، وأتى بحرم المختار فدعاهن إلى البراءة فتبرأت بنت سمرة بن جندب وأبت ابنة النعمان بن بشير فقتلها صبراً {cite:muruj-al-dhahab p. 93}"
  en: "Mus'ab ibn al-Zubayr; his brother Abdallah's amir over Iraq, who struck a few dirhams, later broken."
  es: "Mus'ab ibn al-Zubayr, emir de Irak y hermano de Abdallah, acuñó unos pocos dirhams, que posteriormente se rompieron."
  fr: "Mus'ab ibn al-Zubayr; l'émir de son frère Abdallah sur l'Irak, qui a frappé quelques dirhams, plus tard brisés."
  ur: "مصعب بن الزبیر؛ اس کے بھائی عبداللہ کا عراق پر امیر، جس نے چند درہم مارا، بعد میں ٹوٹ گیا۔"
  tr: "Kardeşi Abdullah ibn al-Zubayr'ın Irak Emiri olan Mus'ab ibn al-Zubayr, saltanatı sırasında birkaç dirhem bastı, ancak bunlar daha sonra kırıldı. Al-Mas'udi bunları güvence altına aldı ve ardından öldürdü. Nüfus sayımında, al-Mukhtar ile birlikte onu öldüren yedi bin adam vardı; ona el-Haşabiyyah adını verdi. El-Muhtar'ın kutsal alanına geldi ve onları beraat ettirdi, ancak Samura ibn Jundub'un kızı reddedildi ve el-Nu'man bin Beşir'in kızı sabırla öldürülerek öldürüldü {atıf:Muruj-al-Dhahab, s. 93}"
  id: "Mus'ab ibn al-Zubayr, Emir Irak bagi saudaranya Abdullah ibn al-Zubayr, mencetak beberapa dirham selama pemerintahannya, yang kemudian dipecahkan. Al-Mas'udi mengamankannya dan kemudian membunuh mereka setelahnya. Sensus mencakup tujuh ribu orang yang membunuhnya bersama al-Mukhtar, yang ia sebut al-Khashabiyyah. Ia datang ke tempat suci al-Mukhtar dan memanggil mereka untuk membebaskan, tetapi putri Samura ibn Jundub dicacat, dan putri al-Nu'man ibn Bashir dibubarkan, membunuhnya dengan sabar {cite:muruj-al-dhahab, hlm. 93}"
