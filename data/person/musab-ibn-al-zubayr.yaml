  ar: "مصعب بن الزبير؛ أمير العراق لأخيه عبد الله بن الزبير، ضرب في أيامه دراهم قليلة كسرت بعد. وعند المسعودي أمنهم ثم قتلهم بعد ذلك، فكان جملة من أدركه الإحصاء ممن قتله مع المختار سبعة آلاف رجل وسماهم الخشبية، وأتى بحرم المختار فدعاهن إلى البراءة فتبرأت بنت سمرة بن جندب وأبت ابنة النعمان بن بشير فقتلها صبراً {cite:muruj-al-dhahab p. 93}"
  en: "Mus'ab ibn al-Zubayr; his brother Abdallah's amir over Iraq, who struck a few dirhams, later broken."
  es: "Mus'ab ibn al-Zubayr, emir de Irak y hermano de Abdallah, acuñó unos pocos dirhams, que posteriormente se rompieron."
  fr: "Mus'ab ibn al-Zubayr; l'émir de son frère Abdallah sur l'Irak, qui a frappé quelques dirhams, plus tard brisés."
