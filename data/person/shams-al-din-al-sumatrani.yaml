summary:
  ar: بطاقة أولية لشمس الدين السمطراني، عالم أتشيهي القرن السابع عشر من كبار علماء سلطنة أتشيه، توفي سنة ١٦٣٠م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد.
  en: Draft card for Shams al-Din al-Sumatrani, the seventeenth-century Acehnese scholar of the Aceh Sultanate, d. 1630; the biographical entry is not yet checked on the page.
  es: "Ficha de borrador para Shams al-Din al-Sumatrani, erudito acehnés del siglo XVII del Sultanato de Aceh, fallecido en 1630; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de candidature pour Shams al-Din al-Sumatrani, érudit acehnais du XVIIe siècle du sultanat d'Aceh, décédé en 1630; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "آچے سلطنت کے سترہویں صدی کے آچنی اسکالر شمس الدین السمطرانی کے لیے ڈرافٹ کارڈ۔ 1630; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1630 yılında ölen, on yedinci yüzyılda Aceh'in alimi ve Aceh Sultanlığı'nın büyük alimlerinden biri olan Şemseddin el-Samtrani'nin ön kartı; önemli sözlüklerde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Shams al-Din al-Samtrani, seorang cendekiawan abad ketujuh belas dari Aceh dan salah satu sarjana besar Kesultanan Aceh, yang meninggal pada tahun 1630 M; ia disebutkan dalam kamus-kamus terkenal dan biografinya belum pernah diulas di halaman tersebut."
