class: person
label: { ar: "أشرس بن عوف", en: "Ashras ibn Awf", es: "Ashras ibn Awf", fr: "Ashras ibn Awf", ur: "اشراس بن عوف" }
summary:
  ar: "أشرس بن عوف رجل من شيبان؛ خاض به المستأمن من الأعاجم دجيل على عرق من حجارة ثم علا به مدينة تستر وأراه هرمزان ورده إلى العسكر فكان مدخل المسلمين عليها."
  en: "Ashras ibn Awf of Shayban; the Persian defector walked him across Dujayl's stone weir up into Tustar and showed him Hurmuzan — the way the Muslims entered the city."
  es: "Ashras ibn Awf de Shayban; el desertor persa lo acompañó a través del dique de piedra de Dujayl hasta Tustar y le mostró Hurmuzan, el camino por donde los musulmanes entraban a la ciudad."
  fr: "Ashras ibn Awf de Shayban; le transfuge perse l'a conduit à travers le barrage de pierre de Dujayl jusqu'à Tustar et lui a montré Hurmuzan — la façon dont les musulmans entraient dans la ville."
  ur: "اشراس بن عوف شعبان؛ فارسی منحرف اسے دجیل کے پتھر کے پار تستار تک لے گیا اور اسے ہرمزان دکھایا - جس طرح سے مسلمان شہر میں داخل ہوئے تھے۔"
  tr: "Ashra bin Awf Şeyban'dan bir adamdı; Dujail'in Arap olmayanlarından Musta'minler tarafından taş bir geçitte saldırıya uğradı, ardından Tustar şehrine çıktı ve Hormozan onu gördü, orduya geri gönderdi ve oradaki Müslümanların girişi oldu."
  id: "Ashras ibn Awf adalah seorang pria dari Shayban; ia diserang oleh Musta'min dari non-Arab Dujail di sebuah persimpangan batu, lalu ia naik ke kota Tustar, dan Hormozan melihatnya lalu mengembalikannya ke tentara, menjadikannya pintu masuk bagi umat Muslim di sana."
