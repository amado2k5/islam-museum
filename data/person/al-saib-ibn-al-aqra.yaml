summary:
  ar: "السائب بن الأقرع الثقفي؛ عند البلاذري بعثه عمر بكتابه إلى النعمان بن مقرن وولاه الغنائم وقال لا ترفعن باطلاً ولا تحبسن حقاً فجمعها وقسمها وأتاه ذو الموينتين فدله على كنز النخيركان في القلعة فصعدها فأخذ سفطي الجوهر فباعهما بأمر عمر."
  en: "al-Sa'ib ibn al-Aqra' al-Thaqafi; in al-Baladhuri, sent by Umar with his letter to al-Nu'man and charged with the spoils — 'raise no falsehood, withhold no right' — he gathered and divided them, and on Dhu al-Muwaynatayn's word climbed the fortress to the Nukhayrkan treasure, taking the two jewel baskets sold at Umar's order."
