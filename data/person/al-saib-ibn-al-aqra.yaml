id: person/al-saib-ibn-al-aqra
class: person
label: { ar: "السائب بن الأقرع", en: "al-Sa'ib ibn al-Aqra'", fr: "al-Sa'ib ibn al-Aqra'", es: "al-Sa'ib ibn al-Aqra'", ur: "السائب ابن الاقراء" }
summary:
  ar: "السائب بن الأقرع الثقفي؛ عند البلاذري بعثه عمر بكتابه إلى النعمان بن مقرن وولاه الغنائم وقال لا ترفعن باطلاً ولا تحبسن حقاً فجمعها وقسمها وأتاه ذو الموينتين فدله على كنز النخيركان في القلعة فصعدها فأخذ سفطي الجوهر فباعهما بأمر عمر."
  en: "al-Sa'ib ibn al-Aqra' al-Thaqafi; in al-Baladhuri, sent by Umar with his letter to al-Nu'man and charged with the spoils — 'raise no falsehood, withhold no right' — he gathered and divided them, and on Dhu al-Muwaynatayn's word climbed the fortress to the Nukhayrkan treasure, taking the two jewel baskets sold at Umar's order."
  fr: "al-Sa'ib ibn al-Aqra' al-Thaqafi  ; à al-Baladhuri, envoyé par Omar avec sa lettre à al-Nu'man et chargé du butin - « ne pas soulever de mensonge, ne pas retenir droit  » - il les a rassemblés et divisés, et sur la parole de Dhu al-Muwynatayn monté la forteresse au trésor de Nukhayrkan, prenant les deux bijoux panier vendus."
  es: "al-Sa'ib ibn al-Aqra' al-Thaqafi; en al-Baladhuri, enviado por Umar con su carta a al-Nu'man y encargado del botín — 'no pronuncies ninguna falsedad, no niegues ningún derecho' — los reunió y los dividió, y por orden de Dhu al-Muwaynatayn subió a la fortaleza hasta el tesoro de Nukhayrkan, tomando las dos cestas de joyas vendidas por orden de Umar."
  ur: "السائب ابن الاقراء الثقفی؛ البلادوری میں، عمر کی طرف سے اپنے خط کے ساتھ نعمان کو بھیجا گیا اور اس پر مال غنیمت کا الزام لگایا گیا - 'جھوٹ نہیں اٹھانا، کوئی حق نہیں روکنا' - اس نے ان کو جمع کیا اور تقسیم کیا، اور ذو المویناتین کے کلام پر قلعہ پر چڑھ کر نخیرکان کے خزانے پر چڑھ گئے، عمار کی دو ٹوکریاں آرڈر پر فروخت کی گئیں۔"
