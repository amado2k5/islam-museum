  ar: "خطاط مصري ⁦(1897–1994)⁩ يُعدّ من كبار أساتذة الخط العربي في القرن العشرين. درّس في مدرسة تحسين الخطوط الملكية بالقاهرة، وكتب نقوشًا في مساجد ومنشآت مصرية عدة، ونُسب إليه كثير من المصاحف المخطوطة الحديثة."
  en: "Egyptian master calligrapher (1897–1994), counted among the great teachers of Arabic calligraphy in the twentieth century. He taught at Cairo's Royal School for the Improvement of Calligraphy, executed inscriptions for Egyptian mosques and buildings, and wrote many modern Qur'an manuscripts and books."
  ur: "مصری استادِ خطاط ⁦(1897–1994)⁩ جو بیسویں صدی کے عربی خطاطی کے بڑے اساتذہ میں شمار ہوتے ہیں۔ انہوں نے قاہرہ کے شاہی مکتبِ تحسینِ خطوط میں تدریس کی، مصری مساجد اور عمارتوں کے کتبے لکھے اور متعدد جدید مصاحف اور کتابیں تحریر کیں۔"
