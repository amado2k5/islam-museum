summary:
  ar: "بكر بن عبد الله أبو زيد ⁦(1946–2008)⁩ فقيه حنبلي سعودي، عضو هيئة كبار العلماء والمجمع الفقهي الإسلامي الدولي، وقاضٍ سابق. من كتبه «حلية طالب العلم» — مرجع في آداب الطلب — و«فقه النوازل» و«التعالم»."
  en: "Bakr ibn Abd Allah Abu Zayd (1946–2008) was a Saudi Hanbali jurist, member of the Council of Senior Scholars and of the International Islamic Fiqh Academy, and a former judge. His books include Hilyat Talib al-'Ilm — a standard manual on scholarly etiquette — Fiqh al-Nawazil and Al-Ta'alum."
  ur: "بکر بن عبداللہ ابوزید ⁦(1946–2008)⁩ سعودی حنبلی فقیہ تھے، کونسل آف سینئر اسکالرز اور انٹرنیشنل اسلامی فقہ اکیڈمی کے رکن اور سابق قاضی۔ کتب میں «حلية طالب العلم» — طلبۂ علم کے آداب کی مرجع کتاب — «فقه النوازل» اور «التعالم» شامل ہیں۔"
  es: "Bakr ibn Abd Allah Abu Zayd (1946-2008) fue un jurista hanbalí saudí, miembro del Consejo de Altos Eruditos y de la Academia Internacional de Fiqh Islámico, y exjuez. Entre sus obras destacan Hilyat Talib al-'Ilm —un manual de referencia sobre etiqueta académica—, Fiqh al-Nawazil y Al-Ta'alum."
  fr: "Bakr ibn Abd Allah Abu Zayd (1946-2008) était un juriste hanbalite saoudien, membre du Conseil des grands oulémas et de l'Académie internationale de jurisprudence islamique, et ancien juge. Parmi ses ouvrages figurent Hilyat Talib al-'Ilm (un manuel de référence sur l'éthique savante), Fiqh al-Nawazil et Al-Ta'alum."
  tr: "Bakr bin Abdullah Abu Zayd (1946–2008), Suudi Hanbali hukukçusu, Kıdemli Alimler Konseyi ve Uluslararası İslami Fiqh Akademisi üyesi ve eski bir yargıçtı. Kitapları arasında \"Hilyat Talib al-Ilm\" — arama görgü kurallarına atıf — ve \"Fiqh al-Nawazil\" ile \"Al-Ta'lam\" yer alır."
  id: "Bakr bin Abdullah Abu Zayd (1946–2008) adalah seorang ahli hukum Hanbali Saudi, anggota Dewan Ulama Senior dan Akademi Fiqh Islam Internasional, serta mantan hakim. Di antara bukunya terdapat \"Hilyat Talib al-Ilm\" — sebuah referensi dalam etiket pencarian — serta \"Fiqh al-Nawazil\" dan \"Al-Ta'lam.\""
