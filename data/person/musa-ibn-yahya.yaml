id: person/musa-ibn-yahya
class: person
label: { ar: "موسى بن يحيى البرمكي", en: "Musa ibn Yahya al-Barmaki", es: "Musa ibn Yahya al-Barmaki", fr: "Musa ibn Yahya al-Barmaki", ur: "موسیٰ بن یحییٰ البرمکی" }
summary:
  ar: "موسى بن يحيى بن خالد بن برمك؛ خلفه غسان بن عباد على ثغر السند فقتل بالة ملك الشرقي وقد بذل له خمس مائة ألف درهم على أن يستبقيه وأثر أثراً حسناً ومات سنة ٢١٥ وخلفه ابنه عمران."
  en: "Musa ibn Yahya ibn Khalid ibn Barmak; Ghassan's successor on the thaghr — he slew Bala king of al-Sharqi past his five-hundred-thousand ransom, ruled well, and died in 215h."
  es: "Musa ibn Yahya ibn Khalid ibn Barmak; sucesor de Ghassan en el thaghr: mató a Bala, rey de al-Sharqi, tras haber pagado un rescate de quinientos mil, gobernó bien y murió en el año 215 de la Hégira."
  fr: "Musa ibn Yahya ibn Khalid ibn Barmak; successeur de Ghassan sur le thaghr — il tua Bala, roi d'al-Sharqi, au-delà de sa rançon de cinq cent mille, gouverna bien et mourut en 215 h."
  ur: "موسیٰ بن یحییٰ بن خالد بن برمک۔ غسان کا جانشین طاغر پر - اس نے الشرقی کے بادشاہ بالا کو اس کے پانچ لاکھ فدیے سے پہلے قتل کر دیا، اچھی طرح حکومت کی اور 215ھ میں وفات پائی۔"
  tr: "Musa ibn Yahya ibn Halid ibn Barmak; yerine Senad sınırında Ghassan ibn Abbad geçti ve burada Bala Malik al-Sharqi'yi öldürdü. Onu tutması için beş yüz bin dirhem teklif etti ve iyi bir miras bıraktı. 215 Hicri'de öldü ve yerine oğlu İmran geçti."
  id: "Musa ibn Yahya ibn Khalid ibn Barmak; ia digantikan oleh Ghassan ibn Abbad di perbatasan Sanad, di mana ia membunuh Bala Malik al-Sharqi. Ia menawarkan lima ratus ribu dirham untuk menjaganya, dan ia meninggalkan warisan yang baik. Ia meninggal pada tahun 215 H, dan digantikan oleh putranya Imran."
