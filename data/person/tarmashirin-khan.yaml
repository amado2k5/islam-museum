id: person/tarmashirin-khan
class: person
label:
  ar: ترماشين بن دوا ملك ما وراء النهر
  en: Tarmashirin, khan of Transoxiana
  es: "Tarmashirin, khan of Transoxiana"
  fr: "Tarmashirin, khan of Transoxiana"
summary:
  ar: "ترماشين بن دوا تمر بن حلو، ملك بني جفتاي بسمرقند وما وراء النهر؛ اضطرب ملكهم في أعقاب دولة بني جفتاي إلى أن ملك منهم جنقصو بن دوا تمر بن حلو، فلما صار الملك إلى ترماشين منهم أسلم رحمه اللّه، وكان أول ملوك بني جفتاي الذين ظهر فيهم الإسلام بسمرقند وما وراء النهر."
  en: "Tarmashirin ibn Duwa Temur ibn Halu, khan of the Chaghatayids at Samarkand and Transoxiana; their kingship had lurched after Jafhtay's line until Jankishi ibn Duwa Temur held it — when the throne passed to Tarmashirin he embraced Islam, the first of the Chaghatayid kings in whom Islam appeared at Samarkand and Transoxiana."
  es: "Tarmashirin ibn Duwa Temur ibn Halu, kan de los Chagataítas en Samarcanda y Transoxiana; su monarquía había seguido la línea de Jafhtay hasta que Jankishi ibn Duwa Temur la ocupó; cuando el trono pasó a Tarmashirin, este abrazó el Islam, siendo el primero de los reyes Chagataítas en quien el Islam apareció en Samarcanda y Transoxiana."
  fr: "Tarmashirin ibn Duwa Temur ibn Halu, khan des Chaghatayides à Samarcande et en Transoxiane; leur royauté avait suivi la lignée de Jafhtay jusqu'à ce que Jankishi ibn Duwa Temur la détienne — lorsque le trône passa à Tarmashirin, il embrassa l'islam, le premier des rois Chaghatayides chez qui l'islam apparut à Samarcande et en Transoxiane."
