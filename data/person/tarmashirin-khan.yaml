label:
  ar: ترماشين بن دوا ملك ما وراء النهر
  en: Tarmashirin, khan of Transoxiana
summary:
  ar: "ترماشين بن دوا تمر بن حلو، ملك بني جفتاي بسمرقند وما وراء النهر؛ اضطرب ملكهم في أعقاب دولة بني جفتاي إلى أن ملك منهم جنقصو بن دوا تمر بن حلو، فلما صار الملك إلى ترماشين منهم أسلم رحمه اللّه، وكان أول ملوك بني جفتاي الذين ظهر فيهم الإسلام بسمرقند وما وراء النهر."
  en: "Tarmashirin ibn Duwa Temur ibn Halu, khan of the Chaghatayids at Samarkand and Transoxiana; their kingship had lurched after Jafhtay's line until Jankishi ibn Duwa Temur held it — when the throne passed to Tarmashirin he embraced Islam, the first of the Chaghatayid kings in whom Islam appeared at Samarkand and Transoxiana."
