summary:
  ar: "قاضي القضاة بهاء الدين عبد البر ابن الشحنة الحنفي؛ ولي قضاء حلب ثم نقل إلى قضاء القاهرة الحنفي، وكان من جلساء السلطان قانصوه الغوري وظرفائه حتى هجاه بعض الشعراء فيه، وكان محباً للعلم والعلماء؛ توفي سنة إحدى وعشرين وتسعمائة {cite:shadharat-dhahab p. 470}."
  en: "Aleppo's qadi, transferred to Cairo's Hanafi bench — one of Sultan al-Ghuri's boon-companions until a poet satirized him for it; 'a lover of learning and learned men'; d. 921 {cite:shadharat-dhahab p. 470}."
  fr: "Cadi d'Alep, muté au siège hanafite du Caire — l'un des familiers du sultan al-Ghuri, jusqu'à ce qu'un poète le raille pour cela ; « amoureux du savoir et des savants » ; m. 921 {cite:shadharat-dhahab p. 470}."
  es: "cadí de Alepo, trasladado al banco Hanafi de El Cairo, uno de los compañeros de bendición del sultán al-Ghuri hasta que un poeta lo satirizó por ello; 'un amante del saber y de los hombres eruditos'; d. 921 {cita: shadharat-dhahab p. 470}."
  ur: "حلب کا قادی، قاہرہ کے حنفی بنچ کو منتقل کر دیا گیا - سلطان الثوری کے ساتھیوں میں سے ایک، یہاں تک کہ ایک شاعر نے اس پر طنز کیا۔ 'سیکھنے اور سیکھنے والوں کا عاشق'؛ d 921 {حوالہ: شدھارت ذہاب ص۔ 470}۔"
