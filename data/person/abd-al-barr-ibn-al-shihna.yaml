  ar: "قاضي القضاة بهاء الدين عبد البر ابن الشحنة الحنفي؛ ولي قضاء حلب ثم نقل إلى قضاء القاهرة الحنفي، وكان من جلساء السلطان قانصوه الغوري وظرفائه حتى هجاه بعض الشعراء فيه، وكان محباً للعلم والعلماء؛ توفي سنة إحدى وعشرين وتسعمائة {cite:shadharat-dhahab p. 470}."
