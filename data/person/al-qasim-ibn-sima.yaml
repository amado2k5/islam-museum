label: { ar: "القاسم بن سيما", en: "al-Qasim ibn Sima", fr: "al-Qasim ibn Sima", es: "al-Qasim ibn Sima", ur: "القاسم بن سماء" }
summary:
  ar: "قائد عباسي؛ غزا الصائفة سنة 298هـ {cite:kamil-ibn-al-athir p. 48}. وعند ابن الجوزي قدم سنة ثمان وتسعين من غزوة أرض الروم الصائفة ومعه خلق كثير من الأسرى وخمسون عِلجًا قد شُهروا على الجمال بأيدي بعضهم أعلام الروم عليها صلبان من ذهب وفضة {cite:muntazam-ibn-al-jawzi p. 390}."
  en: "Abbasid commander who led the summer expedition against Byzantium in 298 {cite:kamil-ibn-al-athir p. 48}."
  fr: "Commandant abbasside qui a dirigé l'expédition d'été contre Byzance en 298 {cite:kamil-ibn-al-athir p. 48}."
  es: "Comandante abasí que dirigió la expedición de verano contra Bizancio en 298 {cite:kamil-ibn-al-athir p. 48}."
  ur: "عباسی کمانڈر جس نے 298 میں بازنطیم کے خلاف موسم گرما کی مہم کی قیادت کی تھی۔ 48}۔"
  tr: "Bir Abbasi komutanı; 298 Hicri yazında baskın düzenledi {atıf:kamil-ibn-al-athir s. 48}. İbn el-Cewzi'ye göre, doksan sekizinci yılda, Romalıların topraklarına yaz seferinden gelmiş, yanında birçok esir ve elli deve vardı; bunların bazıları altın ve gümüşten haçlar taşıyan Roma bayrakları taşıyordu {atıf:Muntazam-ibn-al-jawzi, s. 390}."
  id: "Seorang komandan Abbasiyah; ia menyerang musim panas tahun 298 H {cite:kamil-ibn-al-athir hlm. 48}. Menurut Ibn al-Jawzi, ia tiba pada tahun sembilan puluh delapan dari ekspedisi musim panas ke tanah Romawi, ditemani banyak tawanan dan lima puluh unta, beberapa di antaranya memiliki bendera Romawi bertanda salib emas dan perak {cite:Muntazam-ibn-al-jawzi, hlm. 390}."
