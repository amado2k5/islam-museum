summary:
  ar: "نظام الدين أولياء ⁦(1238 – 3 أبريل 1325)⁩ شيخ الطريقة الجشتية في دهلي، مريد بابا فريد الدين گنج شكر في أجودهن وخليفته، أقام خانقاهه في غياث بور بدهلي ورفض خدمة سلاطينها، وصار مركزه أبرز مراكز التصوف في الهند."
  en: "Nizam al-Din Awliya (1238 - 3 April 1325) was the Chishti master of Delhi, a disciple of Baba Fariduddin Ganjshakar at Ajodhan and his successor; he kept his khanqah at Ghiyaspur in Delhi, refused service at the sultans' court, and his centre became the leading centre of Sufism in India."
  ur: "نظام الدین اولیاء ⁦(1238ء – 3 اپریل 1325ء)⁩ دہلی کے سلسلہ چشتیہ کے شیخ تھے، اجودھن میں بابا فرید الدین گنج شکر کے مرید و خلیفہ، دہلی کے غیاث پور میں اپنی خانقاہ قائم کی اور سلاطین کے دربار کی خدمت سے انکار کیا۔"
