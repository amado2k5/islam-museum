id: person/bashir-ibn-ubaydallah-ibn-abi-bakra
class: person
label: { ar: "بشير بن عبيد الله بن أبي بكرة", en: "Bashir ibn Ubaydallah ibn Abi Bakra", es: "Bashir ibn Ubaydallah ibn Abi Bakra", fr: "Bashir ibn Ubaydallah ibn Abi Bakra", ur: "بشیر بن عبیداللہ ابن ابی بکرہ" }
summary:
  ar: "بشير بن عبيد الله بن أبي بكرة؛ حفر المرغاب بالبصرة والسواقي والمعترضات بالتغلب وسماه مرغاب مرو وادعاه قطيعة فخاصمه حميري بن هلال فأشخص إلى خالد بن عبد الله القسري فتظلم فقبل قوله."
  en: "Bashir ibn Ubaydallah ibn Abi Bakra; he dug the Marghab canals at Basra by force, named it Marghab Marw, claimed it as his qati'a — sued by Humayri ibn Hilal, he went up to Khalid al-Qasri, made his complaint and was believed."
  es: "Bashir ibn Ubaydallah ibn Abi Bakra; excavó los canales de Marghab en Basora por la fuerza, los llamó Marghab Marw, los reclamó como su qati'a; demandado por Humayri ibn Hilal, fue a ver a Khalid al-Qasri, presentó su queja y le creyeron."
  fr: "Bashir ibn Ubaydallah ibn Abi Bakra; il creusa les canaux de Marghab à Basra par la force, les nomma Marghab Marw, les revendiqua comme sa qati'a — poursuivi par Humayri ibn Hilal, il alla voir Khalid al-Qasri, porta plainte et fut cru."
  ur: "بشیر بن عبیداللہ ابن ابی بکرہ؛ اس نے بصرہ میں مرغاب کی نہریں زبردستی کھودیں، اس کا نام مرغاب مرو رکھا، اسے اپنی قتیعہ قرار دیا- حمیری ابن ہلال نے مقدمہ کیا، وہ خالد القصری کے پاس گیا، اس کی شکایت کی اور اس پر یقین کیا گیا۔"
  tr: "Beşir bin Ubeyd Allah ibn Ebi Bakrah; Basra'da el-Murghab'ı, su çarklarını ve Taghlib'deki kesmeleri kazdı ve ona Murghab Merwi adını verdi, bunun bir ayrılık olduğunu iddia etti. Humayri bin Hilal onunla tartıştı ve şikayet için Halid bin Abdullah el-Qasri'yi görevlendirdi; ifadesi kabul edildi."
  id: "Bashir ibn Ubayd Allah ibn Abi Bakrah; ia menggali al-Murghab di Basra, kincir air, dan intersepsi di Taghlib dan menamainya Murghab Marw, mengklaim itu sebagai pemisahan. Humayri ibn Hilal berselisih dengannya, dan ia menunjuk Khalid ibn Abdullah al-Qasri untuk mengajukan keluhan, dan pernyataannya diterima."
