summary:
  ar: "أبو جعفر محمد بن جرير بن رستم الطبري، سميّ المفسر المؤرخ محمد بن جرير بن يزيد الطبري وموافقه في الكنية والنسبة. يذكره الذهبي في «ميزان الاعتدال» بعد ترجمة المفسر مباشرة، ويصفه بأنه رافضي له تواليف، منها «كتاب الرواة عن أهل البيت»، وأن عبد العزيز الكتاني رماه بالرفض؛ ويقترح الذهبي أن الحافظ السليماني حين اتهم «ابن جرير» بالوضع للروافض أراد هذا لا المفسر {cite:mizan-itidal-bijawi-v3 p. 499}."
  en: "Abu Ja'far Muhammad ibn Jarir ibn Rustam al-Tabari, namesake of the exegete and historian Muhammad ibn Jarir ibn Yazid al-Tabari, sharing his kunya and nisba. Al-Dhahabi's Mizan al-I'tidal places him right after the exegete and describes him as a Rafidi with works, among them 'the book of those who narrate from the People of the House', adding that Abd al-Aziz al-Kattani charged him with rafd; al-Dhahabi suggests that when the hafiz al-Sulaymani accused 'Ibn Jarir' of forging reports for the Rafida, he meant this man, not the exegete."
  es: "Abu Ja'far Muhammad ibn Jarir ibn Rustam al-Tabari, homónimo del exegeta e historiador Muhammad ibn Jarir ibn Yazid al-Tabari, comparte su kunya y nisba. El Mizan al-I'tidal de Al-Dhahabi lo sitúa justo después del exegeta y lo describe como un Rafidi con obras, entre ellas 'el libro de aquellos que narran de la Gente de la Casa', añadiendo que Abd al-Aziz al-Kattani lo acusó de rafd; al-Dhahabi sugiere que cuando el hafiz al-Sulaymani acusó a 'Ibn Jarir' de falsificar informes para los Rafida, se refería a este hombre, no al exegeta."
  fr: "Abu Ja'far Muhammad ibn Jarir ibn Rustam al-Tabari, homonyme de l'exégète et historien Muhammad ibn Jarir ibn Yazid al-Tabari, partageant sa kunya et sa nisba. Dans son ouvrage Mizan al-I'tidal, Al-Dhahabi le place juste après l'exégète et le décrit comme un Rafidi, auteur d'œuvres telles que « le livre de ceux qui rapportent des Gens de la Maison ». Al-Dhahabi ajoute qu'Abd al-Aziz al-Kattani l'accusa de rafd. Il suggère que lorsque le hafiz al-Sulaymani accusa « Ibn Jarir » de falsifier des récits pour les Rafidi, il visait cet homme, et non l'exégète."
