summary:
  ar: "أبو جعفر محمد بن جرير بن رستم الطبري، سميّ المفسر المؤرخ محمد بن جرير بن يزيد الطبري وموافقه في الكنية والنسبة. يذكره الذهبي في «ميزان الاعتدال» بعد ترجمة المفسر مباشرة، ويصفه بأنه رافضي له تواليف، منها «كتاب الرواة عن أهل البيت»، وأن عبد العزيز الكتاني رماه بالرفض؛ ويقترح الذهبي أن الحافظ السليماني حين اتهم «ابن جرير» بالوضع للروافض أراد هذا لا المفسر {cite:mizan-itidal-bijawi-v3 p. 499}."
  en: "Abu Ja'far Muhammad ibn Jarir ibn Rustam al-Tabari, namesake of the exegete and historian Muhammad ibn Jarir ibn Yazid al-Tabari, sharing his kunya and nisba. Al-Dhahabi's Mizan al-I'tidal places him right after the exegete and describes him as a Rafidi with works, among them 'the book of those who narrate from the People of the House', adding that Abd al-Aziz al-Kattani charged him with rafd; al-Dhahabi suggests that when the hafiz al-Sulaymani accused 'Ibn Jarir' of forging reports for the Rafida, he meant this man, not the exegete."
