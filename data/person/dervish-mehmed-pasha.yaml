summary:
  ar: "بطاقة أولية لدرويش محمد باشا البشناقي، بكلبكي البوسنة ثم قاطع جلالة في القرن السابع عشر، توفي سنة ١٦٠٦م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Dervish Mehmed Pasha al-Busnawi, the Bosnian beylerbey and Celali-era commander, d. 1606; the source entry is not yet checked on the page."
  es: "Ficha de reclutamiento del derviche Mehmed Pasha al-Busnawi, beylerbey bosnio y comandante de la época de Celali, fallecido en 1606; la fuente aún no ha sido verificada en la página."
  fr: "Fiche de conscription du derviche Mehmed Pacha al-Busnawi, beylerbey bosniaque et commandant de l'époque Celali, décédé en 1606; la source n'est pas encore vérifiée sur la page."
  ur: "درویش محمود پاشا البسنوی کے لیے ڈرافٹ کارڈ، بوسنیائی بیلربی اور سیلالی دور کے کمانڈر، ڈی۔ 1606; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Bosna'nın Kalbaki kentinden Darwish Muhammed Paşa el-Başnaki'nin ön kartı; daha sonra on yedinci yüzyılda Majesteleri ile bağlarını kesti. 1606 yılında öldü; Osmanlı tarih kitaplarında kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Darwish Muhammad Pasha al-Bashnaqi, dari Kalbaki, Bosnia, yang kemudian memutuskan hubungan dengan Yang Mulia pada abad ketujuh belas. Ia meninggal pada tahun 1606 M; buku sejarah Ottoman menyebutkannya dan biografinya belum pernah diulas di halaman tersebut."
