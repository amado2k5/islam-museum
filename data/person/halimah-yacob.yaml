  ar: "سياسية ومحامية سنغافورية وُلدت سنة 1954 في أسرة فقيرة لأب هندي مسلم وأم ملايوية؛ صعدت من العمل النقابي في المؤتمر الوطني لنقابات العمال إلى البرلمان، فصارت سنة 2013 أول امرأة ترأس برلمان سنغافورة، ثم ثامن رئيس للجمهورية وأول امرأة تتولى المنصب (2017–2023)."
  en: "Singaporean politician and lawyer born in 1954 to a poor family, the daughter of an Indian-Muslim father and a Malay mother. She rose through the National Trades Union Congress to Parliament, became in 2013 the first woman Speaker of Singapore's Parliament, and then its eighth president and first woman to hold the office (2017–2023)."
  ur: "سنگاپور کی سیاست دان و وکیل، پیدائش 1954ء، ایک غریب خاندان میں ہندوستانی مسلمان والد اور مالے والدہ کے ہاں۔ نیشنل ٹریڈز یونین کانگریس سے پارلیمنٹ تک پہنچیں، 2013ء میں سنگاپور کی پارلیمنٹ کی پہلی خاتون اسپیکر بنیں، پھر ملک کی آٹھویں صدر اور اس منصب پر فائز ہونے والی پہلی خاتون (2017ء–2023ء)۔"
