summary:
  ar: "مغنّي بلاي باك وكاتب أغانٍ وممثل باكستاني (وُلد 12 مارس 1983 في وزير آباد)، بدأ مع فرقة «جل» ثم انطلق منفرداً بألبوم «جل پري» (2004) بعد نجاح «عادت»، وصار من أبرز أصوات البلاي باك في باكستان وبوليوود، وبدأ التمثيل بفيلم «بول» (2011)، ونال تمغة الامتياز (2008)."
  en: "Pakistani playback singer, songwriter and actor (born 12 March 1983 at Wazirabad) who began with the band Jal, broke through with Aadat and the solo debut Jal Pari (2004), became a leading playback voice in Pakistan and Bollywood, made his acting debut in Bol (2011), and received the Tamgha-e-Imtiaz (2008) and several Lux Style Awards."
  ur: "پاکستانی پسِ پردہ گلوکار، نغمہ نگار اور اداکار (پیدائش 12 مارچ 1983ء، وزیرآباد) جنھوں نے «جل» بینڈ سے آغاز کیا، «عادت» اور پہلی سولو البم «جل پری» (2004ء) سے شہرت پائی، پاکستان اور بالی ووڈ کے ممتاز پسِ پردہ گلوکار بنے، فلم «بول» (2011ء) سے اداکاری شروع کی اور تمغائے امتیاز (2008ء) حاصل کیا۔"
