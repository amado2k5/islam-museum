id: person/al-muqtadir-ibn-hud
class: person
label: { ar: "أحمد المقتدر بن هود", en: "Ahmad al-Muqtadir ibn Hud", fr: "Ahmad al-Muqtadir ibn Hud", es: "Ahmad al-Muqtadir ibn Hud", ur: "احمد المقتدیر ابن ہود" }
summary:
  ar: "أحمد المقتدر بن سليمان بن هود صاحب سرقسطة، قصّر أخوه يوسف في حماية بربشتر فأخذها جيش الأردمانيين سنة ٤٥٦ ونكل بأهلها نكاية عظيمة، فصمد المقتدر لها مع إمداد لحليفه عباد وتأهب لقصدها في جموع من المسلمين فجالدوا الكفار بها جلاداً ارتاب منه كل جبان إلى أن نصر الله أولياءه وأجال السيف في الكافرين فاستؤصلوا إلا من استُرق من أصاغرهم وفُدي من أعاظمهم في جمادى الأولى سنة ٤٥٧، وأصيب من حماة المسلمين نحو الخمسين وقتل من الكافرين نحو ألف فارس وخمسة آلاف راجل فغسلها المسلمون من رجس الشرك {cite:nafh-tib-maqqari p. 449, 454}."
  en: "Ahmad al-Muqtadir ibn Hud, lord of Zaragoza; after his brother's neglect lost Barbastro to the Nordmanni in 456, he stormed it back in Jumada I 457 — about a thousand Frankish horse and five thousand foot killed — 'washing it of the filth of shirk' in Ibn Hayyan's words {cite:nafh-tib-maqqari p. 454}."
  fr: "Ahmad al-Muqtadir ibn Hud, seigneur de Saragosse ; après la négligence de son frère a perdu Barbastro aux Nordmanni en 456, il a pris d'assaut retour dans Jumada I 457 - environ un millier de chevaux francs et cinq mille pieds tués - « lavage de la saleté de shirk » dans les mots d'Ibn Hayyan {cite:nafh-tib-maqqari p. 454}."
  es: "Ahmad al-Muqtadir ibn Hud, señor de Zaragoza; después de que la negligencia de su hermano hiciera perder Barbastro a manos de los nórdicos en 456, la recuperó por asalto en Jumada I 457 —con unas mil caballerías francas y cinco mil infantes muertos— 'lavándola de la inmundicia del shirk' en palabras de Ibn Hayyan {cite:nafh-tib-maqqari p. 454}."
  ur: "احمد المقتدیر ابن ہود، زراگوزا کے مالک؛ 456 میں اس کے بھائی کی غفلت کے بعد بارباسٹرو کو نورڈمنی سے ہارنے کے بعد، اس نے جمعہ اول 457 میں اس پر واپس حملہ کیا - تقریباً ایک ہزار فرانکش گھوڑے اور پانچ ہزار پاؤں مارے گئے - ابن حیان کے الفاظ میں 'اسے شرک کی غلاظت سے دھونا'۔ 454}۔"
  tr: "Zaragoza hükümdarı Ahmed al-Muqtadir ibn Sulayman ibn Hud, kardeşi Yusuf'u Barbashtar'ın koruması altında tuttu. Ardmanilerin ordusu 456 Hicri'de burayı ele geçirdi ve halkına büyük bir intikamla davrandı. El-Muqtadir, müttefiki Abbad'ın desteğiyle ona karşı kararlı durdu ve Müslüman gruplarının önünde saldırmaya hazırlandı. Her korkağın şüphelendiği bir zalimle kâfirlerle savaştılar, ta ki Allah müttefiklerine zafer verip kâfirlere karşı kılıcı çekene kadar. Sadece küçük ve iki büyük adamlarını yağmalayanları 457 yılında ortadan kaldırdılar. Yaklaşık elli Müslüman koruyucu yaralandı, yaklaşık bin süvari ve beş bin piyade öldü, böylece Müslümanlar burayı çürkü tanrıcılığın kirliliğinden arındırdılar {atıf:Nafh-tib-maqqari s. 449, 454}."
  id: "Ahmad al-Muqtadir ibn Sulayman ibn Hud, penguasa Zaragoza, memelihara saudaranya Yusuf di bawah perlindungan Barbashtar. Pasukan Ardmanid merebutnya pada tahun 456 H dan memperlakukan rakyatnya dengan dendam besar. Al-Muqtadir berdiri teguh melawannya dengan dukungan sekutunya Abbad dan bersiap menyerangnya di depan kelompok Muslim. Mereka melawan kafir dengan tiran yang dicurigai setiap pengecut, hingga Allah memberikan kemenangan kepada sekutu-Nya dan menghunus pedang melawan kafir. Mereka hanya menyingkirkan mereka yang telah menjarah pasukan kecil mereka dan dua delegasi besar mereka di Jumada al-Awwal 457. Sekitar lima puluh pelindung Muslim terluka, dan sekitar seribu penunggang kuda serta lima ribu infanteri tewas, sehingga Muslim membersihkan kota dari ketidakmurnian politeisme {cite:Nafh-tib-maqqari hlm. 449, 454}."
