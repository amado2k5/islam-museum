label: { ar: "أحمد المقتدر بن هود" }
summary:
  ar: "أحمد المقتدر بن سليمان بن هود صاحب سرقسطة، قصّر أخوه يوسف في حماية بربشتر فأخذها جيش الأردمانيين سنة ٤٥٦ ونكل بأهلها نكاية عظيمة، فصمد المقتدر لها مع إمداد لحليفه عباد وتأهب لقصدها في جموع من المسلمين فجالدوا الكفار بها جلاداً ارتاب منه كل جبان إلى أن نصر الله أولياءه وأجال السيف في الكافرين فاستؤصلوا إلا من استُرق من أصاغرهم وفُدي من أعاظمهم في جمادى الأولى سنة ٤٥٧، وأصيب من حماة المسلمين نحو الخمسين وقتل من الكافرين نحو ألف فارس وخمسة آلاف راجل فغسلها المسلمون من رجس الشرك {cite:nafh-tib-maqqari p. 449, 454}."
  en: "Ahmad al-Muqtadir ibn Hud, lord of Zaragoza; after his brother's neglect lost Barbastro to the Nordmanni in 456, he stormed it back in Jumada I 457 — about a thousand Frankish horse and five thousand foot killed — 'washing it of the filth of shirk' in Ibn Hayyan's words {cite:nafh-tib-maqqari p. 454}."
