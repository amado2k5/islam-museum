id: person/al-basasiri
class: person
label: { ar: "أرسلان البساسيري التركي" }
summary:
  ar: "التركي، عظم أمره حتى دعي له على المنابر وجبى الأموال وخرب القرى ولم يكن القائم يقطع أمراً دونه ثم صح عنده سوء عقيدته فقدم بغداد سنة خمسين ومعه الرايات المصرية ودعي للمستنصر العبيدي بجامع المنصور وقبض على الخليفة في ذي الحجة وسيره إلى عانة فحبسه ثم ظفر به جيش طغرل بك فقتل وحمل رأسه إلى بغداد {cite:tarikh-khulafa-minhaj-1434 p. 642-643}. كان مملوك بهاء الدولة بن بويه فقدمه القائم على جميع الأتراك وقلده الأمور بأسرها وخطب له على منابر العراق وخوزستان فعظم أمره وهابته الملوك ثم خرج على القائم من بغداد وخطب للمستنصر العبيدي صاحب مصر فراح القائم إلى أمير العرب محيي الدين هارش بن المجلى العقيلي صاحب الحديثة فآواه وقام بجميع ما يحتاج إليه مدة سنة كاملة حتى جاء طغرلك السلجوقي وقاتل البساسيري وقتله يوم الخميس منتصف ذي الحجة وعاد القائم إلى بغداد وكان دخوله إليها في مثل اليوم الذي خرج منها بعد حول كامل وكان ذلك من غريب الاتفاق وطيف برأسه في بغداد وصلب بباب النوبي؛ والبساسيري نسبة إلى بلدة بفارس يقال لها بسا وبالعربية فسا ومنها الشيخ أبو علي الفارسي النحوي ونسبة البساسيري شاذة على خلاف الأصل {cite:shadharat-dhahab p. 296}."
  en: "The Turk whose power grew till he was preached on the minbars and the caliph decided nothing without him; his ill creed proved out, he took Baghdad in 450 under Egyptian banners with the khutba to the Ubaydid al-Mustansir, seized and jailed the caliph at Ana — till Tughrul Beg's army took him and his head reached Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
gender: male
died: { edtf: "1060~", hijri: "0451-12", calendar: julian, precision: month, status: tradition, derived: true, note: "قتله عسكر طغرل بك ببغداد يوم الخميس منتصف ذي الحجة سنة إحدى وخمسين وأربعمائة وطيف برأسه في بغداد وصلب بباب النوبي {cite:shadharat-dhahab p. 296}." }
