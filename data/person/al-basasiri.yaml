class: person
label: { ar: "أرسلان البساسيري التركي", en: "Arslan al-Basasiri al-Turki", fr: "Arslan al-Basasiri al-Turki", es: "Arslan al-Basasiri al-Turki", ur: "ارسلان البصیری الترکی" }
summary:
  ar: "التركي، عظم أمره حتى دعي له على المنابر وجبى الأموال وخرب القرى ولم يكن القائم يقطع أمراً دونه ثم صح عنده سوء عقيدته فقدم بغداد سنة خمسين ومعه الرايات المصرية ودعي للمستنصر العبيدي بجامع المنصور وقبض على الخليفة في ذي الحجة وسيره إلى عانة فحبسه ثم ظفر به جيش طغرل بك فقتل وحمل رأسه إلى بغداد {cite:tarikh-khulafa-minhaj-1434 p. 642-643}. كان مملوك بهاء الدولة بن بويه فقدمه القائم على جميع الأتراك وقلده الأمور بأسرها وخطب له على منابر العراق وخوزستان فعظم أمره وهابته الملوك ثم خرج على القائم من بغداد وخطب للمستنصر العبيدي صاحب مصر فراح القائم إلى أمير العرب محيي الدين هارش بن المجلى العقيلي صاحب الحديثة فآواه وقام بجميع ما يحتاج إليه مدة سنة كاملة حتى جاء طغرلك السلجوقي وقاتل البساسيري وقتله يوم الخميس منتصف ذي الحجة وعاد القائم إلى بغداد وكان دخوله إليها في مثل اليوم الذي خرج منها بعد حول كامل وكان ذلك من غريب الاتفاق وطيف برأسه في بغداد وصلب بباب النوبي؛ والبساسيري نسبة إلى بلدة بفارس يقال لها بسا وبالعربية فسا ومنها الشيخ أبو علي الفارسي النحوي ونسبة البساسيري شاذة على خلاف الأصل {cite:shadharat-dhahab p. 296}. ويذكر ابن الجوزي نشأة شأنه: مشى خلف جنازة الحسن بن عيسى بن المقتدر سنة ٤٤٠، وعاد سنة ٤٤٦ منصرفًا عن الوقعة مع بني خفاجة فلم يلمّ بدار الخلافة على رسمه وتأخر عن الخدمة، وخرج إلى دجيل فاعتاث سفينة لأقارب رئيس الرؤساء يطالبها بالضريبة، ثم توجه في ذي الحجة إلى الأنبار ففتحها وقطع أيدي علماء فيها وكان معه دبيس بن علي بن مزيد بعد أن أحرق دمًا والفلوجة، وحاذى بيت النوبة وخُلع عليه وانصرف ولم يعبر {cite:muntazam-ibn-al-jawzi j.8 p.479,502-503}."
  en: "The Turk whose power grew till he was preached on the minbars and the caliph decided nothing without him; his ill creed proved out, he took Baghdad in 450 under Egyptian banners with the khutba to the Ubaydid al-Mustansir, seized and jailed the caliph at Ana — till Tughrul Beg's army took him and his head reached Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
  fr: "Turc dont le pouvoir grandit jusqu’à être nommé dans les prêches des minbars, le calife ne décidant rien sans lui ; selon la source, sa mauvaise croyance fut établie. Il prit Bagdad en 450 H sous les étendards égyptiens avec la khutba pour l’Ubaydide al-Mustansir, captura et emprisonna le calife à Ana, jusqu’à ce que l’armée de Tughrul Beg le prenne et que sa tête atteigne Bagdad {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
  es: "El turco cuyo poder creció hasta que se predicaba sobre él en los minbares y el califa no decidía nada sin él; su mal credo quedó demostrado, tomó Bagdad en 450 bajo estandartes egipcios con la jutba para el Ubaydid al-Mustansir, capturó y encarceló al califa en Ana, hasta que el ejército de Tughrul Beg lo capturó y su cabeza llegó a Bagdad {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
  ur: "وہ ترک جس کی طاقت بڑھتی گئی یہاں تک کہ اسے منبروں پر تبلیغ کی گئی اور خلیفہ نے اس کے بغیر کسی چیز کا فیصلہ نہیں کیا۔ اس کی بدعت ثابت ہوئی، اس نے 450 میں بغداد کو مصری جھنڈے تلے عبید المستنصر کے خطبہ کے ساتھ لے لیا، خلیفہ کو عناء میں گرفتار کر کے جیل میں ڈال دیا- یہاں تک کہ طغرل بیگ کی فوج اسے لے گئی اور اس کا سر بغداد پہنچا۔ 642-643}۔"
  tr: "Türk, gücü o kadar arttı ki minberlerde onun için dualar okunmaya başlandı, para topladı, köyleri yıktı ve halife onsuz hiçbir şeye karar vermedi. Sonra kötü inancı ona açıkça belli oldu, bu yüzden elli yılında Mısır sancaklarıyla Bağdat'a geldi ve Mansur Camii'nde Mustansir Ubaidi için dualar okundu. Zilhicce ayında halifeyi yakalayıp En'e gönderdi ve hapse attı. Sonra Tuğrul Bey'in ordusu onu yakaladı, bu yüzden onu öldürdü ve başını Bağdat'a götürdü. {cite:tarikh-khulafa-minhaj-1434 s. 642-643}. Baha' el-Davla ibn Buveyh, el-Kaim'in tüm Türklerin başına atadığı ve tüm işleri ona emanet ettiği, Irak ve Huzistan minberlerinde onun adına vaazlar okuttuğu bir Memlük idi. Gücü arttı ve krallar ondan korktu. Sonra Bağdatlı el-Kaim'e isyan etti ve Mısır hükümdarı el-Mustansir el-Ubaydı adına vaaz verdi. Bunun üzerine el-Kaim, Haditha hükümdarı Arap prensi Muhi el-Din Haraş ibn el-Mücelli el-Ukayli'ye gitti. O da onu himayesine aldı ve bir yıl boyunca tüm ihtiyaçlarını karşıladı. Ta ki Tuğrul el-Saljuki gelip el-Basasiri ile savaşana ve onu Zilhicce ayının ortasında, Perşembe günü öldürene kadar. El-Kaim Bağdat'a döndü ve şehre girişi, bir yıl sonra ayrıldığı günle aynı güne denk geldi. Bu garip bir tesadüftü. Başı Bağdat'ta dolaştırıldı ve Bab el-Nubi'de çarmıha gerildi. El-Basasiri'nin İran'da Basa, Arapçada ise Fasa olarak bilinen bir kasabadan geldiği söylenir. Dilbilimci Şeyh Ebu Ali el-Farisi de oradan gelmiştir. El-Basasiri'nin atıfları düzensiz ve aslına aykırıdır. {alıntı: shadharat-dhahab s. 296} İbn el-Cevzi, onun olayının başlangıcını şöyle anlatır: 440 yılında Hasan ibn İsa ibn el-Muktadir'in cenazesinin arkasından yürüdü ve 446 yılında Beni Haface ile olan savaştan ayrıldı. Adeti olduğu üzere halifenin evini ziyaret etmedi ve ibadete geç kaldı. Dujail'e gitti ve reislerin akrabalarına ait bir gemiyi ele geçirerek vergisini aldı. Sonra Zilhicce ile Anbar'a yöneldi, orayı fethetti ve oradaki alimlerin ellerini kesti. Yanında Dubays ibn Ali ibn Mazid de vardı, kan ve Felluce'yi yaktıktan sonra Nubiyalıların evine yaklaştı, kendisine şeref elbisesi verildi ve oradan ayrıldı, karşıya geçmedi. {Kaynak: muntazam-ibn-al-jawzi j.8 s.479,502-503}"
  id: "Kekuasaan orang Turki itu tumbuh hingga doa-doa dipanjatkan untuknya di mimbar-mimbar, dan ia mengumpulkan uang serta menghancurkan desa-desa, dan Khalifah tidak akan mengambil keputusan apa pun tanpa dirinya. Kemudian keyakinannya yang buruk menjadi jelas baginya, sehingga ia datang ke Baghdad pada tahun 50 dengan panji-panji Mesir, dan doa-doa dipanjatkan untuk Al-Mustansir Al-Ubaidi di Masjid Al-Mansur, dan ia menangkap Khalifah pada bulan Dzul Hijjah dan mengirimnya ke Ana, dan memenjarakannya. Kemudian pasukan Tughril Beg menangkapnya, sehingga ia membunuhnya dan membawa kepalanya ke Baghdad. {cite:tarikh-khulafa-minhaj-1434 p. 642-643}. Baha’ al-Dawla ibn Buwayh adalah seorang Mamluk yang diangkat oleh al-Qa’im atas semua orang Turki dan dipercayakan kepadanya semua urusan dan khotbah disampaikan atas namanya di mimbar-mimbar Irak dan Khuzestan. Kekuasaannya tumbuh dan raja-raja takut kepadanya. Kemudian ia memberontak melawan al-Qa’im dari Baghdad dan menyampaikan khutbah atas nama al-Mustansir al-Ubaydi, penguasa Mesir. Maka al-Qa’im pergi ke pangeran Arab Muhi al-Din Harash ibn al-Mujalli al-Uqayli, penguasa Haditha, yang melindunginya dan memenuhi semua kebutuhannya selama setahun penuh hingga Tughril al-Saljuqi datang dan memerangi al-Basasiri dan membunuhnya pada hari Kamis, pertengahan Dzul Hijjah. Al-Qa’im kembali ke Baghdad, dan kedatangannya di sana bertepatan dengan hari ia meninggalkannya setelah setahun penuh. Ini adalah kebetulan yang aneh. Kepalanya diarak di Baghdad dan disalib di Bab al-Nubi. Al-Basasiri dikaitkan dengan sebuah kota di Persia bernama Basa, dan dalam bahasa Arab, Fasa. Dari sanalah datang Syekh Abu Ali al-Farisi, ahli tata bahasa. Penamaan al-Basasiri tidak teratur dan bertentangan dengan aslinya. {kutip:shadharat-dhahab hal. 296} Ibn al-Jawzi menyebutkan awal kisahnya: Ia berjalan di belakang pemakaman al-Hasan ibn Isa ibn al-Muqtadir pada tahun 440, dan kembali pada tahun 446, meninggalkan pertempuran dengan Bani Khafajah, sehingga ia tidak mengunjungi rumah Khalifah sebagaimana kebiasaannya dan terlambat untuk bertugas, dan pergi ke Dujail dan merebut sebuah kapal milik kerabat kepala suku, menuntut pajak darinya, kemudian ia menuju pada bulan Dzul Hijjah ke Anbar, menaklukkannya dan memotong tangan para ulama di sana, dan bersamanya ada Dubays ibn Ali ibn Mazid setelah ia membakar darah dan Fallujah, dan ia mendekati Rumah orang Nubia dan diberi jubah kehormatan dan pergi dan tidak menyeberang {kutip:muntazam-ibn-al-jawzi j.8 hlm.479,502-503}."
