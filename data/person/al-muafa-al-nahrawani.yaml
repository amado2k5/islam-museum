id: person/al-muafa-al-nahrawani
class: person
label: { ar: "المعافى النهرواني", en: "Al Muafa Al Nahrawani" }
summary:
  ar: "أبو الفرج المعافى بن زكريا النهرواني القاضي من أهل النهروان، قال ابن النديم أوحد عصره في مذهب أبي جعفر الطبري وحفظ كتبه ومع ذلك متفنن في علوم كثيرة مضطلع بها مشار إليه فيها في نهاية الذكاء وحسن الحفظ وسرعة الخاطر في الجوابات، وقال إن له نيفا وخمسين رسالة في الفقه والكلام والنحو وغير ذلك، وله من الكتب كتاب النحرير والمنقر في أصول الفقه وكتاب الحدود والعقود وكتاب المرشد في الفقه وكتاب المحاضر والسجلات وكتاب شرح كتاب الخفيف للطبري وكتاب الرد على داود بن علي وكتاب الجليس والأنيس {cite:fihrist-ibn-al-nadim p. 328-329}."
  en: "Al-Mu'afa al-Nahrawani — unique of his age in Tabari's madhhab, fifty-odd treatises {cite:fihrist-ibn-al-nadim}"
