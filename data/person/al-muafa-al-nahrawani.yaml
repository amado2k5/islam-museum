id: person/al-muafa-al-nahrawani
class: person
label: { ar: "المعافى النهرواني", en: "Al Muafa Al Nahrawani", fr: "Al Muafa Al Nahrawani", es: "Al Muafa Al Nahrawani", ur: "المفاۃ النہروانی" }
summary:
  ar: "أبو الفرج المعافى بن زكريا النهرواني القاضي من أهل النهروان، قال ابن النديم أوحد عصره في مذهب أبي جعفر الطبري وحفظ كتبه ومع ذلك متفنن في علوم كثيرة مضطلع بها مشار إليه فيها في نهاية الذكاء وحسن الحفظ وسرعة الخاطر في الجوابات، وقال إن له نيفا وخمسين رسالة في الفقه والكلام والنحو وغير ذلك، وله من الكتب كتاب النحرير والمنقر في أصول الفقه وكتاب الحدود والعقود وكتاب المرشد في الفقه وكتاب المحاضر والسجلات وكتاب شرح كتاب الخفيف للطبري وكتاب الرد على داود بن علي وكتاب الجليس والأنيس {cite:fihrist-ibn-al-nadim p. 328-329}."
  en: "Al-Mu'afa al-Nahrawani — unique of his age in Tabari's madhhab, fifty-odd treatises {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Mu'afa al-Nahrawani - unique de son âge dans le madhhab de Tabari, cinquante traités {cite:fihrist-ibn-al-nadim}"
  es: "Al-Mu'afa al-Nahrawani - único en su época en el madhab de Tabari, cincuenta y tantos tratados {cita:fihrist-ibn-al-nadim}"
  ur: "المضافۃ النہروانی - طبری کے مذہب میں اپنی عمر کا منفرد، پچاس مقالے {حوالہ: فہرست ابن الندیم}"
  tr: "Nahrawan halkından bir yargıç olan Ebu el-Faraj el-Muafa ibn Zekeriye el-Nehrawani, İbn el-Nadim'in Ebu Ca'fer el-Taberi'nin okulunda kendi döneminin öğrencisi olduğunu ve kitaplarını ezberlediğini söyledi. Buna rağmen, birçok bilimde üstün başarı gösterdi ve olağanüstü zekâsı, iyi hafızası ve hızlı yanıt verme yeteneğiyle tanındı. Fıkıh, teoloji, dilbilgisi ve diğer alanlarda elliden fazla risale olduğunu söyledi. kitaplar 'El-Nehir ve El-Neqr fi Usul el-Fiqh', 'Kitab al-Hudud wa al-'Uqud', 'Al-Murshid fi al-Fiqh', 'Al-Muhadhir' ve 'Al-Sijilim', 'Sharh al-Khafif by al-Tabari', 'Al-Radd 'ala Dawud ibn Ali' ve 'Al-Jalis wa al-Al-Anis' adlı kitaplardır {atıf:Fihrist-ibn-al-Nadim s. 328-329}."
  id: "Abu al-Faraj al-Mu'afa ibn Zakariya al-Nahrawani, seorang hakim dari masyarakat Nahrawan, mengatakan bahwa Ibn al-Nadim adalah salah satu dari zamannya di sekolah Abu Ja'far al-Tabari dan menghafal bukunya. Meski demikian, ia unggul dalam banyak ilmu pengetahuan dan dikenal karena kecerdasan luar biasa, ingatan yang baik, dan pemikiran cepat dalam menjawab. Ia mengatakan memiliki lebih dari lima puluh risalah tentang fiqedan, teologi, tata bahasa, dan lainnya. Di antara bukunya adalah 'Al-Nahrir dan Al-Naqr fi Usul al-Fiqh', 'Kitab al-Hudud wa al-'Uqud', 'Al-Murshid fi al-Fiqh', 'Al-Muhadhir' dan 'Al-Sijilim', 'Sharh al-Khafif oleh al-Tabari', 'Al-Radd 'ala Dawud ibn Ali, dan buku 'Al-Jalis wa al-Anis' {cite:Fihrist-ibn-al-Nadim hlm. 328-329}."
