summary:
  ar: "المهندس الميقاتي بدمشق؛ ذكر في النفع العام أنه أمعن النظر في الآلات الفلكية فوجد أنها لا تفي بجميع الأعمال الفلكية في كل عرض وأن الخلل يداخلها في غالب الأعمال إما لتعسر الوضع كالمبطحات أو لتحرك بعضها على بعض وتزاحم خطوطها كالأسطرلاب والشكازية والزرقالة، فوضع آلة يخرج بها جميع الأعمال في جميع الآفاق بسهولة مقصد ووضوح برهان فسماها الربع التام {cite:kashf-zunun-furqan p. 570-571}."
  en: "The Damascene muwaqqit-instrument maker who, finding no existing instrument — astrolabe, shakkaziyya or zarqala — could serve every horary work at every latitude without defect, designed 'al-rub' al-tamm', the complete quadrant answering all works at all horizons {cite:kashf-zunun-furqan p. 570-571}."
