summary:
  ar: "المهندس الميقاتي بدمشق؛ ذكر في النفع العام أنه أمعن النظر في الآلات الفلكية فوجد أنها لا تفي بجميع الأعمال الفلكية في كل عرض وأن الخلل يداخلها في غالب الأعمال إما لتعسر الوضع كالمبطحات أو لتحرك بعضها على بعض وتزاحم خطوطها كالأسطرلاب والشكازية والزرقالة، فوضع آلة يخرج بها جميع الأعمال في جميع الآفاق بسهولة مقصد ووضوح برهان فسماها الربع التام {cite:kashf-zunun-furqan p. 570-571}."
  en: "The Damascene muwaqqit-instrument maker who, finding no existing instrument — astrolabe, shakkaziyya or zarqala — could serve every horary work at every latitude without defect, designed 'al-rub' al-tamm', the complete quadrant answering all works at all horizons {cite:kashf-zunun-furqan p. 570-571}."
  es: "El fabricante de instrumentos muwaqqit de Damasco, que al no encontrar ningún instrumento existente —astrolabio, shakkaziyya o zarqala— que pudiera servir para todas las obras horarias en todas las latitudes sin defectos, diseñó 'al-rub' al-tamm', el cuadrante completo que responde a todas las obras en todos los horizontes {cite:kashf-zunun-furqan p. 570-571}."
  fr: "Le fabricant d'instruments muwaqqit damascène qui, ne trouvant aucun instrument existant — astrolabe, shakkaziyya ou zarqala — pouvant servir à chaque travail horaire à chaque latitude sans défaut, a conçu 'al-rub' al-tamm', le quadrant complet répondant à tous les travaux à tous les horizons {cite:kashf-zunun-furqan p. 570-571}."
  ur: "دمشقی مواقیت ساز ساز جس نے کوئی موجودہ آلہ نہ ڈھونڈا — فلکیات، شخازیہ یا زرقالہ — بغیر کسی عیب کے ہر طول بلد پر ہر خوفناک کام کو انجام دے سکتا ہے، 'الرب التمم' ڈیزائن کیا گیا، تمام افق پر تمام کاموں کا جواب دینے والا مکمل چوکور {حوالہ: کشف الزون۔ 570-571}۔"
  tr: "Şam'dan al-Muhandis al-Miqati, kamu yararına astronomik aletleri kapsamlı şekilde incelediğini ve bunların her aşamada tüm astronomik işlevleri yerine getirmediğini, kusurların çoğu eseri ya çıkıntılı aletler gibi konumlandırmada zorluk ya da bazılarının birbirinin üzerinde hareket edip çizgilerinin astrolab, şakazi ve zarqala gibi birbirine sıkışması nedeniyle etkilediğini belirtmiştir. Tüm eserleri tüm ufuklarda kolayca ve net kanıtla üretebilen bir cihaz kurdu ve ona mükemmel çeyrek adını verdi {cite:kashf-zunun-furqan, s. 570-571}."
  id: "Al-Muhandis al-Miqati di Damaskus menyebutkan dalam minat publik bahwa ia memeriksa instrumen astronomi secara menyeluruh dan menemukan bahwa instrumen tersebut tidak memenuhi semua fungsi astronomi pada setiap tahap, dan bahwa cacat memengaruhi sebagian besar karya baik karena kesulitan menempatkan seperti instrumen yang menonjol atau karena beberapa bergerak satu sama lain dan garisnya berdesakan seperti astrolab, shakazi, dan zarqala. Ia menyiapkan perangkat yang dapat menghasilkan semua karya di semua cakrawala dengan mudah dan jelas pembuktian, sehingga ia menamainya kuartal sempurna {cite:kashf-zunun-furqan, hlm. 570-571}."
