label: { ar: "المستكفي بالله عبد الله بن المكتفي" }
summary:
  ar: "خليفة عباسي [٣٣٣–٣٣٤هـ]، أبو القاسم عبد الله بن المكتفي، أمه أم ولد اسمها أملح الناس، بويع عند خلع المتقي في صفر سنة ثلاث وثلاثين وله إحدى وأربعون سنة، ولقب نفسه إمام الحق وضرب على السكة، ثم جره الديلم من السرير بعمامته ونهبوا حرم دار الخلافة وسمل يومئذ في جمادى الآخرة سنة أربع وثلاثين وكانت خلافته سنة وأربعة أشهر وسلم على ابن عمه المطيع بالخلافة ثم سجن حتى مات سنة ثمان وثلاثين وله ست وأربعون سنة وكان يتظاهر بالتشيع {cite:tarikh-khulafa-minhaj-1434 p. 613-614}."
  en: "Abbasid caliph [333–334], Abu'l-Qasim Abd Allah ibn al-Muktafi, hailed at forty-one on al-Muttaqi's deposition, styling himself 'Imam al-Haqq' on the coinage. The Daylamites dragged him from the throne by his turban, sacked the harem, and blinded him in Jumada II 334 after sixteen months; he himself saluted his cousin al-Muti' as caliph, then died jailed in 338 — he used to affect Shi'ism {cite:tarikh-khulafa-minhaj-1434 p. 613-614}."
