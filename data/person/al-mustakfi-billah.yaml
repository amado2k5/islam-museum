label: { ar: "المستكفي بالله سليمان بن الحاكم" }
summary:
  ar: "ثالث خلفاء القاهرة [٧٠١–٧٤٠هـ]، أبو الربيع سليمان بن الحاكم، ولد في نصف المحرم سنة أربع وثمانين وست مئة وبويع بالخلافة بعهد من أبيه في جمادى الأولى سنة إحدى وسبع مئة وخطب له على المنابر في البلاد المصرية والشامية وسارت البشارة إلى جميع الأقطار وكانوا يسكنون بالكبش فنقلهم السلطان إلى القلعة وأفرد لهم داراً، وفي سنة اثنتين هجم التتار الشام فخرج السلطان ومعه الخليفة لقتالهم فكان النصر {cite:tarikh-khulafa-minhaj-1434 p. 733}، ثم وقع بينه وبين السلطان سنة ست وثلاثين فاعتقل بالبرج ثم نفي إلى قوص سنة سبع وثلاثين هو وأهله قريب من مئة نفس واستمر بها إلى أن مات في شعبان سنة أربعين ودفن بها وعهد إلى ابنه أحمد {cite:tarikh-khulafa-minhaj-1434 p. 736,739}.، وعند المسعودي هو أبو القاسم عبد الله بن علي المكتفي بويع يوم السبت لثلاث خلون من صفر سنة ثلاث وثلاثين على نهر عيسى بازاء قرية السندية في الوقت الذي سملت فيه عينا المتقي وبايعه توزون والقواد والقاضي محمد بن الحسين بن أبي الشوارب وجماعة من الهاشميين، وانحدر يوم الاثنين في الماء في الطيار المسمى الغزال وعليه فلنسوة طويلة كانت لأبيه وعلى رأسه توزون ومحمد بن حمد بن يحيى بن شيرزاد، واستوزر أبا الفرج محمد بن علي السلمري ثم غضب عليه، واستقضى على الشرقي ابن أبي موسى الحنفي وعلى الغربي ابن أبي الشوارب فقالت العامة إلى ههنا انتهى سلطانه، وكانت بينه وبين الفضل بن المقتدر المطيع مجاورة في دار ابن طاهر وعداوة في اللعب بالحمام والكباش والديوك والسمان، فلما استقرت له الخلافة طلب المطيع فهرب فهدم داره، وكانت خلافته سنة وأربعة أشهر إلا أياماً، وترك النبيذ حين أفضت إليه الخلافة ثم دعا به من وقته، وكان في سائر أوقاته فزعاً وجلاً من المطيع أن يلي الخلافة فيسلم إليه {cite:muruj-al-dhahab p. 704-710}"
  en: "Third Cairo caliph [701–740], hailed by his father's will; moved with the Abbasids from Kabsh to a citadel house, and rode out with the sultan to the Tatar victory of 702 {cite:tarikh-khulafa-minhaj-1434 p. 733}."
