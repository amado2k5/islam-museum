id: person/al-mustakfi-billah
class: person
label: { ar: "المستكفي بالله سليمان بن الحاكم", en: "al-Mustakfi bi'llah Sulayman ibn al-Hakim", fr: "al-Mustakfi bi'llah Sulayman ibn al-Hakim", es: "al-Mustakfi bi'llah Sulayman ibn al-Hakim", ur: "المستقفی باللہ سلیمان ابن الحکیم" }
summary:
  ar: "ثالث خلفاء القاهرة [٧٠١–٧٤٠هـ]، أبو الربيع سليمان بن الحاكم، ولد في نصف المحرم سنة أربع وثمانين وست مئة وبويع بالخلافة بعهد من أبيه في جمادى الأولى سنة إحدى وسبع مئة وخطب له على المنابر في البلاد المصرية والشامية وسارت البشارة إلى جميع الأقطار وكانوا يسكنون بالكبش فنقلهم السلطان إلى القلعة وأفرد لهم داراً، وفي سنة اثنتين هجم التتار الشام فخرج السلطان ومعه الخليفة لقتالهم فكان النصر {cite:tarikh-khulafa-minhaj-1434 p. 733}، ثم وقع بينه وبين السلطان سنة ست وثلاثين فاعتقل بالبرج ثم نفي إلى قوص سنة سبع وثلاثين هو وأهله قريب من مئة نفس واستمر بها إلى أن مات في شعبان سنة أربعين ودفن بها وعهد إلى ابنه أحمد {cite:tarikh-khulafa-minhaj-1434 p. 736,739}. وعند المسعودي هو أبو القاسم عبد الله بن علي المكتفي بويع يوم السبت لثلاث خلون من صفر سنة ثلاث وثلاثين على نهر عيسى بازاء قرية السندية في الوقت الذي سملت فيه عينا المتقي وبايعه توزون والقواد والقاضي محمد بن الحسين بن أبي الشوارب وجماعة من الهاشميين، وانحدر يوم الاثنين في الماء في الطيار المسمى الغزال وعليه فلنسوة طويلة كانت لأبيه وعلى رأسه توزون ومحمد بن حمد بن يحيى بن شيرزاد، واستوزر أبا الفرج محمد بن علي السلمري ثم غضب عليه، واستقضى على الشرقي ابن أبي موسى الحنفي وعلى الغربي ابن أبي الشوارب فقالت العامة إلى ههنا انتهى سلطانه، وكانت بينه وبين الفضل بن المقتدر المطيع مجاورة في دار ابن طاهر وعداوة في اللعب بالحمام والكباش والديوك والسمان، فلما استقرت له الخلافة طلب المطيع فهرب فهدم داره، وكانت خلافته سنة وأربعة أشهر إلا أياماً، وترك النبيذ حين أفضت إليه الخلافة ثم دعا به من وقته، وكان في سائر أوقاته فزعاً وجلاً من المطيع أن يلي الخلافة فيسلم إليه {cite:muruj-al-dhahab p. 704-710}، وعند المسعودي اشتهى أن يجتمع ندماؤه يوماً فيتذاكروا أنواع الأطعمة وما قال الناس فيها منظوماً فتسامروا بأشعار السنبوسج لإسحاق الموصلي والهليون والجوذابة والقطائف لكشاجم والأرزية لمحمد بن الوزير الحافظ الدمشقي والهريسة والمضيرة، حتى قال لمعلمه الذي كان يعلمه في صباه قد أنشدنا ما سمعت فأنشدنا أنت فأنشده قول أبي نواس في باطرنجا نوم عينيك يا ابن وهب غرار ولنار الهوى بقلبك نار {cite:muruj-al-dhahab p. 710-717}، وعند ابن الأثير خلع لثمان بقين من جمادى الآخرة سنة 334هـ بعد أن اتُهمت أمه القهرمانة أن دعوتها العظيمة كانت لتأخذ البيعة له وعزل معز الدولة، فجذبه نقيبان من الديلم عن سريره وجعلا عمامته في حلقه وساقاه ماشياً إلى دار معز الدولة ونُهبت دار الخلافة حتى لم يبق بها شيء، وكانت مدة خلافته سنة وأربعة أشهر، ولما بويع المطيع سُلم إليه فسمله وأعماه وبقي محبوساً حتى مات في ربيع الأول سنة 338هـ وكان مولده ثاني عشر صفر سنة 296هـ وأمه أم ولد اسمها غصن وكان أبيض حسن الوجه قد وخطه الشيب {cite:kamil-ibn-al-athir p. 337}، وعند ابن الجوزي وفي سنة 334هـ أخذ على أبي الحسين أحمد بن بويه البيعة واستحلفه بأغلظ الإيمان وجعله أمير الأمراء وهو أول ملوك بني بويه ولقب أخويه علياً عماد الدولة والحسن ركن الدولة وأمر أن تضرب ألقابهم على الدنانير والدراهم ونزل الديلم والأتراك دور الناس {cite:muntazam-ibn-al-jawzi p. 632-633}، وعند ابن الجوزي وفي محرم سنة 334هـ نقب نفسه إمام الحق وضرب ذلك على الدنانير والدراهم فكان يخطب له بلقبين إمام الحق والمستكفي بالله، ومكث في الخلافة سنة وأربعة أشهر ويومين وخلع وقبض عليه أبو الحسين بن بويه واعتقله في داره فمات هناك بتفتيت الدم وقيل بل سمله المطيع واعتقله وتوفي وهو ابن ست وأربعين سنة وشهرين {cite:muntazam-ibn-al-jawzi p. 632, 656} وعند ابن الجوزي لقّب نفسه في المحرم سنة أربع وثلاثين إمام الحق وضرب ذلك على الدنانير والدراهم فكان يُخطب له بلقبين إمام الحق والمستكفي بالله {cite:muntazam-ibn-al-jawzi p. 644}."
  en: "Third Cairo caliph [701–740], hailed by his father's will; moved with the Abbasids from Kabsh to a citadel house, and rode out with the sultan to the Tatar victory of 702 {cite:tarikh-khulafa-minhaj-1434 p. 733}."
  fr: "Troisième calife du Caire [701-740], salué par la volonté de son père ; déplacé avec les Abbassides de Kabsh à une maison de la citadelle, et monté avec le sultan à la victoire tatare de 702 {cite:tarikh-khulafa-minhaj-1434 p. 733}."
  es: "Tercer califa de El Cairo [701–740], aclamado por el testamento de su padre; se trasladó con los abasíes de Kabsh a una casa de la ciudadela y salió con el sultán a la victoria tártara de 702 {cite:tarikh-khulafa-minhaj-1434 p. 733}."
  ur: "قاہرہ کا تیسرا خلیفہ [701-740]، اپنے والد کی وصیت کے مطابق؛ عباسیوں کے ساتھ کبش سے ایک قلعہ نما مکان میں چلا گیا، اور سلطان کے ساتھ 702 کی تاتاری فتح کے لیے روانہ ہوا۔ 733}۔"
  tr: "Kahire'nin üçüncü halifesi [701–740 H.C.], Ebu el-Rabi' Süleyman bin el-Hakim, 684 Hicri yılında Muharrem'in ortasında doğdu. 701 Hicri yılında babasının Cumada-el-Avval'deki antlaşmasıyla halifeliğe bağlılık yemini etti. Mısır ve Levant'ta vaazlar verdiği vaazlar verdi. Mesaj tüm bölgelere yayıldı ve onlar koçta yaşadılar. Sultan onları kaleye taşıdı ve onlara bir ev tahsis etti. İkinci yılda, Tatarlar Şam'a saldırdı, sultan ve halife onlarla savaşmaya çıktı ve zaferle sonuçlandı {alıntı: Tarikh-Khulafa-minhaj-1434, s. 733}, ardından otuz altıncı yılda sultan ile arasında bir çatışma çıktı; Burj'da tutuklandı ve otuz yedinci yılda Qus'a sürgün edildi; burada kendisi ve ailesi yaklaşık yüz kişiyle birlikte kaldı; kırk yılda Şaban'da ölene kadar orada kaldı, orada defnedildi ve oğlu Ahmad'a emanet edildi {atıf:Tarikh-khulafa-minhaj-1434, s. 736,739}. El-Mes'udi'ye göre, otuz üçüncü yılın üçüncü Sefer ayının Cumartesi günü Isa Nehri'nde, El-Mendiya köyü yakınlarında bağlılık yemini eden Ebu el-Kasım Abdullah ibn Ali el-Muktafi'dir; o sırada el-Muttaqi'nin gözleri mühürlenmişti ve Tuzun ona bağlılık yemini etmişti, komutan hakim Muhammed bin el-Hüseyin bin Ebi el-Şawarib ve bir grup Haşimi yemin etti. Pazartesi günü, babasına ait uzun bir eşi taşıyan uzun eşi olan El-Gazel adlı bir pilotla suya indi ve bu karısını Tuzun ile Muhammed ibn Yahya ibn Şirzad yönetiyordu. Ebu el-Farac Muhammed bin Ali el-Salmari ona kızdı ve el-Şerqi bin Ebi Musa el-Hanafi ile el-Garbi ibn Ebi el-Şawarib'i atadı. Halk onun yönetiminin burada sona erdiğini söyledi. İbn Tahir'in evinde kendisi ile el-Fadl bin Muktadir el-Muti' arasında bir anlaşmazlık vardı ve güvercinler, koçlar, horozlar ve bıldırcınlarla oynama konusunda düşmanlık vardı. Halifelik kurulduğunda, el-Muti sığındı, ancak kaçtı ve evini yıktı. Halifeliği bir yıl dört ay sürdü, halifelik ona geldiğinde şarap bıraktı, zamanından beri onun için dua etti ve tüm zamanları boyunca panik ve panik içindeydi. Halifeliği üstlenmek ve ona boyun eğmek itaatkardır {atıf:muruj-al-dhahab s. 704-710}. El-Mes'udi'ye göre, bir gün pişman yoldaşlarının çeşitli yiyecekleri ve insanların şiirlerle söylediklerini tartışmak için toplanmasını, böylece İshaq el-Mevsili'nin Sanbosaj şiirleri, kuşkonmaz, el-Cudhabah, Kaşajim'in Kataif, dimashqi ezbercisi Muhammed ibn el-Vazir'in Al-Arziyya ve Harissa ile Mudirah'ın şiirleriyle sohbet edeceklerini arzulamıştır. Hatta gençliğinde kendisine öğreten öğretmenine şöyle dedi: \"Duyduklarını biz okuduk, sen de bize okudun.\" Ebu Nuwas'ın Batarnaja'daki sözlerini oku: \"Uyu gözlerini vahbin oğlu, ateş gibi, arzu ateşi kalbinde ateştir.\" (alıntı: Muruj-al-Dhahab, s. 710-717 ve İbn al-Athir'e göre, annesi el-Kahramana'nın kendisine bağlılık sağlamak ve Mu'izz al-Dawla'yı tahttan indirmek için büyük çağrısını iddia etmesinin ardından, 334 Hicri Cumedül-Akhirah'tan kalan sekizinci adamın başını indirdi. Daylam'dan iki Nakib onu yatağından çekip boynuna sarıklığını bağladı ve Mu'izz al-Dawla'nın evine götürdü; ev halifeliği yağmaladı, ta ki orada hiçbir şey kalmayana kadar. Halifeliği bir yıl dört ay sürdü. El-Muti bağlılık yemini ettiğinde ona teslim oldu, ancak onu bağladı, kör etti ve aynı yıl Rabi'd-Awwal'da ölene kadar hapsedildi 338 H. 296 Hicri yılında, Sefer'in on ikinci gününde doğdu. Annesi Ghusn adında bir anneydi. Açık tenli, yakışıklıydı, gri saçlıydı {atıf:kamil-ibn-al-athir s. 337}. İbn al-Jawzi'ye göre, 334 Hicri yılında Ebu el-Hüseyin Ahmed bin Büyah'a bağlılık yemini etti, ona en güçlü yemin etti ve onu Prenslerin Komutanı yaptı. O, Büyülerin ilk kralıydı. Kardeşleri Ali İmam el-Devle ve Hasan Rukn al-Dawla'ya verdi, unvanlarının dinar ve dirhemlere damgalanmasını emretti, Daylamlılar ve Türkler halk arasında yerleşti. {alıntı: Muntazam-ibn-al-Jawzi s. 632-633} ve İbn al-Jawzi'ye göre, 334 Hicri yılının Muharrem'inde kendini hakikatın imamı ilan etmiş, dinar ve dirhem üzerinden basmış, bu yüzden ona Hakikat İmamı ve El-Mustakfi Billah unvanlarıyla vaaz etmiştir. Halifelikte bir yıl, dört ay ve iki gün kaldı, tahttan indirildi ve Ebu el-Hüseyin bin Buyah tarafından evinde tutuklandı; orada kan dökülerek öldü. Rivayete göre, el-Muti' onu hapse attı, tutukladı ve kırk altı yaş iki aylıkken öldü. {alıntı: Muntazam-ibn-al-Jawzi s. 632, 656} İbn al-Jawzi'ye göre, otuz dördüncü yılda Muharrem'de kendisini İmam al-Haqq olarak adlandırmış ve ona İmam al-Haqq ve el-Mustakfi bi-Allah unvanlarıyla vaaz etmiş {atıf:Muntazam-ibn-al-Jawzi s. 644}."
  id: "Khalifah ketiga Kairo [701–740 H], Abu al-Rabi' Sulayman ibn al-Hakim, lahir di tengah Muharram pada tahun 684 H. Ia diikrarkan setia kepada kekhalifahan melalui perjanjian ayahnya di Jumada al-Awwal pada tahun 701 H. Ia menyampaikan khotbah di mimbar Mesir dan Levant. Pesan itu menyebar ke seluruh wilayah, dan mereka tinggal di domba jantan. Sultan memindahkan mereka ke benteng dan menyediakan sebuah rumah untuk mereka. Pada tahun kedua, bangsa Tatar menyerang Levant, dan sultan serta khalifah keluar untuk melawan mereka, yang membawa kemenangan {cite: Tarikh-Khulafa-minhaj-1434, hlm. 733}, kemudian terjadi konflik antara dia dan sultan pada tahun tiga puluh enam, di mana dia ditangkap di Burj dan kemudian diasingkan ke Qus pada tahun tiga puluh tujuh, di mana dia dan keluarganya berjumlah hampir seratus jiwa, tinggal di sana hingga dia meninggal di Sha'ban pada tahun empat puluh, dimakamkan di sana, dan dipercayakan kepada putranya Ahmad {cite:Tarikh-khulafa-minhaj-1434, hlm. 736,739}. Menurut al-Mas'udi, ia adalah Abu al-Qasim Abdullah ibn Ali al-Muktafi yang telah bersumpah setia pada hari Sabtu, tanggal tiga bulan Safar, tahun tiga puluh tiga, di Sungai Isa dekat desa Al-Sandiya, pada saat mata al-Muttaqi disegel, dan Tuzun telah bersumpah setia kepadanya, sang komandan, hakim Muhammad ibn al-Husayn ibn Abi al-Shawarib, dan sekelompok Hashemite mengambil sumpah tersebut. Pada hari Senin, ia turun ke air dengan kapal pilot bernama Al-Ghazal, membawa istri panjang milik ayahnya, dipimpin oleh Tuzun dan Muhammad ibn Hamad ibn Yahya ibn Shirzad. Abu al-Faraj Muhammad ibn Ali al-Salmari kemudian marah kepadanya, dan ia mengangkat al-Sharqi ibn Abi Musa al-Hanafi dan al-Gharbi ibn Abi al-Shawarib. Rakyat biasa mengatakan bahwa pemerintahannya telah berakhir di sini. Terjadi perselisihan antara ia dan al-Fadl ibn al-Muqtadir al-Muti' di rumah Ibn Tahir, dan ada permusuhan dalam bermain dengan merpati, domba jantan, ayam jantan, dan puyuh. Ketika kekhalifahan didirikan, al-Muti' mencari perlindungan, tetapi ia melarikan diri dan merobohkan rumahnya. Khalifahnya berlangsung satu tahun empat bulan, dan ia meninggalkan anggur ketika kekhalifahan datang kepadanya, lalu berdoa untuknya sejak zamannya, dan sepanjang waktunya ia panik dan panik. Adalah taat untuk mengambil alih kekhalifahan dan tunduk kepadanya {cite:muruj-al-dhahab hlm. 704-710}. Menurut al-Mas'udi, ia berharap suatu hari para sahabatnya yang menyesal akan berkumpul untuk membahas berbagai makanan dan apa yang dikatakan orang dalam puisi, sehingga mereka akan mengobrol dengan puisi Sanbosaj karya Ishaq al-Mawsili, asparagus, al-Joudhabah, Qataif karya Kashajim, Al-Arziyya oleh Muhammad ibn al-Wazir, pengapal dimashqi, dan Harissa dan al-Mudirah. Ia bahkan berkata kepada gurunya, yang mengajarinya saat muda, \"Kami membacakan apa yang kau dengar, maka kau membacakan kepada kami.\" Jadi bacalah kata-kata Abu Nuwas di Batarnaja: \"Tidurlah matamu, wahai Wahb, seperti api, dan api hasrat adalah api di hatimu.\" {cite: Muruj-al-Dhahab, hlm. 710-717, dan menurut Ibn al-Athir, ia menggulingkan kepala pria kedelapan yang tersisa dari Jumada al-Akhirah pada tahun 334 H setelah ibunya al-Qahramana menuduh panggilan besarnya untuk mengamankan kesetiaan kepadanya dan menggulingkan Mu'izz al-Dawla. Dua Naqib dari Daylam menariknya dari tempat tidur, mengikat sorban di lehernya, dan membawanya menuju rumah Mu'izz al-Dawla, yang menjarah kekhalifahan hingga tidak tersisa apa-apa di sana. Khalifahnya berlangsung satu tahun empat bulan. Ketika al-Muti' diikrarkan kesetiaan, ia menyerah kepadanya, tetapi ia mengikatnya, membutakannya, dan tetap dipenjara hingga meninggal di Rabi' al-Awwal pada tahun yang sama 338 H. Ia lahir pada tanggal dua belas Safar tahun 296 H. Ibunya adalah seorang ibu yang lahir bernama Ghusn. Ia berkulit cerah dan tampan, berambut abu-abu {cite:kamil-ibn-al-athir hlm. 337}. Menurut Ibn al-Jawzi, pada tahun 334 H, ia bersumpah setia kepada Abu al-Husayn Ahmad ibn Buyah, mengucapkan sumpah terkuat, dan menjadikannya Panglima para Pangeran. Ia adalah raja pertama Buyid. Ia memberikan saudara-saudaranya Ali Imad al-Dawla dan Hasan Rukn al-Dawla, memerintahkan gelar mereka dicap pada dinar dan dirham, dan Daylamites serta Turki menetap di antara rakyat. {cite: Muntazam-ibn-al-jawzi hlm. 632-633}, dan menurut Ibn al-Jawzi, dalam Muharram tahun 334 H, ia menyatakan dirinya sebagai Imam kebenaran dan mencetaknya dengan dinar dan dirham, sehingga ia biasa berkhotbah dengan gelar Imam kebenaran dan Al-Mustakfi Billah. Ia tinggal di kekhalifahan selama satu tahun, empat bulan, dan dua hari, digulingkan, dan ditangkap oleh Abu al-Husayn ibn Buyah, yang menangkapnya di rumahnya, di mana ia meninggal di sana karena disintegrasi darah. Konon bahwa al-Muti' bahkan memenjarakannya, menangkapnya, dan meninggal pada usia empat puluh enam tahun dua bulan. {kutip: Muntazam-ibn-al-jawzi hlm. 632, 656} Menurut Ibn al-Jawzi, ia menyebut dirinya Imam al-Haqq pada Muharram tahun tiga puluh empat, dan ia biasa mengajarkan kepadanya dengan gelar Imam al-Haqq dan al-Mustakfi bi-Allah {cite:muntazam-ibn-al-jawzi hlm. 644}."
