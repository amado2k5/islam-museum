label: { ar: "المستكفي بالله سليمان بن الحاكم" }
summary:
  ar: "ثالث خلفاء القاهرة [٧٠١–٧٤٠هـ]، أبو الربيع سليمان بن الحاكم، ولد في نصف المحرم سنة أربع وثمانين وست مئة وبويع بالخلافة بعهد من أبيه في جمادى الأولى سنة إحدى وسبع مئة وخطب له على المنابر في البلاد المصرية والشامية وسارت البشارة إلى جميع الأقطار وكانوا يسكنون بالكبش فنقلهم السلطان إلى القلعة وأفرد لهم داراً، وفي سنة اثنتين هجم التتار الشام فخرج السلطان ومعه الخليفة لقتالهم فكان النصر {cite:tarikh-khulafa-minhaj-1434 p. 733}."
  en: "Third Cairo caliph [701–740], hailed by his father's will; moved with the Abbasids from Kabsh to a citadel house, and rode out with the sultan to the Tatar victory of 702 {cite:tarikh-khulafa-minhaj-1434 p. 733}."
