id: person/al-mustakfi-billah
class: person
label: { ar: "المستكفي بالله سليمان بن الحاكم" }
summary:
  ar: "ثالث خلفاء القاهرة [٧٠١–٧٤٠هـ]، أبو الربيع سليمان بن الحاكم، ولد في نصف المحرم سنة أربع وثمانين وست مئة وبويع بالخلافة بعهد من أبيه في جمادى الأولى سنة إحدى وسبع مئة وخطب له على المنابر في البلاد المصرية والشامية وسارت البشارة إلى جميع الأقطار وكانوا يسكنون بالكبش فنقلهم السلطان إلى القلعة وأفرد لهم داراً، وفي سنة اثنتين هجم التتار الشام فخرج السلطان ومعه الخليفة لقتالهم فكان النصر {cite:tarikh-khulafa-minhaj-1434 p. 733}، ثم وقع بينه وبين السلطان سنة ست وثلاثين فاعتقل بالبرج ثم نفي إلى قوص سنة سبع وثلاثين هو وأهله قريب من مئة نفس واستمر بها إلى أن مات في شعبان سنة أربعين ودفن بها وعهد إلى ابنه أحمد {cite:tarikh-khulafa-minhaj-1434 p. 736,739}. وعند المسعودي هو أبو القاسم عبد الله بن علي المكتفي بويع يوم السبت لثلاث خلون من صفر سنة ثلاث وثلاثين على نهر عيسى بازاء قرية السندية في الوقت الذي سملت فيه عينا المتقي وبايعه توزون والقواد والقاضي محمد بن الحسين بن أبي الشوارب وجماعة من الهاشميين، وانحدر يوم الاثنين في الماء في الطيار المسمى الغزال وعليه فلنسوة طويلة كانت لأبيه وعلى رأسه توزون ومحمد بن حمد بن يحيى بن شيرزاد، واستوزر أبا الفرج محمد بن علي السلمري ثم غضب عليه، واستقضى على الشرقي ابن أبي موسى الحنفي وعلى الغربي ابن أبي الشوارب فقالت العامة إلى ههنا انتهى سلطانه، وكانت بينه وبين الفضل بن المقتدر المطيع مجاورة في دار ابن طاهر وعداوة في اللعب بالحمام والكباش والديوك والسمان، فلما استقرت له الخلافة طلب المطيع فهرب فهدم داره، وكانت خلافته سنة وأربعة أشهر إلا أياماً، وترك النبيذ حين أفضت إليه الخلافة ثم دعا به من وقته، وكان في سائر أوقاته فزعاً وجلاً من المطيع أن يلي الخلافة فيسلم إليه {cite:muruj-al-dhahab p. 704-710}، وعند المسعودي اشتهى أن يجتمع ندماؤه يوماً فيتذاكروا أنواع الأطعمة وما قال الناس فيها منظوماً فتسامروا بأشعار السنبوسج لإسحاق الموصلي والهليون والجوذابة والقطائف لكشاجم والأرزية لمحمد بن الوزير الحافظ الدمشقي والهريسة والمضيرة، حتى قال لمعلمه الذي كان يعلمه في صباه قد أنشدنا ما سمعت فأنشدنا أنت فأنشده قول أبي نواس في باطرنجا نوم عينيك يا ابن وهب غرار ولنار الهوى بقلبك نار {cite:muruj-al-dhahab p. 710-717}، وعند ابن الأثير خلع لثمان بقين من جمادى الآخرة سنة 334هـ بعد أن اتُهمت أمه القهرمانة أن دعوتها العظيمة كانت لتأخذ البيعة له وعزل معز الدولة، فجذبه نقيبان من الديلم عن سريره وجعلا عمامته في حلقه وساقاه ماشياً إلى دار معز الدولة ونُهبت دار الخلافة حتى لم يبق بها شيء، وكانت مدة خلافته سنة وأربعة أشهر، ولما بويع المطيع سُلم إليه فسمله وأعماه وبقي محبوساً حتى مات في ربيع الأول سنة 338هـ وكان مولده ثاني عشر صفر سنة 296هـ وأمه أم ولد اسمها غصن وكان أبيض حسن الوجه قد وخطه الشيب {cite:kamil-ibn-al-athir p. 337}، وعند ابن الجوزي وفي سنة 334هـ أخذ على أبي الحسين أحمد بن بويه البيعة واستحلفه بأغلظ الإيمان وجعله أمير الأمراء وهو أول ملوك بني بويه ولقب أخويه علياً عماد الدولة والحسن ركن الدولة وأمر أن تضرب ألقابهم على الدنانير والدراهم ونزل الديلم والأتراك دور الناس {cite:muntazam-ibn-al-jawzi p. 632-633}، وعند ابن الجوزي وفي محرم سنة 334هـ نقب نفسه إمام الحق وضرب ذلك على الدنانير والدراهم فكان يخطب له بلقبين إمام الحق والمستكفي بالله، ومكث في الخلافة سنة وأربعة أشهر ويومين وخلع وقبض عليه أبو الحسين بن بويه واعتقله في داره فمات هناك بتفتيت الدم وقيل بل سمله المطيع واعتقله وتوفي وهو ابن ست وأربعين سنة وشهرين {cite:muntazam-ibn-al-jawzi p. 632, 656}"
  en: "Third Cairo caliph [701–740], hailed by his father's will; moved with the Abbasids from Kabsh to a citadel house, and rode out with the sultan to the Tatar victory of 702 {cite:tarikh-khulafa-minhaj-1434 p. 733}."
