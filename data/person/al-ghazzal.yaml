label: { ar: "يحيى بن الحكم الغزال" }
summary:
  ar: "الغزال الشاعر الأندلسي؛ أرسله الأمير إلى بلاد المجوس سفيراً وقد قارب الخمسين ووخطه الشيب، فسألته زوجة الملك تود عن سنه فقال مداعباً: عشرون، فلما تعجبت أجابها بكلام أعجبها فأمرته بالانخصاب؛ وبعثه أيضاً إلى ملك الروم فأعجبه حديثه وأنشد في جمال الملكة حتى تزايدت حظوته {cite:nafh-tib-maqqari p. 259 v.2}. وكان أقذع في هجاء زرياب فذكر ذلك لعبد الرحمن بن الحكم فأمر بنفيه فدخل العراق {cite:nafh-tib-maqqari p. 262 v.2}، وعاش أربعاً وتسعين سنة وتوفي في حدود الخمسين والمائتين."
  en: "Al-Ghazzal (Yahya ibn al-Hakam) — the poet-ambassador: sent past fifty to the Majus king, he told Queen Tud he was 'twenty' and won her bounty by his wit; sent also to the Byzantine king whose queen's beauty he praised in verse. His savage lampoons of Ziryab earned him exile to Iraq; he lived ninety-four years {cite:nafh-tib-maqqari v.2 pp. 259–262}."
