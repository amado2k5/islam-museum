class: person
label: { ar: "عمرو بن هانئ العبسي", en: "Amr ibn Hani' al-Absi", es: "Amr ibn Hani' al-Absi", fr: "Amr ibn Hani' al-Absi", ur: "عمرو بن ہانی العبسی" }
summary:
  ar: "عمرو بن هانئ العبسي؛ بعثه الحجاج في أهل دمشق إلى الأكراد الذين عاثوا أيام ابن الأشعث فأوقع بهم وقتل منهم خلقاً ثم أمره بغزو الديلم فغزاهم في اثني عشر ألفاً."
  en: "Amr ibn Hani' al-Absi; al-Hajjaj sent him with Damascenes against the Kurds who had ravaged in Ibn al-Ash'ath's days — he routed them and killed many — then ordered him against Daylam with twelve thousand."
  es: "Amr ibn Hani' al-Absi; al-Hajjaj lo envió con damascenos contra los kurdos que habían asolado la región en tiempos de Ibn al-Ash'ath; los derrotó y mató a muchos; luego le ordenó que atacara Daylam con doce mil hombres."
  fr: "Amr ibn Hani' al-Absi; al-Hajjaj l'envoya avec des Damascènes contre les Kurdes qui avaient ravagé les terres du temps d'Ibn al-Ash'ath — il les mit en déroute et en tua beaucoup — puis lui ordonna d'attaquer Daylam avec douze mille hommes."
  ur: "عمرو بن ہانی العبسی؛ الحجاج نے اسے دمشقیوں کے ساتھ کردوں کے خلاف بھیجا جنہوں نے ابن الاشث کے دنوں میں تباہی مچائی تھی - اس نے ان کو شکست دی اور بہت سے لوگوں کو قتل کیا - پھر اسے بارہ ہزار کے ساتھ دیلام کے خلاف حکم دیا۔"
  tr: "Amr bin Hani el-Absi; el-Hacı tarafından Şam halkı arasında, İbn el-Eşat günlerinde isyan eden Kürtlere gönderildi, onları yendi ve bazılarını öldürdü, ardından Daylam'a baskın emretti ve on iki bin askerle saldırdı."
  id: "Amr ibn Hani al-Absi; dikirim oleh al-Hajjaj di antara rakyat Damaskus kepada orang Kurdi yang memberontak pada masa Ibn al-Ash'ath, yang mengalahkan mereka dan membunuh beberapa dari mereka, lalu memerintahkannya untuk menyerang Daylam, dan ia menyerang mereka dengan dua belas ribu."
