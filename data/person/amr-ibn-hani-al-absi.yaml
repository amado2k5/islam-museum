summary:
  ar: "عمرو بن هانئ العبسي؛ بعثه الحجاج في أهل دمشق إلى الأكراد الذين عاثوا أيام ابن الأشعث فأوقع بهم وقتل منهم خلقاً ثم أمره بغزو الديلم فغزاهم في اثني عشر ألفاً."
  en: "Amr ibn Hani' al-Absi; al-Hajjaj sent him with Damascenes against the Kurds who had ravaged in Ibn al-Ash'ath's days — he routed them and killed many — then ordered him against Daylam with twelve thousand."
  es: "Amr ibn Hani' al-Absi; al-Hajjaj lo envió con damascenos contra los kurdos que habían asolado la región en tiempos de Ibn al-Ash'ath; los derrotó y mató a muchos; luego le ordenó que atacara Daylam con doce mil hombres."
  fr: "Amr ibn Hani' al-Absi; al-Hajjaj l'envoya avec des Damascènes contre les Kurdes qui avaient ravagé les terres du temps d'Ibn al-Ash'ath — il les mit en déroute et en tua beaucoup — puis lui ordonna d'attaquer Daylam avec douze mille hommes."
