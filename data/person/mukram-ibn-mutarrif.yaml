summary:
  ar: "مكرم بن مطرف بن سيدان الباهلي؛ بعثه مصعب بن الزبير في طلب عبيد الله بن زياد بن ظبيان قاتل أبيه فسار حتى عسكر بالموضع الذي سمي به عسكر مكرم فلم يلقه."
  en: "Mukram ibn Mutarrif al-Bahili; sent by Mus'ab after his father's killer, he camped where Askar Mukram stands and found him not."
  es: "Mukram ibn Mutarrif al-Bahili, enviado por Mus'ab tras el asesino de su padre, acampó donde se encuentra Askar Mukram y no lo encontró."
  fr: "Mukram ibn Mutarrif al-Bahili; envoyé par Mus'ab après le meurtrier de son père, il campa là où se tenait Askar Mukram et ne le trouva pas."
  ur: "مکرم بن مطرف الباہلی؛ مصعب نے اپنے والد کے قاتل کے بعد بھیجا، اس نے جہاں عسکر مکرم کھڑا ہے ڈیرہ ڈالا اور اسے نہیں ملا۔"
  tr: "Makram bin Mutraf bin Saydan al-Bahili; Mus'ab bin al-Zubayr onu, babasının katili Ubayd Allah bin Ziyad bin Zubyan'ı aramaya gönderdi. Askar Makram adlı yerde kamp kurana kadar yürüdü ama onunla karşılaşmadı."
  id: "Makram bin Mutraf bin Saydan al-Bahili; Mus'ab bin al-Zubayr mengirimnya mencari Ubayd Allah bin Ziyad bin Zubyan, pembunuh ayahnya. Ia berjalan hingga berkemah di tempat bernama Askar Makram, tetapi ia tidak bertemu dengannya."
