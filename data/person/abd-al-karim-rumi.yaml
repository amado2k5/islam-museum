summary:
  ar: "الملا عبد الكريم بن عبد الله الرومي الحنفي العالم الفاضل المشهور؛ كان من الأرقاء ثم منّ الله عليه بالعتق فجدّ في طلب العلم وحصل فنوناً عدة، وقرأ على الملا الطوسي والملا سنان العجمي تلميذ الملا محمد شاه الفناري، ثم صار مدرساً ببعض المدارس الثمان التي بناها محمد خان الفاتح عند فتح القسطنطينية، ثم ولى قضاء العسكر ثم صار مفتياً زمن السلطان محمد واستمر بها إلى أن مات سنة إحدى وتسعمائة، وله حواشٍ على أوائل التلويح {cite:shadharat-dhahab p. 421}."
  en: "A freed slave who rose to be mufti of Constantinople under Mehmed II — studied under al-Tusi and Sinan al-'Ajami (Molla Fenari's pupil), taught at one of the Eight Madrasas founded at the conquest, then judge of the 'askar, then mufti until his death in 901; author of hashiyas on the opening of al-Talwih {cite:shadharat-dhahab p. 421}."
