summary:
  ar: "الملا عبد الكريم بن عبد الله الرومي الحنفي العالم الفاضل المشهور؛ كان من الأرقاء ثم منّ الله عليه بالعتق فجدّ في طلب العلم وحصل فنوناً عدة، وقرأ على الملا الطوسي والملا سنان العجمي تلميذ الملا محمد شاه الفناري، ثم صار مدرساً ببعض المدارس الثمان التي بناها محمد خان الفاتح عند فتح القسطنطينية، ثم ولى قضاء العسكر ثم صار مفتياً زمن السلطان محمد واستمر بها إلى أن مات سنة إحدى وتسعمائة، وله حواشٍ على أوائل التلويح {cite:shadharat-dhahab p. 421}."
  en: "A freed slave who rose to be mufti of Constantinople under Mehmed II — studied under al-Tusi and Sinan al-'Ajami (Molla Fenari's pupil), taught at one of the Eight Madrasas founded at the conquest, then judge of the 'askar, then mufti until his death in 901; author of hashiyas on the opening of al-Talwih {cite:shadharat-dhahab p. 421}."
  fr: "Un esclave affranchi qui devint mufti de Constantinople sous Mehmed II — il étudia auprès d'al-Tusi et de Sinan al-'Ajami (élève de Molla Fenari), enseigna dans l'une des huit madrasas fondées lors de la conquête, puis fut juge de l''askar, puis mufti jusqu'à sa mort en 901 ; auteur de hashiyas sur le début d'al-Talwih {cite:shadharat-dhahab p. 421}."
  es: "Un esclavo liberado que llegó a ser muftí de Constantinopla bajo el reinado de Mehmed II — estudió con al-Tusi y Sinan al-'Ajami (discípulo de Molla Fenari), enseñó en una de las Ocho Madrasas fundadas en la conquista, luego juez del 'askar, luego muftí hasta su muerte en 901; autor de hashiyas sobre la apertura de al-Talwih {cite:shadharat-dhahab p. 421}."
  ur: "ایک آزاد غلام جو محمود دوم کے ماتحت قسطنطنیہ کا مفتی بنا - الطوسی اور سنان العجمی ⁦(مولا فناری کے شاگرد)⁩ کے تحت تعلیم حاصل کی، فتح کے وقت قائم کیے گئے آٹھ مدارس میں سے ایک میں پڑھایا، پھر عسکر کا قاضی، پھر 901 میں اپنی موت تک مفتی؛ التلویح کے آغاز پر حاشیہ کے مصنف {حوالہ: شدھارت ذہاب ص۔ 421}۔"
  tr: "Ünlü ve faziletli alim Molla Abdül Kerim bin Abdullah Rumi Hanefi; köleydi, sonra Allah ona özgürlük lütfetti, bunun üzerine ilim öğrenmek için gayret gösterdi ve çeşitli ilimler öğrendi. Molla Tusi ve Molla Sinan Acemi'nin yanında eğitim gördü, Molla Muhammed Şah Fanari'nin öğrencisi oldu. Daha sonra Muhammed Han Fatih'in İstanbul'u fethettiğinde kurduğu sekiz okuldan bazılarında öğretmenlik yaptı, ardından ordunun kadısı olarak atandı, Sultan Muhammed döneminde müftü oldu ve 901 yılında vefat edene kadar bu görevi sürdürdü. Ayrıca, El-Talvih'in başlangıcına dair kenar notları da bulunmaktadır. {Kaynak: Şadharat-Dhaba, s. 421}"
  id: "Mulla Abdul Karim bin Abdullah Al-Rumi Al-Hanafi, seorang ulama terkenal dan berbudi luhur; beliau adalah seorang budak, kemudian Allah menganugerahinya kebebasan, sehingga beliau tekun mencari ilmu dan menguasai berbagai ilmu, dan beliau belajar di bawah bimbingan Mulla Al-Tusi dan Mulla Sinan Al-Ajami, murid Mulla Muhammad Shah Al-Fanari, kemudian beliau menjadi guru di beberapa dari delapan sekolah yang dibangun oleh Muhammad Khan Al-Fatih ketika beliau menaklukkan Konstantinopel, kemudian beliau diangkat sebagai hakim militer, kemudian beliau menjadi mufti pada masa Sultan Muhammad dan terus memegang jabatan itu hingga beliau wafat pada tahun 901, dan beliau memiliki catatan pinggir pada awal mula Al-Talwih {cite:shadharat-dhahab p. 421}."
