summary:
  ar: "بطاقة أولية لأباظة سياوش باشا الأول، الصدر الأعظم العثماني في ١٦٥١م في عهد محمد الرابع والي إرزروم سابقاً؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abaza Siyavush Pasha I, the Ottoman grand vizier of 1651 under Mehmed IV, formerly governor of Erzurum; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Abaza Siyavush Pasha I, el gran visir otomano de 1651 bajo Mehmed IV, antiguo gobernador de Erzurum; la entrada de origen aún no se ha comprobado en la página."
  fr: "Fiche de candidature d'Abaza Siyavush Pacha Ier, grand vizir ottoman de 1651 sous Mehmed IV, ancien gouverneur d'Erzurum; la source n'est pas encore vérifiée sur la page."
  ur: "1651 کے عثمانی وزیر اعظم، محمود چہارم کے تحت، ابازہ سیاوش پاشا اول کے لیے ڈرافٹ کارڈ، جو پہلے ایرزورم کے گورنر تھے۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "1651 yılında IV. Muhammed döneminde Osmanlı Sadrazamı olan ve Erzurum'un eski valisi olan I. Abaza Siyavuş Paşa'ya ait ön taslak bir kart; Osmanlı tarih kitaplarında adı geçmektedir ve çevirisi henüz bu sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Abaza Siyavush Pasha I, Wazir Agung Ottoman pada tahun 1651 M selama pemerintahan Muhammad IV, mantan gubernur Erzurum; ia disebutkan dalam buku-buku sejarah Ottoman dan terjemahannya belum ditinjau di halaman ini."
