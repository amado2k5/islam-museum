summary:
  ar: "السلطان عبد الحميد الثاني ⁦(١٢٩٣–١٣٢٧هـ/١٨٧٦–١٩٠٩م)⁩؛ تولى بعد خلع أخيه مراد الخامس، فظل يتمتع بالسلطة التي تمتع بها أسلافه إذ كان الدستور مرتهناً بشخصه: له وحده حق تعيين الوزراء وإقالتهم وعقد المعاهدات وإعلان الحرب والصلح وإصدار القوانين دون الرجوع إلى البرلمان. انتهج سياسة التودد إلى الشخصيات ذات النفوذ، فجعل مجلس المشايخ ورتّب رواتب أعضائه، وتودد إلى دعاة الجامعة الإسلامية كمصطفى كامل في مصر ونامق كمال، وأنشأ مدرسة العشائر العربية لأبناء زعماء العرب ثم توسعت فأخذت من أبناء الأكراد والألبان، وحرص على الاتصال بزعماء القبائل بالرسائل والرسل لتقوية روابط الأخوة الإسلامية، وكان على معرفة تامة بعمل الإنجليز الذين اتصلوا بشريف مكة والشيخ حميد الدين في اليمن وشيخ عسير لتحريضهم على الخلافة {cite:dawlat-uthmaniyya-salabi p. 397-434}."
  en: "Abd al-Hamid II (r. 1293–1327/1876–1909) — ruled under a constitution hostage to his person: ministers, treaties, war and law all his alone. His pan-Islamic counterweight: the Shaykhs' Council, the Arab Tribal School for sons of chiefs, and correspondence with the Arab amirs — against British approaches to the Sharif of Mecca and the imams of Yemen and Asir {cite:dawlat-uthmaniyya-salabi p. 397-434}."
  fr: "Abd al-Hamid II (r. 1293–1327/1876–1909) — régna sous une constitution soumise à sa personne : ministres, traités, guerre et lois relevaient de lui seul. Son contrepoids panislamique : le Conseil des cheikhs, l'École tribale arabe pour les fils de chefs, et la correspondance avec les émirs arabes — contre les approches britanniques auprès du chérif de La Mecque et des imams du Yémen et de l'Asir {cite:dawlat-uthmaniyya-salabi p. 397-434}."
  es: "Abd al-Hamid II (r. 1293–1327/1876–1909) gobernó bajo una constitución supeditada a su persona: ministros, tratados, guerra y leyes, todo bajo su exclusivo control. Su contrapeso panislámico: el Consejo de los Shaykhs, la Escuela Tribal Árabe para hijos de jefes y la correspondencia con los emires árabes, se opusieron a los acercamientos británicos al Sharif de La Meca y a los imanes de Yemen y Asir {cite:dawlat-uthmaniyya-salabi p. 397-434}."
  ur: "عبد الحمید II (r. 1293-1327/1876-1909) - ایک آئین کے تحت اپنے شخص کے یرغمال بنائے گئے: وزراء، معاہدے، جنگ اور قانون سب اس کا تنہا۔ اس کا تمام اسلامی رد و بدل: شیخوں کی کونسل، سرداروں کے بیٹوں کے لیے عرب قبائلی مکتب، اور عرب امیروں کے ساتھ خط و کتابت - شریف مکہ اور یمن و عسیر کے اماموں تک برطانوی روابط کے خلاف {حوالہ: دولت عثمانیہ صلابی ص۔ 397-434}۔"
