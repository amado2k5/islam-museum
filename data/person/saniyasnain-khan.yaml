summary:
  ar: كاتب وناشر هندي وُلد سنة 1959 في أعظمكره. مؤسّس دار «الكتب الطيبة» ⁦(Goodword Books)⁩ وأكثر كتّاب أدب الأطفال الإسلامي إنتاجًا في العالم، وقد بيعت كتبه بملايين النسخ في لغات كثيرة.
  en: Indian author and publisher, born 1959 in Azamgarh. Founder of Goodword Books and the most prolific writer of Islamic children's literature, with millions of copies sold in many languages.
  ur: بھارتی مصنف اور ناشر، 1959 میں اعظم گڑھ میں پیدا ہوئے۔ گڈورڈ بکس کے بانی اور دنیا کے زیادہ پیداوار والے اسلامی بچوں کے مصنف، جن کی کتابیں کئی زبانوں میں لاکھوں نسخے بکیں۔
  es: "Autora y editora india, nacida en 1959 en Azamgarh. Fundadora de Goodword Books y la escritora más prolífica de literatura infantil islámica, con millones de ejemplares vendidos en numerosos idiomas."
  fr: "Auteure et éditrice indienne, née en 1959 à Azamgarh. Fondatrice de Goodword Books et auteure la plus prolifique de littérature jeunesse islamique, avec des millions d'exemplaires vendus dans de nombreuses langues."
