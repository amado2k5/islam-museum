summary:
  en: "The Tayyi governor Khosrow set over al-Hira after imprisoning al-Nuʾman; ordered to extract the deposit from Hani ibn Masʾud, his expedition with Khosrow’s marzabans was broken by Banu Shayban at Dhu Qar; the Prophet was born in the eighth month of his governorship."
  ar: "الوالي الطائي الذي ولّاه كسرى الحيرة بعد حبس النعمان؛ أُمر باستخلاص وديعة هانئ بن مسعود فأبى هانئ، فكانت موقعة ذي قار التي هُزمت فيها الفرس؛ وُلد النبي لثمانية أشهر من ولايته على الحيرة. وعند البلاذري: كان عامل كسرى أبرويز على الحيرة بعد النعمان بن المنذر وخرج هو — ويُقال ابنه فروة — مع عبد المسيح بن بقيلة وهاني بن قبيصة مفاوضاً عنها إلى خالد بن الوليد."
