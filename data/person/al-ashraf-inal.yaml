id: person/al-ashraf-inal
class: person
label: { ar: "السلطان الأشرف إينال", en: "Sultan al-Ashraf Inal", fr: "Le sultan al-Ashraf Inal", es: "Sultan al-Ashraf Inal", ur: "سلطان الاشرف انال" }
summary:
  ar: "سلطان مملوكي جركسي، وثب على المنصور عثمان بن جقمق فقبض عليه فقلده الخليفة القائم في ربيع الأول سنة سبع وخمسين ولقب الأشرف، ثم وقع بين الخليفة والأشرف بسبب ركوب الجند عليه فخلعه من الخلافة في جمادى سنة تسع وخمسين وسيره إلى الإسكندرية فاعتقله بها {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  en: "Circassian sultan invested by caliph al-Qa'im in 857; their breach over the soldiers' intrusion led him to depose the caliph himself in 859 and hold him at Alexandria {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  fr: "Sultan circassien investi par le calife al-Qa’im en 857 H ; leur rupture au sujet de l’intrusion des soldats le conduisit à déposer le calife lui-même en 859 H et à le détenir à Alexandrie {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  es: "Sultán circasiano investido por el califa al-Qa'im en 857; su ruptura por la intrusión de los soldados lo llevó a deponer al propio califa en 859 y retenerlo en Alejandría {cite:tarikh-khulafa-minhaj-1434 p. 775}."
  ur: "857 میں خلیفہ القائم کے ذریعہ سرکیسیئن سلطان کی سرمایہ کاری؛ سپاہیوں کی مداخلت پر ان کی خلاف ورزی نے اسے 859 میں خود خلیفہ کو معزول کر دیا اور اسکندریہ میں رکھا۔ 775}۔"
  tr: "Çerkes Memlük sultanlarından biri olan Osman ibn Yakmak'a saldıran ve onu tutuklayan El-Kaim, 57. Rebiü'l-Evvel ayında Halife olarak atanmış ve El-Eşref unvanını almıştır. Ancak askerlerin kendisine saldırması nedeniyle Halife ile El-Eşref arasında bir anlaşmazlık çıkmış, bunun üzerine Halife onu 59. Cemâda ayında halifelikten azletmiş ve İskenderiye'ye göndermiştir; orada tutuklanmıştır. {cite:tarikh-khulafa-minhaj-1434 s. 775}"
  id: "Seorang sultan Mamluk Circassian, yang menyerang Al-Mansur Uthman ibn Jaqmaq dan menangkapnya, diangkat oleh Khalifah Al-Qaim pada bulan Rabi’ al-Awwal tahun lima puluh tujuh dan diberi gelar Al-Ashraf. Kemudian timbul perselisihan antara Khalifah dan Al-Ashraf karena serangan tentara terhadapnya, sehingga Khalifah mencopotnya dari kekhalifahan pada bulan Jumada tahun lima puluh sembilan dan mengirimnya ke Alexandria, tempat ia ditangkap. {cite:tarikh-khulafa-minhaj-1434 p. 775}."
