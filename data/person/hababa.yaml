summary:
  ar: "جارية مغنية اشترتها أم سعيد العثمانية جدة يزيد بن عبد الملك احتيالاً عليه فكان في نفسه منها شيء قديماً، فوهب سلامة القس لأم سعيد، وبعثت حبابة إلى الأحوص ومعبد فغناه فما العيش إلا ما تلذ وتشتهي وإن لام فيه ذو الشنان وفند {cite:muruj-al-dhahab p. 185-186}."
  en: "The singing-girl procured by Yazid's grandmother to displace Salama — she summoned al-Ahwas's verse and Ma'bad's singing: 'life is only what delights you' {cite:muruj-al-dhahab p. 185-186}."
  es: "La cantante contratada por la abuela de Yazid para reemplazar a Salama — ella invocó el verso de al-Ahwas y el canto de Ma'bad: 'la vida es solo aquello que te deleita' {cite:muruj-al-dhahab p. 185-186}."
  fr: "La jeune chanteuse que la grand-mère de Yazid a engagée pour remplacer Salama — elle a invoqué le vers d'al-Ahwas et le chant de Ma'bad: « la vie n'est que ce qui te délice » {cite: muruj-al-dhahab p. 185-186}."
  ur: "یزید کی دادی نے سلامہ کو بے گھر کرنے کے لیے گانے والی لڑکی کو حاصل کیا تھا - اس نے الاحواس کی آیت اور معبد کے گانے کو طلب کیا: 'زندگی صرف وہی ہے جو آپ کو خوش کرتی ہے' {حوالہ: مروج الذہب صفحہ 185-186}۔"
  tr: "Bir kız şarkıcı, Yazid bin Abd al-Malik'in büyükannesi Um Sa'id al-Uthmani tarafından dolandırıcı olarak satın alındı, böylece geçmişten bir şeyi elinde bulunduruyordu. Selamet al-Kass Um Sa'id'e hediye edildi ve Hababa Al-Ahwas ve Ma'bad'a gönderildi, onlar da onun için şarkı söylediler. Hayatta zevk ve arzudan başka hiçbir şey yoktur, Dhu al-Shanan onu suçlayıp reddetse bile {cite:muruj-al-dhahab s. 185-186}."
  id: "Seorang penyanyi pelayan dibeli oleh um Sa'id al-Uthmani, nenek Yazid ibn Abd al-Malik, sebagai penipuan terhadapnya, sehingga ia memiliki sesuatu dari Yazid dari masa lalu. Salamat al-Qass diberikan kepada um Sa'id, dan Hababa dikirim kepada Al-Ahwas dan Ma'bad, yang menyanyikan untuknya. Tidak ada apa pun dalam hidup selain apa yang kau nikmati dan inginkan, bahkan jika Dhu al-Shanan menyalahkannya dan menolak {cite:muruj-al-dhahab hlm. 185-186}."
