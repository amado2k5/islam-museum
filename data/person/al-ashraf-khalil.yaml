label: { ar: "الملك الأشرف صلاح الدين خليل بن قلاوون" }
summary:
  ar: "سلطان مملوكي، تسلطن بعد أبيه قلاوون سنة تسع وثمانين فأظهر أمر الخليفة وكان خاملاً في أيام أبيه حتى إن أباه لم يطلب منه تقليداً فخطب الخليفة بالناس وذكر توليته أمر الإسلام ثم خطب خطبة جهادية وذكر بغداد وحرض على أخذها، وفي سنة إحدى وتسعين حاصر قلعة الروم، وقتل بترجة في المحرم سنة ثلاث وتسعين وست مئة {cite:tarikh-khulafa-minhaj-1434 p. 730}."
  en: "Qalawun's son; he raised the sidelined caliph — no deed ever asked of him — whose Jumu'a khutba named him to rule and whose jihad khutba urged Baghdad's retaking. Killed at Turuja, Muharram 693 {cite:tarikh-khulafa-minhaj-1434 p. 730}."
