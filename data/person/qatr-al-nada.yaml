id: person/qatr-al-nada
class: person
label: { ar: "قطر الندى بنت خمارويه" }
summary:
  ar: "بنت خمارويه بن أحمد بن طولون، زفت إلى المعتضد سنة اثنتين وثمانين فدخل عليها في ربيع الأول وكان في جهازها أربعة آلاف تكة مجوهرة وعشرة صناديق جوهر {cite:tarikh-khulafa-minhaj-1434 p. 574}. وعند المسعودي وصلت قطر الندى بنت خمارويه إلى مدينة السلام مع ابن الحصاص في ذي الحجة سنة إحدى وثمانين ومائتين، وفي زفافها يقول علي بن العباس الرومي يا سيد العرب الذي زفت له باليمن والبركات سيدة العجم شمس الضحى زفت إلى بدر الدجى فتكشفت بهما عن الدنيا الظلم {cite:muruj-al-dhahab p. 631} وعند ابن الجوزي توفيت لسبع خلون من رجب سنة سبع وثمانين ومائتين ودُفنت داخل قصر الرصافة {cite:muntazam-ibn-al-jawzi p. 318}."
  en: "Khumarawayh's daughter, married to al-Mu'tadid in 282 with a trousseau of four thousand jewelled girdles and ten jewel chests {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  es: "La hija de Khumarawayh se casó con al-Mu'tadid en 282 con un ajuar de cuatro mil cinturones enjoyados y diez cofres de joyas {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  fr: "La fille de Khumarawayh, mariée à al-Mu'tadid en 282 avec un trousseau de quatre mille ceintures ornées de bijoux et dix coffres à bijoux {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  ur: "خماراویہ کی بیٹی کی شادی المتدید سے 282 میں ہوئی جس میں چار ہزار جواہرات کی کمروں اور دس زیورات کے صندوق تھے۔ 574}۔"
  tr: "Khumarawayh ibn Ahmed ibn Tulun'un kızı, seksen iki yılında al-Mu'tadid ile evlendi ve Mu'tadid Rabi'al-Awwal'da ona dört bin mücevher ve on sandık mücevher taşıyarak girdi {alıntı: Tarih-Khulafa-minhaj-1434 s. 574}. al-Mas'udi'ye göre, Qatr al-Nada bint Khamarawayh, iki yüz seksen bir yılında, İbn al-Hassas ile birlikte Dhu al-Hijjah'de barış şehrine gelmiştir. Düğününde Ali ibn al-Abbas al-Rumi şöyle der: Ey Arapların efendisi, Pers Hanımefendisi için bereketle ve şafak güneşiyle kutsanmış, onlar aracılığıyla dünyanın adaletsizliğini ortaya çıkarmıştır {cite:Muruj-al-Dhahab, s. 631}. İbn al-Jawzi'ye göre, iki yüz seksen yedi yılın yedinci Recep'inde ölmüş ve Rusafa sarayında defnedilmiştir {cite:Muntazam-ibn-al-Jawzi s. 318}."
  id: "Putri Khumarawayh ibn Ahmad ibn Tulun dinikahi dengan al-Mu'tadid pada tahun delapan puluh dua, dan ia datang ke Rabi' al-Awwal membawa empat ribu perhiasan dan sepuluh peti perhiasan {cite:Sejarah-Khulafa-minhaj-1434 hlm. 574}. Menurut al-Mas'udi, Qatr al-Nada bint Khamarawayh tiba di kota damai bersama Ibn al-Hassas di Dhu al-Hijjah pada tahun dua ratus delapan puluh satu. Pada pernikahannya, Ali ibn al-Abbas al-Rumi berkata: Wahai penguasa orang Arab, yang memberkati Bunda Persia dengan kemakmuran dan matahari fajar, dan melalui mereka ia mengungkapkan ketidakadilan dunia {cite:Muruj-al-Dhahab, hlm. 631}. Menurut Ibn al-Jawzi, ia meninggal pada tanggal tujuh Rajab tahun dua ratus delapan puluh tujuh dan dimakamkan di dalam istana Rusafa {cite:Muntazam-ibn-al-jawzi hlm. 318}."
