label: { ar: "قطر الندى بنت خمارويه" }
summary:
  ar: "بنت خمارويه بن أحمد بن طولون، زفت إلى المعتضد سنة اثنتين وثمانين فدخل عليها في ربيع الأول وكان في جهازها أربعة آلاف تكة مجوهرة وعشرة صناديق جوهر {cite:tarikh-khulafa-minhaj-1434 p. 574}. وعند المسعودي وصلت قطر الندى بنت خمارويه إلى مدينة السلام مع ابن الحصاص في ذي الحجة سنة إحدى وثمانين ومائتين، وفي زفافها يقول علي بن العباس الرومي يا سيد العرب الذي زفت له باليمن والبركات سيدة العجم شمس الضحى زفت إلى بدر الدجى فتكشفت بهما عن الدنيا الظلم {cite:muruj-al-dhahab p. 631}"
  en: "Khumarawayh's daughter, married to al-Mu'tadid in 282 with a trousseau of four thousand jewelled girdles and ten jewel chests {cite:tarikh-khulafa-minhaj-1434 p. 574}."
