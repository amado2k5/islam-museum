summary:
  ar: "شاعر هجا يحيى بن أكثم بقوله قاض يرى الحد في الزناء ولا يرى على من يلوط من بأس وأميرنا يسترشي وحاكمنا يلوط، فأطرق المأمون خجلاً ثم قال ينفي ابن أبي نعيم إلى السند {cite:muruj-al-dhahab p. 415-416}."
  en: "The satirist whose 'a judge who sees the hadd for zina but none for liwat' earned him exile to Sind {cite:muruj-al-dhahab p. 415-416}."
  es: "El satírico cuyo \"juez que ve el hadd para zina pero ninguno para liwat\" le valió el exilio a Sind {cite:muruj-al-dhahab p. 415-416}."
  fr: "Le satiriste dont « un juge qui voit le hadd pour zina mais aucun pour liwat » lui a valu l'exil au Sind {cite:muruj-al-dhahab p. 415-416}."
  ur: "وہ طنز نگار جس کا 'ایک ایسا منصف جو زنا کے لیے حد تو دیکھتا ہے لیکن لغویت کے لیے کوئی نہیں' نے اسے سندھ جلاوطن کر دیا۔ 415-416}۔"
  tr: "Hicivli bir şair Yahya ibn Aktham şöyle demiştir: Zina cezasını belirleyen ama zina yapan kimseyi görmeyen bir yargıç, prensimiz rüşvet alır, hükümdarımız rüşvet alır. Al-Ma'mun utançla geri çekildi ve İbn Ebi Nu'aym'ın bunu zincire reddedeceğini söyledi {cite:muruj-al-dhahab s. 415-416}."
  id: "Seorang penyair satir Yahya ibn Aktham berkata: Seorang hakim yang menetapkan hukuman atas perselingkuhan tetapi tidak melihat siapa pun yang berzinah, sementara pangeran kita menerima suap dan penguasa kita menerima suap. Al-Ma'mun kemudian mundur dengan malu dan berkata bahwa Ibn Abi Nu'aym akan menyangkalnya kepada rantai {cite:muruj-al-dhahab hlm. 415-416}."
