summary:
  ar: "مشير وسياسي سوداني (1934–2018)، وزير الدفاع والقائد العام للجيش، تسلّم السلطة في انتفاضة 6 أبريل 1985 ورأس المجلس العسكري الانتقالي، ثم سلّمها لحكومة مدنية منتخبة في 1986، ورأس بعدها مجلس أمناء منظمة الدعوة الإسلامية، ونال جائزة الملك فيصل لخدمة الإسلام (2004)."
  en: "Sudanese field marshal and statesman (1934–2018), defence minister and commander-in-chief, who took power during the uprising of 6 April 1985 as head of the Transitional Military Council and handed it to an elected civilian government in 1986, then chaired the board of the Islamic Call Organization; King Faisal Prize for Service to Islam (2004)."
  ur: "سوڈانی فیلڈ مارشل اور سیاست دان ⁦(1934ء–2018ء)⁩، وزیرِ دفاع اور فوج کے کمانڈر انچیف، جنھوں نے 6 اپریل 1985ء کی عوامی تحریک میں عبوری فوجی کونسل کے سربراہ کی حیثیت سے اقتدار سنبھالا اور 1986ء میں منتخب سول حکومت کو سونپ دیا، پھر اسلامی دعوت تنظیم کے بورڈ آف ٹرسٹیز کے سربراہ رہے؛ شاہ فیصل انعام برائے خدمتِ اسلام ⁦(2004ء)⁩۔"
