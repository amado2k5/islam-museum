summary:
  ar: "كاتبة بوسنية من سراييفو، أول ناثرة بين النساء المسلمات في البوسنة: معلّمة تعلّمت رغم ما أثاره تعليم أبيها لبناته من عداء، نشرت قصص «تيمه» في مجلتي «زمان» و«بيسر» منذ 1912 فكتبت عن تحرّر المرأة والفقر وتشريد الحرب، ثم اعتزلت الحياة الأدبية بعد زواجها."
  en: "Bosnian writer from Sarajevo, the first prose writer among Bosnian Muslim women: a teacher educated in the face of the hostility her father's choice provoked, she published the Teme stories in Zeman and Biser from 1912, writing on women's emancipation, poverty and wartime displacement, before withdrawing from literary life after her marriage."
  ur: "سرائیوو سے تعلق رکھنے والی بوسنیائی ادیبہ، بوسنیائی مسلم خواتین میں پہلی نثر نگار: وہ معلّمہ جنھیں والد کے فیصلے پر اٹھنے والی مخالفت کے باوجود تعلیم ملی؛ 1912ء سے «زمان» اور «بشر» میں اپنی کہانیاں «تیمے» شائع کیں، جن میں خواتین کی آزادی، غربت اور جنگی بے گھری پر لکھا، پھر شادی کے بعد ادبی زندگی سے کنارہ کش ہو گئیں۔"
