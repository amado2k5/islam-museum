summary:
  ar: "صحفية ومذيعة بريطانية، وُلدت في نورثامبتون سنة 1973 لأبوين باكستانيين. عملت مراسلة في واشنطن لبي بي سي وقدّمت برنامج «توداي» على إذاعة بي بي سي 4 من 2013 إلى 2024، ثم انتقلت إلى بلومبرغ نيوز، وألّفت كتاب «المهارات» (2018) ومذكرات عائلية بعنوان «خيوط ممزقة» (2024)."
  en: "British journalist and broadcaster, born in Northampton in 1973 to Pakistani parents. She was the BBC's Washington correspondent, presented Radio 4's Today programme from 2013 to 2024 before moving to Bloomberg News, and wrote The Skills (2018) and the family memoir Broken Threads (2024)."
  ur: "برطانوی صحافی اور نشریاتی پیش کار، جو 1973 میں نارتھیمپٹن میں پاکستانی والدین کے ہاں پیدا ہوئیں۔ بی بی سی کی واشنگٹن نمائندہ رہیں، 2013 سے 2024 تک ریڈیو 4 کے پروگرام «ٹوڈے» کی پیش کار رہیں، پھر بلومبرگ نیوز سے وابستہ ہوئیں؛ «دی اسکلز» (2018) اور خاندانی یادداشت «بروکن تھریڈز» (2024) کی مصنف ہیں۔"

