summary:
  ar: محمد بن أسعد بن محمد بن نصر بن حكيم، أبو المظفر الحكيمي، واعظ من فقهاء الحنفية، تفقه على الحسين بن محمد الرئيس وعلى أبي علي بن بنهان وغيرهما. درس بدمشق في مدرسة طرخان، ثم بنى له معين الدولة مدرسة درس فيها، ودرس أياما بالمدرسة الصادرية. من تصانيفه تفسير القرآن، وشرح المقامات الحريرية، وشرح شهاب الأخبار للقضاعي. وذكر المصدر أنه توفي سنة 567 هـ، وأن تاريخ ميلاده المذكور في العنوان سنة 484 هـ، وهو ما لم يتحقق من غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5488}
  en: Muhammad ibn As'ad ibn Muhammad ibn Nasr ibn Hakim, Abu al-Muzaffar al-Hakimi, known as Ibn Hakim, a Hanafi preacher. He studied with al-Husayn ibn Muhammad al-Ra'is and Abu Ali ibn Banhan among others. He taught at the Tarkhan school in Damascus, and Mu'in al-Dawla built him a school, where he taught; he also taught for some days at the Sadiriyya. His works include a Qur'an commentary, a commentary on the Maqamat of al-Hariri, and a commentary on Shihab al-Akhbar of al-Qudai. The book gives his death as 567 AH and the birth year 484 AH in its heading; these dates come from the book only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5488}
  ur: محمد بن اسعد بن محمد بن نصر بن حکیم، ابو المظفر الحکیمی، حنفی فقیہ اور واعظ۔ انہوں نے حسین بن محمد الرئیس اور ابو علی بن بنہان وغیرہ سے فقہ پڑھی۔ دمشق میں مدرسہ طرخان میں پڑھایا، پھر معین الدولہ نے ان کے لیے مدرسہ بنوایا جہاں درس دیا، اور صادریہ مدرسہ میں چند دن درس دیا۔ ان کی تصانیف میں قرآن کی تفسیر، مقامات حریری کی شرح، اور شہاب الاخبار کی شرح شامل ہیں۔ کتاب کے مطابق ان کی وفات 567 ہجری ہے، اور عنوان میں مذکور پیدائش 484 ہجری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5488}
