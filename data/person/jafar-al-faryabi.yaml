id: person/jafar-al-faryabi
class: person
label: { ar: "جعفر الفريابي قاضي الدينور", en: "Ja'far al-Faryabi", es: "Ja'far al-Faryabi", fr: "Ja'far al-Faryabi", ur: "جعفر الفریابی" }
roles: [judge, scholar]
gender: male
summary:
  ar: "أبو بكر القريابي قاضي الدينور، طاف البلاد شرقًا وغربًا في طلب العلم واقتفى الأعلام فسمع بخراسان وما وراء النهر واستوطن بغداد وحدّث عن هدية وابن المديني وبندار وأبي كريب وقتيبة وخلق كثير، روى عنه أبو الحسين بن المنادي وأحمد بن سلمان النجاد وأبو بكر الشافعي وكان ثقة حجة؛ وذكر أنه لما ورد بغداد استُقبل بالطيارات والزبازب ووُعد الناس إلى شارع المنار بباب الكوفة ليسمعوا منه فاجتمع خلق كثير {cite:muntazam-ibn-al-jawzi p. 210}."
  en: "Abu Bakr 'al-Qurayabi', qadi of Dinawar, who toured the lands east and west after the leading scholars — hearing across Khurasan and Transoxiana — then settled at Baghdad and transmitted from Ibn al-Madini, Bundar, Abu Kurayb and Qutayba. His arrival in Baghdad was met with planes and drums, crowds gathering at Bab al-Kufa to hear him {cite:muntazam-ibn-al-jawzi p. 210}."
  es: "Abu Bakr 'al-Qurayabi', cadí de Dinawar, recorrió las tierras de este a oeste siguiendo a los principales eruditos —escuchando en Jorasán y Transoxiana—, luego se estableció en Bagdad y transmitió de Ibn al-Madini, Bundar, Abu Kurayb y Qutayba. Su llegada a Bagdad fue recibida con aviones y tambores, y multitudes se congregaron en Bab al-Kufa para escucharlo {cite:muntazam-ibn-al-jawzi p. 210}."
  fr: "Abou Bakr al-Qurayabi, cadi de Dinawar, qui parcourut les terres d'Orient et d'Occident après les plus grands savants – écoutant les enseignements à travers le Khorasan et la Transoxiane – s'établit ensuite à Bagdad et transmit les enseignements d'Ibn al-Madini, Bundar, Abou Kurayb et Qutayba. Son arrivée à Bagdad fut accueillie par des avions et des tambours, et une foule se rassembla à Bab al-Koufa pour l'écouter (cf. Muntazam Ibn al-Jawzi, p. 210)."
  ur: "دیناور کے قادی ابوبکر 'القریابی'، جنہوں نے خراسان اور ٹرانسوکسیانا میں سرکردہ علماء کی سماعت کے بعد مشرق اور مغرب کا دورہ کیا - پھر بغداد میں آباد ہوئے اور ابن المدینی، بندر، ابو کریب اور قتیبہ سے منتقل ہوئے۔ ان کی بغداد آمد پر طیاروں اور ڈھولوں سے ملاقات ہوئی، باب الکوفہ پر ہجوم انہیں سننے کے لیے جمع ہو گیا۔ 210}۔"
  tr: "Dinur'un hakimi Ebu Bekir el-Kurebi, bilgi peşinde doğu ve batı boyunca ülkeyi dolaştı; önemli şahsiyetlerin izinden giderek Horasan ve Transoksiyana'dan dinledi, Bağdat'ta yerleşti ve Hadiye, İbn Medini, Bender, Ebu Kurayb, Qutaybah ve daha birçok kişiden rivayetler verdi. Ebu el-Hüseyin bin el-Manadi, Ahmed bin Salman el-Najad ve Ebu Bekir el-Şafii ondan rivayet etti, güvenilir ve kanıttı. Bağdat'a vardığında uçaklar ve el-Zebar tarafından karşılandığını, Kufe kapısındaki El-Manar Caddesi'ne kendisinden haber almak için insanlara söz verdiğini ve birçok kişinin toplandığını belirtti {atıf:Müntezem ibn al-Jawzi, s. 210}."
  id: "Abu Bakr al-Quraybi, hakim Dinur, menjelajahi tanah dari timur dan barat untuk mencari ilmu, mengikuti jejak tokoh-tokoh terkemuka, mendengar dari Khurasan dan Transoxiana, menetap di Baghdad, dan menceritakan dari Hadiyah, Ibn al-Madini, Bandar, Abu Kurayb, Qutaybah, dan banyak orang lainnya. Abu al-Husayn ibn al-Manadi, Ahmad ibn Salman al-Najad, dan Abu Bakr al-Shafi'i menceritakan darinya, dan ia dapat dipercaya serta menjadi bukti. Ia menyebutkan bahwa ketika tiba di Baghdad, ia disambut oleh pesawat dan al-Zabar, dan ia berjanji kepada orang-orang ke Jalan Al-Manar di gerbang Kufa untuk mendengar kabarnya, dan banyak orang berkumpul {cite:muntazam-ibn-al-jawzi, hlm. 210}."
