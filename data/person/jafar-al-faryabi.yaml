summary:
  ar: "أبو بكر القريابي قاضي الدينور، طاف البلاد شرقًا وغربًا في طلب العلم واقتفى الأعلام فسمع بخراسان وما وراء النهر واستوطن بغداد وحدّث عن هدية وابن المديني وبندار وأبي كريب وقتيبة وخلق كثير، روى عنه أبو الحسين بن المنادي وأحمد بن سلمان النجاد وأبو بكر الشافعي وكان ثقة حجة؛ وذكر أنه لما ورد بغداد استُقبل بالطيارات والزبازب ووُعد الناس إلى شارع المنار بباب الكوفة ليسمعوا منه فاجتمع خلق كثير {cite:muntazam-ibn-al-jawzi p. 210}."
  en: "Abu Bakr 'al-Qurayabi', qadi of Dinawar, who toured the lands east and west after the leading scholars — hearing across Khurasan and Transoxiana — then settled at Baghdad and transmitted from Ibn al-Madini, Bundar, Abu Kurayb and Qutayba. His arrival in Baghdad was met with planes and drums, crowds gathering at Bab al-Kufa to hear him {cite:muntazam-ibn-al-jawzi p. 210}."
