summary:
  ar: "مصلح وتربوي هندي مسلم، وُلد في دلهي سنة 1817 وتوفي في عليكرة سنة 1898. عمل في خدمة شركة الهند الشرقية قاضيا، وشهد تمرد 1857 فأنقذ أرواحا كثيرة، ثم أسس الجمعية العلمية سنة 1864 والكلية الشرقية الأنجلو-محمدية في عليكرة سنة 1875 التي صارت جامعة عليكرة الإسلامية، وكتب «أسباب الثورة الهندية» و«الخطبات الأحمدية»، ورائد فكرة الأمتين في الهند."
  en: "Indian Muslim reformer and educator, born in Delhi in 1817 and died at Aligarh in 1898. A judge in East India Company service, he saved many lives during the 1857 rebellion, then founded the Scientific Society (1864) and the Muhammadan Anglo-Oriental College at Aligarh (1875), which became Aligarh Muslim University; he wrote The Causes of the Indian Mutiny and the Khutbat-e-Ahmadiya, and pioneered the two-nation theory in India."
  ur: "ہندوستانی مسلمان مصلح اور ماہر تعلیم، جو 1817 میں دلی میں پیدا ہوئے اور 1898 میں علی گڑھ میں وفات پائی۔ ایسٹ انڈیا کمپنی کی عدلیہ میں منصب رہے، 1857 کی بغاوت میں کئی جانیں بچائیں، پھر سائنٹفک سوسائٹی (1864) اور علی گڑھ میں محمدن اینگلو اورینٹل کالج (1875) قائم کیا جو بعد میں علی گڑھ مسلم یونیورسٹی بنا؛ ان کی تصانیف میں «اسباب بغاوت ہند» اور «خطبات احمدیہ» شامل ہیں۔"
