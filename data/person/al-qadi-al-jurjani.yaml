roles: [scholar, qadi, jurist, poet]
gender: male
summary:
  ar: "القاضي أبو الحسن علي بن عبد العزيز الجرجاني، فقيه شافعي أديب شاعر، صاحب «الوساطة بين المتنبي وخصومه»، وتجعله إحدى روايتي ابن خلكان قاضي القضاة بالري ووفاته سنة 392 هـ، وتجعلها الأخرى سنة 366 هـ بنيسابور."
  en: "al-Qadi Abu al-Hasan Ali ibn Abd al-Aziz al-Jurjani, a Shafi'i jurist, man of letters and poet, author of al-Wasata bayna al-Mutanabbi wa-khusumih; one of Ibn Khallikan's two reports has him chief judge at Rayy, d. 392 AH, the other d. 366 AH in Nishapur."
  fr: "al-Qadi Abu al-Hasan Ali ibn Abd al-Aziz al-Jurjani, juriste chaféite, homme de lettres et poète, auteur d'al-Wasata bayna al-Mutanabbi wa-khusumih ; l'un des deux rapports d'Ibn Khallikan lui a donné le juge en chef à Rayy, décédé en 392 de l’hégire, l'autre mort en 366 de l’hégire à Nichapour."
  es: "al-Qadi Abu al-Hasan Ali ibn Abd al-Aziz al-Jurjani, jurista shafií, hombre de letras y poeta, autor de al-Wasata bayna al-Mutanabbi wa-khusumih; uno de los dos informes de Ibn Khallikan tiene su juez principal en Rayy, d. 392 AH, el otro d. 366 AH desde Nishapur."
  ur: "القادی ابو الحسن علی ابن عبد العزیز الجرجانی، ایک شافعی فقیہ، خطاط اور شاعر، الوصطہ بین المتنبی و خصومیہ کے مصنف؛ ابن خلیقان کی دو رپورٹوں میں سے ایک کے مطابق وہ رے میں چیف جج ہیں۔ 392ھ، دوسری وفات۔ نیشاپور میں 366ھ۔"
  tr: "Hakim Ebu el-Hasan Ali bin Abdülaziz el-Jurcani, Şafii bir hukukçu, yazar, şair ve 'El-Wasata Bayn el-Mutanabbi ve Rakipleri Arasındaki Arabuluculuk' adlı eserin yazarıdır. Bu eser, İbn Khallikan'ın Rayy'nin baş yargıcı olarak anlatımlarından biri olarak kabul edilir; 392 Hicri ve 366 Hicri'de Nişapur'da ölmüştür."
  id: "Hakim Abu al-Hasan Ali ibn Abdul Aziz al-Jurjani adalah seorang ahli hukum Shafi'i, penulis, penyair, dan penulis 'Al-Wasata Bayn al-Mutanabbi wa al-Awwaddim' (Mediasi Antara Al-Mutanabbi dan Para Penentangnya), yang dianggap sebagai salah satu narasi Ibn Khalliban sebagai hakim utama Rayy, yang meninggal pada tahun 392 H, dan satu lagi pada tahun 366 H. di Nishapur."
