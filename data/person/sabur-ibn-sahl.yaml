label: { ar: "سابور بن سهل", en: "Sabur Ibn Sahl" }
summary:
  ar: "سابور بن سهل صاحب بيمارستان جنديسابور وكان فاضلا عالما متقدما وله كتاب الأقراباذين المعمول عليه في البيمارستانات ودكاكين الصيادلة اثنان وعشرون بابا وكتاب قوى الأطعمة ومضارها ومنافعها، وتوفي سابور بن سهل وكان نصرانيا يوم الاثنين لتسع بقين من ذي الحجة سنة خمس وخمسين ومائتين {cite:fihrist-ibn-al-nadim p. 413}."
  en: "Sabur ibn Sahl — head of the Jundishapur hospital, author of the dispensatory used in every bimaristan {cite:fihrist-ibn-al-nadim}"
