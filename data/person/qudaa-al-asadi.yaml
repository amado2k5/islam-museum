  ar: قضاعة الأسدي
  en: Quda'a al-Asadi
  es: "Quda'a al-Asadi"
  fr: "Quda'a al-Asadi"
  ur: "قدعۃ الاسدی"
summary:
  ar: شاعر بايع لابن الزبير ثم نكث وقال دعا ابن مطيع للبياع فجثته إلى بيعة قلبي لها غير آلف فناولني خشناء لما لمستها بكفي ليست من أكف الخلائف {cite:muruj-al-dhahab p. 79}.
  en: The Asadi poet who swore and broke with Ibn al-Zubayr — 'Ibn Muti' called me to allegiance, kneeling to a bay'a my heart never knew' {cite:muruj-al-dhahab p. 79}.
  es: "El poeta asadi que juró y rompió con Ibn al-Zubayr: «Ibn Muti me llamó a la lealtad, arrodillándome ante un bay'a que mi corazón jamás conoció» {cita:muruj-al-dhahab p. 79}."
  fr: "Le poète Asadi qui a juré et rompu avec Ibn al-Zubayr — 'Ibn Muti' m'a appelé à l'allégeance, s'agenouillant devant un bay'a que mon cœur n'a jamais connu' {cite:muruj-al-dhahab p. 79}."
  ur: "اسدی شاعر جس نے ابن الزبیر سے قسم کھائی اور توڑ دیا - 'ابن مطی' نے مجھے بیعت کے لیے بلایا، بیعت کے لیے گھٹنے ٹیک کر میرا دل کبھی نہیں جانتا تھا''۔ 79}۔"
  tr: "Bir şair İbn el-Zubeyr'e bağlılık yemini etti, sonra sözünü bozdu ve şöyle dedi: İbn Muti' satıcıyı çağırdı ve bedeni kalbimle ona bin kez değil, rehin verdi, bu yüzden elimle dokunduğumda bana sert bir şey verdi, halifelerin elinden değil {atı:Muruj-al-Dhahab, s. 79}."
  id: "Seorang penyair bersumpah setia kepada Ibn al-Zubayr, lalu melanggar janjinya, berkata: Ibn Muti' memanggil penjual dan jasadnya dijamin kepadanya oleh hatiku, tidak seribu kali, jadi dia memberiku kasar saat aku menyentuhnya dengan tangan, bukan dari tangan khalifah {cite:muruj-al-dhahab, hlm. 79}."
