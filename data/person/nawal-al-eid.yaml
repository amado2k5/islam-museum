summary:
  ar: «أستاذة السنة وعلومها السعودية في جامعة الأميرة نورة بنت عبدالرحمن بالرياض، وداعية عُدّت من أبرز الداعيات في المملكة وخارجها، فازت بجائزة الأمير نايف العالمية للسنة النبوية عن بحثها في حقوق المرأة في ضوء السنة، وذكرت الأدبيات الأكاديمية أن متابعيها على تويتر تجاوزوا أربعة ملايين ونصفا، وأسّست وقف إثراء المعرفة في الرياض سنة 2012.»
  en: "A Saudi professor of the Sunnah and its sciences at Princess Nourah University in Riyadh, and a preacher counted among the most prominent women preachers in Saudi Arabia and beyond. She won the Prince Naif International Prize for the Prophet's Sunnah for her research on women's rights in the Sunnah; academic literature reports over four and a half million followers for her on Twitter, and she founded the Ithra' al-Ma'rifa endowment in Riyadh in 2012."
  ur: «ریاض کی شہزادی نورہ یونیورسٹی میں سنت اور اس کے علوم کی سعودی پروفیسر اور مبلغہ، جنہیں مملکت اور اس سے باہر کی نمایاں ترین خواتین مبلغات میں شمار کیا جاتا ہے۔ انہوں نے سنت کی روشنی میں خواتین کے حقوق پر اپنی تحقیق پر شہزاده نائف عالمی انعام برائے سنتِ نبوی جیتا؛ علمی ادب کے مطابق ٹوئٹر پر ان کے فالوورز ساڑھے چار ملین سے زیادہ تھے، اور انہوں نے 2012 میں ریاض میں وقف «إثراء المعرفة» قائم کیا۔»
