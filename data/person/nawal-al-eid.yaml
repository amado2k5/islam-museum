summary:
  ar: «أستاذة السنة وعلومها السعودية في جامعة الأميرة نورة بنت عبدالرحمن بالرياض، وداعية عُدّت من أبرز الداعيات في المملكة وخارجها، فازت بجائزة الأمير نايف العالمية للسنة النبوية عن بحثها في حقوق المرأة في ضوء السنة، وذكرت الأدبيات الأكاديمية أن متابعيها على تويتر تجاوزوا أربعة ملايين ونصفا، وأسّست وقف إثراء المعرفة في الرياض سنة 2012.»
  en: "A Saudi professor of the Sunnah and its sciences at Princess Nourah University in Riyadh, and a preacher counted among the most prominent women preachers in Saudi Arabia and beyond. She won the Prince Naif International Prize for the Prophet's Sunnah for her research on women's rights in the Sunnah; academic literature reports over four and a half million followers for her on Twitter, and she founded the Ithra' al-Ma'rifa endowment in Riyadh in 2012."
  ur: «ریاض کی شہزادی نورہ یونیورسٹی میں سنت اور اس کے علوم کی سعودی پروفیسر اور مبلغہ، جنہیں مملکت اور اس سے باہر کی نمایاں ترین خواتین مبلغات میں شمار کیا جاتا ہے۔ انہوں نے سنت کی روشنی میں خواتین کے حقوق پر اپنی تحقیق پر شہزاده نائف عالمی انعام برائے سنتِ نبوی جیتا؛ علمی ادب کے مطابق ٹوئٹر پر ان کے فالوورز ساڑھے چار ملین سے زیادہ تھے، اور انہوں نے 2012 میں ریاض میں وقف «إثراء المعرفة» قائم کیا۔»
  es: "Profesora saudí de la Sunna y sus ciencias en la Universidad Princesa Nourah de Riad, y una de las predicadoras más destacadas de Arabia Saudí y del extranjero. Ganó el Premio Internacional Príncipe Naif a la Sunna del Profeta por su investigación sobre los derechos de la mujer en la Sunna; la literatura académica indica que cuenta con más de cuatro millones y medio de seguidores en Twitter, y fundó la fundación Ithra' al-Ma'rifa en Riad en 2012."
  fr: "Professeure saoudienne de Sunna et de sciences sunnites à l'Université Princesse Nourah de Riyad, elle est également une prédicatrice reconnue comme l'une des plus influentes d'Arabie saoudite et à l'étranger. Elle a reçu le Prix international Prince Naif pour la Sunna du Prophète pour ses recherches sur les droits des femmes dans la Sunna. La littérature académique recense plus de quatre millions et demi d'abonnés sur Twitter, et elle a fondé la fondation Ithra' al-Ma'rifa à Riyad en 2012."
  tr: "\"Riyad'daki Prenses Nourah bint Abdulrahman Üniversitesi'nde Suudi Bilimleri ve Sünnet Profesörü ve Krallık'ta ve yurtdışında en önde gelen vaizlerden biri olarak kabul edilen bir vaiz, Sünnet ışığında kadın hakları üzerine yaptığı araştırmalarla Prens Nayef Uluslararası Peygamberlik Sünnet Ödülü'nü kazanmıştır. Akademik literatür, Twitter takipçilerinin dört buçuk milyonu aştığını ve 2012'de Riyad'da Bilgi Zenginleştirme Vakfı'nı kurduğunu belirtmiştir.\""
  id: "\"Profesor Sunnah dan Ilmu Saudinya di Universitas Princess Nourah bint Abdulrahman di Riyadh, dan seorang pengkhotbah yang dianggap sebagai salah satu pengkhotbah paling terkemuka di Kerajaan dan luar negeri, yang memenangkan Penghargaan Internasional Prince Nayef untuk Sunnah Nabi atas penelitiannya tentang hak-hak perempuan dalam konteks Sunnah. Literatur akademik menyatakan bahwa pengikutnya di Twitter melebihi empat setengah juta, dan dia mendirikan Endowment of Knowledge Endowment di Riyadh pada tahun 2012.\""
