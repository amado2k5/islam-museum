summary:
  ar: "من عمال النبي على اليمن عند البلاذري: قال بعضهم إنه ولّاه صنعاء فقُبض وهو عليها، وقال آخرون إنما ولّاه إياها أبو بكر، وقال هشام بن الكلبي والهيثم بن عدي إن النبي ولّاه كِندة والصَّدِف؛ ثم هو في كتاب أبي بكر من قادة حروب الردة باليمن."
  en: "One of the Prophet's agents in Yemen in al-Baladhuri: some say he appointed him over San'a where he died in office, others that Abu Bakr appointed him there, while Hisham ibn al-Kalbi and al-Haytham ibn Adi give him Kinda and al-Sadif from the Prophet; he then appears in Abu Bakr's dispatch among the commanders of the Ridda war in Yemen."
  fr: "L'un des agents du Prophète au Yémen à al-Baladhuri : certains disent qu'il l'a nommé sur San'a où il est mort en fonction, d'autres qu'Abou Bakr l'a nommé là, tandis que Hisham ibn al-Kalbi et al-Haytham ibn Adi lui donnent Kinda et al-Sadif du Prophète ; Il apparaît alors dans la dépêche d'Abou Bakr parmi les commandants de la guerre de Ridda au Yémen."
  ur: "بلاذری کے مطابق یمن میں نبی کے عاملوں میں سے؛ بعض کہتے ہیں انہیں صنعاء کا عامل بنایا گیا جہاں وہ عہدے پر فوت ہوا، بعض کہتے ہیں ابو بکر نے بنایا۔"
  es: "En al-Baladhuri se menciona a uno de los agentes del Profeta en Yemen: algunos dicen que lo nombró jefe de Saná, donde murió en el cargo; otros afirman que Abu Bakr lo designó allí, mientras que Hisham ibn al-Kalbi y al-Haytham ibn Adi le atribuyen Kinda y al-Sadif, enviados por el Profeta; posteriormente, aparece en el despacho de Abu Bakr entre los comandantes de la guerra de Ridda en Yemen."
  tr: "El-Baladhuri'ye göre Peygamber'in Yemen üzerindeki ajanları arasında: Bazıları onu Sana'a atadığını söyledi, ancak oradayken yakalandı. Diğerleri ise Ebu Bekir'in onu oraya atadığını söyledi. Hisam ibn el-Kalbi ve el-Haytham ibn Adi, Peygamber'in onu Kinda ve El-Sadaf olarak atadığını söyledi; sonra Ebu Bekir'in kitabında, Yemen'deki dinden dönme savaşlarının liderleri arasında anılır."
  id: "Di antara agen Nabi atas Yaman menurut Al-Baladhuri: Beberapa mengatakan dia menunjuknya ke Sana'a, tetapi dia ditangkap saat itu masih di sana. Yang lain mengatakan Abu Bakr yang menunjuknya di sana. Hisham ibn al-Kalbi dan al-Haytham ibn Adi mengatakan Nabi mengangkatnya sebagai Kinda dan Al-Sadaf; kemudian dalam kitab Abu Bakr, dia disebutkan sebagai salah satu pemimpin perang murtad di Yaman."
