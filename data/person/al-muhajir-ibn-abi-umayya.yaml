summary:
  ar: "من عمال النبي على اليمن عند البلاذري: قال بعضهم إنه ولّاه صنعاء فقُبض وهو عليها، وقال آخرون إنما ولّاه إياها أبو بكر، وقال هشام بن الكلبي والهيثم بن عدي إن النبي ولّاه كِندة والصَّدِف؛ ثم هو في كتاب أبي بكر من قادة حروب الردة باليمن."
  en: "One of the Prophet's agents in Yemen in al-Baladhuri: some say he appointed him over San'a where he died in office, others that Abu Bakr appointed him there, while Hisham ibn al-Kalbi and al-Haytham ibn Adi give him Kinda and al-Sadif from the Prophet; he then appears in Abu Bakr's dispatch among the commanders of the Ridda war in Yemen."
  ur: "بلاذری کے مطابق یمن میں نبی کے عاملوں میں سے؛ بعض کہتے ہیں انہیں صنعاء کا عامل بنایا گیا جہاں وہ عہدے پر فوت ہوا، بعض کہتے ہیں ابو بکر نے بنایا۔"
