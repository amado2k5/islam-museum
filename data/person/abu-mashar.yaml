id: person/abu-mashar
class: person
label: { ar: "أبو معشر", en: "Abu Ma'shar" }
summary:
  ar: "أبو معشر صاحب كتاب المدخل الكبير إلى علم النجوم، ذكره المسعودي في وصف الكواكب وصورها عند ظهورها، ومنه ما نقل عن طائفة من الهند أن تماثيل وأشخاصاً تظهر في الصحارى عند طلوع حامل رأس الغول فيسميها العوام غولاً {cite:muruj-al-dhahab p. 470}. قال ابن النديم هو أبو معشر جعفر بن محمد البلخي وكان أولا من أصحاب الحديث ومنزله في الجانب الغربي بباب خراسان وكان يضاغن الكندي ويغري به العامة ويشنّع عليه بعلوم الفلاسفة فدس عليه الكندي من حسّن له النظر في علوم الحساب والهندسة فدخل في ذلك فلم يكمل له ثم عدل إلى علم أحكام النجوم وانقطع شره عن الكندي، ويقال إنه تعلم النجوم بعد سبع وأربعين سنة من عمره وكان فاضلا حسن الإصابة، وضربه المستعين أسواطا لأنه أصاب في شيء أخبره يكونه قبل وقته فكان يقول أصبت فعوقبت، وتوفي وقد جاوز المائة يوم الأربعاء لليلتين بقيتا من شهر رمضان سنة اثنتين وسبعين ومائتين {cite:fihrist-ibn-al-nadim p. 386-387}"
  en: "The astrologer whose Great Introduction to the science of the stars al-Mas'udi cites on the forms the constellations show at their rising — including the 'bearer of the ghul's head' whose phantoms common folk call ghuls {cite:muruj-al-dhahab p. 470}."
