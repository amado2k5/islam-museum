summary:
  ar: "بطاقة أولية لله وردي خان الجرجي، عامل فارس والقائد الصفوي الذي أعاد بناء الجيش بمدفعية إنكلترا وأنشأ جسر الله وردي خان بأصفهان، توفي سنة ١٦١٣م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Allahverdi Khan the Georgian, Shah Abbas I's commander-in-chief who rebuilt the Safavid army and raised the Allahverdi Khan (Si-o-se-pol) bridge at Isfahan, d. 1613; the biographical entry is not yet checked on the page."
  es: "Ficha de reclutamiento de Allahverdi Khan el Georgiano, comandante en jefe del Shah Abbas I, quien reconstruyó el ejército safávida y levantó el puente Allahverdi Khan (Si-o-se-pol) en Isfahán, fallecido en 1613; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Carte de conscription d'Allahverdi Khan le Géorgien, commandant en chef du Shah Abbas Ier qui a reconstruit l'armée safavide et fait construire le pont Allahverdi Khan (Si-o-se-pol) à Ispahan, mort en 1613; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "اللہ وردی خان جارجیائی، شاہ عباس اول کے کمانڈر انچیف کے لیے ڈرافٹ کارڈ جس نے صفوی فوج کو دوبارہ تعمیر کیا اور اصفہان میں اللہ وردی خان ⁦(سی-او-سی-پول)⁩ پل کو بلند کیا۔ 1613; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Orduyu İngiliz topçusuyla yeniden inşa eden ve İsfahan'da Allah Wardi Han Köprüsü'nü kuran Pers valisi ve Safevi komutanı Allah Wardi Han el-Jurji'nin ön kartı 1613 yılında vefat etti; önemli şahsiyetlerin sözlüklerinde anılır ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Allah Wardi Khan al-Jurji, seorang gubernur Persia dan komandan Safawiyah yang membangun kembali tentara dengan artileri Inggris dan mendirikan Jembatan Allah Wardi Khan di Isfahan, meninggal pada tahun 1613 M; ia dikenang dalam kamus tokoh-tokoh terkenal dan terjemahannya belum pernah diulas di halaman tersebut."
