summary:
  ar: "كاتب فارسي من عائلة أبي طاهر للفخار بكاشان، ألّف نحو 700هـ/1301م رسالة «عرائس الجواهر ونفائس الأطايب» التي حفظت صيغة الفخار الفريتي ⁦(الحجر الصلصالي)⁩ — أقدم توثيق تقني مكتوب لها {cite:lane-early-islamic-pottery-1947}."
  en: "Persian writer of Kashan's Abu Tahir potters' family who composed c. 700/1301 the treatise Arayis al-jawahir wa-nafayis al-atayib preserving the fritware ⁦(stonepaste)⁩ recipe — its earliest written technical documentation {cite:lane-early-islamic-pottery-1947}."
  ur: "کاشان کے ابو طاہر سفال گر خاندان کا فارسی مصنف جس نے تقریباً700ھ/1301ء رسالہ «عرائس الجواہر و نفائس الاطائب» لکھا جس میں فریٹویئر ⁦(سٹون پیسٹ)⁩ کی ترکیب محفوظ ہے — اس کی قدیم ترین تحریری تکنیکی دستاویز {cite:lane-early-islamic-pottery-1947}۔"
  es: "Escritor persa de la familia de alfareros Abu Tahir de Kashan que compuso hacia el año 700/1301 el tratado Arayis al-jawahir wa-nafayis al-atayib que conserva la receta de la frita (pasta de piedra), su documentación técnica escrita más antigua {cite:lane-early-islamic-pottery-1947}."
  fr: "Écrivain persan de la famille de potiers Abu Tahir de Kashan qui a composé vers 700/1301 le traité Arayis al-jawahir wa-nafayis al-atayib préservant la recette de la fritte (pâte de pierre) — sa plus ancienne documentation technique écrite {cite:lane-early-islamic-pottery-1947}."
  tr: "Kaşan'daki Ebu Tahir çömlekçi ailesinden bir Pers yazar, Hicri 700/Miladi 1301 civarında, Part çömlekçiliğinin (kil taşı) formülünü koruyan \"Mücevherlerin ve Değerli Lezzetlerin Gelinleri\" adlı risaleyi kaleme almıştır; bu, Part çömlekçiliğine dair en eski yazılı teknik belgedir {cite:lane-early-islamic-pottery-1947}."
  id: "Seorang penulis Persia dari keluarga pembuat tembikar Abu Tahir di Kashan, sekitar tahun 700 H/1301 M, menulis risalah “Pengantin Permata dan Makanan Lezat” yang melestarikan formula untuk tembikar Parthia (batu lempung) — dokumentasi teknis tertulis tertua tentangnya {cite:lane-early-islamic-pottery-1947}."
