summary:
  ar: "صاحب كتاب الأغاني؛ قال المهلبي إنه جمعه في خمسين سنة ولم يكتب في عمره إلا مرة واحدة بخطه، وتوفي سنة ست وخمسين وثلاث مئة {cite:kashf-zunun-furqan p. 527}."
  en: "Abu l-Faraj Ali b. al-Husayn al-Isfahani, author of the Aghani — fifty years of gathering and a single lifetime autograph; he died in 356 {cite:kashf-zunun-furqan p. 527}."
  fr: "Abu l-Faraj Ali b. al-Husayn al-Isfahani, auteur des Aghani — cinquante années de collecte et un seul autographe de son vivant ; il mourut en 356 {cite:kashf-zunun-furqan p. 527}."
  es: "Abu al-Faraj Ali b. al-Husayn al-Isfahani, autor de El Aghani: Cincuenta años de reunión y un único autógrafo de toda una vida; murió en 356 {cita: kashf-zunun-furqan p. 527}."
  ur: "ابو الفراج علی ب۔ الحسین اصفہانی، دی آغانی کے مصنف - پچاس سال کے اجتماع اور ایک سنگل لائف ٹائم آٹوگراف؛ ان کی وفات 356ھ میں ہوئی۔ 527}۔"
  tr: "Şiirler Kitabı'nın yazarı El-Muhallabi, bu eseri elli yıldan fazla bir sürede derlediğini ve ömrü boyunca sadece bir kez kendi el yazısıyla yazdığını, Hicri 356 yılında vefat ettiğini söylemiştir. {Kaynak: Kashf-Zunun-Furqan, s. 527}."
  id: "Penulis Kitab Nyanyian, Al-Muhallabi, mengatakan bahwa ia menyusunnya selama lebih dari lima puluh tahun dan hanya menulisnya sekali seumur hidupnya dengan tulisan tangannya sendiri, dan ia meninggal pada tahun 356 H {cite:kashf-zunun-furqan p. 527}."
