id: person/al-mutamid-ibn-abbad
class: person
label: { ar: "المعتمد بن عباد" }
summary:
  ar: "أبو القاسم المعتمد على الله محمد بن عباد بن إسماعيل اللخمي، آخر ملوك بني عباد بإشبيلية وأشهر ملوك الطوائف شعراً؛ عند المقري عن ابن الفتح أنه لما دخل المرابطون إشبيلية خرج والموت يتسعر في ألحاظه فلقيهم برحبة القصر فحمل فيهم حملة صيرتهم فرقاً وملأتهم فرقاً حتى أوردهم النهر ثم انصرف إلى قصره فنُزِل منه بالقسر إلى قبضة الأسر فقُيد للحين، فلما قُيدت قدماه قال يخاطب السلسلة «إليك فلو كانت قيودك أسعرت تضرّم منها كل كف ومعصم» ولما آلمه عضّها قال «إنما أنت درة للمعالي ركب الدهر فوقها أصدافا»، وسُجن بأغمات فقالت له اعتماد الرميكية «يا سيدي لقد هُنا هنا» فقال «قالت لقد هُنا هنا مولاي أين جاهنا قلت لما إلهنا صيرنا إلى هنا»، وطلب من حواء بنت تاشفين خباءً عارية فاعتذرت بأنه ليس عندها خياط فقال «هم أوقدوا بين جوانحك نارا أطالوا بها في حشاك استعارا»، وبقي مأسوراً بأغمات ولما بلغ خبر ابنه عبد الجبار إلى ابن تاشفين أمر بتثقال المعتمد في الحديد فقال «قيدي أما تعلمني مسلماً أبيت أن تشفقي أو ترحما»، ومات بها وقبره بمقبرة أغمات يزار، زاره لسان الدين ابن الخطيب والمقري نفسه سنة ١٠١٠ {cite:nafh-tib-maqqari p. 216-218}."
  en: "Muhammad ibn Abbad al-Mu'tamid, last Abbadid king of Seville and the most celebrated poet-king of the Taifas: he charged the Almoravids at the palace square, was dragged to captivity and chained — composing his famous verses to the fetter itself — then imprisoned at Aghmat where he died; his grave there was visited by Ibn al-Khatib and al-Maqqari {cite:nafh-tib-maqqari p. 216-218}."
