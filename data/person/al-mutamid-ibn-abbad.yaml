id: person/al-mutamid-ibn-abbad
class: person
label: { ar: "المعتمد بن عباد", en: "al-Mu'tamid ibn Abbad", fr: "al-Mu'tamid ibn Abbad", es: "al-Mu'tamid ibn Abbad", ur: "المتمید ابن عباد" }
summary:
  ar: "أبو القاسم المعتمد على الله محمد بن عباد بن إسماعيل اللخمي، آخر ملوك بني عباد بإشبيلية وأشهر ملوك الطوائف شعراً؛ عند المقري عن ابن الفتح أنه لما دخل المرابطون إشبيلية خرج والموت يتسعر في ألحاظه فلقيهم برحبة القصر فحمل فيهم حملة صيرتهم فرقاً وملأتهم فرقاً حتى أوردهم النهر ثم انصرف إلى قصره فنُزِل منه بالقسر إلى قبضة الأسر فقُيد للحين، فلما قُيدت قدماه قال يخاطب السلسلة «إليك فلو كانت قيودك أسعرت تضرّم منها كل كف ومعصم» ولما آلمه عضّها قال «إنما أنت درة للمعالي ركب الدهر فوقها أصدافا»، وسُجن بأغمات فقالت له اعتماد الرميكية «يا سيدي لقد هُنا هنا» فقال «قالت لقد هُنا هنا مولاي أين جاهنا قلت لما إلهنا صيرنا إلى هنا»، وطلب من حواء بنت تاشفين خباءً عارية فاعتذرت بأنه ليس عندها خياط فقال «هم أوقدوا بين جوانحك نارا أطالوا بها في حشاك استعارا»، وبقي مأسوراً بأغمات ولما بلغ خبر ابنه عبد الجبار إلى ابن تاشفين أمر بتثقال المعتمد في الحديد فقال «قيدي أما تعلمني مسلماً أبيت أن تشفقي أو ترحما»، ومات بها وقبره بمقبرة أغمات يزار، زاره لسان الدين ابن الخطيب والمقري نفسه سنة ١٠١٠ {cite:nafh-tib-maqqari p. 216-218}."
  en: "Muhammad ibn Abbad al-Mu'tamid, last Abbadid king of Seville and the most celebrated poet-king of the Taifas: he charged the Almoravids at the palace square, was dragged to captivity and chained — composing his famous verses to the fetter itself — then imprisoned at Aghmat where he died; his grave there was visited by Ibn al-Khatib and al-Maqqari {cite:nafh-tib-maqqari p. 216-218}."
  fr: "Muhammad ibn Abbad al-Mu'tamid, dernier roi abbadide de Séville et le plus célèbre des poètes-roi des Taifas : il a chargé les Almoravides sur la place du palais, a été traîné en captivité et enchaîné - composant ses célèbres versets à la chaîne elle-même - puis emprisonné à Aghmat où il est mort ; Sa tombe a été visitée par Ibn al-Khatib et al-Maqqari {cite:nafh-tib-maqqari p. 216-218}."
  es: "Muhammad ibn Abbad al-Mu'tamid, último rey abbadí de Sevilla y el rey poeta más célebre de las Taifas: cargó contra los almorávides en la plaza del palacio, fue arrastrado al cautiverio y encadenado —componiendo sus famosos versos en el propio grillete— y luego encarcelado en Aghmat, donde murió; su tumba allí fue visitada por Ibn al-Khatib y al-Maqqari {cite:nafh-tib-maqqari p. 216-218}."
  ur: "محمد بن عباد المتمید، سیویل کا آخری عباد بادشاہ اور طائفس کا سب سے مشہور شاعر بادشاہ: اس نے محل کے چوک پر الموراوڈز پر الزام لگایا، اسے گھسیٹ کر قید کر دیا گیا اور زنجیروں میں جکڑا گیا- اس کی مشہور آیات خود بیڑی میں لکھیں- پھر اخمت میں قید کر دیا گیا جہاں اس کی موت ہو گئی۔ ابن الخطیب اور المقری نے وہاں ان کی قبر کی زیارت کی تھی۔ 216-218}۔"
  tr: "Sevilla'daki Banu Abbad'ın son kralı ve şiirde en ünlü Taifa kralı olan Ebu al-Kasım el-Mu'temed 'ala Allah Muhammed ibn Abbad ibn İsmail el-Lakhmi, İbn el-Feth'ten şöyle anlatmıştır: Almoravidler Sevilla'ya girdiğinde gözünün önünde ölüm gönlüsünde ayrılmıştır. Onları sarayın avlusunda karşılamış, onları bölen ve bölmelerle dolduran bir yük taşımış, nehir onları ona getirene kadar taşımıştır. Sonra sarayına dönmüş ve zorla esaretin pençesine inmiş ve geçici olarak esir alınmıştır. Ayakları bağlandığında zincire şöyle dedi: \"Eğer zincirlerin koparsa, her elin onlar tarafından yakar.\" Ve bir bileği.\" Yaralanınca onu ısırdı ve dedi ki, \"Sen sadece soyluluğun incisisin, zamanın üzerinde kabuklara bindiğin.\" Agmat'ta hapsedildi ve İtimad el-Ramakiyya ona, \"Efendim, geldik,\" dedi. O dedi ki, \"O dedi ki, 'İşte buradayız, efendim, neredeyiz buradayız?\" Ben dedim, 'Tanrımız neden buraya geldi?' Eve bint Tashfin'den çıplak bir saklanma yeri istedi, o da terzi olmadığını söyledi. O dedi ki, \"Kanatlarının arasına ateş yaktılar ve rahminde bir metafor olarak uzattılar.\" O da Aghmat'ta esir kaldı ve haber oğluna ulaştığında oğluna ulaştı Taşfin, El-Mu'tamid'in El-Hadid'de takviye edilmesini emretti ve şöyle dedi: \"Esirim, bana merhamet göstermeyi reddettiğini ya da merhametten dolayı bir Müslümana öğretmiyor musun?\" Orada öldü ve Ağmat Yazar mezarlığına defnedildi. Lisan el-Din İbn el-Hatib ve el-Makqari kendisi 1010 yılında onu ziyaret etti {atıf:nafh-tib-maqqari, s. 216-218}."
  id: "Abu al-Qasim al-Mu'tamad 'ala Allah Muhammad ibn Abbad ibn Ismail al-Lakhmi, raja terakhir Banu Abbad di Sevilla dan raja Taifa paling terkenal dalam puisi, menceritakan dari Ibn al-Fath bahwa ketika Almoravid memasuki Seville, ia pergi dengan kematian di hadapannya. Ia bertemu mereka di halaman istana, di mana ia memikul beban yang memecah belah mereka dan memenuhi mereka dengan perpecahan hingga sungai membawa mereka kepadanya. Kemudian ia kembali ke istana dan turun dengan paksa ke dalam tahanan, di mana ia sementara ditangkap. Ketika kakinya diikat, ia berkata kepada rantai itu: \"Kepada kamu, jika rantaimu dicabik, setiap tangan akan terbakar oleh rantai itu.\" Dan pergelangan tangan.\" Ketika dia terluka, dia menggigitnya dan berkata, \"Kau hanyalah mutiara bangsawan, yang telah ditunggangi oleh cangkang yang ditunggangi waktu itu.\" Dia dipenjara di Aghmat, dan Itimad al-Ramakiyya berkata kepadanya, \"Tuan, kami sudah di sini.\" Dia berkata, \"Dia berkata, 'Di sinilah kita, tuanku, di mana kita di sini?' Aku berkata, 'Mengapa Tuhan kita datang ke sini?' Dia meminta Hawa bint Tashfin untuk bersembunyi telanjang, dan dia meminta izin karena tidak memiliki penjahit. Dia berkata, \"Mereka menyalakan api di antara sayapmu dan meregangkannya di dalam rahimmu sebagai metafora.\" Dia tetap menjadi tawanan di Aghmat, dan ketika kabar itu sampai kepada putranya Abd al-Jabbar Tashfin memerintahkan penguatan Al-Mu'tamid di Al-Hadid, dengan berkata, \"Tawananku, tidakkah kau mengajarkan aku sebagai Muslim bahwa kau menolak menunjukkan belas kasihan atau karena belas kasihan?\" Ia meninggal di sana dan dimakamkan di pemakaman Aghmat Yazar. Lisan al-Din Ibn al-Khatib dan al-Maqqari sendiri mengunjunginya pada tahun 1010 {cite:nafh-tib-maqqari, hlm. 216-218}."
