summary:
  en: "A righteous Companion and veteran warrior from Banu Sulaym assigned to travel behind the army to collect dropped luggage; when he found Aisha left behind at al-Muraysi', he recognized her, lowered his camel without uttering a word beyond 'Inna lillahi wa-inna ilayhi raji'un', and safely escorted her to Medina; he was martyred during the Armenian conquests."
  ar: "صحابي جليل وفارس بدري من بني سليم؛ كان النبي يجعله على ساقة الجيش يتبع الساقط من متاعهم، فوجد أم المؤمنين عائشة في حادثة الإفك فأناخ راحلته وقادها مكرماً لها ولم يكلمها كلمة واحدة إلا استرجاعه، فشهد الله ببراءتهما في سورة النور؛ واستشهد في فتوح أرمينية."
