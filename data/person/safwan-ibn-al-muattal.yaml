summary:
  en: "A righteous Companion and veteran warrior from Banu Sulaym assigned to travel behind the army to collect dropped luggage; when he found Aisha left behind at al-Muraysi', he recognized her, lowered his camel without uttering a word beyond 'Inna lillahi wa-inna ilayhi raji'un', and safely escorted her to Medina; he was martyred during the Armenian conquests."
  ar: "صحابي جليل وفارس بدري من بني سليم؛ كان النبي يجعله على ساقة الجيش يتبع الساقط من متاعهم، فوجد أم المؤمنين عائشة في حادثة الإفك فأناخ راحلته وقادها مكرماً لها ولم يكلمها كلمة واحدة إلا استرجاعه، فشهد الله ببراءتهما في سورة النور؛ واستشهد في فتوح أرمينية."
  ur: "بنو سلیم کے صحابی، جو لشکر کے پیچھے رہ کر گرا ہوا سامان جمع کرتے تھے؛ واقعۂ افک اور بعد کی جزیرہ و آرمینیا کی مہمات میں ان کا ذکر آتا ہے۔ {cite:mubarakpuri-raheeq}"
  es: "Un Compañero justo y veterano guerrero de Banu Sulaym, asignado para viajar detrás del ejército a recoger el equipaje perdido, encontró a Aisha abandonada en al-Muraysi', la reconoció, bajó su camello sin pronunciar más que 'Inna lillahi wa-inna ilayhi raji'un' y la escoltó sana y salva hasta Medina; murió como mártir durante las conquistas armenias."
  fr: "Un Compagnon vertueux et guerrier vétéran des Banu Sulaym, chargé de suivre l'armée pour récupérer les bagages abandonnés, découvrit Aisha laissée à al-Muraysi'. La reconnaissant, il descendit son chameau sans prononcer un mot autre que « Inna lillahi wa-inna ilayhi raji'un » et l'escorta saine et sauve jusqu'à Médine. Il fut martyrisé lors des conquêtes arméniennes."
