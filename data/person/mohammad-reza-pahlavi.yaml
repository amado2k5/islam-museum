summary:
  ar: "محمد رضا بهلوي (1919–1980)، آخر شاهات إيران، ملك من 1941 حتى أطاحت به الثورة الإيرانية سنة 1979. ابن رضا شاه ومؤسس الدولة البهلوية، قاد برنامج «الثورة البيضاء» للإصلاح واعتمد على النفط وحلفه مع الولايات المتحدة، ثم غادر إيران في كانون الثاني 1979 وتنقّل بين بلدان عدة قبل أن يموت في القاهرة في 27 تموز 1980 ويُدفن في مسجد الرفاعي."
  en: "Mohammad Reza Pahlavi (1919–1980) was the last shah of Iran, reigning from 1941 until the Iranian Revolution overthrew him in 1979. The son of Reza Shah, founder of the Pahlavi state, he pursued the White Revolution reforms on the strength of oil revenues and the American alliance, left Iran in January 1979, moved between several countries in exile, and died in Cairo on 27 July 1980; he is buried in the al-Rifa'i Mosque there."
  ur: "محمد رضا پہلوی (1919ء–1980ء) ایران کے آخری شاہ تھے، 1941ء سے 1979ء میں انقلابِ ایران کے ہاتھوں معزولی تک حکمران رہے۔ وہ پہلوی ریاست کے بانی رضا شاہ کے بیٹے تھے، انہوں نے «سفید انقلاب» کی اصلاحات چلائیں، جنوری 1979ء میں ایران چھوڑا، کئی ملکوں میں جلاوطنی گزاری اور 27 جولائی 1980ء کو قاہرہ میں وفات پائی؛ وہ وہیں مسجد الرفاعی میں مدفون ہیں۔"
