summary:
  ar: "عالم قرآن إندونيسي من ريمبانج بجاوة الوسطى، وُلد في 29 سبتمبر 1970 ويُعرف بغوس باها. يدير معهد «ل ب 3 ي أ» لتحفيظ القرآن في ناروكان بريمبانج منذ وفاة أبيه سنة 2005، وعُيّن سنة 2022 في رئاسة الشورى ⁦(المجلس الأعلى)⁩ لنهضة العلماء، ويشتهر بقراءاته الدقيقة للقرآن والنصوص الكلاسيكية؛ وليست له قناة شخصية رسمية، إذ تصل تسجيلات دروسه إلى جمهور واسع عبر قنوات مجتمعية تنشرها."
  en: "Indonesian Qur'an scholar from Rembang, Central Java, born on 29 September 1970 and widely known as Gus Baha. He has led the LP3IA Tahfidzul Qur'an pesantren at Narukan, Rembang, since his father's death in 2005, was appointed a Rais Syuriyah (leader of the supreme council) of Nahdlatul Ulama in 2022, and is known for close readings of the Qur'an and the classical texts; he keeps no official personal channel, and recordings of his studies reach a wide audience through community channels that carry them."
  ur: "انڈونیشی عالمِ قرآن، جو 29 ستمبر 1970ء کو وسطی جاوا کے ریمبانگ میں پیدا ہوئے اور «گس باہا» کے نام سے مشہور ہیں۔ وہ 2005ء میں والد کی وفات کے بعد سے ناروکان، ریمبانگ کے مدرسۂ تحفیظ القرآن «ایل پی 3 آئی اے» کے نگران ہیں، 2022ء میں نہضۃ العلماء کی مجلسِ شوریٰ (رائس شوریٰ) میں مقرر ہوئے، اور قرآن و کلاسیکی نصوص کے باریک بینی مطالعے سے جانے جاتے ہیں؛ ان کا کوئی سرکاری ذاتی چینل نہیں، ان کے دروس کی ریکارڈنگز سماجی چینلوں کے ذریعے وسیع سامعین تک پہنچتی ہیں۔"
