summary:
  ar: "محمد بن خلف بن حيان بن صدقة الضبي، أبو بكر، الملقب بوكيع القاضي، قاض وباحث عالم بالتأريخ والبلدان، ولي قضاء الأهواز وتوفي ببغداد سنة 306 هـ، من مصنفاته «أخبار القضاة وتواريخهم» و«الطريق» و«الشريف» و«الأنواء» {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 114-115} {cite:shadharat-dhahab vol. 4 p. 33} {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 3 pp. 36-37}."
  en: "Muhammad ibn Khalaf ibn Hayyan ibn Sadaqa al-Dabbi, Abu Bakr, surnamed Waki', a judge and researcher learned in history and geography, who held the judgeship of al-Ahwaz and died in Baghdad in 306 AH (918 CE); among his works are Akhbar al-Qudat wa-Tawarikhuhum, al-Tariq, al-Sharif and al-Anwa' {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 114-115} {cite:shadharat-dhahab vol. 4 p. 33} {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 3 pp. 36-37}."
  es: "Muhammad ibn Khalaf ibn Hayyan ibn Sadaqa al-Dabbi, Abu Bakr, de apellido Waki', juez e investigador versado en historia y geografía, que ocupó el cargo de juez de al-Ahwaz y murió en Bagdad en 306 AH (918 EC); entre sus obras se encuentran Akhbar al-Qudat wa-Tawarikhuhum, al-Tariq, al-Sharif y al-Anwa' {cita:alam-zirikli-dar-al-ilm-2002 vol. 6 págs. 114-115} {cita: shadharat-dhahab vol. 4p. 33} {citar:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 3 págs. 36-37}."
  fr: "Muhammad ibn Khalaf ibn Hayyan ibn Sadaqa al-Dabbi, Abu Bakr, surnommé Waki', juge et chercheur érudit en histoire et géographie, qui occupa le poste de juge d'al-Ahwaz et mourut à Bagdad en 306 AH (918 CE); parmi ses œuvres figurent Akhbar al-Qudat wa-Tawarikhuhum, al-Tariq, al-Sharif et al-Anwa' {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 114-115} {cite: shadharat-dhahab vol. 16 heures. 33} {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 3 p. 36-37}."
  ur: "محمد بن خلف بن حیان بن صدقہ الدبی، ابوبکر، کنیت وکیع، تاریخ اور جغرافیہ کے ماہر اور محقق، جو الاہواز کے قاضی تھے اور بغداد میں 306 ہجری ⁦(918 عیسوی)⁩ میں فوت ہوئے؛ ان کی تصانیف میں اخبار القدت و تواریخوم، الطارق، الشریف اور الانواع شامل ہیں 6 صفحہ 114-115} {حوالہ: شدارت ذہاب جلد 4ص 33} {حوالہ: وافی بِل وفایت صفادی شرح الہیٰ 2000 جلد۔ 3 صفحہ 36-37}۔"
  tr: "Muhammed bin Halaf ibn Hayyan ibn Sadaqah al-Dabi, Ebu Bekir, lakaplı adı Waki'al-Qadi, tarih ve ülkeler alanında yargıç, araştırmacı ve alimdi, Ahvaz'ın hakimi olarak atandı ve 306 Hicri'de Bağdat'ta vefat etti. Eserleri arasında \"Akhbar al-Qudat wa Tawarikhhum,\" \"Al-Tariq,\" \"Al-Sharif\" ve \"Al-Anwa' {cite:alam-zirikli-dar-al-ilm-2002 cilt 6, ss. 114-115} {cite:Shadharat-Dhahab cilt 4, s. 33} {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 cilt 3, s. 36-37} bulunmaktadır."
  id: "Muhammad ibn Khalaf ibn Hayyan ibn Sadaqah al-Dhabi, Abu Bakr, dijuluki Waki' al-Qadi, adalah seorang hakim, peneliti, dan ulama sejarah serta negara, diangkat sebagai hakim Ahvaz dan meninggal di Baghdad pada tahun 306 H. Di antara karya-karyanya adalah \"Akhbar al-Qudat wa Tawarikhhum,\" \"Al-Tariq,\" \"Al-Sharif,\" dan \"Al-Anwa\" {cite:alam-zirikli-dar-al-ilm-2002 vol. 6, hlm. 114-115} {cite:shadharat-dhahab vol. 4, hlm. 33} {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 3, hlm. 36-37}."
