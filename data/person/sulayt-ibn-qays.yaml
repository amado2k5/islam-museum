label: { ar: "سليط بن قيس", en: "Sulayt ibn Qays" }
summary:
  ar: "أحد أهل بدر، أشركه عمر مع أبي عبيدة وأوصاه أن يستشيره ولا يخالفه، وكان رأيه ألا يعبر الفرات حتى يعبر إليهم العدو ولا يقطع الجسر ليبقى للمسلمين ملجأ ومرجع من هزيمة، فلما قال له أبو عبيد جبنت قال والله ما جبنت وأنا أجرأ منك نفساً وقبيلاً ولكن أشرت بالرأي، وقال لولا أني أكره خلاف الطاعة لأنجزت بالناس ولكني أسمع وأطيع {cite:muruj-al-dhahab p. 604}."
  en: "The Badri Umar bound to Abu 'Ubayda as advisor — his counsel: let the enemy cross, keep the bridge for retreat — who answered the taunt of cowardice 'I am bolder than you in soul and tribe, but I advised'; and obeyed though unconvinced {cite:muruj-al-dhahab p. 604}."
