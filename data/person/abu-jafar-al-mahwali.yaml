summary:
  ar: "أبو جعفر المحولي، الباكي الشاكي المعولي، من قدماء العارفين من أهل بغداد، سكن باب الحول فنُسب إليه. قال: إليك أشكو بدنًا غذّيته بنعمتك ثم توثّب على معاصيك."
  en: "Abu Ja'far al-Mahwali, who wept and complained to God; one of the early knowers of God from Baghdad, he lived at the Bab al-Hawl and took his nisba from it; he said: to You I complain of a body that You nourished with Your blessing and that then leapt upon Your disobedience."
  ur: "ابو جعفر محولی روتے اور اپنے رب سے شکوہ کرتے تھے۔ بغداد کے قدیم عارفین میں سے تھے، باب الحول میں رہتے تھے اور اسی سے ان کی نسبت ہوئی۔ کہا: میں تیری بارگاہ میں اس جسم کا شکوہ کرتا ہوں جسے تو نے اپنی نعمت سے پالا، پھر وہ تیری نافرمانی پر جھپٹ پڑا۔"
