summary:
  ar: "جابر الرحبي، له الأحوال الرقيقة والألطاف البديعة. روى أبو جعفر الخصاف أنه سابقه على الجسر، فلما التفت رآه يمشي على الماء، وقال له: أنت رجل صالح."
  en: "Jabir al-Rahbi, of delicate states and graceful kindnesses; Abu Ja'far al-Khassaf relates that Jabir challenged him to a race across a bridge, and when he looked back he saw him walking on the water, the water flashing under his feet; Jabir said: you have seen me, you are a righteous man."
  ur: "جابر رحبی، نازک احوال اور عمدہ الطاف والے۔ ابو جعفر خصاف نقل کرتے ہیں کہ جابر نے ان سے پل پر دوڑ کا مقابلہ کیا؛ جب انہوں نے مڑ کر دیکھا تو جابر پانی پر چل رہے تھے اور پانی ان کے قدموں کے نیچے سے اڑ رہا تھا۔ جابر نے کہا: تم نے مجھے دیکھا ہے؟ تم نیک آدمی ہو۔"
  es: "Jabir al-Rahbi, de estados delicados y bondades gráciles; Abu Ja'far al-Khassaf relata que Jabir lo desafió a una carrera a través de un puente, y cuando miró hacia atrás lo vio caminando sobre el agua, el agua brillando bajo sus pies; Jabir dijo: me has visto, eres un hombre justo."
  fr: "Jabir al-Rahbi, homme d'une grande délicatesse et d'une grande bonté; Abu Ja'far al-Khassaf raconte que Jabir le défia à une course sur un pont, et lorsqu'il se retourna, il le vit marcher sur l'eau, l'eau scintillant sous ses pieds; Jabir dit: tu m'as vu, tu es un homme juste."
  tr: "Nazik tavırları ve zarif nezaketiyle tanınan Jabir al-Rahbi. Abu Ja'far al-Khassaf, köprüde onu gördüğünü, döndüğünde onu suyun üzerinde yürürken gördüğünü ve ona şöyle dediğini anlattı: Sen doğru bir adamsın."
  id: "Jabir al-Rahbi, dikenal karena sikap halus dan kebaikan yang luar biasa. Abu Ja'far al-Khassaf menceritakan bahwa dia melewatinya di jembatan, dan ketika dia berbalik, dia melihat Jabir berjalan di atas air dan berkata kepadanya: Kamu adalah orang yang benar."
