summary:
  ar: "جابر الرحبي، له الأحوال الرقيقة والألطاف البديعة. روى أبو جعفر الخصاف أنه سابقه على الجسر، فلما التفت رآه يمشي على الماء، وقال له: أنت رجل صالح."
  en: "Jabir al-Rahbi, of delicate states and graceful kindnesses; Abu Ja'far al-Khassaf relates that Jabir challenged him to a race across a bridge, and when he looked back he saw him walking on the water, the water flashing under his feet; Jabir said: you have seen me, you are a righteous man."
  ur: "جابر رحبی، نازک احوال اور عمدہ الطاف والے۔ ابو جعفر خصاف نقل کرتے ہیں کہ جابر نے ان سے پل پر دوڑ کا مقابلہ کیا؛ جب انہوں نے مڑ کر دیکھا تو جابر پانی پر چل رہے تھے اور پانی ان کے قدموں کے نیچے سے اڑ رہا تھا۔ جابر نے کہا: تم نے مجھے دیکھا ہے؟ تم نیک آدمی ہو۔"
