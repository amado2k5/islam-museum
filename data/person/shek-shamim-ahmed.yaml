summary:
  ar: "منتج فيديو مسلم بريطاني، وهو الصانع الوحيد لقناة «الإرشاد الإسلامي» (Islamic Guidance) على يوتيوب، التي أنشأها في 23 يونيو 2008 ودأب على إنتاج موادها وحده منذ ذلك الحين. تنتج القناة سلاسل متحركة عالية الجودة في التاريخ الإسلامي، منها سلسلة الأئمة الأربعة وسلسلة العشرة المبشرين بالجنة وسلسلة السيرة النبوية، وتجاوز مشتركوها 1.4 مليون مشترك."
  en: "A British Muslim video producer, the sole creator of the Islamic Guidance YouTube channel, which he started on 23 June 2008 and has produced single-handedly ever since. The channel makes high-quality animated series on Islamic history, among them the Four Imams series, the Ten Promised Paradise series and an ongoing Seera series, and passed 1.4 million subscribers."
  ur: "برطانوی مسلمان ویڈیو پروڈیوسر، یوٹیوب چینل Islamic Guidance کے واحد خالق؛ انہوں نے یہ چینل 23 جون 2008 کو شروع کیا اور تب سے اکیلے اس کا مواد تیار کر رہے ہیں۔ چینل اسلامی تاریخ پر اعلیٰ معیار کی متحرک سلاسل بناتا ہے، جن میں ائمہ اربعہ کی سلسلہ، عشرہ مبشرہ کی سلسلہ اور سیرت کی جاری سلسلہ شامل ہیں، اور اس کے سبسکرائبرز چودہ لاکھ سے تجاوز کر چکے ہیں۔"
