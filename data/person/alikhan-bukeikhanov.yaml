summary:
  ar: "رجل دولة وصحفي وعالم كازاخي (5 مارس 1866 – 27 سبتمبر 1937) قاد حزب ألاش وترأّس حكومة ألاش أوردا الذاتية (1917–1920)؛ اعتُقل في عهد ستالين وأُعدم رميًا في سجن بوتيركا بموسكو، ورُدّ اعتباره سنة 1989."
  en: "Kazakh statesman, journalist and scholar (5 March 1866 – 27 September 1937) who led the Alash party and chaired the Alash Orda autonomy of 1917–1920; arrested under Stalin and shot in Moscow's Butyrka prison, he was rehabilitated in 1989."
  ur: "قازق سیاست دان، صحافی اور عالم (5 مارچ 1866ء – 27 ستمبر 1937ء) جنہوں نے علاش پارٹی کی قیادت کی اور علاش اوردا خودمختاری (1917–1920ء) کے صدر رہے؛ اسٹالن کے دور میں گرفتار ہوئے اور ماسکو کی بوتیرکا جیل میں گولی مار کر ہلاک کیے گئے، 1989ء میں باعزت بحال ہوئے۔"
