summary:
  ar: "صناعي نفط ومليونير أذربيجاني (1857–1920؛ تعطي الروسية وويكيبيانات 1855)، مهندس حفر عصامي صاحب براءات اختراع، بنى قصر مختاروف في باكو وموّل مسجد أميرجان ومسجد فلاديقفقاز وأعمالًا خيرية واسعة؛ مات في قصره يوم دخول الجيش الأحمر باكو سنة 1920."
  en: "Azerbaijani oil industrialist and millionaire (1857–1920; the Russian article and Wikidata give 1855), a self-taught drilling engineer with patents to his name, who built the Mukhtarov Palace in Baku and funded the Amirjan mosque, the Vladikavkaz mosque and wide philanthropy; he died at his palace on the day the Red Army took Baku in 1920."
  ur: "آذربائیجانی تیل صنعت کار اور کروڑ پتی (1857–1920؛ روسی مضمون اور ویکی ڈیٹا 1855 دیتے ہیں)؛ خود آموز ڈرلنگ انجینئر، باکو میں مختاروف محل کے بانی اور امیرجان و ولادی قفقاز کی مساجد کے کفیل؛ 1920 میں باکو پر سرخ فوج کے قبضے کے دن اپنے محل میں انتقال ہوا۔"
