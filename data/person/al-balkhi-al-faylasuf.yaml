id: person/al-balkhi-al-faylasuf
class: person
label: { ar: "البلخي الفيلسوف", en: "Al Balkhi Al Faylasuf", fr: "Al-Balkhi al-Faylasuf", es: "Al Balkhi Al Faylasuf", ur: "البالخی الفیلاسوف" }
summary:
  ar: "البلخي الذي قرأ عليه الرازي الفلسفة كان من أهل بلخ يطوف البلاد ويجول الأرض حسن المعرفة بالفلسفة والعلوم القديمة وقد يقال إن الرازي ادعى كتبه في ذلك ورأى ابن النديم بخطه شيئا كثيرا في علوم كثيرة مسودات ودساتير لم يخرج منها إلى الناس كتاب تام وقيل إن بخراسان كتبه موجودة وكان في زمان الرازي {cite:fihrist-ibn-al-nadim p. 416}."
  en: "The wandering Balkhi philosopher under whom al-Razi read philosophy {cite:fihrist-ibn-al-nadim}"
  fr: "Philosophe voyageur de Balkh auprès duquel al-Razi étudia la philosophie {cite:fihrist-ibn-al-nadim}"
  es: "El filósofo balkhi errante con quien al-Razi estudió filosofía {cite:fihrist-ibn-al-nadim}"
  ur: "آوارہ بلخی فلسفی جس کے تحت الرازی نے فلسفہ پڑھا"
  tr: "El-Razi'nin felsefe eğitimi aldığı El-Balkhi, Belh'liydi. Ülkeyi dolaştı ve dünyayı gezdi. Felsefe ve eski bilimler konusunda iyi bir bilgiye sahipti. El-Razi'nin bu konuda kitaplar yazdığını iddia ettiği söylenebilir. İbn el-Nadim, onun el yazısında birçok bilim dalında çok sayıda taslak ve metin gördü; bunların hiçbiri tam kitap olarak yayınlanmadı. Kitaplarının Horasan'da bulunduğu söylenir. El-Razi zamanında yaşamıştır. {cite:fihrist-ibn-al-nadim s. 416}"
  id: "Al-Balkhi, dari siapa Al-Razi belajar filsafat, berasal dari Balkh. Ia berkelana ke seluruh negeri dan menjelajahi bumi. Ia memiliki pengetahuan yang baik tentang filsafat dan ilmu pengetahuan kuno. Dapat dikatakan bahwa Al-Razi mengklaim telah menulis buku-buku tentang subjek tersebut. Ibn Al-Nadim melihat dalam tulisan tangannya banyak draf dan konstitusi tentang berbagai ilmu pengetahuan, yang tidak satupun diterbitkan sebagai buku lengkap. Dikatakan bahwa buku-bukunya ada di Khorasan. Ia hidup pada zaman Al-Razi. {cite:fihrist-ibn-al-nadim p. 416}."
