summary:
  ar: "شهاب الدين التركي الطرابلسي الدمشقي الشافعي؛ كان يصلي بجامع طرابلس الشام وكان من أهل الديانة والخير، وكان يقرأ في كل يوم وليلة المصحف كله في ركعتين؛ مات سنة عشرين وتسعمائة {cite:shadharat-dhahab p. 470}."
  en: "Imam of Tripoli's mosque — a man of piety who 'recited the whole Qur'an every day and night in two rak'as'; d. 920 {cite:shadharat-dhahab p. 470}."
  es: "Imán de la mezquita de Trípoli: un hombre piadoso que \"recitaba el Corán completo cada día y noche en dos rak'as\"; m. 920 {cita: shadharat-dhahab p. 470}."
  fr: "L'imam de la mosquée de Tripoli — un homme pieux qui « récitait le Coran entier chaque jour et chaque nuit en deux rak'as »; mort en 920 {cite: shadharat-dhahab p. 470}."
  ur: "طرابلس کی مسجد کا امام - ایک متقی شخص جو 'ہر دن اور رات میں دو رکعتوں میں پورا قرآن پڑھتا تھا'؛ d 920 {حوالہ: شدھارت ذہاب ص۔ 470}۔"
  tr: "Şihabeddin el-Turki el-Terabülsi el-Dimashqi el-Şafii; Şam'daki Trablus Camii'nde namaz kılardı ve iman ve erdemli bir adamdı. Her gün ve gece iki rekatta tüm Muşaf'ı okurdu; 920 Hicri yılında vefat etti {atıf:şadharat-dhahab, s. 470}."
  id: "Shihab al-Din al-Turki al-Tarabulsi al-Dimashqi al-Shafi'i; ia biasa shalat di Masjid Tripoli di al-Sham dan merupakan orang yang beriman dan berbudi batu. Ia biasa membaca seluruh Mushaf setiap hari dan malam dalam dua rak'ah; ia meninggal pada tahun 920 H {sitasi:shadharat-dhahab, hlm. 470}."
