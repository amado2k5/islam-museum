id: person/al-hakim-al-nisaburi
class: person
label: { ar: "الحاكم النيسابوري", en: "al-Hakim al-Nisaburi", ur: "حاکم نیشاپوری" }
names:
  - { value: "أبو عبد الله محمد بن عبد الله بن محمد بن حمدويه الضبي الطحماني ابن البيّع", kind: full }
summary:
  ar: "أبو عبد الله محمد بن عبد الله بن محمد بن حمدويه الضبي الطحماني النيسابوري الحافظ المعروف بابن البيّع ⁦(٣٢١-٤٠٥هـ)⁩؛ ولد بنيسابور الاثنين ثالث ربيع الأول ٣٢١هـ، وكان أول سماعه سنة ٣٣٠هـ، ورحل إلى العراق سنة ٣٤١هـ وحج وطاف خراسان وما وراء النهر حتى قارب شيوخه ألفي رجل، ولزم الإمام أبا بكر الصبغي فأوصى إليه بمدرسته دار السنة؛ شرع في التصنيف سنة ٣٣٧هـ فبلغت مصنفاته قريباً من ألف وخمسمائة جزء، منها [[work/al-mustadrak-ala-al-sahihayn|المستدرك على الصحيحين]] وتاريخ النيسابوريين ومعرفة علوم الحديث، وروى عنه الدارقطني والبيهقي والقشيري؛ توفي بنيسابور الثلاثاء ثالث صفر ٤٠٥هـ {cite:tarikh-islam-dhahabi pp. 122-131} {cite:wafayat-ayan} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 90-91}."
  en: "Abu Abd Allah Muhammad ibn Abd Allah al-Nisaburi, the hafiz known as Ibn al-Bayyi' (321-405/933-1014); born at Nishapur on Monday 3 Rabi' I 321, he first heard hadith in 330, journeyed to Iraq in 341 and made the hajj through Khurasan and Transoxiana until his shaykhs numbered near two thousand; he attached himself to the imam Abu Bakr al-Sibghi who left him his school Dar al-Sunna; he began compiling in 337 and his works approached 1,500 parts, among them the [[work/al-mustadrak-ala-al-sahihayn|Mustadrak 'ala al-Sahihayn]], Tarikh al-Naysaburiyyin and Ma'rifat 'ulum al-hadith; al-Daraqutni, al-Bayhaqi and al-Qushayri transmitted from him; he died at Nishapur on Tuesday 3 Safar 405/1014 {cite:tarikh-islam-dhahabi pp. 122-131} {cite:wafayat-ayan} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 90-91}."
  ur: "ابو عبداللہ محمد بن عبداللہ نیشاپوری، حافظ معروف بہ ابنِ بیّع (321-405ھ/933-1014ء)؛ نیشاپور میں پیر کے روز 3 ربيع الاول 321ھ کو پیدا ہوئے، 330ھ میں پہلی سماعت کی، 341ھ میں عراق روانہ ہوئے اور حج کے ساتھ خراسان و ماوراء النہر طاف کیا یہاں تک کہ ان کے مشائخ تقریباً دو ہزار ہوئے؛ امام ابو بکر صبغی کے لازم رہے جنھوں نے انھیں اپنا مدرسہ دار السنہ سونپا؛ 337ھ میں تصنیف شروع کی تو مصنفات تقریباً پندرہ سو اجزا بنیں، جن میں [[work/al-mustadrak-ala-al-sahihayn|المستدرک علی الصحیحین]]، تاریخ النیسابوریین اور معرفۃ علوم الحدیث ہیں؛ دارقطنی، بيهقی اور قشیری نے ان سے روایت کیا؛ نیشاپور میں منگل 3 صفر 405ھ/1014ء کو وفات پائی {cite:tarikh-islam-dhahabi pp. 122-131} {cite:wafayat-ayan} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 90-91}۔"
