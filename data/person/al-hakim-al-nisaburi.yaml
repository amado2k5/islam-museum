summary:
  ar: "أبو عبد الله محمد بن عبد الله بن محمد بن حمدويه الضبي الطحماني النيسابوري الحافظ المعروف بابن البيّع؛ تعلم الفقه على مذهب الشافعي ثم طلب الحديث فغلب عليه واشتهر به، وسمعه من جماعة لا يُحصون كثرةً حتى إن معجم شيوخه يقرب من ألفي رجل، وصنّف في علومه ما يبلغ ألفاً وخمسمائة جزء، ومن تفرداته «المستدرك على الصحيحين» و«تاريخ علماء نيسابور» و«المدخل إلى علم الصحيح» و«فضائل الإمام الشافعي» {cite:wafayat-ayan}."
  en: "al-Hakim al-Nisaburi (d. 405, var. 403) — the Nishapuri hafiz known as Ibn al-Bayyi'; his shuyukh numbered near 2,000 and his compilations some 1,500 parts, including the Mustadrak 'ala al-Sahihayn and Tarikh 'ulama' Nisabur {cite:wafayat-ayan}."
