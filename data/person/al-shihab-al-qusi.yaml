summary:
  ar: "الرئيس الفقيه، وكيل بيت المال بالشام وواقف الحلقة القوصية بالجامع؛ ولد بقوص ورحل إلى مصر سنة تسعين ثم قدم دمشق سنة إحدى وتسعين واستوطنها وسمع الكثير ببلاد متعددة واتصل بالصاحب صفي الدين بن شكر، وخرج لنفسه معجماً في أربع مجلدات كبار قال الذهبي فيه غلط كثير؛ وكان أديباً أخبارياً فصيحاً مفوهاً بصيراً بالفقه وترسل إلى البلاد وولي وكالة بيت المال وتقدم عند الملوك ودرس بحلقته بجامع دمشق، ووقف داره دار حديث {cite:shadharat-dhahab p. 268-269}."
  en: "Shafi'i ra'is and wakil of Syria's bayt al-mal (b. Qus 574, d. Damascus Rabi' I 653) — he endowed his own house as a dar al-hadith and was buried in it; his four-volume mu'jam Dhahabi found full of errors {cite:shadharat-dhahab p. 268-269}."
