summary:
  ar: "المحدث المفسر الحنبلي؛ سمع بدمشق من الكندي وببغداد من ابن منينا وصنف تفسيراً جيداً، وكان شيخ الجزيرة في زمانه علماً وفضلاً وجلالةً؛ قال ابن رجب: تفقه على الشيخ موفق الدين وحفظ كتابه المقنع وتفنن في العلوم العقلية والنقلية، وعده الذهبي من الحفاظ، وولي مشيخة دار الحديث بالموصل وكانت له حرمة وافرة عند صاحب الموصل وغيره من ملوك الجزيرة، وصنف تفسيراً حسناً في أربع مجلدات ضخمة سماه «رموز الكنوز»، وكتاب «مصرع الحسين» ألزمه بتصنيفه صاحب الموصل فكتب فيه ما صح من المقتل دون غيره، وكان متمسكاً بالسنة والآثار وله نظم حسن {cite:shadharat-dhahab p. 529-530}."
  en: "'Shaykh of the Jazira in his time' — Ibn Rajab: Ibn Qudama's pupil, counted by Dhahabi among the huffaz, shaykh of Mosul's dar al-hadith; his four-volume tafsir Rumuz al-Kunuz and his Masra' al-Husayn (commissioned by Mosul's ruler, containing only what is sound of the martyrdom account); d. Sinjar night of Friday 12 Rabi' II 661 {cite:shadharat-dhahab p. 529-530}."
  fr: "'Shaykh de la Jazira en son temps' - Ibn Rajab : l'élève d'Ibn Qudama, compté par Dhahabi parmi les huffaz, shaykh du dar al-hadith de Mossoul ; son tafsir Rumuz al-Kunuz en quatre volumes et sa Masra' al-Husayn (commandée par le souverain de Mossoul, ne contenant que ce qui est sonore du récit du martyre) ; d. Nuit sinjar du vendredi 12 Rabi' II 661 {cite:shadharat-dhahab p. 529-530}."
  es: "'Shaykh de Jazira en su tiempo' — Ibn Rajab: discípulo de Ibn Qudama, contado por Dhahabi entre los huffaz, shaykh del dar al-hadith de Mosul; su tafsir de cuatro volúmenes Rumuz al-Kunuz y su Masra' al-Husayn (encargado por el gobernante de Mosul, que contiene solo lo que es auténtico del relato del martirio); murió en la noche de Sinjar del viernes 12 de Rabi' II de 661 {cita: shadharat-dhahab págs. 529-530}."
  ur: "'اپنے زمانے میں جزیرہ کے شیخ' - ابن رجب: ابن قدامہ کے شاگرد، ذہبی نے حفاظ میں شمار کیے، موصل کے دار الحدیث کے شیخ؛ اس کی چار جلدوں پر مشتمل تفسیر رمز الکنوز اور اس کا مسرہ الحسین ⁦(موصل کے حکمران کی طرف سے جاری کیا گیا، جس میں صرف شہادت کی آواز ہے)⁩؛ d شب جمعہ 12 ربیع الثانی 661 529-530}۔"
  tr: "Hanbali hadis âlimi ve tefsiri; Şam'da El-Kindi'den, Bağdat'ta İbn Münina'dan dinledi ve iyi bir tafsir yazdı. Kendi döneminde Cezire şeyhi bilgili, erdemli ve soyluydu. İbn Receb şöyle dedi: Şeyh Muvaffaq el-Din'in yanında fıkıh okudu, onun ikna edici kitabını ezberledi ve aklı ve aktarım bilimlerinde üstün oldu. El-Dhahabi'yi anıları arasında saydı Hadislerin yazarı ve Musul'daki Hadisler Evi ile yarımadanın diğer kralları arasında büyük saygı görmüştür. \"Hazinelerin Sembolleri\" adlı dört büyük ciltlik güzel bir tafsir ve \"Musul Şehidi\"nin yazarı tarafından derlemeye zorlandığı \"El-Hüseyin'in Ölümü\" adlı kitabı kaleme aldı; bu kitapta şehitlerin şehitliğiyle ilgili yalnızca gerçek olanları yazdı. Sünnet ve geleneklere bağlı kaldı ve iyi bir şiir {atıf:] yazdı Shadharat-Dhahab, s. 529-530}."
  id: "Ulama dan penafsir hadis Hanbali; ia mendengar di Damaskus dari Al-Kindi dan di Baghdad dari Ibn Munina, dan menulis tafsir yang baik. Sheikh Al-Jazira pada masanya adalah seorang yang berpengetahuan, berbudi luhur, dan mulia. Ibn Rajab berkata: Ia mempelajari hukum di bawah Sheikh Muwaffaq al-Din, menghafal bukunya yang meyakinkan, dan unggul dalam ilmu rasional dan transmisi. Ia menganggap Al-Dhahabi sebagai salah satu penghafal Hadis dan sangat dihormati oleh kepala Rumah Hadis di Mosul dan raja-raja lain di semenanjung tersebut. Ia menulis tafsir indah dalam empat volume besar berjudul \"Simbol Harta,\" dan buku \"Kematian Al-Husayn,\" yang dipaksa disusun oleh penulis \"The Martyr of Mosul\", di mana ia hanya menulis apa yang otentik mengenai syahid para syuhada. Ia berpegang pada Sunnah dan tradisi serta menulis puisi yang baik {cite:Shadharat-Dhahab, hlm. 529-530}."
