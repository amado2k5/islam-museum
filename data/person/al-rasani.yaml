summary:
  ar: "المحدث المفسر الحنبلي؛ سمع بدمشق من الكندي وببغداد من ابن منينا وصنف تفسيراً جيداً، وكان شيخ الجزيرة في زمانه علماً وفضلاً وجلالةً؛ قال ابن رجب: تفقه على الشيخ موفق الدين وحفظ كتابه المقنع وتفنن في العلوم العقلية والنقلية، وعده الذهبي من الحفاظ، وولي مشيخة دار الحديث بالموصل وكانت له حرمة وافرة عند صاحب الموصل وغيره من ملوك الجزيرة، وصنف تفسيراً حسناً في أربع مجلدات ضخمة سماه «رموز الكنوز»، وكتاب «مصرع الحسين» ألزمه بتصنيفه صاحب الموصل فكتب فيه ما صح من المقتل دون غيره، وكان متمسكاً بالسنة والآثار وله نظم حسن {cite:shadharat-dhahab p. 529-530}."
  en: "'Shaykh of the Jazira in his time' — Ibn Rajab: Ibn Qudama's pupil, counted by Dhahabi among the huffaz, shaykh of Mosul's dar al-hadith; his four-volume tafsir Rumuz al-Kunuz and his Masra' al-Husayn (commissioned by Mosul's ruler, containing only what is sound of the martyrdom account); d. Sinjar night of Friday 12 Rabi' II 661 {cite:shadharat-dhahab p. 529-530}."
