summary:
  ar: "عالم بالآلات والفلك عمل في مرو برعاية سنجر؛ وصف ميزان الحكمة في515/1121–1122 وطوّر معايرته ضمن تقليد سابق، لا مبتدع كل موازين الماء {cite:khazini-hall-dsb biography; Kitab Mizan al-Hikma}. تعرّف مقدمته إيمانه، ولا تثبت مدرسة فقهية شخصية {cite:khazini-khanikoff-1859 p. 3}."
  en: "Instrument scholar and astronomer at Merv under Sanjar; his515/1121–1122 treatise describes a refined, calibrated hydrostatic balance within an earlier tradition {cite:khazini-hall-dsb biography; Kitab Mizan al-Hikma}. His own preface supplies the Muslim basis, not personal school testimony {cite:khazini-khanikoff-1859 p. 3}."
  ur: "سنجر کی سرپرستی میں مرو کے عالم آلات و فلکیات؛515/1121–1122 کا رسالہ پہلے آبی میزان کی بہتر درجہ بندی بیان کرتا ہے {cite:khazini-hall-dsb biography; Kitab Mizan al-Hikma}۔ ان کا اپنا دیباچہ مسلم شناخت کا ثبوت ہے، ذاتی فقہی مکتب کی شہادت نہیں {cite:khazini-khanikoff-1859 p. 3}۔"
  es: "Erudito en instrumentos y astrónomo en Merv bajo la tutela de Sanjar; su tratado de 515/1121–1122 describe una balanza hidrostática refinada y calibrada dentro de una tradición anterior {cite:khazini-hall-dsb biography; Kitab Mizan al-Hikma}. Su propio prefacio proporciona la base musulmana, no el testimonio personal de la escuela {cite:khazini-khanikoff-1859 p. 3}."
  fr: "Érudit en instruments et astronome à Merv sous Sanjar, son traité de 515/1121-1122 décrit une balance hydrostatique perfectionnée et calibrée, s'inscrivant dans une tradition plus ancienne (voir la biographie de Khazini Hall et le Kitab Mizan al-Hikma). Sa préface expose le fondement musulman, et non un témoignage personnel issu de son école (voir Khazini Khanikoff, 1859, p. 3)."
  tr: "Bir makineci ve astronom, Merv'de Singer'in himayesiyle çalışmıştır; 515/1121–1122 yıllarında Bilgelik Dengesi'ni tanımlamış ve kalibrasyonunu daha önceki bir gelenek içinde geliştirmiştir, tüm su terazilerinin mucidi değildir {cite:khazini-hall-dsb biyografisi; Kitab Mizan al-Hikma}. Tanıtımı inancını tanır, ancak kişisel bir hukukçuluk okulu kurmaz {cite:khazini-khanikoff-1859 s. 3}."
  id: "Seorang ahli mesin dan astronom bekerja di Merv di bawah naungan Singer; menggambarkan Balance of Wisdom pada tahun 515/1121–1122 dan mengembangkan kalibrasinya dalam tradisi sebelumnya, bukan penemu semua timbangan air {cite:khazini-hall-dsb biography; Kitab Mizan al-Hikma}. Pendahuluannya mengakui kepercayaannya, tetapi tidak mendirikan sekolah yurisprudensi pribadi {cite:khazini-khanikoff-1859 hlm. 3}."
