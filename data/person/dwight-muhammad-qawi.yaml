summary:
  ar: "ملاكم أمريكي وُلد باسم دوايت براكستون في بالتيمور سنة 1953 وتوفي سنة 2025. تعلّم الملاكمة في سجن راهوي حيث كان يقضي عقوبة عن سطو مسلح، فأصبح بطلاً للعالم في وزنين: خفيف الثقيل (1981–1983) والكروزر (1985–1986)، وأُدخل قاعة مشاهير الملاكمة الدولية سنة 2004، وعمل بعد اعتزاله مدرباً ومستشاراً في مركز لإعادة تأهيل المدمنين."
  en: "American boxer, born Dwight Braxton in Baltimore in 1953 and died in 2025. He learned boxing in Rahway State Prison, where he was serving a sentence for armed robbery, and became a world champion in two weight classes, light heavyweight (1981–1983) and cruiserweight (1985–1986). He was inducted into the International Boxing Hall of Fame in 2004, and after retiring worked as a trainer and as a counsellor at a rehabilitation centre."
  ur: "امریکی باکسر، 1953 میں بالٹیمور میں ڈوائٹ بریکسٹن کے نام سے پیدا ہوئے اور 2025 میں وفات پائی۔ انہوں نے راہ وے ریاستی جیل میں باکسنگ سیکھی جہاں وہ مسلح ڈکیتی کی سزا کاٹ رہے تھے، اور دو وزن کلاسوں میں عالمی چیمپئن بنے: لائٹ ہیوی ویٹ (1981–1983) اور کروزر ویٹ (1985–1986)۔ 2004 میں انہیں انٹرنیشنل باکسنگ ہال آف فیم میں شامل کیا گیا، اور ریٹائرمنٹ کے بعد وہ ٹرینر اور بحالی مرکز میں مشیر کے طور پر کام کرتے رہے۔"
