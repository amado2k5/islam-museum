summary:
  ar: "أبو عبد الله المكي، سمع يونس بن عبد الأعلى والربيع بن سليمان وغيرهما، روى عنه جعفر الخلدي؛ وكان عمرو بن عثمان قد ولّي قضاء جدة فهجره الجنيد وقال: لا أكلم من كان يظهر الزهد ثم يبدو منه الاتساع في طلب الدنيا؛ توفي ببغداد في هذه السنة وقيل في إحدى وتسعين ومائتين والأول أصح {cite:muntazam-ibn-al-jawzi p. 205}."
  en: "Abu 'Abdallah al-Makki, the Sufi who heard Yunus ibn 'Abd al-A'la and al-Rabi' ibn Sulayman — when he accepted the judgeship of Jeddah, al-Junayd shunned him: 'I do not speak with one who displayed asceticism then showed worldly appetite.' He died at Baghdad in 297 or, better attested, 291 {cite:muntazam-ibn-al-jawzi p. 205}."
  es: "Abu 'Abdallah al-Makki, el sufí que escuchó a Yunus ibn 'Abd al-A'la y a al-Rabi' ibn Sulayman, cuando aceptó el cargo de juez de Yeda, al-Junayd lo rechazó: «No hablo con quien mostró ascetismo y luego apetito mundano». Murió en Bagdad en el año 297 o, mejor documentado, en el 291 {cite:muntazam-ibn-al-jawzi p. 205}."
  fr: "Abu 'Abdallah al-Makki, le soufi qui avait entendu Yunus ibn 'Abd al-A'la et al-Rabi' ibn Sulayman, lorsqu'il accepta la charge de juge de Djeddah, al-Junayd le rejeta: « Je ne parle pas à celui qui a fait preuve d'ascétisme puis a manifesté des appétits mondains. » Il mourut à Bagdad en 297 ou, mieux attesté, en 291 {cite: muntazam-ibn-al-jawzi p. 205}."
  ur: "ابو عبداللہ المکی، صوفی جس نے یونس بن عبد العلا اور الربیع ابن سلیمان کو سنا تھا - جب اس نے جدہ کی عدالت قبول کی تو الجنید نے ان سے کنارہ کشی کی: 'میں اس سے بات نہیں کرتا جس نے پرہیزگاری کا مظاہرہ کیا پھر دنیا کی بھوک دکھائی۔' ان کی وفات 297 میں بغداد میں ہوئی یا بہتر طور پر 291 میں وفات پائی۔ 205}۔"
