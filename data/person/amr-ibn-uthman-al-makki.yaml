summary:
  ar: "أبو عبد الله المكي، سمع يونس بن عبد الأعلى والربيع بن سليمان وغيرهما، روى عنه جعفر الخلدي؛ وكان عمرو بن عثمان قد ولّي قضاء جدة فهجره الجنيد وقال: لا أكلم من كان يظهر الزهد ثم يبدو منه الاتساع في طلب الدنيا؛ توفي ببغداد في هذه السنة وقيل في إحدى وتسعين ومائتين والأول أصح {cite:muntazam-ibn-al-jawzi p. 205}."
  en: "Abu 'Abdallah al-Makki, the Sufi who heard Yunus ibn 'Abd al-A'la and al-Rabi' ibn Sulayman — when he accepted the judgeship of Jeddah, al-Junayd shunned him: 'I do not speak with one who displayed asceticism then showed worldly appetite.' He died at Baghdad in 297 or, better attested, 291 {cite:muntazam-ibn-al-jawzi p. 205}."
