summary:
  ar: "عبد الله بن زيد بن عبد ربه الأنصاري الخزرجي، من بني الحارث بن الخزرج، أبو محمد، صاحب رؤيا الأذان؛ شهد العقبة وبدراً وسائر المشاهد، ورأى الأذان في النوم سنة إحدى بعد بناء المسجد فأمر النبي بلالاً أن يؤذن به، وحمل راية بني الحارث بن الخزرج يوم الفتح، وتوفي بالمدينة سنة 32هـ ابن أربع وستين وصلى عليه عثمان {cite:istiab-alam-2002 p. 404-405}."
  en: "'Abd Allah ibn Zayd ibn 'Abd Rabbih al-Ansari al-Khazraji, of Banu al-Harith ibn al-Khazraj, Abu Muhammad, the Companion of the dream of the call to prayer; he was at al-'Aqaba, Badr and all the campaigns, saw the adhan in his sleep in year 1 after the mosque was built, whereupon the Prophet had Bilal call it, carried the banner of Banu al-Harith ibn al-Khazraj at the conquest of Mecca, and died in Medina in 32 AH aged sixty-four, 'Uthman leading his funeral prayer {cite:istiab-alam-2002 p. 404-405}."
  ur: "عبد اللہ بن زید بن عبد ربہ انصاری خزرجی، بنو الحارث بن الخزرج سے، ابو محمد، خواب میں اذان دیکھنے والے صحابی؛ عقبہ، بدر اور تمام غزوات میں شریک رہے، مسجد کی تعمیر کے بعد سن 1ھ میں خواب میں اذان دیکھی تو نبی نے بلال کو اس کے مطابق اذان دینے کا حکم دیا، فتح مکہ کے دن بنو الحارث بن الخزرج کا جھنڈا اٹھایا، اور 32ھ میں مدینہ میں چونسٹھ برس کی عمر میں فوت ہوئے اور عثمان نے نمازِ جنازہ پڑھائی {cite:istiab-alam-2002 p. 404-405}۔"
died: { edtf: "0652/0653", hijri: "0032", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي بالمدينة سنة اثنتين وثلاثين وهو ابن أربع وستين، وصلى عليه عثمان {cite:istiab-alam-2002 p. 405}؛ المقابل الميلادي مشتق.", sources: [source/istiab-alam-2002] }
