summary:
  ar: "أبو النجيب السهروردي عبد القاهر بن عبد الله نسبة إلى سهرورد بلد عند زنجان؛ الصوفي القدوة الواعظ العارف الفقيه الشافعي قدم بغداد وسمع علي بن نبهان وجماعة وكان إماماً في الشافعية وعلماً في الصوفية لُقب بمفتي العراقين وقدوة الفريقين، شرح أحوال القوم وحرر المذهب وأفتى وناظر وروى الحديث ثم مال إلى المعاملة فصحب الشيخ حماد الدباس وأحمد الغزالي وبنى ببغداد رباطاً ومدرسة ودرس بالنظامية سنتين وصارت رباطه ملاذاً يعتصم به الخائف من الخليفة فن دونه؛ توجه إلى الشام سنة سبع وخمسين لزيارة بيت المقدس فلم يتفق له لانفساخ الهدنة فأقام بدمشق وأكرمه الملك العادل نور الدين وعاد إلى بغداد فتوفي بها يوم الجمعة وقت العصر سابع جمادى الآخرة سنة ثلاث وستين وخمسمائة ودفن بكرة الغد في مدرسته وكان مولده في صفر سنة تسعين وأربعمائة تقريباً؛ قال الأسنوي ظهرت بركته على أصحابه وصار شيخ العراق في وقته {cite:shadharat-dhahab p. 688-689}."
  en: "Abu al-Najib al-Suhrawardi Abd al-Qahir ibn Abdallah, nisba to Suhraward near Zanjan; the exemplary Sufi preacher and Shafi'i jurist, titled mufti of the two Iraqs and exemplar of the two communities — he mastered the madhhab, then turned to the Path, accompanying Hammad al-Dabbas and Ahmad al-Ghazali, built a ribat and madrasa at Baghdad whose sanctuary 'kings sought'; lectured two years at the Nizamiyya; on a 557 Jerusalem visit blocked by the lapsed truce he stayed at Damascus honoured by Nur al-Din, and died at Baghdad Friday 7 Jumada II 563, buried at dawn in his own madrasa — born Safar ~490 {cite:shadharat-dhahab p. 688-689}."
  fr: "Abu al-Najib al-Suhrawardi Abd al-Qahir ibn Abdallah, nisba de Suhraward près de Zanjan ; le prédicateur soufi exemplaire et juriste shafi'ite, surnommé mufti des deux Iraqs et modèle des deux communautés — il maîtrisa l'école, puis se tourna vers la Voie, accompagnant Hammad al-Dabbas et Ahmad al-Ghazali, bâtit à Bagdad un ribat et une madrasa dont l'asile « était recherché par les rois » ; il enseigna deux ans à la Nizamiyya ; lors d'une visite à Jérusalem en 557 empêchée par la rupture de la trêve, il resta à Damas, honoré par Nur al-Din, et mourut à Bagdad le vendredi 7 Jumada II 563, enterré à l'aube dans sa propre madrasa — né en Safar vers 490 {cite:shadharat-dhahab p. 688-689}."
  es: "Abu al-Najib al-Suhrawardi Abd al-Qahir ibn Abdallah, nisba a Suhraward cerca de Zanjan; el ejemplar predicador sufí y jurista shafi'í, titulado muftí de los dos Irak y ejemplo de las dos comunidades: dominó la madhhab, luego se dedicó al Camino, acompañando a Hammad al-Dabbas y Ahmad al-Ghazali, construyó un ribat y una madrasa en Bagdad cuyo santuario \"buscaban los reyes\"; dio conferencias durante dos años en la Nizamiyya; en una visita a Jerusalén en 557, bloqueada por la tregua caducada, se quedó en Damasco, honrado por Nur al-Din, y murió en Bagdad el viernes 7 de Jumada II de 563, enterrado al amanecer en su propia madrasa; nació en Safar ~490 {cite:shadharat-dhahab p. 688-689}."
  ur: "ابو النجیب السہروردی عبد القاہر ابن عبد اللہ، نسبہ تا سہرورد نزجان؛ مثالی صوفی مبلغ اور شافعی فقیہ، جس کا لقب دو عراق کے مفتی اور دو فرقوں کا نمونہ ہے - اس نے مذھب پر عبور حاصل کیا، پھر حماد الدباس اور احمد الغزالی کے ساتھ مل کر راستے کی طرف متوجہ ہوئے، بغداد میں ایک رباط اور مدرسہ تعمیر کیا۔ نظامیہ میں دو سال لیکچر دیا۔ 557 یروشلم کے دورے پر جو کہ وقفے وقفے سے روک دیا گیا تھا، وہ دمشق میں نورالدین کے اعزاز میں ٹھہرے تھے، اور بغداد میں جمعہ 7 جمادی الثانی 563 میں وفات پا گئے، اپنے ہی مدرسہ میں فجر کے وقت دفن ہوئے۔ 688-689}۔"
  tr: "Suhrawardi, Zencan yakınlarındaki Suhraward kasabasının adını taşıyan, örnek bir Sufi vaiz, gnostik ve Şafiî fıkıhçı olan Ebu el-Necib el-Suhrawardi, Abd el-Kahir ibn Abd Allah'tır. Bağdat'a gelip Ali ibn Nabhan ve bir grup insanı dinledi. Şafiî mezhebinde imam ve Sufizmde âlimdi. İki Irak'ın Müftüsü ve iki grubun örneği olarak anılırdı. İnsanların durumunu açıkladı, doktrini netleştirdi, fetvalar verdi, tartışmalara katıldı ve hadis rivayet etti. Daha sonra ticarete yöneldi ve Şeyh Hammad el-Dabbas ve Ahmed el-Gazali'ye eşlik etti. Bağdat'ta bir rıhtım ve okul inşa etti ve iki yıl boyunca Nizamiye'de ders verdi. Rıhtımı, halifeden korkanlar için bir sığınak haline geldi, bu yüzden oraya gitti. 57 yılında Kudüs'ü ziyaret etmek için Levant'a gitti, ancak ateşkesin bozulması nedeniyle bu gerçekleşmedi. Bu yüzden Şam'da kaldı ve Kral Adil Nur el-Din onu onurlandırdı. Bağdat'a döndü ve 563 yılında Cemadi el-Ahiret'in yedinci günü, Cuma günü öğleden sonra vefat etti. Ertesi sabah okuluna defnedildi. Yaklaşık 490 yılında Safer'de doğdu. El-Esnevi şöyle dedi: \"Onun bereketi sahabelerine indi ve zamanında Irak Şeyhi oldu.\" {Kaynak: Şadharat-Dhaba, s. 688-689}"
  id: "Abu al-Najib al-Suhrawardi, Abd al-Qahir ibn Abd Allah, dinamai menurut Suhraward, sebuah kota dekat Zanjan; seorang pendakwah Sufi teladan, ahli ilmu pengetahuan, dan ahli hukum mazhab Syafi'i. Ia datang ke Baghdad dan mendengarkan Ali ibn Nabhan dan sekelompok orang. Ia adalah seorang imam dalam mazhab Syafi'i dan seorang ulama dalam Sufisme. Ia dijuluki Mufti Dua Irak dan teladan dari kedua kelompok tersebut. Ia menjelaskan kondisi masyarakat, mengklarifikasi doktrin, mengeluarkan fatwa, berdebat, dan meriwayatkan hadits. Kemudian ia cenderung berbisnis, sehingga ia menemani Syekh Hammad al-Dabbas dan Ahmad al-Ghazali. Ia membangun sebuah ribat dan sebuah sekolah di Baghdad dan mengajar di Nizamiyyah selama dua tahun. Ribatnya menjadi tempat perlindungan bagi mereka yang takut kepada Khalifah, sehingga ia pergi ke sana. Pada tahun 157, beliau berangkat ke Levant untuk mengunjungi Yerusalem, tetapi kunjungan itu tidak terlaksana karena gencatan senjata. Maka beliau tinggal di Damaskus, dan Raja al-Adil Nur al-Din menghormatinya. Beliau kembali ke Baghdad, tempat beliau wafat pada hari Jumat sore, tanggal 7 Jumada al-Akhirah tahun 1563. Beliau dimakamkan keesokan paginya di sekolahnya. Beliau lahir di Safar sekitar tahun 1490. Al-Asnawi berkata: Berkahnya tercurah kepada para sahabatnya dan beliau menjadi Syekh Irak pada masanya {kutipan:shadharat-dhahab hlm. 688-689}."
