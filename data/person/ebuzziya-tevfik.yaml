summary:
  ar: "كاتب وناشر وخطاط عثماني (1849–1913)، من العثمانيين الشباب، صاحب «مطبعة أبو الضيا» و«مجموعة أبو الضيا»، أوّل من أخرج مختارات من الأدب العثماني على الطريقة الغربية، نُفي إلى رودس وقونية، وجلس في البرلمان العثماني عن أنطاليا بعد 1908."
  en: "Ottoman writer, publisher and calligrapher (1849-1913), a Young Ottoman who ran the Matbaa-i Ebüzziya press and the Mecmua-i Ebüzziya journal, produced the first Western-style anthology of Ottoman literature, was exiled to Rhodes and Konya, and sat in the Ottoman parliament for Antalya after 1908."
