summary:
  ar: "يوسف منصور ⁦(وُلد في 21 أيار 1944)⁩، رجل أعمال مصري وشريك مالك في مجموعة منصور مع شقيقيه محمد وياسين. درس الهندسة في جامعة ولاية كارولاينا الشمالية وإدارة الأعمال في جامعة أوبرن، ويقيم في القاهرة، وقدّرت فوربس ثروته بنحو 1.9 مليار دولار سنة 2020."
  en: "Youssef Mansour (born 21 May 1944) is an Egyptian billionaire businessman and part owner of the Mansour Group alongside his brothers Mohamed and Yasseen. He studied engineering at North Carolina State University and business administration at Auburn University, lives in Cairo, and was estimated by Forbes to be worth about US$1.9 billion in 2020."
  ur: "یوسف منصور ⁦(پیدائش 21 مئی 1944)⁩ مصری ارب پتی تاجر ہیں اور اپنے بھائیوں محمد اور یاسین کے ساتھ منصور گروپ کے شریک مالک ہیں۔ انہوں نے نارتھ کیرولائنا اسٹیٹ یونیورسٹی سے انجینئرنگ اور اوبرن یونیورسٹی سے بزنس ایڈمنسٹریشن پڑھی، قاہرہ میں رہتے ہیں اور فوربز نے 2020 میں ان کی دولت کا تخمینہ تقریباً 1.9 ارب ڈالر لگایا تھا۔"
  es: "Youssef Mansour (nacido el 21 de mayo de 1944) es un empresario multimillonario egipcio y copropietario del Grupo Mansour junto con sus hermanos Mohamed y Yasseen. Estudió ingeniería en la Universidad Estatal de Carolina del Norte y administración de empresas en la Universidad de Auburn, reside en El Cairo y, según Forbes, su fortuna se estimó en unos 1900 millones de dólares estadounidenses en 2020."
  fr: "Youssef Mansour (né le 21 mai 1944) est un homme d'affaires égyptien milliardaire, copropriétaire du groupe Mansour avec ses frères Mohamed et Yasseen. Ingénieur diplômé de l'Université d'État de Caroline du Nord et en administration des affaires de l'Université d'Auburn, il réside au Caire et sa fortune était estimée à environ 1,9 milliard de dollars américains par Forbes en 2020."
  tr: "Youssef Mansour (d. 21 Mayıs 1944), Mısırlı bir iş insanı ve kardeşleri Mohamed ile Yassin ile birlikte Mansour Group'un ortak sahibidir. North Carolina State Üniversitesi'nde mühendislik ve Auburn Üniversitesi'nde işletme eğitimi aldı ve Kahire'de yaşamaktadır. Forbes, 2020 yılında servetini yaklaşık 1,9 milyar dolar olarak tahmin etmiştir."
  id: "Youssef Mansour (lahir 21 Mei 1944) adalah seorang pengusaha Mesir dan pemilik bersama Mansour Group bersama saudara-saudaranya Mohamed dan Yassin. Ia belajar teknik di North Carolina State University dan administrasi bisnis di Auburn University, dan tinggal di Kairo. Forbes memperkirakan kekayaannya sekitar $1,9 miliar pada tahun 2020."

