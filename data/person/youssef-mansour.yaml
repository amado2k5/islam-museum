summary:
  ar: "يوسف منصور (وُلد في 21 أيار 1944)، رجل أعمال مصري وشريك مالك في مجموعة منصور مع شقيقيه محمد وياسين. درس الهندسة في جامعة ولاية كارولاينا الشمالية وإدارة الأعمال في جامعة أوبرن، ويقيم في القاهرة، وقدّرت فوربس ثروته بنحو 1.9 مليار دولار سنة 2020."
  en: "Youssef Mansour (born 21 May 1944) is an Egyptian billionaire businessman and part owner of the Mansour Group alongside his brothers Mohamed and Yasseen. He studied engineering at North Carolina State University and business administration at Auburn University, lives in Cairo, and was estimated by Forbes to be worth about US$1.9 billion in 2020."
  ur: "یوسف منصور (پیدائش 21 مئی 1944) مصری ارب پتی تاجر ہیں اور اپنے بھائیوں محمد اور یاسین کے ساتھ منصور گروپ کے شریک مالک ہیں۔ انہوں نے نارتھ کیرولائنا اسٹیٹ یونیورسٹی سے انجینئرنگ اور اوبرن یونیورسٹی سے بزنس ایڈمنسٹریشن پڑھی، قاہرہ میں رہتے ہیں اور فوربز نے 2020 میں ان کی دولت کا تخمینہ تقریباً 1.9 ارب ڈالر لگایا تھا۔"

