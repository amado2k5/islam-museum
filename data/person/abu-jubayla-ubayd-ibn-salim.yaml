summary:
  ar: "أبو جبيلة واسمه عبيد بن سالم بن مالك بن سالم الخزرجي من بني غضب بن جشم، عظيم خزرجي عند ملوك غسان بالشام؛ لما فرّ إليه مالك بن العجلان قاتل الفطيون عاهد الله ألا يمس طيباً ولا يأتي النساء حتى يذل اليهود ويكون الأوس والخزرج أعز أهل يثرب، فسار في جمع وأظهر أنه يريد اليمن فنزل بذي حرض واستدعى وجوه اليهود يظهر لهم الإحسان فأدخلهم رجلاً رجلاً فقتلهم عن آخرهم، فصارت الأوس والخزرج أعز أهل المدينة، ثم رجع إلى الشام {cite:kamil-ibn-al-athir p. 491}."
  en: "Abu Jubayla — Ubayd ibn Salim, a Khazraji magnate at the Ghassanid court: he swore off perfume and women until Yathrib's Jews were humbled, marched down feigning a Yemen campaign, and at Dhi Hard admitted the Jewish notables one by one and killed them all, handing supremacy to Aws and Khazraj {cite:kamil-ibn-al-athir p. 491}."
  fr: "Abu Jubayla — Ubayd ibn Salim, notable khazrajite à la cour ghassanide : il jura de renoncer au parfum et aux femmes jusqu'à ce que les juifs de Yathrib soient humiliés, descendit en feignant une campagne au Yémen, et à Dhi Hard fit entrer les notables juifs un à un et les tua tous, donnant la suprématie aux Aws et aux Khazraj {cite:kamil-ibn-al-athir p. 491}."
  es: "Abu Jubayla — Ubayd ibn Salim, un magnate Khazraji en la corte Ghassanid: renunció al perfume y a las mujeres hasta que los judíos de Yathrib fueron humillados, marchó fingiendo una campaña en Yemen, y en Dhi Hard admitió a los notables judíos uno por uno y los mató a todos, entregando la supremacía a Aws y Khazraj {cite:kamil-ibn-al-athir p. 491}."
  ur: "ابو جبیلہ - عبید بن سلیم، غسانی دربار میں ایک خزرجی سردار: اس نے عطر اور عورتوں کی قسم کھائی یہاں تک کہ یثرب کے یہودی عاجز ہو گئے، یمن کی مہم کا دعویٰ کرتے ہوئے آگے بڑھے، اور ذی ہرد کے مقام پر یہودیوں کے معززین کو ایک ایک کر کے تسلیم کیا اور ان سب کو قتل کر دیا، بالادستی اور خزرج کے حوالے کر دی۔ {حوالہ: کامل ابن الاثیر ص۔ 491}۔"
  tr: "Adı Ubayd ibn Salim ibn Malik ibn Salim el-Hazare olan Ebu Cübeyle, Beni Gadab ibn Cuşam kabilesinden olup, Levant'taki Gassanî kralları arasında büyük bir Hazrebi idi. Fatiyun'un katili Malik ibn el-Ajlan ona sığındığında, Yahudileri ve Evs ile Hazrebileri aşağılayana ve onları Yathrib'in en saygın halkı yapana kadar parfüm sürmeyeceğine ve kadınlarla birlikte olmayacağına Allah'a yemin etti. Böylece bir grupla yola çıktı ve Yemen'e gitmek istiyormuş gibi yaptı. Zü Harad'da kamp kurdu ve Yahudi liderlerini çağırdı, onlara iyilik gösterdi ve onları teker teker getirip hepsini öldürdü. Böylece Evs ve Hazrebiler Medine'nin en saygın halkı oldu. Sonra Levant'a geri döndü. {kaynak: Kamil ibn el-Athir s. 491}"
  id: "Abu Jubaylah, yang bernama Ubayd ibn Salim ibn Malik ibn Salim al-Khazraji dari Bani Ghadab ibn Jusham, adalah seorang Khazraji besar di antara raja-raja Ghassanid di Levant. Ketika Malik ibn al-Ajlan, pembunuh Fatiyun, melarikan diri kepadanya, ia bersumpah kepada Tuhan bahwa ia tidak akan menyentuh parfum atau pergi kepada wanita sampai ia mempermalukan orang-orang Yahudi dan Aws serta Khazraj menjadi orang-orang yang paling dihormati di Yathrib. Maka ia berangkat dengan sekelompok orang dan berpura-pura ingin pergi ke Yaman. Ia berkemah di Dhu Haradh dan memanggil para pemimpin Yahudi, menunjukkan kebaikan kepada mereka, dan membawa mereka satu per satu dan membunuh mereka semua. Dengan demikian Aws dan Khazraj menjadi orang-orang yang paling dihormati di Madinah. Kemudian ia kembali ke Levant. {cite:kamil-ibn-al-athir p. 491}"
