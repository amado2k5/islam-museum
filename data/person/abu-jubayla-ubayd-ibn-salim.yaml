summary:
  ar: "أبو جبيلة واسمه عبيد بن سالم بن مالك بن سالم الخزرجي من بني غضب بن جشم، عظيم خزرجي عند ملوك غسان بالشام؛ لما فرّ إليه مالك بن العجلان قاتل الفطيون عاهد الله ألا يمس طيباً ولا يأتي النساء حتى يذل اليهود ويكون الأوس والخزرج أعز أهل يثرب، فسار في جمع وأظهر أنه يريد اليمن فنزل بذي حرض واستدعى وجوه اليهود يظهر لهم الإحسان فأدخلهم رجلاً رجلاً فقتلهم عن آخرهم، فصارت الأوس والخزرج أعز أهل المدينة، ثم رجع إلى الشام {cite:kamil-ibn-al-athir p. 491}."
  en: "Abu Jubayla — Ubayd ibn Salim, a Khazraji magnate at the Ghassanid court: he swore off perfume and women until Yathrib's Jews were humbled, marched down feigning a Yemen campaign, and at Dhi Hard admitted the Jewish notables one by one and killed them all, handing supremacy to Aws and Khazraj {cite:kamil-ibn-al-athir p. 491}."
