summary:
  ar: "قارئ وعالم سعودي (1953–2005)، إمام المسجد الحرام رسمياً بين 1981 و1983 وضيفاً في رمضان بين 1986 و1989، ومحاضر في الفقه المقارن بجامعة الملك عبد العزيز بجدة، لُقّب بإمام الملك واشتهر بتلاوته الشجية."
  en: "Saudi reciter and scholar (1953–2005), official imam of Masjid al-Haram from 1981 to 1983 and Ramadan guest imam from 1986 to 1989, lecturer in comparative fiqh at King Abdulaziz University in Jeddah, known as the King's Imam and famed for his melodic recitation."
  ur: "سعودی قاری اور عالم (1953ء–2005ء)، 1981ء سے 1983ء تک مسجد الحرام کے سرکاری امام اور 1986ء سے 1989ء تک رمضان کے مہمان امام، جدہ کی کنگ عبدالعزیز یونیورسٹی میں فقہ مقارن کے مدرس، بادشاہ کے امام کے لقب اور دلکش تلاوت کے لیے مشہور۔"
