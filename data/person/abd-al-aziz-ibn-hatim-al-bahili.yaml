summary:
  ar: "عبد العزيز بن حاتم بن النعمان بن عمرو الباهلي؛ عند البلاذري: ولّى أرمينية بعد أخيه عبد الله بن حاتم الذي مات بها عاملاً لمعاوية فبنى مدينة دبيل وحصّنها وكبّر مسجدها وبنى مدينة النشوى ورمّ مدينة برذعة — ويقال جدّد بناءها — وأحكم حفر الفارقين حولها وجدّد بناء مدينة البيلقان وكانت هذه المدن متشعثة مستهدمة؛ وقال الواقدي بنى عبد الملك مدينة برذعة على يد حاتم بن النعمان الباهلي أو ابنه."
  en: "Abd al-Aziz ibn Hatim ibn al-Nu'man ibn Amr al-Bahili; in al-Baladhuri: he governed Armenia after his brother Abdallah ibn Hatim, who had died there as Mu'awiya's governor, and built the city of Dabil, fortified it and enlarged its mosque, built the city of Nashwa, repaired Bardha'a — or, it is said, renewed its building — dug the two Fariq moats about it soundly, and renewed the city of al-Baylaqan, these cities having been ruined and decayed; al-Waqidi says Abd al-Malik built Bardha'a by the hand of Hatim ibn al-Nu'man al-Bahili or his son."
