id: person/abd-al-aziz-ibn-hatim-al-bahili
class: person
label: { ar: "عبد العزيز بن حاتم بن النعمان الباهلي", en: "Abd al-Aziz ibn Hatim al-Bahili", fr: "Abd al-Aziz ibn Hatim al-Bahili", es: "Abd al-Aziz ibn Hatim al-Bahili", ur: "عبد العزیز بن حاتم الباہلی" }
summary:
  ar: "عبد العزيز بن حاتم بن النعمان بن عمرو الباهلي؛ عند البلاذري: ولّى أرمينية بعد أخيه عبد الله بن حاتم الذي مات بها عاملاً لمعاوية فبنى مدينة دبيل وحصّنها وكبّر مسجدها وبنى مدينة النشوى ورمّ مدينة برذعة — ويقال جدّد بناءها — وأحكم حفر الفارقين حولها وجدّد بناء مدينة البيلقان وكانت هذه المدن متشعثة مستهدمة؛ وقال الواقدي بنى عبد الملك مدينة برذعة على يد حاتم بن النعمان الباهلي أو ابنه."
  en: "Abd al-Aziz ibn Hatim ibn al-Nu'man ibn Amr al-Bahili; in al-Baladhuri: he governed Armenia after his brother Abdallah ibn Hatim, who had died there as Mu'awiya's governor, and built the city of Dabil, fortified it and enlarged its mosque, built the city of Nashwa, repaired Bardha'a — or, it is said, renewed its building — dug the two Fariq moats about it soundly, and renewed the city of al-Baylaqan, these cities having been ruined and decayed; al-Waqidi says Abd al-Malik built Bardha'a by the hand of Hatim ibn al-Nu'man al-Bahili or his son."
  fr: "Abd al-Aziz ibn Hatim ibn al-Nu'man ibn Amr al-Bahili ; selon al-Baladhuri, il gouverna l'Arménie après son frère Abdallah ibn Hatim, mort là-bas comme gouverneur de Mu'awiya, et bâtit la ville de Dabil, la fortifia et agrandit sa mosquée, bâtit la ville de Nashwa, répara Bardha'a — ou, dit-on, en renouvela la construction —, creusa solidement autour d'elle les deux fossés de Fariq, et renouvela la ville d'al-Baylaqan, ces villes étant ruinées et délabrées ; al-Waqidi dit qu'Abd al-Malik bâtit Bardha'a par la main de Hatim ibn al-Nu'man al-Bahili ou de son fils."
  es: "Abd al-Aziz ibn Hatim ibn al-Nu'man ibn Amr al-Bahili; en al-Baladhuri: gobernó Armenia después de su hermano Abdallah ibn Hatim, que había muerto allí como gobernador de Mu'awiya, y construyó la ciudad de Dabil, la fortificó y amplió su mezquita, construyó la ciudad de Nashwa, reparó Bardha'a —o, según se dice, renovó su construcción— cavó sólidamente los dos fosos de Fariq a su alrededor, y renovó la ciudad de al-Baylaqan, ya que estas ciudades estaban en ruinas y deterioradas; al-Waqidi dice que Abd al-Malik construyó Bardha'a por mano de Hatim ibn al-Nu'man al-Bahili o de su hijo."
  ur: "عبد العزیز بن حاتم ابن النعمان ابن عمرو الباہلی۔ البلادوری میں ہے: اس نے اپنے بھائی عبداللہ ابن حاتم کے بعد آرمینیا پر حکومت کی، جو وہاں معاویہ کے گورنر کے طور پر مر گیا تھا، اور دبیل شہر تعمیر کیا، اس کی قلعہ بندی کی اور اس کی مسجد کو بڑھایا، نسوا شہر تعمیر کیا، بردعہ کی مرمت کی- یا کہا جاتا ہے کہ اس کی عمارت کی تجدید کی گئی- اس کے بارے میں دو شہر فارق کھودے گئے اور اس کے بارے میں آواز بلند کی۔ البیلقان، یہ شہر ویران اور بوسیدہ ہو چکے ہیں۔ الواقدی کہتے ہیں کہ عبد الملک نے بردعہ کو حاتم بن نعمان الباہلی یا اس کے بیٹے کے ہاتھ سے بنایا تھا۔"
  tr: "Abdul Aziz bin Hatim bin Al-Nu’man bin Amr Al-Bahili; Al-Baladhuri'ye göre: Kardeşi Abdullah bin Hatim'in orada ölmesinin ardından Muaviye'nin ajanı olarak Ermenistan valiliğine atandı. Dabil şehrini inşa etti ve güçlendirdi, camisini genişletti, Al-Nashwa şehrini inşa etti ve Bardha'a şehrini onardı -ve hatta yeniden inşa ettiği söylenir- ve çevresindeki iki barajın kazısını güçlendirdi ve Al-Baylqan şehrinin inşasını yeniden başlattı. Bu şehirler dağınık ve harap haldeydi. Al-Waqidi, Abdul Malik'in Bardha'a şehrini Hatim bin Al-Nu’man Al-Bahili veya oğlu aracılığıyla inşa ettiğini söyledi."
  id: "Abdul Aziz bin Hatim bin Al-Nu’man bin Amr Al-Bahili; menurut Al-Baladhuri: Ia diangkat menjadi gubernur Armenia setelah saudaranya Abdullah bin Hatim, yang meninggal di sana, sebagai agen Mu’awiya. Ia membangun kota Dabil dan membentenginya, memperbesar masjidnya, membangun kota Al-Nashwa, dan memperbaiki kota Bardha’a — dan dikatakan bahwa ia memperbarui pembangunannya — dan ia memperkuat penggalian dua bendungan di sekitarnya dan memperbarui pembangunan kota Al-Baylqan. Kota-kota ini tersebar dan rusak. Al-Waqidi mengatakan bahwa Abdul Malik membangun kota Bardha’a di tangan Hatim bin Al-Nu’man Al-Bahili atau putranya."
