summary:
  ar: "سياسي ليبي (1952–2020)، خبير تخطيط استراتيجي تدرّب في القاهرة وبيتسبرغ. ترأس مجلسَي التخطيط الوطني والتطوير الاقتصادي في ليبيا (2007–2011)، ثم ترأس المكتب التنفيذي للمجلس الوطني الانتقالي رئيسًا مؤقتًا للوزراء أثناء إسقاط نظام القذافي (2011)، وأسس تحالف القوى الوطنية وقاده حتى وفاته بالقاهرة."
  en: "Libyan politician (1952–2020), a strategic-planning specialist trained at Cairo and Pittsburgh. He headed Libya's National Planning Council and National Economic Development Board (2007–2011), then chaired the National Transitional Council's executive board as interim prime minister during the overthrow of the Gaddafi regime (2011), and founded and led the National Forces Alliance until his death in Cairo."
  ur: "لیبیائی سیاست دان (1952–2020)، قاہرہ اور پٹسبرگ سے تعلیم یافتہ اسٹریٹجک منصوبہ بندی کے ماہر۔ انہوں نے لیبیا کی قومی منصوبہ بندی کونسل اور قومی اقتصادی ترقی بورڈ کی سربراہی کی (2007–2011)، پھر قذافی حکومت کے خاتمے کے دوران قومی عبوری کونسل کے ایگزیکٹو بورڈ کے چیئرمین بطورِ عبوری وزیرِ اعظم رہے (2011)، اور وفات تک قومی قوتوں کے اتحاد کی قیادت کی۔"
