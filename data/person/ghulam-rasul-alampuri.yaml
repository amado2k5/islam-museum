summary:
  ar: "شاعر بنجابي (1849–1892) من عالم بور في قضاء هوشياربور، من أسرة غوجرية. علّم في مدارس القرى حتى 1882، واشتهر بملحمته «داستان أمير حمزة» (1869) وبمنظومته «أحسن القصص» (1873) في قصة يوسف وزليخا. وصفه مدخل الموسوعة الإسلامية (EI3) بأنه لم يكن منتسباً إلى أي طريقة صوفية، خلافاً لكثير من شعراء البنجاب."
  en: "Punjabi poet (1849–1892) of Alampur in Hoshiarpur district, from a Gujjar family. He taught in village schools until 1882 and is known for his epic Dastan-i Amir Hamza (1869) and Ahsan al-Qasas (1873), his verse rendering of Yusuf and Zulaikha. Shackle's Encyclopaedia of Islam entry notes that, unlike many Punjabi poets, he was not affiliated with any Sufi order."
  ur: "پنجابی شاعر (1849ء–1892ء) عالم پور، ضلع ہوشیارپور سے، گوجر خاندان سے تعلق۔ 1882ء تک دیہی اسکولوں میں پڑھایا؛ مشہور تصانیف «داستان امیر حمزہ» (1869ء) اور «احسن القصص» (1873ء) ہیں، جو یوسف زلیخا کے قصے کی منظوم صورت ہے۔ انسائیکلوپیڈیا آف اسلام (EI3) کے مطابق وہ اکثر پنجابی شعرا کے برعکس کسی صوفی سلسلے سے وابستہ نہ تھے۔"
