id: person/zayn-al-din-yusuf-irbil
class: person
label: { ar: "زين الدين يوسف صاحب إربل", en: "Zayn al-Din Yusuf, lord of Irbil", es: "Zayn al-Din Yusuf, lord of Irbil", fr: "Zayn al-Din Yusuf, lord of Irbil", ur: "زین الدین یوسف، اربیل کا آقا" }
summary:
  ar: "زين الدين يوسف بن زين الدين علي صاحب إربل؛ حضر عند صلاح الدين بعساكره فمرض ومات ثامن عشر شهر رمضان سنة ست وثمانين وخمسمائة، ولم يكن له أخ غير مظفر الدين ولا ولد؛ كاتب أهل إربل مجاهد الدين قايماز — لهواهم فيه وحسن سيرته — يطلبونه ليملكوه فلم يجسر خوفاً من صلاح الدين، فأقطع صلاح الدين إربل لمظفر الدين وأضاف إليها شهرزور وأعمالها ودربند قربابلي وبني قفجاق نزولاً عن حران والرها {cite:kamil-ibn-al-athir p. 199}."
  en: "Lord of Irbil — died 18 Ramadan 586 in Saladin's camp leaving no son; its people wrote to Mujahid al-Din Qaymaz begging him to rule them for their love of him, but none dared move against Saladin's will, and Irbil went to the dead man's brother Muzaffar al-Din in exchange for Harran and Edessa {cite:kamil-ibn-al-athir p. 199}."
  es: "Señor de Irbil — murió el 18 de Ramadán de 586 en el campamento de Saladino sin dejar hijos; su gente escribió a Mujahid al-Din Qaymaz rogándole que los gobernara por el amor que le tenían, pero nadie se atrevió a ir en contra de la voluntad de Saladino, e Irbil pasó al hermano del difunto, Muzaffar al-Din, a cambio de Harran y Edesa {cite:kamil-ibn-al-athir p. 199}."
  fr: "Seigneur d'Erbil — mort le 18 Ramadan 586 dans le camp de Saladin sans laisser de fils; ses habitants écrivirent à Mujahid al-Din Qaymaz pour le supplier de les gouverner par amour pour lui, mais personne n'osa s'opposer à la volonté de Saladin, et Erbil passa au frère du défunt, Muzaffar al-Din, en échange de Harran et d'Édesse {cite:kamil-ibn-al-athir p. 199}."
  ur: "اربیل کے رب - 18 رمضان 586 کو صلاح الدین کے کیمپ میں وفات پا گئے اور کوئی بیٹا نہیں چھوڑا۔ اس کے لوگوں نے مجاہد الدین قائماز کو خط لکھا کہ وہ اس سے ان کی محبت کی وجہ سے ان پر حکومت کرنے کی التجا کرتے ہیں، لیکن کسی نے صلاح الدین کی مرضی کے خلاف حرکت کرنے کی ہمت نہ کی اور اربیل حران اور ایڈیسا کے بدلے مردہ شخص کے بھائی مظفر الدین کے پاس چلا گیا۔ 199}۔"
  tr: "Zeynetin Yusuf ibn Zeyreddin Ali, İrbil'in hükümdarı; Nâlâddin'e askerleriyle katıldı, hastalandı ve beş yüz seksen altıncı Ramazan ayının on sekizinde öldü. Muzafferdin dışında kardeşi yoktu ve oğlu yoktu; Erbil halkının yazarı Mücahiddin Kaymaz—ona olan sevgisi ve iyi davranışları nedeniyle—onu yönetmesi için istedi, ancak Salaheddin'den korktuğu için cesaret edemedi. Salaheddin, Erbil'i Muzaffer al-Din'e böldü ve ona Şehrezur ile onun yaptıklarını, ayrıca Derband Qarbablı ve Harran ile Al-Raha'dan gelen Banu Qifjaq soyunu ekledi {cite:kamil-ibn-al-athir s. 199}."
  id: "Zain al-Din Yusuf ibn Zayn al-Din Ali, penguasa Irbil; ia menghadiri Salah al-Din bersama pasukannya, jatuh sakit, dan meninggal pada tanggal delapan belas Ramadan tahun lima ratus delapan puluh enam. Ia tidak memiliki saudara selain Muzaffar al-Din dan tidak memiliki putra; penulis masyarakat Erbil, Mujahid al-Din Qaymaz—karena kasih sayang mereka kepadanya dan perilaku baiknya—meminta dia untuk memerintahnya, tetapi dia tidak berani karena takut pada Salah al-Din. Salah al-Din memisahkan Erbil dengan Muzaffar al-Din dan menambahkan Shahrazur dan perbuatannya, serta Darband Qarbabli dan Banu Qifjaq keturunan dari Harran dan Al-Raha {cite:kamil-ibn-al-athir hlm. 199}."
