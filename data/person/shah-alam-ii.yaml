summary:
  ar: "شاه عالم الثاني (25 يونيو 1728 – 19 نوفمبر 1806)، إمبراطور المغول في الهند، ابن عالمكير الثاني، حكم من 1760 إلى 1788 ومن 1788 إلى 1806. بعد هزيمته عند بوكسار منح شركة الهند الشرقية ديواني البنغال بمعاهدة الله آباد سنة 1765، وفي 1788 سمل غلام قادر عينيه وهو أسيره. كان شاعراً يكتب بتخلّص «آفتاب»، وله ديوان شعر وكتاب «عجائب القصص» في النثر الأردي المبكر، وتوفي في دلهي."
  en: "Shah Alam II (25 June 1728 – 19 November 1806) was Mughal emperor, a son of Alamgir II, reigning from 1760 to 1788 and again from 1788 to 1806. Defeated at Buxar, he granted the East India Company the Diwani of Bengal by the Treaty of Allahabad in 1765; in 1788, his prisoner Ghulam Qadir blinded him. He was a poet under the pen name Aftab, author of a Diwan and of the early Urdu prose work Ajaib-ul-Qasas, and he died at Delhi."
  ur: "شاہ عالم ثانی (25 جون 1728ء – 19 نومبر 1806ء) مغلیہ سلطنت کے بادشاہ، عالمگیر ثانی کے فرزند، 1760ء سے 1788ء اور پھر 1788ء سے 1806ء تک تخت نشین رہے۔ بکسر کی شکست کے بعد آپ نے 1765ء کے معاہدۂ الٰہ آباد کے ذریعے ایسٹ انڈیا کمپنی کو بنگال کی دیوانی عطا کی؛ 1788ء میں غلام قادر نے قید میں آپ کی آنکھیں نکال دیں۔ آپ «آفتاب» تخلص کے شاعر تھے، آپ کا دیوان اور ابتدائی اردو نثر کی کتاب «عجائب القصص» آپ کی یادگار ہے؛ آپ کی وفات دہلی میں ہوئی۔"

