  ar: "زياد القصير الخزاعي؛ قاتله يزيد بن هزيل كل العزي موجه موسى بن عبد الله بن خازم فأصابه فلما طلب الغرة ضربه بالسيف على رأسه فعاش سبعة أيام ثم مات."
  en: "Ziyad al-Qasir al-Khuza'i; struck down by Musa's man Yazid ibn Huzayl — quarter asked, he gave a head-blow instead, and Yazid died of it seven days on."
  es: "Ziyad al-Qasir al-Khuza'i fue derribado por Yazid ibn Huzayl, hombre de Musa. Al pedirle clemencia, le propinó un golpe en la cabeza, y Yazid murió siete días después."
  fr: "Ziyad al-Qasir al-Khuza'i; frappé par Yazid ibn Huzayl, l'homme de Musa — on lui a demandé de le frapper en quartier, mais il lui a donné un coup à la tête, et Yazid en est mort sept jours plus tard."
  ur: "زیاد القصیر الخزاعی; موسیٰ کے آدمی یزید بن حزیل کے ہاتھوں مارا گیا - چوتھائی نے پوچھا، اس کے بجائے اس نے سر پر ضرب لگائی، اور یزید اس سے سات دن بعد مر گیا۔"
