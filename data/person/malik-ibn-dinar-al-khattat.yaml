  tr: "Banu Samah ibn Lu'ayy ibn Ghalib olarak bilinen ve Banu Samah kökenli bir kadının özgür bırakılmış Malik ibn Dinar, ücret karşılığında Kur'an yazardı ve yüz otuz yılda öldü {atıf:fihrist-ibn-al-nadim s. 16}."
  id: "Malik ibn Dinar, seorang mantan dari seorang wanita dari Banu Samah ibn Lu'ayy ibn Ghalib, yang dikenal sebagai Abu Yahya, biasa menulis Al-Qur'an dengan bayaran dan meninggal pada tahun seratus tiga puluh {cite:fihrist-ibn-al-nadim hlm. 16}."
