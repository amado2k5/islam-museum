summary:
  ar: "بطاقة أولية لمحمد بيكرة، سلطان كجرات من سنة ١٤٥٨م إلى ١٥١١م وأعظم سلاطينها الذي مدّ الدولة وفتح جونغده وجامبير؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Mahmud Begada, the sultan of Gujarat from 1458 to 1511 and its greatest ruler, who extended the realm and took Junagadh and Champaner; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Mahmud Begada, sultán de Gujarat desde 1458 hasta 1511 y su gobernante más importante, quien extendió el reino y tomó Junagadh y Champaner; la entrada del manual dinástico aún no se ha verificado en la página."
  fr: "Fiche de projet pour Mahmud Begada, sultan du Gujarat de 1458 à 1511 et son plus grand souverain, qui étendit le royaume et prit Junagadh et Champaner; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "1458 سے 1511 تک گجرات کے سلطان اور اس کے سب سے بڑے حکمران محمود بیگدا کے لیے ڈرافٹ کارڈ، جس نے سلطنت کو بڑھایا اور جوناگڑھ اور چمپانیر پر قبضہ کیا۔ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1458-1511 yılları arasında Gujarat Sultanı ve devleti genişleten, Jongde ve Jambir'i fetheden en büyük sultanı Muhammed Bikra'nın ön kartı; İslam Devletleri Sözlükleri'nde bahsedilmekte ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Muhammad Bikra, Sultan Gujarat dari tahun 1458 M hingga 1511 M dan sultan terbesarnya yang memperluas negara dan menaklukkan Jongde serta Jambir; kartu ini disebutkan dalam Kamus Negara-Negara Islam dan biografinya belum pernah ditinjau di halaman tersebut."
