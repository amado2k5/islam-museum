    note: "Attested of Seku Amadu personally by independent sources. (1) The English article states that he was a pupil of the Qadiriyya Sufi teacher Sidi Mukhtar al-Kunti, and that the literate Fulbe Muslims who backed his jihad were influenced by the Sufi revival (citing Hunwick 2004 and Hiskett 1976). (2) The French article calls him in its lead a Fulbe marabout and adherent of the Qadiriyya ('adepte de la Qadiriyya') and says he was initiated into the Qadiriyya by the Sufi Kabara Farma (citing Boly's 2013 thesis) — the initiator's name differs from the English article's teacher, but the personal Qadiriyya adherence is the same attestation from a separate source family. (3) The French Macina Empire article states that its founder was a member of the Qadiriyya Sufi confraternity. No sunni or sunni-maliki segment is recorded: the Maliki character the sources describe is that of his state's law — the English article says the law was based on the strict Maliki interpretation of Sharia, the French Macina article speaks of a rigorous application of Maliki Sharia, and the English Massina article calls the state itself a Sunni Muslim caliphate — and by the lane rule a state's law and a state's description are political facts, not a personal school attestation; no source read attests a madhhab of the man personally with a second independent source, so under the two-source rule and the doubt rule none is added, and that position is stated here in full."
    sources: [source/wikipedia-seku-amadu-en, source/wikipedia-seku-amadu-fr, source/wikipedia-empire-du-macina-fr, source/wikipedia-massina-empire-en]
