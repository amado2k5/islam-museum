summary:
  ar: "شيخو أحمدو (أحمد بن محمد لبو، ح. 1776 – 1845)، مؤسس إمبراطورية ماسينا (دينا حمد الله) في دلتا النيجر الداخلية بمالي الحالية وحاكمها بلقب الإمام (ألمامي) من 1818 إلى وفاته. مرابط فولاني منتمٍ إلى القادرية، تتلمذ عند سيدي المختار الكنتي بحسب المصادر الإنجليزية وابتدأ في الطريقة على يد كابارا فارما بحسب المصادر الفرنسية، وقاد جهادا أسقط حكم البمبارا وأسس دولة ثيوقراطية عاصمتها حمد الله، حكمت بقضاء مالكي صارم، ووسّع نفوذها إلى جني وتمبكتو، وخلفه ابنه أحمدو الثاني ثم حفيده أحمدو الثالث."
  en: "Seku Amadu (Ahmadu ibn Muhammadu Lobbo, c. 1776 – 1845), founder of the Massina Empire (the Diina of Hamdullahi) in the Inner Niger Delta of present-day Mali and its ruler, with the title Almami, from 1818 until his death. A Fulbe marabout of the Qadiriyya — taught, on the English sources, by Sidi Mukhtar al-Kunti, and initiated, on the French sources, by Kabara Farma — he led the jihad that overthrew Bambara overlordship and founded a theocratic state at Hamdullahi, governed under a strict Maliki application of Sharia, extending his authority to Djenné and Timbuktu; his son Amadu II and then his grandson Amadu III succeeded him."
  ur: "شیکھو احمدو (احمد بن محمد لوبو، تقریباً 1776ء – 1845ء)، موجودہ مالی کے اندرونی نائجر ڈیلٹا میں سلطنتِ ماسینا (دینۂ حمد اللہ) کے بانی اور 1818ء سے وفات تک «المامی» کے لقب سے اس کے حکمران۔ وہ قادریہ سے وابستہ فولبے مرابط تھے — انگریزی مآخذ کے مطابق سیدی المختار الکُنتی کے شاگرد اور فرانسیسی مآخذ کے مطابق کابارا فارما کے ہاتھوں طریقے میں داخل ہوئے — انہوں نے بمبارا اقتدار کے خلاف جہاد کی قیادت کی اور حمد اللہ میں ایسی دینی ریاست قائم کی جو مالکی شریعت کے سخت نفاذ سے چلتی تھی اور جس کا اثر جینے اور تمبکٹو تک پھیلا؛ ان کے بعد بیٹے احمدو ثانی اور پھر پوتے احمدو ثالث جانشین ہوئے۔"
