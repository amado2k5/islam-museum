summary:
  ar: "محمد بن صفدر الحسيني، جمال الدين الأفغاني ⁦(١٨٣٨–١٨٩٧م)⁩؛ وصفه الزركلي بأنه «فيلسوف الإسلام في عصره» وأحد الذين قامت على سواعدهم نهضة الشرق الحديثة. ولد في أسعدآباد بأفغانستان، ورحل إلى الهند فبرع في العلوم العقلية والنقلية، وحج سنة ١٢٧٣هـ، ثم أقام في الآستانة وانتظم في سلك رجال الحكومة، وقصد مصر فبث فيها روح نهضة إصلاحية وتتلمذ له الشيخ محمد عبده، فنفته الحكومة المصرية إلى باريس فأنشأ مع تلميذه جريدة «العروة الوثقى»، ثم رحل رحلات طويلة ودُعي إلى الآستانة فتوفي فيها. كان يجيد العربية والأفغانية والفارسية والتركية والفرنسية والإنكليزية والروسية، ولم يكثر من التصنيف؛ من آثاره «رسالة الرد على الدهريين» ترجمها إلى العربية تلميذه الإمام الشيخ محمد عبده {cite:al-aalam tarjama}."
  en: "Jamal al-Din al-Afghani (1838–1897 CE) — al-Zirikli's 'philosopher of Islam in his age', co-founder with his pupil Muhammad Abduh of the Paris journal al-Urwa al-Wuthqa {cite:al-aalam tarjama}."
  es: "Jamal al-Din al-Afghani (1838–1897 d. C.) — el \"filósofo del Islam de su época\" según al-Zirikli, cofundador junto con su discípulo Muhammad Abduh de la revista parisina al-Urwa al-Wuthqa {cite:al-aalam tarjama}."
  fr: "Jamal al-Din al-Afghani (1838–1897 CE) — le « philosophe de l'Islam de son époque » selon al-Zirikli, cofondateur avec son élève Muhammad Abduh de la revue parisienne al-Urwa al-Wuthqa {cite:al-aalam tarjama}."
  ur: "جمال الدین الافغانی ⁦(1838-1897 عیسوی)⁩ - الزرکلی کا 'اپنے دور میں اسلام کا فلسفی'، پیرس کے جریدے العروۃ الوثقہ کے اپنے شاگرد محمد عبدوح کے ساتھ شریک بانی۔"
  tr: "Muhammed bin Safdar el-Hüseyni, Cemaleddin el-Afganî (1838–1897); el-Zerkali onu 'kendi döneminin İslam filozofu' ve modern Doğu rönesansının temelini atanlardan biri olarak tanımlamıştır. Afganistan'ın Esedad kentinde doğdu ve Hindistan'a seyahat etti; burada akılcı ve aktarım bilimlerinde üstün başarı gösterdi. 1273 Hicri'de Hac yaptı, ardından İstanbul'a yerleşti, devlet görevlilerine katıldı ve Mısır'a giderek reformist bir rönesans başlattı, Şeyh Muhammed Abduh tarafından eğitildi. Mısır hükümeti onu Paris'e sürgün etti; burada öğrencisiyle birlikte 'El-Urvah el-Vuthqa' gazetesini kurdu. Daha sonra uzun yolculuklara çıktı ve İstanbul'a davet edildi; burada vefat etti. Arapça, Afganca, Farsça, Türkçe, Fransızca, İngilizce ve Rusça'yı akıcı şekilde konuşuyordu ve çok fazla yazmadı; eserleri arasında öğrencisi İmam Şeyh Muhammed Abduh tarafından Arapçaya çevrilen \"Diahristlere Çürütme İncesi\" bulunmaktadır {kaynak:al-aalam tarjama}."
  id: "Muhammad ibn Safdar al-Husayni, Jamal al-Din al-Afghani (1838–1897 M); al-Zarkali menggambarkannya sebagai 'filsuf Islam pada zamannya' dan salah satu dari mereka yang menegakkan renaisans Timur modern. Ia lahir di Asadabad, Afghanistan, dan melakukan perjalanan ke India, di mana ia unggul dalam ilmu rasional dan ilmu transmisi. Ia melaksanakan Haji pada tahun 1273 H, kemudian menetap di Istanbul, bergabung dengan jajaran pejabat pemerintah, dan pergi ke Mesir, di mana ia menanamkan renaisans reformis dan belajar dari Sheikh Muhammad Abduh. Pemerintah Mesir mengasingkannya ke Paris, di mana ia mendirikan surat kabar 'Al-Urwah al-Wuthqa' bersama muridnya. Ia kemudian melakukan perjalanan panjang dan diundang ke Istanbul, di mana ia meninggal dunia. Ia fasih berbahasa Arab, Afganistan, Persia, Turki, Prancis, Inggris, dan Rusia, dan tidak banyak menulis; di antara karyanya adalah \"Risalah Penolakan kepada para Diahris,\" yang diterjemahkan ke dalam bahasa Arab oleh muridnya Imam Sheikh Muhammad Abduh {cite:al-aalam tarjama}."
