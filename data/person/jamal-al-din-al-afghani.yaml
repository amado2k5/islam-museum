summary:
  ar: "محمد بن صفدر الحسيني، جمال الدين الأفغاني (١٨٣٨–١٨٩٧م)؛ وصفه الزركلي بأنه «فيلسوف الإسلام في عصره» وأحد الذين قامت على سواعدهم نهضة الشرق الحديثة. ولد في أسعدآباد بأفغانستان، ورحل إلى الهند فبرع في العلوم العقلية والنقلية، وحج سنة ١٢٧٣هـ، ثم أقام في الآستانة وانتظم في سلك رجال الحكومة، وقصد مصر فبث فيها روح نهضة إصلاحية وتتلمذ له الشيخ محمد عبده، فنفته الحكومة المصرية إلى باريس فأنشأ مع تلميذه جريدة «العروة الوثقى»، ثم رحل رحلات طويلة ودُعي إلى الآستانة فتوفي فيها. كان يجيد العربية والأفغانية والفارسية والتركية والفرنسية والإنكليزية والروسية، ولم يكثر من التصنيف؛ من آثاره «رسالة الرد على الدهريين» ترجمها إلى العربية تلميذه الإمام الشيخ محمد عبده {cite:al-aalam tarjama}."
  en: "Jamal al-Din al-Afghani (1838–1897 CE) — al-Zirikli's 'philosopher of Islam in his age', co-founder with his pupil Muhammad Abduh of the Paris journal al-Urwa al-Wuthqa {cite:al-aalam tarjama}."
