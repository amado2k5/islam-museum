summary:
  ar: "مير نظام علي خان، آصف جاه الثاني (7 مارس 1734 – 6 أغسطس 1803)، نظام حيدر آباد من 1762 إلى 1803، والابن الرابع لمؤسس الدولة آصف جاه الأول. رسّخ سلطة الدولة في الدكن عبر حروب طويلة مع الماراثا، وبعد سقوط ميسور دخل سنة 1798 في الحلف التبعي مع شركة الهند الشرقية البريطانية، فصارت حيدر آباد أكبر دولة أميرية في الهند. توفي في قصر تشومهالا بحيدر آباد."
  en: "Mir Nizam Ali Khan, Asaf Jah II (7 March 1734 – 6 August 1803), was Nizam of Hyderabad from 1762 to 1803 and the fourth son of the state's founder, Asaf Jah I. He consolidated Hyderabad's power in the Deccan through long wars with the Marathas, and after the fall of Mysore entered the subsidiary alliance with the British East India Company in 1798, making Hyderabad the largest princely state in India. He died at Chowmahalla Palace, Hyderabad."
  ur: "میر نظام علی خان، آصف جاہ ثانی (7 مارچ 1734ء – 6 اگست 1803ء)، 1762ء سے 1803ء تک حیدر آباد کے نظام اور ریاست کے بانی آصف جاہ اول کے چوتھے فرزند تھے۔ انھوں نے مرہٹوں سے طویل جنگوں کے ذریعے دکن میں ریاست کی طاقت مستحکم کی، اور میسور کے زوال کے بعد 1798ء میں برطانوی ایسٹ انڈیا کمپنی سے ذیلی اتحاد کیا جس سے حیدر آباد ہندوستان کی سب سے بڑی نوابی ریاست بن گئی۔ ان کا انتقال حیدر آباد کے چومحلہ محل میں ہوا۔"

