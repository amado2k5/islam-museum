summary:
  ar: "مير نظام علي خان، آصف جاه الثاني ⁦(7 مارس 1734 – 6 أغسطس 1803)⁩، نظام حيدر آباد من 1762 إلى 1803، والابن الرابع لمؤسس الدولة آصف جاه الأول. رسّخ سلطة الدولة في الدكن عبر حروب طويلة مع الماراثا، وبعد سقوط ميسور دخل سنة 1798 في الحلف التبعي مع شركة الهند الشرقية البريطانية، فصارت حيدر آباد أكبر دولة أميرية في الهند. توفي في قصر تشومهالا بحيدر آباد."
  en: "Mir Nizam Ali Khan, Asaf Jah II (7 March 1734 – 6 August 1803), was Nizam of Hyderabad from 1762 to 1803 and the fourth son of the state's founder, Asaf Jah I. He consolidated Hyderabad's power in the Deccan through long wars with the Marathas, and after the fall of Mysore entered the subsidiary alliance with the British East India Company in 1798, making Hyderabad the largest princely state in India. He died at Chowmahalla Palace, Hyderabad."
  ur: "میر نظام علی خان، آصف جاہ ثانی ⁦(7 مارچ 1734ء – 6 اگست 1803ء)⁩، 1762ء سے 1803ء تک حیدر آباد کے نظام اور ریاست کے بانی آصف جاہ اول کے چوتھے فرزند تھے۔ انھوں نے مرہٹوں سے طویل جنگوں کے ذریعے دکن میں ریاست کی طاقت مستحکم کی، اور میسور کے زوال کے بعد 1798ء میں برطانوی ایسٹ انڈیا کمپنی سے ذیلی اتحاد کیا جس سے حیدر آباد ہندوستان کی سب سے بڑی نوابی ریاست بن گئی۔ ان کا انتقال حیدر آباد کے چومحلہ محل میں ہوا۔"
  es: "Mir Nizam Ali Khan, Asaf Jah II (7 de marzo de 1734 - 6 de agosto de 1803), fue Nizam de Hyderabad desde 1762 hasta 1803 y cuarto hijo del fundador del estado, Asaf Jah I. Consolidó el poder de Hyderabad en el Decán mediante largas guerras contra los Marathas y, tras la caída de Mysore, se alió con la Compañía Británica de las Indias Orientales en 1798, convirtiendo a Hyderabad en el mayor estado principesco de la India. Falleció en el Palacio de Chowmahalla, en Hyderabad."
  fr: "Mir Nizam Ali Khan, Asaf Jah II (7 mars 1734 – 6 août 1803), fut Nizam d'Hyderabad de 1762 à 1803 et le quatrième fils du fondateur de l'État, Asaf Jah I. Il consolida la puissance d'Hyderabad dans le Deccan par de longues guerres contre les Marathes, et après la chute de Mysore, il conclut une alliance subsidiaire avec la Compagnie britannique des Indes orientales en 1798, faisant d'Hyderabad le plus grand État princier d'Inde. Il mourut au palais de Chowmahalla, à Hyderabad."
  tr: "Mir Nizam Ali Khan, Asaf Jah II (7 Mart 1734 – 6 Ağustos 1803), 1762'den 1803'e kadar Haydarabad'ın Nizamıydı ve devletin kurucusu Asaf Jah I'in dördüncü oğluydu. Marathalarla uzun savaşlar yoluyla Dekkan'da devlet otoritesini kurdu ve Mysore'un düşüşünden sonra 1798'de İngiliz Doğu Hindistan Şirketi ile bir vasal ittifakı kurarak Haydarabad'ı Hindistan'ın en büyük prenslik devleti haline getirdi. Haydarabad'daki Chumahalla Sarayı'nda öldü."
  id: "Mir Nizam Ali Khan, Asaf Jah II (7 Maret 1734 – 6 Agustus 1803), adalah Nizam Hyderabad dari tahun 1762 hingga 1803, dan putra keempat dari pendiri negara bagian tersebut, Asaf Jah I. Ia medegkan otoritas negara di Deccan melalui perang panjang dengan Maratha, dan setelah jatuhnya Mysore, ia menjalin aliansi vasal dengan British East India Company pada tahun 1798, menjadikan Hyderabad sebagai negara kerajaan terbesar di India. Ia meninggal di Istana Chumahalla di Hyderabad."

