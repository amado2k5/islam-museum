summary:
  ar: "آخر خلفاء الدولة العثمانية (19 نوفمبر 1922 – 3 مارس 1924)، وهو الخليفة الوحيد الذي انتخبه المجلس الوطني التركي الكبير، ورئيس الأسرة العثمانية في المنفى من 1926 حتى وفاته. وهو ابن السلطان عبد العزيز، وكان وليًّا للعهد من 1918؛ وبعد إلغاء الخلافة عاش في سويسرا وفرنسا، ويُذكر أيضًا بوصفه من أهم رسامي أواخر العهد العثماني."
  en: "Last Ottoman caliph (19 November 1922 – 3 March 1924), the only caliph elected by the Grand National Assembly of Turkey, and head of the Ottoman dynasty in exile from 1926 until his death. A son of Sultan Abdulaziz, he had been crown prince from 1918; after the caliphate was abolished he lived in Switzerland and France, and he is remembered also as one of the most important painters of the late Ottoman period."
  ur: "آخری عثمانی خلیفہ (19 نومبر 1922 تا 3 مارچ 1924)، واحد خلیفہ جو ترکیہ کی مجلسِ کبیرِ ملی کے منتخب کردہ تھے، اور 1926 سے وفات تک جلاوطنی میں عثمانی خاندان کے سربراہ۔ سلطان عبدالعزیز کے فرزند، 1918 سے ولی عہد رہے؛ خلافت کے خاتمے کے بعد سوئٹزرلینڈ اور فرانس میں رہے، اور آخری عثمانی دور کے اہم ترین مصوروں میں شمار ہوتے ہیں۔"
