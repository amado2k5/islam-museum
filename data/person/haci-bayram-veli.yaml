summary:
  ar: "بطاقة أولية لنعمان بن أحمد المعروف بحاجي بيرام ولي، صوفي أنقرة ومؤسس البيرامية في القرن الخامس عشر، توفي سنة ١٤٣٠م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Nu'man ibn Ahmad known as Haci Bayram Veli, the Sufi of Ankara and founder of the Bayramiyya in the fifteenth century, d. 1430; the biographical entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Nu'man ibn Ahmad, conocido como Haci Bayram Veli, el sufí de Ankara y fundador de la Bayramiyya en el siglo XV, fallecido en 1430; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature pour Nu'man ibn Ahmad, connu sous le nom de Haci Bayram Veli, le soufi d'Ankara et fondateur de la Bayramiyya au XVe siècle, décédé en 1430; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "نعمان بن احمد کے لیے ڈرافٹ کارڈ جسے ہاکی بیرام ویلی کہا جاتا ہے، جو انقرہ کے صوفی اور پندرہویں صدی میں بیرامیہ کے بانی تھے۔ 1430; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1430 yılında ölen, Ankara'nın Sufi ve Bayramizm'in kurucusu Hacı Bayram Vali olarak bilinen Nu'man ibn Ahmad'ın ilk kartı; önemli şahsiyetlerin sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Nu'man ibn Ahmad, yang dikenal sebagai Haji Bayram Wali, seorang Sufi Ankara dan pendiri Bayramisme pada abad kelima belas, yang meninggal pada tahun 1430 M; ia disebutkan dalam kamus tokoh-tokoh terkenal dan biografinya belum pernah ditinjau di halaman tersebut."
