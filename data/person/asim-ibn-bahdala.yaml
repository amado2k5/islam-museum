id: person/asim-ibn-bahdala
class: person
label: { ar: "عاصم بن بهدلة", en: "Asim b. Bahdala" }
summary:
  ar: "عاصم بن بهدلة يكنى أبا بكر بن أبي النجود مولى بني جذيمة بن مالك بن نصر بن قعين، في الطبقة الثالثة من الكوفيين بعد يحيى بن وثاب، مات سنة ثمان وعشرين ومائة وقرأ على أبي عبد الرحمن السلمي وزر بن حبيش، وروى عنه أبو بكر بن عياش توفي بالكوفة سنة ثلاث وتسعين ومائة وحفص بن سليمان البزاز وكانت القراءة التي أخذها عن عاصم مرتفعة إلى علي بن أبي طالب رواية أبي عبد الرحمن السلمي {cite:fihrist-ibn-al-nadim p. 74}."
  en: "Kufan reader (d. 128) whose chain rises to ʿAlī via al-Sulami — Hafs and Ibn Ayyash transmit him {cite:fihrist-ibn-al-nadim p. 74}."
