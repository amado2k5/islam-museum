id: person/asim-ibn-bahdala
class: person
label: { ar: "عاصم بن بهدلة", en: "Asim b. Bahdala", es: "Asim b. Bahdala", fr: "Asim b. Bahdala", ur: "عاصم بی۔ بہڈالہ" }
summary:
  ar: "عاصم بن بهدلة يكنى أبا بكر بن أبي النجود مولى بني جذيمة بن مالك بن نصر بن قعين، في الطبقة الثالثة من الكوفيين بعد يحيى بن وثاب، مات سنة ثمان وعشرين ومائة وقرأ على أبي عبد الرحمن السلمي وزر بن حبيش، وروى عنه أبو بكر بن عياش توفي بالكوفة سنة ثلاث وتسعين ومائة وحفص بن سليمان البزاز وكانت القراءة التي أخذها عن عاصم مرتفعة إلى علي بن أبي طالب رواية أبي عبد الرحمن السلمي {cite:fihrist-ibn-al-nadim p. 74}."
  en: "Kufan reader (d. 128) whose chain rises to ʿAlī via al-Sulami — Hafs and Ibn Ayyash transmit him {cite:fihrist-ibn-al-nadim p. 74}."
  es: "Lector de Kufa (m. 128) cuya cadena asciende a ʿAlī a través de al-Sulami — Hafs e Ibn Ayyash lo transmiten {cite:fihrist-ibn-al-nadim p. 74}."
  fr: "Lecteur de Kufan (mort en 128) dont la chaîne remonte à ʿAlī via al-Sulami — Hafs et Ibn Ayyash le transmettent {cite:fihrist-ibn-al-nadim p. 74}."
  ur: "کوفان قاری ⁦(متوفی 128)⁩ جس کا سلسلہ السلمی کے ذریعے علی تک پہنچتا ہے - حفص اور ابن عیاش نے اسے منتقل کیا 74}۔"
  tr: "Banu Cadimah ibn Malik ibn Nasr ibn Ka'in'in özgür kasabası olan Asim bin Bahdalah, Ebu Bekir ibn Ebi Ebi el-Necud olarak bilinir ve Yahya ibn Vathab'dan sonra Kufan halkının üçüncü kuşağına aittir. 128 Hicri yılında öldü ve Ebu Abdülrahman el-Sulami ile Vezir bin Hubayş'in yanında eğitim aldı. Ebu Bekir bin Ayyaş ondan rivayet etmiş ve 193 Hicri yılında Kufa'da ölmüştür. Hafs ibn Süleyman el-Bazzaz ondan rivayet etmiştir. Asim'den aldığı ayet, Ali ibn Ebu Ebu Talib'e atfedilmiştir ve Ebu Abdülrahman el-Sulami tarafından anlatılmıştır {alıntı:fihrist-ibn-al-nadim s. 74}."
  id: "Asim ibn Bahdalah, yang dikenal sebagai Abu Bakr ibn Abi al-Najud, mantan Banu Jadhimah ibn Malik ibn Nasr ibn Qa'in, termasuk generasi ketiga Kufan setelah Yahya ibn Wathab. Ia meninggal pada tahun 128 H dan belajar di bawah bimbingan Abu Abd al-Rahman al-Sulami dan Wazir ibn Hubaysh. Abu Bakr ibn Ayyash menceritakan darinya, dan ia meninggal di Kufa pada tahun 193 H. Hafs ibn Sulayman al-Bazzaz menceritakan darinya. Bacaan yang ia terima dari Asim dikaitkan dengan Ali ibn Abi Talib, diceritakan oleh Abu Abd al-Rahman al-Sulami {cite:fihrist-ibn-al-nadim hlm. 74}."
