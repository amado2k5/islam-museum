roles: [muhaddith]
gender: male
summary:
  ar: "عبد العزيز بن محمد بن عبيد الدراوردي، الجهني بالولاء، المدني، أبو محمد، محدث روى عنه خلق كثير منهم سفيان وشعبة، وأصله من دراورد من قرى خراسان، ولد ومات بالمدينة سنة ١٨٦هـ."
  en: "Abd al-Aziz ibn Muhammad ibn Ubayd al-Darawardi, al-Juhani by clientage, al-Madani, Abu Muhammad, a hadith scholar from whom a great many narrated, among them Sufyan and Shu'ba; his family came from Darawurd, a village of Khurasan, and he was born and died in Medina, dying in 186 AH (802)."
  fr: "Abd al-Aziz ibn Muhammad ibn Ubayd al-Darawardi, al-Juhani par clientèle, al-Madani, Abu Muhammad, traditionniste dont un très grand nombre transmirent, parmi eux Sufyan et Shu'ba ; sa famille venait de Darawurd, village du Khorasan, et il naquit et mourut à Médine, en 186 H (802)."
  es: "Abd al-Aziz ibn Muhammad ibn Ubayd al-Darawardi, al-Juhani por clientela, al-Madani, Abu Muhammad, un erudito de hadices del que muchos narraron, entre ellos Sufyan y Shu'ba; su familia provenía de Darawurd, una aldea de Jorasán, y nació y murió en Medina, falleciendo en el año 186 de la Hégira (802)."
  ur: "عبد العزیز بن محمد بن عبید الدراوردی، الجہنی بذریعہ مؤکل، المدنی، ابو محمد، حدیث کے عالم جن سے بہت سے لوگ روایت کرتے ہیں، ان میں سفیان اور شعبہ؛ ان کا خاندان خراسان کے ایک گاؤں دارورد سے آیا تھا اور وہ مدینہ میں پیدا ہوئے اور 186ھ (802) میں وفات پائی۔"
  tr: "Abdul Aziz bin Muhammed bin Ubaid Al-Darawardi, mezhebinde Al-Juhani, Al-Madani, Abu Muhammed, Sufyan ve Şube dahil olmak üzere birçok kişinin rivayet ettiği bir hadis âlimi. Kökeni Horasan'ın köylerinden Daraward'a dayanmaktadır. Hicri 186 yılında Medine'de doğmuş ve aynı yıl Medine'de vefat etmiştir."
  id: "Abdul Aziz bin Muhammad bin Ubaid Al-Darawardi, Al-Juhani menurut afiliasinya, Al-Madani, Abu Muhammad, seorang ulama hadits yang banyak diriwayatkan oleh orang-orang, termasuk Sufyan dan Shu’bah. Asalnya dari Daraward, salah satu desa di Khorasan. Ia lahir dan wafat di Madinah pada tahun 186 Hijriah."
