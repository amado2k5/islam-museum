summary:
  ar: "القاضي شهاب الدين أحمد بن عبية المقدسي الأثري الشافعي نزيل دمشق، ولد في ثاني عشر ربيع الأول سنة إحدى وثلاثين وثمانمائة واشتغل بالقدس وحصل، وولي قضاء بيت المقدس وامتحن بسبب القمامة — الكنيسة المشهورة التي أُشير إلى هدمها — إذ عاقبه السلطان قايتباي هو وعالم القدس البرهان الأنصاري وغيرهم بسبب هدم الكنيسة حتى حملوا إليه وضُرب بعضهم بين يديه، وشُنّع عليه في ذلك؛ ثم رحل إلى دمشق وقطن بها ووعظ وذكّر الناس، وكان إماماً علماً، ومن شعره في ناعورة: «وناعورةٍ أنتِ فقلتُ لها اقصري أنينكِ هذا زادٌ لاقلبٍ في الحزنِ»؛ توفي بدمشق ليلة السبت ثالث جمادى الأولى سنة خمس وتسعمائة ودفن بباب الصغير شمالي {cite:shadharat-dhahab p. 442, 424}."
  en: "Jerusalem's qadi, b. 831 — tried over the Qumama, the famous church whose demolition Qaytbay punished him, the scholar Burhan al-Ansari and others for, some beaten in the sultan's presence; exiled to Damascus he preached and reminded the people; his verse to a water-wheel survives: 'Na'ura, I told her — cut short your groaning; / this is provision for a grieving heart'; d. Damascus, night of Saturday 3 Jumada I 905, buried north of Bab al-Saghir {cite:shadharat-dhahab p. 442, 424}."
