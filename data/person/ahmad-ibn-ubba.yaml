summary:
  ar: "القاضي شهاب الدين أحمد بن عبية المقدسي الأثري الشافعي نزيل دمشق، ولد في ثاني عشر ربيع الأول سنة إحدى وثلاثين وثمانمائة واشتغل بالقدس وحصل، وولي قضاء بيت المقدس وامتحن بسبب القمامة — الكنيسة المشهورة التي أُشير إلى هدمها — إذ عاقبه السلطان قايتباي هو وعالم القدس البرهان الأنصاري وغيرهم بسبب هدم الكنيسة حتى حملوا إليه وضُرب بعضهم بين يديه، وشُنّع عليه في ذلك؛ ثم رحل إلى دمشق وقطن بها ووعظ وذكّر الناس، وكان إماماً علماً، ومن شعره في ناعورة: «وناعورةٍ أنتِ فقلتُ لها اقصري أنينكِ هذا زادٌ لاقلبٍ في الحزنِ»؛ توفي بدمشق ليلة السبت ثالث جمادى الأولى سنة خمس وتسعمائة ودفن بباب الصغير شمالي {cite:shadharat-dhahab p. 442, 424}."
  en: "Jerusalem's qadi, b. 831 — tried over the Qumama, the famous church whose demolition Qaytbay punished him, the scholar Burhan al-Ansari and others for, some beaten in the sultan's presence; exiled to Damascus he preached and reminded the people; his verse to a water-wheel survives: 'Na'ura, I told her — cut short your groaning; / this is provision for a grieving heart'; d. Damascus, night of Saturday 3 Jumada I 905, buried north of Bab al-Saghir {cite:shadharat-dhahab p. 442, 424}."
  es: "El cadí de Jerusalén, nacido en 831, fue juzgado por la Qumama, la famosa iglesia cuya demolición fue castigada por Qaytbay, junto con el erudito Burhan al-Ansari y otros; algunos fueron golpeados en presencia del sultán. Exiliado a Damasco, predicó y recordó al pueblo la verdad; se conserva su verso a una rueda hidráulica: «Na'ura, le dije: pon fin a tus gemidos; / esto es consuelo para un corazón afligido». Murió en Damasco la noche del sábado 3 de Jumada I de 905 y fue enterrado al norte de Bab al-Saghir {cita: shadharat-dhahab págs. 442, 424}."
  fr: "Le cadi de Jérusalem, né en 831, fut jugé pour la démolition de la Qamama, la célèbre église dont Qaytbay le punit, ainsi que le savant Burhan al-Ansari et d'autres, certains étant battus en présence du sultan. Exilé à Damas, il prêcha et rappela les préceptes au peuple. Son poème à une roue à eau nous est parvenu: « Na'ura, je lui ai dit: cesse tes gémissements; / ceci est une provision pour un cœur affligé ». Il mourut à Damas dans la nuit du samedi 3 Jumada I 905 et fut enterré au nord de Bab al-Saghir (voir: shadharat-dhahab, p. 442, 424)."
  ur: "یروشلم کی قضا، بی. 831 - قماما پر مقدمہ چلایا، مشہور چرچ جس کے انہدام کی قیطبے نے اسے سزا دی، عالم برہان الانصاری اور دیگر کو، کچھ کو سلطان کی موجودگی میں مارا پیٹا گیا۔ دمشق جلاوطنی میں اس نے تبلیغ کی اور لوگوں کو یاد دلایا۔ پانی کے پہیے سے متعلق اس کی آیت زندہ ہے: 'نعورا، میں نے اس سے کہا - اپنی کراہنا کم کرو۔ / یہ غمگین دل کے لیے رزق ہے'؛ d دمشق، ہفتہ 3 جمادی الثانی 905 کی رات، باب الصغیر کے شمال میں مدفون 442، 424}۔"
  tr: "Şam'da ikamet eden kadı Şihab el-Din Ahmed ibn Ubeyye el-Makdisi el-Athari el-Şafii, Hicri 831 yılının Rebiü'l-Evvel ayının on ikinci gününde doğdu. Kudüs'te eğitim gördü ve ilim öğrendi. Kudüs'e kadı olarak atandı ve yıkımı planlanan ünlü kilise nedeniyle sınandı. Sultan Kaybey, kendisini, Kudüs alimi Burhan el-Ensari'yi ve diğerlerini kilisenin yıkımı nedeniyle cezalandırdı. Onlar onun huzuruna getirildi ve bazıları onun önünde dövüldü; bu yüzden kınandı. Daha sonra Şam'a gitti ve orada ikamet ederek insanlara vaaz verdi ve onları uyardı. İlim sahibi bir imamdı. Su çarkı hakkında yazdığı şiirlerinden biri şöyledir: “Sen bir su çarkısın, ben de ona dedim ki: ‘İnlemeyi kes, çünkü bu kederli bir yürek için bir rızıktır.’” Hicri 905 yılında Cemâde el-Ula ayının üçüncü Cumartesi gecesi Şam'da vefat etti ve Bab el-Saghir'e, kuzeye defnedildi. (Kaynak: Shadharat-dhahab, s. 442, 424)"
  id: "Hakim Shihab al-Din Ahmad ibn Ubayyah al-Maqdisi al-Athari al-Shafi’i, penduduk Damaskus, lahir pada tanggal 12 Rabi’ al-Awwal tahun 831 H. Beliau belajar di Yerusalem dan memperoleh ilmu. Beliau diangkat menjadi hakim Yerusalem dan diuji karena masalah sampah—gereja terkenal yang disebut-sebut akan dihancurkan—karena Sultan Qaitbay menghukumnya, ulama Yerusalem Burhan al-Ansari, dan lainnya karena penghancuran gereja tersebut. Mereka dibawa kepadanya, dan beberapa dari mereka dipukuli di hadapannya, dan beliau dicela karena hal itu. Kemudian beliau pergi ke Damaskus dan menetap di sana, berdakwah dan mengingatkan orang-orang. Beliau adalah seorang imam yang berilmu. Di antara puisinya tentang kincir air adalah: “Dan engkau adalah kincir air, maka aku berkata kepadanya, ‘Hentikan ratapanmu, karena ini adalah bekal untuk hati yang berduka.’” Ia wafat di Damaskus pada malam Sabtu, tanggal 3 Jumada al-Ula tahun 905 H, dan dimakamkan di Bab al-Saghir, sebelah utara {cite:shadharat-dhahab hlm. 442, 424}."
