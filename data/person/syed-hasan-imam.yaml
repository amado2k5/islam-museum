summary:
  ar: "محامٍ وسياسي هندي (1871–1933) من نيورا قرب باتنا، الأخ الأصغر لسيد علي إمام. درس القانون في لندن ومارس في محكمة كلكتا العليا ثم صار قاضيًا فيها 1912–1916، ثم مارس في باتنا، ورأس جلسة الكونغرس الوطني الهندي الخاصة في بومباي سنة 1918، وكان رابع مسلم يرأس الكونغرس."
  en: "Indian barrister and politician (1871–1933) from Neora near Patna, younger brother of Syed Ali Imam. He studied law in London, practised and then served as a judge of the Calcutta High Court from 1912 to 1916, then practised at Patna; he presided over the 1918 Bombay special session of the Indian National Congress, the fourth Muslim to head the Congress."
  ur: "پٹنہ کے قریب نیورا سے تعلق رکھنے والے ہندوستانی بیرسٹر اور سیاست دان ⁦(1871ء–1933ء)⁩، سید علی امام کے چھوٹے بھائی۔ انھوں نے لندن میں قانون پڑھا، کلکتہ ہائی کورٹ میں وکالت کی اور 1912ء سے 1916ء تک اس کے جج رہے، پھر پٹنہ میں وکالت کی؛ انھوں نے 1918ء میں بمبئی میں انڈین نیشنل کانگریس کے خصوصی اجلاس کی صدارت کی اور کانگریس کی صدارت کرنے والے چوتھے مسلمان تھے۔"
