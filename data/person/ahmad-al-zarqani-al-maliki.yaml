summary:
  ar: "أحمد بن محمد الزرقاني المالكي، نحوي له حاشية على قواعد الإعراب لابن هشام، ولم تعثر الموسوعة على ترجمة وافية له في المصادر التي بين أيديها، ويُحتمل أنه جد الشيخ عبد الباقي الزرقاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16641}"
  en: "Ahmad ibn Muhammad al-Zarqani al-Maliki, a grammarian with a commentary on Ibn Hisham's Qawa'id al-I'rab. The book found no full biography in the sources it had, and suggests he may be the grandfather of Abd al-Baqi al-Zarqani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16641}"
  fr: "Ahmad ibn Muhammad al-Zarqani al-Maliki, grammairien auteur d'un commentaire des Qawa'id al-I'rab d'Ibn Hisham. Le livre ne trouva pas de biographie complète dans les sources dont il disposait et suggère qu'il pourrait être le grand-père d'Abd al-Baqi al-Zarqani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16641}"
  es: "Ahmad ibn Muhammad al-Zarqani al-Maliki, un gramático con un comentario sobre el Qawa'id al-I'rab de Ibn Hisham. El libro no encontró una biografía completa en las fuentes consultadas y sugiere que podría ser el abuelo de Abd al-Baqi al-Zarqani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16641}"
  ur: "احمد بن محمد الزرقانی المالکی، ایک گرامر دان ابن ہشام کی قوائد العرب کی تفسیر کے ساتھ۔ اس کتاب کے پاس موجود ذرائع میں کوئی مکمل سوانح حیات نہیں ملی، اور اس سے اندازہ ہوتا ہے کہ وہ عبد الباقی الزرقانی کے دادا ہوسکتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16641}"
