  ar: "فقيه عدني ومفتيها ⁦(ت 875/1470–71)⁩؛ تنسب إليه عبر ابن عبد الغفار في رسالة الجزيري معرفةُ القهوة بعد مقام قسري على الساحل الأفريقي وإدخالُها عدنَ حيث صار متصوفاً {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–483 KAHWA}."
  en: "Adeni jurist and mufti ⁦(d. 875/1470–71)⁩; al-Jaziri's treatise, quoting Ibn Abd al-Ghaffar, credits him with encountering coffee during an involuntary stay on the African coast and bringing it to Aden after turning to Sufism {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–483 KAHWA}."
  ur: "عدن کا فقیہ اور مفتی ⁦(وفات 875/1470–71)⁩؛ جزائری کی رسالہ میں ابن عبد الغفار کے حوالے سے اسے افریقی ساحل پر قیام کے دوران قہوے سے واقفیت اور عدن میں متعارف کروانے کا سہرا دیا جاتا ہے {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–483 KAHWA}۔"
  es: "Jurista y muftí de Adén (m. 875/1470–71); el tratado de al-Jaziri, citando a Ibn Abd al-Ghaffar, le atribuye el descubrimiento del café durante una estancia involuntaria en la costa africana y su posterior traslado a Adén tras convertirse al sufismo {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–483 KAHWA}."
