summary:
  ar: "سياسي ودبلوماسي فلسطيني (1908–1980)، مؤسس منظمة التحرير الفلسطينية وأول رئيس لها (1964–1967)؛ عمل محاميًا في فلسطين زمن الانتداب، ومثّل فلسطين وسوريا والسعودية في الأمم المتحدة، وكان أمينًا عامًا مساعدًا لجامعة الدول العربية، وهو ابن العالم والسياسي العثماني أسعد الشقيري."
  en: "Palestinian politician and diplomat (1908–1980), founder and first chairman of the Palestine Liberation Organization (1964–1967). A lawyer in Mandate Palestine, he represented Palestine, Syria and Saudi Arabia at the United Nations and served as assistant secretary-general of the Arab League; he was the son of the Ottoman scholar-politician As'ad al-Shuqairi."
  ur: "فلسطینی سیاست دان اور سفارت کار (1908–1980)، تنظیم آزادی فلسطین کے بانی اور اس کے پہلے چیئرمین (1964–1967)۔ انتداب فلسطین میں وکیل رہے، اقوام متحدہ میں فلسطین، شام اور سعودی عرب کی نمائندگی کی اور عرب لیگ کے معاون سیکرٹری جنرل رہے؛ وہ عثمانی عالم و سیاست دان اسعد الشقیری کے بیٹے تھے۔"
