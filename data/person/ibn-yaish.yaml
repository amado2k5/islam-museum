summary:
  ar: "النحوي المعروف بابن الصائغ، موصلي الأصل حلبي المولد؛ قرأ النحو على فتيان الحلبي والمغربي النيروزي، ورحل من حلب في صدر عمره قاصداً بغداد ليدرك ابن الأنباري فلما وصل الموصل بلغه خبر وفاته فأقام بها ثم رجع إلى حلب، واجتمع بدمشق بالكندي وسأله عن إعراب ما ذكره الحريري في المقامة الرحبية فاستبهم الجواب على الكندي {cite:wafayat-ayan p. 46-47}."
  en: "Muwaffaq al-Din Ibn Ya'ish the grammarian, Mosuli by origin, Aleppan by birth — who rode to Baghdad for Ibn al-Anbari only to meet news of his death at Mosul, and whose question on the i'rab of Hariri's Rahbiyya maqama stumped Taj al-Din al-Kindi at Damascus {cite:wafayat-ayan p. 46-47}."
