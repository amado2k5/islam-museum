summary:
  ar: "النحوي المعروف بابن الصائغ، موصلي الأصل حلبي المولد؛ قرأ النحو على فتيان الحلبي والمغربي النيروزي، ورحل من حلب في صدر عمره قاصداً بغداد ليدرك ابن الأنباري فلما وصل الموصل بلغه خبر وفاته فأقام بها ثم رجع إلى حلب، واجتمع بدمشق بالكندي وسأله عن إعراب ما ذكره الحريري في المقامة الرحبية فاستبهم الجواب على الكندي {cite:wafayat-ayan p. 46-47}."
  en: "Muwaffaq al-Din Ibn Ya'ish the grammarian, Mosuli by origin, Aleppan by birth — who rode to Baghdad for Ibn al-Anbari only to meet news of his death at Mosul, and whose question on the i'rab of Hariri's Rahbiyya maqama stumped Taj al-Din al-Kindi at Damascus {cite:wafayat-ayan p. 46-47}."
  es: "Muwaffaq al-Din Ibn Ya'ish, el gramático, originario de Mosul y nacido en Alepo, que viajó a Bagdad para buscar a Ibn al-Anbari solo para enterarse de su muerte en Mosul, y cuya pregunta sobre el i'rab de la maqama Rahbiyya de Hariri dejó perplejo a Taj al-Din al-Kindi en Damasco {cite:wafayat-ayan p. 46-47}."
  fr: "Muwaffaq al-Din Ibn Ya'ish, le grammairien, originaire de Mossoul, né à Alep, qui se rendit à Bagdad pour Ibn al-Anbari pour y apprendre sa mort à Mossoul, et dont la question sur l'i'rab du maqama Rahbiyya de Hariri déconcerta Taj al-Din al-Kindi à Damas {cite:wafayat-ayan p. 46-47}."
  ur: "موفق الدین ابن یعش گرامر، اصل کے لحاظ سے موصلی، پیدائشی طور پر حلب - جو ابن الانباری کے لیے صرف موصل میں ان کی موت کی خبر ملنے کے لیے بغداد گئے تھے، اور جن کے حریری کے ربیعہ مقمہ کے اَرب پر سوال نے تاج الدین الدینصیۃ الدائمۃ الدائمۃ الدعوۃ کو ٹھوکر مار دی تھی۔ 46-47}۔"
  tr: "Aslen Musullu ve Halep doğumlu İbn el-Seyh olarak bilinen dilbilgicisi; Halepli gençlerin ve Faslı el-Nairuzi'nin yanında dilbilgisi çalıştı. Hayatının erken dönemlerinde Halep'ten ayrılarak İbn el-Anbari ile görüşmek üzere Bağdat'a gitti. Musul'a vardığında ölümünü duydu, bu yüzden orada kaldı ve ardından Halep'e döndü. Şam'da el-Kindi ile tanıştı ve Rahbiye Makameti'nde al-Hariri'nin bahsettiklerinin dilbilgisini sordu, bu yüzden cevabı el-Kindi'den aradı {atıf:wafayat-ayan, s. 46-47}."
  id: "Ahli tata bahasa yang dikenal sebagai Ibn al-Saigh, berasal dari Mosul dan lahir di Aleppo; ia belajar tata bahasa di bawah bimbingan pemuda Aleppo dan al-Nairuzi dari Maroko. Ia meninggalkan Aleppo sejak kecil dalam hidupnya menuju Baghdad untuk bertemu Ibn al-Anbari. Ketika tiba di Mosul, ia mendengar kematiannya, sehingga ia tinggal di sana, lalu kembali ke Aleppo. Di Damaskus, ia bertemu al-Kindi dan menanyakan tentang tata bahasa yang disebutkan al-Hariri dalam Maqamah Rahbiyyah, sehingga ia mencari jawaban dari al-Kindi {cite:wafayat-ayan, hlm. 46-47}."
