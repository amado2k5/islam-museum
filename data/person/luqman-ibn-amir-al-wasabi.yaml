summary:
  ar: "لقمان بن عامر، أبو عامر الوصابي، نسبة إلى وصاب بطن من حمير، من أهل حمص، تابعي ثقة، روى عن أبي الدرداء وأبي هريرة وأبي أمامة وغيرهم، وروى عنه محمد بن الوليد الزبيدي والفرج بن فضالة وعقيل بن مدرك وآخرون. ذكره ابن حبان في الثقات، وقال أبو حاتم: يكتب حديثه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2069}"
  en: "Luqman ibn Amir, Abu Amir al-Wasabi, from Wasab, a clan of Himyar, of Homs, a trustworthy Successor who transmitted from Abu al-Darda', Abu Hurayra and Abu Umama. Ibn Hibban counted him among the trustworthy, and Abu Hatim said his hadith is to be written down. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2069}"
