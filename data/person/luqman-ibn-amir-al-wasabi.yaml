summary:
  ar: "لقمان بن عامر، أبو عامر الوصابي، نسبة إلى وصاب بطن من حمير، من أهل حمص، تابعي ثقة، روى عن أبي الدرداء وأبي هريرة وأبي أمامة وغيرهم، وروى عنه محمد بن الوليد الزبيدي والفرج بن فضالة وعقيل بن مدرك وآخرون. ذكره ابن حبان في الثقات، وقال أبو حاتم: يكتب حديثه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2069}"
  en: "Luqman ibn Amir, Abu Amir al-Wasabi, from Wasab, a clan of Himyar, of Homs, a trustworthy Successor who transmitted from Abu al-Darda', Abu Hurayra and Abu Umama. Ibn Hibban counted him among the trustworthy, and Abu Hatim said his hadith is to be written down. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2069}"
  es: "Luqman ibn Amir, Abu Amir al-Wasabi, de Wasab, un clan de Himyar, de Homs, un sucesor digno de confianza que transmitió de Abu al-Darda', Abu Hurayra y Abu Umama. Ibn Hibban lo consideró digno de confianza, y Abu Hatim dijo que su hadiz debe ser escrito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2069}"
  fr: "Luqman ibn Amir, Abu Amir al-Wasabi, de Wasab, clan Himyar de Homs, était un successeur digne de confiance qui transmit le hadith d'Abu al-Darda', d'Abu Hurayra et d'Abu Umama. Ibn Hibban le comptait parmi les dignes de confiance, et Abu Hatim recommanda de consigner son hadith par écrit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2069}"
