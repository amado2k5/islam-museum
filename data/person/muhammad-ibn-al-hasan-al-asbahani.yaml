summary:
  ar: "أبو جعفر الأصبهاني، سكن بغداد وحدّث بها عن بكر بن بكار وغيره، روى عنه ابن صاعد وأبو الحسين بن المنادي وغيرهما وكان ثقة؛ توفي سنة تسع وخمسين ومائتين {cite:muntazam-ibn-al-jawzi p. 106}."
  en: "Abu Ja'far al-Asbahani, settled at Baghdad and transmitted there from Bakr ibn Bakkar and others — a trustworthy authority heard by Ibn Sa'id and Ibn al-Munadi; he died in 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  es: "Abu Ja'far al-Asbahani, establecido en Bagdad y transmitido allí por Bakr ibn Bakkar y otros, una autoridad confiable escuchada por Ibn Sa'id e Ibn al-Munadi; murió en 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  fr: "Abu Ja'far al-Asbahani, s'est installé à Bagdad et y a transmis de Bakr ibn Bakkar et d'autres — une autorité digne de confiance entendue par Ibn Sa'id et Ibn al-Munadi; il est mort en 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  ur: "ابو جعفر الاسبہانی، بغداد میں آباد ہوئے اور وہاں سے بکر بن بکر اور دیگر سے منتقل ہوئے - ایک قابل اعتماد اتھارٹی جسے ابن سعید اور ابن المنادی نے سنا؛ ان کی وفات 259ھ میں ہوئی۔ 106}۔"
  tr: "Bağdat'ta yaşayan ve orada Bakr ibn Bakkar ve diğerlerinden rivayet eden Ebu Ca'fer el-Esbahani. İbn Said, Ebu el-Hüseyin ibn el-Munadi ve diğerleri ondan rivayet ettiler. Güvenilirdi; 259 Hicri yılında vefat etti {atıf:müntezem ibn cevzi, s. 106}."
  id: "Abu Ja'far al-Asbahani, yang tinggal di Baghdad dan menceritakan di sana dari Bakr ibn Bakkar dan lainnya. Ibn Sa'id, Abu al-Husayn ibn al-Munadi, dan lainnya menceritakan darinya. Ia dapat dipercaya; ia meninggal pada tahun 259 H {cite:muntazam-ibn-al-jawzi, hlm. 106}."
