class: person
label:
  ar: "القاضي تقي الدين ابن قاضي شهبة"
  en: "Qadi Taqi al-Din Ibn Qadi Shuhba"
  ur: "قاضی تقی الدین ابن قاضی شہبہ"
summary:
  ar: "القاضي تقي الدين أبو بكر ابن قاضي شهبة الأسدي الدمشقي الشافعي ⁦(ت ٨٥١هـ)⁩: فقيه الشام في عصره ومؤرخها وعالمها، ولي قضاء القضاة بدمشق وخطابة الجامع الأموي ومفتيها، وانتهت إليه الرئاسة في فقه مذهبه وفروعه؛ اشتهر بابن قاضي شهبة لأن أبا جده أقام قاضياً بشهبة من قرى حوران أربعين سنة؛ صاحب «طبقات الشافعية» و«الإعلام بتاريخ أهل الإسلام» {cite:al-aalam p. 163} {cite:nujum-zahira 15/523} {cite:shadharat-dhahab p. 269}."
  en: "Qadi Taqi al-Din Abu Bakr Ibn Qadi Shuhba al-Asadi al-Dimashqi al-Shafi'i (d. 851/1448): the jurist, historian and scholar of Damascus in his day, who held the chief judgeship of Damascus with the preachership of the Umayyad Mosque and its muftiship, and to whom the leadership of the Shafi'i school passed; he is called Ibn Qadi Shuhba because his great-grandfather was qadi of Shahba in Hawran for forty years; author of Tabaqat al-Shafi'iyya and al-I'lam bi-Tarikh Ahl al-Islam {cite:al-aalam p. 163} {cite:nujum-zahira 15/523} {cite:shadharat-dhahab p. 269}."
  ur: "قاضی تقی الدین ابو بکر ابن قاضی شہبہ اسدی دمشقی شافعی ⁦(وفات 851ھ/1448ء)⁩: اپنے عصر کے شام کے فقیہ، مؤرخ اور عالم؛ دمشق کے قاضی القضاۃ، جامع اموی کے خطیب اور مفتی رہے اور شافعی فقہ کی ریاست انہی پر منتج ہوئی؛ 'ابن قاضی شہبہ' اس لیے کہہلائے کہ ان کے پردادا حوران کی بستی شہبہ میں چالیس برس قاضی رہے؛ 'طبقات الشافعیہ' اور 'الاعلام بتاریخ اہل الاسلام' کے مصنف {cite:al-aalam p. 163} {cite:nujum-zahira 15/523} {cite:shadharat-dhahab p. 269}۔"
