gender: male
roles: []
summary:
  ar: "من صناديد قريش قبل الإسلام؛ كان يجمع قومه يوم الجمعة — ولذلك سمي يوم كعب — ويخبرهم بما قرأ في الكتب السابقة عن نبي يخرج من صلبه ويأمرهم باتباعه {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48}."
  en: "One of the grandees of pre-Islamic Quraysh; he gathered his people on Fridays — hence 'the day of Ka'b' — telling them what he had read in the earlier scriptures about a prophet who would come from his loins, and bidding them follow him {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48}."
  es: "Uno de los grandes de los Quraysh preislámicos; reunía a su gente los viernes —de ahí el 'día de Ka'b'— contándoles lo que había leído en las escrituras anteriores acerca de un profeta que vendría de sus entrañas, y ordenándoles que lo siguieran {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48}."
  fr: "L'un des grands seigneurs des Quraysh préislamiques; il réunissait son peuple le vendredi — d'où « le jour de Ka'b » — leur racontant ce qu'il avait lu dans les écritures antérieures à propos d'un prophète qui viendrait de ses reins, et leur ordonnant de le suivre {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48}."
  ur: "قبل از اسلام قریش کے بزرگوں میں سے ایک؛ اس نے جمعہ کے دن اپنے لوگوں کو جمع کیا - اس لیے 'یوم کعب' - انہیں بتاتا ہے کہ اس نے پہلے صحیفوں میں ایک ایسے نبی کے بارے میں کیا پڑھا تھا جو اس کی پشت سے آئے گا، اور ان کو اس کی پیروی کرنے کا حکم دیا {حوالہ: ابن ہشام سیرہ 1/1-4}"
