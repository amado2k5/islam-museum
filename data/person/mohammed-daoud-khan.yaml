summary:
  ar: "ضابط وسياسي أفغاني من الأسرة الملكية الموساهيبانية، وُلد في كابل سنة 1909. تولى رئاسة الحكومة (1953-1963) في عهد ابن عمه الملك ظاهر شاه، ثم أطاح بالملكية في انقلاب 1973 وأعلن الجمهورية وكان أول رؤسائها، حتى اغتيل مع معظم أسرته في انقلاب ثور الشيوعي في 28 أبريل 1978."
  en: "Afghan military officer and politician of the Musahiban royal family, born at Kabul in 1909. He was prime minister (1953–1963) under his cousin King Zahir Shah, then overthrew the monarchy in the 1973 coup, proclaimed the republic and became its first president, until he was assassinated with most of his family in the communist Saur Revolution on 28 April 1978."
  ur: "افغان فوجی افسر اور مصاحبان شاہی خاندان کے سیاست دان، جو 1909ء میں کابل میں پیدا ہوئے۔ اپنے چچا زاد بادشاہ ظاہر شاہ کے دور میں وزیرِ اعظم (1953ء–1963ء) رہے، پھر 1973ء کی بغاوت میں بادشاہت ختم کر کے جمہوریہ کا اعلان کیا اور اس کے پہلے صدر بنے، حتیٰ کہ 28 اپریل 1978ء کو ثور انقلاب میں بیشتر خاندان سمیت قتل کر دیے گئے۔"
