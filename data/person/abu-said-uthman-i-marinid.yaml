summary:
  ar: "بطاقة أولية لأبي سعيد عثمان بن عبد الحق المريني، أمير بني مرين الذي بنى دولتهم بعد معركة تازة وانتزع فاس، توفي سنة ١٢٤٠م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu Sa'id Uthman ibn Abd al-Haqq, the Marinid amir who built his dynasty's power after Taza and took Fez, d. 1240; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Abu Sa'id Uthman ibn Abd al-Haqq, el emir mariní que consolidó el poder de su dinastía tras Taza y tomó Fez, fallecido en 1240; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de projet d'Abu Sa'id Uthman ibn Abd al-Haqq, l'émir mérinide qui a bâti la puissance de sa dynastie après Taza et a pris Fès, mort en 1240; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "ابو سعید عثمان بن عبد الحق کے لیے کارڈ کا مسودہ، مرینی امیر، جس نے تازہ کے بعد اپنے خاندان کی طاقت قائم کی اور فیز لے لیا۔ 1240; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Taza Savaşı'ndan sonra devletlerini kuran ve Fez'i ele geçiren Beni Marin Emiri Ebu Said Osman bin Abdül Hak el-Marini'nin ön profili. 1240 yılında vefat etmiştir. İslam devletleri sözlüklerinde adı geçmektedir ve biyografisi bu sayfada henüz incelenmemiştir."
  id: "Profil pendahuluan Abu Saeed Othman bin Abdul Haq Al-Marini, Emir Banu Marin yang membangun negara mereka setelah Perang Taza dan merebut Fez. Ia meninggal pada tahun 1240 M. Namanya disebutkan dalam kamus-kamus negara Islam, dan biografinya belum pernah diulas di halaman ini."
