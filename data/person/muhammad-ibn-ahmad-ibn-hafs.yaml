gender: male
summary:
  ar: محمد بن أحمد بن حفص البخاري، أبو عبد الله، مفتي بخارى وعالمها كما وصفه الذهبي، تفقه بوالده وتفقه به أهل بخارى وله تصانيف؛ ورد في عنوان ترجمته سنة ٢٦٤هـ ونُصّ في الترجمة على أنه عاش إلى نحو السبعين ومئتين.
  en: Muhammad ibn Ahmad ibn Hafs al-Bukhari, Abu Abd Allah, mufti and scholar of Bukhara in al-Dhahabi's words, who studied fiqh under his father and taught the people of Bukhara, and left works; the entry's heading gives 264 AH while the text says he lived to nearly 270.
  es: "Muhammad ibn Ahmad ibn Hafs al-Bukhari, Abu Abd Allah, muftí y erudito de Bujará en palabras de al-Dhahabi, que estudió fiqh con su padre y enseñó a la gente de Bujará, y dejó obras; el encabezado de la entrada indica 264 AH, mientras que el texto dice que vivió hasta casi 270."
  fr: "Muhammad ibn Ahmad ibn Hafs al-Bukhari, Abu Abd Allah, mufti et érudit de Boukhara selon al-Dhahabi, qui étudia le fiqh auprès de son père et enseigna aux habitants de Boukhara, et laissa des œuvres; l'intitulé de l'entrée indique 264 AH tandis que le texte dit qu'il vécut jusqu'en près de 270."
