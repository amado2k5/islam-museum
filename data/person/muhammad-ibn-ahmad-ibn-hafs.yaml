summary:
  ar: محمد بن أحمد بن حفص البخاري، أبو عبد الله، مفتي بخارى وعالمها كما وصفه الذهبي، تفقه بوالده وتفقه به أهل بخارى وله تصانيف؛ ورد في عنوان ترجمته سنة ٢٦٤هـ ونُصّ في الترجمة على أنه عاش إلى نحو السبعين ومئتين.
  en: Muhammad ibn Ahmad ibn Hafs al-Bukhari, Abu Abd Allah, mufti and scholar of Bukhara in al-Dhahabi's words, who studied fiqh under his father and taught the people of Bukhara, and left works; the entry's heading gives 264 AH while the text says he lived to nearly 270.
