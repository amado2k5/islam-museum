id: person/muhammad-ibn-tughj-al-ikhshid
class: person
label: { ar: "محمد بن طغج الإخشيد" }
summary:
  ar: "ابن طغج صاحب مصر الملقب بالإخشيد، حضر إلى المتقي وهو بالرقة وقد بلغته مصالحته توزون فقال وغدرهم فالله الله في نفسك سر معي إلى مصر فهي لك وتأمن على نفسك فلم يقبل فرجع إلى بلاده {cite:tarikh-khulafa-minhaj-1434 p. 610}، ومات سنة أربع وثلاثين وهو محمد بن طغج الفرغاني والإخشيد معناه ملك الملوك وهو لقب لكل من ملك فرغانة كما أن الأصبهبذ لقب ملك طبرستان وصول ملك جرجان وخاقان ملك الترك والأفشين ملك أشروسنة وسامان ملك سمرقند وكان شجاعاً مهيباً ولي مصر من قبل القاهر وكان له ثمانية آلاف مملوك وهو أستاذ كافور {cite:tarikh-khulafa-minhaj-1434 p. 615-616}.، وحضره المسعودي في داره المعروفة بالمختارة في الجزيرة الراكبة للنيل ليلة الغطاس سنة ثلاثين وثلاثمائة فأسرج من جانب الجزيرة وجانب الفسطاط ألف مشعل {cite:muruj-al-dhahab p. 302-303}"
  en: "Son of Tughj, lord of Egypt titled al-Ikhshid; he came to al-Muttaqi at Raqqa as the truce with Tuzun ripened — 'beware their treachery, come with me to Egypt, it is yours and you will be safe' — but the caliph refused {cite:tarikh-khulafa-minhaj-1434 p. 610}."
