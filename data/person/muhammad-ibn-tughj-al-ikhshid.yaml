id: person/muhammad-ibn-tughj-al-ikhshid
class: person
label:
  ar: محمد بن طغج الإخشيد
summary:
  ar: ابن طغج صاحب مصر الملقب بالإخشيد، حضر إلى المتقي وهو بالرقة وقد بلغته مصالحته توزون فقال وغدرهم فالله الله في نفسك سر
    معي إلى مصر فهي لك وتأمن على نفسك فلم يقبل فرجع إلى بلاده {cite:tarikh-khulafa-minhaj-1434 p. 610}، ومات سنة أربع وثلاثين
    وهو محمد بن طغج الفرغاني والإخشيد معناه ملك الملوك وهو لقب لكل من ملك فرغانة كما أن الأصبهبذ لقب ملك طبرستان وصول ملك
    جرجان وخاقان ملك الترك والأفشين ملك أشروسنة وسامان ملك سمرقند وكان شجاعاً مهيباً ولي مصر من قبل القاهر وكان له ثمانية
    آلاف مملوك وهو أستاذ كافور {cite:tarikh-khulafa-minhaj-1434 p. 615-616}. وحضره المسعودي في داره المعروفة بالمختارة في
    الجزيرة الراكبة للنيل ليلة الغطاس سنة ثلاثين وثلاثمائة فأسرج من جانب الجزيرة وجانب الفسطاط ألف مشعل {cite:muruj-al-dhahab
    p. 302-303}، وعند ابن الأثير أتاه المتقي بالرقة منتصف محرم سنة 333هـ فوقف وقوف الغلمان ومشى بين يدي المتقي وأحضر له هدايا
    عظيمة واجتهد به أن يسير معه إلى مصر ولا يرجع إلى بغداد وخوفه من توزون فلم يقبل فكان ابن مقلة يقول بعد ذلك نصحني الإخشيد
    فلم أقبل نصيحته {cite:kamil-ibn-al-athir p. 312-313}
  en: Son of Tughj, lord of Egypt titled al-Ikhshid; he came to al-Muttaqi at Raqqa as the truce with Tuzun ripened — 'beware
    their treachery, come with me to Egypt, it is yours and you will be safe' — but the caliph refused {cite:tarikh-khulafa-minhaj-1434
    p. 610}.
  es: "Hijo de Tughj, señor de Egipto con el título de al-Ikhshid; fue a ver a al-Muttaqi en Raqqa cuando la tregua con Tuzun estaba a punto de terminar —«cuidado con su traición, ven conmigo a Egipto, es tuyo y estarás a salvo»— pero el califa se negó {cite:tarikh-khulafa-minhaj-1434 p. 610}."
  fr: "Fils de Tughj, seigneur d'Égypte titré al-Ikhshid; il vint à al-Muttaqi à Raqqa alors que la trêve avec Tuzun mûrissait — « méfiez-vous de leur trahison, venez avec moi en Égypte, elle est à vous et vous serez en sécurité » — mais le calife refusa {cite:tarikh-khulafa-minhaj-1434 p. 610}."
  ur: "تغز کا بیٹا، مصر کا رب الخشد کا لقب۔ جب تزون کے ساتھ صلح ہو گئی تو وہ رقہ میں المتقی کے پاس آیا - 'ان کی غداری سے بچو، میرے ساتھ مصر چلو، یہ تمہارا ہے اور تم محفوظ رہو گے' - لیکن خلیفہ نے انکار کر دیا {حوالہ: تاریخ الخلفاء منہاج 1434 ص۔ 610}۔"
  tr: "Mısır'ın hükümdarı İbn Tuğac, Al-İhşid olarak bilinir, Rakka'dayken Al-Muttaqi'ye geldi ve Tavzan barışmaya ulaşmıştı. Dedi ki, 'Tanrı aşkına, ruhundayım. Benimle Mısır'a git, çünkü orası senin, güvende olacaksın.' Kabul etmedi, bu yüzden memleketine döndü {alıntı::Tarih-Khulafa-minhaj-1434, s. 610}. 34 Hâri yılında öldü. O, Muhammed ibn Tughaj al-Farghani'ydi ve İhşid, Kralların Kralı anlamına gelir ve Fergana'yı yöneten herkes için bir unvandır. Aynı zamanda Fergana Kralı için de bir unvandır. Asbahlar, Tabaristan Kralı, Gorgan Kralı'nın gelişi, Türklerin Kağanı, Aşruşin ve Semerkand Kralı Saman'ın unvanlarıdır. Fatihler tarafından Mısır'ın cesur ve görkemli bir hükümdarıydı ve sekiz bin Memlük'e sahipti. Kafur'un efendisiydi {alıntı:Tarikh-Khulafa-Minhaj-1434, s. 615-616}. El-Mes'udi, 333 Hicri yılının Dalış gecesinde Nil Nehri binicilik adasındaki El-Muhtara adlı evinde ona hizmet etti. Adanın her iki yanında ve Fustat'ın yanında lambalar yaktı {atıf:muruj-al-dhahab, s. 302-303}. İbn el-Athir ile birlikte, 333 Hicri yılında Muharrem ortasında Rakka'ya geldi, çocuklar al-Mutaqi'nin önünde durup yürüdüler, ona büyük hediyeler getirdiler ve o da Mısır'a eşlik etmeye çalıştı, Bağdat'a ve Tuzun'a dönmemeye çalıştı, fakat o reddetti. İbn Muqla, bundan sonra el-İhşid bana öğüt verdi ama ben onun tavsiyesini kabul etmedim {atıf:kamil-ibn-al-athir s. 312-313}"
  id: "Ibn Tughaj, penguasa Mesir yang dikenal sebagai Al-Ikhshid, datang ke Al-Muttaqi saat ia berada di Raqqa, dan Tawzan telah mencapai perdamaian. Ia berkata, 'Demi Tuhan, aku ada dalam jiwamu. Ikutlah bersamaku ke Mesir, karena itu milikmu, dan kau akan aman.' Ia tidak menerima, sehingga ia kembali ke tanah airnya {cite:Sejarah-Khulafa-minhaj-1434, hlm. 610}. Ia meninggal pada tahun 34 H. Ia adalah Muhammad ibn Tughaj al-Farghani, dan Ikhshid berarti Raja segala raja, dan itu adalah gelar untuk semua yang memerintah Fergana. Itu juga gelar untuk Raja Fergana. Asbah adalah gelar Raja Tabaristan, kedatangan Raja Gorgan, Khagan Turki, Ashrushin, dan Saman, Raja Samarkand. Ia adalah penguasa Mesir yang berani dan megah oleh para penakluk dan memiliki delapan ribu Mamluk. Ia adalah penguasa Kafur {cite:Tarikh-Khulafa-Minhaj-1434, hlm. 615-616}. Al-Mas'udi menemani dia di rumahnya yang dikenal sebagai Al-Mukhtara di pulau berkuda Sungai Nil pada malam Penyelaman tahun 333 H. Dia menyalakan lampu di kedua sisi pulau dan sisi Fustat {cite:muruj-al-dhahab, hlm. 302-303}. Bersama Ibn al-Athir, al-Muttaqi datang kepadanya di Raqqa di tengah Muharram pada tahun 333 H, di mana anak-anak itu berdiri dan berjalan di hadapan al-Mutaqi, membawakan hadiah-hadiah besar, dan dia mencoba menemaninya ke Mesir dan tidak kembali ke Baghdad dan tidak kembali ke Tuzun, tetapi dia menolak. Ibn Muqla mengatakan bahwa setelah itu, al-Ikhshid memberi nasihat kepada saya, tetapi saya tidak menerima nasihatnya {cite:kamil-ibn-al-athir hlm. 312-313}"
