summary:
  ar: "اللواء الفخري نواب سر عمر حياة خان تيوانا (1874–1944) جندي ومالك أراضٍ من البنجاب، من أكبر ملّاك الإقليم، خدم في حملات الصومال والتبت والحرب العالمية الأولى والحرب الأفغانية الثالثة، وجلس في مجلس الهند ومجلس الدولة والمجلس التشريعي للبنجاب، وهو والد ملک خضر حياة تيوانا، آخر رئيس وزراء للبنجاب الموحدة."
  en: "Major General Nawab Sir Umar Hayat Khan Tiwana (1874–1944) was a Punjabi soldier and landowner, among the largest landholders of the province, who served in the Somaliland, Tibet, First World War and Third Anglo-Afghan War campaigns, sat on the Councils of India and State and the Punjab Legislative Council, and was the father of Malik Khizar Hayat Tiwana, the last Premier of the undivided Punjab."
  ur: "میجر جنرل نواب سر عمر حیات خان ٹوانہ (1874ء–1944ء) پنجابی سپاہی اور زمیندار تھے، صوبے کے بڑے جاگیرداروں میں سے تھے، صومالی لینڈ، تبت، پہلی جنگ عظیم اور تیسری اینگلو افغان جنگ میں خدمات انجام دیں، کونسل آف انڈیا، کونسل آف اسٹیٹ اور پنجاب لیجسلیٹو کونسل کے رکن رہے، اور ملک خضر حیات ٹوانہ کے والد تھے۔"
