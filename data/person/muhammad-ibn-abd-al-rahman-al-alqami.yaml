summary:
  ar: "محمد بن عبد الرحمن بن علي العلقمي، شمس الدين، فقيه شافعي عارف بالحديث من بيوتات العلم في القاهرة، تلميذ السيوطي ومن مدرسي الأزهر، صاحب «الكوكب المنير بشرح الجامع الصغير»، 897 إلى 969 هـ."
  en: "Muhammad ibn Abd al-Rahman al-Alqami, Shams al-Din, a Shafi'i jurist learned in hadith from a Cairo family of scholars, a pupil of al-Suyuti and a teacher at al-Azhar, author of al-Kawkab al-Munir, 897 to 969 AH."
  es: "Muhammad ibn Abd al-Rahman al-Alqami, Shams al-Din, jurista shafi'í versado en hadices de una familia de eruditos de El Cairo, discípulo de al-Suyuti y profesor en al-Azhar, autor de al-Kawkab al-Munir, 897 a 969 AH."
  fr: "Muhammad ibn Abd al-Rahman al-Alqami, Shams al-Din, juriste shafi'i formé au hadith par une famille de savants du Caire, élève d'al-Suyuti et enseignant à al-Azhar, auteur d'al-Kawkab al-Munir, 897 à 969 AH."
  ur: "محمد بن عبدالرحمن علقمی، شمس الدین، ایک شافعی فقیہ نے قاہرہ کے علماء کے ایک خاندان سے حدیث کی تعلیم حاصل کی، السیوطی کے شاگرد اور الازہر کے استاد، الکوکاب المنیر کے مصنف، 897 تا 969 ہجری۔"
  tr: "Muhammed ibn Abd al-Rahman ibn Ali al-Alqami, Şemseddin, hadis konusunda bilgili bir Şafii hukukçu, Kahire'deki illim evlerinden, el-Suyuti'nin öğrencisi ve El-Ezher'in hocalarından biri, 'El-Kavkab el-Munir bi Şerh el-Cemi' el-Saghir' adlı eserin yazarı, 897-969 H."
  id: "Muhammad ibn Abd al-Rahman ibn Ali al-Alqami, Shams al-Din, seorang ahli hukum Shafi'i yang berpengetahuan dalam hadis, dari rumah-rumah ilmu di Kairo, murid al-Suyuti dan salah satu guru Al-Azhar, penulis 'Al-Kawkab al-Munir bi Sharh al-Jami' al-Saghir', 897 hingga 969 H."
