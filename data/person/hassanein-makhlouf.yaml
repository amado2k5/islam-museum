summary:
  ar: "عالم أزهري مصري (1890–1990)؛ وُلد في القاهرة في أسرة من بني عدي بصعيد مصر، وتخرج في مدرسة القضاء الشرعي سنة 1914، وعمل قاضيًا شرعيًا، وتولى منصب مفتي الديار المصرية مرتين (1946–1950 و1952–1954)، ورأس لجنة الفتوى بالأزهر، ومن مؤلفاته «كلمات القرآن تفسير وبيان» و«صفوة البيان لمعاني القرآن»."
  en: "Egyptian Azhari scholar (1890–1990). Born in Cairo to a family from Bani Adi in Upper Egypt, he graduated from the School of Sharia Judiciary in 1914, served as a sharia judge, held the office of Grand Mufti of Egypt twice (1946–1950 and 1952–1954), headed al-Azhar's fatwa committee, and wrote Kalimat al-Qur'an Tafsir wa-Bayan and Safwat al-Bayan li-Ma'ani al-Qur'an."
  ur: "مصری ازہری عالم (1890–1990)؛ قاہرہ میں پیدا ہوئے، ان کا خاندان صعید مصر کے بنی عدی سے تھا، 1914 میں مدرسہ قضائے شرعی سے فارغ ہوئے، شرعی قاضی رہے، دو بار مفتیِ دیارِ مصر بنے (1946–1950 اور 1952–1954)، الازہر کی لجنۃ الفتویٰ کی صدارت کی، اور ان کی تصانیف میں «کلمات القرآن تفسیر و بیان» اور «صفوۃ البیان لمعانی القرآن» شامل ہیں۔"
