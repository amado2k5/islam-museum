summary:
  ar: "كاتبة ومصلحة اجتماعية وراعية للفنون من بومباي، أول امرأة من جنوب آسيا تدرس في كامبريدج بحسب مقالة ويكيبيديا الإنجليزية. اشتهرت بيومياتها الأردية عن إقامتها في لندن للتدريب على التعليم «زمانه تحصيل» التي نُشرت في مجلة «تہذيب نسوان»، وكتبت كتبًا رائدة في الموسيقى الهندية، وراسلت محمد إقبال وشبلي نعماني، وتزوجت الرسام صموئيل فيضي رحيمين سنة 1912، وانتقلت معه إلى كراتشي سنة 1948 حيث توفيت سنة 1967."
  en: "Writer, social reformer and patron of the arts from Bombay, described by the English article as the first woman from South Asia to attend the University of Cambridge. She became known for Zamana-i-Tahsil, the Urdu diary of her London teacher-training stay published in Tehzeeb-e-Niswan, wrote pioneering books on Indian music, corresponded with Muhammad Iqbal and Shibli Nomani, married the painter Samuel Fyzee-Rahamin in 1912, and moved with him to Karachi in 1948, where she died in 1967."
  ur: "بمبئی سے تعلق رکھنے والی مصنفہ، سماجی مصلح اور فنون کی سرپرست، جنہیں انگریزی مقالہ کیمبرج یونیورسٹی میں تعلیم حاصل کرنے والی پہلی جنوبی ایشیائی خاتون قرار دیتا ہے۔ لندن میں اساتذہ کی تربیت کے دوران لکھی گئی ان کی اردو ڈائری «زمانہ تحصیل» «تہذیب نسواں» میں شائع ہو کر ان کی شہرت کا سبب بنی؛ انہوں نے ہندوستانی موسیقی پر اولین کتابیں لکھیں، محمد اقبال اور شبلی نعمانی سے خط کتابت رہی، 1912 میں مصور سموئیل فیضی رحمین سے شادی کی اور 1948 میں ان کے ہمراہ کراچی منتقل ہو گئیں جہاں 1967 میں وفات پائی۔"
