summary:
  ar: "كاتبة ومصلحة اجتماعية وراعية للفنون من بومباي، أول امرأة من جنوب آسيا تدرس في كامبريدج بحسب مقالة ويكيبيديا الإنجليزية. اشتهرت بيومياتها الأردية عن إقامتها في لندن للتدريب على التعليم «زمانه تحصيل» التي نُشرت في مجلة «تہذيب نسوان»، وكتبت كتبًا رائدة في الموسيقى الهندية، وراسلت محمد إقبال وشبلي نعماني، وتزوجت الرسام صموئيل فيضي رحيمين سنة 1912، وانتقلت معه إلى كراتشي سنة 1948 حيث توفيت سنة 1967."
  en: "Writer, social reformer and patron of the arts from Bombay, described by the English article as the first woman from South Asia to attend the University of Cambridge. She became known for Zamana-i-Tahsil, the Urdu diary of her London teacher-training stay published in Tehzeeb-e-Niswan, wrote pioneering books on Indian music, corresponded with Muhammad Iqbal and Shibli Nomani, married the painter Samuel Fyzee-Rahamin in 1912, and moved with him to Karachi in 1948, where she died in 1967."
  ur: "بمبئی سے تعلق رکھنے والی مصنفہ، سماجی مصلح اور فنون کی سرپرست، جنہیں انگریزی مقالہ کیمبرج یونیورسٹی میں تعلیم حاصل کرنے والی پہلی جنوبی ایشیائی خاتون قرار دیتا ہے۔ لندن میں اساتذہ کی تربیت کے دوران لکھی گئی ان کی اردو ڈائری «زمانہ تحصیل» «تہذیب نسواں» میں شائع ہو کر ان کی شہرت کا سبب بنی؛ انہوں نے ہندوستانی موسیقی پر اولین کتابیں لکھیں، محمد اقبال اور شبلی نعمانی سے خط کتابت رہی، 1912 میں مصور سموئیل فیضی رحمین سے شادی کی اور 1948 میں ان کے ہمراہ کراچی منتقل ہو گئیں جہاں 1967 میں وفات پائی۔"
  es: "Escritora, reformadora social y mecenas de las artes originaria de Bombay, descrita en un artículo en inglés como la primera mujer del sur de Asia en asistir a la Universidad de Cambridge. Se hizo famosa por Zamana-i-Tahsil, el diario en urdu de su estancia en Londres para la formación de profesoras, publicado en Tehzeeb-e-Niswan; escribió libros pioneros sobre música india; mantuvo correspondencia con Muhammad Iqbal y Shibli Nomani; se casó con el pintor Samuel Fyzee-Rahamin en 1912 y se mudó con él a Karachi en 1948, donde falleció en 1967."
  fr: "Écrivaine, réformatrice sociale et mécène des arts originaire de Bombay, elle est décrite par l'article anglais comme la première femme d'Asie du Sud à avoir fréquenté l'université de Cambridge. Elle s'est fait connaître grâce à Zamana-i-Tahsil, son journal en ourdou relatant son séjour à Londres pour sa formation d'enseignante et publié dans Tehzeeb-e-Niswan. Elle a également écrit des ouvrages novateurs sur la musique indienne, entretenu une correspondance avec Muhammad Iqbal et Shibli Nomani, épousé le peintre Samuel Fyzee-Rahamin en 1912 et s'est installée avec lui à Karachi en 1948, où elle est décédée en 1967."
  tr: "Bombay'dan bir yazar, sosyal hizmet uzmanı ve sanat hamisi olan Sher, İngilizce Wikipedia makalesine göre Cambridge'de eğitim gören ilk Güney Asyalı kadındır. Londra'da eğitim eğitimi için ikamet ettiği \"Zamana Tahseel\" adlı Urduca günlükleriyle ünlendi; bu kitap \"Tahdheeb Niswan\" dergisinde yayımlandı, Hint müziği üzerine öncü kitaplar yazdı, Muhammad Iqbal ve Shabli Namani ile yazıştı, 1912'de ressam Samuel Faizhi Rahimin ile evlendi ve 1948'de onunla birlikte Karaçi'ye taşındı; burada 1967'de vefat etti."
  id: "Seorang penulis, pekerja sosial, dan pelindung seni dari Bombay, wanita Asia Selatan pertama yang belajar di Cambridge menurut artikel Wikipedia berbahasa Inggris. Dia menjadi terkenal karena buku harian Urdu-nya tentang kediamannya di London untuk pelatihan pendidikan \"Zamana Tahseel,\" yang diterbitkan di jurnal \"Tahdheeb Niswan,\" menulis buku-buku perintis tentang musik India, berkorespondensi dengan Muhammad Iqbal dan Shabli Namani, menikah dengan pelukis Samuel Faizhi Rahimin pada tahun 1912, dan pindah bersamanya ke Karachi pada tahun 1948, di mana dia meninggal pada tahun 1967."
