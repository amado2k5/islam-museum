summary:
  ar: "علاء الدين محمد بن أحمد بن أبي أحمد السمرقندي، فقيه حنفي صاحب «تحفة الفقهاء»، يصفه تلميذه الكاساني في مقدمة البدائع بـ«أستاذي وارث السنة ومورّثها... رئيس أهل السنة»، ويقول إنه الوحيد من مشايخهم الذي صرف العناية إلى الترتيب في التصنيف. تفقّهت عليه ابنته فاطمة، وتفقّه عليه الكاساني فزوّجه إياها. ويكنّيه المحققون في موضع أبا بكر وفي آخر أبا منصور. {cite:badai-sanai-ilmiyya-v1 p.77} {cite:badai-sanai-ilmiyya-v1 p.88}"
  en: "Ala' al-Din Muhammad ibn Ahmad ibn Abi Ahmad al-Samarqandi, a Hanafi jurist and author of Tuhfat al-Fuqaha'. His student al-Kasani calls him in the preface of al-Bada'i' 'my teacher, heir and bequeather of the sunna... head of the people of the sunna', and says he alone among their masters attended to systematic order in writing. His daughter Fatima studied with him, as did al-Kasani, to whom he married her. The editors give his kunya once as Abu Bakr and once as Abu Mansur."
  ur: "علاء الدین محمد بن احمد بن ابی احمد سمرقندی، حنفی فقیہ اور «تحفۃ الفقہاء» کے مصنف۔ ان کے شاگرد کاسانی بدائع کے مقدمے میں انہیں «میرے استاد، سنت کے وارث اور اسے آگے پہنچانے والے... اہلِ سنت کے رئیس» کہتے ہیں، اور بتاتے ہیں کہ ان کے مشایخ میں صرف انہوں نے تصنیف میں ترتیب پر توجہ دی۔ ان کی بیٹی فاطمہ نے ان سے فقہ پڑھی، اور کاسانی نے بھی، جن سے انہوں نے اس کی شادی کی۔ محققین ایک جگہ ان کی کنیت ابو بکر اور دوسری جگہ ابو منصور لکھتے ہیں۔"
