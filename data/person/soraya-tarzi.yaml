summary:
  ar: "ملكة أفغانستان عقيلة الملك أمان الله خان، وابنة المفكر والسياسي محمود طرزي. وُلدت في دمشق ونشأت فيها، وتزوجت أمان الله سنة 1913 فكانت زوجته الوحيدة خلافا لقرون من التعدد الملكي. قادت مع زوجها إصلاحات تحرير المرأة: أسست أول مجلة نسائية أفغانية «إرشاد النسوان» وأول مدرسة للبنات في كابل، وألقت خطبا عامة، وظهرت معه في أوروبا سنة 1927-1928. عاشت منفية في روما بعد 1929 وتوفيت فيها سنة 1968 ودُفنت في جلال أباد."
  en: "Queen of Afghanistan as consort of King Amanullah Khan, and daughter of the thinker and statesman Mahmud Tarzi. Born and raised in Damascus, she married Amanullah in 1913 and was his only wife, breaking centuries of royal polygamy. With him she led the women's-emancipation reforms: she founded the first Afghan women's magazine, Irshad al-Naswan, and the first girls' school in Kabul, gave public speeches, and toured Europe with him in 1927–1928. She lived in exile in Rome after 1929, died there in 1968 and was buried at Jalalabad."
  ur: "افغانستان کی ملکہ، بادشاہ امان اللہ خان کی اہلیہ اور مفکر و سیاست دان محمود طرزی کی بیٹی۔ دمشق میں پیدا ہوئیں اور وہیں پلی بڑھیں؛ 1913ء میں امان اللہ سے شادی ہوئی اور شاہی تعددِ ازواج کی صدیوں پرانی روایت توڑ کر ان کی واحد بیوی رہیں۔ شوہر کے ساتھ خواتین کی آزادی کی اصلاحات کی قیادت کی: خواتین کا پہلا افغان رسالہ «ارشاد النسوان» اور کابل میں لڑکیوں کا پہلا اسکول قائم کیا، عوامی خطبات دیے اور 1927ء–1928ء میں ان کے ساتھ یورپ کا دورہ کیا۔ 1929ء کے بعد روم میں جلاوطنی میں رہیں، 1968ء میں وفات پائی اور جلال آباد میں دفن ہوئیں۔"
