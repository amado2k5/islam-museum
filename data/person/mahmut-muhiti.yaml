summary:
  ar: "قائد عسكري أويغوري من توربان؛ قاد قوات خوجة نياز في تمرد كومول، وحكم منطقة كاشغر العسكرية (1934–1937)، وقاد التمرد الإسلامي سنة 1937 ضد شنغ شيتساي، ومات في بكين سنة 1944 بحسب الراجح."
  en: "Uyghur military commander from Turpan who led Khoja Niyaz's forces in the Kumul Rebellion, held the Kashgar military region (1934–1937), led the Islamic rebellion of 1937 against Sheng Shicai, and died at Beijing, most likely in 1944."
  ur: "ترپان کے اویغور فوجی کمانڈر؛ خوجہ نیاز کی افواج کی قیادت کی، کاشغر کا عسکری علاقہ سنبھالا (1934ء تا 1937ء)، 1937ء کی اسلامی بغاوت کی قیادت کی، اور غالباً 1944ء میں بیجنگ میں وفات پائی۔"
