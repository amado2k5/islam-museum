roles: [scholar]
gender: male
summary:
  ar: "أبو بكر الحافظ المعروف بأبي الأذان، حدّث عن جماعة وروى عنه ابن قانع وابن المنادي وكان ثقة، سكن سر من رأى وتوفى بها وله ثلاث وستون سنة {cite:muntazam-ibn-al-jawzi p. 188}."
  en: "Abu Bakr the hafiz known as Abu'l-Adhan, trustworthy transmitter heard by Ibn Qani' and Ibn al-Munadi; he lived at Samarra and died there aged sixty-three {cite:muntazam-ibn-al-jawzi p. 188}."
  es: "Abu Bakr el hafiz conocido como Abu'l-Adhan, transmisor fidedigno escuchado por Ibn Qani' e Ibn al-Munadi; vivió en Samarra y murió allí a los sesenta y tres años {cite:muntazam-ibn-al-jawzi p. 188}."
  fr: "Abu Bakr, le hafiz connu sous le nom d'Abu'l-Adhan, transmetteur digne de confiance entendu par Ibn Qani' et Ibn al-Munadi; il vivait à Samarra et y est mort à l'âge de soixante-trois ans {cite: muntazam-ibn-al-jawzi p. 188}."
  ur: "ابو بکر حافظ ابو الاذان کے نام سے مشہور، ثقہ ٹرانسمیٹر جسے ابن قانی اور ابن المنادی نے سنا ہے۔ سامرہ میں مقیم تھے اور وہیں تریسٹھ سال کی عمر میں وفات پائی۔ 188}۔"
  tr: "Ebu Bekir el-Hafiz, Ebu el-Azan olarak bilinir, bir gruptan rivayet etti, İbn Qani' ve İbn el-Manadi ise ondan rivayet etti. Güvenilirdi, onu görenlerin sırrında yaşadı ve orada öldü. Altmış üç yaşındaydı {atıf:muntazam-ibn-al-jawzi, s. 188}."
  id: "Abu Bakr al-Hafiz, yang dikenal sebagai Abu al-Adhan, menceritakan dari sebuah kelompok, dan Ibn Qani' serta Ibn al-Manadi menceritakan darinya. Ia dapat dipercaya, hidup dalam rahasia mereka yang melihatnya, dan meninggal di sana. Ia berusia enam puluh tiga tahun {cite:muntazam-ibn-al-jawzi, hlm. 188}."
