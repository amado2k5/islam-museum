summary:
  ar: "عالم مصري في الدراسات القرآنية، أستاذ كرسي الملك فهد للدراسات الإسلامية في مدرسة الدراسات الشرقية والإفريقية (سواس) بلندن ورئيس تحرير «مجلة الدراسات القرآنية». حفظ القرآن في طفولته في قرية الأسدية بمحافظة الشرقية، وتعلّم في الأزهر ودار العلوم ثم نال الدكتوراه من كامبريدج، ويدرّس في سواس منذ 1971. نشر ترجمته للقرآن لدى مطبعة جامعة أكسفورد سنة 2004، ونال وسام الإمبراطورية البريطانية سنة 2008."
  en: "Egyptian scholar of Qur'anic studies, King Fahd Professor of Islamic Studies at SOAS, University of London, and editor of the Journal of Qur'anic Studies. He memorised the Qur'an in childhood in the village of al-Isdiyya in Sharqia, studied at Al-Azhar and Dar al-Ulum and took his PhD at Cambridge, and has lectured at SOAS since 1971. Oxford University Press published his translation, The Qur'an: A New Translation, in 2004; he was appointed OBE in 2008."
  ur: "مصری عالمِ مطالعاتِ قرآن، سواس (یونیورسٹی آف لندن) میں اسلامیات کے کنگ فہد پروفیسر اور «جرنل آف قرآنک اسٹڈیز» کے مدیر۔ انہوں نے بچپن میں شرقیہ کے گاؤں الاسدیہ میں قرآن حفظ کیا، الازہر اور دار العلوم میں تعلیم پائی اور کیمبرج سے پی ایچ ڈی کی، اور 1971ء سے سواس میں تدریس کر رہے ہیں۔ آکسفورڈ یونیورسٹی پریس نے ان کا ترجمۂ قرآن 2004ء میں شائع کیا؛ 2008ء میں انہیں او بی ای مقرر کیا گیا۔"
