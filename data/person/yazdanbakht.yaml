label: { ar: "يزدانبخت", en: "Yazdanbakht" }
summary:
  ar: "يزدانبخت من رؤساء المنانية في المذهب في الدولة العباسية، وهو الذي أحضره المأمون من الري بعد أن آمنه فقطعه المتكلمون فقال له المأمون أسلم يا يزدانبخت فلولا ما أعطيناك من الأمان لكان لنا ولك شأن فقال له يزدانبخت نصيحتك يا أمير المؤمنين مسموعة وقولك مقبول ولكنك ممن لا يجبر الناس على ترك مذاهبهم فقال المأمون أجل، وكان أنزله بناحية المخرم ووكل به حفظة خوفا عليه من الفوغاء وكان فصيحا لسينا {cite:fihrist-ibn-al-nadim p. 473}."
  en: "Yazdanbakht — the Manichee chief who out-argued the mutakallimun before al-Ma'mun {cite:fihrist-ibn-al-nadim}"
