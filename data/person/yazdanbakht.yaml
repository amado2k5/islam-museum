summary:
  ar: "يزدانبخت من رؤساء المنانية في المذهب في الدولة العباسية، وهو الذي أحضره المأمون من الري بعد أن آمنه فقطعه المتكلمون فقال له المأمون أسلم يا يزدانبخت فلولا ما أعطيناك من الأمان لكان لنا ولك شأن فقال له يزدانبخت نصيحتك يا أمير المؤمنين مسموعة وقولك مقبول ولكنك ممن لا يجبر الناس على ترك مذاهبهم فقال المأمون أجل، وكان أنزله بناحية المخرم ووكل به حفظة خوفا عليه من الفوغاء وكان فصيحا لسينا {cite:fihrist-ibn-al-nadim p. 473}."
  en: "Yazdanbakht — the Manichee chief who out-argued the mutakallimun before al-Ma'mun {cite:fihrist-ibn-al-nadim}"
  es: "Yazdanbakht - el jefe maniqueo que superó al mutakallimun ante al-Ma'mun {cita:fihrist-ibn-al-nadim}"
  fr: "Yazdanbakht - le chef manichéen qui a dominé les mutakallimun devant al-Ma'mun {cite: fihrist-ibn-al-nadim}"
  ur: "یزدان بخت - مانیچی کا سردار جس نے المامون کے سامنے متکلم کی دلیل کو مسترد کر دیا"
  tr: "Yezdanbakht, Abbasi devletindeki Maniheyci mezhebin liderlerinden biriydi. Güvence altına alındıktan sonra el-Memun tarafından Rayy'den getirildi. İlahiyatçılar onu böldü. El-Memun ona, 'İslam'a dön, Yezdanbakht. Sana güvenlik sağlamasaydık, kendimize bir yerimiz olurdu.' dedi. Yazdanbakht ona, 'Ey, İnananların Komutanı, öğüdün duyulur ve kabul edilir, ama sen insanları mezheplerini terk etmeye zorlamayanlar arasındasın.' dedi. Al-Ma'mun, 'Evet.' diye yanıtladı. Onu el-Mukharram bölgesine yerleştirmiş ve kaos korkusuyla korumaları için muhafızlar görevlendirmişti. Sina'da etkileyici konuşuyordu {atıf:fihrist-ibn-al-nadim s. 473}."
  id: "Yazdanbakht adalah salah satu pemimpin sekte Manikhean di negara Abbasiyah. Ia dibawa oleh al-Ma'mun dari Rayy setelah ia diamankan. Para teolog menginterupsinya. Al-Ma'mun berkata kepadanya, 'Berpindah ke Islam, Yazdanbakht. Jika kami tidak memberimu keamanan, kami akan punya tempat untuk kami.' Yazdanbakht berkata kepadanya, 'Nasihatmu, wahai Panglima Orang Beriman, didengar dan diterima, tetapi engkau termasuk di antara mereka yang tidak memaksa orang meninggalkan sektenya.' Al-Ma'mun menjawab, 'Ya.' Ia menempatkan Al-Ma'mun di wilayah al-Mukharram dan menugaskan pengawal untuk menjaganya karena takut akan kekacauan. Ia fasih di Sinai {cite:fihrist-ibn-al-nadim hlm. 473}."
