summary:
  ar: "ضابط وسياسي مالي (1936–2020) من كايس، قاد انقلاب 1968 الذي أطاح بموديبو كيتا وحكم مالي رئيسا (1968–1991) حتى أطاحت به احتجاجات وانقلاب سنة 1991، فحُوكم وحُكم عليه بالإعدام مرتين ثم خُفف الحكم وعفا عنه الرئيس كوناري سنة 2002 قبل مغادرته، ومات في باماكو في 15 سبتمبر 2020."
  en: "Malian officer and politician (1936–2020) from Kayes who led the 1968 coup that overthrew Modibo Keïta and ruled Mali as president (1968–1991) until protests and a coup removed him in 1991; he was tried and twice sentenced to death, the sentences were commuted, and President Konaré pardoned him in 2002 shortly before leaving office. He died in Bamako on 15 September 2020."
  ur: "مالی افسر و سیاست دان (1936ء–2020ء)، کایس سے؛ 1968ء کی بغاوت کی قیادت کی جس نے مودیبو کیتا کو ہٹایا اور مالی کے صدر (1968ء–1991ء) رہے حتیٰ کہ 1991ء میں احتجاج اور بغاوت نے انھیں ہٹا دیا؛ مقدمہ چلا، دو بار سزائے موت ہوئی پھر تخفیف ہوئی اور 2002ء میں صدر کونارے نے معافی دی؛ 15 ستمبر 2020ء کو باماکو میں انتقال ہوا۔"
