summary:
  ar: "بطاقة أولية ليحيى بن علي بن حمود المعتلي بالله، الخليفة الحمودي بقرطبة وسفيانا في سنين فتنة الثغراء بعد عزله وعودته، توفي سنة ١٠٣٥م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Yahya ibn Ali ibn Hammud, the Hammudid caliph al-Mu'tali of Cordoba in the factional years of the eleventh century, d. 1035; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Yahya ibn Ali ibn Hammud, el califa hammudí al-Mu'tali de Córdoba en los años de las facciones del siglo XI, m. 1035; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature de Yahya ibn Ali ibn Hammud, le calife hammudide al-Mu'tali de Cordoue durant les années de troubles du XIe siècle, mort en 1035; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "گیارہویں صدی کے دھڑے بندی کے سالوں میں قرطبہ کے حمودی خلیفہ المطالی یحییٰ بن علی ابن حمود کے لیے ڈرافٹ کارڈ، ڈی۔ 1035; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Yahya ibn Ali ibn Hamoud al-Mu'tali Billah için, Ghra'nın Bölünmesi yıllarında Kordoba ve Sufyana'da görevden alınıp dönüşünden sonra görev yapan Hammudi Halifesi için ön kart. 1035 yılında öldü; İslam Devletleri Sözlüklerinde anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Yahya ibn Ali ibn Hamoud al-Mu'tali Billah, Khalifah Hammoudi di Cordoba dan Sufyana selama tahun-tahun Pembagian Ghra setelah ia dipindahkan dan kembali. Ia meninggal pada tahun 1035 M; ia dikenang dalam Kamus Negara-Negara Islam dan biografinya belum pernah ditinjau di halaman tersebut."
