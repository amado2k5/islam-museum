summary:
  ar: داعية وناشط حقوقي ملاوي. المتحدث الوطني باسم الجمعية الإسلامية في ملاوي ⁦(MAM)⁩ منذ سنوات طويلة، ومنسق المكتب الإسلامي للإعلام، ويعمل على قضايا الصحة والحوار مع غير المسلمين.
  en: Malawian preacher and rights activist. Long-serving national spokesperson of the Muslim Association of Malawi (MAM) and coordinator of its Islamic Information Bureau, working on health issues, media
    education and relations with non-Muslims.
  ur: ملاوی کے مبلغ اور حقوقی کارکن۔ مسلم ایسوسی ایشن آف ملاوی ⁦(MAM)⁩ کے برسہا برس قومی ترجمان اور اس کے اسلامک انفارمیشن بیورو کے کوآرڈینیٹر؛ صحت، میڈیا تربیت اور غیر مسلموں سے تعلقات پر کام کرتے ہیں۔
  es: "Predicador y activista de derechos humanos de Malawi. Portavoz nacional de larga trayectoria de la Asociación Musulmana de Malawi (MAM) y coordinador de su Oficina de Información Islámica, donde trabaja en temas de salud, educación mediática y relaciones con personas no musulmanas."
  fr: "Prédicateur et militant des droits de l'homme malawite. Porte-parole national de longue date de l'Association musulmane du Malawi (MAM) et coordinateur de son Bureau d'information islamique, œuvrant sur les questions de santé, d'éducation aux médias et de relations avec les non-musulmans."
  tr: "Malavili vaiz ve insan hakları aktivisti. Uzun yıllar Malavi İslam Derneği'nin (MAM) ulusal sözcüsü, İslami Medya Ofisi'nin koordinatörü ve sağlık konuları ile gayrimüslimlerle diyalog üzerinde çalışmaktadır."
  id: "Penceramah dan aktivis hak asasi manusia Malawi. Juru bicara nasional untuk Asosiasi Islam Malawi (MAM) selama bertahun-tahun, koordinator Kantor Media Islam, dan bekerja di isu kesehatan serta dialog dengan non-Muslim."
