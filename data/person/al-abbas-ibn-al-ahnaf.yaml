summary:
  ar: "شاعر عباسي نشأ في بغداد، وأهله في البصرة، ونُسب إلى بني حنيفة. وأخذ من قول عبد الله بن الحسن للمنصور قد مضى من بؤسنا أيام ومن نعيمك أيام فقال فإن تلحظي حالي وحالك مرة بنظرة عين عن هوى النفس تحجب {cite:muruj-al-dhahab p. 288}، وعند المسعودي وجده جماعة من أهل البصرة ملقى تحت شجرة في طريق الحج لا يحير جواباً فأنشأ يا غريب الدار عن وطنه مفرداً يبكي على شجنه ثم سمع تغريد طائر فقال ولقد زاد الفؤاد شجواً طائر يبكي على فننه شفه ما شفني فبكى كلنا يبكي على سكنه ثم فاضت نفسه فغسلوه ودفنوه {cite:muruj-al-dhahab p. 496-497}"
  en: "An Abbasid poet raised in Baghdad, with family in Basra. He was linked by nisba to the Banu Hanifa."
