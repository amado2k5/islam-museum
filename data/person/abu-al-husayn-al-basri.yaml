summary:
  ar: "أبو الحسين محمد بن علي بن الطيب البصري المتكلم على مذهب المعتزلة؛ أحد متقدمي الأعلام المشار إليه في هذا الفن، كان جيد الكلام مليح العبارة غزير الإنتاج، وله التصانيف الفائقة في أصول الفقه منها «المعتمد» وهو كتاب كبير أخذ منه فخر الدين الرازي كتاب المحصول، وله «تصفح الأدلة» في مجلدين و«غرر الأدلة» و«شرح الأصول الخمسة» وكتاب في الإمامة {cite:wafayat-ayan}."
  en: "Abu al-Husayn Muhammad ibn Ali ibn al-Tayyib al-Basri, a theologian (mutakallim) following the Mu'tazili school; one of the early leading figures in this field, fine in speech, graceful in expression, and prolific. He wrote outstanding works on the principles of jurisprudence, among them al-Mu'tamad, a large book from which Fakhr al-Din al-Razi took his al-Mahsul; also Tasaffuh al-adilla in two volumes, Ghurar al-adilla, a commentary on the Five Principles (al-Usul al-khamsa), and a book on the imamate {cite:wafayat-ayan}."
