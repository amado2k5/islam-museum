died: { edtf: "1044~", hijri: "0436", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي ببغداد يوم الثلاثاء خامس شهر ربيع الآخر سنة ست وثلاثين وأربعمائة ودُفن في مقبرة الشونيزية وصلى عليه القاضي أبو عبد الله الصيمري {cite:wafayat-ayan}." }
summary:
  ar: "أبو الحسين محمد بن علي بن الطيب البصري المتكلم على مذهب المعتزلة؛ أحد متقدمي الأعلام المشار إليه في هذا الفن، كان جيد الكلام مليح العبارة غزير الإنتاج، وله التصانيف الفائقة في أصول الفقه منها «المعتمد» وهو كتاب كبير أخذ منه فخر الدين الرازي كتاب المحصول، وله «تصفح الأدلة» في مجلدين و«غرر الأدلة» و«شرح الأصول الخمسة» وكتاب في الإمامة {cite:wafayat-ayan}."
  en: "Abu al-Husayn Muhammad ibn Ali ibn al-Tayyib al-Basri, a theologian (mutakallim) following the Mu'tazili school; one of the early leading figures in this field, fine in speech, graceful in expression, and prolific. He wrote outstanding works on the principles of jurisprudence, among them al-Mu'tamad, a large book from which Fakhr al-Din al-Razi took his al-Mahsul; also Tasaffuh al-adilla in two volumes, Ghurar al-adilla, a commentary on the Five Principles (al-Usul al-khamsa), and a book on the imamate {cite:wafayat-ayan}."
  fr: "Abu al-Husayn Muhammad ibn Ali ibn al-Tayyib al-Basri, théologien (mutakallim) de l'école mu'tazilite ; l'une des premières grandes figures de ce domaine, à la parole fine, à l'expression gracieuse, et prolifique. Il écrivit des ouvrages remarquables sur les fondements du droit, parmi lesquels al-Mu'tamad, un grand livre dont Fakhr al-Din al-Razi tira son al-Mahsul ; ainsi que Tasaffuh al-adilla en deux volumes, Ghurar al-adilla, un commentaire des Cinq Principes (al-Usul al-khamsa) et un livre sur l'imamat {cite:wafayat-ayan}."
  es: "Abu al-Husayn Muhammad ibn Ali ibn al-Tayyib al-Basri, un teólogo (mutakallim) seguidor de la escuela Mu'tazili; una de las primeras figuras destacadas en este campo, de elocuencia, expresión elegante y prolífico. Escribió obras sobresalientes sobre los principios de la jurisprudencia, entre ellas al-Mu'tamad, un extenso libro del cual Fakhr al-Din al-Razi extrajo su al-Mahsul; también Tasaffuh al-adilla en dos volúmenes, Ghurar al-adilla, un comentario sobre los Cinco Principios (al-Usul al-khamsa), y un libro sobre el imamato {cite:wafayat-ayan}."
