id: person/abdullah-ibn-abi-bakr
education:
  did_you_know:
    ar: "عبد الله بن أبي بكر وصفته أخته عائشة بأنه «غلام شاب ثقف لقن»؛ كان يبيت عند الغار ويدلج بسحر فيصبح مع قريش كبائت، وما يسمع أمراً يُكتادان به إلا وعاه وأتاهما به ليلاً."
    en: "Abd Allah ibn Abi Bakr — his sister Aisha called him 'a quick, sharp young man' — slept at the cave and slipped out before dawn to blend with Quraysh, carrying back every plot he heard by night."
    ur: "عبداللہ بن ابی بکر — ان کی بہن عائشہ نے انہیں «تیز فہم نوجوان» کہا — غار کے پاس رات گزارتے اور صبح سے پہلے نکل کر قریش میں گھل مل جاتے، اور ہر سازش رات میں پہنچا دیتے۔"
    sources: [source/sahih-al-bukhari, source/mubarakpuri-raheeq]
