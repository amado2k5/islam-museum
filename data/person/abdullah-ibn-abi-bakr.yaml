summary:
  en: "Abu Bakr's son, 'a bright, quick-witted youth' in Aisha's description, who spent the three cave nights with the fugitives, left before dawn to mingle with Quraysh by day, and brought them the news each evening."
  fr: "Le fils d'Abu Bakr, « un jeune homme vif et à l'esprit prompt » selon la description d'Aïcha, qui passa les trois nuits de la grotte avec les fugitifs, partait avant l'aube pour se mêler aux Quraych le jour, et leur apportait les nouvelles chaque soir."
  ar: "ابن أبي بكر، وصفته عائشة بأنه «غلام شاب ثقف لقن»؛ كان يبيت عند النبي وأبيه في الغار ويدلج بسحر فيصبح مع قريش كبائت، فما يسمع أمراً يُكتادان به إلا وعاه وأتاهما به ليلاً."
  ur: "ابو بکر کے فرزند، عائشہ کے قول میں ایک ذہین تیز نوجوان؛ غار کی راتیں نبی اور اپنے والد کے ساتھ گزاریں اور فجر سے پہلے نکل کر صبح قریش کے پاس رہتے۔"
  es: "El hijo de Abu Bakr, descrito por Aisha como \"un joven brillante e ingenioso\", que pasó las tres noches en la cueva con los fugitivos, salía antes del amanecer para mezclarse con los Quraysh durante el día y les llevaba las noticias cada tarde."
  tr: "Aişe'nin \"genç, zeki ve güzel konuşan bir çocuk\" olarak tanımladığı İbn Abi Bekir, geceyi Peygamber ve babasıyla mağarada geçirir, şafak vakti Kureyş'in yanına giderdi; sanki geceyi orada geçirmiş gibi davranır, onlara karşı kurulan hiçbir komployu duymadan ezberleyip geceleyin onlara getirmezdi."
  id: "Ibn Abi Bakr, yang digambarkan oleh Aisyah sebagai \"seorang pemuda yang cerdas dan fasih berbicara\"; ia biasa bermalam bersama Nabi dan ayahnya di dalam gua dan keluar saat subuh untuk bersama kaum Quraisy seolah-olah ia telah bermalam di sana, dan ia tidak akan mendengar rencana jahat apa pun yang ditujukan kepada mereka tanpa menghafalnya dan menyampaikannya kepada mereka di malam hari."
