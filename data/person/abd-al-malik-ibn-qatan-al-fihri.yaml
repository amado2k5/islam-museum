id: person/abd-al-malik-ibn-qatan-al-fihri
class: person
label: { ar: "عبد الملك بن قطن الفهري", en: "Abd al-Malik ibn Qatan al-Fihri", fr: "Abd al-Malik ibn Qatan al-Fihri", es: "Abd al-Malik ibn Qatan al-Fihri", ur: "عبد الملک بن قطان الفہری" }
gender: male
summary:
  ar: "أمير الأندلس مرتين؛ قدمها في رمضان سنة أربع عشرة ومائة وولي سنتين وكان ظلوماً جائراً في حكومته وغزا أرض البشكنس سنة خمس عشرة، ثم وثب على عقبة بن الحجاج فقتله واستقام له الأمر، حتى دخل بلج بن بشر القشيري بجند الشام ناجياً من وقعة كلثوم بن عياض مع البربر بملوية فثار عليه وقتله وهو ابن سبعين سنة، وانهاز الفهريون فامتنعوا عليه وقام بأمرهم قطن وأمية ابنا عبد الملك {cite:nafh-tib-maqqari p. 272-273}. ويذكر الكتاب أنه تولى الأندلس بعد استشهاد عنبسة بن سحيم، ثم عزله عبيد الله بن الحبحاب بأمر الخليفة، وخلعه أهل الأندلس، ثم ولي من جديد، وقُتل بعد خلاف مع بلج بن بشر. {cite:salabi-umayyad-state-2020 p.485-486}"
  en: "Twice governor of al-Andalus; harsh in rule, he raided Gascony, killed his successor Uqba in a coup, and was himself killed at seventy by the Syrian commander Balj b. Bishr, against whom his sons Qatan and Umayya then led the Fihrid revolt {cite:nafh-tib-maqqari p. 272-273}."
  fr: "Deux fois gouverneur d'al-Andalus ; dur dans son gouvernement, il fit une razzia en Gascogne, tua son successeur Uqba lors d'un coup de force, et fut lui-même tué à soixante-dix ans par le commandant syrien Balj b. Bishr, contre qui ses fils Qatan et Umayya menèrent ensuite la révolte des Fihrides {cite:nafh-tib-maqqari p. 272-273}."
  es: "Gobernador de al-Andalus en dos ocasiones; de gobierno severo, saqueó Gascuña, mató a su sucesor Uqba en un golpe de estado y fue asesinado a los setenta años por el comandante sirio Balj b. Bishr, contra quien sus hijos Qatan y Umayya lideraron la revuelta Fihrid {cite:nafh-tib-maqqari p. 272-273}."
  ur: "اندلس کا دو مرتبہ گورنر۔ سخت حکمرانی میں، اس نے گیسکونی پر حملہ کیا، اپنے جانشین عقبہ کو بغاوت میں مار ڈالا، اور خود شامی کمانڈر بلج بن کے ہاتھوں ستر سال کی عمر میں مارا گیا۔ بشر، جس کے خلاف اس کے بیٹوں قطان اور امیہ نے پھر فہری بغاوت کی قیادت کی۔ 272-273}۔"
  tr: "Endülüs Emiri iki kez hüküm sürmüştür; Hicri 114 yılının Ramazan ayında gelmiş ve iki yıl hüküm sürmüştür. Hükümranlığında zalim ve baskıcı olmuştur. Hicri 115 yılında Bask Ülkesini işgal etmiş, ardından Ukba ibn el-Haccac'a saldırmış ve onu öldürerek gücünü pekiştirmiştir. Daha sonra, Kulthum ibn İyad'ın Moulouya Nehri'ndeki Berberilerle yaptığı savaştan kaçan Balj ibn Bişr el-Kuşeyri, Suriye ordusuyla birlikte gelmiştir. Ona karşı isyan etmiş ve yetmiş yaşında öldürmüştür. Fihri kabileleri yenilgiye uğramış ve ona boyun eğmeyi reddetmişlerdir ve Abd el-Malik'in oğulları Katan ve Umeyye onların işlerini devralmıştır. {kaynak:nafh-tib-makqkari s. 272-273} Kitapta, Enbasa ibn Suhaym'ın şehit edilmesinden sonra Endülüs'te iktidara geldiği, daha sonra halifenin emriyle Ubeydullah ibn el-Habhab tarafından görevden alındığı ve Endülüs halkının onu tahttan indirdiği belirtiliyor. Daha sonra tekrar göreve getirildi, ancak Balj ibn Bişr ile bir anlaşmazlık sonucu öldürüldü. {cite:salabi-umayyad-state-2020 s. 485-486}"
  id: "Emir Andalusia dua kali; ia tiba pada bulan Ramadan tahun 114 H dan memerintah selama dua tahun. Ia adalah seorang tiran dan penindas dalam pemerintahannya. Ia menyerang Negara Basque pada tahun 115 H, kemudian ia menyerang Uqba ibn al-Hajjaj dan membunuhnya, sehingga memperkuat kekuasaannya. Kemudian Balj ibn Bishr al-Qushayri masuk dengan pasukan Suriah, setelah lolos dari pertempuran Kulthum ibn Iyad dengan Berber di Sungai Moulouya. Ia memberontak terhadapnya dan membunuhnya pada usia tujuh puluh tahun. Suku Fihri dikalahkan dan menolak untuk tunduk kepadanya, dan Qatan dan Umayya, putra-putra Abd al-Malik, mengambil alih urusan mereka. {cite:nafh-tib-maqqari hlm. 272-273}. Buku tersebut menyebutkan bahwa ia mengambil alih kekuasaan di Andalusia setelah kemartiran Anbasa ibn Suhaym, kemudian Ubayd Allah ibn al-Habhab memecatnya atas perintah Khalifah, dan penduduk Andalusia menggulingkannya. Ia kemudian diangkat kembali, tetapi dibunuh setelah perselisihan dengan Balj ibn Bishr. {cite:salabi-umayyad-state-2020 p. 485-486}"
