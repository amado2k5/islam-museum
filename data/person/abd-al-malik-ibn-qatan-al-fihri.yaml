id: person/abd-al-malik-ibn-qatan-al-fihri
class: person
label: { ar: "عبد الملك بن قطن الفهري" }
gender: male
summary:
  ar: "أمير الأندلس مرتين؛ قدمها في رمضان سنة أربع عشرة ومائة وولي سنتين وكان ظلوماً جائراً في حكومته وغزا أرض البشكنس سنة خمس عشرة، ثم وثب على عقبة بن الحجاج فقتله واستقام له الأمر، حتى دخل بلج بن بشر القشيري بجند الشام ناجياً من وقعة كلثوم بن عياض مع البربر بملوية فثار عليه وقتله وهو ابن سبعين سنة، وانهاز الفهريون فامتنعوا عليه وقام بأمرهم قطن وأمية ابنا عبد الملك {cite:nafh-tib-maqqari p. 272-273}. ويذكر الكتاب أنه تولى الأندلس بعد استشهاد عنبسة بن سحيم، ثم عزله عبيد الله بن الحبحاب بأمر الخليفة، وخلعه أهل الأندلس، ثم ولي من جديد، وقُتل بعد خلاف مع بلج بن بشر. {cite:salabi-umayyad-state-2020 p.485-486}"
  en: "Twice governor of al-Andalus; harsh in rule, he raided Gascony, killed his successor Uqba in a coup, and was himself killed at seventy by the Syrian commander Balj b. Bishr, against whom his sons Qatan and Umayya then led the Fihrid revolt {cite:nafh-tib-maqqari p. 272-273}."
