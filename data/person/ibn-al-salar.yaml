summary:
  ar: "وزير فاطمي من أصل أرتقي، تولى الوزارة سنة 544 للهجرة وكان له تحالف مع نور الدين ضد الفرنجة، واغتاله ربيب له في القاهرة سنة 548 للهجرة."
  en: "Fatimid vizier of Artukid origin, who seized the vizierate in 544/1149 with the title al-Malik al-'Adil and was killed in Cairo in 548/1153 by a stepson's agent. He was the first Fatimid vizier to consider an alliance with Nur al-Din against the Franks {cite:encyclopaedia-of-islam-2 vol. 1 p. 217}."
  es: "Visir fatimí de origen artúquida, que tomó el visirato en 544/1149 con el título de al-Malik al-'Adil y fue asesinado en El Cairo en 548/1153 por un agente de su hijastro. Fue el primer visir fatimí en considerar una alianza con Nur al-Din contra los francos {cite:encyclopaedia-of-islam-2 vol. 1 p. 217}."
  fr: "Vizir fatimide d'origine artoucide, il s'empara du vizirat en 544/1149 sous le titre d'al-Malik al-'Adil et fut assassiné au Caire en 548/1153 par un agent de son beau-fils. Il fut le premier vizir fatimide à envisager une alliance avec Nur al-Din contre les Francs (voir Encyclopaedia of Islam, vol. 1, p. 217)."
  ur: "ارتوکیڈ نسل کا فاطمی وزیر، جس نے 544/1149 میں المالک العدل کے لقب سے وزیریٹ پر قبضہ کیا اور 548/1153 میں قاہرہ میں سوتیلے بیٹے کے ایجنٹ کے ہاتھوں قتل ہوا۔ وہ پہلا فاطمی وزیر تھا جس نے نورالدین کے ساتھ فرینکوں کے خلاف اتحاد پر غور کیا۔ 1 ص۔ 217}۔"
