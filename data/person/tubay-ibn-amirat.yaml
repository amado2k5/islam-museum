id: person/tubay-ibn-amirat
class: person
label: { ar: "تبيع بن امرأة كعب الأحبار" }
summary:
  ar: "عند البلاذري: ابن امرأة كعب الأحبار كان ممن فتح أرواد وبها أقرأه مجاهد بن جبر القرآن ويُقال إنه أقرأه برودس."
  en: "In al-Baladhuri: son of Ka'b al-Ahbar's wife, among Arwad's openers; Mujahid ibn Jabr taught him the Qur'an there — or, it is said, at Rhodes."
  es: "En al-Baladhuri: hijo de la esposa de Ka'b al-Ahbar, entre los abridores de Arwad; Mujahid ibn Jabr le enseñó el Corán allí, o, según se dice, en Rodas."
  fr: "Dans al-Baladhuri: fils de la femme de Ka'b al-Ahbar, parmi les ouvreurs d'Arwad; Mujahid ibn Jabr lui enseigna le Coran là-bas — ou, dit-on, à Rhodes."
  ur: "البلادوری میں: کعب الاحبار کی بیوی کا بیٹا، ارواد کے اوپنرز میں؛ مجاہد ابن جبر نے انہیں وہاں قرآن پڑھایا — یا کہا جاتا ہے، روڈس میں۔"
  tr: "El-Baladhuri'ye göre: Bir kadının oğlu Ka'b al-Ahbar, Arwad'ı fethedenler arasındaydı ve Mücahit bin Cebr orada Kur'an'ı okudu, Brodes'te ona okuduğu söylenir."
  id: "Menurut Al-Baladhuri: Putra seorang wanita Ka'b al-Ahbar termasuk di antara mereka yang menaklukkan Arwad, dan Mujahid ibn Jabr membaca Al-Qur'an di sana, dan dikatakan bahwa ia membacanya di Brodes."
