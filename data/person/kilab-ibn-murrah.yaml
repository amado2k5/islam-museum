summary:
  ar: "أبو قصي وزهرة؛ مات وقصيه رضيع فسافرت به أمه فاطمة بنت سعد إلى اليمن فنشأ هناك حتى رجع شاباً إلى مكة، ومن زهرة بن كلاب بنو زهرة الذين منهم آمنة بنت وهب أم النبي وعبد الرحمن بن عوف وسعد بن أبي وقاص {cite:mubarakpuri-raheeq p.48-49} {cite:ibn-hisham-sira 1/1-4} {cite:isaba}."
  en: "Father of Qusayy and Zuhra; he died while Qusayy was an infant, so his mother Fatima bint Sa'd took him to Yemen where he grew up until he returned to Mecca as a young man. From Zuhra ibn Kilab come Banu Zuhra — the clan of Amina bint Wahb the Prophet's mother, Abd al-Rahman ibn Awf and Sa'd ibn Abi Waqqas {cite:mubarakpuri-raheeq p.48-49} {cite:ibn-hisham-sira 1/1-4} {cite:isaba}."
  es: "Padre de Qusayy y Zuhra; murió cuando Qusayy era un bebé, por lo que su madre, Fátima bint Sa'd, lo llevó a Yemen, donde creció hasta que regresó a La Meca siendo joven. De Zuhra ibn Kilab desciende Banu Zuhra, el clan de Amina bint Wahb, la madre del Profeta, Abd al-Rahman ibn Awf y Sa'd ibn Abi Waqqas {cite:mubarakpuri-raheeq p.48-49} {cite:ibn-hisham-sira 1/1-4} {cite:isaba}."
  fr: "Père de Qusayy et Zuhra, il mourut alors que Qusayy était encore bébé. Sa mère, Fatima bint Sa'd, l'emmena alors au Yémen où il grandit jusqu'à son retour à La Mecque, devenu jeune homme. De Zuhra ibn Kilab descendent les Banu Zuhra, le clan d'Amina bint Wahb, la mère du Prophète, d'Abd al-Rahman ibn Awf et de Sa'd ibn Abi Waqqas."
  ur: "قصی اور زہرا کے والد؛ ان کی وفات اس وقت ہوئی جب قصیٰ شیر خوار تھے، اس لیے ان کی والدہ فاطمہ بنت سعد اسے یمن لے گئیں جہاں وہ جوان ہوئے یہاں تک کہ وہ مکہ واپس آئے۔ زہرہ ابن کلاب سے بنو زہرہ آتے ہیں - آمنہ بنت وہب کا قبیلہ نبی کی والدہ عبدالرحمن بن عوف اور سعد بن ابی وقاص {حوالہ:مبارکپوری الرحیق صفحہ 48-49} {حوالہ: ابن ہشام سیرہ 1/1-4}"
