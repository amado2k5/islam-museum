summary:
  ar: "أبو قصي وزهرة؛ مات وقصيه رضيع فسافرت به أمه فاطمة بنت سعد إلى اليمن فنشأ هناك حتى رجع شاباً إلى مكة، ومن زهرة بن كلاب بنو زهرة الذين منهم آمنة بنت وهب أم النبي وعبد الرحمن بن عوف وسعد بن أبي وقاص {cite:mubarakpuri-raheeq p.48-49} {cite:ibn-hisham-sira 1/1-4} {cite:isaba}."
  en: "Father of Qusayy and Zuhra; he died while Qusayy was an infant, so his mother Fatima bint Sa'd took him to Yemen where he grew up until he returned to Mecca as a young man. From Zuhra ibn Kilab come Banu Zuhra — the clan of Amina bint Wahb the Prophet's mother, Abd al-Rahman ibn Awf and Sa'd ibn Abi Waqqas {cite:mubarakpuri-raheeq p.48-49} {cite:ibn-hisham-sira 1/1-4} {cite:isaba}."
