summary:
  ar: "رجل من جرحى القادسية أريح تحت النخلة الوحيدة بين موضع الوقعة وحصن العذيب وهو يجود بنفسه ويقول آلا فاسلمي يا نخلة بين قادس وبين العذيب لا يجاورك النخل، وكانت النخلة علامة للجرحى إذا حمل أحدهم إلى العذيب سأل أن يراح تحتها ويقول قد قربت من السواد {cite:muruj-al-dhahab p. 613}."
  en: "The dying Tayyi' soldier who greeted the lone palm between the field and al-'Udhayb — the tree under which every wounded man asked to rest, saying 'the Sawad is near' {cite:muruj-al-dhahab p. 613}."
  es: "El soldado Tayyi' moribundo que saludó a la palmera solitaria entre el campo y al-'Udhayb —el árbol bajo el cual todo hombre herido pedía descansar, diciendo 'el Sawad está cerca' {cite:muruj-al-dhahab p. 613}."
  fr: "Le soldat Tayyi' mourant qui salua le palmier solitaire entre le champ et al-'Udhayb — l'arbre sous lequel chaque homme blessé demandait à se reposer, disant « le Sawad est proche » {cite:muruj-al-dhahab p. 613}."
  ur: "مرتا ہوا طائی سپاہی جس نے کھیت اور الذہیب کے درمیان اکیلی کھجور کو سلام کیا - وہ درخت جس کے نیچے ہر زخمی آدمی آرام کرنے کے لیے کہتا تھا کہ 'سواد قریب ہے'۔ 613}۔"
  tr: "El-Kadisiye'nin yaralılarından biri, savaş yeri ile El-Ədhib kalesi arasındaki tek palmiye ağacının altında dinleniyor ve cömertçe kendi kendine, \"Ey palmiye ağacı, Kadis ile El-Adhib arasında palmiye ağaçları ait değildir.\" dedi. Palmiye ağacı yaralılar için bir işaretti; biri onu El-Adhib'a getirdiğinde, altında dinlenmek istedi ve dedi ki, \"Karanlığa yaklaştın.\" {alıntı:Muruj-al-Dhahab, s. 613}."
  id: "Seorang pria dari kelompok terluka Al-Qadisiyah beristirahat di bawah pohon palem tunggal antara lokasi pertempuran dan benteng Al-Adhib, dengan murah hati berkata pada dirinya sendiri, \"Wahai pohon palem, di antara Qadis dan Al-Adhib, pohon palem itu bukan miliknya.\" Pohon palem adalah tanda bagi yang terluka; ketika seseorang membawanya kepada Al-Adhib, ia meminta untuk beristirahat di bawahnya dan berkata, \"Kamu telah mendekati kegelapan.\" {cite:muruj-al-dhahab, hlm. 613}."
