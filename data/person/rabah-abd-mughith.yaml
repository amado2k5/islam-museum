id: person/rabah-abd-mughith
class: person
label: { ar: "رباح مولى مغيث" }
gender: male
summary:
  ar: "أسود من عبيد مغيث الرومي ذو بأس ونجدة؛ كمن في جنان إلى جانب كنيسة غربي قرطبة التي تحصن بها علجها، فأبصر به أهلها وأخذوه وحسبوه مصبوعاً فغسلوه حتى أدموه، ومكث في إسارهم سبعة أيام إلى أن فر ليلاً وأخبر مغيثاً بموضع القناة التي يأتيهم منها الماء فقطعها عنهم {cite:nafh-tib-maqqari p. 298}."
  en: "Mughith's slave who infiltrated the church-holdout's garden; captured and scrubbed raw by men who had never seen a black man, he escaped after seven days and led his master to the water channel that fed the stronghold {cite:nafh-tib-maqqari p. 298}."
  es: "El esclavo de Mughith que se infiltró en el jardín del reducto de la iglesia; capturado y frotado brutalmente por hombres que nunca habían visto a un hombre negro, escapó después de siete días y condujo a su amo al canal de agua que alimentaba la fortaleza {cite:nafh-tib-maqqari p. 298}."
  fr: "L'esclave de Mughith qui s'était infiltré dans le jardin du bastion de l'église; capturé et frotté à vif par des hommes qui n'avaient jamais vu d'homme noir, il s'échappa après sept jours et conduisit son maître jusqu'au canal d'eau qui alimentait la forteresse {cite:nafh-tib-maqqari p. 298}."
  ur: "مغیث کا غلام جس نے چرچ کے باغ میں گھس لیا؛ ان لوگوں نے پکڑا اور کچا جھاڑ دیا جنہوں نے کبھی کسی سیاہ فام آدمی کو نہیں دیکھا تھا، وہ سات دن کے بعد فرار ہو گیا اور اپنے مالک کو پانی کے نالے کی طرف لے گیا جس نے قلعہ کو پانی دیا تھا۔ 298}۔"
