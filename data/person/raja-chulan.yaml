summary:
  ar: "أمير وإداري من أسرة بيراك الملكية في الملايو البريطانية (1869–1933)، وهو الابن الثاني للسلطان عبد الله محمد شاه الثاني. عمل في الإدارة الاستعمارية في بيراك، وشارك في قيام دول الملايو المتحدة سنة 1896، ونُصّب «راجا دي هيلير بيراك» سنة 1920، وقاد مع حكام ملايويين آخرين المطالبة بتشكيل فوج ملايوي، وهو ما أدى لاحقًا إلى إنشاء الفوج الملكي الملايوي."
  en: "Perak prince and administrator in British Malaya (1869–1933), second son of Sultan Abdullah Muhammad Shah II. He served in the Perak administration, took part in forming the Federated Malay States in 1896, was installed as Raja Di-Hilir Perak in 1920, and with other Malay rulers pressed the Colonial Office to raise a Malay infantry regiment, the campaign that led to the Royal Malay Regiment."
  ur: "برطانوی ملایا میں پیراک کے شاہی خاندان کے شہزادے اور منتظم (1869ء–1933ء)، سلطان عبداللہ محمد شاہ ثانی کے دوسرے بیٹے۔ انہوں نے پیراک کی انتظامیہ میں خدمات انجام دیں، 1896ء میں وفاقی ملایہ ریاستوں کے قیام میں حصہ لیا، 1920ء میں «راجا دی ہلیر پیراک» مقرر ہوئے، اور دیگر ملایہ حکمرانوں کے ساتھ ملایہ انفنٹری رجمنٹ کے قیام کا مطالبہ کیا جس سے بعد میں رائل ملایہ رجمنٹ وجود میں آئی۔"
