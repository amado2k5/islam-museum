summary:
  ar: "حسين شاه الشرقي (ت. 1505)، سادس سلاطين جونبور في شمال الهند وآخرهم، وابن محمود شاه الشرقي. خلف أخاه محمد شاه سنة 1458، ووسّع ملكه نحو أوريسا وغواليور، ثم خاض حربًا طويلة مع بهلول لودي صاحب دلهي انتهت بطرده من جونبور سنة 1479، فلجأ إلى كهلغاون في بهار حيث أمضى بقية عمره يسكّ النقود باسمه، وتوفي سنة 1505 ودُفن في جونبور. يُذكر اهتمامه بالفن والموسيقى وإسهامه في تطوير لون الخيال الغنائي."
  en: "Husain Shah Sharqi (d. 1505), sixth and last sultan of Jaunpur in northern India and a son of Mahmud Shah Sharqi. He succeeded his brother Muhammad Shah in 1458, expanded his kingdom towards Orissa and Gwalior, then fought a long war with Bahlul Lodi of Delhi that ended with his expulsion from Jaunpur in 1479. He took asylum at Kahalgaon in Bihar, where he spent the rest of his life still minting coins in his own name, died in 1505 and was buried at Jaunpur. He is remembered for his interest in art and music and his contribution to the development of khayal singing."
  ur: "حسین شاہ شرقی (وفات 1505ء)، شمالی ہندوستان کی جونپور سلطنت کے چھٹے اور آخری سلطان اور محمود شاہ شرقی کے بیٹے۔ وہ 1458ء میں اپنے بھائی محمد شاہ کے جانشین بنے، اڑیسہ اور گوالیار کی طرف اپنی مملکت وسیع کی، پھر دہلی کے بہلول لودی سے طویل جنگ لڑی جو 1479ء میں ان کی جونپور سے بے دخلی پر ختم ہوئی۔ انھوں نے بہار کے کہلگاؤں میں پناہ لی، جہاں باقی عمر اپنے نام کے سکے ڈھالتے گزاری، 1505ء میں وفات پائی اور جونپور میں دفن ہوئے۔ فن و موسیقی سے ان کی دلچسپی اور خیال گائیکی کی ترقی میں ان کا حصہ مشہور ہے۔"

