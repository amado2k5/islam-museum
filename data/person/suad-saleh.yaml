summaries:
  ar: «أستاذة مصرية في الفقه المقارن بجامعة الأزهر وداعية تلفزيونية، وُلدت سنة 1945، ترأست قسم الفقه المقارن بكلية الدراسات الإسلامية والعربية للبنات ولُقبت بـ«مفتية النساء»، وعُرفت بآرائها المثيرة للجدل في قضايا المرأة وبمتابعتها القضايا الفقهية النسائية في الإعلام المصري.»
  en: "Egyptian professor of comparative fiqh at Al-Azhar University and television preacher, born in 1945. She headed the comparative fiqh department at the Faculty of Islamic and Arabic Studies for Girls, was nicknamed 'the women's mufti', and is known for controversial published positions on women's questions."
  ur: «جامعہ ازہر میں فقہِ مقارن کی مصری پروفیسر اور ٹیلی ویژن داعیہ، 1945ء میں پیدا ہوئیں؛ شعبۂ فقہِ مقارن کی سربراہ رہیں، «مفتیۂ نساء» کہلائیں اور خواتین کے مسائل پر اپنے متنازع مواقف کے لیے مشہور ہیں۔»
