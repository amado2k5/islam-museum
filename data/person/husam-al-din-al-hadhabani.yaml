  ar: "أبو علي محمد بن علي الكردي، من كبار الدولة وأجلانها؛ كان له اختصاص زائد بالملك الصالح نجم الدين وناب في سلطنة دمشق له ثم في سلطنة مصر وحج سنة تسع وأربعين ثم أصابه في آخر عمره صرع وتزايد به حتى مات؛ ولد بحلب سنة اثنتين وتسعين وخمسمائة وله شعر جيد {cite:shadharat-dhahab p. 304}."
  en: "The Kurdish amir (b. Aleppo 592) — al-Salih Ayyub's intimate, his na'ib over Damascus then Egypt's sultanate; epilepsy crept on him till it killed him; he left good verse {cite:shadharat-dhahab p. 304}."
  es: "El emir kurdo (n. Alepo 592) — íntimo de al-Salih Ayyub, su na'ib sobre Damasco y luego sobre el sultanato de Egipto; la epilepsia lo aquejó hasta matarlo; dejó buenos versos {cite:shadharat-dhahab p. 304}."
  fr: "L'émir kurde (né à Alep en 592) — intime d'al-Salih Ayyub, son na'ib sur Damas puis le sultanat d'Égypte; l'épilepsie l'a atteint jusqu'à ce qu'il le tue; il a laissé de bons vers {cite: shadharat-dhahab p. 304}."
  ur: "کرد امیر ⁦(پیدائش حلب 592)⁩ - الصالح ایوب کا قریبی، دمشق پر اس کا نائب پھر مصر کی سلطنت؛ مرگی اس پر پڑی یہاں تک کہ اس کی موت ہوگئی۔ انہوں نے اچھی آیت چھوڑ دی 304}۔"
