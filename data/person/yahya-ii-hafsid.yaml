summary:
  ar: يحيى الواثق بالله بن محمد المستنصر بالله الحفصي، من ملوك الدولة الحفصية بتونس، بويع بعد أبيه سنة 675 هـ، وثار عليه عمه إبراهيم بن يحيى فخلع نفسه سنة 678 هـ ثم قتل، وتوفي سنة 679 هـ بحسب الزركلي.
  en: Yahya al-Wathiq billah ibn Muhammad al-Mustansir billah, Hafsid king at Tunis; acknowledged after his father in 675 AH, deposed himself in 678 AH when his uncle Ibrahim ibn Yahya rose against him, and was killed by that uncle; al-Zirikli dates his death to 679 AH.
  es: "Yahya al-Wathiq billah ibn Muhammad al-Mustansir billah, rey hafsí de Túnez; reconocido después de su padre en el año 675 AH, se depuso a sí mismo en el año 678 AH cuando su tío Ibrahim ibn Yahya se levantó contra él, y fue asesinado por ese tío; al-Zirikli fecha su muerte en el año 679 AH."
  fr: "Yahya al-Wathiq billah ibn Muhammad al-Mustansir billah, roi hafside de Tunis; reconnu après son père en 675 AH, se déposa en 678 AH lorsque son oncle Ibrahim ibn Yahya se souleva contre lui, et fut tué par ce dernier; al-Zirikli date sa mort de 679 AH."
