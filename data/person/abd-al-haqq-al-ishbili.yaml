gender: male
summary:
  ar: "الشيخ عبد الحق الإشبيلي صاحب كتابي العاقبة والإحكام؛ وقال إن في الموت والمعاد لشغلا وادكاراً لذي النهى وبلاغا فاغتنم خطتين قبل المنايا صحة الجسم يا أخي والفراغا {cite:nafh-tib-maqqari p. 333}."
  en: "Abd al-Haqq al-Ishbili al-Azdi, author of al-Aqiba and al-Ihkam, of whose grave-minded verse the Nafh preserves a warning on death and the Return {cite:nafh-tib-maqqari p. 333}."
  fr: "Abd al-Haqq al-Ishbili al-Azdi, auteur d'al-Aqiba et d'al-Ihkam, dont le Nafh conserve des vers graves mettant en garde sur la mort et le Retour {cite:nafh-tib-maqqari p. 333}."
  es: "Abd al-Haqq al-Ishbili al-Azdi, autor de al-Aqiba y al-Ihkam, de cuyo verso de profunda seriedad el Nafh conserva una advertencia sobre la muerte y el Retorno {cite:nafh-tib-maqqari p. 333}."
  ur: "عبد الحق الاشبیلی الازدی، العقیبہ اور الاحکام کے مصنف، جن کی سنگینی والی آیت میں نفح موت اور واپسی کے بارے میں تنبیہ کو محفوظ رکھتی ہے۔ 333}۔"
  tr: "El-Akibe ve El-Ahkam kitaplarının yazarı Şeyh Abdül Hak el-İşbili şöyle demiştir: “Ölüm ve diriliş, bilge kişiler için bir meşguliyet ve zikir kaynağıdır ve mesajı iletmenin bir yoludur. Öyleyse ölümden önce iki fırsatı değerlendirin: beden sağlığı ve boş zaman.” {kaynak: Nafh-tib-makqkari, s. 333}"
  id: "Syekh Abdul Haq Al-Ishbili, penulis kitab Al-Aqiba dan Al-Ahkam, berkata: “Kematian dan kebangkitan adalah sumber perhatian dan kenangan bagi orang bijak dan sarana untuk menyampaikan pesan. Maka raihlah dua kesempatan sebelum kematian: kesehatan tubuh, saudaraku, dan waktu luang.” {cite:nafh-tib-maqqari p. 333}"
