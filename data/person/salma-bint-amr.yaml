label: { ar: "سلمى بنت عمرو", en: "Salmā bint ʿAmr", es: "Salmā bint ʿAmr", fr: "Salmā bint ʿAmr", ur: "سلمہ بنت عمرو" }
summary: { ar: "امرأة من بني عدي بن النجار بيثرب؛ تزوجها هاشم بن عبد مناف وأقامت عند أهلها فولدت عبد المطلب وربّته بيثرب حتى جاء به خاله أو عمه إلى مكة.", en: "A woman of Banū ʿAdī ibn al-Najjār of Yathrib; Hāshim’s wife and ʿAbd al-Muṭṭalib’s mother, who raised the boy at Yathrib.", es: "Una mujer de Banū ʿAdī ibn al-Najjār de Yathrib; esposa de Hāshim y madre de ʿAbd al-Muṭṭalib, que crió al niño en Yathrib.", fr: "Une femme de Banū ʿAdī ibn al-Najjār de Yathrib; l'épouse de Hāshim et la mère d'ʿAbd al-Muṭṭalib, qui a élevé le garçon à Yathrib.", ur: "یثرب کے بنو عدی بن النجار کی ایک عورت؛ ہاشم کی بیوی اور عبدالمطلب کی والدہ، جنہوں نے یثرب میں لڑکے کی پرورش کی۔", tr: "Yathrib'deki Banu Adi ibn al-Najjar'dan bir kadın; Haşim ibn Abd Manaf onunla evlendi, ailesiyle yaşadı, Abd al-Muttalib'i doğurdu ve onu Yahrib'de büyüttü, ta ki annesinin kardeşi onu Mekke'ye getirene kadar.", id: "Seorang wanita dari Banu Adi ibn al-Najjar di Yathrib; Hashim ibn Abd Manaf menikahinya, tinggal bersama keluarganya, melahirkan Abd al-Muttalib, dan membesarkannya di Yathrib sampai pamannya dari pihak ibu membawanya ke Mekah." }
