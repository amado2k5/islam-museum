summary:
  ar: "ناشطة باكستانية في تعليم الفتيات ومنتجة أفلام وبرامج تلفزيونية، أصغر حاصلة على جائزة نوبل في التاريخ. بدأت التدوين لبي بي سي أردو باسم مستعار وعمرها إحدى عشرة سنة، ونجت من محاولة اغتيال نفذتها طالبان سنة 2012، ثم شاركت في تأسيس «صندوق ملالا» وألّفت كتاب «أنا ملالا»، ونالت جائزة نوبل للسلام سنة 2014 وعمرها سبع عشرة سنة."
  en: "Pakistani girls'-education activist and film and television producer, the youngest Nobel Prize laureate in history. She began blogging for BBC Urdu under a pseudonym at eleven, survived a Taliban assassination attempt in 2012, then co-founded the Malala Fund, co-authored 'I Am Malala', and received the Nobel Peace Prize in 2014 at seventeen."
  ur: "پاکستانی لڑکیوں کی تعلیم کی کارکن اور فلم و ٹیلی ویژن پروڈیوسر، تاریخ کی سب سے کم عمر نوبل انعام یافتہ۔ انہوں نے گیارہ برس کی عمر میں مستعار نام سے بی بی سی اردو کے لیے بلاگ لکھنا شروع کیا، 2012ء میں طالبان کے قاتلانہ حملے میں بچ گئیں، پھر «ملالہ فنڈ» کی شریک بانی بنیں، کتاب «میں ہوں ملالہ» لکھی، اور 2014ء میں سترہ برس کی عمر میں نوبل امن انعام پایا۔"
