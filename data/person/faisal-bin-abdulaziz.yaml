summary:
  ar: "ثالث ملوك المملكة العربية السعودية (1906–1975)، ابن الملك عبد العزيز من طرفة بنت عبد الله آل الشيخ. كان نائب الملك في الحجاز من 1926 ووزير الخارجية من 1930 وولي العهد من 1953، فألغى الرق سنة 1962 وساهم في تأسيس رابطة العالم الإسلامي والجامعة الإسلامية بالمدينة، وتولّى سلطات الملك سعود سنة 1964 ثم بُويع ملكًا في 2 نوفمبر 1964 بعد خلع أخيه، وقاد حظر النفط سنة 1973، واغتاله ابن أخيه فيصل بن مساعد في الرياض في 25 مارس 1975."
  en: "Third King of Saudi Arabia (1906–1975), a son of King Abdulaziz by Tarfa bint Abdullah Al Sheikh. He was viceroy of Hejaz from 1926, foreign minister from 1930 and crown prince from 1953; he abolished slavery in 1962 and helped found the Muslim World League and the Islamic University of Madinah, took over King Saud's powers in 1964 and was proclaimed king on 2 November 1964 after his brother's deposition, led the 1973 oil embargo, and was assassinated by his nephew Faisal bin Musaid in Riyadh on 25 March 1975."
  ur: "سعودی عرب کے تیسرے بادشاہ (1906ء–1975ء)، شاہ عبد العزیز اور طرفہ بنت عبد اللہ آل الشیخ کے صاحبزادے۔ 1926ء سے حجاز کے نائب السلطان، 1930ء سے وزیر خارجہ اور 1953ء سے ولی عہد رہے؛ 1962ء میں غلامی ختم کی، رابطہ عالم اسلامی اور مدینہ کی اسلامی یونیورسٹی کے قیام میں حصہ لیا، 1964ء میں شاہ سعود کے اختیارات سنبھالے اور ان کی معزولی کے بعد 2 نومبر 1964ء کو بادشاہ بنے، 1973ء کی تیل پابندی کی قیادت کی، اور 25 مارچ 1975ء کو ریاض میں اپنے بھتیجے فیصل بن مساعد کے ہاتھوں قتل ہوئے۔"
