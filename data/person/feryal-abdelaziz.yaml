summary:
  ar: "لاعبة كاراتيه مصرية، وُلدت في القاهرة سنة 1999. فازت بذهبية الكوميتيه لوزن فوق 61 كجم في أولمبياد طوكيو 2020 فكانت أول مصرية تفوز بميدالية ذهبية أولمبية، ثم أضافت ذهبية فرق العالم 2021 وذهبية ألعاب البحر المتوسط 2022."
  en: "Egyptian karateka, born in Cairo in 1999. At Tokyo 2020 she won the women's +61 kg kumite title, becoming the first Egyptian woman to win an Olympic gold medal; she later added a world team title in 2021 and a Mediterranean Games title in 2022."
