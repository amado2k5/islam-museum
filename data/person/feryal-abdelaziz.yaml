summary:
  ar: "لاعبة كاراتيه مصرية، وُلدت في القاهرة سنة 1999. فازت بذهبية الكوميتيه لوزن فوق 61 كجم في أولمبياد طوكيو 2020 فكانت أول مصرية تفوز بميدالية ذهبية أولمبية، ثم أضافت ذهبية فرق العالم 2021 وذهبية ألعاب البحر المتوسط 2022."
  en: "Egyptian karateka, born in Cairo in 1999. At Tokyo 2020 she won the women's +61 kg kumite title, becoming the first Egyptian woman to win an Olympic gold medal; she later added a world team title in 2021 and a Mediterranean Games title in 2022."
  ur: "مصری کراٹے کھلاڑی، 1999 میں قاہرہ میں پیدا ہوئیں۔ ٹوکیو 2020 میں خواتین کے +61 کلوگرام کومیتے کا خطاب جیت کر وہ اولمپک طلائی تمغہ جیتنے والی پہلی مصری خاتون بنیں؛ بعد ازاں 2021 میں عالمی ٹیم خطاب اور 2022 میں بحیرہ روم کھیلوں کا خطاب بھی جیتا۔"
  es: "Karateka egipcia, nacida en El Cairo en 1999. En Tokio 2020 ganó el título de kumite femenino de +61 kg, convirtiéndose en la primera mujer egipcia en ganar una medalla de oro olímpica; posteriormente, en 2021, sumó un título mundial por equipos y un título en los Juegos Mediterráneos de 2022."
  fr: "Karatéka égyptienne, née au Caire en 1999. Aux Jeux olympiques de Tokyo 2020, elle a remporté le titre de kumite féminin des +61 kg, devenant ainsi la première Égyptienne à remporter une médaille d'or olympique; elle a ensuite ajouté un titre mondial par équipes en 2021 et un titre aux Jeux méditerranéens en 2022."
  tr: "1999 yılında Kahire doğumlu bir Mısırlı karateka. Tokyo 2020 Olimpiyatları'nda 61 kg üzeri kategoride kumite altın madalyası kazandı, Olimpiyat altın madalyası kazanan ilk Mısırlı oldu, ardından 2021 Dünya Takımı ve 2022 Akdeniz Oyunları'nda altın madalya ekledi."
  id: "Seorang karateka Mesir, lahir di Kairo pada tahun 1999. Dia memenangkan medali emas kumite di kategori di atas 61 kg pada Olimpiade Tokyo 2020, menjadi orang Mesir pertama yang memenangkan medali emas Olimpiade, lalu menambahkan medali emas di World Team 2021 dan Mediterranean Games 2022."
