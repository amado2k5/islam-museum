summary:
  ar: "بطاقة أولية للمعتصم بالله، ثامن خلفاء بني العباس وباني سامراء، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الخلفاء والكامل لابن الأثير على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for al-Mu'tasim, eighth Abbasid caliph and founder of Samarra, named from an open reference description (Wikidata); his entries in Tarikh al-Khulafa and Ibn al-Athir's al-Kamil are not yet checked on the page, so no dates are given."
  fr: "Projet de carte pour al-Mu'tasim, huitième calife abbasside et fondateur de Samarra, nommé à partir d'une description de référence ouverte (Wikidata) ; ses entrées dans Tarikh al-Khulafa et al-Kamil d'Ibn al-Athir ne sont pas encore vérifiées sur la page, donc aucune date n'est donnée."
  es: "Ficha preliminar de al-Mu'tasim, octavo califa abasí y fundador de Samarra, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); sus entradas en Tarikh al-Khulafa y al-Kamil de Ibn al-Athir aún no se han verificado en la página, por lo que no se proporcionan fechas."
  ur: "المعتصم، آٹھویں عباسی خلیفہ اور سامرا کے بانی کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے؛ تاریخ الخلفاء اور ابن اثیر کے الکامل میں ان کے اندراجات ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Samarra'nın inşaatçısı ve sekizinci Abbasi halifesi el-Mu'tasim Billah için açık bir referans açıklamasında (Wikidata) ön kart yer almaktadır. Tarih el-Xulafa'daki biyografisi ve İbn el-Athir'in 'El-Kamil'i henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan untuk al-Mu'tasim Billah, khalifah Abbasiyah kedelapan dan pembangun Samarra, disebutkan dalam deskripsi referensi terbuka (Wikidata). Biografinya dalam Tarikh al-Khulafa dan 'Al-Kamil oleh Ibn al-Athir' belum ditinjau di halaman tersebut, sehingga tanggal tidak disebutkan di sini."
