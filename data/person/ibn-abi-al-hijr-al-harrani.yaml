id: person/ibn-abi-al-hijr-al-harrani
class: person
label: { ar: "تقي الدين ابن أبي الحجر الحراني" }
names:
  - { value: "حامد بن محمود بن حامد بن محمد بن أبي عمرو الحراني أبو الفضل المعروف بابن أبي الحجر ويلقب تقي الدين", kind: full }
summary:
  ar: "تقي الدين ابن أبي الحجر حامد بن محمود الحراني شيخ حران وخطيبها ومدرسها ومفتيها؛ ولد سنة ثلاث عشرة وخمسمائة بحران ورحل إلى بغداد فسمع من عبد الوهاب الأنماطي الحافظ وغيره وتفقه بها وبرع وناظر ولقي بها الشيخ عبد القادر ولازمه فرآه الشيخ يوماً يمشي على سجادته على ساطه فقال «كأني بك وقد دست على بساط السلطان» فكان كما قال؛ بنى نور الدين محمود المدرسة في حران لأجله ودفعها إليه فدرّس بها وتولى عمارة جامع حران، وأخذ عنه العلم جماعة من أهل حران منهم الخطيب فخر الدين بن تيمية وابن عبدوس؛ توفي لسبع خلون من شوال سنة سبعين وخمسمائة بحران {cite:shadharat-dhahab p. 717}."
  en: "Taqi al-Din Ibn Abi al-Hijr Hamid ibn Mahmud of Harran — its shaykh, khatib, mudarris and mufti; b. 513, he journeyed to Baghdad, heard the hafiz Abd al-Wahhab al-Anmati, excelled in fiqh and debate, and accompanied Shaykh Abd al-Qadir who, seeing him walk on his prayer-carpet, prophesied 'it is as if you have stepped on the sultan's carpet'; Nur al-Din built Harran's madrasa for him and he saw to the jami's rebuilding; among his pupils in learning was Fakhr al-Din ibn Taymiyya; d. 7 Shawwal 570 at Harran {cite:shadharat-dhahab p. 717}."
