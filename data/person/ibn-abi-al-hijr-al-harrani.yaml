id: person/ibn-abi-al-hijr-al-harrani
class: person
label: { ar: "تقي الدين ابن أبي الحجر الحراني" }
names:
  - { value: "حامد بن محمود بن حامد بن محمد بن أبي عمرو الحراني أبو الفضل المعروف بابن أبي الحجر ويلقب تقي الدين", kind: full }
summary:
  ar: "تقي الدين ابن أبي الحجر حامد بن محمود الحراني شيخ حران وخطيبها ومدرسها ومفتيها؛ ولد سنة ثلاث عشرة وخمسمائة بحران ورحل إلى بغداد فسمع من عبد الوهاب الأنماطي الحافظ وغيره وتفقه بها وبرع وناظر ولقي بها الشيخ عبد القادر ولازمه فرآه الشيخ يوماً يمشي على سجادته على ساطه فقال «كأني بك وقد دست على بساط السلطان» فكان كما قال؛ بنى نور الدين محمود المدرسة في حران لأجله ودفعها إليه فدرّس بها وتولى عمارة جامع حران، وأخذ عنه العلم جماعة من أهل حران منهم الخطيب فخر الدين بن تيمية وابن عبدوس؛ توفي لسبع خلون من شوال سنة سبعين وخمسمائة بحران {cite:shadharat-dhahab p. 717}."
  en: "Taqi al-Din Ibn Abi al-Hijr Hamid ibn Mahmud of Harran — its shaykh, khatib, mudarris and mufti; b. 513, he journeyed to Baghdad, heard the hafiz Abd al-Wahhab al-Anmati, excelled in fiqh and debate, and accompanied Shaykh Abd al-Qadir who, seeing him walk on his prayer-carpet, prophesied 'it is as if you have stepped on the sultan's carpet'; Nur al-Din built Harran's madrasa for him and he saw to the jami's rebuilding; among his pupils in learning was Fakhr al-Din ibn Taymiyya; d. 7 Shawwal 570 at Harran {cite:shadharat-dhahab p. 717}."
  es: "Taqi al-Din Ibn Abi al-Hijr Hamid ibn Mahmud de Harran — su shaykh, khatib, mudarris y mufti; n. 513, viajó a Bagdad, escuchó al hafiz Abd al-Wahhab al-Anmati, sobresalió en fiqh y debate, y acompañó al Shaykh Abd al-Qadir quien, al verlo caminar sobre su alfombra de oración, profetizó 'es como si hubieras pisado la alfombra del sultán'; Nur al-Din construyó la madrasa de Harran para él y él se encargó de la reconstrucción del jami; entre sus estudiantes de estudios estaba Fakhr al-Din ibn Taymiyya; m. 7 Shawwal 570 en Harran {cite:shadharat-dhahab p. 717}."
  fr: "Taqi al-Din Ibn Abi al-Hijr Hamid ibn Mahmud de Harran – son cheikh, khatib, mudarris et mufti; né en 513, il voyagea à Bagdad, écouta le hafiz Abd al-Wahhab al-Anmati, excella en fiqh et en débat, et accompagna le cheikh Abd al-Qadir qui, le voyant marcher sur son tapis de prière, prophétisa: « C'est comme si tu avais marché sur le tapis du sultan ». Nur al-Din fit construire la madrasa de Harran pour lui et il supervisa la reconstruction du jami. Parmi ses élèves figurait Fakhr al-Din ibn Taymiyya. Il mourut le 7 Shawwal 570 à Harran (voir: shadharat-dhahab p. 717)."
  ur: "تقی الدین ابن ابی الحجر حامد بن محمود حران - اس کے شیخ، خطیب، مدارس اور مفتی؛ ب 513 میں، اس نے بغداد کا سفر کیا، حافظ عبد الوہاب الانمطی کو سنا، فقہ اور بحث میں کمال رکھتے تھے، اور شیخ عبد القادر کے ساتھ تھے، جنہوں نے انہیں نماز کے قالین پر چلتے ہوئے دیکھ کر پیشین گوئی کی کہ گویا تم نے سلطان کے قالین پر قدم رکھا ہے۔ نورالدین نے اس کے لیے حران کا مدرسہ بنایا اور اس نے جامع کی تعمیر نو کو دیکھا۔ علم میں ان کے شاگردوں میں فخر الدین ابن تیمیہ تھے۔ d 7 شوال 570 بمطابق حران 717}۔"
  tr: "Taqi al-Din İbn Ebi el-Hacar Hamid ibn Mahmud el-Harrani, Harran'ın şeyhi, vaizi, öğretmeni ve müftüsü; 513 Hicri yılında Harran'da doğdu, Bağdat'a gitti, burada ezberci Abdul Vahhab el-Anmati ve diğerlerinden dinledi, orada eğitim aldı, başarılı oldu ve orada eğitim aldı. Şeyh Abdülkadir onunla karşılaştı ve ona eşlik etti. Bir gün, şeyh onu halısının üzerinde yürürken gördü Matının üzerine ve 'Sanki sultanın tahtına basmış gibiyim.' dedi. Dedi ki, Nur al-Din Mahmud Harran'da onun için okul inşa etti ve ona emanet etti, böylece orada ders verdi ve Harran Camii'nin mimarisini devraldı. Harran halkından bir grup, aralarında vaiz Fakhr al-Din ibn Teymiye ve İbn Abdus'un da bulunduğu kişiler ondan öğrendi; Shawwal'dan yedi yıl sonra, 570 Hicri yılında vefat etti {alıntı: Shadharat-Dhahab, s. 717}."
  id: "Taqi al-Din Ibn Abi al-Hajar Hamid ibn Mahmoud al-Harrani, sheikh Harran, pengkhotbah, guru, dan muftinya; lahir pada tahun 513 H Harran, ia pergi ke Baghdad, di mana ia mendengar dari Abdul Wahhab al-Anmati sang penghafal dan lainnya, belajar di sana dan berprestasi, serta belajar di sana. Sheikh Abdul Qadir bertemu dengannya dan menemaninya. Suatu hari, sheikh melihatnya berjalan di atasnya di atas tikar dan berkata, 'Seolah-olah aku telah menginjak takhta sultan.' Seperti yang ia katakan, Nur al-Din Mahmoud membangun sekolah di Harran untuknya dan mempercayakannya kepadanya, sehingga ia mengajar di sana dan mengambil alih arsitektur Masjid Harran. Sekelompok orang Harran belajar darinya, termasuk pengkhotbah Fakhr al-Din ibn Taymiyyah dan Ibn Abdus; ia meninggal tujuh tahun setelah Shawwal pada tahun 570 H {cite:Shadhat-Dhahab, hlm. 717}."
