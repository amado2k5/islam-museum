id: person/abd-allah-al-mamun
class: person
label: { ar: "عبد الله المأمون بن هارون الرشيد" }
summary:
  ar: "خليفة عباسي، بُويع له ببغداد بعد خلع أخيه الأمين في سنة ست وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.428}، وتوفي سنة ثماني عشرة ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.646}، وذكر الطبري المحنة بالقرآن في عهده {cite:tabari-tarikh-abu-al-fadl j.8 p.631}، وعند السيوطي ولد ليلة السبت لأربع عشرة بقيت من ربيع الأول سنة سبعين ومئة وهي ليلة موت عمه الهادي وبيعة أبيه ولم يكن في سائر الزمان ليلة مات فيها خليفة وقام خليفة وولد خليفة إلا هذه الليلة {cite:tarikh-khulafa-minhaj-1434 p. 456}، وعند السيوطي سار في سنة أربع ومئتين إلى بغداد ودخلها في صفر فكلمه العباسيون في العود إلى السواد فأجاب، وفي سنة ثمان عشرة امتحن الناس بالقول بخلق القرآن {cite:tarikh-khulafa-minhaj-1434 p. 487-489}، وعند السيوطي لم يحفظ القرآن أحد من الخلفاء إلا عثمان بن عفان والمأمون، ونقش خاتمه عبد الله بن عبيد الله، وجاءته امرأة تسأل في فريضة ست مئة دينار فحسب وكسرها ثم قال خلف ابنتين فلهن الثلثان ووالدة فلها السدس وزوجة فلها الثمن واثنا عشر أخاً أصابهم ديناران ديناران وأصابها دينار فكان كما قال {cite:tarikh-khulafa-minhaj-1434 p. 496-497}، وعند السيوطي دخل عليه خارجي فقال ما حملك على خلافنا قال آية في كتاب الله ومن لم يحكم بما أنزل الله فأولئك هم الكافرون قال ألك علم بأنها منزلة قال نعم قال وما دليلك قال إجماع الأمة قال فكما رضيت بإجماعهم في التنزيل فارض بإجماعهم في التأويل قال صدقت السلام عليك يا أمير المؤمنين، وكان أول حديث حدث به على منبر وضع له عن هشيم عن أبي الجهم عن الزهري عن أبي سلمة عن أبي هريرة امرؤ القيس صاحب لواء الشعراء إلى النار {cite:tarikh-khulafa-minhaj-1434 p. 502,515}، وعند المسعودي أن المأمون كان في بدء أمره لما غلب عليه الفضل بن سهل يستعمل النظر في أحكام النجوم ويذهب مذاهب ملوك ساسان كأردشير بن بابك ويجتهد في قراءة الكتب القديمة، فلما قدم العراق انصرف عن ذلك وأظهر القول بالتوحيد والوعد والوعيد وجالس المتكلمين وقرب الجدليين كأبي الهذيل العلاف وإبراهيم بن سيار النظام وألزم مجلسه الفقهاء والأدباء وأجرى عليهم الأرزاق فوضع كل فريق كتباً ينصر مذهبه، وكان أكثر الناس عفواً وأشدهم احتمالاً وأجودهم بالمال {cite:muruj-al-dhahab p. 672}، وعند المسعودي قال فيه الرشيد إني لأتعرف في عبد الله حزم المنصور ونسك المهدي وعز نفس الهادي، وتنبأ لهما بعد ما أنشدهما الأصمعي أنهما ستتشتت كلمتهما وتسفك الدماء وتهتك ستور النساء، وولاه الرشيد الحرب وابن أمه السلم وقال نتخوف ابنك على عبد الله ولا نتخوف عبد الله عليه {cite:muruj-al-dhahab p. 337-340}"
