summary:
  ar: "سابع الخلفاء العباسيين، ولد سنة 170هـ/786م ابناً لهارون الرشيد، وحكم خراسان وليّاً للعهد قبل أن ينتصر على أخيه الأمين في حرب أهلية انتهت بمقتل الأمين سنة 198هـ/813م. اختار عليّ الرضا وليّاً للعهد ثم عاد إلى بغداد سنة 204هـ/819م، وتصف دائرة المعارف الإسلامية عهده بتشجيع الترجمة وتأسيس بيت الحكمة وقربه من المعتزلة وإقامة المحنة سنة 218هـ/833م. توفي قرب طرسوس في رجب 218هـ/833م وخلفه أخوه المعتصم."
  en: "Seventh Abbasid caliph, born in 170 AH, 786 CE, a son of Harun al-Rashid. He governed Khurasan as heir, then won a civil war against his brother al-Amin, who was killed in 198 AH, 813 CE. He designated Ali al-Rida as his successor, returned to Baghdad in 204 AH, 819 CE, and, according to the Encyclopaedia of Islam, encouraged translation, founded the Bayt al-Hikma, favoured the Mu'tazila and instituted the mihna in 218 AH, 833 CE. He died near Tarsus in Rajab 218 AH, August 833 CE, and was succeeded by his brother al-Mu'tasim."
  ur: "ساتویں عباسی خلیفہ، جو 170ھ/786ء میں ہارون الرشید کے بیٹے کی حیثیت سے پیدا ہوئے۔ انھوں نے ولی عہد کی حیثیت سے خراسان سنبھالا، پھر بھائی امین کے خلاف خانہ جنگی جیتی جس میں امین 198ھ/813ء میں قتل ہوئے۔ انھوں نے علی الرضا کو جانشین نامزد کیا اور 204ھ/819ء میں بغداد لوٹے، اور اسلامی انسائیکلوپیڈیا کے مطابق ترجمے کی حوصلہ افزائی کی، بیت الحکمت قائم کی، معتزلہ سے قربت رکھی اور 218ھ/833ء میں محنہ قائم کی۔ ان کی وفات رجب 218ھ/اگست 833ء میں طرسوس کے قریب ہوئی اور بھائی معتصم جانشین بنے۔"
