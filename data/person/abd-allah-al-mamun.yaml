  did_you_know:
    ar: "بويع للمأمون ببغداد بعد خلع أخيه الأمين سنة ١٩٦هـ وتوفي سنة ٢١٨هـ؛ وعند الطبري من أخباره ما خلد ذكره في الترجمة والعلوم."
    en: "Al-Ma'mun was pledged at Baghdad after his brother al-Amin was deposed in 196 AH and died in 218; al-Tabari preserves the reports that fixed his name in learning and letters."
    ur: "مامون کو ۱۹۶ھ میں اپنے بھائی امین کے معزول ہونے کے بعد بغداد میں بیعت ملی اور 218ھ میں انتقال ہوا؛ طبری نے وہ روایات محفوظ کیں جنھوں نے علم و ادب میں اس کا نام امر کیا۔"
