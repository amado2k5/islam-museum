kids:
  ar: "المأمون ابن هارون، فتح بغداد في أعظم حرب بين الإخوة، ووسّع بيت الحكمة وبعث البعوث في طلب العلم."
  en: "Al-Ma'mun, Harun's son, won Baghdad in the greatest war between brothers, then enlarged the House of Wisdom and sent missions to collect ancient learning."
  ur: "المامون ہارون کا بیٹا تھا جو بھائیوں کی سب سے بڑی جنگ میں بغداد پر فاتح ہوا — پھر بیت الحکمت کو وسعت دی اور پرانا علم جمع کرنے کے لیے وفود بھیجے۔"
