summary:
  ar: "خليفة عباسي، بُويع له ببغداد بعد خلع أخيه الأمين في سنة ست وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.428}، وتوفي سنة ثماني عشرة ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.646}، وذكر الطبري المحنة بالقرآن في عهده {cite:tabari-tarikh-abu-al-fadl j.8 p.631}، وعند السيوطي ولد ليلة السبت لأربع عشرة بقيت من ربيع الأول سنة سبعين ومئة وهي ليلة موت عمه الهادي وبيعة أبيه ولم يكن في سائر الزمان ليلة مات فيها خليفة وقام خليفة وولد خليفة إلا هذه الليلة {cite:tarikh-khulafa-minhaj-1434 p. 456}، وعند السيوطي سار في سنة أربع ومئتين إلى بغداد ودخلها في صفر فكلمه العباسيون في العود إلى السواد فأجاب، وفي سنة ثمان عشرة امتحن الناس بالقول بخلق القرآن {cite:tarikh-khulafa-minhaj-1434 p. 487-489}، وعند السيوطي لم يحفظ القرآن أحد من الخلفاء إلا عثمان بن عفان والمأمون، ونقش خاتمه عبد الله بن عبيد الله، وجاءته امرأة تسأل في فريضة ست مئة دينار فحسب وكسرها ثم قال خلف ابنتين فلهن الثلثان ووالدة فلها السدس وزوجة فلها الثمن واثنا عشر أخاً أصابهم ديناران ديناران وأصابها دينار فكان كما قال {cite:tarikh-khulafa-minhaj-1434 p. 496-497}، وعند السيوطي دخل عليه خارجي فقال ما حملك على خلافنا قال آية في كتاب الله ومن لم يحكم بما أنزل الله فأولئك هم الكافرون قال ألك علم بأنها منزلة قال نعم قال وما دليلك قال إجماع الأمة قال فكما رضيت بإجماعهم في التنزيل فارض بإجماعهم في التأويل قال صدقت السلام عليك يا أمير المؤمنين، وكان أول حديث حدث به على منبر وضع له عن هشيم عن أبي الجهم عن الزهري عن أبي سلمة عن أبي هريرة امرؤ القيس صاحب لواء الشعراء إلى النار {cite:tarikh-khulafa-minhaj-1434 p. 502,515}، وعند المسعودي أن المأمون كان في بدء أمره لما غلب عليه الفضل بن سهل يستعمل النظر في أحكام النجوم ويذهب مذاهب ملوك ساسان كأردشير بن بابك ويجتهد في قراءة الكتب القديمة، فلما قدم العراق انصرف عن ذلك وأظهر القول بالتوحيد والوعد والوعيد وجالس المتكلمين وقرب الجدليين كأبي الهذيل العلاف وإبراهيم بن سيار النظام وألزم مجلسه الفقهاء والأدباء وأجرى عليهم الأرزاق فوضع كل فريق كتباً ينصر مذهبه، وكان أكثر الناس عفواً وأشدهم احتمالاً وأجودهم بالمال {cite:muruj-al-dhahab p. 672}، وعند المسعودي قال فيه الرشيد إني لأتعرف في عبد الله حزم المنصور ونسك المهدي وعز نفس الهادي، وتنبأ لهما بعد ما أنشدهما الأصمعي أنهما ستتشتت كلمتهما وتسفك الدماء وتهتك ستور النساء، وولاه الرشيد الحرب وابن أمه السلم وقال نتخوف ابنك على عبد الله ولا نتخوف عبد الله عليه {cite:muruj-al-dhahab p. 337-340}، وأمه باذغيسية اسمها مراجل، وغلب عليه الفضل بن سهل حتى ضايقه في جارية أراد شراءها فقتله وادعى قوم أنه دس عليه من قتله، وكان يظهر التشيع فهجا عمه إبراهيم بن المهدي ابن شكلة إذا المرجي سرك أن تراه فرد عليه إذا الشيعي جمجم في مقال، وكان يقول يغتفر كل شيء إلا القدح في الملك وإفشاء السر والتعرض للحرم، وسادة الناس في الدنيا الأسخياء وفي الآخرة الأنبياء، وخطب في أملاك أهل بيته بالآية، وتوفي بالبديدون على عين القشيرة سنة ثماني عشر ومائتين وهو ابن تسع وأربعين سنة ودفن بطرسوس {cite:muruj-al-dhahab p. 399-402}، وأعجب من صاحب القصة الذي ضرط في خطبته فقال ما رأيت أربط جأشاً منه فأمر له بخمسين ألف درهم، وقال لأبي العتاهية شأن النفس الملل وحب الاستطراف {cite:muruj-al-dhahab p. 410-411}، وروى الصولي عن يعقوب بن جعفر عند المسعودي سبب لبسه الخضرة ثم السواد أن الهاشميين اجتمعوا إلى زينب بنت سليمان بن علي وكانت أقعد ولد العباس نسباً فكلّمته فقال لها يا عمة رسول الله توفي فولي أبو بكر ثم عمر فلم يتعد فعل من تقدمه ثم عثمان فأقبل على بني أمية ثم آل الأمر إلى علي بن أبي طالب فولى عبد الله بن العباس البصرة وعبيد الله بن العباس اليمن وفثم البحرين وما ترك منهم أحداً إلا ولاه فكانت هذه في أعناقنا حتى كافينا ولده، ثم رجع إلى لبس السواد، وله شعر يشاكل المعنى ألام على شكر الوصي أبا الحسن {cite:muruj-al-dhahab p. 686-687}"
  en: "Abbasid caliph, given the oath of allegiance at Baghdad after the deposition of his brother al-Amin in 196 AH {cite:tabari-tarikh-abu-al-fadl j.8 p.428}; he died in 218 AH {cite:tabari-tarikh-abu-al-fadl j.8 p.646}. Al-Tabari also records the mihna over the Qur'an in his reign {cite:tabari-tarikh-abu-al-fadl j.8 p.631}. According to al-Suyuti, he was born on the night of Saturday, fourteen days before the end of Rabi' I 170, the night his paternal uncle al-Hadi died and his father's accession was made; there was no other night in all time in which one caliph died, another rose, and a child was born, except this one {cite:tarikh-khulafa-minhaj-1434 p. 456}. Also according to al-Suyuti, in 204 he set out and entered Baghdad in Safar, where the Abbasids asked him to return to black, the Abbasid colour, and he agreed; in 218 people were tested on the doctrine that the Qur'an was created {cite:tarikh-khulafa-minhaj-1434 p. 487-489}. He alone, after Uthman ibn Affan, is said to have memorised the Qur'an among the caliphs, and his seal bore the inscription 'Abd Allah ibn Ubayd Allah'. A woman asked him about the division of an inheritance of 600 dinars; he reckoned it out: two daughters take two-thirds, a mother a sixth, a wife an eighth, and twelve brothers received two dinars each while she received one dinar, and it came out as he had said {cite:tarikh-khulafa-minhaj-1434 p. 496-497}. Also according to al-Suyuti, a Kharijite came to him and asked what had moved him to oppose them; he answered with a verse of God's Book, and when asked whether he knew it was revealed he said yes, and when asked for proof he gave the consensus of the community. The Kharijite replied: 'As you accepted their consensus on the revelation, accept their consensus on the interpretation.' The Kharijite said, 'You have spoken truly,' and addressed him as Commander of the Faithful. The first hadith he transmitted from a pulpit set up for him was, through Hushaym, Abu al-Jahm, al-Zuhri, Abu Salama and Abu Hurayra: 'Imru' al-Qays, banner-bearer of the poets, to the Fire' {cite:tarikh-khulafa-minhaj-1434 p. 502,515}. According to al-Mas'udi, at the start of his career, while al-Fadl ibn Sahl dominated him, al-Ma'mun engaged in judging by the stars, followed the ways of the Sasanian kings such as Ardashir ibn Babak, and laboured at reading ancient books. When he came to Iraq he gave this up, professed divine unity and the promise and the threat, sat with the theologians, and favoured the disputatious ones such as Abu al-Hudhayl al-Allaf and Ibrahim ibn Sayyar al-Nazzam. He kept jurists and men of letters attending his council and paid them stipends, so that each party wrote books defending its school. He was the most forgiving of people, the most patient, and the most generous with money {cite:muruj-al-dhahab p. 672}. Also according to al-Mas'udi, al-Rashid said of him: 'I recognise in Abd Allah the firmness of al-Mansur, the piety of al-Mahdi, and the dignity of al-Hadi.' After al-Asma'i had recited to them, a prophecy was made concerning the two of them, that their word would be scattered, blood would be shed and the veils of women torn. Al-Rashid gave him war and the son of his own mother peace, and said: 'We fear your son for Abd Allah, and we do not fear Abd Allah for him' {cite:muruj-al-dhahab p. 337-340}. His mother was from Badhghis, named Marajil. Al-Fadl ibn Sahl dominated him and pressed him over a slave-girl he wished to buy, and he killed him, though some claimed that someone had been secretly sent against him to kill him. He showed Shi'i leanings and lampooned his paternal uncle Ibrahim ibn al-Mahdi, nicknamed Ibn Shakla, in verse; Ibrahim answered him in verse. He used to say that everything could be forgiven except disparaging the kingship, disclosing secrets and violating the sanctity of women, and that the masters of people in this world are the generous and in the next the prophets. He addressed the estates of his family, citing a verse of the Qur'an. He died at al-Budandun, near Ayn al-Qushayra, in 218 AH, aged 49, and was buried at Tarsus {cite:muruj-al-dhahab p. 399-402}. More remarkable still was the man who broke wind during his address: al-Ma'mun said of him, 'I have never seen a man steadier of heart,' and gave him fifty thousand dirhams. He said to Abu al-Atahiya: 'The nature of the soul is boredom and the love of novelty' {cite:muruj-al-dhahab p. 410-411}. Al-Suli related from Ya'qub ibn Ja'far, as in al-Mas'udi, the reason for his wearing green and then black: the Hashimites gathered before Zaynab bint Sulayman ibn Ali, the most senior of the Abbasid line in descent, and she spoke to him. He answered her: 'O aunt of the Messenger of God, when he died Abu Bakr succeeded, then Umar, who did not go beyond the practice of those before him; then Uthman, who turned to the Umayyads; then the matter came to Ali ibn Abi Talib, who appointed Abd Allah ibn al-Abbas to Basra, Ubayd Allah ibn al-Abbas to Yemen, and Qutham to Bahrain, and he left none of them without an office. So this debt stayed upon us until his offspring sufficed us.' Then he returned to wearing black. He also had a poem fitting the theme, including the line: 'Am I to be blamed for giving thanks to the legatee, Abu al-Hasan?' {cite:muruj-al-dhahab p. 686-687}."
