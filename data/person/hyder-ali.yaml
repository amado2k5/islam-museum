summary:
  ar: "حيدر علي (حوالي 1720 – 7 ديسمبر 1782)، قائد عسكري مسلم من جنوب الهند، وُلد في بوديكوت وصعد في جيش ميسور حتى صار حاكمها الفعلي سنة 1761. وسّع سلطنة ميسور وحارب الإنجليز في حربي ميسور الأولى والثانية، ومات في شيتور أثناء حملته، وخلفه ابنه تيبو سلطان."
  en: "Hyder Ali (c. 1720 – 7 December 1782) was a Muslim military commander of southern India, born at Budikote, who rose through the Mysore army to become the kingdom's de facto ruler in 1761. He expanded the Mysore sultanate and fought the British in the First and Second Anglo-Mysore Wars; he died at Chittoor while on campaign and was succeeded by his son Tipu Sultan."
  ur: "حیدر علی (تقریباً 1720ء – 7 دسمبر 1782ء) جنوبی ہند کے مسلم سپہ سالار تھے، جو بودیکوٹ میں پیدا ہوئے اور میسور کی فوج میں ترقی کرتے ہوئے 1761ء میں ریاست کے عملاً حکمران بن گئے۔ آپ نے سلطنتِ میسور کو وسعت دی اور انگریزوں سے پہلی اور دوسری میسور جنگیں لڑیں؛ آپ کا انتقال چتور میں دورانِ مہم ہوا اور آپ کے جانشین آپ کے فرزند ٹیپو سلطان ہوئے۔"

