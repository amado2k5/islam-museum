label: { ar: "أبو علي الجبائي", en: "Abu Ali Al Jubbai" }
summary:
  ar: "أبو علي الجبائي محمد بن عبد الوهاب بن سلام من معتزلة البصرة وهو الذي ذلل الكلام وسهله ويسر ما صعب منه وإليه انتهت رئاسة البصريين في زمانه لا يدافع في ذلك، وأخذ عن أبي يعقوب الشحام وورد البصرة وتكلم مع من بها من المتكلمين وصار إلى بغداد فحضر مجالس أبي بكر عبد الرحمن بن كيسان الضرير وتكلم فتبين فضله وعلمه وعاد إلى العسكر، مولده سنة ٢٣٥ وتوفي سنة ٣٠٣ وأوصى ابنه أبا هاشم أن يدفنه في العسكر فأبى أبو هاشم وأحمله إلى جبا فدفنه في مقبرة فيها والدة أبي علي ووالدة أبي هاشم ناحية بستان أبي علي {cite:fihrist-ibn-al-nadim p. 530}."
  en: "Abu Ali al-Jubba'i — head of the Basran Mu'tazila, b. 235 d. 303, buried at Jubba {cite:fihrist-ibn-al-nadim}"
