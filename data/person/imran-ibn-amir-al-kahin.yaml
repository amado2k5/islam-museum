summary:
  ar: "عمران بن عامر أخو عمرو بن عامر مزيقياء الكاهن، هو الذي وجه ولد الأزد حين خرجوا من مأرب فقال من كان منكم ذا حاجة ووطر وسياسة ونظر فليلحق ببطن مر فسكنتها خزاعة، ومن كان يريد الراسيات في الوحل المطعمات في المحل فليلحق بيثرب ذات النخل فسكنها الأوس والخزرج، ومن كان يريد الخمر والخمير والديباج والحرير والأمر والتدبير فليلحق ببصرى وحفير فسكنها غسان، ومن كان يريد الثياب الرقاق والخيول العتاق والكنوز والأرزاق فليلحق بالعراق، وأقام مع بني نصر من الأزد بين السراة ومكة {cite:muruj-al-dhahab p. 497-498}."
  en: "Muzayqiya's brother the kahin, who routed the Azd's sons after Marib — Khuza'a to Batn Marr, Aws and Khazraj to palm-rich Yathrib, Ghassan to Busra, the treasure-seekers to Iraq — himself settling among Nasr's folk between Sarat and Mecca {cite:muruj-al-dhahab p. 497-498}."
  es: "El hermano de Muzayqiya, el kahin, quien derrotó a los hijos de Azd después de Marib —Khuza'a a Batn Marr, Aws y Khazraj a Yathrib, rica en palmeras, Ghassan a Busra, los buscadores de tesoros a Irak— se estableció él mismo entre la gente de Nasr entre Sarat y La Meca {cite:muruj-al-dhahab p. 497-498}."
  fr: "Le frère de Muzayqiya, le kahin, qui a mis en déroute les fils d'Azd après Marib — Khuza'a à Batn Marr, Aws et Khazraj à Yathrib riche en palmiers, Ghassan à Busra, les chercheurs de trésors en Irak — s'installant lui-même parmi le peuple de Nasr entre Sarat et La Mecque {cite:muruj-al-dhahab p. 497-498}."
  ur: "مزاقیہ کا بھائی کاہین، جس نے مارب کے بعد ازد کے بیٹوں کو - خزاعہ کو بطن مرر، اوس اور خزرج کو کھجور سے مالا مال یثرب کی طرف، غسان سے بصرہ، عراق کے خزانے کے متلاشیوں کو - خود نصر کی قوم کے درمیان سرت اور مکہ مکرمہ کے درمیان آباد کیا تھا۔ 497-498}۔"
  tr: "Amr bin 'Amir Muziqiya'nın kardeşi İmran ibn 'Amir, el-Ezd oğullarını Marib'den ayrıldıklarında yönlendiren kişiydi. Dedi ki: Aranızda kimse ihtiyacı, becerisi, bilgeliği veya vizyonu varsa, Huza'ah tarafından yerleşilen Mar'ın karnına katılsın. Kim çamura ve dükkânda yiyecek almak istiyorsa, eh ve hazrajın yaşadığı palmiye ağaçlarının yerleştiği Yatrib'e katılsın; kim şarap, hamir, dibaj, ipek, düzen ve yönetim istiyorsa, Bosra ve Hafir'e, yani Gassan'ın yaşadığı yere katılsın; kim isterse güzel giysiler, eski atlar, hazineler ve geçim kaynakları Irak'a katsın. Sarat ile Mekke arasında el-Ezd'den Banu Nasr ile kaldı {cite:muruj-al-dhahab, s. 497-498}."
  id: "Imran ibn 'Amir, saudara Amr ibn 'Amir Muziqiya sang pendeta, adalah orang yang membimbing anak-anak al-Azd ketika mereka meninggalkan Marib. Ia berkata: Siapa pun di antara kalian yang membutuhkan kebutuhan, keterampilan, kebijaksanaan, atau visi, biarlah ia bergabung dengan perut Mar yang telah diselesaikan oleh Khuza'ah. Siapa pun yang ingin berlabuh di lumpur dan makanan di toko, biarlah bergabung dengan Yathrib, tempat pohon palem menetap, tempat Aws dan Khazraj tinggal; siapa pun yang menginginkan anggur, khamir, dibaj, sutra, ketertiban, dan pengelolaan, biarlah bergabung dengan Bosra dan Hafir, tempat Ghassan tinggal; dan siapa pun yang menginginkan pakaian mewah, kuda tua, harta karun, dan penghidupan, biarlah bergabung dengan Irak. Ia tinggal bersama Banu Nasr dari al-Azd antara Sarat dan Mekah {cite:muruj-al-dhahab, hlm. 497-498}."
