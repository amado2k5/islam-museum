label: { ar: "عمران بن عامر الكاهن", en: "Imran ibn Amir the kahin" }
summary:
  ar: "عمران بن عامر أخو عمرو بن عامر مزيقياء الكاهن، هو الذي وجه ولد الأزد حين خرجوا من مأرب فقال من كان منكم ذا حاجة ووطر وسياسة ونظر فليلحق ببطن مر فسكنتها خزاعة، ومن كان يريد الراسيات في الوحل المطعمات في المحل فليلحق بيثرب ذات النخل فسكنها الأوس والخزرج، ومن كان يريد الخمر والخمير والديباج والحرير والأمر والتدبير فليلحق ببصرى وحفير فسكنها غسان، ومن كان يريد الثياب الرقاق والخيول العتاق والكنوز والأرزاق فليلحق بالعراق، وأقام مع بني نصر من الأزد بين السراة ومكة {cite:muruj-al-dhahab p. 497-498}."
  en: "Muzayqiya's brother the kahin, who routed the Azd's sons after Marib — Khuza'a to Batn Marr, Aws and Khazraj to palm-rich Yathrib, Ghassan to Busra, the treasure-seekers to Iraq — himself settling among Nasr's folk between Sarat and Mecca {cite:muruj-al-dhahab p. 497-498}."
