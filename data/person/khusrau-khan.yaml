summary:
  ar: "بطاقة أولية لناصر الدين خسرو خان، قائد الدكن الذي قتل قطب الدين مبارك شاه الخلجي وجلس على عرش دلهي قصيراً سنة ١٣٢٠م قبل أن يسقطه غياث الدين تغلق؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Nasir al-Din Khusrau Khan, the Deccani commander who killed Qutb al-Din Mubarak Shah and briefly held the throne of Delhi in 1320 before Ghiyath al-Din Tughluq overthrew him; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Nasir al-Din Khusrau Khan, el comandante de Deccan que mató a Qutb al-Din Mubarak Shah y ocupó brevemente el trono de Delhi en 1320 antes de que Ghiyath al-Din Tughluq lo derrocara; la entrada del manual dinástico aún no se ha revisado en la página."
  fr: "Fiche de projet pour Nasir al-Din Khusrau Khan, le commandant du Deccan qui tua Qutb al-Din Mubarak Shah et occupa brièvement le trône de Delhi en 1320 avant que Ghiyath al-Din Tughluq ne le renverse; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "دکنی کمانڈر ناصر الدین خسرو خان کے لیے ڈرافٹ کارڈ جس نے قطب الدین مبارک شاہ کو قتل کیا اور غیاث الدین تغلق کے معزول ہونے سے پہلے 1320 میں دہلی کا تخت مختصر طور پر سنبھالا تھا۔ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1320 yılında Kutsubdin Mübarek Şah el-Halci'yi öldüren ve kısa süreliğine Delhi tahtına çıkan Deccan komutanı Nasiruddin Khusraw Han'ın ön kartı kapatılmıştır; İslam Devletleri Sözlükleri'nde bahsedilmekte ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Nasiruddin Khusraw Khan, komandan Deccan yang membunuh Qutb al-Din Mubarak Shah al-Khalji dan sempat naik takhta Delhi pada tahun 1320 M sebelum digulingkan oleh Ghiyath al-Din, tertutup; kartu ini disebutkan dalam Kamus Negara-negara Islam dan terjemahannya belum ditinjau di halaman tersebut."
