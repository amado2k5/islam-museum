summary:
  ar: "مسند الدنيا؛ روى الحديث فوق ستين سنة وتفرد بالرواية العالية حتى ألحق الأسباط بالأجداد في علو الإسناد، ورحل إليه الطلبة من البلاد، وتفقه على الشيخ موفق الدين وقرأ عليه «المقنع» وأذن له في إقرائه؛ قال الذهبي سائلاً المزي عنه: أحد المشايخ الأكابر من بيت العلم والحديث، ولا نعلم أحداً حصل له من الحظوة في الرواية في هذه الأزمان مثل ما حصل له؛ وقال ابن تيمية: ينشرح صدري إذا أدخلت ابن البخاري بيني وبين النبي في حديث، وقد دخل بينه وبينه في أحاديث لا تحصى منها الحديث المسلسل بالحنابلة المسمى «سلسلة الذهب» {cite:shadharat-dhahab p. 725-726}."
  en: "Musnid al-dunya — transmitted hadith over sixty years, joining grandsons to grandfathers in isnad-loftiness; Ibn Taymiyya: 'my breast opens when I put Ibn al-Bukhari between me and the Prophet in a hadith', among them the Hanbali musalsal called the Golden Chain {cite:shadharat-dhahab p. 725-726}."
