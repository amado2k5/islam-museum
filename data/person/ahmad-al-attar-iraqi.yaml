roles: [poet, scholar, jurist]
gender: male
summary:
  ar: "أحمد بن محمد بن علي الحسني البغدادي العطار، فقيه إمامي ينقل الزركلي أنه من أهل بغداد انتقل إلى النجف أو أنه نجفي ولادة ووفاة، من كتبه «التحقيق» في 12 مجلدا و«رياض الجنان في أعمال شهر رمضان» وديوان شعر في مديح الأئمة، وتوفي سنة 1215 هـ."
  en: "Ahmad ibn Muhammad ibn Ali al-Hasani al-Baghdadi al-Attar, an Imami jurist whom al-Zirikli describes as of Baghdad and moved to al-Najaf, or else Najafi by birth and death; his books include al-Tahqiq in 12 volumes, Riyad al-Jinan fi A'mal Shahr Ramadan and a diwan in praise of the Imams; died 1215 AH (1800)."
  fr: "Ahmad ibn Muhammad ibn Ali al-Hasani al-Baghdadi al-Attar, juriste imamite qu'al-Zirikli dit de Bagdad puis installé à Najaf, ou né et mort à Najaf ; ses livres comprennent al-Tahqiq en douze volumes, Riyad al-Jinan fi A'mal Shahr Ramadan et un divan à la louange des imams ; mort en 1215 H (1800 ap. J.-C.)."
  es: "Ahmad ibn Muhammad ibn Ali al-Hasani al-Baghdadi al-Attar, un jurista imamí a quien al-Zirikli describe como originario de Bagdad y trasladado a al-Najaf, o bien najafí de nacimiento y muerte; entre sus libros se incluyen al-Tahqiq en 12 volúmenes, Riyad al-Jinan fi A'mal Shahr Ramadan y un diwan en alabanza de los imanes; murió en 1215 AH (1800)."
  ur: "احمد بن محمد بن علی الحسنی البغدادی العطار، ایک امامی فقیہ جسے الزریکلی نے بغداد سے تعبیر کیا اور نجف منتقل ہو گئے، ورنہ پیدائش اور موت کے لحاظ سے نجفی؛ ان کی کتابوں میں التحقیق 12 جلدوں میں، ریاض الجنان فی عامل شہر رمضان اور ائمہ کی تعریف میں دیوان شامل ہیں۔ وفات 1215ھ (1800)"
