  ar: "القاسم بن إبراهيم بن إسماعيل الحسني العلوي الرسي، أبو محمد، من أئمة الزيدية، فقيه وشاعر، كان يسكن جبال قدس من أطراف المدينة وتوفي في الرس، له ثلاث وعشرون رسالة منها «الرد على ابن المقفع»، 169 إلى 246 هـ."
  en: "Al-Qasim ibn Ibrahim al-Rassi, Abu Muhammad, one of the Zaydi imams, a jurist and poet who lived in the mountains of Qudus near Medina and died at al-Rass; he left twenty-three treatises, among them a reply to Ibn al-Muqaffa', 169 to 246 AH."
