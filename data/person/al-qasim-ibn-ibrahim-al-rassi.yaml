summary:
  ar: "القاسم بن إبراهيم بن إسماعيل الحسني العلوي الرسي، أبو محمد، من أئمة الزيدية، فقيه وشاعر، كان يسكن جبال قدس من أطراف المدينة وتوفي في الرس، له ثلاث وعشرون رسالة منها «الرد على ابن المقفع»، 169 إلى 246 هـ."
  en: "Al-Qasim ibn Ibrahim al-Rassi, Abu Muhammad, one of the Zaydi imams, a jurist and poet who lived in the mountains of Qudus near Medina and died at al-Rass; he left twenty-three treatises, among them a reply to Ibn al-Muqaffa', 169 to 246 AH."
  fr: "Al-Qasim ibn Ibrahim al-Rassi, Abu Muhammad, l'un des imams Zaydi, un juriste et poète qui a vécu dans les montagnes de Qudus près de Médine et est mort à al-Rass ; il a laissé vingt-trois traités, parmi eux une réponse à Ibn al-Muqaffa ', 169 à 246 de l’hégire."
  es: "Al-Qasim ibn Ibrahim al-Rassi, Abu Muhammad, uno de los imanes zaidíes, jurista y poeta que vivió en las montañas de Qudus, cerca de Medina, y murió en al-Rass; dejó veintitrés tratados, entre ellos una respuesta a Ibn al-Muqaffa', 169 a 246 AH."
