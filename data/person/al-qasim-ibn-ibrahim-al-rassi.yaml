  ar: "القاسم بن إبراهيم الرسي"
  en: "al-Qasim ibn Ibrahim al-Rassi"
  fr: "al-Qasim ibn Ibrahim al-Rassi"
  es: "al-Qasim ibn Ibrahim al-Rassi"
  ur: "القاسم بن ابراہیم الراسی"
roles: [imam]
gender: male
summary:
  ar: "القاسم بن إبراهيم بن إسماعيل الحسني العلوي الرسي، أبو محمد، من أئمة الزيدية، فقيه وشاعر، كان يسكن جبال قدس من أطراف المدينة وتوفي في الرس، له ثلاث وعشرون رسالة منها «الرد على ابن المقفع»، 169 إلى 246 هـ."
  en: "Al-Qasim ibn Ibrahim al-Rassi, Abu Muhammad, one of the Zaydi imams, a jurist and poet who lived in the mountains of Qudus near Medina and died at al-Rass; he left twenty-three treatises, among them a reply to Ibn al-Muqaffa', 169 to 246 AH."
  fr: "Al-Qasim ibn Ibrahim al-Rassi, Abu Muhammad, l'un des imams Zaydi, un juriste et poète qui a vécu dans les montagnes de Qudus près de Médine et est mort à al-Rass ; il a laissé vingt-trois traités, parmi eux une réponse à Ibn al-Muqaffa ', 169 à 246 de l’hégire."
  es: "Al-Qasim ibn Ibrahim al-Rassi, Abu Muhammad, uno de los imanes zaidíes, jurista y poeta que vivió en las montañas de Qudus, cerca de Medina, y murió en al-Rass; dejó veintitrés tratados, entre ellos una respuesta a Ibn al-Muqaffa', 169 a 246 AH."
  ur: "القاسم بن ابراہیم الراسی، ابو محمد، زیدی اماموں میں سے ایک، فقیہ اور شاعر جو مدینہ کے قریب قدس کے پہاڑوں میں رہتے تھے اور الراس میں وفات پاگئے۔ آپ نے تئیس تصانیف چھوڑی ہیں جن میں سے ابن المقفا کا جواب 169 تا 246 ہجری ہے۔"
  tr: "El-Kasım ibn İbrahim ibn İsmail el-Hasani el-Alavi el-Rassi, Zeydilerin önde gelen alimlerinden biri olan Ebu Muhammed, Medine'nin kenarındaki Kudüs dağlarında yaşamış ve el-Rass'ta ölen bir hukukçu ve şairdi. Yirmi üç mektup yazdı; bunlar arasında 'İbn el-Muqaffa'nın Reddi', 169-246 Hicri arasında yer aldı."
  id: "Al-Qasim ibn Ibrahim ibn Ismail al-Hasani al-Alawi al-Rassi, Abu Muhammad, salah satu ulama terkemuka Zaydi, adalah seorang ahli hukum dan penyair yang tinggal di pegunungan Yerusalem di pinggiran Madinah dan meninggal di al-Rass. Ia menulis dua puluh tiga surat, termasuk 'Pembafikan Ibn al-Muqaffa', 169 hingga 246 H."
