label: { ar: "رتبيل", en: "Rutbil (the Zunbil)" }
summary:
  ar: "رتبيل ملك الزابليين؛ غلب على زابلستان والرخج حتى انتهى إلى بست بعد أن أخرج كابل شاه المسلمين من كابل فقاتله الربيع بن زياد ببست فهزمه واتبعه إلى الرخج ثم بعث إلى عبيد الله بن أبي بكرة بزران يسأله الصلح عن بلاده وبلاد كابل على ألف ألف ومائتي ألف فوهب له مائتي ألف فتم الصلح على ألف ألف درهم وأمضاه زياد. ذكر الكتاب أن عبد الله بن أمية صالحه على ثلاثمائة ألف درهم فعزله عبد الملك، ثم صالحه عبيد الله بن أبي بكرة على أن يؤدي الخراج حيناً ويمنعه حيناً آخر، وتقدم الحجاج بجيش أربعين ألفاً سنة 80هـ. {cite:salabi-umayyad-state-2020 p.87-88}"
  en: "Rutbil, king of the Zabils; after the Kabul Shah expelled the Muslims he took Zabulistan and Rukhkhaj to Bust, where al-Rabi' ibn Ziyad routed him and pursued to Rukhkhaj; later he sued Ubaydallah ibn Abi Bakra at Barzan for peace over his land and Kabul's — settled at a million dirhams, ratified by Ziyad."
