id: person/rutbil
class: person
label: { ar: "رتبيل", en: "Rutbil (the Zunbil)", es: "Rutbil (the Zunbil)", fr: "Rutbil (the Zunbil)" }
summary:
  ar: "رتبيل ملك الزابليين؛ غلب على زابلستان والرخج حتى انتهى إلى بست بعد أن أخرج كابل شاه المسلمين من كابل فقاتله الربيع بن زياد ببست فهزمه واتبعه إلى الرخج ثم بعث إلى عبيد الله بن أبي بكرة بزران يسأله الصلح عن بلاده وبلاد كابل على ألف ألف ومائتي ألف فوهب له مائتي ألف فتم الصلح على ألف ألف درهم وأمضاه زياد. ذكر الكتاب أن عبد الله بن أمية صالحه على ثلاثمائة ألف درهم فعزله عبد الملك، ثم صالحه عبيد الله بن أبي بكرة على أن يؤدي الخراج حيناً ويمنعه حيناً آخر، وتقدم الحجاج بجيش أربعين ألفاً سنة 80هـ. {cite:salabi-umayyad-state-2020 p.87-88}"
  en: "Rutbil, king of the Zabils; after the Kabul Shah expelled the Muslims he took Zabulistan and Rukhkhaj to Bust, where al-Rabi' ibn Ziyad routed him and pursued to Rukhkhaj; later he sued Ubaydallah ibn Abi Bakra at Barzan for peace over his land and Kabul's — settled at a million dirhams, ratified by Ziyad."
  es: "Rutbil, rey de los Zabils; después de que el Shah de Kabul expulsara a los musulmanes, llevó Zabulistán y Rukhkhaj a Bust, donde al-Rabi' ibn Ziyad lo derrotó y lo persiguió hasta Rukhkhaj; más tarde, demandó a Ubaydallah ibn Abi Bakra en Barzan para obtener la paz sobre sus tierras y las de Kabul, acuerdo que se resolvió en un millón de dirhams y que fue ratificado por Ziyad."
  fr: "Rutbil, roi des Zabils; après que le Shah de Kaboul eut expulsé les musulmans, il prit le Zabulistan et le Rukhkhaj pour Bust, où al-Rabi' ibn Ziyad le mit en déroute et le poursuivit jusqu'au Rukhkhaj; plus tard, il poursuivit Ubaydallah ibn Abi Bakra à Barzan pour la paix sur ses terres et celles de Kaboul — un accord fut conclu pour un million de dirhams, ratifié par Ziyad."
  ur: "روتبل، زبیلس کا بادشاہ؛ کابل شاہ نے مسلمانوں کو نکال باہر کرنے کے بعد وہ زابلستان اور رخخج کو بوست لے گیا جہاں الربیع ابن زیاد نے اسے شکست دی اور رخخج تک تعاقب کیا۔ بعد میں اس نے عبیداللہ ابن ابی بکرہ پر برزان میں اپنی سرزمین اور کابل کی صلح کے لیے مقدمہ دائر کیا - جس کی توثیق زیاد نے دس لاکھ درہم میں کی۔"
