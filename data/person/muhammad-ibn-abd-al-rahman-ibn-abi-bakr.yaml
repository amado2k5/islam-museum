class: person
label: { ar: "محمد بن عبد الرحمن بن أبي بكر", en: "Muhammad ibn Abd al-Rahman ibn Abi Bakr", es: "Muhammad ibn Abd al-Rahman ibn Abi Bakr", fr: "Muhammad ibn Abd al-Rahman ibn Abi Bakr", ur: "محمد بن عبدالرحمٰن بن ابی بکر" }
summary:
  ar: "محمد بن عبد الرحمن بن أبي بكر الصديق؛ ولد عبد الله بن محمد وله عقب يقال لهم آل أبي عتيق من بين ولد أبي بكر؛ وذلك أن عدداً من ولد أبي بكر تفاخروا فقال أحدهم: أنا ابن الصديق، وقال آخر: أنا ابن ثاني اثنين، وقال آخر: أنا ابن صاحب الغار، وقال محمد بن عبد الرحمن: أنا ابن عتيق فنُسب إلى ذلك هو وولده {cite:wafayat-ayan}."
  en: "Muhammad b. Abd al-Rahman b. Abi Bakr — ancestor of the Al Abi 'Atiq branch; when Abu Bakr's descendants vied over his titles he claimed 'I am the son of al-'Atiq,' and the name stuck to his line {cite:wafayat-ayan}."
  es: "Muhammad b. Abd al-Rahman b. Abi Bakr — antepasado de la rama Al Abi 'Atiq; cuando los descendientes de Abu Bakr se disputaron sus títulos, él afirmó 'Soy hijo de al-'Atiq', y el nombre se mantuvo en su linaje {cite:wafayat-ayan}."
  fr: "Muhammad b. Abd al-Rahman b. Abi Bakr — ancêtre de la branche Al Abi 'Atiq; lorsque les descendants d'Abu Bakr se disputèrent ses titres, il affirma « Je suis le fils d'al-'Atiq », et le nom resta dans sa lignée {cite:wafayat-ayan}."
  ur: "محمد بی عبدالرحمٰن بی۔ ابی بکر - آل ابی عتیق شاخ کے آباؤ اجداد؛ جب ابوبکر کی اولاد نے ان کے القاب پر جھگڑا کیا تو انہوں نے دعویٰ کیا کہ 'میں عتیق کا بیٹا ہوں' اور نام ان کی سطر سے چپکا ہوا تھا۔"
  tr: "Muhammed ibn Abdurrahman ibn Ebi Bekir el-Siddik; Abdullah bin Muhammed'in oğluydu ve Ebu Bekir'in soyundan Abi Atiq ailesi olarak adlandırılan soyları vardı; bunun nedeni, Ebu Bekir'in birçok soyundan gelenlerin övünmesidir. Birisi dedi ki: Ben el-Siddiq'in oğluyum, diğeri dedi ki: Ben iki oğlun oğluyum, bir diğeri dedi ki: Ben mağara sahibinin oğluyum. Muhammed ibn Abdül-Rahman şöyle dedi: Ben Atiq'in oğluyum, bu yüzden o ve oğlu o {atıf:wafayat-ayan} olarak kabul edilir."
  id: "Muhammad ibn Abd al-Rahman ibn Abi Bakr al-Siddiq; ia adalah putra Abdullah ibn Muhammad dan memiliki keturunan yang disebut keluarga Abi Atiq dari antara keturunan Abu Bakr; ini karena sejumlah keturunan Abu Bakr membanggakan diri. Seseorang berkata: Saya putra al-Siddiq, yang lain berkata: Saya putra dari dua putra, dan yang lain berkata: Saya putra pemilik gua. Muhammad ibn Abd al-Rahman berkata: Saya putra Atiq, maka dia dan putranya dikaitkan dengan {cite:wafayat-ayan}."
