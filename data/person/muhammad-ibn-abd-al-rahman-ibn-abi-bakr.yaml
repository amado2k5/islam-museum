summary:
  ar: "محمد بن عبد الرحمن بن أبي بكر الصديق؛ ولد عبد الله بن محمد وله عقب يقال لهم آل أبي عتيق من بين ولد أبي بكر؛ وذلك أن عدداً من ولد أبي بكر تفاخروا فقال أحدهم: أنا ابن الصديق، وقال آخر: أنا ابن ثاني اثنين، وقال آخر: أنا ابن صاحب الغار، وقال محمد بن عبد الرحمن: أنا ابن عتيق فنُسب إلى ذلك هو وولده {cite:wafayat-ayan}."
  en: "Muhammad b. Abd al-Rahman b. Abi Bakr — ancestor of the Al Abi 'Atiq branch; when Abu Bakr's descendants vied over his titles he claimed 'I am the son of al-'Atiq,' and the name stuck to his line {cite:wafayat-ayan}."
