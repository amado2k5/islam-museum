issue: { ar: "ما حكم العلماء على ابن سينا، وما هويته الفكرية والمذهبية؟", en: "What did scholars judge of Ibn Sina, and what was his intellectual and confessional identity?" }
perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni scholars judged him differently: al-Ghazali held that three of his teachings (the eternity of the world, God's knowledge of universals only, and the denial of bodily resurrection) amounted to unbelief, while his medical works were widely used.", ar: "تفاوتت أحكام علماء أهل السنة عليه: فقد رأى الغزالي أن ثلاث مسائل من مذهبه (قِدَم العالم، وعلم الله بالكليات دون الجزئيات، وإنكار حشر الأجساد) تفضي إلى الكفر، بينما شاع الانتفاع بكتبه الطبية." }
    sources: [source/gutas-2014]
  - tradition: sunni
    id: qualified-frame-and-alper-reading
    stance: { ar: "الإطار السني وقراءة ألبَر", en: "Sunni frame and Alper's reading", ur: "سنی سیاق اور الپر کی قرأت" }
    summary:
      ar: "تسميه بريتانيكا طبيباً مسلماً؛ ويعارض ألبَر نسبته إلى الشيعة مستنداً إلى السيرة المنقولة وتفسير المفاهيم. هذا إطار معلن وقراءة منسوبة، لا يقين بمذهب شخصي مستنتج من الأسرة أو التعليم {cite:britannica-avicenna opening} {cite:tdv-ibn-sina-alper affiliation-discussion}."
      en: "Britannica calls him a Muslim physician; Alper argues against Shia affiliation from the reported autobiography and interpretation of concepts. This is a declared frame and attributed reading, not certainty about personal sect inferred from family or education {cite:britannica-avicenna opening} {cite:tdv-ibn-sina-alper affiliation-discussion}."
      ur: "بریٹانیکا انہیں مسلمان طبیب کہتا ہے؛ الپر منقول سوانح اور تصورات کی تعبیر سے شیعی نسبت کے خلاف دلیل دیتے ہیں۔ یہ معلن سیاق اور منسوب قرأت ہے، خاندان یا تعلیم سے اخذ کردہ ذاتی مسلک کا یقین نہیں {cite:britannica-avicenna opening} {cite:tdv-ibn-sina-alper affiliation-discussion}۔"
    sources: [source/britannica-avicenna, source/tdv-ibn-sina-alper]
  - tradition: academic
    id: academic
    summary: { en: "His father served the Samanids and is reported to have been Ismaili; Ibn Sina's own confessional identity is debated, and his philosophy was attacked by al-Ghazali and defended by later thinkers.", ar: "يشير المؤرخون إلى أن والده يُروى أنه كان إسماعيليًّا، وأن انتماء ابن سينا المذهبي نفسه محل خلاف." }
    sources: [source/gutas-2014]
  - tradition: academic
    id: alper-reported-affiliation-disagreement
    stance: { ar: "قراءتان منسوبتان لا حكم قاطع", en: "Attributed interpretations, not a verdict", ur: "منسوب تعبیریں، قطعی فیصلہ نہیں" }
    summary:
      ar: "قراءة ألبَر غير الشيعية تستند إلى رفض إسماعيلية الأب والأخ المنقول وإلى اختلاف معاني المفاهيم؛ وينقل في المقابل قراءة كوربان وتوركر كويَل الشيعية أو الإسماعيلية. تعرض القراءتان عبر ألبَر المقروء، لا عن قراءة مستقلة لأصولهما، ولا يصير انتماء الأب أو المعلم إقراراً شخصياً {cite:tdv-ibn-sina-alper affiliation-discussion}."
      en: "Alper's non-Shia reading uses the reported refusal of his father and brother's Ismailism and differences in conceptual meanings; he also reports Corbin's and Türker-Küyel's Shia/Ismaili interpretations. Both readings are attributed through Alper, not independently read originals; a father's or teacher's affiliation is not personal testimony {cite:tdv-ibn-sina-alper affiliation-discussion}."
      ur: "الپر کی غیر شیعی تعبیر باپ اور بھائی کی اسماعیلیت کے منقول انکار اور اصطلاحات کے مختلف معنی پر قائم ہے؛ وہ کوربان اور تورکر کوییل کی شیعی یا اسماعیلی تعبیریں بھی نقل کرتے ہیں۔ دونوں آرا پڑھے ہوئے الپر کے واسطے سے منسوب ہیں، اصل تحریریں آزادانہ نہیں پڑھی گئیں؛ باپ یا استاد کا مسلک ذاتی اقرار نہیں {cite:tdv-ibn-sina-alper affiliation-discussion}۔"
    sources: [source/tdv-ibn-sina-alper]
