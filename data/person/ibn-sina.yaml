summary:
  en: Persian polymath (c. 980–1037) whose Canon of Medicine and Book of Healing shaped medicine and philosophy across the Islamic world and Europe for centuries.
  ar: عالم موسوعي فارسي (نحو 980–1037م) أثّر كتاباه القانون في الطب والشفاء في الفلسفة في العالم الإسلامي وأوروبا قرونًا.
  ur: "مسلمان طبیب اور فلسفی، قانون کے مصنف؛ ان کی ذاتی مسلکی نسبت مختلف فیہ ہے اور یہاں متعین آرا کے ساتھ بیان ہوتی ہے {cite:britannica-avicenna opening} {cite:tdv-ibn-sina-alper affiliation-discussion}۔"
