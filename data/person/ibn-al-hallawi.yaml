id: person/ibn-al-hallawi
class: person
label: { ar: "ابن الحلاوي" }
summary:
  ar: "أبو بكر عماد الدين محمد بن معالى بن غنيمة البغدادي المأموني المعروف بابن الحلاوي؛ المقرئ الفقيه الحنبلي الزاهد؛ سمع من أبي الفتح بن الكروخي وابن ناصر وأبي بكر بن الزاغوني وتفقه على أبي الفتح بن المني وبرع في المذهب حتى قال الذهبي إنه شيخ الحنابلة في زمنه ببغداد وعليه تفقه الشيخ المجد جد ابن تيمية؛ كان ملازماً لزاويته في الجامع قليل المخالطة إلا لأهل الدين، ما دخل باب أحد من أرباب الدنيا ولا قبل لأحد هدية، وكان من أهل الابدال الذين يحفظ الله بهم الأرض ومن عليها فيما وصف به؛ اشتغل بالكسب من الخياطة وبالعلم وإقراء القرآن احتساباً؛ له تصانيف منها «المنير في الأصول»؛ توفي ليلة الجمعة ثامن عشر رمضان سنة إحدى عشرة وستمائة ودفن بباب حرب {cite:shadharat-dhahab p. 48-49}."
  tr: "Ebu Bekir İmad el-Din Muhammed bin Ma'ali bin Ghanimah al-Baghdadi al-Ma'muni, İbn al-Halawi olarak bilinir; Kur'an, Hanbali hukukçusu ve münzevi; Ebu el-Feth bin Kerükhi, İbn Nasir ve Ebu Bekir ibn el-Zaghuni'den duymuş, Ebu el-Feth ibn el-Munna'nın yanında fıkıh okudu. Medhhabda öyle bir üstünlüydü ki, el-Dhahabi onun Bağdat'taki döneminde Hanbali şeyhi olduğunu söylemiştir. Saygıdeğer Şeyh İbn Teymiye'nin yanında eğitim gördü; camiside zaviyesine düzenli olarak katıldı ve nadiren din adamlarıyla görüştü. Hiçbir zaman dünyevi alimlerin kapısından girmedi ve kimseye yaklaşmadı Tanrı'nın yeryüzünü ve üzerindekileri koruduğu İbdal halkı arasındaydı; dikme, bilgi ve Kur'an okuma yoluyla çalıştı; \"Al-Munir fi al-Usul\" gibi eserler yazdı. Ramazan ayının on sekizinci Cuma gecesi, altı yüz on bir hicri yılında vefat etti ve Bab Harb'a defnedildi {cite:shadharat-dhahab, s. 48-49}."
  id: "Abu Bakr Imad al-Din Muhammad ibn Ma'ali ibn Ghanimah al-Baghdadi al-Ma'muni, dikenal sebagai Ibn al-Halawi; Al-Qur'an, ahli hukum Hanbali, dan pertapa (asketik); ia mendengar dari Abu al-Fath ibn al-Karaukhi, Ibn Nasir, dan Abu Bakr ibn al-Zaghuni, serta mempelajari hukum di bawah bimbingan Abu al-Fath ibn al-Munna. Ia unggul dalam madhhab sampai al-Dhahabi mengatakan bahwa ia adalah sheikh Hanbalis pada masanya di Baghdad. Ia belajar di bawah bimbingan Sheikh Ibn Taymiyyah yang terhormat; ia adalah pelayan tetap zawiya di masjid dan jarang bergaul dengan umat beragama. Ia tidak pernah memasuki pintu para ulama duniawi maupun mendekati siapa pun Ia termasuk di antara umat Ibdāl yang melindungi bumi dan segala sesuatu di dalamnya seperti yang mereka gambarkan; ia bekerja melalui menjahit, pengetahuan, dan membaca Al-Qur'an sebagai imbalan; ia menulis karya-karya termasuk \"Al-Munir fi al-Usul.\" Ia meninggal pada malam Jumat, tanggal delapan belas Ramadan, tahun enam ratus sebelas H, dan dimakamkan di Bab Harb {cite:shadharat-dhahab, hlm. 48-49}."
