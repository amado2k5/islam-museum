id: person/ibn-al-hallawi
class: person
label: { ar: "ابن الحلاوي" }
summary:
  ar: "أبو بكر عماد الدين محمد بن معالى بن غنيمة البغدادي المأموني المعروف بابن الحلاوي؛ المقرئ الفقيه الحنبلي الزاهد؛ سمع من أبي الفتح بن الكروخي وابن ناصر وأبي بكر بن الزاغوني وتفقه على أبي الفتح بن المني وبرع في المذهب حتى قال الذهبي إنه شيخ الحنابلة في زمنه ببغداد وعليه تفقه الشيخ المجد جد ابن تيمية؛ كان ملازماً لزاويته في الجامع قليل المخالطة إلا لأهل الدين، ما دخل باب أحد من أرباب الدنيا ولا قبل لأحد هدية، وكان من أهل الابدال الذين يحفظ الله بهم الأرض ومن عليها فيما وصف به؛ اشتغل بالكسب من الخياطة وبالعلم وإقراء القرآن احتساباً؛ له تصانيف منها «المنير في الأصول»؛ توفي ليلة الجمعة ثامن عشر رمضان سنة إحدى عشرة وستمائة ودفن بباب حرب {cite:shadharat-dhahab p. 48-49}."
