summary:
  ar: "معلّم وكاتب وشاعر فلسطيني من القدس (1878–1953)، من رواد التربية الحديثة في العالم العربي؛ أسس المدرسة الدستورية في القدس سنة 1909 ومنع فيها العقاب البدني، وقاد حركة إصلاح الكنيسة الأرثوذكسية في فلسطين فحُرم كنسيًا، ولجأ إلى القاهرة سنة 1948 وتوفي فيها."
  en: "Palestinian teacher, writer and poet from Jerusalem (1878–1953), a pioneer of modern education in the Arab world. He founded the Dusturiyyah school in Jerusalem in 1909 and banned corporal punishment there, led a movement to reform the Orthodox Church in Palestine and was excommunicated for it, and fled to Cairo in 1948, where he died."
  ur: "یروشلم سے تعلق رکھنے والے فلسطینی معلم، مصنف اور شاعر (1878–1953)، عرب دنیا میں جدید تعلیم کے بانیوں میں سے ایک؛ انہوں نے 1909 میں یروشلم میں الدستوریہ اسکول قائم کیا اور وہاں جسمانی سزا پر پابندی لگائی، فلسطین میں آرتھوڈوکس کلیسا کی اصلاح کی تحریک چلائی جس پر انہیں کلیسا سے خارج کیا گیا، اور 1948 میں قاہرہ پناہ لی جہاں ان کا انتقال ہوا۔"
