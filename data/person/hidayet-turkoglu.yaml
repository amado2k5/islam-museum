  ar: "مسؤول كرة سلة تركي ولاعب سابق (وُلد سنة 1979 في إسطنبول)، أول لاعب مولود في تركيا يلعب في NBA؛ لعب خمسة عشر موسماً، وفاز بجائزة اللاعب الأكثر تطوراً 2007–08، ويرأس الاتحاد التركي لكرة السلة منذ أكتوبر 2016."
