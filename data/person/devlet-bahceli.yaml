  es: "Político y economista académico turco, presidente del Partido del Movimiento Nacionalista (MHP) desde 1997 y viceprimer ministro de Turquía (1999-2002). Desde 2018 es un aliado parlamentario clave del presidente Recep Tayyip Erdoğan dentro de la Alianza Popular."
  fr: "Homme politique et économiste turc, il est président du Parti d'action nationaliste (MHP) depuis 1997 et vice-Premier ministre de Turquie (1999-2002). Depuis 2018, il est un allié parlementaire clé du président Recep Tayyip Erdoğan au sein de l'Alliance populaire."
