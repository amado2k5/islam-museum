roles: [jurist]
gender: male
summary:
  ar: "أحمد بن محمد بن أحمد بن جعفر بن حمدان، أبو الحسين القدوري، فقيه حنفي ولد ومات في بغداد وانتهت إليه رئاسة الحنفية في العراق، صاحب المختصر المعروف باسمه في فقه الحنفية وكتاب التجريد."
  en: "Ahmad ibn Muhammad al-Quduri, Abu al-Husayn, a Hanafi jurist born and died in Baghdad, to whom the leadership of the Hanafis in Iraq came; author of the abridgement known by his name in Hanafi jurisprudence and of al-Tajrid."
  fr: "Ahmad ibn Muhammad al-Quduri, Abu al-Husayn, juriste hanafite né et mort à Bagdad, qui devint le chef des hanafites d'Irak ; auteur de l'abrégé de jurisprudence hanafite connu sous son nom et d'al-Tajrid."
  es: "Ahmad ibn Muhammad al-Quduri, Abu al-Husayn, jurista hanafí nacido y muerto en Bagdad, a quien recayó el liderazgo de los hanafíes en Irak; autor del compendio conocido con su nombre en la jurisprudencia hanafí y de al-Tajrid."
  ur: "احمد بن محمد القدوری، ابو الحسین، ایک حنفی فقیہ جو بغداد میں پیدا ہوئے اور فوت ہوئے، جن کے پاس عراق میں حنفیوں کی قیادت آئی۔ فقہ حنفی اور التجرید میں اس کے نام سے جانے جانے والے اختصار کے مصنف۔"
  tr: "Ahmed ibn Muhammed ibn Ahmed ibn Cafer ibn Hamdan, Ebu el-Hüseyin el-Kuduri, Bağdat'ta doğup ölen ve Irak'taki Hanefilerin liderliğini devralan bir Hanefi hukukçusudur. Hanefi fıkıhında kendi adıyla bilinen özet eserin ve el-Tajrid kitabının yazarıdır."
  id: "Ahmad ibn Muhammad ibn Ahmad ibn Ja`far ibn Hamdan, Abu al-Husayn al-Quduri, seorang ahli hukum Hanafi yang lahir dan meninggal di Baghdad dan kepadanya kepemimpinan mazhab Hanafi di Irak beralih. Beliau adalah penulis karya ringkas yang dikenal dengan namanya dalam yurisprudensi Hanafi dan buku al-Tajrid."
