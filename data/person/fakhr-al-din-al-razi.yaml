summary:
  ar: "فخر الدين الرازي متكلم ومفسر مشهور، تذكر دائرة المعارف الإسلامية أنه وُلد في الري سنة 543هـ/1149م أو ربما 544هـ، وأنه عاش معظم حياته في هراة وعُرف بشيخ الإسلام. كان واعظاً ومعلماً اتبع الأشعرية وناقش الفلسفة ونقد ابن سينا، ومن أهم أعماله مفاتيح الغيب والمحصل والمباحث المشرقية. وتؤرخ المقالة وفاته بسنة 606هـ/1209م، وتحكي رواية ابن الأثير أن مماليك الغوري هاجموه بعد مقتل سلطانهم فنجا بمساعدة الوزير."
  en: "Theologian and Qur'an commentator who, according to the Encyclopaedia of Islam, was born at Rayy in 543/1149 or perhaps 544 and spent most of his life at Herat, known as shaykh al-Islam. A preacher and teacher who followed al-Ash'ari, engaged with philosophy and criticised Avicenna, his major works include Mafatih al-ghayb, the Muhassal and al-Mabahith al-mashriqiyya. The article dates his death to 606/1209; in Ibn al-Athir's account the Ghurid ruler's Mamluks attacked him after the sultan's killing and he escaped with the vizier's help."
  ur: "علمِ کلام اور تفسیر کے مشہور عالم؛ دائرۃ المعارف الاسلامیہ کے مطابق وہ 543ھ/1149ء یا شاید 544ھ میں رے میں پیدا ہوئے اور زندگی کا بڑا حصہ ہرات میں گزارا، جہاں شیخ الاسلام کہلائے۔ واعظ اور استاد تھے، اشعری کے پیرو رہے، فلسفے سے مکالمہ کیا اور ابن سینا پر تنقید کی؛ مفاتیح الغیب، المحصل اور المباحث المشرقیہ ان کی اہم تصانیف ہیں۔ مقالہ ان کی وفات 606ھ/1209ء بتاتا ہے؛ ابن الاثیر کے بیان میں غوری سلطان کے قتل کے بعد اس کے مملوکوں نے ان پر حملہ کیا اور وہ وزیر کی مدد سے بچ نکلے۔"
