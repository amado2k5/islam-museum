summary:
  ar: "فخر الدين الرازي متكلم ومفسر مشهور، تذكر دائرة المعارف الإسلامية أنه وُلد في الري سنة 543هـ/1149م أو ربما 544هـ، وأنه عاش معظم حياته في هراة وعُرف بشيخ الإسلام. كان واعظاً ومعلماً اتبع الأشعرية وناقش الفلسفة ونقد ابن سينا، ومن أهم أعماله مفاتيح الغيب والمحصل والمباحث المشرقية. وتؤرخ المقالة وفاته بسنة 606هـ/1209م، وتحكي رواية ابن الأثير أن مماليك الغوري هاجموه بعد مقتل سلطانهم فنجا بمساعدة الوزير."
  en: "Theologian and Qur'an commentator who, according to the Encyclopaedia of Islam, was born at Rayy in 543/1149 or perhaps 544 and spent most of his life at Herat, known as shaykh al-Islam. A preacher and teacher who followed al-Ash'ari, engaged with philosophy and criticised Avicenna, his major works include Mafatih al-ghayb, the Muhassal and al-Mabahith al-mashriqiyya. The article dates his death to 606/1209; in Ibn al-Athir's account the Ghurid ruler's Mamluks attacked him after the sultan's killing and he escaped with the vizier's help."
  ur: "علمِ کلام اور تفسیر کے مشہور عالم؛ دائرۃ المعارف الاسلامیہ کے مطابق وہ 543ھ/1149ء یا شاید 544ھ میں رے میں پیدا ہوئے اور زندگی کا بڑا حصہ ہرات میں گزارا، جہاں شیخ الاسلام کہلائے۔ واعظ اور استاد تھے، اشعری کے پیرو رہے، فلسفے سے مکالمہ کیا اور ابن سینا پر تنقید کی؛ مفاتیح الغیب، المحصل اور المباحث المشرقیہ ان کی اہم تصانیف ہیں۔ مقالہ ان کی وفات 606ھ/1209ء بتاتا ہے؛ ابن الاثیر کے بیان میں غوری سلطان کے قتل کے بعد اس کے مملوکوں نے ان پر حملہ کیا اور وہ وزیر کی مدد سے بچ نکلے۔"
  es: "Teólogo y comentarista del Corán que, según la Enciclopedia del Islam, nació en Rayy en 543/1149 o quizás en 544 y pasó la mayor parte de su vida en Herat, conocido como shaykh al-Islam. Predicador y maestro seguidor de al-Ash'ari, se dedicó a la filosofía y criticó a Avicena. Entre sus obras principales se encuentran Mafatih al-ghayb, el Muhassal y al-Mabahith al-mashriqiyya. El artículo fecha su muerte en 606/1209; según Ibn al-Athir, los mamelucos del gobernante gúrida lo atacaron tras el asesinato del sultán y escapó con la ayuda del visir."
  fr: "Théologien et commentateur du Coran, né à Rayy en 543/1149 ou peut-être 544 selon l'Encyclopédie de l'Islam, il passa la majeure partie de sa vie à Hérat, sous le nom de cheikh al-Islam. Prédicateur et enseignant, disciple d'al-Ash'ari, il s'intéressa à la philosophie et critiqua Avicenne. Parmi ses œuvres majeures figurent Mafatih al-ghayb, le Muhassal et al-Mabahith al-mashriqiyya. L'article situe sa mort en 606/1209; selon le récit d'Ibn al-Athir, les Mamelouks du souverain ghuride l'attaquèrent après l'assassinat du sultan, et il s'échappa grâce à l'aide du vizir."
  tr: "Fakhr al-Din al-Razi, ünlü bir ilahiyatçı ve yorumcuydu. İslami Ansiklopedi, onun 543 Hicri/1149 M.S. veya muhtemelen 544 Hicri yılında Rayy'de doğduğunu ve hayatının çoğunu Herat'ta geçirdiğini, Şeyh al-Islam olarak bilindiğini kaydeder. Ash'ariyyah'ı takip eden, felsefeyi tartışan ve İbn Sina'yı eleştiren bir vaiz ve öğretmendi. En önemli eserleri arasında 'Mafatih al-Ghayb', 'Muhasallal' ve 'Doğu Araştırması' yer alır. Makale, ölümünü 606 Hicri/1209 M.S. tarihine tarihlendirir ve İbn al-Athir'in anlatımı, sultanlarının öldürülmesinden sonra Guri Memlüklerinin ona saldırdığını ve vezirin yardımıyla hayatta kaldığını belirtir."
  id: "Fakhr al-Din al-Razi adalah seorang teolog dan penafsir terkenal. Ensiklopedia Islam mencatat bahwa ia lahir di Rayy pada tahun 543 H/1149 M, atau mungkin 544 H, dan menghabiskan sebagian besar hidupnya di Herat dan dikenal sebagai Sheikh al-Islam. Ia adalah seorang pengkhotbah dan guru yang mengikuti Ash'ariyyah, membahas filsafat, dan mengkritik Ibn Sina. Di antara karya terpentingnya adalah 'Mafatih al-Ghayb,' 'Muhasallal,' dan 'Eastern Research.' Artikel tersebut mencatat kematiannya pada tahun 606 H/1209 M, dan catatan Ibn al-Athir menyatakan bahwa Mamluk al-Ghuri menyerangnya setelah pembunuhan sultan mereka, dan ia selamat dengan bantuan wazir."
