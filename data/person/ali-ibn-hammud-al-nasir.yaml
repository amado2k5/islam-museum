id: person/ali-ibn-hammud-al-nasir
class: person
label: { ar: "علي بن حمود الناصر لدين الله" }
gender: male
summary:
  ar: "أول خلفاء بني حمود بالأندلس، من بني علي بن إدريس بن إدريس العلوي؛ كان من أكبر أمراء البربر المعاضدين لسليمان المستعين حين دخل قرطبة، فلما قتل سليمان بويع بقرطبة في قصرها يوم مقتله، وجلس للمظالم وضرب رقاب جماعة من البربر في إجرام وأهلهم وعشائرهم ينظرون، وضرب عنق فارس بربري حمل عنباً وطيف برأسه في البلد، ثم لما بلغه قيام الأندلسيين بالمرتضى المرواني تغير وأغضى للبربر عن ظلم أهل قرطبة، فقتله صبيان من صقالبة بني مروان في الحمام غرة ذي القعدة سنة ثمان وأربعمائة وكانت مدته إحدى وعشرين شهراً وستة أيام {cite:nafh-tib-maqqari p. 518-519}."
  en: "First Hammudid caliph of Cordoba, bay'a'd the day Sulayman al-Musta'in fell; his eight months of justice — beheading a Berber for a bunch of grapes and parading the head — turned to oppression when al-Murtada rose in the east, until Slav pages killed him in the bath on 1 Dhu'l-Qa'da 408 {cite:nafh-tib-maqqari p. 518-519}."
  es: "Primer califa hammudí de Córdoba, fue jurado el día en que cayó Sulayman al-Musta'in; sus ocho meses de justicia —decapitando a un bereber por un racimo de uvas y exhibiendo la cabeza— se convirtieron en opresión cuando al-Murtada se alzó en el este, hasta que los pajes eslavos lo mataron en el baño el 1 de Dhu'l-Qa'da de 408 {cite:nafh-tib-maqqari p. 518-519}."
  fr: "Premier calife hammudide de Cordoue, il a prêté allégeance le jour de la chute de Sulayman al-Musta'in; ses huit mois de justice — décapitation d'un Berbère pour une grappe de raisin et parade de la tête — se sont transformés en oppression lorsque al-Murtada s'est soulevé à l'est, jusqu'à ce que des pages slaves le tuent dans son bain le 1 Dhu'l-Qa'da 408 {cite:nafh-tib-maqqari p. 518-519}."
  ur: "قرطبہ کا پہلا حمود خلیفہ، بیع جس دن سلیمان المستعین کا زوال ہوا؛ اس کا آٹھ مہینوں کا انصاف — انگوروں کے ایک گچھے کے لیے ایک بربر کا سر قلم کرنا اور سر پر چڑھانا — جب المرتضیٰ مشرق میں طلوع ہوا تو ظلم میں بدل گیا، یہاں تک کہ غلام صفحات نے اسے 1 ذوالقعدہ 408 کو غسل میں قتل کر دیا۔ 518-519}۔"
  tr: "Endülüs'teki Banu Hammud'un ilk halifesi, Banu Ali bin İdris ibn İdris el-Alavi'den, Süleyman el-Musta'in'in Cordoba'ya girdiğinde onu destekleyen en büyük Berberi prenslerinden biriydi. Süleyman öldürüldüğünde, ölüm günü Kordoba'nın sarayında bağlılık yemini etti. Bir grup Berberiyi ezdi ve bir suçla başını kesti, onların halkı ve kabileleri izlerken. Şehirde üzüm ve sal taşıyan bir Berberi şövalyesinin kafasını kesti. Endülüslülerin el-Murtada el-Mervani'ye saldırdığını öğrenince değişti ve Kordoba halkının adaletsizliğini görmezden geldi. 408 Hicri yılının ilk Zhu'd-Qi'da gününde Banu Mervan'ın Seklaba'sından çocuklar tarafından hamamda öldürüldü ve süresi yirmi bir ay altı gündü {alıntı:] nafh-tib-maqqari s. 518-519}."
  id: "Khalifah pertama Banu Hammud di Andalusia, dari Banu Ali ibn Idris ibn Idris al-Alawi, adalah salah satu pangeran Berber terbesar yang mendukung Suleiman al-Musta'in saat ia memasuki Cordoba. Ketika Suleiman dibunuh, ia bersumpah setia kepada Cordoba di istananya pada hari kematiannya. Ia duduk untuk menindas dan memenggal sekelompok orang Berber dalam kejahatan sementara rakyat dan suku mereka menyaksikan. Ia memenggal seorang ksatria Berber yang membawa anggur dan rakit di atas kepalanya di kota. Ketika ia mengetahui bahwa orang Andalusia telah menyerang al-Murtada al-Marwani, ia berubah dan mengabaikan ketidakadilan rakyat Cordoba. Ia dibunuh oleh anak-anak laki-laki dari Saqlaba Banu Marwan di pemandian pada tanggal pertama Dhu al-Qi'dah pada tahun 408 H, dan durasinya adalah dua puluh satu bulan enam hari {cite:Nafh-Tib-Maqqari hlm. 518-519}."
