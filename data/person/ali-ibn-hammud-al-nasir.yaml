gender: male
summary:
  ar: "أول خلفاء بني حمود بالأندلس، من بني علي بن إدريس بن إدريس العلوي؛ كان من أكبر أمراء البربر المعاضدين لسليمان المستعين حين دخل قرطبة، فلما قتل سليمان بويع بقرطبة في قصرها يوم مقتله، وجلس للمظالم وضرب رقاب جماعة من البربر في إجرام وأهلهم وعشائرهم ينظرون، وضرب عنق فارس بربري حمل عنباً وطيف برأسه في البلد، ثم لما بلغه قيام الأندلسيين بالمرتضى المرواني تغير وأغضى للبربر عن ظلم أهل قرطبة، فقتله صبيان من صقالبة بني مروان في الحمام غرة ذي القعدة سنة ثمان وأربعمائة وكانت مدته إحدى وعشرين شهراً وستة أيام {cite:nafh-tib-maqqari p. 518-519}."
  en: "First Hammudid caliph of Cordoba, bay'a'd the day Sulayman al-Musta'in fell; his eight months of justice — beheading a Berber for a bunch of grapes and parading the head — turned to oppression when al-Murtada rose in the east, until Slav pages killed him in the bath on 1 Dhu'l-Qa'da 408 {cite:nafh-tib-maqqari p. 518-519}."
