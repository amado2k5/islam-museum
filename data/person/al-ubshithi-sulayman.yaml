summary:
  ar: "الصدر سليمان الأبشيطي القاهري الشافعي الصوفي؛ تعبد قديماً وحدث واشتغل بالفقه ودرس وأفاد وأفتى وخطب ونزل بالشيخونية ثم تصوف وحج قاضي المحمل مراراً وشرح ألفية ابن مالك وغيرها، ورام الاشتغال بالمنطق فأخذ الشمسية في كمه ودخل على الشيخ الحريفيش مستشيراً فبمجرد رؤيته قال «منّ الله علينا بكتابه العزيز والنحو والأصول فما لنا وللمنطق» وكرر ذلك فرجع وعُدَّ ذلك من كراماتهما، ومن كراماته أنه كان يجيء لحضور الشيخونية فينزل عن بغلته ويرسلها ليس معها أحد فتذهب الرميلة ثم ترجع عند فراغ الدرس سواء بلا زيادة ولا نقص، توفي سنة سبع وثمانين وثمانمائة عن نحو ثمانين سنة {cite:shadharat-dhahab p. 346-347}."
  en: "Al-Ubshithi — the Shaykhuniyya scholar turned Sufi who put the Shamsiyya away when al-Hurayfish's karama redirected him; his unattended mule went to Rumayla and returned at lesson's end; died ~887 near eighty {cite:shadharat-dhahab p. 346-347}."
