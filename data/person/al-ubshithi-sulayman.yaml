summary:
  ar: "الصدر سليمان الأبشيطي القاهري الشافعي الصوفي؛ تعبد قديماً وحدث واشتغل بالفقه ودرس وأفاد وأفتى وخطب ونزل بالشيخونية ثم تصوف وحج قاضي المحمل مراراً وشرح ألفية ابن مالك وغيرها، ورام الاشتغال بالمنطق فأخذ الشمسية في كمه ودخل على الشيخ الحريفيش مستشيراً فبمجرد رؤيته قال «منّ الله علينا بكتابه العزيز والنحو والأصول فما لنا وللمنطق» وكرر ذلك فرجع وعُدَّ ذلك من كراماتهما، ومن كراماته أنه كان يجيء لحضور الشيخونية فينزل عن بغلته ويرسلها ليس معها أحد فتذهب الرميلة ثم ترجع عند فراغ الدرس سواء بلا زيادة ولا نقص، توفي سنة سبع وثمانين وثمانمائة عن نحو ثمانين سنة {cite:shadharat-dhahab p. 346-347}."
  en: "Al-Ubshithi — the Shaykhuniyya scholar turned Sufi who put the Shamsiyya away when al-Hurayfish's karama redirected him; his unattended mule went to Rumayla and returned at lesson's end; died ~887 near eighty {cite:shadharat-dhahab p. 346-347}."
  fr: "Al-Ubshithi – le savant Shaykhuniyya tourné soufi qui a mis la Shamsiyya loin quand karama al-Hurayfish lui redirigé ; son mulet sans surveillance est allé à Rumayla et est revenu à la fin de la leçon ; mort 887 près de quatre-vingts {cite:shadharat-dhahab p. 346-347}."
  es: "Al-Ubshithi — el erudito Shaykhuniyya convertido en sufí que dejó de lado la Shamsiyya cuando el karama de al-Hurayfish lo redirigió; su mula desatendida fue a Rumayla y regresó al final de la lección; murió alrededor del año 887 cerca de los ochenta {cita: shadharat-dhahab págs. 346-347}."
  ur: "الابشیطی - شیخونیہ عالم نے صوفی کو تبدیل کر دیا جس نے شمسیہ کو اس وقت دور کر دیا جب الحریفش کے کرامت نے اسے دوبارہ ہدایت کی؛ اس کا لاپرواہ خچر رومیلہ گیا اور سبق کے اختتام پر واپس آیا۔ اسّی کے قریب وفات 887۔ 346-347}۔"
  tr: "Südüman el-Abşiti el-Kahiri el-Şafii Sufi; eski zamanlarda ibadet etti, geçmişte eğitim gördü, fıkıh uyguladı, öğretti, fayda sağladı, fetva verdi, vaazlar verdi ve Şeyhuniyye'de kaldı, ardından tasavvuf etti, Mahmal'in hakimi olarak defalarca hac yaptı, İbn Malik'in alfiyyesini ve diğerlerini anlattı. Mantıkla uğraştı, bu yüzden şemsiyeyi koluna aldı ve Şeyh al-Haraifish'e girerek tavsiye istedi. Onu görür görmez, 'Allah bize asil Kitabı, dilbilgisi ve prensiplerini verdi, peki mantıkla ne ilgimiz var?' dedi. Bunu tekrarladı ve ardından mucizelerinden biri olarak geri döndü. Mucizelerinden biri, Şeyhuniyya'ya katılmak için gelip katırından inip onu kimse olmadan göndermesiydi. Rumailah ders sonunda geri dönerdi, ek ya da eksik bir şeyle. 887 Hicri yılında, yaklaşık seksen yaşında öldü {atıf:shadharat-dhahab, s. 346-347}."
  id: "Sudr Suleiman al-Abshiti al-Qahiri al-Shafi'i Sufi; ia beribadah pada zaman dahulu, belajar di masa lalu, mempraktikkan firisprudensi, mengajar, memberi manfaat, mengeluarkan fatwa, menyampaikan khutbah, dan tinggal di Shaykhuniyya, kemudian mempraktikkan Sufisme, melaksanakan Haji sebagai hakim Mahmal berulang kali, menjelaskan Alfiyyah Ibn Malik, dan lainnya. Ia berusaha beradaptasi dengan logika, sehingga ia mengambil payung di lengan bajunya dan masuk ke Sheikh al-Haraii ikan mencari nasihat. Begitu melihatnya, ia berkata, 'Tuhan telah memberkati kita dengan Kitab mulia, tata bahasa, dan prinsip-prinsip, jadi apa hubungannya kita dengan logika?' Ia mengulangi hal ini, lalu kembali sebagai salah satu mukjizat mereka. Di antara mukjizatnya adalah ia datang melayani Shaykhuniyya dan turun dari keledainya serta mengirimnya pergi tanpa ada orang bersamanya. Rumailah akan pergi dan kembali di akhir pelajaran, baik dengan tambahan maupun penghilangan. Ia meninggal pada tahun 887 H pada usia sekitar delapan puluh tahun {cite:Shadharat-Dhahab, hlm. 346-347}."
