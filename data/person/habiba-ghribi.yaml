summary:
  ar: "عدّاءة تونسية متخصصة في سباق 3000 متر موانع، وُلدت في القيروان سنة 1984. أصبحت بطلة العالم في دايغو 2011 وبطلة أولمبياد لندن 2012 بعد استبعاد الروسية يوليا زاريبوفا بسبب المنشطات، فكانت أول تونسية تفوز بميدالية أولمبية، وتحمل الرقم القياسي التونسي 9:05.36 منذ 2015."
  en: "Tunisian runner specialising in the 3000 metres steeplechase, born in Kairouan in 1984. She became world champion at Daegu 2011 and Olympic champion at London 2012 after the Russian Yuliya Zaripova was disqualified for doping — the first Tunisian woman to win an Olympic medal — and has held the Tunisian record of 9:05.36 since 2015."
  ur: "تیونس کی دوڑنے والی کھلاڑی جو 3000 میٹر اسٹیپل چیس میں مہارت رکھتی ہیں، 1984 میں قیروان میں پیدا ہوئیں۔ روسی کھلاڑی یولیا زاریپووا کے ڈوپنگ کی وجہ سے نااہل ہونے کے بعد وہ ڈیگو 2011 میں عالمی چیمپئن اور لندن 2012 میں اولمپک چیمپئن بنیں — اولمپک تمغہ جیتنے والی پہلی تیونسی خاتون — اور 2015 سے 9:05.36 کا تیونسی ریکارڈ ان کے پاس ہے۔"
