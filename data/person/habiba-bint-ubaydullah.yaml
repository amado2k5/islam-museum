summary:
  ar: "ابنة عبيد الله بن جحش وأم حبيبة؛ بها كانت أمها تُكنى أم حبيبة، خرجت بها أمها من مكة ورجعت بها معها."
  en: Daughter of Ubaydullah ibn Jahsh and Umm Habiba; her mother was called Umm Habiba after her. Her mother took her out of Mecca and brought her back.
  ur: "عبید اللہ بن جحش اور ام حبیبہ کی بیٹی؛ ان کی والدہ کو ان کے نام پر ام حبیبہ کہا گیا؛ والدہ انہیں مکہ سے نکال کر لے آئیں۔"
  es: "Hija de Ubaydullah ibn Jahsh y Umm Habiba; su madre recibió el nombre de Umm Habiba en su honor. Su madre la sacó de La Meca y la trajo de vuelta."
  fr: "Fille d'Ubaydullah ibn Jahsh et d'Umm Habiba, sa mère portait le même nom qu'elle. Sa mère l'emmena hors de La Mecque puis la ramena."
  tr: "O, Ubeyd Allah bin Jahsh ve um Habiba'nın kızıydı; annesi ise um Habiba olarak biliniyordu. Annesi Mekke'den onunla ayrıldı ve onunla birlikte döndü."
  id: "Dia adalah putri Ubayd Allah ibn Jahsh dan um Habiba; ibunya dikenal sebagai um Habiba. Ibunya meninggalkan Mekah bersamanya dan kembali bersamanya."
