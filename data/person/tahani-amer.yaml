summary:
  ar: "مهندسة طيران وفضاء ومسؤولة تنفيذية في ناسا، مصرية أمريكية وُلدت سنة 1965. تعمل مسؤولة برامج في قسم علوم الأرض بناسا، وشاركت في بعثات مثل SWOT وCLARREO وGeoCarb، ولها براءة اختراع في أدوات قياس الموصلية الحرارية بالأغشية الرقيقة."
  en: "Egyptian-American aerospace engineer and NASA executive, born in 1965. She serves as a program executive in NASA’s Earth Science Division, contributing to missions such as SWOT, CLARREO and GeoCarb, and holds a patent in thin-film thermal conductivity instrumentation."
  ur: "مصری نژاد امریکی ایرو اسپیس انجینئر اور ناسا ایگزیکٹو، 1965 میں پیدا ہوئیں۔ وہ ناسا کے ارتھ سائنس ڈویژن میں پروگرام ایگزیکٹو کے طور پر خدمات انجام دیتی ہیں، SWOT، CLARREO اور GeoCarb جیسے مشنوں میں شریک رہیں اور پتلی تہ ⁦(تھن فلم)⁩ حراری چالکاری کے آلے میں پیٹنٹ رکھتی ہیں۔"
  es: "Ingeniera aeroespacial egipcio-estadounidense y ejecutiva de la NASA, nacida en 1965. Se desempeña como ejecutiva de programas en la División de Ciencias de la Tierra de la NASA, contribuyendo a misiones como SWOT, CLARREO y GeoCarb, y posee una patente en instrumentación de conductividad térmica de película delgada."
  fr: "Ingénieure aérospatiale et cadre de la NASA d'origine égypto-américaine, née en 1965. Elle occupe un poste de responsable de programme au sein de la division des sciences de la Terre de la NASA, contribuant à des missions telles que SWOT, CLARREO et GeoCarb, et détient un brevet dans le domaine de l'instrumentation de conductivité thermique en couches minces."
  tr: "Havacılık mühendisi ve NASA yöneticisi, Mısır-Amerikalı, 1965 doğumlu. NASA'nın Yer Bilimleri bölümünde program görevlisi olarak çalışmakta, SWOT, CLARREO ve GeoCarb gibi görevlerde yer almakta ve ince film termal iletkenlik ölçüm cihazları için patente sahiptir."
  id: "Seorang insinyur dirgantara dan eksekutif NASA, keturunan Mesir-Amerika, lahir pada tahun 1965. Ia bekerja sebagai petugas program di divisi Ilmu Bumi NASA, telah berpartisipasi dalam misi seperti SWOT, CLARREO, dan GeoCarb, serta memegang paten untuk instrumen pengukur konduktivitas termal film tipis."
