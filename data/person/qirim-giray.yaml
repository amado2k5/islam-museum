summary:
  ar: "قريم كراي (1717 – مارس 1769) خان القرم في حكمين: 1758–1764 و1768–1769. من أكثر خونة القرم الأخيرين نفوذًا؛ قاد حملات على بولندا، وفي حكمه الثاني غزا الأراضي الأوكرانية الخاضعة لروسيا في مطلع الحرب الروسية العثمانية، ويُذكر أكثر ما يُذكر راعيًا وسّع قصر الخان في باغجه سراي وكلّف ببناء «نافورة الدموع» الشهيرة فيه سنة 1764."
  en: "Qirim Giray (1717 – March 1769) was Khan of Crimea in two reigns, 1758–1764 and 1768–1769. Among the most influential of the last Crimean khans, he campaigned against Poland and, in his second reign, invaded Russian-held Ukraine at the opening of the Russo-Turkish war; he is best remembered as the patron who extended the Bakhchisaray Palace and commissioned its famous Fountain of Tears in 1764."
  ur: "قریم گرای (1717ء – مارچ 1769ء) دو ادوار میں کریمیا کے خان رہے: 1758ء–1764ء اور 1768ء–1769ء۔ آخری کریمیائی خوانین میں سب سے بااثر شخصیات میں سے ایک؛ انہوں نے پولینڈ کے خلاف مہمات چلائیں اور اپنے دوسرے دور میں روس ترک جنگ کے آغاز پر روسی مقبوضہ یوکرین پر حملہ کیا۔ وہ زیادہ تر اس سرپرست کے طور پر یاد کیے جاتے ہیں جس نے باغچہ سرائے محل کو وسعت دی اور 1764ء میں اس کی مشہور «نافورۂ اشک» تعمیر کرائی۔"

