label:
  ar: "عائشة بنت سعد بن أبي وقاص"
  en: "A'isha bint Sa'd ibn Abi Waqqas"
  fr: "Aïcha bint Sa'd ibn Abi Waqqas"
  es: "A'isha bint Sa'd ibn Abi Waqqas"
  ur: "عائشہ بنت سعد بن ابی وقاص"
roles: [muhaddith]
gender: female
summary:
  ar: "عائشة بنت سعد بن أبي وقاص من بني زهرة، من ثقات راويات الحديث، أقامت في المدينة ورأت ست أمهات المؤمنين وأخذ عنها عدد من العلماء، ولدت سنة 33 هـ وتوفيت سنة 117 هـ."
  en: "A'isha bint Sa'd ibn Abi Waqqas, of the Banu Zuhra, a reliable woman narrator of hadith; she lived in Medina, saw six of the Mothers of the Believers and was a source for a number of scholars; born 33 AH (653), died 117 AH (735)."
  fr: "Aïcha bint Sa’d ibn Abi Waqqas, des Banu Zuhra, transmettrice fiable de hadiths ; elle vécut à Médine, vit six des Mères des croyants et fut une source pour plusieurs savants ; née en 33 H (653), morte en 117 H (735)."
  es: "Aisha bint Sa'd ibn Abi Waqqas, de Banu Zuhra, fue una narradora fiable de hadices; vivió en Medina, conoció a seis de las Madres de los Creyentes y fue fuente de información para varios eruditos; nació en el año 33 de la Hégira (653) y murió en el año 117 de la Hégira (735)."
  ur: "عائشہ بنت سعد بن ابی وقاص، بنو زہرہ کی، حدیث کی ایک معتبر خاتون راوی؛ وہ مدینہ میں رہتی تھیں، مومنوں کی چھ ماؤں کو دیکھا اور متعدد علماء کے لیے ایک ذریعہ تھیں۔ پیدائش 33ھ (653)، وفات 117ھ (735)۔"
