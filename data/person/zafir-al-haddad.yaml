summary:
  ar: "الشاعر المشهور أبو المنصور ظافر بن القاسم الجذامي الإسكندري المعروف بالحداد؛ كان من الشعراء المجيدين وله ديوان شعر أكثره جيد، ومدح جماعة من أمراء مصر، وروى عنه الحافظ أبو طاهر السلفي وغيره من الأعيان، وذكره ابن خلّكان وابن شهبة وأثنى عليه علي بن ظافر في بدائع البدائه؛ وكانت وفاته بمصر في المحرم سنة تسع وعشرين وخمسمائة {cite:shadharat-dhahab p. 571-573}."
  en: "The celebrated poet Abu al-Mansur Zafir ibn al-Qasim al-Judhami of Alexandria, known as al-Haddad; among the accomplished poets with a mostly fine diwan, panegyrist of Egypt's amirs, transmitted from by the hafiz Abu Tahir al-Silafi and other notables, praised by Ali ibn Zafir in Bada'i al-Bada'ih; d. at Misr in Muharram 529 {cite:shadharat-dhahab p. 571-573}."
