summary:
  ar: "الشاعر المشهور أبو المنصور ظافر بن القاسم الجذامي الإسكندري المعروف بالحداد؛ كان من الشعراء المجيدين وله ديوان شعر أكثره جيد، ومدح جماعة من أمراء مصر، وروى عنه الحافظ أبو طاهر السلفي وغيره من الأعيان، وذكره ابن خلّكان وابن شهبة وأثنى عليه علي بن ظافر في بدائع البدائه؛ وكانت وفاته بمصر في المحرم سنة تسع وعشرين وخمسمائة {cite:shadharat-dhahab p. 571-573}."
  en: "The celebrated poet Abu al-Mansur Zafir ibn al-Qasim al-Judhami of Alexandria, known as al-Haddad; among the accomplished poets with a mostly fine diwan, panegyrist of Egypt's amirs, transmitted from by the hafiz Abu Tahir al-Silafi and other notables, praised by Ali ibn Zafir in Bada'i al-Bada'ih; d. at Misr in Muharram 529 {cite:shadharat-dhahab p. 571-573}."
  es: "El célebre poeta Abu al-Mansur Zafir ibn al-Qasim al-Judhami de Alejandría, conocido como al-Haddad; entre los poetas consumados con un diwan en su mayoría excelente, panegirista de los emires de Egipto, transmitido por el hafiz Abu Tahir al-Silafi y otros notables, elogiado por Ali ibn Zafir en Bada'i al-Bada'ih; d. en Misr en Muharram 529 {cita: shadharat-dhahab p. 571-573}."
  fr: "Le célèbre poète Abu al-Mansur Zafir ibn al-Qasim al-Judhami d'Alexandrie, connu sous le nom d'al-Haddad; parmi les poètes accomplis avec un diwan plutôt fin, panégyriste des émirs égyptiens, transmis par le hafiz Abu Tahir al-Silafi et d'autres notables, loué par Ali ibn Zafir dans Bada'i al-Bada'ih; d. à Misr à Muharram 529 {cite: shadharat-dhahab p. 571-573}."
  ur: "اسکندریہ کے مشہور شاعر ابو المنصور ظفیر ابن القاسم الجدمی، جسے الحداد کے نام سے جانا جاتا ہے۔ زیادہ تر عمدہ دیوان کے ساتھ مکمل شاعروں میں سے، مصر کے امیروں کے صحیفہ، حافظ ابو طاہر السلفی اور دیگر قابل ذکر لوگوں سے نقل کیا گیا ہے، جس کی تعریف علی ابن ظفیر نے بدائع البدایح میں کی ہے۔ d محرم 529 میں مصر میں 571-573}۔"
