label: { ar: "أم سلمة بنت يعقوب المخزومية", en: "Umm Salama bint Ya'qub" }
summary:
  ar: "أم سلمة بنت يعقوب بن سلمة بن عبد الله بن الوليد بن المغيرة المخزومي، كانت عند عبد العزيز بن الوليد فهلك عنها ثم عند هشام فهلك عنها، فعرضت على أبي العباس نفسها بسبعمائة دينار فتزوجها وأصدقها خمسمائة، فحظيت عنده وحلف ألا يتزوج عليها ولا يتسرى فولدت له محمداً وريطة وغلبت عليه حتى ما كان يقطع أمراً إلا بمشورتها، وبها وقع على خالد بن صفوان حين وصف له النساء حتى انقلب يصف مضرتهن {cite:muruj-al-dhahab p. 247-250}."
  en: "The Makhzumi widow of two Umayyads who wooed al-Saffah with seven hundred dinars — his sole wife, dominant counsel, and the power behind Khalid ibn Safwan's famous beating {cite:muruj-al-dhahab p. 247-250}."
