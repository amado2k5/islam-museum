label:
  ar: أم سلمة بنت يعقوب المخزومية
  en: Umm Salama bint Ya'qub
  es: "Umm Salama bint Ya'qub"
  fr: "Umm Salama bint Ya'qub"
  ur: "ام سلمہ بنت یعقوب"
summary:
  ar: أم سلمة بنت يعقوب بن سلمة بن عبد الله بن الوليد بن المغيرة المخزومي، كانت عند عبد العزيز بن الوليد فهلك عنها ثم عند هشام فهلك عنها، فعرضت على أبي العباس نفسها بسبعمائة دينار فتزوجها وأصدقها خمسمائة، فحظيت عنده وحلف ألا يتزوج عليها ولا يتسرى فولدت له محمداً وريطة وغلبت عليه حتى ما كان يقطع أمراً إلا بمشورتها، وبها وقع على خالد بن صفوان حين وصف له النساء حتى انقلب يصف مضرتهن {cite:muruj-al-dhahab p. 247-250}.
  en: The Makhzumi widow of two Umayyads who wooed al-Saffah with seven hundred dinars — his sole wife, dominant counsel, and the power behind Khalid ibn Safwan's famous beating {cite:muruj-al-dhahab p. 247-250}.
  es: "La viuda makhzumi de dos omeyas que cortejaron a al-Saffah con setecientos dinares: su única esposa, consejera dominante y el poder detrás de la famosa paliza de Khalid ibn Safwan {cite:muruj-al-dhahab p. 247-250}."
  fr: "La veuve Makhzumi de deux Omeyyades qui courtisèrent al-Saffah avec sept cents dinars — sa seule épouse, conseillère dominante et la force derrière la fameuse raclée infligée à Khalid ibn Safwan {cite:muruj-al-dhahab p. 247-250}."
  ur: "دو امویوں کی مخزومی بیوہ جس نے سات سو دینار دے کر الصفح کو مبعوث کیا - اس کی واحد بیوی، غالب صلاح، اور خالد بن صفوان کی مشہور مار پیٹ کے پیچھے طاقت 247-250}۔"
  tr: "Ümmü Salamah bint Ya'qub ibn Abdullah ibn al-Walid ibn al-Mugira el-Makhzumi, Abdülaziz ibn el-Velid ile birlikteydi; Abdülaziz onun tercihinden vefat etti, ardından Hisham ile birlikte hayatını kaybetti. Kendini Ebu el-Abbas'a yedi yüz dinar karşılığında sundu, Ebu Abbas onunla evlendi ve ona beş yüz dinar verdi. Ebu el-Abbas ona lütuf aldı ve Abbas onunla evlenmeyeceğine ve memnun olmayacağına yemin etti. Ona Muhammed ve Rayta'yı doğurdu ve ona karşı çıktı, ta ki onun tavsiyesi olmadan sadece meseleleri çözebildiği ana kadar. Bunun sayesinde, Halid bin Safvan kadınları anlatırken ona düştü, ta ki Ebu el-Abbas yüzünü çevirip onların zararını anlatana kadar {atıf:Muruj-al-Dhahab, s. 247-250}."
  id: "um Salamah bint Ya'qub ibn Salamah ibn Abdullah ibn al-Walid ibn al-Mughira al-Makhzumi, bersama Abd al-Aziz ibn al-Walid, yang meninggal darinya, lalu bersama Hisham, yang meninggal. Dia menyerahkan dirinya kepada Abu al-Abbas dengan harga tujuh ratus dinar, yang menikahinya dan memberinya lima ratus dinar. Dia mendapat restu dari Abu Abbas, dan dia bersumpah tidak akan menikahinya atau menyenangkan dengannya. Dia melahirkan Muhammad dan Rayta, dan dia berhasil memenangkannya sampai dia hanya bisa memutuskan masalah tanpa nasihatnya. Melalui ini, dia menyerang Khalid ibn Safwan ketika dia menggambarkan wanita kepadanya, sampai dia berpaling dan menggambarkan kerugian mereka {cite:muruj-al-dhahab, hlm. 247-250}."
