summary:
  ar: "محمد أميرزا شيخ ابن عم تمرلنك صاحب فارس؛ قام عليه أخوه اسكندر شاه فغلبه وكان محمد كثير العدل والإحسان فيما يقال فمال عليه بعض خواصه فقتله تقرباً إلى خاطر أخيه اسكندر واستولى اسكندر على ملك أخيه فاتسعت مملكته وذلك سنة اثنتي عشرة وثمانمائة {cite:shadharat-dhahab p. 105}."
  en: "Muhammad Mirza Shaykh, Timur's cousin and lord of Fars — 'much given to justice and beneficence'; his brother Iskandar Shah rose against him, and in 812 some of his own retainers killed him to court Iskandar, who annexed the realm {cite:shadharat-dhahab p. 105}."
  es: "Muhammad Mirza Shaykh, primo de Timur y señor de Fars, \"muy dado a la justicia y la beneficencia\"; su hermano Iskandar Shah se rebeló contra él, y en 812 algunos de sus propios vasallos lo mataron para congraciarse con Iskandar, quien anexó el reino {cite:shadharat-dhahab p. 105}."
  fr: "Muhammad Mirza Shaykh, cousin de Timur et seigneur de Fars — « très enclin à la justice et à la bienfaisance »; son frère Iskandar Shah se souleva contre lui, et en 812, certains de ses propres hommes le tuèrent pour courtiser Iskandar, qui annexa le royaume {cite:shadharat-dhahab p. 105}."
  ur: "محمد مرزا شیخ، تیمور کے کزن اور فارس کے مالک - 'انصاف اور احسان کے لیے بہت کچھ دیا گیا'؛ اس کا بھائی اسکندر شاہ اس کے خلاف اٹھ کھڑا ہوا، اور 812 میں اس کے اپنے ہی کچھ حامیوں نے اسے اسکندر کے دربار میں قتل کر دیا، جس نے سلطنت کو الحاق کر لیا۔ 105}۔"
  tr: "Tamerlank'ın şeyhi Muhammed Amirza, Pers'in kuzeni; kardeşi İskender Şah ona saldırdı ve yendi. Muhammed'in çok adil ve iyi niyetli olduğu söylenirdi, bu yüzden bazı yakın yandaşları ona karşı çıkıp kardeşi İskandar'ın gözüne girmek için onu öldürdü. İskender, kardeşinin krallığını ele geçirdi ve krallığı 805 Hicri yılında genişledi."
  id: "Muhammad Amirza, sepupu Sheikh Tamerlank, penguasa Persia; saudaranya Iskander Shah menyerangnya dan mengalahkannya. Muhammad dikatakan sangat adil dan baik hati, sehingga beberapa rekan dekatnya berbalik melawannya dan membunuhnya untuk mendapatkan dukungan dari saudaranya Iskandar. Iskandar merebut kerajaan saudaranya, dan kerajaannya berkembang pada tahun 805 H."
