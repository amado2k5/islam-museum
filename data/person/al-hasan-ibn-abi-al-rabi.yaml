summary:
  ar: "الحسن بن أبي الربيع واسم أبي الربيع يحيى بن الجعد بن نشيط، حدّث عن عبد الرزاق ويزيد وشبابة والعقدي وغيرهم، روى عنه البغوي وابن صاعد والمحاملي، وقال ابن أبي حاتم هو صدوق؛ توفي بالكرخ من مدينة السلام في جمادى الأولى سنة ثلاث وستين ومائتين وله خمس وثمانون سنة {cite:muntazam-ibn-al-jawzi p. 133}."
  en: "Son of the transmitter Abu'l-Rabi' (Yahya b. al-Ju'd), heard by al-Baghawi and Ibn Sa'id, graded truthful by Ibn Abi Hatim; he died at Karkh, Baghdad, in Jumada I 263 aged eighty-five {cite:muntazam-ibn-al-jawzi p. 133}."
