summary:
  ar: "الحسن بن أبي الربيع واسم أبي الربيع يحيى بن الجعد بن نشيط، حدّث عن عبد الرزاق ويزيد وشبابة والعقدي وغيرهم، روى عنه البغوي وابن صاعد والمحاملي، وقال ابن أبي حاتم هو صدوق؛ توفي بالكرخ من مدينة السلام في جمادى الأولى سنة ثلاث وستين ومائتين وله خمس وثمانون سنة {cite:muntazam-ibn-al-jawzi p. 133}."
  en: "Son of the transmitter Abu'l-Rabi' (Yahya b. al-Ju'd), heard by al-Baghawi and Ibn Sa'id, graded truthful by Ibn Abi Hatim; he died at Karkh, Baghdad, in Jumada I 263 aged eighty-five {cite:muntazam-ibn-al-jawzi p. 133}."
  es: "Hijo del transmisor Abu'l-Rabi' (Yahya b. al-Ju'd), escuchado por al-Baghawi e Ibn Sa'id, calificado de veraz por Ibn Abi Hatim; Murió en Karkh, Bagdad, en Jumada I 263, a la edad de ochenta y cinco años {citar:muntazam-ibn-al-jawzi p. 133}."
  fr: "Fils de l'émetteur Abu'l-Rabi' (Yahya b. al-Ju'd), entendu par al-Baghawi et Ibn Sa'id, jugé véridique par Ibn Abi Hatim; il mourut à Karkh, Bagdad, à Jumada I 263 à l'âge de quatre-vingt-cinq ans {cite:muntazam-ibn-al-jawzi p. 133}."
  ur: "ٹرانسمیٹر ابو الربیع ⁦(یحیی بن الجود)⁩ کا بیٹا، جسے البغوی اور ابن سعید نے سنا، ابن ابی حاتم نے سچا قرار دیا۔ آپ کی وفات کرخ، بغداد میں، جمادی الاول 263 کو پچاسی سال کی عمر میں ہوئی۔ 133}۔"
