  es: "Abu Bakr b. Abd al-Rahman b. al-Harith al-Makhzumi — uno de los Siete Fuqaha de Medina, llamado 'el monje de Quraysh'; su padre al-Harith b. Hisham fue un Compañero {cite:wafayat-ayan}."
  ur: "ابوبکر ب۔ عبدالرحمٰن بی۔ الحارث المخزومی - مدینہ کے سات فقہاء میں سے ایک، جسے 'قریش کا راہب' کہا جاتا ہے۔ ان کے والد الحارث بی ہشام ایک صحابی تھا۔"
