summary:
  ar: "أبو بكر بن عبد الرحمن بن الحارث بن هشام بن المغيرة بن عبد الله بن عمر بن مخزوم القرشي المخزومي، أحد فقهاء المدينة السبعة ومن سادات التابعين، وكان يُسمَّى راهب قريش؛ وأبوه الحارث بن هشام من أصحاب رسول الله {cite:wafayat-ayan}."
  en: "Abu Bakr b. Abd al-Rahman b. al-Harith al-Makhzumi — one of the Seven Fuqaha of Medina, called 'the monk of Quraysh'; his father al-Harith b. Hisham was a Companion {cite:wafayat-ayan}."
  fr: "Abu Bakr b. Abd al-Rahman b. al-Harith al-Makhzumi — l'un des Sept Juristes de Médine, appelé « le moine de Quraysh » ; son père al-Harith b. Hisham était un Compagnon {cite:wafayat-ayan}."
  es: "Abu Bakr b. Abd al-Rahman b. al-Harith al-Makhzumi — uno de los Siete Fuqaha de Medina, llamado 'el monje de Quraysh'; su padre al-Harith b. Hisham fue un Compañero {cite:wafayat-ayan}."
  ur: "ابوبکر ب۔ عبدالرحمٰن بی۔ الحارث المخزومی - مدینہ کے سات فقہاء میں سے ایک، جسے 'قریش کا راہب' کہا جاتا ہے۔ ان کے والد الحارث بی ہشام ایک صحابی تھا۔"
  tr: "Medine'nin yedi fıkıhçısından biri ve takipçilerinin önderlerinden biri olan Ebu Bekr ibn Abdülrahman ibn el-Haris ibn Hişam ibn el-Muğra ibn Abdullah ibn Ömer ibn Makhzum el-Kureşi el-Makhzumi, Kureyş'in keşişi olarak anılırdı; babası el-Haris ibn Hişam ise Allah Resulü'nün sahabelerinden biriydi. {Kaynak: Vefayyat-i Ayan}"
  id: "Abu Bakr ibn Abd al-Rahman ibn al-Harith ibn Hisham ibn al-Mughira ibn Abdullah ibn Umar ibn Makhzum al-Qurashi al-Makhzumi, salah satu dari tujuh ahli hukum Madinah dan salah satu pemimpin para pengikutnya, dan ia disebut sebagai biarawan Quraysh; dan ayahnya, al-Harith ibn Hisham, adalah salah satu sahabat Rasulullah."
