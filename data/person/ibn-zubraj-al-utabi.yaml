summary:
  ar: "أبو منصور محمد بن علي بن إبراهيم بن زبرج النحوي، المعروف بالعتابي نسبة إلى العتابين إحدى محال بغداد في الجانب الغربي؛ كانت له معرفة بالنحو واللغة وفنون الأدب؛ وله الخط المليح الصحيح الذي يتنافس فيه أهل العلم فكل كتاب يوجد بخطه فهو مرغوب فيه؛ قرأ الأدب على الشريف أبي السعادات ابن الشجري وأبي منصور موهوب بن الجواليقي؛ وسمع الحديث من مشايخ وقته وكتب الكثير {cite:wafayat-ayan}."
  en: "Ibn Zubraj al-Utabi (484–555) — Baghdadi grammarian, adib and celebrated calligrapher whose hand was prized; pupil of Ibn al-Shajari and Mawhub al-Jawaliqi {cite:wafayat-ayan}."
