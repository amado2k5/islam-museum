summary:
  ar: "أبو منصور محمد بن علي بن إبراهيم بن زبرج النحوي، المعروف بالعتابي نسبة إلى العتابين إحدى محال بغداد في الجانب الغربي؛ كانت له معرفة بالنحو واللغة وفنون الأدب؛ وله الخط المليح الصحيح الذي يتنافس فيه أهل العلم فكل كتاب يوجد بخطه فهو مرغوب فيه؛ قرأ الأدب على الشريف أبي السعادات ابن الشجري وأبي منصور موهوب بن الجواليقي؛ وسمع الحديث من مشايخ وقته وكتب الكثير {cite:wafayat-ayan}."
  en: "Ibn Zubraj al-Utabi (484–555) — Baghdadi grammarian, adib and celebrated calligrapher whose hand was prized; pupil of Ibn al-Shajari and Mawhub al-Jawaliqi {cite:wafayat-ayan}."
  es: "Ibn Zubraj al-Utabi (484–555): gramático bagdadí, adib y célebre calígrafo cuya mano era apreciada; alumno de Ibn al-Shajari y Mawhub al-Jawaliqi {cita:wafayat-ayan}."
  fr: "Ibn Zubraj al-Utabi (484-555) — grammairien baghdadi, adib et célèbre calligraphe dont la main était appréciée; élève d'Ibn al-Shajari et de Mawhub al-Jawaliqi {cite: wafayat-ayan}."
  ur: "ابن زبرج الطبی (484-555) - بغدادی گرامر، ادیب اور مشہور خطاط جن کے ہاتھ میں قیمتی تھی؛ ابن الشجری اور موذوب الجوالیقی کے شاگرد۔"
  tr: "Ebu Mansur Muhammed bin Ali ibn İbrahim ibn Zaburg, Batı Bağdat'taki dükkanlardan biri olan El-Atabin'in adını taşıyan, dilbilgisi, dil ve edebi sanatlar bilgisine sahipti. Güzel ve doğru bir el yazısı vardı; alimler bu el yazısında yarışıyordu, çünkü el yazısındaki her kitap çok talep görüyordu. Edebiyatı soylu Ebu el-Sedat ibn el-Şacari ve Ebu Mansur Mewhub bin el-Cevaliki'nin yanında okudu; zamanının şeyhlerinden hadis duydu ve çokça yazdı."
  id: "Abu Mansur Muhammad ibn Ali ibn Ibrahim ibn Zaburg si ahli tata bahasa, dikenal sebagai Al-Atabi, dinamai sesuai Al-Atabin, salah satu toko di Baghdad barat; ia memiliki pengetahuan tentang tata bahasa, bahasa, dan seni sastra. Ia memiliki tulisan tangan yang indah dan benar yang bertanding di antara para ulama, karena setiap buku dengan tulisan tangannya sangat dicari. Ia belajar sastra di bawah bimbingan Abu al-Sa'adat ibn al-Shajari dan Abu Mansur Mawhub ibn al-Jawaliqi; ia mendengar hadits dari para sheikh pada zamannya dan menulis secara luas."
