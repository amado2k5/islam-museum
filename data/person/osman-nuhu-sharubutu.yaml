summary:
  ar: "عالم غاني معاصر، الإمام الوطني الأكبر لغانا منذ سنة 1993، وُلد في أكرا ودرس في كوماسي على يد عبد الله دان تانو، وعمل مدرّسًا للشباب المسلم قبل تعيينه نائبًا للإمام الإقليمي سنة 1974. أسس صندوقًا تعليميًا باسمه والمجلس الإسلامي للسلم والأمن في غانا، وهو عضو في مجلس السلم الوطني، واشتهر بدوره في التهدئة بين الطوائف والأديان."
  en: "Living Ghanaian scholar, National Chief Imam of Ghana since 1993. Born at Accra and taught at Kumasi by Abdullah Dan Tano, he taught Muslim youth before his appointment as Deputy Regional Chief Imam in 1974. He founded an education trust bearing his name and the Islamic Peace and Security Council of Ghana, sits on the National Peace Council, and is known for his work calming communal and interfaith tensions."
  ur: "غانا کے زندہ عالم، 1993ء سے گانا کے قومی چیف امام۔ وہ عکرہ (اکرا) میں پیدا ہوئے اور کماسی میں عبد اللہ دان تنو سے تعلیم پائی، اور 1974ء میں نائب علاقائی چیف امام مقرر ہونے سے پہلے مسلم نوجوانوں کو پڑھاتے رہے۔ انہوں نے اپنے نام کا تعلیمی ٹرسٹ اور گانا کی اسلامک پیس اینڈ سیکیورٹی کونسل قائم کی، وہ قومی امن کونسل کے رکن ہیں، اور فرقہ وارانہ و بین المذاہب کشیدگی کم کرنے کے کام کے لیے معروف ہیں۔"
