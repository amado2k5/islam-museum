summary:
  ar: أنصاري من الأوس من بني عمرو بن عوف؛ اختُلف في اسمه (بشير، رفاعة، مروان)، وردّه النبي من الطريق إلى بدر واستخلفه على المدينة وضرب له بسهمه وأجره مع أهل بدر؛ ويقال كان من النقباء ليلة العقبة وكانت راية بني عمرو بن عوف معه يوم الفتح.
  en: An Ansari of the Aws, of Banu Amr ibn Awf; his name is disputed (Bashir, Rifa'a or Marwan); the Prophet sent him back on the road to Badr, left him in charge of Medina and gave him a share and the reward of the Badr fighters; it is said
    he was one of the naqibs on the night of al-Aqaba and he carried the banner of Banu Amr ibn Awf at the conquest.
