summary:
  ar: "مغنية مالية من منطقة واسولو، وُلدت في باماكو سنة 1968 لأم مغنية، وغنّت في الشارع طفلةً لإعالة أسرتها بعد رحيل أبيها، ثم صارت بألبومها الأول «موسولو» (1990) نجمة في غرب أفريقيا. تُلقّب بـ«طائر واسولو المغرد»، وتدور كثير من أغانيها على نقد اجتماعي ولا سيما مكانة المرأة، وهي سفيرة نوايا حسنة لدى منظمة الفاو وحائزة على جائزة غرامي سنة 2011."
  en: "Malian singer of the Wassoulou region, born at Bamako in 1968 to a singer mother; she sang in the streets as a child to support her family after her father left, and her first album Moussolou (1990) made her a star across West Africa. Called 'The Songbird of Wassoulou', she writes songs of social criticism, above all on the status of women; she is an FAO goodwill ambassador and won a Grammy Award in 2011."
  ur: "مالی کی واسولو خطے کی گلوکارہ، جو 1968 میں بماکو میں ایک گلوکارہ ماں کے ہاں پیدا ہوئیں؛ والد کے چلے جانے کے بعد بچپن میں خاندان کی کفالت کے لیے گلیوں میں گایا، اور پہلے البم «موسولو» (1990) نے انہیں مغربی افریقہ کی ستارہ بنا دیا۔ «واسولو کی گاتی چڑیا» کہلاتی ہیں، ان کے گیت سماجی تنقید — خصوصاً خواتین کے مقام — پر مبنی ہیں؛ وہ ایف اے او کی خیرسگالی سفیر ہیں اور 2011 میں گریمی ایوارڈ جیتا۔"
