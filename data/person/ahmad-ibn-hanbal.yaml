summary:
  ar: إمام محدّث، جمع المسند، وصاحب المذهب الحنبلي الذي يقدّم النص والأثر، ولم يؤلّف في الفقه إلا رسالة واحدة في الصلاة، وكتب عنه أصحابه أكثر من ثلاثين سفراً من كلامه وفتواه. وعند السيوطي امتنع في المحنة عن أن يقول في القرآن أكثر من كلام الله فقيد مع محمد بن نوح العجلي وأرسلا إلى بلاد الروم فبلغتهم وفاة المأمون قبل وصولهم {cite:tarikh-khulafa-minhaj-1434 p. 491-493}، ثم ضربه المعتصم في سنة عشرين على خلق القرآن {cite:tarikh-khulafa-minhaj-1434 p. 522}.
  en: "An imam and hadith scholar who compiled the Musnad; eponym of the Hanbali school, which gives precedence to the revealed text and transmitted reports. He wrote only one treatise on jurisprudence, on prayer, while his students wrote more than thirty volumes of his words and fatwas."
  ur: "امام اور محدث، مسند کے مرتب اور حنبلی فقہی مکتب سے منسوب شخصیت تھے۔ ان کے علمی کام میں نصوص اور منقول روایات کو مرکزی اہمیت حاصل تھی۔ {cite:madkhal-ibn-badran-turki}"
