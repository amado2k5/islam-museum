summary:
  ar: "داتوق ري باندانغ، واسمه الأصلي عبد المعمور ولقبه خطيب تونغال، عالم من كوتو تانغاه في مينانغكابو، وأحد الداتوق الثلاثة الذين نشروا الإسلام في ممالك شرق الأرخبيل الإندونيسي منذ أواخر القرن السادس عشر. كان فقيهًا، فتولّى الدعوة في غووا وتالو بجنوب سولاويسي، وأسلم على يديه ملك لوو سنة 1605 ثم ملكا غووا وتالو، ومات ودُفن في تالو قرب مكاسار."
  en: "Datuk Ri Bandang, whose real name was Abdul Makmur and whose title was Khatib Tunggal, was a scholar from Koto Tangah in Minangkabau and one of the three datuks who spread Islam through the kingdoms of the eastern Indonesian archipelago from the end of the 16th century. The jurist of the three, he preached in Gowa and Tallo in South Sulawesi; the king of Luwu entered Islam through his mission in 1605, then the kings of Gowa and Tallo, and he died and was buried at Tallo near Makassar."
  ur: "داتوک ری باندانگ، اصل نام عبد المعمور اور لقب خطیب تونگال، مینانگکابو کے علاقے کوتو تانگاہ کے عالم تھے اور ان تین داتوکوں میں سے ایک تھے جنہوں نے سولہویں صدی کے اواخر سے مشرقی انڈونیشیائی جزائر کی ریاستوں میں اسلام پھیلایا۔ وہ فقیہ تھے؛ جنوبی سولاویسی کی ریاستوں گووا اور تالو میں تبلیغ کی، 1605ء میں لوو کے بادشاہ نے ان کے ہاتھ پر اسلام قبول کیا، پھر گووا اور تالو کے بادشاہوں نے، اور وہ تالو میں وفات پا کر وہیں دفن ہوئے۔"

