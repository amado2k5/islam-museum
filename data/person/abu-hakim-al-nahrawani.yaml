summary:
  ar: "أبو حكيم إبراهيم بن دينار النهرواني، فقيه حنبلي، وأحد أئمة بغداد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} قال عنه الذهبي: العلامة القدوة، إمام زاهد ورع خير حليم، إليه المنتهى في علم الفرائض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} سمع أبا الحسن بن العلاف وأبا القاسم بن بيان، وروى عنه ابن الجوزي وابن الأخضر وأبو نصر عمر بن محمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} شرح كتاب «الهداية» لأبي الخطاب الكلوذاني ولم يكمله، وقال ابن الجوزي: قرأت عليه القرآن، وقرأ عليه السامري صاحب المستوعب ونقل عنه في تصانيفه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} والمصادر المذكورة: سير أعلام النبلاء، والمقصد الأرشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} وفي رأس الترجمة تاريخان «٥٥٦» و«٤٨١» ولم يُبيّن أيهما الوفاة وأيهما الميلاد."
  en: "Abu Hakim Ibrahim ibn Dinar al-Nahrawani, a Hanbali jurist and one of the imams of Baghdad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} Al-Dhahabi described him as a model scholar, an ascetic, scrupulous, virtuous and gentle imam, the final authority in the law of inheritance shares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} He heard Abu al-Hasan ibn al-Allaf and Abu al-Qasim ibn Bayan, and Ibn al-Jawzi, Ibn al-Akhḍar and Abu Nasr Umar ibn Muhammad transmitted from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} He began a commentary on Abu al-Khattab al-Kalwadhani's al-Hidaya without completing it, and Ibn al-Jawzi reports that he read the Qur'an to him and that al-Samarri, author of al-Mustaw'ib, studied with him and quoted him in his works. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} The cited sources are Siyar a'lam al-nubala' and al-Maqsad al-arshad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} The heading prints two figures, 556 and 481, without saying which is the birth and which the death."
  fr: "Abu Hakim Ibrahim ibn Dinar al-Nahrawani, juriste hanbalite et l'un des imams de Bagdad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} Al-Dhahabi le décrit comme un savant exemplaire, un imam ascète, scrupuleux, vertueux et doux, l'autorité ultime en droit des parts successorales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} Il entendit Abu al-Hasan ibn al-Allaf et Abu al-Qasim ibn Bayan, et Ibn al-Jawzi, Ibn al-Akhdar et Abu Nasr Umar ibn Muhammad transmirent de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} Il commença un commentaire d'al-Hidaya d'Abu al-Khattab al-Kalwadhani sans l'achever, et Ibn al-Jawzi rapporte qu'il lui récita le Coran et qu'al-Samarri, auteur d'al-Mustaw'ib, étudia avec lui et le cita dans ses ouvrages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} Les sources citées sont les Siyar a'lam al-nubala' et al-Maqsad al-arshad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} L'en-tête imprime deux chiffres, 556 et 481, sans dire lequel est la naissance et lequel la mort."
  es: "Abu Hakim Ibrahim ibn Dinar al-Nahrawani, un jurista hanbalí y uno de los imanes de Bagdad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} Al-Dhahabi lo describió como un erudito modelo, un imán asceta, escrupuloso, virtuoso y gentil, la máxima autoridad en la ley de herencias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} Escuchó a Abu al-Hasan ibn al-Allaf y Abu al-Qasim ibn Bayan, e Ibn al-Jawzi, Ibn al-Akhḍar y Abu Nasr Umar ibn Muhammad transmitiron de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} Comenzó un comentario sobre al-Hidaya de Abu al-Khattab al-Kalwadhani sin completarlo, e Ibn al-Jawzi informa que le leyó el Corán y que al-Samarri, autor de al-Mustaw'ib, estudió con él y lo citó en sus obras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} Las fuentes citadas son Siyar a'lam al-nubala' y al-Maqsad al-arshad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} El encabezado imprime dos cifras, 556 y 481, sin decir cuál es el nacimiento y cuál la muerte."
  ur: "ابو حکیم ابراہیم ابن دینار النہروانی، حنبلی فقیہ اور بغداد کے اماموں میں سے ایک۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18067} الذہبی نے انہیں ایک نمونہ عالم، متقی، پرہیزگار، نیک اور شریف امام، وراثت کے قانون میں حتمی اتھارٹی قرار دیا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 18067} اس نے ابو الحسن بن العلاف اور ابو القاسم بن بیان کو سنا اور ابن الجوزی، ابن الاخضر اور ابو نصر عمر بن محمد نے ان سے روایت کی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18067} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18068} اس نے ابو الخطاب الکلوادنی کی الہدایہ کی تفسیر مکمل کیے بغیر شروع کی، اور میں نے قرآن مجید کو پڑھا اور اس کی اطلاع دی۔ المصطعیب کے مصنف السمری نے ان کے ساتھ مطالعہ کیا اور اپنی تخلیقات میں ان کا حوالہ دیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18068} حوالہ کردہ ماخذ سیار اعلام النبلاء اور المقصد الارشاد ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18068} اس سرخی میں دو اعداد ہیں، 556 اور 481، یہ بتائے بغیر کہ کون سی پیدائش ہے اور کون سی موت۔"
