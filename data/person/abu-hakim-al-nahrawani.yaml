summary:
  ar: "أبو حكيم إبراهيم بن دينار النهرواني، فقيه حنبلي، وأحد أئمة بغداد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} قال عنه الذهبي: العلامة القدوة، إمام زاهد ورع خير حليم، إليه المنتهى في علم الفرائض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} سمع أبا الحسن بن العلاف وأبا القاسم بن بيان، وروى عنه ابن الجوزي وابن الأخضر وأبو نصر عمر بن محمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} شرح كتاب «الهداية» لأبي الخطاب الكلوذاني ولم يكمله، وقال ابن الجوزي: قرأت عليه القرآن، وقرأ عليه السامري صاحب المستوعب ونقل عنه في تصانيفه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} والمصادر المذكورة: سير أعلام النبلاء، والمقصد الأرشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} وفي رأس الترجمة تاريخان «٥٥٦» و«٤٨١» ولم يُبيّن أيهما الوفاة وأيهما الميلاد."
  en: "Abu Hakim Ibrahim ibn Dinar al-Nahrawani, a Hanbali jurist and one of the imams of Baghdad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} Al-Dhahabi described him as a model scholar, an ascetic, scrupulous, virtuous and gentle imam, the final authority in the law of inheritance shares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} He heard Abu al-Hasan ibn al-Allaf and Abu al-Qasim ibn Bayan, and Ibn al-Jawzi, Ibn al-Akhḍar and Abu Nasr Umar ibn Muhammad transmitted from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} He began a commentary on Abu al-Khattab al-Kalwadhani's al-Hidaya without completing it, and Ibn al-Jawzi reports that he read the Qur'an to him and that al-Samarri, author of al-Mustaw'ib, studied with him and quoted him in his works. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} The cited sources are Siyar a'lam al-nubala' and al-Maqsad al-arshad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18068} The heading prints two figures, 556 and 481, without saying which is the birth and which the death."
