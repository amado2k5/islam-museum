summary:
  ar: "الملا حسن جلبي الفناري الحنفي الإمام العلامة؛ قال في الشقائق كان عالماً فاضلاً قسم أيامه بين العلم والعبادة وكان يلبس الثياب الخشنة ولا يركب دابة للتواضع وكان يحب الفقراء والمساكين ويعاشر الصوفية وكان مدرساً بالمدرسة الحلية بأدرنة وكان ابن عمه الملا علي الفناري قاضياً بالعسكر في أيام السلطان محمد خان فدخل عليه وقال استأذن من السلطان إني أريد أن أذهب إلى مصر لقراءة مغني اللبيب في النحو على رجل مغربي سمعته بمصر يعرف ذلك الكتاب غاية المعرفة فعرضه على السلطان فأذن له وقال قد اختل دماغ ذلك المرء وكان السلطان محمد لا يحبه لأجل أنه صنف حواشيه على التلويح باسم السلطان بايزيد في حياة والده، ثم إنه دخل إلى مصر وكتب كتاب مغني اللبيب بتمامه وقرأه على ذلك المغربي قراءة تحقيق وإتقان وكتب ذلك المغربي بخطه على ظهر كتابه إجازة له في ذلك الكتاب وقرأ هناك صحيح البخاري على بعض تلامذة ابن حجر وحصل له منه إجازة في ذلك الكتاب وفي رواية الحديث عنه ثم حج وأتى بلاد الروم وأرسل كتاب مغني اللبيب إلى السلطان محمد فلما نظر فيه زال عنه تكدر خاطره عليه وأعطاه مدرسة أزنيق ثم إحدى الثمان وعين له في كل يوم ثمانين درهماً وسكن برسا إلى أن مات وله حواش على المطول وحواش على شرح المواقف للسيد الشريف وحواش على التلويح للعلامة التفتازاني وكلها مقبولة متداولة، توفي في حدود سنة تسع وسبعين وثمانمائة {cite:shadharat-dhahab p. 324-325}."
  en: "Hasan Celebi al-Fanari — the Edirne teacher who travelled to Egypt just to read Mughni al-Labib on a Maghrebi who knew it perfectly ('the sultan said: that man's mind must be unhinged'), then sent the finished work to Mehmed II and was given the Iznik madrasa and 80 dirhams a day; settled at Bursa and died ~879 {cite:shadharat-dhahab p. 324-325}."
  es: "Hasan Celebi al-Fanari, el maestro de Edirne que viajó a Egipto solo para leer Mughni al-Labib a un magrebí que lo conocía a la perfección («el sultán dijo: la mente de ese hombre debe desquiciarse»), luego envió la obra terminada a Mehmed II y se le concedió la madrasa de Iznik y 80 dirhams al día; se estableció en Bursa y murió alrededor del año 879 {cita: shadharat-dhahab págs. 324-325}."
  fr: "Hasan Celebi al-Fanari — le professeur d'Edirne qui se rendit en Égypte uniquement pour lire Mughni al-Labib à un Maghrébin qui le connaissait parfaitement (« le sultan dit: l'esprit de cet homme doit être dérangé »), puis envoya l'ouvrage terminé à Mehmed II et reçut la madrasa d'Iznik et 80 dirhams par jour; s'installa à Bursa et mourut vers 879 {cite: shadharat-dhahab p. 324-325}."
  ur: "حسن سیلبی الفناری - وہ ایڈرنی استاد جس نے مصر کا سفر صرف مغربی پر مغنی اللبیب پڑھنے کے لیے کیا تھا جو اسے بخوبی جانتا تھا ⁦('سلطان نے کہا: اس آدمی کا دماغ بے لگام ہونا چاہیے')⁩، پھر ختم شدہ کام محمد ثانی کو بھیج دیا اور اسے ازنک مدرسہ اور 80 درہم یومیہ دیا گیا۔ برسا میں سکونت اختیار کی اور وفات پائی ~879 324-325}۔"
  tr: "Seçkin İmam Mele Hasan Celabi el-Fanari el-Hanefi, El-Şakaiq'ta şöyle demiştir: O, günlerini bilgi ve ibadet arasında bölen erdemli bir âlimdi. Kaba giysiler giyerdi ve alçakgönüllülükten dolayı hayvana binmezdi. Fakirleri ve muhtaçları severdi, Sufilerle ilişki kurardı. Edirne'deki El-Hilliya Okulu'nda öğretmendi. Kuzeni Mela Ali el-Fanari, Sultan Muhammed Han döneminde askeri hakimdi. Yanına girip, 'Sultan'dan izin istiyorum, Mısır'da duyduğum ve o kitabı bilen bir Faslı adama Bilginlerin Şarkıcısı'nı dilbilgisi olarak okumak için Mısır'a gitmek istiyorum.' dedi. Kitabı Sultan'a gösterdi, Sultan da ona izin verdi ve adamın aklını kaybettiğini, Sultan Muhammed'in ise babasının yaşamı sırasında Sultan Bayezid'e atıfta bulunarak kenar notlarını yazdığını söyledi. Sonra Mısır'a girdi ve Mughni al-Labib kitabını baştan sona yazdı, o Faslıya titizlikle ve titizlikle okudu. O Faslı, kitabının arkasına kendi el yazısıyla o kitabın lisansını yazdı ve orada İbn Hacer'in bazı öğrencilerine Sahih al-Bukhari'yi okudu ve o kitapta ondan bir yetki aldı Hakkında hadisi anlatırken hac yolculuğu yaptı, Romalıların topraklarına seyahat etti ve Mughni al-Labib'den Sultan Muhammed'e bir mektup gönderdi. Mektubu görünce üzüldü ve ona sekizinci okullardan biri olan Azniq okulunu verdi, her gün seksen dirhem verildi ve ölümüne kadar Pers'te yaşadı. El-Mu'tavval hakkında, Seyyid El-Şerif'in Şerh Mevakif'i ve Allama El-Teftazani'nin El-Tavvih notları vardır; bunların hepsi kabul edilip dolaşıma girmektedir. Yaklaşık 879 Hicri yılında vefat etti {atıf:şadharat-dhahab, s. 324-325}."
  id: "Mulla Hassan Jalabi al-Fanari al-Hanafi, Imam terkemuka, berkata dalam Al-Shaqa'iq: Ia adalah ulama yang berbudi luhur yang membagi hari-harinya antara pengetahuan dan ibadah. Ia mengenakan pakaian kasar dan tidak menunggang binatang karena rendah hati. Ia mencintai orang miskin dan membutuhkan, serta bergaul dengan para Sufi. Ia adalah guru di Sekolah Al-Hilliya di Edirne. Sepupunya, Mulla Ali al-Fanari, adalah seorang hakim militer pada masa pemerintahan Sultan Muhammad Khan. Ia masuk dan berkata, 'Saya meminta izin dari Sultan untuk pergi ke Mesir membacakan Singer of the Wise dalam tata bahasa kepada seorang pria Maroko yang saya dengar di Mesir yang mengetahui buku itu.' Ia menunjukkannya kepada Sultan, yang memberinya izin, mengatakan bahwa manusia telah kehilangan akal, dan Sultan Muhammad tidak menyukainya karena ia menulis catatan pinggir dengan merujuk pada Sultan Bayezid selama masa hidup ayahnya. Ia kemudian masuk ke Mesir dan menulis seluruh buku Mughni al-Labib, dan membacakannya kepada orang Maroko itu dengan ketelitian dan ketelitian. Orang Maroko itu menulis dengan tulisan tangannya sendiri di belakang bukunya sebuah lisensi untuk buku itu, dan di sana ia membacakan Sahih al-Bukhari kepada beberapa murid Ibn Hajar dan memperoleh izin darinya dalam buku itu Dalam menceritakan hadits tentangnya, ia kemudian melakukan ziarah, melakukan perjalanan ke tanah Romawi, dan mengirim surat dari Mughni al-Labib kepada Sultan Muhammad. Ketika ia melihatnya, ia sangat sedih dan memberinya sekolah Azniq, yang saat itu salah satu dari yang kedelapan, dan diberi delapan puluh dirham setiap hari dan tinggal di Persa hingga ia meninggal. Ia memiliki catatan tentang Al-Mu'tawwal, catatan tentang Sharh Al-Mawaqif oleh Sayyid Al-Sharif, dan catatan tentang Al-Tawwih oleh Allama Al-Taftazani, semuanya diterima dan diedarkan. Ia meninggal sekitar tahun 879 H {cite:shadharat-dhahab, hlm. 324-325}."
