summary:
  ar: "الملا حسن جلبي الفناري الحنفي الإمام العلامة؛ قال في الشقائق كان عالماً فاضلاً قسم أيامه بين العلم والعبادة وكان يلبس الثياب الخشنة ولا يركب دابة للتواضع وكان يحب الفقراء والمساكين ويعاشر الصوفية وكان مدرساً بالمدرسة الحلية بأدرنة وكان ابن عمه الملا علي الفناري قاضياً بالعسكر في أيام السلطان محمد خان فدخل عليه وقال استأذن من السلطان إني أريد أن أذهب إلى مصر لقراءة مغني اللبيب في النحو على رجل مغربي سمعته بمصر يعرف ذلك الكتاب غاية المعرفة فعرضه على السلطان فأذن له وقال قد اختل دماغ ذلك المرء وكان السلطان محمد لا يحبه لأجل أنه صنف حواشيه على التلويح باسم السلطان بايزيد في حياة والده، ثم إنه دخل إلى مصر وكتب كتاب مغني اللبيب بتمامه وقرأه على ذلك المغربي قراءة تحقيق وإتقان وكتب ذلك المغربي بخطه على ظهر كتابه إجازة له في ذلك الكتاب وقرأ هناك صحيح البخاري على بعض تلامذة ابن حجر وحصل له منه إجازة في ذلك الكتاب وفي رواية الحديث عنه ثم حج وأتى بلاد الروم وأرسل كتاب مغني اللبيب إلى السلطان محمد فلما نظر فيه زال عنه تكدر خاطره عليه وأعطاه مدرسة أزنيق ثم إحدى الثمان وعين له في كل يوم ثمانين درهماً وسكن برسا إلى أن مات وله حواش على المطول وحواش على شرح المواقف للسيد الشريف وحواش على التلويح للعلامة التفتازاني وكلها مقبولة متداولة، توفي في حدود سنة تسع وسبعين وثمانمائة {cite:shadharat-dhahab p. 324-325}."
  en: "Hasan Celebi al-Fanari — the Edirne teacher who travelled to Egypt just to read Mughni al-Labib on a Maghrebi who knew it perfectly ('the sultan said: that man's mind must be unhinged'), then sent the finished work to Mehmed II and was given the Iznik madrasa and 80 dirhams a day; settled at Bursa and died ~879 {cite:shadharat-dhahab p. 324-325}."
