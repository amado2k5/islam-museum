summary:
  ar: "كاتب وطبيب وثوري بلشفي ورجل دولة أذربيجاني (1870–1925)، من رواد الأدب الأذربيجاني الحديث ومؤسس أول مكتبة قراءة عامة في باكو (1894)، رأس حكومة جمهورية أذربيجان السوفيتية (1920–1922) ثم صار أحد رؤساء اللجنة التنفيذية المركزية للاتحاد السوفيتي، وتوفي في موسكو ودُفن عند جدار الكرملين."
  en: "Azerbaijani writer, physician, Bolshevik revolutionary and statesman (1870–1925), a pioneer of modern Azerbaijani literature who founded Baku's first public reading room in 1894. He headed the government of the Azerbaijan Soviet Republic (1920–1922) and became a chairman of the Central Executive Committee of the USSR; he died in Moscow and is buried by the Kremlin Wall."
  ur: "آذربائیجانی ادیب، طبیب، بالشویک انقلابی اور سیاست دان (1870–1925)، جدید آذربائیجانی ادب کے بانیوں میں سے ایک اور باکو کے پہلے عوامی کتب خانے کے بانی (1894)۔ وہ آذربائیجان سوویت جمہوریہ کی حکومت کے سربراہ رہے (1920–1922) اور پھر سوویت یونین کی مرکزی ایگزیکٹو کمیٹی کے صدور میں شامل ہوئے؛ ماسکو میں وفات پائی اور کریملن کی دیوار کے پاس دفن ہوئے۔"
