died: { edtf: "1160", hijri: "0555", calendar: julian, precision: day, status: tradition, derived: true, note: "قتل في وقعة سطيف يوم الخميس في العشر الأوسط من ربيع الآخر سنة خمس وخمسين وخمسمائة {cite:wafayat-ayan}." }
summary:
  ar: "محرز بن زياد، أحد أمراء العرب بإفريقية؛ آوى الحسن بن علي آخر ملوك الزيريين بعد سقوط المهدية بيد الفرنج سنة ثلاث وأربعين وخمسمائة، وقُتل في وقعة سطيف يوم الخميس في العشر الأوسط من ربيع الآخر سنة خمس وخمسين وخمسمائة {cite:wafayat-ayan}."
  en: "Mahraz b. Ziyad — Arab amir of Ifriqiya who sheltered the last Zirid al-Hasan b. Ali after the Norman fall of al-Mahdiyya; killed at the Battle of Setif, mid-Rabi' II 555 {cite:wafayat-ayan}."
  es: "Mahraz b. Ziyad: emir árabe de Ifriqiya que protegió al último Zirid al-Hasan b. Ali después de la caída normanda de al-Mahdiyya; muerto en la batalla de Setif, a mediados de Rabi' II 555 {cita:wafayat-ayan}."
  fr: "Mahraz b. Ziyad — émir arabe d'Ifriqiya qui a abrité le dernier Zirid al-Hasan b. Ali après la chute normande d'al-Mahdiyya; tué à la bataille de Sétif, mi-Rabi' II 555 {cite: wafayat-ayan}."
  ur: "مہراز بی۔ زیاد - عفریقیہ کا عرب امیر جس نے آخری زرد الحسن بن کو پناہ دی۔ المہدیہ کے نارمن زوال کے بعد علی؛ جنگ صفیف میں، وسط ربیع الثانی 555 میں مارا گیا۔"
  tr: "İfrikiye'deki Arap prenslerinden Muharriz bin Ziyad, 543 Hicri yılında Mahdizmin Franklara düşmesinden sonra Zirid hanedanının son kralı el-Hasan bin Ali'yi barındırmış ve 555 Hicri yılında Rabi'el-Tani'nin on gününün ortasında Perşembe günü Sétif Muharebesi'nde öldürülmüştür."
  id: "Muharriz ibn Ziyad, salah satu pangeran Arab di Ifriqiya, melindungi al-Hasan ibn Ali, raja terakhir dinasti Zirid, setelah jatuhnya Mahdisme ke tangan Franka pada tahun 543 H, dan tewas dalam Pertempuran Sétif pada hari Kamis, di tengah sepuluh hari Rabi' al-Thani pada tahun 555 H."
