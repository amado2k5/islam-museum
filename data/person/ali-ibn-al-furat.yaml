id: person/ali-ibn-al-furat
class: person
label: { ar: "علي بن الفرات" }
summary:
  ar: "وزير عباسي وُلّي الوزارة ثانية في سنة أربع وثلاثمائة، وقُبض عليه مع ابنه في سنة اثنتي عشرة وثلاثمائة، وأمر المقتدر بقتلهما {cite:tabari-tarikh-abu-al-fadl j.11 p.59} {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}.، وعند المسعودي استوزره المقتدر ثلاث مرات وفي الثالثة كان ولده محسن بن علي الغالب على الأمور فأتى على جماعة من الكتاب ثم قبض عليه وعلى ولده {cite:muruj-al-dhahab p. 660-661}، وعند ابن الأثير قبض عليه المقتدر في ذي الحجة سنة 299هـ وكان قد ظهر قبل القبض عليه بمدة يسيرة ثلاث كواكب مذنبة أحدها ظهر آخر رمضان في برج الأسد والآخر في ذي القعدة في المشرق والثالث في المغرب من ذي القعدة أيضاً في برج العقرب، ولما قُبض عليه وكّل بداره وهتك حرمه ونهب ماله ونُهبت دور أصحابه {cite:kamil-ibn-al-athir p. 48-49}"
gender: male
