id: person/ali-ibn-al-furat
class: person
label: { ar: "علي بن الفرات", fr: "Ali ibn al-Furat" }
summary:
  ar: "وزير عباسي وُلّي الوزارة ثانية في سنة أربع وثلاثمائة، وقُبض عليه مع ابنه في سنة اثنتي عشرة وثلاثمائة، وأمر المقتدر بقتلهما {cite:tabari-tarikh-abu-al-fadl j.11 p.59} {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. وعند المسعودي استوزره المقتدر ثلاث مرات وفي الثالثة كان ولده محسن بن علي الغالب على الأمور فأتى على جماعة من الكتاب ثم قبض عليه وعلى ولده {cite:muruj-al-dhahab p. 660-661}، وعند ابن الأثير قبض عليه المقتدر في ذي الحجة سنة 299هـ وكان قد ظهر قبل القبض عليه بمدة يسيرة ثلاث كواكب مذنبة أحدها ظهر آخر رمضان في برج الأسد والآخر في ذي القعدة في المشرق والثالث في المغرب من ذي القعدة أيضاً في برج العقرب، ولما قُبض عليه وكّل بداره وهتك حرمه ونهب ماله ونُهبت دور أصحابه {cite:kamil-ibn-al-athir p. 48-49} وعند ابن الجوزي غضب عليه المقتدر سنة تسع وتسعين فحُبس وأُخذ كل ما وُجد له ولأهله وأصحابه وانتُهبت دورهم أقبح نهب وادُّعي عليه أنه كتب إلى الأعراب أن يكبسوا بغداد، ثم خرج سنة أربع وثلاثمائة فقُلد الوزارة وخُلع عليه يوم التروية سبع خلع وحُمل إليه ثلاثمائة ألف درهم، وسقى الناس في داره أربعين ألف رطل من الثلج، وكان بين اعتقاله ورجوعه إلى الوزارة خمس سنين وأربعة أيام {cite:muntazam-ibn-al-jawzi p. 390, 423}."
  fr: "Vizir abbasside nommé une deuxième fois en 304 H, arrêté avec son fils en 312 H et mis à mort sur ordre d’al-Muqtadir {cite:tabari-tarikh-abu-al-fadl j.11 p.59} {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. Selon al-Mas’udi, al-Muqtadir le nomma trois fois vizir ; durant la troisième, son fils Muhsin ibn Ali dominait les affaires et s’en prit à plusieurs secrétaires, avant leur arrestation {cite:muruj-al-dhahab p. 660-661}. Ibn al-Athir situe son arrestation en dhu al-hijja 299 H, peu après l’apparition de trois comètes : l’une à la fin de ramadan dans le Lion, une autre en dhu al-qa’da à l’est et la troisième, le même mois, à l’ouest dans le Scorpion. Sa maison fut placée sous garde, son intimité violée et ses biens ainsi que les maisons de ses compagnons pillés {cite:kamil-ibn-al-athir p. 48-49}. Selon Ibn al-Jawzi, al-Muqtadir le fit emprisonner en 299 ; tous les biens trouvés chez lui, sa famille et ses compagnons furent saisis et leurs maisons affreusement pillées. Il fut accusé d’avoir écrit aux Bédouins pour les inciter à attaquer Bagdad. Libéré en 304, il retrouva le vizirat : le jour d’al-Tarwiya, il reçut sept robes d’honneur et trois cent mille dirhams, et distribua chez lui quarante mille ratls de glace. Cinq ans et quatre jours séparaient son arrestation de son retour au vizirat {cite:muntazam-ibn-al-jawzi p. 390, 423}."
