id: person/ali-ibn-al-furat
class: person
label: { ar: "علي بن الفرات" }
summary:
  ar: "وزير عباسي وُلّي الوزارة ثانية في سنة أربع وثلاثمائة، وقُبض عليه مع ابنه في سنة اثنتي عشرة وثلاثمائة، وأمر المقتدر بقتلهما {cite:tabari-tarikh-abu-al-fadl j.11 p.59} {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. وعند المسعودي استوزره المقتدر ثلاث مرات وفي الثالثة كان ولده محسن بن علي الغالب على الأمور فأتى على جماعة من الكتاب ثم قبض عليه وعلى ولده {cite:muruj-al-dhahab p. 660-661}، وعند ابن الأثير قبض عليه المقتدر في ذي الحجة سنة 299هـ وكان قد ظهر قبل القبض عليه بمدة يسيرة ثلاث كواكب مذنبة أحدها ظهر آخر رمضان في برج الأسد والآخر في ذي القعدة في المشرق والثالث في المغرب من ذي القعدة أيضاً في برج العقرب، ولما قُبض عليه وكّل بداره وهتك حرمه ونهب ماله ونُهبت دور أصحابه {cite:kamil-ibn-al-athir p. 48-49} وعند ابن الجوزي غضب عليه المقتدر سنة تسع وتسعين فحُبس وأُخذ كل ما وُجد له ولأهله وأصحابه وانتُهبت دورهم أقبح نهب وادُّعي عليه أنه كتب إلى الأعراب أن يكبسوا بغداد، ثم خرج سنة أربع وثلاثمائة فقُلد الوزارة وخُلع عليه يوم التروية سبع خلع وحُمل إليه ثلاثمائة ألف درهم، وسقى الناس في داره أربعين ألف رطل من الثلج، وكان بين اعتقاله ورجوعه إلى الوزارة خمس سنين وأربعة أيام {cite:muntazam-ibn-al-jawzi p. 390, 423}."
  tr: "Bir Abbasi veziri 304 Hicri yılında tekrar bakan olarak atanmış, 302 Hicri'de oğluyla birlikte tutuklanmış ve onların idamını emretmişti {cite:tabari-tarikh-abu-al-fadl j.11 s.59} {cite:tabari-tarikh-abu-al-fadl j.11 s.104} {cite:tabari-tarikh-abu-al-fadl j.11 s.105}. El-Mes'udi, El-Muktadir'i üç kez ziyareti için atadı, üçüncü seferde ise oğlu Muhsin bin Ali işlerin baskın otoritesi oldu. Bir grup yazarı ziyaret etti ve ardından kendisini ve oğlunu tutukladı {atıf:Muruj-al-Dhahab, s. 660-661}. İbn al-Athir'e göre, El-Muktadir onu 299 Hicce'de yakalamıştır. Tutuklanmadan önce üç kuyruklu yıldız ortaya çıkmıştı: biri Ramazan'da, diğeri Aslan takımyıldızında, diğeri doğuda Dhu'd-Qi'dah'ta ve üçüncüsü de Dhu al-Qi'dah'ın batısında kulede görünmüştü. Al-'Aqrab onu yakaladığında, evini yıktı, kutsallığını ihlal etti, servetini yağmaladı ve yoldaşlarının evlerini yağmaladı. {cite:kamil-ibn-al-athir s. 48-49} İbn al-Jawzi'ye göre, doksan doksan yılında el-Muqtadir ona kızdı, hapsedildi ve kendisi, ailesi ve yoldaşları için bulunan her şey alındı. Evleri en kötü şekilde yağmalandı ve bedevilere Bağdat'ı ele geçirmeleri için yazdığı iddia edildi. Sonra 304 Hicri yılında ayrıldı, vezirliği devraldı ve Tarwiye gününde yedi taht aldı, üç yüz bin dirhem getirdi. Evine kırk bin pound kar verdi ve Tutuklanması ile bakanlığa dönüşü arasında beş yıl dört gün geçti {atıf:Muntazam-ibn-al-jawzi s. 390, 423}."
  id: "Seorang wazir Abbasiyah diangkat kembali menjadi menteri pada tahun 304 H, ditangkap bersama putranya pada tahun 302 H, dan memerintahkan eksekusi mereka {cite:tabari-tarikh-abu-al-fadl j.11 hlm.59} {cite:tabari-tarikh-abu-al-fadl j.11 hlm.104} {cite:tabari-tarikh-abu-al-fadl j.11 hlm.105}. Al-Mas'udi menunjuk Al-Muqtadir untuk kunjungannya sebanyak tiga kali, dan pada kesempatan ketiga, putranya Muhsin ibn Ali menjadi otoritas dominan atas urusan. Ia mengunjungi sekelompok penulis dan kemudian menangkap dia dan putranya {cite:muruj-al-dhahab, hlm. 660-661}. Menurut Ibn al-Athir, Al-Muqtadir menangkapnya dalam Dhu al-Hijjah 299 H. Sebelum penangkapannya, tiga bintang komet telah muncul: satu muncul pada Ramadan, yang lain di rasi bintang Leo, satu lagi di Dhu al-Qi'dah di timur, dan yang ketiga di barat Dhu al-Qi'dah juga di menara. Ketika Al-'Aqrab menangkapnya, ia menghancurkan rumahnya, melanggar kesuciannya, menjarah hartanya, dan menjarah rumah para sahabatnya {cite:kamil-ibn-al-athir hlm. 48-49} Menurut Ibn al-Jawzi, al-Muqtadir marah kepadanya pada tahun sembilan puluh sembilan, sehingga ia dipenjara, dan segala sesuatu yang ditemukan untuknya, keluarganya, dan rekan-rekannya diambil. Rumah mereka dijarah dengan cara yang sangat buruk, dan dikatakan bahwa ia menulis surat kepada Badui untuk merebut Baghdad. Kemudian ia pergi pada tahun 304 H, mengambil alih wazir, dan pada hari Tarwiyyah, tujuh deposisi diambil darinya, membawa tiga ratus ribu dirham. Ia memberikan orang-orang empat puluh ribu pon salju di rumahnya, dan ia Antara penangkapannya dan kembalinya ke kementerian terdapat lima tahun empat hari {cite:Muntazam-ibn-al-jawzi hlm. 390, 423}."
