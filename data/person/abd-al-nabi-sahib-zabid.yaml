id: person/abd-al-nabi-sahib-zabid
class: person
label: { ar: "عبد النبي صاحب زبيد", en: "Abd al-Nabi, lord of Zabid", fr: "Abd al-Nabi, seigneur de Zabid", es: "Abd al-Nabi, lord of Zabid", ur: "عبد النبی، زبید کا رب" }
summary:
  ar: "المتغلب على زبيد المعروف بعبد النبي، وكان قد قطع الخطبة العباسية؛ سار إليه شمس الدولة تورانشاه بن أيوب بإذن نور الدين في رجب سنة تسع وستين وخمسمائة، فلما قرب منها استقل أهلها من معه فقال لهم: كأنكم بهؤلاء وقد حمي عليهم الحر فهلكوا إلا أكلة رام، فخرج إليهم بعسكره فانهزم أهله ونصب المهاجمون السلالم على السور وملكوا البلد عنوة، وأُسر هو وزوجته المدعوة بالحرة — وكانت امرأة صالحة كثيرة الصدقة على فقراء الحاج — وسلمه إلى سيف الدولة مبارك بن كامل المنقذي يستخرج منه الأموال فدلهم على دفائن قبر أبيه {cite:kamil-ibn-al-athir p. 52-53}."
  en: "Abd al-Nabi, master of Zabid, who had cut the Abbasid khutba — confident the heat would kill the invaders 'save a lizard's bite', he rode out against Turanshah in Rajab 569, lost, and was taken with his pious wife al-Hurra; handed to Sayf al-Dawla Mubarak ibn Kamil of Shayzar's Banu Munqidh to yield up his treasures, including his father's grave-hoard {cite:kamil-ibn-al-athir p. 52-53}."
  fr: "Abd al-Nabi, maître de Zabid, qui avait supprimé la khutba abbasside — persuadé que la chaleur tuerait les envahisseurs « hormis une morsure de lézard », il sortit contre Turanshah en rajab 569, fut vaincu et pris avec sa pieuse épouse al-Hurra ; livré à Sayf al-Dawla Mubarak ibn Kamil, des Banu Munqidh de Shayzar, pour qu'il rende ses trésors, dont le magot enfoui dans la tombe de son père {cite:kamil-ibn-al-athir p. 52-53}."
  es: "Abd al-Nabi, señor de Zabid, que había cortado la jutba abasí —confiado en que el calor mataría a los invasores \"salvo la mordedura de un lagarto\"—, salió a luchar contra Turanshah en Rajab 569, perdió y fue capturado junto con su piadosa esposa al-Hurra; entregado a Sayf al-Dawla Mubarak ibn Kamil de Banu Munqidh de Shayzar para que entregara sus tesoros, incluido el tesoro funerario de su padre {cite:kamil-ibn-al-athir p. 52-53}."
  ur: "عبد النبی، زبید کا ماسٹر، جس نے عباسی خطبہ کاٹ دیا تھا - اس بات پر یقین تھا کہ گرمی حملہ آوروں کو 'چھپکلی کے کاٹنے سے بچائے گی' کو مار دے گی، وہ رجب 569 میں توران شاہ کے خلاف سوار ہوا، ہار گیا، اور اسے اپنی پاک بیوی الحررہ کے ساتھ لے جایا گیا۔ شیزر کے بنو منقذ کے سیف الدولہ مبارک ابن کامل کو اپنے خزانے جمع کرنے کے لیے سونپ دیے گئے، جس میں ان کے والد کی قبر بھی شامل ہے۔ 52-53}۔"
  tr: "Abbasîlerin vaazlarını kesen ve Zabid'i fetheden Abdülnebi, Hicri 569 yılının Receb ayında Nurü'l-Din'in izniyle Şemsül-Devla Turanşah ibn Eyyub tarafından saldırıya uğradı. Şehre yaklaştığında, halkı onu yalnız sandı. Bunun üzerine onlara şöyle dedi: \"Bakın, bu insanlar sanki çok sıcaktan kavrulmuş ve birkaç lokma dışında hepsi helak olmuş gibi.\" Bunun üzerine ordusuyla birlikte onların yanına gitti. Halkı yenilgiye uğradı ve saldırganlar surlara merdivenler kurarak şehri zorla ele geçirdiler. Kendisi ve eşi, hacıların fakirlerine çok sadaka veren dindar bir kadın olan el-Hurra, esir alındı ve kendisinden para koparmak için Seyfül-Devla Mübarek ibn Kamil el-Munkidhi'ye teslim edildi. Bunun üzerine onlara babasının mezarının hazinelerini gösterdi. 52-53}."
  id: "Penakluk Zabid, yang dikenal sebagai Abd al-Nabi, yang telah menghentikan dakwah Abbasiyah, diserang oleh Shams al-Dawla Turanshah ibn Ayyub dengan izin Nur al-Din pada bulan Rajab tahun 569 H. Ketika ia mendekati kota itu, penduduknya mengira ia sendirian, sehingga ia berkata kepada mereka: “Seolah-olah kalian melihat orang-orang ini, dan panasnya telah menyengat mereka, dan mereka telah binasa kecuali beberapa suapan.” Maka ia pergi menemui mereka dengan pasukannya, dan rakyatnya dikalahkan, dan para penyerang memasang tangga di tembok dan menguasai kota itu dengan paksa. Ia dan istrinya, yang bernama al-Hurra — seorang wanita saleh yang banyak memberi sedekah kepada kaum miskin peziarah — ditangkap dan diserahkan kepada Sayf al-Dawla Mubarak ibn Kamil al-Munqidhi untuk memeras uang darinya, sehingga ia menunjukkan kepada mereka harta karun makam ayahnya {cite:kamil-ibn-al-athir p. 52-53}."
