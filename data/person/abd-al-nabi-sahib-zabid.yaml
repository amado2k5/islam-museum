id: person/abd-al-nabi-sahib-zabid
class: person
label: { ar: "عبد النبي صاحب زبيد", en: "Abd al-Nabi, lord of Zabid" }
summary:
  ar: "المتغلب على زبيد المعروف بعبد النبي، وكان قد قطع الخطبة العباسية؛ سار إليه شمس الدولة تورانشاه بن أيوب بإذن نور الدين في رجب سنة تسع وستين وخمسمائة، فلما قرب منها استقل أهلها من معه فقال لهم: كأنكم بهؤلاء وقد حمي عليهم الحر فهلكوا إلا أكلة رام، فخرج إليهم بعسكره فانهزم أهله ونصب المهاجمون السلالم على السور وملكوا البلد عنوة، وأُسر هو وزوجته المدعوة بالحرة — وكانت امرأة صالحة كثيرة الصدقة على فقراء الحاج — وسلمه إلى سيف الدولة مبارك بن كامل المنقذي يستخرج منه الأموال فدلهم على دفائن قبر أبيه {cite:kamil-ibn-al-athir p. 52-53}."
  en: "Abd al-Nabi, master of Zabid, who had cut the Abbasid khutba — confident the heat would kill the invaders 'save a lizard's bite', he rode out against Turanshah in Rajab 569, lost, and was taken with his pious wife al-Hurra; handed to Sayf al-Dawla Mubarak ibn Kamil of Shayzar's Banu Munqidh to yield up his treasures, including his father's grave-hoard {cite:kamil-ibn-al-athir p. 52-53}."
