id: person/ghalib-ibn-abd-al-rahman-al-nasir
class: person
label: { ar: "غالب بن عبد الرحمن الناصر" }
gender: male
summary:
  ar: "مولى الحكم المستنصر صاحب مدينة سالم؛ أعان ابن أبي عامر على قتل المغيرة أخي الحكم يوم بيعة هشام المؤيد، ثم استعان به ابن أبي عامر على نكبة المصحفي، ثم استعان عليه بجعفر بن علي بن حمدون فأزاحه ابن أبي عامر في تسلسل اقتلاعه أولياء الدولة {cite:nafh-tib-maqqari p. 433}."
  en: "Al-Hakam's mawla and lord of Medinaceli who helped Ibn Abi Amir kill al-Mughira and destroy al-Mushafi — and was then destroyed in turn through Ja'far b. Hamdun, in the hajib's patient sequence of eliminations {cite:nafh-tib-maqqari p. 433}."
  es: "Mawla de Al-Hakam y señor de Medinaceli que ayudó a Ibn Abi Amir a matar a al-Mughira y destruir a al-Mushafi, y luego fue destruido a su vez a través de Ja'far b. Hamdun, en la paciente secuencia de eliminaciones del hajib {cita:nafh-tib-maqqari p. 433}."
  fr: "Le mawla d'Al-Hakam et seigneur de Medinaceli qui a aidé Ibn Abi Amir à tuer al-Mughira et à détruire al-Mushafi - et a ensuite été détruit à son tour par Ja'far b. Hamdun, dans la séquence patiente d'éliminations du hajib {cite:nafh-tib-maqqari p. 433}."
  ur: "الحکم کا مولا اور مدینہ کا آقا جس نے ابن ابی عامر کی المغیرہ کو قتل کرنے اور مصحفی کو تباہ کرنے میں مدد کی اور پھر جعفر بن کے ذریعے تباہ ہو گیا۔ ہمدون، حاجب کے صبر کے سلسلے میں ختم کرنے کے سلسلے میں {حوالہ دیں:نفح تبع مقری ص۔ 433}۔"
  tr: "Salim şehrinin hükümdarı Al-Hakam al-Mustansir'in özgür kalınanı, Hisham al-Mu'ayyad'ın bağlılık yemini ettiği gün, el-Hakam'ın kardeşi el-Muğhira'yı öldürmede İbn Ebi Amir'e yardım etti. Sonra İbn Ebi Amir, el-Müşafi felaketinde ona karşı yardım istedi, ardından devlet müttefiklerini kökünden çıkarırken Ja'far bin Ali ibn Hamdun'un yardımını aldı {atıf:nafh-tib-maqqari, s. 433}."
  id: "Mantan al-Hakam al-Mustansir, penguasa kota Salim, membantu Ibn Abi Amir membunuh al-Mughira, saudara al-Hakam, pada hari sumpah setia Hisham al-Mu'ayyad. Kemudian Ibn Abi Amir meminta bantuannya melawannya dalam bencana al-Mushafi, kemudian ia meminta bantuan Ja'far ibn Ali ibn Hamdun, yang kemudian menggulingkannya dalam rangkaian pengusiran sekutu negara {cite:nafh-tib-maqqari, hlm. 433}."
