summary:
  ar: "أبو الحسن روح بن عبد المؤمن الهذلي البصري النحوي، راوي قراءة يعقوب الحضرمي؛ توفي سنة 234هـ أو 235هـ، وقال ابن الجزري إنه مقرئ جليل ثقة ضابط مشهور من أجل أصحاب يعقوب وأوثقهم، وروى عنه البخاري في صحيحه {cite:nashr-dahman-damascus-1345-v1 p. 197}."
  en: "Abu al-Hasan Rawh ibn 'Abd al-Mu'min al-Hudhali al-Basri, a grammarian and transmitter of the reading of Ya'qub al-Hadrami; he died in 234 or 235 AH. Ibn al-Jazari calls him an eminent, reliable and exact reader, among the most distinguished and most trustworthy of Ya'qub's companions, and says that al-Bukhari narrated from him in his Sahih {cite:nashr-dahman-damascus-1345-v1 p. 197}."
  ur: "ابو الحسن روح بن عبد المؤمن ہذلی بصری، نحوی، یعقوب حضرمی کی قراءت کے راوی؛ 234ھ یا 235ھ میں فوت ہوئے۔ ابن الجزری انہیں جلیل، ثقہ، ضابط، مشہور اور یعقوب کے جلیل ترین و معتمد ترین ساتھیوں میں سے کہتے ہیں اور بتاتے ہیں کہ بخاری نے اپنی صحیح میں ان سے روایت لی {cite:nashr-dahman-damascus-1345-v1 p. 197}."
