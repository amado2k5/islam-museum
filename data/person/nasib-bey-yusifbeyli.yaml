summary:
  ar: "صحفي وسياسي أذربيجاني (1881–1920)، مؤسس حزب الفيدراليين الأتراك الذي اندمج في مساوات، ووزير المالية ثم التعليم في أول حكومة أذربيجانية، ورئيس مجلس الوزراء (1919–1920)؛ قُتل سنة 1920 وهو فارّ من باكو بعد سقوط الجمهورية."
  en: "Azerbaijani publicist and statesman (1881–1920), founder of the Party of Turkic Federalists that merged into Musavat, finance and then education minister in the first Azerbaijani cabinet, and chairman of the Council of Ministers (1919–1920); killed in 1920 fleeing Baku after the republic's fall."
  ur: "آذربائیجانی صحافی اور سیاست دان (1881–1920)، ترک وفاقیوں کی جماعت کے بانی جو مساوات میں ضم ہوئی؛ پہلی آذربائیجانی کابینہ میں وزیرِ خزانہ و تعلیم اور بعد ازاں وزیرِ اعظم (1919–1920)؛ 1920 میں باکو سے فرار کے دوران قتل ہوئے۔"
