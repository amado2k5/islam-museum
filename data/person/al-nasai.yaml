summary:
  ar: "محدث نسا بخراسان صاحب «السنن» المعدودة في الكتب الستة؛ رحل في طلب الحديث بخراسان والعراق والشام ومصر والحجاز والجزيرة، وسكن مصر بزقاق القناديل، ثم خرج إلى دمشق في أواخر عمره فامتُحن فيها عن فضائل معاوية وتوفي بالرملة سنة ٣٠٣هـ."
  en: "The muhaddith of Nasa in Khurasan, author of the Sunan counted among the six books; he travelled for hadith through Khurasan, Iraq, al-Sham, Egypt, the Hijaz and the Jazira, settled in Egypt at Zuqaq al-Qanadil, then moved to Damascus late in life, was attacked over the virtues of Mu'awiya and died at al-Ramla in 303/915."
  ur: "خراسان کے شہر نسا کے محدث، «السنن» کے مصنف جو کتبِ ستہ میں شمار ہوتی ہے؛ انہوں نے خراسان، عراق، شام، مصر، حجاز اور جزیرہ میں طلبِ حدیث کے سفر کیے، مصر کے زقاق القنادیل میں سکونت اختیار کی، پھر عمر کے آخر میں دمشق گئے جہاں معاویہ کے فضائل پر حملہ ہوا اور وہ 303ھ/915ء میں رملہ میں فوت ہوئے۔"
