summary:
  ar: "أبو عبد الرحمن أحمد بن شعيب النسائي، محدث من نسا بخراسان، صاحب «السنن» أحد الكتب الستة المعتمدة في الحديث، وُلد سنة 215هـ/830م. رحل في طلب الحديث واستقر في مصر ثم في دمشق، وتذكر دائرة المعارف الإسلامية أنه مات من جراء سوء المعاملة في دمشق، أو في الرملة بحسب آخرين، وأن قبره بمكة. وله كتاب في فضائل علي وكتاب في الضعفاء والمتروكين."
  en: "Abu Abd al-Rahman Ahmad ibn Shu'ayb al-Nasa'i, a muhaddith from Nasa in Khurasan, was born in 215/830 and compiled the Sunan, one of the six canonical hadith collections. He travelled to hear traditions and settled in Egypt and then in Damascus. The Encyclopaedia of Islam reports that he died of ill-treatment at Damascus or, according to others, at Ramla, and that his tomb is at Mecca. He also wrote a work on the virtues of Ali and one on weak narrators."
  ur: "ابو عبد الرحمن احمد بن شعیب نسائی خراسان کے شہر نسا کے محدث تھے، 215ھ/830ء میں پیدا ہوئے اور «السنن» مرتب کی جو حدیث کے چھ معتبر مجموعوں میں سے ایک ہے۔ انہوں نے احادیث سننے کے لیے سفر کیے اور مصر اور پھر دمشق میں سکونت اختیار کی۔ دائرۃ المعارف اسلامیہ کے مطابق ان کی وفات دمشق میں، یا دوسروں کے مطابق رملہ میں، بدسلوکی کے نتیجے میں ہوئی اور ان کی قبر مکہ میں ہے۔ انہوں نے علی کے فضائل پر اور کمزور راویوں پر بھی کتابیں لکھیں۔"
