summary:
  ar: "عبيد الله بن معمر بن عثمان بن عمرو القرشي التيمي. قال ابن عبد البر إن من زعم أن له صحبة فقد وهم، وإنما له الرؤية، ومات النبي وهو صغير. روى عن عمر وعثمان وطلحة وغيرهم من الصحابة، وروى عنه عروة بن الزبير ومحمد بن سيرين، وقال الكتاب إنه لا يصح له حديث. قُتل في فتح اصطخر في عهد عثمان. وعنوان المدخل يذكر وفاته سنة 29 للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17465}"
  en: "Ubayd Allah ibn Ma'mar ibn Uthman ibn Amr al-Qurashi al-Taymi. Ibn Abd al-Barr says that whoever claims he was a Companion is mistaken: he saw the Prophet, but the Prophet died while he was young. He transmitted from Umar, Uthman, Talha and other Companions; Urwa ibn al-Zubayr and Muhammad ibn Sirin transmitted from him, and the book notes that no hadith of his is sound. He was killed at the conquest of Istakhr in the time of Uthman. The heading gives 29 AH as the date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17465}"
  es: "Ubayd Allah ibn Ma'mar ibn Uthman ibn Amr al-Qurashi al-Taymi. Ibn Abd al-Barr afirma que quien se declara Compañero está equivocado: vio al Profeta, pero este falleció siendo joven. Transmitió de Umar, Uthman, Talha y otros Compañeros; Urwa ibn al-Zubayr y Muhammad ibn Sirin transmitieron de él, y el libro señala que ningún hadiz suyo es auténtico. Murió en la conquista de Istakhr durante el reinado de Uthman. El encabezado indica el año 29 de la Hégira como fecha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17465}"
  fr: "Ubayd Allah ibn Ma'mar ibn Uthman ibn Amr al-Qurashi al-Taymi. Ibn Abd al-Barr affirme que quiconque prétend qu'il était un Compagnon se trompe: il a vu le Prophète, mais celui-ci est mort alors qu'il était jeune. Il a transmis des hadiths d'Umar, d'Uthman, de Talha et d'autres Compagnons; Urwa ibn al-Zubayr et Muhammad ibn Sirin ont également transmis des hadiths de lui, et l'ouvrage note qu'aucun de ses hadiths n'est authentique. Il a été tué lors de la conquête d'Istakhr, sous le règne d'Uthman. La date indiquée est l'an 29 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17465}"
