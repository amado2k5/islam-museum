summary:
  ar: "عبيد الله بن معمر بن عثمان بن عمرو القرشي التيمي. قال ابن عبد البر إن من زعم أن له صحبة فقد وهم، وإنما له الرؤية، ومات النبي وهو صغير. روى عن عمر وعثمان وطلحة وغيرهم من الصحابة، وروى عنه عروة بن الزبير ومحمد بن سيرين، وقال الكتاب إنه لا يصح له حديث. قُتل في فتح اصطخر في عهد عثمان. وعنوان المدخل يذكر وفاته سنة 29 للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17465}"
  en: "Ubayd Allah ibn Ma'mar ibn Uthman ibn Amr al-Qurashi al-Taymi. Ibn Abd al-Barr says that whoever claims he was a Companion is mistaken: he saw the Prophet, but the Prophet died while he was young. He transmitted from Umar, Uthman, Talha and other Companions; Urwa ibn al-Zubayr and Muhammad ibn Sirin transmitted from him, and the book notes that no hadith of his is sound. He was killed at the conquest of Istakhr in the time of Uthman. The heading gives 29 AH as the date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17465}"
