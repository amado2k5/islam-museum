label: { ar: "البحتري", en: "al-Buhturi", fr: "Al-Buhturi", es: "al-Buhturi", ur: "البطوری" }
summary:
  ar: "أبو عبادة الوليد بن عبيد الشاعر، مدح المتوكل بقصيدته فيما رفع من المحنة أمير المؤمنين لقد شكرنا إلى أيامك الغر الحسان رددت الدين فذا بعدما قد أراه فرقتين تخاصمان وهجا فيها ابن أبي دؤاد، وقال فيه وفي الفتح بن خاقان قصيدة الوفاء بعهدي فقتلا معاً كما استشعر المتوكل {cite:tarikh-khulafa-minhaj-1434 p. 545,549}. وعند المسعودي عن المبرد شعره أحسن استواء من شعر أبي تمام لأنه يقول القصيدة كلها فتكون سليمة من طعن طاعن أو عيب عائب وبه يختم الشعر {cite:muruj-al-dhahab p. 458-459}، وعند المسعودي أنشد المتوكل قصيدته عن أي ثغر تبتسم وبأي طرف تحتكم فعارضه أبو العنبس الصيمري بهجائها فضحك المتوكل حتى استلقى على قفاه وأمر لكل منهما وللمبرد البصري بعشرة آلاف درهم {cite:muruj-al-dhahab p. 478-479}"
  en: "Abu Ubada al-Walid ibn Ubayd, the poet; he praised al-Mutawakkil for lifting the mihna — 'commander of the faithful, we thank you for your bright days: you restored the faith after two factions had disputed it' — lampooning Ibn Abi Du'ad, and composed for him and al-Fath ibn Khaqan the fidelity ode, slain together as the caliph had foreshadowed {cite:tarikh-khulafa-minhaj-1434 p. 545,549}."
  fr: "Abu Ubada al-Walid ibn Ubayd, poète ; il loua al-Mutawakkil pour avoir levé la mihna — « Commandeur des croyants, nous te remercions pour tes jours éclatants : tu as restauré la foi après que deux factions se la furent disputée » — en raillant Ibn Abi Du’ad, et composa pour lui et al-Fath ibn Khaqan l’ode de fidélité ; ils furent tués ensemble, comme le calife l’avait pressenti {cite:tarikh-khulafa-minhaj-1434 p. 545,549}."
  es: "Abu Ubada al-Walid ibn Ubayd, el poeta, alabó a al-Mutawakkil por levantar la mihna —'comandante de los creyentes, te agradecemos tus días brillantes: restauraste la fe después de que dos facciones la disputaran'— satirizando a Ibn Abi Du'ad, y compuso para él y al-Fath ibn Khaqan la oda a la fidelidad, asesinados juntos como el califa había prefigurado {cite:tarikh-khulafa-minhaj-1434 p. 545,549}."
  ur: "ابو عبادہ الولید بن عبید، شاعر؛ اس نے المتوکل کی تعریف کی کہ اس نے مہنا اٹھا لیا - 'وفاداروں کے کمانڈر، ہم آپ کے روشن دنوں کے لیے آپ کا شکریہ ادا کرتے ہیں: آپ نے دو گروہوں کے اختلاف کے بعد ایمان بحال کیا' - ابن ابی داؤد کو چراغاں کرنا، اور اس کے لیے اور الفتح ابن خاقان نے خلیفہ کے طور پر ایک ساتھ مل کر قتل کیے جانے والے وفاداری کی کتاب لکھی۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 545,549}۔"
