summary:
  ar: "أبو عبادة الوليد بن عبيد الشاعر، مدح المتوكل بقصيدته فيما رفع من المحنة أمير المؤمنين لقد شكرنا إلى أيامك الغر الحسان رددت الدين فذا بعدما قد أراه فرقتين تخاصمان وهجا فيها ابن أبي دؤاد، وقال فيه وفي الفتح بن خاقان قصيدة الوفاء بعهدي فقتلا معاً كما استشعر المتوكل {cite:tarikh-khulafa-minhaj-1434 p. 545,549}."
  en: "Abu Ubada al-Walid ibn Ubayd, the poet; he praised al-Mutawakkil for lifting the mihna — 'commander of the faithful, we thank you for your bright days: you restored the faith after two factions had disputed it' — lampooning Ibn Abi Du'ad, and composed for him and al-Fath ibn Khaqan the fidelity ode, slain together as the caliph had foreshadowed {cite:tarikh-khulafa-minhaj-1434 p. 545,549}."
