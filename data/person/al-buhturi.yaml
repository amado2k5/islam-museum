id: person/al-buhturi
class: person
label: { ar: "البحتري" }
summary:
  ar: "أبو عبادة الوليد بن عبيد الشاعر، مدح المتوكل بقصيدته فيما رفع من المحنة أمير المؤمنين لقد شكرنا إلى أيامك الغر الحسان رددت الدين فذا بعدما قد أراه فرقتين تخاصمان وهجا فيها ابن أبي دؤاد، وقال فيه وفي الفتح بن خاقان قصيدة الوفاء بعهدي فقتلا معاً كما استشعر المتوكل {cite:tarikh-khulafa-minhaj-1434 p. 545,549}. وعند المسعودي عن المبرد شعره أحسن استواء من شعر أبي تمام لأنه يقول القصيدة كلها فتكون سليمة من طعن طاعن أو عيب عائب وبه يختم الشعر {cite:muruj-al-dhahab p. 458-459}، وعند المسعودي أنشد المتوكل قصيدته عن أي ثغر تبتسم وبأي طرف تحتكم فعارضه أبو العنبس الصيمري بهجائها فضحك المتوكل حتى استلقى على قفاه وأمر لكل منهما وللمبرد البصري بعشرة آلاف درهم {cite:muruj-al-dhahab p. 478-479}"
  en: "Abu Ubada al-Walid ibn Ubayd, the poet; he praised al-Mutawakkil for lifting the mihna — 'commander of the faithful, we thank you for your bright days: you restored the faith after two factions had disputed it' — lampooning Ibn Abi Du'ad, and composed for him and al-Fath ibn Khaqan the fidelity ode, slain together as the caliph had foreshadowed {cite:tarikh-khulafa-minhaj-1434 p. 545,549}."
