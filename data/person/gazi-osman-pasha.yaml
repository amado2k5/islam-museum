summary:
  ar: "عثمان نوري باشا (1832 – 5 أبريل 1900)، المعروف بغازی عثمان باشا، مشير عثماني من طوقاد، خلّدته قيادته الدفاع عن بلفنة خمسة أشهر في وجه القوات الروسية الرومانية المتفوقة أثناء حرب 1877–1878 حتى اضطر إلى الاستسلام، فمنحه السلطان عبد الحميد الثاني لقب «غازي» ورقّاه مشيرًا، وتولى وزارة الحرب أربع مرات."
  en: "Osman Nuri Pasha (1832 – 5 April 1900), known as Gazi Osman Pasha, was an Ottoman field marshal from Tokat remembered for holding Plevna for five months against superior Russo-Romanian forces in the Russo-Turkish War of 1877–78 before surrendering. Sultan Abdul Hamid II gave him the title Gazi and the rank of field marshal; he later served four times as Minister of War."
  ur: "عثمان نوری پاشا (1832ء – 5 اپریل 1900ء)، جو غازی عثمان پاشا کے نام سے معروف ہیں، طوقاد سے تعلق رکھنے والے عثمانی مشیر تھے؛ 1877–1878ء کی جنگ میں انھوں نے پانچ ماہ تک پلیونہ کا دفاع کیا، سلطان عبدالحمید ثانی نے انھیں «غازی» کا لقب اور مشیر کا عہدہ دیا، اور وہ چار بار وزیرِ جنگ رہے۔"
