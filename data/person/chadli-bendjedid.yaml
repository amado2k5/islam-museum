summary:
  ar: "الشاذلي بن جديد (1929–2012)، ضابط وسياسي جزائري من مقاتلي حرب الاستقلال وعضو مجلس الثورة؛ صار أمينا عاما لجبهة التحرير الوطني ثم ثالث رئيس للجمهورية (1979–1992)، واستقال في يناير 1992 على أبواب الحرب الأهلية، وبقي قيد الإقامة الجبرية حتى سنة 1999."
  en: "Chadli Bendjedid (1929–2012) was an Algerian officer and politician, a combatant of the war of independence and a member of the Revolutionary Council. He became secretary general of the FLN and then third president of the republic (1979–1992), resigned in January 1992 on the eve of the civil war, and remained under house arrest until 1999."
  ur: "شاذلی بن جدید (1929ء–2012ء) جزائری افسر اور سیاست دان تھے، جنگ آزادی کے مجاہد اور مجلسِ ثورہ کے رکن؛ وہ جبهة التحرير الوطني کے سیکرٹری جنرل اور پھر تیسرے صدر (1979ء–1992ء) بنے، جنوری 1992ء میں خانہ جنگی کے دہانے پر مستعفی ہوئے، اور 1999ء تک نظر بند رہے۔"
