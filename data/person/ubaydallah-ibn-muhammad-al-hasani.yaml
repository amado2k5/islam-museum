id: person/ubaydallah-ibn-muhammad-al-hasani
class: person
label:
  ar: "عبيد الله بن محمد الحسني"
  en: "Ubaydallah ibn Muhammad al-Hasani"
  ur: "عبید اللہ بن محمد حسنی"
  es: "Ubaydallah ibn Muhammad al-Hasani"
  fr: "Ubaydallah ibn Muhammad al-Hasani"
summary:
  ar: "والي الهادي بظهر سنة 288هـ، أمره الهادي أن يصرخ في المخلاف ويوجه برجاله إلى شبام، ثم هرب إلى صنعاء حين صاح رجال المدد بالسلاح على درب ظهر."
  en: "Al-Hadi's governor at Zahr in 288 AH, told to raise the call in the district and send his men to Shibam, who fled to Sana'a when the reinforcements shouted for arms at the gate of Zahr."
  ur: "سنہ 288ھ میں ظہر میں ہادی کا والی، جسے ہادی نے علاقے میں پکار لگانے اور اپنے آدمی شبام بھیجنے کا حکم دیا، اور جو اس وقت صنعاء بھاگ گیا جب کمک کے لوگوں نے ظہر کے درب پر ہتھیاروں کی پکار لگائی۔"
  es: "En el año 288 de la Hégira, el gobernador de Al-Hadi en Zahr ordenó que se diera la voz de alarma en el distrito y se enviara a sus hombres a Shibam, quien huyó a Sana'a cuando los refuerzos pidieron armas a gritos en la puerta de Zahr."
  fr: "Le gouverneur d'Al-Hadi à Zahr en 288 AH, a reçu l'ordre de lancer l'appel dans le district et d'envoyer ses hommes à Shibam, qui s'est enfui à Sana'a lorsque les renforts ont crié pour des armes à la porte de Zahr."
  tr: "288 Hicri yılında Dhahr'daki El-Hadi valisi olan El-Hadi, ona Mikhlaf'a bağırmasını ve adamlarını Şibam'a yönlendirmesini emretti, ardından takviye askerlerin silahlarla Dir Dhuhr'a bağırması üzerine Sana'a'ya kaçtı."
  id: "Gubernur Al-Hadi di Dhahr pada tahun 288 H, Al-Hadi memerintahkannya untuk berteriak kepada Mikhlaf dan mengarahkan pasukannya ke Shibam, lalu melarikan diri ke Sana'a ketika pasukan bala bantuan berteriak kepada Dir Dhuhr dengan senjata."
