summary:
  ar: "والي الهادي بظهر سنة 288هـ، أمره الهادي أن يصرخ في المخلاف ويوجه برجاله إلى شبام، ثم هرب إلى صنعاء حين صاح رجال المدد بالسلاح على درب ظهر."
  en: "Al-Hadi's governor at Zahr in 288 AH, told to raise the call in the district and send his men to Shibam, who fled to Sana'a when the reinforcements shouted for arms at the gate of Zahr."
  ur: "سنہ 288ھ میں ظہر میں ہادی کا والی، جسے ہادی نے علاقے میں پکار لگانے اور اپنے آدمی شبام بھیجنے کا حکم دیا، اور جو اس وقت صنعاء بھاگ گیا جب کمک کے لوگوں نے ظہر کے درب پر ہتھیاروں کی پکار لگائی۔"
