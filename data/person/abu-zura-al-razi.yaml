label:
  ar: "أبو زرعة الرازي"
  en: "Abu Zur'a al-Razi"
  fr: "Abu Zur'a al-Razi"
  es: "Abu Zur'a al-Razi"
  ur: "ابو زرعہ الرازی"
roles: [scholar]
gender: male
summary:
  ar: "عبيد الله بن عبد الكريم بن يزيد بن فروخ أبو زرعة الرازي، مولى العباس بن مطرف القرشي، حافظ القرن التاسع شريك ابن أبي حاتم في الجرح والتعديل، توفي سنة أربع وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 136}."
  en: "Ubayd Allah ibn Abd al-Karim Abu Zur'a al-Razi, mawla of al-'Abbas ibn al-Mutarrif al-Qurashi — the ninth-century hadith master of jarh wa-ta'dil, d. 264 {cite:muntazam-ibn-al-jawzi p. 136}."
  fr: "Ubayd Allah ibn Abd al-Karim Abu Zur'a al-Razi, mawla d'al-'Abbas ibn al-Mutarrif al-Qurashi, maître du hadith du IXe siècle spécialisé dans la critique et l'évaluation des transmetteurs, mort en 264 H {cite:muntazam-ibn-al-jawzi p. 136}."
  es: "Ubayd Allah ibn Abd al-Karim Abu Zur'a al-Razi, mawla de al-'Abbas ibn al-Mutarrif al-Qurashi, maestro de hadices del siglo IX de jarh wa-ta'dil, m. 264 {cita: muntazam-ibn-al-jawzi p. 136}."
  ur: "عبید اللہ ابن عبد الکریم ابو زرعہ الرازی، العباس ابن المطرف القرشی کے مولا - جرح و تعدیل کے نویں صدی کے ماہر حدیث، د. 264 {حوالہ:منتظم ابن الجوزی ص۔ 136}۔"
  tr: "Dokuzuncu asrın hafızı, el-Abbas ibn Mutarrif el-Kureyşi'nin azatlı kölesi, İbn Ebî Hatim'in el-Cerh ve't-Ta'dil'deki ortağı Ubeydullah ibn Abd el-Kerim ibn Yezid ibn Farrukh Ebu Zur'ah er-Razi, iki yüz altmış dört yılında vefat etti {alıntı:muntazam-ibn-el-cevzi s. 136}."
  id: "Ubayd Allah ibn Abd al-Karim ibn Yazid ibn Farrukh Abu Zur'ah al-Razi, budak yang dibebaskan dari al-Abbas ibn Mutarrif al-Qurashi, penghafal abad kesembilan, rekan Ibnu Abi Hatim di al-Jarh wa al-Ta'dil, meninggal pada tahun dua ratus enam puluh empat {cite:muntazam-ibn-al-jawzi p. 136}."
