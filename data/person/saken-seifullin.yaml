summary:
  ar: "شاعر وكاتب قازاقي ورجل دولة (1894–1938)، مؤسس الأدب القازاقي الحديث وأول رئيس لاتحاد كتّاب كازاخستان، وترأس مجلس مفوضي الشعب في جمهورية قيرغيزيا ذاتية الحكم. انضم إلى الحزب الشيوعي سنة 1918، وأعدمه جهاز الأمن السوفييتي في ألما آتا سنة 1938 في التطهير الكبير، ورُدّ اعتباره سنة 1957."
  en: "Kazakh poet, writer and statesman (1894–1938), founder of modern Kazakh literature and first head of the Union of Writers of Kazakhstan, who chaired the Council of People's Commissars of the Kirghiz ASSR. He joined the Communist Party in 1918, was executed by the NKVD at Almaty in 1938 in the Great Purge, and was rehabilitated in 1957."
  ur: "قازاق شاعر، ادیب اور سیاست دان (1894–1938)، جدید قازاق ادب کے بانی اور قازاقستان کے ادیبوں کی یونین کے پہلے سربراہ، جنہوں نے قرغیز خودمختار جمہوریہ کے مفوضینِ عوام کی کونسل کی صدارت کی۔ 1918 میں کمیونسٹ پارٹی میں شامل ہوئے، 1938 میں آلماتی میں عظیم تطہیر کے دوران NKVD کے ہاتھوں گولی مار دیے گئے، اور 1957 میں بحالِ حیثیت ہوئے۔"
