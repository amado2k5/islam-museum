summary:
  ar: أكاديمي ومسؤول قطري وُلد سنة 1971. الرئيس المؤسِّس لجامعة حمد بن خليفة، ونائب رئيس مؤسسة قطر للتعليم سابقًا، ومستشار في الديوان الأميري ورئيس مجلس إدارة مدينة الإعلام القطرية.
  en: Qatari academic and official, born 1971. Founding president of Hamad Bin Khalifa University, former vice-president for education of the Qatar Foundation, advisor at the Amiri Diwan and chairman of
    Media City Qatar.
  fr: "Universitaire et haut responsable qatari, né en 1971. Président fondateur de l'université Hamad Bin Khalifa, ancien vice-président chargé de l'éducation de la Qatar Foundation, conseiller au Diwan émiri et président de Media City Qatar."
  ur: قطری ماہر تعلیمات اور عہدہ دار، 1971 میں پیدا ہوئے۔ حمد بن خلیفہ یونیورسٹی کے بانی صدر، قطر فاؤنڈیشن کے سابق نائب صدر برائے تعلیم، امیری دیوان کے مشیر اور میڈیا سٹی قطر کے چیئرمین۔
  es: "Académico y funcionario catarí, nacido en 1971. Presidente fundador de la Universidad Hamad Bin Khalifa, ex vicepresidente de educación de la Fundación Qatar, asesor del Diwan Amiri y presidente de Media City Qatar."
  tr: "1971 doğumlu bir akademisyen ve Katarlı yetkili. Hamad Bin Khalifa Üniversitesi'nin kurucu rektörü, Katar Eğitim Vakfı'nın eski başkan yardımcısı, Emir Divanı danışmanı ve Katar Medya Şehri yönetim kurulu başkanı."
  id: "Seorang akademisi dan pejabat Qatar kelahiran 1971. Presiden pendiri Universitas Hamad Bin Khalifa, mantan wakil presiden Yayasan Pendidikan Qatar, penasihat Amiri Diwan, dan ketua dewan direksi Qatar Media City."
