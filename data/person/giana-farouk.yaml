summary:
  ar: "لاعبة كاراتيه مصرية، وُلدت سنة 1994. بطلة العالم مرتين في كوميتيه 61 كجم (2014 و2016)، وبرونزية أولمبياد طوكيو 2020، وصاحبة ميداليات ذهبية في الألعاب الأفريقية وألعاب التضامن الإسلامي وألعاب البحر المتوسط."
