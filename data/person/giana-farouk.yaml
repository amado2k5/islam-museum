summary:
  ar: "لاعبة كاراتيه مصرية، وُلدت سنة 1994. بطلة العالم مرتين في كوميتيه 61 كجم ⁦(2014 و2016)⁩، وبرونزية أولمبياد طوكيو 2020، وصاحبة ميداليات ذهبية في الألعاب الأفريقية وألعاب التضامن الإسلامي وألعاب البحر المتوسط."
  en: "Egyptian karateka, born in 1994. A two-time world champion in the women's kumite 61 kg event (2014 and 2016), she won bronze at the Tokyo 2020 Olympics and gold medals at the African Games, the Islamic Solidarity Games and the Mediterranean Games."
  ur: "مصری کراٹے کھلاڑی، 1994 میں پیدا ہوئیں۔ خواتین کے کومیتے 61 کلوگرام میں دو بار عالمی چیمپئن ⁦(2014 اور 2016)⁩ رہیں، ٹوکیو 2020 اولمپکس میں کانسی کا تمغہ جیتا، اور افریقی کھیلوں، اسلامی یکجہتی کھیلوں اور بحیرہ روم کھیلوں میں طلائی تمغے حاصل کیے۔"
  es: "Karateka egipcia, nacida en 1994. Dos veces campeona mundial en la modalidad de kumite femenino de 61 kg (2014 y 2016), ganó la medalla de bronce en los Juegos Olímpicos de Tokio 2020 y medallas de oro en los Juegos Africanos, los Juegos de la Solidaridad Islámica y los Juegos Mediterráneos."
  fr: "Karatéka égyptienne, née en 1994. Double championne du monde de kumite féminin dans la catégorie des 61 kg (2014 et 2016), elle a remporté le bronze aux Jeux olympiques de Tokyo 2020 et des médailles d'or aux Jeux africains, aux Jeux de la solidarité islamique et aux Jeux méditerranéens."
  tr: "1994 doğumlu bir Mısırlı karateka. 61 kg kumite yarışında iki kez dünya şampiyonu (2014 ve 2016), Tokyo 2020 Olimpiyatları'nda bronz madalya sahibi ve Afrika Oyunları, İslami Dayanışma Oyunları ile Akdeniz Oyunları'nda altın madalya sahibi."
  id: "Seorang karateka Mesir, lahir tahun 1994. Juara dunia dua kali di kumite 61 kg (2014 dan 2016), peraih medali perunggu di Olimpiade Tokyo 2020, serta peraih medali emas di African Games, Islamic Solidarity Games, dan Mediterranean Games."
