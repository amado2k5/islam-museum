summary:
  ar: عمر بن عبد العزيز بن عمر بن مازة، أبو محمد، حسام الدين، الحنفي، المعروف بالصدر الشهيد، فقيه أصولي من أكابر الحنفية. تفقه على والده برهان الدين الكبير عبد العزيز، وناظر العلماء، ودرّس للفقهاء، وكان الملوك يصدرون عن رأيه، وتوفي شهيدا. من تصانيفه الفتاوى الكبرى، والفتاوى الصغرى، وعمدة المفتي والمستفتي، وشرح أدب القاضي للخصاف، وشرح الجامع الصغير، والواقعات الحسامية. وعنوان المصدر يذكر ⁦(436 - 483 هـ)⁩، والقراءة تحتاج إلى مراجعة صورة الصفحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}
  en: Umar ibn Abd al-Aziz ibn Umar ibn Mazza, Abu Muhammad, Husam al-Din, the Hanafi known as al-Sadr al-Shahid, a jurist and usuli, one of the great Hanafis. He studied with his father Burhan al-Din al-Kabir Abd al-Aziz, debated with scholars and taught jurists; rulers took his opinion, and he died a martyr. His works include al-Fatawa al-Kubra, al-Fatawa al-Saghra, Umdat al-Mufti wa-al-Mustafti, a commentary on the Adab al-Qadi of al-Khassaf, a commentary on the Jami' al-Saghir, and al-Waqi'at al-Hisamiyya. The heading reads 436-483 AH; this reading is to be checked on the page image. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}
  ur: عمر بن عبد العزیز بن عمر بن مازہ، ابو محمد، حسام الدین، حنفی، صدر الشہید کے نام سے مشہور، فقیہ اور اصولی، حنفیہ کے بڑے علماء میں سے۔ انہوں نے اپنے والد برہان الدین الکبیر عبد العزیز سے فقہ پڑھی، علماء سے مناظرہ کیا اور فقہاء کو پڑھایا، اور بادشاہ ان کی رائے پر چلتے تھے۔ تصانیف میں الفتاوی الکبریٰ، الفتاوی الصغریٰ، عمدۃ المفتی والمستفتی، ادب القاضی کی شرح، جامع صغیر کی شرح، اور الواقعات الحسامیہ شامل ہیں۔ عنوان میں ⁦(436 - 483 ہجری)⁩ ہے، اس پڑھت کی صفحے کی تصویر سے تصدیق ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}
  es: "Umar ibn Abd al-Aziz ibn Umar ibn Mazza, Abu Muhammad, Husam al-Din, el hanafí conocido como al-Sadr al-Shahid, jurista y usuli, uno de los grandes hanafíes. Estudió con su padre Burhan al-Din al-Kabir Abd al-Aziz, debatió con eruditos y enseñó a juristas; los gobernantes tuvieron en cuenta su opinión y murió como mártir. Entre sus obras destacan al-Fatawa al-Kubra, al-Fatawa al-Saghra, Umdat al-Mufti wa-al-Mustafti, un comentario sobre el Adab al-Qadi de al-Khassaf, un comentario sobre el Jami' al-Saghir y al-Waqi'at al-Hisamiyya. El encabezado indica 436-483 AH; esta lectura debe verificarse en la imagen de la página. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5501} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}"
  fr: "Umar ibn Abd al-Aziz ibn Umar ibn Mazza, dit Abu Muhammad ou Husam al-Din, juriste et usuli de l'école hanafite, connu sous le nom d'al-Sadr al-Shahid, fut l'un des plus grands hanafites. Il étudia auprès de son père, Burhan al-Din al-Kabir Abd al-Aziz, débattit avec d'autres savants et enseigna aux juristes. Son avis était pris en compte par les souverains, et il mourut en martyr. Parmi ses œuvres figurent al-Fatawa al-Kubra, al-Fatawa al-Saghra, Umdat al-Mufti wa-al-Mustafti, un commentaire de l'Adab al-Qadi d'al-Khassaf, un commentaire du Jami' al-Saghir et al-Waqi'at al-Hisamiyya. La date indiquée est 436-483 AH; cette datation est à vérifier sur l'image de la page. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}"
  tr: "Umar ibn Abd al-Aziz ibn Umar ibn Mazah, Ebu Muhammed, Hüsam al-Din, Hanefi, el-Sadr el-Shahid olarak bilinen, usul ilkeleri üzerine bir hukukçu ve önde gelen Hanefilerden biriydi. Babası Burhan al-Din al-Kabir Abdul Aziz'den fıkıh eğitimi aldı, alimlerle münazara yaptı, hukukçulara ders verdi ve krallar onun görüşünü takip ederdi. Şehit olarak öldü. Eserleri arasında el-Fetawa el-Kubra, el-Fetava el-Sughra, 'Umdat al-Mufti wa al-Mustafti' ve 'Umdat al-Mufti wa al-Mustafti' bulunmaktadır: Sharh Adab al-Qadi, al-Khassaf, Sharh al-Jami' al-Saghir ve al-Maqatiyyah al-Husayyya. Kaynak başlığında (436 - 483 H) bahsediliyor ve okumak için sayfanın görselini gözden geçirmek gerekiyor. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.5501} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.5502}"
  id: "Umar ibn Abd al-Aziz ibn Umar ibn Mazah, Abu Muhammad, Hussam al-Din, seorang Hanafi, yang dikenal sebagai al-Sadr al-Shahid, adalah seorang ahli hukum dengan prinsip usul dan salah satu Hanafi terkemuka. Ia mempelajari hukum di bawah bimbingan ayahnya, Burhan al-Din al-Kabir Abdul Aziz, menjadi pendebat dengan para cendekiawan, mengajar ahli hukum, dan para raja mengikuti pendapatnya. Ia meninggal sebagai martir. Di antara karyanya adalah al-Fatawa al-Kubra, al-Fatawa al-Sughra, 'Umdat al-Mufti wa al-Mustafti,' Sharh Adab al-Qadi oleh al-Khassaf, Sharh al-Jami' al-Saghir, dan al-Maqatiyyah al-Husayyya. Judul sumbernya menyebutkan (436 - 483 H), dan membaca memerlukan tinjauan gambar halaman. {cite::Fiqh-mawsua-kuwaitiyya-noor-v3 p.5501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}"
