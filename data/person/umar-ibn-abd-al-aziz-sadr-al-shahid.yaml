summary:
  ar: عمر بن عبد العزيز بن عمر بن مازة، أبو محمد، حسام الدين، الحنفي، المعروف بالصدر الشهيد، فقيه أصولي من أكابر الحنفية. تفقه على والده برهان الدين الكبير عبد العزيز، وناظر العلماء، ودرّس للفقهاء، وكان الملوك يصدرون عن رأيه، وتوفي شهيدا. من تصانيفه الفتاوى الكبرى، والفتاوى الصغرى، وعمدة المفتي والمستفتي، وشرح أدب القاضي للخصاف، وشرح الجامع الصغير، والواقعات الحسامية. وعنوان المصدر يذكر (436 - 483 هـ)، والقراءة تحتاج إلى مراجعة صورة الصفحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}
  en: Umar ibn Abd al-Aziz ibn Umar ibn Mazza, Abu Muhammad, Husam al-Din, the Hanafi known as al-Sadr al-Shahid, a jurist and usuli, one of the great Hanafis. He studied with his father Burhan al-Din al-Kabir Abd al-Aziz, debated with scholars and taught jurists; rulers took his opinion, and he died a martyr. His works include al-Fatawa al-Kubra, al-Fatawa al-Saghra, Umdat al-Mufti wa-al-Mustafti, a commentary on the Adab al-Qadi of al-Khassaf, a commentary on the Jami' al-Saghir, and al-Waqi'at al-Hisamiyya. The heading reads 436-483 AH; this reading is to be checked on the page image. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}
  ur: عمر بن عبد العزیز بن عمر بن مازہ، ابو محمد، حسام الدین، حنفی، صدر الشہید کے نام سے مشہور، فقیہ اور اصولی، حنفیہ کے بڑے علماء میں سے۔ انہوں نے اپنے والد برہان الدین الکبیر عبد العزیز سے فقہ پڑھی، علماء سے مناظرہ کیا اور فقہاء کو پڑھایا، اور بادشاہ ان کی رائے پر چلتے تھے۔ تصانیف میں الفتاوی الکبریٰ، الفتاوی الصغریٰ، عمدۃ المفتی والمستفتی، ادب القاضی کی شرح، جامع صغیر کی شرح، اور الواقعات الحسامیہ شامل ہیں۔ عنوان میں (436 - 483 ہجری) ہے، اس پڑھت کی صفحے کی تصویر سے تصدیق ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502}
