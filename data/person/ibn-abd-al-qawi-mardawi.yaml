summary:
  ar: "محمد بن عبد القوي بن بدران المرداوي المقدسي، أبو عبد الله، شمس الدين، فقيه حنبلي ولد بمردا من قرى نابلس وتوفي بدمشق، من كتبه منظومة في الفقه طبعت باسم «عقد الفرائد وكنز الفوائد» و«منظومة الآداب»؛ ١٢٣٢ إلى ١٢٩٩م."
  en: "Muhammad ibn Abd al-Qawi ibn Badran al-Mardawi al-Maqdisi, Abu Abd Allah, Shams al-Din, a Hanbali jurist born at Marda, a village of Nablus, who died in Damascus; his verse compendium of the school's rulings was printed as «Aqd al-Fara'id wa Kanz al-Fawa'id». 630 to 699 AH, 1232 to 1299 CE."
