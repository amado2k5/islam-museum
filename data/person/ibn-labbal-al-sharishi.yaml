summary:
  ar: "علي بن أحمد بن علي بن فتح بن لبال، القاضي أبو الحسن الشريشي، شاعر أندلسي أورد الصفدي من شعره في الغزل والشيب والفحم، توفي بشريش سنة 583 هـ بحسب الصفدي."
  en: "Ali ibn Ahmad ibn Ali ibn Fath ibn Labbal, the judge Abu al-Hasan al-Sharishi, an Andalusi poet whose verses on love, old age and charcoal al-Safadi quotes; died in Sharish in 583 AH according to al-Safadi."
  es: "Ali ibn Ahmad ibn Ali ibn Fath ibn Labbal, el juez Abu al-Hasan al-Sharishi, un poeta andalusí cuyos versos sobre el amor, la vejez y el carbón cita al-Safadi; murió en Sharish en el año 583 de la Hégira según al-Safadi."
  fr: "Ali ibn Ahmad ibn Ali ibn Fath ibn Labbal, le juge Abu al-Hasan al-Sharishi, un poète andalou dont les vers sur l'amour, la vieillesse et le charbon sont cités par al-Safadi; est mort à Sharish en 583 AH selon al-Safadi."
  ur: "علی ابن احمد بن علی ابن فتح ابن لبل، جج ابو الحسن الشریشی، اندلس کے ایک شاعر جن کی محبت، بڑھاپے اور چارکول الصفادی کے حوالے سے آیات؛ الصفادی کے مطابق 583ھ میں شرش میں وفات پائی۔"
