label: { ar: "يسار راعي لقاح النبي", en: "Yasar, herdsman of the Prophet's milch-camels", es: "Yasar, herdsman of the Prophet's milch-camels", fr: "Yasar, herdsman of the Prophet's milch-camels", ur: "یسار، نبی کے دودھ والے اونٹوں کا چرواہا" }
names:
