gender: male
summary:
  ar: "عبد أصابه النبي في غزوة محارب وبني ثعلبة فجعله في لقاحه ترعى بناحية الجماء؛ قتله نفر من قيس كبّة من بجيلة كانوا قد استشفوا بألبان اللقاح، فذبحوه وغرزوا الشوك في عينيه، فعاقبهم النبي بقطع الأيدي والأرجل وسمل الأعين."
  en: "A slave the Prophet acquired in the raid on Muharib and Banu Tha'laba and set over his milch-camels grazing near al-Jamma'; a party of Qays Kubba of Bajila who had been cured by the camels' milk slaughtered him and drove thorns into his eyes, and the Prophet punished them with amputation and blinding."
  es: "Un esclavo que el Profeta adquirió en la incursión contra Muharib y Banu Tha'laba y puso a cargo de sus camellas lecheras que pastaban cerca de al-Jamma'; un grupo de Qays Kubba de Bajila que se habían curado con la leche de las camellas lo sacrificaron y le clavaron espinas en los ojos, y el Profeta los castigó con la amputación y la ceguera."
  fr: "Un esclave que le Prophète avait acquis lors du raid contre Muharib et Banu Tha'laba et qu'il avait placé sur ses chamelles laitières qui paissaient près d'al-Jamma'; un groupe de Qays Kubba de Bajila, qui avait été guéri par le lait des chamelles, l'a massacré et lui a enfoncé des épines dans les yeux, et le Prophète les a punis en les amputant et en les rendant aveugles."
  ur: "ایک غلام نبی نے محراب اور بنو ثعلبہ پر چھاپہ مار کر حاصل کیا اور الجماع کے قریب اپنے دودھ دار اونٹوں پر بٹھا دیا۔ بجیلہ کے قیس کُبّا کی ایک جماعت نے جو اونٹنی کے دودھ سے شفا پائی تھی، اسے ذبح کیا اور ان کی آنکھوں میں کانٹے چبھوائے، اور رسول اللہ نے انہیں کاٹ کر اندھا کرنے کی سزا دی۔"
  tr: "Abd, Muharib ve Banu Tha'labah Savaşı sırasında Peygamber tarafından vuruldu, bu yüzden onu Al-Jama'nın yakınında otlattı; Bajilah'tan Qays Kabba'dan bir grup, polen sütüyle tedavi edilen Abd'ı öldürdü, bu yüzden onu katletti ve gözlerine diken sapladı. Peygamber onları cezalandırdı; ellerini ve bacaklarını kesip gözlerini kör etti."
  id: "Abd diserang oleh Nabi selama Pertempuran Muharib dan Banu Tha'labah, sehingga ia merumput di dekat Al-Jama'; sekelompok dari Qays Kabba dari Bajilah membunuhnya, yang telah diberi susu serbuk sari, sehingga mereka membantai dan menusukkan duri ke matanya. Nabi menghukum mereka dengan memotong tangan dan kaki serta membutakan matanya."
