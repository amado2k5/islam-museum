class: person
label: { ar: "أمية بن إسحاق الأموي", en: "Umayya ibn Ishaq" }
summary:
  ar: "أخو الوزير أحمد بن إسحاق الذي قبض عليه عبد الرحمن الناصر فقتله، وكان بمدينة شنترين من ثغور الأندلس فلما نمي إليه قتل أخيه عصى وصار في حيز رذمير ملك الجلالقة فأعانه على المسلمين ودله على عوراتهم، فخرج يتصيد يوماً فغلب غلمانه على المدينة فمنعوه وكتبوا إلى عبد الرحمن، ثم استوزره رذمير وصيره في جملته، ثم استأمن أمية إلى عبد الرحمن فقبله حسن قبول {cite:muruj-al-dhahab p. 359-360}."
  en: "Brother of the Umayyad vizier Ahmad ibn Ishaq whom al-Nasir executed; holding Shantarin he defected to king Rudhmir of the Jalaliqa and guided him against the Muslims, lost his own town to his ghilman, became Rudhmir's minister, then took al-Nasir's aman and was well received {cite:muruj-al-dhahab p. 359-360}."
