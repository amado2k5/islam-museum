summary:
  ar: "فدوى طوقان ⁦(1917–2003)⁩ شاعرة فلسطينية من نابلس، «شاعرة فلسطين»، من أبرز أصوات النضال والنساء في الشعر العربي. من دواوينها «وحدي مع الأيام» و«الليل والفرسان» و«حيرة وعبرة»، وسيرتها «رحلة جبلية، رحلة صعبة»."
  en: "Fadwa Tuqan (1917–2003) was a Palestinian poet from Nablus, called 'the Poet of Palestine', among the foremost voices of struggle and women in Arabic poetry. Her collections include Alone with the Days and The Night and the Horsemen, and her autobiography A Mountainous Journey."
  ur: "فدوا طوقان ⁦(1917–2003)⁩ نابلس کی فلسطینی شاعرہ تھیں، «فلسطین کی شاعرہ» کہلائیں، عربی شاعری میں جدوجہد اور خواتین کی مقدم ترین آوازوں میں۔ مجموعوں میں «وحدي مع الأيام» اور «الليل والفرسان» اور سوانح «رحلة جبلية» شامل ہیں۔"
  es: "Fadwa Tuqan (1917-2003) fue una poeta palestina de Nablus, conocida como «la poeta de Palestina», una de las voces más destacadas de la lucha y de la mujer en la poesía árabe. Entre sus obras se encuentran «A solas con los días» y «La noche y los jinetes», así como su autobiografía «Un viaje a la montaña»."
  fr: "Fadwa Tuqan (1917-2003) était une poétesse palestinienne originaire de Naplouse, surnommée « la Poétesse de Palestine », l'une des voix les plus importantes de la lutte et de la condition féminine dans la poésie arabe. Parmi ses recueils figurent Seule avec les jours et La Nuit et les cavaliers, ainsi que son autobiographie Un voyage en montagne."
  tr: "Fadwa Tuqan (1917–2003), Nabluslu Filistinli bir şairdi; \"Filistin'in Şairi\" olarak bilinir, Arap şiirinde mücadele ve kadınların en önde gelen seslerinden biridir. Koleksiyonları arasında \"Yalnız Günler\", \"Gece ve Şövalyeler\", \"Kafa Karışıklığı ve Ders\" ile otobiyografisi \"Bir Dağ Yolculuğu, Zor Bir Yolculuk\" yer alır."
  id: "Fadwa Tuqan (1917–2003) adalah seorang penyair Palestina dari Nablus, dikenal sebagai \"Penyair Palestina,\" salah satu suara perjuangan dan perempuan paling menonjol dalam puisi Arab. Di antara koleksinya adalah \"Alone with the Days,\" \"The Night and the Knights,\" dan \"Confusion and Lesson,\" serta otobiografinya \"A Mountain Journey, a Difficult Journey.\""
