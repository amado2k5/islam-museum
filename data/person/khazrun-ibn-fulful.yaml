label:
  ar: خزرون بن فلفول المغراوي
  en: Khazrun ibn Fulful al-Maghrawi
  es: "Khazrun ibn Fulful al-Maghrawi"
  fr: "Khazrun ibn Fulful al-Maghrawi"
  ur: "خزرون بن فلفل المغراوی"
summary:
  ar: "خزرون بن فلفول من ملوك مغراوة؛ لما استفحل أمر زناتة بالمغرب وأخذوا بطاعة الحكم المستنصر بالأندلس زحف إلى سجلماسة سنة 366هـ فبرز إليه أبو محمد المعتز بالله أمير بني واسول فهزمه خزرون وقتله واستولى على بلده وذخيرته وبعث برأسه إلى قرطبة مع كتاب الفتح، فانقرضت بذلك دولة بني واسول بسجلماسة."
  en: "Khazrun ibn Fulful of the Maghrawa kings; as Zanata's star rose in the Maghreb in allegiance to al-Hakam al-Mustansir of Cordoba he marched on Sijilmasa in 366 AH — its Wasulid amir Abu Muhammad al-Mu'tazz bi'llah came out to him, was routed and killed, and Khazrun seized the land and its hoard, sending the head to Cordoba with the victory despatch, ending the Wasulid state."
  es: "Khazrun ibn Fulful, de los reyes del Magreb, cuando la estrella de Zanata ascendió en el Magreb en lealtad a al-Hakam al-Mustansir de Córdoba, marchó sobre Sijilmasa en el año 366 de la Hégira. Su emir wasulid, Abu Muhammad al-Mu'tazz bi'llah, salió a su encuentro, fue derrotado y asesinado, y Khazrun se apoderó de la tierra y su tesoro, enviando a su cabeza a Córdoba con el despacho de la victoria, poniendo fin al estado wasulid."
  fr: "Khazrun ibn Fulful, roi du Maghreb, alors que l'étoile de Zanata brillait au Maghreb grâce à son allégeance à al-Hakam al-Mustansir de Cordoue, marcha sur Sijilmasa en 366 AH. Son émir wasulide, Abu Muhammad al-Mu'tazz bi'llah, vint à sa rencontre, fut mis en déroute et tué, et Khazrun s'empara du pays et de son trésor, envoyant le chef à Cordoue avec le message de la victoire, mettant ainsi fin à l'État wasulide."
  ur: "مغروا بادشاہوں میں سے خضرون بن فلفل؛ جیسے ہی زناتا کا ستارہ قرطبہ کے الحکم المستنصر کی بیعت میں مغرب میں طلوع ہوا اس نے 366 ہجری میں سجلماسہ کی طرف کوچ کیا - اس کے وصلی امیر ابو محمد المعتز باللہ اس کے پاس آئے، انہیں شکست دی گئی اور قتل کر دیا گیا، اور خزرون نے زمین پر قبضہ کر لیا اور اس کے سروں کو جمع کر کے فتح کے لیے روانہ کیا۔ وصل کی حالت۔"
  tr: "Hazrun ibn Falful, Mağrava krallarından biriydi; Mağrip'teki Zenata yönetimi güçlendiğinde ve el-Endülüs'te el-Hakam el-Mustansir'e itaat etmeye başladığında, 366 Hicri yılında Sijilmasa'ya yürüdü. Banu Vassul valisi Ebu Muhammed el-Mu'tazz Billah ona göründü. Hazrun onu yendi, öldürdü, şehrini ve kaynaklarını ele geçirdi ve fetih kitabıyla başını Kordoba'ya göndererek Sijilmasa'daki Banu Vassul devletini sona erdirdi."
  id: "Khazrun ibn Falful adalah salah satu raja Maghrawa; ketika kekuasaan Zenata di Maghreb semakin kuat dan mereka mulai taat kepada al-Hakam al-Mustansir di al-Andalus, ia berbaris ke Sijilmasa pada tahun 366 H. Abu Muhammad al-Mu'tazz Billah, gubernur Banu Wassul, muncul kepadanya. Khazrun mengalahkannya, membunuhnya, merebut kota dan sumber dayanya, dan mengirim kepalanya ke Cordoba bersama buku penaklukan, sehingga mengakhiri negara Banu Wassul di Sijilmasa."
