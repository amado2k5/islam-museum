label:
  ar: خزرون بن فلفول المغراوي
  en: Khazrun ibn Fulful al-Maghrawi
summary:
  ar: "خزرون بن فلفول من ملوك مغراوة؛ لما استفحل أمر زناتة بالمغرب وأخذوا بطاعة الحكم المستنصر بالأندلس زحف إلى سجلماسة سنة 366هـ فبرز إليه أبو محمد المعتز بالله أمير بني واسول فهزمه خزرون وقتله واستولى على بلده وذخيرته وبعث برأسه إلى قرطبة مع كتاب الفتح، فانقرضت بذلك دولة بني واسول بسجلماسة."
  en: "Khazrun ibn Fulful of the Maghrawa kings; as Zanata's star rose in the Maghreb in allegiance to al-Hakam al-Mustansir of Cordoba he marched on Sijilmasa in 366 AH — its Wasulid amir Abu Muhammad al-Mu'tazz bi'llah came out to him, was routed and killed, and Khazrun seized the land and its hoard, sending the head to Cordoba with the victory despatch, ending the Wasulid state."
