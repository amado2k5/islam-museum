summary:
  ar: ناشطة وبرلمانية أفغانية وُلدت سنة 1978. أصغر نائبة في برلمان أفغانستان 2005، عُرفت بخطاباتها الجريئة ضد أمراء الحرب والفساد، وطُردت من البرلمان سنة 2007 وواصلت نشاطها من المنفى.
  en: Afghan activist and former parliamentarian, born 1978. The youngest MP elected to Afghanistan's 2005 parliament, known for outspoken speeches against warlords and corruption; expelled from parliament
    in 2007, she continued activism from exile.
  ur: افغان کارکن اور سابقہ پارلیمنٹیرین، 1978 میں پیدا ہوئیں۔ افغانستان کی 2005 کی پارلیمنٹ کی کم ترین رکن، جنرلوں اور بدعنوانی کے خلاف کھلی تقریروں کے لیے مشہور؛ 2007 میں پارلیمنٹ سے نکالی گئیں اور جلاوطنی
    سے سرگرمی جاری رکھی۔
  es: "Activista afgana y exparlamentaria, nacida en 1978. Fue la diputada más joven elegida para el parlamento afgano en 2005, conocida por sus discursos contundentes contra los señores de la guerra y la corrupción; expulsada del parlamento en 2007, continuó su activismo desde el exilio."
  fr: "Militante afghane et ancienne parlementaire, née en 1978. La plus jeune députée élue au parlement afghan de 2005, connue pour ses discours francs contre les seigneurs de guerre et la corruption; expulsée du parlement en 2007, elle a poursuivi son militantisme depuis l'exil."
  tr: "1978 doğumlu bir Afgan aktivist ve parlamenter. 2005'te Afgan parlamentosunun en genç kadın milletvekili, savaş ağalarına ve yolsuzluğa karşı cesur konuşmalarıyla tanınır, 2007'de parlamentodan ihraç edildi ve sürgünden de aktivizmine devam etti."
  id: "Seorang aktivis dan anggota parlemen Afghanistan yang lahir pada tahun 1978. Anggota parlemen perempuan termuda di parlemen Afghanistan pada tahun 2005, dikenal karena pidato-pidato berani menentang panglima perang dan korupsi, dikeluarkan dari parlemen pada tahun 2007, dan melanjutkan aktivismenya dari pengasingan."
