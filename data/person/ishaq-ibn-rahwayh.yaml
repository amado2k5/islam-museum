id: person/ishaq-ibn-rahwayh
class: person
aliases: [person/ishaq-ibn-rahuwayh]
label: { ar: "إسحاق بن راهويه", en: "Ishaq ibn Rahwayh", es: "Ishaq ibn Rahwayh", fr: "Ishaq ibn Rahwayh", ur: "اسحاق بن راہویہ" }
summary:
  ar: "إسحاق بن إبراهيم المعروف بابن راهويه، مات سنة ثمان وثلاثين ومائتين {cite:muruj-al-dhahab p. 512}. وعند ابن النديم هو ابن إبراهيم المروزي من جلة أصحاب أحمد بن حنبل وله كتاب البين في الفقه وكتاب التفسير {cite:fihrist-ibn-al-nadim p. 321}، ويعده أحمد أمين من أئمة الحديث الذين رحلوا إلى الأمصار يجمعون أحاديثها وما رُوي فيها من تفسير، مع سفيان بن عيينة ووكيع بن الجراح وشعبة بن الحجاج {cite:duha-islam p. 491}."
  en: "The Khurasani imam Ibn Rahwayh — dead in 238 {cite:muruj-al-dhahab p. 512}; among the hadith imams who travelled the garrison cities gathering traditions and tafsir {cite:duha-islam p. 491}."
  es: "El imán de Khurasani, Ibn Rahwayh, fallecido en 238 {cite:muruj-al-dhahab p. 512}; entre los imanes de hadices que viajaron por las ciudades guarnición recopilando tradiciones y tafsir {cite:duha-islam p. 491}."
  fr: "L'imam khurasani Ibn Rahwayh — mort en 238 {cite:muruj-al-dhahab p. 512}; parmi les imams du hadith qui ont parcouru les villes de garnison pour recueillir les traditions et le tafsir {cite:duha-islam p. 491}."
  ur: "خراسانی امام ابن راہویہ 238 میں فوت ہوئے 512}; احادیث کے ائمہ میں سے جنہوں نے روایات اور تفسیر کو اکٹھا کرتے ہوئے گیریژن شہروں کا سفر کیا۔ 491}۔"
  tr: "İbn Rahvey olarak bilinen İshaq bin İbrahim, 238 Hicri yılında vefat etmiştir {atıf:muruj-al-dhahab s. 512}. İbn el-Nadim'e göre, Ahmed ibn Hanbal'in önde gelen sahabelerinden biri olan İbrahim el-Mervazi'nin oğludur ve 'El-Beyn fi-el-Fiqh' ile Tafsir kitabını (atıf:Fihrist-ibn-al-Nadim s. 321} yazmıştır. Ahmed Amin, onu Sübyan bin Uyaynah, Waki' ibn al-Jarrah ve Şube ibn al-Haccac ile birlikte bölgelere seyahat eden önde gelen hadis âlimlerinden biri olarak kabul eder {atıf:Duha-İslam, s. 491}."
  id: "Ishaq ibn Ibrahim, yang dikenal sebagai Ibn Rahwayh, meninggal pada tahun 238 H {cite:muruj-al-dhahab hlm. 512}. Menurut Ibn al-Nadim, ia adalah putra Ibrahim al-Marwazi, salah satu sahabat terkemuka Ahmad ibn Hanbal, dan ia menulis buku 'Al-Bayn fi al-Fiqh' serta kitab Tafsir {cite:fihrist-ibn-al-nadim hlm. 321}. Ahmad Amin menganggapnya sebagai salah satu ulama hadis terkemuka yang melakukan perjalanan ke provinsi untuk mengumpulkan hadits mereka dan penafsiran yang diceritakan di dalamnya, bersama Sufyan ibn 'Uyaynah, Waki' ibn al-Jarrah, dan Shu'bah ibn al-Hajjaj {cite:Duha-Islam, hlm. 491}."
