summary:
  ar: "إسحاق بن إبراهيم المعروف بابن راهويه، مات سنة ثمان وثلاثين ومائتين {cite:muruj-al-dhahab p. 512}. وعند ابن النديم هو ابن إبراهيم المروزي من جلة أصحاب أحمد بن حنبل وله كتاب البين في الفقه وكتاب التفسير {cite:fihrist-ibn-al-nadim p. 321}، ويعده أحمد أمين من أئمة الحديث الذين رحلوا إلى الأمصار يجمعون أحاديثها وما رُوي فيها من تفسير، مع سفيان بن عيينة ووكيع بن الجراح وشعبة بن الحجاج {cite:duha-islam p. 491}."
  en: "The Khurasani imam Ibn Rahwayh — dead in 238 {cite:muruj-al-dhahab p. 512}; among the hadith imams who travelled the garrison cities gathering traditions and tafsir {cite:duha-islam p. 491}."
