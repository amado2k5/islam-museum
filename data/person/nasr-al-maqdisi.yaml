summary:
  ar: "نصر بن إبراهيم بن نصر بن إبراهيم بن داود النابلسي المقدسي، أبو الفتح، شيخ الشافعية في عصره بالشام، أصله من نابلس ويعرف بابن أبي حافظ، رحل نحو العشرين وأقام عشر سنين في صور وتسعا في دمشق ولقي فيها الغزالي وتوفي بها سنة 490 هـ الموافقة 1096 م."
  en: "Nasr ibn Ibrahim ibn Nasr ibn Ibrahim ibn Dawud al-Nabulsi al-Maqdisi, Abu al-Fath, called the shaykh of the Shafi'is of Syria in his day; of Nablus origin and known as Ibn Abi Hafiz, he travelled to study in his twenties, lived ten years in Tyre and nine in Damascus, met al-Ghazali there, and died in Damascus in 490 AH (1096 CE)."
