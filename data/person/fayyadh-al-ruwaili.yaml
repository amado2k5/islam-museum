summary:
  ar: "فياض بن حامد بن رقاد الرويلي ⁦(وُلد في 27 نيسان 1958 في محافظة طريف)⁩ ضابط عام في القوات الجوية الملكية السعودية، يشغل رئاسة هيئة الأركان العامة للقوات المسلحة السعودية منذ شباط 2018. قاد القوات الجوية الملكية (2013–2014) وكان نائب رئيس هيئة الأركان العامة (2014–2018) قبل أن يخلف عبد الرحمن البنيان."
  en: "Fayyadh bin Hamed bin Raqed Al Ruwaili (born 27 April 1958 in Turaif) is a Royal Saudi Air Force general who has served as Chairman of the General Staff of the Saudi Arabian Armed Forces since February 2018. He commanded the Royal Saudi Air Force (2013–2014) and was Deputy Chairman of the General Staff (2014–2018) before succeeding Abdulrahman al-Bunyan."
  ur: "فیاض بن حامد بن رقاد الرویلی ⁦(پیدائش 27 اپریل 1958، طريف)⁩ شاہی سعودی فضائیہ کے جنرل ہیں جو فروری 2018 سے سعودی مسلح افواج کے چیئرمین جنرل اسٹاف ہیں۔ وہ شاہی فضائیہ کے کمانڈر (2013–2014) اور نائب چیئرمین جنرل اسٹاف (2014–2018) رہ چکے ہیں۔"
