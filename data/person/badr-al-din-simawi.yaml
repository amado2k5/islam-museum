summary:
  ar: "بدر الدين محمود بن إسرائيل المعروف بابن قاضي سماونة؛ وُلد في قلعة سماونة في بلاد الروم قرب أدرنة في زمن مراد الأول، وكان أبوه قاضيها وأمير عسكرها وفاتحها. روى صاحب الشقائق النعمانية أنه حفظ القرآن ودرس الصرف والنحو ثم ارتحل إلى مصر فقرأ مع السيد الشريف الجرجاني على مباركشاه المنطقي، وقرأ بمكة على الشيخ الزيعلي، وتتلمذ في القاهرة على أكمل الدين البابيري، وأن السلطان المملوكي فرج بن برقوق تتلمذ عليه؛ ثم جذبته الجذبة الإلهية فلازم الشيخ سعيد الأخلاطي بمصر وأرسله إلى تبريز، وسافر بين بدليس ومصر وحلب وقونية حتى أسلم على يديه رئيس جزيرة ساقز، ولما تسلطن موسى بن بايزيد جعله قاضياً لعسكره، فلما قتل أخوه محمدٌ موسى حُبس بدر الدين مع أهله في أزنيق {cite:dawlat-uthmaniyya-salabi p. 74}. يصف الصلابي دعوته في أزنيق بأنها كانت إلى المساواة في الأموال والأديان بلا تفريق بين مسلم وغيره، ويرى المؤلف أنه «مذهب فاسد» يشبه في نظره دعوات لاحقة — وهذا حكم الكاتب على حركته لا وصف محايد {cite:dawlat-uthmaniyya-salabi p. 74-75}. جمع في دلي أورمان ما بين سبعة وثمانية آلاف مقاتل بدعم من أمير الأفلاق، فخرج عليه السلطان محمد الأول بنفسه وجعل مركز قيادته في سيروز، وهُزمت قواته وتوارى ثم اخترقت مخابرات السلطان صفوف أتباعه فوقع في الأسر، ولما سأله السلطان عن اصفرار وجهه قال: «إن الشمس يا مولاي تصفر عندما تقترب من الغروب»، فأقيمت له محكمة شرعية وحكم عليه بالإعدام بفتوى العلماء مستندة إلى حديث شق العصا {cite:dawlat-uthmaniyya-salabi p. 76}."
  en: "Sheikh Badr al-Din Mahmud ibn Isra'il, known as Ibn Qadi Simavna — son of the qadi, commander and conqueror of Simavna castle near Edirne under Murad I. The Shaqa'iq al-Nu'maniyya traced his formation through Cairo — al-Sayyid al-Sharif al-Jurjani, Akmal al-Din al-Babirti, and the Mamluk sultan Faraj ibn Barquq among his pupils — then his Sufi turn under Sheikh Sa'id al-Akhlati, until Musa Çelebi made him qadi 'askar and Mehmed's victory over Musa landed him confined at Iznik {cite:dawlat-uthmaniyya-salabi p. 74}. Al-Sallabi describes his preaching there as a call to equality of wealth and religions — a doctrine the author himself brands 'corrupt', which is the historian's judgment rather than a neutral description {cite:dawlat-uthmaniyya-salabi p. 74-75}. Backed by the prince of Wallachia he raised seven to eight thousand fighters at Deli Orman; Mehmed took the field from Serres, broke his force, and intelligence penetration delivered him prisoner — 'the sun pales, my lord, as it nears setting' — before a shari'a court sentenced him to death on the 'splitting the stick' hadith {cite:dawlat-uthmaniyya-salabi p. 76}."
  es: "Sheikh Badr al-Din Mahmud ibn Isra'il, conocido como Ibn Qadi Simavna, hijo del cadí, comandante y conquistador del castillo de Simavna cerca de Edirne bajo Murad I. El Shaqa'iq al-Nu'maniyya siguió su formación a través de El Cairo: al-Sayyid al-Sharif al-Jurjani, Akmal al-Din al-Babirti y el sultán mameluco Faraj ibn Barquq entre sus alumnos; luego su giro sufí bajo el jeque Sa'id al-Akhlati, hasta que Musa Çelebi lo nombró qadi 'askar y la victoria de Mehmed sobre Musa lo llevó confinado en Iznik {citar:dawlat-uthmaniyya-salabi p. 74}. Al-Sallabi describe su predicación allí como un llamado a la igualdad de riqueza y religiones, una doctrina que el propio autor califica de \"corrupta\", lo cual es el juicio del historiador más que una descripción neutral {cite:dawlat-uthmaniyya-salabi p. 74-75}. Respaldado por el príncipe de Valaquia, reunió entre siete y ocho mil combatientes en Deli Orman; Mehmed tomó el campo de batalla de Serres, rompió su fuerza, y la infiltración de inteligencia lo entregó prisionero —\"el sol palidece, mi señor, al acercarse al ocaso\"— antes de que un tribunal de la sharia lo condenara a muerte por el hadiz de \"partir el palo\" {cite:dawlat-uthmaniyya-salabi p. 76}."
  fr: "Cheikh Badr al-Din Mahmud ibn Isra'il, connu sous le nom d'Ibn Qadi Simavna - fils du cadi, commandant et conquérant du château de Simavna près d'Edirne sous Murad I. Le Shaqa'iq al-Nu'maniyya a retracé sa formation à travers le Caire - al-Sayyid al-Sharif al-Jurjani, Akmal al-Din al-Babirti et le sultan mamelouk Faraj ibn Barquq parmi ses élèves - puis son tour soufi sous Cheikh Sa'id al-Akhlati, jusqu'à ce que Musa Çelebi le fasse cadi 'askar et que la victoire de Mehmed sur Musa le fasse confiner à Iznik {cite: dawlat-uthmaniyya-salabi p. 74}. Al-Sallabi décrit ses sermons comme un appel à l'égalité des richesses et des religions – une doctrine que l'auteur lui-même qualifie de « corrompue », ce qui relève du jugement de l'historien plutôt que d'une description neutre {cite:dawlat-uthmaniyya-salabi p. 74-75}. Soutenu par le prince de Valachie, il leva sept à huit mille combattants à Deli Orman; Mehmed prit le champ de bataille depuis Serrès, brisa ses forces, et les services de renseignement le firent prisonnier – « le soleil pâlit, mon seigneur, à l'approche de son coucher » – avant qu'un tribunal de la charia ne le condamne à mort en vertu du hadith du « bâton fendu » {cite:dawlat-uthmaniyya-salabi p. 76}."
  ur: "شیخ بدر الدین محمود ابن اسرائیل، ابن قادی سماونا کے نام سے جانا جاتا ہے - قادی کا بیٹا، مراد اول کے ماتحت ایڈرن کے قریب سماونا قلعہ کا کمانڈر اور فاتح۔ مملوک سلطان فراج ابن برقوق اپنے شاگردوں میں سے تھا - پھر اس کا صوفی باری شیخ سعید الاخلطی کے ماتحت ہوا، یہاں تک کہ موسیٰ چلبی نے اسے قاضی عسکر بنایا اور محمد کی موسیٰ پر فتح نے اسے ازنک میں قید کر دیا۔ 74}۔ السلبی نے وہاں اپنی تبلیغ کو دولت اور مذاہب کی مساوات کی دعوت کے طور پر بیان کیا ہے - ایک نظریہ جسے مصنف خود 'کرپٹ' قرار دیتا ہے، جو غیر جانبدارانہ وضاحت کے بجائے مورخ کا فیصلہ ہے۔ 74-75}۔ والچیا کے شہزادے کی حمایت سے اس نے ڈیلی اورمان میں سات سے آٹھ ہزار جنگجو کھڑے کیے؛ محمد نے سیریس سے میدان چھین لیا، اس کی طاقت کو توڑ دیا، اور انٹیلی جنس دخول نے اسے قیدی بنا دیا - 'سورج ڈھل جاتا ہے، میرے آقا، جیسے ہی ڈوبنے کے قریب ہے' - اس سے پہلے کہ ایک شرعی عدالت نے اسے 'چھڑی کے ٹکڑے کرنے' حدیث پر موت کی سزا سنائی۔ 76}۔"
  tr: "Badr al-Din Mahmud bin İsra'il, İbn Kaddi Samawna olarak bilinir, Murad I döneminde Romalıların topraklarında, Edirne yakınlarındaki Samawna Kalesi'nde doğdu. Babası kalenin hakimi, komutanı ve fatihiydi. El-Şakaiq el-Numaniyya'nın yazarı, Kur'an'ı ezberlediğini, morfoloji ve dilbilgisi eğitimi aldığını, ardından Mısır'a giderek Seyyid el-Şerif el-Jurcani ile Mubarakşah el-Manki'nin yanında çalıştığını, Mekke'de Şeyh el-Zeyili'den ve Kahire'de Ekmeleddin el-Babiri'nin yanında eğitim gördüğünü anlatmıştır. Memlük Sultanı Faraj bin Barquq onun yanında eğitim aldı. Sonra ilahi cazibe nedeniyle Mısır'da Şeyh Sa'id al-İhlati ile ittifak kurdu ve onu Tebriz'e gönderdi. Bitlis, Mısır, Halep ve Konya arasında seyahat etti, ta ki Saqq adasının reisi olan İslam'ı benimseyene kadar. Musa ibn Bayazid iktidara geldiğinde, onu ordusunun hakimi olarak atadı. Kardeşi Muhammed Musa öldürüldüğünde, Bedreddin ailesiyle birlikte İznik'te hapsedildi {alıntı: Dawlat-Uthmaniyya-Salabi s. 74}. El-Selabi, İznik'teki çağrısını Müslümanlar ile diğerleri arasında ayrım olmaksızın zenginlik ve dinlerde eşitlik çağrısı olarak tanımlar ve yazar bunu kendi görüşüne göre sonraki çağrılara benzeyen \"yozlaşmış bir doktrin\" olarak görür — bu, yazarın hareketine dair yargısıdır, tarafsız bir tanım değildir {alıntı: Dawlat-Uthmaniyya-Salabi s. 74-75}. Dali Orman'da Alavik Prensi'nin desteğiyle yedi ila sekiz bin savaşçı topladı. Sultan I. Mehmed kendisi ona karşı isyan etti ve komuta merkezini Siruz'da kurdu. Kuvvetleri yenildi ve saklandı, ardından Sultan'ın istihbaratı takipçilerine sızdı ve Sultan yakalandı. Sultan ona sarımsı yüzünü sorduğunda, \"Güneş, efendim, gün batımına yaklaşırken sararar.\" dedi. Onun için bir şeriat mahkemesi yapıldı ve alimlerin sopa yarma hadisine dayanan fetvasıyla idama mahkûm edildi {cite:dawlat-uthmaniyya-salabi s. 76}."
  id: "Badr al-Din Mahmoud ibn Isra'il, yang dikenal sebagai Ibn Qadi Samawna, lahir di Benteng Samawna di wilayah Romawi dekat Edirne pada masa Murad I. Ayahnya adalah hakim, komandan, dan penakluk kota tersebut. Penulis Al-Shaqa'iq al-Numaniyya menceritakan bahwa ia menghafal Al-Qur'an dan mempelajari morfologi serta tata bahasa, lalu pergi ke Mesir, di mana ia belajar dengan Sayyid al-Sharif al-Jurjani di bawah Mubarakshah al-Manqi, belajar di Mekah di bawah Sheikh al-Zay'ili, dan belajar di Kairo di bawah Akmal al-Din al-Babiri. Sultan Mamluk Faraj ibn Barquq belajar di bawah bimbingannya. Ia kemudian tertarik pada daya tarik ilahi, sehingga ia bersekutu dengan Sheikh Sa'id al-Ikhlati di Mesir dan mengirimnya ke Tabriz. Ia melakukan perjalanan antara Bitlis, Mesir, Aleppo, dan Konya hingga akhirnya memeluk Islam di bawah arahnya, kepala pulau Saqq. Ketika Musa ibn Bayazid naik tahta, ia mengangkatnya sebagai hakim pasukannya. Ketika saudaranya Muhammad Musa dibunuh, Badr al-Din dipenjara bersama keluarganya di Iznik {cite::Dawlat-Uthmaniyya-Salabi hlm. 74}. Al-Salabi menggambarkan seruannya dalam Iznik sebagai seruan untuk kesetaraan dalam kekayaan dan agama tanpa membedakan antara Muslim dan lainnya, dan penulis menganggapnya sebagai \"doktrin korup\" yang menyerupai panggilan-panggilan selanjutnya menurut pandangannya — ini adalah penilaian penulis terhadap gerakannya, bukan deskripsi netral {cite:dawlat-uthmaniyya-salabi hlm. 74-75}. Ia mengumpulkan antara tujuh hingga delapan ribu pejuang di Dali Orman dengan dukungan Pangeran Alavik. Sultan Mehmed I sendiri memberontak melawannya dan menjadikan pusat komandonya di Siruz. Pasukannya dikalahkan dan disembunyikan, lalu kecerdasan Sultan menembus pengikutnya dan ia ditangkap. Ketika Sultan menanyakan tentang wajahnya yang kekuningan, ia berkata: \"Matahari, tuanku, berubah kuning saat mendekati matahari terbenam.\" Pengadilan Syariah diadakan untuknya dan dijatuhi hukuman mati oleh fatwa para ulama berdasarkan hadits membelah tongkat {cite:dawlat-uthmaniyya-salabi hlm. 76}."
