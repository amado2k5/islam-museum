summary:
  ar: "سياسي غيني (1922–1984) من فرانا، زعيم نقابي قاد الحزب الديمقراطي الغيني إلى استقلال غينيا عن فرنسا سنة 1958 فصار أول رئيس لها (1958–1984) وحكم حكما مطلقا بالحزب الواحد حتى مات في كليفلاند بالولايات المتحدة في 26 مارس 1984 أثناء علاج قلبي. وُلد لعائلة مسلمة من الماندينكا ودرس في المدرسة القرآنية، وهو حفيد حفيد ساموري توري مؤسس إمبراطورية واصولو."
  en: "Guinean politician (1922–1984) from Faranah, a trade-union leader who led the Democratic Party of Guinea to independence from France in 1958 and became Guinea's first president (1958–1984), ruling as a one-party authoritarian until he died in Cleveland, United States, on 26 March 1984 during cardiac treatment. He was born to a Mandinka Muslim family, studied at a Qur'anic school, and was the great-grandson of Samori Ture, founder of the Wassoulou Empire."
  ur: "گنی سیاست دان (1922ء–1984ء)، فرانا سے؛ مزدور رہنما جنھوں نے ڈیموکریٹک پارٹی آف گنی کو 1958ء میں فرانس سے آزادی تک لے جا کر گنی کے پہلے صدر (1958ء–1984ء) بنے اور یک جماعتی آمرانہ حکمرانی کی، حتیٰ کہ 26 مارچ 1984ء کو کلیو لینڈ، امریکہ میں علاجِ قلب کے دوران انتقال ہوا۔ وہ ماندینکا مسلم خاندان میں پیدا ہوئے، قرآنی مدرسے میں پڑھے، اور ساموری تورے کے پرپوتے تھے۔"
