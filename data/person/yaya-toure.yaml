summary:
  ar: "لاعب كرة قدم عاجي معتزل، وُلد في بواكي بساحل العاج سنة 1983. لاعب وسط كان ضمن فريق برشلونة الفائز بستة ألقاب سنة 2009، ثم قاد مانشستر سيتي إلى أول لقب دوري له منذ 44 سنة سنة 2012، ونال جائزة أفضل لاعب أفريقي أربع سنوات متتالية (2011–2014)، وخاض 100 مباراة مع منتخب ساحل العاج وقاده قائدًا إلى لقب كأس أمم أفريقيا 2015. وهو الأخ الأصغر لكولو توريه."
  en: "Ivorian retired footballer, born in Bouaké, Ivory Coast in 1983. A midfielder who was part of the Barcelona side that won six trophies in 2009, then drove Manchester City to their first league title in 44 years in 2012; African Footballer of the Year four years running (2011–2014); he won 100 caps for Ivory Coast and captained them to the 2015 Africa Cup of Nations title. He is the younger brother of Kolo Touré."
  ur: "آئیوریائی ریٹائرڈ فٹبالر، 1983 میں آئیوری کوسٹ کے بواکے میں پیدا ہوئے۔ مڈفیلڈر جو 2009 میں چھ ٹرافیاں جیتنے والی بارسلونا ٹیم کا حصہ تھے، پھر مانچسٹر سٹی کو 2012 میں 44 سال بعد پہلا لیگ خطاب دلایا؛ مسلسل چار سال (2011–2014) افریقہ کے بہترین فٹبالر رہے؛ آئیوری کوسٹ کے لیے 100 میچ کھیلے اور 2015 افریقہ کپ آف نیشنز میں کپتان کی حیثیت سے خطاب جیتا۔ وہ کولو تورے کے چھوٹے بھائی ہیں۔"
  es: "Futbolista marfileño retirado, nacido en Bouaké, Costa de Marfil, en 1983. Centrocampista que formó parte del Barcelona que ganó seis títulos en 2009, y que posteriormente llevó al Manchester City a su primer título de liga en 44 años en 2012; fue elegido Futbolista Africano del Año durante cuatro años consecutivos (2011-2014); disputó 100 partidos con la selección de Costa de Marfil y la capitaneó hacia la conquista de la Copa Africana de Naciones de 2015. Es el hermano menor de Kolo Touré."
  fr: "Ancien footballeur ivoirien, né à Bouaké en Côte d'Ivoire en 1983. Milieu de terrain, il a fait partie de l'équipe du FC Barcelone qui a remporté six trophées en 2009, puis a mené Manchester City à son premier titre de champion d'Angleterre en 44 ans en 2012. Élu Ballon d'Or africain quatre années consécutives (2011-2014), il compte 100 sélections en équipe nationale de Côte d'Ivoire et a été capitaine de cette dernière lors de la victoire à la Coupe d'Afrique des Nations 2015. Il est le frère cadet de Kolo Touré."
  tr: "1983'te Bouaké, Fildişi Sahili'nde doğan emekli bir Fildişi Sahili futbolcu. Orta saha oyuncusu olarak, 2009'da Barcelona'nın altı şampiyonluk kazanan takımının bir parçasıydı, ardından 2012'de Manchester City'yi 44 yıl aradan sonra ilk lig şampiyonluğuna taşıdı, dört yıl üst üste Afrika Maçın Oyuncusu ödülünü kazandı (2011–2014), Fildişi Sahili milli takımıyla 100 maçta oynadı ve takımı 2015 Afrika Uluslar Kupası'na kaptanlık yaptı. Kolo Touré'nin küçük kardeşidir."
  id: "Seorang mantan pesepakbola Pantai Gading, lahir di Bouaké, Pantai Gading, pada tahun 1983. Sebagai gelandang, ia menjadi bagian dari tim Barcelona yang memenangkan enam gelar pada tahun 2009, lalu memimpin Manchester City meraih gelar liga pertama mereka dalam 44 tahun pada tahun 2012, memenangkan penghargaan Pemain Terbaik Afrika selama empat tahun berturut-turut (2011–2014), bermain 100 pertandingan bersama tim nasional Pantai Gading, dan memimpin mereka menjadi kapten Piala Afrika 2015. Ia adalah adik dari Kolo Touré."
