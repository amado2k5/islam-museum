summary:
  ar: "لاعب كرة قدم عاجي معتزل، وُلد في بواكي بساحل العاج سنة 1983. لاعب وسط كان ضمن فريق برشلونة الفائز بستة ألقاب سنة 2009، ثم قاد مانشستر سيتي إلى أول لقب دوري له منذ 44 سنة سنة 2012، ونال جائزة أفضل لاعب أفريقي أربع سنوات متتالية (2011–2014)، وخاض 100 مباراة مع منتخب ساحل العاج وقاده قائدًا إلى لقب كأس أمم أفريقيا 2015. وهو الأخ الأصغر لكولو توريه."
  en: "Ivorian retired footballer, born in Bouaké, Ivory Coast in 1983. A midfielder who was part of the Barcelona side that won six trophies in 2009, then drove Manchester City to their first league title in 44 years in 2012; African Footballer of the Year four years running (2011–2014); he won 100 caps for Ivory Coast and captained them to the 2015 Africa Cup of Nations title. He is the younger brother of Kolo Touré."
  ur: "آئیوریائی ریٹائرڈ فٹبالر، 1983 میں آئیوری کوسٹ کے بواکے میں پیدا ہوئے۔ مڈفیلڈر جو 2009 میں چھ ٹرافیاں جیتنے والی بارسلونا ٹیم کا حصہ تھے، پھر مانچسٹر سٹی کو 2012 میں 44 سال بعد پہلا لیگ خطاب دلایا؛ مسلسل چار سال (2011–2014) افریقہ کے بہترین فٹبالر رہے؛ آئیوری کوسٹ کے لیے 100 میچ کھیلے اور 2015 افریقہ کپ آف نیشنز میں کپتان کی حیثیت سے خطاب جیتا۔ وہ کولو تورے کے چھوٹے بھائی ہیں۔"
