summary:
  ar: "بطاقة أولية لغياث الدين بايسنقر التيموري، حاكم هراة عن أبيه شاهرخ وراعي الخط والنقش فيها، توفي سنة ١٤٣٣م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ghiyath al-Din Baysonqor, the Timurid prince governing Herat under Shah Rukh and famed patron of calligraphy, d. 1433; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Ghiyath al-Din Baysonqor, príncipe timúrida que gobernó Herat bajo el Shah Rukh y famoso mecenas de la caligrafía, fallecido en 1433; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature de Ghiyath al-Din Baysonqor, prince timouride gouvernant Hérat sous Shah Rukh et célèbre mécène de la calligraphie, mort en 1433; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "غیاث الدین بیسنقور کے لیے ڈرافٹ کارڈ، شاہ رخ کے ماتحت ہرات پر حکومت کرنے والے تیموری شہزادے اور خطاطی کے مشہور سرپرست، ڈی۔ 1433; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Herat hükümdarı Ghiyath al-Din Baysangar al-Timurid'in, babası Şehrukh'tan ve orada hat sanatı ve yazıtların hamisi olan ilk kartı 1433 yılında ölmüştür; İslam Devletleri sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal oleh Ghiyath al-Din Baysangar al-Timurid (penguasa Herat), dari ayahnya Shahrukh dan pelindung kaligrafi serta prasasti di sana, meninggal pada tahun 1433 M; ia disebutkan dalam Kamus Negara-Negara Islam dan biografinya belum pernah ditinjau di halaman tersebut."
