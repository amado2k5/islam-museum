summary:
  ar: "مدّاح إيراني من شميرانات في طهران، وُلد سنة 1984، تتلمذ على المدّاح حجت كسري وأسّس هيئة ريحانة النبي سنة 2001 ودار «همدردي» الخيرية سنة 2019، واشتهر بقطعة «من إيرانم وتو عراقي»؛ بلغ حسابه على إنستغرام 615,485 متابعًا في نوفمبر 2026 عند قراءته على المنصة."
  en: "Iranian maddah (eulogist) from Shemiranat, Tehran, born in 1984, who trained under the eulogist Hojjat Kasri, founded the Reyhanat al-Nabi hey'at in 2001 and the Hamdardi charity in 2019, and is known for the piece 'Man Iranam o to Araghi'; his Instagram account counted 615,485 followers in November 2026 when read on the platform."
  ur: "شمیرانات، تہران سے تعلق رکھنے والے ایرانی مداح، جو 1984ء میں پیدا ہوئے، حاج حجت کسری کے شاگرد ہیں اور ہیئت ریحانۃ النبی ⁦(2001ء)⁩ اور خیراتی ادارے «ہمدردی» ⁦(2019ء)⁩ کے بانی ہیں؛ ان کے انسٹاگرام اکاؤنٹ کے فالوور نومبر 2026ء میں پلیٹ فارم پر پڑھنے پر 615,485 تھے۔"
  es: "Orador fúnebre iraní (maddah) de Shemiranat, Teherán, nacido en 1984, que se formó con el orador fúnebre Hojjat Kasri, fundó la organización Reyhanat al-Nabi hey'at en 2001 y la organización benéfica Hamdardi en 2019, y es conocido por la pieza 'Man Iranam o to Araghi'; su cuenta de Instagram contaba con 615.485 seguidores en noviembre de 2026 cuando se consultó en la plataforma."
  fr: "Maddah (orateur funèbre) iranien originaire de Shemiranat, à Téhéran, né en 1984, formé par l'orateur funèbre Hojjat Kasri, a fondé le Reyhanat al-Nabi hey'at en 2001 et l'association caritative Hamdardi en 2019, et est connu pour son œuvre « Man Iranam o to Araghi »; son compte Instagram comptait 615 485 abonnés en novembre 2026, date à laquelle il a été consulté sur la plateforme."
  tr: "1984 doğumlu Tahran'daki Shemiranat'tan İranlı bir övgü yazarı olan Sher, övgücü Hojjat Kasra'nın öğrencisi oldu ve 2001'de Reyhaneh Al-Nabi Derneği'ni, 2019'da ise 'Hamderdi' hayır kurumunu kurdu. 'İran'dan ve Tu Iraqi' adlı eseri ile ünlendi; Instagram hesabı, Kasım 2026'da platformda okuduğunda 615.485 takipçiye ulaştı."
  id: "Seorang elogius Iran dari Shemiranat di Teheran, lahir tahun 1984, ia belajar di bawah pidato Hojjat Kasra dan mendirikan Asosiasi Reyhaneh Al-Nabi pada tahun 2001 serta rumah amal 'Hamderdi' pada tahun 2019. Ia menjadi terkenal lewat tulisan 'From Iran and Tu Iraqi'; akun Instagram-nya mencapai 615.485 pengikut pada November 2026 saat ia membacanya di platform tersebut."
