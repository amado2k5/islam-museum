summary:
  ar: "مدّاح إيراني من شميرانات في طهران، وُلد سنة 1984، تتلمذ على المدّاح حجت كسري وأسّس هيئة ريحانة النبي سنة 2001 ودار «همدردي» الخيرية سنة 2019، واشتهر بقطعة «من إيرانم وتو عراقي»؛ بلغ حسابه على إنستغرام 615,485 متابعًا في نوفمبر 2026 عند قراءته على المنصة."
  en: "Iranian maddah (eulogist) from Shemiranat, Tehran, born in 1984, who trained under the eulogist Hojjat Kasri, founded the Reyhanat al-Nabi hey'at in 2001 and the Hamdardi charity in 2019, and is known for the piece 'Man Iranam o to Araghi'; his Instagram account counted 615,485 followers in November 2026 when read on the platform."
  ur: "شمیرانات، تہران سے تعلق رکھنے والے ایرانی مداح، جو 1984ء میں پیدا ہوئے، حاج حجت کسری کے شاگرد ہیں اور ہیئت ریحانۃ النبی ⁦(2001ء)⁩ اور خیراتی ادارے «ہمدردی» ⁦(2019ء)⁩ کے بانی ہیں؛ ان کے انسٹاگرام اکاؤنٹ کے فالوور نومبر 2026ء میں پلیٹ فارم پر پڑھنے پر 615,485 تھے۔"
