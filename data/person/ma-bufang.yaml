summary:
  ar: "أمير حرب مسلم من الهوي (1903–1975)، ابن ما تشي مؤسس جيش نينغهاي، حكم تشينغهاي (1938–1949) فقاتل التبتيين واليابانيين والشيوعيين، ثم فرّ سنة 1949 إلى مكة فالقاهرة، وصار أول سفير لجمهورية الصين لدى السعودية (1957–1961)، ونال جنسيتها وبقي فيها حتى وفاته في جدة."
  en: "A Hui Muslim warlord (1903–1975), son of Ma Qi, founder of the Ninghai Army, who ruled Qinghai (1938–1949) and fought Tibetans, Japanese and Communists, then fled in 1949 to Mecca and Cairo, became the Republic of China's first ambassador to Saudi Arabia (1957–1961), took Saudi citizenship and remained in the kingdom until his death at Jeddah."
  ur: "ایک ہوئی مسلمان جنگی سردار (1903ء–1975ء)، ننگ ہائی فوج کے بانی ما چی کے بیٹے، جنہوں نے چھنگ ہائی پر حکومت کی (1938ء–1949ء) اور تبتیوں، جاپانیوں اور کمیونسٹوں سے جنگیں لڑیں، پھر 1949ء میں مکہ اور قاہرہ کی طرف فرار ہوئے، سعودی عرب میں جمہوریہ چین کے پہلے سفیر بنے (1957ء–1961ء)، سعودی شہریت حاصل کی اور جدہ میں وفات تک وہیں رہے۔"
