  ur: "الحسن بن علی الجوہری"
roles: [muhaddith]
gender: male
summary:
  ar: "الحسن بن علي بن محمد، أبو محمد الجوهري، محدث قالوا إنه انتهى إليه علو الرواية في الدنيا، شيرازي الأصل بغدادي الإقامة والوفاة، أملى مجالس كثيرة، ٣٦٢؟ إلى ٤٥٤هـ."
  en: "Al-Hasan ibn Ali ibn Muhammad, Abu Muhammad al-Jawhari, a hadith scholar of whom it was said that the height of transmission in the world came to him; of Shirazi origin, he lived and died in Baghdad, dictated many sessions, 362(?) to 454 AH (972 to 1062)."
  es: "Al-Hasan ibn Ali ibn Muhammad, Abu Muhammad al-Jawhari, un erudito de hadices de quien se decía que la cúspide de la transmisión en el mundo llegó a él; de origen shirazi, vivió y murió en Bagdad, dictó muchas sesiones, 362(?) a 454 AH (972 a 1062)."
  fr: "Al-Hasan ibn Ali ibn Muhammad, Abu Muhammad al-Jawhari, un érudit du hadith dont on disait qu'il avait atteint le sommet de la transmission dans le monde; d'origine shirazi, il a vécu et est mort à Bagdad, a dicté de nombreuses sessions, de 362 (?) à 454 AH (972 à 1062)."
  ur: "الحسن بن علی ابن محمد، ابو محمد الجوہری، حدیث کے ایک عالم جن کے بارے میں کہا جاتا ہے کہ دنیا میں نشر و اشاعت کا عروج ان کے پاس آیا؛ شیرازی نژاد، اس نے بغداد میں زندگی گزاری اور وفات پائی، 362 ⁦(؟)⁩ سے 454 ہجری ⁦(972 تا 1062)⁩ تک بہت سی نشستیں لکھیں۔"
