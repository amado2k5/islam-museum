summary:
  ar: "أحمد بن صالح بن أبي الرجال اليمني، صفي الدين، مؤرخ أديب من علماء الزيدية، ولد في الأهنوم سنة 1029 هـ الموافقة 1620 م ونشأ في صنعاء وتوفي بها سنة 1092 هـ الموافقة 1681 م."
  en: "Ahmad ibn Salih ibn Abi al-Rijal al-Yamani, Safi al-Din, a historian and man of letters among the Zaydi scholars, born in al-Ahnum in 1029 AH (1620 CE), raised in Sanaa and died there in 1092 AH (1681 CE)."
  fr: "Ahmad ibn Salih ibn Abi al-Rijal al-Yamani, Safi al-Din, historien et homme de lettres parmi les savants zaydites, né à al-Ahnum en 1029 H (1620 ap. J.-C.), élevé à Sanaa et mort dans cette ville en 1092 H (1681 ap. J.-C.)."
  es: "Ahmad ibn Salih ibn Abi al-Rijal al-Yamani, Safi al-Din, historiador y hombre de letras entre los eruditos zaidíes, nació en al-Ahnum en el año 1029 de la Hégira (1620 d. C.), se crió en Saná y murió allí en el año 1092 de la Hégira (1681 d. C.)."
  ur: "احمد بن صالح ابن ابی الرجال الیمانی، صفی الدین، ایک مورخ اور زیدی علماء میں سے خطیب، الاحنوم میں 1029 ہجری ⁦(1620 عیسوی)⁩ میں پیدا ہوئے، صنعاء میں پرورش پائی اور وہیں 1092 ہجری ⁦(1681 عیسوی)⁩ میں وفات پائی۔"
  tr: "Zeydi âlimlerinden tarihçi ve edebiyatçı Ahmed ibn Salih ibn Abi al-Rijal al-Yamani, Safi al-Din, Hicri 1029 yılında (Miladi 1620) el-Ahnum'da doğmuş, Sana'a'da büyümüş ve Hicri 1092 yılında (Miladi 1681) orada vefat etmiştir."
  id: "Ahmad ibn Salih ibn Abi al-Rijal al-Yamani, Safi al-Din, seorang sejarawan dan tokoh sastra dari kalangan ulama Zaidi, lahir di al-Ahnum pada tahun 1029 H, yang bertepatan dengan tahun 1620 M, dan dibesarkan di Sana'a serta meninggal di sana pada tahun 1092 H, yang bertepatan dengan tahun 1681 M."
