summary:
  ar: "جنرال ورجل دولة تركي، زميل مصطفى كمال أتاتورك في الدراسة العسكرية، ومن أوائل منظّمي المقاومة الوطنية في غرب الأناضول. كان أول سفير لحكومة أنقرة في موسكو ووقّع معاهدة موسكو سنة 1921، ثم شارك في تأسيس أول حزب معارضة في الجمهورية وحُوكم وبُرّئ، وتولى وزارتي الأشغال والنقل، ورئاسة البرلمان سنة 1948، وبقي نائبًا حتى انقلاب 1960."
  en: "Turkish general and politician, a military-college classmate of Mustafa Kemal Atatürk and one of the first organisers of the national resistance in western Anatolia. As the Ankara government's first ambassador to Moscow he signed the Treaty of Moscow in 1921; he later co-founded the Republic's first opposition party, was tried and acquitted, served as Minister of Public Works and of Transport, and was Speaker of the Parliament in 1948, remaining a deputy until the 1960 coup."
  ur: "ترک جنرل اور سیاست دان، مصطفی کمال اتاترک کے عسکری کالج کے ہم جماعت اور مغربی اناطولیہ میں قومی مزاحمت کے ابتدائی منتظمین میں سے ایک۔ انقرہ حکومت کے ماسکو میں پہلے سفیر کی حیثیت سے انہوں نے 1921 میں معاہدۂ ماسکو پر دستخط کیے؛ بعد میں وہ جمہوریہ کی پہلی حزبِ اختلاف کے شریک بانی رہے، مقدمے میں بری ہوئے، وزیرِ تعمیرات و نقل و حمل رہے، 1948 میں پارلیمان کے صدر بنے اور 1960 کی فوجی بغاوت تک رکن رہے۔"
