summary:
  ar: "صحابي خزرجي يكنى أبا خرشة؛ تأخر إسلامه حتى خرج النبي إلى بدر فلحقه في الطريق وأسلم وشهد بدراً وأحداً والخندق والمشاهد كلها، وهو الذي قتل أمية بن خلف يوم بدر، وتزوج حبيبة بنت خارجة بعد أبي بكر، ومات في خلافة عثمان."
  en: "A Khazraji Companion known as Abu Kharasha; his Islam came so late he caught the Prophet on the road to Badr, then witnessed Badr, Uhud, the Trench and every battle. He killed Umayya ibn Khalaf at Badr, married Habiba bint Kharija after Abu Bakr, and died in Uthman's caliphate."
  ur: "خزرجی صحابی ابو خراشہ کہلاتا؛ اس کا اسلام اتنا دیر میں آیا کہ وہ بدر کے راستے میں نبی سے ملا، پھر بدر، احد اور بعد کی مہمات میں شریک رہا۔"
