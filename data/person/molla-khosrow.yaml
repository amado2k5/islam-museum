summary:
  ar: "الملا خسرو محمد بن قراموز الرومي الحنفي الإمام العلامة؛ كان والده رومياً من أمراء الفراسخة تشرف بالإسلام وكان له بنت زوجها من أمير آخر مسمى بخسرو فلما مات كان صاحب الترجمة في حجره فاشتهر بخسرو، وأخذ العلوم عن برهان الدين حيدر الرومي المفتي في البلاد الرومية ثم صار مدرساً بمدينة أدرنة بمدرسة شاه ملك وتقيّد بأدرنة على الملا يوسف بالي بن شمس الدين الفنري وكتب حواشيه على المطول ثم صار قاضياً بالعسكر المنصور ولما جلس السلطان محمد خان على سرير السلطنة ثانياً جعل له كل يوم مائة درهم ولما فتح قسطنطينية جعله قاضياً بها بعد وفاة الملا خضر بك وضم إليه قضاء غلطة وأسكدار وتدريس آيا صوفيا، وكان السلطان محمد يجله كثيراً ويفتخر به ويقول لوزرائه هذا أبو حنيفة زمانه وكان متخشعاً متواضعاً يخدم بنفسه مع ما له من العبيد والخدم وكان مع اشتغاله بالمناصب يكتب كل يوم ورقتين من كتب السلف بخط حسن وآل به الأمر إلى أن صار مفتياً بالتخت السلطاني وعظم أمره وطار ذكره وعمر عدة مساجد بقسطنطينية، ومن مصنفاته حواش على المطول وحواش التلويح وحواش على أول تفسير البيضاوي ومرقاة الوصول في علم الأصول وشرحه والدرر والغرر ورسالة في الولاء ورسالة متعلقة بتفسير سورة الأنعام، توفي بقسطنطينية وحمل إلى برسا فدفن بمدرسته سنة ست وثمانين وثمانمائة {cite:shadharat-dhahab p. 342-343}."
  en: "Molla Khosrow — son of a converted Frankish amir, named for the foster-son who raised him; Mehmed II's qadi of Constantinople and mufti of the imperial throne ('this is the Abu Hanifa of the age'), Ayasofya's teacher, builder of mosques; died at Constantinople 886 and was carried back to be buried in his Bursa madrasa {cite:shadharat-dhahab p. 342-343}."
