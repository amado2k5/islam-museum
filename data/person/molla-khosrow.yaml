summary:
  ar: "فقيه حنفي عثماني (ت 885هـ/1480م) من أصل ورساقي تركماني، اسمه محمد بن فرامرز. أخذ الإجازة ببورصة، ودرّس بأدرنة، وصار قاضياً للعسكر ثم قاضي إسطنبول ومدرّساً بآيا صوفيا، واعتزل إلى بورصة فألّف «درر الحكام في شرح غرر الأحكام»، ثم صار مفتي إسطنبول حتى وفاته. قال عنه السلطان محمد الثاني إنه أبو حنيفة زمانه، وكان كتابه مرجعاً شبه رسمي لقضاة الدولة العثمانية."
  en: "Ottoman Hanafi jurist (d. 885/1480) of Varsak Turkmen origin, named Muhammad ibn Faramurz. Licensed at Bursa, he taught at Edirne, rose to kazasker, qadi of Istanbul and müderris at Hagia Sophia, withdrew to Bursa to write his Dürerü'l-hükkâm, and ended as mufti of Istanbul, the office later known as Shaykh al-Islam. Mehmed II called him 'the Abu Hanifa of our time', and his Dürer served Ottoman judges as a semi-official reference."
  ur: "عثمانی حنفی فقیہ (وفات 885ھ/1480ء)، ورساق ترکمان نژاد، نام محمد بن فرامرز۔ برسا سے اجازہ حاصل کیا، ادرنہ میں تدریس کی، قاضی عسکر بنے، پھر استنبول کے قاضی اور آیا صوفیہ کے مدرس مقرر ہوئے، برسا جا کر اپنی مشہور کتاب «درر الحکام» لکھی اور آخر میں استنبول کے مفتی (شیخ الاسلام) کے عہدے پر وفات پائی۔ سلطان محمد ثانی انہیں اپنے زمانے کے ابو حنیفہ کہتے تھے اور ان کی کتاب عثمانی قضاة کے لیے نیم سرکاری مرجع رہی۔"
