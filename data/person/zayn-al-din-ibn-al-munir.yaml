id: person/zayn-al-din-ibn-al-munir
class: person
label: { ar: "زين الدين بن المنير", en: "Zayn al-Din ibn al-Munir", es: "Zayn al-Din ibn al-Munir", fr: "Zayn al-Din ibn al-Munir", ur: "زین الدین ابن المنیر" }
summary:
  ar: "علي بن محمد بن منصور بن أبي القاسم بن المختار، أبو الحسن زين الدين بن المنير الإسكندري، فقيه مالكي ومحدث، وهو أخو القاضي ناصر الدين بن المنير. قرأ الفقه على أخيه وعلى أبي عمرو بن الحاجب، وولي القضاء بالإسكندرية بعد أخيه، وكان ممن له أهلية الترجيح والاجتهاد في مذهب مالك. من تصانيفه «شرح الجامع الصحيح للبخاري» و«المتواري عن تراجم البخاري» وحواشٍ على شرح ابن البطال. يورد الكتاب في عنوان ترجمته التاريخ 629-695 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6803}"
  en: "Ali ibn Muhammad ibn Mansur ibn Abi al-Qasim, Abu al-Hasan Zayn al-Din ibn al-Munir of Alexandria, a Maliki jurist and hadith scholar, brother of the judge Nasir al-Din ibn al-Munir. He studied law with his brother and with Abu Amr ibn al-Hajib, and after his brother he held the judgeship of Alexandria. He was counted among those qualified to weigh opinions and to exercise independent reasoning within the Maliki school. His works include a commentary on al-Bukhari's Sahih, al-Mutawari on the chapter titles of al-Bukhari, and glosses on Ibn al-Battal's commentary. The book's heading gives the dates 629-695 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6803}"
  es: "Ali ibn Muhammad ibn Mansur ibn Abi al-Qasim, Abu al-Hasan Zayn al-Din ibn al-Munir de Alejandría, jurista malikí y erudito de hadices, hermano del juez Nasir al-Din ibn al-Munir. Estudió derecho con su hermano y con Abu Amr ibn al-Hajib, y tras su muerte, ocupó el cargo de juez en Alejandría. Se le consideraba uno de los pensadores cualificados para sopesar opiniones y ejercer el razonamiento independiente dentro de la escuela malikí. Entre sus obras destacan un comentario sobre el Sahih de al-Bujari, al-Mutawari sobre los títulos de los capítulos de al-Bujari y glosas sobre el comentario de Ibn al-Battal. El título del libro indica las fechas 629-695 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6803}"
  fr: "Ali ibn Muhammad ibn Mansur ibn Abi al-Qasim, dit Abu al-Hasan Zayn al-Din ibn al-Munir d'Alexandrie, juriste malikite et spécialiste du hadith, frère du juge Nasir al-Din ibn al-Munir, étudia le droit auprès de son frère et d'Abu Amr ibn al-Hajib. Après son frère, il occupa la fonction de juge à Alexandrie. Il était considéré comme l'un des juristes qualifiés pour évaluer les opinions et exercer un raisonnement indépendant au sein de l'école malikite. Parmi ses œuvres figurent un commentaire du Sahih d'al-Bukhari, un ouvrage intitulé al-Mutawari sur les titres des chapitres d'al-Bukhari, ainsi que des gloses sur le commentaire d'Ibn al-Battal. L'en-tête du livre indique les dates 629-695 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6803}"
  ur: "علی بن محمد بن منصور ابن ابی القاسم، ابو الحسن زین الدین ابن المنیر سکندریہ، ایک مالکی فقیہ اور حدیث کے اسکالر، جج ناصر الدین ابن المنیر کے بھائی۔ انہوں نے اپنے بھائی اور ابو عمرو بن الحجیب کے ساتھ قانون کی تعلیم حاصل کی اور اپنے بھائی کے بعد اسکندریہ کے جج کے عہدے پر فائز رہے۔ ان کا شمار مالکی مکتب میں رائے کو تولنے اور آزاد استدلال کرنے کے اہل لوگوں میں ہوتا تھا۔ ان کی تصانیف میں البخاری کی صحیح کی تفسیر، البخاری کے باب کے عنوانات پر المطواری، اور ابن الباطل کی تفسیر پر اشعار شامل ہیں۔ کتاب کی سرخی 629-695 ہجری بتاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص6803}"
  tr: "Ali ibn Muhammed ibn Mansur ibn Ebi el-Kasım ibn el-Muhtar, Ebu el-Hasan Zeyn al-Din ibn el-Munir el-İskenderi, Maliki fıkhibi ve hadis âlimiydi ve yargıç Nasir al-Din ibn al-Munir'in kardeşiydi. Kardeşi ve Ebu Amr bin el-Hacib'den fıkıh okudu ve kardeşinden sonra İskenderiye'de yargıç olarak atandı. Maliki okulunda tercih ve ijtihad için yeterli olanlar arasındaydı. Eserleri arasında 'Şerh al-Cami' el-Sahih lil-Buhari', 'al-Mutewari 'an Tarajim al-Buhari' ve İbn al-Battal'ın tefsiri üzerine notlar yer alır. Kitap, biyografisinin başlığında 629-695 Hicri tarihinden bahseder. {atıf:] fiqh-mawsua-kuwaitiyya-noor-v3 s.6803}"
  id: "Ali ibn Muhammad ibn Mansur ibn Abi al-Qasim ibn al-Mukhtar, Abu al-Hasan Zayn al-Din ibn al-Munir al-Iskandari, adalah seorang ahli hukum Maliki dan ulama hadits, serta saudara dari hakim Nasir al-Din ibn al-Munir. Ia mempelajari hukum di bawah bimbingan saudaranya dan Abu Amr ibn al-Hajib, dan diangkat sebagai hakim di Alexandria setelah saudaranya. Ia termasuk di antara mereka yang memenuhi syarat untuk mendapatkan preferensi dan ijtihad di aliran Maliki. Di antara karya-karyanya adalah 'Sharh al-Jami' al-Sahih lil-Bukhari', 'al-Mutawari 'an Tarajim al-Bukhari', dan anotasi atas komentar Ibn al-Battal. Buku ini menyebutkan dalam judul biografinya sejarah tahun 629-695 H. {cite:Fiqh-mawsua-Kuwaitiyya-noor-v3 p.6803}"
