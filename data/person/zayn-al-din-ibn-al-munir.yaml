id: person/zayn-al-din-ibn-al-munir
class: person
label: { ar: "زين الدين بن المنير", en: "Zayn al-Din ibn al-Munir" }
summary:
  ar: "علي بن محمد بن منصور بن أبي القاسم بن المختار، أبو الحسن زين الدين بن المنير الإسكندري، فقيه مالكي ومحدث، وهو أخو القاضي ناصر الدين بن المنير. قرأ الفقه على أخيه وعلى أبي عمرو بن الحاجب، وولي القضاء بالإسكندرية بعد أخيه، وكان ممن له أهلية الترجيح والاجتهاد في مذهب مالك. من تصانيفه «شرح الجامع الصحيح للبخاري» و«المتواري عن تراجم البخاري» وحواشٍ على شرح ابن البطال. يورد الكتاب في عنوان ترجمته التاريخ 629-695 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6803}"
  en: "Ali ibn Muhammad ibn Mansur ibn Abi al-Qasim, Abu al-Hasan Zayn al-Din ibn al-Munir of Alexandria, a Maliki jurist and hadith scholar, brother of the judge Nasir al-Din ibn al-Munir. He studied law with his brother and with Abu Amr ibn al-Hajib, and after his brother he held the judgeship of Alexandria. He was counted among those qualified to weigh opinions and to exercise independent reasoning within the Maliki school. His works include a commentary on al-Bukhari's Sahih, al-Mutawari on the chapter titles of al-Bukhari, and glosses on Ibn al-Battal's commentary. The book's heading gives the dates 629-695 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6803}"
