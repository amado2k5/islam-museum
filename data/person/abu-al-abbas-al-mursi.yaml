label: { ar: "أبو العباس المرسي" }
summary:
  ar: "أحمد بن عمر بن محمد أبو العباس الأنصاري المرسي، من أكابر الأولياء صحب الشيخ أبا الحسن الشاذلي وخلفه بعده؛ قدم من الأندلس من مرسية واستقر بالإسكندرية فكان قبره مشهوراً بإجابة الدعوات وقد زاره المقري مراراً، ولأهل مصر ولأهل الثغر فيه عقيدة كبيرة؛ عرّف به ابن عطاء الله في لطائف المنن في مناقب الشيخ سيدي أبي العباس وشيخه سيدي أبي الحسن؛ وكان يكرم الناس على نحو رتبهم عند الله حتى إنه ربما دخل عليه مطيع فلا يحتفل به وربما دخل عليه عاص فأكرمه لأن الطائع أتى متكثراً بعمله والعاصي أتى بكسر معصيته، وكان شديد الكراهة للوسواس في الصلاة والطهارة وقال العلم هو الذي ينطبع في القلب كالبياض في الأبيض والسواد في الأسود، وله كلام بديع في تفسير القرآن منه في إياك نعبد وإياك نستعين: إياك نعبد شريعة وإياك نستعين حقيقة، إياك نعبد فرق وإياك نستعين جمع؛ توفي بالإسكندرية سنة ست وثمانين وستمائة {cite:nafh-tib-maqqari p. 190-191}."
  en: "Ahmad Abu al-Abbas al-Mursi, the Murcian Ansari who succeeded al-Shadhili at Alexandria — his tomb famed for answered prayers and honoured in Ibn Ata Allah's Lataif al-Minan; he honoured people by their rank with God, welcomed the broken sinner over the self-admiring obedient, and left terse Qur'an glosses; died at Alexandria in 686 {cite:nafh-tib-maqqari p. 190-191}."
