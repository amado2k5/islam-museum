label: { ar: "أبو العباس المرسي", en: "Abu al-Abbas al-Mursi", fr: "Abu al-Abbas al-Mursi", es: "Abu al-Abbas al-Mursi", ur: "ابو العباس المرسی" }
summary:
  ar: "أحمد بن عمر بن محمد أبو العباس الأنصاري المرسي، من أكابر الأولياء صحب الشيخ أبا الحسن الشاذلي وخلفه بعده؛ قدم من الأندلس من مرسية واستقر بالإسكندرية فكان قبره مشهوراً بإجابة الدعوات وقد زاره المقري مراراً، ولأهل مصر ولأهل الثغر فيه عقيدة كبيرة؛ عرّف به ابن عطاء الله في لطائف المنن في مناقب الشيخ سيدي أبي العباس وشيخه سيدي أبي الحسن؛ وكان يكرم الناس على نحو رتبهم عند الله حتى إنه ربما دخل عليه مطيع فلا يحتفل به وربما دخل عليه عاص فأكرمه لأن الطائع أتى متكثراً بعمله والعاصي أتى بكسر معصيته، وكان شديد الكراهة للوسواس في الصلاة والطهارة وقال العلم هو الذي ينطبع في القلب كالبياض في الأبيض والسواد في الأسود، وله كلام بديع في تفسير القرآن منه في إياك نعبد وإياك نستعين: إياك نعبد شريعة وإياك نستعين حقيقة، إياك نعبد فرق وإياك نستعين جمع؛ توفي بالإسكندرية سنة ست وثمانين وستمائة {cite:nafh-tib-maqqari p. 190-191}."
  en: "Ahmad Abu al-Abbas al-Mursi, the Murcian Ansari who succeeded al-Shadhili at Alexandria — his tomb famed for answered prayers and honoured in Ibn Ata Allah's Lataif al-Minan; he honoured people by their rank with God, welcomed the broken sinner over the self-admiring obedient, and left terse Qur'an glosses; died at Alexandria in 686 {cite:nafh-tib-maqqari p. 190-191}."
  fr: "Ahmad Abu al-Abbas al-Mursi, l'Ansarite de Murcie qui succéda à al-Shadhili à Alexandrie — son tombeau, réputé pour les prières exaucées, est honoré dans les Lata'if al-Minan d'Ibn Ata Allah ; il honorait les gens selon leur rang auprès de Dieu, accueillait le pécheur contrit plutôt que l'obéissant satisfait de lui-même, et laissa de brèves gloses sur le Coran ; mort à Alexandrie en 686 {cite:nafh-tib-maqqari p. 190-191}."
  es: "Ahmad Abu al-Abbas al-Mursi, el Ansari murciano que sucedió a al-Shadhili en Alejandría —su tumba es famosa por las oraciones respondidas y es honrado en el Lataif al-Minan de Ibn Ata Allah—; honraba a las personas según su rango ante Dios, acogía al pecador abatido por encima del obediente egocéntrico y dejó breves glosas del Corán; murió en Alejandría en 686 {cite:nafh-tib-maqqari p. 190-191}."
  ur: "احمد ابو العباس المرسی، مرسیان انصاری جو اسکندریہ میں الشہدلی کا جانشین ہوا - اس کا مقبرہ دعاؤں کے جواب کے لیے مشہور ہے اور ابن عطاء اللہ کے لطیف المنان میں اس کی تعظیم ہے۔ اس نے لوگوں کو خدا کے ہاں ان کے درجات سے نوازا، خود تعریف کرنے والے فرمانبردار پر ٹوٹے ہوئے گنہگار کو خوش آمدید کہا، اور قرآنی ٹیکے چھوڑے؛ 686 میں اسکندریہ میں وفات پائی۔ 190-191}۔"
  tr: "En büyük evliyalardan biri olan Ahmed ibn Ömer ibn Muhammed Ebu el-Abbas el-Ensari el-Mursi, Şeyh Ebu el-Hasan el-Şazili'ye eşlik etmiş ve onun yerine geçmiştir. Endülüs'ten, Murcia'dan gelmiş ve İskenderiye'ye yerleşmiştir. Kabrisi, kabul edilen dualarıyla meşhurdu ve el-Makkari onu birçok kez ziyaret etmiştir. Mısır halkı ve sınır bölgesindeki insanlar ona büyük bir inanç beslerler. İbn Ata Allah onu “Latā’if al-Minan fī Manāqib al-Sheikh Sidi Abu al-Abbas wa Shaykhihi Sidi Abu al-Hasan” adlı eserinde tanıtmıştır. İnsanlara Allah katındaki derecelerine göre saygı gösterirdi; öyle ki bazen dindar bir kişi yanına girerdi ve ona hiç dikkat etmezdi, bazen de günahkar bir kişi yanına girerdi ve ona saygı gösterirdi; çünkü dindar kişi iyi amelleriyle övünerek gelirken, günahkar kişi günahını çiğneyerek gelirdi. Namaz ve arınmada saplantılı düşüncelere çok karşıydı ve şöyle buyurmuştur: \"İlgi, kalbe beyaz üzerine beyaz, siyah üzerine siyah gibi işlenmiştir.\" Kur'an tefsirinde, \"Yalnız sana ibadet ederiz, yalnız senden yardım dileriz\" ayeti de dahil olmak üzere, harika bir sözü vardır: \"Yalnız sana ibadet ederiz, kanun budur, yalnız senden yardım dileriz, hakikat budur. Yalnız sana ibadet ederiz, ayrılık budur, yalnız senden yardım dileriz, birlik budur.\" Hicri 686 yılında İskenderiye'de vefat etmiştir. {Kaynak: Nafh-tib-makqari, s. 190-191}"
  id: "Ahmad ibn Umar ibn Muhammad Abu al-Abbas al-Ansari al-Mursi, salah satu wali terbesar, mendampingi Syekh Abu al-Hasan al-Shadhili dan menggantikannya. Beliau berasal dari Andalusia, tepatnya Murcia, dan menetap di Alexandria. Makamnya terkenal karena doa-doanya dikabulkan, dan al-Maqqari sering mengunjunginya. Masyarakat Mesir dan masyarakat di wilayah perbatasan sangat mempercayainya. Ibnu Ata Allah memperkenalkannya dalam “Latā’if al-Minan fī Manāqib al-Sheikh Sidi Abu al-Abbas wa Shaykhihi Sidi Abu al-Hasan.” Beliau biasa menghormati orang sesuai dengan kedudukan mereka di sisi Allah, bahkan terkadang orang saleh datang menemuinya dan beliau tidak memperhatikannya, dan terkadang orang berdosa datang menemuinya dan beliau menghormatinya karena orang saleh datang dengan membual tentang amal baiknya dan orang berdosa datang untuk menebus dosanya. Beliau sangat menentang pikiran obsesif dalam doa dan penyucian, dan berkata: Ilmu adalah apa yang terukir di hati seperti putih di atas putih dan hitam di atas hitam. Beliau memiliki sebuah ucapan yang indah dalam penafsiran Al-Qur'an, termasuk dalam \"Hanya kepada-Mu kami menyembah dan hanya kepada-Mu kami memohon pertolongan\": \"Hanya kepada-Mu kami menyembah hukum dan hanya kepada-Mu kami memohon pertolongan adalah kenyataan. Hanya kepada-Mu kami menyembah adalah pemisahan dan hanya kepada-Mu kami memohon pertolongan adalah persatuan.\" Beliau wafat di Alexandria pada tahun 686 H {cite:nafh-tib-maqqari p. 190-191}."
