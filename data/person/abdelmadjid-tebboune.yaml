summary:
  ar: "سياسي جزائري، رئيس الجمهورية الجزائرية ووزير الدفاع منذ 19 ديسمبر 2019. وُلد في المشرية سنة 1945، وكان رئيسا للحكومة بين مايو وأغسطس 2017 ووزيرا للسكن لفترتين، ثم فاز في انتخابات ديسمبر 2019 الرئاسية وخلف الرئيس المؤقت عبد القادر بن صالح."
  en: "Algerian politician, president of Algeria and minister of national defence since 19 December 2019. Born at Mécheria in 1945, he was prime minister from May to August 2017 and twice minister of housing before winning the December 2019 presidential election and succeeding the acting president Abdelkader Bensalah."
  ur: "الجزائر کے سیاست دان، 19 دسمبر 2019 سے الجزائر کے صدر اور وزیر دفاع۔ وہ 1945 میں مشریہ میں پیدا ہوئے، مئی سے اگست 2017 تک وزیر اعظم اور دو بار وزیر ہاؤسنگ رہے، پھر دسمبر 2019 کے صدارتی انتخاب میں کامیاب ہو کر قائم مقام صدر عبد القادر بن صالح کے جانشین بنے۔"
