summary:
  ar: "روائي وكاتب مسرحي وسينمائي بنغلاديشي (1948–2012)، من أشهر كتّاب اللغة البنغالية في القرن العشرين. وُلد في نيتروكونا، ونال الدكتوراه في كيمياء البوليمرات ودرّس الكيمياء في جامعة دكا، وانطلقت شهرته بروايته الأولى «نونديتو نوروكي» سنة 1972، وكتب أكثر من مئتي كتاب تصدرت مبيعات معرض الكتاب، وأخرج ثمانية أفلام من رواياته، ونال جائزة الأكاديمية البنغالية الأدبية سنة 1981 ووسام إكوشي باداك سنة 1994."
  en: "Bangladeshi novelist, dramatist and filmmaker (1948–2012), among the most popular Bengali-language writers of the twentieth century. Born in Netrokona, he took a PhD in polymer chemistry and taught chemistry at the University of Dhaka. His breakthrough was his debut novel Nondito Noroke in 1972; he wrote over 200 books that topped the Ekushey Book Fair sales, directed eight films from his own novels, and received the Bangla Academy Literary Award in 1981 and the Ekushey Padak in 1994."
  ur: "بنگلہ دیشی ناول نگار، ڈراما نویس اور فلم ساز (1948ء–2012ء)، بیسویں صدی کے مقبول ترین بنگالی ادیبوں میں سے ایک۔ نیٹروکونا میں پیدا ہوئے، پولیمر کیمسٹری میں پی ایچ ڈی کی اور جامعہ ڈھاکہ میں کیمسٹری پڑھائی۔ ان کی شہرت کا آغاز 1972 میں پہلے ناول «نوندیتو نوروکے» سے ہوا؛ انھوں نے دو سو سے زائد کتابیں لکھیں جو کتاب میلے کی سب سے زیادہ بکنے والی کتابیں رہیں، اپنے ناولوں پر آٹھ فلمیں بنائیں، اور 1981 میں بنگلہ اکیڈمی ادبی ایوارڈ اور 1994 میں اکوشے پادک پایا۔"
