class: person
label: { ar: "الوليد بن معاوية بن عبد الملك", en: "al-Walid ibn Mu'awiya", fr: "al-Walid ibn Mu'awiya", es: "al-Walid ibn Mu'awiya", ur: "ولید بن معاویہ" }
summary:
  ar: "كان على دمشق لمروان بن محمد، كتب إليه يأمره بالقبض على إبراهيم الإمام بقرية الكرار والحميمة فأخذه جالساً في مسجد القرية ملففاً فحمله إليه، ثم حاصره عبد الله بن علي بدمشق في خمسين ألف مقاتل فوقعت بينهم العصبية اليمانية النزارية فقتل {cite:muruj-al-dhahab p. 230-232}."
  en: "Marwan's man on Damascus — he seized the Imam Ibrahim in al-Humayma's mosque; besieged by 'Abd Allah ibn 'Ali with fifty thousand he died in the Yaman-Nizar riot {cite:muruj-al-dhahab p. 230-232}."
  fr: "L'homme de Marwan sur Damas - il a saisi l'Imam Ibrahim dans la mosquée al-Humayma ; assiégé par 'Abd Allah ibn 'Ali avec cinquante mille il est mort dans l'émeute Yaman-Nizar {cite:muruj-al-dhahab p. 230-232}."
  es: "El hombre de Marwan en Damasco: capturó al Imam Ibrahim en la mezquita de al-Humayma; asediado por 'Abd Allah ibn 'Ali con cincuenta mil hombres, murió en el motín de Yaman-Nizar {cite:muruj-al-dhahab p. 230-232}."
  ur: "دمشق پر مروان کا آدمی - اس نے مسجد الحمیمہ میں امام ابراہیم کو پکڑ لیا۔ عبد اللہ بن علی نے پچاس ہزار کے ساتھ محاصرہ کیا اور یمن و نزار کے فساد میں وفات پائی۔ 230-232}۔"
  tr: "Şam'da Mervan bin Muhammed'in yönetimindeydi; Muhammed, İbrahim el-İmam'ın El-Karrar ve El-Hümayme köylerinde tutuklanmasını emrettiği bir mektup gönderdi. Onu köy camiyetinde otururken sardı, sardı ve yanına getirdi. Sonra Abdullah ibn Ali, Şam'da elli bin savaşçıyla onu kuşattı, bu da Nizari Yemen fanatizmi arasında çatışmaya yol açtı ve öldürüldü {atıf:Muruj-al-Dhahab, s. 230-232}."
  id: "Ia berada di Damaskus di bawah Marwan ibn Muhammad, yang menulis surat kepadanya memerintahkan penangkapan Ibrahim al-Imam di desa Al-Karrar dan Al-Humaymah. Ia membawanya duduk di masjid desa, membungkusnya, dan membawanya kepadanya. Kemudian Abdullah ibn Ali mengepungnya di Damaskus bersama lima puluh ribu pejuang, yang menyebabkan konflik di antara mereka di antara fanatisme Nizari Yaman, dan ia dibunuh {cite:muruj-al-dhahab, hlm. 230-232}."
