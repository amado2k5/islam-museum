id: person/al-wathiq-ibrahim-cairo
class: person
label: { ar: "الواثق بالله إبراهيم بن المستمسك" }
summary:
  ar: "ادعى الخلافة بالقاهرة [٧٤٠–٧٤١هـ]، ابن ولي العهد المستمسك محمد بن الحاكم، عهد إليه جده ظناً أنه يصلح للخلافة فرآه غير صالح لها لما هو فيه من الانهماك في اللعب ومعاشرة الأراذل فعدل عنه وعهد إلى ابنه المستكفي، وكان إبراهيم هو السبب في الوقيعة بين المستكفي والسلطان لما كان يحمله إليه من النميمة به، فلما مات المستكفي بقوص بايعه السلطان وكان العامة يلقبونه المستعطي بالله، وقال ابن فضل الله ما نشأ إلا في تهتك ولا دان إلا بعدم تنسك وذكر من أفعاله غوي اللعب بالحمام ومشترى الكباش للنطاح والديوك للنقار والمنافسة في المعز الزرائبية حتى كان عرضه عرضة للهوان، فلما حضرت السلطان الوفاة ندم وعزله وبايع ولي عهد المستكفي {cite:tarikh-khulafa-minhaj-1434 p. 739-741}."
  en: "Pretender-caliph at Cairo [740–741]; passed over by his grandfather for profligacy, he sowed the sultan's breach with al-Mustakfi and was hailed on his death — the commons calling him 'al-Musta'ti'. Ibn Fadl Allah's portrait: ram-butting rams, fighting cocks, long-eared goats, unpaid goods — 'the caliphate's name stepped down from the minbars'. The dying sultan repented and deposed him {cite:tarikh-khulafa-minhaj-1434 p. 739-741}."
