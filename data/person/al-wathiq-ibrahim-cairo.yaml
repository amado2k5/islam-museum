id: person/al-wathiq-ibrahim-cairo
class: person
label: { ar: "الواثق بالله إبراهيم بن المستمسك", en: "al-Wathiq bi-Llah Ibrahim ibn al-Mustamsik", fr: "al-Wathiq bi-Llah Ibrahim ibn al-Mustamsik", es: "al-Wathiq bi-Llah Ibrahim ibn al-Mustamsik", ur: "الوثیق باللہ ابراہیم بن المستمسک" }
summary:
  ar: "ادعى الخلافة بالقاهرة [٧٤٠–٧٤١هـ]، ابن ولي العهد المستمسك محمد بن الحاكم، عهد إليه جده ظناً أنه يصلح للخلافة فرآه غير صالح لها لما هو فيه من الانهماك في اللعب ومعاشرة الأراذل فعدل عنه وعهد إلى ابنه المستكفي، وكان إبراهيم هو السبب في الوقيعة بين المستكفي والسلطان لما كان يحمله إليه من النميمة به، فلما مات المستكفي بقوص بايعه السلطان وكان العامة يلقبونه المستعطي بالله، وقال ابن فضل الله ما نشأ إلا في تهتك ولا دان إلا بعدم تنسك وذكر من أفعاله غوي اللعب بالحمام ومشترى الكباش للنطاح والديوك للنقار والمنافسة في المعز الزرائبية حتى كان عرضه عرضة للهوان، فلما حضرت السلطان الوفاة ندم وعزله وبايع ولي عهد المستكفي {cite:tarikh-khulafa-minhaj-1434 p. 739-741}."
  en: "Pretender-caliph at Cairo [740–741]; passed over by his grandfather for profligacy, he sowed the sultan's breach with al-Mustakfi and was hailed on his death — the commons calling him 'al-Musta'ti'. Ibn Fadl Allah's portrait: ram-butting rams, fighting cocks, long-eared goats, unpaid goods — 'the caliphate's name stepped down from the minbars'. The dying sultan repented and deposed him {cite:tarikh-khulafa-minhaj-1434 p. 739-741}."
  fr: "Prétendant-calife au Caire [740-741]  ; passé par son grand-père pour prodigalité, il sema la rupture du sultan avec al-Mustakfi et fut salué à sa mort – les communs l’appelant « al-Musta’ti  ». Le portrait d’Ibn Fadl Allah  : béliers, coqs de combat, chèvres à longues oreilles, marchandises impayées – « le nom du califat est descendu des minbars  ». Le sultan mourant se repentit et le déposa {cite:tarikh-khulafa-minhaj-1434 p. 739-741}."
  es: "Califa pretendiente en El Cairo [740–741]; rechazado por su abuelo debido a su derroche, sembró la discordia del sultán con al-Mustakfi y fue aclamado a su muerte; el pueblo lo llamaba «al-Musta'ti». El retrato de Ibn Fadl Allah: carneros embistiendo, gallos de pelea, cabras de orejas largas, bienes impagados: «el nombre del califato descendió de los minbars». El sultán moribundo se arrepintió y lo depuso {cite:tarikh-khulafa-minhaj-1434 p. 739-741}."
  ur: "قاہرہ میں پیشوا-خلیفہ [740-741]؛ اس کے دادا نے بے حیائی کی وجہ سے اس کا انتقال کیا، اس نے المستکفی کے ساتھ سلطان کی خلاف ورزی کا بیج بویا اور اس کی موت پر ان کا خیرمقدم کیا گیا۔ ابن فضل اللہ کا پورٹریٹ: مینڈھے بٹانے والے مینڈھے، لڑنے والے مرغ، لمبے کان والے بکرے، بلا معاوضہ سامان - 'خلافت کا نام منبروں سے اتر گیا'۔ مرنے والے سلطان نے توبہ کی اور اسے معزول کر دیا {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 739-741}۔"
  tr: "Kahire'de [740–741 H) halifeliği talep etti; kendisi veliaht prens el-Mustakfi Muhammed bin el-Hakim'in oğluydu. Dedesi ona halifeliği emanet etti, halifeliğe uygun olduğuna inandı, ancak oyun oynadığı ve alçaklarla ilişki kurduğu için onu uygun görmediği için fikrini değiştirdi ve işi oğlu el-Mustakfi'ye emanet etti. İbrahim, kendisine karşı yaptığı dedikodular nedeniyle el-Mustakfi ile sultan arasındaki ayrılığın sebebiydi. El-Mustakfi Kus'ta öldüğünde sultan ona bağlılık yemini etti ve halk ona Tanrı tarafından el-Musta'ati dedi. İbn Fadlallah, onun sadece utanç içinde büyüdüğünü söyledi Sadece dindarlığı nedeniyle mahkum edildi ve eylemleri arasında güvercinlerle oynamak, koç için koç ve horoz almak ve Zarabiyyah keçilerinde yarışmak vardı; ta ki onuru itibarını zedeleyene kadar. Ölüm yaklaştığında, Sultan pişman oldu ve onu görevden aldı, veliaht prens el-Mustakfi'ye bağlılık yemini etti {cite:Tarikh-khulafa-minhaj-1434, s. 739-741}."
  id: "Ia mengklaim kekhalifahan di Kairo [740–741 H], putra putra putra mahkota al-Mustakfi Muhammad ibn al-Hakim. Kakeknya mempercayakan kekhalifahan kepadanya, percaya bahwa ia layak untuk kekhalifahan, tetapi ia menganggapnya tidak layak karena keterlibatannya bermain dan bergaul dengan para penjahat, sehingga ia berubah pikiran dan mempercayakannya kepada putranya al-Mustakfi. Ibrahim menjadi penyebab perpecahan antara al-Mustakfi dan sultan karena gosip yang ia bawa terhadapnya. Ketika al-Mustakfi meninggal di Qus, sultan bersumpah setia kepadanya, dan rakyat biasa memanggilnya al-Musta'ati oleh Tuhan. Ibn Fadlallah mengatakan ia hanya tumbuh dalam keadaan aib Ia hanya dihukum karena kurangnya kesalehan, dan tindakannya termasuk bermain dengan merpati, membeli domba jantan untuk ditandingi dan ayam jantan untuk, serta bersaing dalam kambing Zarabiyyah sampai kehormatannya tercemar. Ketika kematian mendekat, Sultan menyesali dan memecatnya, bersumpah setia kepada putra mahkota al-Mustakfi {cite:Tarikh-khulafa-minhaj-1434, hlm. 739-741}."
