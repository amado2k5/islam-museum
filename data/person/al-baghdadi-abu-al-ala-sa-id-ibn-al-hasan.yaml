  id: "Seorang ahli bahasa Baghdadi yang asal-usulnya dapat ditelusuri kembali ke tanah Rabi'ah di Mosul. Ia meriwayatkan hadits di Timur atas otoritas Al-Sirafi dan Al-Farisi, dan meninggal pada tahun 417 H (1026 M)."
