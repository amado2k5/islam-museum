summary:
  ar: "اقتصادية نيجيرية أمريكية وُلدت في أوغواشي أوكوو سنة 1954. عملت في البنك الدولي خمسة وعشرين عاما حتى صارت مديرا إداريا للعمليات، وتولت وزارة مالية نيجيريا مرتين وفاوضت على إلغاء قسم كبير من ديونها لدى نادي باريس، ثم صارت سنة 2021 أول امرأة وأول أفريقية تقود منظمة التجارة العالمية."
  en: "Nigerian-American economist born in Ogwashi-Uku in 1954. She spent twenty-five years at the World Bank, rising to Managing Director for Operations, served twice as Nigeria's finance minister and negotiated the Paris Club deal that wiped out much of Nigeria's debt, and in 2021 became the first woman and the first African to lead the World Trade Organization."
  ur: "نائجریائی نژاد امریکی ماہرِ معاشیات، 1954 میں اوگواشی اوکو میں پیدا ہوئیں۔ انھوں نے عالمی بینک میں پچیس برس گزارے اور مینیجنگ ڈائریکٹر آپریشنز بنیں، دو بار نائجریا کی وزیرِ خزانہ رہیں اور پیرس کلب سے قرضوں کی بڑی معافی کی بات چیت کی، اور 2021 میں عالمی تجارتی تنظیم کی سربراہ بننے والی پہلی خاتون اور پہلی افریقی بنیں۔"
