summary:
  ar: "محمد بن إبراهيم بن زياد، أبو عبد الله الإسكندراني مولى قيس، الفقيه المالكي المعروف بابن المواز، صاحب تصانيف في الفقه على مذهب مالك؛ تفقه بالإسكندرية بابن الماجشون وابن عبد الحكم واعتمد على أصبغ، وقدم دمشق مع أحمد بن طولون سنة 269 هـ وتوفي بها في السنة نفسها بحسب ابن يونس، وفي رواية الشيرازي سنة 281 هـ {cite:tarikh-dimashq-ibn-asakir-fikr-1995 vol. 51 pp. 197-198}."
  en: "Muhammad ibn Ibrahim ibn Ziyad, Abu Abd Allah al-Iskandarani, a client of Qays and the Maliki jurist known as Ibn al-Mawwaz, who wrote works of law on Malik's school; he studied in Alexandria under Ibn al-Majishun and Ibn Abd al-Hakam and relied on Asbagh, came to Damascus with Ahmad ibn Tulun in 269 AH and died there that year according to Ibn Yunus, while al-Shirazi gives 281 AH {cite:tarikh-dimashq-ibn-asakir-fikr-1995 vol. 51 pp. 197-198}."
