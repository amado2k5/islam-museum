summary:
  ar: "البطريق صاحب قلعة حلب في «فتوح الشام» المنسوب إلى الواقدي: ورث حلب عن أبيه، ورفض نصيحة أخيه الراهب يوحنا بمصالحة المسلمين، وقتل من أهل حلب من صالحوهم ثم قتل أخاه حين أعلن إسلامه، ثم أسلم بعد فتح القلعة وقال إنه رأى النبي في منامه فاستيقظ يتكلم العربية، وصار يقاتل مع المسلمين، ومنه حيلته على حصن عزاز {cite:futuh-al-sham-ilmiyya-1997-v1 p.237} {cite:futuh-al-sham-ilmiyya-1997-v1 p.245} {cite:futuh-al-sham-ilmiyya-1997-v1 p.264} {cite:futuh-al-sham-ilmiyya-1997-v1 p.267}."
  en: "The patrician lord of the citadel of Aleppo in the Futuh al-Sham ascribed to al-Waqidi: he inherited Aleppo from his father, rejected his monk brother Yuhanna's advice to make terms with the Muslims, killed those townspeople who had made peace with them and then his brother when he declared himself a Muslim, then embraced Islam after the citadel fell, saying he had seen the Prophet in a dream and woken speaking Arabic, and fought on the Muslim side, as in his stratagem against the fortress of Azaz."
  es: "El señor patricio de la ciudadela de Alepo, según el Futuh al-Sham atribuido a al-Waqidi: heredó Alepo de su padre, rechazó el consejo de su hermano monje Yuhanna de llegar a un acuerdo con los musulmanes, mató a los habitantes de la ciudad que habían hecho las paces con ellos y luego a su hermano cuando este se declaró musulmán, y después abrazó el Islam tras la caída de la ciudadela, diciendo que había visto al Profeta en un sueño y que al despertar hablaba árabe, y luchó del lado musulmán, como en su estratagema contra la fortaleza de Azaz."
  fr: "Le seigneur patricien de la citadelle d'Alep dans le Futuh al-Sham attribué à al-Waqidi: il hérita d'Alep de son père, rejeta le conseil de son frère moine Yuhanna de faire la paix avec les musulmans, tua les habitants qui avaient fait la paix avec eux, puis son frère lorsqu'il se déclara musulman, puis embrassa l'islam après la chute de la citadelle, disant qu'il avait vu le Prophète en rêve et s'était réveillé en parlant arabe, et combattit du côté musulman, comme dans sa stratégie contre la forteresse d'Azaz."
  ur: "فتوح الشام میں حلب کے قلعہ کے سرپرست نے الواقدی کی طرف منسوب کیا: اس نے حلب کو اپنے والد سے وراثت میں حاصل کیا، اپنے راہب بھائی یوحنا کے مسلمانوں کے ساتھ صلح کرنے کے مشورے کو رد کر دیا، ان بستیوں کے لوگوں کو قتل کر دیا جنہوں نے ان سے صلح کی تھی اور پھر اس کے بھائی نے جب خود کو مسلمان قرار دیا، پھر خواب میں دیکھا کہ اسلام قبول کر لیا، اور یہ کہتے ہوئے کہ اس نے اسلام قبول کیا۔ عربی بولتے ہوئے بیدار ہوا، اور مسلمانوں کی طرف سے لڑا، جیسا کہ عزاز کے قلعے کے خلاف اس کی حکمت عملی میں تھا۔"
