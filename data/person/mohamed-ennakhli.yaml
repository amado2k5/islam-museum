summary:
  ar: "عالم زيتوني ومصلح تونسي (1869–1924)، وُلد بالقيروان ودرّس بجامع الزيتونة نحو خمسة وثلاثين عامًا، وكان من تلامذته محمد الطاهر بن عاشور وعبد الحميد بن باديس. كان من أبرز أصوات تيار الإصلاح المتأثر بمحمد عبده في تونس، ودرّس بالخلدونية وشارك في مجلس إصلاح التعليم بالمدرسة الصادقية سنة 1906، ودعا طوال حياته إلى التوفيق بين العلم والدين؛ ولم يطبع في حياته سوى نشرية قصيرة في حياة اللغة العربية، وبقيت دراساته الكثيرة مخطوطة."
  en: "Tunisian Zaytuna scholar and reformer (1869–1924), born at Kairouan, who taught at the Zaytuna for some thirty-five years and counted Mohamed Tahar Ben Achour and Abdelhamid Ben Badis among his students. A leading voice of the reform current inspired by Muhammad Abduh in Tunisia, he also taught at the Khaldounia, sat on the Sadiki College improvement council set up in 1906, and argued throughout his life for reconciling science and religion; the only work printed in his lifetime was a short treatise on the life of the Arabic language, while his many studies remained in manuscript."
  ur: "تونسی زیتونہ عالم اور مصلح (1869–1924)، جو قیروان میں پیدا ہوئے اور تقریباً پینتیس سال جامع زیتونہ میں تدریس کی؛ ان کے شاگردوں میں محمد طاہر بن عاشور اور عبدالحمید بن بادس شامل تھے۔ وہ تونس میں محمد عبدہ سے متاثر اصلاحی تحریک کی نمایاں آواز تھے، خلدونیہ میں بھی پڑھایا، 1906ء میں قائم صادقی کالج کی اصلاحی کونسل کے رکن رہے، اور عمر بھر علم و دین کے امتزاج کی دعوت دی؛ ان کی زندگی میں صرف عربی زبان پر ایک مختصر رسالہ چھپا، جبکہ ان کی بیشتر تصانیف مخطوطات ہی رہیں۔"
