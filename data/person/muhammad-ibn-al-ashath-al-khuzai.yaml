summary:
  ar: "محمد بن الأشعث الخزاعي؛ ولّاه أبو العباس إفريقية فرمّ مدينة القيروان ومسجدها ثم عزله المنصور وولّى مكانه عمر بن حفص هزارمرد."
  en: "Muhammad ibn al-Ash'ath al-Khuza'i; Abu al-Abbas gave him Ifriqiya — he repaired Qayrawan's city and mosque — then al-Mansur dismissed him and put Umar ibn Hafs Hazarmard in his place."
  es: "Muhammad ibn al-Ash'ath al-Khuza'i; Abu al-Abbas le otorgó Ifriqiya —reparó la ciudad y la mezquita de Qayrawan— luego al-Mansur lo destituyó y puso a Umar ibn Hafs Hazarmard en su lugar."
  fr: "Muhammad ibn al-Ash'ath al-Khuza'i; Abu al-Abbas lui confia l'Ifriqiya — il répara la ville et la mosquée de Qayrawan — puis al-Mansur le congédia et mit Umar ibn Hafs Hazarmard à sa place."
  ur: "محمد بن اشعث الخزاعی؛ ابو العباس نے اسے عفریقیہ دیا - اس نے قیراوان کے شہر اور مسجد کی مرمت کی - پھر المنصور نے اسے برطرف کردیا اور عمر بن حفص حجرمرد کو اس کی جگہ پر رکھ دیا۔"
