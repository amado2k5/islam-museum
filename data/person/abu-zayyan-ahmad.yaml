summary:
  ar: "حاكم تلمسان الزياني؛ تولى الحكم بدعم من العثمانيين غير أنه — في وصف الصلابي — خضع لمؤامرات خارجية وتقرب من الأسبان، فكرهه الأهالي وقرروا خلعه ومبايعة أخيه الحسن، فتوجه إلى وهران طالباً دعم الأسبان مقدماً تعهدات بولائه لهم، فجهز حاكم وهران جيشاً انضم إليه الخاضعون للأسبان من بني عامر وفليتة وبني راشد بقيادة المنصور بن بو غنام، لكن حسن بن خير الدين قاد الجيش الإسلامي في تلمسان ومنعهم من إعادته {cite:dawlat-uthmaniyya-salabi p. 230}."
  en: "The Zayyanid ruler of Tlemcen; raised to power with Ottoman support but — in al-Salabi's telling — drawn by foreign intrigue toward the Spanish, so the people resolved to depose him for his brother al-Hasan. He sought Oran's help, pledging loyalty; the governor sent an army joined by the Spanish-subject tribes under al-Mansur b. Bu Ghannam, but Hasan b. Khayr al-Din barred his restoration {cite:dawlat-uthmaniyya-salabi p. 230}."
  fr: "Souverain zianide de Tlemcen, porté au pouvoir avec le soutien ottoman mais, selon al-Salabi, rapproché des Espagnols par des intrigues étrangères, si bien que la population résolut de le déposer au profit de son frère al-Hasan. Il sollicita l'aide d'Oran en promettant fidélité ; le gouverneur envoya une armée, rejointe par les tribus soumises aux Espagnols sous al-Mansur b. Bu Ghannam, mais Hasan b. Khayr al-Din empêcha son rétablissement {cite:dawlat-uthmaniyya-salabi p. 230}."
  es: "El gobernante zayyaní de Tremecén, ascendido al poder con el apoyo otomano pero —según al-Salabi— atraído por intrigas extranjeras hacia los españoles, decidió entonces deponerlo y nombrar a su hermano al-Hasan. Buscó la ayuda de Orán, jurando lealtad; el gobernador envió un ejército al que se unieron las tribus sometidas a los españoles bajo el mando de al-Mansur b. Bu Ghannam, pero Hasan b. Khayr al-Din impidió su restauración {cite:dawlat-uthmaniyya-salabi p. 230}."
  ur: "Tlemcen کے زیانی حکمران؛ عثمانی حمایت کے ساتھ اقتدار پر براجمان ہوئے لیکن - السلابی کے کہنے میں - ہسپانویوں کی طرف غیر ملکی سازشوں کی وجہ سے کھینچا گیا، لہذا لوگوں نے اسے اپنے بھائی الحسن کے لیے معزول کرنے کا عزم کیا۔ اس نے وفاداری کا عہد کرتے ہوئے اوران سے مدد مانگی۔ گورنر نے ایک فوج بھیجی جس میں ہسپانوی تابعی قبائل المنصور بن کے ماتحت تھے۔ بو غنم لیکن حسن بی۔ خیرالدین نے اپنی بحالی سے روک دیا {حوالہ:دولت عثمانیہ سلبی ص۔ 230}۔"
  tr: "Tlemcen'in Zeyyanili hükümdarı Osmanlıların desteğiyle iktidara geldi, ancak el-Sallabi'ye göre yabancı komplolara kapıldı ve İspanyollarla yakınlaştı. Yerliler ondan nefret etti ve onu devirip kardeşi el-Hasan'a biat etmeye karar verdiler. İspanyolların desteğini aramak ve onlara bağlılık yemini etmek için Oran'a gitti. Oran hükümdarı, el-Mansur ibn Bu Ghannam önderliğinde, İspanyollara bağlı Banu Amir, Falita ve Banu Raşid kabilelerinden gelenlerin de katıldığı bir ordu hazırladı. Ancak Hasan ibn Hayr el-Din, Tlemcen'deki İslam ordusuna liderlik ederek onu geri getirmelerini engelledi. {cite:dawlat-uthmaniyya-salabi s. 230}"
  id: "Penguasa Zayyanid di Tlemcen merebut kekuasaan dengan dukungan Ottoman, tetapi menurut al-Sallabi, ia terjerumus ke dalam konspirasi asing dan menjadi dekat dengan Spanyol. Penduduk setempat membencinya dan memutuskan untuk menggulingkannya dan berjanji setia kepada saudaranya, al-Hasan. Ia pergi ke Oran untuk mencari dukungan Spanyol, menawarkan janji kesetiaan kepada mereka. Penguasa Oran mempersiapkan pasukan, yang kemudian bergabung dengan mereka yang tunduk kepada Spanyol dari Banu Amir, Falita, dan Banu Rashid, di bawah kepemimpinan al-Mansur ibn Bu Ghannam. Namun, Hassan ibn Khayr al-Din memimpin pasukan Islam di Tlemcen dan mencegah mereka membawanya kembali. {cite:dawlat-uthmaniyya-salabi p. 230}"
