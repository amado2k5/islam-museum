summary:
  ar: "حاكم تلمسان الزياني؛ تولى الحكم بدعم من العثمانيين غير أنه — في وصف الصلابي — خضع لمؤامرات خارجية وتقرب من الأسبان، فكرهه الأهالي وقرروا خلعه ومبايعة أخيه الحسن، فتوجه إلى وهران طالباً دعم الأسبان مقدماً تعهدات بولائه لهم، فجهز حاكم وهران جيشاً انضم إليه الخاضعون للأسبان من بني عامر وفليتة وبني راشد بقيادة المنصور بن بو غنام، لكن حسن بن خير الدين قاد الجيش الإسلامي في تلمسان ومنعهم من إعادته {cite:dawlat-uthmaniyya-salabi p. 230}."
  en: "The Zayyanid ruler of Tlemcen; raised to power with Ottoman support but — in al-Salabi's telling — drawn by foreign intrigue toward the Spanish, so the people resolved to depose him for his brother al-Hasan. He sought Oran's help, pledging loyalty; the governor sent an army joined by the Spanish-subject tribes under al-Mansur b. Bu Ghannam, but Hasan b. Khayr al-Din barred his restoration {cite:dawlat-uthmaniyya-salabi p. 230}."
