label:
  ar: أوكداي بن جنكزخان
  en: Ogedei ibn Genghis Khan
summary:
  ar: "أوكداي بن جنكزخان؛ جعله أبوه ولي عهده وجلس على التخت بعده فولى الخانات العظماء، وانتقل إلى وطن جنكزخان القديم بين الخطا والأيقور وهو تركستان وكاشغر وفيه مدينة قراقوم وبها كان كرسيه ومكانه بين أعمال ولده مكان المركز من الدائرة، وبعث العساكر إلى بلاد الروم مع أمير من أمراء المغل فملكها من يد بني قليج أرسلان، وولى بعده منكوفان بن طولي."
  en: "Ogedei ibn Genghis Khan; his father made him heir and he sat on the throne as Great Khan, removing to Genghis's old homeland between Khita and the Uyghur lands where Qaraqorum held his seat at the centre of the circle of his sons' dominions — he dispatched armies to the land of Rum with a Mongol amir who took it from the Qilij Arslanids, and Monke ibn Tolui succeeded him."
