summary:
  ar: "عبد الفتاح أبو غدة ⁦(1917–1997)⁩ فقيه حنفي ومحدّث سوري من حلب، استقر في الرياض، من أشهر محققي التراث الحنفي والحديثي. من كتبه «قيمة الزمن عند العلماء» و«الرسول المعلم» و«صفحات من صبر العلماء»، وتحقيقاته لمتون حنفية."
  en: "Abd al-Fattah Abu Ghuddah (1917–1997) was a Syrian Hanafi jurist and hadith scholar from Aleppo who settled in Riyadh, among the most famous editors of Hanafi and hadith heritage. His books include Qimat al-Zaman 'ind al-'Ulama' (The Value of Time for Scholars), Al-Rasul al-Mu'allim and Safahat min Sabr al-'Ulama', plus editions of Hanafi texts."
  ur: "عبدالفتاح ابوغدہ ⁦(1917–1997)⁩ حلب کے شامی حنفی فقیہ اور محدث تھے جو ریاض میں مقیم ہوئے، حنفی و حدیثی تراث کے مشہور ترین محققین میں۔ کتب میں «قيمة الزمن عند العلماء»، «الرسول المعلم» اور «صفحات من صبر العلماء» اور حنفی متون کی تحقیقات شامل ہیں۔"
