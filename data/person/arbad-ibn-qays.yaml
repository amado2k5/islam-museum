summary:
  en: "A leader of Banu Amir, maternal half-brother of the poet Labid, who circled behind the Prophet and half-drew his sword during the 9 AH delegation; the tradition says his hand was stayed, and lightning struck him dead on the way home."
  ar: "من رؤساء بني عامر وأخو الشاعر لبيد لأمه؛ دار خلف النبي واخترط سيفه شبراً في وفد سنة 9هـ فحبس الله يده كما تروي السيرة، وأصابته صاعقة في رجوعه فأحرقته."
  es: "Un líder de Banu Amir, hermanastro materno del poeta Labid, que rodeó al Profeta y desenvainó a medias su espada durante la delegación del año 9 de la Hégira; la tradición dice que su mano quedó detenida y que un rayo lo fulminó de camino a casa."
  fr: "Un chef des Banu Amir, demi-frère maternel du poète Labid, qui se tenait derrière le Prophète et dégaina à moitié son épée lors de la délégation de l'an 9 de l'Hégire; la tradition raconte que sa main fut immobilisée et qu'il fut frappé par la foudre sur le chemin du retour."
  ur: "بنو عامر کا ایک سردار، شاعر لبید کا سوتیلا بھائی، جس نے نبی کے پیچھے چکر لگایا اور 9 ہجری کے وفد کے دوران اپنی تلوار نصف کھینچ لی۔ روایت کہتی ہے کہ اس کا ہاتھ رکا ہوا تھا، اور گھر جاتے ہوئے اسے بجلی نے مارا۔"
