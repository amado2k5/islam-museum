summary:
  ar: "قائد مخزني مغربي (1860–1918) من أسرة الكلاوي بتلوات في الأطلس الكبير؛ عيّنه الحسن الأول خليفة على أقاليم الجنوب، وقاد صعود عبد الحفيظ إلى العرش سنة 1907، فصار الصدر الأعظم (1908–1911) قبل أن يُقال بضغط فرنسي، وهو الذي أسس نفوذ أسرته في المغرب."
  en: "Moroccan Makhzen caid (1860–1918) of the Glaoui family of Telouet in the High Atlas. Appointed khalifa over the southern provinces by Hassan I, he led Abdelhafid's rise to the throne in 1907 and became Grand Vizier (1908–1911) before being dismissed under French pressure; he established his family's power in Morocco."
  ur: "مراکشی مخزن قائد (1860–1918) جو اطلسِ کبیر کے تلوات کے الکلاوی خاندان سے تھے؛ حسن اول نے انہیں جنوبی صوبوں پر خلیفہ مقرر کیا، انہوں نے 1907 میں عبد الحفیظ کے عروج کی قیادت کی اور صدرِ اعظم (1908–1911) بنے، پھر فرانسیسی دباؤ پر برطرف ہوئے؛ مراکش میں اپنے خاندان کے اقتدار کی بنیاد انہی نے رکھی۔"
