summary:
  ar: "شاعر جاهلي من قبيلة أود بمذحج، وسيد قومه، عاش نحو منتصف القرن السادس للميلاد؛ أكثر شعره في مدح الشجاعة القتالية لقومه، ونُسبت إليه حكم جعلته من حكماء الجاهلية، وشكّك الجاحظ في صحة أكثر ما نُسب إليه {cite:encyclopaedia-of-islam-2 vol. 1 p. 264}."
  en: "A pre-Islamic Arab poet, chieftain of the Awd clan of Madhhij, who lived about the middle of the 6th century. Most of his poetry praises the warlike virtues of his tribe and its chief; his gnomic poems made him one of the sages of the jahiliyya, though al-Jahiz doubted the authenticity of much attributed to him {cite:encyclopaedia-of-islam-2 vol. 1 p. 264}."
  fr: "Poète arabe préislamique et chef du clan des Awd de Madhhij, qui vécut vers le milieu du VIe siècle. La plupart de ses poèmes célèbrent les vertus guerrières de sa tribu et de son chef ; ses poèmes gnomiques le firent compter parmi les sages de la jahiliyya, bien qu’al-Jahiz ait douté de l’authenticité de nombreux vers qui lui étaient attribués {cite:encyclopaedia-of-islam-2 vol. 1 p. 264}."
  es: "Poeta árabe preislámico, jefe del clan Awd de Madhhij, que vivió a mediados del siglo VI. Gran parte de su poesía alaba las virtudes guerreras de su tribu y de su jefe; sus poemas gnómicos lo convirtieron en uno de los sabios de la jahiliyya, aunque al-Jahiz dudaba de la autenticidad de gran parte de lo que se le atribuía {cite:encyclopaedia-of-islam-2 vol. 1 p. 264}."
