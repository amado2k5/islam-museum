summary:
  ar: "شاعر جاهلي من قبيلة أود بمذحج، وسيد قومه، عاش نحو منتصف القرن السادس للميلاد؛ أكثر شعره في مدح الشجاعة القتالية لقومه، ونُسبت إليه حكم جعلته من حكماء الجاهلية، وشكّك الجاحظ في صحة أكثر ما نُسب إليه {cite:encyclopaedia-of-islam-2 vol. 1 p. 264}."
  en: "A pre-Islamic Arab poet, chieftain of the Awd clan of Madhhij, who lived about the middle of the 6th century. Most of his poetry praises the warlike virtues of his tribe and its chief; his gnomic poems made him one of the sages of the jahiliyya, though al-Jahiz doubted the authenticity of much attributed to him {cite:encyclopaedia-of-islam-2 vol. 1 p. 264}."
