summary:
  ar: "قدوة أهل التوحيد وشيخ العارفين عند أهل الطريق، شيخ شيوخ بغداد وإليه انتهت رياسة تربية المريدين ومشيخة العراق؛ صحب عمه أبا النجيب السهروردي والشيخ عبد القادر وسمع من أبي القاسم بن فضلان، وكان له مجلس وعظ مقبول تواجد فيه الناس وتاب جمع كبير؛ من تصانيفه كتاب عوارف المعارف وهو أشهرها، وكان كثير الحج وتكتب إليه مشايخ الطريق صور فتاوى في أحوالهم؛ عمي في آخر عمره وأقعد ولم يخل بشيء من أوراده؛ توفي ببغداد {cite:shadharat-dhahab p. 153-155}."
  en: "Shihab al-Din Umar al-Suhrawardi (539–632) — shaykh al-shuyukh of Baghdad and author of Awarif al-Ma'arif, the most-read Sufi manual of the later middle ages; companion of his uncle Abu al-Najib and of Abd al-Qadir, beloved preacher at whose gatherings crowds repented; blind and bedridden at the end yet never dropping a wird {cite:shadharat-dhahab p. 153-155}."
