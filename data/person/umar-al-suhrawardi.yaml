summary:
  ar: "قدوة أهل التوحيد وشيخ العارفين عند أهل الطريق، شيخ شيوخ بغداد وإليه انتهت رياسة تربية المريدين ومشيخة العراق؛ صحب عمه أبا النجيب السهروردي والشيخ عبد القادر وسمع من أبي القاسم بن فضلان، وكان له مجلس وعظ مقبول تواجد فيه الناس وتاب جمع كبير؛ من تصانيفه كتاب عوارف المعارف وهو أشهرها، وكان كثير الحج وتكتب إليه مشايخ الطريق صور فتاوى في أحوالهم؛ عمي في آخر عمره وأقعد ولم يخل بشيء من أوراده؛ توفي ببغداد {cite:shadharat-dhahab p. 153-155}."
  en: "Shihab al-Din Umar al-Suhrawardi (539–632) — shaykh al-shuyukh of Baghdad and author of Awarif al-Ma'arif, the most-read Sufi manual of the later middle ages; companion of his uncle Abu al-Najib and of Abd al-Qadir, beloved preacher at whose gatherings crowds repented; blind and bedridden at the end yet never dropping a wird {cite:shadharat-dhahab p. 153-155}."
  es: "Shihab al-Din Umar al-Suhrawardi (539–632) — shaykh al-shuyukh de Bagdad y autor de Awarif al-Ma'arif, el manual sufí más leído de la Baja Edad Media; compañero de su tío Abu al-Najib y de Abd al-Qadir, amado predicador en cuyas reuniones las multitudes se arrepentían; ciego y postrado en cama al final, pero sin dejar de pronunciar una sola palabra {cite:shadharat-dhahab p. 153-155}."
  fr: "Shihab al-Din Umar al-Suhrawardi (539–632) — cheikh al-shouyukh de Bagdad et auteur d'Awarif al-Ma'arif, le manuel soufi le plus lu de la fin du Moyen Âge; compagnon de son oncle Abu al-Najib et d'Abd al-Qadir, prédicateur bien-aimé lors duquel les foules se repentaient; aveugle et alité à la fin, mais ne laissant jamais tomber un wird {cite:shadharat-dhahab p. 153-155}."
  ur: "شہاب الدین عمر السحروردی (539-632) - بغداد کے شیخ الشیوخ اور عوارف المعارف کے مصنف، بعد کے درمیانی دور کے سب سے زیادہ پڑھے جانے والے صوفی کتابچے؛ اپنے چچا ابو النجیب اور عبد القادر کے ساتھی، پیارے مبلغ جن کی محفلوں میں ہجوم توبہ کرتا تھا۔ نابینا اور آخر میں بستر پر پڑا پھر بھی کبھی تار نہیں گراتا۔ 153-155}۔"
  tr: "Tek tanrılılar için bir rol model ve yol halkı arasında mistiklerin şeyhi, Bağdat şeyhi, müridin eğitimi ve Irak şeyhliği liderliği ona sona erdi. Amcası Ebu el-Nacib el-Suhrawardi ve Şeyh Abdül-Kadır ile birlikte gitti ve Ebu el-Kasım bin Fadlan'dan dinledi. Kabul edilen vaaz toplantıları düzenledi ve çok sayıda takipçi onu takip etti; eserleri arasında en ünlüsü olan 'Awarif al-Ma'arif' kitabı da vardır. Sık sık hac ziyaretleri yapardı ve yolun şeyhleri ona durumları hakkında fetva kopyaları yazdılar. Amcası yaşlıydı ve hiçbir sivaetini ihmal etmedi; Bağdat'ta vefat etti {atıf:shadharat-dhahab, s. 153-155}."
  id: "Seorang panutan bagi umat monoteisme dan sheikh para mistikus di antara orang-orang jalan, sheikh Baghdad, yang menjadi tujuan kepemimpinan pendidikan murid dan sheikh Irak. Ia menemani pamannya Abu al-Najib al-Suhrawardi dan Sheikh Abd al-Qadir serta mendengar dari Abu al-Qasim ibn Fadlan. Ia mengadakan pertemuan khotbah yang diterima dan banyak pengikut mengikuti; di antara karyanya adalah buku 'Awarif al-Ma'arif,' yang paling terkenal. Ia sering melakukan ziarah, dan para sheikh di jalur tersebut menulis fatwa tentang kondisi mereka kepadanya. Pamannya sudah tua dan tidak mengabaikan bacaan apa pun; ia meninggal di Baghdad {cite:shadharat-dhahab, hlm. 153-155}."
