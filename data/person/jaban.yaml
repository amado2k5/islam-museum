label: { ar: "جابان" }
summary:
  ar: "عند البلاذري: قائد فارسي خرج في جمع عظيم إلى أليس فلقيه المثنى بن حارثة بنهر الدم ثم تجمع بمستر فبعث إليه خالد المثنى وحنظلة الكاتب فهرب لما انتهيا إليه."
  en: "In al-Baladhuri: a Persian commander who came out in a great host to Ulays — al-Muthanna ibn Haritha met him at Nahr al-Damm — then massed at Tustar where Khalid sent al-Muthanna and Hanzala the Scribe against him, and he fled at their approach."
  es: "En al-Baladhuri: un comandante persa que salió con un gran ejército a Ulays —al-Muthanna ibn Haritha lo recibió en Nahr al-Damm— luego se congregó en Tustar donde Khalid envió a al-Muthanna y a Hanzala el Escriba contra él, y huyó al acercarse."
  fr: "Dans al-Baladhuri: un commandant perse qui est sorti à la tête d'une grande armée contre Ulays — al-Muthanna ibn Haritha l'a rencontré à Nahr al-Damm — puis s'est massé à Tustar où Khalid a envoyé al-Muthanna et Hanzala le Scribe contre lui, et il s'est enfui à leur approche."
  ur: "البلادوری میں ہے: ایک فارسی کمانڈر جو اولیس کے ایک عظیم لشکر کے ساتھ نکلا تھا - المثنا ابن حارثہ نے اس سے نہر الدم میں ملاقات کی - پھر تستار کے مقام پر جمع ہوا جہاں خالد نے المثنیٰ اور حنظلہ کو اس کے خلاف بھیجا، اور وہ ان کے قریب سے بھاگ گیا۔"
  tr: "al-Baladhuri'ye göre: Bir Pers komutanı büyük bir kalabalıkla Alis'e gitti; burada al-Muthanna ibn Haritha onu kan nehrinde karşıladı, ardından Bay ile toplandı. Halid al-Muthanna ve yazıcı Hanzala onu gönderdi ve onlar ona ulaşınca kaçtı."
  id: "Menurut al-Baladhuri: Seorang komandan Persia pergi dalam perkumpulan besar ke Alis, di mana al-Muthanna ibn Haritha menemuinya di sungai darah, lalu berkumpul bersama Tuan. Khalid al-Muthanna dan Hanzala sang juru tulis mengirimnya, dan ia melarikan diri ketika mereka sampai kepadanya."
