summary:
  ar: "قائد الحامية العثمانية في تلمسان؛ صمد بها في وجه جيوش محمد الشيخ السعدي التي دخلت المدينة على غفلة بعد إبحار الأسطول العثماني إلى استانبول، حتى احتوى الهجوم السعدي {cite:dawlat-uthmaniyya-salabi p. 244}."
  en: "Commander of the Ottoman garrison at Tlemcen; he held out against Muhammad al-Shaykh's army, which had entered the city unawares while the Ottoman fleet was away, until the Sa'di attack was contained {cite:dawlat-uthmaniyya-salabi p. 244}."
  es: "Comandante de la guarnición otomana en Tlemcen; resistió al ejército de Muhammad al-Shaykh, que había entrado en la ciudad sin ser advertido mientras la flota otomana estaba ausente, hasta que el ataque Sa'di fue contenido {cite:dawlat-uthmaniyya-salabi p. 244}."
  fr: "Commandant de la garnison ottomane de Tlemcen; il a résisté à l'armée de Muhammad al-Shaykh, qui était entrée dans la ville par surprise pendant que la flotte ottomane était absente, jusqu'à ce que l'attaque de Sa'di soit contenue {cite:dawlat-uthmaniyya-salabi p. 244}."
  ur: "Tlemcen میں عثمانی گیریژن کے کمانڈر؛ اس نے محمد الشیخ کی فوج کا مقابلہ کیا جو عثمانی بحری بیڑے کے دور ہوتے ہوئے بے خبری میں شہر میں داخل ہو گئی تھی، یہاں تک کہ سعدی کے حملے پر قابو پا لیا گیا۔ 244}۔"
  tr: "Tlemcen'deki Osmanlı garnizonunun komutanı; Osmanlı filosu İstanbul'a yelken açtıktan sonra beklenmedik şekilde şehre giren Muhammed Şeyh el-Saadi'nin ordularına karşı orada kararlı durdu {cite:dawlat-uthmaniyya-salabi s. 244}."
  id: "Komandan garnisun Ottoman di Tlemcen; ia berdiri teguh di sana melawan pasukan Muhammad Sheikh al-Saadi, yang tiba-tiba memasuki kota setelah armada Ottoman berlayar ke Istanbul, hingga serangan Saadian berhasil dikendalikan {cite:dawlat-uthmaniyya-salabi hlm. 244}."
