summary:
  ar: 'إبراهيم بن العباس، ويقال ابن أبي العباس، أبو إسحاق السامري الكوفي. روى عن شريك القاضي وابن الزناد وبقية وغيرهم، وروى عنه أحمد بن حنبل والصغاني والدوري وغيرهم. قال أحمد: صالح الحديث، وقال مرة: لا بأس به. وقال الدارقطني وغيره: ثقة، وذكره ابن حبان في الثقات. ولم يذكر المصدر تاريخ وفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5499}'
  en: Ibrahim ibn al-Abbas, or Ibn Abi al-Abbas, Abu Ishaq al-Samiri of Kufa. He related from Shurayk the judge, Ibn al-Zinad and Baqiyya and others; Ahmad ibn Hanbal, al-Saghani and al-Duri related from him. Ahmad said he was good in hadith and once said there is no harm in him; al-Daraqutni and others called him trustworthy, and Ibn Hibban counted him among the trustworthy. The book gives no date of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5499}
  ur: ابراہیم بن العباس، جن کے بارے میں ابن ابی العباس بھی کہا گیا، ابو اسحاق سامری کوفی۔ انہوں نے شریک القاضی، ابن الزناد اور بقیہ وغیرہ سے روایت کیا، اور ان سے احمد بن حنبل، صغانی اور دوری وغیرہ نے روایت کیا۔ احمد نے کہا وہ حدیث میں صالح ہیں، دارقطنی اور دوسروں نے انہیں ثقہ کہا، اور ابن حبان نے انہیں ثقات میں ذکر کیا۔ کتاب میں ان کی وفات کی تاریخ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5499}
  es: "Ibrahim ibn al-Abbas, o Ibn Abi al-Abbas, Abu Ishaq al-Samiri de Kufa. Relató de Shurayk el juez, Ibn al-Zinad y Baqiyya y otros; Ahmad ibn Hanbal, al-Saghani y al-Duri relataron de él. Ahmad dijo que era bueno en hadices y una vez dijo que no había maldad en él; al-Daraqutni y otros lo llamaron digno de confianza, e Ibn Hibban lo incluyó entre los dignos de confianza. El libro no indica la fecha de su muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5499}"
  fr: "Ibrahim ibn al-Abbas, ou Ibn Abi al-Abbas, Abu Ishaq al-Samiri de Kufa, rapportait des hadiths d'après le juge Shurayk, Ibn al-Zinad, Baqiyya et d'autres. Ahmad ibn Hanbal, al-Saghani et al-Duri rapportaient également des hadiths d'après lui. Ahmad disait qu'il était un bon érudit en hadiths et affirmait même qu'il n'y avait rien à lui reprocher. Al-Daraqutni et d'autres le qualifiaient de digne de confiance, et Ibn Hibban le comptait parmi les dignes de confiance. L'ouvrage ne mentionne pas de date de décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5499}"
  tr: "İbrahim bin el-Abbas, aynı zamanda İbn Ebi el-Abbas, Ebu İshaq el-Samiri el-Kufi olarak da bilinir. Şerik el-Kadi, İbn el-Zinad, Baqiyya ve diğerlerinden rivayet etti; Ahmed bin Hanbal, el-Sughani, el-Duri ve diğerleri ondan rivayet etti. Ahmed şöyle dedi: Hadis sağlamdır ve bir keresinde şöyle dedi: Zararı yoktur. El-Darakutni ve diğerleri dediler: güvenilir, İbn Hibben ise bunu güvenilir kişiler arasında belirtti. Kaynak ölüm tarihini belirtmedi. {Kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.5499}"
  id: "Ibrahim ibn al-Abbas, juga disebut Ibn Abi al-Abbas, Abu Ishaq al-Samiri al-Kufi. Ia menceritakan dari Sharik al-Qadi, Ibn al-Zinad, Baqiyya, dan lainnya, dan Ahmad ibn Hanbal, al-Sughani, al-Duri, dan lainnya menceritakan darinya. Ahmad berkata: Hadits itu benar, dan suatu kali ia berkata: Tidak ada salahnya. Al-Daraqutni dan lainnya berkata: dapat dipercaya, dan Ibn Hibban menyebutkannya di antara yang dapat dipercaya. Sumber tersebut tidak menyebutkan tanggal kematiannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5499}"
