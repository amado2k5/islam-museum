label:
  ar: إبراهيم بن العباس السامري
  en: Ibrahim ibn al-Abbas al-Samiri
  ur: ابراہیم بن العباس سامری
roles:
- scholar
gender: male
summary:
  ar: 'إبراهيم بن العباس، ويقال ابن أبي العباس، أبو إسحاق السامري الكوفي. روى عن شريك القاضي وابن الزناد وبقية وغيرهم، وروى عنه أحمد بن حنبل والصغاني والدوري وغيرهم. قال أحمد: صالح الحديث، وقال مرة: لا بأس به. وقال الدارقطني وغيره: ثقة، وذكره ابن حبان في الثقات. ولم يذكر المصدر تاريخ وفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5499}'
  en: Ibrahim ibn al-Abbas, or Ibn Abi al-Abbas, Abu Ishaq al-Samiri of Kufa. He related from Shurayk the judge, Ibn al-Zinad and Baqiyya and others; Ahmad ibn Hanbal, al-Saghani and al-Duri related from him. Ahmad said he was good in hadith and once said there is no harm in him; al-Daraqutni and others called him trustworthy, and Ibn Hibban counted him among the trustworthy. The book gives no date of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5499}
  ur: ابراہیم بن العباس، جن کے بارے میں ابن ابی العباس بھی کہا گیا، ابو اسحاق سامری کوفی۔ انہوں نے شریک القاضی، ابن الزناد اور بقیہ وغیرہ سے روایت کیا، اور ان سے احمد بن حنبل، صغانی اور دوری وغیرہ نے روایت کیا۔ احمد نے کہا وہ حدیث میں صالح ہیں، دارقطنی اور دوسروں نے انہیں ثقہ کہا، اور ابن حبان نے انہیں ثقات میں ذکر کیا۔ کتاب میں ان کی وفات کی تاریخ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5499}
