summary:
  ar: "عالم مصري ومقدّم تلفزيوني، المشرف الديني على قناة هدى الفضائية ومقدّم برنامج الفتوى المباشر «اسأل هدى» وبرنامجي «صحّح تلاوتك» و«رياض الصالحين». يحمل الدكتوراه في الفقه المقارن وبكالوريوس الشريعة والقانون الإسلامي من جامعة الأزهر وبكالوريوس الصيدلة، وقاد المركز الإسلامي في فيكتوريا بتكساس وأسّس مدرستين إسلاميتين، ودرّس في الأزهر وأكاديمية الشريعة وكلية في لندن، وبثّ مئات الساعات على قنوات مصرية وعربية وأمريكية."
  en: "An Egyptian scholar and television presenter, the religious supervisor of Huda TV and presenter of its live fatwa programme Ask Huda and of Correct Your Recitation and Gardens of the Pious. He holds a PhD in Comparative Fiqh, a BA in Sharia and Islamic Law from Al-Azhar University and a BA in pharmacology; he led the Islamic Center of Victoria, Texas, founded two Islamic schools, taught at Al-Azhar University, Shariah Academy and a London college, and has broadcast hundreds of live hours on Egyptian, Arabic and American stations."
  ur: "مصری عالم اور ٹیلی ویژن پیش کار؛ ہدیٰ ٹی وی کے دینی نگران اور اس کے براہِ راست فتویٰ پروگرام «اسأل ہدیٰ» اور «صحح تلاوتك» و «ریاض الصالحین» کے میزبان۔ وہ فقہِ مقارن میں پی ایچ ڈی، جامعہ ازہر سے شریعت و اسلامی قانون میں بی اے اور فارماکولوجی میں بی اے رکھتے ہیں؛ انہوں نے وکٹوریا، ٹیکساس کے اسلامی مرکز کی قیادت کی اور دو اسلامی اسکول قائم کیے۔"
  es: "Erudito egipcio y presentador de televisión, supervisor religioso de Huda TV y presentador de su programa de fatwas en directo «Pregúntale a Huda», así como de «Corrige tu recitación» y «Jardines de los piadosos». Es doctor en Fiqh comparado, licenciado en Sharia y Derecho Islámico por la Universidad de Al-Azhar y licenciado en farmacología. Dirigió el Centro Islámico de Victoria, Texas, fundó dos escuelas islámicas, impartió clases en la Universidad de Al-Azhar, la Academia de Sharia y un colegio de Londres, y ha emitido cientos de horas en directo en cadenas egipcias, árabes y estadounidenses."
  fr: "Érudit et présentateur de télévision égyptien, il est le superviseur religieux de Huda TV et anime son émission de fatwas en direct « Demandez à Huda », ainsi que les émissions « Corrigez votre récitation » et « Les Jardins des Pieux ». Docteur en fiqh comparé, titulaire d'une licence en charia et droit islamique de l'université Al-Azhar et d'une licence en pharmacologie, il a dirigé le Centre islamique de Victoria (Texas), fondé deux écoles islamiques, enseigné à l'université Al-Azhar, à la Shariah Academy et dans un établissement d'enseignement supérieur londonien, et animé des centaines d'heures d'émissions en direct sur des chaînes égyptiennes, arabes et américaines."
  tr: "Mısırlı bir alim ve televizyon sunucusu, Huda Uydu Kanalı'nda dini gözetmeni, canlı fetva programı 'Huda'ya Sor' ve 'Correct Your Prayer' ile 'Riyad al-Salihin' programlarının sunucusudur. Karşılaştırmalı hukuk alanında doktora, El-Ezher Üniversitesi'nden Şeriat ve İslam hukuku lisans derecesi ve eczacılık lisans derecesine sahiptir. Victoria, Teksas'taki İslami Merkez'i yönetti, iki İslami okul kurdu, El-Ezher, Şeriat Akademisi ve Londra'da bir kolejde eğitim gördü ve Mısır, Arap ve Amerikan kanallarında yüzlerce saat yayın yaptı."
  id: "Seorang cendekiawan Mesir dan pembawa acara televisi, pengawas agama di Huda Satellite Channel, pembawa acara program fatwa langsung 'Ask Huda,' serta program 'Correct Your Recitation' dan 'Riyadh al-Salihin.' Ia meraih gelar PhD dalam bidang hukum komparatif, gelar sarjana Syariah dan hukum Islam dari Universitas Al-Azhar, serta gelar sarjana farmasi. Ia memimpin Islamic Center di Victoria, Texas, mendirikan dua sekolah Islam, belajar di Al-Azhar, Akademi Syariah, dan sebuah perguruan tinggi di London, serta menyiarkan ratusan jam di saluran Mesir, Arab, dan Amerika."
