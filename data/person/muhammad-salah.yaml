summary:
  ar: "عالم مصري ومقدّم تلفزيوني، المشرف الديني على قناة هدى الفضائية ومقدّم برنامج الفتوى المباشر «اسأل هدى» وبرنامجي «صحّح تلاوتك» و«رياض الصالحين». يحمل الدكتوراه في الفقه المقارن وبكالوريوس الشريعة والقانون الإسلامي من جامعة الأزهر وبكالوريوس الصيدلة، وقاد المركز الإسلامي في فيكتوريا بتكساس وأسّس مدرستين إسلاميتين، ودرّس في الأزهر وأكاديمية الشريعة وكلية في لندن، وبثّ مئات الساعات على قنوات مصرية وعربية وأمريكية."
  en: "An Egyptian scholar and television presenter, the religious supervisor of Huda TV and presenter of its live fatwa programme Ask Huda and of Correct Your Recitation and Gardens of the Pious. He holds a PhD in Comparative Fiqh, a BA in Sharia and Islamic Law from Al-Azhar University and a BA in pharmacology; he led the Islamic Center of Victoria, Texas, founded two Islamic schools, taught at Al-Azhar University, Shariah Academy and a London college, and has broadcast hundreds of live hours on Egyptian, Arabic and American stations."
  ur: "مصری عالم اور ٹیلی ویژن پیش کار؛ ہدیٰ ٹی وی کے دینی نگران اور اس کے براہِ راست فتویٰ پروگرام «اسأل ہدیٰ» اور «صحح تلاوتك» و «ریاض الصالحین» کے میزبان۔ وہ فقہِ مقارن میں پی ایچ ڈی، جامعہ ازہر سے شریعت و اسلامی قانون میں بی اے اور فارماکولوجی میں بی اے رکھتے ہیں؛ انہوں نے وکٹوریا، ٹیکساس کے اسلامی مرکز کی قیادت کی اور دو اسلامی اسکول قائم کیے۔"
