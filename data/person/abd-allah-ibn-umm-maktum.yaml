summary:
  ar: "عبد الله ابن أم مكتوم الأعمى القرشي العامري، ويقال اسمه عمرو؛ كان قديم الإسلام بمكة وهاجر إلى المدينة، وكان يؤذن مع بلال ويستخلفه النبي عليها في أكثر غزواته، وشهد القادسية."
  en: "Abdallah ibn Umm Maktum, the blind Amiri Qurashi — his name is also given as Amr; an early Muslim at Mecca who emigrated to Medina, called the adhan with Bilal, was left in charge of the city in most of the Prophet's expeditions, and witnessed al-Qadisiyya."
  fr: "Abdallah ibn Umm Maktum, l'Amiri qurayshite aveugle — son nom est aussi donné comme Amr ; musulman de la première heure à La Mecque, il émigra à Médine, appela à la prière avec Bilal, fut laissé à la tête de la ville lors de la plupart des expéditions du Prophète, et assista à al-Qadisiyya."
  ur: "عبد اللہ بن ام مکتوم، نابینا عامری قریشی — نام عمرو بھی بتایا جاتا ہے؛ مکہ کے ابتدائی مسلمان، مدینہ ہجرت کی اور بلال کے ساتھ اذان دیتے تھے۔"
  es: "Abdallah ibn Umm Maktum, el Qurashi Amiri ciego —su nombre también aparece como Amr—, un musulmán de los primeros tiempos de La Meca que emigró a Medina, llamado al adhan junto con Bilal, quedó a cargo de la ciudad en la mayoría de las expediciones del Profeta y fue testigo de al-Qadisiyya."
