  ar: "عبد الله ابن أم مكتوم الأعمى القرشي العامري، ويقال اسمه عمرو؛ كان قديم الإسلام بمكة وهاجر إلى المدينة، وكان يؤذن مع بلال ويستخلفه النبي عليها في أكثر غزواته، وشهد القادسية."
  en: "Abdallah ibn Umm Maktum, the blind Amiri Qurashi — his name is also given as Amr; an early Muslim at Mecca who emigrated to Medina, called the adhan with Bilal, was left in charge of the city in most of the Prophet's expeditions, and witnessed al-Qadisiyya."
