summary:
  ar: "الإمام عبد العزيز بن محمد آل سعود (1720 – 1803) ثاني حكام إمارة الدرعية والدولة السعودية الأولى. نشأ على يد الشيخ محمد بن عبد الوهاب فصار من أبرز تلامذته وتزوج ابنته، وقاد جيوش الدولة في حياة أبيه، ثم خلفه سنة 1765 فامتدت الدولة في عهده إلى الرياض والأحساء وقطر والبحرين والحجاز، وفي عهده وقع نهب كربلاء سنة 1802. اغتيل في الدرعية في نوفمبر 1803 وهو يصلي بالناس، فخلفه ابنه سعود."
  en: "Imam Abdulaziz ibn Muhammad Al Saud (1720–1803) was the second ruler of the Emirate of Diriyah and the first Saudi state. Raised and educated by Muhammad ibn Abd al-Wahhab, whose leading student he became and whose daughter he married, he commanded the state's armies in his father's lifetime and succeeded him in 1765; under him the state reached Riyadh, al-Hasa, Qatar, Bahrain and the Hejaz, and his forces sacked Karbala in 1802. He was assassinated at Diriyah in November 1803 while leading the prayer, and his son Saud succeeded him."
  ur: "امام عبد العزیز بن محمد آل سعود (1720ء – 1803ء) امارت درعیہ اور پہلی سعودی ریاست کے دوسرے حکمران تھے۔ محمد بن عبدالوہاب کی تربیت میں پلے بڑھے، ان کے ممتاز شاگرد بنے اور ان کی بیٹی سے شادی کی؛ والد کی زندگی میں ریاست کی فوجوں کی قیادت کی اور 1765ء میں ان کے جانشین ہوئے۔ ان کے عہد میں ریاست ریاض، احساء، قطر، بحرین اور حجاز تک پھیلی اور 1802ء میں کربلا پر حملہ ہوا۔ نومبر 1803ء میں درعیہ میں نماز کی امامت کے دوران قتل ہوئے اور ان کے بیٹے سعود جانشین ہوئے۔"

