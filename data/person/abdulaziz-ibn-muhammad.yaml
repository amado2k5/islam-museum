summary:
  ar: "الإمام عبد العزيز بن محمد آل سعود (1720 – 1803) ثاني حكام إمارة الدرعية والدولة السعودية الأولى. نشأ على يد الشيخ محمد بن عبد الوهاب فصار من أبرز تلامذته وتزوج ابنته، وقاد جيوش الدولة في حياة أبيه، ثم خلفه سنة 1765 فامتدت الدولة في عهده إلى الرياض والأحساء وقطر والبحرين والحجاز، وفي عهده وقع نهب كربلاء سنة 1802. اغتيل في الدرعية في نوفمبر 1803 وهو يصلي بالناس، فخلفه ابنه سعود."
  en: "Imam Abdulaziz ibn Muhammad Al Saud (1720–1803) was the second ruler of the Emirate of Diriyah and the first Saudi state. Raised and educated by Muhammad ibn Abd al-Wahhab, whose leading student he became and whose daughter he married, he commanded the state's armies in his father's lifetime and succeeded him in 1765; under him the state reached Riyadh, al-Hasa, Qatar, Bahrain and the Hejaz, and his forces sacked Karbala in 1802. He was assassinated at Diriyah in November 1803 while leading the prayer, and his son Saud succeeded him."
  fr: "L'imam Abd al-Aziz ibn Muhammad Al Saoud (1720–1803) fut le deuxième souverain de l'émirat de Diriyah et du premier État saoudien. Élevé et instruit par Muhammad ibn Abd al-Wahhab, dont il devint l'élève principal et dont il épousa la fille, il commanda les armées de l'État du vivant de son père et lui succéda en 1765 ; sous son règne, l'État atteignit Riyad, al-Hasa, le Qatar, Bahreïn et le Hedjaz, et ses forces mirent Karbala à sac en 1802. Il fut assassiné à Diriyah en novembre 1803 alors qu'il dirigeait la prière, et son fils Saoud lui succéda."
  ur: "امام عبد العزیز بن محمد آل سعود ⁦(1720ء – 1803ء)⁩ امارت درعیہ اور پہلی سعودی ریاست کے دوسرے حکمران تھے۔ محمد بن عبدالوہاب کی تربیت میں پلے بڑھے، ان کے ممتاز شاگرد بنے اور ان کی بیٹی سے شادی کی؛ والد کی زندگی میں ریاست کی فوجوں کی قیادت کی اور 1765ء میں ان کے جانشین ہوئے۔ ان کے عہد میں ریاست ریاض، احساء، قطر، بحرین اور حجاز تک پھیلی اور 1802ء میں کربلا پر حملہ ہوا۔ نومبر 1803ء میں درعیہ میں نماز کی امامت کے دوران قتل ہوئے اور ان کے بیٹے سعود جانشین ہوئے۔"
  es: "El imán Abdulaziz ibn Muhammad Al Saud (1720-1803) fue el segundo gobernante del Emirato de Diriyah y el primer estado saudí. Criado y educado por Muhammad ibn Abd al-Wahhab, de quien fue su alumno más destacado y con cuya hija se casó, comandó los ejércitos del estado en vida de su padre y lo sucedió en 1765. Bajo su mandato, el estado se extendió hasta Riad, Al Hasa, Catar, Baréin y el Hiyaz, y sus fuerzas saquearon Karbala en 1802. Fue asesinado en Diriyah en noviembre de 1803 mientras dirigía la oración, y su hijo Saud lo sucedió."
  tr: "İmam Abdül Aziz bin Muhammed El Suud (1720 – 1803), Diriye Emirliği'nin ve Birinci Suudi Devleti'nin ikinci hükümdarıydı. Şeyh Muhammed bin Abdül Vahhab tarafından yetiştirildi ve onun en önde gelen öğrencilerinden biri oldu, kızıyla evlendi. Babasının hayatta olduğu dönemde devlet ordularına liderlik etti ve 1765'te onun yerine geçti. Saltanatı sırasında devlet Riyad, El-Ahsa, Katar, Bahreyn ve Hicaz'a kadar genişledi. Kerbela'nın yağmalanması 1802'de onun döneminde gerçekleşti. Kasım 1803'te Diriye'de insanlara namaz kıldırırken suikasta uğradı ve yerine oğlu Suud geçti."
  id: "Imam Abdul Aziz bin Muhammad Al Saud (1720 – 1803) adalah penguasa kedua Emirat Diriyah dan Negara Saudi Pertama. Ia dibesarkan oleh Syekh Muhammad bin Abdul Wahhab dan menjadi salah satu muridnya yang paling terkemuka, menikahi putrinya. Ia memimpin pasukan negara selama masa hidup ayahnya, kemudian menggantikannya pada tahun 1765. Selama pemerintahannya, negara meluas ke Riyadh, Al-Ahsa, Qatar, Bahrain, dan Hijaz. Penjarahan Karbala terjadi selama pemerintahannya pada tahun 1802. Ia dibunuh di Diriyah pada November 1803 saat memimpin orang-orang dalam salat, dan digantikan oleh putranya, Saud."

