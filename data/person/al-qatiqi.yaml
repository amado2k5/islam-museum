summary:
  ar: "أحمد بن جعفر بن حمدان بن مالك بن شبيب أبو بكر القطيعي ⁦(274–368هـ)⁩، محدث بغداد؛ سُمّي بقطيعة الدقيق التي كان يسكنها، وسمع أبا بكر بن إبراهيم بن إسحاق وإسحاق بن الحسن الحربيين وبشر بن دوسى والكديمي والكجي وعبد الله بن أحمد وغيرهم، وكان كثير الحديث ثقة، وروى عن عبد الله بن أحمد المسند والزهد والتاريخ والمسائل وغير ذلك، وروى عنه الدارقطني وابن شاهين والبرقاني وأبو نعيم والحاكم ولم يمتنع أحد من الرواية عنه ولا ترك الاحتجاج به؛ وتغيّر في آخر عمره فكان لا يعرف شيئاً مما قُرئ عليه، وتوفي سنة ثمان وستين وثلثمائة ودفن في مقابر باب حرب قريباً من قبر الإمام أحمد بن حنبل {cite:muntazam-ibn-al-jawzi j.7 p.96-97}."
  en: "Ahmad b. Ja'far Abu Bakr al-Qati'i (274–368), the Baghdad muhaddith named for Qati'at al-Daqiq where he lived; he transmitted 'Abd Allah b. Ahmad's Musnad, Zuhd, Tarikh and Masa'il, and was himself transmitted from by al-Daraqutni, Ibn Shahin, al-Barqani, Abu Nu'aym and al-Hakim, no one refusing him or leaving off citing him as proof; in his last years he changed and knew nothing of what had been read to him. He died 368 and was buried at the Bab Harb cemeteries near Imam Ahmad's grave {cite:muntazam-ibn-al-jawzi j.7 p.96-97}."
  fr: "Ahmad b. Ja'far Abu Bakr al-Qati'i (274-368), le muhaddith de Bagdad nommé d'après Qati'at al-Daqiq où il vivait  ; il a transmis 'Abd Allah b. Ahmad's Musnad, Zuhd, Tarikh et Masa'il, et a lui-même été transmis par al-Daraqutni, Ibn Shahin, al-Barqani, Abu Nu'aym et al-Hakim, personne ne le refusant ou ne le laissant le citer comme preuve ; Dans ses dernières années, il a changé et ne savait rien de ce qui lui avait été lu. Il mourut en 368 et fut enterré dans les cimetières de Bab Harb près de la tombe de l'Imam Ahmad {cite:muntazam-ibn-al-jawzi j.7 p.96-97}."
  es: "Ahmad b. Ja'far Abu Bakr al-Qati'i (274–368), el muhaddith de Bagdad que recibió su nombre de Qati'at al-Daqiq, donde residía; transmitió el Musnad, Zuhd, Tarikh y Masa'il de 'Abd Allah b. Ahmad, y a su vez, al-Daraqutni, Ibn Shahin, al-Barqani, Abu Nu'aym y al-Hakim transmitieron sus enseñanzas, sin que nadie lo rechazara ni dejara de citarlo como prueba; en sus últimos años cambió y no recordaba nada de lo que se le había leído. Murió en 368 y fue enterrado en los cementerios de Bab Harb, cerca de la tumba del Imam Ahmad {cite:muntazam-ibn-al-jawzi, vol. 7, págs. 96-97}."
  ur: "احمد بی۔ جعفر ابوبکر القطی (274-368)، بغداد کے محدث نے قطیۃ الدقیق کے لیے نامزد کیا جہاں وہ رہتے تھے۔ اس نے عبد اللہ بن کو منتقل کیا۔ احمد کی مسند، زہد، تاریخ اور مسایل، اور اسے خود دارقطنی، ابن شاہین، البرقانی، ابو نعیم اور الحکیم نے نقل کیا ہے، کسی نے بھی اس کا انکار نہیں کیا اور اسے بطور دلیل پیش کرتے ہوئے ترک نہیں کیا۔ اپنے آخری سالوں میں وہ بدل گیا اور اس کے بارے میں کچھ نہیں جانتا تھا کہ اسے کیا پڑھا گیا تھا۔ ان کی وفات 368ھ میں ہوئی اور انہیں باب حرب قبرستان میں امام احمد کی قبر کے قریب دفن کیا گیا۔"
  tr: "Ahmed ibn Ja'far ibn Hamdan ibn Malik ibn Shabib Abu Bakr al-Qutai'i (274–368 H) Bağdat'ta bir hadis alimiydi; yaşadığı yerde 'Qati'at al-Daqq' olarak biliniyordu. Ebu Bekir ibn İbrahim ibn İshaq, İshaq ibn al-Hasan al-Harbiyyin, Bişr ibn Dawsi, al-Kudaymi, al-Kaji, Abdullah ibn Ahmad ve diğerlerinden haber aldı. Hadislerde sık sık ve güvenilirdi. Abdullah ibn Ahmed al-Musnad'dan zahitlik, tarih, dini konular ve daha fazlasını rivayet etti. El-Darakutni, İbn Şahin, el-Barqani, Ebu Nu'eym ve el-Hakim tarafından ondan rivayet etti ve kimse ondan rivayet etmekten çekinmedi. İfadesini terk etmedi; ilerleyen yıllarında kendisine okunanlardan habersiz değişti. 368 Hicri yılında öldü ve İmam Ahmed ibn Hanbal'in mezarının yakınındaki Bab Harb mezarlığına defnedildi {atıf:Muntazam-ibn-al-jawzi J.7 s.96-97}."
  id: "Ahmad ibn Ja'far ibn Hamdan ibn Malik ibn Shabib Abu Bakr al-Qutai'i (274–368 H), seorang ulama hadis di Baghdad; ia dikenal sebagai 'Qati'at al-Daqq' tempat ia tinggal. Ia mendengar dari Abu Bakr ibn Ibrahim ibn Ishaq, Ishaq ibn al-Hasan al-Harbiyyin, Bishr ibn Dawsi, al-Kudaymi, al-Kaji, Abdullah ibn Ahmad, dan lainnya. Ia sering dan dapat dipercaya dalam hadis. Ia menceritakan dari Abdullah ibn Ahmad al-Musnad, asketisme, sejarah, isu agama, dan lainnya. Ia diceritakan darinya oleh al-Daraqutni, Ibn Shaheen, al-Barqani, Abu Nu'aym, dan al-Hakim, dan tidak ada yang menahan diri untuk menceritakan darinya. Ia tidak meninggalkan kesaksiannya; ia berubah di tahun-tahun terakhirnya, tanpa mengetahui apa yang dibacakan kepadanya. Ia meninggal pada tahun 368 H dan dimakamkan di pemakaman Bab Harb dekat makam Imam Ahmad ibn Hanbal {cite:Muntazam-ibn-al-jawzi J.7 hlm.96-97}."
