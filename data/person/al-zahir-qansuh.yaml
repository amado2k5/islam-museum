summary:
  ar: "الملك الظاهر قانصوه سلطان مصر بعد مقتل الملك الناصر محمد بن قايتباي؛ قدِم جان بلاط من نيابة الشام في زمنه فولاه الإمرة الكبرى وزوّجه بأخته، وكان العادل طومان باي يرمي الفتنة بينه وبين الظاهر حتى تنافرا فغلبه جان بلاط فخرج من قلعة مصر وتركها له سنة خمس وتسعمائة {cite:shadharat-dhahab p. 445}."
  en: "Sultan between al-Nasir b. Qaytbay's killing and Jan Balat's coup — Jan Balat came from the Damascus governorship in his days, was made amir-kabir and married to his sister; Tuman Bay sowed discord between them until Jan Balat overcame al-Zahir, who left the citadel of Egypt to him in 905 {cite:shadharat-dhahab p. 445}."
  fr: "Sultan entre le meurtre d'al-Nasir b. Qaytbay et le coup d'État de Jan Balat - Jan Balat est venu du gouvernorat de Damas en son temps, a été fait amir-kabir et marié à sa sœur ; La baie de Tuman sema la discorde entre eux jusqu'à ce que Jan Balat vainquit al-Zahir, qui lui laissa la citadelle d'Égypte en 905 {cite:shadharat-dhahab p. 445}."
  es: "Sultán entre el asesinato de al-Nasir b. Qaytbay y el golpe de Estado de Jan Balat: Jan Balat provenía del gobierno de Damasco en su época, fue nombrado amir-kabir y se casó con su hermana; Tuman Bay sembró la discordia entre ellos hasta que Jan Balat venció a al-Zahir, quien le dejó la ciudadela de Egipto en 905 {cita: shadharat-dhahab p. 445}."
  ur: "الناصر کے درمیان سلطان قیتبے کا قتل اور جان بلات کی بغاوت - جان بلات اپنے دنوں میں دمشق کی گورنری سے آیا تھا، اسے امیر کبیر بنایا گیا تھا اور اس کی بہن سے شادی کی گئی تھی۔ تمن بے نے ان کے درمیان اختلاف پیدا کیا یہاں تک کہ جان بلات نے الظاہر پر قابو پالیا، جس نے 905 میں مصر کا قلعہ اس کے لیے چھوڑ دیا 445}"
  tr: "Mısır Sultanı Kral el-Zahir Qansuh, Kral el-Nasir Muhammed bin Keytbey'in öldürülmesinden sonra, Jan Balat'ı döneminde Levant'ın vekili olarak atadı, onu en yüksek hükümdar olarak atadı ve kız kardeşiyle evlendirdi. Adil Tuman Bey, kendisi ile el-Zahir arasında anlaşmazlık çıkardı, sonunda düşmanlığa dönüştüler ve Jan Balat onu yendi; bu yüzden Mısır kalesinden ayrıldı ve 945 yılında ona bıraktı {kaynak:shadharat-dhahab, s. 445}."
  id: "Raja al-Zahir Qansuh, Sultan Mesir, setelah pembunuhan Raja al-Nasir Muhammad ibn Qaitbay, mengangkat Jan Balat sebagai wakil Levant pada masanya, mengangkatnya sebagai penguasa tertinggi, dan menikahkannya dengan saudara perempuannya. Tuman Bey yang adil menimbulkan perselisihan antara dia dan al-Zahir hingga mereka menjadi bermusuhan, dan Jan Balat mengalahkannya, sehingga dia meninggalkan benteng Mesir dan meninggalkannya untuknya pada tahun 945 {cite:shadharat-dhahab, hlm. 445}."
