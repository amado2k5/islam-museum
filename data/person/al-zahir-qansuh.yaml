summary:
  ar: "الملك الظاهر قانصوه سلطان مصر بعد مقتل الملك الناصر محمد بن قايتباي؛ قدِم جان بلاط من نيابة الشام في زمنه فولاه الإمرة الكبرى وزوّجه بأخته، وكان العادل طومان باي يرمي الفتنة بينه وبين الظاهر حتى تنافرا فغلبه جان بلاط فخرج من قلعة مصر وتركها له سنة خمس وتسعمائة {cite:shadharat-dhahab p. 445}."
  en: "Sultan between al-Nasir b. Qaytbay's killing and Jan Balat's coup — Jan Balat came from the Damascus governorship in his days, was made amir-kabir and married to his sister; Tuman Bay sowed discord between them until Jan Balat overcame al-Zahir, who left the citadel of Egypt to him in 905 {cite:shadharat-dhahab p. 445}."
