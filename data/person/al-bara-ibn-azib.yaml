summary:
  ar: صحابي من الأوس له ولأبيه صحبة؛ استُصغر يوم بدر هو وابن عمر فرُدّا وشهد أحداً، وغزا أربع عشرة أو خمس عشرة غزوة مع النبي، وافتتح الري، وشهد الجمل وصفين مع علي، ونزل الكوفة ومات في إمارة مصعب بن الزبير.
  en: A Companion of the Aws, as was his father; he was judged too young at Badr along with Ibn Umar and sent back, then took part at Uhud; he joined fourteen or fifteen expeditions with the Prophet, took al-Rayy, was with Ali at the Camel and
    Siffin, settled in Kufa and died in the governorship of Mus'ab ibn al-Zubayr.
  fr: "Compagnon des Aws, comme son père ; jugé trop jeune à Badr avec Ibn Umar, il fut renvoyé, puis participa à Uhud ; il prit part à quatorze ou quinze expéditions avec le Prophète, conquit al-Rayy, fut avec Ali au Chameau et à Siffin, s’établit à Kufa et mourut sous le gouvernement de Mus’ab ibn al-Zubayr."
  ur: "اوس کے صحابی جیسا کہ ان کے والد بھی؛ بدر میں عمر بن الخطاب کے ساتھ چھوٹے ہونے پر واپس بھیجے گئے، پھر احد میں شریک ہوئے؛ چودہ غزوات میں شامل رہے۔"
  es: "Fue compañero de los Aws, al igual que su padre; fue considerado demasiado joven en Badr junto con Ibn Umar y enviado de vuelta, luego participó en Uhud; se unió a catorce o quince expediciones con el Profeta, tomó al-Rayy, estuvo con Ali en Camel y Siffin, se estableció en Kufa y murió durante el gobierno de Mus'ab ibn al-Zubayr."
