summary:
  ar: صحابي من الأوس له ولأبيه صحبة؛ استُصغر يوم بدر هو وابن عمر فرُدّا وشهد أحداً، وغزا أربع عشرة أو خمس عشرة غزوة مع النبي، وافتتح الري، وشهد الجمل وصفين مع علي، ونزل الكوفة ومات في إمارة مصعب بن الزبير.
  en: A Companion of the Aws, as was his father; he was judged too young at Badr along with Ibn Umar and sent back, then took part at Uhud; he joined fourteen or fifteen expeditions with the Prophet, took al-Rayy, was with Ali at the Camel and
    Siffin, settled in Kufa and died in the governorship of Mus'ab ibn al-Zubayr.
