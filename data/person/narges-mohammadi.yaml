summary:
  ar: "نرجس محمدي ⁦(وُلدت في ٢١ نيسان ١٩٧٢ في زنجان)⁩ ناشطة حقوقية إيرانية وحائزة جائزة نوبل للسلام سنة ٢٠٢٣ «لكفاحها ضد اضطهاد النساء في إيران»؛ درست الفيزياء التطبيقية، وعملت في الصحافة وفي مركز المدافعين عن حقوق الإنسان مع شيرين عبادي، واعتُقلت مرارًا وحُكم عليها بعقوبات طويلة، وقادت من السجن حملة ضد الحبس الانفرادي الذي سمته «التعذيب الأبيض»."
  en: "Narges Mohammadi (born 21 April 1972 in Zanjan) is an Iranian human-rights activist awarded the 2023 Nobel Peace Prize 'for her fight against the oppression of women in Iran'; trained in applied physics, she worked in journalism and at Shirin Ebadi's Defenders of Human Rights Center, has been arrested repeatedly and sentenced to long prison terms, and campaigns against the solitary confinement she named 'white torture'."
  ur: "نرگس محمدی (پیدائش 21 اپریل 1972، زنجان) ایرانی انسانی حقوق کارکن اور 2023 کے نوبل امن انعام کی یافتہ ہیں؛ انھوں نے اطلاقی طبیعیات پڑھی، صحافت اور شیرین عبادی کے انسانی حقوق مرکز میں کام کیا، باربار گرفتار ہو کر طویل سزائیں پائیں، اور قید تنہائی کے خلاف مہم چلائی جسے انھوں نے «سفید تشدد» کہا۔"
