label: { ar: "صارم الدين ابن دقماق", en: "Sarim al-Din Ibn Duqmaq" }
summary:
  ar: "صارم الدين إبراهيم بن محمد بن أيدم بن دقماق الحنفي، في شذرات الذهب ولد بمصر في حدود خمسين وسبع مئة وتزيا بزي الجند وطلب العلم وتفقه يسيراً ومال إلى الأدب ثم حبب إليه التاريخ فأكب عليه حتى كتب نحو مائتي سفر من تأليفه وغيره وكتب تاريخاً كبيراً على السنين وآخر على الحروف وأخبار الدولة التركية في مجلدين وأفرد سيرة الملك الظاهر برقوق وكتب طبقات الحنفية وامتحن بسببها وكان عارفاً بأمور الدولة التركية ومفاكراً بجملة أخبارها وتوفي سنة تسع وثمان مئة {cite:shadharat-dhahab p. 89}."
  en: "The Cairene soldier-turned-historian Ibn Duqmaq (d. 809) — wrote nearly two hundred volumes: a great annals history, an alphabetical one, two volumes on the Turkish dynasty, a separate biography of Barquq, and a Hanafi tabaqat for which he was tested {cite:shadharat-dhahab p. 89}."
