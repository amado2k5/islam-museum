label: { ar: "صارم الدين ابن دقماق", en: "Sarim al-Din Ibn Duqmaq", es: "Sarim al-Din Ibn Duqmaq", fr: "Sarim al-Din Ibn Duqmaq", ur: "صارم الدین ابن دقمق" }
summary:
  ar: "صارم الدين إبراهيم بن محمد بن أيدم بن دقماق الحنفي، في شذرات الذهب ولد بمصر في حدود خمسين وسبع مئة وتزيا بزي الجند وطلب العلم وتفقه يسيراً ومال إلى الأدب ثم حبب إليه التاريخ فأكب عليه حتى كتب نحو مائتي سفر من تأليفه وغيره وكتب تاريخاً كبيراً على السنين وآخر على الحروف وأخبار الدولة التركية في مجلدين وأفرد سيرة الملك الظاهر برقوق وكتب طبقات الحنفية وامتحن بسببها وكان عارفاً بأمور الدولة التركية ومفاكراً بجملة أخبارها وتوفي سنة تسع وثمان مئة {cite:shadharat-dhahab p. 89}."
  en: "The Cairene soldier-turned-historian Ibn Duqmaq (d. 809) — wrote nearly two hundred volumes: a great annals history, an alphabetical one, two volumes on the Turkish dynasty, a separate biography of Barquq, and a Hanafi tabaqat for which he was tested {cite:shadharat-dhahab p. 89}."
  es: "El soldado cairota convertido en historiador Ibn Duqmaq (m. 809) escribió casi doscientos volúmenes: una gran historia de anales, una alfabética, dos volúmenes sobre la dinastía turca, una biografía aparte de Barquq y un tabaqat hanafi para el cual fue puesto a prueba {cite:shadharat-dhahab p. 89}."
  fr: "Le soldat cairote devenu historien Ibn Duqmaq (mort en 809) a écrit près de deux cents volumes: une grande histoire annale, une histoire alphabétique, deux volumes sur la dynastie turque, une biographie séparée de Barquq et un tabaqat hanafite pour lequel il a été testé {cite:shadharat-dhahab p. 89}."
  ur: "کیرین کے سپاہی سے تاریخ دان ابن دقمق ⁦(متوفی 809)⁩ - نے تقریباً دو سو جلدیں لکھیں: ایک عظیم تاریخ، ایک حروف تہجی، ترک خاندان پر دو جلدیں، برقوق کی ایک الگ سوانح عمری، اور ایک حنفی طبقہ جس کے لیے اس کا تجربہ کیا گیا تھا۔ 89}۔"
