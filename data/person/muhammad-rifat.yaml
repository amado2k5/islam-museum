summary:
  ar: "قارئ قرآن مصري (1882–1950) وُلد في حي المغربلين بالقاهرة وفقد بصره صغيرا، وهو أول من قرأ القرآن في الإذاعة المصرية عند افتتاحها سنة 1934، وقارئ مسجد فاضل باشا من 1918 حتى أقعده مرض الحنجرة سنة 1943. لُقّب «قيثارة السماء»، وحفظت أسطوانات زكريا باشا مهران معظم تراثه الصوتي."
  en: "Egyptian Qur'an reciter (1882–1950), born in Cairo's al-Maghreblin quarter and blinded in early childhood. He was the first to recite the Qur'an on Egyptian Radio at its inauguration in 1934 and was reciter of Fadil Pasha Mosque from 1918 until a throat illness ended his public recitation in 1943. Admirers called him the 'Harp of Heaven', and Zakariyya Pasha Mahran's gramophone discs preserved most of his recorded legacy."
  ur: "مصری قاریِ قرآن (1882ء–1950ء)، جو قاہرہ کے محلہ مغربلین میں پیدا ہوئے اور بچپن میں بینائی سے محروم ہو گئے۔ وہ 1934 میں مصری ریڈیو کے افتتاح پر قرآن پڑھنے والے پہلے قاری تھے اور 1918 سے جامع فاضل پاشا کے قاری رہے، یہاں تک کہ 1943 میں حلق کی بیماری نے ان کی عوامی تلاوت روک دی۔ انہیں «قیثارۃ السماء» کہا جاتا ہے، اور زکریا پاشا مہران کے گراموفون ریکارڈوں نے ان کا بیشتر صوتی ورثہ محفوظ رکھا۔"
