summary:
  ar: "سلمان رشدي (وُلد 19 يونيو 1947) روائي بريطاني من أصل هندي، صاحب «أطفال منتصف الليل» (1981) الفائزة بجائزة البوكر. أثارت روايته «الآيات الشيطانية» (1988) احتجاجات واسعة وفتوى بإهدار دمه سنة 1989 عاش بعدها سنوات تحت الحماية، ونال لقب فارس سنة 2007، ونجا سنة 2022 من محاولة اغتيال فقد فيها إحدى عينيه. صرّح بنفسه مرارًا عبر عقود بأنه لا يؤمن بقوى غيبية ووصف نفسه بأنه «ملحد متشدد»."
  en: "Salman Rushdie (born 19 June 1947) is an Indian-born British novelist, author of Midnight's Children (1981), which won the Booker Prize. His novel The Satanic Verses (1988) provoked widespread protests and a 1989 fatwa calling for his death, after which he lived for years under protection; he was knighted in 2007 and survived a 2022 assassination attempt that cost him an eye. Across decades he has stated in his own words that he does not believe in supernatural entities and has called himself a 'hardline atheist'."
  ur: "سلمان رشدی (پیدائش 19 جون 1947ء) ہندوستانی نژاد برطانوی ناول نگار ہیں، جن کے ناول «مڈنائٹس چلڈرن» (1981ء) نے بکر انعام جیتا۔ ان کے ناول «شیطانی آیات» (1988ء) پر وسیع احتجاج ہوا اور 1989ء میں ان کے قتل کا فتویٰ جاری ہوا، جس کے بعد وہ برسوں حفاظتی تحویل میں رہے؛ 2007ء میں انہیں نائٹ کا خطاب ملا اور 2022ء میں قاتلانہ حملے میں ان کی ایک آنکھ ضائع ہو گئی۔ وہ کئی دہائیوں سے اپنے الفاظ میں کہتے آئے ہیں کہ وہ مافوق الفطرت ہستیوں پر یقین نہیں رکھتے اور خود کو «کٹر ملحد» کہتے ہیں۔"
