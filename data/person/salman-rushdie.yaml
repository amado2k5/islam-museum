summary:
  ar: "سلمان رشدي ⁦(وُلد 19 يونيو 1947)⁩ روائي بريطاني من أصل هندي، صاحب «أطفال منتصف الليل» (1981) الفائزة بجائزة البوكر. أثارت روايته «الآيات الشيطانية» (1988) احتجاجات واسعة وفتوى بإهدار دمه سنة 1989 عاش بعدها سنوات تحت الحماية، ونال لقب فارس سنة 2007، ونجا سنة 2022 من محاولة اغتيال فقد فيها إحدى عينيه. صرّح بنفسه مرارًا عبر عقود بأنه لا يؤمن بقوى غيبية ووصف نفسه بأنه «ملحد متشدد»."
  en: "Salman Rushdie (born 19 June 1947) is an Indian-born British novelist, author of Midnight's Children (1981), which won the Booker Prize. His novel The Satanic Verses (1988) provoked widespread protests and a 1989 fatwa calling for his death, after which he lived for years under protection; he was knighted in 2007 and survived a 2022 assassination attempt that cost him an eye. Across decades he has stated in his own words that he does not believe in supernatural entities and has called himself a 'hardline atheist'."
  ur: "سلمان رشدی ⁦(پیدائش 19 جون 1947ء)⁩ ہندوستانی نژاد برطانوی ناول نگار ہیں، جن کے ناول «مڈنائٹس چلڈرن» ⁦(1981ء)⁩ نے بکر انعام جیتا۔ ان کے ناول «شیطانی آیات» ⁦(1988ء)⁩ پر وسیع احتجاج ہوا اور 1989ء میں ان کے قتل کا فتویٰ جاری ہوا، جس کے بعد وہ برسوں حفاظتی تحویل میں رہے؛ 2007ء میں انہیں نائٹ کا خطاب ملا اور 2022ء میں قاتلانہ حملے میں ان کی ایک آنکھ ضائع ہو گئی۔ وہ کئی دہائیوں سے اپنے الفاظ میں کہتے آئے ہیں کہ وہ مافوق الفطرت ہستیوں پر یقین نہیں رکھتے اور خود کو «کٹر ملحد» کہتے ہیں۔"
  es: "Salman Rushdie (nacido el 19 de junio de 1947) es un novelista británico de origen indio, autor de Los hijos de la medianoche (1981), obra ganadora del Premio Booker. Su novela Los versos satánicos (1988) provocó protestas generalizadas y una fatua en 1989 que pedía su muerte, tras lo cual vivió durante años bajo protección. Fue nombrado caballero en 2007 y sobrevivió a un intento de asesinato en 2022 que le costó un ojo. A lo largo de las décadas, ha declarado públicamente que no cree en entidades sobrenaturales y se ha autodenominado «ateo radical»."
  fr: "Salman Rushdie (né le 19 juin 1947) est un romancier britannique d'origine indienne, auteur de <i>Les Enfants de minuit</i> (1981), qui a remporté le prix Booker. Son roman <i>Les Versets sataniques</i> (1988) a provoqué de vastes manifestations et une fatwa en 1989 appelant à sa mort, après quoi il a vécu plusieurs années sous protection policière. Il a été anobli en 2007 et a survécu à une tentative d'assassinat en 2022 au cours de laquelle il a perdu un œil. Depuis des décennies, il affirme ne pas croire aux entités surnaturelles et se qualifie d'« athée convaincu »."
  tr: "Salman Rushdie (d. 19 Haziran 1947), Hint kökenli Britanyalı bir romancıdır ve Booker Ödülü kazanan \"Midnight Children\" (1981) adlı romanın yazarıdır. \"The Satanic Verses\" (1988) adlı romanı, 1989'da geniş çaplı protestolara ve kanının dökülmesi çağrısında bulunan bir fetvaya yol açtı. Daha sonra yıllarca koruma altında kaldı, 2007'de şövalye unvanı aldı ve 2022'de bir gözünü kaybettiği bir suikast girişiminden sağ kurtuldu. On yıllar boyunca doğaüstü güçlere inanmadığını ve kendisini \"katı bir ateist\" olarak tanımladığını defalarca ifade etti."
  id: "Salman Rushdie (lahir 19 Juni 1947) adalah seorang novelis Inggris keturunan India, penulis \"Midnight Children\" (1981), novel pemenang Booker Prize. Novelnya \"The Satanic Verses\" (1988) memicu protes luas dan fatwa yang menyerukan agar darahnya ditumpahkan pada tahun 1989. Ia kemudian menghabiskan bertahun-tahun di bawah perlindungan diri, dianugerahi gelar kebangsawanan pada tahun 2007, dan selamat dari upaya pembunuhan pada tahun 2022 yang menyebabkan ia kehilangan salah satu matanya. Ia berulang kali menyatakan selama beberapa dekade bahwa ia tidak percaya pada kekuatan supranatural dan menggambarkan dirinya sebagai \"ateis yang ketat.\""
