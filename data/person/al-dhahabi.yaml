summary:
  ar: "شمس الدين أبو عبد الله محمد بن أحمد بن عثمان بن قايماز الذهبي، التركماني الأصل الفارقي الدمشقي الشافعي (٦٧٣-٧٤٨هـ)؛ حافظ عصره ومؤرخه صاحب «تاريخ الإسلام» و«سير أعلام النبلاء» و«ميزان الاعتدال» و«تذكرة الحفاظ»، سُمي «محدث العصر» و«خاتم الحفاظ». سمع الحديث بدمشق من سنة ٦٩٠هـ ورحل إلى بعلبك ومصر ومكة وحلب ونابلس والإسكندرية والقاهرة حتى جاوز شيوخه ألفاً وثلاثمائة، ودرّس بتربة أم الصالح والنفيسية، وأضرّ قبل موته بسنين {cite:durar-kamina-jil-1993 3/336-338} {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-216}."
  en: "Shams al-Din Abu Abd Allah Muhammad ibn Ahmad ibn Uthman ibn Qaymaz al-Dhahabi (673-748 AH), of Turkmen origin, al-Fariqi, of Damascus, a Shafi'i; the hadith master and historian of his age, author of Tarikh al-Islam, Siyar A'lam al-Nubala', Mizan al-I'tidal and Tadhkirat al-Huffaz, styled 'the traditionist of the age' and 'the seal of the huffaz'. He heard hadith at Damascus from 690 and journeyed to Baalbek, Egypt, Mecca, Aleppo, Nablus, Alexandria and Cairo until his teachers passed 1,300; he taught at the Umm al-Salih turba and al-Nafisiyya, and went blind some years before his death {cite:durar-kamina-jil-1993 3/336-338} {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-216}."
  ur: "شمس الدین ابو عبد اللہ محمد بن احمد بن عثمان بن قایماز ذہبی (673-748ھ)، اصل میں ترکمان، فارقی، دمشقی، شافعی؛ اپنے عہد کے حافظ اور مورخ، صاحبِ «تاریخ الاسلام»، «سیر اعلام النبلاء»، «میزان الاعتدال» اور «تذکرۃ الحفاظ»، جنھیں «محدث العصر» اور «خاتم الحفاظ» کہا جاتا ہے۔ انہوں نے 690ھ سے دمشق میں حدیث سنی اور بعلبک، مصر، مکہ، حلب، نابلوس، اسکندریہ اور قاہرہ کے سفر کیے یہاں تک کہ ان کے شیوخ تیرہ سو سے تجاوز کر گئے؛ تربہ ام الصالح اور نفیسہ میں درس دیا اور وفات سے کچھ برس پہلے نابینا ہوئے {cite:durar-kamina-jil-1993 3/336-338} {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-216}۔"
born: { hijri: "0673-02-03", edtf: "1274-10-05~", calendar: julian, precision: day, status: tradition, derived: true, note: "ثالث ربيع الآخر ٦٧٣هـ {cite:durar-kamina-jil-1993 3/336}؛ وقيل أول ربيع الآخر أو ثالثه = ٥ أو ٧ أكتوبر ١٢٧٤م {cite:encyclopaedia-of-islam-2 vol. 2 p. 214}؛ التحويل مشتق.", sources: [source/durar-kamina-jil-1993, source/encyclopaedia-of-islam-2] }
