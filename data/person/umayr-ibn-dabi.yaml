label: { ar: "عمير بن ضابىء البرجمي", en: "'Umayr ibn Dabi' al-Burjumi", es: "'Umayr ibn Dabi' al-Burjumi", fr: "'Umayr ibn Dabi' al-Burjumi", ur: "عمیر بن دابی البرجمی۔" }
summary:
  ar: "شيخ كبير من أشراف أهل الكوفة من بعث المهلب، كان قد وثب على عثمان بن عفان وهو مقتول فكسر ضلعاً من أضلاعه، فلما مر في عرض الحجاج بدلاً عنه لولده ذكره عنبسة بن سعيد ومالك بن أسماء بذلك فقتله الحجاج ليصح البعث إلى الأزارقة، فخرج الناس كل صعب وذلول إلى المهلب حتى سقط بعضهم في الفرات على الجسر {cite:muruj-al-dhahab p. 121-122}."
  en: "A Kufan elder who had broken one of Uthman's ribs after his death — identified to al-Hajjaj at the levy and beheaded, after which the conscripts stampeded to al-Muhallab over the bridge {cite:muruj-al-dhahab p. 121-122}."
  es: "Un anciano de Kufa que le había roto una costilla a Uthman después de su muerte, fue identificado como al-Hajjaj en el reclutamiento y decapitado, tras lo cual los reclutas corrieron en estampida hacia al-Muhallab cruzando el puente {cite:muruj-al-dhahab p. 121-122}."
  fr: "Un ancien de Kufan qui avait cassé une des côtes d'Uthman après sa mort – identifié à al-Hajjaj lors de la levée et décapité, après quoi les conscrits se sont précipités vers al-Muhallab par-dessus le pont {cite:muruj-al-dhahab p. 121-122}."
  ur: "کوفان کے ایک بزرگ جس نے عثمان کی موت کے بعد ان کی پسلیوں میں سے ایک کو توڑ دیا تھا - لیوی پر اس کی شناخت الحجاج سے ہوئی اور اس کا سر قلم کر دیا گیا، جس کے بعد بھرتیوں نے پل کے اوپر المحلب کی طرف مہر ثبت کردی۔ 121-122}۔"
  tr: "Al-Muhallab misyonundan Kufa soylularından kıdemli bir şeyh, Uthman bin Affan öldürülürken üzerine atlamış ve kaburgasını kırmıştır. Al-Hajjaj, oğlu Anbasa ibn Sa'id ve Malik ibn Asma'nın yanından geçtiğinde, Al-Hajjaj tarafından dirilişi gerekçelendirmek için anılmıştır. Halk, Al-Muhaleb'e büyük zorluk ve aşağılanma içinde doğru ilerlemiştir, ta ki bazıları köprüde Fırat Nehri'ne düşene kadar {cite:muruj-al-dhahab, s. 121-122}."
  id: "Seorang sheikh senior dari bangsawan Kufa dari misi Al-Muhallab, yang melompat ke arah Uthman ibn Affan saat ia terbunuh, hingga tulang rusuk patah. Ketika Al-Hajjaj melewati putranya Anbasa ibn Sa'id dan Malik ibn Asma, ia disebutkan oleh Al-Hajjaj untuk membenarkan kebangkitan Al-Azariqa. Orang-orang pergi dengan kesulitan dan penghinaan besar menuju Al-Muhallab, hingga beberapa dari mereka jatuh ke Sungai Efrat di jembatan {cite:muruj-al-dhahab, hlm. 121-122}."
