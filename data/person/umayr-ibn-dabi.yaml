summary:
  ar: "شيخ كبير من أشراف أهل الكوفة من بعث المهلب، كان قد وثب على عثمان بن عفان وهو مقتول فكسر ضلعاً من أضلاعه، فلما مر في عرض الحجاج بدلاً عنه لولده ذكره عنبسة بن سعيد ومالك بن أسماء بذلك فقتله الحجاج ليصح البعث إلى الأزارقة، فخرج الناس كل صعب وذلول إلى المهلب حتى سقط بعضهم في الفرات على الجسر {cite:muruj-al-dhahab p. 121-122}."
  en: "A Kufan elder who had broken one of Uthman's ribs after his death — identified to al-Hajjaj at the levy and beheaded, after which the conscripts stampeded to al-Muhallab over the bridge {cite:muruj-al-dhahab p. 121-122}."
