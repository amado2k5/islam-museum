summary:
  ar: "خليفة الموحدين ابن أبي يوسف يعقوب المنصور؛ كاتبه الثوار بالمغرب وأهل العدوة وأحكم ولاياتهم، ونازل ابن غانية بإفريقية وتسلم المهدية سنة 603هـ وولى على أشغالها أبا محمد بن الشيخ أبي حفص، ثم خرج من مراكش سنة 609هـ إلى أشبيلية مستعداً للغزو فانكشف المسلمون يوم العقاب أواخر صفر منها وهلك راجعاً إلى مراكش في شعبان سنة 610هـ {cite:tarikh-ibn-khaldun-ibar p. 1681-1682}."
  en: "The Almohad caliph Muhammad al-Nasir b. al-Mansur; fought Ibn Ghaniya in Ifriqiya, received Mahdiyya 603, marched to Seville 609 and was broken at al-Uqab at the end of Safar, dying at Marrakesh months later {cite:tarikh-ibn-khaldun-ibar p. 1681-1682}."
