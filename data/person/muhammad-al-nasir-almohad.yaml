id: person/muhammad-al-nasir-almohad
class: person
roles: [caliph]
label: { ar: "محمد الناصر بن المنصور الموحدي" }
summary:
  ar: "خليفة الموحدين ابن أبي يوسف يعقوب المنصور؛ كاتبه الثوار بالمغرب وأهل العدوة وأحكم ولاياتهم، ونازل ابن غانية بإفريقية وتسلم المهدية سنة 603هـ وولى على أشغالها أبا محمد بن الشيخ أبي حفص، ثم خرج من مراكش سنة 609هـ إلى أشبيلية مستعداً للغزو فانكشف المسلمون يوم العقاب أواخر صفر منها وهلك راجعاً إلى مراكش في شعبان سنة 610هـ {cite:tarikh-ibn-khaldun-ibar p. 1681-1682}."
  en: "The Almohad caliph Muhammad al-Nasir b. al-Mansur; fought Ibn Ghaniya in Ifriqiya, received Mahdiyya 603, marched to Seville 609 and was broken at al-Uqab at the end of Safar, dying at Marrakesh months later {cite:tarikh-ibn-khaldun-ibar p. 1681-1682}."
  es: "El califa almohade Muhammad al-Nasir b. al-Mansur; luchó contra Ibn Ghaniya en Ifriqiya, recibió la Mahdiyya en 603, marchó a Sevilla en 609 y fue derrotado en al-Uqab al final de Safar, muriendo en Marrakech meses después {cite:tarikh-ibn-khaldun-ibar p. 1681-1682}."
  fr: "Le calife almohade Muhammad al-Nasir b. al-Mansur; a combattu Ibn Ghaniya à Ifriqiya, a reçu la Mahdiyya en 603, a marché jusqu'à Séville en 609 et a été vaincu à al-Uqab à la fin de Safar, mourant à Marrakech quelques mois plus tard {cite:tarikh-ibn-khaldun-ibar p. 1681-1682}."
  ur: "المحدث خلیفہ محمد النصیر بی۔ المنصور ابن غنیہ سے عفریقیہ میں جنگ کی، 603 کو مہدیہ حاصل کیا، 609 میں سیویل کی طرف کوچ کیا اور صفر کے آخر میں العقاب میں ٹوٹ گیا، مہینوں بعد مراکیش میں مر گیا۔ 1681-1682}۔"
  tr: "Almohadların halifesi İbn Ebi Yusuf Ya'qub el-Mansur; Mağrip'teki devrimciler ve el-Adva halkı için onun kâtipiydi ve onların eyaletlerini güçlendirdi. İbn Ghaniyya, 603 Hicri'de Ifriqiye'ye yerleşti ve Mahdizliği devraldı, Ebu Muhammed bin Şeyh Ebi Hafs'ı yönetici olarak atadı. Daha sonra 609 Hicri'de Marakeş'ten ayrılarak Sevilla'ya gitti, işgal için hazırlık yaptı. Müslümanlar, geç Safar'daki ceza gününde ifşa edildi ve o da Şa'ban 610 Hicri'de Marakeş'e dönerken öldü {alıntı:Tarikh-ibn-khaldun-ibar s. 1681-1682}."
  id: "Khalifah Almohad, Ibn Abi Yusuf Ya'qub al-Mansur; juru tulisnya untuk para revolusioner di Maghreb dan rakyat al-Adwa, dan ia memperkuat provinsi mereka. Ibn Ghaniyya menetap di Ifriqiya dan mengambil alih Mahdisme pada tahun 603 H, menunjuk Abu Muhammad ibn Sheikh Abi Hafs sebagai administratornya. Ia kemudian meninggalkan Marrakesh pada tahun 609 H menuju Sevilla, mempersiapkan invasi. Muslim terbongkar pada hari hukuman di akhir Safar, dan ia meninggal saat kembali ke Marrakesh pada Sha'ban 610 H {cite:Tarikh-ibn-khaldun-ibar hlm. 1681-1682}."
