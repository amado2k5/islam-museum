summary:
  ar: رجل من الدهميين من همدان حبسه محمد بن عبيد الله بصعدة لإفساده، فأخرجه نفر من الأكيليين.
  en: A man of the Duhmis of Hamdan whom Muhammad ibn Ubaydallah jailed at Sa'da as a troublemaker and whom some of al-Akilis got out.
  ur: ہمدان کے دہمیوں میں سے ایک شخص جسے محمد بن عبید اللہ نے فساد کے سبب صعدہ میں قید کیا اور اکیلیوں کے چند لوگوں نے نکال لیا۔
  es: "Un hombre de la tribu Duhmis de Hamdan, a quien Muhammad ibn Ubaydallah encarceló en Sa'da por ser un alborotador y a quien algunos de los al-Akilis lograron liberar."
  fr: "Un homme des Duhmis de Hamdan que Muhammad ibn Ubaydallah a emprisonné à Sa'da comme fauteur de troubles et que certains d'al-Akilis ont fait libérer."
  tr: "Hamdan'dan Dahmailerden bir adam, Muhammed bin Ubeyd Allah tarafından Sa'dah'ta yozlaşma nedeniyle hapsedildi ve bir grup Akili onu ortadan kaldırdı."
  id: "Seorang pria dari Dahmais dari Hamdan dipenjara oleh Muhammad ibn Ubayd Allah di Sa'dah karena korupsi, dan sekelompok Akilis membunuhnya."
