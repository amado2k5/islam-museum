summary:
  ar: "مؤرخ وأديب مغربي من قبيلة إداوكنسوس في سوس، ولد سنة 1211هـ/1797م، وعمل كاتبًا ثم وزيرًا في البلاط الشريفي، وتوفي بمراكش سنة 1294هـ/1877م. من أشهر آثاره «الجيش العرمرم الخماسي في دولة أولاد مولانا علي السجلماسي»، وهو تاريخ عام للإسلام يخص فيه تاريخ المغرب والأسرة العلوية حتى سنة 1282هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
  en: "Moroccan historian and man of letters from the Ida u Kansus of Sus, born 1211/1797. He served the Sharifian court as secretary and then as vizier from 1236/1820, and died at Marrakesh in 1294/1877. His major work, al-Jaysh al-'aramram al-khumasi, is a general history of Islam with the history of Morocco and the 'Alawi dynasty up to 1282/1865 {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
  fr: "Historien et homme de lettres marocain des Ida u Kansus du Sous, né en 1211 H/1797 ap. J.-C. Il servit la cour chérifienne comme secrétaire puis vizir dès 1236 H/1820 ap. J.-C., et mourut à Marrakech en 1294 H/1877 ap. J.-C. Son œuvre majeure, al-Jaysh al-'aramram al-khumasi, est une histoire générale de l'islam comprenant l'histoire du Maroc et de la dynastie alaouite jusqu'en 1282 H/1865 ap. J.-C. {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
  es: "Historiador y hombre de letras marroquí originario de Ida u Kansus de Sus, nacido en 1211/1797. Sirvió en la corte sharifiana como secretario y luego como visir desde 1236/1820, y falleció en Marrakech en 1294/1877. Su obra principal, al-Jaysh al-'aramram al-khumasi, es una historia general del Islam que incluye la historia de Marruecos y la dinastía 'Alawi hasta 1282/1865 {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
  ur: "مراکش کے مورخ اور سوس کے آئیڈا یو کینسس کے خطوط کا آدمی، پیدائش 1211/1797۔ اس نے شریفین دربار میں سیکرٹری اور پھر 1236/1820 تک بطور وزیر خدمات انجام دیں اور 1294/1877 میں مراکیش میں وفات پائی۔ ان کی بڑی تصنیف، الجیش الارمرم الخماسی، مراکش اور علوی خاندان کی تاریخ کے ساتھ 1282/1865 تک اسلام کی عمومی تاریخ ہے۔ 1 ص۔ 337}۔"
  tr: "Fas'ın Souss şehrindeki İdauknassous kabilesinden olan, 1211 Hicri/1797 Miladi yılında doğmuş Faslı bir tarihçi ve yazar. Şerifî sarayında önce kâtip, sonra da bakan olarak görev yapmış ve 1294 Hicri/1877 Miladi yılında Marakeş'te vefat etmiştir. En ünlü eserleri arasında, Fas ve Alevi hanedanlığının 1282 Hicri yılına kadar olan tarihine odaklandığı genel bir İslam tarihi olan \"Mevlana Ali el-Sijilmasi'nin Torunlarının Devletinde Beş Güçlü Ordu\" bulunmaktadır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}"
  id: "Seorang sejarawan dan penulis Maroko dari suku Idaouknassous di Souss, lahir pada tahun 1211 H/1797 M, ia bekerja sebagai juru tulis dan kemudian sebagai menteri di istana Syarif, dan meninggal di Marrakesh pada tahun 1294 H/1877 M. Di antara karya-karyanya yang paling terkenal adalah \"Pasukan Lima Orang Perkasa di Negara Keturunan Mawlana Ali al-Sijilmasi,\" sebuah sejarah umum Islam di mana ia berfokus pada sejarah Maroko dan dinasti Alawite hingga tahun 1282 H {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
