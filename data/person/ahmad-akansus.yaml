summary:
  ar: "مؤرخ وأديب مغربي من قبيلة إداوكنسوس في سوس، ولد سنة 1211هـ/1797م، وعمل كاتبًا ثم وزيرًا في البلاط الشريفي، وتوفي بمراكش سنة 1294هـ/1877م. من أشهر آثاره «الجيش العرمرم الخماسي في دولة أولاد مولانا علي السجلماسي»، وهو تاريخ عام للإسلام يخص فيه تاريخ المغرب والأسرة العلوية حتى سنة 1282هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
  en: "Moroccan historian and man of letters from the Ida u Kansus of Sus, born 1211/1797. He served the Sharifian court as secretary and then as vizier from 1236/1820, and died at Marrakesh in 1294/1877. His major work, al-Jaysh al-'aramram al-khumasi, is a general history of Islam with the history of Morocco and the 'Alawi dynasty up to 1282/1865 {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
