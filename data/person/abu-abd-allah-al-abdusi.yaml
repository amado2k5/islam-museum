label:
  ar: "أبو عبد الله العبدوسي"
  en: "Abu Abd Allah al-Abdusi"
  fr: "Abu Abd Allah al-Abdusi"
  es: "Abu Abd Allah al-Abdusi"
  ur: "ابو عبد اللہ العبدوسی"
roles: [scholar, jurist]
gender: male
summary:
  ar: "محمد بن موسى بن محمد بن معطي العبدوسي، أبو عبد الله بن أبي عمران، أخذ عن والده أبي عمران موسى العبدوسي وغيره، وعنه ابنه عبد الله وغيره، ووصفه بعضهم بالفقيه المدرس العالم الخيّر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16640}"
  en: "Muhammad ibn Musa ibn Muhammad ibn Mu'ti al-Abdusi, Abu Abd Allah son of Abu Imran, who studied with his father Abu Imran Musa al-Abdusi and others, and whose son Abd Allah and others studied with him. Some described him as a jurist, teacher, scholar and good man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16640}"
  fr: "Muhammad ibn Musa ibn Muhammad ibn Mu'ti al-Abdusi, Abu Abd Allah fils d'Abu Imran, qui étudia auprès de son père Abu Imran Musa al-Abdusi et d'autres, et auprès de qui étudièrent son fils Abd Allah et d'autres. Certains le décrivirent comme juriste, enseignant, savant et homme de bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16640}"
  es: "Muhammad ibn Musa ibn Muhammad ibn Mu'ti al-Abdusi, Abu Abd Allah hijo de Abu Imran, estudió con su padre Abu Imran Musa al-Abdusi y otros, y cuyo hijo Abd Allah y otros estudiaron con él. Algunos lo describieron como jurista, maestro, erudito y hombre virtuoso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16640}"
  ur: "محمد بن موسیٰ بن محمد بن مطیع العبدوسی، ابو عبد اللہ ولد ابو عمران، جس نے اپنے والد ابو عمران موسیٰ العبدوسی اور دیگر کے ساتھ تعلیم حاصل کی اور جن کے بیٹے عبداللہ اور دیگر نے ان سے تعلیم حاصل کی۔ بعض نے انہیں فقیہ، استاد، عالم اور نیک آدمی قرار دیا۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص16640}"
  tr: "Muhammed ibn Musa ibn Muhammed ibn Mu'ti el-Abdusi, Ebu Abdullah ibn Abi İmran, babası Ebu İmran Musa el-Abdusi ve diğerlerinin yanında eğitim gördü. Oğlu Abdullah ve diğerleri de onun yanında eğitim aldı. Bazıları onu bilgili, dindar ve erdemli bir hukukçu ve öğretmen olarak tanımlamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16640}"
  id: "Muhammad ibn Musa ibn Muhammad ibn Mu'ti al-'Abdusi, Abu 'Abd Allah ibn Abi 'Imran, belajar di bawah bimbingan ayahnya, Abu 'Imran Musa al-'Abdusi, dan lainnya. Putranya, 'Abd Allah, dan lainnya juga belajar di bawah bimbingannya. Beberapa orang menggambarkannya sebagai seorang ahli hukum dan guru yang berilmu, saleh, dan berbudi luhur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16640}"
