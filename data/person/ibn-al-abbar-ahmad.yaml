died: { edtf: "1071", hijri: "0463", calendar: julian, precision: month, status: tradition, derived: true, note: "وفاته في صدر رجب سنة ثلاث وستين وأربعمائة بمدينة إشبيلية ودُفن بها {cite:wafayat-ayan}." }
summary:
  ar: "أبو جعفر أحمد بن محمد الخولاني الأندلسي الإشبيلي المعروف بابن الأبار؛ الشاعر المشهور؛ كان من شعراء المعتضد بن عباد اللخمي صاحب إشبيلية المجيدين في فنونه؛ وكان عالماً فقيهاً وصنّف وله ديوان شعر؛ وذكره ابن بسام في الذخيرة {cite:wafayat-ayan}."
  en: "Abu Ja'far Ahmad b. Muhammad al-Khuwalani, 'Ibn al-Abbar' (d. 463, Seville) — celebrated poet of al-Mu'tadid b. Abbad's court, also a faqih and author with a diwan; distinct from the later Valencian Ibn al-Abbar {cite:wafayat-ayan}."
  es: "Abu Ja'far Ahmad b. Muhammad al-Khuwalani, 'Ibn al-Abbar' (m. 463, Sevilla), célebre poeta de al-Mu'tadid b. la corte de Abbad, también faqih y autor con diwan; distinto del valenciano posterior Ibn al-Abbar {cita:wafayat-ayan}."
  fr: "Abou Ja'far Ahmad b. Muhammad al-Khuwalani, « Ibn al-Abbar » (d. 463, Séville) — célèbre poète d'al-Mu'tadid b. la cour d'Abbad, également faqih et auteur avec un diwan; distinct du valencien ultérieur Ibn al-Abbar {cite: wafayat-ayan}."
  ur: "ابو جعفر احمد بی۔ محمد الخولانی، 'ابن العبر' ⁦(متوفی 463، سیویل)⁩ - المعتدد کے مشہور شاعر۔ عباد کا دربار، فقیہ اور دیوان کے ساتھ مصنف بھی۔ بعد کے والینسیئن ابن العبر سے الگ {حوالہ: وفایت-عیان}"
  tr: "Ebu Ca'far Ahmed bin Muhammed el-Khawlani el-Endülüs el-İşbil, İbn el-Abar olarak bilinir; ünlü şair; Sevilla'nın fenlerinde ustası olan el-Mu'tadid ibn 'Abbad al-Lakhmi'nin şairleri arasındaydı; bir bilgin, hukukçu, yazar ve şiir yazarıydı; İbn Bassam ise onu el-Dhakhira'da (atıf:wafayat-ayan} adlı eserinde anmıştır."
  id: "Abu Ja'far Ahmad ibn Muhammad al-Khawlani al-Andalusi al-Ishbil, dikenal sebagai Ibn al-Abar; penyair terkenal; ia termasuk di antara penyair al-Mu'tadid ibn 'Abbad al-Lakhmi, ahli Sevilla dalam ilmu pengetahuannya; ia adalah seorang cendekiawan, ahli hukum, penulis, dan penulis puisi; dan Ibn Bassam menyebutkannya dalam al-Dhakhira {cite:wafayat-ayan}."
