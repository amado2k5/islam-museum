summary:
  ar: "خبيرة تنمية وناشطة صومالية، وُلدت سنة 1972 في ثيكا بكينيا لأبوين صوماليين وهُجّرت أسرتها إلى مقديشو سنة 1989 ثم لجأت إلى فنلندا سنة 1990، حيث تعلّمت القراءة متأخرة فصارت ممرضة ثم حازت ماجستيرين ومنحة في جامعة هارفارد؛ عملت في الأمم المتحدة وكانت سنة 2016 أول امرأة تترشح لرئاسة الصومال ببرنامج لمكافحة الفساد وتشويه الإناث ونظام المحاصصة العشائرية."
  en: "Somali development expert and social-change activist, born 1972 in Thika, Kenya, to Somali parents; her family was deported to Mogadishu in 1989 and she fled as a refugee to Finland in 1990, where she learned to read at fourteen and became a critical-care nurse with two master's degrees and a Harvard fellowship. She worked for the United Nations and in 2016 became the first woman to run for President of Somalia on a platform of anti-corruption, ending female genital mutilation and dismantling the clan-based quota system."
  ur: "صومالی ترقیاتی ماہر اور سماجی تبدیلی کی کارکن، 1972 میں کینیا کے شہر تھیکا میں صومالی والدین کے ہاں پیدا ہوئیں؛ خاندان کو 1989 میں مغادیشو منتقل کر دیا گیا اور وہ 1990 میں فن لینڈ مہاجر ہو کر آئیں، جہاں چودہ برس کی عمر میں پڑھنا سیکھا اور دو ماسٹرز ڈگریوں اور ہارورڈ فیلوشپ کے ساتھ نرس بنیں۔ اقوامِ متحدہ میں کام کیا اور 2016 میں صومال کی صدارت کے لیے کھڑی ہونے والی پہلی خاتون بنیں؛ ان کا منشور بدعنوانی کے خاتمے، ختنۂ نساء کے ابطال اور قبائلی کوٹہ نظام کے خاتمے پر مبنی تھا۔"
