summary:
  ar: "خبيرة تنمية وناشطة صومالية، وُلدت سنة 1972 في ثيكا بكينيا لأبوين صوماليين وهُجّرت أسرتها إلى مقديشو سنة 1989 ثم لجأت إلى فنلندا سنة 1990، حيث تعلّمت القراءة متأخرة فصارت ممرضة ثم حازت ماجستيرين ومنحة في جامعة هارفارد؛ عملت في الأمم المتحدة وكانت سنة 2016 أول امرأة تترشح لرئاسة الصومال ببرنامج لمكافحة الفساد وتشويه الإناث ونظام المحاصصة العشائرية."
  en: "Somali development expert and social-change activist, born 1972 in Thika, Kenya, to Somali parents; her family was deported to Mogadishu in 1989 and she fled as a refugee to Finland in 1990, where she learned to read at fourteen and became a critical-care nurse with two master's degrees and a Harvard fellowship. She worked for the United Nations and in 2016 became the first woman to run for President of Somalia on a platform of anti-corruption, ending female genital mutilation and dismantling the clan-based quota system."
  ur: "صومالی ترقیاتی ماہر اور سماجی تبدیلی کی کارکن، 1972 میں کینیا کے شہر تھیکا میں صومالی والدین کے ہاں پیدا ہوئیں؛ خاندان کو 1989 میں مغادیشو منتقل کر دیا گیا اور وہ 1990 میں فن لینڈ مہاجر ہو کر آئیں، جہاں چودہ برس کی عمر میں پڑھنا سیکھا اور دو ماسٹرز ڈگریوں اور ہارورڈ فیلوشپ کے ساتھ نرس بنیں۔ اقوامِ متحدہ میں کام کیا اور 2016 میں صومال کی صدارت کے لیے کھڑی ہونے والی پہلی خاتون بنیں؛ ان کا منشور بدعنوانی کے خاتمے، ختنۂ نساء کے ابطال اور قبائلی کوٹہ نظام کے خاتمے پر مبنی تھا۔"
  es: "Experta en desarrollo y activista por el cambio social somalí, nacida en 1972 en Thika, Kenia, de padres somalíes; su familia fue deportada a Mogadiscio en 1989 y huyó como refugiada a Finlandia en 1990, donde aprendió a leer a los catorce años y se convirtió en enfermera de cuidados intensivos con dos maestrías y una beca de Harvard. Trabajó para las Naciones Unidas y en 2016 se convirtió en la primera mujer en postularse a la presidencia de Somalia con una plataforma anticorrupción, la erradicación de la mutilación genital femenina y el desmantelamiento del sistema de cuotas basado en clanes."
  fr: "Experte en développement et militante pour le changement social, née en 1972 à Thika, au Kenya, de parents somaliens, sa famille fut expulsée vers Mogadiscio en 1989. Réfugiée en Finlande en 1990, elle y apprit à lire à quatorze ans et devint infirmière en soins intensifs. Titulaire de deux masters et d'une bourse de recherche de Harvard, elle travailla pour les Nations Unies. En 2016, elle devint la première femme candidate à la présidence de la Somalie, défendant un programme axé sur la lutte contre la corruption, l'abolition des mutilations génitales féminines et le démantèlement du système de quotas claniques."
  tr: "1972'de Kenya'nın Theka kentinde Somalili ebeveynlerin çocuğu olarak doğan Somalili kalkınma uzmanı ve aktivist. Ailesi 1989'da Mogadişu'ya göç etti, ardından 1990'da Finlandiya'ya sığındı; burada geç saatlerde okumayı öğrendi, hemşire oldu ve ardından Harvard Üniversitesi'nden yüksek lisans ve burs kazandı. Birleşmiş Milletler'de çalıştı ve 2016'da yolsuzluk, kadın sünneti ve kabile kota sistemiyle mücadele programı aracılığıyla Somali cumhurbaşkanlığına aday olan ilk kadın oldu."
  id: "Seorang ahli pembangunan dan aktivis Somalia, lahir pada tahun 1972 di Theka, Kenya, dari orang tua Somalia. Keluarganya bermigrasi ke Mogadishu pada tahun 1989, lalu mencari perlindungan di Finlandia pada tahun 1990, di mana ia belajar membaca terlambat, menjadi perawat, kemudian meraih gelar master dan beasiswa dari Universitas Harvard. Ia bekerja di Perserikatan Bangsa-Bangsa dan, pada tahun 2016, menjadi perempuan pertama yang mencalonkan diri sebagai presiden Somalia melalui program memerangi korupsi, mutilasi genital perempuan, dan sistem kuota suku."
