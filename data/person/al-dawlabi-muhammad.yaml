summary:
  ar: "أبو بشر محمد بن أحمد بن حماد بن سعد الأنصاري بالولاء الوراق الرازي الدولابي؛ كان عالماً بالحديث والأخبار والتواريخ سمع الأحاديث بالعراق والشام وروى عن محمد بن بشار وأحمد بن عبد الجبار العطاردي وخلق كثير؛ روى عنه الطبراني وأبو حاتم بن حبان البستي؛ له تصانيف مفيدة في التاريخ ومواليد العلماء ووفياتهم واعتمد عليه أرباب هذا الفن في النقل وأخبروا عنه في كتبهم ومصنفاتهم المشهورة فقد كان من الأعلام الذين يرجع إليهم وكان حسن التصنيف {cite:wafayat-ayan}."
  en: "Abu Bishr al-Dawlabi (d. 320) — the Rayy warraq-historian; a trusted authority on births and deaths of the scholars, cited by the masters of the genre; al-Tabarani and Ibn Hibban transmitted from him {cite:wafayat-ayan}."
