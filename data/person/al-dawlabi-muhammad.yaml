died: { edtf: "0932", hijri: "0320", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي سنة عشرين وثلاثمائة بالمرج {cite:wafayat-ayan}." }
summary:
  ar: "أبو بشر محمد بن أحمد بن حماد بن سعد الأنصاري بالولاء الوراق الرازي الدولابي؛ كان عالماً بالحديث والأخبار والتواريخ سمع الأحاديث بالعراق والشام وروى عن محمد بن بشار وأحمد بن عبد الجبار العطاردي وخلق كثير؛ روى عنه الطبراني وأبو حاتم بن حبان البستي؛ له تصانيف مفيدة في التاريخ ومواليد العلماء ووفياتهم واعتمد عليه أرباب هذا الفن في النقل وأخبروا عنه في كتبهم ومصنفاتهم المشهورة فقد كان من الأعلام الذين يرجع إليهم وكان حسن التصنيف {cite:wafayat-ayan}."
  en: "Abu Bishr al-Dawlabi (d. 320) — the Rayy warraq-historian; a trusted authority on births and deaths of the scholars, cited by the masters of the genre; al-Tabarani and Ibn Hibban transmitted from him {cite:wafayat-ayan}."
  fr: "Abu Bishr al-Dawlabi (mort en 320 H) — warraq et historien de Rayy ; autorité digne de confiance sur les naissances et les morts des savants, cité par les maîtres du genre ; al-Tabarani et Ibn Hibban transmirent de lui {cite:wafayat-ayan}."
  es: "Abu Bishr al-Dawlabi (m. 320) — el historiador Rayy warraq; una autoridad confiable en nacimientos y muertes de eruditos, citado por los maestros del género; al-Tabarani e Ibn Hibban transmitieron de él {cite:wafayat-ayan}."
  ur: "ابو بشر الدولبی ⁦(متوفی 320)⁩ - رائی وراق-تاریخ؛ اسکالرز کی پیدائش اور موت پر ایک قابل اعتماد اتھارٹی، جس کا حوالہ اس صنف کے ماہرین نے دیا ہے۔ الطبرانی اور ابن حبان نے ان سے نقل کیا ہے۔"
  tr: "Ebu Bişr Muhammed ibn Ahmed ibn Hammad ibn Saad el-Ensari, akrabalık ilişkisiyle el-Varrak el-Razi el-Dulabi; hadis, haber ve tarih konularında bilgiliydi. Irak ve Suriye'de hadisler dinlemiş ve Muhammed ibn Beşar, Ahmed ibn Abd el-Cebber el-Atardi ve daha birçok kişiden rivayet etmiştir. Taberani ve Ebu Hatim ibn Hibban el-Busti ondan rivayet etmişlerdir. Tarih, âlimlerin doğumları ve ölümleri hakkında faydalı eserleri vardı. Bu sanatın üstatları ondan rivayet için yararlanmış ve ünlü kitaplarında ve derlemelerinde ondan bahsetmişlerdir. İnsanların kendisine başvurduğu önde gelen şahsiyetlerden biriydi ve iyi bir yazı ustasıydı."
  id: "Abu Bishr Muhammad ibn Ahmad ibn Hammad ibn Saad al-Ansari, yang juga dikenal sebagai al-Warraq al-Razi al-Dulabi; beliau berpengetahuan luas dalam hadits, berita, dan sejarah. Beliau mendengar hadits di Irak dan Suriah dan meriwayatkan dari Muhammad ibn Bashar, Ahmad ibn Abd al-Jabbar al-Atardi, dan banyak lainnya. Al-Tabarani dan Abu Hatim ibn Hibban al-Busti meriwayatkan darinya. Beliau memiliki karya-karya yang bermanfaat tentang sejarah, kelahiran para ulama, dan kematian mereka. Para ahli ilmu ini mengandalkan beliau untuk periwayatan dan menyebutkannya dalam buku-buku dan kompilasi terkenal mereka. Beliau adalah salah satu tokoh terkemuka yang dirujuk oleh banyak orang, dan beliau mahir dalam menulis."
