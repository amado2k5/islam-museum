summary:
  ar: "عبد الرحمن بن أحمد الكواكبي ⁦(١٨٤٩–١٩٠٢م)⁩، يلقب بالسيد الفراتي؛ رحالة من علماء الاجتماع ورجال الإصلاح الإسلامي. ولد وتعلم في حلب وأنشأ فيها جريدة «الشهباء» فأقفلتها الحكومة، وأُسندت إليه مناصب عديدة ثم سعى به أعداء الإصلاح فسُجن وخسر جميع ماله، فرحل إلى مصر وساح سياحتين عظيمتين إلى بلاد العرب وشرقي أفريقية وبعض بلاد الهند واستقر في مصر إلى أن توفي. من كتبه «أم القرى» و«طبائع الاستبداد» وكان لهما عند صدورهما دويّ؛ قال الزركلي: كان كبيراً في عقله وهمّته وعلمه، من كبار رجال النهضة الحديثة {cite:al-aalam tarjama}."
  en: "Abd al-Rahman al-Kawakibi (1849–1902 CE) of Aleppo — the reformist author of Umm al-Qura and Taba'i' al-Istibdad, which 'resounded on their publication' {cite:al-aalam tarjama}."
  fr: "Abd al-Rahman al-Kawakibi (1849–1902 ap. J.-C.) d'Alep — l'auteur réformiste d'Umm al-Qura et de Taba'i' al-Istibdad, qui « eurent un grand retentissement à leur parution » {cite:al-aalam tarjama}."
  es: "Abd al-Rahman al-Kawakibi (1849–1902 d. C.) de Alepo, autor reformista de Umm al-Qura y Taba'i' al-Istibdad, que 'tuvieron gran repercusión tras su publicación' {cite:al-aalam tarjama}."
  ur: "حلب کے عبدالرحمن الکوکیبی ⁦(1849-1902 عیسوی)⁩ - ام القراء اور طبائع الاستبداد کے اصلاح پسند مصنف، جو 'ان کی اشاعت پر گونج اٹھا' {حوالہ: العالم ترجمہ}۔"
  tr: "Abdülrahman ibn Ahmed el-Kawakibi (1849–1902), Seyyid el-Furati olarak bilinen, ünlü bir seyyah, sosyolog ve İslam reformcusuydu. Halep'te doğup eğitim gören Seyyid el-Furati, daha sonra hükümet tarafından kapatılan \"El-Şahba\" gazetesini kurdu. Birçok görevde bulundu, ancak daha sonra reform karşıtları tarafından zulme uğradı, hapse atıldı ve tüm servetini kaybetti. Ardından Mısır'a gitti ve Arap dünyasına, Doğu Afrika'ya ve Hindistan'ın bazı bölgelerine iki kapsamlı seyahat gerçekleştirdi. Mısır'a yerleşti ve ölümüne kadar orada kaldı. Eserleri arasında, yayınlandıkları dönemde önemli etki yaratan \"Umm el-Kura\" ve \"Taba'i' el-İstibdad\" bulunmaktadır. El-Zarkali onu büyük zekâ, hırs ve bilgiye sahip bir insan ve modern Rönesans'ın önde gelen isimlerinden biri olarak tanımlamıştır."
  id: "Abd al-Rahman ibn Ahmad al-Kawakibi (1849–1902 M), yang dikenal sebagai Sayyid al-Furati, adalah seorang penjelajah, sosiolog, dan reformis Islam yang terkenal. Lahir dan dididik di Aleppo, ia mendirikan surat kabar \"Al-Shahba,\" yang kemudian ditutup oleh pemerintah. Ia memegang berbagai posisi, tetapi kemudian dianiaya oleh para penentang reformasi, dipenjara, dan kehilangan seluruh kekayaannya. Ia kemudian melakukan perjalanan ke Mesir, melakukan dua perjalanan panjang ke dunia Arab, Afrika Timur, dan sebagian India. Ia menetap di Mesir, tempat ia tinggal hingga kematiannya. Di antara karya-karyanya adalah \"Umm al-Qura\" dan \"Taba'i' al-Istibdad,\" yang keduanya memiliki dampak signifikan setelah diterbitkan. Al-Zarkali menggambarkannya sebagai seorang pria dengan kecerdasan, ambisi, dan pengetahuan yang hebat, dan salah satu tokoh terkemuka dari renaisans modern."
