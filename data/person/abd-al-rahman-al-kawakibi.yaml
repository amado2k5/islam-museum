summary:
  ar: "عبد الرحمن بن أحمد الكواكبي (١٨٤٩–١٩٠٢م)، يلقب بالسيد الفراتي؛ رحالة من علماء الاجتماع ورجال الإصلاح الإسلامي. ولد وتعلم في حلب وأنشأ فيها جريدة «الشهباء» فأقفلتها الحكومة، وأُسندت إليه مناصب عديدة ثم سعى به أعداء الإصلاح فسُجن وخسر جميع ماله، فرحل إلى مصر وساح سياحتين عظيمتين إلى بلاد العرب وشرقي أفريقية وبعض بلاد الهند واستقر في مصر إلى أن توفي. من كتبه «أم القرى» و«طبائع الاستبداد» وكان لهما عند صدورهما دويّ؛ قال الزركلي: كان كبيراً في عقله وهمّته وعلمه، من كبار رجال النهضة الحديثة {cite:al-aalam tarjama}."
  en: "Abd al-Rahman al-Kawakibi (1849–1902 CE) of Aleppo — the reformist author of Umm al-Qura and Taba'i' al-Istibdad, which 'resounded on their publication' {cite:al-aalam tarjama}."
