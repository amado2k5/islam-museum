summary:
  ar: "سير غلام حسين هدايت الله (1879–1948)، محامٍ وسياسي سندي، أول رئيس وزراء للسند بعد انفصالها عن بومباي (1937–1938) ثم رئيس وزرائها مرة ثانية (1942–1947)، فأول حاكم للسند في باكستان (1947–1948) — الباكستاني الوحيد الذي حكم إقليما عند الاستقلال. أسهم في مشروع سد سكّر وفي إقناع مؤتمرات المائدة المستديرة بجدوى إقليم السند."
  en: "Sir Ghulam Hussain Hidayatullah (1879–1948), a Sindhi lawyer and politician, the first Premier of Sindh after its separation from Bombay (1937–1938) and again its Premier/Chief Minister (1942–1947), then the first Governor of Sindh in Pakistan (1947–1948) — the only Pakistani provincial governor at independence. He was associated with the Sukkur Barrage project and with persuading the Round Table Conferences that Sindh could sustain itself as a province."
  ur: "سر غلام حسین ہدایت اللہ (1879ء–1948ء)، سندھی وکیل اور سیاست دان، بمبئی سے علاحدگی کے بعد سندھ کے پہلے وزیر اعلیٰ (1937ء–1938ء) اور پھر دوبارہ وزیر اعلیٰ (1942ء–1947ء)، پھر پاکستان میں سندھ کے پہلے گورنر (1947ء–1948ء) — آزادی کے وقت واحد پاکستانی صوبائی گورنر۔ وہ سکھر بیراج منصوبے اور گول میز کانفرنسوں کو سندھ کی صوبائی صلاحیت پر قائل کرنے سے وابستہ رہے۔"
