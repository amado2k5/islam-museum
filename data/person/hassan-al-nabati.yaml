summary:
  ar: "مولى بني ضبة وصاحب حوض حسان بالبصرة والذي تنسب إليه منارة حسان بالبطائح؛ عند البلاذري استخرج للحجاج أيام الوليد ولهشام بن عبد الملك أرضين من أراضي البطيحة."
  en: "Mawla of Banu Dubba, owner of Basra's Hawd Hassan and eponym of Manarat Hassan in the Bata'ih; in al-Baladhuri he reclaimed Bata'ih lands for al-Hajjaj under al-Walid and for Hisham ibn Abd al-Malik."
  es: "Mawla de Banu Dubba, propietario de Hawd Hassan en Basora y epónimo de Manarat Hassan en Bata'ih; en al-Baladhuri reclamó tierras Bata'ih para al-Hajjaj bajo al-Walid y para Hisham ibn Abd al-Malik."
  fr: "Mawla de Banu Dubba, propriétaire de Hawd Hassan de Bassora et éponyme de Manarat Hassan dans le Bata'ih; à al-Baladhuri, il récupéra les terres Bata'ih pour al-Hajjaj sous al-Walid et pour Hisham ibn Abd al-Malik."
  ur: "بنو دبّہ کا مولا، بصرہ کے ہود حسن کا مالک اور بطیح میں منارۃ حسن کا تخلص؛ البلادوری میں اس نے الولید کے ماتحت الحجاج اور ہشام بن عبد الملک کے لیے بطعیہ کی زمینیں دوبارہ حاصل کیں۔"
