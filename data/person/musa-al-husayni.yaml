summary:
  ar: "سياسي فلسطيني (1853–1934)، والٍ عثماني ورئيس بلدية القدس (1918–1920)، ترأّس اللجنة التنفيذية العربية للمؤتمر العربي الفلسطيني من 1920 حتى وفاته."
  en: "Palestinian politician (1853–1934), an Ottoman governor and mayor of Jerusalem (1918–1920) who chaired the Executive Committee of the Palestine Arab Congress from 1920 until his death."
  es: "Político palestino (1853-1934), gobernador otomano y alcalde de Jerusalén (1918-1920), que presidió el Comité Ejecutivo del Congreso Árabe Palestino desde 1920 hasta su muerte."
  fr: "Homme politique palestinien (1853-1934), gouverneur ottoman et maire de Jérusalem (1918-1920) qui a présidé le Comité exécutif du Congrès arabe palestinien de 1920 jusqu'à sa mort."
  ur: "فلسطینی سیاست دان (1853–1934)، ایک عثمانی گورنر اور یروشلم کے میئر (1918–1920) جنہوں نے 1920 سے اپنی موت تک فلسطین عرب کانگریس کی ایگزیکٹو کمیٹی کی سربراہی کی۔"
  tr: "Filistinli bir politikacı (1853–1934), Osmanlı valisi ve Kudüs belediye başkanı (1918–1920) olan Scully, 1920'den ölümüne kadar Arap-Filistin Konferansı'nın Arap Yürütme Komitesi'ne başkanlık etti."
  id: "Seorang politikus Palestina (1853–1934), gubernur Ottoman, dan walikota Yerusalem (1918–1920), ia memimpin Komite Eksekutif Arab Konferensi Arab-Palestina dari tahun 1920 hingga wafatnya."
