summary:
  ar: "قائد في الأندلس، غضب عليه موسى بن نصير وعزله ووجهه إلى مدينة طليطلة في سنة ثلاث وتسعين {cite:tabari-tarikh-abu-al-fadl j.6 p.481}. وعند البلاذري: عامل موسى بن نصير وأول من غزا الأندلس سنة اثنتين وتسعين فآمن أليان والي مجازها على أن حمله وأصحابه إليها في السفن فحاربه أهلها ففتحها ثم فتح طليطلة مدينة مملكتها."
