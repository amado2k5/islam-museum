id: person/tariq-ibn-ziyad
class: person
label: { ar: "طارق بن زياد" }
summary:
  ar: "قائد في الأندلس، غضب عليه موسى بن نصير وعزله ووجهه إلى مدينة طليطلة في سنة ثلاث وتسعين {cite:tabari-tarikh-abu-al-fadl j.6 p.481}. وعند البلاذري: عامل موسى بن نصير وأول من غزا الأندلس سنة اثنتين وتسعين فآمن أليان والي مجازها على أن حمله وأصحابه إليها في السفن فحاربه أهلها ففتحها ثم فتح طليطلة مدينة مملكتها. وعند المقري أجازه موسى بن نصير إلى الأندلس في سبعة آلاف جلّهم من البربر في أربع سفن وحط بجبل طارق المنسوب إليه يوم السبت في شعبان سنة 92هـ ومعه يليان صاحب سبتة يدلهم على الموارد ويتجسس لهم الأخبار، ثم كتب إلى موسى أن لذريق قد زحف إليه بما لا طاقة له به فجهز له خمسة آلاف فكملوا اثني عشر ألفاً، وقال في تحريض أصحابه إن طاغية القوم لذريق فقاتلوه فإن هلك لم يعوزهم بطل عاقل تسندون أموركم إليه، وخلص إلى لذريق فضربه بالسيف على رأسه فقتله على سريره {cite:nafh-tib-maqqari p. 267-268, 278} بعثه موسى بن نصير في سبعة آلاف أكثرهم من البربر والموالي، وأمده بخمسة آلاف، وعبر إلى الأندلس في رجب سنة 92هـ، ونزل عند جبل كالبي الذي عرف باسمه. {cite:salabi-umayyad-state-2020 p.68} ويذكر الكتاب أن موسى أمره بتجريب السرايا قبل الاقتحام الكامل، وأن الخطبة المنسوبة إليه ترد عليها ملاحظات أسلوبية وتاريخية، وأن رواية حرق السفن مضطربة، وأنه لما طلب النجدة خرج موسى بعده من القيروان سنة 93هـ. {cite:salabi-umayyad-state-2020 p.70-75}"
