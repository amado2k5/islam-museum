id: person/tariq-ibn-ziyad
class: person
label: { ar: "طارق بن زياد" }
summary:
  ar: "قائد بربري تولى قيادة القوات الإسلامية التي فتحت شبه الجزيرة الإيبيرية سنة 92هـ/711م، وكان مقيماً في طنجة نائباً عن موسى بن نصير. وتجمع روايته المصادر المتضاربة، وتقول دائرة المعارف الإسلامية إن تاريخي ميلاده ووفاته غير معروفين. عبر المضيق في أربع سفن وعلى رأس نحو اثني عشر ألف مقاتل بحسب مصادر عربية كثيرة، فهزم لذريق ملك القوط، ثم سار إلى طليطلة فسقطت دون مقاومة، ولقيه موسى هناك فوبّخه بحسب المقالة."
  en: "A Berber commander who led the Muslim troops that conquered the Iberian Peninsula in 92 AH, 711 CE, acting from Tangier on behalf of Musa ibn Nusayr. The Encyclopaedia of Islam says his birth and death dates are uncertain and the sources contradict each other. He crossed the strait in four ships with about twelve thousand men according to many Arab sources, defeated the Visigothic king Roderic, and went on to Toledo, which fell without resistance. Musa met him there and, the article says, reprimanded him harshly."
  ur: "بربر سپہ سالار جس نے سنہ 92ھ/711ء میں جزیرہ نمائے آئبیریا فتح کرنے والے مسلم دستوں کی قیادت کی، اور وہ طنجہ سے موسیٰ بن نصیر کی طرف سے کام کرتا تھا۔ دائرۃ المعارف اسلامیہ کے مطابق اس کی پیدائش اور وفات کی تاریخیں معلوم نہیں اور ماخذ متضاد ہیں۔ بہت سے عربی ماخذ کے مطابق وہ چار کشتیوں میں تقریباً بارہ ہزار آدمیوں کے ساتھ آبنائے پار کر گیا، گوتھ بادشاہ لذریق کو شکست دی اور طلیطلہ پہنچا جو بغیر مزاحمت گر گیا۔ مقالے کے مطابق موسیٰ نے وہاں اسے سخت سرزنش کی۔"
