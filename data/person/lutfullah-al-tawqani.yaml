summary:
  ar: "الملا لطف الله الشهير بمولانا لطفي التوقاتي الرومي الحنفي؛ تخرج بالملا سنان وقرأ على القوشنجي العلوم الرياضية بإشارته، ولما كان الملا سنان عزيزاً عند السلطان محمد خان جعله السلطان أميناً على خزانة الكتب فاطلع على الغرائب منها، ثم لما ولى السلطان بايزيد أعطاه مدرسة السلطان مراد بمدينة بروسا ثم أعطاه إحدى الثمان ثم ولاه مدرسة مراد خان ثانياً وأقام ببرسا، وكان ذكياً عالماً خاشعاً قُرئ عليه صحيح البخاري إلى آخره وكان حال الإقراء يبكي حتى سقطت دموعه، غير أنه كان يطيل لسانه على أقرانه حتى أبغضه علماء الروم ونسبوه إلى الإلحاد والزندقة، فاستحكم في قتله الملا أفضل الدين فلم يحكم فحكم الملا خطيب زاده بإباحة دمه فقتلوه، وكان يكرر كلمتي الشهادة وينزّه عقيدته عما نسبوه إليه حتى قيل إنه تكلم بالشهادة بعدما سقط رأسه على الأرض، وقد مات شهيداً؛ وله شرح الطالع وحواشٍ على شرح الفتاح للسيد الشريف ورسالة سماها بالسبع الشداد معتمدة على سبعة أسئلة للسيد الشريف في بحث الموضوع ورسالة ذكر فيها أقسام العلوم الشرعية والعربية بلغ فيها مقدار مائة علم أورد فيها غرائب وعجائب {cite:shadharat-dhahab p. 439-440}."
  en: "Molla Lutfi of Tokat — Mehmed II's keeper of the royal library, set by Bayezid to Murad's madrasa then one of the Eight; he wept while dictating the Sahih but was long-tongued against his peers until Rum's scholars charged him with unbelief and had him executed on Molla Khatib-zada's ruling, repeating the shahada — it was said — even after his head fell; works: Sharh al-Tali', glosses on al-Sayyid al-Sharif's Sharh al-Fattah, the 'Seven Difficulties', and a treatise enumerating a hundred sciences; d. 904 {cite:shadharat-dhahab p. 439-440}."
