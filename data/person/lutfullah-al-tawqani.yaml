summary:
  ar: "الملا لطف الله الشهير بمولانا لطفي التوقاتي الرومي الحنفي؛ تخرج بالملا سنان وقرأ على القوشنجي العلوم الرياضية بإشارته، ولما كان الملا سنان عزيزاً عند السلطان محمد خان جعله السلطان أميناً على خزانة الكتب فاطلع على الغرائب منها، ثم لما ولى السلطان بايزيد أعطاه مدرسة السلطان مراد بمدينة بروسا ثم أعطاه إحدى الثمان ثم ولاه مدرسة مراد خان ثانياً وأقام ببرسا، وكان ذكياً عالماً خاشعاً قُرئ عليه صحيح البخاري إلى آخره وكان حال الإقراء يبكي حتى سقطت دموعه، غير أنه كان يطيل لسانه على أقرانه حتى أبغضه علماء الروم ونسبوه إلى الإلحاد والزندقة، فاستحكم في قتله الملا أفضل الدين فلم يحكم فحكم الملا خطيب زاده بإباحة دمه فقتلوه، وكان يكرر كلمتي الشهادة وينزّه عقيدته عما نسبوه إليه حتى قيل إنه تكلم بالشهادة بعدما سقط رأسه على الأرض، وقد مات شهيداً؛ وله شرح الطالع وحواشٍ على شرح الفتاح للسيد الشريف ورسالة سماها بالسبع الشداد معتمدة على سبعة أسئلة للسيد الشريف في بحث الموضوع ورسالة ذكر فيها أقسام العلوم الشرعية والعربية بلغ فيها مقدار مائة علم أورد فيها غرائب وعجائب {cite:shadharat-dhahab p. 439-440}."
  en: "Molla Lutfi of Tokat — Mehmed II's keeper of the royal library, set by Bayezid to Murad's madrasa then one of the Eight; he wept while dictating the Sahih but was long-tongued against his peers until Rum's scholars charged him with unbelief and had him executed on Molla Khatib-zada's ruling, repeating the shahada — it was said — even after his head fell; works: Sharh al-Tali', glosses on al-Sayyid al-Sharif's Sharh al-Fattah, the 'Seven Difficulties', and a treatise enumerating a hundred sciences; d. 904 {cite:shadharat-dhahab p. 439-440}."
  es: "Molla Lutfi de Tokat — custodio de la biblioteca real de Mehmed II, puesto por Bayezid en la madrasa de Murad y luego uno de los Ocho; lloró mientras dictaba el Sahih pero fue muy crítico con sus compañeros hasta que los eruditos de Rum lo acusaron de incredulidad y lo hicieron ejecutar por orden de Molla Khatib-zada, repitiendo la shahada —se dice— incluso después de que le cayera la cabeza; obras: Sharh al-Tali', glosas sobre el Sharh al-Fattah de al-Sayyid al-Sharif, las 'Siete Dificultades' y un tratado que enumera cien ciencias; m. 904 {cita: shadharat-dhahab págs. 439-440}."
  fr: "Molla Lutfi de Tokat — gardien de la bibliothèque royale de Mehmed II, nommé par Bayezid à la madrasa de Murad, alors l'un des Huit; il pleura en dictant le Sahih, mais resta longtemps en désaccord avec ses pairs jusqu'à ce que les savants de Rum l'accusent d'incroyance et le fassent exécuter sur la décision de Molla Khatib-zada, répétant la shahada — dit-on — même après que sa tête soit tombée; œuvres: Sharh al-Tali', gloses sur le Sharh al-Fattah d'al-Sayyid al-Sharif, les « Sept Difficultés », et un traité énumérant cent sciences; mort en 904 {cite: shadharat-dhahab p. 439-440}."
  ur: "توکت کا ملا لطفی - شاہی کتب خانے کا محافظ محمد ثانی، جسے بایزید نے مراد کے مدرسے کے لیے مقرر کیا پھر آٹھ میں سے ایک؛ وہ صحیح کا حکم دیتے ہوئے روتا رہا لیکن اپنے ساتھیوں کے خلاف طویل زبان رہا یہاں تک کہ رم کے علماء نے اس پر کفر کا الزام لگایا اور اسے مولانا خطیب زادہ کے حکم پر موت کے گھاٹ اتار دیا، شہادت کو دہرایا — یہ کہا گیا — اس کے سر گرنے کے بعد بھی۔ کام: شرح الطالی، السید الشریف کی شرح الفتح، 'سات مشکلات'، اور ایک سو علوم پر مشتمل ایک مقالہ؛ d 904 {حوالہ: شدھارت ذہاب ص۔ 439-440}۔"
  tr: "Mela Lutfi Allah, Mawlana Lutfi al-Tuqati al-Rumi al-Hanafi olarak bilinir, Mela Sinan'ın yanında mezun oldu ve onun rehberliğinde El-Kusangi'nin yanında matematik eğitimi aldı. Mela Sinan Sultan Muhammed Han'a çok değer verdiği için Sultan onu kütüphanenin sorumlusu olarak atadı ve nadir şeyler hakkında bilgi edindi. Sonra Sultan Bayezid olduğunda, ona Barusa şehrindeki Sultan Murad'ın okulunu verdi, ardından sekiz okuldan birini verdi. Daha sonra onu ikinci kez Murad Han'ın okuluna atadı ve Barsa'ya yerleşti. Zeki, bilgili ve alçakgönüllüydü. Ona Sahih al-Buhari okundu ve benzeri şeyler devam etti. Okuması gözyaşları içinde kaldı ta ki Gözyaşları döküldü, ancak Roma âlimleri onu küçümseyip ateizm ve sapkınlıkla suçlayana kadar aklandığı hakkında uzun uzun konuşmaya devam etti. Mele Afal el-Din onu öldürmekte ısrar etti, ancak o hüküm sürmedi. Mele Hatib Zada kanının izin verildiğini hükmetti ve onu öldürdüler. Şehitlik sözlerini tekrarladı ve inançlarını kendisine atfedilenlerden akladı; öyle ki, başı yere düştükten sonra şehitliği söyledi ve şehit olarak öldü. Ayrıca hikaye üzerine bir şerh ve Seyyid El-Şerif'in El-Fettah yorumuna notlar yazdı, ayrıca Seyyid El-Şerif'in yedi sorusuna dayanarak Al-Saba' Al-Shaddad adını verdiği bir risale yazdı İslam ve Arap bilimlerinin dallarından bahsettiği bir konu ve risale, yüzlerce bilime ulaşmış ve içinde mucizeler ve mucizeler yer almıştır {atıf:shadharat-dhahab s. 439-440}."
  id: "Mulla Lutfi Allah, yang dikenal sebagai Mawlana Lutfi al-Tuqati al-Rumi al-Hanafi, lulus di bawah bimbingan Mulla Sinan dan belajar matematika di bawah bimbingan Al-Qushangi di bawah bimbingannya. Karena Mulla Sinan sangat dekat dengan Sultan Muhammad Khan, Sultan mengangkatnya sebagai penjaga perpustakaan dan mempelajari hal-hal langka di dalamnya. Kemudian, ketika ia menjadi Sultan Bayezid, ia memberinya sekolah Sultan Murad di kota Barusa, kemudian memberinya salah satu dari delapan sekolah tersebut. Ia kemudian mengangkatnya ke sekolah Murad Khan untuk kedua kalinya dan menetap di Barsa. Ia cerdas, berpengetahuan, dan rendah hati. Sahih al-Bukhari dibacakan kepadanya dan seterusnya. Bacaannya dalam keadaan penuh air mata hingga Air matanya jatuh, tetapi ia terus berbicara panjang lebar tentang rekan-rekannya sampai para sarjana Romawi membencinya dan menuduhnya ateis dan bidah. Mulla Afal al-Din bersikeras membunuhnya, tetapi ia tidak memerintah. Mulla Khatib Zada memutuskan darahnya diizinkan, dan mereka membunuhnya. Ia mengulangi kata-kata syahid dan membebaskan kepercayaannya dari apa yang mereka anggap padanya, sampai-sampai dikatakan ia mengucapkan syahid setelah kepalanya jatuh ke tanah, dan ia meninggal sebagai martir. Ia juga menulis komentar atas kisah tersebut dan catatan tentang komentar Al-Fattah oleh Sayyid Al-Sharif, serta risalah yang ia beri nama Al-Saba' Al-Shaddad, berdasarkan tujuh pertanyaan dari Sayyid Al-Sharif dalam sebuah penelitian Subjek dan risalah di mana ia menyebutkan cabang ilmu Islam dan Arab, mencapai seratus ilmu, di mana ia memasukkan keajaiban dan keajaiban {cite:shadharat-dhahab hlm. 439-440}."
