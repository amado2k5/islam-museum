summary:
  ar: "سلطان جوهر (1833–1895) ومؤسس جوهر الحديثة: خلف أباه تمنغكونغ سنة 1862، وصار مهراجا سنة 1868 ثم سلطانًا سنة 1886، وبنى إدارة جوهر وقضاءها وجيشها وبنيتها على النماذج الغربية، وأبقى ولايته دون مقيم بريطاني، ومنحها أول دستور لها سنة 1895."
  en: "Sultan of Johor (1833–1895) and founder of modern Johor: he succeeded his father as Temenggong in 1862, became Maharaja in 1868 and Sultan in 1886, built Johor's administration, judiciary, military and infrastructure on Western models, kept his state free of a British Resident, and gave it its first constitution in 1895."
  ur: "سلطان جوہر (1833ء–1895ء) اور جدید جوہر کے بانی: 1862ء میں اپنے والد کے جانشین کے طور پر تمینگونگ بنے، 1868ء میں مہاراجا اور 1886ء میں سلطان ہوئے، جوہر کی انتظامیہ، عدلیہ، فوج اور ڈھانچے کو مغربی طرز پر بنایا، اپنی ریاست کو برطانوی ریزیڈنٹ سے آزاد رکھا اور 1895ء میں اسے اس کا پہلا آئین دیا۔"
