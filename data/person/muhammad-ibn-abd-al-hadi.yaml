summary:
  ar: "آخر من روى بالإجازة عن شهدة؛ سمع من محمد بن حمزة بن أبي الصقر وعبد الرزاق النجار ويحيى الثقفي وغيرهم، وكان شيخاً صالحاً متعففاً تالياً لكتاب الله يوماً بمسجد ساوية من عمل نابلس فاستشهد على يد التتار في جمادى الأولى وقد نيف على التسعين قاله الذهبي {cite:shadharat-dhahab p. 303}."
  en: "The last to transmit by ijaza from the musnida Shahda — a devout elder killed by the Tatars at Sawiya near Nablus in Jumada I 658, past ninety (per Dhahabi) {cite:shadharat-dhahab p. 303}."
  es: "El último en transmitir por ijaza del musnida Shahda — un anciano devoto asesinado por los tártaros en Sawiya cerca de Nablus en Jumada I 658, pasados los noventa (según Dhahabi) {cite:shadharat-dhahab p. 303}."
  fr: "Le dernier à transmettre par ijaza du musnida Shahda — un ancien dévot tué par les Tatars à Sawiya près de Naplouse en Jumada I 658, plus de quatre-vingt-dix ans (selon Dhahabi) {cite:shadharat-dhahab p. 303}."
  ur: "مسنید شہدا سے اعجاز کے ذریعے منتقل ہونے والا آخری - ایک متقی بزرگ کو تاتاریوں نے جمعہ اول 658 میں نابلس کے قریب ساویہ کے مقام پر قتل کیا، نوے کے قریب ⁦(فی ذہبی)⁩ 303}۔"
  tr: "Şehdetten icazah ile son rivayet edenler, Muhammed bin Hamza ibn Ebi el-Sakr, Abdülrazak el-Neccar, Yahya el-Tekafi ve diğerleriydi. O, bir zamanlar Nablus'taki Sawiya Camii'nde Allah'ın Kitabı'nı takip eden dindar ve iffetli bir şeyhti; doksan yaşından fazla yaşındayken Cumada-evval'de Tatarlar tarafından şehit edildi. El-Dhahabi şöyle dedi: {kaynak:şadharat-dhahab, s. 303}."
  id: "Yang terakhir bercerita dengan ijazah dari Shahdah adalah Muhammad ibn Hamza ibn Abi al-Saqr, Abd al-Razzaq al-Najjar, Yahya al-Thaqafi, dan lainnya. Ia adalah seorang sheikh yang saleh dan suci yang pernah mengikuti Kitab Allah di Masjid Sawiya di Nablus, dan menjadi syahid oleh Tatar di Jumada al-Awwal, berusia lebih dari sembilan puluh tahun. Al-Dhahabi berkata {cite:shadharat-dhahab, hlm. 303}."
