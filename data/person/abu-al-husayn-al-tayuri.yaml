summary:
  ar: "أبو الحسين المبارك بن عبد الجبار بن أحمد الصيرفي المعروف بابن الطيوري (ت 500هـ)، محدث بغدادي مكثر؛ سمع «فضائل الصحابة» لأحمد من ابن العلاف سنة 436هـ وقرأه عليه ابن ناصر السلامي في رجب سنة 500هـ؛ أثنى عليه السلفي وابن ماكولا وابن السكرة وابن السمعاني، وكان عنده نحو ألف جزء بخط الدارقطني، ورماه المؤتمن الساجي بالكذب فلم يتابعه أحد كما قال الذهبي."
  en: "Abu al-Husayn al-Mubarak ibn Abd al-Jabbar ibn Ahmad al-Sayrafi, known as Ibn al-Tuyuri (d. 500 AH), a prolific hadith transmitter of Baghdad. He heard Ahmad's Fada'il al-Sahaba from Ibn al-Allaf in 436 and Ibn Nasir al-Salami read it to him in Rajab 500. Al-Silafi, Ibn Makula, Ibn Sukkara and Ibn al-Sam'ani praised him; he owned about a thousand fascicles in al-Daraqutni's hand; al-Mu'taman al-Saji accused him of lying, but, as al-Dhahabi says, no one followed him in that."
