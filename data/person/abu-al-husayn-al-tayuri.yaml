summary:
  ar: "أبو الحسين المبارك بن عبد الجبار بن أحمد الصيرفي المعروف بابن الطيوري ⁦(ت 500هـ)⁩، محدث بغدادي مكثر؛ سمع «فضائل الصحابة» لأحمد من ابن العلاف سنة 436هـ وقرأه عليه ابن ناصر السلامي في رجب سنة 500هـ؛ أثنى عليه السلفي وابن ماكولا وابن السكرة وابن السمعاني، وكان عنده نحو ألف جزء بخط الدارقطني، ورماه المؤتمن الساجي بالكذب فلم يتابعه أحد كما قال الذهبي."
  en: "Abu al-Husayn al-Mubarak ibn Abd al-Jabbar ibn Ahmad al-Sayrafi, known as Ibn al-Tuyuri (d. 500 AH), a prolific hadith transmitter of Baghdad. He heard Ahmad's Fada'il al-Sahaba from Ibn al-Allaf in 436 and Ibn Nasir al-Salami read it to him in Rajab 500. Al-Silafi, Ibn Makula, Ibn Sukkara and Ibn al-Sam'ani praised him; he owned about a thousand fascicles in al-Daraqutni's hand; al-Mu'taman al-Saji accused him of lying, but, as al-Dhahabi says, no one followed him in that."
  fr: "Abu al-Husayn al-Mubarak ibn Abd al-Jabbar ibn Ahmad al-Sayrafi, connu sous le nom d'Ibn al-Tuyuri (mort en 500 H), transmetteur prolifique du hadith à Bagdad. Il entendit les Fada'il al-Sahaba d'Ahmad auprès d'Ibn al-Allaf en 436, et Ibn Nasir al-Salami les lui lut en Rajab 500. Al-Silafi, Ibn Makula, Ibn Sukkara et Ibn al-Sam'ani firent son éloge ; il possédait environ mille fascicules de la main d'al-Daraqutni ; al-Mu'taman al-Saji l'accusa de mensonge, mais, comme le dit al-Dhahabi, personne ne le suivit en cela."
  es: "Abu al-Husayn al-Mubarak ibn Abd al-Jabbar ibn Ahmad al-Sayrafi, conocido como Ibn al-Tuyuri (fallecido en el año 500 de la Hégira), fue un prolífico transmisor de hadices de Bagdad. Escuchó el Fada'il al-Sahaba de Ahmad de boca de Ibn al-Allaf en el año 436, y Ibn Nasir al-Salami se lo leyó en Rajab del año 500. Al-Silafi, Ibn Makula, Ibn Sukkara e Ibn al-Sam'ani lo elogiaron; poseía cerca de mil fascículos escritos por al-Daraqutni; al-Mu'taman al-Saji lo acusó de mentir, pero, como dice al-Dhahabi, nadie lo siguió en esa acusación."
  ur: "ابو الحسین المبارک ابن عبد الجبار ابن احمد السیرافی، جسے ابن الطوری ⁦(متوفی 500 ہجری)⁩ کے نام سے جانا جاتا ہے، بغداد کا ایک مشہور حدیث منتقل کرنے والا۔ اس نے احمد کی فضیلۃ الصحابہ کو ابن العلاف سے 436 میں سنا اور ابن ناصر السلمی نے اسے رجب 500 میں پڑھ کر سنایا۔ السلفی، ابن ماکولہ، ابن سقرہ اور ابن السمانی نے اس کی تعریف کی ہے۔ اس کے پاس الدارقطنی کے ہاتھ میں تقریباً ایک ہزار فاسیکلز تھے۔ المطمن الساجی نے اس پر جھوٹ بولنے کا الزام لگایا، لیکن جیسا کہ الذہبی کہتے ہیں، اس میں کسی نے ان کی پیروی نہیں کی۔"
  tr: "İbn el-Tayyuri olarak bilinen Ebu el-Hüseyn el-Mübarek ibn Abd el-Cebber ibn Ahmed el-Sayrafi (ö. 500 Hicri), Bağdatlı üretken bir hadis âlimiydi. Ahmed'in \"Sahabelerin Faziletleri\" adlı eserini 436 Hicri yılında İbn el-Allaf'tan dinledi ve İbn Nasir el-Selamî ona 500 Hicri yılının Receb ayında okudu. Selafi, İbn Makula, İbn el-Sakrah ve İbn el-Sam'ani onu övdüler. El-Daraqutni'nin el yazısıyla yaklaşık bin nüshası vardı. El-Mu'taman el-Saji onu yalan söylemekle suçladı, ancak el-Dhahabi'nin dediği gibi kimse onu takip etmedi."
  id: "Abu al-Husayn al-Mubarak ibn Abd al-Jabbar ibn Ahmad al-Sayrafi, yang dikenal sebagai Ibn al-Tayyuri (wafat 500 H), adalah seorang ulama hadits Baghdadi yang produktif. Ia mendengar kitab “Keutamaan Para Sahabat” karya Ahmad dari Ibn al-Allaf pada tahun 436 H, dan Ibn Nasir al-Salami membacakannya kepadanya pada bulan Rajab tahun 500 H. Al-Salafi, Ibn Makula, Ibn al-Sakrah, dan Ibn al-Sam’ani memujinya. Ia memiliki sekitar seribu bagian hadits yang ditulis tangan oleh al-Daraqutni. Al-Mu’taman al-Saji menuduhnya berbohong, tetapi tidak ada yang mengikutinya, sebagaimana dikatakan oleh al-Dhahabi."
