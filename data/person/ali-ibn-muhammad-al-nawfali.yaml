id: person/ali-ibn-muhammad-al-nawfali
class: person
label: { ar: "علي بن محمد بن سليمان النوفلي", en: "'Ali ibn Muhammad al-Nawfali", es: "'Ali ibn Muhammad al-Nawfali", fr: "'Ali ibn Muhammad al-Nawfali", ur: "علی بن محمد النفالی" }
summary:
  ar: "صاحب كتاب الأخبار الذي كثيراً ما استشهد به المسعودي في أخبار آل البيت والشعراء، روى عن أبي العباس بن عمار أن السيد الحميري مات على الكيسانية، وأنكر صحة نسبة قصيدة تجعفرت بسم الله إليه لأن السيد مع فصاحته لا يقول هذا اللفظ {cite:muruj-al-dhahab p. 75-76}."
  en: "Author of the Kitab al-Akhbar Mas'udi cites constantly for Alid and poetic reports — the one who judged 'taja'fart bismillah' beneath al-Sayyid's eloquence {cite:muruj-al-dhahab p. 75-76}."
  es: "El autor del Kitab al-Akhbar, Mas'udi, cita constantemente para los relatos alid y poéticos a aquel que juzgó 'taja'fart bismillah' por debajo de la elocuencia de al-Sayyid {cite:muruj-al-dhahab p. 75-76}."
  fr: "L'auteur du Kitab al-Akhbar, Mas'udi, cite constamment des rapports alid et poétiques — celui qui a jugé 'taja'fart bismillah' sous l'éloquence d'al-Sayyid {cite:muruj-al-dhahab p. 75-76}."
  ur: "کتاب الاخبار کے مصنف مسعودی نے الید اور شاعرانہ رپورٹوں کے لیے مسلسل حوالہ دیا ہے - وہ جس نے السید کی فصاحت کے نیچے 'تجعفرت بسم اللہ' کا فیصلہ کیا ہے۔ 75-76}۔"
  tr: "El-Akhbar kitabının yazarı, El-Mes'udi'nin Peygamber'in ailesi ve şairlerinin Akhbar'ında sıkça alıntıladığı kişi, Ebu el-Abbas bin Ammar'dan Seyyid el-Himyari'nin Kaysanit geleneği altında öldüğünü anlatmış ve Tanrı adına kendisine atfedilen bir şiirin doğruluğunu reddetmiştir; çünkü usta, hitabetli olmasına rağmen, bu ifadeyi kullanmamaktadır {atıf:Muruj-al-Dhahab, s. 75-76}."
  id: "Penulis buku Al-Akhbar, yang sering dikutip Al-Mas'udi dalam Akhbar keluarga Nabi dan para penyairnya, menceritakan dari Abu al-Abbas ibn Ammar bahwa Sayyid al-Himyari meninggal di bawah tradisi Kaysanite, dan ia menyangkal keaslian mengaitkan puisi yang dikaitkan kepadanya atas nama Tuhan, karena sang guru, meskipun fasih, tidak mengucapkan frasa ini {cite:muruj-al-dhahab, hlm. 75-76}."
