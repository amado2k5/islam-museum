summary:
  ar: "صاحب كتاب الأخبار الذي كثيراً ما استشهد به المسعودي في أخبار آل البيت والشعراء، روى عن أبي العباس بن عمار أن السيد الحميري مات على الكيسانية، وأنكر صحة نسبة قصيدة تجعفرت بسم الله إليه لأن السيد مع فصاحته لا يقول هذا اللفظ {cite:muruj-al-dhahab p. 75-76}."
  en: "Author of the Kitab al-Akhbar Mas'udi cites constantly for Alid and poetic reports — the one who judged 'taja'fart bismillah' beneath al-Sayyid's eloquence {cite:muruj-al-dhahab p. 75-76}."
  es: "El autor del Kitab al-Akhbar, Mas'udi, cita constantemente para los relatos alid y poéticos a aquel que juzgó 'taja'fart bismillah' por debajo de la elocuencia de al-Sayyid {cite:muruj-al-dhahab p. 75-76}."
  fr: "L'auteur du Kitab al-Akhbar, Mas'udi, cite constamment des rapports alid et poétiques — celui qui a jugé 'taja'fart bismillah' sous l'éloquence d'al-Sayyid {cite:muruj-al-dhahab p. 75-76}."
