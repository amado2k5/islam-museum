id: person/muhammad-ibn-sulayman-al-abbasi
class: person
label: { ar: "محمد بن سليمان العباسي", en: "Muhammad ibn Sulayman al-Abbasi", es: "Muhammad ibn Sulayman al-Abbasi", fr: "Muhammad ibn Sulayman al-Abbasi", ur: "محمد بن سلیمان عباسی" }
summary:
  ar: "محمد بن سليمان بن علي بن عبد الله بن العباس؛ ولي البصرة وفي أيامه زاد المهدي دور نافع بن الحارث وأم جميل الهلالية وعمرو بن وهب الثقفي في المسجد. ملاحظة مراجعة: كان يُنسب إليه في هذا السجل فتح الفسطاط سنة 292هـ، وهو من خبر محمد بن سليمان الكاتب — شخص آخر بعده بأكثر من قرن (person/muhammad-ibn-sulayman-al-katib)."
  en: "Muhammad ibn Sulayman ibn Ali al-Abbasi; in his Basra governorship al-Mahdi bought into the mosque the houses of Nafi' ibn al-Harith, Umm Jamil al-Hilaliyya and Amr ibn Wahb al-Thaqafi."
  es: "Muhammad ibn Sulayman ibn Ali al-Abbasi; durante su gobernación de Basora, al-Mahdi compró para la mezquita las casas de Nafi' ibn al-Harith, Umm Jamil al-Hilaliyya y Amr ibn Wahb al-Thaqafi."
  fr: "Muhammad ibn Sulayman ibn Ali al-Abbasi; dans son poste de gouverneur de Bassorah, al-Mahdi a acheté dans la mosquée les maisons de Nafi' ibn al-Harith, Umm Jamil al-Hilaliyya et Amr ibn Wahb al-Thaqafi."
  ur: "محمد بن سلیمان بن علی العباسی؛ اپنی بصرہ گورنری میں المہدی نے مسجد میں نافع بن حارث، ام جمیل ہلالیہ اور عمرو بن وھب الثقفی کے گھر خریدے۔"
  tr: "Muhammed ibn Süleyman ibn Ali ibn Abdullah ibn al-Abbas; Basra'nın valisi; Basra'nın valisi olup, onun saltanatı sırasında el-Mehdi, camideki Nafi' ibn al-Harith, Um Jamil al-Hilaliyya ve Amr ibn Wahb al-Thaqafi'nin rolünü artırmıştır. Referans notu: Bu kayıtta 292 Hicri'de Fustat'ın fethiyle ilişkilendirilir ve kendisinden bir asırdan fazla bir süre sonra olan Muhammed bin Süleyman el-Katib'in anlatıcısından gelmektedir (kişi/Muhammed ibn süleyman-el-Katib)."
  id: "Muhammad ibn Suleiman ibn Ali ibn Abdullah ibn al-Abbas; gubernur Basra, selama masa pemerintahannya al-Mahdi meningkatkan peran Nafi' ibn al-Harith, um Jamil al-Hilaliyya, dan Amr ibn Wahb al-Thaqafi di masjid tersebut. Catatan referensi: Ia dalam catatan ini dikaitkan dengan penaklukan Fustat pada tahun 292 H, dan ia berasal dari narator Muhammad ibn Sulayman al-Katib — orang lain lebih dari satu abad setelahnya (orang/Muhammad-ibn-sulayman-al-katib)."
