id: person/khalifa-ibn-khayyat
class: person
label:
  ar: خليفة بن خياط
  en: Khalifa Ibn Khayyat
  ur: خلیفہ بن خیاط
  es: "Khalifa Ibn Khayyat"
  fr: "Khalifa Ibn Khayyat"
summary:
  ar: أبو عمرو خليفة بن خياط العصفري البصري، الملقب «شباب»، محدث ومؤرخ، صاحب «التاريخ» و«الطبقات»، روى عنه البخاري في صحيحه. ولد في حدود سنة 160هـ، واختلف في وفاته بين 230 و240 و246هـ، ويرجح محقق تاريخه سنة 240هـ {cite:tarikh-khalifa-umari-1985 intro p. 5} {cite:tarikh-khalifa-umari-1985 intro p. 9} {cite:tarikh-khalifa-umari-1985 intro p. 13} {cite:tarikh-khalifa-umari-1985 intro p. 14}.
  en: Abu Amr Khalifa ibn Khayyat al-Usfuri of Basra, nicknamed 'Shabab', a hadith scholar and historian, author of the History and the Tabaqat, from whom al-Bukhari transmits in his Sahih. He was born around 160 AH; his death is variously given as 230, 240 or 246 AH, and the editor of his History prefers 240 {cite:tarikh-khalifa-umari-1985 intro p. 5} {cite:tarikh-khalifa-umari-1985 intro p. 9} {cite:tarikh-khalifa-umari-1985 intro p. 13} {cite:tarikh-khalifa-umari-1985 intro p. 14}.
  ur: ابو عمرو خلیفہ بن خیاط عصفری بصری، لقب «شباب»، محدث اور مؤرخ، «التاریخ» اور «الطبقات» کے مصنف، جن سے بخاری اپنی صحیح میں روایت کرتے ہیں۔ وہ تقریباً 160ھ میں پیدا ہوئے؛ ان کی وفات 230، 240 یا 246ھ بتائی جاتی ہے، اور ان کی تاریخ کے محقق 240ھ کو ترجیح دیتے ہیں {cite:tarikh-khalifa-umari-1985 intro p. 5} {cite:tarikh-khalifa-umari-1985 intro p. 9} {cite:tarikh-khalifa-umari-1985 intro p. 13} {cite:tarikh-khalifa-umari-1985 intro p. 14}۔
  es: "Abu Amr Khalifa ibn Khayyat al-Usfuri de Basora, apodado 'Shabab', un erudito en hadices e historiador, autor de la Historia y las Tabaqat, de quien al-Bujari transmite en su Sahih. Nació alrededor del año 160 AH; su muerte se menciona indistintamente como 230, 240 o 246 AH, y el editor de su Historia prefiere 240 {cite:tarikh-khalifa-umari-1985 intro p. 5} {cite:tarikh-khalifa-umari-1985 intro p. 9} {cite:tarikh-khalifa-umari-1985 intro p. 13} {cite:tarikh-khalifa-umari-1985 intro p. 14}."
  fr: "Abou Amr Khalifa ibn Khayyat al-Usfuri de Bassora, surnommé « Shabab », était un érudit du hadith et un historien, auteur de l'Histoire et des Tabaqat, dont al-Bukhari rapporte les hadiths dans son Sahih. Il serait né vers 160 AH; sa mort est diversement datée de 230, 240 ou 246 AH, l'éditeur de son Histoire privilégiant l'année 240."
  tr: "Ebu Amr Halife ibn Khayyat al-Asfari al-Basri, lakaplı 'Şabab', hadis alimi ve tarihçisi, 'Al-Tarikh' ve 'Al-Tabaqat' kitaplarının yazarıydı ve el-Buhari Sahih'inde ondan rivayet etmiştir. Yaklaşık 160 Hicri yılında doğmuştur ve ölümü hakkında 230, 240 ile 246 Hicri arasında farklı görüşlere sahiptir. Doğrulayıcı tarihinin 240 Hicri olmasını tercih eder {cite:Tarikh-khalifa-umari-1985 intro s. 5} {cite:Tarikh-khalifa-umari-1985 intro s. 13} {cite:Tarikh-khalifa-umari-1985 intro s. 14}."
  id: "Abu Amr Khalifa ibn Khayyat al-Asfari al-Basri, yang dijuluki 'Shabab,' adalah seorang ulama hadis dan sejarawan, penulis 'Al-Tarikh' dan 'Al-Tabaqat', dari siapa al-Bukhari menceritakan dalam Sahih-nya. Ia lahir sekitar tahun 160 H, dengan pendapat yang berbeda tentang kematiannya antara tahun 230, 240, dan 246 H. Verifier lebih memilih tanggalnya 240 H. {cite:Tarikh-khalifa-umari-1985 intro hlm. 5} {cite:Tarikh-khalifa-umari-1985 intro hlm. 13} {cite:Tarikh-khalifa-umari-1985 intro hlm. 14}."
