id: person/khalifa-ibn-khayyat
class: person
label:
  ar: خليفة بن خياط
  en: Khalifa Ibn Khayyat
  ur: خلیفہ بن خیاط
summary:
  ar: أبو عمرو خليفة بن خياط العصفري البصري، الملقب «شباب»، محدث ومؤرخ، صاحب «التاريخ» و«الطبقات»، روى عنه البخاري في صحيحه. ولد في حدود سنة 160هـ، واختلف في وفاته بين 230 و240 و246هـ، ويرجح محقق تاريخه سنة 240هـ {cite:tarikh-khalifa-umari-1985 intro p. 5} {cite:tarikh-khalifa-umari-1985 intro p. 9} {cite:tarikh-khalifa-umari-1985 intro p. 13} {cite:tarikh-khalifa-umari-1985 intro p. 14}.
  en: Abu Amr Khalifa ibn Khayyat al-Usfuri of Basra, nicknamed 'Shabab', a hadith scholar and historian, author of the History and the Tabaqat, from whom al-Bukhari transmits in his Sahih. He was born around 160 AH; his death is variously given as 230, 240 or 246 AH, and the editor of his History prefers 240 {cite:tarikh-khalifa-umari-1985 intro p. 5} {cite:tarikh-khalifa-umari-1985 intro p. 9} {cite:tarikh-khalifa-umari-1985 intro p. 13} {cite:tarikh-khalifa-umari-1985 intro p. 14}.
  ur: ابو عمرو خلیفہ بن خیاط عصفری بصری، لقب «شباب»، محدث اور مؤرخ، «التاریخ» اور «الطبقات» کے مصنف، جن سے بخاری اپنی صحیح میں روایت کرتے ہیں۔ وہ تقریباً 160ھ میں پیدا ہوئے؛ ان کی وفات 230، 240 یا 246ھ بتائی جاتی ہے، اور ان کی تاریخ کے محقق 240ھ کو ترجیح دیتے ہیں {cite:tarikh-khalifa-umari-1985 intro p. 5} {cite:tarikh-khalifa-umari-1985 intro p. 9} {cite:tarikh-khalifa-umari-1985 intro p. 13} {cite:tarikh-khalifa-umari-1985 intro p. 14}۔
