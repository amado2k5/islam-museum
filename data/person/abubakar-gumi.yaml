summary:
  ar: "عالم وقاضٍ نيجيري (توفي 1992)، قاضي قضاة المنطقة الشمالية (1962–1967) وأبرز وجوه الإصلاح السلفي في شمال نيجيريا. عُرف بمنازعته الطرق الصوفية وبترجمته معاني القرآن إلى الهوسية، وكان تلميذه إسماعيل إدريس مؤسس مجتمع الإزالة بتوجيهه."
  en: "Nigerian scholar and judge (d. 1992), Grand Khadi of the Northern Region (1962-1967) and the leading figure of Salafi reform in northern Nigeria. He was known for his public conflicts with the Sufi brotherhoods and for his translation of the Qur'an's meanings into Hausa; his student Ismaila Idris founded the Izala society under his direction."
  ur: "نائجیریا کے عالم اور قاضی (وفات 1992ء)، شمالی خطے کے قاضی القضاة (1962ء–1967ء) اور شمالی نائجیریا میں سلفی اصلاح کی نمایاں ترین شخصیت۔ وہ صوفی سلسلوں سے اپنے عوامی اختلافات اور قرآن کے معانی کے ہوسا ترجمے کے لیے مشہور تھے؛ انہی کے شاگرد اسماعیل ادریس نے ان کی رہنمائی میں جماعت ازالہ کی بنیاد رکھی۔"
