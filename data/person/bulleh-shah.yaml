summary:
  ar: "بلهي شاه (نحو 1680 – 1757)، واسمه سيد عبد الله شاه القادري، شاعر بنجابي صوفي من أكبر شعراء اللغة البنجابية. وُلد في أوج في أسرة سادة علماء، وتعلّم في قصور على حافظ غلام مرتضى ثم في لاهور على شاه عنايت القادري الذي بايعه، وقضى معظم حياته في قصور فتوفي ودُفن فيها. ترك أكثر من مئة وخمسين كافية بلغة الناس انتقد فيها الرياء والتعصب ودافع عن الإنسانية والمساواة، فصارت أقواله أمثالاً وأغانيَ حتى اليوم."
  en: "Bulleh Shah (c. 1680–1757), whose name was Sayyid Abdullah Shah Qadri, was a Punjabi Sufi poet, among the greatest poets of the Punjabi language. Born at Uch into a Sayyid family of scholars, he was educated at Kasur under Hafiz Ghulam Murtaza and then at Lahore under Shah Inayat Qadiri, whose disciple he became, and he spent most of his life at Kasur, where he died and was buried. His more than 150 kafis, in the language of the people, attacked hypocrisy and bigotry and preached humanity and equality, and his verses live on as proverbs and songs."
  ur: "بلھے شاہ (تقریباً 1680ء – 1757ء)، اصل نام سید عبد اللہ شاہ قادری، پنجابی صوفی شاعر اور پنجابی زبان کے عظیم ترین شاعروں میں سے تھے۔ اوچ میں سادات علماء کے گھرانے میں پیدا ہوئے، قصور میں حافظ غلام مرتضیٰ سے اور پھر لاہور میں شاہ عنایت قادری سے تعلیم و تربیت پائی جن کے مرید ہوئے، اور زندگی کا بیشتر حصہ قصور میں گزارا جہاں انتقال ہوا اور دفن ہوئے۔ ان کی ڈیڑھ سو سے زائد کافیاں عوام کی زبان میں منافقت اور تعصب پر تنقید اور انسان دوستی و مساوات کا درس دیتی ہیں اور آج تک ضرب المثل اور گیت بنی ہوئی ہیں۔"

