faith:
  - value: sufi
    basis: documented
    note: >-
      His initiation into a Sufi order is attested for the man himself
      in two independent publications. The English article records
      that he studied at Lahore under Shah Inayat Qadiri, a Sufi
      murshid, and became his disciple; the Urdu article records that
      he took bay'a at the hand of Shah Inayat and states that he
      belonged to the Qadiriyya school of the Sufis, the affiliation
      carried in his very name, Abdullah Shah Qadri, which the Arabic
      article styles al-Qadiri al-Shattari al-Qasuri. The Urdu article
      adds that Shattari thought also shaped him, through a murshid
      who himself held both affiliations; the order of his own
      attested initiation is the Qadiriyya, and his edge to it stands
      in his record. That clerics of Kasur declared him a kafir in his
      lifetime is an episode his sources record, not a settlement of
      his faith.
    sources: [source/wikipedia-bulleh-shah-en, source/wikipedia-bulleh-shah-ur, source/wikipedia-bulleh-shah-ar]

