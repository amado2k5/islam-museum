  - { value: "محمد بن جعفر بن العباس بن فساتنجس أبو الفرج", kind: full }
summary:
  ar: "الوزير ذو السعادات أبو الفرج بن فساتنجس؛ وزر لأبي كاليجار بفارس ووزر له ببغداد حين دخلها سنة ٤٣٦، وكانت له مرونة فائضة وكان مليح الشعر والترسل. اشتهر عنه أن بعض شهود الأهواز كتب إليه أن فلانًا مات وخلف خمسين ألف دينار مغربية وعقارًا بخمسين ألف دينار وخلف ولدًا له ثمانية أشهر، فإن رأى الوزير أن يُقرض من العين إلى حين بلوغ الطفل؛ فكتب على ظهر الرقعة جوابًا فيه أن المال والطفل والمتوفى أمورٌ لله والساعي ملعون، وأنه لا حاجة لهم إلى مال الأيتام. اعتُقل بقلعة بني ودام بجنديسابور أحد عشر شهرًا ثم أمر أبو كاليجار بقتله في رمضان سنة أربعين وأربعمائة وقد بلغ إحدى وخمسين سنة {cite:muntazam-ibn-al-jawzi j.8 p.478,480-481}."
  en: "Abu Kalijar's vizier in Fars and then Baghdad (appointed at the 436 entry); a man of easy grace and fine verse. Famous for the reply he wrote on the back of a report proposing to borrow against an eight-month-old orphan's hundred-thousand-dinar estate: 'The dead man — God's mercy; the child — God's neighbor; the money — God's fruit; the petitioner — God's curse; we have no need of orphans' wealth'. Held eleven months at Qal'at Bani Wudam in Jundishapur, then killed on Abu Kalijar's order in Ramadan 440, aged fifty-one {cite:muntazam-ibn-al-jawzi j.8 p.480-481}."
