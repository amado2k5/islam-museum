summary:
  ar: "الوزير ذو السعادات أبو الفرج بن فساتنجس؛ وزر لأبي كاليجار بفارس ووزر له ببغداد حين دخلها سنة ٤٣٦، وكانت له مرونة فائضة وكان مليح الشعر والترسل. اشتهر عنه أن بعض شهود الأهواز كتب إليه أن فلانًا مات وخلف خمسين ألف دينار مغربية وعقارًا بخمسين ألف دينار وخلف ولدًا له ثمانية أشهر، فإن رأى الوزير أن يُقرض من العين إلى حين بلوغ الطفل؛ فكتب على ظهر الرقعة جوابًا فيه أن المال والطفل والمتوفى أمورٌ لله والساعي ملعون، وأنه لا حاجة لهم إلى مال الأيتام. اعتُقل بقلعة بني ودام بجنديسابور أحد عشر شهرًا ثم أمر أبو كاليجار بقتله في رمضان سنة أربعين وأربعمائة وقد بلغ إحدى وخمسين سنة {cite:muntazam-ibn-al-jawzi j.8 p.478,480-481}."
  en: "Abu Kalijar's vizier in Fars and then Baghdad (appointed at the 436 entry); a man of easy grace and fine verse. Famous for the reply he wrote on the back of a report proposing to borrow against an eight-month-old orphan's hundred-thousand-dinar estate: 'The dead man — God's mercy; the child — God's neighbor; the money — God's fruit; the petitioner — God's curse; we have no need of orphans' wealth'. Held eleven months at Qal'at Bani Wudam in Jundishapur, then killed on Abu Kalijar's order in Ramadan 440, aged fifty-one {cite:muntazam-ibn-al-jawzi j.8 p.480-481}."
  es: "Visir de Abu Kalijar en Fars y luego en Bagdad (nombrado en la entrada del año 436); hombre de gracia natural y gran elocuencia. Famoso por la respuesta que escribió al dorso de un informe en el que proponía un préstamo con cargo a la herencia de cien mil dinares de un huérfano de ocho meses: «El difunto: misericordia de Dios; el niño: prójimo de Dios; el dinero: fruto de Dios; el solicitante: maldición de Dios; no necesitamos la riqueza de los huérfanos». Estuvo recluido once meses en Qal'at Bani Wudam en Jundishapur, y luego fue asesinado por orden de Abu Kalijar en Ramadán del año 440, a la edad de cincuenta y un años {cite:muntazam-ibn-al-jawzi j.8 p.480-481}."
  fr: "Vizir d'Abu Kalijar à Fars puis à Bagdad (nommé en 436); homme d'une grâce affable et d'une grande poésie. Célèbre pour la réponse qu'il écrivit au verso d'un rapport proposant un emprunt sur la fortune de cent mille dinars d'un orphelin de huit mois: « Le défunt – miséricorde de Dieu; l'enfant – bienfaiteur de Dieu; l'argent – grâce de Dieu; le demandeur – malédiction de Dieu; nous n'avons que faire des biens d'un orphelin. » Détenu onze mois à Qal'at Bani Wudam à Jundishapur, il fut ensuite exécuté sur ordre d'Abu Kalijar au Ramadan 440, à l'âge de cinquante et un ans (cf. Muntazam ibn al-Jawzi, vol. 8, p. 480-481)."
  ur: "فارس اور پھر بغداد میں ابوالجار کا وزیر ⁦(436 کے اندراج پر مقرر)⁩؛ آسان فضل اور عمدہ آیت کا آدمی۔ جواب کے لیے مشہور اس نے ایک رپورٹ کے پیچھے لکھا تھا جس میں آٹھ ماہ کے یتیم کی سو ہزار دینار جائیداد کے خلاف قرض لینے کی تجویز تھی: 'مردہ آدمی - خدا کی رحمت؛ بچہ - خدا کا پڑوسی؛ پیسہ - خدا کا پھل؛ درخواست گزار - خدا کی لعنت؛ ہمیں یتیموں کے مال کی کوئی ضرورت نہیں۔ جندیشا پور میں قلات بنی ودام میں گیارہ مہینے رہے، پھر رمضان المبارک 440 میں ابواللیجر کے حکم پر، اکیاون سال کی عمر میں قتل کر دیا گیا۔"
  tr: "Mutlu bakan Ebu el-Faraj bin Fastantangis'ti; Efü Kalicar'a Pers'te bakan olarak atandı ve 436 Hicri yılına girdiğinde Bağdat'a atandı. Olağanüstü esnekliğe sahipti ve şiir ile iletişimde yetenekliydi. Ahvaz'dan bazı tanıkların ona, şu kişinin öldüğünü, geride elli bin Fas dinarı ve elli bin dinar değerinde bir mülk bıraktığını, geride sekiz aylık bir çocuk bıraktığını yazdığı iyi biliniyordu. Bakan, çocuk olgunlaşana kadar 'Ayn'dan borç almayı uygun görürse, paketin arkasına para, çocuklar ve ölenlerin Tanrı'nın işi olduğunu, arayanların lanetli olduğunu ve yetimlerin parasına ihtiyaç duymadığını belirten bir yanıt yazardı. Nadisapur'daki Bani Wadam Kalesi'nde on bir ay boyunca tutuklandı, ardından Abu Kalijar, elli bir yaşına geldiğinde, dört yüz kırk hicri yılında Ramazan'da idamını emretti {cite:Muntazam-ibn-al-jawzi J.8 s.478,480-481}."
  id: "Menteri yang bahagia adalah Abu al-Faraj ibn Fastantangis; ia diangkat menjadi menteri untuk Abu Kalijar di Persia dan menunjuknya di Baghdad saat ia masuk pada tahun 436 H. Ia memiliki fleksibilitas luar biasa dan mahir dalam puisi serta komunikasi. Diketahui bahwa beberapa saksi dari Ahvaz menulis kepadanya bahwa si anu telah meninggal, meninggalkan lima puluh ribu dinar Maroko dan harta senilai lima puluh ribu dinar, serta meninggalkan seorang anak berusia delapan bulan. Jika menteri memutuskan untuk meminjam dari 'Ain sampai anak itu dewasa, ia menulis di belakang paket balasan yang menyatakan bahwa uang, anak-anak, dan yang telah meninggal adalah urusan Tuhan dan pencari akan dikutuk, dan mereka tidak membutuhkan uang anak yatim. Ia ditangkap di Benteng Bani Wadam di Nadisapur selama sebelas bulan, kemudian Abu Kalijar memerintahkan eksekusinya pada Ramadan tahun empat ratus empat puluh H, ketika ia berusia lima puluh satu tahun {cite:Muntazam-ibn-al-jawzi J.8 hlm.478,480-481}."
