summary:
  ar: "كاتب ومترجم وأستاذ باللغة الأردية (1832-1910) من دلهي، تلميذ كلية دلهي وأستاذها. ترجم نصوص العلوم والفلسفة الغربية إلى الأردية لرابطة الترجمة العامية ثم للجمعية العلمية التابعة لسيد أحمد خان، وكان من أنصار حركة عليكرة الأوائل، وأنهى خدمته أستاذا في كلية موير المركزية بالله آباد. ألّف «تاريخ هندستان»، مجموع تاريخ الهند في أربعة عشر مجلدا بالأردية، وله مؤلفات كثيرة في التاريخ والأخلاق والعلوم."
  en: "Urdu writer, translator and professor (1832–1910) of Delhi, educated at Delhi College, where he later taught. He translated Western science, history and philosophy into Urdu for the Vernacular Translation Society and then for Syed Ahmad Khan's Scientific Society, was an early supporter of the Aligarh Movement, and ended his service as professor at Muir Central College, Allahabad. His Tarikh-e-Hindustan is a fourteen-volume history of India in Urdu, among many works on history, ethics and science."
  ur: "اردو کے مصنف، مترجم اور استاد (1832ء–1910ء) جن کا تعلق دلی سے تھا؛ دلی کالج میں تعلیم پائی اور وہیں پڑھایا بھی۔ انھوں نے مغربی علوم، تاریخ اور فلسفے کے متن اردو میں ترجمہ کیے، سر سید احمد خان کی سائنٹفک سوسائٹی کے لیے کام کیا، علی گڑھ تحریک کے ابتدائی حامی رہے اور میور سنٹرل کالج الٰہ آباد میں پروفیسر کی حیثیت سے ریٹائر ہوئے۔ ان کی «تاریخ ہندستان» اردو میں ہندوستان کی چودہ جلدوں پر مشتمل تاریخ ہے۔"
