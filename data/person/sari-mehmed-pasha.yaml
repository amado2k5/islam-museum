  fr: "Fiche de convocation du Defterdar Sari Mehmed Pasha, trésorier ottoman du XVIIIe siècle et auteur de conseils aux vizirs, décédé en 1717; la source n'est pas encore vérifiée sur la page."
  ur: "اٹھارویں صدی کے عثمانی خزانچی اور وزیروں کے مشورے کے مصنف ڈیفٹردار ساری محمد پاشا کے لیے ڈرافٹ کارڈ۔ 1717; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
