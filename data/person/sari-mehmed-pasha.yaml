  ar: "بطاقة أولية لدفتردار ساري محمد باشا، وزير ومؤرخ عثماني صاحب «نصائح الوزراء» في القرن الثامن عشر، توفي سنة ١٧١٧م؛ تذكره كتب التاريخ ولم تُراجع ترجمته على الصفحة بعد."
