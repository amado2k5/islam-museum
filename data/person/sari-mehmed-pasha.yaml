  id: "Kartu pendahuluan untuk Daftardar Sari Mehmed Pasha, seorang wazir dan sejarawan Ottoman yang menulis 'Nasa'ih al-Wuzra' pada abad kedelapan belas, meninggal pada tahun 1717 M; ia disebutkan dalam buku sejarah, dan biografinya belum pernah diulas di halaman tersebut."
