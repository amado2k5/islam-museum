  source: "English Wikipedia 'Ali Khan (Sufi)' (revision 1313674815) and Arabic Wikipedia 'علي خان (صوفي)' (revision 73571226), each fetched by its recorded revision id with the returned id asserted equal before use, and Wikidata item Q4724949 (item revision 2518938266). The Arabic article is a translation of the English, and is counted as the same text family. Existence checks by name fragments (Ali Khan, Muhammad Ali Khan, محمد علي خان, علي خان), by Arabic label across data/person, and by QID found no prior record for this man; the existing ali-khan records (Bade Ghulam Ali Khan, Hafiz Ali Khan, Nouman Ali Khan and others) are different people. He was a second cousin of Inayat Khan — the grandson of Inayat's grandfather, and so regarded as a brother by Indian custom — and the related_to edge to person/hazrat-inayat-khan is written once, here, in the subject's own record: Ali Khan was Inayat Khan's cousin and later the leader of his movement. No group entity exists for the International Sufi Movement and no place entities exist for Baroda or The Hague, so no member_of, born_in, died_in or buried_in edge is written. Regions: south-asia for his Indian birth and formation, andalus-europe for the Western European base of his movement leadership and musical career. The lane queue gives 1881–1958; the sources agree."
