summary:
  ar: "موسيقي ومعلّم صوفي هندي (1881–1958)، وُلد في برودة وتوفي في لاهاي؛ قاد الحركة الصوفية العالمية من سنة 1948 حتى وفاته خلفًا لقريبه عنايت خان، وجمع بين التدريب على الموسيقى الهندية الكلاسيكية والغناء الأوبرالي الأوروبي حتى ظهر على مسرح لا سكالا، واشتهر بين مريديه بموهبة الشفاء."
  en: "Indian musician and Sufi teacher (1881–1958), born in Baroda and died in The Hague. He led the International Sufi Movement from 1948 until his death, in succession to his cousin Inayat Khan; trained in Indian classical music and in European operatic singing, he appeared on the stage of La Scala, and among his disciples he was known for a gift of healing."
  ur: "ہندوستانی موسیقار اور صوفی استاد (1881ء–1958ء)، بڑودہ میں پیدا ہوئے اور دی ہیگ میں وفات پائی؛ 1948 سے وفات تک عالمی صوفی تحریک کی قیادت کی، جو ان کے چچا زاد عنایت خان کی تحریک تھی، ہندوستانی کلاسیکی موسیقی اور یورپی اوپیرا گائیکی دونوں کی تربیت حاصل کی اور لا سکالا کے اسٹیج پر بھی نمودار ہوئے، اور اپنے مریدوں میں شفا کی صلاحیت کے لیے مشہور تھے۔"
