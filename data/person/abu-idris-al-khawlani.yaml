roles: [jurist]
summary:
  ar: "قاضٍ من قضاة عبد الملك بن مروان، وذكر الكتاب أنه تولى القضاء سنة 74هـ {cite:salabi-umayyad-state-2020 p.26}. وكانت له المظالم أيضاً، ثم أعفاه عبد الملك منها بطلبه، وكان يباشر النظر فيها بتكليف من الخليفة الذي كان يجلس للمظالم بنفسه {cite:salabi-umayyad-state-2020 p.28}. ويذكر الكتاب أنه كان عالم الشام بعد أبي الدرداء، وأحسن الناس تلاوة للقرآن، وكان الحلق في مسجد دمشق يقرؤون القرآن في زمن عبد الملك وهو جالس، وأنه عزله عبد الملك عن القصص وأبقاه على القضاء. {cite:salabi-umayyad-state-2020 p.276-277}"
  en: "A qadi of Abd al-Malik ibn Marwan; the book says he took up the judgeship in 74 AH {cite:salabi-umayyad-state-2020 p.26}. He also held the mazalim (grievances) jurisdiction, which Abd al-Malik relieved him of at his own request, though he went on hearing those cases on the caliph's commission, the caliph himself sitting for the mazalim {cite:salabi-umayyad-state-2020 p.28}. The book calls him the scholar of Syria after Abu l-Darda, the finest of people in Qur'an recitation, and says that in Abd al-Malik's time the circles in the Damascus mosque read the Qur'an while he sat; Abd al-Malik removed him from the storytellers' office and kept him in the judgeship {cite:salabi-umayyad-state-2020 p.276-277}."
