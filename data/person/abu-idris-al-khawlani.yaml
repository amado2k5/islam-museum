summary:
  ar: "قاضٍ من قضاة عبد الملك بن مروان، وذكر الكتاب أنه تولى القضاء سنة 74هـ {cite:salabi-umayyad-state-2020 p.26}. وكانت له المظالم أيضاً، ثم أعفاه عبد الملك منها بطلبه، وكان يباشر النظر فيها بتكليف من الخليفة الذي كان يجلس للمظالم بنفسه {cite:salabi-umayyad-state-2020 p.28}. ويذكر الكتاب أنه كان عالم الشام بعد أبي الدرداء، وأحسن الناس تلاوة للقرآن، وكان الحلق في مسجد دمشق يقرؤون القرآن في زمن عبد الملك وهو جالس، وأنه عزله عبد الملك عن القصص وأبقاه على القضاء. {cite:salabi-umayyad-state-2020 p.276-277}"
  en: "A qadi of Abd al-Malik ibn Marwan; the book says he took up the judgeship in 74 AH {cite:salabi-umayyad-state-2020 p.26}. He also held the mazalim (grievances) jurisdiction, which Abd al-Malik relieved him of at his own request, though he went on hearing those cases on the caliph's commission, the caliph himself sitting for the mazalim {cite:salabi-umayyad-state-2020 p.28}. The book calls him the scholar of Syria after Abu l-Darda, the finest of people in Qur'an recitation, and says that in Abd al-Malik's time the circles in the Damascus mosque read the Qur'an while he sat; Abd al-Malik removed him from the storytellers' office and kept him in the judgeship {cite:salabi-umayyad-state-2020 p.276-277}."
  fr: "Cadi d'Abd al-Malik ibn Marwan ; le livre dit qu'il prit la charge de cadi en 74 H {cite:salabi-umayyad-state-2020 p.26}. Il détint aussi la juridiction des mazalim (doléances), dont Abd al-Malik le déchargea à sa propre demande, bien qu'il continuât d'entendre ces affaires sur commission du calife, le calife siégeant lui-même pour les mazalim {cite:salabi-umayyad-state-2020 p.28}. Le livre l'appelle le savant de la Syrie après Abu l-Darda, le meilleur des gens dans la récitation du Coran, et dit qu'au temps d'Abd al-Malik les cercles de la mosquée de Damas lisaient le Coran tandis qu'il siégeait ; Abd al-Malik lui retira la charge des conteurs et le maintint dans celle de cadi {cite:salabi-umayyad-state-2020 p.276-277}."
  es: "Un cadí de Abd al-Malik ibn Marwan; el libro dice que asumió el cargo de juez en el año 74 de la Hégira {cite:salabi-umayyad-state-2020 p.26}. También tenía jurisdicción sobre los mazalim (agravios), de la cual Abd al-Malik lo relevó a petición propia, aunque continuó conociendo esos casos por encargo del califa, quien presidía los mazalim {cite:salabi-umayyad-state-2020 p.28}. El libro lo llama el erudito de Siria después de Abu l-Darda, el más destacado en la recitación del Corán, y dice que en tiempos de Abd al-Malik, los círculos en la mezquita de Damasco leían el Corán mientras él estaba sentado; Abd al-Malik lo apartó del cargo de narrador y lo mantuvo en el cargo de juez {cite:salabi-umayyad-state-2020 p.276-277}."
  ur: "عبد الملک بن مروان کا ایک قاضی؛ کتاب کہتی ہے کہ انہوں نے 74 ہجری میں قاضی کا عہدہ سنبھالا {حوالہ: سلبی امیہ ریاست-2020 صفحہ 26}۔ اس کے پاس مزلیم ⁦(شکایات)⁩ کا دائرہ بھی تھا، جسے عبد الملک نے اس کی اپنی درخواست پر فارغ کر دیا، حالانکہ وہ خلیفہ کے کمیشن میں ان مقدمات کی سماعت کرتا چلا گیا، خلیفہ خود مزلیم کے لیے بیٹھا ہوا تھا۔ کتاب میں انہیں ابو الدرداء کے بعد شام کا عالم کہا گیا ہے، جو قرآن کی تلاوت کرنے والے لوگوں میں سب سے بہترین تھا، اور کہتا ہے کہ عبد الملک کے زمانے میں دمشق کی مسجد میں حلقے بیٹھ کر قرآن پڑھتے تھے۔ عبد الملک نے اسے کہانی سنانے والوں کے دفتر سے ہٹا دیا اور جج کے عہدے پر رکھا۔"
  tr: "Kitapta, Abdülmalik ibn Mervan döneminde kadı olarak görev yaptığı belirtilen bu kişinin, Hicri 74 yılında kadılık görevini üstlendiği ifade edilmektedir (kaynak:salabi-umayyad-state-2020 s.26). Ayrıca şikayet davalarına da bakma yetkisine sahipti, ancak Abdülmalik onun isteği üzerine bu sorumluluğundan onu azletti. Halifenin emriyle bu davaları denetlemeye devam etti ve şikayet duruşmalarına bizzat halife başkanlık etti (kaynak:salabi-umayyad-state-2020 s.28). Kitap ayrıca, Ebu el-Darda'dan sonra Şam'ın en bilgili alimi ve Kur'an'ı en güzel okuyan kişi olduğunu da belirtmektedir. Abdülmalik zamanında, Şam camisinde insanlar Kur'an'ı daireler halinde okurken o da otururdu. Abdülmalik onu hikaye anlatıcılığı görevinden aldı, ancak kadı olarak görevinde tuttu. {cite:salabi-umayyad-state-2020 pp.276-277}"
  id: "Seorang hakim pada masa pemerintahan Abd al-Malik ibn Marwan, buku tersebut menyatakan bahwa ia menduduki posisi hakim pada tahun 74 H {cite:salabi-umayyad-state-2020 p.26}. Ia juga memiliki yurisdiksi atas pengaduan, tetapi Abd al-Malik membebaskannya dari tanggung jawab ini atas permintaannya. Ia terus mengawasi kasus-kasus ini atas perintah Khalifah, yang secara pribadi memimpin sidang pengaduan {cite:salabi-umayyad-state-2020 p.28}. Buku tersebut juga menyebutkan bahwa ia adalah ulama paling terpelajar di Damaskus setelah Abu al-Darda', dan pembaca Al-Quran yang paling fasih. Pada masa Abd al-Malik, orang-orang akan membaca Al-Quran secara melingkar di masjid Damaskus sementara ia duduk. Abd al-Malik mencopotnya dari posisinya sebagai pembaca Al-Quran tetapi tetap mempertahankannya sebagai hakim. {cite:salabi-umayyad-state-2020 pp.276-277}"
