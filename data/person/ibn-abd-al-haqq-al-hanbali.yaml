summary:
  ar: "المحدث الحنبلي الدمشقي؛ سمع الكثير بإفادة جده لأمه من مجد بن أبي النايب وعائشة بنت المسلم الحرانية والمِزّي وخلق من أصحاب ابن عبد الدايم؛ قال ابن حجر: سمعت عليه كثيراً وكان قد تفرد بكثير من الروايات وكان عسراً في التحديث {cite:shadharat-dhahab p. 23}."
  en: "The Hanbali transmitter who held unique riwayat — Ibn Hajar heard much on him and notes he was slow at dictation {cite:shadharat-dhahab p. 23}."
  es: "El transmisor hanbalí que poseía riwayat únicas — Ibn Hajar escuchó mucho sobre él y señala que era lento al dictar {cite:shadharat-dhahab p. 23}."
  fr: "Le transmetteur hanbalite qui détenait une riwayat unique — Ibn Hajar a beaucoup entendu parler de lui et note qu'il était lent à la dictée {cite:shadharat-dhahab p. 23}."
  ur: "حنبلی ٹرانسمیٹر جس نے منفرد رویت اختیار کی - ابن حجر نے ان کے بارے میں بہت کچھ سنا اور نوٹ کیا کہ وہ ڈکٹیشن میں سست تھے۔ 23}۔"
  tr: "Hanbali hadis âlimi El-Dimaşki; annesinin babası hakkında Majd ibn Ebi el-Nayeb, Aişe bint el-Muslim el-Harraniyya, el-Mizzi ve İbn Abdül-Dayem'in bazı sahabelerinden çok şey duymuştur. İbn Hajar şöyle demiştir: Ondan çok şey duydum, birçok rivayette eşsizdi ve rivayet etmekte zordu. {alıntı:Shadharat-Dhahab, s. 23}."
  id: "Ulama hadis Hanbali Al-Dimashqi; ia banyak mendengar tentang kakek dari pihak ibu yang menceritakan dari Majd ibn Abi al-Nayeb, Aisha bint al-Muslim al-Harraniyya, al-Mizzi, dan beberapa sahabat Ibn Abd al-Dayem. Ibn Hajar berkata: Saya banyak mendengar darinya, dan ia unik dalam banyak riwayat serta sulit dalam narasi. {cite:Shadharat-Dhahab, hlm. 23}."
