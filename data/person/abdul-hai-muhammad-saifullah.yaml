summary:
  ar: "عالم وداعية ومؤلف بنغلاديشي، خطيب مجمع مسجد الجمعة في بالابي بدكا؛ قناته على يوتيوب (@abdulhisaifullahofficial) بلغت 400,000 مشترك بحسب vidIQ كما قُرئت في 8 نوفمبر 2026، وصفحته الموثقة على فيسبوك بلغت 3.3 مليون متابع بحسب بيانات منشورات أكتوبر 2026؛ تخرّج في الحديث من جامعة كوشتيا الإسلامية حائزًا الميدالية الذهبية الرئاسية، وهو مؤلف كتب منشورة منذ 2021."
  en: "Bangladeshi scholar, preacher and author, khatib of Masjidul Juma Complex in Pallabi, Dhaka; his YouTube channel (@abdulhisaifullahofficial) counted 400,000 subscribers by vidIQ as read on 8 November 2026, and his verified Facebook page counted 3.3 million followers by October 2026 post metadata. He graduated in Al-Hadith from Islamic University, Kushtia with the President's Gold Medal, and is the author of books published from 2021."
  ur: "بنگلہ دیشی عالم، مبلغ اور مصنف، ڈھاکہ کے پلّابی میں مسجد الجمعہ کمپلیکس کے خطیب؛ ان کے یوٹیوب چینل (@abdulhisaifullahofficial) کے سبسکرائبر vidIQ کے مطابق 8 نومبر 2026ء کی خوانی پر 400,000 تھے، اور ان کے تصدیق شدہ فیس بک پیج کے فالوور اکتوبر 2026ء کی پوسٹوں کے میٹا ڈیٹا کے مطابق 3.3 ملین تھے۔ انھوں نے اسلامی یونیورسٹی، کشتیا سے الحدیث میں صدارتی طلائی تمغے کے ساتھ گریجویشن کیا، اور 2021ء سے ان کی کتابیں شائع ہو رہی ہیں۔"
