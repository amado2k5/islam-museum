r, Dhaka; and the publisher author biographies (Alada Boi, opened and read in full for this build; Pathshala Book Center carries a near-identical text), giving his Naogaon upbringing, his Al-Hadith honours and masters at Islamic University, Kushtia with the President's Gold Medal for standing faculty-first, his MPhil and doctoral research there, his teacher Dr Khandaker Abdullah Jahangir, his religious-director post at the private telecom EBS, and his books from the 2021 Ekushey Book Fair. Corroboration noted in the publisher source but not separately registered: his supervisor's Islamic University curriculum vitae lists his MPhil (awarded 2018) and his PhD (in progress). Searches in the checks pass found no English or Bengali Wikipedia article and no Wikidata item for him, so no wikidata id is recorded. De-duplicated against the snapshot: no abdul-hai-muhammad-saifullah record exists, and a grep for 'Saifullah' across data/person returns only a district name inside an unrelated record. vidIQ's channel spelling 'Abdul Hi Muhammad Saifullah' is recorded as an alternate name for the same man and the same channel."
