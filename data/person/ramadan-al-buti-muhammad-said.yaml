  note: "Born in the village of Jilka (Jeilka) in the Botan (Cizre, Jazirat ibn Umar) district of Turkey, on the Tigris where the Syrian, Iraqi and Turkish borders meet, into a Hadhabani Kurdish family; the Arabic article pairs the birth year with 1347 AH. He was brought to Damascus at the age of four. Neither Jilka nor Cizre has a place entity, so no born_in edge is written."
