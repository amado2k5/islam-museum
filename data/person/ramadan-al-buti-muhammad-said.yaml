  status: historical
  derived: true
  note: "Assassinated while giving a tafsir lesson at the al-Iman Mosque in the Mazraa district of Damascus, in a bomb attack that killed at least 42 people including his grandson; the Arabic article pairs the day with Thursday 9 Jumada al-awwal 1434. He was buried beside the shrine of Saladin, next to the Umayyad Mosque."
