summary:
  ar: "عالم سوري من أصل كردي، من أكثر المؤلفين المسلمين قراءةً في عصره. وُلد سنة 1929 في قرية جليكا قرب جزيرة بوطان ونشأ في دمشق، فتولّى عمادة كلية الشريعة بجامعة دمشق وخُطبة الجامع الأموي، وألّف أكثر من ستين كتابًا في الفقه وأصوله والسيرة والعقيدة دفاعًا عن المذهب الشافعي ومنهج الأشاعرة؛ اغتيل وهو يدرّس في جامع الإيمان بدمشق في مارس 2013."
  en: "Syrian Sunni scholar of Kurdish origin, among the most widely read Muslim authors of his age. Born in 1929 in the village of Jilka near Cizre and raised in Damascus, he became dean of the Faculty of Sharia at Damascus University and preacher of the Umayyad Mosque, and wrote more than sixty books in fiqh, usul, sira and creed in defence of the Shafi'i school and the Ash'ari method. He was assassinated while teaching at the al-Iman Mosque in Damascus in March 2013."
  ur: "کرد نژاد شامی سنی عالم، اپنے دور کے سب سے زیادہ پڑھے جانے والے مسلم مصنفین میں سے ایک۔ 1929 میں جزرے کے قریب گاؤں جلکا میں پیدا ہوئے اور دمشق میں پرورش پائی؛ جامعہ دمشق کی کلیۃ الشریعہ کے ڈین اور جامع اموی کے خطیب بنے، اور فقہ، اصول، سیرت اور عقیدے میں ساٹھ سے زیادہ کتابیں لکھیں جن میں شافعی مسلک اور اشعری منہج کا دفاع کیا۔ مارچ 2013 میں دمشق کی جامع الایمان میں درس دیتے ہوئے قتل کر دیے گئے۔"
