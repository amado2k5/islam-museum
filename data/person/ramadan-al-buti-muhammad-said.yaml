    note: "Two independent texts name the school for the man himself. The English article states that he 'specialized in fiqh and usul al-fiqh according to the Shafi'i school of law', and that the neo-traditionalism he led adhered to 'the four schools of thought in Sunni Islam and the orthodox Ash'arite creed'; the Arabic article states in its lead that he 'represents the conservative trend, Shafi'i in madhhab, and on the creed of Ahl al-Sunna according to the Ash'ari method'. His Ash'ari creed has no enum value of its own and is carried in this note only. Wikidata's structured Sunni and Shafi'i values corroborate but settle nothing on their own."
