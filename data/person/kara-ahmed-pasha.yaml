summary:
  ar: "قره أحمد باشا، صدر أعظم عثماني من أصل ألباني في عهد سليمان القانوني، تولى أغا الإنكشارية، ثم قائدًا عامًا ضد الفرس، وأُعدم في 13 ذي القعدة 962هـ/28 سبتمبر 1555م {cite:encyclopaedia-of-islam-2 vol. 1 p. 313}."
  en: "Kara Ahmed Pasha, Ottoman grand vizier under Sulayman I, of Albanian origin and educated in the palace. He became agha of the Janissaries in 927/1521, took part in the Hungarian campaigns, and was made second vizier in 1548. He was beheaded on 13 Dhu'l-Qa'da 962/28 September 1555 {cite:encyclopaedia-of-islam-2 vol. 1 p. 313}."
