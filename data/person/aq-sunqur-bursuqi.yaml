summary:
  ar: "آق سنقر البرسقي، أمير الموصل ومن قواد السلطان محمود السلجوقي، اشتغل بجهاد الصليبيين، وفي سنة ٥٢٠هـ قتله الباطنيون وهو يصلي في الجامع الكبير في الموصل. قال عنه ابن الأثير: «كان مملوكاً تركياً خيراً، يحب أهل العلم والصالحين ويرى العدل ويفعله، وكان خير الولاة، يحافظ على الصلوات في أوقاتها، ويصلي من الليل متهجداً» {cite:dawlat-uthmaniyya-salabi p. 35}."
  en: "Aq Sunqur al-Bursuqi — atabeg of Mosul and crusade-fighter, assassinated by the Batinis in 1126 while at prayer in Mosul's Great Mosque; Ibn al-Athir calls him the best of governors {cite:dawlat-uthmaniyya-salabi p. 35}."
  es: "Aq Sunqur al-Bursuqi — atabeg de Mosul y combatiente cruzado, asesinado por los Batinis en 1126 mientras rezaba en la Gran Mezquita de Mosul; Ibn al-Athir lo llama el mejor de los gobernadores {cite:dawlat-uthmaniyya-salabi p. 35}."
  fr: "Aq Sunqur al-Bursuqi — atabeg de Mossoul et combattant croisé, assassiné par les Batinis en 1126 alors qu'il priait dans la Grande Mosquée de Mossoul; Ibn al-Athir le qualifie de meilleur des gouverneurs {cite:dawlat-uthmaniyya-salabi p. 35}."
  ur: "آق سنقر البرسوقی - موصل کا عتبیگ اور صلیبی جنگجو، 1126 میں موصل کی عظیم مسجد میں نماز کے دوران بطینیوں کے ہاتھوں قتل ہوا؛ ابن اثیر نے اسے بہترین گورنر کہا ہے۔ 35}۔"
  tr: "Musul Emiri ve Sultan Mahmud Selçuklu'nun komutanlarından biri olan Aq Sunqur al-Barsuqi, Haçlı cihadına katıldı ve 520 Hicri'de Musul Büyük Camii'nde namaz kılırken Batiniyyeler tarafından öldürüldü. İbn al-Athir onun hakkında şöyle demiştir: \"O iyi bir Türk Memlüktü, alimleri ve doğruları severdi, adaleti görür ve uygulardı, en iyi hükümdardı; belirlenen zamanlarda namaz kılan ve geceleri dini bir halde namaz kılan en iyi hükümdardı.\" {atıf:Davlat-Uthmaniyya-Salabi s. 35}."
  id: "Aq Sunqur al-Barsuqi, Emir Mosul dan salah satu komandan Sultan Mahmud Seljuk, terlibat dalam jihad Salib, dan pada tahun 520 H dibunuh oleh Batiniyya saat berdoa di Masjid Agung Mosul. Ibn al-Athir berkata tentangnya: \"Dia adalah Mamluk Turki yang baik, mencintai para ulama dan orang benar, melihat keadilan dan mempraktikkannya, serta penguasa terbaik, yang menepati doa pada waktu yang ditentukan dan berdoa di malam hari dalam keadaan religius.\" {cite:dawlat-uthmaniyya-salabi hlm. 35}."
