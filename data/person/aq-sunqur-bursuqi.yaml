summary:
  ar: "آق سنقر البرسقي، أمير الموصل ومن قواد السلطان محمود السلجوقي، اشتغل بجهاد الصليبيين، وفي سنة ٥٢٠هـ قتله الباطنيون وهو يصلي في الجامع الكبير في الموصل. قال عنه ابن الأثير: «كان مملوكاً تركياً خيراً، يحب أهل العلم والصالحين ويرى العدل ويفعله، وكان خير الولاة، يحافظ على الصلوات في أوقاتها، ويصلي من الليل متهجداً» {cite:dawlat-uthmaniyya-salabi p. 35}."
  en: "Aq Sunqur al-Bursuqi — atabeg of Mosul and crusade-fighter, assassinated by the Batinis in 1126 while at prayer in Mosul's Great Mosque; Ibn al-Athir calls him the best of governors {cite:dawlat-uthmaniyya-salabi p. 35}."
