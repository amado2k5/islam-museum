summary:
  ar: "عازف سرود ومعلّم موسيقى هندي (نحو 1881–1972)، وُلد في شيببور بالبنغال وتعلّم في رامبور على يد وزير خان، ثم صار موسيقيَّ بلاط مَيهار ومؤسس غرانتها. خرّج جيلا غيّر وجه الموسيقى الهندية، في مقدمته ابنه علي أكبر خان ورافي شنكر ونيكهيل بانرجي، وكان أول موسيقي هندستاني ينال وسام بادما فيبوشان."
  en: "Indian sarod player and music teacher (circa 1881–1972), born at Shibpur in Bengal and trained at Rampur under Wazir Khan; he became the court musician of Maihar and founder of its gharana. He trained a generation that reshaped Indian music — his son Ali Akbar Khan, Ravi Shankar and Nikhil Banerjee among them — and was the first Hindustani musician to receive the Padma Vibhushan."
  ur: "ہندوستانی سرود نواز اور موسیقی کے استاد (تقریباً 1881ء–1972ء)، بنگال کے شیب پور میں پیدا ہوئے اور رام پور میں وزیر خان سے تعلیم پائی؛ بعد ازاں مَیہر کے درباری موسیقار اور اس کے گھرانے کے بانی ہوئے۔ ان کے شاگردوں میں ان کے بیٹے علی اکبر خان، روی شنکر اور نکھل بنرجی جیسے نام شامل ہیں جنھوں نے ہندوستانی موسیقی کی صورت بدل دی؛ وہ پدما وبھوشن پانے والے پہلے ہندوستانی موسیقار تھے۔"
