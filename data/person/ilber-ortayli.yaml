summary:
  ar: "مؤرخ تركي من أصل تتاري قرمي (1947–2026)، من أبرز مؤرخي الدولة العثمانية في جيله. وُلد في مخيم للاجئين ببريغنز في النمسا وهاجر مع أسرته إلى تركيا في الثانية من عمره، ودرس في أنقرة وفيينا وشيكاغو حيث نال الماجستير بإشراف خليل إينالجيك، ثم الدكتوراه من جامعة أنقرة سنة 1978. درّس في جامعات أنقرة وغلطة سراي وبيلكنت، وأدار متحف قصر طوب قابي من 2005 إلى 2012، واشتهر بكتبه وبرامجه التي قرّبت التاريخ العثماني من الجمهور الواسع. توفي بإسطنبول في 13 مارس 2026 ودُفن في مقبرة جامع الفاتح."
  en: "Turkish historian of Crimean Tatar origin (1947–2026), among the most prominent Ottoman historians of his generation. Born in a refugee camp at Bregenz, Austria, he came to Turkey aged two, studied at Ankara, Vienna and Chicago — his master's under Halil İnalcık — and took his doctorate at Ankara University in 1978. He taught at Ankara, Galatasaray and Bilkent universities, directed the Topkapı Palace Museum from 2005 to 2012, and brought Ottoman history to a mass audience through his books and television programmes. He died at Istanbul on 13 March 2026 and was buried in the Fatih Mosque graveyard."
  ur: "ترک مؤرخ، قریم تاتار نژاد (1947–2026)، اپنی نسل کے ممتاز ترین عثمانی مؤرخین میں سے ایک۔ آسٹریا کے بریگنز میں پناہ گزین کیمپ میں پیدا ہوئے، دو برس کی عمر میں خاندان کے ساتھ ترکی آئے، انقرہ، ویانا اور شکاگو میں تعلیم پائی — ماسٹرز خلیل انالجک کی نگرانی میں — اور 1978ء میں انقرہ یونیورسٹی سے ڈاکٹریٹ کیا۔ انقرہ، غلطہ سرای اور بلقنت یونیورسٹیوں میں پڑھایا، 2005ء سے 2012ء تک توپ قاپی محل عجائب گھر کے مدیر رہے، اور اپنی کتابوں اور ٹیلی ویژن پروگراموں سے عثمانی تاریخ کو وسیع عوام تک پہنچایا۔ 13 مارچ 2026ء کو استنبول میں وفات پائی اور فاتح مسجد کے قبرستان میں دفن ہوئے۔"
  es: "Historiador turco de origen tártaro de Crimea (1947-2026), uno de los historiadores otomanos más destacados de su generación. Nacido en un campo de refugiados en Bregenz, Austria, llegó a Turquía a los dos años, estudió en Ankara, Viena y Chicago —donde obtuvo su maestría bajo la tutela de Halil İnalcık— y se doctoró en la Universidad de Ankara en 1978. Impartió clases en las universidades de Ankara, Galatasaray y Bilkent, dirigió el Museo del Palacio de Topkapi de 2005 a 2012 y difundió la historia otomana a un público amplio a través de sus libros y programas de televisión. Falleció en Estambul el 13 de marzo de 2026 y fue enterrado en el cementerio de la Mezquita Fatih."
  fr: "Historien turc d'origine tatare de Crimée (1947-2026), il compte parmi les plus éminents historiens ottomans de sa génération. Né dans un camp de réfugiés à Bregenz, en Autriche, il arrive en Turquie à l'âge de deux ans. Il étudie à Ankara, Vienne et Chicago – où il obtient sa maîtrise sous la direction de Halil İnalcık – et soutient sa thèse de doctorat à l'université d'Ankara en 1978. Il enseigne aux universités d'Ankara, de Galatasaray et de Bilkent, dirige le musée du palais de Topkapı de 2005 à 2012 et contribue à populariser l'histoire ottomane grâce à ses livres et ses émissions de télévision. Il s'éteint à Istanbul le 13 mars 2026 et repose au cimetière de la mosquée Fatih."
  tr: "Kırım Tatar kökenli Türk tarihçisi (1947–2026), kuşağının en önde gelen Osmanlı İmparatorluğu tarihçilerinden biridir. Bregenz, Avusturya'daki bir mülteci kampında doğdu ve iki yaşında ailesiyle birlikte Türkiye'ye göç etti. Ankara, Viyana ve Chicago'da eğitim gördü; burada Halil İnçıcık'ın danışmanlığında yüksek lisans yaptı, ardından 1978'de Ankara Üniversitesi'nden doktora derecesi aldı. Ankara, Galatasaray ve Bilkent üniversitelerinde eğitim aldı, 2005-2012 yılları arasında Topkapı Saray Müzesi'ni yönetti; Osmanlı tarihini geniş kitlelere daha yakın hale getiren kitapları ve programlarıyla ün kazandı. 13 Mart 2026'da İstanbul'da hayatını kaybetti ve Fatih Camii mezarlığına defnedildi."
  id: "Seorang sejarawan Turki keturunan Tatar Krimea (1947–2026), salah satu sejarawan paling terkemuka dari Kekaisaran Ottoman pada generasinya. Ia lahir di kamp pengungsi di Bregenz, Austria, dan bermigrasi bersama keluarganya ke Turki pada usia dua tahun. Ia belajar di Ankara, Wina, dan Chicago, di mana ia meraih gelar master di bawah bimbingan Halil Incıcık, kemudian meraih gelar PhD dari Universitas Ankara pada tahun 1978. Ia belajar di universitas Ankara, Galatasaray, dan Bilkent, serta mengelola Museum Istana Topkapi dari tahun 2005 hingga 2012, menjadi terkenal karena buku dan programnya yang membawa sejarah Ottoman lebih dekat ke khalayak luas. Ia meninggal di Istanbul pada 13 Maret 2026, dan dimakamkan di pemakaman Masjid Fatih."
