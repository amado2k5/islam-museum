summary:
  ar: "مؤرخ تركي من أصل تتاري قرمي (1947–2026)، من أبرز مؤرخي الدولة العثمانية في جيله. وُلد في مخيم للاجئين ببريغنز في النمسا وهاجر مع أسرته إلى تركيا في الثانية من عمره، ودرس في أنقرة وفيينا وشيكاغو حيث نال الماجستير بإشراف خليل إينالجيك، ثم الدكتوراه من جامعة أنقرة سنة 1978. درّس في جامعات أنقرة وغلطة سراي وبيلكنت، وأدار متحف قصر طوب قابي من 2005 إلى 2012، واشتهر بكتبه وبرامجه التي قرّبت التاريخ العثماني من الجمهور الواسع. توفي بإسطنبول في 13 مارس 2026 ودُفن في مقبرة جامع الفاتح."
  en: "Turkish historian of Crimean Tatar origin (1947–2026), among the most prominent Ottoman historians of his generation. Born in a refugee camp at Bregenz, Austria, he came to Turkey aged two, studied at Ankara, Vienna and Chicago — his master's under Halil İnalcık — and took his doctorate at Ankara University in 1978. He taught at Ankara, Galatasaray and Bilkent universities, directed the Topkapı Palace Museum from 2005 to 2012, and brought Ottoman history to a mass audience through his books and television programmes. He died at Istanbul on 13 March 2026 and was buried in the Fatih Mosque graveyard."
  ur: "ترک مؤرخ، قریم تاتار نژاد (1947–2026)، اپنی نسل کے ممتاز ترین عثمانی مؤرخین میں سے ایک۔ آسٹریا کے بریگنز میں پناہ گزین کیمپ میں پیدا ہوئے، دو برس کی عمر میں خاندان کے ساتھ ترکی آئے، انقرہ، ویانا اور شکاگو میں تعلیم پائی — ماسٹرز خلیل انالجک کی نگرانی میں — اور 1978ء میں انقرہ یونیورسٹی سے ڈاکٹریٹ کیا۔ انقرہ، غلطہ سرای اور بلقنت یونیورسٹیوں میں پڑھایا، 2005ء سے 2012ء تک توپ قاپی محل عجائب گھر کے مدیر رہے، اور اپنی کتابوں اور ٹیلی ویژن پروگراموں سے عثمانی تاریخ کو وسیع عوام تک پہنچایا۔ 13 مارچ 2026ء کو استنبول میں وفات پائی اور فاتح مسجد کے قبرستان میں دفن ہوئے۔"
