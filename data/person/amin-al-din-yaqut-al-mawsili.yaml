label: { ar: "أمين الدين ياقوت الكاتب الموصلي", en: "Amin al-Din Yaqut, the Mosul scribe", es: "Amin al-Din Yaqut, the Mosul scribe", fr: "Amin al-Din Yaqut, the Mosul scribe", ur: "امین الدین یاقوت، موصل کا مصنف" }
summary:
  ar: "أمين الدين ياقوت الكاتب الموصلي صديق ابن الأثير وخطاط زمانه؛ يقول ابن الأثير: لم يكن في زمانه من يكتب ما يقاربه ولا من يؤدي طريقة ابن البواب مثله، وكان ذا فضائل جمة من علم الأدب وغيره، كثير الخير، مشهوراً في الدنيا، والناس متفقون على الثناء الجميل عليه ولهم فيه أقوال كثيرة نظماً ونثراً؛ توفي سنة ثمان عشرة وستمائة {cite:kamil-ibn-al-athir p. 426}."
  en: "The Mosuli calligrapher and Ibn al-Athir's own friend — 'none in his time wrote near him, and none rendered Ibn al-Bawwab's manner like him'; a man of many virtues and universal praise, dead 618 {cite:kamil-ibn-al-athir p. 426}."
  es: "El calígrafo mosuli y amigo personal de Ibn al-Athir —«nadie en su tiempo escribió como él, y nadie plasmó el estilo de Ibn al-Bawwab como él»—; un hombre de muchas virtudes y elogios universales, fallecido en el año 618 {cite:kamil-ibn-al-athir p. 426}."
  fr: "Le calligraphe mosoulien et ami personnel d'Ibn al-Athir — « nul à son époque n'écrivait près de lui, et nul ne rendait la manière d'Ibn al-Bawwab comme lui »; un homme aux nombreuses vertus et à louanges universelles, mort en 618 {cite: kamil-ibn-al-athir p. 426}."
  ur: "موصلی خطاط اور ابن الثیر کے اپنے دوست - 'ان کے زمانے میں کسی نے بھی ان کے قریب نہیں لکھا، اور کسی نے بھی ابن البواب کے انداز کو ان جیسا نہیں بنایا'؛ بہت سی خوبیوں اور عالمی تعریفوں کا حامل آدمی، میت 618 {حوالہ: کامل ابن الاثیر ص۔ 426}۔"
  tr: "Musulili yazar, İbn el-Athir'in dostu ve zamanının hattatı Amin al-Eddin Yakut şöyle der: Onun zamanında kimse ona yakın bir şey yazmadı ya da İbn al-Bawwab'ın yöntemini takip eden hiç kimse onun gibi olmadı. Edebiyat bilimi ve diğer alanlarda birçok erdeme sahipti, çok iyiydi, dünyada ünlüydü ve halk onu oybirliğiyle güzelce övdü; şiir ve düzyazıda onun hakkında birçok söz vardı. 618 Hicri yılında vefat etti {atı:kamil-ibn-al-athir s. 426}."
  id: "Amin al-Din Yaqut, penulis Mosuli, sahabat Ibn al-Athir, dan kaligrafer pada zamannya; Ibn al-Athir berkata: Pada zamannya, tidak ada yang menulis sesuatu yang dekat dengannya maupun yang mengikuti metode Ibn al-Bawwab seperti dirinya. Ia memiliki banyak kebajikan dalam ilmu sastra dan bidang lain, sangat baik, terkenal di dunia, dan orang-orang memujinya dengan indah, serta mereka memiliki banyak ungkapan tentang dirinya dalam puisi dan prosa. Ia meninggal pada tahun 618 H {cite:kamil-ibn-al-athir hlm. 426}."
