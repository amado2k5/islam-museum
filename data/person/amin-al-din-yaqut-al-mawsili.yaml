summary:
  ar: "أمين الدين ياقوت الكاتب الموصلي صديق ابن الأثير وخطاط زمانه؛ يقول ابن الأثير: لم يكن في زمانه من يكتب ما يقاربه ولا من يؤدي طريقة ابن البواب مثله، وكان ذا فضائل جمة من علم الأدب وغيره، كثير الخير، مشهوراً في الدنيا، والناس متفقون على الثناء الجميل عليه ولهم فيه أقوال كثيرة نظماً ونثراً؛ توفي سنة ثمان عشرة وستمائة {cite:kamil-ibn-al-athir p. 426}."
  en: "The Mosuli calligrapher and Ibn al-Athir's own friend — 'none in his time wrote near him, and none rendered Ibn al-Bawwab's manner like him'; a man of many virtues and universal praise, dead 618 {cite:kamil-ibn-al-athir p. 426}."
