  did_you_know:
    ar: "يوسف بن عمر الثقفي ابن عم الحجاج، ولّاه هشام بن عبد الملك العراق، ونسب إليه البلاذري سوق يوسف بالحيرة."
    en: "Yusuf ibn Umar al-Thaqafi, al-Hajjaj's cousin, was Hisham's governor over Iraq; al-Baladhuri names the Yusuf market at al-Hira after him."
    ur: "یوسف بن عمر الثقفی، حجاج کا چچا زاد بھائی، ہشام کا عراق پر عامل تھا؛ بلاذری حیرہ کے بازارِ یوسف کو اسی سے منسوب کرتا ہے۔"
    sources: [source/futuh-buldan-maarif-1407, source/muruj-al-dhahab]
class: person
label: { ar: "يوسف بن عمر الثقفي", en: "Yusuf ibn Umar al-Thaqafi", es: "Yusuf ibn Umar al-Thaqafi", fr: "Yusuf ibn Umar al-Thaqafi", ur: "یوسف بن عمر ثقفی" }
summary:
  ar: "يوسف بن عمر بن محمد بن الحكم بن أبي عقيل الثقفي ابن عم الحجاج بن يوسف؛ عند البلاذري كان عامل هشام على العراق ونسب إليه سوق يوسف بالحيرة. وعند المسعودي حارب زيد بن علي حين خرج بالكوفة فانهزم أصحاب زيد وأصيب بسهم في جبهته فمات {cite:muruj-al-dhahab p. 194} ويذكر الكتاب أن هشاماً ولاه اليمن ثم العراق والمشرق، وأنه كان جواداً معطاءً عسوفاً جباراً، وأقره الوليد بن يزيد على العراق. {cite:salabi-umayyad-state-2020 p.482-483} ويذكر الكتاب أن يوسف بن عمر والي العراق أفشل ثورة زيد بن علي بالكوفة، واستخرج جثته بعد مقتله وأرسل رأسه إلى هشام، وأمر بصلبه عرياناً بأمر هشام، ويذكر الكتاب أن تدابيره المشددة أثرت في أهل الكوفة. {cite:salabi-umayyad-state-2020 p.510-513}"
  en: "Yusuf ibn Umar ibn Muhammad ibn al-Hakam ibn Abi Aqil al-Thaqafi, al-Hajjaj ibn Yusuf's cousin; in al-Baladhuri Hisham's governor over Iraq, for whom Hira's Suq Yusuf is named."
  es: "Yusuf ibn Umar ibn Muhammad ibn al-Hakam ibn Abi Aqil al-Thaqafi, primo de al-Hajjaj ibn Yusuf; en el gobernador de Irak de al-Baladhuri Hisham, que da nombre a Suq Yusuf de Hira."
  fr: "Yusuf ibn Umar ibn Muhammad ibn al-Hakam ibn Abi Aqil al-Thaqafi, le cousin d'al-Hajjaj ibn Yusuf; à al-Baladhuri Hisham, gouverneur de l'Irak, qui a donné son nom à Suq Yusuf de Hira."
  ur: "یوسف بن عمر بن محمد بن الحکم ابن ابی عقیل ثقفی، الحجاج ابن یوسف کے چچازاد بھائی، یوسف بن عمر بن محمد بن الحکم ابن ابی عقیل ثقفی، الحجاج ابن یوسف کے چچازاد بھائی۔ البلادھوری میں ہشام کا عراق پر گورنر، جس کے لیے حرا کا سق یوسف نام ہے۔"
  tr: "Yusuf ibn Ömer ibn Muhammed ibn el-Hakam ibn Abi Aqil el-Safafi, el-Haccac bin Yusuf'un kuzeni; el-Baladhuri'ye göre, Irak'taki Hisham'ın valisiydi ve Yusuf'un el-Hira'daki pazarına atfedilir. El-Mes'udi'ye göre, Zeyd bin Ali Kufe'den ayrılırken onunla savaştı, ancak Zayd'ın yoldaşları yenildi, alnından vuruldu ve öldü. {alıntı:Muruj-al-Dhahab, s. 194} Kitap, Hişam'ın onu Yemen, sonra Irak ve Doğu için atadığını, cömert, cömert ve güçlü olduğunu belirtir. El-Velid bin Yezid onu Irak'a atadı. {cite:salabi-umayyad-state-2020 s.482-483} Kitapta, Irak valisi Yusuf bin Umar'ın Kufe'deki Zeyd bin Ali'nin isyanını engellediği, ölümünden sonra cesedini çıkardığı, başını Hisham'a gönderdiği ve Hisham'ın emriyle çıplak olarak çarmıha gerilmesini emrettiği belirtilir. Kitap, onun sıkı önlemlerinin Kufe halkını etkilediğini belirtir. {cite:Salabi-Umayyad-state-2020 s.510-513}"
  id: "Yusuf ibn Umar ibn Muhammad ibn al-Hakam ibn Abi Aqil al-Thaqafi, sepupu al-Hajjaj ibn Yusuf; menurut al-Baladhuri, ia adalah gubernur Hisham atas Irak, dan ia dikaitkan dengan pasar Yusuf di al-Hirah. Menurut al-Mas'udi, ia berperang melawan Zayd ibn Ali saat meninggalkan Kufa, tetapi para sahabat Zayd dikalahkan, ia ditembak di dahi dan meninggal. {cite:muruj-al-dhahab, hlm. 194} Buku tersebut menyebutkan bahwa Hisham mengangkatnya atas Yaman, kemudian Irak, dan Timur, dan bahwa ia murah hati, murah hati, dan tangguh. Al-Walid ibn Yazid mengangkatnya sebagai pemimpin Irak. {cite:salabi-umayyad-state-2020 hlm.482-483} Buku tersebut menyebutkan bahwa Yusuf ibn Umar, gubernur Irak, menggagalkan pemberontakan Zayd ibn Ali di Kufa, menggali kembali jasadnya setelah kematiannya, mengirim kepalanya ke Hisham, dan memerintahkan penyalibannya telanjang atas perintah Hisham. Buku tersebut menyebutkan bahwa tindakan ketatnya memengaruhi rakyat Kufa. {cite:salabi-umayyad-state-2020 hlm.510-513}"
