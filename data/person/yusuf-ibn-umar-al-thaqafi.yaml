label: { ar: "يوسف بن عمر الثقفي", en: "Yusuf ibn Umar al-Thaqafi" }
summary:
  ar: "يوسف بن عمر بن محمد بن الحكم بن أبي عقيل الثقفي ابن عم الحجاج بن يوسف؛ عند البلاذري كان عامل هشام على العراق ونسب إليه سوق يوسف بالحيرة. وعند المسعودي حارب زيد بن علي حين خرج بالكوفة فانهزم أصحاب زيد وأصيب بسهم في جبهته فمات {cite:muruj-al-dhahab p. 194} ويذكر الكتاب أن هشاماً ولاه اليمن ثم العراق والمشرق، وأنه كان جواداً معطاءً عسوفاً جباراً، وأقره الوليد بن يزيد على العراق. {cite:salabi-umayyad-state-2020 p.482-483} ويذكر الكتاب أن يوسف بن عمر والي العراق أفشل ثورة زيد بن علي بالكوفة، واستخرج جثته بعد مقتله وأرسل رأسه إلى هشام، وأمر بصلبه عرياناً بأمر هشام، ويذكر الكتاب أن تدابيره المشددة أثرت في أهل الكوفة. {cite:salabi-umayyad-state-2020 p.510-513}"
  en: "Yusuf ibn Umar ibn Muhammad ibn al-Hakam ibn Abi Aqil al-Thaqafi, al-Hajjaj ibn Yusuf's cousin; in al-Baladhuri Hisham's governor over Iraq, for whom Hira's Suq Yusuf is named."
