  did_you_know:
    ar: "يوسف بن عمر الثقفي ابن عم الحجاج، ولّاه هشام بن عبد الملك العراق، ونسب إليه البلاذري سوق يوسف بالحيرة."
    en: "Yusuf ibn Umar al-Thaqafi, al-Hajjaj's cousin, was Hisham's governor over Iraq; al-Baladhuri names the Yusuf market at al-Hira after him."
    ur: "یوسف بن عمر الثقفی، حجاج کا چچا زاد بھائی، ہشام کا عراق پر عامل تھا؛ بلاذری حیرہ کے بازارِ یوسف کو اسی سے منسوب کرتا ہے۔"
