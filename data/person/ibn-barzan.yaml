id: person/ibn-barzan
class: person
label: { ar: "ابن بيرزان صاحب الرملة ونابلس", en: "Ibn Barzan, lord of Ramla and Nablus", es: "Ibn Barzan, lord of Ramla and Nablus", fr: "Ibn Barzan, lord of Ramla and Nablus", ur: "ابن برزان، رملہ اور نابلس کا آقا" }
summary:
  ar: "ابن بيرزان صاحب الرملة ونابلس، وكان أعظم الفرنج محلاً بعد ملكهم؛ أُسر في وقعة مخاضة الأحزان سنة خمس وسبعين وخمسمائة ومعه أخوه صاحب جبيل وصاحب طبرية ومقدما الداوية والاسبتارية، وفدى نفسه بمائة ألف وخمسين ألف دينار صورية وإطلاق ألف أسير من المسلمين {cite:kamil-ibn-al-athir p. 95-96}."
  en: "Ibn Barzan, lord of Ramla and Nablus — the greatest of the Franks after their king; taken at the Ford of Sorrows in 575 with his brother of Jubayl, the lord of Tiberias and the Templar and Hospitaller masters, and ransomed for 150,000 Tyrian dinars plus a thousand Muslim captives {cite:kamil-ibn-al-athir p. 95-96}."
  es: "Ibn Barzan, señor de Ramla y Nablus, el más grande de los francos después de su rey; capturado en el Vado de los Dolores en 575 junto con su hermano de Jubayl, señor de Tiberíades y los maestros templarios y hospitalarios, y rescatado por 150.000 dinares tirios más mil cautivos musulmanes {cite:kamil-ibn-al-athir p. 95-96}."
  fr: "Ibn Barzan, seigneur de Ramla et de Naplouse — le plus grand des Francs après leur roi; pris au Gué des Lamentations en 575 avec son frère de Jubayl, le seigneur de Tibériade et les maîtres templiers et hospitaliers, et racheté pour 150 000 dinars tyriens plus un millier de captifs musulmans {cite: kamil-ibn-al-athir p. 95-96}."
  ur: "ابن برزان، رملہ اور نابلس کا مالک - اپنے بادشاہ کے بعد فرینکوں میں سب سے بڑا؛ 575 میں فورڈ آف سوروز میں اپنے بھائی جوبیل کے ساتھ، جو تبریاس کے مالک اور ٹیمپلر اور ہاسپٹلر کے آقاؤں کے ساتھ لیا گیا، اور 150,000 ٹائرین دینار کے علاوہ ایک ہزار مسلمان اسیروں کے بدلے فدیہ لیا {حوالہ: کامل ابن الاثیر ص۔ 95-96}۔"
  tr: "Ramla ve Nablus'un hükümdarı İbn Birzan, krallıklarından sonra en büyük Frank hükümdarıydı; 575 Hicri yılında, Byblos hükümdarı, Tiberias hükümdarı ve Dawiya ile El-İsbatariyya'nın lideri kardeşiyle birlikte Keder Savaşı'nda esir alındı. Kendini yüz elli bin elli dinar ile fidye etti ve bin Müslüman esiri serbest bıraktı {atıf:kamil-ibn-al-athir s. 95-96}."
  id: "Ibn Birzan, penguasa Ramla dan Nablus, adalah penguasa Franka terbesar setelah kerajaan mereka; ia ditangkap dalam Pertempuran Pertempuran Kesedihan pada tahun 575 H, ditemani oleh saudaranya penguasa Byblos, penguasa Tiberias, dan pemimpin Dawiya serta Al-Isbatariyya. Ia menebus dirinya dengan seratus lima puluh ribu lima puluh dinar dan membebaskan seribu tawanan Muslim {cite:kamil-ibn-al-athir hlm. 95-96}."
