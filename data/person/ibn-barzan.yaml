  ar: "ابن بيرزان صاحب الرملة ونابلس، وكان أعظم الفرنج محلاً بعد ملكهم؛ أُسر في وقعة مخاضة الأحزان سنة خمس وسبعين وخمسمائة ومعه أخوه صاحب جبيل وصاحب طبرية ومقدما الداوية والاسبتارية، وفدى نفسه بمائة ألف وخمسين ألف دينار صورية وإطلاق ألف أسير من المسلمين {cite:kamil-ibn-al-athir p. 95-96}."
  en: "Ibn Barzan, lord of Ramla and Nablus — the greatest of the Franks after their king; taken at the Ford of Sorrows in 575 with his brother of Jubayl, the lord of Tiberias and the Templar and Hospitaller masters, and ransomed for 150,000 Tyrian dinars plus a thousand Muslim captives {cite:kamil-ibn-al-athir p. 95-96}."
