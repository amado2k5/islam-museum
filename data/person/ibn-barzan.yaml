summary:
  ar: "ابن بيرزان صاحب الرملة ونابلس، وكان أعظم الفرنج محلاً بعد ملكهم؛ أُسر في وقعة مخاضة الأحزان سنة خمس وسبعين وخمسمائة ومعه أخوه صاحب جبيل وصاحب طبرية ومقدما الداوية والاسبتارية، وفدى نفسه بمائة ألف وخمسين ألف دينار صورية وإطلاق ألف أسير من المسلمين {cite:kamil-ibn-al-athir p. 95-96}."
  en: "Ibn Barzan, lord of Ramla and Nablus — the greatest of the Franks after their king; taken at the Ford of Sorrows in 575 with his brother of Jubayl, the lord of Tiberias and the Templar and Hospitaller masters, and ransomed for 150,000 Tyrian dinars plus a thousand Muslim captives {cite:kamil-ibn-al-athir p. 95-96}."
  es: "Ibn Barzan, señor de Ramla y Nablus, el más grande de los francos después de su rey; capturado en el Vado de los Dolores en 575 junto con su hermano de Jubayl, señor de Tiberíades y los maestros templarios y hospitalarios, y rescatado por 150.000 dinares tirios más mil cautivos musulmanes {cite:kamil-ibn-al-athir p. 95-96}."
  fr: "Ibn Barzan, seigneur de Ramla et de Naplouse — le plus grand des Francs après leur roi; pris au Gué des Lamentations en 575 avec son frère de Jubayl, le seigneur de Tibériade et les maîtres templiers et hospitaliers, et racheté pour 150 000 dinars tyriens plus un millier de captifs musulmans {cite: kamil-ibn-al-athir p. 95-96}."
