summary:
  ar: "مقدّم الحنابلة في بغداد أواخر القرن الثالث، وله من العامة اعتماد عظيم؛ فلما بويع ابن المعتز سنة 296هـ جعل المنادي بين يديه ينادي يا معشر العامة هذا لخليفتكم السلم البربهاري، استمالةً لهم بهذا القول {cite:kamil-ibn-al-athir p. 13}."
  en: "The leading Hanbali of Baghdad at the century's end, with great hold over the common folk; during Ibn al-Mu'tazz's one-day caliphate the herald invoked his name to win the crowd {cite:kamil-ibn-al-athir p. 13}."
  es: "El principal hanbalí de Bagdad a finales de siglo, con gran influencia sobre el pueblo llano; durante el califato de un día de Ibn al-Mu'tazz, el heraldo invocó su nombre para ganarse a la multitud {cite:kamil-ibn-al-athir p. 13}."
  fr: "Le principal Hanbalite de Bagdad à la fin du siècle, avec une grande emprise sur le peuple; pendant le califat d'un jour d'Ibn al-Mu'tazz, le héraut invoqua son nom pour gagner la foule {cite:kamil-ibn-al-athir p. 13}."
