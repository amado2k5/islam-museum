summary:
  ar: "إبراهيم عادل شاه الثاني، من ملوك الدولة العادلشاهية في بيجابور، تعطي دائرة المعارف الإسلامية مدة حكمه من 987 إلى 1035 هـ الموافقة 1579 إلى 1626 م وتصف عهده بذروة قوة بيجابور."
  en: "Ibrahim Adil Shah II, ruler of the Adil Shahi dynasty of Bijapur; the Encyclopaedia of Islam gives his reign as 987-1035 AH (1579-1626 CE) and describes his age as the height of Bijapur's power."
  es: "Ibrahim Adil Shah II, gobernante de la dinastía Adil Shahi de Bijapur; la Enciclopedia del Islam sitúa su reinado entre 987 y 1035 AH (1579-1626 d. C.) y describe su época como el apogeo del poder de Bijapur."
  fr: "Ibrahim Adil Shah II, souverain de la dynastie Adil Shahi de Bijapur; l'Encyclopédie de l'Islam situe son règne de 987 à 1035 AH (1579-1626 CE) et décrit son âge comme l'apogée de la puissance de Bijapur."
  ur: "بیجاپور کے عادل شاہی خاندان کے حکمران ابراہیم عادل شاہ دوم؛ انسائیکلوپیڈیا آف اسلام ان کے دور حکومت کو 987-1035 ہجری ⁦(1579-1626 عیسوی)⁩ بتاتا ہے اور اس کی عمر کو بیجاپور کی طاقت کی بلندی کے طور پر بیان کرتا ہے۔"
  tr: "Bijapur'daki Adilşahi hanedanının krallarından biri olan İbrahim Adil Şah II, İslam Ansiklopedisi'nde 987-1035 Hicri yılları arasında tarihlendirilir; bu dönem 1579-1626 M.S. arasında gerçekleşir ve saltanatını Bijapur'un gücünün zirvesi olarak tanımlar."
  id: "Ibrahim Adil Shah II, salah satu raja dinasti Adilshahi di Bijapur, diperkirakan oleh Ensiklopedia Islam dari tahun 987 hingga 1035 H, yang bertepatan dengan tahun 1579 hingga 1626 M, dan menggambarkan masa pemerintahannya sebagai puncak kekuasaan Bijapur."
