summary:
  en: "A chief of Banu Minqar of Tamim famed for forbearance; he came in the Tamim delegation of 9 AH, belittled the young Amr ibn al-Ahtam before the Prophet and was lampooned for it, accepted Islam, and was later appointed sadaqa collector over part of Banu Sa'd."
  ar: "سيد من بني منقر من تميم اشتُهر بحلمه؛ جاء في وفد بني تميم سنة 9هـ، وحقّر عمرو بن الأهتم عند النبي لأنه كان يبغضه فهجاه عمرو، وأسلم، وولّاه النبي الصدقة على قسم من بني سعد."
