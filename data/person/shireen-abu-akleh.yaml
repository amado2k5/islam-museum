summary:
  ar: "صحفية فلسطينية أمريكية (1971–2022)، أشهر مراسلي الجزيرة الميدانيين في الأراضي الفلسطينية على مدى 25 عاماً. وُلدت في القدس لعائلة من الروم الملكيين الكاثوليك من بيت لحم، وقُتلت بالرصاص في جنين في 11 أيار 2022 أثناء تغطيتها اقتحاماً إسرائيلياً وهي ترتدي سترة الصحافة؛ وخلصت تحقيقات الأمم المتحدة والولايات المتحدة وكبريات المؤسسات الإخبارية إلى أن النيران التي قتلتها جاءت من القوات الإسرائيلية."
  en: "Palestinian-American journalist (1971–2022), Al Jazeera's best-known field correspondent in the Palestinian territories for 25 years. Born in Jerusalem to a Melkite Greek Catholic family from Bethlehem, she was shot and killed in Jenin on 11 May 2022 while covering an Israeli raid wearing a press vest; investigations by the UN, the US and major news organisations attributed the fatal fire to Israeli forces."
  ur: "فلسطینی نژاد امریکی صحافی (1971–2022)، 25 برس تک فلسطینی علاقوں میں الجزیرہ کی معروف ترین فیلڈ رپورٹر۔ وہ قدس میں بیت لحم کے ایک ملکی یونانی کیتھولک خاندان میں پیدا ہوئیں اور 11 مئی 2022ء کو جنین میں اسرائیلی چھاپے کی کوریج کے دوران پریس ویسٹ پہنے ہوئے گولی لگنے سے ہلاک ہو گئیں؛ اقوام متحدہ، امریکہ اور بڑے خبر رساں اداروں کی تحقیقات نے قاتل گولی کو اسرائیلی فورسز سے منسوب کیا۔"
