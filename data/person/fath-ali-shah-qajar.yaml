summary:
  ar: "فتح علي شاه القاجاري (5 أغسطس 1772 – 24 أكتوبر 1834)، وُلد باسم بابا خان في دامغان، وهو الشاه الثاني للدولة القاجارية في إيران، حكم من 1797 إلى 1834. كان في طفولته رهينة في بلاط كريم خان زند بشيراز، وعيّنه عمه آغا محمد خان وليًّا لعهده، فحوّل خانية قبلية إلى ملكية مستقرة مركزية وأشرف على نهضة فنية وبلاطية، لكنه خسر أقاليم إيران القوقازية لروسيا بمعاهدتي غلستان (1813) وتركمانجاي (1828). وكتب الشعر باسم «خاقان»."
  en: "Fath-Ali Shah Qajar (5 August 1772 – 24 October 1834), born Baba Khan at Damghan, was the second shah of Qajar Iran, reigning from 1797 to 1834. A hostage in childhood at Karim Khan Zand's Shiraz court and his uncle Agha Mohammad Khan's designated heir, he restructured a tribal khanship into a centralized, stable monarchy and presided over a courtly and artistic revival, but lost Iran's Caucasian territories to Russia by the treaties of Gulistan (1813) and Turkmenchay (1828). He wrote poetry under the name Khaqan."
  ur: "فتح علی شاہ قاجار (5 اگست 1772ء – 24 اکتوبر 1834ء)، پیدائشی نام بابا خان، دامغان میں پیدا ہوئے؛ ایران کے قاجار خاندان کے دوسرے شاہ تھے، 1797ء سے 1834ء تک حکمران رہے۔ بچپن میں شیراز میں کریم خان زند کے دربار میں یرغمال رہے اور چچا آغا محمد خان نے انہیں ولی عہد مقرر کیا؛ انہوں نے قبائلی خانی کو مستحکم بادشاہت میں بدلا اور فنی و درباری احیا کی سرپرستی کی، مگر گلستان (1813ء) اور ترکمان چائے (1828ء) کے معاہدوں میں ایران کے قفقازی علاقے روس سے ہار گئے۔ «خاقان» تخلص سے شاعری کرتے تھے۔"

