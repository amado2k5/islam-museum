summary:
  ar: "بابا طاهر عريان الهمذاني، صوفي شاعر كتب الرباعيات (الدوبيتي) بلهجة فارسية مختلطة فيها ملامح لورية وكردية، وتذكر الموسوعة الإسلامية وفاته سنة 401هـ/1010م عن رواية متأخرة غير موثقة، وأول خبر تاريخي عنه يضعه بعد دخول طغرل همذان سنة 447هـ/1055م {cite:encyclopaedia-of-islam-2 vol. 1 p. 896-897}."
  en: "Baba Tahir 'Uryan of Hamadan, a mystic who wrote quatrains (du-bayti) in a Persian dialect with Lur and Kurdish traits; the Encyclopaedia of Islam gives his death as 401/1010 on a late, unsourced authority, while the earliest historical notice places him after Tughril's entry into Hamadan in 447/1055 {cite:encyclopaedia-of-islam-2 vol. 1 p. 896-897}."
