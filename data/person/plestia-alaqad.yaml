summary:
  ar: "صحفية وكاتبة فلسطينية (وُلدت سنة 2001) من غزة، وثّقت الحرب على غزة بمذكرات مصورة يومية منذ أكتوبر 2023 تناقلتها وسائل إعلام عالمية؛ غادرت غزة إلى أستراليا في نوفمبر 2023، ونشرت مذكراتها في كتاب «عيون غزة» سنة 2025، وأدرجتها BBC في قائمة مئة امرأة سنة 2024."
  en: "Palestinian journalist and author (born 2001) from Gaza, whose daily video diaries of the Gaza war from October 2023 were carried by world media; she left Gaza for Australia in November 2023, published her diary as The Eyes of Gaza (2025), and was named to the BBC's 100 Women list in 2024."
  ur: "فلسطینی صحافی اور مصنفہ (پیدائش 2001) جن کا تعلق غزہ سے ہے؛ اکتوبر 2023 سے اپنی ویڈیو ڈائریوں کے ذریعے جنگ کی دستاویز سازی کی جو عالمی میڈیا نے نشر کی؛ نومبر 2023 میں آسٹریلیا منتقل ہوئیں، 2025 میں اپنی یادداشتیں «دی آئیز آف غزہ» کے نام سے شائع کیں اور 2024 میں BBC کی سو خواتین کی فہرست میں شامل ہوئیں۔"
