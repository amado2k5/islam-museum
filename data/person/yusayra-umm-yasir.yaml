summary:
  ar: "صحابية مهاجرة من المهاجرات الأُوَل المبايعات؛ قال ابن سعد: أسلمت وبايعت، وروت عن رسول الله حديثاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5161}."
  en: "A Companion who emigrated among the first women to pledge allegiance; Ibn Sad said she embraced Islam, pledged, and transmitted a hadith from the Messenger of God {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5161}."
  ur: "صحابیہ جو بیعت کرنے والی پہلی عورتوں میں ہجرت کی؛ ابن سعد نے کہا کہ وہ مسلمان ہوئی، بیعت کی اور نبی سے حدیث روایت کی۔"
  es: "Una Compañera que emigró entre las primeras mujeres en jurar lealtad; Ibn Sad dijo que abrazó el Islam, juró lealtad y transmitió un hadiz del Mensajero de Dios {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5161}."
  fr: "Une Compagne qui a émigré parmi les premières femmes à prêter allégeance; Ibn Sad a dit qu'elle a embrassé l'Islam, a prêté allégeance et a transmis un hadith du Messager de Dieu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5161}."
  tr: "Sadakat eden ilk kadınlardan göç eden bir kadın sahabe; İbn Sad şöyle dedi: İslam'ı kabul etti ve sadakat etti, Allah'ın Elçisi (atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.5161} adlı bir hadisi anlattı."
  id: "Seorang teman wanita yang bermigrasi dari antara wanita pertama yang bersumpah setia; Ibn Sa'd berkata: Dia memeluk Islam dan bersumpah setia, serta menceritakan hadits dari Rasulullah {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5161}."
