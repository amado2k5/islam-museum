summary:
  ar: "وجيه الدين، أبو المعالي، أسعد بن المنجى، ويُسمّى أيضاً محمد بن المنجى بركات بن المؤمل التنوخي المعري ثم الدمشقي، فقيه حنبلي، ولي قضاء حرّان. تفقه بدمشق على شرف الإسلام عبد الوهاب بن الحنبلي، ثم ببغداد على الشيخ عبد القادر الجيلي، وسمع بها من الأرموي وأنوشتكين الرضواني وأبي جعفر العباسي، وبدمشق من نصر بن أحمد بن مقاتل وطائفة. روى عنه الموفق بن قدامة وابن خليل والضياء والمنذري والشهاب القوصي وغيرهم، وبُنيت المدرسة المسمارية من أجله، وأُوقف عليه وعلى ذريته. من تصانيفه «الخلاصة في المذهب»، و«العمدة» في الفقه، و«النهاية في شرح الهداية» في نحو عشرة مجلدات. توفي سنة 606 للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17470}"
  en: "Wajih al-Din Abu al-Ma'ali Asad ibn al-Munajja, also called Muhammad ibn al-Munajja Barakat ibn al-Mu'ammal al-Tanukhi al-Ma'arri then al-Dimashqi: a Hanbali jurist who held the judgeship of Harran. He studied at Damascus with Sharaf al-Islam Abd al-Wahhab ibn al-Hanbali, and at Baghdad with Shaykh Abd al-Qadir al-Jilani; he heard hadith there from al-Armawi, Anushtakin al-Radwani and Abu Ja'far al-Abbasi, and at Damascus from Nasr ibn Ahmad ibn Muqatil and others. Al-Muwaffaq ibn Qudama, Ibn Khalil, al-Diya, al-Mundhiri and al-Shihab al-Qawusi, among others, transmitted from him. The al-Musmariyya madrasa was built for him and endowed for him and his descendants. His works include al-Khulasa fi al-madhhab, al-Umda in fiqh, and al-Nihaya fi sharh al-Hidaya in about ten volumes. The heading gives his death as 606 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17470}"
  es: "Wajih al-Din Abu al-Ma'ali Asad ibn al-Munajja, también llamado Muhammad ibn al-Munajja Barakat ibn al-Mu'ammal al-Tanukhi al-Ma'arri y luego al-Dimashqi: un jurista hanbali que ocupó el cargo de juez de Harran. Estudió en Damasco con Sharaf al-Islam Abd al-Wahhab ibn al-Hanbali, y en Bagdad con Shaykh Abd al-Qadir al-Jilani; allí escuchó hadices de al-Armawi, Anushtakin al-Radwani y Abu Ja'far al-Abbasi, y en Damasco de Nasr ibn Ahmad ibn Muqatil y otros. Al-Muwaffaq ibn Qudama, Ibn Khalil, al-Diya, al-Mundhiri y al-Shihab al-Qawusi, entre otros, transmitieron de él. La madrasa al-Musmariyya fue construida para él y dotada para él y sus descendientes. Sus obras incluyen al-Khulasa fi al-madhhab, al-Umda in fiqh y al-Nihaya fi sharh al-Hidaya en unos diez volúmenes. El encabezamiento da su muerte en el año 606 AH. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17469}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17470}"
  fr: "Wajih al-Din Abu al-Ma'ali Asad ibn al-Munajja, également appelé Muhammad ibn al-Munajja Barakat ibn al-Mu'ammal al-Tanukhi al-Ma'arri puis al-Dimashqi: un juriste hanbali qui occupait le poste de juge d'Harran. Il a étudié à Damas avec Sharaf al-Islam Abd al-Wahhab ibn al-Hanbali, et à Bagdad avec Shaykh Abd al-Qadir al-Jilani; il y entendit des hadiths d'al-Armawi, Anushtakin al-Radwani et Abu Ja'far al-Abbasi, et à Damas de Nasr ibn Ahmad ibn Muqatil et d'autres. Al-Muwaffaq ibn Qudama, Ibn Khalil, al-Diya, al-Mundhiri et al-Shihab al-Qawusi, entre autres, ont été transmis par lui. La madrasa al-Musmariyya a été construite pour lui et dotée pour lui et ses descendants. Ses œuvres comprennent al-Khulasa fi al-madhhab, al-Umda in fiqh et al-Nihaya fi sharh al-Hidaya en une dizaine de volumes. Le titre indique sa mort en 606 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17470}"
  ur: "وجیہہ الدین ابو المعالی اسد ابن المنجہ، جسے محمد بن المنجہ برکات ابن الممل التنوخی المعری پھر الدمشقی بھی کہا جاتا ہے: ایک حنبلی فقیہ جو حران کے قاضی تھے۔ اس نے دمشق میں شرف الاسلام عبد الوہاب ابن الحنبلی سے اور بغداد میں شیخ عبد القادر الجیلانی سے تعلیم حاصل کی۔ اس نے وہاں ارماوی، انوشتکین الردوانی اور ابو جعفر العباسی سے اور دمشق میں نصر بن احمد بن مقاتل وغیرہ سے حدیث سنی۔ الموفق ابن قدامہ، ابن خلیل، الدیہ، المنذری اور الشہاب القوصی وغیرہ نے ان سے نقل کیا ہے۔ المسمریہ مدرسہ ان کے لیے بنایا گیا تھا اور ان کے اور ان کی اولاد کے لیے وقف کیا گیا تھا۔ ان کی تصانیف میں الخلصہ فی المذہب، فقہ میں العمدہ اور تقریباً دس جلدوں میں النہایہ فی شرح الہدایہ شامل ہیں۔ سرخی میں ان کی وفات 606ھ بتائی گئی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17469}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17470}"
