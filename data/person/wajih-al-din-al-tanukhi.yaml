summary:
  ar: "وجيه الدين، أبو المعالي، أسعد بن المنجى، ويُسمّى أيضاً محمد بن المنجى بركات بن المؤمل التنوخي المعري ثم الدمشقي، فقيه حنبلي، ولي قضاء حرّان. تفقه بدمشق على شرف الإسلام عبد الوهاب بن الحنبلي، ثم ببغداد على الشيخ عبد القادر الجيلي، وسمع بها من الأرموي وأنوشتكين الرضواني وأبي جعفر العباسي، وبدمشق من نصر بن أحمد بن مقاتل وطائفة. روى عنه الموفق بن قدامة وابن خليل والضياء والمنذري والشهاب القوصي وغيرهم، وبُنيت المدرسة المسمارية من أجله، وأُوقف عليه وعلى ذريته. من تصانيفه «الخلاصة في المذهب»، و«العمدة» في الفقه، و«النهاية في شرح الهداية» في نحو عشرة مجلدات. توفي سنة 606 للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17470}"
  en: "Wajih al-Din Abu al-Ma'ali Asad ibn al-Munajja, also called Muhammad ibn al-Munajja Barakat ibn al-Mu'ammal al-Tanukhi al-Ma'arri then al-Dimashqi: a Hanbali jurist who held the judgeship of Harran. He studied at Damascus with Sharaf al-Islam Abd al-Wahhab ibn al-Hanbali, and at Baghdad with Shaykh Abd al-Qadir al-Jilani; he heard hadith there from al-Armawi, Anushtakin al-Radwani and Abu Ja'far al-Abbasi, and at Damascus from Nasr ibn Ahmad ibn Muqatil and others. Al-Muwaffaq ibn Qudama, Ibn Khalil, al-Diya, al-Mundhiri and al-Shihab al-Qawusi, among others, transmitted from him. The al-Musmariyya madrasa was built for him and endowed for him and his descendants. His works include al-Khulasa fi al-madhhab, al-Umda in fiqh, and al-Nihaya fi sharh al-Hidaya in about ten volumes. The heading gives his death as 606 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17469}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17470}"
