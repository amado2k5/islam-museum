  tr: "El-Sari ibn Ahmed el-Kindi \"El-Rifa\", Seyf-i öven ve ardından Bağdat'ta yaşamış bir Musuli şairidir. Halidileri hicvetmiş ve el-Varaka'da çalışmıştır; 366 Hicri (976 M.S.) yılında vefat etmiştir."
