  ur: "بنو اسد کے شاعر عمر بن یزید الأسدی بخل کے قصوں میں یاد کیے جاتے ہیں۔ ابشیہی لکھتے ہیں کہ انہیں قولنج کی تکلیف ہوئی تو تیل سے علاج کیا گیا، یہ بات ان کی شدید بخل کے باب میں آئی ہے {cite:al-mustatraf-abshihi-scan-vol1 p. 205}۔"
  ar: "شاعر أسدي اشتهر في أخبار البخل. يذكر الأبشيهي في باب البخل أنه أصابه القولنج، فعولج بالدهن، وأنه كان من شدة بخله على هذه الحال {cite:al-mustatraf-abshihi-scan-vol1 p. 205}."
  en: "An Asadi poet remembered in anecdotes of miserliness. Al-Abshihi records that he suffered from colic and was treated with oil, in a passage about his extreme stinginess {cite:al-mustatraf-abshihi-scan-vol1 p. 205}."
