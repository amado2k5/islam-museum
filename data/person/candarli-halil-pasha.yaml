summary:
  ar: "خليل باشا الجاندرلي الصغير، وزير محمد الفاتح في حصار القسطنطينية. ينقل الصلابي أنه كان على رأس مستشاري السلطان الذين حاولوا إقناعه بالعدول عن فتح المدينة والرضا بمصالحة أهلها {cite:dawlat-uthmaniyya-salabi p. 98}، وأنه دعا في مجلس الشورى عشية الاقتحام إلى الانسحاب تحذيراً من غضب أوروبا، وقد اتهمه معاصروه — على ما ينقل الكتاب — بمواطأة البيزنطيين والتخذيل عنهم، فعارضه زوغنوش باشا بشدة {cite:dawlat-uthmaniyya-salabi p. 105}."
  en: "Candarli Halil Pasha the Younger, Mehmed II's vizier at the siege of Constantinople. Al-Salabi reports him leading the counsellors who tried to turn the sultan from taking the city toward a settlement {cite:dawlat-uthmaniyya-salabi p. 98}, and urging withdrawal at the final war council for fear of Christian Europe's anger — the book adds that contemporaries accused him of colluding with the Byzantines, and Zaganos Pasha answered him fiercely {cite:dawlat-uthmaniyya-salabi p. 105}."
