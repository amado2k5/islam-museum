summary:
  ar: "علي بن خليل علاء الدين أبو الحسن، الطرابلسي الحنفي، فقيه، ولي القضاء بالقدس. من تصانيفه معين الحكام فيما يتردد بين الخصمين من الأحكام، في القضاء على مذهب الحنفية. توفي سنة أربع وأربعين وثمانمائة بحسب الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7161}"
  en: "Ali ibn Khalil, Ala al-Din Abu al-Hasan al-Tarabulusi al-Hanafi: a jurist who held the judgeship in Jerusalem. His Mu'in al-Hukkam on judicial rulings in disputes between two parties, written on the Hanafi school's view of judging, is his known work. The book gives his death as 844 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7161}"
