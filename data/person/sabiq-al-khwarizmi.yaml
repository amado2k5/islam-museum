  ar: "مولى إبراهيم الإمام دفع إليه الوصية إلى أخيه أبي العباس وأمره إن حدث به حدث من مروان أن يجد السير إلى الحميمة، فلما قضى إبراهيم أسرع فدفعها، ثم لقيه أبو حميد الطوسي بسوق الكناسة بالكوفة فدلّه على أبي العباس ومن معه في دار الوليد بن سعد في بني أود {cite:muruj-al-dhahab p. 239-241}."
