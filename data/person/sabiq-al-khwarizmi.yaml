label: { ar: "سابق الخوارزمي", en: "Sabiq al-Khwarizmi", es: "Sabiq al-Khwarizmi", fr: "Sabiq al-Khwarizmi", ur: "سبیق الخوارزمی" }
summary:
  ar: "مولى إبراهيم الإمام دفع إليه الوصية إلى أخيه أبي العباس وأمره إن حدث به حدث من مروان أن يجد السير إلى الحميمة، فلما قضى إبراهيم أسرع فدفعها، ثم لقيه أبو حميد الطوسي بسوق الكناسة بالكوفة فدلّه على أبي العباس ومن معه في دار الوليد بن سعد في بني أود {cite:muruj-al-dhahab p. 239-241}."
  en: "The Imam Ibrahim's mawla who sped the succession-will from Harran to al-Humayma — then led Abu Humayd from the sweeper's market to the hidden Abbasids in Kufa {cite:muruj-al-dhahab p. 239-241}."
  es: "El mawla del Imam Ibrahim, que aceleró el testamento de sucesión de Harran a al-Humayma, luego condujo a Abu Humayd desde el mercado de los barrenderos hasta los abasíes ocultos en Kufa {cite:muruj-al-dhahab p. 239-241}."
  fr: "Le mawla de l'Imam Ibrahim qui a transmis le testament de succession de Harran à al-Humayma — a ensuite conduit Abu Humayd du marché des balayeurs aux Abbassides cachés à Kufa {cite:muruj-al-dhahab p. 239-241}."
  ur: "امام ابراہیم کے مولا جس نے جانشینی کی رفتار کو حران سے الحمیمہ تک پہنچایا - پھر ابو حمید کو جھاڑو دینے والے بازار سے کوفہ میں چھپے ہوئے عباسیوں کی طرف لے گئے۔ 239-241}۔"
  tr: "İbrahim'in özgür bıraktığı imam, vasiyeti kardeşi Ebu el-Abbas'a emanet etti ve eğer bunu duyarsa el-Hümaymah'e bir yol bulmasını emretti. İbrahim fermanı verdiğinde aceleyle ödedi. Sonra Ebu Hümayd el-Tusi onu Kufa'daki çöp pazarında karşıladı ve onu Banu Awd'daki el-Velid bin Sa'd'ın evinde Ebu el-Abbas ve yoldaşlarının yanına götürdü {cite:muruj-al-dhahab s. 239-241}."
  id: "Imam, mantan izin Ibrahim, mempercayakan wasiat itu kepadanya kepada saudaranya Abu al-Abbas dan memerintahkannya untuk mencari jalan kepada al-Humaymah jika mendengarnya. Ketika Ibrahim mengeluarkan titah itu, ia segera membayarnya. Kemudian Abu Humayd al-Tusi menemuinya di pasar sampah di Kufa dan membawanya kepada Abu al-Abbas dan para sahabatnya di rumah al-Walid ibn Sa'd di Banu Awd {cite:muruj-al-dhahab hlm. 239-241}."
