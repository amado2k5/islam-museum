id: person/jada-bint-al-ashath
class: person
label: { ar: "جعدة بنت الأشعث بن قيس" }
summary:
  ar: "امرأة الحسن بن علي، في الخبر أن يزيد بن معاوية دس إليها أن تسمه ويتزوجها فسمته، فلما مات وسألته الوفاء قال إنا لم نرضك للحسن فنرضاك لأنفسنا {cite:tarikh-khulafa-minhaj-1434 p. 318}."
  en: "A wife of al-Hasan ibn Ali; in the account given, Yazid ibn Mu'awiya suborned her to poison him with a promise of marriage — she did so, and when she claimed the promise after his death he answered: 'we did not approve you for Hasan — shall we approve you for ourselves?' {cite:tarikh-khulafa-minhaj-1434 p. 318}."
  es: "Una esposa de al-Hasan ibn Ali; según el relato, Yazid ibn Mu'awiya la sobornó para que lo envenenara con la promesa de matrimonio; ella lo hizo, y cuando reclamó la promesa después de su muerte, él respondió: 'No te aprobamos para Hasan, ¿acaso te aprobaremos para nosotros?' {cite:tarikh-khulafa-minhaj-1434 p. 318}."
  fr: "Une épouse d'al-Hasan ibn Ali; selon le récit donné, Yazid ibn Mu'awiya l'a subornée pour qu'elle l'empoisonne avec une promesse de mariage — elle l'a fait, et lorsqu'elle a réclamé la promesse après sa mort, il a répondu: « nous ne t'avons pas approuvée pour Hasan — allons-nous t'approuver pour nous-mêmes ? » {cite:tarikh-khulafa-minhaj-1434 p. 318}."
  ur: "حسن بن علی کی بیوی؛ بیان میں کہا گیا ہے کہ یزید بن معاویہ نے اسے شادی کے وعدے کے ساتھ زہر دینے کے لیے اپنے ماتحت کیا - اس نے ایسا کیا، اور جب اس نے اس کی موت کے بعد اس وعدے کا دعویٰ کیا تو اس نے جواب دیا: 'ہم نے آپ کو حسن کے لیے منظور نہیں کیا تھا، کیا ہم آپ کو اپنے لیے قبول کریں گے؟' {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 318}۔"
