summary:
  ar: "طُلب في خراسان، فكتب يوسف بن عمر إلى نصر بن سيار بمسيره {cite:tabari-tarikh-abu-al-fadl j.7 p.228}، وكتب نصر إلى الحسن بن زيد أن ينظر فيه {cite:tabari-tarikh-abu-al-fadl j.7 p.229}، وقُتل في سنة خمس وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.228}. وعند المسعودي ظهر بالجوزجان من بلاد خراسان في آخر سنة خمس وعشرين ومائة منكراً للظلم فسير إليه نصر بن سيار سلم بن أحوز المازني فقتل بسهم في صدغه وصلب بالجوزجان حتى خرج أبو مسلم فأنزل جثته وصلى عليها وأظهر أهل خراسان النياحة عليه سبعة أيام ولم يولد مولود إلا سمي يحيى أو زيداً، وكان يكثر التمثل بشعر الخنساء {cite:muruj-al-dhahab p. 200}"
