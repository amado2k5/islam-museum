id: person/yahya-ibn-zayd
class: person
label: { ar: "يحيى بن زيد بن علي" }
summary:
  ar: "طُلب في خراسان، فكتب يوسف بن عمر إلى نصر بن سيار بمسيره {cite:tabari-tarikh-abu-al-fadl j.7 p.228}، وكتب نصر إلى الحسن بن زيد أن ينظر فيه {cite:tabari-tarikh-abu-al-fadl j.7 p.229}، وقُتل في سنة خمس وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.228}. وعند المسعودي ظهر بالجوزجان من بلاد خراسان في آخر سنة خمس وعشرين ومائة منكراً للظلم فسير إليه نصر بن سيار سلم بن أحوز المازني فقتل بسهم في صدغه وصلب بالجوزجان حتى خرج أبو مسلم فأنزل جثته وصلى عليها وأظهر أهل خراسان النياحة عليه سبعة أيام ولم يولد مولود إلا سمي يحيى أو زيداً، وكان يكثر التمثل بشعر الخنساء {cite:muruj-al-dhahab p. 200}"
  tr: "Horasan'da olmak istedi, bu yüzden Yusuf ibn Umar, Nasr ibn Sayyar'a yürüyüşü üzerine mektup yazdı {cite:tabari-tarikh-abu-al-fadl j.7 s.228} ve Nasr el-Hasan ibn Zayd'a onu araştırması için yazdı {cite:tabari-tarikh-abu-al-fadl j.7 s.229} ve Yusuf yüz yirmi beş yılında öldürüldü {cite:tabari-tarikh-abu-al-fadl j.7 s.228}. El-Mes'udi'ye göre, 125 yılın sonunda Horasan topraklarındaki El-Cevzcan'da adaletsizliği reddederek ortaya çıktı. Nasr ibn Sayyar Salm bin Ahwaz el-Mazni ona gitmiş, göğsüne bir ok isabetiyle öldürülmüş ve El-Cevzcan'da çarmıha gerilmiş, ta ki Ebu Müslim ayrılıp bedenini indirip onun üzerinde namaz kılana kadar. Horasan halkı onun için yedi gün yas tutmuş, Yahya veya Zayd adları dışında yeni doğan doğmamıştır. Sık sık El-Hansa'nın şiirlerini taklit etmiştir {atıf:muruj-al-dhahab, s. 200}"
  id: "Ia berusaha berada di Khorasan, sehingga Yusuf ibn Umar menulis kepada Nasr ibn Sayyar dalam perjalanannya {cite:tabari-tarikh-abu-al-fadl j.7 hlm.228}, dan Nasr menulis kepada al-Hasan ibn Zayd untuk menyelidikinya {cite:tabari-tarikh-abu-al-fadl j.7 hlm.229}, dan ia dibunuh pada tahun seratus dua puluh lima {cite:tabari-tarikh-abu-al-fadl j.7 hlm.228}. Menurut al-Mas'udi, ia muncul di Al-Jawzjan di tanah Khorasan pada akhir tahun seratus dua puluh lima, menyangkal ketidakadilan. Nasr ibn Sayyar Salm ibn Ahwaz al-Mazni datang kepadanya, terbunuh dengan panah di dadanya, dan disalibkan di Al-Jawzjan hingga Abu Muslim pergi, menurunkan jasadnya, dan berdoa di atasnya. Rakyat Khorasan meratapi dirinya selama tujuh hari, dan tidak ada bayi yang lahir kecuali bernama Yahya atau Zayd. Ia sering meniru puisi Al-Khansa {cite:muruj-al-dhahab, hlm. 200}"
