summary:
  en: "A woman of the Ghamid tribe who came to the Prophet in 9 AH and confessed to fornication; he turned her away repeatedly, deferred the penalty until she bore and weaned her child, and she was stoned — he said of her repentance that, apportioned, it would suffice seventy people of Medina."
  fr: "Femme de la tribu de Ghamid qui vint au Prophète en 9 H et avoua la fornication ; il la renvoya à plusieurs reprises, différa la peine jusqu’à la naissance puis au sevrage de son enfant, et elle fut lapidée. Il dit de son repentir que, partagé, il suffirait à soixante-dix habitants de Médine."
  ar: "امرأة من قبيلة غامد جاءت النبي سنة 9هـ فاعترفت على نفسها بالفاحشة؛ فردّها مراراً لعلها ترجع، وأخرّها حتى ولدت وفطمت ابنها فرُجمت، وقال فيها إنها قد تابت توبة لو قُسمت بين سبعين من أهل المدينة لوسعتهم."
  es: "Una mujer de la tribu Ghamid que acudió al Profeta en el año 9 de la Hégira y confesó haber cometido fornicación; él la rechazó repetidamente, aplazó el castigo hasta que dio a luz y destetó a su hijo, y fue apedreada; dijo de su arrepentimiento que, repartido, bastaría para setenta personas de Medina."
  ur: "غامد قبیلہ کی ایک عورت جو 9 ہجری میں نبی کے پاس آئی اور زنا کا اقرار کیا۔ اس نے اسے بار بار پھیر دیا، جرمانے کو اس وقت تک موخر کیا جب تک کہ اس نے اپنے بچے کو جنا اور اس کا دودھ چھڑایا، اور اسے سنگسار کیا گیا - اس نے اس کی توبہ کے بارے میں کہا کہ اگر تقسیم کیا جائے تو مدینہ کے ستر لوگوں کے لیے کافی ہے۔"
  tr: "Hicri 9. yılda, Ghamid kabilesinden bir kadın Peygamberimize gelerek zina yaptığını itiraf etti. Peygamberimiz, kadının geri döneceği umuduyla onu defalarca geri gönderdi ve doğurup oğlunu sütten kesene kadar bekletti, sonra da taşlayarak öldürdü. Peygamberimiz onun hakkında şöyle buyurdu: \"Öyle bir tövbe etti ki, Medine'deki yetmiş kişiye paylaştırılsa yeterdi.\""
  id: "Seorang wanita dari suku Ghamid datang kepada Nabi pada tahun 9 Hijriah dan mengaku telah berzina. Beliau berulang kali mengusirnya, berharap ia akan kembali, dan menunda kedatangannya hingga ia melahirkan dan menyapih anaknya, kemudian ia dirajam. Beliau berkata tentang wanita itu bahwa ia telah bertaubat dengan taubat yang, jika dibagi di antara tujuh puluh orang penduduk Madinah, akan cukup bagi mereka."
