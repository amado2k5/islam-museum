summary:
  en: "A woman of the Ghamid tribe who came to the Prophet in 9 AH and confessed to fornication; he turned her away repeatedly, deferred the penalty until she bore and weaned her child, and she was stoned — he said of her repentance that, apportioned, it would suffice seventy people of Medina."
  ar: "امرأة من قبيلة غامد جاءت النبي سنة 9هـ فاعترفت على نفسها بالفاحشة؛ فردّها مراراً لعلها ترجع، وأخرّها حتى ولدت وفطمت ابنها فرُجمت، وقال فيها إنها قد تابت توبة لو قُسمت بين سبعين من أهل المدينة لوسعتهم."
