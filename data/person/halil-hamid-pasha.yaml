summary:
  ar: "بطاقة أولية لخليل حميد باشا، الصدر الأعظم العثماني في ١٧٨٢–١٧٨٥م المعروف بالإصلاحات والسفارات، أُعدم سنة ١٧٨٥م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Halil Hamid Pasha, the reform-minded Ottoman grand vizier of 1782–1785 known for diplomacy, executed in 1785; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Halil Hamid Pasha, el gran visir otomano reformista de 1782-1785 conocido por su diplomacia, ejecutado en 1785; la entrada de la fuente aún no ha sido verificada en la página."
  fr: "Carte de conscription d'Halil Hamid Pacha, grand vizir ottoman réformateur de 1782 à 1785, connu pour sa diplomatie, exécuté en 1785; la source n'est pas encore vérifiée sur la page."
  ur: "حلیل حامد پاشا کے لیے ڈرافٹ کارڈ، 1782-1785 کے اصلاحاتی سوچ رکھنے والے عثمانی عظیم الشان وزیر، سفارت کاری کے لیے مشہور، 1785 میں پھانسی دی گئی۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "1782-1785 yılları arasında Osmanlı Sadrazamı, reformları ve elçilikleriyle tanınan Halil Hamid Paşa'nın 1785'te idam edilen ön kartı; Osmanlı tarih kitaplarında adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Khalil Hamid Pasha, Wazir Agung Ottoman dari tahun 1782 hingga 1785, yang dikenal karena reformasi dan kedutaannya, dibuat pada tahun 1785; ia disebutkan dalam buku sejarah Ottoman, dan biografinya belum pernah diulas di halaman tersebut."
