summary:
  ar: "لاعب كريكت باكستاني سابق ومعلّق، وُلد في راولبندي سنة 1975. رامٍ سريع بالذراع اليمنى لُقّب بقطار راولبندي السريع، وهو أسرع رامٍ في تاريخ الكريكت إذ سجّل أسرع كرة رسمية بلغت 161.3 كم/ساعة أمام إنجلترا في كأس العالم 2003 وكان أول من كسر حاجز 100 ميل/ساعة مرتين، ولعب لباكستان بين 1997 و2011 في 46 مباراة اختبار أخذ فيها 178 ويكيت و163 مباراة ليوم واحد أخذ فيها 247 ويكيت، ورافقت مسيرته إصابات وجدل متكرر نقلته المصادر، واعتزل بعد كأس العالم 2011 وصار معلقا وصاحب قناة يوتيوب واسعة المتابعة."
  en: "Pakistani former cricketer and commentator, born in Rawalpindi in 1975. A right-arm fast bowler nicknamed the Rawalpindi Express, he is the fastest bowler in cricket history, having bowled the fastest recorded delivery at 161.3 km/h (100.2 mph) against England at the 2003 World Cup and broken the 100 mph barrier twice. He played for Pakistan from 1997 to 2011, taking 178 wickets in 46 Tests and 247 wickets in 163 One Day Internationals. His career was accompanied by injuries and repeated controversy as the sources report it; he retired after the 2011 World Cup and became a commentator and a widely followed YouTube presenter."
  ur: "پاکستان کے سابق کرکٹ کھلاڑی اور مبصر، جو 1975 میں راولپنڈی میں پیدا ہوئے۔ دائیں ہاتھ کے تیز گیند باز، جو «راولپنڈی ایکسپریس» کے لقب سے مشہور ہیں، وہ کرکٹ کی تاریخ کے تیز ترین گیند باز ہیں، انھوں نے 2003ء ورلڈ کپ میں انگلینڈ کے خلاف 161.3 کلومیٹر فی گھنٹہ کی تیز ترین ریکارڈ شدہ گیند پھینکی اور دو بار 100 میل فی گھنٹہ کی حد عبور کی۔ انھوں نے 1997ء سے 2011ء تک پاکستان کے لیے کھیلا، 46 ٹیسٹ میچوں میں 178 وکٹیں اور 163 ایک روزہ میچوں میں 247 وکٹیں لیں۔ ان کے کیریئر کے ساتھ چوٹیں اور بار بار تنازعات رہے جیسا کہ ماخذ بیان کرتے ہیں؛ وہ 2011ء ورلڈ کپ کے بعد ریٹائر ہوئے اور مبصر اور وسیع پیمانے پر دیکھے جانے والے یوٹیوب پیش کار بنے۔"
