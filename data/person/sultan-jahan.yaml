summary:
  ar: "حاكمة إمارة بوبال الإسلامية في وسط الهند (1901–1926)، وثالثة ورابع نساء أسرة البيغومات اللواتي حكمن بوبال؛ أصلحت التعليم والصحة والقضاء والإدارة، وجعلت التعليم الابتدائي مجانيًا وإلزاميًا سنة 1918، وكانت أول مستشارة (رئيسة) لجامعة عليكرة الإسلامية من 1920 حتى وفاتها، وألّفت كتبًا في التربية والصحة وشؤون المرأة، ثم تنازلت عن العرش لابنها حميد الله خان سنة 1926."
  en: "Ruler of the Islamic principality of Bhopal in central India (1901–1926), of the line of Begums who governed Bhopal. She reformed education, health, the judiciary and administration, made primary education free and compulsory in 1918, served as founding Chancellor of Aligarh Muslim University from 1920 until her death — the only woman to have held that office — wrote books on education, health and women's questions, and abdicated in 1926 in favour of her son Hamidullah Khan."
  ur: "وسط ہندوستان کی مسلم ریاست بھوپال کی حکمران (1901–1926)، بیگمات کی اس نسل سے جنہوں نے بھوپال پر حکومت کی۔ انہوں نے تعلیم، صحت، عدلیہ اور انتظام میں اصلاحات کیں، 1918 میں ابتدائی تعلیم مفت اور لازمی قرار دی، 1920 سے وفات تک علی گڑھ مسلم یونیورسٹی کی بانی چانسلر رہیں، تعلیم و صحت پر کتابیں لکھیں، اور 1926 میں اپنے بیٹے حمید اللہ خان کے حق میں تخت سے دستبردار ہو گئیں۔"
