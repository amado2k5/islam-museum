summary: { ar: "أمير مملوكي، صديق الأمير سلار، ولي غزة ثم حماة، وبنى خانقاه ومدرسة قرب جامع ابن طولون ⁦(1303-1304م)⁩ فيها قبره وقبر سلار؛ ومات سنة 1344م عند يومانز ⁦(والبطاقة الأولى من ويكي بيانات تجعلها 1345م)⁩ {cite:yeomans-islamic-cairo-2006 p.145}.", en: "Mamluk amir, friend of the amir Salar, governor of Gaza and later Hama, who built the khanqah-madrasa near the Mosque of Ibn Tulun (1303-1304) holding his and Salar's tombs; died 1344 according to Yeomans (the earlier Wikidata card gives 1345) {cite:yeomans-islamic-cairo-2006 p.145}.", es: "Emir mameluco, amigo del emir Salar, gobernador de Gaza y posteriormente de Hama, quien construyó la khanqah-madrasa cerca de la Mezquita de Ibn Tulun (1303-1304) que alberga su tumba y la de Salar; murió en 1344 según Yeomans (la ficha anterior de Wikidata indica 1345) {cite:yeomans-islamic-cairo-2006 p.145}.", fr: "Émir mamelouk, ami de l'émir Salar, gouverneur de Gaza puis de Hama, qui fit construire la khanqah-madrasa près de la mosquée d'Ibn Tulun (1303-1304) abritant ses tombeaux et celui de Salar; mort en 1344 selon Yeomans (la fiche Wikidata antérieure donne 1345) {cite:yeomans-islamic-cairo-2006 p.145}.", ur: "مملوک امیر، امیر سالار کا دوست، غزہ کا گورنر اور بعد میں حما، جس نے ابن طولون (1303-1304) کی مسجد کے قریب خانقاہ مدرسہ تعمیر کیا جس میں ان کی اور سالار کی قبریں تھیں؛ یومانز کے مطابق 1344 میں فوت ہوا ⁦(پہلے وکی ڈیٹا کارڈ 1345 دیتا ہے)⁩ {حوالہ: yeomans-islamic-cairo-2006 p.145}۔", tr: "Memlük prensi ve Prens Salar'ın arkadaşı olan Sár, önce Gazze'yi, ardından Hama'yı yönetti ve mezarı ile Salar'ın türbesinin bulunduğu İbn Tulun Camii (1303-1304) yakınında bir hanka ve bir okul inşa etti; 1344 yılında Yomans'ta öldü (ilk Wikidata kartı 1345 olarak gösteriyor) {cite:Yeomans-Islamic-cairo-2006 s.145}.", id: "Seorang pangeran Mamluk, teman Pangeran Salar, ia memerintah Gaza lalu Hama, dan membangun sebuah khanqah serta sekolah di dekat Masjid Ibn Tulun (1303-1304 M), tempat makamnya dan makam Salar berada; ia meninggal pada tahun 1344 M di Yomans (dan kartu Wikidata pertama menyebutnya sebagai 1345 M) {cite:Yeomans-Islamic-cairo-2006 hlm.145}." }
