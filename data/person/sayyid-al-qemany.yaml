summary:
  ar: "سيد القمني ⁦(1947–2022)⁩ كاتب وباحث مصري علماني، اشتهر بقراءات نقدية في التاريخ الإسلامي المبكر أثارت جدلاً واسعاً ومُنعت بعض كتبه. من مؤلفاته «رب هذا الزمان» و«الحزب الهاشمي» و«الأسطورة والتراث»."
  en: "Sayyid al-Qemany (1947–2022) was an Egyptian secular writer and researcher known for critical rereadings of early Islamic history that provoked wide controversy, with some of his books banned. His works include Rabb hadha al-Zaman, Al-Hizb al-Hashimi (The Hashemite Party) and Al-Ustura wal-Turath (Myth and Heritage)."
  ur: "سید القمنی ⁦(1947–2022)⁩ مصری سیکولر مصنف اور محقق تھے، ابتدائی اسلامی تاریخ کی تنقیدی قراءتوں کے لیے مشہور جن پر وسیع تنازعہ ہوا اور ان کی بعض کتابوں پر پابندی لگی۔ تصانیف میں «رب هذا الزمان»، «الحزب الهاشمي» اور «الأسطورة والتراث» شامل ہیں۔"
  es: "Sayyid al-Qemany (1947-2022) fue un escritor e investigador egipcio laico, conocido por sus reinterpretaciones críticas de la historia temprana del Islam, que suscitaron gran controversia y llevaron a la prohibición de algunos de sus libros. Entre sus obras destacan Rabb hadha al-Zaman, Al-Hizb al-Hashimi (El Partido Hachemita) y Al-Ustura wal-Turath (Mito y Patrimonio)."
  fr: "Sayyid al-Qemany (1947-2022) était un écrivain et chercheur égyptien laïc, connu pour ses relectures critiques de l'histoire des débuts de l'islam qui ont suscité une vive controverse, certains de ses ouvrages ayant été interdits. Parmi ses œuvres figurent Rabb hadha al-Zaman, Al-Hizb al-Hashimi (Le Parti hachémite) et Al-Ustura wal-Turath (Mythe et héritage)."
  tr: "Seyyid El-Kamni (1947–2022), erken İslam tarihinin eleştirel yorumlarıyla tanınan, geniş tartışmalara yol açan ve bazı kitaplarının yasaklanmasına yol açan seküler bir Mısırlı yazar ve araştırmacıydı. Eserleri arasında \"Bu Zamanın Efendisi\", \"Haşimi Partisi\" ve \"Mit ve Miras\" yer alır."
  id: "Sayyid Al-Qamni (1947–2022) adalah seorang penulis dan peneliti sekuler Mesir, terkenal karena pembacaan kritis terhadap sejarah Islam awal yang memicu kontroversi luas dan menyebabkan pelarangan beberapa bukunya. Karya-karyanya meliputi \"The Lord of This Time,\" \"The Hashemite Party,\" dan \"Myth and Heritage.\""
