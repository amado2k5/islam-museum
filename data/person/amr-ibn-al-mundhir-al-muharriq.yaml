summary:
  ar: "عمرو بن المنذر اللخمي، قيل إنه سُمي محرقاً لأنه أحرق من بني دارم تسعة وتسعين رجلاً يوم أوارة الثاني وأتم المائة بوافد البراجم فذهبت مقولته «إن الشقي وافد البراجم» مثلاً {cite:kamil-ibn-al-athir p. 412-413}."
  en: "Amr ibn al-Mundhir the Lakhmid, called al-Muharriq 'the burner' for burning ninety-nine men of Banu Darim at the second day of Awara and completing his hundred with the Burajim passer-by — whence the proverb {cite:kamil-ibn-al-athir p. 412-413}."
  es: "Amr ibn al-Mundhir el Lakhmid, llamado al-Muharriq 'el quemador' por quemar noventa y nueve hombres de Banu Darim en el segundo día de Awara y completar su centenar con el transeúnte Burajim, de donde proviene el proverbio {cite:kamil-ibn-al-athir p. 412-413}."
  fr: "Amr ibn al-Mundhir le Lakhmid, appelé al-Muharriq « le brûleur » pour avoir brûlé quatre-vingt-dix-neuf hommes de Banu Darim le deuxième jour d'Awara et complété son centième avec le Burajim de passage — d'où le proverbe {cite:kamil-ibn-al-athir p. 412-413}."
  ur: "عمرو بن المنذر لخمید، جس نے المحرق کو آوارہ کے دوسرے دن بنو داریم کے ننانوے آدمیوں کو جلانے اور بروجم راہگیر کے ساتھ اپنی سو پوری کرنے پر 'جلانے والا' کہا تھا - یہ کہاوت ہے: کامل ابن الاثیر ص۔ 412-413}۔"
  tr: "Amr ibn al-Mundhir al-Lakhmi'ye, ikinci Awarah günü Banu Darim'den doksan dokuz adamı yaktığı için burner olarak adlandırıldığı söylenir; bu da baracımın gelişiyle yüzü tamamlamıştır. Örneğin, \"Gerçekten de sefil el-Baracim'in gelişidir\" dediği gibi, {cite:kamil-ibn-al-athir s. 412-413}."
  id: "Amr ibn al-Mundhir al-Lakhmi, dikatakan ia disebut pembakar karena membakar sembilan puluh sembilan orang dari Banu Darim pada hari Awarah kedua, menyelesaikan seratus dengan kedatangan barajim. Demikianlah, pepatahnya \"Memang, yang malang adalah kedatangan al-Barajim,\" misalnya {cite:kamil-ibn-al-athir hlm. 412-413}."
