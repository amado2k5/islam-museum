class: person
label: { ar: "العباس بن محمد بن علي بن عبد الله", en: "al-'Abbas ibn Muhammad ibn 'Ali ibn 'Abd Allah", fr: "Al-Abbas ibn Muhammad ibn Ali ibn Abd Allah", ur: "عباس بن محمد بن علی بن عبد اللہ", es: "al-'Abbas ibn Muhammad ibn 'Ali ibn 'Abd Allah" }
summary:
  ar: "عم الخليفتين أبي العباس السفاح وأبي جعفر المنصور، وأحد قادة الدولة العباسية؛ أعاد فتح ملطية سنة 139هـ، وولّاه المنصور الجزيرة وثغورها سنة 142هـ تقريباً، وقاتل الروم، وتوفي سنة 186هـ. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  en: "Brother of the first two Abbasid caliphs, Abu al-'Abbas al-Saffah and Abu Ja'far al-Mansur. He helped retake Malatya in 139/756 and was appointed by al-Mansur governor of al-Jazira and its frontier district. He fought the Byzantines, led the troops for al-Mahdi's expedition of 159/775–6 and died in 186/802. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  fr: "Frère des premiers califes abbassides, Abu al-Abbas al-Saffah et Abu Ja’far al-Mansur. Il contribua à reprendre Malatya en 139 H/756, puis fut nommé par al-Mansur gouverneur d’al-Jazira et du district frontalier voisin. Il combattit les Byzantins, dirigea les troupes d’une expédition organisée par al-Mahdi en 159 H/775–776 et mourut en 186 H/802. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  ur: "پہلے دو عباسی خلفاء ابو العباس السفاح اور ابو جعفر المنصور کے بھائی اور عباسی ریاست کے سپہ سالار۔ 139/756 میں ملطیہ واپس لینے میں مدد کی، اور المنصور نے انہیں الجزیرہ کا والی بنایا۔ 186/802 میں وفات پائی۔ {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  es: "Hermano de los dos primeros califas abasíes, Abu al-Abbas al-Saffah y Abu Ja'far al-Mansur. Ayudó a reconquistar Malatya en 139/756 y fue nombrado por al-Mansur gobernador de al-Jazira y su distrito fronterizo. Luchó contra los bizantinos, dirigió las tropas de la expedición de al-Mahdi en 159/775-776 y murió en 186/802. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
