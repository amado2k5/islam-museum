label: { ar: "العباس بن محمد بن علي بن عبد الله", en: "al-'Abbas ibn Muhammad ibn 'Ali ibn 'Abd Allah", ur: "عباس بن محمد بن علی بن عبد اللہ" }
summary:
  ar: "عم الخليفتين أبي العباس السفاح وأبي جعفر المنصور، وأحد قادة الدولة العباسية؛ أعاد فتح ملطية سنة 139هـ، وولّاه المنصور الجزيرة وثغورها سنة 142هـ تقريباً، وقاتل الروم، وتوفي سنة 186هـ. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  en: "Brother of the first two Abbasid caliphs, Abu al-'Abbas al-Saffah and Abu Ja'far al-Mansur. He helped retake Malatya in 139/756 and was appointed by al-Mansur governor of al-Jazira and its frontier district. He fought the Byzantines, led the troops for al-Mahdi's expedition of 159/775–6 and died in 186/802. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  ur: "پہلے دو عباسی خلفاء ابو العباس السفاح اور ابو جعفر المنصور کے بھائی اور عباسی ریاست کے سپہ سالار۔ 139/756 میں ملطیہ واپس لینے میں مدد کی، اور المنصور نے انہیں الجزیرہ کا والی بنایا۔ 186/802 میں وفات پائی۔ {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
