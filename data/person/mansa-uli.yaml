id: person/mansa-uli
class: person
label: { ar: "منسا أولي", en: "Mansa Uli", ur: "منسا اولی" }
names: ["Mansa Wali", "Mansa Uli (or Wali)"]
summary:
  ar: "منسا أولي، ويرد أيضاً باسم والي، ابن مؤسس مملكة مالي، وسّع فتوحات أبيه وأمّن حدود مالي الشمالية في الصحراء، فتهيأ له أن يؤدي الحج، ومرّ بالقاهرة في عهد بيبرس بين 658 و676هـ/1260-1277م. وتذكر دائرة المعارف الإسلامية أن لحج الملوك في غرب أفريقيا تقليداً طويلاً {cite:encyclopaedia-of-islam-2 vol. 6 p. 278}."
  en: "Mansa Uli, also given as Wali, was a son of the founder of the kingdom of Mali. He extended his father's conquests and secured Mali's northern frontiers in the Sahara, which allowed him to make the pilgrimage to Mecca, passing through Cairo in the reign of Baybars, between 658/1260 and 676/1277. The Encyclopaedia of Islam notes that West Africa had a long tradition of royal pilgrims {cite:encyclopaedia-of-islam-2 vol. 6 p. 278}."
  ur: "منسا اولی، جنہیں والی بھی کہا گیا ہے، مملکتِ مالی کے بانی کے بیٹے تھے۔ انہوں نے باپ کی فتوحات کو وسعت دی اور صحرا میں مالی کی شمالی سرحدیں محفوظ کیں، جس کے بعد وہ حج کر سکے اور بیبرس کے عہد یعنی 658ھ/1260ء سے 676ھ/1277ء کے درمیان قاہرہ سے گزرے۔ دائرۃ المعارف الاسلامیہ بتاتی ہے کہ مغربی افریقہ میں شاہی حاجیوں کی طویل روایت تھی {cite:encyclopaedia-of-islam-2 vol. 6 p. 278}."
