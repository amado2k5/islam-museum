summary:
  ar: "يونس بن متى. عند البخاري قال النبي «ما ينبغي لعبد أن يقول إني خير من يونس بن متى» ونسبه إلى أبيه {cite:sahih-al-bukhari 3412} {cite:sahih-al-bukhari 3413}."
  en: "Yunus ibn Matta: the Prophet said no servant should claim to be better than him {cite:sahih-al-bukhari 3412}."
  es: "Yunus ibn Matta: el Profeta dijo que ningún siervo debería pretender ser mejor que él {cita:sahih-al-bukhari 3412}."
  fr: "Yunus ibn Matta: le Prophète a dit qu'aucun serviteur ne devait prétendre être meilleur que lui {cite: sahih-al-bukhari 3412}."
  ur: "یونس بن متی: رسول اللہ نے فرمایا کہ کوئی بندہ اس سے بہتر ہونے کا دعویٰ نہ کرے۔"
  tr: "Yunus ibn Matta. El-Buhari'ye göre, Peygamber şöyle demiştir: 'Bir hizmetkârın 'Yunus ibn Matta'dan daha iyiyim' demesi uygun değildir ve bunu babasına atfetmiştir {atıf:sahih-al-bukhari 3412} {atıf:sahih-al-bukhari 3413}."
  id: "Yunus ibn Matta. Menurut al-Bukhari, Nabi berfirman: 'Tidak pantas bagi seorang hamba untuk berkata, 'Aku lebih baik dari Yunus ibn Matta,' dan mengaitkannya dengan ayahnya {cite:sahih-al-bukhari 3412} {cite:sahih-al-bukhari 3413}."
