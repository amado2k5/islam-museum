summary:
  ar: "أبو سعيد يحيى بن سعيد بن فروخ القطان الأحول، يُقال مولى بني تميم، بصري؛ من أئمة الجرح والتعديل وأثبت أصحاب شعبة. سمع الأعمش وسفيان الثوري وشعبة ومالكاً وحماد بن سلمة وثابتاً البناني ومطراً الوراق وغيرهم، وقال عن نفسه إنه لزم شعبة عشرين سنة، وروى عنه عبد الرحمن بن مهدي وعفان بن مسلم وعلي بن المديني وأحمد بن حنبل ويحيى بن معين وأبو خيثمة وقتيبة بن سعيد وعثمان بن أبي شيبة وخلق كثير؛ كان شديد الاحتياط في الرواية حتى عابُوه على طول صدره عن الضعفاء، وكانت بينه وبين سفيان الثوري مراجعات في الحديث صحّح فيها بعضُهما لبعض؛ توفي في المحرم سنة ثمان وتسعين ومائة {cite:tarikh-baghdad-khatib j.11 p.140}."
  en: "Abu Sa'id al-Qattan of Basra — the exacting hadith critic who sat with Shu'ba for twenty years and taught Ibn Mahdi, 'Affan, Ibn al-Madini, Ahmad ibn Hanbal and Ibn Ma'in; died Muharram 198 {cite:tarikh-baghdad-khatib j.11 p.140}."
