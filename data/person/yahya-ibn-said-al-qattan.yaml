summary:
  ar: "أبو سعيد يحيى بن سعيد بن فروخ القطان الأحول، يُقال مولى بني تميم، بصري؛ من أئمة الجرح والتعديل وأثبت أصحاب شعبة. سمع الأعمش وسفيان الثوري وشعبة ومالكاً وحماد بن سلمة وثابتاً البناني ومطراً الوراق وغيرهم، وقال عن نفسه إنه لزم شعبة عشرين سنة، وروى عنه عبد الرحمن بن مهدي وعفان بن مسلم وعلي بن المديني وأحمد بن حنبل ويحيى بن معين وأبو خيثمة وقتيبة بن سعيد وعثمان بن أبي شيبة وخلق كثير؛ كان شديد الاحتياط في الرواية حتى عابُوه على طول صدره عن الضعفاء، وكانت بينه وبين سفيان الثوري مراجعات في الحديث صحّح فيها بعضُهما لبعض؛ توفي في المحرم سنة ثمان وتسعين ومائة {cite:tarikh-baghdad-khatib j.11 p.140}."
  en: "Abu Sa'id al-Qattan of Basra — the exacting hadith critic who sat with Shu'ba for twenty years and taught Ibn Mahdi, 'Affan, Ibn al-Madini, Ahmad ibn Hanbal and Ibn Ma'in; died Muharram 198 {cite:tarikh-baghdad-khatib j.11 p.140}."
  es: "Abu Sa'id al-Qattan de Basora, el exigente crítico de hadices que se sentó con Shu'ba durante veinte años y enseñó a Ibn Mahdi, 'Affan, Ibn al-Madini, Ahmad ibn Hanbal e Ibn Ma'in; murió Muharram 198 {cita:tarikh-baghdad-khatib j.11 p.140}."
  fr: "Abu Sa'id al-Qattan de Bassora — le critique exigeant des hadiths qui a siégé aux côtés de Shu'ba pendant vingt ans et a enseigné Ibn Mahdi, 'Affan, Ibn al-Madini, Ahmad ibn Hanbal et Ibn Ma'in; est décédé Muharram 198 {cite:tarikh-baghdad-khatib j.11 p.140}."
  ur: "ابو سعید القطان بصرہ - حدیث کا صحیح نقاد جس نے شعبہ کے ساتھ بیس سال تک بیٹھ کر ابن مہدی، عفان، ابن المدینی، احمد بن حنبل اور ابن معین کو پڑھایا۔ متوفی محرم 198 {حوالہ:تاریخ بغداد خطیب ج11 ص140}۔"
  tr: "Ebu Seyid Yahya ibn Said ibn Farukh al-Qattan al-Ahwal, aynı zamanda Banu Tamim'in özgür adamı olarak da bilinir, bir Basra; eleştiri ve doğruluk alanındaki önde gelen âlimlerden biri ve Şube'nin gerçek sahabeleridir. El-A'maş, Sufyan al-Thawri, Şube, Malik, Hammad ibn Salamah, Tabit al-Bannani, Matra al-Warraq ve diğerlerinden dinlemiştir. Şube'de yirmi yıl kaldığını söyledi. Abd al-Rahman ibn Mehdi, Affan İbn Müslim, Ali ibn el-Medini, Ahmed ibn Hanbal, Yahya ibn Ma'in, Ebu Haytamah, Quteybah ibn Sa'id, Osman ibn Ebi Şeybe ve daha birçokları ondan rivayet etti. Rivayet konusunda son derece temkinliydi, zayıf rivayetleri nedeniyle eleştirildi. Kendisi ile Sufyan al-Thawri arasında bazı hadis incelemeleri vardı; 198 Hicri yılında Muharrem'de öldü {alıntı:Tarikh-baghdad-khatib J. 11 s.140}."
  id: "Abu Sa'id Yahya ibn Sa'id ibn Farukh al-Qattan al-Ahwal, juga disebut sebagai mantan Banu Tamim, seorang Basra; salah satu ulama terkemuka dalam kritik dan otentik, serta sahabat otentik Shu'bah. Ia mendengar dari Al-A'mash, Sufyan al-Thawri, Shu'bah, Malik, Hammad ibn Salamah, Thabit al-Bannani, Matra al-Warraq, dan lainnya. Ia mengatakan bahwa ia tinggal bersama Shu'bah selama dua puluh tahun. Abd al-Rahman ibn Mahdi, Affan ibin n Muslim, Ali ibn al-Madini, Ahmad ibn Hanbal, Yahya ibn Ma'in, Abu Khaythamah, Qutaybah ibn Sa'id, Uthman ibn Abi Shaybah, dan banyak lainnya menceritakan darinya. Ia sangat berhati-hati dalam naratif, sampai-sampai dikritik karena narasi yang lemah. Ada tinjauan hadits antara dirinya dan Sufyan al-Thawri, di mana ia mengesahkan beberapa yang lain; ia meninggal di Muharram pada tahun 198 H. {cite:Tarikh-baghdad-khatib J.. 11 hlm.140}."
