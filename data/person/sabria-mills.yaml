summary:
  ar: "معالجة سلوكية ومدربة ومتحدثة أمريكية، ومؤسِّسة ومقدِّمة «بودكاست المرأة المسلمة المتميزة» الذي يضخّم أصوات المسلمين السود في أمريكا ويدعم الشفاء والتحول. حاصلة على الماجستير في القيادة التربوية والسلوك البشري من جامعة جورجيا الجنوبية، وهي الرئيسة التنفيذية لشركة البودكاست وعضو مجلس إدارة منظمة «رابطة»."
  en: "American behavioral therapist, coach and public speaker, and the founder and host of The DOPE Muslim Woman Podcast, a platform amplifying the voices of Black American Muslims and supporting healing and transformation. She holds a master's degree in Educational Leadership and Human Behavior from Georgia Southern University, is CEO of the podcast's LLC, and serves on the board of Rabata."
  ur: "امریکی رویّہ معالجہ، کوچ اور عوامی مقررہ، اور «دی ڈوپ مسلم وومن پوڈکاسٹ» کی بانی و میزبان، جو سیاہ فام امریکی مسلمانوں کی آوازوں کو اجاگر کرتی اور شفا و تبدیلی کی حمایت کرتی ہے۔ انہوں نے جارجیا سدرن یونیورسٹی سے تعلیمی قیادت اور انسانی رویّے میں ماسٹر ڈگری حاصل کی، وہ پوڈکاسٹ کی کمپنی کی چیف ایگزیکٹو ہیں اور رابطہ کے بورڈ کی رکن ہیں۔"
