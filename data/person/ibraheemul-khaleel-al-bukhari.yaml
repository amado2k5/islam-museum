summary:
  ar: "عالم هندي من كيرالا، وُلد سنة 1964 في كادالوندي بكاليكوت. مؤسس ورئيس أكاديمية معدن ⁦(مادين)⁩ التعليمية، والأمين العام لجمعية كيرالا المسلمة ⁦(كيرالا مسلم جماعت)⁩."
  en: "Indian scholar from Kerala, born 1964 in Kadalundi, Kozhikode. Founder and chairman of the Ma'din Academy educational movement and general secretary of the Kerala Muslim Jamaat."
  ur: "کیرالہ کے ہندوستانی عالم، 1964 میں کدالوندی، کوژیکوڈ میں پیدا ہوئے۔ تعلیمی تحریک معدن اکیڈمی کے بانی و چیئرمین اور کیرالا مسلم جماعت کے جنرل سیکریٹری۔"
  es: "Académico indio originario de Kerala, nacido en 1964 en Kadalundi, Kozhikode. Fundador y presidente del movimiento educativo Ma'din Academy y secretario general de la Jamaat Musulmana de Kerala."
  fr: "Érudit indien originaire du Kerala, né en 1964 à Kadalundi, Kozhikode. Fondateur et président du mouvement éducatif Ma'din Academy et secrétaire général de la Kerala Muslim Jamaat."
  tr: "Kerala'dan Hintli bir akademisyen, 1964 yılında Kadalundi, Calicut'ta doğmuştur. Madin Eğitim Akademisi'nin kurucusu ve başkanı, ayrıca Kerala Müslüman Cemiyeti'nin (Kerala Müslüman Cemaati) genel sekreteridir."
  id: "Seorang cendekiawan India dari Kerala, lahir pada tahun 1964 di Kadalundi, Calicut. Pendiri dan presiden Madin Educational Academy, serta sekretaris jenderal Kerala Muslim Association (Kerala Muslim Jamaat)."
