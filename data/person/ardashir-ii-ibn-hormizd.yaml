  id: "Ia adalah raja Persia Sasanian, yang disebutkan oleh al-Tabari dengan judul 'Penyebutan Raja Ardashir ibn Hormiz' {cite:tabari-tarikh-abu-al-fadl J.2 hlm.62}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kisah-kisahnya diceritakan."
