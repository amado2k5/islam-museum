summary:
  ar: "سياسي تونسي (1825–1907)، تعلّم في الزيتونة وصعد في ديوان الإنشاء ووزارة المالية حتى صار وزير القلم، ثم عُيّن وزيرًا أكبر سنة 1882 فبقي في المنصب حتى وفاته، وهو أول تونسي الأصل يتولى الوزارة الكبرى، وأدار الحكومة شكليًا تحت الحماية الفرنسية متعاونًا مع المقيم العام بول كامبون. وهو جدّ الشيخ محمد الطاهر بن عاشور من جهة الأم."
  en: "Tunisian statesman (1825–1907), educated at the Zaytuna, who rose through the state chancellery and the finance administration to become Minister of the Pen, and was appointed grand vizier in 1882, holding the post until his death — the first ethnic Tunisian to head the government, serving under the French protectorate alongside Resident General Paul Cambon. He was the maternal grandfather of the scholar Muhammad al-Tahir ibn Ashur."
  ur: "تونسی سیاست دان (1825–1907)، جامع زیتونہ کے فارغ التحصیل، جو ریاستی چانسلری اور محکمۂ مالیات سے ترقی کر کے وزیرِ قلم بنے، پھر 1882ء میں وزیرِ اعظم مقرر ہوئے اور وفات تک اس عہدے پر رہے — وہ حکومت کی سربراہی کرنے والے پہلے نسلی تونسی تھے اور فرانسیسی تحفظ کے دور میں مقیمِ عام پال کمبون کے ساتھ کام کیا۔ وہ عالم محمد طاہر بن عاشور کے نانا تھے۔"
