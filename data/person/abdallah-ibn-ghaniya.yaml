summary:
  ar: "أبو محمد عبد الله بن علي بن إسحاق بن غانية الصنهاجي الميورقي، أصغر الإخوة؛ بقي ملك ميورقة إلى أن جهز إليه الناصر محمد بن يعقوب الموحدي أسطولاً نزل بساحل ميورقة، فبارزهم وكان شجاعاً فعثر به فرسه فسقط إلى الأرض فقتلوه وحملوا رأسه إلى مراكش وعلقوا جثته على السور، وبقيت ميورقة بأيدي الموحدين إلى أن تغلب عليها الفرنج {cite:wafayat-ayan}."
  en: "Abu Muhammad Abdallah ibn Ali ibn Ishaq ibn Ghaniya al-Sanhaji al-Mayurqi, the youngest of the brothers. He kept the kingship of Mallorca until al-Nasir Muhammad ibn Yaqub al-Muwahhidi sent a fleet that landed on the coast of Mallorca. He challenged them to single combat, but his horse stumbled and threw him to the ground; they killed him, carried his head to Marrakesh and hung his body on the wall. Mallorca remained in Almohad hands until the Franks overcame it {cite:wafayat-ayan}."
