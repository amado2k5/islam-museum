summary:
  ar: "أبو محمد عبد الله بن علي بن إسحاق بن غانية الصنهاجي الميورقي، أصغر الإخوة؛ بقي ملك ميورقة إلى أن جهز إليه الناصر محمد بن يعقوب الموحدي أسطولاً نزل بساحل ميورقة، فبارزهم وكان شجاعاً فعثر به فرسه فسقط إلى الأرض فقتلوه وحملوا رأسه إلى مراكش وعلقوا جثته على السور، وبقيت ميورقة بأيدي الموحدين إلى أن تغلب عليها الفرنج {cite:wafayat-ayan}."
  en: "Abu Muhammad Abdallah ibn Ali ibn Ishaq ibn Ghaniya al-Sanhaji al-Mayurqi, the youngest of the brothers. He kept the kingship of Mallorca until al-Nasir Muhammad ibn Yaqub al-Muwahhidi sent a fleet that landed on the coast of Mallorca. He challenged them to single combat, but his horse stumbled and threw him to the ground; they killed him, carried his head to Marrakesh and hung his body on the wall. Mallorca remained in Almohad hands until the Franks overcame it {cite:wafayat-ayan}."
  fr: "Abu Muhammad Abdallah ibn Ali ibn Ishaq ibn Ghaniya al-Sanhaji al-Mayurqi, le plus jeune des frères. Il conserva la royauté de Majorque jusqu'à ce qu'al-Nasir Muhammad ibn Yaqub l'Almohade envoie une flotte qui débarqua sur la côte de Majorque. Il les défia en combat singulier, mais son cheval trébucha et le jeta à terre ; ils le tuèrent, portèrent sa tête à Marrakech et pendirent son corps au rempart. Majorque resta aux mains des Almohades jusqu'à ce que les Francs s'en emparent {cite:wafayat-ayan}."
  es: "Abu Muhammad Abdallah ibn Ali ibn Ishaq ibn Ghaniya al-Sanhaji al-Mayurqi, el menor de los hermanos, reinó en Mallorca hasta que al-Nasir Muhammad ibn Yaqub al-Muwahhidi envió una flota que desembarcó en la costa. Los desafió a un duelo, pero su caballo tropezó y lo derribó; lo mataron, llevaron su cabeza a Marrakech y colgaron su cuerpo en la muralla. Mallorca permaneció en manos almohades hasta que los francos la conquistaron {cite:wafayat-ayan}."
  ur: "ابو محمد عبد اللہ بن علی ابن اسحاق بن غنیہ السنہجی المیورقی، بھائیوں میں سب سے چھوٹے تھے۔ اس نے مالورکا کی بادشاہی اس وقت تک اپنے پاس رکھی جب تک کہ النصیر محمد بن یعقوب المواحدی نے ایک بحری بیڑا بھیجا جو میلورکا کے ساحل پر اترا۔ اس نے انہیں اکیلی لڑائی کا للکارا، لیکن اس کے گھوڑے نے ٹھوکر کھائی اور اسے زمین پر پھینک دیا۔ انہوں نے اسے قتل کر دیا، اس کا سر ماراکیش لے گئے اور اس کی لاش کو دیوار سے لٹکا دیا۔ میلورکا الموحد کے ہاتھ میں رہا یہاں تک کہ فرانکس نے اس پر قابو پالیا۔"
  tr: "Kardeşlerin en küçüğü olan Ebu Muhammed Abdullah bin Ali bin İshak bin Ganiye el-Sanhaji el-Mayurki, el-Nasır Muhammed bin Yakub el-Muvahhid'in kendisine bir filo gönderip Mayorka kıyılarına çıkarma yapmasına kadar Mayorka kralı olarak kaldı. Onlarla savaştı ve cesurdu, ancak atı tökezledi ve yere düştü. Onu öldürdüler ve başını Marakeş'e götürüp cesedini surlara astılar. Mayorka, Franklar tarafından fethedilene kadar El-Mohadların elinde kaldı."
  id: "Abu Muhammad Abdullah bin Ali bin Ishaq bin Ghaniya al-Sanhaji al-Mayurqi, adik bungsu dari saudara-saudara Almohad, tetap menjadi raja Majorca hingga al-Nasir Muhammad bin Yaqub al-Muwahhid mengirimkan armada kepadanya yang mendarat di pantai Majorca. Ia melawan mereka dan menunjukkan keberanian, tetapi kudanya tersandung dan ia jatuh ke tanah. Mereka membunuhnya dan membawa kepalanya ke Marrakesh dan menggantung tubuhnya di dinding. Majorca tetap berada di tangan Almohad hingga bangsa Frank menaklukkannya."
