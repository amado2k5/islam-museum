summary:
  en: "A Persian seeker who passed through Zoroastrianism and Christianity before reaching Muhammad; freed from slavery in Medina, he is remembered for proposing the trench at the siege of 627."
  ar: "رجل فارسي طلب الحق فانتقل من المجوسية إلى النصرانية حتى لقي محمدًا؛ أُعتق من الرق في المدينة، ويُذكر باقتراحه حفر الخندق في حصار سنة 627م. وكان عامل عمر على المدائن يلبس الصوف ويركب الحمار ببرذعته بغير إكاف ويأكل خبز الشعير، ولما احتضر أوصى سعد بن أبي وقاص اذكر الله عند همك إذا هممت وعند لسانك إذا حكمت وعند يدك إذا قسمت، وقال إن في الآخرة عقبة لا يقطعها إلا المخفون فلم يجدوا في بيته إلا أداوة وركوة ومطهرة {cite:muruj-al-dhahab p. 603}"
