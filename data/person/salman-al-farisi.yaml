summary:
  en: "A Persian seeker who passed through Zoroastrianism and Christianity before reaching Muhammad; freed from slavery in Medina, he is remembered for proposing the trench at the siege of 627. Usd al-Ghaba's entry on him (no. 2151) describes him as a Zoroastrian fire-priest of Fars before Islam who became the Prophet's client and is known as Salman al-Khayr, recording the account of his search for the true faith {cite:usd-ghaba p.499}. The Encyclopaedia of Islam calls him a semi-legendary Companion regarded in later tradition as the first convert, and its author judges the tradition that he advised digging the trench to be probably a later invention, while later veneration made his reported tomb at Salman Pak a pilgrimage site."
  ar: "رجل فارسي طلب الحق فانتقل من المجوسية إلى النصرانية حتى لقي محمدًا؛ أُعتق من الرق في المدينة، ويُذكر باقتراحه حفر الخندق في حصار سنة 627م. وكان عامل عمر على المدائن يلبس الصوف ويركب الحمار ببرذعته بغير إكاف ويأكل خبز الشعير، ولما احتضر أوصى سعد بن أبي وقاص اذكر الله عند همك إذا هممت وعند لسانك إذا حكمت وعند يدك إذا قسمت، وقال إن في الآخرة عقبة لا يقطعها إلا المخفون فلم يجدوا في بيته إلا أداوة وركوة ومطهرة {cite:muruj-al-dhahab p. 603}. ويذكر أسد الغابة في ترجمته رقم ٢١٥١ أنه كان مجوسياً سادن النار ببلاد فارس قبل الإسلام، وأنه صار مولى لرسول الله ويعرف بسلمان الخير، وذكر سبب إسلامه ورحلة طلبه {cite:usd-ghaba p.499}. وتصفه دائرة المعارف الإسلامية بأنه شخصية شبه أسطورية يراه التراث اللاحق أول المهتدين، ويرى كاتب المقال أن نسبة فكرة الخندق إليه اختلقت على الأرجح لاحقًا، وصار قبره المزعوم في سلمان باك مقصد زيارة"
  ur: "ایک فارسی متلاشیِ حق جو مجوسیت اور مسیحیت سے گزر کر محمد تک پہنچا؛ مدینہ میں غلامی سے آزاد ہوا اور روایت میں سنہ 627ء کے محاصرے میں خندق کھودنے کا مشورہ دینے کے لیے یاد کیا جاتا ہے۔ اسلامی دائرۃ المعارف اسے نیم افسانوی صحابی کہتی ہے جسے بعد کی روایت پہلا نومسلم سمجھتی ہے، اور مقالہ نگار کے نزدیک خندق کا مشورہ غالباً بعد کی گھڑت ہے، جبکہ بعد کی تعظیم نے سلمان پاک کی مبینہ قبر کو زیارت گاہ بنا دیا۔"
