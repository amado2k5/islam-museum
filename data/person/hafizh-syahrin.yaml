summary:
  ar: "متسابق دراجات نارية ماليزي، وُلد في سلانغور سنة 1994. بعد صعوده منصات التتويج في موتو2 مع فريق بيتروناس ريسلاين، أصبح أول متسابق من جنوب شرق آسيا يشارك في فئة موتو جي بي، مع فريق تك3 في 2018–2019، ثم شارك لاحقًا في بطولة العالم للسوبر بايك."
  en: "Malaysian motorcycle racer, born in Selangor in 1994. After Moto2 podiums with Petronas Raceline, he became the first Southeast Asian to race in the MotoGP category, with Tech3 in 2018–2019, and later competed in the Superbike World Championship."
  ur: "ملائیشیائی موٹر سائیکل ریسر، جو 1994 میں سلانگور میں پیدا ہوئے۔ پیٹروناس ریس لائن کے ساتھ موٹو2 میں پوڈیم حاصل کرنے کے بعد، وہ موٹو GP زمرے میں ریس کرنے والے پہلے جنوب مشرقی ایشیائی بنے، 2018–2019 میں ٹیک3 کے ساتھ، اور بعد میں سپر بائیک عالمی چیمپئن شپ میں حصہ لیا۔"
