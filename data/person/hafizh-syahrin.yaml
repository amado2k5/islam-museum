summary:
  ar: "متسابق دراجات نارية ماليزي، وُلد في سلانغور سنة 1994. بعد صعوده منصات التتويج في موتو2 مع فريق بيتروناس ريسلاين، أصبح أول متسابق من جنوب شرق آسيا يشارك في فئة موتو جي بي، مع فريق تك3 في 2018–2019، ثم شارك لاحقًا في بطولة العالم للسوبر بايك."
  en: "Malaysian motorcycle racer, born in Selangor in 1994. After Moto2 podiums with Petronas Raceline, he became the first Southeast Asian to race in the MotoGP category, with Tech3 in 2018–2019, and later competed in the Superbike World Championship."
  ur: "ملائیشیائی موٹر سائیکل ریسر، جو 1994 میں سلانگور میں پیدا ہوئے۔ پیٹروناس ریس لائن کے ساتھ موٹو2 میں پوڈیم حاصل کرنے کے بعد، وہ موٹو GP زمرے میں ریس کرنے والے پہلے جنوب مشرقی ایشیائی بنے، 2018–2019 میں ٹیک3 کے ساتھ، اور بعد میں سپر بائیک عالمی چیمپئن شپ میں حصہ لیا۔"
  es: "Piloto de motociclismo malasio, nacido en Selangor en 1994. Tras conseguir podios en Moto2 con Petronas Raceline, se convirtió en el primer asiático del sudeste en competir en la categoría de MotoGP, con Tech3 en 2018-2019, y posteriormente compitió en el Campeonato del Mundo de Superbikes."
  fr: "Pilote de moto malaisien, né à Selangor en 1994. Après des podiums en Moto2 avec Petronas Raceline, il est devenu le premier Sud-Est asiatique à courir en MotoGP, avec Tech3 en 2018-2019, et a ensuite participé au Championnat du monde Superbike."
  tr: "1994 yılında Selangor'da doğmuş Malezyalı motosiklet yarışçısı. Petronas Reslayne takımıyla Moto2'de podyuma çıktıktan sonra, 2018–2019 yıllarında T3 takımıyla MotoGP kategorisinde yarışan ilk Güneydoğu Asyalı yarışçı oldu, ardından Superbike Dünya Şampiyonası'na katıldı."
  id: "Pembalap motor asal Malaysia, lahir di Selangor pada tahun 1994. Setelah naik podium di Moto2 bersama tim Petronas Reslayne, ia menjadi pembalap Asia Tenggara pertama yang berkompetisi di kategori MotoGP bersama tim T3 pada musim 2018–2019, lalu kemudian berpartisipasi di Kejuaraan Dunia Superbike."
