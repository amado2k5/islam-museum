  note: 'Two independent editions name his school for him personally: the English article''s infobox gives his denomination as Sunni and his jurisprudence as Hanafi, and the Arabic article''s infobox gives his fiqh as Hanafi (حنفي). The Urdu article''s text reports his own stated position: he is a Sunni scholar who holds it wrong to attach the Ahl-e-Sunnat to any person or region and declares himself simply an Ahl-e-Sunnat Muslim, free of the Barelvi and Deobandi labels (citing his organisation''s site). Wikidata gives Islam and Sunni Islam. Preserved readings: the Urdu and Arabic categories file him among Barelvi personalities — category filings which his own stated position contradicts; they are recorded here, not adopted. Founding Minhaj-ul-Quran is not the basis of this value; the two infobox attestations and his reported self-description are.'
