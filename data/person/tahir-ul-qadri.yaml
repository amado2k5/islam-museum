label:
  ar: محمد طاهر القادري
  en: Muhammad Tahir-ul-Qadri
  ur: محمد طاہر القادری
  es: "Muhammad Tahir-ul-Qadri"
  fr: "Muhammad Tahir-ul-Qadri"
summary:
  ar: عالم دين باكستاني كندي، وُلد في جهنغ سنة 1951. مؤسس منهاج القرآن الدولية (1980) وحزب الحركة الشعبية الباكستانية (1989)، وأستاذ سابق للقانون الدستوري بجامعة البنجاب، وصاحب «فتوى ضد الإرهاب» (2010)، وله أكثر من ألف كتاب في الأردية والعربية والإنجليزية.
  en: Pakistani-Canadian Islamic scholar, born in Jhang in 1951. He founded Minhaj-ul-Quran International (1980) and the Pakistan Awami Tehreek party (1989), was a professor of constitutional law at the University of the Punjab, issued the 2010 Fatwa on Terrorism, and has authored more than a thousand books in Urdu, Arabic and English.
  ur: پاکستانی نژاد کینیڈین عالمِ دین، جو 1951 میں جھنگ میں پیدا ہوئے۔ وہ منہاج القرآن انٹرنیشنل (1980) اور پاکستان عوامی تحریک (1989) کے بانی، پنجاب یونیورسٹی میں آئینی قانون کے سابق پروفیسر، اور «فتویٰ ضدِ دہشت گردی» (2010) کے مصنف ہیں۔
  es: "Erudito islámico paquistaní-canadiense, nacido en Jhang en 1951. Fundó Minhaj-ul-Quran International (1980) y el partido Pakistan Awami Tehreek (1989), fue profesor de derecho constitucional en la Universidad de Punjab, emitió la fatwa sobre terrorismo de 2010 y es autor de más de mil libros en urdu, árabe e inglés."
  fr: "Érudit islamique pakistano-canadien, né à Jhang en 1951. Il a fondé Minhaj-ul-Quran International (1980) et le parti Pakistan Awami Tehreek (1989), a été professeur de droit constitutionnel à l'Université du Pendjab, a émis la fatwa de 2010 sur le terrorisme et est l'auteur de plus de mille livres en ourdou, en arabe et en anglais."
  tr: "1951'de Jhang'da doğan Pakistanlı Kanadalı bir din bilgini. Minhaj al-Quran International (1980) ve Pakistan Halk Hareketi Partisi'nin (1989) kurucusu, Pencap Üniversitesi'nde anayasa hukuku profesörü, 'Terörizme Karşı Fetva' (2010) kitabının yazarı ve Urduca, Arapça ve İngilizce olarak binin üzerinde kitabın yazarıdır."
  id: "Seorang cendekiawan agama Pakistan-Kanada, lahir di Jhang pada tahun 1951. Pendiri Minhaj al-Quran International (1980) dan Partai Gerakan Rakyat Pakistan (1989), mantan profesor hukum konstitusi di Universitas Punjab, penulis 'Fatwa Against Terrorism' (2010), dan penulis lebih dari seribu buku dalam bahasa Urdu, Arab, dan Inggris."
