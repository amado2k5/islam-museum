summary:
  ar: عالم دين باكستاني كندي، وُلد في جهنغ سنة 1951. مؤسس منهاج القرآن الدولية (1980) وحزب الحركة الشعبية الباكستانية (1989)، وأستاذ سابق للقانون الدستوري بجامعة البنجاب، وصاحب «فتوى ضد الإرهاب» (2010)، وله أكثر من ألف كتاب في الأردية والعربية والإنجليزية.
  en: Pakistani-Canadian Islamic scholar, born in Jhang in 1951. He founded Minhaj-ul-Quran International (1980) and the Pakistan Awami Tehreek party (1989), was a professor of constitutional law at the University of the Punjab, issued the 2010 Fatwa on Terrorism, and has authored more than a thousand books in Urdu, Arabic and English.
  ur: پاکستانی نژاد کینیڈین عالمِ دین، جو 1951 میں جھنگ میں پیدا ہوئے۔ وہ منہاج القرآن انٹرنیشنل (1980) اور پاکستان عوامی تحریک (1989) کے بانی، پنجاب یونیورسٹی میں آئینی قانون کے سابق پروفیسر، اور «فتویٰ ضدِ دہشت گردی» (2010) کے مصنف ہیں۔
