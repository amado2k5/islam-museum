summary:
  ar: "خان بخارى الشيباني (حكم 1534–1539)، ابن أخي محمد شيباني. حكم بخارى منذ 1511–1512، وهزم بابر، وقاد حملات متكررة ضد إيران الصفوية، وبنى مسجد كالان ومدرسة مير عرب، ودُفن في المدرسة."
  en: "Shaybanid khan of Bukhara (r. 1534–1539), nephew of Muhammad Shaybani. He held Bukhara from 1511–12, defeated Babur, campaigned repeatedly against Safavid Iran, built the Kalan Mosque and the Mir-i-Arab Madrasa, and was buried in the madrasa."
  ur: "بخارا کے شیبانی خان (دورِ حکومت 1534–1539ء)، محمد شیبانی کے بھتیجے۔ انھوں نے 1511–12ء سے بخارا سنبھالا، بابر کو شکست دی، صفوی ایران کے خلاف بار بار مہمات چلائیں، مسجد کالان اور مدرسہ میر عرب تعمیر کیے اور مدرسے ہی میں دفن ہوئے۔"
