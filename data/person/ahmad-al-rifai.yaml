names:
  - { value: "أبو العباس أحمد بن علي بن أحمد بن يحيى بن حازم بن علي بن رفاعة البطائحي", kind: full }
summary:
  ar: "الشيخ الزاهد القدوة أحمد بن علي الرفاعي البطائحي نسبة إلى البطائح قرى في وسط الماء بين واسط والبصرة؛ مغربي الأصل ولد في المحرم سنة خمسمائة وتخرج بخاله الشيخ الزاهد منصور وكان شافعياً فقيهاً روى التنبيه وله شعر حسن، وانضم إليه خلق من الفقراء وهم الطائفة الرفاعية المعروفة بالأحمدية والبطائحية، وعنه قال «سلكت كل الطرق الموصلة فما رأيت أقرب ولا أسهل ولا أصلح من الافتقار والذل والانكسار»؛ وكان متواضعاً سليم الصدر مجرداً من الدنيا لم يدخر شيئاً قط وحضر عنده ليلة نصف شعبان نحو مائة ألف إنسان، وذكر سبب وفاته أنه سمع أبياتاً فتواجد تواجداً كان سبب مرضه الذي مات فيه؛ توفي في جمادى الأولى سنة ثمان وسبعين وخمسمائة ولم يعقب وإنما المشيخة في أبني أخيه {cite:shadharat-dhahab p. 739-741}."
  en: "The ascetic exemplar Ahmad ibn Ali al-Rifa'i of the Bata'ih — the marsh villages between Wasit and Basra; of Maghribi origin, b. Muharram 500, trained under his uncle the ascetic Mansur; a Shafi'i jurist and poet around whom the poor gathered — the Rifa'iyya order ('I have walked all the paths and found none nearer or more fitting than poverty, abasement and brokenness'); humble, clean-hearted, he kept nothing; about a hundred thousand attended one half-Sha'ban night with him; the verses heard in audition brought on the illness of which he died in Jumada I 578, leaving no offspring — the shaykhdom passed to his nephews {cite:shadharat-dhahab p. 739-741}."
