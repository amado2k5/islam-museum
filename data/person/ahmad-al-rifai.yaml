id: person/ahmad-al-rifai
class: person
label: { ar: "الشيخ أحمد الرفاعي", en: "Shaykh Ahmad al-Rifa'i", fr: "Cheikh Ahmad al-Rifa'i", es: "Shaykh Ahmad al-Rifa'i", ur: "شیخ احمد الرفاعی" }
names:
  - { value: "أبو العباس أحمد بن علي بن أحمد بن يحيى بن حازم بن علي بن رفاعة البطائحي", kind: full }
summary:
  ar: "الشيخ الزاهد القدوة أحمد بن علي الرفاعي البطائحي نسبة إلى البطائح قرى في وسط الماء بين واسط والبصرة؛ مغربي الأصل ولد في المحرم سنة خمسمائة وتخرج بخاله الشيخ الزاهد منصور وكان شافعياً فقيهاً روى التنبيه وله شعر حسن، وانضم إليه خلق من الفقراء وهم الطائفة الرفاعية المعروفة بالأحمدية والبطائحية، وعنه قال «سلكت كل الطرق الموصلة فما رأيت أقرب ولا أسهل ولا أصلح من الافتقار والذل والانكسار»؛ وكان متواضعاً سليم الصدر مجرداً من الدنيا لم يدخر شيئاً قط وحضر عنده ليلة نصف شعبان نحو مائة ألف إنسان، وذكر سبب وفاته أنه سمع أبياتاً فتواجد تواجداً كان سبب مرضه الذي مات فيه؛ توفي في جمادى الأولى سنة ثمان وسبعين وخمسمائة ولم يعقب وإنما المشيخة في أبني أخيه {cite:shadharat-dhahab p. 739-741}."
  en: "The ascetic exemplar Ahmad ibn Ali al-Rifa'i of the Bata'ih — the marsh villages between Wasit and Basra; of Maghribi origin, b. Muharram 500, trained under his uncle the ascetic Mansur; a Shafi'i jurist and poet around whom the poor gathered — the Rifa'iyya order ('I have walked all the paths and found none nearer or more fitting than poverty, abasement and brokenness'); humble, clean-hearted, he kept nothing; about a hundred thousand attended one half-Sha'ban night with him; the verses heard in audition brought on the illness of which he died in Jumada I 578, leaving no offspring — the shaykhdom passed to his nephews {cite:shadharat-dhahab p. 739-741}."
  fr: "Modèle d'ascétisme, Ahmad ibn Ali al-Rifa'i des Bata'ih, villages des marais entre Wasit et Bassora ; d'origine maghrébine, né en mouharram 500 H, formé par son oncle, l'ascète Mansur. Juriste chaféite et poète autour duquel les pauvres se rassemblèrent, à l'origine de la confrérie Rifa'iyya, il disait n'avoir trouvé aucune voie plus proche ni plus appropriée que la pauvreté, l'abaissement et le brisement. Humble et au cœur pur, il ne conservait rien ; environ cent mille personnes assistèrent à une nuit de mi-chaabane auprès de lui. Des vers entendus en audition provoquèrent la maladie dont il mourut en joumada I 578 H, sans descendance ; la direction passa à ses neveux {cite:shadharat-dhahab p. 739-741}."
  es: "El asceta ejemplar Ahmad ibn Ali al-Rifa'i de Bata'ih — las aldeas pantanosas entre Wasit y Basora; de origen magrebí, n. Muharram 500, formado con su tío el asceta Mansur; jurista y poeta shafi'í en torno al cual se reunían los pobres — la orden Rifa'iyya ('He recorrido todos los caminos y no he encontrado ninguno más cercano ni más apropiado que la pobreza, la humillación y la quebrantamiento'); humilde, de corazón puro, no guardaba nada; cerca de cien mil personas asistieron a una noche de medio Sha'ban con él; los versos escuchados en audición provocaron la enfermedad de la que murió en Jumada I 578, sin dejar descendencia — el shaykhdom pasó a sus sobrinos {cite:shadharat-dhahab p. 739-741}."
  ur: "بطعیہ کے سنیاسی نمونہ احمد بن علی الرفاعی - وسط اور بصرہ کے درمیان دلدلی دیہات؛ مغرب کی اصل، ب. محرم 500، اپنے چچا سنیاسی منصور کے زیر تربیت؛ ایک شافعی فقیہ اور شاعر جس کے ارد گرد غریب جمع تھے - رفاعیہ کا حکم ⁦('میں نے تمام راستے چلائے ہیں اور مجھے غربت، ذلت اور ٹوٹ پھوٹ سے زیادہ قریب یا زیادہ موزوں نہیں ملا')⁩؛ عاجز، صاف دل، اس نے کچھ نہیں رکھا۔ نصف شعبان کی رات آپ کے ساتھ تقریباً ایک لاکھ نے شرکت کی۔ شنوائی میں سنائی گئی آیات اس بیماری پر لائی گئیں جس کی وجہ سے ان کا انتقال جمادی الثانی 578 میں ہوا، اس میں کوئی اولاد نہیں تھی - شیخ نے اپنے بھتیجوں کو منتقل کیا 739-741}۔"
  tr: "Vasit ve Basra arasındaki suyun ortasında bulunan el-Bataih köylerinin adını taşıyan, çileci ve örnek Şeyh Ahmed ibn Ali el-Rifai el-Bataihi, Fas kökenliydi. Hicri 500 yılının Muharrem ayında doğdu ve dayısı, çileci Şeyh Mansur'un yanında eğitim gördü. Şafiî mezhebine mensup bir hukukçu olup, el-Tanbih rivayet etmiş ve güzel şiirler yazmıştır. Bir grup fakir insan ona katıldı ve bunlar, Ahmediye ve el-Bataihiye olarak bilinen Rifaî mezhebini oluşturdular. Onun hakkında şöyle demiştir: \"Ona giden bütün yolları izledim ve muhtaçlıktan, tevazudan ve kırılganlıktan daha yakın, daha kolay veya daha doğru bir şey görmedim.\" Mütevazı, kalbi temiz ve dünyevi şeylerden uzak bir insandı. Hiçbir şey biriktirmedi. Şaban ayının ortasındaki gece yaklaşık yüz bin kişi onun cenaze törenine katıldı. Ölümünün sebebinin, ayetler işittiğinde o kadar duygulanması ve bu duygudan dolayı hastalığa yakalanıp öldüğünü belirtmiştir. Hicri 578 yılının Cemâdeü'l-Ula ayında vefat etmiş ve soyundan kimse kalmamıştır; şeyhlik ise iki yeğenine geçmiştir. {Kaynak: Şadharat-dahab s. 739-741}"
  id: "Syekh Ahmad ibn Ali al-Rifa'i al-Bata'ihi, seorang pertapa dan teladan, yang namanya diambil dari al-Bata'ih, sebuah desa di tengah perairan antara Wasit dan Basra, berasal dari Maroko. Beliau lahir pada bulan Muharram tahun 500 Hijriah dan lulus di bawah bimbingan paman dari pihak ibunya, seorang pertapa bernama Syekh Mansur. Beliau adalah seorang ahli hukum Syafi'i yang meriwayatkan kitab al-Tanbih dan memiliki kemampuan berpuisi yang baik. Sekelompok orang miskin bergabung dengannya, dan mereka adalah sekte Rifa'i yang dikenal sebagai Ahmadiyah dan al-Bata'ihiiyah. Beliau berkata tentang dirinya, \"Aku telah mengikuti semua jalan yang menuju kepadanya, dan aku belum pernah melihat sesuatu yang lebih dekat, lebih mudah, atau lebih benar daripada kemiskinan, kerendahan hati, dan keterpurukan.\" Beliau rendah hati, berhati murni, dan tidak terikat pada hal-hal duniawi. Beliau tidak pernah menimbun apa pun. Sekitar seratus ribu orang menghadiri pemakamannya pada malam pertengahan bulan Sya'ban. Ia menyebutkan bahwa penyebab kematiannya adalah karena ia mendengar ayat-ayat suci dan menjadi sangat terharu sehingga menyebabkan penyakit yang merenggut nyawanya. Ia meninggal pada bulan Jumada al-Ula tahun 578 H dan tidak meninggalkan keturunan, tetapi kekuasaan syekh berada di tangan kedua keponakannya. {cite:shadharat-dhahab p. 739-741}."
