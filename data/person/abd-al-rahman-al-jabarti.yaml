summary:
  ar: "عبد الرحمن بن حسن الجبرتي العقيلي الزيلعي الحنفي، مؤرخ مصر وصاحب «عجائب الآثار في التراجم والأخبار» و«مظهر التقديس»، دوّن وقائع مصر وتراجم رجالها من سنة 1100هـ إلى 1236هـ، وكُفّ بصره بعد مقتل ابنه خليل سنة 1237هـ؛ واختُلف في سنة وفاته بين 1237 و1240 و1241هـ {cite:ajaib-al-athar-moreh-2013-v1 p.13} {cite:ajaib-al-athar-moreh-2013-v1 p.18} {cite:ajaib-al-athar-moreh-2013-v1 p.27}."
  en: "Abd al-Rahman ibn Hasan al-Jabarti al-Aqili al-Zayla'i al-Hanafi, historian of Egypt and author of Aja'ib al-athar and Mazhar al-taqdis, who recorded Egypt's events and biographies from 1100 to 1236 AH; he lost his sight after his son Khalil was killed in 1237 AH, and the year of his death is disputed between 1237, 1240 and 1241 AH."
