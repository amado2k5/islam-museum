id: person/ibrahim-ibn-al-walid
class: person
label: { ar: "إبراهيم بن الوليد بن عبد الملك" }
summary:
  ar: "أبو إسحاق، بويع بالخلافة بعد موت أخيه يزيد الناقص فقيل إنه عهد إليه وقيل لا، وعن برد بن سنان أن قطناً افتعل كتاباً بالعهد على لسان يزيد واستشهد عليه ناساً وما عهد يزيد شيئاً، مكث في الخلافة سبعين ليلة ثم خلع يوم الاثنين لأربع عشرة خلت من صفر سنة سبع وعشرين حين خرج عليه مروان بن محمد، قال المدائني لم يتم لإبراهيم أمر فكان قوم يسلمون عليه بالخلافة وقوم بالإمرة وأبى قوم أن يبايعوا له، وكان نقش خاتمه إبراهيم يثق بالله، وعاش إلى سنة اثنتين وثلاثين فقتل فيمن قتل من بني أمية في وقعة السفاح {cite:tarikh-khulafa-minhaj-1434 p. 410-411}."
  en: "Abu Ishaq, sworn in after his brother Yazid al-Naqis died — some say designated, others not; per Burd ibn Sinan, Qatan forged a deed of succession on Yazid's lips and had men witness it though Yazid had designated nothing. He held the caliphate seventy nights, then was deposed Monday 14 Safar 127 when Marwan ibn Muhammad marched on him; al-Mada'ini says his authority never settled — some greeted him as caliph, some as amir, some refused the bay'a. His seal read 'Ibrahim trusts in God'. He lived until 132, then was killed among the Banu Umayya in al-Saffah's massacre {cite:tarikh-khulafa-minhaj-1434 p. 410-411}."
  es: "Abu Ishaq, quien juró el cargo tras la muerte de su hermano Yazid al-Naqis —algunos dicen que fue designado, otros no—, según Burd ibn Sinan, Qatan falsificó un acta de sucesión en los labios de Yazid y presentó testigos, aunque Yazid no había designado nada. Ostentó el califato durante setenta noches, hasta que fue depuesto el lunes 14 de Safar de 127, cuando Marwan ibn Muhammad marchó contra él. Al-Mada'ini afirma que su autoridad nunca se consolidó: algunos lo saludaban como califa, otros como emir, y otros rechazaban la bay'a (juramento de lealtad). Su sello decía: «Ibrahim confía en Dios». Vivió hasta 132, año en que fue asesinado entre los Banu Umayya en la masacre de al-Saffah {cite:tarikh-khulafa-minhaj-1434 p. 410-411}."
  fr: "Abou Ishaq, intronisé après la mort de son frère Yazid al-Naqis – certains disent désigné, d'autres non –, selon Burd ibn Sinan, Qatan aurait forgé un acte de succession sur les lèvres de Yazid et l'aurait fait témoigner, bien que Yazid n'eût rien désigné. Il exerça le califat pendant soixante-dix nuits, puis fut déposé le lundi 14 Safar 127 lorsque Marwan ibn Muhammad marcha contre lui. Al-Mada'ini rapporte que son autorité ne s'est jamais consolidée: certains le saluèrent comme calife, d'autres comme émir, d'autres encore refusèrent de prêter allégeance. Son sceau portait l'inscription « Ibrahim a confiance en Dieu ». Il vécut jusqu'en 132, puis fut tué parmi les Banu Umayya lors du massacre d'al-Saffah (voir: Tarikh-Khulafa-Minhaj-1434, p. 410-411)."
  ur: "ابو اسحاق، اپنے بھائی یزید النقیس کی موت کے بعد حلف اٹھایا - کچھ کہتے ہیں کہ نامزد کیا گیا، دوسروں نے نہیں؛ برد ابن سنان کے مطابق، قطان نے یزید کے ہونٹوں پر جانشینی کا ایک نامہ تیار کیا اور لوگوں کو اس کا گواہ بنایا حالانکہ یزید نے کچھ بھی نہیں بتایا تھا۔ وہ ستر راتوں تک خلافت پر فائز رہے، پھر 14 صفر 127 بروز سوموار کو معزول کر دیا گیا جب مروان بن محمد نے اس پر چڑھائی کی۔ المدینی کہتے ہیں کہ اس کا اختیار کبھی طے نہیں ہوا - کچھ نے انہیں خلیفہ، کسی نے امیر، کچھ نے بیعت سے انکار کیا۔ اس کی مہر پر لکھا تھا 'ابراہیم خدا پر بھروسہ رکھتے ہیں'۔ وہ 132 تک زندہ رہا، پھر بنو امیہ کے درمیان الصفح کے قتل عام میں مارا گیا۔ 410-411}۔"
  tr: "Kardeşi Yezid el-Neqsir'in ölümünden sonra Ebu İshak halifeliğe bağlılık yemini etti, bazıları ona emanet edildiğini söyledi, bazıları ise emanet edilmediğini söyledi. Bard ibn Sinan'a göre, Qatna Yezid adına bir antlaşma kitabı uydurdu ve ona karşı insanları gösterdi, Yazid ise hiçbir şey bilmiyordu. Halifelikte yetmiş gece kaldı, ardından Sefer'den önceki on dördüncü Pazartesi günü tahttan indirildi; Mervan bin Muhammed ona karşı isyan etti. El-Medeynî şöyle dedi: İbrahim'e halifelik verilmedi, bazıları halifeliği kabul etti, bazıları liderliği kabul etti, bazıları ise ona bağlılık yemini etmeyi reddetti. Mühründeki yazıda İbrahim Allah'a güveniyordu ve otuz iki yılına kadar yaşadı; o yıl El-Safah Savaşı'nda Emevi üyeleri arasında öldürüldü {alıntı::Tarih-Khulafa-minhaj-1434, s. 410-411}."
  id: "Abu Ishaq bersumpah setia kepada kekhalifahan setelah kematian saudaranya Yazid al-Naqsir, meskipun beberapa mengatakan ia dipercayakan untuknya, yang lain tidak. Menurut Bard ibn Sinan, Qatna membuat kitab perjanjian atas nama Yazid dan mengutip orang-orang menentangnya, dan Yazid tidak mengetahui apa-apa. Ia tinggal di kekhalifahan selama tujuh puluh malam, kemudian digulingkan pada hari Senin, tanggal empat belas sebelum Safar, ketika Marwan ibn Muhammad memberontak melawannya. Al-Mada'ini berkata: Ibrahim tidak diberikan kekhalifahan, beberapa menerima kekhalifahan, beberapa menerima kepemimpinan, dan beberapa menolak bersumpah setia kepadanya. Tulisan pada segelnya adalah Ibrahim percaya pada Tuhan, dan ia hidup hingga tahun tiga puluh dua ketika ia tewas di antara orang-orang Umayyah dalam Pertempuran Al-Saffah {cite:History-Khulafa-minhaj-1434, hlm. 410-411}."
