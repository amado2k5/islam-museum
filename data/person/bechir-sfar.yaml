summary:
  ar: "مصلح وقائد وطني تونسي (1856–1917)؛ تخرج في أول دفعة من المدرسة الصادقية ودرس في باريس، ورأس مجلس الحبوس واستقال منه سنة 1898 احتجاجًا على بيع الأوقاف للمستعمرين، وأسس جمعية الخلدونية وجريدة «الحاضرة» (1888)، وشارك علي باش حانبة تأسيس حركة الشباب التونسي سنة 1907، ولُقّب بأبي النهضة التونسية."
  en: "Tunisian reformer and nationalist leader (1856–1917). In the first graduating class of Sadiki College, he studied in Paris, headed the Habous Council and resigned from it in 1898 in protest at the sale of endowment land to French colonists, founded the Khaldounia association and the newspaper El Hadhira (1888), and co-founded the Young Tunisians with Ali Bach Hamba in 1907; he was called a father of the Tunisian renaissance."
  ur: "تونسی مصلح اور قوم پرست رہنما (1856–1917)؛ مدرسہ صادقیہ کی پہلی فارغ التحصیل جماعت میں شامل تھے، پیرس میں پڑھا، مجلس حبوس کی صدارت کی اور 1898 میں اوقاف کی زمین فرانسیسی آباد کاروں کو فروخت کے احتجاج میں مستعفی ہوئے، خلدونیہ انجمن اور اخبار «الحاضرہ» (1888) قائم کیا، اور 1907 میں علی باش حانبہ کے ساتھ نوجوان تونسی تحریک کی بنیاد رکھی؛ انھیں تونسی نہضت کا بانی کہا جاتا ہے۔"
