summary:
  ar: "المولى برهان الدين إبراهيم الحسيب النسيب؛ كان والده من سادات العجم رحل إلى الروم وتوطن قرية من قرى أماسية، وكان من أكابر الأولياء له كرامات وخوارق؛ ونشأ الولد المذكور في حجره بعفة وصيانة ورحل في طلب العلم إلى بروسا فقرأ على الشيخ سنان الدين ثم اتصل بخدمة المولى حسن الساموني ثم رغب في خدمة المولى خواجه زاده، ثم ولي التدريس حتى صار مدرساً بمدرسة السلطان بايزيد بمائة عثماني على وجه التقاعد، ولما جلس السلطان سليم على سرير الملك اشترى له داراً في جوار أبي أيوب الأنصاري وهي الآن وقف وقفها على من يكون مدرساً بمدرسة أبي أيوب، وكان مجرداً لم يتزوج في عمره بعد أن أبرم عليه والده في التزوج، منقطعاً عن الناس للعلم والعبادة زاهداً ورعاً يستوي عنده الذهب والمدر، وكفّ في آخر عمره ثم عولج فأبصر ببعض بصره؛ توفي سنة خمس وثلاثين وتسعمائة ودُفن عند جامع أبي أيوب الأنصاري {cite:shadharat-dhahab p. 594-595}."
  en: "The celibate mystic of Abu Ayyub — his father a sayyid of the 'Ajam and himself 'among the greatest saints'; he studied at Bursa under Sinan al-Din, served Hasan al-Samuni then Khwaja-zada, taught at Sultan Bayezid's madrasa on a hundred uthmani, and Selim bought him the house beside Abu Ayyub's tomb which he endowed to whoever teaches at its madrasa; never married, indifferent to gold or clay; d. 935, buried at the Abu Ayyub mosque {cite:shadharat-dhahab p. 594-595}."
