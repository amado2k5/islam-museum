summary:
  ar: "المولى برهان الدين إبراهيم الحسيب النسيب؛ كان والده من سادات العجم رحل إلى الروم وتوطن قرية من قرى أماسية، وكان من أكابر الأولياء له كرامات وخوارق؛ ونشأ الولد المذكور في حجره بعفة وصيانة ورحل في طلب العلم إلى بروسا فقرأ على الشيخ سنان الدين ثم اتصل بخدمة المولى حسن الساموني ثم رغب في خدمة المولى خواجه زاده، ثم ولي التدريس حتى صار مدرساً بمدرسة السلطان بايزيد بمائة عثماني على وجه التقاعد، ولما جلس السلطان سليم على سرير الملك اشترى له داراً في جوار أبي أيوب الأنصاري وهي الآن وقف وقفها على من يكون مدرساً بمدرسة أبي أيوب، وكان مجرداً لم يتزوج في عمره بعد أن أبرم عليه والده في التزوج، منقطعاً عن الناس للعلم والعبادة زاهداً ورعاً يستوي عنده الذهب والمدر، وكفّ في آخر عمره ثم عولج فأبصر ببعض بصره؛ توفي سنة خمس وثلاثين وتسعمائة ودُفن عند جامع أبي أيوب الأنصاري {cite:shadharat-dhahab p. 594-595}."
  en: "The celibate mystic of Abu Ayyub — his father a sayyid of the 'Ajam and himself 'among the greatest saints'; he studied at Bursa under Sinan al-Din, served Hasan al-Samuni then Khwaja-zada, taught at Sultan Bayezid's madrasa on a hundred uthmani, and Selim bought him the house beside Abu Ayyub's tomb which he endowed to whoever teaches at its madrasa; never married, indifferent to gold or clay; d. 935, buried at the Abu Ayyub mosque {cite:shadharat-dhahab p. 594-595}."
  es: "El místico célibe de Abu Ayyub —su padre era un sayyid del 'Ajam y él mismo 'entre los más grandes santos'—; estudió en Bursa con Sinan al-Din, sirvió a Hasan al-Samuni y luego a Khwaja-zada, enseñó en la madrasa del sultán Bayezid durante cien uthmani, y Selim le compró la casa junto a la tumba de Abu Ayyub, la cual dotó a quien enseñara en su madrasa; nunca se casó, indiferente al oro o a la arcilla; murió en 935, enterrado en la mezquita de Abu Ayyub {cite:shadharat-dhahab p. 594-595}."
  fr: "Le mystique célibataire d'Abu Ayyub — son père était un sayyid de l'Ajam et lui-même « parmi les plus grands saints »; il étudia à Bursa sous Sinan al-Din, servit Hasan al-Samuni puis Khwaja-zada, enseigna à la madrasa du sultan Bayezid avec une rente de cent uthmani, et Selim lui acheta la maison à côté du tombeau d'Abu Ayyub qu'il légua à quiconque enseignerait dans sa madrasa; jamais marié, indifférent à l'or ou à l'argile; mort en 935, enterré à la mosquée d'Abu Ayyub {cite: shadharat-dhahab p. 594-595}."
  ur: "ابو ایوب کے برہمی صوفیانہ - اس کے والد 'عجم کے سید اور خود' سب سے بڑے اولیاء میں سے'؛ اس نے سنان الدین کے ماتحت برسا میں تعلیم حاصل کی، حسن السمونی پھر خواجہ زادہ کی خدمت کی، سلطان بایزید کے مدرسے میں سو عثمانی میں پڑھایا، اور سیلم نے اسے ابو ایوب کے مقبرے کے پاس مکان خریدا جو اس نے اس کے مدرسے میں پڑھانے والے کو عطا کیا۔ کبھی شادی نہیں کی، سونے یا مٹی سے لاتعلق؛ d 935، مسجد ابو ایوب میں مدفون 594-595}۔"
  tr: "Moulay Burhan al-Din İbrahim el-Haseeb el-Naseeb; babası Perslerin Seyyidlerinden biriydi. Romalılara seyahat etti ve Amasiya köyleri arasında bir köyde yerleşti. Mucizeleri ve mucizeleriyle tanınan en büyük azizler arasındaydı. Bahsi geçen oğul, onun kucağında iffet ve özenle büyüdü, bilgi peşinde Prusya'ya giderek Şeyh Sinan al-Din'in yanında eğitim aldı, ardından Moulay Hassan al-Samouni'nin hizmetine katıldı ve Moulay Khwaja Zadeh'e hizmet etmek istedi. Daha sonra öğretmenliğe başladı ve emekli olduktan sonra yüz Osmanlılı ile birlikte Sultan Bayezid'in okulunda öğretmen oldu. Sultan Selim oturduğunda Kralın yatağında, ona Abu Ayyub al-Ansari'nin yanına bir ev aldı; bu ev şimdi Abu Eyyub'un okulunda öğretmen olacak biri tarafından bağışlanıyor. Bekardı ve babası onunla evlenmeyi kabul ettikten sonra evlenmemişti, bilgi ve ibadet için insanlardan kopuk, münzevi ve dindar, altın ve gümüş kadar eşitti. Hayatının son yıllarında öldü, tedavi gördü ve bir kısmını kaybetti; 935 Hicri yılında öldü ve Ebu Eyyub el-Ensari Camii yakınında defnedildi {kaynak:şadharat-dhahab, s. 594-595}."
  id: "Moulay Burhan al-Din Ibrahim al-Haseeb al-Naseeb; ayahnya adalah salah satu Sayyid Persia. Ia pergi ke Romawi dan menetap di sebuah desa di antara desa Amasiya. Ia termasuk di antara para wali terbesar, dikenal karena mukjizat dan mukjizatnya. Putra yang disebutkan tumbuh di pangkuannya dengan kesucian dan perhatian, pergi ke Prusia untuk mencari ilmu, di mana ia belajar di bawah Sheikh Sinan al-Din, kemudian bergabung dengan pelayanan Moulay Hassan al-Samouni, dan kemudian ingin melayani Moulay Khwaja Zadeh. Ia kemudian mulai mengajar hingga menjadi guru di sekolah Sultan Bayezid bersama seratus Ottoman setelah pensiun. Ketika Sultan Selim duduk Di atas ranjang raja, ia membelikannya sebuah rumah di sebelah Abu Ayyub al-Ansari, yang kini dianugerahi oleh seseorang yang kemudian menjadi guru di sekolah Abu Ayyub. Ia masih lajang dan belum menikah pada usianya setelah ayahnya setuju menikahinya, terpisah dari orang lain demi pengetahuan dan ibadah, pertapa dan saleh, setara dengan emas dan perak. Ia meninggal di tahun-tahun akhir hidupnya, lalu menjalani perawatan dan kehilangan sebagian penglihatannya; ia meninggal pada tahun 935 H dan dimakamkan di dekat Masjid Abu Ayyub al-Ansari {cite:shadharat-dhahab, hlm. 594-595}."
