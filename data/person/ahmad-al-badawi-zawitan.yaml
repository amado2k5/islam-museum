roles: [sufi, scholar]
gender: male
summary:
  ar: "أحمد البدوي بن أحمد زويتن الدرقاوي، أبو العباس، متصوف مغربي من أهل فاس، ترك حانوته في سوق العطارين وانقطع إلى العلم، وله «الرسائل الكبرى»، توفي سنة 1275 هـ الموافقة 1859 م."
  en: "Ahmad al-Badawi ibn Ahmad Zawitan al-Darqawi, Abu al-Abbas, a Moroccan Sufi of Fez who left his shop in the spice-sellers' market for learning; author of al-Rasa'il al-Kubra; died in 1275 AH (1859 CE)."
  fr: "Ahmad al-Badawi ibn Ahmad Zawitan al-Darqawi, Abu al-Abbas, soufi marocain de Fès qui quitta sa boutique du marché des épiciers pour le savoir ; auteur d'al-Rasa'il al-Kubra ; mort en 1275 H (1859 ap. J.-C.)."
  es: "Ahmad al-Badawi ibn Ahmad Zawitan al-Darqawi, Abu al-Abbas, un sufí marroquí de Fez que dejó su tienda en el mercado de especias para dedicarse al estudio; autor de al-Rasa'il al-Kubra; murió en 1275 AH (1859 d. C.)."
  ur: "احمد البداوی ابن احمد زویتن الدارقاوی، ابو العباس، فیز کا ایک مراکش صوفی جس نے اپنی دکان مصالحہ فروشوں کے بازار میں سیکھنے کے لیے چھوڑی تھی۔ الرسائل الکبری کے مصنف؛ 1275ھ ⁦(1859ء)⁩ میں وفات پائی۔"
  tr: "Fas'ın Fez şehrinden bir sufi olan Ahmed el-Badavi ibn Ahmed Zuveytin el-Darqavi, Ebu el-Abbas, parfümcüler pazarındaki dükkanını bırakıp kendini ilime adadı. \"Büyük Mektuplar\" adlı eseri bulunmaktadır. Hicri 1275 yılında, yani milattan sonra 1859 yılında vefat etmiştir."
  id: "Ahmad al-Badawi ibn Ahmad Zuwaytin al-Darqawi, Abu al-Abbas, seorang Sufi Maroko dari Fez, meninggalkan tokonya di pasar parfum dan mengabdikan dirinya pada ilmu pengetahuan. Ia memiliki karya tulis \"Surat-Surat Agung\". Ia meninggal pada tahun 1275 Hijriah, yang bertepatan dengan tahun 1859 Masehi."
