summary:
  ar: طواف بن غلاق، من زعماء الخارجين بالبصرة كما يصفه الزركلي، خرج على عبيد الله بن زياد في سبعين رجلاً من بني عبد القيس، فظفر بمن وُجه إليه ودخل البصرة، ثم قاتله أهلها مع الجند فقتل أكثر من معه، ثم قُتل وصُلب {cite:alam-zirikli-1927-v2 p. 52}.
  en: 'Tawwaf ibn Ghallaq, one of the leaders of the rebels (khawarij) in Basra as al-Zirikli describes him: he rose against Ubayd Allah ibn Ziyad with seventy men of Abd al-Qays, defeated the force sent against him and entered Basra, then its people and the troops fought him, most of his men were killed, and he was killed and crucified.'
  ur: طواف بن غلاق، زرکلی کے بیان کے مطابق بصرہ میں خروج کرنے والوں ⁦(خوارج)⁩ کے سرداروں میں سے؛ انہوں نے عبد القیس کے ستر آدمیوں کے ساتھ عبید اللہ بن زیاد کے خلاف خروج کیا، اپنے مقابل بھیجی گئی فوج پر غالب آئے اور بصرہ میں داخل ہوئے، پھر اہلِ بصرہ نے لشکر کے ساتھ ان سے جنگ کی، ان کے اکثر ساتھی مارے گئے، اور وہ قتل کر کے سولی پر چڑھائے گئے۔
  es: "Tawwaf ibn Ghallaq, uno de los líderes de los rebeldes (khawarij) en Basora, según lo describe al-Zirikli: se alzó contra Ubayd Allah ibn Ziyad con setenta hombres de Abd al-Qays, derrotó a las fuerzas enviadas contra él y entró en Basora, donde sus habitantes y las tropas lucharon contra él, la mayoría de sus hombres murieron, y él mismo fue asesinado y crucificado."
  fr: "Tawwaf ibn Ghallaq, l'un des chefs des rebelles (khawarij) à Bassora, tel que décrit par al-Zirikli: il se souleva contre Ubayd Allah ibn Ziyad avec soixante-dix hommes d'Abd al-Qays, vainquit la force envoyée contre lui et entra à Bassora, puis ses habitants et ses troupes le combattirent, la plupart de ses hommes furent tués, et il fut tué et crucifié."
  tr: "Zarikli'nin anlattığı gibi, Basra'ya gidenlerin liderlerinden biri olan Tevaf bin Ghalaq, Banu Abdül-Kays'tan yetmiş adamla Ubeydullah ibn Ziyad'a karşı çıktı, kendisine gönderilenleri yendi ve Basra'ya girdi. Sonra halkı askerlerle birlikte onunla savaştı, birçok adamını öldürdü, ardından onu öldürüp çarmıha gerdi {cite:alam-zirikli-1927-v2, s. 52}."
  id: "Tawaf ibn Ghalaq, salah satu pemimpin mereka yang pergi ke Basra seperti yang dijelaskan oleh al-Zarikli, pergi melawan Ubayd Allah ibn Ziyad bersama tujuh puluh orang dari Banu Abd al-Qays, mengalahkan mereka yang dikirim kepadanya, dan masuk ke Basra. Kemudian kaumnya bertempur dengannya bersama para prajurit, membunuh banyak anak buahnya, lalu membunuh dan menyalibkannya {cite:alam-zirikli-1927-v2, hlm. 52}."
