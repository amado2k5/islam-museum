summary:
  ar: طواف بن غلاق، من زعماء الخارجين بالبصرة كما يصفه الزركلي، خرج على عبيد الله بن زياد في سبعين رجلاً من بني عبد القيس، فظفر بمن وُجه إليه ودخل البصرة، ثم قاتله أهلها مع الجند فقتل أكثر من معه، ثم قُتل وصُلب {cite:alam-zirikli-1927-v2 p. 52}.
  en: 'Tawwaf ibn Ghallaq, one of the leaders of the rebels (khawarij) in Basra as al-Zirikli describes him: he rose against Ubayd Allah ibn Ziyad with seventy men of Abd al-Qays, defeated the force sent against him and entered Basra, then its people and the troops fought him, most of his men were killed, and he was killed and crucified.'
  ur: طواف بن غلاق، زرکلی کے بیان کے مطابق بصرہ میں خروج کرنے والوں (خوارج) کے سرداروں میں سے؛ انہوں نے عبد القیس کے ستر آدمیوں کے ساتھ عبید اللہ بن زیاد کے خلاف خروج کیا، اپنے مقابل بھیجی گئی فوج پر غالب آئے اور بصرہ میں داخل ہوئے، پھر اہلِ بصرہ نے لشکر کے ساتھ ان سے جنگ کی، ان کے اکثر ساتھی مارے گئے، اور وہ قتل کر کے سولی پر چڑھائے گئے۔
