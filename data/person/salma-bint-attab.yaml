summary:
  ar: "شاعرة من بني تميم قالت بيتين يوم غزوة عيينة بن حصن بني العنبر ترثي فيهما ما لقيت عدي بن جندب من الشر وتكنّف الأعداء لهم وغياب عزهم وجدودهم؛ لا يُعرف من خبرها عند ابن إسحاق غير ذلك."
  en: "A woman poet of Tamim who spoke two verses on the day of Uyayna ibn Hisn's raid on Banu al-Anbar, lamenting the evil that befell Adi ibn Jundab, the enemies closing in from every side and the absence of their might and fortune; nothing else of her is known from Ibn Ishaq."
  es: "Una poetisa de Tamim que recitó dos versos el día del ataque de Uyayna ibn Hisn contra Banu al-Anbar, lamentando la desgracia que le sobrevino a Adi ibn Jundab, los enemigos que se acercaban por todos lados y la ausencia de su poderío y fortuna; no se sabe nada más de ella por medio de Ibn Ishaq."
  fr: "Une poétesse de Tamim qui a récité deux vers le jour du raid d'Uyayna ibn Hisn sur Banu al-Anbar, déplorant le malheur qui s'abattait sur Adi ibn Jundab, les ennemis se rapprochant de toutes parts et l'absence de leur puissance et de leur fortune; on ne sait rien d'autre à son sujet grâce à Ibn Ishaq."
  ur: "تمیم کی ایک خاتون شاعرہ جس نے بنو الانبار پر عیینہ بن حسن کے چھاپے کے دن دو آیتیں کہی تھیں، عدی بن جندب پر پڑنے والی برائی، ہر طرف سے دشمنوں کے بند ہونے اور ان کی طاقت اور خوش قسمتی کی عدم موجودگی پر افسوس کا اظہار کیا تھا۔ ابن اسحاق سے اس کے علاوہ کچھ معلوم نہیں ہے۔"
  tr: "Banu Tamim'den bir şair, Uyaynah ibn Hisn Banu Al-Anbar Savaşı gününde iki dize okudu; bu dizelerde Adi ibn Jundub'un karşılaştığı kötülükleri, düşman zarfını ve onların onuru ile atalarının yokluğunu ağıtladı; İbn İshaq'a göre anlatımından başka hiçbir şey bilinmemektedir."
  id: "Seorang penyair wanita dari Banu Tamim membacakan dua bait pada hari Pertempuran Uyaynah ibn Hisn Banu Al-Anbar, di mana ia meratapi kejahatan yang dihadapinya dari Adi ibn Jundub, amplop musuh, dan hilangnya kehormatan serta leluhur mereka; tidak ada yang diketahui dari kisahnya menurut Ibn Ishaq."
