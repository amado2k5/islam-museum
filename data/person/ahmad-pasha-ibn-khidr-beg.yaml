summary:
  ar: "أحمد باشا بن خضر بك؛ قرأ على الشيخ محمد بن عبد الكريم بن غرسان ثم على الأمير التوسي والمولى سنان الدين والمولى محيي الدين القرشي، ونظر في كتب معتبرة وصارت له ملكة في الفقه والعلوم الحكيمة والنظرية ودرّس بمدارس بروسا وتدرج في التدريس، وتولى إفتاء بروسا حتى صار يعرف في العصر بالمولى أحمد باشا — وكان من عادته الحضور للدروس كل يوم عصراً — وتولى القضاء في عدة مواضع ببروسا وغيرها، وحكى جدي أنه كان رجلاً واسعاً مثالاً يقصده الفقراء والناس لما فيه من الحلم والعطية وحسن الإجابة، وأنشأ عدة أوقاف وفوائد؛ توفي في سنة ثلاث وثلاثين وتسعمائة {cite:shadharat-dhahab p. 578}."
  en: "Khidr Beg's son — 'my grandfather recounted he was a man people and the poor sought out for his forbearance, generosity and warm response'; climbed Bursa's madrasas to become its mufti, known in his day simply as 'Molla Ahmad Pasha', and endowed several awqaf; d. 933 {cite:shadharat-dhahab p. 578}."
  es: "Hijo de Khidr Beg —'mi abuelo contaba que era un hombre al que la gente y los pobres buscaban por su paciencia, generosidad y cálida respuesta'; ascendió en las madrasas de Bursa hasta convertirse en su muftí, conocido en su época simplemente como 'Molla Ahmad Pasha', y dotó a varias awqaf; murió en 933 {cita: shadharat-dhahab p. 578}."
  fr: "Le fils de Khidr Beg — « mon grand-père racontait qu'il était un homme que les gens et les pauvres recherchaient pour sa patience, sa générosité et sa réponse chaleureuse »; gravit les échelons des madrasas de Bursa pour devenir son mufti, connu à son époque simplement sous le nom de « Molla Ahmad Pacha », et dota plusieurs awqaf; d. 933 {cite:shadharat-dhahab p. 578}."
  ur: "خضر بیگ کا بیٹا - 'میرے دادا نے بتایا کہ وہ ایک آدمی تھے اور غریب لوگ ان کی تحمل، سخاوت اور گرمجوشی سے جواب طلب کرتے تھے'؛ برسا کے مدرسوں پر چڑھ کر اس کا مفتی بن گیا، جو اپنے زمانے میں صرف 'مولا احمد پاشا' کے نام سے جانا جاتا تھا، اور کئی اوقاف عطا کیے؛ d 933 {حوالہ: شدارت ذہاب صفحہ 578}۔"
  tr: "Ahmed Paşa ibn Hızır Bek; Şeyh Muhammed ibn Abdülkerim ibn Garsan'ın yanında, daha sonra Prens el-Tusi, Mevla Sinan el-Din ve Mevla Muhi el-Din el-Kureşi'nin yanında eğitim gördü. İktisat kitaplarını inceleyerek fıkıh, felsefe ve kuram bilimlerinde yetkinlik kazandı. Bursa okullarında öğretmenlik yaptı ve öğretim alanında ilerledi. Bursa müftüsü olarak görev yaptıktan sonra, o dönemde Mevla Ahmed Paşa olarak tanındı. Her öğleden sonra derslere katılmak onun adetiydi. Bursa'da ve başka yerlerde çeşitli yerlerde kadılık yaptı. Dedem, onun cömert ve örnek bir insan olduğunu, yoksulların ve halkın sabrı, cömertliği ve iyi cevapları nedeniyle kendisine başvurduğunu anlatırdı. Birçok vakıf ve hayır kurumu kurdu. 933 yılında vefat etti. {kaynak: Şadharat-dhahab s. 578}"
  id: "Ahmad Pasha ibn Khidr Bek; beliau belajar di bawah bimbingan Syekh Muhammad ibn Abd al-Karim ibn Gharsan, kemudian di bawah bimbingan Pangeran al-Tusi, Mawla Sinan al-Din, dan Mawla Muhi al-Din al-Qurashi. Beliau mempelajari kitab-kitab yang berwibawa dan memperoleh keahlian dalam ilmu hukum, filsafat, dan teori. Beliau mengajar di sekolah-sekolah Bursa dan terus berkembang dalam bidang pengajaran. Beliau menjabat sebagai Mufti Bursa hingga dikenal di era tersebut sebagai Mawla Ahmad Pasha. Beliau biasa mengikuti pelajaran setiap sore. Beliau juga menjabat sebagai hakim di beberapa tempat di Bursa dan tempat lain. Kakek saya menceritakan bahwa beliau adalah seorang yang dermawan dan teladan yang dicari oleh kaum miskin dan masyarakat karena kesabaran, kemurahan hati, dan jawaban-jawabannya yang baik. Beliau mendirikan beberapa wakaf dan lembaga amal. Beliau wafat pada tahun 933. {cite:shadharat-dhahab p. 578}"
