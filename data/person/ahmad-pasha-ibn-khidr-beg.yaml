summary:
  ar: "أحمد باشا بن خضر بك؛ قرأ على الشيخ محمد بن عبد الكريم بن غرسان ثم على الأمير التوسي والمولى سنان الدين والمولى محيي الدين القرشي، ونظر في كتب معتبرة وصارت له ملكة في الفقه والعلوم الحكيمة والنظرية ودرّس بمدارس بروسا وتدرج في التدريس، وتولى إفتاء بروسا حتى صار يعرف في العصر بالمولى أحمد باشا — وكان من عادته الحضور للدروس كل يوم عصراً — وتولى القضاء في عدة مواضع ببروسا وغيرها، وحكى جدي أنه كان رجلاً واسعاً مثالاً يقصده الفقراء والناس لما فيه من الحلم والعطية وحسن الإجابة، وأنشأ عدة أوقاف وفوائد؛ توفي في سنة ثلاث وثلاثين وتسعمائة {cite:shadharat-dhahab p. 578}."
  en: "Khidr Beg's son — 'my grandfather recounted he was a man people and the poor sought out for his forbearance, generosity and warm response'; climbed Bursa's madrasas to become its mufti, known in his day simply as 'Molla Ahmad Pasha', and endowed several awqaf; d. 933 {cite:shadharat-dhahab p. 578}."
