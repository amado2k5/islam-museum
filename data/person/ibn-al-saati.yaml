summary:
  ar: "ابن الساعاتي الشاعر المفلق بهاء الدين علي بن محمد بن رستم؛ قال ابن خلكان له ديوان شعر يدخل في مجلدين أجاد فيه كل الإجادة، وآخر لطيف سماه مقطعات النيل، منه قوله في التقسيم البديع: «والطل في سلك الغصون كلؤلؤ رطب يصافحه النسيم فيسقط * والطير يقرأ والغدير صحيفة والريح يكتب والغرام ينقط»؛ أخبره ولده بالقاهرة أن أباه توفي يوم الخميس الثالث والعشرين من رمضان سنة أربع وستمائة بالقاهرة ودفن بسفح المقطم وعمره إحدى وخمسون سنة وستة أشهر واثنا عشر يوماً {cite:shadharat-dhahab p. 21-22}."
  en: "Ibn al-Sa'ati the exquisite poet, Baha' al-Din Ali b. Muhammad b. Rustam; Ibn Khallikan gives him a two-volume diwan of utter mastery and a slighter one, Maqta'at al-Nil — his 'dew in the twig-thread like moist pearls the breeze shakes down; the birds recite, the pond is a page, the wind writes and longing dots' — his son told Ibn al-Imad at Cairo that his father died Thursday 23 Ramadan 604, buried at the Muqattam's foot aged fifty-one years, six months and twelve days {cite:shadharat-dhahab p. 21-22}."
