id: person/ibn-al-saati
class: person
label: { ar: "ابن الساعاتي" }
names:
  - { value: "بهاء الدين علي بن محمد بن رستم ابن الساعاتي الشاعر المفلق صاحب ديوان الشعر", kind: full }
summary:
  ar: "ابن الساعاتي الشاعر المفلق بهاء الدين علي بن محمد بن رستم؛ قال ابن خلكان له ديوان شعر يدخل في مجلدين أجاد فيه كل الإجادة، وآخر لطيف سماه مقطعات النيل، منه قوله في التقسيم البديع: «والطل في سلك الغصون كلؤلؤ رطب يصافحه النسيم فيسقط * والطير يقرأ والغدير صحيفة والريح يكتب والغرام ينقط»؛ أخبره ولده بالقاهرة أن أباه توفي يوم الخميس الثالث والعشرين من رمضان سنة أربع وستمائة بالقاهرة ودفن بسفح المقطم وعمره إحدى وخمسون سنة وستة أشهر واثنا عشر يوماً {cite:shadharat-dhahab p. 21-22}."
  en: "Ibn al-Sa'ati the exquisite poet, Baha' al-Din Ali b. Muhammad b. Rustam; Ibn Khallikan gives him a two-volume diwan of utter mastery and a slighter one, Maqta'at al-Nil — his 'dew in the twig-thread like moist pearls the breeze shakes down; the birds recite, the pond is a page, the wind writes and longing dots' — his son told Ibn al-Imad at Cairo that his father died Thursday 23 Ramadan 604, buried at the Muqattam's foot aged fifty-one years, six months and twelve days {cite:shadharat-dhahab p. 21-22}."
  es: "Ibn al-Sa'ati, el exquisito poeta, Baha' al-Din Ali b. Muhammad b. Rustam; Ibn Khallikan le dedica un diwan de dos volúmenes de absoluta maestría y otro más breve, Maqta'at al-Nil —su 'rocío en el hilo de la ramita como perlas húmedas que la brisa sacude; los pájaros recitan, el estanque es una página, el viento escribe y puntos de anhelo'— su hijo le dijo a Ibn al-Imad en El Cairo que su padre murió el jueves 23 de Ramadán de 604, enterrado al pie del Muqattam a la edad de cincuenta y un años, seis meses y doce días {cite:shadharat-dhahab p. 21-22}."
  fr: "Ibn al-Sa'ati, le poète exquis, Baha' al-Din Ali b. Muhammad b. Rustam; Ibn Khallikan lui attribue un diwan en deux volumes d'une maîtrise absolue et un autre plus court, Maqta'at al-Nil — son « rosée dans le fil de brindille comme des perles humides que la brise secoue; les oiseaux récitent, l'étang est une page, le vent écrit et des points de désir » — son fils a dit à Ibn al-Imad au Caire que son père est mort le jeudi 23 Ramadan 604, enterré au pied du Muqattam à l'âge de cinquante et un ans, six mois et douze jours {cite: shadharat-dhahab p. 21-22}."
  ur: "ابن الساطی، نفیس شاعر، بہاء الدین علی ابن۔ محمد بی رستم; ابن خلیقان نے اسے مکمل مہارت کا دو جلدوں کا دیوان دیا ہے، مقطعۃ النیل - اس کی 'ٹہنی کے دھاگے میں شبنم جیسے نم موتی ہوا کے جھونکے سے ہلتے ہیں۔ پرندے تلاوت کرتے ہیں، تالاب ایک صفحہ ہے، ہوا لکھتی ہے اور نقطوں کی آرزو کرتی ہے\"- اس کے بیٹے نے ابن العماد کو قاہرہ میں بتایا کہ ان کے والد کا انتقال جمعرات 23 رمضان 604 کو ہوا، وہ 51 سال، چھ ماہ اور بارہ دن کی عمر میں مقاتم کے قدموں میں دفن ہوئے۔ 21-22}۔"
  tr: "Seçkin şair Baha'eddin Ali ibn Muhammed ibn Rustam, İbn Hallikan'ın iki ciltlik bir şiir koleksiyonu olduğunu ve bu şiirde mükemmel olduğunu ve başka ince bir şiir koleksiyonunu Nil Bölümleri olarak adlandırdığını söylemiştir. Zarif bölümdeki sözleri arasında şunlar vardır: \"Dalların dalındaki çiy, ıslak inciler gibidir, rüzgar ve yağmurla sallanır, kuşlar över, Ghadir bir yapraktır, rüzgar yazıyor ve aşk damlıyor\"; oğlu Kahire'de babasının Ramazan ayının yirmi üçüncü Perşembe günü, 604 Hicri yılında, Kahire'de öldüğünü ve Mokattam'ın eteğinde elli bir yıl, altı ay ve on iki gün yaşında gömüldüğünü söylemiştir {atıf: shadharat-dhahab, s. 21-22}."
  id: "Ibn al-Sa'ati, penyair ternama Baha' al-Din Ali ibn Muhammad ibn Rustam, mengatakan bahwa Ibn Khallikan memiliki kumpulan puisi dalam dua volume yang sangat unggul, dan satu lagi yang halus ia sebut Bagian Nil. Di antara kata-katanya dalam pembagian yang indah adalah: \"Dan embun di cabang cabang seperti mutiara basah, digoyangkan angin dan jatuh, dan burung-burung bernyanyi, Ghadir adalah lembaran, angin menulis, dan cinta menetes\"; putranya memberitahunya di Kairo bahwa ayahnya meninggal pada hari Kamis, dua puluh tiga Ramadan, tahun 604 H, di Kairo dan dimakamkan di kaki Mokattam pada usia lima puluh satu tahun, enam bulan, dan dua belas hari {cite:shadharat-dhahab, hlm. 21-22}."
