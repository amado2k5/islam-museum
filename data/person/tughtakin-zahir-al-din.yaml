id: person/tughtakin-zahir-al-din
class: person
label:
  ar: ظهير الدين طغركين الأتابك
  en: Zahir al-Din Tughtakin the Atabeg
  es: "Zahir al-Din Tughtakin the Atabeg"
  fr: "Zahir al-Din Tughtakin the Atabeg"
  ur: "ظہیر الدین تغتقین عتابیگ"
summary:
  ar: "طغركين الأتابك، لقبه ظهير الدين، من موالي تاج الدولة تتش؛ لما توفي دقاق بدمشق سنة 497هـ استقل بالملك وخطب لأخيه تلتاش صبياً مراهقاً ففر تلتاش إلى بعلبك واستبد طغركين، وحارب الفرنج فهزم القمص الغائر على دمشق وملك حصن رمسة من طرابلس، وناجز ملوك الإفرنج وقمامصتهم بمرج الصفر آخر سنة 520هـ فصرع عن فرسه ثم استمات رجالة التركمان حتى قتلوا رجالة الإفرنج ونهبوا عسكرهم، وتوفي في صفر سنة 522هـ وكان حسن السيرة مؤثراً للعدل محباً في الجهاد، فولي ابنه تاج الدولة بوري."
  en: "Tughtakin the Atabeg, laqab Zahir al-Din, a mamluk of Taj al-Dawla Tutush; on Duqaq's death in 497 AH he took sole power, proclaimed the infant Tultash then ruled outright when the boy fled to Baalbek — he broke the qummus raiding Damascus, took the Ramsa fort of Tripoli, and met the Frankish kings and counts at Marj al-Saffar late in 520, where he was unhorsed but the Turkman foot fought to the death, massacred the Frankish infantry and looted their camp; he died in Safar 522, remembered as just, upright and devoted to jihad, and his son Taj al-Dawla Buri succeeded."
  es: "Tughtakin el Atabeg, laqab Zahir al-Din, un mameluco de Taj al-Dawla Tutush; a la muerte de Duqaq en 497 AH tomó el poder absoluto, proclamó al infante Tultash y luego gobernó directamente cuando el niño huyó a Baalbek; rompió el qummus saqueando Damasco, tomó el fuerte Ramsa de Trípoli y se enfrentó a los reyes y condes francos en Marj al-Saffar a finales de 520, donde fue derribado de su caballo, pero la infantería turcomana luchó hasta la muerte, masacró a la infantería franca y saqueó su campamento; murió en Safar 522, recordado como justo, íntegro y devoto de la yihad, y su hijo Taj al-Dawla Buri lo sucedió."
  fr: "Tughtakin l'Atabeg, laqab Zahir al-Din, un mamelouk de Taj al-Dawla Tutush; à la mort de Duqaq en 497 AH, il prit le pouvoir seul, proclama le jeune Tultash puis régna directement lorsque le garçon s'enfuit à Baalbek — il brisa le qummus en pillant Damas, prit le fort de Ramsa à Tripoli et rencontra les rois et comtes francs à Marj al-Saffar fin 520, où il fut désarçonné mais l'infanterie turkmène combattit jusqu'à la mort, massacra l'infanterie franque et pilla leur camp; il mourut en Safar 522, dont on se souvient comme d'un homme juste, droit et dévoué au jihad, et son fils Taj al-Dawla Buri lui succéda."
  ur: "تغتقین عطابیگ، لقب ظاہر الدین، تاج الدولہ توتش کا مملوک؛ 497 ہجری میں دقاق کی موت پر اس نے مکمل اقتدار سنبھال لیا، شیر خوار طلعت کا اعلان کیا پھر جب لڑکا بعلبیک کی طرف بھاگا تو اس نے مکمل طور پر حکومت کی - اس نے دمشق پر چھاپہ مار کر قم کو توڑ دیا، طرابلس کے قلعہ رامسا پر قبضہ کیا اور فرانکی بادشاہوں سے ملاقات کی اور مرج الصفار میں شمار کیا، جہاں وہ دیر سے ترق کے قدموں پر تھا۔ موت تک، فرینکش انفنٹری کا قتل عام کیا اور ان کے کیمپ کو لوٹ لیا۔ اس کی وفات صفر 522 میں ہوئی، اسے عادل، راست باز اور جہاد کے لیے وقف کے طور پر یاد کیا جاتا ہے، اور اس کا بیٹا تاج الدولہ بری کامیاب ہوا۔"
