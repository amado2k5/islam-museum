summary:
  ar: 'كاتب شامي القرن الثالث عشر، وصف نفسه عضواً في جماعة بني ساسان؛ ألّف «كتاب المختار
    في كشف الأسرار وهتك الأستار» لصاحب خربرت ركن الدين مودود، وفيه شهادة نصية على
    صنعة الطرش: قوالب تُسمّى طرُشاً تُطبع بها التمائم ⁦(السراميط)⁩ كل يوم، وهي من
    أوضح شهادات الطباعة الخشبية العربية {cite:wikipedia-tarsh-en} {cite:schaefer-enigmatic-charms-2006}.'
  en: 'A thirteenth-century Syrian writer who described himself as a member of the
    Banu Sasan confederation; he composed the Kitab al-Mukhtar fi Kashf al-Asrar for
    Rukn al-Din Mawdud of Kharput, which contains a textual witness to the tarsh craft:
    matrices called turush with which amulets are printed daily, one of the clearest
    written testimonies of Arabic block printing {cite:wikipedia-tarsh-en} {cite:schaefer-enigmatic-charms-2006}.'
  ur: 'تیرہویں صدی کا شامی مصنف جو خود کو بنو ساسان جماعت کا رکن بتاتا ہے؛ اس نے خرپٹ
    کے رکن الدین مودود کے لیے کتاب المختار فی کشف الاسرار لکھی جس میں طرش صنعت کی
    تحریری گواہی ہے: طرش نام کے قالب جن سے روز تمائم ⁦(سرامیت)⁩ چھاپے جاتے تھے — عربی
    بلاک پرنٹنگ کی واضح ترین تحریری شہادت {cite:wikipedia-tarsh-en} {cite:schaefer-enigmatic-charms-2006}۔'
