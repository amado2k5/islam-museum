summary:
  ar: "عالم هندي ديوبندي، وُلد في ديوبند سنة 1964. تولى مناصب قيادية في جمعية علماء الهند ⁦(جمعية العلماء)⁩ منذ عامين عديدة، واختير رئيسًا لها بعد انقسامها سنة 2021، وكان عضوًا في مجلس الولايات ⁦(راجيا سبها)⁩ بين 2006 و2012؛ تصدر المؤسسة في قضايا حقوق المسلمين والإغاثة في الهند."
  en: "Indian Deobandi scholar, born in Deoband in 1964. Long a senior office-holder of Jamiat Ulama-e-Hind, he was elected its president after the organisation split in 2021; he sat in the Rajya Sabha from 2006 to 2012 and leads the body's work on Muslim rights and relief in India."
  ur: "بھارتی دیوبندی عالم، 1964 میں دیوبند میں پیدا ہوئے۔ وہ برسوں سے جمعیت علمائے ہند کے سینئر عہدے دار رہے اور 2021 میں تنظیم کے منقسم ہونے کے بعد اس کے صدر منتخب ہوئے؛ 2006 تا 2012 راجیہ سبھا کے رکن رہے اور بھارت میں مسلمانوں کے حقوق اور امدادی کاموں میں تنظیم کی قیادت کرتے ہیں۔"
  es: "Erudito indio deobandi, nacido en Deoband en 1964. Durante mucho tiempo ocupó un alto cargo en Jamiat Ulama-e-Hind, y fue elegido presidente de la organización tras su escisión en 2021; fue miembro del Rajya Sabha de 2006 a 2012 y dirige el trabajo de la organización en materia de derechos y ayuda a los musulmanes en la India."
