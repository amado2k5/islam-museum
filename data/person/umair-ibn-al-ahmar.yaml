class: person
label: { ar: "أمير بن الأحمر اليشكري", en: "Umair ibn al-Ahmar al-Yashkuri", es: "Umair ibn al-Ahmar al-Yashkuri", fr: "Umair ibn al-Ahmar al-Yashkuri", ur: "عمیر بن الاحمر الیشکوری۔" }
summary:
  ar: "أمير بن الأحمر اليشكري؛ استخلفه عبد الرحمن بن سمرة على زرنج لما انصرف من سجستان لاضطراب أمر عثمان فأخرجه أهل زرنج وأغلقوها ولزياد الأعجم فيه لو لا أمير هلكت يشكر ويشكر هلكى على كل حال."
  en: "Umair ibn al-Ahmar al-Yashkuri; Ibn Samura's deputy at Zaranj, expelled by its people who shut the gates — Ziyad al-A'jam's verse: 'but for Umair, Yashkur had perished, and Yashkur is doomed anyway'."
  es: "Umair ibn al-Ahmar al-Yashkuri, lugarteniente de Ibn Samura en Zaranj, fue expulsado por su gente, que cerró las puertas. El verso de Ziyad al-A'jam dice: \"Si no fuera por Umair, Yashkur habría perecido, y Yashkur está condenado de todos modos\"."
  fr: "Umair ibn al-Ahmar al-Yashkuri; adjoint d'Ibn Samura à Zaranj, expulsé par ses habitants qui fermèrent les portes — verset de Ziyad al-A'jam: « sans Umair, Yashkur aurait péri, et Yashkur est de toute façon voué à la mort »."
  ur: "عمیر بن الاحمر الیشکوری؛ زرنج میں ابن سمرہ کے نائب کو، اس کے لوگوں کے ذریعے نکال دیا گیا جنہوں نے دروازے بند کر دیے تھے - زیاد العجم کی آیت: 'لیکن عمیر کے لیے، یشکور فنا ہو گیا، اور یشکور بہرحال برباد ہے'۔"
  tr: "Emir bin el-Ahmar el-Yashkuri; Abd al-Rahman ibn Samura, Osman Osman işlerinin karışıklığı nedeniyle Sijistan'dan ayrıldığında onu Zaranj'ın yerine yardımcısı olarak atadı. Zaranj halkı onu kovdu ve kapattı. Ecam, eğer bir emir olmasaydı öleceğini ve her halükarda minnettar olacağını ekledi."
  id: "Amir ibn al-Ahmar al-Yashkuri; Abd al-Rahman ibn Samurah mengangkatnya sebagai wakilnya atas Zaranj ketika ia meninggalkan Sijistan karena gejolak urusan Uthman. Rakyat Zaranj mengusirnya dan menutupnya. Ajam menambahkan bahwa jika tidak ada emir, ia akan mati, dan ia akan bersyukur dalam hal apa pun."
