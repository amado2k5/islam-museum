summary:
  ar: "داعية وأكاديمية ماليزية، حاصلة على البكالوريوس في الأدب العربي والدراسات الإسلامية من جامعة اليرموك في الأردن، وعلى الماجستير والدكتوراه من جامعة مالايا، ودرّست في جامعة التكنولوجيا الماليزية في كوالالمبور. شاركت في تأسيس معهد تحفيظ «مدينة الحفاظ» المتكامل في غومباك، وهي إحدى أكثر داعيتين متابعة في ماليزيا، إذ بلغ متابعوها على إنستغرام مليون متابع بحسب دراسة معهد ISEAS."
  en: "Malaysian preacher and academic. She holds a bachelor's degree in Arabic literature and Islamic studies from Yarmouk University in Jordan and a master's and doctorate from the University of Malaya, and has lectured at Universiti Teknologi Malaysia in Kuala Lumpur. She co-founded the Maahad Tahfiz Integrasi Madinatul Huffaz in Gombak, and with 1 million Instagram followers as counted in ISEAS's study she is one of Malaysia's two most-followed celebrity ustazahs."
  ur: "ملائیشیائی مبلغہ اور ماہرِ تعلیم۔ اردن کی یرموک یونیورسٹی سے عربی ادب و اسلامیات میں بیچلر، اور یونیورسٹی آف ملایا سے ماسٹرز و پی ایچ ڈی کی ڈگریاں حاصل کیں، اور کوالالمپور میں یونیورسٹی ٹیکنالوجی ملائشیا میں تدریس کی۔ گومباک میں معہد تحفیظ انٹیگراسی مدینۃ الحفاظ کی شریک بانی ہیں، اور ISEAS کی تحقیق کے مطابق انسٹاگرام پر ایک ملین فالوورز کے ساتھ ملائشیا کی دو سب سے زیادہ فالو کی جانے والی معروف استاذاؤں میں سے ایک ہیں۔"
