id: person/ibn-al-muqaddam-shams-al-din
class: person
label: { ar: "شمس الدين ابن المقدم", en: "Shams al-Din Ibn al-Muqaddam" , ur: "شمس الدین ابن مقدم", es: "Shams al-Din Ibn al-Muqaddam", fr: "Shams al-Din Ibn al-Muqaddam"}
summary:
  ar: "شمس الدين محمد بن عبد الملك المعروف بابن المقدم، أكبر الأمراء الصلاحية؛ استأذن صلاح الدين بعد فتح بيت المقدس سنة ثلاث وثمانين وخمسمائة أن يحرم من القدس فيجمع في سنته بين الجهاد والحج وزيارة الخليل ومشاهد أنبياء الشام وزيارة رسول الله، فأُمّر على حاج الشام — وكان تلك السنة خلقاً عظيماً من البلاد والعراق وديار الجزيرة وخلاط وبلاد الروم ومصر — فلما كان عشية عرفة أمر بضرب كؤساته فاعترضه أمير الحاج العراقي مجير الدين طاشتكين فلم يقف له، فهجم العراقيون على حاج الشام وقتلوا ونهبوا وجُرح ابن المقدم جروحاً وهو يكف أصحابه عن القتال مراقبة لحرمة المكان واليوم، فمات من يومه بمنى ودفن بمقبرة المعلى {cite:kamil-ibn-al-athir p. 162-163}."
  en: "Greatest of the Salahiyya amirs — given Saladin's leave after Jerusalem's fall to make Hajj from the Holy City itself, he led the great Syrian caravan of 583; refusing the Iraqi amir al-hajj's claim of precedence at Arafat, he was mortally wounded in the ensuing attack while holding his men from fighting for the sanctity of place and day, and died at Mina {cite:kamil-ibn-al-athir p. 162-163}."
  ur: "صلاح الدین کے بڑے امرا میں سے؛ 583 ہجری میں شامی حجاج کی قیادت کی۔ عرفات میں عراقی امیر حج کے ساتھ نزاع کے دوران زخمی ہوئے جبکہ اپنے لوگوں کو لڑائی سے روکتے رہے، اور منیٰ میں وفات پائی۔ {cite:kamil-ibn-al-athir}"
  es: "El más grande de los emires Salahiyya —tras la caída de Jerusalén, Saladino le concedió permiso para realizar el Hajj desde la propia Ciudad Santa, y dirigió la gran caravana siria de 583 hombres; rechazando la pretensión de precedencia del emir iraquí al-hajj en Arafat, fue herido de muerte en el ataque subsiguiente mientras impedía que sus hombres lucharan por la santidad del lugar y del día, y murió en Mina {cite:kamil-ibn-al-athir p. 162-163}."
  fr: "Le plus grand des émirs Salahiyya — ayant reçu la permission de Saladin après la chute de Jérusalem d'effectuer le Hajj depuis la Ville Sainte elle-même, il dirigea la grande caravane syrienne de 583; refusant la préséance de l'émir irakien al-hajj à Arafat, il fut mortellement blessé lors de l'attaque qui suivit alors qu'il empêchait ses hommes de se battre pour la sainteté du lieu et du jour, et mourut à Mina {cite:kamil-ibn-al-athir p. 162-163}."
  tr: "Şemseddin Muhammed bin Abdülmelik, İbn el-Mukaddam olarak bilinir, Salahiyya prenslerinin en büyüğü, 583 Hicri yılında Kudüs'ün fethinden sonra Kudüs'ten ihram devleti kurmak için izin istedi; cihad, hac, Hebron'u ziyaret etmek, Şam peygamberlerinin türbelerini ve Allah'ın Elçisi'ni ziyaret etmek için bir araya geldi. El-Şam'ın hacısına—topraklardan, Irak'tan, yarımada topraklarından, Hilat'tan gelen büyük bir ulusa emretti. o yıl boyunca Romalılar ve Mısır'a karşı savaştı. Arafat arifesinde kadehlerinin atılmasını emretti, ancak Iraklı hacı prensi Mujireddin Taştekin onu durdurdu, fakat durmadı. Iraklılar Hac el-Şam'a saldırdı, öldürdü ve yağmaladı; İbn el-Muqaddam, yerin ve günün kutsallığına saygı göstererek adamlarını savaşmaktan alıkoyurken yaralandı. O gün Mina'da öldü ve Ma'ala mezarlığına defnedildi {alıntı:Kamil-ibn-al-Athir s. 162-163}."
  id: "Shams al-Din Muhammad ibn Abd al-Malik, yang dikenal sebagai Ibn al-Muqaddam, pangeran terbesar Salahiyya, meminta izin setelah penaklukan Yerusalem pada tahun 583 H untuk memasuki negara ihram dari Yerusalem, menggabungkan jihad, ziarah, mengunjungi Hebron, tempat suci para nabi al-Sham, dan mengunjungi Rasul Allah. Ia memerintahkan peziarah al-Sham—sebuah bangsa besar dari tanah-tanah Irak, tanah semenanjung, Khilat, tanah Romawi, dan Mesir pada tahun itu. Pada malam sebelum Arafah, ia memerintahkan agar cawannya dilempar, tetapi pangeran peziarah Irak Mujir al-Din Tashtakin mencegatnya, namun ia tidak berhenti. Pasukan Irak menyerang Haji al-Sham, membunuh dan menjarah, dan Ibn al-Muqaddam terluka saat menahan pasukannya bertempur demi menghormati kesucian tempat dan hari itu. Ia meninggal hari itu di Mina dan dimakamkan di pemakaman Ma'ala {cite:Kamil-ibn-al-Athir hlm. 162-163}."
