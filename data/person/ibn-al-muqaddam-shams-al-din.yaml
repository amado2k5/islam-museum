id: person/ibn-al-muqaddam-shams-al-din
class: person
label: { ar: "شمس الدين ابن المقدم", en: "Shams al-Din Ibn al-Muqaddam" , ur: "شمس الدین ابن مقدم"}
summary:
  ar: "شمس الدين محمد بن عبد الملك المعروف بابن المقدم، أكبر الأمراء الصلاحية؛ استأذن صلاح الدين بعد فتح بيت المقدس سنة ثلاث وثمانين وخمسمائة أن يحرم من القدس فيجمع في سنته بين الجهاد والحج وزيارة الخليل ومشاهد أنبياء الشام وزيارة رسول الله، فأُمّر على حاج الشام — وكان تلك السنة خلقاً عظيماً من البلاد والعراق وديار الجزيرة وخلاط وبلاد الروم ومصر — فلما كان عشية عرفة أمر بضرب كؤساته فاعترضه أمير الحاج العراقي مجير الدين طاشتكين فلم يقف له، فهجم العراقيون على حاج الشام وقتلوا ونهبوا وجُرح ابن المقدم جروحاً وهو يكف أصحابه عن القتال مراقبة لحرمة المكان واليوم، فمات من يومه بمنى ودفن بمقبرة المعلى {cite:kamil-ibn-al-athir p. 162-163}."
  en: "Greatest of the Salahiyya amirs — given Saladin's leave after Jerusalem's fall to make Hajj from the Holy City itself, he led the great Syrian caravan of 583; refusing the Iraqi amir al-hajj's claim of precedence at Arafat, he was mortally wounded in the ensuing attack while holding his men from fighting for the sanctity of place and day, and died at Mina {cite:kamil-ibn-al-athir p. 162-163}."
  ur: "صلاح الدین کے بڑے امرا میں سے؛ 583 ہجری میں شامی حجاج کی قیادت کی۔ عرفات میں عراقی امیر حج کے ساتھ نزاع کے دوران زخمی ہوئے جبکہ اپنے لوگوں کو لڑائی سے روکتے رہے، اور منیٰ میں وفات پائی۔ {cite:kamil-ibn-al-athir}"
