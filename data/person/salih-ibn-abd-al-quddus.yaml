id: person/salih-ibn-abd-al-quddus
class: person
label: { ar: "صالح بن عبد القدوس البصري" }
summary:
  ar: "رُفع إلى المهدي في الزندقة فأظهر التوبة فصرفه ثم رده وقال له ألم تقل والشيخ لا يترك أخلاقه قال بلى قال فكذلك أنت لا تدع أخلاقك حتى تموت ثم أمر بقتله {cite:tarikh-khulafa-minhaj-1434 p. 444}. وعدّه ابن النديم في المتكلمين الذين يظهرون الإسلام ويبطنون الزندقة {cite:fihrist-ibn-al-nadim p. 473}، وقيل إنه مات ابن لصالح بن عبد القدوس الذي يرمى بالزندقة فجزع عليه ووافاه أبو الهذيل العلاف شيخ المعتزلة كالمتوجع له، وكتاب الشكوك لصالح هو كتاب من قرأه تشكك فيما كان حتى يتوهم أنه لم يكن وفيما لم يكن حتى يتوهم أنه قد كان {cite:fihrist-ibn-al-nadim supplement p. 525-526}"
  en: "Denounced to al-Mahdi for zandaqa; he professed repentance and was released, then recalled — 'the old man never leaves his ways,' his own verse — and executed {cite:tarikh-khulafa-minhaj-1434 p. 444}."
  es: "Denunciado ante al-Mahdi por zandaqa; profesó arrepentimiento y fue liberado, luego llamado de vuelta —'el anciano nunca abandona sus caminos', su propio verso— y ejecutado {cite:tarikh-khulafa-minhaj-1434 p. 444}."
  fr: "Dénoncé à al-Mahdi pour zandaqa; il a professé le repentir et a été libéré, puis rappelé — « le vieil homme ne quitte jamais ses voies », son propre verset — et exécuté {cite:tarikh-khulafa-minhaj-1434 p. 444}."
  ur: "زندقہ کے لیے المہدی کی مذمت؛ اس نے توبہ کا اقرار کیا اور اسے رہا کر دیا گیا، پھر واپس بلایا گیا - 'بوڑھا آدمی کبھی اپنا راستہ نہیں چھوڑتا،' اس کی اپنی آیت - اور اسے پھانسی دے دی گئی۔ 444}۔"
  tr: "Sapkınlıkla ilgili Mahdi'ye getirildi, Mehdi tövbesini açıkladı, sonra onu geri çevirdi ve \"Şeyhin ahlakını terk etmediğini söylemedin mi?\" dedi. O dedi ki, \"Evet.\" Dedi ki, \"O yüzden ölene kadar ahlakını terk etme.\" Sonra idamını emretti. {alıntı:) Tarikh-khulafa-minhaj-1434, s. 444}. İbn el-Nadim, onu açıkça İslam'ı vaaz eden ancak sapkınlığı gizleyen ilahiyatçılar arasında saymıştır {atı:fihrist-ibn-al-nadim s. 473}. Sapkınlıkla suçlanan Salih ibn Abdül-Quddus'in oğlu olarak öldüğü söylenir, bu yüzden onun için yas tutmuştur. Mu'tazillerin şeyhi Ebu el-Hudhayl al-Allaf, sanki yas tutmuş gibi vefat etti. 'Salih'in Şüpheleri' kitabı, okuyan herkesin ne olduğunu şüpheyle karşıladığı, sonra olmadığını düşünene kadar ve neyin olmadığını da hayal edene kadar {cite:fihrist-ibn-al-nadim ek s. 525-526}"
  id: "Dia dibawa kepada Mahdi tentang ajaran sesat, yang mengungkapkan pertobatannya, sehingga dia menolaknya, lalu mengembalikannya dan berkata, \"Bukankah kau mengatakan bahwa sheikh tidak meninggalkan moralnya?\" Dia berkata, \"Ya.\" Dia berkata, \"Jadi kau tidak meninggalkan moralmu sampai kau mati.\" Kemudian dia memerintahkan eksekusinya {cite:Tarikh-khulafa-minhaj-1434, hlm. 444}. Ibn al-Nadim menganggapnya sebagai salah satu teolog yang secara terbuka mengajarkan Islam tetapi menyembunyikan ajaran sesat {cite:fihrist-ibn-al-nadim hlm. 473}. Konon ia meninggal sebagai putra Salih ibn Abd al-Quddus, yang dituduh bid'ah, sehingga ia berduka untuknya. Abu al-Hudhayl al-Allaf, Sheikh Mu'tazilite, meninggal seolah-olah sedang berduka. Buku 'Keraguan Salih' adalah buku di mana siapa pun yang membacanya meragukan apa yang ada sampai mereka mengira itu bukan, dan tentang apa yang ada sebelum mereka membayangkan itu {cite:fihrist-ibn-al-nadim supplement hlm. 525-526}"
