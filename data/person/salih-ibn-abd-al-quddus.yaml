id: person/salih-ibn-abd-al-quddus
class: person
label: { ar: "صالح بن عبد القدوس البصري" }
summary:
  ar: "رُفع إلى المهدي في الزندقة فأظهر التوبة فصرفه ثم رده وقال له ألم تقل والشيخ لا يترك أخلاقه قال بلى قال فكذلك أنت لا تدع أخلاقك حتى تموت ثم أمر بقتله {cite:tarikh-khulafa-minhaj-1434 p. 444}. وعدّه ابن النديم في المتكلمين الذين يظهرون الإسلام ويبطنون الزندقة {cite:fihrist-ibn-al-nadim p. 473}، وقيل إنه مات ابن لصالح بن عبد القدوس الذي يرمى بالزندقة فجزع عليه ووافاه أبو الهذيل العلاف شيخ المعتزلة كالمتوجع له، وكتاب الشكوك لصالح هو كتاب من قرأه تشكك فيما كان حتى يتوهم أنه لم يكن وفيما لم يكن حتى يتوهم أنه قد كان {cite:fihrist-ibn-al-nadim supplement p. 525-526}"
  en: "Denounced to al-Mahdi for zandaqa; he professed repentance and was released, then recalled — 'the old man never leaves his ways,' his own verse — and executed {cite:tarikh-khulafa-minhaj-1434 p. 444}."
