  ar: "أبو عبد الله البراني من مشاهير المتعبدين، روى عنه حكيم بن جمعة قوله إن أرفع الدرجات يوم القيامة للراضين عن الله على كل حال، وإن من عرف ثواب الأعمال خفّت عليه الأحوال."
