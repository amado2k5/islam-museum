summary:
  ar: "أبو عبد الله البراني من مشاهير المتعبدين، روى عنه حكيم بن جمعة قوله إن أرفع الدرجات يوم القيامة للراضين عن الله على كل حال، وإن من عرف ثواب الأعمال خفّت عليه الأحوال."
  en: "Abu Abd Allah al-Barani, one of the known worshippers; Hakim ibn Jumu'a relates from him that the highest rank on the Day of Resurrection belongs to those who are content with God in every state, and that whoever knows the reward of deeds finds all states light."
  ur: "ابو عبد اللہ برانی مشہور عبادت گزاروں میں سے تھے۔ حکیم بن جمعہ نے ان سے نقل کیا کہ قیامت کے دن سب سے بلند درجہ ان لوگوں کا ہے جو ہر حال میں اللہ سے راضی رہیں، اور جو اعمال کا ثواب جانتا ہے اس پر ہر حال ہلکا ہو جاتا ہے۔"
  fr: "Abu Abd Allah al-Barani, l'un des adorateurs connus ; Hakim ibn Jumu'a rapporte de lui que le rang le plus élevé au Jour de la Résurrection appartient à ceux qui sont contents de Dieu en tout état, et que celui qui connaît la récompense des œuvres trouve tous les états légers."
  es: "Abu Abd Allah al-Barani, uno de los adoradores conocidos; Hakim ibn Jumu'a relata de él que el rango más alto en el Día de la Resurrección pertenece a aquellos que están contentos con Dios en cada estado, y que quien conoce la recompensa de las obras encuentra luz en todos los estados."
  tr: "Ebu Abdullah el-Barani, meşhur ibadet edenlerden biridir. Hakim bin Cuma’a ondan şöyle rivayet etmiştir: “Kıyamet Günü en yüksek mertebeler, her durumda Allah’tan razı olanlara aittir ve amellerin sevabını bilen kimse, durumları kolay bulur.”"
  id: "Abu Abdullah al-Barani adalah salah satu penyembah yang terkenal. Hakim bin Juma’a meriwayatkan darinya bahwa beliau berkata: “Kedudukan tertinggi pada Hari Kiamat adalah bagi mereka yang ridha kepada Allah dalam setiap keadaan, dan siapa pun yang mengetahui pahala amal perbuatan akan mudah dalam menghadapi keadaan.”"
