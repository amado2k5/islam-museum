summary:
  ar: "سياسي وقاض بحريني، ابن حاكم البحرين عيسى بن علي وأخو الحاكم حمد بن عيسى. وُلد في المنامة سنة 1883 وتربّى في بيت أبيه الحاكم، فرأس أول مجلس لبلدية المنامة عند تأسيسها سنة 1919، وأسّس أول مدرسة للبنات سنة 1926 وأرسل أول بعثة طلابية إلى الخارج سنة 1928، وعُيّن أول وزير للمعارف سنة 1931 ورئيسا لقضاة محكمة التمييز سنة 1938، وتوفي سنة 1966."
  en: "Bahraini politician and judge, a son of the ruler Isa bin Ali and a younger brother of the ruler Hamad bin Isa. Born in Manama in 1883 and raised in his father's house, he chaired the first council of the Manama municipality on its founding in 1919, established the first girls' school in 1926, sent the first student mission abroad in 1928, was appointed the first Minister of Education in 1931 and chief judge of the Court of Cassation in 1938, and died in 1966."
  ur: "بحرینی سیاست دان اور جج، حاکمِ بحرین عیسیٰ بن علی کے بیٹے اور حاکم حمد بن عیسیٰ کے چھوٹے بھائی۔ 1883ء میں منامہ میں پیدا ہوئے اور والد حاکم کے گھر پرورش پائی؛ 1919ء میں منامہ بلدیہ کی پہلی مجلس کے سربراہ بنے، 1926ء میں لڑکیوں کا پہلا اسکول قائم کیا، 1928ء میں پہلا طلابی وفد بیرونِ ملک بھیجا، 1931ء میں پہلے وزیرِ تعلیم اور 1938ء میں عدالتِ تمییز کے سربراہ جج مقرر ہوئے، اور 1966ء میں وفات پائی۔"
