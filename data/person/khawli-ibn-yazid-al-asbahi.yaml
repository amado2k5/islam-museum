id: person/khawli-ibn-yazid-al-asbahi
class: person
label: { ar: "خولي بن يزيد الأصبحي" }
summary:
  ar: "رجل من حمير أجهز على الحسين يوم كربلاء في رواية وجز رأسه وأتى به عبيد الله بن زياد وقال أبياته أوقر ركابي فضة أو ذهبا إني قتلت الملك المحجبا {cite:tarikh-khulafa-minhaj-1434 p. 341-342}."
  en: "A Himyarite said to have finished al-Husayn at Karbala and borne his head to Ubayd Allah ibn Ziyad, boasting in rajaz: 'load my mount with silver or gold — I have slain the veiled king, the best of men in mother and father' {cite:tarikh-khulafa-minhaj-1434 p. 341-342}."
  es: "Se dice que un himyarita acabó con al-Husayn en Karbala y llevó su cabeza a Ubayd Allah ibn Ziyad, jactándose en rajaz: \"Carguen mi montura con plata u oro; he matado al rey velado, el mejor de los hombres por madre y padre\" {cite:tarikh-khulafa-minhaj-1434 p. 341-342}."
  fr: "Un Himyarite aurait achevé al-Husayn à Karbala et porté sa tête à Ubayd Allah ibn Ziyad, se vantant en rajaz: « chargez ma monture d'argent ou d'or — j'ai tué le roi voilé, le meilleur des hommes en mère et en père » {cite: tarikh-khulafa-minhaj-1434 p. 341-342}."
  ur: "ایک حمیری نے امام حسین کو کربلا میں فارغ کرتے ہوئے کہا کہ اپنا سر عبید اللہ ابن زیاد کے پاس لے گیا اور رجز میں فخر کرتے ہوئے کہا: \"میرے پہاڑ پر سونے یا چاندی سے لدا دو- میں نے پردہ دار بادشاہ کو قتل کر دیا ہے، جو ماں اور باپ میں سب سے بہتر تھا\"۔ 341-342}۔"
