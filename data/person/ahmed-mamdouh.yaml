summary:
  ar: "عالم مصري من أمناء الفتوى بدار الإفتاء المصرية، تولى إدارة إدارة الأبحاث الشرعية بالدار وتنسيق لجنة المعاملات فيها، وكرّمه مفتي الجمهورية شوقي علام سنة 2023 ضمن أمناء الفتوى المتميزين، وهو من وجوه الدار الإعلامية: يجيب عن الأسئلة في فتاوى مصورة على قناتها الرسمية وفي برامج قناة الناس."
  en: "Egyptian scholar and one of the fatwa secretaries of Egypt's Dar al-Ifta. He directed the Dar's Sharia Research Department and coordinated its transactions committee, was honoured by Grand Mufti Shawki Allam in 2023 among the Dar's distinguished fatwa secretaries, and is one of the Dar's media faces, answering questions in video fatwas on its official channel and in programmes on the Al-Nas channel."
  ur: "مصری عالم اور دار الافتاء مصر کے امناءِ فتویٰ میں سے ایک۔ وہ دار کے شعبۂ تحقیقاتِ شرعیہ کے ڈائریکٹر اور اس کی کمیٹی برائے معاملات کے کوآرڈینیٹر رہے، 2023 میں مفتیِ جمہوریہ شوقی علام نے ممتاز امناءِ فتویٰ میں انہیں اعزاز دیا، اور وہ دار کے میڈیا چہروں میں سے ہیں: اس کے رسمی چینل پر ویڈیو فتاویٰ اور قناة الناس کے پروگراموں میں سوالات کے جواب دیتے ہیں۔"
