  ar: "لاعب كرة قدم تونسي سابق (وُلد سنة 1991 في أجاكسيو بفرنسا)، لاعب وسط مهاجم لعب لباستيا وبوردو وسندرلاند وسانت إتيان ومونبلييه، وقاد منتخب تونس في 74 مباراة دولية سجل فيها 25 هدفًا، ثم عمل محللًا تلفزيونيًا."
