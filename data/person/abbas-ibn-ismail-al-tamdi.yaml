summary:
  ar: "أبو الفضل العباس بن إسماعيل الطامدي، كان من العبادة والحلاوة بالمحل المكين مع ما كان يرجع إليه من العلم الواسع النافع. لما اعتل أياما أسف لنقص ختماته في الشهر ثلاثين ختمة. ومن قول ابن المبارك على لسانه: إن كان الفضل في الجماعة فالسلامة في الوحدة."
  en: "Abu al-Fadl Abbas ibn Isma'il al-Tamdi, known for worship and sweetness of character in a firm station, and to whom people referred for broad and useful knowledge. When he fell ill for several days and was grieved, he said the illness had cost him thirty khatmas (complete Qur'an recitations) in the month; he transmitted Ibn al-Mubarak's saying: if virtue lies in the congregation, safety lies in solitude."
  ur: "ابو الفضل عباس بن اسماعیل طامدی، عبادت اور ٹھہراؤ والے مقام پر، اور وسیع اور مفید علم کے لیے ان کی طرف رجوع کیا جاتا تھا۔ جب وہ کئی دن بیمار رہے تو افسوس کیا کہ بیماری نے ان کے مہینے کے تیس ختم کم کر دیے۔ انہوں نے ابن مبارک کا قول نقل کیا: اگر فضیلت جماعت میں ہے تو سلامتی تنہائی میں ہے۔"
