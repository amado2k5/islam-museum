summary:
  ar: "شاعر أردي (1884–1936)، وُلد باسم أصغر حسين في غوراخبور ونشأ في غوندا فنُسب إليها. تعلّم بنفسه حتى أتقن الأردية والعربية والفارسية، وحرّر مجلة «هندوستاني» في الله آباد سنوات، واشتهر بغزليات ذات نَفَس صوفي وفلسفي جُمعت في «نشاط روح» و«سرود زندگي»."
  en: "Urdu poet (1884–1936), born Asghar Husain at Gorakhpur and raised at Gonda, from which his pen name Gondvi comes. Largely self-taught to mastery of Urdu, Arabic and Persian, he edited the magazine Hindustani at Allahabad for years and became known for ghazals of a Sufi and philosophical cast, collected as Nishat-e Rooh and Surood-e Zindagi."
  ur: "اردو کے شاعر (1884ء–1936ء)، جو گورکھپور میں اصغر حسین کے نام سے پیدا ہوئے اور گونڈہ میں پروان چڑھے، اسی نسبت سے گونڈوی کہلائے۔ انھوں نے ذاتی محنت سے اردو، عربی اور فارسی میں مہارت حاصل کی، برسوں الہ آباد سے شائع ہونے والے رسالے «ہندوستانی» کی ادارت کی، اور ان کی صوفیانہ و فلسفیانہ غزلیں «نشاطِ روح» اور «سرودِ زندگی» میں جمع ہوئیں۔"
