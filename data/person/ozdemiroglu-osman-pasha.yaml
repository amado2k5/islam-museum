summary:
  ar: "بطاقة أولية لأوزدمير أوغلو عثمان باشا، القائد العثماني الذي فتح القوقاز واليمن وكان بكلبكي ثم صدراً أعظم، توفي سنة ١٥٨٥م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ozdemiroglu Osman Pasha, the Ottoman commander of the Caucasus and Yemen campaigns who became beylerbey and grand vizier, d. 1585; the source entry is not yet checked on the page."
  es: "Ficha de reclutamiento de Ozdemiroglu Osman Pasha, comandante otomano de las campañas del Cáucaso y Yemen, quien llegó a ser beylerbey y gran visir, fallecido en 1585; la entrada de la fuente aún no ha sido verificada en la página."
  fr: "Fiche de candidature d'Ozdemiroglu Osman Pacha, commandant ottoman des campagnes du Caucase et du Yémen, devenu beylerbey et grand vizir, décédé en 1585; la source n'est pas encore vérifiée sur la page."
  ur: "اوزدیمیروگلو عثمان پاشا کے لیے کارڈ کا مسودہ، قفقاز اور یمن مہمات کے عثمانی کمانڈر جو بیلربی اور عظیم وزیر بن گئے، ڈی۔ 1585; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Kafkasya ve Yemen'i fetheden Osmanlı komutanı Özdemiroğlu Osman Paşa'nın ön kartı Kalbaki'de ve daha sonra Sadrazam olarak 1585 yılında ölmüştür; Osmanlı tarih kitaplarında kendisinden bahsedilir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Ozdemiroglu Osman Pasha, komandan Ottoman yang menaklukkan Kaukasus dan Yaman, berada di Kalbaki dan kemudian Grand Vizier, wafat pada tahun 1585 M; Buku sejarah Ottoman menyebutkannya dan terjemahannya belum diulas di halaman tersebut."
