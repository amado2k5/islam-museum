summary:
  ar: "ابن الملك الناصر داود صاحب الكرك؛ كان من الفضلاء عنده مشاركة جيدة في كثير من العلوم وله معرفة تامة بالأدب، وتزهد وصحب المشايخ وكان لا يدخر عنهم شيئاً وكان كثير المروءة والاحتمال؛ مات بدمشق ودفن بتربة جده الملك المعظم بسفح قاسيون {cite:shadharat-dhahab p. 577}."
  en: "Karak's prince, al-Nasir Dawud's son — 'of the virtuous, with real shares in many sciences and complete adab'; he renounced rank, kept the shaykhs' company and withheld nothing from them; buried in his grandfather al-Mu'azzam's turba at Qasyun's foot {cite:shadharat-dhahab p. 577}."
  es: "Príncipe de Karak, hijo de al-Nasir Dawud — 'de los virtuosos, con verdadera participación en muchas ciencias y completo adab'; renunció a su rango, mantuvo la compañía de los shaykhs y no les ocultó nada; enterrado en la turba de su abuelo al-Mu'azzam a los pies de Qasyun {cite:shadharat-dhahab p. 577}."
  fr: "Le prince de Karak, fils d'al-Nasir Dawud — « des vertueux, avec de réelles parts dans de nombreuses sciences et une adab complète »; il renonça à son rang, garda la compagnie des cheikhs et ne leur cacha rien; enterré dans la turba de son grand-père al-Mu'azzam au pied de Qasyun {cite: shadharat-dhahab p. 577}."
