  en: "Abdul Rahman Ibrahima Sori"
  ur: "عبد الرحمن ابراہیم ابن سوری"
summary:
  ar: "أمير وقائد عسكري من فوتا جلون في غينيا، ابن الألمامي إبراهيم سوري، تلقى تعليما إسلاميا في تمبكتو وجيني. أُسر سنة 1788 في حملة عسكرية وبِيع إلى تجار الرقيق، فقضى أربعين عاما عبدا في مزرعة قطن قرب ناتشيز في الميسيسيبي. أُفرج عنه سنة 1828 بتدخل الرئيس الأمريكي جون كوينسي آدامز بناء على طلب سلطان المغرب، وأبحر إلى ليبيريا سنة 1829 وتوفي فيها بعد أشهر."
  en: "A prince and military commander of Futa Jallon in Guinea, son of the Almami Ibrahima Sori, who received an Islamic education at Timbuktu and Djenné. Captured in a campaign in 1788 and sold to slave traders, he spent forty years enslaved on a cotton plantation near Natchez, Mississippi. Freed in 1828 through the intervention of President John Quincy Adams at the request of the Sultan of Morocco, he sailed for Liberia in 1829 and died there within months."
  ur: "غنی کے فوتا جلون کے ایک شہزادے اور عسکری قائد، المامی ابراہیم سوری کے بیٹے، جنہوں نے ٹمبکٹو اور جینے میں اسلامی تعلیم حاصل کی۔ 1788 میں ایک عسکری مہم میں گرفتار ہو کر غلام فروشوں کے ہاتھ بکے اور نچز، مسیسپی کے قریب ایک کپاس کے باغ میں چالیس برس غلامی میں گزارے۔ 1828 میں سلطانِ مراکش کی درخواست پر صدر جان کوئنسی ایڈمز کی مداخلت سے آزاد ہوئے، 1829 میں لائبیریا روانہ ہوئے اور چند مہینوں میں وہیں وفات پائی۔"
