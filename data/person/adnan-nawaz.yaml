summary:
  ar: "مذيع أخبار بريطاني وُلد في بيشاور بباكستان. بدأ عمله في بي بي سي مطلع التسعينيات، وقدّم الرياضة والأخبار على قناة بي بي سي الإخبارية وبي بي سي وورلد نيوز بين 2000 و2015، ومنها برنامج «نيوزداي»، ثم التحق بقناة تي آر تي وورلد مذيعًا سنة 2015. وهو خريج كلية لندن للاقتصاد."
  en: "British news anchor born in Peshawar, Pakistan. He began at the BBC in the early 1990s, presented sport and news on the BBC News channel and BBC World News between 2000 and 2015, including Newsday, and joined TRT World as an anchor in 2015. He is a graduate of the London School of Economics."
  ur: "برطانوی نیوز اینکر جو پشاور، پاکستان میں پیدا ہوئے۔ انہوں نے 1990 کی دہائی کے اوائل میں بی بی سی سے آغاز کیا، 2000 سے 2015 تک بی بی سی نیوز چینل اور بی بی سی ورلڈ نیوز پر کھیل اور خبریں پیش کیں، جن میں «نیوزڈے» بھی شامل ہے، اور 2015 میں ٹی آر ٹی ورلڈ سے بطور اینکر وابستہ ہوئے۔ وہ لندن اسکول آف اکنامکس کے فارغ التحصیل ہیں۔"

