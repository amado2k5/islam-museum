summary:
  ar: "أبو يعقوب القطان المروروذي، رحل إلى الآفاق البعيدة في طلب الحديث وحدّث عن ابن راهويه وعلي بن حجر وأبي كريب، روى عنه أبو بكر الشافعي وكان ثقة صدوقًا؛ توفي بمرو بعد منصرفه من الحجة الثانية {cite:muntazam-ibn-al-jawzi p. 205}."
  en: "Abu Ya'qub al-Qattan of Marw al-Rudh, who traveled to the far horizons for hadith — Ibn Rahawayh, 'Ali ibn Hujr, Abu Kurayb; he died at Marw returning from his second hajj {cite:muntazam-ibn-al-jawzi p. 205}."
  es: "Abu Ya'qub al-Qattan de Marw al-Rudh, quien viajó a horizontes lejanos en busca de hadices: Ibn Rahawayh, 'Ali ibn Hujr, Abu Kurayb; murió en Marw regresando de su segundo hajj {citar:muntazam-ibn-al-jawzi p. 205}."
  fr: "Abu Ya'qub al-Qattan de Marw al-Rudh, qui a voyagé vers des horizons lointains pour des hadiths — Ibn Rahawayh, 'Ali ibn Hujr, Abu Kurayb; il mourut à Marw en revenant de son deuxième hajj {cite: muntazam-ibn-al-jawzi p. 205}."
  ur: "مرو الرض کے ابو یعقوب القطان، جنہوں نے حدیث کے لیے دور دراز کا سفر کیا - ابن راہویہ، علی ابن حجر، ابو کریب؛ آپ کا دوسرے حج سے واپسی پر مرو میں انتقال ہوا۔ 205}۔"
  tr: "Ebu Yakub el-Kattan el-Mervürudhi, hadis arayışında uzaklara seyahat etti; İbn Rehavey, Ali ibn Hajar ve Ebu Kurayb'dan rivayet etti. Ebu Bekir el-Şafii ondan rivayet etti ve güvenilir ve dürüsttü; Peygamber'in ikinci kanıtını bıraktıktan sonra Merw'de öldü {atıf:Münnazam-ibn cevzi, s. 205}."
  id: "Abu Yaqub al-Qattan al-Marwurudhi melakukan perjalanan jauh mencari hadits, yang diceritakan dari Ibn Rahawayh, Ali ibn Hajar, dan Abu Kurayb. Abu Bakr al-Shafi'i menceritakan darinya, dan ia dapat dipercaya serta jujur; ia meninggal di Marw setelah meninggalkan bukti kedua Nabi {cite:muntazam-ibn-al-jawzi, hlm. 205}."
