summary:
  ar: "يحيى المطالع بن إدريس الحمودي، ثالث خلفاء الحموديين في قرطبة؛ بويع مرتين ⁦(1021–1023م و1025–1026م)⁩ بين فتنة قرطبة، ثم تنازل وحكم ملقة حتى 1035م. {cite:bayan-mughrib-idhari}"
  en: "Yahya al-Mu'tali ibn Idris, the third Hammudid caliph in Cordoba; acclaimed twice (1021–1023 and 1025–1026) amid the fitna of Cordoba, then abdicated and ruled Malaga until 1035. {cite:bayan-mughrib-idhari}"
  ur: "یحییٰ المطالع بن ادریس حمودی، حمودیوں کا تیسرا خلیفہ قرطبہ میں؛ فتنہ قرطبہ میں دو بار خلافت ⁦(1021–1023 اور 1025–1026ء)⁩، پھر دستبردار ہو کر 1035ء تک مالقہ پر حکومت کی۔ {cite:bayan-mughrib-idhari}"
  es: "Yahya al-Mu'tali ibn Idris, tercer califa hammudid en Córdoba; aclamado dos veces (1021-1023 y 1025-1026) en medio de la fitna de Córdoba, luego abdicó y gobernó Málaga hasta 1035. {cite:bayan-mughrib-idhari}"
  fr: "Yahya al-Mu'tali ibn Idris, le troisième calife hammudide de Cordoue; acclamé deux fois (1021-1023 et 1025-1026) au milieu de la fitna de Cordoue, puis abdiqua et dirigea Malaga jusqu'en 1035. {cite: bayan-mughrib-idhari}"
  tr: "Yahya el-Matali' ibn İdris el-Hamudi, Cordoba'daki Hammudların üçüncü halifesi; Kordoba isyanı sırasında iki kez (1021–1023 ve 1025–1026 yılları arasında) bağlılık yemini etti, ardından tahttan çekildi ve 1035 yılına kadar Malakka'yı yönetti. {alıntı:Bayan-Muğrib-İdhari}"
  id: "Yahya al-Matali' ibn Idris al-Hamudi, khalifah ketiga Hammudid di Cordoba; ia mengikrarkan kesetiaan dua kali (1021–1023 M dan 1025–1026 M) selama pemberontakan Cordoba, lalu turun tahta dan memerintah Malaka hingga 1035 M. {cite:bayan-mughrib-idhari}"
