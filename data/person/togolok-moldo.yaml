summary:
  ar: "توغولوق مولدو (1860–1942)، وُلد باسم بايمبت عبد الرحمن أوغلو، شاعر وأقين قرغيزي ومناسشي أدى ملحمة «ماناس» ودوّن روايته منها، وله أيضًا كتاب «سانجيرا» في الأنساب؛ صارت صورته على ورقة العشرين سومًا القرغيزية."
  en: "Togolok Moldo (1860–1942), born Bayymbet Abdyrahman uulu, was a Kyrgyz poet, akyn and manaschi who performed the Epic of Manas and whose own written version of it was published in 2013; his genealogy Sanjira appeared in 2009. His portrait appears on the Kyrgyz 20 som note."
  ur: "توغولوق مولدو (1860–1942)، اصل نام بایمبت عبد الرحمن اوغلو، کرغیز شاعر، عقین اور مناسچی تھے جنہوں نے مہاکاوی «ماناس» سنائی اور اس کا اپنا نسخہ بھی قلمبند کیا؛ ان کی تصویر کرغیزستان کے 20 سوم کے نوٹ پر ہے۔"
