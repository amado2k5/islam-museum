label: { ar: "بجير بن ورقاء الصرعي", en: "Bujayr ibn Waraqa' al-Sura'i", es: "Bujayr ibn Waraqa' al-Sura'i", fr: "Bujayr ibn Waraqa' al-Sura'i", ur: "بُزیر بن ورقہ السرائی" }
summary:
  ar: "بجير بن ورقاء الصرعي من بني تميم؛ مضى في جماعة خلعوا ابن خازم إلى أبرشهر ثم أتبعه وهو يريد الترمذ فقاتله بقرب مرو وطعنه مع وكيع بن الدورقية ووثب على بكير بن وشاح في محبسه فقتله."
  en: "Bujayr ibn Waraqa' al-Sura'i of Tamim; with the party that renounced Ibn Khazim at Abarshahr, he pursued and stabbed him near Marw with Waki' ibn al-Dawraqiyya — and later leapt on the imprisoned Bukayr ibn Wishah and killed him."
  es: "Bujayr ibn Waraqa' al-Sura'i de Tamim; con el grupo que renunció a Ibn Khazim en Abarshahr, lo persiguió y lo apuñaló cerca de Marw con Waki' ibn al-Dawraqiyya, y luego saltó sobre el encarcelado Bukayr ibn Wishah y lo mató."
  fr: "Bujayr ibn Waraqa' al-Sura'i de Tamim; avec le groupe qui a renoncé à Ibn Khazim à Abarshahr, il le poursuivit et le poignarda près de Marw avec Waki' ibn al-Dawraqiyya — et plus tard, il sauta sur Bukayr ibn Wishah, emprisonné, et le tua."
  ur: "تمیم کی بوجائر بن ورقہ الصوری؛ ابرشہر میں ابن خزیم کو ترک کرنے والی جماعت کے ساتھ، اس نے وکیع بن الدورقیہ کے ساتھ مرو کے قریب اس کا تعاقب کیا اور اس کا پیچھا کیا اور بعد میں قید بکر ابن وشاح پر چھلانگ لگا کر اسے قتل کر دیا۔"
  tr: "Bujir ibn Warqa'al-Sar'i Banu Tamim'dendi; İbn Hazım'ı Abroşehr'e indiren bir gruba liderlik etti, ardından el-Tirmidh'i ararken onu takip etti. Marw yakınlarında onunla savaştı, Waki' ibn al-Durqiyya ile birlikte onu bıçakladı ve hapishanesinde Bukayr bin Vasah'ın üzerine atlayıp öldürdü."
  id: "Bujir ibn Warqa' al-Sar'i dari Banu Tamim; ia memimpin kelompok yang menggulingkan Ibn Khazim ke Abroshahr, lalu mengikutinya saat ia mencari al-Tirmidh. Ia melawannya di dekat Marw, menikamnya bersama Waki' ibn al-Durqiyya, dan melompat ke Bukayr ibn Washah di penjaranya dan membunuhnya."
