summary:
  ar: "الحسين بن علي بن ثابت أبو عبد الله المقرئ (ت 378هـ)؛ ولد أعمى وكان حافظاً يحضر مجلس ابن الأنباري فيحفظ ما يمليه، وهو صاحب القصيدة في قراءة السبعة عملها في حياة النقاش فأعجب بها النقاش وشيوخ زمانه، وكان ظريفاً حسن الزي؛ توفي في رمضان سنة ثمان وسبعين وثلثمائة {cite:muntazam-ibn-al-jawzi j.7 p.146}."
  en: "Al-Husayn b. 'Ali b. Thabit Abu 'Abd Allah the qari' (d. 378), blind from birth: he attended Ibn al-Anbari's circle and memorised whatever was dictated, and composed his qasida on the Seven Readings in al-Naqqash's lifetime — admired by al-Naqqash and the shaykhs of the age; a man of wit and fine dress, he died in Ramadan 378 {cite:muntazam-ibn-al-jawzi j.7 p.146}."
