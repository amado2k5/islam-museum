summary:
  ar: "الحسين بن علي بن ثابت أبو عبد الله المقرئ ⁦(ت 378هـ)⁩؛ ولد أعمى وكان حافظاً يحضر مجلس ابن الأنباري فيحفظ ما يمليه، وهو صاحب القصيدة في قراءة السبعة عملها في حياة النقاش فأعجب بها النقاش وشيوخ زمانه، وكان ظريفاً حسن الزي؛ توفي في رمضان سنة ثمان وسبعين وثلثمائة {cite:muntazam-ibn-al-jawzi j.7 p.146}."
  en: "Al-Husayn b. 'Ali b. Thabit Abu 'Abd Allah the qari' (d. 378), blind from birth: he attended Ibn al-Anbari's circle and memorised whatever was dictated, and composed his qasida on the Seven Readings in al-Naqqash's lifetime — admired by al-Naqqash and the shaykhs of the age; a man of wit and fine dress, he died in Ramadan 378 {cite:muntazam-ibn-al-jawzi j.7 p.146}."
  es: "Al-Husayn b. 'Ali b. Thabit Abu 'Abd Allah el qari' (m. 378), ciego de nacimiento: asistió al círculo de Ibn al-Anbari y memorizó todo lo que se le dictaba, y compuso su qasida sobre las Siete Lecturas en vida de al-Naqqash; admirado por al-Naqqash y los shaykhs de la época; hombre ingenioso y de buena vestimenta, murió en Ramadán 378 {cite:muntazam-ibn-al-jawzi j.7 p.146}."
  fr: "Al-Husayn b. 'Ali b. Thabit Abu 'Abd Allah le qari' (d. 378), aveugle de naissance: il fréquenta le cercle d'Ibn al-Anbari et mémorisa tout ce qui lui était dicté, et composa sa qasida sur les Sept Lectures du vivant d'al-Naqqash — admiré par al-Naqqash et les cheikhs de l'époque; homme d'esprit et de belle tenue, il mourut en Ramadan 378 {cite:muntazam-ibn-al-jawzi j.7 p.146}."
  ur: "الحسین بی علی بی۔ ثابت ابو عبداللہ قاری ⁦(متوفی 378)⁩، پیدائش سے نابینا: اس نے ابن الانباری کے حلقہ میں حاضری دی اور جو کچھ حکم دیا گیا اسے حفظ کیا، اور نقاش کی زندگی میں سات قراء ات پر اپنا قصیدہ تحریر کیا، جس کی تعریف النقاش اور عمر کے شیخوں نے کی۔ ایک ذہین اور عمدہ لباس والا، رمضان 378 میں وفات پائی۔"
  tr: "El-Hüseyin bin Ali ibn Tebit Ebu Abdullah el-Muqri (ö. 378 H.); kör doğan Esker, İbn el-Anbari'nin toplantılarına katılan ve dikte ettiklerini ezberleyen bir ezberciydi. Yedi ayeti okuyarak yazdığı şiirin yazarıydı; bu şiir münazaracıyı ve zamanının şeyhlerini etkiledi. Zarif ve şık giyimliydi; Ramazan'da 378 Hicri yılında vefat etti {citasyon:münezem ibn-al-jawzi J.7 s.146}."
  id: "Al-Husayn ibn Ali ibn Thabit Abu Abdullah al-Muqri (wafat 378 H); lahir buta, ia adalah seorang penghafal yang menghadiri pertemuan Ibn al-Anbari dan menghafal apa yang ia diktekan. Ia adalah penulis puisi tentang pembacaan tujuh bait, yang mengesankan para pendebat dan para sheikh pada zamannya. Ia anggun dan berpakaian rapi; ia meninggal pada bulan Ramadan tahun 378 H {cite:muntazam-ibn-al-jawzi J.7 hlm.146}."
