id: person/al-ashraf-shaban
class: person
label: { ar: "الملك الأشرف شعبان بن حسين", en: "al-Malik al-Ashraf Sha'ban ibn Husayn", fr: "Al-Malik al-Ashraf Sha’ban ibn Husayn", es: "al-Malik al-Ashraf Sha'ban ibn Husayn", ur: "المالک الاشرف شعبان ابن حسین" }
summary:
  ar: "سلطان مملوكي، ولي سنة أربع وستين وسبع مئة بعد خلع المنصور محمد وهو شعبان بن حسين بن الناصر محمد بن قلاوون، وفي سنة ثلاث وسبعين أحدث العلامة الخضراء على عمائم الشرفاء، وفي سنة ثمان وسبعين سافر إلى الحج ومعه الخليفة والقضاة والأمراء فخامر عليه الأمراء وفر راجعاً إلى القاهرة واختفى إلى أن ظفروا به فخنقوه في ذي القعدة وتسلطن ابنه علي المنصور {cite:tarikh-khulafa-minhaj-1434 p. 757-759}."
  en: "Mamluk sultan from 764, maker of the ashraf's green turban-badge; betrayed by his amirs on the hajj road in 778, he fled, hid, and was strangled in Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 757-759}."
  fr: "Sultan mamelouk à partir de 764 H, créateur de la marque verte sur le turban des chérifs ; trahi par ses émirs sur la route du hajj en 778 H, il s’enfuit, se cacha et fut étranglé en dhu al-qi’da {cite:tarikh-khulafa-minhaj-1434 p. 757-759}."
  es: "Sultan mameluco desde 764, creador del emblema verde del turbante del ashraf; traicionado por sus emires en el camino del Hajj en 778, huyó, se escondió y fue estrangulado en Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 757-759}."
  ur: "764 کا مملوک سلطان، اشرف کی سبز پگڑی کے بیج بنانے والا؛ 778 میں حج روڈ پر اس کے امیروں کے ساتھ دھوکہ ہوا، وہ بھاگ گیا، چھپ گیا اور ذوالقعدہ میں گلا گھونٹ دیا گیا۔ 757-759}۔"
  tr: "Memlük sultanlarından biri olan ve 764 yılında El-Mansur Muhammed'in tahttan indirilmesinin ardından tahta geçen Şaban bin Hüseyin bin El-Nasır Muhammed bin Kalevun, 73 yılında soyluların sarıklarına yeşil bir işaret koydurdu. 78 yılında halife, kadılar ve prenslerle birlikte Hacca gitti, ancak prensler ona karşı komplo kurdular ve Kahire'ye kaçarak saklandı. Daha sonra yakalanıp Zülkade'de boğularak öldürüldü ve oğlu Ali el-Mansur sultan oldu. {cite:tarikh-khulafa-minhaj-1434 s. 757-759}"
  id: "Seorang sultan Mamluk, yang diangkat pada tahun 764 setelah penggulingan Al-Mansur Muhammad, adalah Sha’ban bin Hussein bin Al-Nasir Muhammad bin Qalawun. Pada tahun 73, ia memperkenalkan tanda hijau pada sorban para bangsawan. Pada tahun 78, ia pergi ke Haji bersama Khalifah, para hakim, dan para pangeran, tetapi para pangeran bersekongkol melawannya dan ia melarikan diri kembali ke Kairo dan bersembunyi sampai mereka menangkapnya dan mencekiknya pada Dzul Qa'dah dan putranya Ali al-Mansur menjadi sultan {cite:tarikh-khulafa-minhaj-1434 p. 757-759}."
