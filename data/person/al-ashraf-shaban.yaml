label: { ar: "الملك الأشرف شعبان بن حسين" }
summary:
  ar: "سلطان مملوكي، ولي سنة أربع وستين وسبع مئة بعد خلع المنصور محمد وهو شعبان بن حسين بن الناصر محمد بن قلاوون، وفي سنة ثلاث وسبعين أحدث العلامة الخضراء على عمائم الشرفاء، وفي سنة ثمان وسبعين سافر إلى الحج ومعه الخليفة والقضاة والأمراء فخامر عليه الأمراء وفر راجعاً إلى القاهرة واختفى إلى أن ظفروا به فخنقوه في ذي القعدة وتسلطن ابنه علي المنصور {cite:tarikh-khulafa-minhaj-1434 p. 757-759}."
  en: "Mamluk sultan from 764, maker of the ashraf's green turban-badge; betrayed by his amirs on the hajj road in 778, he fled, hid, and was strangled in Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 757-759}."
