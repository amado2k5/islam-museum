summary:
  ar: "لغوي وعالم وناقد أدبي أردي (1870–1961)، يُلقب بـ«أبو الأردية» (بابائے اردو). شغل أمانة «أنجمن ترقي اردو» عقودا، وألّف قاموسا معياريا إنجليزيا–أرديا، وكان من أبرز المطالبين بجعل الأردية اللغة الوطنية لباكستان."
  en: "Urdu linguist, scholar and literary critic (1870–1961), known as Baba-e-Urdu ('Father of Urdu'). He was for decades secretary of the Anjuman-i Taraqqi-i Urdu, compiled a standard English–Urdu dictionary, and campaigned for Urdu to be made the national language of Pakistan."
  ur: "اردو کے ماہر لسانیات، عالم اور ادبی نقاد (1870ء–1961ء)، جو «بابائے اردو» کے لقب سے مشہور ہیں۔ وہ برسوں انجمن ترقی اردو کے سیکرٹری رہے، ایک معیاری انگریزی–اردو لغت مرتب کی اور اردو کو پاکستان کی قومی زبان بنانے کے بڑے داعی تھے۔"
