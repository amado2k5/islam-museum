summary:
  ar: 'صحابي من بني عبد الأشهل؛ ذكره موسى بن عقبة فيمن شهد بدراً، وقال إنه ممن شارك في قتل كعب بن الأشرف، وقالت عائشة إن ثلاثة من الأنصار لم يكن أحد يعتد عليهم فضلاً: أسيد بن حضير وسعد بن معاذ وعباد بن بشر. وفي الصحيح خرج هو وأسيد بن حضير من عند النبي في ليلة مظلمة فإذا نور بين أيديهما حتى تفرقا {cite:sahih-al-bukhari 3805}.'
  en: 'A Companion of Banu Abd al-Ashhal; Musa ibn Uqba lists him among those at Badr and says he took part in the killing of Ka''b ibn al-Ashraf; Aisha said three of the Ansar had no one to rival them in merit: Usayd ibn Hudayr, Sa''d ibn Mu''adh
    and Abbad ibn Bishr.'
