summary:
  ar: "شاعر أردي وفارسي، من أخلاء أحمد شاه ملك دهلي، وُلد في دهلي حوالي سنة 1140هـ ⁦(1727م)⁩، وكان تخلصه «فغان»، وتوفي في عظيم آباد ⁦(باتنا)⁩ سنة 1186هـ ⁦(1772-1773م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}."
  en: "Urdu and Persian poet, foster-brother of Ahmad Shah of Delhi, born in Delhi about 1140 AH (1727); his pen-name was Fighan, and he died at 'Azimabad (Patna) in 1186 AH (1772-1773) {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}."
  es: "Poeta urdu y persa, hermano adoptivo de Ahmad Shah de Delhi, nacido en Delhi alrededor del año 1140 AH (1727); su seudónimo era Fighan, y murió en 'Azimabad (Patna) en el año 1186 AH (1772-1773) {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}."
  fr: "Poète ourdou et persan, frère adoptif d'Ahmad Shah de Delhi, né à Delhi vers 1140 AH (1727); son nom de plume était Fighan, et il est mort à 'Azimabad (Patna) en 1186 AH (1772-1773) {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}."
  ur: "اردو اور فارسی شاعر، احمد شاہ دہلی کے رضاعی بھائی، دہلی میں تقریباً 1140 ہجری (1727) پیدا ہوئے۔ ان کا قلمی نام فغان تھا اور ان کا انتقال عظیم آباد ⁦(پٹنہ)⁩ میں 1186ھ (1772-1773) میں ہوا۔ 1 ص۔ 751}۔"
  tr: "Urdu ve Fars şairi, Delhi Kralı Ahmed Şah'ın soyundan gelen, yaklaşık 1140 Hicri (1727 MS) yılında Delhi'de doğmuş, takma adı 'Faghan' idi ve 1186 Hicri (1772-1773) yılında Azimabad (Patna)'da ölmüştür. {atıf:İslam Ansiklopedisi-2 cilt 1, s. 751}."
  id: "Seorang penyair Urdu dan Persia, keturunan Ahmad Shah, Raja Delhi, lahir di Delhi sekitar tahun 1140 H (1727 M), nama penanya adalah 'Faghan', dan ia meninggal di Azimabad (Patna) pada tahun 1186 H (1772-1773 M) {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 751}."
