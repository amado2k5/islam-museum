summary:
  ar: "أبو علي الزجاجي الطبري، من أصحاب أبي العباس ابن القاص، وله كتاب «زيادة المفتاح»، وعنه أخذ فقهاء آمل، ودرس عليه شيخ الشيرازي القاضي أبو الطيب {cite:tabaqat-fuqaha-abbas-1981 p. 61}. لم يذكر الشيرازي تاريخ وفاته."
  en: "Abu Ali al-Zajjaji al-Tabari, one of the companions of Abu al-Abbas Ibn al-Qass and author of «Ziyadat al-Miftah»; the jurists of Amol learned from him, and Abu al-Tayyib the qadi, the teacher of al-Shirazi, studied under him {cite:tabaqat-fuqaha-abbas-1981 p. 61}. al-Shirazi does not mention the date of his death."
