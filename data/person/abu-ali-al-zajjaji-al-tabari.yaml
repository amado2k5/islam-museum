summary:
  ar: "أبو علي الزجاجي الطبري، من أصحاب أبي العباس ابن القاص، وله كتاب «زيادة المفتاح»، وعنه أخذ فقهاء آمل، ودرس عليه شيخ الشيرازي القاضي أبو الطيب {cite:tabaqat-fuqaha-abbas-1981 p. 61}. لم يذكر الشيرازي تاريخ وفاته."
  en: "Abu Ali al-Zajjaji al-Tabari, one of the companions of Abu al-Abbas Ibn al-Qass and author of «Ziyadat al-Miftah»; the jurists of Amol learned from him, and Abu al-Tayyib the qadi, the teacher of al-Shirazi, studied under him {cite:tabaqat-fuqaha-abbas-1981 p. 61}. al-Shirazi does not mention the date of his death."
  fr: "Abu Ali al-Zajjaji al-Tabari, l'un des compagnons d'Abu al-Abbas Ibn al-Qass et auteur de «Ziyadat al-Miftah» ; les juristes d'Amol étudièrent auprès de lui, et le cadi Abu al-Tayyib, maître d'al-Shirazi, fut son élève {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Al-Shirazi ne mentionne pas la date de sa mort."
  es: "Abu Ali al-Zajjaji al-Tabari, uno de los compañeros de Abu al-Abbas Ibn al-Qass y autor de «Ziyadat al-Miftah»; los juristas de Amol aprendieron de él, y Abu al-Tayyib el cadí, maestro de al-Shirazi, estudió con él {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Al-Shirazi no menciona la fecha de su muerte."
  ur: "ابو علی الزجاجی الطبری، ابو العباس ابن القاس کے اصحاب میں سے ایک اور «زیادۃ المفتاح» کے مصنف؛ امول کے فقہاء نے ان سے علم حاصل کیا اور الشرازی کے استاد ابو الطیب قاضی نے ان سے تعلیم حاصل کی۔ 61}۔ الشیرازی نے اپنی وفات کی تاریخ کا ذکر نہیں کیا۔"
