id: person/al-muhallabi-al-wazir
class: person
label: { ar: "الوزير المهلبي", en: "al-Wazir al-Muhallabi", fr: "al-Wazir al-Muhallabi", ur: "وزیر مہلبی", es: "al-Wazir al-Muhallabi" }
summary:
  ar: "وزير معز الدولة، أشار عليه لما محي ما كتبت الشيعة على أبواب المساجد من اللعن أن يكتب مكان ما محي لعن الله الظالمين لآل رسول الله وصرحوا بلعنة معاوية فقط {cite:tarikh-khulafa-minhaj-1434 p. 619}. وعند ابن الأثير أبو محمد الحسن بن محمد المهلبي صاحب معز الدولة؛ قدم إلى بغداد قبله فاجتمع بابن شيرزاد في الموضع الذي استتر فيه ثم اجتمع بالمستكفى فأظهر المستكفي السرور بقدوم معز الدولة وأعلمه أنه إنما استتر من الأتراك ليتفرقوا فيحصل الأمر لمعز الدولة بلا قتال {cite:kamil-ibn-al-athir p. 336}"
  en: "Mu'izz al-Dawla's vizier; when the curses the Shi'a wrote on the mosque doors were erased he counselled writing instead 'God curse the wrongdoers of the Prophet's house' — Mu'awiya's curse alone remaining explicit {cite:tarikh-khulafa-minhaj-1434 p. 619}."
  fr: "Le vizir de Mu’izz al-Dawla  ; quand les malédictions que les chiites ont écrites sur les portes de la mosquée ont été effacées, il a conseillé d’écrire à la place « Dieu maudit les injustes de la maison du Prophète  » – la malédiction de Mu’awiya seule restant explicite {cite:tarikh-khulafa-minhaj-1434 p. 619}."
  es: "El visir de Mu'izz al-Dawla, cuando se borraron las maldiciones que los chiítas escribieron en las puertas de la mezquita, aconsejó escribir en su lugar \"Que Dios maldiga a los malhechores de la casa del Profeta\" — solo la maldición de Mu'awiya permaneció explícita {cite:tarikh-khulafa-minhaj-1434 p. 619}."
  ur: "معز الدولہ کا وزیر؛ جب شیعوں کی طرف سے مسجد کے دروازوں پر لکھی گئی لعنت مٹائی گئی تو انہوں نے اس کے بجائے لکھنے کی نصیحت کی کہ 'خدا کی لعنت ہو رسول کے گھر کے ظالموں پر' - صرف معاویہ کی لعنت ہی واضح رہ گئی۔ 619}۔"
  tr: "Mu'izz al-Dawla Bakanı, Şiilerin cami kapılarında yazdıklarını silerken, nereye silsin 'Allah'ın Resami'nin ailesinin zalimlerine 'Allah'ın laneti' yazması gerektiğini işaret eden, ve sadece Muaviye'nin lanetini ilan ettiler {atıf:Tarih-Khulafa-minhaj-1434, s. 619}. Mu'izz al-Dawla'nın sahabesi İbn al-Athir'e göre, Mu'izz al-Dawla'nın yoldaşı Ebu Muhammed el-Hasan ibn Muhammed el-Muhallabi'ye göre, ondan önce Bağdat'a gelmiş, saklandığı yerde İbn Şirzad ile görüşmüş, ardından el-Mustakfi ile görüşmüştür; Mustakfi Mu'izz al-Dawla'nın gelişine sevinç göstermiş ve ona sadece Türklerden saklanmak için saklandığını bildirmiştir; böylece Mu'izz al-Dawla'nın işi kavga edilmeden çözülecektir. {atıf:Kamil-ibn-al-Athir s. 336}"
  id: "Menteri Mu'izz al-Dawla, yang menunjuk kepadanya ketika menghapus apa yang ditulis Syiah di pintu masjid tentang kutukan, bahwa di mana pun dia menghapusnya, dia harus menulis 'Kutukan Tuhan atas para penindas keluarga Rasul Allah,' dan mereka hanya menyatakan kutukan Muawiya {cite:Sejarah-Khulafa-minhaj-1434, hlm. 619}. Menurut Ibn al-Athir, Abu Muhammad al-Hasan ibn Muhammad al-Muhallabi, sahabat Mu'izz al-Dawla, ia datang ke Baghdad sebelum dia, bertemu dengan Ibn Shirzad di tempat ia bersembunyi, lalu bertemu dengan al-Mustakfi, yang menunjukkan kegembiraan atas kedatangan Mu'izz al-Dawla dan memberitahunya bahwa ia hanya bersembunyi dari Turki agar mereka berpisah, sehingga urusan itu dapat diselesaikan untuk Mu'izz al-Dawla tanpa perlawanan. {sitasi: Kamil-ibn-al-Athir hlm. 336}"
