id: person/al-muhallabi-al-wazir
class: person
label: { ar: "الوزير المهلبي" }
summary:
  ar: "وزير معز الدولة، أشار عليه لما محي ما كتبت الشيعة على أبواب المساجد من اللعن أن يكتب مكان ما محي لعن الله الظالمين لآل رسول الله وصرحوا بلعنة معاوية فقط {cite:tarikh-khulafa-minhaj-1434 p. 619}. وعند ابن الأثير أبو محمد الحسن بن محمد المهلبي صاحب معز الدولة؛ قدم إلى بغداد قبله فاجتمع بابن شيرزاد في الموضع الذي استتر فيه ثم اجتمع بالمستكفى فأظهر المستكفي السرور بقدوم معز الدولة وأعلمه أنه إنما استتر من الأتراك ليتفرقوا فيحصل الأمر لمعز الدولة بلا قتال {cite:kamil-ibn-al-athir p. 336}"
  en: "Mu'izz al-Dawla's vizier; when the curses the Shi'a wrote on the mosque doors were erased he counselled writing instead 'God curse the wrongdoers of the Prophet's house' — Mu'awiya's curse alone remaining explicit {cite:tarikh-khulafa-minhaj-1434 p. 619}."
