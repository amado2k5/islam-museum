  id: "Kartu awal oleh Suzi Çelebi Brizreni, seorang penyair dan sejarawan Ottoman abad ke-15, yang meninggal pada tahun 1524 M; ia dikenang dalam buku-buku sastra, namun terjemahannya belum pernah diulas di halaman."
