summary:
  ar: 'ابن أخي خديجة، من سادات قريش؛ شهد بدراً مع المشركين ونجا، وتأخر إسلامه إلى عام الفتح، وقال النبي: «من دخل دار حكيم بن حزام فهو آمن»، وكان من المؤلفة قلوبهم وأعطي من غنائم حنين مئة بعير.'
  en: A nephew of Khadija and a leader of Quraysh; he fought at Badr with the polytheists and escaped, embraced Islam in the year of the conquest, and the Prophet declared the house of Hakim ibn Hizam a place of safety; he was among those whose
    hearts were reconciled and received a hundred camels from the spoils of Hunayn.
