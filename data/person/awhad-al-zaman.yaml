label: { ar: "أوحد الزمان ابن ملكان", en: "Awhad al-Zaman Ibn Malikan" }
summary:
  ar: "أوحد الزمان أبو البركات هبة الله بن علي بن ملكان الحكيم المشهور؛ صاحب كتاب «المعتبر» في الحكمة وقد عدّه القفطي من أجلّ كتبه؛ كان بينه وبين أمين الدولة ابن التلميذ تنافر وتنافس ومجالس مشهورة؛ وكان يهودياً ثم أسلم في آخر عمره؛ وأصابه الجذام فعالج نفسه بتسليط الأفاعي على جسده بعد أن جوّعها فبالغت في نهشه فبُرئ من الجذام وعمي وقصته في ذلك مشهورة {cite:wafayat-ayan}."
  en: "Awhad al-Zaman Abu al-Barakat Hibat Allah b. Ali b. Malikan — the celebrated philosopher-physician, author of al-Mu'tabar; Ibn al-Tilmidh's great rival; a Jew who converted to Islam late in life, and famously cured his own leprosy with starved-snake bites at the price of his eyesight {cite:wafayat-ayan}."
