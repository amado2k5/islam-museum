gender: female
roles: [poet]
summary:
  ar: "خطيبة من الكوفة من ربات الفصاحة والرأي، ناصرت علي بن أبي طالب يوم صفين على جمل أحمر بين الصفين، ثم أوفدها معاوية إليه فأكرمها وأقطعها ضيعة؛ يروي خبرها كحالة عن بلاغات النساء وغيره."
  en: "An orator of Kufa known for eloquence and judgement, who supported Ali ibn Abi Talib at Siffin from a red camel between the battle lines; Mu'awiya later summoned her, honoured her and granted her an estate. Kahhala tells her story from Balaghat al-Nisa' and other works."
  fr: "Un orateur de Koufa connu pour son éloquence et son jugement, qui a soutenu Ali ibn Abi Talib à Siffin à partir d'un chameau rouge entre les lignes de bataille ; Mu'awiya l'invoqua plus tard, l'honora et lui accorda une succession. Kahhala raconte son histoire à partir de Balaghat al-Nisa' et d'autres œuvres."
  ur: "کوفہ کی ایک فصیح و صاحبِ رائے خطیبہ جنہوں نے صفین میں دونوں صفوں کے بیچ سرخ اونٹ پر سوار ہو کر علی بن ابی طالب کی حمایت کی؛ بعد میں معاویہ نے انہیں بلوا کر عزت دی اور جاگیر عطا کی۔ کحالہ بلاغات النساء وغیرہ سے ان کا واقعہ نقل کرتے ہیں۔"
  es: "Oradora de Kufa, conocida por su elocuencia y buen juicio, apoyó a Ali ibn Abi Talib en Siffin desde un camello rojo entre las líneas del frente. Posteriormente, Mu'awiya la convocó, la honró y le concedió una propiedad. Kahhala narra su historia en Balaghat al-Nisa' y otras obras."
  tr: "Kufa'dan bir vaiz, hitabet ve görüş sahibi bir kadın, Sifin gününde Ali ibn Ebi Talib'i iki Sifinin arasında kırmızı bir deve üzerinde desteklemiştir. Sonra Muaviye onu yanına göndermiş, onurlandırmış ve çiftlik olarak kesmiştir; hikayesini kadınların ve başkalarının taşınmasıyla ilgili bir vaka gibi anlatır."
  id: "Seorang pendakwah dari Kufa, seorang wanita yang fasih dan berpendapat, yang mendukung Ali ibn Abi Talib pada hari Siffin di atas unta merah di antara dua Siffin. Kemudian Muawiyah mengirimnya kepadanya, menghormatinya, dan memotong hubungan mereka sebagai sebuah peternakan; ia menceritakan kisahnya seperti kasus tentang pengangkutan wanita dan lainnya."
