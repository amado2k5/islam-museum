gender: female
roles: [poet]
summary:
  ar: "خطيبة من الكوفة من ربات الفصاحة والرأي، ناصرت علي بن أبي طالب يوم صفين على جمل أحمر بين الصفين، ثم أوفدها معاوية إليه فأكرمها وأقطعها ضيعة؛ يروي خبرها كحالة عن بلاغات النساء وغيره."
  en: "An orator of Kufa known for eloquence and judgement, who supported Ali ibn Abi Talib at Siffin from a red camel between the battle lines; Mu'awiya later summoned her, honoured her and granted her an estate. Kahhala tells her story from Balaghat al-Nisa' and other works."
  ur: "کوفہ کی ایک فصیح و صاحبِ رائے خطیبہ جنہوں نے صفین میں دونوں صفوں کے بیچ سرخ اونٹ پر سوار ہو کر علی بن ابی طالب کی حمایت کی؛ بعد میں معاویہ نے انہیں بلوا کر عزت دی اور جاگیر عطا کی۔ کحالہ بلاغات النساء وغیرہ سے ان کا واقعہ نقل کرتے ہیں۔"
