class: person
label: { ar: "زبيدة بنت جعفر", en: "Zubayda bint Ja'far", es: "Zubayda bint Ja'far", fr: "Zubayda bint Ja'far", ur: "زبیدہ بنت جعفر" }
summary:
  ar: "أم جعفر زبيدة بنت جعفر بن المنصور؛ عند البلاذري كان أول من حفر نهر الميمون وكيلاً لها يقال له سعيد بن زيد. وعند المسعودي أنها أحسن الناس فعلاً في أيام الرشيد لما أحدثته من بناء دور السبيل بمكة واتخاذ المصانع والبرك والآبار ودور التسبيل بالثغر الشامي وطرسوس وأوقفت على ذلك الوقوف، وأنها حفرت العين المعروفة بعين المشاش بالحجاز ومهدت الطريق لمائها حتى أخرجتها من مسافة اثني عشر ميلاً إلى مكة فكان جملة ما أنفقت عليها ألف ألف وسبعمائة ألف دينار، وهي أول من اتخذ الآلة من الذهب والفضة المكللة بالجوهر وصنع لها الوشي حتى بلغ الثوب خمسين ديناراً، وأول من اتخذ الشاكرية من الخدم والجواري والقباب من الفضة والأبنوس والصندل والخفاف المرصعة بالجوهر وشمع العنبر، ولما رأت شغف ولدها الأمين بالخدم اتخذت الجواري المقدودات الحسان وعممت رؤوسهن وجعلت لهن الطرر والأصداغ والأقفية وألبستهن الأقبية والقراطق والمناطق فسمين الغلاميات واقتدى بها الناس {cite:muruj-al-dhahab p. 671-672}، وعند المسعودي دخلت على الرشيد تقول ما أنصفت ابنك محمداً حيث وليته العراق وأعريته عن العدد والقواد وصيرت ذلك إلى عبد الله، فقال لها وما أنت وتمييز الأعمال وليت ابنك السلم وعبد الله الحرب، واضطغنت على جعفر بن يحيى حين رد الأمين يحلف فكانت أحد من حرض على أمره {cite:muruj-al-dhahab p. 340-341}، وقال العبدي عند المسعودي برزت في الجد والهزل، حفرت العين المعروفة بعين المشاش بالحجاز ومهدت الطريق لمائها في كل خفض ورفع وجبل ووعر حتى أخرجتها من اثني عشر ميلاً إلى مكة وأنفقت عليها ألف ألف وسبعمائة ألف دينار، وهي أول من اتخذ الآلة من الذهب والفضة المكللة بالجوهر حتى بلغ ثوب الوشي خمسين ديناراً، وأول من اتخذ الشاكرية من الخدم والجواري، وأول من اتخذ القباب من الفضة والأبنوس والصندل {cite:muruj-al-dhahab p. 670-671}، وعند المسعودي حج صالح بن الرشيد بالناس سنة ثمان ومائتين ومعه زبيدة إلى سنة عشر ومائتين {cite:muruj-al-dhahab p. 747}"
  en: "Umm Ja'far Zubayda bint Ja'far ibn al-Mansur; in al-Baladhuri the first digger of Nahr al-Maymun was her agent, a man called Sa'id ibn Zayd."
  es: "Umm Ja'far Zubayda bint Ja'far ibn al-Mansur; En al-Baladhuri, el primer excavador de Nahr al-Maymun fue su agente, un hombre llamado Sa'id ibn Zayd."
  fr: "Umm Ja'far Zubayda bint Ja'far ibn al-Mansur; à al-Baladhuri, le premier creuseur de Nahr al-Maymun était son agent, un homme appelé Sa'id ibn Zayd."
  ur: "ام جعفر زبیدہ بنت جعفر ابن المنصور؛ البلادوری میں نہر المیمون کا پہلا کھودنے والا اس کا ایجنٹ تھا، ایک شخص جسے سعید بن زید کہتے تھے۔"
  tr: "um Ca'far Zubeydah bint Ja'far ibn al-Mansur; el-Baladhuri'ye göre, Maymun Nehri'ni ilk kazan onun ajanı Saeed ibn Zayd'dı. El-Mes'udi'ye göre, El-Reşid döneminde Mekke'de Sabil evlerini inşa etmek, Şami sınırı ve Tarsus'ta fabrikalar, havuzlar, kuyular ve hamamlar kurmak ve bunları davaya adamak için gerçekten en iyisiydi. Ayrıca Hicaz'da bilinen Ayn Eşel-Maşaş'ı kazdı ve suyunun yolunu açtı, ardından onu on iki mil mesafeden Mekke'ye getirdi ve toplamda bin yedi yüz bin dinar elde etti. Altın ve gümüşle süslenmiş altın ve gümüş bir aleti ilk benimseyen kişi oldu ve giysi elliye ulaşana kadar ona washi yaptı Dinar ve şakiriya'yı ilk olarak gümüş, abanoz, sandalet ve mücevher ile kehribar balmumu süslü terliklerden yapılmış hizmetçilerden, cariyelerden aldı. Güvenilir oğlunun hizmetçilere olan tutkusunu görünce, yakışıklı hizmetçileri aldı, başlarını bağladı, onlara tarar, sandalet ve kelepçe yaptı, bodrumlara, kortikolara ve alanlara giydirdi, böylece köle olarak adlandırıldılar ve insanlar onun örneğini takip etti {cite:muruj-al-dhahab, s. 671-672}. El-Mas'udi'de Al-Rashid'e girdi ve dedi ki, \"Oğlun Muhammed'i Irak olarak atadığında ona ne kadar iyisin, ben de ona sayıdan ve komutanından ödünç verdim, bunu Abdullah'a götürdüm.\" O ona, \"Sen nesin?\" dedi. Oğullarına ve Abdullah al-Harb'a barış diledilerek yaptıklarını ayırt etti ve güvenilir kişi yemin etmek için geri döndüğünde Ja'far bin Yahya'ya kızdı, bu yüzden onun emrini kışkırtanlardan biri oldu {cite:muruj-al-dhahab s. 340-341}. Al-Abdi, Al-Mas'udi'de ciddiyeti ve şakalarıyla öne çıktığını söyledi. Hicaz'da Ain al-Mashash olarak bilinen kuyuyu kazdı ve suyunun her vadi, yükselti, dağ ve engebeli arazide yolunu açtı, ta ki onu on iki mil uzaklıktaki Mekke'ye getirip bin yedi yüz bin dinar harcayana kadar. Altın ve gümüşten yapılmış bir aleti ilk kullanan oydu mücevher olarak el-vaşi'nin kıyafeti elli dinara ulaşana kadar sürdü. Şakiriya'yı hizmetçiler ve hizmetçiler arasında ilk benimseyen ve gümüş, abanoz ve sandaletlerden yapılmış kubbeleri kullanan ilk kişiydi {cite:muruj-al-dhahab s. 670-671}. al-Mas'udi'ye göre, Salih ibn al-Rashid, iki yüz sekiz yılında, Zubaida eşliğinde halkla Hac yapmış, iki yüz yıla kadar {cite:muruj-al-dhahab, s. 747}"
  id: "um Ja'far Zubaydah bint Ja'far ibn al-Mansur; menurut al-Baladhuri, yang pertama menggali Sungai Maymun adalah agennya bernama Saeed ibn Zayd. Menurut Al-Mas'udi, dia benar-benar orang terbaik pada masa Al-Rashid karena membangun rumah Sabil di Mekah, mendirikan pabrik, kolam, sumur, dan rumah mandi di perbatasan Shami dan Tarsus, serta mendedikasikan ini untuk tujuan tersebut. Dia juga menggali Ain Al-Mashash yang terkenal di Hijaz dan membuka jalan untuk airnya sampai membawanya keluar dari jarak dua belas mil ke Mekah, menghasilkan total seribu tujuh ratus ribu dinar. Dia adalah yang pertama mengadopsi alat emas dan perak yang dihiasi emas dan perak dan membuat washi untuk itu sampai pakaian itu mencapai usia lima puluh Dinar, dan yang pertama mengambil Shakiriya dari pelayan, selir, dan kubah yang terbuat dari perak, ebony, sandal, dan sandal yang dihiasi permata dan lilin amber. Ketika dia melihat hasrat putranya yang setia terhadap pelayan, dia mengambil pelayan tampan, mengikat kepala mereka, membuat tarar, sandal, dan borgol, memakaikan mereka di ruang bawah tanah, kortiko, dan area, sehingga mereka dinamai budak, dan orang-orang mengikuti teladannya {cite:muruj-al-dhahab, hlm. 671-672}. Di Al-Mas'udi, dia masuk kepada Al-Rashid dan berkata, \"Betapa baiknya kamu kepada putramu Muhammad ketika dia mengangkatnya sebagai Irak, dan aku meminjamkan jumlah dan komandan kepadanya, dan aku membawa ini kepada Abdullah.\" Dia berkata kepadanya, \"Dan kamu siapa?\" Ia membuktikan perbuatannya, mendoakan putranya damai dan Abdullah al-Harb, dan ia marah kepada Ja'far ibn Yahya ketika yang dipercaya kembali untuk bersumpah, sehingga ia menjadi salah satu yang menghasut melawan perintahnya {cite:muruj-al-dhahab hlm. 340-341}. Al-Abdi berkata dalam Al-Mas'udi bahwa ia menonjol dalam keseriusan dan bercanda. Ia menggali sumur yang dikenal sebagai Ain al-Mashash di Hijaz, dan membuka jalan untuk airnya di setiap lembah, tanjakan, gunung, dan medan yang terjal, hingga ia membawanya dari dua belas mil ke Mekah dan menghabiskan seribu tujuh ratus ribu dinar untuk itu. Ia adalah yang pertama menggunakan alat dari emas dan perak dalam perhiasan hingga pakaian al-washi mencapai lima puluh dinar. Ia adalah yang pertama mengadopsi shakiriya di antara pelayan dan pelayan, dan yang pertama menggunakan kubah dari perak, ebony, dan sandal {cite:muruj-al-dhahab hlm. 670-671}. Menurut al-Mas'udi, Salih ibn al-Rashid melaksanakan Haji bersama umat pada tahun dua ratus delapan, ditemani oleh Zubaida, hingga tahun dua ratus {cite:muruj-al-dhahab, hlm. 747}"
