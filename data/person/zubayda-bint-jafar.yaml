id: person/zubayda-bint-jafar
class: person
label: { ar: "زبيدة بنت جعفر", en: "Zubayda bint Ja'far" }
summary:
  ar: "أم جعفر زبيدة بنت جعفر بن المنصور؛ عند البلاذري كان أول من حفر نهر الميمون وكيلاً لها يقال له سعيد بن زيد.، وعند المسعودي أنها أحسن الناس فعلاً في أيام الرشيد لما أحدثته من بناء دور السبيل بمكة واتخاذ المصانع والبرك والآبار ودور التسبيل بالثغر الشامي وطرسوس وأوقفت على ذلك الوقوف، وأنها حفرت العين المعروفة بعين المشاش بالحجاز ومهدت الطريق لمائها حتى أخرجتها من مسافة اثني عشر ميلاً إلى مكة فكان جملة ما أنفقت عليها ألف ألف وسبعمائة ألف دينار، وهي أول من اتخذ الآلة من الذهب والفضة المكللة بالجوهر وصنع لها الوشي حتى بلغ الثوب خمسين ديناراً، وأول من اتخذ الشاكرية من الخدم والجواري والقباب من الفضة والأبنوس والصندل والخفاف المرصعة بالجوهر وشمع العنبر، ولما رأت شغف ولدها الأمين بالخدم اتخذت الجواري المقدودات الحسان وعممت رؤوسهن وجعلت لهن الطرر والأصداغ والأقفية وألبستهن الأقبية والقراطق والمناطق فسمين الغلاميات واقتدى بها الناس {cite:muruj-al-dhahab p. 671-672}، وعند المسعودي دخلت على الرشيد تقول ما أنصفت ابنك محمداً حيث وليته العراق وأعريته عن العدد والقواد وصيرت ذلك إلى عبد الله، فقال لها وما أنت وتمييز الأعمال وليت ابنك السلم وعبد الله الحرب، واضطغنت على جعفر بن يحيى حين رد الأمين يحلف فكانت أحد من حرض على أمره {cite:muruj-al-dhahab p. 340-341}"
  en: "Umm Ja'far Zubayda bint Ja'far ibn al-Mansur; in al-Baladhuri the first digger of Nahr al-Maymun was her agent, a man called Sa'id ibn Zayd."
