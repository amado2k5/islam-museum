summary:
  ar: "أبو منصور عبد الرحمن بن محمد بن الحسن الدمشقي، فخر الدين ابن عساكر، فقيه شافعي تفقه على قطب الدين مسعود النيسابوري وتزوج ابنته، ودرس بالقدس ودمشق، وهو ابن أخي الحافظ علي ابن عساكر، توفي بدمشق في العاشر من رجب سنة 620 هـ {cite:wafayat-ayan vol. 3 p. 135}."
  en: "Abu Mansur Abd al-Rahman ibn Muhammad ibn al-Hasan al-Dimashqi, Fakhr al-Din ibn Asakir, a Shafi'i jurist who studied under Qutb al-Din Mas'ud al-Naysaburi and married his daughter, taught in Jerusalem and Damascus, and was the nephew of the hafiz Ali ibn Asakir; he died in Damascus on 10 Rajab 620 AH {cite:wafayat-ayan vol. 3 p. 135}."
