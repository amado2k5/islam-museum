summary:
  ar: "جنرال نيجيري (وُلد 1942) من مينا، كان رئيس أركان الدفاع (1997–1998) فتولى حكم نيجيريا في 9 يونيو 1998 بعد وفاة ساني أباتشا، فقاد انتقالا سريعا: دستور جديد وانتخابات متعددة الأحزاب، وسلّم السلطة للرئيس المنتخب أولوسيغون أوباسانجو في 29 مايو 1999. يرأس لاحقا لجنة السلام الوطنية في بلاده."
  en: "Nigerian general (born 1942) from Minna who was Chief of Defence Staff (1997–1998) and became Nigeria's head of state on 9 June 1998 after the death of Sani Abacha. He ran a swift transition — a new constitution and multiparty elections — and handed power to the elected president Olusegun Obasanjo on 29 May 1999. He later chairs his country's National Peace Committee."
  ur: "نائجریائی جرنیل (پیدائش 1942ء)، منا سے تعلق؛ چیف آف ڈیفنس اسٹاف رہے (1997ء–1998ء) اور سانی اباچہ کی وفات پر 9 جون 1998 کو نائجریا کے سربراہِ مملکت بنے؛ انھوں نے تیز انتقالِ اقتدار کیا — نیا آئین اور کثیر الجماعتی انتخابات — اور 29 مئی 1999 کو منتخب صدر اولوسے گن اوباسانجو کو اقتدار سونپ دیا؛ بعد میں قومی امن کمیٹی کے چیئرمین رہے۔"
