summary:
  ar: "عالم حاسوب وريادي باكستاني؛ أول باكستاني في قائمة ⁦(TR35)⁩ لمجلة تكنولوجي ريفيو التابعة لإم آي تي، أسس حاضنات التقنية الأولى في باكستان، وترأس مجلس البنجاب لتقنية المعلومات، وشغل منصب الوزير الاتحادي المؤقت للعلوم والتقنية."
  en: "Pakistani computer scientist and entrepreneur. The first Pakistani named to MIT Technology Review's TR35, he founded Pakistan's first startup incubators, chaired the Punjab Information Technology Board, and served as interim federal minister for science, technology and IT."
  ur: "پاکستانی کمپیوٹر سائنسدان اور کاروباری۔ ایم آئی ٹی ٹیکنالوجی ریویو کی ⁦(TR35)⁩ فہرست میں شامل ہونے والے پہلے پاکستانی؛ انھوں نے پاکستان کے پہلے اسٹارٹ اپ انکیوبیٹر قائم کیے، پنجاب انفارمیشن ٹیکنالوجی بورڈ کی سربراہی کی اور وفاقی وزیر برائے سائنس، ٹیکنالوجی اور آئی ٹی ⁦(عبوری)⁩ رہے۔"
  es: "Científico informático y empresario pakistaní. Fue el primer pakistaní incluido en la lista TR35 de MIT Technology Review, fundó las primeras incubadoras de empresas emergentes de Pakistán, presidió la Junta de Tecnología de la Información de Punjab y se desempeñó como ministro federal interino de ciencia, tecnología y TI."
  fr: "Informaticien et entrepreneur pakistanais. Premier Pakistanais à figurer dans le classement TR35 de la MIT Technology Review, il a fondé les premiers incubateurs de start-up du Pakistan, présidé le Conseil des technologies de l'information du Pendjab et occupé le poste de ministre fédéral par intérim des sciences, des technologies et des technologies de l'information."
  tr: "Pakistanlı bir bilgisayar bilimci ve öncü olarak; MIT Technology Review dergisinin TR35 listesindeki ilk Pakistanlı olan Sher, Pakistan'ın ilk teknoloji kuluçka merkezlerini kurdu, Pencap Bilgi Teknolojileri Konseyi'nin başkanlığını yaptı ve geçici federal bilim ve teknoloji bakanı olarak görev yaptı."
  id: "Seorang ilmuwan komputer dan pelopor asal Pakistan; orang Pakistan pertama yang masuk daftar TR35 majalah MIT Technology Review, ia mendirikan inkubator teknologi pertama di Pakistan, memimpin Dewan Teknologi Informasi Punjab, dan menjabat sebagai menteri federal interim untuk ilmu pengetahuan dan teknologi."
