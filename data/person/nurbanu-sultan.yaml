  ur: "نوربانو سلطان کے لیے ڈرافٹ کارڈ، مراد III کے دور میں درست سلطان، کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے نامزد کیا گیا؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Murad III'ün saltanatı sırasında Sultan'ın annesi olan Nurbanu Sultan'ın ön kartı açık bir referans tanımında (Wikidata) yer almaktadır. Al-Salabi'nin The History of the Osmanly Empire adlı eserindeki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal Nurbanu Sultan, ibu Sultan pada masa pemerintahan Murad III, muncul dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam The History of the Ottoman Empire oleh Al-Salabi belum ditinjau di halaman tersebut, sehingga tanggal-tanggal tidak disebutkan di sini."
