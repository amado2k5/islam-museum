summary:
  ar: "الشريف السعدي حاكم فاس الذي أنهى الحكم الوطاسي بدعم عثماني بلغ نحو عشرين ألف مجاهد، ثم انقلب خصماً عنيداً: بعد عودة فاس للسعديين أعلن عزمه الذهاب إلى الجزائر لمنازلة العثمانيين، وطلب من مدريد ولشبونة عشرة آلاف مقاتل بأسلحة نارية على نفقة الإمبراطور لطرد العثمانيين، مقترحاً تحطيم مدينة الجزائر نفسها — مع نصه على ألا يُسترق عربي أبداً لمخالفة ذلك الشريعة. وأبرم هدنة مع البرتغال ستة أشهر مطلع ٩٦٢هـ/١٥٥٥م، ووكل المزوار بوغانم بالوساطة مع أسبانيا. وانتهز إبحار الأسطول العثماني فدخل تلمسان على غفلة فصمدت حاميتها بقيادة محمود صفا بك. ورد على مبعوث السلطان سليمان رافضاً التقارب {cite:dawlat-uthmaniyya-salabi p. 231-243}."
  en: "The Sa'di sharif, ruler of Fas, who ended Wattasid rule with some twenty thousand Ottoman-backed mujahidun, then turned resolute adversary: after retaking Fez he declared he would march on Algiers, asked Madrid and Lisbon for ten thousand musket-armed troops at the Emperor's expense, proposed razing Algiers itself — while stipulating no Arab ever be enslaved, as contrary to the shari'a — and struck a six-month Portuguese truce in early 962/1555, with al-Muzawwar Bu Ghannam his intermediary to Spain. Seizing the fleet's absence he entered Tlemcen unawares, but its garrison under Mahmud Safa Bak held. To Süleyman's envoy he returned refusal {cite:dawlat-uthmaniyya-salabi p. 231-243}."
