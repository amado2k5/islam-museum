summary:
  ar: "الشريف السعدي حاكم فاس الذي أنهى الحكم الوطاسي بدعم عثماني بلغ نحو عشرين ألف مجاهد، ثم انقلب خصماً عنيداً: بعد عودة فاس للسعديين أعلن عزمه الذهاب إلى الجزائر لمنازلة العثمانيين، وطلب من مدريد ولشبونة عشرة آلاف مقاتل بأسلحة نارية على نفقة الإمبراطور لطرد العثمانيين، مقترحاً تحطيم مدينة الجزائر نفسها — مع نصه على ألا يُسترق عربي أبداً لمخالفة ذلك الشريعة. وأبرم هدنة مع البرتغال ستة أشهر مطلع ٩٦٢هـ/١٥٥٥م، ووكل المزوار بوغانم بالوساطة مع أسبانيا. وانتهز إبحار الأسطول العثماني فدخل تلمسان على غفلة فصمدت حاميتها بقيادة محمود صفا بك. ورد على مبعوث السلطان سليمان رافضاً التقارب {cite:dawlat-uthmaniyya-salabi p. 231-243}."
  en: "The Sa'di sharif, ruler of Fas, who ended Wattasid rule with some twenty thousand Ottoman-backed mujahidun, then turned resolute adversary: after retaking Fez he declared he would march on Algiers, asked Madrid and Lisbon for ten thousand musket-armed troops at the Emperor's expense, proposed razing Algiers itself — while stipulating no Arab ever be enslaved, as contrary to the shari'a — and struck a six-month Portuguese truce in early 962/1555, with al-Muzawwar Bu Ghannam his intermediary to Spain. Seizing the fleet's absence he entered Tlemcen unawares, but its garrison under Mahmud Safa Bak held. To Süleyman's envoy he returned refusal {cite:dawlat-uthmaniyya-salabi p. 231-243}."
  es: "El sharif Sa'di, gobernante de Fas, que puso fin al dominio wattasí con unos veinte mil muyahidines apoyados por los otomanos, se convirtió entonces en un adversario acérrimo: tras reconquistar Fez, declaró que marcharía sobre Argel, solicitó a Madrid y Lisboa diez mil soldados armados con mosquetes a expensas del emperador, propuso arrasar la propia Argel —estipulando que ningún árabe sería jamás esclavizado, por ser contrario a la sharia— y firmó una tregua de seis meses con Portugal a principios de 962/1555, con al-Muzawwar Bu Ghannam como intermediario ante España. Aprovechando la ausencia de la flota, entró en Tremecén por sorpresa, pero su guarnición, al mando de Mahmud Safa Bak, resistió. Al enviado de Solimán respondió con una negativa {cite:dawlat-uthmaniyya-salabi p. 231-243}."
  fr: "Le chérif sadi, souverain de Fès, qui avait mis fin au règne des Wattasides avec quelque vingt mille moudjahidines soutenus par les Ottomans, se transforma ensuite en adversaire résolu: après avoir repris Fès, il déclara vouloir marcher sur Alger, demanda à Madrid et Lisbonne dix mille hommes armés de mousquets aux frais de l’empereur, proposa de raser Alger – tout en stipulant qu’aucun Arabe ne serait jamais réduit en esclavage, comme contraire à la charia – et conclut une trêve de six mois avec les Portugais au début de l’année 962/1555, al-Muzawwar Bu Ghannam servant d’intermédiaire auprès de l’Espagne. Profitant de l’absence de la flotte, il entra à Tlemcen par surprise, mais sa garnison, sous les ordres de Mahmud Safa Bak, tint bon. Il répondit par un refus à l’envoyé de Soliman le Magnifique (voir: Dawlat-Uthmaniyya-Salabi, p. 231-243)."
  ur: "سعدی شریف، فاس کے حکمران، جس نے تقریباً بیس ہزار عثمانی حمایت یافتہ مجاہدین کے ساتھ وطاصد کی حکمرانی کا خاتمہ کیا، پھر پرعزم مخالف ہو گیا: فیز کو واپس لینے کے بعد اس نے اعلان کیا کہ وہ الجزائر پر چڑھائی کرے گا، میڈرڈ اور لزبن سے دس ہزار مسکیٹ مسلح دستے طلب کیے، جبکہ شہنشاہ کی پیش کش کی گئی تھی، عربوں کو کبھی بھی غلام بنایا جائے، شریعت کے خلاف ہے - اور 962/1555 کے اوائل میں اسپین میں اس کے ثالث المزور بو غنم کے ساتھ چھ ماہ کی پرتگالی جنگ بندی کی۔ بحری بیڑے کی عدم موجودگی کو دیکھتے ہوئے وہ بے خبری میں Tlemcen میں داخل ہوا، لیکن محمود صفا باک کے ماتحت اس کی چوکی برقرار رہی۔ سلیمان کے ایلچی کو اس نے انکار واپس کیا۔ 231-243}۔"
  tr: "Fez hükümdarı Şerif el-Saadi, yaklaşık yirmi bin savaşçı desteğiyle Wattasi yönetimini sona erdirdi, ardından inatçı bir düşman oldu: Fez Saadilere döndükten sonra Osmanlılarla yüzleşmek için Cezayir'e gitme niyetini açıkladı ve imparatorun masraflarıyla Madrid ve Lizbon'dan on bin silahlı savaşçı istedi; Cezayir şehrinin kendisini yok etmeyi önerdi—ancak hiçbir Arap'ın bu yasayı ihlal etmesine izin verilmemesi şartı vardı. 962 Hicri / 1555 M.S. başında Portekiz ile altı aylık ateşkes imzaladı ve Mezuar Bouganem'e İspanya ile arabuluculuk görevi verdi. Osmanlı filosunun seyrinden faydalanarak beklenmedik şekilde Tlemcen'e girdi, ancak Mahmud Safa Bey komutasındaki garnizon sağlam durdu. Sultan Süleyman'ın elçisinin yakınlaşmayı reddetmesine yanıt verdi {cite:dawlat-uthmaniyya-salabi s. 231-243}."
  id: "Sharif al-Saadi, penguasa Fez, mengakhiri pemerintahan Wattasi dengan dukungan Ottoman sekitar dua puluh ribu pejuang, kemudian menjadi musuh yang keras kepala: setelah Fez kembali ke Saadi, ia menyatakan niatnya pergi ke Aljazair menghadapi Ottoman, dan meminta sepuluh ribu pejuang bersenjata dari Madrid dan Lisbon dengan biaya kaisar untuk mengusir Ottoman, dengan usulan menghancurkan kota Aljir sendiri—dengan ketentuan bahwa tidak ada Arab yang boleh melanggar hukum itu. Ia menyelesaikan gencatan senjata enam bulan dengan Portugal pada awal 962 H / 1555 M, dan mempercayakan Mezuar Bouganem untuk mediasi dengan Spanyol. Ia memanfaatkan keberangkatan armada Ottoman dan memasuki Tlemcen secara tak terduga, tetapi garnisun yang dipimpin oleh Mahmud Safa Bey tetap kokoh. Ia menanggapi utusan Sultan Suleiman yang menolak pendekatan (cite:dawlat-uthmaniyya-salabi hlm. 231-243}."
