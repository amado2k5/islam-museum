summary:
  ar: "بريدة بن الحصيب الأسلمي، أبو عبد الله في المشهور؛ أسلم حين مرّ به النبي مهاجراً بالغميم ومعه نحو ثمانين بيتاً، ثم قدم بعد أحد فشهد معه مشاهده وبايع تحت الشجرة، وسكن المدينة ثم البصرة، ثم غزا خراسان ومات بمرو في إمرة يزيد بن معاوية {cite:istiab-alam-2002 p. 94}، وأرّخ ابن سعد وفاته سنة 63هـ {cite:ibn-hajar-isaba p. 141}."
  en: "Buraydah ibn al-Husayb al-Aslami, best known as Abu 'Abd Allah; he accepted Islam when the Prophet passed him at al-Ghamim on the Hijra, with some eighty households, then came after Uhud and took part in his campaigns and the pledge under the tree; he lived in Medina, then Basra, then campaigned in Khurasan and died at Merv under Yazid ibn Mu'awiya {cite:istiab-alam-2002 p. 94}; Ibn Sa'd dates his death to 63 AH {cite:ibn-hajar-isaba p. 141}."
  ur: "بریدہ بن الحصیب اسلمی، مشہور کنیت ابو عبد اللہ؛ جب نبی ہجرت کرتے ہوئے غمیم سے گزرے تو انہوں نے تقریباً اسی گھرانوں کے ساتھ اسلام قبول کیا، پھر احد کے بعد آئے اور غزوات اور درخت کے نیچے بیعت میں شریک ہوئے؛ مدینہ پھر بصرہ میں رہے، پھر خراسان میں جہاد کیا اور یزید بن معاویہ کی امارت میں مرو میں فوت ہوئے {cite:istiab-alam-2002 p. 94}؛ ابن سعد نے ان کی وفات 63ھ بتائی {cite:ibn-hajar-isaba p. 141}۔"
died: { edtf: "0682/0683", hijri: "0063", calendar: julian, precision: year, status: tradition, derived: true, note: "ابن سعد: مات سنة 63هـ {cite:ibn-hajar-isaba p. 141}؛ ابن عبد البر: مات بمرو في إمرة يزيد بن معاوية {cite:istiab-alam-2002 p. 94}؛ المقابل الميلادي مشتق.", sources: [source/ibn-hajar-isaba, source/istiab-alam-2002] }
