summary:
  ar: صحابي من أسلم؛ قال ابن السكن إنه أسلم حين مرّ به النبي مهاجراً بالغميم وأقام في موضعه حتى مضت بدر وأحد، وغزا مع النبي ست عشرة غزوة، ونزل البصرة ثم غزا خراسان وسكن مرو ومات سنة 63هـ.
  en: A Companion of Aslam; Ibn al-Sakan says he embraced Islam when the Prophet passed him on the Hijra at al-Ghamim and stayed in his place until Badr and Uhud had passed; he took part in sixteen campaigns with the Prophet, settled in Basra,
    campaigned in Khurasan and lived in Merv, dying in 63 AH.
  ur: قبیلہ اسلم کے ایک صحابی؛ ابن السکن کے مطابق وہ اس وقت مسلمان ہوئے جب نبی ہجرت کرتے ہوئے غمیم میں ان کے پاس سے گزرے؛ نبی کے ساتھ سولہ غزوات میں شریک ہوئے، بصرہ میں رہے، پھر خراسان کی مہم میں گئے اور مرو میں بسے، اور 63ھ میں وفات پائی۔
