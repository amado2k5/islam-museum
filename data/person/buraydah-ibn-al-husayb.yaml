  ar: صحابي من أسلم؛ قال ابن السكن إنه أسلم حين مرّ به النبي مهاجراً بالغميم وأقام في موضعه حتى مضت بدر وأحد، وغزا مع النبي ست عشرة غزوة، ونزل البصرة ثم غزا خراسان وسكن مرو ومات سنة 63هـ.
