summary:
  ar: "كاهن العرب المشهور، ذكره المسعودي في باب الكهانة في جملة الكهان المعروفين بنقصان الأجسام وتشويه الخلق مع سطيح وسملقة وزوبعة وسديف بنت هوماس وطريفة وعمران أخي مزيقياء وحارثة وجهينة وكاهنة باهلة {cite:muruj-al-dhahab p. 484}. وفي باب الهواتف والجن عند المسعودي أن من الجن من هو على صورة نصف الإنسان يظهر للعرب في أسفارها وخلواتها ويسمونه شقاً، وهو الذي ظهر لعلقمة بن صفوان الكناني جد مروان لأمه فتضاربا فخرا ميتين {cite:muruj-al-dhahab p. 473-474}"
  en: "The famous half-formed diviner of the Arabs, named by al-Mas'udi among the marked-bodied kahins beside Satih, Samalqa, Zawba'a, Sadif bint Humas and Tarifa {cite:muruj-al-dhahab p. 484}."
  es: "El famoso adivino medio formado de los árabes, nombrado por al-Mas'udi entre los kahins de cuerpo marcado junto a Satih, Samalqa, Zawba'a, Sadif bint Humas y Tarifa {cite:muruj-al-dhahab p. 484}."
  fr: "Le célèbre devin à moitié formé des Arabes, nommé par al-Mas'udi parmi les kahins au corps marqué aux côtés de Satih, Samalqa, Zawba'a, Sadif bint Humas et Tarifa {cite:muruj-al-dhahab p. 484}."
  ur: "عربوں کے مشہور آدھے شکل والے کا نام المسعودی نے صحح، سمالقا، ذوبہ، صدف بنت حماس اور طائفہ کے پاس موجود نشان زدہ کاہنوں میں سے رکھا ہے۔ 484}۔"
  tr: "Ünlü Arap rahibi El-Mas'udi, zayıf bedenleri ve karakter bozucu karakterleriyle bilinen kahinler hakkında bölümde onu Satih, Samalqa, Zuba'a, Saif bint Homas, Turayfa, Muziqiya'nın kardeşi İmran, Haritha, Juhayna ve Bahila'nın rahibesi ile birlikte anmıştır {atıf:muruj-al-dhahab s. 484}}. Telefonlar ve cinler bölümünde, al-Mas'udi'ye göre, cinler arasında yarı insan formunda görünen ve Arapların yolculuklarında ve yalnızlıklarında görünen biri vardır ve ona Shaq derler. O, Merwan'ın anne tarafından dedesi Alqama ibn Safwan al-Kinani'ye görünmüştür ve iki ölü için gururla tartışırlar {cite:muruj-al-dhahab s. 473-474}"
  id: "Pendeta Arab terkenal, Al-Mas'udi, menyebutnya dalam bab tentang peramal yang dikenal karena tubuh yang cacat dan karakter yang memutarbalikkan, bersama dengan Satih, Samalqa, Zuba'a, Saif bint Homas, Turayfa, Imran, saudara Muziqiya, Haritha, Juhayna, dan pendeta wanita Bahila {cite:muruj-al-dhahab hlm. 484}. Dalam bab tentang telepon dan jin, menurut al-Mas'udi, di antara para jin terdapat seseorang yang muncul dalam wujud setengah manusia yang muncul kepada orang Arab dalam perjalanan dan kesendirian mereka, dan mereka memanggilnya Shaq. Ia muncul kepada Alqama ibn Safwan al-Kinani, kakek dari pihak ibu Marwan, dan mereka dengan bangga bertengkar karena dua orang yang telah mati {cite:muruj-al-dhahab hlm. 473-474}"
