summary:
  ar: "مغنٍّ هندي كلاسيكي (1855–1946)، وُلد في أونيارة بولاية جيبور ونشأ في أسرة موسيقية. أسّس غرانة جايبور-أتراولي المعروفة بإحياء الراغات النادرة وابتكارها وبأسلوبها المركّب في الخيال، وخدم موسيقيَّ بلاطٍ في كولهابور أكثر من ربع قرن، وتخرّج عليه جيل من كبار مغنّي الهند."
  en: "Indian classical singer (1855–1946), born at Uniara in Jaipur State into a family of musicians. He founded the Jaipur-Atrauli gharana, known for reviving and creating rare ragas and for its intricate khayal style; he served as court musician at Kolhapur for over a quarter of a century and trained a generation of India's leading singers."
  ur: "ہندوستانی کلاسیکی گلوکار (1855ء–1946ء)، ریاست جے پور کے قصبہ انیارا میں ایک موسیقار گھرانے میں پیدا ہوئے۔ انھوں نے جے پور-اتراؤلی گھرانہ قائم کیا جو نادر راگوں کی تجدید و تخلیق اور خیال کے پیچیدہ انداز کے لیے مشہور ہوا؛ وہ کولہاپور کے دربار سے ربع صدی سے زائد وابستہ رہے اور ہندوستان کے بڑے گلوکاروں کی ایک نسل ان کے شاگردوں میں سے نکلی۔"
