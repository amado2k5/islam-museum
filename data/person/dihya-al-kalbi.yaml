  en: "A handsome and noble Companion from Banu Kalb; Gabriel frequently appeared in his likeness; chosen by the Prophet as his diplomatic envoy to Heraclius, Emperor of Byzantium; later fought in the conquest of Syria."
  ar: "صحابي جليل من سادات كلب وقضاعة، كان من أحسن الناس وجهاً وصورة وكان جبريل  ينزل في صورته كثيراً؛ اختاره النبي سفيراً حاملاً كتابه إلى هرقل قيصر الروم، وشهد اليرموك وفتوح الشام وتوفي في خلافة معاوية. وعند البلاذري بعثه النبي إلى قيصر في سنة سبع {cite:ansab-al-ashraf p. 531}"
