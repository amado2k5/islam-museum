id: person/ibn-al-maghribi-al-wazir
class: person
label: { ar: "أبو القاسم ابن المغربي الوزير" }
summary:
  ar: "أبو القاسم حسين بن علي الشيبي المعروف بابن المغربي الوزير؛ لما قتل الحاكم بمصر أباه وعمه وإخوته هرب وقصد حسان بن مفج الطائي ومدحه فأكرم مورده، ثم وزر لصاحب ميافارقين أحمد بن مروان الكردي؛ وله شعر رائق وعدة تآليف، عاش ثمانياً وأربعين سنة وكان من أدهى البشر وأذكاهم {cite:shadharat-dhahab p. 210}."
  en: "Abu al-Qasim Husayn b. Ali, Ibn al-Maghribi the vizier — fled Egypt when al-Hakim killed his father, uncle and brothers, won the patronage of Hassan b. Mufarrij al-Ta'i with his praise-poem, then served as vizier to Ahmad b. Marwan the Kurd at Mayyafariqin; a fine poet of keenest wit, he lived forty-eight years and died in 418 {cite:shadharat-dhahab p. 210}."
  es: "Abu al-Qasim Husayn b. Ali, Ibn al-Maghribi el visir, huyó de Egipto cuando al-Hakim mató a su padre, tío y hermanos, obtuvo el patrocinio de Hassan b. Mufarrij al-Ta'i con su poema de alabanza, luego sirvió como visir de Ahmad b. Marwan el Kurdo en Mayyafariqin; un excelente poeta de agudo ingenio, vivió cuarenta y ocho años y murió en 418 {cite:shadharat-dhahab p. 210}."
  fr: "Abu al-Qasim Husayn b. Ali, Ibn al-Maghribi le vizir — s'enfuit d'Égypte lorsque al-Hakim tua son père, son oncle et ses frères, gagna le patronage de Hassan b. Mufarrij al-Ta'i avec son poème de louange, puis servit comme vizir d'Ahmad b. Marwan le Kurde à Mayyafariqin; poète de grand talent et d'un esprit vif, il vécut quarante-huit ans et mourut en 418 {cite:shadharat-dhahab p. 210}."
  ur: "ابو القاسم حسین بن علی، ابن المغربی وزیر - مصر سے فرار ہو گئے جب الحکیم نے اپنے والد، چچا اور بھائیوں کو قتل کر دیا، حسن بن المغربی کی سرپرستی حاصل کر لی۔ مفرج الطائی نے اپنی تعریفی نظم کے ساتھ، پھر احمد بن کے وزیر کے طور پر خدمات انجام دیں۔ مایافارقین میں کرد مروان؛ گہری عقل کا ایک عمدہ شاعر، وہ اڑتالیس سال زندہ رہا اور 418 میں فوت ہوا۔ 210}۔"
  tr: "Ebu el-Kasım Hüseyin bin Ali el-Şeybi, İbn el-Mağribi el-Vezir olarak bilinir; Mısır'daki hükümdar babasını, amcasını ve kardeşlerini öldürdüğünde kaçtı, Hasan bin Mufaj al-Tai'ye gitti, onu övdü ve kaynağına saygı gösterdi. Daha sonra Ma'afariqin'in yoldaşı Ahmed ibn Mervan el-Kurdi'ye bir bakan atadı. Zarif şiirleri ve birçok eseri vardı. Kırk sekiz yıl yaşadı ve en parlak ve zeki kişilerden biriydi {atıf:shadharat-dhahab, s. 210}."
  id: "Abu al-Qasim Hussein ibn Ali al-Shaybi, dikenal sebagai Ibn al-Maghribi al-Wazir; ketika penguasa di Mesir membunuh ayah, pamannya, dan saudara-saudaranya, ia melarikan diri dan pergi kepada Hassan ibn Mufaj al-, memujinya, dan menghormati sumbernya. Ia kemudian mengangkat seorang menteri untuk sahabat Ma'afariqin, Ahmad ibn Marwan al-Kurdi. Ia memiliki puisi yang elegan dan beberapa karya. Ia hidup selama empat puluh delapan tahun dan termasuk di antara orang paling cemerlang dan cerdas {cite:shadharat-dhahab, hlm. 210}."
