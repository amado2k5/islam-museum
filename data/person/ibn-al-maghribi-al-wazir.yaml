summary:
  ar: "أبو القاسم حسين بن علي الشيبي المعروف بابن المغربي الوزير؛ لما قتل الحاكم بمصر أباه وعمه وإخوته هرب وقصد حسان بن مفج الطائي ومدحه فأكرم مورده، ثم وزر لصاحب ميافارقين أحمد بن مروان الكردي؛ وله شعر رائق وعدة تآليف، عاش ثمانياً وأربعين سنة وكان من أدهى البشر وأذكاهم {cite:shadharat-dhahab p. 210}."
  en: "Abu al-Qasim Husayn b. Ali, Ibn al-Maghribi the vizier — fled Egypt when al-Hakim killed his father, uncle and brothers, won the patronage of Hassan b. Mufarrij al-Ta'i with his praise-poem, then served as vizier to Ahmad b. Marwan the Kurd at Mayyafariqin; a fine poet of keenest wit, he lived forty-eight years and died in 418 {cite:shadharat-dhahab p. 210}."
