summary:
  ar: "محدث هندي ديوبندي ⁦(1852–1927)⁩، من مؤسسي مدرسة ديوبند الحديثية وشيخ الحديث فيها. من مؤلفاته الشرح الموسوعي «بذل المجهود في حل أبي داود» في أربعة عشر مجلدًا، و«المهنّد على المفنّد» في رد شبهات رفع اليدين والتأمين بالفارسية، و«إتمام النعم»."
  en: "Indian Deobandi hadith scholar (1852–1927), a founder of the Deobandi hadith school and its Shaykh al-Hadith. His works include the fourteen-volume commentary Badhl al-Majhud on Sunan Abi Dawud, Al-Muhannad 'ala al-Mufannad refuting objections on ritual details, and Itmam al-Ni'am."
  ur: "ہندوستانی دیوبندی محدث ⁦(1852–1927)⁩ جو دیوبندی حدیثی مکتب کے بانیوں اور اس کے شیخ الحدیث میں شمار ہوتے ہیں۔ ان کی تصانیف میں چودہ جلدی «بذل المجہود فی حل ابی داود»، رفع الیدین اور آمین کے اعتراضات کے جواب میں «المہند علی المفند» اور «اتمام النعم» شامل ہیں۔"
  es: "Erudito indio en hadices Deobandi (1852-1927), fundador de la escuela de hadices Deobandi y su Shaykh al-Hadith. Sus obras incluyen el comentario de catorce volúmenes Badhl al-Majhud sobre Sunan Abi Dawud, Al-Muhannad 'ala al-Mufannad que refuta las objeciones sobre los detalles rituales e Itmam al-Ni'am."
  fr: "Érudit indien des hadiths déobandi (1852-1927), fondateur de l'école de hadiths déobandi et de son Shaykh al-Hadith. Ses œuvres comprennent le commentaire en quatorze volumes Badhl al-Majhud sur Sunan Abi Dawud, Al-Muhannad 'ala al-Mufannad réfutant les objections sur les détails rituels et Itmam al-Ni'am."
