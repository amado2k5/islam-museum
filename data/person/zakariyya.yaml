summary:
  ar: "زكريا نبي سأل ربه علامة على حمل زوجته العاقر، وقد قيل له إن علامته ألا يكلّم الناس ثلاثة أيام إلا رمزا، كما يرويه الشيخ عمر عبد الكافي (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:09:00}. ويلاحظ الشيخ أن القرآن سمّى زوجته «امرأة» وهي عاقر ثم «زوجا» بعد أن أذن الله لها بالحمل {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:07:30}."
  en: "Zakariyya is a prophet who asked his Lord for a sign that his barren wife had conceived, and was told that his sign would be that he would not speak to people for three days except by gesture, as Sheikh Omar Abdelkafy relates (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:09:00}. The Sheikh notes that the Qur'an calls his wife an imra'a (woman) while she was barren and then a zawj (spouse) once God permitted her to conceive {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:07:30}."
  ur: "زکریا ایک نبی ہیں جنہوں نے اپنے رب سے اپنی بانجھ بیوی کے حاملہ ہونے کی نشانی مانگی، اور انہیں بتایا گیا کہ ان کی نشانی یہ ہے کہ وہ تین دن لوگوں سے اشارے کے سوا بات نہیں کریں گے، جیسا کہ شیخ عمر عبد الکافی روایت کرتے ہیں (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:09:00}۔ شیخ نوٹ کرتے ہیں کہ قرآن نے ان کی بیوی کو بانجھ ہونے کی حالت میں «امرأة» اور اللہ کی طرف سے حمل کی اجازت کے بعد «زوج» کہا {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:07:30}۔"
  es: "Zakariyya es un profeta que pidió a su Señor una señal de que su esposa estéril había concebido, y se le dijo que su señal sería que no hablaría con la gente durante tres días excepto por gestos, como relata el Sheikh Omar Abdelkafy (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:09:00}. El Sheikh señala que el Corán llama a su esposa imra'a (mujer) mientras era estéril y luego zawj (esposa) una vez que Dios le permitió concebir {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:07:30}."
  fr: "Zacharie, prophète, demanda à son Seigneur un signe de la conception de son épouse stérile. Il lui fut révélé que ce signe serait le silence pendant trois jours, s'exprimant uniquement par gestes, comme le relate le cheikh Omar Abdelkafy (source nécessaire) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:09:00}. Le cheikh souligne que le Coran qualifie son épouse d'imra'a (femme) lorsqu'elle était stérile, puis de zawj (épouse) une fois que Dieu lui eut permis de concevoir {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:07:30}."
  tr: "Zakeriya, kısır eşinin hamileliğiyle ilgili bir işaret isteyen bir peygamberdi. Şeyh Ömer Abdulkafi (needs_source) tarafından rivayet edildiği üzere, kendisine işaretinin üç gün boyunca insanlarla sadece bir sembol olarak konuşmak olduğu söylenmiştir {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep03 00:09:00}. Şeyh, Kur'an'ın eşine 'İmra' (kadın) adını verdiğini ve Allah izin verdikten sonra 'koca' olarak adlandırdığını belirtir {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep09 00:07:30}."
  id: "Zakariya adalah seorang nabi yang meminta tanda kepada Tuhannya mengenai kehamilan istrinya yang tidak subur. Ia diberitahu bahwa tandanya adalah tidak berbicara kepada orang selama tiga hari kecuali sebagai simbol, seperti yang diceritakan oleh Sheikh Omar Abdulkafi (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-Quran-al-qareem/ep03 00:09:00}. Sheikh mencatat bahwa Al-Qur'an menamai istrinya 'Imra' (wanita), yang mandul, lalu 'suami' setelah Allah mengizinkannya mengandung {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:07:30}."
