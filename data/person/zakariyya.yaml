summary:
  ar: "زكريا نبي سأل ربه علامة على حمل زوجته العاقر، وقد قيل له إن علامته ألا يكلّم الناس ثلاثة أيام إلا رمزا، كما يرويه الشيخ عمر عبد الكافي (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:09:00}. ويلاحظ الشيخ أن القرآن سمّى زوجته «امرأة» وهي عاقر ثم «زوجا» بعد أن أذن الله لها بالحمل {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:07:30}."
  en: "Zakariyya is a prophet who asked his Lord for a sign that his barren wife had conceived, and was told that his sign would be that he would not speak to people for three days except by gesture, as Sheikh Omar Abdelkafy relates (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:09:00}. The Sheikh notes that the Qur'an calls his wife an imra'a (woman) while she was barren and then a zawj (spouse) once God permitted her to conceive {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:07:30}."
  ur: "زکریا ایک نبی ہیں جنہوں نے اپنے رب سے اپنی بانجھ بیوی کے حاملہ ہونے کی نشانی مانگی، اور انہیں بتایا گیا کہ ان کی نشانی یہ ہے کہ وہ تین دن لوگوں سے اشارے کے سوا بات نہیں کریں گے، جیسا کہ شیخ عمر عبد الکافی روایت کرتے ہیں (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:09:00}۔ شیخ نوٹ کرتے ہیں کہ قرآن نے ان کی بیوی کو بانجھ ہونے کی حالت میں «امرأة» اور اللہ کی طرف سے حمل کی اجازت کے بعد «زوج» کہا {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:07:30}۔"
