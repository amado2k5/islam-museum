summary:
  ar: "عبد الرؤوف السنكيلي (نحو 1029هـ/1620م – بعد 1105هـ/1693م)، عالم ومتصوف من سنكل شمال فنصوري على الساحل الغربي لسومطرة، درس تسعة عشر عامًا في الحجاز، وأدخل الطريقة الشطارية إلى آتشيه، وألّف بالملايوية والعربية، وترجم القرآن إلى الملايوية مع شرح موجز. {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
  en: "Abd al-Rauf al-Sinkili (about 1620 to after 1693), a religious teacher born at Singkel, north of Fansur on the west coast of Sumatra, who studied for nineteen years in Arabia, brought the Shattariyya into Aceh, wrote mostly in Malay, and translated the Qur'an into Malay with a short commentary. {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
  ur: "عبدالرؤف سنکیلی (تقریباً 1620ء تا 1693ء کے بعد)، سماٹرا کے مغربی ساحل پر فنصوری کے شمال میں سنکل کے دینی استاد، جنہوں نے عرب میں انیس برس تعلیم حاصل کی، آچے میں شطاریہ طریقہ پہنچایا، ملائی میں لکھا اور قرآن کا مختصر حاشیے کے ساتھ ملائی ترجمہ کیا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
