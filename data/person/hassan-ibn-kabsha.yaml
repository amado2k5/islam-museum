summary:
  ar: "حسان بن كبشة، واسمه حسان بن معاوية بن حجر، ملك من ملوك كندة؛ كاتبته بنو عامر بعد يوم جبلة يستميلونه على بني حنظلة من تميم فأقبل بصنائعه، فقتله جشيش بن نمران الرياحي يوم ذي نجب وانهزمت عامر وصنائعه {cite:kamil-ibn-al-athir p. 455}."
  en: "Hassan ibn Kabsha (Hassan ibn Mu'awiya ibn Hujr), a king of Kinda: drawn by Banu Amir into their revenge on Tamim after Jabala, he led his retainers to Dhi Najb where Jushaysh ibn Numran struck him dead {cite:kamil-ibn-al-athir p. 455}."
  es: "Hassan ibn Kabsha (Hassan ibn Mu'awiya ibn Hujr), rey de Kinda: atraído por los Banu Amir a su venganza contra Tamim después de Jabala, condujo a sus vasallos a Dhi Najb donde Jushaysh ibn Numran lo mató {cite:kamil-ibn-al-athir p. 455}."
  fr: "Hassan ibn Kabsha (Hassan ibn Mu'awiya ibn Hujr), roi de Kinda: entraîné par Banu Amir dans leur vengeance contre Tamim après Jabala, il mena ses fidèles à Dhi Najb où Jushaysh ibn Numran le frappa à mort {cite:kamil-ibn-al-athir p. 455}."
  ur: "حسن بن کبشہ ⁦(حسن بن معاویہ ابن حجر)⁩، کندہ کا بادشاہ: بنو عامر نے جبلہ کے بعد تمیم سے انتقام لینے کے لیے کھینچا، وہ اپنے محافظوں کو ذی نجب کی طرف لے گیا جہاں جوشیش ابن نمران نے اسے مار مار کر ہلاک کر دیا۔ 455}"
  tr: "Hasan ibn Kabsha, adı Hasan ibn Muaviye ibn Hajar idi, Kinda'nın kralıydı; mektubu, Cibla Günü'nden sonra Banu Emir tarafından yazılmıştır; Banu Emir, Tamim'den Banu Hanzala yerine onu aramış, bu yüzden Banu zanaatlarına yönelmiştir. Caşiş ibn Nimran el-Riyahi, Dhu al-Najib gününde onu öldürmüş ve Emir ile zanaatları yenilmiştir {cite:kamil-ibn-al-athir s. 455}."
  id: "Hassan ibn Kabsha, yang bernama Hassan ibn Muawiyah ibn Hajar, adalah seorang raja Kinda; suratnya ditulis oleh Banu Amir setelah Hari Jiblah, yang mencarinya menggantikan Banu Hanzala dari Tamim, sehingga ia beralih ke kerajinan tangannya. Jashish ibn Nimran al-Riyahi membunuhnya pada hari Dhu al-Najib, dan Amir beserta para pengikutnya dikalahkan {cite:kamil-ibn-al-athir hlm. 455}."
