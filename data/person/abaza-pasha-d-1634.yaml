  ar: "أباظة باشا، أحد أعيان أسرة أباظة من أصل أبخازي، صار والي أرضروم ثم تمرّد على الباب العالي، واتهم بقتل الانكشارية، وأُعدم في 29 صفر 1044هـ/24 أغسطس 1634م. {cite:encyclopaedia-of-islam-2 vol. 1 p. 23}"
