  ur: "اباظہ پاشا، اباظہ خاندان کے ایک رکن، جو ابخازی نسل سے تھے۔ وہ ارضروم کے گورنر بنے، 1623ء میں باب عالی کے خلاف بغاوت کی، اور 29 صفر 1044ھ/24 اگست 1634ء کو قتل کیے گئے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 23}"
