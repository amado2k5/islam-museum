id: person/karsasf-ibn-qaramard-al-kakuyi
class: person
label:
  ar: علاء الدولة كرساسف بن قرامرد بن كاكويه
  en: Ala al-Dawla Karsasf ibn Qaramard al-Kakuyi
  es: "Ala al-Dawla Karsasf ibn Qaramard al-Kakuyi"
  fr: "Ala al-Dawla Karsasf ibn Qaramard al-Kakuyi"
  ur: "الا الدولہ کارصاف ابن قمرد الکوعی"
summary:
  ar: "علاء الدولة كرساسف بن قرامرد بن كاكويه، صاحب مدينة يزد من آل كاكويه الديلم؛ كان صهر السلطانين محمد بن ملك شاه وسنجر على أختهما، واختص بالسلطان محمد، فلما دعاه محمود بن محمد تأخر عنه فأقطع بلده لقراجا الساقي الذي ولي بعد ذلك فارس."
  en: "Ala al-Dawla Karsasf ibn Qaramard ibn Kakuya, lord of Yazd of the Daylamite Kakuyids; son-in-law of the sultans Muhammad ibn Malikshah and Sanjar upon their sister and partisan of Muhammad — when Mahmud ibn Muhammad summoned him he delayed, so his lands were granted to Qaraja al-Saqi who later ruled Fars."
  es: "Ala al-Dawla Karsasf ibn Qaramard ibn Kakuya, señor de Yazd de los Kakuyids daylamitas; yerno de los sultanes Muhammad ibn Malikshah y Sanjar sobre su hermana y partidario de Muhammad — cuando Mahmud ibn Muhammad lo llamó, se demoró, por lo que sus tierras fueron otorgadas a Qaraja al-Saqi, quien más tarde gobernó Fars."
  fr: "Ala al-Dawla Karsasf ibn Qamard ibn Kakuya, seigneur de Yazd des Kakuyids Daylamites; gendre des sultans Muhammad ibn Malikshah et Sanjar, par l'intermédiaire de leur sœur et partisan de Muhammad — lorsque Mahmud ibn Muhammad le convoqua, il tarda, de sorte que ses terres furent données à Qaraja al-Saqi qui régna plus tard sur Fars."
  ur: "الا الدولہ کارصاف ابن قمرد ابن کاکویا، دیلمائٹ کاکوئیڈس کے یزد کے مالک؛ سلطانوں کے داماد محمد بن مالکشاہ اور سنجار ان کی بہن اور محمد کے حامی تھے - جب محمود ابن محمد نے اسے بلایا تو اس نے تاخیر کی، اس لیے اس کی زمینیں قرجہ السقی کو دے دی گئیں جس نے بعد میں فارس پر حکومت کی۔"
  tr: "Ala al-Dawla Karsasif ibn Karamard ibn Kakuyeh, Daylam'ın Kakuyeh ailesinden Yezd hükümdarıydı; sultanlar Muhammed ibn Malik Şah ve Sanjar'ın kız kardeşleri üzerindeki damadıydı ve sadece Sultan Muhammed'e bağlıydı. Mahmud ibn Muhammed onu çağırdığında, topraklarını geciktirdi ve Karaj al-Saqi'ye verdi; bu kişi daha sonra Pers oldu."
  id: "Ala al-Dawla Karsasif ibn Qaramard ibn Kakuyeh, penguasa Yazd dari keluarga Kakuyeh Daylam; ia adalah menantu sultan Muhammad ibn Malik Shah dan Sanjar atas saudara perempuan mereka, dan ia eksklusif untuk Sultan Muhammad. Ketika Mahmud ibn Muhammad memanggilnya, ia menunda dan memberikan tanahnya kepada Karaj al-Saqi, yang kemudian menjadi Persia."
