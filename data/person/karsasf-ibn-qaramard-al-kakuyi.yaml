label:
  ar: علاء الدولة كرساسف بن قرامرد بن كاكويه
  en: Ala al-Dawla Karsasf ibn Qaramard al-Kakuyi
summary:
  ar: "علاء الدولة كرساسف بن قرامرد بن كاكويه، صاحب مدينة يزد من آل كاكويه الديلم؛ كان صهر السلطانين محمد بن ملك شاه وسنجر على أختهما، واختص بالسلطان محمد، فلما دعاه محمود بن محمد تأخر عنه فأقطع بلده لقراجا الساقي الذي ولي بعد ذلك فارس."
  en: "Ala al-Dawla Karsasf ibn Qaramard ibn Kakuya, lord of Yazd of the Daylamite Kakuyids; son-in-law of the sultans Muhammad ibn Malikshah and Sanjar upon their sister and partisan of Muhammad — when Mahmud ibn Muhammad summoned him he delayed, so his lands were granted to Qaraja al-Saqi who later ruled Fars."
