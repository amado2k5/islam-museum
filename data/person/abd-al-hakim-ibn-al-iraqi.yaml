id: person/abd-al-hakim-ibn-al-iraqi
class: person
label: { ar: "عبد الحكم بن العراقي", en: "Abd al-Hakim ibn al-Iraqi", fr: "Abd al-Hakim ibn al-Iraqi", es: "Abd al-Hakim ibn al-Iraqi", ur: "عبد الحکیم ابن العراقی" }
summary:
  ar: "أبو محمد عبد الحكم؛ ولد العراقي الخطيب؛ كان فاضلاً نسل القدر وتولى الخطابة بجامع مصر بعد وفاة والده وكانت له خطب جيدة وشعر؛ منه في العماد بن جبريل المعروف بابن أخي العلم صاحب ديوان بيت المال بمصر وقد وقع فانكسرت يده: «إن العماد بن جبريل أخا علمٍ له يدٌ أصبحت مذمومة الأثر» {cite:wafayat-ayan}."
  en: "Abu Muhammad Abd al-Hakim — son of al-Iraqi al-Khatib; succeeded his father as preacher of Egypt's congregational mosque and composed verse, including lines on the treasury official Ibn Akhi al-Ilm {cite:wafayat-ayan}."
  fr: "Abu Muhammad Abd al-Hakim — fils d'al-Iraqi al-Khatib ; il succéda à son père comme prédicateur de la mosquée-cathédrale d'Égypte et composa des vers, dont des lignes sur le fonctionnaire du trésor Ibn Akhi al-Ilm {cite:wafayat-ayan}."
  es: "Abu Muhammad Abd al-Hakim — hijo de al-Iraqi al-Khatib; sucedió a su padre como predicador de la mezquita congregacional de Egipto y compuso versos, incluyendo líneas sobre el funcionario del tesoro Ibn Akhi al-Ilm {cite:wafayat-ayan}."
  ur: "ابو محمد عبد الحکیم - ولد العراقی الخطیب؛ اپنے والد کے بعد مصر کی اجتماعی مسجد کے مبلغ کے طور پر کام کیا اور ایک آیت کی تالیف کی جس میں خزانے کے اہلکار ابن اخی العلم کی سطریں بھی شامل ہیں۔"
  tr: "Iraklı vaiz Ebu Muhammed Abdül-Hakam doğdu; Kadr'ın erdemli bir soyundan geliyordu ve babasının ölümünden sonra Mısır camisinde vaaz vermeyi devraldı. Güzel vaazları ve şiirleri vardı; bunlar arasında Mısır'daki Hazine Divanı'nın sahibi, İbn Aki el-İlm olarak bilinen İmad ibn Cibril hakkında yazdığı bir şiir de vardı; İmad ibn Cibril düşüp elini kırmıştı: \"İmad ibn Cibril, Alam'ın kardeşi, eli gerçekten de kınanacak hale gelmiştir.\" {kaynak: Vefayyat-ı Ayan}."
  id: "Abu Muhammad Abd al-Hakam, seorang pendakwah Irak, lahir; ia adalah keturunan al-Qadr yang saleh dan mengambil alih tugas berdakwah di masjid Mesir setelah kematian ayahnya. Ia memiliki khutbah dan puisi yang bagus; di antaranya adalah sebuah puisi tentang al-Imad ibn Jibril, yang dikenal sebagai Ibn Akhi al-Ilm, pemilik Diwan Perbendaharaan di Mesir, yang jatuh dan tangannya patah: “Al-Imad ibn Jibril, saudara Alam, memiliki tangan yang telah menjadi tercela.” {cite:wafayat-ayan}."
