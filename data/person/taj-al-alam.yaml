summary:
  ar: "تاج العالم صافية الدين شاه (نحو 1612 – 23 تشرين الأول 1675)، وُلدت بوتري سري علم، سلطانة آتشيه من 1641 إلى 1675 وأولى أربع سلطانات متعاقبات. ابنة إسكندر مودا وزوجة خليفته إسكندر الثاني، اعتلت العرش أرملةً سنة 1641، وحكمت بالتفاوض مع النبلاء والعلماء، واحتملت ضغط الشركة الهولندية على تجارة القصدير والفلفل، ورعت ازدهارًا في الأدب والعلم الشرعي في بلاطها — وفيه ألّف عبد الرؤوف السنكيلي «مرآة الطلاب» بطلبها — وماتت سنة 1675 بلا أولاد."
  en: "Taj al-Alam Safiatuddin Syah (c. 1612 – 23 October 1675), born Putri Sri Alam, was sultana of Aceh from 1641 to 1675, the first of four successive sultanas. Daughter of Iskandar Muda and wife of his successor Iskandar Thani, she was enthroned as his widow in 1641, governed by negotiation with the nobility and the ulama, withstood VOC pressure over the tin and pepper trades, and presided over a flowering of Islamic literature and learning at her court — Abd al-Ra'uf al-Singkili composed his Mir'at al-Tullab at her request — dying in 1675 without children."
  ur: "تاج العالم صفیۃ الدین شاہ (تقریباً 1612ء – 23 اکتوبر 1675ء)، پیدائشی نام پوتری سری عالم، 1641ء سے 1675ء تک آچے کی سلطانہ اور یکے بعد دیگرے چار سلطاناؤں میں پہلی تھیں۔ اسکندر مودا کی بیٹی اور ان کے جانشین اسکندر ثانی کی اہلیہ، 1641ء میں بیوگی میں تخت نشین ہوئیں، امراء اور علماء سے مشاورت سے حکمرانی کی، ٹن اور کالی مرچ کی تجارت پر ولندیزی کمپنی کے دباؤ کا سامنا کیا، اور ان کے دربار میں اسلامی ادب و علم نے فروغ پایا — عبد الرؤف سنکیلی نے ان کی فرمائش پر «مرآۃ الطلاب» لکھی — اور 1675ء میں بے اولاد وفات پائیں۔"

