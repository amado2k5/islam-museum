summary:
  ar: "عالم الإباضية بالكوفة تختلف إليه أصحابه يأخذون منه، وكان خرازاً شريكاً لهشام بن الحكم في حانوت واحد لا يجري بينهما مسابة على ضد مذهبيهما، وقال لهشام تعلم ما بيننا من المودة فأحببت أن تنكحني ابنتك فاطمة فقال هشام إنها مؤمنة فأمسك عنه حتى فرق الموت بينهما {cite:muruj-al-dhahab p. 183-184}. وعند ابن النديم من أكابر الخوارج ومتكلميهم وله كتاب التوحيد وكتاب على المعتزلة وكتاب الاستطاعة وكتاب الرد على الرافضة {cite:fihrist-ibn-al-nadim p. 258}."
  en: "Kufa's Ibadi teacher — leather-seller and shop-partner of the Rafidi Hisham ibn al-Hakam, who answered his marriage-suit for Fatima only with 'she is a believer' {cite:muruj-al-dhahab p. 183-184}."
