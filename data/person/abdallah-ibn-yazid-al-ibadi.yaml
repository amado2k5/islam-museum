id: person/abdallah-ibn-yazid-al-ibadi
class: person
label: { ar: "عبد الله بن يزيد الإباضي", en: "'Abd Allah ibn Yazid al-Ibadi", fr: "'Abd Allah ibn Yazid al-Ibadi", es: "'Abd Allah ibn Yazid al-Ibadi", ur: "عبداللہ بن یزید العبادی" }
summary:
  ar: "عالم الإباضية بالكوفة تختلف إليه أصحابه يأخذون منه، وكان خرازاً شريكاً لهشام بن الحكم في حانوت واحد لا يجري بينهما مسابة على ضد مذهبيهما، وقال لهشام تعلم ما بيننا من المودة فأحببت أن تنكحني ابنتك فاطمة فقال هشام إنها مؤمنة فأمسك عنه حتى فرق الموت بينهما {cite:muruj-al-dhahab p. 183-184}. وعند ابن النديم من أكابر الخوارج ومتكلميهم وله كتاب التوحيد وكتاب على المعتزلة وكتاب الاستطاعة وكتاب الرد على الرافضة {cite:fihrist-ibn-al-nadim p. 258}."
  en: "Kufa's Ibadi teacher — leather-seller and shop-partner of the Rafidi Hisham ibn al-Hakam, who answered his marriage-suit for Fatima only with 'she is a believer' {cite:muruj-al-dhahab p. 183-184}."
  fr: "Le maître ibadite de Koufa — marchand de cuir et associé de boutique du rafidite Hisham ibn al-Hakam, qui ne répondit à sa demande en mariage de Fatima que par « elle est croyante » {cite:muruj-al-dhahab p. 183-184}."
  es: "El maestro ibadí de Kufa, vendedor de cuero y socio comercial del rafidí Hisham ibn al-Hakam, respondió a su petición de matrimonio por Fátima solo con \"ella es creyente\" {cite:muruj-al-dhahab p. 183-184}."
  ur: "کوفہ کے عبادی استاد - رافدی ہشام بن الحکم کے چمڑے بیچنے والے اور دکاندار، جنہوں نے فاطمہ کے لیے اپنے نکاح نامے کا جواب صرف 'وہ مومن ہے' سے دیا تھا۔ 183-184}۔"
  tr: "Kufa'daki İbadi alim, takipçileri tarafından sık sık ziyaret edilir ve ondan ders alırlardı. Deri işçisiydi ve Hişam ibn el-Hakam ile aynı dükkânda ortaktı. Farklı dini inançlarına rağmen hiç kavga etmediler. Hişam'a, \"Aramızdaki sevgiyi biliyorsun ve kızın Fatıma'yı bana eş olarak vermeni istiyorum\" dedi. Hişam, \"O mümindir\" diye cevap verdi, bu yüzden ölüm onları ayırana kadar sormaktan vazgeçti. {kaynak: Muruj-al-Dhahab s. 183-184}. İbn el-Nadim'e göre, önde gelen Haricilerden ve onların ilahiyatçılarından biriydi. Tefekkür üzerine bir kitap, Mu'tezililer üzerine bir kitap, yetenek üzerine bir kitap ve Rafizileri çürüten bir kitap yazdı. {kaynak: Firist-ibn-al-Nadim s. 258}."
  id: "Ulama Ibadi di Kufa sering dikunjungi oleh para pengikutnya, yang belajar darinya. Ia adalah seorang pengrajin kulit dan mitra Hisham ibn al-Hakam dalam satu toko. Mereka tidak pernah bertengkar meskipun keyakinan agama mereka berbeda. Ia berkata kepada Hisham, \"Kau tahu kasih sayang di antara kita, dan aku ingin kau menikahkan putrimu Fatima denganku.\" Hisham menjawab, \"Dia seorang mukmin,\" sehingga ia menahan diri untuk tidak melamar sampai maut memisahkan mereka. {cite:muruj-al-dhahab hlm. 183-184}. Menurut Ibn al-Nadim, ia adalah salah satu tokoh terkemuka Kharijites dan teolog mereka. Ia menulis sebuah buku tentang monoteisme, sebuah buku tentang Mu'tazilah, sebuah buku tentang kemampuan, dan sebuah buku yang membantah Rafidiyah. {cite:fihrist-ibn-al-nadim hlm. 258}."
