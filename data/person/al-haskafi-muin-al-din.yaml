summary:
  ar: "معين الدين الحصكفي يحيى بن سلامة الشافعي المعروف بالخطيب نسبة إلى حصن كيفا القلعة الحصينة؛ نشأ بحصن كيفا وقدم بغداد فقرأ الفقه حتى أجاد وقرأ الأدب على الخطيب أبي زكريا التبريزي شارح المقامات ثم رجع إلى بلاده واستوطن ميافارقين وتولى بها الخطابة وانتصب للإفتاء والاشتغال وانتفع عليه الناس؛ قال العماد في الخريدة كان علامة الزمان في علمه ومعري العصر في نثره ونظمه وقال ابن شهبة له الترصيع البديع والتجنيس النفيس واللفظ الجزل الرقيق والمعنى السهل العميق؛ توفي سنة إحدى وخمسين وخمسمائة وكان يتشيع {cite:shadharat-dhahab p. 648-649}."
  en: "Mu'in al-Din al-Haskafi Yahya ibn Salama, the Shafi'i known as al-Khatib, nisba to the fortress Hisn Kayfa; he came to Baghdad, mastered fiqh, read adab under Abu Zakariyya al-Tibrizi the Maqamat commentator, then settled at Mayyafariqin as its khatib and mufti; al-Imad in the Kharida calls him 'the allama of the age, unmatched in prose and verse'; d. 551 — he inclined to Shi'ism {cite:shadharat-dhahab p. 648-649}."
