summary:
  ar: "معين الدين الحصكفي يحيى بن سلامة الشافعي المعروف بالخطيب نسبة إلى حصن كيفا القلعة الحصينة؛ نشأ بحصن كيفا وقدم بغداد فقرأ الفقه حتى أجاد وقرأ الأدب على الخطيب أبي زكريا التبريزي شارح المقامات ثم رجع إلى بلاده واستوطن ميافارقين وتولى بها الخطابة وانتصب للإفتاء والاشتغال وانتفع عليه الناس؛ قال العماد في الخريدة كان علامة الزمان في علمه ومعري العصر في نثره ونظمه وقال ابن شهبة له الترصيع البديع والتجنيس النفيس واللفظ الجزل الرقيق والمعنى السهل العميق؛ توفي سنة إحدى وخمسين وخمسمائة وكان يتشيع {cite:shadharat-dhahab p. 648-649}."
  en: "Mu'in al-Din al-Haskafi Yahya ibn Salama, the Shafi'i known as al-Khatib, nisba to the fortress Hisn Kayfa; he came to Baghdad, mastered fiqh, read adab under Abu Zakariyya al-Tibrizi the Maqamat commentator, then settled at Mayyafariqin as its khatib and mufti; al-Imad in the Kharida calls him 'the allama of the age, unmatched in prose and verse'; d. 551 — he inclined to Shi'ism {cite:shadharat-dhahab p. 648-649}."
  es: "Mu'in al-Din al-Haskafi Yahya ibn Salama, el Shafi'i conocido como al-Khatib, nisba a la fortaleza Hisn Kayfa; llegó a Bagdad, dominó el fiqh, leyó adab bajo la dirección de Abu Zakariyya al-Tibrizi, el comentarista de Maqamat, y luego se estableció en Mayyafariqin como su khatib y mufti; al-Imad en el Kharida lo llama \"el allama de la época, inigualable en prosa y verso\"; d. 551 - se inclinaba hacia el chiísmo {cita: shadharat-dhahab p. 648-649}."
  fr: "Mu'in al-Din al-Haskafi Yahya ibn Salama, le Shafi'i connu sous le nom d'al-Khatib, nisba à la forteresse Hisn Kayfa; il est venu à Bagdad, a maîtrisé le fiqh, a lu l'adab sous la direction d'Abou Zakariyya al-Tibrizi, le commentateur du Maqamat, puis s'est installé à Mayyafariqin comme khatib et mufti; al-Imad dans la Kharida l'appelle « l'allama de l'époque, inégalé en prose et en vers »; d. 551 — il était enclin au chiisme {cite: shadharat-dhahab p. 648-649}."
  ur: "معین الدین الحسکفی یحییٰ بن سلامہ، شافعی جسے الخطیب کہا جاتا ہے، قلعہ حسن کیفہ کا نسبہ؛ وہ بغداد آئے، فقہ میں مہارت حاصل کی، مقام مفسر ابو زکریا التبریزی کے تحت ادب پڑھا، پھر مایافارکین میں اس کے خطیب اور مفتی کے طور پر سکونت اختیار کی۔ خریدہ میں العماد اسے 'عمر کا علامہ، نثر اور نظم میں بے مثال' کہتے ہیں۔ d 551 - وہ شیعہ مذہب کی طرف مائل ہوا 648-649}۔"
  tr: "Mu'in al-Din al-Haskafi Yahya bin Salama al-Shafi'i, yani Al-Khatib, Kifa kalesinden adını aldı; Kifa kalesinde büyüdü ve Bağdat'a geldi; burada fıkıh eğitimi aldı ve başarılı oldu. Mekamat yorumcusu vaiz Ebu Zekeriye el-Tabrizi'nin yanında edebiyat okudu, ardından memleketine döndü, Miafariqin'e yerleşti, hitablık görevleri üstlendi ve fetva vermek ve insanlara fayda sağlayan çalışmalarla meşgul olmakla görevlendirildi. Al-Imad, Al-Khuraida'da dönemin seçkin bir alimi olduğunu ve düzyazı ve şiirlerinde olduğunu söyledi. İbn Şahba, onun zarif süslemelerine, değerli paronomasia, etkileyici ve zarif ifadelerine ve sade, derin bir anlamı olduğunu söyledi; 551 Hicri'de öldü ve Şiiydi {atıf: Shadharat-Dhahab s. 648-649}."
  id: "Mu'in al-Din al-Haskafi Yahya ibn Salama al-Shafi'i, dikenal sebagai Al-Khatib, dinamai dari benteng Kifa, benteng yang dipertahankan; ia tumbuh besar di benteng Kifa dan datang ke Baghdad, di mana ia belajar hukum hingga berprestasi. Ia belajar sastra di bawah pengkhotbah Abu Zakariya al-Tabrizi, seorang komentator maqamat, lalu kembali ke tanah airnya, menetap di Miafariqin, mengambil tugas pidato, dan diangkat untuk mengeluarkan fatwa serta terlibat dalam pekerjaan yang bermanfaat bagi masyarakat. Al-Imad mengatakan dalam Al-Khuraida bahwa ia adalah ulama terkemuka pada zamannya dalam prosa dan puisinya. Ibn Shahba mengatakan ia memiliki ornamen yang indah, paronomasia yang berharga, ekspresi yang fasih dan halus, serta makna yang sederhana dan mendalam; ia meninggal pada tahun 551 H dan merupakan seorang Syiah {cite:shadharat-dhahab hlm. 648-649}."
