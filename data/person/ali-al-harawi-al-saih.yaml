label: { ar: "علي الهروي السائح", en: "Ali al-Harawi, the Wanderer" }
summary:
  ar: "أبو الحسن علي بن أبي بكر بن علي المروي الأصل الموصلي المولد؛ السائح المشهور نزيل حلب؛ طاف البلاد وأكثر من الزيارات وكاد يطبق الأرض بالدوران فلم يترك براً ولا بحراً ولا سبلاً ولا جبلاً من الأماكن التي يمكن قصدها ورؤيتها إلا رآها؛ وما وصل إلى موضع إلا كتب خطه في حائطه — قال ابن خلكان: ولقد شاهدت ذلك في البلاد التي رأيتها مع كثرتها؛ وفي صقلية شاهد بركان إتنا واجتمع بابن الحجر {cite:wafayat-ayan}."
  en: "Abu al-Hasan Ali b. Abi Bakr al-Harawi 'the Wanderer' — Islam's greatest traveller before Ibn Battuta: he covered land and sea, left his inscription on walls everywhere (Ibn Khallikan saw them himself), and stood before Etna in Sicily {cite:wafayat-ayan}."
