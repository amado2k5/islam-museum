id: person/ali-al-harawi-al-saih
class: person
label: { ar: "علي الهروي السائح", en: "Ali al-Harawi, the Wanderer", fr: "Ali al-Harawi, le Voyageur", es: "Ali al-Harawi, the Wanderer", ur: "علی الحروی، آوارہ" }
summary:
  ar: "أبو الحسن علي بن أبي بكر بن علي المروي الأصل الموصلي المولد؛ السائح المشهور نزيل حلب؛ طاف البلاد وأكثر من الزيارات وكاد يطبق الأرض بالدوران فلم يترك براً ولا بحراً ولا سبلاً ولا جبلاً من الأماكن التي يمكن قصدها ورؤيتها إلا رآها؛ وما وصل إلى موضع إلا كتب خطه في حائطه — قال ابن خلكان: ولقد شاهدت ذلك في البلاد التي رأيتها مع كثرتها؛ وفي صقلية شاهد بركان إتنا واجتمع بابن الحجر {cite:wafayat-ayan}."
  en: "Abu al-Hasan Ali b. Abi Bakr al-Harawi 'the Wanderer' — Islam's greatest traveller before Ibn Battuta: he covered land and sea, left his inscription on walls everywhere (Ibn Khallikan saw them himself), and stood before Etna in Sicily {cite:wafayat-ayan}."
  fr: "Abu al-Hasan Ali b. Abi Bakr al-Harawi « le Vagabond  » – le plus grand voyageur de l’Islam avant Ibn Battuta  : il couvrait terre et mer, laissait son inscription sur les murs partout (Ibn Khallikan les vit lui-même), et se tenait devant l’Etna en Sicile {cite:wafayat-ayan}."
  es: "Abu al-Hasan Ali b. Abi Bakr al-Harawi 'el Errante': el mayor viajero del Islam antes de Ibn Battuta: recorrió tierra y mar, dejó su inscripción en muros por todas partes (Ibn Khallikan las vio él mismo) y estuvo frente al Etna en Sicilia {cite:wafayat-ayan}."
  ur: "ابو الحسن علی بی۔ ابی بکر الحروی 'آوارہ گرد' - ابن بطوطہ سے پہلے اسلام کا سب سے بڑا مسافر: اس نے خشکی اور سمندر کا احاطہ کیا، ہر جگہ دیواروں پر اپنا لکھا ہوا چھوڑ دیا ⁦(ابن خلیقان نے انہیں خود دیکھا)⁩، اور سسلی میں ایٹنا کے سامنے کھڑا ہوا۔"
  tr: "Ebu el-Hasan Ali ibn Ebu Bekir bin Ali el-Mervi, aslen Musul'dan, Musul'da doğmuş; Halep'te yaşayan ünlü bir gezgin; toprakları gezdi ve birçok kez ziyaret etti, neredeyse dönerek yeryüzünü geçti, hiçbir kara, deniz, yol ya da dağı görmeden ziyaret etti; ve sadece duvarına yazıtını yazarak ulaştı. — İbn Hallikan şöyle dedi: Bol olmasına rağmen gördüğüm topraklarda bunu gördüm; Sicilya'da Etna volkanını gördü ve İbn al-Hajar ile görüştü."
  id: "Abu al-Hasan Ali ibn Abi Bakr ibn Ali al-Marwi, berasal dari Mosul, lahir di Mosul; seorang pelancong terkenal yang tinggal di Aleppo; ia berkeliling negeri dan melakukan banyak kunjungan, hampir menyeberangi bumi dengan berbalik, tidak meninggalkan daratan, laut, jalur, atau gunung untuk dikunjungi tanpa melihatnya; dan ia tidak pernah sampai ke tempat lain kecuali menulis prasasti di dindingnya. — Ibn Khallikan berkata: Saya telah melihat ini di negeri-negeri yang saya lihat meskipun melimpah; di Sisilia, ia menyaksikan gunung berapi Etna dan bertemu dengan Ibn al-Hajar {cite:wafayat-ayan}."
