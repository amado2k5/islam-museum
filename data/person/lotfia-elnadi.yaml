summary:
  ar: "لطفية النادي ⁦(1907–2002)⁩ طيّارة مصرية رائدة، أول مصرية وعربية وأفريقية تحصل على رخصة طيران ⁦(1933)⁩، وشاركت في سباق القاهرة-الإسكندرية الجوي وعملت في نادي الطيران بألماظة."
  en: "Lotfia ElNadi (1907–2002) was a pioneering Egyptian aviator, the first Egyptian, Arab and African woman to earn a pilot's licence in 1933. She flew in the Cairo–Alexandria air race and worked at Almaza aviation club."
  ur: "لطفیہ النادی ⁦(1907–2002)⁩ پیش رو مصری پائلٹ تھیں، 1933 میں پائلٹ لائسنس لینے والی پہلی مصری، عرب اور افریقی خاتون۔ انہوں نے قاہرہ-اسکندریہ ہوائی ریس میں حصہ لیا اور الماظہ ایوی ایشن کلب میں کام کیا۔"
  es: "Lotfia ElNadi (1907-2002) fue una aviadora egipcia pionera, la primera mujer egipcia, árabe y africana en obtener una licencia de piloto en 1933. Participó en la carrera aérea El Cairo-Alejandría y trabajó en el club de aviación Almaza."
  fr: "Lotfia ElNadi (1907–2002) était une aviatrice égyptienne pionnière, la première femme égyptienne, arabe et africaine à obtenir une licence de pilote en 1933. Elle a participé à la course aérienne Le Caire-Alexandrie et a travaillé au club d'aviation Almaza."
  tr: "Lotfia Al-Nadi (1907–2002), öncü bir Mısırlı pilottu; uçuş lisansı alan ilk Mısırlı, Arap ve Afrikalı kadın (1933). Kahire-İskenderiye hava yarışına katıldı ve Almaza Havacılık Kulübü'nde çalıştı."
  id: "Lotfia Al-Nadi (1907–2002) adalah seorang pilot Mesir pelopor, wanita Mesir, Arab, dan Afrika pertama yang memperoleh lisensi terbang (1933). Ia berpartisipasi dalam balapan udara Kairo-Alexandria dan bekerja di Klub Penerbangan Almaza."
