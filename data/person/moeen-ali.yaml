summary:
  ar: "لاعب كريكت إنجليزي، وُلد في برمنغهام سنة 1987 من أصل كشميري وإنجليزي. لاعب شامل يضرب باليسرى ويرمي دورانا باليمنى، لعب لإنجلترا بين 2014 و2024 في 68 مباراة اختبار و138 مباراة ليوم واحد و92 مباراة دولية عشرينية، وكان نائب قائد إنجلترا في الكريكت المحدود، وفاز معها بكأس العالم 2019 وكأس العالم للعشرينيات 2022، وسجّل في مباريات الاختبار 3094 جولة وأخذ 204 ويكيت، واعتزل الكريكت الدولي في سبتمبر 2024، ونشر سيرته الذاتية «معين» سنة 2018."
  en: "English cricketer, born in Birmingham in 1987 of Kashmiri and English descent. A left-handed batting, right-arm off-spin all-rounder, he played for England from 2014 to 2024 in 68 Tests, 138 One Day Internationals and 92 Twenty20 Internationals, was England's vice-captain in limited-overs cricket, won the 2019 Cricket World Cup and the 2022 T20 World Cup with England, scored 3,094 Test runs and took 204 Test wickets, retired from international cricket in September 2024, and published his autobiography Moeen in 2018."
  ur: "انگلش کرکٹ کھلاڑی، جو 1987 میں برمنگھم میں کشمیری اور انگریز نسل سے پیدا ہوئے۔ بائیں ہاتھ سے بلے بازی اور دائیں ہاتھ سے آف اسپن کرنے والے آل راؤنڈر کی حیثیت سے انھوں نے 2014ء سے 2024ء تک انگلینڈ کے لیے 68 ٹیسٹ، 138 ایک روزہ اور 92 ٹی ٹوئنٹی بین الاقوامی میچ کھیلے، محدود اوورز کرکٹ میں انگلینڈ کے نائب کپتان رہے، انگلینڈ کے ساتھ 2019ء کرکٹ ورلڈ کپ اور 2022ء ٹی ٹوئنٹی ورلڈ کپ جیتا، ٹیسٹ کرکٹ میں 3,094 رنز بنائے اور 204 وکٹیں لیں، ستمبر 2024 میں بین الاقوامی کرکٹ سے ریٹائر ہوئے، اور 2018 میں اپنی خودنوشت «معین» شائع کی۔"
