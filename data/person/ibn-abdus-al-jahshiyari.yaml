label: { ar: "ابن عبدوس الجهشياري", en: "Ibn Abdus al-Jahshiyari", es: "Ibn Abdus al-Jahshiyari", fr: "Ibn Abdus al-Jahshiyari", ur: "ابن عبد جہشیاری" }
summary:
  ar: "أبو عبد الله بن عبدوس الجهشياري، صنف أخبار المقتدر بالله في ألوف من الأوراق ووقع للمسعودي منها أجزاء يسيرة، وأخبره أهل الدراية أنه صنف أخبار كل واحد من الخلفاء لمعاً {cite:muruj-al-dhahab p. 649-650}. وابتدأ بتأليف كتاب اختار فيه ألف سمر من أسمار العرب والعجم والروم فاجتمع له أربعمائة وثمانون ليلة كل ليلة نحو خمسين ورقة ثم عاجلته المنية قبل تتميم الألف {cite:fihrist-ibn-al-nadim p. 423}"
  en: "The historian whose annals of al-Muqtadir ran to thousands of folios {cite:muruj-al-dhahab p. 649-650}."
  es: "El historiador cuyos anales de al-Muqtadir constan de miles de folios {citar:muruj-al-dhahab p. 649-650}."
  fr: "L'historien dont les annales d'al-Muqtadir comptaient en milliers de feuillets {cite:muruj-al-dhahab p. 649-650}."
  ur: "وہ مورخ جس کی تاریخ المقتدیر نے ہزاروں فولیو تک پہنچائی۔ 649-650}۔"
  tr: "Ebu Abdullah ibn Abdus al-Jahshiyari, al-Muqtadir Billah'ın raporlarını binlerce sayfada derledi ve El-Mes'udi'nin sadece birkaç bölümü vardı. Alimler, her halifenin anlatımlarını birlikte derlediğini ona bildirmişlerdir {atıf:muruj-al-dhahab s. 649-650}. Arapların, Arap olmayanların ve Romalıların kulaklarından bin Samar seçtiği bir kitap yazarak başladı; her gece toplamda dört yüz seksen gece, yaklaşık elli sayfa uzunluğunda, ardından bin sayfayı tamamlamadan ölümü gerçekleşti {atıf:fihrist-ibn-al-nadim s. 423}"
  id: "Abu Abdullah ibn Abdus al-Jahshiyari menyusun laporan al-Muqtadir Billah dalam ribuan halaman, dan Al-Mas'udi hanya memiliki beberapa bagian. Para ulama memberitahunya bahwa ia mengumpulkan catatan masing-masing khalifah secara bersama-sama {cite:muruj-al-dhahab hlm. 649-650}. Ia memulai dengan menulis sebuah buku di mana ia memilih seribu Samar dari telinga orang Arab, non-Arab, dan Romawi, total empat ratus delapan puluh malam setiap malam, sekitar lima puluh halaman, sebelum kematiannya segera terjadi sebelum menyelesaikan seribu {cite:fihrist-ibn-al-nadim hlm. 423}"
