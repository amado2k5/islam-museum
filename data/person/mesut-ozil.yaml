summary:
  ar: "لاعب كرة قدم ألماني محترف سابق، وُلد في غيلزنكيرشن سنة 1988 لأبوين مهاجرين تركيين؛ لاعب وسط مهاجم لشالكه وفيردر بريمن وريال مدريد وأرسنال وفنربخشة وإسطنبول باشاكشهير، اشتهر برؤيته وتمريراته الحاسمة، فاز بالدوري الإسباني مع ريال مدريد وبثلاثة كؤوس إنجليزية مع أرسنال وبكأس العالم 2014 مع ألمانيا، واعتزل اللعب الدولي سنة 2018 بدعوى التمييز وعدم الاحترام، واعتزل اللعب نهائيًا سنة 2023."
  en: "German former professional footballer, born in Gelsenkirchen in 1988 to Turkish immigrant parents. An attacking midfielder for Schalke 04, Werder Bremen, Real Madrid, Arsenal, Fenerbahçe and İstanbul Başakşehir, renowned for his vision and assists, he won La Liga with Real Madrid, three FA Cups with Arsenal and the 2014 World Cup with Germany, retired from international football in 2018 alleging discrimination and disrespect, and retired from playing in 2023."
  ur: "جرمن سابق پیشہ ور فٹبالر، 1988 میں گیلزنکیرشن میں ترک مہاجر والدین کے ہاں پیدا ہوئے؛ شالکے، ویرڈر بریمن، ریال میڈرڈ، آرسنل، فنربخشے اور استنبول باشاکشہر کے حملہ آور مڈفیلڈر، اپنی بصیرت اور اسسٹس کے لیے مشہور، انہوں نے ریال میڈرڈ کے ساتھ لا لیگا، آرسنل کے ساتھ تین ایف اے کپ اور جرمنی کے ساتھ 2014 ورلڈ کپ جیتا، 2018 میں امتیاز اور بے احترامی کا الزام لگا کر بین الاقوامی فٹبال سے ریٹائر ہوئے، اور 2023 میں کھیل سے ریٹائر ہوئے۔"
