summary:
  ar: "نائب خير الدين بربروسة على الجزائر؛ يصفه الصلابي بأنه كان عاقلاً صالحاً صاحب علم واسع. انهمك في توطيد الأمن وجمع أطراف البلاد حول السلطة المركزية فأخضع مستغانم واستولى على عاصمة الزاب بكرة وشيد فيها حصناً وأقام حامية. وفي جمادى الأولى ٩٤٩هـ/سبتمبر ١٥٣٩م قاد ألفاً وثلاثمائة على ثلاث عشرة سفينة إلى الساحل الأسباني الجنوبي. وفي ٢٨ جمادى الآخرة ٩٤٨هـ/١٥ أكتوبر ١٥٤١م دافع عن الجزائر ضد حملة شارل الخامس ورد على خطاب التهديد: «أنا خادم السلطان سليمان.. إذا جاء هذه البلاد العدو لا يعطى إلا الموت»، وانتصر بعون العاصفة فأنعم عليه السلطان برتبة الباشوية. توفي سنة ٩٥١هـ/١٥٤٤م {cite:dawlat-uthmaniyya-salabi p. 216-229}."
  en: "Khayr al-Din Barbarossa's deputy over Algiers — 'wise, pious, of wide learning' in al-Salabi's phrase. He secured Mostaganem and took Biskra, raided the southern Spanish coast in 949/1539 with 1,300 men on thirteen ships, and in October 1541 defended Algiers against Charles V's armada, answering the emperor's threat-letter: 'I am the servant of Sultan Süleyman… this land gives an invader only death.' The storm broke the fleet; the sultan made him pasha. He died in 951/1544 {cite:dawlat-uthmaniyya-salabi p. 216-229}."
