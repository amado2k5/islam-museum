summary:
  ar: "نائب خير الدين بربروسة على الجزائر؛ يصفه الصلابي بأنه كان عاقلاً صالحاً صاحب علم واسع. انهمك في توطيد الأمن وجمع أطراف البلاد حول السلطة المركزية فأخضع مستغانم واستولى على عاصمة الزاب بكرة وشيد فيها حصناً وأقام حامية. وفي جمادى الأولى ٩٤٩هـ/سبتمبر ١٥٣٩م قاد ألفاً وثلاثمائة على ثلاث عشرة سفينة إلى الساحل الأسباني الجنوبي. وفي ٢٨ جمادى الآخرة ٩٤٨هـ/١٥ أكتوبر ١٥٤١م دافع عن الجزائر ضد حملة شارل الخامس ورد على خطاب التهديد: «أنا خادم السلطان سليمان.. إذا جاء هذه البلاد العدو لا يعطى إلا الموت»، وانتصر بعون العاصفة فأنعم عليه السلطان برتبة الباشوية. توفي سنة ٩٥١هـ/١٥٤٤م {cite:dawlat-uthmaniyya-salabi p. 216-229}."
  en: "Khayr al-Din Barbarossa's deputy over Algiers — 'wise, pious, of wide learning' in al-Salabi's phrase. He secured Mostaganem and took Biskra, raided the southern Spanish coast in 949/1539 with 1,300 men on thirteen ships, and in October 1541 defended Algiers against Charles V's armada, answering the emperor's threat-letter: 'I am the servant of Sultan Süleyman… this land gives an invader only death.' The storm broke the fleet; the sultan made him pasha. He died in 951/1544 {cite:dawlat-uthmaniyya-salabi p. 216-229}."
  es: "Khayr al-Din Barbarroja, lugarteniente de Argel —«sabio, piadoso y de vastos conocimientos», en palabras de al-Salabi—, se aseguró Mostaganem y tomó Biskra. En 949/1539, asaltó la costa sur de España con 1300 hombres en trece barcos, y en octubre de 1541 defendió Argel contra la armada de Carlos V, respondiendo a la carta amenazante del emperador: «Soy el servidor del sultán Solimán… esta tierra solo ofrece la muerte a un invasor». La tormenta destruyó la flota; el sultán lo nombró pachá. Murió en 951/1544 {cita:dawlat-uthmaniyya-salabi, págs. 216-229}."
  fr: "Le lieutenant de Khayr al-Din Barberousse à Alger – « sage, pieux et d'une grande érudition », selon l'expression d'al-Salabi –, s'empara de Mostaganem et de Biskra. En 949/1539, il mena un raid sur la côte sud de l'Espagne avec 1 300 hommes répartis sur treize navires. En octobre 1541, il défendit Alger contre l'Armada de Charles Quint, répondant à la lettre de menace de l'empereur: « Je suis au service du sultan Soliman… cette terre n'offre que la mort à l'envahisseur. » La tempête brisa la flotte; le sultan le nomma pacha. Il mourut en 951/1544 (voir: Dawlat-Uthmaniyya-Salabi, p. 216-229)."
  ur: "خیرالدین بارباروسا کا نائب الجزائر - السلابی کے فقرے میں 'عقلمند، متقی، وسیع علم والا'۔ اس نے مستگنیم کو محفوظ کیا اور بسکرا کو لے لیا، 949/1539 میں تیرہ بحری جہازوں پر 1300 آدمیوں کے ساتھ جنوبی ہسپانوی ساحل پر چھاپہ مارا، اور اکتوبر 1541 میں چارلس پنجم کے آرماڈا کے خلاف الجزائر کا دفاع کیا، شہنشاہ کے دھمکی آمیز خط کا جواب دیتے ہوئے: 'میں اس سرزمین کا واحد بندہ ہوں جس کی موت ساؤلٹ مین ہے'۔ طوفان نے بیڑہ توڑ دیا۔ سلطان نے اسے پاشا بنا دیا۔ ان کی وفات 951/1544 میں ہوئی۔ 216-229}۔"
  tr: "Yararlaneddin Barbarossa'nın Cezayir yardımcısı; Al-Sallabi onu bilge, doğru ve geniş bilgiye sahip biri olarak tanımlar. Güvenliği güçlendirmeye ve ülkenin fraksiyonlarını merkezi otorite etrafında birleştirmeye, Mostaganem'i boyun eğdirmeye, başkent Zab Bekra'yı ele geçirmeye, orada bir kale inşa etmeye ve garnizon kurmaya kendini adadı. Jumada al-Awwal 949 Hicri / Eylül 1539'da, on üç gemiyle bin üç yüz gemiyi güney İspanya kıyısına yönlendirdi. 28 Cumedül-Akhira 948 Hicri / 15 Ekim 1541'de Cezayir'i V. Karl'ın seferine karşı savundu ve tehditkar mektuba yanıt verdi: \"Ben Sultan Süleyman'ın hizmetkarıyım... Bu toprak işgal edilirse, düşmana sadece ölüm verilir,\" ve fırtınanın yardımıyla zafer kazanarak Sultan'a Paşavi rütbesi verdi. 951 Hicri / 1544 yılında öldü {atıf:Dawlat-uthmaniyya-salabi s. 216-229}."
  id: "Wakil Khayr al-Din Barbarossa atas Aljazair; Al-Sallabi menggambarkannya sebagai orang bijaksana dan benar dengan pengetahuan luas. Ia berdedikasi untuk memperkuat keamanan dan menyatukan faksi-faksi di sekitar otoritas pusat, menaklukkan Mostaganem, merebut ibu kota Zab Bekra, membangun benteng di sana, dan mendirikan garnisun. Pada Jumada al-Awwal 949 H / September 1539 M, ia memimpin seribu tiga ratus kapal dengan tiga belas kapal ke pantai selatan Spanyol. Pada 28 Jumada al-Akhira 948 H / 15 Oktober 1541 M, ia membela Aljazair dari kampanye Charles V dan menanggapi surat ancaman: \"Saya adalah pelayan Sultan Suleiman... Jika tanah ini diserang, musuh hanya akan dihukum mati,\" dan ia menang dengan bantuan badai, memberikan Sultan pangkat Pashawi. Ia meninggal pada tahun 951 H / 1544 M {cite:Dawlat-uthmaniyya-salabi hlm. 216-229}."
