summary:
  ar: "صاحب شرطة بغداد؛ أسرع القاهر بالله بالقبض على جماعة دار مؤنس سنة 321هـ ونُهبت داره مع دور المتعلقين بابن مقلة بعد ذلك {cite:kamil-ibn-al-athir p. 190-191}."
  en: "Baghdad police chief who made the arrests in Mu'nis's house for al-Qahir in 321; his own house was later plundered with Ibn Muqla's faction {cite:kamil-ibn-al-athir p. 190-191}."
  es: "Jefe de policía de Bagdad que realizó los arrestos en la casa de Mu'nis para al-Qahir en 321; su propia casa fue posteriormente saqueada por la facción de Ibn Muqla {cite:kamil-ibn-al-athir p. 190-191}."
  fr: "chef de la police de Bagdad qui a procédé aux arrestations dans la maison de Mu'nis pour al-Qahir en 321; sa propre maison a ensuite été pillée avec la faction d'Ibn Muqla {cite:kamil-ibn-al-athir p. 190-191}."
  ur: "بغداد پولیس کا سربراہ جس نے 321 میں القاہر کے لیے معنیس کے گھر میں گرفتاریاں کیں۔ اس کا اپنا گھر بعد میں ابن مقلہ کے گروہ کے ساتھ لوٹ لیا گیا۔ 190-191}۔"
  tr: "Bağdat polis şefi Al-Qahir Billah, Hicri 321 yılında Dar Mu'nis grubunu hızla tutukladı ve bundan sonra İbn Muqlah ile bağlantılı kişilerin evleriyle birlikte onun evi de yağmalandı. {Kaynak: Kamil-ibn-al-athir s. 190-191}"
  id: "Kepala kepolisian Baghdad, Al-Qahir Billah, dengan cepat menangkap kelompok Dar Mu’nis pada tahun 321 H, dan rumahnya dijarah bersama dengan rumah-rumah kerabat Ibn Muqlah setelah itu {cite:kamil-ibn-al-athir p. 190-191}."
