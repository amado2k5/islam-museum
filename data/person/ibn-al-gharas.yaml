summary:
  ar: "محمد بن محمد بن محمد بن خليل، أبو يسر، المعروف بابن الغرس، من أهل القاهرة. حفظ القرآن وهو ابن تسع، واشتغل بالفقه على ابن الدبري وابن الهمام وأبي العباس السرسي، وحج وجاور غير مرة، وأقرأ الطلبة بمكة. ونازعه البقاعي فوصفه بالاتحادية. من تصانيفه «الفواكه البدرية في الأقضية الحكمية»، وحاشيته على شرح التفتازاني للعقائد النسفية، وكتاب في أدب القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1605}"
  en: "Muhammad ibn Muhammad ibn Muhammad ibn Khalil, Abu Yusr, known as Ibn al-Gharas, of Cairo. He memorised the Qur'an at nine, studied law under Ibn al-Dabri, Ibn al-Humam and Abu al-Abbas al-Sarsi, performed the pilgrimage and stayed in Mecca several times, where he taught students. In a dispute with al-Biqa'i, the latter described him as a supporter of unity-of-being views. His works include al-Fawakih al-badriyya fi al-aqdiya al-hukmiyya, a gloss on al-Taftazani's commentary on the Nasafi creed, and a book on the etiquette of judgeship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1605}"
  es: "Muhammad ibn Muhammad ibn Muhammad ibn Khalil, Abu Yusr, también conocido como Ibn al-Gharas, de El Cairo. Memorizó el Corán a los nueve años, estudió derecho con Ibn al-Dabri, Ibn al-Humam y Abu al-Abbas al-Sarsi, realizó la peregrinación y permaneció en La Meca varias veces, donde impartió clases. En una disputa con al-Biqa'i, este último lo describió como partidario de la doctrina de la unidad del ser. Entre sus obras destacan al-Fawakih al-badriyya y al-aqdiya al-hukmiyya, un glosario del comentario de al-Taftazani sobre el credo nasafí y un libro sobre la etiqueta del juicio. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1604} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1605}"
  fr: "Muhammad ibn Muhammad ibn Muhammad ibn Khalil, dit Abu Yusr, également connu sous le nom d'Ibn al-Gharas, du Caire. Il mémorisa le Coran à l'âge de neuf ans, étudia le droit auprès d'Ibn al-Dabri, d'Ibn al-Humam et d'Abu al-Abbas al-Sarsi, accomplit le pèlerinage et séjourna plusieurs fois à La Mecque, où il enseigna. Lors d'une dispute avec al-Biqa'i, ce dernier le décrivit comme un partisan de la doctrine de l'unité de l'être. Parmi ses œuvres figurent al-Fawakih al-badriyya et al-aqdiya al-hukmiyya, une glose du commentaire d'al-Taftazani sur la doctrine nasafite, ainsi qu'un ouvrage sur l'éthique du jugement."
  ur: "محمد بن محمد بن محمد بن خلیل، ابو یسر، جسے ابن الغراس بھی کہا جاتا ہے، قاہرہ کا۔ اس نے نو سال کی عمر میں قرآن حفظ کیا، ابن الدبری، ابن الحمام اور ابو العباس السرسی سے قانون کی تعلیم حاصل کی، حج کیا اور کئی بار مکہ میں رہے، جہاں اس نے طلباء کو پڑھایا۔ البیقاعی کے ساتھ ایک تنازعہ میں، مؤخر الذکر نے اسے اتحاد کے نظریات کا حامی قرار دیا۔ ان کی تصانیف میں الفواکیہ البدریہ اور العقدیہ الحکمیہ، تفتازانی کی ناصفی عقیدہ کی تفسیر پر ایک تالیف، اور قضاوت کے آداب پر ایک کتاب شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1604}"
