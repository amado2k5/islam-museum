summary:
  ar: "محمد بن محمد بن محمد بن خليل، أبو يسر، المعروف بابن الغرس، من أهل القاهرة. حفظ القرآن وهو ابن تسع، واشتغل بالفقه على ابن الدبري وابن الهمام وأبي العباس السرسي، وحج وجاور غير مرة، وأقرأ الطلبة بمكة. ونازعه البقاعي فوصفه بالاتحادية. من تصانيفه «الفواكه البدرية في الأقضية الحكمية»، وحاشيته على شرح التفتازاني للعقائد النسفية، وكتاب في أدب القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1605}"
  en: "Muhammad ibn Muhammad ibn Muhammad ibn Khalil, Abu Yusr, known as Ibn al-Gharas, of Cairo. He memorised the Qur'an at nine, studied law under Ibn al-Dabri, Ibn al-Humam and Abu al-Abbas al-Sarsi, performed the pilgrimage and stayed in Mecca several times, where he taught students. In a dispute with al-Biqa'i, the latter described him as a supporter of unity-of-being views. His works include al-Fawakih al-badriyya fi al-aqdiya al-hukmiyya, a gloss on al-Taftazani's commentary on the Nasafi creed, and a book on the etiquette of judgeship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1605}"
