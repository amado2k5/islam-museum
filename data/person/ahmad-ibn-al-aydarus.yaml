summary:
  ar: "القطب العارف بالله أحمد بن الشيخ حسين بن الشيخ عبد الله العيدروس؛ قال في النور: كان من سادات مشايخ الطريقة المكاشفين بأنوار الحقيقة، جمع له بين كمال الخُلق والخلْق وبسط المعرفة وصحة النية وصدق المعاملة، ومناقبه كثيرة وأحواله شهيرة؛ وتوفي في سابع جمادى الأولى بتريم ورثاه والدي بمرثية عظيمة مطلعها: «تقضى فتمضي حكمها الأقدار — والصفو تحدث بعده الأكدار» {cite:shadharat-dhahab p. 352}."
  en: "Ahmad al-'Aydarus — 'qutb, knower of God, master of the way's shaykhs, unveiled by the lights of reality'; he died at Tarim on 7 Jumada I [968]; Ibn al-'Imad's own father elegised him {cite:shadharat-dhahab p. 352}."
