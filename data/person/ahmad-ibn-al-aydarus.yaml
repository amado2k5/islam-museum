summary:
  ar: "القطب العارف بالله أحمد بن الشيخ حسين بن الشيخ عبد الله العيدروس؛ قال في النور: كان من سادات مشايخ الطريقة المكاشفين بأنوار الحقيقة، جمع له بين كمال الخُلق والخلْق وبسط المعرفة وصحة النية وصدق المعاملة، ومناقبه كثيرة وأحواله شهيرة؛ وتوفي في سابع جمادى الأولى بتريم ورثاه والدي بمرثية عظيمة مطلعها: «تقضى فتمضي حكمها الأقدار — والصفو تحدث بعده الأكدار» {cite:shadharat-dhahab p. 352}."
  en: "Ahmad al-'Aydarus — 'qutb, knower of God, master of the way's shaykhs, unveiled by the lights of reality'; he died at Tarim on 7 Jumada I [968]; Ibn al-'Imad's own father elegised him {cite:shadharat-dhahab p. 352}."
  fr: "Ahmad al-'Aydarus, qualifié de qutb, connaissant de Dieu, maître des cheikhs de la Voie, dévoilé par les lumières de la réalité ; il mourut à Tarim le 7 joumada I [968 H] ; le père d'Ibn al-'Imad lui-même composa son élégie {cite:shadharat-dhahab p. 352}."
  es: "Ahmad al-'Aydarus — 'qutb, conocedor de Dios, maestro de los shaykhs del camino, revelado por las luces de la realidad'; murió en Tarim el 7 de Jumada I [968]; el propio padre de Ibn al-'Imad le dedicó una elegía {cite:shadharat-dhahab p. 352}."
  ur: "احمد العیدارس - 'قطب، خدا کا جاننے والا، طریقت کے شیوخ کا مالک، حقیقت کی روشنیوں سے پردہ اٹھانے والا'؛ 7 جمادی الثانی [968] کو ترم میں وفات پائی۔ ابن عماد کے اپنے والد نے ان کی تقلید کی ہے۔ 352}۔"
