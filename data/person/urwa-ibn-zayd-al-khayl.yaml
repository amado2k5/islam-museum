id: person/urwa-ibn-zayd-al-khayl
class: person
label: { ar: "عروة بن زيد الخيل الطائي", en: "Urwa ibn Zayd al-Khayl al-Ta'i", es: "Urwa ibn Zayd al-Khayl al-Ta'i", fr: "Urwa ibn Zayd al-Khayl al-Ta'i", ur: "عروہ ابن زید الخیل الطائی" }
summary:
  ar: "عروة بن زيد الخيل الطائي؛ عند البلاذري وجهه أبو عبيد إلى الزوابي فصالح دهقانها على مثل صلح باروسما وقاتل يوم الجسر قتالاً شديداً عدل بقتال جماعة وكتب معه المثنى إلى عمر بالخبر وبعثه عمر بأمر عمار إلى الري ودستبا في ثمانية آلاف بعد شهرين من نهاوند فأظهره الله على جموع الديلم وأهل الري فخلف أخاه حنظلة وقدم على عمر بالبشارة فسماه البشير لأنه كان القادم بخبر الجسر فأحب أن يأتيه بما يسره وقال برزت لأهل القادسية معلماً وما كل من يفشي الكريهة يعلم."
  en: "Urwa ibn Zayd al-Khayl al-Ta'i; in al-Baladhuri sent by Abu Ubayd to al-Zawabi whose dihqan he pacified on Barusma's terms; at the Bridge he fought a fight worth a company's and carried al-Muthanna's report to Umar. Sent by Ammar at Umar's command to Rayy and Dastaba with eight thousand — victorious over Daylam and Rayy's host — he bore the news to Umar himself and was named al-Bashir, he who once carried the Bridge's tidings."
  es: "Urwa ibn Zayd al-Khayl al-Ta'i; en al-Baladhuri, enviado por Abu Ubayd a al-Zawabi, a cuya dihqan pacificó según los términos de Barusma; en el Puente libró una batalla digna de una compañía y llevó el informe de al-Muthanna a Umar. Enviado por Ammar por orden de Umar a Rayy y Dastaba con ocho mil hombres —victoriosos sobre Daylam y el ejército de Rayy—, llevó la noticia al propio Umar y fue llamado al-Bashir, aquel que una vez llevó las noticias del Puente."
  fr: "Urwa ibn Zayd al-Khayl al-Ta'i; envoyé par Abu Ubayd à al-Baladhuri auprès d'al-Zawabi, dont il apaisa la rébellion selon les conditions de Barusma; au Pont, il livra un combat acharné et rapporta le rapport d'al-Muthanna à Umar. Envoyé par Ammar, sur ordre d'Umar, auprès de Rayy et Dastaba avec huit mille hommes – victorieux de Daylam et des troupes de Rayy – il apporta la nouvelle à Umar en personne et fut nommé al-Bashir, celui qui jadis porta la nouvelle du Pont."
  ur: "عروہ ابن زید الخیل الطائی؛ البلادوری میں ابو عبید کی طرف سے الزوابی کو بھیجا گیا جس کے دہقان کو اس نے برصمہ کی شرائط پر تسلی دی تھی۔ پل پر اس نے ایک کمپنی کی لڑائی لڑی اور المثنا کی رپورٹ عمر تک پہنچائی۔ عمر کے حکم پر عمار کے حکم پر آٹھ ہزار کے ساتھ رے اور دستبہ کے پاس بھیجا - دیلم اور رے کے میزبان پر فتح - اس نے خود عمر کو خبر دی اور اس کا نام البشیر رکھا گیا، وہ جو کبھی پل کی خبر پہنچاتا تھا۔"
  tr: "Urwah ibn Zayd al-Khayl al-Tai; el-Baladhuri'ye göre, Ebu Ubeyd onu el-Zevabi'ye teslim etti, o da çiftliğini Barusma Antlaşması'na benzer bir anlaşmayla uzlaştırdı. Köprü günü, bir grup savaşçıyla şiddetle savaştı ve Ömer'e rapor yazdı. Ömer onu Ammar'ın emriyle Rayy'ye gönderdi ve Nahavand'dan iki ay sonra sekiz bin ay içinde tutuklandı. Allah onu Daylam halkına ve Rayı halkına vahyetti. Kardeşi Hanzela'nın yerine geçti ve Ömer'e hoş haberle geldi, köprü haberini getiren olarak atadı. Ona hoşuna gittiklerini getirmek istedi, dedi ki: Kadisiye halkı için öğretmen olarak çıktım, kötülük yayan herkes bilmez."
  id: "Urwah ibn Zayd al-Khayl al-; menurut al-Baladhuri, Abu Ubayd menyerahkannya kepada al-Zawabi, yang mendamaikan ladangnya dengan kesepakatan serupa dengan Perjanjian Barusma. Ia bertempur dengan sengit pada hari jembatan, melawan sekelompok pejuang, dan menulis kepada Umar dengan laporan tersebut. Umar mengirimnya atas perintah Ammar kepada Rayy, dan ia ditangkap dalam delapan ribu bulan setelah dua bulan dari Nahavand. Tuhan memperlihatkannya kepada rakyat Daylam dan rakyat Rayy. Ia menggantikan saudaranya Hanzala dan datang kepada Umar dengan kabar gembira, menyebutnya pembawa karena ia yang datang membawa kabar tentang jembatan. Ia ingin membawa apa yang ia suka, berkata: Aku telah muncul untuk rakyat Qadisiyyah sebagai guru, dan tidak semua orang yang menyebarkan kejahatan tahu."
