label: { ar: "عروة بن زيد الخيل الطائي", en: "Urwa ibn Zayd al-Khayl al-Ta'i" }
summary:
  ar: "عروة بن زيد الخيل الطائي؛ عند البلاذري وجهه أبو عبيد إلى الزوابي فصالح دهقانها على مثل صلح باروسما وقاتل يوم الجسر قتالاً شديداً عدل بقتال جماعة وكتب معه المثنى إلى عمر بالخبر وبعثه عمر بأمر عمار إلى الري ودستبا في ثمانية آلاف بعد شهرين من نهاوند فأظهره الله على جموع الديلم وأهل الري فخلف أخاه حنظلة وقدم على عمر بالبشارة فسماه البشير لأنه كان القادم بخبر الجسر فأحب أن يأتيه بما يسره وقال برزت لأهل القادسية معلماً وما كل من يفشي الكريهة يعلم."
  en: "Urwa ibn Zayd al-Khayl al-Ta'i; in al-Baladhuri sent by Abu Ubayd to al-Zawabi whose dihqan he pacified on Barusma's terms; at the Bridge he fought a fight worth a company's and carried al-Muthanna's report to Umar. Sent by Ammar at Umar's command to Rayy and Dastaba with eight thousand — victorious over Daylam and Rayy's host — he bore the news to Umar himself and was named al-Bashir, he who once carried the Bridge's tidings."
