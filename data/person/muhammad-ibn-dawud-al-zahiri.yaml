summary:
  ar: "محمد بن داود بن علي بن خلف الظاهري، أبو بكر، أديب مناظر شاعر، ابن الإمام داود الظاهري، أصله من أصبهان وولد وعاش ببغداد وتوفي بها مقتولاً؛ يذكر الزركلي 255-297 هـ، 869-910 م {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 120}."
  en: "Muhammad ibn Dawud ibn Ali ibn Khalaf al-Zahiri, Abu Bakr, a man of letters, debater and poet, son of the imam Dawud al-Zahiri; his family came from Isfahan, he was born and lived in Baghdad and died there, killed; al-Zirikli prints 255-297 AH, 869-910 CE {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 120}."
  es: "Muhammad ibn Dawud ibn Ali ibn Khalaf al-Zahiri, Abu Bakr, hombre de letras, orador y poeta, hijo del imán Dawud al-Zahiri; su familia provenía de Isfahán, nació y vivió en Bagdad y murió allí, asesinado; al-Zirikli imprime 255-297 AH, 869-910 CE {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 120}."
  fr: "Muhammad ibn Dawud ibn Ali ibn Khalaf al-Zahiri, Abu Bakr, homme de lettres, débatteur et poète, fils de l'imam Dawud al-Zahiri; sa famille était originaire d'Ispahan, il est né et a vécu à Bagdad et y est mort, assassiné; al-Zirikli imprime 255-297 AH, 869-910 CE {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 120}."
  ur: "محمد بن داؤد ابن علی ابن خلف الظاہری، ابو بکر، خطیب، مناظرہ کرنے والے اور شاعر، امام داؤد الظہری کے بیٹے؛ اس کا خاندان اصفہان سے آیا تھا، وہ بغداد میں پیدا ہوا اور مقیم ہوا اور وہیں فوت ہوا، قتل ہوا۔ الزرکلی مطبوعہ 255-297 ہجری، 869-910 عیسوی 6ص۔ 120}۔"
  tr: "Muhammed ibn Davud ibn Ali ibn Khalaf al-Zahiri, Ebu Bekir, edebi bir figür ve şair, İmam Davud el-Zahiri'nin oğlu, aslen İsfahanlı, Bağdat'ta doğup yaşamış ve orada ölmüştür; el-Zarikli 255-297 Hicri, 869-910 M.S. {atıf:alam-zirikli-dar-al-ilm-2002 cilt 6, s. 120} anmaktadır."
  id: "Muhammad ibn Dawud ibn Ali ibn Khalaf al-Zahiri, Abu Bakr, seorang tokoh sastra dan penyair, putra Imam Dawood al-Zahiri, berasal dari Isfahan, lahir dan tinggal di Baghdad, dan meninggal di sana dengan tewas; al-Zarikli menyebutkan 255-297 H, 869-910 M {cite:alam-zirikli-dar-al-ilm-2002 vol. 6, hlm. 120}."
