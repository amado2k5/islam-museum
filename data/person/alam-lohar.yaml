summary:
  ar: "مغنّي البنجاب الشعبي الباكستاني (1928–1979) من قرية آچھ في منطقة غوجرات، وُلد في أسرة حدّادين، ابتكر وشهر فنّ «جغني» القصصي، وأعاد تقديم «هير» وارث شاه بصوته العالي مصحوباً بالچمٹا، وسيطر على الغناء الشعبي في باكستان من الخمسينيات حتى وفاته في حادث سير؛ وهو والد عارف لوهار."
  en: "Pakistani Punjabi folk singer (1928–1979) from Achh village in Gujrat district, born into a blacksmith family; he created and popularised the Jugni narrative form, made Waris Shah's Heer famous in his high-pitched chimta-accompanied style, dominated folk singing in Pakistan from the 1950s until his death in a road accident, and received the Pride of Performance (1979). He was the father of Arif Lohar."
  ur: "پاکستانی پنجابی لوک گلوکار (1928ء–1979ء) جن کا تعلق ضلع گجرات کے گاؤں آچھ سے تھا اور جو لوہار گھرانے میں پیدا ہوئے؛ انھوں نے «جگنی» کو ایجاد و مقبول کیا، وارث شاہ کی «ہیر» کو چمٹے کے ساتھ اپنے مخصوص انداز میں پیش کیا اور 1950ء کی دہائی سے اپنی وفات تک پاکستان میں لوک گائیکی پر چھائے رہے؛ وہ عارف لوہار کے والد ہیں۔"
