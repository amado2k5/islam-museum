summary:
  ar: "أبو زيد محمد بن أحمد بن عبد الله المروزي، صاحب أبي إسحاق، مات بمرو في رجب سنة إحدى وسبعين وثلاثمائة، وكان حافظاً للمذهب حسن النظر مشهوراً بالزهد {cite:tabaqat-fuqaha-abbas-1981 p. 60}. ينقل الشيرازي عن أبي بكر البزار قوله: «عادلت الفقيه أبا زيد من نيسابور إلى مكة فما أعلم أن الملائكة كتبت عليه خطيئة» {cite:tabaqat-fuqaha-abbas-1981 p. 60}. وعنه أخذ أبو بكر القفال المروزي وفقهاء مرو {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  en: "Abu Zayd Muhammad ibn Ahmad ibn Abd Allah al-Marwazi, companion of Abu Ishaq, died at Marw in Rajab 371, a jurist who had the school's doctrine by heart, of sound judgement and known for asceticism {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Al-Shirazi transmits from Abu Bakr al-Bazzar his words: 'I travelled with the jurist Abu Zayd from Nishapur to Mecca, and I do not know that the angels ever wrote a sin against him' {cite:tabaqat-fuqaha-abbas-1981 p. 60}. From him learned Abu Bakr al-Qaffal al-Marwazi and the jurists of Marw {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  fr: "Abu Zayd Muhammad ibn Ahmad ibn Abd Allah al-Marwazi, compagnon d'Abu Ishaq, mourut à Merv en rajab 371 ; juriste connaissant par cœur la doctrine de l'école, doué de bon jugement et réputé pour son ascétisme {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Al-Shirazi transmet ces mots d'Abu Bakr al-Bazzar : « J'ai voyagé avec le juriste Abu Zayd de Nishapur à La Mecque, et je ne sache pas que les anges aient jamais consigné contre lui un péché » {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Abu Bakr al-Qaffal al-Marwazi et les juristes de Merv étudièrent auprès de lui {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  es: "Abu Zayd Muhammad ibn Ahmad ibn Abd Allah al-Marwazi, compañero de Abu Ishaq, murió en Marw en Rajab 371, un jurista que tenía la doctrina de la escuela de memoria, de buen juicio y conocido por su ascetismo {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Al-Shirazi transmite de Abu Bakr al-Bazzar sus palabras: «Viajé con el jurista Abu Zayd desde Nishapur a La Meca, y no sé si los ángeles jamás le imputaron un pecado» {cite:tabaqat-fuqaha-abbas-1981 p. 60}. De él aprendieron Abu Bakr al-Qaffal al-Marwazi y los juristas de Marw {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  ur: "ابو زید محمد بن احمد بن عبد اللہ المروازی، ابو اسحاق کے ساتھی، مرو میں رجب 371 میں وفات پا گئے، ایک فقیہ جو دل سے مکتب کا عقیدہ رکھتے تھے، صحیح فیصلے کے حامل تھے اور سنت پرستی کے لیے مشہور تھے۔ 60}۔ الشرازی نے ابوبکر البزار سے نقل کیا ہے کہ: 'میں نے فقیہ ابو زید کے ساتھ نیشاپور سے مکہ تک سفر کیا اور مجھے نہیں معلوم کہ فرشتوں نے ان پر کبھی کوئی گناہ لکھا ہو'۔ 60}۔ ان سے ابوبکر القفل المروازی اور فقہاء مروۃ نے سیکھا۔ 60}۔"
  tr: "Ebu İshak'ın sahabelerinden Ebu Zeyd Muhammed ibn Ahmed ibn Abdullah el-Marvezi, Hicri 371 yılının Receb ayında Merv'de vefat etmiştir. O, mezhep bilgisini ezberleyen, sağlam bir muhakeme yeteneğine sahip ve zühdüyle tanınan bir kişiydi. El-Şirazi, Ebu Bekir el-Bazzar'ın şöyle dediğini aktarır: \"Nişap'tan Mekke'ye fıkıhçı Ebu Zeyd ile birlikte yolculuk ettim ve meleklerin onun aleyhinde herhangi bir günah kaydettiğini bilmiyorum.\" Ebu Bekir el-Kaffal el-Marvezi ve Merv fıkıhçıları ondan ilim öğrenmişlerdir."
  id: "Abu Zayd Muhammad ibn Ahmad ibn Abdullah al-Marwazi, seorang sahabat Abu Ishaq, wafat di Marw pada bulan Rajab tahun 371 H. Beliau adalah seorang penghafal mazhab, memiliki penilaian yang baik, dan terkenal karena kesaktiannya. Al-Shirazi mengutip Abu Bakr al-Bazzar yang berkata, “Aku melakukan perjalanan bersama ahli fiqih Abu Zayd dari Nishapur ke Mekah, dan aku tidak tahu bahwa para malaikat mencatat dosa apa pun terhadapnya.” Abu Bakr al-Qaffal al-Marwazi dan para ahli fiqih Marw belajar darinya."
