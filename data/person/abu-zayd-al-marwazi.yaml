summary:
  ar: "أبو زيد محمد بن أحمد بن عبد الله المروزي، صاحب أبي إسحاق، مات بمرو في رجب سنة إحدى وسبعين وثلاثمائة، وكان حافظاً للمذهب حسن النظر مشهوراً بالزهد {cite:tabaqat-fuqaha-abbas-1981 p. 60}. ينقل الشيرازي عن أبي بكر البزار قوله: «عادلت الفقيه أبا زيد من نيسابور إلى مكة فما أعلم أن الملائكة كتبت عليه خطيئة» {cite:tabaqat-fuqaha-abbas-1981 p. 60}. وعنه أخذ أبو بكر القفال المروزي وفقهاء مرو {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  en: "Abu Zayd Muhammad ibn Ahmad ibn Abd Allah al-Marwazi, companion of Abu Ishaq, died at Marw in Rajab 371, a jurist who had the school's doctrine by heart, of sound judgement and known for asceticism {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Al-Shirazi transmits from Abu Bakr al-Bazzar his words: 'I travelled with the jurist Abu Zayd from Nishapur to Mecca, and I do not know that the angels ever wrote a sin against him' {cite:tabaqat-fuqaha-abbas-1981 p. 60}. From him learned Abu Bakr al-Qaffal al-Marwazi and the jurists of Marw {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
