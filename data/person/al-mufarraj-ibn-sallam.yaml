class: person
label: { ar: "المفرج بن سلام", en: "al-Mufarraj ibn Sallam", fr: "al-Mufarraj ibn Sallam", es: "al-Mufarraj ibn Sallam", ur: "المفرج ابن سلام" }
summary:
  ar: "عند البلاذري: قام بعد خلفون البربري في الأرض الكبيرة ففتح أربعة وعشرين حصناً واستولى عليها وكتب إلى صاحب البريد بمصر يسأل عقد الإمام على ناحيته ليخرج من حد المتغلبين وبنى مسجداً جامعاً ثم شغب عليه أصحابه فقتلوه — وفي نسخة المفرخ."
  en: "In al-Baladhuri: succeeded Khalafun al-Barbari in the Great Land, opened twenty-four fortresses, wrote Egypt's postmaster asking the imam's contract over his district to leave the usurpers' state, built a congregational mosque, then his companions mutinied and killed him — one copy reads al-Mufarrikh."
  fr: "Dans al-Baladhuri : a succédé à Khalafun al-Barbari dans la Grande Terre, a ouvert vingt-quatre forteresses, a écrit le maître des postes de l'Égypte demandant le contrat de l'imam sur son district de quitter l'état des usurpateurs, construit une mosquée congrégationnelle, puis ses compagnons mutinés et tué - un exemplaire lit al-Mufarrikh."
  es: "En al-Baladhuri: sucedió a Khalafun al-Barbari en la Gran Tierra, abrió veinticuatro fortalezas, escribió al jefe de correos de Egipto solicitando el contrato del imán sobre su distrito para abandonar el estado de los usurpadores, construyó una mezquita congregacional, luego sus compañeros se amotinaron y lo mataron; una copia dice al-Mufarrikh."
  ur: "البلادوری میں: خلفون البرباری نے عظیم سرزمین میں جانشین بنایا، چوبیس قلعے کھولے، مصر کے پوسٹ ماسٹر نے لکھا کہ امام سے اس کے ضلع پر قبضہ کرنے والوں کی ریاست چھوڑنے کا مطالبہ کیا، ایک اجتماعی مسجد بنائی، پھر اس کے ساتھیوں نے بغاوت کی اور اسے قتل کر دیا۔"
