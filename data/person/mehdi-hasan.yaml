summary:
  ar: "مذيع وصحفي ومؤلف بريطاني أمريكي، وُلد في سويندون سنة 1979 لأبوين مهاجرين من الهند. عمل محررًا سياسيًا في «نيو ستيتسمان» و«هافنغتون بوست» البريطانية ومقدّمًا في الجزيرة الإنجليزية (برنامجا «هيد تو هيد» و«أب فرونت»)، وقدّم برنامجه على إم إس إن بي سي حتى إلغائه سنة 2023، وألّف كتاب «اربح كل جدال» (2023)، وأسس سنة 2024 شركة «زيتيو» الإعلامية وكتب في «الغارديان»."
  en: "British-American broadcaster, journalist and author, born in Swindon in 1979 to Indian immigrant parents. A former New Statesman and HuffPost UK politics editor and an Al Jazeera English presenter (Head to Head, UpFront), he hosted The Mehdi Hasan Show on MSNBC until its cancellation in 2023, wrote Win Every Argument (2023), and in 2024 founded the media company Zeteo and joined The Guardian as a columnist."
  ur: "برطانوی نژاد امریکی نشریاتی صحافی اور مصنف، جو 1979 میں سونڈن میں بھارتی مہاجر والدین کے ہاں پیدا ہوئے۔ نیو سٹیٹس مین اور ہف پوسٹ برطانیہ کے سیاسی مدیر اور الجزیرہ انگلش کے پیش کار (ہیڈ ٹو ہیڈ، اپ فرنٹ) رہے؛ ایم ایس این بی سی پر ان کا شو 2023 میں بند ہوا؛ 2023 میں کتاب «ون ایوری آرگیومنٹ» لکھی اور 2024 میں میڈیا کمپنی زیٹیو قائم کی اور گارڈین کے کالم نگار بنے۔"

