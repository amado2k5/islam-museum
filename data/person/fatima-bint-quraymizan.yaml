summary:
  ar: "فاطمة بنت عبد القادر الشهدة بنت قريميزان الحنفية الحلبية، الشيخة الفاضلة الصالحة، شيخة الخانقاتين العادلية والدجاجية معاً؛ كان لها خط جيد ونسخت كتباً كثيرة، وكان لها عبارة فسيحة وتعفف وتقشف وملازمة للصلاة حتى في حال المرض؛ ولدت في رابع محرم سنة ثمان وسبعين وثمانمائة، ثم تزوجها الشيخ كمال الدين محمد بن مير جمال الدين بن علي درويش الأردبيلي الشافعي نزيل المدرسة الرواحية بحلب الذي قيل إن جده أول من شرح المصباح، قالت: وعن زوجي هذا أخذت العلم، وكان يقول: ملّكني الله ستة وثلاثين علماً؛ وتوفيت في هذه السنة وأوصت أن تدفن معها سجادتها — قال ابن الحنبلي: وقد ظفرت بشهود جنازتها وحملها فيمن حمل {cite:shadharat-dhahab p. 347-348}."
  en: "Fatima bint Quraymizan — shaykha of both the 'Adiliyya and Dajajiyya khanqahs of Aleppo; b. 4 Muharram 878, a fine calligrapher who copied many books, learned 'from this husband of mine' — the Ardabili who said 'God taught me thirty-six sciences'; she willed her prayer mat buried with her, and Ibn al-Hanbali bore her bier [966] {cite:shadharat-dhahab p. 347-348}."
