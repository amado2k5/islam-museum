summary:
  ar: "فاطمة بنت عبد القادر الشهدة بنت قريميزان الحنفية الحلبية، الشيخة الفاضلة الصالحة، شيخة الخانقاتين العادلية والدجاجية معاً؛ كان لها خط جيد ونسخت كتباً كثيرة، وكان لها عبارة فسيحة وتعفف وتقشف وملازمة للصلاة حتى في حال المرض؛ ولدت في رابع محرم سنة ثمان وسبعين وثمانمائة، ثم تزوجها الشيخ كمال الدين محمد بن مير جمال الدين بن علي درويش الأردبيلي الشافعي نزيل المدرسة الرواحية بحلب الذي قيل إن جده أول من شرح المصباح، قالت: وعن زوجي هذا أخذت العلم، وكان يقول: ملّكني الله ستة وثلاثين علماً؛ وتوفيت في هذه السنة وأوصت أن تدفن معها سجادتها — قال ابن الحنبلي: وقد ظفرت بشهود جنازتها وحملها فيمن حمل {cite:shadharat-dhahab p. 347-348}."
  en: "Fatima bint Quraymizan — shaykha of both the 'Adiliyya and Dajajiyya khanqahs of Aleppo; b. 4 Muharram 878, a fine calligrapher who copied many books, learned 'from this husband of mine' — the Ardabili who said 'God taught me thirty-six sciences'; she willed her prayer mat buried with her, and Ibn al-Hanbali bore her bier [966] {cite:shadharat-dhahab p. 347-348}."
  es: "Fatima bint Quraymizan — shaykha de los khanqahs 'Adiliyya y Dajajiyya de Alepo; n. 4 Muharram 878, una excelente calígrafa que copió muchos libros, aprendió 'de este esposo mío' — el Ardabili que dijo 'Dios me enseñó treinta y seis ciencias'; ella legó que su alfombra de oración fuera enterrada con ella, e Ibn al-Hanbali llevó su féretro [966] {cite:shadharat-dhahab p. 347-348}."
  fr: "Fatima bint Quraymizan — cheikha des khanqahs 'Adiliyya et Dajajiyya d'Alep; née le 4 Muharram 878, calligraphe de talent qui a copié de nombreux livres, a appris « de mon mari » — l'Ardabili qui a dit « Dieu m'a enseigné trente-six sciences »; elle a fait enterrer son tapis de prière avec elle, et Ibn al-Hanbali a porté son cercueil [966] {cite: shadharat-dhahab p. 347-348}."
  ur: "فاطمہ بنت قریمزان - حلب کی عدیلیہ اور دجاجیہ خانقاہوں کی شیخہ؛ ب 4 محرم 878، ایک عمدہ خطاط جس نے بہت سی کتابیں نقل کیں، 'میرے اس شوہر سے' سیکھی - اردبیلی جس نے کہا کہ 'خدا نے مجھے چھتیس علوم سکھائے'؛ اس نے اپنی نماز کی چٹائی کو اپنے ساتھ دفن کرنے کی وصیت کی اور ابن الحنبلی نے اس کا بیئر اٹھایا [966]۔ 347-348}۔"
  tr: "Fatimah bint Abdul Kadir al-Shahda bint Quraymazan al-Hanafi al-Halabi, erdemli ve doğru şeyh, hem adil hem de kazan hankattinlerinin şeyhi; iyi el yazısı vardı ve birçok kitap kopyaladı. Geniş bir ifadesi, alçakgönüllülüğü, saketliği ve hastalık sırasında bile dua etmekte ısrarcı vardı. 878 Hile yılında Muharrem ayının dördünde doğdu, ardından Şeyh Kamal al-Din Muhammed bin ile evlendi Halep'teki El-Ravihiye okulunda yaşayan mir Cemaleddin ibn Ali Derviş el-Erdebili el-Şafi'i, el-Misbah'ı ilk açıklayan kişi olduğu söylenir. Şöyle dedi: Bu kocadan öğrendim, o da derdi ki: 'Allah bana otuz altı bilgi versin.' O yıl vefat etti ve namaz halısını ona emanet etti—İbn el-Hanbali şöyle dedi: Cenazesinin tanıklarıyla kutsandım ve onu taşıyanların arasına taşıdım. Shadharat-Dhahab, s. 347-348}."
  id: "Fatimah bint Abdul Qadir al-Shahda bint Quraymazan al-Hanafi al-Halabi, sheikha yang berbudi luhur dan benar, sheikha baik dari para khanqattin yang adil maupun yang kacau; ia memiliki tulisan tangan yang baik dan menyalin banyak buku. Ia memiliki ekspresi yang luas, rendah hati, tegas, dan ketekunan dalam doa bahkan saat sakit. Ia lahir pada tanggal 4 Muharram tahun 878 H, kemudian menikah dengan Sheikh Kamal al-Din Muhammad ibn Mir Jamal al-Din ibn Ali Darwish al-Ardabili al-Shafi'i, seorang penduduk sekolah Al-Rawahiya di Aleppo, yang dikatakan sebagai orang pertama yang menjelaskan al-Misbah. Dia berkata: Saya belajar dari suami ini, dan dia biasa berkata: 'Semoga Allah menganugerahkan saya tiga puluh enam pengetahuan.' Dia meninggal pada tahun itu dan mempercayakan permadani doanya kepadanya—Ibn al-Hanbali berkata: Saya diberkati dengan saksi pemakamannya dan menggendongnya di antara mereka yang membawa {cite:\" Shadharat-Dhahab, hlm. 347-348}."
