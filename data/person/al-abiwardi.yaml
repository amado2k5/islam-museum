summary:
  ar: "أبو المظفر محمد بن أبي العباس الأموي الأبيوردي الشاعر المشهور؛ كان من الأدباء المشاهير، راويةً نسّابة شاعراً، ونسبه يتصل بمعاوية بن أبي سفيان، ومن أشهر شعره ألفيته التي مطلعها «ألمّ إن لم تسمحي بزيارة خلاّ» وله فيها معانٍ بديعة {cite:wafayat-ayan}."
  en: "al-Abiwardi (408–498) — Umayyad-descended poet and genealogist, author of the celebrated alifiyya ode 'alimm in lam tusmahi'; d. at Wasit {cite:wafayat-ayan}."
  fr: "Al-Abiwardi (408–498 H) — poète et généalogiste d’ascendance omeyyade, auteur de la célèbre ode alifiyya « alimm in lam tusmahi » ; mort à Wasit {cite:wafayat-ayan}."
  es: "al-Abiwardi (408–498) — Poeta y genealogista descendiente de los Omeyas, autor de la célebre oda alifiyya 'alimm in lam tusmahi'; murió en Wasit {cite:wafayat-ayan}."
  ur: "العبیوردی (408-498) - اموی نسل کے شاعر اور ماہر نسب، مشہور الفیہ اودے 'علیم ان لام تسمہ' کے مصنف؛ d وصیت میں {حوالہ: وفایت-اعیان}۔"
  tr: "Ünlü şair Ebu el-Muzaffar Muhammed ibn Abi el-Abbas el-Umavi el-Abyurdi; ünlü yazarlardan, rivayetçilerden, şecere uzmanı ve şairlerden biriydi ve soyu Muaviye ibn Abi Sufyan'a dayanıyordu. En ünlü şiirlerinden biri olan Elfiyye, \"Bir dostu ziyaret etmeme izin vermezsen ben ziyaret edeceğim\" dizeleriyle başlar ve harika anlamlar içerir."
  id: "Abu al-Muzaffar Muhammad ibn Abi al-Abbas al-Umawi al-Abyurdi, penyair terkenal; beliau adalah salah satu penulis terkenal, seorang perawi, ahli silsilah, dan penyair, dan garis keturunannya terhubung dengan Muawiyah ibn Abi Sufyan, dan di antara puisi-puisinya yang paling terkenal adalah Alfiyyah, yang dimulai dengan \"Aku akan berkunjung jika kamu tidak mengizinkan kunjungan kepada seorang teman,\" dan puisi ini mengandung makna yang indah."
