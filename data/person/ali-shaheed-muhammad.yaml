summary:
  ar: "منسّق موسيقى ومنتج أمريكي، وُلد في بروكلين بنيويورك سنة 1970، وهو عضو مؤسس لفريق «أ ترايب كولد كويست» وعضو فريق الآر أند بي «لوسي بيرل». عمل منذ سنة 2013 مع المنتج أدريان يونج على موسيقى مسلسل «لوك كيج» وسلسلة «الجاز ميت» (Jazz Is Dead)، وتنصّ مقالته على أنه مسلم."
  en: "American DJ and record producer, born in Brooklyn, New York City, in 1970, a founding member of A Tribe Called Quest and a member of the R&B group Lucy Pearl. Since 2013 he has worked with producer Adrian Younge on the Luke Cage soundtracks and the Jazz Is Dead series; his article states that he is a Muslim."
  ur: "امریکی ڈی جے و ریکارڈ پروڈیوسر، جو 1970 میں بروکلن، نیویارک میں پیدا ہوئے؛ وہ «اے ٹرائب کالڈ کوئسٹ» کے بانی رکن اور آر اینڈ بی گروپ «لوسی پرل» کے رکن ہیں۔ 2013 سے وہ پروڈیوسر ایڈرین یانگ کے ساتھ «لوک کیج» کی موسیقی اور «جاز از ڈیڈ» سلسلے پر کام کر رہے ہیں، اور ان کے مضمون میں درج ہے کہ وہ مسلمان ہیں۔"
