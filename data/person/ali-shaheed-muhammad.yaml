summary:
  ar: "منسّق موسيقى ومنتج أمريكي، وُلد في بروكلين بنيويورك سنة 1970، وهو عضو مؤسس لفريق «أ ترايب كولد كويست» وعضو فريق الآر أند بي «لوسي بيرل». عمل منذ سنة 2013 مع المنتج أدريان يونج على موسيقى مسلسل «لوك كيج» وسلسلة «الجاز ميت» (Jazz Is Dead)، وتنصّ مقالته على أنه مسلم."
  en: "American DJ and record producer, born in Brooklyn, New York City, in 1970, a founding member of A Tribe Called Quest and a member of the R&B group Lucy Pearl. Since 2013 he has worked with producer Adrian Younge on the Luke Cage soundtracks and the Jazz Is Dead series; his article states that he is a Muslim."
  ur: "امریکی ڈی جے و ریکارڈ پروڈیوسر، جو 1970 میں بروکلن، نیویارک میں پیدا ہوئے؛ وہ «اے ٹرائب کالڈ کوئسٹ» کے بانی رکن اور آر اینڈ بی گروپ «لوسی پرل» کے رکن ہیں۔ 2013 سے وہ پروڈیوسر ایڈرین یانگ کے ساتھ «لوک کیج» کی موسیقی اور «جاز از ڈیڈ» سلسلے پر کام کر رہے ہیں، اور ان کے مضمون میں درج ہے کہ وہ مسلمان ہیں۔"
  es: "DJ y productor discográfico estadounidense, nacido en Brooklyn, Nueva York, en 1970, miembro fundador de A Tribe Called Quest y del grupo de R&B Lucy Pearl. Desde 2013 trabaja con el productor Adrian Younge en las bandas sonoras de Luke Cage y la serie Jazz Is Dead; en su artículo se indica que es musulmán."
  fr: "DJ et producteur américain, né à Brooklyn (New York) en 1970, il est membre fondateur du groupe A Tribe Called Quest et du groupe R&B Lucy Pearl. Depuis 2013, il collabore avec le producteur Adrian Younge sur les bandes originales de Luke Cage et de la série Jazz Is Dead; son article précise qu'il est musulman."
  tr: "1970 yılında Brooklyn, New York'ta doğan Amerikalı bir müzik düzenleyicisi ve yapımcısı olan Jane, A Tribe Cold Quest grubunun ve R&B grubu Lucy Pearl'ün kurucu üyelerindendir. 2013'ten beri yapımcı Adrian Young ile \"Luke Cage\" ve \"Jazz Is Dead\" dizilerinin müziklerinde çalışıyor ve makalesinde Müslüman olduğu belirtiliyor."
  id: "Seorang arranger dan produser musik asal Amerika, lahir di Brooklyn, New York pada tahun 1970, ia adalah anggota pendiri band A Tribe Cold Quest dan band R&B Lucy Pearl. Sejak 2013, ia bekerja sama dengan produser Adrian Young dalam musik untuk serial \"Luke Cage\" dan serial \"Jazz Is Dead,\" dan artikelnya menyatakan bahwa ia beragama Muslim."
