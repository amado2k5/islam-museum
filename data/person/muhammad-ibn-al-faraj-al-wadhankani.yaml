summary:
  ar: "أبو بكر محمد بن الفرج الودنكاني، من المعمرين في الأبدال، المثبت في الأحوال، كانت دعوته مجابة، صحب أبا عثمان الرازي، وكان الجوع والرباط ميسرين له. خرج إلى طرسوس ثلاث مرات، ومات بها سنة أربع وثمانين ومائتين، على ما يُقرأ في المسح."
  en: "Abu Bakr Muhammad ibn al-Faraj al-Wadhankani, one of those counted among the substitutes, steadfast in spiritual states, whose supplication was answered. He was a companion of Abu Uthman al-Razi, and hunger and frontier-guard duty were easy for him. He went to Tarsus three times and died there in the year 284 AH, as the scan reads it."
  ur: "ابو بکر محمد بن الفرج الودنکانی، ابدال میں شمار ہونے والے، احوال میں ثابت قدم، جن کی دعا قبول ہوتی تھی۔ وہ ابو عثمان رازی کے ساتھی تھے، اور ان کے لیے بھوک اور سرحد کی نگہبانی آسان تھی۔ وہ تین بار طرسوس گئے اور وہیں سن 284 ہجری میں وفات پائی، جیسا کہ اسکین سے پڑھا جاتا ہے۔"
