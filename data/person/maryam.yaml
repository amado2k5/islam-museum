summary:
  ar: "مريم بنت عمران أم عيسى. عند البخاري أدرجها النبي في كاملات النساء مع آسية امرأة فرعون {cite:sahih-al-bukhari 3411}، واستثناها وابنها من طعن الشيطان الذي يلقى كل مولود {cite:sahih-al-bukhari 3431}، وفي مسلم «كمل من الرجال كثير ولم يكمل من النساء غير مريم بنت عمران وآسية امرأة فرعون» {cite:sahih-muslim 2430}."
  en: "Mother of Isa, counted by the Prophet among the perfected women with Asiya {cite:sahih-al-bukhari 3411}, and exempted with her son from Satan's newborn prick {cite:sahih-al-bukhari 3431}."
