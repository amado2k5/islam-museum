id: person/ali-ibn-al-jahm
class: person
label: { ar: "علي بن الجهم" }
summary:
  ar: "الشاعر، دخل على المتوكل وبيده درتان يقلبهما فأنشده قصيدة فدحى إليه بدرة فقال إنها خير من مئة ألف فقال فكرت في أبيات أعملها آخذ بها الأخرى فأنشده بسر من رأى إمام عدل يرجى ويخشى لكل خطب يداه في الجود ضرتان لم تأت منه اليمين شيئاً إلا أتت مثلها اليسار فدحى إليه بالدرة الأخرى، ومدح الواثق بقصيدته وثقت بالملك الواثق بالله النفوس {cite:tarikh-khulafa-minhaj-1434 p. 534,542}. وعند المسعودي نفاه المتوكل إلى خراسان سنة اثنتين وثلاثين ومائتين وقيل تسع وثلاثين، ثم خرج سنة تسع وأربعين ومائتين فلما صار بخشبات من بلاد قنسرين لقيته خيل الكلبيين فقتلته، وكان مع انحرافه عن علي وإظهاره التسنن مطبوعاً عذب الألفاظ {cite:muruj-al-dhahab p. 497}، وبخلاف ذلك يذكر ابن فضل الله العمري أنه صُلب على باب قصر الشاذياخ بنيسابور وأنه قال حين صُلب ارتجالاً: «لم ينصبوا بالشاذياخ عشية الإثنين مسبوقاً ولا مجهولا» — رواية أخرى لمصرعه {cite:umari-masalik-1924 p. 233}"
  en: "The poet; he recited to al-Mutawakkil while rolling two pearls, won one, then composed 'in Sur man Ra'a an imam of justice... his two hands in bounty are paired udders — the right gives nothing the left does not match' and won the second; he had also praised al-Wathiq {cite:tarikh-khulafa-minhaj-1434 p. 534,542}."
  es: "El poeta; recitó a al-Mutawakkil mientras hacía rodar dos perlas, ganó una, luego compuso 'en Sur man Ra'a un imán de justicia... sus dos manos en generosidad son ubres emparejadas: la derecha no da nada que la izquierda no iguale' y ganó la segunda; también había elogiado a al-Wathiq {cite:tarikh-khulafa-minhaj-1434 p. 534,542}."
  fr: "Le poète; il récita à al-Mutawakkil tout en faisant rouler deux perles, en gagna une, puis composa « dans Sur man Ra'a un imam de justice... ses deux mains dans la générosité sont des mamelles jumelées — la droite ne donne rien que la gauche ne puisse égaler » et gagna la seconde; il avait également fait l'éloge d'al-Wathiq {cite:tarikh-khulafa-minhaj-1434 p. 534,542}."
  ur: "شاعر؛ اس نے المتوکل کو دو موتی لڑھکتے ہوئے پڑھا، ایک جیت لیا، پھر 'سور من راع میں انصاف کا امام... اس کے دونوں ہاتھ جوڑے ہوئے تھن ہیں - دائیں کوئی چیز نہیں دیتا جو بائیں سے میل نہیں کھاتا' اور دوسرا جیتا۔ انہوں نے الوثیق کی بھی تعریف کی تھی۔ 534,542}۔"
