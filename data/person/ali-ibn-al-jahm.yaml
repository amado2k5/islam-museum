label: { ar: "علي بن الجهم" }
summary:
  ar: "الشاعر، دخل على المتوكل وبيده درتان يقلبهما فأنشده قصيدة فدحى إليه بدرة فقال إنها خير من مئة ألف فقال فكرت في أبيات أعملها آخذ بها الأخرى فأنشده بسر من رأى إمام عدل يرجى ويخشى لكل خطب يداه في الجود ضرتان لم تأت منه اليمين شيئاً إلا أتت مثلها اليسار فدحى إليه بالدرة الأخرى، ومدح الواثق بقصيدته وثقت بالملك الواثق بالله النفوس {cite:tarikh-khulafa-minhaj-1434 p. 534,542}."
  en: "The poet; he recited to al-Mutawakkil while rolling two pearls, won one, then composed 'in Sur man Ra'a an imam of justice... his two hands in bounty are paired udders — the right gives nothing the left does not match' and won the second; he had also praised al-Wathiq {cite:tarikh-khulafa-minhaj-1434 p. 534,542}."
