id: person/ali-ibn-al-jahm
class: person
label: { ar: "علي بن الجهم" }
summary:
  ar: "الشاعر، دخل على المتوكل وبيده درتان يقلبهما فأنشده قصيدة فدحى إليه بدرة فقال إنها خير من مئة ألف فقال فكرت في أبيات أعملها آخذ بها الأخرى فأنشده بسر من رأى إمام عدل يرجى ويخشى لكل خطب يداه في الجود ضرتان لم تأت منه اليمين شيئاً إلا أتت مثلها اليسار فدحى إليه بالدرة الأخرى، ومدح الواثق بقصيدته وثقت بالملك الواثق بالله النفوس {cite:tarikh-khulafa-minhaj-1434 p. 534,542}. وعند المسعودي نفاه المتوكل إلى خراسان سنة اثنتين وثلاثين ومائتين وقيل تسع وثلاثين، ثم خرج سنة تسع وأربعين ومائتين فلما صار بخشبات من بلاد قنسرين لقيته خيل الكلبيين فقتلته، وكان مع انحرافه عن علي وإظهاره التسنن مطبوعاً عذب الألفاظ {cite:muruj-al-dhahab p. 497}، وبخلاف ذلك يذكر ابن فضل الله العمري أنه صُلب على باب قصر الشاذياخ بنيسابور وأنه قال حين صُلب ارتجالاً: «لم ينصبوا بالشاذياخ عشية الإثنين مسبوقاً ولا مجهولا» — رواية أخرى لمصرعه {cite:umari-masalik-1924 p. 233}"
  en: "The poet; he recited to al-Mutawakkil while rolling two pearls, won one, then composed 'in Sur man Ra'a an imam of justice... his two hands in bounty are paired udders — the right gives nothing the left does not match' and won the second; he had also praised al-Wathiq {cite:tarikh-khulafa-minhaj-1434 p. 534,542}."
  es: "El poeta; recitó a al-Mutawakkil mientras hacía rodar dos perlas, ganó una, luego compuso 'en Sur man Ra'a un imán de justicia... sus dos manos en generosidad son ubres emparejadas: la derecha no da nada que la izquierda no iguale' y ganó la segunda; también había elogiado a al-Wathiq {cite:tarikh-khulafa-minhaj-1434 p. 534,542}."
  fr: "Le poète; il récita à al-Mutawakkil tout en faisant rouler deux perles, en gagna une, puis composa « dans Sur man Ra'a un imam de justice... ses deux mains dans la générosité sont des mamelles jumelées — la droite ne donne rien que la gauche ne puisse égaler » et gagna la seconde; il avait également fait l'éloge d'al-Wathiq {cite:tarikh-khulafa-minhaj-1434 p. 534,542}."
  ur: "شاعر؛ اس نے المتوکل کو دو موتی لڑھکتے ہوئے پڑھا، ایک جیت لیا، پھر 'سور من راع میں انصاف کا امام... اس کے دونوں ہاتھ جوڑے ہوئے تھن ہیں - دائیں کوئی چیز نہیں دیتا جو بائیں سے میل نہیں کھاتا' اور دوسرا جیتا۔ انہوں نے الوثیق کی بھی تعریف کی تھی۔ 534,542}۔"
  tr: "Şair, elinde iki inci tutarak Al-Mutawakkil'e girdi, bir şiir okudu ve ona bir inci uzattı, bunun yüz binden daha iyi olduğunu söyledi. Şöyle dedi: 'Yapacağım ayetleri düşündüm ve diğerlerini aldım.' Gizlice okudu: 'Her konuşmadan umutlu ve korkan adil bir imam görürse, elleri cömertlikle iki zararı vardır. Sağ elinde ise sadece sol elinde onlar gibi bir şey vardır.' Diğer inciyi övdü ve al-Wathiq'i şiiriyle, 'Müminlerin kralını Allah'a emanet ettim.' (atıf:Tarikh-khulafa-minhaj-1434, s. 534,542} al-Mas'udi'ye göre, el-Mutavükkil onu 232 yılında, bazılarına göre 39 yılında Horasan'a sürgün etmiş, ardından 249 Hicri yılında ayrılmıştır. Qinnasrin'in ormanlarına vardığında, Kalbiyyin atları onu karşılayıp öldürmüştür. Ali'den sapmasına ve Sünni İslam'ı göstermesine rağmen, zarif sözlerle kazınmıştır {cite:muruj-al-dhahab, s. 497}. Bunun dışında, İbn Fadlallah al-'Umari, Nişapur'daki el-Şadhyakh sarayının kapısında çarmıha gerildiğini ve çarmıha gerildiğinde doğaçlama olarak şöyle diyor: \"Pazartesi akşamı el-Şadhyakh kurulmadı, ne önceden ne de bilinmiyor.\" — Ölümüne dair başka bir anlatım {atı:umari-masalik-1924, s. 233}"
  id: "Penyair itu masuk ke Al-Mutawakkil sambil memegang dua mutiara di tangannya untuk dibalik, membacakan sebuah puisi, dan menawarkan sebuah mutiara, mengatakan itu lebih baik daripada seratus ribu. Ia berkata, 'Aku memikirkan bait-bait yang harus kubuat dan mengambil yang lainnya.' Ia membacakannya secara diam-diam: 'Siapa melihat seorang imam yang adil, penuh harapan dan takut pada setiap ucapan yang tangannya dengan murah hati memiliki dua kerugian. Tangan kanan hanya memiliki tangan kiri yang seperti mereka.' Ia memuji mutiara lainnya, dan memuji al-Wathiq dengan puisinya, 'Aku mempercayakan raja orang beriman kepada Tuhan.' {cite:Tarikh-khulafa-minhaj-1434, hlm. 534,542}. Menurut al-Mas'udi, al-Mutawakkil mengasingkannya ke Khurasan pada tahun 232, atau beberapa mengatakan 39, lalu pergi pada tahun 249 H. Ketika ia tiba di hutan Qinnasrin, kuda-kuda Kalbiyyin menemuinya dan membunuhnya. Meskipun menyimpang dari Ali dan menunjukkan Islam Sunni, ia dipenuhi kata-kata halus {cite:muruj-al-dhahab, hlm. 497}. Selain itu, Ibn Fadlallah al-'Umari menyebutkan bahwa ia disalibkan di pintu istana al-Shadhyakh di Nishapur, dan ketika disalibkan secara dadakan: \"Mereka tidak mendirikan al-Shadhyakh pada Senin malam, baik yang didahului maupun yang tidak diketahui.\" — Catatan lain tentang kematiannya {cite:umari-masalik-1924, hlm. 233}"
