summary:
  ar: "سياسي وقاضٍ مصري، أول نائب عام مصري منذ الاحتلال البريطاني، ووزير العدل ثم الداخلية، ورئيس الوزراء مرتين: سنة 1922 حين صدر إعلان استقلال مصر الأحادي، وسنة 1927–1928 حين سقط مشروعه للمعاهدة مع بريطانيا فاستقال، وتوفي في باريس سنة 1928 ودُفن في القاهرة."
  en: "Egyptian politician and jurist, the first Egyptian attorney general since the British occupation, minister of justice and then of the interior, and prime minister twice: in 1922, when Britain's Unilateral Declaration of Egyptian Independence was issued, and in 1927–1928, when his draft treaty with Britain was rejected and he resigned; he died at Paris in 1928 and was buried at Cairo."
  ur: "مصری سیاست دان اور منصف، برطانوی قبضے کے بعد پہلے مصری اٹارنی جنرل، وزیرِ انصاف اور پھر وزیرِ داخلہ، اور دو بار وزیرِ اعظم: 1922 میں جب مصر کی آزادی کا یکطرفہ اعلان جاری ہوا، اور 1927–1928 میں جب برطانیہ سے ان کا مسودۂ معاہدہ مسترد ہوا اور انہوں نے استعفیٰ دیا؛ وہ 1928 میں پیرس میں انتقال کر گئے اور قاہرہ میں دفن ہوئے۔"
