summary:
  ar: "تروناجايا (1649 – 2 كانون الثاني 1680)، ويُكتب أيضًا ترونوجويو، أمير وأمير حرب من أروسبايا في مادورا، قاد تمرّد تروناجايا (1674–1681) ضد سلطنة ماتارام. قُتل والده بأمر أمانغكورات الأول سنة 1656، فغادر بلاط بليريد إلى كاجوران وتزوّج ابنة بانيمباهان راما، وثار سنة 1674 بدعم مقاتلي ماكاسار، وأخذ بلاط بليريد في منتصف 1677، ثم هزمته قوات الشركة الهولندية في كيديري في تشرين الثاني 1678، وأُسر سنة 1679، وقتله أمانغكورات الثاني بيده في باياك في 2 كانون الثاني 1680."
  en: "Trunajaya (1649 – 2 January 1680), also spelled Trunojoyo, was a prince and warlord from Arosbaya, Madura, who led the Trunajaya rebellion (1674–1681) against the Mataram Sultanate. His father was killed on Amangkurat I's orders in 1656; he left the Plered court for Kajoran, married Panembahan Rama's daughter, rose in 1674 with Makassarese support, took the court at Plered in mid-1677, was defeated by VOC forces at Kediri in November 1678, captured in 1679, and killed by Amangkurat II's own hand at Payak on 2 January 1680."
  ur: "تروناجایا (1649ء – 2 جنوری 1680ء)، جسے ترونوجویو بھی لکھا جاتا ہے، مادورا کے آروسبایا سے تعلق رکھنے والے شہزادے اور جنگجو سردار تھے جنہوں نے ماتارام سلطنت کے خلاف تروناجایا بغاوت (1674ء–1681ء) کی قیادت کی۔ ان کے والد 1656ء میں امانگکورات اول کے حکم پر قتل ہوئے؛ وہ پلیرید دربار چھوڑ کر کاجوران گئے، پانیمباہان راما کی بیٹی سے شادی کی، 1674ء میں مکاساری حمایت سے اٹھے، وسط 1677ء میں پلیرید لیا، نومبر 1678ء میں کیدیری میں ولندیزی کمپنی سے شکست کھائی، 1679ء میں گرفتار ہوئے اور 2 جنوری 1680ء کو پایاک میں امانگکورات دوم کے ہاتھ سے قتل ہوئے۔"

