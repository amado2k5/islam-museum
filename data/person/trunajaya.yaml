summary:
  ar: "تروناجايا ⁦(1649 – 2 كانون الثاني 1680)⁩، ويُكتب أيضًا ترونوجويو، أمير وأمير حرب من أروسبايا في مادورا، قاد تمرّد تروناجايا (1674–1681) ضد سلطنة ماتارام. قُتل والده بأمر أمانغكورات الأول سنة 1656، فغادر بلاط بليريد إلى كاجوران وتزوّج ابنة بانيمباهان راما، وثار سنة 1674 بدعم مقاتلي ماكاسار، وأخذ بلاط بليريد في منتصف 1677، ثم هزمته قوات الشركة الهولندية في كيديري في تشرين الثاني 1678، وأُسر سنة 1679، وقتله أمانغكورات الثاني بيده في باياك في 2 كانون الثاني 1680."
  en: "Trunajaya (1649 – 2 January 1680), also spelled Trunojoyo, was a prince and warlord from Arosbaya, Madura, who led the Trunajaya rebellion (1674–1681) against the Mataram Sultanate. His father was killed on Amangkurat I's orders in 1656; he left the Plered court for Kajoran, married Panembahan Rama's daughter, rose in 1674 with Makassarese support, took the court at Plered in mid-1677, was defeated by VOC forces at Kediri in November 1678, captured in 1679, and killed by Amangkurat II's own hand at Payak on 2 January 1680."
  ur: "تروناجایا ⁦(1649ء – 2 جنوری 1680ء)⁩، جسے ترونوجویو بھی لکھا جاتا ہے، مادورا کے آروسبایا سے تعلق رکھنے والے شہزادے اور جنگجو سردار تھے جنہوں نے ماتارام سلطنت کے خلاف تروناجایا بغاوت ⁦(1674ء–1681ء)⁩ کی قیادت کی۔ ان کے والد 1656ء میں امانگکورات اول کے حکم پر قتل ہوئے؛ وہ پلیرید دربار چھوڑ کر کاجوران گئے، پانیمباہان راما کی بیٹی سے شادی کی، 1674ء میں مکاساری حمایت سے اٹھے، وسط 1677ء میں پلیرید لیا، نومبر 1678ء میں کیدیری میں ولندیزی کمپنی سے شکست کھائی، 1679ء میں گرفتار ہوئے اور 2 جنوری 1680ء کو پایاک میں امانگکورات دوم کے ہاتھ سے قتل ہوئے۔"
  es: "Trunajaya (1649 – 2 de enero de 1680), también escrito Trunojoyo, fue un príncipe y caudillo de Arosbaya, Madura, que lideró la rebelión de Trunajaya (1674–1681) contra el Sultanato de Mataram. Su padre fue asesinado por orden de Amangkurat I en 1656; abandonó la corte de Plered para ir a Kajoran, se casó con la hija de Panembahan Rama, ascendió al trono en 1674 con el apoyo de Makassar, tomó la corte de Plered a mediados de 1677, fue derrotado por las fuerzas de la VOC en Kediri en noviembre de 1678, capturado en 1679 y asesinado por el propio Amangkurat II en Payak el 2 de enero de 1680."
  fr: "Trunajaya (1649 – 2 janvier 1680), également orthographié Trunojoyo, était un prince et chef de guerre d'Arosbaya, à Madura, qui mena la rébellion de Trunajaya (1674-1681) contre le sultanat de Mataram. Son père fut tué sur ordre d'Amangkurat Ier en 1656; il quitta la cour de Plered pour Kajoran, épousa la fille de Panembahan Rama, se souleva en 1674 avec le soutien des Makassar, prit le pouvoir à Plered au milieu de l'année 1677, fut vaincu par les forces de la VOC à Kediri en novembre 1678, capturé en 1679 et tué par Amangkurat II lui-même à Payak le 2 janvier 1680."
  tr: "Trunajaya (1649 – 2 Ocak 1680), aynı zamanda Trunugoyo olarak da yazılır, Madura'daki Arospaya'dan bir prens ve savaş ağasıydı; Mataram Sultanlığı'na karşı Trunajaya isyanına (1674–1681) öncülük etti. Babası 1656'da Amangakurat I'in emriyle öldürüldü, bu yüzden Belired sarayından ayrılarak Kajuran'a gitti ve Banimbahan Rama'nın kızıyla evlendi. 1674'te Makassar savaşçılarının desteğiyle isyan etti, 1677 ortalarında Belired sarayını ele geçirdi, ardından Kasım 1678'de Kediri'de Hollanda şirketi kuvvetleri tarafından yenildi, 1679'da esir alındı ve 2 Ocak 1680'de Amangkorat II tarafından Bayak'ta kendi elleriyle öldürüldü."
  id: "Trunajaya (1649 – 2 Januari 1680), juga ditulis sebagai Trunugoyo, adalah seorang pangeran dan panglima perang dari Arospaya di Madura, yang memimpin pemberontakan Trunajaya (1674–1681) melawan Kesultanan Mataram. Ayahnya tewas atas perintah Amangakurat I pada tahun 1656, sehingga ia meninggalkan istana Belired menuju Kajuran dan menikahi putri Banimbahan Rama. Ia memberontak pada tahun 1674 dengan dukungan para pejuang Makassar, merebut istana Belired pada pertengahan 1677, kemudian dikalahkan oleh pasukan kompi Belanda di Kediri pada November 1678, ditangkap pada tahun 1679, dan dibunuh oleh Amangkorat II dengan tangannya sendiri di Bayak pada 2 Januari 1680."

