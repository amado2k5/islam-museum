summary:
  ar: "قاسم بن عيسى بن ناجي، أبو الفضل التنوخي القيرواني، فقيه حافظ مالكي، أخذ بالقيروان عن ابن عرفة وغيره، وولي القضاء في عدة أماكن، توفي سنة 837هـ. من تصانيفه «شرح المدونة»، و«الشافي في الفقه»، و«شرح رسالة ابن أبي زيد القيرواني». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3480}"
  en: "Qasim ibn Isa ibn Naji, Abu al-Fadl al-Tanukhi al-Qayrawani (d. 837 AH), a Maliki jurist and hafiz who studied in Qayrawan under Ibn Arafa and others and held judgeships in several places. Among his works are a commentary on the Mudawwana and al-Shafi fi al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3480}"
