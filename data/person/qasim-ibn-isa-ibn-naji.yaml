summary:
  ar: "قاسم بن عيسى بن ناجي، أبو الفضل التنوخي القيرواني، فقيه حافظ مالكي، أخذ بالقيروان عن ابن عرفة وغيره، وولي القضاء في عدة أماكن، توفي سنة 837هـ. من تصانيفه «شرح المدونة»، و«الشافي في الفقه»، و«شرح رسالة ابن أبي زيد القيرواني». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3480}"
  en: "Qasim ibn Isa ibn Naji, Abu al-Fadl al-Tanukhi al-Qayrawani (d. 837 AH), a Maliki jurist and hafiz who studied in Qayrawan under Ibn Arafa and others and held judgeships in several places. Among his works are a commentary on the Mudawwana and al-Shafi fi al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3480}"
  es: "Qasim ibn Isa ibn Naji, Abu al-Fadl al-Tanukhi al-Qayrawani (m. 837 AH), jurista y hafiz maliki que estudió en Qayrawan con Ibn Arafa y otros y ocupó cargos de juez en varios lugares. Entre sus obras se encuentran un comentario sobre Mudawwana y al-Shafi fi al-fiqh. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3480}"
  fr: "Qasim ibn Isa ibn Naji, Abu al-Fadl al-Tanukhi al-Qayrawani (mort en 837 AH), juriste et hafiz malékite qui a étudié à Qayrawan sous Ibn Arafa et d'autres et a exercé des fonctions de juge à plusieurs endroits. Parmi ses œuvres figurent un commentaire sur le Mudawwana et al-Shafi fi al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3480}"
  ur: "قاسم بن عیسیٰ بن ناجی، ابو الفضل التنوخی القایروانی ⁦(متوفی 837ھ)⁩، ایک مالکی فقیہ اور حافظ جنہوں نے ابن عرفہ اور دیگر کے ماتحت قیروان میں تعلیم حاصل کی اور کئی مقامات پر قاضی کے عہدے پر فائز رہے۔ ان کی تصانیف میں مدوانہ اور الشافعی فی الفقہ کی تفسیر ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3480}"
  tr: "Kasım ibn İsa ibn Naji, Maliki hukukçusu ve ezberci Ebu el-Fadl el-Tanukhi el-Qayrawani, İbn Arafa ve diğerlerinin yanında Kairuan'da eğitim gördü ve çeşitli yerlerde yargıçlık yaptı. 837 Hicri'de vefat etti. Eserleri arasında \"Şerh al-Mudawwana\", \"El-Şafi fi el-Fiqh\" ve \"Şerh Risalah İbn Ebi Zeyd el-Keyrawani\" yer alır. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.3480}"
  id: "Qasim ibn Isa ibn Naji, Abu al-Fadl al-Tanukhi al-Qayrawani, seorang ahli hukum dan penghafal Maliki, belajar di Kairouan di bawah bimbingan Ibn Arafa dan lainnya, serta menjabat sebagai hakim di beberapa tempat. Ia meninggal pada tahun 837 H. Di antara karyanya adalah \"Sharh al-Mudawwana,\" \"Al-Shafi fi al-Fiqh,\" dan \"Sharh Risalah Ibn Abi Zayd al-Qayrawani.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3480}"
