summary:
  ar: "علي بن عمر بن أحمد، أبو الحسن البغدادي ابن القصار، فقيه مالكي أصولي حافظ، تفقه بأبي بكر الأبهري وعلي بن الفضل السوري، وتفقه به أبو ذر الهروي وعبد الغني الحافظ وعبد الوهاب ومحمد بن عمروس، ووثقه الخطيب البغدادي، وله كتاب في مسائل الخلاف لم يعرف المالكية أكبر منه. (؟ - لم يذكر الكتاب تاريخ الوفاة). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13357}"
  en: "Ali ibn Umar ibn Ahmad, Abu al-Hasan al-Baghdadi, known as Ibn al-Qassar, a Maliki jurist, usuli and hafiz. He studied with Abu Bakr al-Abhari and Ali ibn al-Fadl al-Suri; Abu Dharr al-Harawi, Abd al-Ghani al-Hafiz and Abd al-Wahhab taught under him. Al-Khatib al-Baghdadi called him reliable. His book on disputed questions is the largest in the school. The printed text gives no date of death here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13357}"
