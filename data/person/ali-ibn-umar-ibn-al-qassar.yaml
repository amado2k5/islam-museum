summary:
  ar: "علي بن عمر بن أحمد، أبو الحسن البغدادي ابن القصار، فقيه مالكي أصولي حافظ، تفقه بأبي بكر الأبهري وعلي بن الفضل السوري، وتفقه به أبو ذر الهروي وعبد الغني الحافظ وعبد الوهاب ومحمد بن عمروس، ووثقه الخطيب البغدادي، وله كتاب في مسائل الخلاف لم يعرف المالكية أكبر منه. ⁦(؟ - لم يذكر الكتاب تاريخ الوفاة)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13357}"
  en: "Ali ibn Umar ibn Ahmad, Abu al-Hasan al-Baghdadi, known as Ibn al-Qassar, a Maliki jurist, usuli and hafiz. He studied with Abu Bakr al-Abhari and Ali ibn al-Fadl al-Suri; Abu Dharr al-Harawi, Abd al-Ghani al-Hafiz and Abd al-Wahhab taught under him. Al-Khatib al-Baghdadi called him reliable. His book on disputed questions is the largest in the school. The printed text gives no date of death here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13357}"
  es: "Ali ibn Umar ibn Ahmad, Abu al-Hasan al-Baghdadi, conocido como Ibn al-Qassar, fue un jurista malikí, usuli y hafiz. Estudió con Abu Bakr al-Abhari y Ali ibn al-Fadl al-Suri; Abu Dharr al-Harawi, Abd al-Ghani al-Hafiz y Abd al-Wahhab fueron maestros suyos. Al-Khatib al-Baghdadi lo consideraba fiable. Su libro sobre cuestiones controvertidas es el más extenso de la escuela. El texto impreso no indica aquí la fecha de su fallecimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13357}"
  fr: "Ali ibn Umar ibn Ahmad, dit Abu al-Hasan al-Baghdadi, également connu sous le nom d'Ibn al-Qassar, juriste malikite, usuli et hafiz. Il étudia auprès d'Abu Bakr al-Abhari et d'Ali ibn al-Fadl al-Suri. Abu Dharr al-Harawi, Abd al-Ghani al-Hafiz et Abd al-Wahhab furent ses élèves. Al-Khatib al-Baghdadi le considérait comme un juriste fiable. Son ouvrage sur les questions litigieuses est le plus volumineux de l'école. Le texte imprimé ne mentionne pas de date de décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13357}"
