id: person/al-rabi-ibn-sulayman-al-muadhdhin
class: person
label: { ar: "الربيع بن سليمان المؤذن", en: "al-Rabi' ibn Sulayman", fr: "al-Rabi' ibn Sulayman", es: "al-Rabi' ibn Sulayman", ur: "ربیع بن سلیمان" }
summary:
  ar: "مؤذن الشافعي وصاحبه، روى عنه عكرمة بن محمد بن بشر ومحمد بن سفيان بن سعيد خبر وفاته بمصر سنة أربع ومائتين {cite:muruj-al-dhahab p. 417}. وعند المسعودي مات سنة سبعين ومائتين، وروى عنه أن الشافعي استعار من محمد بن الحسن الكوفي شيئاً من كتبه فلم يبعث بها فكتب إليه يا قل لمن لم تزعني من رآه مثله العلم ينهى أهله أن يمنعوه أهله فبعث إليه بأكثر كتبه {cite:muruj-al-dhahab p. 580}"
  en: "Al-Shafi'i's muezzin-companion, the chain for his death-account {cite:muruj-al-dhahab p. 417}."
  fr: "Le muezzin-compagnon d'Al-Shafi'i, la chaîne de son compte mort {cite:muruj-al-dhahab p. 417}."
  es: "El muecín acompañante de Al-Shafi'i, la cadena de transmisión de su relato de muerte {cite:muruj-al-dhahab p. 417}."
  ur: "الشافعی کا موذن صحابی، ان کی وفات کے حساب کا سلسلہ 417}۔"
  tr: "El-Şafi'i'nin müezzini ve yoldaşı, İkrime ibn Muhammed ibn Bişr ile Muhammed ibn Sufyan ibn Sa'id, 204 yılında Mısır'da ölüm haberini ondan aktardılar {atıf:Muruj-al-Dhahab, s. 417}. El-Mes'udi'ye göre, 270 H yılında öldü. Ondan rivayet edilir ki, el-Şafi'i bazı kitaplarını Muhammed bin el-Hasan el-Kufi'den ödünç almış, ancak göndermemiş, bu yüzden ona şöyle yazmıştır: 'Beni rahatsız etmeyen, ailesinin onu saklamasını yasaklayan halkının bilgisini söyle.' Bu yüzden ona kitaplarının çoğunu gönderdi {atıf:Muruj-al-Dhahab, s. 580}"
  id: "Muezzin al-Shafi'i dan sahabatnya, Ikrimah ibn Muhammad ibn Bishr serta Muhammad ibn Sufyan ibn Sa'id menceritakan kepadanya kabar kematiannya di Mesir pada tahun 204 {cite:muruj-al-dhahab, hlm. 417}. Menurut al-Mas'udi, ia meninggal pada tahun 270 H. Ia diceritakan bahwa al-Shafi'i meminjam beberapa bukunya dari Muhammad ibn al-Hasan al-Kufi, tetapi ia tidak mengirimkannya, sehingga ia menulis kepadanya: 'Beritahu siapa yang tidak mengganggu saya dengan pengetahuan tentang rakyatnya bahwa ia melarang keluarganya menahannya.' Jadi ia mengirimkan sebagian besar bukunya {cite:muruj-al-dhahab, hlm. 580}"
