summary:
  ar: "مدّاح إيراني من طهران، بدأ المدّاحية بجدية سنة 1371 هجرية شمسية وهو في الخامسة عشرة، ويقيم مدّاحيته في هيئة ريحانة الحسين في حي باغ فيض بطهران، واشتهر عند الجمهور بنوحة «عمو عباس»؛ وهو أكثر مدّاحي إيران متابعة على إنستغرام، إذ بلغ حسابه 1,176,156 متابعًا في نوفمبر 2026 بحسب قراءة على المنصة نفسها."
  en: "Iranian maddah (eulogist) from Tehran who began maddahi in earnest in 1371 SH (1992–93) at the age of fifteen, performs at the Heyat Reyhanat al-Hossein in Tehran's Bagh Feyz district, and is known to the public through the noheh 'Amoo Abbas'; he is Iran's most-followed maddah on Instagram, where his account counted 1,176,156 followers in November 2026 per an on-platform profile read."
  ur: "تہران سے تعلق رکھنے والے ایرانی مداح، جنھوں نے 1371 شمسی میں پندرہ برس کی عمر میں سنجیدگی سے مداحی شروع کی، تہران کے باغ فیض محلے کی ہیئت ریحانۃ الحسین میں مداحی کرتے ہیں اور نوحہ «عمو عباس» سے عوام میں مشہور ہوئے؛ وہ انسٹاگرام پر ایران کے سب سے زیادہ فالو کیے جانے والے مداح ہیں، نومبر 2026ء میں پلیٹ فارم پر پڑھے گئے اعداد کے مطابق ان کے فالوور 1,176,156 تھے۔"
