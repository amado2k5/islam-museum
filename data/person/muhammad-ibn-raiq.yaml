id: person/muhammad-ibn-raiq
class: person
label: { ar: "محمد بن رائق" }
summary:
  ar: "أمير واسط ونواحيها، تغلب سنة أربع وعشرين وحكم على البلاد وبطل أمر الوزارة والدواوين وصارت الأموال تحمل إليه وبقي الراضي معه صورة، وخرج عليه بجكم سنة ست وعشرين فاختفى ثم ظهر في أيام المتقي فقاتل كورتكين الديلمي وهزمه وولي إمرة الأمراء، وخرج عليه علي البريدي فهرب هو والخليفة إلى الموصل وقتل بتكريت غيلة فولي مكانه الحسن بن حمدان ولقبه ناصر الدولة {cite:tarikh-khulafa-minhaj-1434 p. 605,609}."
  en: "Amir of Wasit; in 324 he prevailed over the state — the vizierate lapsed, the money flowed to him, al-Radi became a name only. Driven out by Bajkam, he returned, beat Kurtakin the Daylamite and took the amirate of amirs, then fled al-Baridi's rising to Mosul and was assassinated at Takrit — Hasan ibn Hamdan succeeding as Nasir al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 605,609}."
  es: "Emir de Wasit; en 324 se impuso sobre el estado: el visirato caducó, el dinero fluyó hacia él, al-Radi se convirtió en solo un nombre. Expulsado por Bajkam, regresó, derrotó a Kurtakin el Daylamita y tomó el emirato de los emires, luego huyó del levantamiento de al-Baridi a Mosul y fue asesinado en Takrit; Hasan ibn Hamdan lo sucedió como Nasir al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 605,609}."
  fr: "Émir de Wasit, il s'empara du pouvoir en 324: le vizirat s'éteignit, les richesses affluèrent vers lui et al-Radi ne fut plus qu'un nom. Chassé par Bajkam, il revint, vainquit Kurtakin le Daylamite et s'empara de l'émirat des émirs, puis, fuyant le soulèvement d'al-Baridi, se réfugia à Mossoul où il fut assassiné à Takrit. Hasan ibn Hamdan lui succéda sous le nom de Nasir al-Dawla (voir: Tarikh-Khulafa-Minhaj-1434, p. 605, 609)."
  ur: "وصیت کا امیر؛ 324 میں اس نے ریاست پر غلبہ حاصل کیا - وزیریٹ ختم ہوگیا، پیسہ اس کے پاس چلا گیا، الرعدی صرف ایک نام بن گیا. بزقم کی طرف سے بھگا کر، وہ واپس آیا، قرتکین کو شکست دی اور امیروں کی امارت لے لی، پھر البریدی کے موصل کی طرف بڑھتے ہوئے فرار ہو گیا اور تکریت میں قتل کر دیا گیا - حسن بن حمدان ناصر الدولہ کے طور پر جانشین ہوا۔ 605,609}۔"
  tr: "Wasit ve çevresinin Emiri, 24 Hicri yılında ülkeyi yönetti, bakanlık ve idari görevleri kaldırdı ve fonlar onun sorumluluğuna geçti, Al-Radi ise eski olarak yanında kaldı. 26 Hicri yılında ona karşı isyan etti, ortadan kayboldu, ardından el-Muttaki günlerinde ortaya çıktı, Courtkin al-Daylami ile savaştı, onu yendi ve prenslerin liderliğini devraldı. Ali el-Buraidi ona karşı isyan etti, halife ile birlikte Musul'a kaçtı ve Tikrit'te öldürüldü. Tikrit'te yerine Nasir al-Dawla lakabı olan el-Hasan ibn Hamdan geçti {cite:History-Khulafa-minhaj-1434, s. 605,609}."
  id: "Emir Wasit dan sekitarnya, ia menaklukkan pada tahun 24 H, memerintah negara, menghapus kementerian dan jabatan administrasi, dan dana menjadi tanggung jawabnya, sementara Al-Radi tetap bersamanya sebagai mantan emir. Ia memberontak pada tahun 26 H, menghilang, kemudian muncul pada masa al-Muttaqi, melawan Courtkin al-Daylami, mengalahkannya, dan mengambil alih kepemimpinan para pangeran. Ali al-Buraidi memberontak melawannya, dan ia serta khalifah melarikan diri ke Mosul dan tewas di Tikrit. Di Tikrit, ia digantikan oleh al-Hasan ibn Hamdan, yang dijuluki Nasir al-Dawla {cite:History-Khulafa-minhaj-1434, hlm. 605,609}."
