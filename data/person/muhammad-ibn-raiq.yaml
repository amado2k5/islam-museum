label: { ar: "محمد بن رائق" }
summary:
  ar: "أمير واسط ونواحيها، تغلب سنة أربع وعشرين وحكم على البلاد وبطل أمر الوزارة والدواوين وصارت الأموال تحمل إليه وبقي الراضي معه صورة، وخرج عليه بجكم سنة ست وعشرين فاختفى ثم ظهر في أيام المتقي فقاتل كورتكين الديلمي وهزمه وولي إمرة الأمراء، وخرج عليه علي البريدي فهرب هو والخليفة إلى الموصل وقتل بتكريت غيلة فولي مكانه الحسن بن حمدان ولقبه ناصر الدولة {cite:tarikh-khulafa-minhaj-1434 p. 605,609}."
  en: "Amir of Wasit; in 324 he prevailed over the state — the vizierate lapsed, the money flowed to him, al-Radi became a name only. Driven out by Bajkam, he returned, beat Kurtakin the Daylamite and took the amirate of amirs, then fled al-Baridi's rising to Mosul and was assassinated at Takrit — Hasan ibn Hamdan succeeding as Nasir al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 605,609}."
