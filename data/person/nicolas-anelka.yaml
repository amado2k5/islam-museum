summary:
  ar: "لاعب كرة قدم فرنسي معتزل ومدرب، وُلد في لي شيناي بفرنسا سنة 1979. مهاجم بدأ مع باريس سان جيرمان ثم تألق مع أرسنال ⁦(ثنائية الدوري والكأس 1998)⁩ وريال مدريد، ولعب لمانشستر سيتي وفنربخشة وتشيلسي — حيث فاز بالحذاء الذهبي للدوري الإنجليزي 2009 — وأندية أخرى، وخاض 69 مباراة مع منتخب فرنسا. اعتنق الإسلام سنة 2004 في الإمارات واتخذ اسم عبد السلام بلال."
  en: "French retired footballer and manager, born in Le Chesnay, France in 1979. A forward who began at Paris Saint-Germain and rose with Arsenal (the 1998 league and cup double) and Real Madrid, he played for Manchester City, Fenerbahçe, Chelsea — where he won the 2009 Premier League Golden Boot — and other clubs, and won 69 caps for France. He converted to Islam in 2004 in the United Arab Emirates, taking the name Abdul-Salam Bilal."
  ur: "فرانسیسی ریٹائرڈ فٹبالر اور مینیجر، 1979 میں فرانس کے لی شینے میں پیدا ہوئے۔ فارورڈ جنہوں نے پیرس سینٹ جرمین سے آغاز کیا، آرسنل ⁦(1998 کی لیگ و کپ ثنائی)⁩ اور ریال میڈرڈ سے شہرت پائی، اور مانچسٹر سٹی، فنربخشے اور چیلسی — جہاں 2009 کا پریمیئر لیگ گولڈن بوٹ جیتا — سمیت کئی کلبوں کے لیے کھیلے؛ فرانس کے لیے 69 میچ کھیلے۔ انہوں نے 2004 میں متحدہ عرب امارات میں اسلام قبول کیا اور عبد السلام بلال نام اختیار کیا۔"
  es: "Exfutbolista y entrenador francés, nacido en Le Chesnay, Francia, en 1979. Delantero que comenzó su carrera en el Paris Saint-Germain y alcanzó la cima con el Arsenal (con el que ganó la liga y la copa en 1998) y el Real Madrid, jugó en el Manchester City, el Fenerbahçe, el Chelsea —donde ganó la Bota de Oro de la Premier League en 2009— y otros clubes, y fue internacional con Francia en 69 ocasiones. Se convirtió al islam en 2004 en los Emiratos Árabes Unidos, adoptando el nombre de Abdul-Salam Bilal."
  fr: "Ancien footballeur et entraîneur français, né au Chesnay en 1979. Attaquant formé au Paris Saint-Germain, il a ensuite évolué à Arsenal (avec le doublé coupe-championnat en 1998) et au Real Madrid. Il a également joué pour Manchester City, Fenerbahçe, Chelsea (où il a remporté le Soulier d'or de Premier League en 2009) et d'autres clubs, et compte 69 sélections en équipe de France. Il s'est converti à l'islam en 2004 aux Émirats arabes unis et a pris le nom d'Abdul-Salam Bilal."
  tr: "1979'da Fransa'nın Le Chignay kentinde doğan emekli bir Fransız futbolcu ve teknik direktör. Paris Saint-Germain'de başlayan ve ardından Arsenal (1998'de lig ve kupa çifti) ile Real Madrid'de parlayan bir forvet, Manchester City, Fenerbahçe ve Chelsea (burada 2009 Premier League Altın Ayakkabı'nı kazandı) ve diğer kulüplerde oynadı, ayrıca Fransız milli takımında 69 maç oynadı. 2004'te BAE'de İslam'a geçti ve Abdulsalam Bilal adını aldı."
  id: "Seorang mantan pemain dan pelatih sepak bola Prancis, lahir di Le Chignay, Prancis, pada tahun 1979. Seorang penyerang yang memulai karier di Paris Saint-Germain dan kemudian bersinar bersama Arsenal (ganda liga dan piala pada tahun 1998) dan Real Madrid, bermain untuk Manchester City, Fenerbahçe, dan Chelsea — di mana ia memenangkan Sepatu Emas Liga Utama 2009 — serta klub-klub lainnya, serta bermain 69 pertandingan untuk tim nasional Prancis. Ia memeluk Islam pada tahun 2004 di UEA dan mengambil nama Abdulsalam Bilal."
