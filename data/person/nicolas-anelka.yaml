summary:
  ar: "لاعب كرة قدم فرنسي معتزل ومدرب، وُلد في لي شيناي بفرنسا سنة 1979. مهاجم بدأ مع باريس سان جيرمان ثم تألق مع أرسنال (ثنائية الدوري والكأس 1998) وريال مدريد، ولعب لمانشستر سيتي وفنربخشة وتشيلسي — حيث فاز بالحذاء الذهبي للدوري الإنجليزي 2009 — وأندية أخرى، وخاض 69 مباراة مع منتخب فرنسا. اعتنق الإسلام سنة 2004 في الإمارات واتخذ اسم عبد السلام بلال."
  en: "French retired footballer and manager, born in Le Chesnay, France in 1979. A forward who began at Paris Saint-Germain and rose with Arsenal (the 1998 league and cup double) and Real Madrid, he played for Manchester City, Fenerbahçe, Chelsea — where he won the 2009 Premier League Golden Boot — and other clubs, and won 69 caps for France. He converted to Islam in 2004 in the United Arab Emirates, taking the name Abdul-Salam Bilal."
  ur: "فرانسیسی ریٹائرڈ فٹبالر اور مینیجر، 1979 میں فرانس کے لی شینے میں پیدا ہوئے۔ فارورڈ جنہوں نے پیرس سینٹ جرمین سے آغاز کیا، آرسنل (1998 کی لیگ و کپ ثنائی) اور ریال میڈرڈ سے شہرت پائی، اور مانچسٹر سٹی، فنربخشے اور چیلسی — جہاں 2009 کا پریمیئر لیگ گولڈن بوٹ جیتا — سمیت کئی کلبوں کے لیے کھیلے؛ فرانس کے لیے 69 میچ کھیلے۔ انہوں نے 2004 میں متحدہ عرب امارات میں اسلام قبول کیا اور عبد السلام بلال نام اختیار کیا۔"
