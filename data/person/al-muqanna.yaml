summary:
  ar: "المقنَّع الخراساني، زعيم حركة في عهد المهدي امتدت من سنة ١٥٩ إلى ١٦١هـ؛ وضع على وجهه قناعاً من ذهب ليخفي قبح ملامحه زاعماً للناس أنه يحجب الذات الإلهية التي تجسدت فيه، فادعى الربوبية وارتكزت حركته على الحلولية والتناسخ — اعتقد أن الله خلق آدم وتحول في صورته وأن روح آدم انتقلت إلى الأنبياء حتى وصلت إلى أبي مسلم ثم حلت به من بعده — وأحيا تعاليم مزدك وأبطل التكاليف الشرعية؛ واتصلت حركته بأبي مسلم الخراساني فهي استمرار لحركتي سنباذ والراوندية، وانضوى إليه المبيضة في بخارى والصغد وانتشر أتباعه في نواحي كش ونسف يغيرون على المناطق الآمنة، حتى هزمهم سعيد الحرشي، وأحرق المقنع نفسه قبل القبض عليه {cite:tarikh-dawla-abbasiyya-taqqush p. 78-79}."
  en: "al-Muqanna' — the Veiled One of Khurasan who wore a golden mask and claimed divinity through the metempsychosis of Adam's spirit via Abu Muslim; his Mubayyida followers spread across Bukhara and Soghd until Sa'id al-Harashi's victory and his self-immolation, 159-161 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 78-79}."
  fr: "al-Muqanna' - le Voilé de Khurasan qui portait un masque d'or et revendiquait la divinité par la métempsycose de l'esprit d'Adam via Abu Muslim ; Ses disciples de Mubayyida se répandirent à Boukhara et Soghd jusqu'à la victoire de Sa'id al-Harashi et son auto-immolation, 159-161 de l’hégire {cite:tarikh-dawla-abbasiyya-taqqush p. 78-79}."
  es: "al-Muqanna' - el Velado de Khurasan que llevaba una máscara dorada y reclamaba divinidad a través de la metempsicosis del espíritu de Adán a través de Abu Muslim; sus seguidores de Mubayyida se extendieron por Bukhara y Soghd hasta la victoria de Sa'id al-Harashi y su autoinmolación, 159-161 d. H. {cita:tarikh-dawla-abbasiyya-taqqush p. 78-79}."
  ur: "المقنع - خراسان کا پردہ دار جس نے سنہری نقاب پہنی ہوئی تھی اور ابو مسلم کے ذریعے آدم کی روح کے میٹیم سائیکوسس کے ذریعے الوہیت کا دعویٰ کیا تھا۔ اس کے مبئیدہ پیروکار بخارا اور صغد میں سعید الحرشی کی فتح اور ان کی خود سوزی تک پھیل گئے، 159-161 ہجری۔ 78-79}۔"
  tr: "159-161 Hicri yılları arasında el-Mehdi döneminde süren bir hareketin lideri olan El-Muqni' el-Horasani, yüz hatlarının çirkinliğini gizlemek için yüzünde altın bir maske taktı ve insanlara içinde bedenlenen ilahi özünü sakladığını iddia etti. Egemenlik iddiasında bulundu ve hareketi uyumsuzluk ve reenkarnasyona dayanıyordu—Tanrı'nın Adem'i yarattığına ve onun suretinde dönüştüğüne, Adem ruhunun peygamberlere geçtiğine, sonra Ebu Müslüman'a ulaştığına ve ardından ondan sonra onunla birlikte indiğine inanarak—Mazdak'ın öğretilerini yeniden canlandırdı ve dini yükümlülükleri iptal etti; hareketi Ebu Müslüm el-Horasani ile bağlandı ve böylece devam etti Sanbadh ve Rawandi hareketlerinden ve Mubayda, Buhara ve Sogdia'da ona katıldı; takipçileri Kish ve Nasf bölgelerine yayılarak güvenli bölgelere baskın düzenledi; ta ki Sa'id al-Harshi onları yenene kadar; al-Muqna' ise kendini yakıp onu yakaladı. {atıf:Tarikh-dawla-abbasiyya-taqqush s. 78-79}."
  id: "Al-Muqni' al-Khurasani, pemimpin sebuah gerakan pada masa pemerintahan al-Mahdi yang berlangsung dari tahun 159 hingga 161 H, mengenakan topeng emas di wajahnya untuk menutupi keburukan wajahnya, mengklaim kepada orang-orang bahwa ia menyembunyikan esensi ilahi yang berinkarnasi dalam dirinya. Ia mengklaim kekuasaan, dan gerakannya didasarkan pada ketidakcocokan dan reinkarnasi—percaya bahwa Tuhan menciptakan Adam dan berubah menurut citranya, dan bahwa roh Adam diwariskan kepada para nabi hingga sampai ke Abu Muslim lalu turun bersamanya setelahnya—menghidupkan kembali ajaran Mazdak dan membatalkan kewajiban agama; gerakannya terhubung dengan Abu Muslim al-Khurasani dan dengan demikian terus berlanjut gerakan Sanbadh dan Rawandi, dan Mubayda bergabung dengannya di Bukhara dan Sogdia, dan para pengikutnya menyebar ke seluruh wilayah Kish dan Nasf, menyerang wilayah aman, hingga Sa'id al-Harshi mengalahkan mereka, dan al-Muqna' membakar dirinya sebelum menangkapnya {cite:Tarikh-dawla-abbasiyya-taqqush hlm. 78-79}."
