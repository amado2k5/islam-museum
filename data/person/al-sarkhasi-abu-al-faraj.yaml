id: person/al-sarkhasi-abu-al-faraj
class: person
label: { ar: "أبو الفرج الزاز السرخسي فقيه مرو" }
summary:
  ar: "أبو الفرج الزاز عبد الرحمن بن أحمد بن محمد بن زاز بن حميد الأستاذ السرخسي ثم المروزي — فقيه مرو وتلميذ القاضي حسين؛ قال ابن السمعاني كان أحد أئمة الإسلام يضرب به المثل في الآفاق في حفظ مذهب الشافعي، رحلت إليه الأئمة من كل جانب، وكان ديناً ورعاً محتاطاً في المأكول والملبوس لا يأكل الأرز لأنه يحتاج إلى ماء كثير وصاحبه قلَّ أن لا يظلم غيره؛ مولده سنة إحدى أو اثنتين وثلاثين وأربعمائة؛ ومن تصانيفه كتاب الأمالي قال الأسنوي إن غالب نقل الرافعي من ستة تصانيف غير كلام الغزالي، منها أمالي أبي الفرج السرخسي؛ توفي سنة أربع وتسعين وأربعمائة {cite:shadharat-dhahab p. 400-401}."
  en: "Abu al-Faraj 'al-Zaz' al-Sarkhasi Abd al-Rahman b. Ahmad — Marw's jurist, pupil of Qadi Husayn; Ibn al-Sam'ani calls him one of the imams of Islam proverbial across the lands for command of the Shafi'i madhhab — so scrupulous he would not eat rice lest its heavy watering wrong its grower; born 401 or 402, author of the Amali which al-Asnawi counts among the six books al-Rafi'i drew on besides al-Ghazali's; died 494 {cite:shadharat-dhahab p. 400-401}."
