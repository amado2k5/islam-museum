label: { ar: "أبو الفرج الزاز السرخسي فقيه مرو", en: "Abu al-Faraj al-Zaz al-Sarkhasi, jurist of Marw", fr: "Abu al-Faraj al-Zaz al-Sarkhasi, jurist of Marw", es: "Abu al-Faraj al-Zaz al-Sarkhasi, jurist of Marw" }
summary:
  ar: "أبو الفرج الزاز عبد الرحمن بن أحمد بن محمد بن زاز بن حميد الأستاذ السرخسي ثم المروزي — فقيه مرو وتلميذ القاضي حسين؛ قال ابن السمعاني كان أحد أئمة الإسلام يضرب به المثل في الآفاق في حفظ مذهب الشافعي، رحلت إليه الأئمة من كل جانب، وكان ديناً ورعاً محتاطاً في المأكول والملبوس لا يأكل الأرز لأنه يحتاج إلى ماء كثير وصاحبه قلَّ أن لا يظلم غيره؛ مولده سنة إحدى أو اثنتين وثلاثين وأربعمائة؛ ومن تصانيفه كتاب الأمالي قال الأسنوي إن غالب نقل الرافعي من ستة تصانيف غير كلام الغزالي، منها أمالي أبي الفرج السرخسي؛ توفي سنة أربع وتسعين وأربعمائة {cite:shadharat-dhahab p. 400-401}."
  en: "Abu al-Faraj 'al-Zaz' al-Sarkhasi Abd al-Rahman b. Ahmad — Marw's jurist, pupil of Qadi Husayn; Ibn al-Sam'ani calls him one of the imams of Islam proverbial across the lands for command of the Shafi'i madhhab — so scrupulous he would not eat rice lest its heavy watering wrong its grower; born 401 or 402, author of the Amali which al-Asnawi counts among the six books al-Rafi'i drew on besides al-Ghazali's; died 494 {cite:shadharat-dhahab p. 400-401}."
  fr: "Abu al-Faraj 'al-Zaz' al-Sarkhasi Abd al-Rahman b. Ahmad - juriste de Marw, élève de Qadi Husayn ; Ibn al-Sam'ani l'appelle l'un des imams de l'Islam proverbial à travers les pays pour le commandement du madhhab Shafi'i - si scrupuleux qu'il ne mangerait pas de riz de peur que son arrosage lourd mal son producteur ; né 401 ou 402, auteur de l'Amali qui al-Asnawi compte parmi les six livres al-Rafi'i a dessiné outre al-Ghazali ; est mort 494 {cite:shadharat-dhahab p. 400-401}."
  es: "Abu al-Faraj 'al-Zaz' al-Sarkhasi Abd al-Rahman b. Ahmad — jurista de Marw, discípulo de Qadi Husayn; Ibn al-Sam'ani lo llama uno de los imanes del Islam proverbiales en todas las tierras por su dominio de la madhhab Shafi'i — tan escrupuloso que no comía arroz por temor a que su abundante riego perjudicara a su cultivador; nació en 401 o 402, autor del Amali que al-Asnawi cuenta entre los seis libros en los que se basó al-Rafi'i además del de al-Ghazali; murió en 494 {cite:shadharat-dhahab p. 400-401}."
