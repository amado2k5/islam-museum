summary:
  ar: "الوزير الكبير أبو القاسم علي بن طراد الزينبي؛ وزير المسترشد والمقتفي، سمع من عمه أبي نصر الزينبي وأبي القاسم بن البصري، وكان صدراً مهيباً نبيلاً كامل السؤدد بعيد الغور دقيق النظر ذا رأي ودهاء وإقدام، نهض بأعباء بيعة المقتفي وخلع الراشد في نهار واحد وكان الناس يتعجبون من ذلك؛ ولما تغير عليه المقتفي وهمّ بالقبض عليه احتمى بدار السلطان مسعود ثم خلص ولزم داره واشتغل بالعبادة والخير إلى أن مات في رمضان سنة ثمان وثلاثين وخمسمائة {cite:shadharat-dhahab p. 597}."
  en: "The great wazir Abu al-Qasim Ali ibn Tirad al-Zaynabi, minister to al-Mustarshid and al-Muqtafi; a stately, deep-sighted, daring statesman who in a single day carried through al-Muqtafi's bay'a and al-Rashid's deposition — at which people marvelled; when al-Muqtafi turned on him and meant to seize him he took refuge in Sultan Mas'ud's palace, then withdrew to his house for worship and good works till he died in Ramadan 538 {cite:shadharat-dhahab p. 597}."
