summary:
  ar: "الوزير الكبير أبو القاسم علي بن طراد الزينبي؛ وزير المسترشد والمقتفي، سمع من عمه أبي نصر الزينبي وأبي القاسم بن البصري، وكان صدراً مهيباً نبيلاً كامل السؤدد بعيد الغور دقيق النظر ذا رأي ودهاء وإقدام، نهض بأعباء بيعة المقتفي وخلع الراشد في نهار واحد وكان الناس يتعجبون من ذلك؛ ولما تغير عليه المقتفي وهمّ بالقبض عليه احتمى بدار السلطان مسعود ثم خلص ولزم داره واشتغل بالعبادة والخير إلى أن مات في رمضان سنة ثمان وثلاثين وخمسمائة {cite:shadharat-dhahab p. 597}."
  en: "The great wazir Abu al-Qasim Ali ibn Tirad al-Zaynabi, minister to al-Mustarshid and al-Muqtafi; a stately, deep-sighted, daring statesman who in a single day carried through al-Muqtafi's bay'a and al-Rashid's deposition — at which people marvelled; when al-Muqtafi turned on him and meant to seize him he took refuge in Sultan Mas'ud's palace, then withdrew to his house for worship and good works till he died in Ramadan 538 {cite:shadharat-dhahab p. 597}."
  es: "El gran visir Abu al-Qasim Ali ibn Tirad al-Zaynabi, ministro de al-Mustarshid y al-Muqtafi; un estadista majestuoso, perspicaz y audaz que en un solo día llevó a cabo la bay'a de al-Muqtafi y la deposición de al-Rashid, lo que asombró a la gente; cuando al-Muqtafi se volvió contra él y pretendió apresarlo, se refugió en el palacio del sultán Mas'ud, y luego se retiró a su casa para orar y realizar buenas obras hasta que murió en Ramadán 538 {cite:shadharat-dhahab p. 597}."
  fr: "Le grand vizir Abu al-Qasim Ali ibn Tirad al-Zaynabi, ministre d'al-Mustarshid et d'al-Muqtafi; un homme d'État majestueux, clairvoyant et audacieux qui, en une seule journée, a fait prêter allégeance à al-Muqtafi et a destitué al-Rashid — ce qui a émerveillé les gens; lorsqu'al-Muqtafi s'est retourné contre lui et a voulu le capturer, il s'est réfugié dans le palais du sultan Mas'ud, puis s'est retiré dans sa maison pour prier et accomplir de bonnes œuvres jusqu'à sa mort en Ramadan 538 {cite:shadharat-dhahab p. 597}."
  ur: "عظیم وزیر ابو القاسم علی ابن تراد الزینبی، وزیر المسترشد و المقطفی؛ ایک باوقار، گہری نظر رکھنے والا، ہمت والا سیاستدان جس نے ایک ہی دن میں المقطفی کی بیع اور الرشید کے بیانات کو انجام دیا - جس پر لوگ حیران رہ گئے۔ جب المقتفی نے اس پر حملہ کیا اور اسے پکڑنے کا ارادہ کیا تو اس نے سلطان مسعود کے محل میں پناہ لی، پھر عبادت اور نیک کاموں کے لیے اپنے گھر واپس چلا گیا یہاں تک کہ رمضان المبارک 538 میں اس کی موت ہو گئی۔ 597}۔"
  tr: "Büyük bakan Ebu el-Kasım Ali bin Turad el-Zeynebi; rehber ve el-Muktafi bakanı, amcaları Ebu Nasr el-Zeyneybi ve Ebu el-Kasim bin el-Basri'den duymuştur. O, uzakta, saygın, soylu ve asil bir liderdi; keskin sezgi, keskin muhakeme, kurnazlık ve cesarete sahipti. Bir günde el-Muktafi'ye bağlılık yemini etti ve el-Reşid'in görevden alınmasını üstlendi ve halk buna şaşırdı. El-Muktafi fikrini değiştirip tutuklanınca, Sultan Mes'ud'un evine sığındı, ardından ayrıldı ve evinde ibadet ve hayırseverlikte kaldı; Ramazan'da 538 Hicri yılında vefat etti."
  id: "Menteri besar Abu al-Qasim Ali ibn Turad al-Zainabi; menteri pembimbing dan al-Muqtafi, mendengar dari pamannya Abu Nasr al-Zaynabi dan Abu al-Qasim ibn al-Basri. Ia adalah pemimpin yang bermartabat, mulia, dan mulia, jauh dari sana, dengan wawasan tajam, penilaian tajam, kelicikan, dan keberanian. Ia mengambil sumpah setia kepada al-Muqtafi dan menyingkirkan al-Rashid dalam satu hari, dan orang-orang terkejut akan hal itu. Ketika al-Muqtafi berubah pikiran dan ditangkap saat penangkapannya, ia berlindung di rumah Sultan Mas'ud, lalu pergi dan tinggal di rumah untuk beribadah dan beramal hingga meninggal pada Ramadan tahun 538 H."
