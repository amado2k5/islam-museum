summary:
  ar: "علي بن عيسى بن الفرج بن صالح، أبو الحسن الربعي البغدادي، إمام النحو، لازم أبا سعيد السيرافي ببغداد وأبا علي الفارسي بشيراز حتى بلغ الغاية، وله شرح مختصر الجرمي، وشرح الإيضاح لأبي علي الفارسي، والتنبيه على خطأ ابن جني في تفسير شعر المتنبي. (٤٢٠-٣٢٨ه، كما طبع). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13363}"
  en: "Ali ibn Isa ibn al-Faraj ibn Salih, Abu al-Hasan al-Rabii al-Baghdadi, a leading grammarian. He studied with Abu Sa'id al-Sirafi in Baghdad and with Abu Ali al-Farisi in Shiraz until he reached the highest level. His works include a commentary on Mukhtasar al-Jarmi, a commentary on al-Idah of Abu Ali al-Farisi, and a correction of Ibn Jinni's reading of al-Mutanabbi. The dates printed are 420 and 328 H, given as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13363}"
