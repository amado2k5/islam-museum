summary:
  ar: "أتسز بن أوق الخوارزمي، القائد التركي في جيش السلطان ألب أرسلان؛ أرسله السلطان في حملة إلى جنوب الشام فانتزع الرملة وبيت المقدس من يد الفاطميين، لكنه لم يستطع الاستيلاء على عسقلان بوابة الدخول إلى مصر، وبذلك صار السلاجقة على مقربة من قاعدة الخلافة العباسية والسلطان السلجوقي داخل بيت المقدس {cite:dawlat-uthmaniyya-salabi p. 30}. وسقطت دمشق على يده سنة ٤٦٨هـ/١٠٧٥م وأُقيمت الدعوة للخليفة العباسي، لكنه أخفق في غزو مصر إذ هزمته قوة من العرب قبل مواجهة جيش بدر الجمالي في رجب ٤٦٩هـ/١٠٧٦م، وأدى فشله إلى الصراع الدامي الذي انتهى بمقتله {cite:dawlat-uthmaniyya-salabi p. 33-34}."
  en: "Atsiz ibn Uwaq al-Khwarizmi — Alp Arslan's commander who took Ramla and Jerusalem from the Fatimids, though Ascalon held out {cite:dawlat-uthmaniyya-salabi p. 30}."
  ur: "الپ ارسلان کا خوارزمی سپہ سالار جس نے فاطمیوں سے رملہ اور بیت المقدس حاصل کیے، جبکہ عسقلان ان کے قبضے میں رہا۔ {cite:dawlat-uthmaniyya-salabi}"
