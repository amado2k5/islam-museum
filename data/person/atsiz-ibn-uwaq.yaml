summary:
  ar: "أتسز بن أوق الخوارزمي، القائد التركي في جيش السلطان ألب أرسلان؛ أرسله السلطان في حملة إلى جنوب الشام فانتزع الرملة وبيت المقدس من يد الفاطميين، لكنه لم يستطع الاستيلاء على عسقلان بوابة الدخول إلى مصر، وبذلك صار السلاجقة على مقربة من قاعدة الخلافة العباسية والسلطان السلجوقي داخل بيت المقدس {cite:dawlat-uthmaniyya-salabi p. 30}. وسقطت دمشق على يده سنة ٤٦٨هـ/١٠٧٥م وأُقيمت الدعوة للخليفة العباسي، لكنه أخفق في غزو مصر إذ هزمته قوة من العرب قبل مواجهة جيش بدر الجمالي في رجب ٤٦٩هـ/١٠٧٦م، وأدى فشله إلى الصراع الدامي الذي انتهى بمقتله {cite:dawlat-uthmaniyya-salabi p. 33-34}."
  en: "Atsiz ibn Uwaq al-Khwarizmi — Alp Arslan's commander who took Ramla and Jerusalem from the Fatimids, though Ascalon held out {cite:dawlat-uthmaniyya-salabi p. 30}."
  ur: "الپ ارسلان کا خوارزمی سپہ سالار جس نے فاطمیوں سے رملہ اور بیت المقدس حاصل کیے، جبکہ عسقلان ان کے قبضے میں رہا۔ {cite:dawlat-uthmaniyya-salabi}"
  es: "Atsiz ibn Uwaq al-Khwarizmi: comandante de Alp Arslan que tomó Ramla y Jerusalén de manos de los fatimíes, aunque Ascalon resistió {citar:dawlat-uthmaniyya-salabi p. 30}."
  fr: "Atsiz ibn Uwaq al-Khwarizmi — le commandant d'Alp Arslan qui a pris Ramla et Jérusalem aux Fatimides, bien qu'Ascalon ait résisté {cite:dawlat-uthmaniyya-salabi p. 30}."
  tr: "Sultan Alp Arslan'ın ordusunda Türk komutanı olan Atziz ibn Awq al-Hwarizmi, Sultan tarafından Fatimilerden Ramla ve Kudüs'ü almak için güney Suriye'ye bir sefer için gönderildi, ancak Mısır'a açılan kapı olan Aşkelon'u ele geçiremedi ve böylece Selçuklular Abbasi Halifeliği'nin üssüne ve Selçuklu Sultanı'nın Kudüs içindeki üssüne yaklaştı {atıf:Davlat-Uthmaniyya-Salabi s. 30}. Şam 468 H/1075 yılında ona düştü ve Abbasi halifesine davet edildi, ancak Arap kuvvetleri tarafından yenildi ve Rajab 469 H/1076 M.S. Badr el-Cemali'nin ordusuyla karşılaştı. Başarısızlığı, ölümüyle sona eren kanlı bir çatışmaya yol açtı {atıf:Dawlat-uthmaniyya-salabi s. 33-34}."
  id: "Atziz ibn Awq al-Khwarizmi, komandan Turki dalam pasukan Sultan Alp Arslan, dikirim oleh Sultan dalam kampanye ke Suriah selatan untuk merebut Ramla dan Yerusalem dari Fatimiyah, tetapi ia gagal merebut Ashkelon, gerbang ke Mesir, sehingga membawa Seljuk dekat ke markas Kekhalifahan Abbasiyah dan Sultan Seljuk di dalam Yerusalem {cite:dawlat-uthmaniyya-salabi hlm. 30}. Damaskus jatuh kepadanya pada tahun 468 H/1075 M, dan undangan kepada khalifah Abbasiyah diberikan, tetapi ia gagal menginvasi Mesir karena dikalahkan oleh pasukan Arab sebelum menghadapi pasukan Badr al-Jamali di Rajab 469 H/1076 M. Kegagalannya menyebabkan konflik berdarah yang berakhir dengan kematiannya {cite:Dawlat-uthmaniyya-salabi hlm. 33-34}."
