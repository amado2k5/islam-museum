summary:
  ar: "محيي الدين البردعي الحنفي من موالي الروم؛ اشتغل على والده ثم دخل شيراز وهراة وقرأ على علمائها وحصل علماً كثيراً ثم ارتحل إلى بلاد الروم فصار مدرساً بمدرسة أحمد باشا بمدينة بروسا ثم بإحدى المدرستين المتلاصقتين بأدرنة وتوفي وهو مدرس بها، وله حواش على تفسير البيضاوي وحواش على شرح التجريد للسيد الشريف وحواش على الجلوي وشرح على آداب البحث للعضد؛ توفي بأدرنة سنة ثلاث وعشرين وتسعمائة {cite:shadharat-dhahab p. 561}."
  en: "An Anatolian scholar who took the long road east — Shiraz and Herat for learning, then back to teach at Ahmad Pasha's madrasa in Bursa and one of the twin madrasas of Edirne, where he died in post; glosses on al-Baydawi's tafsir, the Sharif's Tajrid sharh, al-Jalwi, and a sharh on 'Izz al-Din's Adab al-Bahth; d. Edirne 923 {cite:shadharat-dhahab p. 561}."
  es: "Un erudito anatolio que emprendió el largo camino hacia el este: Shiraz y Herat para estudiar, y luego regresó para enseñar en la madrasa de Ahmad Pasha en Bursa y en una de las madrasas gemelas de Edirne, donde murió en el cargo; glosas sobre el tafsir de al-Baydawi, el sharh Tajrid del Sharif, al-Jalwi y un sharh sobre el Adab al-Bahth de 'Izz al-Din; murió en Edirne en 923 {cita: shadharat-dhahab p. 561}."
  fr: "Un érudit anatolien qui a pris la longue route vers l'est — Shiraz et Herat pour étudier, puis retour pour enseigner à la madrasa d'Ahmad Pacha à Bursa et dans l'une des madrasas jumelles d'Edirne, où il est mort en poste; gloses sur le tafsir d'al-Baydawi, le sharh Tajrid du Sharif, al-Jalwi, et un sharh sur l'Adab al-Bahth d'Izz al-Din; d. Edirne 923 {cite:shadharat-dhahab p. 561}."
