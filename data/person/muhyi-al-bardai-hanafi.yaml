summary:
  ar: "محيي الدين البردعي الحنفي من موالي الروم؛ اشتغل على والده ثم دخل شيراز وهراة وقرأ على علمائها وحصل علماً كثيراً ثم ارتحل إلى بلاد الروم فصار مدرساً بمدرسة أحمد باشا بمدينة بروسا ثم بإحدى المدرستين المتلاصقتين بأدرنة وتوفي وهو مدرس بها، وله حواش على تفسير البيضاوي وحواش على شرح التجريد للسيد الشريف وحواش على الجلوي وشرح على آداب البحث للعضد؛ توفي بأدرنة سنة ثلاث وعشرين وتسعمائة {cite:shadharat-dhahab p. 561}."
  en: "An Anatolian scholar who took the long road east — Shiraz and Herat for learning, then back to teach at Ahmad Pasha's madrasa in Bursa and one of the twin madrasas of Edirne, where he died in post; glosses on al-Baydawi's tafsir, the Sharif's Tajrid sharh, al-Jalwi, and a sharh on 'Izz al-Din's Adab al-Bahth; d. Edirne 923 {cite:shadharat-dhahab p. 561}."
