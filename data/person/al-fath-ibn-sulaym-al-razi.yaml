summary:
  ar: "أبو الفتح سليم بن أيوب بن سليم الرازي الشافعي المفسر، صاحب التصانيف والتفسير؛ تلميذ أبي حامد الإسفراييني علّق عنه التعليق وجلس مكانه، ثم سافر إلى الشام فأقام بثغر صور مرابطاً ينشر العلم وتخرّج عليه الشيخ نصر المقدسي؛ كان ورعاً زاهداً يحاسب نفسه على الأونات، تفقه بعد أن جاوز الأربعين؛ من تصانيفه تفسيره «عماد ضياء القلوب»؛ غرق في بحر القلزم عند ساحل جدة بعد الحج في صفر سنة سبع وأربعين وأربعمائة {cite:shadharat-dhahab p. 276-277}."
  en: "Abu al-Fath Sulaym b. Ayyub al-Razi — the Shafi'i exegete, pupil-successor of Abu Hamid al-Isfarayini, who settled as a murabit at Tyre and taught Nasr al-Maqdisi among others; a late starter who took up fiqh past forty and kept strict account of his hours; author of the tafsir *Imad Diya' al-Qulub*; drowned in the Red Sea off Jeddah on the return from hajj in Safar 447 {cite:shadharat-dhahab p. 276-277}."
