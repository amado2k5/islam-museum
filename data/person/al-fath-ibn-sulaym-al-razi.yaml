id: person/al-fath-ibn-sulaym-al-razi
class: person
label: { ar: "أبو الفتح سليم بن أيوب الرازي المفسر", en: "Abu al-Fath Sulaym ibn Ayyub al-Razi, the exegete", fr: "Abu al-Fath Sulaym ibn Ayyub al-Razi, l’exégète", es: "Abu al-Fath Sulaym ibn Ayyub al-Razi, the exegete", ur: "ابو الفتح سلیم بن ایوب الرازی، مفسر" }
summary:
  ar: "أبو الفتح سليم بن أيوب بن سليم الرازي الشافعي المفسر، صاحب التصانيف والتفسير؛ تلميذ أبي حامد الإسفراييني علّق عنه التعليق وجلس مكانه، ثم سافر إلى الشام فأقام بثغر صور مرابطاً ينشر العلم وتخرّج عليه الشيخ نصر المقدسي؛ كان ورعاً زاهداً يحاسب نفسه على الأونات، تفقه بعد أن جاوز الأربعين؛ من تصانيفه تفسيره «عماد ضياء القلوب»؛ غرق في بحر القلزم عند ساحل جدة بعد الحج في صفر سنة سبع وأربعين وأربعمائة {cite:shadharat-dhahab p. 276-277}."
  en: "Abu al-Fath Sulaym b. Ayyub al-Razi — the Shafi'i exegete, pupil-successor of Abu Hamid al-Isfarayini, who settled as a murabit at Tyre and taught Nasr al-Maqdisi among others; a late starter who took up fiqh past forty and kept strict account of his hours; author of the tafsir *Imad Diya' al-Qulub*; drowned in the Red Sea off Jeddah on the return from hajj in Safar 447 {cite:shadharat-dhahab p. 276-277}."
  fr: "Abu al-Fath Sulaym ibn Ayyub al-Razi — exégète chaféite, élève et successeur d’Abu Hamid al-Isfarayini, établi comme murabit à Tyr, où il enseigna notamment à Nasr al-Maqdisi ; il commença tard, étudiant le fiqh après quarante ans et tenant un compte strict de ses heures ; auteur du tafsir Imad Diya’ al-Qulub ; noyé en mer Rouge au large de Djeddah au retour du pèlerinage en safar 447 H {cite:shadharat-dhahab p. 276-277}."
  es: "Abu al-Fath Sulaym b. Ayyub al-Razi — el exegeta shafi'í, discípulo y sucesor de Abu Hamid al-Isfarayini, que se estableció como murabit en Tiro y enseñó a Nasr al-Maqdisi, entre otros; un estudiante tardío que comenzó a estudiar fiqh después de los cuarenta y llevaba un registro estricto de sus horas; autor del tafsir *Imad Diya' al-Qulub*; se ahogó en el Mar Rojo frente a Yeda al regresar del Hajj en Safar 447 {cite:shadharat-dhahab p. 276-277}."
  ur: "ابو الفتح سلیم ب۔ ایوب الرازی — شافعی مفسر، ابو حامد الاسفرائنی کے شاگرد، جانشین، جو صور میں مربی کے طور پر آباد ہوئے اور دوسروں کے درمیان نصر المقدسی کو پڑھایا؛ ایک دیر سے شروع کرنے والا جس نے چالیس سے زیادہ فقہ پڑھا اور اپنے اوقات کا سخت حساب رکھا۔ تفسیر *عماد دیا القلوب* کے مصنف؛ صفر 447 میں حج سے واپسی پر جدہ کے قریب بحیرہ احمر میں ڈوب گیا۔ 276-277}۔"
  tr: "Ebu el-Fath Salim ibn Ayyub ibn Salim el-Razi el-Şafii, tefsirci, kitap ve tefsir yazarı; Ebu Hamid el-İsfarayini'nin öğrencisiydi, onun eserleri üzerine tefsirler yazdı ve onun yerini aldı, sonra Levant'a seyahat etti ve Sur limanında kaldı, orada ilim yaydı ve Şeyh Nasr el-Makdisi ondan mezun oldu; dindar ve zühd sahibiydi, her anından kendini sorumlu tuttu, kırk yaşını geçtikten sonra fıkıh okudu; kitapları arasında \"İmad Diya' el-Kulub\" tefsiri de bulunmaktadır; Hicri 447 yılının Safer ayında Hac'dan sonra Cidde açıklarında Kızıldeniz'de boğuldu. {Kaynak: Şadharat-Dhaba s. 276-277}"
  id: "Abu al-Fath Salim ibn Ayyub ibn Salim al-Razi al-Shafi’i, seorang komentator, penulis buku dan tafsir; seorang murid Abu Hamid al-Isfarayini, ia menulis tafsir atas karyanya dan menggantikan posisinya, kemudian ia melakukan perjalanan ke Levant dan tinggal di pelabuhan Tirus, menetap di sana, menyebarkan ilmu, dan Syekh Nasr al-Maqdisi lulus darinya; ia saleh dan asketis, bertanggung jawab atas setiap momen hidupnya, ia mempelajari fiqih setelah berusia empat puluh tahun; di antara buku-bukunya adalah tafsirnya “Imad Diya’ al-Qulub”; ia tenggelam di Laut Merah di lepas pantai Jeddah setelah ibadah haji pada bulan Safar tahun 447 H {cite:shadharat-dhahab hlm. 276-277}."
