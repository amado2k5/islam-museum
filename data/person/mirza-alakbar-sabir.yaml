summary:
  ar: "شاعر ساخر أذربيجاني (1862–1911)، اسم مولده طاهرزاده. نظم في «ملا نصر الدين» وغيرها من صحف القوقاز شعرًا بلغة الشعب هاجم فيه نفاق رجال الدين والموظفين الفاسدين والخرافة، فصار مؤسس الشعر الساخر الحديث في الأدب الأذربيجاني؛ وجُمعت قصائده في «هوپ هوپ نامه»."
  en: "Azerbaijani satirical poet (1862–1911), born Tahirzadeh. Writing in Molla Nasreddin and other Caucasus journals in the everyday language of the South Caucasus, he mocked clerical hypocrisy, corrupt officials and superstition; his poems were collected as the Hophopname, and he is counted the founder of modern satirical verse in Azerbaijani literature."
  ur: "آذربائیجانی طنزیہ شاعر (1862–1911)، ولدیت کا نام طاہرزادہ۔ «ملا نصرالدین» اور دیگر قفقازی جرائد میں عوامی زبان میں لکھا اور مذہبی منافقت، بدعنوان اہلکاروں اور توہم پرستی کا مذاق اڑایا؛ ان کا دیوان «ہوپ ہوپ نامہ» کے نام سے جمع ہوا۔"
