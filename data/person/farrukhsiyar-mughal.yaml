summary:
  ar: "بطاقة أولية لفرخ سير، تاسع أباطرة المغول وصاحب عهد انتصار السيدين، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Farrukhsiyar, ninth Mughal emperor raised by the Sayyid brothers, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Farrukhsiyar, noveno emperador mogol criado por los hermanos Sayyid, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de candidature de Farrukhsiyar, neuvième empereur moghol, élevé par les frères Sayyid, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "سید برادران کی طرف سے اٹھائے گئے نویں مغل شہنشاہ فرخ سیار کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Dokuzuncu Moğol imparatoru ve İki Seyyid'in Zaferi'nin sahibi Farkh Sir için ön kart, açık bir referans tanımında (Wikidata) bahsedilmiştir. Hasan İbrahim'in İslam Tarihi'ndeki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan untuk Farkh Sir, kaisar Mongol kesembilan dan pemilik Victory of the Two Sayyids, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
