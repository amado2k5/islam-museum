summary:
  en: "A young Umayyad Qurashi companion whom the Prophet appointed over Mecca when he marched to Hunayn in Shawwal 8 AH and confirmed as its governor on his return through al-Ji'rana; the Prophet teased his youth, and Attab administered the city and led its pilgrimage in the Prophet's lifetime."
  ar: "صحابي قرشي أموي شاب؛ استخلفه النبي على مكة حين غادرها إلى حنين في شوال سنة 8هـ، ثم ثبّته عاملاً عليها عند عودته من الجعرانة، وقال فيه: «ما لقوم يستعملون مثل هذا الحدث» فقيل: يا رسول الله إنه يقرأ، فأقرّه، وكان يؤم أهل مكة ويحج بهم في حياة النبي."
