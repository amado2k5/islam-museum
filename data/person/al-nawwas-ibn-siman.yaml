summary:
  ar: "صحابي يروي عنه حديث «البر حسن الخلق والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس» وهو أحد حديثين جمعهما النووي في العدد السابع والعشرين من الأربعين، أخرجه مسلم (2553) من رواية عبد الرحمن بن جبير بن نفير عن أبيه عنه — وهي سلسلة تفرد مسلم بتخريجها دون البخاري."
  en: "A Companion who transmits 'righteousness is good character, and sin is what wavers in your soul and you dislike for people to see it', one of the two hadiths al-Nawawi gathers under the twenty-seventh number of the Forty, transmitted by Muslim (2553) through Abd al-Rahman ibn Jubayr ibn Nufayr from his father from him — a chain Muslim alone of the two Shaykhs carried."
