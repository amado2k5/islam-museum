  ur: "چودھویں صدی کے شافعی فقیہ احمد بن عمر المدلجی کے لیے مسودہ کارڈ جسے النشاعی کے نام سے جانا جاتا ہے۔ 1356; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
