  id: "Kartu pendahuluan Ahmad ibn Umar al-Mudlaji, yang dikenal sebagai al-Nasha'i, seorang ahli hukum Shafi'i abad keempat belas, yang meninggal pada tahun 1356 M; ia disebutkan dalam kamus tokoh-tokoh terkemuka, dan biografinya belum pernah ditinjau di halaman tersebut."
