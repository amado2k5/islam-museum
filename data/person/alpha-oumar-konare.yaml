summary:
  ar: "سياسي وأكاديمي مالي (وُلد 1946) من كايس، مؤرخ وعالم آثار درس في باماكو ووارسو وجنيف ودرّس التاريخ وترأس المجلس الدولي للمتاحف (1989–1992)، ثم صار رئيس مالي لولايتين منتخبتين (1992–2002) — وفي أيامه الأخيرة في المنصب عفا عن موسى تراوري — ثم رئيس مفوضية الاتحاد الإفريقي (2003–2008)."
  en: "Malian politician and academic (born 1946) from Kayes, a historian and archaeologist educated in Bamako, Warsaw and Geneva who taught history and presided over the International Council of Museums (1989–1992), then served two elected terms as President of Mali (1992–2002) — pardoning Moussa Traoré in his last days in office — and chaired the African Union Commission (2003–2008)."
  ur: "مالی سیاست دان و ماہرِ تعلیم (پیدائش 1946ء)، کایس سے؛ مورخ و ماہرِ آثارِ قدیمہ، باماکو، وارسا اور جنیوا میں تعلیم پائی، تاریخ پڑھائی اور عجائب گھروں کی بین الاقوامی کونسل کے صدر رہے (1989ء–1992ء)، پھر مالی کے دو منتخب ادوار کے صدر (1992ء–2002ء) بنے — آخری دنوں میں موسی تراورے کو معافی دی — اور افریقی یونین کمیشن کے چیئرمین (2003ء–2008ء) رہے۔"
