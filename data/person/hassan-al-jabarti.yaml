summary:
  ar: "حسن بن إبراهيم الجبرتي الزيلعي العقيلي الحنفي ⁦(1110–1188هـ)⁩، فقيه حنفي ورياضي وفلكي مصري، والد المؤرخ عبد الرحمن الجبرتي، ترجمه ابنه في «عجائب الآثار» ترجمة طويلة: اشتغل بالرياضيات من سنة 1144هـ، وأخذ الهيئة والهندسة عن حسام الدين الهندي، ورسم المزاول ونصبها في الأزهر وغيره، وحضر إليه طلاب من الإفرنج سنة 1159هـ فقرؤوا عليه الهندسة، وانتهت إليه الفتوى عند القضاة، وتوفي غرة صفر 1188هـ {cite:ajaib-al-athar-moreh-2013-v1 p.502} {cite:ajaib-al-athar-moreh-2013-v1 p.510} {cite:ajaib-al-athar-moreh-2013-v1 p.515} {cite:ajaib-al-athar-moreh-2013-v1 p.516} {cite:ajaib-al-athar-moreh-2013-v1 p.524}."
  en: "Hasan ibn Ibrahim al-Jabarti al-Zayla'i al-Aqili al-Hanafi (1110-1188 AH), Egyptian Hanafi jurist, mathematician and astronomer, father of the historian Abd al-Rahman al-Jabarti, who gives him a long biography in Aja'ib al-athar: he took up mathematics from 1144 AH, learned astronomy and geometry from Husam al-Din al-Hindi, drew and set up sundials at al-Azhar and elsewhere, taught geometry to European students who came to him in 1159 AH, was the jurist whose fatwas the judges trusted, and died on 1 Safar 1188 AH."
  es: "Hasan ibn Ibrahim al-Jabarti al-Zayla'i al-Aqili al-Hanafi (1110-1188 AH), jurista, matemático y astrónomo egipcio de la escuela Hanafi, padre del historiador Abd al-Rahman al-Jabarti, quien le dedica una extensa biografía en Aja'ib al-athar: comenzó a estudiar matemáticas en 1144 AH, aprendió astronomía y geometría de Husam al-Din al-Hindi, dibujó e instaló relojes de sol en al-Azhar y otros lugares, enseñó geometría a estudiantes europeos que acudieron a él en 1159 AH, fue el jurista cuyas fatuas gozaban de la confianza de los jueces y falleció el 1 de Safar de 1188 AH."
  fr: "Hasan ibn Ibrahim al-Jabarti al-Zayla'i al-Aqili al-Hanafi (1110-1188 AH), juriste, mathématicien et astronome hanafite égyptien, père de l'historien Abd al-Rahman al-Jabarti, qui lui consacre une longue biographie dans Aja'ib al-athar: il commença les mathématiques en 1144 AH, apprit l'astronomie et la géométrie auprès de Husam al-Din al-Hindi, dessina et installa des cadrans solaires à al-Azhar et ailleurs, enseigna la géométrie aux étudiants européens venus le voir en 1159 AH, était le juriste dont les fatwas étaient approuvées par les juges, et mourut le 1er Safar 1188 AH."
  ur: "حسن بن ابراہیم الجبارتی الزائلی العقیلی الحنفی ⁦(1110-1188ھ)⁩، مصری حنفی فقیہ، ریاضی دان اور ماہر فلکیات، مؤرخ عبدالرحمٰن الجبارتی کے والد، جنہوں نے ان کی ایک طویل سوانح عمری عجائب المعروف سے نقل کی ہے۔ حسام الدین الہندی سے علم فلکیات اور جیومیٹری کی تعلیم حاصل کی، الازہر اور دیگر مقامات پر سنڈیل بنائے اور لگوائے، 1159 ہجری میں ان کے پاس آنے والے یورپی طلباء کو جیومیٹری پڑھائی، وہ فقیہ تھے جن کے فتووں پر ججوں نے بھروسہ کیا اور یکم صفر 1188 ہجری کو وفات پائی۔"
  tr: "Hasan ibn İbrahim el-Cebarti el-Zayla'i el-'Akli el-Hanefi (1110–1188 H), Mısırlı bir Hanefi hukukçu, matematikçi ve astronomdu; tarihçi Abd al-Rahman al-Jabarti'nin babasıdır. Oğlu ise 'Geleneklerin Harikaları'nda uzun bir şekilde çevirmiştir: 1144 Hicri yılından itibaren matematik okudu, Hüsameddin el-Hindi'nin yanında astronomi ve astronomi okudu, Ezher'de ve başka yerlerde el-mevlav eserleri çizip kurdu. 1159 Hicri'de Frank öğrencileri ona katıldı ve onunla birlikte geometri çalıştı. Hakimlerden fetva aldı ve 1188 Hicri Sefer'in birinci gününde vefat etti {alıntı: ajaib-al-athar-moreh-2013-v1 s.502} {cite:ajaib-al-athar-moreh-2013-v1 s.510} {cite:ajaib-al-athar-moreh-2013-v1 p.515} {cite:ajaib-al-athar-moreh-2013-v1 s.516} {cite:ajaib-al-athar-moreh-2013-v1 s.524}."
  id: "Hasan ibn Ibrahim al-Jabarti al-Zayla'i al-'Aqili al-Hanafi (1110–1188 H) adalah seorang ahli hukum, matematikawan, dan astronom Hanafi Mesir, ayah dari sejarawan Abd al-Rahman al-Jabarti. Putranya menerjemahkan secara panjang lebar dalam 'Keajaiban Tradisi': Ia belajar matematika sejak 1144 H, mempelajari astronomi dan astronomi di bawah bimbingan Husam al-Din al-Hindi, serta menggambar dan memasang karya al-mawlawal di Al-Azhar dan tempat lain. Pada tahun 1159 H, murid-murid dari bangsa Franka mendampinginya dan belajar geometri bersamanya. Ia menerima fatwa dari para hakim, dan ia meninggal pada tanggal 1 Safar 1188 H. {cite: Ajaib-al-athar-moreh-2013-v1 p.502} {cite:ajaib-al-athar-moreh-2013-v1 p.510} {cite:ajaib-al-athar-moreh-2013-v1 p.515} {cite:ajaib-al-athar-moreh-2013-v1 p.516} {cite:ajaib-al-athar-moreh-2013-v1 p.524}."
