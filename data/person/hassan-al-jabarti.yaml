summary:
  ar: "حسن بن إبراهيم الجبرتي الزيلعي العقيلي الحنفي ⁦(1110–1188هـ)⁩، فقيه حنفي ورياضي وفلكي مصري، والد المؤرخ عبد الرحمن الجبرتي، ترجمه ابنه في «عجائب الآثار» ترجمة طويلة: اشتغل بالرياضيات من سنة 1144هـ، وأخذ الهيئة والهندسة عن حسام الدين الهندي، ورسم المزاول ونصبها في الأزهر وغيره، وحضر إليه طلاب من الإفرنج سنة 1159هـ فقرؤوا عليه الهندسة، وانتهت إليه الفتوى عند القضاة، وتوفي غرة صفر 1188هـ {cite:ajaib-al-athar-moreh-2013-v1 p.502} {cite:ajaib-al-athar-moreh-2013-v1 p.510} {cite:ajaib-al-athar-moreh-2013-v1 p.515} {cite:ajaib-al-athar-moreh-2013-v1 p.516} {cite:ajaib-al-athar-moreh-2013-v1 p.524}."
  en: "Hasan ibn Ibrahim al-Jabarti al-Zayla'i al-Aqili al-Hanafi (1110-1188 AH), Egyptian Hanafi jurist, mathematician and astronomer, father of the historian Abd al-Rahman al-Jabarti, who gives him a long biography in Aja'ib al-athar: he took up mathematics from 1144 AH, learned astronomy and geometry from Husam al-Din al-Hindi, drew and set up sundials at al-Azhar and elsewhere, taught geometry to European students who came to him in 1159 AH, was the jurist whose fatwas the judges trusted, and died on 1 Safar 1188 AH."
