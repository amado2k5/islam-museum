summary:
  ar: عالم مغربي-فرنسي، وُلد في وجدة سنة 1967. يتولى الأمانة العامة للمجلس العالمي للمجتمعات المسلمة في الإمارات، ويرأس الاتحاد الوطني لمسلمي فرنسا ويشغل الأمانة العامة للمؤتمر الإسلامي الأوروبي، وأسس معهد
    ابن سينا للعلوم الإنسانية بليل؛ عضو مجمع الفقه الإسلامي الدولي ومجلس مستشاري مركز كايسيد للحوار.
  en: French-Moroccan scholar, born in Oujda in 1967. He is secretary-general of the World Muslim Communities Council in the UAE, president of the French National Federation of Muslims and secretary-general
    of the European Islamic Conference, and founded the Ibn Sina Institute for Human Sciences in Lille; he sits on the International Islamic Fiqh Academy and the KAICIID advisory board.
  ur: فرانسیسی-مغربی عالم، 1967 میں وجدہ میں پیدا ہوئے۔ وہ متحدہ عرب امارات میں عالمی مجلسِ مسلم برادریوں کے سیکریٹری جنرل، فرینچ نیشنل فیڈریشن آف مسلمز کے صدر اور یورپی اسلامی کانفرنس کے سیکریٹری جنرل
    ہیں، اور لیل میں ابنِ سینا انسٹیٹیوٹ برائے انسانی علوم کے بانی ہیں؛ بین الاقوامی فقہ اکیڈمی اور مرقعہ کایسید کے مشاورتی بورڈ کے رکن ہیں۔
  es: "Erudito franco-marroquí, nacido en Oujda en 1967. Es secretario general del Consejo Mundial de Comunidades Musulmanas en los Emiratos Árabes Unidos, presidente de la Federación Nacional Francesa de Musulmanes y secretario general de la Conferencia Islámica Europea. Fundó el Instituto Ibn Sina de Ciencias Humanas en Lille; forma parte de la Academia Internacional de Jurisprudencia Islámica y del consejo asesor de KAICIID."
  fr: "Érudit franco-marocain, né à Oujda en 1967. Il est secrétaire général du Conseil mondial des communautés musulmanes aux Émirats arabes unis, président de la Fédération nationale française des musulmans et secrétaire général de la Conférence islamique européenne. Il a fondé l'Institut Ibn Sina des sciences humaines à Lille et siège au conseil consultatif de l'Académie internationale de jurisprudence islamique (KAICIID)."
