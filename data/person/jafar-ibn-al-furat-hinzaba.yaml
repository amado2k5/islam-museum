summary:
  ar: "جعفر بن الفضل بن جعفر بن محمد بن الفرات أبو الفضل المعروف بابن حزابة الوزير، ولد في ذي الحجة سنة ثمان وثلاثمائة، ونزل مصر وتقلد الوزارة لأميرها كافور، وكان أبوه وزير المقتدر، وحدث عن محمد بن هارون الحضرمي وطبقته من البغداديين، وكان يقول من جاءني بمجلس من مجالس البغوي أغنيته، وكان يملي الحديث بمصر فخرج إليه الدارقطني وأقام عنده مدة فصنف له المسند وحصل له من جهته مال كثير وروى عنه الدارقطني في كتاب المديح أحاديث. توفي في ربيع الأول سنة إحدى وتسعين {cite:muntazam-ibn-al-jawzi j.7 p.216}."
