summary:
  ar: "أول رئيس لقضاء باكستان (1889-1981)، من أسرة ميان الآرائنية في باغبانبوره بلاهور؛ رئيس قضاة لاهور سنة 1946، وبصفته أقدم قاضٍ مسلم في الهند البريطانية أدّى محمد علي جناح أمامه يمين المنصب في 15 أغسطس 1947."
  en: "First Chief Justice of Pakistan (1889-1981), of the Arain Mian family of Baghbanpura, Lahore; Chief Justice of Lahore from 1946, and as the most senior Muslim judge in British India he administered the oath of office to Muhammad Ali Jinnah on 15 August 1947."
  ur: "پاکستان کے پہلے چیف جسٹس (1889ء–1981ء)، لاہور کے باغبانپورہ کی آرائیں میاں فیملی سے؛ 1946ء میں لاہور کے چیف جسٹس بنے، اور برطانوی ہند کے سینئر ترین مسلمان جج کی حیثیت سے 15 اگست 1947ء کو محمد علی جناح سے حلف لیا۔"
