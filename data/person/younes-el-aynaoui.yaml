summary:
  ar: "لاعب كرة مضرب مغربي سابق ومدرب، وُلد في الرباط سنة 1971، احترف سنة 1990 وفاز بخمسة ألقاب فردية في بطولات رابطة المحترفين، وبلغ أعلى تصنيف له الرابع عشر عالميا في مارس 2003، وخاض في بطولة أستراليا المفتوحة 2003 مباراة ماراثونية من خمس مجموعات أمام أندي روديك انتهت مجموعتها الخامسة 21–19، ومنحه الملك محمد السادس الميدالية الذهبية، أعلى وسام رياضي في المغرب، واختاره قراء صحيفة ليكونوميست سنة 2003 نموذجا مفضلا للمجتمع، وعاد للعب سنة 2017 في سن الخامسة والأربعين فصار أكبر لاعب يحمل تصنيفا في تاريخ الرابطة."
  en: "Moroccan former professional tennis player and coach, born in Rabat in 1971. He turned professional in 1990, won five ATP Tour singles titles, reached a career-high singles ranking of world No. 14 in March 2003, and played the 2003 Australian Open quarter-final against Andy Roddick whose fifth set ran to 21–19. King Mohammed VI awarded him the gold medal, Morocco's highest sporting honour, readers of L'Economiste named him their favourite role model in a 2003 poll, and a brief comeback in 2017 made him, at 45, the oldest player ever to hold an ATP ranking."
  ur: "مراکش کے سابق پیشہ ور ٹینس کھلاڑی اور کوچ، جو 1971 میں رباط میں پیدا ہوئے۔ انھوں نے 1990 میں پیشہ ورانہ کھیل شروع کیا، اے ٹی پی ٹور کے پانچ سنگلز خطاب جیتے، مارچ 2003 میں اپنے کیریئر کی بلند ترین درجہ بندی عالمی نمبر 14 تک پہنچے، اور 2003 کے آسٹریلین اوپن کوارٹر فائنل میں اینڈی روڈک کے خلاف پانچ سیٹوں کی طویل میراتھن کھیلی جس کا پانچواں سیٹ 21–19 پر ختم ہوا۔ شاہ محمد ششم نے انھیں طلائی تمغہ دیا، جو مراکش کا سب سے بڑا کھیل اعزاز ہے، اور 2017 میں 45 برس کی عمر میں واپسی کر کے وہ اے ٹی پی درجہ بندی رکھنے والے سب سے عمر رسیدہ کھلاڑی بن گئے۔"
  es: "Ex tenista profesional y entrenador marroquí, nacido en Rabat en 1971. Se convirtió en profesional en 1990, ganó cinco títulos individuales del ATP Tour, alcanzó el puesto número 14 del ranking mundial en marzo de 2003, el más alto de su carrera, y disputó los cuartos de final del Abierto de Australia de 2003 contra Andy Roddick, cuyo quinto set terminó 21-19. El rey Mohammed VI le otorgó la medalla de oro, el máximo galardón deportivo de Marruecos, los lectores de L'Economiste lo eligieron como su modelo a seguir favorito en una encuesta de 2003, y un breve regreso en 2017 lo convirtió, a los 45 años, en el jugador de mayor edad en ostentar un puesto en el ranking ATP."
  fr: "Ancien joueur et entraîneur de tennis professionnel marocain, né à Rabat en 1971. Passé professionnel en 1990, il remporte cinq titres ATP en simple, atteint le 14e rang mondial en mars 2003 et dispute le quart de finale de l'Open d'Australie 2003 contre Andy Roddick, dont le cinquième set se termine sur un score de 21-19. Le roi Mohammed VI lui remet la médaille d'or, la plus haute distinction sportive du Maroc, les lecteurs de L'Économiste le désignent comme leur modèle préféré lors d'un sondage en 2003, et un bref retour en 2017 fait de lui, à 45 ans, le joueur le plus âgé à avoir jamais figuré au classement ATP."
  tr: "1971'de Rabat'ta doğan eski bir Faslı tenisçi ve antrenör olan Roddick, 1990'da profesyonel oldu ve ATP turnuvalarında beş tekler şampiyonluğu kazandı. En yüksek derecesi Mart 2003'te dünya sıralamasında on dördüncü oldu. 2003 Avustralya Açık'ta beş setlik maraton maçında mücadele etti; Andy Roddick beşinci sette 21–19 kaybetti. Kral Muhammed VI ona Fas'ın en yüksek spor onuru olan altın madalyayı verdi. 2003 yılında L'Economiste gazetesinin okuyucuları onu toplumun favori rol modeli olarak seçti. 2017'de kırk beş yaşında tekrar oynamaya döndü ve dernek tarihinin en yüksek sıralamalı oyuncusu oldu."
  id: "Mantan pemain dan pelatih tenis Maroko, lahir di Rabat pada tahun 1971, ia menjadi profesional pada tahun 1990 dan memenangkan lima gelar tunggal di turnamen ATP. Peringkat tertingginya adalah peringkat keempat belas dunia pada Maret 2003. Ia berkompetisi dalam pertandingan maraton lima set di Australian Open 2003, di mana Andy Roddick kalah di set kelima 21–19. Raja Mohammed VI memberinya medali emas, penghargaan olahraga tertinggi Maroko. Pada tahun 2003, pembaca surat kabar L'Economiste memilihnya sebagai panutan favorit masyarakat. Ia kembali bermain pada tahun 2017 pada usia empat puluh lima tahun, menjadi pemain dengan peringkat tertinggi dalam sejarah asosiasi tersebut."
