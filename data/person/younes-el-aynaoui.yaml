summary:
  ar: "لاعب كرة مضرب مغربي سابق ومدرب، وُلد في الرباط سنة 1971، احترف سنة 1990 وفاز بخمسة ألقاب فردية في بطولات رابطة المحترفين، وبلغ أعلى تصنيف له الرابع عشر عالميا في مارس 2003، وخاض في بطولة أستراليا المفتوحة 2003 مباراة ماراثونية من خمس مجموعات أمام أندي روديك انتهت مجموعتها الخامسة 21–19، ومنحه الملك محمد السادس الميدالية الذهبية، أعلى وسام رياضي في المغرب، واختاره قراء صحيفة ليكونوميست سنة 2003 نموذجا مفضلا للمجتمع، وعاد للعب سنة 2017 في سن الخامسة والأربعين فصار أكبر لاعب يحمل تصنيفا في تاريخ الرابطة."
  en: "Moroccan former professional tennis player and coach, born in Rabat in 1971. He turned professional in 1990, won five ATP Tour singles titles, reached a career-high singles ranking of world No. 14 in March 2003, and played the 2003 Australian Open quarter-final against Andy Roddick whose fifth set ran to 21–19. King Mohammed VI awarded him the gold medal, Morocco's highest sporting honour, readers of L'Economiste named him their favourite role model in a 2003 poll, and a brief comeback in 2017 made him, at 45, the oldest player ever to hold an ATP ranking."
  ur: "مراکش کے سابق پیشہ ور ٹینس کھلاڑی اور کوچ، جو 1971 میں رباط میں پیدا ہوئے۔ انھوں نے 1990 میں پیشہ ورانہ کھیل شروع کیا، اے ٹی پی ٹور کے پانچ سنگلز خطاب جیتے، مارچ 2003 میں اپنے کیریئر کی بلند ترین درجہ بندی عالمی نمبر 14 تک پہنچے، اور 2003 کے آسٹریلین اوپن کوارٹر فائنل میں اینڈی روڈک کے خلاف پانچ سیٹوں کی طویل میراتھن کھیلی جس کا پانچواں سیٹ 21–19 پر ختم ہوا۔ شاہ محمد ششم نے انھیں طلائی تمغہ دیا، جو مراکش کا سب سے بڑا کھیل اعزاز ہے، اور 2017 میں 45 برس کی عمر میں واپسی کر کے وہ اے ٹی پی درجہ بندی رکھنے والے سب سے عمر رسیدہ کھلاڑی بن گئے۔"
