label: { ar: "دينار", en: "Dinar", es: "Dinar", fr: "Dinar", ur: "دینار" }
summary:
  ar: "دهقان نهاوند؛ عند البلاذري استسأم لسماك بن عبيد العبسي بعد أن قتل ثمانية من أصحابه فقال اذهب إلى أميركم حتى أصالحه عن هذه الأرض وأؤدي الجزية فصالحه حذيفة على الخراج والجزية وأمن أهل مدينته فسميت نهاوند ماه دينار وكان يأتي سماكاً ويهدي ويبره."
  en: "Nihawand's dihqan; in al-Baladhuri, spared by Simak ibn Ubayd after his eight companions fell, he asked to treat with the commander — paying kharaj and jizya for his city's security — whence Nihawand was called Mah Dinar; he would visit Simak thereafter bearing gifts."
  es: "El dihqan de Nihawand; en al-Baladhuri, perdonado por Simak ibn Ubayd después de que cayeran sus ocho compañeros, pidió negociar con el comandante —pagando kharaj y jizya por la seguridad de su ciudad— de donde Nihawand fue llamado Mah Dinar; posteriormente visitaba a Simak llevando regalos."
  fr: "Le dihqan de Nihawand; à al-Baladhuri, épargné par Simak ibn Ubayd après la chute de ses huit compagnons, il demanda à traiter avec le commandant — payant le kharaj et la jizya pour la sécurité de sa ville — d'où Nihawand fut appelé Mah Dinar; il rendit visite à Simak par la suite en apportant des cadeaux."
  ur: "نہاوند کا دہقان; البلادھوری میں، سماک بن عبید نے اپنے آٹھ ساتھیوں کے گرنے کے بعد، اس نے کمانڈر کے ساتھ سلوک کرنے کو کہا - اپنے شہر کی حفاظت کے لیے خوارج اور جزیہ ادا کرنا - جس سے نہاوند کو مہ دینار کہا جاتا تھا۔ اس کے بعد وہ تحائف لے کر سمک کا دورہ کریں گے۔"
  tr: "Nahavand'ın Dehqanı; el-Baladhuri'ye göre, sekiz arkadaşını öldürdükten sonra Samak ibn Ubayd el-Absi'ye sığındı. Dedi ki, 'Prensinize gidin, bu topraklar üzerinde onunla barış yapın ve cizye ödeyin.' Hudhayfah vergi ve cizye için onunla barıştı, şehrinin halkını güvence altına aldı, böylece Nahavand Mah Dinar olarak adlandırıldı. Samakan'a gelir, hediyeler verir ve ona saygı gösterirdi."
  id: "Dehqan Nahavand; menurut al-Baladhuri, ia mencari perlindungan kepada Samak ibn Ubayd al-Absi setelah membunuh delapan sahabatnya. Ia berkata, 'Pergilah kepada pangeranmu untuk berdamai atas tanah ini dan bayar jizya.' Hudhayfah berdamai dengannya untuk pajak dan jizya, dan ia mengamankan rakyat kotanya, sehingga Nahavand dinamai Mah Dinar. Ia biasa datang ke Samakan, memberi hadiah, dan menghormatinya."
