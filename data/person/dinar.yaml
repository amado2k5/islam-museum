summary:
  ar: "دهقان نهاوند؛ عند البلاذري استسأم لسماك بن عبيد العبسي بعد أن قتل ثمانية من أصحابه فقال اذهب إلى أميركم حتى أصالحه عن هذه الأرض وأؤدي الجزية فصالحه حذيفة على الخراج والجزية وأمن أهل مدينته فسميت نهاوند ماه دينار وكان يأتي سماكاً ويهدي ويبره."
  en: "Nihawand's dihqan; in al-Baladhuri, spared by Simak ibn Ubayd after his eight companions fell, he asked to treat with the commander — paying kharaj and jizya for his city's security — whence Nihawand was called Mah Dinar; he would visit Simak thereafter bearing gifts."
