summary:
  ar: "داعية وكاتبة إندونيسية، وُلدت في إندرامايو سنة 1979، درست في معاهد إندونيسيا ثم في دار الزهراء بتريم في حضرموت، وتدرّس في مجالس العلم النسائية في جاكرتا وخارجها، وتشتهر بعدم إظهار وجهها على الكاميرا وبكتبها في الأخلاق والسيرة."
  en: "Indonesian preacher and writer, born in Indramayu in 1979. She studied in Indonesian pesantren and then at Daruz Zahro in Tarim, Hadhramaut, teaches in women's study assemblies in Jakarta and beyond, and is known for never showing her face on camera and for her books on character and the Prophet's biography."
  ur: "انڈونیشیائی مبلغہ اور مصنفہ، جو 1979 میں اندرامایو میں پیدا ہوئیں۔ انہوں نے انڈونیشیا کے مدارس اور پھر حضرموت کے تریم میں دار الزہراء میں تعلیم حاصل کی، جکارتہ اور دیگر شہروں میں خواتین کی مجالس میں تدریس کرتی ہیں، اور کیمرے پر چہرہ نہ دکھانے اور اخلاق و سیرت پر اپنی کتابوں سے معروف ہیں۔"
