summary:
  ar: "داعية وكاتبة إندونيسية، وُلدت في إندرامايو سنة 1979، درست في معاهد إندونيسيا ثم في دار الزهراء بتريم في حضرموت، وتدرّس في مجالس العلم النسائية في جاكرتا وخارجها، وتشتهر بعدم إظهار وجهها على الكاميرا وبكتبها في الأخلاق والسيرة."
  en: "Indonesian preacher and writer, born in Indramayu in 1979. She studied in Indonesian pesantren and then at Daruz Zahro in Tarim, Hadhramaut, teaches in women's study assemblies in Jakarta and beyond, and is known for never showing her face on camera and for her books on character and the Prophet's biography."
  ur: "انڈونیشیائی مبلغہ اور مصنفہ، جو 1979 میں اندرامایو میں پیدا ہوئیں۔ انہوں نے انڈونیشیا کے مدارس اور پھر حضرموت کے تریم میں دار الزہراء میں تعلیم حاصل کی، جکارتہ اور دیگر شہروں میں خواتین کی مجالس میں تدریس کرتی ہیں، اور کیمرے پر چہرہ نہ دکھانے اور اخلاق و سیرت پر اپنی کتابوں سے معروف ہیں۔"
  es: "Predicadora y escritora indonesia, nacida en Indramayu en 1979. Estudió en un pesantren indonesio y luego en Daruz Zahro en Tarim, Hadhramaut, imparte clases en grupos de estudio para mujeres en Yakarta y otras ciudades, y es conocida por nunca mostrar su rostro ante las cámaras y por sus libros sobre el carácter y la biografía del Profeta."
  fr: "Prédicatrice et écrivaine indonésienne, née à Indramayu en 1979. Elle a étudié dans un pesantren indonésien puis à Daruz Zahro à Tarim, dans le Hadramaout, enseigne dans des assemblées d'études pour femmes à Jakarta et ailleurs, et est connue pour ne jamais montrer son visage à la caméra et pour ses livres sur le caractère et la biographie du Prophète."
  tr: "1979'da Indramayo'da doğan Endonezyalı vaiz ve yazar, Endonezya enstitülerinde ve ardından Hadhramaut'taki Tarim'deki Dar Al-Zahraa'da eğitim gördü. Jakarta ve ötesinde kadın bilim konseylerinde ders vermekte, kamerada yüzünü göstermemesi ve etik ile biyografi üzerine kitaplarıyla tanınmaktadır."
  id: "Seorang pengkhotbah dan penulis Indonesia, lahir di Indramayo pada tahun 1979, belajar di institusi Indonesia dan kemudian di Dar Al-Zahraa di Tarim, Hadhramaut. Ia mengajar di dewan ilmiah perempuan di Jakarta dan sekitarnya, dan dikenal karena tidak pernah menampilkan wajahnya di kamera serta bukunya tentang etika dan biografi."
