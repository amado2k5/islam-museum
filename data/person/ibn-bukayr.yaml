id: person/ibn-bukayr
class: person
label: { ar: "أبو عبد الله الحسين بن أحمد بن بكير الصيرفي" }
summary:
  ar: "الحسين بن أحمد بن عبد الله بن عبد الرحمن بن بكير أبو عبد الله الصيرفي، ولد سنة سبع وعشرين وثلاثمائة، وسمع إسماعيل الصفار وأبا عمر وابن السماك والنجاد والخلدي وأبا بكر الشافعي، وروى عنه ابن شاهين والأزهري والتنوخي وكتب عنه الدارقطني. قال الأزهري كنت أحضر عنده وبين يديه أجزاء كبار فيقول أيكما أحب إليك تذكر لي متن ما تريد من هذه الأحاديث حتى أخبرك بإسناده أو تذكر لي إسناده حتى أخبرك بمتنه فكنت أذكر له المتون فيخبرني بالأسانيد من حفظه. وتكلم فيه ابن أبي الفوارس بأنه كان يتساهل في الحديث. توفي في ربيع الآخر سنة ثمان وثمانين {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
  tr: "327 Hicri doğumlu El-Hüseyin bin Ahmed bin Abdullah ibn Abdülrehman ibn Bukayr Ebu Abdullah el-Sirafi, İsmail'i Saffar, Ebu Ömer, İbn el-Sammak, el-Neced, el-Haldi ve Ebu Bekir el-Şafi'i'den duymuştur. İbn Şahin, el-Azhari, el-Tanukhi ondan rivayet etti, el-Daraqutni de ondan yazdı. El-Azhari şöyle dedi: Ben büyük toplantılara katılırdım elinde ciltler varken, 'Hanginiz sizin için en değerli? Bana bu hadislerin metnini söyle ki zincirini anlatayım, ya da zincirini anla da ben de sana metnini anlatayım.' Ben ona metinleri anlatırdım, o da ezberlediği zincirleri bana anlatırdı. İbn Ebi el-Fawaris onun rivayetinde hoşgörülü olduğunu söylemiştir. Seksen sekizinci yılda Rabi'al-Thani'de öldü {atıf:Muntazam-ibn-al-jawzi J.. 7 s.206-207}."
  id: "Al-Husayn ibn Ahmad ibn Abdullah ibn Abd al-Rahman ibn Bukayr Abu Abdullah al-Sirafi, lahir pada tahun 327 H, mendengar dari Isma'il al-Saffar, Abu Umar, Ibn al-Sammak, al-Najad, al-Khaldi, dan Abu Bakr al-Shafi'i. Ibn Shaheen, al-Azhari, al-Tanukhi menceritakan darinya, dan al-Daraqutni menulis darinya. Al-Azhari berkata: Saya menggunakan untuk menghadiri buku-buku besar dengan dia di tangannya, dan dia akan berkata, 'Siapa di antara kalian yang paling berharga bagimu? Sebutkan kepada saya teks hadits ini agar saya bisa memberitahu kalian tentang rantainya, atau sebutkan rantainya agar saya bisa memberitahu kalian tentang teksnya.' Saya akan menyebutkan teks-teks itu kepadanya dan dia akan memberitahu saya tentang rantai itu dari hafalannya. Ibn Abi al-Fawaris berbicara tentang dia bahwa dia berlembut dalam riwayat. Dia meninggal di Rabi' al-Thani pada tahun delapan puluh delapan {cite:Muntazam-ibn-al-jawzi J.7 hlm.206-207}."
