label: { ar: "أبو عبد الله الحسين بن أحمد بن بكير الصيرفي" }
summary:
  ar: "الحسين بن أحمد بن عبد الله بن عبد الرحمن بن بكير أبو عبد الله الصيرفي، ولد سنة سبع وعشرين وثلاثمائة، وسمع إسماعيل الصفار وأبا عمر وابن السماك والنجاد والخلدي وأبا بكر الشافعي، وروى عنه ابن شاهين والأزهري والتنوخي وكتب عنه الدارقطني. قال الأزهري كنت أحضر عنده وبين يديه أجزاء كبار فيقول أيكما أحب إليك تذكر لي متن ما تريد من هذه الأحاديث حتى أخبرك بإسناده أو تذكر لي إسناده حتى أخبرك بمتنه فكنت أذكر له المتون فيخبرني بالأسانيد من حفظه. وتكلم فيه ابن أبي الفوارس بأنه كان يتساهل في الحديث. توفي في ربيع الآخر سنة ثمان وثمانين {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
