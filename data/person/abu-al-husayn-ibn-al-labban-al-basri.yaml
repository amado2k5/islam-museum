  ar: "أبو الحسين ابن اللبان الفرضي البصري، كان إماماً في الفقه والفرائض، صنّف فيها كتباً كثيرة ليس لأحد مثلها، وعنه أخذ الناس الفرائض {cite:tabaqat-fuqaha-abbas-1981 p. 63}. لم يذكر الشيرازي وفاته."
  en: "Abu al-Husayn Ibn al-Labban al-Fardi al-Basri was an imam in jurisprudence and inheritance. He wrote many books on them, the like of which no one else had produced, and people took the science of inheritance from him {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Shirazi does not mention his death."
