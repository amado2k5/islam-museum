summary:
  ar: "أبو الحسين ابن اللبان الفرضي البصري، كان إماماً في الفقه والفرائض، صنّف فيها كتباً كثيرة ليس لأحد مثلها، وعنه أخذ الناس الفرائض {cite:tabaqat-fuqaha-abbas-1981 p. 63}. لم يذكر الشيرازي وفاته."
  en: "Abu al-Husayn Ibn al-Labban al-Fardi al-Basri was an imam in jurisprudence and inheritance. He wrote many books on them, the like of which no one else had produced, and people took the science of inheritance from him {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Shirazi does not mention his death."
  fr: "Abu al-Husayn Ibn al-Labban al-Fardi al-Basri était un imam en droit et en successions. Il écrivit sur ces sujets de nombreux livres, tels que nul autre n'en avait produit, et les gens reçurent de lui la science des successions {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Shirazi ne mentionne pas sa mort."
  es: "Abu al-Husayn Ibn al-Labban al-Fardi al-Basri fue un imán experto en jurisprudencia y herencia. Escribió numerosos libros sobre estos temas, sin parangón entre otros, y de él se aprendió la ciencia de la herencia {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Shirazi no menciona su fallecimiento."
  ur: "ابو الحسین ابن اللبن الفاردی البصری فقہ اور وراثت کے امام تھے۔ اس نے ان پر بہت سی کتابیں لکھیں، جو کسی اور نے نہیں لکھیں، اور لوگوں نے ان سے علم وراثت حاصل کیا۔ 63}۔ الشیرازی نے ان کی موت کا ذکر نہیں کیا۔"
