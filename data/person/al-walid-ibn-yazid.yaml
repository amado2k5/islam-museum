summary:
  ar: "الخليفة الأموي الحادي عشر، ولي سنة ست وعشرين ومئة بعد هشام بعهد منه، ورد في مسند أحمد حديث ليكنن في هذه الأمة رجل يقال له الوليد لهو أشد على هذه الأمة من فرعون لقومه، ووصفه ابن فضل الله في المسالك بالجبار العنيد وذكر أنه رشق المصحف بالسهام وفسق، وثب عليه ابن عمه يزيد بن الوليد فقتله وتملك فكانت خلافته ستة أشهر ناقصة وكان عمره خمساً وثلاثين وقيل ستاً وأربعين {cite:tarikh-khulafa-minhaj-1434 p. 407-408,637}. وعند المسعودي بويع يوم توفي هشام لست خلون من ربيع الآخر سنة خمس وعشرين ومائة وقتل بالبخراء من قرى دمشق يوم الخميس لليلتين بقيتا من جمادى الآخرة سنة ست وعشرين ومائة فكانت ولايته سنة وشهرين واثنين وعشرين يوماً وهو ابن أربعين سنة، وكان أول من حمل المغنين من البلدان إليه وجالس الملهين وأظهر الشراب والملاهي واتخذ القيان ويدعى خليع بني مروان، وأمه أم الحجاج بنت محمد بن يوسف الثقفية، وقيل إنه نصب المصحف غرضاً للنشاب وهو يقول أتوعد كل جبار عنيد فهأنذا جبار عنيد، وذكر المبرد أنه ألحد في شعر ذكر فيه النبي كذب أخزاه الله {cite:muruj-al-dhahab p. 200-204}"
  en: "The eleventh Umayyad caliph, who succeeded Hisham in 126 by his designation; Ahmad's Musnad carries the hadith that a man called al-Walid would be harder on this umma than Pharaoh on his people, and Ibn Fadlallah in al-Masalik calls him the obstinate tyrant who shot the Mushaf with arrows. His cousin Yazid ibn al-Walid rose against him, killed him and took power, his caliphate lasting six months less a fraction at age thirty-five, or forty-six {cite:tarikh-khulafa-minhaj-1434 p. 407-408,637}."
  fr: "Le onzième calife omeyyade, qui a succédé à Hisham en 126 par sa désignation ; Musnad d'Ahmad porte le hadith qu'un homme appelé al-Walid serait plus dur sur cette oumma que Pharaon sur son peuple, et Ibn Fadlallah dans al-Masalik l'appelle le tyran obstiné qui a tiré sur le Mushaf avec des flèches. Son cousin Yazid ibn al-Walid s'est levé contre lui, l'a tué et a pris le pouvoir, son califat durant six mois moins une fraction à l'âge de trente-cinq ans, ou quarante-six {cite:tarikh-khulafa-minhaj-1434 p. 407-408,637}."
  es: "El undécimo califa omeya, que sucedió a Hisham en 126 por designación; el Musnad de Ahmad contiene el hadiz de que un hombre llamado al-Walid sería más duro con esta umma que el faraón con su pueblo, e Ibn Fadlallah en al-Masalik lo llama el tirano obstinado que disparó flechas contra el Mushaf. Su primo Yazid ibn al-Walid se alzó contra él, lo mató y tomó el poder, su califato duró seis meses menos una fracción a los treinta y cinco o cuarenta y seis años {cite:tarikh-khulafa-minhaj-1434 p. 407-408,637}."
  ur: "گیارہواں اموی خلیفہ، جو 126 میں ہشام کے بعد اپنے عہدہ پر فائز ہوا۔ احمد کی مسند میں یہ حدیث ہے کہ الولید نامی شخص اس امت پر فرعون سے اپنی قوم پر زیادہ سخت ہو گا اور ابن فضل اللہ نے المسالک میں اسے وہ ظالم ظالم کہا ہے جس نے مصحف کو تیر مارا تھا۔ اس کا چچا زاد بھائی یزید بن الولید اس کے خلاف کھڑا ہوا، اسے قتل کر کے اقتدار پر قبضہ کر لیا، اس کی خلافت پینتیس یا چھیالیس سال کی عمر میں چھ ماہ کم رہی۔ 407-408,637}۔"
  tr: "On birinci Emevi halifesi, Hişam'dan sonra 126 Hicri yılında, hükümdarlığı sırasında hüküm sürmüştür. Musnad Ahmad'da, bu ülkede Firavundan daha sert davranan El-Velid adında bir adamın halkı için daha sert davrandığını belirten bir hadis vardır. İbn Fadlallah onu El-Masalik'te inatçı bir zorba olarak tanımlamış, Kur'an'a ok attığını ve ahlaksızlık yaptığını belirtmiştir. Kuzeni Yezid bin el-Velid üzerine atladı, öldürdü ve iktidarı ele geçirdi, böylece halifeliği altı ay kısaltıldı. Otuz beş yaşındaydı ve bazıları kırk altı der {atıf:Tarikh-Kulafa-minhaj-1434, s. 407-408,637}. El-Mes'udi'ye göre, Hişam öldüğü gün, Rabi'l-Akhir'den altı ay önce, yüz yirmi beşinci yılda, Şam köylerinden Perşembe günü Şam köylerinden el-Buhara'da yüz yirmi altı yılın kalan iki gecesi için itaat yemini etti ve öldürüldü. Görev süresi kırk yaşında bir yıl, iki ay ve yirmi iki gün sürdü. Topraklardan şarkıcıları kendisine getiren ilk kişi oldu, müzisyenlerle birlikte oturdu, İçki ve eğlence gösterdi, toplanmanın yerini aldı ve Banu Mervan'ın 'Halisi' olarak anıldı. Annesi Ümmü'l-Haccac bint Muhammed bin Yusuf el-Tekafiyye'ydi. Kur'an'ı bir yay aracı olarak kurduğu söylenir; şöyle demiştir: 'Her inatçı zorbamı tehdit ederim, çünkü işte inatçı bir zorbadır.' El Mubarrad, Peygamber'in yalan olarak adlandırıldığı bir şiir yazdığını belirtti: 'Allah onu rezil etsin.' {alıntı:Muruj-al-Dhahab, s. 200-204}"
  id: "Khalifah Umayyah kesebelas, yang memerintah pada tahun 126 H setelah Hisham selama pemerintahannya. Dalam Musnad Ahmad, terdapat hadits yang menyatakan bahwa di negara ini ada seorang pria bernama Al-Walid yang lebih keras kepada bangsa ini daripada Firaun untuk rakyatnya. Ibn Fadlallah menggambarkannya dalam Al-Masalik sebagai tiran yang keras kepala, menyebutkan bahwa dia menembakkan panah ke Al-Qur'an dan melakukan tindakan tidak bermoral. Sepupunya Yazid ibn al-Walid melompat ke arahnya, membunuhnya, dan mengambil alih, sehingga masa khalifahnya dipersingkat enam bulan. Usianya tiga puluh lima tahun, dan beberapa mengatakan empat puluh enam {cite:Tarikh-Kulafa-minhaj-1434, hlm. 407-408,637}. Menurut al-Mas'udi, pada hari kematian Hisham, enam bulan sebelum Rabi' al-Akhir pada tahun seratus dua puluh lima, ia disumpah setia dan dibunuh di al-Bukhara dari desa-desa Damaskus pada hari Kamis selama dua malam tersisa Jumada al-Akhirah pada tahun seratus dua puluh enam. Masa jabatannya berlangsung satu tahun, dua bulan, dan dua puluh dua hari pada usia empat puluh tahun. Ia adalah yang pertama membawa penyanyi dari negeri itu kepadanya, duduk bersama para musisi yang dipamerkan minuman dan hiburan, lalu menggantikan pertemuan, dan disebut 'Khali' Banu Marwan. Ibunya adalah um al-Hajjaj bint Muhammad ibn Yusuf al-Thaqafiyyah. Konon ia mendirikan Al-Qur'an sebagai alat untuk memanahkan busur silang, berkata, 'Aku mengancam setiap tiran keras kepala, karena di sini ada tiran yang keras kepala.' Al-Mubarrad menyebutkan bahwa ia pernah menulis puisi di mana Nabi disebut sebagai kebohongan, 'Semoga Allah mempermalukan dia.' {cite:Muruj-al-Dhahab, hlm. 200-204}"
