label: { ar: "الوليد بن يزيد بن عبد الملك", en: "al-Walid ibn Yazid ibn Abd al-Malik" }
summary:
  ar: "الخليفة الأموي الحادي عشر، ولي سنة ست وعشرين ومئة بعد هشام بعهد منه، ورد في مسند أحمد حديث ليكنن في هذه الأمة رجل يقال له الوليد لهو أشد على هذه الأمة من فرعون لقومه، ووصفه ابن فضل الله في المسالك بالجبار العنيد وذكر أنه رشق المصحف بالسهام وفسق، وثب عليه ابن عمه يزيد بن الوليد فقتله وتملك فكانت خلافته ستة أشهر ناقصة وكان عمره خمساً وثلاثين وقيل ستاً وأربعين {cite:tarikh-khulafa-minhaj-1434 p. 407-408,637}. وعند المسعودي بويع يوم توفي هشام لست خلون من ربيع الآخر سنة خمس وعشرين ومائة وقتل بالبخراء من قرى دمشق يوم الخميس لليلتين بقيتا من جمادى الآخرة سنة ست وعشرين ومائة فكانت ولايته سنة وشهرين واثنين وعشرين يوماً وهو ابن أربعين سنة، وكان أول من حمل المغنين من البلدان إليه وجالس الملهين وأظهر الشراب والملاهي واتخذ القيان ويدعى خليع بني مروان، وأمه أم الحجاج بنت محمد بن يوسف الثقفية، وقيل إنه نصب المصحف غرضاً للنشاب وهو يقول أتوعد كل جبار عنيد فهأنذا جبار عنيد، وذكر المبرد أنه ألحد في شعر ذكر فيه النبي كذب أخزاه الله {cite:muruj-al-dhahab p. 200-204}"
  en: "The eleventh Umayyad caliph, who succeeded Hisham in 126 by his designation; Ahmad's Musnad carries the hadith that a man called al-Walid would be harder on this umma than Pharaoh on his people, and Ibn Fadlallah in al-Masalik calls him the obstinate tyrant who shot the Mushaf with arrows. His cousin Yazid ibn al-Walid rose against him, killed him and took power, his caliphate lasting six months less a fraction at age thirty-five, or forty-six {cite:tarikh-khulafa-minhaj-1434 p. 407-408,637}."
