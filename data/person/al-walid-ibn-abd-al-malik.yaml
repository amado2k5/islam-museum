label: { ar: "الوليد بن عبد الملك", en: "al-Walid ibn Abd al-Malik" }
summary:
  ar: "خليفة أموي، توفي في النصف من جمادى الآخرة سنة ست وتسعين {cite:tabari-tarikh-abu-al-fadl j.6 p.495}، وذكر الطبري في سيرته بناء المساجد، وفي عهده فتح موسى بن نصير الأندلس وفتح قتيبة كاشغر {cite:tabari-tarikh-abu-al-fadl j.6 p.496}. وعند المسعودي حكى لروح بن زنباع خبر المرزبان نديم سابور بن سابور الذي تعلم نباح الكلاب وعواء الذئاب ونهيق الحمير حتى ضحك به الملك ورده إلى مرتبته، ليحتال روح بمثله لرد ود عبد الملك {cite:muruj-al-dhahab p. 114}، وبويع بدمشق يوم توفي عبد الملك للنصف من جمادى الآخرة سنة ست وثمانين وكانت ولايته تسع سنين وثمانية أشهر وليلتين وهلك وهو ابن ثلاث وأربعين سنة ويكنى أبا العباس وكان نقش خاتمه يا وليد إنك ميت، وابتدأ سنة سبع وثمانين ببناء المسجد الجامع بدمشق ومسجد الرسول بالمدينة وكان المتولي للنفقة عمر بن عبد العزيز، ولما سمع صوت ناقوس من البيعة أمر بهدمها فكتب إليه الأخرم ملك الروم إن هذه البيعة قد أقرها من كان قبلك فإن يكونوا أصابوا فقد أخطأت وإن تكن أصبت فقد أخطأوا فأجابه الفرزدق بالآية في داود وسليمان، وكتب إلى أخيه سليمان يعتب عليه تمني موته فاعتذر سليمان فقبل عذره {cite:muruj-al-dhahab p. 148-157} ويذكر الكتاب أنه كان مهتماً بالبناء والعمران حتى لُقب مهندس بني أمية، وأنه أدخل حجرات أمهات المؤمنين في المسجد النبوي عند توسعته، فاعترض عليه عدد من الفقهاء بالمدينة. {cite:salabi-umayyad-state-2020 p.129-130} ويذكر الكتاب أنه أسس أول مستشفى خاص بالمجذومين في دمشق سنة 88هـ، وأمر بتعبيد الطرق المؤدية إلى الحجاز، وأن ديوان المستغلات ظهر في عهده، وأنه توفي في جمادى الآخرة سنة 96هـ، واختلف في مدة خلافته، فاختار الكتاب قول الزهري: عشر سنين إلا شهراً. {cite:salabi-umayyad-state-2020 p.132-141} ويذكر الكتاب أن الوليد أراد خلع سليمان والبيعة لابنه عبد العزيز، فنصحه عمر بن عبد العزيز بأن البيعة عقدة واحدة، فغضب الوليد وأغلق عليه الباب حتى تدخلت أم البنين. كما نقل الكتاب موقف عمر من قتل الحروري الذي بعث به الحجاج، وأنكر عمر قتله دون ذنب ثابت. {cite:salabi-umayyad-state-2020 p.177-180}"
  en: "Umayyad caliph; he died in the middle of Jumada II, in the year 96 {cite:tabari-tarikh-abu-al-fadl j.6 p.495}. al-Tabari mentions in his account the building of mosques, and in his reign Musa ibn Nusayr conquered al-Andalus and Qutayba conquered Kashgar {cite:tabari-tarikh-abu-al-fadl j.6 p.496}. In al-Mas'udi, he told Rawh ibn Zinba' the story of al-Marzuban, the boon-companion of Sabur ibn Sabur, who learned the barking of dogs, the howling of wolves and the braying of donkeys until the king laughed at him and restored him to his rank, so that Rawh might by a similar ruse win back Abd al-Malik's goodwill {cite:muruj-al-dhahab p. 114}. He was acclaimed at Damascus on the day Abd al-Malik died, in the middle of Jumada II of the year 86; his reign lasted nine years, eight months and two nights, and he died aged forty-three. He was called Abu al-Abbas, and his seal read: 'O Walid, you are mortal.' In the year 87 he began the Great Mosque of Damascus and the Mosque of the Messenger in Medina, with Umar ibn Abd al-Aziz in charge of the expenses. When he heard the sound of a church bell he ordered it demolished; al-Akhram, king of the Romans, wrote to him that the church had been approved by those before him: 'if they were right, you were wrong, and if you were right, they were wrong'; al-Farazdaq answered him with the verse about David and Solomon. He wrote to his brother Sulayman reproaching him for wishing for his death; Sulayman apologised and his apology was accepted {cite:muruj-al-dhahab p. 148-157}. The book notes that he was so devoted to building and urban works that he was called 'the engineer of the Umayyads', and that when enlarging the Prophet's Mosque he brought the chambers of the Mothers of the Believers into it, to which a number of Medinan jurists objected. {cite:salabi-umayyad-state-2020 p.129-130} The book notes that he founded the first hospital for lepers in Damascus in 88 AH, ordered the roads leading to the Hijaz to be paved, and that the diwan of estate revenues (diwan al-mustaghallat) appeared in his time; that he died in Jumada II 96 AH; and that the length of his reign is disputed, the book choosing the view of al-Zuhri: ten years less a month. {cite:salabi-umayyad-state-2020 p.132-141} The book relates that al-Walid wished to depose Sulayman and pledge allegiance to his son Abd al-Aziz; Umar ibn Abd al-Aziz advised him that allegiance is a single knot, so al-Walid grew angry and shut the door on him until Umm al-Banin intervened. The book also reports Umar's stance on the killing of a Haruri Kharijite whom al-Hajjaj had sent: Umar disapproved of killing him without proven guilt. {cite:salabi-umayyad-state-2020 p.177-180}"
