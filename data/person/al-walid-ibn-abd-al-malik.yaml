id: person/al-walid-ibn-abd-al-malik
education:
  did_you_know:
    ar: "الوليد بن عبد الملك الخليفة الأموي توفي سنة ٩٦هـ؛ يذكر الطبري في سيرته بناء المساجد، وفي عهده فتح موسى بن نصير الأندلس."
    en: "Al-Walid ibn Abd al-Malik, the Umayyad caliph who died in 96 AH — al-Tabari recalls the building of mosques in his record, and in his reign Musa ibn Nusayr opened al-Andalus."
    ur: "ولید بن عبدالملک، اموی خلیفہ 96ھ میں فوت ہوا — طبری نے اس کے دور میں مسجدوں کی تعمیر لکھی، اور اسی کے عہد میں موسی بن نصیر نے اندلس فتح کیا۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/tarikh-khulafa-minhaj-1434]
class: person
label: { ar: "الوليد بن عبد الملك", en: "al-Walid ibn Abd al-Malik" }
summary:
  ar: "خليفة أموي حكم من 86 إلى 96هـ/705 إلى 715م، وخلف أباه عبد الملك دون معارضة بعد وفاة عمه عبد العزيز بن مروان. وتصف دائرة المعارف الإسلامية عهده بأنه فترة سلم داخلي وتوسع خارجي شمل الأندلس وما وراء النهر والسند، وبأنه راع كبير للعمارة، إذ بُني الجامع الكبير بدمشق بصورته الحالية وأُعيد بناء مسجد النبي بالمدينة. وتتساءل المقالة عن مدى إسهامه الشخصي في ذلك، وترجح أن إنجازه الرئيس كان الحفاظ على التوازن بين فصائل الأسرة الحاكمة."
  en: "Umayyad caliph who ruled 86 to 96 AH/705 to 715 CE and succeeded his father Abd al-Malik without opposition after the death of his uncle Abd al-Aziz ibn Marwan. The Encyclopaedia of Islam describes his reign as a time of internal peace and outward expansion into al-Andalus, Transoxania and Sind, and him as a great patron of architecture, with the Great Mosque of Damascus given its present form and the Prophet's Mosque in Medina rebuilt. The article asks how far he contributed personally, and suggests his main achievement was preserving balance among the factions of the ruling family."
  ur: "اموی خلیفہ جنھوں نے 86 تا 96ھ/705 تا 715ء حکومت کی اور چچا عبدالعزیز بن مروان کی وفات کے بعد بلا مخالفت اپنے والد عبدالملک کے جانشین بنے۔ دائرۃ المعارف اسلامیہ ان کے عہد کو اندرونی امن اور اندلس، ماوراء النہر اور سندھ تک بیرونی توسیع کا دور بتاتا ہے، اور انھیں فن تعمیر کا بڑا سرپرست کہتا ہے، جس میں دمشق کی جامع مسجد کی موجودہ صورت اور مدینہ میں مسجد نبوی کی تعمیر نو شامل ہے۔ مقالہ سوال اٹھاتا ہے کہ خود ان کا حصہ کتنا تھا، اور تجویز کرتا ہے کہ ان کی بڑی کامیابی حکمران خاندان کے گروہوں میں توازن رکھنا تھی۔"
