id: person/al-walid-ibn-abd-al-malik
class: person
label: { ar: "الوليد بن عبد الملك" }
summary:
  ar: "خليفة أموي، توفي في النصف من جمادى الآخرة سنة ست وتسعين {cite:tabari-tarikh-abu-al-fadl j.6 p.495}، وذكر الطبري في سيرته بناء المساجد، وفي عهده فتح موسى بن نصير الأندلس وفتح قتيبة كاشغر {cite:tabari-tarikh-abu-al-fadl j.6 p.496}.، وعند المسعودي حكى لروح بن زنباع خبر المرزبان نديم سابور بن سابور الذي تعلم نباح الكلاب وعواء الذئاب ونهيق الحمير حتى ضحك به الملك ورده إلى مرتبته، ليحتال روح بمثله لرد ود عبد الملك {cite:muruj-al-dhahab p. 114}، وبويع بدمشق يوم توفي عبد الملك للنصف من جمادى الآخرة سنة ست وثمانين وكانت ولايته تسع سنين وثمانية أشهر وليلتين وهلك وهو ابن ثلاث وأربعين سنة ويكنى أبا العباس وكان نقش خاتمه يا وليد إنك ميت، وابتدأ سنة سبع وثمانين ببناء المسجد الجامع بدمشق ومسجد الرسول بالمدينة وكان المتولي للنفقة عمر بن عبد العزيز، ولما سمع صوت ناقوس من البيعة أمر بهدمها فكتب إليه الأخرم ملك الروم إن هذه البيعة قد أقرها من كان قبلك فإن يكونوا أصابوا فقد أخطأت وإن تكن أصبت فقد أخطأوا فأجابه الفرزدق بالآية في داود وسليمان، وكتب إلى أخيه سليمان يعتب عليه تمني موته فاعتذر سليمان فقبل عذره {cite:muruj-al-dhahab p. 148-157}"
