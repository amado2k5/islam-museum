  en: "Abu Sa'id al-Maqburi (Kaysan)"
roles: [scholar, narrator]
gender: male
summary:
  ar: "كيسان بن سعيد، أبو سعيد المقبري المدني، تابعي ثقة كثير الحديث، روى عن عمر وعلي وعبد الله بن سلام وأسامة بن زيد وأبي هريرة وأبي سعيد الخدري وعقبة بن عامر، وروى عنه ابنه سعيد وابن ابنه عبد الله بن سعيد وعبد الملك بن نوفل. ذكره ابن سعد في الطبقة الأولى من أهل المدينة، وقيل سمي بذلك لنزوله المقابر أو لولايته حفر القبور. توفي سنة 100هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  en: "Kaysan ibn Sa'id, Abu Sa'id al-Maqburi of Medina, a trustworthy Successor who narrated much hadith; he narrated from Umar, Ali, Abdallah ibn Salam, Usama ibn Zayd, Abu Hurayra, Abu Sa'id al-Khudri and Uqba ibn Amir, and was narrated from by his son Sa'id, his grandson Abdallah and Abd al-Malik ibn Nawfal. Ibn Sa'd places him in the first rank of Medinese; he died in 100 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
