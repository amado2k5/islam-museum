id: person/abu-said-al-maqburi
class: person
label:
  ar: "أبو سعيد المقبري"
  en: "Abu Sa'id al-Maqburi (Kaysan)"
  fr: "Abu Sa'id al-Maqburi (Kaysan)"
  es: "Abu Sa'id al-Maqburi (Kaysan)"
  ur: "ابو سعید المقبوری ⁦(کیسان)⁩"
roles: [scholar, narrator]
gender: male
summary:
  ar: "كيسان بن سعيد، أبو سعيد المقبري المدني، تابعي ثقة كثير الحديث، روى عن عمر وعلي وعبد الله بن سلام وأسامة بن زيد وأبي هريرة وأبي سعيد الخدري وعقبة بن عامر، وروى عنه ابنه سعيد وابن ابنه عبد الله بن سعيد وعبد الملك بن نوفل. ذكره ابن سعد في الطبقة الأولى من أهل المدينة، وقيل سمي بذلك لنزوله المقابر أو لولايته حفر القبور. توفي سنة 100هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  en: "Kaysan ibn Sa'id, Abu Sa'id al-Maqburi of Medina, a trustworthy Successor who narrated much hadith; he narrated from Umar, Ali, Abdallah ibn Salam, Usama ibn Zayd, Abu Hurayra, Abu Sa'id al-Khudri and Uqba ibn Amir, and was narrated from by his son Sa'id, his grandson Abdallah and Abd al-Malik ibn Nawfal. Ibn Sa'd places him in the first rank of Medinese; he died in 100 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  fr: "Kaysan ibn Sa'id, Abu Sa'id al-Maqburi de Médine, Successeur digne de confiance qui transmit de nombreux hadiths ; il rapporta d'Umar, Ali, Abdallah ibn Salam, Usama ibn Zayd, Abu Hurayra, Abu Sa'id al-Khudri et Uqba ibn Amir. Son fils Sa'id, son petit-fils Abdallah et Abd al-Malik ibn Nawfal transmirent de lui. Ibn Sa'd le place dans la première génération des Médinois ; il mourut en 100 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  es: "Kaysan ibn Sa'id, Abu Sa'id al-Maqburi de Medina, un sucesor de confianza que narró numerosos hadices; narró de Umar, Ali, Abdallah ibn Salam, Usama ibn Zayd, Abu Hurayra, Abu Sa'id al-Khudri y Uqba ibn Amir, y fue narrado por su hijo Sa'id, su nieto Abdallah y Abd al-Malik ibn Nawfal. Ibn Sa'd lo sitúa en la primera posición de los medinenses; falleció en el año 100 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  ur: "کیسان بن سعید، مدینہ کے ابو سعید المقبوری، ایک ثقہ جانشین جس نے بہت سی حدیثیں بیان کیں۔ انہوں نے عمر، علی، عبداللہ بن سلام، اسامہ بن زید، ابو ہریرہ، ابو سعید خدری اور عقبہ بن عامر سے روایت کی ہے اور ان کے بیٹے سعید، ان کے پوتے عبداللہ اور عبد الملک بن نوفل سے روایت کی ہے۔ ابن سعد نے اسے مدینہ کے پہلے درجے میں رکھا ہے۔ ان کی وفات 100 ہجری میں ہوئی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 9957}"
