summary:
  ar: "مصطفى بن عبد الله، المعروف بكاتب جلبي وحاجي خليفة (شباط 1609 – 6 تشرين الأول 1657)، موسوعي عثماني وُلد ومات في إسطنبول. خدم في كاتبية الجيش وشارك في حملات الأناضول وبغداد وهمدان وأروان، وحجّ سنة 1633، ثم تفرّغ للعلم بعد ميراث ناله سنة 1645 وجمع أكبر مكتبة في إسطنبول في عصره. أعظم أعماله «كشف الظنون عن أسامي الكتب والفنون»، معجم ببليوغرافي يضم نحو 15000 كتاب، و«جهان نما» في الجغرافيا، أول أعمال عثمانية تستعمل الأطالس الأوروبية."
  en: "Mustafa ibn Abdullah, known as Kâtip Çelebi and as Hajji Khalifa (February 1609 – 6 October 1657), was an Ottoman polymath born and deceased in Istanbul. He served as an army clerk on the Anatolian, Baghdad, Hamadan and Erivan campaigns, made the Hajj in 1633, and after an inheritance in 1645 devoted himself to scholarship and built the largest library in Istanbul of his day. His greatest work is the Kashf al-Zunun, a bibliographic dictionary of some 15,000 books, alongside the Cihannuma, the first Ottoman geography to use European atlases."
  ur: "مصطفیٰ بن عبد اللہ، معروف بہ کاتب چلبی اور حاجی خلیفہ (فروری 1609ء – 6 اکتوبر 1657ء)، استنبول میں پیدا ہونے اور وہیں وفات پانے والے عثمانی موسوعہ نگار تھے۔ فوجی کاتب کی حیثیت سے اناطولیہ، بغداد، ہمدان اور ایروان کی مہمات میں شریک ہوئے، 1633ء میں حج کیا، اور 1645ء میں وراثت ملنے پر خود کو علم کے لیے وقف کر کے اپنے عہد کی استنبول کی سب سے بڑی لائبریری قائم کی۔ ان کی عظیم ترین تصنیف «کشف الظنون» ہے، تقریباً 15,000 کتابوں کی ببلیوگرافی، اور «جہان نما» جغرافیے میں پہلی عثمانی کتاب ہے جس میں یورپی اطالس استعمال ہوئے۔"

