label: { ar: "السلطان الأشرف قايتباي" }
summary:
  ar: "سلطان مملوكي جركسي، قلده الخليفة المستنجد السلطنة ولقب الأشرف فاستقر له الملك وسار في المملكة بشهامة وصرامة ما سارها ملك قبله من عهد الناصر محمد بن قلاوون بحيث إنه سافر من مصر إلى الفرات في طائفة يسيرة جداً من الجند، ومن سيرته أنه لم يول بمصر صاحب وظيفة دينية كالقضاة والمشايخ والمدرسين إلا أصلح الموجودين لها بعد طول ترويه وتمهله بحيث استمر الوظيفة شاغرة الأشهر العديدة ولم يول قاضياً ولا شيخاً بمال قط، وفي سنة أربع وثمانين سافر إلى الحجاز برسم الحج وهو أمر لم يعهد لملك من أكثر من مئة سنة فبدأ بزيارة المدينة وفرق بها ستة آلاف دينار ثم قدم مكة وفرق بها خمسة آلاف دينار وقرر بمدرسته التي أنشأها بمكة شيخاً وصوفية {cite:tarikh-khulafa-minhaj-1434 p. 776-778}."
  en: "Circassian sultan invested by the caliph — ruling 'with a boldness no king had shown since al-Nasir Muhammad', marching Egypt-to-Euphrates with a small escort; he gave no religious office save to the fittest after long deliberation, posts lying vacant months rather than sold, and in 884 made the hajj no sultan had made for over a century, scattering 6,000 dinars at Medina and 5,000 at Mecca {cite:tarikh-khulafa-minhaj-1434 p. 776-778}."
