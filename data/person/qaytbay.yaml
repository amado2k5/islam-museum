id: person/qaytbay
class: person
label: { ar: "السلطان الأشرف قايتباي" }
summary:
  ar: "سلطان مملوكي جركسي، قلده الخليفة المستنجد السلطنة ولقب الأشرف فاستقر له الملك وسار في المملكة بشهامة وصرامة ما سارها ملك قبله من عهد الناصر محمد بن قلاوون بحيث إنه سافر من مصر إلى الفرات في طائفة يسيرة جداً من الجند، ومن سيرته أنه لم يول بمصر صاحب وظيفة دينية كالقضاة والمشايخ والمدرسين إلا أصلح الموجودين لها بعد طول ترويه وتمهله بحيث استمر الوظيفة شاغرة الأشهر العديدة ولم يول قاضياً ولا شيخاً بمال قط، وفي سنة أربع وثمانين سافر إلى الحجاز برسم الحج وهو أمر لم يعهد لملك من أكثر من مئة سنة فبدأ بزيارة المدينة وفرق بها ستة آلاف دينار ثم قدم مكة وفرق بها خمسة آلاف دينار وقرر بمدرسته التي أنشأها بمكة شيخاً وصوفية {cite:tarikh-khulafa-minhaj-1434 p. 776-778}. وفي شذرات الذهب أبو النصر قايتباي الملك الأشرف الجركسي الظاهري نسبة إلى الظاهر جقمق السادس عشر من ملوك الجراكسة ولد سنة ست وعشرين وثمان مئة فاتصل بالملك الظاهر فأعتقه ولم يزل يترقى إلى أن بويع له بالسلطنة يوم الاثنين سادس رجب سنة اثنتين وسبعين وثمان مئة ولم يكن له في زمنه منازع ولا مدافع وسار في الناس السيرة الحميدة واجتهد في بناء المشاعر العظام وكان مختاراً في الوظائف الدينية لا يولي إلا الأصلح بعد التروي والتفحص ووقع له في بناء المشاعر ما لم يقع لغيره من الملوك كعمارة مسجد الخيف بمنى وحفر بنمرة صهريجاً ذرعه عشرون ذراعاً وعمر بركة خليص وأجرى العين الطيبة إليها وأجرى عين عرفة بعد انقطاعها أزيد من قرن وعمر سقاية العباس وأصلح بئر زمزم والمقام وجهز سنة تسع وسبعين للمسجد متبراً عظيماً وكان يرسل للكعبة كسوة فائقة في كل سنة وأنشأ بجانب المسجد الحرام مدرسة عظيمة وبجانبها رباطاً ومكتباً للأيتام وأنشأ بالمدينة النبوية مدرسة بديعة بل بنى المسجد الشريف بعد الحريق وعمل ببيت المقدس مدرسة كبيرة وعمر حصناً بالإسكندرية وحصن ثغر دمياط وحصوناً برشيد ومرم الجامع الأموي بدمشق وعمر بغزة مدرسة وجامعاً بالصالحية وجامع الروضة وجامع الكبش وتربة بصحراء مصر وقبة الإمام وكان له في الشيخ عبد القادر الدشطوتي غاية الاعتقاد يتولى تربيته وإرشاده ونزل إليه يوماً والذباب منعكف عليه فقال له الشيخ يا قايتباي قل لهذا الذباب يذهب عني فحار وقال يا سيدي كيف يسمع الذباب مني فقال كيف تكون سلطاناً ولا يسمع الذباب منك ثم قال يا ذباب اذهب عني {cite:shadharat-dhahab p. 423-424}."
  en: "Circassian sultan invested by the caliph — ruling 'with a boldness no king had shown since al-Nasir Muhammad', marching Egypt-to-Euphrates with a small escort; he gave no religious office save to the fittest after long deliberation, posts lying vacant months rather than sold, and in 884 made the hajj no sultan had made for over a century, scattering 6,000 dinars at Medina and 5,000 at Mecca {cite:tarikh-khulafa-minhaj-1434 p. 776-778}."
  es: "Sultán circasiano investido por el califa, gobernando \"con una audacia que ningún rey había mostrado desde al-Nasir Muhammad\", marchando de Egipto al Éufrates con una pequeña escolta; no otorgó ningún cargo religioso salvo al más apto tras una larga deliberación, dejando los puestos vacantes durante meses en lugar de venderlos, y en 884 realizó el Hajj que ningún sultán había realizado en más de un siglo, esparciendo 6.000 dinares en Medina y 5.000 en La Meca {cite:tarikh-khulafa-minhaj-1434 p. 776-778}."
  fr: "Sultan circassien investi par le calife — régnant « avec une audace qu'aucun roi n'avait montrée depuis al-Nasir Muhammad », marchant d'Égypte à l'Euphrate avec une petite escorte; il ne donnait aucune charge religieuse qu'aux plus aptes après de longues délibérations, les postes restant vacants des mois plutôt que d'être vendus, et en 884, il fit le hajj qu'aucun sultan n'avait fait depuis plus d'un siècle, distribuant 6 000 dinars à Médine et 5 000 à La Mecque {cite:tarikh-khulafa-minhaj-1434 p. 776-778}."
  ur: "خلیفہ کی طرف سے سرمایہ کاری کی گئی سرکیسیئن سلطان - 'الناصر محمد کے بعد سے کسی بادشاہ نے ایسی دلیری کے ساتھ حکمرانی نہیں کی'، ایک چھوٹے محافظ کے ساتھ مصر سے فرات تک مارچ کیا۔ اس نے طویل غور و فکر کے بعد سوائے موزوں ترین کو کوئی دینی عہدہ نہیں دیا، اسامیاں مہینوں سے خالی پڑی تھیں بلکہ فروخت کی گئیں، اور 884 میں ایک صدی سے زائد عرصے سے کسی سلطان نے حج نہیں کیا تھا، مدینہ میں 6000 دینار اور مکہ میں 5000 دینار بکھرے تھے۔ 776-778}۔"
  tr: "Halife Al-Mustanjid tarafından sultanlık verilen ve ona Al-Ashraf unvanı verilen bir Çerkes Memlük sultanı. Krallığı kurdu ve Al-Nasir Muhammed bin Kalavun döneminde önceki bir kral gibi aynı cömertlik ve kararlılıkla yönetti. Mısır'dan Fırat'a çok küçük bir asker grubuyla seyahat etti. Biyografisinden, Mısır'da yargıç, şeyh veya öğretmen gibi dini bir görevli, ancak uzun bir bekleyişten sonra oradakileri düzeltmek ve sabır göstermek için atamadı, bu yüzden bu görev aylarca boş kaldı ve hiçbir zaman paralı bir hakim ya da şeyh atamadı. Seksen dördüncü yılda, yüz yıldan fazla bir süredir bir kralın görmediği bir hac için Hicaz'a gitti. Medine'yi ziyaret etmeye başladı ve altı bin dinar verdi, sonra Mekke'ye döndü, beş bin dinar verdi ve Mekke'de şeyh ve sufi olarak okulunu kurdu {cite::] Tarih-Khulafa-minhaj-1434 s. 776-778}. Şadharat el-Dhahab'da, Ebu el-Nasr Kaytbey, on altıncı Çerkes kralı el-Zahir Jaqmaq'ın adını taşıyan soylu Çerkes kral Zahir'dir. 826 Hicri yılında doğduğu için Kral el-Zahir ile bağlantı kurdu ve onu serbest bıraktı. Cumhurtesi, 6 Recep Pazartesi günü, 872 Hicri sultanlığa bağlılık yemini edene kadar yükselmeye devam etti. Zamanında rakip ya da savunucusu yoktu. Halk arasında takdire şayan bir ünle öne çıktı, büyük duygular oluşturmak için çok çalıştı ve sadece en nitelikli kişileri dikkatli değerlendirmeden sonra atadı. Ve diğer hiçbir kralın sahip olmadığı kutsal mekanların inşasında önemli rol oynadı; örneğin Mina'da El-Hayf Camii'ni inşa etmek, yirmi arşını kalmak için bir sarnıç kazmak, Hulai'nin bereketini inşa etmek ve iyi gözü ona yönlendirmek ve bir asırdan fazla bir süre kesik kaldıktan sonra Arafah pınarını inşa etmek gibi. Abbas'ın suyunu inşa etti, Zamzam kuyusunu ve türbesini onardı, yetmiş dokuzuncu yılda camiyi büyük bir bezle hazırladı. Her yıl Kabe'ye mükemmel bir örtü gönderdi, Kutsal Camii'nin yanında büyük bir okul, bir şerit ve bir yetimhane ofisi kurdu ve Peygamber'in Şehri'nde görkemli bir okul kurdu. Yangından sonra Noble Camii'ni inşa etti ve Kudüs'te büyük bir okul inşa etti, İskenderiye'de bir kale, Thaghar Damietta kalesi, Rashid'de bizi tahkim etti, Şam'da Emevi Camii, Gazze'de bir okul, Al-Salihiye'de bir cami, El-Rawda Camii, El-Kabş Camii, Mısır çölünde Turbah ve İmam Kubbesi'ni inşa etti. Şeyh Abdul Kadir Al-Dashtouti, onun yetiştirilmesi ve rehberliği için ona en derin güvene sahipti. Bir gün aşağı indi ve sinekler üzerinde asılıydı. Şeyh ona, \"Ey Kaitbey, bu sineğe beni sıcak bırakmasını söyle,\" dedi. O da \"Efendim, sinekler benden nasıl duyabiliyor?\" dedi. \"Nasıl duyulabilirsin?\" dedi. Bir hükümdar ve sinekler seni duymaz, sonra dedi ki, Ey sinekler, benden uzaklaş {cite:shadharat-dhahab s. 423-424}."
  id: "Seorang sultan Mamluk Circassian diberikan kesultanan oleh Khalifah Al-Mustanjid dan memberinya gelar Al-Ashraf. Ia mendirikan kerajaannya dan memimpin kerajaan dengan kemurahan hati dan keteguhan yang sama seperti raja sebelumnya pada masa pemerintahan Al-Nasir Muhammad ibn Qalawun. Ia melakukan perjalanan dari Mesir ke Efrat bersama sekelompok kecil prajurit. Menurut biografinya, ia tidak pernah menunjuk pejabat agama di Mesir seperti hakim, sheikh, atau guru kecuali untuk mereformasi mereka yang hadir setelah menunggu lama dan memberinya kesabaran, sehingga posisi itu kosong selama berbulan-bulan dan ia tidak pernah mengangkat hakim atau sheikh dengan uang. Pada tahun delapan puluh empat, ia melakukan perjalanan ke Hijaz untuk ziarah, tugas yang belum pernah dilihat raja selama lebih dari seratus tahun. Ia mulai mengunjungi Madinah dan memberikan enam ribu dinar, lalu kembali ke Mekah, memberikan lima ribu dinar, dan mendirikan sekolahnya di Mekah sebagai sheikh dan sufi {cite::History-Khulafa-minhaj-1434 hlm. 776-778}. Dalam Shadharat al-Dhahab, Abu al-Nasr Qaitbay adalah raja bangsawan Circassia bernama Zahir, dinamai menurut al-Zahir Jaqmaq, raja Circassia keenam belas. Ia lahir pada tahun 826 H, sehingga ia terhubung dengan Raja al-Zahir dan membebaskannya. Ia terus naik pangkat hingga ia diikrarkan setia kepada kesultanan pada hari Senin, 6 Rajab 872 H. Ia tidak memiliki saingan atau pembela pada masanya. Ia menonjol dengan reputasi yang terpuji di kalangan rakyat, bekerja keras membangun sentimen besar, dan dipilih dalam posisi keagamaan, hanya mengangkat yang paling layak setelah pertimbangan matang. Dan ia berperan penting dalam membangun situs suci yang tidak dimiliki raja lain, seperti membangun Masjid Al-Khayf di Mina, menggali sumur dengan satu hasta dua puluh hasta, dan membangun berkat Khulai serta mengarahkan mata baik ke sana, dan mata airnya Arafah setelah terputus selama lebih dari satu abad. Ia membangun air Al-Abbas, memperbaiki sumur Zamzam dan makam, dan pada tahun tujuh puluh sembilan menyiapkan masjid dengan kain besar. Ia mengirimkan penutup yang indah untuk Ka'bah setiap tahun, dan mendirikan sekolah besar di sebelah Masjid Suci, bersama ribat dan kantor panti asuhan, dan mendirikan sekolah megah di Kota Nabi. Dia membangun Masjid Mulia setelah kebakaran dan membangun sekolah besar di Yerusalem, membangun benteng di Alexandria, benteng Thaghar Damietta, memperkuat kami di Rashid, Masjid Umayyah di Damaskus, membangun sekolah di Gaza, masjid di Al-Salihiya, Masjid Al-Rawda, Masjid Al-Kabsh, Turbah di gurun Mesir, dan Kubah Imam. Sheikh Abdul Qadir Al-Dashtouti sangat percaya kepadanya untuk menjaga didikan dan bimbingannya. Suatu hari, dia turun kepadanya, dan lalat menggantung di atasnya. Sheikh berkata kepadanya, \"Wahai Qaitbay, katakan pada lalat ini untuk meninggalkanku panas.\" Dia berkata, \"Tuan, bagaimana lalat bisa mendengar dariku?\" Dia berkata, \"Bagaimana mungkin kamu bisa?\" Seorang penguasa, dan lalat tidak mendengarmu, lalu dia berkata, Wahai lalat, pergilah dariku {cite:shadharat-dhahab hlm. 423-424}."
