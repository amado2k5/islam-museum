label: { ar: "السلطان الأشرف قايتباي" }
summary:
  ar: "سلطان مملوكي جركسي، قلده الخليفة المستنجد السلطنة ولقب الأشرف فاستقر له الملك وسار في المملكة بشهامة وصرامة ما سارها ملك قبله من عهد الناصر محمد بن قلاوون بحيث إنه سافر من مصر إلى الفرات في طائفة يسيرة جداً من الجند، ومن سيرته أنه لم يول بمصر صاحب وظيفة دينية كالقضاة والمشايخ والمدرسين إلا أصلح الموجودين لها بعد طول ترويه وتمهله بحيث استمر الوظيفة شاغرة الأشهر العديدة ولم يول قاضياً ولا شيخاً بمال قط، وفي سنة أربع وثمانين سافر إلى الحجاز برسم الحج وهو أمر لم يعهد لملك من أكثر من مئة سنة فبدأ بزيارة المدينة وفرق بها ستة آلاف دينار ثم قدم مكة وفرق بها خمسة آلاف دينار وقرر بمدرسته التي أنشأها بمكة شيخاً وصوفية {cite:tarikh-khulafa-minhaj-1434 p. 776-778}. وفي شذرات الذهب أبو النصر قايتباي الملك الأشرف الجركسي الظاهري نسبة إلى الظاهر جقمق السادس عشر من ملوك الجراكسة ولد سنة ست وعشرين وثمان مئة فاتصل بالملك الظاهر فأعتقه ولم يزل يترقى إلى أن بويع له بالسلطنة يوم الاثنين سادس رجب سنة اثنتين وسبعين وثمان مئة ولم يكن له في زمنه منازع ولا مدافع وسار في الناس السيرة الحميدة واجتهد في بناء المشاعر العظام وكان مختاراً في الوظائف الدينية لا يولي إلا الأصلح بعد التروي والتفحص ووقع له في بناء المشاعر ما لم يقع لغيره من الملوك كعمارة مسجد الخيف بمنى وحفر بنمرة صهريجاً ذرعه عشرون ذراعاً وعمر بركة خليص وأجرى العين الطيبة إليها وأجرى عين عرفة بعد انقطاعها أزيد من قرن وعمر سقاية العباس وأصلح بئر زمزم والمقام وجهز سنة تسع وسبعين للمسجد متبراً عظيماً وكان يرسل للكعبة كسوة فائقة في كل سنة وأنشأ بجانب المسجد الحرام مدرسة عظيمة وبجانبها رباطاً ومكتباً للأيتام وأنشأ بالمدينة النبوية مدرسة بديعة بل بنى المسجد الشريف بعد الحريق وعمل ببيت المقدس مدرسة كبيرة وعمر حصناً بالإسكندرية وحصن ثغر دمياط وحصوناً برشيد ومرم الجامع الأموي بدمشق وعمر بغزة مدرسة وجامعاً بالصالحية وجامع الروضة وجامع الكبش وتربة بصحراء مصر وقبة الإمام وكان له في الشيخ عبد القادر الدشطوتي غاية الاعتقاد يتولى تربيته وإرشاده ونزل إليه يوماً والذباب منعكف عليه فقال له الشيخ يا قايتباي قل لهذا الذباب يذهب عني فحار وقال يا سيدي كيف يسمع الذباب مني فقال كيف تكون سلطاناً ولا يسمع الذباب منك ثم قال يا ذباب اذهب عني {cite:shadharat-dhahab p. 423-424}."
  en: "Circassian sultan invested by the caliph — ruling 'with a boldness no king had shown since al-Nasir Muhammad', marching Egypt-to-Euphrates with a small escort; he gave no religious office save to the fittest after long deliberation, posts lying vacant months rather than sold, and in 884 made the hajj no sultan had made for over a century, scattering 6,000 dinars at Medina and 5,000 at Mecca {cite:tarikh-khulafa-minhaj-1434 p. 776-778}."
