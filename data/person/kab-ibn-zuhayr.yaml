  ar: الشاعر المشهور ابن الشاعر زهير بن أبي سلمى، صحابي معروف؛ هجا النبي فأهدر دمه، ثم أسلم وأنشده قصيدته «بانت سعاد» فعفا عنه، وتروي المصادر قصة إسلامه بروايتين.
  en: The famous poet, son of the poet Zuhayr ibn Abi Sulma, a known Companion; he satirised the Prophet, who declared his blood forfeit, then he embraced Islam and recited his poem 'Banat Su'ad' and was forgiven; the sources tell the story of
    his Islam in two versions.
