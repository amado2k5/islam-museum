summary:
  ar: "السلطان بايزيد الأول (حكم ٧٩١–٨٠٥هـ/١٣٨٩–١٤٠٢م)؛ تولى الحكم بعد استشهاد أبيه مراد، وكان شجاعاً شهماً متحمساً للفتوحات الإسلامية، فاستهدف الإمارات المسيحية في الأناضول فصارت في عام تابعة للدولة العثمانية، وكان كمثل البرق في تحركاته بين الجبهتين البلقانية والأناضولية فأُطلق عليه لقب «الصاعقة». أقام علاقات ودية مع الصرب ليتخذهم حاجزاً بينه وبين المجر، ووافق على أن يحكم صربيا ابنا الملك لازار الذي قُتل في معركة قوصوه حسب قوانينها وأعرافها، على أن يدينا له بالولاء والجزية وعدد معين من الجنود {cite:dawlat-uthmaniyya-salabi p. 60}. أخضع بلغاريا سنة ٧٩٧هـ/١٣٩٣م، وكسر الجيش الصليبي الأوروبي الكبير في نيقوبوليس سنة ٨٠٠هـ/١٣٩٦م، وضيّق الحصار على القسطنطينية حتى اضطر إمبراطورها إلى شروط ثقيلة، ثم هُزم وأُسر أمام تيمورلنك في أنقرة سنة ٨٠٤هـ/١٤٠٢م ومات في الأسر في السنة التالية، فدخلت الدولة في حرب أهلية بين أبنائه {cite:dawlat-uthmaniyya-salabi p. 65-70}."
  en: "Bayezid I 'Yildirim' (r. 1389–1402 CE) — 'the Thunderbolt' who shuttled between the Balkan and Anatolian fronts; al-Sallabi has him subduing Bulgaria in 797/1393, crushing the European crusader host at Nicopolis in 800/1396, and grinding down Constantinople under siege before Timur broke him at Ankara in 804/1402, after which he died in captivity and the state fell into civil war among his sons {cite:dawlat-uthmaniyya-salabi p. 65-70}; Ibn al-'Imad says he died in captivity — 'whether of grief or otherwise' — having never styled himself sultan or king, sitting mornings to remove grievances, and that Timur took most of Anatolia and went home in Sha'ban 805 {cite:shadharat-dhahab p. 55}."
