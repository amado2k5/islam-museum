summary:
  ar: "السلطان بايزيد الأول ⁦(حكم ٧٩١–٨٠٥هـ/١٣٨٩–١٤٠٢م)⁩؛ تولى الحكم بعد استشهاد أبيه مراد، وكان شجاعاً شهماً متحمساً للفتوحات الإسلامية، فاستهدف الإمارات المسيحية في الأناضول فصارت في عام تابعة للدولة العثمانية، وكان كمثل البرق في تحركاته بين الجبهتين البلقانية والأناضولية فأُطلق عليه لقب «الصاعقة». أقام علاقات ودية مع الصرب ليتخذهم حاجزاً بينه وبين المجر، ووافق على أن يحكم صربيا ابنا الملك لازار الذي قُتل في معركة قوصوه حسب قوانينها وأعرافها، على أن يدينا له بالولاء والجزية وعدد معين من الجنود {cite:dawlat-uthmaniyya-salabi p. 60}. أخضع بلغاريا سنة ٧٩٧هـ/١٣٩٣م، وكسر الجيش الصليبي الأوروبي الكبير في نيقوبوليس سنة ٨٠٠هـ/١٣٩٦م، وضيّق الحصار على القسطنطينية حتى اضطر إمبراطورها إلى شروط ثقيلة، ثم هُزم وأُسر أمام تيمورلنك في أنقرة سنة ٨٠٤هـ/١٤٠٢م ومات في الأسر في السنة التالية، فدخلت الدولة في حرب أهلية بين أبنائه {cite:dawlat-uthmaniyya-salabi p. 65-70}."
  en: "Bayezid I 'Yildirim' (r. 1389–1402 CE) — 'the Thunderbolt' who shuttled between the Balkan and Anatolian fronts; al-Sallabi has him subduing Bulgaria in 797/1393, crushing the European crusader host at Nicopolis in 800/1396, and grinding down Constantinople under siege before Timur broke him at Ankara in 804/1402, after which he died in captivity and the state fell into civil war among his sons {cite:dawlat-uthmaniyya-salabi p. 65-70}; Ibn al-'Imad says he died in captivity — 'whether of grief or otherwise' — having never styled himself sultan or king, sitting mornings to remove grievances, and that Timur took most of Anatolia and went home in Sha'ban 805 {cite:shadharat-dhahab p. 55}."
  ur: "عثمانی سلطان جس کی حکومت بلقان اور اناطولیہ کی مہمات سے وابستہ تھی؛ انقرہ کی جنگ کے بعد تیمور کی قید میں آیا۔ {cite:dawlat-uthmaniyya-salabi}"
  es: "Bayezid I 'Yildirim' (r. 1389–1402 d. C.) — 'el Rayo' que se movía entre los frentes de los Balcanes y Anatolia; al-Sallabi dice que sometió Bulgaria en 797/1393, aplastó al ejército cruzado europeo en Nicópolis en 800/1396 y sometió Constantinopla bajo asedio antes de que Timur lo quebrara en Ankara en 804/1402, después de lo cual murió en cautiverio y el estado cayó en una guerra civil entre sus hijos {cite:dawlat-uthmaniyya-salabi p. 65-70}; Ibn al-'Imad dice que murió en cautiverio — 'ya sea por pena o por otra razón' — sin haberse autodenominado nunca sultán o rey, sentándose por las mañanas para resolver agravios, y que Timur tomó la mayor parte de Anatolia y regresó a casa en Sha'ban 805 {cite:shadharat-dhahab p. 55}."
  fr: "Bayezid Ier « Yildirim » (r. 1389-1402) – surnommé « le Foudre », qui mena des campagnes entre les fronts balkaniques et anatoliens; selon al-Sallabi, il soumit la Bulgarie en 797/1393, écrasa l'armée croisée européenne à Nicopolis en 800/1396 et réduisit Constantinople à néant lors du siège, avant que Timour ne le brise à Ankara en 804/1402. Il mourut ensuite en captivité et l'État sombra dans la guerre civile entre ses fils (voir: Dawlat-Uthmaniyya-Salabi, p. 65-70). Ibn al-'Imad rapporte qu'il mourut en captivité – « de chagrin ou pour une autre raison » – sans jamais s'être proclamé sultan ou roi, et qu'il consacrait ses matinées à apaiser les griefs. Timour aurait conquis la majeure partie de l'Anatolie et serait rentré chez lui en Sha'ban 805 (voir: Hadharat-Dhahab, p. 10). 55}."
  tr: "Sultan I. Bayezid (hüküm sürdü 791–805 Hicri / 1389–1402 M.S.), babası Murad'ın şehitliğinden sonra iktidara geldi. Cesur, yiğit ve İslami fetihlere karşı hevesliydi. Anadolu'daki Hristiyan prensliklerini hedef aldı; bu prenslikler bir yıl içinde Osmanlı İmparatorluğu'nun bir parçası oldu. Balkan ve Anadolu cepheleri arasındaki hareketlerinde yıldırım gibi hareket etti ve ona 'Şimşek' lakabını kazandırdı. Sırplarla dostane ilişkiler kurarak kendisi ile Macaristan arasında bir bariyer oluşturdu ve Koso Muharebesi'nde öldürülen Kral Lazar'ın oğlu Sırbistan'ın, sadakat, haraç ve belirli sayıda askerle yasa ve geleneklerine göre hüküm sürmesini kabul etti {cite:dawlat-uthmaniyya-salabi s. 60}. 797 Hicri/1393 yılında Bulgaristan'ı boyunduruk altına aldı, 800 Hicri/1396 yılında Nikopolis'te büyük Avrupa Haçlı ordusunu yendi, Konstantinopolis'in kuşatmasını sıkılaştırdı ve imparatoru ağır koşullar getirmek zorunda kalana kadar sürdü, ardından 804 Hicri/1402 yılında Ankara'da Timur tarafından yenildi ve esir alındı, ertesi yıl esaret altında öldü; bu da oğulları arasında bir iç savaşa yol açtı {cite:dawlat-uthmaniyya-salabi, s. 65-70}."
  id: "Sultan Bayezid I (memerintah 791–805 H / 1389–1402 M) mengambil alih kekuasaan setelah ayahnya Murad gugur. Ia berani, gagah berani, dan antusias terhadap penaklukan Islam. Ia menargetkan kerajaan Kristen di Anatolia, yang dalam satu tahun menjadi bagian dari Kekaisaran Ottoman. Ia seperti kilat dalam pergerakannya antara front Balkan dan Anatolia, sehingga ia dijuluki 'Petir.' Ia menjalin hubungan baik dengan orang Serbia sebagai penghalang antara dirinya dan Hungaria, dan setuju bahwa Serbia, putra Raja Lazar yang gugur dalam Pertempuran Koso, akan memerintah sesuai hukum dan adatnya, dengan kesetiaan, upeti, dan sejumlah prajurit {cite:dawlat-uthmaniyya-salabi hlm. 60}. Ia menaklukkan Bulgaria pada tahun 797 H/1393 M, mengalahkan pasukan besar Tentara Salib Eropa di Nicopolis pada tahun 800 H/1396 M, memperketat pengepungan Konstantinopel hingga kaisarnya terpaksa memberlakukan syarat berat, lalu dikalahkan dan ditangkap oleh Tamerlane di Ankara pada tahun 804 H/1402 M, dan meninggal dalam tahanan tahun berikutnya, yang menyebabkan perang saudara di antara putra-putranya {cite:dawlat-uthmaniyya-salabi, hlm. 65-70}."
