summary:
  ar: "السلطان بايزيد الأول (حكم ٧٩١–٨٠٥هـ/١٣٨٩–١٤٠٢م)؛ تولى الحكم بعد استشهاد أبيه مراد، وكان شجاعاً شهماً متحمساً للفتوحات الإسلامية، فاستهدف الإمارات المسيحية في الأناضول فصارت في عام تابعة للدولة العثمانية، وكان كمثل البرق في تحركاته بين الجبهتين البلقانية والأناضولية فأُطلق عليه لقب «الصاعقة». أقام علاقات ودية مع الصرب ليتخذهم حاجزاً بينه وبين المجر، ووافق على أن يحكم صربيا ابنا الملك لازار الذي قُتل في معركة قوصوه حسب قوانينها وأعرافها، على أن يدينا له بالولاء والجزية وعدد معين من الجنود {cite:dawlat-uthmaniyya-salabi p. 60}."
  en: "Bayezid I 'Yildirim' (r. 1389–1402 CE) — 'the Thunderbolt' who shuttled between the Balkan and Anatolian fronts until Timur broke his army at Ankara {cite:dawlat-uthmaniyya-salabi p. 60}; Ibn al-'Imad says he died in captivity — 'whether of grief or otherwise' — having never styled himself sultan or king, sitting mornings to remove grievances, and that Timur took most of Anatolia and went home in Sha'ban 805 {cite:shadharat-dhahab p. 55}."
