summary:
  ar: "سياسي ومحامٍ بنغلاديشي (وُلد في 1 يناير 1944)، من قدامى رابطة عوامي، انتُخب نائبًا في البرلمان سبع مرات، وتولى رئاسة مجلس الأمة (جاتيا سانغساد) في 2001 ومن 2009 إلى 2013، ثم رئاسة بنغلاديش من 2013 إلى 2023 فكان أطول الرؤساء خدمة في تاريخ البلاد وأول من أعيد انتخابه لولاية ثانية."
  en: "Bangladeshi politician and lawyer (born 1 January 1944), a lifelong Awami League figure elected to parliament seven times, speaker of the Jatiya Sangsad in 2001 and from 2009 to 2013, and then president of Bangladesh from 2013 to 2023 — the longest-serving president in the country's history and the first to be re-elected to a second term."
  ur: "بنگلہ دیشی سیاست دان اور وکیل (پیدائش 1 جنوری 1944ء)، عوامی لیگ کے دیرینہ رہنما، سات مرتبہ رکن پارلیمنٹ منتخب ہوئے، 2001ء اور 2009ء تا 2013ء جاتیہ سنگسد کے اسپیکر رہے، پھر 2013ء سے 2023ء تک بنگلہ دیش کے صدر رہے — ملک کے سب سے طویل عرصہ خدمت کرنے والے صدر اور دوسری مدت کے لیے دوبارہ منتخب ہونے والے پہلے صدر۔"
