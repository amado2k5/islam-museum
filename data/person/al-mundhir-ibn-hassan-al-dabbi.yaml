class: person
label: { ar: "المنذر بن حسان الضبي", en: "al-Mundhir ibn Hassan al-Dabbi", fr: "al-Mundhir ibn Hassan al-Dabbi", es: "al-Mundhir ibn Hassan al-Dabbi", ur: "المنذر بن حسن الدبی" }
summary:
  ar: "المنذر بن حسان بن صرار الضبي؛ تنازع مع جرير بن عبد الله في قتل مهران يوم البويب نزاعاً شديداً فأخذ المنذر منطقة مهران وأخذ جرير سائر سلبه."
  en: "al-Mundhir ibn Hassan ibn Sirar al-Dabbi; disputed with Jarir ibn Abdallah over killing Mihran at al-Buwayb — he took Mihran's belt while Jarir took the rest of the spoil."
  fr: "al-Mundhir ibn Hassan ibn Sirar al-Dabbi  ; contesté avec Jarir ibn Abdallah sur le meurtre de Mihran à al-Buwayb – il a pris la ceinture de Mihran tandis que Jarir a pris le reste du butin."
  es: "al-Mundhir ibn Hassan ibn Sirar al-Dabbi; Disputó con Jarir ibn Abdallah sobre el asesinato de Mihran en al-Buwayb: tomó el cinturón de Mihran mientras Jarir se quedó con el resto del botín."
  ur: "المنذر بن حسن بن سیرار الدبی؛ جریر بن عبداللہ کے ساتھ البویب میں مہران کو قتل کرنے پر جھگڑا ہوا - اس نے مہران کی پٹی لے لی جب کہ باقی مال غنیمت لے لیا۔"
  tr: "Al-Mundhir ibn Hassan ibn Surar al-Dabi; Al-Buwayb gününde Mihran'ın öldürülmesi konusunda Jarir ibn Abdullah ile şiddetli bir anlaşmazlık yaşadı. Al-Mundhir Mehran bölgesini aldı ve Jarir tüm yağmalarını aldı."
  id: "Al-Mundhir ibn Hassan ibn Surar al-Dhabi; ia berselisih sengit dengan Jarir ibn Abdullah terkait pembunuhan Mihran pada hari Al-Buwayb. Al-Mundhir mengambil wilayah Mehran dan Jarir mengambil semua penjarahannya."
