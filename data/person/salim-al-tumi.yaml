summary:
  ar: "حاكم الجزائر الذي ارتكز حكمه على دعم الأسبان له، في وصف الصلابي. حاصر الأخوين عروج وخير الدين في جيجل بينه وبين الحفصيين، ثم دخل عروج الجزائر بالدعم العثماني وقتله بعد أن تأكد من مساعيه للاستعانة بالقوات الأسبانية، سنة ١٥١٦م {cite:dawlat-uthmaniyya-salabi p. 210}."
  en: "Salim al-Tumi — ruler of Algiers whose power rested on Spanish backing, in al-Salabi's account; he besieged the Barbarossa brothers at Jijel, and when Aruj entered Algiers with Ottoman support in 1516 he was killed on proof of his appeals for Spanish troops {cite:dawlat-uthmaniyya-salabi p. 210}."
  es: "Salim al-Tumi — gobernante de Argel cuyo poder se basaba en el respaldo español, según el relato de al-Salabi; sitió a los hermanos Barbarroja en Jijel, y cuando Aruj entró en Argel con el apoyo otomano en 1516 fue asesinado tras comprobarse sus peticiones de tropas españolas {cite:dawlat-uthmaniyya-salabi p. 210}."
  fr: "Salim al-Tumi — dirigeant d'Alger dont le pouvoir reposait sur le soutien espagnol, selon le récit d'al-Salabi; il assiégea les frères Barberousse à Jijel, et lorsqu'Aruj entra à Alger avec le soutien ottoman en 1516, il fut tué sur la preuve de ses appels aux troupes espagnoles {cite:dawlat-uthmaniyya-salabi p. 210}."
