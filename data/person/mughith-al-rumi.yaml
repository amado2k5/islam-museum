label: { ar: "مغيث الرومي" }
gender: male
summary:
  ar: "مولى الوليد بن عبد الملك؛ بعثه طارق بن زياد من استيجة إلى قرطبة في سبعمائة فارس، فكمن بعدوة نهر شقندة وأمسك الأدلاء راعي غنم فدلهم على ثغرة في السور، فلما أجنهم الليل أرسل الله رذاذاً أخفى دقدقة حوافر الخيل فعبروا النهر وتعلقوا بالسور من شجرة تين وكثروا عليه وكسروا أقفال الباب وملكوا المدينة عنوة، وحاصر مغيث ملكها في كنيسة بغربيها ثلاثة أشهر حتى قطع عنهم قناة الماء، ولحق العلج الهارب فقبض عليه قرب قرية تطليرة؛ وذهب قوم إلى أن فاتح قرطبة مغيث لا طارق {cite:nafh-tib-maqqari p. 297-299}."
  en: "Al-Walid's mawla, sent by Tariq with seven hundred horse to Cordoba; by the fig-tree breach in the wall he took the city by storm, besieged its lord in the western church for three months until his slave Rabah revealed the water channel, and ran down the fleeing king near Tatlira — some say Mughith, not Tariq, was Cordoba's real conqueror {cite:nafh-tib-maqqari p. 297-299}."
