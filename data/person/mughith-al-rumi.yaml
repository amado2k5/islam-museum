id: person/mughith-al-rumi
class: person
label: { ar: "مغيث الرومي" }
gender: male
summary:
  ar: "مولى الوليد بن عبد الملك؛ بعثه طارق بن زياد من استيجة إلى قرطبة في سبعمائة فارس، فكمن بعدوة نهر شقندة وأمسك الأدلاء راعي غنم فدلهم على ثغرة في السور، فلما أجنهم الليل أرسل الله رذاذاً أخفى دقدقة حوافر الخيل فعبروا النهر وتعلقوا بالسور من شجرة تين وكثروا عليه وكسروا أقفال الباب وملكوا المدينة عنوة، وحاصر مغيث ملكها في كنيسة بغربيها ثلاثة أشهر حتى قطع عنهم قناة الماء، ولحق العلج الهارب فقبض عليه قرب قرية تطليرة؛ وذهب قوم إلى أن فاتح قرطبة مغيث لا طارق {cite:nafh-tib-maqqari p. 297-299}. أرسله الوليد بن عبد الملك إلى موسى بن نصير يأمره بالقدوم إلى دمشق، فأمهله موسى حتى يفتح جليقية والأشتوريس، وسار معه في فتحهما. {cite:salabi-umayyad-state-2020 p.77-78}"
  en: "Al-Walid's mawla, sent by Tariq with seven hundred horse to Cordoba; by the fig-tree breach in the wall he took the city by storm, besieged its lord in the western church for three months until his slave Rabah revealed the water channel, and ran down the fleeing king near Tatlira — some say Mughith, not Tariq, was Cordoba's real conqueror {cite:nafh-tib-maqqari p. 297-299}."
  es: "El mawla de Al-Walid, enviado por Tariq con setecientos caballos a Córdoba; por la brecha de la higuera en la muralla tomó la ciudad por asalto, sitió a su señor en la iglesia occidental durante tres meses hasta que su esclavo Rabah reveló el canal de agua, y persiguió al rey fugitivo cerca de Tatlira; algunos dicen que Mughith, no Tariq, fue el verdadero conquistador de Córdoba {cite:nafh-tib-maqqari p. 297-299}."
  fr: "Le mawla d'Al-Walid, envoyé par Tariq avec sept cents chevaux à Cordoue; par la brèche du figuier dans le mur, il prit d'assaut la ville, assiégea son seigneur dans l'église occidentale pendant trois mois jusqu'à ce que son esclave Rabah révèle le canal d'eau, et poursuivit le roi en fuite près de Tatlira — certains disent que Mughith, et non Tariq, fut le véritable conquérant de Cordoue {cite:nafh-tib-maqqari p. 297-299}."
  ur: "الولید کا مولا، طارق کا سات سو گھوڑوں کے ساتھ قرطبہ بھیجا؛ دیوار میں انجیر کے درخت کی شگاف سے اس نے شہر کو طوفان میں لے لیا، تین مہینے تک مغربی چرچ میں اس کے مالک کا محاصرہ کیا یہاں تک کہ اس کے غلام رباح نے پانی کی نالی کا انکشاف کیا، اور تتلیرا کے قریب بھاگنے والے بادشاہ کو گرا دیا - بعض کہتے ہیں کہ طارق نہیں بلکہ مغیث قرطبہ کا حقیقی فاتح تھا۔ 297-299}۔"
  tr: "Al-Walid ibn Abd al-Malik'in özgür adamı Tariq ibn Ziyad, onu Istija'dan Cordoba'ya yedi yüz süvarıyla gönderdi. Şaqanda Nehri'nin düşmanına pusu kurdu ve rehberler, duvardaki bir yarığı gösteren bir çobanı yakaladı. Gece çöktüğünde, Tanrı atların nal çıtırtısını gizleyen bir sprey gönderdi. Nehri geçtiler, incir ağacına tutundular, sık sık tırmandılar, kapının kilitlerini kırdılar ve şehri zorla ele geçirdiler. Mughit, kralını batısındaki bir kilisede üç ay boyunca kuşattı, ta ki su kanalını kestene kadar. Kaçan Alaj onu Talira köyü yakınlarında takip edip yakaladı. Bazı kişiler Cordoba'nın fatihinin Tariq değil, Muğhit olduğuna inanıyordu {cite:nafh-tib-maqqari s. 297-299}. Al-Walid ibn Abd al-Malik onu Musa ibn Nusayr'a göndererek Şam'a gelmesini emretti. Musa ona Galiçya ve Ashtoris'i ele geçirmesi için zaman verdi ve o da onların fetihinde ona eşlik etti. {cite:Salabi-Umayyad-state-2020 s.77-78}"
  id: "Bekas hamba al-Walid ibn Abd al-Malik, Tariq ibn Ziyad mengirimnya dari Istija ke Cordoba bersama tujuh ratus penunggang kuda. Ia menyergap musuh Sungai Shaqanda, dan para pemandu menangkap seorang gembala yang menunjukkan celah di tembok. Ketika malam tiba di atas mereka, Tuhan mengirimkan semprotan air yang menutupi suara tapak kuda yang berderak. Mereka menyeberangi sungai, berpegangan pada pohon ara, sering memanjatnya, memecahkan kunci gerbang, dan dengan paksa menguasai kota. Mughith mengepung rajanya di sebuah gereja di sebelah barat selama tiga bulan hingga ia memutuskan kanal air. Alaj yang melarikan diri mengejar dan menangkapnya di dekat desa Talira. Beberapa orang percaya bahwa penakluk Cordoba adalah Mughith, bukan Tariq {cite:nafh-tib-maqqari hlm. 297-299}. Al-Walid ibn Abd al-Malik mengirimnya kepada Musa ibn Nusayr memerintahkannya untuk datang ke Damaskus. Musa memberinya waktu untuk merebut Galicia dan Ashtoris, dan ia menemaninya dalam penaklukan mereka. {sitasi: Salabi-Umayyad-State-2020 hlm.77-78}"
