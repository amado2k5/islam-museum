label: { ar: "علي بن محمد البريدي" }
summary:
  ar: "أبو الحسين علي بن محمد البريدي، خرج سنة ثلاثين فخرج لقتاله الخليفة وابن رائق فهزما وهربا إلى الموصل ونهبت بغداد ودار الخلافة، وهزمه سيف الدولة في وقعة هائلة بقرب المدائن فعاد بالويل إلى واسط ثم انهزم إلى البصرة {cite:tarikh-khulafa-minhaj-1434 p. 609}.، وعند المسعودي اشتد أمر البريديين بالبصرة في أيام المتقي فمنعوا السفن أن تصعد وعظم جيشهم في الماء بالشذوات والطيارات والسميريات والزبازب وفي البر واصطنعوا الرجال وبذلوا الرغائب فانضاف إليهم حجرية السلطان وغلمانه {cite:muruj-al-dhahab p. 691}"
  en: "Abu'l-Husayn the Baridi; he rose in 330, routed the caliph and Ibn Ra'iq to Mosul, and Baghdad and the palace were sacked — till Sayf al-Dawla crushed him near Mada'in and drove him to Wasit then Basra {cite:tarikh-khulafa-minhaj-1434 p. 609}."
