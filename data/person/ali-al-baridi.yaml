class: person
label: { ar: "علي بن محمد البريدي", fr: "Ali ibn Muhammad al-Baridi" }
summary:
  ar: "أبو الحسين علي بن محمد البريدي، خرج سنة ثلاثين فخرج لقتاله الخليفة وابن رائق فهزما وهربا إلى الموصل ونهبت بغداد ودار الخلافة، وهزمه سيف الدولة في وقعة هائلة بقرب المدائن فعاد بالويل إلى واسط ثم انهزم إلى البصرة {cite:tarikh-khulafa-minhaj-1434 p. 609}. وعند المسعودي اشتد أمر البريديين بالبصرة في أيام المتقي فمنعوا السفن أن تصعد وعظم جيشهم في الماء بالشذوات والطيارات والسميريات والزبازب وفي البر واصطنعوا الرجال وبذلوا الرغائب فانضاف إليهم حجرية السلطان وغلمانه {cite:muruj-al-dhahab p. 691}، وعند ابن الأثير هو أبو الحسين أخو أبي عبد الله البريدي؛ أرسله أخوه إلى بغداد يخطب له أعمال الأهواز فلما وُزّر ابن مقلة بذل له عشرين ألف دينار فقلد أبا عبد الله الأهواز جميعها سوى السوس وجنديسابور وقلده هو الفراتية وأخاهما أبا يوسف الخاصة والإسالة {cite:kamil-ibn-al-athir p. 137}"
  en: "Abu'l-Husayn the Baridi; he rose in 330, routed the caliph and Ibn Ra'iq to Mosul, and Baghdad and the palace were sacked — till Sayf al-Dawla crushed him near Mada'in and drove him to Wasit then Basra {cite:tarikh-khulafa-minhaj-1434 p. 609}."
  fr: "Abu'l-Husayn le Baridi ; il s'est levé en 330, a mis en déroute le calife et Ibn Ra'iq à Mossoul, et Bagdad et le palais ont été saccagés - jusqu'à ce que Sayf al-Dawla l'écrase près de Mada'in et le conduise à Wasit puis Bassorah {cite:tarikh-khulafa-minhaj-1434 p. 609}."
  es: "Abu'l-Husayn el Baridi; se alzó en el año 330, derrotó al califa e Ibn Ra'iq hasta Mosul, y Bagdad y el palacio fueron saqueados, hasta que Sayf al-Dawla lo aplastó cerca de Mada'in y lo obligó a huir a Wasit y luego a Basora {cite:tarikh-khulafa-minhaj-1434 p. 609}."
  ur: "ابو الحسین بریدی؛ وہ 330 میں اٹھ کھڑا ہوا، خلیفہ اور ابن رقیق کو موصل کی طرف دھکیل دیا، اور بغداد اور محل برخاست کر دیا گیا - یہاں تک کہ سیف الدولہ نے اسے مدین کے قریب کچل دیا اور اسے وسط پھر بصرہ لے جایا۔ 609}۔"
  tr: "Ebu el-Hüseyin Ali bin Muhammed el-Buraidi 30 Hicri yılında emekli oldu; halife ve İbn Ra'iq onunla savaşmaya çıktı, ancak yenildiler ve Musul'a kaçtılar; burada Bağdat ve halifelik yağmalandı. Seyf-el-Devle, el-Medeyn yakınlarında büyük bir savaşta onu yendi, bu yüzden Sif acı içinde Vasit'e döndü ve ardından Basra'ya kaçtı {atıf:Tarikh-khulafa-minhaj-1434, s. 609}. El-Mes'udi'ye göre, el-Muttaqi'nin döneminde Basra'daki Buraidiler güçlendi, gemilerin çıkmasını engelledi ve orduları suda sürgünler, uçaklar, Sümerler ve Zazablarla ve karada güçlendirildi. İnsanlar yetiştirdiler ve arzularını gerçekleştirdiler, bu da sultanın taşı ve hizmetkarlarının eklenmesine yol açtı {alıntı:Muruj-al-Dhahab s. 691}. İbn al-Athir'e göre, o, Ebu Abdullah el-Buraidi'nin kardeşi Ebu el-Hüseyindir; kardeşi onu Ahwaz'ın işlerini vaaz etmesi için Bağdat'a göndermiştir. İbn Muqla'yı ziyaret ettiğinde ona yirmi bin dinar verdi, böylece Ebu Abdullah Soos ve Ndisapur hariç tüm Ahwaz'ı taklit etti, Fırat ve kardeşleri Ebu Yusuf el-Hasa ve el-Asla (atı: kamil-ibn-al-athir s. 137}"
  id: "Abu al-Husayn Ali ibn Muhammad al-Buraidi pensiun pada tahun 30 H, di mana khalifah dan Ibn Ra'iq pergi melawannya, tetapi mereka kalah dan melarikan diri ke Mosul, di mana Baghdad dan kekhalifahan dijarah. Sayf al-Dawla mengalahkannya dalam pertempuran besar dekat al-Mada'in, sehingga ia kembali ke Wasit dalam kesengsaraan dan kemudian melarikan diri ke Basra {cite:Tarikh-khulafa-minhaj-1434, hlm. 609}. Menurut al-Mas'udi, Buraidi di Basra pada masa al-Muttaqi semakin intensif, mencegah kapal menaiki kapal, dan pasukan mereka diperkuat di air dengan tunas, pesawat, Sumeria, dan Zazab, serta di darat. Mereka menciptakan manusia dan memenuhi keinginan mereka, yang menyebabkan penambahan batu sultan dan para pelayannya {cite:muruj-al-dhahab hlm. 691}. Menurut Ibn al-Athir, ia adalah Abu al-Husayn, saudara Abu Abdullah al-Buraidi; saudaranya mengirimnya ke Baghdad untuk memberitakan urusan Ahwaz. Ketika ia mengunjungi Ibn Muqla, ia memberinya dua puluh ribu dinar, sehingga Abu Abdullah meniru seluruh Ahwaz, kecuali Soos dan Ndisapur, dan ia meniru Efrat serta saudara mereka Abu Yusuf al-Khasa dan al-Asla {cite:kamil-ibn-al-athir hlm. 137}"
