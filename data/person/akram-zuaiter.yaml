summary:
  ar: "سياسي ودبلوماسي وأديب فلسطيني من نابلس (1909–1996)، من مؤسسي حزب الاستقلال؛ عمل في الصحافة والتعليم، ثم سفيرًا للأردن في دول عدة ووزيرًا لخارجيته سنة 1966، وألّف كتبًا ووثائق عن الحركة الوطنية الفلسطينية."
  en: "Palestinian politician, diplomat and writer from Nablus (1909–1996), a founding member of the Istiqlal Party. He worked in journalism and education, then served as Jordan's ambassador to several countries and as its foreign minister in 1966, and wrote books and documentary collections on the Palestinian national movement."
  ur: "نابلس سے تعلق رکھنے والے فلسطینی سیاست دان، سفارت کار اور ادیب (1909–1996)، استقلال پارٹی کے بانی ارکان میں سے ایک؛ صحافت اور تعلیم میں کام کیا، پھر کئی ملکوں میں اردن کے سفیر اور 1966 میں اس کے وزیر خارجہ رہے، اور فلسطینی قومی تحریک پر کتابیں اور دستاویزی مجموعے لکھے۔"
