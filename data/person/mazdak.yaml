  tr: "Mazdak, Qubad bin Firuz döneminde Khurramiyya doktrini, katılım ve despotizmden vazgeçme doktrini üzerine ortaya çıkan son kişiydi ve Anushirwan ile arkadaşları tarafından öldürüldü {atıf:fihrist-ibn-al-nadim s. 479-480}."
  id: "Mazdak adalah yang terakhir muncul pada masa Qubad ibn Firuz tentang doktrin Khurramiyya tentang partisipasi dan meninggalkan despotisme, dan ia dibunuh oleh Anushirwan dan para rekannya {cite:fihrist-ibn-al-nadim hlm. 479-480}."
