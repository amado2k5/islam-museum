  ar: "مزدك الأخير الذي ظهر في أيام قباد بن فيروز على مذهب الخرمية في المشاركة وترك الاستبداد، وقتله أنوشروان وقتل أصحابه {cite:fihrist-ibn-al-nadim p. 479-480}."
