label: { ar: "الحسين بن فضل بن سهلان الوزير", en: "al-Husayn ibn Fadl ibn Sahlan" }
summary:
  ar: "الحسين بن فضل بن سهلان أبو علي الرامهرمزي، وزير سلطان الدولة؛ يذكر ابن الجوزي في ترجمته أنه بنى سور الحائر بكربلاء سنة ٤٠٣ — وفي موضع آخر من الكتاب يُنسب البناء إلى أخيه أبي محمد الحسن بن الفضل بن سهلان — قُتل في شعبان سنة ٤١٤ وله ثلاث وخمسون سنة {cite:muntazam-ibn-al-jawzi j.8 p.355}."
  en: "Al-Husayn ibn al-Fadl ibn Sahlan, Abu Ali al-Ramhurmuzi, vizier of Sultan al-Dawla. Ibn al-Jawzi, in his entry on him, says that he built the wall of al-Ha'ir at Karbala in 403; elsewhere in the book the building is attributed to his brother Abu Muhammad al-Hasan ibn al-Fadl ibn Sahlan. He was killed in Sha'ban 414, aged 53 {cite:muntazam-ibn-al-jawzi j.8 p.355}."
