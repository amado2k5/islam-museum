id: person/al-husayn-ibn-fadl-sahlan
class: person
label: { ar: "الحسين بن فضل بن سهلان الوزير", en: "al-Husayn ibn Fadl ibn Sahlan", es: "al-Husayn ibn Fadl ibn Sahlan", fr: "al-Husayn ibn Fadl ibn Sahlan", ur: "الحسین بن فضل بن سہلان" }
summary:
  ar: "الحسين بن فضل بن سهلان أبو علي الرامهرمزي، وزير سلطان الدولة؛ يذكر ابن الجوزي في ترجمته أنه بنى سور الحائر بكربلاء سنة ٤٠٣ — وفي موضع آخر من الكتاب يُنسب البناء إلى أخيه أبي محمد الحسن بن الفضل بن سهلان — قُتل في شعبان سنة ٤١٤ وله ثلاث وخمسون سنة {cite:muntazam-ibn-al-jawzi j.8 p.355}."
  en: "Al-Husayn ibn al-Fadl ibn Sahlan, Abu Ali al-Ramhurmuzi, vizier of Sultan al-Dawla. Ibn al-Jawzi, in his entry on him, says that he built the wall of al-Ha'ir at Karbala in 403; elsewhere in the book the building is attributed to his brother Abu Muhammad al-Hasan ibn al-Fadl ibn Sahlan. He was killed in Sha'ban 414, aged 53 {cite:muntazam-ibn-al-jawzi j.8 p.355}."
  es: "Al-Husayn ibn al-Fadl ibn Sahlan, Abu Ali al-Ramhurmuzi, visir del sultán al-Dawla. Ibn al-Jawzi, en su entrada sobre él, dice que construyó la muralla de al-Ha'ir en Karbala en el año 403; en otra parte del libro, la construcción se atribuye a su hermano Abu Muhammad al-Hasan ibn al-Fadl ibn Sahlan. Murió en Sha'ban del año 414, a la edad de 53 años {cite:muntazam-ibn-al-jawzi, vol. 8, pág. 355}."
  fr: "Al-Husayn ibn al-Fadl ibn Sahlan, Abu Ali al-Ramhurmuzi, vizir du sultan al-Dawla. Ibn al-Jawzi, dans sa notice biographique, indique qu'il fit construire le mur d'al-Ha'ir à Karbala en 403; ailleurs dans l'ouvrage, cette construction est attribuée à son frère Abu Muhammad al-Hasan ibn al-Fadl ibn Sahlan. Il fut tué en Sha'ban 414, à l'âge de 53 ans (cf. Muntazam ibn al-Jawzi, vol. 8, p. 355)."
  ur: "الحسین بن الفضل ابن سہلان، ابو علی الرحموزی، سلطان الدولہ کے وزیر۔ ابن الجوزی اپنے اندراج میں کہتے ہیں کہ اس نے 403 میں کربلا میں دیوار الحیر کی تعمیر کی۔ کتاب میں دوسری جگہ عمارت کو ان کے بھائی ابو محمد الحسن بن الفضل بن سہلان سے منسوب کیا گیا ہے۔ آپ کو شعبان 414 میں 53 سال کی عمر میں قتل کیا گیا۔"
