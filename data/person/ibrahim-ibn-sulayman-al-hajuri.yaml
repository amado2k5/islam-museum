label:
  ar: إبراهيم بن سليمان الحجوري
  en: Ibrahim ibn Sulayman al-Hajuri
  ur: ابراہیم بن سلیمان حجوری
summary:
  ar: رجل من حجور وصفه الراوي بأنه لا بأس به في دينه ومذهبه، حدّث بأن رجلاً شُفي من سيلان في بطنه بعد أن أكل خاتم كتاب للهادي.
  en: A man of Hajur whom the narrator describes as of no fault in his religion and school, who told that a man was cured of a flux of the bowels after eating the seal of a letter from al-Hadi.
  ur: حجور کا ایک شخص جسے راوی اس کے دین اور مسلک میں بے عیب بتاتا ہے، جس نے بیان کیا کہ ایک شخص ہادی کے خط کی مہر کھا کر پیٹ کے بہاؤ سے شفایاب ہوا۔
