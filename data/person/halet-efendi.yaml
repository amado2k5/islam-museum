summary:
  ar: "محمد سعيد هالت أفندي رجل دولة عثماني وُلد في إسطنبول نحو سنة 1175هـ/1761م لأب قاضٍ من القرم. عمل سفيراً في فرنسا سنة 1802م ورئيساً للكتّاب ثم ناظراً للختم، وكان له شأن غالب في السنوات الأولى من عهد السلطان محمود الثاني، ونُفي إلى قونية وخُنق فيها في صفر 1238هـ/نوفمبر 1822م بعد أن حمّله الناس تبعة ثورة المورة {cite:encyclopaedia-of-islam-2 vol. 3 p. 99} {cite:encyclopaedia-of-islam-2 vol. 3 p. 100}."
  en: "Mehmed Said Halet Efendi was an Ottoman statesman born in Istanbul about 1175/1761, the son of a qadi from the Crimea. He served as ambassador to France in 1802, then as chief of the secretaries and keeper of the seal, held a dominant position in the early years of Mahmud II, and was exiled to Konya and strangled there in Safar 1238/November 1822, blamed for the Greek revolt in the Morea {cite:encyclopaedia-of-islam-2 vol. 3 p. 99} {cite:encyclopaedia-of-islam-2 vol. 3 p. 100}."
  ur: "محمد سعید ہالت آفندی عثمانی سیاست دان تھے جو تقریباً 1175ھ/1761ء میں استنبول میں پیدا ہوئے اور ان کے والد کریمیا کے ایک قاضی تھے۔ وہ 1802ء میں فرانس میں سفیر رہے، پھر رئیس الکتّاب اور نشانجی بنے، سلطان محمود ثانی کے ابتدائی برسوں میں غالب حیثیت رکھتے تھے، اور صفر 1238ھ/نومبر 1822ء میں قونیہ جلاوطن کر کے وہیں گلا گھونٹ کر قتل کیے گئے، کیونکہ مورہ کی یونانی بغاوت کی ذمہ داری ان پر ڈالی گئی {cite:encyclopaedia-of-islam-2 vol. 3 p. 99} {cite:encyclopaedia-of-islam-2 vol. 3 p. 100}۔"
  es: "Mehmed Said Halet Efendi fue un estadista otomano nacido en Estambul alrededor de 1175/1761, hijo de un cadí de Crimea. Sirvió como embajador en Francia en 1802, luego como jefe de los secretarios y custodio del sello, ocupó una posición dominante en los primeros años de Mahmud II, y fue exiliado a Konya y estrangulado allí en Safar 1238/noviembre de 1822, culpado de la revuelta griega en Morea {cite:encyclopaedia-of-islam-2 vol. 3 p. 99} {cite:encyclopaedia-of-islam-2 vol. 3 p. 100}."
  fr: "Mehmed Said Halet Efendi était un homme d'État ottoman né à Istanbul vers 1175/1761, fils d'un cadi de Crimée. Il fut ambassadeur en France en 1802, puis chef des secrétaires et gardien du sceau, occupant une position dominante au début du règne de Mahmoud II. Exilé à Konya, il y fut étranglé en Safar 1238/novembre 1822, accusé d'être à l'origine de la révolte grecque en Morée."
  tr: "Mehmet Said Halat Efendi, yaklaşık 1175 Hicri / 1761 yılında İstanbul'da doğan bir Osmanlı devlet adamıydı; babası Kırım'dan bir yargıçtı. 1802 yılında Fransa'ya büyükelçi, yazıcının başı ve ardından mühür denetçisi olarak hizmet etti. Sultan II. Mahmud'un saltanatının ilk yıllarında önemli bir etkiye sahipti. Konya'ya sürgün edildi ve Mağribi Devrimi'nden dolayı insanlar tarafından suçlandıktan sonra 1238 Hicri / Kasım 1822'de orada boğularak öldürüldü {cite:Encyclopaedia-of-Islam-2 cilt 3 s. 99} {cite:Encyclopaedia-of-Islam-2 cilt 3, s. 100}."
  id: "Mehmet Said Halat Efendi adalah seorang negarawan Ottoman yang lahir di Istanbul sekitar tahun 1175 H / 1761 M dari seorang ayah yang merupakan hakim dari Krimea. Ia menjabat sebagai duta besar untuk Prancis pada tahun 1802 M, sebagai kepala juru tulis, kemudian sebagai pengawas segel. Ia memegang pengaruh besar pada tahun-tahun awal pemerintahan Sultan Mahmud II. Ia diasingkan ke Konya dan dicekik di sana pada Safar 1238 H / November 1822 M setelah orang-orang menyalahkannya atas Revolusi Moor {cite:Encyclopaedia-of-Islam-2 vol. 3 hlm. 99} {cite:Encyclopaedia-of-Islam-2 vol. 3 hlm. 100}."
