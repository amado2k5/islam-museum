  - { kind: alternate, lang: ar, value: "محمد سعيد هالت أفندي" }
summary:
  ar: "محمد سعيد هالت أفندي رجل دولة عثماني وُلد في إسطنبول نحو سنة 1175هـ/1761م لأب قاضٍ من القرم. عمل سفيراً في فرنسا سنة 1802م ورئيساً للكتّاب ثم ناظراً للختم، وكان له شأن غالب في السنوات الأولى من عهد السلطان محمود الثاني، ونُفي إلى قونية وخُنق فيها في صفر 1238هـ/نوفمبر 1822م بعد أن حمّله الناس تبعة ثورة المورة {cite:encyclopaedia-of-islam-2 vol. 3 p. 99} {cite:encyclopaedia-of-islam-2 vol. 3 p. 100}."
  en: "Mehmed Said Halet Efendi was an Ottoman statesman born in Istanbul about 1175/1761, the son of a qadi from the Crimea. He served as ambassador to France in 1802, then as chief of the secretaries and keeper of the seal, held a dominant position in the early years of Mahmud II, and was exiled to Konya and strangled there in Safar 1238/November 1822, blamed for the Greek revolt in the Morea {cite:encyclopaedia-of-islam-2 vol. 3 p. 99} {cite:encyclopaedia-of-islam-2 vol. 3 p. 100}."
  ur: "محمد سعید ہالت آفندی عثمانی سیاست دان تھے جو تقریباً 1175ھ/1761ء میں استنبول میں پیدا ہوئے اور ان کے والد کریمیا کے ایک قاضی تھے۔ وہ 1802ء میں فرانس میں سفیر رہے، پھر رئیس الکتّاب اور نشانجی بنے، سلطان محمود ثانی کے ابتدائی برسوں میں غالب حیثیت رکھتے تھے، اور صفر 1238ھ/نومبر 1822ء میں قونیہ جلاوطن کر کے وہیں گلا گھونٹ کر قتل کیے گئے، کیونکہ مورہ کی یونانی بغاوت کی ذمہ داری ان پر ڈالی گئی {cite:encyclopaedia-of-islam-2 vol. 3 p. 99} {cite:encyclopaedia-of-islam-2 vol. 3 p. 100}۔"
