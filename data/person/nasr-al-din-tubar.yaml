summary:
  ar: "\u0642\u0627\u0631\u0626 \u0648\u0645\u0646\u0634\u062f \u0645\u0635\u0631\u064a (1920\u20131986) \u0645\u0646 \u0627\u0644\u0645\u0646\u0632\u0644\u0629 \u0628\u0627\u0644\u062f\u0642\u0647\u0644\u064a\u0629\u060c \u062f\u062e\u0644 \u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0628\u0639\u062f \u0633\u062a \u0645\u062d\u0627\u0648\u0644\u0627\u062a\u060c \u0648\u062a\u0631\u0643 \u0646\u062d\u0648 \u0645\u0626\u062a\u064a \u0627\u0628\u062a\u0647\u0627\u0644\u060c \u0648\u0633\u062c\u0651\u0644 \u0641\u064a 1978 \u0627\u0644\u0645\u0635\u062d\u0641 \u0627\u0644\u0645\u062c\u0648\u062f \u0627\u0644\u0645\u0634\u062a\u0631\u0643 \u0644\u0644\u0625\u0630\u0627\u0639\u0629 \u0648\u0627\u0644\u062a\u0644\u0641\u0632\u064a\u0648\u0646 \u0627\u0644\u0633\u0639\u0648\u062f\u064a\u064a\u0646 \u0645\u0639 \u0645\u062d\u0645\u0648\u062f \u0627\u0644\u0628\u062c\u064a\u0631\u0645\u064a\u060c \u0648\u0642\u0627\u062f \u0641\u0631\u0642\u0629 \u0627\u0644\u0625\u0646\u0634\u0627\u062f \u0627\u0644\u062f\u064a\u0646\u064a \u0628\u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0629 \u0627\u0644\u0641\u0646\u0648\u0646 \u0645\u0646 1980\u060c \u0648\u0623\u0646\u0634\u062f \u0641\u064a \u0642\u0627\u0639\u0629 \u0623\u0644\u0628\u0631\u062a \u0641\u064a \u0644\u0646\u062f\u0646."
  en: "Egyptian reciter and munshid (1920\u20131986) from al-Manzala in Dakahlia who entered the radio after six failed tests, left some two hundred ibtihalat, recorded in 1978 the joint mujawwad Qur'an for Saudi radio and television with Mahmoud al-Bujayrimi, led the religious-song ensemble of Egypt's Academy of Arts from 1980 and sang at the Royal Albert Hall in London."
  ur: "\u062f\u0642\u06c1\u0644\u06cc\u06c1 \u06a9\u06d2 \u0627\u0644\u0645\u0646\u0632\u0644\u06c1 \u0633\u06d2 \u0645\u0635\u0631\u06cc \u0642\u0627\u0631\u06cc \u0627\u0648\u0631 \u0645\u0646\u0634\u062f (1920\u0621\u20131986\u0621)\u060c \u062c\u0648 \u0686\u06be \u0646\u0627\u06a9\u0627\u0645 \u06a9\u0648\u0634\u0634\u0648\u06ba \u06a9\u06d2 \u0628\u0639\u062f \u0631\u06cc\u0688\u06cc\u0648 \u0645\u06cc\u06ba \u0622\u0626\u06d2\u060c \u062a\u0642\u0631\u06cc\u0628\u0627\u064b \u062f\u0648 \u0633\u0648 \u0627\u0628\u062a\u06c1\u0627\u0644\u0627\u062a \u0686\u06be\u0648\u0691\u06cc\u06ba\u060c 1978\u0621 \u0645\u06cc\u06ba \u0645\u062d\u0645\u0648\u062f \u0627\u0644\u0628\u062c\u06cc\u0631\u0645\u06cc \u06a9\u06d2 \u0633\u0627\u062a\u06be \u0633\u0639\u0648\u062f\u06cc \u0631\u06cc\u0688\u06cc\u0648 \u0627\u0648\u0631 \u0679\u06cc\u0644\u06cc \u0648\u0698\u0646 \u06a9\u0627 \u0645\u0634\u062a\u0631\u06a9\u06c1 \u0645\u062c\u0648\u062f \u0645\u0635\u062d\u0641 \u0631\u06cc\u06a9\u0627\u0631\u0688 \u06a9\u06cc\u0627\u060c 1980\u0621 \u0633\u06d2 \u0627\u06a9\u06cc\u0688\u0645\u06cc \u0622\u0641 \u0622\u0631\u0679\u0633 \u06a9\u06d2 \u062f\u06cc\u0646\u06cc \u0627\u0646\u0634\u0627\u062f \u06a9\u06d2 \u0637\u0627\u0626\u0641\u06d2 \u06a9\u06cc \u0642\u06cc\u0627\u062f\u062a \u06a9\u06cc \u0627\u0648\u0631 \u0644\u0646\u062f\u0646 \u06a9\u06d2 \u0631\u0627\u0626\u0644 \u0627\u0644\u0628\u0631\u0679 \u06c1\u0627\u0644 \u0645\u06cc\u06ba \u0627\u0646\u0634\u0627\u062f \u06a9\u06cc\u0627\u06d4"
