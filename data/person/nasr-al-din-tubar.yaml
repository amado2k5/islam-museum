summary:
  ar: "قارئ ومنشد مصري (1920–1986) من المنزلة بالدقهلية، دخل الإذاعة بعد ست محاولات، وترك نحو مئتي ابتهال، وسجّل في 1978 المصحف المجود المشترك للإذاعة والتلفزيون السعوديين مع محمود البجيرمي، وقاد فرقة الإنشاد الديني بأكاديمية الفنون من 1980، وأنشد في قاعة ألبرت في لندن."
  en: "Egyptian reciter and munshid (1920–1986) from al-Manzala in Dakahlia who entered the radio after six failed tests, left some two hundred ibtihalat, recorded in 1978 the joint mujawwad Qur'an for Saudi radio and television with Mahmoud al-Bujayrimi, led the religious-song ensemble of Egypt's Academy of Arts from 1980 and sang at the Royal Albert Hall in London."
  ur: "دقہلیہ کے المنزلہ سے مصری قاری اور منشد ⁦(1920ء–1986ء)⁩، جو چھ ناکام کوششوں کے بعد ریڈیو میں آئے، تقریباً دو سو ابتہالات چھوڑیں، 1978ء میں محمود البجیرمی کے ساتھ سعودی ریڈیو اور ٹیلی وژن کا مشترکہ مجود مصحف ریکارڈ کیا، 1980ء سے اکیڈمی آف آرٹس کے دینی انشاد کے طائفے کی قیادت کی اور لندن کے رائل البرٹ ہال میں انشاد کیا۔"
