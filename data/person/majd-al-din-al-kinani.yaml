summary:
  ar: "قاضي قضاة الحنفية بمصر؛ برع في الفقه والأصول والفرائض والحساب والأدب وشارك في الحديث والنحو والقراءات، وله ديوان شعر في مجلد، وقال المقريزي: صحبته مدة أعوام وأخذت عنه فوائد وكان لي به أنس — إلا أنه امتحن بالقضاء في دنياه {cite:shadharat-dhahab p. 24}."
  en: "Egypt's Hanafi chief qadi with a bound volume of verse — al-Maqrizi's own teacher: 'I kept his company years and took benefits from him' {cite:shadharat-dhahab p. 24}."
  es: "El cadí principal hanafi de Egipto con un volumen encuadernado de versos — el propio maestro de al-Maqrizi: 'Estuve en su compañía durante años y obtuve beneficios de él' {cite:shadharat-dhahab p. 24}."
  fr: "Le cadi en chef hanafite d'Égypte avec un volume relié de versets — le propre maître d'al-Maqrizi: « J'ai fréquenté sa compagnie pendant des années et j'ai tiré profit de lui » {cite: shadharat-dhahab p. 24}."
  ur: "مصر کا حنفی سردار قادی جس کی آیت کا ایک حجم ہے - المقرزی کے اپنے استاد: 'میں نے ان کی صحبت کے سال برقرار رکھے اور ان سے فائدہ اٹھایا'۔ 24}۔"
  tr: "Mısır'da Hanefi hakimi; fıkıh, prensipler, miras, aritmetik ve edebiyatta üstün başarı gösterdi, hadis, dilbilgisi ve okuma çalışmalarına katıldı. Tek ciltlik bir şiir koleksiyonu vardır. El-Maqrizi şöyle dedi: Onunla uzun yıllar birlikte oldum, ondan fayda sağladım ve yakın bir ilişkim vardı — fakat dünyevi hayatında yargı yargısında sınandı {alıntı:şadharat-dhahab, s. 24}."
  id: "Hakim Hanafi di Mesir; ia unggul dalam bidang hukum, prinsip, warisan, aritmatika, dan sastra, serta berpartisipasi dalam hadis, tata bahasa, dan pembacaan. Ia memiliki kumpulan puisi dalam satu jilid. Al-Maqrizi berkata: Saya menemaninya selama bertahun-tahun dan mendapat manfaat darinya, dan saya memiliki hubungan dekat dengannya — tetapi ia diuji dalam penilaian hukum dalam kehidupan duniawinya {sitasi: Shadharat-Dhahab, hlm. 24}."
