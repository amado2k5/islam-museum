id: person/yusuf-buluggin-ibn-ziri
class: person
label: { ar: "يوسف بلكين بن زيري" }
died: { edtf: "0984~", hijri: "0373-12", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم الأحد لسبع بقين من ذي الحجة سنة ثلاث وسبعين بموضع يقال له برغلان مجاور إفريقية، وكانت علته القولنج وقيل خرجت في يده بثرة فمات منها {cite:shadharat-dhahab p. 80}." }
summary:
  ar: "ابن زيري بن مناد الصنهاجي، ويسمى أيضاً بوسف لكن بلكين أشهر؛ استخلفه المعز لدين الله على بلاد المغرب حين خرج إلى مصر واستولى على إفريقية وقسطنطينة وحوض تلمسان وغيرها، ولما مات المعز سنة 365هـ أقره العزيز على ولاية إفريقية فاستبد بملكها وعظم أمره {cite:kamil-ibn-al-athir p. 488-489}. وكان استخلاف المعز إياه يوم الأربعاء ثالث عشر ذي الحجة سنة إحدى وستين وثلاثمائة وأمر الناس بالسمع والطاعة له وسلّمه البلاد وأوصاه أموراً كثيرة ثم قال: إن نسيت ما أوصيتك به فلا تنس ثلاثة أشياء: إياك أن ترفع الجناية عن أهل البادية، والسيف عن البربر، ولا تولّ أحداً من إخوتك وبني عمك فإنهم يزعمون أنهم أحق بهذا الأمر منك، وافعل مع أهل الحاضرة خيراً {cite:shadharat-dhahab p. 80}."
  en: "Son of Ziri ibn Manad the Sanhaji; al-Mu'izz left him over the Maghrib on departing for Egypt, and al-Aziz confirmed him over Ifriqiya in 365, whence his power grew {cite:kamil-ibn-al-athir p. 488-489}."
  es: "Hijo de Ziri ibn Manad el Sanhaji; al-Mu'izz lo dejó al frente del Magreb al partir hacia Egipto, y al-Aziz lo confirmó al frente de Ifriqiya en 365, de donde creció su poder {cite:kamil-ibn-al-athir p. 488-489}."
  fr: "Fils de Ziri ibn Manad le Sanhaji; al-Mu'izz le laissa sur le Maghreb en partant pour l'Égypte, et al-Aziz le confirma sur l'Ifriqiya en 365, d'où son pouvoir grandit {cite:kamil-ibn-al-athir p. 488-489}."
  ur: "زری ابن مناد سنھاجی کا بیٹا؛ المعز نے اسے مغرب کے وقت مصر کے لیے چھوڑ دیا، اور العزیز نے اسے 365 میں عفریقیہ پر تصدیق کر دی، جہاں سے اس کی طاقت میں اضافہ ہوا۔ 488-489}۔"
  tr: "İbn Ziri ibn Mnaad al-Sanhaji, aynı zamanda Busif olarak da bilinir ama Balkin daha ünlüdür; Mısır'a gidip İfrikiye, Konstantin, Tlemcen havzası ve diğerlerini ele geçirdiğinde el-Mu'izz li-Din Allah'ın Mağrip üzerindeki halefi olarak atanmıştır. El-Muizz 365 Hicri yılında öldüğünde, el-Aziz onu İfrikiye valisi olarak atadı, yönetimini ele geçirdi ve otoritesini yükseltti {atıf:kamil-ibn-al-athir s. 488-489}. Al-Mu'izz, 361 H.Hicce ayının 13'ü Çarşamba günü onu vekil olarak atadı. Halkı dinlemeye ve itaat etmeye emretti, toprakları teslim etti ve birçok konuda ona tavsiye verdi. Sonra dedi ki: Sana verdiğim tavsiyeleri unutursan, üç şeyi unutma: suçu çöl halkından ve kılıcı Berberilerden çıkarma. Kardeşlerinden ya da kuzenlerinden hiçbirini atama, çünkü onlar bu işin senden daha fazla hak sahibi olduğunu iddia ediyorlar. Şehir halkına iyilik yap {cite:shadharat-dhahab s. 80}."
  id: "Ibn Ziri ibn Mnaad al-Sanhaji, juga disebut Busuf tetapi Balkin, lebih terkenal; ia diangkat sebagai penerus al-Mu'izz li-Din Allah atas Maghreb ketika ia pergi ke Mesir dan merebut Ifriqiya, Konstantinus, cekungan Tlemcen, dan lainnya. Ketika al-Mu'izz wafat pada tahun 365 H, al-Aziz mengangkatnya sebagai gubernur Ifriqiya, merebut kekuasaannya dan meningkatkan otoritasnya {cite:kamil-ibn-al-athir hlm. 488-489}. Al-Mu'izz mengangkatnya sebagai wakilnya pada hari Rabu, 13 Dhu al-Hijjah, 361 H. Dia memerintahkan rakyat untuk mendengarkan dan menaatinya, menyerahkan tanah, dan memberi nasihat tentang banyak hal. Kemudian dia berkata: Jika kamu lupa apa yang telah kuberitahu, jangan lupa tiga hal: jangan pernah menghapus kejahatan dari penduduk gurun, dan pedang dari orang Berber. Jangan tunjuk saudara atau sepupu kamu, karena mereka mengaku lebih berhak atas perkara ini daripada kamu. Berbuat baik kepada penduduk kota {cite:shadharat-dhahab hlm. 80}."
