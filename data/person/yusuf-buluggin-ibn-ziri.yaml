id: person/yusuf-buluggin-ibn-ziri
class: person
label: { ar: "يوسف بلكين بن زيري" }
died: { edtf: "0984~", hijri: "0373-12", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم الأحد لسبع بقين من ذي الحجة سنة ثلاث وسبعين بموضع يقال له برغلان مجاور إفريقية، وكانت علته القولنج وقيل خرجت في يده بثرة فمات منها {cite:shadharat-dhahab p. 80}." }
summary:
  ar: "ابن زيري بن مناد الصنهاجي، ويسمى أيضاً بوسف لكن بلكين أشهر؛ استخلفه المعز لدين الله على بلاد المغرب حين خرج إلى مصر واستولى على إفريقية وقسطنطينة وحوض تلمسان وغيرها، ولما مات المعز سنة 365هـ أقره العزيز على ولاية إفريقية فاستبد بملكها وعظم أمره {cite:kamil-ibn-al-athir p. 488-489}. وكان استخلاف المعز إياه يوم الأربعاء ثالث عشر ذي الحجة سنة إحدى وستين وثلاثمائة وأمر الناس بالسمع والطاعة له وسلّمه البلاد وأوصاه أموراً كثيرة ثم قال: إن نسيت ما أوصيتك به فلا تنس ثلاثة أشياء: إياك أن ترفع الجناية عن أهل البادية، والسيف عن البربر، ولا تولّ أحداً من إخوتك وبني عمك فإنهم يزعمون أنهم أحق بهذا الأمر منك، وافعل مع أهل الحاضرة خيراً {cite:shadharat-dhahab p. 80}."
  en: "Son of Ziri ibn Manad the Sanhaji; al-Mu'izz left him over the Maghrib on departing for Egypt, and al-Aziz confirmed him over Ifriqiya in 365, whence his power grew {cite:kamil-ibn-al-athir p. 488-489}."
