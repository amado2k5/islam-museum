summary:
  ar: "ساجد جاويد (وُلد في 5 كانون الأول 1969 في روتشديل، لانكشاير)، مصرفي سابق وسياسي محافظ بريطاني، ابن مهاجرين باكستانيين، كان عضو البرلمان عن برومزغروف 2010–2024. عمل مديرًا إداريًا في دويتشه بنك قبل السياسة، وتولى مناصب وزارية متتابعة — الثقافة والأعمال والمجتمعات — فصار أول مسلم يتولى إحدى المناصب العليا في الدولة وزيرًا للداخلية (2018–2019)، ثم وزيرًا للمالية (2019–2020) ووزيرًا للصحة والرعاية الاجتماعية (2021–2022)."
  en: "Sir Sajid Javid (born 5 December 1969 in Rochdale, Lancashire) is a British former banker and Conservative politician, the son of Pakistani immigrants, who was MP for Bromsgrove from 2010 to 2024. A managing director at Deutsche Bank before politics, he held a succession of cabinet posts - Culture, Business and Communities - becoming the first Muslim to hold one of the Great Offices of State as Home Secretary (2018-2019), then Chancellor of the Exchequer (2019-2020) and Secretary of State for Health and Social Care (2021-2022)."
  ur: "ساجد جاوید (پیدائش 5 دسمبر 1969، روچڈیل، لنکاشائر) برطانوی سابق بینکار اور کنزرویٹو سیاست دان ہیں، جو پاکستانی مہاجر والدین کے بیٹے ہیں اور 2010 سے 2024 تک برومزگرو کے رکن پارلیمنٹ رہے۔ سیاست سے پہلے وہ ڈوئچے بینک کے مینیجنگ ڈائریکٹر تھے، پھر یکے بعد دیگرے کابینہ عہدوں پر رہے — ثقافت، کاروبار اور کمیونٹیز — اور وزیرِ داخلہ (2018–2019) کی حیثیت سے ریاست کے عظیم عہدوں میں سے کوئی ایک سنبھالنے والے پہلے مسلمان بنے، پھر وزیرِ خزانہ (2019–2020) اور وزیرِ صحت و سماجی دیکھ بھال (2021–2022) رہے۔"

