summary:
  ar: "روم محمد باشا، من وزراء محمد الفاتح؛ ينقل الصلابي أنه لما ضُمت إمارة القرمان إلى الدولة وأُمر بنقل العمال والصناع إلى القسطنطينية، ظلم روم محمد باشا الناس، ومن بينهم بعض العلماء وأهل الفضل مثل العالم أحمد جلبي بن السلطان أمير علي، فلما علم الفاتح بأمره اعتذر إليه وأعاده إلى وطنه مع رفقائه معززاً مكرماً {cite:dawlat-uthmaniyya-salabi p. 139}."
  en: "Rum Mehmed Pasha, a vizier of Mehmed II; al-Salabi records that when the Karamanid emirate was annexed and its craftsmen ordered transferred to Constantinople, Rum Mehmed wronged the deportees — among them scholars such as Ahmad Çelebi ibn Amir Ali — and when the sultan learned of it he apologised to the scholar and returned him and his companions home in honour {cite:dawlat-uthmaniyya-salabi p. 139}."
