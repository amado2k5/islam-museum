id: person/yala-ibn-muhammad-al-yafrani
class: person
label:
  ar: يعلى بن محمد اليفرني
  en: Ya'la ibn Muhammad al-Yafrani
summary:
  ar: "يعلى بن محمد بن صالح اليفرني، أمير زناتة بالمغرب؛ خلف أباه لما هلك على يد عبد الله بن بكار المتحيز إلى مغراوة فعظم صيته واختط مدينة إيفكان، ولما خطب عبد الرحمن الناصر طاعة الأموية من ملوك زناتة سارع لإجابته فملك وهران سنة 343هـ من يد محمد بن عون ودخلها عنوة وخربها، وزحف مع الخير بن محمد إلى تاهرت فهزم شيعة ميسور الخصي وملكوها، واستفحل سلطانه فخطب على منابر المغرب للناصر ما بين تاهرت إلى طنجة، واستأذن في الجهاد بالأندلس فأجاز، حتى أغزى المعز لدين الله كاتبه جوهراً إلى المغرب سنة 347هـ فبادر إلى الإذعان ونبذ عهد الأموية، فتقبله جوهر وأضمر الفتك به فأوقع نفرة في أعقاب العسكر وقتله يعلى في هيعتها غصاً بالرماح وذهب دمه هدراً، وخرب جوهر مدينة إيفكان وانقرضت الدولة الأولى لبني يفرن."
  en: "Ya'la ibn Muhammad ibn Salih al-Yafrani, amir of Zanata in the Maghreb; succeeding his father killed by a Maghrawa partisan, he founded the city of Ifkan, answered al-Nasir's Umayyad call, took and razed Wahran in 343, beat the Fatimid eunuch Maysur's men at Tahert, and his sultanate swelled until the khutba for al-Nasir rang from Tahert to Tangier — he crossed to jihad in Andalus, then in 347, when the Fatimid katib Jawhar marched west, Ya'la rushed to submit and renounced the Umayyad pact; Jawhar feigned acceptance, sprung an ambush, and Ya'la died choked on Kutama and Sanhaja spears, Ifkan razed and the first Yafranid state ended."
