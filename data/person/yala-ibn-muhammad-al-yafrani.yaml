id: person/yala-ibn-muhammad-al-yafrani
class: person
label:
  ar: يعلى بن محمد اليفرني
  en: Ya'la ibn Muhammad al-Yafrani
  es: "Ya'la ibn Muhammad al-Yafrani"
  fr: "Ya'la ibn Muhammad al-Yafrani"
  ur: "یعلیٰ ابن محمد الیفرانی"
summary:
  ar: "يعلى بن محمد بن صالح اليفرني، أمير زناتة بالمغرب؛ خلف أباه لما هلك على يد عبد الله بن بكار المتحيز إلى مغراوة فعظم صيته واختط مدينة إيفكان، ولما خطب عبد الرحمن الناصر طاعة الأموية من ملوك زناتة سارع لإجابته فملك وهران سنة 343هـ من يد محمد بن عون ودخلها عنوة وخربها، وزحف مع الخير بن محمد إلى تاهرت فهزم شيعة ميسور الخصي وملكوها، واستفحل سلطانه فخطب على منابر المغرب للناصر ما بين تاهرت إلى طنجة، واستأذن في الجهاد بالأندلس فأجاز، حتى أغزى المعز لدين الله كاتبه جوهراً إلى المغرب سنة 347هـ فبادر إلى الإذعان ونبذ عهد الأموية، فتقبله جوهر وأضمر الفتك به فأوقع نفرة في أعقاب العسكر وقتله يعلى في هيعتها غصاً بالرماح وذهب دمه هدراً، وخرب جوهر مدينة إيفكان وانقرضت الدولة الأولى لبني يفرن."
  en: "Ya'la ibn Muhammad ibn Salih al-Yafrani, amir of Zanata in the Maghreb; succeeding his father killed by a Maghrawa partisan, he founded the city of Ifkan, answered al-Nasir's Umayyad call, took and razed Wahran in 343, beat the Fatimid eunuch Maysur's men at Tahert, and his sultanate swelled until the khutba for al-Nasir rang from Tahert to Tangier — he crossed to jihad in Andalus, then in 347, when the Fatimid katib Jawhar marched west, Ya'la rushed to submit and renounced the Umayyad pact; Jawhar feigned acceptance, sprung an ambush, and Ya'la died choked on Kutama and Sanhaja spears, Ifkan razed and the first Yafranid state ended."
  es: "Ya'la ibn Muhammad ibn Salih al-Yafrani, emir de Zanata en el Magreb; sucediendo a su padre, asesinado por un partisano maghrawa, fundó la ciudad de Ifkan, respondió al llamado omeya de al-Nasir, tomó y arrasó Wahran en 343, derrotó a los hombres del eunuco fatimí Maysur en Tahert, y su sultanato creció hasta que el sermón de al-Nasir resonó desde Tahert hasta Tánger; cruzó a la yihad en Al-Ándalus, luego en 347, cuando el katib fatimí Jawhar marchó hacia el oeste, Ya'la se apresuró a someterse y renunció al pacto omeya; Jawhar fingió aceptarlo, le tendió una emboscada, y Ya'la murió asfixiado por lanzas de Kutama y Sanhaja, Ifkan fue arrasada y el primer estado yafraní llegó a su fin."
  fr: "Ya'la ibn Muhammad ibn Salih al-Yafrani, émir de Zanata au Maghreb, succéda à son père tué par un partisan maghrébin. Il fonda la ville d'Ifkan, répondit à l'appel omeyyade d'al-Nasir, prit et rasa Wahran en 343, vainquit les hommes de l'eunuque fatimide Maysur à Tahert, et son sultanat s'étendit au point que le sermon d'al-Nasir résonna de Tahert à Tanger. Il traversa ensuite pour mener le jihad en Andalousie, puis en 347, lorsque le katib fatimide Jawhar marcha vers l'ouest, Ya'la se précipita pour se soumettre et renonça au pacte omeyyade. Jawhar feignit d'accepter, tendit une embuscade, et Ya'la mourut étranglé par les lances de Kutama et de Sanhaja. Ifkan fut rasée et le premier État yafranide prit fin."
  ur: "یعلی بن محمد بن صالح ال یفرانی، مغرب میں زناتا کے امیر؛ اپنے والد کے بعد مغراوہ کے متعصب کے ہاتھوں مارے جانے کے بعد، اس نے افکان شہر کی بنیاد رکھی، الناصر کی اموی دعوت کا جواب دیا، 343 میں وہران پر قبضہ کیا اور اسے مسمار کیا، طہرت میں فاطمی خواجہ سرا میسور کے آدمیوں کو شکست دی، اور اس کی سلطنت اس وقت تک پھیل گئی جب تک کہ النصیر کے خطبہ سے اس نے تنجیر کو عبور نہیں کیا۔ پھر 347 میں، جب فاطمی کاتب جواہر نے مغرب کی طرف کوچ کیا تو یعلٰی جمع ہونے کے لیے دوڑ پڑے اور اموی معاہدے سے دستبردار ہو گئے۔ جوہر نے قبولیت کا دعویٰ کیا، گھات لگا کر حملہ کیا، اور یالا کٹاما اور سنہاجا نیزوں پر دم گھٹنے سے مر گیا، افکان مسمار ہوا اور پہلی یافرانیڈ ریاست کا خاتمہ ہوا۔"
