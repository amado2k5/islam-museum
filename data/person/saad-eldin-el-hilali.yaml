summary:
  ar: "أستاذ الفقه المقارن بكلية الشريعة والقانون في جامعة الأزهر بالقاهرة، وُلد في المنصورة سنة 1954. تولى عمادة كليتي الدراسات الإسلامية والعربية بأسوان ودمياط ورئاسة قسم الفقه والأصول بكلية الشريعة في جامعة الكويت، وله مؤلفات كثيرة في الفقه المقارن وقضاياه المعاصرة. يعرفه الجمهور من فقرته الدينية الثابتة في برنامج «الحكاية» مع عمرو أديب على قناة إم بي سي مصر منذ انطلاق البرنامج سنة 2018، ومنهجه المعلن أن يعرض آراء الفقهاء جميعًا دون إخفاء."
  en: "Professor of comparative fiqh at Al-Azhar University's Faculty of Sharia and Law in Cairo, born in Mansoura in 1954. He served as dean of Al-Azhar's faculties of Islamic and Arabic studies in Aswan and Damietta and headed the Department of Fiqh and Usul at Kuwait University's Faculty of Sharia, and has written numerous books on comparative fiqh and its contemporary questions. The wider public knows him for the standing religious segment he has held on Amr Adib's Al-Hekaya on MBC Masr since the programme's launch in 2018, and for his stated method of presenting all the jurists' opinions without concealment."
  ur: "قاہرہ میں جامعہ ازہر کے کلیۂ شریعت و قانون میں فقہ مقارن کے پروفیسر، 1954 میں منصورہ میں پیدا ہوئے۔ وہ اسوان اور دمیاط میں ازہر کے کلیاتِ مطالعاتِ اسلامیہ و عربیہ کے ڈین اور جامعہ کویت کے کلیۂ شریعت میں شعبۂ فقہ و اصول کے سربراہ رہے، اور فقہ مقارن اور اس کے عصری مسائل پر ان کی بہت سی کتابیں ہیں۔ عوام انہیں 2018 میں پروگرام کے آغاز سے عمرو أديب کے «الحكاية» ⁦(ایم بی سی مصر)⁩ میں ان کے مستقل دینی حصے اور اس اعلانیہ منہج سے جانتے ہیں کہ وہ فقہاء کی تمام آراء بغیر چھپائے پیش کرتے ہیں۔"
  es: "Profesor de fiqh comparado en la Facultad de Sharia y Derecho de la Universidad de Al-Azhar en El Cairo, nacido en Mansoura en 1954. Fue decano de las facultades de estudios islámicos y árabes de Al-Azhar en Asuán y Damietta, y dirigió el Departamento de Fiqh y Usul en la Facultad de Sharia de la Universidad de Kuwait. Es autor de numerosos libros sobre fiqh comparado y sus problemáticas contemporáneas. El público en general lo conoce por su sección religiosa habitual en el programa Al-Hekaya de Amr Adib en MBC Masr desde su lanzamiento en 2018, y por su método de presentar las opiniones de todos los juristas sin reservas."
