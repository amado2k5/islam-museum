label: { ar: "ابن المعلم", en: "Ibn Al Muallim" }
summary:
  ar: "أبو عبد الله ابن المعلم في عصر ابن النديم انتهت رياسة متكلمي الشيعة إليه مقدم في صناعة الكلام على مذهب أصحابه دقيق الفطنة ماضي الخاطر، قال ابن النديم شاهدته فرأيته بارعا {cite:fihrist-ibn-al-nadim p. 252}. وهو محمد بن المعلم شيخ الإمامية ببغداد ورفيق الشريف المرتضى وأستاذه، أورده ابن الجوزي في وفيات سنة ٤١٣ {cite:muntazam-ibn-al-jawzi j.8 p.353}."
  en: "Ibn al-Mu'allim — head of the Shi'i mutakallimun in Ibn al-Nadim's day {cite:fihrist-ibn-al-nadim}"
