label: { ar: "ابن المعلم", en: "Ibn Al Muallim", es: "Ibn Al Muallim", fr: "Ibn Al Muallim", ur: "ابن المعلم" }
summary:
  ar: "أبو عبد الله ابن المعلم في عصر ابن النديم انتهت رياسة متكلمي الشيعة إليه مقدم في صناعة الكلام على مذهب أصحابه دقيق الفطنة ماضي الخاطر، قال ابن النديم شاهدته فرأيته بارعا {cite:fihrist-ibn-al-nadim p. 252}. وهو محمد بن المعلم شيخ الإمامية ببغداد ورفيق الشريف المرتضى وأستاذه، أورده ابن الجوزي في وفيات سنة ٤١٣ {cite:muntazam-ibn-al-jawzi j.8 p.353}."
  en: "Ibn al-Mu'allim — head of the Shi'i mutakallimun in Ibn al-Nadim's day {cite:fihrist-ibn-al-nadim}"
  es: "Ibn al-Mu'allim - jefe del mutakallimun chiíta en la época de Ibn al-Nadim {cita:fihrist-ibn-al-nadim}"
  fr: "Ibn al-Mu'allim - chef du mutakallimun chiite à l'époque d'Ibn al-Nadim {cite: fihrist-ibn-al-nadim}"
  ur: "ابن المعلم - ابن الندیم کے دور میں شیعہ متکلموں کے سربراہ"
  tr: "Ebu Abdullah ibn el-Mu'allim, İbn el-Nadim döneminde Şii teologların liderliği, onun yoldaşlarının öğretilerine göre ilahiyat sanatında öncü, kesin ve zeki ve bilge olmasıyla sona erdi. İbn el-Nadim şöyle dedi: Onu gördüm ve usta olarak gördüm {atı:fihrist-ibn-al-nadim s. 252}. O, Bağdat'taki İmamiyiye'nin şeyhi Muhammed ibn al-Mu'allim'dir; Şerif Murtada'nın yoldaşı ve öğretmenidir. İbn el-Cewzi onu 413 yılında anmıştır {atıf:Muntazam-ibn-al-jawzi J.8 s.353}."
  id: "Abu Abdullah ibn al-Mu'allim pada era Ibn al-Nadim Kepemimpinan teolog Syiah berakhir dengan ia sebagai pelopor dalam seni teologi menurut doktrin para sahabatnya, tepat, cerdas, dan bijaksana. Ibn al-Nadim berkata: Saya melihatnya dan melihatnya sebagai seorang guru {cite:fihrist-ibn-al-nadim hlm. 252}. Ia adalah Muhammad ibn al-Mu'allim, Sheikh Imamiyyah di Baghdad, sahabat dan guru Sharif al-Murtada. Ibn al-Jawzi menyebutnya pada tahun 413 {cite:Muntazam-ibn-al-jawzi J.8 hlm.353}."
