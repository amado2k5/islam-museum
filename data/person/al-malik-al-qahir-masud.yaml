summary:
  ar: "صاحب الموصل السلطان الملك القاهر عز الدين أبو الفتح مسعود بن السلطان نور الدين أرسلان شاه بن مسعود الأتابكي الزنكي؛ ولد سنة تسعين وخمسمائة وتملك بعد أبيه وله سبع عشرة سنة وكان موصوفاً بالملاحة والعدل والسماحة؛ قيل إنه سُمّ ومات في ربيع الآخر سنة خمس عشرة وستمائة وله خمس وعشرون سنة وعظم على الرعية فقده؛ وولي بعده بعهد منه ولده نور الدين أرسلان شاه ويسمى أيضاً علياً وله عشر سنين فمات في أواخر السنة أيضاً {cite:shadharat-dhahab p. 62}."
