id: person/al-malik-al-qahir-masud
class: person
label: { ar: "الملك القاهر مسعود", en: "al-Malik al-Qahir Mas'ud", es: "al-Malik al-Qahir Mas'ud", fr: "al-Malik al-Qahir Mas'ud", ur: "الملک القاہر مسعود" }
summary:
  ar: "صاحب الموصل السلطان الملك القاهر عز الدين أبو الفتح مسعود بن السلطان نور الدين أرسلان شاه بن مسعود الأتابكي الزنكي؛ ولد سنة تسعين وخمسمائة وتملك بعد أبيه وله سبع عشرة سنة وكان موصوفاً بالملاحة والعدل والسماحة؛ قيل إنه سُمّ ومات في ربيع الآخر سنة خمس عشرة وستمائة وله خمس وعشرون سنة وعظم على الرعية فقده؛ وولي بعده بعهد منه ولده نور الدين أرسلان شاه ويسمى أيضاً علياً وله عشر سنين فمات في أواخر السنة أيضاً {cite:shadharat-dhahab p. 62}."
  en: "Lord of Mosul, Sultan al-Malik al-Qahir Izz al-Din Abu'l-Fath Mas'ud, son of Sultan Nur al-Din Arslan Shah ibn Mas'ud al-Atabegi al-Zengi. He was born in 590 and succeeded his father at seventeen; he was described as handsome, just and generous. It was said that he was poisoned; he died in Rabi' II 615, aged twenty-five, and his loss weighed heavily on his subjects. He was succeeded, by his own appointment, by his son Nur al-Din Arslan Shah, also called Ali, who was ten years old and died later the same year {cite:shadharat-dhahab p. 62}."
  es: "Señor de Mosul, Sultan al-Malik al-Qahir Izz al-Din Abu'l-Fath Mas'ud, hijo de Sultan Nur al-Din Arslan Shah ibn Mas'ud al-Atabegi al-Zengi. Nació en 590 y sucedió a su padre a los diecisiete años; se le describía como apuesto, justo y generoso. Se decía que había sido envenenado; murió en Rabi' II de 615, a los veinticinco años, y su pérdida afectó profundamente a sus súbditos. Le sucedió, por designación propia, su hijo Nur al-Din Arslan Shah, también llamado Ali, que tenía diez años y murió ese mismo año {cite:shadharat-dhahab p. 62}."
  fr: "Le sultan al-Malik al-Qahir Izz al-Din Abu'l-Fath Mas'ud, fils du sultan Nur al-Din Arslan Shah ibn Mas'ud al-Atabegi al-Zengi, était un seigneur de Mossoul. Né en 590, il succéda à son père à l'âge de dix-sept ans. On le décrivait comme beau, juste et généreux. La rumeur prétendait qu'il avait été empoisonné; il mourut en Rabi' II 615, à l'âge de vingt-cinq ans, et sa disparition fut un coup dur pour ses sujets. Son fils, Nur al-Din Arslan Shah, également appelé Ali, lui succéda de son propre chef. Âgé de dix ans, il mourut la même année (voir: shadharat-dhahab, p. 62)."
  ur: "موصل کا رب، سلطان الملک القاہر عزالدین ابوالفتح مسعود، سلطان نورالدین ارسلان شاہ ابن مسعود العتیبیگی الزینگی کا بیٹا۔ وہ 590 میں پیدا ہوئے اور سترہ سال کی عمر میں اپنے والد کی جانشین ہوئے۔ اسے خوبصورت، انصاف پسند اور فیاض کے طور پر بیان کیا گیا تھا۔ کہا گیا کہ اسے زہر دیا گیا تھا۔ ان کا انتقال ربیع الثانی 615ء میں ہوا، اس کی عمر پچیس سال تھی، اور اس کا نقصان ان کی رعایا پر بہت زیادہ تھا۔ ان کی جگہ ان کے بیٹے نورالدین ارسلان شاہ نے، جس کو علی بھی کہا جاتا ہے، ان کی اپنی تقرری سے، جو دس سال کے تھے اور اسی سال بعد میں وفات پا گئے۔ 62}۔"
