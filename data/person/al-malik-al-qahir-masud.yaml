label: { ar: "الملك القاهر مسعود", en: "al-Malik al-Qahir Mas'ud" }
summary:
  ar: "صاحب الموصل السلطان الملك القاهر عز الدين أبو الفتح مسعود بن السلطان نور الدين أرسلان شاه بن مسعود الأتابكي الزنكي؛ ولد سنة تسعين وخمسمائة وتملك بعد أبيه وله سبع عشرة سنة وكان موصوفاً بالملاحة والعدل والسماحة؛ قيل إنه سُمّ ومات في ربيع الآخر سنة خمس عشرة وستمائة وله خمس وعشرون سنة وعظم على الرعية فقده؛ وولي بعده بعهد منه ولده نور الدين أرسلان شاه ويسمى أيضاً علياً وله عشر سنين فمات في أواخر السنة أيضاً {cite:shadharat-dhahab p. 62}."
  en: "Lord of Mosul, Sultan al-Malik al-Qahir Izz al-Din Abu'l-Fath Mas'ud, son of Sultan Nur al-Din Arslan Shah ibn Mas'ud al-Atabegi al-Zengi. He was born in 590 and succeeded his father at seventeen; he was described as handsome, just and generous. It was said that he was poisoned; he died in Rabi' II 615, aged twenty-five, and his loss weighed heavily on his subjects. He was succeeded, by his own appointment, by his son Nur al-Din Arslan Shah, also called Ali, who was ten years old and died later the same year {cite:shadharat-dhahab p. 62}."
