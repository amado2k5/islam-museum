summary:
  ar: "مورّق بن مشمرج، أبو المعتمر العجلي، البصري ويقال الكوفي، إمام تابعي، روى عن أنس بن مالك وجندب بن عبد الله البجلي وعبد الله بن عياش وعبد الله بن عمر وغيرهم، وروى عنه أبان بن أبي عياش وإسماعيل بن أبي خالد وتوبة العنبري وغيرهم. قال النسائي وابن سعد إنه ثقة، وذكره ابن حبان في الثقات. وقال أبو علي المروذي إنه كان يحج مع ابن عمر ويصحبه، وقدم خراسان أيام قتيبة وكان معه في فتح سمرقند، وتوفي في ولاية عمر بن هبيرة على العراق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}. وذكر الكتاب تاريخ وفاته (؟-103 أو 101 ه)."
  en: "Muwarriq ibn Mushmarij, Abu al-Mu'tamir al-Ijli, a Follower imam said to be Basran or Kufan. He narrated from Anas ibn Malik, Jundub ibn Abd Allah al-Bajali, Abd Allah ibn Ayyash and Abd Allah ibn Umar; Aban ibn Abi Ayyash, Isma'il ibn Abi Khalid and Tawba al-Anbari narrated from him. Al-Nasa'i and Ibn Sa'd call him trustworthy, and Ibn Hibban lists him among the trustworthy. Abu Ali al-Marwazi says he made the pilgrimage with Ibn Umar and kept his company, came to Khurasan in Qutayba's time, took part in the conquest of Samarqand, and died in the governorship of Umar ibn Hubayra over Iraq {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}. The book gives his death as 103 or 101 AH."
  ur: "مورق بن مشمرج، ابو المعتمر عجلی، بصری یا کوفی، تابعین کے امام۔ انہوں نے انس بن مالک، جندب بن عبداللہ بجلی، عبداللہ بن عیاش اور عبداللہ بن عمر سے روایت کی، اور ان سے ابان بن ابی عیاش، اسماعیل بن ابی خالد اور توبہ عنبری نے روایت کی۔ نسائی اور ابن سعد نے انہیں ثقہ کہا، اور ابن حبان نے ثقات میں ذکر کیا۔ ابو علی مروذی کے مطابق وہ ابن عمر کے ساتھ حج کرتے تھے اور ان کی صحبت میں رہے، قتیبہ کے زمانے میں خراسان آئے، سمرقند کی فتح میں شریک رہے، اور عمر بن ہبیرہ کی عراق پر ولایت کے زمانے میں وفات پائی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}۔ کتاب ان کی وفات 103 یا 101 ہجری بتاتی ہے۔"
