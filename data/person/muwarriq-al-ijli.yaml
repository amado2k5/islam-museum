summary:
  ar: "مورّق بن مشمرج، أبو المعتمر العجلي، البصري ويقال الكوفي، إمام تابعي، روى عن أنس بن مالك وجندب بن عبد الله البجلي وعبد الله بن عياش وعبد الله بن عمر وغيرهم، وروى عنه أبان بن أبي عياش وإسماعيل بن أبي خالد وتوبة العنبري وغيرهم. قال النسائي وابن سعد إنه ثقة، وذكره ابن حبان في الثقات. وقال أبو علي المروذي إنه كان يحج مع ابن عمر ويصحبه، وقدم خراسان أيام قتيبة وكان معه في فتح سمرقند، وتوفي في ولاية عمر بن هبيرة على العراق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}. وذكر الكتاب تاريخ وفاته ⁦(؟-103 أو 101 ه)⁩."
  en: "Muwarriq ibn Mushmarij, Abu al-Mu'tamir al-Ijli, a Follower imam said to be Basran or Kufan. He narrated from Anas ibn Malik, Jundub ibn Abd Allah al-Bajali, Abd Allah ibn Ayyash and Abd Allah ibn Umar; Aban ibn Abi Ayyash, Isma'il ibn Abi Khalid and Tawba al-Anbari narrated from him. Al-Nasa'i and Ibn Sa'd call him trustworthy, and Ibn Hibban lists him among the trustworthy. Abu Ali al-Marwazi says he made the pilgrimage with Ibn Umar and kept his company, came to Khurasan in Qutayba's time, took part in the conquest of Samarqand, and died in the governorship of Umar ibn Hubayra over Iraq {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}. The book gives his death as 103 or 101 AH."
  ur: "مورق بن مشمرج، ابو المعتمر عجلی، بصری یا کوفی، تابعین کے امام۔ انہوں نے انس بن مالک، جندب بن عبداللہ بجلی، عبداللہ بن عیاش اور عبداللہ بن عمر سے روایت کی، اور ان سے ابان بن ابی عیاش، اسماعیل بن ابی خالد اور توبہ عنبری نے روایت کی۔ نسائی اور ابن سعد نے انہیں ثقہ کہا، اور ابن حبان نے ثقات میں ذکر کیا۔ ابو علی مروذی کے مطابق وہ ابن عمر کے ساتھ حج کرتے تھے اور ان کی صحبت میں رہے، قتیبہ کے زمانے میں خراسان آئے، سمرقند کی فتح میں شریک رہے، اور عمر بن ہبیرہ کی عراق پر ولایت کے زمانے میں وفات پائی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}۔ کتاب ان کی وفات 103 یا 101 ہجری بتاتی ہے۔"
  es: "Muwarriq ibn Mushmarij, Abu al-Mu'tamir al-Ijli, un imán seguidor que se dice que es Basran o Kufan. Narró de Anas ibn Malik, Jundub ibn Abd Allah al-Bajali, Abd Allah ibn Ayyash y Abd Allah ibn Umar; Aban ibn Abi Ayyash, Isma'il ibn Abi Khalid y Tawba al-Anbari narraron de él. Al-Nasa'i e Ibn Sa'd lo llaman digno de confianza, e Ibn Hibban lo incluye entre los dignos de confianza. Abu Ali al-Marwazi afirma que realizó la peregrinación con Ibn Umar y lo acompañó, llegó a Jorasán en tiempos de Qutayba, participó en la conquista de Samarcanda y murió durante el gobierno de Umar ibn Hubayra sobre Irak {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13763}. El libro indica que falleció en el año 103 o 101 de la Hégira."
  fr: "Muwarriq ibn Mushmarij, Abu al-Mu'tamir al-Ijli, un imam adepte dit être Basran ou Kufan. Il a rapporté d'Anas ibn Malik, Jundub ibn Abd Allah al-Bajali, Abd Allah ibn Ayyash et Abd Allah ibn Umar; Aban ibn Abi Ayyash, Isma'il ibn Abi Khalid et Tawba al-Anbari ont rapporté de lui. Al-Nasa'i et Ibn Sa'd le considèrent comme digne de confiance, et Ibn Hibban le classe parmi les dignes de confiance. Abou Ali al-Marwazi rapporte avoir effectué le pèlerinage avec Ibn Umar et être resté à ses côtés, être arrivé au Khorasan sous le règne de Qutayba, avoir participé à la conquête de Samarcande et être mort durant le gouvernement d'Umar ibn Hubayra en Irak (voir: Fiqh Mawsua Kuwaitiyya Noor, vol. 3, p. 13763). L'ouvrage situe sa mort en 103 ou 101 de l'Hégire."
  tr: "Murriq ibn Mushmaraj, Abu al-Mu'tamir al-'Ajli, el-Basri, aynı zamanda el-Kufi olduğu da söylenir, Tabi'i'nin imamı olmuştur. Anas ibn Malik, Jundub ibn Abdullah al-Bajali, Abdullah ibn Ayyash, Abdullah ibn Umar ve diğerlerinden rivayet etmiştir. Aban ibn Abi Ayyash, İsmail ibn Abi Khalid, Tawbah al-Anbari ve diğerleri ondan rivayet etmiştir. Anën -Nasa'i ve İbn Sa'd onun güvenilir olduğunu söylediler, İbn Hibban ise onu güvenilir kişiler arasında saydı. Ebu Ali el-Mervazi, İbn Ömer ile hac yaptığını ve ona eşlik ettiğini, Kutaybe zamanında Horasan'a geldiğini ve Semerkand'ın fethinde onunla birlikte olduğunu söyledi. Ömer bin Hubayrah Irak'taki valiliği sırasında öldü {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s. 13763}. Kitapta ölüm tarihi (?) belirtilir -103 veya 101 AH)."
  id: "Murriq ibn Mushmaraj, Abu al-Mu'tamir al-'Ajli, al-Basri, yang juga disebut al-Kufi, adalah seorang imam Tabi'i. Ia menceritakan dari Anas ibn Malik, Jundub ibn Abdullah al-Bajali, Abdullah ibn Ayyash, Abdullah ibn Umar, dan lainnya. Aban ibn Abi Ayyash, Ismail ibn Abi Khalid, Tawbah al-Anbari, dan lainnya menceritakan darinya. An-Nasa'i dan Ibn Sa'd mengatakan ia dapat dipercaya, dan Ibn Hibban menyebutnya sebagai salah satu yang dapat dipercaya. Abu Ali al-Marwazi mengatakan ia biasa melaksanakan Haji bersama Ibn Umar dan menemaninya, dan ia tiba di Khurasan pada masa Qutaybah dan ikut menaklukkan Samarkand. Ia meninggal saat pemerintahan Umar ibn Hubayrah atas Irak {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.13763}. Buku tersebut menyebutkan tanggal kematiannya (?) -103 atau 101 AH)."
