summary:
  ar: "مدربة ومقدمة بودكاست بريطانية مسلمة. أسست سنة 2014 شركة «الحجاب الصحي» (The Healthy Hijab) للياقة النسائية الخالصة مراعاةً لخصوصية النساء المحتشمات، ثم بنت بودكاست وقناة «مانيفستنغ مسلمة» (Manifesting Muslimah) اللذين يعلّمان النساء المسلمات تحقيق أهدافهن بالتوكل على الله لا بقانون الجذب العلماني، وينشر على سبستاك بالاسم نفسه."
  en: "British Muslim coach and podcast host. In 2014 she founded The Healthy Hijab, a women-only fitness company created for modest women's privacy, and she later built the Manifesting Muslimah podcast and channel, which teach Muslim women to pursue their goals through trust in God rather than the secular law of attraction; she also publishes essays under the same brand on Substack."
  ur: "برطانوی مسلم کوچ اور پوڈکاسٹ میزبان۔ 2014 میں انہوں نے «دی ہیلتھی حجاب» (The Healthy Hijab) قائم کیا، جو خواتین کی پرائیویسی کے لیے صرف خواتین کی فٹنس کمپنی تھی، اور بعد میں «مینیفسٹنگ مسلمہ» (Manifesting Muslimah) پوڈکاسٹ اور چینل بنایا، جو مسلم خواتین کو سیکولر قانونِ کشش کے بجائے اللہ پر توکل کے ذریعے اپنے مقاصد حاصل کرنا سکھاتا ہے؛ وہ اسی برانڈ کے تحت سب اسٹیک پر مضامین بھی شائع کرتی ہیں۔"
