summary:
  en: "Son of Suhayl ibn Amr who embraced Islam early in Mecca and was imprisoned by his father; at the conclusion of the Hudaybiyya Treaty he escaped in chains to the Muslim camp; honoring the newly signed pact, the Prophet returned him while counseling patience, whereupon Abu Jandal escaped to the coastal enclave at al-Is with Abu Basir."
  ar: "ابن سهيل بن عمرو القرشي؛ أسلم قديماً بمكة فحبسه أبوه، فلما فُرغ من كتابة صلح الحديبية خرج يرسف في قيوده حتى ألقى نفسه بين المسلمين، فاسترده أبوه بموجب بند الصلح، فصبره النبي، ثم أفلت ولحق بأبي بصير بسيف البحر."
