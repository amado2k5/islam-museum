died: { edtf: "1009~", hijri: "0399-11-21", calendar: julian, precision: day, status: tradition, derived: true, note: "ضربت عنقه في محبسه يوم السبت عشية إحدى وعشرين ليلة خلت من ذي القعدة سنة تسع وتسعين وثلاثمائة {cite:wafayat-ayan}." }
summary:
  ar: "أبو الفتوح فضل بن صالح، القائد فضل؛ من قواد دولة الحاكم بأمر الله العبيدي بمصر، إليه تنسب «منية القائد فضل» البلدة في أعمال الجيزة قبالة مصر؛ كان مكيناً في دولة الحاكم ثم نقم عليه وحبسه فقُتل في محبسه ولم يُظهر له جنازة ولفّ في حصير {cite:wafayat-ayan}."
  en: "Abu al-Futuh Fadl ibn Salih, al-Qa'id Fadl: one of the commanders of the Ubaydid state of al-Hakim bi-Amr Allah in Egypt; the town of Munyat al-Qa'id Fadl in the Giza district, opposite Misr, is named after him. He was powerful in al-Hakim's state; then al-Hakim turned against him and imprisoned him, and he was killed in his prison. No funeral was displayed for him, and he was wrapped in a reed mat {cite:wafayat-ayan}."
  fr: "Abu al-Futuh Fadl ibn Salih, al-Qa'id Fadl : l'un des commandants de l'état Ubaydid d'al-Hakim bi-Amr Allah en Égypte ; la ville de Munyat al-Qa'id Fadl dans le district de Gizeh, en face de Misr, porte son nom. Il était puissant dans l'état d'al-Hakim ; puis al-Hakim s'est retourné contre lui et l'a emprisonné, et il a été tué dans sa prison. Il n'y avait pas d'enterrement pour lui, et il était enveloppé dans un tapis de roseaux {cite:wafayat-ayan}."
  es: "Abu al-Futuh Fadl ibn Salih, al-Qa'id Fadl: uno de los comandantes del estado ubaydí de al-Hakim bi-Amr Allah en Egipto; la ciudad de Munyat al-Qa'id Fadl en el distrito de Giza, frente a Misr, lleva su nombre. Fue poderoso en el estado de al-Hakim; luego, al-Hakim se volvió contra él y lo encarceló, y fue asesinado en prisión. No se le ofreció ningún funeral, y fue envuelto en una estera de junco {cite:wafayat-ayan}."
