summary:
  ar: "أبو الفتوح فضل بن صالح، القائد فضل؛ من قواد دولة الحاكم بأمر الله العبيدي بمصر، إليه تنسب «منية القائد فضل» البلدة في أعمال الجيزة قبالة مصر؛ كان مكيناً في دولة الحاكم ثم نقم عليه وحبسه فقُتل في محبسه ولم يُظهر له جنازة ولفّ في حصير {cite:wafayat-ayan}."
  en: "Abu al-Futuh Fadl ibn Salih, al-Qa'id Fadl: one of the commanders of the Ubaydid state of al-Hakim bi-Amr Allah in Egypt; the town of Munyat al-Qa'id Fadl in the Giza district, opposite Misr, is named after him. He was powerful in al-Hakim's state; then al-Hakim turned against him and imprisoned him, and he was killed in his prison. No funeral was displayed for him, and he was wrapped in a reed mat {cite:wafayat-ayan}."
