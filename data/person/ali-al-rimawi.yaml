summary:
  ar: "شاعر وصحفي وفقيه فلسطيني من أعلام القدس في أواخر العهد العثماني؛ وُلد في القدس لأسرة تعود نسبتها إلى بيت ريما، ودرس في الأزهر، ودرّس الفقه والعربية في مدرسة المعارف بالقدس وحرّر القسم العربي من جريدة «القدس» وجريدة «النجاح»."
  en: "Palestinian poet, journalist and jurist, a Jerusalem notable of the late Ottoman period. Born in Jerusalem to a family whose nisba derives from Bayt Rima, he trained at al-Azhar, taught jurisprudence and Arabic at Jerusalem's Ma'arif school and edited the Arabic section of the newspaper al-Quds and the journal al-Najah."
  ur: "فلسطینی شاعر، صحافی اور فقیہ، آخری عثمانی دور کے یروشلم کے نمایاں اہلِ علم۔ یروشلم میں پیدا ہوئے؛ ان کے خاندان کی نسبت بیت ریما سے ہے، الازہر میں پڑھے، یروشلم کے مدرسہ معارف میں فقہ و عربی پڑھائی اور اخبار «القدس» کے عربی حصے اور «النجاح» کی ادارت کی۔"
