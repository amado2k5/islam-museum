summary:
  en: "The patriarch of the Adnani Arabs in the sira’s telling: emigrant from Ur of the Chaldeans to Harran and then Palestine, who settled Hajar and the infant Ismail in the barren valley of Mecca, visited them on recorded journeys, submitted to the command of the sacrifice, and raised the foundations of the Kaaba with his son before calling mankind to the hajj."
  ar: "أبو العرب المستعربة في عرض السيرة: هاجر من أور الكلدانيين إلى حرّان ثم فلسطين، وأسكن هاجر ورضيعها إسماعيل بوادٍ غير ذي زرع عند موضع البيت، وزارهما في رحلات ثبت منها أربع، وأذّن في الناس بالحج بعد أن رفع هو وابنه قواعد الكعبة."
