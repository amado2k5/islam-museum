summary:
  ar: "بطاقة أولية لصادق خان زند، خام بني زند الثالث الذي حكم شيراز وفارس بعد كريم خان، توفي سنة ١٧٨١م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Sadiq Khan Zand, third khan of the Zand line ruling Shiraz after Karim Khan, d. 1781; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Sadiq Khan Zand, tercer khan de la línea Zand que gobernó Shiraz después de Karim Khan, fallecido en 1781; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature de Sadiq Khan Zand, troisième khan de la lignée Zand régnant sur Shiraz après Karim Khan, décédé en 1781; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "کریم خان کے بعد شیراز پر حکمرانی کرنے والی زند لائن کے تیسرے خان صادق خان زند کے لیے ڈرافٹ کارڈ، ڈی۔ 1781; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Kerim Han'dan sonra Şiraz ve Pers'i yöneten üçüncü Banu Zand Sadiq Han Zand'ın ön kartı 1781 yılında ölmüştür; İslami Sözlüklerde adı geçmektedir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Sadiq Khan Zand, Banu Zand ketiga yang memerintah Shiraz dan Persia setelah Karim Khan, meninggal pada tahun 1781 M; ia disebutkan dalam Kamus Islam dan terjemahannya belum ditinjau di halaman tersebut."
