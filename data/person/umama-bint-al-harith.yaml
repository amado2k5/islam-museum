summary:
  ar: "امرأة جاهلية من ربات الفصاحة والرأي، اشتهرت بوصيتها لابنتها أم إياس بنت عوف الشيبانية حين زُفّت إلى الحارث بن عمرو ملك كندة، وهي وصية «العشر خصال» التي يرويها كحالة في «أعلام النساء»."
  en: "A pre-Islamic woman of eloquence and judgement, famous for the counsel she gave her daughter Umm Iyas bint Awf al-Shaybani when she was given in marriage to al-Harith ibn Amr, king of Kinda — the counsel of 'ten qualities' that Kahhala records in A'lam al-Nisa'."
  ur: "ایک جاہلی خاتون، فصاحت اور رائے والی، جو اپنی بیٹی ام ایاس بنت عوف الشیبانی کو اس وقت کی گئی نصیحت کے لیے مشہور ہیں جب وہ کندہ کے بادشاہ حارث بن عمرو سے بیاہی گئیں — «دس خصلتوں» والی نصیحت جو کحالہ «اعلام النساء» میں نقل کرتے ہیں۔"
