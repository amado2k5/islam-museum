summary:
  ar: "امرأة جاهلية من ربات الفصاحة والرأي، اشتهرت بوصيتها لابنتها أم إياس بنت عوف الشيبانية حين زُفّت إلى الحارث بن عمرو ملك كندة، وهي وصية «العشر خصال» التي يرويها كحالة في «أعلام النساء»."
  en: "A pre-Islamic woman of eloquence and judgement, famous for the counsel she gave her daughter Umm Iyas bint Awf al-Shaybani when she was given in marriage to al-Harith ibn Amr, king of Kinda — the counsel of 'ten qualities' that Kahhala records in A'lam al-Nisa'."
  ur: "ایک جاہلی خاتون، فصاحت اور رائے والی، جو اپنی بیٹی ام ایاس بنت عوف الشیبانی کو اس وقت کی گئی نصیحت کے لیے مشہور ہیں جب وہ کندہ کے بادشاہ حارث بن عمرو سے بیاہی گئیں — «دس خصلتوں» والی نصیحت جو کحالہ «اعلام النساء» میں نقل کرتے ہیں۔"
  es: "Una mujer preislámica de elocuencia y juicio, famosa por el consejo que dio a su hija Umm Iyas bint Awf al-Shaybani cuando fue dada en matrimonio a al-Harith ibn Amr, rey de Kinda: el consejo de las \"diez cualidades\" que Kahhala registra en A'lam al-Nisa'."
  fr: "Une femme préislamique d'éloquence et de jugement, célèbre pour les conseils qu'elle a donnés à sa fille Umm Iyas bint Awf al-Shaybani lorsqu'elle a été donnée en mariage à al-Harith ibn Amr, roi de Kinda — les conseils des « dix qualités » que Kahhala consigne dans A'lam al-Nisa'."
  tr: "İslam öncesi bir kadın, hitabet ve yargısıyla tanınır; kızı Um Iyas bint Awf al-Shaybaniyah'a verdiği vasiyetle ünlüdür; Kinda kralı Al-Harith ibn Amr ile evlendiğinde. Bu, \"A'lam al-Nisa\"da anlatan \"On Özellik\"in vasiyetidir."
  id: "Seorang wanita pra-Islam yang dikenal karena kefasihan dan penilaian, terkenal karena wasiatnya kepada putrinya um Iyas bint Awf al-Shaybaniyah ketika ia menikah dengan Al-Harith ibn Amr, raja Kinda. Ini adalah kehendak dari \"Sepuluh Sifat,\" yang ia ceritakan sebagai narator dalam \"A'lam al-Nisa'.\""
