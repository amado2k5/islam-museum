summary:
  ar: أنصاري من الأوس، أحد النقباء الاثني عشر ليلة العقبة ونقيب بني عمرو بن عوف؛ كان النبي يجلس للناس في بيته بقباء ويسمى «بيت الغراب»؛ استُشهد ببدر بعد أن خرج سهمه على أبيه، ويرد ابن حجر على أبي نعيم زعمه أنه أبو خيثمة المتخلف عن تبوك.
  en: An Ansari of the Aws, one of the twelve naqibs on the night of al-Aqaba and the naqib of Banu Amr ibn Awf; the Prophet used to sit with people in his house at Quba, called 'the house of the crow'; he was killed at Badr after his lot was
    drawn over his father's, and Ibn Hajar rejects Abu Nu'aym's claim that he was the Abu Khaythama who stayed behind from Tabuk.
