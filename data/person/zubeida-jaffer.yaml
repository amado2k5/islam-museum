summary:
  ar: صحفية ومؤلفة جنوب أفريقية من كيب تاون، بدأت في صحيفة كيب تايمز سنة 1980، واعتقلها نظام الأبارتايد وعذّبها مرتين، ثم أصبحت محررة الشؤون البرلمانية لمجموعة إندبندنت نيوزبيبرز، وألّفت مذكرات «جيلنا» وكتابين آخرين، وتنشر موقع «الصحفي» لتاريخ رواد الصحافة.
  en: South African journalist and author from Cape Town who began at the Cape Times in 1980, was twice detained and tortured by the apartheid authorities, became group parliamentary editor of Independent Newspapers, and wrote the memoir Our Generation and two further books; she publishes The Journalist, a site on journalism's pioneers.
  ur: کیپ ٹاؤن سے تعلق رکھنے والی جنوبی افریقی صحافی اور مصنفہ جنہوں نے 1980 میں کیپ ٹائمز سے آغاز کیا، اپارتھائیڈ حکام نے انہیں دو بار حراست میں لے کر تشدد کا نشانہ بنایا، وہ انڈیپینڈنٹ نیوز پیپرز کی گروپ پارلیمانی ایڈیٹر بنیں، اور یادداشت «آور جنریشن» سمیت تین کتابیں لکھیں۔
