id: person/sharaf-al-din-qaraqush
class: person
label: { ar: "شرف الدين قراقوش", en: "Sharaf al-Din Qaraqush", es: "Sharaf al-Din Qaraqush", fr: "Sharaf al-Din Qaraqush", ur: "شرف الدین قراقش" }
summary:
  ar: "قراقوش مملوك تقي الدين عمر ابن أخي صلاح الدين يوسف بن أيوب؛ سار بطائفة من الترك من ديار مصر إلى جبال نفوسة فاتفق مع مسعود بن زمام البلاط الخارج على عبد المؤمن وافتتحا طرابلس الغرب سنة ثمان وستين وخمسمائة، فأسكن أهله قصرها وملك كثيراً من بلاد إفريقية ما خلا المهدية وسفاقس وقفصة وتونس وما والاها، وحكم على تلك البلاد بمساعدة العرب وجمع أموالاً عظيمة بمدينة قابس حتى طمح في الاستيلاء على إفريقية كلها لبعد صاحبها أبي يعقوب يوسف بن عبد المؤمن عنها {cite:kamil-ibn-al-athir p. 47}."
  en: "Qaraqush, mamluk of Taqi al-Din Umar ibn Ayyub (Saladin's nephew) — led a Turkish corps out of Egypt to the Nafusa mountains, allied with the rebel amir Mas'ud ibn Zammam, took Tripoli in 568 and ruled most of Ifriqiya except Mahdiyya, Sfax, Gafsa and Tunis, banking his treasure at Gabes and aspiring to the whole country {cite:kamil-ibn-al-athir p. 47}."
  es: "Qaraqush, mameluco de Taqi al-Din Umar ibn Ayyub (sobrino de Saladino) — dirigió un cuerpo turco desde Egipto hasta las montañas de Nafusa, aliado con el emir rebelde Mas'ud ibn Zammam, tomó Trípoli en 568 y gobernó la mayor parte de Ifriqiya excepto Mahdiyya, Sfax, Gafsa y Túnez, depositando su tesoro en Gabes y aspirando a todo el país {cite:kamil-ibn-al-athir p. 47}."
  fr: "Qaraqush, mamelouk de Taqi al-Din Umar ibn Ayyub (neveu de Saladin) — mena un corps turc hors d'Égypte jusqu'aux montagnes de Nafusa, s'allia avec l'émir rebelle Mas'ud ibn Zammam, prit Tripoli en 568 et gouverna la majeure partie de l'Ifriqiya à l'exception de Mahdiyya, Sfax, Gafsa et Tunis, déposant son trésor à Gabès et aspirant à tout le pays {cite:kamil-ibn-al-athir p. 47}."
  ur: "قراقش، تقی الدین عمر بن ایوب ⁦(صلاح الدین کا بھتیجا)⁩ کا مملوک - باغی امیر مسعود ابن زمام کے ساتھ مل کر ایک ترک دستے کو مصر سے باہر لے کر نفوسہ پہاڑوں تک پہنچا، 568 میں طرابلس پر قبضہ کیا اور افریقیہ کے زیادہ تر حصے پر حکومت کی سوائے اس کے طائفہ، صوفیہ، بنکصیفہ، غفاریہ، بنک۔ Gabes اور پورے ملک کے لیے آرزو مند {حوالہ: کامل ابن الاثیر ص۔ 47}۔"
  tr: "Qaraquş Memlük Taki al-Din Ömer, Salah al-Din Yusuf bin Eyyub'un oğlu; bir grup Türkle birlikte Mısır'dan Nafusa dağlarına yürüdü, burada Mes'ud bin Zamam el-Balat el-Khawar ile Abdül-Mu'min'e karşı ittifak kurdu ve 568 Hicri yılında batıda Trablus'u fethettiler. Halkı sarayda yerleşti ve Mahdia, Sfax, Gafsa, Tunus ve ötesinde birçok toprak hariç İfrikiye'nin birçok ülkesini yönetti. Bu toprakları Arap yardımıyla yönetti ve Gabes şehrinde büyük servet biriktirdi; sahibi Ebu Yaqub Yusuf bin Abdül-Mu'min'in uzaklığı nedeniyle tüm İfrikiye'yi ele geçirmeyi hedefledi {cite:kamil-ibn-al-athir s. 47}."
  id: "Qaraqush Mamluk Taqi al-Din Umar, putra Salah al-Din Yusuf ibn Ayyub; ia berbaris bersama sekelompok Turki dari Mesir ke pegunungan Nafusa, di mana ia bersekutu dengan Mas'ud ibn Zamam al-Balat al-Khawar melawan Abd al-Mu'min, dan mereka menaklukkan Tripoli di barat pada tahun 568 H. Kaumnya menetap di istananya dan memerintah banyak wilayah Ifriqiya kecuali Mahdia, Sfax, Gafsa, Tunis, dan sekitarnya. Ia memerintah wilayah tersebut dengan bantuan Arab dan mengumpulkan kekayaan besar di kota Gabes, bercita-cita merebut seluruh Ifriqiya karena jarak pemiliknya Abu Yaqub Yusuf ibn Abd al-Mu'min {cite:kamil-ibn-al-athir hlm. 47}."
