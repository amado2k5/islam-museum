label: { ar: "شرف الدين قراقوش", en: "Sharaf al-Din Qaraqush" }
summary:
  ar: "قراقوش مملوك تقي الدين عمر ابن أخي صلاح الدين يوسف بن أيوب؛ سار بطائفة من الترك من ديار مصر إلى جبال نفوسة فاتفق مع مسعود بن زمام البلاط الخارج على عبد المؤمن وافتتحا طرابلس الغرب سنة ثمان وستين وخمسمائة، فأسكن أهله قصرها وملك كثيراً من بلاد إفريقية ما خلا المهدية وسفاقس وقفصة وتونس وما والاها، وحكم على تلك البلاد بمساعدة العرب وجمع أموالاً عظيمة بمدينة قابس حتى طمح في الاستيلاء على إفريقية كلها لبعد صاحبها أبي يعقوب يوسف بن عبد المؤمن عنها {cite:kamil-ibn-al-athir p. 47}."
  en: "Qaraqush, mamluk of Taqi al-Din Umar ibn Ayyub (Saladin's nephew) — led a Turkish corps out of Egypt to the Nafusa mountains, allied with the rebel amir Mas'ud ibn Zammam, took Tripoli in 568 and ruled most of Ifriqiya except Mahdiyya, Sfax, Gafsa and Tunis, banking his treasure at Gabes and aspiring to the whole country {cite:kamil-ibn-al-athir p. 47}."
