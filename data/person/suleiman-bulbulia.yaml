summary:
  ar: "قيادي مجتمعي باربادوسي، أمين سابق لجمعية مسلمي باربادوس منذ سنة 2000 وواعظ مسلم بجامعة وست إنديز، حائز على وسام ترايدنت الفضي الباربادوسي لخدمة التعددية بين الأديان، وعضو سابق في اللجنة الاستشارية الدينية للشؤون الوطنية، وكاتب عمود أسبوعي في باربادوس توداي."
  en: "Barbadian community leader, secretary of the Barbados Muslim Association since 2000 and Muslim chaplain at the University of the West Indies, Cave Hill; a Justice of the Peace since 2010 and recipient of the Barbados Silver Trident of Excellence for interfaith inclusivity, a former member of the Religious Advisory Committee on National Affairs, and a weekly columnist for Barbados Today."
  ur: "بارباڈوس کے سماجی رہنما، 2000 سے بارباڈوس مسلم ایسوسی ایشن کے سیکریٹری اور یونیورسٹی آف ویسٹ انڈیز کے مسلم چیپلین؛ 2010 سے جسٹس آف پیس اور بین المذاہب شمولیت پر بارباڈوس سلور ٹرائڈنٹ اعزاز کے حامل، قومی امور کی مذہبی مشاورتی کمیٹی کے سابق رکن، اور بارباڈوس ٹوڈے کے ہفتہ وار کالم نگار۔"
  es: "Líder comunitario de Barbados, secretario de la Asociación Musulmana de Barbados desde el año 2000 y capellán musulmán en la Universidad de las Indias Occidentales, campus de Cave Hill; juez de paz desde 2010 y galardonado con el Tridente de Plata de Barbados a la Excelencia por su inclusión interreligiosa; exmiembro del Comité Asesor Religioso sobre Asuntos Nacionales; y columnista semanal de Barbados Today."
