summary:
  ar: "محدث ومؤرخ مغربي ⁦(1884–1962)⁩ من بيت الكتاني العلمي بفاس، أشهر مسندي المغرب في عصره. من مؤلفاته «فهرس الفهارس والأثبات ومعجم المعاجم» في طبقات الإسناد، و«التراتيب الإدارية» في تاريخ الإدارة المغربية، و«نظام الحكومة النبوية»."
  en: "Moroccan hadith scholar and historian (1884–1962) of the learned Kattani house of Fez, the most eminent Moroccan musnid of his age. His works include Fihris al-Faharis, a vast biographical dictionary of isnad chains, Al-Taratib al-Idariyya on Moroccan administrative history, and Nizam al-Hukuma al-Nabawiyya."
  fr: "Traditionniste et historien marocain (1884–1962) de la savante maison Kattani de Fès, le plus éminent musnid marocain de son temps. Ses œuvres comprennent la Fihris al-Faharis, vaste dictionnaire biographique des chaînes d'isnad, al-Taratib al-Idariyya sur l'histoire administrative marocaine, et Nizam al-Hukuma al-Nabawiyya."
  ur: "مغربی محدث اور مورخ ⁦(1884–1962)⁩ جو فاس کے علمی کتانی خاندان سے تھے اور اپنے دور کے ممتاز ترین مغربی مسند شمار ہوتے ہیں۔ ان کی تصانیف میں اسناد کی طبقات پر عظیم لغت «فہرس الفہارس»، مغربی انتظامی تاریخ پر «التراتیب الاداریہ» اور «نظام الحکومۃ النبویہ» شامل ہیں۔"
  es: "Erudito marroquí de hadices e historiador (1884-1962) perteneciente a la prestigiosa familia Kattani de Fez, fue el musulmán más eminente de su época. Entre sus obras destacan Fihris al-Faharis, un extenso diccionario biográfico de cadenas de transmisión (isnad), Al-Taratib al-Idariyya, sobre la historia administrativa marroquí, y Nizam al-Hukuma al-Nabawiyya."
  tr: "Fas'ın Fez şehrindeki El-Kattani alim ailesinden bir hadis alimi ve tarihçi olan (1884-1962), kendi döneminde Fas'ın en ünlü hadis râvisiydi. Eserleri arasında hadis zincirleri üzerine \"Fihris al-Faharis wa al-Athbat wa Mu'jam al-Ma'ajim\" (İndeksler ve Deliller Dizini ve Sözlükler Sözlüğü), Fas yönetiminin tarihi üzerine \"Al-Tarateeb al-Idariyah\" (İdari Düzenlemeler) ve \"Nizam al-Hukuma al-Nabawiyya\" (Peygamberin Yönetim Sistemi) bulunmaktadır."
  id: "Seorang ulama hadits dan sejarawan Maroko (1884–1962) dari keluarga ulama Al-Kattani di Fez, beliau adalah perawi hadits paling terkenal di Maroko pada masanya. Karya-karyanya meliputi \"Fihris al-Faharis wa al-Athbat wa Mu'jam al-Ma'ajim\" (Indeks Indeks dan Bukti serta Kamus Kamus) tentang rantai periwayatan, \"Al-Tarateeb al-Idariyah\" (Pengaturan Administratif) tentang sejarah administrasi Maroko, dan \"Nizam al-Hukuma al-Nabawiyya\" (Sistem Pemerintahan Nabi)."
