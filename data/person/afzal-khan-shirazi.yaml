summary:
  ar: "بطاقة أولية لأفضل خان الشيرازي، ديوان كل إمبراطور شاه جهان في القرن السابع عشر، توفي سنة ١٦٣٩م؛ تذكره كتب التاريخ ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Afzal Khan Shirazi, the seventeenth-century divan-i kull of emperor Shah Jahan, d. 1639; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Afzal Khan Shirazi, el divan-i kull del siglo XVII del emperador Shah Jahan, fallecido en 1639; la entrada de la fuente aún no se ha comprobado en la página."
  fr: "Fiche de conscription d'Afzal Khan Shirazi, le divan-i kull du XVIIe siècle de l'empereur Shah Jahan, mort en 1639; la source n'est pas encore vérifiée sur la page."
  ur: "شہنشاہ شاہ جہاں کے سترہویں صدی کے دیوانِ کل، افضل خان شیرازی کے لیے ڈرافٹ کارڈ۔ 1639; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "17. yüzyılda her imparatorun divanı olan Afdal Han el-Şirazi'nin ön taslağı; Şah Cihan 1639 yılında vefat etmiştir; tarih kitaplarında adı geçmektedir ve çevirisi henüz bu sayfada incelenmemiştir."
  id: "Kartu pendahuluan Afdal Khan Al-Shirazi, Divan setiap kaisar Shah Jahan pada abad ketujuh belas, meninggal pada tahun 1639 M; ia disebutkan dalam buku-buku sejarah dan terjemahannya belum ditinjau di halaman ini."
