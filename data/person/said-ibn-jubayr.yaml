id: person/said-ibn-jubayr
class: person
label: { ar: "سعيد بن جبير" }
summary:
  ar: "قُتل في سنة أربع وتسعين، وذكر الطبري مقتله {cite:tabari-tarikh-abu-al-fadl j.6 p.487}. وعند المسعودي لما ظفر به الحجاج سنة أربع وتسعين قال له ما اسمك قال سعيد بن جبير قال بل شقي بن كسير قال أبي كان أعلم باسمي منك قال لقد شقيت وشقي أبوك قال الغيب إنما يعلمه غيرك قال لأبدلنك بالدنيا ناراً تلظى قال لو علمت أن ذلك بيدك ما اتخذت إلهاً غيرك، فلما ولى ليقتل ضحك فسئل فقال عجبت من جراءتك على الله وحلم الله عنك، فذبح فقال اللهم لا تسلط الحجاج على أحد يقتله من بعدي فلم يعش الحجاج بعده إلا خمس عشرة ليلة حتى وقعت في جوفه الأكلة، وكان يقول مالي ولسعيد بن جبير كلما عزمت على النوم أخذ بحلقي {cite:muruj-al-dhahab p. 154-155}"
  tr: "Doksan dördüncü yılda öldürüldü ve el-Taberi onun ölümünü anmıştır {kaynak:tabari-tarikh-abu-al-fadl j.6 s.487}. Ve El-Mes'udi'ye, doksan dördüncü yılda Hacac onu yendiğinde ona sordu: Adın nedir? Said bin Cubeyr dedi ki: Aksine, Şaqi bin Kasir dedi ki: Babam ismimi senden daha iyi biliyordu. Dedi ki: Babanı acı çektim ve acı çektim. Dedi ki: Sadece sen görünmeyeni bilirsin. Dedi ki: Seni bu dünyada alevli bir ateşle değiştireceğim. Dedi ki, \"Bunun senin ellerinde olduğunu bilseydim, onu başka bir tanrı olarak kabul etmezdim Öldürülmeye gittiğinde güldü ve \"Allah'a karşı cesaretine ve Allah'ın sana tahammülüne hayret ediyorum.\" diye soruldu. Katledildi ve dedi ki, \"Ey Allah, El-Hacc'ın benden sonra onu öldüren kimseyi kontrol etmesin.\" El-Haccac ondan sonra sadece on beş gece yaşadı, ta ki yiyecek içine düşene kadar. Hep derdi ki, \"Said ibn Jubayr'a ne oldu? Ne zaman uyuyacaksam, boğazımı tutardı.\" {alıntı:Muruj-al-Dhahab, s. 154-155}"
  id: "Ia dibunuh pada tahun sembilan puluh empat, dan al-Tabari menyebutkan kematiannya {cite:tabari-tarikh-abu-al-fadl j.6 hlm.487}. Dan bersama Al-Mas'udi, ketika Al-Hajjaj mengalahkannya pada tahun sembilan puluh empat, dia bertanya: Siapa namamu? Saeed bin Jubayr berkata: Sebaliknya, Shaqi bin Kasir berkata: Ayahku lebih mengenal namaku daripada kamu. Dia berkata: Aku telah menderita dan dengan sengsara ayahmu. Dia berkata: Hanya kamu yang tahu yang tak terlihat. Dia berkata: Aku akan menggantikanmu dengan api yang menyala di dunia ini. Dia berkata, \"Jika aku tahu ini ada di tanganmu, aku tidak akan menganggapnya sebagai dewa selain kamu.\" Ketika ia hendak dibunuh, ia tertawa dan ditanya, berkata, \"Aku takjub atas keberanianmu melawan Tuhan dan keampunan Allah terhadapmu.\" Ia dibantai, dan ia berkata, \"Ya Allah, janganlah Al-Hajjaj menguasai siapa pun yang membunuhnya setelahku.\" Al-Hajjaj hanya hidup lima belas malam setelah dia sampai makanan jatuh ke dalam dirinya. Ia biasa berkata, \"Apa yang salah dengan Saeed ibn Jubayr? Setiap kali aku berniat tidur, dia akan mencabut leherku.\" {cite::Muruj-al-Dhahab, hlm. 154-155}"
