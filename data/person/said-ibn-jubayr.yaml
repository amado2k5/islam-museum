id: person/said-ibn-jubayr
class: person
label: { ar: "سعيد بن جبير" }
summary:
  ar: "قُتل في سنة أربع وتسعين، وذكر الطبري مقتله {cite:tabari-tarikh-abu-al-fadl j.6 p.487}. وعند المسعودي لما ظفر به الحجاج سنة أربع وتسعين قال له ما اسمك قال سعيد بن جبير قال بل شقي بن كسير قال أبي كان أعلم باسمي منك قال لقد شقيت وشقي أبوك قال الغيب إنما يعلمه غيرك قال لأبدلنك بالدنيا ناراً تلظى قال لو علمت أن ذلك بيدك ما اتخذت إلهاً غيرك، فلما ولى ليقتل ضحك فسئل فقال عجبت من جراءتك على الله وحلم الله عنك، فذبح فقال اللهم لا تسلط الحجاج على أحد يقتله من بعدي فلم يعش الحجاج بعده إلا خمس عشرة ليلة حتى وقعت في جوفه الأكلة، وكان يقول مالي ولسعيد بن جبير كلما عزمت على النوم أخذ بحلقي {cite:muruj-al-dhahab p. 154-155}"
gender: male
died: { hijri: "0095", edtf: "0714~", calendar: julian, precision: year, status: debated, derived: true, note: "الشيرازي: توفي سنة خمس وتسعين (PDF ص44). الخبر المذكور في الملخص عن الطبري يقول قُتل سنة أربع وتسعين؛ الاختلاف مسجل ولم يُحسم.", sources: [source/tabaqat-fuqaha-abbas-1981, source/taqrib-al-tahdhib] }
