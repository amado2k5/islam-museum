summary:
  ar: "أبو خالد وعمرو وأبان؛ هلك بالظريبة من ناحية الطائف في مال له، ويروي ابن إسحاق أبياتاً قالها لابنه عمرو."
  en: Father of Khalid, Amr and Aban; he died at al-Zurayba in the direction of al-Ta'if over property of his, and Ibn Ishaq transmits verses he addressed to his son Amr.
  es: "Padre de Khalid, Amr y Aban; murió en al-Zurayba en dirección a al-Ta'if por una disputa sobre sus propiedades, e Ibn Ishaq transmite versos que dirigió a su hijo Amr."
  fr: "Père de Khalid, Amr et Aban; il mourut à al-Zurayba en direction d'al-Ta'if à cause de ses biens, et Ibn Ishaq transmet des versets qu'il adressa à son fils Amr."
  ur: "خالد، عمرو اور ابان کے والد؛ اس کی وفات الطائف کی سمت میں الزرائبہ میں ہوئی اور ابن اسحاق نے ان آیات کو نقل کیا ہے جن سے اس نے اپنے بیٹے عمرو کو مخاطب کیا تھا۔"
  tr: "Ebu Halid, Amr ve Aban; Taif yakınlarındaki El-Dhuraybah'ta servetiyle birlikte öldü. İbn İshaq, oğlu Amr'a okuduğu ayetleri anlatır."
  id: "Abu Khalid, Amr, dan Aban; ia meninggal di Al-Dhuraybah dekat Taif bersama kekayaannya. Ibn Ishaq menceritakan bait-bait yang ia bacakan kepada putranya Amr."
