id: person/muhammad-ghawth-gwaliori
class: person
label: { ar: "الشيخ محمد غوث الگواليري", en: "Shaykh Muhammad Ghawth of Gwalior", ur: "شیخ محمد غوث گوالیاری" }
summary:
  ar: "صوفي من الطريقة الشطارية، مريد الشيخ ظهور والحاج حضور، صاحب «گلزار أبرار» و«جواهر خمسه»، عظّمه بابر وهمايون، وتوفي في آكره سنة 970هـ/1562 عن ثمانين سنة ودفن في غواليور {cite:nath-history-of-mughal-architecture-1-1982 p. 219} {cite:nath-history-of-mughal-architecture-1-1982 p. 220}."
  en: "A Sufi of the Shattari order, disciple of Shaykh Zuhur and Hajji Huzur, author of the Gulzar-i Abrar and the Jawahir-i Khamsa, revered by Babur and Humayun, who died at Agra in AH 970/1562 aged eighty and was buried at Gwalior {cite:nath-history-of-mughal-architecture-1-1982 p. 219} {cite:nath-history-of-mughal-architecture-1-1982 p. 220}."
  ur: "شطاری سلسلے کے صوفی، شیخ ظہور اور حاجی حضور کے مرید، «گلزارِ ابرار» اور «جواہرِ خمسہ» کے مصنف، جن کی بابر اور ہمایوں تعظیم کرتے تھے؛ 970ھ/1562ء میں اسی برس کی عمر میں آگرہ میں فوت ہوئے اور گوالیار میں دفن ہوئے {cite:nath-history-of-mughal-architecture-1-1982 p. 220}۔"
