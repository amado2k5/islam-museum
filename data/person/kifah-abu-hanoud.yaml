summary:
  ar: «أكاديمية وباحثة أردنية في الدراسات الشرعية متخصصة في التفسير، أستاذة مساعدة في كلية الشريعة بجامعة العلوم التطبيقية في الأردن منذ 2020، ومؤسِّسة مبادرة «مشكاة» (2019) وبرنامجها النسائي «رِواء»، ومؤلفة «فقه بناء الإنسان في القرآن» و«في صحبة الأسماء الحسنى» و«على خطى إبراهيم».»
  en: "Jordanian academic and researcher in Islamic studies specialising in tafsir (Qur'an exegesis): assistant professor at the Faculty of Sharia of the Applied Science University in Jordan since 2020, founder of the Mishkah initiative (2019) and its Riwaa programme for women, and author of Fiqh Bina' al-Insan fi'l-Qur'an, Fi Suhbat al-Asma' al-Husna and Ala Khuta Ibrahim."
  ur: «اردنی عالمہ و محققہ، تفسیر میں متخصص؛ 2020ء سے جامعہ علوم تطبیقیہ (اردن) کی کلیۃ الشریعہ میں اسسٹنٹ پروفیسر ہیں، «مشکاۃ» اقدامی اور اس کے خواتین پروگرام «رِواء» کی بانی ہیں اور متعدد کتب کی مصنفہ ہیں۔»
