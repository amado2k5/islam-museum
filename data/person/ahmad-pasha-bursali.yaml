summary:
  ar: "أحمد باشا البورصوي، أعظم شعراء العثمانيين في النصف الثاني من القرن الخامس عشر، ابن قاضي العسكر ولي الدين، وكان مدرسًا ثم قاضيًا في أدرنة، ومربيًا للسلطان محمد الثاني، ثم وزيرًا وأميرًا للسنجق، وتوفي في بورصة سنة 902هـ/1496–1497م {cite:encyclopaedia-of-islam-2 vol. 1 p. 314}."
  en: "Ahmad Pasha Bursali, the greatest Ottoman poet of the second half of the fifteenth century, son of the qadi 'asker Wali al-Din. He was a qadi at Adrianople and tutor of Mehmed II, later a vizier and sancak-bey, and he died at Bursa in 902/1496–7 {cite:encyclopaedia-of-islam-2 vol. 1 p. 314}."
