summary:
  ar: "عيسى بن عمر، أبو عمر الهمداني الكوفي، من موالي بني أسد، المقرئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} أخذ القراءة عرضًا عن طلحة بن مصرف وعاصم بن بهدلة والأعمش، وتلا عليه الكسائي وعبد الرحمن بن أبي حماد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} حدّث عن عطاء بن أبي رباح وحماد الفقيه، وروى عنه ابن المبارك ووكيع وأبو نعيم وخلاد بن يحيى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} وثّقه ابن معين وغيره، وقال العجلي إنه كان من قراء الكوفة الكبار في القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963}"
  en: "Isa ibn Umar, Abu Umar al-Hamdani al-Kufi, a client of Banu Asad and a Qur'an reader. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} He took the readings by direct recitation from Talha ibn Musarrif, Asim ibn Bahdala and al-A'mash; al-Kisa'i and Abd al-Rahman ibn Abi Hammad read to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} He narrated from Ata' ibn Abi Rabah and Hammad al-Faqih; Ibn al-Mubarak, Waki', Abu Nu'aym and Khallad ibn Yahya narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} Ibn Ma'in and others rated him trustworthy, and al-Ajli called him a leading reader of Kufa in the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963}"
  es: "Isa ibn Umar, Abu Umar al-Hamdani al-Kufi, cliente de Banu Asad y lector del Corán. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} Aprendió las lecturas mediante la recitación directa de Talha ibn Musarrif, Asim ibn Bahdala y al-A'mash; al-Kisa'i y Abd al-Rahman ibn Abi Hammad le leyeron. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} Narró de Ata' ibn Abi Rabah y Hammad al-Faqih; Ibn al-Mubarak, Waki', Abu Nu'aym y Khallad ibn Yahya narraron sobre él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} Ibn Ma'in y otros lo consideraron digno de confianza, y al-Ajli lo llamó un lector destacado de Kufa en el Corán. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963}"
  fr: "Isa ibn Umar, Abu Umar al-Hamdani al-Kufi, client de Banu Asad et lecteur du Coran. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} Il a appris les lectures par la récitation directe de Talha ibn Musarrif, Asim ibn Bahdala et al-A'mash; al-Kisa'i et Abd al-Rahman ibn Abi Hammad lui ont lu. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} Il a rapporté d'Ata' ibn Abi Rabah et Hammad al-Faqih; Ibn al-Mubarak, Waki', Abu Nu'aym et Khallad ibn Yahya ont rapporté de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} Ibn Ma'in et d'autres l'ont jugé digne de confiance, et al-Ajli l'a appelé l'un des principaux lecteurs de Kufa dans le Coran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963}"
  ur: "عیسیٰ ابن عمر، ابو عمر الحمدانی الکوفی، بنو اسد کے مؤکل اور قرآن پڑھنے والے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 14962} انہوں نے طلحہ بن مسرف، عاصم بن بدالہ اور العمش سے براہ راست قراءت کے ذریعے قراءت سیکھی۔ کسائی اور عبدالرحمٰن بن ابی حماد نے اسے پڑھا۔ انہوں نے عطاء بن ابی رباح اور حماد فقیہ سے روایت کی ہے۔ ان سے ابن مبارک، وکیع، ابو نعیم اور خلاد بن یحییٰ نے روایت کی ہے۔ ابن معین اور دیگر نے اسے ثقہ قرار دیا ہے اور العجلی نے انہیں قرآن میں کوفہ کا معروف قاری قرار دیا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص14963}"
  tr: "İsa ibn Umar, Ebu Ömer el-Hamdani el-Kufi, Banu Asad'ın özgür bırakılanlarından biri, okuyan. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.14962} Tercihi tesadüfen Talha ibn Musarraf, Asim ibn Bahdala ve al-A'mash'tan aldı; al-Kisai ile Abd al-Rahman ibn Ebu Hammad ona okudu. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14963} Ata ibn Abi Rabah, Hammad al-Faqih'ten rivayet etti ve ondan İbn al-Mubarak, Waki', Abu Nu'eym ve Khallad ibn Yahya tarafından rivayet edildi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14963} İbn Ma'in ve diğerleri ona güvendi. Al-'Ajli, onun Kufa'daki büyük Kur'an okunucularından biri olduğunu söyledi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14963}"
  id: "Isa ibn Umar, Abu Umar al-Hamdani al-Kufi, salah satu mantan Banu Asad, sang pembaca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14962} Ia mengambil bacaan secara kebetulan dari Talha ibn Musarraf, Asim ibn Bahdala, dan al-A'mash, serta al-Kisai dan Abd al-Rahman ibn Abi Hammad yang membacakan kepadanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14963} Ia menceritakan dari Ata ibn Abi Rabah, Hammad al-Faqih, dan diceritakan darinya oleh Ibn al-Mubarak, Waki', Abu Nu'aym, dan Khallad ibn Yahya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14963} Ibn Ma'in dan lainnya mempercayainya. Al-'Ajli mengatakan bahwa ia termasuk di antara para pembaca Al-Qur'an yang agung dalam Kufa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963}"
