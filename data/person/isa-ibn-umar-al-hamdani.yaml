summary:
  ar: "عيسى بن عمر، أبو عمر الهمداني الكوفي، من موالي بني أسد، المقرئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} أخذ القراءة عرضًا عن طلحة بن مصرف وعاصم بن بهدلة والأعمش، وتلا عليه الكسائي وعبد الرحمن بن أبي حماد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} حدّث عن عطاء بن أبي رباح وحماد الفقيه، وروى عنه ابن المبارك ووكيع وأبو نعيم وخلاد بن يحيى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} وثّقه ابن معين وغيره، وقال العجلي إنه كان من قراء الكوفة الكبار في القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963}"
  en: "Isa ibn Umar, Abu Umar al-Hamdani al-Kufi, a client of Banu Asad and a Qur'an reader. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14962} He took the readings by direct recitation from Talha ibn Musarrif, Asim ibn Bahdala and al-A'mash; al-Kisa'i and Abd al-Rahman ibn Abi Hammad read to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} He narrated from Ata' ibn Abi Rabah and Hammad al-Faqih; Ibn al-Mubarak, Waki', Abu Nu'aym and Khallad ibn Yahya narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963} Ibn Ma'in and others rated him trustworthy, and al-Ajli called him a leading reader of Kufa in the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14963}"
