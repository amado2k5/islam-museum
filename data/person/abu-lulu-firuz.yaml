id: person/abu-lulu-firuz
class: person
label: { ar: "أبو لؤلؤة فيروز", en: "Abu Lulu Firuz", fr: "Abu Lulu Firuz", es: "Abu Lulu Firuz", ur: "ابو لولو فیروز" }
summary:
  ar: "غلام المغيرة بن شعبة، وكان نصرانياً، طعن عمر بن الخطاب في سوق المدينة فمات منها {cite:tabari-tarikh-abu-al-fadl j.4 p.190} {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. وعند السيوطي كان يصنع الأرحاء حداداً نقاشاً نجاراً فاستأذن له المغيرة عمر في دخول المدينة وضرب عليه خراجاً فشكا لعمر فلم يغير شيئاً فتوعده برحى تطحن بالريح ثم طعنه بخنجر ذي رأسين في غلس الصلاة فطعن معه ثلاثة عشر رجلاً مات منهم ستة ثم قتل نفسه {cite:tarikh-khulafa-minhaj-1434}."
  en: "A slave of al-Mughira ibn Shu'ba, a Christian, who stabbed Umar ibn al-Khattab in the market of Medina, and Umar died of the wound {cite:tabari-tarikh-abu-al-fadl j.4 p.190} {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. In al-Suyuti he worked as a maker of millstones, a smith, an engraver and a carpenter; al-Mughira asked Umar's permission for him to enter Medina, and a tax (kharaj) was levied on him. He complained to Umar, who changed nothing, so he threatened him with a mill that grinds by wind, then stabbed him with a double-headed dagger at the dawn prayer, wounding thirteen men with him, six of whom died, and then killed himself {cite:tarikh-khulafa-minhaj-1434}."
  fr: "Esclave d'al-Mughira ibn Shu'ba, chrétien, qui poignarda Umar ibn al-Khattab au marché de Médine, et Umar mourut de la blessure {cite:tabari-tarikh-abu-al-fadl j.4 p.190} {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. Chez al-Suyuti, il travaillait comme fabricant de meules, forgeron, graveur et charpentier ; al-Mughira demanda à Umar la permission de le faire entrer à Médine, et un impôt (kharaj) lui fut imposé. Il s'en plaignit à Umar, qui ne changea rien ; il le menaça alors d'un moulin qui moud par le vent, puis le poignarda d'un poignard à deux têtes à la prière de l'aube, blessant treize hommes avec lui, dont six moururent, puis se tua {cite:tarikh-khulafa-minhaj-1434}."
  es: "Un esclavo de al-Mughira ibn Shu'ba, un cristiano, que apuñaló a Umar ibn al-Khattab en el mercado de Medina, y Umar murió a causa de la herida {cite:tabari-tarikh-abu-al-fadl j.4 p.190} {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. En al-Suyuti trabajaba como fabricante de piedras de molino, herrero, grabador y carpintero; al-Mughira pidió permiso a Umar para entrar en Medina, y se le impuso un impuesto (kharaj). Se quejó a Umar, quien no cambió nada, así que lo amenazó con un molino de viento, luego lo apuñaló con una daga de doble filo durante la oración del amanecer, hiriendo a trece hombres con él, seis de los cuales murieron, y luego se suicidó {cite:tarikh-khulafa-minhaj-1434}."
  ur: "مغیرہ بن شعبہ کا ایک غلام، ایک عیسائی، جس نے عمر بن الخطاب کو مدینہ کے بازار میں وار کیا، اور عمر زخموں کی تاب نہ لاتے ہوئے مر گیا۔ السیوطی میں اس نے چکی کے پتھر بنانے، اسمتھ، نقاشی اور بڑھئی کے طور پر کام کیا۔ مغیرہ نے عمر سے مدینہ میں داخل ہونے کی اجازت طلب کی، اور ان پر ٹیکس ⁦(خراج)⁩ لگایا گیا۔ اس نے عمر سے شکایت کی، جس نے کچھ نہیں بدلا، تو اس نے اسے ہوا سے پیسنے والی چکی سے ڈرایا، پھر نماز فجر کے وقت اسے دو سروں والے خنجر سے وار کیا، اس کے ساتھ تیرہ آدمیوں کو زخمی کیا، جن میں سے چھ مر گئے، اور پھر خود کو ہلاک کر لیا۔"
  tr: "Hristiyan olan El-Muğire ibn Şube'nin kölesi, Medine çarşısında Ömer ibn el-Hattab'ı bıçakladı ve Ömer bu yüzden öldü. {Kaynak: Tabari-tarikh-ebu-el-fadl c.4 s.190} {Kaynak: Tabari-tarikh-ebu-el-fadl c.4 s.192}. El-Suyuti'ye göre, Ömer bir demirci, oymacı ve değirmen taşı yapan bir marangozdu. El-Muğire, Ömer'den Medine'ye girmek için izin istedi ve ona vergi koydu. Ömer'e şikayet etti, ancak hiçbir şey değişmedi. Bunun üzerine Ömer'i rüzgarla öğüten bir değirmen taşıyla tehdit etti, sonra da namaz vakti karanlığında onu çift başlı bir hançerle bıçakladı. Ayrıca on üç kişiyi daha bıçakladı, bunlardan altısı öldü, sonra da intihar etti. {Kaynak: Tarikat-hulafa-minhaj-1434}."
  id: "Budak Al-Mughirah ibn Shu'bah, yang beragama Kristen, menikam Umar ibn al-Khattab di pasar Madinah, dan ia meninggal karenanya. {cite:tabari-tarikh-abu-al-fadl j.4 p.190} {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. Menurut Al-Suyuti, ia adalah seorang pandai besi, pengukir, dan tukang kayu yang membuat batu penggiling. Al-Mughirah meminta izin kepada Umar untuk memasuki Madinah dan mengenakan pajak kepadanya. Ia mengadu kepada Umar, tetapi tidak ada perubahan. Maka ia mengancamnya dengan batu penggiling yang akan menggiling dengan angin, lalu ia menikamnya dengan belati bermata dua di tengah kegelapan shalat. Ia juga menikam tiga belas orang, enam di antaranya meninggal, lalu ia bunuh diri. {cite:tarikh-khulafa-minhaj-1434}."
