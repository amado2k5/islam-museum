label: { ar: "أبو لؤلؤة فيروز", en: "Abu Lulu Firuz" }
summary:
  ar: "غلام المغيرة بن شعبة، وكان نصرانياً، طعن عمر بن الخطاب في سوق المدينة فمات منها {cite:tabari-tarikh-abu-al-fadl j.4 p.190} {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. وعند السيوطي كان يصنع الأرحاء حداداً نقاشاً نجاراً فاستأذن له المغيرة عمر في دخول المدينة وضرب عليه خراجاً فشكا لعمر فلم يغير شيئاً فتوعده برحى تطحن بالريح ثم طعنه بخنجر ذي رأسين في غلس الصلاة فطعن معه ثلاثة عشر رجلاً مات منهم ستة ثم قتل نفسه {cite:tarikh-khulafa-minhaj-1434}."
  en: "A slave of al-Mughira ibn Shu'ba, a Christian, who stabbed Umar ibn al-Khattab in the market of Medina, and Umar died of the wound {cite:tabari-tarikh-abu-al-fadl j.4 p.190} {cite:tabari-tarikh-abu-al-fadl j.4 p.192}. In al-Suyuti he worked as a maker of millstones, a smith, an engraver and a carpenter; al-Mughira asked Umar's permission for him to enter Medina, and a tax (kharaj) was levied on him. He complained to Umar, who changed nothing, so he threatened him with a mill that grinds by wind, then stabbed him with a double-headed dagger at the dawn prayer, wounding thirteen men with him, six of whom died, and then killed himself {cite:tarikh-khulafa-minhaj-1434}."
