summary:
  ar: "زين الدين ابن الأدمي الحموي الواعظ؛ تعانى عمل المواعيد فبرع فيها واشتهر وأثرى وقدم القاهرة بعد التنكية فاستوطنها إلى أن مات وولي في غضون ذلك خطابة المسجد الأقصى ثم صرف واستمر في عمل المواعيد والكلام في المجالس المعدة لذلك واشتهر اسمه وطار صيته، وكان غالباً لا يقرأ إلا من كتاب مع نغمة طيبة وأداء صحيح وكان يقرأ صحيح البخاري في شهر رمضان في عدة أماكن إلى أن مات فجأة في الثاني من ذي القعدة سنة ثمان وأربعين وثمانمائة بعد أن عمل يوم موته الميعاد في موضعين وقد جاوز الثمانين وترك أولاداً أحدهم شيخ يقرب من الستين {cite:shadharat-dhahab p. 262}."
  en: "Ibn al-Adami of Hama — the celebrated preacher who settled in Cairo after the Timurid sack, held the khitaba of al-Aqsa, read Sahih al-Bukhari every Ramadan in several venues for eighty-plus years of life; died suddenly 2 Dhu al-Qa'da 848 having held two maw'id sessions on his very last day {cite:shadharat-dhahab p. 262}."
