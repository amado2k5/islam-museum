summary:
  ar: "زين الدين ابن الأدمي الحموي الواعظ؛ تعانى عمل المواعيد فبرع فيها واشتهر وأثرى وقدم القاهرة بعد التنكية فاستوطنها إلى أن مات وولي في غضون ذلك خطابة المسجد الأقصى ثم صرف واستمر في عمل المواعيد والكلام في المجالس المعدة لذلك واشتهر اسمه وطار صيته، وكان غالباً لا يقرأ إلا من كتاب مع نغمة طيبة وأداء صحيح وكان يقرأ صحيح البخاري في شهر رمضان في عدة أماكن إلى أن مات فجأة في الثاني من ذي القعدة سنة ثمان وأربعين وثمانمائة بعد أن عمل يوم موته الميعاد في موضعين وقد جاوز الثمانين وترك أولاداً أحدهم شيخ يقرب من الستين {cite:shadharat-dhahab p. 262}."
  en: "Ibn al-Adami of Hama — the celebrated preacher who settled in Cairo after the Timurid sack, held the khitaba of al-Aqsa, read Sahih al-Bukhari every Ramadan in several venues for eighty-plus years of life; died suddenly 2 Dhu al-Qa'da 848 having held two maw'id sessions on his very last day {cite:shadharat-dhahab p. 262}."
  es: "Ibn al-Adami de Hama, el célebre predicador que se estableció en El Cairo después del saqueo timúrida, dirigió la khitaba de al-Aqsa, leyó Sahih al-Bukhari cada Ramadán en varios lugares durante más de ochenta años de vida; murió repentinamente el 2 de Dhu al-Qa'da de 848 después de haber dirigido dos sesiones de maw'id en su último día {cita: shadharat-dhahab p. 262}."
  fr: "Ibn al-Adami de Hama — le célèbre prédicateur qui s'installa au Caire après le sac des Timourides, dirigea la khitaba d'al-Aqsa, lut le Sahih al-Bukhari chaque Ramadan dans plusieurs lieux pendant plus de quatre-vingts ans de vie; mourut subitement le 2 Dhu al-Qa'da 848 après avoir tenu deux sessions de maw'id le tout dernier jour {cite:shadharat-dhahab p. 262}."
  ur: "حما کے ابن الادمی - مشہور مبلغ جو تیموری کی برطرفی کے بعد قاہرہ میں آباد ہوئے، الاقصیٰ کا خطبہ منعقد کیا، زندگی کے اسّی سال سے زائد سالوں تک ہر رمضان میں کئی مقامات پر صحیح البخاری پڑھتے تھے۔ 2 ذی القعدہ 848 میں اچانک وفات پائی اور اپنے آخری دن دو مواعد کی مجلسیں منعقد کیں۔ 262}۔"
  tr: "Vaiz Zain al-Din ibn al-Ademi el-Hamavi el-Hamavi, görev yapmakta zorlandı, bunda başarılı oldu, ünlü oldu ve zenginleşti. Takkiyya'dan sonra Kahire'de yerleşti ve öldü. Bu süre zarfında El-Aksa Camii'nin vaizi olarak atandı, ardından ayrıldı ve hazırlıklı toplantılarda görev yapmaya ve konuşmaya devam etti. Adı ünlü oldu ve ünü yayıldı. Genellikle sadece iyi bir ton ve doğru telaffuzla kitaptan okurdu. Ramazan ayında birkaç yerde Sahih al-Buhari'yi okudu, ta ki 848 Hicri yılının ikinci Zhu Kı'dah'ında, iki yerde namazları kıldıktan sonra aniden vefat edene kadar. Ölüm gününde seksen yıldan fazla yaşamış ve geride çocuklar bırakmıştı; bunlardan biri altmışa yakın yaşlı bir adamdı {cite:shadharat-dhahab s. 262}."
  id: "Zain al-Din ibn al-Adami al-Hamawi al-Hamawi, seorang pendakwah, berjuang dalam membuat penunjukan, unggul di dalamnya, menjadi terkenal, dan menjadi kaya. Setelah Takkiyya, ia menetap di Kairo hingga meninggal. Selama waktu itu, ia diangkat sebagai pengkhotbah Masjid Al-Aqsa, kemudian pergi dan terus menjalankan janji serta berbicara di pertemuan yang telah disiapkan. Namanya menjadi terkenal dan reputasinya menyebar. Ia sering hanya membaca dari buku dengan nada yang baik dan pelafalan yang benar. Ia membaca Sahih al-Bukhari di beberapa tempat selama Ramadan hingga ia meninggal secara tiba-tiba pada tanggal kedua Dhu al-Qi'dah tahun 848 H, setelah melakukan shalat yang ditentukan di dua tempat. Pada hari kematiannya, ia telah hidup lebih dari delapan puluh tahun dan meninggalkan anak-anak, salah satunya adalah seorang pria tua yang hampir berusia enam puluh {cite:shadharat-dhahab hlm. 262}."
