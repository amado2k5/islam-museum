summary:
  ar: "مترجم وأستاذ كوري جنوبي للدراسات الإسلامية والعربية ⁦(مولود 1949)⁩، أستاذ في جامعة ميونغجي ورئيس الاتحاد الإسلامي الكوري، ترجم معاني القرآن الكريم وصحيح البخاري إلى الكورية، ونال جائزة الملك فيصل لخدمة الإسلام (2023)."
  en: "South Korean translator and professor of Islamic and Arabic studies (born 1949), professor at Myongji University and chairman of the Korea Muslim Federation, who translated the meanings of the Qur'an and Sahih al-Bukhari into Korean; King Faisal Prize for Service to Islam (2023)."
  ur: "جنوبی کوریا کے مترجم اور اسلامی و عربی علوم کے پروفیسر ⁦(پیدائش 1949ء)⁩، میونگجی یونیورسٹی کے پروفیسر اور کوریا مسلم فیڈریشن کے صدر، جنھوں نے قرآن کے معانی اور صحیح بخاری کا کوریائی ترجمہ کیا؛ شاہ فیصل انعام برائے خدمتِ اسلام ⁦(2023ء)⁩۔"
  es: "Traductora y profesora surcoreana de estudios islámicos y árabes (nacida en 1949), profesora de la Universidad de Myongji y presidenta de la Federación Musulmana de Corea, que tradujo los significados del Corán y del Sahih al-Bukhari al coreano; Premio Rey Faisal al Servicio del Islam (2023)."
  fr: "Traducteur et professeur sud-coréen d'études islamiques et arabes (né en 1949), professeur à l'université Myongji et président de la Fédération musulmane de Corée, qui a traduit les significations du Coran et du Sahih al-Bukhari en coréen; Prix du roi Faisal pour services rendus à l'islam (2023)."
  tr: "Güney Koreli bir çevirmen ve İslam ile Arap çalışmaları profesörü (d. 1949), Myeongji Üniversitesi'nde profesör ve Kore İslam Federasyonu başkanıdır. Kur'an-ı Kerim ve Sahih al-Buhari'nin anlamlarını Korece'ye çevirdi ve İslam'a Hizmet Kral Faysal Ödülü'nü (2023) aldı."
  id: "Seorang penerjemah dan profesor studi Islam dan Arab asal Korea Selatan (lahir 1949), profesor di Universitas Myeongji, dan presiden Federasi Islam Korea. Ia menerjemahkan makna Al-Qur'an dan Sahih al-Bukhari ke dalam bahasa Korea dan menerima Penghargaan King Faisal untuk Pelayanan kepada Islam (2023)."
