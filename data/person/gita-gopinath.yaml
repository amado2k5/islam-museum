summary:
  ar: "جيتا غوبيناث (وُلدت في 8 ديسمبر 1971) اقتصادية هندية أمريكية، شغلت منصب كبيرة اقتصاديي صندوق النقد الدولي (2019–2022) — أول امرأة في هذا المنصب — ثم النائب الأول للمدير العام للصندوق (2022–2025)، وعادت بعدها إلى جامعة هارفارد أستاذة للاقتصاد. وُلدت في كلكتا في أسرة ماليالية ونشأت في ميسور، وتعلّمت في دلهي وواشنطن وبرينستون، وهي التي أطلقت على ركود سنة 2020 العالمي اسم «الإغلاق الكبير» وشاركت في وضع خطة الصندوق لإنهاء الجائحة."
  en: "Gita Gopinath (born 8 December 1971) is an Indian-American economist who served as chief economist of the International Monetary Fund (2019–2022) — the first woman to hold the post — and then as the Fund's first deputy managing director (2022–2025), before returning to Harvard University as a professor of economics. Born at Kolkata into a Malayali family and raised at Mysore, educated at Delhi, the University of Washington and Princeton, she named the worldwide recession of 2020 'the Great Lockdown' and co-authored the IMF's plan to end the COVID-19 pandemic."
  ur: "گیتا گوپی ناتھ (پیدائش 8 دسمبر 1971ء) ایک بھارتی نژاد امریکی ماہر اقتصادیات ہیں جو بین الاقوامی مالیاتی فنڈ کی چیف اکانومسٹ (2019ء–2022ء) رہیں — اس عہدے پر فائز ہونے والی پہلی خاتون — اور پھر فنڈ کی پہلی نائب منیجنگ ڈائریکٹر (2022ء–2025ء) رہیں، جس کے بعد وہ ہارورڈ یونیورسٹی میں اقتصادیات کی پروفیسر کی حیثیت سے واپس آئیں۔ کلکتہ میں ایک ملیالی گھرانے میں پیدا ہوئیں، میسور میں پلیں بڑھیں، دہلی، واشنگٹن یونیورسٹی اور پرنسٹن سے تعلیم حاصل کی؛ 2020ء کی عالمی کساد بازاری کو ”دی گریٹ لاک ڈاؤن“ کا نام انھوں نے دیا اور کووڈ۔19 وبا کے خاتمے کے لیے آئی ایم ایف کے منصوبے کی شریک مصنفہ رہیں۔"
