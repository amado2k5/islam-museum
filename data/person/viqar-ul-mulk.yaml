summary:
  ar: "سياسي هندي مسلم، وُلد باسم مشتاق حسين في ميروت سنة 1841، وخدم دولة حيدر آباد سبعة عشر عامًا حتى صار نائبًا لرئيس وزرائها، فنال لقب نواب وقار الملك سنة 1890. كان من أشد أنصار السيد أحمد خان، وجمع 750 ألف روبية لكلية عليكرة، وصار أمينها الفخري سنة 1907. وفي دكا سنة 1906 كان من مؤسسي رابطة مسلمي عموم الهند وأمينها العام الأول ورئيس جلستها الافتتاحية."
  en: "Indian Muslim politician, born Mushtaq Hussain at Meerut in 1841. He served the state of Hyderabad for seventeen years, rising to Deputy Prime Minister, and received the title Nawab Viqar-ul-Mulk in 1890. A leading supporter of Syed Ahmad Khan, he raised 750,000 rupees for the MAO College at Aligarh and became its honorary secretary in 1907. At Dacca in 1906 he was a founder of the All India Muslim League, its first general secretary, and president of its inaugural session."
  ur: "ہندوستانی مسلمان سیاست دان، جو 1841 میں میرٹھ میں مشتاق حسین کے نام سے پیدا ہوئے۔ انھوں نے ریاست حیدر آباد کی سترہ سال خدمت کی اور نائب وزیر اعظم کے عہدے تک پہنچے، 1890 میں نواب وقار الملک کا خطاب ملا۔ سر سید احمد خان کے سرگرم حامی تھے، علی گڑھ کالج کے لیے ساڑھے سات لاکھ روپے جمع کیے اور 1907 میں کالج کے اعزازی سیکرٹری بنے۔ 1906 میں ڈھاکہ میں آل انڈیا مسلم لیگ کے بانیوں میں شامل تھے، اس کے پہلے جنرل سیکرٹری بنے اور افتتاحی اجلاس کی صدارت کی۔"
