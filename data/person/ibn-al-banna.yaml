summary:
  ar: فقيه ومقرئ ومحدّث وواعظ من بغداد، ويذكر الكتاب أنه صنّف نحو خمس مئة مصنف، منها «المجرد» في الفقه و«شرح الخرقي».
  en: "A jurist, Qur'an reciter, hadith scholar and preacher of Baghdad; the book records that he wrote nearly five hundred works, among them al-Mujarrad on jurisprudence and a commentary on al-Kharaqi."
  es: "Jurista, recitador del Corán, erudito en hadices y predicador de Bagdad; el libro recoge que escribió cerca de quinientas obras, entre ellas al-Mujarrad sobre jurisprudencia y un comentario sobre al-Kharaqi."
  fr: "Juriste, récitateur du Coran, spécialiste du hadith et prédicateur de Bagdad; le livre rapporte qu'il a écrit près de cinq cents ouvrages, parmi lesquels al-Mujarrad sur la jurisprudence et un commentaire sur al-Kharaqi."
  ur: "ایک فقیہ، قاری قرآن، حدیث کا عالم اور بغداد کا مبلغ؛ کتاب میں درج ہے کہ اس نے تقریباً پانچ سو تصانیف لکھی ہیں جن میں سے فقہ پر المجرد اور الخراقی کی تفسیر ہے۔"
  tr: "Bağdatlı bir hukukçu, şiirci, hadis alimi ve vaizdir. Kitapta, \"Al-Mujarrad\" (fıkıh al-Mujarrad) ve \"Sharh Al-Khurqi\" dahil olmak üzere yaklaşık beş yüz eser yazdığı belirtilir."
  id: "Seorang ahli hukum, pembaca hadis, dan penceramah dari Baghdad. Buku tersebut menyebutkan bahwa ia menulis sekitar lima ratus karya, termasuk \"Al-Mujarrad\" dalam bidang hukum dan \"Sharh Al-Khurqi.\""
