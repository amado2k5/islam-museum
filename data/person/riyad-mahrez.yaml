summary:
  ar: "لاعب كرة قدم جزائري محترف، وُلد في كليشي بفرنسا سنة 1991؛ جناح أيمن صعد عبر كيمبر ولوهافر إلى ليستر سيتي، حيث نال جائزة أفضل لاعب من رابطة اللاعبين المحترفين في موسم لقب الدوري الإنجليزي 2015–16، ثم فاز بأربعة ألقاب أخرى للدوري وبطولة دوري أبطال أوروبا 2022–23 ضمن ثلاثية مع مانشستر سيتي قبل انضمامه إلى الأهلي السعودي سنة 2023؛ وقاد الجزائر قائدًا إلى لقب كأس أمم أفريقيا 2019 وسُمّي أفضل لاعب أفريقي سنة 2016."
  en: "Algerian professional footballer, born in Clichy, France, in 1991. A right winger who rose through Quimper and Le Havre to Leicester City, where he was PFA Players' Player of the Year in the club's 2015-16 Premier League title season, then won four more Premier League titles and the 2022-23 UEFA Champions League as part of a treble with Manchester City before joining Saudi club Al-Ahli in 2023; he captained Algeria to the 2019 Africa Cup of Nations title and was named CAF African Footballer of the Year in 2016."
  ur: "الجزائر کے پیشہ ور فٹبالر، 1991 میں فرانس کے کلیشی میں پیدا ہوئے؛ دائیں ونگر جو کیمپر اور لو آوغ سے ہوتے ہوئے لیسٹر سٹی پہنچے، جہاں کلب کے 2015–16 پریمیئر لیگ خطاب والے سیزن میں پی ایف اے پلیئرز پلیئر آف دی ایئر رہے، پھر مانچسٹر سٹی کے ساتھ مزید چار پریمیئر لیگ خطابات اور 2022–23 یوئیفا چیمپئنز لیگ بطور ٹریبل جیتی اور 2023 میں سعودی کلب الاہلی میں شامل ہوئے؛ انہوں نے الجزائر کی قیادت کرتے ہوئے 2019 افریقہ کپ آف نیشنز جیتا اور 2016 میں سی اے ایف افریقی فٹبالر آف دی ایئر قرار پائے۔"
