summary:
  ar: "عثمان بن أحمد بن سعيد بن عثمان بن قائد النجدي، فقيه حنبلي من أفاضل النجديين، ولد في العيينة بنجد ورحل إلى دمشق ثم القاهرة وتوفي فيها سنة ١٠٩٧هـ الموافقة ١٦٨٦م."
  en: "Uthman ibn Ahmad ibn Sa'id ibn Uthman ibn Qa'id al-Najdi, a Hanbali jurist and one of the most distinguished Najdis, born at al-Uyayna in Najd, who travelled to Damascus and then Cairo and died there in 1097 AH, equal to 1686 CE."
  es: "Uthman ibn Ahmad ibn Sa'id ibn Uthman ibn Qa'id al-Najdi, jurista hanbalí y uno de los najdíes más distinguidos, nació en al-Uyayna en Najd, viajó a Damasco y luego a El Cairo y murió allí en 1097 AH, equivalente a 1686 CE."
  fr: "Uthman ibn Ahmad ibn Sa'id ibn Uthman ibn Qa'id al-Najdi, juriste hanbalite et l'un des Najdis les plus distingués, né à al-Uyayna dans le Najd, qui voyagea à Damas puis au Caire et y mourut en 1097 AH, soit 1686 CE."
  ur: "عثمان بن احمد بن سعید بن عثمان بن قائد النجدی، ایک حنبلی فقیہ اور ممتاز نجدیوں میں سے ایک، نجد میں العیینہ میں پیدا ہوئے، جس نے دمشق اور پھر قاہرہ کا سفر کیا اور وہیں 1097 ہجری، یعنی 1686 عیسوی میں وفات پائی۔"
