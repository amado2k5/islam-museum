summary:
  ar: "أحد الفرسان الذين ذكر الكتاب أنهم وقفوا مع الهادي في معركة تهامة بعد انكسار ميسرته، وهو «حسين العقدي» في ص296."
  en: "One of the horsemen the book says stood with al-Hadi in the Tihama fight after his left wing broke, named \"Husayn al-Aqadi\" on p. 296."
  ur: "ان سواروں میں سے ایک جنہیں کتاب کے مطابق تہامہ کی لڑائی میں بائیں بازو ٹوٹنے کے بعد ہادی کے ساتھ کھڑا بتایا گیا، ص296 پر «حسین العقدی» کے نام سے۔"
  es: "Uno de los jinetes que, según el libro, luchó junto a al-Hadi en la batalla de Tihama después de que su flanco izquierdo se rompiera, se llama \"Husayn al-Aqadi\" y aparece en la página 296."
  fr: "L'un des cavaliers qui, selon le livre, est resté avec al-Hadi lors du combat de Tihama après que son aile gauche ait été brisée, nommé « Husayn al-Aqadi » à la page 296."
