summary:
  ar: "مفسر ينقل عنه رشيد رضا في تفسير قوله تعالى «سيقول السفهاء»: أن السفهاء هم الذين خفّت أحلامهم واستخفوا بالتقليد والإعراض عن النظر. ولم يذكر الجزء الثاني من التفسير اسمه كاملاً ولا تاريخه، فلم يُسجَّل هنا تاريخ ولا نسبة كتاب. {cite:tafsir-manar-v02 p.3}"
  en: "Commentator whom Rashid Rida quotes on 'the foolish' in Q. 2:142: people whose judgement is unsettled, who follow imitation and turn away from reflection. The volume gives neither his full name nor his dates, so none are recorded here {cite:tafsir-manar-v02 p.3}."
