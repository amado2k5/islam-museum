summary:
  ar: "عبد الله بن أمية بن عبد الله بن خالد بن أسيد؛ عقد له أبوه على سجستان وهو بكرمان فصالح رتبيل الثاني حين نزل بست على ألف ألف فأبى قبول الهدايا والرقيق وقال إن ملأ لي هذا الرواق ذهباً وإلا فلا صلح بيني وبينه وكان غروراً فأوغل في البلاد فأخذ رتبيل عليه الشعاب فصالحه على ثلاثمائة ألف درهم وكتاب بعدم الغزو فعزله عبد الملك."
  en: "Abdullah ibn Umayya; given Sijistan by his father while at Kirman — truced the second Rutbil at Bust for a million, refused gifts with 'fill this portico with gold or no peace', a ruse that let Rutbil trap him in the defiles; he settled for three hundred thousand, a written covenant, and no-raid terms — and Abd al-Malik dismissed him."
