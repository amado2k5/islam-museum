label: { ar: "عبد الله بن أمية", en: "Abdullah ibn Umayya", fr: "Abdullah ibn Umayya", es: "Abdullah ibn Umayya" }
summary:
  ar: "عبد الله بن أمية بن عبد الله بن خالد بن أسيد؛ عقد له أبوه على سجستان وهو بكرمان فصالح رتبيل الثاني حين نزل بست على ألف ألف فأبى قبول الهدايا والرقيق وقال إن ملأ لي هذا الرواق ذهباً وإلا فلا صلح بيني وبينه وكان غروراً فأوغل في البلاد فأخذ رتبيل عليه الشعاب فصالحه على ثلاثمائة ألف درهم وكتاب بعدم الغزو فعزله عبد الملك."
  en: "Abdullah ibn Umayya; given Sijistan by his father while at Kirman — truced the second Rutbil at Bust for a million, refused gifts with 'fill this portico with gold or no peace', a ruse that let Rutbil trap him in the defiles; he settled for three hundred thousand, a written covenant, and no-raid terms — and Abd al-Malik dismissed him."
  fr: "Abdullah ibn Umayya ; son père lui confia le Sijistan alors qu'il se trouvait au Kirman — il conclut une trêve avec le second Rutbil à Bust pour un million, refusa les présents en disant « remplis ce portique d'or ou pas de paix », une ruse qui permit à Rutbil de le piéger dans les défilés ; il se contenta de trois cent mille, d'un pacte écrit et de conditions de non-agression — et Abd al-Malik le destitua."
  es: "Abdullah ibn Umayya, a quien su padre le había dado Sijistan mientras estaba en Kirman, negoció una tregua con el segundo Rutbil en Bust por un millón, rechazó los regalos con la excusa de \"llenen este pórtico de oro o no habrá paz\", una estratagema que permitió a Rutbil atraparlo en los desfiladeros; se conformó con trescientos mil, un pacto escrito y la prohibición de realizar incursiones, y Abd al-Malik lo destituyó."
