label: { ar: "عبد الله بن أمية", en: "Abdullah ibn Umayya", fr: "Abdullah ibn Umayya", es: "Abdullah ibn Umayya", ur: "عبداللہ بن امیہ" }
summary:
  ar: "عبد الله بن أمية بن عبد الله بن خالد بن أسيد؛ عقد له أبوه على سجستان وهو بكرمان فصالح رتبيل الثاني حين نزل بست على ألف ألف فأبى قبول الهدايا والرقيق وقال إن ملأ لي هذا الرواق ذهباً وإلا فلا صلح بيني وبينه وكان غروراً فأوغل في البلاد فأخذ رتبيل عليه الشعاب فصالحه على ثلاثمائة ألف درهم وكتاب بعدم الغزو فعزله عبد الملك."
  en: "Abdullah ibn Umayya; given Sijistan by his father while at Kirman — truced the second Rutbil at Bust for a million, refused gifts with 'fill this portico with gold or no peace', a ruse that let Rutbil trap him in the defiles; he settled for three hundred thousand, a written covenant, and no-raid terms — and Abd al-Malik dismissed him."
  fr: "Abdullah ibn Umayya ; son père lui confia le Sijistan alors qu'il se trouvait au Kirman — il conclut une trêve avec le second Rutbil à Bust pour un million, refusa les présents en disant « remplis ce portique d'or ou pas de paix », une ruse qui permit à Rutbil de le piéger dans les défilés ; il se contenta de trois cent mille, d'un pacte écrit et de conditions de non-agression — et Abd al-Malik le destitua."
  es: "Abdullah ibn Umayya, a quien su padre le había dado Sijistan mientras estaba en Kirman, negoció una tregua con el segundo Rutbil en Bust por un millón, rechazó los regalos con la excusa de \"llenen este pórtico de oro o no habrá paz\", una estratagema que permitió a Rutbil atraparlo en los desfiladeros; se conformó con trescientos mil, un pacto escrito y la prohibición de realizar incursiones, y Abd al-Malik lo destituyó."
  ur: "عبداللہ بن امیہ؛ کرمان میں رہتے ہوئے اپنے والد کی طرف سے سجستان دیا گیا - بسٹ میں دوسری رتبل کو دس لاکھ کے عوض دیا گیا، تحفے سے انکار کر دیا کہ 'اس پورٹیکو کو سونے سے بھر دو یا امن نہیں'، یہ ایک ایسی چال ہے جس نے روتبل کو اسے ناپاکیوں میں پھنسا دیا۔ اس نے تین لاکھ، ایک تحریری عہد اور بغیر چھاپے کی شرائط طے کی - اور عبد الملک نے اسے برطرف کردیا۔"
  tr: "Abdullah ibn Umayya ibn Abdullah ibn Halid ibn Asid; babası Kerman'dayken onu Sistan valiliğine atadı. Sistan'a inen Ratbil II ile bir milyon dirhem karşılığında barış yaptı, ancak Ratbil II hediyeleri ve köleleri kabul etmeyi reddederek, \"Eğer bu revakı benim için altınla doldurursa, o zaman benimle onun arasında barış olmaz\" dedi. Kibirliydi, bu yüzden ülkenin derinliklerine gitti ve Ratbil dağ geçitlerini onun üzerinden geçti, bu yüzden onunla üç yüz bin dirhem ve işgal etmeme sözü karşılığında barış yaptı, bunun üzerine Abdül Malik onu görevden aldı."
  id: "Abdullah ibn Umayya ibn Abdullah ibn Khalid ibn Asid; ayahnya mengangkatnya sebagai gubernur Sistan ketika ia berada di Kerman. Ia berdamai dengan Ratbil II ketika ia datang ke Sistan dengan imbalan satu juta dirham, tetapi Ratbil menolak menerima hadiah dan budak dan berkata, “Jika ia memenuhi serambi ini dengan emas untukku, maka tidak akan ada perdamaian antara aku dan dia.” Karena kesombongannya, ia pergi jauh ke pedalaman, dan Ratbil merebut jalur pegunungan di atasnya, sehingga ia berdamai dengannya dengan imbalan tiga ratus ribu dirham dan surat untuk tidak menyerang, sehingga Abdul Malik memecatnya."
