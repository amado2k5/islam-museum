summary:
  ar: "داعية إسلامي مصري يقدّم برامج دينية على القنوات الفضائية، أشهرها على قناة الرحمة، وله دروس ومحاضرات في المساجد؛ يحفظ له أرشيف أسابيل سلسلتين: «المبشرون بالجنة» في سِيَر من بُشّروا بالجنة من الصحابة والصحابيات ⁦(ثمانٍ وعشرون حلقة)⁩، و«وصايا الرسول للنساء» ⁦(أربع عشرة حلقة، باسم «همسات» في الأرشيف)⁩."
  en: "Egyptian Islamic preacher who presents religious programmes on satellite channels, best known on al-Rahma channel, and gives lessons and lectures in mosques; the Assabile archive keeps two series of his: 'Those Given Glad Tidings of Paradise', on the lives of the Companions, men and women, promised Paradise (twenty-eight episodes), and 'The Prophet's Counsels to Women' (fourteen episodes, filed as 'Hamasat' in the archive)."
  ur: "مصری اسلامی داعی جو سیٹلائٹ چینلوں پر دینی پروگرام پیش کرتے ہیں، جن میں سب سے مشہور الرحمہ چینل پر ہیں، اور مساجد میں دروس و محاضرات دیتے ہیں؛ اسابیل آرکائیو میں ان کے دو سلسلے محفوظ ہیں: «المبشرون بالجنة»، جنت کی بشارت پانے والے صحابہ و صحابیات کی سیرتوں پر (اٹھائیس اقساط)، اور «وصايا الرسول للنساء» (چودہ اقساط، آرکائیو میں «ہمسات» کے نام سے)۔"
