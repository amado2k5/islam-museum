summary:
  ar: "محمد بن حسن اللقاني، شمس الدين، أبو عبد الله، من أهل مصر، فقيه مالكي حافظ للمذهب ومحقق، أخذ عن أحمد زروق وغيره، وانتفع الناس به في الفتوى وغيرها. وهو أخو ناصر الدين اللقاني. له طرر ⁦(حواش)⁩ محررة على مختصر خليل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  en: "Muhammad ibn Hasan al-Laqani, Shams al-Din, Abu Abd Allah, of Egypt, a Maliki jurist who knew the school by heart and was a verifier. He studied under Ahmad Zarruq and others, and people benefited from him in fatwas and teaching. He was the brother of Nasir al-Din al-Laqani. He wrote careful glosses (tarar) on Khalil's Mukhtasar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  es: "Muhammad ibn Hasan al-Laqani, Shams al-Din, Abu Abd Allah, de Egipto, fue un jurista malikí que conocía la escuela a la perfección y era un verificador. Estudió con Ahmad Zarruq y otros, y la gente se benefició de sus fatuas y enseñanzas. Era hermano de Nasir al-Din al-Laqani. Escribió glosas (tarar) detalladas sobre el Mukhtasar de Khalil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  fr: "Muhammad ibn Hasan al-Laqani, Shams al-Din, Abu Abd Allah, d'Égypte, était un juriste malikite qui connaissait parfaitement l'école et en était un vérificateur. Il étudia auprès d'Ahmad Zarruq et d'autres, et son enseignement et ses fatwas furent une source de bienfaits pour beaucoup. Il était le frère de Nasir al-Din al-Laqani. Il rédigea des gloses (tarar) détaillées sur le Mukhtasar de Khalil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  ur: "محمد بن حسن لقانی، شمس الدین، ابو عبد اللہ، مصر، ایک مالکی فقیہ جو مکتب کو دل سے جانتے تھے اور تصدیق کرنے والے تھے۔ انہوں نے احمد زرق اور دیگر کے زیرِ تعلیم تعلیم حاصل کی اور لوگوں نے فتاویٰ اور تدریس میں ان سے استفادہ کیا۔ وہ ناصر الدین لاقانی کے بھائی تھے۔ انہوں نے خلیل کے مختسر پر محتاط چمک ⁦(تارڑ)⁩ لکھا۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1641}"
  tr: "Muhammed bin Hasan el-Laqani, Şemseddin, Mısır'dan Ebu Abdullah, okulun ezbercisi ve doğrulayıcı Maliki hukukçusu, Ahmed Zerruq ve diğerlerinin yanında eğitim aldı ve fetva ve diğer konularda insanlara fayda sağladı. Nasir al-Din al-Luqani'nin kardeşiydi. Mukhtasar Khalil üzerine düzenlenmiş notları (kenar notları) bulunmaktadır. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.1641}"
  id: "Muhammad ibn Hasan al-Laqani, Shams al-Din, Abu Abdullah dari Mesir, ahli hukum Maliki, pengapal sekolah dan verifiator, belajar di bawah Ahmad Zarruq dan lainnya, serta memberikan manfaat kepada orang-orang dalam penerbitan fatwa dan hal-hal lainnya. Ia adalah saudara Nasir al-Din al-Luqani. Ia memiliki catatan (catatan pinggir) yang diedit tentang Mukhtasar Khalil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1641}"
