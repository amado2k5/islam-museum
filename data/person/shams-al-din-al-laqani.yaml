summary:
  ar: "محمد بن حسن اللقاني، شمس الدين، أبو عبد الله، من أهل مصر، فقيه مالكي حافظ للمذهب ومحقق، أخذ عن أحمد زروق وغيره، وانتفع الناس به في الفتوى وغيرها. وهو أخو ناصر الدين اللقاني. له طرر (حواش) محررة على مختصر خليل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  en: "Muhammad ibn Hasan al-Laqani, Shams al-Din, Abu Abd Allah, of Egypt, a Maliki jurist who knew the school by heart and was a verifier. He studied under Ahmad Zarruq and others, and people benefited from him in fatwas and teaching. He was the brother of Nasir al-Din al-Laqani. He wrote careful glosses (tarar) on Khalil's Mukhtasar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
