summary:
  ar: "عز الدين عبد الهادي بن شرف الإسلام الحنبلي؛ كان فقيهاً واعظاً شجاعاً حسن الصوت بالقرآن شديد القوة شديداً في السنة، تُحكى عنه حكايات عجيبة في شدة قوته منها أنه بارز فارساً من الفرنج فضربه بدبوس فقطع ظهره وظهر الفرس فوقعا جميعاً، وكان في صحبة أسد الدين شيركوه إلى مصر وشاهده جماعة رفع الحجر الذي على بئر جامع دمشق فمشى به خطوات ثم رده إلى مكانه، وبنى مدرسة بمصر ومات قبل تمامها، وهو أخو نجم الدين المذكور قبله؛ توفي بمصر سنة ست وثمانين وخمسمائة {cite:shadharat-dhahab p. 766}."
  en: "Izz al-Din Abd al-Hadi b. Sharaf al-Islam the Hanbali; jurist, preacher, brave, beautiful-voiced in the Qur'an, immensely strong and stern upon the Sunna — wonders are told of his strength: he dueled a Frankish horseman and struck him with a mace that split the rider's back and the horse's together, and witnesses saw him lift the stone over the Damascus mosque's well and carry it steps before setting it back. He accompanied Asad al-Din Shirkuh to Egypt, began a madrasa there and died before its completion; he died in Egypt in 586 {cite:shadharat-dhahab p. 766}."
  es: "Izz al-Din Abd al-Hadi b. Sharaf al-Islam, el hanbalí, jurista, predicador, valiente, de hermosa voz en el Corán, inmensamente fuerte y severo en la Sunna, se cuentan maravillas de su fuerza: se batió en duelo con un jinete franco y lo golpeó con una maza que partió la espalda del jinete y la del caballo a la vez, y testigos lo vieron levantar la piedra del pozo de la mezquita de Damasco y llevarla unos pasos antes de volver a colocarla. Acompañó a Asad al-Din Shirkuh a Egipto, fundó allí una madrasa y murió antes de su finalización; murió en Egipto en el año 586 {cite:shadharat-dhahab p. 766}."
  fr: "Izz al-Din Abd al-Hadi b. Sharaf al-Islam, hanbalite, juriste, prédicateur, courageux, à la voix mélodieuse récitant le Coran, d'une force immense et d'une rigueur inflexible dans l'application de la Sunna, était réputé pour sa force prodigieuse. On raconte qu'il affronta en duel un cavalier franc et le frappa d'une masse d'armes qui fendit simultanément le dos du cavalier et celui de sa monture. Des témoins l'ont vu soulever la pierre qui recouvrait le puits de la mosquée de Damas, la transporter sur plusieurs marches, puis la reposer. Il accompagna Asad al-Din Shirkuh en Égypte, où il fonda une madrasa, mais mourut avant son achèvement en 586 av. J.-C. (Source: Hadharat-Dhahab, p. 766)."
  ur: "عزالدین عبد الہادی بی۔ شرف الاسلام حنبلی؛ فقیہ، مبلغ، بہادر، قرآن میں خوبصورت آواز والا، سنت پر بہت مضبوط اور سخت - اس کی طاقت کے بارے میں عجائبات بتائے گئے ہیں: اس نے ایک فرینکش گھڑ سوار سے مقابلہ کیا اور اسے ایسی گدی سے مارا جس سے سوار کی پیٹھ اور گھوڑے کی پیٹھ الگ ہوگئی، اور عینی شاہدین نے اسے دمشق کی مسجد کے اوپر سے پتھر اٹھاتے ہوئے دیکھا۔ وہ اسد الدین شرکوہ کے ساتھ مصر گیا، وہاں ایک مدرسہ شروع کیا اور اس کے مکمل ہونے سے پہلے ہی فوت ہو گیا۔ ان کی وفات مصر میں 586 میں ہوئی۔ 766}۔"
