summary:
  ar: "عز الدين عبد الهادي بن شرف الإسلام الحنبلي؛ كان فقيهاً واعظاً شجاعاً حسن الصوت بالقرآن شديد القوة شديداً في السنة، تُحكى عنه حكايات عجيبة في شدة قوته منها أنه بارز فارساً من الفرنج فضربه بدبوس فقطع ظهره وظهر الفرس فوقعا جميعاً، وكان في صحبة أسد الدين شيركوه إلى مصر وشاهده جماعة رفع الحجر الذي على بئر جامع دمشق فمشى به خطوات ثم رده إلى مكانه، وبنى مدرسة بمصر ومات قبل تمامها، وهو أخو نجم الدين المذكور قبله؛ توفي بمصر سنة ست وثمانين وخمسمائة {cite:shadharat-dhahab p. 766}."
  en: "Izz al-Din Abd al-Hadi b. Sharaf al-Islam the Hanbali; jurist, preacher, brave, beautiful-voiced in the Qur'an, immensely strong and stern upon the Sunna — wonders are told of his strength: he dueled a Frankish horseman and struck him with a mace that split the rider's back and the horse's together, and witnesses saw him lift the stone over the Damascus mosque's well and carry it steps before setting it back. He accompanied Asad al-Din Shirkuh to Egypt, began a madrasa there and died before its completion; he died in Egypt in 586 {cite:shadharat-dhahab p. 766}."
