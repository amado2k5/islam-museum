summary:
  ar: "أبو بكر بن علي بن محمد الحداد الزبيدي، فقيه حنفي يماني من أهل العبادية في وادي زبيد، استقر في زبيد وتوفي بها سنة ٨٠٠هـ؛ له السراج الوهاج والجوهرة النيرة في شرح مختصر القدوري وتفسير يعرف بتفسير الحداد."
  en: "Abu Bakr ibn Ali ibn Muhammad al-Haddad al-Zabidi, a Yemeni Hanafi jurist from al-Ibadiyya in Wadi Zabid, who settled and died in Zabid in 800 AH (1397); author of al-Siraj al-wahhaj and al-Jawhara al-nayyira, commentaries on the Mukhtasar of al-Quduri, and an exegesis known as the Tafsir of al-Haddad."
