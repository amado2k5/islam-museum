summary:
  ar: "أبو بكر بن علي بن محمد الحداد الزبيدي، فقيه حنفي يماني من أهل العبادية في وادي زبيد، استقر في زبيد وتوفي بها سنة ٨٠٠هـ؛ له السراج الوهاج والجوهرة النيرة في شرح مختصر القدوري وتفسير يعرف بتفسير الحداد."
  en: "Abu Bakr ibn Ali ibn Muhammad al-Haddad al-Zabidi, a Yemeni Hanafi jurist from al-Ibadiyya in Wadi Zabid, who settled and died in Zabid in 800 AH (1397); author of al-Siraj al-wahhaj and al-Jawhara al-nayyira, commentaries on the Mukhtasar of al-Quduri, and an exegesis known as the Tafsir of al-Haddad."
  fr: "Abu Bakr ibn Ali ibn Muhammad al-Haddad al-Zabidi, juriste hanafite yéménite d'al-Ibadiyya dans le Wadi Zabid, qui s'établit et mourut à Zabid en 800 H (1397) ; auteur d'al-Siraj al-wahhaj et d'al-Jawhara al-nayyira, commentaires du Mukhtasar d'al-Quduri, et d'une exégèse connue sous le nom de Tafsir d'al-Haddad."
  es: "Abu Bakr ibn Ali ibn Muhammad al-Haddad al-Zabidi, un jurista yemení hanafi de al-Ibadiyya en Wadi Zabid, que se estableció y murió en Zabid en 800 AH (1397); autor de al-Siraj al-wahhaj y al-Jawhara al-nayyira, comentarios sobre el Mukhtasar de al-Quduri y una exégesis conocida como el Tafsir de al-Haddad."
