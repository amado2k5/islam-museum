summary:
  ar: "أحمد بن إسماعيل الكوراني، «العالم الرباني» الذي ولّاه السلطان مراد الثاني تعليم ولده محمد وهو أمير على مغنيسيا؛ كان الأمير قد أبى الامتثال لمعلمين قبله حتى لم يختم القرآن، فأعطاه السلطان قضيباً يضربه به إن خالف أمره، فدخل عليه والقضيب بيده وقال: «أرسلني والدك للتعليم والضرب إذا خالفت أمري»، فضحك الأمير فضربه في ذلك المجلس ضرباً شديداً حتى خاف منه، وختم القرآن في مدة يسيرة {cite:dawlat-uthmaniyya-salabi p. 90-91}. ويصفه الصلابي بأنه مشهود له بالفضيلة التامة، ممن يمزق الأمر السلطاني إن وجد فيه مخالفة للشرع، ويخاطب السلطان باسمه ولا يقبل يده بل السلطان يقبل يده {cite:dawlat-uthmaniyya-salabi p. 90-91}، وأنه أيد في مجلس الشورى قبل الاقتحام رأي زوغنوش باشا بالاستمرار {cite:dawlat-uthmaniyya-salabi p. 106}."
  en: "Ahmad ibn Ismail al-Kurani, 'the godly scholar' whom Murad II appointed to teach his son Mehmed when the prince was governor of Manisa; earlier tutors had failed — the boy had not even finished a Qur'an recitation — so the sultan gave al-Kurani a rod to beat him if he disobeyed. The scholar entered, rod in hand: 'Your father sent me to teach you and to beat you if you disobey'; the prince laughed, and was beaten so soundly he feared him and completed the Qur'an soon after {cite:dawlat-uthmaniyya-salabi p. 90-91}. Al-Salabi describes him as one who would tear up a sultanic order that contravened the shari'a, address the sultan by name and never kiss his hand {cite:dawlat-uthmaniyya-salabi p. 90-91}, and he backed Zaganos at the final war council {cite:dawlat-uthmaniyya-salabi p. 106}."
