label: { ar: "أحمد بن محمد الطواويسي", en: "Ahmad ibn Muhammad al-Tawawisi" }
summary:
  ar: "أحمد بن محمد بن حامد بن هاشم الطواويسي، نسبة إلى طواويس، قرية من قرى بخارى على ثماني فراسخ منها. روى عن محمد بن نصر المروزي وعبد الله بن شيرويه النيسابوري وغيرهما، وروى عنه نصر بن محمد بن غريب الشاشي وأحمد بن عبد الله بن إدريس. ويذكر الكتاب وفاته سنة 344 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6806}"
  en: "Ahmad ibn Muhammad ibn Hamid ibn Hashim al-Tawawisi, named after Tawawis, a village eight farsakhs from Bukhara. He related from Muhammad ibn Nasr al-Marwazi and Abd Allah ibn Shirawayh al-Nisaburi, among others, and Nasr ibn Muhammad ibn Gharib al-Shashi and Ahmad ibn Abd Allah ibn Idris related from him. The book gives his death as 344 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6806}"
