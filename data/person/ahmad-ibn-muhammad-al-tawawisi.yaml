id: person/ahmad-ibn-muhammad-al-tawawisi
class: person
label: { ar: "أحمد بن محمد الطواويسي", en: "Ahmad ibn Muhammad al-Tawawisi", es: "Ahmad ibn Muhammad al-Tawawisi", fr: "Ahmad ibn Muhammad al-Tawawisi", ur: "احمد بن محمد التاویسی" }
summary:
  ar: "أحمد بن محمد بن حامد بن هاشم الطواويسي، نسبة إلى طواويس، قرية من قرى بخارى على ثماني فراسخ منها. روى عن محمد بن نصر المروزي وعبد الله بن شيرويه النيسابوري وغيرهما، وروى عنه نصر بن محمد بن غريب الشاشي وأحمد بن عبد الله بن إدريس. ويذكر الكتاب وفاته سنة 344 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6806}"
  en: "Ahmad ibn Muhammad ibn Hamid ibn Hashim al-Tawawisi, named after Tawawis, a village eight farsakhs from Bukhara. He related from Muhammad ibn Nasr al-Marwazi and Abd Allah ibn Shirawayh al-Nisaburi, among others, and Nasr ibn Muhammad ibn Gharib al-Shashi and Ahmad ibn Abd Allah ibn Idris related from him. The book gives his death as 344 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6806}"
  es: "Ahmad ibn Muhammad ibn Hamid ibn Hashim al-Tawawisi, llamado así por Tawawis, una aldea situada a ocho farsakhs de Bujará. Relató de Muhammad ibn Nasr al-Marwazi y Abd Allah ibn Shirawayh al-Nisaburi, entre otros, y Nasr ibn Muhammad ibn Gharib al-Shashi y Ahmad ibn Abd Allah ibn Idris relataron de él. El libro indica que falleció en el año 344 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6806}"
  fr: "Ahmad ibn Muhammad ibn Hamid ibn Hashim al-Tawawisi, du nom de Tawawis, village situé à huit farsakhs de Boukhara, tenait ses enseignements de Muhammad ibn Nasr al-Marwazi et d'Abd Allah ibn Shirawayh al-Nisaburi, entre autres. Nasr ibn Muhammad ibn Gharib al-Shashi et Ahmad ibn Abd Allah ibn Idris tenaient également ses enseignements de lui. L'ouvrage indique que son décès remonte à l'an 344 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6806}"
  ur: "احمد بن محمد بن حامد بن ہاشم التاویسی، بخارا سے آٹھ فرسخ کے فاصلے پر ایک گاؤں طاویس کے نام پر رکھا گیا۔ اس نے محمد بن نصر المروازی اور عبد اللہ بن شیراویہ النصابوری سے اور نصر بن محمد بن غریب الشاشی اور احمد بن عبد اللہ بن ادریس نے ان سے روایت کی ہے۔ کتاب ان کی وفات 344ھ بتاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص6806}"
