summary:
  ar: "أبو كريمة العبدي، كان بأوقاته ضنينًا، ويجد لفوتها منه حنينًا، وكان من عباد أهل الشام. روى عنه عيسى بن الهذيل قوله لابن آدم: ليس لما بقي من عمرك ثمن."
  en: "Abu Karima al-Abdi, who guarded his hours closely and grieved over their loss; one of the worshippers of Syria, he is reported by Isa ibn al-Hudhayl to have said: O son of Adam, what remains of your life has no price."
  ur: "ابو کریمہ عبدی اپنے اوقات کی حفاظت کرتے اور ان کے ضائع ہونے پر افسوس کرتے تھے۔ شام کے عبادت گزاروں میں سے تھے۔ عیسیٰ بن ہذیل نے ان سے نقل کیا کہ وہ کہتے: اے آدم کے بیٹے، تیری عمر کے باقی حصے کی کوئی قیمت نہیں۔"
  fr: "Abu Karima al-Abdi, qui veillait étroitement sur ses heures et s'affligeait de leur perte ; l'un des dévots de Syrie, Isa ibn al-Hudhayl rapporte qu'il disait : ô fils d'Adam, ce qui reste de ta vie n'a pas de prix."
  es: "Abu Karima al-Abdi, que cuidaba atentamente sus horas y se lamentaba por su pérdida; uno de los adoradores de Siria, según relata Isa ibn al-Hudhayl, dijo: Oh hijo de Adán, lo que queda de tu vida no tiene precio."
