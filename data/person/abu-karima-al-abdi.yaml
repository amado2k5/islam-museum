  ar: "أبو كريمة العبدي، كان بأوقاته ضنينًا، ويجد لفوتها منه حنينًا، وكان من عباد أهل الشام. روى عنه عيسى بن الهذيل قوله لابن آدم: ليس لما بقي من عمرك ثمن."
