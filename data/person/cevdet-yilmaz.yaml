summary:
  ar: "جودت يلماز ⁦(وُلد في 1 نيسان 1967 في بينكل)⁩ سياسي تركي من أصل زازي، نائب رئيس الجمهورية التركية منذ 3 حزيران 2023. عمل اقتصاديًا في هيئة تخطيط الدولة وانتُخب نائبًا عن بينكل سنة 2007، وتولى وزارة التنمية ⁦(2011–2015 و2015–2016)⁩ ونائبية رئيس الوزراء في الحكومة الانتخابية سنة 2015."
  en: "Cevdet Yılmaz (born 1 April 1967 in Bingöl) is a Turkish politician of Zaza origin who has been Vice President of Turkey since 3 June 2023. A State Planning Organization economist elected to parliament for Bingöl in 2007, he served as Minister of Development (2011–2015, 2015–2016) and as deputy prime minister in the 2015 interim election government."
  ur: "جودت یلماز (پیدائش 1 اپریل 1967، بنگول) زازا نژاد ترک سیاست دان ہیں جو 3 جون 2023 سے ترکی کے نائب صدر ہیں۔ وہ ریاستی منصوبہ بندی تنظیم کے ماہر معیشت رہے، 2007 میں بنگول سے رکن پارلیمنٹ منتخب ہوئے اور وزیر ترقی (2011–2015، 2015–2016) رہے۔"
