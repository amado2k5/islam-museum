summary:
  ar: "جودت يلماز ⁦(وُلد في 1 نيسان 1967 في بينكل)⁩ سياسي تركي من أصل زازي، نائب رئيس الجمهورية التركية منذ 3 حزيران 2023. عمل اقتصاديًا في هيئة تخطيط الدولة وانتُخب نائبًا عن بينكل سنة 2007، وتولى وزارة التنمية ⁦(2011–2015 و2015–2016)⁩ ونائبية رئيس الوزراء في الحكومة الانتخابية سنة 2015."
  en: "Cevdet Yılmaz (born 1 April 1967 in Bingöl) is a Turkish politician of Zaza origin who has been Vice President of Turkey since 3 June 2023. A State Planning Organization economist elected to parliament for Bingöl in 2007, he served as Minister of Development (2011–2015, 2015–2016) and as deputy prime minister in the 2015 interim election government."
  ur: "جودت یلماز ⁦(پیدائش 1 اپریل 1967، بنگول)⁩ زازا نژاد ترک سیاست دان ہیں جو 3 جون 2023 سے ترکی کے نائب صدر ہیں۔ وہ ریاستی منصوبہ بندی تنظیم کے ماہر معیشت رہے، 2007 میں بنگول سے رکن پارلیمنٹ منتخب ہوئے اور وزیر ترقی ⁦(2011–2015، 2015–2016)⁩ رہے۔"
  es: "Cevdet Yılmaz (nacido el 1 de abril de 1967 en Bingöl) es un político turco de origen zaza que ha sido vicepresidente de Turquía desde el 3 de junio de 2023. Economista de la Organización Estatal de Planificación, fue elegido diputado por Bingöl en 2007 y ocupó los cargos de ministro de Desarrollo (2011-2015, 2015-2016) y viceprimer ministro en el gobierno interino de las elecciones de 2015."
  fr: "Cevdet Yılmaz (né le 1er avril 1967 à Bingöl) est un homme politique turc d'origine Zaza qui est vice-président de la Turquie depuis le 3 juin 2023. Économiste de l'Organisation nationale de planification, élu au parlement pour Bingöl en 2007, il a été ministre du Développement (2011-2015, 2015-2016) et vice-premier ministre dans le gouvernement intérimaire issu des élections de 2015."
  tr: "Cevdet Yılmaz (1 Nisan 1967, Binkel doğumlu), Zazi kökenli Türk siyasetçidir ve 3 Haziran 2023'ten beri Türkiye Cumhuriyeti Cumhurbaşkan Yardımcısı olarak görev yapmaktadır. Devlet Planlama Komisyonu'nda ekonomik olarak çalıştı ve 2007'de Binkel milletvekili seçildi. Kalkınma Bakanlığı'nı (2011–2015 ve 2015–2016) yürüttü ve 2015 seçim hükümetinde Başbakan Yardımcısı olarak görev yaptı."
  id: "Cevdet Yilmaz (lahir 1 April 1967 di Binkel) adalah seorang politikus Turki keturunan Zazi, menjabat sebagai Wakil Presiden Republik Turki sejak 3 Juni 2023. Ia bekerja secara ekonomi di Komisi Perencanaan Negara dan terpilih sebagai deputi untuk Binkel pada tahun 2007. Ia pernah menjabat di Kementerian Pembangunan (2011–2015 dan 2015–2016) serta menjabat sebagai Wakil Perdana Menteri dalam pemerintahan pemilihan tahun 2015."
