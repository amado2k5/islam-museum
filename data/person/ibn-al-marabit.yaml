id: person/ibn-al-marabit
class: person
label: { ar: "أبو عبد الله ابن المرابط قاضي المرية" }
summary:
  ar: "أبو عبد الله ابن المرابط محمد بن خلف بن سعيد الأندلسي — قاضي المرية وعالمها؛ روى عن المهلب بن أبي صفرة وجماعة وصنف شرحاً للبخاري وكان رأساً في مذهب مالك ارتُحل الناس إليه؛ توفي في شوال سنة خمس وثمانين وأربعمائة {cite:shadharat-dhahab p. 375}."
  en: "Abu Abd Allah Ibn al-Marabit Muhammad b. Khalaf b. Sa'id al-Andalusi — qadi and scholar of Almeria; transmitted from al-Muhallab b. Abi Sufra among others, authored a commentary on al-Bukhari, and was a Maliki head to whom people travelled; died Shawwal 485 {cite:shadharat-dhahab p. 375}."
  es: "Abu Abd Allah Ibn al-Marabit Muhammad b. Khalaf b. Sa'id al-Andalusi — cadí y erudito de Almería; transmitido por al-Muhallab b. Abi Sufra, entre otros, fue autor de un comentario sobre al-Bukhari y fue un líder malikí al que acudía la gente; murió en Shawwal 485 {cita: shadharat-dhahab p. 375}."
  fr: "Abu Abd Allah Ibn al-Marabit Muhammad b. Khalaf b. Sa'id al-Andalusi — cadi et érudit d'Almeria; transmis par al-Muhallab b. Abi Sufra entre autres, auteur d'un commentaire sur al-Bukhari, et était un chef malikite auprès duquel les gens voyageaient; mort Shawwal 485 {cite:shadharat-dhahab p. 375}."
