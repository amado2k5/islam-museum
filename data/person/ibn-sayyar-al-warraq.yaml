summary:
  ar: 'كاتب عراقي من بغداد القرن العاشر، جامع «كتاب الطبيخ» — أقدم
    كتاب طبخ عربي باقٍ بأكثر من 600 وصفة في 132 باباً — ويُظن أنه
    أعدّه لبلاط الحمداني سيف الدولة بحلب {cite:wikipedia-ibn-sayyar-en}
    {cite:wikipedia-kitab-al-tabikh-en}.'
  en: 'An Iraqi author of tenth-century Baghdad, compiler of the
    Kitab al-Tabikh — the earliest surviving Arabic cookbook with
    more than 600 recipes in 132 chapters — which may have been
    prepared for the court of the Hamdanid Sayf al-Dawla at Aleppo
    {cite:wikipedia-ibn-sayyar-en} {cite:wikipedia-kitab-al-tabikh-en}.'
  ur: 'دسویں صدی کا بغدادی عراقی مصنف، کتاب الطبیخ کا مرتب — سب سے
    قدیم بچی عربی کتابِ طبخ جس میں 132 بابوں میں چھ سو سے زائد
    ترکیبیں — جو ممکن ہے حمدانی سید الدولہ کے حلبی دربار کے لیے
    تیار ہوئی {cite:wikipedia-ibn-sayyar-en}
    {cite:wikipedia-kitab-al-tabikh-en}۔'
  es: "Autor iraquí del siglo X en Bagdad, compilador del Kitab al-Tabikh —el libro de cocina árabe más antiguo que se conserva, con más de 600 recetas en 132 capítulos— que posiblemente fue preparado para la corte del hamdánida Sayf al-Dawla en Alepo. {cite:wikipedia-the-book-of-the-tabikh}."
  fr: "Un auteur irakien du Xe siècle à Bagdad, compilateur du Kitab al-Tabikh — le plus ancien livre de cuisine arabe conservé, contenant plus de 600 recettes réparties en 132 chapitres — qui aurait été préparé pour la cour du Hamdanide Sayf al-Dawla à Alep. {cite:wikipedia-the-book-of-the-tabikh}."
  tr: "10. yüzyıl Bağdatlı Iraklı bir yazar, 132 bölümde 600'den fazla tarif içeren en eski Arap yemek kitabı olan 'Yemek Kitabı'nın derleyicisi ve Halep'teki el-Hamdani'nin sarayı için hazırladığına inanılan Seyyid el-Devla {cite:wikipedia-ibn-sayyar-en} {cite:wikipedia-kitab-al-tabikh-en}."
  id: "Seorang penulis Irak dari Baghdad abad ke-10, penyusun 'Buku Memasak'—buku masak Arab tertua yang masih ada dengan lebih dari 600 resep dalam 132 bab—dan diyakini menyiapkannya untuk istana al-Hamdani, Sayyid al-Dawla di Aleppo {cite:wikipedia-ibn-sayyar-en} {cite:wikipedia-kitab-al-tabikh-en}."
