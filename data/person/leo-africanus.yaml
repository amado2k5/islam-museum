summary:
  ar: "الحسن بن محمد الوزان الفاسي (نحو 1494 – نحو 1554)، دبلوماسي وجغرافي أندلسي المولد مغربي النشأة، أُسر سنة 1518 وهو عائد من مهمة دبلوماسية، فحُمل إلى روما وعمّده البابا ليو العاشر سنة 1520 باسم يوحنا ليو دي ميديتشي. كتب في إيطاليا «وصف أفريقيا» (أُنجز 1526، ونشره راموزيو 1550) فصار لقرون مرجع أوروبا الأول في جغرافيا المغرب ووادي النيل. نهاية حياته غير موثقة: فمن قائل إنه مات في روما نحو 1550، وقائل إنه رجع إلى تونس وعاد إلى الإسلام، وثالث إنه انتقل بعدها إلى المغرب."
  en: "Al-Hasan ibn Muhammad al-Wazzan of Fez (c. 1494 – c. 1554), an Andalusi-born, Maghrebi-raised diplomat and geographer, was captured at sea in 1518 on his way back from a diplomatic mission, carried to Rome, and baptized by Pope Leo X in 1520 as Johannes Leo de Medicis. In Italy he wrote the Description of Africa (completed 1526, published by Ramusio in 1550), for centuries Europe's most authoritative account of the Maghreb and the Nile Valley. His end is undocumented: one theory keeps him in Rome until about 1550, another has him return to Tunis and reconvert to Islam, and a third sends him on to Morocco."
  ur: "حسن بن محمد الوزان فاسی (تقریباً 1494ء – تقریباً 1554ء)، اندلس میں پیدا ہونے والے اور مغرب میں پلے بڑھے سفارت کار اور جغرافیہ دان، 1518ء میں ایک سفارتی مہم سے واپسی پر سمندر میں قید ہوئے، روم لے جائے گئے اور 1520ء میں پوپ لیو دہم کے ہاتھوں بپتسمہ پا کر یوحنا لیو دے میڈیچی کہلائے۔ اٹلی میں انھوں نے «وصفِ افریقا» لکھی (تکمیل 1526ء، اشاعت 1550ء) جو صدیوں تک مغرب اور وادیِ نیل کے بارے میں یورپ کا سب سے مستند ماخذ رہی۔ ان کی زندگی کا انجام غیر دستاویزی ہے: ایک رائے کے مطابق وہ تقریباً 1550ء تک روم ہی میں رہے، دوسری کے مطابق تیونس لوٹ کر دوبارہ مسلمان ہو گئے، اور تیسری کے مطابق اس کے بعد مراکش چلے گئے۔"

