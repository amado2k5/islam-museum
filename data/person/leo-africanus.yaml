  note: "The year is an estimate from his self-reported ages, as the English article sets out following Masonen: he reports that he was twelve when the Portuguese took Safi in 1507 and sixteen when he visited Timbuktu in 1509-10. The Arabic article's infobox gives 1488, while its text reports historians placing his birth at 901 AH/1495 or at 906 AH/1500, and Wikidata carries six competing values (1483, 1490, 1494, 1496, 1500). No Hijri year is recorded: the followed estimate, about 1494, spans 899-900 AH, and the only explicit pairing in the sources read (901 AH with 1495) belongs to a reading that is not followed. He was born at Granada, and his family moved to Fez soon after his birth."
