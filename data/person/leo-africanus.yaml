faith:
  - value: unknown
    basis: debated
    note: "His allegiance is one of the debated lives of the sixteenth century, and no source read names a legal school for him at any stage. He was born and educated a Muslim: schooled at al-Qarawiyyin in Fez, employed young on Wattasid diplomatic missions to Timbuktu and Constantinople, and in 1517 travelling through Cairo and across the Red Sea on what the English article calls probably a pilgrimage to Mecca — his Muslim formation and practice are documented and are stated here in full. Captured in 1518 and presented to Pope Leo X, he was baptized at St Peter's in 1520, took the name Johannes Leo de Medicis, and lived in Italy on a papal pension as a Christian author; the baptism and the public conversion are documented facts, and Wikidata's religion values (Catholicism, and the category-like 'ex-Muslims') restate them at the structured level. What he inwardly held, and where he ended, is another matter: the German orientalist Widmannstetter reported that Leo had returned to Tunis and reconverted to Islam; the Tunisian historian Muhammad ibn al-Khuja argued that his conversion had been only outward, since his book on the lands of Islam contains nothing disparaging the faith; and Natalie Zemon Davis's Trickster Travels (2007) reads his allegiances as deliberately layered between worlds. The English article's category 'Converts to Roman Catholicism from Sunni Islam' is a category filing, not a source, and no school — Maliki or any other — is attested for the man himself. With his final allegiance doubted in the scholarship itself, the segment is left unknown on a debated basis, the documented facts preserved in full for the founder's ruling; a settlement as christian/documented for the Italian years alone would be the alternative reading of the same evidence."
    sources: [source/wikipedia-leo-africanus-en, source/wikipedia-leo-africanus-ar, source/wikidata-leo-africanus]

