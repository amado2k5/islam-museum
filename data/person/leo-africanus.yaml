  edtf: "1554~"
  calendar: gregorian
  precision: year
  status: debated
  derived: false
  note: "Both articles close his life about 1554 and the English infobox names Tunis as the place of death, but the end is not documented and the English article sets out three theories: that he stayed in Rome and died there about 1550; that he left before the Sack of Rome in 1527, returned to North Africa and lived in Tunis until some time after 1550; and that after Charles V's capture of Tunis in 1535 he moved on to Morocco, his second home. Wikidata's death values (1548, 1550, and even 1600) restate the same uncertainty. No Hijri year is recorded."
  sources: [source/wikipedia-leo-africanus-en, source/wikipedia-leo-africanus-ar, source/wikidata-leo-africanus]

