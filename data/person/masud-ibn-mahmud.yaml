label: { ar: "السلطان مسعود بن محمود الغزنوي" }
summary:
  ar: "مسعود بن محمود بن سبكتكين سلطان غزنة بعد أبيه؛ هزمته السلاجقة في جمادى الآخرة سنة 430هـ فملكوا خراسان والجيل وهرب وأخذوا الدواة، ثم انصرف إلى غزنة وعاد طغرلبك إلى نيسابور فاستولت الغز على جميع خراسان {cite:muntazam-ibn-al-jawzi j.8 p.400, 413}. وملك بعد أبيه لما مات في ربيع الآخر سنة ٤٢١ {cite:muntazam-ibn-al-jawzi j.8 p.396}، وفي سنة ٤٢٣ أخذ أصبهان بعد ما حلم أهلها بالمنارة المهدومة فأباحها {cite:muntazam-ibn-al-jawzi j.8 p.412}. وفي سنة ٤٣٣ قتله أمراؤه وكانت ولايته أحد عشر عامًا وقام أخوه محمد بن محمود مكانه {cite:muntazam-ibn-al-jawzi j.8 p.450}."
gender: male
died: { edtf: "1040~", hijri: "0432~", calendar: julian, precision: year, status: tradition, derived: true, note: "تملّك بعد أبيه خراسان والهند وغزنة، وجرت له حروب وخطوب مع بني سلجوق وظهروا على عاليته وضعف أمره فقتله أمراؤه؛ أُوردت ترجمته تحت سنة 433 {cite:shadharat-dhahab p. 253}." }
