id: person/masud-ibn-mahmud
class: person
label: { ar: "السلطان مسعود بن محمود الغزنوي" }
summary:
  ar: "مسعود بن محمود بن سبكتكين سلطان غزنة بعد أبيه؛ هزمته السلاجقة في جمادى الآخرة سنة 430هـ فملكوا خراسان والجيل وهرب وأخذوا الدواة، ثم انصرف إلى غزنة وعاد طغرلبك إلى نيسابور فاستولت الغز على جميع خراسان {cite:muntazam-ibn-al-jawzi j.8 p.400, 413}. وملك بعد أبيه لما مات في ربيع الآخر سنة ٤٢١ {cite:muntazam-ibn-al-jawzi j.8 p.396}، وفي سنة ٤٢٣ أخذ أصبهان بعد ما حلم أهلها بالمنارة المهدومة فأباحها {cite:muntazam-ibn-al-jawzi j.8 p.412}. وفي سنة ٤٣٣ قتله أمراؤه وكانت ولايته أحد عشر عامًا وقام أخوه محمد بن محمود مكانه {cite:muntazam-ibn-al-jawzi j.8 p.450}."
  tr: "Babası adına Gazni Sultanı olan Mas'ud ibn Mahmud ibn Sabuktakin, 430 Hicri'de Cemade el-Ahira'da Selçuklular tarafından yenildi, Horasan ve El-Jil'in kontrolünü ele geçirdi, kaçtı ve Al-Dawah'ı aldı. Daha sonra Gazni'ye döndü, Tuğril Beg ise Nişapur'a döndü; burada Gaziler Horasan'ın tamamını ele geçirdi {atıf:Muntazam-ibn-al-jawzi J.8 s.400, 413}. Babası Rabi'al-Thani 421'de öldükten sonra kral oldu {cite:Muntazam-ibn-al-jawzi J.8 s.396}. 423 yılında, halkı yıkılan minarenin rüyasını gördükten sonra İsfahan'ı aldı ve izin verdi {cite:Muntazam-ibn-al-jawzi J.8 s.412}. 433 yılında, emirleri onu valiliği on bir yaşındayken öldürdü ve yerine kardeşi Muhammed ibn Mahmud geçti {atıf:Muntazam-ibn-al-Jawzi j.8 s.450}."
  id: "Mas'ud ibn Mahmud ibn Sabuktakin, Sultan Ghazni setelah ayahnya, dikalahkan oleh Seljuk di Jumada al-Akhirah pada tahun 430 H, mengambil alih Khorasan dan Al-Jil, melarikan diri, dan merebut Al-Dawah. Ia kemudian kembali ke Ghazni, dan Tughril Beg kembali ke Nishapur, di mana Ghazi menguasai seluruh Khorasan {cite:Muntazam-ibn-al-jawzi J.8 hlm.400, 413}. Ia menjadi raja setelah ayahnya ketika ayahnya meninggal di Rabi' al-Thani 421 {cite:Muntazam-ibn-al-jawzi J.8 hlm.396}. Pada tahun 423, ia mengambil Isfahan setelah rakyatnya bermimpi tentang menara yang hancur dan mengizinkannya {cite:Muntazam-ibn-al-jawzi J.8 hlm.412}. Pada tahun 433, para emirnya membunuhnya saat masa jabatannya masih sebelas tahun, dan saudaranya Muhammad ibn Mahmud menggantikannya {cite:muntazam-ibn-al-jawzi j.8 hlm.450}."
