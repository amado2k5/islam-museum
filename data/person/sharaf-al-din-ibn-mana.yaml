summary:
  ar: "أبو الفضل أحمد بن الشيخ العلامة كمال الدين أبي الفتح موسى بن الشيخ رضي الدين أبي الفضل يونس بن منعة الإربلي الأصل؛ الفقيه الشافعي؛ شرح كتاب «التنبيه» في الفقه وأجاد شرحه واختصر «إحياء علوم الدين» مختصرين كبيراً وصغيراً؛ تولى التدريس بمدرسة الملك المعظم بإربل من أوائل شوال سنة عشر وستمائة ثم انتقل إلى الموصل سنة سبع عشرة وفُوّضت إليه المدرسة القاهرية؛ قال ابن خلكان: كنت أحضر درسه وأنا صغير وما رأيت أحداً يلقي الدروس مثله، ولقد كان من محاسن الوجود {cite:wafayat-ayan}."
  en: "Sharaf al-Din Ibn Man'a (575–622) — Irbil-born Shafi'i of the Banu Man'a scholarly house; abridged the Ihya' twice and glossed al-Tanbih; Ibn Khallikan attended his lessons as a boy and never saw his equal {cite:wafayat-ayan}."
