summary:
  ar: "أبو الفضل أحمد بن الشيخ العلامة كمال الدين أبي الفتح موسى بن الشيخ رضي الدين أبي الفضل يونس بن منعة الإربلي الأصل؛ الفقيه الشافعي؛ شرح كتاب «التنبيه» في الفقه وأجاد شرحه واختصر «إحياء علوم الدين» مختصرين كبيراً وصغيراً؛ تولى التدريس بمدرسة الملك المعظم بإربل من أوائل شوال سنة عشر وستمائة ثم انتقل إلى الموصل سنة سبع عشرة وفُوّضت إليه المدرسة القاهرية؛ قال ابن خلكان: كنت أحضر درسه وأنا صغير وما رأيت أحداً يلقي الدروس مثله، ولقد كان من محاسن الوجود {cite:wafayat-ayan}."
  en: "Sharaf al-Din Ibn Man'a (575–622) — Irbil-born Shafi'i of the Banu Man'a scholarly house; abridged the Ihya' twice and glossed al-Tanbih; Ibn Khallikan attended his lessons as a boy and never saw his equal {cite:wafayat-ayan}."
  es: "Sharaf al-Din Ibn Man'a (575–622) — Shafi'i nacido en Irbil de la casa erudita Banu Man'a; abrevió el Ihya' dos veces y glosó al-Tanbih; Ibn Khallikan asistió a sus lecciones de niño y nunca vio a nadie igual a él {cite:wafayat-ayan}."
  fr: "Sharaf al-Din Ibn Man'a (575–622) — Shafi'i né à Erbil de la maison savante Banu Man'a; a abrégé l'Ihya' deux fois et a gloussé al-Tanbih; Ibn Khallikan a suivi ses leçons comme un enfant et n'a jamais vu son égal {cite:wafayat-ayan}."
  ur: "شرف الدین ابن منعہ (575-622) - بنو منعہ کے علمی گھرانے کے اربیل میں پیدا ہونے والے شافعی؛ احیاء کو دو بار مختصر کیا اور التنبیح کو چمکایا۔ ابن خلقان نے اپنے اسباق میں لڑکپن میں شرکت کی اور کبھی بھی اس کے برابر نہیں دیکھا۔"
  tr: "Ebu el-Fadl Ahmed bin Şeyh Allamah Kamal al-Din Ebu el-Feth Musa ibn Şeyh Radieddin Ebu el-Fadl Yunus ibn Man'ah al-Irbili kökenli; bir Şafii hukukçu; \"El-Tanbih\" kitabını fıkıh alanında açıkladı, açıklamasında üstün oldu ve \"İhya' Ulum al-Din\"i hem büyük hem de küçük kısaltmalarla özetledi. 600 Hile yılında Shawwal'ın başından itibaren Erbil'deki El-Malik el-Muazzam Okulu'nda ders verdi, ardından 177 H.'de Musul'a taşındı ve Kahire okulu ona emanet edildi. İbn Hallikan şöyle dedi: Gençken onun derslerine katılırdım ve onun gibi ders veren kimseyi görmedim. Gerçekten de, o varoluşun erdemlerinden biriydi {atı:wafayat-ayan}."
  id: "Abu al-Fadl Ahmad ibn Sheikh Allamah Kamal al-Din Abu al-Fath Musa ibn Sheikh Radi al-Din Abu al-Fadl Yunus ibn Man'ah al-Irbili; seorang ahli hukum Syafi'i; ia menjelaskan kitab \"Al-Tanbih\" dalam bidang fiqh, unggul dalam penjelasannya, dan merangkum \"Ihya' Ulum al-Din\" dalam bentuk singkatan besar dan kecil. Ia mengajar di Sekolah Al-Malik Al-Mu'azzam di Erbil sejak awal Shawwal pada tahun 600 H, kemudian pindah ke Mosul pada tahun 177 H, dan sekolah Kairo dipercayakan kepadanya. Ibn Khallikan berkata: Saya biasa menghadiri pelajarannya saat masih muda dan tidak pernah melihat seseorang mengajar seperti dia. Memang, ia adalah salah satu kebajikan keberadaan {cite:wafayat-ayan}."
