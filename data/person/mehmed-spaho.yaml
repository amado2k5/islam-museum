summary:
  ar: "سياسي ومحامٍ بوسني من سراييفو، نال دكتوراه القانون من فيينا سنة 1908، وقاد المنظمة المسلمة اليوغوسلافية من 1921، وشارك في حكومات المملكة وزيراً للغابات والمناجم ثم للتجارة والصناعة، ودافع عن الحكم الذاتي الديني للمسلمين ووحدة أراضي البوسنة حتى وفاته المفاجئة في بلغراد سنة 1939."
  en: "Bosnian politician and lawyer from Sarajevo who took his law doctorate at Vienna in 1908, led the Yugoslav Muslim Organization from 1921, sat in the kingdom's governments as Minister of Forestry and Mining and of Trade and Industry, and defended Muslim religious autonomy and Bosnia's territorial integrity until his sudden death at Belgrade in 1939."
  ur: "سرائیوو سے تعلق رکھنے والے بوسنیائی سیاست دان اور وکیل، جنھوں نے 1908ء میں ویانا سے قانون کی ڈاکٹریٹ حاصل کی، 1921ء سے یوگوسلاو مسلم تنظیم کی قیادت کی، مملکت کی حکومتوں میں جنگلات و کان کنی اور تجارت و صنعت کے وزیر رہے، اور 1939ء میں بلغراد میں اچانک وفات تک مسلمانوں کی دینی خودمختاری اور بوسنیا کی علاقائی وحدت کا دفاع کیا۔"
