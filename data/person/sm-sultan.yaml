summary:
  ar: "رسام بنغالي (1923–1994)، اسمه الكامل شيخ محمد سلطان. وُلد في ماشيمديا بنارايل لأسرة بنّاء فقيرة، ورسم بالفحم مبانيَ يعمل عليها أبوه، ودرس الفن في كلكتا ثلاث سنوات دون أن يكمله، وجاب الهند والولايات المتحدة وإنجلترا عارضًا أعماله، ثم استقر في نارايل من سنة 1953. اشتهر بلوحات فلاحي البنغال ذوي العضلات المبالغ فيها رمزًا لقوة الإنسان العامل، ونال وسام إكوشي باداك سنة 1982 وجائزة يوم الاستقلال سنة 1993."
  en: "Bengali painter (1923–1994), full name Sheikh Mohammed Sultan. Born at Machimdia, Narail, to a poor mason's family, he drew in charcoal the buildings his father worked on, studied art in Calcutta for three years without completing the course, travelled and exhibited in India, the United States and England, then settled in Narail from 1953. He is famous for canvases of exaggeratedly muscular Bengali peasants as a symbol of the working person's strength, and received the Ekushey Padak in 1982 and the Independence Day Award in 1993."
  ur: "بنگالی مصور (1923ء–1994ء)، پورا نام شیخ محمد سلطان۔ نارائل کے ماشیمڈیا میں ایک غریب معمار کے گھر پیدا ہوئے، والد کے کام کی عمارتوں کو کوئلے سے بناتے تھے، کلکتہ میں تین برس فن کی تعلیم ادھوری چھوڑی، ہندوستان، امریکہ اور انگلستان میں نمائشیں کیں، پھر 1953 سے نارائل میں مقیم رہے۔ وہ بنگالی کسانوں کی مبالغہ آمیز عضلاتی تصویروں کے لیے مشہور ہیں جو محنت کش انسان کی قوت کی علامت ہیں۔ انھیں 1982 میں اکوشے پادک اور 1993 میں یومِ آزادی ایوارڈ ملا۔"
