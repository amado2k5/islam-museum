summary:
  ar: "من طبقة العلماء بالأندلس يعرف بالمهر؛ حضر مجلس المنصور يوماً وتكلم بما خشي عاقبته فاختفى مدة ثم بعد مهلك المنصور ظهر في بلاد كزولة وانتحل الإمامة وادعى أنه القحطاني المراد في قوله «لا تقوم الساعة حتى يخرج رجل من قحطان يقود الناس بعصاه»، فبعث الناصر إليه الجيوش فهزموه وقتل وسيق رأسه إلى مراكش فنصب بها {cite:tarikh-ibn-khaldun-ibar p. 1682}."
  en: "A scholar of al-Andalus known as al-Mihr who, after al-Mansur's death, emerged at Cazalla claiming the imamate and the Qahtani of the hadith; al-Nasir's armies killed him and his head was posted at Marrakesh {cite:tarikh-ibn-khaldun-ibar p. 1682}."
