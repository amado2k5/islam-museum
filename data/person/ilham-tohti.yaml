summary:
  ar: اقتصادي ومثقف عام أويغوري وُلد سنة 1969 في أرتكس بشينجيانغ. أسّس موقع «الأويغور أونلاين» للحوار بين الأويغور والهان، وحُكم عليه بالسجن المؤبد سنة 2014 في قضية أثارت إدانة دولية واسعة وجوائز حقوقية.
  en: Uyghur economist and public intellectual, born 1969 in Artux, Xinjiang. Founder of the Uyghur Online website for Uyghur-Han dialogue; sentenced to life imprisonment in 2014 in a case that drew wide
    international condemnation and human-rights awards.
  ur: ایغور ماہر معاشیات اور عوامی مفکر، 1969 میں سنکیانگ کے ارتکش میں پیدا ہوئے۔ ایغور-ہان مکالمے کے لیے ایغور آن لائن ویب سائٹ کے بانی؛ 2014 میں عمر قید کی سزا ایسے مقدمے میں ملی جس نے وسیع بین الاقوامی
    مذمت اور انسانی حقوق کے ایوارڈز پائے۔
  es: "Economista e intelectual público uigur, nacido en 1969 en Artux, Xinjiang. Fundador del sitio web Uyghur Online para el diálogo uigur-han; condenado a cadena perpetua en 2014 en un caso que generó una amplia condena internacional y premios de derechos humanos."
  fr: "Économiste et intellectuel public ouïghour, né en 1969 à Artux, dans le Xinjiang. Fondateur du site web Uyghur Online pour le dialogue ouïghour-han; condamné à la prison à vie en 2014 dans une affaire qui a suscité une large condamnation internationale et des prix pour les droits de l’homme."
  tr: "1969 yılında Sincan'ın Artex kentinde doğmuş bir Uygur ekonomist ve genel entelektüeldir. Uygurlar ile Han arasında diyalog için 'Uygur Online' web sitesini kurdu ve 2014'te uluslararası çapta kınanma ve insan hakları ödülleri alan bir davada müebbet hapis cezasına çarptırıldı."
  id: "Seorang ekonom Uyghur dan intelektual umum yang lahir pada tahun 1969 di Artex, Xinjiang. Ia mendirikan situs web 'Uyghur Online' untuk dialog antara Uyghur dan Han dan dijatuhi hukuman penjara seumur hidup pada tahun 2014 dalam kasus yang memicu kecaman internasional luas dan penghargaan hak asasi manusia."
