summary:
  ar: حفيدة النبي من ابنته زينب، كان النبي يحملها على عاتقه في الصلاة؛ تزوجها علي بن أبي طالب بعد فاطمة، ثم المغيرة بن نوفل.
  en: A granddaughter of the Prophet through his daughter Zaynab, whom he used to carry on his shoulder in prayer; she married Ali ibn Abi Talib after Fatima, and then al-Mughira ibn Nawfal.
  ur: "نبی کی بیٹی زینب کے ذریعے نواسی، جسے وہ نماز میں کندھے پر اٹھاتے تھے؛ علی بن ابی طالب سے شادی ہوئی۔"
  es: "Era nieta del Profeta a través de su hija Zaynab, a quien él solía llevar sobre su hombro durante la oración; se casó con Ali ibn Abi Talib después de Fátima, y luego con al-Mughira ibn Nawfal."
  fr: "Une petite-fille du Prophète par sa fille Zaynab, qu'il avait l'habitude de porter sur son épaule pendant la prière; elle épousa Ali ibn Abi Talib après Fatima, puis al-Mughira ibn Nawfal."
  tr: "Peygamber'in torunu, Peygamber'in omuzlarında taşıdığı kızı Zeyneb'den olan Zeyneb'den doğan bir kız; Ali ibn Ebi Talib, Fatimah'tan sonra onunla evlendi; ardından El-Muhira bin Nevfal."
  id: "Cucu Nabi dari putrinya Zaynab, yang biasa digendong Nabi di pundaknya dalam doa; Ali ibn Abi Talib menikahinya setelah Fatimah, kemudian Al-Mughira ibn Nawfal."
