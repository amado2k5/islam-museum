summary:
  ar: "الأصيرم، عمرو بن ثابت بن وقش من بني عبد الأشهل، ابن أخت حذيفة بن اليمان؛ كان يأبى الإسلام على قومه، فلما خرج النبي إلى أحد بدا له فأسلم وقاتل حتى أثبتته الجراحة ومات، فقال النبي: إنه لمن أهل الجنة؛ وكان أبو هريرة يقول: حدثوني عن رجل دخل الجنة لم يصلّ قط {cite:rawd-unuf-wakil-v6 p. 14} {cite:istiab-alam-2002 p. 495}."
  en: "Al-Usayrim, 'Amr ibn Thabit ibn Waqsh of Banu 'Abd al-Ashhal, nephew of Hudhayfa ibn al-Yaman through his mother; he had refused Islam to his people, but when the Prophet set out for Uhud he changed his mind, became Muslim and fought until his wounds felled him and he died; the Prophet said, 'He is one of the people of Paradise'; Abu Hurayra used to say, 'Tell me of a man who entered Paradise without ever praying' {cite:rawd-unuf-wakil-v6 p. 14} {cite:istiab-alam-2002 p. 495}."
  fr: "Al-Usayrim, 'Amr ibn Thabit ibn Waqsh de Banu 'Abd al-Ashhal, neveu de Hudhayfa ibn al-Yaman par sa mère ; Il avait refusé l'Islam à son peuple, mais quand le Prophète est parti pour Uhud, il a changé d'avis, est devenu musulman et s'est battu jusqu'à ce que ses blessures lui tombent dessus et il est mort ; le Prophète a dit : « Il est l'un des gens du Paradis » Abu Hurayra avait l'habitude de dire : « Parlez-moi d'un homme qui est entré au Paradis sans jamais prier » {cite:rawd-unuf-wakil-v6 p. 14} {cite:istiab-alam-2002 p. 495}."
  ur: "اصیرم، عمرو بن ثابت بن وقش، بنو عبد الاشہل سے، حذیفہ بن الیمان کے بھانجے؛ وہ اپنی قوم کے سامنے اسلام سے انکار کرتے رہے، مگر جب نبی احد کے لیے نکلے تو ان کا ارادہ بدلا، مسلمان ہوئے اور لڑتے رہے یہاں تک کہ زخموں نے گرا دیا اور فوت ہو گئے؛ نبی نے فرمایا: «وہ اہلِ جنت میں سے ہے»؛ ابو ہریرہ کہا کرتے تھے: «مجھے اس آدمی کے بارے میں بتاؤ جو کبھی نماز پڑھے بغیر جنت میں داخل ہوا» {cite:rawd-unuf-wakil-v6 p. 14} {cite:istiab-alam-2002 p. 495}۔"
  es: "Al-Usayrim, 'Amr ibn Thabit ibn Waqsh de Banu 'Abd al-Ashhal, sobrino de Hudhayfa ibn al-Yaman por parte de su madre; había rechazado el Islam a su pueblo, pero cuando el Profeta partió hacia Uhud cambió de opinión, se convirtió al Islam y luchó hasta que sus heridas lo derribaron y murió; el Profeta dijo: 'Él es uno de los habitantes del Paraíso'; Abu Hurayra solía decir: 'Háblame de un hombre que entró en el Paraíso sin haber rezado jamás' {cite:rawd-unuf-wakil-v6 p. 14} {cite:istiab-alam-2002 p. 495}."
  tr: "El-Asirim, Banu Abd al-Ashhal'den Amr ibn Tabit ibn Veqş, Hudeyfa bin Yaman'ın yeğeni; İslam'ı kendi halkından kabul etmeyi reddetti. Peygamber Uhud'a gittiğinde bunun farkına vardı, İslam'ı benimsedi ve ameliyat onu kanıtlayıp ölene kadar savaştı. Peygamber şöyle dedi: O cennet halkı arasındadır. Ebu Hureyre şöyle derdi: Bana cennete giren ve hiç namaz kılmamış bir adamı anlat {cite:rawd-unuf-wakil-v6 s. 14} {cite:istiab-alam-2002, s. 495}."
  id: "Al-Asirim, Amr ibn Thabit ibn Waqsh dari Banu Abd al-Ashhal, keponakan Hudhayfah ibn al-Yaman; ia menolak menerima Islam dari umatnya. Ketika Nabi pergi ke Uhud, ia menyadarinya, maka ia memeluk Islam dan berjuang sampai operasi membuktikan dirinya dan ia meninggal. Nabi berfirman: Ia termasuk di antara umat Surga. Abu Huraira biasa berkata: Ceritakan tentang seorang pria yang masuk ke Surga yang tidak pernah berdoa {cite:rawd-unuf-wakil-v6 hlm. 14} {cite:istiab-alam-2002, hlm. 495}."
