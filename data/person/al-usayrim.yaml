summary:
  ar: "الأصيرم، عمرو بن ثابت بن وقش من بني عبد الأشهل، ابن أخت حذيفة بن اليمان؛ كان يأبى الإسلام على قومه، فلما خرج النبي إلى أحد بدا له فأسلم وقاتل حتى أثبتته الجراحة ومات، فقال النبي: إنه لمن أهل الجنة؛ وكان أبو هريرة يقول: حدثوني عن رجل دخل الجنة لم يصلّ قط {cite:rawd-unuf-wakil-v6 p. 14} {cite:istiab-alam-2002 p. 495}."
  en: "Al-Usayrim, 'Amr ibn Thabit ibn Waqsh of Banu 'Abd al-Ashhal, nephew of Hudhayfa ibn al-Yaman through his mother; he had refused Islam to his people, but when the Prophet set out for Uhud he changed his mind, became Muslim and fought until his wounds felled him and he died; the Prophet said, 'He is one of the people of Paradise'; Abu Hurayra used to say, 'Tell me of a man who entered Paradise without ever praying' {cite:rawd-unuf-wakil-v6 p. 14} {cite:istiab-alam-2002 p. 495}."
  ur: "اصیرم، عمرو بن ثابت بن وقش، بنو عبد الاشہل سے، حذیفہ بن الیمان کے بھانجے؛ وہ اپنی قوم کے سامنے اسلام سے انکار کرتے رہے، مگر جب نبی احد کے لیے نکلے تو ان کا ارادہ بدلا، مسلمان ہوئے اور لڑتے رہے یہاں تک کہ زخموں نے گرا دیا اور فوت ہو گئے؛ نبی نے فرمایا: «وہ اہلِ جنت میں سے ہے»؛ ابو ہریرہ کہا کرتے تھے: «مجھے اس آدمی کے بارے میں بتاؤ جو کبھی نماز پڑھے بغیر جنت میں داخل ہوا» {cite:rawd-unuf-wakil-v6 p. 14} {cite:istiab-alam-2002 p. 495}۔"
