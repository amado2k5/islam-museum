summary:
  ar: "شاعر جاهلي من معلقات الشعراء؛ يذكر النويري قصته مع المتلمس وصحيفة عامل البحرين التي قتلته، وقول المثل في جار أبي دؤاد. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22-23}"
  en: "A pre-Islamic poet, one of the Mu'allaqat poets; al-Nuwayri records his story with al-Mutalammis and the letter that led to his death, and quotes his verse on the good neighbour. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22-23}"
  ur: "جاہلی شاعر، معلقات کے شعراء میں سے؛ نویری ان کا قصہ متلمس اور اس خط کے ساتھ نقل کرتے ہیں جس کی وجہ سے وہ قتل ہوئے۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22-23}"
