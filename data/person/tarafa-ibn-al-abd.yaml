summary:
  ar: "شاعر جاهلي من معلقات الشعراء؛ يذكر النويري قصته مع المتلمس وصحيفة عامل البحرين التي قتلته، وقول المثل في جار أبي دؤاد. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22-23}"
  en: "A pre-Islamic poet, one of the Mu'allaqat poets; al-Nuwayri records his story with al-Mutalammis and the letter that led to his death, and quotes his verse on the good neighbour. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22-23}"
  ur: "جاہلی شاعر، معلقات کے شعراء میں سے؛ نویری ان کا قصہ متلمس اور اس خط کے ساتھ نقل کرتے ہیں جس کی وجہ سے وہ قتل ہوئے۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22-23}"
  es: "Poeta preislámico, perteneciente al grupo de poetas Mu'allaqat, al-Nuwayri relata su historia con al-Mutalammis y la carta que provocó su muerte, y cita su verso sobre el buen vecino. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22-23}"
  fr: "Poète préislamique, membre du groupe des Mu'allaqat, al-Nuwayri relate son histoire avec al-Mutalammis et la lettre qui entraîna sa mort, et cite son vers sur le bon voisin. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 22-23}"
  tr: "Mu'allaqat al-Shu'ara'dan İslam öncesi bir şair; Al-Nuwayri, Al-Multisus ve 'Onu öldüren Bahreynli Amel' gazetesiyle olan hikayesini ve Abu Du'ad'ın komşusu hakkındaki atasözünü anlatır. {alıntı:Nihayat-al-Arab-Nuwayri-vol3-scan s. 22-23}"
  id: "Seorang penyair pra-Islam dari Mu'allaqat al-Shu'ara; Al-Nuwayri menceritakan kisahnya bersama Al-Multisus dan surat kabar 'Amel Bahrain yang membunuhnya,' serta peribahasa tentang tetangga Abu Du'ad. {cite:nihayat-al-arab-nuwayri-vol3-scan hlm. 22-23}"
