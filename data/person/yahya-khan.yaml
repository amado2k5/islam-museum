summary:
  ar: "جنرال باكستاني (1917–1980) تولى رئاسة باكستان ثالثا من 1969 إلى 1971 في ظل الأحكام العرفية، وكان القائد العام للجيش الباكستاني من 1966 إلى 1971. أدى رفضه تسليم السلطة لرابطة عوامي الفائزة في انتخابات 1970 إلى حرب أهلية في باكستان الشرقية وقيام بنغلاديش، فاستقال بعدها وظل قيد الإقامة الجبرية حتى 1977."
  en: "Pakistani general (1917–1980) who served as the third president of Pakistan from 1969 to 1971 under martial law, and as commander-in-chief of the Pakistan Army from 1966 to 1971. His refusal to transfer power to the Awami League, which had won the 1970 election, led to civil war in East Pakistan and the creation of Bangladesh, after which he resigned and remained under house arrest until 1977."
  ur: "پاکستانی جرنیل (1917ء–1980ء) جو 1969ء سے 1971ء تک مارشل لا کے تحت پاکستان کے تیسرے صدر اور 1966ء سے 1971ء تک پاک فوج کے کمانڈر ان چیف رہے۔ 1970ء کے انتخابات میں کامیاب عوامی لیگ کو اقتدار منتقل کرنے سے ان کے انکار کے نتیجے میں مشرقی پاکستان میں خانہ جنگی اور بنگلہ دیش کا قیام ہوا، جس کے بعد انھوں نے استعفیٰ دیا اور 1977ء تک نظر بند رہے۔"
