summary:
  ar: "أحد الفرسان الذين ذكر الكتاب أنهم وقفوا مع الهادي في معركة تهامة بعد انكسار ميسرته، وهو «الحسين بن موسى بن سليمان» في ص296."
  en: "One of the horsemen the book says stood with al-Hadi in the Tihama fight after his left wing broke, named \"al-Husayn ibn Musa ibn Sulayman\" on p. 296."
  ur: "ان سواروں میں سے ایک جنہیں کتاب کے مطابق تہامہ کی لڑائی میں بائیں بازو ٹوٹنے کے بعد ہادی کے ساتھ کھڑا بتایا گیا، ص296 پر «الحسین بن موسیٰ بن سلیمان» کے نام سے۔"
  es: "Uno de los jinetes que, según el libro, luchó junto a al-Hadi en la batalla de Tihama después de que su flanco izquierdo se rompiera, se llama \"al-Husayn ibn Musa ibn Sulayman\" y aparece en la página 296."
