summary:
  ar: "بطاقة أولية لأبي الحارث منصور بن نوح الساماني، أمير الدولة السامانية قبل سقوطها الذي ولي سنة ٩٩٧م وعزل وعُمي سنة ٩٩٩م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu al-Harith Mansur ibn Nuh, penultimate Samanid emir enthroned in 997 and deposed and blinded in 999; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Abu al-Harith Mansur ibn Nuh, penúltimo emir samaní entronizado en 997 y depuesto y cegado en 999; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de projet pour Abu al-Harith Mansur ibn Nuh, avant-dernier émir samanide intronisé en 997 et déposé et aveuglé en 999; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "ابو الحارث منصور ابن نوح کے لیے ڈرافٹ کارڈ، جو 997 میں تخت نشین ہوا اور 999 میں معزول اور نابینا ہو گیا۔ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Samanî devletinin çöküşünden önceki prensi Ebu el-Haris Mansur bin Nuh el-Samani'nin ön kartı; 997'de göreve başlayan ve 999 yılında görevden alınıp kontrol edilemez hale gelmişti; İslam devletlerinin sözlüklerinde ve biyografisinde henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Abu al-Harith Mansur ibn Nuh al-Samani, pangeran negara Samanid sebelum kejatuhannya yang menjabat pada tahun 997 M dan diberhentikan serta sulit diatur pada tahun 999 M; kartu ini disebutkan dalam kamus negara-negara Islam dan biografinya belum pernah ditinjau di halaman tersebut."
