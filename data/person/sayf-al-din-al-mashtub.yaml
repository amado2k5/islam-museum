died: { edtf: "1192", hijri: "0588", calendar: julian, precision: day, status: tradition, derived: true, note: "وفاته يوم الخميس السادس والعشرين من شوال سنة ثمان وثمانين وخمسمائة بنابلس عند العماد الأصبهاني في «البرق الشامي»؛ وقال بهاء الدين بن شداد في «سيرة صلاح الدين» إنه توفي يوم الأحد الثالث والعشرين من شوال بالقدس ودُفن في داره بعد أن صُلي عليه بالمسجد الأقصى {cite:wafayat-ayan}." }
summary:
  ar: "سيف الدين المشطوب؛ والد عماد الدين بن المشطوب؛ رتّبه السلطان صلاح الدين في عكا هو وبهاء الدين قراقوش لما خاف عليها من الفرنج فلم يزل بها حتى حاصره الفرنج وأخذوها وأسروه؛ ولما خلص منهم وصل إلى السلطان وهو بالقدس يوم الخميس مستهل جمادى الآخرة سنة ثمان وثمانين وخمسمائة فنهض إليه واعتنقه؛ ولم يكن في أمراء الدولة الصلاحية أحد يضاهيه في المنزلة وعلو المرتبة وكانوا يسمونه الأمير الكبير؛ أمير الأكراد وكبيرهم {cite:wafayat-ayan}."
  en: "Sayf al-Din al-Mashtub (d. 588) — 'al-Amir al-Kabir', chief of Salah al-Din's Kurdish amirs; co-commander of Acre with Qaraqush until the Franks took it; released to embrace the sultan at Jerusalem weeks before his own death, the sources splitting between Nablus and Jerusalem {cite:wafayat-ayan}."
  es: "Sayf al-Din al-Mashtub (m. 588) — 'al-Amir al-Kabir', jefe de los emires kurdos de Saladino; co-comandante de Acre con Qaraqush hasta que los francos la tomaron; liberado para abrazar al sultán en Jerusalén semanas antes de su propia muerte, las fuentes se dividen entre Nablus y Jerusalén {cite:wafayat-ayan}."
  fr: "Sayf al-Din al-Mashtub (d. 588) — 'al-Amir al-Kabir', chef des émirs kurdes de Salah al-Din; co-commandant d'Acre avec Qaraqush jusqu'à ce que les Francs s'en emparent; libéré pour embrasser le sultan à Jérusalem quelques semaines avant sa propre mort, les sources se divisant entre Naplouse et Jérusalem {cite:wafayat-ayan}."
  ur: "سیف الدین المشتوب ⁦(متوفی 588)⁩ - 'الامیر الکبیر'، صلاح الدین کے کرد امیروں کے سربراہ؛ قراقش کے ساتھ ایکر کا شریک کمانڈر یہاں تک کہ فرانکس نے اسے لے لیا۔ اپنی موت سے چند ہفتے قبل یروشلم میں سلطان کو گلے لگانے کے لیے جاری کیا گیا، نابلس اور یروشلم کے درمیان تقسیم ہونے والے ذرائع"
