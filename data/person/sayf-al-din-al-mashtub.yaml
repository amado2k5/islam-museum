summary:
  ar: "سيف الدين المشطوب؛ والد عماد الدين بن المشطوب؛ رتّبه السلطان صلاح الدين في عكا هو وبهاء الدين قراقوش لما خاف عليها من الفرنج فلم يزل بها حتى حاصره الفرنج وأخذوها وأسروه؛ ولما خلص منهم وصل إلى السلطان وهو بالقدس يوم الخميس مستهل جمادى الآخرة سنة ثمان وثمانين وخمسمائة فنهض إليه واعتنقه؛ ولم يكن في أمراء الدولة الصلاحية أحد يضاهيه في المنزلة وعلو المرتبة وكانوا يسمونه الأمير الكبير؛ أمير الأكراد وكبيرهم {cite:wafayat-ayan}."
  en: "Sayf al-Din al-Mashtub (d. 588) — 'al-Amir al-Kabir', chief of Salah al-Din's Kurdish amirs; co-commander of Acre with Qaraqush until the Franks took it; released to embrace the sultan at Jerusalem weeks before his own death, the sources splitting between Nablus and Jerusalem {cite:wafayat-ayan}."
