summary:
  ar: "عالم إسلامي أمريكي، وُلد باسم ريكي داريل ميتشل في بيركلي بكاليفورنيا سنة 1956؛ اعتنق الإسلام سنة 1977، ونال شهادات من الجامعة الأمريكية وروتجرز، ودرس سبع سنوات في سوريا وتخرج في جامعة أبو النور سنة 2001، وشارك في تأسيس كلية الزيتونة في بيركلي حيث يعمل عضوا أول في هيئتها التدريسية."
  en: "American Islamic scholar, born Ricky Daryl Mitchell in Berkeley, California, in 1956; he converted to Islam in 1977, took degrees at American University and Rutgers, studied for seven years in Syria and graduated from Abu Nour University in 2001, and co-founded Zaytuna College in Berkeley, where he is a senior faculty member."
  ur: "امریکی ماہرِ اسلامیات، 1956 میں برکلے، کیلیفورنیا میں رکی ڈیرل مچل کے نام سے پیدا ہوئے؛ انہوں نے 1977 میں اسلام قبول کیا، امریکن یونیورسٹی اور رٹگرز سے ڈگریاں لیں، سات برس شام میں تعلیم حاصل کر کے 2001 میں جامعہ ابو النور سے فارغ ہوئے، اور برکلے میں زیتونہ کالج کی تاسیس میں شریک ہوئے جہاں وہ سینئر فیکلٹی رکن ہیں۔"
