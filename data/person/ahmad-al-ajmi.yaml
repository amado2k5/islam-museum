summary:
  ar: قارئ وإمام سعودي وُلد سنة 1968 في الخبر؛ من أبرز أصوات التلاوة في الخليج، أُمّ في مساجد الخبر وجدة والحرم المكي، وتسجيلاته الكاملة للمصحف من الأوسع استماعًا في العالم.
  en: Saudi Qur'an reciter and imam born in Khobar in 1968; one of the leading recitation voices of the Gulf, he has led prayers at mosques in Khobar and Jeddah and at the Grand Mosque of Makkah, and his
    complete mus'haf recordings are among the most heard worldwide.
  fr: "Récitateur saoudien du Coran et imam né à Khobar en 1968, l'une des grandes voix de la récitation du Golfe. Il dirigea les prières dans les mosquées de Khobar, de Djeddah et à la Grande Mosquée de La Mecque ; ses enregistrements intégraux du mushaf comptent parmi les plus écoutés au monde."
  ur: سعودی قاری اور امام جو 1968 میں خوبار میں پیدا ہوا؛ خلیج کی نمایاں ترین تلاوت اصوات میں سے، خوبار، جدہ اور مسجد الحرام میں امامت کی اور اس کی مکمل مصحف ریکارڈنگز دنیا کے سب سے زیادہ سنی جانے والی
    ہیں۔
  es: "Recitador del Corán e imán saudí nacido en Khobar en 1968; una de las voces de recitación más destacadas del Golfo, ha dirigido oraciones en mezquitas de Khobar y Yeda, así como en la Gran Mezquita de La Meca, y sus grabaciones completas del Corán se encuentran entre las más escuchadas en todo el mundo."
  tr: "1968'de El-Hobar'da doğmuş Suudi bir Kur'an okuyucusu ve imam; Körfez'in en önde gelen Kur'an okuyucularından biri olarak El-Hobar, Cidde ve Mekke'deki Büyük Cami'de namaz kıldırmış ve Kur'an'ın tamamının kayıtları dünyada en çok dinlenenler arasındadır."
  id: "Seorang qari dan imam Saudi, lahir pada tahun 1968 di Al-Khobar; salah satu suara qari paling terkemuka di Teluk, ia memimpin salat di masjid-masjid di Al-Khobar, Jeddah dan Masjidil Haram di Mekah, dan rekaman lengkap Al-Qurannya termasuk yang paling banyak didengarkan di dunia."
