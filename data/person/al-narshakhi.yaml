label: { ar: "النرشخي", en: "al-Narshakhi", ur: "نرشخی" }
names:
  - { value: "Abu Bakr Muhammad ibn Ja'far ibn Zakariyya al-Narshakhi", kind: full }
  - { value: "أبو بكر محمد بن جعفر بن زكريا النرشخي", kind: full }
summary:
  ar: "أبو بكر محمد بن جعفر بن زكريا النرشخي، مؤرخ من العصر السامانيّ، يُظن أنه من نرشخ قرب بخارى. لا يُعرف من حياته إلا أنه ألّف تاريخاً لبخارى بالعربية وقدّمه إلى الأمير نوح بن نصر سنة 332هـ/943-944م، وهو كتابه الوحيد المعروف. ترجمه أبو نصر القبوي إلى الفارسية سنة 522هـ/1128م وزاد عليه غيره، فالنص الفارسي المتداول كثير التغيّر عن أصله {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
  en: "Abu Bakr Muhammad ibn Ja'far ibn Zakariyya al-Narshakhi was a historian of the Samanid period, presumably from Narshakh near Bukhara. Nothing is known of his life except that he wrote a history of Bukhara and presented it to the amir Nuh ibn Nasr in 332/943-4; it is his only known book. It was put into Persian by al-Qubawi in 522/1128 and later reworked, so the Persian text we have differs much from the original {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
  ur: "ابو بکر محمد بن جعفر بن زکریا نرشخی سامانی دور کے مؤرخ تھے، غالباً بخارا کے قریب نرشخ کے رہنے والے۔ ان کی زندگی کے بارے میں صرف اتنا معلوم ہے کہ انہوں نے بخارا کی تاریخ لکھی اور 332ھ/943-944ء میں امیر نوح بن نصر کو پیش کی؛ یہی ان کی واحد معروف کتاب ہے۔ ابو نصر قبوی نے 522ھ/1128ء میں اسے فارسی میں منتقل کیا اور بعد میں دوسروں نے اس میں اضافے کیے، اس لیے موجودہ فارسی متن اصل سے بہت بدلا ہوا ہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 1020}."
