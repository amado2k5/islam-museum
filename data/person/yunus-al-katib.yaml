summary:
  ar: "يونس بن سليمان المغني يكنى أبا سليمان، من أهل فارس أدرك الدولة العباسية وكان مولى الزبير بن العوام في قول السكري، وله كتب مشهورة في الأغاني والمغنين منها كتاب مجرد يونس وكتاب القيان وكتاب النغم، ويقال إن إبراهيم الموصلي أخذ عنه {cite:fihrist-ibn-al-nadim p. 447}."
  en: "Persian-born singer and father of the aghani book tradition — Ishaq teacher Ibrahim reportedly took from him {cite:fihrist-ibn-al-nadim}"
