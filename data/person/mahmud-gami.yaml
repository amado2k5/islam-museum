    note: "Settled on two independent attestations of the man himself: his Kashmiri biography styles him in its lead an eighteenth-century Sufi poet, argues from that identity in its body ('since Mahmud Gami was a Sufi poet, his kalaam shows mystical secrets through stories and metaphors'), and dates the beginning of Kashmir's line of Sufi poets from him; and the Kashmir Times feature independently presents him as Dooru's mystic saint-poet whose verse blended Sufi mysticism, quoting Kashmir University's Nissar Nadeem and Shafqat Altaf on his transformation of mystical experience. The English article's infobox filing 'Movement: Sufism' was not counted, and no order (tariqa) is named anywhere, so the value is sufi without an order."
