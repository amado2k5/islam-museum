summary:
  ar: "شاعر كشميري صوفي من دورو شاه آباد لُقب بجامي كشمير، أدخل المثنوي والغزل الفارسيين إلى الكشميرية، وألّف «يوسف زليخا» و«ليلى مجنون» و«شيخ صنعان» ضمن إحدى عشرة مثنوية جمعتها كلياته."
  en: "Kashmiri Sufi poet of Doru Shahabad, called the Jami of Kashmir, who brought the Persian mathnavi and ghazal into Kashmiri and wrote Yusuf-Zuleikha, Lael Majnun and Sheikh Sana'n among the eleven mathnavis of his Kulliyat."
  ur: "ڈورو شاہ آباد کے کشمیری صوفی شاعر، جنھیں «جامیِ کشمیر» کہا جاتا ہے؛ انھوں نے فارسی مثنوی اور غزل کو کشمیری میں داخل کیا اور اپنی کلیات کی گیارہ مثنویوں میں «یوسف زلیخا»، «لیلیٰ مجنوں» اور «شیخ صنعان» لکھیں۔"
