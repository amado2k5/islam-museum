  source: "English, Arabic and Kashmiri Wikipedia biographies of Mahmud Gami (Q12445871), the Wikidata item and Rao Farman Ali's Kashmir Times feature on the Dooru poets, read in full; every revision id was fetched live from the MediaWiki API in this session and asserted before use, and the QID was grounded through the English article's page properties. Identity: the queue line's bearer is the poet of Doru Shahabad (1765–1855), not the fifteenth-century sultan Mahmud Ghaznavi of his own Qisa-i-Mahmud Ghaznavi. Existence checks by name fragments (gami, mahmud) and by QID across data/person on origin/main found no prior record. The queue's years are confirmed, the birth as circa. His takhallus Gami was chosen, the Kashmiri biography says, to rhyme with Jami and Nizami. Relations written: none — his contemporary Waliullah Mattu has no person record, and Shahabad, Aroora and Anantnag have no place entities. The Arabic article is a translation of the English and is registered as such."
