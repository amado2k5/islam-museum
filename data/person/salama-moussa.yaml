    note: "Two different things are documented and neither settles a personal affiliation. (1) His background: the English article (citing Goldschmidt) says he was born into a Coptic family, the French article says a Coptic Orthodox family, and the Arabic article says he was born to two Coptic parents; family background is never attestation, and no text names him personally as a Christian believer. (2) His own published position: the English article, on scholarly sources, calls him an avowed secularist who campaigned against traditional religions, and the Arabic article, summarising his books, records his doctrine that religion is a human product, that nothing in it is sacred, and his 1912 book on the origin of the idea of God written from a material basis — but the same Arabic account records that he preached a natural unity of God and the universe and rejected Nietzsche's 'death of God', and no source records him describing himself as an atheist. That falls short of the documented-unbelief bar, so neither christian nor atheist-or-sceptic is recorded. Wikidata carries no religion value for him."
