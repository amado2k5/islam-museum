summary:
  ar: "صحفي وكاتب ومفكر مصري (1887-1958)، من روّاد الاشتراكية في مصر، وعلماني صريح عرّف القرّاء المصريين بداروين ونيتشه وفرويد. أسّس مجلتي «المستقبل» و«المجلة الجديدة»، وألّف نحو خمسة وأربعين كتابًا منها سيرته «تربية سلامة موسى»، وكان أستاذًا لنجيب محفوظ في مطلع حياته الأدبية."
  en: "Egyptian journalist, writer and thinker (1887-1958), a pioneer of socialism in Egypt and an avowed secularist who introduced Egyptian readers to Darwin, Nietzsche and Freud. He founded the magazines al-Mustaqbal and al-Majalla al-Jadida, wrote some forty-five books including his autobiography Tarbiyat Salama Musa, and mentored the young Naguib Mahfouz."
  ur: "مصری صحافی، ادیب اور مفکر (1887-1958)، مصر میں اشتراکیت کے اولین علم برداروں میں سے اور ایک اعلانیہ سیکولر، جنہوں نے مصری قارئین کو ڈارون، نطشے اور فرائڈ سے متعارف کرایا۔ انہوں نے «المستقبل» اور «المجلۃ الجدیدہ» رسالے نکالے، تقریباً پینتالیس کتابیں لکھیں جن میں ان کی خود نوشت «تربیۃ سلامہ موسیٰ» بھی ہے، اور نوجوان نجیب محفوظ کے استاد رہے۔"
