summary:
  ar: "فقيه مغربي (1884–1964) من مدغرة بتافيلالت، درس بجامعة القرويين بفاس وتتلمذ على أبي شعيب الدكالي، ويُعد مؤسس السلفية الوطنية في المغرب؛ كان من أبرز تلامذته محمد بن الحسن الوزاني وعلال الفاسي. تولى قضاء فاس ثم رئاسة محكمة الاستئناف بالرباط (1928) ووزارة العدل (1938)، فاستقال احتجاجًا ونُفي، ورفض سنة 1953 التوقيع على عزل محمد الخامس وبيعة ابن عرفة فنُفي إلى تزنيت وعُذب على كبر سنه. صار بعد الاستقلال وزيرًا للتاج ومستشارًا لمحمد الخامس ثم استقال سنة 1960، ودعا إلى مقاطعة دستور 1962، وتوفي بفاس سنة 1964 ودُفن بمسقط رأسه."
  en: "Moroccan jurist (1884–1964) from Midghara in the Tafilalt, formed at the Qarawiyyin of Fez under Abu Shu'ayb al-Dukkali and regarded as the founder of the national Salafiyya in Morocco; Mohamed Hassan Ouazzani and Allal al-Fassi were among his pupils. He served as qadi of Fez, president of the Rabat appeals court (1928) and minister of justice (from 1938), resigned in protest and was exiled; in 1953 he refused to sign the deposition of Muhammad V or give allegiance to Ibn Arafa, and was exiled to Tiznit and tortured in his old age. After independence he became minister of the Crown and adviser to Muhammad V, resigned in 1960, campaigned against the 1962 constitution, and died at Fez in 1964; he is buried at his birthplace."
  ur: "مغربی فقیہ (1884–1964) جو تافیلالت کے مدغرہ سے تھے، فاس کی جامعہ قرویین سے تعلیم پائی اور ابو شعیب الدکالی کے شاگرد رہے، اور مغرب میں قومی سلفیہ کے بانی سمجھے جاتے ہیں؛ محمد بن الحسن الوزانی اور علال الفاسی ان کے شاگردوں میں سے تھے۔ فاس کے قاضی، پھر رباط کی اپیل عدالت کے صدر (1928ء) اور وزیرِ عدل (1938ء) رہے، احتجاجاً مستعفی ہوئے اور جلاوطن کیے گئے؛ 1953ء میں محمد پنجم کی معزولی پر دستخط اور ابن عرفہ کی بیعت سے انکار کیا تو تیزنیت جلاوطن کیے گئے اور بڑھاپے میں اذیت دی گئی۔ آزادی کے بعد وزیرِ تاج اور محمد پنجم کے مشیر بنے، 1960ء میں مستعفی ہوئے، 1962ء کے دستور کی مخالفت کی، اور 1964ء میں فاس میں وفات پائی؛ تدفین آبائی گاؤں میں ہوئی۔"
