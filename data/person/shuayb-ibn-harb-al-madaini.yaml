summary:
  ar: "أبو صالح شعيب بن حرب المدائني؛ من أبناء خراسان؛ سمع شعبة وسفيان الثوري وزهير بن معاوية؛ روى عنه موسى بن داود ويحيى بن أيوب المقابري وأحمد بن حنبل؛ وكان أحد المذكورين بالعبادة والصلاح والأمر بالمعروف؛ قال سري السقطي: أربعة كانوا في الدنيا أعملوا أنفسهم في طلب الحلال فلم يدخلوا أجوافهم إلا الحلال: وهيب بن الورد وشعيب بن حرب ويوسف بن أسباط وسليمان الخواص؛ وصاح يوماً بهارون الرشيد: يا هارون قد أتعبت الأمة وأتعبت البطائم، فسأله: ما منعك أن تدعوني باسمي؟ فقال: أنا أدعو الله باسمه فأقول يا الله يا رحمن — لا أدعوك باسمك؛ فقال: أخرجوه فأُخرج {cite:wafayat-ayan}."
  en: "Abu Salih Shu'ayb b. Harb al-Mada'ini (d. 199 Mecca) — Khurasani ascetic-transmitter of Shu'ba, Sufyan al-Thawri and Ibn Hanbal; counted by al-Sari al-Saqati among the four who fed themselves only on halal; rebuked Harun al-Rashid to his face and lived {cite:wafayat-ayan}."
  es: "Abu Salih Shu'ayb b. Harb al-Mada'ini (m. 199 La Meca): transmisor asceta Khurasani de Shu'ba, Sufyan al-Thawri e Ibn Hanbal; contado por al-Sari al-Saqati entre los cuatro que se alimentaban únicamente de halal; reprendió a Harun al-Rashid en su cara y vivió {cita:wafayat-ayan}."
  fr: "Abou Salih Shu'ayb b. Harb al-Mada'ini (mort en 199 à La Mecque) — Ascète-transmetteur Khurasani de Shu'ba, Sufyan al-Thawri et Ibn Hanbal; compté par al-Sari al-Saqati parmi les quatre qui se nourrissaient uniquement de halal; réprimanda Harun al-Rashid en face et vécut {cite: wafayat-ayan}."
  ur: "ابو صالح شعیب بن حرب المدائنی ⁦(متوفی 199 مکہ)⁩ - خراسانی شعبہ، سفیان الثوری اور ابن حنبل کے متولی۔ الساری السقطی نے ان چاروں میں شمار کیا جنہوں نے صرف حلال پر کھانا کھلایا۔ ہارون الرشید کو منہ کے بل ملامت کی اور زندگی گزاری۔"
  tr: "Ebu Salih Şuayb ibn Harb al-Mada'ini; Horasan'ın oğullarından; Şube, Sufyan el-Thawri ve Zuhair ibn Muawiya'yı dinledi; Musa ibn Davud, Yahya ibn Eyyub el-Maqabri ve Ahmed ibn Hanbal ondan rivayet etti; ibadet ve doğruluk ve iyiliği emretmekte adı geçenler arasındaydı. Sari al-Saqati şöyle dedi: Bu dünyada dört kişi vardı ki kendilerini yasal şeyler aramaya adadılar, fakat onlar sadece yasal şeylere girdiler: Wahib ibn al-Ward, Şuayb ibn Harb, Yusuf ibn Asbat ve Suleyman el-Khawas. Bir gün Harun al-Rashid'e seslendi: Ey Harun, millet ve tembeller yoruldu. Ona sordu: Beni adımla çağırmanı ne engelledi? Dedi ki: Allah'ı O'nun adıyla çağırıyorum, bu yüzden diyorum ki, ey Allah, ey Merhametli — Sana adınla seslenmem. Dedi ki: Onu kov ve çıkar. {cite:) Wafayat-ayan}."
  id: "Abu Salih Shu'ayb ibn Harb al-Mada'ini; dari anak-anak Khurasan; ia mendengar Shu'bah, Sufyan al-Thawri, dan Zuhair ibn Muawiya; Musa ibn Dawud, Yahya ibn Ayyub al-Maqabri, dan Ahmad ibn Hanbal menceritakan darinya; ia termasuk di antara mereka yang disebut dalam ibadah, kebenaran, dan perintah kebaikan. Sari al-Saqati berkata: Ada empat orang di dunia ini yang mengabdikan diri untuk mencari hal-hal yang sah, tetapi mereka hanya memasuki hal-hal yang sah: wahib ibn al-Ward, Shu'ayb ibn Harb, Yusuf ibn Asbat, dan Sulayman al-Khawas. Suatu hari, ia memanggil Harun al-Rashid: Wahai Harun, bangsa dan yang malas sudah kelelahan. Ia bertanya: Apa yang menghalangimu memanggilku dengan namaku? Ia berkata: Aku memanggil Allah dengan nama-Nya, maka aku berkata, Ya Allah, wahai Maha Penyayang — Aku tidak memanggil-Mu dengan nama-Mu. Ia berkata: Usir dia, dan keluarkan dia. {cite:\" Wafayat-Ayan}."
