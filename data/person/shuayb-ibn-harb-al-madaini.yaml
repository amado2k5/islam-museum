summary:
  ar: "أبو صالح شعيب بن حرب المدائني؛ من أبناء خراسان؛ سمع شعبة وسفيان الثوري وزهير بن معاوية؛ روى عنه موسى بن داود ويحيى بن أيوب المقابري وأحمد بن حنبل؛ وكان أحد المذكورين بالعبادة والصلاح والأمر بالمعروف؛ قال سري السقطي: أربعة كانوا في الدنيا أعملوا أنفسهم في طلب الحلال فلم يدخلوا أجوافهم إلا الحلال: وهيب بن الورد وشعيب بن حرب ويوسف بن أسباط وسليمان الخواص؛ وصاح يوماً بهارون الرشيد: يا هارون قد أتعبت الأمة وأتعبت البطائم، فسأله: ما منعك أن تدعوني باسمي؟ فقال: أنا أدعو الله باسمه فأقول يا الله يا رحمن — لا أدعوك باسمك؛ فقال: أخرجوه فأُخرج {cite:wafayat-ayan}."
  en: "Abu Salih Shu'ayb b. Harb al-Mada'ini (d. 199 Mecca) — Khurasani ascetic-transmitter of Shu'ba, Sufyan al-Thawri and Ibn Hanbal; counted by al-Sari al-Saqati among the four who fed themselves only on halal; rebuked Harun al-Rashid to his face and lived {cite:wafayat-ayan}."
