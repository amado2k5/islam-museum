summary:
  ar: "عبد العزيز بن عبد الواحد الشربي المكناسي المالكي، الإمام العالم الأديب شيخ القراء بالمدينة المنورة؛ كان فاضلاً علامة متقناً شاعراً صالحاً دمث الأخلاق كثير التواضع، وله مصنفات في علوم شتى منها: منهج الوصول ومجمع السالك للأصول في أصول الدين، ونظم جواهر السيوطي في علم التفسير، ودرر الأصول في أصول الفقه، ومتاع الأنظار وتخجة الأفكار في الجدل، ونظم العقود في المعاني والبيان، وتحفة الأحباب في الصرف، وغنية الأعراب في النحو، ونزهة الألباب في الحساب، والدر في المنطق؛ وقدم دمشق بعد أن زار بيت المقدس من جهة المدينة سنة إحدى وخمسين ودخل حلب واستجاز بها الشمس السفيري والموفق بن أبي ذر، وتوفي بالمدينة المنورة {cite:shadharat-dhahab p. 342-343}."
  en: "Al-Sharbi al-Miknasi — shaykh al-qurra' of Medina, a Maliki polymath: Minhaj al-Wusul and Majma' al-Salik in usul al-din, a verse-ification of al-Suyuti's Jawahir in tafsir, Durar al-Usul, plus works on jadal, balagha, sarf, nahw, hisab and mantiq; he toured Jerusalem, Damascus and Aleppo and died at Medina [964] {cite:shadharat-dhahab p. 342-343}."
  es: "Al-Sharbi al-Miknasi - shaykh al-qurra' de Medina, un erudito Maliki: Minhaj al-Wusul y Majma' al-Salik en usul al-din, una versoificación del Jawahir de al-Suyuti en tafsir, Durar al-Usul, además de obras sobre jadal, balagha, sarf, nahw, hisab y mantiq; realizó una gira por Jerusalén, Damasco y Alepo y murió en Medina [964] {cita: shadharat-dhahab p. 342-343}."
  fr: "Al-Sharbi al-Miknasi — shaykh al-qurra' de Médine, un mathématicien Maliki: Minhaj al-Wusul et Majma' al-Salik dans usul al-din, une versification du Jawahir d'al-Suyuti dans tafsir, Durar al-Usul, ainsi que des travaux sur jadal, balagha, sarf, nahw, hisab et mantiq; il visita Jérusalem, Damas et Alep et mourut à Médine [964] {cite: shadharat-dhahab p. 342-343}."
  ur: "الشربی المکناسی - مدینہ کے شیخ القراء، ایک مالکی کثیرالمطالعہ: منہاج الوسول اور مجمع السالک اصول الدین میں، تفسیر میں السیوطی کے جواہر کی ایک آیت کی تفسیر، دورار الصل، علاوہ جدل، مناقب، حصرت، بالشفاء اور اس پر کام۔ اس نے یروشلم، دمشق اور حلب کا دورہ کیا اور مدینہ میں وفات پائی [964]۔ 342-343}۔"
  tr: "Abdul Aziz bin Abdul Wahid al-Sharbi al-Maknasi al-Maliki, Medine'nin imam, alimi, edebi figürü ve baş şiifçisi; erdemli, bilgili bir âlim, doğru bir şair, zarif karakterli ve çok alçakgönüllüydü. Manhaj al-Wusul, Majma'al-Salik lil-Usul fi Usul al-Din, Nazm Jawahir al-Suyuti, Durar al-Usul fi Usul al-Fiqh, Mata' al-Anzar wa Takhja al-Afkar fi al-Jadiq, Nazm al-Uqud fi al-Ma'ani wa al-Bayyan, Tuhfat al-Ahbab fi al-Nahf al-Nahw, Nuzhat al-Albab fi-al-Nahsab ve al-Durr fi al-Mu'riq gibi çeşitli bilim dallarında eserler yazdı."
  id: "Abdul Aziz bin Abdul Wahid al-Sharbi al-Maknasi al-Maliki, imam, cendekiawan, tokoh sastra, dan kepala pembaca di Madinah; ia adalah ulama yang berbudi luhur, penyair yang berwibawa, berkarakter halus, dan sangat rendah hati. Ia menulis karya dalam berbagai ilmu pengetahuan termasuk: Manhaj al-Wusul, Majma' al-Salik lil-Usul fi Usul al-Din, Nazm Jawahir al-Suyuti, Durar al-Usul fi Usul al-Fiqh, Mata' al-Anzar wa Takhja al-Afkar fi al-Jadiq, Nazm al-'Uqud fi al-Ma'ani wa al-Bayyan, Tuhfat al-Ahbab fi al-Nahf al-Nahw, Nuzhat al-Albab fi al-Nahsab, dan al-Durr fi al-Mu'riq."
