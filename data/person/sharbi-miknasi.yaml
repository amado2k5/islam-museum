summary:
  ar: "عبد العزيز بن عبد الواحد الشربي المكناسي المالكي، الإمام العالم الأديب شيخ القراء بالمدينة المنورة؛ كان فاضلاً علامة متقناً شاعراً صالحاً دمث الأخلاق كثير التواضع، وله مصنفات في علوم شتى منها: منهج الوصول ومجمع السالك للأصول في أصول الدين، ونظم جواهر السيوطي في علم التفسير، ودرر الأصول في أصول الفقه، ومتاع الأنظار وتخجة الأفكار في الجدل، ونظم العقود في المعاني والبيان، وتحفة الأحباب في الصرف، وغنية الأعراب في النحو، ونزهة الألباب في الحساب، والدر في المنطق؛ وقدم دمشق بعد أن زار بيت المقدس من جهة المدينة سنة إحدى وخمسين ودخل حلب واستجاز بها الشمس السفيري والموفق بن أبي ذر، وتوفي بالمدينة المنورة {cite:shadharat-dhahab p. 342-343}."
  en: "Al-Sharbi al-Miknasi — shaykh al-qurra' of Medina, a Maliki polymath: Minhaj al-Wusul and Majma' al-Salik in usul al-din, a verse-ification of al-Suyuti's Jawahir in tafsir, Durar al-Usul, plus works on jadal, balagha, sarf, nahw, hisab and mantiq; he toured Jerusalem, Damascus and Aleppo and died at Medina [964] {cite:shadharat-dhahab p. 342-343}."
