summary:
  ar: "محام ومناضل استقلال وسياسي هندي (1888–1953)، أول سفير للهند في الولايات المتحدة، وحاكم أوديشا لولايتين ثم سفير في سويسرا حيث توفي في منصبه. دافع عن بهاغت سينغ وعن ضباط الجيش الوطني الهندي، وانتُخب للمجلس التشريعي المركزي سنة 1935، وسُجن مرارًا في حركة الاستقلال."
  en: "Indian lawyer, independence activist and politician (1888–1953), India's first ambassador to the United States, twice Governor of Odisha and then ambassador to Switzerland, where he died in office. He defended Bhagat Singh and the INA officers, was elected to the Central Legislative Assembly in 1935, and was imprisoned repeatedly during the freedom movement."
  ur: "ہندوستانی وکیل، مجاہد آزادی اور سیاست دان (1888ء–1953ء)، امریکہ میں ہندوستان کے پہلے سفیر، اڈیشہ کے دو مرتبہ گورنر اور پھر سوئٹزرلینڈ میں سفیر، جہاں وہ عہدے پر فوت ہوئے۔ انھوں نے بھگت سنگھ اور آئی این اے افسران کا دفاع کیا، 1935ء میں مرکزی قانون ساز اسمبلی کے رکن منتخب ہوئے اور تحریک آزادی میں بار بار قید رہے۔"
