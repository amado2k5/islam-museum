summary:
  ar: "روبرت بودي هارتونو (وُلد باسم أوي هوي تجونغ في 28 نيسان 1941 في سمارانغ) رجل أعمال إندونيسي ورث مع أخيه الأكبر مايكل بامبانغ هارتونو شركة جاروم للسجائر من أبيهما أوي وي غوان سنة 1963، وبنى معه مجموعة جاروم وبنك سنترال آسيا وإلكترونيات بوليترون وغراند إندونيسيا؛ أسس نادي جاروم للبادمنتون سنة 1969، ويُعد مع أخيه منذ سنوات أغنى رجال إندونيسيا."
  en: "Robert Budi Hartono (born Oei Hwie Tjhong on 28 April 1941 in Semarang) is an Indonesian businessman who inherited the Djarum cigarette company with his elder brother Michael Bambang Hartono from their father Oei Wie Gwan in 1963, and built the Djarum Group, Bank Central Asia, Polytron electronics and Grand Indonesia with him; he founded the PB Djarum badminton club in 1969, and the brothers have long been listed as Indonesia's richest people."
  ur: "رابرٹ بوڈی ہارٹونو (پیدائش بطور اوئی ہوئیے تجونگ 28 اپریل 1941، سیمارانگ) انڈونیشیائی کاروباری ہیں جنھوں نے اپنے بڑے بھائی مائیکل بمبانگ ہارٹونو کے ساتھ 1963 میں اپنے والد اوئی وی گوان سے جاروم سگریٹ کمپنی وراثت میں پائی، اور ان کے ساتھ جاروم گروپ، بینک سینٹرل ایشیا، پولیٹرون الیکٹرانکس اور گرینڈ انڈونیشیا بنایا؛ انھوں نے 1969 میں پی بی جاروم بیڈمنٹن کلب قائم کیا، اور دونوں بھائی برسوں سے انڈونیشیا کے امیر ترین افراد گنے جاتے ہیں۔"
