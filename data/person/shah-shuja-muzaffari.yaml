label:
  ar: شاه شجاع بن محمد المظفر
  en: Shah Shuja' ibn Muhammad al-Muzaffar
summary:
  ar: "شاه شجاع بن محمد بن المظفر، أشهر ملوك بني المظفر؛ ملك شيراز وكرمان فاستبد عليه أخوه محمود وكحله هو وشاه ولي سنة 760هـ، ثم تولى الملك وكانت أيامه حياة شيراز الذهبية في العمران والعلم والشعر حتى اجتمع بها العلماء والشعراء وأهل الصنائع، وهلك سنة 787هـ فاستقل ابنه زين العابدين بأصفهان وخلفه في شيراز وفارس منصور ابن أخيه شاه ولي."
  en: "Shah Shuja' ibn Muhammad ibn al-Muzaffar, most famous of the Muzaffarid kings; holding Shiraz and Kirman, he was blinded in 760 with his brother Shah Wali by their brother Mahmud's usurpation, then came to the kingship — his days were Shiraz's golden age of building, learning and verse, when scholars, poets and craftsmen thronged the city — he died in 787, his son Zayn al-Abidin taking Isfahan and his nephew Mansur ibn Shah Wali inheriting Shiraz and Fars."
