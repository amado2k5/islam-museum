id: person/shah-shuja-muzaffari
class: person
label:
  ar: شاه شجاع بن محمد المظفر
  en: Shah Shuja' ibn Muhammad al-Muzaffar
  es: "Shah Shuja' ibn Muhammad al-Muzaffar"
  fr: "Shah Shuja' ibn Muhammad al-Muzaffar"
  ur: "شاہ شجاع ابن محمد المظفر"
summary:
  ar: "شاه شجاع بن محمد بن المظفر، أشهر ملوك بني المظفر؛ ملك شيراز وكرمان فاستبد عليه أخوه محمود وكحله هو وشاه ولي سنة 760هـ، ثم تولى الملك وكانت أيامه حياة شيراز الذهبية في العمران والعلم والشعر حتى اجتمع بها العلماء والشعراء وأهل الصنائع، وهلك سنة 787هـ فاستقل ابنه زين العابدين بأصفهان وخلفه في شيراز وفارس منصور ابن أخيه شاه ولي."
  en: "Shah Shuja' ibn Muhammad ibn al-Muzaffar, most famous of the Muzaffarid kings; holding Shiraz and Kirman, he was blinded in 760 with his brother Shah Wali by their brother Mahmud's usurpation, then came to the kingship — his days were Shiraz's golden age of building, learning and verse, when scholars, poets and craftsmen thronged the city — he died in 787, his son Zayn al-Abidin taking Isfahan and his nephew Mansur ibn Shah Wali inheriting Shiraz and Fars."
  es: "Shah Shuja' ibn Muhammad ibn al-Muzaffar, el más famoso de los reyes muzaffáridas, que gobernó Shiraz y Kirman, fue cegado en 760 junto con su hermano Shah Wali por la usurpación de su hermano Mahmud, y entonces ascendió al trono. Sus días fueron la edad de oro de Shiraz en cuanto a construcción, aprendizaje y poesía, cuando eruditos, poetas y artesanos llenaban la ciudad. Murió en 787, su hijo Zayn al-Abidin tomó Isfahán y su sobrino Mansur ibn Shah Wali heredó Shiraz y Fars."
  fr: "Shah Shuja' ibn Muhammad ibn al-Muzaffar, le plus célèbre des rois Muzaffarides, régnant sur Shiraz et Kirman, fut aveuglé en 760 avec son frère Shah Wali par l'usurpation de leur frère Mahmud, puis accéda au trône. Son règne fut l'âge d'or de Shiraz, marqué par la construction, l'apprentissage et la poésie, alors que la ville attirait savants, poètes et artisans. Il mourut en 787, son fils Zayn al-Abidin prenant Ispahan et son neveu Mansur ibn Shah Wali héritant de Shiraz et de Fars."
  ur: "شاہ شجاع ابن محمد بن المظفر، مظفری بادشاہوں میں سب سے مشہور؛ شیراز اور کرمان کو تھامے ہوئے، وہ 760 میں اپنے بھائی شاہ ولی کے ساتھ ان کے بھائی محمود کے قبضے سے اندھا ہو گیا، پھر بادشاہی پر آیا - اس کے دن شیراز کی تعمیر، علم اور کلام کا سنہری دور تھا، جب علماء، شاعروں اور کاریگروں نے شہر کا ہجوم کیا تھا - وہ 787 میں فوت ہوا، اس کے بیٹے زین العابدین شاہ ولی اللہ اور ان کے بیٹے منصف الوفاء کو لے کر چلے گئے۔ شیراز اور فارس کو وراثت میں ملا۔"
  tr: "Şah Şuca ibn Muhammed ibn el-Muzaffar, Banu Muzaffar'ın en ünlü kralı; Şiraz ve Kirman'ı yönetti, ancak kardeşi Mahmud ve Şahı onu yönetti ve 760 Hicri yılında vali oldu. Daha sonra tahta çıktı ve günleri Şiraz'ın mimarlık, bilgi ve şiirle altın hayatı oldu; ta ki alimler, şairler ve zanaatkârlar orada toplanana kadar. 787 Hicri'de öldü, böylece oğlu Zeyn el-Abidin İsfahan'da bağımsız oldu, yerine Şiraz'da geçti, Faris Mansur ise yeğeni Şah Veli oldu."
  id: "Shah Shuja ibn Muhammad ibn al-Muzaffar, raja paling terkenal dari Banu Muzaffar; ia memerintah Shiraz dan Kerman, tetapi saudaranya Mahmoud dan Shah-nya memerintah dan ia menjadi gubernur pada tahun 760 H. Ia kemudian naik tahta, dan hari-harinya adalah masa keemasan Shiraz dalam arsitektur, pengetahuan, dan puisi, hingga para cendekiawan, penyair, dan pengrajin berkumpul di sana. Ia meninggal pada tahun 787 H, sehingga putranya Zain al-Abidin merdeka di Isfahan, digantikan olehnya di Shiraz, dan Faris Mansur, keponakannya Shah Wali."
