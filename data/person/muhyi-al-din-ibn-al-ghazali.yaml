summary:
  ar: "محيي الدين أبو حامد الغزالي من سلالة الإمام محمد الغزالي الطوسي؛ قدم من بلاده إلى حلب في رمضان سنة ثلاثين وثمانمائة وكان قد سمع من مسند الوقت ابن أميلة، وذُكر عنه علم كثير وزهد وورع وحج مراراً منها واحدة ماشياً على قدم التجريد وكان معظماً في بلاده، توفي بحلب في العشر الأخير من رمضان وكانت جنازته مشهودة {cite:shadharat-dhahab p. 196}."
  en: "Muhyi al-Din Abu Hamid, a living descendant of Imam al-Ghazali — reached Aleppo in Ramadan 830 already a transmitter of Ibn Umayla, remembered for learning, asceticism and a barefoot hajj; died at Aleppo in the last ten days of Ramadan to a crowded funeral {cite:shadharat-dhahab p. 196}."
  es: "Muhyi al-Din Abu Hamid, descendiente vivo del Imam al-Ghazali, llegó a Alepo en Ramadán 830 siendo ya transmisor de Ibn Umayla, recordado por su erudición, ascetismo y una peregrinación a La Meca descalzo; murió en Alepo en los últimos diez días de Ramadán en un funeral multitudinario {cite:shadharat-dhahab p. 196}."
  fr: "Muhyi al-Din Abu Hamid, un descendant vivant de l'Imam al-Ghazali, est arrivé à Alep au Ramadan 830, déjà transmetteur d'Ibn Umayla, connu pour son érudition, son ascétisme et un hajj pieds nus; est mort à Alep dans les dix derniers jours du Ramadan lors de funérailles bondées {cite:shadharat-dhahab p. 196}."
  ur: "محی الدین ابو حامد، امام الغزالی کی ایک زندہ اولاد - رمضان 830 میں حلب پہنچا، جو پہلے ہی ابن عمائلہ کا ایک ٹرانسمیٹر تھا، جسے سیکھنے، سنیاسی اور ننگے پاؤں حج کے لیے یاد کیا جاتا تھا۔ رمضان کے آخری عشرہ کے دوران حلب میں ایک پرہجوم جنازے میں انتقال کر گئے۔ 196}۔"
  tr: "İmam Muhammed el-Gazeli el-Tusi'nin soyundan gelen Muhyiddin Ebu Hamid el-Gazali, 830 Hicri Ramazan ayında memleketinden Halep'e gelmiştir. O dönemin Musnadi'nden İbn Amila'dan duymuş ve ondan defalarca bilgi, münzevi, dindarlık ve hac yolculuğundan bahsetmiş, bunlardan biri eski günlerde yürümüştür. Vatanında saygı görmüştür. Ramazan'ın son on gününde Halep'te ölmüş ve cenazesi izlenmiştir {cite:shadharat-dhahab, s. 196}."
  id: "Muhyiddin Abu Hamid al-Ghazali, keturunan Imam Muhammad al-Ghazali al-Tusi, datang dari tanah kelahirannya ke Aleppo pada Ramadan tahun 830 H. Ia telah mendengar dari Musnad pada masa itu tentang Ibn Amila dan berulang kali menyebutkan banyak ilmu, asketisme, kesalehan, dan ziarah darinya, termasuk salah satunya berjalan di masa lalu. Ia dihormati di tanah airnya. Ia meninggal di Aleppo selama sepuluh hari terakhir Ramadan, dan pemakamannya disaksikan {cite:shadharat-dhahab, hlm. 196}."
