  ar: "محيي الدين أبو حامد الغزالي من سلالة الإمام محمد الغزالي الطوسي؛ قدم من بلاده إلى حلب في رمضان سنة ثلاثين وثمانمائة وكان قد سمع من مسند الوقت ابن أميلة، وذُكر عنه علم كثير وزهد وورع وحج مراراً منها واحدة ماشياً على قدم التجريد وكان معظماً في بلاده، توفي بحلب في العشر الأخير من رمضان وكانت جنازته مشهودة {cite:shadharat-dhahab p. 196}."
