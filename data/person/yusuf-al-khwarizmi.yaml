summary:
  ar: "صاحب قلعة مستحفظة على جيحون، أُتي به أسيرًا إلى السلطان ألب أرسلان في سادس ربيع الأول سنة خمس وستين وأربعمائة، فشتمه السلطان وأمر بأن تُضرب له أربعة أوتاد وتُشدّ أطرافه إليها، فقال: «يا مخنّث، مثلي يُقتل هذه القتلة؟» فاحتدّ السلطان وأخذ قوسه ورماه بسهم فأخطأ، فعدا يوسف إليه وكان جالسًا على سدّة فنهض لينزل فعثر ووقع على وجهه، فوثب عليه يوسف وضربه بسكين في خاصرته فكانت منها الوفاة، ولحقه الجند فقتلوه {cite:muntazam-ibn-al-jawzi j.8 p.618-619}."
  en: "The fortress-commander on the Oxus who killed Sultan Alp Arslan: brought bound before him on 6 Rabi' I 465 and condemned to the stakes, he taunted the sultan — 'shall the likes of me die such a death?' — and when Alp Arslan's own arrow missed and the sultan stumbled rising from his dais, Yusuf sprang and drove a knife into his side before the guards cut him down {cite:muntazam-ibn-al-jawzi j.8 p.618-619}."
