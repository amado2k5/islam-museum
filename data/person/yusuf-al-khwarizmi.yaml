names:
  - { value: "يوسف الخوارزمي صاحب القلعة", kind: full }
summary:
  ar: "صاحب قلعة مستحفظة على جيحون، أُتي به أسيرًا إلى السلطان ألب أرسلان في سادس ربيع الأول سنة خمس وستين وأربعمائة، فشتمه السلطان وأمر بأن تُضرب له أربعة أوتاد وتُشدّ أطرافه إليها، فقال: «يا مخنّث، مثلي يُقتل هذه القتلة؟» فاحتدّ السلطان وأخذ قوسه ورماه بسهم فأخطأ، فعدا يوسف إليه وكان جالسًا على سدّة فنهض لينزل فعثر ووقع على وجهه، فوثب عليه يوسف وضربه بسكين في خاصرته فكانت منها الوفاة، ولحقه الجند فقتلوه {cite:muntazam-ibn-al-jawzi j.8 p.618-619}."
  en: "The fortress-commander on the Oxus who killed Sultan Alp Arslan: brought bound before him on 6 Rabi' I 465 and condemned to the stakes, he taunted the sultan — 'shall the likes of me die such a death?' — and when Alp Arslan's own arrow missed and the sultan stumbled rising from his dais, Yusuf sprang and drove a knife into his side before the guards cut him down {cite:muntazam-ibn-al-jawzi j.8 p.618-619}."
  es: "El comandante de la fortaleza del Oxus que mató al sultán Alp Arslan: llevado atado ante él el 6 de Rabi' I de 465 y condenado a la hoguera, se burló del sultán: \"¿Acaso alguien como yo morirá de tal manera?\". Cuando la flecha de Alp Arslan falló y el sultán tropezó al levantarse de su estrado, Yusuf saltó y le clavó un cuchillo en el costado antes de que los guardias lo abatieran {cite:muntazam-ibn-al-jawzi j.8 p.618-619}."
  fr: "Le commandant de la forteresse sur l'Oxus qui tua le sultan Alp Arslan: amené ligoté devant lui le 6 Rabi' I 465 et condamné au bûcher, il railla le sultan — « quelqu'un comme moi mourra-t-il d'une telle mort ? » — et lorsque la flèche d'Alp Arslan manqua sa cible et que le sultan trébucha en se relevant de son estrade, Yusuf bondit et lui enfonça un couteau dans le flanc avant que les gardes ne l'abattent {cite:muntazam-ibn-al-jawzi j.8 p.618-619}."
  ur: "آکسس پر قلعہ کا کمانڈر جس نے سلطان الپ ارسلان کو قتل کیا: 6 ربیع الثانی 465 کو اس کے سامنے باندھ کر لایا گیا اور اس نے سلطان کو طعنہ دیا - 'کیا مجھ جیسے لوگ ایسی موت مریں گے؟' - اور جب الپ ارسلان کا اپنا تیر چھوٹ گیا اور سلطان اپنی منزل سے اٹھتے ہوئے ٹھوکر کھا گیا تو یوسف نے چھری پھیر کر اس کے پہلو میں چلائی اس سے پہلے کہ گارڈز اسے کاٹ ڈالیں۔"
  tr: "Jihun'da tutulan bir kalenin sahibiydi ve 465 Hicri yılının Rabi'al-Awwal ayının altıncısında Sultan Alp Arslan'a esir olarak getirildi. Sultan ona hakaret etti ve dört kazığın vurulmasını, uzuvlarının onlara bağlanmasını emretti. Sultan şöyle dedi: 'Sen kadınsı, benim gibi biri bu katilleri öldürür mü?' Sultan huzursuzlandı, yayını aldı ve okla vurdu, ama ıskaladı. Yusuf ona doğru koştu, ayağa kalktı, sendeledi ve yüzüstü düştü. Yusuf üzerine atladı ve yanından bıçakladı, bu da ölüme sebep oldu. Askerler onu takip etti ve öldürdü {cite:muntazam-ibn-al-jawzi J.8 s.618-619}."
  id: "Ia adalah pemilik benteng yang dikuasai di Jihun, dan ditangkap oleh Sultan Alp Arslan pada tanggal enam Rabi' al-Awwal tahun 465 H. Sultan menghina dan memerintahkan agar empat pasak dipukul dan anggota tubuhnya diikat ke sana. Ia berkata: 'Kau wanita lembut, apakah seseorang seperti aku akan membunuh para pembunuh ini?' Sultan menjadi gelisah, mengambil busurnya, dan menembaknya dengan panah, tetapi ia meleset. Yusuf berlari kembali kepadanya saat ia duduk di bangku, bangkit, tersandung, dan jatuh tersungkur. Yusuf melompat ke arahnya dan menikamnya di sisi tubuh, menyebabkan kematian. Para prajurit mengikutinya dan membunuhnya {cite:muntazam-ibn-al-jawzi J.8 hlm.618-619}."
