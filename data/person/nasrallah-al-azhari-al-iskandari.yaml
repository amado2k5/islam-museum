summary:
  ar: "القاضي الأعز أبو الفتح نصر الله بن عبد الله الأزهري الإسكندري؛ كان سباطاً لأهليته وشاعراً مجيداً صحب السلفي وانتفع بصحبته، ودخل اليمن وامتدح أمير عدن فأجزل عطيته ثم غرق ما معه فعاد إليه عرياناً فأنشده قصيدته التي أولها «صدرنا وقد نادى السماح تبادر فعدنة إلى مغناك والعود أجمل» فأحسن إليه أيضاً؛ ترجمته في أخبار سنة سبع وستين وخمسمائة {cite:shadharat-dhahab p. 704-705}."
  en: "Qadi al-A'azz Abu al-Fath Nasrallah ibn Abdallah al-Azhari of Alexandria; scholar-poet who accompanied al-Silafi, entered Yemen and praised Aden's amir who gave lavishly — then he was shipwrecked and returned naked, reciting the ode opening 'we set out while Generosity called us to hurry; for Aden, to your shelter — and return is sweeter still', and the amir was good to him again; his notice falls in year 567 {cite:shadharat-dhahab p. 704-705}."
