id: person/nasrallah-al-azhari-al-iskandari
class: person
label: { ar: "القاضي الأعز نصر الله الأزهري" }
names:
  - { value: "أبو الفتح نصر الله بن عبد الله بن مخلوف بن ملمس الأزهري الإسكندري الملقب القاضي الأعز", kind: full }
summary:
  ar: "القاضي الأعز أبو الفتح نصر الله بن عبد الله الأزهري الإسكندري؛ كان سباطاً لأهليته وشاعراً مجيداً صحب السلفي وانتفع بصحبته، ودخل اليمن وامتدح أمير عدن فأجزل عطيته ثم غرق ما معه فعاد إليه عرياناً فأنشده قصيدته التي أولها «صدرنا وقد نادى السماح تبادر فعدنة إلى مغناك والعود أجمل» فأحسن إليه أيضاً؛ ترجمته في أخبار سنة سبع وستين وخمسمائة {cite:shadharat-dhahab p. 704-705}."
  en: "Qadi al-A'azz Abu al-Fath Nasrallah ibn Abdallah al-Azhari of Alexandria; scholar-poet who accompanied al-Silafi, entered Yemen and praised Aden's amir who gave lavishly — then he was shipwrecked and returned naked, reciting the ode opening 'we set out while Generosity called us to hurry; for Aden, to your shelter — and return is sweeter still', and the amir was good to him again; his notice falls in year 567 {cite:shadharat-dhahab p. 704-705}."
  es: "Qadi al-A'azz Abu al-Fath Nasrallah ibn Abdallah al-Azhari de Alejandría; erudito y poeta que acompañó a al-Silafi, entró en Yemen y alabó al emir de Adén, quien le dio generosamente; luego naufragó y regresó desnudo, recitando la oda que comienza con \"partimos mientras la Generosidad nos llamaba a apresurarnos; por Adén, a tu refugio, y el regreso es aún más dulce\", y el emir fue bueno con él nuevamente; su mención se encuentra en el año 567 {cita: shadharat-dhahab pág. 704-705}."
  fr: "Le cadi al-A'azz Abu al-Fath Nasrallah ibn Abdallah al-Azhari d'Alexandrie, érudit et poète qui accompagna al-Silafi, entra au Yémen et loua l'émir d'Aden qui fit preuve d'une grande générosité. Il fit ensuite naufrage et revint nu, récitant l'ode commençant par « Nous sommes partis alors que la générosité nous appelait à nous hâter; pour Aden, vers ton refuge — et le retour est encore plus doux », et l'émir fut de nouveau bon envers lui; sa mention date de l'an 567 {cite: shadharat-dhahab p. 704-705}."
  ur: "قادی العزیز ابو الفتح نصراللہ ابن عبداللہ الازہری سکندریہ؛ اسکالر شاعر جو السلفی کے ساتھ تھا، یمن میں داخل ہوا اور عدن کے امیر کی تعریف کی جس نے شاہانہ عنایت کی - پھر وہ جہاز تباہ ہو گیا اور برہنہ ہو کر واپس آیا، اوڈ اوپننگ کی تلاوت کرتے ہوئے 'ہم روانہ ہوئے جب کہ سخاوت نے ہمیں جلدی کرنے کے لیے بلایا؛ عدن کے لیے، آپ کی پناہ گاہ - اور واپسی اب بھی زیادہ پیاری ہے'، اور امیر اس کے ساتھ پھر اچھا تھا۔ اس کا نوٹس 567 میں آتا ہے۔ 704-705}۔"
  tr: "Saygıdeğer yargıç Ebu el-Feth Nasrallah ibn Abdullah el-Ezhari el-İskanderi, soyluluğuyla seçkin bir şair ve Selefilere eşlik eden, onun arkadaşlığından faydalanan seçkin bir şairdi. Yemen'e girdi ve Aden Emiri'ni övdü; Emiri cömertçe ödüllendirdi, sonra sahip olduklarını boğup çıplak olarak ona döndü. Şiirini okudu; şiir şöyle başladı: \"Göğsümüz bağışlanmayı çağırdı, bu yüzden sen inisiyatifi al ve Aden şarkıcına ve ud daha güzeldir.\" Ayrıca iyi muamele gördü; biyografisi 567 yılının haberlerinde {cite:shadharat-dhahab, s. 704-705}."
  id: "Hakim terhormat Abu al-Fath Nasrallah ibn Abdullah al-Azhari al-Iskandari adalah penyair terhormat dari kebangsawanannya dan penyair ternama yang menemani Salafi serta mendapat manfaat dari kehadirannya. Ia memasuki Yaman dan memuji Emir Aden, yang dengan murah hati memberinya hadiah, lalu menenggelamkan apa yang dimilikinya dan kembali kepadanya dalam keadaan telanjang. Ia membacakan puisinya, yang dimulai dengan, \"Dada kita telah memanggil pengampunan, maka kamu mengambil inisiatif dan Aden menjadi penyanyimu, dan oud menjadi lebih indah.\" Dia juga diperlakukan dengan baik; biografinya dalam berita tahun 567 {cite:shadharat-dhahab, hlm. 704-705}."
