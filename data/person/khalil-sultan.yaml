summary:
  ar: "حاكم تيموري لما وراء النهر (1384-1411)، ابن ميران شاه وحفيد تيمور. استولى عند وفاة جده سنة 1405 على سمرقند وخزانته وحكم أربع سنوات، حتى انتزعها منه عمه شاه رخ سنة 1409، فسلَّم له وعُيّن حاكماً على الريّ، وهناك توفي سنة 1411. عُرف بزواجه من شاد ملك آغا الذي أثار استياء نبلاء سمرقند، وتنسب إليه المصادر المعادية كثيراً من أخطاء حكمه."
  en: "Timurid ruler of Transoxiana (1384–1411), son of Miran Shah and grandson of Timur. On his grandfather's death in 1405 he seized Samarkand and its treasury and held the city for four years, until his half-uncle Shah Rukh displaced him in 1409; he surrendered, was appointed governor of Rayy, and died there in 1411. His infatuation with his wife Shad Malik Agha alienated the Samarkand nobility, and the hostile narrative tradition lays many of his misjudgements at her door."
  ur: "ماوراء النہر کے تیموری حکمران (1384ء–1411ء)، میران شاہ کے صاحبزادے اور تیمور کے پوتے۔ 1405ء میں دادا کی وفات پر انھوں نے سمرقند اور اس کے خزانے پر قبضہ کر لیا اور چار برس حکومت کی، یہاں تک کہ 1409ء میں ان کے چچا شاہ رخ نے انھیں بے دخل کر دیا؛ انھوں نے اطاعت قبول کی، ریّ کے حاکم مقرر ہوئے اور 1411ء میں وہیں وفات پائی۔ اپنی اہلیہ شاد ملک آغا سے ان کی غیر معمولی وابستگی نے سمرقند کے امراء کو ناراض کر دیا، اور مخالف روایات ان کی کئی غلطیوں کا ذمہ دار انھی کو ٹھہراتی ہیں۔"

