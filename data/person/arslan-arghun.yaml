id: person/arslan-arghun
class: person
label: { ar: "أرسلان أرغون بن ألب أرسلان" }
summary:
  ar: "أرسلان أرغون بن السلطان ألب أرسلان السلجوقي — صاحب مرو وبلخ ونيسابور وترمذ؛ كان جباراً عنيداً، قتله غلام له بالدامغان سنة تسعين وأربعمائة فتسلم ابن أخيه بركياروق خراسان بلا قتال {cite:shadharat-dhahab p. 394}."
  en: "Arslan Arghun b. Sultan Alp Arslan — holder of Marw, Balkh, Nishapur and Tirmidh; an overbearing stubborn man, killed by his own ghulam at Damghan in 490, leaving Khurasan to fall to his nephew Berkyaruq without a fight {cite:shadharat-dhahab p. 394}."
  es: "Arslan Arghun b. Sultan Alp Arslan — poseedor de Marw, Balkh, Nishapur y Tirmidh; un hombre prepotente y obstinado, asesinado por su propio ghulam en Damghan en 490, dejando que Khurasan cayera en manos de su sobrino Berkyaruq sin luchar {cite:shadharat-dhahab p. 394}."
  fr: "Arslan Arghun b. Sultan Alp Arslan — détenteur de Marw, Balkh, Nishapur et Tirmidh; un homme autoritaire et obstiné, tué par son propre ghulam à Damghan en 490, laissant le Khorasan tomber aux mains de son neveu Berkyaruq sans combat {cite:shadharat-dhahab p. 394}."
  ur: "ارسلان ارغون بی۔ سلطان الپ ارسلان - مروہ، بلخ، نیشاپور اور ترمذ کا حامل؛ ایک دبنگ ضدی آدمی، 490 میں دمغان کے مقام پر اپنے ہی غلام کے ہاتھوں مارا گیا، خراسان چھوڑ کر اپنے بھتیجے برکیاروق کے پاس بغیر کسی لڑائی کے جا پڑا۔ 394}۔"
