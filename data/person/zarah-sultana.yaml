summary:
  ar: "زارا سلطانة (وُلدت في 31 تشرين الأول 1993 في برمنغهام)، سياسية بريطانية من أسرة ميربورية باكستانية الأصل. انتُخبت نائبة عن جنوب كوفنتري عن حزب العمال سنة 2019، وسُحب منها سوط الحزب في تموز 2024، ثم استقالت من العمال في تموز 2025 وشاركت جيرمي كوربين في تأسيس حزب «حزبكم» (Your Party)."
  en: "Zarah Sultana (born 31 October 1993 in Birmingham) is a British politician from a British Mirpuri family of Pakistani origin. Elected Labour MP for Coventry South in 2019, she had the party whip suspended in July 2024, resigned from Labour in July 2025 and co-founded Your Party with Jeremy Corbyn."
  ur: "زارہ سلطانہ (پیدائش 31 اکتوبر 1993، برمنگھم) برطانوی سیاست دان ہیں جن کا تعلق پاکستانی نژاد میرپوری خاندان سے ہے۔ وہ 2019 میں لیبر پارٹی سے کووینٹری ساؤتھ کی رکنِ پارلیمان منتخب ہوئیں، جولائی 2024 میں پارٹی وہپ معطل ہوا، اور جولائی 2025 میں انہوں نے لیبر چھوڑ کر جیریمی کوربن کے ساتھ نئی جماعت «یور پارٹی» کی بنیاد رکھی۔"

