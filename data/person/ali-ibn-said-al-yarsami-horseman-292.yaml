label:
  ar: "علي بن سعيد اليرسمي"
  en: "Ali ibn Sa'id al-Yarsami (horseman at Tihama)"
  ur: "علی بن سعید الیرسمی"
  es: "Ali ibn Sa'id al-Yarsami (horseman at Tihama)"
  fr: "Ali ibn Sa'id al-Yarsami (horseman at Tihama)"
summary:
  ar: "أحد الفرسان الذين ذكر الكتاب أنهم وقفوا مع الهادي في معركة تهامة بعد انكسار ميسرته، وهو «علي بن سعيد اليرسمي» في ص296."
  en: "One of the horsemen the book says stood with al-Hadi in the Tihama fight after his left wing broke, named \"Ali ibn Sa'id al-Yarsami\" on p. 296."
  ur: "ان سواروں میں سے ایک جنہیں کتاب کے مطابق تہامہ کی لڑائی میں بائیں بازو ٹوٹنے کے بعد ہادی کے ساتھ کھڑا بتایا گیا، ص296 پر «علی بن سعید الیرسمی» کے نام سے۔"
  es: "Uno de los jinetes que, según el libro, luchó junto a al-Hadi en la batalla de Tihama después de que su flanco izquierdo se rompiera, se llama \"Ali ibn Sa'id al-Yarsami\" y aparece en la página 296."
  fr: "L'un des cavaliers qui, selon le livre, est resté avec al-Hadi lors du combat de Tihama après que son aile gauche ait été brisée, nommé « Ali ibn Sa'id al-Yarsami » à la page 296."
  tr: "Kitapta Tihama Savaşı'nda el-Hadi'nin sol elinin kırıldıktan sonra yanında durduğu belirtilen şövalyelerden biri, 'Ali bin Sa'id al-Yarsami' (s. 296) şeklindedir."
  id: "Salah satu ksatria yang disebutkan dalam buku itu berdiri bersama al-Hadi dalam Pertempuran Tihama setelah tangan kirinya patah, adalah 'Ali bin Sa'id al-Yarsami' pada hlm. 296."
