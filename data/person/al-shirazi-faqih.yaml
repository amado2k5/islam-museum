  ur: "ابراہیم بن علی الشیرازی \"ابو اسحاق\" (1003-1083)، شافعی فقیہ اور بغداد نظامیہ کے سربراہ، المحدث کے مصنف۔"
  tr: "İbrahim ibn Ali el-Şirazi el-Fayruzabadi, Ebu İshaq, kendi döneminde bir Şafii hukukçu ve ulusun müftüsüydü. Bağdat'taki Nizamiyye'de eğitim gördü; 476 Hicri yılında (1083 M.S.) öldü."
  id: "Ibrahim ibn Ali al-Shirazi al-Fayruzabadi, Abu Ishaq, adalah seorang ahli hukum dan mufti Shafi'i bangsa pada masanya. Ia belajar di Nizamiyya di Baghdad; meninggal pada tahun 476 H (1083 M)."
