summary:
  ar: "إبراهيم بن علي الشيرازي الفيروزآبادي، أبو إسحاق، فقيه الشافعية ومفتي الأمة في عصره، درّس بالنظامية ببغداد؛ توفي سنة 476هـ ⁦(1083م)⁩."
  en: "Ibrahim ibn Ali al-Shirazi “Abu Ishaq” (1003–1083), Shafi'i jurist and chief of the Baghdad Nizamiyya, author of al-Muhadhdhab."
  fr: "Ibrahim ibn Ali al-Shirazi \"Abu Ishaq\" (1003-1083), juriste chaféite et chef de la Nizamiyya de Bagdad, auteur d'al-Muhadhdhab."
