summary:
  ar: "عبد المجيد الثاني، آخر خلفاء آل عثمان؛ كان بعد إلغاء السلطنة خليفةً بلا سلطان دنيوي، وكان جماهير إستانبول تهرع لإلقاء نظرة عليه وتحيته كل جمعة في طريقه للصلاة، وكان مدركاً مكانة منصبه وعراقة سلالته فكان مرة يرتدي عمامة محمد الفاتح وثانية يتقلد سيف السلطان سليمان القانوني، فمنعه مصطفى كمال من الخروج للصلاة وخفض تخصيصاته للنصف، ثم أجيز قرار إلغاء الخلافة في ٣ آذار ١٩٢٤م ونُفي الخليفة في اليوم التالي {cite:dawlat-uthmaniyya-salabi p. 472}."
  en: "Abdülmecid II — the last Ottoman caliph, who wore Mehmed the Conqueror's turban and Sulayman's sword to the Friday crowds until Mustafa Kemal barred him, halved his stipend and had the caliphate abolished and him exiled in March 1924 {cite:dawlat-uthmaniyya-salabi p. 472}."
