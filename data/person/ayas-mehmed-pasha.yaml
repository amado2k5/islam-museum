summary:
  ar: "أياس باشا، ويُعرف أيضاً بأياس محمد باشا، ألباني من منطقة هيمارا جُنّد بنظام الدفشرمة، وصار آغا الإنكشارية وبيلربك الأناضول ووالي دمشق، ثم الصدر الأعظم للسلطان سليمان القانوني من 1536م إلى وفاته سنة 946هـ ⁦(1539م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-829}."
  en: "Ayas Pasha, also known as Ayas Mehmed Pasha, an Albanian from the Himara region who was recruited through the devshirme and rose to agha of the Janissaries, beglerbeg of Anatolia and governor of Damascus. He served as grand vizier of Suleyman I from 1536 until his death in 946 AH (1539) {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-829}."
  es: "Ayas Pasha, también conocido como Ayas Mehmed Pasha, un albanés de la región de Himara que fue reclutado a través del devshirme y ascendió a agha de los jenízaros, beglerbeg de Anatolia y gobernador de Damasco. Sirvió como gran visir de Solimán I desde 1536 hasta su muerte en 946 AH (1539) {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-829}."
  fr: "Ayas Pacha, également connu sous le nom d'Ayas Mehmed Pacha, était un Albanais originaire de la région d'Himara. Recruté par le biais du devchirmé, il gravit les échelons jusqu'à devenir agha des janissaires, beglerbeg d'Anatolie et gouverneur de Damas. Il occupa la fonction de grand vizir de Soliman le Magnifique de 1536 jusqu'à sa mort en 946 AH (1539) {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-829}."
