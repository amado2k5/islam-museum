summary:
  ar: "أياس باشا، ويُعرف أيضاً بأياس محمد باشا، ألباني من منطقة هيمارا جُنّد بنظام الدفشرمة، وصار آغا الإنكشارية وبيلربك الأناضول ووالي دمشق، ثم الصدر الأعظم للسلطان سليمان القانوني من 1536م إلى وفاته سنة 946هـ (1539م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-829}."
  en: "Ayas Pasha, also known as Ayas Mehmed Pasha, an Albanian from the Himara region who was recruited through the devshirme and rose to agha of the Janissaries, beglerbeg of Anatolia and governor of Damascus. He served as grand vizier of Suleyman I from 1536 until his death in 946 AH (1539) {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-829}."
