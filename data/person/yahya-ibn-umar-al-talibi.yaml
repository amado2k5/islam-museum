class: person
label: { ar: "يحيى بن عمر الطالبي", en: "Yahya ibn 'Umar al-Talibi", es: "Yahya ibn 'Umar al-Talibi", fr: "Yahya ibn 'Umar al-Talibi", ur: "یحییٰ بن عمر الطالبی" }
summary:
  ar: "أبو الحسين يحيى بن عمر بن يحيى بن الحسين بن عبد الله بن إسماعيل بن عبد الله بن جعفر الطيار، ظهر بالكوفة سنة ثمان وأربعين ومائتين وقيل خمسين لذل نزل به وجفوة لحقته من المتوكل والأتراك، واستفتح أموره بالكف عن الدماء والتورع عن أموال الناس وأظهر العدل والإنصاف، فقتل وحمل رأسه إلى بغداد وصلب فضج الناس لما في نفوسهم من محبته، وكان ديناً كثير المعروف على العوام باراً بالخواص مثقل الظهر بالطالبيات لم تظهر له زلة ولا خزية {cite:muruj-al-dhahab p. 530-532}."
  en: "The Ja'farid who rose at Kufa in 248 — just, bloodless, beloved — killed, his head gibbeted at Baghdad to universal mourning {cite:muruj-al-dhahab p. 530-532}."
  es: "El Ja'farid que se alzó en Kufa en 248 —justo, incruento, amado— fue asesinado, su cabeza exhibida en Bagdad en medio de un luto universal {cite:muruj-al-dhahab p. 530-532}."
  fr: "Le Ja'faride qui s'est soulevé à Kufa en 248 — juste, sans effusion de sang, aimé — tué, sa tête exposée à Bagdad sous le deuil universel {cite:muruj-al-dhahab p. 530-532}."
  ur: "جعفری جو 248 میں کوفہ میں طلوع ہوا - عادل، بے خون، محبوب - مارا گیا، عالمگیر سوگ کے لیے بغداد میں اس کا سر پیٹا گیا۔ 530-532}۔"
  tr: "Ebu el-Hüseyin Yahya ibn Ömer ibn Yahya ibn el-Hüseyin ibn Abdullah ibn İsmayıl ibn Abdullah ibn Ca'fer el-Tayyar, 248 Hicri yılında, bazılarına göre elli yılında, al-Mutawakkil ve Türkler tarafından başına gelen aşağılanma ve aşağılanma nedeniyle Kufa'da ortaya çıktı. İşlerini kan dökmekten ve halkın servetinden kaçınarak açtı, adalet ve hakkaniyet gösterdi. Öldürüldü, başı Bağdat'a götürüldü, çarmıha gerildi ve insanlar ona olan sevgilerine öfkelendi. O, dindar bir adamdı, halk arasında tanınan, seçkinlere itaatkar ve Talbiyyat kabilelerinde ağır bir sırt sahibiydi, asla sapma veya utanç göstermedi {cite:muruj-al-dhahab, s. 530-532}."
  id: "Abu al-Husayn Yahya ibn Umar ibn Yahya ibn al-Husayn ibn Abdullah ibn Isma'il ibn Abdullah ibn Ja'far al-Tayyar muncul di Kufa pada tahun 248 H, atau beberapa orang mengatakan lima puluh, karena penghinaan dan penghinaan yang menimpanya dari al-Mutawakkil dan Turki. Dia membuka urusannya dengan menahan diri dari pertumpahan darah dan kekayaan rakyat, serta menunjukkan keadilan dan keadilan. Dia dibunuh, kepalanya dibawa ke Baghdad, disalib, dan orang-orang marah karena cinta mereka kepadanya. Dia adalah orang yang taat, terkenal di kalangan rakyat biasa, taat kepada elit, dan seorang yang bermasalah di suku Talbiyyat, tidak pernah menunjukkan kesalahan atau aib {cite:muruj-al-dhahab, hlm. 530-532}."
