summary:
  ar: "أبو الحسين يحيى بن عمر بن يحيى بن الحسين بن عبد الله بن إسماعيل بن عبد الله بن جعفر الطيار، ظهر بالكوفة سنة ثمان وأربعين ومائتين وقيل خمسين لذل نزل به وجفوة لحقته من المتوكل والأتراك، واستفتح أموره بالكف عن الدماء والتورع عن أموال الناس وأظهر العدل والإنصاف، فقتل وحمل رأسه إلى بغداد وصلب فضج الناس لما في نفوسهم من محبته، وكان ديناً كثير المعروف على العوام باراً بالخواص مثقل الظهر بالطالبيات لم تظهر له زلة ولا خزية {cite:muruj-al-dhahab p. 530-532}."
  en: "The Ja'farid who rose at Kufa in 248 — just, bloodless, beloved — killed, his head gibbeted at Baghdad to universal mourning {cite:muruj-al-dhahab p. 530-532}."
