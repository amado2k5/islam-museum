class: person
label: { ar: "عماد الدين النيهي", en: "Imad al-Din al-Nayhi", fr: "Imad al-Din al-Nayhi", es: "Imad al-Din al-Nayhi", ur: "عماد الدین النہی" }
names:
  - { value: "عماد الدين أبو محمد عبد الرحمن بن عبد الله بن عبد الرحمن بن زيد النيهي الشافعي", kind: full }
summary:
  ar: "عماد الدين أبو محمد عبد الرحمن بن عبد الله النيهي الشافعي نسبة إلى نيه بلد صغيرة بين سجستان وإسفرايين؛ قال ابن السمعاني في الأنساب كان إماماً فاضلاً عالماً عاملاً حافظاً للذهب راغباً في الحديث ونشره ديناً مباركاً كثير الصلاة والعبادة حسن الأخلاق، تفقه على البغوي وتخرج عليه جماعة كثيرة من العلماء وحضر ابن السمعاني مجالس إماليه بمرو، وكان شيخ الشافعية بتلك الديار وله كتاب في المذهب وقف عليه ابن الصلاح وانتخب منه غرائب؛ توفي في شعبان سنة ثمان وأربعين وخمسمائة {cite:shadharat-dhahab p. 628-629}."
  en: "Imad al-Din Abu Muhammad Abd al-Rahman ibn Abdallah al-Nayhi the Shafi'i — nisba to Nih, a small town between Sijistan and Isfarayin; Ibn al-Sam'ani in the Ansab calls him a virtuous working imam, memorizer of the gold [i.e. the choicest texts], eager for hadith and its spread, devout, of fine character; he read fiqh under al-Baghawi and many scholars graduated on him — Ibn al-Sam'ani attended his dictation sessions at Marw; shaykh of the Shafi'is of those lands with a book on the madhhab from which Ibn al-Salah culled rarities; d. Sha'ban 548 {cite:shadharat-dhahab p. 628-629}."
  fr: "Imad al-Din Abu Muhammad Abd al-Rahman ibn Abdallah al-Nayhi le Shafi'i - nisba à Nih, une petite ville entre Sijistan et Isfarayin ; Ibn al-Sam'ani dans l'Ansab le qualifie d'imam vertueux, mémorisant l'or [c'est-à-dire les textes les plus choisis], avide de hadith et de sa propagation, pieux, de bon caractère ; Il a lu le fiqh sous al-Baghawi et de nombreux savants ont obtenu leur diplôme sur lui - Ibn al-Sam'ani a assisté à ses séances de dictée à Marw ; Cheikh des Shafi'is de ces terres avec un livre sur le madhhab à partir duquel Ibn al-Salah a abattu des raretés ; d. chaabane 548 {cite:shadharat-dhahab p. 628-629}."
  es: "Imad al-Din Abu Muhammad Abd al-Rahman ibn Abdallah al-Nayhi, el shafi'í, nació en Nih, un pequeño pueblo entre Sijistan e Isfarayin; Ibn al-Sam'ani, en el Ansab, lo describe como un imán trabajador y virtuoso, memorizador de los textos más selectos, ávido de hadices y su difusión, devoto y de excelente carácter; estudió fiqh con al-Baghawi y muchos eruditos se graduaron gracias a él; Ibn al-Sam'ani asistió a sus sesiones de dictado en Marw; fue shaykh de los shafi'ís de esas tierras y autor de un libro sobre la escuela jurídica del cual Ibn al-Salah extrajo rarezas; falleció en Sha'ban 548 {cita: shadharat-dhahab págs. 628-629}."
  ur: "عمادالدین ابو محمد عبدالرحمٰن بن عبداللہ النہی شافعی - نسبہ تا نیح، سجستان اور اسفارین کے درمیان ایک چھوٹا سا شہر؛ ابن سمعانی نے انساب میں انہیں ایک نیک کام کرنے والا امام، سونے کا حافظ، حدیث اور اس کے پھیلاؤ کا شوقین، متقی، عمدہ کردار کا حامل قرار دیا ہے۔ اس نے البغوی کے ماتحت فقہ پڑھا اور بہت سے علماء نے اس پر گریجویشن کیا - ابن السمانی مرو میں ان کے ڈکٹیشن سیشنز میں شرکت کرتا تھا۔ ان سرزمین کے شافعیوں کے شیخ کے پاس ایک کتاب ہے جس سے ابن الصلاح نے نایاب باتیں نکالی ہیں۔ d شعبان 548۔ 628-629}۔"
