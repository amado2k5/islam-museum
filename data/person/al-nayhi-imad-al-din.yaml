label: { ar: "عماد الدين النيهي", en: "Imad al-Din al-Nayhi" }
names:
  - { value: "عماد الدين أبو محمد عبد الرحمن بن عبد الله بن عبد الرحمن بن زيد النيهي الشافعي", kind: full }
summary:
  ar: "عماد الدين أبو محمد عبد الرحمن بن عبد الله النيهي الشافعي نسبة إلى نيه بلد صغيرة بين سجستان وإسفرايين؛ قال ابن السمعاني في الأنساب كان إماماً فاضلاً عالماً عاملاً حافظاً للذهب راغباً في الحديث ونشره ديناً مباركاً كثير الصلاة والعبادة حسن الأخلاق، تفقه على البغوي وتخرج عليه جماعة كثيرة من العلماء وحضر ابن السمعاني مجالس إماليه بمرو، وكان شيخ الشافعية بتلك الديار وله كتاب في المذهب وقف عليه ابن الصلاح وانتخب منه غرائب؛ توفي في شعبان سنة ثمان وأربعين وخمسمائة {cite:shadharat-dhahab p. 628-629}."
  en: "Imad al-Din Abu Muhammad Abd al-Rahman ibn Abdallah al-Nayhi the Shafi'i — nisba to Nih, a small town between Sijistan and Isfarayin; Ibn al-Sam'ani in the Ansab calls him a virtuous working imam, memorizer of the gold [i.e. the choicest texts], eager for hadith and its spread, devout, of fine character; he read fiqh under al-Baghawi and many scholars graduated on him — Ibn al-Sam'ani attended his dictation sessions at Marw; shaykh of the Shafi'is of those lands with a book on the madhhab from which Ibn al-Salah culled rarities; d. Sha'ban 548 {cite:shadharat-dhahab p. 628-629}."
