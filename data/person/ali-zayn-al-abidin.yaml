education:
  did_you_know:
    ar: "علي زين العابدين ابن الحسين المعروف بالسجاد؛ بقاه أهل المدينة يوم الحرة فبايعهم على أنهم عبيد ليزيد وأتاه لاذاً بالقبر يدعو."
    en: "Ali Zayn al-Abidin, son of al-Husayn, called al-Sajjad — when Medina's people were spared at al-Harra he pledged them as Yazid's bondsmen, and they found him clinging to the grave in prayer."
    ur: "علی زین العابدین، حسین کے بیٹے، سجاد کہلائے — حرہ کے واقعے میں مدینہ کے لوگوں کو بخشا گیا اور یزید کے غلام ہونے کی بیعت لی، اور اسے قبر سے لپٹے دعا کرتے پایا۔"
    sources: [source/muruj-al-dhahab, source/tarikh-ibn-khaldun-ibar]
