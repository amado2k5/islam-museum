label: { ar: "علي بن الحسين السجاد", en: "'Ali ibn al-Husayn, al-Sajjad" }
summary:
  ar: "علي بن الحسين بن علي بن أبي طالب، المعروف بزين العابدين والسجاد، ابن الحسين الذي بقي بعد كربلاء، وهو الإمام الرابع عند الشيعة الاثني عشرية بحسب دائرة المعارف الإسلامية. ولد في المدينة في سنة 38هـ/658م في أكثر المصادر وتوفي في سنة 94هـ أو 95هـ ودفن في البقيع، ويختلف الشيعة وغيرهم في أمه وفي سبب وفاته. وتنسب إليه الصحيفة السجادية ورسالة الحقوق."
  en: "Ali ibn al-Husayn ibn Ali ibn Abi Talib, known as Zayn al-Abidin and al-Sajjad, was the son of al-Husayn who survived Karbala, and the fourth Imam of the Twelver Shi'a according to the Encyclopaedia of Islam. Most sources place his birth in Medina in 38/658 and his death in 94 or 95 AH, with burial in al-Baqi, while accounts of his mother and of the cause of his death differ between Shi'i tradition and other reports. The prayer collection al-Sahifa al-sajjadiyya and the Risalat al-Huquq are attributed to him."
  ur: "علی بن الحسین بن علی بن ابی طالب، جو زین العابدین اور سجاد کے نام سے معروف ہیں، کربلا کے بعد باقی رہنے والے حسین کے بیٹے تھے، اور انسائیکلوپیڈیا آف اسلام کے مطابق اثنا عشری شیعہ کے چوتھے امام ہیں۔ زیادہ تر مصادر کے مطابق وہ 38ھ/658ء میں مدینہ میں پیدا ہوئے اور 94ھ یا 95ھ میں فوت ہوئے اور بقیع میں دفن ہوئے، جبکہ ان کی والدہ اور وجہ وفات کے بارے میں شیعہ روایت اور دوسری روایات مختلف ہیں۔ ان سے الصحیفہ السجادیہ اور رسالۃ الحقوق منسوب ہیں۔"
