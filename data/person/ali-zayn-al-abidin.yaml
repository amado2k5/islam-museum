label: { ar: "علي بن الحسين السجاد", en: "'Ali ibn al-Husayn, al-Sajjad" }
summary:
  ar: "علي بن الحسين بن علي بن أبي طالب المعروف بالسجاد، بقيته يوم الحرة بايع على أنهم عبيد ليزيد فنظر إليه أهل الجيش لاذاً بالقبر يدعو فأتى به إلى مسرف وهو مغتاظ فلما رآه ارتعد وقام له وأقعده إلى جانبه وقال سلني حوائجك فلم يسأله في أحد قدم إلى السيف إلا شفعه فيه، وقال مسرف ما كان ذلك الرأي مني لقد ملئ قلبي منه رعباً {cite:muruj-al-dhahab p. 68}."
  en: "al-Sajjad, al-Husayn's surviving son — spared the slave-bay'a at the Harra; Musrif who cursed his fathers rose trembling at his prayer, seated him beside himself, and confessed 'my heart was filled with dread of him' {cite:muruj-al-dhahab p. 68}."
