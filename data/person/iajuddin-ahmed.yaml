summary:
  ar: "عالم تربة ورجل دولة بنغلاديشي (1 فبراير 1931 – 10 ديسمبر 2012)، أستاذ في جامعة دكا ورئيس قسم علوم التربة فيها، تولى رئاسة بنغلاديش من 2002 إلى 2009، وجمع إليها منصب المستشار الرئيسي للحكومة المؤقتة في 2006–2007 حتى أُعلنت حالة الطوارئ المدعومة عسكريًا في 11 يناير 2007 فاستقال من المنصب الثاني وبقي رئيسًا حتى 2009."
  en: "Bangladeshi soil scientist and statesman (1 February 1931 – 10 December 2012), a professor and department chairman at the University of Dhaka who served as president of Bangladesh from 2002 to 2009 and, controversially, held the chief advisership of the caretaker government in 2006–07 as well, until the military-backed state of emergency of 11 January 2007 forced him to resign the second post while remaining president until 2009."
  ur: "بنگلہ دیشی ماہرِ ارضیات اور سیاست دان (1 فروری 1931ء – 10 دسمبر 2012ء)، ڈھاکہ یونیورسٹی کے پروفیسر اور شعبہ علومِ ارضی کے سربراہ، 2002ء سے 2009ء تک بنگلہ دیش کے صدر رہے اور 2006ء–2007ء میں نگراں حکومت کے چیف ایڈوائزر کا عہدہ بھی سنبھالا، حتیٰ کہ 11 جنوری 2007ء کی فوجی حمایت یافتہ ایمرجنسی کے بعد اس دوسرے عہدے سے مستعفی ہوئے۔"
