label: { ar: "أفلاطون", en: "Plato (Aflatun)", fr: "Platon (Aflatun)", es: "Plato (Aflatun)", ur: "افلاطون ⁦(افلاطون)⁩" }
summary:
  ar: "الحكيم اليوناني، عند المسعودي أن على مدقة باب مجمع الصابئة بحران مكتوب بالسريانية قوله من عرف ذاته تأله، وقوله الإنسان نبات سماوي شبيه شجرة منكوسة أصلها إلى السماء وفروعها في الأرض، ومن قوم زعموا أن النفس جوهر ليست بجسم حية عالمة مدبرة للأجسام وأن موتها انتقالها من جسد إلى جسد {cite:muruj-al-dhahab p. 542-547}. ومن كتاب فلوطرخس أفلاطون بن أرسطن ومعناه الفسيح وذكر ثاون أن أباه يقال له إسطون وأنه كان من أشراف اليونانيين وكان في قديم أمره يميل إلى الشعر فأخذ منه بحظ عظيم ثم حضر مجلس سقراط فرآه يذم الشعر فتركه ثم انتقل إلى قول فيثاغورس في الأشياء المعقولة وعاش فما يقال إحدى وثمانين سنة وعنه أخذ أرسطاليس وخلفه بعد موته، وقال إسحاق إنه أخذ عن بقراط وتوفى أفلاطون في السنة التي ولد فيها الإسكندر وهي السنة الثالثة عشر من ملك لاوخوس والملك في ذلك الوقت بمقدونية فيلبس أبو الإسكندر، ومن خط إسحاق عاش أفلاطون ثمانين سنة {cite:fihrist-ibn-al-nadim p. 343-344}"
  en: "The Greek sage — his dictum 'know thyself and become divine' stood in Syriac on the Sabians' assembly-house door at Harran; his inverted-tree image of man and his doctrine of the soul's passage between bodies are quoted at length {cite:muruj-al-dhahab p. 542-547}."
  fr: "Sage grec : sa maxime « Connais-toi toi-même et deviens divin » figurait en syriaque sur la porte du lieu d'assemblée des sabéens à Harran ; son image de l'homme comme arbre inversé et sa doctrine du passage de l'âme entre les corps sont longuement citées {cite:muruj-al-dhahab p. 542-547}."
  es: "El sabio griego —su máxima «conócete a ti mismo y conviértete en divino» estaba escrita en siríaco en la puerta de la casa de asambleas de los sabeos en Harrán; su imagen del hombre como un árbol invertido y su doctrina del paso del alma entre los cuerpos se citan extensamente {cite:muruj-al-dhahab p. 542-547}."
  ur: "یونانی بابا - اس کا قول 'خود کو جانو اور الہی بنو' سیریائی زبان میں حران میں صابیوں کے اسمبلی گھر کے دروازے پر کھڑا تھا۔ انسان کی اس کی الٹی درخت کی تصویر اور جسموں کے درمیان روح کے گزرنے کے بارے میں اس کا نظریہ لمبائی میں نقل کیا گیا ہے {حوالہ: مروج الذہاب صفحہ۔ 542-547}۔"
  tr: "El-Mas'udi'ye göre, Harran'daki Sabii meclisinin kapı tokmağında Süryanice yazılı olan Yunan bilgesinin şu sözü vardır: \"Kendini bilen Tanrı olur\" ve \"İnsan, kökleri göğe, dalları yere uzanan, ters dönmüş bir ağaç gibi göksel bir bitkidir.\" Ve ruhun bir madde olduğunu, beden olmadığını, yaşayan, bilen, bedenleri yöneten bir varlık olduğunu ve ölümünün bir bedenden diğerine geçiş olduğunu iddia eden bir topluluktan bahsediyoruz. {cite:muruj-al-dhahab s. 542-547} Plutark'ın kitabından, \"geniş olan\" anlamına gelen Ariston'un oğlu Platon ve Theon, babasının Eston adında bir Yunan soylusu olduğunu, gençliğinde şiire ilgi duyduğunu ve şiirle çok ilgilendiğini, daha sonra Sokrates'in konsiline katıldığını ve onun şiiri eleştirdiğini görünce şiiri bıraktığını, ardından Pisagor'un akılcı şeyler hakkındaki sözlerine yöneldiğini ve seksen bir yıl yaşadığı söylenir. Aristoteles ondan etkilenmiş ve ölümünden sonra onun yerini almıştır. İshak, Platon'un Hipokrat'tan etkilendiğini ve Platon'un İskender'in doğduğu yıl, yani Laochos'un hükümdarlığının on üçüncü yılında öldüğünü, o zamanlar Makedonya kralının İskender'in babası Filip olduğunu ve İshak'ın el yazısından Platon'un seksen yıl yaşadığını söyler. {cite:fihrist-ibn-al-nadim s. 343-344}"
  id: "Menurut Al-Mas’udi, filsuf Yunani itu, pada gagang pintu majelis Sabian di Harran, yang ditulis dalam bahasa Suryani, mengucapkan: “Barangsiapa yang mengenal dirinya sendiri, ia menjadi Tuhan,” dan ucapannya: “Manusia adalah tumbuhan surgawi, seperti pohon yang tumbang, akarnya ke langit dan cabangnya di bumi.” Dan dari kaum yang mengklaim bahwa jiwa adalah substansi, bukan tubuh, yang hidup, mengetahui, mengelola tubuh, dan bahwa kematiannya adalah transisinya dari satu tubuh ke tubuh lainnya. {cite:muruj-al-dhahab p. 542-547} Dari buku Plutarch, Plato, putra Ariston, yang berarti \"yang luas,\" dan Theon menyebutkan bahwa ayahnya bernama Eston dan bahwa ia adalah salah satu bangsawan Yunani dan bahwa di awal kehidupannya ia cenderung pada puisi dan mengambil bagian besar di dalamnya, kemudian ia menghadiri dewan Socrates dan melihatnya mengkritik puisi, sehingga ia meninggalkannya, kemudian ia beralih ke ucapan Pythagoras tentang hal-hal yang dapat dipahami, dan ia hidup, konon, delapan puluh satu tahun, dan darinya Aristoteles mengambil, dan ia menggantikannya setelah kematiannya, dan Isaac mengatakan bahwa ia mengambil dari Hippocrates, dan Plato meninggal pada tahun kelahiran Alexander, yang merupakan tahun ketiga belas pemerintahan Laochos, dan raja pada waktu itu di Makedonia adalah Philip, ayah Alexander, dan dari tulisan tangan Isaac, Plato hidup delapan puluh tahun {cite:fihrist-ibn-al-nadim p. 343-344}"
