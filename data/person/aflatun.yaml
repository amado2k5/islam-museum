education:
  did_you_know:
    ar: "أفلاطون عند المسعودي أن على باب مجمع الصابئة بحران مكتوب قوله «من عرف ذاته تألّه»، وأن الإنسان نبات سماوي شبيه شجرة منكوسة أصلها إلى السماء وفروعها في الأرض."
    en: "Al-Mas'udi's Plato: on the gate of the Sabians' assembly at Harran is inscribed 'whoever knows himself is deified' — and man 'a heavenly plant like an upturned tree, rooted in the sky, branches in earth'."
    ur: "مسعودی کے افلاطون: حران میں صابئین کی مجلس کے دروازے پر «جس نے خود کو پہچانا وہ معبود بن گیا» کندہ ہے — اور انسان «آسمانی پودا ہے جیسے الٹی شجر، جڑ آسمان اور شاخیں زمین میں»۔"
    sources: [source/muruj-al-dhahab, source/encyclopaedia-of-islam-2]
