summary:
  ar: "الحكيم اليوناني، عند المسعودي أن على مدقة باب مجمع الصابئة بحران مكتوب بالسريانية قوله من عرف ذاته تأله، وقوله الإنسان نبات سماوي شبيه شجرة منكوسة أصلها إلى السماء وفروعها في الأرض، ومن قوم زعموا أن النفس جوهر ليست بجسم حية عالمة مدبرة للأجسام وأن موتها انتقالها من جسد إلى جسد {cite:muruj-al-dhahab p. 542-547}."
  en: "The Greek sage — his dictum 'know thyself and become divine' stood in Syriac on the Sabians' assembly-house door at Harran; his inverted-tree image of man and his doctrine of the soul's passage between bodies are quoted at length {cite:muruj-al-dhahab p. 542-547}."
