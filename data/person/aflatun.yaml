label: { ar: "أفلاطون", en: "Plato (Aflatun)" }
summary:
  ar: "الحكيم اليوناني، عند المسعودي أن على مدقة باب مجمع الصابئة بحران مكتوب بالسريانية قوله من عرف ذاته تأله، وقوله الإنسان نبات سماوي شبيه شجرة منكوسة أصلها إلى السماء وفروعها في الأرض، ومن قوم زعموا أن النفس جوهر ليست بجسم حية عالمة مدبرة للأجسام وأن موتها انتقالها من جسد إلى جسد {cite:muruj-al-dhahab p. 542-547}. ومن كتاب فلوطرخس أفلاطون بن أرسطن ومعناه الفسيح وذكر ثاون أن أباه يقال له إسطون وأنه كان من أشراف اليونانيين وكان في قديم أمره يميل إلى الشعر فأخذ منه بحظ عظيم ثم حضر مجلس سقراط فرآه يذم الشعر فتركه ثم انتقل إلى قول فيثاغورس في الأشياء المعقولة وعاش فما يقال إحدى وثمانين سنة وعنه أخذ أرسطاليس وخلفه بعد موته، وقال إسحاق إنه أخذ عن بقراط وتوفى أفلاطون في السنة التي ولد فيها الإسكندر وهي السنة الثالثة عشر من ملك لاوخوس والملك في ذلك الوقت بمقدونية فيلبس أبو الإسكندر، ومن خط إسحاق عاش أفلاطون ثمانين سنة {cite:fihrist-ibn-al-nadim p. 343-344}"
  en: "The Greek sage — his dictum 'know thyself and become divine' stood in Syriac on the Sabians' assembly-house door at Harran; his inverted-tree image of man and his doctrine of the soul's passage between bodies are quoted at length {cite:muruj-al-dhahab p. 542-547}."
