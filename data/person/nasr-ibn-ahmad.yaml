label: { ar: "نصر بن أحمد الساماني", en: "Nasr ibn Ahmad", es: "Nasr ibn Ahmad", fr: "Nasr ibn Ahmad", ur: "نصر بن احمد" }
summary:
  ar: "صاحب ما وراء نهر بلخ، توفي سنة تسع وثمانين ومائتين في أيام المعتضد فصار الأمر إلى أخيه إسماعيل بن أحمد {cite:muruj-al-dhahab p. 631-632}. وعند ابن النديم حبس الحسين بن علي المروزي داعي الإسماعيلية فمات في حبسه ثم استغواه النسفي وأدخله في الدعوة وأغرمه دية المروزي مائة وتسعة عشر ألف دينار ثم ندم وأظهر ذلك ومات {cite:fihrist-ibn-al-nadim p. 266} وعند ابن الجوزي ورد كتابه في أول محرم سنة اثنتين وثلاثمائة أنه واقع عمه إسحاق بن إسماعيل فأخذه أسيرًا فخُلع على رسوله وحُملت إليه الخلع لولاية خراسان {cite:muntazam-ibn-al-jawzi p. 415}."
  en: "The Samanid amir of Transoxiana, succeeded at his death in 289 by his brother Isma'il {cite:muruj-al-dhahab p. 631-632}."
  es: "El emir samaní de Transoxiana fue sucedido a su muerte en 289 por su hermano Isma'il {cite:muruj-al-dhahab p. 631-632}."
  fr: "L'émir samanide de Transoxiane, remplacé à sa mort en 289 par son frère Ismaïl {cite:muruj-al-dhahab p. 631-632}."
  ur: "Transoxiana کا سامانی امیر، 289 میں اس کے بھائی اسماعیل کے ذریعہ اس کی موت پر کامیاب ہوا۔ 631-632}۔"
  tr: "Transoksiana Balkh'ın sahibi, 289 Hicri yılında, el-Mu'tadid döneminde öldü, bu yüzden konu kardeşi İsmail bin Ahmed'e geçti {alıntı:] Muruj-al-Dhahab s. 631-632}. İbn al-Nadim'e göre, İsmaililerin vaizi al-Hüseyin bin Ali el-Mervazi hapsedilmiş ve onun gözetiminde ölmüştür. Sonra el-Nasafi ondan yardım istemiş ve onu misyona almış, yüz on dokuz bin dinar ceza kesmiş, sonra pişman olup bunu açıklayıp ölmüştür {atıf:Fihrist-ibn-al-Nadim s. 266}. İbn al-Jawzi'ye göre, 302 Hicri yılında Muharrem'in ilk Muharrem üzerine yazdığı kitabında, amcası İshaq bin İsmail'i kuşattığı, onu esir aldığı, elçisini görevden aldığı ve Horasan valisi olarak görevden alınmasını taşıdığı belirtilir {atıf:Muntazam-ibn-al-jawzi s. 415}."
  id: "Pemilik Transoxiana Balkh meninggal pada tahun 289 H pada masa al-Mu'tadid, sehingga urusan ini diserahkan kepada saudaranya Ismail ibn Ahmad {cite:Muruj-al-Dhahab hlm. 631-632}. Menurut Ibn al-Nadim, al-Husayn ibn Ali al-Marwazi, pengkhotbah Ismaili, dipenjara dan meninggal dalam tahanannya. Kemudian al-Nasafi meminta bantuannya dan membawanya ke dalam misi, mendendanya seratus sembilan belas ribu dinar, kemudian menyesali dan mengungkapkannya dan meninggal {cite:fihrist-ibn-al-nadim hlm. 266}. Menurut Ibn al-Jawzi, bukunya tentang tanggal satu Muharram tahun 302 H menyebutkan bahwa ia mengepung pamannya Ishaq ibn Isma'il, menangkapnya, memberhentikan utusannya, dan membawa pencopotan untuknya sebagai gubernur Khorasan {cite:Muntazam-ibn-al-jawzi hlm. 415}."
