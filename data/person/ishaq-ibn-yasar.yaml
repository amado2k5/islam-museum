summary:
  ar: "إسحاق بن يسار، والد محمد بن إسحاق صاحب السيرة، وابن يسار الذي كان من سبي عين التمر من موالي قيس بن مخرمة؛ يدل عليه نسب ابنه «محمد بن إسحاق بن يسار» في «ميزان الاعتدال»، وقول البلاذري إن يسار جدّ محمد بن إسحاق {cite:mizan-itidal-bijawi-v3 p. 468}{cite:futuh-buldan-maarif-1407 p. 345}."
  en: "Ishaq ibn Yasar, father of Muhammad ibn Ishaq the author of the Sira, and son of the Yasar who was among the captives of Ayn al-Tamr and a client of Qays ibn Makhrama. The link rests on the son's lineage 'Muhammad ibn Ishaq ibn Yasar' in Mizan al-I'tidal and on al-Baladhuri's statement that Yasar was Muhammad ibn Ishaq's grandfather."
  es: "Ishaq ibn Yasar, padre de Muhammad ibn Ishaq, autor de la Sira, e hijo de Yasar, quien estuvo entre los cautivos de Ayn al-Tamr y fue cliente de Qays ibn Makhrama. El vínculo se basa en el linaje del hijo, «Muhammad ibn Ishaq ibn Yasar», mencionado en Mizan al-I'tidal, y en la afirmación de al-Baladhuri de que Yasar era el abuelo de Muhammad ibn Ishaq."
  fr: "Ishaq ibn Yasar, père de Muhammad ibn Ishaq, auteur de la Sira, était le fils de Yasar, qui figurait parmi les captifs d'Ayn al-Tamr et était un client de Qays ibn Makhrama. Ce lien repose sur la généalogie de son fils, « Muhammad ibn Ishaq ibn Yasar », mentionnée dans Mizan al-I'tidal, et sur l'affirmation d'al-Baladhuri selon laquelle Yasar était le grand-père de Muhammad ibn Ishaq."
  ur: "اسحاق بن یسار، سیرت کے مصنف محمد بن اسحاق کے والد اور یسار کے بیٹے جو عین التمر کے اسیروں میں سے تھے اور قیس بن مخرمہ کے مؤکل تھے۔ اس کا تعلق میزان الاعتدال میں بیٹے کے نسب 'محمد ابن اسحاق ابن یسار' اور البلادھوری کے اس بیان پر ہے کہ یسار محمد ابن اسحاق کے دادا تھے۔"
