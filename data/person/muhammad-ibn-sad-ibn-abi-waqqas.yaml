label:
  ar: "محمد بن سعد بن أبي وقاص"
  en: "Muhammad ibn Sa'd ibn Abi Waqqas"
  es: "Muhammad ibn Sa'd ibn Abi Waqqas"
  fr: "Muhammad ibn Sa'd ibn Abi Waqqas"
  ur: "محمد بن سعد ابن ابی وقاص"
roles: [muhaddith]
gender: male
summary:
  ar: "محمد بن سعد بن أبي وقاص، أبو القاسم القرشي الزهري المدني، الإمام الثقة عند الذهبي، قام على الحجاج مع ابن الأشعث فأسر يوم دير الجماجم فقتله الحجاج سنة ٨٢هـ."
  en: "Muhammad ibn Sa'd ibn Abi Waqqas, Abu al-Qasim al-Qurashi al-Zuhri of Medina, called the reliable imam by al-Dhahabi; he rose with Ibn al-Ash'ath against al-Hajjaj, was captured at Dayr al-Jamajim and killed by al-Hajjaj in 82 AH."
  es: "Muhammad ibn Sa'd ibn Abi Waqqas, Abu al-Qasim al-Qurashi al-Zuhri de Medina, llamado el imán confiable por al-Dhahabi; se alzó con Ibn al-Ash'ath contra al-Hajjaj, fue capturado en Dayr al-Jamajim y asesinado por al-Hajjaj en el año 82 AH."
  fr: "Muhammad ibn Sa'd ibn Abi Waqqas, Abu al-Qasim al-Qurashi al-Zuhri de Médine, appelé l'imam fiable par al-Dhahabi; il se releva avec Ibn al-Ash'ath contre al-Hajjaj, fut capturé à Dayr al-Jamajim et tué par al-Hajjaj en 82 AH."
  ur: "محمد بن سعد ابن ابی وقاص، مدینہ کے ابو القاسم القرشی الزہری، جسے الذہبی نے معتبر امام کہا ہے۔ وہ ابن الاشعث کے ساتھ الحجاج کے خلاف اٹھ کھڑا ہوا، دیرالجمجم میں پکڑا گیا اور 82 ہجری میں الحجاج کے ہاتھوں قتل ہوا۔"
  tr: "Muhammed bin Said bin Ebi Vaqqas, Ebu el-Kasım el-Kuraşi el-Zuhri el-Medeni, el-Dahabi'ye göre güvenilir imam, İbn Eşat ile birlikte el-Hacac'a karşı durdu, Deyr el-Cemecim gününde onu yakaladı ve el-Hacc onu 82 Hicri yılında öldürdü."
  id: "Muhammad ibn Sa'd ibn Abi Waqqas, Abu al-Qasim al-Qurashi al-Zuhri al-Madani, imam yang dapat dipercaya menurut al-Dhahabi, melawan al-Hajjaj bersama Ibn al-Ash'ath, menangkapnya pada hari Deir al-Jamajim, dan al-Hajjaj membunuhnya pada tahun 82 H."
