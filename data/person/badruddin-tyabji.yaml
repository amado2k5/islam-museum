summary:
  ar: "محامٍ وناشط وسياسي هندي (1844-1906) من بومباي، أول هندي يمارس المحاماة أمام محكمة بومباي العليا. كان من مؤسسي المؤتمر الوطني الهندي ورئيسه الثالث (1887-1888) وأول رئيس مسلم له، وأسّس أنجمن إسلام في بومباي سنة 1874، ثم صار قاضيا في محكمة بومباي العليا سنة 1895، أولَ مسلم وثالثَ هندي يتولى هذا المنصب، وعمل لدعم تعليم النساء."
  en: "Indian lawyer, activist and politician (1844–1906) of Bombay, the first Indian to practise as a barrister of the Bombay High Court. He was a founding member of the Indian National Congress, its third President (1887–1888) and its first Muslim president; he founded the Anjuman-i-Islam in Bombay in 1874, became a judge of the Bombay High Court in 1895 — the first Muslim and third Indian so elevated — and worked for women's education."
  ur: "ہندوستانی وکیل، کارکن اور سیاست دان (1844ء–1906ء) جن کا تعلق بمبئی سے تھا؛ بمبئی ہائی کورٹ میں بیرسٹر کی حیثیت سے پریکٹس کرنے والے پہلے ہندوستانی۔ وہ انڈین نیشنل کانگریس کے بانی اراکین میں سے تھے، اس کے تیسرے صدر (1887ء–1888ء) اور پہلے مسلم صدر بنے، 1874ء میں بمبئی میں انجمن اسلام قائم کی، اور 1895ء میں بمبئی ہائی کورٹ کے جج بنے۔"
