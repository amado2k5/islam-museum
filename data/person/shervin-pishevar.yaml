summary:
  ar: "شروين كرداري بيشيفار (وُلد 24 مارس 1974 في طهران) رائد أعمال ومستثمر أمريكي من أصل إيراني، شارك في تأسيس شركة شيربا كابيتال للاستثمار المغامر وهايبرلوب ون، وكان من أوائل المستثمرين في أوبر وإير بي إن بي، وعمل مديرًا إداريًا في مينلو فنتشرز، ونال وسام الشرف لجزيرة إليس سنة 2016."
  en: "Shervin Kordary Pishevar (born 24 March 1974 in Tehran) is an Iranian-American entrepreneur, venture capitalist and philanthropist, co-founder and managing director of Sherpa Capital and co-founder of Hyperloop One; as an angel investor he seeded more than 60 companies and led Menlo Ventures' investments in Uber, Tumblr and Warby Parker, and he received the Ellis Island Medal of Honor in 2016."
  ur: "شروین کرداری پیشے ور (پیدائش 24 مارچ 1974ء، تہران) ایرانی نژاد امریکی کارجو، وینچر سرمایہ کار اور مخیر ہیں، شیرپا کیپیٹل اور ہائپرلوپ ون کے شریک بانی ہیں؛ فرشتہ سرمایہ کار کی حیثیت سے انہوں نے 60 سے زائد کمپنیوں میں ابتدائی سرمایہ لگایا اور مینلو وینچرز میں اوبر، ٹمبلر اور واربی پارکر کی سرمایہ کاریوں کی قیادت کی، اور 2016ء میں ایلس آئی لینڈ میڈل آف آنر حاصل کیا۔"
