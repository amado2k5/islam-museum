summary:
  ar: "محمد بن أحمد بن إبراهيم أبو الفرج المقري المعروف بغلام الشنبوذي، ولد سنة ثلاثمائة، وقرأ على أبي الحسن بن شنبوذ وكتب في القراءات. قال أبو الفضل عبيد الله بن أحمد الصيرفي عظم أمره ووصف علمه بالقراءات وحفظه للتفسير وسمعته يقول حفظت خمسين ألف بيت من الشعر شواهد للقرآن. وأساء الدارقطني القول فيه والثناء عليه. توفي في صفر سنة ثمان وثمانين وقيل سنة سبع وثمانين {cite:muntazam-ibn-al-jawzi j.7 p.207-208}."
