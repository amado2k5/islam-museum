id: person/al-shanbudhi
class: person
label: { ar: "أبو الفرج محمد بن أحمد الشنبوذي المقري", en: "Abu al-Faraj Muhammad ibn Ahmad al-Shanbudhi al-Muqri'" }
summary:
  ar: "محمد بن أحمد بن إبراهيم أبو الفرج المقري المعروف بغلام الشنبوذي، ولد سنة ثلاثمائة، وقرأ على أبي الحسن بن شنبوذ وكتب في القراءات. قال أبو الفضل عبيد الله بن أحمد الصيرفي عظم أمره ووصف علمه بالقراءات وحفظه للتفسير وسمعته يقول حفظت خمسين ألف بيت من الشعر شواهد للقرآن. وأساء الدارقطني القول فيه والثناء عليه. توفي في صفر سنة ثمان وثمانين وقيل سنة سبع وثمانين {cite:muntazam-ibn-al-jawzi j.7 p.207-208}."
  en: "Muhammad ibn Ahmad ibn Ibrahim, Abu al-Faraj the reciter, known as Ghulam al-Shanbudhi, born in 300. He read under Abu al-Hasan Ibn Shanbudh and wrote on the readings. Abu al-Fadl Ubayd Allah ibn Ahmad al-Sayrafi said his standing was great and described his command of the readings and his memory for tafsir; he said, 'I heard him say, I memorised fifty thousand lines of verse as evidence for the Qur'an.' Al-Daraqutni spoke of him both harshly and in praise. He died in Safar 388, though some say 387 {cite:muntazam-ibn-al-jawzi j.7 p.207-208}."
