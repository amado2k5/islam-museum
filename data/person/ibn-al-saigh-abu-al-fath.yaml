summary:
  ar: "الإمام أبو الفتح ابن الصائغ أحمد بن أبي الوفاء البغدادي الفقيه الحنبلي نزيل حران؛ ولد ببغداد سنة ثمان وأربعمائة ولزم أبا الخطاب الكلوذاني وخدمه وتفقه عليه وسمع منه ومن ابن بيان وسافر إلى حلب وسكنها ثم استوطن حران إلى حين وفاته وكان هو المفتي والمدرس بها وقرأ عليه الفقه جماعة منهم الشيخ فخر الدين بن تيمية وسمع منه جماعة منهم ابن عبدوس والعماد المقدسي وأبو الحسن بن القطيعي وروى عنه في تاريخه؛ ترجمته في أخبار سنة خمس وسبعين وخمسمائة {cite:shadharat-dhahab p. 729}."
  en: "Imam Abu al-Fath Ibn al-Sa'igh Ahmad ibn Abi al-Wafa' of Baghdad, the Hanbali resident of Harran; b. 508, he served Abu al-Khattab al-Kalwadhani and took fiqh from him, settled at Harran as its mufti and mudarris — among his pupils Fakhr al-Din ibn Taymiyya and Ibn Abdus; his notice falls in year 575 {cite:shadharat-dhahab p. 729}."
