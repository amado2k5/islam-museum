id: person/ibn-al-saigh-abu-al-fath
class: person
label: { ar: "أبو الفتح ابن الصائغ الحراني" }
names:
  - { value: "أحمد بن أبي الوفاء عبد الله بن عبد الرحمن بن عبد الصمد بن محمد بن الصائغ البغدادي أبو الفتح نزيل حران", kind: full }
summary:
  ar: "الإمام أبو الفتح ابن الصائغ أحمد بن أبي الوفاء البغدادي الفقيه الحنبلي نزيل حران؛ ولد ببغداد سنة ثمان وأربعمائة ولزم أبا الخطاب الكلوذاني وخدمه وتفقه عليه وسمع منه ومن ابن بيان وسافر إلى حلب وسكنها ثم استوطن حران إلى حين وفاته وكان هو المفتي والمدرس بها وقرأ عليه الفقه جماعة منهم الشيخ فخر الدين بن تيمية وسمع منه جماعة منهم ابن عبدوس والعماد المقدسي وأبو الحسن بن القطيعي وروى عنه في تاريخه؛ ترجمته في أخبار سنة خمس وسبعين وخمسمائة {cite:shadharat-dhahab p. 729}."
  en: "Imam Abu al-Fath Ibn al-Sa'igh Ahmad ibn Abi al-Wafa' of Baghdad, the Hanbali resident of Harran; b. 508, he served Abu al-Khattab al-Kalwadhani and took fiqh from him, settled at Harran as its mufti and mudarris — among his pupils Fakhr al-Din ibn Taymiyya and Ibn Abdus; his notice falls in year 575 {cite:shadharat-dhahab p. 729}."
  es: "el Imam Abu al-Fath Ibn al-Sa'igh Ahmad ibn Abi al-Wafa' de Bagdad, el residente hanbali de Harran; b. 508, sirvió a Abu al-Khattab al-Kalwadhani y le quitó el fiqh, se estableció en Harran como su mufti y mudarris, entre sus alumnos Fakhr al-Din ibn Taymiyya e Ibn Abdus; su noticia cae en el año 575 {cita: shadharat-dhahab p. 729}."
  fr: "l'imam Abu al-Fath Ibn al-Sa'igh Ahmad ibn Abi al-Wafa' de Bagdad, résident hanbalite d'Harran; b. 508, il servit Abu al-Khattab al-Kalwadhani et lui prit le fiqh, s'installa à Harran comme mufti et mudarris — parmi ses élèves Fakhr al-Din ibn Taymiyya et Ibn Abdus; son avis tombe en l'an 575 {cite: shadharat-dhahab p. 729}."
  ur: "امام ابو الفتح ابن الصائغ احمد بن ابی الوفا بغداد، حنبلی باشندہ حران؛ ب 508، اس نے ابو الخطاب الکوادنی کی خدمت کی اور ان سے فقہ حاصل کیا، حران میں اس کے مفتی اور مدثر کی حیثیت سے سکونت اختیار کی - ان کے شاگردوں میں فخر الدین ابن تیمیہ اور ابن عبدوس؛ اس کا نوٹس 575 میں آتا ہے۔ 729}۔"
  tr: "İmam Ebu el-Feth ibn el-Sa'igh Ahmed bin Ebi el-Vafa el-Bağdadi, Hanbali hukukçusu, Harran'da ikamet eden; dört yüz seksen sekizde Bağdat'ta doğdu, Ebu el-Hattab el-Kaludhani'ye eşlik etti, ona hizmet etti, onun yanında hukuk okudu ve ondan ve İbn Bayan'dan dinledi. Halep'e seyahat etti ve orada yerleşti, ardından Harran'da ölümüne kadar yerleşti. Orada müftü ve öğretmendi. Şeyh Fakhr al-Din ibn Teymiye de dahil olmak üzere bir grup onun yanında fıkıh çalıştı. Onun diğer üyeleri, İbn Abdus, el-İmad el-Makdisi ve Ebu el-Hasan bin el-Kutui'i de dahil olmak üzere, tarihinde ondan aktarılmıştır; biyografisi 575 Hicri yılının haberlerinde yer almıştır {atıf: şadharat-dhahab, s. 729}."
  id: "Imam Abu al-Fath ibn al-Sa'igh Ahmad ibn Abi al-Wafa al-Baghdadi, ahli hukum Hanbali, yang tinggal di Harran; lahir di Baghdad pada tahun empat ratus delapan puluh delapan, menemani Abu al-Khattab al-Kaludhani, melayaninya, belajar hukum di bawah bimbingannya, dan mendengar kabar darinya dan Ibn Bayan. Ia pergi ke Aleppo dan menetap di sana, lalu menetap di Harran hingga wafat. Ia menjadi mufti dan guru di sana. Sekelompok orang belajar fiksi di bawah bimbingannya, termasuk Sheikh Fakhr al-Din ibn Taymiyyah. Yang lain darinya, termasuk Ibn Abdus, al-Imad al-Maqdisi, dan Abu al-Hasan ibn al-Qutai'i, menceritakan dari dirinya dalam sejarahnya; biografinya dalam berita tahun 575 H {cite:shadharat-dhahab, hlm. 729}."
