summary:
  ar: "راغورام غوفند راجان (وُلد في 3 فبراير 1963) اقتصادي هندي، شغل منصب كبير اقتصاديي صندوق النقد الدولي (2003–2006) والمستشار الاقتصادي الأول لحكومة الهند (2012–2013) والمحافظ الثالث والعشرين لبنك الاحتياطي الهندي (2013–2016)، وهو أستاذ التمويل في كلية بوث لإدارة الأعمال بجامعة شيكاغو. اشتهر بتحذيره المبكر سنة 2005 من مخاطر النظام المالي، وبكتابيه «إنقاذ الرأسمالية من الرأسماليين» و«خطوط الصدع» الحائز جائزة فايننشال تايمز وغولدمان ساكس لكتاب العام في الأعمال."
  en: "Raghuram Govind Rajan (born 3 February 1963) is an Indian economist who served as chief economist of the International Monetary Fund (2003–2006), chief economic adviser to the Government of India (2012–2013) and the 23rd governor of the Reserve Bank of India (2013–2016), and is a professor of finance at the University of Chicago Booth School of Business. He is known for his 2005 warning of emerging risks in the financial system, three years before the 2008 crisis, and for the books Saving Capitalism from the Capitalists and Fault Lines."
  ur: "رگھورام گووند راجن (پیدائش 3 فروری 1963ء) ایک بھارتی ماہر اقتصادیات ہیں جو بین الاقوامی مالیاتی فنڈ کے چیف اکانومسٹ (2003ء–2006ء)، حکومت ہند کے چیف اکنامک ایڈوائزر (2012ء–2013ء) اور بھارتی ریزرو بینک کے 23ویں گورنر (2013ء–2016ء) رہے، اور شکاگو یونیورسٹی کے بوتھ اسکول آف بزنس میں مالیات کے پروفیسر ہیں۔ وہ 2005ء میں مالیاتی نظام کے خطرات پر اپنی ابتدائی وارننگ، اور اپنی کتابوں ”سیونگ کیپٹلزم فرام دی کیپٹلسٹس“ اور ”فالٹ لائنز“ کی وجہ سے جانے جاتے ہیں۔"
