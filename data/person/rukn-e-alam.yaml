summary:
  ar: "بطاقة أولية لشيخ ركن الدين أبو الفتح، ولي ملتان السهروردي في القرن الرابع عشر، توفي سنة ١٣٣٥م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Shaykh Rukn al-Din Abu'l-Fath, the fourteenth-century Suhrawardi saint of Multan, d. 1335; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Shaykh Rukn al-Din Abu'l-Fath, santo suhrawardí del siglo XIV de Multan, fallecido en 1335; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet pour le cheikh Rukn al-Din Abu'l-Fath, saint suhrawardien du XIVe siècle de Multan, mort en 1335; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "ملتان کے چودھویں صدی کے سہروردی ولی شیخ رکن الدین ابوالفتح کے لیے کارڈ کا مسودہ، د. 1335; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "On dördüncü yüzyılda el-Suhrawardi tarafından Multan valisi olarak atanan Şeyh Rukn al-Din Abu al-Fath'ın ön kartı. 1335 yılında öldü; önemli şahsiyetlerin sözlüklerinde adı geçti ve biyografisi henüz sayfada incelenmedi."
  id: "Kartu pendahuluan Sheikh Rukn al-Din Abu al-Fath, yang diangkat sebagai gubernur Multan oleh al-Suhrawardi pada abad keempat belas. Ia meninggal pada tahun 1335 M; ia disebutkan dalam kamus tokoh-tokoh terkenal, dan biografinya belum pernah ditinjau di halaman tersebut."
