summary:
  ar: "أبو علي الحسن بن القاسم الطبري، من مصنفي أصحاب الشافعي، علّق عن أبي علي ابن أبي هريرة، والتعليقة المنسوبة إلى أبي علي هي هذه التعليقة {cite:tabaqat-fuqaha-abbas-1981 p. 60}. مات سنة خمسين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 60}. صنّف «المحرر» في النظر، وهو أول كتاب صُنّف في الخلاف المجرد، وصنّف «الإفصاح» في المذهب، وأصول الفقه، والجدل، ودرّس ببغداد بعد أستاذه أبي علي ابن أبي هريرة {cite:tabaqat-fuqaha-abbas-1981 p. 60}. حاشية الكتاب تذكر أن السبكي يسميه «الحسين» {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  en: "Abu Ali al-Hasan ibn al-Qasim al-Tabari, one of the writers among al-Shafi'i's companions, who recorded glosses from Abu Ali Ibn Abi Hurayra; the gloss attributed to Abu Ali is this gloss {cite:tabaqat-fuqaha-abbas-1981 p. 60}. He died in 350 {cite:tabaqat-fuqaha-abbas-1981 p. 60}. He wrote al-Muharrar on disputation, the first book composed on disagreement in the abstract (al-khilaf al-mujarrad), and he wrote al-Ifsah on the school, on the roots of jurisprudence and on dialectic; he taught in Baghdad after his teacher Abu Ali Ibn Abi Hurayra {cite:tabaqat-fuqaha-abbas-1981 p. 60}. The book's editorial note says that al-Subki calls him «al-Husayn» {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
