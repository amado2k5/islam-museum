summary:
  ar: "أبو علي الحسن بن القاسم الطبري، من مصنفي أصحاب الشافعي، علّق عن أبي علي ابن أبي هريرة، والتعليقة المنسوبة إلى أبي علي هي هذه التعليقة {cite:tabaqat-fuqaha-abbas-1981 p. 60}. مات سنة خمسين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 60}. صنّف «المحرر» في النظر، وهو أول كتاب صُنّف في الخلاف المجرد، وصنّف «الإفصاح» في المذهب، وأصول الفقه، والجدل، ودرّس ببغداد بعد أستاذه أبي علي ابن أبي هريرة {cite:tabaqat-fuqaha-abbas-1981 p. 60}. حاشية الكتاب تذكر أن السبكي يسميه «الحسين» {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  en: "Abu Ali al-Hasan ibn al-Qasim al-Tabari, one of the writers among al-Shafi'i's companions, who recorded glosses from Abu Ali Ibn Abi Hurayra; the gloss attributed to Abu Ali is this gloss {cite:tabaqat-fuqaha-abbas-1981 p. 60}. He died in 350 {cite:tabaqat-fuqaha-abbas-1981 p. 60}. He wrote al-Muharrar on disputation, the first book composed on disagreement in the abstract (al-khilaf al-mujarrad), and he wrote al-Ifsah on the school, on the roots of jurisprudence and on dialectic; he taught in Baghdad after his teacher Abu Ali Ibn Abi Hurayra {cite:tabaqat-fuqaha-abbas-1981 p. 60}. The book's editorial note says that al-Subki calls him «al-Husayn» {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  fr: "Abu Ali al-Hasan ibn al-Qasim al-Tabari, l'un des auteurs parmi les compagnons d'al-Shafi'i, qui consigna des gloses d'Abu Ali Ibn Abi Hurayra ; la glose attribuée à Abu Ali est cette glose {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Il mourut en 350 {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Il écrivit al-Muharrar sur la controverse, le premier livre composé sur la divergence pure (al-khilaf al-mujarrad), et al-Ifsah sur l'école, sur les fondements du droit et sur la dialectique ; il enseigna à Bagdad après son maître Abu Ali Ibn Abi Hurayra {cite:tabaqat-fuqaha-abbas-1981 p. 60}. La note de l'éditeur du livre dit qu'al-Subki l'appelle «al-Husayn» {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  es: "Abu Ali al-Hasan ibn al-Qasim al-Tabari, uno de los escritores entre los compañeros de al-Shafi'i, que registró glosas de Abu Ali Ibn Abi Hurayra; la glosa atribuida a Abu Ali es esta glosa {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Murió en 350 {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Escribió al-Muharrar sobre la disputa, el primer libro compuesto sobre el desacuerdo en abstracto (al-khilaf al-mujarrad), y escribió al-Ifsah sobre la escuela, sobre las raíces de la jurisprudencia y sobre la dialéctica; enseñó en Bagdad después de su maestro Abu Ali Ibn Abi Hurayra {cite:tabaqat-fuqaha-abbas-1981 p. 60}. La nota editorial del libro dice que al-Subki lo llama «al-Husayn» {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  ur: "ابو علی الحسن بن القاسم الطبری، الشافعی کے اصحاب میں سے ایک مصنف، جنہوں نے ابو علی ابن ابی ہریرہ سے تالیفات ریکارڈ کیں۔ ابو علی کی طرف منسوب چمک یہ ہے {حوالہ:طبقات-فقہ-عباس-1981 صفحہ۔ 60}۔ ان کی وفات 350ھ میں ہوئی۔ 60}۔ اس نے اختلاف پر المحرر لکھی، جو پہلی کتاب ہے جو خلاصہ میں اختلاف پر لکھی گئی تھی ⁦(الخلاف المجرد)⁩، اور اس نے مکتب، فقہ کی جڑوں اور جدلیات پر الفصاح لکھی۔ اس نے اپنے استاد ابو علی ابن ابی ہریرہ کے بعد بغداد میں پڑھایا۔ 60}۔ کتاب کے ادارتی نوٹ میں کہا گیا ہے کہ السبکی اسے \"الحسین\" کہتے ہیں 60}۔"
  tr: "Şafiî mezhebinin yazarlarından Ebu Ali el-Hasan ibn el-Kâsım el-Taberi, Ebu Ali ibn Ebu Hurayra'nın eserleri üzerine tefsir yazmıştır. Ebu Ali'ye atfedilen tefsir şudur: {cite:tabaqat-fuqaha-abbas-1981 s. 60}. Hicri 350 yılında vefat etmiştir. {cite:tabaqat-fuqaha-abbas-1981 s. 60}. Saf ihtilaf üzerine yazılmış ilk kitap olan \"el-Muharrar\"ı ve ayrıca mezhep, fıkıh ilkeleri ve diyalektik üzerine \"el-İfsa\"yı yazmıştır. Hocası Ebu Ali ibn Ebu Hurayra'dan sonra Bağdat'ta öğretim üyesi olarak çalışmıştır. {cite:tabaqat-fuqaha-abbas-1981 s. 60} Kitabın kenar notunda el-Subki'nin ona \"el-Hüseyin\" diye hitap ettiğinden bahsediliyor {cite:tabaqat-fuqaha-abbas-1981 s. 60}."
  id: "Abu Ali al-Hasan ibn al-Qasim al-Tabari, salah satu penulis mazhab Syafi'i, menulis komentar atas karya-karya Abu Ali ibn Abi Hurayrah. Komentar yang dinisbahkan kepada Abu Ali adalah yang ini {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Beliau wafat pada tahun 350 H {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Beliau menulis \"al-Muharrar\" tentang dialektika, yang merupakan buku pertama yang ditulis tentang perbedaan pendapat murni, dan beliau juga menulis \"al-Ifsah\" tentang mazhab pemikiran, prinsip-prinsip fiqih, dan dialektika. Beliau mengajar di Baghdad setelah gurunya, Abu Ali ibn Abi Hurayrah {cite:tabaqat-fuqaha-abbas-1981 p. 60}. Catatan pinggir buku menyebutkan bahwa al-Subki memanggilnya \"al-Husayn\" {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
