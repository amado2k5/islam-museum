summary:
  ar: "رجل دين ومفسّر قرآن وخطيب إيراني، وُلد في خوانسار سنة 1944 ودرس في حوزتي طهران وقم، ترجم القرآن ونهج البلاغة والصحيفة السجادية ومفاتيح الجنان وشرح دعاء كميل، وأسّس مركز دار العرفان العلمي في قم سنة 1998؛ بلغت صفحته الرسمية على إنستغرام 853,136 متابعًا في نوفمبر 2026 بحسب قراءة على المنصة نفسها."
  en: "Iranian cleric, Qur'an commentator and preacher, born in Khansar in 1944 and educated at the Tehran and Qom seminaries; he translated the Qur'an, Nahj al-Balagha, the Sahifa al-Sajjadiyya and Mafatih al-Jinan, commented on the Kumayl supplication, and founded the Dar al-Erfan Scientific Research Center in Qom in 1998. His official Instagram page counted 853,136 followers in November 2026 per an on-platform profile read."
  ur: "ایرانی عالم، مفسر قرآن و خطیب، جو 1944ء میں خوانسار میں پیدا ہوئے اور تہران و قم کے حوزوں میں پڑھے؛ انھوں نے قرآن، نہج البلاغہ، صحیفہ سجادیہ اور مفاتیح الجنان کا ترجمہ کیا، دعائے کمیل کی شرح لکھی، اور 1998ء میں قم میں دار العرفان علمی مرکز قائم کیا؛ نومبر 2026ء میں پلیٹ فارم پر پڑھے گئے اعداد کے مطابق ان کے سرکاری انسٹاگرام صفحے کے فالوور 853,136 تھے۔"
