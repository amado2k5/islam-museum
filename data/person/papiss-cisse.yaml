summary:
  ar: "لاعب كرة قدم سنغالي معتزل، وُلد في داكار بالسنغال سنة 1985. مهاجم سجل 22 هدفًا مع فرايبورغ في موسم 2010–11 بالدوري الألماني — رقمًا قياسيًا آنذاك للاعب أفريقي في موسم واحد — ثم لعب لنيوكاسل يونايتد وشاندونغ لونينغ وفنربخشة وغيرها، وخاض 36 مباراة وسجل 17 هدفًا مع منتخب السنغال. مسلم ممارس معروف بأداء السجود عند الاحتفال بالأهداف."
  en: "Senegalese retired footballer, born in Dakar, Senegal in 1985. A forward who scored 22 goals for SC Freiburg in the 2010–11 Bundesliga — then a single-season record for an African player — before spells at Newcastle United, Shandong Luneng, Fenerbahçe and other clubs; he won 36 caps and scored 17 goals for Senegal. A practising Muslim, he is known for performing the sujud when celebrating goals."
  ur: "سینیگالی ریٹائرڈ فٹبالر، 1985 میں سینیگال کے ڈاکار میں پیدا ہوئے۔ فارورڈ جنہوں نے 2010–11 بنڈس لیگا میں ایس سی فرائیبرگ کے لیے 22 گول کیے — اس وقت کسی افریقی کھلاڑی کا ایک سیزن کا ریکارڈ — پھر نیو کیسل یونائیٹڈ، شانڈونگ لونینگ اور فنربخشے سمیت کئی کلبوں کے لیے کھیلے؛ سینیگال کے لیے 36 میچوں میں 17 گول کیے۔ باعمل مسلمان ہیں اور گول کے جشن میں سجدہ کرنے کے لیے معروف ہیں۔"
