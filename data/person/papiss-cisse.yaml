summary:
  ar: "لاعب كرة قدم سنغالي معتزل، وُلد في داكار بالسنغال سنة 1985. مهاجم سجل 22 هدفًا مع فرايبورغ في موسم 2010–11 بالدوري الألماني — رقمًا قياسيًا آنذاك للاعب أفريقي في موسم واحد — ثم لعب لنيوكاسل يونايتد وشاندونغ لونينغ وفنربخشة وغيرها، وخاض 36 مباراة وسجل 17 هدفًا مع منتخب السنغال. مسلم ممارس معروف بأداء السجود عند الاحتفال بالأهداف."
  en: "Senegalese retired footballer, born in Dakar, Senegal in 1985. A forward who scored 22 goals for SC Freiburg in the 2010–11 Bundesliga — then a single-season record for an African player — before spells at Newcastle United, Shandong Luneng, Fenerbahçe and other clubs; he won 36 caps and scored 17 goals for Senegal. A practising Muslim, he is known for performing the sujud when celebrating goals."
  ur: "سینیگالی ریٹائرڈ فٹبالر، 1985 میں سینیگال کے ڈاکار میں پیدا ہوئے۔ فارورڈ جنہوں نے 2010–11 بنڈس لیگا میں ایس سی فرائیبرگ کے لیے 22 گول کیے — اس وقت کسی افریقی کھلاڑی کا ایک سیزن کا ریکارڈ — پھر نیو کیسل یونائیٹڈ، شانڈونگ لونینگ اور فنربخشے سمیت کئی کلبوں کے لیے کھیلے؛ سینیگال کے لیے 36 میچوں میں 17 گول کیے۔ باعمل مسلمان ہیں اور گول کے جشن میں سجدہ کرنے کے لیے معروف ہیں۔"
  es: "Futbolista senegalés retirado, nacido en Dakar, Senegal, en 1985. Delantero que marcó 22 goles para el SC Freiburg en la Bundesliga 2010-11 —un récord en una sola temporada para un jugador africano en aquel entonces— antes de jugar en el Newcastle United, Shandong Luneng, Fenerbahçe y otros clubes; disputó 36 partidos internacionales y marcó 17 goles con la selección de Senegal. Musulmán practicante, es conocido por realizar la postración (sujud) al celebrar sus goles."
  fr: "Ancien footballeur sénégalais, né à Dakar en 1985. Attaquant, il a inscrit 22 buts pour le SC Fribourg lors de la Bundesliga 2010-2011 – un record à l'époque pour un joueur africain – avant de jouer pour Newcastle United, Shandong Luneng, Fenerbahçe et d'autres clubs. Il compte 36 sélections et 17 buts en équipe nationale du Sénégal. Musulman pratiquant, il est connu pour sa prosternation (sujud) lorsqu'il célèbre ses buts."
  tr: "1985 yılında Dakar, Senegal'de doğmuş emekli Senegalli futbolcu. 2010–11 Bundesliga sezonunda Freiburg formasıyla 22 gol atan forvet — o dönemde bir Afrikalı oyuncu için bir sezonda rekor — ardından Newcastle United, Shandong Luning, Fenerbahçe ve diğerlerinde oynadı, Senegal milli takımı için 36 maçta oynadı ve 17 gol attı. Gol kutlarken secde etmesiyle tanınan aktif bir Müslüman."
  id: "Seorang mantan pemain sepak bola Senegal, lahir di Dakar, Senegal pada tahun 1985. Seorang penyerang yang mencetak 22 gol bersama Freiburg pada musim Bundesliga 2010–11 — rekor saat itu untuk pemain Afrika dalam satu musim — kemudian bermain untuk Newcastle United, Shandong Luning, Fenerbahçe, dan lainnya, bermain dalam 36 pertandingan dan mencetak 17 gol untuk tim nasional Senegal. Seorang Muslim yang taat dan dikenal suka bersujud saat merayakan gol."
