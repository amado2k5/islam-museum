id: person/abu-hamid-al-isfarayini
class: person
label: { ar: "أبو حامد الإسفراييني أحمد بن محمد" }
summary:
  ar: "أحمد بن أبي طاهر محمد بن أحمد الإسفراييني، فقيه شيخ العراق وإمام الشافعية، إليه انتهت رياسة المذهب؛ قدم بغداد صبياً فتفقه على ابن المرزبان وأبي القاسم الداركي، وتعليقته في نحو خمسين مجلداً وكان يحضر درسه سبعمائة فقيه، وقالوا لو رآه الشافعي لفرح به؛ ولد سنة أربع وأربعين وثلاثمائة وأفتى وهو ابن سبع عشرة سنة {cite:shadharat-dhahab p. 178-179}. وعند ابن الجوزي كان مجلس تدريسه في مسجد عبد الله بن المبارك في صدر قطيعة الربيع، وقال فيه أبو الحسين القدوري: «ما رأيت في الشافعيين أفقه من أبي حامد»، وقال الصيمري: «هو أنظر من رأيت من الفقهاء»، وكانت وفاته ليلة السبت لأحد عشر ليلة بقيت من شوال سنة ست وأربعمائة، وصلى عليه أبو عبد الله بن المهتدي خطيب جامع المنصور في الصحراء بمشهد عظيم حافل {cite:muntazam-ibn-al-jawzi j.7 p.277-278}."
  en: "Ahmad b. Muhammad al-Isfarayini, 'Abu Hamid' — the Shafi'i imam of Iraq to whom the school's headship came; his ta'liqa ran to some fifty volumes and seven hundred jurists attended his lessons. Born 344, he gave fatwas at seventeen and died in Shawwal 406 {cite:shadharat-dhahab p. 178-179}."
died: { edtf: "1016-03-24~", hijri: "0406-10-19", calendar: julian, precision: day, status: tradition, derived: true, note: "ليلة السبت لأحد عشر ليلة بقيت من شوال سنة 406هـ ودُفن بداره ثم نُقل سنة 416 إلى باب حرب {cite:muntazam-ibn-al-jawzi j.7 p.277; shadharat-dhahab p. 179}." }
