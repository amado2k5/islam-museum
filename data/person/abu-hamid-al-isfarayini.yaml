label: { ar: "أبو حامد الإسفراييني أحمد بن محمد" }
summary:
  ar: "أحمد بن أبي طاهر محمد بن أحمد الإسفراييني، فقيه شيخ العراق وإمام الشافعية، إليه انتهت رياسة المذهب؛ قدم بغداد صبياً فتفقه على ابن المرزبان وأبي القاسم الداركي، وتعليقته في نحو خمسين مجلداً وكان يحضر درسه سبعمائة فقيه، وقالوا لو رآه الشافعي لفرح به؛ ولد سنة أربع وأربعين وثلاثمائة وأفتى وهو ابن سبع عشرة سنة {cite:shadharat-dhahab p. 178-179}."
  en: "Ahmad b. Muhammad al-Isfarayini, 'Abu Hamid' — the Shafi'i imam of Iraq to whom the school's headship came; his ta'liqa ran to some fifty volumes and seven hundred jurists attended his lessons. Born 344, he gave fatwas at seventeen and died in Shawwal 406 {cite:shadharat-dhahab p. 178-179}."
