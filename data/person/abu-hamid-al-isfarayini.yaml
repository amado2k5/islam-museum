id: person/abu-hamid-al-isfarayini
class: person
label: { ar: "أبو حامد الإسفراييني أحمد بن محمد", en: "Abu Hamid al-Isfarayini, Ahmad ibn Muhammad" , ur: "ابو حامد احمد بن محمد اسفرائینی", fr: "Abu Hamid al-Isfarayini, Ahmad ibn Muhammad", es: "Abu Hamid al-Isfarayini, Ahmad ibn Muhammad" }
summary:
  ar: "أحمد بن أبي طاهر محمد بن أحمد الإسفراييني، فقيه شيخ العراق وإمام الشافعية، إليه انتهت رياسة المذهب؛ قدم بغداد صبياً فتفقه على ابن المرزبان وأبي القاسم الداركي، وتعليقته في نحو خمسين مجلداً وكان يحضر درسه سبعمائة فقيه، وقالوا لو رآه الشافعي لفرح به؛ ولد سنة أربع وأربعين وثلاثمائة وأفتى وهو ابن سبع عشرة سنة {cite:shadharat-dhahab p. 178-179}. وعند ابن الجوزي كان مجلس تدريسه في مسجد عبد الله بن المبارك في صدر قطيعة الربيع، وقال فيه أبو الحسين القدوري: «ما رأيت في الشافعيين أفقه من أبي حامد»، وقال الصيمري: «هو أنظر من رأيت من الفقهاء»، وكانت وفاته ليلة السبت لأحد عشر ليلة بقيت من شوال سنة ست وأربعمائة، وصلى عليه أبو عبد الله بن المهتدي خطيب جامع المنصور في الصحراء بمشهد عظيم حافل {cite:muntazam-ibn-al-jawzi j.7 p.277-278}."
  en: "Ahmad b. Muhammad al-Isfarayini, 'Abu Hamid' — the Shafi'i imam of Iraq to whom the school's headship came; his ta'liqa ran to some fifty volumes and seven hundred jurists attended his lessons. Born 344, he gave fatwas at seventeen and died in Shawwal 406 {cite:shadharat-dhahab p. 178-179}."
  ur: "عراق کے شافعی امام تھے۔ ان کی فقہی تعلیقات اور درس کی بڑی مجلس کا ذکر موجودہ سوانح اور اس کے مآخذ میں ملتا ہے۔ {cite:shadharat-dhahab}"
  fr: "Ahmad b. Muhammad al-Isfarayini, « Abu Hamid » — l'imam shafiite d'Irak à qui échut la direction de l'école ; sa ta'liqa atteignait une cinquantaine de volumes et sept cents juristes assistaient à ses leçons. Né en 344, il rendit des fatwas à dix-sept ans et mourut en Shawwal 406 {cite:shadharat-dhahab p. 178-179}."
  es: "Ahmad b. Muhammad al-Isfarayini, «Abu Hamid», fue el imán shafi'í de Irak a quien recayó la dirección de la escuela; su ta'liqa constaba de unos cincuenta volúmenes y setecientos juristas asistieron a sus clases. Nació en 344, emitió fatuas a los diecisiete años y murió en Shawwal de 406 {cita: shadharat-dhahab págs. 178-179}."
  tr: "Irak şeyhi ve Şafiî mezhebinin imamı olan, mezhebin liderliğini üstlenen Ahmed ibn Ebi Tahir Muhammed ibn Ahmed el-İsfarayeni; çocukken Bağdat'a gelmiş ve İbn el-Merzuban ile Ebu el-Kasım el-Daraki'den fıkıh eğitimi almıştır. Tefsiri yaklaşık elli cilttir ve yedi yüz fıkıhçı onun derslerine katılırdı. Şafiî'nin onu görmüş olsaydı, ondan memnun kalacağı söylenirdi. 344 yılında doğmuş ve on yedi yaşında fetvalar vermiştir. {Kaynak: Şadharat-Dhaba s. 178-179}. İbn el-Cevzi'nin dersleri ise Kati'at el-Rabi'nin başlangıcında Abdullah ibn el-Mübarek mescidinde verilmiştir. Ebu el-Hüseyn el-Kuduri onun hakkında şöyle demiştir: “Şafiîler arasında Ebu Hamid’den daha bilgili birini görmedim.” El-Saymari ise şöyle demiştir: “Gördüğüm en basiretli fıkıhçıdır.” Dört yüz altı yılında, Şevval ayının on birinci gecesi, Cumartesi gecesi vefat etmiştir. Çöldeki el-Mansur Camii vaizi Ebu Abdullah ibn el-Muhtadi, büyük ve kalabalık bir cemaatle onun için dua etmiştir. {cite:muntazam-ibn-al-jawzi j.7 p.277-278}"
  id: "Ahmad ibn Abi Tahir Muhammad ibn Ahmad al-Isfarayini, seorang ahli hukum, syekh Irak dan imam mazhab Syafi'i, yang kepemimpinan mazhab tersebut berakhir padanya; ia datang ke Baghdad sebagai seorang anak laki-laki dan belajar fiqih di bawah Ibn al-Marzuban dan Abu al-Qasim al-Daraki, dan tafsirnya berjumlah sekitar lima puluh jilid, dan tujuh ratus ahli hukum biasa menghadiri pelajarannya, dan mereka mengatakan bahwa jika al-Syafi'i melihatnya, beliau akan senang dengannya; ia lahir pada tahun 344 dan mengeluarkan fatwa ketika berusia tujuh belas tahun {kutip:shadharat-dhahab hlm. 178-179}. Dan sesi pengajaran Ibn al-Jawzi berlangsung di masjid Abdullah ibn al-Mubarak pada awal Qati'at al-Rabi'. Abu al-Husayn al-Quduri berkata tentangnya: “Aku belum pernah melihat di antara para pengikut mazhab Syafi’i seorang pun yang lebih berilmu daripada Abu Hamid.” Al-Saymari berkata: “Dia adalah ahli fiqih yang paling berwawasan yang pernah kulihat.” Beliau wafat pada Sabtu malam, malam kesebelas bulan Syawal tahun 406. Abu Abdullah ibn al-Muhtadi, mubaligh Masjid al-Mansur di padang pasir, mendoakannya dalam suasana yang ramai dan meriah. {cite:muntazam-ibn-al-jawzi j.7 p.277-278}."
died: { edtf: "1016-03-24~", hijri: "0406-10-19", calendar: julian, precision: day, status: tradition, derived: true, note: "ليلة السبت لأحد عشر ليلة بقيت من شوال سنة 406هـ ودُفن بداره ثم نُقل سنة 416 إلى باب حرب {cite:muntazam-ibn-al-jawzi j.7 p.277; shadharat-dhahab p. 179}." }
