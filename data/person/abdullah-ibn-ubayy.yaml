    summary: { en: "The chief of the munafiqin: outwardly Muslim, inwardly working against the Prophet — the figure around whom sura al-Munafiqun and the slander affair are read. The tradition also records that the Prophet prayed over him and gave him his own shirt for a shroud.", ar: "يسمّيه التراث السني رئيس المنافقين: أظهر الإسلام وعمل في الباطن على تفريق الجماعة — وهو الشخص الذي تُقرأ حوله سورة المنافقون." }
