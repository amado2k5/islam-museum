summary:
  en: "The chief of Khazraj who had been preparing to be crowned king of Medina when the Hijra ended his ambition — remembered in the Sunni sources as the leader of the 'hypocrites' who opposed the Prophet from inside the city."
  ar: "سيد الخزرج الذي كانت يثرب تهيئ لتتويجه ملكًا حين قطعت الهجرة طموحه — يذكره التراث السني زعيمًا للمنافقين الذين عارضوا النبي من داخل المدينة. وعند ابن حزم والسمهودي هو من بني الحبلى من الخزرج، وكان له أطم «مزاحم» بين ظهراني بيوت بني الحبلى — قرب دار بني ساعدة — وما وقع في حديث الخلع عند ابن حجر من كونه من بني مغالة من النجار فوهم فيما يرى السمهودي {cite:samhudi-wafa-al-wafa p. 212-213}. وفي الصحيح أن النبي أتى قبره بعدما أدخل حفرته فأمر به فأخرج فوضعه على ركبتيه ونفث عليه من ريقه وألبسه قميصه {cite:sahih-al-bukhari 1350}."
