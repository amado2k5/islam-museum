died: { edtf: "1264~", hijri: "0662", calendar: julian, precision: year, status: tradition, derived: true, note: "قتله مخدومه بين يديه لكونه كاتب الملك الظاهر وقتل معه أقاربه وخاصته وكانوا خمسين سنة اثنتين وستين {cite:shadharat-dhahab p. 535}." }
summary:
  ar: "الطبيب؛ طب الملك الحافظ صاحب جعبر فنسب إليه ثم خدم الملك الناصر يوسف فعظم عنده وبعثه رسولاً إلى التتار فباطنهم ونصح لهم فأمره هولاكو وصار تترياً خائناً للمسلمين، فسلط الله عليه مخدومه فقتل بين يديه لكونه كاتب الملك الظاهر وقتل معه أقاربه وخاصته وكانوا خمسين {cite:shadharat-dhahab p. 535}."
  en: "Physician to the lord of Ja'bar, then al-Nasir Yusuf's intimate — sent as envoy to the Tatars he went over to them and Hulagu amir'ed him; 'he became a Tatar, a traitor to the Muslims' — until his patron had him killed for corresponding with al-Zahir, with fifty of his kin and intimates {cite:shadharat-dhahab p. 535}."
  fr: "Médecin du seigneur de Ja'bar, puis intime d'al-Nasir Yusuf - envoyé comme envoyé aux Tatars, il est allé vers eux et Hulagu l'a émir' ; \"il est devenu un Tatar, un traître aux musulmans\" - jusqu'à ce que son patron l'ait tué pour correspondre avec al-Zahir, avec cinquante de ses proches et intimes {cite:shadharat-dhahab p. 535}."
  es: "Médico del señor de Ja'bar, luego íntimo de al-Nasir Yusuf, enviado como enviado a los tártaros, se pasó a ellos y Hulagu lo nombró emir; \"se convirtió en tártaro, un traidor a los musulmanes\", hasta que su protector lo mandó matar por cartearse con al-Zahir, con cincuenta de sus parientes e íntimos {cita: shadharat-dhahab p. 535}."
  ur: "جبار کے آقا کا طبیب، پھر النصیر یوسف کا قریبی - تاتاریوں کے لیے ایلچی بنا کر بھیجا گیا، وہ ان کے پاس گیا اور ہلاگو نے اس کا امیر بنایا۔ 'وہ تاتاری بن گیا، مسلمانوں کا غدار' - یہاں تک کہ اس کے سرپرست نے اسے الظاہر کے ساتھ میل جول کی وجہ سے اس کے پچاس رشتہ داروں اور قریبیوں کے ساتھ قتل کر دیا۔ 535}۔"
  tr: "Kendisine atfedilen Kral el-Hafız Sahib Ca'bar'ın hekimi, daha sonra büyük saygı duyulan ve onu Tatarlara ve gizli işlerine elçi olarak gönderen Kral el-Nasir Yusuf'a hizmet etti. Hulagu ona emir verdi ve Yusuf Müslümanlara hain oldu. Allah onun hizmetkarını ona verdi ve kralın muhabiri olduğu için onun önünde öldürüldü. Ayrıca elli kişi olan akrabalarını ve yakın dostlarını da öldürdü {cite:shadharat-dhahab, s. 535}."
  id: "Dokter tersebut; tabib Raja al-Hafiz Sahib Ja'bar, yang dikaitkan dengannya, kemudian melayani Raja al-Nasir Yusuf, yang sangat dihormati olehnya dan mengirimnya sebagai utusan kepada Tatar dan urusan rahasia mereka, memberi nasihat. Hulagu memerintahkannya, dan dia menjadi pengkhianat Tatar bagi Muslim. Tuhan menunjuk hamba-Nya menggantikannya, dan dia dibunuh di hadapannya karena dia adalah koresponden raja. Dia juga membunuh kerabat dan rekan dekatnya, berjumlah lima puluh {cite:shadharat-dhahab, hlm. 535}."
