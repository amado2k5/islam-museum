summary:
  ar: "سياسي طاجيكي سوفيتي (1881–1937): أول رئيس لحكومة جمهورية طاجيكستان الاشتراكية السوفيتية في 1925–1926، وعضو هيئة رئاسة اللجنة التنفيذية المركزية لعموم روسيا ممثلًا عن طاجيكستان من 1926 إلى 1933؛ أُعدم رميًا بالرصاص في التطهير الكبير، ووُضع رسمه بعد استقلال طاجيكستان على ورقة المئتي صوموني النقدية."
  en: "Tajik Soviet politician (1881–1937): the first Prime Minister of the Tajik SSR, in 1925–1926, and the Tajik representative on the Presidium of the All-Russian Central Executive Committee from 1926 to 1933; executed by firing squad in the Great Purge; after Tajikistan's independence his portrait was placed on the 200-somoni banknote."
  ur: "تاجک سوویت سیاست دان (1881ء–1937ء): تاجک سوویت اشتراکی جمہوریہ کے پہلے وزیرِ اعظم، 1925ء–1926ء، اور 1926ء سے 1933ء تک کل روس مرکزی ایگزیکٹو کمیٹی کے پریزیڈیم میں تاجک نمائندے؛ عظیم تطہیر میں گولی مار کر ہلاک کیے گئے؛ تاجکستان کی آزادی کے بعد ان کی تصویر 200 صومونی کے نوٹ پر آئی۔"
