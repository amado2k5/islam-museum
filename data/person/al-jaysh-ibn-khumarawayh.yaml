id: person/al-jaysh-ibn-khumarawayh
class: person
label: { ar: "جيش بن خمارويه", en: "Jaysh ibn Khumarawayh", es: "Jaysh ibn Khumarawayh", fr: "Jaysh ibn Khumarawayh", ur: "جیش ابن خمارویہ" }
summary:
  ar: "ابن أبي الجيش خمارويه بن أحمد بن طولون وبه كان يكنى أبوه، بويع له بالأمر على مصر من الغد لما ورد خبر ذبح أبيه بدمشق يوم الأحد لخمس ليال خلون من ذي الحجة سنة اثنتين وثمانين ومائتين، وخرج يتلقى تابوت أبيه على باب مصر {cite:muruj-al-dhahab p. 611}. وعند المسعودي سار من الشام إلى مصر في جيوشه سنة ثلاث وثمانين فخالفه طغج بدمشق، وفيها كان الشغب بمصر وقتل علي بن أحمد المارداني وقبض على جيش ونصب أخوه هارون مكانه لنقمتهم تقدمه لغلامه نجح المعروف بالطولوني وأخيه سلامة المعروف بالمؤثمن {cite:muruj-al-dhahab p. 620}، وعند ابن الجوزي ولي بعد أبيه خمارويه سنة 282هـ فقتلوه وانتهبوا داره {cite:muntazam-ibn-al-jawzi p. 155}"
  en: "Khumarawayh's son and successor in Egypt, acclaimed the morning after his father's murder reached Fustat {cite:muruj-al-dhahab p. 611}."
  es: "El hijo y sucesor de Khumarawayh en Egipto, aclamado la mañana después del asesinato de su padre, llegó a Fustat {cite:muruj-al-dhahab p. 611}."
  fr: "Le fils et successeur de Khumarawayh en Égypte, acclamé le lendemain matin du meurtre de son père, arriva à Fustat {cite:muruj-al-dhahab p. 611}."
  ur: "خماراویہ کے بیٹے اور مصر میں جانشین، اپنے والد کے قتل کی خبر فوستات تک پہنچنے کے بعد صبح کی تعریف کی۔ 611}۔"
  tr: "Babası tarafından takılan İbn Abi el-Ceyş Humarawayh ibn Ahmed ibn Tulun, babasının 282 Hicce'den beş gece önce, Pazar günü Şam'da katledildiği haberi geldiğinde, ertesi gün Mısır valisine bağlılık yemini etti. Babasının tabutunu Mısır Kapısı'nda kabul etmeye çıktı {atıf:muruj-al-dhahab, s. 611}. El-Mes'udi ile birlikte, seksen üçüncü yılda ordularıyla birlikte Levant'tan Mısır'a yürüdü, ancak Tuğ Şam'da ona karşı çıktı. Bu dönemde Mısır'da isyan çıktı, Ali bin Ahmed el-Mardani öldürüldü, bir ordu esir alındı ve kardeşi Harun onların intikamını almak üzere onun yerine atandı. Hizmetkarına yükseldi, bilinen el-Tuluni'nin ve kardeşi Salama'nın yerine geçti, el-Mu'thamin {cite:muruj-al-dhahab, s. 620}. İbn el-Cevzi, 282 Hicri yılında babasının yerine Khumarawiyyah valisi oldu, ancak onu öldürdüler ve evini yağmaladılar {atıf:Muntazam-ibn-al-jawzi s. 155}"
  id: "Ibn Abi al-Jaish Khumarawayh ibn Ahmad ibn Tulun, yang menjadi julukan ayahnya, ia bersumpah setia kepada gubernur Mesir keesokan harinya ketika kabar tiba bahwa ayahnya telah dibantai di Damaskus pada hari Minggu, lima malam sebelum Dhu al-Hijjah tahun 282 H. Ia keluar untuk menerima peti mati ayahnya di Gerbang Mesir {cite:muruj-al-dhahab, hlm. 611}. Bersama al-Mas'udi, ia berbaris dari Levant ke Mesir bersama pasukannya pada tahun delapan puluh tiga, tetapi Tugh melawannya di Damaskus. Pada masa ini, terjadi pemberontakan di Mesir, Ali ibn Ahmad al-Mardani tewas, sebuah pasukan ditangkap, dan saudaranya Harun diangkat menggantikannya untuk membalas dendam mereka. Ia maju ke pelayannya, menggantikan al-Tuluni yang dikenal, dan saudaranya Salama, yang dikenal sebagai al-Mu'thamin {cite:muruj-al-dhahab, hlm. 620}. Ibn al-Jawzi menggantikan ayahnya sebagai gubernur Khumarawiyyah pada tahun 282 H, tetapi mereka membunuhnya dan menjarah rumahnya {cite:Muntazam-ibn-al-jawzi hlm. 155}"
