label: { ar: "جيش بن خمارويه", en: "Jaysh ibn Khumarawayh" }
summary:
  ar: "ابن أبي الجيش خمارويه بن أحمد بن طولون وبه كان يكنى أبوه، بويع له بالأمر على مصر من الغد لما ورد خبر ذبح أبيه بدمشق يوم الأحد لخمس ليال خلون من ذي الحجة سنة اثنتين وثمانين ومائتين، وخرج يتلقى تابوت أبيه على باب مصر {cite:muruj-al-dhahab p. 611}.، وعند المسعودي سار من الشام إلى مصر في جيوشه سنة ثلاث وثمانين فخالفه طغج بدمشق، وفيها كان الشغب بمصر وقتل علي بن أحمد المارداني وقبض على جيش ونصب أخوه هارون مكانه لنقمتهم تقدمه لغلامه نجح المعروف بالطولوني وأخيه سلامة المعروف بالمؤثمن {cite:muruj-al-dhahab p. 620}"
  en: "Khumarawayh's son and successor in Egypt, acclaimed the morning after his father's murder reached Fustat {cite:muruj-al-dhahab p. 611}."
