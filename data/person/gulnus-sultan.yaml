  ar: "بطاقة أولية لكلنوش سلطان، حرم محمد الرابع والوالدة سلطان لمصطفى الثاني وأحمد الثالث، وردت في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمتها في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
