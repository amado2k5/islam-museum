  es: "Ficha de borrador para Gülnuş Sultan, consorte de Mehmed IV y sultana válida de Mustafa II y Ahmed III, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de projet pour Gülnuş Sultan, épouse de Mehmed IV et valide sultane de Mustafa II et Ahmed III, nommée d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "محمد چہارم کی ہمشیرہ گلنوش سلطان کے لیے ڈرافٹ کارڈ اور مصطفی دوم اور احمد III کے لیے درست سلطان، جس کا نام کھلے حوالہ سے بیان کیا گیا ہے ⁦(وکی ڈیٹا)⁩؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
