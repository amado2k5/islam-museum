summary:
  ar: "أسماء جيلاني جهانجير (27 يناير 1952 – 11 فبراير 2018) محامية وناشطة حقوق إنسان باكستانية، شاركت في تأسيس لجنة حقوق الإنسان في باكستان وترأستها، وأسست خلية AGHS للمساعدة القانونية، وشغلت مناصب مقررة خاصة للأمم المتحدة للإعدامات خارج القضاء ولحرية الدين أو المعتقد ولحقوق الإنسان في إيران، وكانت أول امرأة ترأس نقابة محامي المحكمة العليا في باكستان."
  en: "Asma Jilani Jahangir (27 January 1952 – 11 February 2018) was a Pakistani human-rights lawyer and activist who co-founded and chaired the Human Rights Commission of Pakistan, founded the AGHS Legal Aid Cell, served as United Nations Special Rapporteur on extrajudicial executions, on freedom of religion or belief, and on human rights in Iran, and was the first woman to preside over Pakistan's Supreme Court Bar Association."
  ur: "عاصمہ جیلانی جہانگیر (27 جنوری 1952ء – 11 فروری 2018ء) پاکستانی انسانی حقوق کی وکیل اور فعالیت پسند تھیں جنھوں نے پاکستان کے انسانی حقوق کمیشن کی مشترکہ بنیاد رکھی اور اس کی سربراہی کی، اے جی ایچ ایس لیگل ایڈ سیل قائم کیا، اقوام متحدہ کی خصوصی نمائندہ برائے ماورائے عدالت قتل، مذہب یا عقیدے کی آزادی اور ایران میں انسانی حقوق کے مناصب سنبھالے، اور پاکستان کی سپریم کورٹ بار ایسوسی ایشن کی پہلی خاتون صدر ہوئیں۔"
