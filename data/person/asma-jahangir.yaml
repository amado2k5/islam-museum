summary:
  ar: "أسماء جيلاني جهانجير ⁦(27 يناير 1952 – 11 فبراير 2018)⁩ محامية وناشطة حقوق إنسان باكستانية، شاركت في تأسيس لجنة حقوق الإنسان في باكستان وترأستها، وأسست خلية AGHS للمساعدة القانونية، وشغلت مناصب مقررة خاصة للأمم المتحدة للإعدامات خارج القضاء ولحرية الدين أو المعتقد ولحقوق الإنسان في إيران، وكانت أول امرأة ترأس نقابة محامي المحكمة العليا في باكستان."
  en: "Asma Jilani Jahangir (27 January 1952 – 11 February 2018) was a Pakistani human-rights lawyer and activist who co-founded and chaired the Human Rights Commission of Pakistan, founded the AGHS Legal Aid Cell, served as United Nations Special Rapporteur on extrajudicial executions, on freedom of religion or belief, and on human rights in Iran, and was the first woman to preside over Pakistan's Supreme Court Bar Association."
  ur: "عاصمہ جیلانی جہانگیر ⁦(27 جنوری 1952ء – 11 فروری 2018ء)⁩ پاکستانی انسانی حقوق کی وکیل اور فعالیت پسند تھیں جنھوں نے پاکستان کے انسانی حقوق کمیشن کی مشترکہ بنیاد رکھی اور اس کی سربراہی کی، اے جی ایچ ایس لیگل ایڈ سیل قائم کیا، اقوام متحدہ کی خصوصی نمائندہ برائے ماورائے عدالت قتل، مذہب یا عقیدے کی آزادی اور ایران میں انسانی حقوق کے مناصب سنبھالے، اور پاکستان کی سپریم کورٹ بار ایسوسی ایشن کی پہلی خاتون صدر ہوئیں۔"
  es: "Asma Jilani Jahangir (27 de enero de 1952 – 11 de febrero de 2018) fue una abogada y activista pakistaní de derechos humanos que cofundó y presidió la Comisión de Derechos Humanos de Pakistán, fundó la Célula de Asistencia Jurídica de AGHS, se desempeñó como Relatora Especial de las Naciones Unidas sobre ejecuciones extrajudiciales, sobre la libertad de religión o de creencias y sobre los derechos humanos en Irán, y fue la primera mujer en presidir la Asociación de Abogados de la Corte Suprema de Pakistán."
  fr: "Asma Jilani Jahangir (27 janvier 1952 – 11 février 2018) était une avocate et militante pakistanaise des droits de l'homme qui a cofondé et présidé la Commission des droits de l'homme du Pakistan, fondé la cellule d'aide juridique AGHS, a été rapporteuse spéciale des Nations Unies sur les exécutions extrajudiciaires, sur la liberté de religion ou de conviction et sur les droits de l'homme en Iran, et a été la première femme à présider l'Association du barreau de la Cour suprême du Pakistan."
  tr: "Asma Jilani Jahangir (27 Ocak 1952 – 11 Şubat 2018), Pakistanlı bir avukat ve insan hakları aktivistiydi. Pakistan'da İnsan Hakları Komisyonu'nu kurmuş ve başkanlık etmiştir, AGHS Hukuki Yardım Hücresi'ni kurmuş, Birleşmiş Milletler'de İran'da yargısız infazlar, din veya inanç özgürlüğü ve insan hakları konularında Özel Raportör olarak görev yapmıştır. Pakistan'da Yüksek Mahkeme Barosu'nun başkanlığını yapan ilk kadın olmuştur."
  id: "Asma Jilani Jahangir (27 Januari 1952 – 11 Februari 2018) adalah seorang pengacara dan aktivis hak asasi manusia asal Pakistan. Ia ikut mendirikan dan memimpin Komisi Hak Asasi Manusia di Pakistan, mendirikan AGHS Legal Aid Cell, menjabat sebagai Pelapor Khusus untuk Perserikatan Bangsa-Bangsa terkait eksekusi di luar proses hukum, kebebasan beragama atau berkeyakinan, dan hak asasi manusia di Iran. Ia adalah perempuan pertama yang memimpin Supreme Court Bar Association di Pakistan."
