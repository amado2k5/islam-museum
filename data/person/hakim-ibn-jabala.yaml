id: person/hakim-ibn-jabala
class: person
label: { ar: "حكيم بن جبلة العبدي", en: "Hakim ibn Jabala al-Abdi" }
summary:
  ar: "حكيم بن جبلة العبدي؛ وجهه عبد الله بن عامر إلى ثغر الهند يستكشفه فوصف لعثمان بلاده ماؤها وشل وثمرها دقل ولصها بطل إن قل الجيش فيها ضاعوا وإن كثروا جاعوا فقال له عثمان أخائر أم ساجع فلم يغزها أحداً، وعند المسعودي سار من أهل البصرة في مائة رجل في جيش الثائرين على عثمان {cite:muruj-al-dhahab p. 637}. واستعمله عثمان بن حنيف على شرطة البصرة، فلما قصد طلحة والزبير وعائشة البصرة أشار على ابن حنيف بمنعهم فأبى، فتكلموا في مربدها وترامى الناس بالحجارة، ثم غدا في سبع مئة من عبد القيس على ابن الزبير حين أتى مدينة الرزق فقاتله فقتل حكيم وسبعون من أصحابه، وروي أن سحيماً ضرب عنقه فاستدار رأسه فبقي مقبلاً بوجهه على دبره {cite:wafayat-ayan p. 59-60}."
  en: "Hakim ibn Jabala al-Abdi; Abdallah ibn Amir's scout of the Indian frontier — his rhymed dismissal ('its water scant, its fruit worthless; few men lost, many starved') ended Uthman's appetite for the campaign. In the Jamal prelude Ibn Hunayf made him Basra's police-chief; he marched with seven hundred 'Abd Qays on Ibn al-Zubayr's provisioning party and fell to Suhaym's sword with seventy men {cite:wafayat-ayan p. 59-60}."
