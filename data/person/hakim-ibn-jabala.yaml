summary:
  ar: "حكيم بن جبلة العبدي؛ وجهه عبد الله بن عامر إلى ثغر الهند يستكشفه فوصف لعثمان بلاده ماؤها وشل وثمرها دقل ولصها بطل إن قل الجيش فيها ضاعوا وإن كثروا جاعوا فقال له عثمان أخائر أم ساجع فلم يغزها أحداً، وعند المسعودي سار من أهل البصرة في مائة رجل في جيش الثائرين على عثمان {cite:muruj-al-dhahab p. 637}. واستعمله عثمان بن حنيف على شرطة البصرة، فلما قصد طلحة والزبير وعائشة البصرة أشار على ابن حنيف بمنعهم فأبى، فتكلموا في مربدها وترامى الناس بالحجارة، ثم غدا في سبع مئة من عبد القيس على ابن الزبير حين أتى مدينة الرزق فقاتله فقتل حكيم وسبعون من أصحابه، وروي أن سحيماً ضرب عنقه فاستدار رأسه فبقي مقبلاً بوجهه على دبره {cite:wafayat-ayan p. 59-60}."
  en: "Hakim ibn Jabala al-Abdi; Abdallah ibn Amir's scout of the Indian frontier — his rhymed dismissal ('its water scant, its fruit worthless; few men lost, many starved') ended Uthman's appetite for the campaign. In the Jamal prelude Ibn Hunayf made him Basra's police-chief; he marched with seven hundred 'Abd Qays on Ibn al-Zubayr's provisioning party and fell to Suhaym's sword with seventy men {cite:wafayat-ayan p. 59-60}."
  es: "Hakim ibn Jabala al-Abdi, explorador de Abdallah ibn Amir en la frontera india, fue despedido con rima (\"su agua escasea, su fruta no vale nada; pocos hombres se perdieron, muchos murieron de hambre\"), lo que acabó con el entusiasmo de Uthman por la campaña. En el preludio de Jamal, Ibn Hunayf lo nombró jefe de policía de Basora; marchó con setecientos 'Abd Qays contra el grupo de aprovisionamiento de Ibn al-Zubayr y cayó ante la espada de Suhaym junto con setenta hombres {cite:wafayat-ayan p. 59-60}."
  fr: "Hakim ibn Jabala al-Abdi, éclaireur d'Abdallah ibn Amir à la frontière indienne, fut renvoyé avec un discours rimé (« l'eau y est rare, les fruits sans valeur; peu d'hommes perdus, beaucoup morts de faim »), ce qui mit fin à l'enthousiasme d'Uthman pour la campagne. Dans le prélude de Jamal, Ibn Hunayf le nomma chef de la police de Bassora; il marcha avec sept cents 'Abd Qays contre le convoi de ravitaillement d'Ibn al-Zubayr et périt sous l'épée de Suhaym avec soixante-dix hommes (voir: Wafayat-ayan, p. 59-60)."
  ur: "حکیم ابن جبلہ العبدی؛ عبداللہ بن عامر کی ہندوستانی سرحد کے اسکاؤٹ - اس کی نظم شدہ برخاستگی ⁦('اس کا پانی کم، اس کا پھل بیکار؛ چند آدمی کھو گئے، بہت سے بھوکے')⁩ نے مہم کے لیے عثمان کی بھوک ختم کردی۔ جمال کی تمہید میں ابن حنیف نے اسے بصرہ کا پولیس چیف بنایا۔ اس نے سات سو عبد قیس کے ساتھ ابن الزبیر کی جماعت پر چڑھائی کی اور ستر آدمیوں کے ساتھ سہیم کی تلوار پر گر پڑا۔ 59-60}۔"
  tr: "Hakim ibn Jibla al-Abdi; Abdullah ibn Amir, onu Hindistan sınırına keşfetmesi için gönderdi ve Osman'a topraklarını suyunu, meyvesini, meyvesini ve hırsızını anlattı. Ordu azsa kaybedilir, kalabalıksa açtır. Osman ona, 'Son mu yoksa en çok mu kalabalıksın?' diye sordu ama kimse onu fethetmedi. El-Mes'udi'ye göre, Basra'dan yüz adam isyancıların ordusuyla Osman'a karşı yürüdü {atıf:Muruj-al-Dhahab, s. 637}. Osman bin Hunayf onu Basra'nın polisi olarak atadı. Talha, el-Zubeyr ve Eyşe Basra'ya gittiklerinde, İbn Hunayf'a onları engellemesi için işaret etti, ancak o reddetti. Çayırda tartıştılar ve insanlara taş attılar. Sonra İbn al-Zubayr geçim şehrine vardığında yedi yüz Abdülkay ile birleşti ve onunla savaştı, Hakim ve yetmiş yoldaşını öldürdü. Rivayete göre Suheym, boynunu vurdu, başını çevirdi ve sırtını dönerek kaldı {atıf:wafayat-ayan s. 59-60}."
  id: "Hakim ibn Jibla al-Abdi; Abdullah ibn Amir mengirimnya ke perbatasan India untuk menjelajahinya, di mana ia menggambarkan kepada Uthman tentang airnya, buahnya, buahnya, dan pencurinya. Jika pasukannya sedikit, mereka akan hilang, dan jika jumlahnya berjumlah, mereka kelaparan. Uthman bertanya kepadanya, 'Apakah engkau yang terakhir atau yang paling banyak,' tetapi tidak ada yang menaklukkannya. Menurut al-Mas'udi, seratus orang dari Basra berbaris bersama pasukan pemberontak melawan Uthman {cite:muruj-al-dhahab, hlm. 637}. Uthman ibn Hunayf mengangkatnya sebagai polisi Basra. Ketika Talha, al-Zubayr, dan Aisha pergi ke Basra, ia memberi isyarat kepada Ibn Hunayf untuk mencegah mereka, tetapi ia menolak. Mereka berdebat di padang rumput dan melempar batu ke arah orang-orang. Kemudian ia bergabung dengan tujuh ratus Abd al-Qays melawan Ibn al-Zubayr ketika tiba di kota tempat penghidupan dan melawannya, membunuh Hakim dan tujuh puluh temannya. Diceritakan bahwa Suhaym memukul lehernya, memutar kepalanya, dan tetap menghadap punggung {cite:wafayat-ayan hlm. 59-60}."
