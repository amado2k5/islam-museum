summary:
  ar: "من بني سالم بن عوف؛ ذكره ابن إسحاق في الأربعة الذين تخلفوا عن غير شك، ثم لحق بالنبي بتبوك بعد أن امتنع من دخول عريشيه في يوم حار. وولده زهير بن حرب توفي سنة أربع وثلاثين ومائتين وله كتاب المسند وكتاب العلم، وابنه أبو بكر أحمد بن زهير بن حرب من المحدثين الأخباريين وكان فقيها توفي سنة تسع وسبعين ومائتين وله كتاب التاريخ وكتاب المنتمين وكتاب الأعزاب وكتاب أخبار الشعراء {cite:fihrist-ibn-al-nadim p. 321}"
  en: Of Banu Salim ibn Awf; Ibn Ishaq names him among the four who stayed behind without doubt, then he caught up with the Prophet at Tabuk after refusing to enter his two bowers on a hot day.
  ur: "بنو سلیم بن عوف کے؛ ابن اسحاق انہیں ان چار میں گناتے ہیں جو بلاشبہ پیچھے رہ گئے، پھر تبوک پر نبی سے جا ملے۔"
  fr: "Des Banu Salim ibn Awf ; Ibn Ishaq le nomme parmi les quatre qui restèrent en arrière sans doute aucun, puis il rejoignit le Prophète à Tabuk après avoir refusé d'entrer dans ses deux tonnelles par un jour de chaleur."
  es: "De Banu Salim ibn Awf; Ibn Ishaq lo nombra entre los cuatro que se quedaron atrás sin duda, luego alcanzó al Profeta en Tabuk después de negarse a entrar en sus dos aposentos en un día caluroso."
  tr: "Beni Salim ibn Awf kabilesindendir; İbn İshak, onu şüphesiz geride kalan dört kişi arasında saymış, daha sonra sıcak bir günde çadırına girmeyi reddettikten sonra Tebük'te Peygamber'e katılmıştır. Oğlu Zuhayr ibn Harb, Hicri 234 yılında vefat etmiş ve Musned ile İlim Kitabı'nı yazmıştır. Oğlu Ebu Bekir Ahmed ibn Zuhayr ibn Harb ise hadis âlimi, tarihçi ve aynı zamanda fıkıhçıydı. Hicri 279 yılında vefat etmiş ve Tarih Kitabı, Muhteremler Kitabı, Bekârlar Kitabı ve Şairlerin Hikayeleri Kitabı'nı yazmıştır. {cite:fihrist-ibn-al-nadim s. 321}"
  id: "Dari Bani Salim ibn Awf; Ibnu Ishaq menyebutkannya di antara empat orang yang tetap tinggal tanpa diragukan lagi, kemudian ia bergabung dengan Nabi di Tabuk setelah menolak masuk ke tendanya pada hari yang panas. Putranya, Zuhayr ibn Harb, meninggal pada tahun 234 H dan menulis Musnad dan Kitab Ilmu. Putranya, Abu Bakar Ahmad ibn Zuhayr ibn Harb, adalah seorang ulama hadits dan sejarawan, serta seorang ahli hukum. Ia meninggal pada tahun 279 H dan menulis Kitab Sejarah, Kitab Para Pengikut, Kitab Kaum Lajang, dan Kitab Kisah Para Penyair. {cite:fihrist-ibn-al-nadim p. 321}"
