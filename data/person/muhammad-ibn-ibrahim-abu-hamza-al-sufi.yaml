summary:
  ar: "أبو حمزة الصوفي البغدادي، مولى عيسى بن أياز، من كبار شيوخ الصوفة، كان يتكلم في جامع الرصافة ثم في جامع المدينة وكان عالمًا بالقراءات خصوصًا قراءة أبي عمرو، وجالس أحمد بن حنبل وكان أحمد إذا عرضت مسألة يقول: ما تقول فيها يا صوفي؟ وجالس بشر بن الحارث وأبا نصر التمار وسريا السقطي وسافر مع أبي تراب النخشبي، إلا أنه انغمس في مذاهب الصوفية حتى رُوي أنه وقع في بئر فجاء قوم يطمّونها فرأى من التوكل ألّا ينطق — وسكوته في مثل هذا يخالف الشرع؛ وقيل إن الواقع في البئر أبو حمزة الخراساني لا البغدادي {cite:muntazam-ibn-al-jawzi p. 152}."
  en: "Abu Hamza the Sufi of Baghdad, dean of the Sufi shaykhs, preacher at the Rusafa then the Medina mosques, master of the qira'at — especially Abu 'Amr's; he sat with Ibn Hanbal (who would ask 'what say you, O Sufi?'), Bishr al-Hafi, al-Tammar and Sari al-Saqati. The well story — falling in and staying silent 'from tawakkul' as men filled it — Ibn al-Jawzi flags as against the Law, and perhaps belongs to Abu Hamza al-Khurasani instead {cite:muntazam-ibn-al-jawzi p. 152}."
  es: "Abu Hamza, el sufí de Bagdad, decano de los jeques sufíes, predicador en las mezquitas de Rusafa y luego en las de Medina, maestro de la recitación del Corán (qira'at), especialmente la de Abu Amr; se sentaba con Ibn Hanbal (quien le preguntaba: \"¿Qué dices, oh sufí?\"), Bishr al-Hafi, al-Tammar y Sari al-Saqati. La historia del pozo —caer en él y permanecer en silencio \"por confianza\" mientras los hombres lo llenaban— Ibn al-Jawzi la considera contraria a la ley y quizás se la atribuya a Abu Hamza al-Khurasani {cite:muntazam-ibn-al-jawzi p. 152}."
  fr: "Abou Hamza, le soufi de Bagdad, doyen des cheikhs soufis, prédicateur aux mosquées de Rusafa puis de Médine, maître de la récitation du Coran (qira'at) – notamment celle d'Abou 'Amr –, s'entretenait avec Ibn Hanbal (qui lui demandait: « Que dis-tu, ô soufi ? »), Bishr al-Hafi, al-Tammar et Sari al-Saqati. L'anecdote du puits – où l'on tombe et où l'on reste silencieux « par tawakkul » (souci du silence) pendant que les hommes le remplissent – est contestée par Ibn al-Jawzi, qui la juge contraire à la Loi et l'attribue peut-être à Abou Hamza al-Khurasani (voir: Muntazam Ibn al-Jawzi, p. 152)."
  ur: "ابو حمزہ بغداد کے صوفی، صوفی شیخوں کے ڈین، روسفہ پھر مدینہ کی مساجد میں مبلغ، قیراط کے ماسٹر - خاص طور پر ابو عمرو؛ وہ ابن حنبل ⁦(جو پوچھے گا اے صوفی تم کیا کہتے ہو؟)⁩، بشر الحفی، التمر اور ساری السقطی کے ساتھ بیٹھ گئے۔ کنواں کی کہانی - 'توکل سے' گرنا اور خاموش رہنا جیسا کہ مردوں نے اسے بھر دیا - ابن الجوزی نے قانون کے خلاف جھنڈا لگایا، اور شاید اس کی بجائے ابو حمزہ الخراسانی کا ہے {حوالہ دیں:منتظم ابن الجوزی صفحہ 152}۔"
