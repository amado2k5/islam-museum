summary:
  ar: "أبو حمزة الصوفي البغدادي، مولى عيسى بن أياز، من كبار شيوخ الصوفة، كان يتكلم في جامع الرصافة ثم في جامع المدينة وكان عالمًا بالقراءات خصوصًا قراءة أبي عمرو، وجالس أحمد بن حنبل وكان أحمد إذا عرضت مسألة يقول: ما تقول فيها يا صوفي؟ وجالس بشر بن الحارث وأبا نصر التمار وسريا السقطي وسافر مع أبي تراب النخشبي، إلا أنه انغمس في مذاهب الصوفية حتى رُوي أنه وقع في بئر فجاء قوم يطمّونها فرأى من التوكل ألّا ينطق — وسكوته في مثل هذا يخالف الشرع؛ وقيل إن الواقع في البئر أبو حمزة الخراساني لا البغدادي {cite:muntazam-ibn-al-jawzi p. 152}."
  en: "Abu Hamza the Sufi of Baghdad, dean of the Sufi shaykhs, preacher at the Rusafa then the Medina mosques, master of the qira'at — especially Abu 'Amr's; he sat with Ibn Hanbal (who would ask 'what say you, O Sufi?'), Bishr al-Hafi, al-Tammar and Sari al-Saqati. The well story — falling in and staying silent 'from tawakkul' as men filled it — Ibn al-Jawzi flags as against the Law, and perhaps belongs to Abu Hamza al-Khurasani instead {cite:muntazam-ibn-al-jawzi p. 152}."
