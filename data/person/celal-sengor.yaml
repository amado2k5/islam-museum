summary:
  ar: "جيولوجي تركي (مواليد 1955 بإسطنبول)، من أبرز علماء التكتونيات في جيله. درس في كلية روبرت ثم في جامعة ولاية نيويورك بألباني حيث نال الدكتوراه سنة 1982، وصار أستاذًا في جامعة إسطنبول التقنية وعضوًا أجنبيًا في الأكاديمية الوطنية الأمريكية للعلوم والأكاديمية الروسية للعلوم وأكاديميات أخرى كثيرة. يكتب عمودًا أسبوعيًا في صحيفة «جمهورييت»، ويُعرف بتصريحاته العلنية المتكررة بأنه ملحد، حتى إن رئاسة الشؤون الدينية التركية اشتكت منه سنة 2022 فاستدعاه الادعاء للإدلاء بإفادته عن أقواله التلفزية في أنبياء الكتب المقدسة."
  en: "Turkish geologist (born 1955 at Istanbul), among the leading tectonicists of his generation. Educated at Robert College and the State University of New York at Albany, where he took his PhD in 1982, he became a professor at Istanbul Technical University and a foreign member of the US National Academy of Sciences, the Russian Academy of Sciences and many other academies. He writes a weekly column in Cumhuriyet and is known for his repeated public declarations that he is an atheist — in 2022 the Presidency of Religious Affairs complained about his televised remarks on the prophets of the scriptures and the prosecutor summoned him to testify."
  ur: "ترک ماہرِ ارضیات (پیدائش 1955ء، استنبول)، اپنی نسل کے ممتاز ٹیکٹونک ماہرین میں سے ایک۔ رابرٹ کالج اور اسٹیٹ یونیورسٹی آف نیو یارک، البانی میں تعلیم پائی، جہاں 1982ء میں پی ایچ ڈی کیا؛ استنبول ٹیکنیکل یونیورسٹی میں پروفیسر ہوئے اور امریکی قومی اکیڈمی آف سائنسز، روسی اکیڈمی آف سائنسز اور کئی دیگر اکیڈمیوں کے غیر ملکی رکن منتخب ہوئے۔ «جمہوریت» میں ہفتہ وار کالم لکھتے ہیں اور بار بار علانیہ کہنے کے لیے مشہور ہیں کہ وہ ملحد ہیں — 2022ء میں ترک مذہبی امور کی صدارت نے ان کی ٹیلی ویژن گفتگو پر شکایت کی اور پراسیکیوٹر نے انہیں بیان کے لیے طلب کیا۔"
