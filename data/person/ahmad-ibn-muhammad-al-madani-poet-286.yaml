label:
  ar: أحمد بن محمد المداني، ناظم قصيدة في بني الحارث
  en: Ahmad ibn Muhammad al-Madani, poet of a poem on Banu al-Harith
  ur: احمد بن محمد مدانی، بنو حارث کے بارے میں قصیدے کا شاعر
summary:
  ar: شاعر ذكره الكتاب بنسبة «المداني» وأورد له قصيدة بعد دخول الهادي القرية وقتله بني الحارث يخطّئ فيها بني الحارث.
  en: A poet the book names with the nisba "al-Madani" and whose poem, after al-Hadi's entry into the village and his killing of Banu al-Harith, faults Banu al-Harith.
  ur: ایک شاعر جسے کتاب «مدانی» نسبت سے ذکر کرتی ہے اور جس کا قصیدہ ہادی کے بستی میں داخل ہونے اور بنو حارث کو قتل کرنے کے بعد بنو حارث کو خطا کار ٹھہراتا ہے۔
