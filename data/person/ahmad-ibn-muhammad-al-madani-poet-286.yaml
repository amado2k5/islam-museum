id: person/ahmad-ibn-muhammad-al-madani-poet-286
class: person
label:
  ar: أحمد بن محمد المداني، ناظم قصيدة في بني الحارث
  en: Ahmad ibn Muhammad al-Madani, poet of a poem on Banu al-Harith
  ur: احمد بن محمد مدانی، بنو حارث کے بارے میں قصیدے کا شاعر
  es: "Ahmad ibn Muhammad al-Madani, poet of a poem on Banu al-Harith"
  fr: "Ahmad ibn Muhammad al-Madani, poet of a poem on Banu al-Harith"
summary:
  ar: شاعر ذكره الكتاب بنسبة «المداني» وأورد له قصيدة بعد دخول الهادي القرية وقتله بني الحارث يخطّئ فيها بني الحارث.
  en: A poet the book names with the nisba "al-Madani" and whose poem, after al-Hadi's entry into the village and his killing of Banu al-Harith, faults Banu al-Harith.
  ur: ایک شاعر جسے کتاب «مدانی» نسبت سے ذکر کرتی ہے اور جس کا قصیدہ ہادی کے بستی میں داخل ہونے اور بنو حارث کو قتل کرنے کے بعد بنو حارث کو خطا کار ٹھہراتا ہے۔
  es: "El libro nombra a un poeta con el nombre de nisba \"al-Madani\" y cuyo poema, tras la entrada de al-Hadi en la aldea y el asesinato de Banu al-Harith, culpa a Banu al-Harith."
  fr: "Un poète que le livre nomme avec la nisba « al-Madani » et dont le poème, après l'entrée d'al-Hadi dans le village et le meurtre des Banu al-Harith, blâme les Banu al-Harith."
  tr: "Kitapta “Al-Madani” adlı bir şairden bahsediliyor ve Al-Hadi'nin köye girip Beni Al-Harith'i öldürmesinden sonra yazdığı, Beni Al-Harith'i eleştiren bir şiirinden alıntı yapılıyor."
  id: "Buku tersebut menyebutkan seorang penyair bernama “Al-Madani” dan mengutip sebuah puisi yang ditulisnya setelah Al-Hadi memasuki desa dan membunuh Bani Al-Harith, di mana ia mengkritik Bani Al-Harith."
