id: person/al-zafir-al-qadi
class: person
label: { ar: "الظافر القاضي", en: "al-Zafir the Qadi", fr: "al-Zafir, le cadi", es: "al-Zafir the Qadi", ur: "الظفیر قادی" }
summary:
  ar: "الظافر محمد بن إسماعيل القاضي، أول من نبغ من بني عباد بالأندلس؛ تقدم بإشبيلية إلى أن ولي قضاءها فأحسن السياسة مع الرعية والملاطفة بهم فراقته القلوب، وكان يحيى بن علي بن حمود الحسني المعروف بالمعتلي صاحب قرطبة مذموم السيرة فتوجه إلى إشبيلية حاصراً لها، فاجتمع رؤساؤها وأعيانها إلى القاضي فسألوه أن يقوم بهم فيخرجوا إليه ويملكوه ويجعلوا الأمر إليه ففعل، ووثبوا على يحيى فخرج إليهم سكراناً فقتلوه، وتم الأمر للظافر ثم ملك قرطبة وغيرها من البلاد {cite:wafayat-ayan}."
  en: "al-Zafir Muhammad b. Isma'il (d. 433) — the qadi who founded Abbadid Seville: when the Hammudid Yahya b. Ali besieged the city, the notables chose the qadi, deposed Yahya and made the Abbadids kings {cite:wafayat-ayan}."
  fr: "Al-Zafir Muhammad b. Isma'il (mort en 433) - le qadi qui a fondé Abbadid Séville : lorsque le Hammudid Yahya b. Ali a assiégé la ville, les notables ont choisi le qadi, déposé Yahya et fait les rois Abbadids {cite:wafayat-ayan}."
  es: "al-Zafir Muhammad b. Isma'il (m. 433): el cadí que fundó la Sevilla abbadid: cuando Hammudid Yahya b. Ali sitió la ciudad, los notables eligieron al cadí, depusieron a Yahya y nombraron reyes a los abbadíes {citar:wafayat-ayan}."
  ur: "الظفیر محمد بی اسماعیل ⁦(متوفی 433)⁩ - وہ قادی جس نے عبادی سیویل کی بنیاد رکھی: جب حمودید یحییٰ بن۔ علی نے شہر کا محاصرہ کیا، معززین نے قاضی کا انتخاب کیا، یحییٰ کو معزول کیا اور عبادیوں کو بادشاہ بنایا۔"
