label: { ar: "الظافر القاضي", en: "al-Zafir the Qadi" }
summary:
  ar: "الظافر محمد بن إسماعيل القاضي، أول من نبغ من بني عباد بالأندلس؛ تقدم بإشبيلية إلى أن ولي قضاءها فأحسن السياسة مع الرعية والملاطفة بهم فراقته القلوب، وكان يحيى بن علي بن حمود الحسني المعروف بالمعتلي صاحب قرطبة مذموم السيرة فتوجه إلى إشبيلية حاصراً لها، فاجتمع رؤساؤها وأعيانها إلى القاضي فسألوه أن يقوم بهم فيخرجوا إليه ويملكوه ويجعلوا الأمر إليه ففعل، ووثبوا على يحيى فخرج إليهم سكراناً فقتلوه، وتم الأمر للظافر ثم ملك قرطبة وغيرها من البلاد {cite:wafayat-ayan}."
  en: "al-Zafir Muhammad b. Isma'il (d. 433) — the qadi who founded Abbadid Seville: when the Hammudid Yahya b. Ali besieged the city, the notables chose the qadi, deposed Yahya and made the Abbadids kings {cite:wafayat-ayan}."
