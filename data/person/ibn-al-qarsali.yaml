summary:
  ar: "شهاب الدين أحمد ابن القرسالي الدمشقي الحنفي؛ كان فلاحاً فأخذ من بستانه يوماً عصاً فحفر بها الأرض فقلَّعت له بئراً ذات ماء وثوراً على طوله ثلاث دراهم فترك الفلاحة واشتغل بالعلم من ذلك الوقت، ثم اشتغل على شيخنا وكان من أذكى الناس وحذق علوماً وحضر دروس أهل زمانه ومات عن تسعين سنة سنة ثمان عشرة وتسعمائة {cite:shadharat-dhahab p. 468}."
  en: "A peasant who struck three dirhams digging a well in his orchard — he left farming for scholarship on the spot, audited under our shaykh, and became 'one of the sharpest minds'; died aged about ninety in 918 {cite:shadharat-dhahab p. 468}."
