summary:
  ar: "روائي وكاتب تركي، وُلد في إسطنبول سنة 1866 وتوفي فيها سنة 1945. أسس صحيفة «خدمت» في إزمير سنة 1886، وصار أبرز روائيي حركة «أدبيات جديده» ومجلة «ثروت فنون»، وأشهر أعماله رواية «عشق ممنوع» (1900) التي منعتها الرقابة العثمانية جزئيًا ثم تحولت إلى مسلسل عالمي الشهرة، وكتب «ماي وسياه» و«قيريق حياةلر»."
  en: "Turkish novelist and writer, born at Istanbul in 1866 and died there in 1945. He founded the newspaper Hizmet at İzmir in 1886, became the leading novelist of the Edebiyat-ı Cedide (New Literature) movement and of the Servet-i Fünun journal, and is best known for the novel Aşk-ı Memnu (Forbidden Love, 1900), partly censored under Abdülhamid II and later adapted into an internationally successful television series; he also wrote Mai ve Siyah and Kırık Hayatlar."
  ur: "ترک ناول نگار اور مصنف، 1866ء میں استنبول میں پیدا ہوئے اور 1945ء میں وہیں وفات پائی۔ «ثروتِ فنون» تحریک کے سرکردہ ناول نگار تھے؛ ان کا شہرۂ آفاق ناول «عشقِ ممنوع» (1900ء) بعد میں عالمی شہرت یافتہ ٹیلی ویژن سلسلے میں ڈھلا۔"
