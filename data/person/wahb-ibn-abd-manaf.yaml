summary:
  ar: "سيد بني زهرة نسباً وشرفاً في زمانه؛ والد آمنة أم النبي، فهو جد النبي لأمه؛ اختار عبد المطلب ابنته لابنه عبد الله."
  en: "Chief of Banu Zuhra by lineage and standing; father of Amina and thus the Prophet's maternal grandfather; Abd al-Muttalib chose his daughter for his son Abdullah."
  es: "Jefe de Banu Zuhra por linaje y posición; padre de Amina y, por lo tanto, abuelo materno del Profeta; Abd al-Muttalib eligió a su hija para su hijo Abdullah."
  fr: "Chef de la tribu Banu Zuhra par sa lignée et son rang; père d'Amina et donc grand-père maternel du Prophète; Abd al-Muttalib a choisi sa fille pour son fils Abdullah."
  ur: "بنو زہرہ کے سردار نسب اور مقام کے لحاظ سے؛ آمنہ کے والد اور اس طرح نبی کے نانا؛ عبد المطلب نے اپنے بیٹے عبداللہ کے لیے اپنی بیٹی کا انتخاب کیا۔"
  tr: "Seyyid Banu Zuhra kendi zamanında soy ve onur bakımından; Amina'nın babası, Peygamber'in annesi, Peygamber'in anne tarafından dedesiydi; Abdul-Muttalib oğlu Abdullah için kızını seçti."
  id: "Sayyid Banu Zuhra dalam garis keturunan dan kehormatan pada zamannya; ayah Amina, ibu Nabi, adalah kakek dari pihak ibu Nabi; Abdul-Muttalib memilih putrinya untuk putranya Abdullah."
