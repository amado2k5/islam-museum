summary:
  ar: سيد من بني حنيفة باليمامة؛ أُسر وربط في سارية المسجد فأُطلق فأسلم، وقدم مكة معتمراً وقال إنه لن تأتيهم حبة من اليمامة إلا بإذن النبي، وثبت على إسلامه في الردة وقاتل مع العلاء الحضرمي، وقُتل خطأً من بني قيس بن ثعلبة.
  en: A leader of Banu Hanifa in al-Yamama; he was captured and tied to a pillar of the mosque, then released and embraced Islam, came to Mecca for 'umra and said that no grain would reach them from al-Yamama without the Prophet's leave; he held
    to Islam during the apostasy and fought with al-'Ala' al-Hadrami, and was killed by mistake by men of Banu Qays ibn Tha'laba.
