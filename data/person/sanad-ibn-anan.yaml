summary:
  ar: "سند بن عنان بن إبراهيم الأزدي، كنيته أبو علي، من شيوخ الطرطوشي وأبي الطاهر السلفي وأبي الحسن بن المشرف، كان من زهاد العلماء فقيها مالكيا فاضلا، من كتبه «الطراز» شرح المدونة، ولم يكمل، وتوفي بالإسكندرية سنة 541هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3488}"
  en: "Sanad ibn Anan ibn Ibrahim al-Azdi, Abu Ali, a teacher of al-Tartushi and of Abu Tahir al-Salafi, an ascetic and virtuous Maliki jurist. His book al-Tiraz, a commentary on the Mudawwana, was left unfinished; he died in Alexandria in 541 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3488}"
  es: "Sanad ibn Anan ibn Ibrahim al-Azdi, Abu Ali, maestro de al-Tartushi y de Abu Tahir al-Salafi, jurista asceta y virtuoso Maliki. Su libro al-Tiraz, un comentario sobre el Mudawwana, quedó inconcluso; Murió en Alejandría en 541 AH. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3488}"
  fr: "Sanad ibn Anan ibn Ibrahim al-Azdi, Abu Ali, professeur d'al-Tartushi et d'Abu Tahir al-Salafi, juriste malékite ascétique et vertueux. Son livre al-Tiraz, un commentaire sur la Mudawwana, est resté inachevé; il mourut à Alexandrie en 541 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3488}"
  ur: "سناد ابن عنان ابن ابراہیم العزدی، ابو علی، الطرطوشی کے استاد اور ابو طاہر السلفی کے، ایک سنیاسی اور نیک مالکی فقیہ۔ ان کی کتاب التراز، مدوانہ کی تفسیر، نامکمل چھوڑ دی گئی۔ اسکندریہ میں 541ھ میں وفات پائی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص3488}"
