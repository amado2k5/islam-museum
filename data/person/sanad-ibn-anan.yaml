summary:
  ar: "سند بن عنان بن إبراهيم الأزدي، كنيته أبو علي، من شيوخ الطرطوشي وأبي الطاهر السلفي وأبي الحسن بن المشرف، كان من زهاد العلماء فقيها مالكيا فاضلا، من كتبه «الطراز» شرح المدونة، ولم يكمل، وتوفي بالإسكندرية سنة 541هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3488}"
  en: "Sanad ibn Anan ibn Ibrahim al-Azdi, Abu Ali, a teacher of al-Tartushi and of Abu Tahir al-Salafi, an ascetic and virtuous Maliki jurist. His book al-Tiraz, a commentary on the Mudawwana, was left unfinished; he died in Alexandria in 541 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3488}"
