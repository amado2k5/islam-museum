summary:
  en: "A hereditary custodian of the Kaaba from Banu Abd al-Dar who joined the march to Hunayn intending to assassinate the Prophet to avenge his father and uncle slain at Uhud; upon drawing close, he was overcome with awe, and the Prophet placed his hand on his chest and prayed for him, whereupon he embraced Islam and fought loyally."
  ar: "سادن الكعبة من بني عبد الدار؛ خرج مع الجيش إلى حنين مضمرًا قتل النبي ثأرًا لأبيه وعمه المقتولين بأحد، فلما دنا منه حال دونه رعب، فدعاه النبي ووضع يده على صدره فأسلم وحسن إسلامه وقاتل دونه."
