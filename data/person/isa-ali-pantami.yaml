summary:
  ar: "عالم وسياسي نيجيري وُلد في غومبي سنة 1972. درّس في جامعة أبوبكر تافاوا باليوا وفي الجامعة الإسلامية بالمدينة المنورة، وأدار وكالة تطوير تكنولوجيا المعلومات الوطنية (2016–2019)، ثم صار وزيرا للاتصالات والاقتصاد الرقمي (2019–2023). عُرف قبل ذلك واعظا وإماما، وأثارت خطب قديمة له جدلا واسعا سنة 2021 فتنصّل منها علنا."
  en: "Nigerian scholar and politician born in Gombe in 1972. He lectured at Abubakar Tafawa Balewa University and at the Islamic University of Madinah, directed the National Information Technology Development Agency (2016–2019), and served as Minister of Communications and Digital Economy (2019–2023). He was known earlier as a preacher and imam; sermons from his earlier years resurfaced in 2021 and caused a national controversy, after which he publicly recanted those views."
  ur: "نائجریائی عالم اور سیاست دان، 1972 میں گومبے میں پیدا ہوئے۔ انھوں نے ابوبکر تافاوا بالیوا یونیورسٹی اور جامعہ اسلامیہ مدینہ منورہ میں تدریس کی، قومی ادارہ برائے ترقیِ اطلاعاتی ٹیکنالوجی کے ڈائریکٹر جنرل رہے (2016ء–2019ء)، پھر وزیرِ مواصلات و ڈیجیٹل اکانومی بنے (2019ء–2023ء)۔ اس سے پہلے وہ مبلغ اور امام کے طور پر معروف تھے؛ 2021 میں ان کے پرانے خطبات پر تنازع کھڑا ہوا جس کے بعد انھوں نے ان خیالات سے علانیہ رجوع کیا۔"
