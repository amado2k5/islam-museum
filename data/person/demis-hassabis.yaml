  ar: "ديمس هاسابيس (وُلد 27 يوليو 1976 في لندن) باحث بريطاني في الذكاء الاصطناعي ورائد أعمال، شارك في تأسيس ديب مايند سنة 2010، ونال مع جون جامبر جائزة نوبل في الكيمياء سنة 2024 عن أبحاثهما في التنبؤ ببنية البروتين، وأسّس إيسومورفيك لابز ويشغل منصب رئيس مجلس إدارة جوجل ديب مايند وكبير علماء ألفابت."
