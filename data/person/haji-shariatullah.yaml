summary:
  ar: "حاجي شريعة الله (1781 – 1840)، مصلح إسلامي بنغالي ومؤسس الحركة الفرائضية. وُلد في قرية شمائل بفريدبور، وأقام في مكة نحو عقدين من 1799 فدرس الفقه على الحنفي طاهر السومبل المكي الذي أدخله في الطريقة القادرية، ثم عاد إلى البنغال سنة 1818 فدعا إلى الفرائض ومحا ما رآه من البدع، فانتشرت حركته في شرق البنغال وتحولت إلى قوة اجتماعية للفلاحين. توفي سنة 1840 وخلفه ابنه دودو ميان."
  en: "Haji Shariatullah (1781–1840) was a Bengali Islamic reformer and the founder of the Faraizi movement. Born at Shamail in Faridpur, he spent some two decades at Makkah from 1799, studying fiqh under the Hanafi jurist Tahir al-Sumbal Makki, who initiated him into the Qadiriyya, then returned to Bengal in 1818 and preached the obligatory duties and the removal of what he judged innovations; his movement spread across eastern Bengal and became a social force for the peasantry. He died in 1840 and was succeeded by his son Dudu Miyan."
  ur: "حاجی شریعت اللہ ⁦(1781ء – 1840ء)⁩ بنگالی اسلامی مصلح اور فرائضی تحریک کے بانی تھے۔ فرید پور کے گاؤں شمائل میں پیدا ہوئے، 1799ء سے تقریباً دو دہائی مکہ میں گزاریں، وہاں حنفی فقیہ طاہر السومبل مکی سے فقہ پڑھی جنھوں نے انھیں قادریہ میں داخل کیا، پھر 1818ء میں بنگال لوٹ کر فرائض کی تبلیغ اور بدعات کے خاتمے کی دعوت دی؛ ان کی تحریک مشرقی بنگال میں پھیلی اور کسانوں کی سماجی قوت بن گئی۔ 1840ء میں انتقال ہوا اور ان کے بیٹے دودو میاں جانشین ہوئے۔"
  es: "Haji Shariatullah (1781-1840) fue un reformador islámico bengalí y fundador del movimiento Faraizi. Nacido en Shamail, Faridpur, pasó unas dos décadas en La Meca a partir de 1799, estudiando fiqh con el jurista hanafí Tahir al-Sumbal Makki, quien lo inició en la escuela Qadiriyya. Regresó a Bengala en 1818 y predicó los deberes obligatorios y la eliminación de lo que consideraba innovaciones. Su movimiento se extendió por el este de Bengala y se convirtió en una fuerza social para el campesinado. Falleció en 1840 y fue sucedido por su hijo Dudu Miyan."
  fr: "Haji Shariatullah (1781-1840) était un réformateur islamique bengali et le fondateur du mouvement Faraizi. Né à Shamail, dans le district de Faridpur, il passa une vingtaine d'années à La Mecque à partir de 1799, où il étudia le fiqh auprès du juriste hanafite Tahir al-Sumbal Makki, qui l'initia à la Qadiriyya. De retour au Bengale en 1818, il prêcha les devoirs religieux et l'abolition de ce qu'il considérait comme des innovations. Son mouvement se répandit dans tout le Bengale oriental et devint une force sociale pour la paysannerie. Il mourut en 1840 et son fils, Dudu Miyan, lui succéda."
  tr: "Hacı Şeriatullah (1781–1840), Bengalli bir İslami reformcu ve Faraedi hareketinin kurucusuydu. Faridpur'daki Shamail köyünde doğdu ve 1799'dan itibaren yaklaşık yirmi yıl boyunca Mekke'de yaşadı; burada Hanefi Tahir Sombal Mecki'nin yanında fıkıh eğitimi aldı ve Hanafi onu Kadiriyye tarikatına dahil etti. 1818'de Bengal'e döndü, miras yasalarını çağırdı, gördüğü yenilikleri ortadan kaldırdı ve hareketi doğu Bengal'de yayılarak köylüler için sosyal bir güç haline geldi. 1840'ta öldü ve yerine oğlu Dodo Mian geçti."
  id: "Haji Shariatullah (1781–1840) adalah seorang reformis Islam Bengali dan pendiri gerakan Faraedi. Ia lahir di desa Shamail di Faridpur dan tinggal di Mekah selama sekitar dua dekade sejak tahun 1799, di mana ia belajar hukum di bawah bimbingan Hanafi Tahir Sombal Mecki, yang memperkenalkannya ke dalam tarekat Qadiriyya. Ia kemudian kembali ke Bengal pada tahun 1818, menyerukan undang-undang warisan, menghapus inovasi yang dilihatnya, dan gerakannya menyebar ke Bengal timur serta menjadi kekuatan sosial bagi para petani. Ia meninggal pada tahun 1840 dan digantikan oleh putranya, Dodo Mian."

