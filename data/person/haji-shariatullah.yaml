summary:
  ar: "حاجي شريعة الله (1781 – 1840)، مصلح إسلامي بنغالي ومؤسس الحركة الفرائضية. وُلد في قرية شمائل بفريدبور، وأقام في مكة نحو عقدين من 1799 فدرس الفقه على الحنفي طاهر السومبل المكي الذي أدخله في الطريقة القادرية، ثم عاد إلى البنغال سنة 1818 فدعا إلى الفرائض ومحا ما رآه من البدع، فانتشرت حركته في شرق البنغال وتحولت إلى قوة اجتماعية للفلاحين. توفي سنة 1840 وخلفه ابنه دودو ميان."
  en: "Haji Shariatullah (1781–1840) was a Bengali Islamic reformer and the founder of the Faraizi movement. Born at Shamail in Faridpur, he spent some two decades at Makkah from 1799, studying fiqh under the Hanafi jurist Tahir al-Sumbal Makki, who initiated him into the Qadiriyya, then returned to Bengal in 1818 and preached the obligatory duties and the removal of what he judged innovations; his movement spread across eastern Bengal and became a social force for the peasantry. He died in 1840 and was succeeded by his son Dudu Miyan."
  ur: "حاجی شریعت اللہ (1781ء – 1840ء) بنگالی اسلامی مصلح اور فرائضی تحریک کے بانی تھے۔ فرید پور کے گاؤں شمائل میں پیدا ہوئے، 1799ء سے تقریباً دو دہائی مکہ میں گزاریں، وہاں حنفی فقیہ طاہر السومبل مکی سے فقہ پڑھی جنھوں نے انھیں قادریہ میں داخل کیا، پھر 1818ء میں بنگال لوٹ کر فرائض کی تبلیغ اور بدعات کے خاتمے کی دعوت دی؛ ان کی تحریک مشرقی بنگال میں پھیلی اور کسانوں کی سماجی قوت بن گئی۔ 1840ء میں انتقال ہوا اور ان کے بیٹے دودو میاں جانشین ہوئے۔"

