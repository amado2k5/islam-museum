faith:
  - value: sunni-hanafi
    basis: documented
    note: >-
      Two independent publications name the Hanafi school for the man
      and the movement he founded and led. The English article's
      infobox gives his jurisprudence as Hanafi and its Teachings
      section states that his Faraizi movement reformed Bengali Muslim
      practice on the basis of the Hanafi school; Banglapedia's Faraizi
      Movement entry states in text that the Faraizis adhered to the
      Hanafi school, that he studied under Tahir Sombal, an authority
      of the Hanafi school, and that he himself ruled in pursuance of
      the Hanafi law, while its Shariatullah entry records that he
      ruled from the Hedaya, the Hanafi legal manual. Wikidata gives
      only Islam and was not counted.
    sources: [source/wikipedia-haji-shariatullah-en, source/banglapedia-faraizi-movement, source/banglapedia-shariatullah-haji]
  - value: sufi
    basis: documented
    note: >-
      His initiation into a Sufi order is attested for the man himself
      in two independent publications. The English article records that
      at Makkah his teacher Tahir al-Sumbal Makki introduced him to
      tasawwuf and the Qadiriyya, and Banglapedia records that Taher
      Sombal initiated him into the Qadiriyah Tariqah and sent him back
      to Bengal in 1820 with spiritual blessings, after which the
      movement spread. The attestation concerns his own initiation,
      not his family's or his followers'; his public preaching against
      pir-worship and innovation stands alongside it in the same
      sources and is described in his prose.
    sources: [source/wikipedia-haji-shariatullah-en, source/banglapedia-shariatullah-haji]

