summary:
  ar: قرشية أسدية بنت أخي ورقة بن نوفل، قال الشافعي إن لها سابقة قديمة وهجرة؛ روت عن النبي وروى عنها مروان بن الحكم وعروة وسعيد بن المسيب، ومن مروياتها الحديث في الوضوء من مس الذكر.
  en: A Qurashi woman of Banu Asad, niece of Waraqa ibn Nawfal; al-Shafi'i said she had an early precedence and an emigration; she narrated from the Prophet and Marwan ibn al-Hakam, Urwa and Sa'id ibn al-Musayyib narrated from her; among her
    hadith is the one on ablution after touching the private part.
  ur: "بنو اسد کی قریشی خاتون، ورقہ بن نوفل کی بھتیجی؛ شافعی نے کہا کہ ان کو ابتدائی فضیلت اور ہجرت حاصل تھی؛ نبی سے روایت کیا۔"
  es: "Una mujer Qurashi de Banu Asad, sobrina de Waraqa ibn Nawfal; al-Shafi'i dijo que tuvo una precedencia temprana y una emigración; narró del Profeta y Marwan ibn al-Hakam, Urwa y Sa'id ibn al-Musayyib narraron de ella; entre sus hadices está el de la ablución después de tocar las partes íntimas."
  fr: "Une femme qurashi de Banu Asad, nièce de Waraqa ibn Nawfal; al-Shafi'i a dit qu'elle avait une prééminence précoce et une émigration; elle a rapporté du Prophète et Marwan ibn al-Hakam, Urwa et Sa'id ibn al-Musayyib ont rapporté d'elle; parmi ses hadiths se trouve celui sur les ablutions après avoir touché la partie intime."
  tr: "Qureyshiyya Asadiyya bint Akhi Waraqah ibn Nawfal. Al-Shafi'i, eski bir kadim ve göçü olduğunu söyledi; Peygamber'den rivayet etti, Mervan ibn al-Hakam, Urwah ve Sa'id ibn al-Musayyib ise ondan rivayet etti. Rivayetleri arasında, erkek anısına dokunmadan abdest alma hadisi de vardır."
  id: "Qurayshiyya Asadiyya bint Akhi Waraqah ibn Nawfal. Al-Shafi'i berkata bahwa ia memiliki preseden kuno dan migrasi; ia menceritakan dari Nabi, dan Marwan ibn al-Hakam, Urwah, serta Sa'id ibn al-Musayyib menceritakan darinya. Di antara riwayatnya terdapat hadits tentang wudhu dari sentuhan kenangan pria."
