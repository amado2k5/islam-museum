summary:
  ar: قرشية أسدية بنت أخي ورقة بن نوفل، قال الشافعي إن لها سابقة قديمة وهجرة؛ روت عن النبي وروى عنها مروان بن الحكم وعروة وسعيد بن المسيب، ومن مروياتها الحديث في الوضوء من مس الذكر.
  en: A Qurashi woman of Banu Asad, niece of Waraqa ibn Nawfal; al-Shafi'i said she had an early precedence and an emigration; she narrated from the Prophet and Marwan ibn al-Hakam, Urwa and Sa'id ibn al-Musayyib narrated from her; among her
    hadith is the one on ablution after touching the private part.
