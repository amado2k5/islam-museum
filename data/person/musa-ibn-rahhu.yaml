label:
  ar: موسى بن رحو المريني
  en: Musa ibn Rahhu al-Marini
summary:
  ar: "موسى بن رحو بن عبد اللّه بن عبد الحق المريني؛ لحق بجبال غمارة في انتقاض القرابة على السلطان أبي يوسف ثم أجاز إلى الأندلس سنة 670هـ فولاه ابن الأحمر على جميع الغزاة المجاهدين هنالك لما كان كبيرهم ومحل سؤلهم — فكان فاتح رياسة بني رحو على غزاة الأندلس التي خلفه فيها أخوه عبد الحق ثم ابنه حمو."
  en: "Musa ibn Rahhu ibn Abd Allah ibn Abd al-Haqq al-Marini; he joined the Ghumara hills in the princes' revolt against Sultan Abu Yusuf, then crossed to al-Andalus in 670 AH where Ibn al-Ahmar appointed him over all the ghazi-mujahidin there as their elder and spokesman — thus founding the Banu Rahhu leadership over the Andalus ghazis, inherited by his brother Abd al-Haqq then his son Hammu."
