id: person/musa-ibn-rahhu
class: person
label:
  ar: موسى بن رحو المريني
  en: Musa ibn Rahhu al-Marini
  es: "Musa ibn Rahhu al-Marini"
  fr: "Musa ibn Rahhu al-Marini"
  ur: "موسیٰ بن راہو المرینی۔"
summary:
  ar: "موسى بن رحو بن عبد اللّه بن عبد الحق المريني؛ لحق بجبال غمارة في انتقاض القرابة على السلطان أبي يوسف ثم أجاز إلى الأندلس سنة 670هـ فولاه ابن الأحمر على جميع الغزاة المجاهدين هنالك لما كان كبيرهم ومحل سؤلهم — فكان فاتح رياسة بني رحو على غزاة الأندلس التي خلفه فيها أخوه عبد الحق ثم ابنه حمو."
  en: "Musa ibn Rahhu ibn Abd Allah ibn Abd al-Haqq al-Marini; he joined the Ghumara hills in the princes' revolt against Sultan Abu Yusuf, then crossed to al-Andalus in 670 AH where Ibn al-Ahmar appointed him over all the ghazi-mujahidin there as their elder and spokesman — thus founding the Banu Rahhu leadership over the Andalus ghazis, inherited by his brother Abd al-Haqq then his son Hammu."
  es: "Musa ibn Rahhu ibn Abd Allah ibn Abd al-Haqq al-Marini se unió a las colinas de Ghumara en la revuelta de los príncipes contra el sultán Abu Yusuf, y luego cruzó a al-Ándalus en el año 670 de la Hégira, donde Ibn al-Ahmar lo nombró su líder y portavoz entre todos los ghazi-mujahidin de la región, fundando así el liderazgo de los Banu Rahhu sobre los ghazis de Ándalus, que heredó su hermano Abd al-Haqq y luego su hijo Hammu."
  fr: "Musa ibn Rahhu ibn Abd Allah ibn Abd al-Haqq al-Marini; il rejoignit les collines de Ghumara lors de la révolte des princes contre le sultan Abu Yusuf, puis traversa jusqu'en al-Andalus en 670 AH où Ibn al-Ahmar le nomma à la tête de tous les ghazis-mujahidin comme leur aîné et porte-parole — fondant ainsi la direction des Banu Rahhu sur les ghazis d'Andalus, héritée par son frère Abd al-Haqq puis par son fils Hammu."
  ur: "موسیٰ بن راہو بن عبد اللہ بن عبد الحق المرینی، اس نے سلطان ابو یوسف کے خلاف شہزادوں کی بغاوت میں گھمرا پہاڑیوں میں شمولیت اختیار کی، پھر 670 ہجری میں اندلس کو عبور کیا جہاں ابن الاحمر نے اسے وہاں کے تمام غازی مجاہدین پر اپنا بزرگ اور ترجمان مقرر کیا - اس طرح بنو راہو کی قیادت اندلس میں اس کے بعد اس کے بھائی عبد الحاقص کے بیٹے عبد الحاقص کے ذریعہ قائم کی۔"
