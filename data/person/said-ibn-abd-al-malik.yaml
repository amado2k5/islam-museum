  ar: "سعيد بن عبد الملك بن مروان الملقب بسعيد الخير وكان يظهر نسكاً؛ عند البلاذري: كان موضع نهره غيضة ذات سباع فأقطعه إياها الوليد — وقيل الذي أقطعه عمر بن عبد العزيز — فحفر النهر المعروف به وعمّر ما هناك."
  en: "Sa'id ibn Abd al-Malik ibn Marwan, called Sa'id al-Khayr, who displayed piety; in al-Baladhuri: the site of his river was a beast-haunted thicket which al-Walid granted him — some say the grantor was Umar ibn Abd al-Aziz — and he dug the river named for him and settled the land."
