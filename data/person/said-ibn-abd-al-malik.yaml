id: person/said-ibn-abd-al-malik
class: person
label:
  ar: سعيد بن عبد الملك ⁦(سعيد الخير)⁩
  en: Sa'id ibn Abd al-Malik (al-Khayr)
  es: "Sa'id ibn Abd al-Malik (al-Khayr)"
  fr: "Sa'id ibn Abd al-Malik (al-Khayr)"
  ur: "سعید بن عبد الملک ⁦(الخیر)⁩"
summary:
  ar: 'سعيد بن عبد الملك بن مروان الملقب بسعيد الخير وكان يظهر نسكاً؛ عند البلاذري: كان موضع نهره غيضة ذات سباع فأقطعه إياها الوليد — وقيل الذي أقطعه عمر بن عبد العزيز — فحفر النهر المعروف به وعمّر ما هناك.'
  en: 'Sa''id ibn Abd al-Malik ibn Marwan, called Sa''id al-Khayr, who displayed piety; in al-Baladhuri: the site of his river was a beast-haunted thicket which al-Walid granted him — some say the grantor was Umar ibn Abd al-Aziz — and he dug the river named for him and settled the land.'
  es: "Sa'id ibn Abd al-Malik ibn Marwan, llamado Sa'id al-Khayr, que demostró piedad; en al-Baladhuri: el lugar de su río era una espesura infestada de bestias que al-Walid le concedió —algunos dicen que el concesionario fue Umar ibn Abd al-Aziz— y él excavó el río que lleva su nombre y pobló la tierra."
  fr: "Sa'id ibn Abd al-Malik ibn Marwan, appelé Sa'id al-Khayr, qui fit preuve de piété; dans al-Baladhuri: le site de sa rivière était un fourré hanté par des bêtes qu'al-Walid lui avait concédé — certains disent que le donateur était Umar ibn Abd al-Aziz — et il creusa la rivière qui porte son nom et s'installa sur la terre."
  ur: "سعید بن عبد الملک بن مروان، جسے سعید الخیر کہتے ہیں، جنہوں نے تقویٰ کا مظاہرہ کیا۔ البلادوری میں ہے: اس کے دریا کی جگہ ایک درندوں سے بھری ہوئی جھاڑی تھی جو الولید نے اسے عطا کی تھی - کچھ کہتے ہیں کہ عطیہ دینے والا عمر بن عبد العزیز تھا - اور اس نے اس کے نام سے دریا کھود کر زمین کو آباد کیا۔"
