summary:
  ar: "سعيد المفتي (26 يونيو 1898 – 25 مارس 1989)، سياسي ودبلوماسي أردني من أصل شركسي، من أسرة حبجوقة المنتمية إلى قبيلة القبرطاي، ترأس حكومة الأردن ثلاث مرات بين 1950 و1956، وتولى وزارتي الداخلية والمالية، وترأس مجلس الأعيان فترتين (1956–1963 و1965–1974). كان من زعماء الأردن المؤسسين: استضاف الأمير عبد الله في بيته عند وصوله من الحجاز سنة 1921، وقاد سنة 1920 قوة من ألف مقاتل شركسي إلى سوريا نصرة للملك فيصل بعد ميسلون، وكان عضوًا في مجلس الشورى في العشرين من عمره ومن مؤسسي حزب الشعب الأردني سنة 1927، وتقاعد سنة 1974 وتوفي ودُفن في عمان."
  en: "Sa'id al-Mufti (26 June 1898 – 25 March 1989) was a Jordanian politician and diplomat of Circassian origin, of the Habjoka family of the Kabarday tribe, who served three terms as Prime Minister of Jordan between 1950 and 1956, held the interior and finance portfolios, and presided over the Senate in two periods (1956–1963 and 1965–1974). He was one of Jordan's founding notables: he hosted the Emir Abdullah at his house on his arrival from the Hejaz in 1921, led a force of a thousand Circassian fighters to Syria in 1920 in support of King Faisal after Maysalun, sat on the Consultative Council at the age of twenty, co-founded the Jordan People's Party in 1927, retired in 1974, and died and was buried in Amman."
  ur: "سعید المفتی (26 جون 1898ء – 25 مارچ 1989ء) اردنی سیاست دان اور سفارت کار تھے، اصلًا چرکسی، قبیلہ قبرطای کے خاندان حبجوقہ سے؛ وہ 1950ء اور 1956ء کے درمیان تین مرتبہ اردن کے وزیرِ اعظم رہے، وزارتِ داخلہ و خزانہ سنبھالیں اور دو ادوار (1956ء–1963ء اور 1965ء–1974ء) میں مجلس اعیان کے صدر رہے۔ وہ اردن کے بانی زعما میں سے تھے: 1921ء میں امیر عبداللہ کی حجاز سے آمد پر ان کی اپنے گھر میزبانی کی، 1920ء میں میسلون کے بعد شاہ فیصل کی حمایت میں ایک ہزار چرکسی جنگجوؤں کی قیادت کرتے ہوئے شام گئے، بیس سال کی عمر میں مجلس شوریٰ کے رکن بنے اور 1927ء میں حزب الشعب الاردنی کے بانیوں میں شامل ہوئے؛ 1974ء میں سبکدوش ہوئے اور عمان ہی میں وفات پائی اور دفن ہوئے۔"
