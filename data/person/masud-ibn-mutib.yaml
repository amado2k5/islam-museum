summary:
  ar: "مسعود بن معتب الثقفي من بطن الأحلاف؛ قدم المدينة سفيراً عنهم يطلب حلف الأنصار على بني مالك في حرب بطني ثقيف، فردّه أحيحة بن الجلاح بمثل قوله إن أخاك الذي تركته وراءك فارجع إليه وصالحه ولو بجدع أنفك وأذنك، وزوده بغلام يبني الآطام فبنى له أطماً بالطائف فكان أول أطم بني بها، ولم تكن بينهم بعد ذلك حرب تذكر {cite:kamil-ibn-al-athir p. 513}."
  en: "Mas'ud ibn Mu'tib of Thaqif's Ahlaf moiety, sent to Medina to seek the Ansar's alliance against Banu Malik; Uhayha ibn al-Julah refused with the famous counsel — 'your brother is the one you left behind; go back and make peace with him though it cost your nose and ear' — and gave him a slave who raised Ta'if's first fortress-tower {cite:kamil-ibn-al-athir p. 513}."
