summary:
  ar: "مسعود بن معتب الثقفي من بطن الأحلاف؛ قدم المدينة سفيراً عنهم يطلب حلف الأنصار على بني مالك في حرب بطني ثقيف، فردّه أحيحة بن الجلاح بمثل قوله إن أخاك الذي تركته وراءك فارجع إليه وصالحه ولو بجدع أنفك وأذنك، وزوده بغلام يبني الآطام فبنى له أطماً بالطائف فكان أول أطم بني بها، ولم تكن بينهم بعد ذلك حرب تذكر {cite:kamil-ibn-al-athir p. 513}."
  en: "Mas'ud ibn Mu'tib of Thaqif's Ahlaf moiety, sent to Medina to seek the Ansar's alliance against Banu Malik; Uhayha ibn al-Julah refused with the famous counsel — 'your brother is the one you left behind; go back and make peace with him though it cost your nose and ear' — and gave him a slave who raised Ta'if's first fortress-tower {cite:kamil-ibn-al-athir p. 513}."
  es: "Mas'ud ibn Mu'tib, de la facción Ahlaf de Thaqif, fue enviado a Medina para buscar la alianza de los Ansar contra Banu Malik; Uhayha ibn al-Julah se negó con el famoso consejo: «Tu hermano es a quien dejaste atrás; regresa y haz las paces con él aunque te cueste la nariz y la oreja», y le dio un esclavo que levantó la primera torre-fortaleza de Ta'if {cite:kamil-ibn-al-athir p. 513}."
  fr: "Mas'ud ibn Mu'tib, de la moitié Ahlaf de Thaqif, fut envoyé à Médine pour solliciter l'alliance des Ansar contre Banu Malik; Uhayha ibn al-Julah refusa avec le célèbre conseil — « ton frère est celui que tu as laissé derrière; retourne et fais la paix avec lui, même si cela te coûte le nez et l'oreille » — et lui donna un esclave qui érigea la première tour-forteresse de Ta'if {cite:kamil-ibn-al-athir p. 513}."
