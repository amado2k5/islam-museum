  ar: "زعيم الطريقة الشاذلية الجزولية؛ لما عاين أهل القصر الكبير النصارى واستبطأوا وصول السلطان عبد الملك أرادوا الفرار والتحصن في الجبال فقام بتثبيتهم، ولم يكل ولم يمل في شحذ الهمم ورفع المعنويات؛ وقاد أحد جناحي الجيش المغربي في وادي المخازن وأبلى بلاءً حسناً وثبت حتى منح الله النصر، ثم تورع عن الغنيمة وعف عنها {cite:dawlat-uthmaniyya-salabi p. 262-263}."
  en: "Chief of the Shadhili-Jazuli order; when the people of al-Qasr al-Kabir saw the Christians and, despairing of the sultan's arrival, meant to flee to the mountains, he steadied them — tireless in sharpening resolve and raising morale — led one wing of the Moroccan army at Wadi al-Makhazin, fought well and held fast until victory, then abstained from all share of the booty {cite:dawlat-uthmaniyya-salabi p. 262-263}."
