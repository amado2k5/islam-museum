summary:
  ar: "زعيم الطريقة الشاذلية الجزولية؛ لما عاين أهل القصر الكبير النصارى واستبطأوا وصول السلطان عبد الملك أرادوا الفرار والتحصن في الجبال فقام بتثبيتهم، ولم يكل ولم يمل في شحذ الهمم ورفع المعنويات؛ وقاد أحد جناحي الجيش المغربي في وادي المخازن وأبلى بلاءً حسناً وثبت حتى منح الله النصر، ثم تورع عن الغنيمة وعف عنها {cite:dawlat-uthmaniyya-salabi p. 262-263}."
  en: "Chief of the Shadhili-Jazuli order; when the people of al-Qasr al-Kabir saw the Christians and, despairing of the sultan's arrival, meant to flee to the mountains, he steadied them — tireless in sharpening resolve and raising morale — led one wing of the Moroccan army at Wadi al-Makhazin, fought well and held fast until victory, then abstained from all share of the booty {cite:dawlat-uthmaniyya-salabi p. 262-263}."
  fr: "Chef de la confrérie shadhilite-jazulite ; lorsque les gens d'al-Qasr al-Kabir virent les chrétiens et, désespérant de l'arrivée du sultan, voulurent fuir vers les montagnes, il les raffermit — infatigable pour aiguiser la résolution et relever le moral —, commanda une aile de l'armée marocaine à Wadi al-Makhazin, combattit bien et tint ferme jusqu'à la victoire, puis s'abstint de toute part du butin {cite:dawlat-uthmaniyya-salabi p. 262-263}."
  es: "Jefe de la orden Shadhili-Jazuli; cuando la gente de al-Qasr al-Kabir vio a los cristianos y, desesperada por la llegada del sultán, pretendía huir a las montañas, él los tranquilizó —incansable en fortalecer la determinación y elevar la moral— dirigió un ala del ejército marroquí en Wadi al-Makhazin, luchó bien y resistió hasta la victoria, y luego se abstuvo de participar en el botín {cite:dawlat-uthmaniyya-salabi p. 262-263}."
  ur: "شدھیلی-جزولی آرڈر کے سربراہ؛ جب قصر الکبیر کے لوگوں نے عیسائیوں کو دیکھا اور سلطان کی آمد سے مایوس ہو کر پہاڑوں کی طرف بھاگنا تھا تو اس نے انہیں ثابت قدم رکھا - عزم کو تیز کرنے اور حوصلے بلند کرنے میں انتھک - وادی المخازین میں مراکش کی فوج کے ایک بازو کی قیادت کی، یہاں تک کہ فتح سے ہمکنار ہو گئے اور سب نے فتح حاصل کی۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 262-263}۔"
