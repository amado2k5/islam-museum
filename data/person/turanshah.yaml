names:
  - { value: "الملك المعظم غياث الدين توران شاه بن الملك الصالح نجم الدين أيوب", kind: full }
died: { edtf: "1250-05~", hijri: "0648-02~", calendar: julian, precision: month, status: tradition, derived: true, note: "قُتل في صفر سنة ثمان وأربعين وستمائة — وقِعت ترجمته في سنة 648 {cite:shadharat-dhahab p. 248-249}." }
summary:
  ar: "ولد الملك الصالح أيوب، استدعته أمه شجر الدر ليتملك مصر لما مات أبوه سنة سبع وأربعين فحضر ثم لم يلبث أن وثب عليه غلمان أبيه فقتلوه في محرم سنة ثمان وأربعين وست مئة {cite:tarikh-khulafa-minhaj-1434 p. 709}؛ وذُكر أنه ساء سيرته فيهم حتى قطعوا النعمة فوثب عليه مماليك أبيه البحرية ليلاً فهرب إلى برج على النيل كان فيه خشب ونفط فرماه بالنفط وأشعل فيه النار فخرج إلى النهر فتلقوه بالسيوف وبقي في النيل ثلاثة أيام لا يُدفن حتى جمعوا له قبراً، وقال ابن الدجاجية فيه أبياتاً {cite:shadharat-dhahab p. 248-249}."
  en: "Al-Salih's son, fetched to rule Egypt — his father's ghilman killed him in Muharram 648 {cite:tarikh-khulafa-minhaj-1434 p. 709}; the Bahriyya mamluks fired his naft-tower on the Nile, cut him down as he reached the water, and left him three days unburied {cite:shadharat-dhahab p. 248-249}."
  es: "El hijo de Al-Salih, traído para gobernar Egipto, fue asesinado por el ghilman de su padre en Muharram 648 {cite:tarikh-khulafa-minhaj-1434 p. 709}; los mamelucos Bahriyya dispararon contra su naft-torre en el Nilo, lo abatieron cuando llegó al agua y lo dejaron tres días sin sepultar {cite:shadharat-dhahab p. 248-249}."
  fr: "Le fils d'Al-Salih, appelé à gouverner l'Égypte, fut tué par le ghilman de son père en Muharram 648 {cite:tarikh-khulafa-minhaj-1434 p. 709}; les mamelouks bahreïnis firent feu sur sa tour naft sur le Nil, le tuèrent alors qu'il atteignait l'eau et le laissèrent trois jours sans sépulture {cite:shadharat-dhahab p. 248-249}."
  ur: "الصالح کا بیٹا، مصر پر حکومت کرنے کے لیے لایا گیا - اس کے والد کے غلمان نے اسے محرم 648 میں قتل کر دیا۔ 709} بحریہ مملوکوں نے اس کا برج نیل پر فائر کیا، پانی کے قریب پہنچتے ہی اسے کاٹ ڈالا، اور اسے تین دن تک بے دفن چھوڑ دیا۔ 248-249}۔"
