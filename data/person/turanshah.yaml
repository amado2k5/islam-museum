summary:
  ar: "ولد الملك الصالح أيوب، استدعته أمه شجر الدر ليتملك مصر لما مات أبوه سنة سبع وأربعين فحضر ثم لم يلبث أن وثب عليه غلمان أبيه فقتلوه في محرم سنة ثمان وأربعين وست مئة {cite:tarikh-khulafa-minhaj-1434 p. 709}؛ وذُكر أنه ساء سيرته فيهم حتى قطعوا النعمة فوثب عليه مماليك أبيه البحرية ليلاً فهرب إلى برج على النيل كان فيه خشب ونفط فرماه بالنفط وأشعل فيه النار فخرج إلى النهر فتلقوه بالسيوف وبقي في النيل ثلاثة أيام لا يُدفن حتى جمعوا له قبراً، وقال ابن الدجاجية فيه أبياتاً {cite:shadharat-dhahab p. 248-249}."
  en: "Al-Salih's son, fetched to rule Egypt — his father's ghilman killed him in Muharram 648 {cite:tarikh-khulafa-minhaj-1434 p. 709}; the Bahriyya mamluks fired his naft-tower on the Nile, cut him down as he reached the water, and left him three days unburied {cite:shadharat-dhahab p. 248-249}."
