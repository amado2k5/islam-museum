summary:
  ar: "أبو عيسى خلاد بن خالد الشيباني الكوفي الصيرفي، راوي قراءة حمزة الزيات عن سُليم؛ توفي سنة 220هـ، وقال فيه ابن الجزري إنه إمام في القراءة ثقة عارف محقق مجود أستاذ ضابط متقن، ونقل عن الداني أنه أضبط أصحاب سليم وأجلهم {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  en: "Abu 'Isa Khallad ibn Khalid al-Shaybani of Kufa, a money-changer by trade, transmitter of the reading of Hamza al-Zayyat through Sulaym; he died in 220 AH. Ibn al-Jazari calls him a reliable imam of the reading, knowing, careful and precise, and quotes al-Dani that he was the most exact and most distinguished of Sulaym's companions {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  ur: "ابو عیسیٰ خلاد بن خالد شیبانی کوفی، صیرفی، سُلیم کے واسطے سے حمزہ زیات کی قراءت کے راوی؛ 220ھ میں فوت ہوئے۔ ابن الجزری انہیں قراءت کا امام، ثقہ، عارف، محقق اور ضابط کہتے ہیں اور دانی سے نقل کرتے ہیں کہ وہ سلیم کے ساتھیوں میں سب سے زیادہ ضابط اور جلیل تھے {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  es: "Abu 'Isa Khallad ibn Khalid al-Shaybani de Kufa, cambista de oficio, fue el transmisor de la lectura de Hamza al-Zayyat a través de Sulaym; murió en el año 220 de la Hégira. Ibn al-Jazari lo llama un imán confiable de la lectura, sabio, cuidadoso y preciso, y cita a al-Dani diciendo que fue el más exacto y distinguido de los compañeros de Sulaym {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  fr: "Abu 'Isa Khallad ibn Khalid al-Shaybani de Kufa, changeur de monnaie de profession, transmetteur de la lecture de Hamza al-Zayyat par l'intermédiaire de Sulaym; il mourut en 220 AH. Ibn al-Jazari le décrit comme un imam fiable de la lecture, savant, consciencieux et précis, et cite al-Dani selon lequel il était le plus exact et le plus distingué des compagnons de Sulaym {cite:nashr-dahman-damascus-1345-v1 p. 177}."
