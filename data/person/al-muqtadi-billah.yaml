education:
  did_you_know:
    ar: "المقتدي بالله الخليفة العباسي بويع وله تسع عشرة سنة؛ مات أبوه في حياة القائم وهو حمل فوُلد بعد وفاة أبيه بستة أشهر."
    en: "Al-Muqtadi bi'llah was pledged the caliphate at nineteen; his father had died in al-Qa'im's lifetime while he was still in the womb — born six months after his father's death."
    ur: "مقتدی باللہ کو انیس برس کی عمر میں خلافت کی بیعت ملی؛ اس کے باپ قائم کے زمانے میں فوت ہوئے جب وہ شکمِ مادر میں تھا — باپ کی وفات کے چھ ماہ بعد پیدا ہوا۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/tarikh-khulafa-minhaj-1434]
