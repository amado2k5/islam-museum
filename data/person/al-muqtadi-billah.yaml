label: { ar: "المقتدي بأمر الله عبد الله بن محمد بن القائم", en: "al-Muqtadi bi-Amr Allah Abdullah ibn Muhammad ibn al-Qa'im" }
summary:
  ar: "خليفة عباسي [٤٦٧–٤٨٧هـ]، أبو القاسم عبد الله بن محمد بن القائم، مات أبوه في حياة القائم وهو حمل فولد بعد وفاة أبيه بستة أشهر وأمه أم ولد اسمها أرجوان، بويع له وله تسع عشرة سنة بحضرة أبي إسحاق الشيرازي وابن الصباغ والدامغاني، وظهر في أيامه خيرات كثيرة وكانت قواعد الخلافة باهرة، ومن محاسنه أنه نفى المغنيات والخواطئ ببغداد وأمر ألا يدخل أحد الحمام إلا بمئزر وخرب أبراج الحمام صيانة لحرم الناس وكان ديناً خيراً قوي النفس عالي الهمة من نجباء بني العباس، وولى أبا شجاع محمد بن الحسين الوزارة ولقبه ظهير الدين ويظن السيوطي ذلك أول حدوث التلقيب بالإضافة إلى الدين، ومات فجأة فقيل إن جاريته شمس النهار سمته {cite:tarikh-khulafa-minhaj-1434 p. 650-654}. وبويع يوم الجمعة ثالث عشر شعبان 467هـ وجلس في دار الشجرة وكان أول من بايعه الشريف أبو جعفر وأنشد «إذا سيد منا مضى قام سيد»، ودفن القائم في حجرته {cite:muntazam-ibn-al-jawzi j.8 p.292}. ولما استفحل أمر تتش بعد وفاة أخيه ملك شاه وكاتب المقتدي يسأله أن يقيم له الخطبة وخلط السؤال بنوع تهديد رد عليه بكتاب خشن «فأما في هذه الحال فلا سبيل إلى ما التمسته ولا طريق إلى ما تحاوله» وكتب أخيراً له خطبة {cite:muntazam-ibn-al-jawzi j.8 p.293}."
  en: "Abbasid caliph [467–487], posthumous son of the Qa'im's son Muhammad, born six months after his father's death and hailed at nineteen before Abu Ishaq al-Shirazi. His reign saw the caliphate's footing splendid again: he expelled the singing-girls and prostitutes, required the izar in the baths and razed their towers. His vizier Abu Shuja' was titled Zahir al-Din — Suyuti thinks the first din-compound title. He died suddenly, his slave-girl Shams al-Nahar suspected of poison {cite:tarikh-khulafa-minhaj-1434 p. 650-654}."
