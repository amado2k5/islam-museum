label: { ar: "المقتدي بأمر الله عبد الله بن محمد بن القائم", en: "al-Muqtadi bi-Amr Allah Abdullah ibn Muhammad ibn al-Qa'im", fr: "al-Muqtadi bi-Amr Allah Abdullah ibn Muhammad ibn al-Qa'im" , ur: "مقتدی باللہ", es: "al-Muqtadi bi-Amr Allah Abdullah ibn Muhammad ibn al-Qa'im"}
summary:
  ar: "خليفة عباسي [٤٦٧–٤٨٧هـ]، أبو القاسم عبد الله بن محمد بن القائم، مات أبوه في حياة القائم وهو حمل فولد بعد وفاة أبيه بستة أشهر وأمه أم ولد اسمها أرجوان، بويع له وله تسع عشرة سنة بحضرة أبي إسحاق الشيرازي وابن الصباغ والدامغاني، وظهر في أيامه خيرات كثيرة وكانت قواعد الخلافة باهرة، ومن محاسنه أنه نفى المغنيات والخواطئ ببغداد وأمر ألا يدخل أحد الحمام إلا بمئزر وخرب أبراج الحمام صيانة لحرم الناس وكان ديناً خيراً قوي النفس عالي الهمة من نجباء بني العباس، وولى أبا شجاع محمد بن الحسين الوزارة ولقبه ظهير الدين ويظن السيوطي ذلك أول حدوث التلقيب بالإضافة إلى الدين، ومات فجأة فقيل إن جاريته شمس النهار سمته {cite:tarikh-khulafa-minhaj-1434 p. 650-654}. وبويع يوم الجمعة ثالث عشر شعبان 467هـ وجلس في دار الشجرة وكان أول من بايعه الشريف أبو جعفر وأنشد «إذا سيد منا مضى قام سيد»، ودفن القائم في حجرته {cite:muntazam-ibn-al-jawzi j.8 p.292}. ولما استفحل أمر تتش بعد وفاة أخيه ملك شاه وكاتب المقتدي يسأله أن يقيم له الخطبة وخلط السؤال بنوع تهديد رد عليه بكتاب خشن «فأما في هذه الحال فلا سبيل إلى ما التمسته ولا طريق إلى ما تحاوله» وكتب أخيراً له خطبة {cite:muntazam-ibn-al-jawzi j.8 p.293}."
  en: "Abbasid caliph [467–487], posthumous son of the Qa'im's son Muhammad, born six months after his father's death and hailed at nineteen before Abu Ishaq al-Shirazi. His reign saw the caliphate's footing splendid again: he expelled the singing-girls and prostitutes, required the izar in the baths and razed their towers. His vizier Abu Shuja' was titled Zahir al-Din — Suyuti thinks the first din-compound title. He died suddenly, his slave-girl Shams al-Nahar suspected of poison {cite:tarikh-khulafa-minhaj-1434 p. 650-654}."
  fr: "Le calife abbasside [467-487], fils posthume du fils de Qa'im Muhammad, né six mois après la mort de son père et salué à dix-neuf ans avant Abu Ishaq al-Shirazi. Son règne a vu le pied du califat splendide à nouveau : il a expulsé les filles qui chantaient et les prostituées, a exigé l'izar dans les bains et rasé leurs tours. Son vizir Abu Shuja' s'appelait Zahir al-Din - Suyuti pense que le premier titre composé de din. Il est mort subitement, son esclave Shams al-Nahar soupçonné de poison {cite:tarikh-khulafa-minhaj-1434 p. 650-654}."
  ur: "عباسی خلیفہ، جنہوں نے ۴۶۷ھ سے ۴۸۷ھ تک حکومت کی؛ قائم کے پوتے تھے اور ابو اسحاق شیرازی کی موجودگی میں ان کی بیعت ہوئی۔ {cite:tarikh-khulafa-minhaj-1434}"
  es: "Califa abasí [467–487], hijo póstumo de Muhammad, hijo del Qa'im, nacido seis meses después de la muerte de su padre y aclamado a los diecinueve años antes que Abu Ishaq al-Shirazi. Durante su reinado, el califato recuperó su esplendor: expulsó a las cantantes y prostitutas, exigió el uso del izar en los baños y arrasó sus torres. Su visir, Abu Shuja', ostentaba el título de Zahir al-Din —Suyuti cree que fue el primer título compuesto din—. Murió repentinamente, y se sospechó que su esclava, Shams al-Nahar, había sido envenenada {cite:tarikh-khulafa-minhaj-1434 p. 650-654}."
  tr: "Bir Abbasi halifesi [467–487 H.C.], Ebu el-Kasım Abdullah ibn Muhammed bin el-Kaim, babası el-Kaim hayattayken hamileyken vefat etmiş ve babasının ölümünden altı ay sonra doğmuştur. Annesi Arjwan adında bir anneydi. Ebu İshaq el-Şirazi, İbn el-Sebbe ve el-Damghani'nin huzurunda on dokuz yıl boyunca ona bağlılık yemini etti. Döneminde birçok nimet ortaya çıktı ve halifeliğin temelleri parlaktı. Erdemleri arasında, Bağdat'ta şarkıcı ve vaizleri yasaklaması, hamama sadece bel beziyle girilmesini emretti ve halkın kutsallığını korumak için kuleleri yıktı. Dindardı Abbasiler soyluları arasında iyi, güçlü iradeli ve hırslı bir adamdı. Ebu Şuca' Muhammed bin el-Hüseyin onu bakan olarak atadı ve Zahir al-Din unvanını aldı. El-Süyuti, bu unvanın ilk kez din dışında kullanıldığına inanır. Ani bir şekilde öldü ve hizmetçisi Şems el-Nahar'ın ona bu ismi verdiği söylenir {atıf:Tarikh-khulafa-minhaj-1434, s. 650-654}. Cuma günü, Şa'ban 467 Hicri'nin on üçüncü günü, bağlılık yemini etti ve ağaç evde oturdu. Ona ilk bağlılık yemini eden, \"Aramızdan bir efendi ayrılırsa, bir efendi dirilir\" diyen Şerif Ebu Ca'fer oldu ve lider odasında gömüldü {atıf:Muntazam-ibn-al-Jawzi j.8 s.292}. Kardeşi Malik Şah'ın ve takipçinin sekreteri öldükten sonra durum kötüleştiğinde, vaazı yapmasını istedi ve soruyu bir tür tehditle karıştırdı, sert bir mektupla yanıt verdi: \"Ama bu durumda, aradığın şeyin yolu yok, ne de yapmaya çalıştığın şeyin bir yolu yok.\" Sonunda onun için bir vaaz yazdı {cite:muntazam-ibn-al-jawzi j.8 s.293}."
  id: "Seorang khalifah Abbasiyah [467–487 H], Abu al-Qasim Abdullah ibn Muhammad ibn al-Qa'im, yang ayahnya meninggal saat al-Qa'im masih hamil dan lahir enam bulan setelah kematian ayahnya. Ibunya adalah seorang ibu bernama Arjwan. Ia diikrarkan setia kepadanya selama sembilan belas tahun di hadapan Abu Ishaq al-Shirazi, Ibn al-Sabbagh, dan al-Damghani. Selama masa kejayaannya, banyak berkah muncul, dan fondasi kekhalifahan sangat cemerlang. Di antara kebajikan yang ia miliki adalah melarang penyanyi dan pengkhotbah di Baghdad, memerintahkan agar tidak ada yang masuk ke pemandian kecuali dengan kain pinggang, dan menghancurkan menara untuk melindungi kesucian rakyat. Ia seorang religius Ia adalah pria yang baik, berkemauan kuat, dan ambisius di antara bangsawan Abbasiyah. Abu Shuja' Muhammad ibn al-Husayn mengangkatnya sebagai menteri, dan ia diberi gelar Zahir al-Din. Al-Suyuti percaya ini adalah pertama kalinya gelar tersebut digunakan selain agama. Ia meninggal secara tiba-tiba, dan dikatakan bahwa pelayannya Shams al-Nahar menamainya {cite:Tarikh-khulafa-minhaj-1434, hlm. 650-654}. Ia diikrarkan setia pada hari Jumat, tanggal tiga belas Sha'ban 467 H, dan duduk di rumah pohon. Yang pertama mengucapkan kesetiaan kepadanya adalah Sharif Abu Ja'far, yang mengucapkan, \"Jika seorang tuan di antara kita pergi, seorang tuan akan bangkit,\" dan pemimpin tersebut dimakamkan di kamarnya {cite:muntazam-ibn-al-jawzi j.8 hlm.292}. Ketika situasi memburuk setelah kematian saudaranya Malik Shah dan sekretaris pengikutnya, ia memintanya untuk mengadakan khotbah dan mencampur pertanyaan itu dengan semacam ancaman, ia membalas dengan surat keras: \"Tapi dalam hal ini, tidak ada jalan ke apa yang kau cari, juga tidak ada jalan menuju apa yang kau coba lakukan.\" Akhirnya, ia menulis khotbah untuknya {cite:muntazam-ibn-al-jawzi j.8 hlm.293}."
