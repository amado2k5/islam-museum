summary:
  ar: "محمد بن أحمد بن عبد الهادي، شمس الدين أبو عبد الله، ابن قدامة المقدسي الجماعيلي ثم الدمشقي الصالحي، حافظ حنبلي أخذ عن ابن تيمية والذهبي، صنف ما يزيد على سبعين كتابا، توفي بظاهر دمشق سنة 744 هـ الموافقة 1343 م."
  en: "Muhammad ibn Ahmad ibn Abd al-Hadi, Shams al-Din Abu Abd Allah, of Jamma'ili origin and later of al-Salihiyya in Damascus, a Hanbali hafiz of hadith who studied under Ibn Taymiyya and al-Dhahabi and wrote over seventy books; died on the outskirts of Damascus in 744 AH (1343)."
