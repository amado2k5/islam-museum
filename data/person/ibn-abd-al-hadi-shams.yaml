roles: [scholar]
gender: male
summary:
  ar: "محمد بن أحمد بن عبد الهادي، شمس الدين أبو عبد الله، ابن قدامة المقدسي الجماعيلي ثم الدمشقي الصالحي، حافظ حنبلي أخذ عن ابن تيمية والذهبي، صنف ما يزيد على سبعين كتابا، توفي بظاهر دمشق سنة 744 هـ الموافقة 1343 م."
  en: "Muhammad ibn Ahmad ibn Abd al-Hadi, Shams al-Din Abu Abd Allah, of Jamma'ili origin and later of al-Salihiyya in Damascus, a Hanbali hafiz of hadith who studied under Ibn Taymiyya and al-Dhahabi and wrote over seventy books; died on the outskirts of Damascus in 744 AH (1343)."
  es: "Muhammad ibn Ahmad ibn Abd al-Hadi, Shams al-Din Abu Abd Allah, de origen jamma'ili y posteriormente de al-Salihiyya en Damasco, un hafiz hanbalí de hadices que estudió con Ibn Taymiyya y al-Dhahabi y escribió más de setenta libros; murió en las afueras de Damasco en el año 744 AH (1343)."
  fr: "Muhammad ibn Ahmad ibn Abd al-Hadi, Shams al-Din Abu Abd Allah, d'origine Jamma'ili et plus tard d'al-Salihiyya à Damas, un hafiz hanbalite de hadith qui a étudié sous Ibn Taymiyya et al-Dhahabi et a écrit plus de soixante-dix livres; est mort à la périphérie de Damas en 744 AH (1343)."
  ur: "محمد بن احمد بن عبد الہادی، شمس الدین ابو عبد اللہ، جمعیلی نژاد اور بعد میں دمشق میں الصالحیہ سے تعلق رکھنے والے، حدیث کے ایک حنبلی حافظ جنہوں نے ابن تیمیہ اور الذہبی سے تعلیم حاصل کی اور ستر سے زیادہ کتابیں لکھیں۔ دمشق کے مضافات میں 744ھ (1343) میں وفات پائی۔"
  tr: "Muhammed bin Ahmed ibn Abd al-Hadi, Şemseddin Ebu Abdullah, İbn Qudamah al-Maqdisi al-Jama'ili ve ardından el-Dimashqi al-Salihi, İbn Teymiye ve el-Dhahabi'nin yanında eğitim almış, yetmişten fazla kitap yazmış ve 744 Hicri yılında, M.S. 1343'e denk gelen Şam çevresinde ölmüştür."
  id: "Muhammad ibn Ahmad ibn Abd al-Hadi, Shams al-Din Abu Abdullah, Ibn Qudamah al-Maqdisi al-Jama'ili lalu al-Dimashqi al-Salihi, seorang ulama hadis Hanbali yang belajar di bawah bimbingan Ibn Taymiyyah dan al-Dhahabi, menulis lebih dari tujuh puluh buku, dan meninggal di pinggiran Damaskus pada tahun 744 H, yang bertepatan dengan tahun 1343 M."
