summary:
  ar: "أبو عبد الله محمد بن الحسين الخشوعي العابد، كانت العبادة حرفته والتلذذ بالعبرة شهوته، وكان بليغ الكلام في تأديب النساك والعباد، وتخرج به جماعة من السابقين والرواد. قال إن حياة الصديقين في المراعاة، ومن لزم الخدمة ورث منازل القربة. وذكر أبو نعيم تلامذته وطبقتهم، وعدّ عُبّاد الشام، وذكر أن جماعة منهم تخرجوا بمحمد بن يوسف البنا."
  en: "Abu Abd Allah Muhammad ibn al-Husayn al-Khushani, the worshipper, for whom worship was his trade and weeping his delight. He was eloquent in disciplining ascetics and worshippers, and many forerunners came out of his teaching. He said that the life of the truthful lies in watchfulness, and that whoever keeps to service inherits the stations of nearness. Abu Nu'aym names his students and their circle, lists the ascetics of Syria, and notes that a group of them were trained by Muhammad ibn Yusuf al-Banna."
  ur: "ابو عبد اللہ محمد بن الحسین الخشوعی عابد، جن کا پیشہ عبادت اور جن کی لذت آنسو تھی۔ وہ زاہدوں اور عبادت گزاروں کی تربیت میں فصیح تھے، اور ان سے بہت سے آگے بڑھنے والے نکلے۔ انہوں نے کہا کہ صدیقین کی زندگی نگہبانی میں ہے، اور جو خدمت سے وابستہ رہے وہ قربت کے مقامات کا وارث ہوتا ہے۔ ابو نعیم نے ان کے شاگردوں اور ان کے طبقے کا ذکر کیا ہے، شام کے عابدوں کی فہرست دی ہے، اور بتایا ہے کہ ان میں سے ایک جماعت محمد بن یوسف البنا کی تربیت یافتہ تھی۔"
