summary:
  ar: خادم الرشيد، ندبه لأخذ رأس جعفر بن يحيى فقال له جعفر ارجع إليه فأعلمه أنك نفذت فإن أصبح نادماً كانت حياتي على يديك جارية، فأسره إلى مضرب الرشيد فلما سمعه يقول ائتني به وإلا قتلتك قبله عصب عينيه بمنديل من كمه ومد رقبته فضربها، ثم أمر الرشيد بضرب عنق ياسر نفسه وقال إني لا أقدر أن أنظر إلى قاتل جعفر {cite:muruj-al-dhahab p. 364-366}.
  en: 'The servant ordered to fetch Ja''far''s head — granted his own death the moment it was laid before al-Rashid: ''I cannot look on Ja''far''s killer'' {cite:muruj-al-dhahab p. 364-366}.'
  es: "El sirviente al que se le ordenó traer la cabeza de Ja'far, aceptó su propia muerte en el momento en que fue colocada ante al-Rashid: 'No puedo mirar al asesino de Ja'far' {cite:muruj-al-dhahab p. 364-366}."
  fr: "Le serviteur chargé d'aller chercher la tête de Ja'far — a consenti à sa propre mort au moment où elle fut déposée devant al-Rashid: « Je ne peux pas regarder le meurtrier de Ja'far » {cite: muruj-al-dhahab p. 364-366}."
  ur: "خادم نے جعفر کا سر لانے کا حکم دیا - جس وقت الرشید کے سامنے رکھا گیا تھا اس نے اپنی موت کو قبول کر لیا: 'میں جعفر کے قاتل کو نہیں دیکھ سکتا'۔ 364-366}۔"
  tr: "El-Reşid'in hizmetçisi ona Cafer bin Yahya'nın başını almasını söyledi. Ca'far ona, 'Geri dön ve bunu yaptığını bildir, eğer pişman olursa, hayatım senin elinde olacak.' dedi. Onu Al-Rashid'in birliğine götürdü ve 'Onu getir yoksa seni öldürürüm' dediğini duyunca onu öptü, ardından gözlerini kolundaki mendille kapattı, boynunu uzattı ve vurdu. Sonra Al-Rashid, Yasir'e kendi boynunu vurmasını emretti ve 'Ja'far'ın katiline bakmaya dayanamam.' dedi. {cite:muruj-al-dhahab s. 364-366}."
  id: "Hamba Al-Rashid memerintahkannya untuk mengambil kepala Ja'far ibn Yahya. Ja'far berkata, 'Kembalilah kepadanya dan beritahu dia bahwa kamu telah melakukannya, dan jika dia menyesal, nyawaku akan berada di tanganmu.' Dia membawanya ke regu Al-Rashid, dan ketika mendengarnya, berkata, 'Bawa dia atau aku akan membunuhmu,' dia menciumnya sebelum menutup matanya dengan sapu tangan dari lengan bajunya, meregangkan lehernya, dan memukulnya. Kemudian Al-Rashid memerintahkan Yasir untuk memukul lehernya sendiri, berkata, 'Aku tidak sanggup melihat pembunuh Ja'far.' {cite:muruj-al-dhahab hlm. 364-366}."
