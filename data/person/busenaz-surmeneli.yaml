summary:
  ar: "ملاكمة تركية وُلدت في بورصة سنة 1998 ونشأت في طرابزون. فازت بذهبية وزن الويلتر في أولمبياد طوكيو 2020، وهي أول ميدالية أولمبية في تاريخ الملاكمة التركية، وبطلة عالم ثلاث مرات (2019 و2022 و2025) وبطلة أوروبا سنة 2024، وتنافس باسم نادي فنربخشة."
  en: "Turkish boxer born in Bursa in 1998 and raised in Trabzon. She won the welterweight gold medal at the Tokyo 2020 Olympics — the first Olympic boxing medal in Turkey's history — and is a three-time world champion (2019, 2022, 2025) and the 2024 European champion, competing for Fenerbahçe."
  ur: "ترک خاتون باکسر جو 1998 میں بورصہ میں پیدا ہوئیں اور طرابزون میں پلی بڑھیں۔ انہوں نے ٹوکیو 2020 میں ویلٹر ویٹ طلائی تمغہ جیتا — ترکی کی تاریخ کا پہلا اولمپک باکسنگ تمغہ — اور وہ تین بار عالمی چیمپئن (2019، 2022، 2025) اور 2024 کی یورپی چیمپئن ہیں۔"
