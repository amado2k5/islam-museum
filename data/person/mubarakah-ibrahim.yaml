summary:
  ar: "خبيرة صحة ولياقة أمريكية مسلمة في نيو هيفن بولاية كونيتيكت، ومؤسِّسة حركة «فت مسلمة» وقمتها الدولية للمسلمات. ترأس شركة «بالانس فتنس» وتدير منظمة «فت هيفن» غير الربحية، وظهرت في برنامج أوبرا وينفري ودُعيت إلى إفطار البيت الأبيض سنة 2012 و2013، وتحمل شهادة جامعية في علوم التمرين والصحة العامة وعلم النفس."
  en: "American Muslim health and fitness expert in New Haven, Connecticut, and founder of the Fit Muslimah movement and its international summit for Muslim women. She is President and CEO of BALANCE fitness, Executive Director of the Fit Haven non-profit, appeared on The Oprah Winfrey Show, was a guest at the White House Iftar Dinner in 2012 and 2013, and holds a degree in Exercise Science, Public Health and Psychology."
  ur: "نیو ہیون، کنیکٹیکٹ میں مقیم امریکی مسلم صحت و فٹنس ماہرہ، اور «فٹ مسلمہ» تحریک اور اس کی بین الاقوامی کانفرنس کی بانی۔ وہ بیلنس فٹنس کی صدر و چیف ایگزیکٹو اور فٹ ہیون غیر منافع بخش تنظیم کی ایگزیکٹو ڈائریکٹر ہیں، اوپرا ونفرے شو میں آئیں، 2012 اور 2013 میں وائٹ ہاؤس افطار ڈنر کی مہمان رہیں، اور ان کے پاس ورزشی سائنس، صحت عامہ اور نفسیات میں ڈگری ہے۔"
