summary:
  ar: "خبيرة صحة ولياقة أمريكية مسلمة في نيو هيفن بولاية كونيتيكت، ومؤسِّسة حركة «فت مسلمة» وقمتها الدولية للمسلمات. ترأس شركة «بالانس فتنس» وتدير منظمة «فت هيفن» غير الربحية، وظهرت في برنامج أوبرا وينفري ودُعيت إلى إفطار البيت الأبيض سنة 2012 و2013، وتحمل شهادة جامعية في علوم التمرين والصحة العامة وعلم النفس."
  en: "American Muslim health and fitness expert in New Haven, Connecticut, and founder of the Fit Muslimah movement and its international summit for Muslim women. She is President and CEO of BALANCE fitness, Executive Director of the Fit Haven non-profit, appeared on The Oprah Winfrey Show, was a guest at the White House Iftar Dinner in 2012 and 2013, and holds a degree in Exercise Science, Public Health and Psychology."
  ur: "نیو ہیون، کنیکٹیکٹ میں مقیم امریکی مسلم صحت و فٹنس ماہرہ، اور «فٹ مسلمہ» تحریک اور اس کی بین الاقوامی کانفرنس کی بانی۔ وہ بیلنس فٹنس کی صدر و چیف ایگزیکٹو اور فٹ ہیون غیر منافع بخش تنظیم کی ایگزیکٹو ڈائریکٹر ہیں، اوپرا ونفرے شو میں آئیں، 2012 اور 2013 میں وائٹ ہاؤس افطار ڈنر کی مہمان رہیں، اور ان کے پاس ورزشی سائنس، صحت عامہ اور نفسیات میں ڈگری ہے۔"
  es: "Experta estadounidense musulmana en salud y bienestar, residente en New Haven, Connecticut, y fundadora del movimiento Fit Muslimah y su cumbre internacional para mujeres musulmanas. Es presidenta y directora ejecutiva de BALANCE Fitness, directora ejecutiva de la organización sin fines de lucro Fit Haven, apareció en el programa de Oprah Winfrey, fue invitada a la cena Iftar de la Casa Blanca en 2012 y 2013, y posee títulos en Ciencias del Ejercicio, Salud Pública y Psicología."
  fr: "Experte américaine en santé et bien-être, musulmane et basée à New Haven, dans le Connecticut, elle est la fondatrice du mouvement Fit Muslimah et de son sommet international destiné aux femmes musulmanes. Elle est présidente-directrice générale de BALANCE Fitness, directrice générale de l'association à but non lucratif Fit Haven, a participé à l'émission d'Oprah Winfrey, a été invitée au dîner de l'Iftar à la Maison-Blanche en 2012 et 2013, et est titulaire d'un diplôme en sciences de l'exercice, en santé publique et en psychologie."
  tr: "Connecticut, New Haven'da Amerikalı Müslüman sağlık ve fitness uzmanı ve Fat Muslim hareketi ile Uluslararası Müslüman Kadınlar Zirvesi'nin kurucusudur. Fat Haven adlı kar amacı gütmeyen kuruluşun başında ve yöneticisidir, The Oprah Winfrey Show'da yer almış ve 2012 ile 2013 yıllarında White House Breakfast'a davet edilmiştir. Egzersiz bilimleri, halk sağlığı ve psikoloji alanlarında üniversite diplomasına sahiptir."
  id: "Seorang ahli kesehatan dan kebugaran Muslim Amerika di New Haven, Connecticut, dan pendiri gerakan Fat Muslim serta International Muslim Women's Summit. Ia memimpin dan mengelola organisasi nirlaba Fat Haven, tampil di The Oprah Winfrey Show, dan diundang ke White House Breakfast pada tahun 2012 dan 2013. Ia meraih gelar universitas di bidang ilmu olahraga, kesehatan masyarakat, dan psikologi."
