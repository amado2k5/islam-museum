summary:
  ar: "عالم ألباني من كورتشا، تولّى رئاسة المفتين في مجلس الشريعة الأعلى (1916–1924)، وترجم أجزاء من القرآن إلى الألبانية (1926)، وكتب أول نقد ألباني للشيوعية (1925)، ومات في الاعتقال بكافايا سنة 1957."
  en: "Albanian 'alim from Korçë who served as Grand Mufti of the Upper Sharia Council (1916–1924), translated parts of the Qur'an into Albanian (1926), wrote the first Albanian critique of communism (1925), and died in internment at Kavajë in 1957."
  ur: "کورچا سے تعلق رکھنے والے البانوی عالم، جو مجلسِ شریعہِ اعلیٰ کے مفتیِ اعظم رہے (1916ء–1924ء)، قرآن کے اجزا کا البانوی ترجمہ کیا (1926ء)، اشتراکیت پر پہلی البانوی تنقید لکھی (1925ء)، اور 1957ء میں کاوایا میں نظربندی کے دوران وفات پائی۔"
