  ar: "مسلمة بن أحمد بن قاسم المجريطي، أبو القاسم، فيلسوف رياضي فلكي وإمام الرياضيين بالأندلس، ولد ومات بمجريط، أي مدريد، ٣٣٨ إلى ٣٩٨هـ؛ من كتبه ثمار العدد وغاية الحكيم واختصار تعديل الكواكب من زيج البتاني."
  en: "Maslama ibn Ahmad ibn Qasim al-Majriti, Abu al-Qasim, a philosopher, mathematician and astronomer, the leading mathematician of al-Andalus, born and died at Majrit, that is Madrid, 338 to 398 AH (950 to 1007); his books include Thimar al-adad, Ghayat al-hakim and a digest of the planetary equations from al-Battani's zij."
