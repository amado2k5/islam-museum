  fr: "Muhammadu Attahiru II"
summary:
  ar: "السلطان الثالث عشر لخلافة صكتو في غرب أفريقيا، حكم من 1903 إلى 1915 بعد أن عيّنه البريطانيون إثر احتلالهم صكتو، فكان أول سلطان يحكم تحت السلطة الاستعمارية. وهو حفيد حفيد مؤسس الخلافة عثمان بن فودي، وابن السلطان الرابع علي بابا بن بلو."
  en: "The thirteenth Sultan of the Sokoto Caliphate in West Africa, reigning from 1903 to 1915 after the British appointed him on their conquest of Sokoto; he was the first Sultan to rule under colonial authority. He was a great-grandson of the Caliphate's founder Usman dan Fodio and a son of the fourth Sultan, Ali Babba bin Bello."
  ur: "مغربی افریقہ کی خلافت سوکوتو کے تیرہویں سلطان، جن کا دورِ حکومت 1903 سے 1915 تک رہا، جب انگریزوں نے سوکوتو کی فتح کے بعد انہیں مقرر کیا؛ وہ نوآبادیاتی اقتدار کے تحت حکومت کرنے والے پہلے سلطان تھے۔ وہ خلافت کے بانی عثمان بن فودیو کے پڑپوتے اور چوتھے سلطان علی بابا بن بیلو کے بیٹے تھے۔"
  es: "El decimotercer sultán del Califato de Sokoto en África Occidental, reinó de 1903 a 1915 tras ser nombrado por los británicos al conquistar Sokoto; fue el primer sultán en gobernar bajo autoridad colonial. Era bisnieto del fundador del Califato, Usman dan Fodio, e hijo del cuarto sultán, Ali Babba bin Bello."
  fr: "Treizième sultan du califat de Sokoto en Afrique de l'Ouest, il régna de 1903 à 1915 après sa nomination par les Britanniques suite à la conquête de Sokoto; il fut le premier sultan à régner sous l'autorité coloniale. Il était l'arrière-petit-fils du fondateur du califat, Ousmane da Fodio, et le fils du quatrième sultan, Ali Baba ben Bello."
  tr: "Batı Afrika'daki Sokktu Halifeliği'nin on üçüncü Sultanı olan Sörktü Halifeliği'nin 1903'ten 1915'e kadar hüküm sürdü; İngilizler tarafından Sokktu'nun işgalinin ardından atanarak sömürge yönetimi altında hüküm süren ilk sultan oldu. Halifeliğin kurucusu Osman bin Fodi'nin torunu ve dördüncü Sultan Ali Baba bin Baloo'nun oğluydu."
  id: "Sultan ketiga belas dari Kekhalifahan Sokktu di Afrika Barat, ia memerintah dari tahun 1903 hingga 1915 setelah diangkat oleh Inggris setelah pendudukan mereka di Sokktu, menjadikannya sultan pertama yang memerintah di bawah pemerintahan kolonial. Ia adalah cucu dari pendiri kekhalifahan, Osman bin Fodi, dan putra Sultan keempat, Ali Baba bin Baloo."
