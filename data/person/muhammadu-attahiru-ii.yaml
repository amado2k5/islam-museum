summary:
  ar: "السلطان الثالث عشر لخلافة صكتو في غرب أفريقيا، حكم من 1903 إلى 1915 بعد أن عيّنه البريطانيون إثر احتلالهم صكتو، فكان أول سلطان يحكم تحت السلطة الاستعمارية. وهو حفيد حفيد مؤسس الخلافة عثمان بن فودي، وابن السلطان الرابع علي بابا بن بلو."
  en: "The thirteenth Sultan of the Sokoto Caliphate in West Africa, reigning from 1903 to 1915 after the British appointed him on their conquest of Sokoto; he was the first Sultan to rule under colonial authority. He was a great-grandson of the Caliphate's founder Usman dan Fodio and a son of the fourth Sultan, Ali Babba bin Bello."
  ur: "مغربی افریقہ کی خلافت سوکوتو کے تیرہویں سلطان، جن کا دورِ حکومت 1903 سے 1915 تک رہا، جب انگریزوں نے سوکوتو کی فتح کے بعد انہیں مقرر کیا؛ وہ نوآبادیاتی اقتدار کے تحت حکومت کرنے والے پہلے سلطان تھے۔ وہ خلافت کے بانی عثمان بن فودیو کے پڑپوتے اور چوتھے سلطان علی بابا بن بیلو کے بیٹے تھے۔"
