summary:
  ar: "عند البلاذري عن الكلبي: شريح بن عامر بن قين من بني سعد بن بكر بن هوازن استخلفه خالد بن الوليد بالخريبة بعد فتحها وسبي أهلها وكانت مسلحة للعجم."
  en: "In al-Baladhuri via al-Kalbi: Shurayh ibn Amir ibn Qayn of Banu Sa'd ibn Bakr ibn Hawazin, whom Khalid ibn al-Walid left as deputy at al-Khurayba after opening it and taking its people captive — a Persian frontier post."
  es: "En al-Baladhuri vía al-Kalbi: Shurayh ibn Amir ibn Qayn de Banu Sa'd ibn Bakr ibn Hawazin, a quien Khalid ibn al-Walid dejó como lugarteniente en al-Khurayba después de abrirla y tomar a su gente cautiva, un puesto fronterizo persa."
  fr: "Dans al-Baladhuri via al-Kalbi: Shurayh ibn Amir ibn Qayn de Banu Sa'd ibn Bakr ibn Hawazin, que Khalid ibn al-Walid a laissé comme adjoint à al-Khurayba après l'avoir ouvert et avoir pris ses habitants en captivité — un poste frontière perse."
  ur: "البلاذری بذریعہ الکلبی میں ہے: بنو سعد بن بکر بن ہوازن کے شورای ابن عامر بن قین، جسے خالد بن ولید نے الخرائبہ کو کھولنے اور اس کے لوگوں کو اسیر کرنے کے بعد نائب کے طور پر چھوڑ دیا تھا - ایک فارس سرحدی چوکی۔"
