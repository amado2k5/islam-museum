summary:
  ar: مالكوم ليتل، المولود سنة 1925 والمتوفى سنة 1965، صار معروفًا باسم مالكوم إكس بعد انضمامه إلى أمة الإسلام التي قادها إلايجا محمد. وتقول موسوعة الإسلام إنه كان من أبلغ المنتقدين للظلم العنصري في أمريكا، وإنه بعد حجه سنة 1964 اتخذ اسم الحاج مالك الشباز وأسس تنظيمًا خاصًا في نيويورك. وتقدّم المقالة أفكاره أساسًا بنى عليه وارث الدين محمد بعد سنة 1975.
  en: Malcolm Little, born in 1925 and died in 1965, became known as Malcolm X after joining the Nation of Islam led by Elijah Muhammad. The Encyclopaedia of Islam calls him one of the most articulate critics of racial injustice in the United States, and says that after his pilgrimage of 1964 he took the name El-Hajj Malik El-Shabazz and founded his own organisation in New York. The article presents his ideas as the foundation on which Warith Deen Muhammad built after 1975.
  ur: مالکم لٹل، جو سنہ 1925ء میں پیدا ہوئے اور سنہ 1965ء میں وفات پائی، الیجاہ محمد کی قیادت والی امتِ اسلام میں شامل ہونے کے بعد مالکم ایکس کے نام سے معروف ہوئے۔ اسلام کا انسائیکلوپیڈیا انہیں امریکہ کی نسلی ناانصافی کے سب سے فصیح ناقدین میں شمار کرتا ہے اور کہتا ہے کہ سنہ 1964ء کے حج کے بعد انہوں نے الحاج مالک الشباز کا نام اپنایا اور نیویارک میں اپنی تنظیم قائم کی۔ مضمون ان کے خیالات کو وہ بنیاد بتاتا ہے جس پر وارث الدین محمد نے سنہ 1975ء کے بعد تعمیر کی۔
  es: "Malcolm Little, nacido en 1925 y fallecido en 1965, se hizo conocido como Malcolm X tras unirse a la Nación del Islam, liderada por Elijah Muhammad. La Enciclopedia del Islam lo describe como uno de los críticos más elocuentes de la injusticia racial en Estados Unidos y afirma que, tras su peregrinación de 1964, adoptó el nombre de El-Hajj Malik El-Shabazz y fundó su propia organización en Nueva York. El artículo presenta sus ideas como la base sobre la que se construyó Warith Deen Muhammad después de 1975."
  fr: "Malcolm Little, né en 1925 et décédé en 1965, est devenu Malcolm X après avoir rejoint la Nation of Islam, mouvement dirigé par Elijah Muhammad. L'Encyclopédie de l'Islam le considère comme l'un des critiques les plus éloquents de l'injustice raciale aux États-Unis et précise qu'après son pèlerinage de 1964, il prit le nom d'El-Hajj Malik El-Shabazz et fonda sa propre organisation à New York. L'article présente ses idées comme le fondement sur lequel Warith Deen Muhammad a bâti son mouvement après 1975."
  tr: "1925 doğumlu ve 1965'te vefat eden Malcolm Little, Elijah Muhammad'ın liderliğindeki İslam Milleti'ne katıldıktan sonra Malcolm X olarak tanındı. İslam Ansiklopedisi, Amerika'daki ırksal adaletsizliğin en sesli eleştirmenlerinden biri olduğunu belirtir ve 1964'teki hac yolculuğundan sonra Hac Malik el-Şebbaz adını alarak New York'ta özel bir organizasyon kurdu. Makale, onun fikirlerini, dinin varisi Muhammed'in 1975'ten sonra inşa ettiği temel olarak sunar."
  id: "Malcolm Little, lahir pada tahun 1925 dan meninggal pada tahun 1965, dikenal sebagai Malcolm X setelah bergabung dengan Nation of Islam yang dipimpin oleh Elijah Muhammad. Ensiklopedia Islam menyatakan bahwa ia adalah salah satu kritikus paling vokal terhadap ketidakadilan rasial di Amerika, dan setelah ziarahnya pada tahun 1964, ia mengambil nama Hajj Malik al-Shabbaz dan mendirikan sebuah organisasi swasta di New York. Artikel tersebut menyajikan ide-idenya sebagai fondasi yang dibangun oleh pewaris agama Muhammad setelah tahun 1975."
