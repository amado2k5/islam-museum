summary:
  ar: مالكوم ليتل، المولود سنة 1925 والمتوفى سنة 1965، صار معروفًا باسم مالكوم إكس بعد انضمامه إلى أمة الإسلام التي قادها إلايجا محمد. وتقول موسوعة الإسلام إنه كان من أبلغ المنتقدين للظلم العنصري في أمريكا، وإنه بعد حجه سنة 1964 اتخذ اسم الحاج مالك الشباز وأسس تنظيمًا خاصًا في نيويورك. وتقدّم المقالة أفكاره أساسًا بنى عليه وارث الدين محمد بعد سنة 1975.
  en: Malcolm Little, born in 1925 and died in 1965, became known as Malcolm X after joining the Nation of Islam led by Elijah Muhammad. The Encyclopaedia of Islam calls him one of the most articulate critics of racial injustice in the United States, and says that after his pilgrimage of 1964 he took the name El-Hajj Malik El-Shabazz and founded his own organisation in New York. The article presents his ideas as the foundation on which Warith Deen Muhammad built after 1975.
  ur: مالکم لٹل، جو سنہ 1925ء میں پیدا ہوئے اور سنہ 1965ء میں وفات پائی، الیجاہ محمد کی قیادت والی امتِ اسلام میں شامل ہونے کے بعد مالکم ایکس کے نام سے معروف ہوئے۔ اسلام کا انسائیکلوپیڈیا انہیں امریکہ کی نسلی ناانصافی کے سب سے فصیح ناقدین میں شمار کرتا ہے اور کہتا ہے کہ سنہ 1964ء کے حج کے بعد انہوں نے الحاج مالک الشباز کا نام اپنایا اور نیویارک میں اپنی تنظیم قائم کی۔ مضمون ان کے خیالات کو وہ بنیاد بتاتا ہے جس پر وارث الدین محمد نے سنہ 1975ء کے بعد تعمیر کی۔
