summary:
  ar: "محمد بن عبد الله بن خازم السلمي؛ ولاه أبوه هراة فهاجت بنو تميم بها وقتلوه فأخذ أبوه عثمان بن بشير فقتله صبراً."
  en: "Muhammad ibn Abdallah ibn Khazim al-Sulami; made over Herat by his father, he was killed in Tamim's rising — avenged by Uthman ibn Bashir's slaying in cold blood."
  es: "Muhammad ibn Abdallah ibn Khazim al-Sulami, heredado el control de Herat por su padre, fue asesinado durante la rebelión de Tamim, y su muerte fue vengada por el asesinato a sangre fría de Uthman ibn Bashir."
  fr: "Muhammad ibn Abdallah ibn Khazim al-Sulami; nommé à Herat par son père, il fut tué lors du soulèvement de Tamim — vengé par l'assassinat de sang-froid d'Uthman ibn Bashir."
  ur: "محمد بن عبداللہ بن خزیم السلمی؛ ہرات پر اس کے والد نے قبضہ کیا تھا، وہ تمیم کے عروج میں مارا گیا تھا - جس کا بدلہ عثمان بن بشیر کے سرد خون میں قتل کر دیا گیا تھا۔"
