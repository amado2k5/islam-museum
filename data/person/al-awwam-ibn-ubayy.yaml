label: { ar: "العوّام بن أُبيّ", en: "al-Awwam ibn Ubayy", fr: "Al-Awwam ibn Ubayy", es: "al-Awwam ibn Ubayy", ur: "العوام ابن ابی" }
gender: male
roles: []
summary:
  ar: "حلقة في القسم المختلف فيه من النسب النبوي بين عدنان وإسماعيل؛ يذكره ابن إسحاق والطبري وابن سعد في سلسلة «عدنان بن أُدّ بن أدد بن الحميسع» المختصرة هنا والصاعدة إلى قيدار بن إسماعيل {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad}، وهو القسم الذي جمعه المنصورفوري عن الكلبي وابن سعد مع كثرة الاختلاف بين الروايات {cite:mubarakpuri-raheeq p.48-49}."
  en: "A link in the disputed part of the Prophet's lineage between Adnan and Ismail, in the chain «Adnan ibn Udd ibn Adad ibn al-Humaysa», shortened here, up to Qaydar ibn Ismail, as transmitted by Ibn Ishaq, al-Tabari and Ibn Sa'd {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad} — the part al-Mansurfuri compiled from al-Kalbi and Ibn Sa'd amid wide disagreement among the versions {cite:mubarakpuri-raheeq p.48-49}."
  fr: "Maillon de la partie discutée de la lignée du Prophète entre Adnan et Ismail, dans la chaîne « Adnan ibn Udd ibn Adad ibn al-Humaysa », abrégée ici, jusqu’à Qaydar ibn Ismail, telle que la transmettent Ibn Ishaq, al-Tabari et Ibn Sa’d {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad} — partie qu’al-Mansurfuri compila d’après al-Kalbi et Ibn Sa’d dans un contexte de grandes divergences entre les versions {cite:mubarakpuri-raheeq p.48-49}."
  es: "Un vínculo en la parte disputada del linaje del Profeta entre Adnan e Ismail, en la cadena «Adnan ibn Udd ibn Adad ibn al-Humaysa», abreviada aquí, hasta Qaydar ibn Ismail, según lo transmitido por Ibn Ishaq, al-Tabari e Ibn Sa'd {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad} — la parte que al-Mansurfuri compiló de al-Kalbi e Ibn Sa'd en medio de un amplio desacuerdo entre las versiones {cite:mubarakpuri-raheeq p.48-49}."
  ur: "عدنان اور ابن ابن سعد کے درمیان نبی کے سلسلہ نسب کے متنازعہ حصے کی ایک کڑی \"عدنان بن عود بن عد بن الحمیصہ\" میں، یہاں مختصر کی گئی ہے، یہاں تک کہ قدیر ابن ابن ابن ابن ابن ابن سعد، جیسا کہ اطباء اور الصادق نے نقل کیا ہے۔ {حوالہ: ابن ہشام سیرہ 1/1-4} {حوالہ: تاریخ الطبری} {حوالہ: طبقات ابن سعد} — وہ حصہ المنصورفوری نے الکلبی اور ابن سعد سے تالیف کیا ہے جس میں نسخوں کے درمیان وسیع اختلاف ہے {حوالہ:مبارکپوری الرحیق ص 84}۔"
  tr: "Peygamberlik soyunun tartışmalı bölümünde Adnan ile İsmail arasında bir bağlantı; İbn İshak, Taberi ve İbn Saad tarafından burada özetlenen ve Kaydar bin İsmail'e kadar uzanan \"Adnan bin Ud bin Adad bin El-Humaysa\" zincirinde zikredilmiştir {al:ibn-hisham-sira 1/1-4} {al:tarikh-al-tabari} {al:tabaqat-ibn-sad} ve bu, El-Mansururi'nin El-Kalbi ve İbn Saad'dan derlediği ve rivayetler arasında birçok farklılık bulunan bölümdür {al:mubarakpuri-raheeq s.48-49}."
  id: "Sebuah mata rantai dalam bagian silsilah kenabian yang diperselisihkan antara Adnan dan Ismail; disebutkan oleh Ibn Ishaq, Al-Tabari dan Ibn Saad dalam rantai “Adnan bin Ud bin Adad bin Al-Humaysa” yang diringkas di sini dan berlanjut hingga Qaydar bin Ismail {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad}, dan merupakan bagian yang dikumpulkan oleh Al-Mansurfuri dari Al-Kalbi dan Ibn Saad dengan banyak perbedaan di antara riwayat-riwayat tersebut {cite:mubarakpuri-raheeq p.48-49}."
