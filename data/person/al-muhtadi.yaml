id: person/al-muhtadi
class: person
label: { ar: "المهتدي بالله", en: "al-Muhtadi bi-Allah", fr: "al-Muhtadi bi-Allah", es: "al-Muhtadi bi-Allah", ur: "المحتدی با اللہ" }
summary:
  ar: "خليفة عباسي، بويع له في رجب سنة خمس وخمسين ومائتين بعد خلع المعتز {cite:tabari-tarikh-abu-al-fadl j.9 p.391}، ثم خُلع في رجب سنة ست وخمسين وتوفي {cite:tabari-tarikh-abu-al-fadl j.9 p.456}، وعند السيوطي كان أسمر رقيقاً ورعاً متعبداً عادلاً قوياً في أمر الله بطلاً شجاعاً لكنه لم يجد ناصراً ولا معيناً ولم يزل صائماً منذ ولي إلى أن قتل، ووجد له سفط فيه جبة صوف وكساء كان يلبسه بالليل ويصلي فيه، واطرح الملاهي وحرم الغناء وحسم أصحاب السلطان عن الظلم وكان شديد الإشراف على الدواوين لا يخل بالجلوس الاثنين والخميس، وقال لما أطعمه هاشم بن القاسم خبزاً وملحاً وخلاً وزيتاً إنه كان في بني أمية عمر بن عبد العزيز فغرت على بني هاشم، وقال لجعفر بن عبد الواحد لما ذكر أحمد بن حنبل لو جاز لي أن أتبرأ من أبي لتبرأت منه {cite:tarikh-khulafa-minhaj-1434 p. 560-562}. وعند المسعودي هو محمد بن الواثق، بعث إليه الأتراك إلى مدينة السلام لما حصروا المعتز فأتي به إلى سامرا في يوم وليلة، وأبى أن يقعد على سرير الملك ولا يقبل البيعة حتى يرى المعتز فأتي به فعانقه وجلسا على السرير، فأحله المعتز من بيعته فقبلها الناس، وكان قد نفاه المعتز واعتقله {cite:muruj-al-dhahab p. 553}، وعند المسعودي ذهب في أمره إلى القصد والدين فقرب العلماء ورفع منازل الفقهاء وقال يا بني هاشم دعوني حتى أسلك مسلك عمر بن عبد العزيز، وأمر بإخراج آنية الذهب والفضة من الخزائن فكسرت وضربت دنانير ودراهم، ومحيت الصور من المجالس وذبحت الكباش المناطحة وقتلت السباع المحبوسة ورفعت بسط الديباج، وكانت موائد الخلفاء تنفق عشرة آلاف درهم في اليوم فجعل لمائدته ومؤنه نحو مائة درهم وكان يواصل الصيام، ووجد في سفطه بعد قتله جبة صوف وغل كان يلبسها ويغل نفسه إذا جن الليل فيركع ويسجد حتى الصباح، وقتل وله سبعة عشر ذكراً وست بنات، وكان أخرج الكاتبين أحمد بن إسرائيل وأبا نوح إلى باب العامة فضرب كل واحد خمسمائة سوط فماتا {cite:muruj-al-dhahab p. 560-563}"
  en: "Abbasid caliph, pledged allegiance in Rajab 255 after al-Mu'tazz was deposed {cite:tabari-tarikh-abu-al-fadl j.9 p.391}; he was deposed in Rajab 256 and died {cite:tabari-tarikh-abu-al-fadl j.9 p.456}. According to al-Suyuti, he was tawny-skinned, slender, pious, devout, just, firm in God's cause and a brave man, but he found neither helper nor supporter. He fasted continually from his accession until he was killed, and a woollen shirt and the cloak he wore at night in prayer were found in his chest. He abolished entertainments and banned singing, restrained the powerful from injustice, and kept close watch over the bureaus, never missing his sitting on Mondays and Thursdays. When Hashim ibn al-Qasim fed him bread, salt, vinegar and oil, he said that among the Umayyads there had been Umar ibn Abd al-Aziz, so he was jealous on behalf of the Banu Hashim; and when Ja'far ibn Abd al-Wahid mentioned Ahmad ibn Hanbal, he said: 'If it were lawful for me to disown my father, I would have disowned him' {cite:tarikh-khulafa-minhaj-1434 p. 560-562}. According to al-Mas'udi, he was Muhammad ibn al-Wathiq. When the Turks besieged al-Mu'tazz they sent for him to Madinat al-Salam, and he was brought to Samarra within a day and a night; he refused to sit on the throne or accept the oath until he had seen al-Mu'tazz, and when they met they embraced and sat together on the throne. Al-Mu'tazz released him from his pledge, and the people accepted it; al-Mu'tazz had exiled and imprisoned him {cite:muruj-al-dhahab p. 553}. According to al-Mas'udi, he took the path of moderation and piety, drew near to the scholars and raised the standing of the jurists, and said: 'O Banu Hashim, leave me to follow the path of Umar ibn Abd al-Aziz.' He ordered the gold and silver vessels brought out of the treasuries to be smashed and struck into dinars and dirhams, images were erased from the assembly halls, butting rams were slaughtered and captive beasts of prey killed, and brocade hangings were taken down. The caliphs' tables had cost ten thousand dirhams a day, but he set his table and provisions at about one hundred dirhams, and he kept up continual fasting. After his death a woollen shirt and a shackle, which he used to wear to bind himself at night while he bowed and prostrated until morning, were found in his chest. He was killed leaving seventeen sons and six daughters. He had the two secretaries Ahmad ibn Isra'il and Abu Nuh brought out to the public gate; each was given five hundred lashes, and both died {cite:muruj-al-dhahab p. 560-563}."
  fr: "Le calife abbasside, a prêté allégeance au Rajab 255 après le destitution d'al-Mu'tazz {cite:tabari-tarikh-abu-al-fadl j.9 p.391}; il fut déposé à Rajab 256 et mourut {cite:tabari-tarikh-abu-al-fadl j.9 p.456}. Selon al-Suyuti, il était à la peau fauve, mince, pieux, juste, ferme dans la cause de Dieu et un homme courageux, mais il n'a trouvé ni aide ni soutien. Il jeûnait continuellement depuis son accession jusqu'à ce qu'il soit tué, et une chemise de laine et le manteau qu'il portait la nuit dans la prière ont été trouvés dans sa poitrine. Il abolit les divertissements et interdit le chant, retint les puissants de l'injustice et surveillait de près les bureaux, ne manquant jamais sa séance les lundis et jeudis. Lorsque Hashim ibn al-Qasim lui a donné du pain, du sel, du vinaigre et de l'huile, il a dit que parmi les Omeyyades il y avait eu Omar ibn Abd al-Aziz, donc il était jaloux au nom des Banu Hashim ; et quand Ja'far ibn Abd al-Wahid mentionna Ahmad ibn Hanbal, il dit  : « S'il m'était permis de renier mon père, je l'aurais renié.  » {cite:tarikh-khulafa-minhaj-1434 p. 560-562}. Selon al-Mas'udi, il était Muhammad ibn al-Wathiq. Quand les Turcs assiégèrent al-Mu'tazz, ils le firent venir à Médine al-Salam, et il fut amené à Samarra en un jour et une nuit. Il refusa de s'asseoir sur le trône ou d'accepter le serment jusqu'à ce qu'il ait vu al-Mu'tazz, et quand ils se rencontrèrent, ils s'embrassèrent et s'assirent ensemble sur le trône. Al-Mu'tazz l'a libéré de son engagement, et le peuple l'a accepté ; al-Mu'tazz l’avait exilé et emprisonné {cite:muruj-al-dhahab p. 553}. Selon al-Mas‘udi, il choisit la voie de la modération et de la piété, se rapprocha des savants et rehaussa le rang des juristes. Il dit  : « Ô Banu Hashim, laissez-moi suivre la voie d’Umar ibn Abd al-Aziz.  » Il ordonna de sortir les vases d’or et d’argent des trésors, de les briser et d’en faire frapper des dinars et des dirhams. On effaça les images des salles d’assemblée et on abattit les béliers de combat et les bêtes sauvages captives, et des pendaisons de brocart ont été enlevées. Les tables des califes avaient coûté dix mille dirhams par jour, mais il plaça sa table et ses provisions à environ cent dirhams, et il jeûnait continuellement. Après sa mort, une chemise de laine et une manille, qu'il portait pour se lier la nuit alors qu'il s'inclinait et se prosternait jusqu'au matin, ont été trouvés dans sa poitrine. Il a été tué laissant dix-sept fils et six filles. Il fit amener à la porte publique les deux secrétaires Ahmad ibn Isra'il et Abu Nuh  ; chacun reçut cinq cents coups de fouet, et tous deux moururent {cite:muruj-al-dhahab p. 560-563}."
  es: "Califa abasí, juró lealtad en Rajab 255 después de que al-Mu'tazz fuera depuesto {cite:tabari-tarikh-abu-al-fadl j.9 p.391}; fue depuesto en Rajab 256 y murió {cite:tabari-tarikh-abu-al-fadl j.9 p.456}. Según al-Suyuti, era de tez morena, delgado, piadoso, devoto, justo, firme en la causa de Dios y un hombre valiente, pero no encontró ni ayudante ni partidario. Ayunó continuamente desde su ascenso al trono hasta su muerte, y se encontraron en su pecho una camisa de lana y la capa que usaba por la noche para orar. Abolió los entretenimientos y prohibió el canto, refrenó a los poderosos de la injusticia y vigiló de cerca los burós, sin faltar nunca a su sesión de los lunes y jueves. Cuando Hashim ibn al-Qasim le dio pan, sal, vinagre y aceite, dijo que entre los Omeyas había estado Umar ibn Abd al-Aziz, por lo que estaba celoso en nombre de los Banu Hashim; y cuando Ja'far ibn Abd al-Wahid mencionó a Ahmad ibn Hanbal, dijo: 'Si me fuera lícito desheredar a mi padre, lo habría hecho' {cite:tarikh-khulafa-minhaj-1434 p. 560-562}. Según al-Mas'udi, era Muhammad ibn al-Wathiq. Cuando los turcos sitiaron a al-Mu'tazz, lo mandaron llamar a Madinat al-Salam, y lo trajeron a Samarra en un día y una noche; se negó a sentarse en el trono o aceptar el juramento hasta que hubiera visto a al-Mu'tazz, y cuando se encontraron se abrazaron y se sentaron juntos en el trono. Al-Mu'tazz lo liberó de su juramento, y el pueblo lo aceptó; al-Mu'tazz lo había exiliado y encarcelado {cite:muruj-al-dhahab p. 553}. Según al-Mas'udi, tomó el camino de la moderación y la piedad, se acercó a los sabios y elevó el prestigio de los juristas, y dijo: «¡Oh Banu Hashim, déjenme seguir el camino de Umar ibn Abd al-Aziz!». Ordenó que los vasos de oro y plata sacados de los tesoros fueran rotos y acuñados en dinares y dirhams, se borraron las imágenes de las salas de asamblea, se sacrificaron los carneros de embestida y se mataron las bestias de presa cautivas, y se quitaron los tapices de brocado. Las mesas de los califas habían costado diez mil dirhams al día, pero él puso su mesa y provisiones en unos cien dirhams, y mantuvo un ayuno continuo. Tras su muerte, se encontraron en su pecho una camisa de lana y un grillete que solía usar para atarse por la noche mientras se postraba hasta el amanecer. Fue asesinado, dejando diecisiete hijos y seis hijas. Mandó sacar a sus dos secretarios, Ahmad ibn Isra'il y Abu Nuh, a la puerta principal; a cada uno le dieron quinientos latigazos y ambos murieron {cite:muruj-al-dhahab p. 560-563}."
  ur: "عباسی خلیفہ نے المعتز کے معزول ہونے کے بعد رجب 255 میں بیعت کی۔ آپ کو رجب 256 میں معزول کیا گیا اور وفات پائی۔ سیوطی کے مطابق، وہ دبلا پتلا، دبلا پتلا، متقی، پرہیزگار، انصاف پسند، خدا کی راہ میں ثابت قدم اور بہادر آدمی تھا، لیکن اسے نہ کوئی مددگار ملا اور نہ ہی مددگار۔ اس نے اپنے الحاق سے لے کر قتل ہونے تک مسلسل روزے رکھے اور ایک اونی قمیص اور وہ چادر جو وہ رات کو نماز میں پہنتا تھا اس کے سینے سے مل گیا۔ اس نے تفریحات کو ختم کر دیا اور گانے پر پابندی لگا دی، طاقتوروں کو ناانصافی سے روکا اور بیورو پر کڑی نظر رکھی، پیر اور جمعرات کو بیٹھنے سے کبھی محروم نہ رہا۔ جب ہاشم بن القاسم نے اسے روٹی، نمک، سرکہ اور تیل کھلایا تو اس نے کہا کہ بنو امیہ میں عمر بن عبد العزیز تھے، اس لیے وہ بنو ہاشم کی طرف سے حسد کرتے تھے۔ اور جب جعفر بن عبد الواحد نے احمد بن حنبل کا تذکرہ کیا تو انہوں نے کہا: ''اگر میرے لیے اپنے والد کا انکار کرنا جائز ہوتا تو میں ان سے بیزار ہوتا''۔ 560-562}۔ المسعودی کے مطابق وہ محمد بن الوثیق تھے۔ جب ترکوں نے معتز کا محاصرہ کیا تو انہوں نے اسے مدینۃ السلام کی طرف بلایا، اور اسے ایک دن اور رات میں سامرا لایا گیا۔ اس نے معتز کو نہ دیکھ لینے تک تخت پر بیٹھنے یا بیعت قبول کرنے سے انکار کر دیا اور جب وہ دونوں ملے تو گلے لگا کر تخت پر بیٹھ گئے۔ معتز نے اسے اپنے عہد سے رہا کیا، اور لوگوں نے اسے قبول کر لیا۔ معتز نے اسے جلاوطن کر کے قید کر دیا تھا۔ 553}۔ المسعودی کے مطابق انہوں نے اعتدال اور تقویٰ کا راستہ اختیار کیا، علماء کے قریب کیا اور فقہاء کا موقف بلند کیا، اور کہا: اے بنو ہاشم، مجھے عمر بن عبدالعزیز کے راستے پر چلنے کی اجازت دو۔ اس نے خزانے سے نکالے گئے سونے اور چاندی کے برتنوں کو توڑ کر دینار اور درہم میں مارنے کا حکم دیا، اسمبلی ہالوں سے تصویریں مٹا دی گئیں، مینڈھوں کو ذبح کر دیا گیا اور شکاری درندے مارے گئے، اور بروکیڈ لٹکائے گئے۔ خلیفہ کے دسترخوان پر ایک دن کی قیمت دس ہزار درہم تھی، لیکن اس نے اپنا دسترخوان اور سامان تقریباً ایک سو درہم پر رکھا اور مسلسل روزے رکھے۔ ان کی وفات کے بعد ایک اونی قمیص اور ایک طوق، جسے وہ رات کو اپنے آپ کو باندھنے کے لیے صبح تک رکوع و سجود کرتے تھے، ان کے سینے میں مل گئے۔ وہ سترہ بیٹے اور چھ بیٹیاں چھوڑ کر مارا گیا۔ اس نے دو سیکرٹریوں احمد بن اسرائیل اور ابو نوح کو عوامی دروازے پر لایا۔ ہر ایک کو پانچ سو کوڑے لگائے گئے اور دونوں مر گئے 560-563}۔"
