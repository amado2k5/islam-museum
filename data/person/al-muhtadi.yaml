label: { ar: "المهتدي بالله" }
summary:
  ar: "خليفة عباسي، بويع له في رجب سنة خمس وخمسين ومائتين بعد خلع المعتز {cite:tabari-tarikh-abu-al-fadl j.9 p.391}، ثم خُلع في رجب سنة ست وخمسين وتوفي {cite:tabari-tarikh-abu-al-fadl j.9 p.456}، وعند السيوطي كان أسمر رقيقاً ورعاً متعبداً عادلاً قوياً في أمر الله بطلاً شجاعاً لكنه لم يجد ناصراً ولا معيناً ولم يزل صائماً منذ ولي إلى أن قتل، ووجد له سفط فيه جبة صوف وكساء كان يلبسه بالليل ويصلي فيه، واطرح الملاهي وحرم الغناء وحسم أصحاب السلطان عن الظلم وكان شديد الإشراف على الدواوين لا يخل بالجلوس الاثنين والخميس، وقال لما أطعمه هاشم بن القاسم خبزاً وملحاً وخلاً وزيتاً إنه كان في بني أمية عمر بن عبد العزيز فغرت على بني هاشم، وقال لجعفر بن عبد الواحد لما ذكر أحمد بن حنبل لو جاز لي أن أتبرأ من أبي لتبرأت منه {cite:tarikh-khulafa-minhaj-1434 p. 560-562}. وعند المسعودي هو محمد بن الواثق، بعث إليه الأتراك إلى مدينة السلام لما حصروا المعتز فأتي به إلى سامرا في يوم وليلة، وأبى أن يقعد على سرير الملك ولا يقبل البيعة حتى يرى المعتز فأتي به فعانقه وجلسا على السرير، فأحله المعتز من بيعته فقبلها الناس، وكان قد نفاه المعتز واعتقله {cite:muruj-al-dhahab p. 553}، وعند المسعودي ذهب في أمره إلى القصد والدين فقرب العلماء ورفع منازل الفقهاء وقال يا بني هاشم دعوني حتى أسلك مسلك عمر بن عبد العزيز، وأمر بإخراج آنية الذهب والفضة من الخزائن فكسرت وضربت دنانير ودراهم، ومحيت الصور من المجالس وذبحت الكباش المناطحة وقتلت السباع المحبوسة ورفعت بسط الديباج، وكانت موائد الخلفاء تنفق عشرة آلاف درهم في اليوم فجعل لمائدته ومؤنه نحو مائة درهم وكان يواصل الصيام، ووجد في سفطه بعد قتله جبة صوف وغل كان يلبسها ويغل نفسه إذا جن الليل فيركع ويسجد حتى الصباح، وقتل وله سبعة عشر ذكراً وست بنات، وكان أخرج الكاتبين أحمد بن إسرائيل وأبا نوح إلى باب العامة فضرب كل واحد خمسمائة سوط فماتا {cite:muruj-al-dhahab p. 560-563}"
