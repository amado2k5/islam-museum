id: person/muhammad-ibn-abbad-al-qadi
class: person
label: { ar: "القاضي محمد بن إسماعيل بن عباد" }
summary:
  ar: "أبو القاسم محمد بن إسماعيل بن عباد بن قريش اللخمي، قاضي إشبيلية ومؤسس الدولة العبادية؛ وثب أهلها على يحيى فقتلوه وتم الأمر لمحمد فملك إشبيلية ثم ملك بعد ذلك قرطبة وغيرها؛ ولما مات قام مقامه ولده المعتضد بالله عباد {cite:shadharat-dhahab p. 253}."
  en: "Abu al-Qasim Muhammad b. Isma'il b. Abbad — the qadi who founded the Abbadid state; the Sevillans leapt on Yahya and killed him and the rule fell to Muhammad, who held Seville then Cordoba and beyond; on his death in 433 his son al-Mu'tadid bi'llah Abbad took his place {cite:shadharat-dhahab p. 253}."
  es: "Abu al-Qasim Muhammad b. Isma'il b. Abbad — el cadí que fundó el estado abadí; los sevillanos atacaron a Yahya y lo mataron, y el gobierno pasó a Muhammad, quien gobernó Sevilla, luego Córdoba y más allá; a su muerte en 433, su hijo al-Mu'tadid bi'llah Abbad tomó su lugar {cite:shadharat-dhahab p. 253}."
  fr: "Abu al-Qasim Muhammad b. Isma'il b. Abbad — le cadi qui a fondé l'État abbadide; les Sévillans ont attaqué Yahya et l'ont tué, et le pouvoir est tombé aux mains de Muhammad, qui a tenu Séville puis Cordoue et au-delà; à sa mort en 433, son fils al-Mu'tadid bi'llah Abbad a pris sa place {cite:shadharat-dhahab p. 253}."
