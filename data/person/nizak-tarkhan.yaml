id: person/nizak-tarkhan
class: person
label:
  ar: نيزك طرخان
  en: Nizak Tarkhan
  es: "Nizak Tarkhan"
  fr: "Nizak Tarkhan"
  ur: "نزاک ترکھان"
summary:
  ar: صاحب الأتراك؛ عند البلاذري أكرم يزدجرد شهراً وخلع عليه ثم خطب ابنته فأجابه إنما أنت عبد من عبيدي فما جرأك فتضافر مع ماهويه على قتله وأقبل في الأتراك إلى الجنابذ.
  en: lord of the Turks; in al-Baladhuri, who hosted Yazdgard a month, then asked his daughter — answered 'you are but my slave' — and joined Mahuwayh to kill him at al-Janabidh.
  es: "señor de los turcos; en al-Baladhuri, quien hospedó a Yazdgard durante un mes, luego le preguntó a su hija —respondió 'no eres más que mi esclava'— y se unió a Mahuwayh para matarlo en al-Janabidh."
  fr: "seigneur des Turcs; à al-Baladhuri, qui a hébergé Yazdgard pendant un mois, puis a demandé à sa fille — a répondu « tu n'es que mon esclave » — et s'est joint à Mahuwayh pour le tuer à al-Janabidh."
  ur: "ترکوں کا رب البلادھوری میں، جس نے یزدگرد کی ایک ماہ میزبانی کی، پھر اپنی بیٹی سے پوچھا - جواب دیا 'تم میرے غلام ہو' - اور الجنابد میں اسے قتل کرنے کے لیے مہویہ کے ساتھ شامل ہو گئے۔"
  tr: "Türklerin yoldaşı; el-Baladhuri'ye göre, Yezdegerd'i bir ay boyunca onurlandırdı, sonra onu tahttan indirdi, ardından kızına evlenme teklif etti. O da şöyle cevap verdi: 'Sen sadece benim hizmetkarlarım arasında bir kölesin.' Onu öldürmek için istediğiyle nasıl birleşiyorsun, o ise Türklere taraf döndü.'"
  id: "Teman Turki; menurut al-Baladhuri, ia menghormati Yazdegerd selama sebulan, lalu menggulingkannya, lalu melamar putrinya. Ia menjawab, 'Kau hanyalah budak di antara para pelayanku.' Apa berani-beraninya kau bergabung dengan apa yang ia inginkan untuk membunuhnya, dan ia berbalik ke pihak Turki di sisi.'"
