label: { ar: "عبيد الله بن علي بن أبي طالب", en: "'Ubayd Allah ibn 'Ali", es: "'Ubayd Allah ibn 'Ali", fr: "'Ubayd Allah ibn 'Ali", ur: "عبید اللہ ابن علی" }
summary:
  ar: "ابن علي بن أبي طالب من ليلى بنت مسعود النهشلي، قتل مع المختار بن أبي عبيد بالكوفة فيما قتله مصعب بن الزبير من أصحابه، وله خبر في تخلصه من المختار ومضيه إلى البصرة {cite:muruj-al-dhahab p. 92-93}."
  en: "Ali's son by Layla bint Mas'ud al-Nahshali — killed with al-Mukhtar's company in Mus'ab's massacre at Kufa {cite:muruj-al-dhahab p. 92-93}."
  es: "El hijo de Ali y Layla bint Mas'ud al-Nahshali — asesinado junto con la compañía de al-Mukhtar en la masacre de Mus'ab en Kufa {cite:muruj-al-dhahab p. 92-93}."
  fr: "Le fils d'Ali et de Layla bint Mas'ud al-Nahshali — tué avec la compagnie d'al-Mukhtar lors du massacre de Mus'ab à Kufa {cite:muruj-al-dhahab p. 92-93}."
  ur: "علی کا بیٹا بذریعہ لیلیٰ بنت مسعود النہشالی - کوفہ میں مصعب کے قتل عام میں المختار کی کمپنی کے ساتھ مارا گیا۔ 92-93}۔"
  tr: "Leyla bint Mas'ud al-Nahshali'den İbn Ali ibn Abi Talib, Kufa'da el-Muhtar bin Ebi Ubeyd ile birlikte öldürüldü, Mus'ab ibn al-Zubayr ise yoldaşları tarafından öldürüldü. Ayrıca el-Muhtar'ı dağıttığı ve Basra'ya yürüyüşü hakkında da raporlar vardır {atıf:muruj-al-dhahab, s. 92-93}."
  id: "Ibn Ali ibn Abi Talib dari Layla bint Mas'ud al-Nahshali, tewas bersama al-Mukhtar ibn Abi Ubayd di Kufa, sementara Mus'ab ibn al-Zubayr dibunuh oleh para sahabatnya. Ia juga memiliki laporan tentang pembongkaran al-Mukhtar dan perjalanannya ke Basra {cite:muruj-al-dhahab, hlm. 92-93}."
