summary:
  ar: "عالم رياضيات وكاتب أمريكي، وُلد في 30 يناير 1954 في بريدجبورت بولاية كونيتيكت لأسرة كاثوليكية، وصار ملحدًا في الثامنة عشرة، ثم اعتنق الإسلام سنة 1982 وهو في الثامنة والعشرين بعد حوارات مع زملاء وطلاب مسلمين وقراءته القرآن. يعمل أستاذًا للرياضيات في جامعة كانساس، وله «حتى الملائكة تسأل: رحلة إلى الإسلام في أمريكا»."
  en: "American mathematician and writer, born on 30 January 1954 at Bridgeport, Connecticut, into a Catholic family. He became an atheist by the age of eighteen and embraced Islam in 1982, aged 28, after conversations with Muslim colleagues and students and his own reading of the Qur'an. He is a professor of mathematics at the University of Kansas and the author of Even Angels Ask: A Journey to Islam in America."
  ur: "امریکی ریاضی دان اور مصنف، جو 30 جنوری 1954 کو برج پورٹ، کنیکٹی کٹ میں ایک کیتھولک گھرانے میں پیدا ہوئے۔ وہ اٹھارہ برس کی عمر تک ملحد ہو چکے تھے، اور 1982 میں 28 برس کی عمر میں مسلمان رفقا اور طلبہ سے گفتگو اور قرآن کے اپنے مطالعے کے بعد اسلام لائے۔ وہ یونیورسٹی آف کنساس میں ریاضی کے پروفیسر ہیں اور «ایون اینجلز آسک: امریکہ میں اسلام کی طرف ایک سفر» کے مصنف ہیں۔"
  fr: "Mathématicien et écrivain américain, né le 30 janvier 1954 à Bridgeport (Connecticut) dans une famille catholique. Devenu athée à dix-huit ans, il embrassa l'islam en 1982, à 28 ans, après des conversations avec des collègues et des étudiants musulmans et sa propre lecture du Coran. Il est professeur de mathématiques à l'Université du Kansas et l'auteur de *Even Angels Ask: A Journey to Islam in America*."
  es: "Matemático y escritor estadounidense, nacido el 30 de enero de 1954 en Bridgeport (Connecticut) en una familia católica. Se hizo ateo hacia los dieciocho años y abrazó el islam en 1982, a los 28, tras conversaciones con colegas y estudiantes musulmanes y su propia lectura del Corán. Es profesor de matemáticas en la Universidad de Kansas y autor de *Even Angels Ask: A Journey to Islam in America*."
