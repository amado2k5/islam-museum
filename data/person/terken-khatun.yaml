summary:
  ar: "تركان خاتون (ت 1233م)، أميرة قبچاقية من قبيلة القانقلي، زوجة السلطان علاء الدين تكش وأم السلطان علاء الدين محمد خوارزم شاه وشريكته الفعلية في الحكم: كان لها ديوانها وختمها وجيوشها وأقاليمها، ولم تكن أوامر السلطان نافذة دون توقيعها. عند الغزو المغولي غادرت غرغانج قبل سقوطها فحوصرت في حصن بلاريجان واستسلمت، وماتت في الأسر سنة 630 هـ."
  en: "Terken Khatun (d. 1233), a Qipchaq princess of the Qangli tribe, wife of Sultan Ala al-Din Tekish and mother of Ala al-Din Muhammad II of Khwarazm, whose de facto co-ruler she was: she kept her own diwan, seal, armies and territories, and the sultan's decrees were ineffective without her signature. When the Mongols invaded she left Gurganj before its fall, was besieged in a fortress in Larijan and surrendered, and died in captivity in 630 AH."
  ur: "ترکان خاتون (وفات 1233ء)، قبیلۂ قانقلی کی قبچاق شہزادی، سلطان علاء الدین تکش کی زوجہ اور سلطان علاء الدین محمد خوارزم شاہ کی والدہ اور عملاً ان کی شریکِ حکومت تھیں: ان کا اپنا دیوان، مہر، فوجیں اور علاقے تھے اور سلطان کے فرامین ان کے دستخط کے بغیر نافذ نہ ہوتے تھے۔ منگول حملے کے وقت وہ گرگانج کے سقوط سے پہلے وہاں سے نکل گئیں، لاریجان کے ایک قلعے میں محصور ہو کر ہتھیار ڈالے، اور 630ھ میں قید ہی میں وفات پائی۔"
