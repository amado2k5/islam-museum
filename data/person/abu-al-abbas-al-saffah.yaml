    ar: "أبو العباس السفاح بويع له بالخلافة في ربيع الآخر سنة ١٣٢هـ، فكان أول خلفاء بني العباس، وذكر الطبري موته سنة ١٣٦هـ."
    en: "Abu al-Abbas al-Saffah was pledged the caliphate in Rabi' II of 132 AH — the first of the Abbasid caliphs — and al-Tabari records his death in 136."
    ur: "ابوالعباس سفاح کو 132ھ ربیع الثانی میں خلافت کی بیعت ملی — پہلے عباسی خلیفہ — اور طبری نے 136ھ میں ان کی وفات لکھی۔"
