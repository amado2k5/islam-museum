class: person
label: { ar: "أبو العباس السفاح" }
summary:
  ar: "بويع له بالخلافة في ربيع الآخر سنة اثنتين وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.420}، وذكر الطبري قدومه على أبي مسلم وموته في سنة ست وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.470}، وعند السيوطي ولد سنة ثمان ومئة وقيل سنة أربع بالحميمة من ناحية البلقاء ونشأ بها وأمه رائطة الحارثية، وكان نقش خاتمه الله ثقة عبد الله وبه يؤمن، وكان أسخى الناس ما وعد عدة قط فأخرها عن وقتها، وقال الذهبي بدولته تفرقت الجماعة وخرج عن الطاعة ما بين تاهرت وطبنة إلى بلاد السودان وجميع مملكة الأندلس {cite:tarikh-khulafa-minhaj-1434 p. 417-419}، وعند المسعودي في وصف السفاح على لسان مخبر القاهر أنه كان سريعاً إلى سفك الدماء واتبعه عماله في الشرق والغرب في فعله مثل محمد بن الأشعث بالمغرب وصالح بن علي بمصر وخازم بن خزيمة وحيد بن قحطبة وكان مع ذلك بحراً سمحاً وصولاً جواداً بالمال {cite:muruj-al-dhahab p. 668}، وعند المسعودي لما علم إبراهيم ألا نجاة له جعل الوصية إليه وأوصاه ألا يكون له بالحميمة لبث حتى يتوجه إلى الكوفة، فلقيتهم أعرابية في الطريق فقالت ما رأيت وجوهاً مثل هذه ما بين خليفة وخليفة وخارجي فليلينها هذا ولتخلفنه أنت وليخرجن عليك هذا، وهابه داود بن علي بدومة الجندل فقال من أحب الحياة ذل فعطف ركابه معه، واكتشف أمره أبو حميد الطوسي بسوق الكناسة فبايعه يوم الجمعة لاثنتي عشرة ليلة خلت من ربيع الآخر سنة اثنتين وثلاثين ومائة، وخطب قائماً خلاف سنة بني أمية فضجوا أحييت السنة، وكانت خلافته أربع سنين وتسعة أشهر وعشرين يوماً ومات بالأنبار في مدينته التي بناها {cite:muruj-al-dhahab p. 238-242}، ولم يكن أحد من الخلفاء يحب مسامرة الرجال مثله، وكان إذا تعادى رجلان من بطانته لم يقبل شهادة أحدهما في الآخر ويقول إن الضغينة القديمة تولد العداوة الممضة، وكان إذا حضر أبسط ما يكون وجهاً {cite:muruj-al-dhahab p. 250-251}، وقال العبدي عند المسعودي كان سريعاً إلى سفك الدماء واتبعه عماله في الشرق والغرب في فعله واستنوا بسيرته مثل محمد بن الأشعث بالمغرب وصالح بن علي بمصر وخازم بن خزيمة وحميد بن قحطبة، وكان مع ذلك بحراً سمحاً وصلاً جواداً بالمال {cite:muruj-al-dhahab p. 668}"
