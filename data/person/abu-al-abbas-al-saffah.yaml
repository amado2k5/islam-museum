summary:
  ar: "بويع له بالخلافة في ربيع الآخر سنة اثنتين وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.420}، وذكر الطبري قدومه على أبي مسلم وموته في سنة ست وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.470}، وعند السيوطي ولد سنة ثمان ومئة وقيل سنة أربع بالحميمة من ناحية البلقاء ونشأ بها وأمه رائطة الحارثية، وكان نقش خاتمه الله ثقة عبد الله وبه يؤمن، وكان أسخى الناس ما وعد عدة قط فأخرها عن وقتها، وقال الذهبي بدولته تفرقت الجماعة وخرج عن الطاعة ما بين تاهرت وطبنة إلى بلاد السودان وجميع مملكة الأندلس {cite:tarikh-khulafa-minhaj-1434 p. 417-419}، وعند المسعودي في وصف السفاح على لسان مخبر القاهر أنه كان سريعاً إلى سفك الدماء واتبعه عماله في الشرق والغرب في فعله مثل محمد بن الأشعث بالمغرب وصالح بن علي بمصر وخازم بن خزيمة وحيد بن قحطبة وكان مع ذلك بحراً سمحاً وصولاً جواداً بالمال {cite:muruj-al-dhahab p. 668}، وعند المسعودي لما علم إبراهيم ألا نجاة له جعل الوصية إليه وأوصاه ألا يكون له بالحميمة لبث حتى يتوجه إلى الكوفة، فلقيتهم أعرابية في الطريق فقالت ما رأيت وجوهاً مثل هذه ما بين خليفة وخليفة وخارجي فليلينها هذا ولتخلفنه أنت وليخرجن عليك هذا، وهابه داود بن علي بدومة الجندل فقال من أحب الحياة ذل فعطف ركابه معه، واكتشف أمره أبو حميد الطوسي بسوق الكناسة فبايعه يوم الجمعة لاثنتي عشرة ليلة خلت من ربيع الآخر سنة اثنتين وثلاثين ومائة، وخطب قائماً خلاف سنة بني أمية فضجوا أحييت السنة، وكانت خلافته أربع سنين وتسعة أشهر وعشرين يوماً ومات بالأنبار في مدينته التي بناها {cite:muruj-al-dhahab p. 238-242}، ولم يكن أحد من الخلفاء يحب مسامرة الرجال مثله، وكان إذا تعادى رجلان من بطانته لم يقبل شهادة أحدهما في الآخر ويقول إن الضغينة القديمة تولد العداوة الممضة، وكان إذا حضر أبسط ما يكون وجهاً {cite:muruj-al-dhahab p. 250-251}، وقال العبدي عند المسعودي كان سريعاً إلى سفك الدماء واتبعه عماله في الشرق والغرب في فعله واستنوا بسيرته مثل محمد بن الأشعث بالمغرب وصالح بن علي بمصر وخازم بن خزيمة وحميد بن قحطبة، وكان مع ذلك بحراً سمحاً وصلاً جواداً بالمال {cite:muruj-al-dhahab p. 668}"
  en: "Acclaimed caliph in Rabi' II 132 {cite:tabari-tarikh-abu-al-fadl j.7 p.420}. Al-Tabari mentions his coming to Abu Muslim and his death in 136 {cite:tabari-tarikh-abu-al-fadl j.7 p.470}. According to al-Suyuti, he was born in 108, or as some say in 104, at al-Humayma in the district of al-Balqa', where he grew up; his mother was Ra'ita al-Harithiyya. The motto on his seal was: God is the trust of the servant of God, and by Him he is kept safe. He was the most generous of men: he never promised a sum without delaying it past its due time. Al-Dhahabi said that in his reign the community split and obedience was abandoned from Tahert and Tubna to the lands of the Sudan and the whole realm of al-Andalus {cite:tarikh-khulafa-minhaj-1434 p. 417-419}. According to al-Mas'udi, describing al-Saffah through a report from al-Qahir's informant, he was quick to shed blood, and his governors in East and West followed him in this, such as Muhammad ibn al-Ash'ath in the Maghrib, Salih ibn Ali in Egypt, Khazim ibn Khuzayma and Humayd ibn Qahtaba; yet he was also a generous, open-handed man who gave much money {cite:muruj-al-dhahab p. 668}. According to al-Mas'udi, when Ibrahim knew there was no escape for him, he made al-Saffah his heir and charged him not to remain at al-Humayma until he had set out for Kufa. A Bedouin woman met them on the road and said: 'I have never seen faces like these, between one caliph, another caliph and a rebel: this one will hold it, you will succeed him, and that one will rise against you.' Dawud ibn Ali, in awe of him at Dumat al-Jandal, said: 'Whoever loves life is humbled,' and turned his mount to go with him. Abu Hamid al-Tusi discovered his affair at the Kunasa market and gave him the oath of allegiance on Friday, twelve nights into Rabi' II 132. He gave the sermon standing, unlike the practice of the Umayyads, and the people cried out: 'You have revived the sunna!' His caliphate lasted four years, nine months and twenty days, and he died at al-Anbar, in the city he had built {cite:muruj-al-dhahab p. 238-242}. No caliph loved conversing with men as he did. When two of his intimates fell out, he would not accept the testimony of either against the other, saying that old grudges breed bitter enmity. When he was present, his face was at its most open {cite:muruj-al-dhahab p. 250-251}. Al-Abdi, according to al-Mas'udi, said that he was quick to shed blood and his governors in East and West followed his example, such as Muhammad ibn al-Ash'ath in the Maghrib, Salih ibn Ali in Egypt, Khazim ibn Khuzayma and Humayd ibn Qahtaba; yet he was also a generous, open-handed man who gave much money {cite:muruj-al-dhahab p. 668}"
