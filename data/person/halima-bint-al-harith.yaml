summary:
  ar: "من بنات الحارث بن أبي شمر الغساني. يذكر النويري أنها لما خرج أبوها للقاء الجيش أخرجت للجيش مركناً فطيّبتهم، وذكر ذلك في سياق قول الشاعر في اليوم الممتع {cite:nihayat-al-arab-nuwayri-vol1-scan p. 174}."
  en: "A daughter of al-Harith ibn Abi Shamir al-Ghassani. Al-Nuwayri records that when her father went out to meet an army, she brought out a basin and perfumed the troops; the passage is in the context of a poem on a pleasant day {cite:nihayat-al-arab-nuwayri-vol1-scan p. 174}."
  ur: "حارث بن ابی شمر غسانی کی بیٹی۔ نویری لکھتے ہیں کہ جب ان کے والد لشکر سے ملنے نکلے تو انہوں نے لشکر کو خوشبو لگائی؛ یہ بات ایک خوشگوار دن پر شعر کے سیاق میں آتی ہے {cite:nihayat-al-arab-nuwayri-vol1-scan p. 174}۔"
