roles: [ruler]
gender: male
summary:
  ar: "سعيد بن شريف بن علي الحمداني، أبو الفضائل، من ملوك الدولة الحمدانية في حلب ولقبه سعيد الدولة، ولي بعد أبيه سنة ٣٨١هـ وحاصره جيش مصري بقيادة بنجوتكين، ومات مسموماً بحلب سنة ٣٩٢هـ."
  en: "Sa'id ibn Sharif ibn Ali al-Hamdani, Abu al-Fada'il, a Hamdanid king in Aleppo titled Sa'id al-Dawla; he succeeded his father in 381 AH, was besieged by an Egyptian army under Banjutakin, and died poisoned in Aleppo in 392 AH (1002)."
  es: "Sa'id ibn Sharif ibn Ali al-Hamdani, Abu al-Fada'il, un rey hamdánida en Alepo titulado Sa'id al-Dawla; sucedió a su padre en el año 381 AH, fue asediado por un ejército egipcio bajo el mando de Banjutakin y murió envenenado en Alepo en el año 392 AH (1002)."
  fr: "Sa'id ibn Sharif ibn Ali al-Hamdani, Abu al-Fada'il, un roi hamdanide d'Alep titré Sa'id al-Dawla; il succéda à son père en 381 AH, fut assiégé par une armée égyptienne sous Banjutakin et mourut empoisonné à Alep en 392 AH (1002)."
  ur: "سعید بن شریف ابن علی الحمدانی، ابو الفدائل، حلب میں ایک ہمدانی بادشاہ جس کا عنوان سعید الدولہ تھا۔ اس نے 381 ہجری میں اپنے والد کی جانشینی کی، بنجوتکن کے ماتحت مصری فوج نے اس کا محاصرہ کیا، اور 392 ہجری (1002) میں حلب میں زہر دے کر انتقال کر گئے۔"
  tr: "Sa'id ibn Sharif ibn Ali al-Hamdani, Ebu el-Fada'il, Halep'teki Hamdanid hanedanının krallarından biri olan Sa'id al-Dawla olarak bilinir. 381 Hicri'de babasının yerine geçti ve Bengutkin komutasındaki Mısır ordusu tarafından kuşatıldı. 392 Hicri'de Halep'te zehirlenmiş olarak öldü."
  id: "Sa'id ibn Sharif ibn Ali al-Hamdani, Abu al-Fada'il, adalah salah satu raja dinasti Hamdanid di Aleppo, yang dikenal sebagai Sa'id al-Dawla. Ia menggantikan ayahnya pada tahun 381 H dan dikepung oleh tentara Mesir yang dipimpin oleh Bengutkin. Ia meninggal karena racun di Aleppo pada tahun 392 H."
