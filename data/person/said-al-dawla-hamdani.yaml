  ar: "سعيد بن شريف بن علي الحمداني، أبو الفضائل، من ملوك الدولة الحمدانية في حلب ولقبه سعيد الدولة، ولي بعد أبيه سنة ٣٨١هـ وحاصره جيش مصري بقيادة بنجوتكين، ومات مسموماً بحلب سنة ٣٩٢هـ."
