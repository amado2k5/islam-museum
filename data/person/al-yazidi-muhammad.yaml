summary:
  ar: "أبو عبد الله محمد بن العباس بن محمد بن أبي محمد اليزيدي النحوي، وكان جده محمد يحيى بن المبارك العدوي اليزيدي؛ كان إماماً في النحو والأدب ونقل النوادر وكلام العرب؛ وكان قد استُدعي في آخر عمره إلى تعليم أولاد المقتدر بالله فلازمهم مدة ولقبه بعض أصحابه بعد اتصاله بالخليفة فسأله أن يقرئه فقال: أنا في شغل عن ذلك {cite:wafayat-ayan}."
  en: "Abu Abdallah Muhammad b. al-Abbas al-Yazidi (d. 310, aged 82) — grammarian and transmitter of Arab lore; in his last years was summoned to tutor the sons of the caliph al-Muqtadir {cite:wafayat-ayan}."
  fr: "Abu Abdallah Muhammad b. al-Abbas al-Yazidi (mort en 310, âgé de 82) – grammairien et transmetteur de la tradition arabe ; dans ses dernières années a été convoqué pour tuteur les fils du calife al-Muqtadir {cite:wafayat-ayan}."
  es: "Abu Abdallah Muhammad b. al-Abbas al-Yazidi (m. 310, edad 82) — gramático y transmisor de saber árabe; en sus últimos años fue llamado para instruir a los hijos del califa al-Muqtadir {cite:wafayat-ayan}."
  ur: "ابو عبداللہ محمد بن العباس الیزیدی ⁦(متوفی 310، عمر 82)⁩ — گرامر اور عربی علوم کا ٹرانسمیٹر؛ اپنے آخری سالوں میں آپ کو خلیفہ المقتدیر کے بیٹوں کی تربیت کے لیے بلایا گیا تھا۔"
  tr: "Ebu Abdullah Muhammed ibn el-Abbas ibn Muhammed ibn Ebi Muhammed el-Yezidi bir dilbilgicisiydi, dedesi ise Muhammed Yahya ibn el-Mübarek el-Adavi el-Yazidiydi; dilbilgisi, edebiyat, anekdot anlatımı ve Arapça konuşma konusunda imamdı. İlerleyen yıllarında el-Muktadir Billah'ın oğullarına ders vermek üzere çağrıldı, bu yüzden bir süre onlarla kaldı. Bazı yoldaşları, halifeyle iletişime geçtikten sonra ona bu unvanı verdiler, halife ona öğretmesini istedi ve o da şöyle dedi: Ben bununla meşgulüm {atıf:wafayat-ayan}."
  id: "Abu Abdullah Muhammad ibn al-Abbas ibn Muhammad ibn Abi Muhammad al-Yazidi adalah seorang ahli tata bahasa, dan kakeknya adalah Muhammad Yahya ibn al-Mubarak al-Adawi al-Yazidi; ia adalah imam dalam tata bahasa, sastra, narasi anekdot, dan bahasa Arab. Di tahun-tahun terakhirnya, ia dipanggil untuk mengajar putra-putra al-Muqtadir Billah, sehingga ia tinggal bersama mereka untuk sementara waktu. Beberapa sahabatnya memberinya gelar itu setelah menghubungi khalifah, yang memintanya mengajarinya, dan ia berkata: Saya sedang sibuk dengan itu {cite:wafayat-ayan}."
