    basis: documented
    note: "Two independent sources name Sunni Islam for Mohammed himself. The English article, drawing on the New York Times obituary, states that it was his goal to align American Muslims with Sunni Islam and that in 1976 he transformed the Nation of Islam into an orthodox, mainstream Islamic movement, introducing the Five Pillars and rejecting the deification of Wallace Fard Muhammad. The Arabic article independently says he replaced the Nation's teachings with ideas close to the Sunni Islam widespread in the East, and files him under the category 'American Sunni Muslims'. Wikidata's religion values are Islam (Q432) and Sunni Islam (Q483654). No source names a specific madhhab for him: the English article records that he questioned importing the geographically formed classical schools and in a 2008 interview spoke of a distinct American sense of madhhab developing, so the value recorded is sunni only. His birth into the Nation of Islam and his father's leadership of it are family background and are not the basis of this value."
    sources: [source/wikipedia-warith-deen-mohammed-en, source/wikipedia-warith-deen-mohammed-ar, source/wikidata-warith-deen-mohammed]
