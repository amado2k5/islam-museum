summary:
  ar: "قائد ديني أمريكي (1933–2008)، ابن إلايجا محمد زعيم «أمة الإسلام»، خلف والده سنة 1975 فحوّل الحركة نحو الإسلام بصورته السائدة، فرفض تأليه مؤسسها وقَدَّم أركان الإسلام الخمسة وقَبِل البيض في جماعته، وأعاد تسمية جماعته مرات حتى استقرت على «الجمعية الأمريكية للمسلمين»."
  en: "American religious leader (1933–2008), son of Elijah Muhammad, leader of the Nation of Islam. He succeeded his father in 1975 and moved the movement toward mainstream Islam: he rejected the deification of its founder, introduced the Five Pillars, and admitted whites as fellow worshippers, renaming his community several times before it settled as the American Society of Muslims."
  ur: "امریکی مذہبی رہنما (1933–2008)، نیشن آف اسلام کے رہنما ایلیاہ محمد کے بیٹے۔ وہ 1975 میں اپنے والد کے جانشین بنے اور تحریک کو مرکزی دھارے کے اسلام کی طرف لے گئے: انہوں نے اس کے بانی کی دیوتایت کو مسترد کیا، اسلام کے پانچ ستون متعارف کرائے اور گوروں کو ساتھی عبادت گزاروں کے طور پر قبول کیا، اور اپنی جماعت کا نام کئی بار بدل کر آخر میں امریکن سوسائٹی آف مسلمز رکھا۔"
