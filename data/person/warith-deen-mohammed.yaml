summary:
  ar: "قائد ديني أمريكي (1933–2008)، ابن إلايجا محمد زعيم «أمة الإسلام»، خلف والده سنة 1975 فحوّل الحركة نحو الإسلام بصورته السائدة، فرفض تأليه مؤسسها وقَدَّم أركان الإسلام الخمسة وقَبِل البيض في جماعته، وأعاد تسمية جماعته مرات حتى استقرت على «الجمعية الأمريكية للمسلمين»."
  en: "American religious leader (1933–2008), son of Elijah Muhammad, leader of the Nation of Islam. He succeeded his father in 1975 and moved the movement toward mainstream Islam: he rejected the deification of its founder, introduced the Five Pillars, and admitted whites as fellow worshippers, renaming his community several times before it settled as the American Society of Muslims."
  ur: "امریکی مذہبی رہنما (1933–2008)، نیشن آف اسلام کے رہنما ایلیاہ محمد کے بیٹے۔ وہ 1975 میں اپنے والد کے جانشین بنے اور تحریک کو مرکزی دھارے کے اسلام کی طرف لے گئے: انہوں نے اس کے بانی کی دیوتایت کو مسترد کیا، اسلام کے پانچ ستون متعارف کرائے اور گوروں کو ساتھی عبادت گزاروں کے طور پر قبول کیا، اور اپنی جماعت کا نام کئی بار بدل کر آخر میں امریکن سوسائٹی آف مسلمز رکھا۔"
  es: "Líder religioso estadounidense (1933-2008), hijo de Elijah Muhammad, líder de la Nación del Islam. Sucedió a su padre en 1975 e impulsó el movimiento hacia el islam convencional: rechazó la deificación de su fundador, introdujo los Cinco Pilares y admitió a personas blancas como fieles, cambiando el nombre de su comunidad varias veces antes de que finalmente se estableciera como la Sociedad Estadounidense de Musulmanes."
  fr: "Chef religieux américain (1933-2008), fils d'Elijah Muhammad, leader de la Nation of Islam. Il succède à son père en 1975 et oriente le mouvement vers un islam plus conventionnel: il rejette la déification de son fondateur, introduit les Cinq Piliers de l'Islam et admet les Blancs comme fidèles, rebaptisant sa communauté à plusieurs reprises avant qu'elle ne prenne le nom d'American Society of Muslims."
  tr: "Amerikalı bir dini lider (1933–2008), 'İslam Milleti'nin lideri Elijah Muhammad'ın oğlu, 1975'te babasının yerine geçti ve hareketi baskın biçimiyle İslam'a dönüştürdü. Kurucusunu tanrılaştırılmış olarak reddetti, İslam'ın beş temel direğini tanıttı, grubuna beyazı kabul etti ve grubunun adını birkaç kez değiştirerek sonunda 'Amerikan Müslüman Derneği' adını aldı."
  id: "Seorang pemimpin agama Amerika (1933–2008), putra Elijah Muhammad, pemimpin 'Nation of Islam,' menggantikan ayahnya pada tahun 1975 dan mengubah gerakan menuju Islam dalam bentuk dominannya. Ia menolak pendirinya sebagai dewa yang didewakan, memperkenalkan lima pilar Islam, menerima orang kulit putih dalam kelompoknya, dan beberapa kali mengganti nama kelompoknya hingga akhirnya akhirnya menjadi 'American Muslim Association.'"
