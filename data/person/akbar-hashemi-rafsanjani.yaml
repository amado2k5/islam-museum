summary:
  ar: "أكبر هاشمي رفسنجاني (1934–2017)، رجل دين شيعي وسياسي إيراني من مؤسسي الجمهورية الإسلامية. درس في حوزة قم على يد بروجردي والخميني، ورأس البرلمان من 1980 إلى 1989 وكان القائد الفعلي في حرب العراق، ثم رئيسًا لإيران من 1989 إلى 1997، ورأس مجلس تشخيص مصلحة النظام حتى وفاته ومجلس الخبراء من 2007 إلى 2011. وُلد في بهرمان قرب رفسنجان وتوفي في طهران في 8 كانون الثاني 2017."
  en: "Akbar Hashemi Rafsanjani (1934–2017) was an Iranian Shia cleric and politician and a founding figure of the Islamic Republic. Trained at the Qom seminary under Borujerdi and Khomeini, he was speaker of parliament from 1980 to 1989 and acting commander-in-chief during the war with Iraq, then president of Iran from 1989 to 1997; he chaired the Expediency Discernment Council until his death and the Assembly of Experts from 2007 to 2011. Born at Bahreman near Rafsanjan, he died in Tehran on 8 January 2017."
  ur: "اکبر ہاشمی رفسنجانی (1934ء–2017ء) ایرانی شیعہ عالمِ دین اور سیاست دان اور اسلامی جمہوریہ کے بانیوں میں سے تھے۔ انہوں نے قم کے حوزے میں بروجردی اور خمینی سے تعلیم پائی، 1980ء سے 1989ء تک پارلیمنٹ کے اسپیکر اور عراق جنگ میں قائم مقام سپہ سالار رہے، پھر 1989ء سے 1997ء تک ایران کے صدر رہے؛ وہ وفات تک مصلحت کونسل کے چیئرمین اور 2007ء سے 2011ء تک مجلسِ خبرگان کے چیئرمین رہے۔ وہ رفسنجان کے قریب بہرمان میں پیدا ہوئے اور 8 جنوری 2017ء کو تہران میں وفات پائی۔"
