summary:
  ar: "كان القيّم بتدبير ثورة ابن طباطبا في الكوفة في سنة تسع وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.528}، ثم هرب من الكوفة في سنة مائتين وقُتل في ربيع الأول منها {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}."
  en: "Abu al-Saraya was in charge of planning Ibn Tabataba's uprising in Kufa in 199 {cite:tabari-tarikh-abu-al-fadl j.8 p.528}, then fled from Kufa in 200 and was killed in Rabi' al-Awwal of that year {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}."
