id: person/abu-al-saraya
class: person
label: { ar: "أبو السرايا", en: "Abu al-Saraya", fr: "Abu al-Saraya", es: "Abu al-Saraya", ur: "ابو السرایا" }
summary:
  ar: "كان القيّم بتدبير ثورة ابن طباطبا في الكوفة في سنة تسع وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.528}، ثم هرب من الكوفة في سنة مائتين وقُتل في ربيع الأول منها {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}."
  en: "Abu al-Saraya was in charge of planning Ibn Tabataba's uprising in Kufa in 199 {cite:tabari-tarikh-abu-al-fadl j.8 p.528}, then fled from Kufa in 200 and was killed in Rabi' al-Awwal of that year {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}."
  fr: "Abu al-Saraya fut chargé d'organiser le soulèvement d'Ibn Tabataba à Koufa en 199 {cite:tabari-tarikh-abu-al-fadl j.8 p.528}, puis s'enfuit de Koufa en 200 et fut tué en Rabi' al-Awwal de cette année {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}."
  es: "Abu al-Saraya estuvo a cargo de planificar el levantamiento de Ibn Tabataba en Kufa en 199 {cite:tabari-tarikh-abu-al-fadl j.8 p.528}, luego huyó de Kufa en 200 y fue asesinado en Rabi' al-Awwal de ese año {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}."
  ur: "ابو السرایا 199 میں کوفہ میں ابن طباطبہ کی بغاوت کی منصوبہ بندی کا انچارج تھا {حوالہ: طبری تاریخ ابو الفضل ج8 ص 528}، پھر 200 میں کوفہ سے فرار ہوا اور اسی سال ربیع الاول میں مارا گیا۔ {حوالہ: طبری-تاریخ-ابو الفضل ج8 ص535}۔"
  tr: "Hicri 199 yılında Kûfe'de İbn Tabata'nın isyanını organize etmekle görevliydi {cite:tabari-tarikh-abu-al-fadl j.8 s.528}, daha sonra Hicri 200 yılında Kûfe'den kaçtı ve aynı yılın Rebiü'l-Evvel ayında öldürüldü {cite:tabari-tarikh-abu-al-fadl j.8 s.534} {cite:tabari-tarikh-abu-al-fadl j.8 s.535}."
  id: "Dia bertanggung jawab mengorganisir pemberontakan Ibn Tabataba di Kufa pada tahun 199 H {cite:tabari-tarikh-abu-al-fadl j.8 p.528}, kemudian dia melarikan diri dari Kufa pada tahun 200 H dan terbunuh pada bulan Rabi' al-Awwal tahun itu {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}."
