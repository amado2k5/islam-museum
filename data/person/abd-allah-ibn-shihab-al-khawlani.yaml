summary:
  ar: تابعي كوفي، أبو الجزل، روى عن عمر بن الخطاب وعائشة، وروى عنه الشعبي وخيثمة بن عبد الرحمن، ووثقه ابن خلفون. وتوفي قبل سنة 75 هـ بحسب المطبوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7841}
  en: A Successor from Kufa, Abu al-Jazl; he transmitted from Umar ibn al-Khattab and Aisha; al-Sha'bi and Khaythama ibn Abd al-Rahman transmitted from him; Ibn Khaldun rated him reliable; he died before 75 AH as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7841}
  ur: کوفہ کے تابعی، ابو الجزل؛ عمر بن الخطاب اور عائشہ سے روایت کی؛ ان سے شعبی اور خیثمہ بن عبد الرحمن نے روایت کی؛ ابن خلدون نے ثقہ کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7841}
