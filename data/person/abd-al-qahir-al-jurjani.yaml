summary:
  ar: "النحوي الجرجاني الشافعي الأشعري صاحب التصانيف منها المغني في شرح الإيضاح في ثلاثين مجلداً وكتاب الجمل وشرحه وكتاب العمدة في التصريف وكتاب المفتاح وشرح الفاتحة في مجلد، أخذ النحو بجرجان عن أبي الحسين محمد بن الحسن الفارسي ابن أخت أبي علي الفارسي، وكان فيه دين وله فضيلة تامة في النحو، وحكي أنه دخل عليه لص وهو في الصلاة فأخذ جميع ما وجد والجرجاني ينظر إليه ولم يقطع صلاته، وله نظم منه كبر على العقل لا تربعنه ومل إلى الجهل ميل هاتم وعش حماراً تعش سعيداً فالسعد في طالع البهائم، توفي سنة إحدى وسبعين وأربع مئة {cite:shadharat-dhahab p. 348-349}."
  en: "The grammarian 'Abd al-Qahir al-Jurjani, Shafi'i-Ash'ari master of thirty-volume works and the terse al-Jumal and al-'Umda; a thief once emptied his house while he prayed and he did not break his prayer, and he wrote bitter verse — 'live as an ass and live happy: luck rides the stars of the beasts' {cite:shadharat-dhahab p. 348-349}."
