summary:
  ar: "النحوي الجرجاني الشافعي الأشعري صاحب التصانيف منها المغني في شرح الإيضاح في ثلاثين مجلداً وكتاب الجمل وشرحه وكتاب العمدة في التصريف وكتاب المفتاح وشرح الفاتحة في مجلد، أخذ النحو بجرجان عن أبي الحسين محمد بن الحسن الفارسي ابن أخت أبي علي الفارسي، وكان فيه دين وله فضيلة تامة في النحو، وحكي أنه دخل عليه لص وهو في الصلاة فأخذ جميع ما وجد والجرجاني ينظر إليه ولم يقطع صلاته، وله نظم منه كبر على العقل لا تربعنه ومل إلى الجهل ميل هاتم وعش حماراً تعش سعيداً فالسعد في طالع البهائم، توفي سنة إحدى وسبعين وأربع مئة {cite:shadharat-dhahab p. 348-349}."
  en: "The grammarian 'Abd al-Qahir al-Jurjani, Shafi'i-Ash'ari master of thirty-volume works and the terse al-Jumal and al-'Umda; a thief once emptied his house while he prayed and he did not break his prayer, and he wrote bitter verse — 'live as an ass and live happy: luck rides the stars of the beasts' {cite:shadharat-dhahab p. 348-349}."
  fr: "Le grammairien 'Abd al-Qahir al-Jurjani, maître shafi'ite et ash'arite, auteur d'ouvrages en trente volumes et des concis al-Jumal et al-'Umda ; un voleur vida un jour sa maison pendant qu'il priait sans qu'il interrompe sa prière, et il écrivit des vers amers — « vis en âne et vis heureux : la chance chevauche les étoiles des bêtes » {cite:shadharat-dhahab p. 348-349}."
  es: "El gramático 'Abd al-Qahir al-Jurjani, maestro shafi'i-ash'ari de obras de treinta volúmenes y los concisos al-Jumal y al-'Umda; un ladrón vació una vez su casa mientras él rezaba y no interrumpió su oración, y escribió un amargo verso: 'vive como un asno y vive feliz: la suerte cabalga las estrellas de las bestias' {cita: shadharat-dhahab págs. 348-349}."
  ur: "گرائمر عبدالقاہر الجرجانی، شافعی اشعری تیس جلدوں پر مشتمل تصانیف اور شرح الجمال اور العمدہ؛ ایک بار ایک چور نے نماز پڑھتے ہوئے اس کا گھر خالی کر دیا اور اس نے نماز نہیں توڑی، اور اس نے کڑوی آیت لکھی - 'گدھے کی طرح جیو اور خوش رہو: قسمت درندوں کے ستاروں پر سوار ہوتی ہے'۔ 348-349}۔"
  tr: "Otuz ciltlik \"El-Muğni fi Şerhü'l-İdeh\", \"Kitabü'l-Cümel\" ve tefsiri, \"Kitabü'l-Umdah fi El-Tasrif\", \"Kitabü'l-Miftah\" ve tek ciltlik \"Şerhü'l-Fatiha\" gibi eserlerin yazarı, dilbilgisi eğitimini Ebu Ali el-Farisi'nin yeğeni Ebu Hüseyin Muhammed ibn Hasan el-Farisi'nin yanında Cürcan'da tamamlamıştır. Dindar bir kişiydi ve dilbilgisinde tam bir üstünlüğe sahipti. Rivayet edildiğine göre, namaz kılarken bir hırsız evine girmiş ve bulduğu her şeyi çalmıştır; El-Cürcani ise onu izlemiş ve namazını bölmemiştir. Şiirlerinden birinde şöyle bir dize yer almaktadır: \"Akla karşı kibirli ol, onu dörtleme, cehalete yönel, güçlü bir eğilim göster. Eşek gibi yaşa, mutlu yaşarsın, çünkü mutluluk hayvanların burçlarındadır.\" H. 471 yılında vefat etti. {alıntı: shadharat-dhahab s. 348-349}"
  id: "Ahli tata bahasa Al-Jurjani Al-Shafi’i Al-Ash’ari, penulis karya-karya termasuk Al-Mughni fi Sharh Al-Idah dalam tiga puluh jilid, Kitab Al-Jumal dan komentarnya, Kitab Al-Umdah fi Al-Tasrif, Kitab Al-Miftah dan Sharh Al-Fatihah dalam satu jilid, belajar tata bahasa di Jurjan di bawah bimbingan Abu Al-Husayn Muhammad ibn Al-Hasan Al-Farisi, keponakan Abu Ali Al-Farisi. Beliau adalah seorang yang religius dan memiliki keunggulan sempurna dalam tata bahasa. Diriwayatkan bahwa seorang pencuri masuk ke kamarnya saat beliau sedang shalat dan mengambil semua yang ditemukannya, dan Al-Jurjani mengawasinya dan tidak mengganggu shalatnya. Beliau memiliki sebuah puisi, yang isinya: “Bersikaplah sombong terhadap akal, jangan jadikan akal sebagai sesuatu yang lemah, dan condonglah kepada kebodohan, kecenderungan yang kuat. Hiduplah seperti keledai dan kamu akan hidup bahagia, karena kebahagiaan ada dalam horoskop binatang.” Beliau wafat pada tahun 471 H. {cite:shadharat-dhahab p. 348-349}"
