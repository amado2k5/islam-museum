id: person/abu-yahya-ibn-matruh
class: person
label:
  ar: أبو يحيى بن مطروح الطرابلسي
  en: Abu Yahya ibn Matruh
  fr: "Abu Yahya ibn Matruh"
  es: "Abu Yahya ibn Matruh"
  ur: "ابو یحییٰ بن مطروح"
summary:
  ar: "أبو يحيى بن مطروح من أعيان طرابلس؛ مشى في وجوه الناس وأعيانهم وداخلهم في الفتك بالنصارى لما ملكها رجار صاحب صقلية فاجتمعوا لذلك وثاروا بهم وأحرقوهم بالنار، وكان فارساً مقداماً فاستقر والياً على البلد؛ ولما وصل عبد المؤمن إلى إفريقية وافتتح المهدية سنة 555هـ وفد عليه مع وجوه أهل طرابلس فأوسعهم براً وتكرمة وردهم إلى بلدهم، ولم يزل عليهم إلى أن هرم وعجز بعهد يوسف بن عبد المؤمن فطلب الحج فارتحل في البحر سنة 586هـ واستقر بالإسكندرية."
  en: "Abu Yahya ibn Matruh, a Tripoli notable; when Roger's Normans held the town he went among its leading men and drew them into striking the Franks, who were killed and burned — a daring horseman, he governed Tripoli thereafter, came in delegation to Abd al-Mu'min at Mahdiyya's fall in 555 and was confirmed over the town, until, grown old under Yusuf ibn Abd al-Mu'min, he asked leave for the hajj and sailed to settle at Alexandria in 586."
  fr: "Abu Yahya ibn Matruh, notable de Tripoli : alors que les Normands de Roger occupaient la ville, il rallia ses principaux habitants à une attaque contre les Francs, qui furent tués et brûlés. Cavalier audacieux, il gouverna ensuite Tripoli, vint en délégation auprès d'Abd al-Mu'min à la chute de Mahdia en 555 et fut confirmé dans sa charge ; devenu vieux sous Yusuf ibn Abd al-Mu'min, il demanda l'autorisation du pèlerinage et prit la mer pour s'établir à Alexandrie en 586."
  es: "Abu Yahya ibn Matruh, un notable de Trípoli; cuando los normandos de Roger ocupaban la ciudad, se unió a sus principales hombres y los incitó a atacar a los francos, quienes fueron asesinados y quemados. Jinete audaz, gobernó Trípoli a partir de entonces, llegó en delegación a Abd al-Mu'min tras la caída de Mahdiyya en 555 y fue confirmado al frente de la ciudad, hasta que, ya anciano bajo el gobierno de Yusuf ibn Abd al-Mu'min, pidió permiso para realizar el Hajj y zarpó para establecerse en Alejandría en 586."
  ur: "ابو یحییٰ بن مطروح، ایک قابل ذکر طرابلس؛ جب راجر کے نارمن نے قصبے پر قبضہ کیا تو وہ اس کے سرکردہ آدمیوں کے درمیان گیا اور انہیں فرینکوں پر حملہ کرنے کی طرف متوجہ کیا، جو مارے گئے اور جلائے گئے - ایک بہادر گھوڑ سوار، اس کے بعد اس نے طرابلس پر حکومت کی، 555 میں مہدیہ کے زوال کے وقت عبد المومن کے پاس وفد کے ساتھ آیا اور اس قصبے پر اس کی تصدیق کی گئی، یہاں تک کہ عبد المومن نے بوڑھے ہونے کے لیے کہا۔ اور 586 میں اسکندریہ میں آباد ہونے کے لیے روانہ ہوا۔"
  tr: "Ebu Yahya bin Matruh, Trablus'un ileri gelenlerinden biriydi. Halk ve ileri gelenler arasında dolaştı ve Sicilya hükümdarı Roger'ın kontrolü ele geçirmesi üzerine Hristiyanları öldürme eylemlerine katıldı. Bunun üzerine halk toplandı, onlara karşı ayaklandı ve onları yakarak öldürdü. Cesur bir şövalye olduğu için şehrin valisi olarak görev yaptı. Abdülmümin, Hicri 555 yılında İfrikiye'ye gelip Mehdi'yi fethettiğinde, Trablus halkının ileri gelenleriyle birlikte onun yanına geldi. Abdülmümin onlara cömert davrandı, onları onurlandırdı ve şehirlerine geri gönderdi. Yusuf bin Abdülmümin'in hükümdarlığı döneminde yaşlanıp güçsüz düşene kadar onlarla birlikte kaldı. Daha sonra Hicri 586 yılında Hac ibadetini yerine getirmek için deniz yoluyla İskenderiye'ye gitti."
  id: "Abu Yahya bin Matrouh adalah salah satu tokoh terkemuka Tripoli. Ia berbaur dengan rakyat dan para tokoh terkemuka, dan bergabung dengan mereka dalam membunuh orang-orang Kristen ketika Roger, penguasa Sisilia, menguasainya. Maka mereka berkumpul dan bangkit melawan mereka serta membakar mereka. Ia adalah seorang ksatria pemberani, sehingga ia diangkat menjadi gubernur kota. Ketika Abd al-Mu’min tiba di Ifriqiya dan menaklukkan Mahdia pada tahun 555 H, ia datang kepadanya bersama para tokoh terkemuka dari Tripoli, sehingga ia memperlakukan mereka dengan murah hati dan menghormati mereka serta mengembalikan mereka ke kota mereka. Ia tinggal bersama mereka hingga ia menjadi tua dan lemah selama pemerintahan Yusuf bin Abd al-Mu’min, sehingga ia berusaha untuk menunaikan ibadah haji dan melakukan perjalanan melalui laut pada tahun 586 H dan menetap di Alexandria."
