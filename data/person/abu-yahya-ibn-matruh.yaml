id: person/abu-yahya-ibn-matruh
class: person
label:
  ar: أبو يحيى بن مطروح الطرابلسي
  en: Abu Yahya ibn Matruh
summary:
  ar: "أبو يحيى بن مطروح من أعيان طرابلس؛ مشى في وجوه الناس وأعيانهم وداخلهم في الفتك بالنصارى لما ملكها رجار صاحب صقلية فاجتمعوا لذلك وثاروا بهم وأحرقوهم بالنار، وكان فارساً مقداماً فاستقر والياً على البلد؛ ولما وصل عبد المؤمن إلى إفريقية وافتتح المهدية سنة 555هـ وفد عليه مع وجوه أهل طرابلس فأوسعهم براً وتكرمة وردهم إلى بلدهم، ولم يزل عليهم إلى أن هرم وعجز بعهد يوسف بن عبد المؤمن فطلب الحج فارتحل في البحر سنة 586هـ واستقر بالإسكندرية."
  en: "Abu Yahya ibn Matruh, a Tripoli notable; when Roger's Normans held the town he went among its leading men and drew them into striking the Franks, who were killed and burned — a daring horseman, he governed Tripoli thereafter, came in delegation to Abd al-Mu'min at Mahdiyya's fall in 555 and was confirmed over the town, until, grown old under Yusuf ibn Abd al-Mu'min, he asked leave for the hajj and sailed to settle at Alexandria in 586."
