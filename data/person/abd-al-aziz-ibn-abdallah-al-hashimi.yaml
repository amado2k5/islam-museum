summary:
  ar: "هاشمي بغدادي من ولد عبد الله بن العباس بن عبد المطلب؛ سمع يحيى بن عبد الرحمن المقرئ وأبا بكر الحميدي وعبد الله بن جعفر الرقي وعبد الله بن إبراهيم الغفاري، وروى عنه عبد الله بن إسحاق المدائني والقاضي المحاملي وإسماعيل بن محمد الصفار ومحمد بن العباس بن مجيح، وقال الدارقطني: كان ثقة؛ توفي لإحدى عشرة ليلة بقيت من ذي الحجة سنة خمس وسبعين ومائتين وقد بلغ ستًا وثمانين سنة، وكان جميلًا بهيًّا لم يغيّر شيبه {cite:tarikh-baghdad-khatib j.9 p.451-452}."
  en: "A Hashimi of Baghdad of the line of 'Abdallah b. al-'Abbas b. 'Abd al-Muttalib; he heard Yahya b. 'Abd al-Rahman al-Muqri', Abu Bakr al-Humaydi, 'Abdallah b. Ja'far al-Raqqi and 'Abdallah b. Ibrahim al-Ghifari; his transmitters included 'Abdallah b. Ishaq al-Mada'ini and the judge al-Muhamili; al-Daraqutni said he was trustworthy; he died on 11 Dhu'l-Hijja 275 aged eighty-six, still handsome, his grey hair unchanged {cite:tarikh-baghdad-khatib j.9 p.451-452}."
died: { hijri: "0275-11-11", edtf: "0889", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم الخميس لإحدى عشرة ليلة بقيت من ذي الحجة سنة 275 هـ، وقال أحمد بن كامل: يوم الثلاثاء. التحويل مشتق.", sources: [source/tarikh-baghdad-khatib] }
