summary:
  ar: "هاشمي بغدادي من ولد عبد الله بن العباس بن عبد المطلب؛ سمع يحيى بن عبد الرحمن المقرئ وأبا بكر الحميدي وعبد الله بن جعفر الرقي وعبد الله بن إبراهيم الغفاري، وروى عنه عبد الله بن إسحاق المدائني والقاضي المحاملي وإسماعيل بن محمد الصفار ومحمد بن العباس بن مجيح، وقال الدارقطني: كان ثقة؛ توفي لإحدى عشرة ليلة بقيت من ذي الحجة سنة خمس وسبعين ومائتين وقد بلغ ستًا وثمانين سنة، وكان جميلًا بهيًّا لم يغيّر شيبه {cite:tarikh-baghdad-khatib j.9 p.451-452}."
  en: "A Hashimi of Baghdad of the line of 'Abdallah b. al-'Abbas b. 'Abd al-Muttalib; he heard Yahya b. 'Abd al-Rahman al-Muqri', Abu Bakr al-Humaydi, 'Abdallah b. Ja'far al-Raqqi and 'Abdallah b. Ibrahim al-Ghifari; his transmitters included 'Abdallah b. Ishaq al-Mada'ini and the judge al-Muhamili; al-Daraqutni said he was trustworthy; he died on 11 Dhu'l-Hijja 275 aged eighty-six, still handsome, his grey hair unchanged {cite:tarikh-baghdad-khatib j.9 p.451-452}."
  fr: "Un Hachimite de Bagdad de la lignée de 'Abdallah b. al-'Abbas b. 'Abd al-Muttalib ; il entendit Yahya b. 'Abd al-Rahman al-Muqri', Abu Bakr al-Humaydi, 'Abdallah b. Ja'far al-Raqqi et 'Abdallah b. Ibrahim al-Ghifari ; parmi ses transmetteurs figurent 'Abdallah b. Ishaq al-Mada'ini et le cadi al-Muhamili ; al-Daraqutni le dit digne de confiance ; il mourut le 11 dhu'l-hijja 275 à quatre-vingt-six ans, toujours beau, ses cheveux blancs non teints {cite:tarikh-baghdad-khatib j.9 p.451-452}."
  es: "Un Hashimi de Bagdad del linaje de 'Abdallah b. al-'Abbas b. 'Abd al-Muttalib; escuchó a Yahya b. 'Abd al-Rahman al-Muqri', Abu Bakr al-Humaydi, 'Abdallah b. Ja'far al-Raqqi y 'Abdallah b. Ibrahim al-Ghifari; sus transmisores incluían a 'Abdallah b. Ishaq al-Mada'ini y el juez al-Muhamili; al-Daraqutni dijo que era digno de confianza; Murió el 11 de Dhu'l-Hijja 275 a la edad de ochenta y seis años, todavía guapo, su cabello gris sin cambios {cita:tarikh-baghdad-khatib j.9 p.451-452}."
  ur: "عبداللہ بن عبدالعزیز کے سلسلہ میں بغداد کا ایک ہاشمی العباس بی عبدالمطلب؛ اس نے یحییٰ کو سنا۔ 'عبدالرحمن المقری'، ابوبکر الحمیدی، 'عبداللہ بن. جعفر الرقی اور عبداللہ بن ابراہیم الغفاری؛ اس کے ٹرانسمیٹر میں عبداللہ بی۔ اسحاق المدائنی اور قاضی المحملی؛ الدارقطنی نے کہا کہ وہ ثقہ ہے۔ ان کا انتقال 11 ذی الحجہ 275 کو چھیاسی سال کی عمر میں ہوا، اب بھی خوبصورت، ان کے سفید بالوں میں کوئی تبدیلی نہیں آئی۔"
  tr: "Abdullah bin Abbas bin Abdul Muttalib'in soyundan gelen Haşimi Bağdadi; Yahya bin Abdul Rahman el-Mukri, Ebu Bekir el-Hamidi, Abdullah bin Cafer el-Raki ve Abdullah bin İbrahim el-Ghaffari'den rivayet etmiştir. Abdullah bin İshak el-Medaini, Kadı el-Mahamili, İsmail bin Muhammed el-Saffar ve Muhammed bin Abbas bin Mujih ondan rivayet etmişlerdir. El-Daraqutni şöyle demiştir: Güvenilir bir kişiydi. 275 yılında Zilhicce ayının on birinci gecesinde, seksen altı yaşında vefat etti. Yakışıklı ve ışıl ışıl bir kişiydi ve beyaz saçları değişmemişti. {Kaynak:tarikh-baghdad-khatib c.9 s.451-452}"
  id: "Hashimi Baghdadi, keturunan Abdullah bin Abbas bin Abdul Muttalib; ia mendengar dari Yahya bin Abdul Rahman Al-Muqri, Abu Bakr Al-Hamidi, Abdullah bin Jaafar Al-Raqi, dan Abdullah bin Ibrahim Al-Ghaffari. Abdullah bin Ishaq Al-Madaini, Al-Qadi Al-Mahamili, Ismail bin Muhammad Al-Saffar, dan Muhammad bin Abbas bin Mujih meriwayatkan darinya. Al-Daraqutni berkata: Ia adalah orang yang dapat dipercaya. Ia wafat pada malam kesebelas sisa bulan Dzul Hijjah tahun 275, setelah mencapai usia delapan puluh enam tahun. Ia tampan dan berseri-seri, dan rambutnya yang beruban tidak berubah. {cite:tarikh-baghdad-khatib j.9 p.451-452}."
died: { hijri: "0275-11-11", edtf: "0889", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم الخميس لإحدى عشرة ليلة بقيت من ذي الحجة سنة 275 هـ، وقال أحمد بن كامل: يوم الثلاثاء. التحويل مشتق.", sources: [source/tarikh-baghdad-khatib] }
