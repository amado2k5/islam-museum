summary:
  ar: "قاضٍ ورجل دولة هندي (1905–1992)، رئيس قضاة الهند من 1968 إلى 1970. وعند وفاة الرئيس ذاكر حسين في المنصب سنة 1969 تولى رئاسة الهند بالإنابة، وكان نائب رئيس الجمهورية من 1979 إلى 1984. تعلّم في كمبريدج وتخرّج محاميا في «لينكولن إن»، وكان أديبا أرديا معروفا."
  en: "Indian jurist and statesman (1905–1992), chief justice of India from 1968 to 1970. On the death in office of President Zakir Husain he served as acting president of India in July–August 1969, and he was vice president of India from 1979 to 1984. Educated at Cambridge and called to the bar at Lincoln's Inn, he was also a noted scholar of Urdu literature."
  ur: "ہندوستانی قاضی اور سیاست دان (1905ء–1992ء)، 1968ء سے 1970ء تک ہندوستان کے چیف جسٹس۔ 1969ء میں صدر ذاکر حسین کی عہدے میں وفات پر انھوں نے ہندوستان کے قائم مقام صدر کے طور پر خدمات انجام دیں، اور 1979ء سے 1984ء تک نائب صدر رہے۔ کیمبرج میں تعلیم پائی اور لنکنز اِن سے بار میں داخل ہوئے، وہ اردو ادب کے عالم بھی تھے۔"
