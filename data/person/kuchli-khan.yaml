id: person/kuchli-khan
class: person
label:
  ar: كشلي خان ملك التتر
  en: Kuchli Khan, king of the Tatars
  es: "Kuchli Khan, king of the Tatars"
  fr: "Kuchli Khan, king of the Tatars"
  ur: "تاتاریوں کا بادشاہ کچلی خان"
summary:
  ar: "كشلي خان، ملك أمة من التتر نزلوا في حدود الصين بينها وبين تركستان؛ كانت بينهم وبين الخطا عداوة وحروب، فزحف في أممه إلى الخطا لينتهز الفرصة فيهم فبعث إلى خوارزم شاه يسأله النصر عليهم فيعتد عليه بهزيمة الخطا، وتجهز خوارزم شاه يوهم كل فريق أنه له وأقام منتبذاً عنهما وقد تواقعوا فانهزم الخطا ومال معه عليهم، واستولى كشلي خان على كاشغر وبلاد تركستان وساغون، وخرجت عليه طائفة المغل وملكهم جنكزخان فشغله بحربهم."
  en: "Kuchli Khan, king of a Tatar nation settled between China and Turkestan; long at war with the Khita, he marched his hosts against them and solicited Khwarazmshah's aid — who deceived both camps and let them destroy each other, the Khita beaten and their remnant joined to him — while Kuchli Khan took Kashghar, Turkestan and Saghun, until the Mongol nation under Genghis Khan rose against him and kept him from Khwarazmshah's war."
  es: "Kuchli Khan, rey de una nación tártara asentada entre China y Turkestán, que llevaba mucho tiempo en guerra con los Khita, marchó con sus ejércitos contra ellos y solicitó la ayuda de Khwarazmshah, quien engañó a ambos bandos y permitió que se destruyeran mutuamente; los Khita fueron derrotados y sus supervivientes se unieron a él. Mientras tanto, Kuchli Khan tomó Kashgar, Turkestán y Saghun, hasta que la nación mongola, bajo el mando de Genghis Khan, se alzó contra él y lo apartó de la guerra de Khwarazmshah."
  fr: "Kuchli Khan, roi d'une nation tatare établie entre la Chine et le Turkestan, longtemps en guerre contre les Khita, marcha ses armées contre eux et sollicita l'aide de Khwarezmshah — qui trompa les deux camps et les laissa s'entre-détruire, les Khita vaincus et leurs survivants se ralliant à lui — tandis que Kuchli Khan prenait Kashghar, le Turkestan et Saghun, jusqu'à ce que la nation mongole de Gengis Khan se soulève contre lui et l'empêche de participer à la guerre de Khwarezmshah."
  ur: "چین اور ترکستان کے درمیان آباد تاتار قوم کا بادشاہ کچلی خان؛ کھیتا کے ساتھ طویل جنگ میں، اس نے اپنے میزبانوں کو ان کے خلاف مارچ کیا اور خوارزمشاہ سے مدد کی درخواست کی - جس نے دونوں کیمپوں کو دھوکہ دیا اور انہیں ایک دوسرے کو تباہ کرنے دیا، خیتا کو مارا پیٹا گیا اور ان کے باقی بچے اس کے ساتھ شامل ہوگئے - جب کہ کچلی خان نے کاشغر، ترکستان اور ساگھون لے لیا، یہاں تک کہ منگول قوم نے چنگیز اور خضرشاہ کے خلاف اس کے خلاف جنگ جاری رکھی۔"
  tr: "Kaşlı Han, Çin sınırlarında Türkistan ile yerleşen bir Tatar ulusunun kralıydı; aralarında düşmanlık ve savaşlar vardı. Kendi ulusları arasında Hattar'a ilerledi, fırsatı değerlendirdi ve Hatizm Şah'a zafer istemek için Hatizm Şah'a gönderdi, Hatla'yı yenmeyi umarak. Harezm Şah, her fraksiyonu kendisine ait olduğuna inandırmaya hazırlandı ve onların adına karar kaldı. Onunla yüzleştiler, ancak Haşlı Han yenildi ve onların tarafını tuttu. Kaşlı Han Kaşgar, Türkistan ve Sagun'u ele geçirdi, Babür fraksiyonu ve kralı Cengiz Han ise ona karşı isyan etti ve savaşlarıyla onu işgal etti."
  id: "Kashli Khan adalah raja dari bangsa Tatar yang menetap di perbatasan Tiongkok dengan Turkestan; terjadi permusuhan dan perang antara mereka dan Khatla. Ia maju di antara bangsanya ke Khattar, memanfaatkan kesempatan dan mengirim surat kepada Khwarezm Shah untuk meminta kemenangan atas mereka, berharap mengalahkan Khatla. Khwarezm Shah bersiap menipu setiap faksi yang menjadi miliknya, dan ia memutuskan untuk membela mereka. Mereka menghadapi Khwarezm Shah, tetapi Khashli Khan dikalahkan dan berpihak pada mereka. Kashli Khan merebut Kashgar, Turkestan, dan Sagun, dan faksi Mughal serta raja mereka Genghaz Khan memberontak melawannya, menyita perang mereka."
