label:
  ar: كشلي خان ملك التتر
  en: Kuchli Khan, king of the Tatars
summary:
  ar: "كشلي خان، ملك أمة من التتر نزلوا في حدود الصين بينها وبين تركستان؛ كانت بينهم وبين الخطا عداوة وحروب، فزحف في أممه إلى الخطا لينتهز الفرصة فيهم فبعث إلى خوارزم شاه يسأله النصر عليهم فيعتد عليه بهزيمة الخطا، وتجهز خوارزم شاه يوهم كل فريق أنه له وأقام منتبذاً عنهما وقد تواقعوا فانهزم الخطا ومال معه عليهم، واستولى كشلي خان على كاشغر وبلاد تركستان وساغون، وخرجت عليه طائفة المغل وملكهم جنكزخان فشغله بحربهم."
  en: "Kuchli Khan, king of a Tatar nation settled between China and Turkestan; long at war with the Khita, he marched his hosts against them and solicited Khwarazmshah's aid — who deceived both camps and let them destroy each other, the Khita beaten and their remnant joined to him — while Kuchli Khan took Kashghar, Turkestan and Saghun, until the Mongol nation under Genghis Khan rose against him and kept him from Khwarazmshah's war."
