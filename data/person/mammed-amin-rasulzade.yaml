summary:
  ar: "سياسي وصحفي أذربيجاني (1884–1955)، مؤسس حركة «مساوات» ورئيس المجلس الوطني الأذربيجاني الذي أعلن جمهورية أذربيجان الديمقراطية في 28 مايو 1918؛ قضى بقية حياته في المنفى بين إيران وتركيا وأوروبا، وتوفي في أنقرة."
  en: "Azerbaijani politician and journalist (1884–1955), founder of the Musavat movement and chairman of the Azerbaijani National Council, which proclaimed the Azerbaijan Democratic Republic on 28 May 1918. After its fall in 1920 he spent the rest of his life in exile in Iran, Turkey and Europe, and died in Ankara."
  ur: "آذربائیجانی سیاست دان اور صحافی (1884–1955)، تحریکِ «مساوات» کے بانی اور آذربائیجانی قومی کونسل کے صدر، جس نے 28 مئی 1918 کو آذربائیجان جمہوری جمہوریہ کا اعلان کیا؛ بقیہ زندگی جلاوطنی میں گزری اور انقرہ میں وفات پائی۔"
