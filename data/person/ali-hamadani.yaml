summary:
  ar: "علي الهمداني، صوفي من همدان من أسرة سيادة، ورسول الإسلام في كشمير، زار كشمير ثلاث مرات (774هـ/1372م و781هـ/1379م و785هـ/1383م)، وتوفي سنة 786هـ/1385م في طريقه إلى تركستان، ودُفن في خُتلان، وكتابه «أوراد الفتحية» و«ذخيرة الملوك» في الأخلاق السياسية {cite:encyclopaedia-of-islam-2 vol. 1 p. 414}."
  en: "Ali Hamadani, a Sufi of a sayyid family of Hamadan and the apostle of Islam in Kashmir. He visited Kashmir three times (1372, 1379 and 1383) and died in 786/1385 on his way to Turkistan, being buried at Khuttalan. His works include the Awrad-i fathiyya and the Dhakhirat al-muluk on political ethics {cite:encyclopaedia-of-islam-2 vol. 1 p. 414}."
