summary:
  ar: "رجل من أهل نجران استودعه محمد بن عبيد الله حرمه سنة 288هـ ثم سيّر حرمه وصبيانه إليه بالحصن."
  en: "A man of Najran to whom Muhammad ibn Ubaydallah entrusted his womenfolk in 288 AH and who brought them and the children to him at al-Hisn."
  ur: "نجران کا ایک شخص جسے محمد بن عبید اللہ نے 288ھ میں اپنی خواتین کی حفاظت سونپی اور جس نے انہیں اور بچوں کو حصن میں ان کے پاس پہنچایا۔"
  es: "Un hombre de Najran a quien Muhammad ibn Ubaydallah confió a sus mujeres en el año 288 de la Hégira y que las llevó a ellas y a los niños ante él en al-Hisn."
  fr: "Un homme de Najran à qui Muhammad ibn Ubaydallah confia ses femmes en 288 AH et qui les amena avec les enfants à al-Hisn."
  tr: "288 Hicri yılında Muhammed bin Ubeyd Allah tarafından Necranlı bir adam eşine emanet edildi, ardından eşi ve çocukları kaleye gönderildi."
  id: "Seorang pria dari Najran dipercayakan kepada istrinya oleh Muhammad bin Ubayd Allah pada tahun 288 H, kemudian istri dan anak-anaknya dikirim kepadanya di benteng."
