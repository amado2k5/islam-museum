summary:
  ar: "استفان، زعيم البوغدان ⁦(ملدافيا)⁩؛ ينقل الصلابي أنه كمن لجيش محمد الفاتح في إحدى معارك البلقان متخفياً مع جيشه خلف الأشجار الكثيفة، فانهمرت نيران المدافع على المسلمين وكاد الاضطراب يسود لولا أن صاح الفاتح في جنوده «كونوا جند الله» وأمسك الترس واستل سيفه واندفع بهم إلى الغابة فدارت معركة بالسيوف من الضحى إلى الأصيل، مُزّق فيها الجنود البوغدانية وسقط استفان عن جواده ولم ينجُ إلا بصعوبة {cite:dawlat-uthmaniyya-salabi p. 135}."
  en: "Stephen, lord of Moldavia (Bogdan); al-Salabi recounts his ambush of Mehmed II's army in the Balkans — hidden with his men behind dense woods, his cannon fire threw the Muslim ranks into near-disorder until the sultan cried 'be God's soldiers,' took up shield and sword and led the charge into the forest, where sword-fighting ran from morning to evening; the Moldavian troops were torn apart and Stephen fell from his horse, escaping only with difficulty {cite:dawlat-uthmaniyya-salabi p. 135}."
  es: "Esteban, señor de Moldavia (Bogdan); al-Salabi relata su emboscada al ejército de Mehmed II en los Balcanes: oculto con sus hombres tras densos bosques, su fuego de cañón sumió a las filas musulmanas en un desorden casi total hasta que el sultán gritó \"¡Sed soldados de Dios!\", tomó escudo y espada y dirigió la carga hacia el bosque, donde la lucha con espadas se prolongó desde la mañana hasta la noche; las tropas moldavas fueron diezmadas y Esteban cayó de su caballo, escapando solo con dificultad {cite:dawlat-uthmaniyya-salabi p. 135}."
  fr: "Étienne, seigneur de Moldavie (Bogdan); al-Salabi raconte son embuscade contre l'armée de Mehmed II dans les Balkans — caché avec ses hommes derrière des bois denses, ses tirs de canon ont presque désorganisé les rangs musulmans jusqu'à ce que le sultan crie « soyez les soldats de Dieu », prenne son bouclier et son épée et mène la charge dans la forêt, où les combats à l'épée se sont poursuivis du matin au soir; les troupes moldaves ont été déchirées et Étienne est tombé de son cheval, ne s'échappant qu'avec difficulté {cite:dawlat-uthmaniyya-salabi p. 135}."
  ur: "سٹیفن، مالڈاویا ⁦(بوگدان)⁩ کا لارڈ؛ الصلبی نے بلقان میں محمد ثانی کی فوج پر گھات لگا کر حملہ کیا - گھنے جنگلوں کے پیچھے اپنے آدمیوں کے ساتھ چھپے ہوئے، اس کی توپ کی گولی نے مسلمانوں کی صفوں کو قریب سے بدحالی میں ڈال دیا یہاں تک کہ سلطان نے 'خدا کے سپاہی بنو' پکارا، ڈھال اور تلوار اٹھائی اور الزام کو صبح سے شام تک جنگل میں لے گیا۔ مالڈویائی فوجیں ٹوٹ پھوٹ کا شکار ہو گئیں اور سٹیفن اپنے گھوڑے سے گرا اور بڑی مشکل سے بچ نکلا۔ 135}۔"
  tr: "Bogdan (Moldova) lideri Stefan; El-Salabi, Balkan savaşlarından birinde Muhammed Fatih'in ordusuna sık ağaçların arkasına saklanarak pusu kurduğunu bildirir. Toplar Müslümanların üzerine yağmur gibi yağdı ve huzursuzluk neredeyse galip geldi, ancak fatih askerlerine \"Tanrı'nın askerleri olun\" diye bağırdı, kalkanı kaptı, kılıcını çekti ve onlarla birlikte ormana doğru saldırdı. Şafaktan sonuna kadar bir kılıç savaşı başladı, Bogdanlı askerler parçalandı ve Stefan atından düştü, ancak zorlukla hayatta kaldı {atıf:dawlat-uthmaniyya-salabi, s. 135}."
  id: "Stefan, pemimpin Bogdan (Moldavia); Al-Salabi melaporkan bahwa ia menyergap pasukan Muhammad Sang Penakluk dalam salah satu pertempuran Balkan, bersembunyi di balik pepohonan lebat. Meriam menghujani Muslim, dan kerusuhan hampir terjadi, tetapi sang penakluk berteriak kepada tentaranya, \"Jadilah prajurit Tuhan,\" meraih perisai, menghunus pedangnya, dan menyerbu bersama mereka ke hutan. Pertempuran pedang terjadi dari fajar hingga akhir, merobek tentara Bogdania, dan Stefan jatuh dari kudanya, hanya bertahan dengan susah payah {cite:dawlat-uthmaniyya-salabi, hlm. 135}."
