summary:
  ar: "استفان، زعيم البوغدان (ملدافيا)؛ ينقل الصلابي أنه كمن لجيش محمد الفاتح في إحدى معارك البلقان متخفياً مع جيشه خلف الأشجار الكثيفة، فانهمرت نيران المدافع على المسلمين وكاد الاضطراب يسود لولا أن صاح الفاتح في جنوده «كونوا جند الله» وأمسك الترس واستل سيفه واندفع بهم إلى الغابة فدارت معركة بالسيوف من الضحى إلى الأصيل، مُزّق فيها الجنود البوغدانية وسقط استفان عن جواده ولم ينجُ إلا بصعوبة {cite:dawlat-uthmaniyya-salabi p. 135}."
  en: "Stephen, lord of Moldavia (Bogdan); al-Salabi recounts his ambush of Mehmed II's army in the Balkans — hidden with his men behind dense woods, his cannon fire threw the Muslim ranks into near-disorder until the sultan cried 'be God's soldiers,' took up shield and sword and led the charge into the forest, where sword-fighting ran from morning to evening; the Moldavian troops were torn apart and Stephen fell from his horse, escaping only with difficulty {cite:dawlat-uthmaniyya-salabi p. 135}."
