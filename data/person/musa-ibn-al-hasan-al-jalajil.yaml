summary:
  ar: "أبو السري الأنصاري المعروف بالجلاجلي، نسائي الأصل، سمع روح بن عبادة وعفان بن مسلم وأبا نعيم والقعنبي، وكان يتقدمه القعنبي في صلاة التراويح فأعجبه صوته فقال: كأن صوتك الجلاجل! فلُقّب بذلك، وكان ثقة روى عنه أبو بكر الآدمي القارئ وابن مخلد والنجاد؛ توفي في صفر هذه السنة {cite:muntazam-ibn-al-jawzi p. 187}."
  en: "Abu'l-Sari the Ansari 'al-Jalajili' — so dubbed when al-Qa'nabi, pleased by his voice leading tarawih, said 'your voice is like bells!'; a trustworthy transmitter from Ruh ibn 'Ubada and 'Affan. He died in Safar 288 {cite:muntazam-ibn-al-jawzi p. 187}."
