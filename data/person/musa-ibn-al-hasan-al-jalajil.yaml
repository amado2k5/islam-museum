summary:
  ar: "أبو السري الأنصاري المعروف بالجلاجلي، نسائي الأصل، سمع روح بن عبادة وعفان بن مسلم وأبا نعيم والقعنبي، وكان يتقدمه القعنبي في صلاة التراويح فأعجبه صوته فقال: كأن صوتك الجلاجل! فلُقّب بذلك، وكان ثقة روى عنه أبو بكر الآدمي القارئ وابن مخلد والنجاد؛ توفي في صفر هذه السنة {cite:muntazam-ibn-al-jawzi p. 187}."
  en: "Abu'l-Sari the Ansari 'al-Jalajili' — so dubbed when al-Qa'nabi, pleased by his voice leading tarawih, said 'your voice is like bells!'; a trustworthy transmitter from Ruh ibn 'Ubada and 'Affan. He died in Safar 288 {cite:muntazam-ibn-al-jawzi p. 187}."
  es: "Abu'l-Sari el Ansari 'al-Jalajili' —así apodado cuando al-Qa'nabi, complacido por su voz al frente del tarawih, dijo: «¡Tu voz es como campanas!»— fue un transmisor fidedigno de Ruh ibn 'Ubada y 'Affan. Murió en Safar 288 {cite:muntazam-ibn-al-jawzi p. 187}."
  fr: "Abu'l-Sari l'Ansari « al-Jalajili » — ainsi surnommé lorsqu'al-Qa'nabi, ravi par sa voix dirigeant la prière de tarawih, s'exclama: « Ta voix est comme des cloches ! »; transmetteur fiable de Ruh ibn 'Ubada et 'Affan. Il mourut en Safar 288 {cite: muntazam-ibn-al-jawzi p. 187}."
  ur: "ابو الساری انصاری 'الجلاجیلی' - اس کا نام اس وقت لیا گیا جب القنبی نے تراویح پڑھانے والی اپنی آواز سے خوش ہو کر کہا 'تمہاری آواز گھنٹیوں کی طرح ہے!'؛ روح بن عبادہ اور عفان کی طرف سے ایک قابل اعتماد ٹرانسمیٹر۔ ان کی وفات صفر 288 میں ہوئی۔ 187}۔"
  tr: "Ebu el-Sari el-Ensari, namıdiğer el-Celacli ve kadın kökenli, Ruh ibn Ubadah, Affan ibn Müslim, Ebu Nuaym ve el-Ka'nabi'yi dinlemiştir. El-Ka'nabi onu Teravih namazlarında yönetirdi, sesini severdi ve şöyle derdi: 'Görünüşe göre sesin Celayil!' Bu lakabı ona verildi ve güvenilirdi. O yıl Ebu Bekir el-Ademi, okunan İbn Mukhlad ve el-Najad, ondan rivayet etti {alıntı:Muntazam-ibn-al-jawzi, s. 187}."
  id: "Abu al-Sari al-Ansari, yang dikenal sebagai al-Jalajli, berasal dari perempuan, mendengar Ruh ibn Ubadah, Affan ibn Muslim, Abu Nu'aym, dan al-Qa'nabi. Al-Qa'nabi biasa memimpinnya dalam shalat Taraweeh, dan ia menyukai suaranya dan berkata: 'Sepertinya suaramu adalah Jalajil!' Ia dijuluki demikian, dan ia dapat dipercaya. Abu Bakr al-Adami, sang pembaca, Ibn Mukhlad, dan al-Najad, menceritakan darinya pada tahun itu {cite:Muntazam-ibn-al-jawzi, hlm. 187}."
