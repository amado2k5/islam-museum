label:
  ar: يحيى بن علي بن غانية
  en: Yahya ibn Ali ibn Ghaniya
summary:
  ar: "يحيى بن علي بن غانية الصنهاجي المسوفي؛ نشأ هو وأخوه محمد في ظل يوسف بن تاشفين وحجر كفالته، فعقد له علي بن يوسف بن تاشفين على غرب الأندلس وأنزله قرطبة، ولما ملك أبو إسحاق براق المصمودي إشبيلية للموحدين اقتضى طاعته واستنزله عن قرطبة إلى جيان والقلعة، فسار منها إلى غرناطة يستنزل من بها من لمتونة ويحملهم على طاعة الموحدين فهلك هنالك سنة ثلاث وأربعين وخمسمائة ودفن بقصر باديس."
  en: "Yahya ibn Ali ibn Ghaniya the Sanhaji Massufi; raised with his brother Muhammad in Yusuf ibn Tashfin's guardianship — Ali ibn Yusuf granted him the western Andalus seated at Cordoba, and when the Almohad Abu Ishaq Barraq al-Masmudi took Seville he demanded Yahya's obedience and moved him from Cordoba to Jaen and the Qal'a; marching thence to Granada to bring down its Lamtuna garrison into Almohad allegiance, he died there in 543 and was buried at Qasr Badis."
