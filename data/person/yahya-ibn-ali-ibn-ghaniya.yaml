id: person/yahya-ibn-ali-ibn-ghaniya
class: person
label:
  ar: يحيى بن علي بن غانية
  en: Yahya ibn Ali ibn Ghaniya
  es: "Yahya ibn Ali ibn Ghaniya"
  fr: "Yahya ibn Ali ibn Ghaniya"
  ur: "یحییٰ ابن علی ابن غنیہ"
summary:
  ar: "يحيى بن علي بن غانية الصنهاجي المسوفي؛ نشأ هو وأخوه محمد في ظل يوسف بن تاشفين وحجر كفالته، فعقد له علي بن يوسف بن تاشفين على غرب الأندلس وأنزله قرطبة، ولما ملك أبو إسحاق براق المصمودي إشبيلية للموحدين اقتضى طاعته واستنزله عن قرطبة إلى جيان والقلعة، فسار منها إلى غرناطة يستنزل من بها من لمتونة ويحملهم على طاعة الموحدين فهلك هنالك سنة ثلاث وأربعين وخمسمائة ودفن بقصر باديس."
  en: "Yahya ibn Ali ibn Ghaniya the Sanhaji Massufi; raised with his brother Muhammad in Yusuf ibn Tashfin's guardianship — Ali ibn Yusuf granted him the western Andalus seated at Cordoba, and when the Almohad Abu Ishaq Barraq al-Masmudi took Seville he demanded Yahya's obedience and moved him from Cordoba to Jaen and the Qal'a; marching thence to Granada to bring down its Lamtuna garrison into Almohad allegiance, he died there in 543 and was buried at Qasr Badis."
  es: "Yahya ibn Ali ibn Ghaniya, el sanhaji masufi, fue criado junto a su hermano Muhammad bajo la tutela de Yusuf ibn Tashfin. Ali ibn Yusuf le concedió el Andalus occidental, con sede en Córdoba, y cuando el almohade Abu Ishaq Barraq al-Masmudi tomó Sevilla, exigió la obediencia de Yahya y lo trasladó de Córdoba a Jaén y Qal'a. Posteriormente, marchó a Granada para someter a su guarnición de Lamtuna a la lealtad almohade, donde murió en 543 y fue enterrado en Qasr Badis."
  fr: "Yahya ibn Ali ibn Ghaniya, le Massoufi Sanhaji, fut élevé avec son frère Muhammad sous la tutelle de Yusuf ibn Tashfin. Ali ibn Yusuf lui accorda l'Andalousie occidentale, située à Cordoue, et lorsque l'Almohade Abu Ishaq Barraq al-Masmudi prit Séville, il exigea l'obéissance de Yahya et le déplaça de Cordoue à Jaen et à la Qal'a; marchant de là vers Grenade pour amener sa garnison de Lamtuna à l'allégeance almohade, il y mourut en 543 et fut enterré à Qasr Badis."
  ur: "یحییٰ ابن علی ابن ثنیہ سنہاجی مصوفی؛ یوسف بن تاشفین کی سرپرستی میں اپنے بھائی محمد کے ساتھ پرورش پائی - علی ابن یوسف نے انہیں قرطبہ میں مغربی اندلس کا اقتدار عطا کیا، اور جب المحدث ابو اسحاق براق المسمودی نے سیویل کو لیا تو اس نے یحییٰ کی اطاعت کا مطالبہ کیا اور اسے قرطبہ سے جین اور قلعہ منتقل کر دیا۔ وہاں سے غرناطہ کی طرف مارچ کرتے ہوئے اس کی لامتونہ چھاؤنی کو الموحد کی بیعت میں لے آیا، وہیں 543 میں فوت ہوا اور قصر بادیس میں دفن ہوا۔"
