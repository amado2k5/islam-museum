label: { ar: "مسلم بن عقبة المري المسرف", en: "Muslim ibn 'Uqba al-Murri al-Musrif", es: "Muslim ibn 'Uqba al-Murri al-Musrif", fr: "Muslim ibn 'Uqba al-Murri al-Musrif", ur: "مسلم بن عقبہ المری المصرف" }
summary:
  ar: "قائد جيش يزيد إلى المدينة الذي أخافها ونهبها وقتل أهلها وبايعهم على أنهم عبيد ليزيد وسماها نتنة، وسماه يزيد نفسه مسرفاً، وبايع الناس إلا علي بن الحسين وعلي بن عبد الله بن العباس، ثم سار إلى مكة فمات بقديد سنة أربع وستين فاستخلف الحصين بن نمير {cite:muruj-al-dhahab p. 67-69}."
  en: "Yazid's commander who 'shocked' Medina — its people forced to swear as slaves, the Prophet's 'Tayba' renamed 'stinking' — yet trembled before the praying 'Ali ibn al-Husayn and exempted him; he died at Qadid on the Mecca road in 64 {cite:muruj-al-dhahab p. 67-69}."
  es: "El comandante de Yazid que 'conmocionó' a Medina —su gente obligada a jurar como esclavos, la 'Tayba' del Profeta rebautizada como 'apestosa'— sin embargo tembló ante el rezado 'Ali ibn al-Husayn y lo eximió; murió en Qadid en el camino a La Meca en el año 64 {cite:muruj-al-dhahab p. 67-69}."
  fr: "Le commandant de Yazid qui « choqua » Médine — ses habitants forcés de jurer comme des esclaves, la « Tayba » du Prophète rebaptisée « puante » — trembla pourtant devant 'Ali ibn al-Husayn en prière et l'exempta; il mourut à Qadid sur la route de La Mecque en 64 {cite:muruj-al-dhahab p. 67-69}."
  ur: "یزید کا کمانڈر جس نے مدینہ کو 'چونک دیا' - اس کے لوگوں کو غلاموں کی قسم کھانے پر مجبور کیا گیا، پیغمبر کی 'طیبہ' کا نام 'بدبودار' رکھ دیا گیا - پھر بھی علی ابن الحسین کے سامنے کانپ گیا اور اسے مستثنیٰ قرار دے دیا۔ ان کی وفات مکہ کے راستے قدد میں 64 میں ہوئی۔ 67-69}۔"
  tr: "Medine'ye Yazid'in ordusunun komutanıydı; ordu Medine'yi korkutmuş, yağmalamış, halkını öldürmüş ve Yezide'e köle olarak bağlılık yemini etmiş, orayı pis bir yer olarak nitelendirmiştir. Yezid kendini savurgan olarak nitelendirmiş, Ali ibn al-Hüseyin ve Ali ibn Abdullah ibn al-Abbas hariç halka bağlılık yemini etmiştir. Sonra Mekke'ye yürüdü ve altmış dördüncü yılda Kadid'de öldü; ardından el-Hüseyin bin Numayr tarafından halef olarak atandı {atıf:muruj-al-dhahab, s. 67-69}."
  id: "Ia adalah komandan pasukan Yazid ke Madinah, yang menakut-nakutinya, menjarah, membunuh rakyatnya, dan bersumpah setia kepada mereka sebagai budak kepada Yazid, menyebutnya tempat yang busuk. Yazid menyebut dirinya boros, bersumpah setia kepada rakyat kecuali Ali ibn al-Husayn dan Ali ibn Abdullah ibn al-Abbas. Kemudian ia berbaris ke Mekah dan meninggal di Qadid pada tahun enam puluh empat, setelah itu ia diangkat sebagai penerus oleh al-Husayn ibn Numayr {cite:muruj-al-dhahab, hlm. 67-69}."
