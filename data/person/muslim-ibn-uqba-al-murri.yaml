summary:
  ar: "قائد جيش يزيد إلى المدينة الذي أخافها ونهبها وقتل أهلها وبايعهم على أنهم عبيد ليزيد وسماها نتنة، وسماه يزيد نفسه مسرفاً، وبايع الناس إلا علي بن الحسين وعلي بن عبد الله بن العباس، ثم سار إلى مكة فمات بقديد سنة أربع وستين فاستخلف الحصين بن نمير {cite:muruj-al-dhahab p. 67-69}."
  en: "Yazid's commander who 'shocked' Medina — its people forced to swear as slaves, the Prophet's 'Tayba' renamed 'stinking' — yet trembled before the praying 'Ali ibn al-Husayn and exempted him; he died at Qadid on the Mecca road in 64 {cite:muruj-al-dhahab p. 67-69}."
