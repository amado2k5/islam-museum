summary:
  ar: "عثمان بن فودي (1754–1817)، عالم فولاني من غوبير في بلاد الهوسا، مؤسس خلافة صوكوتو وأول خلفائها. كان صوفيًّا قادريًّا ومالكيَّ المذهب، ألّف أكثر من مائة كتاب في العلوم الشرعية، وقاد منذ سنة 1804 الجهاد الذي أطاح بممالك الهوسا وأقام أكبر دولة إسلامية في غرب أفريقيا في عصره، ثم ترك إدارة الدولة لابنه محمد بيلو وأخيه عبد الله وتفرّغ للتعليم والتصنيف."
  en: "Usman dan Fodio (1754–1817), a Fulani scholar of Gobir in Hausaland, founder of the Sokoto Caliphate and its first caliph. A Qadiri Sufi and a Maliki jurist, he wrote more than a hundred books on the Islamic sciences and from 1804 led the jihad that overthrew the Hausa kingdoms and raised the largest Muslim state in West Africa of its age, then left the state's administration to his son Muhammad Bello and his brother Abdullahi and returned to teaching and writing."
  ur: "عثمان دان فودیو (1754–1817)، ہاؤسا لینڈ کے علاقے گوبیر کے فولانی عالم، خلافت سوکوتو کے بانی اور اس کے پہلے خلیفہ۔ وہ قادری صوفی اور مالکی فقیہ تھے؛ انھوں نے اسلامی علوم پر سو سے زائد کتابیں لکھیں اور 1804 سے اس جہاد کی قیادت کی جس نے ہاؤسا بادشاہتوں کو ختم کر کے اپنے دور کی مغربی افریقہ کی سب سے بڑی مسلم ریاست قائم کی، پھر ریاست کی انتظامیہ اپنے بیٹے محمد بیلو اور بھائی عبد اللہ کے سپرد کر کے خود تعلیم و تصنیف کی طرف لوٹ آئے۔"

