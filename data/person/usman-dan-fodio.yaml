      Two independent sources name the school for the man himself. The Arabic
      article opens by calling him Maliki in madhhab; the English article
      records that he insisted on the observance of the Maliki fiqh in personal
      observances as well as in commercial and criminal law, and counts Maliki
      jurisprudence among the subjects of his hundreds of works. The Arabic
      article also names his creed as Ash'ari; the creed is recorded in this
      note only — the person schema has no creed compound.
    sources: [source/wikipedia-usman-dan-fodio-ar, source/wikipedia-usman-dan-fodio-en]
  - value: sufi
    basis: documented
    note: >-
      Two independent sources name the order for the man himself. The English
      article records his initiation into the Qadiriyya and that he later
      became head of his Qadiriyya brotherhood, teaching his own wird;
      Britannica records that his teacher Jibril ibn Umar admitted him to the
      Qadiri and other Sufi orders. The Arabic article likewise calls him a
      Sufi on the Qadiri path. His membership is also carried as a member_of
