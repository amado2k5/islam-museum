summary:
  ar: "داعية ماليزي من أصل صيني ومؤسس منظمة «مسلمون عائدون متعددو الأعراق» (MRM) ورئيسها. وُلد في أسرة صينية بوذية في جينجانغ بكوالالمبور، ومرّ بمرحلة فكر حر ثم اعتنق الإسلام في أغسطس 2005 وهو في الثانية والعشرين، وتفرغ للدعوة منذ 2013 متخصصا في مقارنة الأديان والدعوة الميدانية؛ أحصت صحيفة Focus Malaysia في مارس 2024 أكثر من 540 ألف متابع له على فيسبوك وأكثر من 350 ألفا على إنستغرام."
  en: "Malaysian preacher of Chinese descent and the founder and president of Multiracial Reverted Muslims (MRM). Born into a Chinese Buddhist family in Jinjang, Kuala Lumpur, he passed through a freethinker period and embraced Islam in August 2005 at the age of 22; he has worked full-time in dawah since 2013, specialising in comparative religion and street outreach. Focus Malaysia counted more than 540,000 Facebook followers and more than 350,000 Instagram followers for him in March 2024."
  ur: "چینی نژاد ملائیشیائی مبلغ اور ملٹی ریشل ریورٹڈ مسلمز (MRM) کے بانی و صدر۔ کوالالمپور کے جنجانگ میں ایک چینی بدھ خاندان میں پیدا ہوئے، آزاد خیالی کے دور سے گزرے اور اگست 2005 میں 22 سال کی عمر میں اسلام قبول کیا؛ 2013 سے کل وقتی دعوت میں مصروف ہیں، تقابلِ ادیان اور گلی محلے کی دعوت ان کی خصوصیت ہے۔ Focus Malaysia نے مارچ 2024 میں ان کے فیس بک فالوورز 540 ہزار سے زائد اور انسٹاگرام فالوورز 350 ہزار سے زائد شمار کیے۔"
