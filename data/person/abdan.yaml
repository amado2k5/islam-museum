label: { ar: "عبدان", en: "Abdan", fr: "Abdan", es: "Abdan", ur: "عبدان" }
summary:
  ar: "عبدان صاحب الكتب المصنفة وتصبب لدعوة حمدان قرمط وأكثر كتبه منحول إليه، وفرق الدعاة في سواد الكوفة، قال ابن النديم ومن جهة أخرى أن الدعاة صاروا إلى البحرين وفارس والأحسى من جهة عبدان خليفة حمدان قرمط وصهره {cite:fihrist-ibn-al-nadim p. 265-267}. وهو أكثر الجماعة كتبا وتصنيفا وكل من عمل كتابا نحله إياه وله فهرست يحتوي على ما صنفه من الكتب منها كتاب الرحا والدولاب وكتاب الحدود والإسناد وكتاب اللامع وكتاب الزاهر وكتاب الميدان ومن كتبه الكبار كتاب النيران وكتاب الملاحم وكتاب المقصد {cite:fihrist-ibn-al-nadim p. 267-268}"
  en: "Abdan — Qarmat's brother-in-law, author of the movement's books {cite:fihrist-ibn-al-nadim}"
  fr: "Abdan — beau-frère de Qarmat, auteur des livres du mouvement {cite:fihrist-ibn-al-nadim}"
  es: "Abdan — Cuñado de Qarmat, autor de los libros del movimiento {cite:fihrist-ibn-al-nadim}"
  ur: "عبدان - قرمت کے بہنوئی، تحریک کی کتابوں کے مصنف"
  tr: "Gizli kitapların yazarı Abdan, Hamdan Qarmat'ın davasına bağlıydı ve kitaplarının çoğu ona yanlışlıkla atfedilmiştir. Vaizleri Kufa Sawad'ına dağıtmıştır. Öte yandan İbn al-Nadim, vaizlerin Hamdan Qarmat'ın halefi ve damadı Abdan'ın yetkisiyle Bahreyn, Fars ve el-Ahsa'ya gittiklerini söylemiştir (kaynak: Fihrist-ibn-al-nadim, s. 265-267). Grubun en üretken yazarı ve yazarıydı ve kitap yazan herkes onu ona atfetmiştir. Değirmen ve Çark Kitabı, Sınırlar ve İletim Kitabı, Parıldayan Kitabı, Işıltılı Kitabı ve Tarla Kitabı da dahil olmak üzere yazdığı kitapları içeren bir kataloğu vardı. Başlıca eserleri arasında Ateşler Kitabı, Savaşlar Kitabı ve Amaç Kitabı bulunmaktadır {cite:fihrist-ibn-al-nadim s. 267-268}."
  id: "Abdan, penulis buku-buku rahasia, mengabdikan diri pada perjuangan Hamdan Qarmat, dan sebagian besar bukunya secara keliru dikaitkan kepadanya. Ia menyebarkan para pendakwah ke seluruh Sawad Kufa. Ibn al-Nadim mengatakan, di sisi lain, bahwa para pendakwah pergi ke Bahrain, Fars, dan al-Ahsa atas otoritas Abdan, penerus Hamdan Qarmat dan menantunya {cite:fihrist-ibn-al-nadim hlm. 265-267}. Ia adalah penulis dan pengarang yang paling produktif di antara kelompok tersebut, dan setiap orang yang menulis buku mengaitkannya kepadanya. Ia memiliki katalog yang berisi buku-buku yang ia tulis, termasuk Kitab Penggilingan dan Roda, Kitab Batasan dan Transmisi, Kitab Cahaya, Kitab Cahaya Terang, dan Kitab Ladang. Di antara buku-buku utamanya adalah Kitab Api, Kitab Perang, dan Kitab Tujuan {cite:fihrist-ibn-al-nadim hlm. 267-268}."
