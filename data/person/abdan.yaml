label: { ar: "عبدان", en: "Abdan" }
summary:
  ar: "عبدان صاحب الكتب المصنفة وتصبب لدعوة حمدان قرمط وأكثر كتبه منحول إليه، وفرق الدعاة في سواد الكوفة، قال ابن النديم ومن جهة أخرى أن الدعاة صاروا إلى البحرين وفارس والأحسى من جهة عبدان خليفة حمدان قرمط وصهره {cite:fihrist-ibn-al-nadim p. 265-267}. وهو أكثر الجماعة كتبا وتصنيفا وكل من عمل كتابا نحله إياه وله فهرست يحتوي على ما صنفه من الكتب منها كتاب الرحا والدولاب وكتاب الحدود والإسناد وكتاب اللامع وكتاب الزاهر وكتاب الميدان ومن كتبه الكبار كتاب النيران وكتاب الملاحم وكتاب المقصد {cite:fihrist-ibn-al-nadim p. 267-268}"
  en: "Abdan — Qarmat's brother-in-law, author of the movement's books {cite:fihrist-ibn-al-nadim}"
