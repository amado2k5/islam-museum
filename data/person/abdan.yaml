  ar: "عبدان صاحب الكتب المصنفة وتصبب لدعوة حمدان قرمط وأكثر كتبه منحول إليه، وفرق الدعاة في سواد الكوفة، قال ابن النديم ومن جهة أخرى أن الدعاة صاروا إلى البحرين وفارس والأحسى من جهة عبدان خليفة حمدان قرمط وصهره {cite:fihrist-ibn-al-nadim p. 265-267}."
