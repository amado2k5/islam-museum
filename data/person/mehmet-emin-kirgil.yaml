summary:
  ar: "مقدّم برامج دينية ومفسّر أحلام تركي، عُرف بفقرته الأسبوعية في تفسير الأحلام ضمن برنامج «في الحياة كل شيء» على قناة بياز التلفزيونية، حيث يفسّر على الهواء أحلام المشاهدين، وبقناته الخاصة على يوتيوب المخصصة لبثوث تفسير الأحلام. بلغت قناته 302,000 مشترك كما في 10 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا. يصف هذا السجل مسيرته الإذاعية والتلفزيونية، ولا يتبنّى أي تفسير من تفسيراته."
  en: "Turkish religious broadcaster and dream interpreter, known for his weekly dream-interpretation slot on Beyaz TV's Hayatta Her Şey Var, where he interprets viewers' dreams live on air, and for his own YouTube channel of dream-interpretation broadcasts. His channel counted 302,000 subscribers as of 10 November 2026 per vidIQ — a dated platform count, not a museum-verified fact. This record describes his broadcasting career; it endorses none of his interpretations."
  ur: "ترک دینی نشریاتی پیش کار اور خوابوں کے تعبیر دان، جو بیاز ٹی وی کے پروگرام «حیات میں سب کچھ ہے» میں اپنی ہفتہ وار خوابوں کی تعبیر کی نشست کے لیے جانے جاتے ہیں، جہاں وہ ناظرین کے خوابوں کی براہِ راست تعبیر کرتے ہیں، اور خوابوں کی تعبیر کی نشریات کے اپنے یوٹیوب چینل کے لیے بھی۔ vidIQ کے مطابق 10 نومبر 2026ء کو ان کے چینل کے سبسکرائبر 302,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔ یہ ریکارڈ ان کے نشریاتی کیریئر کو بیان کرتا ہے؛ ان کی کسی تعبیر کی تائید نہیں کرتا۔"
  es: "Locutor religioso turco e intérprete de sueños, conocido por su sección semanal de interpretación de sueños en el programa Hayatta Her Şey Var de Beyaz TV, donde interpreta los sueños de los televidentes en directo, y por su propio canal de YouTube con transmisiones de interpretación de sueños. Su canal contaba con 302.000 suscriptores al 10 de noviembre de 2026, según vidIQ (dato antiguo de la plataforma, no verificado por ningún museo). Este registro describe su trayectoria profesional en la radiodifusión; no avala ninguna de sus interpretaciones."
