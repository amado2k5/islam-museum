summary:
  ar: "فقيهة وداعية مصرية (1948–2021)، أستاذة الفقه المقارن وعميدة كلية الدراسات الإسلامية والعربية للبنات بجامعة الأزهر، ألقت دروسًا يومية للنساء في المسجد الحرام بين 1987 و1989، وقدّمت برامج دينية في الفضائيات منها «في حب المصطفى»، وأسست جمعية الباقيات الصالحات الخيرية في المقطم، وتوفيت في القاهرة متأثرة بكورونا."
  en: "Egyptian jurist and preacher (1948–2021), professor of comparative fiqh and dean of the Faculty of Islamic and Arabic Studies for Women at Al-Azhar University, who gave daily lessons for women at the Masjid al-Haram from 1987 to 1989, presented religious television programmes including 'Fi Hubb al-Mustafa', founded the al-Baqiyat al-Salihat charity in al-Muqattam, and died in Cairo of Covid-19."
  ur: "مصری فقیہہ اور داعیہ (1948–2021)، جامعہ ازہر کے کلیۂ اسلامی و عربی علوم برائے خواتین میں فقہِ مقارن کی استاد اور اس کی ڈین، جنہوں نے 1987 سے 1989 تک مسجد الحرام میں خواتین کے لیے روزانہ درس دیے، «فی حب المصطفیٰ» سمیت ٹیلی وژن پر دینی پروگرام پیش کیے، مقطم میں الباقیات الصالحات خیراتی انجمن قائم کی، اور قاہرہ میں کورونا سے وفات پائی۔"
