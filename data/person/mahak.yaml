summary:
  ar: "ماهك دهقان أصطخر؛ صالح عبد الله بن عامر عن أهلها سنة ٢٨ ثم نكثوا بعده وقتلوا عامله فكر عليهم ففتحها عنوة."
  en: "Mahak, the dahqan of Istakhr; he truced Ibn Amir for its folk in 28h — they broke, killed his agent, and were taken by storm."
  es: "Mahak, el dahqan de Istakhr, hizo una tregua a Ibn Amir por su gente en el año 28h; ellos se rebelaron, mataron a su agente y fueron tomados por asalto."
  fr: "Mahak, le dahqan d'Istakhr; il a fait une trêve à Ibn Amir pour son peuple en 28h — ils ont rompu les liens, tué son agent et ont été pris d'assaut."
  ur: "مہک، استخار کا دہقان؛ اس نے ابن عامر کو اس کے لوگوں کے لیے 28ھ میں سمجھا - انہوں نے توڑ دیا، اس کے ایجنٹ کو مار ڈالا، اور طوفان کی زد میں آ گئے۔"
  tr: "Mahak Dehqan Astakhr; Salih Abdullah bin Amir'i 28. yılda halkından kopardı, sonra onlar onun peşinden isyan etti ve bir valiyi öldürdü. O da onları düşündü ve zorla fethetti."
  id: "Mahak Dehqan Astakhr; Saleh Abdullah bin Amir dari rakyatnya pada tahun 28, kemudian mereka memberontak setelah dia dan membunuh seorang gubernur. Dia memandang mereka dan menaklukkannya secara paksa."
