summary:
  ar: "أبو علي جعفر بن فلاح الكتامي؛ كان أحد قواد المعز بن تقي الدين المنصور العبيدي صاحب إفريقية، فلما أخذ جوهر الديار المصرية بعثه إلى الشام فغلب على الرملة في ذي الحجة سنة ثمان وخمسين وثلاثمائة ثم غلب على دمشق في المحرم سنة تسع وخمسين وأقام بها إلى سنة ستين، حتى خرج إليه الحسن بن أحمد القرمطي المعروف بالأعصم وهو عليل فظفر به فقتله وقتل من أصحابه خلقاً كثيراً {cite:wafayat-ayan}."
  en: "Ja'far b. Fallah al-Kutami — al-Mu'izz's commander sent by Jawhar to Syria; took Ramla in 358 and Damascus in 359, then was killed fighting the Qarmati al-A'sam in 360 {cite:wafayat-ayan}."
