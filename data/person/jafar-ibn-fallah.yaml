summary:
  ar: "أبو علي جعفر بن فلاح الكتامي؛ كان أحد قواد المعز بن تقي الدين المنصور العبيدي صاحب إفريقية، فلما أخذ جوهر الديار المصرية بعثه إلى الشام فغلب على الرملة في ذي الحجة سنة ثمان وخمسين وثلاثمائة ثم غلب على دمشق في المحرم سنة تسع وخمسين وأقام بها إلى سنة ستين، حتى خرج إليه الحسن بن أحمد القرمطي المعروف بالأعصم وهو عليل فظفر به فقتله وقتل من أصحابه خلقاً كثيراً {cite:wafayat-ayan}."
  en: "Ja'far b. Fallah al-Kutami — al-Mu'izz's commander sent by Jawhar to Syria; took Ramla in 358 and Damascus in 359, then was killed fighting the Qarmati al-A'sam in 360 {cite:wafayat-ayan}."
  es: "Ja'far b. Fallah al-Kutami, comandante de al-Mu'izz enviado por Jawhar a Siria; tomó Ramla en 358 y Damasco en 359, luego murió luchando contra Qarmati al-A'sam en 360 {cita:wafayat-ayan}."
  fr: "Ja'far b. Fallah al-Kutami — le commandant d'al-Mu'izz envoyé par Jawhar en Syrie; prit Ramla en 358 et Damas en 359, puis fut tué en combattant les Qarmati al-A'sam en 360 {cite: wafayat-ayan}."
  ur: "جعفر بی۔ فلہ الکتمی - المعز کا کمانڈر جوہر کی طرف سے شام بھیجا گیا؛ 358 میں رملہ اور 359 میں دمشق پر قبضہ کیا، پھر 360 میں قرمتی الاعصام سے لڑتے ہوئے مارا گیا۔"
  tr: "Ebu Ali Ca'far bin Falah el-Kattami, İfrikiye hükümdarı el-Mu'izz bin Taqi al-Din el-Mansur el-Ubaydi'nin komutanlarından biriydi. Mısır topraklarının kontrolünü ele geçirdiğinde onu Levant'a gönderdi; burada 358 Hicce'de Ramla'yı fethetti, ardından 59 Hicri yılında Muharrem'de Şam'ı fethetti ve 60 yılına kadar orada kaldı; ta ki el-Hasan ibn Ahmed al-Qarmati, yani el-A'saam, hastayken ona açılana kadar. Onu yakaladı, öldürdü ve birçok yoldaşını öldürdü {atıf:wafayat-ayan}."
  id: "Abu Ali Ja'far ibn Falah al-Kattami adalah salah satu komandan al-Mu'izz ibn Taqi al-Din al-Mansur al-Ubaidi, penguasa Ifriqiya. Ketika ia menguasai tanah Mesir, ia mengirimnya ke Levant, di mana ia menaklukkan Ramla di Dhu al-Hijjah pada tahun 358 H, kemudian menaklukkan Damaskus di Muharram pada tahun 59 H dan tinggal di sana hingga tahun 60, hingga al-Hasan ibn Ahmad al-Qarmati, yang dikenal sebagai al-A'saam, mengungkapkan identitasnya saat ia sakit. Ia menangkapnya, membunuhnya, dan membunuh banyak sahabatnya {cite:wafayat-ayan}."
