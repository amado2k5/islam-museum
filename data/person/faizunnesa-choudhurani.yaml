summary:
  ar: "زميندار هومن آباد بشيم غاون في كوميلا (1834-1903)، رائدة تعليم النساء في البنغال. أسست سنة 1873 مدرسة ثانوية للبنات في كوميلا من أقدم مدارس البنات الخاصة في شبه القارة، وأسست مدارس ومستشفى للنساء ومستوصفا خيريا ومساجد، وكتبت «روب جلال» (1876) أول عمل أدبي كامل لامرأة مسلمة بنغالية، فمنحتها الملكة فكتوريا سنة 1889 لقب «نواب» فصارت أول امرأة تحمل اللقب في جنوب آسيا."
  en: "Zamindar of Homnabad-Pashchimgaon in Comilla (1834–1903), a pioneer of female education in Bengal. In 1873 she established a girls' high school at Comilla, among the earliest privately founded girls' schools in the subcontinent; she founded schools, a women's hospital, a charitable dispensary and mosques, and wrote Rupjalal (1876), the first full-length literary work by a Bengali Muslim woman. In 1889 Queen Victoria awarded her the title of Nawab, making her the first female Nawab in South Asia."
  ur: "کومیلا میں ہومن آباد پچھم گاؤں کی زمیندار (1834ء–1903ء)، بنگال میں خواتین کی تعلیم کی پیش رو۔ انھوں نے 1873ء میں کومیلا میں لڑکیوں کا ہائی اسکول قائم کیا جو برصغیر کے اولین نجی لڑکیوں کے اسکولوں میں سے تھا؛ مدارس، خواتین کا اسپتال، خیراتی ڈسپنسری اور مساجد بنوائیں، اور «روپ جلال» (1876ء) لکھی جو کسی بنگالی مسلمان خاتون کی پہلی مکمل ادبی تصنیف ہے۔ 1889ء میں ملکہ وکٹوریہ نے انھیں «نواب» کا خطاب دیا اور وہ جنوبی ایشیا کی پہلی خاتون نواب بنیں۔"
