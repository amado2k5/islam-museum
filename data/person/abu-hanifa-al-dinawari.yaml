id: person/abu-hanifa-al-dinawari
class: person
label:
  ar: أبو حنيفة الدينوري
  en: Abu Hanifa al-Dinawari
  ur: ابو حنیفہ دینوری
  fr: "Abu Hanifa al-Dinawari"
  es: "Abu Hanifa al-Dinawari"
summary:
  ar: أبو حنيفة أحمد بن داود الدينوري، نحوي لغوي ومهندس منجّم حاسب، من أسرة فارسية الأصل بالدينور، تتلمذ لابن السكيت وأبيه، ورصد الكواكب بأصفهان، وصنف «الأخبار الطوال» و«النبات» و«الأنواء». وفاته عند محقق كتابه في جمادى الأولى سنة 282هـ {cite:akhbar-tiwal-amir intro scan p. 5} {cite:akhbar-tiwal-amir intro scan p. 6} {cite:akhbar-tiwal-amir intro scan p. 19}.
  en: Abu Hanifa Ahmad ibn Dawud al-Dinawari, grammarian, philologist, geometer, astronomer and arithmetician, from a family of Persian origin at Dinawar. He studied under Ibn al-Sikkit and his father, observed the stars at Isfahan, and wrote al-Akhbar al-Tiwal, the Book of Plants and the Book of Anwa'. His editor dates his death to Jumada al-Ula 282 AH {cite:akhbar-tiwal-amir intro scan p. 5} {cite:akhbar-tiwal-amir intro scan p. 6} {cite:akhbar-tiwal-amir intro scan p. 19}.
  ur: ابو حنیفہ احمد بن داود دینوری، نحوی، لغوی، مہندس، منجم اور حساب دان، دینور کے ایک فارسی الاصل خاندان سے۔ انہوں نے ابن السکیت اور ان کے والد سے پڑھا، اصفہان میں ستاروں کا مشاہدہ کیا، اور «الاخبار الطوال»، «کتاب النبات» اور «کتاب الانواء» لکھیں۔ ان کے محقق کے مطابق وہ جمادی الاولیٰ 282ھ میں فوت ہوئے {cite:akhbar-tiwal-amir intro scan p. 5} {cite:akhbar-tiwal-amir intro scan p. 6} {cite:akhbar-tiwal-amir intro scan p. 19}۔
  fr: "Abu Hanifa Ahmad ibn Dawud al-Dinawari, grammairien, philologue, géomètre, astronome et arithméticien, issu d'une famille d'origine persane de Dinawar. Il étudia auprès d'Ibn al-Sikkit et de son père, observa les étoiles à Ispahan, et écrivit al-Akhbar al-Tiwal, le Livre des plantes et le Livre des Anwa'. Son éditeur date sa mort de Jumada al-Ula 282 H {cite:akhbar-tiwal-amir intro scan p. 5} {cite:akhbar-tiwal-amir intro scan p. 6} {cite:akhbar-tiwal-amir intro scan p. 19}."
  es: "Abu Hanifa Ahmad ibn Dawud al-Dinawari, gramático, filólogo, geómetra, astrónomo y aritmético, provenía de una familia de origen persa en Dinawar. Estudió con Ibn al-Sikkit y su padre, observó las estrellas en Isfahán y escribió al-Akhbar al-Tiwal, el Libro de las Plantas y el Libro de Anwa'. Su editor fecha su muerte en Jumada al-Ula 282 AH. 5} {cite: news-tiwal-amir intro scan p. 6} {cite: news-tiwal-amir intro scan p. 19}."
  tr: "Dilbilimci, mühendis, astronom ve matematikçi olan Ebu Hanife Ahmed ibn Davud el-Dinawari, Dinaver'de Fars kökenli bir aileden geliyordu. İbn el-Sikkit ve babasının yanında eğitim gördü, İsfahan'da yıldızları gözlemledi ve \"El-Akhbar el-Tival\" (Uzun Anlatılar), \"El-Nabat\" (Bitkiler) ve \"El-Enve\" (Hava) adlı eserleri kaleme aldı. Kitabının editörüne göre, Hicri 282 Cemâde el-Ula ayında vefat etti."
  id: "Abu Hanifa Ahmad ibn Dawud al-Dinawari, seorang ahli tata bahasa, ahli bahasa, insinyur, astronom, dan matematikawan, berasal dari keluarga Persia di Dinawar. Ia belajar di bawah bimbingan Ibn al-Sikkit dan ayahnya, mengamati bintang-bintang di Isfahan, dan menulis kitab \"Al-Akhbar al-Tiwal\" (Kisah-Kisah Panjang), \"Al-Nabat\" (Tumbuhan), dan \"Al-Anwa'\" (Cuaca). Menurut editor bukunya, ia meninggal pada Jumada al-Ula tahun 282 H."
