summary:
  ar: "أبو حنيفة الدينوري، وصفه المسعودي بأنه ذو محل من العلم كبير، حرر في كتابه ما تقدم من علم الهيئة ومقدار الميل والأذرع والأقاليم، وسلب ذلك ابن قتيبة فنقله إلى كتبه نثلاً وجعله عن نفسه وقد فعل ذلك في كثير من كتب أبي حنيفة هذا {cite:muruj-al-dhahab p. 519}."
  en: "Praised by al-Mas'udi as a man of great standing in knowledge whose book perfected the astronomy of measures and climates — and whom Ibn Qutayba despoiled, transferring his work into his own books as his own, as he did with much of Abu Hanifa's writing {cite:muruj-al-dhahab p. 519}."
