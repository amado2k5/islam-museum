id: person/abu-hanifa-al-dinawari
class: person
label:
  ar: أبو حنيفة الدينوري
  en: Abu Hanifa al-Dinawari
  ur: ابو حنیفہ دینوری
summary:
  ar: أبو حنيفة أحمد بن داود الدينوري، نحوي لغوي ومهندس منجّم حاسب، من أسرة فارسية الأصل بالدينور، تتلمذ لابن السكيت وأبيه، ورصد الكواكب بأصفهان، وصنف «الأخبار الطوال» و«النبات» و«الأنواء». وفاته عند محقق كتابه في جمادى الأولى سنة 282هـ {cite:akhbar-tiwal-amir intro scan p. 5} {cite:akhbar-tiwal-amir intro scan p. 6} {cite:akhbar-tiwal-amir intro scan p. 19}.
  en: Abu Hanifa Ahmad ibn Dawud al-Dinawari, grammarian, philologist, geometer, astronomer and arithmetician, from a family of Persian origin at Dinawar. He studied under Ibn al-Sikkit and his father, observed the stars at Isfahan, and wrote al-Akhbar al-Tiwal, the Book of Plants and the Book of Anwa'. His editor dates his death to Jumada al-Ula 282 AH {cite:akhbar-tiwal-amir intro scan p. 5} {cite:akhbar-tiwal-amir intro scan p. 6} {cite:akhbar-tiwal-amir intro scan p. 19}.
  ur: ابو حنیفہ احمد بن داود دینوری، نحوی، لغوی، مہندس، منجم اور حساب دان، دینور کے ایک فارسی الاصل خاندان سے۔ انہوں نے ابن السکیت اور ان کے والد سے پڑھا، اصفہان میں ستاروں کا مشاہدہ کیا، اور «الاخبار الطوال»، «کتاب النبات» اور «کتاب الانواء» لکھیں۔ ان کے محقق کے مطابق وہ جمادی الاولیٰ 282ھ میں فوت ہوئے {cite:akhbar-tiwal-amir intro scan p. 5} {cite:akhbar-tiwal-amir intro scan p. 6} {cite:akhbar-tiwal-amir intro scan p. 19}۔
