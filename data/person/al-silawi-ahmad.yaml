summary:
  ar: "شهاب الدين السلاوي الحريري الدمشقي الشافعي؛ ولد سنة ثمان وثلاثين وسبعمائة أو نحوها وسمع من ابن رافع وابن كثير وتفقه على علاء الدين بن حجي وأخذ الحديث عن جده وتقي الدين بن رافع وابن كثير وأجاد قراءة المواعيد وقرأ الصحيح مراراً على عدة مشايخ وكان صوته حسناً وقراءته جيدة، وولي قضاء بعلبك ستة وثمانين ودرس وأفتى ثم ولى قضاء المدينة وتنقل في ولاية القضاء بصفد وغزة والقدس وغيرها، توفي في صفر سنة اثنتي عشرة وثمانمائة {cite:shadharat-dhahab p. 108-109}."
  en: "Shihab al-Din al-Silawi (b. ~738) — the fine-voiced reciter who read the Sahih aloud repeatedly to shaykhs and crowds; qadi successively of Baalbek (786), Medina, Safad, Gaza and Jerusalem; died Safar 812 {cite:shadharat-dhahab p. 108-109}."
