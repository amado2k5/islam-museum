summary:
  ar: "شهاب الدين السلاوي الحريري الدمشقي الشافعي؛ ولد سنة ثمان وثلاثين وسبعمائة أو نحوها وسمع من ابن رافع وابن كثير وتفقه على علاء الدين بن حجي وأخذ الحديث عن جده وتقي الدين بن رافع وابن كثير وأجاد قراءة المواعيد وقرأ الصحيح مراراً على عدة مشايخ وكان صوته حسناً وقراءته جيدة، وولي قضاء بعلبك ستة وثمانين ودرس وأفتى ثم ولى قضاء المدينة وتنقل في ولاية القضاء بصفد وغزة والقدس وغيرها، توفي في صفر سنة اثنتي عشرة وثمانمائة {cite:shadharat-dhahab p. 108-109}."
  en: "Shihab al-Din al-Silawi (b. ~738) — the fine-voiced reciter who read the Sahih aloud repeatedly to shaykhs and crowds; qadi successively of Baalbek (786), Medina, Safad, Gaza and Jerusalem; died Safar 812 {cite:shadharat-dhahab p. 108-109}."
  fr: "Shihab al-Din al-Silawi (né en 738) – le récitateur à voix fine qui lisait le Sahih à haute voix à plusieurs reprises aux cheikhs et aux foules ; qadi successivement de Baalbek (786), Médine, Safad, Gaza et Jérusalem ; est mort Safar 812 {cite:shadharat-dhahab p. 108-109}."
  es: "Shihab al-Din al-Silawi (n. ~738) — el recitador de hermosa voz que leía el Sahih en voz alta repetidamente a jeques y multitudes; cadí sucesivamente de Baalbek (786), Medina, Safad, Gaza y Jerusalén; murió en Safar 812 {cita: shadharat-dhahab p. 108-109}."
  ur: "شہاب الدین السلوی (b. ~ 738) - اچھی آواز والا قاری جو شیخوں اور ہجوم کو بار بار بلند آواز سے صحیح پڑھتا ہے۔ بعلبیک (786)، مدینہ، صفاد، غزہ اور یروشلم کی یکے بعد دیگرے قاضی۔ متوفی صفر 812 {حوالہ: شدارت ذہب ص 108-109}۔"
  tr: "Şihabeddin el-Selavi el-Hareri el-Dimashqi el-Şafii; yaklaşık 738 Hile yılında doğdu, İbn Rafi'den ve İbn Kathir'den dinledi, Ala'eddin ibn Haci'den fıkıh aldı, hadisleri dedesinden ve Taqi al-Din ibn Rafi' ile İbn Kathir'den öğrendi. El-Nev'id okuma konusunda ustalaştı, birkaç şeyhin yanında Sahih'i defalarca okudu, sesi iyi ve iyi okuttu. 1986'da Baalbek'te yargıç olarak görev yaptı, ders verdi, fetva verdi, ardından Medine'de yargıçlık yaptı ve Safed, Gazze, Kudüs ve diğer yerlerdeki yargılar arasında gidip geldi. 812 Hicri yılında Sefer'de öldü {atıf: şadharat-dhahab, s. 108-109}."
  id: "Shihab al-Din al-Salawi al-Hariri al-Dimashqi al-Shafi'i; lahir sekitar tahun 738 H, ia mendengar dari Ibn Rafi' dan Ibn Kathir, belajar fiqhis di bawah Ala' al-Din ibn Hajji, mempelajari hadis dari kakeknya, dan Taqi al-Din ibn Rafi' dan Ibn Kathir. Ia menguasai pembacaan al-Maw'id, berulang kali membacakan Sahih di bawah beberapa sheikh, memiliki suara yang baik, dan melafalkan dengan baik. Ia menjabat sebagai hakim Baalbek pada tahun 1986, mengajar, mengeluarkan fatwa, kemudian menjabat sebagai hakim di Madinah, dan berpindah antara lembaga peradilan di Safed, Gaza, Yerusalem, dan tempat lain. Ia meninggal di Safar pada tahun 812 H {cite:shadharat-dhahab, hlm. 108-109}."
