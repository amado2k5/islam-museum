summary:
  ar: "مقاتل فنون قتالية مختلطة نيجيري-أمريكي ومصارع حر سابق (وُلد سنة 1987 في أوتشي بنيجيريا وهاجر إلى تكساس طفلا). بطل وطني جامعي في المصارعة سنة 2010، وفائز ببطولة المقاتل النهائي 21 سنة 2015، وفاز ببطولة يو إف سي لوزن الوسط سنة 2019 فدافع عنها خمس مرات ناجحة قبل أن يخسرها سنة 2022؛ وصاحب أطول سلسلة انتصارات في تاريخ وزن الوسط في يو إف سي (15)."
  en: "Nigerian-American mixed martial artist and former freestyle wrestler (born 1987 in Auchi, Nigeria, emigrating to Texas as a child). NCAA Division II national wrestling champion in 2010, The Ultimate Fighter 21 winner in 2015, he won the UFC welterweight championship in 2019, defended it five times, and lost it in 2022; he holds the division-record 15-fight UFC win streak."
  ur: "نائیجیریائی-امریکی مخلوط مارشل آرٹسٹ اور سابق فری اسٹائل پہلوان (پیدائش 1987، اوچی، نائیجیریا؛ بچپن میں ٹیکساس منتقل ہوئے)۔ 2010 میں قومی کالج کشتی چیمپئن، 2015 میں الٹیمیٹ فائٹر 21 کے فاتح؛ 2019 میں یو ایف سی ویلٹر ویٹ چیمپئن بنے، پانچ بار کامیاب دفاع کیا اور 2022 میں خطاب ہار گئے؛ ویلٹر ویٹ میں 15 فتوحات کا ڈویژن ریکارڈ رکھتے ہیں۔"
