summary:
  ar: "مقاتل فنون قتالية مختلطة نيجيري-أمريكي ومصارع حر سابق ⁦(وُلد سنة 1987 في أوتشي بنيجيريا وهاجر إلى تكساس طفلا)⁩. بطل وطني جامعي في المصارعة سنة 2010، وفائز ببطولة المقاتل النهائي 21 سنة 2015، وفاز ببطولة يو إف سي لوزن الوسط سنة 2019 فدافع عنها خمس مرات ناجحة قبل أن يخسرها سنة 2022؛ وصاحب أطول سلسلة انتصارات في تاريخ وزن الوسط في يو إف سي (15)."
  en: "Nigerian-American mixed martial artist and former freestyle wrestler (born 1987 in Auchi, Nigeria, emigrating to Texas as a child). NCAA Division II national wrestling champion in 2010, The Ultimate Fighter 21 winner in 2015, he won the UFC welterweight championship in 2019, defended it five times, and lost it in 2022; he holds the division-record 15-fight UFC win streak."
  ur: "نائیجیریائی-امریکی مخلوط مارشل آرٹسٹ اور سابق فری اسٹائل پہلوان ⁦(پیدائش 1987، اوچی، نائیجیریا؛ بچپن میں ٹیکساس منتقل ہوئے)⁩۔ 2010 میں قومی کالج کشتی چیمپئن، 2015 میں الٹیمیٹ فائٹر 21 کے فاتح؛ 2019 میں یو ایف سی ویلٹر ویٹ چیمپئن بنے، پانچ بار کامیاب دفاع کیا اور 2022 میں خطاب ہار گئے؛ ویلٹر ویٹ میں 15 فتوحات کا ڈویژن ریکارڈ رکھتے ہیں۔"
  es: "Artista marcial mixto nigeriano-estadounidense y exluchador de estilo libre (nacido en 1987 en Auchi, Nigeria, emigró a Texas siendo niño). Campeón nacional de lucha libre de la División II de la NCAA en 2010, ganador de The Ultimate Fighter 21 en 2015, ganó el campeonato de peso wélter de la UFC en 2019, lo defendió cinco veces y lo perdió en 2022; ostenta el récord de la división con una racha de 15 victorias consecutivas en la UFC."
  fr: "Combattant nigérian-américain de MMA et ancien lutteur libre (né en 1987 à Auchi, au Nigéria, il a émigré au Texas durant son enfance). Champion national de lutte NCAA Division II en 2010, vainqueur de la saison 21 de The Ultimate Fighter en 2015, il a remporté le titre de champion UFC des poids welters en 2019, l'a défendu à cinq reprises, avant de le perdre en 2022; il détient le record de la catégorie avec une série de 15 victoires consécutives à l'UFC."
  tr: "Nijerya-Amerikalı karma dövüş sanatları dövüşçüsü ve eski serbest stil güreşçisi (1987'de Uchi, Nijerya'da doğdu ve çocukken Teksas'a göç etti). 2010'da ulusal üniversite güreş şampiyonu, 2015'te 21. Ultimate Fighter Şampiyonluğu'nu kazandı ve 2019'da UFC orta sıklet şampiyonluğunu kazandı; bu şampiyonluğu beş kez başarıyla savundu ve 2022'de kaybetti; ve UFC orta sıklet tarihindeki en uzun galibiyet serisine sahip (15)."
  id: "Seorang petarung seni bela diri campuran Nigeria-Amerika dan mantan pegulat gaya bebas (lahir pada 1987 di Uchi, Nigeria, dan berimigrasi ke Texas saat masih anak-anak). Juara gulat perguruan tinggi nasional pada 2010, pemenang Kejuaraan Ultimate Fighter ke-21 pada 2015, dan memenangkan gelar kelas menengah UFC pada 2019, mempertahankannya lima kali dengan sukses sebelum kalah pada 2022; dan memegang rekor kemenangan terpanjang dalam sejarah kelas menengah UFC (15)."
