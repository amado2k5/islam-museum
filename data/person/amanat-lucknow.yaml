summary:
  ar: "أمانت، الاسم الشعري لسيد آغا حسن ⁦(1231–1275هـ/1815–1858م)⁩، شاعر هندي مسلم بلغ فيه التكلف في مدرسة لكناو الأوردية ذروته، واشتهر بمسرحيته الموسيقية «إندر سبها»، التي أكملها سنة 1270هـ/1853م، وصارت نموذجًا لكثير من المسرحيات بعدها {cite:encyclopaedia-of-islam-2 vol. 1 p. 452}."
  en: "Amanat, the poetical name of Sayyid Agha Hasan (1231–1275 AH, 1815–1858 CE), a poet of Muslim India in whom the artificiality of the Lucknow school of Urdu poetry reached its height. He is chiefly remembered for the musical comedy Indar Sabha, completed in 1270/1853, which became the prototype of many later plays {cite:encyclopaedia-of-islam-2 vol. 1 p. 452}."
  es: "Amanat, nombre poético de Sayyid Agha Hasan (1231–1275 AH, 1815–1858 d. C.), poeta de la India musulmana en quien la artificialidad de la escuela de poesía urdu de Lucknow alcanzó su máxima expresión. Se le recuerda principalmente por la comedia musical Indar Sabha, terminada en 1270/1853, que se convirtió en el prototipo de muchas obras posteriores {cite:encyclopaedia-of-islam-2 vol. 1 p. 452}."
  fr: "Amanat, nom poétique de Sayyid Agha Hasan (1231-1275 AH, 1815-1858 CE), poète de l'Inde musulmane, est l'auteur de l'œuvre qui a incarné à la perfection l'artificialité de l'école de poésie ourdou de Lucknow. Il est surtout connu pour sa comédie musicale Indar Sabha, achevée en 1270/1853, qui devint le prototype de nombreuses pièces ultérieures (voir Encyclopaedia of Islam, vol. 2, p. 452)."
  ur: "امانت، سید آغا حسن ⁦(1231-1275 ہجری، 1815-1858 عیسوی)⁩ کا شاعرانہ نام، مسلم ہندوستان کے ایک شاعر جن میں اردو شاعری کے لکھنؤ مکتب کی مصنوعی پن اپنے عروج پر پہنچ گئی۔ انہیں خاص طور پر 1270/1853 میں مکمل ہونے والی میوزیکل کامیڈی اندر سبھا کے لیے یاد کیا جاتا ہے، جو بعد میں آنے والے بہت سے ڈراموں کا نمونہ بن گیا۔ 1 ص۔ 452}۔"
