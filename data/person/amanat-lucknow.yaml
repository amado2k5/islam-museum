summary:
  ar: "أمانت، الاسم الشعري لسيد آغا حسن (1231–1275هـ/1815–1858م)، شاعر هندي مسلم بلغ فيه التكلف في مدرسة لكناو الأوردية ذروته، واشتهر بمسرحيته الموسيقية «إندر سبها»، التي أكملها سنة 1270هـ/1853م، وصارت نموذجًا لكثير من المسرحيات بعدها {cite:encyclopaedia-of-islam-2 vol. 1 p. 452}."
  en: "Amanat, the poetical name of Sayyid Agha Hasan (1231–1275 AH, 1815–1858 CE), a poet of Muslim India in whom the artificiality of the Lucknow school of Urdu poetry reached its height. He is chiefly remembered for the musical comedy Indar Sabha, completed in 1270/1853, which became the prototype of many later plays {cite:encyclopaedia-of-islam-2 vol. 1 p. 452}."
