summary:
  ar: "رضوان أحمد خان (وُلد في 1 نيسان 1962)، المعروف بريز خان، مذيع وصحفي ومؤلف بريطاني، وُلد في عدن لأب باكستاني بنجابي وأم غوجراتية. كان من مؤسسي مقدمي أخبار تلفزيون «بي بي سي وورلد سيرفيس» الإخباري، وقدّم برنامج «سؤال وجواب مع ريز خان» على سي إن إن الدولية منذ 1996، ثم برنامجه الخاص على الجزيرة الإنجليزية من 2006 إلى 2011، وألّف كتابا عن الأمير الوليد بن طلال (2005)."
  en: "Rizwan Ahmad Khan (born 1 April 1962), known as Riz Khan, is a British broadcaster, journalist and author, born in Aden to a Pakistani Punjabi father and a Gujarati mother. A founding presenter of BBC World Service Television News, he hosted Q&A with Riz Khan on CNN International from 1996 and his own show on Al Jazeera English from 2006 to 2011, and wrote a biography of Prince Al-Waleed bin Talal (2005)."
  ur: "رضوان احمد خان (پیدائش 1 اپریل 1962)، جو رض خان کے نام سے معروف ہیں، برطانوی نشریاتی صحافی اور مصنف ہیں، جو عدن میں پاکستانی پنجابی والد اور گجراتی والدہ کے ہاں پیدا ہوئے۔ وہ بی بی سی ورلڈ سروس ٹیلی ویژن نیوز کے بانی پیش کاروں میں سے تھے، 1996 سے سی این این انٹرنیشنل پر «Q&A with Riz Khan» کی میزبانی کی، پھر 2006 سے 2011 تک الجزیرہ انگلش پر اپنا پروگرام پیش کیا، اور شہزادہ الولید بن طلال پر کتاب لکھی (2005)۔"

