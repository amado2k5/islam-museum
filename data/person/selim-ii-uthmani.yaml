summary:
  ar: "السلطان سليم الثاني؛ تولى الحكم في ٩ ربيع الأول سنة ٩٧٤هـ بعد أبيه سليمان القانوني. ولم يكن مؤهلاً لحفظ فتوحات والده، ولولا الوزير محمد باشا الصوقللي الذي أسند إليه منصب القيادة العامة لانهارت الدولة — فأعاد الصوقللي هيبتها وعقد صلحاً مع النمسا عام ٩٧٥هـ/١٥٦٧م احتفظت بموجبه بأملاكها في بلاد المجر ودفعت الجزية السنوية. وفي عهده فُتحت قبرص سنة ٩٧٨هـ ووقعت معركة ليبانتو، وأعيدت تونس إلى النفوذ العثماني سنة ٩٨١هـ، وشُرع في حملة استراخان ومشروع قناة الدون–الفولغا {cite:dawlat-uthmaniyya-salabi p. 277-285}."
  en: "Selim II (r. 974–982/1566–1574) — succeeded Sulayman; his reign ran on Grand Vizier Sokollu Mehmed Pasha's hand: the Austrian peace of 1567, the conquest of Cyprus, Lepanto, the recovery of Tunis and the Don–Volga canal project {cite:dawlat-uthmaniyya-salabi p. 277-285}."
