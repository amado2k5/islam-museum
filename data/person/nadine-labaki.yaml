  ar: "مخرجة وممثلة لبنانية، وُلدت في بعبدات سنة 1974؛ أخرجت ومثّلت في «سكر بنات» (2007) و«وهلأ لوين؟» (2011) و«كفرناحوم» (2018) الذي نال جائزة لجنة التحكيم في كان ورُشّح للأوسكار، فكانت أول مخرجة عربية تُرشَّح لجائزة أوسكار أفضل فيلم بلغة أجنبية."
  en: "Lebanese film director and actress, born in Baabdat in 1974. She directed and starred in Caramel (2007), Where Do We Go Now? (2011) and Capernaum (2018), which won the Jury Prize at Cannes and was nominated for an Academy Award, making her the first female Arab director nominated for the Oscar for Best Foreign Language Film."
