id: person/abu-al-rabi-sulayman-marinid
class: person
label:
  ar: السلطان أبو الربيع سليمان المريني
  en: Sultan Abu al-Rabi' Sulayman al-Marini
summary:
  ar: "أبو الربيع سليمان بن عبد الحق المريني (708-710هـ)؛ بايعه بنو مرين بعد مهلك أخيه أبي ثابت فتقبض على عمه علي بن رزيكة المستام للأمر، وهزم عثمان بن أبي العلاء بساحة علودان في الظهور الذي لا كفاء له، وعقد السلم مع صاحب تلمسان، وكانت أيامه خير أيام: هدنة وسكونة وترف حتى تغالى الناس في أثمان العقار فبيعت دور فاس بألف دينار، وتنافسوا في البناء بالصخر والرخام والزليج، وهلك بتازى سنة 710هـ."
  en: "Abu al-Rabi' Sulayman ibn Abd al-Haqq al-Marini (708-710 AH); the Marinids swore him after Abu Thabit's death, he jailed his uncle Ali ibn Razika who had grasped for power, crushed Uthman ibn Abi al-Ala' at Aludan field in 'the victory without peer', and made peace with Tlemcen's lord — his days the best of days: truce, quiet and ease until Fez houses sold at a thousand gold dinars and men vied in building marble-and-zellij palaces, dying at Taza in 710 AH."
