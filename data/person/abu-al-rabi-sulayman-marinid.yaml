id: person/abu-al-rabi-sulayman-marinid
class: person
label:
  ar: السلطان أبو الربيع سليمان المريني
  en: Sultan Abu al-Rabi' Sulayman al-Marini
  fr: "Le sultan Abu al-Rabi' Sulayman al-Marini"
  es: "Sultan Abu al-Rabi' Sulayman al-Marini"
  ur: "سلطان ابو الربیع سلیمان المرینی۔"
summary:
  ar: "أبو الربيع سليمان بن عبد الحق المريني ⁦(708-710هـ)⁩؛ بايعه بنو مرين بعد مهلك أخيه أبي ثابت فتقبض على عمه علي بن رزيكة المستام للأمر، وهزم عثمان بن أبي العلاء بساحة علودان في الظهور الذي لا كفاء له، وعقد السلم مع صاحب تلمسان، وكانت أيامه خير أيام: هدنة وسكونة وترف حتى تغالى الناس في أثمان العقار فبيعت دور فاس بألف دينار، وتنافسوا في البناء بالصخر والرخام والزليج، وهلك بتازى سنة 710هـ."
  en: "Abu al-Rabi' Sulayman ibn Abd al-Haqq al-Marini (708-710 AH); the Marinids swore him after Abu Thabit's death, he jailed his uncle Ali ibn Razika who had grasped for power, crushed Uthman ibn Abi al-Ala' at Aludan field in 'the victory without peer', and made peace with Tlemcen's lord — his days the best of days: truce, quiet and ease until Fez houses sold at a thousand gold dinars and men vied in building marble-and-zellij palaces, dying at Taza in 710 AH."
  fr: "Abu al-Rabi' Sulayman ibn Abd al-Haqq al-Marini (708-710 H) ; les Mérinides lui prêtèrent allégeance après la mort d'Abu Thabit ; il emprisonna son oncle Ali ibn Razika, qui avait convoité le pouvoir, écrasa Uthman ibn Abi al-Ala' sur le champ d'Aludan en « la victoire sans pareille », et fit la paix avec le seigneur de Tlemcen — ses jours furent les meilleurs des jours : trêve, calme et aisance, au point que des maisons de Fès se vendirent mille dinars d'or et que l'on rivalisa à bâtir des palais de marbre et de zellige ; il mourut à Taza en 710 H."
  es: "Abu al-Rabi' Sulayman ibn Abd al-Haqq al-Marini (708-710 AH); los mariníes le juraron lealtad tras la muerte de Abu Thabit, encarceló a su tío Ali ibn Razika, que había ansiado el poder, derrotó a Uthman ibn Abi al-Ala' en el campo de Aludan en 'la victoria sin igual', e hizo las paces con el señor de Tlemcen. Sus días fueron los mejores: tregua, tranquilidad y paz hasta que las casas de Fez se vendieron a mil dinares de oro y los hombres compitieron por construir palacios de mármol y zellige, muriendo en Taza en el año 710 AH."
  ur: "ابو الربیع سلیمان بن عبد الحق المرینی ⁦(708-710ھ)⁩؛ مرنیوں نے ابو ثابت کی موت کے بعد اس کی قسم کھائی، اس نے اپنے چچا علی ابن رازقہ کو جیل میں ڈال دیا جس نے اقتدار پر قبضہ کر لیا تھا، عثمان بن ابی العلا کو الودان کے میدان میں 'پیر کے بغیر فتح' میں کچل دیا، اور تلمسن کے آقا سے صلح کر لی - اس کے دن بہترین دن تھے: جنگ بندی اور ایک ہزار سونا فروخت ہونے تک۔ سنگ مرمر اور زلیج محلات کی تعمیر میں مصروف، 710 ہجری میں تعزہ میں وفات پائی۔"
