summary:
  ar: "حريث بن قطبة الخزاعي؛ كان مع أخيه ثابت في عسكر موسى بن عبد الله بن خازم بالترمذ فاستجاشا طرخون فكانا الآمرين والناهيين في عسكره وقتل بنشابة أصابته."
  en: "Hurayth ibn Qutba al-Khuza'i; with brother Thabit the real commanders of Musa's Tirmidh army via Tarkhun's backing — killed by a stray arrow."
  es: "Hurayth ibn Qutba al-Khuza'i; junto con su hermano Thabit, los verdaderos comandantes del ejército Tirmidh de Musa con el apoyo de Tarkhun, murieron por una flecha perdida."
  fr: "Hurayth ibn Qutba al-Khuza'i; avec son frère Thabit, les véritables commandants de l'armée Tirmidh de Musa grâce au soutien de Tarkhun — tué par une flèche perdue."
  ur: "حریث بن قطبہ الخزاعی؛ ترخون کی پشت پناہی سے موسیٰ کی ترمذی فوج کے حقیقی کمانڈر ثابت کے ساتھ - ایک آوارہ تیر سے مارا گیا۔"
  tr: "Harit bin Qutbah al-Khuza'i; kardeşi Tebit ile birlikte Tirmidh'teki Musa ibn Abdullah ibn Hazım'ın kampındaydı. Tarkhun'a sığındılar, komutanlar ve yasakçılar onun kampındaydı ve mızrak yarasıyla öldürüldü."
  id: "Harith ibn Qutbah al-Khuza'i; ia bersama saudaranya Thabit di kemah Musa ibn Abdullah ibn Khazim di Tirmidh. Mereka mencari perlindungan di Tarkhun, dan para komandan serta penjahat berada di kemahnya, dan ia tewas akibat luka tombak."
