summary:
  ar: "متكلم وفقيه شافعي أصولي من بغداد، استقر بنيسابور تلميذاً للأستاذ أبي إسحاق الإسفراييني ثم خلفه في الإملاء، ودرّس في سبعة عشر فناً حتى اضطرته فتنة التركمان سنة ٤٢٩هـ إلى إسفرايين فمات بها ودُفن إلى جانب شيخه؛ صاحب الفرق بين الفرق وأصول الدين والتكملة في الحساب {cite:mawsuat-a3lam-ulama-adaba pp. 634-635} {cite:tabaqat-shafiiyya-subki pp. 238-240}."
  en: "A Shafi'i jurist and Ash'ari theologian born in Baghdad who settled in Nishapur, studied under Abu Ishaq al-Isfarayini and succeeded to his lectern, teaching in seventeen fields until the Turkmen troubles drove him to Isfarayin in 429/1038, where he died and was buried beside his teacher; author of al-Farq bayna al-Firaq, Usul al-Din and al-Takmila fi'l-Hisab {cite:mawsuat-a3lam-ulama-adaba pp. 634-635} {cite:tabaqat-shafiiyya-subki pp. 238-240}."
  ur: "بغداد میں پیدا ہونے والے شافعی فقیہ اور اشعری متکلم، نیشاپور میں سکونت اختیار کی، ابو اسحاق اسفرائینی کے شاگرد اور ان کے درس کے جانشین، سترہ علوم پڑھاتے رہے، 429ھ میں ترکمانوں کی فتنے کی وجہ سے اسفراین چلے گئے جہاں وفات پائی اور اپنے استاد کے پہلو میں دفن ہوئے؛ الفرق بین الفرق، اصول الدین اور التکملۃ فی الحساب کے مؤلف {cite:mawsuat-a3lam-ulama-adaba pp. 634-635} {cite:tabaqat-shafiiyya-subki pp. 238-240}۔"
