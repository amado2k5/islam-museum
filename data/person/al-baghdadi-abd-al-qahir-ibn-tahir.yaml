  note: "مات بإسفرايين سنة تسع وعشرين وأربعمائة {cite:tarikh-islam-dhahabi pp. 265-266} {cite:tabaqat-shafiiyya-subki pp. 238-239}؛ وعند ابن النجار سنة ٤٢٧هـ وهو تصحيف عند السبكي {cite:tabaqat-shafiiyya-subki p. 239}، وعند ابن شاكر سنة ٤٢٠هـ {cite:mawsuat-a3lam-ulama-adaba p. 635}؛ التحويل مشتق."
