summary:
  ar: "محمد بن صالح العثيمين ⁦(1929–2001)⁩ فقيه حنبلي سعودي، عضو هيئة كبار العلماء وأستاذ بجامعة الإمام محمد بن سعود، من أوسع علماء السلفية المعاصرة أثراً في التعليم والفتوى. من كتبه «الشرح الممتع على زاد المستقنع» وشروح على كتب العقيدة والفقه والتفسير."
  en: "Muhammad ibn Salih al-Uthaymeen (1929–2001) was a Saudi Hanbali jurist, member of the Council of Senior Scholars and professor at Imam Muhammad ibn Saud University, among the most influential contemporary Salafi scholars in teaching and fatwa. His works include Al-Sharh al-Mumti' 'ala Zad al-Mustaqni' and commentaries on creed, fiqh and tafsir."
  ur: "محمد بن صالح عثیمین ⁦(1929–2001)⁩ سعودی حنبلی فقیہ تھے، کونسل آف سینئر اسکالرز کے رکن اور جامعہ امام محمد بن سعود کے استاد، عصری سلفی علما میں تدریس اور فتویٰ کے اثر رکھنے والوں میں۔ کتب میں «الشرح الممتع على زاد المستقنع» اور عقیدہ، فقہ و تفسیر کی شروحات شامل ہیں۔"
