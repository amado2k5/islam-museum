summary:
  ar: "أبو الفتيان محمد بن سلطان بن محمد بن حيوس الغنوي، الملقب مصطفى الدولة؛ كان يُدعى بالأمير لأن أباه كان من أمراء العرب، وهو أحد الشعراء الشاميين الحسنين ومن فحولهم المجيدين، له ديوان شعر كبير، لقي جماعة من ملوك حلب المرداسيين فامتدحهم، ومن أشهر قصائده رائيته في نصر بن صالح بن مرداس عزاؤه فيها عن أبيه ومدحه إياه، وكان شيخ ابن الخياط الشاعر {cite:wafayat-ayan}."
  en: "Ibn Hayyus (394–473) — the great Aleppine poet 'al-Amir' of the Mirdasid court, famous for his ra'iyya mourning and praising Nasr b. Salih; teacher of the poet Ibn al-Khayyat {cite:wafayat-ayan}."
