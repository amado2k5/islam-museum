summary:
  ar: "أبو الفتيان محمد بن سلطان بن محمد بن حيوس الغنوي، الملقب مصطفى الدولة؛ كان يُدعى بالأمير لأن أباه كان من أمراء العرب، وهو أحد الشعراء الشاميين الحسنين ومن فحولهم المجيدين، له ديوان شعر كبير، لقي جماعة من ملوك حلب المرداسيين فامتدحهم، ومن أشهر قصائده رائيته في نصر بن صالح بن مرداس عزاؤه فيها عن أبيه ومدحه إياه، وكان شيخ ابن الخياط الشاعر {cite:wafayat-ayan}."
  en: "Ibn Hayyus (394–473) — the great Aleppine poet 'al-Amir' of the Mirdasid court, famous for his ra'iyya mourning and praising Nasr b. Salih; teacher of the poet Ibn al-Khayyat {cite:wafayat-ayan}."
  es: "Ibn Hayyus (394–473) — el gran poeta alepino 'al-Amir' de la corte mirdasí, famoso por su ra'iyya lamentando y alabando a Nasr b. Salih; maestro del poeta Ibn al-Khayyat {cite:wafayat-ayan}."
  fr: "Ibn Hayyus (394–473) — le grand poète d'Alep 'al-Amir' de la cour Mirdasid, célèbre pour sa ra'iyya pleurant et louant Nasr b. Salih; maître du poète Ibn al-Khayyat {cite:wafayat-ayan}."
  ur: "ابن حیوس (394–473) - میرداسد دربار کا حلب کا عظیم شاعر 'الامیر'، جو اپنے رعایا ماتم اور نصر بن کی تعریف کرنے کے لیے مشہور ہے۔ صالح; شاعر ابن الخیاط کے استاد۔"
  tr: "Ebu el-Futayan Muhammed bin Sultan ibn Muhammed ibn Hayyus el-Ganavi, lakaplı adı Mustafa el-Devle, babası Arap prenslerinden biri olduğu için Emir olarak anılırdı. İki güzel Suriyeli şairden biri ve seçkin elitlerinden biriydi. Büyük bir şiir koleksiyonuna sahipti, Halep'in Mirdasis krallarından oluşan bir grupla tanıştı ve onları övdü. En ünlü şiirlerinden biri, babasına başsağlığı diledi ve onu övdü. O, şair İbn el-Hayyat'ın şeyhiydi {kaynak:wafayat-ayan}."
  id: "Abu al-Futayan Muhammad ibn Sultan ibn Muhammad ibn Hayyus al-Ghanawi, yang dijuluki Mustafa al-Dawla, dijuluki Emir karena ayahnya adalah salah satu pangeran Arab. Ia adalah salah satu dari dua penyair Suriah yang indah dan salah satu elit terkemuka mereka. Ia memiliki koleksi puisi yang besar, bertemu dengan sekelompok raja Mirdassi di Aleppo, dan memuji mereka. Salah satu puisinya yang paling terkenal adalah puisinya dalam Nasr ibn Salih ibn Mirdas, di mana ia menyampaikan belasungkawa kepada ayahnya dan memujinya. Ia adalah sheikh Ibn al-Khayyat, penyair {cite:wafayat-ayan}."
