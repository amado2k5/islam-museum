summary:
  en: "A senior Ash'ari Companion and paternal uncle of Abu Musa al-Ash'ari; appointed by the Prophet to lead the pursuit column against the routed Hawazin at Awtas, he slew nine enemy champions before falling martyred to an arrow, handing the banner to Abu Musa."
  ar: "صحابي جليل من الأشعريين وعم أبي موسى الأشعري؛ أمره النبي على سرية تعقب هوازن بأوطاس، فبارز تسعة إخوة فقتلهم ثم رماه سلمة بن دريد بسهم في ركبته فاستشهد بعد أن سلّم الراية لأبي موسى، واستغفر له النبي."
