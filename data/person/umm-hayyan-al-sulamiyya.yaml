summary:
  ar: "عابدة من البصرة؛ يروي ابن الجوزي في «صفة الصفوة» قول أبي خلدة إنه لم ير رجلاً ولا امرأة أقوى ولا أصبر على طول القيام منها، وأنها كانت تختم القرآن كل يوم وليلة ولا تتكلم إلا بعد العصر."
  en: "A devout woman of Basra; Ibn al-Jawzi's Sifat al-Safwa quotes Abu Khalda that he never saw man or woman stronger or more patient in long standing prayer, and says she read the Qur'an every day and night and spoke only after the afternoon prayer."
  ur: "بصرہ کی ایک عابدہ؛ ابن الجوزی کی «صفۃ الصفوہ» ابو خلدہ کا قول نقل کرتی ہے کہ انہوں نے طویل قیام میں ان سے زیادہ قوی اور صابر کوئی مرد یا عورت نہیں دیکھی، اور یہ کہ وہ ہر دن رات قرآن پڑھتیں اور عصر کے بعد ہی بات کرتیں۔"
