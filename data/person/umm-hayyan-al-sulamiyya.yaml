gender: female
roles: [mystic]
summary:
  ar: "عابدة من البصرة؛ يروي ابن الجوزي في «صفة الصفوة» قول أبي خلدة إنه لم ير رجلاً ولا امرأة أقوى ولا أصبر على طول القيام منها، وأنها كانت تختم القرآن كل يوم وليلة ولا تتكلم إلا بعد العصر."
  en: "A devout woman of Basra; Ibn al-Jawzi's Sifat al-Safwa quotes Abu Khalda that he never saw man or woman stronger or more patient in long standing prayer, and says she read the Qur'an every day and night and spoke only after the afternoon prayer."
  ur: "بصرہ کی ایک عابدہ؛ ابن الجوزی کی «صفۃ الصفوہ» ابو خلدہ کا قول نقل کرتی ہے کہ انہوں نے طویل قیام میں ان سے زیادہ قوی اور صابر کوئی مرد یا عورت نہیں دیکھی، اور یہ کہ وہ ہر دن رات قرآن پڑھتیں اور عصر کے بعد ہی بات کرتیں۔"
  es: "Una mujer devota de Basora; en su Sifat al-Safwa, Ibn al-Jawzi cita a Abu Khalda diciendo que nunca había visto a hombre ni mujer más fuerte o paciente en la oración prolongada, y dice que ella leía el Corán todos los días y noches y solo hablaba después de la oración de la tarde."
  fr: "Une femme pieuse de Bassora; le Sifat al-Safwa d'Ibn al-Jawzi cite Abu Khalda qui dit n'avoir jamais vu homme ou femme plus fort ou plus patient dans la prière prolongée, et dit qu'elle lisait le Coran jour et nuit et ne parlait qu'après la prière de l'après-midi."
  tr: "Basra'dan bir ibadet eden İbn al-Jawzi, 'Sifat al-Safwa'da Ebu Haldah'ın uzun süredir varlığını sürdüren adamdan daha güçlü veya sabırlı bir kadın görmediğini, her gün gece Kur'an'ı tamamlayacağını ve Asr namazından sonra konuşmadığını anlatır."
  id: "Seorang pemuja dari Basra; Ibn al-Jawzi menceritakan dalam 'Sifat al-Safwa' pernyataan Abu Khaldah bahwa ia tidak pernah melihat pria atau wanita yang lebih kuat atau lebih sabar darinya yang sudah lama, dan bahwa ia akan menyelesaikan Al-Qur'an setiap hari dan malam dan tidak berbicara sampai setelah salat Asar."
