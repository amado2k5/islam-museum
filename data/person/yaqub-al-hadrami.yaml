summary:
  ar: "أبو محمد يعقوب بن إسحاق الحضرمي البصري، صاحب القراءة التاسعة من العشر في ترتيب «النشر» وإمام جامع البصرة سنين؛ توفي سنة 205هـ وله ثمان وثمانون سنة، وانتهت إليه رياسة القراءة بالبصرة بعد أبي عمرو بن العلاء {cite:nashr-dahman-damascus-1345-v1 p. 196}."
  en: "Abu Muhammad Ya'qub ibn Ishaq al-Hadrami of Basra, whose reading is the ninth of the ten in the order of al-Nashr; he was imam of the congregational mosque of Basra for years, died in 205 AH aged eighty-eight, and after Abu 'Amr ibn al-'Ala' the leadership of the reading in Basra came to him {cite:nashr-dahman-damascus-1345-v1 p. 196}."
  ur: "ابو محمد یعقوب بن اسحاق حضرمی بصری، «النشر» کی ترتیب میں دس قراءتوں میں نویں قراءت کے صاحب اور برسوں جامع بصرہ کے امام؛ 205ھ میں اٹھاسی برس کی عمر میں فوت ہوئے، اور ابو عمرو بن العلاء کے بعد بصرہ میں قراءت کی سربراہی ان تک پہنچی {cite:nashr-dahman-damascus-1345-v1 p. 196}."
  es: "Abu Muhammad Ya'qub ibn Ishaq al-Hadrami de Basora, cuya lectura es la novena de las diez en el orden de al-Nashr; fue imán de la mezquita congregacional de Basora durante años, murió en el año 205 AH a la edad de ochenta y ocho años, y después de Abu 'Amr ibn al-'Ala' el liderazgo de la lectura en Basora pasó a él {cite:nashr-dahman-damascus-1345-v1 p. 196}."
  fr: "Abu Muhammad Ya'qub ibn Ishaq al-Hadrami de Basra, dont la lecture est la neuvième des dix dans l'ordre d'al-Nashr; il fut imam de la mosquée congrégationaliste de Basra pendant des années, mourut en 205 AH à l'âge de quatre-vingt-huit ans, et après Abu 'Amr ibn al-'Ala', la direction de la lecture à Basra lui revint {cite:nashr-dahman-damascus-1345-v1 p. 196}."
