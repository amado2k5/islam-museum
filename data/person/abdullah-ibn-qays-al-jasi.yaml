summary:
  ar: "قائد الأسطول الإسلامي في الشام في خلافة عثمان، حليف بني فزارة، ولّاه معاوية بن أبي سفيان على البحر فغزا خمسين غزاة بين شاتية وصائفة لم يغرق فيها أحد من جنده، ثم قُتل وحده حين خرج طليعة في قارب إلى مرفأ من أرض الروم فعرفته امرأة تصدّق عليها."
  en: "Commander of the Muslim fleet in Syria under Uthman, an ally of Banu Fazara; Mu'awiya ibn Abi Sufyan put him in charge of the sea and he led fifty winter and summer naval raids in which none of his men drowned, until he was killed alone when he went out scouting in a skiff to an anchorage in Byzantine territory and was recognised by a woman to whom he had given alms."
  fr: "Commandant de la flotte musulmane de Syrie sous Uthman, allié des Banu Fazara ; Mu'awiya ibn Abi Sufyan lui confia la mer et il mena cinquante raids navals d'hiver et d'été au cours desquels aucun de ses hommes ne se noya, jusqu'à ce qu'il soit tué seul, alors qu'il était parti en reconnaissance dans une barque vers un mouillage en territoire byzantin et qu'une femme à qui il avait fait l'aumône le reconnut."
  es: "Comandante de la flota musulmana en Siria bajo el mando de Uthman, aliado de Banu Fazara; Mu'awiya ibn Abi Sufyan lo puso al mando del mar y dirigió cincuenta incursiones navales de invierno y verano en las que ninguno de sus hombres se ahogó, hasta que murió solo cuando salió a explorar en una barca hacia un fondeadero en territorio bizantino y fue reconocido por una mujer a la que había dado limosna."
  ur: "بنو فزارہ کے حلیف عثمان کے ماتحت شام میں مسلم بحری بیڑے کا کمانڈر؛ معاویہ بن ابی سفیان نے اسے سمندر کا انچارج بنایا اور اس نے موسم سرما اور موسم گرما کے پچاس بحری چھاپے مارے جن میں اس کا کوئی آدمی ڈوب نہیں سکا، یہاں تک کہ جب وہ بازنطینی علاقے میں ایک لنگر خانے کی طرف اسکاؤٹنگ کرتے ہوئے اکیلا مارا گیا اور اسے ایک عورت نے پہچانا جس کو اس نے خیرات دی تھی۔"
