summary:
  ar: "قائد الأسطول الإسلامي في الشام في خلافة عثمان، حليف بني فزارة، ولّاه معاوية بن أبي سفيان على البحر فغزا خمسين غزاة بين شاتية وصائفة لم يغرق فيها أحد من جنده، ثم قُتل وحده حين خرج طليعة في قارب إلى مرفأ من أرض الروم فعرفته امرأة تصدّق عليها."
  en: "Commander of the Muslim fleet in Syria under Uthman, an ally of Banu Fazara; Mu'awiya ibn Abi Sufyan put him in charge of the sea and he led fifty winter and summer naval raids in which none of his men drowned, until he was killed alone when he went out scouting in a skiff to an anchorage in Byzantine territory and was recognised by a woman to whom he had given alms."
