summary:
  ar: "قدامة السجيلي، شاعر عربي من القرن الأول الهجري/السابع-الثامن الميلادي، توفي بعد سنة 105هـ/724م، اشتهر بالرجز في وصف البادية، ومدح بني أمية، ويعدّه النقاد من أربعة أفضل راجزين. {cite:encyclopaedia-of-islam-2 vol. 1 p. 161}"
  en: "Kudama al-Sijilli, an Arab poet of the first/seventh-eighth century who died after 105/724, famous for his rajaz verses on bedouin subjects such as camels and horses and for eulogies of the Umayyads, and ranked by the critics among the four best rajaz poets. {cite:encyclopaedia-of-islam-2 vol. 1 p. 161}"
  ur: "قدامہ السجیلی، پہلی/ساتویں-آٹھویں صدی کے عرب شاعر، جو 105ھ/724ء کے بعد فوت ہوئے، رجز میں بدوی موضوعات (اونٹ، گھوڑے) کے وصف اور امویوں کی مدح کے لیے مشہور تھے، اور نقاد انہیں چار بہترین راجز شعرا میں شمار کرتے ہیں۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 161}"
