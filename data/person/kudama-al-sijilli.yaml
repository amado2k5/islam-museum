summary:
  ar: "قدامة السجيلي، شاعر عربي من القرن الأول الهجري/السابع-الثامن الميلادي، توفي بعد سنة 105هـ/724م، اشتهر بالرجز في وصف البادية، ومدح بني أمية، ويعدّه النقاد من أربعة أفضل راجزين. {cite:encyclopaedia-of-islam-2 vol. 1 p. 161}"
  en: "Kudama al-Sijilli, an Arab poet of the first/seventh-eighth century who died after 105/724, famous for his rajaz verses on bedouin subjects such as camels and horses and for eulogies of the Umayyads, and ranked by the critics among the four best rajaz poets. {cite:encyclopaedia-of-islam-2 vol. 1 p. 161}"
  ur: "قدامہ السجیلی، پہلی/ساتویں-آٹھویں صدی کے عرب شاعر، جو 105ھ/724ء کے بعد فوت ہوئے، رجز میں بدوی موضوعات ⁦(اونٹ، گھوڑے)⁩ کے وصف اور امویوں کی مدح کے لیے مشہور تھے، اور نقاد انہیں چار بہترین راجز شعرا میں شمار کرتے ہیں۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 161}"
  es: "Kudama al-Sijilli, poeta árabe del siglo I/VII-VIII que falleció después del año 105/724, es famoso por sus versos rajaz sobre temas beduinos como camellos y caballos, y por sus elogios a los omeyas. La crítica lo considera uno de los cuatro mejores poetas rajaz. {cite:encyclopaedia-of-islam-2 vol. 1 p. 161}"
  fr: "Kudama al-Sijilli, poète arabe du Ier/VIIe-VIIIe siècle, mort après 105/724, est célèbre pour ses vers rajas sur des sujets bédouins tels que les chameaux et les chevaux, ainsi que pour ses éloges des Omeyyades. Il est considéré par les critiques comme l'un des quatre meilleurs poètes rajas. {cite:encyclopaedia-of-islam-2 vol. 1 p. 161}"
  tr: "Qudamah al-Sujaili, 105 Hicri / 7.-8. yüzyıldan sonra ölen Arap bir şairdi. Çölü anlatan ve Emevileri öven şiirleriyle ünlüydü. Eleştirmenler onu en iyi dört şairden biri olarak kabul eder. {kaynak: İslam Ansiklopedisi-2 cilt 1 s. 161}"
  id: "Qudamah al-Sujaili adalah seorang penyair Arab dari abad pertama H / abad ke-7-8 M, yang meninggal setelah tahun 105 H / 724 M. Ia terkenal karena puisinya yang menggambarkan gurun dan memuji Umayyah. Para kritikus menganggapnya sebagai salah satu dari empat penyair terbaik. {cite:Encyclopaedia-of-Islam-2 vol. 1 hlm. 161}"
