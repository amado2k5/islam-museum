  ar: "سويد بن النعمان بن مالك بن عائد بن مجدعة، الأوسي الأنصاري المدني، شهد أحدا وما بعدها من المشاهد مع النبي، وكان ممن بايع تحت الشجرة. روى عن النبي في المضمضة من السويق، وعنه بشير بن يسار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3488}"
