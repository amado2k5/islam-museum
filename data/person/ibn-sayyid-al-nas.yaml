summary:
  ar: "حافظ محدث شافعي وأديب شاعر من أهل القاهرة ⁦(661 أو 671–734هـ)⁩، من بيت أندلسي، تخرج على ابن دقيق العيد، ودرّس الحديث بالمدرسة الظاهرية وخطب بجامع الخندق، وصنّف «عيون الأثر في فنون المغازي والشمائل والسير» وشرحاً لم يتمه على جامع الترمذي هو «النفح الشذي»."
  en: "A Shafi'i hadith master, man of letters and poet of Cairo (661 or 671–734 AH) from a family of Andalusian origin; trained by Ibn Daqiq al-Id, he taught hadith at the Zahiriyya madrasa and preached at the Khandaq mosque, and wrote Uyun al-Athar on the Prophet's campaigns, character and life and an unfinished commentary on al-Tirmidhi's Jami', al-Nafh al-Shadhi."
