id: person/al-mansur
class: person
label: { ar: "أبو جعفر المنصور وعند السيوطي ولد سنة خمس وتسعين وأمه سلامة البربرية أم ولد، وكان فحل بني العباس هيبة وشجاعة وحزماً جماعاً للمال لقب أبا الدوانيق لمحاسبته العمال والصناع على الدوانيق والحبات، وهو الذي ضرب أبا حنيفة على القضاء ثم سجنه فمات بعد أيام وقيل قتله بالسم لكونه أفتى بالخروج عليه، وفي سنة إحدى وخمسين بنى الرصافة وشيدها {cite:tarikh-khulafa-minhaj-1434 p. 422,426}", en: "Abu Ja'far al-Mansur" }
summary:
  ar: "عبد الله بن محمد بن علي بن عبد الله بن العباس، ثاني خلفاء بني العباس؛ عند البلاذري: جرى على أهل قبرس ما زاده عليهم عبد الملك بن مروان من ألف دينار إلى خلافته فقال «نحن أحق من أنصفهم، ولم نتكثر بظلمهم» فردّهم إلى صلح معاوية القديم؛ وهو الذي أقطع أخاه سليمان بن علي بالس وقراها بعد مصادرة أموال بني أمية."
  en: "Abdullah ibn Muhammad ibn Ali ibn Abdullah ibn al-Abbas, second Abbasid caliph; in al-Baladhuri: the thousand dinars Abd al-Malik had added to the Cypriots' tribute ran until his caliphate, when he said 'we are worthier of being just to them, and did not profit by wronging them', restoring them to Mu'awiya's ancient treaty; he it was who granted his brother Sulayman ibn Ali Balis and its villages after the confiscation of Umayyad wealth."
