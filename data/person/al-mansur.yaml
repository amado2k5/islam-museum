  did_you_know:
    ar: "المنصور ثاني خلفاء بني العباس؛ عند البلاذري جرى على أهل قبرص زيادة الألف دينار التي زادها عبد الملك حتى قال نحن أحق من أنصفه."
    en: "Al-Mansur, second Abbasid caliph — per al-Baladhuri he levied on Cyprus's people the thousand dinars Abd al-Malik had added, saying 'we are worthier of our due'."
    ur: "منصور، دوسرے عباسی خلیفہ — بلاذری کے مطابق انہوں نے قبرص کے لوگوں پر وہ ہزار دینار لگائے جو عبدالملک نے بڑھائے تھے، کہہ کر «ہم اپنے حصے کے زیادہ حقدار ہیں»۔"
    sources: [source/futuh-buldan-maarif-1407, source/tarikh-khulafa-minhaj-1434]
