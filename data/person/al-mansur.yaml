id: person/al-mansur
class: person
label: { ar: "أبو جعفر المنصور", en: "Abu Ja'far al-Mansur" }
summary:
  ar: "عبد الله بن محمد بن علي بن عبد الله بن العباس، ثاني خلفاء بني العباس؛ عند البلاذري: جرى على أهل قبرس ما زاده عليهم عبد الملك بن مروان من ألف دينار إلى خلافته فقال «نحن أحق من أنصفهم، ولم نتكثر بظلمهم» فردّهم إلى صلح معاوية القديم؛ وهو الذي أقطع أخاه سليمان بن علي بالس وقراها بعد مصادرة أموال بني أمية، وعند السيوطي ولد سنة خمس وتسعين وأمه سلامة البربرية أم ولد، وكان فحل بني العباس هيبة وشجاعة وحزماً جماعاً للمال لقب أبا الدوانيق لمحاسبته العمال والصناع على الدوانيق والحبات، وهو الذي ضرب أبا حنيفة على القضاء ثم سجنه فمات بعد أيام وقيل قتله بالسم لكونه أفتى بالخروج عليه، وفي سنة إحدى وخمسين بنى الرصافة وشيدها {cite:tarikh-khulafa-minhaj-1434 p. 422,426} وقال محمد بن علي الخراساني المنصور أول خليفة قرب المنجمين وعمل بأحكام النجوم وأول خليفة ترجمت له الكتب السريانية والأعجمية بالعربية ككتاب كليلة ودمنة وإقليدس وأول من استعمل مواليه على الأعمال وقدمهم على العرب، وأول من ظهر له بشرب ولا غناء بل كان يجلس وبينه وبين الندماء ستارة {cite:tarikh-khulafa-minhaj-1434 p. 436}، وعند المسعودي أن المنصور أول من أوقع الفرقة بين ولد العباس وبين آل أبي طالب، وأول خليفة قرب المنجمين وعمل بأحكام النجوم وكان معه نوبخت المجوسي الذي أسلم على يديه وهو أبو النوبختية وإبراهيم الفزاري المنجم وعلي بن عيسى الأسطرلابي، وأول خليفة ترجمت له الكتب من اللغات العجمية إلى العربية منها كليلة ودمنة والسند هند وكتب أرسطاطاليس المنطقية والمجسطي لبطليموس والأرتماطيقي وإقليدس من اليونانية والرومية والفهلوية والفارسية والسريانية، وفي أيامه وضع محمد بن إسحاق كتاب المغازي والسير وأخبار المبتدأ ولم تكن قبل ذلك مجموعة، وأول خليفة استعمل مواليه وغلمانه في أعماله وقدمهم على العرب فامتثل ذلك الخلفاء من بعده فسقطت وبادت العرب وزال بأسها {cite:muruj-al-dhahab p. 668-669}"
  en: "Abdullah ibn Muhammad ibn Ali ibn Abdullah ibn al-Abbas, second Abbasid caliph; in al-Baladhuri: the thousand dinars Abd al-Malik had added to the Cypriots' tribute ran until his caliphate, when he said 'we are worthier of being just to them, and did not profit by wronging them', restoring them to Mu'awiya's ancient treaty; he it was who granted his brother Sulayman ibn Ali Balis and its villages after the confiscation of Umayyad wealth."
