summary:
  ar: "عبد الله بن محمد بن علي بن عبد الله بن العباس، ثاني خلفاء بني العباس؛ عند البلاذري: جرى على أهل قبرس ما زاده عليهم عبد الملك بن مروان من ألف دينار إلى خلافته فقال «نحن أحق من أنصفهم، ولم نتكثر بظلمهم» فردّهم إلى صلح معاوية القديم؛ وهو الذي أقطع أخاه سليمان بن علي بالس وقراها بعد مصادرة أموال بني أمية، وعند السيوطي ولد سنة خمس وتسعين وأمه سلامة البربرية أم ولد، وكان فحل بني العباس هيبة وشجاعة وحزماً جماعاً للمال لقب أبا الدوانيق لمحاسبته العمال والصناع على الدوانيق والحبات، وهو الذي ضرب أبا حنيفة على القضاء ثم سجنه فمات بعد أيام وقيل قتله بالسم لكونه أفتى بالخروج عليه، وفي سنة إحدى وخمسين بنى الرصافة وشيدها {cite:tarikh-khulafa-minhaj-1434 p. 422,426} وقال محمد بن علي الخراساني المنصور أول خليفة قرب المنجمين وعمل بأحكام النجوم وأول خليفة ترجمت له الكتب السريانية والأعجمية بالعربية ككتاب كليلة ودمنة وإقليدس وأول من استعمل مواليه على الأعمال وقدمهم على العرب، وأول من ظهر له بشرب ولا غناء بل كان يجلس وبينه وبين الندماء ستارة {cite:tarikh-khulafa-minhaj-1434 p. 436}، وعند المسعودي أن المنصور أول من أوقع الفرقة بين ولد العباس وبين آل أبي طالب، وأول خليفة قرب المنجمين وعمل بأحكام النجوم وكان معه نوبخت المجوسي الذي أسلم على يديه وهو أبو النوبختية وإبراهيم الفزاري المنجم وعلي بن عيسى الأسطرلابي، وأول خليفة ترجمت له الكتب من اللغات العجمية إلى العربية منها كليلة ودمنة والسند هند وكتب أرسطاطاليس المنطقية والمجسطي لبطليموس والأرتماطيقي وإقليدس من اليونانية والرومية والفهلوية والفارسية والسريانية، وفي أيامه وضع محمد بن إسحاق كتاب المغازي والسير وأخبار المبتدأ ولم تكن قبل ذلك مجموعة، وأول خليفة استعمل مواليه وغلمانه في أعماله وقدمهم على العرب فامتثل ذلك الخلفاء من بعده فسقطت وبادت العرب وزال بأسها {cite:muruj-al-dhahab p. 668-669}، وعند المسعودي كان مولده سنة خمس وتسعين التي مات فيها الحجاج وكان يقول ولدت في ذي الحجة وأعذرت فيه ووليت الخلافة فيه وأحسب أن المنية تكون فيه فكان كما ذكر، ورأى في منزل مكتوباً أبا جعفر حانت وفاتك فأمر بالمسير إلى حرم الله فتوفى ببئر ميمون، وخلف ستمائة ألف ألف درهم وأربعة عشر ألف ألف دينار وكان يضن بماله ووافق صاحب مطبخه على أن له الرؤوس والأكارع والجلود، وكان يعمل في بناء بغداد كل يوم خمسون ألف رجل، ومن كرمه وصل عمومته العشرة في يوم واحد بعشرة آلاف درهم لكل واحد {cite:muruj-al-dhahab p. 295-296}، وقال العبدي عند المسعودي كان أول من أوقع الفرقة بين ولد العباس بن عبد المطلب وآل أبي طالب وكان قبل ذلك أمرهم واحداً، وأول خليفة قرب المنجمين وعمل بأحكام النجوم وكان معه نوبخت المجوسي وإبراهيم الفزاري وعلي بن عيسى الأسطرلابي، وأول خليفة ترجمت له الكتب من العجمية إلى العربية منها كليلة ودمنة والسندهند وكتب أرسطاطاليس والمجسطي والأرتماطيقي وإقليدس من اليونانية والرومية والفهلوية والفارسية والسريانية، وفي أيامه وضع محمد بن إسحاق كتاب المغازي والسير، وكان أول خليفة استعمل مواليه وغلمانه وقدمهم على العرب فامتثله الخلفاء من بعده فسقطت العرب وبادت وزال بأسها {cite:muruj-al-dhahab p. 668-669}"
  en: "Abdullah ibn Muhammad ibn Ali ibn Abdullah ibn al-Abbas, second Abbasid caliph; in al-Baladhuri: the thousand dinars Abd al-Malik had added to the Cypriots' tribute ran until his caliphate, when he said 'we are worthier of being just to them, and did not profit by wronging them', restoring them to Mu'awiya's ancient treaty; he it was who granted his brother Sulayman ibn Ali Balis and its villages after the confiscation of Umayyad wealth."
  fr: "Abdullah ibn Muhammad ibn Ali ibn Abdullah ibn al-Abbas, deuxième calife abbasside ; à al-Baladhuri : les milliers de dinars qu'Abd al-Malik avait ajoutés à l'hommage des Chypriotes ont couru jusqu'à son califat, quand il a dit « nous sommes plus dignes d'être juste pour eux, et n'a pas profité de leur faire du tort \", les restaurer à l'ancien traité de Mu'awiya ; lui était qui a accordé son frère Sulayman ibn Ali Balis et ses villages après la confiscation de la richesse omeyyade."
  ur: "دوسرے عباسی خلیفہ اور بغداد کے نئے مرکز کے سرپرست؛ گول شہر کے منصوبے میں معماروں، کاریگروں اور قدیم مثالوں کی شرکت الگ رکھی گئی ہے، جبکہ ان کی سیاسی تاریخ اور ابوحنیفہ سے متعلق روایات برقرار ہیں {cite:tdv-bagdat-duri Foundation and plan} {cite:tarikh-khulafa-minhaj-1434 p.426}۔"
  es: "Abdullah ibn Muhammad ibn Ali ibn Abdullah ibn al-Abbas, segundo califa abasí; en al-Baladhuri: los mil dinares que Abd al-Malik había añadido al tributo de los chipriotas se mantuvieron hasta su califato, cuando dijo: «Somos más dignos de ser justos con ellos, y no nos beneficiamos de perjudicarlos», restableciéndolos al antiguo tratado de Mu'awiya; fue él quien concedió a su hermano Sulayman ibn Ali Balis y sus aldeas tras la confiscación de la riqueza omeya."
  tr: "Abdullah ibn Muhammed ibn Ali ibn Abdullah ibn ibn al-Abbas, Abbasilerin ikinci halifesi; el-Baladhuri'ye göre: Kıbrıs halkı, bin dinardan etkilendi. Abdülmalik bin Mervan, halifeliğine ekledi: \"Biz onların adaletine en çok layık olanlarız ve baskılarında aşırıya kaçmadık.\" Onları Muaviye'nin eski antlaşmasına geri verdi; Emeviyelerin servetini el koyduktan sonra kardeşi Süleyman bin Ali'yi ballarla ve köyleriyle kesen kişiydi. El-Suyuti'ye göre, doksan beşinci yılda doğmuş, annesi Berberi Velad Selama'ymış ve Abbasilerin aygırıydı Prestij, cesaret ve servet toplamadaki kararlılığı ona 'Abu al-Dawaniq' unvanını kazandırdı çünkü işçileri ve zanaatkarları diwanlar ve tahıllar için sorumlu tutuyordu. Ebu Hanifa'yı yargıya vuran, hapse atan ve birkaç gün sonra ölen oydu. Kendisine karşı fetva verdiği için zehirle öldürüldüğü söylenir. 51 yılında Rusafa'yı inşa edip yeniden inşa etti {cite:History-khulafa-minhaj-1434, s. 422,426}. Muhammed bin Ali el-Horasani el-Mansur, astrologlara yakın olan ve yıldızların kurallarını uygulayan ilk halifeydi; ayrıca Kalila, Dimna ve Evklid kitapları gibi Süryanice ve Arapça olmayan kitapları Arapçaya çeviren ilk halifeydi ve takipçilerini işlerde ilk kez istihdam eden kişiydi Araplardan önce geldi ve ona ilk görünen ne içki içiyor ne de şarkı söylüyordu; bunun yerine kendisi ile yoldaşları arasında bir perde koyarak oturuyordu {cite:History-Khulafa-Minhaj-1434 s. 436}. Al-Mas'udi'ye göre, Al-Mansur, Abbas'ın soyundan gelenler ile Abi Talib'in ailesi arasında ilk uçurum yaratan ve astrologları yaklaştırıp yıldızların kurallarına göre hareket eden ilk halifeydi. Ona İslam'ı benimseyen Magian Nawbakht, astrolog İbrahim al-Fazari ve Ali ibn Isa al-Astralabi eşlik etti. Kitaplarının yabancı dillerden Arapçaya, Kalila ve Dimna dahil olmak üzere çevrildiği ilk halifeydi. Zincir Hind'dir ve Aristoteles'in mantık kitapları, Ptolemaios, Artemistik ve Öklid'in Magisteryal eserleri ise Yunanca, Roma, Pehlevi, Farsça ve Süryanice'den alınmıştır. Muhammed bin İshaq, zamanında kendisinden önce derlenmemiş Mağazi, Siyar ve Akhbar al-Mubtada'nın kitaplarını derlemiştir. Kendi işlerinde vasallarını ve kölelerini kullanan ilk halifeydi ve onlara Arapların önünde öncelik vermiştir; bu yüzden ondan sonraki halifeler itaat etti, Araplar düştü ve güçleri yok oldu {atı:Muruj-al-Dhahab, s. 668-669}. El-Mes'udi'ye göre, doksan beşinci yılda, el-Haccac'ın öldüğü yılda doğmuştur ve Zhu'dhicce'de doğduğunu söyler, orada affedilirdi. Halifelik oraya atandı ve ölümün orada olacağını düşündüm, bu yüzden bahsedildiği gibi oldu. Bir evde 'Ebu Ca'fer, ölümün yakındı' yazılı bir evde gördü, bu yüzden Tanrı'nın kutsal alanına yürüyüşü emretti, orada Bir Maymun'da öldü, geride altı yüz bin dirhem ve on dört bin dinar bırakarak. Parasını cömertçe verdi ve mutfağının sahibi ona baş, deri ve deri vermesini kabul etti. Her gün elli bin adamla Bağdat'ın inşasında çalıştı ve cömertliğiyle, on babasının amcasının her biri bir günde on bin dirhem aldı {alıntı: Muric-al-Dhahab, s. 295-296} ve Al-Mas'udi'ye göre, Abbas ibn Abdül-Muttalib soyundan gelenler ile Ebu Talib'in ailesi arasında bir ayrım yaratan ilk kişi olduğunu ve ondan önce işlerinin birleştiğini söylemiştir. Astrologlara yaklaşan ve yıldızların kurallarına uyan ilk halifeydi. Yanında Nawbakht al-Magi, İbrahim el-Fazari ve Ali ibn İsa el-Astralabi vardı. Kalila, Dimna, Al-Sanandand gibi Arapça olmayan kitapları ve Aristoteles, Magister, Armatician ve Euclid'in Yunanca, Roma, Pehlevi, Farsça ve Süryanice kitaplarını çeviren ilk halifeydi. Muhammed bin İshaq kendi döneminde bir kitap yazdı Seferler ve seferler. Müttefiklerini ve hizmetkarlarını Arapların önüne koyan ilk halifeydi, ancak ardından gelen halifeler itaat etti, böylece Araplar düştü ve yok oldu, güçleri de yok oldu {cite:muruj-al-dhahab s. 668-669}"
  id: "Abdullah ibn Muhammad ibn Ali ibn Abdullah ibn al-Abbas, khalifah kedua Abbasiyah; menurut al-Baladhuri: Rakyat Siprus terdampak oleh seribu dinar yang ditambahkan Abd al-Malik ibn Marwan pada kekhalifahannya dengan mengatakan, \"Kami adalah yang paling layak atas keadilan mereka, dan kami tidak berlebihan dalam penindasan mereka.\" Dia mengembalikan mereka ke perjanjian lama Muawiyah; dialah yang memotong hubungan dengan saudaranya Sulayman ibn Ali dengan bals dan desa-desanya setelah menyita harta Umayyah. Menurut al-Suyuti, dia lahir pada tahun sembilan puluh lima, dan ibunya adalah Salama si Berber um Walad, dan dia adalah kuda jantan Abbasiyah Prestise, keberanian, dan keteguhannya dalam mengumpulkan kekayaan memberinya gelar 'Abu al-Dawaniq' karena ia menuntut pertanggungjawaban para pekerja dan pengrajin atas para diwan dan gandum. Dialah yang menyerang Abu Hanifa di bidang peradilan, lalu memenjarakannya, dan meninggal setelah beberapa hari. Dikatakan ia dibunuh dengan racun karena telah mengeluarkan fatwa untuk memberontak terhadapnya. Pada tahun 51, ia membangun dan membangun kembali Rusafa {cite:History-khulafa-minhaj-1434, hlm. 422,426}. Muhammad ibn Ali al-Khurasani al-Mansur adalah khalifah pertama yang dekat dengan para astrolog dan menjalankan aturan bintang, serta khalifah pertama yang menerjemahkan buku Suryani dan non-Arab ke dalam bahasa Arab, seperti kitab Kalila, Dimna, dan Euclid, serta yang pertama mempekerjakan para pengikutnya dalam urusan Ia mendahului mereka daripada orang Arab, dan yang pertama muncul kepadanya bukanlah minum atau bernyanyi, melainkan ia duduk dengan tirai di antara dirinya dan para sahabat {cite:History-Khulafa-Minhaj-1434 hlm. 436}. Menurut Al-Mas'udi, Al-Mansur adalah yang pertama menciptakan perpecahan antara keturunan Abbas dan keluarga Abi Talib, serta khalifah pertama yang mendekatkan para astrolog dan bertindak sesuai aturan bintang. Ia ditemani oleh Nawbakht si Majus, yang memeluk Islam di bawah arahnya, Abu al-Nawbakhtiya, Ibrahim al-Fazari sang ahli nujum, dan Ali ibn Isa al-Astralabi. Ia adalah khalifah pertama yang menerjemahkan buku-buku dari bahasa asing ke dalam bahasa Arab, termasuk Kalila dan Dimna. Rantai itu adalah Hind, dan buku-buku Aristoteles tentang logika, serta karya Magisterial Ptolemy, Artemistic, dan Euclid berasal dari bahasa Yunani, Romawi, Pahlavi, Persia, dan Siria. Pada masanya, Muhammad ibn Ishaq menyusun buku-buku Maghazi, Siyar, dan Akhbar al-Mubtada, yang tidak disusun sebelum beliau. Ia adalah khalifah pertama yang mempekerjakan vasal dan budaknya dalam urusannya dan memberi mereka prioritas atas orang Arab, sehingga khalifah-khalifah setelahnya menurut, dan Arab jatuh, dan kekuatan mereka hilang {cite:muruj-al-dhahab, hlm. 668-669}. Menurut al-Mas'udi, ia lahir pada tahun sembilan puluh lima, ketika al-Hajjaj wafat, dan ia biasa mengatakan bahwa ia lahir di Dhu al-Hijjah dan dibebaskan dari sana. Khalifah diangkat di sana, dan saya pikir kematian akan terjadi di sana, jadi seperti yang disebutkan. Dia melihat di sebuah rumah tertulis 'Abu Ja'far, kematianmu sudah dekat,' jadi dia memerintahkan perjalanan ke tempat suci Tuhan, di mana dia meninggal di Bir Maymun, meninggalkan enam ratus ribu dirham dan empat belas ribu dinar. Dia murah hati dengan uangnya, dan pemilik dapurnya setuju bahwa dia akan memiliki kepala, kulit, dan kulit. Dia bekerja membangun Baghdad setiap hari dengan lima puluh ribu orang, dan dari kemurahan hatinya, sepuluh paman dari pihak ayahnya menerima sepuluh ribu dirham masing-masing dalam satu hari {cite: Muruj-al-Dhahab, hlm. 295-296}, dan Al-Abdi mengatakan menurut Al-Mas'udi bahwa ia adalah yang pertama menciptakan pembagian antara keturunan Abbas ibn Abd al-Muttalib dan keluarga Abu Talib, dan sebelumnya, urusan mereka bersatu. Ia adalah khalifah pertama yang mendekati para astrolog dan mengikuti aturan bintang. Ia ditemani oleh Nawbakht al-Magi, Ibrahim al-Fazari, dan Ali ibn Isa al-Astralabi. Ia adalah khalifah pertama yang memiliki buku-buku yang diterjemahkan dari non-Arab, termasuk Kalila, Dimna, Al-Sanandand, dan buku-buku oleh Aristoteles, sang Magistrat, Sang Armatis, dan Euclid dari bahasa Yunani, Romawi, Pahlavi, Persia, dan Suryani. Pada masanya, Muhammad ibn Ishaq menulis sebuah buku Ekspedisi dan kampanye. Ia adalah khalifah pertama yang mempekerjakan klien dan pelayannya dan menempatkan mereka di atas orang Arab, tetapi para khalifah setelahnya menurut, sehingga orang Arab jatuh dan lenyap, dan kekuatan mereka pun lenyap {cite:muruj-al-dhahab hlm. 668-669}"
