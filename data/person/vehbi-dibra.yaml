summary:
  ar: "عالم إسلامي وسياسي ألباني من ديبرا، مندوب في جمعية فلورا وموقّع على إعلان الاستقلال سنة 1912، وأول رئيس لمجلس الشيوخ الألباني وأول مفتٍ عام ورئيس للجماعة المسلمة في ألبانيا، ومن أبرز مفسّري القرآن باللغة الألبانية."
  en: "Albanian Islamic scholar and politician from Dibra: a delegate and signatory at the Vlorë assembly of 1912, first chairman of the Albanian Senate, first Grand Mufti and head of the Muslim Community of Albania, and a leading Qur'an commentator in the Albanian language."
  ur: "دیبرا سے تعلق رکھنے والے البانوی عالم اور سیاست دان؛ 1912 میں ولورا اسمبلی کے مندوب اور اعلانِ آزادی کے دستخط کنندہ، البانوی سینیٹ کے پہلے چیئرمین، پہلے مفتیِ اعظم اور البانیا کی مسلم کمیونٹی کے سربراہ، اور البانوی زبان میں قرآن کے ممتاز مفسر۔"
