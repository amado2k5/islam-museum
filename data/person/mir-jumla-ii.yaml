faith:
  - value: shia-twelver
    basis: documented
    note: >-
      Two independent texts name Shia for Mir Jumla himself. Abdul
      Karim's Banglapedia survey 'Islam, Bengal' states in prose that
      great Mughal subahdars like Mir Jumla and Shaista Khan were
      Shias. Jadunath Sarkar, in his History of Aurangzib (vol. 1,
      p. 216), writes of Muhammad Said, known to history as Mir
      Jumla, that he, like other Shiah adventurers, sought his fortune
      at the courts of the Deccani Sultans who belonged to his sect.
      The Twelver context is the one both texts stand in: Sarkar's
      Shiah adventurers are Persians of Safavid Iran, whose state
      confession was Twelver Shi'ism, seeking the Shia courts of the
      Deccan, and the Qutb Shahi court Mir Jumla served was itself
      Twelver. Under the founder Shia mapping — two independent texts
      stating Shia plus Twelver context — the value is recorded as
      shia-twelver, the mapping stated here. His Persian milieu and
      his service of the Qutb Shahi and Mughal courts are not the
      evidence relied on; milieu and service settle nothing, and the
      settlement rests on the two namings alone. The English article's
      infobox filing of Shi'a Islam, citing Jagadish Narayan Sarkar's
      Life of Mir Jumla (2nd ed., 1979), p. 361, is an infobox and is
      not relied on. Wikidata carries no religion statement for him.
    sources: [source/banglapedia-islam-bengal, source/sarkar-history-of-aurangzib-vol1]

