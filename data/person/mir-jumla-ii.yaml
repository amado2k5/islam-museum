  note: "The English article, Banglapedia and Wikidata give the year 1591; the Arabic article alone adds a day, 12 February 1591, which no other text read supports, so the year alone is built. The birthplace readings divide and are both preserved: the English article and Wikidata name Isfahan, while Banglapedia and Jadunath Sarkar name Ardistan — Sarkar calls him a Sayyid of Ardistan in Persia and, in the same passage, son of an oil-merchant of Isfahan, and his nisba Ardistani follows the Ardistan reading. The born_in edge follows the English article and Wikidata reading, Isfahan, with the Ardistan reading preserved here."
