summary:
  ar: "مير جملة الثاني (1591 – 30 مارس 1663)، واسمه الأصلي مير محمد سيد الأردستاني، تاجر ألماس فارسي المولد صار وزير سلطنة غولكوندا ثم الوزير الأعظم للمغول وصوبه دار البنغال. قاد أساطيل تجارية عبر المحيط الهندي، وغزا الكرناتك لغولكوندا، ثم طارد شاه شجاع إلى دكا وحملته على آسام سنة 1662–1663 التي مات في عودته منها."
  en: "Mir Jumla II (1591 – 30 March 1663), born Mir Muhammad Sayyid Ardistani, was a Persian-born diamond merchant who became vizier of the Golconda Sultanate, then grand vizier of the Mughal Empire and subahdar of Bengal. He commanded trading fleets across the Indian Ocean, conquered the Karnatak for Golconda, pursued Shah Shuja to Dhaka, and led the Assam campaign of 1662–1663, dying on the return march."
  ur: "میر جملہ دوم (1591ء – 30 مارچ 1663ء)، اصل نام میر محمد سید اردستانی، فارسی نژاد ہیروں کے تاجر تھے جو سلطنتِ گولکنڈہ کے وزیر، پھر مغلیہ سلطنت کے وزیرِ اعظم اور بنگال کے صوبیدار بنے۔ انھوں نے بحرِ ہند میں تجارتی بیڑے چلائے، گولکنڈہ کے لیے کرناٹک فتح کیا، شاہ شجاع کا تعاقب ڈھاکہ تک کیا، اور 1662ء–1663ء کی آسام مہم کی قیادت کی جس کی واپسی پر ان کا انتقال ہوا۔"

