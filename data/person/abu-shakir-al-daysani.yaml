summary:
  ar: "أبو شاكر من رؤساء المنانية المتكلمين الذين يظهرون الإسلام ويبطنون الزندقة عند ابن النديم، وكان يدعي معرفة الحديث، وله وللزنادقة كتب مصنفة في نصرة الاثنين ومذاهب أهلها نقضها المتكلمون {cite:fihrist-ibn-al-nadim p. 473}."
  en: "Abu Shakir al-Daysani — crypto-Manichee theologian in Ibn al-Nadim's list {cite:fihrist-ibn-al-nadim}"
  fr: "Abu Shakir al-Daysani, théologien crypto-manichéen dans la liste d'Ibn al-Nadim {cite:fihrist-ibn-al-nadim}"
  es: "Abu Shakir al-Daysani - teólogo criptomaniqueo en la lista de Ibn al-Nadim {cita:fihrist-ibn-al-nadim}"
  ur: "ابو شاکر الدیسانی - ابن الندیم کی فہرست میں کرپٹو مانیچی ماہر الہیات"
  tr: "İbn el-Nadim'e göre, Ebu Şakir, dışarıdan İslam'ı savunan ancak içten içe sapkınlık besleyen Maniheist teologların liderlerinden biriydi. Hadisleri bildiğini iddia etti ve kendisi ile sapkınlar, hem hadisleri hem de halklarının doktrinlerini destekleyen kitaplar yazdılar; bu kitaplar teologlar tarafından çürütüldü. {cite:fihrist-ibn-al-nadim s. 473}"
  id: "Abu Shakir adalah salah satu pemimpin teolog Manichean yang secara lahiriah mengaku Islam tetapi secara batiniah menyimpan ajaran sesat, menurut Ibn al-Nadim. Ia mengaku mengetahui hadits, dan ia serta para penganut ajaran sesat tersebut menulis buku-buku untuk mendukung kedua hadits tersebut dan doktrin-doktrin kaum mereka, yang kemudian dibantah oleh para teolog. {cite:fihrist-ibn-al-nadim p. 473}"
