  note: "Born on 13 February 1877 at Sarajevo, the first son of Hasan Spaho, a qadi in Jajce, Sofia, Cairo and Damascus and a teacher at the Sarajevo Sharia Judges' School, and of Fatima (née Bičakčić). The English, Bosnian and Croatian biographies and Wikidata agree on the day. 'Effendi', used as an honorific prefix by the English biography, is a title, not a name element, and is not entered as a name. The Hijri year 1294 is derived by tabular conversion and is marked derived."
