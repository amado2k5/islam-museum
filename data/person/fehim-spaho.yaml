  calendar: gregorian
  precision: day
  status: historical
  derived: true
  note: "Died at Sarajevo on 14 February 1942, one day after his sixty-fifth birthday, and was buried beside the Gazi Husrev-beg Mosque after a funeral led from that mosque on 15 February. The English and Croatian biographies, the Bosnian biography's infobox and Wikidata give 14 February; the Bosnian biography's body text says he died on 13 February, a variant preserved here. The Hijri year 1361 is derived by tabular conversion and is marked derived."
