summary:
  ar: "عالم وكاتب ومترجم بوسني من سراييفو، الأخ الأكبر للسياسي محمد سباهو؛ عمل قاضياً ورئيساً للمحكمة الشرعية العليا، ثم رئيساً لعلماء يوغوسلافيا من 1938 حتى وفاته سنة 1942، وترجم من التركية والعربية والفارسية، ومن ترجماته «ألف ليلة وليلة»."
  en: "Bosnian scholar, writer and translator from Sarajevo, the elder brother of the politician Mehmed Spaho: a qadi and president of the Supreme Sharia Court who became Grand Mufti (reis-ul-ulema) of Yugoslavia in 1938 and held the office until his death in 1942, translating from Turkish, Arabic and Persian, among his works the Thousand and One Nights."
  ur: "سرائیوو سے تعلق رکھنے والے بوسنیائی عالم، ادیب اور مترجم، سیاست دان محمد سپاہو کے بڑے بھائی؛ قاضی اور سپریم شریعت کورٹ کے صدر رہے، پھر 1938ء میں یوگوسلاویہ کے رئیس العلماء (مفتیِ اعظم) بنے اور 1942ء میں وفات تک اس منصب پر رہے؛ ترکی، عربی اور فارسی سے ترجمے کیے، جن میں «الف لیلہ» بھی شامل ہے۔"
