summary:
  ar: "أحمد بن حازم بن عصمة، أبو القاسم الصفار البلخي، فقيه حنفي، كان إماماً كبيراً إليه الرحلة ببلخ، نقل عن أبي جعفر الهندواني، وتفقه عليه أبو حامد المروزي. قال: خالفت أبا حنيفة في ألف مسألة، والفتوى اليوم على قولي فيها. توفي سنة 326هـ، وقيل 336هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  en: "Ahmad ibn Hazim ibn Isma, Abu al-Qasim al-Saffar al-Balkhi, a Hanafi jurist and a great imam to whom people travelled in Balkh. He transmitted from Abu Ja'far al-Hindawani, and Abu Hamid al-Marwazi studied law under him. He said: I differed from Abu Hanifa on a thousand questions, and the fatwa today follows my view in them. He died in 326 AH, or 336 by another report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
