id: person/al-hasan-ibn-zayd-al-dai
class: person
label: { ar: "الحسن بن زيد الداعي إلى الحق" }
summary:
  ar: "قائم الدعوة العلوية الطبرستانية، الحسن بن زيد بن محمد بن إسماعيل بن الحسن بن زيد الجواد، قام بالدعوة إلى الحق سنة خمسين ومئتين بالري والديلم وهو أول ثلاثة من بني الحسن في الدولة الطبرستانية، وقام بعده أخوه القائم بالحق محمد فقتل سنة ثمان وثمانين فقام حفيده المهدي الحسن بن زيد بن القائم {cite:tarikh-khulafa-minhaj-1434 p. 795}. وعند المسعودي أوقع سنة ثلاث وخمسين ومائتين بسليمان بن عبد الله بن طاهر فأخرجه عن طبرستان {cite:muruj-al-dhahab p. 552}"
  en: "Founder of Tabaristan's Alid state, rising at Rayy and Daylam in 250 as 'al-Da'i ila al-Haqq'; his brother al-Qa'im was killed in 288 and his grandson al-Mahdi followed {cite:tarikh-khulafa-minhaj-1434 p. 795}."
