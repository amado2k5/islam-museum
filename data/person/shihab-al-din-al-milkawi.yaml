died: { edtf: "1400~", hijri: "0803", calendar: julian, precision: year, status: tradition, derived: true, note: "انفصل من الوقعة وهو متألم مع ضعف بدنه السابق فمات {cite:shadharat-dhahab p. 32}." }
summary:
  ar: "أفقه قضاة دمشق، أحد العلماء الأئمة المعتبرين؛ قال الزهري: ما في البلد من أخذ العلوم على وجهها غيره، وكان يقصد بالفتاوى من سائر الأقطار، وكان يميل إلى ابن تيمية كثيراً ويعتقد إحسان كثير من مسائله، وفيه حدة وعنده نقرة من الناس؛ انفصل من وقعة تيمور وهو متألم مع ضعف بدنه فمات {cite:shadharat-dhahab p. 32}."
  en: "Damascus's keenest qadi — 'none in the town took the sciences properly but him' (al-Zuhri), an Ibn Taymiyya-leaning man of sharp temper who died of the wound Timur's fitna inflicted {cite:shadharat-dhahab p. 32}."
  es: "El cadí más entusiasta de Damasco: 'nadie en la ciudad estudió las ciencias apropiadamente excepto él' (al-Zuhri), un hombre de temperamento agudo, inclinado a Ibn Taymiyya, que murió a causa de la herida que le infligió la fitna de Timur {cita: shadharat-dhahab p. 32}."
  fr: "Le cadi le plus passionné de Damas — « aucun dans la ville n'a appris les sciences correctement à part lui » (al-Zuhri), un homme au caractère acéré, de tendance Ibn Taymiyya, qui est mort de la blessure infligée par la fitna de Timur {cite: shadharat-dhahab p. 32}."
  ur: "دمشق کا سب سے بڑا قادی - 'شہر میں اس کے سوا کسی نے علوم کو صحیح طریقے سے نہیں لیا' ⁦(الزہری)⁩، ابن تیمیہ کی طرف جھکاؤ رکھنے والا ایک تیز مزاج آدمی جو تیمور کے فتنے کے زخم سے مر گیا {حوالہ: شدھارت ذہاب صفحہ 2000 32}۔"
  tr: "Şam'ın en bilgili hakimi, saygın alimlerden biriydi; El-Zuhri şöyle dedi: Kasabada bilgiyi doğru biçimde edinen kimse yoktur ve her bölgeden fetvalara atıfta bulundu. İbn Teymiye'ye büyük eğilim gösterdi ve birçok konusunun mükemmelliğine inandı. Keskin ve halk arasında güçlü bir varlığa sahipti; zayıf bedenine rağmen acı çekerek Timur Savaşı'ndan ayrıldı ve öldü {alıntı:Shadharat-Dhahab, s. 32}."
  id: "Hakim paling berpengetahuan di Damaskus adalah salah satu ulama yang dihormati; Al-Zuhri berkata: Tidak ada seorang pun di kota ini yang memperoleh pengetahuan dalam bentuk yang sebenarnya, dan ia merujuk pada fatwa dari semua wilayah. Ia sangat condong kepada Ibn Taymiyyah dan percaya pada keunggulan banyak keturunannya. Ia tajam dan memiliki kehadiran yang kuat di antara rakyat; ia meninggalkan diri dari Pertempuran Timur saat kesakitan meskipun tubuhnya lemah dan meninggal {cite:shadharat-dhahab, hlm. 32}."
