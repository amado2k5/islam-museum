summary:
  ar: "أفقه قضاة دمشق، أحد العلماء الأئمة المعتبرين؛ قال الزهري: ما في البلد من أخذ العلوم على وجهها غيره، وكان يقصد بالفتاوى من سائر الأقطار، وكان يميل إلى ابن تيمية كثيراً ويعتقد إحسان كثير من مسائله، وفيه حدة وعنده نقرة من الناس؛ انفصل من وقعة تيمور وهو متألم مع ضعف بدنه فمات {cite:shadharat-dhahab p. 32}."
  en: "Damascus's keenest qadi — 'none in the town took the sciences properly but him' (al-Zuhri), an Ibn Taymiyya-leaning man of sharp temper who died of the wound Timur's fitna inflicted {cite:shadharat-dhahab p. 32}."
