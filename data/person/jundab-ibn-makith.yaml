summary:
  ar: "صحابي من جهينة كان في سرية غالب بن عبد الله إلى بني الملوح وراوي خبرها؛ بعثه أصحابه ربيئة لهم فرماه رجل من القوم بسهمين فنزعهما وثبت مكانه حتى ظنه الرجل غير ربيئة."
  en: "A Companion of Juhayna who was in Ghalib ibn Abdullah's detachment against Banu al-Mulawwah and narrates it; posted as lookout, he was shot with two arrows by a man of the camp, pulled them out and kept still until the man concluded he was no scout."
  ur: "جہینہ کا صحابی جو غالب بن عبد اللہ کے بنو ملوہ کے خلاف دستے میں تھا اور اسے روایت کرتا ہے؛ پہرے پر تھا تو تیر لگا۔"
  es: "Un compañero de Juhayna, que formaba parte del destacamento de Ghalib ibn Abdullah contra Banu al-Mulawwah, relata lo sucedido: estando de vigía, un hombre del campamento le disparó dos flechas, se las arrancó y se quedó quieto hasta que el hombre concluyó que no era un explorador."
  fr: "Un compagnon de Juhayna, qui faisait partie du détachement de Ghalib ibn Abdullah contre les Banu al-Mulawwah, raconte l'histoire: posté comme guetteur, il fut touché par deux flèches tirées par un homme du camp, les retira et resta immobile jusqu'à ce que l'homme conclue qu'il n'était pas un éclaireur."
  tr: "Juhaynah'tan bir yoldaş, Ghalib ibn Abdullah'ın Banu el-Mulevve'ye yaptığı seferde yer aldı ve haberini anlattı; yoldaşları onu kendilerine rebi'ye gönderdi, halktan bir adam iki ok aldı, o da onları aldı ve adam kendisini rabi'ah sanana kadar yerine sabitledi."
  id: "Seorang sahabat dari Juhaynah yang ikut ekspedisi Ghalib ibn Abdullah ke Banu Al-Mulawwah dan menceritakan kabarnya; para sahabatnya mengirimnya sebagai rabi'ah kepada mereka, dan seorang pria dari masyarakat mengambil dua anak panah, maka ia mengambil anak panah itu dan memasangnya di tempatnya sampai orang itu mengira dirinya bukan rabi'ah."
