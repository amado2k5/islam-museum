id: person/salih-ibn-nasr-al-mutawwii
class: person
label:
  ar: صالح بن نصر الكناني المتطوعي
  en: Salih ibn Nasr al-Kinani al-Mutawwi'i
  es: "Salih ibn Nasr al-Kinani al-Mutawwi'i"
  fr: "Salih ibn Nasr al-Kinani al-Mutawwi'i"
  ur: "صالح بن نصر کنانی المتویٰ"
summary:
  ar: "صالح بن نصر الكناني الملقب صالح المتطوعي؛ زعيم جماعة المتطوعة بنواحي سجستان الذين اجتمعوا لقتال الخوارج الشراة عند اضطراب الدولة ببغداد لقتل المتوكل، فغلبوا على سجستان وملكوها، ثم سار إليهم طاهر بن عبد اللّه أمير خراسان فغلبهم عليها وأخرجهم منها، وكان من صحبه درهم بن الحسن ويعقوب بن الليث الصفار."
  en: "Salih ibn Nasr al-Kinani, called Salih al-Mutawwi'i; leader of the mutatawwi'a volunteers in Sistan who gathered to fight the Kharijite Shurat when the Baghdad state faltered after al-Mutawakkil's killing — they subdued Sistan and ruled it until Tahir ibn Abd Allah, amir of Khurasan, drove them out; among his companions were Dirham ibn al-Hasan and Ya'qub ibn al-Layth al-Saffar."
  es: "Salih ibn Nasr al-Kinani, llamado Salih al-Mutawwi'i; líder de los voluntarios mutatawwi'a en Sistán que se reunieron para luchar contra la Shurat jariyita cuando el estado de Bagdad flaqueó tras el asesinato de al-Mutawakkil; sometieron Sistán y la gobernaron hasta que Tahir ibn Abd Allah, emir de Jorasán, los expulsó; entre sus compañeros estaban Dirham ibn al-Hasan y Ya'qub ibn al-Layth al-Saffar."
  fr: "Salih ibn Nasr al-Kinani, dit Salih al-Mutawwi'i; chef des volontaires mutatawwi'a du Sistan qui se rassemblèrent pour combattre la Shurat kharijite lorsque l'État de Bagdad vacilla après la mort d'al-Mutawakkil — ils soumirent le Sistan et le gouvernèrent jusqu'à ce que Tahir ibn Abd Allah, émir du Khorasan, les chasse; parmi ses compagnons se trouvaient Dirham ibn al-Hasan et Ya'qub ibn al-Layth al-Saffar."
  ur: "صالح بن نصر الکنانی، جسے صالح المتوی کہتے ہیں؛ سیستان میں متواضع رضاکاروں کے رہنما جو خارجی شوری سے لڑنے کے لیے جمع ہوئے جب المتوکل کے قتل کے بعد بغداد کی ریاست ناکام ہوگئی - انہوں نے سیستان کو زیر کیا اور اس پر حکومت کی یہاں تک کہ خراسان کے امیر طاہر بن عبد اللہ نے انہیں نکال باہر کیا۔ آپ کے ساتھیوں میں درہم بن الحسن اور یعقوب بن لیث الصفر تھے۔"
  tr: "Salih ibn Nasr al-Kinani, lakaplı Salih al-Mutawa'i, Sijistan civarındaki mutawatu'ah grubunun lideriydi; Bağdat'taki devletin kargaşasında Şerari Haricilerle savaşmak için toplanmışlardı. Sijistan'ın kontrolünü ele geçirip yönettiler. Sonra Horasan Emiri Tahir ibn Abdullah onlara karşı yürüdü, onları alt etti ve oradan kovdu. Yoldaşları arasında Dirham ibn al-Hasan ve Ya'qub ibn al-Layth al-Saffar da vardı."
  id: "Saleh ibn Nasr al-Kinani, yang dijuluki Salih al-Mutawa'i, adalah pemimpin kelompok mutawatu'ah di sekitar Sijistan, yang berkumpul untuk melawan Kharijite Sharari selama kekacauan negara di Baghdad untuk membunuh al-Mutawakkil. Mereka mengambil alih Sijistan dan memerintahnya. Kemudian Tahir ibn Abdullah, Emir Khorasan, berbaris melawan mereka, mengalahkan mereka, dan mengusir mereka dari sana. Di antara sahabatnya adalah Dirham ibn al-Hasan dan Ya'qub ibn al-Layth al-Saffar."
