label:
  ar: صالح بن نصر الكناني المتطوعي
  en: Salih ibn Nasr al-Kinani al-Mutawwi'i
summary:
  ar: "صالح بن نصر الكناني الملقب صالح المتطوعي؛ زعيم جماعة المتطوعة بنواحي سجستان الذين اجتمعوا لقتال الخوارج الشراة عند اضطراب الدولة ببغداد لقتل المتوكل، فغلبوا على سجستان وملكوها، ثم سار إليهم طاهر بن عبد اللّه أمير خراسان فغلبهم عليها وأخرجهم منها، وكان من صحبه درهم بن الحسن ويعقوب بن الليث الصفار."
  en: "Salih ibn Nasr al-Kinani, called Salih al-Mutawwi'i; leader of the mutatawwi'a volunteers in Sistan who gathered to fight the Kharijite Shurat when the Baghdad state faltered after al-Mutawakkil's killing — they subdued Sistan and ruled it until Tahir ibn Abd Allah, amir of Khurasan, drove them out; among his companions were Dirham ibn al-Hasan and Ya'qub ibn al-Layth al-Saffar."
