summary:
  ar: "رسام وكاتب هندي ثم باكستاني (1880–1964)، من مؤسسي الرسم الهندي الحديث. وُلد في بونا في أسرة يهودية من بني إسرائيل باسم س. رحيمين صموئيل تلكر، ودرس في بومباي والأكاديمية الملكية بلندن، واعتنق الإسلام سنة 1912 عند زواجه من الكاتبة والمفكرة عطية فيضي فاتخذ اسم فيضي رحيمين، ونفّذ جداريات السكرتارية الإمبراطورية في نيودلهي، ثم هاجر إلى كراتشي سنة 1948 وتوفي فيها فقيراً."
  en: "Indian, later Pakistani, painter and writer (1880–1964), one of the founders of modern Indian painting. Born in Poona into a Bene Israel Jewish family as S. Rahamin Samuel Talkar, he studied in Bombay and at the Royal Academy in London, converted to Islam in 1912 on his marriage to the writer and intellectual Atiya Fyzee and took the name Fyzee-Rahamin, painted the frescoes of the Imperial Secretariat in New Delhi, emigrated to Karachi in 1948 and died there in poverty."
  ur: "ہندی، بعد ازاں پاکستانی، مصور اور مصنف (1880ء–1964ء)، جدید ہندی مصوری کے بانیوں میں سے ایک۔ وہ پونے میں بنی اسرائیل یہودی خاندان میں س۔ رحیمین سموئیل تلکر کے نام سے پیدا ہوئے، بمبئی اور لندن کی رائل اکیڈمی میں تعلیم پائی، 1912ء میں مصنفہ و مفکرہ عطیہ فیضی سے شادی پر اسلام قبول کر کے فیضی رحیمین نام اختیار کیا، نئی دہلی کی امپیریل سیکرٹریٹ کی دیوار تصویریں بنائیں، 1948ء میں کراچی آ گئے اور وہیں غربت میں وفات پائی۔"
