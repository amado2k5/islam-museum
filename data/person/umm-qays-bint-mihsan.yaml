summary:
  ar: أخت عكاشة بن محصن، أسلمت قديماً بمكة وبايعت وهاجرت؛ روت أحاديث في الصحيحين منها حديث ولدها الصغير الذي لم يأكل الطعام، وقال النبي في إحدى القصص «ما لها طال عمرها»، فقيل إنه لا يُعلم امرأة عمّرت ما عمّرت.
  en: A sister of Ukkasha ibn Mihsan, she embraced Islam early at Mecca, gave her pledge and emigrated; she narrated hadith in the two collections, including the one about her small son who had not yet eaten food, and in one story the Prophet
    said 'May her life be long', after which it was said no woman was known to have lived as long as she did.
