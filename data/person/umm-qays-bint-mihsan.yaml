summary:
  ar: أخت عكاشة بن محصن، أسلمت قديماً بمكة وبايعت وهاجرت؛ روت أحاديث في الصحيحين منها حديث ولدها الصغير الذي لم يأكل الطعام، وقال النبي في إحدى القصص «ما لها طال عمرها»، فقيل إنه لا يُعلم امرأة عمّرت ما عمّرت.
  en: A sister of Ukkasha ibn Mihsan, she embraced Islam early at Mecca, gave her pledge and emigrated; she narrated hadith in the two collections, including the one about her small son who had not yet eaten food, and in one story the Prophet
    said 'May her life be long', after which it was said no woman was known to have lived as long as she did.
  ur: "عکاشہ بن محصن کی بہن، مکہ میں جلد مسلمان ہوئی، بیعت کی اور ہجرت کی؛ دونوں صحیحین میں حدیث روایت کی۔"
  es: "Hermana de Ukkasha ibn Mihsan, abrazó el Islam tempranamente en La Meca, hizo su voto y emigró; narró hadices en las dos colecciones, incluyendo uno sobre su hijo pequeño que aún no había comido, y en una historia el Profeta dijo: \"Que tenga una larga vida\", tras lo cual se dijo que ninguna mujer conocida había vivido tanto como ella."
  fr: "Sœur d'Ukkasha ibn Mihsan, elle embrassa l'islam très jeune à La Mecque, prêta serment d'allégeance et émigra; elle a rapporté des hadiths dans les deux recueils, dont celui concernant son jeune fils qui n'avait pas encore mangé, et dans une histoire, le Prophète dit: « Que sa vie soit longue », après quoi il fut dit qu'aucune femme n'avait jamais vécu aussi longtemps qu'elle."
  tr: "Mekke'de uzun zaman önce İslam'ı benimseyen, sadakat eden ve göç eden Ukaşa ibn Muhsin'in kız kardeşi; iki Sahih'te hadisleri, yemek yemeyen küçük oğlunun hikayesini anlatmıştır. Peygamber bir hikayede, \"Ne kadar yaşayacak?\" demiştir. Uzun yaşayan bir kadını tanımadığı söylenir."
  id: "Saudari Ukasha ibn Muhsin, yang lama memeluk Islam di Mekah, bersumpah setia dan bermigrasi; ia menceritakan hadits dalam dua Sahih, termasuk kisah putranya yang masih kecil yang tidak makan. Nabi berkata dalam salah satu cerita, \"Berapa lama dia akan hidup?\" Dikatakan bahwa dia tidak mengetahui seorang wanita yang hidup lama seperti dia hidup."
