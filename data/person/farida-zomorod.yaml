summary:
  ar: «باحثة مغربية في التفسير وعلوم القرآن، أستاذة بدار الحديث الحسنية، جامعة القرويين بالرباط، منذ 2001، وتخصصها الدقيق هو الدراسات المصطلحية للقرآن الكريم؛ من مؤلفاتها «مفهوم التأويل في القرآن الكريم — دراسة مصطلحية» و«معجم المصطلحات القرآنية المعرفة في تفسير الطبري».»
  en: "A Moroccan scholar of tafsir and Qur'anic sciences, professor at Dar al-Hadith al-Hassaniyya, University of al-Qarawiyyin, Rabat, since 2001, whose precise specialisation is the terminological study of the Qur'an; her books include 'Mafhum al-Ta'wil fi al-Qur'an al-Karim' (The Concept of Interpretation in the Qur'an — a terminological study) and a dictionary of the Qur'anic terms defined in al-Tabari's tafsir."
  ur: «تفسیر و علومِ قرآن کی مراکشی محققہ؛ 2001 سے دار الحدیث الحسنیہ، جامعہ القرویین، رباط میں استاذ ہیں، اور ان کی دقیق تخصص قرآن کی اصطلاحی مطالعات ہے؛ ان کی کتابوں میں «مفهوم التأويل في القرآن الكريم» اور تفسیر طبری میں معروف قرآنی اصطلاحات کی لغت شامل ہے۔»
