label: { ar: "خالد بن سنان العبسي", en: "Khalid ibn Sinan al-'Absi", es: "Khalid ibn Sinan al-'Absi", fr: "Khalid ibn Sinan al-'Absi", ur: "خالد بن سنان العبسی" }
summary:
  ar: "نبي بني عبس في الفترة بين عيسى ومحمد على ما يرويه المسعودي عن ابن عباس، دعا على العنقاء فقطع الله نسلها حين شكا إليه الناس أكلها الصبيان والوحوش، ولما حضرته الوفاة أوصى قومه أن يدفنوه في حقف ويحرسوا قبره فإذا رأوا حماراً أشهب أبتر يدور حوله اجتمعوا ونبشوه وأحضروا كاتباً يملي عليهم ما يكون إلى يوم القيامة، فرصدوه ثلاثاً ثلاثاً ثلاثاً فلما ظهر الحمار أبوا ولده أن ينبشوه أن يعيروا بولد المنبوش، ووردت ابنته العجوز على النبي فتلقاها بخير وأكرمها وقال مرحباً بابنة نبي ضيعه أهله {cite:muruj-al-dhahab p. 527-528}."
  en: "The prophet of Banu 'Abs in the interval between Jesus and Muhammad — his curse cut the 'anqa's line, and his death-bed charge to exhume him at the grey donkey's circling was undone by his sons' fear of the 'exhumed one's sons' taunt; his aged daughter came to the Prophet, who welcomed her as a prophet's child betrayed by her people {cite:muruj-al-dhahab p. 527-528}."
  es: "El profeta de Banu 'Abs en el intervalo entre Jesús y Mahoma —su maldición cortó la línea de 'anqa, y su orden en el lecho de muerte de exhumarlo en el círculo del asno gris fue deshecha por el temor de sus hijos a la burla de 'los hijos del exhumado'; su anciana hija vino al Profeta, quien la recibió como una hija de profeta traicionada por su pueblo {cite:muruj-al-dhahab p. 527-528}."
  fr: "Le prophète des Banu 'Abs, dans l'intervalle entre Jésus et Muhammad, sa malédiction coupa la ligne des 'anqa, et sa charge sur son lit de mort d'être exhumé au cercle de l'âne gris fut annulée par la peur de ses fils de la raillerie des « fils de celui qui a été exhumé »; sa fille âgée vint au Prophète, qui l'accueillit comme une enfant de prophète trahie par son peuple {cite:muruj-al-dhahab p. 527-528}."
  ur: "بنو عباس کے نبی نے عیسیٰ اور محمد کے درمیان وقفہ میں - اس کی لعنت نے 'انقا' کی لکیر کو کاٹ دیا، اور اس کے بستر پر اسے سرمئی گدھے کے چکر میں جلانے کا الزام اس کے بیٹوں کے 'بیٹوں کے مارے جانے والے' طعنوں کے خوف سے ختم ہوگیا۔ اس کی عمر رسیدہ بیٹی نبی کے پاس آئی، جس نے اس کا استقبال ایک نبی کی اولاد کے طور پر کیا جسے اس کی قوم نے دھوکہ دیا تھا۔ 527-528}۔"
