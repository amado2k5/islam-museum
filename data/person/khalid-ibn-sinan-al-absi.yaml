id: person/khalid-ibn-sinan-al-absi
class: person
label: { ar: "خالد بن سنان العبسي", en: "Khalid ibn Sinan al-'Absi" }
summary:
  ar: "نبي بني عبس في الفترة بين عيسى ومحمد على ما يرويه المسعودي عن ابن عباس، دعا على العنقاء فقطع الله نسلها حين شكا إليه الناس أكلها الصبيان والوحوش، ولما حضرته الوفاة أوصى قومه أن يدفنوه في حقف ويحرسوا قبره فإذا رأوا حماراً أشهب أبتر يدور حوله اجتمعوا ونبشوه وأحضروا كاتباً يملي عليهم ما يكون إلى يوم القيامة، فرصدوه ثلاثاً ثلاثاً ثلاثاً فلما ظهر الحمار أبوا ولده أن ينبشوه أن يعيروا بولد المنبوش، ووردت ابنته العجوز على النبي فتلقاها بخير وأكرمها وقال مرحباً بابنة نبي ضيعه أهله {cite:muruj-al-dhahab p. 527-528}."
  en: "The prophet of Banu 'Abs in the interval between Jesus and Muhammad — his curse cut the 'anqa's line, and his death-bed charge to exhume him at the grey donkey's circling was undone by his sons' fear of the 'exhumed one's sons' taunt; his aged daughter came to the Prophet, who welcomed her as a prophet's child betrayed by her people {cite:muruj-al-dhahab p. 527-528}."
