id: person/ahmad-ibn-abdallah-ibn-salam
class: person
label: { ar: "أحمد بن عبد الله بن سلام", en: "Ahmad b. Abdallah b. Salam", fr: "Ahmad b. Abdallah b. Salam", es: "Ahmad b. Abdallah b. Salam", ur: "احمد بی۔ عبداللہ بی سلام" }
summary:
  ar: "مولى أمير المؤمنين هارون الرشيد، ترجم كتاب الحنفاء عن الصابئين الإبراهيمية وترجم صدره والصحف والتوراة والإنجيل وكتب الأنبياء والتلاميذ من العبرانية واليونانية والصابئية إلى العربية حرفاً حرفاً ولم يتبع تحسين لفظ ولا تزيينه مخافة التحريف {cite:fihrist-ibn-al-nadim p. 51-53}."
  en: "Harun al-Rashid's client who rendered the Kitab al-Hunafa and scriptures word-for-word from Hebrew, Greek and Sabian {cite:fihrist-ibn-al-nadim p. 51-53}."
  fr: "Client d'Harun al-Rashid qui traduisit mot à mot le Kitab al-Hunafa et les Écritures de l'hébreu, du grec et du sabéen {cite:fihrist-ibn-al-nadim p. 51-53}."
  es: "Cliente de Harun al-Rashid que tradujo el Kitab al-Hunafa y las escrituras palabra por palabra del hebreo, griego y sabeo {cite:fihrist-ibn-al-nadim p. 51-53}."
  ur: "ہارون الرشید کا مؤکل جس نے کتاب الحنافہ اور صحیفوں کو عبرانی، یونانی اور صابین سے لفظ بہ لفظ ترجمہ کیا {حوالہ: فہرست ابن الندیم ص۔ 51-53}۔"
  tr: "Müminlerin Emiri'nin azatlı kölesi Harun el-Raşid, İbrahimî Sabiilerden Haniflerin kitabını tercüme etmiş ve başlangıcını, tomarları, Tevrat'ı, İncil'i ve peygamberlerin ve havarilerin kitaplarını İbranice, Yunanca ve Sabii dillerinden Arapçaya harf harf, bozulma korkusuyla kelime seçimini değiştirmeden veya süslemeden çevirmiştir. {cite:fihrist-ibn-al-nadim s. 51-53}"
  id: "Budak yang dibebaskan oleh Amirul Mukminin, Harun al-Rashid, menerjemahkan kitab Hanif dari kaum Sabian Ibrahim, dan menerjemahkan bagian awalnya, gulungan-gulungan, Taurat, Injil, dan kitab-kitab para nabi dan murid dari bahasa Ibrani, Yunani, dan Sabian ke dalam bahasa Arab huruf demi huruf, tanpa memperbaiki atau memperindah kata-katanya karena takut akan distorsi. {cite:fihrist-ibn-al-nadim hlm. 51-53}."
