id: person/al-jahir-ibn-ziyad-of-banu-al-harith
class: person
label:
  ar: "الجاهر بن زياد الحارثي"
  en: "al-Jahir ibn Ziyad of Banu al-Harith"
  ur: "جاہر بن زیاد حارثی"
  es: "al-Jahir ibn Ziyad of Banu al-Harith"
  fr: "al-Jahir ibn Ziyad of Banu al-Harith"
summary:
  ar: "رجل من بني الحارث من أهل المحبة والمودة بحسب الراوي لحق محمد بن عبيد الله وهو يطلب الغارة على همدان وسأله الرجوع."
  en: "A man of Banu al-Harith described by the narrator as loyal and affectionate, who overtook Muhammad ibn Ubaydallah as he followed the raiders of Hamdan and asked him to turn back."
  ur: "بنو حارث کا ایک شخص جسے راوی محبت اور مودت والا بتاتا ہے، جس نے ہمدان پر چھاپہ مارنے والوں کا تعاقب کرتے محمد بن عبید اللہ کو آ لیا اور لوٹنے کی درخواست کی۔"
  es: "Un hombre de Banu al-Harith, descrito por el narrador como leal y afectuoso, alcanzó a Muhammad ibn Ubaydallah mientras este seguía a los asaltantes de Hamdan y le pidió que regresara."
  fr: "Un homme de Banu al-Harith, décrit par le narrateur comme loyal et affectueux, qui rattrapa Muhammad ibn Ubaydallah alors qu'il poursuivait les pillards de Hamdan et lui demanda de faire demi-tour."
  tr: "Anlatıcıya göre, Banu al-Harith'ten bir adam, sevgi ve şefkat dolu bir adam, Muhammed ibn Ubayd Allah Hamdan'a baskın talep ederken onu takip etti ve onu geri çağırdı."
  id: "Seorang pria dari Banu al-Harith, seorang pria yang penuh kasih sayang menurut narator, mengikuti Muhammad ibn Ubayd Allah saat ia meminta serangan ke Hamdan dan memintanya kembali."
