summary:
  ar: "علباء بن الحارث الأسدي الكاهلي، صاحب أمر بني أسد يوم ثاروا على حجر أبي امرئ القيس؛ حمل على حجر فطعنه فقتله وكان حجر قتل أباه، وقيل إن حجراً أُسر فوثب عليه ابن أخت علباء بمثل ذلك، وهو الذي نصح بني أسد أن يرتحلوا من عند بني كنانة ولا يعلموهم حين أقبل امرؤ القيس بجموع بكر وتغلب يطلب ثأره {cite:kamil-ibn-al-athir p. 383-384}."
  en: "Ilba' ibn al-Harith al-Asadi al-Kahili, leader of Banu Asad's rising against Hujr; he speared Hujr to avenge his own father, and later counselled Asad to slip away from Kinana's camp by night as Imru' al-Qays approached seeking blood {cite:kamil-ibn-al-athir p. 383-384}."
