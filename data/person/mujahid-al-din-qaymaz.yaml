label: { ar: "مجاهد الدين قايماز", en: "Mujahid al-Din Qaymaz", es: "Mujahid al-Din Qaymaz", fr: "Mujahid al-Din Qaymaz", ur: "مجاہد الدین قیام" }
summary:
  ar: "مجاهد الدين قايماز، الحاكم في دولة نور الدين محمود بن زنكي والمرجوع إليه فيها؛ ابتدأت ولايته قلعة الموصل في ذي الحجة سنة إحدى وسبعين وخمسمائة، ووُلّي إربل سنة تسع وخمسين، وتوفي بقلعة الموصل في ربيع الأول سنة خمس وتسعين وخمسمائة {cite:kamil-ibn-al-athir p. 263}."
  en: "Mujahid al-Din Qaymaz — the governing hand of Nur al-Din's house: appointed to Mosul's citadel in Dhu al-Hijja 571, given Irbil in 559, and died at the Mosul citadel in Rabi' I 595 {cite:kamil-ibn-al-athir p. 263}."
  es: "Mujahid al-Din Qaymaz — la mano gobernante de la casa de Nur al-Din: nombrado para la ciudadela de Mosul en Dhu al-Hijja 571, recibió Irbil en 559 y murió en la ciudadela de Mosul en Rabi' I 595 {cite:kamil-ibn-al-athir p. 263}."
  fr: "Mujahid al-Din Qaymaz — le bras dirigeant de la maison de Nur al-Din: nommé à la citadelle de Mossoul en Dhu al-Hijja 571, reçut Erbil en 559 et mourut à la citadelle de Mossoul en Rabi' I 595 {cite: kamil-ibn-al-athir p. 263}."
  ur: "مجاہد الدین قیام - نورالدین کے گھر کا حکمران: ذی الحجہ 571 میں موصل کے قلعہ پر مقرر کیا گیا، 559 میں اربیل دیا گیا، اور ربیع اول 595 میں موصل کے قلعے میں وفات پائی۔ 263}۔"
  tr: "Nur al-Din Mahmud bin Zengi'nin devletinin hükümdarı Mücahiddin Qaymaz burada anılır; yönetimi 571 Hicr yılında Musul Kalesi'nde Dhu al-Hijjah'da başladı, 559 Hicri yılında Erbil valisi olarak atandı ve 595 Hicri yılında Rabi'al-Awwal'daki Musul Kalesi'nde öldü. {cite:kamil-ibn-al-athir, s. 263}."
  id: "Mujahid al-Din Qaymaz, penguasa negara Nur al-Din Mahmoud ibn Zengi dan merujuk pada sana; pemerintahannya dimulai di Benteng Mosul di Dhu al-Hijjah pada tahun 571 H, ia diangkat menjadi gubernur Erbil pada tahun 559 H, dan meninggal di Benteng Mosul di Rabi' al-Awwal pada tahun 595 H. {cite:kamil-ibn-al-athir, hlm. 263}."
