summary:
  ar: "أبو فراس المغيرة بن المهلب بن أبي صفرة الأزدي؛ كان ديماجاً كان على زياد الأعجم فقال زياد في ذلك «لعمرك ما الديباج مزّقته وحده ولكنما مزقته عرضاً الملب» فبلغ ذلك المهلب فأرضاه واستعطفه، وذكر أبو الحسين علي بن أحمد السلّامي في كتاب تاريخ ولاة خراسان طرفاً من خبره {cite:wafayat-ayan}."
  en: "Abu Firas al-Mughira b. al-Muhallab — of the Muhallabid house; the satirist Ziyad al-A'jam mocked his Persian satins ('it was not the dibaj that tore but its wearer's show'), and al-Muhallab placated him {cite:wafayat-ayan}."
