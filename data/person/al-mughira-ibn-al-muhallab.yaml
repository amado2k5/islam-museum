id: person/al-mughira-ibn-al-muhallab
class: person
label: { ar: "المغيرة بن المهلب", en: "al-Mughira ibn al-Muhallab", fr: "al-Mughira ibn al-Muhallab", es: "al-Mughira ibn al-Muhallab", ur: "المغیرہ ابن المحلب" }
summary:
  ar: "أبو فراس المغيرة بن المهلب بن أبي صفرة الأزدي؛ كان ديماجاً كان على زياد الأعجم فقال زياد في ذلك «لعمرك ما الديباج مزّقته وحده ولكنما مزقته عرضاً الملب» فبلغ ذلك المهلب فأرضاه واستعطفه، وذكر أبو الحسين علي بن أحمد السلّامي في كتاب تاريخ ولاة خراسان طرفاً من خبره {cite:wafayat-ayan}."
  en: "Abu Firas al-Mughira b. al-Muhallab — of the Muhallabid house; the satirist Ziyad al-A'jam mocked his Persian satins ('it was not the dibaj that tore but its wearer's show'), and al-Muhallab placated him {cite:wafayat-ayan}."
  fr: "Abu Firas al-Mughira b. al-Muhallab – de la maison Muhallabid ; le satiriste Ziyad al-A'jam se moquait de ses satins perses (« ce n'était pas le dibaj qui a déchiré, mais son spectacle de porteur »), et al-Muhallab l'a apaisé {cite:wafayat-ayan}."
  es: "Abu Firas al-Mughira b. al-Muhallab — de la casa Muhallabid; el satírico Ziyad al-A'jam se burló de sus satenes persas ('no fue el dibaj lo que se rasgó sino la apariencia de quien lo llevaba'), y al-Muhallab lo apaciguó {cite:wafayat-ayan}."
  ur: "ابو فراس المغیرہ۔ المحلب — محلبی گھر کا۔ طنز نگار زیاد العجم نے اپنے فارسی ساٹنوں کا مذاق اڑایا ⁦('یہ دباج نہیں تھا جو پھاڑتا تھا بلکہ اس کے پہننے والوں کا شو')⁩، اور المحلب نے اسے تسلی دی۔"
