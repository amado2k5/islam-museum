summary:
  ar: "شاعرة وكاتبة مقالات ومترجمة لبنانية فلسطينية (1886–1941)، وُلدت في الناصرة باسم ماري إلياس زيادة واختارت لنفسها اسم «مي»، وكتبت بالعربية والفرنسية وباسم مستعار هو «إيزيس كوبيا». كان صالونها الأدبي في القاهرة منذ 1921 من أشهر صالونات العالم العربي، وهي من رائدات النسوية العربية، وراسلت جبران خليل جبران تسعة عشر عامًا دون أن تلتقيه قط."
  en: "Lebanese-Palestinian poet, essayist and translator (1886–1941), born Marie Elias Ziadeh in Nazareth, who wrote in Arabic and French under her chosen name May and the pen name Isis Copia. Her Cairo salon, held from 1921, was among the most famous literary salons of the modern Arab world; a pioneer of Arab feminism, she corresponded for nineteen years with Khalil Gibran, whom she never met."
  ur: "لبنانی فلسطینی شاعرہ، مضمون نگار اور مترجم (1886–1941)، ناصرہ میں ماری الیاس زیادہ کے نام سے پیدا ہوئیں، «می» کا نام خود منتخب کیا اور «ایزس کوپیا» کے قلمی نام سے عربی و فرانسیسی میں لکھا۔ 1921 سے قاہرہ میں ان کا ادبی صالون عرب دنیا کے مشہور ترین صالونوں میں شمار ہوا؛ عرب نسوانیت کی علم بردار، انہوں نے خلیل جبران سے انیس برس خط کتابت کی، حالانکہ کبھی ملاقات نہ ہوئی۔"
