summary:
  ar: "شاعرة وكاتبة مقالات ومترجمة لبنانية فلسطينية (1886–1941)، وُلدت في الناصرة باسم ماري إلياس زيادة واختارت لنفسها اسم «مي»، وكتبت بالعربية والفرنسية وباسم مستعار هو «إيزيس كوبيا». كان صالونها الأدبي في القاهرة منذ 1921 من أشهر صالونات العالم العربي، وهي من رائدات النسوية العربية، وراسلت جبران خليل جبران تسعة عشر عامًا دون أن تلتقيه قط."
  en: "Lebanese-Palestinian poet, essayist and translator (1886–1941), born Marie Elias Ziadeh in Nazareth, who wrote in Arabic and French under her chosen name May and the pen name Isis Copia. Her Cairo salon, held from 1921, was among the most famous literary salons of the modern Arab world; a pioneer of Arab feminism, she corresponded for nineteen years with Khalil Gibran, whom she never met."
  ur: "لبنانی فلسطینی شاعرہ، مضمون نگار اور مترجم (1886–1941)، ناصرہ میں ماری الیاس زیادہ کے نام سے پیدا ہوئیں، «می» کا نام خود منتخب کیا اور «ایزس کوپیا» کے قلمی نام سے عربی و فرانسیسی میں لکھا۔ 1921 سے قاہرہ میں ان کا ادبی صالون عرب دنیا کے مشہور ترین صالونوں میں شمار ہوا؛ عرب نسوانیت کی علم بردار، انہوں نے خلیل جبران سے انیس برس خط کتابت کی، حالانکہ کبھی ملاقات نہ ہوئی۔"
  es: "Poeta, ensayista y traductora libanesa-palestina (1886-1941), nacida Marie Elias Ziadeh en Nazaret, escribió en árabe y francés bajo el nombre que eligió, May, y el seudónimo de Isis Copia. Su salón literario en El Cairo, que se celebraba desde 1921, fue uno de los más famosos del mundo árabe moderno; pionera del feminismo árabe, mantuvo correspondencia durante diecinueve años con Khalil Gibran, a quien nunca conoció personalmente."
  fr: "Poétesse, essayiste et traductrice libano-palestinienne (1886-1941), née Marie Elias Ziadeh à Nazareth, elle écrivait en arabe et en français sous le nom de May et le pseudonyme d'Isis Copia. Son salon du Caire, ouvert à partir de 1921, fut l'un des plus célèbres salons littéraires du monde arabe moderne. Pionnière du féminisme arabe, elle entretint une correspondance pendant dix-neuf ans avec Khalil Gibran, qu'elle ne rencontra jamais."
  tr: "Lübnanlı-Filistinli şair, denemeci ve çevirmen (1886–1941), Nasıra'da Mary Elias Ziada adıyla doğmuş ve kendisi için 'Mai' adını seçmiştir. Arapça ve Fransızca olarak 'Isis Cuba' takma adıyla yazmıştır. Kahire'deki edebi salonu, 1921'den beri Arap dünyasının en ünlü salonlarından biriydi. Arap feminizminin öncülerinden biriydi ve on dokuz yıl boyunca Khalil Gibran ile yazıştı ancak onunla hiç tanışmadı."
  id: "Seorang penyair, esais, dan penerjemah Lebanon-Palestina (1886–1941), lahir di Nazaret dengan nama Mary Elias Ziada dan memilih nama 'Mai' untuk dirinya sendiri. Ia menulis dalam bahasa Arab dan Prancis dengan nama samaran 'Isis Cuba'. Salon sastranya di Kairo menjadi salah satu salon paling terkenal di dunia Arab sejak tahun 1921. Ia adalah salah satu pelopor feminisme Arab, dan ia berkorespondensi dengan Khalil Gibran selama sembilan belas tahun tanpa pernah bertemu dengannya."
