summary:
  ar: "حارثة بن النعمان الأنصاري النجاري، صحابي شهد بدراً وأحداً والخندق والمشاهد كلها وثبت يوم حنين، وكان يتحول للنبي عن منازله كلما احتاج منزلاً حتى قال النبي إنه استحيا منه؛ روى أحمد بن حنبل في «فضائل الصحابة» بإسناد صحيح حديث عائشة أن النبي سمع قراءته في الجنة في منامه وقال «كذلك البر» وكان أبر الناس بأمه، وحديثه أنه سلّم على النبي وعنده جبريل فرد عليه جبريل السلام؛ وتوفي في خلافة معاوية سنة 51هـ."
  en: "Haritha ibn al-Nu'man al-Ansari of Banu al-Najjar, a Companion who fought at Badr, Uhud, the Trench and every campaign and stood firm at Hunayn. He kept moving out of his houses for the Prophet whenever he needed one, until the Prophet said he felt shy before him. In Fada'il al-Sahaba Ahmad ibn Hanbal narrates with sound chains Aisha's report that the Prophet heard him reciting in Paradise in a dream and said 'such is dutifulness' — he was the most dutiful of people to his mother — and Haritha's own report that he greeted the Prophet while Gabriel sat with him and Gabriel returned his greeting. He died in Mu'awiya's caliphate in 51 AH."
  ur: "بنو نجار کے انصاری صحابی تھے۔ بدر، احد، خندق اور حنین میں شریک ہوئے؛ موجودہ سوانح میں ان کی خاندانی خدمت اور والدہ سے حسن سلوک کی روایات بھی درج ہیں۔ {cite:fadail-sahaba-ahmad-wasi-allah-1999}"
