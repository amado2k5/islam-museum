summary:
  ar: "حارثة بن النعمان الأنصاري النجاري، صحابي شهد بدراً وأحداً والخندق والمشاهد كلها وثبت يوم حنين، وكان يتحول للنبي عن منازله كلما احتاج منزلاً حتى قال النبي إنه استحيا منه؛ روى أحمد بن حنبل في «فضائل الصحابة» بإسناد صحيح حديث عائشة أن النبي سمع قراءته في الجنة في منامه وقال «كذلك البر» وكان أبر الناس بأمه، وحديثه أنه سلّم على النبي وعنده جبريل فرد عليه جبريل السلام؛ وتوفي في خلافة معاوية سنة 51هـ."
  en: "Haritha ibn al-Nu'man al-Ansari of Banu al-Najjar, a Companion who fought at Badr, Uhud, the Trench and every campaign and stood firm at Hunayn. He kept moving out of his houses for the Prophet whenever he needed one, until the Prophet said he felt shy before him. In Fada'il al-Sahaba Ahmad ibn Hanbal narrates with sound chains Aisha's report that the Prophet heard him reciting in Paradise in a dream and said 'such is dutifulness' — he was the most dutiful of people to his mother — and Haritha's own report that he greeted the Prophet while Gabriel sat with him and Gabriel returned his greeting. He died in Mu'awiya's caliphate in 51 AH."
  ur: "بنو نجار کے انصاری صحابی تھے۔ بدر، احد، خندق اور حنین میں شریک ہوئے؛ موجودہ سوانح میں ان کی خاندانی خدمت اور والدہ سے حسن سلوک کی روایات بھی درج ہیں۔ {cite:fadail-sahaba-ahmad-wasi-allah-1999}"
  es: "Haritha ibn al-Nu'man al-Ansari de Banu al-Najjar, un Compañero que luchó en Badr, Uhud, la Trinchera y en todas las campañas, y se mantuvo firme en Hunayn. Salía de sus casas para atender al Profeta siempre que lo necesitaba, hasta que el Profeta dijo que se sentía cohibido ante él. En Fada'il al-Sahaba, Ahmad ibn Hanbal narra con cadenas de transmisión fiables el relato de Aisha de que el Profeta lo oyó recitar en el Paraíso en un sueño y dijo: «Así es la obediencia» —era el más obediente de los hombres con su madre— y el propio relato de Haritha de que saludó al Profeta mientras Gabriel estaba sentado con él y Gabriel le devolvió el saludo. Murió durante el califato de Mu'awiya en el año 51 de la Hégira."
  fr: "Haritha ibn al-Nu'man al-Ansari, de la tribu des Banu al-Najjar, Compagnon ayant combattu à Badr, Uhud, au Fossé et lors de toutes les campagnes, et ayant tenu bon à Hunayn, se déplaçait constamment pour le Prophète chaque fois qu'il en avait besoin, au point que ce dernier confia éprouver de la timidité en sa présence. Dans Fada'il al-Sahaba, Ahmad ibn Hanbal rapporte, avec des chaînes de transmission authentiques, le récit d'Aïcha selon lequel le Prophète l'entendit réciter au Paradis en songe et dit: « Voilà la piété ! » – il était le plus dévoué des hommes envers sa mère – ainsi que le récit d'Haritha lui-même, qui salua le Prophète alors que Gabriel était assis auprès de lui et auquel Gabriel répondit par un salut. Il mourut sous le califat de Mu'awiya en 51 AH."
