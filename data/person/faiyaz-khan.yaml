summary:
  ar: "مغنٍّ كلاسيكي هندي (1886–1950)، أبرز أعلام غرانة آغرة في الغناء الهندستاني، وُلد في سكندرا قرب آغرة وتوفي في بارودا. عُرف بلقب «آفتاب موسيقي» (شمس الموسيقى)، وكان موسيقي بلاط بارودا، ولحّن باسم «بريم بيا»، وجمع في أسلوبه بين الدروباد والخيال والثومري."
  en: "Indian classical vocalist (1886–1950), the leading exponent of the Agra gharana of Hindustani music, born at Sikandara near Agra and died at Baroda. Known as Aftab-e-Mausiqi ('the Sun of Music'), he was court musician of Baroda, composed under the pen name Prem Piya, and blended dhrupad, khyal and thumri in his style."
  ur: "ہندوستانی کلاسیکی گلوکار (1886ء–1950ء)، آگرہ گھرانے کے سب سے نامور استاد؛ سکندرہ (قرب آگرہ) میں پیدا ہوئے اور بڑودہ میں وفات پائی۔ «آفتابِ موسیقی» کے لقب سے مشہور ہوئے، بڑودہ کے درباری موسیقار رہے، «پریم پیا» کے قلمی نام سے بندشیں بنائیں اور اپنے انداز میں دھرپد، خیال اور ٹھمری کو یکجا کیا۔"
