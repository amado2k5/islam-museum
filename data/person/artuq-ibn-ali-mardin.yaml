summary:
  ar: "صاحب ماردين الأرتقي؛ تملك ماردين بضعاً وثلاثين سنة وكان فيه عدل ودين في الجملة، قتله غلمانه بمواطأة ابن ابنه، وتملك بعده ابنه نجم الدين غازي {cite:shadharat-dhahab p. 188}."
  en: "The Artuqid lord of Mardin (killed 636) — ~35 just years, murdered by his own ghilman in league with his grandson; succeeded by his son Najm al-Din Ghazi {cite:shadharat-dhahab p. 188}."
  es: "El señor artúquida de Mardin (asesinado en 636) — ~35 años de edad, asesinado por su propio ghilman en complicidad con su nieto; sucedido por su hijo Najm al-Din Ghazi {cita: shadharat-dhahab p. 188}."
  fr: "Le seigneur artouqid de Mardin (tué en 636) — ~35 ans seulement, assassiné par son propre ghilman en alliance avec son petit-fils; remplacé par son fils Najm al-Din Ghazi {cite:shadharat-dhahab p. 188}."
  ur: "ماردین کا آرتوقید لارڈ ⁦(قتل 636)⁩ — ~35 صرف سال، اس کے اپنے غلام کے ہاتھوں اس کے پوتے کے ساتھ لیگ میں قتل؛ اس کے بعد اس کا بیٹا نجم الدین غازی بنا۔ 188}۔"
  tr: "Mardin el-Artici sahibi olan Kızıl, yaklaşık otuz yıl boyunca Mardin'i yönetti ve genel olarak adil ve dindardı. Hizmetkarları oğlunun yardımıyla onu öldürdü ve ardından oğlu Necmeddin Gazi kontrolü ele aldı {kaynak: shadharat-dhahab, s. 188}."
  id: "Pemilik Mardin al-Artiqi; ia memerintah Mardin selama sekitar tiga puluh tahun dan secara umum adil serta religius. Para pelayannya membunuhnya dengan bantuan putranya, dan setelahnya, putranya Najm al-Din Ghazi mengambil alih {cite:shadharat-dhahab, hlm. 188}."
