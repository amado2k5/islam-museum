summary:
  ar: "لاعب كرة قدم عاجي معتزل، وُلد في أنياما بساحل العاج سنة 1987. مهاجم فاز مع ليل بثنائية الدوري والكأس في فرنسا 2010–11، ولعب لأرسنال وروما وخبي الصين وبارما وطرابزون سبور الذي فاز معه بالدوري التركي 2021–22، وخاض أكثر من 80 مباراة مع منتخب ساحل العاج سجل فيها 23 هدفًا وفاز بكأس أمم أفريقيا 2015."
  en: "Ivorian retired footballer, born in Anyama, Ivory Coast in 1987. A forward who won the French league-and-cup double with Lille in 2010–11, played for Arsenal, Roma, Hebei China Fortune, Parma and Trabzonspor — winning the Turkish Süper Lig with the last in 2021–22 — and won over 80 caps for Ivory Coast, scoring 23 goals and lifting the 2015 Africa Cup of Nations."
  ur: "آئیوریائی ریٹائرڈ فٹبالر، 1987 میں آئیوری کوسٹ کے انیاما میں پیدا ہوئے۔ فارورڈ جنہوں نے لیل کے ساتھ 2010–11 میں فرانسیسی لیگ اور کپ کا دوہرا خطاب جیتا، آرسنل، روما، ہیبے چائنا فارچیون، پارما اور ترابزون سپور کے لیے کھیلے — آخری ٹیم کے ساتھ 2021–22 میں ترک سپر لیگ جیتی — اور آئیوری کوسٹ کے لیے 80 سے زائد میچوں میں 23 گول کیے اور 2015 افریقہ کپ آف نیشنز جیتا۔"
  es: "Exfutbolista marfileño, nacido en Anyama, Costa de Marfil, en 1987. Delantero que ganó la liga y la copa francesas con el Lille en la temporada 2010-11, jugó en el Arsenal, la Roma, el Hebei China Fortune, el Parma y el Trabzonspor —ganando la Süper Lig turca con este último en la temporada 2021-22— y disputó más de 80 partidos con la selección de Costa de Marfil, anotando 23 goles y levantando la Copa Africana de Naciones de 2015."
  fr: "Ancien footballeur ivoirien, né à Anyama, en Côte d'Ivoire, en 1987. Attaquant, il a réalisé le doublé championnat-coupe de France avec Lille en 2010-2011, a joué pour Arsenal, la Roma, Hebei China Fortune, Parme et Trabzonspor — remportant la Süper Lig turque avec ce dernier club en 2021-2022 — et a été sélectionné plus de 80 fois en équipe nationale de Côte d'Ivoire, marquant 23 buts et remportant la Coupe d'Afrique des Nations 2015."
  tr: "1987'de Fildişi Sahili, Anyama'da doğmuş, emekli bir Fildişi Sahili futbolcu. 2010–11 sezonunda Fransa'da Lille ile lig ve kupa çifti kazanan bir forvet, Arsenal, Roma, Çin'in Hebei, Parma ve Trabzonspor'da oynadı; 2021–22 sezonunda Türk ligini kazandı. Fildişi Sahili milli takımıyla 80'den fazla maçta 23 gol attı ve 2015 Afrika Uluslar Kupası'nı kazandı."
  id: "Seorang mantan pesepakbola Pantai Gading, lahir di Anyama, Pantai Gading, pada tahun 1987. Seorang penyerang yang memenangkan liga dan piala ganda bersama Lille di Prancis pada musim 2010–11, dan bermain untuk Arsenal, Roma, Hebei dari China, Parma, dan Trabzonspor, di mana ia memenangkan liga Turki pada musim 2021–22. Ia bermain lebih dari 80 pertandingan bersama tim nasional Pantai Gading, mencetak 23 gol, dan memenangkan Piala Afrika 2015."
