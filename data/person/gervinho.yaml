summary:
  ar: "لاعب كرة قدم عاجي معتزل، وُلد في أنياما بساحل العاج سنة 1987. مهاجم فاز مع ليل بثنائية الدوري والكأس في فرنسا 2010–11، ولعب لأرسنال وروما وخبي الصين وبارما وطرابزون سبور الذي فاز معه بالدوري التركي 2021–22، وخاض أكثر من 80 مباراة مع منتخب ساحل العاج سجل فيها 23 هدفًا وفاز بكأس أمم أفريقيا 2015."
  en: "Ivorian retired footballer, born in Anyama, Ivory Coast in 1987. A forward who won the French league-and-cup double with Lille in 2010–11, played for Arsenal, Roma, Hebei China Fortune, Parma and Trabzonspor — winning the Turkish Süper Lig with the last in 2021–22 — and won over 80 caps for Ivory Coast, scoring 23 goals and lifting the 2015 Africa Cup of Nations."
  ur: "آئیوریائی ریٹائرڈ فٹبالر، 1987 میں آئیوری کوسٹ کے انیاما میں پیدا ہوئے۔ فارورڈ جنہوں نے لیل کے ساتھ 2010–11 میں فرانسیسی لیگ اور کپ کا دوہرا خطاب جیتا، آرسنل، روما، ہیبے چائنا فارچیون، پارما اور ترابزون سپور کے لیے کھیلے — آخری ٹیم کے ساتھ 2021–22 میں ترک سپر لیگ جیتی — اور آئیوری کوسٹ کے لیے 80 سے زائد میچوں میں 23 گول کیے اور 2015 افریقہ کپ آف نیشنز جیتا۔"
