summary:
  ar: "عازف سرود هندي (1888–1972)، وُلد في غواليور لأسرة بانغاش من عازفي السرود وتعلّم على يد وزير خان في رامبور. اشتهر بجمال عزفه الغنائي ونقاء صوت آله، وكان موسيقيَّ بلاطٍ في غواليور قبل أن تستقطبه مهرجانات البنغال ورعاة كلكتا، ونال وسام بادما بهوشان سنة 1960."
  en: "Indian sarod player (1888–1972), born at Gwalior into the Bangash line of sarod players and trained under Wazir Khan of Rampur. Known for the lyrical beauty and crystal-clear tone of his playing, he was a court musician at Gwalior, performed at Bengal's great festivals and taught there, and received the Padma Bhushan in 1960."
  ur: "ہندوستانی سرود نواز (1888ء–1972ء)، گوالیار میں سرود نوازوں کے بنگش خاندان میں پیدا ہوئے اور رام پور کے وزیر خان سے تعلیم پائی۔ ان کے لَے دار اور شفاف عزف کی شہرت دور دور تک تھی؛ وہ گوالیار کے درباری موسیقار رہے، بنگال کی محفلوں میں عزف کیا اور 1960ء میں پدما بھوشن سے نوازے گئے۔"
