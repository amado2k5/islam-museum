summary:
  ar: "لاعبة تايكوندو تركية، وُلدت في وان سنة 1992. بطلة عالم وأوروبا، وصاحبة فضية وزن 67 كغ في أولمبياد لندن 2012 وذهبية ألعاب البحر الأبيض المتوسط 2013. تزوّجت سنة 2017 من لاعب التايكوندو الإيراني السابق مهران عسكري، وتُعرف أيضًا باسم نور تاتار عسكري."
  en: "Turkish taekwondo practitioner, born in Van in 1992. A world and European champion, she won silver at 67 kg at the London 2012 Olympics and gold at the 2013 Mediterranean Games. She married the former Iranian taekwondo practitioner Mehran Askari in 2017 and is also known as Nur Tatar Askari."
  ur: "ترک تائیکوانڈو کھلاڑی، جو 1992 میں وان میں پیدا ہوئیں۔ عالمی اور یورپی چیمپئن، لندن 2012 اولمپکس میں 67 کلوگرام کی چاندی اور 2013 بحیرہ روم کھیلوں کا طلائی تمغہ جیتا۔ 2017 میں سابق ایرانی تائیکوانڈو کھلاڑی مہران عسکری سے شادی کے بعد وہ نور تاتار عسکری کے نام سے بھی جانی جاتی ہیں۔"
  es: "Practicante turca de taekwondo, nacida en Van en 1992. Campeona mundial y europea, ganó la medalla de plata en la categoría de 67 kg en los Juegos Olímpicos de Londres 2012 y la de oro en los Juegos Mediterráneos de 2013. Se casó con el ex practicante iraní de taekwondo Mehran Askari en 2017 y también es conocida como Nur Tatar Askari."
  fr: "Pratiquante de taekwondo turque, née à Van en 1992, elle est championne du monde et d'Europe. Elle a remporté la médaille d'argent dans la catégorie des 67 kg aux Jeux olympiques de Londres en 2012 et la médaille d'or aux Jeux méditerranéens de 2013. Mariée à l'ancien pratiquant iranien de taekwondo Mehran Askari en 2017, elle est également connue sous le nom de Nur Tatar Askari."
  tr: "1992 Van doğumlu Türk taekwondo oyuncusu. Dünya ve Avrupa şampiyonu, 2012 Londra Olimpiyatları'nda 67 kg kategorisinde gümüş madalya ve 2013 Akdeniz Oyunları'nda altın madalya kazandı. 2017'de eski İranlı taekwondo sporcusu Mehran Askari (diğer adıyla Noor Tatar Askari) ile evlendi."
  id: "Seorang pemain taekwondo Turki, lahir di Van pada tahun 1992. Juara dunia dan Eropa, peraih medali perak kategori 67 kg di Olimpiade London 2012, dan peraih medali emas di Olimpiade Mediterania 2013. Pada tahun 2017, ia menikah dengan mantan atlet taekwondo Iran, Mehran Askari, yang juga dikenal sebagai Noor Tatar Askari."
