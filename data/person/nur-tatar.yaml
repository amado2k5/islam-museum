summary:
  ar: "لاعبة تايكوندو تركية، وُلدت في وان سنة 1992. بطلة عالم وأوروبا، وصاحبة فضية وزن 67 كغ في أولمبياد لندن 2012 وذهبية ألعاب البحر الأبيض المتوسط 2013. تزوّجت سنة 2017 من لاعب التايكوندو الإيراني السابق مهران عسكري، وتُعرف أيضًا باسم نور تاتار عسكري."
  en: "Turkish taekwondo practitioner, born in Van in 1992. A world and European champion, she won silver at 67 kg at the London 2012 Olympics and gold at the 2013 Mediterranean Games. She married the former Iranian taekwondo practitioner Mehran Askari in 2017 and is also known as Nur Tatar Askari."
  ur: "ترک تائیکوانڈو کھلاڑی، جو 1992 میں وان میں پیدا ہوئیں۔ عالمی اور یورپی چیمپئن، لندن 2012 اولمپکس میں 67 کلوگرام کی چاندی اور 2013 بحیرہ روم کھیلوں کا طلائی تمغہ جیتا۔ 2017 میں سابق ایرانی تائیکوانڈو کھلاڑی مہران عسکری سے شادی کے بعد وہ نور تاتار عسکری کے نام سے بھی جانی جاتی ہیں۔"
