summary:
  ar: "شاعر وكاتب وموسيقي بنغالي (1899–1976)، لُقّب بـ«الشاعر المتمرد» بعد قصيدته «بيدروهي» (المتمرد) سنة 1922، وهو الشاعر الوطني لبنغلاديش. وُلد في تشوروليا بالبنغال، وتلقى تعليمًا دينيًا وعمل مؤذنًا، وخدم في الجيش البريطاني الهندي، ثم صار صحفيًا في كلكتا حارب الاستعمار بقلمه وسُجن بتهمة التحريض. كتب وغنّى ما يقارب أربعة آلاف أغنية عُرفت بـ«نذر الغيتي»، وفقد صوته وذاكرته بمرض عضال من سنة 1942، وانتقل إلى دكا سنة 1972 وتوفي فيها سنة 1976."
  en: "Bengali poet, writer and musician (1899–1976), titled the 'Rebel Poet' after his 1922 poem 'Bidrohi' (The Rebel), and national poet of Bangladesh. Born at Churulia in Bengal, he received religious education and worked as a muezzin, served in the British Indian Army, then became a journalist in Calcutta who attacked colonial rule and was jailed for sedition. He wrote and composed nearly 4,000 songs known as Nazrul Geeti, lost his voice and memory to an incurable illness from 1942, moved to Dhaka in 1972, and died there in 1976."
  ur: "بنگالی شاعر، ادیب اور موسیقار (1899ء–1976ء)، جنھیں ان کی 1922 کی نظم «بیدروہی» (باغی) کے بعد «باغی شاعر» کہا گیا، اور وہ بنگلہ دیش کے قومی شاعر ہیں۔ چورولیا میں پیدا ہوئے، دینی تعلیم پائی اور مؤذن رہے، برطانوی ہندوستانی فوج میں خدمات انجام دیں، پھر کلکتہ میں صحافی بن کر نوآبادیاتی راج کے خلاف لکھا اور بغاوت کے الزام میں قید ہوئے۔ انھوں نے تقریباً چار ہزار گیت لکھے اور ترتیب دیے جو «نذرل گیتی» کہلاتے ہیں، 1942 سے لاعلاج بیماری میں آواز اور حافظہ کھو بیٹھے، 1972 میں ڈھاکہ منتقل ہوئے اور 1976 میں وہیں وفات پائی۔"
