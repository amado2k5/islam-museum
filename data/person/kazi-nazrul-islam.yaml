summary:
  ar: "شاعر وكاتب وموسيقي بنغالي (1899–1976)، لُقّب بـ«الشاعر المتمرد» بعد قصيدته «بيدروهي» ⁦(المتمرد)⁩ سنة 1922، وهو الشاعر الوطني لبنغلاديش. وُلد في تشوروليا بالبنغال، وتلقى تعليمًا دينيًا وعمل مؤذنًا، وخدم في الجيش البريطاني الهندي، ثم صار صحفيًا في كلكتا حارب الاستعمار بقلمه وسُجن بتهمة التحريض. كتب وغنّى ما يقارب أربعة آلاف أغنية عُرفت بـ«نذر الغيتي»، وفقد صوته وذاكرته بمرض عضال من سنة 1942، وانتقل إلى دكا سنة 1972 وتوفي فيها سنة 1976."
  en: "Bengali poet, writer and musician (1899–1976), titled the 'Rebel Poet' after his 1922 poem 'Bidrohi' (The Rebel), and national poet of Bangladesh. Born at Churulia in Bengal, he received religious education and worked as a muezzin, served in the British Indian Army, then became a journalist in Calcutta who attacked colonial rule and was jailed for sedition. He wrote and composed nearly 4,000 songs known as Nazrul Geeti, lost his voice and memory to an incurable illness from 1942, moved to Dhaka in 1972, and died there in 1976."
  ur: "بنگالی شاعر، ادیب اور موسیقار ⁦(1899ء–1976ء)⁩، جنھیں ان کی 1922 کی نظم «بیدروہی» ⁦(باغی)⁩ کے بعد «باغی شاعر» کہا گیا، اور وہ بنگلہ دیش کے قومی شاعر ہیں۔ چورولیا میں پیدا ہوئے، دینی تعلیم پائی اور مؤذن رہے، برطانوی ہندوستانی فوج میں خدمات انجام دیں، پھر کلکتہ میں صحافی بن کر نوآبادیاتی راج کے خلاف لکھا اور بغاوت کے الزام میں قید ہوئے۔ انھوں نے تقریباً چار ہزار گیت لکھے اور ترتیب دیے جو «نذرل گیتی» کہلاتے ہیں، 1942 سے لاعلاج بیماری میں آواز اور حافظہ کھو بیٹھے، 1972 میں ڈھاکہ منتقل ہوئے اور 1976 میں وہیں وفات پائی۔"
  es: "Poeta, escritor y músico bengalí (1899-1976), apodado el «Poeta Rebelde» por su poema de 1922 «Bidrohi» (El Rebelde), fue poeta nacional de Bangladés. Nacido en Churulia, Bengala, recibió educación religiosa y trabajó como muecín. Sirvió en el ejército británico de la India y posteriormente se convirtió en periodista en Calcuta, donde criticó el dominio colonial y fue encarcelado por sedición. Escribió y compuso cerca de 4000 canciones conocidas como Nazrul Geeti. Perdió la voz y la memoria a causa de una enfermedad incurable a partir de 1942. Se trasladó a Daca en 1972 y falleció allí en 1976."
  fr: "Poète, écrivain et musicien bengali (1899-1976), surnommé le « Poète rebelle » après son poème « Bidrohi » (Le Rebelle) de 1922, il fut le poète national du Bangladesh. Né à Churulia, au Bengale, il reçut une éducation religieuse et exerça la fonction de muezzin. Après avoir servi dans l'armée britannique des Indes, il devint journaliste à Calcutta, où il dénonça le pouvoir colonial et fut emprisonné pour sédition. Auteur de près de 4 000 chansons connues sous le nom de Nazrul Geeti, il perdit la voix et la mémoire des suites d'une maladie incurable à partir de 1942. Il s'installa à Dacca en 1972, où il mourut en 1976."
  tr: "Bengalli bir şair, yazar ve müzisyen (1899–1976), 1922'de 'Pedruhi' (İsyancı) adlı şiirinden dolayı 'Asi Şair' lakabını almış ve Bangladeş'in ulusal şairidir. Bengal'in Chorulia kentinde doğdu, dini eğitim aldı, müezzin olarak çalıştı, Britanya Hindistan Ordusu'nda görev yaptı, ardından Kalküta'da gazeteci oldu, kalemiyle sömürgecilikle savaştı ve provokasyon suçlamasıyla hapse atıldı. 'Nazar al-Geeti' olarak bilinen yaklaşık dört bin şarkı yazıp söyledi, 1942'de ölümcül bir hastalık nedeniyle sesini ve hafızasını kaybetti, 1972'de Dakka'ya taşındı ve 1976'da orada vefat etti."
  id: "Seorang penyair, penulis, dan musisi Bengali (1899–1976), dijuluki 'Penyair Pemberontak' berdasarkan puisinya 'Pedruhi' (Sang Pemberontak) pada tahun 1922, ia adalah penyair nasional Bangladesh. Ia lahir di Chorulia, Bengal, menerima pendidikan agama, bekerja sebagai muezzin, bertugas di Angkatan Darat India Inggris, kemudian menjadi jurnalis di Calcutta, melawan kolonialisme dengan pena miliknya, dan dipenjara atas tuduhan hasutan. Ia menulis dan menyanyikan hampir empat ribu lagu yang dikenal sebagai 'Nazar al-Geeti', kehilangan suara dan ingatan akibat penyakit terminal pada tahun 1942, pindah ke Dhaka pada tahun 1972, dan meninggal di sana pada tahun 1976."
