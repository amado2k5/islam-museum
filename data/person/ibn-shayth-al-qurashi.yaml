id: person/ibn-shayth-al-qurashi
class: person
label: { ar: "ابن شيث القرشي وزير المعظم" }
summary:
  ar: "ابن شيث القرشي جمع الله له بين الفضل والمروءة والكرم والفتوة؛ كان كثير الصدقات وكان القاضي الفاضل يحتاج إليه في علم الرسائل؛ كتب إليه أبو المظفر الندنجي كتاباً يتشوق إليه؛ تولى الوزارة للملك المعظم بالشام ونشأ بقوص ومات بدمشق سنة خمس وعشرين وستمائة ودفن بتربته بقاسيون {cite:shadharat-dhahab p. 117}."
  en: "Ibn Shayth al-Qurashi — in whom excellence, chivalry, generosity and futuwwa met; al-Qadi al-Fadil himself needed him for the chancery art; raised at Qus, he served as al-Mu'azzam's wazir in Damascus and died there in 625, buried in his own turba on Qasyun {cite:shadharat-dhahab p. 117}."
  es: "Ibn Shayth al-Qurashi —en quien se unieron la excelencia, la caballerosidad, la generosidad y la futuwwa; el propio al-Qadi al-Fadil lo necesitó para el arte de la cancillería; criado en Qus, sirvió como visir de al-Mu'azzam en Damasco y murió allí en 625, enterrado con su propia turba en Qasyun {cite:shadharat-dhahab p. 117}."
  fr: "Ibn Shayth al-Qurashi — en qui l'excellence, la chevalerie, la générosité et la futuwwa se rencontraient; al-Qadi al-Fadil lui-même avait besoin de lui pour l'art de la chancellerie; élevé à Qus, il servit comme vizir d'al-Mu'azzam à Damas et y mourut en 625, enterré dans sa propre turba sur Qasyun {cite:shadharat-dhahab p. 117}."
  ur: "ابن شیث القرشی - جن میں فضیلت، شجاعت، سخاوت اور فتوحات پائی جاتی تھیں۔ خود القادی الفاضل کو چانسری آرٹ کے لیے اس کی ضرورت تھی۔ قس میں پرورش پائی، اس نے دمشق میں المعظم کے وزیر کے طور پر خدمات انجام دیں اور وہیں 625 میں وفات پائی، قصیون میں اپنے ہی تربہ میں دفن ہوئے۔ 117}۔"
