summary:
  ar: "ابن شيث القرشي جمع الله له بين الفضل والمروءة والكرم والفتوة؛ كان كثير الصدقات وكان القاضي الفاضل يحتاج إليه في علم الرسائل؛ كتب إليه أبو المظفر الندنجي كتاباً يتشوق إليه؛ تولى الوزارة للملك المعظم بالشام ونشأ بقوص ومات بدمشق سنة خمس وعشرين وستمائة ودفن بتربته بقاسيون {cite:shadharat-dhahab p. 117}."
  en: "Ibn Shayth al-Qurashi — in whom excellence, chivalry, generosity and futuwwa met; al-Qadi al-Fadil himself needed him for the chancery art; raised at Qus, he served as al-Mu'azzam's wazir in Damascus and died there in 625, buried in his own turba on Qasyun {cite:shadharat-dhahab p. 117}."
