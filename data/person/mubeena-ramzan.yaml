  ar: "مربّية وناشطة اجتماعية كشميرية من سوپور. تدير جامعة الإسلامية مهدة المسلمات ⁦(Jamia Islamia Mahdul Muslimat)⁩ لتعليم البنات والنساء في سوپور وسرينغر، وترأس جمعية أنصار النساء الاجتماعية الدينية."
  en: "Kashmiri educator and social worker from Sopore. She runs Jamia Islamia Mahdul Muslimat, a seminary educating girls and women in Sopore and Srinagar, and heads Ansar un Nisa, a socio-religious organisation for women."
  ur: "سوپور سے تعلق رکھنے والی کشمیری مربیہ اور سماجی کارکن۔ وہ لڑکیوں اور خواتین کے لیے سوپور اور سری نگر میں جامعہ اسلامیہ مہد المسلمات چلاتی ہیں اور خواتین کی سماجی مذہبی تنظیم انصار النساء کی سربراہ ہیں۔"
  es: "Educadora y trabajadora social cachemir de Sopore. Dirige Jamia Islamia Mahdul Muslimat, un seminario que educa a niñas y mujeres en Sopore y Srinagar, y encabeza Ansar un Nisa, una organización sociorreligiosa para mujeres."
  fr: "Éducatrice et travailleuse sociale cachemirienne originaire de Sopore, elle dirige Jamia Islamia Mahdul Muslimat, un séminaire qui éduque les filles et les femmes à Sopore et Srinagar, et est à la tête d'Ansar un Nisa, une organisation socio-religieuse pour les femmes."
  tr: "Sopore doğumlu bir Keşmirli eğitimci ve sosyal aktivisttir. Sopore ve Srinagar'da kız ve kadınların eğitimi için Jamia Islamia Mahdul Muslimat'ı (Jamia Islamia Mahdul Muslimat) yönetmekte ve Sosyal Dini Kadınlar Ansar Derneği'nin başkanlığını yürütmektedir."
  id: "Seorang pendidik dan aktivis sosial dari Kashmir dari Sopore. Ia mengelola Jamia Islamia Mahdul Muslimat (Jamia Islamia Mahdul Muslimat) untuk mendidik anak perempuan dan perempuan di Sopore dan Srinagar, serta memimpin Asosiasi Ansar Perempuan Sosial Beragama."
