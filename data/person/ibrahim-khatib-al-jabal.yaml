summary:
  ar: "خطيب الجبل الزاهد؛ سمع من العماد والشيخ موفق الدين وأبي اليمن الكندي وأبي القاسم بن الهرستاني وخلق، وكان إماماً في العلم والعمل بصيراً بالمذهب صالحاً عابداً زاهداً مخلصاً صاحب أحوال وكرامات، وأمر بالمعروف قوالاً بالحق؛ وقد جمع المحدث أبو الفداء بن الخباز سيرته في مجلد وحدث وسمع منه جماعة منهم أبو العباس الحيري وهو آخر أصحابه؛ توفي في تاسع عشر ربيع الأول ودفن بسفح قاسيون، وهو والد الإمامين عز الدين الفرائضي وعز الدين محمد خطيب الجامع المظفري {cite:shadharat-dhahab p. 560-561}."
  en: "The ascetic khatib of the Salihiyya mountain (b. 606) — 'an imam in knowledge and deed, an enjoiner of right, a speaker of truth'; Ibn al-Khabbaz collected his sira in a volume; father of the two Izz al-Dins; d. 19 Rabi' I 666, buried at Qasyun's foot {cite:shadharat-dhahab p. 560-561}."
