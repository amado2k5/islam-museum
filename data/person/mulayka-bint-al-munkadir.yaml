summary:
  ar: "عابدة من أهل المدينة يذكرها ابن الجوزي في «صفة الصفوة» أول المعروفات من عابدات المدينة؛ يروي عن مالك بن دينار أنه رآها في الحِجر تدعو، فلما عرضا عليها الزواج عاتبت مالكاً وأيوب السختياني على انشغالهما بمحادثة النساء عن ذكر الله، وكانت تقول لمن كلمها في تخفيف العبادة: دعوني أبادر طيّ صحيفتي."
  en: "A devout woman of Medina whom Ibn al-Jawzi places first among the known devout women of Medina in Sifat al-Safwa; he reports from Malik ibn Dinar that he saw her praying in the Hijr, and when marriage was suggested she reproached him and Ayyub al-Sakhtiyani for letting conversation with women distract them from remembrance of God; to those who urged her to lighten her worship she said: let me hasten before my record is rolled up."
  es: "Una mujer devota de Medina a quien Ibn al-Jawzi sitúa en primer lugar entre las mujeres devotas conocidas de Medina en Sifat al-Safwa; relata de Malik ibn Dinar que la vio rezando en el Hijr, y cuando se le propuso matrimonio, ella lo reprendió a él y a Ayyub al-Sakhtiyani por dejar que la conversación con mujeres los distrajera del recuerdo de Dios; a quienes la instaron a aligerar su culto, ella dijo: déjenme apresurarme antes de que mi registro sea enrollado."
  fr: "Une femme pieuse de Médine qu'Ibn al-Jawzi place en tête des femmes pieuses connues de Médine dans le Sifat al-Safwa; il rapporte de Malik ibn Dinar qu'il l'a vue prier dans l'Hégire, et lorsqu'on lui a suggéré le mariage, elle lui a reproché, ainsi qu'à Ayyub al-Sakhtiyani, de se laisser distraire par la conversation avec les femmes et de ne plus se souvenir de Dieu; à ceux qui l'exhortaient à alléger sa dévotion, elle a dit: « Laissez-moi me hâter avant que mon registre ne soit enroulé. »"
  ur: "مدینہ کی ایک متقی عورت جسے ابن الجوزی نے سیفۃ الصفوی میں مدینہ کی معروف متقی خواتین میں سب سے پہلے رکھا ہے۔ وہ مالک بن دینار سے روایت کرتے ہیں کہ انہوں نے ہجرت میں انہیں نماز پڑھتے ہوئے دیکھا، اور جب نکاح کا مشورہ دیا گیا تو اس نے انہیں اور ایوب السختیانی کو ملامت کی کہ عورتوں کے ساتھ گفتگو انہیں خدا کے ذکر سے غافل کر دیتی ہے۔ جن لوگوں نے اسے اپنی عبادت ہلکی کرنے کی ترغیب دی اس نے کہا: مجھے جلدی کرنے دو اس سے پہلے کہ میرا ریکارڈ لپیٹ دیا جائے۔"
