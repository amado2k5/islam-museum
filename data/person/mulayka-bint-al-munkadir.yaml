summary:
  ar: "عابدة من أهل المدينة يذكرها ابن الجوزي في «صفة الصفوة» أول المعروفات من عابدات المدينة؛ يروي عن مالك بن دينار أنه رآها في الحِجر تدعو، فلما عرضا عليها الزواج عاتبت مالكاً وأيوب السختياني على انشغالهما بمحادثة النساء عن ذكر الله، وكانت تقول لمن كلمها في تخفيف العبادة: دعوني أبادر طيّ صحيفتي."
  en: "A devout woman of Medina whom Ibn al-Jawzi places first among the known devout women of Medina in Sifat al-Safwa; he reports from Malik ibn Dinar that he saw her praying in the Hijr, and when marriage was suggested she reproached him and Ayyub al-Sakhtiyani for letting conversation with women distract them from remembrance of God; to those who urged her to lighten her worship she said: let me hasten before my record is rolled up."
