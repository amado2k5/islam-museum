summary:
  ar: "داعية ماليزي مستقل ومقدّم ومحاضر تحفيزي، وُلد في 3 أغسطس 1977 في جمبول بولاية نغري سمبيلان، اشتهر ببرامجه الدينية على قناة الهجرة وفي مقدمتها برنامج يحمل اسمه. خاض انتخابات 2018 مرشحًا لتحالف باريسان ناسيونال في مقعد سيكامات الولائي فخسر أمام أمين الدين هارون، ثم أعلن تركه جميع مناصبه في حزب أمنو في مايو 2018 مع بقائه عضوًا فيه بحسب التقارير. بلغت قناته في يوتيوب 428,000 مشترك وحسابه الموثّق في إنستغرام 459,917 متابعًا بحسب قراءات 15 نوفمبر 2026."
  en: "Malaysian freelance preacher, host and motivational speaker, born on 3 August 1977 at Jempol, Negeri Sembilan, known for his religious programmes on TV AlHijrah, above all the programme bearing his name. He stood in the 2018 election as the Barisan Nasional candidate for the Sikamat state seat and lost to Aminuddin Harun, then announced in May 2018 that he was giving up all his UMNO posts while remaining a member, as reported. His YouTube channel counted 428,000 subscribers and his verified Instagram 459,917 followers in reads of 15 November 2026."
  ur: "ملائیشیا کے آزاد مبلغ، میزبان اور تحریکی مقرر، جو 3 اگست 1977ء کو نگری سمبیلان کے جمپول میں پیدا ہوئے، ٹی وی الہجرہ پر اپنے دینی پروگراموں، خصوصاً اپنے نام کے پروگرام، کے لیے جانے جاتے ہیں۔ وہ 2018ء کے انتخابات میں سیکامت کی ریاستی نشست پر باریسن ناسیونال کے امیدوار بنے اور امین الدین ہارون سے ہار گئے، پھر مئی 2018ء میں اعلان کیا کہ وہ UMNO کے تمام عہدے چھوڑ رہے ہیں جبکہ رکنیت برقرار رہے گی، جیسا کہ رپورٹ ہوا۔ 15 نومبر 2026ء کی قرأت کے مطابق ان کے یوٹیوب چینل کے سبسکرائبر 428,000 اور مصدقہ انسٹاگرام فالوور 459,917 تھے۔"
  es: "Predicador, presentador y orador motivacional independiente malasio, nacido el 3 de agosto de 1977 en Jempol, Negeri Sembilan, conocido por sus programas religiosos en TV AlHijrah, sobre todo el programa que lleva su nombre. Se presentó a las elecciones de 2018 como candidato del Barisan Nasional para el escaño estatal de Sikamat y perdió ante Aminuddin Harun. En mayo de 2018 anunció que renunciaba a todos sus cargos en la UMNO, aunque seguía siendo miembro, según se informó. Su canal de YouTube contaba con 428.000 suscriptores y su cuenta verificada de Instagram con 459.917 seguidores al 15 de noviembre de 2026."
