gender: female
roles: [poet]
summary:
  ar: "امرأة من هلال موصوفة بالشجاعة والفصاحة والشعر، ناصرت علي بن أبي طالب يوم صفين بخطب وأشعار، ثم وفدت على معاوية في كبرها، فذكّره مروان وعمرو بن العاص وسعيد بأشعارها؛ يروي خبرها كحالة عن بلاغات النساء."
  en: "A woman of Hilal known for courage, eloquence and verse, who supported Ali ibn Abi Talib at Siffin with speeches and poems and in old age came before Mu'awiya, where Marwan, Amr ibn al-As and Sa'id recited her verses against him; Kahhala tells her story from Balaghat al-Nisa'."
  ur: "قبیلہ ہلال کی ایک خاتون جو بہادری، فصاحت اور شاعری میں مشہور تھیں؛ صفین میں خطبوں اور اشعار سے علی بن ابی طالب کی حمایت کی اور بڑھاپے میں معاویہ کے پاس آئیں، جہاں مروان، عمرو بن العاص اور سعید نے ان کے اشعار یاد دلائے؛ کحالہ بلاغات النساء سے ان کا واقعہ نقل کرتے ہیں۔"
