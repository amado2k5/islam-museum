summary:
  ar: "أبو بكر سلمة بن عبد الله الهذلي، بصري عالم بأيام العرب وأخبارها وأحد أصحاب الحديث؛ ترجمته في «الوافي بالوفيات» للصفدي، وفيها وفاته سنة 159 هـ."
  en: "Abu Bakr Salama ibn Abdallah al-Hudhali, a Basran scholar of the Arabs' days and accounts and a hadith transmitter; his entry is in al-Safadi's al-Wafi, which gives his death as 159 AH."
  fr: "Abu Bakr Salama ibn Abdallah al-Hudhali, savant basrien des journées et des récits des Arabes et transmetteur de hadith ; sa notice figure dans al-Wafi d'al-Safadi, qui donne sa mort en 159 H."
  es: "Abu Bakr Salama ibn Abdallah al-Hudhali, un erudito de Basora especializado en los tiempos y relatos de los árabes y transmisor de hadices; su entrada se encuentra en el al-Wafi de al-Safadi, que sitúa su muerte en el año 159 de la Hégira."
  ur: "ابو بکر سلمہ بن عبداللہ الحضلی، عربوں کے ایام و احوال کے بصری عالم اور حدیث کی ترسیل کرنے والے؛ ان کا اندراج الصفدی کی الوافی میں ہے جس میں ان کی وفات 159ھ بتائی گئی ہے۔"
  tr: "Basra'lı bir Arap âlimi ve hadis sahabelerinden biri olan Ebu Bekir Salama bin Abdullah el-Hudali'nin biyografisi, Safadi'nin \"El-Vafi bil-Vafayat\" adlı eserinde yer almakta olup, ölümünün Hicri 159 yılında gerçekleştiği kaydedilmiştir."
  id: "Abu Bakr Salama bin Abdullah Al-Hudhali, seorang ulama Basra yang ahli dalam sejarah dan perkembangan bangsa Arab serta salah satu sahabat hadits; biografinya terdapat dalam kitab “Al-Wafi bil-Wafayat” karya Al-Safadi, di mana kematiannya tercatat terjadi pada tahun 159 Hijriah."
