summary:
  ar: "عالم وكاتب وصحفي إندونيسي، وُلد سنة 1908 وتوفي سنة 1981، كان أول رئيس لمجلس علماء إندونيسيا وقياديًا في جمعية المحمدية، وألّف أكثر من مئة كتاب، أشهرها تفسيره للقرآن «تفسير الأزهر» وروايته «غرق سفينة فان دير ويك»."
  en: "Indonesian scholar, writer and journalist, born in 1908 and died in 1981; first chairman of the Indonesian Ulema Council and a leader of Muhammadiyah, he wrote more than one hundred books, most famously his Qur'an commentary Tafsir Al-Azhar and the novel Tenggelamnya Kapal van der Wijck (The Sinking of the van der Wijck)."
  ur: "انڈونیشیائی عالم، ادیب اور صحافی، جو 1908 میں پیدا ہوئے اور 1981 میں وفات پائی؛ مجلس علمائے انڈونیشیا کے پہلے صدر اور محمدیہ کے رہنما، انہوں نے سو سے زائد کتابیں لکھیں، جن میں قرآن کی تفسیر «تفسیر الازہر» اور ناول «تینگگیلامنیا کاپال فان دیر ویک» مشہور ہیں۔"
