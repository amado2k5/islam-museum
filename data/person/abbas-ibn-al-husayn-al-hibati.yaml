label: { ar: "عباد بن الحصين الحبطي", en: "Abbas ibn al-Husayn al-Hibati" }
summary:
  ar: "عباد بن الحصين الحبطي؛ أخبر حمران بن أبان بقول الحجاج لئن انتمى إلى العرب ولم يقل إن أباه أبي وإنه مولى لعثمان لأضربن عنقه فوهب له حمران غربي النهر الذي صار عبادان وهو أول من رابط بها وكان قبل ذلك على شرطة عبد الرحمن بن سمرة في فتح كابل فبات ليلة يطاعن المشركين حتى أصبح وكان الحسن البصري يقول ما ظننت أن رجلاً يقوم مقام ألف حتى رأيت عباد بن الحصين."
  en: "Abbas ibn al-Husayn al-Hibati; he warned Humran ibn Aban of al-Hajjaj's threat — 'if he claims Arab descent and won't own his father and his fiefdom to Uthman, I'll strike his neck' — so Humran gifted him the west bank that became Abbadan, whose first garrisoner he was. Before that he held Ibn Samura's shurta at Kabul — a whole night spearing the foe till dawn; al-Hasan: I never thought one man could stand for a thousand until I saw Abbad ibn al-Husayn."
