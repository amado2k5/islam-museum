summary:
  ar: "عباد بن الحصين الحبطي؛ أخبر حمران بن أبان بقول الحجاج لئن انتمى إلى العرب ولم يقل إن أباه أبي وإنه مولى لعثمان لأضربن عنقه فوهب له حمران غربي النهر الذي صار عبادان وهو أول من رابط بها."
  en: "Abbas ibn al-Husayn al-Hibati; he warned Humran ibn Aban of al-Hajjaj's threat — 'if he claims Arab descent and won't own his father and his fiefdom to Uthman, I'll strike his neck' — so Humran gifted him the west bank that became Abbadan, whose first garrisoner he was."
