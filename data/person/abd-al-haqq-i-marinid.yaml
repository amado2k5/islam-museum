summary:
  ar: "عبد الحق بن محيو بن أبي بكر بن حمامة المريني، أبو محمد، مؤسس الدولة المرينية في المغرب الأقصى، ولد في الزاب وانتقل بقومه إلى المغرب سنة 610 هـ وظفر على الموحدين سنة 613 هـ، وقتل في معركة قرب وادي سبوا سنة 614 هـ ⁦(1217 م)⁩."
  en: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hamama al-Marini, Abu Muhammad, founder of the Marinid state in the far Maghreb; born in the Zab, he moved his people into the Maghreb in 610 AH, defeated the Almohads in 613 AH and was killed in a battle near Wadi Sabu in 614 AH (1217 CE)."
