roles: [ruler]
gender: male
summary:
  ar: "عبد الحق بن محيو بن أبي بكر بن حمامة المريني، أبو محمد، مؤسس الدولة المرينية في المغرب الأقصى، ولد في الزاب وانتقل بقومه إلى المغرب سنة 610 هـ وظفر على الموحدين سنة 613 هـ، وقتل في معركة قرب وادي سبوا سنة 614 هـ ⁦(1217 م)⁩."
  en: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hamama al-Marini, Abu Muhammad, founder of the Marinid state in the far Maghreb; born in the Zab, he moved his people into the Maghreb in 610 AH, defeated the Almohads in 613 AH and was killed in a battle near Wadi Sabu in 614 AH (1217 CE)."
  fr: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hamama al-Marini, Abu Muhammad, fondateur de l'État mérinide dans l'extrême Maghreb ; né dans le Zab, il conduisit son peuple dans le Maghreb en 610 H, vainquit les Almohades en 613 H et fut tué dans une bataille près de l'oued Sebou en 614 H (1217 ap. J.-C.)."
  es: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hamama al-Marini, Abu Muhammad, fundador del estado mariní en el Magreb lejano; nacido en el Zab, trasladó a su pueblo al Magreb en el año 610 AH, derrotó a los almohades en el año 613 AH y murió en una batalla cerca de Wadi Sabu en el año 614 AH (1217 d. C.)."
  ur: "عبد الحق بن ماہیو ابن ابی بکر بن حمامہ المرینی، ابو محمد، دور مغرب میں مرینی ریاست کے بانی؛ زاب میں پیدا ہوئے، اس نے اپنی قوم کو 610 ہجری میں مغرب میں منتقل کیا، 613 ہجری میں المحدث کو شکست دی اور 614 ہجری ⁦(1217 عیسوی)⁩ میں وادی صابو کے قریب ایک جنگ میں مارا گیا۔"
  tr: "Fas'ın en batısındaki Marinid devletinin kurucusu Abdülhakk ibn Mahyu ibn Abi Bekr ibn Hamama el-Marini, Ebu Muhammed, Zab'da doğdu ve halkıyla birlikte Hicri 610 yılında Fas'a göç etti. Hicri 613 yılında Almohadlara karşı zafer kazandı ve Hicri 614 yılında (1217 MS) Vadi Sebu yakınlarında bir savaşta öldürüldü."
  id: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hamama al-Marini, Abu Muhammad, pendiri negara Marinid di ujung barat Maroko, lahir di Zab dan pindah bersama kaumnya ke Maroko pada tahun 610 H dan meraih kemenangan atas Almohad pada tahun 613 H, dan gugur dalam pertempuran di dekat Wadi Sebou pada tahun 614 H (1217 M)."
