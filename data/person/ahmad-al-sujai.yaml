id: person/ahmad-al-sujai
class: person
label: { ar: "شمس الدين أحمد بن أحمد السجاعي", en: "Shams al-Din Ahmad ibn Ahmad al-Suja'i", fr: "Shams al-Din Ahmad ibn Ahmad al-Suja'i", ur: "شمس الدین احمد بن احمد السجاعی", es: "Shams al-Din Ahmad ibn Ahmad al-Suja'i" }
summary:
  ar: "عالم أزهري شافعي ⁦(ت. 1197هـ/1782م)⁩ من السجاعية قرب المحلة، له مؤلفات في اللغة والفقه والفلك، منها «هداية أولي البصائر والأبصار» {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34}."
  en: "Azhari Shafi'i scholar (d. 1197/1782) from al-Suja'iyya near al-Mahalla, author of works on language, law and astronomy, including Hidayat uli al-basa'ir wal-absar {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34}."
  fr: "Savant chaféite d'al-Azhar (mort en 1197 H/1782 ap. J.-C.), originaire d'al-Suja'iyya près d'al-Mahalla, auteur sur la langue, le droit et l'astronomie, dont Hidayat uli al-basa'ir wal-absar {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34}."
  ur: "ازہری شافعی عالم ⁦(متوفی 1197ھ/1782ء)⁩ جو محلہ کے قریب السجاعیہ کے تھے، زبان، فقہ اور فلکیات پر تصانیف کے مصنف، جن میں «ہدایۃ اولی البصائر والابصار» ہے {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34}۔"
  es: "Erudito Azhari Shafi'i (m. 1197/1782) de al-Suja'iyya cerca de al-Mahalla, autor de obras sobre lengua, derecho y astronomía, incluyendo Hidayat uli al-basa'ir wal-absar {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34}."
  tr: "El-Mahalla yakınlarındaki El-Sajjaiye'den Şafiî Ezherî bir âlim (ö. 1197 Hicri/1782 Miladi), dil, fıkıh ve astronomi üzerine yazıları bulunmaktadır; bunlar arasında \"İlgi ve vizyon sahibi olanlar için rehber\" de yer almaktadır {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 34}."
  id: "Seorang ulama Syafi'i Azharite (wafat 1197 H/1782 M) dari Al-Sajja'iyah dekat Al-Mahalla, beliau memiliki karya tulis tentang bahasa, fiqih, dan astronomi, termasuk \"Petunjuk bagi mereka yang memiliki wawasan dan visi\" {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 34}."
