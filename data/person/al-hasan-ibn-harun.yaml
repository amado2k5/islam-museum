id: person/al-hasan-ibn-harun
class: person
label: { ar: "الحسن بن هارون", en: "al-Hasan ibn Harun", es: "al-Hasan ibn Harun", fr: "al-Hasan ibn Harun", ur: "الحسن بن ہارون" }
summary:
  ar: "من أصحاب ابن مقلة؛ كان هو وابن مقلة مستخفين من القاهر والقاهر يتطلبهما فكانا يراسلان قواد الساجية والحجرية ويحذرونهم من شره ويذكران لهم قدره ونكثه مرة بعد أخرى كقتله مونساً وبلياق وابن ديس بعد الأيمان لهم حتى خلعوه سنة 322هـ {cite:kamil-ibn-al-athir p. 209}."
  en: "Ibn Muqla's fellow-conspirator; both in hiding from al-Qahir, they suborned the Sajiyya and Hujariyya captains with tales of his oath-breaking until they deposed him {cite:kamil-ibn-al-athir p. 209}."
  es: "El compañero conspirador de Ibn Muqla; ambos, escondidos de al-Qahir, sobornaron a los capitanes Sajiyya y Hujariyya con historias de su ruptura de juramentos hasta que lo depusieron {cite:kamil-ibn-al-athir p. 209}."
  fr: "Le complice d'Ibn Muqla; tous deux se cachant d'al-Qahir, ils ont suborné les capitaines Sajiyya et Hujariyya avec des récits de son manquement à ses serments jusqu'à ce qu'ils le déposent {cite:kamil-ibn-al-athir p. 209}."
  ur: "ابن مقلہ کا ساتھی سازشی؛ دونوں نے القاہر سے چھپتے ہوئے، انہوں نے سجیہ اور حجریہ کے کپتانوں کو اس کی حلف برداری کی کہانیوں کے ساتھ ماتحت کر دیا یہاں تک کہ انہوں نے اسے معزول کر دیا۔ 209}۔"
  tr: "İbn Muqla'nın yoldaşları arasındaydı; o ve İbn Muqla El-Kahir'i gizliydiler ve El-Kahir onları arıyordu. El-Sâciyye ve El-Huceriye komutanlarıyla yazışıyor, kötülüğü konusunda onları uyarıyor, kaderini ve kaderini reddettiğini defalarca hatırlatıyorlardı; örneğin, Munsa, Balyak ve İbn Dis'i yemin ettikten sonra öldürüp 322 Hicri yılında onu tahttan indirdiler {cite:kamil-ibn-al-athir, s. 209}."
  id: "Ia termasuk di antara sahabat Ibn Muqla; ia dan Ibn Muqla menyembunyikan Al-Qahir, dan Al-Qahir mencari mereka. Mereka biasa berkorespondensi dengan para komandan Al-Sajiyya dan Al-Hujariya, memperingatkan mereka tentang kejahatannya, mengingatkan mereka akan nasibnya dan penolakannya berulang kali, seperti membunuhnya Munsa, Balyaq, dan Ibn Dis setelah bersumpah kepada mereka hingga mereka menggulingkannya pada tahun 322 H {cite:kamil-ibn-al-athir, hlm. 209}."
