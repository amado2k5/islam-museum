summary:
  ar: "مرادي لُقب بالمكشوح لأنه كُوي على كشحه من داء كان به؛ وجّهه النبي إلى اليمن لقتال الأسود العنسي وأمره باستمالة الأبناء وبعث معه فروة بن مسيك، فبلغه باليمن وفاة النبي فأظهر للأسود أنه على رأيه حتى خلّى بينه وبين دخول صنعاء فدخلها في جماعة من مذحج وهمدان، واستمال فيروز الديلمي وداذويه رأس الأبناء بعد باذام فتطابقوا على قتل الأسود ودخلوا عليه سحراً فذبحه قيس — وقيل إنما قتله فيروز وقيس أجاز عليه — واحتز رأسه وعلا سور المدينة فأعلن كفره؛ ثم اتُّهم بقتل داذويه وبلغ أبا بكر أنه على إجلاء الأبناء عن صنعاء فحمله إليه المهاجر بن أبي أمية فأحلفه خمسين يميناً عند منبر النبي أنه ما قتله فخلى سبيله ووجّهه إلى الشام مع من انتدب لغزو الروم."
  en: "A Muradi nicknamed al-Makshuh for a cautery on his waist from an ailment; the Prophet sent him to Yemen to fight al-Aswad al-Ansi, ordering him to win over the Abna' and dispatching Farwa ibn Musayk with him; reaching Yemen as the Prophet's death was reported he feigned accord with al-Aswad until let into San'a with a company of Madhhij, Hamdan and others, won over Fayruz al-Daylami and Dadhawayh — chief of the Abna' after Badham — and they agreed on killing al-Aswad, entering his chamber at dawn where Qays slaughtered him — some say Fayruz killed him and Qays merely struck off the head — took his head and proclaimed his lying from the city wall; afterwards accused of killing Dadhawayh, and Abu Bakr hearing he meant to expel the Abna' from San'a had al-Muhajir ibn Abi Umayya bring him, made him swear fifty oaths at the Prophet's minbar that he had not killed him, then released him and sent him to Syria with those volunteering to fight the Byzantines."
