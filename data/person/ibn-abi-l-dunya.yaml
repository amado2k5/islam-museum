summary:
  ar: "أبو بكر عبد الله بن محمد بن أبي الدنيا القرشي، مؤدب المكتفي بالله وصاحب الكتب المصنفة في الزهد وغيره، توفي في المحرم سنة إحدى وثمانين ومائتين {cite:muruj-al-dhahab p. 631-632}. وعند ابن النديم توفي يوم الثلاثاء لأربع عشرة ليلة خلت من جمادى الآخرة سنة إحدى وثمانين ومائتين وله كتاب مكايد الشيطان وكتاب الحلم وكتاب فقه النبي وكتاب ذم الملاهي وكتاب ذم الفحش وكتاب العفو وكتاب ذم المسكر وكتاب التوكيد وكتاب الإخلاص والنية وكتاب الطواعين وكتاب الصبر وآداب اللسان وكتاب الرغائب وكتاب أخبار قريش وكتاب ذم الدنيا وكتاب صفة الميزان وكتاب صفة الصراط وكتاب الموقف وكتاب شجرة طوبا وكتاب سدرة المنتهى وكتاب مكارم الأخلاق وكتاب ذكر الموت والقبور وكتاب زهد مالك بن دينار وغير ذلك {cite:fihrist-ibn-al-nadim p. 262}."
  en: "Abu Bakr Ibn Abi l-Dunya, al-Muktafi's tutor and prolific author of zuhd works — died Muharram 281 {cite:muruj-al-dhahab p. 631-632}. Ibn al-Jawzi adds that he tutored several caliphs' sons including al-Mu'tadid and Ali ibn al-Mu'tadid at fifteen dinars a month, that he aimed at hadith of asceticism and authored over a hundred compilations, while noting his transmissions from untrustworthy shaykhs; he died Jumada II 281 aged past seventy, Yusuf ibn Ya'qub prayed over him and he was buried at al-Shuniziyya {cite:muntazam-ibn-al-jawzi p. 148-149}."
