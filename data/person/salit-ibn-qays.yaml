summary:
  ar: "سليط بن قيس بن عمرو الأنصاري؛ بعثه عمر مع أبي عبيد إلى العراق وقال له لولا عجلة فيك لوليتك ولكن الحرب زبون لا يصلح لها إلا الرجل المكيث ويوم الجسر قال لأبي عبيد قد كنت نهيتك عن قطع هذا الجسر إليهم وأشرت عليك بالانحياز والكتاب إلى أمير المؤمنين بالاستمداد فأبيت وقاتل حتى قتل."
  en: "Salit ibn Qays ibn Amr al-Ansari; sent by Umar with Abu Ubayd to Iraq with the saying 'but for the haste in you I'd have appointed you — war is cunning, only the patient man suits it'; at the Bridge he reproached Abu Ubayd for crossing against his counsel and fought till killed."
