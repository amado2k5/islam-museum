label: { ar: "سليط بن قيس الأنصاري", en: "Salit ibn Qays al-Ansari", es: "Salit ibn Qays al-Ansari", fr: "Salit ibn Qays al-Ansari", ur: "سلط بن قیس الانصاری۔" }
summary:
  ar: "سليط بن قيس بن عمرو الأنصاري؛ بعثه عمر مع أبي عبيد إلى العراق وقال له لولا عجلة فيك لوليتك ولكن الحرب زبون لا يصلح لها إلا الرجل المكيث ويوم الجسر قال لأبي عبيد قد كنت نهيتك عن قطع هذا الجسر إليهم وأشرت عليك بالانحياز والكتاب إلى أمير المؤمنين بالاستمداد فأبيت وقاتل حتى قتل."
  en: "Salit ibn Qays ibn Amr al-Ansari; sent by Umar with Abu Ubayd to Iraq with the saying 'but for the haste in you I'd have appointed you — war is cunning, only the patient man suits it'; at the Bridge he reproached Abu Ubayd for crossing against his counsel and fought till killed."
  es: "Salit ibn Qays ibn Amr al-Ansari, enviado por Umar junto con Abu Ubayd a Irak con las palabras: «Si no fuera por tu prisa, te habría nombrado a ti; la guerra es astuta, solo el hombre paciente es apto para ella». En el puente, reprochó a Abu Ubayd que cruzara en contra de su consejo y luchó hasta morir."
  fr: "Salit ibn Qays ibn Amr al-Ansari; envoyé par Umar avec Abu Ubayd en Irak avec la phrase « si ce n'était ta précipitation, je t'aurais nommé — la guerre est rusée, seul l'homme patient y est apte »; au pont, il reprocha à Abu Ubayd d'avoir traversé contre son avis et combattit jusqu'à la mort."
  ur: "سلط بن قیس بن عمرو الانصاری؛ عمر کی طرف سے ابو عبید کے ساتھ یہ کہہ کر عراق بھیجا گیا تھا کہ 'لیکن آپ میں جلد بازی کی وجہ سے میں نے آپ کو مقرر کیا تھا - جنگ ایک چالاک ہے، صرف صبر کرنے والا ہی اس کے لیے موزوں ہے'۔ پل پر اس نے ابو عبید کو اس کے مشورے کے خلاف عبور کرنے پر ملامت کی اور مارے جانے تک لڑا۔"
  tr: "Süleyt bin Kays ibn Amr al-Ansari; Ömer onu Ebu Ubeyd ile birlikte Irak'a gönderdi ve şöyle dedi: Elindeki aceleci olmasaydı, valin olurdun, ama savaş sadece güçlü bir adamın uygun olduğu bir zayıflıktır. Köprü günü Ebu Ubeyd'e dedi ki, Bu köprüyü onlara kesmeni yasakladım ve taraf tutmanı tavsiye ettim, Müminler Komutanı'na yazdığım mektup yardım istemekti, ama o reddetti ve öldürülene kadar savaştı."
  id: "Sulayt ibn Qays ibn Amr al-Ansari; Umar mengirimnya bersama Abu Ubayd ke Irak dan berkata kepadanya: Jika bukan karena tergesa-gesa di tanganmu, kamu akan menjadi gubernurmu, tetapi perang adalah kelemahan yang hanya bisa dihadapi oleh orang yang kuat. Pada hari jembatan, dia berkata kepada Abu Ubayd, Aku telah melarangmu memotong jembatan ini untuk mereka dan menyarankan kamu untuk memihak, dan surat kepada Panglima Orang Beriman adalah untuk meminta bantuan, tetapi dia menolak dan bertempur sampai tewas."
