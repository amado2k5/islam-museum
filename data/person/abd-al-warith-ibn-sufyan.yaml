summary:
  ar: "عبد الوارث بن سفيان بن جبرون القرطبي ⁦(317–395هـ)⁩، بدأ الطلب على قاسم بن أصبغ سنة 333هـ وسمع منه أكثر رواياته، فكان أوثق الناس فيه وأكثرهم ملازمة له؛ وعنه أخذ ابن عبد البر علم قاسم، وقرأ عليه «مصنف» قاسم في السنن، و«المعارف» و«شرح غريب الحديث» لابن قتيبة {cite:tamhid-furqan-2017-v1 p. 13}."
  en: "'Abd al-Warith b. Sufyan b. Jabrun of Cordoba (317–395 AH) began studying with Qasim b. Asbagh in 333 AH and heard most of his transmissions, becoming the most reliable and most constant of his companions; from him Ibn 'Abd al-Barr took Qasim's learning, reading with him Qasim's *Musannaf* on the Sunan and Ibn Qutayba's *al-Ma'arif* and *Sharh Gharib al-Hadith* {cite:tamhid-furqan-2017-v1 p. 13}."
  ur: "عبد الوارث بن سفیان بن جبرون قرطبی ⁦(317–395ھ)⁩ نے 333ھ میں قاسم بن اصبغ سے پڑھنا شروع کیا اور ان کی اکثر روایات سنیں، یوں ان کے سب سے معتبر اور سب سے زیادہ ساتھ رہنے والے شاگرد بنے؛ ان سے ابن عبد البر نے قاسم کا علم لیا، اور ان پر قاسم کی سنن پر «مصنف» اور ابن قتیبہ کی «المعارف» اور «شرح غریب الحدیث» پڑھیں {cite:tamhid-furqan-2017-v1 p. 13}۔"
