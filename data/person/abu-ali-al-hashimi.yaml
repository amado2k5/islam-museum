roles: [scholar]
gender: male
summary:
  ar: "محمد بن أحمد بن أبي موسى الهاشمي، أبو علي، قاض من علماء الحنابلة من أهل بغداد مولداً ووفاة، كان أثيراً عند القادر بالله والقائم بأمر الله العباسيين، وله حلقة في جامع المنصور؛ من 345هـ الموافقة 957م إلى 428هـ الموافقة 1037م."
  en: "Muhammad ibn Ahmad ibn Abi Musa al-Hashimi, Abu Ali, a judge and one of the Hanbali scholars, of Baghdad by birth and death, favoured by the Abbasid caliphs al-Qadir bi-llah and al-Qaim bi-amr Allah, with a teaching circle in the Mosque of al-Mansur; 345 AH, 957 CE, to 428 AH, 1037 CE."
  fr: "Muhammad ibn Ahmad ibn Abi Musa al-Hashimi, Abu Ali, cadi et l'un des savants hanbalites, né et mort à Bagdad, favorisé par les califes abbassides al-Qadir bi-llah et al-Qaim bi-amr Allah, avec un cercle d'enseignement à la mosquée d'al-Mansur ; 345 H, 957 ap. J.-C., à 428 H, 1037 ap. J.-C."
  es: "Muhammad ibn Ahmad ibn Abi Musa al-Hashimi, Abu Ali, juez y uno de los eruditos hanbalíes, originario de Bagdad y fallecido en ella, favorecido por los califas abasíes al-Qadir bi-llah y al-Qaim bi-amr Allah, con un círculo de enseñanza en la Mezquita de al-Mansur; 345 AH, 957 CE, a 428 AH, 1037 CE."
  ur: "محمد بن احمد بن ابی موسیٰ الہاشمی، ابو علی، ایک جج اور حنبلی علماء میں سے ایک، بغداد کے پیدائش اور وفات کے لحاظ سے، عباسی خلفاء القادر باللہ اور القائم بن عمر اللہ کی طرف سے حمایت یافتہ، مسجد المنصور میں ایک درسی حلقہ کے ساتھ؛ 345ھ، 957ء، تا 428ھ، 1037ء۔"
  tr: "Hanbeli âlimlerinden Muhammed ibn Ahmed ibn Abi Musa el-Haşimi, Ebu Ali, Bağdat'ta doğmuş ve ölmüş bir kadıdır. El-Kadir Billa ve el-Kaim bi-Amr Allah el-Abbasi'nin gözdesiydi ve 345 Hicri (957 Miladi) ile 428 Hicri (1037 Miladi) yılları arasında El-Mansur Camii'nde bir çevresi vardı."
  id: "Muhammad ibn Ahmad ibn Abi Musa al-Hashimi, Abu Ali, seorang hakim dari kalangan ulama Hanbali, lahir dan wafat di Baghdad. Beliau adalah kesayangan al-Qadir Billah dan al-Qaim bi-Amr Allah al-Abbasi, dan beliau memiliki sebuah lingkaran di Masjid al-Mansur; dari tahun 345 H yang setara dengan 957 M hingga 428 H yang setara dengan 1037 M."
