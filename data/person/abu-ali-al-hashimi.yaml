  ar: "محمد بن أحمد بن أبي موسى الهاشمي، أبو علي، قاض من علماء الحنابلة من أهل بغداد مولداً ووفاة، كان أثيراً عند القادر بالله والقائم بأمر الله العباسيين، وله حلقة في جامع المنصور؛ من 345هـ الموافقة 957م إلى 428هـ الموافقة 1037م."
