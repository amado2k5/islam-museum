id: person/jalal-al-din-khwarazmshah
class: person
label: { ar: "جلال الدين منكبرتي بن خوارزم شاه" }
summary:
  ar: "أكبر أولاد خوارزم شاه محمداً وآخر سلاطين الدولة الخوارزمية، حمل لواءها بعد أبيه فقاتل جنكزخان على سند وانهزم بعد أن أحدث في عساكر التتر ما أدهشهم حتى أعجب به جنكزخان، ثم عاد فملك بلاد الجبل وأذربيجان وضرب على تفليس ففتحها من الكرج ثامن ربيع الأول سنة ثلاث وعشرين وستمائة وهي من أحصن البلاد لم يقدر عليها السلاطين السلجوقية قبله منذ ملكها الكرج سنة خمس عشرة وخمسمائة، وحصر خلاط فملكها، وخالف الملك الأشرف وكيقباذ صاحب بلاد الروم حتى انهزم منهما، ثم انهزم من التتر على آمد سنة ثمان وعشرين وستمائة فانقطع خبره {cite:kamil-ibn-al-athir p. 460-462, 492-495}."
