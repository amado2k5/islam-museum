id: person/jalal-al-din-khwarazmshah
class: person
label: { ar: "جلال الدين منكبرتي بن خوارزم شاه" }
summary:
  ar: "أكبر أولاد خوارزم شاه محمداً وآخر سلاطين الدولة الخوارزمية، حمل لواءها بعد أبيه فقاتل جنكزخان على سند وانهزم بعد أن أحدث في عساكر التتر ما أدهشهم حتى أعجب به جنكزخان، ثم عاد فملك بلاد الجبل وأذربيجان وضرب على تفليس ففتحها من الكرج ثامن ربيع الأول سنة ثلاث وعشرين وستمائة وهي من أحصن البلاد لم يقدر عليها السلاطين السلجوقية قبله منذ ملكها الكرج سنة خمس عشرة وخمسمائة، وحصر خلاط فملكها، وخالف الملك الأشرف وكيقباذ صاحب بلاد الروم حتى انهزم منهما، ثم انهزم من التتر على آمد سنة ثمان وعشرين وستمائة فانقطع خبره {cite:kamil-ibn-al-athir p. 460-462, 492-495}. وفي الشذرات أورد ترجمته في سنة تسع وعشرين: أحد من يضرب به المثل في الشجاعة والإقدام، قال الذهبي لا أعلم في السلاطين أكثر جولاناً منه في البلدان ما بين الهند إلى ما وراء النهر إلى العراق إلى فارس إلى كرمان إلى أذربيجان وأرمينية، وحضر مصافاً وقاوم التتار في أول جدهم، وافتتح غير مدينة وسفك الدماء وظلم وعسف وغدر ومع ذلك كان صحيح الإسلام وربما قرأ في المصحف ويبكي؛ وآل أمره إلى أن تفرق جيشه وقلة لاتهم لم تكن لهم أقطاع بل أكثر عيشهم من نهب البلاد، فانهزم فرآه فلاح من قرية يقال لها عين دارا رابطاً على سرج مرصع بالياقوت وعلى لجام فرسه الجواهر فأنزله وأطعمه فلما نام ضربه بفأس قتله وأخذ ما معه ودفنه، فبلغ ذلك شهاب الدين غازي صاحب ميافارقين فأحضر الفلاح وعاقبه وأقر بالفرس والسلاح؛ وكان جلال الدين سداً بين المسلمين والكفار فلما مات انفتح السد، وكان يتكلم بالتركية والفارسية {cite:shadharat-dhahab p. 130-131}."
