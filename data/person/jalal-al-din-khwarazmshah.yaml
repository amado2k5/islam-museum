id: person/jalal-al-din-khwarazmshah
class: person
label: { ar: "جلال الدين منكبرتي بن خوارزم شاه" }
summary:
  ar: "أكبر أولاد خوارزم شاه محمداً وآخر سلاطين الدولة الخوارزمية، حمل لواءها بعد أبيه فقاتل جنكزخان على سند وانهزم بعد أن أحدث في عساكر التتر ما أدهشهم حتى أعجب به جنكزخان، ثم عاد فملك بلاد الجبل وأذربيجان وضرب على تفليس ففتحها من الكرج ثامن ربيع الأول سنة ثلاث وعشرين وستمائة وهي من أحصن البلاد لم يقدر عليها السلاطين السلجوقية قبله منذ ملكها الكرج سنة خمس عشرة وخمسمائة، وحصر خلاط فملكها، وخالف الملك الأشرف وكيقباذ صاحب بلاد الروم حتى انهزم منهما، ثم انهزم من التتر على آمد سنة ثمان وعشرين وستمائة فانقطع خبره {cite:kamil-ibn-al-athir p. 460-462, 492-495}. وفي الشذرات أورد ترجمته في سنة تسع وعشرين: أحد من يضرب به المثل في الشجاعة والإقدام، قال الذهبي لا أعلم في السلاطين أكثر جولاناً منه في البلدان ما بين الهند إلى ما وراء النهر إلى العراق إلى فارس إلى كرمان إلى أذربيجان وأرمينية، وحضر مصافاً وقاوم التتار في أول جدهم، وافتتح غير مدينة وسفك الدماء وظلم وعسف وغدر ومع ذلك كان صحيح الإسلام وربما قرأ في المصحف ويبكي؛ وآل أمره إلى أن تفرق جيشه وقلة لاتهم لم تكن لهم أقطاع بل أكثر عيشهم من نهب البلاد، فانهزم فرآه فلاح من قرية يقال لها عين دارا رابطاً على سرج مرصع بالياقوت وعلى لجام فرسه الجواهر فأنزله وأطعمه فلما نام ضربه بفأس قتله وأخذ ما معه ودفنه، فبلغ ذلك شهاب الدين غازي صاحب ميافارقين فأحضر الفلاح وعاقبه وأقر بالفرس والسلاح؛ وكان جلال الدين سداً بين المسلمين والكفار فلما مات انفتح السد، وكان يتكلم بالتركية والفارسية {cite:shadharat-dhahab p. 130-131}."
  tr: "Horazm'ın en büyük oğlu Şah Muhammed ve Hwarazm devletinin son sultanı, babasından sonra sancağı aldı, Cengiz Han ile bir tabakta savaştı ve Tatar ordularını şaşırtıp hayranlık duyduktan sonra yenildi. Daha sonra geri döndü, dağlık toprakları ve Azerbaycan'ı yönetti, Tiflis'e saldırdı ve 623 Hicri yılının sekizinci Rebi'l-Avvel'inde Karaj'dan aldı. Selçuklu sultanlarının 1500'deki Karaj'dan beri fethedemediği en sağlam topraklardan biriydi. Khalat burayı kuşattı ve yönetti. Roma topraklarının hükümdarı Kral Ashraf Wakbad'a karşı çıktı, ta ki ikisi tarafından da yenilene kadar. Sonra yaklaşık 28 Hicri yılında Tatarlar tarafından yenildi ve haberi kesildi {alıntı:Kamil-ibn-al-Athir ss. 460-462, 492-495}. El-Şadharat'ta 29. yıldaki biyografisinden bahsetti: Cesaret ve yiğitlikle örnek teşkil edenlerden biri. El-Dhahabi şöyle dedi: Hindistan'dan nehrin ötesine, Irak'a, Pers'e, Kirman'a, Azerbaycan ve Ermenistan'a kadar uzanan ülkelerde kendisinden daha fazla dolaşan bir sultan tanımıyorum. Bir rafineriye gitti ve Tatarlara karşı direndi, farklı bir şehri fethetti, kan, zulüm, zorbalık ve ihanetle karşılaştı. Yine de İslam'a sadıktı ve belki Kur'an'dan okuyup ağladı; işleri ordusunun dağıldığı ve az sayıda olduğu noktaya ulaştı Onlar feodal beyler değillerdi, ancak geçimlerinin çoğu toprağı yağmalayarak gelirdi. Yenildi ve Ain Dar adlı bir köyden bir çiftçi onu gördü; atının dizgininde yakut ve mücevherlerle süslenmiş bir eyerle bağlanmıştı. Onu indirdi ve besledi. Uyurken baltayla vurdu, elindekileri aldı ve gömdü. Miafariqin hükümdarı Şihabeddin Gazi bunu duyunca çiftçiyi çağırdı, cezalandırdı ve atlara ve silahlara itiraf etti. Celaleddin Müslümanlar ile kafirler arasında bir bariyerdi ve öldüğünde baraj açıldı, Türkçe ve Farsça konuştu {atıf:shadharat-dhahab, s. 130-131}."
  id: "Putra sulung Khwarazm, Shah Muhammad dan sultan terakhir negara Khwarazmian, mengambil panjinya setelah ayahnya, bertarung melawan Genghis Khan di atas piring, dan dikalahkan setelah membuat pasukan Tatar terkejut dan kagum. Ia kemudian kembali dan memerintah tanah pegunungan dan Azerbaijan, menyerang Tbilisi, dan merebutnya dari Karaj pada tanggal 8 Rabi' al-Awwal tahun 623 H. Wilayah ini adalah salah satu wilayah paling kuat yang belum pernah bisa ditaklukkan oleh sultan Seljuk sejak Karaj pada tahun 1500. Khalat mengepung dan memerintahnya. Ia menentang Raja Ashraf Wakbad, penguasa tanah Romawi, hingga akhirnya dikalahkan oleh keduanya. Kemudian ia dikalahkan oleh Tatar sekitar tahun 28 H, dan beritanya terputus {cite:kamil-ibn-al-athir hlm. 460-462, 492-495}. Dalam Al-Shadharat, ia menyebutkan biografinya pada tahun 29: Salah satu yang dicontohkan dalam keberanian dan keberanian. Al-Dhahabi berkata: Saya tidak tahu ada sultan yang berkeliaran lebih banyak daripada ia di negara-negara mulai dari India hingga ke seberang sungai, Irak, Persia, Kerman, Azerbaijan dan Armenia. Ia menghadiri kilang dan melawan Tatar di masa awal mereka, menaklukkan kota lain, menumpahkan darah, penindasan, tirani, dan pengkhianatan. Namun demikian, ia setia pada Islam dan mungkin membaca Al-Qur'an lalu menangis; urusannya sampai pada titik di mana pasukannya tercerai-berai dan sedikit Mereka bukan penguasa feodal, tetapi sebagian besar mata pencaharian mereka berasal dari menjarah tanah. Ia dikalahkan, dan seorang petani dari desa bernama Ain Dar melihatnya, diikat pada pelana yang dihiasi rubi dan permata di tali kekang kudanya. Ia menurunkan dan memberinya makan. Saat ia tidur, ia memukulnya dengan kapak, mengambil apa yang dimilikinya, dan menguburnya. Ketika Shihab al-Din Ghazi, penguasa Miafariqin, mendengar hal ini, ia memanggil petani itu, menghukumnya, dan mengaku atas kuda serta senjata. Jalal al-Din menjadi penghalang antara Muslim dan kafir, dan ketika ia meninggal, bendungan dibuka, dan ia berbicara dalam bahasa Turki dan Persia {cite:shadharat-dhahab, hlm. 130-131}."
