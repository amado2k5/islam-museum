label: { ar: "أبو الحسن علي سلطان غرناطة" }
summary:
  ar: "أبو الحسن علي بن سعد سلطان غرناطة الملقب بمولي حسن؛ استرسل في اللذات وأثار أهل غرناطة بإدخال حظيته الرومية ثوريا (إزابيلا دي سوليس) دار الدولة، فخاف ابناه أبو عبد الله محمد وأبو الحجاج يوسف أن يفتك بهما بإشارتها فهربا واستقرا بوادي آش وقامت بدعوتهما، وبايعتهما المرية وبسطة وغرناطة فهرب إلى مالقة {cite:nafh-tib-maqqari p. 518}. ولما أسر ابنه أبو عبد الله في وقعة لشانة اجتمع كبراء غرناطة وأعيان الأندلس وأعادوه إلى الملك وبايعوه وقد كان أصابه مثل الصرع حتى ذهب بصره وأصابه ضرر، فلما تعذر أمره قدم أخاه أبا عبد الله وخلع له نفسه ونزل بالمنكب فأقام بها إلى أن مات {cite:nafh-tib-maqqari p. 519}."
  en: "Abu al-Hasan Ali (Muley Hacen), Nasrid sultan of Granada — his favour for the Christian concubine Zoraya drove his sons Abu Abdallah Muhammad (Boabdil) and Abu al-Hajjaj Yusuf to flee to Guadix, and the cities gave them bay'a; restored after his son's capture at Lucena until epilepsy and failing sight forced him to cede to his brother al-Zaghal; he retired to Almunecar and died there {cite:nafh-tib-maqqari p. 518-519}."
