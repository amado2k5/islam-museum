id: person/muhammad-ibn-abd-allah-ibn-tahir
class: person
label: { ar: "محمد بن عبد الله بن طاهر" }
summary:
  ar: "أمير بغداد، خلع عليه المعتز خلعة الملك وقلده سيفين ثم عزله {cite:tarikh-khulafa-minhaj-1434 p. 557}. وعند المسعودي هنئ بقتل يحيى بن عمر فدخل عليه أبو هاشم الجعفري فقال إنك لتهنأ بقتل رجل لو كان رسول الله حياً لعزي به ثم قال يا بني طاهر كلوه وبياً إن لحم النبي غير مريء، فأمر ابن طاهر بإنزال الرأس لما رأى من الناس {cite:muruj-al-dhahab p. 530-531}"
  en: "The amir of Baghdad; al-Mu'tazz gave him the royal khil'a and girded him with two swords, then deposed him {cite:tarikh-khulafa-minhaj-1434 p. 557}."
  es: "El emir de Bagdad, al-Mu'tazz, le dio el khil'a real y lo ciñó con dos espadas, luego lo depuso {cite:tarikh-khulafa-minhaj-1434 p. 557}."
  fr: "L'émir de Bagdad; al-Mu'tazz lui donna le khil'a royal et le ceignit de deux épées, puis le déposa {cite:tarikh-khulafa-minhaj-1434 p. 557}."
  ur: "بغداد کا امیر؛ معتز نے اسے شاہی خلع دیا اور دو تلواریں باندھ دیں، پھر اسے معزول کر دیا۔ 557}۔"
  tr: "Bağdat Emiri El-Mu'tazz kraliyet cübbesini çıkardı, ona iki kılıç verdi ve ardından onu görevden aldı {atıf:Tarih-Khulafa-minhaj-1434 s. 557}. El-Mes'udi, Yahya ibn Umar'ın öldürülmesi nedeniyle onu tebrik etti. Ebu Haşim el-Ca'fari içeri girdi ve dedi ki, 'Eğer Allah'ın Elçisi hayatta olsaydı, ondan teselli bulacak bir adamın öldürülmesine sevinirdin.' Sonra dedi ki, 'Ey Tahir'in oğulları, gülümseyerek yiyin, çünkü Peygamber'in bedeni görünmüyor.' İbn Tahir, halktan gördüklerinin üzerine başının indirilmesini emretti {cite:muruj-al-dhahab s. 530-531}"
  id: "Emir Baghdad, Al-Mu'tazz, melepas jubah kerajaan, menyerahkan dua pedang, lalu menurunkannya {cite:History-Khulafa-minhaj-1434 hlm. 557}. Al-Mas'udi mengucapkan selamat atas pembunuhan Yahya ibn Umar. Abu Hashim al-Ja'fari masuk dan berkata, 'Engkau akan senang dengan pembunuhan seorang pria yang, jika Rasul Allah masih hidup, ia akan dihibur olehnya.' Lalu ia berkata, 'Wahai anak-anak Tahir, makanlah dengan senyum, karena daging Nabi tidak terlihat.' Ibn Tahir memerintahkan agar kepala diturunkan atas apa yang dilihatnya dari orang-orang {cite:muruj-al-dhahab hlm. 530-531}"
