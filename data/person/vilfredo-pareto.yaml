summary:
  ar: "العالم الإيطالي فيلفريدو باريتو، صاحب قانون الثمانين والعشرين (80/20) الذي يدرّسه طارق السويدان في الإدارة: عشرون في المئة من الأسباب تنتج ثمانين في المئة من النتائج."
  en: "The Italian thinker Vilfredo Pareto, author of the 80/20 law that Tareq al-Suwaidan teaches in management: twenty per cent of causes produce eighty per cent of results."
  ur: "اطالوی مفکر ولفریڈو پاریتو، اصولِ 80/20 کا واضع جسے طارق السویدان انتظام میں سکھاتے ہیں: بیس فیصد اسباب اسی فیصد نتائج پیدا کرتے ہیں۔"
  es: "El pensador italiano Vilfredo Pareto, autor de la ley 80/20 que Tareq al-Suwaidan enseña en gestión empresarial, afirma que el veinte por ciento de las causas producen el ochenta por ciento de los resultados."
  fr: "Le penseur italien Vilfredo Pareto, auteur de la loi 80/20 que Tareq al-Suwaidan enseigne en management: vingt pour cent des causes produisent quatre-vingts pour cent des résultats."
  tr: "İtalyan bilim insanı Vilfredo Barreto, Tariq Al-Suwaidan tarafından yönetimde incelenen 80/20 yasasının yazarı: Nedenlerin yüzde yirmisi sonuçların yüzde seksenini üretir."
  id: "Ilmuwan Italia Vilfredo Barreto, penulis hukum 80/20 yang dipelajari oleh Tariq Al-Suwaidan dalam administrasi: Dua puluh persen penyebab menghasilkan delapan puluh persen dari hasilnya."
