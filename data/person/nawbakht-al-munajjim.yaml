summary:
  ar: "نوبخت المجوسي، منجم المنصور الذي أسلم على يديه وهو أبو النوبختية؛ عند المسعودي كان المنصور أول خليفة قرب المنجمين وعمل بأحكام النجوم وكان معه نوبخت وإبراهيم الفزاري وعلي بن عيسى الأسطرلابي {cite:muruj-al-dhahab p. 668-669}."
  en: "Nawbakht the Magian, al-Mansur's astrologer who converted to Islam at his hands and fathered the Nawbakhti house; al-Mas'udi counts al-Mansur the first caliph to court astrologers {cite:muruj-al-dhahab p. 668-669}."
  es: "Nawbakht el Mago, astrólogo de al-Mansur que se convirtió al Islam por medio de él y fue el padre de la casa Nawbakhti; al-Mas'udi considera a al-Mansur el primer califa en cortejar a astrólogos {cite:muruj-al-dhahab p. 668-669}."
  fr: "Nawbakht le Mage, l'astrologue d'al-Mansur qui s'est converti à l'islam grâce à lui et a engendré la maison Nawbakhti; al-Mas'udi considère al-Mansur comme le premier calife à avoir des astrologues de cour {cite:muruj-al-dhahab p. 668-669}."
  ur: "نوبخت مجوسی، المنصور کا نجومی جس نے اس کے ہاتھوں اسلام قبول کیا اور نوبختی گھر کا باپ ہوا۔ المسعودی نے درباری نجومیوں کے نزدیک المنصور کو پہلا خلیفہ شمار کیا ہے۔ 668-669}۔"
