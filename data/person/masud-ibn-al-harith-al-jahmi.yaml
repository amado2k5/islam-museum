  ar: "مسعود بن الحارث الجهمي، العابد المجتهد المرضي. رأى رجل في منامه أنه قُرّب وأُدني، وأن الله قال له: يا مسعود، طال ما ترددت في طرقات الدنيا، وأنا عنك راض."
  en: "Mas'ud ibn al-Harith al-Jahmi, a diligent and well-regarded worshipper; a man saw him in a dream, and he said that he had been brought near and that God said to him: O Mas'ud, long did you wander the roads of this world, and I am content with you."
