summary:
  ar: "مسعود بن الحارث الجهمي، العابد المجتهد المرضي. رأى رجل في منامه أنه قُرّب وأُدني، وأن الله قال له: يا مسعود، طال ما ترددت في طرقات الدنيا، وأنا عنك راض."
  en: "Mas'ud ibn al-Harith al-Jahmi, a diligent and well-regarded worshipper; a man saw him in a dream, and he said that he had been brought near and that God said to him: O Mas'ud, long did you wander the roads of this world, and I am content with you."
  ur: "مسعود بن حارث جہمی عبادت گزار، محنتی اور پسندیدہ تھے۔ ایک شخص نے خواب میں ان کو دیکھا، تو انہوں نے کہا کہ مجھے قریب کیا گیا اور فرمایا گیا: اے مسعود، تم دنیا کے راستوں میں بہت پھرے، اور میں تم سے راضی ہوں۔"
  es: "Mas'ud ibn al-Harith al-Jahmi, un adorador diligente y respetado; un hombre lo vio en un sueño, y dijo que había sido traído cerca y que Dios le dijo: Oh Mas'ud, mucho tiempo vagaste por los caminos de este mundo, y estoy contento contigo."
  fr: "Mas'ud ibn al-Harith al-Jahmi, un adorateur diligent et respecté; un homme le vit en rêve, et il dit qu'il avait été amené près de Dieu et que Dieu lui avait dit: Ô Mas'ud, tu as longtemps erré sur les routes de ce monde, et Je suis satisfait de toi."
  tr: "Mas'ud ibn al-Haris al-Jahmi, dindar, gayretli ve sabırlı ibadet eden. Bir adam rüyasında yakınlarda olduğunu gördü ve Tanrı ona şöyle dedi: Ey Mesud, ne zamandır dünyanın yollarında dolaşıyorsun, senden memnunum."
  id: "Mas'ud ibn al-Harith al-Jahmi, penyembah yang taat, rajin, dan sabar. Seorang pria melihat dalam mimpi bahwa dia dekat dan dekat, dan Tuhan berkata kepadanya: Wahai Masoud, berapa lama kau telah mengembara di jalan dunia, dan aku senang padamu."
