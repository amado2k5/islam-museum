summary:
  ar: "خليفة عباسي، ذكر الطبري أن ابن طاهر عزم على خلعه سنة إحدى وخمسين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.337}، ثم خُلع وقُتل في سنة اثنتين وخمسين {cite:tabari-tarikh-abu-al-fadl j.9 p.348} {cite:tabari-tarikh-abu-al-fadl j.9 p.362}، وعند السيوطي هو أحمد بن المعتصم أخو المتوكل أمه مخارق، لما مات المنتصر اجتمع القواد وقالوا متى وليتم أحداً من ولد المتوكل لا يبقى منا باقية فبايعوا أحمد وله ثمان وعشرون سنة، وفي سنة إحدى وخمسين تنكر له الأتراك لما قتل وصيف وبغا باغراً التركي فقيل خليفة في قفص يقول ما قالا له كما تقول البيغا فخاف وانحدر إلى بغداد فأخرجوا المعتز وبايعوه وخلعوه، فجهز المعتز جيشاً لمحاربته واستعد أهل بغداد للقتال فدامت الواقعات أشهراً وكثر القتل وغلت الأسعار، وخلع نفسه في أول سنة اثنتين وخمسين وأحدر إلى واسط تسعة أشهر محبوساً، وهو أول من أحدث لبس الأكمام الواسعة نحو ثلاثة أشبار وصغر القلانس {cite:tarikh-khulafa-minhaj-1434 p. 555-556}. وعند المسعودي كان حسن المعرفة بأيام الناس وأخبارهم لهجاً بأخبار الماضين، ومن خبره أنه قال لنديمه كأني أشتهي الطعام فلما أطعم رغيفاً وخلاً وملحاً قال الليلة الثانية كأني جائع فبين له فرق ما بين الكلامين، وسأله يصف الطعام والشراب والطيب والنساء والخيل فقال أطيب الطعام ما لقي الجوع بطعم وافق شهوة وأي النساء أشهى من تخرج من عندها كارهاً وترجع إليها والهاً فأعطاه مائتي دينار {cite:muruj-al-dhahab p. 536-538}، وعند المسعودي أحدر إلى دار الحسن بن وهب ببغداد ثم إلى واسط وقتله سعيد الحاجب قرب القاطول يوم الأربعاء لست خلون من شوال سنة اثنتين وخمسين ومائتين وهو ابن خمس وثلاثين سنة، وبين خلعه وقتله تسعة أشهر ويوم {cite:muruj-al-dhahab p. 545-548}، وعند المسعودي كان أول من أحدث لبس الأكمام الواسعة {cite:muruj-al-dhahab p. 554}"
  en: "Abbasid caliph. Al-Tabari reports that Ibn Tahir resolved to depose him in 251 {cite:tabari-tarikh-abu-al-fadl j.9 p.337}; he was then deposed and killed in 252 {cite:tabari-tarikh-abu-al-fadl j.9 p.348} {cite:tabari-tarikh-abu-al-fadl j.9 p.362}. According to al-Suyuti he was Ahmad ibn al-Mu'tasim, brother of al-Mutawakkil, whose mother was Mukhariq. When al-Muntasir died the commanders gathered and said, 'If you make any of al-Mutawakkil's sons caliph, not one of us will be left', so they pledged allegiance to Ahmad, who was twenty-eight. In 251, when Wasif and Bugha Baghr the Turk were killed, the Turks turned against him; he was called 'a caliph in a cage, who says what the two of them tell him, as the parrot does'. Afraid, he went down to Baghdad. They brought out al-Mu'tazz, pledged allegiance to him, and deposed him. Al-Mu'tazz sent an army against him, and the people of Baghdad prepared to fight; the clashes went on for months, killing increased and prices rose. He deposed himself at the beginning of 252 and was sent down to Wasit, held in custody for nine months. He was the first to introduce wide sleeves, about three spans across, and to make caps smaller {cite:tarikh-khulafa-minhaj-1434 p. 555-556}. According to al-Mas'udi he knew well the days and reports of people and loved the accounts of the past. One anecdote: he told his boon-companion that he craved food; when a loaf, vinegar and salt were brought, on the second night he said he was hungry, and explained to him the difference between the two statements. He asked him to describe food, drink, perfume, women and horses. The best food, he answered, is what meets hunger with a taste that suits desire, and the most desirable woman is the one you leave unwillingly and return to besotted; so the caliph gave him two hundred dinars {cite:muruj-al-dhahab p. 536-538}. According to al-Mas'udi he was taken down to the house of al-Hasan ibn Wahb in Baghdad, then to Wasit; Sa'id al-Hajib killed him near al-Qatul on Wednesday, six nights into Shawwal 252, aged thirty-five. Nine months and a day lay between his deposition and his killing {cite:muruj-al-dhahab p. 545-548}. According to al-Mas'udi he was the first to introduce wide sleeves {cite:muruj-al-dhahab p. 554}."
  fr: "calife abbasside. Al-Tabari rapporte qu'Ibn Tahir résolut de le déposer en 251 {cite:tabari-tarikh-abu-al-fadl j.9 p.337}Il fut ensuite déposé et tué en 252 {cite:tabari-tarikh-abu-al-fadl j.9 p.348} {cite:tabari-tarikh-abu-al-fadl j.9 p.362}. Selon al-Suyuti, il était Ahmad ibn al-Mu'tasim, frère d'al-Mutawakkil, dont la mère était Mukhariq. Quand al-Muntasir est mort, les commandants se sont rassemblés et ont dit : « Si vous faites calife l'un des fils d'al-Mutawakkil, pas un de nous ne sera laissé », alors ils ont prêté allégeance à Ahmad, qui avait vingt-huit ans. En 251, lorsque Wasif et Bugha Baghr le Turc furent tués, les Turcs se retournèrent contre lui. On l’appelait « un calife dans une cage, qui dit ce qu’ils lui disent tous les deux, comme le perroquet  ». Peur, il est descendu à Bagdad. Ils firent sortir al-Mu'tazz, lui prêtèrent serment d'allégeance et le déposa. Al-Mu'tazz a envoyé une armée contre lui, et le peuple de Bagdad s'est préparé à se battre ; les affrontements ont duré des mois, les meurtres ont augmenté et les prix ont augmenté. Il se déposa au début de 252 et fut envoyé à Wasit, détenu pendant neuf mois. Il a été le premier à introduire des manches larges, environ trois travées à travers, et de faire des casquettes plus petites {cite:tarikh-khulafa-minhaj-1434 p. 555-556}. Selon al-Mas'udi, il connaissait bien les jours et les rapports des gens et aimait les récits du passé. Une anecdote  : il raconta à son compagnon qu’il avait soif de nourriture  ; quand on lui apportait un pain, du vinaigre et du sel, le deuxième soir, il disait qu’il avait faim et lui expliquait la différence entre les deux déclarations. Il lui demanda de décrire la nourriture, la boisson, le parfum, les femmes et les chevaux. La meilleure nourriture, répondit-il, est ce qui répond à la faim avec un goût qui convient au désir, et la femme la plus désirable est celle que vous laissez à contrecœur et retournez pour être ensorcelé ; ainsi le calife lui donna deux cents dinars {cite:muruj-al-dhahab p. 536-538}. Selon al-Mas'udi, il a été emmené à la maison d'al-Hasan ibn Wahb à Bagdad, puis à Wasit ; Sa'id al-Hajib l'a tué près d'al-Qatul mercredi, six nuits dans Shawwal 252, âgé de trente-cinq ans. Neuf mois et un jour s'écoulèrent entre sa déposition et son meurtre {cite:muruj-al-dhahab p. 545-548}. Selon al-Mas'udi, il a été le premier à introduire des manches larges {cite:muruj-al-dhahab p. 554}."
  es: "Califa abasí. Al-Tabari informa que Ibn Tahir decidió deponerlo en 251 {cite:tabari-tarikh-abu-al-fadl j.9 p.337}; luego fue depuesto y asesinado en 252 {cite:tabari-tarikh-abu-al-fadl j.9 p.348} {cite:tabari-tarikh-abu-al-fadl j.9 p.362}. Según al-Suyuti, era Ahmad ibn al-Mu'tasim, hermano de al-Mutawakkil, cuya madre era Mukhariq. Cuando al-Muntasir murió, los comandantes se reunieron y dijeron: 'Si nombráis califa a alguno de los hijos de al-Mutawakkil, no quedará ninguno de nosotros', así que juraron lealtad a Ahmad, que tenía veintiocho años. En 251, cuando Wasif y Bugha Baghr el turco fueron asesinados, los turcos se volvieron contra él; lo llamaban «un califa enjaulado, que repite lo que le dicen los dos, como un loro». Temeroso, bajó a Bagdad. Trajeron a al-Mu'tazz, le juraron lealtad y lo depusieron. Al-Mu'tazz envió un ejército contra él, y la gente de Bagdad se preparó para luchar; los enfrentamientos se prolongaron durante meses, aumentaron las muertes y subieron los precios. Se depuso a principios de 252 y fue enviado a Wasit, donde permaneció detenido durante nueve meses. Fue el primero en introducir mangas anchas, de unos tres palmos de ancho, y en hacer los gorros más pequeños {cite:tarikh-khulafa-minhaj-1434 p. 555-556}. Según al-Mas'udi, conocía bien los días y los relatos de la gente y le encantaban las crónicas del pasado. Una anécdota: le dijo a su compañero de acogida que ansiaba comida; cuando le trajeron un pan, vinagre y sal, en la segunda noche dijo que tenía hambre y le explicó la diferencia entre las dos afirmaciones. Le pidió que describiera la comida, la bebida, el perfume, las mujeres y los caballos. La mejor comida, respondió, es la que satisface el hambre con un sabor que se ajusta al deseo, y la mujer más deseable es aquella a la que uno deja a regañadientes y a la que regresa embelesado; así que el califa le dio doscientos dinares {cite:muruj-al-dhahab p. 536-538}. Según al-Mas'udi, fue llevado a la casa de al-Hasan ibn Wahb en Bagdad, luego a Wasit; Sa'id al-Hajib lo mató cerca de al-Qatul un miércoles, seis noches después del inicio de Shawwal 252, a la edad de treinta y cinco años. Nueve meses y un día transcurrieron entre su deposición y su asesinato {cite:muruj-al-dhahab p. 545-548}. Según al-Mas'udi, fue el primero en introducir mangas anchas {cite:muruj-al-dhahab p. 554}."
  ur: "عباسی خلیفہ۔ الطبری نے بیان کیا ہے کہ ابن طاہر نے 251 میں اسے معزول کرنے کا فیصلہ کیا {حوالہ: طبری-تاریخ-ابو الفضل ج.9 ص 337}؛ پھر اسے 252 میں معزول اور قتل کر دیا گیا {حوالہ: طبری-تاریخ-ابو الفضل ج.9 ص348} {حوالہ: طبری-تاریخ-ابو الفضل ج.9 ص362}۔ سیوطی کے مطابق وہ احمد بن المعتصم المتوکل کا بھائی تھا جس کی والدہ مخارق تھیں۔ جب المنتصر کی وفات ہوئی تو کمانڈر جمع ہوئے اور کہا کہ اگر تم متوکل کے بیٹوں میں سے کسی کو خلیفہ بنا دو گے تو ہم میں سے ایک بھی باقی نہیں رہے گا، چنانچہ انہوں نے احمد کی بیعت کی جو اٹھائیس سال کے تھے۔ 251 میں جب واصف اور بگا بغر ترک مارے گئے تو ترک اس کے خلاف ہو گئے۔ اسے 'پنجرے میں بند خلیفہ' کہا جاتا تھا، جو کہتا ہے کہ یہ دونوں اسے کہتے ہیں، جیسا کہ طوطا کرتا ہے۔ ڈرتے ڈرتے وہ بغداد چلا گیا۔ انہوں نے معتز کو باہر نکالا، اس سے بیعت کی اور اسے معزول کر دیا۔ معتز نے اس کے خلاف لشکر بھیجا، اور بغداد کے لوگ لڑنے کے لیے تیار ہو گئے۔ جھڑپیں مہینوں تک جاری رہیں، ہلاکتیں بڑھیں اور قیمتیں بڑھیں۔ اس نے 252 کے آغاز میں خود کو معزول کر دیا اور اسے وصیت کے پاس بھیج دیا گیا، جسے نو ماہ تک حراست میں رکھا گیا۔ وہ پہلے شخص تھے جنہوں نے چوڑی آستینیں، تقریباً تین پھیلے ہوئے، اور ٹوپیوں کو چھوٹا بنایا۔ 555-556}۔ المسعودی کے مطابق وہ دنوں اور لوگوں کے احوال کو اچھی طرح جانتا تھا اور ماضی کے احوال سے محبت کرتا تھا۔ ایک واقعہ: اس نے اپنے ساتھی کو بتایا کہ اسے کھانے کی خواہش ہے۔ جب ایک روٹی، سرکہ اور نمک لایا گیا تو دوسری رات آپ نے فرمایا کہ مجھے بھوک لگی ہے، اور ان دونوں باتوں میں فرق بیان کیا۔ اس نے اس سے کھانے پینے، عطر، عورتوں اور گھوڑوں کے بارے میں پوچھا۔ اس نے جواب دیا، بہترین کھانا وہ ہے جو بھوک کو اس ذائقہ کے ساتھ پورا کرے جو خواہش کے مطابق ہو، اور سب سے زیادہ پسندیدہ عورت وہ ہے جسے تم نا چاہتے ہوئے چھوڑ دو اور اپنے پاس واپس لوٹ جاؤ۔ چنانچہ خلیفہ نے اس کو دو سو دینار دیے۔ 536-538}۔ المسعودی کے مطابق اسے بغداد میں حسن بن وہب کے گھر، پھر وصیت لے جایا گیا۔ سعید الحجیب نے اسے بدھ کے روز القطول کے قریب، شوال 252 کی چھ راتوں کو، پینتیس سال کی عمر میں قتل کر دیا۔ اس کی معزولی اور قتل کے درمیان نو مہینے اور ایک دن کا وقفہ تھا۔ 545-548}۔ المسعودی کے مطابق وہ پہلا شخص تھا جس نے چوڑی آستینیں متعارف کروائیں {حوالہ: مروج الذہب ص۔ 554}۔"
  tr: "Abbasi Halife Al-Tabari, İbn Tahir'in onu 251 yılında tahttan indirmeyi planladığını belirtmiştir {cite:tabari-tarikh-abu-al-fadl J.9 s.337}, ardından 52 yılında tahttan indirilip öldürülmüştür {cite:tabari-tarikh-abu-al-fadl j.9 s.348} {cite:tabari-tarikh-abu-al-fadl j.9 s.362}. Al-Suyuti'ye göre, o, annesi Mukhariq olan al-Mutawakkil'in kardeşi Ahmed ibn al-Mu'tasim'dir. Al-Muntasir öldüğünde komutanlar toplandı ve 'Al-Mutawakkil'in soyundan ne zaman kalacaksın?' dediler. Yirmi sekiz yaşındaki Ahmad'a bağlılık yemini ettiler. Elli birinci yılda, Türkler onu reddetti Waseef ve Türk Bagha öldürüldü. Halifenin bir kafeste olduğu, bigha'nın ona söylediklerini söylediği söylenirdi. Korktu ve Bağdat'a gitti, orada al-Mu'tazz kovuldu, ona bağlılık yemini etti ve tahttan indirildi. Al-Mu'tazz kendisiyle savaşmak için bir ordu hazırladı ve Bağdat halkı savaşmaya hazırlandı. Olaylar aylarca sürdü, birçok cinayet ve yüksek ücretlerle sonuçlandı. Elli iki yılın ilk yılında Wasit'te dokuz ay hapsedildi. Yaklaşık üç açıklık geniş kollu ve küçük bir kapüşon giymeyi ilk kez o getirdi {cite:Tarikh-khulafa-minhaj-1434, s. 555-556}. El-Mes'udi'ye göre, insanların günlerini ve haberlerini geçmişteki gibi iyi biliyordu. Anlatımlarından biri, yoldaşına şöyle dediği de var: 'Sanki yemek istiyorum.' Bir somun ekmek, ekmek ve tuz verildiğinde, 'Ertesi gece sanki açmışım gibi.' dedi. İki kelime arasındaki farkı açıkladı ve yiyecek, içki, parfüm, kadınlar ve atları tarif etmesini istedi. Dedi ki: En iyi yemek, açlığı arzuya uygun bir tadla karşılayandır. Ve hangi kadın onu isteksizce bırakıp ona ve tanrısına dönmekten daha lezzetlidir, bu yüzden ona iki yüz dinar verdi. {alıntı: Muruj-al-Dhahab s. 536-538} ve al-Mas'udi'ye göre, Bağdat'taki el-Hasan bin Vahb'ın evine, ardından Wasit'e gitti ve burada Sa'id al-Hacib, Çarşamba günü, 252 Hicri yılında, Şevval'den altı ay önce, otuz beş yaşında el-Qatil yakınlarında öldürüldü. Görevden alınması ile öldürülmesi ve o gün arasında dokuz ay geçti {cite:muruj-al-dhahab s. 545-548}. al-Masudi'ye göre, geniş kollu giymeyi ilk kez o getirdi {cite:muruj-al-dhahab s. 554}"
  id: "Khalifah Abbasiyah, Al-Tabari menyebutkan bahwa Ibn Tahir bermaksud menggulingkannya pada tahun 251 {cite:tabari-tarikh-abu-al-fadl J.9 hlm.337}, lalu digulingkan dan dibunuh pada tahun 52 {cite:tabari-tarikh-abu-al-fadl j.9 hlm.348} {cite:tabari-tarikh-abu-al-fadl j.9 hlm.362}. Menurut Al-Suyuti, ia adalah Ahmad ibn al-Mu'tasim, saudara al-Mutawakkil, yang ibunya adalah Mukhariq. Ketika al-Muntasir meninggal, para komandan berkumpul dan berkata, 'Kapan kalian akan mengambil keturunan al-Mutawakkil yang tersisa?' Mereka bersumpah setia kepada Ahmad, yang berusia dua puluh delapan tahun. Pada tahun lima puluh satu, orang Turki menolaknya ketika Waseef dan Bagha si Turki dibunuh. Dikatakan bahwa khalifah berada di dalam sangkar, mengucapkan apa yang dikatakan bigha kepadanya. Ia menjadi takut dan pergi ke Baghdad, di mana mereka mengusir al-Mu'tazz, bersumpah setia kepadanya, dan menggulingkannya. Al-Mu'tazz menyiapkan pasukan untuk melawannya, dan rakyat Baghdad bersiap untuk bertempur. Peristiwa itu berlangsung berbulan-bulan, dengan banyak pembunuhan dan harga yang tinggi. Pada tahun pertama lima puluh dua, ia dipenjara di Wasit selama sembilan bulan. Ia adalah yang pertama memperkenalkan penggunaan lengan lebar sekitar tiga rentang dan tudung kecil {cite:Tarikh-khulafa-minhaj-1434, hlm. 555-556}. Menurut Al-Mas'udi, ia memiliki pengetahuan yang baik tentang hari-hari manusia dan kabar mereka, mirip dengan masa lalu. Di antara laporannya adalah ia berkata kepada sahabatnya, 'Seolah-olah aku mengidam makanan.' Ketika ia diberi roti, roti, dan garam, ia berkata, 'Malam berikutnya, seolah-olah aku lapar.' Ia menjelaskan perbedaan antara kedua kata itu, dan meminta Al-Mas'udi untuk menggambarkan makanan, minuman, parfum, wanita, dan kuda. Ia berkata: Makanan terbaik adalah yang menyambut rasa lapar dengan rasa yang sesuai dengan hasrat. Dan wanita mana yang lebih lezat daripada meninggalkannya dengan enggan dan kembali kepada dia dan dewanya, maka ia memberinya dua ratus dinar. {cite: Muruj-al-Dhahab hlm. 536-538}, dan menurut al-Mas'udi, ia pergi ke rumah al-Hasan ibn Wahb di Baghdad, lalu ke Wasit, di mana Sa'id al-Hajib dibunuh dekat al-Qatil pada hari Rabu, enam bulan sebelum Syawal tahun 252 H, pada usia tiga puluh lima tahun. Sembilan bulan berlalu antara pencopotannya dan pembunuhannya serta hari {cite:muruj-al-dhahab hlm. 545-548}. Menurut al-Masudi, ia adalah yang pertama memperkenalkan pemakaian lengan lebar {cite:muruj-al-dhahab hlm. 554}"
