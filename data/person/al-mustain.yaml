label: { ar: "المستعين بالله", en: "al-Musta'in bi'llah" }
summary:
  ar: "خليفة عباسي، ذكر الطبري أن ابن طاهر عزم على خلعه سنة إحدى وخمسين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.337}، ثم خُلع وقُتل في سنة اثنتين وخمسين {cite:tabari-tarikh-abu-al-fadl j.9 p.348} {cite:tabari-tarikh-abu-al-fadl j.9 p.362}، وعند السيوطي هو أحمد بن المعتصم أخو المتوكل أمه مخارق، لما مات المنتصر اجتمع القواد وقالوا متى وليتم أحداً من ولد المتوكل لا يبقى منا باقية فبايعوا أحمد وله ثمان وعشرون سنة، وفي سنة إحدى وخمسين تنكر له الأتراك لما قتل وصيف وبغا باغراً التركي فقيل خليفة في قفص يقول ما قالا له كما تقول البيغا فخاف وانحدر إلى بغداد فأخرجوا المعتز وبايعوه وخلعوه، فجهز المعتز جيشاً لمحاربته واستعد أهل بغداد للقتال فدامت الواقعات أشهراً وكثر القتل وغلت الأسعار، وخلع نفسه في أول سنة اثنتين وخمسين وأحدر إلى واسط تسعة أشهر محبوساً، وهو أول من أحدث لبس الأكمام الواسعة نحو ثلاثة أشبار وصغر القلانس {cite:tarikh-khulafa-minhaj-1434 p. 555-556}. وعند المسعودي كان حسن المعرفة بأيام الناس وأخبارهم لهجاً بأخبار الماضين، ومن خبره أنه قال لنديمه كأني أشتهي الطعام فلما أطعم رغيفاً وخلاً وملحاً قال الليلة الثانية كأني جائع فبين له فرق ما بين الكلامين، وسأله يصف الطعام والشراب والطيب والنساء والخيل فقال أطيب الطعام ما لقي الجوع بطعم وافق شهوة وأي النساء أشهى من تخرج من عندها كارهاً وترجع إليها والهاً فأعطاه مائتي دينار {cite:muruj-al-dhahab p. 536-538}، وعند المسعودي أحدر إلى دار الحسن بن وهب ببغداد ثم إلى واسط وقتله سعيد الحاجب قرب القاطول يوم الأربعاء لست خلون من شوال سنة اثنتين وخمسين ومائتين وهو ابن خمس وثلاثين سنة، وبين خلعه وقتله تسعة أشهر ويوم {cite:muruj-al-dhahab p. 545-548}، وعند المسعودي كان أول من أحدث لبس الأكمام الواسعة {cite:muruj-al-dhahab p. 554}"
  en: "Abbasid caliph. Al-Tabari reports that Ibn Tahir resolved to depose him in 251 {cite:tabari-tarikh-abu-al-fadl j.9 p.337}; he was then deposed and killed in 252 {cite:tabari-tarikh-abu-al-fadl j.9 p.348} {cite:tabari-tarikh-abu-al-fadl j.9 p.362}. According to al-Suyuti he was Ahmad ibn al-Mu'tasim, brother of al-Mutawakkil, whose mother was Mukhariq. When al-Muntasir died the commanders gathered and said, 'If you make any of al-Mutawakkil's sons caliph, not one of us will be left', so they pledged allegiance to Ahmad, who was twenty-eight. In 251, when Wasif and Bugha Baghr the Turk were killed, the Turks turned against him; he was called 'a caliph in a cage, who says what the two of them tell him, as the parrot does'. Afraid, he went down to Baghdad. They brought out al-Mu'tazz, pledged allegiance to him, and deposed him. Al-Mu'tazz sent an army against him, and the people of Baghdad prepared to fight; the clashes went on for months, killing increased and prices rose. He deposed himself at the beginning of 252 and was sent down to Wasit, held in custody for nine months. He was the first to introduce wide sleeves, about three spans across, and to make caps smaller {cite:tarikh-khulafa-minhaj-1434 p. 555-556}. According to al-Mas'udi he knew well the days and reports of people and loved the accounts of the past. One anecdote: he told his boon-companion that he craved food; when a loaf, vinegar and salt were brought, on the second night he said he was hungry, and explained to him the difference between the two statements. He asked him to describe food, drink, perfume, women and horses. The best food, he answered, is what meets hunger with a taste that suits desire, and the most desirable woman is the one you leave unwillingly and return to besotted; so the caliph gave him two hundred dinars {cite:muruj-al-dhahab p. 536-538}. According to al-Mas'udi he was taken down to the house of al-Hasan ibn Wahb in Baghdad, then to Wasit; Sa'id al-Hajib killed him near al-Qatul on Wednesday, six nights into Shawwal 252, aged thirty-five. Nine months and a day lay between his deposition and his killing {cite:muruj-al-dhahab p. 545-548}. According to al-Mas'udi he was the first to introduce wide sleeves {cite:muruj-al-dhahab p. 554}."
