summary:
  ur: "ابو الولید محمد بن احمد بن رشد قرطبی ⁦(520-595ھ)⁩، ابن رشد الحفید، قرطبہ کے قاضی الجماعہ، مالکی فقیہ، طبیب اور فلسفی جنہیں اہلِ مغرب «ایورویس» کہتے ہیں؛ انہوں نے موطا اپنے والد کو زبانی سنائی، ابن بشکوال وغیرہ سے فقہ پڑھی، فقہ میں «بدایۃ المجتہد»، فلسفے میں «فصل المقال» اور «تہافت التہافت» اور طب میں «الکلیات» لکھیں؛ موحد خلیفہ المنصور کے ہاں مقرب رہے، پھر آزمائش میں ڈالے گئے اور ان کی کتابیں جلائی گئیں، اور مراکش میں فوت ہوئے {cite:bidaya-bakri-bayt-al-afkar p. 9} {cite:bidaya-bakri-bayt-al-afkar p. 13} {cite:al-aalam p. 849}۔"
  ar: "أبو الوليد محمد بن أحمد بن رشد الأندلسي، فيلسوف من أهل قرطبة يسميه الأفرنج «أفيرويس»؛ عُني بكلام أرسطو وترجمه إلى العربية وزاد عليه زيادات كثيرة وصنف نحو خمسين كتاباً منها «فصل المقال فيما بين الحكمة والشريعة من الاتصال» و«تهافت التهافت» في الرد على الغزالي و«بداية المجتهد ونهاية المقتصد» في الفقه و«الكليات» في الطب المترجم إلى اللاتينية والعبرانية؛ أجلّه الخليفة الموحدي المنصور وقدّمه ثم أوغر عليه خصومُه صدرَه فنفاه إلى مراكش وأُحرق بعض كتبه ثم رضي عنه وأذن له بالعودة فعاجلته الوفاة بمراكش سنة 595هـ الموافق 1198م ونُقل جثمانه إلى قرطبة {cite:al-aalam p. 849}."
  en: "Abu al-Walid Muhammad ibn Ahmad ibn Rushd of Cordoba — Averroes to the Latins; he devoted himself to Aristotle, translated him into Arabic and wrote some fifty works including Fasl al-maqal, Tahafut al-tahafut against al-Ghazali, Bidayat al-mujtahid and the Kulliyyat on medicine; the Almohad caliph al-Mansur honoured him, then exiled him to Marrakesh and had some of his books burned, then relented — he died there in 1198 and his body was carried to Cordoba {cite:al-aalam p. 849}."
