summary:
  ur: "ابو الولید محمد بن احمد بن رشد قرطبی، ابن رشد الحفید، قرطبہ کے قاضی، مالکی فقیہ، طبیب اور فلسفی تھے جنہیں مغرب میں ایورویس اور ارسطو کا شارح کہا گیا۔ دائرۃ المعارف الاسلامیہ کے مطابق وہ 520ھ/1126ء میں قرطبہ میں پیدا ہوئے، موحدی خلفا کے ہاں عنایت پائی، اور 595ھ/1198ء میں مراکش میں فوت ہوئے۔ ان کی تصانیف میں «فصل المقال»، «الکشف»، «تہافت التہافت»، «الکلیات» اور «بدایۃ المجتہد» شامل ہیں۔"
  ar: "أبو الوليد محمد بن أحمد بن رشد القرطبي، ابن رشد الحفيد، قاضي قرطبة وفقيه مالكي وطبيب وفيلسوف عُرف في الغرب بأفيرويس وشارح أرسطو. وُلد بقرطبة سنة 520هـ/1126م بحسب دائرة المعارف الإسلامية، ونال حظوة الخلفاء الموحدين، وتوفي بمراكش سنة 595هـ/1198م. من مؤلفاته «فصل المقال» و«الكشف» و«تهافت التهافت» و«الكليات» و«بداية المجتهد»."
  en: "Abu al-Walid Muhammad ibn Ahmad ibn Rushd of Cordoba, Ibn Rushd al-Hafid, was a judge of Cordoba, a Maliki jurist, a physician and a philosopher, known in the West as Averroes and the Commentator of Aristotle. According to the Encyclopaedia of Islam he was born in Cordoba in 520 AH/1126 CE, enjoyed the favour of the Almohad caliphs, and died in Marrakesh in 595 AH/1198 CE. His works include the Fasl al-Maqal, the Kashf, the Tahafut al-Tahafut, the Kulliyyat and Bidayat al-Mujtahid."
