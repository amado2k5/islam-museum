summary:
  ur: "ابو الولید محمد بن احمد بن رشد قرطبی، ابن رشد الحفید، قرطبہ کے قاضی، مالکی فقیہ، طبیب اور فلسفی تھے جنہیں مغرب میں ایورویس اور ارسطو کا شارح کہا گیا۔ دائرۃ المعارف الاسلامیہ کے مطابق وہ 520ھ/1126ء میں قرطبہ میں پیدا ہوئے، موحدی خلفا کے ہاں عنایت پائی، اور 595ھ/1198ء میں مراکش میں فوت ہوئے۔ ان کی تصانیف میں «فصل المقال»، «الکشف»، «تہافت التہافت»، «الکلیات» اور «بدایۃ المجتہد» شامل ہیں۔"
  ar: "أبو الوليد محمد بن أحمد بن رشد القرطبي، ابن رشد الحفيد، قاضي قرطبة وفقيه مالكي وطبيب وفيلسوف عُرف في الغرب بأفيرويس وشارح أرسطو. وُلد بقرطبة سنة 520هـ/1126م بحسب دائرة المعارف الإسلامية، ونال حظوة الخلفاء الموحدين، وتوفي بمراكش سنة 595هـ/1198م. من مؤلفاته «فصل المقال» و«الكشف» و«تهافت التهافت» و«الكليات» و«بداية المجتهد»."
  en: "Abu al-Walid Muhammad ibn Ahmad ibn Rushd of Cordoba, Ibn Rushd al-Hafid, was a judge of Cordoba, a Maliki jurist, a physician and a philosopher, known in the West as Averroes and the Commentator of Aristotle. According to the Encyclopaedia of Islam he was born in Cordoba in 520 AH/1126 CE, enjoyed the favour of the Almohad caliphs, and died in Marrakesh in 595 AH/1198 CE. His works include the Fasl al-Maqal, the Kashf, the Tahafut al-Tahafut, the Kulliyyat and Bidayat al-Mujtahid."
  es: "Abu al-Walid Muhammad ibn Ahmad ibn Rushd de Córdoba, Ibn Rushd al-Hafid, fue juez de Córdoba, jurista malikí, médico y filósofo, conocido en Occidente como Averroes y el Comentarista de Aristóteles. Según la Enciclopedia del Islam, nació en Córdoba en el año 520 de la Hégira (1126 d. C.), gozó del favor de los califas almohades y falleció en Marrakech en el año 595 de la Hégira (1198 d. C.). Entre sus obras destacan el Fasl al-Maqal, el Kashf, el Tahafut al-Tahafut, el Kulliyyat y el Bidayat al-Mujtahid."
  fr: "Abu al-Walid Muhammad ibn Ahmad ibn Rushd de Cordoue, dit Ibn Rushd al-Hafid, était un juge de Cordoue, un juriste malikite, un médecin et un philosophe, connu en Occident sous le nom d'Averroès et comme le commentateur d'Aristote. Selon l'Encyclopédie de l'Islam, il naquit à Cordoue en 520 AH (1126 ap. J.-C.), bénéficia de la faveur des califes almohades et mourut à Marrakech en 595 AH (1198 ap. J.-C.). Parmi ses œuvres figurent le Fasl al-Maqal, le Kashf, le Tahafut al-Tahafut, le Kulliyyat et le Bidayat al-Mujtahid."
  tr: "Ebu el-Velid Muhammed bin Ahmed bin Rüşd el-Kurtubi, torunu İbn Rüşd, Kordoba'nın hakimi, Maliki hukukçusu, hekim ve filozof, Batı'da Aphirois olarak bilinir ve Aristoteles yorumcusudur. İslam Ansiklopedisi'ne göre 520 Hicri / 1126 yılında Kordoba'da doğmuş ve Almohad halifeleri arasında beğeni kazanmıştır. 595 Hicri / 1198 yılında Marakeş'te ölmüştür. Eserleri arasında 'Fasl al-Maqal', 'Al-Kaşf', 'Tahafat al-Tahafat', 'Al-Kulliyat' ve 'Bidayat al-Mujtahid' bulunmaktadır."
  id: "Abu al-Walid Muhammad ibn Ahmad ibn Rushd al-Qurtubi, Ibn Rushd cucu, hakim Cordoba, ahli hukum Maliki, dokter, dan filsuf yang dikenal di Barat sebagai Aphirois serta komentator Aristoteles. Ia lahir di Cordoba pada tahun 520 H / 1126 M menurut Ensiklopedia Islam, dan mendapat dukungan dari khalifah Almohad. Ia meninggal di Marrakesh pada tahun 595 H / 1198 M. Di antara karya-karyanya adalah 'Fasl al-Maqal', 'Al-Kashf', 'Tahafat al-Tahafat', 'Al-Kulliyat', dan 'Bidayat al-Mujtahid'."
