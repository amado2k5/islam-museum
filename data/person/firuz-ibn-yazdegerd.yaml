summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك فيروز بن يزدجرد» {cite:tabari-tarikh-abu-al-fadl j.2 p.82}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "O, Sasani Perslerinin kralıydı ve el-Tabari'nin 'Fairuz Kralı ibn Yezdegerd'in Anılması' başlığıyla anılmıştır {cite:tabari-tarikh-abu-al-fadl j.2 s.82}. Bu yerde, saltanat yılları ve hikâyeleri hakkında söylenenler anlatılır."
  id: "Ia adalah raja Persia Sasanian, yang disebut oleh al-Tabari dengan judul 'Penyebutan Raja Fairuz ibn Yazdegerd' {cite:tabari-tarikh-abu-al-fadl j.2 hlm.82}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kisah-kisahnya diceritakan."
