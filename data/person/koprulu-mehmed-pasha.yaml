  en: "Köprülü Mehmed Pasha (d. 1661) — founder of the Köprülü vizier dynasty that answered Europe's Holy League; 'restored the state's awe' under the boy-sultan Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307-308}."
