  ar: "الصدر الأعظم محمد كوبريللي ⁦(ت. ١٠٧٢هـ/١٦٦١م)⁩؛ مؤسس عائلة كوبريللي التي قيّضها الله للدولة العثمانية في زمن السلطان محمد الرابع حين كوّنت أوروبا الحلف المقدس من النمسا وبولونيا والبندقية ورهبان مالطة والبابا وروسيا للوقوف في وجه المد الإسلامي، فأعاد محمد كوبريللي للدولة هيبتها وساهم في رد هجمات الأعداء وتقوية الدولة، وسار على نهجه من بعده ابنه أحمد كوبريللي {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  en: "Köprülü Mehmed Pasha (d. 1661) — founder of the Köprülü vizier dynasty that answered Europe's Holy League; 'restored the state's awe' under the boy-sultan Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  es: "Köprülü Mehmed Pasha (m. 1661) — fundador de la dinastía de visires Köprülü que respondió a la Liga Santa de Europa; 'restauró el respeto del estado' bajo el joven sultán Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  fr: "Köprülü Mehmed Pacha (d. 1661) — fondateur de la dynastie des vizirs Köprülü qui a répondu à la Sainte Ligue de l'Europe; « a restauré la crainte de l'État » sous le jeune sultan Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307-308}."
