summary:
  ar: "الصدر الأعظم محمد كوبريللي ⁦(ت. ١٠٧٢هـ/١٦٦١م)⁩؛ مؤسس عائلة كوبريللي التي قيّضها الله للدولة العثمانية في زمن السلطان محمد الرابع حين كوّنت أوروبا الحلف المقدس من النمسا وبولونيا والبندقية ورهبان مالطة والبابا وروسيا للوقوف في وجه المد الإسلامي، فأعاد محمد كوبريللي للدولة هيبتها وساهم في رد هجمات الأعداء وتقوية الدولة، وسار على نهجه من بعده ابنه أحمد كوبريللي {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  en: "Köprülü Mehmed Pasha (d. 1661) — founder of the Köprülü vizier dynasty that answered Europe's Holy League; 'restored the state's awe' under the boy-sultan Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  es: "Köprülü Mehmed Pasha (m. 1661) — fundador de la dinastía de visires Köprülü que respondió a la Liga Santa de Europa; 'restauró el respeto del estado' bajo el joven sultán Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  fr: "Köprülü Mehmed Pacha (d. 1661) — fondateur de la dynastie des vizirs Köprülü qui a répondu à la Sainte Ligue de l'Europe; « a restauré la crainte de l'État » sous le jeune sultan Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  ur: "Köprülü Mehmed Pasha (d. 1661) — Köprülü ویزیر خاندان کا بانی جس نے یورپ کی ہولی لیگ کو جواب دیا۔ لڑکے-سلطان محمد چہارم کے تحت 'ریاست کا خوف بحال کیا' 307-308}۔"
  tr: "Sadrazam Mehmed Koprilli (ö. 1072 Hicri / 1661 M.S.); Tanrı'nın Osmanlı İmparatorluğu'na Sultan IV. Mehmed döneminde Osmanlı İmparatorluğu'na verdiği ailenin kurucusudur; Avrupa, Avusturya, Polonya, Venedik, Malta keşişleri, Papa ve Rusya'nın İslam akınına karşı durduğu Kutsal İttifak'ı kurmuştur. Mehmed Koprilli devletin prestijini yeniden kazandırdı ve düşman saldırılarını püskürtmeye ve devletin güçlendirilmesine katkıda bulundu. Oğlu Ahmed Koprilli onun yolunu izledi {atıf:dawlat-uthmaniyya-salabi s. 307-308}."
  id: "Wazir Agung Mehmed Koprilli (wafat 1072 H / 1661 M); pendiri keluarga Kopreli, yang diberikan Tuhan kepada Kekaisaran Ottoman pada masa pemerintahan Sultan Mehmed IV ketika Eropa membentuk Aliansi Suci Austria, Polandia, Venesia, para biarawan Malta, Paus, dan Rusia untuk melawan arus Islam. Mehmed Koprilli mengembalikan prestise negara dan berkontribusi dalam menangkis serangan musuh serta memperkuat negara. Putranya Ahmed Koprilli mengikuti jalannya {cite:dawlat-uthmaniyya-salabi hlm. 307-308}."
