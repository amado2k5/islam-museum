summary:
  ar: حقوقية ودبلوماسية غامبية وُلدت سنة 1961. أول امرأة أفريقية تتولى منصب المدعي العام للمحكمة الجنائية الدولية ⁦(2012–2021)⁩، ومفوّضة غامبيا العليا لدى بريطانيا منذ سنة 2022.
  en: Gambian jurist and diplomat, born 1961. The first African woman to serve as Chief Prosecutor of the International Criminal Court (2012–2021), and The Gambia's High Commissioner to the United Kingdom
    since 2022.
  ur: گیامبیائی قانون دان اور سفارت کار، 1961 میں پیدا ہوئیں۔ بین الاقوامی فوجداری عدالت کی چیف پراسیکیوٹر کے منصب پر فائز پہلی افریقی خاتون ⁦(2012–2021)⁩، اور 2022 سے برطانیہ میں گیامبیا کی ہائی کمشنر۔
  es: "Jurista y diplomática gambiana, nacida en 1961. Fue la primera mujer africana en ejercer como Fiscal Jefe de la Corte Penal Internacional (2012-2021) y Alta Comisionada de Gambia ante el Reino Unido desde 2022."
  fr: "Juriste et diplomate gambienne, née en 1961. Première femme africaine à occuper le poste de procureure en chef de la Cour pénale internationale (2012-2021), et haute-commissaire de la Gambie au Royaume-Uni depuis 2022."
  tr: "1961 doğumlu bir Gambiyalı insan hakları aktivisti ve diplomat. Uluslararası Ceza Mahkemesi'nin (2012–2021) savcısı olarak görev yapan ilk Afrikalı kadın ve 2022'den beri Gambiya'nın Britanya'daki Yüksek Komiserliği."
  id: "Seorang aktivis hak asasi manusia dan diplomat asal Gambia yang lahir pada tahun 1961. Wanita Afrika pertama yang menjabat sebagai Jaksa Pengadilan Kriminal Internasional (2012–2021), dan Komisaris Tinggi Gambia untuk Inggris sejak 2022."
