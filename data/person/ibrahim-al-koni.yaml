summary:
  ar: "روائي ليبي طوارقي، وُلد سنة 1948. من أكثر الروائيين العرب إنتاجًا بأكثر من ثمانين عملًا تستكشف أساطير الصحراء والتصوف والبقاء الإنساني، ومن رواياته «التبر» و«أنوبيس» و«نزيف الحجر»."
  en: "Tuareg-Libyan novelist, born in 1948. One of the most prolific Arab novelists with over eighty works exploring Sahara mythology, Sufism and human survival, including Gold Dust, The Bleeding of the Stone and Anubis."
  ur: "طارق نژاد لیبی ناول نگار، 1948 میں پیدا ہوئے۔ وہ اسی سے زائد کتب کے ساتھ سب سے زیادہ پیدا کرنے والے عرب ناول نگاروں میں ہیں جو صحرا کے اساطیر، تصوف اور انسانی بقا کا جائزہ لیتے ہیں؛ ناولوں میں «التبر»، «أنوبيس» اور «نزيف الحجر» شامل ہیں۔"
  es: "Novelista tuareg-libia, nacida en 1948. Una de las novelistas árabes más prolíficas, con más de ochenta obras que exploran la mitología del Sáhara, el sufismo y la supervivencia humana, entre las que destacan Polvo de oro, El sangrado de la piedra y Anubis."
  fr: "Romancier touareg-libyen, né en 1948. L'un des romanciers arabes les plus prolifiques, avec plus de quatre-vingts œuvres explorant la mythologie du Sahara, le soufisme et la survie humaine, dont Poussière d'or, Le Saignement de la pierre et Anubis."
  tr: "1948 doğumlu Libyalı bir Tuareg romancı. Çöl mitlerini, mistisizmi ve insan hayatta kalmasını inceleyen seksenden fazla eseri olan en üretken Arap romancılarından biridir. Romanları arasında 'Hediye', 'Anubis' ve 'Taşın Kanaması' yer alır."
  id: "Seorang novelis Tuareg Libya, lahir tahun 1948. Ia adalah salah satu novelis Arab paling produktif, dengan lebih dari delapan puluh karya yang mengeksplorasi mitos gurun, mistisisme, dan kelangsungan hidup manusia. Di antara novel-novelnya adalah 'The Gift,' 'Anubis,' dan 'The Bleeding of the Stone.'"
