summary:
  en: "A Meccan diplomat who opposed the Muslims until 629–630, then converted and became the commander who conquered Egypt — and later Mu'awiya's chief ally in the first civil war."
  ar: "دبلوماسي مكي عارض المسلمين حتى 629–630م ثم أسلم وصار القائد الذي فتح مصر، وبعدها حليف معاوية الأول في الفتنة الأولى.، وحكي عنه حين كان بمصر أنه رام حفر طريق بين بحر القلزم وبحر الروم فمنعه منه عمر بن الخطاب مخافة أن تنتهي مراكب الروم إلى بحر الحجاز فتطرح سراياها مما يلي جدة {cite:muruj-al-dhahab p. 558}، وكتب إلى معاوية يهزه ويشير عليه بالمطالبة بدم عثمان فلما طلب بيعته قال لا والله لا أعطيك من ديني حتى أنال من دنياك قال سل قال مصر طعمة فأجابه وكتب له بها {cite:muruj-al-dhahab p. 647}"
