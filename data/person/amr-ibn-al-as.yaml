summary:
  en: "A Meccan diplomat who opposed the Muslims until 629–630, then converted and became the commander who conquered Egypt — and later Mu'awiya's chief ally in the first civil war."
  ar: "دبلوماسي مكي عارض المسلمين حتى 629–630م ثم أسلم وصار القائد الذي فتح مصر، وبعدها حليف معاوية الأول في الفتنة الأولى. وحكي عنه حين كان بمصر أنه رام حفر طريق بين بحر القلزم وبحر الروم فمنعه منه عمر بن الخطاب مخافة أن تنتهي مراكب الروم إلى بحر الحجاز فتطرح سراياها مما يلي جدة {cite:muruj-al-dhahab p. 558}، وكتب إلى معاوية يهزه ويشير عليه بالمطالبة بدم عثمان فلما طلب بيعته قال لا والله لا أعطيك من ديني حتى أنال من دنياك قال سل قال مصر طعمة فأجابه وكتب له بها {cite:muruj-al-dhahab p. 647}، واختاره أهل الشام حكماً عنهم، وأوصاه معاوية أن يؤخر الحز ويطبق المفصل ولا يلقي أبا موسى برأيه كله، فلما التقيا قال لأبي موسى تكلم وقل خيراً فأبى فقال ما كنت لأقدم نفسي قبلك ولك حقوق لسنك وصحبتك وأنت ضيف فحمد الله أبو موسى وبدأ الكلام {cite:muruj-al-dhahab p. 686}، وأشار على معاوية بالكوفة أن يأمر الحسن فيخطب ليظهر للناس عيه، فخطب الحسن في بديهته فأجاد {cite:muruj-al-dhahab p. 720-721}"
  ur: "مکی سفارت کار جو 629–630 تک مسلمانوں کے خلاف رہا، پھر مسلمان ہوا اور وہ سردار بنا جس نے مصر فتح کیا — اور بعد میں معاویہ کا بڑا حلیف۔"
  es: "Un diplomático de La Meca que se opuso a los musulmanes hasta 629-630, luego se convirtió y llegó a ser el comandante que conquistó Egipto, y más tarde el principal aliado de Mu'awiya en la primera guerra civil."
  fr: "Un diplomate mecquois qui s'opposa aux musulmans jusqu'en 629-630, puis se convertit et devint le commandant qui conquit l'Égypte — et plus tard le principal allié de Mu'awiya lors de la première guerre civile."
  tr: "Mekkeli bir diplomat, 629–630 yıllarına kadar Müslümanlara karşı çıktı, ardından İslam'a geçti ve Mısır'ı fetheden lider oldu, daha sonra Birinci Fitne'de Muaviye I'in müttefiki oldu. Mısır'dayken Kızam Denizi ile Roma Denizi arasında bir yol kazmak üzereyken, Ömer bin el-Hattab'ın, Roma gemilerinin Hicaz Denizi'ne varmasından ve seferlerinin aşağıdaki Cidde'den başlatılmasından korktuğu anlatılmaktadır. Muaviye'ye yazdı, onu sarsmak ve Osman'ın kanını istemek için işaret verdi. Yemini istediğinde, 'Hayır, Allah aşkına, dünyevi hayatından kurtulana kadar dinimi vermeyeceğim.' dedi. 'Sor.' dedi. 'Mısır bir tattır.' dedi. Cevap verdi ve ona yazdı. {alıntı: Muruj-al-Dhahab s. 647} ve Levant halkı onu yargıç olarak seçti. Muaviye ona ayrılığı geciktirmesini, ortak uygulamayı uygulamasını ve Abu Musa'yı tamamen göz ardı etmemesini tavsiye etti. Buluştuklarında, Abu Musa'ya 'İyi konuş ve iyi konuş,' dedi ama o reddetti. Dedi ki, 'Kendimi sana sunmazdım, misafir olduğun sürece yaşın ve arkadaşlığın için hakların var.' Ebu Musa Allah'ı övdü ve konuşmaya başladı. Kufa'daki Muaviye'ye, el-Hasan'a bilgisini halka göstermek için vaaz vermesini tavsiye etti. El-Hasan konuşmayı sezgisel olarak yaptı ve üstün performans gösterdi. {alıntı:Muruj-al-Dhahab s. 720-721}"
  id: "Seorang diplomat Mekah menentang Muslim hingga tahun 629–630 M, kemudian memeluk Islam dan menjadi pemimpin yang menaklukkan Mesir, dan kemudian menjadi sekutu Muawiya I dalam Fitnah Pertama. Diceritakan bahwa ketika ia berada di Mesir, ia hendak menggali jalan antara Laut Qizam dan Laut Romawi, tetapi Umar ibn al-Khattab mencegahnya melakukannya karena takut kapal-kapal Romawi akan berakhir di Laut Hijaz dan ekspedisi mereka akan diluncurkan dari Jeddah berikut {cite:muruj-al-dhahab hlm. 558}. Ia menulis kepada Muawiyah untuk mengguncangnya dan memberi sinyal agar menuntut darah Uthman. Ketika ia meminta janjinya, ia berkata, 'Tidak, demi Tuhan, aku tidak akan memberikan agamaku-ku sampai aku menyingkirkan kehidupan duniawimu.' Ia berkata, 'Minta.' Ia berkata, 'Mesir adalah rasa.' Ia menjawab dan menulis tentang hal itu. {cite: Muruj-al-Dhahab hlm. 647} dan rakyat Levant memilihnya sebagai hakim mereka. Muawiyah menasihatinya untuk menunda perpecahan dan menerapkan perjanjian bersama serta tidak menolak Abu Musa sepenuhnya. Ketika mereka bertemu, dia berkata kepada Abu Musa, 'Bicaralah dan bicara dengan baik,' tetapi dia menolak. Dia berkata, 'Aku tidak akan menawarkan diriku di hadapanmu, dan kamu memiliki hak atas usia dan persahabatanmu selama kamu menjadi tamu.' Abu Musa memuji Tuhan dan mulai berbicara. Dia menasihati Muawiyah di Kufa untuk memerintahkan al-Hasan memberikan khotbah guna menunjukkan pengetahuannya kepada rakyat. Al-Hasan menyampaikan pidato itu dengan intuitif dan unggul. {cite:muruj-al-dhahab hlm. 720-721}"
