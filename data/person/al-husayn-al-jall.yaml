summary:
  ar: "الحسين بن علي أبو عبد الله البصري المعروف بالجَلّ ⁦(ت 368هـ تقريباً)⁩؛ سكن بغداد وكان من شيوخ المعتزلة وصنّف على مذاهبهم وانتحل في الفروع مذهب أهل العراق، وصُلّي عليه بالإمام أبي علي الفارسي ودُفن في تربة أستاذه أبي الحسن الكرخي بدرب الحسن بن زيد، وكان قد قارب الثمانين سنة {cite:muntazam-ibn-al-jawzi j.7 p.106}."
  en: "Al-Husayn b. 'Ali Abu 'Abd Allah al-Basri, known as al-Jall (d. c. 368), who settled at Baghdad among the shaykhs of the Mu'tazila, composed on their doctrines and took the Iraqi school's positions in the branches; Abu 'Ali al-Farisi led his funeral prayer and he was buried in the plot of his teacher Abu'l-Hasan al-Karkhi in Darb al-Hasan b. Zayd, at nearly eighty {cite:muntazam-ibn-al-jawzi j.7 p.106}."
  es: "Al-Husayn b. 'Ali Abu 'Abd Allah al-Basri, conocido como al-Jall (dc 368), quien se estableció en Bagdad entre los shaykhs de los Mu'tazila, compuso sobre sus doctrinas y tomó los puestos de la escuela iraquí en las ramas; Abu 'Ali al-Farisi dirigió su oración fúnebre y fue enterrado en la parcela de su maestro Abu'l-Hasan al-Karkhi en Darb al-Hasan b. Zayd, a casi ochenta años {cite:muntazam-ibn-al-jawzi j.7 p.106}."
  fr: "Al-Husayn b. 'Ali Abu 'Abd Allah al-Basri, connu sous le nom d'al-Jall (mort en 368), qui s'installa à Bagdad parmi les cheikhs des Mu'tazilites, composa sur leurs doctrines et prit les positions de l'école irakienne dans les branches; Abu 'Ali al-Farisi dirigea la prière funéraire et il fut enterré dans la parcelle de son maître Abu'l-Hasan al-Karkhi à Darb al-Hasan b. Zayd, à près de quatre-vingts ans {cite:muntazam-ibn-al-jawzi j.7 p.106}."
  ur: "الحسین بی علی ابو عبد اللہ البصری المعروف الجل ⁦(ڈی سی 368)⁩، جو بغداد میں معتزلہ کے شیوخ کے درمیان آباد ہوئے، اپنے عقائد پر مرتب ہوئے اور عراقی مکتب کی شاخوں میں جگہیں لے لیں۔ ابو علی الفارسی نے ان کی نماز جنازہ پڑھائی اور آپ کو دارب الحسن بن میں اپنے استاد ابوالحسن الکرخی کے پلاٹ میں دفن کیا گیا۔ زید، اسّی کے قریب {حوالہ:منتظم ابن الجوزی ج7 ص106}۔"
