summary:
  ar: "الحسين بن علي أبو عبد الله البصري المعروف بالجَلّ (ت 368هـ تقريباً)؛ سكن بغداد وكان من شيوخ المعتزلة وصنّف على مذاهبهم وانتحل في الفروع مذهب أهل العراق، وصُلّي عليه بالإمام أبي علي الفارسي ودُفن في تربة أستاذه أبي الحسن الكرخي بدرب الحسن بن زيد، وكان قد قارب الثمانين سنة {cite:muntazam-ibn-al-jawzi j.7 p.106}."
  en: "Al-Husayn b. 'Ali Abu 'Abd Allah al-Basri, known as al-Jall (d. c. 368), who settled at Baghdad among the shaykhs of the Mu'tazila, composed on their doctrines and took the Iraqi school's positions in the branches; Abu 'Ali al-Farisi led his funeral prayer and he was buried in the plot of his teacher Abu'l-Hasan al-Karkhi in Darb al-Hasan b. Zayd, at nearly eighty {cite:muntazam-ibn-al-jawzi j.7 p.106}."
