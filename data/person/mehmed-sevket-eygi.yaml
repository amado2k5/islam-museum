summary:
  ar: "محمد شوكت أيغي ⁦(7 فبراير 1933 – 12 يوليو 2019)⁩ صحفي وكاتب عمود وناشر تركي؛ أخرج مجلة «إسلام» (1957) ثم صحيفة «بوغون» اليومية (1966) التي ارتبطت مقالاته فيها بأحداث «الأحد الدامي» سنة 1969، وعاش سنوات في المنفى الاختياري، ثم كتب عموده في «مللي غازته» من 1991 حتى وفاته. وثّقت الأبحاث الأكاديمية وتقارير رسمية ألمانية نشره نظريات مؤامرة معادية للسامية وإنكاره للهولوكوست، كما عُرف بدفاعه المعلن عن أهل السنة والجماعة."
  en: "Mehmed Şevket Eygi (7 February 1933 – 12 July 2019) was a Turkish journalist, columnist and publisher. He brought out the magazine İslam in 1957 and the daily Bugün in 1966, whose pages carried his February 1969 call that preceded the 'Bloody Sunday' attack; after years abroad he wrote his column in Millî Gazete from 1991 until his death. Academic studies and German official reports document his propagation of antisemitic conspiracy theories and his Holocaust denial; he was also known for his professed defence of the Ahl al-Sunnah wa'l-Jama'a."
  ur: "محمد شوکت ایگی ⁦(7 فروری 1933ء – 12 جولائی 2019ء)⁩ ترک صحافی، کالم نگار اور ناشر تھے؛ انھوں نے رسالہ «اسلام» ⁦(1957ء)⁩ اور پھر روزنامہ «بوگون» ⁦(1966ء)⁩ نکالا، جس میں ان کی فروری 1969ء کی تحریر «خونی اتوار» کے واقعے سے پہلے آئی؛ کچھ برس بیرونِ ملک گزارنے کے بعد وہ 1991ء سے وفات تک «مللی گازیتہ» میں کالم لکھتے رہے۔ علمی تحقیقات اور جرمن سرکاری رپورٹوں نے ان کی یہود مخالف سازشی نظریات کی اشاعت اور ہولوکاسٹ سے انکار کو دستاویزی شکل دی ہے؛ وہ اہلِ سنت والجماعت کے اپنے اعلانیہ دفاع کے لیے بھی جانے جاتے تھے۔"
