summary:
  ar: "محمد شوكت أيغي ⁦(7 فبراير 1933 – 12 يوليو 2019)⁩ صحفي وكاتب عمود وناشر تركي؛ أخرج مجلة «إسلام» (1957) ثم صحيفة «بوغون» اليومية (1966) التي ارتبطت مقالاته فيها بأحداث «الأحد الدامي» سنة 1969، وعاش سنوات في المنفى الاختياري، ثم كتب عموده في «مللي غازته» من 1991 حتى وفاته. وثّقت الأبحاث الأكاديمية وتقارير رسمية ألمانية نشره نظريات مؤامرة معادية للسامية وإنكاره للهولوكوست، كما عُرف بدفاعه المعلن عن أهل السنة والجماعة."
  en: "Mehmed Şevket Eygi (7 February 1933 – 12 July 2019) was a Turkish journalist, columnist and publisher. He brought out the magazine İslam in 1957 and the daily Bugün in 1966, whose pages carried his February 1969 call that preceded the 'Bloody Sunday' attack; after years abroad he wrote his column in Millî Gazete from 1991 until his death. Academic studies and German official reports document his propagation of antisemitic conspiracy theories and his Holocaust denial; he was also known for his professed defence of the Ahl al-Sunnah wa'l-Jama'a."
  ur: "محمد شوکت ایگی ⁦(7 فروری 1933ء – 12 جولائی 2019ء)⁩ ترک صحافی، کالم نگار اور ناشر تھے؛ انھوں نے رسالہ «اسلام» ⁦(1957ء)⁩ اور پھر روزنامہ «بوگون» ⁦(1966ء)⁩ نکالا، جس میں ان کی فروری 1969ء کی تحریر «خونی اتوار» کے واقعے سے پہلے آئی؛ کچھ برس بیرونِ ملک گزارنے کے بعد وہ 1991ء سے وفات تک «مللی گازیتہ» میں کالم لکھتے رہے۔ علمی تحقیقات اور جرمن سرکاری رپورٹوں نے ان کی یہود مخالف سازشی نظریات کی اشاعت اور ہولوکاسٹ سے انکار کو دستاویزی شکل دی ہے؛ وہ اہلِ سنت والجماعت کے اپنے اعلانیہ دفاع کے لیے بھی جانے جاتے تھے۔"
  es: "Mehmed Şevket Eygi (7 de febrero de 1933 - 12 de julio de 2019) fue un periodista, columnista y editor turco. Fundó la revista İslam en 1957 y el diario Bugün en 1966, cuyas páginas publicaron su llamamiento de febrero de 1969, que precedió al ataque del «Domingo Sangriento». Tras años en el extranjero, escribió su columna en Millî Gazete desde 1991 hasta su muerte. Estudios académicos e informes oficiales alemanes documentan su propagación de teorías conspirativas antisemitas y su negación del Holocausto; también fue conocido por su defensa declarada de Ahl al-Sunnah wa'l-Jama'a."
  fr: "Mehmed Şevket Eygi (7 février 1933 – 12 juillet 2019) était un journaliste, chroniqueur et éditeur turc. Il a fondé le magazine İslam en 1957 et le quotidien Bugün en 1966, dont les pages ont publié son appel de février 1969, précédant l'attentat du « Dimanche sanglant ». Après plusieurs années passées à l'étranger, il a tenu une chronique dans Millî Gazete de 1991 jusqu'à sa mort. Des études universitaires et des rapports officiels allemands attestent de sa diffusion de théories du complot antisémites et de son négationnisme; il était également connu pour sa défense affichée de l'Ahl al-Sunnah wa'l-Jama'a."
  tr: "Mehmet Şukat Ayğı (7 Şubat 1933 – 12 Temmuz 2019), Türk gazeteci, köşe yazarı ve yayıncıydı; \"İslam\" dergisini (1957) ve ardından 1966'da yazdığı günlük gazete \"Bogun\"u yönetti; bu gazetede makaleleri 1969'daki \"Kanlı Pazar\" olaylarıyla bağlantılı olarak yer aldı. Yıllarca gönüllü sürgünde yaşadı, ardından 1991'den ölümüne kadar \"Melli Gazette\"de köşe yazısı yazdı. Akademik araştırmalar ve resmi Alman raporları, antisemitik komplo teorilerini ve Holokost inkârını yayımladığını belgeledi; ayrıca Ahl-al-Sunnah wal-Jama'ah'ı açıkça savunmasıyla da tanındı."
  id: "Mehmet Şukat Ayğı (7 Februari 1933 – 12 Juli 2019) adalah seorang jurnalis, kolumnis, dan penerbit Turki; ia memimpin majalah \"Islam\" (1957) dan kemudian surat kabar harian \"Bogun\" (1966), di mana artikel-artikelnya dikaitkan dengan peristiwa \"Bloody Sunday\" pada tahun 1969. Ia hidup bertahun-tahun dalam pengasingan sukarela, kemudian menulis kolomnya di \"Melli Gazette\" dari tahun 1991 hingga wafatnya. Penelitian akademis dan laporan resmi Jerman mendokumentasikan publikasi teori konspirasi anti-Semit dan penyangkalan Holocaust, dan ia juga dikenal karena pembelaannya yang tegas terhadap Ahl al-Sunnah wal-Jama'ah."
