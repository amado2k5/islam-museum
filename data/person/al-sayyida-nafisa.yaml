summary:
  ar: "نفيسة ابنة أبي محمد الحسن بن زيد بن الحسن بن علي بن أبي طالب، المعروفة بالسيدة نفيسة؛ من نساء أهل البيت الصالحات التقيات؛ أقامت بمصر في موضع مشهدها بدرب السباع بين القاهرة ومصر، وروي أن الإمام الشافعي لما دخل مصر حضر إليها وسمع عليها الحديث، ولما توفي أُدخلت جنازته إليها فصلت عليه في دارها؛ عزم زوجها المؤتمن إسحاق بن جعفر الصادق على حملها إلى المدينة لدفنها فسأله المصريون بقاءها فدُفنت بمصر، وقبرها معروف بإجابة الدعاء وهو يُزار {cite:wafayat-ayan}."
  en: "Nafisa bt. al-Hasan b. Zayd b. al-Hasan b. Ali b. Abi Talib — al-Sayyida Nafisa; a devout Alid woman who settled in Cairo; al-Shafi'i attended her hadith sessions and she prayed over his funeral in her house; her Cairo shrine is still a pilgrimage site {cite:wafayat-ayan}."
