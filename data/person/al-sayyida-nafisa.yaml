summary:
  ar: "نفيسة ابنة أبي محمد الحسن بن زيد بن الحسن بن علي بن أبي طالب، المعروفة بالسيدة نفيسة؛ من نساء أهل البيت الصالحات التقيات؛ أقامت بمصر في موضع مشهدها بدرب السباع بين القاهرة ومصر، وروي أن الإمام الشافعي لما دخل مصر حضر إليها وسمع عليها الحديث، ولما توفي أُدخلت جنازته إليها فصلت عليه في دارها؛ عزم زوجها المؤتمن إسحاق بن جعفر الصادق على حملها إلى المدينة لدفنها فسأله المصريون بقاءها فدُفنت بمصر، وقبرها معروف بإجابة الدعاء وهو يُزار {cite:wafayat-ayan}."
  en: "Nafisa bt. al-Hasan b. Zayd b. al-Hasan b. Ali b. Abi Talib — al-Sayyida Nafisa; a devout Alid woman who settled in Cairo; al-Shafi'i attended her hadith sessions and she prayed over his funeral in her house; her Cairo shrine is still a pilgrimage site {cite:wafayat-ayan}."
  fr: "Nafisa bt. al-Hasan b. Zayd b. al-Hasan b. Ali b. Abi Talib – al-Sayyida Nafisa ; une femme Alid dévote qui s'est installée au Caire ; al-Shafi'i a assisté à ses sessions de hadith et elle a prié pour ses funérailles dans sa maison ; son sanctuaire du Caire est toujours un lieu de pèlerinage {cite:wafayat-ayan}."
  es: "Nafisa bt. al-Hasan b. Zayd b. al-Hasan b. Ali b. Abi Talib — al-Sayyida Nafisa; una devota mujer alid que se estableció en El Cairo; al-Shafi'i asistió a sus sesiones de hadices y ella rezó por su funeral en su casa; su santuario en El Cairo sigue siendo un lugar de peregrinación {cite:wafayat-ayan}."
  ur: "نفیسہ بی ٹی۔ الحسن بی زید بی۔ الحسن بی علی بی ابی طالب - السیدہ نفیسہ؛ قاہرہ میں آباد ہونے والی ایک پرہیزگار الید خاتون؛ الشافعی اس کی حدیث کی نشستوں میں شریک ہوا اور اس نے اپنے گھر میں اس کی نماز جنازہ پڑھی۔ اس کا قاہرہ کا مزار اب بھی زیارت گاہ ہے۔"
  tr: "Nafisa, Ebu Muhammed el-Hasan ibn Zayd ibn al-Hasan ibn Ali ibn Abi Talib'in kızı ve Lady Nafisa'nın kızıdır; Ehl al-Bayt'in doğru ve dindar kadınlarından biriydi. Doğduğu yer, Kahire ile Mısır arasında yer alan Darb al-Siba'a'da Mısır'da ikamet eder. İmam al-Şafi'i Mısır'a girdiğinde gelip onun hakkında hadisi duyduğu rivayet edilir. Öldüğünde cenazesi oraya getirildi ve evinde onun için dua etti. Güvenilir eşi İshaq bin Ca'far al-Sadiq, onu gömülmek üzere Medine'ye götürmeye karar verdi, ancak Mısırlılar kalmasını istediği için Mısır'da defnedildi. Mezarı, ziyaret edildiğinde namaz kabul edilmesiyle bilinir {atıf:wafayat-ayan}."
  id: "Nafisa, putri Abu Muhammad al-Hasan ibn Zayd ibn al-Hasan ibn Ali ibn Abi Talib, yang dikenal sebagai Lady Nafisa, adalah salah satu wanita yang benar dan saleh di Ahl al-Bayt. Dia tinggal di Mesir di tempat kelahirannya di Darb al-Siba'a antara Kairo dan Mesir. Diceritakan bahwa ketika Imam al-Shafi'i memasuki Mesir, dia datang dan mendengar hadits tentang Nafisa. Ketika dia meninggal, pemakamannya dibawa ke sana dan dia berdoa untuknya di rumahnya. Suaminya yang dipercaya, Ishaq ibn Ja'far al-Sadiq, memutuskan untuk membawanya ke Madinah untuk dimakamkan, tetapi orang Mesir memintanya tinggal, sehingga dia dimakamkan di Mesir. Makamnya dikenal sebagai tempat penerimaan doa saat dikunjungi {cite:wafayat-ayan}."
