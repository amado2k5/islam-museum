label: { ar: "نصيب الشاعر", en: "Nusayb the Poet" }
summary:
  ar: "نصيب الشاعر؛ كان عبداً أسود لرجل من أهل وادي القرى فكاتب على نفسه ومدح عبد العزيز بن مروان فاشترى ولاءه؛ وكنيته أبو الحجناء وقيل أبو محجن؛ حضر يوماً هو والفرزدق عند سليمان بن عبد الملك وهو يومئذ خليفة فأنشد الفرزدق في مدح أبيه فأعرض عنه سليمان كالمغضب فأنشد نصيب في رويّتها فقال سليمان للفرزدق: كيف تراه؟ فقال: هو أشعر أهل جلدته {cite:wafayat-ayan}."
  en: "Nusayb — the black slave-poet of Wadi al-Qura who bought his freedom by praising Abd al-Aziz b. Marwan; at Sulayman b. Abd al-Malik's court he outshone al-Farazdaq, who conceded 'he is the best poet of his kind' {cite:wafayat-ayan}."
