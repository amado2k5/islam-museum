summary:
  ar: "نصيب الشاعر؛ كان عبداً أسود لرجل من أهل وادي القرى فكاتب على نفسه ومدح عبد العزيز بن مروان فاشترى ولاءه؛ وكنيته أبو الحجناء وقيل أبو محجن؛ حضر يوماً هو والفرزدق عند سليمان بن عبد الملك وهو يومئذ خليفة فأنشد الفرزدق في مدح أبيه فأعرض عنه سليمان كالمغضب فأنشد نصيب في رويّتها فقال سليمان للفرزدق: كيف تراه؟ فقال: هو أشعر أهل جلدته {cite:wafayat-ayan}."
  en: "Nusayb — the black slave-poet of Wadi al-Qura who bought his freedom by praising Abd al-Aziz b. Marwan; at Sulayman b. Abd al-Malik's court he outshone al-Farazdaq, who conceded 'he is the best poet of his kind' {cite:wafayat-ayan}."
  es: "Nusayb, el esclavo-poeta negro de Wadi al-Qura que compró su libertad alabando a Abd al-Aziz b. Marwan, en la corte de Sulayman b. Abd al-Malik eclipsó a al-Farazdaq, quien admitió que \"es el mejor poeta de su clase\" {cite:wafayat-ayan}."
  fr: "Nusayb — le poète esclave noir de Wadi al-Qura qui acheta sa liberté en faisant l'éloge d'Abd al-Aziz b. Marwan; à la cour de Sulayman b. Abd al-Malik, il surpassa al-Farazdaq, qui concéda qu'« il est le meilleur poète de son genre » {cite:wafayat-ayan}."
  ur: "نصائب - وادی القراء کا سیاہ غلام شاعر جس نے عبد العزیز بن کی تعریف کرکے اپنی آزادی خریدی۔ مروان؛ سلیمان بی میں عبد الملک کے دربار میں اس نے الفرازدق کو پیچھے چھوڑ دیا، جس نے اعتراف کیا کہ 'وہ اپنی نوعیت کا بہترین شاعر ہے'۔"
  tr: "Şair Nasib, köy vadisinden bir adamın kara kölesiydi. Kendine yazdı ve Abdulaziz bin Mervan'ı övdü, böylece sadakatini satın aldı; lakabı Ebu el-Hujna'ydı ve Ebu Mühcan denir. Bir gün, o ve el-Farazdaq, o zamanlar halife olan Süleyman bin Abdülmelik'i ziyaret ettiler. El-Farazdaq babasını övdü, fakat Süleyman öfkeli bir adam gibi ondan uzaklaştı. Nasib'i anlattı ve Süleyman el-Ferazdaq'a şöyle dedi: Onu nasıl görüyorsun? Dedi ki: O, türünün en şiirsel olanıdır. {alıntı:vafayat-ayan}."
  id: "Nasib sang penyair adalah budak kulit hitam bagi seorang pria dari lembah desa. Ia menulis kepada dirinya sendiri dan memuji Abdul Aziz ibn Marwan, sehingga ia membeli kesetiaannya; julukannya Abu al-Hujna, dan dikatakan Abu Muhjan. Suatu hari, ia dan al-Farazdaq mengunjungi Sulayman ibn Abd al-Malik, yang saat itu menjadi khalifah. Al-Farazdaq memuji ayahnya, tetapi Sulayman berpaling darinya seperti orang yang marah. Ia membacakan Nasib dalam ceritanya, dan Salomo berkata kepada al-Farazdaq: Bagaimana kau melihatnya? Ia berkata: Ia adalah yang paling puitis di antara jenisnya. {cite:wafayat-ayan}."
