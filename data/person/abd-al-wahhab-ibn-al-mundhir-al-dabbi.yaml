summary:
  ar: "عبد الوهاب بن المنذر الضبي، فقيه عابد صوام قوام، كان يختم القرآن كل يوم إلى أن مات، وروى عن معتمر بن سليمان. ومن قول أبيه عنه: لكل شيء أول، وأول الخير الاستغفار."
  en: "Abd al-Wahhab ibn al-Mundhir al-Dabbi, a jurist and worshipper who fasted and prayed much, finishing the Qur'an each day until he died; he narrated from Mu'tamir ibn Sulayman. His father reported from him: everything has a beginning, and the beginning of good is seeking forgiveness."
  ur: "عبد الوہاب بن منذر ضبی، فقیہ اور عبادت گزار، روزے اور نماز میں مشغول، جو مرتے دم تک ہر روز قرآن ختم کرتے رہے؛ انہوں نے معتمر بن سلیمان سے روایت کی۔ ان کے والد نے ان سے نقل کیا: ہر چیز کی ایک ابتدا ہوتی ہے، اور نیکی کی ابتدا استغفار ہے۔"
