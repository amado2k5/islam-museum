summary:
  ar: "علي بن موسى بن هارون، أبو الحسن، المعروف بابن هارون الفقيه المفتي الفرضي، المالكي. لازم ابن غازي نحوا من تسع وعشرين سنة، وأخذ عن أبي العباس الونشريسي والقاضي المكناسي. وعنه عبد الواحد الونشريسي وعبد الوهاب الزقاق. ويذكر الكتاب وفاته سنة 951 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7147}"
  en: "Ali ibn Musa ibn Harun, Abu al-Hasan, known as Ibn Harun, a Maliki jurist, mufti and expert in inheritance. He studied with Ibn Ghazi for about twenty-nine years, and with al-Wansharisi and al-Miknasi. Abd al-Wahid al-Wansharisi and Abd al-Wahhab al-Zaqqaq studied with him. The book gives his death as 951 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7147}"
