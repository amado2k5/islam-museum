summary:
  ar: "جورج أميروتزوس، العالم الرومي؛ ينقل الصلابي أن محمد الفاتح لما وجد كتاب بطليموس في الجغرافيا وخريطته مطالعته ودراستها معه، ثم طلب إليه وإلى ابنه — الذي كان يجيد الرومية والعربية — ترجمة الكتاب إلى العربية وإعادة رسم الخريطة مع تحقيق أسماء البلدان وكتابتها بالعربية والرومية، وكافأهما على ذلك بعطايا واسعة {cite:dawlat-uthmaniyya-salabi p. 141-142}."
  en: "George Amiroutzes, 'the Greek scholar' of al-Salabi's text: when Mehmed II came upon Ptolemy's Geography and its map he studied it with Amiroutzes, then charged him and his son — versed in Greek and Arabic — with translating the book into Arabic and redrawing the map with place-names verified in both tongues, rewarding both generously {cite:dawlat-uthmaniyya-salabi p. 141-142}."
  es: "George Amiroutzes, 'el erudito griego' del texto de al-Salabi: cuando Mehmed II encontró la Geografía de Ptolomeo y su mapa, la estudió con Amiroutzes, y luego le encargó a él y a su hijo —verificados en griego y árabe— que tradujeran el libro al árabe y volvieran a dibujar el mapa con nombres de lugares verificados en ambos idiomas, recompensándolos generosamente {cite:dawlat-uthmaniyya-salabi p. 141-142}."
  fr: "George Amiroutzes, « l’érudit grec » du texte d’al-Salabi: lorsque Mehmed II découvrit la Géographie de Ptolémée et sa carte, il l’étudia avec Amiroutzes, puis le chargea, ainsi que son fils – versé en grec et en arabe – de traduire le livre en arabe et de redessiner la carte avec des noms de lieux vérifiés dans les deux langues, récompensant généreusement les deux {cite:dawlat-uthmaniyya-salabi p. 141-142}."
  ur: "جارج امیروتز، السلابی کی عبارت کا 'یونانی اسکالر': جب محمد ثانی بطلیموس کے جغرافیہ اور اس کے نقشے پر آیا تو اس نے امیروتز کے ساتھ اس کا مطالعہ کیا، پھر اس پر اور اس کے بیٹے پر - یونانی اور عربی میں مہارت رکھنے والے - پر کتاب کا عربی میں ترجمہ کرنے اور جگہ کے ناموں کے ساتھ نقشہ کو دوبارہ تیار کرنے کا الزام لگایا، جس کی تصدیق دونوں زبانوں میں ہوئی تھی۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 141-142}۔"
  tr: "Roma bilgini George Amirutzus; Al-Sallabi, Fatih Muhammed'in Ptolemaios'un coğrafya ve harita kitabını bulduğunda onunla birlikte okuyup çalıştığını, ardından Roma ve Arapça bilen oğlundan kitabı Arapçaya çevirmelerini, haritayı yeniden çizmelerini, ülkelerin isimlerini doğrulayıp Arapça ve Roma dilinde yazmalarını istediğini ve onlara cömert hediyelerle ödüllendirildiğini bildirir {cite:dawlat-uthmaniyya-salabi s. 141-142}."
  id: "George Amirutzus, seorang cendekiawan Romawi; Al-Sallabi melaporkan bahwa ketika Muhammad Sang Penakluk menemukan buku Ptolemy tentang geografi dan petanya, ia membacanya dan mempelajarinya bersamanya, lalu meminta Muhammad dan putranya — yang fasih berbahasa Romawi dan Arab — untuk menerjemahkan buku itu ke dalam bahasa Arab dan menggambar ulang peta tersebut serta memverifikasi nama-nama negara dan menuliskannya dalam bahasa Arab dan Romawi, dan memberinya hadiah yang murah hati {cite:dawlat-uthmaniyya-salabi hlm. 141-142}."
