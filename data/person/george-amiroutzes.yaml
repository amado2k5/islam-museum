summary:
  ar: "جورج أميروتزوس، العالم الرومي؛ ينقل الصلابي أن محمد الفاتح لما وجد كتاب بطليموس في الجغرافيا وخريطته مطالعته ودراستها معه، ثم طلب إليه وإلى ابنه — الذي كان يجيد الرومية والعربية — ترجمة الكتاب إلى العربية وإعادة رسم الخريطة مع تحقيق أسماء البلدان وكتابتها بالعربية والرومية، وكافأهما على ذلك بعطايا واسعة {cite:dawlat-uthmaniyya-salabi p. 141-142}."
  en: "George Amiroutzes, 'the Greek scholar' of al-Salabi's text: when Mehmed II came upon Ptolemy's Geography and its map he studied it with Amiroutzes, then charged him and his son — versed in Greek and Arabic — with translating the book into Arabic and redrawing the map with place-names verified in both tongues, rewarding both generously {cite:dawlat-uthmaniyya-salabi p. 141-142}."
