summary:
  ar: "أبو رغال، شخصية أسطورية في التراث العربي، تروي فيها الأخبار روايتان مختلفتان: الأولى أنه ثقفي من الطائف دلّ أبرهة على طريق مكة، ودُفن بالمغمس، ورُجم قبره؛ والثانية أنه الناجي الوحيد من ثمود. {cite:encyclopaedia-of-islam-2 vol. 1 p. 163}"
  en: "Abu Righal, a mythical figure of Arab tradition with two distinct stories: in the first he is a Thaqafi of Ta'if who guided Abraha to Mecca and was buried at al-Mughammas, where his tomb was stoned; in the second he is the only survivor of Thamud, who died as soon as he left Mecca. {cite:encyclopaedia-of-islam-2 vol. 1 p. 163}"
  ur: "ابو رغال، عرب روایات کی ایک افسانوی شخصیت، جن کے بارے میں دو مختلف روایتیں ہیں: پہلی میں وہ طائف کے ثقفی تھے جنہوں نے ابرہہ کو مکہ کا راستہ دکھایا اور مغمس میں دفن ہوئے، جہاں ان کی قبر پر پتھر مارے جاتے تھے؛ دوسری میں وہ ثمود کے واحد بچ جانے والے تھے، جو مکہ سے نکلتے ہی فوت ہو گئے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 163}"
