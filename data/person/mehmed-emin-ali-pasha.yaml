summary:
  ar: "محمد أمين عالي باشا (وُلد في إسطنبول في 5 مارس 1815 – توفي فيها في 7 سبتمبر 1871)، رجل دولة عثماني من أبوين متواضعين، ابن بوّاب عند الإنجليزية وابن بائع عند العربية، ترقّى من دائرة الترجمة حتى صار صدرًا أعظم خمس مرات ووزير خارجية سبع مرات عند الإنجليزية وثماني عند التركية، وهو مهندس فرمان الإصلاحات (الخط الهمايوني) سنة 1856 وممثّل الدولة الأول في مؤتمر باريس الذي أنهى حرب القرم."
  en: "Mehmed Emin Âli Pasha (born in Istanbul on 5 March 1815 – died there on 7 September 1871) was an Ottoman statesman of modest origins — a doorkeeper's son in the English article, a shopkeeper's son in the Arabic — who rose from the Translation Office to hold the grand vizierate five times and the foreign ministry seven times by the English article's count, eight by the Turkish; he was the architect of the Reform Edict (Hatt-ı Hümayun) of 1856 and the Porte's chief delegate at the Congress of Paris that ended the Crimean War."
  ur: "محمد امین عالی پاشا (پیدائش: استنبول، 5 مارچ 1815ء – وفات: استنبول، 7 ستمبر 1871ء)، معمولی گھرانے سے اٹھنے والے عثمانی سیاست دان، پانچ بار صدرِ اعظم اور سات بار وزیرِ خارجہ رہے، 1856ء کے فرمانِ اصلاحات کے مصنف اور پیرس کانگریس میں عثمانی ریاست کے سربراہ نمائندے تھے۔"
