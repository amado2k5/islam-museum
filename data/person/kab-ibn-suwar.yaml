  ar: "قاضي البصرة لعمر؛ فهم شكوى المرأة التي أثنت على زوجها قياماً وصياماً فقضى لها بيوم من كل أربعة أيام وليلة من كل أربع ليال."
  en: "Umar's judge of Basra; understood the praising wife's true complaint and ruled her a day of four days and a night of four nights."
  es: "El juez de Umar en Basora comprendió la verdadera queja de la esposa que la elogiaba y la castigó con cuatro días de castigo y cuatro noches de castigo."
