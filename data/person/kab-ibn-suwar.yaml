  ur: "بصرہ کے قاضی عمر کا; تعریف کرنے والی بیوی کی سچی شکایت کو سمجھا اور اس پر ایک دن چار دن اور ایک رات چار راتوں پر حکومت کی۔"
  tr: "Basra hakimi Ömer için; kadının şikayetini anlayın; kocasını namaz kılıp oruç tuttuğu için övmüştü, bu yüzden kocasının her dört günde bir gün ve her dört gecede bir gece yaptı."
  id: "Hakim Basra untuk Umar; memahami keluhan wanita itu bahwa dia memuji suaminya karena berdoa dan berpuasa, sehingga dia menebus satu hari dari setiap empat hari dan satu malam dari setiap empat malam."
