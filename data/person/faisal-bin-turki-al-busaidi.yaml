summary:
  ar: "فيصل بن تركي بن سعيد البوسعيدي (وُلد في بومباي في 8 يونيو 1864 – توفي في مسقط في 4 أكتوبر 1913)، سلطان مسقط وعُمان من 4 يونيو 1888 إلى وفاته، والابن الثاني للسلطان تركي بن سعيد؛ شهد عهده اتفاق القنصلية الفرنسية وسقوط مسقط مؤقتًا سنة 1895 وقيام الإمامة في الداخل سنة 1913، وخلفه ابنه تيمور."
  en: "Faisal bin Turki bin Said Al Busaidi (born in Bombay on 8 June 1864 – died at Muscat on 4 October 1913), Sultan of Muscat and Oman from 4 June 1888 until his death and the second son of Sultan Turki bin Said; his reign saw the French consulate agreement, the temporary fall of Muscat in 1895 and the rise of the interior imamate in 1913, and his son Taimur succeeded him."
  ur: "فیصل بن ترکی بن سعید البوسعیدی (پیدائش: بمبئی، 8 جون 1864ء – وفات: مسقط، 4 اکتوبر 1913ء)، 4 جون 1888ء سے وفات تک سلطنتِ مسقط و عمان کے سلطان اور سلطان ترکی بن سعید کے دوسرے بیٹے؛ ان کے عہد میں فرانسیسی قونصل خانے کا معاہدہ، 1895ء میں مسقط کا عارضی سقوط اور 1913ء میں داخلہ میں امامت کا قیام ہوا، اور ان کے بیٹے تیمور جانشین بنے۔"
