summary:
  ar: "مؤذن جامع فسطاط مصر، صاحب الشافعي وراوية كتبه والثقة الثبت فيما يرويه؛ قال السبكي: لو تعارض هو وأبو إبراهيم المزني في رواية لقُدمت روايته لعلو قدره في النقل. ولد سنة أربع وسبعين ومائة واتصل بخدمة الشافعي وحمل عنه الكثير، وحدث عنه وعن عبد الله بن وهب وعبد الله بن يوسف التطيبي وأيوب بن سويد الرملي ويحيى بن حسان وأسد بن موسى؛ روى عنه أبو داود والنسائي وابن ماجة وأبو زرعة وأبو حاتم وابنه عبد الرحمن وزكريا الساجي والطحاوي وآخرهم أبو الفوارس السندي، وأخرج حديثه ابن خزيمة وابن حبان والحاكم. قال الشافعي له: ما أحبك إلىّ، وقال: ما خدمني أحد قط ما خدم مني الربيع بن سليمان، وقال: لو أمكنني أن أطعمك العلم لأطعمتك؛ ونقل القفال أنه كان بطيء الفهم فكرر الشافعي عليه مسألة أربعين مرة حتى فهم، وكانت الرحلة في كتب الشافعي إليه من الآفاق نحو مائتي رجل. مات يوم الاثنين ودُفن يوم الثلاثاء لإحدى وعشرين ليلة خلت من شوال سنة سبعين ومائتين، وصلى عليه الأمير خمارويه بن أحمد بن طولون {cite:tabaqat-shafiiyya-subki j.1 p.259-261}."
  en: "The muezzin of the congregational mosque of Fustat — al-Shafi'i's own companion and the transmitter of his books, a rock-solid thiqa in his transmission; al-Subki judges his riwaya preferred even over al-Muzani's. Born 174, he attached himself to al-Shafi'i's service and carried much from him; Abu Dawud, al-Nasa'i, Ibn Maja, Abu Zur'a, Abu Hatim, al-Tahawi and others transmitted from him, and Ibn Khuzayma, Ibn Hibban and al-Hakim printed his hadith. Al-Shafi'i said 'no one ever served me as al-Rabi' served me' and 'if I could feed you knowledge I would feed you'; some two hundred men journeyed to him for al-Shafi'i's books. He died on 21 Shawwal 270 and the Amir Khumarawayh ibn Tulun himself prayed over him {cite:tabaqat-shafiiyya-subki j.1 p.259-261}."
