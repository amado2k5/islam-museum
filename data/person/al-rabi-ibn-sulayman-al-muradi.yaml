summary:
  ar: "مؤذن جامع فسطاط مصر، صاحب الشافعي وراوية كتبه والثقة الثبت فيما يرويه؛ قال السبكي: لو تعارض هو وأبو إبراهيم المزني في رواية لقُدمت روايته لعلو قدره في النقل. ولد سنة أربع وسبعين ومائة واتصل بخدمة الشافعي وحمل عنه الكثير، وحدث عنه وعن عبد الله بن وهب وعبد الله بن يوسف التطيبي وأيوب بن سويد الرملي ويحيى بن حسان وأسد بن موسى؛ روى عنه أبو داود والنسائي وابن ماجة وأبو زرعة وأبو حاتم وابنه عبد الرحمن وزكريا الساجي والطحاوي وآخرهم أبو الفوارس السندي، وأخرج حديثه ابن خزيمة وابن حبان والحاكم. قال الشافعي له: ما أحبك إلىّ، وقال: ما خدمني أحد قط ما خدم مني الربيع بن سليمان، وقال: لو أمكنني أن أطعمك العلم لأطعمتك؛ ونقل القفال أنه كان بطيء الفهم فكرر الشافعي عليه مسألة أربعين مرة حتى فهم، وكانت الرحلة في كتب الشافعي إليه من الآفاق نحو مائتي رجل. مات يوم الاثنين ودُفن يوم الثلاثاء لإحدى وعشرين ليلة خلت من شوال سنة سبعين ومائتين، وصلى عليه الأمير خمارويه بن أحمد بن طولون {cite:tabaqat-shafiiyya-subki j.1 p.259-261}."
  en: "The muezzin of the congregational mosque of Fustat — al-Shafi'i's own companion and the transmitter of his books, a rock-solid thiqa in his transmission; al-Subki judges his riwaya preferred even over al-Muzani's. Born 174, he attached himself to al-Shafi'i's service and carried much from him; Abu Dawud, al-Nasa'i, Ibn Maja, Abu Zur'a, Abu Hatim, al-Tahawi and others transmitted from him, and Ibn Khuzayma, Ibn Hibban and al-Hakim printed his hadith. Al-Shafi'i said 'no one ever served me as al-Rabi' served me' and 'if I could feed you knowledge I would feed you'; some two hundred men journeyed to him for al-Shafi'i's books. He died on 21 Shawwal 270 and the Amir Khumarawayh ibn Tulun himself prayed over him {cite:tabaqat-shafiiyya-subki j.1 p.259-261}."
  fr: "Le muezzin de la mosquée de la congrégation de Fustat – le compagnon d’al-Shafi’i et l’émetteur de ses livres, une thiqa solide comme le roc dans sa transmission  ; al-Subki juge que son riwaya préfère même celui d'al-Muzani. Né en 174, il s'est attaché au service d'al-Shafi'i et a beaucoup emporté de lui ; Abu Dawud, al-Nasa'i, Ibn Maja, Abu Zur'a, Abu Hatim, al-Tahawi et d'autres transmis de lui, ibn Khuzayma, Ibn Hibban et al-Hakim ont imprimé son hadith. Al-Shafi'i a dit : \"Personne ne m'a jamais servi comme al-Rabi m'a servi\" et \"si je pouvais vous nourrir, je vous nourrirais\" ; Quelque deux cents hommes se rendirent à lui pour les livres d'al-Shafi'i. Il est mort le 21 Shawwal 270 et l'émir Khumarawayh ibn Tulun lui-même a prié pour lui {cite:tabaqat-shafiiyya-subki j.1 p.259-261}."
  es: "El muecín de la mezquita congregacional de Fustat —compañero personal de al-Shafi'i y transmisor de sus libros—, una fuente infalible de transmisión; al-Subki considera que su transmisión es incluso superior a la de al-Muzani. Nacido en 174, se dedicó al servicio de al-Shafi'i y transmitió gran parte de su conocimiento; Abu Dawud, al-Nasa'i, Ibn Maja, Abu Zur'a, Abu Hatim, al-Tahawi y otros transmitieron de él, e Ibn Khuzayma, Ibn Hibban y al-Hakim imprimieron sus hadices. Al-Shafi'i dijo: «Nadie me ha servido como al-Rabi'» y «Si pudiera transmitiros conocimiento, lo haría»; unos doscientos hombres viajaban a él en busca de los libros de al-Shafi'i. Murió el 21 de Shawwal 270 y el propio Amir Khumarawayh ibn Tulun oró por él {cita:tabaqat-shafiiyya-subki j.1 p.259-261}."
  ur: "فستات کی اجتماعی مسجد کا مؤذن - الشافعی کا اپنا ساتھی اور ان کی کتابوں کا ٹرانسمیٹر، اس کی ترسیل میں ایک چٹان سے ٹھوس ٹھکا؛ السبکی فیصلہ کرتا ہے کہ اس کے رویہ کو المزانی پر بھی ترجیح دی گئی۔ 174 میں پیدا ہوئے، اس نے اپنے آپ کو الشافعی کی خدمت میں لگا لیا اور ان سے بہت کچھ لے لیا۔ ابوداؤد، النسائی، ابن ماجہ، ابو زرعہ، ابو حاتم، الطحاوی اور دیگر نے ان سے روایت کی ہے اور ابن خزیمہ، ابن حبان اور الحکیم نے اس کی حدیث کو چھاپا۔ الشافعی نے کہا کہ 'میری خدمت ربیع کی طرح کسی نے نہیں کی' میری خدمت کی' اور 'اگر میں تمہیں علم کھلا سکوں تو میں تمہیں کھلاؤں گا'۔ تقریباً دو سو آدمی شافعی کی کتابوں کے لیے ان کے پاس گئے۔ آپ کی وفات 21 شوال 270 کو ہوئی اور خود امیر خمارویہ ابن طولون نے ان پر دعا فرمائی۔"
  tr: "Mısır'daki Fustat Üniversitesi'nin müezzini, el-Şafii'nin reisi, kitaplarının anlatıcısı ve anlattıklarında güvenilir kişiydi. El-Subki şöyle dedi: Eğer kendisi ve Ebu İbrahim el-Muzani bir rivayet konusunda çatışsalardı, onun rivayeti yüksek statüsü nedeniyle öncelik kazanırdı. 174 Hicri yılında doğdu ve el-Şafii'nin hizmetiyle bağlantılıydı, ondan çok şey taşıdı. Ondan Abdullah ibn Vahb, Abdullah ibn Yusuf'tan rivayet etti -Taybi, Eyyub bin Suveyd el-Ramli, Yahya ibn Hassan ve Asad ibn Musa; ondan Ebu Davud, el-Nasa'i, İbn Majah, Ebu Zur'ah, Ebu Hatim, oğlu Abdülrahman, Zekeriye el-Saci, el-Tahavi ve sonuncusu Ebu el-Fawaris el-Sindi tarafından rivayet edilmiştir. Hadisleri İbn Huzeyme, İbn Hibben ve el-Hakim tarafından rivayet edilmiştir. El-Şafii ona: Seni ne kadar çok sevdiğimi söyledi ve dedi ki: Bana hiç kimse El-Rabi bin Süleyman kadar hizmet etmedi. Dedi ki: Sana bilgi verebileceksem, seni beslerdim. El-Kahfal anlamakta yavaş olduğunu bildirdi ve Şafii anlayana kadar soruyu kırk kez tekrarladı. El-Şafi'i'nin kitaplarına göre, ufuklardan ona yolculuk yaklaşık iki yüz adamdı. Pazartesi günü öldü ve 270 Hicri yılında, Şevval'dan önce yirmi bir gece Salı günü defnedildi; cenaze törenini Prens Humarawayh ibn Ahmed ibn Tulun üstlendi."
  id: "Ia adalah mueszinin Universitas Fustat di Mesir, sahabat al-Shafi'i, narator bukunya, dan yang dapat dipercaya dalam apa yang ia ceritakan. Al-Subki berkata: Jika ia dan Abu Ibrahim al-Muzani berselisih soal sebuah narasi, narasinya akan diprioritaskan karena statusnya yang tinggi dalam transmisi. Ia lahir pada tahun 174 H. dan terlibat dalam pelayanan al-Shafi'i, membawa banyak darinya. Ia menceritakan dari Abdullah ibn Wahb, Abdullah ibn Yu suf al-Taybi, Ayyub ibn Suwayd al-Ramli, Yahya ibn Hassan, dan Asad ibn Musa; diceritakan darinya oleh Abu Dawood, al-Nasa'i, Ibn Majah, Abu Zur'ah, Abu Hatim, putranya Abd al-Rahman, Zakariya al-Saji, al-Tahawi, dan yang terakhir Abu al-Fawaris al-Sindi. Hadis-hadisnya dibacakan oleh Ibn Khuzaymah, Ibn Hibban, dan al-Hakim. Al-Shafi'i berkata kepadanya: Betapa aku mencintaimu, dan ia berkata: Tidak ada yang pernah melayani aku sebanyak Al-Rabi' ibn Sulayman melayani aku. Ia berkata: Jika aku bisa memberimu pengetahuan, aku akan memberimu makan. Al-Qaffal melaporkan bahwa ia lambat memahami, dan Al-Shafi'i mengulangi pertanyaan itu empat puluh kali sampai ia mengerti. Menurut kitab-kitab Al-Shafi'i, perjalanan ke arahnya dari cakrawala sekitar dua ratus orang. Ia meninggal pada hari Senin dan dimakamkan pada hari Selasa selama dua puluh satu malam di hadapan Shawwal pada tahun 270 H, dan Pangeran Khumarawayh ibn Ahmad ibn Tulun memimpin pemakaman di atasnya."
