summary:
  ar: "أبو العباس أحمد بن عبد السلام الكوراني الحراوي؛ أديب عبادة في حفظ الأشعار القديمة والمحدثة وتقدم في هذا الشأن، جالس عبد المؤمن بن علي صاحب الموحدين ثم ولده يوسف ثم ولده يعقوب المنصور {cite:wafayat-ayan}."
  en: "Abu al-Abbas Ahmad ibn Abd al-Salam al-Kurani al-Harawi, a man of letters of distinction in memorising ancient and modern poetry, in which he excelled. He sat with Abd al-Mu'min ibn Ali, lord of the Muwahhidun, then with his son Yusuf, and then with his son Ya'qub al-Mansur {cite:wafayat-ayan}."
  es: "Abu al-Abbas Ahmad ibn Abd al-Salam al-Kurani al-Harawi, un hombre de letras distinguido por su capacidad para memorizar poesía antigua y moderna, en la que sobresalió. Se sentó con Abd al-Mu'min ibn Ali, señor de los Muwahhidun, luego con su hijo Yusuf, y después con su hijo Ya'qub al-Mansur {cite:wafayat-ayan}."
  fr: "Abu al-Abbas Ahmad ibn Abd al-Salam al-Kurani al-Harawi, homme de lettres réputé pour sa mémorisation de la poésie ancienne et moderne, domaine dans lequel il excellait, siégea auprès d'Abd al-Mu'min ibn Ali, seigneur des Muwahhidun, puis auprès de son fils Yusuf, et enfin auprès de son petit-fils Ya'qub al-Mansur."
  ur: "ابو العباس احمد بن عبد السلام الکرانی الحروی، قدیم اور جدید شاعری کو حفظ کرنے میں امتیازی حروف کے حامل آدمی ہیں، جس میں انہوں نے کمال حاصل کیا۔ وہ محدثین کے سردار عبد المومن ابن علی کے ساتھ بیٹھا، پھر اپنے بیٹے یوسف کے ساتھ اور پھر اپنے بیٹے یعقوب المنصور کے ساتھ۔"
