label: { ar: "قطب الدين أيبك" }
summary:
  ar: "قطب الدين أيبك مملوك شهاب الدين الغوري ونائبه ببلاد الهند؛ كان عنده إقطاع أمراء غزنة، فلما قتل مولاه سنة اثنتين وستمائة أمر الوزير مؤيد الملك كل من له إقطاع عنده بالعود إليه وفرقوا فيهم أموالاً {cite:kamil-ibn-al-athir p. 303-304}."
  tr: "Hindistan'daki Şihabeddin el-Guri'nin hükümdarı ve yardımcısı Kutbeddin Aybak, Gazni emirlerinin topraklarını elinde tutuyordu. 602 Hicri yılında müvekkili öldürüldüğünde, vezir Mu'eyyad al-Mulk, yanında mülkü olan herkese geri dönmelerini emretti ve aralarında bir miktar dağıttı {cite:kamil-ibn-al-athir s. 303-304}."
  id: "Qutb al-Din Aybak, penguasa Shihab al-Din al-Ghuri dan wakilnya di India, memegang wilayah para emir Ghazni. Ketika kliennya dibunuh pada tahun 602 H, wazir Mu'ayyad al-Mulk memerintahkan semua yang memiliki tanah feodal bersamanya untuk kembali kepadanya dan membagikan sejumlah uang {cite:kamil-ibn-al-athir hlm. 303-304}."
