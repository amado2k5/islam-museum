summary:
  ar: "سياسي صومالي (1919–1969) من حررطيري، أول رئيس وزراء للصومال (1960–1964) ثم رئيسه الثاني (1967–1969) بعد فوزه على آدم عدي في انتخابات 1967؛ اغتاله أحد حراسه في لاس عانود في 15 أكتوبر 1969، فمهد اغتياله لانقلاب محمد سياد بري بعد ستة أيام."
  en: "Somali politician (1919–1969) from Harardhere, the first prime minister of Somalia (1960–1964) and then its second president (1967–1969) after defeating Aden Adde in the 1967 election; he was assassinated by one of his own bodyguards at Las Anod on 15 October 1969, and his killing was followed six days later by Siad Barre's coup."
  ur: "صومالی سیاست دان (1919ء–1969ء) جن کا تعلق ہراردھیرے سے تھا؛ صومالیہ کے پہلے وزیر اعظم (1960ء–1964ء) اور پھر 1967ء کے انتخاب میں آدم عدی کو شکست دے کر اس کے دوسرے صدر (1967ء–1969ء) بنے؛ 15 اکتوبر 1969ء کو لاس عنود میں ان کے ایک محافظ نے انھیں قتل کر دیا، اور چھ دن بعد سیاد باری کی بغاوت ہوئی۔"
