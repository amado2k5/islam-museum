summary:
  ar: "رسام باكستاني (1897–1975) يُعدّ الفنان الوطني لباكستان ومؤسس «أسلوب الجغتي» المتأثر بالفن المغولي والفارسي والمنمنمات والتقاليد الإسلامية. وُلد وتوفي في لاهور، وأنتج نحو ألفي لوحة مائية ومئات النقوش، وصمّم طوابع باكستانية وشعار التلفزيون الباكستاني، ونال ألقاباً وجوائز بريطانية وباكستانية."
  en: "Pakistani painter (1897–1975), regarded as the national artist of Pakistan and founder of the 'Chughtai style', influenced by Mughal and Persian art, miniature painting and Islamic art traditions. Born and deceased in Lahore, he produced some two thousand watercolours and hundreds of etchings, designed Pakistani postage stamps and the Pakistan Television logo, and received British and Pakistani titles and awards."
  ur: "پاکستانی مصور (1897ء–1975ء)، جنھیں پاکستان کا قومی فنکار اور «چغتائی اسلوب» کا بانی سمجھا جاتا ہے، جو مغلیہ و فارسی فن، منی ایچر اور اسلامی فنّی روایات سے متاثر تھا۔ وہ لاہور میں پیدا ہوئے اور وہیں وفات پائی، انھوں نے تقریباً دو ہزار آبی رنگ کی تصاویر اور سینکڑوں نقوش بنائے، پاکستانی ڈاک ٹکٹ اور پاکستان ٹیلی وژن کا لوگو ڈیزائن کیا، اور برطانوی و پاکستانی القابات و اعزازات پائے۔"
