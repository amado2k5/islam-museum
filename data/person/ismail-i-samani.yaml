summary:
  ar: "إسماعيل بن أحمد بن أسد بن سامان، أمير الدولة السامانية؛ ظفر بعمرو بن الليث الصفار فبعث به إلى المعتضد فكتب المعتضد عهده على خراسان وبعث إليه الخلع، ولما انتهت الخلافة إلى المكتفي كتب عهده وولّاه من الري إلى ما وراء النهر إلى بلاد الترك، وبنى إسماعيل ربطًا في المفاوز وسيّس كل رباط منها ألف فارس ووقف عليها أوقافًا، وورد إلى بلاده جيش عظيم من كبار الترك {cite:muntazam-ibn-al-jawzi p. 201}."
  en: "Isma'il ibn Ahmad the Samanid: after defeating 'Amr ibn al-Layth he received al-Mu'tadid's patent for Khurasan, then al-Muktafi's grant from Rayy to the Turkic lands; he built frontier ribats in the deserts — a thousand cavalry to each — endowed them with waqfs, and a great Turkic army submitted to his rule {cite:muntazam-ibn-al-jawzi p. 201}."
