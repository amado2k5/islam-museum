label:
  ar: "إسماعيل الساماني"
  en: "Ismail Samani In 280 news came of his raid into the Turk lands — killing many, taking their king's city and some ten thousand captives, a thousand dirhams falling to each Muslim horseman; in 285 al-Mu'tadid's patent to Amr ibn al-Layth named his son Ahmad deposed {cite:muntazam-ibn-al-jawzi p. 142-143, 294}."
