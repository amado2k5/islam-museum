label:
  ar: "إسماعيل الساماني"
  en: "Ismail Samani In 280 news came of his raid into the Turk lands — killing many, taking their king's city and some ten thousand captives, a thousand dirhams falling to each Muslim horseman; in 285 al-Mu'tadid's patent to Amr ibn al-Layth named his son Ahmad deposed {cite:muntazam-ibn-al-jawzi p. 142-143, 294}."
  es: "Ismail Samani In 280 news came of his raid into the Turk lands — killing many, taking their king's city and some ten thousand captives, a thousand dirhams falling to each Muslim horseman; in 285 al-Mu'tadid's patent to Amr ibn al-Layth named his son Ahmad deposed {cite:muntazam-ibn-al-jawzi p. 142-143, 294}."
  fr: "Ismail Samani In 280 news came of his raid into the Turk lands — killing many, taking their king's city and some ten thousand captives, a thousand dirhams falling to each Muslim horseman; in 285 al-Mu'tadid's patent to Amr ibn al-Layth named his son Ahmad deposed {cite:muntazam-ibn-al-jawzi p. 142-143, 294}."
names:
  - { kind: full, lang: ar, value: "أبو إبراهيم إسماعيل بن أحمد الساماني" }
roles: [emir]
gender: male
summary:
  ar: "إسماعيل بن أحمد بن أسد بن سامان، أمير الدولة السامانية؛ ظفر بعمرو بن الليث الصفار فبعث به إلى المعتضد فكتب المعتضد عهده على خراسان وبعث إليه الخلع، ولما انتهت الخلافة إلى المكتفي كتب عهده وولّاه من الري إلى ما وراء النهر إلى بلاد الترك، وبنى إسماعيل ربطًا في المفاوز وسيّس كل رباط منها ألف فارس ووقف عليها أوقافًا، وورد إلى بلاده جيش عظيم من كبار الترك {cite:muntazam-ibn-al-jawzi p. 201}."
  en: "Isma'il ibn Ahmad the Samanid: after defeating 'Amr ibn al-Layth he received al-Mu'tadid's patent for Khurasan, then al-Muktafi's grant from Rayy to the Turkic lands; he built frontier ribats in the deserts — a thousand cavalry to each — endowed them with waqfs, and a great Turkic army submitted to his rule {cite:muntazam-ibn-al-jawzi p. 201}."
  es: "Isma'il ibn Ahmad el Samánida: tras derrotar a 'Amr ibn al-Layth, recibió la patente de al-Mu'tadid para Jorasán, y luego la concesión de al-Muktafi de Rayy a las tierras turcas; construyó ribats fronterizos en los desiertos —mil jinetes en cada uno—, los dotó de waqfs, y un gran ejército turco se sometió a su dominio {cite:muntazam-ibn-al-jawzi p. 201}."
  fr: "Ismaïl ibn Ahmad le Samanide: après avoir vaincu 'Amr ibn al-Layth, il reçut le brevet d'al-Mu'tadid pour le Khorasan, puis la concession d'al-Muktafi de Rayy aux terres turques; il construisit des ribats frontaliers dans les déserts — mille cavaliers dans chacun — les dota de waqfs, et une grande armée turque se soumit à son autorité {cite: muntazam-ibn-al-jawzi p. 201}."
