summary:
  ar: "سياسي ورجل أعمال تونسي (1889–1976)، تولى الوزارة الكبرى مرتين: في حكومة المنصف باي سنة 1943، ثم في حكومة التفاوض مع فرنسا بين 1950 و1952 في عهد الأمين باي. أسّس سنة 1922 التعاونية التونسية للائتمان، أول بنك تونسي، وترأّس الغرفة التجارية التونسية بين 1921 و1942، وأسّس الشركة التونسية للغزل والنسيج سنة 1939 وأدارها حتى وفاته."
  en: "Tunisian politician and businessman (1889–1976) who headed the government twice: under Moncef Bey in 1943, and again from 1950 to 1952 under Lamine Bey, leading the negotiating government with France. In 1922 he founded the Tunisian Credit Cooperative, the first Tunisian bank; he presided over the Tunisian Chamber of Commerce from 1921 to 1942 and founded the STUFIT spinning and weaving company in 1939, directing it until his death."
  ur: "تونسی سیاست دان اور کاروباری شخصیت (1889–1976) جو دو مرتبہ حکومت کے سربراہ رہے: 1943ء میں منصف بے کے دور میں، اور پھر 1950ء سے 1952ء تک الامین بے کے دور میں فرانس سے مذاکرات کرنے والی حکومت کے سربراہ۔ انہوں نے 1922ء میں تونسی قرضہ تعاون سوسائٹی قائم کی جو پہلا تونسی بینک تھا؛ 1921ء سے 1942ء تک تونسی چیمبر آف کامرس کے صدر رہے اور 1939ء میں سٹوفٹ کتائی وبنائی کمپنی قائم کی جس کی سربراہی وفات تک کی۔"
