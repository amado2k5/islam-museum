summary:
  ar: "فيزيائية فلكية تركية أمريكية (مواليد 1975 بإسطنبول)، متخصصة في فيزياء النجوم النيوترونية والثقوب السوداء. تخرجت في جامعة كولومبيا سنة 1996 ونالت الدكتوراه من هارفارد سنة 2002، وعملت أستاذة في جامعة أريزونا قبل أن تتولى رئاسة كلية الفيزياء في معهد جورجيا التقني سنة 2022. قادت عمل النمذجة في تلسكوب أفق الحدث الذي أنتج أول صورة لثقب أسود سنة 2019، ونالت جائزة ماريا غوبرت ماير سنة 2013 وجائزة الاختراق في الفيزياء الأساسية سنة 2020."
  en: "Turkish-American astrophysicist (born 1975 at Istanbul) specialising in the physics of neutron stars, black holes and magnetars. She graduated from Columbia University in 1996 and took her PhD at Harvard in 2002, was a professor at the University of Arizona, and in 2022 became chair of the School of Physics at the Georgia Institute of Technology. She led the modelling work of the Event Horizon Telescope, which produced the first image of a black hole in 2019, and received the Maria Goeppert Mayer Award in 2013 and a share of the 2020 Breakthrough Prize."
  ur: "ترک نژاد امریکی ماہرِ فلکیات (پیدائش 1975ء، استنبول)، نیوٹران ستاروں اور بلیک ہولز کی طبیعیات کی ماہر۔ 1996ء میں کولمبیا یونیورسٹی سے فارغ التحصیل ہوئیں اور 2002ء میں ہارورڈ سے پی ایچ ڈی کیا؛ یونیورسٹی آف ایریزونا میں پروفیسر رہیں اور 2022ء میں جارجیا انسٹی ٹیوٹ آف ٹیکنالوجی کے اسکول آف فزکس کی سربراہ بنیں۔ انہوں نے ایونٹ ہورائزن ٹیلی اسکوپ کے ماڈلنگ کام کی قیادت کی جس نے 2019ء میں بلیک ہول کی پہلی تصویر تیار کی؛ 2013ء میں ماریا گوپرٹ مائر ایوارڈ اور 2020ء میں بریک تھرو پرائز پایا۔"
