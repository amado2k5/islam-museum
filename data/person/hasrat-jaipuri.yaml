  ar: "شاعر هندي وكاتب أغانٍ في السينما الهندية، وُلد في جايبور سنة 1922 باسم إقبال حسين، وكتب بالهندية والأردية، ونال جائزة فيلم فير لأفضل كاتب أغانٍ مرتين (1966 و1972)، وارتبط اسمه بأفلام راج كابور وشانكار–جايكيشان."
