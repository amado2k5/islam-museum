id: person/ibrahim-ibn-qasim-al-uqbani
class: person
label: { ar: "إبراهيم العقباني", en: "Ibrahim ibn Qasim al-Uqbani", es: "Ibrahim ibn Qasim al-Uqbani", fr: "Ibrahim ibn Qasim al-Uqbani", ur: "ابراہیم بن قاسم العقبانی۔" }
summary:
  ar: "إبراهيم بن قاسم بن سعيد بن محمد، أبو سالم، العقباني التلمساني المالكي، فقيه وقاض ومفتٍ وحافظ. تولى قضاء تلمسان، وأخذ عنه أحمد الونشريسي، ونقل عنه المازري في نوازله. ويذكر الكتاب وفاته سنة 880 هـ بحسب عنوان ترجمته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7144}"
  en: "Ibrahim ibn Qasim ibn Sa'id ibn Muhammad, Abu Salim al-Uqbani al-Tilimsani, a Maliki jurist, judge, mufti and memoriser, who held the judgeship of Tlemcen. Ahmad al-Wansharisi studied with him, and al-Mazari quoted his responsa. The book gives his death as 880 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7144}"
  es: "Ibrahim ibn Qasim ibn Sa'id ibn Muhammad, Abu Salim al-Uqbani al-Tilimsani, jurista, juez, muftí y memorizador malikí, que ocupó el cargo de juez en Tlemcen. Ahmad al-Wansharisi estudió con él, y al-Mazari citó sus responsa. El libro indica que falleció en el año 880 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7144}"
  fr: "Ibrahim ibn Qasim ibn Sa'id ibn Muhammad, dit Abu Salim al-Uqbani al-Tilimsani, juriste malikite, juge, mufti et mémorisateur, exerça la fonction de juge à Tlemcen. Ahmad al-Wansharisi fut son élève, et al-Mazari cita ses responsa. L'ouvrage indique que sa mort eut lieu en 880 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7144}"
  ur: "ابراہیم بن قاسم بن سعید بن محمد، ابو سالم العقبانی التلمسانی، ایک مالکی فقیہ، قاضی، مفتی اور حافظ، جو تلمسن کے جج کے عہدے پر فائز تھے۔ احمد الوانشاریسی نے ان کے ساتھ مطالعہ کیا، اور المزاری نے ان کے جواب کا حوالہ دیا۔ کتاب میں ان کی وفات 880ھ بتائی گئی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7144}"
