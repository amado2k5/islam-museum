label: { ar: "إبراهيم العقباني", en: "Ibrahim ibn Qasim al-Uqbani" }
summary:
  ar: "إبراهيم بن قاسم بن سعيد بن محمد، أبو سالم، العقباني التلمساني المالكي، فقيه وقاض ومفتٍ وحافظ. تولى قضاء تلمسان، وأخذ عنه أحمد الونشريسي، ونقل عنه المازري في نوازله. ويذكر الكتاب وفاته سنة 880 هـ بحسب عنوان ترجمته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7144}"
  en: "Ibrahim ibn Qasim ibn Sa'id ibn Muhammad, Abu Salim al-Uqbani al-Tilimsani, a Maliki jurist, judge, mufti and memoriser, who held the judgeship of Tlemcen. Ahmad al-Wansharisi studied with him, and al-Mazari quoted his responsa. The book gives his death as 880 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7144}"
