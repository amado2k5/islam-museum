summary:
  ar: "معلمة ومرشدة روحية ومدافعة عن الصحة النفسية في كاليفورنيا. وُلدت في أفغانستان وانتقلت إلى الولايات المتحدة مع أسرتها في الثانية من عمرها. بدأ تعلمها الشرعي سنة 1996 في دروس الشيخ حمزة يوسف في هايورد، وهو أستاذها ومرشدها منذ ذلك الحين. وأسست مع ابنة عمها الدكتورة نفيسة سكندري موقع «الصحة النفسية للمسلمين» (Mental Health 4 Muslims)، وخدمت أكثر من عشرين عامًا مجتمعات منطقة الخليج ومقاطعة أورانج ولوس أنجلوس بالدروس والحلقات والإرشاد."
  en: "Teacher, spiritual counsellor and mental-health advocate in California. Born in Afghanistan, she moved to the United States with her family at the age of two. Her Islamic learning began in 1996 in the Hayward classes of Shaykh Hamza Yusuf, her teacher and mentor since then. With her cousin Dr. Nafisa Sekandari she co-founded Mental Health 4 Muslims, and for over twenty years she has served the Bay Area and Orange County and Los Angeles communities through classes, study circles, counselling and mentoring."
  ur: "کیلیفورنیا میں معلمہ، روحانی رہنما اور صحتِ نفس کی علمبردار۔ وہ افغانستان میں پیدا ہوئیں اور دو سال کی عمر میں خاندان کے ساتھ امریکہ منتقل ہوئیں۔ ان کی شرعی تعلیم 1996 میں ہیورڈ میں شیخ حمزہ یوسف کی کلاسوں سے شروع ہوئی، جو تب سے ان کے استاد و مرشد ہیں۔ انہوں نے اپنی چچا زاد ڈاکٹر نفیسہ سکندری کے ساتھ «Mental Health 4 Muslims» قائم کی، اور بیس سال سے زائد عرصے سے خلیجی علاقے اور اورنج کاؤنٹی و لاس اینجلس کی برادریوں کی خدمت کر رہی ہیں۔"
  es: "Profesora, consejera espiritual y defensora de la salud mental en California. Nacida en Afganistán, se mudó a Estados Unidos con su familia a los dos años. Su formación islámica comenzó en 1996 en las clases de Hayward del jeque Hamza Yusuf, quien ha sido su maestro y mentor desde entonces. Junto con su prima, la Dra. Nafisa Sekandari, cofundó Mental Health 4 Muslims, y durante más de veinte años ha servido a las comunidades del Área de la Bahía, el Condado de Orange y Los Ángeles a través de clases, grupos de estudio, asesoramiento y mentoría."
  fr: "Enseignante, conseillère spirituelle et militante pour la santé mentale en Californie, elle est née en Afghanistan et a immigré aux États-Unis avec sa famille à l'âge de deux ans. Son apprentissage de l'islam a débuté en 1996 dans les cours de Cheikh Hamza Yusuf à Hayward, où il est resté son maître et mentor depuis lors. Avec sa cousine, le Dr Nafisa Sekandari, elle a cofondé l'association Mental Health 4 Muslims et, depuis plus de vingt ans, elle œuvre auprès des communautés de la baie de San Francisco, du comté d'Orange et de Los Angeles à travers des cours, des groupes d'étude, des consultations et du mentorat."
  tr: "Kaliforniya'da öğretmen, ruhani rehber ve ruh sağlığı savunucusu. Afganistan'da doğdu ve iki yaşında ailesiyle birlikte Amerika Birleşik Devletleri'ne taşındı. 1996 yılında Hayward'da Şeyh Hamza Yusuf'un derslerinde dini çalışmalarına başladı; o zamandan beri öğretmeni ve akıl hocası oldu. Kuzeni Dr. Nafisa Skandri ile birlikte \"Mental Health 4 Muslims\" adlı web sitesini kurdu ve yirmi yılı aşkın süredir Körfez bölgesi, Orange County ve Los Angeles'taki topluluklara dersler, seminerler ve danışmanlık yoluyla hizmet etti."
  id: "Seorang guru, pembimbing spiritual, dan advokat kesehatan mental di California. Ia lahir di Afghanistan dan pindah ke Amerika Serikat bersama keluarganya pada usia dua tahun. Ia memulai studi agamanya pada tahun 1996 dalam pelajaran Sheikh Hamza Yusuf di Hayward, yang sejak itu menjadi guru dan mentornya. Ia ikut mendirikan situs web \"Mental Health 4 Muslims\" bersama sepupunya Dr. Nafisa Skandri, dan telah melayani komunitas di wilayah Teluk, Orange County, dan Los Angeles selama lebih dari dua puluh tahun melalui pelajaran, seminar, dan konseling."
