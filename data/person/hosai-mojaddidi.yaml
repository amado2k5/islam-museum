summary:
  ar: "معلمة ومرشدة روحية ومدافعة عن الصحة النفسية في كاليفورنيا. وُلدت في أفغانستان وانتقلت إلى الولايات المتحدة مع أسرتها في الثانية من عمرها. بدأ تعلمها الشرعي سنة 1996 في دروس الشيخ حمزة يوسف في هايورد، وهو أستاذها ومرشدها منذ ذلك الحين. وأسست مع ابنة عمها الدكتورة نفيسة سكندري موقع «الصحة النفسية للمسلمين» (Mental Health 4 Muslims)، وخدمت أكثر من عشرين عامًا مجتمعات منطقة الخليج ومقاطعة أورانج ولوس أنجلوس بالدروس والحلقات والإرشاد."
  en: "Teacher, spiritual counsellor and mental-health advocate in California. Born in Afghanistan, she moved to the United States with her family at the age of two. Her Islamic learning began in 1996 in the Hayward classes of Shaykh Hamza Yusuf, her teacher and mentor since then. With her cousin Dr. Nafisa Sekandari she co-founded Mental Health 4 Muslims, and for over twenty years she has served the Bay Area and Orange County and Los Angeles communities through classes, study circles, counselling and mentoring."
  ur: "کیلیفورنیا میں معلمہ، روحانی رہنما اور صحتِ نفس کی علمبردار۔ وہ افغانستان میں پیدا ہوئیں اور دو سال کی عمر میں خاندان کے ساتھ امریکہ منتقل ہوئیں۔ ان کی شرعی تعلیم 1996 میں ہیورڈ میں شیخ حمزہ یوسف کی کلاسوں سے شروع ہوئی، جو تب سے ان کے استاد و مرشد ہیں۔ انہوں نے اپنی چچا زاد ڈاکٹر نفیسہ سکندری کے ساتھ «Mental Health 4 Muslims» قائم کی، اور بیس سال سے زائد عرصے سے خلیجی علاقے اور اورنج کاؤنٹی و لاس اینجلس کی برادریوں کی خدمت کر رہی ہیں۔"
