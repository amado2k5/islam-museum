summary:
  ar: "أبو عبد الله محمد بن يوسف بن محمد بن قائد، الملقب موفق الدين، الإربلي الأصل والمنشأ والبحراني المولد؛ الشاعر المشهور، كان إماماً مقدماً في علم العربية مفنناً في أنواع الشعر، ومن أعرف الناس بالعروض والقافية وأحذقهم بنقد الشعر وأعرفهم بجيده من رديئه وأدقهم نظراً في اختياره، واشتغل بشيء من علوم الأوائل وحل كتاب إقليدس، وبدأ ينظم الشعر وهو صبي صغير بالبحرين؛ كان شيخه أبو الحرم مكي الماسرجسي النحوي، وله تاريخ ذكر فيه فضائله {cite:wafayat-ayan}."
  en: "al-Bahrani Muwaffaq al-Din (d. 585) — the Irbil-raised, Bahrain-born poet and critic, a master of prosody and the sharpest ear for good verse; solved Euclid as a youth {cite:wafayat-ayan}."
  fr: "Al-Bahrani Muwaffaq al-Din (mort en 585 H) — poète et critique né à Bahreïn, élevé à Irbil, maître de la prosodie et d’une oreille très fine pour les bons vers ; il résolut Euclide dans sa jeunesse {cite:wafayat-ayan}."
  es: "al-Bahrani Muwaffaq al-Din (m. 585) — poeta y crítico criado en Erbil y nacido en Bahréin, maestro de la prosodia y con un oído excepcional para la buena poesía; resolvió a Euclides en su juventud {cite:wafayat-ayan}."
  ur: "البحرانی موفق الدین ⁦(متوفی 585)⁩ - اربیل میں پیدا ہونے والا، بحرین میں پیدا ہونے والا شاعر اور نقاد، پراسوڈی کا ماہر اور اچھی نظم کے لیے سب سے تیز کان؛ یوکلڈ کو ایک نوجوان کے طور پر حل کیا"
  tr: "Ebu Abdullah Muhammed ibn Yusuf ibn Muhammed ibn Kayd, lakabı Muvaffak el-Din, aslen Erbil'li olup Bahreyn'de doğmuştur; ünlü şair, Arap iliminde önde gelen bir imam, şiir türlerinde uzman, vezin ve kafiye konusunda en bilgili kişilerden biri, şiir eleştirisinde en yetenekli, şiirin iyisini kötüsünden ayırt etmede en bilgili ve şiir seçiminde en titiz kişiydi. Eski bilim dallarından bazılarıyla ilgilenmiş, Öklid'in kitabını çözmüş ve Bahreyn'de genç bir çocukken şiir yazmaya başlamıştır. Şeyhi Ebu el-Haram Makki el-Masarjisi el-Nahvi idi ve onun erdemlerinden bahsettiği bir tarihi vardır {kaynak: vefayat-ayan}."
  id: "Abu Abdullah Muhammad ibn Yusuf ibn Muhammad ibn Qaid, yang dijuluki Muwaffaq al-Din, berasal dari Irbil dan lahir di Bahrain; penyair terkenal ini, adalah seorang imam terkemuka dalam ilmu bahasa Arab, mahir dalam berbagai jenis puisi, dan salah satu orang yang paling berpengetahuan tentang prosodi dan rima, paling mahir dalam mengkritik puisi, paling berpengetahuan tentang kebaikan dan keburukannya, dan paling tepat dalam memilihnya. Ia mendalami beberapa ilmu pengetahuan kuno dan memecahkan buku Euklides, dan ia mulai menggubah puisi ketika masih muda di Bahrain. Gurunya adalah Abu al-Haram Makki al-Masarjisi al-Nahwi, dan ia memiliki sejarah yang menyebutkan keutamaannya {cite:wafayat-ayan}."
