summary:
  ar: "أبو عبد الله محمد بن يوسف بن محمد بن قائد، الملقب موفق الدين، الإربلي الأصل والمنشأ والبحراني المولد؛ الشاعر المشهور، كان إماماً مقدماً في علم العربية مفنناً في أنواع الشعر، ومن أعرف الناس بالعروض والقافية وأحذقهم بنقد الشعر وأعرفهم بجيده من رديئه وأدقهم نظراً في اختياره، واشتغل بشيء من علوم الأوائل وحل كتاب إقليدس، وبدأ ينظم الشعر وهو صبي صغير بالبحرين؛ كان شيخه أبو الحرم مكي الماسرجسي النحوي، وله تاريخ ذكر فيه فضائله {cite:wafayat-ayan}."
  en: "al-Bahrani Muwaffaq al-Din (d. 585) — the Irbil-raised, Bahrain-born poet and critic, a master of prosody and the sharpest ear for good verse; solved Euclid as a youth {cite:wafayat-ayan}."
