label:
  ar: "ابن عتاب"
  en: "Ibn Attab (Abd al-Rahman ibn Muhammad, Andalusi jurist)"
  fr: "Ibn Attab (Abd al-Rahman ibn Muhammad, juriste andalou)"
  es: "Ibn Attab (Abd al-Rahman ibn Muhammad, Andalusi jurist)"
  ur: "ابن عتاب ⁦(عبدالرحمٰن بن محمد، اندلس فقیہ)⁩"
summary:
  ar: "عبد الرحمن بن محمد بن عتاب بن محسن، أبو محمد، الأندلسي القرطبي، فقيه مالكي. شارك في القراءات والتفسير واللغة، وتفقه عند أبيه، وكان عالماً بالقراءات السبع وكثير من تفسير القرآن ومعانيه، صدراً فيما يُستفتى فيه، من تصانيفه «شفاء الصدر» في الزهد والرقائق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8193}"
  en: "Abd al-Rahman ibn Muhammad ibn Attab ibn Muhsin, Abu Muhammad, of Cordoba, a Maliki jurist who studied readings, exegesis and philology and learned law from his father. He was known for the seven readings and for fatwa work; his book Shifa' al-sadr concerns asceticism. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8193}"
  fr: "Abd al-Rahman ibn Muhammad ibn Attab ibn Muhsin, Abu Muhammad, de Cordoue, juriste malikite qui étudia les lectures, l'exégèse et la philologie et apprit le droit auprès de son père. Il était connu pour les sept lectures et pour son activité de mufti ; son livre Shifa' al-sadr porte sur l'ascèse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8193}"
  es: "Abd al-Rahman ibn Muhammad ibn Attab ibn Muhsin, Abu Muhammad, de Córdoba, fue un jurista malikí que estudió lecturas, exégesis y filología, y aprendió derecho de su padre. Fue conocido por las siete lecturas y por su labor en la emisión de fatwas; su libro Shifa' al-sadr trata sobre el ascetismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8193}"
  ur: "عبدالرحمٰن بن محمد بن عتاب ابن محسن، ابو محمد، قرطبہ کے، ایک مالکی فقیہ جس نے قرأت، تفسیر اور فلسفہ کا مطالعہ کیا اور اپنے والد سے قانون سیکھا۔ وہ سات پڑھنے اور فتویٰ کے کام کے لیے مشہور تھے۔ اس کی کتاب شفاء الصدر کا تعلق سنت پرستی سے ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 8192}"
  tr: "Abdülrahman ibn Muhammed ibn Attab ibn Muhsin, Ebu Muhammed, el-Endülüs el-Kurtubi, Maliki mezhebine mensup bir hukukçu idi. Kur'an okuma, tefsir ve dilbilim konularında uzmandı. Babasının yanında fıkıh eğitimi aldı ve Kur'an'ın yedi şeriat okunuşunu ve bunların yorum ve anlamlarının çoğunu biliyordu. İslam hukuku konularında önde gelen bir otoriteydi. Eserleri arasında, çilecilik ve manevi arınma üzerine bir kitap olan \"Şifa' el-Sadr\" (Kalbin Şifası) da bulunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8193}"
  id: "Abd al-Rahman ibn Muhammad ibn Attab ibn Muhsin, Abu Muhammad, al-Andalusi al-Qurtubi, seorang ahli hukum Maliki. Beliau mahir dalam bacaan Al-Quran, tafsir, dan linguistik. Beliau belajar fiqih di bawah bimbingan ayahnya dan berpengetahuan luas tentang tujuh bacaan kanonik Al-Quran serta banyak interpretasi dan maknanya. Beliau adalah otoritas terkemuka dalam masalah hukum Islam. Di antara karyanya adalah \"Shifa' al-Sadr\" (Penyembuhan Hati), sebuah buku tentang asketisme dan penyempurnaan spiritual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8193}"
