summary:
  ar: "عبد الرحمن بن محمد بن عتاب بن محسن، أبو محمد، الأندلسي القرطبي، فقيه مالكي. شارك في القراءات والتفسير واللغة، وتفقه عند أبيه، وكان عالماً بالقراءات السبع وكثير من تفسير القرآن ومعانيه، صدراً فيما يُستفتى فيه، من تصانيفه «شفاء الصدر» في الزهد والرقائق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8193}"
  en: "Abd al-Rahman ibn Muhammad ibn Attab ibn Muhsin, Abu Muhammad, of Cordoba, a Maliki jurist who studied readings, exegesis and philology and learned law from his father. He was known for the seven readings and for fatwa work; his book Shifa' al-sadr concerns asceticism. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8193}"
