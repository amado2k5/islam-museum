id: person/ibn-al-habbar
class: person
label:
  ar: ابن الحبّر
  en: Ibn al-Habbar
summary:
  ar: "يحيى بن عبد الملك الغافقي أبو الحسن المعروف بابن الحبّر، أندلسي من أعمال مرسية وفد مع الجالية؛ كان يحسن الكتابة ولم يكن له من الخلال سواها، فارتقى من خدمة ابن أبي الحسين إلى ولاية الديوان فكتاب علامة الواثق، واستبد بالدولة والسلطان حتى أهلك منكوبه ابن أبي الحسين عذاباً في ذي الحجة سنة 676هـ واستخرج من دفينة داره زهاء ستمائة ألف دينار، فقتله الملأ لأول ذي القعدة سنة 677هـ بمقعده من باب السلطان ورموا برأسه إلى الغوغاء فعبثوا به."
  en: "Yahya ibn Abd al-Malik al-Ghafiqi, Abu al-Hasan, called Ibn al-Habbar, an Andalusi of Murcia who came with the refugee community; skilled only in penmanship, he rose from Ibn Abi al-Husayn's service to the diwan and then to al-Wathiq's seal, dominated state and sultan, tortured Ibn Abi al-Husayn to death in Dhu al-Hijja 676 over a hoard of six hundred thousand dinars dug from his house, and was cut down by the assembly at the sultan's gate on 1 Dhu al-Qa'da 677, his head thrown to the mob."
