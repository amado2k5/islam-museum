id: person/ibn-al-habbar
class: person
label:
  ar: ابن الحبّر
  en: Ibn al-Habbar
  es: "Ibn al-Habbar"
  fr: "Ibn al-Habbar"
  ur: "ابن الحبر"
summary:
  ar: "يحيى بن عبد الملك الغافقي أبو الحسن المعروف بابن الحبّر، أندلسي من أعمال مرسية وفد مع الجالية؛ كان يحسن الكتابة ولم يكن له من الخلال سواها، فارتقى من خدمة ابن أبي الحسين إلى ولاية الديوان فكتاب علامة الواثق، واستبد بالدولة والسلطان حتى أهلك منكوبه ابن أبي الحسين عذاباً في ذي الحجة سنة 676هـ واستخرج من دفينة داره زهاء ستمائة ألف دينار، فقتله الملأ لأول ذي القعدة سنة 677هـ بمقعده من باب السلطان ورموا برأسه إلى الغوغاء فعبثوا به."
  en: "Yahya ibn Abd al-Malik al-Ghafiqi, Abu al-Hasan, called Ibn al-Habbar, an Andalusi of Murcia who came with the refugee community; skilled only in penmanship, he rose from Ibn Abi al-Husayn's service to the diwan and then to al-Wathiq's seal, dominated state and sultan, tortured Ibn Abi al-Husayn to death in Dhu al-Hijja 676 over a hoard of six hundred thousand dinars dug from his house, and was cut down by the assembly at the sultan's gate on 1 Dhu al-Qa'da 677, his head thrown to the mob."
  es: "Yahya ibn Abd al-Malik al-Ghafiqi, Abu al-Hasan, llamado Ibn al-Habbar, un andalusí de Murcia que llegó con la comunidad de refugiados; hábil solo en caligrafía, ascendió desde el servicio de Ibn Abi al-Husayn al diwan y luego al sello de al-Wathiq, dominó el estado y al sultán, torturó a Ibn Abi al-Husayn hasta la muerte en Dhu al-Hijja 676 por un tesoro de seiscientos mil dinares desenterrados de su casa, y fue decapitado por la asamblea en la puerta del sultán el 1 de Dhu al-Qa'da 677, su cabeza arrojada a la multitud."
  fr: "Yahya ibn Abd al-Malik al-Ghafiqi, Abu al-Hasan, dit Ibn al-Habbar, un Andalou de Murcie arrivé avec la communauté de réfugiés; habile uniquement en calligraphie, il passa du service d'Ibn Abi al-Husayn au diwan puis au sceau d'al-Wathiq, domina l'État et le sultan, tortura à mort Ibn Abi al-Husayn en Dhu al-Hijja 676 pour un trésor de six cent mille dinars déterrés de sa maison, et fut abattu par l'assemblée à la porte du sultan le 1 Dhu al-Qa'da 677, sa tête jetée à la foule."
  ur: "یحییٰ بن عبد الملک الغفیقی، ابو الحسن، ابن الحبر کو مرسیہ کا ایک اندلس کہتے ہیں جو مہاجرین کے ساتھ آیا تھا۔ صرف قلم کاری میں ماہر، وہ ابن ابی الحسین کی خدمت سے دیوان تک اور پھر الوثیق کی مہر، غلبہ والی ریاست اور سلطان تک پہنچا، ابن ابی الحسین کو ذی الحجہ 676 میں چھ لاکھ دینار کے ذخیرے پر تشدد کا نشانہ بنا کر موت کے گھاٹ اتار دیا گیا، اور اس کے گھر کے دروازے کو کھود کر کاٹ دیا گیا۔ 1 ذی القعدہ 677 کو اس کا سر ہجوم کی طرف پھینک دیا گیا۔"
  tr: "Yahya ibn Abd al-Malik al-Ghafiqi, Ebu el-Hasan, İbn al-Habr olarak bilinir, Murcia'dan bir Endülüslüydü ve cemaatle birlikte gelmişti; yazmada yetenekliydi ve başka yeteneği yoktu. İbn Ebi el-Hüseyin'in hizmetinden divan valiliğine, alim el-Vathiq'in din adamına yükseldi ve devleti ve sultanı yönetti; ta ki Zhuce'de İbn Abi el-Hüseyin'in acısıyla 676 Hicce'de derdi sona erene kadar. Türbesinden yaklaşık altı yüz bin dinar çıkarıldı. Mollalar onu 677 Hicri yılının ilk Zulü Kı'dasında Sultan Kapısı'ndaki koltuğunda öldürdü ve başını kalabalığa attı; kalabalık da ona müdahale etti."
  id: "Yahya ibn Abd al-Malik al-Ghafiqi, Abu al-Hasan, dikenal sebagai Ibn al-Habr, adalah orang Andalusia dari Murcia dan datang bersama komunitas; ia mahir menulis dan tidak memiliki bakat lain. Ia naik dari pelayanan Ibn Abi al-Husayn menjadi gubernur diwan, ulama ulama al-Wathiq, dan ia menguasai negara serta sultan hingga penderitaannya hancur oleh penderitaan Ibn Abi al-Husayn dalam Dhu al-Hijjah 676 H. Sekitar enam ratus ribu dinar diambil dari makamnya. Para mullah membunuhnya pada tanggal pertama Dhu al-Qi'dah tahun 677 H di kursinya di Gerbang Sultan dan melemparkan kepalanya ke kerumunan, yang mengutak-atiknya."
