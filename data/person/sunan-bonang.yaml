summary:
  ar: "أحد الأولياء التسعة في جاوة (ت. 1525)، ابن سونن أمبل وتلميذه، ومعلّم رادين فاتح مؤسس دماك. اشتهر بدعوته بالفن: نظم التمبانغ المشهور «تومبو آتي» (شفاء القلب) وأدخل آلة البونانغ في الغاملان الجاوي مشبعًا إياه بمعاني الذكر، وتنسب إليه المرويات كتاب «بوك فان بونانغ» الذي دافع فيه عن أرثوذكسية إسلامية صارمة ضد البدع، كما تروي البابادات الجاوية عنه أخبار الكرامات ومجابهة أصحاب السحر الأسود."
  en: "One of the nine Wali Songo of Java (d. 1525), son and student of Sunan Ampel and teacher of Raden Patah, the founder of Demak. He is remembered for preaching through art: he composed the famous tembang 'Tombo Ati' ('Remedy of the Heart'), gave the Javanese gamelan its bonang instrument and a new dhikr-laden character, and is associated with the Book of Bonang, which defends a strict Islamic orthodoxy against innovation; the Javanese babads also credit him with wonder-working contests against practitioners of black magic."
  ur: "جاوا کے نو اولیا (ولی سونگو) میں سے ایک (وفات 1525ء)، سونن امپل کے بیٹے اور شاگرد، اور دماک کے بانی رادین پاتاہ کے استاد۔ وہ فن کے ذریعے تبلیغ کے لیے مشہور ہیں: معروف تمنبانگ ”تومبو آتی“ (دل کا علاج) انھیں سے منسوب ہے، انھوں نے جاوا کے گاملان میں بونانگ ساز شامل کر کے اسے ذکر کی فضا دی، اور ”کتاب بونانگ“ ان سے منسوب ہے جس میں بدعت کے مقابلے میں سخت اسلامی اعتدال پسندی — راست اعتقادی — کی حمایت ہے؛ جاوا کی باباد روایات ان سے کرامات اور اہلِ سحر سے مقابلے بھی منسوب کرتی ہیں۔"

