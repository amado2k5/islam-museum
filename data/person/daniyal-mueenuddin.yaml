summary:
  ar: "دانيال معين الدين ⁦(وُلد سنة 1963)⁩ كاتب قصص باكستاني أمريكي، وُلد في لوس أنجلوس لأب باكستاني من كبار موظفي الخدمة المدنية وأم نرويجية أمريكية، ونشأ في لاهور، ودرس في دارتموث وكلية الحقوق في ييل، وعمل محامي شركات في نيويورك، ثم عاد إلى باكستان ليدير مزرعة عائلته في البنجاب ويكتب في الصباحات الباكرة. مجموعته «في غرف أخرى، عجائب أخرى» تُرجمت إلى ست عشرة لغة ونالت جائزة القصة وجائزة كتّاب الكومنولث. يقضي وقته بين أوسلو ومزرعته في باكستان."
  en: "Daniyal Mueenuddin (born 1963) is a Pakistani-American short-story writer, born in Los Angeles to a Pakistani senior civil servant and a Norwegian-American mother and raised in Lahore. Educated at Dartmouth and Yale Law School, he practised corporate law in New York before returning to Pakistan to run his family's farm in Punjab, writing in the early mornings. His collection In Other Rooms, Other Wonders has been translated into sixteen languages and won The Story Prize and the Commonwealth Writers' Prize; he divides his time between Oslo and his farm in Pakistan."
  ur: "دانیال معین الدین ⁦(پیدائش 1963)⁩ پاکستانی امریکی افسانہ نگار ہیں، جو لاس اینجلس میں ایک پاکستانی سینئر سول سرونٹ والد اور نارویجن امریکی والدہ کے ہاں پیدا ہوئے اور لاہور میں پلے بڑھے۔ ڈارٹماؤتھ اور ییل لا اسکول سے تعلیم پائی، نیویارک میں کارپوریٹ قانون کی پریکٹس کی، پھر پاکستان لوٹ کر پنجاب میں خاندانی فارم سنبھالا اور صبح سویرے لکھنے لگے۔ ان کا مجموعہ «In Other Rooms, Other Wonders» سولہ زبانوں میں ترجمہ ہوا اور اس نے دی اسٹوری پرائز اور دولت مشترکہ مصنفین کا انعام جیتا؛ وہ وقت اوسلو اور پاکستان کے فارم کے درمیان گزارتے ہیں۔"
  es: "Daniyal Mueenuddin (nacido en 1963) es un escritor de relatos cortos pakistaní-estadounidense, nacido en Los Ángeles, hijo de un alto funcionario pakistaní y una madre noruego-estadounidense, y criado en Lahore. Estudió en Dartmouth y en la Facultad de Derecho de Yale, y ejerció la abogacía corporativa en Nueva York antes de regresar a Pakistán para administrar la granja familiar en Punjab, donde escribía por las mañanas. Su colección de relatos «En otras habitaciones, otras maravillas» ha sido traducida a dieciséis idiomas y ha ganado el Premio de Cuento y el Premio de Escritores de la Commonwealth; actualmente divide su tiempo entre Oslo y su granja en Pakistán."
  fr: "Daniyal Mueenuddin (né en 1963) est un nouvelliste pakistano-américain. Né à Los Angeles d'un père haut fonctionnaire pakistanais et d'une mère norvégo-américaine, il a grandi à Lahore. Après des études à Dartmouth et à la faculté de droit de Yale, il a exercé le droit des affaires à New York avant de retourner au Pakistan pour gérer la ferme familiale au Pendjab, où il écrivait aux aurores. Son recueil de nouvelles, « In Other Rooms, Other Wonders », a été traduit en seize langues et a remporté le Story Prize et le Commonwealth Writers' Prize. Il partage son temps entre Oslo et sa ferme au Pakistan."
  tr: "Daniel Moinuddin (1963 doğumlu), Los Angeles'ta doğmuş, Pakistanlı bir baba olan ve üst düzey bir devlet memuru olan bir baba ile Norveç-Amerikalı bir annenin çocuğu olarak doğmuştur. Lahor'da büyüdü, Dartmouth ve Yale Hukuk Fakültesi'nde eğitim aldı, New York'ta kurumsal avukat olarak çalıştı ve ardından Pakistan'a dönerek Pencap'taki aile çiftliğini yönetmeye ve sabahları erken saatlerde yazmaya başladı. \"In Other Rooms, Other Wonders\" adlı koleksiyonu on altı dile çevrildi ve Kısa Hikaye Ödülü ile Commonwealth Kitap Ödülü'nü kazandı. Zamanını Oslo ile Pakistan'daki çiftliği arasında geçiriyor."
  id: "Daniel Moinuddin (lahir 1963) adalah seorang pendongeng Pakistan-Amerika, lahir di Los Angeles dari ayah Pakistan yang merupakan pegawai negeri senior dan ibu Norwegia-Amerika. Ia tumbuh besar di Lahore, belajar di Dartmouth dan Yale Law School, bekerja sebagai pengacara korporat di New York, lalu kembali ke Pakistan untuk mengelola pertanian keluarganya di Punjab dan menulis di pagi hari. Kumpulan karyanya \"In Other Rooms, Other Wonders\" telah diterjemahkan ke dalam enam belas bahasa dan memenangkan Penghargaan Cerita Pendek serta Penghargaan Buku Persemakmuran. Ia menghabiskan waktunya antara Oslo dan pertaniannya di Pakistan."

