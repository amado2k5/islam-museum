summary:
  ar: "دانيال معين الدين (وُلد سنة 1963) كاتب قصص باكستاني أمريكي، وُلد في لوس أنجلوس لأب باكستاني من كبار موظفي الخدمة المدنية وأم نرويجية أمريكية، ونشأ في لاهور، ودرس في دارتموث وكلية الحقوق في ييل، وعمل محامي شركات في نيويورك، ثم عاد إلى باكستان ليدير مزرعة عائلته في البنجاب ويكتب في الصباحات الباكرة. مجموعته «في غرف أخرى، عجائب أخرى» تُرجمت إلى ست عشرة لغة ونالت جائزة القصة وجائزة كتّاب الكومنولث. يقضي وقته بين أوسلو ومزرعته في باكستان."
  en: "Daniyal Mueenuddin (born 1963) is a Pakistani-American short-story writer, born in Los Angeles to a Pakistani senior civil servant and a Norwegian-American mother and raised in Lahore. Educated at Dartmouth and Yale Law School, he practised corporate law in New York before returning to Pakistan to run his family's farm in Punjab, writing in the early mornings. His collection In Other Rooms, Other Wonders has been translated into sixteen languages and won The Story Prize and the Commonwealth Writers' Prize; he divides his time between Oslo and his farm in Pakistan."
  ur: "دانیال معین الدین (پیدائش 1963) پاکستانی امریکی افسانہ نگار ہیں، جو لاس اینجلس میں ایک پاکستانی سینئر سول سرونٹ والد اور نارویجن امریکی والدہ کے ہاں پیدا ہوئے اور لاہور میں پلے بڑھے۔ ڈارٹماؤتھ اور ییل لا اسکول سے تعلیم پائی، نیویارک میں کارپوریٹ قانون کی پریکٹس کی، پھر پاکستان لوٹ کر پنجاب میں خاندانی فارم سنبھالا اور صبح سویرے لکھنے لگے۔ ان کا مجموعہ «In Other Rooms, Other Wonders» سولہ زبانوں میں ترجمہ ہوا اور اس نے دی اسٹوری پرائز اور دولت مشترکہ مصنفین کا انعام جیتا؛ وہ وقت اوسلو اور پاکستان کے فارم کے درمیان گزارتے ہیں۔"

