summary:
  ar: "ثقفي ذكره الصلابي في قائمة ولاة علي واليا على المدائن {cite:sallabi-ali-vol1 p. 359}، ولم يذكر الكتاب في هذا الموضع تاريخ ولايته ولا أخباره."
  en: "A man of Thaqif whom the book lists as Ali's governor of al-Mada'in {cite:sallabi-ali-vol1 p. 359}; the passage gives neither the dates of his office nor further reports."
  es: "Un hombre de Thaqif a quien el libro menciona como gobernador de Ali en al-Mada'in {cite:sallabi-ali-vol1 p. 359}; el pasaje no proporciona ni las fechas de su cargo ni más informes."
  fr: "Un homme de Thaqif que le livre mentionne comme gouverneur d'al-Mada'in d'Ali {cite:sallabi-ali-vol1 p. 359}; le passage ne donne ni les dates de son mandat ni d'autres informations."
  ur: "ثقیف کا ایک آدمی جسے کتاب میں علی کے گورنر المدائن کے طور پر درج کیا گیا ہے۔ 359} اس حوالے سے نہ تو ان کے دفتر کی تاریخیں دی گئی ہیں اور نہ ہی مزید رپورٹس۔"
  tr: "Thaqafi, Al-Sallabi tarafından Ali'nin şehirler üzerindeki valileri listesinde kendisinden bahsetmiştir {cite:sallabi-ali-cilt1, s. 359}, ancak kitapta burada valilik tarihi veya haberi belirtilmemiştir."
  id: "Thaqafi menyebutnya oleh Al-Sallabi dalam daftar gubernur Ali atas kota-kota {cite:sallabi-ali-vol1, hlm. 359}, tetapi buku tersebut tidak menyebutkan tanggal atau berita masa jabatannya di sini."
