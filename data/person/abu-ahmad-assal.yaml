gender: male
summary:
  ar: "محمد بن أحمد بن إبراهيم الأصبهاني، أبو أحمد العسال، قاضي أصبهان وحافظ متقن من أئمة الحديث، رحل إلى الحرمين وبغداد والكوفة والبصرة وواسط والري وخوزستان، وله الشيوخ والتفسير والتاريخ والمسند وغريب الحديث، توفي في رمضان سنة 349 هـ."
  en: "Muhammad ibn Ahmad ibn Ibrahim al-Isfahani, Abu Ahmad al-Assal, judge of Isfahan and a precise hadith hafiz, who travelled to the two sanctuaries, Baghdad, Kufa, Basra, Wasit, Rayy and Khuzistan and wrote al-Shuyukh, a tafsir, a history, a Musnad and Gharib al-Hadith; died in Ramadan 349 AH (960 CE)."
  fr: "Muhammad ibn Ahmad ibn Ibrahim al-Isfahani, Abu Ahmad al-Assal, cadi d'Ispahan et hafiz du hadith d'une grande précision, qui voyagea aux deux sanctuaires, à Bagdad, Koufa, Bassora, Wasit, Rayy et au Khuzistan et écrivit al-Shuyukh, un tafsir, une histoire, un Musnad et Gharib al-Hadith ; mort en ramadan 349 H (960 ap. J.-C.)."
  es: "Muhammad ibn Ahmad ibn Ibrahim al-Isfahani, Abu Ahmad al-Assal, juez de Isfahán y preciso hadiz hafiz, que viajó a los dos santuarios, Bagdad, Kufa, Basora, Wasit, Rayy y Juzistán y escribió al-Shuyukh, un tafsir, una historia, un Musnad y Gharib al-Hadith; Murió en Ramadán en el año 349 d. H. (960 d. C.)."
  ur: "محمد بن احمد بن ابراہیم اصفہانی، ابو احمد العسل، اصفہان کے قاضی اور صحیح حدیث کے حافظ، جنہوں نے دو مقدس مقامات بغداد، کوفہ، بصرہ، وسط، رے اور خوزستان کا سفر کیا اور الشیوخ، ایک تفسیر، ایک تاریخ، ایک مصحف، ایک کتاب لکھی۔ رمضان المبارک 349ھ (960) میں وفات پائی۔"
  tr: "İsfahan kadısı ve hadisleri ezberlemede usta olan, hadis imamlarından Muhammed ibn Ahmed ibn İbrahim el-Esbahani (Ebu Ahmed el-Essal), İki Mescid-i Şehitler, Bağdat, Kufe, Basra, Vasit, Rayy ve Huzistan'ı gezmiştir. Şeyhler, tefsir, tarih, Musned ve nadir hadisler üzerine kitapları vardı. Hicri 349 yılının Ramazan ayında vefat etmiştir."
  id: "Muhammad ibn Ahmad ibn Ibrahim al-Asbahani, Abu Ahmad al-Assal, hakim Isfahan dan seorang penghafal hadits yang mahir, salah satu imam hadits, melakukan perjalanan ke Dua Masjid Suci, Baghdad, Kufa, Basra, Wasit, Rayy dan Khuzestan. Beliau memiliki buku-buku tentang para syekh, tafsir, sejarah, Musnad dan hadits langka. Beliau wafat pada bulan Ramadan tahun 349 Hijriah."
