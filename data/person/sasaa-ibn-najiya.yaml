summary:
  ar: "صعصعة بن ناجية بن عقال المجاشعي التميمي، خطيب الجاهلية وجد الفرزدق الشاعر، وفيه قال الفرزدق «وناجية الذي كانت تميم تعيش برأيه أنّ أشار»؛ دعا بني تميم إلى الوثوب على أموال وهرز المارة ببلادهم إلى كسرى {cite:kamil-ibn-al-athir p. 349}، وهو مانع الوئيدة: أضل ناقتين فرأى ناراً ليلاً فإذا عندها رجل من بني الهجيم قد ولدت له جارية ويريد وأدها فاشتراها منه باللقوحين وجمله، وأحيا صعصعة مائة جارية ومنع أن يؤدن وابتاعهن، وقال الفرزدق «ومنا الذي منع الوائدات وأحيا الوئيد فلم يوئد»؛ وفد على النبي فأسلم وقرأ عليه سورة الزلزلة فلما بلغ قوله فمن يعمل مثقال ذرة خيراً يره قال حسبي وسأله من أبرّ فقال أمك ثم أباك ثم أخاك ثم أدانيك {cite:ansab-al-ashraf j.12 p. 61-62}."
  en: "Sa'sa'a ibn Najiya al-Mujashi'i of Tamim, the jahili orator and grandfather of al-Farazdaq — 'Najiya's son, by whose counsel Tamim lived'; he urged Tamim onto Khusraw's convoy before Islam {cite:kamil-ibn-al-athir p. 349}, and he is the legendary 'preventer of the buried-alive': finding a man of Banu al-Hujaym about to bury his newborn daughter he bought her for two milch camels and his own mount, saving a hundred girls in all; he later came in delegation to the Prophet, heard sura al-Zalzala and professed Islam {cite:ansab-al-ashraf j.12 p. 61-62}."
