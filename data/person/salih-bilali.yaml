  source: "Minimal honest record built in wave 186 under the founder's rulings review of 3 November 2026, per the brief's instruction for this row: one defined cited source suffices (PR #1484), and the writer must state exactly what could and could not be accessed. ACCESSED and read in full on 3 November 2026: the Lowcountry Digital History Initiative exhibit page (College of Charleston), chapter 1 of Claiming Freedom (University of South Carolina Press) on the publisher's Manifold platform, and the Message International article; the Face2Face Africa and Study Al-Islam retellings were read in search extracts and agree. NOT ACCESSED: Sylviane A. Diouf, Servants of Allah (NYU Press, 1998), which treats Salih Bilali from the Couper papers — no open copy could be read in this session, and no fact is taken from it at second hand; Philip D. Curtin's Africa Remembered (1967) does not treat him (its Georgia narrative is Ayuba Suleiman Diallo's); and the Couper family manuscripts themselves were not read. TWO CORRECTIONS TO THE COMMISSIONING BRIEF, found in every text read: Salih Bilali's island is St. Simons, not Sapelo (Sapelo, one island north, is Bilali Muhammad's), and no text calls him a landowner — he was an enslaved head driver, albeit one left in charge of the whole plantation for months at a time. His birth and death dates in the brief (c. 1765 – c. 1850s) are two of several readings and are preserved as readings, not adopted. No roles value is assigned: the controlled list has no honest value for an enslaved plantation head driver, and 'scholar' would overclaim what the texts attest (precedent for an omitted roles list: person/shuba-ibn-al-hajjaj). No place entity exists for Massina or St. Simons Island, and friendship has no predicate, so no relations are written; his friendship with person/bilali-muhammad is carried in prose."
