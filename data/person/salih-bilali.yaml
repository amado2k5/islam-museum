    note: "His personal Islam is among the best attested of any enslaved African in America, and it is preserved here in the words of the record-keepers. James Hamilton Couper, who knew him for decades, wrote of him (as quoted in the scholarship): 'a strict Mahometan; [he] abstains from spirituous liquors, and keeps the various fasts, particularly that of the Rhamadan'; the Lowcountry exhibit records that he was known across St. Simons and beyond 'for his Muslim practices', and the Couper family tradition, retold in Message International, remembers him as the most religious man his owner's son had ever known, whose last words were the shahada. But no text read names a branch or school for Salih Bilali himself. Massina lay inside the Maliki world of the Niger Bend, and his friend Bilali Muhammad's Arabic writing drew on a Maliki treatise — context and milieu, which the lane's doctrine does not count as attestation for the man. The value therefore stays unknown, on the same settlement as person/bilali-muhammad and person/omar-ibn-said."
    sources: [source/ldhi-salih-bilali, source/claiming-freedom-salih-bilali, source/message-international-first-muslims]
