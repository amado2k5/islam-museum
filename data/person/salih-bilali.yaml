  note: "Born at Massina on the Niger River, in present-day Mali; no Hijri year is given because the Gregorian year itself is contested. The scholarship read gives three birth readings: about 1790 (Lowcountry Digital History Initiative exhibit), 1765 (Claiming Freedom, University of South Carolina Press, which has him captured in 1790 and arriving in North America in 1800), and the 1770s (Message International and the Study Al-Islam retelling, which have him captured at about twelve and sold in the Bahamas before the Coupers bought him; one web tradition gives the years 1770–1846 and capture about 1782). The record's c. 1770 date is the middle reading, chosen because the 'captured at twelve' tradition is consistent with it and with a head driver's appointment in 1816; no reading commands assent, and all are preserved here. His DEATH is not dated in any scholarly source read: the 1846 of one web tradition is unverified, and the often-quoted 1857 is the death year of Bilali Muhammad of Sapelo Island, a different man. No died block is therefore written."
