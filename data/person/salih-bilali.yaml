summary:
  ar: "صالح بلالي ⁦(نحو سبعينيات القرن الثامن عشر – تاريخ وفاته غير ثابت)⁩ مسلم من ماسينا على نهر النيجر ⁦(مالي اليوم)⁩، أُسر صغيرًا وبِيع إلى جزر البهاما ثم إلى عائلة كوبر في جزيرة سانت سايمنز بجورجيا، حيث صار سنة 1816 السائق الرئيس المشرف على أكثر من أربعمئة مستعبد في مزرعة كانونز بوينت. كتب عنه مالكه جيمس هاملتون كوبر، فبقيت سيرته من أفضل سِيَر المسلمين المستعبدين في أمريكا توثيقًا: رجل وصفه ابنه بأنه «مسلم صارم» يمتنع عن الخمر ويصوم رمضان."
  en: "Salih Bilali (born c. 1770s; death date not established) was a Muslim of Massina on the Niger River, in present-day Mali, captured as a boy and sold to the Bahamas and then to the Couper family of St. Simons Island, Georgia, where in 1816 he became head driver over more than four hundred enslaved people at Cannon's Point plantation. His owner James Hamilton Couper wrote about him, leaving one of the best-recorded lives of an enslaved Muslim in America: a man his owner described as 'a strict Mahometan' who abstained from liquor and kept the fast of Ramadan."
  ur: "صالح بلالی (پیدائش تقریباً 1770ء کی دہائی؛ وفات کی تاریخ ثابت نہیں) دریائے نائجر پر واقع ماسینا (موجودہ مالی) کے مسلمان تھے؛ بچپن میں پکڑے گئے، بہاماس اور پھر جارجیا کے جزیرہ سینٹ سائمنز کے کوپر خاندان کو بیچے گئے، جہاں 1816ء میں وہ کیننز پوائنٹ کے باغ میں چار سو سے زائد غلاموں کے سربراہ نگراں بنے۔ ان کے مالک جیمس ہیملٹن کوپر نے ان کے بارے میں لکھا، اس لیے ان کی زندگی امریکا کے غلام مسلمانوں کی سب سے بہتر دستاویزی زندگیوں میں سے ایک ہے؛ مالک نے انھیں «سخت مسلمان» کہا جو شراب سے پرہیز کرتے اور رمضان کے روزے رکھتے تھے۔"
