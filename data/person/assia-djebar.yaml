summary:
  ar: "آسيا جبار ⁦(1936–2015)⁩ روائية ومقالية ومخرجة جزائرية كتبت بالفرنسية، أول شمال أفريقية تنتخب عضواً في الأكاديمية الفرنسية ⁦(2005)⁩. تناولت في أعمالها تاريخ الجزائر وأصوات النساء، ومن رواياتها «Fantasia» و«أطياف» و«نساء الجزائر في شقتهن»."
  en: "Assia Djebar (1936–2015) was an Algerian novelist, essayist and filmmaker who wrote in French, the first North African elected to the Académie française (2005). Her fiction explores Algerian history and women's voices; works include Fantasia, Women of Algiers in Their Apartment and So Vast the Prison."
  ur: "اسیا جبار ⁦(1936–2015)⁩ الجزائری ناول نگار، مضمون نگار اور فلم ساز تھیں جو فرانسیسی میں لکھتی تھیں، فرانسیسی اکادمی کے لیے منتخب ہونے والی پہلی شمالی افریقی ⁦(2005)⁩۔ ان کا ادب الجزائر کی تاریخ اور خواتین کی آوازوں کا مطالعہ ہے؛ آثار میں Fantasia اور Women of Algiers in Their Apartment شامل ہیں۔"
