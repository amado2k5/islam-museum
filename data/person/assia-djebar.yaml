summary:
  ar: "آسيا جبار ⁦(1936–2015)⁩ روائية ومقالية ومخرجة جزائرية كتبت بالفرنسية، أول شمال أفريقية تنتخب عضواً في الأكاديمية الفرنسية ⁦(2005)⁩. تناولت في أعمالها تاريخ الجزائر وأصوات النساء، ومن رواياتها «Fantasia» و«أطياف» و«نساء الجزائر في شقتهن»."
  en: "Assia Djebar (1936–2015) was an Algerian novelist, essayist and filmmaker who wrote in French, the first North African elected to the Académie française (2005). Her fiction explores Algerian history and women's voices; works include Fantasia, Women of Algiers in Their Apartment and So Vast the Prison."
  ur: "اسیا جبار ⁦(1936–2015)⁩ الجزائری ناول نگار، مضمون نگار اور فلم ساز تھیں جو فرانسیسی میں لکھتی تھیں، فرانسیسی اکادمی کے لیے منتخب ہونے والی پہلی شمالی افریقی ⁦(2005)⁩۔ ان کا ادب الجزائر کی تاریخ اور خواتین کی آوازوں کا مطالعہ ہے؛ آثار میں Fantasia اور Women of Algiers in Their Apartment شامل ہیں۔"
  es: "Assia Djebar (1936-2015) fue una novelista, ensayista y cineasta argelina que escribía en francés, y la primera norteafricana elegida miembro de la Academia Francesa (2005). Su obra narrativa explora la historia de Argelia y las voces femeninas; entre sus obras destacan Fantasía, Mujeres de Argel en su apartamento y Tan vasta la prisión."
  fr: "Assia Djebar (1936-2015) était une romancière, essayiste et réalisatrice algérienne de langue française, première Nord-Africaine élue à l'Académie française (2005). Son œuvre explore l'histoire algérienne et la parole des femmes; parmi ses romans figurent Fantasia, Femmes d'Alger dans leur appartement et Si vaste la prison."
  tr: "Assia Djebar (1936–2015), Fransızca yazan Cezayirli bir romancı, deneme yazarı ve yönetmendi; 2005 yılında Fransız Akademisi'ne üye seçilen ilk Kuzey Afrikalı oldu. Eserleri, \"Fantasia,\" \"Specters\" ve \"Women of Algeria in Apartment\" gibi romanlar da dahil olmak üzere Cezayir tarihini ve kadın seslerini ele aldı."
  id: "Assia Djebar (1936–2015) adalah seorang novelis, esais, dan sutradara asal Aljazair yang menulis dalam bahasa Prancis, menjadi orang Afrika Utara pertama yang terpilih sebagai anggota Akademi Prancis (2005). Karya-karyanya membahas sejarah Aljazair dan suara perempuan, termasuk novel seperti \"Fantasia,\" \"Specters,\" dan \"Women of Algeria in Their Apartment.\""
