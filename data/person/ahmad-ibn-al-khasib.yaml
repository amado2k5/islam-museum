id: person/ahmad-ibn-al-khasib
class: person
label: { ar: "أحمد بن الخصيب", en: "Ahmad ibn al-Khasib", fr: "Ahmad ibn al-Khasib", es: "Ahmad ibn al-Khasib", ur: "احمد بن الخصیب" }
summary:
  ar: "وزير المعتصم، روى الصولي عنه أن المعتصم قال له بنو أمية ملكوا وما لأحد منا ملك وملكنا نحن ولهم بالأندلس هذا الأموي فقدر ما يحتاج إليه لمحاربته فشرع في ذلك فاشتدت علته ومات {cite:tarikh-khulafa-minhaj-1434 p. 524}، وعند المسعودي هو ابن الضحاك الجرجاني ووزر للمنتصر وقال حين عفا عن الشاري إن لذة العفو أعذب من لذة التشفي وأقبح أفعال المقتدر الانتقام {cite:muruj-al-dhahab p. 521}."
  en: "Al-Mu'tasim's minister; per al-Suli the caliph told him 'the Umayyads ruled when none of us ruled — we rule and this Umayyad holds al-Andalus? Reckon what is needed to fight him' — begun before his illness worsened and he died {cite:tarikh-khulafa-minhaj-1434 p. 524}، وعند المسعودي هو ابن الضحاك الجرجاني ووزر للمنتصر وقال حين عفا عن الشاري إن لذة العفو أعذب من لذة التشفي وأقبح أفعال المقتدر الانتقام {cite:muruj-al-dhahab p. 521}."
  fr: "Ministre d'al-Mu'tasim ; selon al-Suli, le calife s'étonna que l'Omeyyade gouvernât al-Andalus alors que les Abbassides régnaient, après l'époque où seuls les Omeyyades avaient régné, et lui demanda de calculer les moyens de le combattre. Le travail fut commencé avant l'aggravation de sa maladie et sa mort {cite:tarikh-khulafa-minhaj-1434 p. 524}. Selon al-Mas'udi, il était fils d'al-Dahhak al-Jurjani et vizir d'al-Muntasir ; pardonnant à al-Shari, il dit que la douceur du pardon dépasse celle de la vengeance, l'un des actes les plus laids d'al-Muqtadir {cite:muruj-al-dhahab p. 521}."
  es: "Ministro de Al-Mu'tasim; según Al-Suli, el califa le dijo: «Los omeyas gobernaban cuando ninguno de nosotros gobernaba; nosotros gobernamos, ¿y este omeya controla Al-Ándalus? Calcula lo que se necesita para combatirlo». Esto comenzó antes de que su enfermedad empeorara y muriera {cita: tarikh-khulafa-minhaj-1434 p. 524}, y según Al-Mas'udi, es Ibn Al-Dahhak Al-Jurjani y ministro de Al-Muntasir, y dijo cuando perdonó a Al-Shari que el placer del perdón es más dulce que el placer de la venganza, y que la más fea de las acciones de los poderosos es la venganza {cita: muruj-al-dhahab p. 521}."
  ur: "المعتصم کا وزیر؛ فی السولی نے اس سے کہا کہ امویوں نے حکومت کی جب ہم میں سے کوئی حکومت نہیں کرتا تھا - ہم حکومت کرتے ہیں اور یہ اموی اندلس پر قبضہ کرتا ہے؟ اس سے لڑنے کے لیے کیا ضروری ہے، اس کی بیماری کے بڑھنے سے پہلے شروع ہوا اور اس کی موت ہو گئی۔ اور مسعودی کے مطابق وہ ابن الضحاک الجرجانی ہیں اور المنتصر کے وزیر ہیں اور انہوں نے الشری کو معاف کرتے وقت کہا تھا کہ معافی کی لذت انتقام کی لذت سے زیادہ میٹھی ہے اور طاقت ور کے اعمال میں سب سے برا کام انتقام ہے۔ 521}۔"
  tr: "Mu'tesim'in veziri Suli, Mu'tesim'in kendisine şöyle dediğini rivayet etmiştir: \"Benu Emeviler hüküm sürdü ve bizden hiçbirinin krallığı yok. Bizim krallığımız var, onların ise Endülüs'te bu Emeviler var.\" Bunun üzerine onunla savaşmak için gerekenleri hesapladı ve savaşa başladı, ancak hastalığı kötüleşti ve öldü. {kaynak:tarikh-khulafa-minhaj-1434 s. 524} Mes'udi'ye göre, o İbn el-Dahhak el-Curcani'dir ve Muntasir'in veziriydi. Şeriat'ı affettiğinde, affetmenin zevkinin intikamdan daha tatlı olduğunu ve güçlülerin en çirkin eyleminin intikam olduğunu söylemiştir. {kaynak:muruj-al-dhahab s. 521}"
  id: "Menteri Al-Mu'tasim, Al-Suli, meriwayatkan bahwa Al-Mu'tasim berkata kepadanya, \"Bannu Umayyah telah berkuasa, dan tidak seorang pun dari kita memiliki kerajaan. Kita memiliki kerajaan, dan mereka memiliki Umayyah ini di Andalusia.\" Maka ia memperkirakan apa yang dibutuhkan untuk melawannya, dan ia mulai melakukannya, tetapi penyakitnya memburuk dan ia meninggal. {cite:tarikh-khulafa-minhaj-1434 p. 524} Menurut Al-Mas'udi, ia adalah Ibn Al-Dahhak Al-Jurjani, dan ia adalah menteri Al-Muntasir. Ia berkata ketika ia mengampuni Al-Shari bahwa kenikmatan pengampunan lebih manis daripada kenikmatan pembalasan, dan perbuatan terburuk dari orang-orang berkuasa adalah pembalasan. {cite:muruj-al-dhahab p. 521}"
