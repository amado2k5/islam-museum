  en: "Ibrahim ibn Yusuf al-Makiyani"
  es: "Ibrahim ibn Yusuf al-Makiyani"
  fr: "Ibrahim ibn Yusuf al-Makiyani"
  ur: "ابراہیم بن یوسف المکیانی"
roles: [scholar, jurist]
gender: male
summary:
  ar: "إبراهيم بن يوسف بن ميمون، أبو إسحاق الباهلي، المعروف بالماكياني، شيخ بلخ وعالمها في زمانه، كان كبير المحل عند أصحاب أبي حنيفة، لزم أبا يوسف حتى برع، وروى عن سفيان بن عيينة وإسماعيل بن علية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636} وثقه النسائي وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636}"
  en: "Ibrahim ibn Yusuf ibn Maymun, Abu Ishaq al-Bahili, known as al-Makiyani, the scholar of Balkh in his time and a leading Hanafi of his day. He attended Abu Yusuf until he excelled, and transmitted from Sufyan ibn Uyayna and Isma'il ibn Ulayya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636} al-Nasai judged him trustworthy and Ibn Hibban counted him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636}"
  es: "Ibrahim ibn Yusuf ibn Maymun, Abu Ishaq al-Bahili, también conocido como al-Makiyani, el erudito de Balkh en su época y un destacado Hanafi de su época. Asistió a Abu Yusuf hasta que sobresalió y transmitió desde Sufyan ibn Uyayna e Isma'il ibn Ulayya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636} al-Nasai lo consideró digno de confianza e Ibn Hibban lo contó entre los dignos de confianza. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636}"
  fr: "Ibrahim ibn Yusuf ibn Maymun, Abu Ishaq al-Bahili, également connu sous le nom d'al-Makiyani, l'érudit de Balkh à son époque et l'un des principaux Hanafi de son époque. Il a assisté à Abu Yusuf jusqu'à ce qu'il excelle et a transmis de Sufyan ibn Uyayna et Isma'il ibn Ulayya. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.16636} al-Nasai l'a jugé digne de confiance et Ibn Hibban l'a compté parmi les dignes de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636}"
  ur: "ابراہیم بن یوسف بن میمون، ابو اسحاق الباہلی، المکیانی کے نام سے بھی جانا جاتا ہے، اپنے زمانے میں بلخ کا عالم اور اپنے دور کا ایک معروف حنفی تھا۔ اس نے ابو یوسف کے پاس حاضری دی یہاں تک کہ وہ سبقت لے گئے، اور سفیان بن عیینہ اور اسماعیل بن علیہ سے نقل کیا۔ النسائی نے اسے ثقہ قرار دیا ہے اور ابن حبان نے اسے ثقہ قرار دیا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص16636}"
