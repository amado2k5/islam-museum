summary:
  ar: "إبراهيم بن يوسف بن ميمون، أبو إسحاق الباهلي، المعروف بالماكياني، شيخ بلخ وعالمها في زمانه، كان كبير المحل عند أصحاب أبي حنيفة، لزم أبا يوسف حتى برع، وروى عن سفيان بن عيينة وإسماعيل بن علية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636} وثقه النسائي وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636}"
  en: "Ibrahim ibn Yusuf ibn Maymun, Abu Ishaq al-Bahili, known as al-Makiyani, the scholar of Balkh in his time and a leading Hanafi of his day. He attended Abu Yusuf until he excelled, and transmitted from Sufyan ibn Uyayna and Isma'il ibn Ulayya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636} al-Nasai judged him trustworthy and Ibn Hibban counted him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636}"
