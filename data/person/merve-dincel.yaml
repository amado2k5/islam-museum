summary:
  ar: "لاعبة تايكوندو تركية، وُلدت في أنقرة سنة 1999. بطلة العالم في وزن 49 كغ في باكو 2023، وبطلة أوروبا وبطلة ألعاب البحر الأبيض المتوسط 2022. تزوّجت سنة 2023 من لاعب التايكوندو فرحات جان كافورات، وتُنافس منذ ذلك الحين باسم ميرفي كافورات."
  en: "Turkish taekwondo athlete, born in Ankara in 1999. World champion at 49 kg at Baku 2023, and European and Mediterranean Games champion in 2022. She married the taekwondo practitioner Ferhat Can Kavurat in 2023 and has since competed as Merve Kavurat."
  ur: "ترک تائیکوانڈو کھلاڑی، جو 1999 میں انقرہ میں پیدا ہوئیں۔ باکو 2023 میں 49 کلوگرام کی عالمی چیمپئن، اور 2022 کی یورپی و بحیرہ روم کھیلوں کی چیمپئن۔ 2023 میں تائیکوانڈو کھلاڑی فرحات جان کافورات سے شادی کے بعد وہ مروے کافورات کے نام سے کھیلتی ہیں۔"
