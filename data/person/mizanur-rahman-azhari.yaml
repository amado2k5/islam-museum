  ar: "داعية وباحث إسلامي بنغلاديشي، وُلد في دكا سنة 1990، درس التفسير وعلوم القرآن في جامعة الأزهر ثم في الجامعة الإسلامية العالمية بماليزيا، واشتهر بمحاضرات الوعظ ⁦(الواز محفل)⁩ التي تصل إلى ملايين المشاهدين عبر المنصات الرقمية."
