summary:
  ar: "تقي الدين ابن قاضي عجلون الدمشقي الشافعي؛ ولد بدمشق في شعبان سنة إحدى وأربعين وثمانمائة وأخذ عن والده وأخيه شيخ الإسلام نجم الدين وشيخ الإسلام زين الدين خطاب وسمع على أبي الحسن بن بردس والحافظ ابن ناصر الدين وأخذ عن ابن حجر مكاتبة وعن صالح البلقيني والجلال المحلي، وكان أفقه أهل زمانه ودرّس بالجامع الأموي والشامية البرانية والعمرية وبالقاهرة، وألف منسكاً وكتابه إعلام النعيه مما زاد على المنهاج، وانتهت إليه مشيخة الإسلام ورياسة الشافعية ببلاد الشام بل وبغيرها من بلاد الإسلام. ولما ألف البقاعي كتابه في الرد على حجة الإسلام الغزالي وبالغ في الإنكار على ابن العربي كان الشيخ تقي الدين من أشد الناس عليه وهجره. وامتُحن في أيام الغوري بسبب فتياه في واقعة ابن محيي الدين الأسلمي فطُلب إلى القاهرة وغُرّم أموالاً كثيرة حتى باع أكثر كتبه، وانتهى الأمر على العمل بفتياه وإعادة التربة المهدومة كما كانت. توفي ضحوة يوم الاثنين حادي عشر رمضان ودُفن بمقبرة باب الصغير {cite:shadharat-dhahab p. 558-559}."
  en: "Shaykh al-Islam of Damascus — b. Sha'ban 841, 'the most juridical of his age', riyasa of the Shafi'is 'not in Syria alone but in other lands of Islam'; he boycotted al-Biqa'i over the anti-Ghazali/anti-Ibn-'Arabi tract; under al-Ghuri he was hauled to Cairo and fined until he sold most of his books — then his fatwa prevailed and the razed turba was rebuilt. Died Monday 11 Ramadan [928], Bab al-Saghir {cite:shadharat-dhahab p. 558-559}."
  es: "Shaykh al-Islam de Damasco — n. Sha'ban 841, «el más jurista de su época», riyasa de los shafi'ís «no solo en Siria sino en otras tierras del Islam»; boicoteó a al-Biqa'i por el tratado anti-Ghazali/anti-Ibn-'Arabi; bajo el mandato de al-Ghuri fue llevado a El Cairo y multado hasta que vendió la mayoría de sus libros; entonces prevaleció su fatwa y la turba arrasada fue reconstruida. Murió el lunes 11 de Ramadán [928], Bab al-Saghir {cita: shadharat-dhahab págs. 558-559}."
  fr: "Cheikh al-Islam de Damas (né en Sha'ban 841), « le plus juriste de son temps », riyasa de l'école chaféite « non seulement en Syrie, mais aussi dans d'autres pays d'Islam », il boycotta al-Biqa'i en raison de son traité anti-Ghazali et anti-Ibn Arabi. Sous al-Ghuri, il fut emmené au Caire et condamné à une amende jusqu'à ce qu'il vende la plupart de ses livres; sa fatwa fut alors approuvée et la turba détruite fut reconstruite. Il mourut le lundi 11 Ramadan [928], à Bab al-Saghir (voir: shadharat-dhahab, p. 558-559)."
  ur: "دمشق کے شیخ الاسلام - b. شعبان 841، 'اپنی عمر کا سب سے زیادہ فقیہ'، شافعیوں کی ریاضت 'صرف شام میں نہیں بلکہ اسلام کے دیگر ممالک میں'؛ اس نے غزالی مخالف/ ابن عربی کے خلاف ہونے پر البیقا کا بائیکاٹ کیا۔ الغوری کے تحت اسے قاہرہ لے جایا گیا اور اس پر جرمانہ عائد کیا گیا یہاں تک کہ اس نے اپنی زیادہ تر کتابیں فروخت کر دیں - پھر اس کا فتویٰ غالب ہوا اور مسمار شدہ تربہ دوبارہ تعمیر کر دی گئی۔ وفات سوموار 11 رمضان [928] باب الصغیر 558-559}۔"
  tr: "Taqi al-Din ibn Qadi Ajlun al-Dimashqi al-Shafi'i; 841 Hicri yılında Şaban Şam'da doğdu. Babası ve kardeşi Şeyhül-İslam Necmeddin ile Şeyh el-İslam Zeyn el-Din Hattab'ın yanında eğitim aldı. Ayrıca Ebu el-Hasan ibn Bardas ve hafız İbn Nasır el-Din'in yanında eğitim aldı. İbn Hacer, Salih el-Balkini ve el-Celal el-Mahalli'nin yanında eğitim aldı. Zamanının en bilgilisiydi. Baraniyya ve Kahire'deki Emevi ve Levant camilerinde eğitim aldı, bir ritüel ve 'I'lam al-Na'iyya' adlı kitabını yazdı, bu da Minhaj'a katkı sağladı. Sonunda İslam'ın şeyhi ve Şam ile diğer İslam topraklarındaki Şafiilerin liderliği oldu. El-Bukai, Hujjat el-İslam Gazeli'yi çürüten ve İbn el-Arabi'yi kapsamlı şekilde eleştiren kitabını yazdığında, Şeyh Taqi el-Din ona karşı en sert olanlardan biri oldu ve onu terk etti. El-Ghuri'nin döneminde, İbn Muhyiddin al-Aslami olayıyla ilgili fetvaları nedeniyle sınandı, bu yüzden Kahire'yi aradı ve kitaplarının çoğunu satana kadar büyük bir miktar para ödedi. Sonunda, fetvalarına uydu ve harap olmuş toprağı olduğu gibi geri getirdi. Ramazan'ın on birinci Pazartesi sabahı vefat etti ve Bab al-Saghir mezarlığına defnedildi {cite:shadharat-dhahab, s. 558-559}."
  id: "Taqi al-Din ibn Qadi Ajlun al-Dimashqi al-Shafi'i; ia lahir di Damaskus di Sha'ban pada tahun 841 H. Ia belajar di bawah bimbingan ayah dan saudaranya Shaykh al-Islam Najm al-Din dan Shaykh al-Islam Zayn al-Din Khattab. Ia juga belajar di bawah bimbingan Abu al-Hasan ibn Bardas dan hafiz Ibn Nasir al-Din. Ia belajar di bawah bimbingan Ibn Hajar, Salih al-Balqini, dan al-Jalal al-Mahalli. Ia adalah yang paling berpengetahuan pada zamannya. Ia belajar di masjid Umayyah dan Levant di Baraniyya dan Kairo, serta menulis ritual dan bukunya 'I'lam al-Na'iyya,' yang menambah Minhaj. Ia akhirnya menjadi sheikh Islam dan pemimpin Syha'i di Levant bahkan di tanah Islam lainnya. Ketika al-Buqa'i menulis bukunya yang membantah Hujjat al-Islam al-Ghazali dan mengkritik Ibn al-Arabi secara luas, Sheikh Taqi al-Din termasuk yang paling keras terhadapnya dan meninggalkannya. Ia diuji pada masa al-Ghuri karena fatwa-fatwanya terkait insiden Ibn Muhyiddin al-Aslami, sehingga ia mencari Kairo dan membayar sejumlah besar uang hingga sebagian besar bukunya terjual. Akhirnya, ia melaksanakan fatwa-fatwanya dan mengembalikan tanah yang rusak seperti semula. Ia meninggal pada Senin pagi, tanggal sebelas Ramadan, dan dimakamkan di pemakaman Bab al-Saghir {cite:shadharat-dhahab, hlm. 558-559}."
