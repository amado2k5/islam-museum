summary:
  ar: "تقي الدين ابن قاضي عجلون الدمشقي الشافعي؛ ولد بدمشق في شعبان سنة إحدى وأربعين وثمانمائة وأخذ عن والده وأخيه شيخ الإسلام نجم الدين وشيخ الإسلام زين الدين خطاب وسمع على أبي الحسن بن بردس والحافظ ابن ناصر الدين وأخذ عن ابن حجر مكاتبة وعن صالح البلقيني والجلال المحلي، وكان أفقه أهل زمانه ودرّس بالجامع الأموي والشامية البرانية والعمرية وبالقاهرة، وألف منسكاً وكتابه إعلام النعيه مما زاد على المنهاج، وانتهت إليه مشيخة الإسلام ورياسة الشافعية ببلاد الشام بل وبغيرها من بلاد الإسلام. ولما ألف البقاعي كتابه في الرد على حجة الإسلام الغزالي وبالغ في الإنكار على ابن العربي كان الشيخ تقي الدين من أشد الناس عليه وهجره. وامتُحن في أيام الغوري بسبب فتياه في واقعة ابن محيي الدين الأسلمي فطُلب إلى القاهرة وغُرّم أموالاً كثيرة حتى باع أكثر كتبه، وانتهى الأمر على العمل بفتياه وإعادة التربة المهدومة كما كانت. توفي ضحوة يوم الاثنين حادي عشر رمضان ودُفن بمقبرة باب الصغير {cite:shadharat-dhahab p. 558-559}."
  en: "Shaykh al-Islam of Damascus — b. Sha'ban 841, 'the most juridical of his age', riyasa of the Shafi'is 'not in Syria alone but in other lands of Islam'; he boycotted al-Biqa'i over the anti-Ghazali/anti-Ibn-'Arabi tract; under al-Ghuri he was hauled to Cairo and fined until he sold most of his books — then his fatwa prevailed and the razed turba was rebuilt. Died Monday 11 Ramadan [928], Bab al-Saghir {cite:shadharat-dhahab p. 558-559}."
