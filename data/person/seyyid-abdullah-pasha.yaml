summary:
  ar: "عبد الله باشا بن إبراهيم الحسيني الجرمكي الشتجي، والٍ عثماني من جرمك في أعمال ديار بكر، ولي الصدارة العظمى وآخر ما وليه حلب ثم دمشق سنة 1172 هـ، وصنف «أنهار الجنان في ينابيع آيات القرآن»؛ توفي سنة 1174 هـ الموافقة 1761 م."
  en: "Abd Allah Pasha ibn Ibrahim al-Husayni al-Jarmaki al-Shatji, an Ottoman governor from Jarmak in the district of Diyarbakir, who held the grand vizierate, last served at Aleppo and then Damascus (1172 AH) and wrote Anhar al-Jinan fi Yanabi' Ayat al-Qur'an; died 1174 AH (1761)."
  es: "Abd Allah Pasha ibn Ibrahim al-Husayni al-Jarmaki al-Shatji, gobernador otomano de Jarmak en el distrito de Diyarbakir, que ocupó el gran visirato, sirvió por última vez en Alepo y luego en Damasco (1172 AH) y escribió Anhar al-Jinan fi Yanabi' Ayat al-Qur'an; murió en 1174 AH (1761)."
  fr: "Abd Allah Pasha ibn Ibrahim al-Husayni al-Jarmaki al-Shatji, gouverneur ottoman de Jarmak dans le district de Diyarbakir, qui détenait le grand vizirat, a servi pour la dernière fois à Alep puis à Damas (1172 AH) et a écrit Anhar al-Jinan fi Yanabi' Ayat al-Qur'an; est mort en 1174 AH (1761)."
