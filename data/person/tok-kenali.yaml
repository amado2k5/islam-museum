summary:
  ar: "عالم من كلنتن (نحو 1868–1933)، اسمه محمد يوسف بن أحمد ويُعرف بتوك كنالي. درس في كوتا بهرو ثم في مكة اثنين وعشرين عامًا، وعاد سنة 1909 فأسس مدرسته القرآنية (بوندوق كنالي) سنة 1911 ودرّس في المسجد المحمدي، وكان أول رئيس تحرير لمجلة «بنغاسوه» وعضوًا في مجلس علماء كلنتن ومجلس الشؤون الإسلامية فيها، فصار أبرز ناشر لنظام البوندوق التعليمي في شبه جزيرة الملايو."
  en: "Kelantan scholar (c. 1868–1933), born Muhammad Yusuf bin Ahmad and known as Tok Kenali. He studied at Kota Bharu and then for twenty-two years in Mecca, returned in 1909, founded his pondok school in 1911 and taught at the Muhammadi Mosque, was the first editor of the magazine Pengasuh and a member of Kelantan's Council of Ulama and its Islamic Religious Council, becoming the leading spreader of the pondok system of Islamic education in the Malay Peninsula."
  ur: "کیلنتن کے عالم (تقریباً 1868ء–1933ء)، اصل نام محمد یوسف بن احمد، جو ٹوک کنالی کے نام سے مشہور ہیں۔ انہوں نے کوتا بھارو اور پھر بائیس برس مکہ میں تعلیم حاصل کی، 1909ء میں واپس آئے، 1911ء میں اپنا پونڈوق مدرسہ قائم کیا اور محمدی مسجد میں پڑھایا، رسالے «پنگاسوہ» کے پہلے مدیر اور کیلنتن کی مجلس علماء اور مجلس امور اسلامیہ کے رکن رہے، اور جزیرہ نما ملایہ میں پونڈوق نظام تعلیم کے سب سے بڑے ناشر بنے۔"
