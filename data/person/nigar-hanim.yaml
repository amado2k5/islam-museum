summary:
  ar: "شاعرة عثمانية، وُلدت في إسطنبول وتوفيت فيها سنة 1918، ابنة ماكار عثمان باشا النبيل المجري الأصل. تعلمت في مدرسة فرنسية بقاضي كوي وأتقنت ثماني لغات، وتزوجت في الرابعة عشرة ثم طلقت، وكان ديوانها «إفسوس» أول كتاب شعر غربي الأسلوب تنشره امرأة، فصارت رائدة الشعر النسائي الحديث في أدب التنظيمات وما بعده، وكانت صالونها ملتقى لأهل الأدب والمجتمع."
  en: "Ottoman poet, born at Istanbul and died there in 1918, daughter of Macar Osman Pasha, a nobleman of Hungarian origin. Educated at the French school in Kadıköy and mistress of eight languages, she was married at fourteen and later divorced; her collection Efsus was the first book of Western-style poetry published by a woman, making her a pioneer of modern women's poetry in post-Tanzimat literature, and her salon was a meeting place of literary society."
  ur: "عثمانی شاعرہ، استنبول میں پیدا ہوئیں اور 1918ء میں وہیں وفات پائی؛ ہنگری نژاد رئیس ماکار عثمان پاشا کی بیٹی تھیں۔ ان کا دیوان «افسوس» کسی خاتون کی مغربی اسلوب کی شاعری کی پہلی کتاب گنا جاتا ہے۔"
