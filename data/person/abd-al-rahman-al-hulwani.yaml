summary:
  ar: "عبد الرحمن بن محمد بن علي بن محمد الحلواني، أبو محمد ابن أبي الفتح، من أهل بغداد، مفسر وفقيه حنبلي عارف بالأدب، له «التبصرة» و«الهداية» في أصول الفقه وتفسير للقرآن في 41 جزءاً، ولد سنة 490 هـ وتوفي سنة 546 هـ ⁦(1151 م)⁩."
  en: "Abd al-Rahman ibn Muhammad ibn Ali ibn Muhammad al-Halwani (al-Hulwani), Abu Muhammad ibn Abi al-Fath, a man of Baghdad, exegete and Hanbali jurist versed in letters, author of al-Tabsira, al-Hidaya on legal theory and a Qur'anic commentary in 41 parts; born 490 AH, died 546 AH (1151 CE)."
  fr: "Abd al-Rahman ibn Muhammad ibn Ali ibn Muhammad al-Halwani (al-Hulwani), Abu Muhammad ibn Abi al-Fath, Bagdadien, exégète et juriste hanbalite versé dans les lettres, auteur d'al-Tabsira, d'al-Hidaya sur les fondements du droit et d'un commentaire du Coran en 41 parties ; né en 490 H, mort en 546 H (1151 ap. J.-C.)."
  es: "Abd al-Rahman ibn Muhammad ibn Ali ibn Muhammad al-Halwani (al-Hulwani), Abu Muhammad ibn Abi al-Fath, un hombre de Bagdad, exegeta y jurista hanbalí versado en letras, autor de al-Tabsira, al-Hidaya sobre teoría legal y un comentario coránico en 41 partes; nació en el año 490 de la Hégira y murió en el año 546 de la Hégira (1151 d. C.)."
  ur: "عبدالرحمٰن بن محمد بن علی بن محمد الحلوانی ⁦(الحلوانی)⁩، ابو محمد ابن ابی الفتح، بغداد کے ایک آدمی، مفسر اور حنبلی فقیہ، خطوط پر عبور رکھتے ہیں، التبسیرہ کے مصنف، قانونی نظریہ پر الہدایہ اور قرآنی تفسیر کے 4 حصوں میں؛ پیدائش 490ھ، وفات 546ھ ⁦(1151ء)⁩۔"
  tr: "Bağdatlı Abdülrahman ibn Muhammed ibn Ali ibn Muhammed el-Halvani, Ebu Muhammed ibn Abi el-Fath, Hanbeli fıkıhçısı ve fıkıh esasları üzerine yorumcu, ayrıca 41 bölümden oluşan Kur'an tefsiri yazarıdır. Hicri 490 yılında doğmuş ve Hicri 546 yılında (Miladi 1151) vefat etmiştir."
  id: "Abd al-Rahman ibn Muhammad ibn Ali ibn Muhammad al-Halwani, Abu Muhammad ibn Abi al-Fath, dari Baghdad, seorang ahli hukum Hanbali dan komentator prinsip-prinsip fiqih, serta penafsiran Al-Qur'an dalam 41 bagian. Beliau lahir pada tahun 490 H dan wafat pada tahun 546 H (1151 M)."
