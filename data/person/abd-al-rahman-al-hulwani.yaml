summary:
  ar: "عبد الرحمن بن محمد بن علي بن محمد الحلواني، أبو محمد ابن أبي الفتح، من أهل بغداد، مفسر وفقيه حنبلي عارف بالأدب، له «التبصرة» و«الهداية» في أصول الفقه وتفسير للقرآن في 41 جزءاً، ولد سنة 490 هـ وتوفي سنة 546 هـ ⁦(1151 م)⁩."
  en: "Abd al-Rahman ibn Muhammad ibn Ali ibn Muhammad al-Halwani (al-Hulwani), Abu Muhammad ibn Abi al-Fath, a man of Baghdad, exegete and Hanbali jurist versed in letters, author of al-Tabsira, al-Hidaya on legal theory and a Qur'anic commentary in 41 parts; born 490 AH, died 546 AH (1151 CE)."
