label: { ar: "الواقدي", en: "al-Waqidi" }
summary:
  ar: "محمد بن عمرو بن واقد مولى بني هاشم صاحب السير والمغازي، ضعف في الحديث، مات سنة تسع ومائتين وهو ابن سبع وسبعون سنة؛ ومن خبره أنه كتب إلى صديقه الهاشمي في ضيقة فبعث إليه بألف درهم فصرفها إلى صديقه الثاني الشاكي وتواسياها ثلاثة حتى نمي الخبر إلى المأمون فأجازهم بسبعة آلاف دينار {cite:muruj-al-dhahab p. 426-427}.، وذكره ابن خلدون مع المسعودي في فحول المؤرخين الذين استوعبوا أخبار الأيام وجمعوها وسطروها في صفحات الدفاتر وإن كان في كتبهما من الأوهام {cite:muqaddima-ibn-khaldun p. 15}، وعند العلماء كما قرأ ابن النديم أنه بالحجاز والسيرة وقد اشترك هو وأبو مخنف والمدائني في فتوح الشام {cite:fihrist-ibn-al-nadim p. 293}"
  en: "The maghazi author — weakened in hadith, dead in 209 aged seventy-seven; his tale of the thousand-dirham bag shared by three friends moved al-Ma'mun to a seven-thousand-dinar grant {cite:muruj-al-dhahab p. 426-427}."
