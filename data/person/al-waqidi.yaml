      en: "Ahmad: a liar who turns hadiths around; Ibn Ma'in: not trustworthy, his hadith is not written; al-Bukhari and Abu Hatim: abandoned; Abu Hatim, al-Nasa'i and Ibn Rahawayh: he forges hadith; Ibn al-Madini: he forges hadith; al-Daraqutni: there is weakness in him; Ibn Adi: his hadiths are not preserved and the fault is his; al-Dhahabi: consensus settled on his weakness."
