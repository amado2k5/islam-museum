education:
  did_you_know:
    ar: "الواقدي محمد بن عمرو صاحب السير والمغازي، ضُعّف في الحديث ومات سنة ٢٠٩هـ ابن سبع وسبعين سنة؛ ومن خبره أنه كتب إلى صديقه في ضيقة فأمدّه."
    en: "Al-Waqidi, Muhammad ibn Amr, author of the Sira and the Maghazi — weakened as a hadith man — died in 209 AH at seventy-seven; of his lore is the letter he wrote a friend in hardship, who sent him relief."
    ur: "واقدی محمد بن عمرو، سیر و مغازی کے مصنف — حدیث میں ضعیف ہوئے — 209ھ میں فوت ہوئے؛ منقول ہے انہوں نے دوست کو تنگی میں خط لکھا اور اس نے مدد کی۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/encyclopaedia-of-islam-2]
