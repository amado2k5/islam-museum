summary:
  ar: من السابقين إلى الإسلام، هاجر الهجرتين وصلى إلى القبلتين وشهد بدراً؛ أسلم بعد ثلاثة وأربعين إنساناً، وتبنى سالماً مولاه، واستشهد يوم اليمامة وهو ابن ست وخمسين سنة؛ اختُلف في اسمه (مهشم أو هشيم أو هاشم أو قيس).
  en: One of the earliest to embrace Islam, he made both emigrations, prayed towards both qiblas and fought at Badr; he became Muslim after forty-three others, adopted his freed slave Salim, and was killed at al-Yamama aged fifty-six; his name
    is disputed (Muhshim, Hushaym, Hashim or Qays).
