summary:
  ar: من السابقين إلى الإسلام، هاجر الهجرتين وصلى إلى القبلتين وشهد بدراً؛ أسلم بعد ثلاثة وأربعين إنساناً، وتبنى سالماً مولاه، واستشهد يوم اليمامة وهو ابن ست وخمسين سنة؛ اختُلف في اسمه ⁦(مهشم أو هشيم أو هاشم أو قيس)⁩.
  en: One of the earliest to embrace Islam, he made both emigrations, prayed towards both qiblas and fought at Badr; he became Muslim after forty-three others, adopted his freed slave Salim, and was killed at al-Yamama aged fifty-six; his name
    is disputed (Muhshim, Hushaym, Hashim or Qays).
  ur: "سب سے پہلے اسلام لانے والوں میں سے، دونوں ہجرتیں کیں، دونوں قبلوں کی طرف نماز پڑھی اور بدر میں لڑے؛ تینتالیسویں یا اس کے قریب مسلمان ہوئے۔"
  fr: "L'un des tout premiers à embrasser l'islam, il fit les deux émigrations, pria vers les deux qiblas et combattit à Badr ; il devint musulman après quarante-trois autres, adopta son affranchi Salim, et fut tué à al-Yamama à l'âge de cinquante-six ans ; son nom est discuté (Muhshim, Hushaym, Hashim ou Qays)."
  es: "Fue uno de los primeros en abrazar el Islam, realizó ambas emigraciones, rezó hacia ambas qiblas y luchó en Badr; se convirtió al Islam después de otros cuarenta y tres, adoptó a su esclavo liberado Salim y murió en al-Yamama a los cincuenta y seis años; su nombre es objeto de controversia (Muhshim, Hushaym, Hashim o Qays)."
  tr: "İslamiyet'i ilk kabul edenler arasındaydı, iki hicret yaptı, her iki kıbleye de namaz kıldı ve Bedir Savaşı'na şahit oldu. Kırk üç kişiden sonra İslamiyet'i kabul etti, azatlı kölesi Salim'i evlat edindi ve elli altı yaşında Yamama günü şehit edildi. Adı konusunda görüş ayrılığı vardır (Mahşam, Haşim, Haşim veya Kays)."
  id: "Beliau termasuk orang pertama yang memeluk Islam, melakukan dua kali hijrah, shalat menghadap kedua kiblat, dan menyaksikan Perang Badar. Beliau masuk Islam setelah empat puluh tiga orang, mengadopsi Salim, budak yang telah dibebaskannya, dan gugur sebagai syahid pada hari Yamama pada usia lima puluh enam tahun. Terdapat perbedaan pendapat mengenai namanya (Mahsham, Hashim, Hashim, atau Qais)."
