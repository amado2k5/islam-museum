id: person/nadr-ibn-shumayl
class: person
label: { ar: "النضر بن شميل" }
aliases: [person/al-nadr-ibn-shumayl]
summary:
  ar: "اللغوي المازني صاحب الصحاح في الحديث، صحح للمأمون لحن هشيم في قوله السداد بالسين فالسداد القصد في السبيل والسداد البلغة فقال المأمون قبح الله من لا أدب له وكتب له بخمسين ألف درهم فلما بلغ الفضل بن سهل أنه لحن أمير المؤمنين قال كلا ولكن هشيم لحانة فتبع أمير المؤمنين لفظه فأمر له بثلاثين ألفاً فخرج بثمانين ألفاً، ومات في أيام المأمون {cite:tarikh-khulafa-minhaj-1434 p. 499-501,519}. وعند ابن النديم هو النضر بن شميل بن خرشة المازني بصري الأصل نزل مرو الروذ وهي من بلاد بني مازن وأخذ عن الخليل بن أحمد وعن فصحاء الأعراب {cite:fihrist-ibn-al-nadim p. 144}."
  en: "The Mazini linguist; he corrected the caliph's slip sadad for sidad — 'al-Ma'mun: God disfigure the ill-mannered' — and was granted fifty thousand dirhams, then thirty more by al-Fadl ibn Sahl for tactfully blaming the transmitter Hashim: eighty thousand in all. He died in al-Ma'mun's days {cite:tarikh-khulafa-minhaj-1434 p. 499-501,519}."
  es: "El lingüista Mazini corrigió el lapsus del califa, sadad por sidad —'al-Ma'mun: Dios desfigure a los maleducados'— y recibió cincuenta mil dirhams, luego treinta más de al-Fadl ibn Sahl por culpar con tacto al transmisor Hashim: ochenta mil en total. Murió en tiempos de al-Ma'mun {cite:tarikh-khulafa-minhaj-1434 p. 499-501,519}."
  fr: "Le linguiste Mazini corrigea la faute du calife, qui avait écrit « sadad » au lieu de « sidad » (al-Ma'mun: « Que Dieu défigure les mal élevés »). Il reçut cinquante mille dirhams, puis trente autres d'al-Fadl ibn Sahl pour avoir subtilement blâmé le transmetteur Hashim: quatre-vingt mille dirhams au total. Il mourut du vivant d'al-Ma'mun (voir: Tarikh-Khulafa-Minhaj-1434, p. 499-501, 519)."
  ur: "مازینی ماہر لسانیات؛ اس نے سیداد کے لیے خلیفہ کی پرچی صداد کو درست کیا - 'المامون: خدا بدتمیزوں کو بگاڑ دے' - اور اسے پچاس ہزار درہم عطا کیے گئے، پھر الفضل ابن سہل کی طرف سے تیس مزید اس لیے کہ وہ ہاشم پر تدبیر سے الزام لگا رہے تھے: مجموعی طور پر اسی ہزار۔ ان کی وفات المامون کے دور میں ہوئی۔ 499-501,519}۔"
  tr: "Al-Sihath derlemelerinin yazarı dilbilimci Al-Mazini, Hişim'in 'Al-Siddad'ı 'S' ile dediği hatasını doğruladı; bu nedenle 'Al-Saddad' yolun niyetini ifade ederken, 'Al-Saddah' açık ifadedir. Al-Ma'mun, 'Tanrı terbiyesiz olanı utandırsın,' demiştir ve ona elli bin dirhem yazdı. El-Fadl bin Sahl, Müminlerin Komutanı'nın hatasını yaptığını duyunca, 'Hayır, ama Hişam bir tokattır.' dedi. İnananlar Komutanı onun sözünü dinledi ve onun için otuz bin dirhem emretti, böylece seksen bin ile ayrıldı. El-Me'mun döneminde öldü {cite:History-Khulafa-Minhaj-1434, s. 499-501,519}. İbn el-Nadim'e göre, o, Aslen Basra'lı Al-Nadr bin Shumayl bin Kharasha al-Mazini'dir. Banu Mazin'in bir parçası olan Marw al-Rudh'a yerleşti ve Al-Khalil bin Ahmed ile etkileyici bedevilerin yanında eğitim aldı {cite:fihrist-ibn-al-nadim s. 144}."
  id: "Ahli bahasa Al-Mazini, penulis kumpulan Al-Sihath, mengautentikasi kesalahan Al-Ma'mun oleh Hishim dengan mengatakan 'Al-Siddad' dengan 'S', sehingga 'Al-Saddad' berarti maksud dalam jalan dan 'Al-Saddah' adalah kata-kata yang jelas. Al-Ma'mun berkata, 'Semoga Allah mempermalukan orang yang tidak punya tata krama,' dan menulis lima puluh ribu dirham kepadanya. Ketika Al-Fadl bin Sahl mendengar bahwa ia telah melakukan kesalahan Panglima Orang Beriman, ia berkata, 'Tidak, tapi Hisham adalah tamparan.' Komandan Orang Beriman mengikuti kata-katanya dan memerintahkan tiga puluh ribu untuknya, sehingga ia pergi dengan delapan puluh ribu. Ia meninggal pada masa Al-Ma'mun {cite:Sejarah-Khulafa-Minhaj-1434, hlm. 499-501,519}. Menurut Ibn al-Nadim, ia adalah Al-Nadr bin Shumayl bin Kharasha al-Mazini, yang berasal dari Basra. Ia menetap di Marw al-Rudh, yang merupakan bagian dari Banu Mazin, dan belajar di bawah bimbingan Al-Khalil bin Ahmad serta para Badui yang fasih {cite:fihrist-ibn-al-nadim hlm. 144}."
