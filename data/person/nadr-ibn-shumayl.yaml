label: { ar: "النضر بن شميل" }
aliases: [person/al-nadr-ibn-shumayl]
summary:
  ar: "اللغوي المازني صاحب الصحاح في الحديث، صحح للمأمون لحن هشيم في قوله السداد بالسين فالسداد القصد في السبيل والسداد البلغة فقال المأمون قبح الله من لا أدب له وكتب له بخمسين ألف درهم فلما بلغ الفضل بن سهل أنه لحن أمير المؤمنين قال كلا ولكن هشيم لحانة فتبع أمير المؤمنين لفظه فأمر له بثلاثين ألفاً فخرج بثمانين ألفاً، ومات في أيام المأمون {cite:tarikh-khulafa-minhaj-1434 p. 499-501,519}. وعند ابن النديم هو النضر بن شميل بن خرشة المازني بصري الأصل نزل مرو الروذ وهي من بلاد بني مازن وأخذ عن الخليل بن أحمد وعن فصحاء الأعراب {cite:fihrist-ibn-al-nadim p. 144}."
  en: "The Mazini linguist; he corrected the caliph's slip sadad for sidad — 'al-Ma'mun: God disfigure the ill-mannered' — and was granted fifty thousand dirhams, then thirty more by al-Fadl ibn Sahl for tactfully blaming the transmitter Hashim: eighty thousand in all. He died in al-Ma'mun's days {cite:tarikh-khulafa-minhaj-1434 p. 499-501,519}."
