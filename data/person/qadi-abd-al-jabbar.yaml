summary:
  ar: "عبد الجبار بن أحمد الهمذاني الأسدابادي، قاضي القضاة، متكلم وأصولي على مذهب المعتزلة ⁦(وهو مذهب كلامي غير السني الذي يعتمده المتحف إطاراً أصلياً)⁩، ولي قضاء الري وتوفي فيها سنة 415 هـ ⁦(1025 م)⁩ عند الزركلي و414 أو 415 هـ عند الصفدي؛ صاحب «المغني في أبواب التوحيد والعدل» و«شرح الأصول الخمسة»."
  en: "Abd al-Jabbar ibn Ahmad al-Hamadhani al-Asadabadi, the Qadi al-Qudat, a Mu'tazili theologian and legal theorist (a school of kalam distinct from the Sunni creed that is the museum's default frame); judge of Rayy, where he died in 415 AH (1025 CE) per al-Zirikli, or 414 or 415 per al-Safadi; author of al-Mughni fi Abwab al-Tawhid wa-l-Adl and Sharh al-Usul al-Khamsa."
