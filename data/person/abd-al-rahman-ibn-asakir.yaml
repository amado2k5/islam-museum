id: person/abd-al-rahman-ibn-asakir
class: person
label: { ar: "عبد الرحمن بن هبة الله بن عساكر", en: "Abd al-Rahman ibn Hibat Allah ibn Asakir", fr: "Abd al-Rahman ibn Hibat Allah ibn Asakir", es: "Abd al-Rahman ibn Hibat Allah ibn Asakir", ur: "عبدالرحمٰن بن ہیبت اللہ ابن عساکر" }
summary:
  ar: "عبد الرحمن بن هبة الله بن عساكر الفقيه الشافعي الدمشقي من بيت ابن عساكر صاحب تاريخ دمشق؛ وصفه ابن الأثير أنه كان غزير العلم عالماً بالمذهب كثير الصلاح والزهد والخير؛ توفي بدمشق في رمضان سنة عشرين وستمائة {cite:kamil-ibn-al-athir p. 438}."
  en: "Shafi'i faqih of Damascus of Ibn Asakir's house — 'abundant in knowledge, learned in the madhhab, much given to piety, asceticism and good'; died at Damascus Ramadan 620 {cite:kamil-ibn-al-athir p. 438}."
  fr: "Juriste shafi'ite de Damas, de la maison d'Ibn Asakir — « abondant en savoir, versé dans l'école, très adonné à la piété, à l'ascèse et au bien » ; mort à Damas en ramadan 620 {cite:kamil-ibn-al-athir p. 438}."
  es: "Faqih shafi'i de Damasco de la casa de Ibn Asakir: 'abundante en conocimiento, versado en la madhhab, muy dado a la piedad, el ascetismo y el bien'; murió en Damasco en Ramadán de 620 {cite:kamil-ibn-al-athir p. 438}."
  ur: "ابن عساکر کے گھر کے دمشق کے شافعی فقیہ - 'علم میں کثرت، مذہب میں سیکھا، بہت زیادہ تقویٰ، سنت اور نیکی کو دیا گیا'؛ دمشق رمضان 620 میں وفات پائی۔ 438}۔"
  tr: "Şamlı Şafiî fıkıhçı Abdülrahman ibn Hibat Allah ibn Asakir, Şam Tarihi'nin yazarı İbn Asakir'in ailesindendir; İbn el-Athir onu çok bilgili, mezhebe hakim, çok dindar, zümreye bağlı ve iyi bir insan olarak tanımlamıştır; Hicri 620 yılının Ramazan ayında Şam'da vefat etmiştir. {kaynak: kamil-ibn-al-athir s. 438}"
  id: "Abd al-Rahman ibn Hibat Allah ibn Asakir, seorang ahli fiqih mazhab Syafi'i dari Damaskus, dari keluarga Ibn Asakir, penulis Sejarah Damaskus; Ibn al-Athir menggambarkannya sebagai orang yang sangat berilmu, mahir dalam mazhab pemikiran, dan sangat saleh, laku asketis, dan baik; beliau wafat di Damaskus pada bulan Ramadan tahun 620 H {cite:kamil-ibn-al-athir p. 438}."
