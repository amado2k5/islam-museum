summary:
  ar: "مفتي الشام ومفيده، صاحب ابن الصلاح شيخ الأصحاب ومفيد الطلاب؛ تفقه على ابن الصلاح حتى برع في المذهب وتقدم وساد واحتاج الناس إليه، وكان معيداً بالبادرائية عينه لها واقفها فباشرها إلى أن توفي يفيد ويعيد ويصنف ويعلق ويؤلف ويجمع وينشر المذهب ولم يزدد منصباً آخر، وقد اختصر «البحر» للروياني في مجلدات عدة؛ وانتفع به جماعة من الأصحاب منهم الشيخ محيي الدين النووي وأثنى عليه ثناءً حسناً؛ وقال الشريف عز الدين: وكان عليه مدار الفتوى بالشام في وقته {cite:shadharat-dhahab p. 577-578}."
  en: "Mufti of Syria — Ibn al-Salah's senior pupil ('shaykh of the ashab'), al-Nawawi among those who profited from him; perpetual mu'id of the Badra'iyya, abridger of al-Ruyani's al-Bahr; 'the fatwa of Syria turned on him' {cite:shadharat-dhahab p. 577-578}."
