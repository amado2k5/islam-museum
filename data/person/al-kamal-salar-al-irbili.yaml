summary:
  ar: "مفتي الشام ومفيده، صاحب ابن الصلاح شيخ الأصحاب ومفيد الطلاب؛ تفقه على ابن الصلاح حتى برع في المذهب وتقدم وساد واحتاج الناس إليه، وكان معيداً بالبادرائية عينه لها واقفها فباشرها إلى أن توفي يفيد ويعيد ويصنف ويعلق ويؤلف ويجمع وينشر المذهب ولم يزدد منصباً آخر، وقد اختصر «البحر» للروياني في مجلدات عدة؛ وانتفع به جماعة من الأصحاب منهم الشيخ محيي الدين النووي وأثنى عليه ثناءً حسناً؛ وقال الشريف عز الدين: وكان عليه مدار الفتوى بالشام في وقته {cite:shadharat-dhahab p. 577-578}."
  en: "Mufti of Syria — Ibn al-Salah's senior pupil ('shaykh of the ashab'), al-Nawawi among those who profited from him; perpetual mu'id of the Badra'iyya, abridger of al-Ruyani's al-Bahr; 'the fatwa of Syria turned on him' {cite:shadharat-dhahab p. 577-578}."
  es: "Muftí de Siria — Discípulo principal de Ibn al-Salah ('shaykh de los ashab'), al-Nawawi entre quienes se beneficiaron de él; mu'id perpetuo de la Badra'iyya, abreviador de al-Bahr de al-Ruyani; 'la fatwa de Siria se volvió contra él' {citar: shadharat-dhahab págs. 577-578}."
  fr: "Mufti de Syrie — le principal disciple d'Ibn al-Salah (« cheikh des ashab »), al-Nawawi parmi ceux qui ont profité de lui; mu'id perpétuel de la Badra'iyya, abrégé d'al-Bahr d'al-Ruyani; « la fatwa de Syrie s'est retournée contre lui » {cite: shadharat-dhahab p. 577-578}."
  ur: "شام کے مفتی - ابن الصلاح کے بزرگ شاگرد ⁦('شعب کے شیخ')⁩، النووی ان لوگوں میں سے جنہوں نے ان سے فائدہ اٹھایا؛ بدرئیہ کا دائمی معید، الروانی کی البحر کا خلاصہ؛ شام کا فتویٰ اس پر پھیر گیا 577-578}۔"
  tr: "Şam ve onun müfidiyyesi, İbn al-Salah'ın sahabesi, Sahabeler Şeyhi ve faydalı bir öğrenci; İbn al-Salah'ın yanında eğitim aldı, okulda başarılı oldu, ilerledi ve lider oldu, halk tarafından ihtiyaç duyuldu. Badriiyye'nin öğretmeniydi, ona adanmış ve ölümüne kadar medhabı öğreterek, tekrarlayarak, yazarlık, derleme ve yayarak başka bir konuma ulaşamadı. Al-Behr'i Al-Ruyani tarafından birkaç ciltte kısalttı; Şeyh Muhyiddin Al-Nawawi dahil bir grup sahabe ondan faydalandı ve onu çok övdü. Al-Şerif İzzeddin şöyle dedi: Kendi döneminde Levant'ta fetvaların başlıca otoritesiydi {atıf:shadharat-dhahab, s. 577-578}."
  id: "Mufti al-Sham dan Mufidiyya-nya, sahabat Ibn al-Salah, Sheikh para Sahabat dan murid yang bermanfaat; ia belajar di bawah Ibn al-Salah hingga berprestasi di sekolah dan naik daun serta menjadi pemimpin yang dibutuhkan oleh rakyat. Ia adalah guru Badri'iyyah, berdedikasi padanya, dan melanjutkannya hingga wafat, mengajar, mengulangi, menulis, menyusun, dan menyebarkan mazhab, tanpa mencapai posisi lain. Ia merangkum Al-Bahr oleh Al-Ruyani dalam beberapa jilid; sekelompok sahabat, termasuk Sheikh Muhyiddin Al-Nawawi, mendapat manfaat darinya dan sangat memujinya. Al-Sharif Izz al-Din berkata: Ia adalah otoritas utama fatwa di Levant pada zamannya {cite:shadharat-dhahab, hlm. 577-578}."
