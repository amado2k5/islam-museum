class: person
label: { ar: "عبد الأعلى بن عبد الله بن عامر", en: "Abd al-A'la ibn Abdallah ibn Amir", fr: "Abd al-A'la ibn Abdallah ibn Amir", es: "Abd al-A'la ibn Abdallah ibn Amir", ur: "عبد العلا بن عبداللہ ابن عامر" }
summary:
  ar: "عبد الأعلى بن عبد الله بن عامر؛ خاصم حرب بن سلم بن زياد في نهره فتوجه القضاء له فوهبه لحرب وقال والله لا رجعت فيما جعلت له أبداً."
  en: "Abd al-A'la ibn Abdallah ibn Amir; he won the canal suit against Harb ibn Salm, then gave it back — 'by God, never shall I take back what I made his'."
  fr: "Abd al-A'la ibn Abdallah ibn Amir ; il gagna le procès du canal contre Harb ibn Salm, puis le lui rendit — « par Dieu, jamais je ne reprendrai ce que je lui ai donné »."
  es: "Abd al-A'la ibn Abdallah ibn Amir; ganó el pleito del canal contra Harb ibn Salm, y luego lo devolvió: \"Por Dios, jamás recuperaré lo que le hice suyo\"."
  ur: "عبد العلا بن عبداللہ ابن عامر؛ اس نے حرب بن سلم کے خلاف نہری کا مقدمہ جیتا، پھر اسے واپس کر دیا - 'خدا کی قسم، میں نے جو کچھ اس کا بنایا ہے اسے کبھی واپس نہیں لوں گا'۔"
  tr: "Abdul-A'la bin Abdullah bin Amer ile Harb bin Salam bin Ziyad arasında nehir konusunda bir anlaşmazlık vardı. Bunun üzerine hakim onun lehine hüküm verdi ve nehri Harb'a verdi. Hakim, \"Allah'a yemin ederim ki, ona verdiğim sözü asla geri almayacağım\" dedi."
  id: "Abdul-A’la bin Abdullah bin Amer berselisih dengan Harb bin Salam bin Ziyad mengenai sungai miliknya, lalu hakim memutuskan untuk memihak kepadanya dan memberikan sungai itu kepada Harb, seraya berkata, “Demi Allah, aku tidak akan pernah mengingkari apa yang telah kuberikan kepadanya.”"
