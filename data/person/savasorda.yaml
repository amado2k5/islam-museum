summary:
  ar: "سافاسوردا هو إبراهيم بن حيا، عالم يهودي من الغرب الإسلامي بحسب مقالة المساحة في دائرة المعارف الإسلامية، وكتابه كتاب المساحات، المعروف في اللاتينية باسم ليبر إمبادوروم، هو الوحيد بين مصنفات المساحة الذي يورد براهين منطقية كثيرة، وقد اعتمد عليه ليوناردو البيزي في هندسته العملية. وتنسبه المقالات أيضاً إلى ترجمة أحكام المواليد لأبي علي الخياط وكتاب اختيارات العمراني إلى اللاتينية مع أفلاطون التيفولي، ولا تذكر ميلاده ولا وفاته {cite:encyclopaedia-of-islam-2 vol. 7 p. 160} {cite:encyclopaedia-of-islam-2 vol. 7 p. 161} {cite:encyclopaedia-of-islam-2 vol. 8 p. 118}."
  en: "Savasorda, that is Abraham bar Hiyya, was a Jewish scholar whom the Encyclopaedia of Islam's article on mensuration reckons among the western Arabs. His Liber embadorum is the only book of its kind that gives logically worked-out proofs in any number, and Leonardo of Pisa's Practica geometrica depended closely on it. The articles also name him with Plato of Tivoli as a Latin translator of Abu Ali al-Khayyat's book on nativities and of al-Imrani's book on choosing times. No birth or death is given {cite:encyclopaedia-of-islam-2 vol. 7 p. 160} {cite:encyclopaedia-of-islam-2 vol. 7 p. 161} {cite:encyclopaedia-of-islam-2 vol. 8 p. 118}."
  ur: "ساواسورڈا، یعنی ابراہام بن حیا، ایک یہودی عالم تھے جنہیں دائرۃ المعارف الاسلامیہ کا مقالہ پیمائش مغربی عربوں میں شمار کرتا ہے۔ ان کی Liber embadorum اپنی نوع کی واحد کتاب ہے جس میں بڑی تعداد میں منطقی طور پر مرتب دلائل دیے گئے ہیں، اور لیوناردو پیزائی کی عملی ہندسہ ان پر قریبی طور پر منحصر تھی۔ مقالات انہیں افلاطون تیولی کے ساتھ ابو علی خیاط کی کتابِ مواليد اور عمرانی کی انتخابِ اوقات پر کتاب کے لاطینی مترجم کے طور پر بھی نام لیتے ہیں۔ ولادت یا وفات کی کوئی تاریخ نہیں دی گئی {cite:encyclopaedia-of-islam-2 vol. 7 p. 160} {cite:encyclopaedia-of-islam-2 vol. 7 p. 161} {cite:encyclopaedia-of-islam-2 vol. 8 p. 118}."
