summary:
  ar: "راوية ونديم، سمر عند أبي العباس ذات ليلة فأمره أن يخبره بأظرف ما سمع واختار أعجبه خبر بني هاشم، فقص قصة التنوخي الذي نزل ببني عامر بن صعصعة وهجته جارية من الحي بهجاء كل قبيلة انتسب إليها حتى أقر بأنه تنوخي؛ روى عنه البهلول بن العباس عن الهيثم بن عدي {cite:muruj-al-dhahab p. 257-261}."
  en: "The traditionist-companion whose night-session tale of the tribe-hopping Tanukhi and the satirist slave-girl delighted al-Saffah; via al-Haytham ibn 'Adi {cite:muruj-al-dhahab p. 257-261}."
  es: "El compañero tradicionalista cuyo relato nocturno sobre el Tanukhi que cambiaba de tribu y la esclava satírica deleitó a al-Saffah; vía al-Haytham ibn 'Adi {cite:muruj-al-dhahab p. 257-261}."
  fr: "Le compagnon traditionaliste dont le récit nocturne du Tanukhi voyageant d'une tribu à l'autre et de l'esclave satiriste a ravi al-Saffah; via al-Haytham ibn 'Adi {cite:muruj-al-dhahab p. 257-261}."
  ur: "وہ روایت پسند ساتھی جس کی رات کے سیشن کی کہانی قبیلے سے تعلق رکھنے والی تنوخی اور طنزیہ لونڈی نے الصفح کو خوش کیا۔ الہیثم بن عدی کے ذریعے {حوالہ: مروج الذہب ص۔ 257-261}۔"
