summary:
  ar: "أبو الطيب الغساني الإيلي، نزل سر من رأى وحدّث بها عن يزيد وآدم بن أبي إياس، روى عنه ابن صاعد والكوكبي وهو ثقة صدوق؛ توفي في شعبان سنة ثلاث وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 134}."
  en: "Abu'l-Tayyib al-Ghassani of Iliya, resident of Samarra, transmitter from Adam ibn Abi Iyas — trustworthy and truthful; he died in Sha'ban 263 {cite:muntazam-ibn-al-jawzi p. 134}."
  es: "Abu'l-Tayyib al-Ghassani de Iliya, residente de Samarra, transmisor de Adam ibn Abi Iyas – digno de confianza y veraz; murió en Sha'ban 263 {cita:muntazam-ibn-al-jawzi p. 134}."
  fr: "Abu'l-Tayyib al-Ghassani d'Iliya, résident de Samarra, émetteur d'Adam ibn Abi Iyas — digne de confiance et véridique; il est mort en Sha'ban 263 {cite:muntazam-ibn-al-jawzi p. 134}."
  ur: "ابوالطیب الغسانی آف الیہ، سامرہ کا رہنے والا، آدم ابن ابی ایاس سے نقل کرنے والا - ثقہ اور سچا؛ آپ کی وفات شعبان 263 میں ہوئی۔ 134}۔"
  tr: "Ebu el-Teyyib el-Ghassani al-Ili, 'Man Ra'a'nın sırrını açıkladı ve Yezid ile Adem bin Abi Iyas'tan rivayet etti. İbn Sa'id ve el-Kawkabi ondan rivayet etti; o da güvenilir ve itibarlı biriydi; 263 Hicri yılında Şaban'da öldü {atıf:muntazam-ibn-al-jawzi s. 134}."
  id: "Abu al-Tayyib al-Ghassani al-Ili mengungkapkan rahasia 'Man Ra'a' dan menceritakan dari Yazid dan Adam ibn Abi Iyas. Ibn Sa'id dan al-Kawkabi menceritakan darinya, yang dapat dipercaya dan dapat dipercaya; ia meninggal di Sha'ban pada tahun 263 H {cite:muntazam-ibn-al-jawzi hlm. 134}."
