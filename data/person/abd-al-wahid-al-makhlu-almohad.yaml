died: { edtf: "1224~", hijri: "0621~", calendar: julian, precision: year, status: tradition, derived: true, note: "خلعوه وخنقوه بعد تسعة أشهر من ولايته {cite:wafayat-ayan}." }
summary:
  ar: "عبد الواحد بن يوسف بن عبد المؤمن الموحدي، عم الخليفة الناصر المعروف بالمخلوع؛ بايعته الدولة بعد المستنصر لكبر سنه ووفور عقله، فلم يحسن التدبير ولا أدارى أهل دولته، فخلعوه وخنقوه بعد تسعة أشهر من ولايته {cite:wafayat-ayan}."
  en: "Abd al-Wahid ibn Yusuf ibn Abd al-Mu'min, an uncle of the caliph al-Nasir, known as al-Makhlu (the Deposed). After al-Mustansir the state gave him the oath of allegiance, for his advanced age and sound judgement; but he did not manage affairs well and did not placate the people of his state, so they deposed him and strangled him after a nine-month reign {cite:wafayat-ayan}."
  fr: "Abd al-Wahid ibn Yusuf ibn Abd al-Mu'min, oncle du calife al-Nasir, connu sous le nom d'al-Makhlu (le Déposé). Après al-Mustansir, l'État lui prêta serment d'allégeance, pour son âge avancé et la sûreté de son jugement ; mais il ne gouverna pas bien et ne ménagea pas les gens de son État, qui le déposèrent et l'étranglèrent après un règne de neuf mois {cite:wafayat-ayan}."
  es: "Abd al-Wahid ibn Yusuf ibn Abd al-Mu'min, tío del califa al-Nasir, conocido como al-Makhlu (el Depuesto). Tras al-Mustansir, el estado le juró lealtad por su avanzada edad y buen juicio; pero no administró bien los asuntos ni logró apaciguar al pueblo, por lo que lo depusieron y lo estrangularon tras un reinado de nueve meses {cite:wafayat-ayan}."
  ur: "عبد الواحد ابن یوسف ابن عبد المومن، خلیفہ الناصر کے چچا، المخلو ⁦(معزول)⁩ کے نام سے مشہور ہیں۔ المستنصر کے بعد ریاست نے ان کی عمر بڑھنے اور درست فیصلے کی وجہ سے انہیں وفاداری کا حلف دیا۔ لیکن اس نے معاملات کو اچھی طرح سے نہیں چلایا اور اپنی ریاست کے لوگوں کو راضی نہیں کیا، چنانچہ انہوں نے اسے معزول کر دیا اور نو ماہ کی حکومت کے بعد اس کا گلا گھونٹ دیا۔"
  tr: "Halife el-Nasır'ın amcası olan Abdül-Vahid ibn Yusuf ibn Abdül-Mümin el-Muvahhid, tahttan indirilen olarak bilinir; devlet, yaşlılığı ve engin bilgeliği nedeniyle el-Mustansir'den sonra ona biat etmişti, ancak devleti iyi yönetemedi ve halkıyla iyi geçinemedi, bu yüzden dokuz aylık yönetiminin ardından tahttan indirildi ve boğularak öldürüldü. {Kaynak: Wafayat-ayan}"
  id: "Abd al-Wahid ibn Yusuf ibn Abd al-Mu’min al-Muwahhid, paman Khalifah al-Nasir, dikenal sebagai orang yang digulingkan; negara berjanji setia kepadanya setelah al-Mustansir karena usianya yang sudah lanjut dan kebijaksanaannya yang melimpah, tetapi ia tidak mengelola negaranya dengan baik dan tidak berurusan dengan rakyatnya, sehingga mereka menggulingkannya dan mencekiknya setelah sembilan bulan memerintah {cite:wafayat-ayan}."
