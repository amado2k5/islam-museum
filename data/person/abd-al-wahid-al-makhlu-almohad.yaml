summary:
  ar: "عبد الواحد بن يوسف بن عبد المؤمن الموحدي، عم الخليفة الناصر المعروف بالمخلوع؛ بايعته الدولة بعد المستنصر لكبر سنه ووفور عقله، فلم يحسن التدبير ولا أدارى أهل دولته، فخلعوه وخنقوه بعد تسعة أشهر من ولايته {cite:wafayat-ayan}."
  en: "Abd al-Wahid ibn Yusuf ibn Abd al-Mu'min, an uncle of the caliph al-Nasir, known as al-Makhlu (the Deposed). After al-Mustansir the state gave him the oath of allegiance, for his advanced age and sound judgement; but he did not manage affairs well and did not placate the people of his state, so they deposed him and strangled him after a nine-month reign {cite:wafayat-ayan}."
