summary:
  ar: "شاعر من بني الحارث بن كعب، تنقل حاشية طبعة ديوان الحماسة أنه شاعر مقلّ غزل فارس مذكور في قومه ومن مخضرمي الدولتين الأموية والعباسية، وأنه قُتل في قصاص اختُلف في سببه {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
  en: "A poet of Banu al-Harith ibn Ka'b; the footnote in the Hamasa edition describes him as a poet of little verse, a love-poet and horseman renowned among his people, one who lived under both the Umayyad and Abbasid states and was killed in a retaliation whose cause is disputed {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
  es: "Un poeta de Banu al-Harith ibn Ka'b; la nota a pie de página en la edición de Hamasa lo describe como un poeta de pocos versos, un poeta amoroso y jinete renombrado entre su pueblo, que vivió bajo los estados omeya y abasí y fue asesinado en una represalia cuya causa es disputada {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
  fr: "Un poète de Banu al-Harith ibn Ka'b; la note de bas de page de l'édition Hamasa le décrit comme un poète de peu de vers, un poète d'amour et un cavalier renommé parmi son peuple, qui a vécu sous les États omeyyade et abbasside et a été tué dans une représailles dont la cause est contestée {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
  ur: "بنو حارث بن کعب کا ایک شعر؛ حماسہ ایڈیشن کے فوٹ نوٹ میں اسے چھوٹی آیت کے شاعر، ایک محبت کرنے والا شاعر اور اپنے لوگوں میں مشہور گھڑ سوار کے طور پر بیان کیا گیا ہے، جو اموی اور عباسی دونوں ریاستوں کے تحت رہتا تھا اور ایک انتقامی کارروائی میں مارا گیا تھا جس کی وجہ متنازعہ ہے {{حوالہ: حماسہ-ابو تمم-ایڈ-1916 صفحہ 11}}۔"
