  ar: "شاعر من بني الحارث بن كعب، تنقل حاشية طبعة ديوان الحماسة أنه شاعر مقلّ غزل فارس مذكور في قومه ومن مخضرمي الدولتين الأموية والعباسية، وأنه قُتل في قصاص اختُلف في سببه {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
