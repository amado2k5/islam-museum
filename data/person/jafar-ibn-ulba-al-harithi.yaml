  ar: "شاعر من بني الحارث بن كعب، تنقل حاشية طبعة ديوان الحماسة أنه شاعر مقلّ غزل فارس مذكور في قومه ومن مخضرمي الدولتين الأموية والعباسية، وأنه قُتل في قصاص اختُلف في سببه {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
  en: "A poet of Banu al-Harith ibn Ka'b; the footnote in the Hamasa edition describes him as a poet of little verse, a love-poet and horseman renowned among his people, one who lived under both the Umayyad and Abbasid states and was killed in a retaliation whose cause is disputed {{cite:hamasa-abu-tammam-ed-1916 p.11}}."
