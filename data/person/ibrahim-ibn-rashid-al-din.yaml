summary:
  ar: "إبراهيم بن رشيد الدين، لم يتجاوز السادسة عشرة من عمره حين أُعدم مع أبيه سنة 718هـ، ويصفه الخشاب بأنه كان يجمع بين جمال الخلقة وطهارة النفس ونبل الأخلاق {cite:jami-al-tawarikh-khashshab-1960 p. 80}. وقد أُعدم قبل أبيه {cite:jami-al-tawarikh-khashshab-1960 p. 80}. ويذكر الخشاب أن الاتهام الذي أُعدّ ضد أبيه زعم أنه قدّم للسلطان ألجايتو شراباً بالاتفاق مع أبيه {cite:jami-al-tawarikh-khashshab-1960 p. 79}، ويعرض هذا الزعم رواية عن ميرخوند وخوندمير {cite:jami-al-tawarikh-khashshab-1960 p. 79}."
  en: "Ibrahim, a son of Rashid al-Din, was under sixteen when he was executed with his father in 718 AH; the introduction describes him as handsome and pure of mind {cite:jami-al-tawarikh-khashshab-1960 p. 80}. He was executed before his father {cite:jami-al-tawarikh-khashshab-1960 p. 80}. The accusers said he had served Oljeitu a drink with his father's agreement {cite:jami-al-tawarikh-khashshab-1960 p. 79}; the introduction gives this charge as the account of Mirkhwand and Khwandamir {cite:jami-al-tawarikh-khashshab-1960 p. 79}."
  ur: "ابراہیم، رشید الدین کے بیٹے، 718ھ میں اپنے والد کے ساتھ قتل کیے گئے، جب ان کی عمر سولہ سال سے کم تھی۔ انہیں والد سے پہلے قتل کیا گیا {cite:jami-al-tawarikh-khashshab-1960 p. 80}۔ ان پر لگائے گئے الزام کا ذکر خشاب کے مطابق میرخوند اور خواندمیر کی روایت کے طور پر ہے {cite:jami-al-tawarikh-khashshab-1960 p. 79}۔"
  fr: "Ibrahim, fils de Rashid al-Din, n'avait pas seize ans lorsqu'il fut exécuté avec son père en 718 AH ; l'introduction le décrit comme beau et pur d'esprit {cite:jami-al-tawarikh-khashshab-1960 p. 80}. Il fut exécuté avant son père {cite:jami-al-tawarikh-khashshab-1960 p. 80}. Les accusateurs affirmaient qu'il avait fait boire à Oljeitu une boisson avec l'accord de son père ; l'introduction rapporte cette accusation comme le récit de Mirkhwand et Khwandamir {cite:jami-al-tawarikh-khashshab-1960 p. 79}."
  es: "Ibrahim, hijo de Rashid al-Din, no había cumplido dieciséis años cuando fue ejecutado con su padre en 718 AH; la introducción lo describe como apuesto y de espíritu puro {cite:jami-al-tawarikh-khashshab-1960 p. 80}. Fue ejecutado antes que su padre {cite:jami-al-tawarikh-khashshab-1960 p. 80}. Los acusadores afirmaban que había dado a Oljeitu una bebida con el acuerdo de su padre; la introducción recoge esta acusación como el relato de Mirkhwand y Khwandamir {cite:jami-al-tawarikh-khashshab-1960 p. 79}."
