summary:
  ar: "ابن منير الطرابلسي الشاعر؛ نشأ بأسواق طرابلس ونبغ في الآداب وقدم دمشق فسكنها وكان شيعياً كثير الهجاء خبيث اللسان فسجنه بوري بن أتابك طغتكين صاحب دمشق مدة وعزم على قطع لسانه ثم شُفع فيه فنفاه، وكان بينه وبين ابن القيسراني مكاتبات وأجوبة ومهاجاة وكانا مقيمين بحلب متنافسين في صناعتهما؛ ولد سنة ثلاث وسبعين وأربعمائة بطرابلس وتوفي في جمادى الآخرة سنة ثمان وأربعين وخمسمائة بحلب ودفن بجبل جوشن {cite:shadharat-dhahab p. 626-628}."
  en: "Ibn Munir of Tripoli, the poet; raised in Tripoli's markets, he came to Damascus and settled — a Shi'i of sharp invective and malicious tongue whom Buri ibn Tughtigin jailed and meant to silence for good until intercession exiled him instead; he and Ibn al-Qaysarani, both settled at Aleppo, traded lampoons; b. Tripoli 473, d. Jumada II 548 at Aleppo, buried at Jabal Jawshan {cite:shadharat-dhahab p. 626-628}."
  es: "Ibn Munir de Trípoli, el poeta; criado en los mercados de Trípoli, llegó a Damasco y se estableció allí; un chiíta de aguda invectiva y lengua maliciosa a quien Buri ibn Tughtigin encarceló y pretendía silenciar para siempre hasta que la intercesión lo exilió; él e Ibn al-Qaysarani, ambos establecidos en Alepo, comerciaban con sátiras; n. Trípoli 473, m. Jumada II 548 en Alepo, enterrado en Jabal Jawshan {cite:shadharat-dhahab p. 626-628}."
  fr: "Ibn Munir de Tripoli, le poète; élevé sur les marchés de Tripoli, il vint à Damas et s'y installa — un chiite à l'invective acerbe et à la langue malveillante que Buri ibn Tughtigin emprisonna et voulut réduire au silence pour de bon jusqu'à ce qu'une intervention le fasse exiler; lui et Ibn al-Qaysarani, tous deux installés à Alep, échangeaient des satires; né à Tripoli en 473, mort en Jumada II 548 à Alep, enterré à Jabal Jawshan {cite: shadharat-dhahab p. 626-628}."
  ur: "طرابلس کے ابن منیر، شاعر؛ طرابلس کے بازاروں میں پرورش پانے کے بعد، وہ دمشق آیا اور آباد ہوا - ایک تیز متعصب اور بد زبانی والا شیعہ جسے بری ابن تغتگین نے جیل میں ڈال دیا اور اس کا مطلب یہ تھا کہ وہ اس وقت تک خاموش رہے جب تک کہ شفاعت کی بجائے اسے جلاوطن نہ کر دیا جائے۔ وہ اور ابن القیسرانی، دونوں حلب میں آباد تھے، چراغوں کا کاروبار کرتے تھے۔ ب طرابلس 473، د. جمعہ دوم 548 حلب میں، جبل جوشان میں مدفون 626-628}۔"
