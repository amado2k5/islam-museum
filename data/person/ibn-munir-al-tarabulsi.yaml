summary:
  ar: "ابن منير الطرابلسي الشاعر؛ نشأ بأسواق طرابلس ونبغ في الآداب وقدم دمشق فسكنها وكان شيعياً كثير الهجاء خبيث اللسان فسجنه بوري بن أتابك طغتكين صاحب دمشق مدة وعزم على قطع لسانه ثم شُفع فيه فنفاه، وكان بينه وبين ابن القيسراني مكاتبات وأجوبة ومهاجاة وكانا مقيمين بحلب متنافسين في صناعتهما؛ ولد سنة ثلاث وسبعين وأربعمائة بطرابلس وتوفي في جمادى الآخرة سنة ثمان وأربعين وخمسمائة بحلب ودفن بجبل جوشن {cite:shadharat-dhahab p. 626-628}."
  en: "Ibn Munir of Tripoli, the poet; raised in Tripoli's markets, he came to Damascus and settled — a Shi'i of sharp invective and malicious tongue whom Buri ibn Tughtigin jailed and meant to silence for good until intercession exiled him instead; he and Ibn al-Qaysarani, both settled at Aleppo, traded lampoons; b. Tripoli 473, d. Jumada II 548 at Aleppo, buried at Jabal Jawshan {cite:shadharat-dhahab p. 626-628}."
