summary:
  ar: "الفيلسوف الصوفي الشهير من بلاد الأندلس؛ قال لسان الدين: أما شهرته ومحله من الإدراك والآراء والوقوف على الأقوال والتعمق في الفلسفة والقيام على مذاهب المتكلمين فما يقضى منه العجب، وبعث أخاه أبا طالب بن سبعين وكيلاً عن ابن هود في مخاطبة قس رومية لما نكث به طاغية النصارى فلم يف بشرطه، وأنشأ للسلطان المستنصر الحفصي رسالة بيعة أهل مكة التي بايعوه بها وخطبوا له بعرفة ويشير فيها إلى أن المستنصر هو المهدي المبشر به الذي يحثو المال ولا يعده، ومن كلامه فيما حكاه لسان الدين عند ذكر أبي مدين: شعيب عبد عمل ونحن عبيد حضرة {cite:nafh-tib-maqqari p. 203-204}."
  en: "The celebrated Andalusi philosopher-sufi; his brother Abu Talib spoke for Ibn Hud before the pope at Rome, and Ibn Sab'in drafted Mecca's bay'a letter to the Hafsid al-Mustansir casting him as the awaited Mahdi {cite:nafh-tib-maqqari p. 203-204}."
