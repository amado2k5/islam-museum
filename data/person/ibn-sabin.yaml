summary:
  ar: "الفيلسوف الصوفي الشهير من بلاد الأندلس؛ قال لسان الدين: أما شهرته ومحله من الإدراك والآراء والوقوف على الأقوال والتعمق في الفلسفة والقيام على مذاهب المتكلمين فما يقضى منه العجب، وبعث أخاه أبا طالب بن سبعين وكيلاً عن ابن هود في مخاطبة قس رومية لما نكث به طاغية النصارى فلم يف بشرطه، وأنشأ للسلطان المستنصر الحفصي رسالة بيعة أهل مكة التي بايعوه بها وخطبوا له بعرفة ويشير فيها إلى أن المستنصر هو المهدي المبشر به الذي يحثو المال ولا يعده، ومن كلامه فيما حكاه لسان الدين عند ذكر أبي مدين: شعيب عبد عمل ونحن عبيد حضرة {cite:nafh-tib-maqqari p. 203-204}."
  en: "The celebrated Andalusi philosopher-sufi; his brother Abu Talib spoke for Ibn Hud before the pope at Rome, and Ibn Sab'in drafted Mecca's bay'a letter to the Hafsid al-Mustansir casting him as the awaited Mahdi {cite:nafh-tib-maqqari p. 203-204}."
  es: "El célebre filósofo-sufí andalusí; su hermano Abu Talib habló en favor de Ibn Hud ante el papa en Roma, e Ibn Sab'in redactó la carta de bay'a de La Meca al Hafsid al-Mustansir presentándolo como el Mahdi esperado {cite:nafh-tib-maqqari p. 203-204}."
  fr: "Le célèbre philosophe-soufi andalou; son frère Abu Talib a parlé pour Ibn Hud devant le pape à Rome, et Ibn Sab'in a rédigé la lettre bay'a de La Mecque au Hafsid al-Mustansir le présentant comme le Mahdi attendu {cite:nafh-tib-maqqari p. 203-204}."
  ur: "مشہور اندلس فلسفی صوفی؛ ان کے بھائی ابو طالب نے روم میں پوپ کے سامنے ابن ہود کے لیے بات کی، اور ابن سبین نے مکہ کی بیعت کا خط حفصۃ المستنصر کے نام تیار کیا جس میں انھیں منتظر مہدی کے طور پر پیش کیا۔ 203-204}۔"
  tr: "Endülüs'ten ünlü Sufi filozofu Lisan al-Din şöyle demiştir: Anlayış, görüşler, sözlere dikkat, felsefeye derinlemesine dalış ve teologların öğretilerine bağlılığı açısından şöhreti ve statüsü gerçekten şaşırtıcıdır. Kardeşi Ebu Talib bin Sab'in, İbn Hud adına bir Roma rahibine Hristiyan zorbanın isyanı hakkında konuşmak üzere ajan olarak gönderilmiştir; rahip, şartını yerine getirmemiştir. Ayrıca Sultan el-Mustansir el-Hafsi için, Mekke halkına bağlılık yemini ettikleri ve Arafat'ta ona bir vaaz verdikleri bir mektup yazdı; bu mektup, el-Mustansir'in servet arayan ama onu saymayan vaat edilen Mehdi olduğunu gösterir. Lisan al-Din'in Ebu Madyan'dan bahsederken aktardığı gibi: Şuayb bir eylem kölesidir ve biz de varlığa kölesiyiz {atıft: nafh-tib-maqqari, s. 203-204}."
  id: "Filsuf Sufi terkenal dari Andalusia; Lisan al-Din berkata: Mengenai ketenaran dan statusnya dalam pemahaman, pendapat, perhatian terhadap pernyataan, pendalaman filsafat, dan kepatuhan pada doktrin para teolog, sungguh menakjubkan. Saudaranya Abu Talib ibn Sab'in dikirim sebagai agen atas nama Ibn Hud untuk berbicara kepada seorang imam Romawi mengenai pemberontakan tiran Kristen, yang tidak memenuhi syaratnya. Ia juga menulis surat kesetiaan kepada rakyat Mekah untuk Sultan al-Mustansir al-Hafsi, kepada siapa mereka bersumpah setia dan memberinya khotbah di Arafat, yang menunjukkan bahwa al-Mustansir adalah Mahdi yang dijanjikan yang mencari kekayaan tetapi tidak menghitungnya. Di antara kata-katanya seperti yang dilaporkan oleh Lisan al-Din saat menyebut Abu Madyan: Shu'ayb adalah budak perbuatan, dan kita adalah budak kehadirannya {cite:nafh-tib-maqqari, hlm. 203-204}."
