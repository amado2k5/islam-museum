summary:
  ar: "أبو الحسن علي بن موسى بن محمد بن خلف الأنصاري، نزيل فاس وخطيبها، مصنف شذور الذهب في صنعة الكيمياء الذي لم ينظم أحد في الكيمياء مثل نظمه حتى قيل إنه إن لم يعلمك صنعة الذهب علمك صنعة الأدب، وإن فاتك ذهبه لم يفتك أدبه، ويعرف بابن أرفع رأس ويقال هو شاعر الحسن حكيم الشعر؛ توفي سنة أربع وتسعين وخمسمائة {cite:shadharat-dhahab p. 797}."
  en: "Abu al-Hasan Ali b. Musa b. Khalaf al-Ansari, resident of Fez and its khatib, author of Shudhur al-Dhahab on the art of alchemy — none versified alchemy as he did, so it was said: 'if he does not teach you gold-making he will teach you adab; if his gold escapes you his adab will not'; known as Ibn Arfa' Ra's, 'poet of beauty, sage of verse'; he died in 594 {cite:shadharat-dhahab p. 797}."
