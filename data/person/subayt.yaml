label: { ar: "سبيط الدهقان", en: "Subayt the Dahqan", es: "Subayt the Dahqan", fr: "Subayt the Dahqan", ur: "سبیت دہقان" }
summary:
  ar: "سبيط رجل من دهاقين البصرة؛ كانت له أجمة في الأرض التي استخرجها المنصور للسبيطية فحبس عنه الوكيل بعض ثمنها وضربه فلم يزل على باب المنصور يطالب بما بقي له من ثم أجمته حتى مات فسميت الضيعة السبيطية."
  en: "Subayt, a Basra dahqan; his reedbed fell in the tract al-Mansur took for al-Subaytiyya — short-paid and beaten by the agent, he kept to the caliph's gate demanding the balance till death, and the estate bears his name."
  es: "Subayt, un dahqan de Basora; su cañaveral quedó en el territorio que al-Mansur tomó para al-Subaytiyya; maltratado y golpeado por el agente, permaneció en la puerta del califa exigiendo el saldo hasta su muerte, y la propiedad lleva su nombre."
  fr: "Subayt, un dahqan de Bassora; sa roselière tomba sur le territoire qu'al-Mansur prit pour al-Subaytiyya — sous-payé et battu par l'agent, il resta jusqu'à la porte du calife à réclamer le solde jusqu'à sa mort, et le domaine porte son nom."
  ur: "سبیت، بصرہ دہقان؛ اس کا سرکنڈہ اس راستے میں گر گیا جو المنصور نے السبیطیہ کے لیے لیا تھا - کم معاوضہ اور ایجنٹ کے ذریعہ مارا پیٹا گیا، وہ خلیفہ کے دروازے پر مرتے دم تک بیلنس کا مطالبہ کرتا رہا، اور جائیداد اس کے نام ہے۔"
  tr: "Sbeit, Basra çiftçilerinden biriydi; el-Mansur'un el-Sbeitiyah için çıkardığı araziye bir sopa vardı, ancak ajan fiyatının bir kısmını sakladı ve onu dövdü. Al-Mansur'un kapısında kalanları talep etti, sonra ölene kadar ona yerleşti ve çiftliğe Al-Sbeitiya adı verildi."
  id: "Sbeit adalah seorang petani Basra; ia memiliki tongkat di tanah yang diekstrak al-Mansur untuk al-Sbeitiyah, tetapi agen itu menahan sebagian harga dan memukulinya. Ia tetap berada di gerbang Al-Mansur menuntut sisa darinya, lalu menetapkannya hingga ia meninggal, dan pertanian itu dinamai Al-Sbeitiya."
