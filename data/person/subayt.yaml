  ar: "سبيط رجل من دهاقين البصرة؛ كانت له أجمة في الأرض التي استخرجها المنصور للسبيطية فحبس عنه الوكيل بعض ثمنها وضربه فلم يزل على باب المنصور يطالب بما بقي له من ثم أجمته حتى مات فسميت الضيعة السبيطية."
  en: "Subayt, a Basra dahqan; his reedbed fell in the tract al-Mansur took for al-Subaytiyya — short-paid and beaten by the agent, he kept to the caliph's gate demanding the balance till death, and the estate bears his name."
