id: person/said-ibn-al-musayyab
class: person
label: { ar: "سعيد بن المسيب", en: "Sa'id ibn al-Musayyab", es: "Sa'id ibn al-Musayyab", fr: "Sa'id ibn al-Musayyab", ur: "سعید بن المسیب" }
summary:
  ar: "سعيد بن المسيب؛ من كبار التابعين بمكة والمدينة، سئل من أول من ضرب الدنانير المنقوشة فقال عبد الملك بن مروان وبعث بتبر إلى دمشق فضرب له على وزن المثقال في الجاهلية. وبلغه قول معاوية عند احتضاره اللهم أقل العثرة واعف عن الزلة وجد بحلمك على جهل من لم يرج غيرك فقال لقد رغب إلى من لا مرغوب إليه مثله وإني لأرجو ألا يعذبه الله {cite:muruj-al-dhahab p. 49} امتنع عن البيعة للوليد وسليمان، فضربه هشام بن إسماعيل والي المدينة وطاف به وسجنه، ثم أنكر عبد الملك الضرب بكتاب إلى الوالي. {cite:salabi-umayyad-state-2020 p.34-35} ويذكر الكتاب أن امتناعه عن البيعة لوليّي العهد الوليد وسليمان في وقت واحد كان لأنه يرى أن البيعة لاثنين في آن واحد لا تجوز، فأمر عبد الملك بجلده ثلاثين سوطاً وأن يُوقف للناس، وأن قبيصة بن ذؤيب أسهم في إخلاء سبيله. {cite:salabi-umayyad-state-2020 p.119-120}"
  en: "Sa'id ibn al-Musayyab; among the greatest Meccan-Medinan Followers — 'Abd al-Malik first struck engraved dinars' — and sent bullion to Damascus, struck for him on the Jahiliya mithqal."
  es: "Sa'id ibn al-Musayyab, uno de los más grandes seguidores de La Meca y Medina —Abd al-Malik fue el primero en acuñar dinares grabados—, envió lingotes a Damasco, acuñados para él en el mithqal de la época preislámica."
  fr: "Sa'id ibn al-Musayyab; parmi les plus grands disciples mecquois et médinois — 'Abd al-Malik a frappé le premier dinars gravés' — et a envoyé des lingots à Damas, frappés pour lui sur le mithqal de la Jahiliya."
  ur: "سعید بن المسیب؛ سب سے بڑے مکی-مدینی پیروکاروں میں سے - 'عبدالمالک نے سب سے پہلے کندہ شدہ دینار مارے' - اور دمشق کو بلین بھیجا، جاہلیہ مثقال پر اس کے لیے مارا گیا۔"
  tr: "Mekke ve Medine'nin önde gelen takipçilerinden Said ibn al-Musayyib'e, kazınmış dinarları ilk kimin vurduğu soruldu. Abd al-Malik ibn Marwan, 'Şam'a bir tabar gönderdi ve bu, İslam öncesi dönemdeki mitkal düzenine göre vuruldu.' dedi. Muaviyah'ın ölerken sözlerini duydu: Ey Allah, tökezlemeyi azalt ve gafı affet, sabrında kimsenin umut edecek kimsesi olmayanların cehaletini bul. O dedi ki, 'O, istenmeyen birini arzuladı ve umarım Allah onu cezalandırmaz.' {alıntı:Muric-al-Dhahab s. 49} El-Velid ve Süleyman'a bağlılık yemini etmeyi reddetti, bu yüzden Medine valisi Hişam bin İsmail onu dövdü, çevreledi ve hapse attı. Bunun üzerine Abdül-Malik, valiye yazdığı bir mektupta dayağı reddetti. {cite:salabi-umayyad-state-2020 s.34-35} Kitapta, aynı anda veliaht prensler El-Velid ve Süleyman'a bağlılık yemini etmeyi reddetmesinin, aynı anda iki kişiye bağlılığın kabul edilemez olduğuna inanmasından kaynaklandığını belirtir. Abdülmelik, ona otuz kırbaç cezası verilmesini ve halk için tutulmasını emretti, ayrıca Kubeyse bin Dhu'ayb'in serbest bırakılmasına katkıda bulundu. {cite:Selabi-Umayyad-devlet-2020 s.119-120}"
  id: "Sa'id ibn al-Musayyib, salah satu pengikut terkemuka di Mekah dan Madinah, ditanya siapa yang pertama kali memukul dinar yang diukir. Abd al-Malik ibn Marwan berkata, 'Dia mengirim tabar ke Damaskus, dan ditarik sesuai pola mithqal pada era pra-Islam.' Dia mendengar kata-kata Muawiyah saat sekarat: Ya Allah, kurangi kesalahan dan ampunilah kesalahan, dan temukan dalam kesabaran-Mu ketidaktahuan mereka yang tidak punya harapan lain. Dia berkata, 'Dia menginginkan seseorang yang tidak diinginkan, dan aku berharap Allah tidak menghukumnya.' {cite:muruj-al-dhahab hlm. 49} Dia menolak bersumpah setia kepada al-Walid dan Sulayman, sehingga Hisham ibn Ismail, gubernur Madinah, memukulnya, mengelilinginya, dan memenjarakannya. Kemudian Abd al-Malik membantah pemukulan itu dalam surat kepada gubernur. {cite:salabi-umayyad-state-2020 hlm.34-35} Buku tersebut menyebutkan bahwa penolakannya untuk bersumpah setia kepada putra mahkota Al-Walid dan Suleiman pada waktu yang sama karena ia percaya bahwa kesetiaan kepada dua orang sekaligus tidak diperbolehkan. Abd al-Malik memerintahkan agar ia dicambuk dengan tiga puluh cambukan dan ditahan untuk rakyat, dan bahwa Qubaysa ibn Dhu'ayb turut berkontribusi pada pembebasannya. {cite:salabi-umayyad-state-2020 hlm.119-120}"
