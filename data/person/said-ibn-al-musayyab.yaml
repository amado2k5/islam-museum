label: { ar: "سعيد بن المسيب", en: "Sa'id ibn al-Musayyab" }
summary:
  ar: "سعيد بن المسيب؛ من كبار التابعين بمكة والمدينة، سئل من أول من ضرب الدنانير المنقوشة فقال عبد الملك بن مروان وبعث بتبر إلى دمشق فضرب له على وزن المثقال في الجاهلية.، وبلغه قول معاوية عند احتضاره اللهم أقل العثرة واعف عن الزلة وجد بحلمك على جهل من لم يرج غيرك فقال لقد رغب إلى من لا مرغوب إليه مثله وإني لأرجو ألا يعذبه الله {cite:muruj-al-dhahab p. 49}"
  en: "Sa'id ibn al-Musayyab; among the greatest Meccan-Medinan Followers — 'Abd al-Malik first struck engraved dinars' — and sent bullion to Damascus, struck for him on the Jahiliya mithqal."
