summary:
  ar: "زين العابدين بن علي (1936–2019)، ضابط وسياسي تونسي ترقى في أجهزة الأمن والجيش، فكان وزيرا للداخلية ثم رئيسا للوزراء، وخلف بورقيبة في رئاسة تونس في 7 نوفمبر 1987 فحكم نحو أربعة وعشرين عاما، حتى أطاحت به ثورة يناير 2011 ففرّ إلى السعودية، وحُوكم غيابيا في تونس، وتوفي في جدة سنة 2019 ودُفن في البقيع بالمدينة المنورة."
  en: "Zine El Abidine Ben Ali (1936–2019) was a Tunisian officer and politician who rose through the security services and the army, became minister of the interior and then prime minister, and succeeded Bourguiba as president of Tunisia on 7 November 1987, ruling for some twenty-four years until the January 2011 revolution drove him to flee to Saudi Arabia. He was tried in absentia in Tunisia, died at Jeddah in 2019 and was buried at al-Baqi in Medina."
  ur: "زین العابدین بن علی ⁦(1936ء–2019ء)⁩ تیونس کے افسر اور سیاست دان تھے جو سکیورٹی اداروں اور فوج میں ترقی کر کے وزیر داخلہ اور پھر وزیر اعظم بنے، اور 7 نومبر 1987ء کو بورقیبہ کے جانشین کے طور پر تیونس کے صدر بن گئے۔ انہوں نے تقریباً چوبیس برس حکومت کی حتیٰ کہ جنوری 2011ء کے انقلاب نے انہیں سعودی عرب فرار ہونے پر مجبور کر دیا۔ وہ جدہ میں وفات پا گئے اور مدینہ منورہ کے جنت البقیع میں دفن ہوئے۔"
  es: "Zine El Abidine Ben Ali (1936-2019) fue un oficial y político tunecino que ascendió en los servicios de seguridad y el ejército, llegó a ser ministro del Interior y luego primer ministro, y sucedió a Bourguiba como presidente de Túnez el 7 de noviembre de 1987. Gobernó durante veinticuatro años, hasta que la revolución de enero de 2011 lo obligó a huir a Arabia Saudí. Fue juzgado en ausencia en Túnez, falleció en Yeda en 2019 y fue enterrado en al-Baqi, en Medina."
  fr: "Zine El Abidine Ben Ali (1936-2019) était un officier et homme politique tunisien qui gravit les échelons des services de sécurité et de l'armée, devint ministre de l'Intérieur puis Premier ministre, et succéda à Bourguiba à la présidence de la Tunisie le 7 novembre 1987. Il gouverna pendant environ vingt-quatre ans, jusqu'à ce que la révolution de janvier 2011 le contraigne à fuir en Arabie saoudite. Jugé par contumace en Tunisie, il mourut à Djeddah en 2019 et fut inhumé à al-Baqi, à Médine."
  tr: "Zine El Abidine Ben Ali (1936–2019), güvenlik ve askeri hizmetlerde yükselen Tunuslu bir subay ve siyasetçiydi. İçişleri Bakanı ve ardından Başbakan olarak görev yaptı. 7 Kasım 1987'de Tunus Cumhurbaşkanı olarak Bourguiba'nın yerine geçti ve yaklaşık yirmi dört yıl hüküm sürdü, ta ki Ocak 2011 devrimi onu devirene kadar. Suudi Arabistan'a kaçtı, Tunus'ta gıyabında yargılandı, 2019'da Cidde'de öldü ve Medine'deki Al-Baqi'de defnedildi."
  id: "Zine El Abidine Ben Ali (1936–2019) adalah seorang perwira dan politisi Tunisia yang naik melalui dinas keamanan dan militer. Ia menjabat sebagai Menteri Dalam Negeri dan kemudian Perdana Menteri. Ia menggantikan Bourguiba sebagai Presiden Tunisia pada 7 November 1987, dan memerintah selama sekitar dua puluh empat tahun hingga revolusi Januari 2011 menggulingkannya. Ia melarikan diri ke Arab Saudi, diadili secara in absentia di Tunisia, meninggal di Jeddah pada tahun 2019, dan dimakamkan di Al-Baqi' di Madinah."
