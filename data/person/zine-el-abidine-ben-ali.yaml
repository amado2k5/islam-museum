summary:
  ar: "زين العابدين بن علي (1936–2019)، ضابط وسياسي تونسي ترقى في أجهزة الأمن والجيش، فكان وزيرا للداخلية ثم رئيسا للوزراء، وخلف بورقيبة في رئاسة تونس في 7 نوفمبر 1987 فحكم نحو أربعة وعشرين عاما، حتى أطاحت به ثورة يناير 2011 ففرّ إلى السعودية، وحُوكم غيابيا في تونس، وتوفي في جدة سنة 2019 ودُفن في البقيع بالمدينة المنورة."
  en: "Zine El Abidine Ben Ali (1936–2019) was a Tunisian officer and politician who rose through the security services and the army, became minister of the interior and then prime minister, and succeeded Bourguiba as president of Tunisia on 7 November 1987, ruling for some twenty-four years until the January 2011 revolution drove him to flee to Saudi Arabia. He was tried in absentia in Tunisia, died at Jeddah in 2019 and was buried at al-Baqi in Medina."
  ur: "زین العابدین بن علی (1936ء–2019ء) تیونس کے افسر اور سیاست دان تھے جو سکیورٹی اداروں اور فوج میں ترقی کر کے وزیر داخلہ اور پھر وزیر اعظم بنے، اور 7 نومبر 1987ء کو بورقیبہ کے جانشین کے طور پر تیونس کے صدر بن گئے۔ انہوں نے تقریباً چوبیس برس حکومت کی حتیٰ کہ جنوری 2011ء کے انقلاب نے انہیں سعودی عرب فرار ہونے پر مجبور کر دیا۔ وہ جدہ میں وفات پا گئے اور مدینہ منورہ کے جنت البقیع میں دفن ہوئے۔"
