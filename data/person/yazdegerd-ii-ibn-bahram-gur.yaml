summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك يزدجرد بن بهرام جور» {cite:tabari-tarikh-abu-al-fadl j.2 p.81}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "O, Sasani Perslerinin kralıydı ve el-Tabari'nin \"Yezdegerd Kralı ibn Bahram Jur'un Anılması\" başlığıyla anılmıştır {cite:tabari-tarikh-abu-al-fadl J.2 s.81}. Bu yerde, saltanatı yılları ve haberleri hakkında söylenenler anlatılır."
  id: "Ia adalah raja Persia Sasanian, yang disebut oleh al-Tabari dengan judul \"Penyebutan Raja Yazdegerd ibn Bahram Jur\" {cite:tabari-tarikh-abu-al-fadl J.2 hlm.81}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kabarnya diceritakan."
