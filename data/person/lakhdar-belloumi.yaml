summary:
  ar: "لاعب كرة قدم جزائري معتزل، وُلد في معسكر سنة 1958، ويُعد على نطاق واسع أعظم لاعب جزائري في التاريخ. لاعب وسط مهاجم قضى معظم مسيرته مع غالي معسكر ومولودية وهران، وسجل هدف فوز الجزائر الشهير على ألمانيا الغربية في كأس العالم 1982، وشارك في كأسي العالم 1982 و1986 وأولمبياد 1980."
  en: "Algerian retired footballer, born in Mascara in 1958, widely considered the greatest Algerian player of all time. An attacking midfielder who spent most of his career at GC Mascara and MC Oran, he scored the winning goal in Algeria's famous 2–1 victory over West Germany at the 1982 World Cup, and played at the 1982 and 1986 World Cups and the 1980 Olympics."
  ur: "الجزائری ریٹائرڈ فٹبالر، 1958 میں معسکر میں پیدا ہوئے اور عموماً الجزائر کے عظیم ترین کھلاڑی سمجھے جاتے ہیں۔ حملہ آور مڈفیلڈر جنہوں نے زیادہ تر کیریئر غالی معسکر اور مولودیہ وہران میں گزارا؛ 1982 ورلڈ کپ میں مغربی جرمنی کے خلاف الجزائر کی مشہور 2–1 فتح کا جیتنے والا گول انہی کا تھا، اور انہوں نے 1982 و 1986 ورلڈ کپ اور 1980 اولمپکس میں شرکت کی۔"
