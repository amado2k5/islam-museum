id: person/ibn-qutayba
class: person
label: { ar: "ابن قتيبة", en: "Ibn Qutayba" }
summary:
  ar: "عبد الله بن مسلم بن قتيبة الدينوري، اتهمه المسعودي بأنه سلب ما في كتاب أبي حنيفة الدينوري من تحرير علم الهيئة فنقله إلى كتبه نثلاً وجعله عن نفسه، وقال إنه فعل ذلك في كثير من كتب أبي حنيفة هذا {cite:muruj-al-dhahab p. 519}، وعند ابن الجوزي أبو محمد الكاتب المروزي وقيل الدينوري لأنه أقام بالدينور مدة، سكن بغداد وحدّث بها عن إسحاق بن راهويه وأبي حاتم وغيرهما، وكان عالماً ثقة ديّناً فاضلاً له التصانيف الشهورة منها غريب القرآن وغريب الحديث ومشكل القرآن ومشكل الحديث والمعارف وأدب الكاتب وعيون الأخبار وغير ذلك، وأخبر ابن المنادي أنه دعاه على دعوة فصاح صيحة لم يُسمع مثلها ثم أُغمي عليه فمات، وأخبره أبو القاسم إبراهيم بن محمد الصائغ أن ابن قتيبة أكل هريسة فأصابته حرارة فصاح صيحة شديدة ثم أغمي عليه إلى وقت صلاة الظهر ثم اضطرب ساعة ثم هدأ فما زال يتشهّد إلى وقت السحر ثم مات، وذلك أول ليلة من رجب سنة ست وسبعين ومائتين {cite:muntazam-ibn-al-jawzi j.5 p. 106}."
  en: "Abdallah ibn Muslim ibn Qutayba — accused by al-Mas'udi of stripping Abu Hanifa al-Dinawari's astronomical redaction into his own books as his own work, 'as he did with much of Abu Hanifa's' {cite:muruj-al-dhahab p. 519}."
