summary:
  ar: "عبد الله بن مسلم بن قتيبة الدينوري، اتهمه المسعودي بأنه سلب ما في كتاب أبي حنيفة الدينوري من تحرير علم الهيئة فنقله إلى كتبه نثلاً وجعله عن نفسه، وقال إنه فعل ذلك في كثير من كتب أبي حنيفة هذا {cite:muruj-al-dhahab p. 519}، وعند ابن الجوزي أبو محمد الكاتب المروزي وقيل الدينوري لأنه أقام بالدينور مدة، سكن بغداد وحدّث بها عن إسحاق بن راهويه وأبي حاتم وغيرهما، وكان عالماً ثقة ديّناً فاضلاً له التصانيف الشهورة منها غريب القرآن وغريب الحديث ومشكل القرآن ومشكل الحديث والمعارف وأدب الكاتب وعيون الأخبار وغير ذلك، وأخبر ابن المنادي أنه دعاه على دعوة فصاح صيحة لم يُسمع مثلها ثم أُغمي عليه فمات، وأخبره أبو القاسم إبراهيم بن محمد الصائغ أن ابن قتيبة أكل هريسة فأصابته حرارة فصاح صيحة شديدة ثم أغمي عليه إلى وقت صلاة الظهر ثم اضطرب ساعة ثم هدأ فما زال يتشهّد إلى وقت السحر ثم مات، وذلك أول ليلة من رجب سنة ست وسبعين ومائتين {cite:muntazam-ibn-al-jawzi j.5 p. 106}."
  en: "Abdallah ibn Muslim ibn Qutayba — accused by al-Mas'udi of stripping Abu Hanifa al-Dinawari's astronomical redaction into his own books as his own work, 'as he did with much of Abu Hanifa's' {cite:muruj-al-dhahab p. 519}."
  es: "Abdallah ibn Muslim ibn Qutayba — acusado por al-Mas'udi de haber despojado a Abu Hanifa al-Dinawari de su redacción astronómica y haberla incorporado a sus propios libros como obra propia, \"como hizo con gran parte de la obra de Abu Hanifa\" {cite:muruj-al-dhahab p. 519}."
  fr: "Abdallah ibn Muslim ibn Qutayba — accusé par al-Mas'udi d'avoir dépouillé la rédaction astronomique d'Abu Hanifa al-Dinawari dans ses propres livres comme son propre travail, « comme il l'a fait avec une grande partie de celle d'Abu Hanifa » {cite:muruj-al-dhahab p. 519}."
  ur: "عبداللہ بن مسلم بن قتیبہ - پر المسعودی نے الزام لگایا کہ اس نے اپنی کتابوں میں ابوحنیفہ الدینوری کی فلکیاتی ردوبدل کو اپنے کام کے طور پر اتار دیا، جیسا کہ اس نے ابو حنیفہ کی زیادہ تر کتابوں کے ساتھ کیا تھا۔ 519}۔"
  tr: "Abdullah ibn Muslim ibn Qutaybah al-Dinawari, el-Mesihi'yi Ebu Hanife el-Dinavri'nin astronomi biliminin yazımıyla ilgili kitabında yer alanları intihal etmekle suçladı, bu yüzden bunu kitaplarına bir risaleci olarak aktardı ve kendine atfetti. Bunu Ebu Hanifa'nın birçok kitabında yaptığını söyledi {atıf:Muruj-al-Dhahab, s. 519}. İbn el-Cevzi'ye göre, Ebu Muhammed el-Katib el-Marvazi'ye göre, el-Dinavari bir süre el-Dinur'da ikamet etmiş, Bağdat'ta yaşamış ve orada İshaq ibn Rahavey, Ebu Hatim ve diğerlerinden anlatımlar yapmıştır. Güvenilir, dindar ve erdemli bir âlimdi ve yazarları vardı En ünlüleri arasında Garib el-Kur'an, Harib al-Hadis, Mushkil al-Qur'an, Mushkil al-Hadis, Ma'arif, Adab al-Katib, Uyun al-Akhbar ve diğerleri bulunmaktadır. İbn el-Manadi, onu bir duaya davet ettiğini, duymadığı bir çığlık attığını, sonra bayıldığını, öldüğünü bildirdi. Ebu el-Kasım İbrahim bin Muhammed el-Sa'igh, İbn Kutaybe'nin harissa yediğini ve ateşlendiğini söyledi, bu yüzden yüksek sesle bağırdı, sonra öğle namazı zamanına kadar bayıldı, sonra bir saat huzursuzlaştı, sonra sakinleşip şafak vaktine kadar Taşahhud'u okumaya devam etti ve ardından öldü. Bu, iki yüz yetmiş altıncı yılın Rajab'ın ilk gecesiydi {atıf: Muntazam-ibn-al-Jawzi j.5, s. 106}."
  id: "Abdullah ibn Muslim ibn Qutaybah al-Dinawari menuduh al-Mas'udi menjiplak apa yang ada dalam buku Abu Hanifa al-Dinawari mengenai penulisan ilmu astronomi, sehingga ia memindahkannya ke bukunya sebagai risalah dan mengaitkannya dengan dirinya sendiri. Ia mengatakan bahwa ia melakukan hal ini dalam banyak buku Abu Hanifa {cite:muruj-al-dhahab, hlm. 519}. Menurut Ibn al-Jawzi, Abu Muhammad al-Katib al-Marwazi, dan dikatakan al-Dinawari karena ia pernah tinggal di al-Dinur untuk beberapa waktu, tinggal di Baghdad dan menceritakan di sana dari Ishaq ibn Rahawayh, Abu Hatim, dan lainnya. Ia adalah seorang ulama yang dapat dipercaya, religius, dan berbudi luhur dengan para penulis Di antara yang paling terkenal adalah Gharib al-Qur'an, Gharib al-Hadith, Mushkil al-Qur'an, Mushkil al-Hadith, Ma'arif, Adab al-Katib, Uyun al-Akhbar, dan lainnya. Ibn al-Manadi melaporkan bahwa ia mengundangnya untuk berdoa, dan ia berteriak dengan tangisan yang tidak didengarnya, lalu pingsan dan meninggal. Abu al-Qasim Ibrahim ibn Muhammad al-Sa'igh memberitahunya bahwa Ibn Qutaybah memakan harissa dan terkena demam, sehingga ia berteriak keras, lalu pingsan hingga waktu salat siang, kemudian gelisah selama satu jam, kemudian tenang dan terus membaca Tashahhud hingga fajar, lalu meninggal. Itu adalah malam pertama Rajab pada tahun dua ratus tujuh puluh enam {cite:muntazam-ibn-al-jawzi j.5, hlm. 106}."
