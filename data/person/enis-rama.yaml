summary:
  ar: "إمام ومؤلف كوسوفي ⁦(المولود 1976 في ميتروفيتسا)⁩، إمام جامع عيسى بك في ميتروفيتسا ورئيس تحرير قناة Peace TV الألبانية؛ درس الحديث في الجامعة الإسلامية بالمدينة المنورة ويحاضر أسبوعيا في ميتروفيتسا وبريشتينا. بلغ عدد متابعي صفحته على فيسبوك 237 ألفا في أكتوبر 2024 بحسب دراسة «كونتكست»."
  en: "Kosovar imam and author (born 12 June 1976 in Mitrovica), imam of the Isa Beg Mosque in Mitrovica and chief editor of Peace TV Shqip; trained in hadith at the Islamic University of Medina, he lectures weekly in Mitrovica and Pristina. His Facebook page counted 237,000 followers in October 2024 (Context study)."
  ur: "انیس راما ⁦(پیدائش 1976ء، میتروویتسا)⁩ کوسوو کے امام اور مصنف ہیں، میتروویتسا کی عیسیٰ بیگ مسجد کے امام اور پیس ٹی وی البانوی کے مدیرِ اعلیٰ؛ جامعہ اسلامیہ مدینہ منورہ میں حدیث کی تعلیم حاصل کی اور میتروویتسا و پرشٹینا میں ہفتہ وار دروس دیتے ہیں۔ اکتوبر 2024ء میں ان کے فیس بک صفحے کے فالوورز 237 ہزار تھے ⁦(کانٹیکسٹ مطالعہ)⁩۔"
