summary:
  ar: "إمام ومؤلف كوسوفي ⁦(المولود 1976 في ميتروفيتسا)⁩، إمام جامع عيسى بك في ميتروفيتسا ورئيس تحرير قناة Peace TV الألبانية؛ درس الحديث في الجامعة الإسلامية بالمدينة المنورة ويحاضر أسبوعيا في ميتروفيتسا وبريشتينا. بلغ عدد متابعي صفحته على فيسبوك 237 ألفا في أكتوبر 2024 بحسب دراسة «كونتكست»."
  en: "Kosovar imam and author (born 12 June 1976 in Mitrovica), imam of the Isa Beg Mosque in Mitrovica and chief editor of Peace TV Shqip; trained in hadith at the Islamic University of Medina, he lectures weekly in Mitrovica and Pristina. His Facebook page counted 237,000 followers in October 2024 (Context study)."
  ur: "انیس راما ⁦(پیدائش 1976ء، میتروویتسا)⁩ کوسوو کے امام اور مصنف ہیں، میتروویتسا کی عیسیٰ بیگ مسجد کے امام اور پیس ٹی وی البانوی کے مدیرِ اعلیٰ؛ جامعہ اسلامیہ مدینہ منورہ میں حدیث کی تعلیم حاصل کی اور میتروویتسا و پرشٹینا میں ہفتہ وار دروس دیتے ہیں۔ اکتوبر 2024ء میں ان کے فیس بک صفحے کے فالوورز 237 ہزار تھے ⁦(کانٹیکسٹ مطالعہ)⁩۔"
  es: "Imán y autor kosovar (nacido el 12 de junio de 1976 en Mitrovica), imán de la mezquita Isa Beg en Mitrovica y redactor jefe de Peace TV Shqip; se formó en hadices en la Universidad Islámica de Medina e imparte conferencias semanales en Mitrovica y Pristina. Su página de Facebook contaba con 237 000 seguidores en octubre de 2024 (Estudio de Contexto)."
  fr: "Imam et auteur kosovar (né le 12 juin 1976 à Mitrovica), imam de la mosquée Isa Beg de Mitrovica et rédacteur en chef de Peace TV Shqip; formé au hadith à l’Université islamique de Médine, il donne des conférences hebdomadaires à Mitrovica et à Pristina. Sa page Facebook comptait 237 000 abonnés en octobre 2024 (étude de contexte)."
  tr: "Kosovalı imam ve yazar (1976 doğumlu, Mitrovica), Mitrovica'daki İsa Bek Camii'nin imamı ve Arnavutluk Barış TV kanalının genel yayın yönetmeni; Medine'deki İslam Üniversitesi'nde hadis eğitimi aldı ve haftalık olarak Mitrovica ve Priştine'de konferanslar veriyor. Context tarafından yapılan bir araştırmaya göre, Facebook sayfasının Ekim 2024'te 237.000 takipçisi vardı."
  id: "Seorang imam dan penulis Kosovo (lahir 1976 di Mitrovica), imam Masjid Isa Bek di Mitrovica, dan pemimpin redaksi saluran TV Perdamaian Albania; ia belajar Hadis di Universitas Islam di Madinah dan memberikan kuliah mingguan di Mitrovica dan Pristina. Halaman Facebook-nya memiliki 237.000 pengikut pada Oktober 2024, menurut studi oleh Context."
