summary:
  ar: "عالم لاهوت إسلامي بوسني. كان مفتي ليوبليانا ورئيس المشيخة الإسلامية في سلوفينيا (2006–2021)، ثم مفتي سراييفو (2021–2026)، وهو أستاذ العقيدة والتصوف والأديان المقارنة في كلية الدراسات الإسلامية بسراييفو. وفي 10 أكتوبر 2026 انتُخب رئيسًا للعلماء في البوسنة والهرسك، رابع عشر من تولى المنصب."
  en: "Bosnian Islamic theologian. Mufti of Ljubljana and head of the Islamic Community in Slovenia (2006-2021), then Mufti of Sarajevo (2021-2026), he is full professor of aqida, tasawwuf and comparative religions at the Faculty of Islamic Studies in Sarajevo. On 10 October 2026 he was elected Reis-ul-ulema of the Islamic Community in Bosnia and Herzegovina, the fourteenth holder of the office."
  ur: "بوسنیائی اسلامی عالمِ دین۔ وہ لیوبلیانا کے مفتی اور سلووینیا کی اسلامی کمیونٹی کے سربراہ رہے (2006ء–2021ء)، پھر سرائیوو کے مفتی (2021ء–2026ء) ہوئے، اور سرائیوو کی فیکلٹی آف اسلامک اسٹڈیز میں عقیدہ، تصوف اور تقابلی مذاہب کے پروفیسر ہیں۔ 10 اکتوبر 2026ء کو وہ بوسنیا و ہرزیگووینا کی اسلامی کمیونٹی کے رئیس العلماء منتخب ہوئے، اس منصب کے چودھویں حامل۔"
