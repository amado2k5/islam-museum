summary:
  ar: "برهم أحمد صالح (وُلد 8 أيلول 1960)، سياسي كردي عراقي، رئيس جمهورية العراق من 2018 إلى 2022 خلفًا لفؤاد معصوم، ومنذ 1 كانون الثاني 2026 المفوض السامي للأمم المتحدة لشؤون اللاجئين. من قيادات الاتحاد الوطني الكردستاني منذ شبابه، تولى رئاسة وزراء إقليم كردستان 2009–2012 ونيابة رئاسة وزراء العراق، ويحمل شهادات في الهندسة من كارديف وليفربول."
  en: "Barham Ahmed Salih (born 8 September 1960) is an Iraqi Kurdish politician, president of Iraq from 2018 to 2022 in succession to Fuad Masum, and since 1 January 2026 the United Nations High Commissioner for Refugees. A Patriotic Union of Kurdistan leader since his youth, he was prime minister of the Kurdistan Region in 2009–2012 and a deputy prime minister of Iraq, and holds engineering degrees from Cardiff and Liverpool."
  ur: "برہم احمد صالح (پیدائش 8 ستمبر 1960ء) ایک عراقی کرد سیاست دان ہیں، 2018ء سے 2022ء تک فؤاد معصوم کے جانشین کے طور پر جمہوریۂ عراق کے صدر رہے، اور 1 جنوری 2026ء سے اقوام متحدہ کے ہائی کمشنر برائے مہاجرین ہیں۔ وہ پٹریاٹک یونین آف کردستان کے رہنما، 2009ء–2012ء میں کردستان ریجن کے وزیرِ اعظم اور عراق کے نائب وزیرِ اعظم رہ چکے ہیں؛ انہوں نے کارڈف اور لیورپول سے انجینئرنگ کی تعلیم حاصل کی۔"
