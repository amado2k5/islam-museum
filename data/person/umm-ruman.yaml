summary:
  ar: زوج أبي بكر الصديق ووالدة عبد الرحمن وعائشة؛ أسلمت قديماً وبايعت وهاجرت، وتوفيت في حياة النبي في ذي الحجة سنة 6هـ على الراجح، ونزل النبي في قبرها واستغفر لها.
  en: The wife of Abu Bakr and mother of Abd al-Rahman and Aisha; she embraced Islam early, gave her pledge and emigrated, and died in the Prophet's lifetime, in Dhu al-Hijja 6 AH on the sounder view; the Prophet went down into her grave and
    asked forgiveness for her.
  ur: "ابو بکر کی بیوی اور عبد الرحمٰن اور عائشہ کی والدہ؛ جلد مسلمان ہوئیں، بیعت کی اور ہجرت کی، اور ابتدائی زمانے میں فوت ہوئیں۔"
