summary:
  ar: "أحمد بن محمد بن الصلت بن المغلس، أبو العباس الحماني، ويقال أحمد بن الصلت وأحمد بن عطية، ابن أخي جبارة بن المغلس، كوفي الأصل نزل الشرقية ببغداد، وذكر أنه سمع بدمشق هشام بن عمار. أجمع من نقل ابن عساكر أقوالهم على أنه كان يضع الحديث: قال الخطيب إن أكثر ما حدّث به باطل وضعه، وإنه صنع أخباراً في مناقب أبي حنيفة نسبها إلى بشر بن الحارث وابن معين وابن المديني، وقال ابن عدي: ما رأيت في الكذابين أقل حياء منه، وقال الدارقطني: متروك يضع الحديث. مات في شوال سنة 308هـ على ما صوّبه الخطيب {cite:tarikh-dimashq-amrawi-v5 p. 373-378}."
  en: "Ahmad ibn Muhammad ibn al-Salt ibn al-Mughallis, Abu al-Abbas al-Himmani, also called Ahmad ibn al-Salt and Ahmad ibn Atiyya, nephew of Jubara ibn al-Mughallis, of Kufan origin, who lived in the Sharqiyya quarter of Baghdad and claimed to have heard Hisham ibn Ammar in Damascus. All the critics Ibn Asakir quotes agree that he forged hadith: al-Khatib says most of what he narrated was false and of his own making, and that he fabricated reports in praise of Abu Hanifa attributed to Bishr ibn al-Harith, Ibn Ma'in and Ibn al-Madini; Ibn Adi says he never saw a liar with less shame; al-Daraqutni says he was abandoned and forged hadith. He died in Shawwal 308 AH, the date al-Khatib held correct {cite:tarikh-dimashq-amrawi-v5 p. 373-378}."
  fr: "Ahmad ibn Muhammad ibn al-Salt ibn al-Mughallis, Abu al-Abbas al-Himmani, aussi appelé Ahmad ibn al-Salt et Ahmad ibn Atiyya, neveu de Jubara ibn al-Mughallis, d'origine koufienne, vivait dans le quartier Sharqiyya de Bagdad et prétendait avoir entendu Hisham ibn Ammar à Damas. Tous les critiques cités par Ibn Asakir l'accusent de fabriquer des hadiths : al-Khatib juge faux et de sa fabrication l'essentiel de ses récits et l'accuse d'avoir inventé des éloges d'Abu Hanifa attribués à Bishr ibn al-Harith, Ibn Ma'in et Ibn al-Madini ; Ibn Adi n'aurait jamais vu menteur moins honteux ; al-Daraqutni le dit délaissé et fabricateur. Il mourut en chawwal 308 H, date tenue pour correcte par al-Khatib {cite:tarikh-dimashq-amrawi-v5 p. 373-378}."
  ur: "احمد بن محمد بن الصلت بن المغلس، ابو العباس حمانی، جنہیں احمد بن الصلت اور احمد بن عطیہ بھی کہا جاتا ہے، جبارہ بن المغلس کے بھتیجے، اصلاً کوفی، بغداد کے محلہ شرقیہ میں رہتے تھے اور دعویٰ کرتے تھے کہ دمشق میں ہشام بن عمار سے سنا۔ ابن عساکر جن ناقدین کے اقوال نقل کرتے ہیں سب متفق ہیں کہ وہ حدیث گھڑتے تھے: خطیب کہتے ہیں کہ ان کی بیان کردہ اکثر روایات باطل اور ان کی اپنی گھڑی ہوئی ہیں، اور انہوں نے ابو حنیفہ کے مناقب میں بشر بن الحارث، ابن معین اور ابن المدینی کی طرف منسوب اخبار گھڑے؛ ابن عدی کہتے ہیں: میں نے جھوٹوں میں اس سے کم حیا والا نہیں دیکھا؛ دارقطنی: متروک، حدیث گھڑتا تھا۔ وہ شوال 308ھ میں فوت ہوئے، جسے خطیب نے درست قرار دیا {cite:tarikh-dimashq-amrawi-v5 p. 373-378}۔"
  es: "Ahmad ibn Muhammad ibn al-Salt ibn al-Mughallis, Abu al-Abbas al-Himmani, también llamado Ahmad ibn al-Salt y Ahmad ibn Atiyya, sobrino de Jubara ibn al-Mughallis, de origen kufan, que vivió en el barrio de Sharqiyya de Bagdad y afirmó haber escuchado a Hisham ibn Ammar en Damasco. Todos los críticos que cita Ibn Asakir coinciden en que falsificó hadices: al-Khatib dice que la mayor parte de lo que narró era falso y de su propia invención, y que fabricó informes en alabanza de Abu Hanifa atribuidos a Bishr ibn al-Harith, Ibn Ma'in e Ibn al-Madini; Ibn Adi dice que nunca vio a un mentiroso con menos vergüenza; al-Daraqutni dice que fue abandonado y falsificó hadices. Murió en Shawwal 308 AH, la fecha que al-Khatib consideraba correcta {cita:tarikh-dimashq-amrawi-v5 p. 373-378}."
  tr: "Ahmed ibn Muhammed ibn el-Salt ibn el-Muğallis, Ebu el-Abbas el-Hamani, Ahmed ibn el-Salt ve Ahmed ibn Atiyye olarak da bilinen, Cebera ibn el-Muğallis'in yeğeniydi. Aslen Kufa'lı olan Ahmed ibn el-Muğallis, Bağdat'ın doğu kesimine yerleşti. Şam'da Hişam ibn Ammar'dan hadis işittiğini belirtti. İbn Asakir'in rivayet ettiği kişiler, hadis uydurma konusunda oybirliğiyle hemfikir oldular. El-Hatib, rivayetlerinin çoğunun yalan ve uydurma olduğunu, Ebu Hanife'nin faziletleri hakkında da uydurma hikayeler anlattığını ve bunları Bişr ibn el-Harith, İbn Ma'in ve İbn el-Medini'ye atfettiğini söyledi. İbn Adi, \"Yalancılar arasında ondan daha utanmaz birini hiç görmedim\" dedi. El-Daraqutni ise, \"O terk edilmiş (rivayetleri reddedilmiş) ve hadis uydurmuştur\" dedi. El-Hatib'in görüşüne göre H. 308'in Şevval'inde vefat etmiştir. {alıntı:tarikh-dimashq-amrawi-v5 s. 373-378}"
  id: "Ahmad ibn Muhammad ibn al-Salt ibn al-Mughallis, Abu al-Abbas al-Hamani, juga dikenal sebagai Ahmad ibn al-Salt dan Ahmad ibn Atiyya, adalah keponakan Jabara ibn al-Mughallis. Berasal dari Kufa, ia menetap di bagian timur Baghdad. Ia menyebutkan mendengar hadits dari Hisham ibn Ammar di Damaskus. Mereka yang pernyataannya diriwayatkan oleh Ibn Asakir sepakat bahwa ia memalsukan hadits. Al-Khatib mengatakan bahwa sebagian besar yang ia riwayatkan adalah palsu dan dibuat-buat, dan bahwa ia mengarang cerita tentang keutamaan Abu Hanifa, dengan menghubungkannya kepada Bishr ibn al-Harith, Ibn Ma'in, dan Ibn al-Madini. Ibn Adi berkata, \"Aku belum pernah melihat seorang pun yang kurang tidak tahu malu di antara para pendusta selain dia.\" Al-Daraqutni berkata, \"Dia ditinggalkan (riwayatnya ditolak) dan haditsnya dibuat-buat.\" Beliau wafat pada bulan Syawal 308 H menurut pendapat al-Khatib. {mengutip:tarikh-dimashq-amrawi-v5 hal. 373-378}"
died: { hijri: "0308-10", edtf: "0921-02/0921-03", calendar: julian, precision: month, status: debated, derived: true, note: "ابن قانع وعلي بن عمر الحربي: مات في شوال سنة 308، وصوّبه الخطيب؛ وقال عيسى بن حامد الرخجي: في المحرم سنة 302، وقال الخطيب: هذا خطأ {cite:tarikh-dimashq-amrawi-v5 p. 378}. التحويل مشتق بالحساب الجدولي لشوال 308.", sources: [source/tarikh-dimashq-amrawi-v5] }
