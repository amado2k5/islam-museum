    summary:
      ar: "الخطيب: حدّث بأحاديث أكثرها باطلة هو وضعها، وجمع أخباراً صنعها في مناقب أبي حنيفة؛ ابن عدي: يحدّث عن شيوخ ماتوا قبل أن يولد بدهر، وما رأيت في الكذابين أقل حياء منه؛ الدارقطني: متروك يضع الحديث؛ ابن أبي الفوارس: كان يضع؛ ابن قانع: ليس بثقة؛ أبو نعيم: يروي عن شيوخ لم يلقهم المشاهير والمناكير، لا شيء."
      en: "Al-Khatib: he narrated hadiths most of which were false and of his own making, and compiled reports he fabricated in praise of Abu Hanifa; Ibn Adi: he narrated from shaykhs who had died long before he was born, and I never saw a liar with less shame; al-Daraqutni: abandoned, he forged hadith; Ibn Abi al-Fawaris: he used to forge; Ibn Qani': not trustworthy; Abu Nu'aym: he narrates well-known and objectionable reports from shaykhs he never met — worthless."
