summary:
  ar: "لاعب كرة قدم فرنسي محترف، وُلد في لانيي سور مارن سنة 1993 لأبوين غينيين؛ لاعب وسط مركزي تخرج في مانشستر يونايتد وتألق مع يوفنتوس، وعاد إلى يونايتد سنة 2016 مقابل مبلغ قياسي عالمي آنذاك قدره 105 ملايين يورو، وفاز بكأس العالم 2018 مع فرنسا مسجلًا في النهائي، وعاد إلى يوفنتوس سنة 2022، ونفّذ إيقافًا بسبب المنشطات خُفّض عند الاستئناف إلى 18 شهرًا وانتهى في مارس 2025، ووقّع لموناكو في يونيو 2025."
  en: "French professional footballer, born in Lagny-sur-Marne in 1993 to Guinean parents. A central midfielder who came through Manchester United, starred for Juventus, returned to United in 2016 for a then world-record fee of 105 million euros, won the 2018 World Cup with France scoring in the final, rejoined Juventus in 2022, served a doping ban reduced on appeal to 18 months and lifted in March 2025, and signed for Monaco in June 2025."
  ur: "فرانسیسی پیشہ ور فٹبالر، 1993 میں لانی سور مارن میں گنی کے والدین کے ہاں پیدا ہوئے؛ مرکزی مڈفیلڈر جو مانچسٹر یونائیٹڈ سے ابھرے، یووینٹس میں چمکے، 2016 میں اس وقت کے عالمی ریکارڈ 10 کروڑ 50 لاکھ یورو کے عوض یونائیٹڈ واپس آئے، فرانس کے ساتھ 2018 ورلڈ کپ جیتا اور فائنل میں گول کیا، 2022 میں یووینٹس واپس گئے، ڈوپنگ پابندی بھگتی جو اپیل پر 18 ماہ رہ گئی اور مارچ 2025 میں ختم ہوئی، اور جون 2025 میں موناکو سے معاہدہ کیا۔"
