id: person/ibn-muti-al-zawawi
class: person
label: { ar: "ابن معطي الزواوي صاحب الألفية" }
summary:
  ar: "الشيخ زين الدين أبو الحسين يحيى بن عبد المعطي بن عبد النور الزواوي نسبة إلى زواوة قبيلة كبيرة بأعمال إفريقية؛ الفقيه الحنفي النحوي، ولد سنة أربع وستين وخمسمائة وأقرأ العربية مدة بمصر ودمشق وروى عن القاسم بن عساكر وغيره، وهو أجل تلامذة الجزولي وانفرد بعلم العربية وصنف الألفية المشهورة وغيرها؛ مات في ذي القعدة سنة ثمان وعشرين وستمائة بمصر وقبره قريب من تربة الإمام الشافعي {cite:shadharat-dhahab p. 129}."
  en: "Zayn al-Din Ibn Mu'ti al-Zawawi — the Hanafi grammarian of the Zawawa tribe who taught Arabic at Cairo and Damascus, al-Jazuli's foremost pupil, sole master of Arabic in his day and author of the famous Alfiyya; died Dhu al-Qa'da 628 in Egypt, buried near al-Shafi'i's tomb {cite:shadharat-dhahab p. 129}."
  es: "Zayn al-Din Ibn Mu'ti al-Zawawi, el gramático hanafi de la tribu Zawawa que enseñó árabe en El Cairo y Damasco, el alumno más destacado de al-Jazuli, único maestro de árabe en su época y autor de la famosa Alfiyya; murió Dhu al-Qa'da en 628 en Egipto, enterrado cerca de la tumba de al-Shafi'i {cita: shadharat-dhahab p. 129}."
  fr: "Zayn al-Din Ibn Mu'ti al-Zawawi — le grammairien Hanafi de la tribu Zawawa qui enseigna l'arabe au Caire et à Damas, le plus éminent élève d'al-Jazuli, seul maître de l'arabe à son époque et auteur du célèbre Alfiyya; mort Dhu al-Qa'da 628 en Égypte, enterré près de la tombe d'al-Shafi'i {cite: shadharat-dhahab p. 129}."
  ur: "زین الدین ابن مطیع الزاوی - زاویہ قبیلے کا حنفی گرامر جس نے قاہرہ اور دمشق میں عربی پڑھائی، الجزولی کا سب سے بڑا شاگرد، اپنے دور میں عربی کا واحد ماہر اور مشہور الفیہ کا مصنف؛ ذوالقعدہ 628 میں مصر میں وفات پائی، الشافعی کے مقبرے کے قریب دفن ہوئے۔ 129}۔"
  tr: "Şeyh Zain al-Din Ebu el-Hüseyin Yahya ibn Abd al-Mu'ti ibn Abd al-Mu'ti ibn Abd al-Nur al-Zawawi, Afrika eserleri bulunan büyük bir kabileden adını taşır; Hanefi bir fihikâr ve dilbilgicisidir. 564 Hicri yılında doğmuş ve bir süre Mısır ile Şam'da Arapça öğrenmiştir. El-Kasım bin Asakir ve diğerlerinden rivayet etmiştir. El-Cezuli'nin en seçkin öğrencilerinden biri ve Arapça konusunda eşsiz bilgiye sahipti; ünlü Alfiyyah ve diğerlerini yazmıştır. Mısır'da 628 Hicri yılında Zhu'd-Qi'dah'ta öldü ve mezarı İmam Şafi'i'nin türbesinin yakınındadır {atıf:shadharat-dhahab, s. 129}."
  id: "Sheikh Zain al-Din Abu al-Husayn Yahya ibn Abd al-Mu'ti ibn Abd al-Nur al-Zawawi, dinamai menurut Zawawa, sebuah suku besar dengan karya-karya Afrika; seorang ahli hukum dan tata bahasa Hanafi. Ia lahir pada tahun 564 H dan belajar bahasa Arab untuk sementara waktu di Mesir dan Damaskus. Ia menceritakan dari al-Qasim ibn Asakir dan lainnya. Ia adalah salah satu murid paling terkemuka al-Jazuli dan sangat berpengetahuan dalam bahasa Arab serta menulis karya terkenal Alfiyyah dan lainnya. Ia meninggal di Dhu al-Qi'dah pada tahun 628 H di Mesir, dan makamnya berada di dekat makam Imam al-Shafi'i {cite:shadharat-dhahab, hlm. 129}."
