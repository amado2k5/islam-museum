label: { ar: "ابن معطي الزواوي صاحب الألفية" }
summary:
  ar: "الشيخ زين الدين أبو الحسين يحيى بن عبد المعطي بن عبد النور الزواوي نسبة إلى زواوة قبيلة كبيرة بأعمال إفريقية؛ الفقيه الحنفي النحوي، ولد سنة أربع وستين وخمسمائة وأقرأ العربية مدة بمصر ودمشق وروى عن القاسم بن عساكر وغيره، وهو أجل تلامذة الجزولي وانفرد بعلم العربية وصنف الألفية المشهورة وغيرها؛ مات في ذي القعدة سنة ثمان وعشرين وستمائة بمصر وقبره قريب من تربة الإمام الشافعي {cite:shadharat-dhahab p. 129}."
  en: "Zayn al-Din Ibn Mu'ti al-Zawawi — the Hanafi grammarian of the Zawawa tribe who taught Arabic at Cairo and Damascus, al-Jazuli's foremost pupil, sole master of Arabic in his day and author of the famous Alfiyya; died Dhu al-Qa'da 628 in Egypt, buried near al-Shafi'i's tomb {cite:shadharat-dhahab p. 129}."
