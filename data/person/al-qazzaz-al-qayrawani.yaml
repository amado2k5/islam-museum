label: { ar: "القزاز القيرواني", en: "al-Qazzaz al-Qayrawani", fr: "al-Qazzaz al-Qayrawani", es: "al-Qazzaz al-Qayrawani", ur: "القزاز القیروانی" }
summary:
  ar: "أبو عبد الله محمد بن جعفر التميمي النحوي المعروف بالقزاز القيرواني؛ كان متمعاً في خدمة العزيز بن المعز صاحب مصر سنة تسعين وثلاثمائة فما بعدها؛ والغالب عليه علم النحو واللغة والافتنان في التآليف؛ أمره العزيز بن المعز العبيدي صاحب مصر أن يؤلف كتاباً في سائر الحروف التي جاءت لمعنى على حروف المعجم، فجمع المفترق من الكتب النفيسة حتى بلغ جملة الكتاب ألف ورقة؛ وله كتاب «المعاريض» وشعر مطبوع؛ وقال فيه ابن رشيق في الأنموذج إنه فضح المتقدمين وقطع ألسنة المتأخرين {cite:wafayat-ayan}."
  en: "Abu Abd Allah Muhammad ibn Ja'far al-Tamimi, the grammarian known as al-Qazzaz al-Qayrawani. He lived in comfort in the service of al-Aziz ibn al-Mu'izz, ruler of Egypt, from 390 onward; grammar and philology were his chief study, and he excelled in varied composition. Al-Aziz ibn al-Mu'izz al-Ubaydi, ruler of Egypt, commissioned him to write a book on all the particles that carry meaning, arranged in alphabetical order; he gathered scattered precious books until the work reached a thousand folios. He also wrote al-Ma'arid and composed natural, flowing poetry. Ibn Rashiq, in al-Unmudhaj, said of him that he put the earlier writers to shame and silenced the later ones {cite:wafayat-ayan}."
  fr: "Abu Abd Allah Muhammad ibn Ja'far al-Tamimi, le grammairien connu sous le nom d'al-Qazzaz al-Qayrawani. Il vécut dans le confort au service d'al-Aziz ibn al-Mu'izz, souverain d'Égypte, à partir de 390 ; La grammaire et la philologie étaient ses principales études, et il excellait dans la composition variée. Al-Aziz ibn al-Mu'izz al-Ubaydi, souverain de l'Égypte, lui a commandé d'écrire un livre sur toutes les particules qui portent sens, disposés par ordre alphabétique ; Il rassembla des livres précieux jusqu’à ce que l’ouvrage atteigne mille folios. Il a également écrit al-Ma'arid et composé de la poésie naturelle et fluide. Ibn Rashiq, dans al-Unmudhaj, a dit de lui qu'il a mis les écrivains précédents à la honte et fait taire les derniers {cite:wafayat-ayan}."
  es: "Abu Abd Allah Muhammad ibn Ja'far al-Tamimi, el gramático conocido como al-Qazzaz al-Qayrawani, vivió cómodamente al servicio de al-Aziz ibn al-Mu'izz, gobernante de Egipto, desde el año 390 en adelante. Su principal área de estudio fueron la gramática y la filología, y destacó en la composición de diversos géneros. Al-Aziz ibn al-Mu'izz al-Ubaydi, gobernante de Egipto, le encargó escribir un libro sobre todas las partículas con significado, ordenadas alfabéticamente. Reunió valiosos libros dispersos hasta completar una obra de mil folios. También escribió al-Ma'arid y compuso poesía fluida y natural. Ibn Rashiq, en al-Unmudhaj, afirmó que eclipsó a los escritores anteriores y silenció a los posteriores {cite:wafayat-ayan}."
  ur: "ابو عبد اللہ محمد بن جعفر التمیمی، گرامر دان القزاز القیروانی کے نام سے جانا جاتا ہے۔ وہ 390 کے بعد سے مصر کے حکمران العزیز ابن المعز کی خدمت میں آرام سے رہے۔ گرامر اور فلولوجی ان کا بنیادی مطالعہ تھا، اور اس نے متنوع ساخت میں مہارت حاصل کی۔ مصر کے حکمران العزیز ابن المعز العبیدی نے اسے حروف تہجی کی ترتیب سے ترتیب دیے گئے تمام ذرّات پر ایک کتاب لکھنے کا حکم دیا۔ اس نے بکھری ہوئی قیمتی کتابیں جمع کیں یہاں تک کہ کام ایک ہزار فولیو تک پہنچ گیا۔ اس نے المعرید بھی لکھی اور فطری، رواں شاعری بھی کی۔ ابن رشیق نے انمذھج میں ان کے بارے میں کہا ہے کہ اس نے پہلے لکھنے والوں کو رسوا کیا اور بعد والوں کو خاموش کر دیا۔"
  tr: "El-Qazzaz el-Kefrewani olarak bilinen dilbilimci Ebu Abdullah Muhammed bin Cafer el-Temimi, 390 Hicri yılında ve sonrasında Mısır'ın hükümdarı el-Aziz bin el-Mu'izz'e hizmet etmeye kendini adamıştı; esas olarak dilbilgisi, dil ve yazıların ilgisi konusunda bilgiliydi. Mısır'ın hükümdarı El-Aziz bin el-Muizz el-Ubeydi, ona sözlük harfleri anlamına gelen tüm harfler hakkında bir kitap yazmasını emretti. Toplam bin sayfaya ulaşan değerli kitaplar topladı; ayrıca 'El-Ma'arid' adlı kitaba ve şiirler bastı. İbn Raşik, Al-Model'de erken alimleri ortaya çıkardığını ve sonraki {atıf:wafayat-ayan} dillerini kestiğini söyledi."
  id: "Abu Abdullah Muhammad ibn Ja'far al-Tamimi, ahli tata bahasa yang dikenal sebagai al-Qazzaz al-Qayrawani, sangat berdedikasi melayani al-Aziz ibn al-Mu'izz, penguasa Mesir pada tahun 390 H dan setelahnya; ia terutama menguasai tata bahasa, bahasa, dan ketertarikan dalam tulisan. Al-Aziz ibn al-Mu'izz al-Ubaidi, penguasa Mesir, memerintahkannya untuk menulis buku tentang semua huruf yang kemudian berarti huruf-huruf dalam kamus. Ia mengumpulkan buku-buku berharga yang mencapai total seribu halaman; ia juga memiliki buku 'Al-Ma'arid' dan puisi cetak. Ibn Rashiq mengatakan dalam Al-Model, bahwa ia membongkar para ulama awal dan memotong lidah para {cite:wafayat-ayan} yang kemudian."
