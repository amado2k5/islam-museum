summary:
  ar: "أبو عبد الله محمد بن جعفر التميمي النحوي المعروف بالقزاز القيرواني؛ كان متمعاً في خدمة العزيز بن المعز صاحب مصر سنة تسعين وثلاثمائة فما بعدها؛ والغالب عليه علم النحو واللغة والافتنان في التآليف؛ أمره العزيز بن المعز العبيدي صاحب مصر أن يؤلف كتاباً في سائر الحروف التي جاءت لمعنى على حروف المعجم، فجمع المفترق من الكتب النفيسة حتى بلغ جملة الكتاب ألف ورقة؛ وله كتاب «المعاريض» وشعر مطبوع؛ وقال فيه ابن رشيق في الأنموذج إنه فضح المتقدمين وقطع ألسنة المتأخرين {cite:wafayat-ayan}."
