label: { ar: "القزاز القيرواني", en: "al-Qazzaz al-Qayrawani" }
summary:
  ar: "أبو عبد الله محمد بن جعفر التميمي النحوي المعروف بالقزاز القيرواني؛ كان متمعاً في خدمة العزيز بن المعز صاحب مصر سنة تسعين وثلاثمائة فما بعدها؛ والغالب عليه علم النحو واللغة والافتنان في التآليف؛ أمره العزيز بن المعز العبيدي صاحب مصر أن يؤلف كتاباً في سائر الحروف التي جاءت لمعنى على حروف المعجم، فجمع المفترق من الكتب النفيسة حتى بلغ جملة الكتاب ألف ورقة؛ وله كتاب «المعاريض» وشعر مطبوع؛ وقال فيه ابن رشيق في الأنموذج إنه فضح المتقدمين وقطع ألسنة المتأخرين {cite:wafayat-ayan}."
  en: "Abu Abd Allah Muhammad ibn Ja'far al-Tamimi, the grammarian known as al-Qazzaz al-Qayrawani. He lived in comfort in the service of al-Aziz ibn al-Mu'izz, ruler of Egypt, from 390 onward; grammar and philology were his chief study, and he excelled in varied composition. Al-Aziz ibn al-Mu'izz al-Ubaydi, ruler of Egypt, commissioned him to write a book on all the particles that carry meaning, arranged in alphabetical order; he gathered scattered precious books until the work reached a thousand folios. He also wrote al-Ma'arid and composed natural, flowing poetry. Ibn Rashiq, in al-Unmudhaj, said of him that he put the earlier writers to shame and silenced the later ones {cite:wafayat-ayan}."
