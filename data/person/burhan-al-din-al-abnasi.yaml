summary:
  ar: "شيخ الديار المصرية مربياً للطلبة؛ تخرج بمغلطاي وتفقه بالأسناوي والمنفلوطي، وبنى زاوية بالمقس ظاهر القاهرة يحسن فيها إلى الطلبة ويرتب لهم الرزق حتى صار أكثر الطلبة بالقاهرة تلامذته وأخذ عنه ابن حجر العسقلاني؛ وعُيّن للقضاء فتوارى وفتح المصحف فخرجت آية السجن، وحج فمات راجعاً في المحرم بعيون القصب قرب عقبة أيلة ورثاه زين الدين العراقي {cite:shadharat-dhahab p. 10-11, 21-22}."
  en: "'Shaykh of the Egyptian lands' — the students' provider of Cairo whose Muqs zawiya fed and taught them; offered the judgeship he hid, opened the mushaf and found the prison-verse; died returning from hajj near Aqabat Ayla, elegised by al-Iraqi {cite:shadharat-dhahab p. 10-11}."
  es: "'Shaykh de las tierras egipcias': el proveedor de estudiantes de El Cairo, cuya zawiya de Muqs los alimentó y les enseñó; ofreció el cargo de juez que escondió, abrió el mushaf y encontró el versículo de la prisión; murió regresando del hajj cerca de Aqabat Ayla, elogiado por al-Iraqi {cite:shadharat-dhahab p. 10-11}."
  fr: "« Cheikh des terres égyptiennes » — le pourvoyeur des étudiants du Caire dont la zawiya Muqs les nourrissait et les instruisait; il offrit la charge de juge qu'il cachait, ouvrit le mushaf et découvrit le verset de la prison; mourut en revenant du hajj près d'Aqabat Ayla, élégiaque par al-Iraqi {cite: shadharat-dhahab p. 10-11}."
  ur: "'مصری سرزمین کے شیخ' - قاہرہ کے طلباء فراہم کرنے والے جن کے مقس زاویہ نے انہیں کھلایا اور سکھایا؛ جج کی پیشکش کی جو اس نے چھپائی، مصحف کھولا اور جیل کی آیت کو پایا۔ عقبات عائلہ کے قریب حج سے واپسی پر وفات پائی، جسے العراقی نے متعین کیا تھا۔ 10-11}۔"
  tr: "Mısır topraklarının şeyhi öğrenci eğitimcisiydi; Mağlatay'da mezun oldu, Al-Asnawi ve Al-Manfaluti'nin yanında hukuk eğitimi aldı ve Kahire yakınlarındaki Al-Maqqs'ta bir zaviye inşa etti; burada öğrencilere hizmet etme ve onlara destek sağlama konusunda üstün başarı gösterdi; ta ki Kahire'deki öğrencilerin çoğu onun öğrencisi olana kadar. İbn Hajar Al-Askalani onun yanında eğitim aldı; yargıç olarak atandı ve saklandı, Kur'an'ı açtı ve hapis ayeti serbest bırakıldı. Hac yaptı ve Ayla Akabe'si yakınlarındaki kaynaklarda Muharrem'e dönerek öldü. Zain al-Din al-Iraqi (atı: shadharat-dhahab s. 10-11, 21-22}"
  id: "Sheikh tanah Mesir adalah pendidik para murid; ia lulus di Maghlatai dan belajar hukum di bawah bimbingan Al-Asnawi dan Al-Manfaluti, serta membangun zawiya di Al-Maqqs dekat Kairo, di mana ia unggul dalam melayani murid dan menyediakan kebutuhan mereka hingga sebagian besar murid di Kairo menjadi muridnya. Ibn Hajar Al-Asqalani belajar di bawah bimbingannya; ia diangkat menjadi hakim dan bersembunyi, membuka Al-Quran, dan ayat penjara dibebaskan. Ia melaksanakan Haji dan meninggal saat kembali di Muharram di mata air dekat Aqaba Ayla. Zain al-Din al-Iraqi (kutip: shadharat-dhahab hlm. 10-11, 21-22}"
