summary:
  ar: "شيخ الديار المصرية مربياً للطلبة؛ تخرج بمغلطاي وتفقه بالأسناوي والمنفلوطي، وبنى زاوية بالمقس ظاهر القاهرة يحسن فيها إلى الطلبة ويرتب لهم الرزق حتى صار أكثر الطلبة بالقاهرة تلامذته وأخذ عنه ابن حجر العسقلاني؛ وعُيّن للقضاء فتوارى وفتح المصحف فخرجت آية السجن، وحج فمات راجعاً في المحرم بعيون القصب قرب عقبة أيلة ورثاه زين الدين العراقي {cite:shadharat-dhahab p. 10-11, 21-22}."
  en: "'Shaykh of the Egyptian lands' — the students' provider of Cairo whose Muqs zawiya fed and taught them; offered the judgeship he hid, opened the mushaf and found the prison-verse; died returning from hajj near Aqabat Ayla, elegised by al-Iraqi {cite:shadharat-dhahab p. 10-11}."
