summary:
  ar: "طارق محمود أحمد، البارون أحمد أوف ويمبلدون ⁦(وُلد في 3 نيسان 1968 في لامبث بلندن)⁩، رجل أعمال وسياسي محافظ بريطاني، ابن مهاجرين باكستانيين ناطقين بالبنجابية. عمل في المصارف والتمويل، ونال لقب لورد مدى الحياة سنة 2011، وتولى مناصب وزارية متتابعة حتى صار وزير دولة للشرق الأوسط وجنوب آسيا والأمم المتحدة (2017–2024)، وهو عضو في الجماعة الإسلامية الأحمدية."
  en: "Tariq Mahmood Ahmad, Baron Ahmad of Wimbledon (born 3 April 1968 in Lambeth, London) is a British Conservative businessman and politician, the son of Punjabi-speaking Pakistani immigrants. He worked in banking and finance, was made a life peer in 2011, and held a succession of ministerial posts, most recently Minister of State for the Middle East, South Asia and the United Nations (2017-2024). He is a member of the Ahmadiyya Muslim Community."
  ur: "طارق محمود احمد، بیرن احمد آف ویمبلڈن ⁦(پیدائش 3 اپریل 1968، لیمبیتھ، لندن)⁩ برطانوی کنزرویٹو کاروباری اور سیاست دان ہیں، جو پنجابی بولنے والے پاکستانی مہاجر والدین کے بیٹے ہیں۔ انہوں نے بینکاری اور مالیاتی شعبے میں کام کیا، 2011 میں تاحیات لارڈ بنے، اور پے در پے وزارتی عہدوں پر رہے، آخر میں وزیرِ مملکت برائے مشرقِ وسطیٰ، جنوبی ایشیا اور اقوامِ متحدہ (2017–2024) رہے۔ وہ احمدیہ مسلم جماعت کے رکن ہیں۔"
  es: "Tariq Mahmood Ahmad, barón Ahmad de Wimbledon (nacido el 3 de abril de 1968 en Lambeth, Londres), es un empresario y político británico del Partido Conservador, hijo de inmigrantes pakistaníes de habla punjabi. Trabajó en el sector bancario y financiero, fue nombrado par vitalicio en 2011 y ocupó diversos cargos ministeriales, el más reciente el de Ministro de Estado para Oriente Medio, Asia Meridional y las Naciones Unidas (2017-2024). Es miembro de la Comunidad Musulmana Ahmadiyya."
  fr: "Tariq Mahmood Ahmad, baron Ahmad de Wimbledon (né le 3 avril 1968 à Lambeth, Londres), est un homme d'affaires et homme politique britannique conservateur, fils d'immigrants pakistanais de langue pendjabi. Il a travaillé dans le secteur bancaire et financier, a été fait pair à vie en 2011 et a occupé plusieurs postes ministériels, dont celui de ministre d'État pour le Moyen-Orient, l'Asie du Sud et les Nations Unies (2017-2024). Il est membre de la communauté musulmane ahmadie."
  tr: "Tariq Mahmood Ahmed, Wimbledon Baronu Ahmed (3 Nisan 1968, Lambeth, Londra doğumlu), Britanyalı bir iş insanı ve Muhafazakar politikacıdır; Pencapça konuşan Pakistanlı göçmenlerin oğludur. Bankacılık ve finans sektöründe çalıştı, 2011'de Ömür Boyu Lord unvanı aldı ve ardışık bakanlık görevlerinde bulundu; ta ki 2017–2024 yılları arasında Orta Doğu, Güney Asya ve Birleşmiş Milletler Devlet Bakanı olana kadar. Ayrıca Ahmadiyya Müslüman Topluluğu'nun bir üyesidir."
  id: "Tariq Mahmood Ahmed, Baron Ahmed dari Wimbledon (lahir 3 April 1968, di Lambeth, London), adalah seorang pengusaha Inggris dan politisi Konservatif, putra imigran Pakistan yang berbahasa Punjabi. Ia bekerja di bidang perbankan dan keuangan, dianugerahi gelar Knight Lord seumur hidup pada tahun 2011, dan memegang posisi menteri berturut-turut hingga menjadi Menteri Negara untuk Timur Tengah, Asia Selatan, dan Perserikatan Bangsa-Bangsa (2017–2024). Ia juga merupakan anggota Komunitas Muslim Ahmadiyya."

