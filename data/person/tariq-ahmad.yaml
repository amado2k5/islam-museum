summary:
  ar: "طارق محمود أحمد، البارون أحمد أوف ويمبلدون (وُلد في 3 نيسان 1968 في لامبث بلندن)، رجل أعمال وسياسي محافظ بريطاني، ابن مهاجرين باكستانيين ناطقين بالبنجابية. عمل في المصارف والتمويل، ونال لقب لورد مدى الحياة سنة 2011، وتولى مناصب وزارية متتابعة حتى صار وزير دولة للشرق الأوسط وجنوب آسيا والأمم المتحدة (2017–2024)، وهو عضو في الجماعة الإسلامية الأحمدية."
  en: "Tariq Mahmood Ahmad, Baron Ahmad of Wimbledon (born 3 April 1968 in Lambeth, London) is a British Conservative businessman and politician, the son of Punjabi-speaking Pakistani immigrants. He worked in banking and finance, was made a life peer in 2011, and held a succession of ministerial posts, most recently Minister of State for the Middle East, South Asia and the United Nations (2017-2024). He is a member of the Ahmadiyya Muslim Community."
  ur: "طارق محمود احمد، بیرن احمد آف ویمبلڈن (پیدائش 3 اپریل 1968، لیمبیتھ، لندن) برطانوی کنزرویٹو کاروباری اور سیاست دان ہیں، جو پنجابی بولنے والے پاکستانی مہاجر والدین کے بیٹے ہیں۔ انہوں نے بینکاری اور مالیاتی شعبے میں کام کیا، 2011 میں تاحیات لارڈ بنے، اور پے در پے وزارتی عہدوں پر رہے، آخر میں وزیرِ مملکت برائے مشرقِ وسطیٰ، جنوبی ایشیا اور اقوامِ متحدہ (2017–2024) رہے۔ وہ احمدیہ مسلم جماعت کے رکن ہیں۔"

