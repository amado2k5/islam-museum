summary:
  ar: "من كبار علماء الأزهر الشريف، والأمين المساعد الأسبق لمجمع البحوث الإسلامية {cite:min-qadaya-al-mal-wal-amal-azhar p. 2}، وتوفي سنة 1401هـ / 1981م بحسب ما يذكره غلاف الكتاب {cite:min-qadaya-al-mal-wal-amal-azhar p. 1}. من كتبه «من قضايا العمل والمال في الإسلام»، ضمن السلسلة العلمية للمجمع، وهو الكتاب الذي يقوم عليه هذا الإدخال. تاريخ الوفاة يحتاج إلى مصدر ثانٍ."
  en: "A senior scholar of al-Azhar and former Assistant Secretary-General of the Islamic Research Academy (p. 2). The cover gives his death as 1401 AH / 1981 CE (p. 1); this needs a second source. His book on work and wealth in Islam is the source for this card."
