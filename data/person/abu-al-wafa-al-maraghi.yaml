summary:
  ar: "من كبار علماء الأزهر الشريف، والأمين المساعد الأسبق لمجمع البحوث الإسلامية {cite:min-qadaya-al-mal-wal-amal-azhar p. 2}، وتوفي سنة 1401هـ / 1981م بحسب ما يذكره غلاف الكتاب {cite:min-qadaya-al-mal-wal-amal-azhar p. 1}. من كتبه «من قضايا العمل والمال في الإسلام»، ضمن السلسلة العلمية للمجمع، وهو الكتاب الذي يقوم عليه هذا الإدخال. تاريخ الوفاة يحتاج إلى مصدر ثانٍ."
  en: "A senior scholar of al-Azhar and former Assistant Secretary-General of the Islamic Research Academy (p. 2). The cover gives his death as 1401 AH / 1981 CE (p. 1); this needs a second source. His book on work and wealth in Islam is the source for this card."
  fr: "Grand savant d'al-Azhar et ancien secrétaire général adjoint de l'Académie des recherches islamiques (p. 2). La couverture donne sa mort en 1401 H / 1981 ap. J.-C. (p. 1) ; cela demande une seconde source. Son livre sur le travail et la richesse en islam est la source de cette fiche."
  es: "Un destacado académico de Al-Azhar y antiguo subsecretario general de la Academia de Investigación Islámica (pág. 2). La portada indica que falleció en 1401 AH / 1981 d. C. (pág. 1); esto requiere una segunda fuente. Su libro sobre el trabajo y la riqueza en el Islam es la fuente de esta tarjeta."
  ur: "وہ الازہر کے سینئر اسکالر اور اسلامک ریسرچ اکیڈمی کے سابق اسسٹنٹ سیکرٹری جنرل ہیں ⁦(ص 2)⁩۔ سرورق ان کی وفات 1401ھ / 1981 عیسوی ⁦(ص 1)⁩ بتاتا ہے۔ یہ ایک دوسرے ذریعہ کی ضرورت ہے. اسلام میں کام اور دولت پر ان کی کتاب اس کارڈ کا ذریعہ ہے۔"
  tr: "El-Azhar Üniversitesi'nin önde gelen âlimlerinden ve İslam Araştırma Akademisi'nin eski Genel Sekreter Yardımcısıydı (bkz: min-qadaya-al-mal-wal-amal-azhar s. 2). Kitabın kapağına göre 1401 Hicri / 1981 Miladi yılında vefat etti (bkz: min-qadaya-al-mal-wal-amal-azhar s. 1). Eserleri arasında, bu girişin dayandığı, Akademi'nin bilimsel serisinin bir parçası olan \"İslam'da Emek ve Maliye Konuları Üzerine\" adlı kitap da bulunmaktadır. Ölüm tarihi daha fazla doğrulama gerektirmektedir."
  id: "Beliau adalah seorang cendekiawan terkemuka Universitas Al-Azhar dan mantan Asisten Sekretaris Akademi Penelitian Islam (lihat: min-qadaya-al-mal-wal-amal-azhar hlm. 2). Beliau wafat pada tahun 1401 H / 1981 M, menurut sampul buku tersebut (lihat: min-qadaya-al-mal-wal-amal-azhar hlm. 1). Di antara karyanya adalah \"Tentang Isu-isu Perburuhan dan Keuangan dalam Islam,\" bagian dari seri ilmiah Akademi, yang merupakan buku yang menjadi dasar entri ini. Tanggal kematiannya memerlukan verifikasi lebih lanjut."
