label: { ar: "الزجاج", en: "Al Zajjaj", fr: "Al Zajjaj", es: "Al Zajjaj", ur: "الزجاج" }
summary:
  ar: "أبو إسحاق إبراهيم بن السري الزجاج النحوي، أمره المغتضد بتفسير جامع النطق فعمله على غير نسخة مستعيرا كتب اللغة من ثعلب والسكري وكتبه بخط الترمذي الصغير فاستحسنه المغتضد وأمر له بثلاث مائة دينار ولم يخرج لما عمله نسخة إلا إلى خزانة المغتضد ووزيره ثم ظهر في نكبات السلطان متقطعا، وصار له منزلة عظيمة وجعل له رزق في الندماء والفقهاء والعلماء نحو ثلاث مائة دينار، وتوفي يوم الجمعة لإحدى عشرة ليلة بقيت من جمادى الآخرة سنة عشر وثلاث مائة {cite:fihrist-ibn-al-nadim p. 177-178}."
  en: "Grammarian (d. 311) whose Maani for al-Mu'tadid earned triple stipends {cite:fihrist-ibn-al-nadim}"
  fr: "Grammarian (mort en 311) dont le Maani pour al-Mu'tadid a gagné trois bourses {cite:fihrist-ibn-al-nadim}"
  es: "Gramático (m. 311) cuyo Maani para al-Mu'tadid le valió un estipendio triple {cite:fihrist-ibn-al-nadim}"
  ur: "گرائمرین ⁦(متوفی 311)⁩ جس کے معنی برائے المعتدد نے تین گنا وظیفہ حاصل کیا"
  tr: "Dilbilimci Ebu İshaq İbrahim ibn el-Sari el-Zajcaj, ona Cami'l-Nuttaq'ı yorumlamasını emretti, bu yüzden Ta'lab ve Sükkari'den dil kitapları ödünç alarak el-Tirmidhi el-Saghir'in el yazısıyla farklı bir kopya yaptı. Şair onu onayladı ve üç yüz dinar sipariş etti. Sadece bir nüshasını el-Muğtadik ve bakanının hazinesine gönderdi. Sonra sultanın felaketleri sırasında aralıklı olarak ortaya çıktı, büyük bir statü kazandı ve yoldaşları, hukukçuları ve alimleri arasında yaklaşık üç yüz dinar verildi. Cuma günü on bir gece boyunca öldü, üç yüz on yılda Cumada-el-Ahira'dan kaldı {atıf:Fihrist-ibn-al-Nadim s. 177-178}."
  id: "Abu Ishaq Ibrahim ibn al-Sari al-Zajjaj sang ahli tata bahasa memerintahkannya untuk menafsirkan Jami' al-Nuttaq, sehingga ia membuatnya dalam salinan lain, meminjam buku-buku bahasa dari Tha'lab dan Al-Sukkari dan menulisnya dengan tulisan tangan al-Tirmidhi al-Saghir. Sang penyair menyetujuinya dan memerintahkan tiga ratus dinar. Ia hanya mengirimkan satu salinan ke kas al-Mughtadiq dan menterinya. Ia kemudian muncul secara sporadis selama bencana sultan, mencapai status besar, dan diberikan sekitar tiga ratus dinar di antara para sahabat, ahli hukum, dan ulamanya. Ia meninggal pada hari Jumat selama sebelas malam, tinggal dari Jumada al-Akhirah pada tahun tiga ratus sepuluh {cite:fihrist-ibn-al-nadim hlm. 177-178}."
