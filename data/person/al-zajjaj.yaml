id: person/al-zajjaj
class: person
label: { ar: "الزجاج", en: "Al Zajjaj" }
summary:
  ar: "أبو إسحاق إبراهيم بن السري الزجاج النحوي، أمره المغتضد بتفسير جامع النطق فعمله على غير نسخة مستعيرا كتب اللغة من ثعلب والسكري وكتبه بخط الترمذي الصغير فاستحسنه المغتضد وأمر له بثلاث مائة دينار ولم يخرج لما عمله نسخة إلا إلى خزانة المغتضد ووزيره ثم ظهر في نكبات السلطان متقطعا، وصار له منزلة عظيمة وجعل له رزق في الندماء والفقهاء والعلماء نحو ثلاث مائة دينار، وتوفي يوم الجمعة لإحدى عشرة ليلة بقيت من جمادى الآخرة سنة عشر وثلاث مائة {cite:fihrist-ibn-al-nadim p. 177-178}."
  en: "Grammarian (d. 311) whose Maani for al-Mu'tadid earned triple stipends {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
