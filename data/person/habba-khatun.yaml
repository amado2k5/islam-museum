summary:
  ar: "بطاقة أولية لهبّة خاتون، شاعرة كشمير في القرن السادس عشر زوجة آخر سلاطينها المستقلين يوسف شاه جك؛ تذكرها معاجم الأعلام ولم تُراجع ترجمتها على الصفحة بعد."
  en: "Draft card for Habba Khatun, the sixteenth-century Kashmiri poetess and wife of its last independent sultan Yusuf Shah Chak; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Habba Khatun, la poetisa cachemir del siglo XVI y esposa de su último sultán independiente, Yusuf Shah Chak; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de candidature pour Habba Khatun, poétesse cachemirienne du XVIe siècle et épouse du dernier sultan indépendant du Cachemire, Yusuf Shah Chak; la notice biographique n'est pas encore cochée sur la page."
  ur: "سولہویں صدی کی کشمیری شاعرہ اور اس کے آخری آزاد سلطان یوسف شاہ چک کی اہلیہ حبہ خاتون کے لیے ڈرافٹ کارڈ؛ سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Ön kart Hiba Khatun, 16. yüzyıl Keşmirli şairi ve son bağımsız sultanı Yusuf Şah Jak'ın eşi; Önemli Sözlüklerde adı geçmektedir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Hiba Khatun, seorang penyair Kashmir abad ke-16 dan istri sultan merdeka terakhirnya, Yusuf Shah Jak; ia disebutkan dalam Kamus Terkenal dan terjemahannya belum diulas di halaman tersebut."
