summary:
  ar: "راشد الغنوشي (ولد سنة 1941)، سياسي ومفكر تونسي، شريك مؤسس لحركة النهضة وقائدها منذ سنة 1991؛ سُجن في عهدي بورقيبة وبن علي وعاش منفيا في لندن اثنين وعشرين عاما، ثم عاد بعد ثورة 2011 وصار رئيسا لمجلس نواب الشعب (2019–2021)، وهو مسجون في تونس منذ سنة 2023."
  en: "Rached Ghannouchi (born 1941) is a Tunisian politician and thinker, co-founder of the Ennahda Movement and its leader since 1991. Imprisoned under Bourguiba and Ben Ali and exiled in London for twenty-two years, he returned after the 2011 revolution, became Speaker of the Assembly of the Representatives of the People (2019–2021), and has been imprisoned in Tunisia since 2023."
  ur: "راشد الغنوشی (پیدائش 1941ء) تیونس کے سیاست دان اور مفکر ہیں، النہضہ تحریک کے شریک بانی اور 1991ء سے اس کے رہنما؛ بورقیبہ اور بن علی کے عہد میں قید رہے اور لندن میں بائیس سال جلاوطن رہے، پھر 2011ء کے انقلاب کے بعد واپس آئے، پارلیمنٹ کے اسپیکر بنے (2019ء–2021ء)، اور 2023ء سے تیونس میں قید ہیں۔"
