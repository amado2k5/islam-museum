summary:
  ar: "سياسي غيني (وُلد 1938) من بوكي، أكاديمي عاش عقودا معارضا لأنظمة غينيا المتعاقبة وخاض انتخابات 1993 و1998 ضد الرئيس لانسانا كونتي وسُجن وحُوكم، ثم انتُخب رئيسا سنة 2010 فصار أول رئيس منتخب بحرية في تاريخ غينيا (2010–2021)، وأعيد انتخابه 2015 و2020 بعد تعديل دستوري مدّد أهليته، حتى أطاح به انقلاب 5 سبتمبر 2021 بقيادة مامادي دومبوي."
  en: "Guinean politician (born 1938) from Boké, an academic who spent decades in opposition to Guinea's successive regimes, ran against President Lansana Conté in 1993 and 1998 and was imprisoned and tried, then was elected president in 2010 as the first freely elected president in Guinea's history (2010–2021); he was re-elected in 2015 and, after a constitutional reset of his term limits, in 2020, until the coup of 5 September 2021 led by Mamady Doumbouya overthrew him."
  ur: "گنی سیاست دان (پیدائش 1938ء)، بوکے سے؛ ماہرِ تعلیم جنھوں نے دہائیاں گنی کی یکے بعد دیگرے حکومتوں کی مخالفت میں گزاریں، 1993ء اور 1998ء میں صدر لانسانا کونتے کے خلاف انتخاب لڑا اور قید و مقدمہ بھگتا، پھر 2010ء میں صدر منتخب ہو کر گنی کی تاریخ کے پہلے آزادانہ منتخب صدر (2010ء–2021ء) بنے، حتیٰ کہ 5 ستمبر 2021ء کو مامادی دومبویا کی بغاوت نے انھیں ہٹا دیا۔"
