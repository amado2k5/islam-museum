summary:
  ar: "محمد فريد بك ⁦(١٨٦٧–١٩١٩م)⁩؛ رئيس الحزب الوطني في مصر وأحد نوابغها. ولد في القاهرة وتعلم في مدرستي الألسن والحقوق، وولي نيابة الاستئناف ثم احترف المحاماة، وانقطع إلى الخدمة العامة فصحب مصطفى كامل باشا في كثير من رحلاته إلى أوروبا، ولما توفي مصطفى كامل انتُخب رئيساً للحزب الوطني سنة ١٩٠٨م. وساح سياحات كثيرة مجاهداً في سبيل استقلال مصر إلى أن توفي في جنيف ونقل جثمانه إلى القاهرة، وقد أنفق كل ماله في سبيل أمته. له كتب منها «تاريخ الدولة العلية العثمانية» و«البهجة التوفيقية في تاريخ العائلة الخديوية» و«تاريخ الرومان» طُبع منه الجزء الأول {cite:al-aalam tarjama}."
  en: "Muhammad Farid (1867–1919 CE) — Mustafa Kamil's successor as leader of Egypt's National Party and historian of the Ottoman state {cite:al-aalam tarjama}."
  es: "Muhammad Farid (1867–1919 d. C.) — Sucesor de Mustafa Kamil como líder del Partido Nacional de Egipto e historiador del estado otomano {cite:al-aalam tarjama}."
  fr: "Muhammad Farid (1867–1919 CE) — Successeur de Mustafa Kamil à la tête du Parti national égyptien et historien de l'État ottoman {cite:al-aalam tarjama}."
  ur: "محمد فرید ⁦(1867-1919 عیسوی)⁩ - مصر کی نیشنل پارٹی کے رہنما اور عثمانی ریاست کے مورخ کے طور پر مصطفی کامل کے جانشین {حوالہ: العالم ترجمہ}۔"
  tr: "Muhammed Farid Bey (1867–1919); Mısır'daki Ulusal Parti'nin başkanı ve dahilerinden biri. Kahire'de doğdu, Al-Alsun ve Hukuk okullarında eğitim gördü, ardından temyiz savcısı olarak görev yaptı, ardından avukatlık yaptı. Kamu hizmetine kendini adadı, Mustafa Kamel Paşa'nın Avrupa gezilerinde ona eşlik etti. Mustafa Kamel öldüğünde, 1908'de Ulusal Parti başkanı seçildi. Mısır'ın bağımsızlığı için çok seyahat etti, Cenevre'de öldü ve cesedi Kahire'ye nakledildi, tüm servetini ülkesi için harcadı. 'Osmanlı Yüksek Devleti Tarihi', 'Khedivial Ailesi Tarihindeki İlahi Sevinç' ve 'Romalıların Tarihi' gibi kitaplar yazdı; bunların ilk bölümü {al-aalam tarjama} yayımlandı."
  id: "Muhammad Farid Bey (1867–1919 M); kepala Partai Nasional di Mesir dan salah satu jeniusnya. Ia lahir di Kairo dan belajar di sekolah Al-Alsun dan Hukum, kemudian menjabat sebagai jaksa banding, kemudian berpraktik hukum. Ia mendedikasikan dirinya untuk pelayanan publik, menemani Mustafa Kamel Pasha dalam banyak perjalanannya ke Eropa. Ketika Mustafa Kamel meninggal, ia terpilih sebagai presiden Partai Nasional pada tahun 1908. Ia banyak bepergian, berjuang untuk kemerdekaan Mesir hingga wafat di Jenewa, dan jenazahnya dipindahkan ke Kairo, menghabiskan seluruh kekayaannya untuk bangsanya. Ia menulis buku-buku termasuk 'Sejarah Negara Tinggi Ottoman,' 'Kegembiraan Ilahi dalam Sejarah Keluarga Khedivial,' dan 'Sejarah Romawi,' yang bagian pertamanya {cite:al-aalam tarjama} diterbitkan."
