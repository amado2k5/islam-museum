summary:
  ar: "محمد فريد بك (١٨٦٧–١٩١٩م)؛ رئيس الحزب الوطني في مصر وأحد نوابغها. ولد في القاهرة وتعلم في مدرستي الألسن والحقوق، وولي نيابة الاستئناف ثم احترف المحاماة، وانقطع إلى الخدمة العامة فصحب مصطفى كامل باشا في كثير من رحلاته إلى أوروبا، ولما توفي مصطفى كامل انتُخب رئيساً للحزب الوطني سنة ١٩٠٨م. وساح سياحات كثيرة مجاهداً في سبيل استقلال مصر إلى أن توفي في جنيف ونقل جثمانه إلى القاهرة، وقد أنفق كل ماله في سبيل أمته. له كتب منها «تاريخ الدولة العلية العثمانية» و«البهجة التوفيقية في تاريخ العائلة الخديوية» و«تاريخ الرومان» طُبع منه الجزء الأول {cite:al-aalam tarjama}."
  en: "Muhammad Farid (1867–1919 CE) — Mustafa Kamil's successor as leader of Egypt's National Party and historian of the Ottoman state {cite:al-aalam tarjama}."
