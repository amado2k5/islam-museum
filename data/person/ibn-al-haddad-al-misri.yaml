summary:
  ar: "القاضي أبو بكر ابن الحداد المصري، صاحب «الفروع»، مات سنة خمس وأربعين وثلاثمائة، وكان فقيهاً مدققاً، وفروعه تدل على فضله {cite:tabaqat-fuqaha-abbas-1981 p. 60}. يذكر الحاشية أن اسمه محمد بن أحمد بن محمد بن جعفر، نقلاً عن السبكي وابن خلكان {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  tr: "'Furu'nun yazarı Yargıç Ebu Bekir İbn el-Haddad el-Masri, 345 Hicri yılında vefat etmiştir. Titiz bir hukukçuydu ve dalları erdemini göstermektedir {atıf:tabaqat-fuqaha-abbas-1981 s. 60}. Dipnotta adının Muhammed ibn Ahmed ibn Muhammed ibn Cafer olduğu belirtilir; al-Subki ve İbn Hallikan'dan alıntı yapılır {cite:tabaqat-fuqaha-abbas-1981 s. 60}."
  id: "Hakim Abu Bakr Ibn al-Haddad al-Masri, penulis 'Furu', meninggal pada tahun 345 H. Ia adalah seorang ahli hukum yang teliti, dan cabang-cabangnya menunjukkan kebajikan {cite:tabaqat-fuqaha-abbas-1981 hlm. 60}. Catatan kaki menyebutkan bahwa namanya adalah Muhammad ibn Ahmad ibn Muhammad ibn Ja'far, mengutip al-Subki dan Ibn Khallikan {cite:tabaqat-fuqaha-abbas-1981 hlm. 60}."
