summary:
  ar: "مؤرخ وشاعر وسياسي بوسني من نيفيسيني، يُلقّب بأبي النهضة البوسنية؛ شارك في تأسيس مجلة «بهار» (1900) وجمعية «غيرت» (1903)، وترأّس البرلمان البوسني سنة 1910، وجمع نحو 700 ترجمة لبوسنيين في الأدب الإسلامي، ومجموعته المخطوطة مسجّلة في سجل ذاكرة العالم لليونسكو."
  en: "Bosnian historian, poet and politician from Nevesinje, called the father of the Bosnian Renaissance: co-founder of the journal Behar (1900) and the Gajret society (1903), president of the Bosnian Diet (1910), compiler of some 700 biographies of Bosnians in Islamic literature, and collector of the manuscript library inscribed on UNESCO's Memory of the World register."
  ur: "نیویسینیے سے تعلق رکھنے والے بوسنیائی مؤرخ، شاعر اور سیاست دان، جنھیں بوسنیائی نشاۃِ ثانیہ کا بانی کہا جاتا ہے: مجلہ «بہار» (1900ء) اور انجمن «غیرت» (1903ء) کے شریک بانی، 1910ء میں بوسنیائی پارلیمان کے صدر، اسلامی ادب میں بوسنیائیوں کی تقریباً 700 سوانح کے مرتب، اور اس مخطوطہ کتب خانے کے جامع جو یونیسکو کے عالمی یادگار رجسٹر میں درج ہے۔"
