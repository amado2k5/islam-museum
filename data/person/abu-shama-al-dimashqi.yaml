label: { ar: "أبو شامة الدمشقي", en: "Abu Shama al-Dimashqi", fr: "Abu Shama al-Dimashqi", es: "Abu Shama al-Dimashqi", ur: "ابو شمع الدمشقی" }
summary:
  ar: "الشيخ الإمام شهاب الدين عبد الرحمن بن إسماعيل المعروف بأبي شامة الدمشقي المتوفى سنة ٦٦٥هـ؛ صاحب أزهار الروضتين في أخبار الدولتين دولة نور الدين وصلاح الدين من الأكراد {cite:kashf-zunun-furqan p. 372-373}. ولد سنة تسع وتسعين وخمسمائة في أحد ربيعيها بدمشق وسُمّي بأبي شامة لشامة كبيرة كانت فوق حاجبه الأيسر، وختم القرآن وله دون عشر سنين وأتقن فن القراءة على السخاوي وله ست عشرة سنة، وسمع الكثير حتى عد في الحفاظ وسمع من الموفق وطائفة وأخذ عن الشيخ عز الدين بن عبد السلام؛ وولي مشيخة القراءة بالتربة الأشرفية ومشيخة الحديث بالدار الأشرفية، ومن تصانيفه شرح الشاطبية ومختصرا تاريخ دمشق أحدهما في خمسة عشر مجلداً {cite:shadharat-dhahab p. 552-553}."
  en: "Shihab al-Din Abd al-Rahman ibn Isma'il, known as Abu Shama al-Dimashqi, d. AH 665 — author of Azhar al-Rawdatayn, the chronicle of Nur al-Din's and Salah al-Din's states {cite:kashf-zunun-furqan p. 372-373}."
  fr: "Shihab al-Din Abd al-Rahman ibn Isma'il, connu sous le nom d'Abu Shama al-Dimashqi, mort en 665 H ; auteur d'Azhar al-Rawdatayn, chronique des États de Nur al-Din et de Salah al-Din {cite:kashf-zunun-furqan p. 372-373}."
  es: "Shihab al-Din Abd al-Rahman ibn Isma'il, conocido como Abu Shama al-Dimashqi, m. 665 AH - autor de Azhar al-Rawdatayn, la crónica de los estados de Nur al-Din y Salah al-Din {citar:kashf-zunun-furqan p. 372-373}."
  ur: "شہاب الدین عبد الرحمن بن اسماعیل المعروف ابو شمع الدمشقی، وفات۔ 665ھ - ازہر الرؤدتین کے مصنف، نورالدین اور صلاح الدین کی ریاستوں کی تاریخ۔ 372-373}۔"
  tr: "Şeyh İmam Şihab el-Din Abdülrahman ibn İsmail, Ebu Şama el-Dimaşki olarak da bilinir, Hicri 665 yılında vefat etmiştir; Azhar el-Ravdatayn fi Akhbar el-Davlatayn, Nur el-Din ve Salah el-Din'in Kürtlerden Devleti adlı eserlerin yazarıdır {kaynak:kashf-zunun-furqan s. 372-373}. Hicri 599 yılında Şam'daki bir pınarda doğmuş ve sol kaşının üzerinde büyük bir ben olduğu için Ebu Şama olarak anılmıştır. On yaşından önce Kur'an'ı ezberlemiş ve on altı yaşında el-Sakhawi'nin yanında tilavet sanatında ustalaşmıştır. Çok şey öğrenmiş, ezberciler arasında sayılmış ve el-Muvaffaq ve bir grup insandan öğrenmiş, ayrıca Şeyh İzz el-Din ibn Abdül-Salam'dan da ders almıştır. Aynı zamanda Aşrafiyye Türbesi'nde Kur'an Şeyhi ve Aşrafiyye Evi'nde Hadis Şeyhi görevlerini üstlenmiştir. Eserleri arasında el-Şatibiyye üzerine bir tefsir ve Şam Tarihi'nin iki kısaltılmış versiyonu bulunmaktadır; bunlardan biri on beş cilttir {kaynak:şadharat-dhahab s. 552-553}."
  id: "Syekh Imam Shihab al-Din Abd al-Rahman ibn Ismail, yang dikenal sebagai Abu Shama al-Dimashqi, wafat pada tahun 665 H; penulis kitab Azhar al-Rawdatayn fi Akhbar al-Dawlatayn, keadaan Nur al-Din dan Salah al-Din, dari Kurdi {kutip:kashf-zunun-furqan hlm. 372-373}. Beliau lahir pada tahun 599 H di salah satu mata air di Damaskus dan dipanggil Abu Shama karena tahi lalat besar di atas alis kirinya. Beliau menghafal Al-Qur'an sebelum berusia sepuluh tahun dan menguasai seni tilawah di bawah bimbingan al-Sakhawi ketika berusia enam belas tahun. Beliau banyak belajar hingga termasuk di antara para penghafal dan belajar dari al-Muwaffaq dan sekelompoknya serta belajar dari Syekh Izz al-Din ibn Abd al-Salam; dan beliau memegang jabatan sebagai Syekh Thalib di Ashrafiyya Turba dan Syekh Hadits di Ashrafiyya House. Di antara karya-karyanya adalah sebuah komentar atas al-Shatibiyya dan dua versi ringkas dari Sejarah Damaskus, salah satunya terdiri dari lima belas jilid {cite:shadharat-dhahab p. 552-553}."
