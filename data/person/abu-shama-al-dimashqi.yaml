id: person/abu-shama-al-dimashqi
class: person
label: { ar: "أبو شامة الدمشقي" }
summary:
  ar: "الشيخ الإمام شهاب الدين عبد الرحمن بن إسماعيل المعروف بأبي شامة الدمشقي المتوفى سنة ٦٦٥هـ؛ صاحب أزهار الروضتين في أخبار الدولتين دولة نور الدين وصلاح الدين من الأكراد {cite:kashf-zunun-furqan p. 372-373}. ولد سنة تسع وتسعين وخمسمائة في أحد ربيعيها بدمشق وسُمّي بأبي شامة لشامة كبيرة كانت فوق حاجبه الأيسر، وختم القرآن وله دون عشر سنين وأتقن فن القراءة على السخاوي وله ست عشرة سنة، وسمع الكثير حتى عد في الحفاظ وسمع من الموفق وطائفة وأخذ عن الشيخ عز الدين بن عبد السلام؛ وولي مشيخة القراءة بالتربة الأشرفية ومشيخة الحديث بالدار الأشرفية، ومن تصانيفه شرح الشاطبية ومختصرا تاريخ دمشق أحدهما في خمسة عشر مجلداً {cite:shadharat-dhahab p. 552-553}."
  en: "Shihab al-Din Abd al-Rahman ibn Isma'il, known as Abu Shama al-Dimashqi, d. AH 665 — author of Azhar al-Rawdatayn, the chronicle of Nur al-Din's and Salah al-Din's states {cite:kashf-zunun-furqan p. 372-373}."
