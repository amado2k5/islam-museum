summary:
  ar: "الملا محيي الدين محمد بن إبراهيم الرومي الحنفي الشهير بابن الخطيب، من مشاهير موالي الروم؛ قرأ على والده الملا تاج الدين وعلى العلامة علي الطوسي والملا خضر بك، وتولى المناصب وترقى فيها حتى جعله السلطان محمد بن عثمان معلماً لنفسه، وألّف حواشي على شرح التجريد للسيد الشريف وحواشي على حاشية الكشاف للسيد أيضاً وغير ذلك، توفي سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 425}."
  en: "Of the famous Rum mawali — his father Molla Taj al-Din, his teachers 'Ali al-Tusi and Khidr Beg; rose through the offices until Mehmed II made him his own tutor; hashiyas on al-Sayyid al-Sharif's Sharh al-Tajrid and on his gloss on the Kashshaf; d. 901 {cite:shadharat-dhahab p. 425}."
  es: "Del famoso Rum mawali: su padre Molla Taj al-Din, sus maestros 'Ali al-Tusi y Khidr Beg; ascendió por los cargos hasta que Mehmed II lo convirtió en su propio tutor; hashiyas sobre el Sharh al-Tajrid de al-Sayyid al-Sharif y su glosa sobre el Kashshaf; d. 901 {cita: shadharat-dhahab p. 425}."
  fr: "Du célèbre Rum mawali — son père Molla Taj al-Din, ses professeurs 'Ali al-Tusi et Khidr Beg; gravit les échelons jusqu'à ce que Mehmed II en fasse son propre tuteur; des hashiyas sur le Sharh al-Tajrid d'al-Sayyid al-Sharif et sur sa glose sur le Kashshaf; d. 901 {cite: shadharat-dhahab p. 425}."
  ur: "مشہور رم موالی میں سے - ان کے والد مولا تاج الدین، ان کے اساتذہ علی الطوسی اور خضر بیگ؛ دفاتر سے گزرتے ہوئے یہاں تک کہ محمد دوم نے اسے اپنا ٹیوٹر بنا لیا۔ السید الشریف کی شرح التجرید پر اور کشف پر ان کی چمک پر حاشیہ؛ d 901 {حوالہ: شدھارت ذہاب ص۔ 425}۔"
  tr: "Molla Muhyiddin Muhammed bin İbrahim el-Rumi el-Hanafi, İbn el-Hatib olarak bilinir, Romalıların önde gelen özgür adamlarından biriydi. Babası Mulla Taceddin, âlim Ali el-Tusi ve Molla Hidr Bey'in yanında eğitim aldı, görevlerde bulundu ve bu görevlerde yükseldi, ta ki Sultan Muhammed bin Osman onu öğretmeni olarak atayana kadar. Seyyid el-Şerif'in El-Tacrid şerhi üzerine kenar notları, el-Seyyid'in el-Kaşşaf tefhibi üzerine kenar notları ve diğerlerini yazdı. 9101 yılında vefat etti {kaynak: şadharat-dhahab, s. 425}."
  id: "Mulla Muhyiddin Muhammad ibn Ibrahim al-Rumi al-Hanafi, yang dikenal sebagai Ibn al-Khatib, adalah salah satu mantan orang Romawi yang terkemuka. Ia belajar di bawah bimbingan ayahnya Mulla Taj al-Din, ulama Ali al-Tusi, dan Mulla Khidr Bey, memegang jabatan dan naik pangkat hingga Sultan Muhammad ibn Uthman mengangkatnya sebagai gurunya. Ia menulis catatan pinggir atas komentar Al-Tajrid oleh Sayyid al-Sharif, catatan pinggir tentang komentar al-Kashshaf oleh al-Sayyid juga, dan lainnya. Ia meninggal pada tahun 9101 {kutip: shadharat-dhahab, hlm. 425}."
