summary:
  ar: "الملا محيي الدين محمد بن إبراهيم الرومي الحنفي الشهير بابن الخطيب، من مشاهير موالي الروم؛ قرأ على والده الملا تاج الدين وعلى العلامة علي الطوسي والملا خضر بك، وتولى المناصب وترقى فيها حتى جعله السلطان محمد بن عثمان معلماً لنفسه، وألّف حواشي على شرح التجريد للسيد الشريف وحواشي على حاشية الكشاف للسيد أيضاً وغير ذلك، توفي سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 425}."
  en: "Of the famous Rum mawali — his father Molla Taj al-Din, his teachers 'Ali al-Tusi and Khidr Beg; rose through the offices until Mehmed II made him his own tutor; hashiyas on al-Sayyid al-Sharif's Sharh al-Tajrid and on his gloss on the Kashshaf; d. 901 {cite:shadharat-dhahab p. 425}."
