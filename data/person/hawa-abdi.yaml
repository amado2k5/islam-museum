summary:
  ar: "طبيبة صومالية ومدافعة عن حقوق الإنسان (17 مايو 1947 – 5 أغسطس 2020)، من أوائل طبيبات النساء والتوليد في الصومال، وحاصلة أيضًا على شهادة في القانون. أسّست سنة 1983 عيادة صغيرة على أرض أسرتها صارت مستشفى من 400 سرير ومركز مجمّع يأوي النازحين؛ وفي ذروة جفاف 2011 آوى مخيم مؤسستها نحو 90 ألف شخص. واجهت حصار الميليشيات المسلحة ورفضت إغلاق مجمّعها، ورُشّحت لجائزة نوبل للسلام سنة 2012، وتوفيت في مقديشو سنة 2020. تُعرف بلقب ماما حوا."
  en: "Somali physician and human rights activist (17 May 1947 – 5 August 2020), one of Somalia's first female obstetricians and gynaecologists, who also earned a law degree. In 1983 she founded a one-room clinic on family land that grew into a 400-bed hospital and a compound sheltering the displaced; at the height of the 2011 drought her foundation's camp housed some 90,000 people. She faced down armed militants who besieged the compound and refused to close it, was nominated for the Nobel Peace Prize in 2012, and died in Mogadishu in 2020. She was known as Mama Hawa."
  ur: "صومالی طبیبہ اور انسانی حقوق کی وکیل (17 مئی 1947ء – 5 اگست 2020ء)، صومالیہ کی پہلی خواتین ماہرینِ امراضِ نسواں میں سے ایک، جنھوں نے قانون کی ڈگری بھی حاصل کی۔ 1983ء میں انھوں نے خاندانی زمین پر ایک کمرے کا کلینک قائم کیا جو 400 بستروں کے اسپتال اور بے گھر افراد کی پناہ گاہ میں بدل گیا؛ 2011ء کی قحط سالی میں ان کی فاؤنڈیشن کے کیمپ میں تقریباً 90,000 افراد مقیم تھے۔ انھوں نے مسلح عسکریت پسندوں کے محاصرے کا مقابلہ کیا اور کمپاؤنڈ بند کرنے سے انکار کیا، 2012ء میں نوبل امن انعام کے لیے نامزد ہوئیں، اور 2020ء میں موغادیشو میں انتقال کیا۔ وہ ماما حوا کے نام سے معروف تھیں۔"
