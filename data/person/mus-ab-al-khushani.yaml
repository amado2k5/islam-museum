summary:
  ar: "أبو ذر الخشني مصعب بن محمد بن مسعود الجياني النحوي اللغوي الفقيه المالكي، ويعرف أيضاً بابن أبي ركب؛ صاحب التصانيف وحامل لواء العربية بالأندلس، ولي خطابة إشبيلية مدة ثم قضاء جيان ثم تحول إلى فاس وبعد صيته وسارت الركبان بتصانيفه؛ توفي بفاس سنة أربع وستمائة وله سبعون سنة {cite:shadharat-dhahab p. 22}. وأخذ عن عبد الحق الإشبيلي ببجاية {cite:mawsuat-a3lam-ulama-adaba}."
  en: "Abu Dharr al-Khushani Mus'ab b. Muhammad b. Mas'ud al-Jiyani, grammarian, philologist and Maliki jurist, also known as Ibn Abi Rakab; author and bearer of Arabic's banner in al-Andalus — Seville's khatib, then qadi of Jaen, finally Fez where his works travelled with the caravans; he died at Fez in 604 aged seventy {cite:shadharat-dhahab p. 22}. He studied under Abd al-Haqq al-Ishbili at Bejaia {cite:mawsuat-a3lam-ulama-adaba}."
