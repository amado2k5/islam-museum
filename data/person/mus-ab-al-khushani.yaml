summary:
  ar: "أبو ذر الخشني مصعب بن محمد بن مسعود الجياني النحوي اللغوي الفقيه المالكي، ويعرف أيضاً بابن أبي ركب؛ صاحب التصانيف وحامل لواء العربية بالأندلس، ولي خطابة إشبيلية مدة ثم قضاء جيان ثم تحول إلى فاس وبعد صيته وسارت الركبان بتصانيفه؛ توفي بفاس سنة أربع وستمائة وله سبعون سنة {cite:shadharat-dhahab p. 22}. وأخذ عن عبد الحق الإشبيلي ببجاية {cite:mawsuat-a3lam-ulama-adaba}."
  en: "Abu Dharr al-Khushani Mus'ab b. Muhammad b. Mas'ud al-Jiyani, grammarian, philologist and Maliki jurist, also known as Ibn Abi Rakab; author and bearer of Arabic's banner in al-Andalus — Seville's khatib, then qadi of Jaen, finally Fez where his works travelled with the caravans; he died at Fez in 604 aged seventy {cite:shadharat-dhahab p. 22}. He studied under Abd al-Haqq al-Ishbili at Bejaia {cite:mawsuat-a3lam-ulama-adaba}."
  es: "Abu Dharr al-Khushani Mus'ab b. Muhammad b. Mas'ud al-Jiyani, gramático, filólogo y jurista malikí, también conocido como Ibn Abi Rakab; autor y portador del estandarte árabe en al-Ándalus: khatib de Sevilla, luego cadí de Jaén, y finalmente Fez, donde sus obras viajaron con las caravanas; murió en Fez en 604 a la edad de setenta años {cite:shadharat-dhahab p. 22}. Estudió con Abd al-Haqq al-Ishbili en Bejaia {cite:mawsuat-a3lam-ulama-adaba}."
  fr: "Abu Dharr al-Khushani Mus'ab b. Muhammad b. Mas'ud al-Jiyani, grammairien, philologue et juriste malikite, également connu sous le nom d'Ibn Abi Rakab, fut un auteur et un fervent défenseur de la langue arabe en al-Andalus. Il fut successivement cadi de Séville, de Jaén, puis de Fès, où ses œuvres circulèrent avec les caravanes. Il mourut à Fès en 604, à l'âge de soixante-dix ans (cf. shadharat-dhahab, p. 22). Il étudia auprès d'Abd al-Haqq al-Ishbili à Béjaïa (cf. mawsuat-a3lam-ulama-adaba)."
  ur: "ابو ذر خشنی مصعب بن۔ محمد بی مسعود الجیانی، گرامر، ماہر فلسفی اور مالکی فقیہ، جسے ابن ابی رکاب بھی کہا جاتا ہے؛ الاندلس میں عربی کے جھنڈے کا مصنف اور علمبردار — سیویل کا خطیب، پھر جین کا قاضی، آخر میں فیز جہاں اس کی تخلیقات قافلوں کے ساتھ سفر کرتی تھیں۔ آپ کا انتقال 604 میں 70 سال کی عمر میں فیض میں ہوا۔ 22}۔ انہوں نے عبدالحق الاشبیلی کے تحت بیجایہ میں تعلیم حاصل کی۔"
  tr: "Ebu Dharr el-Haşni Mus'ab ibn Muhammed ibn Mes'ud el-Jiyani, dilbilgici, dilbilimci ve Malikli hukukçuydu; aynı zamanda İbn Ebi Rukab olarak da bilinir; eserlerin yazarı ve Endülüs'te Arapça'nın bayrak taşıyıcısıydı. Bir süre Sevilla'da hatip olarak görev yaptı, ardından Giyan yargıcı olarak görev yaptı, ardından Fez'e taşındı. Rukban halkı arasında ün ve popülerliğinin ardından eserleriyle birlikte vefat etti. 604 Hicri yılında, yetmiş yaşında Fes'te öldü {atıf:shadharat-dhahab, s. 22}. Bejaia'da Abd al-Haq al-Ishbili'nin yanında eğitim aldı {atıf:mawsuat-a3lam-ulama-adaba}."
  id: "Abu Dharr al-Khashni Mus'ab ibn Muhammad ibn Mas'ud al-Jiyani adalah seorang ahli tata bahasa, ahli bahasa, dan ahli hukum Maliki, juga dikenal sebagai Ibn Abi Rukab; penulis karya dan pembawa panji bahasa Arab di al-Andalus. Ia pernah menjadi orator di Sevilla, kemudian sebagai hakim Giyan, kemudian pindah ke Fez. Setelah ketenaran dan popularitasnya di kalangan masyarakat Rukban, ia meninggal dunia bersama karya-karyanya. Ia meninggal di Fez pada tahun 604 H pada usia tujuh puluh {cite:shadharat-dhahab, hlm. 22}. Ia belajar di bawah bimbingan Abd al-Haq al-Ishbili di Bejaia {cite:mawsuat-a3lam-ulama-adaba}."
