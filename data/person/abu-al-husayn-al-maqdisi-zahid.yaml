summary:
  ar: "أبو الحسين المقدسي الزاهد صاحب الأحوال والكرامات؛ دوّن الشيخ الضياء سيرته في جزء، وقبره بحلب يزار؛ ترجمته في أخبار سنة ثمان وأربعين وخمسمائة {cite:shadharat-dhahab p. 632}."
  en: "Abu al-Husayn al-Maqdisi the ascetic, a man of spiritual states and marvels; al-Shaykh al-Diya' wrote his biography in a juz'; his grave at Aleppo is visited; his notice falls in year 548 {cite:shadharat-dhahab p. 632}."
  fr: "Abu al-Husayn al-Maqdisi l'ascète, homme d'états spirituels et de prodiges ; al-Shaykh al-Diya' écrivit sa biographie en un juz' ; on visite sa tombe à Alep ; sa notice figure à l'année 548 {cite:shadharat-dhahab p. 632}."
  es: "Abu al-Husayn al-Maqdisi, el asceta, un hombre de estados espirituales y maravillas; al-Shaykh al-Diya' escribió su biografía en un juz'; su tumba en Alepo es visitada; su mención se produce en el año 548 {cite:shadharat-dhahab p. 632}."
  ur: "ابو الحسین المقدسی سنیاسی، روحانی کیفیتوں اور کمالات کا آدمی؛ الشیخ الدیہ نے اپنی سوانح عمری ایک جزء میں لکھی ہے۔ حلب میں اس کی قبر کی زیارت کی جاتی ہے۔ اس کا نوٹس 548 میں آتا ہے۔ 632}۔"
  tr: "Ebu el-Hüseyin el-Makdisi, zühd sahibi, manevi hallere ve mucizelere sahip; Şeyh el-Diya' onun biyografisinin bir bölümünü kaydetmiş ve Halep'teki kabri ziyaret edilmiştir; biyografisi Hicri 548 yılı haberlerinde yer almaktadır {kaynak: Şadharat-Dhaba s. 632}."
  id: "Abu al-Husayn al-Maqdisi, seorang pertapa, pemilik keadaan spiritual dan mukjizat; Syekh al-Diya’ mencatat biografinya dalam sebuah bagian, dan makamnya di Aleppo dikunjungi; biografinya menjadi berita pada tahun 548 H {kutip:shadharat-dhahab hlm. 632}."
