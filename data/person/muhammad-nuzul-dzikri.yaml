summary:
  ar: "داعية إندونيسي من جاكرتا، وُلد سنة 1983 وتخرّج في معهد العلوم الإسلامية والعربية ⁦(ليبيا)⁩ سنة 2009. عُرف بدروسه المنتظمة في مسجد نور الإيمان ببلوك إم في جاكرتا ودروسه عبر الإنترنت في كتب التراث، وبلغت قناته على يوتيوب 913,000 مشترك و133,772,560 مشاهدة و5,582 مقطعًا بحسب vidIQ كما في 13 نوفمبر 2026."
  en: "Indonesian preacher from Jakarta, born in 1983 and a 2009 graduate of the Institute of Islamic and Arabic Sciences (LIPIA). He is known for his regular study sessions at the Nurul Iman Mosque, Blok M Square, Jakarta, and his online lessons on classical works; his YouTube channel counted 913,000 subscribers, 133,772,560 views and 5,582 videos as read by vidIQ on 13 November 2026."
  ur: "جکارتہ سے تعلق رکھنے والے انڈونیشی مبلغ، جو 1983ء میں پیدا ہوئے اور 2009ء میں انسٹی ٹیوٹ آف اسلامک اینڈ عربک سائنسز (LIPIA) سے فارغ التحصیل ہوئے۔ وہ جکارتہ کے بلاک ایم اسکوائر کی مسجد نور الایمان میں اپنے باقاعدہ دروس اور کلاسیکی کتب پر آن لائن اسباق کے لیے جانے جاتے ہیں؛ 13 نومبر 2026ء کی vidIQ قرأت کے مطابق ان کے یوٹیوب چینل کے سبسکرائبر 913,000، ویوز 133,772,560 اور ویڈیوز 5,582 تھیں۔"
  es: "Predicador indonesio originario de Yakarta, nacido en 1983 y graduado en 2009 del Instituto de Ciencias Islámicas y Árabes (LIPIA). Es conocido por sus sesiones de estudio regulares en la Mezquita Nurul Iman, en la Plaza Blok M de Yakarta, y por sus lecciones en línea sobre obras clásicas. Su canal de YouTube contaba con 913 000 suscriptores, 133 772 560 visualizaciones y 5582 vídeos, según datos de vidIQ del 13 de noviembre de 2026."
  fr: "Prédicateur indonésien originaire de Jakarta, né en 1983 et diplômé en 2009 de l'Institut des sciences islamiques et arabes (LIPIA). Il est connu pour ses séances d'étude régulières à la mosquée Nurul Iman, place Blok M, à Jakarta, et pour ses cours en ligne sur les œuvres classiques. Sa chaîne YouTube comptait 913 000 abonnés, 133 772 560 vues et 5 582 vidéos, selon les données de vidIQ au 13 novembre 2026."
  tr: "1983 doğumlu Endonezyalı bir vaiz olan Jakarta, 2009 yılında Libya İslam ve Arap Bilimleri Enstitüsü'nden mezun olmuştur. Jakarta, Block MV'deki Noor Al-İman Camii'nde düzenli dersleri ve kültürel miras kitapları üzerine çevrimiçi dersleriyle tanınmaktadır. YouTube kanalının vidIQ'ya göre 13 Kasım 2026 itibarıyla 913.000 abonesi, 133.772.560 görüntülenmesi ve 5.582 klipi vardı."
  id: "Seorang pengkhotbah Indonesia dari Jakarta, lahir pada tahun 1983, ia lulus dari Institut Ilmu Islam dan Ilmu Arab (Libya) pada tahun 2009. Ia dikenal karena pelajaran rutinnya di Masjid Noor Al-Iman di Block MV, Jakarta, dan pelajaran daringnya tentang buku warisan. Saluran YouTube-nya memiliki 913.000 pelanggan, 133.772.560 penayangan, dan 5.582 klip menurut vidIQ per 13 November 2026."
