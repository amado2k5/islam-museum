summary:
  ar: "مروان الأصفر أبو خلف البصري، يقال مروان بن خاقان، وقيل إنهما اثنان، روى عن أنس بن مالك وعامر الشعبي وعبد الله بن عمر ومسروق وأبي هريرة وغيرهم، وعنه جعفر بن برقان وحرب بن ثابت والحسن بن ذكوان، روى له البخاري ومسلم وأبو داود والترمذي، وقال أبو داود إنه ثقة، وذكره ابن حبان في الثقات. (؟-؟). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  en: "Marwan al-Asfar, Abu Khalaf of Basra; some say his name was Marwan ibn Khaqan, and some say there were two men. He narrated from Anas ibn Malik, Amir al-Sha'bi, Abd Allah ibn Umar, Masruq and Abu Hurayra; Ja'far ibn Burqan and Harb ibn Thabit narrated from him. Al-Bukhari, Muslim, Abu Dawud and al-Tirmidhi record him. Abu Dawud called him reliable. Dates not given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
