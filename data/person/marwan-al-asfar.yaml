summary:
  ar: "مروان الأصفر أبو خلف البصري، يقال مروان بن خاقان، وقيل إنهما اثنان، روى عن أنس بن مالك وعامر الشعبي وعبد الله بن عمر ومسروق وأبي هريرة وغيرهم، وعنه جعفر بن برقان وحرب بن ثابت والحسن بن ذكوان، روى له البخاري ومسلم وأبو داود والترمذي، وقال أبو داود إنه ثقة، وذكره ابن حبان في الثقات. ⁦(؟-؟)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  en: "Marwan al-Asfar, Abu Khalaf of Basra; some say his name was Marwan ibn Khaqan, and some say there were two men. He narrated from Anas ibn Malik, Amir al-Sha'bi, Abd Allah ibn Umar, Masruq and Abu Hurayra; Ja'far ibn Burqan and Harb ibn Thabit narrated from him. Al-Bukhari, Muslim, Abu Dawud and al-Tirmidhi record him. Abu Dawud called him reliable. Dates not given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  es: "Marwan al-Asfar, Abu Khalaf de Basora; algunos dicen que se llamaba Marwan ibn Khaqan y otros dicen que eran dos hombres. Narró de Anas ibn Malik, Amir al-Sha'bi, Abd Allah ibn Umar, Masruq y Abu Hurayra; Ja'far ibn Burqan y Harb ibn Thabit narraron de él. Al-Bukhari, Muslim, Abu Dawud y al-Tirmidhi lo registran. Abu Dawud lo llamó confiable. Fechas no dadas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  fr: "Marwan al-Asfar, Abu Khalaf de Bassorah; certains disent qu'il s'appelait Marwan ibn Khaqan, et certains disent qu'il y avait deux hommes. Il a rapporté d'Anas ibn Malik, Amir al-Sha'bi, Abd Allah ibn Umar, Masruq et Abu Hurayra; Ja'far ibn Burqan et Harb ibn Thabit ont rapporté de lui. Al-Bukhari, Muslim, Abu Dawud et al-Tirmidhi l'enregistrent. Abu Dawud l'a qualifié de fiable. Dates non communiquées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  ur: "مروان الاسفار، ابو خلف بصرہ؛ بعض کہتے ہیں کہ اس کا نام مروان بن خاقان تھا اور بعض کہتے ہیں کہ دو آدمی تھے۔ انہوں نے انس بن مالک، امیر الشعبی، عبداللہ بن عمر، مسروق اور ابو ہریرہ سے روایت کی ہے۔ ان سے جعفر بن برقان اور حرب بن ثابت نے روایت کی ہے۔ البخاری، مسلم، ابوداؤد اور ترمذی نے اسے درج کیا ہے۔ ابوداؤد نے اسے معتبر کہا ہے۔ تاریخیں نہیں دی گئیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص13367}"
  tr: "Marwan al-Asfar Abu Khalaf al-Basri, also called Marwan ibn Khaqan, and it is said that they are two. He narrated from Anas ibn Malik, Amir al-Sha'bi, Abdullah ibn Umar, Masruq, Abu Huraira, and others. From him were Ja'far ibn Barqan, Harb ibn Thabit, and al-Hasan ibn Dhakwan. He was narrated by al-Bukhari, Muslim, Abu Dawood, and al-Tirmidhi. Abu Dawood said he is trustworthy, and Ibn Hibban mentioned him among the trustworthy. [eos](?-?) [eos]⁩. [eos]{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
  id: "Marwan al-Asfar Abu Khalaf al-Basri, also called Marwan ibn Khaqan, and it is said that they are two. He narrated from Anas ibn Malik, Amir al-Sha'bi, Abdullah ibn Umar, Masruq, Abu Huraira, and others. From him were Ja'far ibn Barqan, Harb ibn Thabit, and al-Hasan ibn Dhakwan. He was narrated by al-Bukhari, Muslim, Abu Dawood, and al-Tirmidhi. Abu Dawood said he is trustworthy, and Ibn Hibban mentioned him among the trustworthy. [eos](?-?) [eos]⁩. [eos]{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13367}"
