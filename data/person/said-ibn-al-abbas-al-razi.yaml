summary:
  ar: "أبو عثمان سعيد بن العباس الرازي، صوفي من أهل الري، راسخ في علم الأصول، جافٍ عن الخوض في الفضول، ينصح المريدين ويقمع المخالفين، وتروي عنه «حلية الأولياء» وصية في الحذر من شياطين الإنس والجن ومن الدنيا، وفي فضل العلماء ورثة الأنبياء."
  en: "Abu Uthman Sa'id ibn al-Abbas al-Razi, a Sufi of Rayy, firm in the principles of religion and averse to idle disputation, who advised disciples and checked opponents; Hilyat al-Awliya relates his admonition against the devils of humankind and of jinn and against the world, and on the scholars as heirs of the prophets."
  ur: "ابو عثمان سعید بن عباس رازی ری کے صوفی تھے، اصولِ دین میں راسخ، فضول بحث سے دور، مریدوں کو نصیحت کرنے والے اور مخالفین کو روکنے والے۔ «حلیۃ الاولیاء» میں ان کی وصیت ہے کہ انس و جن کے شیطانوں اور دنیا سے بچو، اور علما انبیاء کے وارث ہیں۔"
