id: person/al-mustansir-fatimid
class: person
label:
  ar: المستنصر بالله معد بن الظاهر
  en: al-Mustansir bi'llah Ma'add ibn al-Zahir
  fr: "al-Mustansir bi'llah Ma'add ibn al-Zahir"
  es: "al-Mustansir bi'llah Ma'add ibn al-Zahir"
  ur: "المستنصر باللہ معد بن الظاہر"
summary:
  ar: ثامن ملوك الدولة العبيدية، معد بن الظاهر، أقيم ابن سبع سنين سنة ثمان وعشرين فأقام في الخلافة ستين سنة وأربعة أشهر وقال
    الذهبي لا أعلم أحداً في الإسلام لا خليفة ولا سلطاناً أقام هذه المدة، وفي أيامه كان الغلاء بمصر الذي ما عهد مثله منذ زمان
    يوسف فأقام سبع سنين حتى أكل الناس بعضهم بعضاً، ودعي له بجامع المنصور ببغداد سنة خمسين لما ملكها البساسيري بأمواله {cite:tarikh-khulafa-minhaj-1434
    p. 643-644}. وعند ابن الجوزي أنه وُلّي بعد أبيه الظاهر لما توفي النصف من شعبان ٤٢٧ ولُقّب المستنصر بالله {cite:muntazam-ibn-al-jawzi
    j.8 p.432}.
  en: Ma'add ibn al-Zahir, eighth Ubaydid caliph, enthroned at seven in 428 and reigning sixty years and four months — al-Dhahabi
    knows none in Islam who lasted so. In his days came the seven-year famine unmatched since Joseph; his khutba sounded at
    Baghdad's Mansur mosque when al-Basasiri held the city on his money {cite:tarikh-khulafa-minhaj-1434 p. 643-644}.
  fr: "Ma'add ibn al-Zahir, huitième calife oubaydid, intronisé à sept ans en 428 et régnant soixante ans et quatre mois - al-Dhahabi ne connaît personne dans l'Islam qui ait duré ainsi. À son époque, la famine de sept ans était inégalée depuis Joseph ; son khutba sonnait à la mosquée Mansour de Bagdad quand al-Basasiri tenait la ville sur son argent {cite:tarikh-khulafa-minhaj-1434 p. 643-644}."
  es: "Ma'add ibn al-Zahir, octavo califa ubaydí, fue entronizado a los siete años en 428 y reinó sesenta años y cuatro meses; al-Dhahabi no conoce a nadie en el Islam que haya durado tanto. En sus días se produjo una hambruna de siete años sin precedentes desde José; su sermón resonó en la mezquita Mansur de Bagdad cuando al-Basasiri controlaba la ciudad gracias a su dinero {cite:tarikh-khulafa-minhaj-1434 p. 643-644}."
  ur: "معد بن الظاہر، آٹھویں عبیدید خلیفہ، 428 میں سات سال کی عمر میں تخت نشین ہوئے اور ساٹھ سال اور چار مہینے حکومت کی - الذہبی اسلام میں کسی کو نہیں جانتا جو اس طرح قائم رہا۔ اُس کے دنوں میں سات سالہ قحط آیا جو یوسف کے بعد سے بے مثال تھا۔ ان کا خطبہ بغداد کی منصورہ مسجد میں اس وقت ہوا جب البصیری نے اس شہر کو اپنے پیسوں پر سنبھالا۔ 643-644}۔"
  tr: "Ubaydid hanedanının sekizinci kralı Ma'ad ibn al-Zahir, yirmi sekizinci yılda yedi yaşında doğdu ve halifelikte altmış dört yıl dört ay kaldı. El-Dhahabi şöyle dedi: İslam'da bu dönemde hüküm süren kimseyi tanımıyorum ve onun döneminde Yusuf'tan beri Mısır'da eşi benzeri görülmemiş yüksek fiyatlar vardı, bu yüzden insanlar birbirini yeyene kadar yedi yıl kaldı. 50 yılında, al-Basasiri servetiyle Bağdat'taki El-Mansur Camii'ne davet edildi {alıntı: Tarikh-khulafa-minhaj-1434 s. 643-644}. İbn al-Jawzi'ye göre, babası el-Zahir 427 Hicri Hicri'nin ortasında öldüğünde onun yerine geçti ve Allah tarafından el-Mustansir unvanı verildi {atıf:Muntazam-ibn-al-jawzi J.8 s.432}."
  id: "Raja kedelapan dinasti Ubaydid, Ma'ad ibn al-Zahir, lahir pada usia tujuh tahun pada tahun dua puluh delapan, dan ia tetap di kekhalifahan selama enam puluh empat tahun empat bulan. Al-Dhahabi berkata: Saya tidak tahu ada seorang pun dalam Islam yang memerintah pada masa ini, dan pada masa-masanya harga Mesir sangat tinggi sejak zaman Yusuf, sehingga ia tinggal selama tujuh tahun sampai orang-orang saling makan. Ia diundang ke Masjid Al-Mansur di Baghdad pada tahun 50 ketika al-Basasiri memerintahnya dengan kekayaannya {cite:Tarikh-khulafa-minhaj-1434 hlm. 643-644}. Menurut Ibn al-Jawzi, ia menggantikan ayahnya al-Zahir ketika ayahnya wafat pada pertengahan Sha'ban 427 H dan diberi gelar al-Mustansir oleh Allah {cite:Muntazam-ibn-al-jawzi J.8 hlm.432}."
