label: { ar: "المستنصر بالله معد بن الظاهر" }
summary:
  ar: "ثامن ملوك الدولة العبيدية، معد بن الظاهر، أقيم ابن سبع سنين سنة ثمان وعشرين فأقام في الخلافة ستين سنة وأربعة أشهر وقال الذهبي لا أعلم أحداً في الإسلام لا خليفة ولا سلطاناً أقام هذه المدة، وفي أيامه كان الغلاء بمصر الذي ما عهد مثله منذ زمان يوسف فأقام سبع سنين حتى أكل الناس بعضهم بعضاً، ودعي له بجامع المنصور ببغداد سنة خمسين لما ملكها البساسيري بأمواله {cite:tarikh-khulafa-minhaj-1434 p. 643-644}."
  en: "Ma'add ibn al-Zahir, eighth Ubaydid caliph, enthroned at seven in 428 and reigning sixty years and four months — al-Dhahabi knows none in Islam who lasted so. In his days came the seven-year famine unmatched since Joseph; his khutba sounded at Baghdad's Mansur mosque when al-Basasiri held the city on his money {cite:tarikh-khulafa-minhaj-1434 p. 643-644}."
