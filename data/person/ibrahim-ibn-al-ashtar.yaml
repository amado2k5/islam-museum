gender: male
roles: [commander]
summary:
  ar: "ثار مع المختار بن أبي عبيد. بعد مقتل عبيد الله بن زياد حمل رأسه إلى المختار، فبعث به المختار إلى عبد الله بن الزبير بمكة {cite:muruj-mari-2005 juz' 3 p. 85}."
  en: "Led a rising alongside al-Mukhtar ibn Abi Ubayd. After Ubayd Allah ibn Ziyad's death he brought Ibn Ziyad's head to al-Mukhtar, who sent it on to Ibn al-Zubayr in Mecca {cite:muruj-mari-2005 juz' 3 p. 85}."
  es: "Lideró una rebelión junto a al-Mukhtar ibn Abi Ubayd. Tras la muerte de Ubayd Allah ibn Ziyad, llevó la cabeza de Ibn Ziyad a al-Mukhtar, quien la envió a Ibn al-Zubayr en La Meca {cite:muruj-mari-2005 juz' 3 p. 85}."
  fr: "Il mena un soulèvement aux côtés d'al-Mukhtar ibn Abi Ubayd. Après la mort d'Ubayd Allah ibn Ziyad, il apporta la tête d'Ibn Ziyad à al-Mukhtar, qui l'envoya à Ibn al-Zubayr à La Mecque {cite:muruj-mari-2005 juz' 3 p. 85}."
