summary:
  ar: "أحمد بن بلة (1916–2012)، سياسي وثوري جزائري من قادة جبهة التحرير الوطني في حرب الاستقلال؛ كان أول رئيس حكومة للجزائر المستقلة (1962–1963) ثم أول رئيس للجمهورية (1963–1965)، حتى أطاح به انقلاب هواري بومدين، فبقي رهن الاعتقال والمنفى سنوات طويلة قبل أن يعود إلى الجزائر."
  en: "Ahmed Ben Bella (1916–2012) was an Algerian politician and revolutionary, a leader of the National Liberation Front in the war of independence. He was the first head of government of independent Algeria (1962–1963) and then its first president (1963–1965), until Houari Boumédiène's coup overthrew him; he spent long years detained and exiled before returning to Algeria."
  ur: "احمد بن بیلا (1916ء–2012ء) جزائری سیاست دان اور انقلابی تھے، جنگ آزادی میں جبهة التحرير الوطني کے رہنما؛ وہ آزاد جزائر کے پہلے سربراہ حکومت (1962ء–1963ء) اور پھر پہلے صدر (1963ء–1965ء) بنے، یہاں تک کہ ہواری بومدین کی بغاوت نے انھیں ہٹا دیا، اور وہ طویل عرصے تک قید اور جلاوطنی میں رہے۔"
