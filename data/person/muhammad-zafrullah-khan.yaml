provenance:
  layer: own-research
  source: "English Wikipedia 'Zafrulla Khan' (revision 1380729688), Urdu Wikipedia 'محمد ظفر اللہ خان' (revision 12035452) and Arabic Wikipedia 'محمد ظفر الله خان' (revision 70775193), each fetched by its recorded revision id through the MediaWiki API with the returned id asserted equal before use, and Wikidata item Q781138 (item revision 2561088694, asserted on fetch; its raw religion claims were also inspected separately the same day). Existence checks by name fragments (zafrullah, zafarullah, ظفر الله, ظفر اللہ), by Arabic label across data/person, by biography and by QID found no prior record for this man; the record for the Sufi order of a similar name (badawiyya-ahmadiyya) is a different entity and not his community. Two relations are written. The successor_of edge to person/liaquat-ali-khan is for the foreign-affairs portfolio only: Liaquat held foreign affairs in his own first cabinet from August 1947, and Zafrullah succeeded him in that portfolio on 27 December 1947, as the English article's infobox records (predecessor Liaquat Ali Khan) and its text confirms (foreign minister under the Liaquat administration until 1954); it is not a premiership succession. The died_in edge to place/lahore is written. No other office edge is written: his predecessors and successors at the International Court of Justice (Bustamante y Rivero, Manfred Lachs) and the UN General Assembly (Mongi Slim, Carlos Sosa Rodríguez) have no person records. No born_in or buried_in edge is written because Sialkot, Daska and Rabwah have no place entities. His service under Muhammad Ali Jinnah (who had him present the League's case to the Radcliffe Commission) cannot be written as an edge: Jinnah has no person record in the museum, and this batch's brief forbids creating one. The lane queue gives 'Sir Muhammad Zafrullah Khan (1893–1985)', which the articles confirm."
