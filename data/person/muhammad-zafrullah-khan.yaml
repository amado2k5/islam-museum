faith:
  - value: ahmadiyya
    basis: documented
    note: "Recorded as Ahmadiyya on two independent article texts that attest his own affiliation, not merely the politics around him. The English article's Religion section states that, as an Ahmadi Muslim, Zafrullah Khan held the office of Ameer (president) of the Lahore chapter of the Ahmadiyya Community from 1919 to 1935, served as secretary to its second caliph, Mirza Bashir-ud-Din Mahmood Ahmad, at the community's Majlis-e-Shura, and represented the community at the All Parties Conference of 1924; its Legacy section adds that he openly acknowledged that he belonged to the Ahmadiyya Muslim Community. Independently, the Urdu article's religion section states that he belonged to the Ahmadiyya community, himself took bay'ah at the hand of Mirza Ghulam Ahmad, was a confidant of the Ahmadi caliphs and held the community's senior offices; the same article records that the 1953 Lahore riots demanded his resignation as foreign minister because he was an Ahmadi, and that he was buried in the community's Bahishti Maqbara at Rabwah. The Arabic stub's lead likewise describes him as a scholar of the Ahmadiyya Muslim Community. His parents' Ahmadi devotion, which the English article also records, is family background and is not what is counted; the counted attestations are of his own membership, offices and initiation. Wikidata does not record the affiliation (its religion values are a novalue statement and Islam only) and is not counted. Context, recorded without the museum taking a position of its own: in 1974 the National Assembly of Pakistan amended the constitution to declare Ahmadis non-Muslims for the purposes of law; Zafrullah Khan and the Ahmadiyya community continued throughout to profess Islam, and his books present the community's teaching as Islam."
