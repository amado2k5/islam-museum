summary:
  ar: "حقوقي ودبلوماسي باكستاني (1893–1985)، أول وزير خارجية لباكستان (1947–1954)، ورئيس الجمعية العامة للأمم المتحدة (1962–1963) ورئيس محكمة العدل الدولية (1970–1973)، وهو الباكستاني الوحيد الذي تولى أيا من الرئاستين. كان من أبرز أعضاء الجماعة الإسلامية الأحمدية، وترأس فرعها في لاهور، وألّف كتبا كثيرة في الإسلام والأحمدية."
  en: "Pakistani jurist and diplomat (1893–1985), the first foreign minister of Pakistan (1947–1954), president of the United Nations General Assembly (1962–1963) and president of the International Court of Justice (1970–1973) — the only Pakistani to hold either presidency. He was a leading member of the Ahmadiyya Muslim Community, presided over its Lahore chapter, and authored many books on Islam and Ahmadiyyat."
  ur: "پاکستانی ماہر قانون و سفارت کار (1893ء–1985ء)، پاکستان کے پہلے وزیر خارجہ (1947ء–1954ء)، اقوام متحدہ کی جنرل اسمبلی کے صدر (1962ء–1963ء) اور عالمی عدالت انصاف کے صدر (1970ء–1973ء) — وہ واحد پاکستانی ہیں جنھوں نے یہ دونوں صدارتیں سنبھالیں۔ جماعت احمدیہ کے ممتاز رکن تھے، اس کی لاہور شاخ کی صدارت کی، اور اسلام و احمدیت پر متعدد کتب لکھیں۔"
