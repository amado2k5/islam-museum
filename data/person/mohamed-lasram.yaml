summary:
  ar: "وطني تونسي (1866–1925)، من أعيان العاصمة المنحدرين من أعيان القيروان، ومن أسرة تولّى أبناؤها وزارة القلم منذ النصف الثاني من القرن الثامن عشر. تعلّم في الزيتونة والمدرسة الصادقية وأمضى عامين في فرنسا، وانضم إلى حركة الشباب التونسي وكتب في الصحف داعيًا إلى تعميم التعليم على الجنسين وحماية الأحباس ومشاركة التونسيين في الحياة السياسية، ودرّس بالمدرسة العلوية ثم ترأّس إدارة الغابات، وكان عميد جمعية الخلدونية بين 1900 و1909."
  en: "Tunisian nationalist (1866–1925), a Tunis notable of Kairouan origin whose family had supplied Ministers of the Pen since the second half of the 18th century. Educated at the Zaytuna and Sadiki College and for two years in France, he joined the Young Tunisians movement and wrote in the press for the generalisation of education to both sexes, the protection of the habous endowments and Tunisian participation in political life; he taught at the Alaoui College, then headed the forestry administration, and was dean of the Khaldounia association from 1900 to 1909."
  ur: "تونسی قوم پرست (1866–1925)، تونس کے ان ممتاز اعیان میں سے جن کا خاندان قیروان سے تھا اور اٹھارویں صدی کے نصفِ آخر سے وزیرِ قلم کے عہدے پر فائز رہتا آیا تھا۔ انہوں نے زیتونہ اور صادقی کالج میں تعلیم پائی اور دو سال فرانس میں گزارے؛ نوجوان تونسیوں کی تحریک میں شامل ہوئے اور اخبارات میں دونوں جنسوں کی تعلیم، اوقاف کے تحفظ اور تونسیوں کی سیاسی شرکت کی حمایت میں لکھا؛ علوی کالج میں تدریس کی، پھر محکمۂ جنگلات کے سربراہ بنے، اور 1900ء سے 1909ء تک خلدونیہ ایسوسی ایشن کے ڈین رہے۔"
