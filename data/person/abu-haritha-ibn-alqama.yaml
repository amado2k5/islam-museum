summary:
  en: "Bishop of Najran and its religious leader, one of the three chiefs who headed the sixty-man Christian delegation to Medina in 9 AH that debated Jesus and received the Prophet's offer of mubahala."
  ar: "أسقف نجران وصاحب زعامتها الدينية، وأحد الثلاثة الذين قادوا وفدها الستين إلى المدينة سنة 9هـ حين جادلوا في أمر عيسى فدعاهم النبي إلى المباهلة."
  fr: "Évêque de Najran et son chef religieux, l'un des trois chefs qui conduisirent la délégation chrétienne de soixante hommes à Médine en 9 H, qui débattit de Jésus et reçut du Prophète l'offre de la mubahala."
  es: "Obispo de Najran y su líder religioso, uno de los tres jefes que encabezaron la delegación cristiana de sesenta hombres a Medina en el año 9 de la Hégira que debatió con Jesús y recibió la oferta de mubahala del Profeta."
  ur: "نجران کے بشپ اور اس کے مذہبی رہنما، ان تین سرداروں میں سے ایک جنہوں نے 9 ہجری میں ساٹھ رکنی عیسائی وفد کی مدینہ منورہ کی سربراہی کی جس نے حضرت عیسیٰ سے بحث کی اور مباہلہ کی پیغمبرانہ پیشکش حاصل کی۔"
  tr: "Necran Piskoposu ve dini lideri, aynı zamanda Hicri 9. yılda İsa meselesi hakkında tartıştıkları sırada Medine'ye giden altmış kişilik heyete başkanlık eden üç kişiden biriydi; bunun üzerine Peygamber onları Mubahala'ya davet etti."
  id: "Uskup Najran dan pemimpin agamanya, serta salah satu dari tiga orang yang memimpin delegasinya yang berjumlah enam puluh orang ke Madinah pada tahun 9 Hijriah ketika mereka berdebat tentang masalah Yesus, maka Nabi mengundang mereka ke Mubahala."
