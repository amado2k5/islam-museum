  source: "English Wikipedia 'Shah Muhammad Sulaiman' (revision 1369189494) and Urdu Wikipedia 'شاہ محمد سلیمان' (revision 11850188), each fetched by its recorded revision id through the MediaWiki API with the returned id asserted equal before use, and Wikidata item Q7461315 (item revision 2538115875, queried twice with identical results). Existence checks by name fragments (sulaiman, شاه محمد سليمان, شاہ محمد سلیمان), by biography (Allahabad chief justice, Aligarh vice-chancellor), by QID across data/person, and by record provenances found no prior record for this man; the record shah-sulaiman-nuri is a different person. No Arabic Wikipedia article exists for him (only an Egyptian-dialect sitelink, which this lane does not count as an Arabic article), so the Arabic prose is written from the English and Urdu sources and says so. Two relations are written. First, buried_in to place/delhi, on the English article's statement that he was buried at the Nizamuddin Dargah in Delhi beside Amir Khusrow. Second, successor_of to person/ziauddin-ahmad, built in this same batch, and its direction is stated here in words: Sulaiman SUCCEEDED Ziauddin Ahmad as Vice-Chancellor of Aligarh Muslim University in 1938 — Ziauddin's own English article states that when his first term ended on 30 April 1938 'he was succeeded as Vice-Chancellor by Sir Shah Sulaiman', and Sulaiman's own English article confirms his vice-chancellorship ran 1938–1941. No other edge is written: Jaunpur has no place entity. The lane queue gives 'Sir Shah Sulaiman (1891–1941)': the death year is confirmed, but the birth year is wrong — the articles and Wikidata agree on 1886 (3 February 1886)."
