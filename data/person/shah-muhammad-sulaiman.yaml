summary:
  ar: "شاه محمد سليمان (1886–1941) قاضٍ وفيزيائي هندي، أول هندي يرأس محكمة الله آباد العليا (1932–1937)، ثم قاضٍ في المحكمة الاتحادية الهندية ونائب رئيس جامعة عليكرة الإسلامية (1938–1941)."
  en: "Shah Muhammad Sulaiman (1886–1941) was an Indian judge and physicist, the first Indian Chief Justice of the Allahabad High Court (1932–1937), later a judge of the Federal Court of India and Vice-Chancellor of Aligarh Muslim University (1938–1941)."
  ur: "شاہ محمد سلیمان (1886ء–1941ء) ہندوستانی منصف اور طبیعیات دان تھے، الہ آباد ہائی کورٹ کے پہلے ہندوستانی چیف جسٹس (1932ء–1937ء)، بعد میں وفاقی عدالت کے جج اور علی گڑھ مسلم یونیورسٹی کے وائس چانسلر (1938ء–1941ء) رہے۔"
