summary:
  ar: "رامٍ تركي في منافسات المسدس، وُلد في غوكسون سنة 1973. ضابط صف متقاعد في الدرك التركي وعضو نادي جاندرمة غوجو الرياضي، وبطل عالم وأوروبا مرات عدة، وصاحب فضية الفرق المختلطة في مسدس الهواء 10 أمتار في أولمبياد باريس 2024."
  en: "Turkish pistol shooter, born in Göksun in 1973. A retired non-commissioned officer of the Turkish Gendarmerie and a member of the Jandarma Gücü sports club, he is a multiple world and European champion and a silver medallist in the 10 m air pistol mixed team event at Paris 2024."
  ur: "ترک پسٹل شوٹر، جو 1973 میں گوکسون میں پیدا ہوئے۔ ترک جنڈرمیری کے ریٹائرڈ نان کمیشنڈ افسر اور جنڈرمہ گوچو اسپورٹس کلب کے رکن، متعدد بار عالمی اور یورپی چیمپئن، اور پیرس 2024 اولمپکس میں 10 میٹر ایئر پسٹل مکسڈ ٹیم ایونٹ میں چاندی کے تمغہ یافتہ۔"
  es: "Tirador turco de pistola, nacido en Göksun en 1973. Suboficial retirado de la Gendarmería turca y miembro del club deportivo Jandarma Gücü, es múltiple campeón mundial y europeo y medallista de plata en la prueba mixta por equipos de pistola de aire comprimido de 10 m en París 2024."
  fr: "Tireur au pistolet turc, né à Göksun en 1973. Sous-officier retraité de la gendarmerie turque et membre du club sportif Jandarma Gücü, il est multiple champion du monde et d'Europe et médaillé d'argent dans l'épreuve par équipe mixte de pistolet à air comprimé 10 m aux Jeux olympiques de Paris 2024."
  tr: "1973 Gökson doğumlu Türk silah yarışmacısı. Türk Jandarması'nda emekli astsubay, Güçü Spor Kulübü üyesi, çoklu dünya ve Avrupa şampiyonu ve Paris 2024 Olimpiyatları'nda karma takım 10 metre hava tabancasında gümüş madalya sahibi."
  id: "Seorang pesaing senjata Turki, lahir di Gökson pada tahun 1973. Pensiunan bintara di Gendarmerie Turki, anggota Güçu Sports Club, juara dunia dan Eropa berkali-kali, serta peraih medali perak di tim campuran 10 meter pistol angin di Olimpiade Paris 2024."
