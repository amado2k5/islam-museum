summary:
  ar: "رامٍ تركي في منافسات المسدس، وُلد في غوكسون سنة 1973. ضابط صف متقاعد في الدرك التركي وعضو نادي جاندرمة غوجو الرياضي، وبطل عالم وأوروبا مرات عدة، وصاحب فضية الفرق المختلطة في مسدس الهواء 10 أمتار في أولمبياد باريس 2024."
  en: "Turkish pistol shooter, born in Göksun in 1973. A retired non-commissioned officer of the Turkish Gendarmerie and a member of the Jandarma Gücü sports club, he is a multiple world and European champion and a silver medallist in the 10 m air pistol mixed team event at Paris 2024."
  ur: "ترک پسٹل شوٹر، جو 1973 میں گوکسون میں پیدا ہوئے۔ ترک جنڈرمیری کے ریٹائرڈ نان کمیشنڈ افسر اور جنڈرمہ گوچو اسپورٹس کلب کے رکن، متعدد بار عالمی اور یورپی چیمپئن، اور پیرس 2024 اولمپکس میں 10 میٹر ایئر پسٹل مکسڈ ٹیم ایونٹ میں چاندی کے تمغہ یافتہ۔"
