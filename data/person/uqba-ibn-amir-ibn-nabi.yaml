summary:
  ar: أنصاري من بني سلمة، شهد العقبة الأولى وبدراً وأحداً وأُعلم بعصابة خضراء في مغفره، وشهد الخندق وسائر المشاهد، واستُشهد باليمامة؛ ويرى ابن حجر أنه غير عقبة بن عامر السلمي الذي جاء بابنه إلى النبي، وإن جمعهما ابن الأثير.
  en: An Ansari of Banu Salima, he was at the first al-Aqaba, Badr and Uhud, where he was marked by a green band on his helmet, and at the Trench and the other campaigns, and was killed at al-Yamama; Ibn Hajar thinks he is a different man from
    Uqba ibn Amir al-Sulami who brought his son to the Prophet, though Ibn al-Athir joined them.
