summary:
  ar: أنصاري من بني سلمة، شهد العقبة الأولى وبدراً وأحداً وأُعلم بعصابة خضراء في مغفره، وشهد الخندق وسائر المشاهد، واستُشهد باليمامة؛ ويرى ابن حجر أنه غير عقبة بن عامر السلمي الذي جاء بابنه إلى النبي، وإن جمعهما ابن الأثير.
  en: An Ansari of Banu Salima, he was at the first al-Aqaba, Badr and Uhud, where he was marked by a green band on his helmet, and at the Trench and the other campaigns, and was killed at al-Yamama; Ibn Hajar thinks he is a different man from
    Uqba ibn Amir al-Sulami who brought his son to the Prophet, though Ibn al-Athir joined them.
  ur: "بنو سلمہ کے انصاری؛ پہلی عقبیٰ، بدر، احد اور خندق میں شریک ہوئے اور یمامہ میں مارے گئے۔ ابن حجر انہیں اس عقبہ بن عامر سلمی سے الگ شخص سمجھتے ہیں جو اپنے بیٹے کو نبی کے پاس لائے تھے۔ {cite:ibn-hajar-isaba}"
  es: "Pertenecía a los Ansari de Banu Salima y participó en las primeras batallas de al-Aqaba, Badr y Uhud, donde se le distinguió por una banda verde en su casco, así como en la Batalla de la Trinchera y otras campañas. Murió en al-Yamama; Ibn Hajar cree que se trata de un hombre distinto de Uqba ibn Amir al-Sulami, quien llevó a su hijo ante el Profeta, aunque Ibn al-Athir se unió a ellos."
  fr: "Ansari de Banu Salima, il participa aux premières batailles d'al-Aqaba, de Badr et d'Uhud, où il fut identifié par une bande verte sur son casque, ainsi qu'à la bataille du Fossé et aux autres campagnes, et fut tué à al-Yamama; Ibn Hajar pense qu'il s'agit d'un homme différent d'Uqba ibn Amir al-Sulami qui amena son fils au Prophète, bien qu'Ibn al-Athir se soit joint à eux."
  tr: "Banu Salama'dan bir Ansari, İlk Akeba, Beder ve Uhud'a tanıklık eden, Yeşil Bant ile tanınan, affettiği siper ve diğer savaşlara tanık olmuş, Al-Yamama'da şehit edilmiştir. İbn Hajar, onu oğlunu Peygamber'e getiren Uqba ibn Emir el-Sulami'den farklı görür, ancak İbn al-Athir onları birleştirmiştir."
  id: "Seorang Ansari dari Banu Salama, yang menyaksikan Aqabah, Badr, dan Uhud Pertama, dikenal karena Green Band, dalam pengampunannya, dan menyaksikan parit serta pertempuran lainnya, dan menjadi martir di Al-Yamama. Ibn Hajar menganggap dia berbeda dari Uqba ibn Amir al-Sulami, yang membawa putranya kepada Nabi, meskipun Ibn al-Athir menggabungkan mereka."
