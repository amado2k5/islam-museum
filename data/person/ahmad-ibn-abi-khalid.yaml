label: { ar: "أحمد بن أبي خالد الأحول", en: "Ahmad ibn Abi Khalid al-Ahwal", fr: "Ahmad ibn Abi Khalid al-Ahwal", es: "Ahmad ibn Abi Khalid al-Ahwal", ur: "احمد بن ابی خالد الاحوال" }
summary:
  ar: "أحمد بن أبي خالد الأحول الكاتب؛ وجهه المأمون لغزو أشروسنة في جيش عظيم فسلك الطريق المختصرة التي وصفها حيدر بن كاوس فأناخ على مدينتها قبل موافاة الترك فاستسلم كاوس."
  en: "Ahmad ibn Abi Khalid al-Ahwal the katib; al-Ma'mun's commander who took Haydar's short road and camped on Ushrusana's city before the Turks arrived — Kawus surrendered."
  fr: "Ahmad ibn Abi Khalid al-Ahwal, secrétaire et commandant d'al-Ma'mun, prit le raccourci de Haydar et campa devant la ville d'Ushrusana avant l'arrivée des Turcs ; Kawus se rendit."
  es: "Ahmad ibn Abi Khalid al-Ahwal el katib; comandante de al-Ma'mun que tomó el camino corto de Haydar y acampó en la ciudad de Ushrusana antes de que llegaran los turcos: Kawus se rindió."
  ur: "احمد بن ابی خالد الاحوال کاتب؛ المامون کا کمانڈر جس نے حیدر کی چھوٹی سڑک پر قبضہ کیا اور ترکوں کے پہنچنے سے پہلے عشروسانہ کے شہر میں ڈیرہ ڈالا - کاووس نے ہتھیار ڈال دیے۔"
  tr: "Yazar Ahmed ibn Abi Halid el-Ahval; El-Ma'mun onu büyük bir orduyla Uşrusana'ya saldırması için gönderdi, bu yüzden Haydar ibn Kawus'un tarif ettiği kestirme yolu kullandı ve Türkler gelmeden önce şehrin önünde kamp kurdu, böylece Kawus teslim oldu."
  id: "Ahmad ibn Abi Khalid al-Ahwal, sang penulis; Al-Ma’mun mengutusnya untuk menyerang Ushrusana dengan pasukan besar, sehingga ia mengambil jalan pintas yang dijelaskan oleh Haydar ibn Kawus, dan ia berkemah di kota itu sebelum kedatangan orang Turki, sehingga Kawus menyerah."
