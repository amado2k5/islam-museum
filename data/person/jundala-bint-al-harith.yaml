summary:
  ar: "امرأة من العرب، كانت زوجة حنظلة بن مالك، وقالت لما افتضّها رجل في ليلة مطيرة: لُسعت حيث لا يضع الراقي أنفه، فصار مثلاً. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 21}"
  en: "A woman of the Arabs, wife of Hanzala ibn Malik; on a rainy night a man violated her and she said 'I was stung where the healer cannot put his nose', which became a proverb. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 21}"
  ur: "عرب کی ایک عورت، حنظلہ بن مالک کی بیوی؛ بارش کی رات ایک شخص نے ان کے ساتھ زیادتی کی تو انہوں نے کہا 'مجھے وہاں ڈسا گیا جہاں معالج ناک نہیں ڈال سکتا'، اور یہ مثل بن گیا۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 21}"
