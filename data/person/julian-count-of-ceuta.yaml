summary:
  ar: "حاكم سبتة من الإسبان، ويذكر الكتاب أن اتصالات الجانب الإسباني بموسى بن نصير أثناء الفتح كانت عاملاً مساعداً سهّل سير الفتح، وأن السفن التي نقلت جند طارق بن زياد أُحضرت إلى سبتة بتدبيره، وأن المبادرة والتخطيط كانا من الجانب الإسلامي {cite:salabi-umayyad-state-2020 p.67-68}."
  tr: "Ceuta'nın hükümdarı İspanya'dandı. Kitap, İspanyol tarafının fetih sırasında Musa ibn Nusayr ile temaslarının fetih kolaylaştırıcı bir faktör olduğu, Tariq ibn Ziyad'ın askerlerini taşıyan gemilerin onun yönetiminde Ceuta'ya getirildiği ve girişim ile planlamanın İslami taraftan geldiği belirtilir {cite:salabi-umayyad-state-2020 s.67-68}."
  id: "Penguasa Ceuta berasal dari Spanyol. Buku tersebut menyebutkan bahwa kontak pihak Spanyol dengan Musa ibn Nusayr selama penaklukan menjadi faktor yang memudahkan penaklukan, bahwa kapal-kapal yang mengangkut pasukan Tariq ibn Ziyad dibawa ke Ceuta di bawah pengelolaannya, dan bahwa inisiatif serta perencanaan berasal dari pihak Islam {cite:salabi-umayyad-state-2020 hlm.67-68}."
