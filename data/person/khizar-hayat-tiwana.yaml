summary:
  ar: "ملک سر خضر حياة تيوانا (1900–1975) رجل دولة ومالك أراضٍ وضابط من البنجاب، آخر رئيس وزراء للبنجاب الموحدة (1942–1947) عن الحزب الاتحادي، عارض تقسيم الهند ونظرية الدولتين معارضة صريحة، وطُرد من الرابطة الإسلامية، واستقال في آذار 1947 قبيل التقسيم، وهو ابن سر عمر حياة خان تيوانا."
  en: "Malik Sir Khizar Hayat Tiwana (1900–1975) was a Punjabi statesman, landowner and army officer, the last Premier of the undivided Punjab (1942–1947) for the Unionist Party, who openly opposed the partition of India and the two-nation theory, was expelled from the Muslim League, and resigned in March 1947 shortly before Partition; he was the son of Sir Umar Hayat Khan Tiwana."
  ur: "ملک سر خضر حیات ٹوانہ (1900ء–1975ء) پنجابی ریاست کار، زمیندار اور فوجی افسر تھے، یونینسٹ پارٹی کی جانب سے متحدہ پنجاب کے آخری وزیراعظم (1942ء–1947ء) رہے، تقسیمِ ہند اور دو قومی نظریے کی کھل کر مخالفت کی، مسلم لیگ سے نکالے گئے اور مارچ 1947ء میں مستعفی ہو گئے؛ وہ سر عمر حیات خان ٹوانہ کے بیٹے تھے۔"
