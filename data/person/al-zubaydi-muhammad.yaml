summary:
  ar: "أبو بكر محمد بن الحسن بن عبد الله بن مذحج الزبيدي الإشبيلي نزيل قرطبة؛ كان واحد عصره في علم النحو وحفظ اللغة وأخير أهل زمانه بالإعراب والمعاني والنوادر إضافة إلى الشعر والأخبار، ولم يكن بالأندلس في فنه مثله؛ من تصانيفه «مختصر كتاب العين» و«طبقات النحويين واللغويين بالمشرق والأندلس» و«هتك ستور الملحدين» رداً على ابن مسرة؛ اختاره الخليفة المستنصر لتأديب ولده ولىّ عهده هشام المؤيد بالله، وتولى قضاء إشبيلية وخطّة الشرطة؛ أخذ الأدب واللغة عن أبي علي القالي {cite:wafayat-ayan}."
  fr: "Abou Bakr Muhammad ibn al-Hasan ibn Abd Allah ibn Madhhij al-Zubaydi al-Ishbili vécut à Cordoue. Grammairien, lexicographe et connaisseur de la poésie et des récits, il était sans égal dans sa discipline en al-Andalus. Il écrivit notamment un abrégé du Kitab al-Ayn, les Tabaqat al-nahwiyyin wa-l-lughawiyyin bi-l-Mashriq wa-l-Andalus et le Hatk sutur al-mulhidin, une réfutation d’Ibn Masarra. Le calife al-Mustansir le choisit pour instruire son fils et héritier Hisham al-Mu’ayyad bi-llah. Il exerça les fonctions de juge et de chef de la police à Séville. Il étudia les lettres et la langue auprès d’Abou Ali al-Qali {cite:wafayat-ayan}."
  tr: "Ebu Bekir Muhammed ibn el-Hasan ibn Abdullah ibn Medhac el-Zubeydi el-İşbili, Kordoba'da ikamet ediyordu; dilbilgisi, dil ezberleme ve şiir ile anekdotların yanı sıra dilbilgisi, anlamları ve anekdotlar açısından çağdaşlarının sonuncusuydu. Endülüs'te sanatında onun gibi kimse yoktu; eserleri arasında \"Mukhtasar Kitab al-'Ayn\" bulunmaktadır. \"Tabaqat al-Nahwiyin wa al-Lughwiyin bil-Mashriq wa al-Andalus\" ve \"Hattab Stur al-Ahiddin\" İbn Masarrah'a yanıt olarak. Halife al-Mustansir, oğlu ve halefi Hişam el-Muayyad Billah'ı disiplin etmesi için onu seçti. Sevilla yargıcı ve polis memuru olarak görev yaptı; edebiyat ve dil eğitimini Ebu Ali el-Kali'den aldı {alıntı:Wafayat-ayan}."
  id: "Abu Bakr Muhammad ibn al-Hasan ibn Abdullah ibn Madhhaj al-Zubaidi al-Ishbili adalah penduduk Cordoba; ia adalah salah satu sezamannya dalam tata bahasa, hafalan bahasa, dan yang terakhir sezamannya dalam tata bahasa, makna, dan anekdot, selain puisi dan anekdot. Tidak ada seorang pun di al-Andalus yang serupanya dalam seni; di antara karyanya adalah \"Mukhtasar Kitab al-'Ayn,\" \"Tabaqat al-Nahwiyin wa al-Lughwiyin bil-Mashriq wa al-Andalus,\" dan \"Hattab Stur al-Ahiddin\" sebagai tanggapan atas Ibn Masarrah. Khalifah al-Mustansir memilihnya untuk mendisiplinkan putra dan penerusnya Hisham al-Mu'ayyad Billah. Ia menjabat sebagai hakim Sevilla dan sebagai petugas polisi; ia belajar sastra dan bahasa dari Abu Ali al-Qali {cite:wafayat-ayan}."
