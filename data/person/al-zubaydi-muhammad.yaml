  ar: "أبو بكر محمد بن الحسن بن عبد الله بن مذحج الزبيدي الإشبيلي نزيل قرطبة؛ كان واحد عصره في علم النحو وحفظ اللغة وأخير أهل زمانه بالإعراب والمعاني والنوادر إضافة إلى الشعر والأخبار، ولم يكن بالأندلس في فنه مثله؛ من تصانيفه «مختصر كتاب العين» و«طبقات النحويين واللغويين بالمشرق والأندلس» و«هتك ستور الملحدين» رداً على ابن مسرة؛ اختاره الخليفة المستنصر لتأديب ولده ولىّ عهده هشام المؤيد بالله، وتولى قضاء إشبيلية وخطّة الشرطة؛ أخذ الأدب واللغة عن أبي علي القالي {cite:wafayat-ayan}."
