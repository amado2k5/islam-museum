summary:
  ar: "أحمد بن الفرات بن خالد، أبو مسعود الضبي الرازي، الحافظ، يصفه ابن عساكر في «تاريخ دمشق» بأنه أحد الأئمة الثقات والحفاظ الأثبات. سمع بدمشق وغيرها وطوّف بين البصرة والكوفة والحجاز واليمن والشام ومصر والجزيرة، وورد بغداد في حياة أحمد بن حنبل فقدّمه وأكرمه، ثم استوطن أصبهان يحدّث بها خمساً وأربعين سنة، وروى عنه أبو داود في سننه. ونقل ابن عساكر قوله إنه كتب عن ألف وسبعمائة وخمسين رجلاً وكتب ألف ألف وخمسمائة ألف حديث. توفي بأصبهان في شعبان سنة 258هـ على الأشهر، وقيل 268هـ {cite:tarikh-dimashq-amrawi-v5 p. 150-157}."
  en: "Ahmad ibn al-Furat ibn Khalid, Abu Mas'ud al-Dabbi al-Razi, the hafiz, whom Ibn Asakir's Tarikh Dimashq calls one of the trustworthy imams and firm hafizes. He heard hadith in Damascus and elsewhere, travelling through Basra, Kufa, the Hijaz, Yemen, Syria, Egypt and the Jazira; he came to Baghdad in Ahmad ibn Hanbal's lifetime and was honoured by him, then settled in Isfahan, where he taught for forty-five years; Abu Dawud narrates from him in his Sunan. Ibn Asakir quotes him as saying he wrote from 1,750 men and wrote down 1,500,000 hadiths. He died in Isfahan in Sha'ban 258 AH on the better-known report, or 268 AH."
died: { hijri: "0258-08", edtf: "0872-06/0872-07", calendar: julian, precision: month, status: debated, derived: true, note: "أبو نعيم: توفي في شعبان سنة ثمان وخمسين ومائتين، وكذا قال ابن أخي رسته (258)؛ وقال عبد الله بن جعفر بن فارس: سنة ثمان وستين ومائتين {cite:tarikh-dimashq-amrawi-v5 p. 156-157}. التحويل مشتق بالحساب الجدولي لشعبان 258.", sources: [source/tarikh-dimashq-amrawi-v5] }
