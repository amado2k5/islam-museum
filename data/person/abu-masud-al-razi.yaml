summary:
  ar: "أحمد بن الفرات بن خالد، أبو مسعود الضبي الرازي، الحافظ، يصفه ابن عساكر في «تاريخ دمشق» بأنه أحد الأئمة الثقات والحفاظ الأثبات. سمع بدمشق وغيرها وطوّف بين البصرة والكوفة والحجاز واليمن والشام ومصر والجزيرة، وورد بغداد في حياة أحمد بن حنبل فقدّمه وأكرمه، ثم استوطن أصبهان يحدّث بها خمساً وأربعين سنة، وروى عنه أبو داود في سننه. ونقل ابن عساكر قوله إنه كتب عن ألف وسبعمائة وخمسين رجلاً وكتب ألف ألف وخمسمائة ألف حديث. توفي بأصبهان في شعبان سنة 258هـ على الأشهر، وقيل 268هـ {cite:tarikh-dimashq-amrawi-v5 p. 150-157}."
  en: "Ahmad ibn al-Furat ibn Khalid, Abu Mas'ud al-Dabbi al-Razi, the hafiz, whom Ibn Asakir's Tarikh Dimashq calls one of the trustworthy imams and firm hafizes. He heard hadith in Damascus and elsewhere, travelling through Basra, Kufa, the Hijaz, Yemen, Syria, Egypt and the Jazira; he came to Baghdad in Ahmad ibn Hanbal's lifetime and was honoured by him, then settled in Isfahan, where he taught for forty-five years; Abu Dawud narrates from him in his Sunan. Ibn Asakir quotes him as saying he wrote from 1,750 men and wrote down 1,500,000 hadiths. He died in Isfahan in Sha'ban 258 AH on the better-known report, or 268 AH."
  fr: "Ahmad ibn al-Furat ibn Khalid, Abu Mas'ud al-Dabbi al-Razi, le hafiz, que le Tarikh Dimashq d'Ibn Asakir appelle l'un des imams dignes de confiance et des hafiz solides. Il entendit le hadith à Damas et ailleurs, parcourant Bassora, Koufa, le Hijaz, le Yémen, la Syrie, l'Égypte et la Jazira ; il vint à Bagdad du vivant d'Ahmad ibn Hanbal, qui l'honora, puis s'établit à Ispahan, où il enseigna quarante-cinq ans ; Abu Dawud rapporte de lui dans ses Sunan. Ibn Asakir le cite disant qu'il écrivit d'après 1 750 hommes et nota 1 500 000 hadiths. Il mourut à Ispahan en sha'ban 258 H selon le récit le plus connu, ou en 268 H."
  es: "Ahmad ibn al-Furat ibn Khalid, Abu Mas'ud al-Dabbi al-Razi, el hafiz, a quien el Tarikh Dimashq de Ibn Asakir llama uno de los imanes confiables y hafices firmes. Escuchó hadices en Damasco y otros lugares, viajando por Basora, Kufa, el Hiyaz, Yemen, Siria, Egipto y la Jazira; llegó a Bagdad en vida de Ahmad ibn Hanbal y fue honrado por él, luego se estableció en Isfahán, donde enseñó durante cuarenta y cinco años; Abu Dawud narra de él en su Sunan. Ibn Asakir lo cita diciendo que escribió de 1750 hombres y transcribió 1.500.000 hadices. Murió en Isfahán en Sha'ban del año 258 AH, según el relato más conocido, o en el año 268 AH."
  ur: "احمد بن الفرات ابن خالد، ابو مسعود الدبی الرازی، حافظ، جنہیں ابن عساکر کی تاریخ دمشق نے ثقہ اماموں اور پختہ حافظوں میں سے ایک کہا ہے۔ اس نے بصرہ، کوفہ، حجاز، یمن، شام، مصر اور جزیرہ سے سفر کرتے ہوئے دمشق اور دیگر مقامات پر حدیثیں سنی۔ وہ احمد بن حنبل کی زندگی میں بغداد آئے اور ان کی طرف سے عزت افزائی کی گئی، پھر اصفہان میں سکونت اختیار کی، جہاں انہوں نے پینتالیس سال تک تعلیم دی۔ ابوداؤد نے اپنی سنن میں ان سے روایت کی ہے۔ ابن عساکر ان کا حوالہ دیتے ہوئے کہتے ہیں کہ انہوں نے 1,750 آدمیوں سے لکھا اور 1,500,000 احادیث لکھیں۔ آپ کی وفات اصفہان میں شعبان 258 ہجری میں معروف روایت یا 268 ہجری میں ہوئی۔"
  tr: "Hadis ezbercisi Ahmed ibn el-Furat ibn Halid, Ebu Mes'ud el-Dabbi el-Razi, İbn Asakir'in \"Şam Tarihi\" adlı eserinde en güvenilir imamlardan ve hadis ezbercilerinden biri olarak tanımlanmaktadır. Şam'da ve başka yerlerde eğitim görmüş, Basra, Kufe, Hicaz, Yemen, Suriye, Mısır ve Cezire arasında seyahat etmiştir. Ahmed ibn Hanbel'in hayatta olduğu dönemde Bağdat'a gelmiş ve Hanbel onu karşılayıp onurlandırmıştır. Daha sonra İsfahan'a yerleşmiş ve kırk beş yıl boyunca hadis dersleri vermiştir. Ebu Davud, Sünen'inde ondan rivayet etmiştir. İbn Asakir ayrıca 1750 kişiden hadis yazdığını ve 1.500.000 hadis derlediğini bildirmiştir. En yaygın kabul gören rivayete göre 258 Hicri yılının Şaban ayında İsfahan'da vefat etmiştir, ancak bazı kaynaklar 268 Hicri yılını belirtmektedir."
  id: "Ahmad ibn al-Furat ibn Khalid, Abu Mas'ud al-Dabbi al-Razi, penghafal hadits, digambarkan oleh Ibn 'Asakir dalam \"Sejarah Damaskus\" sebagai salah satu imam yang paling terpercaya dan penghafal hadits yang andal. Ia belajar di Damaskus dan tempat lain, dan melakukan perjalanan antara Basra, Kufa, Hijaz, Yaman, Suriah, Mesir, dan Jazira. Ia tiba di Baghdad pada masa hidup Ahmad ibn Hanbal, yang menyambut dan menghormatinya. Kemudian ia menetap di Isfahan, di mana ia mengajar hadits selama empat puluh lima tahun. Abu Dawud meriwayatkan hadits darinya dalam kitab Sunan. Ibn 'Asakir juga melaporkan bahwa ia mencatat hadits dari 1.750 orang dan mengumpulkan 1.500.000 hadits. Ia meninggal di Isfahan pada bulan Sya'ban tahun 258 H, menurut riwayat yang paling banyak diterima, meskipun beberapa mengatakan tahun 268 H."
