summary:
  ar: "أبو عبد الله محمد بن أبي العباس الصاعدي الفراوي النيسابوري الملقب كمال الدين الفقيه المحدث؛ نشأ بين الصوفية وكان فقيهاً محدثاً متفنناً مناظراً واعظاً يحمل الطعام إلى المسافرين الواردين عليه ويخدمهم بنفسه مع كبر سنه؛ سمع صحيح مسلم من عبد الغافر الفارسي وصحيح البخاري من سعيد بن أبي سعيد، وسمع من الشيرازي والحافظ البيهقي والقشيري وإمام الحرمين، وتفرد برواية عدة كتب للبيهقي مثل دلائل النبوة والأسماء والصفات؛ وكان يقال في حقه الفراوي ألف راوي {cite:wafayat-ayan}."
  en: "Abu Abd Allah Muhammad ibn Abi al-Abbas al-Sa'idi al-Farawi al-Nisaburi, known as Kamal al-Din, jurist and transmitter of hadith. He grew up among the Sufis. He was a learned jurist and hadith scholar, versatile, a debater and preacher, who carried food to the travellers who came to him and served them himself despite his age. He heard Sahih Muslim from Abd al-Ghafir al-Farisi and Sahih al-Bukhari from Sa'id ibn Abi Sa'id, and heard from al-Shirazi, al-Hafiz al-Bayhaqi, al-Qushayri and Imam al-Haramayn; he alone transmitted several of al-Bayhaqi's books, such as Dala'il al-nubuwwa and al-Asma' wa-l-sifat. It was said of him: 'al-Farawi is a thousand narrators' {cite:wafayat-ayan}."
  fr: "Abu Abd Allah Muhammad ibn Abi al-Abbas al-Sa’idi al-Farawi al-Nisaburi, connu comme Kamal al-Din, juriste et transmetteur du hadith. Il grandit parmi les soufis. Juriste et savant du hadith érudit et polyvalent, débatteur et prédicateur, il portait de la nourriture aux voyageurs venus le voir et les servait lui-même malgré son âge. Il entendit le Sahih de Muslim d’Abd al-Ghafir al-Farisi et le Sahih d’al-Bukhari de Sa’id ibn Abi Sa’id, ainsi qu’al-Shirazi, le hafiz al-Bayhaqi, al-Qushayri et l’imam al-Haramayn ; il fut le seul à transmettre plusieurs livres d’al-Bayhaqi, comme Dala’il al-nubuwwa et al-Asma’ wa-l-sifat. On disait de lui : « Al-Farawi, c’est mille narrateurs » {cite:wafayat-ayan}."
  es: "Abu Abd Allah Muhammad ibn Abi al-Abbas al-Sa'idi al-Farawi al-Nisaburi, conocido como Kamal al-Din, fue un jurista y transmisor de hadices. Creció entre los sufíes. Fue un jurista erudito y un erudito de hadices, versátil, un excelente orador y predicador, que llevaba comida a los viajeros que acudían a él y les servía personalmente a pesar de su avanzada edad. Escuchaba el Sahih Muslim de Abd al-Ghafir al-Farisi y el Sahih al-Bukhari de Sa'id ibn Abi Sa'id, y también a al-Shirazi, al-Hafiz al-Bayhaqi, al-Qushayri y al Imam al-Haramayn; él solo transmitió varios libros de al-Bayhaqi, como Dala'il al-nubuwwa y al-Asma' wa-l-sifat. Se decía de él: «Al-Farawi es un narrador de mil palabras» {cite:wafayat-ayan}."
