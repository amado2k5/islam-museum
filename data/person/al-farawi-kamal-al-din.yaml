summary:
  ar: "أبو عبد الله محمد بن أبي العباس الصاعدي الفراوي النيسابوري الملقب كمال الدين الفقيه المحدث؛ نشأ بين الصوفية وكان فقيهاً محدثاً متفنناً مناظراً واعظاً يحمل الطعام إلى المسافرين الواردين عليه ويخدمهم بنفسه مع كبر سنه؛ سمع صحيح مسلم من عبد الغافر الفارسي وصحيح البخاري من سعيد بن أبي سعيد، وسمع من الشيرازي والحافظ البيهقي والقشيري وإمام الحرمين، وتفرد برواية عدة كتب للبيهقي مثل دلائل النبوة والأسماء والصفات؛ وكان يقال في حقه الفراوي ألف راوي {cite:wafayat-ayan}."
  en: "Abu Abd Allah Muhammad ibn Abi al-Abbas al-Sa'idi al-Farawi al-Nisaburi, known as Kamal al-Din, jurist and transmitter of hadith. He grew up among the Sufis. He was a learned jurist and hadith scholar, versatile, a debater and preacher, who carried food to the travellers who came to him and served them himself despite his age. He heard Sahih Muslim from Abd al-Ghafir al-Farisi and Sahih al-Bukhari from Sa'id ibn Abi Sa'id, and heard from al-Shirazi, al-Hafiz al-Bayhaqi, al-Qushayri and Imam al-Haramayn; he alone transmitted several of al-Bayhaqi's books, such as Dala'il al-nubuwwa and al-Asma' wa-l-sifat. It was said of him: 'al-Farawi is a thousand narrators' {cite:wafayat-ayan}."
