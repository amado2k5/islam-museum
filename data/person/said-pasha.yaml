summary:
  ar: "محمد سعيد باشا، أصغر أبناء محمد علي باشا ووالي مصر الوراثي من 1854 إلى 1863، تحت السيادة العثمانية نظرياً. وُلد سنة 1822 وتولى الحكم في تموز 1854 بعد وفاة ابن أخيه عباس حلمي الأول. عُرف بميله إلى الثقافة الفرنسية، فمنح فرديناند دي لسبس امتياز قناة السويس، وأصدر قانون الملكية العقارية الخاصة وألغى احتكار الدولة للمحاصيل سنة 1858. توفي في الإسكندرية في 17 كانون الثاني 1863 وخلفه إسماعيل {cite:encyclopaedia-of-islam-2 vol. 8 p. 924} {cite:encyclopaedia-of-islam-2 vol. 8 p. 925}."
  en: "Muhammad Sa'id Pasha, youngest son of Muhammad Ali Pasha, was hereditary viceroy of Egypt from 1854 to 1863, theoretically under Ottoman suzerainty. Born in 1822, he succeeded in July 1854 after the death of his predecessor 'Abbas Hilmi I. Known for his fondness for French culture, he granted Ferdinand de Lesseps the Suez Canal concession, issued Egypt's first comprehensive law on private landed property and ended the state monopoly over agricultural products in 1858. He died in Alexandria on 17 January 1863 and was succeeded by Isma'il {cite:encyclopaedia-of-islam-2 vol. 8 p. 924} {cite:encyclopaedia-of-islam-2 vol. 8 p. 925}."
  ur: "محمد سعید پاشا، محمد علی پاشا کے سب سے چھوٹے بیٹے، 1854ء سے 1863ء تک مصر کے موروثی والی رہے، جو نظری طور پر عثمانی بالادستی کے تحت تھا۔ وہ 1822ء میں پیدا ہوئے اور اپنے پیش رو عباس حلمی اول کی وفات کے بعد جولائی 1854ء میں تخت نشین ہوئے۔ فرانسیسی ثقافت سے لگاؤ کی وجہ سے انہوں نے فرڈیننڈ دی لیسپس کو نہرِ سویز کا امتیازی اجازت نامہ دیا، نجی زمینی جائیداد پر مصر کا پہلا جامع قانون جاری کیا اور 1858ء میں زرعی پیداوار پر ریاستی اجارہ ختم کیا۔ وہ 17 جنوری 1863ء کو اسکندریہ میں فوت ہوئے اور اسماعیل ان کے جانشین بنے {cite:encyclopaedia-of-islam-2 vol. 8 p. 924} {cite:encyclopaedia-of-islam-2 vol. 8 p. 925}۔"
