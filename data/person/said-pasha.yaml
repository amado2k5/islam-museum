summary:
  ar: "محمد سعيد باشا، أصغر أبناء محمد علي باشا ووالي مصر الوراثي من 1854 إلى 1863، تحت السيادة العثمانية نظرياً. وُلد سنة 1822 وتولى الحكم في تموز 1854 بعد وفاة ابن أخيه عباس حلمي الأول. عُرف بميله إلى الثقافة الفرنسية، فمنح فرديناند دي لسبس امتياز قناة السويس، وأصدر قانون الملكية العقارية الخاصة وألغى احتكار الدولة للمحاصيل سنة 1858. توفي في الإسكندرية في 17 كانون الثاني 1863 وخلفه إسماعيل {cite:encyclopaedia-of-islam-2 vol. 8 p. 924} {cite:encyclopaedia-of-islam-2 vol. 8 p. 925}."
  en: "Muhammad Sa'id Pasha, youngest son of Muhammad Ali Pasha, was hereditary viceroy of Egypt from 1854 to 1863, theoretically under Ottoman suzerainty. Born in 1822, he succeeded in July 1854 after the death of his predecessor 'Abbas Hilmi I. Known for his fondness for French culture, he granted Ferdinand de Lesseps the Suez Canal concession, issued Egypt's first comprehensive law on private landed property and ended the state monopoly over agricultural products in 1858. He died in Alexandria on 17 January 1863 and was succeeded by Isma'il {cite:encyclopaedia-of-islam-2 vol. 8 p. 924} {cite:encyclopaedia-of-islam-2 vol. 8 p. 925}."
  ur: "محمد سعید پاشا، محمد علی پاشا کے سب سے چھوٹے بیٹے، 1854ء سے 1863ء تک مصر کے موروثی والی رہے، جو نظری طور پر عثمانی بالادستی کے تحت تھا۔ وہ 1822ء میں پیدا ہوئے اور اپنے پیش رو عباس حلمی اول کی وفات کے بعد جولائی 1854ء میں تخت نشین ہوئے۔ فرانسیسی ثقافت سے لگاؤ کی وجہ سے انہوں نے فرڈیننڈ دی لیسپس کو نہرِ سویز کا امتیازی اجازت نامہ دیا، نجی زمینی جائیداد پر مصر کا پہلا جامع قانون جاری کیا اور 1858ء میں زرعی پیداوار پر ریاستی اجارہ ختم کیا۔ وہ 17 جنوری 1863ء کو اسکندریہ میں فوت ہوئے اور اسماعیل ان کے جانشین بنے {cite:encyclopaedia-of-islam-2 vol. 8 p. 924} {cite:encyclopaedia-of-islam-2 vol. 8 p. 925}۔"
  es: "Muhammad Sa'id Pasha, hijo menor de Muhammad Ali Pasha, fue virrey hereditario de Egipto desde 1854 hasta 1863, teóricamente bajo la soberanía otomana. Nacido en 1822, sucedió en julio de 1854 a su predecesor, Abbas Hilmi I, tras su muerte. Conocido por su afición a la cultura francesa, otorgó a Ferdinand de Lesseps la concesión del Canal de Suez, promulgó la primera ley integral de Egipto sobre la propiedad privada de la tierra y puso fin al monopolio estatal sobre los productos agrícolas en 1858. Murió en Alejandría el 17 de enero de 1863 y fue sucedido por Isma'il {cite:encyclopaedia-of-islam-2 vol. 8 p. 924} {cite:encyclopaedia-of-islam-2 vol. 8 p. 925}."
  fr: "Muhammad Sa'id Pacha, fils cadet de Muhammad Ali Pacha, fut vice-roi héréditaire d'Égypte de 1854 à 1863, sous suzeraineté ottomane. Né en 1822, il succéda à son prédécesseur, Abbas Hilmi Ier, en juillet 1854. Connu pour son goût pour la culture française, il accorda à Ferdinand de Lesseps la concession du canal de Suez, promulgua la première loi exhaustive d'Égypte sur la propriété foncière privée et mit fin au monopole d'État sur les produits agricoles en 1858. Il mourut à Alexandrie le 17 janvier 1863 et fut remplacé par Ismaïl."
  tr: "Muhammed Ali Paşa'nın en küçük oğlu ve 1854-1863 yılları arasında Mısır'ın kalıtsal valisi olan Mohamed Said Paşa, teorik olarak Osmanlı yönetimi altındaydı. 1822'de doğdu ve yeğeni Abbas Helmy I'in ölümünden sonra Temmuz 1854'te iktidara geldi. Fransız kültürüne olan eğilimiyle tanınıyordu; Ferdinand de Lesseps'e Süveyş Kanalı imtiyazını verdi, Özel Mülkiyet Yasası'nı yürürlüğe koydu ve 1858'de devletin ürün üzerindeki tekelinin kaldırılmasını sağladı. 17 Ocak 1863'te İskenderiye'de öldü ve yerine İsmail geçti {cite:Encyclopaedia-of-Islam-2 cilt 8 s. 924}."
  id: "Mohamed Said Pasha, putra bungsu Muhammad Ali Pasha dan gubernur turun-temurun Mesir dari tahun 1854 hingga 1863, secara teori berada di bawah kekuasaan Ottoman. Ia lahir pada tahun 1822 dan mengambil alih kekuasaan pada Juli 1854 setelah kematian keponakannya Abbas Helmy I. Ia dikenal karena kecenderungannya terhadap budaya Prancis, memberikan konsesi Terusan Suez kepada Ferdinand de Lesseps, memberlakukan Undang-Undang Kepemilikan Pribadi, dan menghapus monopoli negara atas tanaman pada tahun 1858. Ia meninggal di Alexandria pada 17 Januari 1863, dan digantikan oleh Ismail {cite:Encyclopaedia-of-Islam-2 vol. 8 hlm. 924}."
