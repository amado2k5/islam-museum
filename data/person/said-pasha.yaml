kids:
  ar: "سعيد باشا حكم مصر قبل نحو مئة وسبعين سنة، وهو الذي سمح بحفر قناة السويس."
  en: "Sa'id Pasha ruled Egypt about a hundred and seventy years ago, and it was he who allowed the Suez Canal to be dug."
