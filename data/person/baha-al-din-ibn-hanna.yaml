summary:
  ar: "الوزير الأوحد، من رجال الدهر حزماً ورأياً وجلالةً ونبلاً وقياماً بأعباء الأمور مع الدين والعفة؛ توزر للملك الظاهر ولولده السعيد، وكان لا يقبل لأحد هدية إلا أن يكون من الفقراء والصلحاء للتبرك، وكان من حسنات الزمان، وبنى مدرسةً بزقاق القناديل بمصر، وابتلي بفقد ولديه الصدرين فخر الدين ومحيي الدين فصبر وتجلد {cite:shadharat-dhahab p. 624-625}."
  en: "Baybars's and al-Sa'id's peerless vizier — 'of the day's men for resolve and judgement', taking gifts only from the pious poor for blessing; founder of the Zuqaq al-Qanadil madrasa, who bore the loss of both his sons; d. Dhu al-Qa'da 677 at 74 {cite:shadharat-dhahab p. 624-625}."
