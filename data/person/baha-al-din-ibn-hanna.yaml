summary:
  ar: "الوزير الأوحد، من رجال الدهر حزماً ورأياً وجلالةً ونبلاً وقياماً بأعباء الأمور مع الدين والعفة؛ توزر للملك الظاهر ولولده السعيد، وكان لا يقبل لأحد هدية إلا أن يكون من الفقراء والصلحاء للتبرك، وكان من حسنات الزمان، وبنى مدرسةً بزقاق القناديل بمصر، وابتلي بفقد ولديه الصدرين فخر الدين ومحيي الدين فصبر وتجلد {cite:shadharat-dhahab p. 624-625}."
  en: "Baybars's and al-Sa'id's peerless vizier — 'of the day's men for resolve and judgement', taking gifts only from the pious poor for blessing; founder of the Zuqaq al-Qanadil madrasa, who bore the loss of both his sons; d. Dhu al-Qa'da 677 at 74 {cite:shadharat-dhahab p. 624-625}."
  es: "Visir sin igual de Baybars y al-Sa'id, «uno de los hombres de la época por su resolución y juicio», que solo aceptaba regalos de los pobres piadosos como bendición; fundador de la madrasa Zuqaq al-Qanadil, que sufrió la pérdida de sus dos hijos; murió en Dhu al-Qa'da 677 a las 74 {cita: shadharat-dhahab págs. 624-625}."
  fr: "Le vizir sans égal de Baybars et d'al-Sa'id — « parmi les hommes de son temps pour sa résolution et son jugement », ne prenant de dons que des pauvres pieux pour les bénir; fondateur de la madrasa Zuqaq al-Qanadil, qui supporta la perte de ses deux fils; d. Dhu al-Qa'da 677 à 74 {cite: shadharat-dhahab p. 624-625}."
  ur: "بیبرس اور السعید کے بے مثال وزیر - 'عزم اور فیصلہ کے لئے دن کے آدمیوں کا'، برکت کے لئے صرف نیک غریبوں سے تحفہ لینا؛ ذوق القنادل مدرسہ کا بانی، جس نے اپنے دونوں بیٹوں کا نقصان برداشت کیا۔ d ذوالقعدہ ص 677 ص 74 624-625}۔"
