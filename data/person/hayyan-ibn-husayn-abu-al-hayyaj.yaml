gender: male
summary:
  ar: حيان بن حصين أبو الهياج الأسدي الكوفي، من التابعين. روى عن علي وعمار، وروى عنه ابناه جرير ومنصور وأبو وائل والشعبي. ذكره ابن حبان في الثقات، وقال العجلي إنه تابعي ثقة، وقال ابن عبد البر إنه كان كاتب عمار. ولم يذكر المصدر تاريخ وفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5493} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5494}
  en: Hayyan ibn Husayn Abu al-Hayyaj al-Asadi of Kufa, a Successor. He related from Ali and Ammar, and his sons Jarir and Mansur, Abu Wa'il and al-Sha'bi related from him. Ibn Hibban counted him among the trustworthy, al-Ijli called him a trustworthy Successor, and Ibn Abd al-Barr said he was Ammar's secretary. The book gives no date of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5493} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5494}
  ur: حیان بن حصین ابو الہیاج اسدی، کوفہ کے تابعی۔ انہوں نے علی اور عمار سے روایت کیا، اور ان سے ان کے بیٹوں جریر اور منصور، ابو وائل اور شعبی نے روایت کیا۔ ابن حبان نے انہیں ثقات میں ذکر کیا، عجلی نے تابعی ثقہ کہا، اور ابن عبد البر کے مطابق وہ عمار کے کاتب تھے۔ کتاب میں ان کی وفات کی تاریخ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5493} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5494}
