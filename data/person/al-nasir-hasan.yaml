summary:
  ar: "الملك الناصر ناصر الدين أبو المعالي حسن بن محمد بن قلاوون، التاسع عشر من سلاطين المماليك الأتراك في مصر، تولى السلطنة صبياً سنة 748هـ/1347م بعد مقتل أخيه المظفر حاجي، ثم خُلع سنة 752هـ وأُعيد سنة 755هـ تحت سطوة الأميرين شيخو وصرغتمش. انفرد بالحكم بعد القبض على صرغتمش سنة 759هـ، وبنى مدرسته الكبرى تجاه قلعة الجبل، وقتله مملوكه يلبغا العمري سنة 762هـ/1361م {cite:encyclopaedia-of-islam-2 vol. 7 p. 1047} {cite:nujum-zahira 10/187}."
  en: "Al-Malik al-Nasir Nasir al-Din Abu al-Ma'ali Hasan ibn Muhammad ibn Qalawun was the nineteenth Turkish Mamluk sultan of Egypt. He was enthroned as a boy in 748/1347 after the killing of his brother al-Muzaffar Hajji, deposed in 752, and restored in 755 under the sway of the amirs Shaykhu and Sarghitmish. He ruled alone after arresting Sarghitmish in 759, built his great madrasa facing the Citadel of Cairo, and was killed by his own mamluk Yalbugha al-Umari in 762/1361 {cite:encyclopaedia-of-islam-2 vol. 7 p. 1047} {cite:nujum-zahira 10/187}."
  ur: "الملک الناصر ناصر الدین ابو المعالی حسن بن محمد بن قلاوون مصر کے انیسویں ترک مملوک سلطان تھے۔ وہ اپنے بھائی المظفر حاجی کے قتل کے بعد 748ھ/1347ء میں بچپن میں تخت نشین ہوئے، 752ھ میں معزول ہوئے اور 755ھ میں امیر شیخو اور صرغتمش کے زور تلے دوبارہ بحال ہوئے۔ 759ھ میں صرغتمش کی گرفتاری کے بعد وہ تنہا حکمران رہے، قلعہ قاہرہ کے سامنے اپنا عظیم مدرسہ بنوایا، اور 762ھ/1361ء میں اپنے ہی مملوک یلبغا العمری کے ہاتھوں قتل ہوئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 1047} {cite:nujum-zahira 10/187}."
