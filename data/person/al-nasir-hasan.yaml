kids:
  ar: "السلطان حسن حكم مصر وهو صبي، وبنى مسجداً ومدرسة ضخمة في القاهرة ما زالت قائمة حتى اليوم."
  en: "Sultan Hasan became ruler of Egypt as a boy and built a huge mosque and school in Cairo that still stands today."
