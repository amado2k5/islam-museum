roles: [scholar, jurist]
gender: male
summary:
  ar: "محمد بن محمد بن أبي بكر بن علي بن أبي شريف المقدسي، أبو المعالي، كمال الدين، ابن الأمير ناصر الدين، عالم بالأصول من فقهاء الشافعية، مولده ووفاته ببيت المقدس، له «الدرر اللوامع بتحرير جمع الجوامع» و«المسامرة على المسايرة»، توفي سنة 906 هـ."
  en: "Muhammad ibn Muhammad ibn Abi Bakr ibn Ali ibn Abi Sharif al-Maqdisi, Abu al-Ma'ali, Kamal al-Din, son of the Amir Nasir al-Din, a Shafi'i scholar of legal theory, born and died in Jerusalem; author of al-Durar al-Lawami' and al-Musamara; died 906 AH (1501)."
  es: "Muhammad ibn Muhammad ibn Abi Bakr ibn Ali ibn Abi Sharif al-Maqdisi, Abu al-Ma'ali, Kamal al-Din, hijo del Amir Nasir al-Din, un erudito shafi'i en teoría jurídica, nacido y muerto en Jerusalén; autor de al-Durar al-Lawami' y al-Musamara; murió en el año 906 d. H. (1501)."
  fr: "Muhammad ibn Muhammad ibn Abi Bakr ibn Ali ibn Abi Sharif al-Maqdisi, Abu al-Ma'ali, Kamal al-Din, fils de l'émir Nasir al-Din, érudit shafi'i en théorie juridique, né et mort à Jérusalem; auteur d'al-Durar al-Lawami' et d'al-Musamara; décédé en 906 AH (1501)."
