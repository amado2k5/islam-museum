summary:
  ar: "فيلسوف ومصلح ديني إيراني، وُلد سنة 1945. اشتهر بنظرية «القبض والبسط» في المعرفة الدينية ودفاعه عن الديمقراطية الدينية، ومن كتبه «قبض وبسط نظرية الشريعة» و«بسط تجربه نبوي»."
  en: "Iranian philosopher and religious reformist, born in 1945. Famous for his contraction-and-expansion theory of religious knowledge and his advocacy of religious democracy, authoring The Contraction and Expansion of Religious Knowledge and The Expansion of Prophetic Experience."
  fr: "Philosophe et réformiste religieux iranien, né en 1945. Connu pour sa théorie de la contraction et de l'expansion de la connaissance religieuse et sa défense de la démocratie religieuse, il est l'auteur de La Contraction et l'expansion de la connaissance religieuse et de L'Expansion de l'expérience prophétique."
  ur: "ایرانی فلسفی اور مذہبی مصلح، 1945 میں پیدا ہوئے۔ وہ دینی علم کے قبض و بسط کے نظریے اور مذہبی جمہوریت کی وکالت کے لیے مشہور ہیں؛ کتب میں قبض و بسطِ نظریۂ شریعت اور بسطِ تجربۂ نبوی شامل ہیں۔"
  es: "Filósofo y reformista religioso iraní, nacido en 1945. Famoso por su teoría de la contracción y expansión del conocimiento religioso y su defensa de la democracia religiosa, es autor de *La contracción y expansión del conocimiento religioso* y *La expansión de la experiencia profética*."
  tr: "1945 doğumlu İranlı bir filozof ve din reformcusu. Din bilgisinde \"daralma ve genişleme\" teorisi ve din demokrasisini savunmasıyla ünlüdür. Kitapları arasında \"Şeriat Teorisinin Daralması ve Genişlemesi\" ve \"Peygamberlik Deneyiminin Genişlemesi\" yer almaktadır."
  id: "Seorang filsuf dan reformis agama Iran, lahir pada tahun 1945. Ia terkenal dengan teorinya tentang \"kontraksi dan ekspansi\" dalam pengetahuan agama dan pembelaannya terhadap demokrasi agama. Di antara buku-bukunya adalah \"Kontraksi dan Ekspansi Teori Syariah\" dan \"Ekspansi Pengalaman Kenabian.\""
