  ar: "فيلسوف ومصلح ديني إيراني، وُلد سنة 1945. اشتهر بنظرية «القبض والبسط» في المعرفة الدينية ودفاعه عن الديمقراطية الدينية، ومن كتبه «قبض وبسط نظرية الشريعة» و«بسط تجربه نبوي»."
