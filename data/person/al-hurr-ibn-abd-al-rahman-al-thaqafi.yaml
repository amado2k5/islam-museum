label: { ar: "الحر بن عبد الرحمن الثقفي", en: "al-Hurr ibn Abd al-Rahman al-Thaqafi", es: "al-Hurr ibn Abd al-Rahman al-Thaqafi", fr: "al-Hurr ibn Abd al-Rahman al-Thaqafi", ur: "الحر بن عبدالرحمن الثقفی" }
gender: male
roles: [emir]
summary:
  ar: "والٍ على الأندلس، نقل مقر الإمارة من إشبيلية حيث كان يحكم عبد العزيز بن موسى إلى قرطبة، وغزا بلاد الفرنجة ونواحي أربونة فسبى وغنم وعاد بالأسرى والغنائم، وانشغاله بالغزو في الشمال الشرقي أتاح لمقاومة بلاي في الشمال الغربي أن تنتعش، فعاد إلى قتالها قبل أن يعزله عمر بن عبد العزيز {cite:salabi-umayyad-state-2020 p.83-84}."
  en: "Governor of al-Andalus, who moved the seat of government from Seville, where Abd al-Aziz ibn Musa had ruled, to Cordova. He raided the lands of the Franks and the districts of Narbonne, taking captives and booty, and returned with the prisoners and spoils. His preoccupation with raiding in the north-east allowed Pelayo's resistance in the north-west to revive, so he went back to fighting it before Umar ibn Abd al-Aziz dismissed him {cite:salabi-umayyad-state-2020 p.83-84}."
  es: "Gobernador de al-Ándalus, trasladó la sede del gobierno de Sevilla, donde había gobernado Abd al-Aziz ibn Musa, a Córdoba. Saqueó las tierras de los francos y los distritos de Narbona, capturando prisioneros y saqueando, y regresó con los prisioneros y el botín. Su dedicación a las incursiones en el noreste permitió que la resistencia de Pelayo se reavivara en el noroeste, por lo que volvió a combatirla antes de que Umar ibn Abd al-Aziz lo destituyera {cite:salabi-umayyad-state-2020 p.83-84}."
  fr: "Gouverneur d'al-Andalus, il transféra le siège du gouvernement de Séville, où régnait Abd al-Aziz ibn Musa, à Cordoue. Il pilla les terres des Francs et les districts de Narbonne, faisant prisonniers et s'emparant du butin, qu'il ramena ensuite. Son obsession pour les raids au nord-est permit à la résistance de Pélayo au nord-ouest de se raviver; il reprit donc le combat avant d'être destitué par Umar ibn Abd al-Aziz (source: salabi-umayyad-state-2020, p. 83-84)."
  ur: "الاندلس کا گورنر، جس نے حکومت کی نشست سیویل سے، جہاں عبد العزیز ابن موسیٰ نے حکومت کی تھی، کو کورڈووا منتقل کر دیا۔ اس نے فرانکس کی زمینوں اور ناربون کے اضلاع پر چھاپہ مارا، اسیر اور مال غنیمت لے کر قیدیوں اور مال غنیمت کے ساتھ واپس لوٹا۔ شمال مشرق میں چھاپہ مارنے کی اس کی مصروفیت نے شمال مغرب میں پیلیو کی مزاحمت کو دوبارہ زندہ کرنے کا موقع دیا، لہذا عمر بن عبدالعزیز کی جانب سے اسے برطرف کرنے سے پہلے وہ اس سے لڑنے کے لیے واپس چلا گیا۔"
