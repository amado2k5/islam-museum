summary:
  ar: "والٍ على الأندلس، نقل مقر الإمارة من إشبيلية حيث كان يحكم عبد العزيز بن موسى إلى قرطبة، وغزا بلاد الفرنجة ونواحي أربونة فسبى وغنم وعاد بالأسرى والغنائم، وانشغاله بالغزو في الشمال الشرقي أتاح لمقاومة بلاي في الشمال الغربي أن تنتعش، فعاد إلى قتالها قبل أن يعزله عمر بن عبد العزيز {cite:salabi-umayyad-state-2020 p.83-84}."
  en: "Governor of al-Andalus, who moved the seat of government from Seville, where Abd al-Aziz ibn Musa had ruled, to Cordova. He raided the lands of the Franks and the districts of Narbonne, taking captives and booty, and returned with the prisoners and spoils. His preoccupation with raiding in the north-east allowed Pelayo's resistance in the north-west to revive, so he went back to fighting it before Umar ibn Abd al-Aziz dismissed him {cite:salabi-umayyad-state-2020 p.83-84}."
