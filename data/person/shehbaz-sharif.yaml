summary:
  ar: "سياسي ورجل أعمال باكستاني (وُلد 1951)، رئيس وزراء باكستان منذ مارس 2024 وسابقا من أبريل 2022 إلى أغسطس 2023، ورئيس وزراء البنجاب الأطول خدمة لثلاث ولايات (1997–1999 و2008–2013 و2013–2018). وهو الشقيق الأصغر لرئيس الوزراء ثلاث مرات نواز شريف، ورئيس سابق للرابطة الإسلامية الباكستانية (ن)."
  en: "Pakistani politician and businessman (born 1951), prime minister of Pakistan since March 2024 and previously from April 2022 to August 2023, and the longest-serving chief minister of Punjab across three terms (1997–1999, 2008–2013, 2013–2018). He is the younger brother of three-time prime minister Nawaz Sharif and a former president of the Pakistan Muslim League (N)."
  ur: "پاکستانی سیاست دان اور تاجر (پیدائش 1951ء)، مارچ 2024ء سے پاکستان کے وزیرِ اعظم اور اس سے قبل اپریل 2022ء سے اگست 2023ء تک اسی عہدے پر فائز، اور تین ادوار (1997ء–1999ء، 2008ء–2013ء، 2013ء–2018ء) میں پنجاب کے سب سے طویل عرصے تک رہنے والے وزیرِ اعلیٰ۔ وہ تین بار کے وزیرِ اعظم نواز شریف کے چھوٹے بھائی اور پاکستان مسلم لیگ (ن) کے سابق صدر ہیں۔"
