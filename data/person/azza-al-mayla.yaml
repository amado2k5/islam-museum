summary:
  ar: "عزة الميلاء، مولاة للأنصار بالمدينة، من أقدم من غنى الغناء الموقَّع من النساء بالحجاز ومن أحسنهن ضرباً بالعود، أخذت عن رائقة وعن نشيط وسائب خاثر، وتعلم منها ابن سريج وابن محرز، ووصفها طويس بسيدة من غنى من النساء مع إسلام لا يشوبه دنس."
  en: "Azza al-Mayla', a client of the Ansar in Medina, among the earliest women in the Hijaz to sing measured song and among the finest lute players; she learned from Ra'iqa and from Nashit and Sa'ib Khathir, taught Ibn Surayj and Ibn Muhriz, and Tuways called her the mistress of all women singers, with an Islam free of blemish."
