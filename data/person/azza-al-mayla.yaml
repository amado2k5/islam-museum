gender: female
roles: [musician]
summary:
  ar: "عزة الميلاء، مولاة للأنصار بالمدينة، من أقدم من غنى الغناء الموقَّع من النساء بالحجاز ومن أحسنهن ضرباً بالعود، أخذت عن رائقة وعن نشيط وسائب خاثر، وتعلم منها ابن سريج وابن محرز، ووصفها طويس بسيدة من غنى من النساء مع إسلام لا يشوبه دنس."
  en: "Azza al-Mayla', a client of the Ansar in Medina, among the earliest women in the Hijaz to sing measured song and among the finest lute players; she learned from Ra'iqa and from Nashit and Sa'ib Khathir, taught Ibn Surayj and Ibn Muhriz, and Tuways called her the mistress of all women singers, with an Islam free of blemish."
  es: "Azza al-Mayla', clienta de los Ansar en Medina, fue una de las primeras mujeres del Hiyaz en cantar canciones mesuradas y una de las mejores intérpretes de laúd; aprendió de Ra'iqa, de Nashit y de Sa'ib Khathir, enseñó a Ibn Surayj e Ibn Muhriz, y Tuways la llamó la maestra de todas las cantantes, con un Islam libre de defectos."
  fr: "Azza al-Mayla', cliente des Ansar à Médine, fut l'une des premières femmes du Hedjaz à chanter des chants mesurés et l'une des meilleures joueuses de luth; elle apprit de Ra'iqa, de Nashit et de Sa'ib Khathir, enseigna à Ibn Surayj et à Ibn Muhriz, et les Tuways la surnommèrent la maîtresse de toutes les chanteuses, avec un islam sans tache."
  ur: "عزاء المائلہ، مدینہ میں انصار کی ایک گاہک، حجاز کی سب سے قدیم خواتین میں سے جو ناپے ہوئے گانا گاتی ہیں اور بہترین موسیقی بجانے والوں میں۔ اس نے رقیہ سے اور ناشیت اور سائب خاطر سے سیکھا، ابن سریج اور ابن محریز سے سیکھا، اور طویس نے اسے تمام خواتین گلوکاروں کی مالکن کہا، جس کا اسلام بے عیب ہے۔"
  tr: "Medine'deki Ensar'ın sadık bir hizmetkârı, Hicaz kadınları arasında en yaşlı şarkıcılardan biri ve ud çalmada en iyilerden biri olan Azza al-Milā, Raika'dan, aktif ve aktif gezginlerden gelmişti ve İbn Surayj ile İbn Mahraz onlardan ders almıştır. Tuwais, onu en zengin kadınlardan biri olarak tanımlamıştır ve saf bir İslam'a sahiptir."
  id: "Azza al-Milā, seorang pelayan setia Ansar di Madinah, salah satu penyanyi tertua di antara wanita Hijaz dan salah satu yang terbaik dalam permainan oud, berasal dari Raiqa, dari para pelancong aktif dan aktif, dan dari siapa Ibn Surayj dan Ibn Mahraz belajar. Tuwais menggambarkannya sebagai wanita di antara wanita terkaya dengan Islam yang murni."
