summary:
  ar: "في-في لي (وُلدت 3 يوليو 1976) عالمة حاسوب أمريكية من أصل صيني، أستاذة في جامعة ستانفورد ومؤسِّسة قاعدة بيانات إيماج نت التي أحدثت نقلة في الرؤية الحاسوبية والذكاء الاصطناعي. وُلدت في بكين ونشأت في تشنغدو ثم هاجرت إلى الولايات المتحدة مراهقةً، وشاركت في تأسيس معهد ستانفورد للذكاء الاصطناعي المتمحور حول الإنسان ومنظمة AI4ALL، وأسست شركة وورلد لابز سنة 2024."
  en: "Fei-Fei Li (born 3 July 1976) is a Chinese-American computer scientist, a professor at Stanford University and the creator of ImageNet, the dataset that enabled rapid advances in computer vision and artificial intelligence in the 2010s. Born in Beijing and raised in Chengdu, she emigrated to the United States as a teenager, co-founded the Stanford Institute for Human-Centered Artificial Intelligence and the nonprofit AI4ALL, and founded the spatial-intelligence company World Labs in 2024."
  ur: "فی-فی لی (پیدائش 3 جولائی 1976ء) چینی نژاد امریکی کمپیوٹر سائنس دان ہیں، اسٹینفورڈ یونیورسٹی کی پروفیسر اور امیج نیٹ کی بانی، جس ڈیٹا سیٹ نے کمپیوٹر وژن اور مصنوعی ذہانت میں تیز پیش رفت ممکن بنائی۔ وہ بیجنگ میں پیدا ہوئیں، چینگدو میں پلی بڑھیں اور نوجوانی میں امریکا منتقل ہو گئیں؛ انہوں نے اسٹینفورڈ کے انسانی محور مصنوعی ذہانت کے ادارے اور غیر منفعتی تنظیم AI4ALL کی شراکت سے بنیاد رکھی اور 2024ء میں ورلڈ لیبز قائم کی۔"
