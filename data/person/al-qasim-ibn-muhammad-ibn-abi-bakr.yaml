summary:
  ar: "بطاقة أولية للقاسم بن محمد بن أبي بكر، فقيه المدينة من السبعة وناقل الحديث في القرن الثامن، توفي نحو سنة ٧٣٠م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for al-Qasim ibn Muhammad ibn Abi Bakr, the Medinan jurist counted among the Seven and a hadith transmitter of the eighth century, d. about 730; the biographical entry is not yet checked on the page."
  fr: "Projet de carte pour al-Qasim ibn Muhammad ibn Abi Bakr, le juriste médinois compté parmi les Sept et un émetteur de hadith du VIIIe siècle, d. environ 730 ; l'entrée biographique n'est pas encore vérifiée sur la page."
  es: "Ficha de borrador para al-Qasim ibn Muhammad ibn Abi Bakr, el jurista medinense incluido entre los Siete y transmisor de hadices del siglo VIII, fallecido alrededor del año 730; la entrada biográfica aún no ha sido verificada en la página."
  ur: "القاسم بن محمد ابن ابی بکر کے لیے ڈرافٹ کارڈ، مدینہ کے ساتوں میں شمار ہونے والے فقیہ اور آٹھویں صدی کے ایک حدیث کی ترسیل کرنے والے، ڈی۔ تقریباً 730؛ سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Medine'nin yedinci hukukçusu ve sekizinci yüzyılda hadis ileticisi olan el-Kasım ibn Muhammed bin Ebu Bekir'in ön kartı, yaklaşık M.S. 730'da vefat etmiştir; biyografik kitaplarda kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan al-Qasim ibn Muhammad ibn Abi Bakr, ahli hukum Madinah dari Tujuh dan penyampai hadis pada abad kedelapan, yang meninggal sekitar tahun 730 M; buku biografi menyebutkannya dan biografinya belum ditinjau di halaman."
