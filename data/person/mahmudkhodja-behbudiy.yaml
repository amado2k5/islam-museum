summary:
  ar: "محمودخوجا بهبودي (1875–1919)، كاتب وناشر أوزبكي من قادة الجديدية في تركستان الروسية، أصدر مجلة «آيينه» وصحيفة «سمرقند» وكتب أول مسرحية عصرية في آسيا الوسطى «بادركوش»، وكان قاضيًا ومفتيًا في سمرقند، فاعتُقل وأُعدم في قرشي سنة 1919."
  en: "Mahmudkhodja Behbudiy (1875–1919) was an Uzbek writer and publisher, a leader of Jadidism in Russian Turkestan, who issued the magazine Ayina and the newspaper Samarkand, wrote the first modern Central Asian play, Padarkush, served as qadi and mufti in Samarkand, and was arrested and executed at Qarshi in 1919."
  ur: "محمود خواجہ بہبودی (1875–1919) ازبک مصنف اور ناشر، روسی ترکستان میں جدیدیت کے رہنماؤں میں سے تھے؛ انہوں نے رسالہ «آئینہ» اور اخبار «سمرقند» جاری کیا، وسطی ایشیا کا پہلا جدید ڈراما «پدرکش» لکھا، سمرقند میں قاضی اور مفتی رہے، اور 1919 میں قرشی میں گرفتار کر کے پھانسی دیے گئے۔"
