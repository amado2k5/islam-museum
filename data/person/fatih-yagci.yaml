summary:
  ar: "قيادي إعلامي ديني تركي، الوجه العلني لجمعية «سوزلر كوشكو» للعلم والثقافة وقائد نموّها؛ بدأت الجمعية قناتها التركية على يوتيوب سنة 2011 بمبادرة شباب من محيط قرّاء «رسائل النور»، ثم أطلقت قناتها الإنجليزية «نحو الأبدية» (Towards Eternity) التي تنشر محتواها بأكثر من عشر لغات وبلغت نحو مليون وستمائة ألف مشترك بحسب الجمعية."
  en: "A Turkish religious-media leader, the public face of the Sözler Köşkü Science and Culture Association and the man under whose leadership it grew. The association began its Turkish YouTube channel in 2011, started by young men from the Risale-i Nur reading milieu, and later launched its English channel Towards Eternity, which publishes in more than ten languages and reached about 1.6 million subscribers by the association's own account."
  ur: "ترک دینی میڈیا رہنما، «سوزلر کوشکو» علمی و ثقافتی انجمن کے عوامی چہرے اور اس کی ترقی کے قائد؛ انجمن نے 2011 میں اپنا ترک یوٹیوب چینل شروع کیا — یہ رسالۂ نور کے قارئین کے حلقے کے نوجوانوں کی کاوش تھی — اور بعد میں اپنا انگریزی چینل «ٹوارڈز ایٹرنٹی» (Towards Eternity) شروع کیا جو دس سے زائد زبانوں میں مواد نشر کرتا ہے اور انجمن کے اپنے بیان کے مطابق تقریباً 1.6 ملین سبسکرائبرز تک پہنچا۔"
