summary:
  ar: "الأمير بدر المعتضدي، مولى الخليفة المعتضد ومقدم جيوشه، ولي لمولاه إمرة دمشق وأصبهان وكان عادلا حسن السيرة، وغدر به المكتفي فقتل صبرا سنة 289 هـ."
  en: "The amir Badr al-Mu'tadidi, freedman of the caliph al-Mu'tadid and commander of his armies, who governed Damascus and Isbahan for his master and was just and of good conduct; al-Muktafi betrayed him and he was killed in 289 AH (902)."
  es: "El emir Badr al-Mu'tadidi, liberto del califa al-Mu'tadid y comandante de sus ejércitos, que gobernó Damasco e Isbahan para su señor y era justo y de buena conducta; al-Muktafi lo traicionó y fue asesinado en el año 289 de la Hégira (902 d. C.)."
  fr: "L'émir Badr al-Mu'tadidi, affranchi du calife al-Mu'tadid et commandant de ses armées, qui gouvernait Damas et Isbahan pour son maître et était juste et de bonne conduite; al-Muktafi le trahit et il fut tué en 289 AH (902)."
