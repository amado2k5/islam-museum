summary:
  ar: "مغنّي راب ومنتج أمريكي، اسمه الأصلي روبرت فيتزجيرالد ديغز، وُلد في حيّ براونزفيل ببروكلين في 5 يوليو 1969. أسّس فرقة «وو-تانغ كلان» وقاد إنتاجها، وأصدر ألبومات منفردة باسم «بوبي ديجيتال»، وألّف موسيقى فيلمي «اقتل بيل» (2003–2004)، وأخرج فيلم «الرجل ذو القبضتين الحديديتين» (2012)."
  en: "American rapper and producer, born Robert Fitzgerald Diggs in the Brownsville neighbourhood of Brooklyn on 5 July 1969. He founded the Wu-Tang Clan and led its production, released solo albums under the alter ego Bobby Digital, composed the scores for Kill Bill: Volume 1 (2003) and Volume 2 (2004), and directed The Man with the Iron Fists (2012)."
  ur: "امریکی ریپر و پروڈیوسر، اصل نام رابرٹ فٹزجیرالڈ ڈگز، جو 5 جولائی 1969 کو بروکلین کے براؤنزویل محلے میں پیدا ہوئے۔ انہوں نے «وو ٹینگ کلین» کی بنیاد رکھی اور اس کی پروڈکشن کی قیادت کی، «بابی ڈیجیٹل» کے نام سے سولو البم جاری کیے، فلموں «کل بل» (2003–2004) کی موسیقی ترتیب دی، اور فلم «دی مین وتھ دی آئرن فسٹس» (2012) کی ہدایت کاری کی۔"
