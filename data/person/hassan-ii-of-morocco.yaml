summary:
  ar: "ملك المغرب من سنة 1961 إلى وفاته سنة 1999. وُلد في الرباط سنة 1929 وهو الابن الأكبر لمحمد الخامس، رافق والده في المنفى وشارك في مفاوضات الاستقلال، وخلفه على العرش سنة 1961، فأصدر أول دستور للمملكة سنة 1962، ونجا من محاولتي انقلاب سنتي 1971 و1972، ونظّم المسيرة الخضراء سنة 1975، وتوفي في الرباط فخلفه ابنه محمد السادس."
  en: "King of Morocco from 1961 until his death in 1999. Born at Rabat in 1929, the eldest son of Mohammed V, he accompanied his father in exile and took part in the independence negotiations, succeeded him on the throne in 1961, promulgated the kingdom's first constitution in 1962, survived the coup attempts of 1971 and 1972, organized the Green March of 1975, and died at Rabat, succeeded by his son Mohammed VI."
  ur: "1961 سے 1999 میں اپنی وفات تک مراکش کے بادشاہ۔ وہ 1929 میں رباط میں پیدا ہوئے، محمد الخامس کے سب سے بڑے بیٹے تھے، جلاوطنی میں والد کے ساتھ رہے اور آزادی کے مذاکرات میں شریک ہوئے، 1961 میں ان کے جانشین بنے، 1962 میں مملکت کا پہلا آئین جاری کیا، 1971 اور 1972 کی بغاوتوں سے بچ نکلے، 1975 میں سبز مارچ کا اہتمام کیا، اور رباط میں وفات پائی؛ ان کے جانشین ان کے بیٹے محمد سادس بنے۔"
  es: "Rey de Marruecos desde 1961 hasta su muerte en 1999. Nacido en Rabat en 1929, hijo mayor de Mohammed V, acompañó a su padre en el exilio y participó en las negociaciones de independencia, le sucedió en el trono en 1961, promulgó la primera constitución del reino en 1962, sobrevivió a los intentos de golpe de Estado de 1971 y 1972, organizó la Marcha Verde de 1975 y murió en Rabat, siendo sucedido por su hijo Mohammed VI."
  fr: "Roi du Maroc de 1961 jusqu'à sa mort en 1999. Né à Rabat en 1929, fils aîné de Mohammed V, il accompagna son père en exil et participa aux négociations d'indépendance, lui succéda sur le trône en 1961, promulgua la première constitution du royaume en 1962, survécut aux tentatives de coup d'État de 1971 et 1972, organisa la Marche verte de 1975 et mourut à Rabat, son fils Mohammed VI lui succédant."
  tr: "1961'den 1999'daki ölümüne kadar Fas Kralı oldu. 1929'da Rabat'ta doğdu ve Muhammed V'nin en büyük oğludur. Babası sürgüne eşlik etti ve bağımsızlık müzakerelerine katıldı, 1961'de tahta geçti. Krallığın ilk anayasasını 1962'de çıkardı, 1971 ve 1972'deki darbe girişimlerinden sağ çıktı, 1975'te Yeşil Yürüyüş'ü organize etti ve Rabat'ta öldü; yerine oğlu Muhammed VI geçti."
  id: "Raja Maroko dari tahun 1961 hingga wafatnya pada tahun 1999. Ia lahir di Rabat pada tahun 1929 dan merupakan putra sulung Mohammed V. Ia mendampingi ayahnya dalam pengasingan dan ikut serta dalam negosiasi kemerdekaan, menggantikannya di tahta pada tahun 1961. Ia mengeluarkan konstitusi pertama kerajaan pada tahun 1962, selamat dari upaya kudeta pada tahun 1971 dan 1972, mengorganisir Green March pada tahun 1975, dan meninggal di Rabat, digantikan oleh putranya Mohammed VI."
