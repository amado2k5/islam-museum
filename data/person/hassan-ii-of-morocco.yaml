summary:
  ar: "ملك المغرب من سنة 1961 إلى وفاته سنة 1999. وُلد في الرباط سنة 1929 وهو الابن الأكبر لمحمد الخامس، رافق والده في المنفى وشارك في مفاوضات الاستقلال، وخلفه على العرش سنة 1961، فأصدر أول دستور للمملكة سنة 1962، ونجا من محاولتي انقلاب سنتي 1971 و1972، ونظّم المسيرة الخضراء سنة 1975، وتوفي في الرباط فخلفه ابنه محمد السادس."
  en: "King of Morocco from 1961 until his death in 1999. Born at Rabat in 1929, the eldest son of Mohammed V, he accompanied his father in exile and took part in the independence negotiations, succeeded him on the throne in 1961, promulgated the kingdom's first constitution in 1962, survived the coup attempts of 1971 and 1972, organized the Green March of 1975, and died at Rabat, succeeded by his son Mohammed VI."
  ur: "1961 سے 1999 میں اپنی وفات تک مراکش کے بادشاہ۔ وہ 1929 میں رباط میں پیدا ہوئے، محمد الخامس کے سب سے بڑے بیٹے تھے، جلاوطنی میں والد کے ساتھ رہے اور آزادی کے مذاکرات میں شریک ہوئے، 1961 میں ان کے جانشین بنے، 1962 میں مملکت کا پہلا آئین جاری کیا، 1971 اور 1972 کی بغاوتوں سے بچ نکلے، 1975 میں سبز مارچ کا اہتمام کیا، اور رباط میں وفات پائی؛ ان کے جانشین ان کے بیٹے محمد سادس بنے۔"
