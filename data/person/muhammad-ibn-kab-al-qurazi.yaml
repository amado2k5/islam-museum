summary:
  ar: "محمد بن كعب بن حيان بن سليم، أبو حمزة، وأبو عبد الله القرظي، المدني، تابعي من أئمة التفسير. قال ابن سعد إنه كان ثقة عالماً كثير الحديث ورعاً. حدّث عن عدد من الصحابة منهم أبو أيوب الأنصاري وأبو هريرة وزيد بن أرقم وابن عباس وجابر وأنس وابن عمر وغيرهم، وروى عنه أخوه عثمان ومحمد بن المنكدر وزيد بن أسلم والحكم بن عتيبة ويزيد بن الهاد وخلق كثير. واختُلف في سنة وفاته: قيل 117، وقيل 119، وقيل 120 للهجرة. روى له الجماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17468}"
  en: "Muhammad ibn Ka'b ibn Hayyan ibn Sulaym, Abu Hamza and Abu Abd Allah al-Qurazi, of Medina: a Successor and one of the leading imams of Qur'an exegesis. Ibn Sa'd called him trustworthy, learned, a frequent transmitter and pious. He transmitted from a number of Companions, among them Abu Ayyub al-Ansari, Abu Hurayra, Zayd ibn Arqam, Ibn Abbas, Jabir, Anas and Ibn Umar. His brother Uthman, Muhammad ibn al-Munkadir, Zayd ibn Aslam, al-Hakam ibn Utayba and Yazid ibn al-Had transmitted from him, and many others did too. His death is given as 117, 119 or 120 AH. The compilers of the canonical books transmitted from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17468}"
  es: "Muhammad ibn Ka'b ibn Hayyan ibn Sulaym, Abu Hamza y Abu Abd Allah al-Qurazi, de Medina: un Sucesor y uno de los principales imanes de la exégesis coránica. Ibn Sa'd lo llamó digno de confianza, erudito, transmisor frecuente y piadoso. Transmitió de varios Compañeros, entre ellos Abu Ayyub al-Ansari, Abu Hurayra, Zayd ibn Arqam, Ibn Abbas, Jabir, Anas e Ibn Umar. Su hermano Uthman, Muhammad ibn al-Munkadir, Zayd ibn Aslam, al-Hakam ibn Utayba y Yazid ibn al-Had transmitieron de él, y muchos otros también lo hicieron. Su muerte se sitúa en el año 117, 119 o 120 de la Hégira. Los compiladores de los libros canónicos transmitieron de él. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.17468}"
  fr: "Muhammad ibn Ka'b ibn Hayyan ibn Sulaym, Abu Hamza et Abu Abd Allah al-Qurazi, de Médine: successeur et l'un des plus éminents imams de l'exégèse coranique. Ibn Sa'd le qualifiait de digne de confiance, savant, prolifique transmetteur et pieux. Il transmit les enseignements de nombreux Compagnons, parmi lesquels Abu Ayyub al-Ansari, Abu Hurayra, Zayd ibn Arqam, Ibn Abbas, Jabir, Anas et Ibn Umar. Son frère Uthman, Muhammad ibn al-Munkadir, Zayd ibn Aslam, al-Hakam ibn Utayba et Yazid ibn al-Had, ainsi que beaucoup d'autres, reçurent également ses enseignements. Sa mort est datée de 117, 119 ou 120 AH. Les compilateurs des livres canoniques reçurent de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17468}"
  ur: "محمد بن کعب بن حیان بن سلیم، ابو حمزہ اور ابو عبد اللہ القرازی، مدینہ کے: جانشین اور تفسیر قرآن کے سرکردہ اماموں میں سے ایک۔ ابن سعد نے اسے ثقہ، عالم، کثرت سے نقل کرنے والا اور متقی قرار دیا۔ آپ نے متعدد صحابہ سے روایت کی جن میں ابو ایوب الانصاری، ابوہریرہ، زید بن ارقم، ابن عباس، جابر، انس اور ابن عمر ہیں۔ ان کے بھائی عثمان، محمد بن المنکدر، زید بن اسلم، الحکم بن عتیبہ اور یزید بن الحد نے ان سے روایت کی ہے، اور بہت سے دوسرے لوگوں نے بھی ایسا کیا۔ ان کی وفات 117، 119 یا 120 ہجری بتائی جاتی ہے۔ ان سے منقول کینونیکل کتب کے مرتب کرنے والے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص17468}"
  tr: "Muhammed ibn Ka'b ibn Hayyan ibn Sulaym, Ebu Hamza ve Medinanlı Ebu Abdullah el-Kuradhi, tefsir alanında önde gelen alimlerden Tabi'i olarak yer almıştır. İbn Sa'd, onun güvenilir, bilgili ve dindar biri olduğunu söylemiştir. Ebu Eyyüb el-Ensari, Ebu Huraira, Zeyd bin Arqam, İbn Abbas, Cebir, Anas, İbn Ömer ve diğerleri gibi birçok sahabeden rivayet etmiştir. Kardeşleri Osman Osman, Muhammed ibn el-Munkadir, Zeyd bin Aslam, el-Hakam ibn Utaybe, Yezid ibn al-Had ve daha birçok kişi ondan rivayet etmiştir. Ölüm yılı konusunda anlaşmazlıklar vardır: bazıları 117, bazıları 119, bazıları 120 Hicri der. Grup ondan rivayet etmiştir. {alıntı:) Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.17468}"
  id: "Muhammad ibn Ka'b ibn Hayyan ibn Sulaym, Abu Hamza, dan Abu Abdullah al-Quradhi, seorang Madinah, seorang Tabi'i di antara ulama utama tafsir. Ibn Sa'd mengatakan bahwa ia dapat dipercaya, berpengetahuan, dan taat. Ia menceritakan dari sejumlah sahabat, termasuk Abu Ayyub al-Ansari, Abu Huraira, Zayd ibn Arqam, Ibn Abbas, Jabir, Anas, Ibn Umar, dan lainnya. Saudara-saudaranya Uthman, Muhammad ibn al-Munkadir, Zayd ibn Aslam, al-Hakam ibn Utaybah, Yazid ibn al-Had, dan banyak lainnya menceritakan darinya. Ada perbedaan pendapat tentang tahun kematiannya: ada yang mengatakan 117, ada yang mengatakan 119, dan ada yang mengatakan 120 H. Kelompok tersebut menceritakan darinya. {cite:Fiqh-mawsua-Kuwaitiyya-noor-v3 p.17468}"
