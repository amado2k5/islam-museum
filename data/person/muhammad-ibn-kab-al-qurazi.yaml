summary:
  ar: "محمد بن كعب بن حيان بن سليم، أبو حمزة، وأبو عبد الله القرظي، المدني، تابعي من أئمة التفسير. قال ابن سعد إنه كان ثقة عالماً كثير الحديث ورعاً. حدّث عن عدد من الصحابة منهم أبو أيوب الأنصاري وأبو هريرة وزيد بن أرقم وابن عباس وجابر وأنس وابن عمر وغيرهم، وروى عنه أخوه عثمان ومحمد بن المنكدر وزيد بن أسلم والحكم بن عتيبة ويزيد بن الهاد وخلق كثير. واختُلف في سنة وفاته: قيل 117، وقيل 119، وقيل 120 للهجرة. روى له الجماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17468}"
  en: "Muhammad ibn Ka'b ibn Hayyan ibn Sulaym, Abu Hamza and Abu Abd Allah al-Qurazi, of Medina: a Successor and one of the leading imams of Qur'an exegesis. Ibn Sa'd called him trustworthy, learned, a frequent transmitter and pious. He transmitted from a number of Companions, among them Abu Ayyub al-Ansari, Abu Hurayra, Zayd ibn Arqam, Ibn Abbas, Jabir, Anas and Ibn Umar. His brother Uthman, Muhammad ibn al-Munkadir, Zayd ibn Aslam, al-Hakam ibn Utayba and Yazid ibn al-Had transmitted from him, and many others did too. His death is given as 117, 119 or 120 AH. The compilers of the canonical books transmitted from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17468}"
