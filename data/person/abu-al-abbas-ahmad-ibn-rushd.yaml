summary:
  ar: "فقيه قاضٍ قرطبي متفنن من بيت بني رشد، ابن ابن رشد الجد ووالد ابن رشد الحفيد؛ تفقه بأبيه ولازم أبا بكر البطليوسي وسمع من أبي محمد بن عتاب وابن مغيث وابني بقي وابن العربي والصدفي وابن تليد، وله برنامج وتفسير في أسفار وشرح على سنن النسائي؛ ولد سنة 487هـ وتوفي سنة 563هـ، بحسب ترجمة محمد صبحي حلاق نقلاً عن ابن أبي أصيبعة {cite:bidaya-hallaq-v1 p. 12}."
  en: "A versatile Cordoban jurist and judge of the Banu Rushd, son of Ibn Rushd al-Jadd and father of Ibn Rushd al-Hafid; he studied law with his father, attended Abu Bakr al-Batalyawsi and heard Abu Muhammad ibn Attab, Ibn Mughith, the two sons of Baqi, Ibn al-Arabi, al-Sadafi and Ibn Talid; he left a barnamaj (list of teachers), a Qur'an commentary in several volumes and a commentary on the Sunan of al-Nasa'i; born 487 AH, died 563 AH, according to Muhammad Subhi Hallaq citing Ibn Abi Usaybi'a."
  ur: "بنو رشد کے گھرانے کے ایک ہمہ جہت قرطبی فقیہ اور قاضی، ابن رشد الجد کے بیٹے اور ابن رشد الحفید کے والد؛ انہوں نے اپنے والد سے فقہ پڑھی، ابو بکر بطلیوسی کی صحبت اختیار کی اور ابو محمد بن عتاب، ابن مغیث، بقی کے دونوں بیٹوں، ابن العربی، الصدفی اور ابن تلید سے سنا؛ ان کا ایک برنامج، کئی جلدوں میں تفسیر اور سنن نسائی کی شرح ہے؛ ولادت 487ھ، وفات 563ھ، محمد صبحی حلاق کے مطابق جو ابن ابی اصیبعہ سے نقل کرتے ہیں۔"
