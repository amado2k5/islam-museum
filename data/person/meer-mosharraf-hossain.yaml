summary:
  ar: "روائي وكاتب مسرحي ومقالي بنغالي (1847-1912) من كوشتيا، رائد بين كتّاب مسلمي البنغال في القرن التاسع عشر وأحد أجود كتّاب النثر البنغالي. أول رواية له «راتنافاتي» (1869)، ورائعته «بيشاد سيندو» (1885-1891) ملحمة نثرية لمأساة كربلاء صارت من كلاسيكيات القراءة البنغالية، وله مسرحية «زميندار داربان» عن ثورة فلاحي سراج غنج وسيرته الذاتية «أمار جيباني»."
  en: "Bengali novelist, playwright and essayist (1847–1912) of Kushtia, a pioneer among nineteenth-century Bengali Muslim writers and one of the finest prose writers in Bengali. His first novel was Ratnavati (1869); his magnum opus Bishad Shindhu (1885–1891), the prose epic of the Karbala tragedy, became a popular Bengali classic; he also wrote the play Zamindar Darpan on the Sirajganj peasant uprising and the autobiography Amar Jibani."
  ur: "بنگالی ناول نگار، ڈراما نویس اور مضمون نگار (1847ء–1912ء) جن کا تعلق کشٹیا سے تھا؛ انیسویں صدی کے بنگالی مسلمان ادیبوں کے پیش رو اور بنگلہ نثر کے بہترین مصنفین میں سے ایک۔ ان کا پہلا ناول «رتناوتی» (1869ء) ہے اور شاہکار «بشاد سندھو» (1885ء–1891ء) سانحۂ کربلا کی نثری رزمیہ ہے جو بنگالی قارئین کی مقبول کلاسک بن گئی۔"
