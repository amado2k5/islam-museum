summary:
  ar: "فقيه وكاتب أندلسي من أهل إشبيلية ⁦(ت. 1134)⁩، عاش في النصف الثاني من القرن الخامس الهجري فشهد نهاية ملك المعتمد بن عباد وقيام دولة المرابطين. ينتسب إليه «رسالة في القضاء والحسبة»، من أقدم ما وصلنا في أدب الحسبة، حققها ليفي بروفنسال سنة 1955 وطُبعت سنة 2009. نقلت الدراسات عن شالميتا أنه ربما كان مرشحًا لخطة القضاء لا قاضيًا عاملًا. وليس هو عبد المجيد بن عبدون صاحب «القصيدة العبدونية» الشهيرة، فذلك شاعر آخر من بطليوس."
  en: "Andalusi jurist and writer of Seville (d. 1134) who lived in the second half of the 5th/11th century, witnessing the end of al-Mu'tamid's reign and the Almoravid takeover. He is the author of the Risala fi'l-qada' wa'l-hisba (Treatise on the Judiciary and Market Inspection), among the earliest surviving hisba manuals, edited by Levi-Provencal in 1955 and reprinted in 2009. Scholarship reports Chalmeta's argument that he may have been only a candidate for the qadiship, not a serving qadi. He is not Abd al-Majid ibn Abdun, the Badajoz poet of the famous Abduniyya qasida - a different man of a similar name."
  ur: "اشبیلیہ کے اندلسی فقیہ و مصنف ⁦(وفات 1134ء)⁩، پانچویں صدی ہجری کے نصفِ ثانی میں زیست؛ معتمد بن عباد کے عہد کا خاتمہ اور مرابطین کا قیام دیکھا۔ ان کی تصنیف «رسالہ فی القضاء والحسبہ» ادبِ حسبہ کی قدیم ترین باقی ماندہ کتابوں میں سے ہے، جسے 1955ء میں لیوی پروونسال نے مرتب کیا۔ محققین کے مطابق شاید وہ قاضی کے عہدے کے امیدوار تھے، عامل قاضی نہیں۔ یہ عبد المجید بن عبدون سے مختلف شخص ہیں، جو مشہور «قصیدہ عبدونیہ» کے بطلیوسی شاعر تھے۔"
  es: "Jurista y escritor andalusí de Sevilla (m. 1134) que vivió en la segunda mitad del siglo V/XI, presenciando el fin del reinado de al-Mu'tamid y la toma del poder por los almorávides. Es autor de la Risala fi'l-qada' wa'l-hisba (Tratado sobre el poder judicial y la inspección del mercado), uno de los manuales de hisba más antiguos que se conservan, editado por Levi-Provencal en 1955 y reeditado en 2009. La investigación académica recoge el argumento de Chalmeta de que pudo haber sido solo un candidato al cadí, no un cadí en funciones. No se trata de Abd al-Majid ibn Abdun, el poeta badajoz de la famosa qasida Abduniyya, sino de otro hombre con un nombre similar."
  fr: "Juriste et écrivain andalou de Séville (mort en 1134), ayant vécu dans la seconde moitié du Ve/XIe siècle, il fut témoin de la fin du règne d'al-Mu'tamid et de la prise de pouvoir des Almoravides. Il est l'auteur du *Risala fi'l-qada' wa'l-hisba* (Traité de la justice et de l'inspection du marché), l'un des plus anciens manuels de hisba conservés, édité par Levi-Provencal en 1955 et réédité en 2009. Selon les chercheurs, Chalmeta aurait avancé l'hypothèse qu'il n'aurait été qu'un candidat à la charge de cadi, et non un cadi en exercice. Il ne s'agit pas d'Abd al-Majid ibn Abdun, le poète de Badajoz, auteur de la célèbre qasida d'Abduniyya – un autre homme portant un nom similaire."
  tr: "Sevilla'dan Endülüslü bir hukukçu ve yazar olan Sevilyalı (ö. 1134), beşinci yüzyılın ikinci yarısında yaşamış, Al-Mu'tamid ibn Abbad'ın saltanatının sona ermesine ve Almoravid devletinin kuruluşuna tanıklık etmiştir. Kendisine, hisbah edebiyatında bulduğumuz en eski eserlerden biri olan \"A Treatise on Judiciary and Hisbah\" adlı eserinin yazarı olarak kabul edilir; bu eserler Lévy-Provençal tarafından 1955'te düzenlenmiş ve 2009'da yayımlanmıştır. Araştırmalar, Chalmita'yı belki de çalışan bir yargıç değil, yargı pozisyonu için bir aday olarak göstermiştir. O, ünlü \"Abduni Şiiri\"nin yazarı Abd al-Majid ibn Abdoun değil, Badajoz'dan başka bir şairdir."
  id: "Seorang ahli hukum dan penulis Andalusia dari Sevilla (wafat 1134), ia hidup pada paruh kedua abad kelima H, menyaksikan berakhirnya masa pemerintahan Al-Mu'tamid ibn Abbad dan berdirinya negara Almoravid. Ia dikenal dengan \"Risalah tentang Kehakiman dan Hisbah,\" salah satu karya tertua yang kita temukan dalam sastra hisbah, diedit oleh Lévy-Provençal pada tahun 1955 dan diterbitkan pada tahun 2009. Studi mengutip Chalmita mungkin sebagai kandidat untuk posisi yudikatif daripada hakim yang sedang bertugas. Ia bukan Abd al-Majid ibn Abdoun, penulis \"Puisi Abduni\" yang terkenal, melainkan penyair lain dari Badajoz."

