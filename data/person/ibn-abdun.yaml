summary:
  ar: "فقيه وكاتب أندلسي من أهل إشبيلية (ت. 1134)، عاش في النصف الثاني من القرن الخامس الهجري فشهد نهاية ملك المعتمد بن عباد وقيام دولة المرابطين. ينتسب إليه «رسالة في القضاء والحسبة»، من أقدم ما وصلنا في أدب الحسبة، حققها ليفي بروفنسال سنة 1955 وطُبعت سنة 2009. نقلت الدراسات عن شالميتا أنه ربما كان مرشحًا لخطة القضاء لا قاضيًا عاملًا. وليس هو عبد المجيد بن عبدون صاحب «القصيدة العبدونية» الشهيرة، فذلك شاعر آخر من بطليوس."
  en: "Andalusi jurist and writer of Seville (d. 1134) who lived in the second half of the 5th/11th century, witnessing the end of al-Mu'tamid's reign and the Almoravid takeover. He is the author of the Risala fi'l-qada' wa'l-hisba (Treatise on the Judiciary and Market Inspection), among the earliest surviving hisba manuals, edited by Levi-Provencal in 1955 and reprinted in 2009. Scholarship reports Chalmeta's argument that he may have been only a candidate for the qadiship, not a serving qadi. He is not Abd al-Majid ibn Abdun, the Badajoz poet of the famous Abduniyya qasida - a different man of a similar name."
  ur: "اشبیلیہ کے اندلسی فقیہ و مصنف (وفات 1134ء)، پانچویں صدی ہجری کے نصفِ ثانی میں زیست؛ معتمد بن عباد کے عہد کا خاتمہ اور مرابطین کا قیام دیکھا۔ ان کی تصنیف «رسالہ فی القضاء والحسبہ» ادبِ حسبہ کی قدیم ترین باقی ماندہ کتابوں میں سے ہے، جسے 1955ء میں لیوی پروونسال نے مرتب کیا۔ محققین کے مطابق شاید وہ قاضی کے عہدے کے امیدوار تھے، عامل قاضی نہیں۔ یہ عبد المجید بن عبدون سے مختلف شخص ہیں، جو مشہور «قصیدہ عبدونیہ» کے بطلیوسی شاعر تھے۔"

