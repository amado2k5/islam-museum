summary:
  ar: "صلاح الدين ابن الفرس المصري الأديب الشاعر المشهور؛ كان أديباً ظريفاً فاضلاً يلبس لبس أولاد الأتراك واشتغل في ابتداء أمره بفقه الحنفية ثم غلب عليه الأدب حتى صار يجود من الشعراء المجيدين وكان ضخماً جسيماً إلا أنه كان لطيفاً حاذقاً حاضر الممازحة حسن البديهة، توفي في شعبان سنة ثلاث وأربعين وثمانمائة وقد نيف على الخمسين {cite:shadharat-dhahab p. 248}."
  en: "Ibn al-Faras — Cairo's celebrated wit-poet who 'wore the dress of the Turks' sons' and began in Hanafi fiqh before letters claimed him; heavyset yet nimble, ever-ready with impromptu verse; died Sha'ban 843 past fifty {cite:shadharat-dhahab p. 248}."
  es: "Ibn al-Faras — el célebre poeta ingenioso de El Cairo que «vestía el traje de los hijos de los turcos» y comenzó en el fiqh hanafi antes de que las letras lo reclamaran; corpulento pero ágil, siempre listo con versos improvisados; murió en Sha'ban 843, pasados los cincuenta {cita: shadharat-dhahab p. 248}."
  fr: "Ibn al-Faras — célèbre poète spirituel du Caire qui « portait la robe des fils des Turcs » et a commencé dans le fiqh hanafite avant que les lettres ne le réclament; corpulent mais agile, toujours prêt à improviser des vers; mort en Sha'ban 843 après cinquante ans {cite: shadharat-dhahab p. 248}."
  ur: "ابن الفارس - قاہرہ کا مشہور شاعر جس نے 'ترکوں کے بیٹوں کا لباس پہنا' اور حنفی فقہ میں شروع کیا اس سے پہلے کہ اس کا دعویٰ کیا جائے؛ بھاری سیٹ ابھی تک فرتیلا، فوری آیت کے ساتھ ہمیشہ تیار؛ وصال شعبان 843 بجکر پچاس {حوالہ: شدارت ذہاب ص 248}۔"
  tr: "Ünlü yazar ve şair olan Mısırlı Fars'ın oğlu Salah al-Din; Türklerin oğullarının kıyafetlerini giyen esprili ve erdemli bir yazardı. Başlangıçta Hanefi fıkıhıyla ilgilendi, sonra edebiyat onu domine etti ve sonunda seçkin şairlerden biri oldu. Iri ve heybetliydi, ancak nazik, becerikli, her zaman şaka yapan ve keskin bir zekaya sahipti. 843 Hicri yılında, elli yaşından fazla Şa'ban'da öldü {cite:shadharat-dhahab, s. 248}."
  id: "Salah al-Din, putra orang Persia Mesir, penulis dan penyair terkenal; ia adalah penulis yang cerdas dan berbudi luhur yang mengenakan pakaian anak-anak Turki. Awalnya ia terlibat dalam hukum Hanafi, kemudian sastra mendominasinya hingga menjadi salah satu penyair terkemuka. Ia bertubuh besar dan berwibawa, tetapi ia lembut, terampil, selalu bercanda, dan memiliki kecerdasan tajam. Ia meninggal di Sha'ban pada tahun 843 H, lebih dari lima puluh {cite:shadharat-dhahab, hlm. 248}."
