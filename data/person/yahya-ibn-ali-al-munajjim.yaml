class: person
label: { ar: "يحيى بن علي المنجم النديم", en: "Yahya ibn Ali al-Munajjim", es: "Yahya ibn Ali al-Munajjim", fr: "Yahya ibn Ali al-Munajjim", ur: "یحییٰ بن علی المنجم" }
summary:
  ar: "أبو أحمد يحيى بن علي بن يحيى بن أبي منصور المنجم النديم؛ كان في أول أمره نديم الموفق أبي أحمد طلحة بن المتوكل والد المعتضد، ثم نادم الخلفاء بعده واختص بمنادمة المكتفي بالله وعلت رتبته عنده وتقدم على خواصه وجلسائه؛ وكان متكلماً معتزلي الاعتقاد وله في ذلك كتب كثيرة، وكان له مجلس يحضره جماعة من المتكلمين بحضرة المكتفي؛ وصنف كتاب «الباهر» في أخبار شعراء مخضرمي الدولتين ابتدأ فيه ببشار بن برد ولم يتمه فتممه ولده أبو الحسن أحمد بن يحيى {cite:wafayat-ayan}."
  en: "Yahya b. Ali al-Munajjim — Mu'tazili boon-companion of al-Muwaffaq and al-Muktafi; began Kitab al-Bahir on the poets of both dynasties, completed by his son Ahmad {cite:wafayat-ayan}."
  es: "Yahya b. Ali al-Munajjim: Mu'tazili, compañero de bendición de al-Muwaffaq y al-Muktafi; comenzó Kitab al-Bahir sobre los poetas de ambas dinastías, completado por su hijo Ahmad {cita:wafayat-ayan}."
  fr: "Yahya b. Ali al-Munajjim — compagnon mu'tazili d'al-Muwaffaq et d'al-Muktafi; commença Kitab al-Bahir sur les poètes des deux dynasties, complété par son fils Ahmad {cite:wafayat-ayan}."
  ur: "یحییٰ بی۔ علی المناظم - معتزلی بون صحابی الموفق اور المکتفی؛ دونوں خاندانوں کے شعرا پر کتاب البحیر کا آغاز کیا جسے ان کے بیٹے احمد نے مکمل کیا۔"
  tr: "Ebu Ahmed Yahya ibn Ali ibn Yahya ibn Abi Mansur el-Münamem el-Nadim; başlangıçta, el-Muvafık Ebu Ahmed Talha ibn el-Mutawakkil'in yoldaşıydı; el-Mu'tadid'in babası. Daha sonra kendisinden sonra halifelerden pişman oldu ve el-Mutafi Billah'ın dostluğuyla öne çıktı; onun rütbesi seçkinleri ve halefleri arasında yükseldi. Mu'tazillerin bir ilahiyatçısıydı ve bu konuda birçok kitap yazdı. El-Mutafti'nin huzurunda bir grup teologun katıldığı toplantılar düzenledi. İki hanedanın yaşlılarının şairlerinin anlatımları üzerine 'el-Bahir' adlı kitabı yazdı; başta Beşar ibn Burd ile başladı ama tamamlamadı; oğlu Ebu el-Hasan Ahmed bin Yahya da tamamladı."
  id: "Abu Ahmad Yahya ibn Ali ibn Yahya ibn Abi Mansur al-Munajm al-Nadim; awalnya, ia adalah sahabat al-Muwaffaq Abu Ahmad Talha ibn al-Mutawakkil, ayah dari al-Mu'tadid. Ia kemudian menyesali para khalifah setelahnya, dan ia dikenal karena kebersamaan dengan al-Muktafi Billah, yang pangkatnya melebihi elit dan penerusnya. Ia adalah teolog Mu'tazilite dan menulis banyak buku tentang topik ini. Ia mengadakan pertemuan yang dihadiri oleh sekelompok teolog di hadapan al-Muktafti. Ia menulis buku 'al-Bahir' tentang kisah para penyair para tetua dari dua dinasti, dimulai dengan Bashar ibn Burd namun tidak menyelesaikannya, dan putranya Abu al-Hasan Ahmad ibn Yahya menyelesaikannya."
