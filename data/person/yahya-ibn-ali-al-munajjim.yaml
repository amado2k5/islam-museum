label: { ar: "يحيى بن علي المنجم النديم", en: "Yahya ibn Ali al-Munajjim" }
summary:
  ar: "أبو أحمد يحيى بن علي بن يحيى بن أبي منصور المنجم النديم؛ كان في أول أمره نديم الموفق أبي أحمد طلحة بن المتوكل والد المعتضد، ثم نادم الخلفاء بعده واختص بمنادمة المكتفي بالله وعلت رتبته عنده وتقدم على خواصه وجلسائه؛ وكان متكلماً معتزلي الاعتقاد وله في ذلك كتب كثيرة، وكان له مجلس يحضره جماعة من المتكلمين بحضرة المكتفي؛ وصنف كتاب «الباهر» في أخبار شعراء مخضرمي الدولتين ابتدأ فيه ببشار بن برد ولم يتمه فتممه ولده أبو الحسن أحمد بن يحيى {cite:wafayat-ayan}."
  en: "Yahya b. Ali al-Munajjim — Mu'tazili boon-companion of al-Muwaffaq and al-Muktafi; began Kitab al-Bahir on the poets of both dynasties, completed by his son Ahmad {cite:wafayat-ayan}."
