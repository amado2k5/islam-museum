summary:
  ar: "مذلاج بن عمرو السلمي حليف بني عبد شمس وله صحبة؛ عند البلاذري عن بعض أهل العلم: هو الذي توجه إلى هيت والحصون التي بعدها من الكوفة فتولى فتحها وهو بنا الحديثة التي على الفرات وولده بهيت وكان منهم رجل يكنى أبا هارون باقي الذكر هناك — ويقال كان من قبل سعد بن عمرو بن حرام."
  en: "Midlaj ibn Amr al-Sulami, confederate of Banu Abd Shams and a man of companionship; in al-Baladhuri from certain scholars: he it was who went against Hit and the forts beyond out of Kufa, taking it and building al-Haditha on the Euphrates — his descendants at Hit including a man called Abu Harun still remembered there — or, it is said, he acted under Sa'd ibn Amr ibn Haram."
  es: "Midlaj ibn Amr al-Sulami, confederado de Banu Abd Shams y hombre de compañía; en al-Baladhuri, según ciertos eruditos: fue él quien atacó Hit y las fortalezas más allá de Kufa, tomándola y construyendo al-Haditha en el Éufrates; sus descendientes en Hit, incluyendo a un hombre llamado Abu Harun, aún son recordados allí; o, se dice, actuó bajo las órdenes de Sa'd ibn Amr ibn Haram."
  fr: "Midlaj ibn Amr al-Sulami, confédéré des Banu Abd Shams et homme de compagnie; selon al-Baladhuri, d'après certains érudits: c'est lui qui marcha contre Hit et les forts au-delà de Kufa, s'en empara et construisit al-Haditha sur l'Euphrate — ses descendants à Hit, dont un homme appelé Abu Harun, sont encore connus là-bas — ou, dit-on, il a agi sous les ordres de Sa'd ibn Amr ibn Haram."
  ur: "مدلج بن عمرو السلمی، بنو عبد الشمس کا حلیف اور صحابی؛ البلاذری میں بعض علماء سے ہے: وہ ہی تھا جو کوفہ سے باہر ہٹ اور قلعوں کے خلاف گیا، اسے لے کر فرات پر الحدیث تعمیر کیا- اس کی اولاد کو ہٹ میں ابو ہارون نامی شخص سمیت اب بھی یاد ہے- یا کہا جاتا ہے کہ اس نے سعد بن عمرو بن حرام کے ماتحت کام کیا۔"
