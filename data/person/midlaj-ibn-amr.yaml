  ar: "مذلاج بن عمرو السلمي حليف بني عبد شمس وله صحبة؛ عند البلاذري عن بعض أهل العلم: هو الذي توجه إلى هيت والحصون التي بعدها من الكوفة فتولى فتحها وهو بنا الحديثة التي على الفرات وولده بهيت وكان منهم رجل يكنى أبا هارون باقي الذكر هناك — ويقال كان من قبل سعد بن عمرو بن حرام."
  en: "Midlaj ibn Amr al-Sulami, confederate of Banu Abd Shams and a man of companionship; in al-Baladhuri from certain scholars: he it was who went against Hit and the forts beyond out of Kufa, taking it and building al-Haditha on the Euphrates — his descendants at Hit including a man called Abu Harun still remembered there — or, it is said, he acted under Sa'd ibn Amr ibn Haram."
