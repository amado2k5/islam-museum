summary:
  ar: "الملك العزيز عثمان بن العادل أبي بكر بن أيوب شقيق المعظم؛ وهو صاحب بانياس وتبنين وهونين وهو الذي بنى قلعة الصبيبة بين هؤلاء البلدان، وكان عاقلاً ساكناً؛ اتفق موته بالناعمة وهو بستان له يبيت به من صالحية دمشق في عاشر رمضان سنة ثلاثين وستمائة {cite:shadharat-dhahab p. 136}."
  en: "al-Malik al-Aziz Uthman b. al-Adil — full brother of al-Mu'azzam, lord of Banias, Tibnin and Hunin and builder of Qal'at al-Subayba among them; a man of quiet sense, he died at his Na'ima garden estate in Salihiyya, 10 Ramadan 630 {cite:shadharat-dhahab p. 136}."
  es: "al-Malik al-Aziz Uthman b. al-Adil — hermano completo de al-Mu'azzam, señor de Banias, Tibnin y Hunin y constructor de Qal'at al-Subayba entre ellos; un hombre de sentido tranquilo, murió en su finca de jardín Na'ima en Salihiyya, el 10 de Ramadán de 630 {cita: shadharat-dhahab p. 136}."
  fr: "al-Malik al-Aziz Uthman b. al-Adil — propre frère d'al-Mu'azzam, seigneur de Banias, Tibnin et Hunin et constructeur de Qal'at al-Subayba parmi eux; homme au bon sens, il mourut dans son jardin Na'ima à Salihiyya, le 10 Ramadan 630 {cite: shadharat-dhahab p. 136}."
