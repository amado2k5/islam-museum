id: person/ibn-hamid-al-warraq
class: person
label: { ar: "أبو عبد الله الحسن بن حامد الوراق الحنبلي" }
summary:
  ar: "الحسن بن حامد بن علي بن مروان أبو عبد الله الوراق البغدادي الحنبلي، مدرس أصحاب الإمام أحمد وفقيههم وإمامهم في زمانه، وشيخ القاضي أبي يعلى ابن الفراء الذي تخرج عليه ونقل مذهبه. له المصنفات الكبار في المذهب والخلاف والأصول، منها كتاب الجامع نحو أربعمائة جزء وكتاب تهذيب الأجوبة وشرح أصول الدين، وكان حسن الفتوى والتدريس. توفي في طريق مكة منصرفاً من الحج في واقصة ليلة الجمعة ثامن عشر جمادى الأولى سنة ثلاث وأربعمائة ودُفن هناك {cite:muntazam-ibn-al-jawzi j.7 p.263-264}."
  tr: "El-Hasan ibn Hamid ibn Ali ibn Mervan Ebu Abdullah el-Varrak el-Bağdadi el-Hanbali, kendi döneminde İmam Ahmed'in sahabelerinin öğretmeni, hukukçusu ve imamı ile yargıç Ebu Ya'la ibn el-Farra'nın öğretmeniydi; onun yanında eğitim aldı ve okulunu aktardı. Okul, anlaşmazlık ve ilkeler üzerine önemli eserler yazdı; bunlar arasında 'Al-Jami' (yaklaşık dört yüz cilt), 'Tahdhib al-Ajwubah' kitabı ve dinin temellerinin açıklaması yer alır. Fetva vermede ve öğretimde mükemmeldi. 403 H. yılında, Cuma gecesi, Cuma gecesi, Cuma gecesi Hec'den ayrılırken Mekke'ye giderken vefat etti ve orada defnedildi {cite:muntazam-ibn-al-jawzi J.7 s.263-264}."
  id: "Al-Hasan ibn Hamid ibn Ali ibn Marwan Abu Abdullah al-Warraq al-Baghdadi al-Hanbali, seorang guru, ahli hukum, dan imam para sahabat Imam Ahmad pada masanya, serta guru hakim Abu Ya'la ibn al-Farra', di bawah bimbingan ia belajar dan meneruskan sekolahnya. Ia menulis karya-karya besar tentang aliran tersebut, perselisihan, dan prinsip-prinsip, termasuk buku 'Al-Jami' (sekitar empat ratus jilid), buku 'Tahdhib al-Ajwubah' dan penjelasan tentang dasar-dasar agama. Ia sangat mahir dalam mengeluarkan fatwa dan mengajar. Ia meninggal dalam perjalanan ke Mekah saat meninggalkan Haji pada malam Jumat, tanggal delapan belas Jumada al-Awwal tahun 403 H, dan dimakamkan di sana {cite:muntazam-ibn-al-jawzi J.7 hlm.263-264}."
