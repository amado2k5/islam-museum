label: { ar: "أبو عبد الله الحسن بن حامد الوراق الحنبلي" }
summary:
  ar: "الحسن بن حامد بن علي بن مروان أبو عبد الله الوراق البغدادي الحنبلي، مدرس أصحاب الإمام أحمد وفقيههم وإمامهم في زمانه، وشيخ القاضي أبي يعلى ابن الفراء الذي تخرج عليه ونقل مذهبه. له المصنفات الكبار في المذهب والخلاف والأصول، منها كتاب الجامع نحو أربعمائة جزء وكتاب تهذيب الأجوبة وشرح أصول الدين، وكان حسن الفتوى والتدريس. توفي في طريق مكة منصرفاً من الحج في واقصة ليلة الجمعة ثامن عشر جمادى الأولى سنة ثلاث وأربعمائة ودُفن هناك {cite:muntazam-ibn-al-jawzi j.7 p.263-264}."
