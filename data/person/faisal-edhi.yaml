summary:
  ar: "فيصل إيدهي فاعل خير باكستاني، ابن عبد الستار إيدهي وبلقيس إيدهي، عمل في مؤسسة إيدهي منذ صباه مسؤولًا عن خدمة الإسعاف، وعُيّن وصيًا إداريًا للمؤسسة في مطلع سنة 2016 ثم ترأسها بعد وفاة أبيه في 8 يوليو 2016، فأدار أكبر شبكة إسعاف تطوعية في العالم وملاجئ المؤسسة ودور أيتامها ومراكز تأهيلها في أنحاء باكستان، وقاد أعمالها الإغاثية الدولية ومنها عرض المساعدة على الهند إبان جائحة كورونا سنة 2021 وتبرع المؤسسة لصندوق رئيس الوزراء لإغاثة كورونا سنة 2020."
  en: "Faisal Edhi is a Pakistani humanitarian, the son of Abdul Sattar Edhi and Bilquis Edhi, who worked in the Edhi Foundation from childhood — in charge of its ambulance service as a young man — was appointed its managing trustee early in 2016 and took over as its head on his father's death on 8 July 2016, running the world's largest volunteer ambulance network together with the foundation's shelters, orphanages and rehabilitation centres across Pakistan and its international relief work, including the 2020 donation to the Prime Minister's coronavirus relief fund and the 2021 offer of ambulances and volunteers to India during the Covid-19 pandemic."
  ur: "فیصل ایدھی پاکستانی فلاحی شخصیت ہیں، عبد الستار ایدھی اور بلقیس ایدھی کے صاحبزادے، بچپن سے ایدھی فاؤنڈیشن میں کام کیا اور نوجوانی میں ایمبولینس سروس کے نگران رہے، 2016ء کے آغاز میں فاؤنڈیشن کے منیجنگ ٹرسٹی مقرر ہوئے اور 8 جولائی 2016ء کو والد کے انتقال پر فاؤنڈیشن کے سربراہ بنے؛ دنیا کا سب سے بڑا رضاکار ایمبولینس نیٹ ورک، پناہ گاہیں، یتیم خانے اور بحالی مراکز چلاتے ہیں اور بین الاقوامی امدادی کام کی قیادت کرتے ہیں، جن میں 2020ء میں وزیر اعظم کرونا ریلیف فنڈ کو عطیہ اور 2021ء میں بھارت کو ایمبولینسوں اور رضاکاروں کی پیشکش شامل ہے۔"
