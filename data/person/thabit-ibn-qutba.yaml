label: { ar: "ثابت بن قطبة الخزاعي", en: "Thabit ibn Qutba al-Khuza'i" }
summary:
  ar: "ثابت بن قطبة الخزاعي؛ كان هو وأخوه حريث مع موسى بن عبد الله بن خازم بالترمذ فاستجاشا طرخون فعظمت دالتهما على موسى فقيل له إنما لك الاسم وهذان صاحبا العسكر والأمر فلما قتل حريث بنشابة طلب أصحاب موسى إراحتهم منه فلحق بحشورا واستنجد طرخون فحصر موسى بالترمذ في ثمانين ألفاً فبيته موسى فرجعت الأعاجم إلى بلادها."
  en: "Thabit ibn Qutba al-Khuza'i; he and brother Hurayth held real command of Musa's army through Tarkhun's aid — after Hurayth's death to a stray arrow Musa's men pressed for his removal; he fled, returned with Tarkhun's eighty thousand to besiege Tirmidh, and was scattered by Musa's night-raid."
