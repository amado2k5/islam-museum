label: { ar: "ثابت بن قطبة الخزاعي", en: "Thabit ibn Qutba al-Khuza'i", es: "Thabit ibn Qutba al-Khuza'i", fr: "Thabit ibn Qutba al-Khuza'i", ur: "ثابت بن قطبہ الخزاعی" }
summary:
  ar: "ثابت بن قطبة الخزاعي؛ كان هو وأخوه حريث مع موسى بن عبد الله بن خازم بالترمذ فاستجاشا طرخون فعظمت دالتهما على موسى فقيل له إنما لك الاسم وهذان صاحبا العسكر والأمر فلما قتل حريث بنشابة طلب أصحاب موسى إراحتهم منه فلحق بحشورا واستنجد طرخون فحصر موسى بالترمذ في ثمانين ألفاً فبيته موسى فرجعت الأعاجم إلى بلادها."
  en: "Thabit ibn Qutba al-Khuza'i; he and brother Hurayth held real command of Musa's army through Tarkhun's aid — after Hurayth's death to a stray arrow Musa's men pressed for his removal; he fled, returned with Tarkhun's eighty thousand to besiege Tirmidh, and was scattered by Musa's night-raid."
  es: "Thabit ibn Qutba al-Khuza'i; él y su hermano Hurayth ostentaban el mando real del ejército de Musa gracias a la ayuda de Tarkhun. Tras la muerte de Hurayth por una flecha perdida, los hombres de Musa presionaron para que lo destituyeran; él huyó, regresó con los ochenta mil hombres de Tarkhun para sitiar Tirmidh y fue dispersado por la incursión nocturna de Musa."
  fr: "Thabit ibn Qutba al-Khuza'i; lui et son frère Hurayth détenaient le véritable commandement de l'armée de Musa grâce à l'aide de Tarkhun — après la mort de Hurayth, touché par une flèche perdue, les hommes de Musa ont insisté pour qu'il soit destitué; il s'enfuit, revint avec les quatre-vingt mille hommes de Tarkhun pour assiéger Tirmidh, et fut dispersé par le raid nocturne de Musa."
  ur: "ثابت بن قطبہ الخزاعی؛ اس نے اور بھائی حوریث نے ترخون کی مدد کے ذریعے موسیٰ کی فوج کی حقیقی کمان سنبھالی تھی - ایک آوارہ تیر میں حوریث کی موت کے بعد موسیٰ کے آدمیوں نے اسے ہٹانے کے لیے دباؤ ڈالا۔ وہ بھاگا، ترمذ کا محاصرہ کرنے کے لیے ترخون کے اسی ہزار کے ساتھ واپس آیا، اور موسیٰ کے رات کے چھاپے سے بکھر گیا۔"
  tr: "Tebit bin Kutbah el-Huza'i; o ve kardeşi Harit, Musa ibn Abdullah ibn Hazım ile Tirmidh'teydi. Tarkhun'a sığındılar ve Musa'ya etkileri büyüktü. Musa üzerinde büyük bir etkiye sahipti. Neşebah tarafından öldürüldüğünde, Musa'nın yoldaşları ondan yardım istedi, fakat o Haşura katıldı ve Tarhun'dan yardım istedi. Musa, seksen bin kişiyle Tirmidh'te kuşatıldı ve Musa evinde kaldı. Arap olmayanlar topraklarına döndü."
  id: "Thabit ibn Qutbah al-Khuza'i; ia dan saudaranya Harith bersama Musa ibn Abdullah ibn Khazim di Tirmidh. Mereka mencari perlindungan di Tarkhun, dan pengaruh mereka atas Musa sangat besar. Ia diberitahu, 'Kalian hanya punya nama, dan dua orang ini adalah pemimpin pasukan dan komandan.' Ketika Harith dibunuh oleh Nashabah, teman-teman Musa mencari bantuan darinya, tetapi ia bergabung dengan Hashur dan meminta bantuan dari Tarkhun. Musa dikepung di Tirmidh dengan delapan puluh ribu, dan Musa tinggal di rumahnya. Orang non-Arab kembali ke tanah mereka."
