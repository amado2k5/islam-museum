summary:
  ar: "عالم هندي (1917–1965) من كاندهلة، ابن محمد إلياس الكاندهلوي مؤسس جماعة التبليغ وخليفته أميرًا ثانيًا للجماعة. حفظ القرآن في العاشرة وتخرج من مظاهر علوم سهارانبور سنة 1936، وبعد وفاة والده سنة 1944 نظّم نظام الجماعة ووسّع عملها، وألّف «حياة الصحابة» و«أماني الأحبار في شرح معاني الآثار»، وتوفي في لاهور سنة 1965 ودُفن بجوار والده في دلهي."
  en: "Indian scholar (1917–1965) of Kandhla, the son of Muhammad Ilyas Kandhlawi, founder of the Tablighi Jamaat, and his successor as the Jamaat's second amir. He memorised the Qur'an at ten and graduated from Mazahir Uloom Saharanpur in 1936, and after his father's death in 1944 he organised the Jamaat's system and spread its work; he wrote Hayat al-Sahaba and Amani al-Ahbar fi Sharh Ma'ani al-Athar, died at Lahore in 1965 and was buried beside his father at Delhi."
  ur: "بھارتی عالم (1917ء–1965ء) جن کا تعلق کاندھلہ سے تھا، تبلیغی جماعت کے بانی محمد الیاس کاندھلوی کے فرزند اور ان کے بعد جماعت کے دوسرے امیر۔ دس سال کی عمر میں قرآن حفظ کیا اور 1936ء میں مظاہر علوم سہارنپور سے فارغ ہوئے، والد کی وفات (1944ء) کے بعد جماعت کا نظام مرتب کیا اور اس کے کام کو وسعت دی، «حیاۃ الصحابہ» اور «امانی الاحبار» تصنیف کیں، 1965ء میں لاہور میں انتقال ہوا اور دہلی میں والد کے پہلو میں دفن ہوئے۔"
