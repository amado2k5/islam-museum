id: person/tarif-al-subkari
class: person
label: { ar: "طريف السبكري" }
summary:
  ar: "قائد عباسي؛ كان في جملة أصحاب السلطان مع الحجاج سنة 312هـ فأسره أبو طاهر القرمطي يوم الكوفة، ثم حبسه القاهر بالله في مطمورة فلما خلعوه سنة 322هـ فتحوا موضعه وأخرجوه وحبسوا القاهر مكانه {cite:kamil-ibn-al-athir p. 115-210}. وعند ابن الأثير أحضره القاهر وناوله خاتمه وأرسله إلى مؤنس يدعوه إلى الدار فدخل عليه وأشار عليه بالحضور عند القاهر وحمل عليه وقال له إن المساكنة طبع ولو رآك ثائماً ما تجاسروا أن يوقظك، فسار مؤنس إليه فقُبض عليه، وقال طريف لما أعلمت القاهر بمجيء مؤنس ارتعد وتغيرت أحواله وزحف من صدر فراشه فخفته أن أكلفه في معنى {cite:kamil-ibn-al-athir p. 190-191}"
  en: "An Abbasid commander — Abu Tahir's captive from the Kufa battle of 312 — whom al-Qahir later confined in an oubliette; the deposing troops freed him and jailed the caliph in his cell in 322 {cite:kamil-ibn-al-athir p. 115-210}."
  es: "Un comandante abasí —cautivo de Abu Tahir en la batalla de Kufa de 312— a quien al-Qahir confinó posteriormente en un calabozo; las tropas depuestas lo liberaron y encarcelaron al califa en su celda en 322 {cite:kamil-ibn-al-athir p. 115-210}."
  fr: "Un commandant abbasside — prisonnier d'Abu Tahir lors de la bataille de Kufa en 312 — qu'al-Qahir a ensuite enfermé dans un oubliette; les troupes déposantes l'ont libéré et ont emprisonné le calife dans sa cellule en 322 {cite:kamil-ibn-al-athir p. 115-210}."
  ur: "ایک عباسی کمانڈر - 312 کی کوفہ کی جنگ سے ابو طاہر کا اسیر - جسے بعد میں القاہر نے ایک قید میں رکھا۔ معزول دستوں نے اسے رہا کر دیا اور خلیفہ کو 322 میں اس کی کوٹھڑی میں قید کر دیا۔ 115-210}۔"
  tr: "Bir Abbasi komutanı; 312 Hicri yılında el-Haccac ile sultanın yoldaşları arasındaydı. Ebu Tahir el-Karmati onu Kufe'de yakaladı, ardından el-Kahir bin Allah onu Matmura'da hapsetti. 322 H.M.'de onu tahttan indirdiklerinde, yerini açtılar, kovdular ve yerine el-Kahir'i hapsettiler {alıntı:Kamil ibn-al-Athir s. 115-210}. İbn al-Athir'de el-Kahir onu getirdi, yüzüğünü verdi ve Mu'anis'e göndererek eve davet etti. Girdi, el-Kahir'de olduğunu işaret etti ve birlikte yaşamanın bir alışkanlık olduğunu söyleyerek ona saldırdı. Susamış görse seni uyandırmaya cesaret edemezlerdi. Mu'nais yanına gidip onu tutukladı. El-Kahir'in Mu'anis'in gelişini öğrendiğinde titrediğini ve durumunun değiştiğini söyledi. Yatağından sürünerek çıktı, bu yüzden {cite:kamil-ibn-al-athir, s. 190-191} anlamını ona yüklemeye korktum."
  id: "Seorang komandan Abbasiyah; ia termasuk di antara sahabat sultan dengan al-Hajjaj pada tahun 312 H. Abu Tahir al-Qarmati menangkapnya di Kufa, kemudian al-Qahir ibn Allah memenjarakannya di Matmura. Ketika mereka menggulingkannya pada tahun 322 H, mereka membuka posisinya, mengusirnya, dan memenjarakan al-Qahir sebagai gantinya {cite:Kamil-ibn-al-Athir hlm. 115-210}. Di Ibn al-Athir, al-Qahir membawanya, menyerahkan cincinnya, dan mengirimkannya kepada Mu'anis untuk mengundangnya ke rumah. Dia masuk, memberi isyarat kehadirannya di al-Qahir, dan menyerangnya, mengatakan bahwa tinggal bersama adalah kebiasaan. Jika dia melihatmu haus, mereka tidak akan berani membangunkanmu. Mu'nais pergi kepadanya dan menangkapnya. Dia berkata bahwa ketika al-Qahir mengetahui kedatangan Mu'anis, dia gemetar dan kondisinya berubah. Dia merangkak dari tempat tidurnya, sehingga aku takut membebaninya dengan makna {cite:kamil-ibn-al-athir, hlm. 190-191}."
