id: person/tarif-al-subkari
class: person
label: { ar: "طريف السبكري" }
summary:
  ar: "قائد عباسي؛ كان في جملة أصحاب السلطان مع الحجاج سنة 312هـ فأسره أبو طاهر القرمطي يوم الكوفة، ثم حبسه القاهر بالله في مطمورة فلما خلعوه سنة 322هـ فتحوا موضعه وأخرجوه وحبسوا القاهر مكانه {cite:kamil-ibn-al-athir p. 115-210}.، وعند ابن الأثير أحضره القاهر وناوله خاتمه وأرسله إلى مؤنس يدعوه إلى الدار فدخل عليه وأشار عليه بالحضور عند القاهر وحمل عليه وقال له إن المساكنة طبع ولو رآك ثائماً ما تجاسروا أن يوقظك، فسار مؤنس إليه فقُبض عليه، وقال طريف لما أعلمت القاهر بمجيء مؤنس ارتعد وتغيرت أحواله وزحف من صدر فراشه فخفته أن أكلفه في معنى {cite:kamil-ibn-al-athir p. 190-191}"
  en: "An Abbasid commander — Abu Tahir's captive from the Kufa battle of 312 — whom al-Qahir later confined in an oubliette; the deposing troops freed him and jailed the caliph in his cell in 322 {cite:kamil-ibn-al-athir p. 115-210}."
