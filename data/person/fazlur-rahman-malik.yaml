summary:
  ar: "مفكر إسلامي باكستاني أمريكي ⁦(1919–1988)⁩، من أبرز فلاسفة الإصلاح الإسلامي الحديث. عمل مديرًا لمعهد البحوث الإسلامية المركزي في كراتشي ثم أستاذًا بجامعة شيكاغو، واقترح منهج «الحركة المزدوجة» لتأويل القرآن، ومن كتبه «الإسلام والحداثة» و«الموضوعات الكبرى للقرآن» و«المنهجية الإسلامية في التاريخ»."
  en: "Pakistani-American Islamic thinker (1919–1988), among the foremost philosophers of modern Islamic reform. He directed the Central Institute of Islamic Research in Karachi then taught at the University of Chicago, proposed the 'double movement' hermeneutic for interpreting the Qur'an, and wrote Islam and Modernity, Major Themes of the Qur'an and Islamic Methodology in History."
  ur: "پاکستانی امریکی اسلامی مفکر ⁦(1919–1988)⁩ جو جدید اسلامی اصلاح کے ممتاز فلسفیوں میں شمار ہوتے ہیں۔ وہ کراچی کے سینٹرل انسٹیٹیوٹ آف اسلامک ریسرچ کے ڈائریکٹر اور پھر جامعہ شکاگو کے پروفیسر رہے؛ قرآن کی تعبیر کے لیے «دوہرے حرکات» کا منہج پیش کیا اور «اسلام اور جدیدیت»، «قرآن کے مرکزی مضامین» اور «اسلامی منہجیت فی التاریخ» لکھیں۔"
