label: { ar: "عمرو بن بانة", en: "Amr Ibn Bana" }
summary:
  ar: "عمرو بن بانة وهي أمه، وهو عمرو بن محمد بن سليمان بن راشد مولى يوسف بن عمر الثقفي، وبانه ابنة روح كاتب سلمة الوصيف، كان خصيصا بالمتوكل أنيسا به أخذ عن إسحاق الموصلي وله صنعة في الغناء وعاش إلى أيام المعتضد، وله كتاب مجرد عمرو بن بانة، توفي سنة ثمان وسبعين ومائتين {cite:fihrist-ibn-al-nadim p. 447-448}."
  en: "Singer-companion of al-Mutawakkil (d. 278), author of the Mujarrad {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
