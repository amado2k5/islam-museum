id: person/amr-ibn-bana
class: person
label: { ar: "عمرو بن بانة", en: "Amr Ibn Bana", es: "Amr Ibn Bana", fr: "Amr Ibn Bana", ur: "عمرو ابن بانا" }
summary:
  ar: "عمرو بن بانة وهي أمه، وهو عمرو بن محمد بن سليمان بن راشد مولى يوسف بن عمر الثقفي، وبانه ابنة روح كاتب سلمة الوصيف، كان خصيصا بالمتوكل أنيسا به أخذ عن إسحاق الموصلي وله صنعة في الغناء وعاش إلى أيام المعتضد، وله كتاب مجرد عمرو بن بانة، توفي سنة ثمان وسبعين ومائتين {cite:fihrist-ibn-al-nadim p. 447-448}."
  en: "Singer-companion of al-Mutawakkil (d. 278), author of the Mujarrad {cite:fihrist-ibn-al-nadim}"
  es: "Cantante y compañero de al-Mutawakkil (m. 278), autor del Mujarrad {cite:fihrist-ibn-al-nadim}"
  fr: "Chanteur-compagnon d'al-Mutawakkil (mort en 278), auteur du Mujarrad {cite:fihrist-ibn-al-nadim}"
  ur: "المتوکل کے گلوکار ساتھی ⁦(متوفی 278)⁩، مجارد کے مصنف۔"
  tr: "Annesi olan Amr ibn Bannah, Yusuf ibn Umar al-Thaqafi'nin özgür katili Amr ibn Muhammed ibn Sulayman ibn Rashid'di ve Salamah al-Waseef'in kâtipi Ruh'un kızıydı. Özellikle el-Mutevakkil ile yakındı; onun aracılığıyla İshaq al-Mawsili'den ders aldı, şarkı söylemede ustaydı ve el-Mu'tadid zamanına kadar yaşadı. Ayrıca 'Amr ibn Bannah' adlı basit bir kitabı da vardı. 278 Hicri yılında öldü {atıf:fihrist-ibn-al-nadim s. 447-448}."
  id: "Amr ibn Bannah, yang merupakan ibunya, adalah Amr ibn Muhammad ibn Sulayman ibn Rashid, mantan Yusuf ibn Umar al-Thaqafi, dan merupakan putri Ruh, juru tulis Salamah al-Waseef. Ia sangat dekat dengan al-Mutawakkil, melalui siapa ia belajar di bawah Ishaq al-Mawsili dan mahir bernyanyi serta hidup hingga masa al-Mu'tadid. Ia juga memiliki sebuah buku sederhana berjudul 'Amr ibn Bannah.' Ia meninggal pada tahun 278 H {cite:fihrist-ibn-al-nadim hlm. 447-448}."
