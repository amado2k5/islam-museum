summary:
  ar: "ملك المملكة الأردنية الهاشمية منذ 7 فبراير 1999، وُلد في عمّان سنة 1962، وهو أكبر أبناء الملك الحسين، خدم ضابطا في القوات المسلحة الأردنية وقائدا لقواتها الخاصة قبل اعتلائه العرش، وعُرف دوليا بدعوته إلى حوار الأديان وبـ«رسالة عمّان» (2004)، وبوصفه وصيا على المقدسات الإسلامية والمسيحية في القدس، وأقدم زعماء العرب الحاليين في الحكم."
  en: "King of the Hashemite Kingdom of Jordan since 7 February 1999, born in Amman in 1962, the eldest son of King Hussein. He served as an officer in the Jordanian Armed Forces and commander of its Special Forces before succeeding his father, and is known internationally for promoting interfaith dialogue through the Amman Message (2004) and as custodian of the Muslim and Christian holy places in Jerusalem; he is the longest-serving current Arab leader."
  ur: "اردن کے بادشاہ، جو 7 فروری 1999 سے تخت پر ہیں۔ وہ 1962 میں عمان میں پیدا ہوئے، شاہ حسین کے سب سے بڑے بیٹے ہیں، اور بادشاہ بننے سے پہلے اردنی فوج میں افسر اور خصوصی دستوں کے کمانڈر رہے۔ وہ بین المذاہب مکالمے اور یروشلم کے مقدس مقامات کی نگرانی کی وجہ سے معروف ہیں اور اس وقت سب سے طویل عرصے سے برسرِ اقتدار عرب رہنما ہیں۔"
  fr: "Roi du Royaume hachémite de Jordanie depuis le 7 février 1999, né à Amman en 1962, fils aîné du roi Hussein. Il servit comme officier dans les Forces armées jordaniennes et commandant de leurs Forces spéciales avant de succéder à son père, et il est connu sur la scène internationale pour avoir promu le dialogue interreligieux par le Message d'Amman (2004) et comme gardien des lieux saints musulmans et chrétiens de Jérusalem ; il est le dirigeant arabe en exercice depuis le plus longtemps."
  es: "Rey del Reino Hachemita de Jordania desde el 7 de febrero de 1999, nacido en Amán en 1962, hijo mayor del rey Hussein. Sirvió como oficial en las Fuerzas Armadas jordanas y comandante de sus Fuerzas Especiales antes de suceder a su padre, y es conocido internacionalmente por promover el diálogo interreligioso a través del Mensaje de Amán (2004) y como custodio de los lugares santos musulmanes y cristianos en Jerusalén; es el líder árabe actual que más tiempo ha permanecido en el poder."
  tr: "7 Şubat 1999'dan beri Ürdün Haşimi Krallığı'nın kralıdır. 1962'de Amman'da doğdu ve Kral Hüseyin'in en büyük oğludur. Tahta çıkmadan önce Ürdün Silahlı Kuvvetleri'nde subay ve özel kuvvetler komutanı olarak görev yaptı. Dinler arası diyaloğa çağrısı ve \"Amman Mesajı\" (2004) ile ve Kudüs'teki İslam ve Hristiyan kutsal yerlerinin koruyucusu olmasıyla uluslararası alanda tanınmaktadır. Halen görevde olan en uzun süre görev yapan Arap lideridir."
  id: "Raja Kerajaan Hashemite Yordania sejak 7 Februari 1999. Ia lahir di Amman pada tahun 1962 dan merupakan putra sulung Raja Hussein. Ia bertugas sebagai perwira di Angkatan Bersenjata Yordania dan komandan pasukan khusus sebelum naik tahta. Ia dikenal secara internasional karena seruannya untuk dialog antaragama dan \"Pesan Amman\" (2004), serta sebagai penjaga situs-situs suci Islam dan Kristen di Yerusalem. Ia adalah pemimpin Arab yang paling lama menjabat saat ini."
