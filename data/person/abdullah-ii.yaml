summary:
  ar: "ملك المملكة الأردنية الهاشمية منذ 7 فبراير 1999، وُلد في عمّان سنة 1962، وهو أكبر أبناء الملك الحسين، خدم ضابطا في القوات المسلحة الأردنية وقائدا لقواتها الخاصة قبل اعتلائه العرش، وعُرف دوليا بدعوته إلى حوار الأديان وبـ«رسالة عمّان» (2004)، وبوصفه وصيا على المقدسات الإسلامية والمسيحية في القدس، وأقدم زعماء العرب الحاليين في الحكم."
  en: "King of the Hashemite Kingdom of Jordan since 7 February 1999, born in Amman in 1962, the eldest son of King Hussein. He served as an officer in the Jordanian Armed Forces and commander of its Special Forces before succeeding his father, and is known internationally for promoting interfaith dialogue through the Amman Message (2004) and as custodian of the Muslim and Christian holy places in Jerusalem; he is the longest-serving current Arab leader."
  ur: "اردن کے بادشاہ، جو 7 فروری 1999 سے تخت پر ہیں۔ وہ 1962 میں عمان میں پیدا ہوئے، شاہ حسین کے سب سے بڑے بیٹے ہیں، اور بادشاہ بننے سے پہلے اردنی فوج میں افسر اور خصوصی دستوں کے کمانڈر رہے۔ وہ بین المذاہب مکالمے اور یروشلم کے مقدس مقامات کی نگرانی کی وجہ سے معروف ہیں اور اس وقت سب سے طویل عرصے سے برسرِ اقتدار عرب رہنما ہیں۔"
