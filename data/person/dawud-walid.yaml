summary:
  ar: "إمام ومؤلف وناشط أمريكي من ديترويت، والمدير التنفيذي لفرع ميشيغان من مجلس العلاقات الأمريكية الإسلامية (كير) — أول أمريكي من أصل أفريقي يتولى هذا المنصب. وُلد في ديترويت سنة 1971 واعتنق الإسلام في أواخر مراهقته وخدم في البحرية الأمريكية، ودرس الإسلام والعربية في ديترويت وسافر للطلب إلى غانا ومالي والسنغال. من كتبه «السواد والإسلام» و«نحو نشاط مقدس» و«الفتوة وتربية الرجال إلى رجولة مقدسة»."
  en: "An American imam, author and activist from Detroit, and the executive director of the Michigan chapter of the Council on American-Islamic Relations (CAIR) — the first African American to hold that post. Born in Detroit in 1971, he embraced Islam in his late adolescence, served in the United States Navy, studied Islam and Arabic in Detroit and travelled for study to Ghana, Mali and Senegal. His books include Blackness and Islam, Towards Sacred Activism and Futuwwah and Raising Males Into Sacred Manhood."
  ur: "ڈیٹرائٹ سے تعلق رکھنے والے امریکی امام، مصنف اور کارکن، اور کونسل آن امریکن اسلامک ریلیشنز (CAIR) کے مشی گن چیپٹر کے ایگزیکٹو ڈائریکٹر — اس منصب پر فائز ہونے والے پہلے افریقی امریکی۔ 1971 میں ڈیٹرائٹ میں پیدا ہوئے، نوجوانی کے اواخر میں اسلام قبول کیا، امریکی بحریہ میں خدمت کی، ڈیٹرائٹ میں اسلام اور عربی کی تعلیم حاصل کی اور طلبِ علم کے لیے گھانا، مالی اور سینیگال کا سفر کیا۔ ان کی کتابوں میں «اسلام میں سیاہ فام شناخت»، «مقدس سرگرمی کی جانب» اور «فتوّہ» شامل ہیں۔"
