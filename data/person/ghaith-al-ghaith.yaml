summary:
  ar: "غيث الغيث رجل أعمال إماراتي في الطيران هو الرئيس التنفيذي المؤسس لفلاي دبي منذ إنشائها سنة 2008، اختارته حكومة دبي لقيادتها بعد مسيرة 23 سنة في طيران الإمارات انضم إليها متدربًا إداريًا سنة 1986 وبلغ فيها منصب نائب الرئيس التنفيذي للعمليات التجارية العالمية، فنمت الشركة في عهده إلى شبكة تتجاوز 95 وجهة في 50 بلدًا."
  en: "Ghaith Al Ghaith is an Emirati aviation executive who is the founding chief executive of flydubai, handpicked by the Government of Dubai in 2008 to head the airline after a 23-year career at Emirates, which he had joined as a management trainee in 1986 and where he rose to Executive Vice President Commercial Operations Worldwide; under him flydubai has grown to a network of more than 95 destinations in 50 countries."
  ur: "غیث الغیث اماراتی ہوابازی ایگزیکٹو ہیں جو 2008 میں فلائی دبئی کے قیام سے اس کے بانی چیف ایگزیکٹو ہیں؛ حکومتِ دبئی نے انھیں 23 سالہ امارات ایئرلائن کریئر کے بعد اس ذمہ داری کے لیے منتخب کیا — وہ 1986 میں انتظامی تربیت کار کے طور پر شامل ہوئے اور عالمی تجارتی آپریشنز کے ایگزیکٹو نائب صدر بنے — اور ان کے دور میں فلائی دبئی 50 ممالک میں 95 سے زائد منزلوں کے نیٹ ورک تک پھیل گئی۔"
