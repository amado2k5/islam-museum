summary:
  ar: "السلطان العاشر والأشهر من سلاطين آل عثمان، حكم من ٩٢٦ إلى ٩٧٤هـ/١٥٢٠–١٥٦٦م وهو أطول حكم في التاريخ العثماني. ولد في طرابزون وتولى العرش دون منازع، وقاد بنفسه ثلاث عشرة حملة منها عشر في أوروبا، فأخذ بلغراد ورودس وهزم المجريين في موهاكس وحاصر فيينا. ويُذكر في تقاليد الترك بالقانوني لما اتصل بعهده من تنظيم القانون السلطاني إلى جانب الشريعة بعون المفتي أبي السعود، وعُرف في الغرب بالعظيم، وبنى معه سنان مجمع السليمانية. توفي في خيمته أثناء حصار سيكتوار سنة ٩٧٤هـ/١٥٦٦م."
  en: "The tenth and most illustrious Ottoman sultan, who reigned 926–974 AH / 1520–1566 CE, the longest reign in Ottoman history. Born in Trabzon, he came to the throne without a rival and led thirteen imperial campaigns in person, ten of them in Europe, taking Belgrade and Rhodes, defeating the Hungarians at Mohács and besieging Vienna. Turkish tradition remembers him as Kanuni, the lawgiver, for ordering the sultanic kanun beside the shari'a with the help of the mufti Abu al-Su'ud, while the West called him the Magnificent; the architect Sinan built the Süleymaniye complex for him. He died in his tent during the siege of Szigetvár in 974 AH / 1566 CE."
  ur: "آلِ عثمان کے دسویں اور سب سے نامور سلطان، جن کا دور 926 سے 974ھ/1520 تا 1566ء رہا اور یہ عثمانی تاریخ کا طویل ترین دور ہے۔ وہ طرابزون میں پیدا ہوئے اور بغیر کسی حریف کے تخت پر بیٹھے، اور تیرہ شاہی مہمات کی خود قیادت کی جن میں دس یورپ میں تھیں؛ انہوں نے بلغراد اور رودس لیے، موہاکس میں ہنگری کو شکست دی اور ویانا کا محاصرہ کیا۔ ترک روایت انہیں قانونی یاد کرتی ہے کیونکہ مفتی ابو السعود کی مدد سے سلطانی قانون کو شریعت کے ساتھ ترتیب دیا گیا، جبکہ مغرب نے انہیں عظیم کہا؛ معمار سنان نے ان کے لیے سلیمانیہ مجمع بنایا۔ وہ 974ھ/1566ء میں سیگیتوار کے محاصرے کے دوران اپنے خیمے میں فوت ہوئے۔"
  es: "El décimo y más ilustre sultán otomano, que reinó entre 926 y 974 d. H. (1520-1566 d. C.), el reinado más largo de la historia otomana. Nacido en Trabzon, ascendió al trono sin rival y dirigió personalmente trece campañas imperiales, diez de ellas en Europa, conquistando Belgrado y Rodas, derrotando a los húngaros en Mohács y sitiando Viena. La tradición turca lo recuerda como Kanuni, el legislador, por haber ordenado la creación del kanun sultán junto a la sharia con la ayuda del muftí Abu al-Su'ud, mientras que Occidente lo llamó el Magnífico; el arquitecto Sinan construyó el complejo de Süleymaniye para él. Murió en su tienda durante el asedio de Szigetvár en 974 d. H. (1566 d. C.)."
  fr: "Le dixième et le plus illustre sultan ottoman, qui régna de 926 à 974 AH (1520-1566 ap. J.-C.), le plus long règne de l'histoire ottomane. Né à Trabzon, il accéda au trône sans rival et mena personnellement treize campagnes impériales, dont dix en Europe. Il s'empara de Belgrade et de Rhodes, vainquit les Hongrois à Mohács et assiégea Vienne. La tradition turque le surnomme Kanuni, le législateur, pour avoir institué le kanun sultan en complément de la charia avec l'aide du mufti Abu al-Su'ud. L'Occident, quant à lui, le surnommait le Magnifique. L'architecte Sinan construisit pour lui le complexe de Süleymaniye. Il mourut dans sa tente durant le siège de Szigetvár en 974 AH (1566 ap. J.-C.)."
  tr: "Osmanlı hanedanının onuncu ve en ünlü sultanı olan Sher, 926'dan 974 Hicri'ye / 1520–1566 yılları arasında hüküm sürdü ve Osmanlı tarihinin en uzun hükümdarı oldu. Trabzon'da doğdu ve tahta tartışmasız çıktı; on üç seferi bizzat yönetti; bunlardan onu, Avrupa'da olmak üzere, Belgrad ve Rodos'u ele geçirdi, Mohács'ta Macarları yendi ve Viyana'yı kuşattı. Türk geleneğinde, Müftü Ebu el-Suud'un yardımıyla Şeriat'la birlikte sultanlık hukukunu organize etmedeki hükümdarlığı nedeniyle yasal olarak anılır. Batı'da Büyük olarak biliniyordu ve Sinan ile birlikte Süleymaniye Konseyi'ni kurdu. 974 Hicri / 1566 yılında Siktür kuşatması sırasında çadırında öldü."
  id: "Sultan kesepuluh dan paling terkenal dari dinasti Ottoman, ia memerintah dari tahun 926 hingga 974 H / 1520–1566 M, menjadikannya masa pemerintahan terpanjang dalam sejarah Ottoman. Ia lahir di Trabzon dan naik takhta tanpa perlawanan, secara pribadi memimpin tiga belas kampanye, termasuk sepuluh di Eropa, merebut Beograd dan Rhodes, mengalahkan Hungaria di Mohács dan mengepung Wina. Dalam tradisi Turki, ia disebut sebagai legal karena pemerintahannya dalam mengatur hukum kesultanan bersama Syariah dengan bantuan Mufti Abu al-Saud. Ia dikenal di Barat sebagai yang Agung dan membangun Dewan Süleymaniye bersama Sinan. Ia meninggal di tendanya selama pengepungan Siktür pada tahun 974 H / 1566 M."
