summary:
  ar: "السلطان العاشر والأشهر من سلاطين آل عثمان، حكم من ٩٢٦ إلى ٩٧٤هـ/١٥٢٠–١٥٦٦م وهو أطول حكم في التاريخ العثماني. ولد في طرابزون وتولى العرش دون منازع، وقاد بنفسه ثلاث عشرة حملة منها عشر في أوروبا، فأخذ بلغراد ورودس وهزم المجريين في موهاكس وحاصر فيينا. ويُذكر في تقاليد الترك بالقانوني لما اتصل بعهده من تنظيم القانون السلطاني إلى جانب الشريعة بعون المفتي أبي السعود، وعُرف في الغرب بالعظيم، وبنى معه سنان مجمع السليمانية. توفي في خيمته أثناء حصار سيكتوار سنة ٩٧٤هـ/١٥٦٦م."
  en: "The tenth and most illustrious Ottoman sultan, who reigned 926–974 AH / 1520–1566 CE, the longest reign in Ottoman history. Born in Trabzon, he came to the throne without a rival and led thirteen imperial campaigns in person, ten of them in Europe, taking Belgrade and Rhodes, defeating the Hungarians at Mohács and besieging Vienna. Turkish tradition remembers him as Kanuni, the lawgiver, for ordering the sultanic kanun beside the shari'a with the help of the mufti Abu al-Su'ud, while the West called him the Magnificent; the architect Sinan built the Süleymaniye complex for him. He died in his tent during the siege of Szigetvár in 974 AH / 1566 CE."
  ur: "آلِ عثمان کے دسویں اور سب سے نامور سلطان، جن کا دور 926 سے 974ھ/1520 تا 1566ء رہا اور یہ عثمانی تاریخ کا طویل ترین دور ہے۔ وہ طرابزون میں پیدا ہوئے اور بغیر کسی حریف کے تخت پر بیٹھے، اور تیرہ شاہی مہمات کی خود قیادت کی جن میں دس یورپ میں تھیں؛ انہوں نے بلغراد اور رودس لیے، موہاکس میں ہنگری کو شکست دی اور ویانا کا محاصرہ کیا۔ ترک روایت انہیں قانونی یاد کرتی ہے کیونکہ مفتی ابو السعود کی مدد سے سلطانی قانون کو شریعت کے ساتھ ترتیب دیا گیا، جبکہ مغرب نے انہیں عظیم کہا؛ معمار سنان نے ان کے لیے سلیمانیہ مجمع بنایا۔ وہ 974ھ/1566ء میں سیگیتوار کے محاصرے کے دوران اپنے خیمے میں فوت ہوئے۔"
