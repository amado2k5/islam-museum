summary:
  ar: "جيرارد الكريموني عالم إيطالي عاش نحو 1114 إلى 1187م، وعدّته دائرة المعارف الإسلامية من قادة حركة الترجمة من العربية إلى اللاتينية في القرن الثاني عشر، وتقول إنه يُنسب إليه نقل أكثر من سبعين عملاً. ومن المترجَمات التي تذكرها: أصول إقليدس بشرح النيريزي، وإحصاء العلوم للفارابي، وجبر الخوارزمي، وقانون ابن سينا، ومنصوري الرازي، وزيج ابن معاذ الجياني {cite:encyclopaedia-of-islam-2 vol. 7 p. 792} {cite:encyclopaedia-of-islam-2 vol. 2 p. 386}."
  en: "Gerard of Cremona was an Italian scholar who lived from about 1114 to 1187, and the Encyclopaedia of Islam counts him among the leaders of the twelfth-century movement translating from Arabic into Latin, saying he is credited with more than seventy works. Among the translations it names are Euclid's Elements with al-Nayrizi's commentary, al-Farabi's Survey of the Sciences, al-Khwarizmi's algebra, Ibn Sina's Canon, al-Razi's Mansuri and the Jaen tables of Ibn Mu'adh {cite:encyclopaedia-of-islam-2 vol. 7 p. 792} {cite:encyclopaedia-of-islam-2 vol. 2 p. 386}."
  ur: "جیرارڈ آف کریمونا ایک اطالوی عالم تھے جو تقریباً 1114ء سے 1187ء تک زندہ رہے؛ دائرۃ المعارف الاسلامیہ انہیں بارہویں صدی میں عربی سے لاطینی ترجمے کی تحریک کے رہنماؤں میں شمار کرتا ہے اور کہتا ہے کہ ستر سے زیادہ کتابوں کا ترجمہ ان سے منسوب ہے۔ جن تراجم کا ذکر ہے ان میں نیریزی کی شرح کے ساتھ اقلیدس کے اصول، فارابی کی احصاء العلوم، خوارزمی کی الجبر، ابن سینا کا القانون، رازی کی المنصوری اور ابن معاذ کے جیان کے جدول شامل ہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 792} {cite:encyclopaedia-of-islam-2 vol. 2 p. 386}."
