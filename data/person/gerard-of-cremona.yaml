kids:
  ar: "جيرارد الكريموني ترجم عشرات الكتب العربية إلى اللاتينية، فقرأها علماء أوروبا."
  en: "Gerard of Cremona translated dozens of Arabic books into Latin so that scholars across Europe could read them."
  ur: "جیرارڈ آف کریمونا نے درجنوں عربی کتابوں کا لاطینی میں ترجمہ کیا تاکہ یورپ کے عالم انہیں پڑھ سکیں۔"
