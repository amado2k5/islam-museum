summary:
  ar: "فاطمة بوتو (وُلدت سنة 1982) كاتبة وكاتبة أعمدة باكستانية، وُلدت في كابول أثناء منفى والدها مرتضى بوتو، ونشأت في سوريا وكراتشي. درست في كلية بارنارد وفي مدرسة الدراسات الشرقية والأفريقية في لندن، ونشرت مجموعة شعرية في الخامسة عشرة، ثم مذكرات عائلتها «أغاني الدم والسيف» (2010)، وروايتي «ظل القمر الهلالي» (2013) و«الهاربون» (2019). وهي ناقدة صريحة لعمتها بينظير بوتو وللسياسة السلالية، ولا تنتمي إلى أي حزب."
  en: "Fatima Bhutto (born 1982) is a Pakistani writer and columnist, born in Kabul during her father Murtaza Bhutto's exile and raised in Syria and Karachi. Educated at Barnard College and SOAS in London, she published a poetry collection at fifteen, the family memoir Songs of Blood and Sword (2010), and the novels The Shadow of the Crescent Moon (2013) and The Runaways (2019). She is an outspoken critic of her aunt Benazir Bhutto and of dynastic politics, and belongs to no political party."
  ur: "فاطمہ بھٹو (پیدائش 1982) پاکستانی مصنفہ اور کالم نگار ہیں، جو اپنے والد مرتضیٰ بھٹو کی جلاوطنی کے دوران کابل میں پیدا ہوئیں اور شام و کراچی میں پلی بڑھیں۔ برنارڈ کالج اور لندن کے سواس سے تعلیم پائی؛ پندرہ برس کی عمر میں شاعری کا مجموعہ شائع کیا، پھر خاندانی یادداشت «Songs of Blood and Sword» (2010) اور ناول «The Shadow of the Crescent Moon» (2013) و «The Runaways» (2019) لکھے۔ وہ اپنی پھوپھو بے نظیر بھٹو اور موروثی سیاست کی کھلی ناقد ہیں اور کسی سیاسی جماعت سے وابستہ نہیں۔"

