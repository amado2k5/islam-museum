summary:
  ar: "فاطمة بوتو ⁦(وُلدت سنة 1982)⁩ كاتبة وكاتبة أعمدة باكستانية، وُلدت في كابول أثناء منفى والدها مرتضى بوتو، ونشأت في سوريا وكراتشي. درست في كلية بارنارد وفي مدرسة الدراسات الشرقية والأفريقية في لندن، ونشرت مجموعة شعرية في الخامسة عشرة، ثم مذكرات عائلتها «أغاني الدم والسيف» (2010)، وروايتي «ظل القمر الهلالي» (2013) و«الهاربون» (2019). وهي ناقدة صريحة لعمتها بينظير بوتو وللسياسة السلالية، ولا تنتمي إلى أي حزب."
  en: "Fatima Bhutto (born 1982) is a Pakistani writer and columnist, born in Kabul during her father Murtaza Bhutto's exile and raised in Syria and Karachi. Educated at Barnard College and SOAS in London, she published a poetry collection at fifteen, the family memoir Songs of Blood and Sword (2010), and the novels The Shadow of the Crescent Moon (2013) and The Runaways (2019). She is an outspoken critic of her aunt Benazir Bhutto and of dynastic politics, and belongs to no political party."
  ur: "فاطمہ بھٹو ⁦(پیدائش 1982)⁩ پاکستانی مصنفہ اور کالم نگار ہیں، جو اپنے والد مرتضیٰ بھٹو کی جلاوطنی کے دوران کابل میں پیدا ہوئیں اور شام و کراچی میں پلی بڑھیں۔ برنارڈ کالج اور لندن کے سواس سے تعلیم پائی؛ پندرہ برس کی عمر میں شاعری کا مجموعہ شائع کیا، پھر خاندانی یادداشت «Songs of Blood and Sword» (2010) اور ناول «The Shadow of the Crescent Moon» (2013) و «The Runaways» (2019) لکھے۔ وہ اپنی پھوپھو بے نظیر بھٹو اور موروثی سیاست کی کھلی ناقد ہیں اور کسی سیاسی جماعت سے وابستہ نہیں۔"
  es: "Fatima Bhutto (nacida en 1982) es una escritora y columnista pakistaní, nacida en Kabul durante el exilio de su padre, Murtaza Bhutto, y criada en Siria y Karachi. Estudió en el Barnard College y en la SOAS de Londres. Publicó un poemario a los quince años, las memorias familiares Canciones de sangre y espada (2010) y las novelas La sombra de la luna creciente (2013) y Los fugitivos (2019). Es una crítica abierta de su tía Benazir Bhutto y de la política dinástica, y no pertenece a ningún partido político."
  fr: "Fatima Bhutto (née en 1982) est une écrivaine et chroniqueuse pakistanaise, née à Kaboul pendant l'exil de son père, Murtaza Bhutto, et élevée en Syrie et à Karachi. Après des études au Barnard College et à la SOAS de Londres, elle a publié un recueil de poésie à quinze ans, le récit familial « Songs of Blood and Sword » (2010), ainsi que les romans « The Shadow of the Crescent Moon » (2013) et « The Runaways » (2019). Critique virulente de sa tante Benazir Bhutto et du népotisme politique, elle n'appartient à aucun parti politique."
  tr: "Fatima Bhutto (1982 doğumlu), babası Murtaza Bhutto'nun sürgünde olduğu dönemde Kabil'de doğmuş Pakistanlı bir yazar ve köşe yazarıdır ve Suriye ile Karaçi'de büyümüştür. Barnard College ve Londra'daki Oryantal ve Afrika Çalışmaları Okulu'nda eğitim gördü, on beş yaşında bir şiir koleksiyonu yayımladı, ardından aile anıları \"Songs of Blood and the Sword\" (2010) ve romanları \"The Shadow of the Crescent Moon\" (2013) ile \"The Fugitives\" (2019) yayımlandı. Teyzesi Benazir Bhutto'nun ve hanedan siyasetinin açık sözlü bir eleştirmenidir ve herhangi bir partiye mensup değildir."
  id: "Fatima Bhutto (lahir 1982) adalah seorang penulis dan kolumnis Pakistan, lahir di Kabul saat pengasingan ayahnya, Murtaza Bhutto, dan tumbuh besar di Suriah dan Karachi. Ia belajar di Barnard College dan di School of Oriental and African Studies di London, menerbitkan kumpulan puisi pada usia lima belas tahun, diikuti oleh memoar keluarganya \"Songs of Blood and the Sword\" (2010), serta novel-novelnya \"The Shadow of the Crescent Moon\" (2013) dan \"The Fugitives\" (2019). Ia adalah kritikus vokal terhadap bibinya Benazir Bhutto dan politik dinasti, dan tidak tergabung dalam partai manapun."

