summary:
  ar: "ملبد بن حرملة الشيباني، زعيم الخوارج في الجزيرة؛ ثار في عهد المنصور سنة ١٣٧ فأرسل إليه يزيد بن حاتم المهلي ليمثل معه دور عمه المهلب بن أبي صفرة فهزمه مُلَبِّد، وما زال المنصور يرسل إليه القائد بعد القائد وملبد يهزمهم، حتى وجه إليه أخيراً خازم بن خزيمة ومعه نحو ثمانمائة ألف من أهل مرو الروذ، فتقاتلوا طويلاً ثم أمر خازم أصحابه أن يرموهم بالنشاب فرشقوا ملبداً بنشابه فقُتل معه كثيرون سنة ١٣٨ {cite:duha-islam p. 951}."
  en: "Mulabbid ibn Harmala — the Jaziran Khariji who routed governor after governor until Khazim ibn Khuzayma's archers brought him down, 138 AH {cite:duha-islam p. 951}."
