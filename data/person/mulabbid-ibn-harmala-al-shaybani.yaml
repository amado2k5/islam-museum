summary:
  ar: "ملبد بن حرملة الشيباني، زعيم الخوارج في الجزيرة؛ ثار في عهد المنصور سنة ١٣٧ فأرسل إليه يزيد بن حاتم المهلي ليمثل معه دور عمه المهلب بن أبي صفرة فهزمه مُلَبِّد، وما زال المنصور يرسل إليه القائد بعد القائد وملبد يهزمهم، حتى وجه إليه أخيراً خازم بن خزيمة ومعه نحو ثمانمائة ألف من أهل مرو الروذ، فتقاتلوا طويلاً ثم أمر خازم أصحابه أن يرموهم بالنشاب فرشقوا ملبداً بنشابه فقُتل معه كثيرون سنة ١٣٨ {cite:duha-islam p. 951}."
  en: "Mulabbid ibn Harmala — the Jaziran Khariji who routed governor after governor until Khazim ibn Khuzayma's archers brought him down, 138 AH {cite:duha-islam p. 951}."
  es: "Mulabbid ibn Harmala, el Jaziran Khariji que derrotó a gobernador tras gobernador hasta que los arqueros de Khazim ibn Khuzayma lo derribaron, 138 AH {cita:duha-islam p. 951}."
  fr: "Mulabbid ibn Harmala — le Jaziran Khariji qui a mis en déroute gouverneur après gouverneur jusqu'à ce que les archers de Khazim ibn Khuzayma le fassent tomber, 138 AH {cite:duha-islam p. 951}."
  ur: "مولابید ابن حرملہ - جزیران خارجی جس نے گورنر کے بعد گورنر کو شکست دی یہاں تک کہ خزیم ابن خزیمہ کے تیر اندازوں نے اسے گرا دیا، 138 ہجری۔ 951}۔"
  tr: "Arap Yarımadası'ndaki Haricilerin lideri Mulbad ibn Harmala al-Shaybani; 137 Hicri yılında, el-Mansur döneminde isyan etti. Yazid bin Hatim el-Mühli, amcası el-Muhallab bin Ebi Sufra rolünü oynaması için ona gönderildi, ancak Mulbad onu yendi. El-Mansur komutan komutan göndermeye devam etti ve Milbad onları yendi; sonunda Khazim ibn Khuzaymah, Marw-al-Rudh'dan yaklaşık sekiz yüz bin kişiyle birlikte ona gönderildi. Uzun süre savaştılar, ardından Khazim yoldaşlarına onları yayla vurmalarını emretti, onlar da Mulbad'ı arbaletleriyle vurdu, 138 Hicri yılında onunla birlikte birçok kişiyi öldürdüler."
  id: "Mulbad ibn Harmala al-Shaybani, pemimpin Kharijit di Semenanjung Arab; ia memberontak selama masa pemerintahan al-Mansur pada tahun 137 H. Yazid ibn Hatim al-Muhli dikirim kepadanya untuk berperan sebagai pamannya al-Muhallab ibn Abi Sufra, namun Mulbad berhasil mengalahkannya. Al-Mansur terus mengirim komandan demi komandan, dan Milbad mengalahkan mereka, hingga akhirnya Khazim ibn Khuzaymah dikirim kepadanya bersama sekitar delapan ratus ribu orang dari Marw-al-Rudh. Mereka bertarung lama, lalu Khazim memerintahkan teman-temannya untuk menembak mereka dengan busur silang, dan mereka menembak Mulbad dengan busur silangnya, membunuh banyak yang bersamanya pada tahun 138 H."
