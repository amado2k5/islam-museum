id: person/abd-allah-ibn-yusuf-al-jurjani
class: person
label:
  ar: "عبد الله بن يوسف الجرجاني"
  en: "Abd Allah ibn Yusuf al-Jurjani"
  fr: "Abd Allah ibn Yusuf al-Jurjani"
  ur: "عبد اللہ بن یوسف جرجانی"
  es: "Abd Allah ibn Yusuf al-Jurjani"
roles: [scholar, qadi]
gender: male
summary:
  ar: "عبد الله بن يوسف الجرجاني، أبو محمد، قاضٍ ومحدّث حافظ ولد سنة ٤٠٩هـ وتوفي في ذي القعدة سنة ٤٨٩هـ؛ سمع من حمزة بن يوسف السهمي وبنيسابور من عبد الغافر الفارسي، وجمع كتابين في مناقب الشافعي ومناقب أحمد."
  en: "Abd Allah ibn Yusuf al-Jurjani, Abu Muhammad, judge and hadith scholar and hafiz, born in 409 AH and died in Dhu al-Qa'da 489 AH; he heard from Hamza ibn Yusuf al-Sahmi and in Nishapur from Abd al-Ghafir al-Farisi, and compiled one book on the merits of al-Shafi'i and another on those of Ahmad ibn Hanbal."
  fr: "Abd Allah ibn Yusuf al-Jurjani, Abu Muhammad, juge, spécialiste du hadith et hafiz, né en 409 H et mort en dhu al-qa'da 489 H ; il entendit Hamza ibn Yusuf al-Sahmi et, à Nishapur, Abd al-Ghafir al-Farisi, et compila un livre sur les mérites d'al-Shafi'i et un autre sur ceux d'Ahmad ibn Hanbal."
  ur: "عبد اللہ بن یوسف جرجانی، ابو محمد، قاضی اور حدیث کے حافظ، 409ھ میں پیدا ہوئے اور ذوالقعدہ 489ھ میں فوت ہوئے؛ انہوں نے حمزہ بن یوسف سہمی سے اور نیشاپور میں عبد الغافر فارسی سے سنا، اور امام شافعی کے مناقب پر ایک اور امام احمد کے مناقب پر دوسری کتاب جمع کی۔"
  es: "Abd Allah ibn Yusuf al-Jurjani, Abu Muhammad, juez, erudito de hadices y hafiz, nació en el año 409 de la Hégira y murió en Dhu al-Qa'da del año 489 de la Hégira; escuchó a Hamza ibn Yusuf al-Sahmi y en Nishapur a Abd al-Ghafir al-Farisi, y compiló un libro sobre los méritos de al-Shafi'i y otro sobre los de Ahmad ibn Hanbal."
  tr: "Abdullah bin Yusuf el-Curcani, Ebu Muhammed, bir kadı ve hadis âlimi olup, Hicri 409 yılında doğmuş ve Hicri 489 yılının Zilhicce ayında vefat etmiştir. Hamza bin Yusuf el-Sahmi'den ve Nişapur'da Abdül-Gafir el-Farisi'den hadis öğrenmiş ve Şafiî mezhebi ile Ahmed mezhebin faziletleri üzerine iki kitap derlemiştir."
  id: "Abdullah bin Yusuf al-Jurjani, Abu Muhammad, seorang hakim dan ahli hadits, lahir pada tahun 409 H dan wafat pada bulan Dzul Qa'dah 489 H. Beliau mendengar hadits dari Hamza bin Yusuf al-Sahmi dan di Nishapur dari Abd al-Ghafir al-Farisi, dan beliau menyusun dua buku tentang keutamaan al-Shafi'i dan keutamaan Ahmad."
