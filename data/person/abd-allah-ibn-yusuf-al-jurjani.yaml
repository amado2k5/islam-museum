summary:
  ar: "عبد الله بن يوسف الجرجاني، أبو محمد، قاضٍ ومحدّث حافظ ولد سنة ٤٠٩هـ وتوفي في ذي القعدة سنة ٤٨٩هـ؛ سمع من حمزة بن يوسف السهمي وبنيسابور من عبد الغافر الفارسي، وجمع كتابين في مناقب الشافعي ومناقب أحمد."
  en: "Abd Allah ibn Yusuf al-Jurjani, Abu Muhammad, judge and hadith scholar and hafiz, born in 409 AH and died in Dhu al-Qa'da 489 AH; he heard from Hamza ibn Yusuf al-Sahmi and in Nishapur from Abd al-Ghafir al-Farisi, and compiled one book on the merits of al-Shafi'i and another on those of Ahmad ibn Hanbal."
  ur: "عبد اللہ بن یوسف جرجانی، ابو محمد، قاضی اور حدیث کے حافظ، 409ھ میں پیدا ہوئے اور ذوالقعدہ 489ھ میں فوت ہوئے؛ انہوں نے حمزہ بن یوسف سہمی سے اور نیشاپور میں عبد الغافر فارسی سے سنا، اور امام شافعی کے مناقب پر ایک اور امام احمد کے مناقب پر دوسری کتاب جمع کی۔"
