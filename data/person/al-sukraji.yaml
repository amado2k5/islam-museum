summary:
  ar: "الإمام القراف شيخ كرج محمد بن عبد الملك الكرجي المعروف بالسكرجي؛ قرأ القراءات وسمع الكثير وله كتاب الفصول في الاعتقاد ومختصر الذرائع وغير ذلك، وقد احتج على المعتزلة بكتب، وكان إماماً جليلاً؛ ولد سنة ثمان وخمسين وأربعمائة وتوفي سنة اثنتين وثلاثين وخمسمائة {cite:shadharat-dhahab p. 583}."
  en: "The ascetic imam, shaykh of Karj, Muhammad ibn Abd al-Malik al-Karaji known as al-Sukraji; master of the Qur'an readings and much transmission; author of al-Fusul fi'l-i'tiqad, the abridgement of al-Dhara'i' and more, and he argued against the Mu'tazila in books — a great imam; b. 458, d. 532 {cite:shadharat-dhahab p. 583}."
