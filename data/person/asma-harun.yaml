summary:
  ar: "داعية وكاتبة ماليزية، خريجة جامعة الأزهر في مصر، عملت في إدارة الشؤون الإسلامية بولاية نيجري سمبيلان من 2008 حتى استقالتها في 2017. هي إحدى أكثر داعيتين متابعة في ماليزيا، إذ بلغ متابعوها على إنستغرام 1.1 مليون بحسب دراسة معهد ISEAS، وتقود مجمع «قرية الهجرة» التعليمي الداخلي ومجتمع «رفقاء الهجرة»."
  en: "Malaysian preacher and author, a graduate of Al-Azhar University in Egypt who worked at the Negeri Sembilan State Islamic Religious Department from 2008 until she resigned in 2017. She is one of Malaysia's two most-followed celebrity ustazahs, with 1.1 million Instagram followers as counted in ISEAS's study, and she leads the Perkampungan Al-Hijrah (Hijrah Village) boarding complex and the Sahabat Hijrah community."
  ur: "ملائیشیائی مبلغہ اور مصنفہ، مصر کی جامعہ الازہر کی فارغ التحصیل، 2008 سے 2017 میں استعفے تک نگری سمبیلان کے محکمۂ امورِ اسلامیہ میں کام کیا۔ وہ ملائشیا کی دو سب سے زیادہ فالو کی جانے والی معروف استاذاؤں میں سے ایک ہیں؛ ISEAS کی تحقیق کے مطابق انسٹاگرام پر ان کے فالوورز 1.1 ملین ہیں، اور وہ «پرکامپونگن الہجرہ» (ہجرہ ویلیج) بورڈنگ کمپلیکس اور «صحابۃ ہجرہ» کمیونٹی کی سربراہ ہیں۔"
