summary:
  ar: "أبو يحيى من أهل أنطاكية، قدم مصر وحدّث بها وكان ثقة ثبتًا صالحًا؛ توفي في رمضان سنة ثمانين ومائتين {cite:muntazam-ibn-al-jawzi p. 180}."
  en: "Abu Yahya of Antioch, who came to Egypt and transmitted there — trustworthy, exacting and pious; he died in Ramadan 280 {cite:muntazam-ibn-al-jawzi p. 180}."
  es: "Abu Yahya de Antioquía, que vino a Egipto y transmitió allí —digno de confianza, exigente y piadoso— murió en Ramadán 280 {cite:muntazam-ibn-al-jawzi p. 180}."
  fr: "Abu Yahya d'Antioche, qui vint en Égypte et y transmit — digne de confiance, exigeant et pieux; il mourut en Ramadan 280 {cite: muntazam-ibn-al-jawzi p. 180}."
  ur: "انطاکیہ کا ابو یحییٰ، جو مصر آیا اور وہاں منتقل ہوا - ثقہ، محنتی اور متقی۔ آپ کی وفات رمضان المبارک 280 میں ہوئی۔ 180}۔"
  tr: "Ebu Yahya Antakya'dandı, Mısır'a geldi, orada rivayet etti ve güvenilir, kararlı ve doğru biriydi; Ramazan'da iki yüz seksen yılda öldü {cite:muntazam-ibn-al-jawzi s. 180}."
  id: "Abu Yahya berasal dari Antiokhia, datang ke Mesir, menceritakan di sana, dan dapat dipercaya, teguh, dan benar; ia meninggal pada bulan Ramadan tahun dua ratus delapan puluh {cite:muntazam-ibn-al-jawzi hlm. 180}."
