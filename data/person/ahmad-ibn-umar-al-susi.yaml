summary:
  ar: "أبو جعفر السوسي الكوفي، من المحدثين؛ روى عنه أبو علي أحمد بن أحمد بن الأشعث الكوفي أنه كان معه في الحج، فلما رأى الهلال قال له ائتوني بمائة سنة، ثم قال لي وضوءه فتوضأ لصلاة المغرب ودخل فيها وسجد سجدة فطال عليه أمرها فإذا هو ميت، وذلك سنة تسع وخمسين ومائتين {cite:muntazam-ibn-al-jawzi p. 105}."
  en: "Abu Ja'far al-Susi of Kufa, traditionist; on the Hajj he was seen dead in prostration during the Maghrib prayer — he died in 259 {cite:muntazam-ibn-al-jawzi p. 105}."
  es: "Abu Ja'far al-Susi de Kufa, tradicionalista; en el Hajj fue visto muerto en postración durante la oración del Maghrib; murió en 259 {cite:muntazam-ibn-al-jawzi p. 105}."
  fr: "Abu Ja'far al-Susi de Kufa, traditionniste; lors du Hajj, il a été vu mort en prosternation pendant la prière du Maghrib — il est mort en 259 {cite:muntazam-ibn-al-jawzi p. 105}."
  ur: "ابو جعفر السوسی آف کوفہ، روایت دان؛ حج کے موقع پر آپ کو نماز مغرب کے دوران سجدے میں مردہ دیکھا گیا - آپ کی وفات 259 میں ہوئی۔ 105}۔"
  tr: "Hadis âlimlerinden Ebu Cafer el-Susi el-Kufi; Ebu Ali Ahmed ibn Ahmed ibn el-Eş'at el-Kufi şöyle rivayet etmiştir: Hacda onunla birlikteydim ve hilali görünce ona, \"Bana yüz yıl getir\" dedi. Sonra bana, \"Akşam namazı için abdest al\" dedi. Bunun üzerine akşam namazı için abdest aldı, namaza girdi ve bir kez secde etti. Sonra uzun bir süre namazı kıldı ve vefat etti. Bu olay 259 yılında gerçekleşti. {Kaynak: Muntazam ibn el-Cevzi, s. 105}"
  id: "Abu Ja'far al-Susi al-Kufi, salah seorang ulama hadits; Abu Ali Ahmad ibn Ahmad ibn al-Ash'ath al-Kufi meriwayatkan bahwa ia bersamanya dalam ibadah haji, dan ketika ia melihat bulan sabit, ia berkata kepadanya, “Berikan aku seratus tahun.” Kemudian ia berkata kepadaku, “Berwudhulah untuk salat Maghrib.” Maka ia berwudhu untuk salat Maghrib dan masuk ke dalamnya dan sujud sekali, kemudian ia membutuhkan waktu yang lama, dan kemudian ia meninggal dunia. Itu terjadi pada tahun 259. {cite:muntazam-ibn-al-jawzi p. 105}."
