summary:
  ar: "محدث وفقيه مغربي ⁦(1910–1992)⁩ من أسرة الغماري العلمية الحسنية. من كبار المحدثين المغاربة في القرن العشرين، له عشرات المؤلفات في الحديث والفقه والأدب، منها «الابتهاج بأدب الإسناد والإمتاع والإنتاج» و«توجيه العناية لتحرير التنبيه»."
  en: "Moroccan hadith scholar and jurist (1910–1992) of the scholarly Ghumari family of Tangier. One of the leading Moroccan muhaddiths of the twentieth century, he authored dozens of works on hadith, jurisprudence and literature, including Al-Ibtihaj and Tawjih al-Inaya."
  fr: "Savant du hadith et juriste marocain (1910–1992), issu de la famille savante des Ghumari de Tanger. L'un des principaux muhaddiths marocains du XXe siècle, il écrivit des dizaines d'ouvrages sur le hadith, le droit et la littérature, dont Al-Ibtihaj et Tawjih al-Inaya."
  ur: "مغربی محدث اور فقیہ ⁦(1910–1992)⁩ جو طنجہ کے علمی غماری خاندان سے تھے۔ بیسویں صدی کے نمایاں مغربی محدثین میں شمار ہوتے ہیں؛ حدیث، فقہ اور ادب پر ان کی بے شمار تصانیف میں «الابتہاج» اور «توجیہ العنایہ» شامل ہیں۔"
  es: "Erudito marroquí de hadices y jurista (1910-1992), perteneciente a la prestigiosa familia Ghumari de Tánger. Fue uno de los principales muhaddiths marroquíes del siglo XX y autor de decenas de obras sobre hadices, jurisprudencia y literatura, entre las que destacan Al-Ibtihaj y Tawjih al-Inaya."
  tr: "Hassani soyundan gelen El-Gamari alim ailesine mensup, Faslı bir hadis ve fıkıh alimi (1910–1992). Yirminci yüzyılın önde gelen Faslı hadis alimlerinden biriydi ve \"Al-Ibtihaj bi-Adab al-Isnad wal-Imtaa' wal-Intaj\" ve \"Tawjih al-'Inaya li-Tahrir al-Tanbih\" de dahil olmak üzere hadis, fıkıh ve edebiyat üzerine onlarca eser kaleme aldı."
  id: "Seorang ulama Hadits dan fiqih Maroko (1910–1992) dari keluarga ulama Al-Ghamari dari garis keturunan Hassani. Beliau adalah salah satu ulama Hadits terkemuka Maroko pada abad ke-20, dan beliau menulis puluhan karya tentang Hadits, fiqih, dan sastra, termasuk \"Al-Ibtihaj bi-Adab al-Isnad wal-Imtaa' wal-Intaj\" dan \"Tawjih al-'Inaya li-Tahrir al-Tanbih\"."
