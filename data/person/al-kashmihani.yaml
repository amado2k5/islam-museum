summary:
  ar: "أبو الفتح عبد الله بن عبد الرحمن الكشميهني المرودي الخطيب شيخ الصوفية ببلده وآخر من روى عن محمد بن أبي عمران صحيح البخاري؛ عاش ثمانياً وثمانين سنة وترجمته في أخبار سنة ثمان وأربعين وخمسمائة {cite:shadharat-dhahab p. 630}."
  en: "Abu al-Fath Abdallah ibn Abd al-Rahman al-Kashmihani of Marw al-Rudh, the khatib — shaykh of the Sufis of his town and the last to transmit Sahih al-Bukhari from Muhammad ibn Abi Imran; he lived eighty-eight years; his notice falls in year 548 {cite:shadharat-dhahab p. 630}."
  es: "Abu al-Fath Abdallah ibn Abd al-Rahman al-Kashmihani de Marw al-Rudh, el khatib — shaykh de los sufíes de su ciudad y el último en transmitir Sahih al-Bukhari de Muhammad ibn Abi Imran; vivió ochenta y ocho años; su mención se encuentra en el año 548 {cite:shadharat-dhahab p. 630}."
  fr: "Abu al-Fath Abdallah ibn Abd al-Rahman al-Kashmihani de Marw al-Rudh, le khatib — cheikh des soufis de sa ville et le dernier à transmettre Sahih al-Bukhari de Muhammad ibn Abi Imran; il vécut quatre-vingt-huit ans; sa notice tombe en l'an 548 {cite: shadharat-dhahab p. 630}."
  ur: "ابو الفتح عبد اللہ بن عبدالرحمٰن کاشمیانی مرو الرود کے خطیب - اپنے شہر کے صوفیاء کے شیخ اور محمد ابن ابی عمران سے صحیح البخاری کو منتقل کرنے والے آخری؛ وہ اٹھاسی سال زندہ رہا۔ اس کا نوٹس 548 میں آتا ہے۔ 630}۔"
  tr: "Kasabasında Sufilerin vaizi olan ve Muhammed bin Ebu İmran'dan Sahih al-Bukhari'de son rivayet eden Ebu el-Feth Abdullah ibn Abd Rahman el-Keşmihini el-Marvadi; seksen sekiz yıl yaşadı ve biyografisi beş yüz kırk sekiz yılın haberlerinde yer almaktadır {atıf: Shadharat-Dhahab, s. 630}."
  id: "Abu al-Fath Abdullah ibn Abd al-Rahman al-Kashmihini al-Marwadi, pengkhotbah para Sufi di kotanya dan yang terakhir menceritakan dari Muhammad ibn Abi Imran dalam Sahih al-Bukhari; ia hidup delapan puluh delapan tahun dan biografinya tercatat dalam berita tahun lima ratus empat puluh delapan {cite:shadharat-dhahab, hlm. 630}."
