summary:
  en: "A devout Companion from the Aws who fought at Badr and was captured at al-Raji'; sold to the Meccans who condemned him to crucifixion at al-Tan'im; before his execution he prayed two rak'ahs, establishing the tradition for Muslim prisoners before death, and recited poetry affirming his steadfast faith."
  ar: "صحابي بدري من الأوس؛ أُسر في سرية الرجيع وبيف بمكة لآل الحارث بن عامر ليقتلوه بأبيهم، فلما أخرجوه إلى التنعيم ليصلبوه طلب أن يصلي ركعتين فكان أول من سنّ الركعتين عند القتل صبراً، ثم أنشد لست أبالي حين أقتل مسلماً على أي جنب كان في الله مصرعي."
  ur: "اوس کا عابد صحابی جو بدر میں لڑا اور رجیع میں قیدی بنا؛ مکیوں کو بیچا گیا جنہوں نے اسے صلیب پر چڑھانے کا فیصلہ کیا۔"
  es: "Un devoto Compañero de los Aws que luchó en Badr y fue capturado en al-Raji'; vendido a los mecanos, quienes lo condenaron a la crucifixión en al-Tan'im; antes de su ejecución, rezó dos rak'ahs, estableciendo la tradición para los prisioneros musulmanes antes de la muerte, y recitó poesía que afirmaba su fe inquebrantable."
  fr: "Un Compagnon dévoué de la tribu des Aws, qui combattit à Badr et fut capturé à al-Raji'; vendu aux Mecquois qui le condamnèrent à la crucifixion à al-Tan'im; avant son exécution, il pria deux rak'ahs, établissant ainsi la tradition pour les prisonniers musulmans avant leur mort, et récita des poèmes affirmant sa foi inébranlable."
  tr: "Bedri Havı'ndan bir sahabeydi; Mekke'de El-Rajee ve Bayf seferinde El-Haris bin 'Emir'in ailesine babalarıyla birlikte öldürülmek üzere yakalandı. Onu çarmıha gerilmek üzere dışarı çıkardıklarında, iki reket namaz kılmasını istedi ve öldürüldüğünde sabırla iki rekâtı ilk buyuran o oldu. Sonra şöyle dedi: 'Allah uğruna hangi tarafta olursam olayım da bir Müslümanı öldürürsem öldürürüm.'"
  id: "Seorang sahabat Badri dari Aws; ia ditangkap dalam ekspedisi Al-Rajee' dan Bayf di Mekah kepada keluarga Al-Harith ibn 'Amir untuk dibunuh bersama ayah mereka. Ketika mereka membawanya keluar untuk disalibkan, ia memintanya untuk berdoa dua rak'ah, dan ia adalah yang pertama meresepkan dua rak'ah itu dengan sabar. Kemudian ia mengucapkan, 'Saya tidak peduli jika saya membunuh seorang Muslim di pihak mana pun saya demi Allah.'"
