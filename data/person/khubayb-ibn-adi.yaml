summary:
  en: "A devout Companion from the Aws who fought at Badr and was captured at al-Raji'; sold to the Meccans who condemned him to crucifixion at al-Tan'im; before his execution he prayed two rak'ahs, establishing the tradition for Muslim prisoners before death, and recited poetry affirming his steadfast faith."
  ar: "صحابي بدري من الأوس؛ أُسر في سرية الرجيع وبيف بمكة لآل الحارث بن عامر ليقتلوه بأبيهم، فلما أخرجوه إلى التنعيم ليصلبوه طلب أن يصلي ركعتين فكان أول من سنّ الركعتين عند القتل صبراً، ثم أنشد لست أبالي حين أقتل مسلماً على أي جنب كان في الله مصرعي."
