summary:
  ar: "فيزيائي ومخترع إيراني أمريكي (1926–2016)، وُلد في طهران وتوفي في لوس أنجلوس، كان أول من اقترح مبدأ ليزر الغاز، وشارك في بناء أول نموذج منه (ليزر الهليوم–نيون) في مختبرات بل سنة 1960، وهو أول ليزر يعمل باستمرار، ثم عمل أستاذا للفيزياء في معهد ماساتشوستس للتقانة."
  en: "Iranian-American physicist and inventor (1926–2016), born in Tehran and died in Los Angeles, who first proposed the gas laser and co-built its first working model — the helium–neon laser — at Bell Laboratories in 1960, the first continuously operating laser, and was a professor of physics at MIT."
  ur: "ایرانی نژاد امریکی طبیعیات دان اور موجد (1926–2016)، جو تہران میں پیدا ہوئے اور لاس اینجلس میں وفات پائے، جنہوں نے گیس لیزر کا اصول سب سے پہلے پیش کیا اور 1960 میں بیل لیبارٹریز میں اس کا پہلا عملی نمونہ (ہیلیم۔نیون لیزر) مشترکہ طور پر بنایا، جو پہلا مسلسل چلنے والا لیزر تھا، اور ایم آئی ٹی میں طبیعیات کے پروفیسر رہے۔"
