summary:
  ar: "سياسي مصري، رئيس وزراء مصر أربع مرات بين 1914 و1919 في عهود عباس حلمي الثاني وحسين كامل وفؤاد الأول، وكان قبلها وزيرًا للعدل والخارجية، وترأس لجنة دستور 1922 ورأس مجلس الشيوخ من 1926 حتى وفاته سنة 1928."
  en: "Egyptian politician who was prime minister of Egypt four times between 1914 and 1919, under Abbas Hilmi II, Hussein Kamel and Fuad I. He had earlier been minister of justice and of foreign affairs, chaired the committee that drafted the 1922 constitution, and presided over the Senate from 1926 until his death in 1928."
  ur: "مصری سیاست دان، جو 1914 اور 1919 کے درمیان عباس حلمی ثانی، حسین کامل اور فؤاد اول کے عہد میں چار مرتبہ مصر کے وزیرِ اعظم رہے۔ اس سے پہلے وہ وزیرِ انصاف اور وزیرِ خارجہ رہے، 1922 کے آئین کی مسودہ کمیٹی کی صدارت کی، اور 1926 سے 1928 میں اپنی وفات تک سینیٹ کے صدر رہے۔"
