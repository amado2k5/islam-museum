summary:
  ar: "بقية شيوخ العراق، الفقير الصوفي الحنبلي؛ سمع الحديث بدمشق من الضياء المقدسي وسليمان الأسعردي، وتفقه ببغداد على القاضي أبي صالح وبحَرّان على مجد الدين بن تيمية وابن تميم وبدمشق على شمس الدين بن أبي عمر وبمصر على ابن حمدان، وشرح كتاب الخرقي وسماها «المهم»، وله «العدة للشدة» في أصول الدين ومصنف في السماع؛ كان قدوة زاهداً عابداً ذا أحوال وكرامات {cite:shadharat-dhahab p. 641-642}."
  en: "'Last of Iraq's shaykhs' — the Sufi Hanbali whose teachers ran Majd al-Din Ibn Taymiyya at Harran, Ibn Abi Umar at Damascus; his sharh of al-Khiraqi called al-Muhimm, and a book on sama' {cite:shadharat-dhahab p. 641-642}."
