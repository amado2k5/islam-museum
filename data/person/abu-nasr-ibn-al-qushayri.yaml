summary:
  ar: "واعظ أشعري، ورد بغداد سنة 469هـ وجلس في النظامية يذم الحنابلة وينسبهم إلى التجسيم، فوقعت بسببه الفتنة بين الحنابلة والأشعرية حتى قتل خياط واستدعى الوزير الشريف أبا جعفر للمصالحة، فقال له الشريف «لو جاز أن يُشكر أحد على بدعته لكان هذا الشاب لأنه باهتنا بما في نفسه ولم ينافقنا» {cite:muntazam-ibn-al-jawzi j.8 p.305-307}."
  en: "An Ash'ari preacher; he came to Baghdad in 469 AH and sat at the Nizamiyya denouncing the Hanbalis and attributing anthropomorphism (tajsim) to them. Strife broke out between the Hanbalis and the Ash'aris because of him, to the point that a tailor was killed. The vizier summoned Sharif Abu Ja'far to bring about reconciliation, and the sharif said to him: 'If anyone deserved thanks for his innovation, it would be this young man, for he declared to our faces what was in his heart and did not flatter us' {cite:muntazam-ibn-al-jawzi j.8 p.305-307}."
