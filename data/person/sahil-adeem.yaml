summary:
  ar: "معلق باكستاني في شؤون الشباب والدين ومتحدث في علم النفس السلوكي، يقدّم نفسه عالم نفس تخرج في جامعة رايرسون بتورونتو ويقود شركة Source Code وأكاديميتها لتدريب الشباب المسلم على التفكير النقدي والذكاء العاطفي. بلغت قناته على يوتيوب نحو 164 ألف مشترك في نوفمبر 2026، غير أن مقاطعها الأعلى مشاهدة تعود إلى 2021–2022 ونشاطها الحديث متقطع. أثار تصريحه التلفزيوني سنة 2024 بأن 95 من كل 100 امرأة جاهلات جدلا واسعا."
  en: "A Pakistani youth and religious commentator and behavioural-psychology speaker. He presents himself as a psychologist who graduated from Ryerson University in Toronto, and leads Source Code and its academia, training young Muslims in critical thinking and emotional intelligence. His YouTube channel counted some 164,000 subscribers in November 2026, though its most-viewed videos date from 2021–2022 and recent uploads are sparse. His 2024 television statement that 95 out of 100 women are ignorant drew wide controversy."
  ur: "پاکستانی نوجوانوں اور دینی امور کے مبصر اور رویّاتی نفسیات کے مقرر۔ وہ خود کو ٹورنٹو کی رائرسن یونیورسٹی سے فارغ التحصیل ماہرِ نفسیات کے طور پر پیش کرتے ہیں اور Source Code اور اس کی اکیڈمی چلاتے ہیں جو نوجوان مسلمانوں کو تنقیدی سوچ اور جذباتی ذہانت کی تربیت دیتی ہے۔ نومبر 2026 میں ان کے یوٹیوب چینل کے تقریباً 164 ہزار سبسکرائبر تھے، تاہم اس کی مقبول ترین ویڈیوز 2021–2022 کی ہیں اور حالیہ اپلوڈز کم ہیں۔ 2024 میں ان کے ٹیلی ویژن بیان کہ 100 میں سے 95 خواتین جاہل ہیں، نے وسیع تنازع کھڑا کیا۔"
