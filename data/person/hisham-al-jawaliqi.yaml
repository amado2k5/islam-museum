  ar: "أبو مالك الحضرمي ابن مملك الأصبهاني أبو عبد الله بن مملك الأصبهاني هشام الجواليقي من متكلمي الشيعة وله مع أبي علي الجبائي مجلس في الإمامة وتثبيتها بحضرة أبي محمد القاسم بن محمد الكرخي، وله كتاب الإمامة وكتاب نقض الإمامة على أبي علي ولم يتمه {cite:fihrist-ibn-al-nadim p. 252}."
