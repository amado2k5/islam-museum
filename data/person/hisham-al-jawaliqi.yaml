summary:
  ar: "أبو مالك الحضرمي ابن مملك الأصبهاني أبو عبد الله بن مملك الأصبهاني هشام الجواليقي من متكلمي الشيعة وله مع أبي علي الجبائي مجلس في الإمامة وتثبيتها بحضرة أبي محمد القاسم بن محمد الكرخي، وله كتاب الإمامة وكتاب نقض الإمامة على أبي علي ولم يتمه {cite:fihrist-ibn-al-nadim p. 252}."
  en: "Hisham al-Jawaliqi — debated Abu Ali al-Jubba'i on the imamate before al-Karkhi {cite:fihrist-ibn-al-nadim}"
  es: "Hisham al-Jawaliqi — debatió con Abu Ali al-Jubba'i sobre el imamato ante al-Karkhi {cita:fihrist-ibn-al-nadim}"
  fr: "Hisham al-Jawaliqi — a débattu d'Abu Ali al-Jubba'i sur l'imamat devant al-Karkhi {cite: fihrist-ibn-al-nadim}"
  ur: "ہشام الجوالیقی - ابو علی الجبعی سے امامت کے بارے میں الکرخی سے پہلے بحث کی تھی۔"
  tr: "Ebu Malik el-Hadrami ibn Memlak el-İsfahani Ebu Abdullah ibn Mamalik el-Esbahani Hişam el-Cevaliki, Şii teologlardan biriydi. Ebu Muhammed el-Kasım bin Muhammed el-Karkhi'nin huzurunda İmamat ve kuruluşu üzerine Ebu Ali el-Cubey ile bir konsey yaptı. İmamat kitabını ve tamamlanmamış olan 'Ebu Ali üzerine Neqşi el-İmamet' kitabını yazdı {atıf:fihrist-ibn-al-nadim s. 252}."
  id: "Abu Malik al-Hadrami ibn Mamlak al-Isfahani Abu Abdullah ibn Mamalik al-Asbahani Hisham al-Jawaliqi adalah salah satu teolog Syiah. Ia mengadakan dewan dengan Abu Ali al-Juba'i mengenai Imamate dan pembentukannya di hadapan Abu Muhammad al-Qasim ibn Muhammad al-Karkhi. Ia menulis kitab Imamate dan buku 'Naqsh al-Imamate tentang Abu Ali,' yang tidak selesai {cite:fihrist-ibn-al-nadim hlm. 252}."
