summary:
  ar: "لاعب كرة قدم مصري معتزل، وُلد في ناهيا بمحافظة الجيزة سنة 1978. لاعب وسط مهاجم ومهاجم ثانٍ بدأ مع الترسانة ثم انتقل إلى الأهلي سنة 2004 فصار من أبرز نجوم جيله الذهبي، وخاض مع منتخب مصر 100 مباراة دولية سجل فيها 38 هدفًا، وفاز معه بكأس الأمم الأفريقية 2006 و2008 وسجل هدف الفوز في نهائي 2008. درس الفلسفة في جامعة القاهرة، وعُرف خارج الملعب بأعماله الإنسانية والخيرية."
  en: "Egyptian retired professional footballer, born in Nahia, Giza in 1978. An attacking midfielder and second striker who came through Tersana before joining Al Ahly in 2004, where he became a central figure of the club's dominant side; he earned 100 caps and scored 38 goals for Egypt, winning the Africa Cup of Nations in 2006 and 2008 and scoring the winning goal in the 2008 final. A philosophy graduate of Cairo University, he is also noted for humanitarian work and philanthropy off the pitch."
  ur: "مصری ریٹائرڈ پیشہ ور فٹبالر، 1978 میں الجیزہ کے علاقے ناہیہ میں پیدا ہوئے۔ حملہ آور مڈفیلڈر اور دوسرے اسٹرائیکر جنہوں نے ترسانہ سے آغاز کیا اور 2004 میں ال اہلی میں شامل ہو کر اس کی غالب ٹیم کے مرکزی کھلاڑی بنے؛ مصر کے لیے 100 بین الاقوامی میچوں میں 38 گول کیے، 2006 اور 2008 کے افریقہ کپ آف نیشنز جیتے اور 2008 کے فائنل کا جیتنے والا گول انہی کا تھا۔ قاہرہ یونیورسٹی سے فلسفے کے فارغ التحصیل، وہ میدان سے باہر انسانی اور فلاحی کاموں کے لیے بھی جانے جاتے ہیں۔"
