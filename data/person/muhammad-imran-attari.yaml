  ar: "داعية باكستاني من كراتشي، وُلد سنة 1970، عمل في تجارة العائلة ثم أسس مشروعه الخاص في الملابس، وانضم إلى دعوة إسلامي سنة 1992 متطوعا حتى صار نكران مجلسها المركزي للشورى، وهو الهيئة التي تقود الحركة. بلغت قناته الرسمية على يوتيوب نحو 895 ألف مشترك في نوفمبر 2026."
  en: "Pakistani preacher from Karachi, born in 1970, who worked in his family business and then founded his own garment enterprise before joining Dawat-e-Islami as a volunteer in 1992; he is now Nigran (head) of its Markazi Majlis-e-Shura, the central council that leads the movement. His official YouTube channel counted some 895,000 subscribers in November 2026."
