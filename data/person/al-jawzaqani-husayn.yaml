summary:
  ar: "الحسين بن إبراهيم الجوزقاني الهمداني؛ كان حافظاً عالماً بما يحويه، ومن مصنفاته كتاب الموضوعات أجاد فيه — قاله ابن ناصر الدين {cite:shadharat-dhahab p. 616}."
  en: "Al-Husayn ibn Ibrahim al-Jawzaqani of Hamadan; a hafiz well-versed in his lore, among whose works is the Kitab al-Mawdu'at in which he excelled — per Ibn Nasir al-Din {cite:shadharat-dhahab p. 616}."
  es: "Al-Husayn ibn Ibrahim al-Jawzaqani de Hamadán; un hafiz versado en su saber, entre cuyas obras se encuentra el Kitab al-Mawdu'at en el que sobresalió — por Ibn Nasir al-Din {cite:shadharat-dhahab p. 616}."
  fr: "Al-Husayn ibn Ibrahim al-Jawzaqani de Hamadan; un hafiz versé dans son savoir, parmi les œuvres duquel se trouve le Kitab al-Mawdu'at dans lequel il a excellé — selon Ibn Nasir al-Din {cite:shadharat-dhahab p. 616}."
  ur: "الحسین بن ابراہیم الجوزقانی آف حمدان؛ ایک حافظ جو اپنے علوم سے خوب واقف ہے، جن کے کاموں میں کتاب المودات بھی ہے جس میں اس نے کمال حاصل کیا ہے - فی ابن ناصر الدین 616}۔"
  tr: "El-Hüseyin bin İbrahim el-Cevzqani el-Hemdani; o, içerdiklerinde ne olduğunu ezberleyen ve bilgili biriydi. Eserleri arasında, İbn Nasir al-Din tarafından söylendiği 'Mevdu' kitabı da vardır {atı:shadharat-dhahab s. 616}."
  id: "Al-Husayn ibn Ibrahim al-Jawzqani al-Hamdani; ia adalah seorang penghafal dan berpengetahuan dalam isi bukunya. Di antara karyanya adalah kitab Al-Mawdu', yang ia kuasai — yang disebutkan oleh Ibn Nasir al-Din {cite:shadharat-dhahab hlm. 616}."
