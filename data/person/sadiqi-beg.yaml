summary:
  ar: "رسام وشاعر وكاتب سير صفوي (نحو 1533–1610)، وُلد في تبريز من قبيلة خدابنده لو التركمانية، وأمضى سنوات درويشًا متجولًا قبل أن يستقر في قزوين ويخدم في بلاط الشاهات إسماعيل الثاني ومحمد خدابنده وعباس الأول، فصار أمين المكتبة الملكية حتى أُقيل سنة 1596 مع احتفاظه بلقبه وراتبه ومشورة الشاه له. خلّف «مجمع الخواص» سيرًا لثلاثمائة وثلاثين شاعرًا وفنانًا، و«قانون الصور» منظومة فارسية في تقنيات التصوير، ولوحات لشاهنامات ملكية محفوظة إلى اليوم."
  en: "Safavid painter, poet and biographer (c. 1533–1610), born in Tabriz into the Khodabandalu Turkoman tribe. Orphaned young, he spent years as a wandering dervish before settling in Qazvin and serving the courts of Isma'il II, Mohammad Khodabanda and Abbas I; he became head of the royal library, was dismissed in 1596 yet kept his title and salary and the shah's ear for the rest of his life. He left the Majma' al-khavass, biographies of some 330 poets and artists, the Qanun as-Suwar, a Persian verse treatise on painting technique, and paintings in royal Shahnamehs that still survive."
  ur: "صفوی مصور، شاعر اور تذکرہ نگار (تقریباً 1533ء–1610ء)، تبریز میں خدابندہ لو ترکمان قبیلے میں پیدا ہوئے۔ بچپن میں یتیم ہوئے تو برسوں درویش بن کر گھومتے رہے، پھر قزوین میں سکونت اختیار کر کے اسماعیل ثانی، محمد خدابندہ اور عباس اول کے درباروں سے وابستہ ہوئے؛ شاہی کتب خانے کے سربراہ بنے، 1596ء میں برطرف ہوئے مگر لقب و تنخواہ اور شاہ کی مشاورت عمر بھر برقرار رہی۔ ان کی یادگار ”مجمع الخواص“ ہے، جس میں قریب 330 شاعروں اور فنکاروں کے حالات ہیں، اور ”قانون الصور“ فارسی نظم میں مصوری کی تکنیک پر رسالہ ہے۔"

