  ar: "ولاه معاوية البصرة ثم الكوفة في أعوام خمس وأربعين وخمسين، وكان المغيرة بن شعبة قد توفي في سنة خمسين فولي زياد الكوفة {cite:tabari-tarikh-abu-al-fadl j.5 p.630}. وهو عند ابن النديم الذي بعث إلى أبي الأسود الدؤلي اعمل شيئا يكون للناس إماما وتعرب به كتاب الله فوضع باب الفاعل والمفعول به {cite:fihrist-ibn-al-nadim p. 104-105}"
