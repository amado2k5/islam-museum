id: person/ziyad-ibn-abi-sufyan
class: person
label: { ar: "زياد بن أبي سفيان" }
summary:
  ar: "ولاه معاوية البصرة ثم الكوفة في أعوام خمس وأربعين وخمسين، وكان المغيرة بن شعبة قد توفي في سنة خمسين فولي زياد الكوفة {cite:tabari-tarikh-abu-al-fadl j.5 p.630}. وهو عند ابن النديم الذي بعث إلى أبي الأسود الدؤلي اعمل شيئا يكون للناس إماما وتعرب به كتاب الله فوضع باب الفاعل والمفعول به {cite:fihrist-ibn-al-nadim p. 104-105}"
  tr: "Muaviye onu 1945 ve 1950 yıllarında önce Basra'ya, ardından Kufe'ye atadı. Al-Mughira ibn Shu'bah 50 Hicri yılında vefat etmişti ve Ziyad Kufe valisi olarak atandı {cite:tabari-tarikh-abu-al-fadl j.5 s.630}. O, İbn al-Nadim ile birlikteydi; Ebu el-Asvad el-Du'ali'yi insanları imam yapacak bir şey yapması ve bunu Allah'ın Kitabı'nı çevirmek için kullanması için gönderdi; böylece bölümü konuya ve amaca yerleştirdi {cite:fihrist-ibn-al-nadim s. 104-105}"
  id: "Muawiya mengangkatnya sebagai pemimpin Basra, lalu Kufa pada tahun 1945 dan 1950. Al-Mughira ibn Shu'bah meninggal pada tahun 50 H, dan Ziyad diangkat sebagai gubernur Kufa {cite:tabari-tarikh-abu-al-fadl j.5 hlm.630}. Ia bersama Ibn al-Nadim, yang mengirim kepada Abu al-Aswad al-Du'ali untuk melakukan sesuatu yang dapat menjadikan orang sebagai imam dan menggunakannya untuk menerjemahkan Kitab Allah, sehingga menempatkan bab tersebut pada subjek dan tujuan {cite:fihrist-ibn-al-nadim hlm. 104-105}"
