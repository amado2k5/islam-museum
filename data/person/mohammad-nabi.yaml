summary:
  ar: "لاعب كريكت أفغاني وقائد سابق لمنتخب أفغانستان، وُلد في لوكر سنة 1985. لاعب شامل يضرب باليمنى ويرمي دورانا خارجيا، لعب دورا محوريا في صعود أفغانستان إلى أعلى مستويات الكريكت الدولية، فشارك في أول مباراة ليوم واحد لها سنة 2009 وفي أول مباراة اختبار سنة 2018، وقاد الفريق في كأس آسيا 2014 وكأس العالم 2015، وكان أول لاعب أفغاني يُشترى في مزاد الدوري الهندي الممتاز سنة 2017، وأول رامٍ أفغاني يبلغ 100 ويكيت في مباريات اليوم الواحد سنة 2018، ولعب في دوريات عشرينيات حول العالم، واعتزل كريكت الاختبار سنة 2019 ليركّز على مباريات الكرة البيضاء، وكان عضوا في فريق أفغانستان الذي هزم 45 منتخبا في الكريكت الدولية."
  en: "Afghan cricketer and former captain of the Afghanistan national team, born in Logar in 1985. An all-rounder who bats right-handed and bowls off spin, he played a major role in Afghanistan's rise to the top level of international cricket, playing in their first One Day International in 2009 and their first Test match in 2018, captained the team at the 2014 Asia Cup and the 2015 Cricket World Cup, was the first Afghan player bought in the Indian Premier League auction in 2017, became the first Afghan bowler to take 100 ODI wickets in 2018, has played in Twenty20 franchise leagues worldwide, retired from Test cricket in 2019 to focus on white-ball cricket, and was part of the Afghanistan side that has defeated 45 nations in international cricket."
  ur: "افغان کرکٹ کھلاڑی اور افغانستان کی قومی ٹیم کے سابق کپتان، جو 1985 میں لوگر میں پیدا ہوئے۔ دائیں ہاتھ سے بلے بازی اور آف اسپن گیند بازی کرنے والے آل راؤنڈر کی حیثیت سے انھوں نے افغانستان کے بین الاقوامی کرکٹ کی اعلیٰ سطح تک پہنچنے میں مرکزی کردار ادا کیا، 2009 میں اس کے پہلے ایک روزہ میچ اور 2018 میں اس کے پہلے ٹیسٹ میچ میں کھیلے، 2014 ایشیا کپ اور 2015 کرکٹ ورلڈ کپ میں ٹیم کی کپتانی کی، 2017 میں انڈین پریمیئر لیگ کی نیلامی میں خریدے جانے والے پہلے افغان کھلاڑی بنے، 2018 میں ایک روزہ کرکٹ میں 100 وکٹیں مکمل کرنے والے پہلے افغان گیند باز بنے، دنیا بھر کی ٹی ٹوئنٹی فرنچائز لیگز میں کھیلے، 2019 میں وائٹ بال کرکٹ پر توجہ کے لیے ٹیسٹ کرکٹ سے ریٹائر ہوئے، اور اس افغان ٹیم کا حصہ رہے جس نے بین الاقوامی کرکٹ میں 45 ممالک کو شکست دی۔"
