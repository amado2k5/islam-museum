summary:
  ar: "لاعب كريكت أفغاني وقائد سابق لمنتخب أفغانستان، وُلد في لوكر سنة 1985. لاعب شامل يضرب باليمنى ويرمي دورانا خارجيا، لعب دورا محوريا في صعود أفغانستان إلى أعلى مستويات الكريكت الدولية، فشارك في أول مباراة ليوم واحد لها سنة 2009 وفي أول مباراة اختبار سنة 2018، وقاد الفريق في كأس آسيا 2014 وكأس العالم 2015، وكان أول لاعب أفغاني يُشترى في مزاد الدوري الهندي الممتاز سنة 2017، وأول رامٍ أفغاني يبلغ 100 ويكيت في مباريات اليوم الواحد سنة 2018، ولعب في دوريات عشرينيات حول العالم، واعتزل كريكت الاختبار سنة 2019 ليركّز على مباريات الكرة البيضاء، وكان عضوا في فريق أفغانستان الذي هزم 45 منتخبا في الكريكت الدولية."
  en: "Afghan cricketer and former captain of the Afghanistan national team, born in Logar in 1985. An all-rounder who bats right-handed and bowls off spin, he played a major role in Afghanistan's rise to the top level of international cricket, playing in their first One Day International in 2009 and their first Test match in 2018, captained the team at the 2014 Asia Cup and the 2015 Cricket World Cup, was the first Afghan player bought in the Indian Premier League auction in 2017, became the first Afghan bowler to take 100 ODI wickets in 2018, has played in Twenty20 franchise leagues worldwide, retired from Test cricket in 2019 to focus on white-ball cricket, and was part of the Afghanistan side that has defeated 45 nations in international cricket."
  ur: "افغان کرکٹ کھلاڑی اور افغانستان کی قومی ٹیم کے سابق کپتان، جو 1985 میں لوگر میں پیدا ہوئے۔ دائیں ہاتھ سے بلے بازی اور آف اسپن گیند بازی کرنے والے آل راؤنڈر کی حیثیت سے انھوں نے افغانستان کے بین الاقوامی کرکٹ کی اعلیٰ سطح تک پہنچنے میں مرکزی کردار ادا کیا، 2009 میں اس کے پہلے ایک روزہ میچ اور 2018 میں اس کے پہلے ٹیسٹ میچ میں کھیلے، 2014 ایشیا کپ اور 2015 کرکٹ ورلڈ کپ میں ٹیم کی کپتانی کی، 2017 میں انڈین پریمیئر لیگ کی نیلامی میں خریدے جانے والے پہلے افغان کھلاڑی بنے، 2018 میں ایک روزہ کرکٹ میں 100 وکٹیں مکمل کرنے والے پہلے افغان گیند باز بنے، دنیا بھر کی ٹی ٹوئنٹی فرنچائز لیگز میں کھیلے، 2019 میں وائٹ بال کرکٹ پر توجہ کے لیے ٹیسٹ کرکٹ سے ریٹائر ہوئے، اور اس افغان ٹیم کا حصہ رہے جس نے بین الاقوامی کرکٹ میں 45 ممالک کو شکست دی۔"
  es: "Jugador de críquet afgano y excapitán de la selección nacional de Afganistán, nacido en Logar en 1985. Un todoterreno que batea con la mano derecha y lanza con efecto, desempeñó un papel fundamental en el ascenso de Afganistán al máximo nivel del críquet internacional, jugando en su primer One Day International en 2009 y su primer partido de prueba en 2018, capitaneó al equipo en la Copa Asia de 2014 y la Copa Mundial de Críquet de 2015, fue el primer jugador afgano comprado en la subasta de la Indian Premier League en 2017, se convirtió en el primer lanzador afgano en tomar 100 wickets ODI en 2018, ha jugado en ligas de franquicias Twenty20 en todo el mundo, se retiró del críquet de prueba en 2019 para centrarse en el críquet de bola blanca, y formó parte del equipo de Afganistán que ha derrotado a 45 naciones en el críquet internacional."
  fr: "Joueur de cricket afghan et ancien capitaine de l'équipe nationale d'Afghanistan, né à Logar en 1985. Joueur polyvalent, droitier à la batte et lanceur de spin, il a joué un rôle majeur dans l'ascension de l'Afghanistan au plus haut niveau du cricket international, participant à leur premier match international d'un jour en 2009 et à leur premier match test en 2018, a été capitaine de l'équipe lors de la Coupe d'Asie 2014 et de la Coupe du monde de cricket 2015, a été le premier joueur afghan acheté lors de la vente aux enchères de l'Indian Premier League en 2017, est devenu le premier lanceur afghan à prendre 100 guichets en ODI en 2018, a joué dans des ligues de franchise Twenty20 à travers le monde, a pris sa retraite du cricket test en 2019 pour se concentrer sur le cricket à balle blanche, et a fait partie de l'équipe d'Afghanistan qui a vaincu 45 nations en cricket international."
  tr: "Afgan kriketçisi ve Afganistan milli takımının eski kaptanı, 1985'te Locker'da doğdu. Çok yönlü bir sağ kol vurucu ve dış spin atıcısı olan Sher, Afganistan'ın uluslararası kriketin en üst seviyelerine yükselişinde önemli bir rol oynadı; 2009'da ilk tek günlük maçına ve 2018'de ilk Test maçına katıldı. 2014 Asya Kupası ve 2015 Dünya Kupası'nda takımı yönetti, 2017'de Hindistan Premier Ligi açık artırmasında satın alınan ilk Afgan oyuncu oldu, 2018'de tek günlük maçlarda 100 wicket alan ilk Afgan Ram oldu, dünya genelindeki liglerde oynadı, 2019'da Test kriketinden emekli olup beyaz top maçlarına odaklandı ve uluslararası krikette 45 takımı yenen Afganistan takımının bir üyesiydi."
  id: "Seorang pemain kriket Afghanistan dan mantan kapten tim nasional Afghanistan, lahir di Locker pada tahun 1985. Sebagai pemukul tangan kanan yang serba bisa dan spinner luar, ia memainkan peran penting dalam kebangkitan Afghanistan ke level tertinggi kriket internasional, berpartisipasi dalam pertandingan satu hari pertamanya pada 2009 dan pertandingan Test pertamanya pada 2018. Ia memimpin tim di Piala Asia 2014 dan Piala Dunia 2015, menjadi pemain Afghanistan pertama yang dibeli dalam lelang Indian Premier League pada 2017, Afghan Ram pertama yang mengambil 100 wicket dalam pertandingan satu hari pada 2018, bermain di liga-liga di seluruh dunia, pensiun dari kriket Test pada 2019 untuk fokus pada pertandingan bola putih, dan menjadi anggota tim Afghanistan yang mengalahkan 45 tim di kriket internasional."
