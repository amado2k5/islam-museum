id: person/musa-ibn-nusayr
class: person
label: { ar: "موسى بن نصير" }
summary:
  ar: "ذكر الطبري أن موسى بن نصير غزا الأندلس في سنة إحدى وتسعين ففُتح على يديه مدائن وحصون {cite:tabari-tarikh-abu-al-fadl j.6 p.454}، وأنه غضب على طارق بن زياد وشخص إليه في سنة ثلاث وتسعين {cite:tabari-tarikh-abu-al-fadl j.6 p.481}. وعند البلاذري: مولى بني أمية وأصله من عين التمر ويُقال من عراشة من بليّ ويُقال من لخم؛ ولّى إفريقية من قبل عبد العزيز بن مروان — ويُقال في زمن الوليد سنة تسع وثمانين — ففتح طنجة ونزلها وهو أول من نزلها واختطّ فيها للمسلمين وانتهت خيله إلى السوس الأدنى فوطن أهله وسبى منهم."
