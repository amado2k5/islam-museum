id: person/musa-ibn-nusayr
class: person
label: { ar: "موسى بن نصير" }
summary:
  ar: "ذكر الطبري أن موسى بن نصير غزا الأندلس في سنة إحدى وتسعين ففُتح على يديه مدائن وحصون {cite:tabari-tarikh-abu-al-fadl j.6 p.454}، وأنه غضب على طارق بن زياد وشخص إليه في سنة ثلاث وتسعين {cite:tabari-tarikh-abu-al-fadl j.6 p.481}. وعند البلاذري: مولى بني أمية وأصله من عين التمر ويُقال من عراشة من بليّ ويُقال من لخم؛ ولّى إفريقية من قبل عبد العزيز بن مروان — ويُقال في زمن الوليد سنة تسع وثمانين — ففتح طنجة ونزلها وهو أول من نزلها واختطّ فيها للمسلمين وانتهت خيله إلى السوس الأدنى فوطن أهله وسبى منهم. وعند المقري وجهز مولاه طارق بن زياد إلى الأندلس في سبعة آلاف جلّهم من البربر في أربع سفن فحط بجبل طارق في شعبان سنة 92هـ ثم جهز له خمسة آلاف حين كاتبه أن لذريق قد زحف إليه {cite:nafh-tib-maqqari p. 268} وروى الحميدي أنه ولي إفريقية والمغرب سنة سبع وسبعين وقدمها فبلغه أن بأطراف البلاد من هو خارج عن الطاعة فبعث ولديه عبد الله ومروان فجاء كل منهما بمائة ألف رأس من السبايا، وكانت البلاد في قحط شديد فأمر الناس بالصوم والصلاة وخرج بهم إلى الصحراء وفرق بين الحيوانات وأولادها حتى وقع البكاء والضجيج ثم صلى وخطب ولم يذكر الوليد فقيل له ألا تدعو لأمير المؤمنين فقال هذا مقام لا يدعى فيه لغير الله، ثم تتبع البربر حتى انتهى إلى السوس الأدنى لا يدافعه أحد {cite:nafh-tib-maqqari p. 275}. وقال الحجاري إنه مراجعة يزيد بن المهلب حين ألقى بنفسه عليه يستعطفه فعاتبه على تسليم نفسه لسليمان بن عبد الملك بعد ما ملك الأندلس، ومات بوادي القرى بعد أن خضع لمولى أراد تسليمه فقال له المولى قد أسلمك خالقك فما سفرت تلك الليلة إلا عن قبض روحه، ويكفي من بلاغته كتابه إلى الوليد بن عبد الملك إنها ليست الفتوح ولكنها الحشر {cite:nafh-tib-maqqari p. 319-321}. ذكر الكتاب أنه ولي إفريقية بعد عزل حسان في نحو سنة 85هـ أو 86هـ، وأنه قاد الفتح بسياسة التعاون مع البربر وإقرار زعمائهم وإشراكهم في الجيش، وأنه ساوى بين البربر والعرب في الأعطيات والنفل، وأسكن البيزنطيين قرب مراكز الحكم الإسلامي، وأمر العرب بتعليم البربر القرآن والفقه. ويذكر الكتاب أنه استشار الوليد بن عبد الملك قبل إرسال حملة طريف. {cite:salabi-umayyad-state-2020 p.63-67} ويذكر الكتاب أن موسى خرج من القيروان سنة 93هـ، وفتح قرمونة وإشبيلية وماردة، ولقي طارقاً بطليطلة، ثم سار إلى جليقية والأشتوريس بمعونة مغيث الرومي، ثم استدعاه الوليد إلى دمشق، وأن سليمان عزله وحبسه وأغرمه أموالاً بعد وفاة الوليد ثم رضي عنه وقرّبه، ويرى الكتاب أن روايات الخلاف بينه وبين طارق ضعيفة. {cite:salabi-umayyad-state-2020 p.75-79} ويذكر الكتاب أن موسى توفي سنة 97هـ وهو متوجه إلى الحج مع سليمان، وصلى عليه مسلمة بن عبد الملك، وأنه أدرك نحو ثمان وسبعين سنة. {cite:salabi-umayyad-state-2020 p.81}"
  tr: "El-Taberi, Musa bin Nüseyr'in doksan birinci yılda Endülüs'e saldırdığını, komutası altındaki şehirleri ve kaleleri fethettiğini belirtmiştir {alıntı:Tabari-tarikh-abu-al-Fadl j.6 s.454} ve doksan üçüncü yılda Tariq ibn Ziyad'a kızdığını ve onu ihanete uğrattığını {atıf:tabari-tarikh-abu-al-fadl j.6 s.481}. al-Baladhuri'ye göre: Banu Umayya'nın özgür bir adamıydı, aslen Ain al-Tamr'dan, Bali'den Arasha'dan olduğu söylenir, ayrıca Lakhm'dan olduğu söylenir; Abd al-Aziz ibn Marwan tarafından İfriqiyye valisi olarak atanmıştır — ve söylenene göre seksen dokuzuncu yılda el-Velid döneminde — böylece Tangier'i fethetti ve oraya yerleşti, oraya yerleşen ilk kişi oldu ve Müslümanlar için yazma yaptı. Atları alt Souss'a ulaştı, burada halkını yerleştirdi ve esir alındı. El-Maqri'de, özgür bırakılmış kölesi Tarık bin Ziyad, Endülüs için yedi bin Berberi, çoğunluğu dört gemiyle hazırladı ve 92 Hicri yılında Cebelitarık'a, Şaban'a çıktı. Daha sonra ona Dhariq'in kendisine doğru yürüdüğünü yazdığında beş bin hazırladı {atıf:nafh-tib-maqqari s. 268}. El-Humadi, yetmiş yedinci hicri yılında İfrikiye ve Mağrip valisi olarak atandığını ve oraya geldiğini anlattı. Toprakların dışında itaatsiz insanlar olduğu bildirildi, bu yüzden oğulları Abdullah ve Mervan'ı gönderdi, her biri yüz bin esir getirdi ve toprak Şiddetli bir kuraklık sırasında halka oruç tutup dua etmelerini emretti, onları çöle götürdü, hayvanları ve yavrularını ayırdı, ağlama ve gürültü çıkana kadar. Sonra dua etti ve Velid'den bahsetmeden vaaz verdi. Kendisine Müminler Komutanı için dua etmemesi söylendi ve dedi ki, 'Burası Tanrı'dan başka kimsenin çağrıldığı bir yerdir.' Sonra Berberileri takip etti ve en alçak duvara ulaştı, orada kimse onu savunamadı. {atı:nafh-tib-maqqari, s. 275}. Al-Hajari, Yazid bin el-Muhallab'ı ziyaret ettiğinde, onun merhametini almak için ona atladığını ve Endülüs'ü yönettikten sonra Süleyman bin Abdülmelik'e teslim olmasından dolayı onu azarladığını söyledi. Bir ustaya teslim olmak isteyen bir efendiye teslim olduktan sonra Vadi el-Kura'da öldü. Efendi dedi ki, 'Yaratıcın seni teslim etti.' O gece sadece ruhunun alınmasıyla sonuçlandı. Vid bin Abdülmelik'e yazdığı mektuptaki etkileyici sözlülüğü, bunun fetih değil, diriliş olduğunu söylemek için yeterlidir {alıntı: Nafh-tib-maqqari, s. 319-321}. Kitapta, Hasan yaklaşık 85 Hicri veya 86 Hicri yıllarında tahttan indirildikten sonra İfrikiye'yi yönettiğini, fetihleri Berberilerle işbirliği politikasıyla yönettiğini, liderlerini onayladığını ve orduya dahil ettiğini belirtir. Berberileri hediyeler ve gönüllü bağışlarla eşitledi, Bizanslıları İslami yönetim merkezlerine yerleştirdi ve Araplara Berberilere Kur'an ve fıkıh öğretmelerini emretti. Kitapta, Tarif seferini göndermeden önce el-Velid bin Abdülmelik ile danıştığı belirtilir. {kaynak:Salabi-Umayyad-State-2020 s.. 63-67} Kitap, Musa'nın 93 Hicri yılında Kairuan'dan ayrıldığını, Karmona, Sevilla ve Marda'yı fethettiğini, Toledo'da Tariq ile karşılaştığını, ardından Roma valisinin yardımıyla Galiçya ve Asturius'a yürüdüğünü, ardından El-Velid'in onu Şam'a çağırdığını, Süleyman'ın onu tahttan indirdiğini, hapse attığını ve para cezası verdiğini, ardından kabul edip yanına yaklaştığını belirtir. Kitap, kendisi ile Tarık arasındaki anlaşmazlıkların zayıf olduğunu kabul eder. {kaynak:Selabi-Umayyad-devlet-2020 s.75-79} Kitap, Musa'nın 97 Hicri yılında, Süleymanla Hac yolunda öldüğünü, Maslamah ibn Abd al-Malik'in onun üzerine namaz kıldığını ve yaklaşık yetmiş sekiz yaşında yaşadığını belirtir. {alıntı:Selabi-Umayyad-devlet-2020 s.81}"
  id: "Al-Tabari menyebutkan bahwa Musa ibn Nusayr menyerbu al-Andalus pada tahun sembilan puluh satu, menaklukkan kota-kota dan benteng di bawah komandonya {cite:tabari-tarikh-abu-al-fadl j.6 hlm.454}, dan bahwa ia marah kepada Tariq ibn Ziyad serta mengkhianatinya pada tahun sembilan puluh tiga {cite:tabari-tarikh-abu-al-fadl j.6 hlm.481}. Menurut al-Baladhuri: Ia adalah mantan Banu Umayyah, berasal dari Ain al-Tamr, dan dikatakan berasal dari 'Arasha dari Bali, dan juga dikatakan berasal dari Lakhm; ia diangkat sebagai gubernur Ifriqiya oleh Abd al-Aziz ibn Marwan — dan dikatakan pada masa pemerintahan al-Walid tahun delapan puluh sembilan — sehingga ia menaklukkan Tangier dan menetap di sana, menjadi yang pertama menetap di sana dan mendaftar untuk kaum Muslim. Kuda-kudanya sampai di Souss bawah, di mana ia menempatkan rakyatnya dan ditawan. Di Al-Maqri, budaknya yang telah dibebaskan, Tariq ibn Ziyad, menyiapkan tujuh ribu orang Berber untuk al-Andalus, sebagian besar dalam empat kapal, dan mendarat di Gibraltar di Sha'ban pada tahun 92 H. Ia kemudian menyiapkan lima ribu orang ketika menulis kepadanya bahwa Dhariq telah berjalan menuju dirinya {cite:nafh-tib-maqqari hlm. 268} Al-Humaydi menceritakan bahwa ia diangkat menjadi gubernur Ifriqiya dan Maghreb pada tahun tujuh puluh tujuh H, dan ia tiba di sana. Ia diberitahu bahwa ada orang-orang yang tidak patuh di pinggiran tanah itu, sehingga ia mengirim putra-putranya Abdullah dan Marwan, masing-masing membawa seratus ribu tawanan, dan tanah itu pun Selama kekeringan parah, ia memerintahkan orang-orang untuk berpuasa dan berdoa, lalu membawa mereka ke padang gurun, memisahkan hewan dan anak-anaknya hingga tangisan dan keributan terdengar. Kemudian ia berdoa dan memberikan khotbah tanpa menyebut Walid. Ia diperintahkan untuk tidak berdoa untuk Panglima Orang Beriman, dan ia berkata, 'Ini adalah tempat di mana tidak ada yang dipanggil kecuali Tuhan.' Kemudian ia mengikuti orang Berber hingga mencapai tembok paling bawah, di mana tidak ada yang bisa membelanya {cite:nafh-tib-maqqari, hlm. 275}. Al-Hajari mengatakan ia mengunjungi Yazid ibn al-Muhallab ketika ia menyerahkan diri kepadanya untuk meminta simpati, dan ia menegur Yazid karena menyerah kepada Sulayman ibn Abd al-Malik setelah ia memerintah al-Andalus. Ia meninggal di Wadi al-Qura setelah tunduk kepada seorang guru yang ingin menyerahkannya. Sang guru berkata, 'Penciptamu telah menyerahkanmu.' Malam itu hanya berujung pada jiwanya diambil. Kefasihannya dalam suratnya kepada al-Walid ibn Abd al-Malik cukup untuk mengatakan bahwa itu bukan penaklukan melainkan kebangkitan {cite:Nafh-Tib-Maqqari, hlm. 319-321}. Buku tersebut menyebutkan bahwa ia memerintah Ifriqiya setelah Hassan digulingkan sekitar tahun 85 H atau 86 H, bahwa ia memimpin penaklukan dengan kebijakan kerja sama dengan Berber, menyetujui pemimpin mereka, dan melibatkan mereka dalam tentara. Ia menyamakan Berber dengan hadiah dan sumbangan sukarela, menempatkan Bizantium di dekat pusat pemerintahan Islam, dan memerintahkan orang Arab untuk mengajarkan Al-Qur'an dan fiqhdemen kepada Berber. Buku tersebut menyebutkan bahwa ia berkonsultasi dengan al-Walid ibn Abd al-Malik sebelum mengirim kampanye Tarif. {cite:salabi-umayyad-state-2020 hlm. 63-67} Buku tersebut menyebutkan bahwa Musa meninggalkan Kairouan pada tahun 93 H, menaklukkan Qarmona, Seville, dan Marda, bertemu Tariq di Toledo, lalu berbaris ke Galicia dan Asturius dengan bantuan gubernur Romawi, kemudian Al-Walid memanggilnya ke Damaskus, dan bahwa Salomo menggulingkannya, memenjarakannya, dan mendendanya uang setelah kematian Al-Walid, lalu menerima dan mendekatinya. Buku ini menganggap catatan perselisihan antara dia dan Tariq lemah. {cite:salabi-umayyad-state-2020 hlm.75-79} Buku ini menyebutkan bahwa Musa meninggal pada tahun 97 H saat dalam perjalanan ke Haji bersama Suleiman, dan bahwa Maslamah ibn Abd al-Malik memimpin shalat untuknya, dan bahwa dia hidup sekitar tujuh puluh delapan tahun. {cite:salabi-umayyad-state-2020 hlm.81}"
