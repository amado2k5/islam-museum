id: person/musa-ibn-nusayr
class: person
label: { ar: "موسى بن نصير" }
summary:
  ar: "ذكر الطبري أن موسى بن نصير غزا الأندلس في سنة إحدى وتسعين ففُتح على يديه مدائن وحصون {cite:tabari-tarikh-abu-al-fadl j.6 p.454}، وأنه غضب على طارق بن زياد وشخص إليه في سنة ثلاث وتسعين {cite:tabari-tarikh-abu-al-fadl j.6 p.481}. وعند البلاذري: مولى بني أمية وأصله من عين التمر ويُقال من عراشة من بليّ ويُقال من لخم؛ ولّى إفريقية من قبل عبد العزيز بن مروان — ويُقال في زمن الوليد سنة تسع وثمانين — ففتح طنجة ونزلها وهو أول من نزلها واختطّ فيها للمسلمين وانتهت خيله إلى السوس الأدنى فوطن أهله وسبى منهم. وعند المقري وجهز مولاه طارق بن زياد إلى الأندلس في سبعة آلاف جلّهم من البربر في أربع سفن فحط بجبل طارق في شعبان سنة 92هـ ثم جهز له خمسة آلاف حين كاتبه أن لذريق قد زحف إليه {cite:nafh-tib-maqqari p. 268} وروى الحميدي أنه ولي إفريقية والمغرب سنة سبع وسبعين وقدمها فبلغه أن بأطراف البلاد من هو خارج عن الطاعة فبعث ولديه عبد الله ومروان فجاء كل منهما بمائة ألف رأس من السبايا، وكانت البلاد في قحط شديد فأمر الناس بالصوم والصلاة وخرج بهم إلى الصحراء وفرق بين الحيوانات وأولادها حتى وقع البكاء والضجيج ثم صلى وخطب ولم يذكر الوليد فقيل له ألا تدعو لأمير المؤمنين فقال هذا مقام لا يدعى فيه لغير الله، ثم تتبع البربر حتى انتهى إلى السوس الأدنى لا يدافعه أحد {cite:nafh-tib-maqqari p. 275}. وقال الحجاري إنه مراجعة يزيد بن المهلب حين ألقى بنفسه عليه يستعطفه فعاتبه على تسليم نفسه لسليمان بن عبد الملك بعد ما ملك الأندلس، ومات بوادي القرى بعد أن خضع لمولى أراد تسليمه فقال له المولى قد أسلمك خالقك فما سفرت تلك الليلة إلا عن قبض روحه، ويكفي من بلاغته كتابه إلى الوليد بن عبد الملك إنها ليست الفتوح ولكنها الحشر {cite:nafh-tib-maqqari p. 319-321}. ذكر الكتاب أنه ولي إفريقية بعد عزل حسان في نحو سنة 85هـ أو 86هـ، وأنه قاد الفتح بسياسة التعاون مع البربر وإقرار زعمائهم وإشراكهم في الجيش، وأنه ساوى بين البربر والعرب في الأعطيات والنفل، وأسكن البيزنطيين قرب مراكز الحكم الإسلامي، وأمر العرب بتعليم البربر القرآن والفقه. ويذكر الكتاب أنه استشار الوليد بن عبد الملك قبل إرسال حملة طريف. {cite:salabi-umayyad-state-2020 p.63-67} ويذكر الكتاب أن موسى خرج من القيروان سنة 93هـ، وفتح قرمونة وإشبيلية وماردة، ولقي طارقاً بطليطلة، ثم سار إلى جليقية والأشتوريس بمعونة مغيث الرومي، ثم استدعاه الوليد إلى دمشق، وأن سليمان عزله وحبسه وأغرمه أموالاً بعد وفاة الوليد ثم رضي عنه وقرّبه، ويرى الكتاب أن روايات الخلاف بينه وبين طارق ضعيفة. {cite:salabi-umayyad-state-2020 p.75-79} ويذكر الكتاب أن موسى توفي سنة 97هـ وهو متوجه إلى الحج مع سليمان، وصلى عليه مسلمة بن عبد الملك، وأنه أدرك نحو ثمان وسبعين سنة. {cite:salabi-umayyad-state-2020 p.81}"
