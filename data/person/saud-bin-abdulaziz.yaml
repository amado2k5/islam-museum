summary:
  ar: "ثاني ملوك المملكة العربية السعودية (1902–1969)، أكبر أبناء الملك عبد العزيز الباقين عند وفاته، وولي عهده من سنة 1933. اعتلى العرش في 9 نوفمبر 1953، وفي عهده توسّع الحرمان الشريفان وتأسست جامعة الملك سعود، ثم عصفت بالمملكة أزمة مالية وتصدّع داخل الأسرة، فتنازل عن سلطاته لفيصل سنة 1958 ونُقلت إليه كاملة سنة 1964، وخُلع في 2 نوفمبر 1964، وتوفي في أثينا في 23 فبراير 1969 ودُفن في مقبرة العود بالرياض."
  en: "Second King of Saudi Arabia (1902–1969), the eldest surviving son of King Abdulaziz and his crown prince from 1933. He ascended the throne on 9 November 1953; his reign saw the expansion of the two holy mosques and the founding of King Saud University, then a financial crisis and a rift within the family, the transfer of his powers to Faisal in 1958 and in full in 1964, and his deposition on 2 November 1964. He died in Athens on 23 February 1969 and was buried at Al Oud cemetery in Riyadh."
  ur: "سعودی عرب کے دوسرے بادشاہ (1902ء–1969ء)، شاہ عبد العزیز کے سب سے بڑے زندہ صاحبزادے اور 1933ء سے ولی عہد۔ 9 نومبر 1953ء کو تخت نشین ہوئے؛ ان کے دور میں حرمین کی توسیع ہوئی اور شاہ سعود یونیورسٹی قائم ہوئی، پھر مالی بحران اور خاندانی اختلاف آیا، 1958ء میں اختیارات فیصل کو منتقل ہوئے اور 1964ء میں مکمل طور پر، اور 2 نومبر 1964ء کو وہ معزول ہوئے۔ 23 فروری 1969ء کو ایتھنز میں وفات پائی اور ریاض کے العود قبرستان میں دفن ہوئے۔"
