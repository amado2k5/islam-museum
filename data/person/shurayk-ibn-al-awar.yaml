summary:
  ar: "شريك بن الأعور الحارثي وهو شريك بن الحارث؛ ولاه ابن زياد كرمان وكتب ليزيد بن زياد بن ربيعة بن مفرع الحميري إليه فأقطعه أرضاً بكرمان فباعها بعد هرب ابن زياد من البصرة."
  en: "Shurayk ibn al-A'war al-Harithi — Shurayk ibn al-Harith; Ibn Ziyad's governor of Kirman, who gave Yazid ibn Ziyad al-Himyari a land-grant later sold after Ibn Ziyad's flight."
  es: "Shurayk ibn al-A'war al-Harithi — Shurayk ibn al-Harith; El gobernador de Kirman de Ibn Ziyad, quien le dio a Yazid ibn Ziyad al-Himyari una concesión de tierras que luego vendió después de la huida de Ibn Ziyad."
  fr: "Shurayk ibn al-A'war al-Harithi — Shurayk ibn al-Harith; Le gouverneur de Kirman d'Ibn Ziyad, qui a donné à Yazid ibn Ziyad al-Himyari une concession de terre, a ensuite vendu après la fuite d'Ibn Ziyad."
  ur: "شوریق ابن الاعور الحارثی - شوریق ابن الحارث؛ ابن زیاد کا کرمان کا گورنر جس نے یزید ابن زیاد الحمیری کو ایک زمین عطا کی جو بعد میں ابن زیاد کی پرواز کے بعد فروخت کر دی گئی۔"
  tr: "Şerik ibn el-E'ver el-Hariti, yani Şerik ibn el-Harit; İbn Ziyad onu Kirman valisi olarak atadı ve Yezid ibn Ziyad bin Rabi'ah ibn Mufra' el-Himyari'ye yazdı; Yazid ona Kerman'da toprak verdi ve İbn Ziyad Basra'dan kaçtıktan sonra toprakları sattı."
  id: "Sharik ibn al-A'war al-Harithi, yang merupakan Sharik ibn al-Harith; Ibn Ziyad mengangkatnya sebagai gubernur Kerman dan menulis surat kepada Yazid ibn Ziyad ibn Rabi'ah ibn Mufra' al-Himyari, yang memberinya tanah di Kerman, dan ia menjualnya setelah Ibn Ziyad melarikan diri dari Basra."
