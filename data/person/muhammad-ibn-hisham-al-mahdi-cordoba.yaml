id: person/muhammad-ibn-hisham-al-mahdi-cordoba
class: person
label: { ar: "محمد بن هشام المهدي" }
summary:
  ar: "محمد بن هشام بن عبد الجبار بن عبد الرحمن الناصر، أحد بني أمية بقرطبة، ظهر في جمادى الآخرة سنة تسع وتسعين وثلاثمائة وتلقّب بالمهدي بالله فملك قرطبة وأخذ المؤيد هشاماً فحبسه في القصر ثم أظهر أنه مات وأخرج على الناس جثة إنسان نصراني يشبهه فصلوا عليه ودفنوه في مقابر المسلمين، ثم خرج عليه عمه هشام بن سليمان المتلبّب بالرشيد فهزمه وقتله، ثم خرج عليه سليمان بن الحكم المستعين يستنجد بالنصارى فانهزم في الوقعة المشهورة بقرطبة وتحصّن في القصر حتى احتال في الهرب واختفى، ثم عاد سراً إلى طليطلة فاستنجد بالنصارى وعاد فدخل قرطبة وجدد البيعة لنفسه وجعل الحجابة لواضح الغسّان العامري {cite:kamil-ibn-al-athir p. 499-501}."
  en: "Muhammad ibn Hisham ibn Abd al-Jabbar, an Umayyad of Cordoba who seized the city in 399 as 'al-Mahdi', hid the caliph Hisham al-Mu'ayyad and buried a lookalike Christian corpse in his name — the opening act of the fitna that broke the caliphate {cite:kamil-ibn-al-athir p. 499-501}."
