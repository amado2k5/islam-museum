id: person/muhammad-ibn-hisham-al-mahdi-cordoba
class: person
label: { ar: "محمد بن هشام المهدي" }
summary:
  ar: "محمد بن هشام بن عبد الجبار بن عبد الرحمن الناصر، أحد بني أمية بقرطبة، ظهر في جمادى الآخرة سنة تسع وتسعين وثلاثمائة وتلقّب بالمهدي بالله فملك قرطبة وأخذ المؤيد هشاماً فحبسه في القصر ثم أظهر أنه مات وأخرج على الناس جثة إنسان نصراني يشبهه فصلوا عليه ودفنوه في مقابر المسلمين، ثم خرج عليه عمه هشام بن سليمان المتلبّب بالرشيد فهزمه وقتله، ثم خرج عليه سليمان بن الحكم المستعين يستنجد بالنصارى فانهزم في الوقعة المشهورة بقرطبة وتحصّن في القصر حتى احتال في الهرب واختفى، ثم عاد سراً إلى طليطلة فاستنجد بالنصارى وعاد فدخل قرطبة وجدد البيعة لنفسه وجعل الحجابة لواضح الغسّان العامري {cite:kamil-ibn-al-athir p. 499-501}."
  en: "Muhammad ibn Hisham ibn Abd al-Jabbar, an Umayyad of Cordoba who seized the city in 399 as 'al-Mahdi', hid the caliph Hisham al-Mu'ayyad and buried a lookalike Christian corpse in his name — the opening act of the fitna that broke the caliphate {cite:kamil-ibn-al-athir p. 499-501}."
  es: "Muhammad ibn Hisham ibn Abd al-Jabbar, un omeya de Córdoba que tomó la ciudad en 399 como 'al-Mahdi', escondió al califa Hisham al-Mu'ayyad y enterró un cadáver cristiano parecido a él en su nombre, el acto inicial de la fitna que rompió el califato {cite:kamil-ibn-al-athir p. 499-501}."
  fr: "Muhammad ibn Hisham ibn Abd al-Jabbar, un Omeyyade de Cordoue qui s'empara de la ville en 399 en tant qu'« al-Mahdi », cacha le calife Hisham al-Mu'ayyad et enterra un cadavre chrétien ressemblant en son nom — l'acte d'ouverture de la fitna qui brisa le califat {cite:kamil-ibn-al-athir p. 499-501}."
  ur: "محمد بن ہشام بن عبد الجبار، قرطبہ کے ایک اموی جس نے 399 میں 'المہدی' کے نام سے شہر پر قبضہ کیا، خلیفہ ہشام المعیاد کو چھپا دیا اور اس کے نام پر ایک نظر آنے والی عیسائی لاش کو دفن کر دیا - خلافت کو توڑنے والے فتنے کا افتتاحی عمل۔ 499-501}۔"
  tr: "Muhammed ibn Hişam ibn Abd al-Jabbar ibn Abd al-Jabbar ibn Abd al-Rahman al-Nasir, Cordoba'nın Emevi kabilelerinden biri olarak, 399 Hicri yılında Cumede el-Ahira'da ortaya çıktı, el-Mehdi Billah unvanını aldı, Kordoba'yı yönetti, el-Mueyyad Hişam'ı aldı, onu sarayda hapsetti ve ardından öldüğünü açıkladı. Onun için dua ettiler ve Müslüman mezarlıklarına gömdüler. Sonra amcası Hişam bin Süleyman, Rashid'in saygın adamı ona karşı çıktı, onu yendi ve öldürdü. Sonra Sulayman ibn al-Hakam al-Musta'in Hristiyanlardan yardım istemek için çıktı, ancak ünlü Cordoba savaşında yenildi. Sarayda kendini güçlendirdi, sonra kandırıp ortadan kayboldu. Gizlice Toledo'ya döndü, Hristiyanlardan yardım istedi ve Cordoba'ya döndü, bağlılığını yeniledi ve al-Ghassan al-Amiri'ye perdeyi açıkça gösterdi {alıntı: Kamil-ibn-al-Athir s. 499-501}."
  id: "Muhammad ibn Hisham ibn Abd al-Jabbar ibn Abd al-Rahman al-Nasir, salah satu suku Umayyah di Cordoba, muncul di Jumada al-Akhira pada tahun 399 H, bergelar al-Mahdi Billah, memerintah Cordoba, mengambil al-Mu'ayyad Hisham, memenjarakannya di istana, lalu mengungkapkan bahwa ia telah meninggal. Mereka berdoa untuknya dan menguburkannya di pemakaman Muslim. Kemudian pamannya Hisham ibn Suham orang awam, yang dihormati dari Rashid, keluar melawannya, mengalahkannya, dan membunuhnya. Kemudian Sulayman ibn al-Hakam al-Musta'in keluar mencari bantuan dari orang Kristen, tetapi dia dikalahkan dalam pertempuran terkenal di Cordoba. Dia memperkuat dirinya di istana sampai dia menipu dan menghilang. Dia diam-diam kembali ke Toledo, mencari bantuan dari orang Kristen, dan kembali ke Cordoba, memperbarui kesetiaannya, dan membuka tabir kepada al-Ghassan al-Amiri {cite:Kamil-ibn-al-Athir hlm. 499-501}."
