summary:
  ar: "موفق الدين أبو المعالي أحمد بن هبة الله بن محمد بن حسين بن أبي الحديد المدائني ويُدعى القاسم أيضاً؛ أخو عز الدين ابن أبي الحديد؛ كانا فقيهين أديبين فاضلين ولهما أشعار ملاحة؛ له كتاب «الوشي المرقوم في حل المنظوم» وهو مع وجازته في غاية الحسن والإفادة وكتاب «المعاني المخترعة في صناعة الإنشاء» وهو أيضاً نهاية في بابه وله جموع اختار فيها شعر أبي تمام والبحتري وديك الجن والمتنبي في مجلد واحد كبير وله ديوان رسائل في عدة مجلدات؛ توفي ببغداد بعد أخذ التتر لها بقليل {cite:wafayat-ayan}."
  en: "Muwaffaq al-Din Ahmad Ibn Abi al-Hadid (590–656) — brother and continuator of the great commentator; author of al-Washi al-Marqum and al-Ma'ani al-Mukhtara'a on the craft of insha', and a multi-volume diwan of letters; died in Baghdad just after the Mongol sack {cite:wafayat-ayan}."
  es: "Muwaffaq al-Din Ahmad Ibn Abi al-Hadid (590–656) — hermano y continuador del gran comentarista; autor de al-Washi al-Marqum y al-Ma'ani al-Mukhtara'a sobre el arte del insha', y un diwan de cartas en varios volúmenes; murió en Bagdad justo después del saqueo mongol {cite:wafayat-ayan}."
  fr: "Muwaffaq al-Din Ahmad Ibn Abi al-Hadid (590–656) — frère et continuateur du grand commentateur; auteur d'al-Washi al-Marqum et d'al-Ma'ani al-Mukhtara'a sur l'art de l'insha', et d'un diwan de lettres en plusieurs volumes; mort à Bagdad juste après le sac mongol {cite:wafayat-ayan}."
  ur: "موفق الدین احمد ابن ابی الحدید (590-656) - عظیم مفسر کا بھائی اور تسلسل؛ الوشی المرقم اور المعانی المختارعہ کے مصنف انشاء کے ہنر پر، اور خطوط کا ایک کثیر جلد دیوان؛ بغداد میں منگول بوری کے فوراً بعد وفات پائی۔"
  tr: "Muwaffaq al-Din Abu al-Ma'ali Ahmed ibn Hibatullah ibn Muhammed ibn Hüseyin ibn Ebi el-Hadid el-Mada'ini, diğer adıyla el-Qasim; İzzeddin ibn Ebi el-Hadid'in kardeşi; ikisi de hukukçu, erdemli ve edebi figürlerdi ve parlak şiirlere sahiptiler. 'Al-Wushi al-Marqum fi Hall al-Manzum' adlı kitabı yazmıştır, kısalığıyla birlikte son derece iyi ve faydalıdır, ayrıca bölümünün sonu olan 'Al-Ma'ani Mukhtara' fi Sina'at al-Insha' kitabı da vardır. Abu Tammam, al-Buhturi, Dik al-Jinn ve al-Mutanabbi'nin şiirlerini tek büyük bir cilt halinde seçtiği koleksiyonlar yazdı ve birkaç ciltlik bir risaleler koleksiyonu vardı. Bağdat'ta Tatar unvanını aldıktan kısa bir süre sonra öldü. {cite:wafayat-ayan}."
  id: "Muwaffaq al-Din Abu al-Ma'ali Ahmad ibn Hibatullah ibn Muhammad ibn Husayn ibn Abi al-Hadid al-Mada'ini, juga disebut al-Qasim; saudara Izz al-Din ibn Abi al-Hadid; keduanya adalah ahli hukum, tokoh berbudi luhur dan sastra, serta memiliki puisi yang cemerlang. Ia menulis buku 'Al-Wushi al-Marqum fi Hall al-Manzum,' yang bersama dengan singkatnya karya sangat baik dan berguna, serta buku 'Al-Ma'ani Mukhtara' fi Sina'at al-Insha', yang juga merupakan akhir babnya. Ia menulis kumpulan puisi Abu Tammam, al-Buhturi, Dik al-Jinn, dan al-Mutanabbi dalam satu volume besar, dan memiliki kumpulan risalah dalam beberapa jilid. Ia meninggal di Baghdad tak lama setelah mengambil gelar Tatar di sana. {cite:wafayat-ayan}."
