summary:
  ar: "موفق الدين أبو المعالي أحمد بن هبة الله بن محمد بن حسين بن أبي الحديد المدائني ويُدعى القاسم أيضاً؛ أخو عز الدين ابن أبي الحديد؛ كانا فقيهين أديبين فاضلين ولهما أشعار ملاحة؛ له كتاب «الوشي المرقوم في حل المنظوم» وهو مع وجازته في غاية الحسن والإفادة وكتاب «المعاني المخترعة في صناعة الإنشاء» وهو أيضاً نهاية في بابه وله جموع اختار فيها شعر أبي تمام والبحتري وديك الجن والمتنبي في مجلد واحد كبير وله ديوان رسائل في عدة مجلدات؛ توفي ببغداد بعد أخذ التتر لها بقليل {cite:wafayat-ayan}."
  en: "Muwaffaq al-Din Ahmad Ibn Abi al-Hadid (590–656) — brother and continuator of the great commentator; author of al-Washi al-Marqum and al-Ma'ani al-Mukhtara'a on the craft of insha', and a multi-volume diwan of letters; died in Baghdad just after the Mongol sack {cite:wafayat-ayan}."
