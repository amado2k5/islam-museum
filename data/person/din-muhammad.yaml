summary:
  ar: "قاضٍ في المحكمة العليا بلاهور وعضو لجنة حدود البنجاب سنة 1947؛ وبصفته العضو الأقدم ترأس جلساتها العلنية في لاهور من 21 إلى 31 يوليو 1947، وقدم تقريره في 5 أغسطس مؤيداً خط التقسيم الذي اقترحته الرابطة الإسلامية."
  en: "Lahore High Court judge and member of the 1947 Punjab Boundary Commission; as its seniormost member he presided over its public sittings at Lahore from 21 to 31 July 1947, and his report of 5 August supported the boundary line proposed by the Muslim League."
  ur: "لاہور ہائی کورٹ کے جج اور 1947ء کی پنجاب حد بندی کمیشن کے رکن؛ کمیشن کے سینئر ترین رکن کی حیثیت سے انھوں نے 21 تا 31 جولائی 1947ء لاہور میں اس کی عوامی سماعتوں کی صدارت کی، اور 5 اگست کی اپنی رپورٹ میں مسلم لیگ کی مجوزہ سرحدی لائن کی حمایت کی۔"
