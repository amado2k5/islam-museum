summary:
  ar: "بطاقة أولية لشمس الدين إلياس شاه، مؤسس سلطنة البنغال الموحدة الذي جمع ساتكاؤن وسوناركاؤن ولخنوتي تحت سلطانه في القرن الرابع عشر، توفي سنة ١٣٥٨م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Shams al-Din Ilyas Shah, founder of the unified Bengal sultanate who joined Satgaon, Sonargaon and Lakhnauti under his rule in the fourteenth century, d. 1358; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Shams al-Din Ilyas Shah, fundador del sultanato unificado de Bengala que unificó Satgaon, Sonargaon y Lakhnauti bajo su gobierno en el siglo XIV, fallecido en 1358; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature de Shams al-Din Ilyas Shah, fondateur du sultanat unifié du Bengale qui a réuni Satgaon, Sonargaon et Lakhnauti sous son règne au XIVe siècle, mort en 1358; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "متحدہ بنگال کی سلطنت کے بانی شمس الدین الیاس شاہ کے لیے ڈرافٹ کارڈ جو چودھویں صدی میں اپنے دور حکومت میں ستگاؤں، سونارگاؤں اور لکھنوتی میں شامل ہوئے، ڈی۔ 1358; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
