summary:
  en: "Father of Ammar and husband of Sumayya; the whole family was tortured by the polytheists, and Yasir died under torture while the Prophet told them 'Patience, family of Yasir — your appointed place is Paradise.'"
  ar: "والد عمار وزوج سمية؛ عُذّبت الأسرة كلها عند بني مخزوم، ومات ياسر في العذاب والنبي يقول لهم: «صبراً آل ياسر فإن موعدكم الجنة»."
  ur: "عمار کا والد اور سمیہ کا شوہر؛ پورا خاندان مشرکین کے ہاتھوں اذیت پایا اور یاسر اذیت میں فوت ہوا۔"
  es: "Padre de Ammar y esposo de Sumayya; toda la familia fue torturada por los politeístas, y Yasir murió bajo tortura mientras el Profeta les decía: \"Paciencia, familia de Yasir: vuestro lugar destinado es el Paraíso\"."
  fr: "Père d'Ammar et époux de Sumayya, toute la famille fut torturée par les polythéistes, et Yasir mourut sous la torture tandis que le Prophète leur disait: « Patience, famille de Yasir, votre place désignée est le Paradis. »"
  tr: "Ammar'ın babası ve Sumayye'nin eşi; tüm aile Banu Makhzum tarafından işkence gördü ve Yaser işkence içinde öldü, Peygamber ise onlara şöyle dedi: \"Ey Yaser ailesi, sabırlı olun, çünkü varış yeriniz cennettir.\""
  id: "Ayah Ammar dan suami Sumayyah; seluruh keluarga disiksa oleh Banu Makhzum, dan Yasser meninggal dalam penderitaan, sementara Nabi berkata kepada mereka: \"Bersabarlah, wahai keluarga Yasser, karena tujuanmu adalah Surga.\""
