summary:
  ar: "لاعب كاراتيه أذربيجاني، وُلد في سومقاييت سنة 1985. بطل العالم خمس مرات وبطل أوروبا إحدى عشرة مرة في الكوميتيه، وحامل فضية أولمبياد طوكيو 2020 في وزن 75 كغ، وذهبيتي دورتي ألعاب التضامن الإسلامي 2013 و2017، وبطل كاراتيه كومبات في الوزن الوسط بسجل 5–0."
  en: "Azerbaijani karateka, born in Sumgait in 1985. A five-time world champion and eleven-time European champion in kumite, he took silver in the 75 kg division at the Tokyo 2020 Olympics, won gold at the 2013 and 2017 Islamic Solidarity Games, and holds the Karate Combat welterweight title with a 5–0 record."
  ur: "آذربائیجانی کراٹے کھلاڑی، 1985 میں سمقایت میں پیدا ہوئے۔ کمیتے میں پانچ مرتبہ عالمی چیمپئن اور گیارہ مرتبہ یورپی چیمپئن رہے، ٹوکیو 2020 اولمپکس میں 75 کلوگرام میں چاندی کا تمغہ جیتا، 2013 اور 2017 کے اسلامک سولیڈیریٹی گیمز میں سونا جیتا، اور کراٹے کمبیٹ ویلٹر ویٹ ٹائٹل 5–0 ریکارڈ کے ساتھ اپنے پاس رکھتے ہیں۔"
