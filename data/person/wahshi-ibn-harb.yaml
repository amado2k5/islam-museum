summary:
  en: "An Abyssinian slave famous for his javelin: promised his freedom for killing Hamza at Uhud, he later became a Muslim and, in the tradition's account, also killed the false prophet Musaylima at Yamama."
  ar: "عبد حبشي اشتهر بحربته: وُعد بالحرية على قتل حمزة بأحد، ثم أسلم وفي رواية التراث قتل مسيلمة الكذاب باليمامة. وفي الصحيح أخبر بنفسه لجعفر بن عمرو الضمري بحمص كيف كمن لحمزة تحت صخرة فرماه بحربته، وذلك لوعد مولاه جبير بن مطعم إياه الحرية على قتل حمزة بعمه طعيمة بن عدي {cite:sahih-al-bukhari 4072}."
