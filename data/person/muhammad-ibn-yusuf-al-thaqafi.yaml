summary:
  ar: "أخو الحجاج بن يوسف؛ ولاه الحجاج اليمن فأساء السيرة وظلم الرعية وأخذ أراضي الناس بغير حقها — وكان مما اغتصبه الحُرجة — وضرب على أهل اليمن خراجاً جعله وظيفة عليهم، فلما ولي عمر بن عبد العزيز أمر عامله بإلغاء الوظيفة والاقتصار على العشر وقال «والله لئن لا تأتيني من اليمن حفنة كَثَم أحب إليّ من إقرار هذه الوظيفة»، فلما ولي يزيد بن عبد الملك أمر بردّها."
  en: "Al-Hajjaj ibn Yusuf's brother; appointed over Yemen by him he governed badly, wronged the subjects and seized people's lands unlawfully — among them al-Hurja — and imposed on the people of Yemen a kharaj made into a fixed wazifa; when Umar ibn Abd al-Aziz took office he ordered his agent to abolish the levy and content himself with the tithe, saying 'by God, that not a handful of katam should reach me from Yemen is dearer to me than confirming this wazifa'; when Yazid ibn Abd al-Malik took office he ordered it restored."
  es: "Hermano de Al-Hajjaj ibn Yusuf; nombrado gobernador de Yemen por él, gobernó mal, perjudicó a los súbditos y se apoderó ilegalmente de las tierras de la gente —entre ellas al-Hurja— e impuso al pueblo de Yemen un kharaj convertido en un wazifa fijo; cuando Umar ibn Abd al-Aziz asumió el cargo, ordenó a su agente que aboliera el impuesto y se contentara con el diezmo, diciendo: «¡Por Dios, que ni un puñado de katam me llegue de Yemen es más preciado para mí que confirmar este wazifa!»; cuando Yazid ibn Abd al-Malik asumió el cargo, ordenó que se restableciera."
  fr: "Al-Hajjaj ibn Yusuf, frère de Hajjaj ibn Yusuf, fut nommé gouverneur du Yémen. Il gouverna mal, maltraita ses sujets et s'empara illégalement de leurs terres, notamment d'al-Hurja. Il imposa également au peuple yéménite un kharaj transformé en wazifa fixe. À son arrivée au pouvoir, Umar ibn Abd al-Aziz ordonna à son agent d'abolir ce prélèvement et de se contenter de la dîme, déclarant: « Par Dieu, qu'un seul katam ne me parvienne pas du Yémen m'est plus cher que de confirmer ce wazifa. » À son arrivée au pouvoir, Yazid ibn Abd al-Malik ordonna son rétablissement."
  ur: "الحجاج ابن یوسف کے بھائی؛ اس کے ذریعہ یمن پر مقرر کیا گیا، اس نے بری طرح حکومت کی، رعایا پر ظلم کیا اور لوگوں کی زمینوں پر ناجائز قبضہ کیا، جن میں الحرجہ بھی شامل ہے، اور یمن کے لوگوں پر ایک مخصوص وظیفہ بنا کر مسلط کیا۔ جب عمر بن عبدالعزیز نے عہدہ سنبھالا تو اس نے اپنے ایجنٹ کو حکم دیا کہ وہ محصول ختم کر دے اور خود کو دسواں حصہ پر قناعت کر لے، یہ کہتے ہوئے کہ 'خدا کی قسم کہ یمن سے ایک مٹھی بھر کاتم بھی مجھے اس وظیفہ کی تصدیق سے زیادہ عزیز نہیں'۔ جب یزید بن عبد الملک نے اقتدار سنبھالا تو اس نے اسے بحال کرنے کا حکم دیا۔"
  tr: "O, Al-Hajcaj ibn Yusuf'un kardeşiydi; El-Haccac onu Yemen valisi olarak atadı, bu yüzden yaramazlık yaptı, tebaalara kötülük etti, insanların topraklarını hakları olmadan aldı—ki bu onun ele geçirdiği zor şeylerden biriydi—ve Yemen halkına vergi koydu, bunu onların üzerinde bir konum haline getirdi. Ömer bin Abdülaziz iktidara geldiğinde, valisine bu makamı kaldırmasını ve sadece ondalıkla sınırlamasını emretti; şöyle dedi: \"Tanrı aşkına, eğer Yemen'den bana bir avuç kişi gelmezse, bu pozisyonu onaylamaktan daha değerlidir.\" Yazid bin Abdülmelik göreve başladığında, onun iadesini emretti."
  id: "Ia adalah saudara dari Al-Hajjaj ibn Yusuf; Al-Hajjaj mengangkatnya sebagai gubernur Yaman, sehingga ia berbuat nakal, menyakiti rakyat, dan mengambil tanah rakyat tanpa hak mereka—yang merupakan salah satu hal sulit yang ia rebut—dan mengenakan pajak kepada rakyat Yaman, menjadikannya posisi atas mereka. Ketika Umar ibn Abd al-Aziz naik tahta, ia memerintahkan gubernurnya untuk menghapus jabatan tersebut dan membatasinya hanya pada persepuluhan, dengan berkata, \"Demi Tuhan, jika Anda tidak datang kepadaku dari Yaman beberapa dari mereka, itu lebih berharga bagi saya daripada menyetujui posisi ini.\" Ketika Yazid ibn Abd al-Malik menjabat, ia memerintahkan pemulangannya."
