summary:
  ar: "أخو الحجاج بن يوسف؛ ولاه الحجاج اليمن فأساء السيرة وظلم الرعية وأخذ أراضي الناس بغير حقها — وكان مما اغتصبه الحُرجة — وضرب على أهل اليمن خراجاً جعله وظيفة عليهم، فلما ولي عمر بن عبد العزيز أمر عامله بإلغاء الوظيفة والاقتصار على العشر وقال «والله لئن لا تأتيني من اليمن حفنة كَثَم أحب إليّ من إقرار هذه الوظيفة»، فلما ولي يزيد بن عبد الملك أمر بردّها."
  en: "Al-Hajjaj ibn Yusuf's brother; appointed over Yemen by him he governed badly, wronged the subjects and seized people's lands unlawfully — among them al-Hurja — and imposed on the people of Yemen a kharaj made into a fixed wazifa; when Umar ibn Abd al-Aziz took office he ordered his agent to abolish the levy and content himself with the tithe, saying 'by God, that not a handful of katam should reach me from Yemen is dearer to me than confirming this wazifa'; when Yazid ibn Abd al-Malik took office he ordered it restored."
