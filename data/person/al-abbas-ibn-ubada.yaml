summary:
  en: "A zealous leader of the Khazraj who attended both Pledges of Aqaba; at the Second Pledge he stood to impress upon the Yathribites the gravity of their covenant, declaring their readiness to face war against all mankind; after the meeting he offered to strike the Quraysh encampment at Mina if ordered; he was martyred at the battle of Uhud."
  ar: "فارس أنصاري من السابقين؛ شهد بيعتي العقبة، وقام في الثانية يؤكد لقومه خطورة البيعة وأنهم يبايعون على حرب الأحمر والأسود، ولما صرخ الشيطان بالعقبة عرض أن يميل بأسيافهم على أهل منى، واستشهد يوم أحد."
