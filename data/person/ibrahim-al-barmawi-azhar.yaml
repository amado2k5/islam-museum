roles: [scholar]
gender: male
summary:
  ar: "إبراهيم بن محمد بن شهاب الدين بن خالد، برهان الدين البرماوي الأنصاري الأحمدي الأزهري، من فقهاء الشافعية وشيخ الجامع الأزهر، نسبته إلى برمة في غربية مصر، له حواش على شرح القرافي وشرح فتح الوهاب وشرح الرحبية وشرح غاية التقريب، توفي سنة 1106 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 1 pp. 67-68}."
  en: "Ibrahim ibn Muhammad ibn Shihab al-Din ibn Khalid, Burhan al-Din al-Barmawi al-Ansari al-Ahmadi al-Azhari, a Shafi'i jurist and shaykh of the mosque of al-Azhar, named for Barma in the Gharbiyya province of Egypt; he left glosses on commentaries including Fath al-Wahhab, al-Rahbiyya and Ghayat al-Taqrib, and died in 1106 AH (1695 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 1 pp. 67-68}."
  es: "Ibrahim ibn Muhammad ibn Shihab al-Din ibn Khalid, Burhan al-Din al-Barmawi al-Ansari al-Ahmadi al-Azhari, jurista shafi'i y jeque de la mezquita de al-Azhar, llamada así por Barma en la provincia de Gharbiyya en Egipto; dejó glosas sobre comentarios que incluyen a Fath al-Wahhab, al-Rahbiyya y Ghayat al-Taqrib, y murió en 1106 d. H. (1695 d. C.) {citar:alam-zirikli-dar-al-ilm-2002 vol. 1 págs. 67-68}."
  fr: "Ibrahim ibn Muhammad ibn Shihab al-Din ibn Khalid, Burhan al-Din al-Barmawi al-Ansari al-Ahmadi al-Azhari, juriste shafi'i et cheikh de la mosquée d'al-Azhar, du nom de Barma dans la province de Gharbiyya en Égypte; il a laissé des gloses sur des commentaires incluant Fath al-Wahhab, al-Rahbiyya et Ghayat al-Taqrib, et est mort en 1106 AH (1695 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 1 p. 67-68}."
  ur: "ابراہیم بن محمد بن شہاب الدین ابن خالد، برہان الدین البرماوی الانصاری الاحمدی الازہری، ایک شافعی فقیہ اور مسجد الازہر کے شیخ، جس کا نام مصر کے صوبہ غربیہ میں برما کے لیے رکھا گیا ہے۔ اس نے فتح الوہاب، الرحبیہ اور غیاث التقریب سمیت تفسیروں پر روشنی ڈالی اور 1106 ہجری ⁦(1695 عیسوی)⁩ میں وفات پائی۔ 1 صفحہ 67-68}۔"
  tr: "İbrahim ibn Muhammed bin Şihabeddin ibn Halid, Burhan al-Din el-Ensari el-Ahmadi el-Ezher, Şafii hukukçularından biri ve Ezher Camii Şeyhi, batı Mısır'da Burma'ya atfedilen Burhan al-Din el-Barmawi el-Ensari el-Ahmadi el-Ezheri. Şerh el-Karafi, Şerh Feth al-Wahhab, Şerh al-Rahbiyyah ve Şerh Ghayat el-Taqrib üzerine kenar notlar yazdı. 1106 Hicri yılında vefat etti {cite:alam-zirikli-dar-al-ilm-2002 cilt 1, ss. 67-68}."
  id: "Ibrahim ibn Muhammad ibn Shihab al-Din ibn Khalid, Burhan al-Din al-Barmawi al-Ansari al-Ahmadi al-Azhari, salah satu ahli hukum Shafi'i dan Sheikh Masjid Al-Azhar, yang dikaitkan dengan Burma di Mesir barat. Ia menulis catatan pinggir tentang Sharh al-Qarafi, Sharh Fath al-Wahhab, Sharh al-Rahbiyyah, dan Sharh Ghayat al-Taqrib. Ia wafat pada tahun 1106 H {cite:alam-zirikli-dar-al-ilm-2002 vol. 1, hlm. 67-68}."
