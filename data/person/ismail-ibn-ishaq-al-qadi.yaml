label: { ar: "إسماعيل بن إسحاق القاضي", en: "Ismail Ibn Ishaq Al Qadi" }
summary:
  ar: "إسماعيل بن إسحاق بن إسماعيل بن حماد بن زيد بن درهم وهو الذي بسط فقه مالك ونشره واحتج له وصنف فيه الكتب ودعا إليه الناس ورغبهم فيه وكان فاضلا فقيها نبيلا وكان إليه القضاء، وتوفي سنة اثنتين وثمانين ومائتين ليلة الأربعاء لسبع بقين من ذي الحجة، وله كتاب أحكام القرآن كبير وكتاب أهوال القيامة نحو ثلثمائة ورقة وكتاب المبسوط وكتاب حجاج القرآن وكتاب شواهد الموطأ وكتاب المغازي وكتاب الرد على محمد بن الحسن ولم يتمه {cite:fihrist-ibn-al-nadim p. 282}."
  en: "Ismail ibn Ishaq — the qadi who spread the Maliki school in Baghdad {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
