class: person
label: { ar: "إسماعيل بن إسحاق القاضي", en: "Ismail Ibn Ishaq Al Qadi", es: "Ismail Ibn Ishaq Al Qadi", fr: "Ismail Ibn Ishaq Al Qadi", ur: "اسماعیل ابن اسحاق القادی" }
summary:
  ar: "إسماعيل بن إسحاق بن إسماعيل بن حماد بن زيد بن درهم وهو الذي بسط فقه مالك ونشره واحتج له وصنف فيه الكتب ودعا إليه الناس ورغبهم فيه وكان فاضلا فقيها نبيلا وكان إليه القضاء، وتوفي سنة اثنتين وثمانين ومائتين ليلة الأربعاء لسبع بقين من ذي الحجة، وله كتاب أحكام القرآن كبير وكتاب أهوال القيامة نحو ثلثمائة ورقة وكتاب المبسوط وكتاب حجاج القرآن وكتاب شواهد الموطأ وكتاب المغازي وكتاب الرد على محمد بن الحسن ولم يتمه {cite:fihrist-ibn-al-nadim p. 282}."
  en: "Ismail ibn Ishaq — the qadi who spread the Maliki school in Baghdad {cite:fihrist-ibn-al-nadim}"
  es: "Ismail ibn Ishaq, el cadí que difundió la escuela Maliki en Bagdad {cita:fihrist-ibn-al-nadim}"
  fr: "Ismail ibn Ishaq - le cadi qui a propagé l'école Maliki à Bagdad {cite: fihrist-ibn-al-nadim}"
  ur: "اسماعیل ابن اسحاق - وہ قادی جس نے بغداد میں مالکی مکتب کو پھیلایا۔"
  tr: "İsmail bin İshaq ibn İsmail ibn İsmail ibn İsmail ibn Hammad ibn Zayd ibn Dirham, Malik'in hukukunu genişleten, yayımlayan, kanıt olarak gösteren, kitaplar yazan ve insanları kendisine çağırıp cesaretlendiren Dirhem, erdemli, asil bir hukukçuydu ve yargı görevlerinde bulunuyordu. 282 Hicri yılında, yedinci Zulhicce öncesi Çarşamba geceleri vefat etti. 'Ahkam al-Qur'an' (büyük bir kitap), yaklaşık üç yüz sayfalık 'Dirilişin Dehşetleri' kitabı, 'Al-Mabsut', 'Hac al-Qur'an', 'Shawahid al-Muwatta', 'Al-Maghazi' ve tamamlamadığı 'Muhammed ibn al-Hasan'ın Çürütülmesi' kitabını yazdı {cite:fihrist-ibn-al-nadim s. 282}."
  id: "Ismail ibn Ishaq ibn Ismail ibn Hammad ibn Zayd ibn Dirham, yang memperluas yurisprudensi Malik, menerbitkannya, mengutipnya sebagai bukti, menulis buku-buku tentangnya, dan memanggil orang-orang serta mendorong mereka. Ia adalah seorang ahli hukum yang berbudi luhur dan mulia, serta memegang jabatan yudisial untuknya. Ia meninggal pada tahun 282 HH, pada malam Rabu sebelum tanggal tujuh Dhu al-Hijjah. Ia menulis buku 'Ahkam al-Qur'an' (sebuah kitab besar), buku 'Kengerian Kebangkitan' sekitar tiga ratus halaman, buku 'Al-Mabsut', buku 'Hajjaj al-Qur'an', buku 'Shawahid al-Muwatta', buku 'Al-Maghazi', dan buku 'Penolakan Muhammad ibn al-Hasan' yang tidak ia selesaikan {sitasi: fihrist-ibn-al-nadim hlm. 282}."
