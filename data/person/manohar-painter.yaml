label: { ar: "منوهر ⁦(مصور مغولي)⁩", en: "Manohar (Mughal painter)", ur: "منوہر ⁦(مغل مصور)⁩", es: "Manohar (Mughal painter)", fr: "Manohar (Mughal painter)" }
summary:
  ar: "مصور مغولي ⁦(ولد أواخر ستينيات القرن السادس عشر)⁩ ابن بساون، امتد عمله من أوائل ثمانينيات القرن السادس عشر إلى عشرينيات السابع عشر، وتخصص في جلال البلاط المغولي وأبهته {cite:beach-grand-mogul-1978 p. 130}."
  en: "Mughal painter (born in the late 1560s), son of Basawan, active from the early 1580s to the 1620s, whose main interest was the majesty and decorum of the imperial court {cite:beach-grand-mogul-1978 p. 130}."
  ur: "مغل مصور ⁦(پیدائش 1560ء کی دہائی کا آخر)⁩، بساون کے بیٹے، جو 1580ء کی دہائی کے آغاز سے 1620ء کی دہائی تک فعال رہے اور جن کی بنیادی دلچسپی شاہی دربار کی شان و آداب تھی {cite:beach-grand-mogul-1978 p. 130}۔"
  es: "Pintor mogol (nacido a finales de la década de 1560), hijo de Basawan, activo desde principios de la década de 1580 hasta la de 1620, cuyo principal interés era la majestad y el decoro de la corte imperial {cite:beach-grand-mogul-1978 p. 130}."
  fr: "Peintre moghol (né à la fin des années 1560), fils de Basawan, actif du début des années 1580 aux années 1620, dont l'intérêt principal était la majesté et le décorum de la cour impériale {cite:beach-grand-mogul-1978 p. 130}."
  tr: "Moğol ressam (1660'ların sonlarında doğmuş), Basawan'ın oğlu olan Echo'nun eserleri 1880'lerin başından 1720'lere kadar uzanmış, Babür sarayının ihtişamı ve ihtişamı üzerinde uzmanlaşmıştır {cite:beach-grand-mogul-1978, s. 130}."
  id: "Seorang pelukis Mongolia (lahir akhir 1660-an), putra Basawan, karyanya berlangsung dari awal 1880-an hingga 1720-an, mengkhususkan diri pada kemegahan dan kemegahan istana Mughal {cite:beach-grand-mogul-1978, hlm. 130}."
