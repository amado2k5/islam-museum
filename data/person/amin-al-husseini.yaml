summary:
  ar: "قائد قومي عربي ومسلم فلسطيني (نحو 1897–1974) تولّى منصب مفتي القدس من 1921 إلى 1937 وقاد اللجنة العربية العليا، وقضى الحرب العالمية الثانية في أوروبا المحور، وبقي شخصية مركزية مختلفًا عليها في السياسة الفلسطينية حتى 1948 وبعدها."
  en: "Palestinian Arab nationalist and Muslim leader (c. 1897–1974) who served as Grand Mufti of Jerusalem from 1921 to 1937, led the Arab Higher Committee, spent the Second World War in Axis Europe, and remained a central, contested figure in Palestinian politics until 1948 and after."
