summary:
  ar: "أبو هاشم فديم، من متقدمي البغداديين المعروفين بالنسك والتحقيق بالتصوف، جلس إليه سفيان الثوري فاستحسن طريقته، ولم يُحفظ من كلامه إلا ما حكاه عنه الثوري في ترك الرياء."
  en: "Abu Hashim Fadim, one of the early Baghdadis known for ascetic practice and the realisation of Sufism; Sufyan al-Thawri sat with him and praised his way, and only what al-Thawri related of his words in leaving off show survives."
  ur: "ابو ہاشم فدیم قدیم بغدادی زاہدوں میں سے تھے جو نسک اور تصوف کی تحقیق میں مشہور تھے۔ سفیان ثوری ان کی مجلس میں بیٹھے اور ان کے طریقے کو سراہا۔ ان کے کلام میں سے صرف وہ بات محفوظ ہے جو ثوری نے ریا چھوڑنے کے بارے میں نقل کی۔"
  fr: "Abu Hashim Fadim, l'un des premiers Bagdadiens connus pour leur pratique ascétique et la réalisation du soufisme ; Sufyan al-Thawri s'assit avec lui et loua sa voie, et seul subsiste ce qu'al-Thawri rapporta de ses paroles sur l'abandon de l'ostentation."
  es: "Abu Hashim Fadim, uno de los primeros bagdadíes conocidos por su práctica ascética y la realización del sufismo; Sufyan al-Thawri se sentó con él y elogió su camino, y solo sobrevive lo que al-Thawri relató de sus palabras al despedirse."
