summary:
  ar: 'مطيع بن إياس، شاعر من موالي الفرس رُمي بالزندقة في العصر العباسي الأول، ويذكر أحمد أمين أنه من تأييد المذاهب المانية والديصانية وأنه ممن اشتهر بالزندقة مع الحمادين الثلاثة وبشار بن برد وابن المقفع وابن أبي العوجاء وصالح بن عبد القدوس وغيرهم {cite:duha-islam p. 139, 149}. ومن نوادره أن الشعراء مدحوا المهدي فلما فرغ مطيع قال: «حدثنا فلان عن فلان أن النبي قال: المهدي منا محمد وابن...» {cite:duha-islam p. 304}.'
  en: Muti' ibn Iyas — Persian-mawla poet among the famed accused zindiqs, sympathetic to Manichaean and Daysanite doctrines {cite:duha-islam p. 139, 149}.
  es: "Muti' ibn Iyas: poeta persa-mawla entre los famosos zindiqs acusados, simpatizante de las doctrinas maniqueas y daysanitas {cita:duha-islam p. 139, 149}."
  fr: "Muti' ibn Iyas — Poète persan-mawla parmi les célèbres zindiqs accusés, sympathique aux doctrines manichéennes et daysanites {cite:duha-islam p. 139, 149}."
  ur: "مطیع ابن ایاس - مشہور ملزم زندیقوں میں سے ایک فارسی-مولا شاعر، مانیکیائی اور دیسانی عقائد کا ہمدرد {حوالہ:دوہ اسلام ص۔ 139، 149}۔"
  tr: "Pers mevalilerinden bir şair olan Muti' ibn Iyas, erken Abbasi döneminde sapkınlıkla suçlanmıştır. Ahmed Amin, Alman ve Disanit mezheblerini desteklediğini ve üç Hammad ile birlikte sapkınlıkla ünlenenler arasında olduğunu belirtir: Beşar ibn Burd, İbn el-Muqaffa, İbn Ebi el-Avca, Salih ibn Abdül-Quddus ve diğerleri {atıf:Duha-İslam, s. 139, 149}. Nadir örneklerinden biri, şairlerin Mehdi'yi övmesidir. Muti' bitirdiğinde şöyle dedi: \"Şu falanca bize şöyle dedi: Peygamber şöyle dedi: Mehdi bizden, Muhammed ve oğuldandır...\" {alıntı:Duha-İslam s. 304}."
  id: "Muti' ibn Iyas, seorang penyair di antara para mawali Persia, dituduh melakukan ajaran sesat pada era awal Abbasiyah. Ahmad Amin menyebutkan bahwa ia mendukung aliran Jerman dan Disanite dan termasuk di antara mereka yang terkenal karena ajaran sesat bersama tiga Hammad, Bashar ibn Burd, Ibn al-Muqaffa', Ibn Abi al-Awja, Salih ibn Abd al-Quddus, dan lainnya {cite:Duha-Islam, hlm. 139, 149}. Di antara contoh langkanya adalah para penyair memuji Mahdi. Ketika Muti' selesai, ia berkata: \"Si anu memberitahu kita dari si anu bahwa Nabi berkata: Mahdi adalah dari kita Muhammad dan anaknya...\" {cite:Duha-Islam hlm. 304}."
