summary:
  ar: "مطيع بن إياس، شاعر من موالي الفرس رُمي بالزندقة في العصر العباسي الأول، ويذكر أحمد أمين أنه من تأييد المذاهب المانية والديصانية وأنه ممن اشتهر بالزندقة مع الحمادين الثلاثة وبشار بن برد وابن المقفع وابن أبي العوجاء وصالح بن عبد القدوس وغيرهم {cite:duha-islam p. 139, 149}. ومن نوادره أن الشعراء مدحوا المهدي فلما فرغ مطيع قال: «حدثنا فلان عن فلان أن النبي قال: المهدي منا محمد وابن...» {cite:duha-islam p. 304}."
  en: "Muti' ibn Iyas — Persian-mawla poet among the famed accused zindiqs, sympathetic to Manichaean and Daysanite doctrines {cite:duha-islam p. 139, 149}."
