summary:
  ar: "محمد بن مروان بن الحكم؛ ولي الموصل والجزيرة وأرمينية وأذربيجان لأبيه مروان وكان صاحب شرطته ابن تليد الذي فرش الموصل بالحجارة وقال الواقدي ولاه عبد الملك الجزيرة وأرمينية وأخاه سعيداً الموصل."
  en: "Muhammad ibn Marwan ibn al-Hakam; he governed Mosul, the Jazira, Armenia and Azerbaijan for his father Marwan, his police-chief Ibn Tulayd paving Mosul with stone — Waqidi has Abd al-Malik giving him the Jazira and Armenia and his brother Sa'id Mosul."
  es: "Muhammad ibn Marwan ibn al-Hakam; gobernó Mosul, la Jazira, Armenia y Azerbaiyán para su padre Marwan, su jefe de policía Ibn Tulayd pavimentó Mosul con piedra; Waqidi dice que Abd al-Malik le dio la Jazira y Armenia y su hermano Sa'id Mosul."
  fr: "Muhammad ibn Marwan ibn al-Hakam; il gouverna Mossoul, la Jazira, l'Arménie et l'Azerbaïdjan pour son père Marwan, son chef de police Ibn Tulayd pavant Mossoul de pierres — Waqidi dit qu'Abd al-Malik lui donna la Jazira et l'Arménie et son frère Sa'id Mossoul."
  ur: "محمد بن مروان ابن الحکم؛ اس نے اپنے والد مروان کے لیے موصل، جزیرہ، آرمینیا اور آذربائیجان پر حکومت کی، اس کے پولیس چیف ابن طلید نے موصل کو پتھر سے ہموار کیا — واقدی نے عبد الملک کو جزیرہ اور آرمینیا اور اپنے بھائی سعید کو موصل دیا ہے۔"
