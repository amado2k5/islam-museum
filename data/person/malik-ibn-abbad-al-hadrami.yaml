  ur: "بنو الاسود بن رزان کے تحفظ کے معاہدے کے تحت بنو الحدرمی کا ایک تاجر؛ خزاعہ نے اسے ان کی زمین پر مار ڈالا اور اس کا سامان لے لیا - اس جھگڑے کی پہلی کڑی جو الطیر پر ختم ہوئی۔"
