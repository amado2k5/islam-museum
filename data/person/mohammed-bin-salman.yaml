summary:
  ar: "ولي عهد المملكة العربية السعودية منذ 21 يونيو 2017 ورئيس مجلس وزرائها منذ 27 سبتمبر 2022، ابن الملك سلمان بن عبد العزيز؛ وزير الدفاع من 2015 إلى 2022 وصاحب برنامج «رؤية السعودية 2030» المعلن سنة 2016، قاد إصلاحات اجتماعية واقتصادية حدّت من نفوذ المؤسسة الدينية في بلاده؛ وهو ولي عهد لا ملك، فلا خلافة ملكية له في هذا السجل."
  en: "Crown Prince of Saudi Arabia since 21 June 2017 and Prime Minister since 27 September 2022; the son of King Salman. Defence minister from 2015 to 2022 and the author of the Saudi Vision 2030 programme announced in 2016, he has led social and economic reforms that curtailed the religious establishment's role in his country. He is a crown prince, not a king, and no kingship succession is recorded for him."
  ur: "سعودی عرب کے ولی عہد از 21 جون 2017ء اور وزیر اعظم از 27 ستمبر 2022ء؛ شاہ سلمان بن عبد العزیز کے صاحبزادے؛ 2015ء سے 2022ء تک وزیر دفاع رہے اور 2016ء میں اعلان کردہ «سعودی ویژن 2030» کے بانی ہیں؛ انھوں نے سماجی و معاشی اصلاحات کی قیادت کی جن سے ان کے ملک میں مذہبی ادارے کا کردار محدود ہوا؛ وہ ولی عہد ہیں، بادشاہ نہیں، لہٰذا اس ریکارڈ میں ان کے لیے کوئی بادشاہت کی جانشینی درج نہیں۔"
