summary:
  ar: "خطيبة وناشطة قومية إندونيسية من مينانغكابو (1910–1965): تدرّبت في مدارس دينية بوتري وسومطرة طوالب، وجابت سومطرة الغربية بخطب نارية مناهضة للاستعمار في الثلاثينيات نيابة عن بيرمي، وسُجنت سنة 1932، ودعت إلى المساواة في التعليم للنساء، وسُمّيت بطلة قومية سنة 1974."
  en: "Minangkabau orator and Indonesian nationalist activist (1910–1965): trained at the Diniyah Putri and Sumatera Thawalib schools, she toured West Sumatra with fiery anti-colonial speeches for Permi in the 1930s, was imprisoned in 1932, campaigned for equal education for women, and was named a National Hero in 1974."
  ur: "مینانگکاباؤ مقررہ اور انڈونیشی قوم پرست کارکن (1910ء–1965ء): دینیہ پوتری اور سوماترا طوالب مدارس سے تربیت پائی، تیس کی دہائی میں پرمی کی جانب سے مغربی سوماترا کا دورہ کر کے پرجوش استعمار مخالف تقریریں کیں، 1932ء میں قید ہوئیں، خواتین کے لیے مساوی تعلیم کی مہم چلائی اور 1974ء میں قومی ہیرو قرار پائیں۔"
