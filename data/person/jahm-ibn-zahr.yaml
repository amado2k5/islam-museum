summary:
  ar: "جهم بن زحر الجعفي بطل يزيد بن المهلب؛ فتح جرجان بعد نقضها وقاده يزيد إلى حصن وجاه فعقد له وقال إن غلبت على الحياة فلا تغلبن على الموت فانتهى إلى القلعة بسلالم الجلود وقاتل من كان على بابها وكبّر خلف العدو ففتحت وقاد الأسرى إلى وادي جرجان يقتلهم حتى سالت الدماء."
  en: "Jahm ibn Zahr al-Ju'fi, Yazid ibn al-Muhallab's champion; he retook breached Jurjan, then led the hide-ladder ascent of Wajah — 'if I am spared life, let me not be spared death' — killed the gate-keepers, raised the takbir behind the enemy at mid-afternoon, and drove the captives to Wadi Jurjan where they were slaughtered till the blood ran."
