id: person/jahm-ibn-zahr
class: person
label: { ar: "جهم بن زحر الجعفي", en: "Jahm ibn Zahr al-Ju'fi", es: "Jahm ibn Zahr al-Ju'fi", fr: "Jahm ibn Zahr al-Ju'fi", ur: "جہم ابن زہر الجوفی" }
summary:
  ar: "جهم بن زحر الجعفي بطل يزيد بن المهلب؛ فتح جرجان بعد نقضها وقاده يزيد إلى حصن وجاه فعقد له وقال إن غلبت على الحياة فلا تغلبن على الموت فانتهى إلى القلعة بسلالم الجلود وقاتل من كان على بابها وكبّر خلف العدو ففتحت وقاد الأسرى إلى وادي جرجان يقتلهم حتى سالت الدماء."
  en: "Jahm ibn Zahr al-Ju'fi, Yazid ibn al-Muhallab's champion; he retook breached Jurjan, then led the hide-ladder ascent of Wajah — 'if I am spared life, let me not be spared death' — killed the gate-keepers, raised the takbir behind the enemy at mid-afternoon, and drove the captives to Wadi Jurjan where they were slaughtered till the blood ran."
  es: "Jahm ibn Zahr al-Ju'fi, campeón de Yazid ibn al-Muhallab, reconquistó Jurjan, luego dirigió el ascenso por la escalera de pieles de Wajah —'si se me perdona la vida, que no se me perdone la muerte'— mató a los guardianes de la puerta, levantó el takbir detrás del enemigo a media tarde y condujo a los cautivos a Wadi Jurjan, donde fueron masacrados hasta que la sangre corrió."
  fr: "Jahm ibn Zahr al-Ju'fi, champion de Yazid ibn al-Muhallab; il reprit la brèche de Jurjan, puis mena l'ascension de Wajah à l'aide d'échelles de cuir — « si j'ai la vie sauve, que la mort ne m'échappe pas » — tua les gardiens de la porte, leva le takbir derrière l'ennemi en milieu d'après-midi et conduisit les captifs jusqu'à Wadi Jurjan où ils furent massacrés jusqu'à ce que le sang coule."
  ur: "جہم ابن زہر الجوفی، یزید ابن المحلب کا چیمپئن؛ اس نے توڑی ہوئی جرجان کو دوبارہ حاصل کیا، پھر واجہ کی سیڑھی چڑھنے کی قیادت کی - 'اگر مجھے جان بخشی ہے تو مجھے موت سے نہ بچایا جائے' - دربانوں کو مار ڈالا، دوپہر کے وقت دشمن کے پیچھے تکبیر بلند کی، اور اسیروں کو وادی جرجان کی طرف لے گیا جہاں ان کا خون بہایا گیا۔"
  tr: "Yezid bin el-Muhallab'ın kahramanı Jahm ibn Zuhr al-Ju'fi, Jurcan'ı kırdıktan sonra esir aldı. Yezid onu bir kaleye götürdü ve prestij kazandı, bu yüzden onunla bir antlaşma yaptı ve dedi ki, 'Hayatı yenersen, ölümü yenersen.' Deri merdivenlerle kaleye ulaştı, kapıdaki herkesle savaştı ve kapı açılana kadar düşmanı kovaladı. Esirleri Jurjan vadisine götürdü, kan akana kadar öldürdü."
  id: "Jahm ibn Zuhr al-Ju'fi, pahlawan Yazid ibn al-Muhallab, menangkap Jurjan setelah melanggarnya. Yazid membawanya ke sebuah benteng dan mempromosikannya, sehingga dia membuat perjanjian dengannya dan berkata, 'Jika kamu mengalahkan hidup, jangan kalahkan kematian.' Dia sampai di benteng dengan tangga kulit, melawan siapa pun yang berada di gerbangnya, dan mengejar musuh hingga pintu itu terbuka. Dia memimpin para tawanan ke lembah Jurjan, membunuh mereka hingga darah mengalir."
