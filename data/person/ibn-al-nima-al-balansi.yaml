summary:
  ar: "أبو الحسن بن النعمة علي بن عبد الله بن خلف الأنصاري الأندلسي ثم البلنسي أحد الأعلام؛ روى عن أبي علي بن سكرة وطبقته وتصدر ببلنسية للإقراء والفقه والحديث والنحو، وكان عالماً حافظاً للفقه والتفاسير ومعاني الآثار مقدماً في علم اللسان فصيحاً مفوهاً ورعاً معظماً دمث الأخلاق انتهت إليه رياسة الفتوى والإقراء وصنف كتاباً كبيراً في شرح سنن النسائي بلغ فيه الغاية، وكان خاتمة علماء مشرق الأندلس؛ توفي في رمضان سنة سبع وستين وخمسمائة وهو في عشر الثمانين {cite:shadharat-dhahab p. 703}."
  en: "Abu al-Hasan Ibn al-Ni'ma Ali ibn Abdallah al-Ansari of al-Andalus, then of Valencia, one of the notables; he lectured at Valencia in qira'at, fiqh, hadith and grammar, wrote a large sharh of Sunan al-Nasa'i 'reaching the utmost', and was 'the last of the scholars of eastern al-Andalus'; d. Ramadan 567 in his eighties {cite:shadharat-dhahab p. 703}."
