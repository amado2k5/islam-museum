  ar: "إمام الشام وفقيهها الأول في زمانه، واختلف المؤرخون في أصل نسبته إلى الأوزاع.، وعند المسعودي مات سنة سبع وخمسين ومائة وكان منزله في الأوزاع بدمشق ولم يكن منهم وكان من سبي أهل اليمن في آخر أيام المنصور وله تسعون سنة {cite:muruj-al-dhahab p. 293} ويذكر الشيرازي أنه لم يكن من الأوزاع وأنه من سبي أهل اليمن، ونقل عن عبد الرحمن بن مهدي أنه ما كان أحد بالشام أعلم بالسنة منه {cite:tabaqat-fuqaha-abbas-1981 p. 41}"
