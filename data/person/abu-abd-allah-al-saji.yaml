summary:
  ar: "أبو عبد الله سعيد بن يزيد الساجي، زاهد يروي عنه أحمد بن أبي الحواري وغيره كلامًا في الرضا والمعرفة وأكل الحلال، وصلى بأهل طرسوس بحسب «حلية الأولياء»."
  en: "Abu Abd Allah Sa'id ibn Yazid al-Saji, an ascetic whose sayings on contentment, knowledge of God and lawful food are related by Ahmad ibn Abi al-Hawari and others; he led the people of Tarsus in prayer according to Hilyat al-Awliya."
  ur: "ابو عبد اللہ سعید بن یزید ساجی ایک زاہد تھے۔ احمد بن ابی الحواری اور دوسرے لوگ ان سے رضا، معرفت اور حلال کھانے کے بارے میں اقوال نقل کرتے ہیں۔ «حلیۃ الاولیاء» کے مطابق انہوں نے اہلِ طرسوس کو نماز پڑھائی۔"
  fr: "Abu Abd Allah Sa'id ibn Yazid al-Saji, ascète dont les paroles sur le contentement, la connaissance de Dieu et la nourriture licite sont rapportées par Ahmad ibn Abi al-Hawari et d'autres ; il dirigea la prière des habitants de Tarse selon Hilyat al-Awliya."
  es: "Abu Abd Allah Sa'id ibn Yazid al-Saji, un asceta cuyos dichos sobre la satisfacción, el conocimiento de Dios y los alimentos lícitos son relatados por Ahmad ibn Abi al-Hawari y otros; dirigió a la gente de Tarso en la oración según Hilyat al-Awliya."
  tr: "Ebu Abdullah Said bin Yazid el-Saji, Ahmed bin Ebu el-Havari ve diğerlerinin kanaat, ilim ve helal yiyecek tüketimi üzerine rivayet ettiği bir zahitti. \"Hilyat el-Evliya\"ya göre, Tarsus halkına namaz kıldırmıştır."
  id: "Abu Abdullah Saeed bin Yazid Al-Saji, seorang pertapa, yang darinya Ahmed bin Abi Al-Hawari dan lainnya meriwayatkan perkataan tentang kepuasan, ilmu, dan makan makanan yang halal. Beliau memimpin penduduk Tarsus dalam shalat, menurut “Hilyat Al-Awliya”."
