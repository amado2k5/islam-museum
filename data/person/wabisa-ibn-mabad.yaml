summary:
  ar: "صحابي أتته إلى النبي رغبةً في ألا يدع شيئاً من البر والإثم إلا سأله عنه فأجابه «استفت نفسك» ونكت بأصابعه الثلاث في صدره، وهو النصف الثاني من الحديث السابع والعشرين في الأربعين النووية؛ أخرجه أحمد والدارمي وقال النووي حديث حسن بإسناد حسن، وعند ابن رجب في طريقه المتداولة علتان — انقطاع بين الزبير بن عبد السلام وأيوب، وضعف الزبير — لكن للحديث طرقاً جيدة من حديث أبي أمامة وأبي ثعلبة الخشني تؤيده."
  en: "A Companion who came to the Prophet resolved to leave nothing of righteousness and sin unasked, and received 'consult your own soul' with three fingers poked into his chest — the second half of the twenty-seventh hadith of al-Nawawi's Forty; transmitted by Ahmad and al-Darimi and called a hasan hadith by al-Nawawi, though Ibn Rajab finds its circulated route doubly defective — a gap between al-Zubayr ibn Abd al-Salam and Ayyub, and al-Zubayr's own weakness — while sound paths from Abu Umama and Abu Tha'laba al-Khushani corroborate it."
  ur: "وہ صحابی جو نیکی اور گناہ کے بارے میں کچھ نہ چھوڑنے کے ارادے سے نبی کے پاس آیا اور اسے «اپنے دل سے پوچھو» کا جواب ملا۔"
  es: "Un Compañero que se acercó al Profeta resolvió no dejar nada de rectitud y pecado sin pedir, y recibió \"consulta tu propia alma\" con tres dedos clavados en su pecho; la segunda mitad del vigésimo séptimo hadiz de los Cuarenta de al-Nawawi; transmitido por Ahmad y al-Darimi y llamado hadiz hasan por al-Nawawi, aunque Ibn Rajab encuentra su ruta circulada doblemente defectuosa: una brecha entre al-Zubayr ibn Abd al-Salam y Ayyub, y la propia debilidad de al-Zubayr; mientras que rutas sólidas de Abu Umama y Abu Tha'laba al-Khushani lo corroboran."
  fr: "Un Compagnon venu trouver le Prophète résolu à ne rien laisser au hasard, ni en matière de droiture ni de péché, reçut pour consigne de « consulter son âme » trois doigts enfoncés dans sa poitrine – la seconde partie du vingt-septième hadith des Quarante d'al-Nawawi; transmis par Ahmad et al-Darimi et qualifié de hadith hasan par al-Nawawi, bien qu'Ibn Rajab juge sa transmission doublement défectueuse – un manque entre al-Zubayr ibn Abd al-Salam et Ayyub, et une faiblesse propre à al-Zubayr – tandis que des transmissions fiables d'Abu Umama et d'Abu Tha'laba al-Khushani le corroborent."
