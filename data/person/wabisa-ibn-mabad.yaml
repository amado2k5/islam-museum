summary:
  ar: "صحابي أتته إلى النبي رغبةً في ألا يدع شيئاً من البر والإثم إلا سأله عنه فأجابه «استفت نفسك» ونكت بأصابعه الثلاث في صدره، وهو النصف الثاني من الحديث السابع والعشرين في الأربعين النووية؛ أخرجه أحمد والدارمي وقال النووي حديث حسن بإسناد حسن، وعند ابن رجب في طريقه المتداولة علتان — انقطاع بين الزبير بن عبد السلام وأيوب، وضعف الزبير — لكن للحديث طرقاً جيدة من حديث أبي أمامة وأبي ثعلبة الخشني تؤيده."
  en: "A Companion who came to the Prophet resolved to leave nothing of righteousness and sin unasked, and received 'consult your own soul' with three fingers poked into his chest — the second half of the twenty-seventh hadith of al-Nawawi's Forty; transmitted by Ahmad and al-Darimi and called a hasan hadith by al-Nawawi, though Ibn Rajab finds its circulated route doubly defective — a gap between al-Zubayr ibn Abd al-Salam and Ayyub, and al-Zubayr's own weakness — while sound paths from Abu Umama and Abu Tha'laba al-Khushani corroborate it."
