summary:
  ar: "السلطان مراد الثاني (٨٢٤–٨٥٥هـ/١٤٢١–١٤٥١م)؛ تولى أمر الدولة بعد وفاة أبيه محمد جلبي وعمره لا يزيد على ثمانية عشر سنة، وكان محباً للجهاد والدعوة إلى الإسلام في ربوع أوروبا، معروفاً لدى رعيته بالتقوى والعدالة والشفقة. قضى على تمرد عمه مصطفى الذي دعمه الإمبراطور البيزنطي مانويل الثاني فحاصر غاليبولي، فقبض عليه مراد وقدمه للمشنقة، ثم احتل سالونيك ودخلها عنوة في مارس ٨٣٣هـ/١٤٣١م فصارت جزءاً لا يتجزأ من الدولة العثمانية، وأخضع إقليم ولاشيا بجزية سنوية وجدّد ملك الصب ولاءه للسلطان {cite:dawlat-uthmaniyya-salabi p. 77-79}. عقد صلح سيزجادن لعشر سنين مع المجريين سنة ٨٤٨هـ/١٤٤٤م وأقسم على القرآن كما أقسم ملكهم على الإنجيل، ثم نزل عن السلطنة لابنه محمد واعتزل في مغنيسيا، فلما حرض الكاردينال سيزاريني والبابا أوجين الرابع النصارى على نقض العهد عاد ليقود الجيش فنقل الأسطول الجنوي أربعين ألفاً من آسيا إلى أوروبا بدينار لكل جندي، ورفع المعاهدة المنقوضة على رأس رمح، وقاتل الملك لاديسلاس وجهاً لوجه حتى أسقطه عن جواده بضربة رمح فنُصبت وقعة وارنه {cite:dawlat-uthmaniyya-salabi p. 80-82}. ثم عاد إلى عزلته فنزل عن العرش مرة ثانية، حتى ثار الانكشارية في أدرنة فعاد ليقبض على زمام الأمر وبقي على العرش إلى آخر حياته، وكانت له الغلبة في قوصوه الثانية سنة ٨٥٢هـ/١٤٤٨م {cite:dawlat-uthmaniyya-salabi p. 82-83}. كان يعقد للشعراء مجلساً يومين في الأسبوع ويرافقونه في جهاده، ويرسل لأهلي الحرمين وبيت المقدس ثلاثة آلاف وخمس مئة دينار كل عام، وتوفي في قصر أدرنه عن عمر يناهز سبعة وأربعين عاماً ودُفن بجانب جامع مرادية ببورصة تنفيذاً لوصيته {cite:dawlat-uthmaniyya-salabi p. 83-85}."
  en: "Murad II (r. 824–855/1421–1451 CE) — crushed his uncle Mustafa's Byzantine-backed revolt, stormed Thessaloniki in 833/1431, and fathered Mehmed the Conqueror {cite:dawlat-uthmaniyya-salabi p. 77-79}. Al-Sallabi has him twice abdicating for a life of retreat at Magnesia: recalled first to smash the oath-breaking crusade at Varna in 848/1444 — the broken treaty raised on a spear-point, King Ladislas dead by his own lance — then again when the Janissaries rioted in Edirne, staying on the throne through the second Kosovo victory in 852/1448 {cite:dawlat-uthmaniyya-salabi p. 80-83}. A patron of poets who held a twice-weekly majlis for them, he sent 3,500 dinars yearly to the Haramayn and Jerusalem, died at Edirne palace aged about forty-seven, and was buried by his austere will beside the Muradiyya mosque at Bursa {cite:dawlat-uthmaniyya-salabi p. 83-85}."
