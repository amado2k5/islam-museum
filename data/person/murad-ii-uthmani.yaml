summary:
  ar: "السلطان مراد الثاني (تولى ٨٢٤هـ/١٤٢١م)؛ تولى أمر الدولة بعد وفاة أبيه محمد جلبي وعمره لا يزيد على ثمانية عشر سنة، وكان محباً للجهاد والدعوة إلى الإسلام في ربوع أوروبا، معروفاً لدى رعيته بالتقوى والعدالة والشفقة. قضى على تمرد عمه مصطفى الذي دعمه الإمبراطور البيزنطي مانويل الثاني فحاصر غاليبولي، فقبض عليه مراد وقدمه للمشنقة، ثم احتل سالونيك ودخلها عنوة في مارس ٨٣٣هـ/١٤٣١م فصارت جزءاً لا يتجزأ من الدولة العثمانية، وأخضع إقليم ولاشيا بجزية سنوية وجدّد ملك الصب ولاءه للسلطان {cite:dawlat-uthmaniyya-salabi p. 77-79}."
  en: "Murad II (r. from 824 AH/1421 CE) — crushed his uncle Mustafa's Byzantine-backed revolt, stormed Thessaloniki in 1431, and fathered Mehmed the Conqueror {cite:dawlat-uthmaniyya-salabi p. 77-79}."
