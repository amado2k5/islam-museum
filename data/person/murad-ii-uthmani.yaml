summary:
  ar: "السلطان مراد الثاني ⁦(٨٢٤–٨٥٥هـ/١٤٢١–١٤٥١م)⁩؛ تولى أمر الدولة بعد وفاة أبيه محمد جلبي وعمره لا يزيد على ثمانية عشر سنة، وكان محباً للجهاد والدعوة إلى الإسلام في ربوع أوروبا، معروفاً لدى رعيته بالتقوى والعدالة والشفقة. قضى على تمرد عمه مصطفى الذي دعمه الإمبراطور البيزنطي مانويل الثاني فحاصر غاليبولي، فقبض عليه مراد وقدمه للمشنقة، ثم احتل سالونيك ودخلها عنوة في مارس ٨٣٣هـ/١٤٣١م فصارت جزءاً لا يتجزأ من الدولة العثمانية، وأخضع إقليم ولاشيا بجزية سنوية وجدّد ملك الصب ولاءه للسلطان {cite:dawlat-uthmaniyya-salabi p. 77-79}. عقد صلح سيزجادن لعشر سنين مع المجريين سنة ٨٤٨هـ/١٤٤٤م وأقسم على القرآن كما أقسم ملكهم على الإنجيل، ثم نزل عن السلطنة لابنه محمد واعتزل في مغنيسيا، فلما حرض الكاردينال سيزاريني والبابا أوجين الرابع النصارى على نقض العهد عاد ليقود الجيش فنقل الأسطول الجنوي أربعين ألفاً من آسيا إلى أوروبا بدينار لكل جندي، ورفع المعاهدة المنقوضة على رأس رمح، وقاتل الملك لاديسلاس وجهاً لوجه حتى أسقطه عن جواده بضربة رمح فنُصبت وقعة وارنه {cite:dawlat-uthmaniyya-salabi p. 80-82}. ثم عاد إلى عزلته فنزل عن العرش مرة ثانية، حتى ثار الانكشارية في أدرنة فعاد ليقبض على زمام الأمر وبقي على العرش إلى آخر حياته، وكانت له الغلبة في قوصوه الثانية سنة ٨٥٢هـ/١٤٤٨م {cite:dawlat-uthmaniyya-salabi p. 82-83}. كان يعقد للشعراء مجلساً يومين في الأسبوع ويرافقونه في جهاده، ويرسل لأهلي الحرمين وبيت المقدس ثلاثة آلاف وخمس مئة دينار كل عام، وتوفي في قصر أدرنه عن عمر يناهز سبعة وأربعين عاماً ودُفن بجانب جامع مرادية ببورصة تنفيذاً لوصيته {cite:dawlat-uthmaniyya-salabi p. 83-85}."
  en: "Murad II (r. 824–855/1421–1451 CE) — crushed his uncle Mustafa's Byzantine-backed revolt, stormed Thessaloniki in 833/1431, and fathered Mehmed the Conqueror {cite:dawlat-uthmaniyya-salabi p. 77-79}. Al-Sallabi has him twice abdicating for a life of retreat at Magnesia: recalled first to smash the oath-breaking crusade at Varna in 848/1444 — the broken treaty raised on a spear-point, King Ladislas dead by his own lance — then again when the Janissaries rioted in Edirne, staying on the throne through the second Kosovo victory in 852/1448 {cite:dawlat-uthmaniyya-salabi p. 80-83}. A patron of poets who held a twice-weekly majlis for them, he sent 3,500 dinars yearly to the Haramayn and Jerusalem, died at Edirne palace aged about forty-seven, and was buried by his austere will beside the Muradiyya mosque at Bursa {cite:dawlat-uthmaniyya-salabi p. 83-85}."
  ur: "عثمانی سلطان جس کے عہد میں قسطنطنیہ، تھیسالونیکی، وارنا اور کوسوو کی مہمات ہوئیں؛ ادرنہ اور بورصہ میں تعمیرات بھی اس سے منسوب ہیں۔ {cite:dawlat-uthmaniyya-salabi}"
  es: "Murad II (r. 824–855/1421–1451 d. C.) — aplastó la revuelta de su tío Mustafa, respaldada por los bizantinos, tomó Salónica en 833/1431 y fue padre de Mehmed el Conquistador {cite:dawlat-uthmaniyya-salabi p. 77-79}. Al-Sallabi lo relata abdicando dos veces para retirarse a Magnesia: primero, para sofocar la cruzada que rompió el juramento en Varna en 848/1444 —el tratado roto fue alzado en la punta de una lanza, y el rey Ladislao murió por su propia lanza— y luego, cuando los jenízaros se amotinaron en Edirne, permaneciendo en el trono durante la segunda victoria de Kosovo en 852/1448 {cite:dawlat-uthmaniyya-salabi p. 80-83}. Mecenas de poetas, para quienes celebraba un majlis dos veces por semana, enviaba 3.500 dinares anualmente a los Haramayn y Jerusalén, murió en el palacio de Edirne a la edad de unos cuarenta y siete años, y fue enterrado según su austero testamento junto a la mezquita Muradiyya en Bursa {cite:dawlat-uthmaniyya-salabi p. 83-85}."
  fr: "Murad II (r. 824–855/1421–1451) réprima la révolte de son oncle Mustafa, soutenue par les Byzantins, prit d'assaut Thessalonique en 833/1431 et fut le père de Mehmed le Conquérant (voir: Dawlat-Uthmaniyya-Salabi, p. 77-79). Al-Sallabi rapporte qu'il abdiqua à deux reprises pour se retirer à Magnésie: d'abord rappelé pour écraser la croisade violant le serment à Varna en 848/1444 – le traité rompu fut brandi au fer rouge, le roi Ladislas tué par sa propre lance – puis de nouveau lors de la révolte des janissaires à Edirne, restant sur le trône jusqu'à la seconde victoire du Kosovo en 852/1448 (voir: Dawlat-Uthmaniyya-Salabi, p. 80-83). Mécène des poètes qui tenait un majlis deux fois par semaine pour eux, il envoyait 3 500 dinars par an au Haramayn et à Jérusalem, mourut au palais d'Edirne à l'âge d'environ quarante-sept ans et fut enterré selon son testament austère à côté de la mosquée Muradiyya à Bursa {cite:dawlat-uthmaniyya-salabi p. 83-85}."
  tr: "Sultan Murad II (824–855 Hicri / 1421–1451 M.S.), babası Muhammed Çelebi'nin ölümünden sonra devleti devraldı; henüz on sekiz yaşındayken öldü. Avrupa'da cihat ve İslami savunuculuğu severdi; tebaası arasında dindarlık, adalet ve merhametle tanınırdı. Amcası Mustafa'nın isyanını bastırdı; Bizans İmparatoru II. Manuel tarafından desteklendi; Manuel Gelibolu'yu kuşattı, Murad tarafından tutuklandı ve idam edildi. Daha sonra Selanik'i işgal etti ve Mart 833 Hicri / 1431 M.S.'de zorla girerek burayı Osmanlı İmparatorluğu'nun ayrılmaz bir parçası haline getirdi. Eflak bölgesine yıllık bir haraç verdi ve Sub Kralı'nın Sultan'a olan sadakatini yeniledi {cite:Dawlat-uthmaniyya-Salabi s. 77-79}. Szygadin, 848 Hicri/1444 M.S.'de Macarlarla on yıllık bir barış antlaşması yaptı ve tıpkı krallarının İncil'e yemin ettiği gibi Kur'an'a yemin etti. Daha sonra sultanlığı oğlu Muhammed'e bıraktı ve Magnesia'ya çekildi. Kardinal Cesarini ve Papa IV. Eugene Hristiyanları antlaşmayı bozmaya çağırdığında, orduya liderlik etmek üzere geri döndü. Cenova filosunu Asya'dan Avrupa'ya asker başına bir dinar karşılığında nakletti, iptal edilmiş antlaşmayı mızrakla dikti ve Kral Ladislaus ile yüz yüze savaştı; ta ki Ladislaus onu mızrak darbesiyle atından düşürene kadar; bu da Warne Muharebesi'ne yol açtı {cite:dawlat-uthmaniyya-salabi, s. 80-82}. Daha sonra inzivaya çekildi ve tahttan bir kez daha çekildi; ta ki Edirne'de Yeniçeriler isyan edene kadar kontrolü yeniden ele geçirip hayatının sonuna kadar tahtta kaldı. İkinci Qosu'sunda 852 Hicri/1448 M.S. {atıf:dawlat-uthmaniyya-salabi s. 82-83} kazandı. Haftada iki gün şairler meclisleri düzenledi ve mücadelesine eşlik etti; her yıl İki Kutsal Cami ve Kudüs halkına üç bin beş yüz dinar gönderdi. Kırk yedi yaşında Edirne Sarayı'nda öldü ve vasiyetinin yerine getirilmesiyle Bursa'daki Muradiya Camii'nin yanına defnedildi {atıf:dawlat-uthmaniyya-salabi s. 83-85}."
  id: "Sultan Murad II (824–855 H / 1421–1451 M) mengambil alih pemerintahan setelah kematian ayahnya Muhammad Çelebi saat usianya belum lebih dari delapan belas tahun. Ia menyukai jihad dan advokasi Islam di seluruh Eropa, dikenal di kalangan rakyatnya karena kesalehan, keadilan, dan belas kasih. Ia menumpas pemberontakan pamannya Mustafa, yang didukung oleh Kaisar Bizantium Manuel II, yang mengepung Gallipoli, ditangkap oleh Murad, dan dieksekusi. Ia kemudian menduduki Thessaloniki dan memasuki wilayah itu dengan paksa pada Maret 833 H / 1431 M, menjadikannya bagian integral dari Kekaisaran Ottoman. Ia mengenakan upeti tahunan di wilayah Wallachia dan memperbarui kesetiaan Raja Sub kepada Sultan {cite:Dawlat-uthmaniyya-Salabi hlm. 77-79}. Szygadin membuat perjanjian damai sepuluh tahun dengan bangsa Hungaria pada tahun 848 H/1444 M, bersumpah pada Al-Qur'an tepat seperti yang disumpah oleh raja mereka atas Injil. Ia kemudian menyerahkan kesultanan kepada putranya Muhammad dan mundur ke Magnesia. Ketika Kardinal Cesarini dan Paus Eugene IV mendesak umat Kristen untuk melanggar perjanjian, ia kembali memimpin tentara. Ia memindahkan armada Genoa sebanyak empat puluh ribu dari Asia ke Eropa dengan harga satu dinar per prajurit, mengangkat perjanjian yang dibatalkan dengan tombak, dan bertarung langsung dengan Raja Ladislaus hingga ia menjatuhkannya dari kudanya dengan pukulan tombak, yang mengakibatkan Pertempuran Warne {cite:dawlat-uthmaniyya-salabi, hlm. 80-82}. Ia kemudian kembali ke pengasingan dan turun tahta sekali lagi, hingga para Janissari memberontak di Edirne, merebut kembali kekuasaan dan tetap di tahta hingga akhir hayatnya. Ia menang dalam Qosu keduanya pada tahun 852 H/1448 M {cite:dawlat-uthmaniyya-salabi hlm. 82-83}. Ia mengadakan dewan penyair dua hari seminggu dan mendampinginya dalam perjuangannya, mengirimkan tiga ribu lima ratus dinar setiap tahun kepada orang-orang Dua Masjid Suci dan Yerusalem. Ia meninggal di Istana Edirne pada usia empat puluh tujuh tahun dan dimakamkan di sebelah Masjid Muradiya di Bursa sebagai pemenuhan wasiatnya {cite:dawlat-uthmaniyya-salabi hlm. 83-85}."
