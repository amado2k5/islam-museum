label:
  ar: الملك المنصور عمر بن علي بن رسول
  en: al-Malik al-Mansur Umar ibn Ali ibn Rasul
summary:
  ar: "الملك المنصور عمر بن علي بن رسول، ثاني ملوك بني رسول باليمن؛ ولي بعد أبيه سنة 629هـ، فلما توفي الكامل بمصر سنة 635هـ وشغل بنو أيوب بالفتنة بينهم استغلظ سلطانه باليمن وتلقب المنصور ومنع الأتاوة التي كان يبعث بها إلى مصر، وهمّ بثورة المتوكل أحمد بن حسين الزيدي الملقب الموطىء فحاصره بحصن ملا، ثم وثب عليه جماعة من مماليكه بممالأة بني أخيه حسن فقتلوه سنة 648هـ."
  en: "Al-Malik al-Mansur Umar ibn Ali ibn Rasul, second Rasulid king of Yemen; succeeding his father in 629 AH, when al-Kamil of Egypt died in 635 and the Ayyubids were consumed by their feuds his sultanate grew strong — he took the laqab al-Mansur and withheld the atawa sent to Egypt, besieged the rising Zaydi imam al-Mutawakkil Ahmad ibn al-Husayn at Hisn Mala, then his own mamluks colluding with his nephews fell on him and killed him in 648."
