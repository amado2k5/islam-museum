class: person
label:
  ar: الملك المنصور عمر بن علي بن رسول
  en: al-Malik al-Mansur Umar ibn Ali ibn Rasul
  es: "al-Malik al-Mansur Umar ibn Ali ibn Rasul"
  fr: "al-Malik al-Mansur Umar ibn Ali ibn Rasul"
  ur: "المالک المنصور عمر بن علی ابن رسول"
summary:
  ar: "الملك المنصور عمر بن علي بن رسول، ثاني ملوك بني رسول باليمن؛ ولي بعد أبيه سنة 629هـ، فلما توفي الكامل بمصر سنة 635هـ وشغل بنو أيوب بالفتنة بينهم استغلظ سلطانه باليمن وتلقب المنصور ومنع الأتاوة التي كان يبعث بها إلى مصر، وهمّ بثورة المتوكل أحمد بن حسين الزيدي الملقب الموطىء فحاصره بحصن ملا، ثم وثب عليه جماعة من مماليكه بممالأة بني أخيه حسن فقتلوه سنة 648هـ."
  en: "Al-Malik al-Mansur Umar ibn Ali ibn Rasul, second Rasulid king of Yemen; succeeding his father in 629 AH, when al-Kamil of Egypt died in 635 and the Ayyubids were consumed by their feuds his sultanate grew strong — he took the laqab al-Mansur and withheld the atawa sent to Egypt, besieged the rising Zaydi imam al-Mutawakkil Ahmad ibn al-Husayn at Hisn Mala, then his own mamluks colluding with his nephews fell on him and killed him in 648."
  es: "Al-Malik al-Mansur Umar ibn Ali ibn Rasul, segundo rey rasulí de Yemen; sucedió a su padre en el año 629 de la Hégira, cuando al-Kamil de Egipto murió en el año 635 y los ayubíes fueron consumidos por sus disputas, su sultanato se fortaleció: tomó el laqab al-Mansur y retuvo los atawa enviados a Egipto, sitió al creciente imán zaidí al-Mutawakkil Ahmad ibn al-Husayn en Hisn Mala, luego sus propios mamelucos, en connivencia con sus sobrinos, lo atacaron y lo mataron en el año 648."
  fr: "Al-Malik al-Mansur Umar ibn Ali ibn Rasul, deuxième roi rasulide du Yémen; succédant à son père en 629 AH, lorsque al-Kamil d'Égypte mourut en 635 et que les Ayyoubides furent consumés par leurs querelles, son sultanat devint fort — il prit le laqab al-Mansur et retint l'atawa envoyée en Égypte, assiégea l'imam zaydite montant al-Mutawakkil Ahmad ibn al-Husayn à Hisn Mala, puis ses propres mamelouks, en collusion avec ses neveux, l'attaquèrent et le tuèrent en 648."
  ur: "المالک المنصور عمر بن علی ابن رسول، یمن کا دوسرا رسول بادشاہ؛ 629 ہجری میں اپنے والد کے بعد جب 635 میں مصر کے الکامل کی وفات ہوئی اور ایوبیوں کو ان کے عداوتوں سے بھسم کر دیا گیا تو اس کی سلطنت مضبوط ہو گئی - اس نے لقب المنصور کو لے لیا اور مصر بھیجے جانے والے عطوا کو روک لیا، ابھرتے ہوئے زیدی امام المتوکل کا محاصرہ کر لیا، پھر اس کے اپنے مالا ابن المنصور احمد بن ابن المومنین کا محاصرہ کر لیا۔ اپنے بھتیجوں کے ساتھ مل کر اس پر گرا اور 648 میں اسے قتل کر دیا۔"
