summary:
  ar: "عالمة ومعلمة أسترالية في سيدني، اعتنقت الإسلام سنة 1989 وقضت أكثر من خمسة وعشرين عاما في طلب العلم الشرعي، فحصلت على ماجستير في الفقه وشهادات في العربية والفقه وأصوله وإجازة في التجويد وحفظت القرآن؛ من أوائل العالمات المؤهلات في المجلس الوطني للأئمة في أستراليا، وتدرّس العلوم الشرعية عبر الإنترنت للنساء منذ سنة 2020، وتُعرف بكنيتها أم جمال الدين واسمها منى باركن."
  en: "Australian scholar and teacher based in Sydney who embraced Islam in 1989 and spent more than twenty-five years studying the Shariah sciences, earning a Master's in Fiqh, degrees in Arabic, Fiqh and Usul al-Fiqh, an ijazah in Tajweed, and memorising the Quran. Among the first qualified female scholars at the Australian National Imams Council, she has taught Shariah classes online to women since 2020. She is known by her kunya Umm Jamal ud-Din; her name is Mouna Parkin."
  ur: "آسٹریلوی عالمہ اور معلمہ، سڈنی میں مقیم، جنہوں نے 1989 میں اسلام قبول کیا اور پچیس سال سے زائد عرصہ علومِ شرعیہ کی طلب میں گزارا؛ فقہ میں ماسٹرز، عربی، فقہ اور اصول فقہ میں ڈگریاں، تجوید میں اجازہ اور حفظِ قرآن مکمل کیا؛ آسٹریلین نیشنل امامز کونسل کی اولین اہل خواتین عالمات میں شامل، 2020 سے خواتین کو آن لائن شرعی علوم پڑھا رہی ہیں۔ وہ اپنی کنیت ام جمال الدین سے معروف ہیں؛ ان کا نام مونا پارکن ہے۔"
  es: "Académica y docente australiana residente en Sídney, se convirtió al islam en 1989 y dedicó más de veinticinco años al estudio de la sharia, obteniendo una maestría en fiqh, títulos en árabe, fiqh y usul al-fiqh, una ijazah en tajweed y memorizando el Corán. Fue una de las primeras mujeres académicas cualificadas en el Consejo Nacional de Imanes de Australia y desde 2020 imparte clases de sharia en línea para mujeres. Se la conoce por su kunya Umm Jamal ud-Din; su nombre real es Mouna Parkin."
  fr: "Érudite et enseignante australienne installée à Sydney, elle s'est convertie à l'islam en 1989 et a consacré plus de vingt-cinq ans à l'étude des sciences islamiques (charia). Elle est titulaire d'une maîtrise en fiqh, de diplômes en arabe, en fiqh et en usul al-fiqh, d'une ijazah en tajwid et a mémorisé le Coran. Comptant parmi les premières femmes érudites qualifiées au sein du Conseil national des imams d'Australie, elle dispense des cours de charia en ligne aux femmes depuis 2020. Elle est connue sous son nom de famille (kunya) Umm Jamal ud-Din; son nom est Mouna Parkin."
  tr: "Sydney'de Avustralyalı bir akademisyen ve öğretmen olan Sher, 1989'da İslam'a geçti ve yirmi beş yıldan fazla bir süre İslami bilgi aradı. Hukuk alanında yüksek lisans, Arapça, fıkıh ve ilkeleri sertifikaları, Tacvide lisansı ve Kur'an'ı ezberledi; Avustralya Ulusal İmamlar Konseyi'nde ilk nitelikli alimler arasındaydı. 2020'den beri kadınlar için İslami bilimleri çevrimiçi olarak öğretmektedir. Kunya um Cemalddin olarak bilinir ve adı Mona Parkin'dir."
  id: "Sebagai ulama dan pengajar Australia di Sydney, ia memeluk Islam pada tahun 1989 dan menghabiskan lebih dari dua puluh lima tahun untuk mencari pengetahuan Islam. Ia meraih gelar master dalam bidang hukum, sertifikat dalam bahasa Arab, juri, dan prinsip-prinsipnya, lisensi dalam bahasa Tajweed, serta menghafal Al-Qur'an; ia termasuk di antara ulama pertama yang memenuhi syarat di Dewan Nasional Imam di Australia. Sejak 2020, ia telah mengajar ilmu Islam secara daring untuk perempuan. Ia dikenal dengan nama kunya um Jamal al-Din, dan namanya adalah Mona Parkin."
