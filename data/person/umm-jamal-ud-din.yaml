summary:
  ar: "عالمة ومعلمة أسترالية في سيدني، اعتنقت الإسلام سنة 1989 وقضت أكثر من خمسة وعشرين عاما في طلب العلم الشرعي، فحصلت على ماجستير في الفقه وشهادات في العربية والفقه وأصوله وإجازة في التجويد وحفظت القرآن؛ من أوائل العالمات المؤهلات في المجلس الوطني للأئمة في أستراليا، وتدرّس العلوم الشرعية عبر الإنترنت للنساء منذ سنة 2020، وتُعرف بكنيتها أم جمال الدين واسمها منى باركن."
  en: "Australian scholar and teacher based in Sydney who embraced Islam in 1989 and spent more than twenty-five years studying the Shariah sciences, earning a Master's in Fiqh, degrees in Arabic, Fiqh and Usul al-Fiqh, an ijazah in Tajweed, and memorising the Quran. Among the first qualified female scholars at the Australian National Imams Council, she has taught Shariah classes online to women since 2020. She is known by her kunya Umm Jamal ud-Din; her name is Mouna Parkin."
  ur: "آسٹریلوی عالمہ اور معلمہ، سڈنی میں مقیم، جنہوں نے 1989 میں اسلام قبول کیا اور پچیس سال سے زائد عرصہ علومِ شرعیہ کی طلب میں گزارا؛ فقہ میں ماسٹرز، عربی، فقہ اور اصول فقہ میں ڈگریاں، تجوید میں اجازہ اور حفظِ قرآن مکمل کیا؛ آسٹریلین نیشنل امامز کونسل کی اولین اہل خواتین عالمات میں شامل، 2020 سے خواتین کو آن لائن شرعی علوم پڑھا رہی ہیں۔ وہ اپنی کنیت ام جمال الدین سے معروف ہیں؛ ان کا نام مونا پارکن ہے۔"
