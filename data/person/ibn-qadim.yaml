id: person/ibn-qadim
class: person
label: { ar: "ابن قادم", en: "Ibn Qadim" }
summary:
  ar: "أبو جعفر محمد بن قادم صاحب الفراء، كان يعلم المعتز قبل الخلافة فلما ولي الخلافة بعث إليه فجاءه الرسول وهو في منزله شيخ كبير فقال رسول أمير المؤمنين فقال أليس أمير المؤمنين ببغداد يعني المستعين قال لا قد ولي المعتز، وكان المعتز قد حقد عليه عسف تأديبه له فخشي من بادرته فقال لعياله عليكم السلام وخرج ولم يرجع إليهم وهذا سنة إحدى وخمسين ومائتين، وله كتاب الكافي في النحو وكتاب غريب الحديث {cite:fihrist-ibn-al-nadim p. 201-202}."
  en: "al-Mu'tazz's tutor who vanished in 251 fearing his former pupil's revenge {cite:fihrist-ibn-al-nadim}"
