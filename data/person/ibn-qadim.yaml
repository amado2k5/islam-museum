label: { ar: "ابن قادم", en: "Ibn Qadim", es: "Ibn Qadim", fr: "Ibn Qadim", ur: "ابن قدیم" }
summary:
  ar: "أبو جعفر محمد بن قادم صاحب الفراء، كان يعلم المعتز قبل الخلافة فلما ولي الخلافة بعث إليه فجاءه الرسول وهو في منزله شيخ كبير فقال رسول أمير المؤمنين فقال أليس أمير المؤمنين ببغداد يعني المستعين قال لا قد ولي المعتز، وكان المعتز قد حقد عليه عسف تأديبه له فخشي من بادرته فقال لعياله عليكم السلام وخرج ولم يرجع إليهم وهذا سنة إحدى وخمسين ومائتين، وله كتاب الكافي في النحو وكتاب غريب الحديث {cite:fihrist-ibn-al-nadim p. 201-202}."
  en: "al-Mu'tazz's tutor who vanished in 251 fearing his former pupil's revenge {cite:fihrist-ibn-al-nadim}"
  es: "El tutor de al-Mu'tazz que desapareció en 251 temiendo la venganza de su antiguo alumno {cite:fihrist-ibn-al-nadim}"
  fr: "Le tuteur d'al-Mu'tazz qui a disparu en 251 craignant la vengeance de son ancien élève {cite:fihrist-ibn-al-nadim}"
  ur: "المعتز کا ٹیوٹر جو 251 میں اپنے سابق شاگرد کے انتقام کے خوف سے غائب ہو گیا تھا۔"
  tr: "El-Ferra'nın yazarı Ebu Ca'fer Muhammed bin Kadim, el-Mu'tazı halifelikten önce tanıyordu. Halifeliği üstlendiğinde onu çağırdı. Peygamber, evindeyken bir yaşlıydı ve şöyle dedi: İnananların Komutanının Elçisi, 'Bağdat'taki Müstehmin Komutanı Musta'in değil mi?' dedi. El-Mutazz, 'Hayır, tahta atanmış kişi olarak atandı.' disiplinden o kadar hoşnut değildi ki, inisiyasyonundan korktu. Ailesine 'Selamünaleyküm' dedi ve onlara dönmeden ayrıldı. Bu, 251 H yılındaydı. Ayrıca dilbilgisi üzerine 'El-Kafi' ve 'Garib al-Hadis' (Harib al-Hadis' kitabı, s. 201-202) yazdı."
  id: "Abu Ja'far Muhammad ibn Qadim, penulis Al-Farra', mengenal Al-Mu'tazz sebelum kekhalifahan. Ketika ia mengambil alih kekhalifahan, ia memanggilnya. Nabi, saat berada di rumahnya, adalah seorang tetua dan berkata: Rasul Panglima Orang Beriman berkata, 'Bukankah Panglima Orang Beriman di Baghdad, maksudnya Musta'in?' Al-Mu'tazz menjawab, 'Tidak, ia telah diangkat sebagai orang yang diangkat menjadi tahta.' Al-Mu'tazz sangat membenci disiplinnya sehingga takut akan inisiasinya. Ia berkata kepada keluarganya, 'Salam sejahtera,' dan pergi tanpa kembali kepada mereka. Ini terjadi pada tahun 251 H. Ia juga menulis 'Al-Kafi' tentang tata bahasa dan 'Gharib al-Hadith' (buku 'Gharib al-Hadith', hlm. 201-202)."
