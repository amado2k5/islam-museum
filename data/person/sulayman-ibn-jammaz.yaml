summary:
  ar: "أبو الربيع سليمان بن مسلم بن جماز الزهري المدني، راوي قراءة أبي جعفر يزيد بن القعقاع؛ توفي بُعيد سنة 170هـ، ويقول ابن الجزري إنه مقرئ جليل ضابط نبيل مقصود في قراءة أبي جعفر ونافع، روى القراءة عرضاً عنهما {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  en: "Abu al-Rabi' Sulayman ibn Muslim ibn Jammaz al-Zuhri of Medina, transmitter of the reading of Abu Ja'far Yazid ibn al-Qa'qa'; he died shortly after 170 AH. Ibn al-Jazari calls him an eminent, exact and noble reader, sought out for the readings of Abu Ja'far and Nafi', which he took by reading them to both {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  ur: "ابو الربیع سلیمان بن مسلم بن جماز زہری مدنی، ابو جعفر یزید بن القعقاع کی قراءت کے راوی؛ 170ھ کے کچھ بعد فوت ہوئے۔ ابن الجزری انہیں جلیل، ضابط اور نبیل قاری بتاتے ہیں جن کے پاس ابو جعفر اور نافع کی قراءت کے لیے آیا جاتا تھا، اور انہوں نے دونوں پر پڑھ کر قراءت لی {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  es: "Abu al-Rabi' Sulayman ibn Muslim ibn Jammaz al-Zuhri de Medina, transmisor de la lectura de Abu Ja'far Yazid ibn al-Qa'qa'; murió poco después del año 170 AH. Ibn al-Jazari lo llama un lector eminente, exacto y noble, buscado por las lecturas de Abu Ja'far y Nafi', que tomó leyéndolas a ambos {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  fr: "Abu al-Rabi' Sulayman ibn Muslim ibn Jammaz al-Zuhri de Médine, transmetteur de la lecture d'Abu Ja'far Yazid ibn al-Qa'qa'; il mourut peu après 170 AH. Ibn al-Jazari le décrit comme un lecteur éminent, précis et noble, recherché pour les lectures d'Abu Ja'far et de Nafi', qu'il reçut en les lisant aux deux {cite:nashr-dahman-damascus-1345-v1 p. 189}."
