summary:
  ar: "قاضي القضاة تاج الدين عبد الوهاب بن المؤرخ شهاب الدين ابن عربشاه الحنفي، ولد سنة ثلاث عشرة وثمانمائة؛ كان في ابتداء أمره شاهداً وبلغ في صناعة الشهادة غاية الدهاء، وكان فقيراً فحصلت له ثروة وجاه، ونظم في مذهب الحنفية كتاباً كبيراً، وولى قضاء قضاة دمشق في رجب سنة أربع وثمانين وثمانمائة ثم عزل في شوال سنة خمس وتسعين، فسافر إلى مصر فولي مشيخة الصرغتمشية بها إلى أن توفي في خامس عشر رجب سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 421-422}."
  en: "Son of the historian Ibn 'Arabshah, b. 813 — rose from a professional witness ('utter cunning in the craft of testimony') and poverty to wealth and rank, composed a large verse work on Hanafi doctrine, was chief qadi of Damascus Rajab 884–Shawwal 895, then held the Sarghitmishiyya shaykhate in Cairo until his death 15 Rajab 901 {cite:shadharat-dhahab p. 421-422}."
  fr: "Fils de l'historien Ibn 'Arabshah, né en 813 — passé de témoin professionnel (« d'une habileté consommée dans l'art du témoignage ») et de la pauvreté à la richesse et au rang, il composa un grand ouvrage en vers sur la doctrine hanafite, fut grand cadi de Damas de rajab 884 à shawwal 895, puis tint la direction de la Sarghitmishiyya au Caire jusqu'à sa mort le 15 rajab 901 {cite:shadharat-dhahab p. 421-422}."
  es: "Hijo del historiador Ibn 'Arabshah, n. 813 — pasó de ser un testigo profesional ('sumamente hábil en el arte del testimonio') y de la pobreza a la riqueza y el rango, compuso una gran obra en verso sobre la doctrina Hanafi, fue cadí principal de Damasco desde Rajab 884 hasta Shawwal 895, y luego ocupó el shaykhate Sarghitmishiyya en El Cairo hasta su muerte el 15 de Rajab 901 {cite:shadharat-dhahab p. 421-422}."
  ur: "مؤرخ ابن عرب شاہ کے بیٹے، بی۔ 813 - ایک پیشہ ور گواہ ⁦('گواہی کے ہنر میں سراسر چالاک')⁩ اور غریبی سے دولت اور عہدے تک بڑھے، حنفی عقیدہ پر ایک بڑی آیت کا کام مرتب کیا، رجب 884-شوال 895 میں دمشق کے چیف قادی تھے، پھر 1019ء میں سرغتمیشیہ شیخ کی وفات تک اس عہدے پر فائز رہے۔ {حوالہ: شدھارت ذہاب ص۔ 421-422}۔"
  tr: "Başhakim Tecddin Abdülvahab ibn Muarrikh Şihab el-Din ibn Arabshah el-Hanafi, 13800 yılında doğdu. Hayatının başında şahitlik yaptı ve şahitlik sanatında en yüksek seviyeye ulaştı. Fakirdi, ancak zenginlik ve itibar kazandı. Hanefi mezhebi üzerine büyük bir kitap yazdı. 884 yılının Receb ayında Şam Başhakimine atandı, ardından 95 yılının Şevval ayında görevden alındı. Mısır'a gitti ve orada Sargatmişiyye Şeyhi olarak atandı ve 901 yılının Receb ayının on beşinci gününde vefat etti. {Kaynak: Şadharat-Dhaba s. 421-422}"
  id: "Ketua Mahkamah Agung Taj al-Din Abd al-Wahhab ibn al-Muarrikh Shihab al-Din ibn Arabshah al-Hanafi lahir pada tahun tiga belas delapan ratus. Beliau adalah seorang saksi sejak awal kehidupannya dan mencapai tingkat keahlian tertinggi dalam seni bersaksi. Beliau miskin, tetapi memperoleh kekayaan dan prestise. Beliau menyusun sebuah buku besar tentang mazhab Hanafi. Beliau diangkat menjadi Ketua Mahkamah Agung Damaskus pada bulan Rajab tahun delapan ratus delapan puluh empat, kemudian diberhentikan pada bulan Syawal tahun sembilan puluh lima. Beliau melakukan perjalanan ke Mesir dan diangkat menjadi Syekh Sarghatmishiyya di sana hingga wafat pada tanggal lima belas Rajab tahun sembilan ratus satu. {cite:shadharat-dhahab hlm. 421-422}."
