summary:
  ar: "قاضي القضاة تاج الدين عبد الوهاب بن المؤرخ شهاب الدين ابن عربشاه الحنفي، ولد سنة ثلاث عشرة وثمانمائة؛ كان في ابتداء أمره شاهداً وبلغ في صناعة الشهادة غاية الدهاء، وكان فقيراً فحصلت له ثروة وجاه، ونظم في مذهب الحنفية كتاباً كبيراً، وولى قضاء قضاة دمشق في رجب سنة أربع وثمانين وثمانمائة ثم عزل في شوال سنة خمس وتسعين، فسافر إلى مصر فولي مشيخة الصرغتمشية بها إلى أن توفي في خامس عشر رجب سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 421-422}."
  en: "Son of the historian Ibn 'Arabshah, b. 813 — rose from a professional witness ('utter cunning in the craft of testimony') and poverty to wealth and rank, composed a large verse work on Hanafi doctrine, was chief qadi of Damascus Rajab 884–Shawwal 895, then held the Sarghitmishiyya shaykhate in Cairo until his death 15 Rajab 901 {cite:shadharat-dhahab p. 421-422}."
