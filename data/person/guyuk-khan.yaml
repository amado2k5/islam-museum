summary:
  ar: "كيوك الخان الأعظم الثالث للإمبراطورية المغولية، وابن أوكتاي. بعد نيابة أمه توراكينا بعد موت أبيه سنة 639هـ/1241م، انتُخب خاناً سنة 644هـ/1246م، وحكم حتى موته المفاجئ سنة 646هـ/1248م وهو في طريقه غرباً. كان عدواً لباتو منذ حملة روسيا، وردّ بازدراء رسل الإسماعيلية النزارية سنة 644هـ/1246م، ولا مقالة خاصة به في دائرة المعارف الإسلامية، فيعتمد هذا السجل على إشارات متفرقة في مقالاتها {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
  en: "Guyuk was the third Great Khan of the Mongol Empire and a son of Ogedei. After his mother Toregene ruled as regent following his father's death in 639/1241, he was acclaimed Great Khan in 644/1246 and reigned until his sudden death in 646/1248 on a journey west. He had been an enemy of Batu since the Russian campaign and, in 644/1246, dismissed Nizari Ismaili envoys with contempt. The Encyclopaedia of Islam has no article under his name, so the record draws on passages in several of its articles {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
  ur: "گیوک منگول سلطنت کے تیسرے عظیم خان اور اوگدائی کے بیٹے تھے۔ باپ کی وفات 639ھ/1241ء کے بعد ان کی والدہ تورگینہ نائب رہیں؛ 644ھ/1246ء میں وہ عظیم خان تسلیم ہوئے اور 646ھ/1248ء میں مغرب کے سفر کے دوران اچانک وفات تک حکومت کی۔ روس کی مہم سے وہ باتو کے دشمن تھے، اور 644ھ/1246ء میں انہوں نے نزاری اسماعیلی سفیروں کو حقارت سے لوٹا دیا۔ دائرۃ المعارف الاسلامیہ میں ان کے نام سے الگ مضمون نہیں، اس لیے یہ اندراج اس کے کئی مضامین کے متفرق حوالوں پر مبنی ہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
