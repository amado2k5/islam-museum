summary:
  ar: "كيوك الخان الأعظم الثالث للإمبراطورية المغولية، وابن أوكتاي. بعد نيابة أمه توراكينا بعد موت أبيه سنة 639هـ/1241م، انتُخب خاناً سنة 644هـ/1246م، وحكم حتى موته المفاجئ سنة 646هـ/1248م وهو في طريقه غرباً. كان عدواً لباتو منذ حملة روسيا، وردّ بازدراء رسل الإسماعيلية النزارية سنة 644هـ/1246م، ولا مقالة خاصة به في دائرة المعارف الإسلامية، فيعتمد هذا السجل على إشارات متفرقة في مقالاتها {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
  en: "Guyuk was the third Great Khan of the Mongol Empire and a son of Ogedei. After his mother Toregene ruled as regent following his father's death in 639/1241, he was acclaimed Great Khan in 644/1246 and reigned until his sudden death in 646/1248 on a journey west. He had been an enemy of Batu since the Russian campaign and, in 644/1246, dismissed Nizari Ismaili envoys with contempt. The Encyclopaedia of Islam has no article under his name, so the record draws on passages in several of its articles {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
  ur: "گیوک منگول سلطنت کے تیسرے عظیم خان اور اوگدائی کے بیٹے تھے۔ باپ کی وفات 639ھ/1241ء کے بعد ان کی والدہ تورگینہ نائب رہیں؛ 644ھ/1246ء میں وہ عظیم خان تسلیم ہوئے اور 646ھ/1248ء میں مغرب کے سفر کے دوران اچانک وفات تک حکومت کی۔ روس کی مہم سے وہ باتو کے دشمن تھے، اور 644ھ/1246ء میں انہوں نے نزاری اسماعیلی سفیروں کو حقارت سے لوٹا دیا۔ دائرۃ المعارف الاسلامیہ میں ان کے نام سے الگ مضمون نہیں، اس لیے یہ اندراج اس کے کئی مضامین کے متفرق حوالوں پر مبنی ہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
  es: "Guyuk fue el tercer Gran Kan del Imperio mongol e hijo de Ogodei. Tras la muerte de su padre en 639/1241, su madre, Toregene, gobernó como regente. Guyuk fue proclamado Gran Kan en 644/1246 y reinó hasta su repentina muerte en 646/1248 durante un viaje hacia el oeste. Había sido enemigo de Batu desde la campaña rusa y, en 644/1246, despidió con desdén a los enviados ismaelitas nizaríes. La Enciclopedia del Islam no incluye ningún artículo sobre él, por lo que la información se basa en pasajes de varios de sus artículos {cite:encyclopaedia-of-islam-2 vol. 7 p. 258}."
  fr: "Guyuk fut le troisième Grand Khan de l'Empire mongol et fils d'Ögödei. Après la régence de sa mère, Toregene, suite au décès de son père en 639/1241, il fut proclamé Grand Khan en 644/1246 et régna jusqu'à sa mort subite en 646/1248 lors d'un voyage vers l'ouest. Ennemi de Batu depuis la campagne de Russie, il congédia avec mépris les envoyés ismaéliens de Nizâr en 644/1246. L'Encyclopédie de l'Islam ne lui consacre aucun article; les informations le concernant se basent donc sur des passages de plusieurs de ses articles (voir: Encyclopédie de l'Islam, vol. 7, p. 258)."
  tr: "Kyuk, Moğol İmparatorluğu'nun üçüncü Büyük Hanı ve Oktay'ın oğluydu. Annesi Turakina, babasının 639 Hicri/1241 M.S.'deki ölümünden sonra yerine geçtikten sonra, 644 Hic/1246 M.S.'de Han seçildi ve batıya giderken ani ölümüne kadar hüküm sürdü. Rus seferinden beri Batu'nun düşmanıydı ve 644 Hicri/1246 M.S. Nizari İsmaili elçileri tarafından küçümseyici bir şekilde reddedildi. İslam Ansiklopedisi'nde hakkında bir makale yoktur, bu nedenle bu kayıt, makalelerindeki dağınık referanslara dayanmaktadır {cite:Encyclopaedia-of-Islam-2 cilt 7, s. 258}."
  id: "Kyuk adalah Khan Agung ketiga dari Kekaisaran Mongol dan putra Oktay. Setelah ibunya Turakina menggantikannya setelah kematian ayahnya pada tahun 639 H/1241 M, ia terpilih sebagai Khan pada tahun 644 H/1246 M dan memerintah hingga kematiannya yang mendadak pada tahun 646 H/1248 M saat dalam perjalanan ke barat. Ia adalah musuh Batu sejak kampanye Rusia, dan ditolak dengan nada merendahkan oleh utusan Nizari Ismaili pada tahun 644 H/1246 M. Tidak ada artikel tentang dirinya dalam Ensiklopedia Islam, sehingga catatan ini mengandalkan referensi tersebar dalam artikelnya {cite:Encyclopaedia-of-Islam-2 vol. 7, hlm. 258}."
