id: person/thabit-ibn-sinan
class: person
label: { ar: "ثابت بن سنان بن ثابت بن قرة" }
summary:
  ar: "الصابئ، صاحب التاريخ؛ توفي في ذي القعدة سنة 365هـ {cite:kamil-ibn-al-athir p. 490}. وعند ابن الجوزي ذكر ثابت بن سنان في تاريخه أن فتنة عبد الله بن المعتز كانت في شهر ربيع الأول سنة ست وتسعين وأن التدبير وقع من ابن داود بن الجراح مع الحسين بن حمدان {cite:muntazam-ibn-al-jawzi p. 373}."
  en: "The Sabian son of Sinan ibn Thabit ibn Qurra, author of the well-known history; he died in Dhu'l-Qa'da 365 {cite:kamil-ibn-al-athir p. 490}."
  es: "El hijo sabeo de Sinan ibn Thabit ibn Qurra, autor de la conocida historia; murió en Dhu'l-Qa'da 365 {cite:kamil-ibn-al-athir p. 490}."
  fr: "Le fils sabien de Sinan ibn Thabit ibn Qurra, auteur de l'histoire bien connue; il mourut en Dhu'l-Qa'da 365 {cite:kamil-ibn-al-athir p. 490}."
  ur: "صبیان ولد سنان بن ثابت ابن قرہ، معروف تاریخ کے مصنف؛ ان کی وفات ذوالقعدہ 365 میں ہوئی۔ 490}۔"
  tr: "Tarihin yazarı el-Sabi'; 365 Hicri Zhu'd-Kı'dah'ta öldü {atıf:kamil-ibn-al-athir s. 490}. İbn el-Cevzi'ye göre, Tebit bin Sinan, Abdullah ibn el-Mu'tazz'ın yargılanmasının doksan altıncı yılın Rabi'al-Awwal ayında gerçekleştiğini ve yönetimin İbn Davud ibn el-Cerrah'tan el-Hüseyin ibn Hamdan ile birlikte olduğunu belirtmiştir {atıf:Muntazam-ibn-al-Jawzi s. 373}."
  id: "Al-Sabi', penulis sejarah; ia meninggal pada Dhu al-Qi'dah 365 H {cite:kamil-ibn-al-athir hlm. 490}. Menurut Ibn al-Jawzi, Thabit ibn Sinan menyebutkan dalam sejarahnya bahwa persidangan Abdullah ibn al-Mu'tazz terjadi pada bulan Rabi' al-Awwal tahun sembilan puluh enam, dan bahwa pengelolaan jatuh dari Ibn Dawud ibn al-Jarrah dengan al-Husayn ibn Hamdan {cite:muntazam-ibn-al-jawzi hlm. 373}."
