id: person/ahmad-ibn-umar-ibn-hilal
class: person
label: { ar: "أحمد بن عمر بن هلال", en: "Ahmad ibn Umar ibn Hilal" }
summary:
  ar: "أحمد بن عمر بن هلال، أبو العباس، قاضي القضاة الربعي، فقيه قاض مشارك في علوم شتى. تفقه بفخر الدين ابن المخلطة، وأخذ عن سراج الدين بن عمر المراكشي وغيرهم. من تصانيفه «شرح ابن الحاجب الفرعي»، وشرحان على مختصره الأصلي، و«تفسير آية الكرسي». ويذكر الكتاب وفاته سنة 795 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7147}"
  en: "Ahmad ibn Umar ibn Hilal, Abu al-Abbas, chief judge, a jurist and judge learned in many fields. He studied law with Fakhr al-Din ibn al-Mukhallada and with others, and his works include a commentary on Ibn al-Hajib's lesser work and a commentary on the Qur'an verse of the Throne. The book gives his death as 795 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7147}"
