id: person/ahmad-ibn-umar-ibn-hilal
class: person
label: { ar: "أحمد بن عمر بن هلال", en: "Ahmad ibn Umar ibn Hilal", es: "Ahmad ibn Umar ibn Hilal", fr: "Ahmad ibn Umar ibn Hilal", ur: "احمد بن عمر بن ہلال" }
summary:
  ar: "أحمد بن عمر بن هلال، أبو العباس، قاضي القضاة الربعي، فقيه قاض مشارك في علوم شتى. تفقه بفخر الدين ابن المخلطة، وأخذ عن سراج الدين بن عمر المراكشي وغيرهم. من تصانيفه «شرح ابن الحاجب الفرعي»، وشرحان على مختصره الأصلي، و«تفسير آية الكرسي». ويذكر الكتاب وفاته سنة 795 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7147}"
  en: "Ahmad ibn Umar ibn Hilal, Abu al-Abbas, chief judge, a jurist and judge learned in many fields. He studied law with Fakhr al-Din ibn al-Mukhallada and with others, and his works include a commentary on Ibn al-Hajib's lesser work and a commentary on the Qur'an verse of the Throne. The book gives his death as 795 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7147}"
  es: "Ahmad ibn Umar ibn Hilal, Abu al-Abbas, juez principal, jurista y magistrado versado en diversas áreas. Estudió derecho con Fakhr al-Din ibn al-Mukhallada y otros maestros, y entre sus obras se incluyen un comentario sobre la obra menor de Ibn al-Hajib y un comentario sobre el versículo del Trono del Corán. El libro indica que falleció en el año 795 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7147}"
  fr: "Ahmad ibn Umar ibn Hilal, Abu al-Abbas, juge suprême, juriste et magistrat érudit en de nombreux domaines. Il étudia le droit auprès de Fakhr al-Din ibn al-Mukhallada et d'autres maîtres. Parmi ses œuvres figurent un commentaire d'un ouvrage mineur d'Ibn al-Hajib et un commentaire du verset coranique du Trône. L'ouvrage indique sa mort en 795 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7147}"
  ur: "احمد بن عمر بن ہلال، ابو العباس، چیف جج، ایک فقیہ اور جج نے بہت سے شعبوں میں علم حاصل کیا۔ اس نے فخر الدین ابن المخلدہ اور دوسروں کے ساتھ قانون کی تعلیم حاصل کی، اور ان کے کاموں میں ابن الحجیب کے کم کام کی تفسیر اور عرش کی قرآنی آیت کی تفسیر شامل ہے۔ کتاب میں ان کی وفات 795ھ بتائی گئی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7147}"
  tr: "Ahmed ibn Ömer ibn Hilal, Ebu el-Abbas, Rabi Başkadı, çeşitli ilimlerde bilgili bir hukukçu ve yargıçtı. Fıkra ilmini Fahreddin ibn el-Muhallata'dan, Siraj el-Din ibn Ömer el-Marakuşi'den ve diğerlerinden öğrendi. Eserleri arasında \"İbn el-Hacib'in Yardımcı Eseri Üzerine Tefsir\", orijinal özetine iki tefsir ve \"Taht Ayeti Tefsiri\" bulunmaktadır. Kitapta 795 Hicri yılında vefat ettiği belirtilmektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7147}"
  id: "Ahmad ibn Umar ibn Hilal, Abu al-Abbas, Ketua Mahkamah Rab'i, seorang ahli hukum dan hakim yang mahir dalam berbagai ilmu. Ia belajar ilmu hukum di bawah bimbingan Fakhr al-Din ibn al-Mukhallata, dan belajar dari Siraj al-Din ibn Umar al-Marrakushi dan lainnya. Di antara karyanya adalah \"Komentar atas Karya Tambahan Ibn al-Hajib,\" dua komentar atas ringkasan aslinya, dan \"Penafsiran Ayat Singgasana.\" Kitab ini menyebutkan kematiannya pada tahun 795 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7147}"
