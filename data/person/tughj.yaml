summary:
  ar: "أمير دمشق، حارب ابن زكرويه القرمطي غير مرة لما قصد أخذها سنة تسع وثمانين ثم قتل القرمطي {cite:tarikh-khulafa-minhaj-1434 p. 576}، وابنه محمد صاحب مصر الملقب بالإخشيد حضر إلى المتقي بالرقة عارضاً عليه مصر {cite:tarikh-khulafa-minhaj-1434 p. 610}. وعند المسعودي سار طغج بن شبيب أبو الأخشيد في عساكر كثيرة من دمشق فدخل طرسوس غازياً وافتتح ملورية مما يلي بلاد برغوث ودرب الراهب، وكان عند خمارويه ليلة ذبحه بالقصر أسفل دير مروان {cite:muruj-al-dhahab p. 609-610}"
  en: "Amir of Damascus; he fought Ibn Zakrawayh the Qarmatian more than once in 289 when he sought the city, then the Qarmatian was killed {cite:tarikh-khulafa-minhaj-1434 p. 576}."
