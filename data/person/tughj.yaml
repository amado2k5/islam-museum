id: person/tughj
class: person
label: { ar: "طغج" }
summary:
  ar: "أمير دمشق، حارب ابن زكرويه القرمطي غير مرة لما قصد أخذها سنة تسع وثمانين ثم قتل القرمطي {cite:tarikh-khulafa-minhaj-1434 p. 576}، وابنه محمد صاحب مصر الملقب بالإخشيد حضر إلى المتقي بالرقة عارضاً عليه مصر {cite:tarikh-khulafa-minhaj-1434 p. 610}. وعند المسعودي سار طغج بن شبيب أبو الأخشيد في عساكر كثيرة من دمشق فدخل طرسوس غازياً وافتتح ملورية مما يلي بلاد برغوث ودرب الراهب، وكان عند خمارويه ليلة ذبحه بالقصر أسفل دير مروان {cite:muruj-al-dhahab p. 609-610}"
  en: "Amir of Damascus; he fought Ibn Zakrawayh the Qarmatian more than once in 289 when he sought the city, then the Qarmatian was killed {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  es: "Emir de Damasco; luchó contra Ibn Zakrawayh el Cármata más de una vez en 289 cuando buscaba la ciudad, entonces el Cármata fue asesinado {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  fr: "Émir de Damas; il a combattu Ibn Zakrawayh le Qarmate à plusieurs reprises en 289 lorsqu'il cherchait la ville, puis le Qarmate a été tué {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  ur: "دمشق کے امیر؛ اس نے 289 میں ابن زکراویہ سے ایک سے زیادہ مرتبہ قرمطیئن کا مقابلہ کیا جب اس نے شہر تلاش کیا، پھر قرمتی مارا گیا۔ 576}۔"
  tr: "Şam Emiri İbn Zekeriye, seksen dokuzuncu yılda Karmatyalıyı ele geçirmeyi planladığında Karmatlılarla birden fazla kez savaştı ve ardından Karmatlıyı öldürdü {alıntı:Tarikh-Khulafa-minhaj-1434 s. 576}. Mısır'ın hükümdarı oğlu Muhammed, lakaplı Al-Akhsid, Rakka'daki Al-Muttaqi'ye geldi ve ona Mısır'ı teklif etti {atıf:Tarikh-Khulafa-minhaj-1434 s. 610}. Al-Mas'udi ile birlikte, Tughj ibn Shabib Abu al-Akhshid Şam'dan çok sayıda askerle yürüyerek Tarsus'a baskın olarak girdi ve Barghuth ile Darb al-Rahab topraklarından Maluriyah'ı fethetti. Katledildiği gece Marwan Manastırı'nın altındaki sarayda Khumarawayh ile birlikteydi {cite:Muruj-al-dhahab s. 609-610}"
  id: "Emir Damaskus, Ibn Zakariyah bertempur melawan Qarmatian lebih dari sekali ketika ia berniat merebutnya pada tahun delapan puluh sembilan dan kemudian membunuh Qarmatian {cite:Tarikh-Khulafa-minhaj-1434 hlm. 576}. Putranya Muhammad, penguasa Mesir yang dijuluki Al-Akhshid, datang ke Al-Muttaqi di Raqqa dan menawarkan Mesir kepadanya {cite:Tarikh-Khulafa-minhaj-1434 hlm. 610}. Bersama al-Mas'udi, Tughj ibn Shabib Abu al-Akhshid berbaris dengan banyak pasukan dari Damaskus, memasuki Tarsus sebagai perampok, dan menaklukkan Maluriyah dari tanah Barghuth dan Darb al-Rahab. Ia bersama Khumarawayh pada malam pembantaiannya di istana di bawah Biara Marwan {cite:Muruj-al-dhahab hlm. 609-610}"
