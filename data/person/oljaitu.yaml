    note: "Recorded as unknown under the founder's ruling of 3 November 2026: every phase of this man's religious life is documented, and no phase is settled as the value. The texts attest, in order: he was baptised a Christian in 1291 by his mother Uruk Khatun, a Keraite Christian, receiving the name Nicholas (Nikolya); he was raised in Buddhism, the faith of the early Ilkhans; he converted to Sunni Islam together with his brother Ghazan and took the name Muhammad; after his accession he came under the influence of the Shi'a theologians al-Hilli and Maitham al-Bahrani and in 1310 changed his school to Twelver Shi'a Islam, transferring al-Hilli's remains to a shrine at Soltaniyeh after the scholar's death; and the Mamluk historian al-Safadi reports that he became Sunni again in his last years, in Ramadan 716 AH. The Arabic article preserves the same two endings (that he remained Shia until his death, or returned to Sunni Islam under the influence of the qadi of Shiraz). Wikidata records only Islam, as structured data. With the final phase itself contested between the texts, the doubt rule governs and all phases stand in this note unsettled."
