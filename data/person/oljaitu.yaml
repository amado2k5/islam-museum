summary:
  ar: "ثامن إيلخانات الدولة الإيلخانية ⁦(حكم 1304–1316)⁩، ابن أرغون وخليفة أخيه غازان. أتمّ بناء مدينة سلطانية واتخذها عاصمة، وله قبتها الشهيرة التي ضمّت ضريحه. تنقّل في حياته بين أديان ومذاهب: عُمّد مسيحيًّا صغيرًا، ونشأ بوذيًّا، ثم اعتنق الإسلام السني مع أخيه غازان، وفي سنة 1310 اعتنق التشيع الاثني عشري بتأثير العلامة الحلي، مع رواية متأخرة عند الصفدي برجوعه إلى السنة في أواخر حياته."
  en: "Eighth Ilkhan of the Ilkhanate (reigned 1304–1316), son of Arghun and successor of his brother Ghazan. He completed the city of Soltaniyeh and made it his capital; its great dome housed his tomb. His life crossed several faiths: baptised a Christian as a child and raised a Buddhist, he converted to Sunni Islam together with Ghazan, then in 1310 adopted Twelver Shi'a Islam under the influence of al-Hilli — while al-Safadi reports a return to Sunni Islam in his last years."
  ur: "ایل خانی سلطنت کے آٹھویں ایل خان (دورِ حکومت 1304–1316)، ارغون کے بیٹے اور اپنے بھائی غازان کے جانشین۔ انھوں نے سلطانیہ کا شہر مکمل کر کے اسے دارالحکومت بنایا؛ اس کا مشہور گنبد ان کے مقبرے پر مشتمل ہے۔ ان کی زندگی کئی مذاہب سے گزری: بچپن میں عیسائی بپتسمہ پایا، بدھ مت کی تربیت ہوئی، پھر غازان کے ساتھ اسلام قبول کیا، اور 1310 میں علامہ حلی کے اثر سے اثنا عشری شیعہ ہوئے — جبکہ صفدی کے مطابق آخری برسوں میں وہ دوبارہ سنی اسلام کی طرف لوٹ آئے۔"
