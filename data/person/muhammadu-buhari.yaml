summary:
  ar: "ضابط وسياسي نيجيري (1942–2025) من دورا بولاية كاتسينا، حكم نيجيريا عسكريا من 31 ديسمبر 1983 حتى أطاح به إبراهيم بابانغيدا في 27 أغسطس 1985 واعتُقل ثلاث سنوات، ثم ترشح للرئاسة ثلاث مرات خاسرا قبل أن يفوز سنة 2015 — أول مرشح معارض يهزم رئيسا في منصبه — ويُعاد انتخابه سنة 2019، فيحكم حتى 2023. مات في عيادة بلندن في 13 يوليو 2025 ودُفن في بيته بدورا."
  en: "Nigerian officer and politician (1942–2025) from Daura in Katsina State who ruled Nigeria as military head of state from 31 December 1983 until Ibrahim Babangida overthrew him on 27 August 1985 and detained him for three years. He then ran three times for the presidency unsuccessfully before winning in 2015 — the first opposition candidate to defeat a sitting president — and again in 2019, governing until 2023. He died in a London clinic on 13 July 2025 and was buried at his home in Daura."
  ur: "نائجریائی افسر و سیاست دان (1942ء–2025ء)، ریاست کاتسینا کے دورا سے تعلق؛ 31 دسمبر 1983 سے فوجی سربراہِ مملکت رہے حتیٰ کہ 27 اگست 1985 کو ابراہیم بابانگیدا نے انھیں ہٹا کر تین سال نظر بند رکھا؛ پھر تین بار صدارت کے لیے ناکام رہے، 2015 میں کامیاب ہوئے — برسرِ منصب صدر کو ہرانے والے پہلے اپوزیشن امیدوار — اور 2019 میں دوبارہ منتخب ہو کر 2023 تک حکمران رہے؛ 13 جولائی 2025 کو لندن کے ایک کلینک میں وفات پائی اور دورا میں اپنے گھر دفن ہوئے۔"
