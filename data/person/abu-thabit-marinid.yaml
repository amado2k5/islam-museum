id: person/abu-thabit-marinid
class: person
label:
  ar: السلطان أبو ثابت المريني
  en: Sultan Abu Thabit al-Marini
  fr: "Sultan Abu Thabit al-Marini"
  es: "Sultan Abu Thabit al-Marini"
  ur: "سلطان ابو ثابت المرینی۔"
summary:
  ar: "أبو ثابت عامر بن يوسف المريني، سلطان بني مرين ⁦(707-708هـ)⁩؛ كان صقر قومه إقداماً، سار إلى تلمسان فنازلها وشد عليها الحصار، ثم دخل مراكش منتصف رجب من سنته، وهلك بتازى سنة 708هـ في ريعان ملكه."
  en: "Abu Thabit Amir ibn Yusuf al-Marini, sultan of the Marinids (707-708 AH); 'the falcon of his people' for his daring, he marched on Tlemcen and besieged it hard, entered Marrakesh in mid-Rajab, and died at Taza in 708 AH in the flower of his reign."
  fr: "Abu Thabit Amir ibn Yusuf al-Marini, sultan mérinide (707-708 H), « le faucon de son peuple » pour son audace ; il marcha sur Tlemcen et l'assiégea avec vigueur, entra à Marrakech au milieu de rajab et mourut à Taza en 708 H, au début de son règne."
  es: "Abu Thabit Amir ibn Yusuf al-Marini, sultán de los Mariníes (707-708 AH); 'el halcón de su pueblo' por su audacia, marchó sobre Tremecén y la sitió con dureza, entró en Marrakech a mediados de Rajab y murió en Taza en el año 708 AH en la flor de su reinado."
  ur: "ابو ثابت عامر ابن یوسف المرینی، مرینڈوں کے سلطان ⁦(707-708ھ)⁩؛ 'اپنے لوگوں کا فالکن' اپنی ہمت کے لیے، اس نے تلمسن پر چڑھائی کی اور اس کا سخت محاصرہ کیا، رجب کے وسط میں مراکش میں داخل ہوا، اور اپنے دور حکومت کے پھول میں 708 ہجری میں طزا کے مقام پر انتقال کر گیا۔"
  tr: "Beni Marin Sultanı Ebu Sabit Amer bin Yusuf El-Marini (707-708 Hicri); halkının en cesuruydu. Tlemcen'e yürüdü, şehri kuşattı ve abluka altına aldı. Daha sonra o yılın Receb ayının ortasında Marakeş'e girdi ve saltanatının en verimli çağında, 708 Hicri yılında Teza ayında vefat etti."
  id: "Abu Thabit Amer bin Yusuf Al-Marini, Sultan Bani Marin (707-708 H); beliau adalah yang paling berani di antara kaumnya. Beliau bergerak ke Tlemcen, mengepungnya, dan menguasainya. Kemudian beliau memasuki Marrakesh pada pertengahan bulan Rajab tahun itu, dan beliau wafat di Taza pada tahun 708 H di puncak kekuasaannya."
