summary:
  ar: "أبو ثابت عامر بن يوسف المريني، سلطان بني مرين (707-708هـ)؛ كان صقر قومه إقداماً، سار إلى تلمسان فنازلها وشد عليها الحصار، ثم دخل مراكش منتصف رجب من سنته، وهلك بتازى سنة 708هـ في ريعان ملكه."
  en: "Abu Thabit Amir ibn Yusuf al-Marini, sultan of the Marinids (707-708 AH); 'the falcon of his people' for his daring, he marched on Tlemcen and besieged it hard, entered Marrakesh in mid-Rajab, and died at Taza in 708 AH in the flower of his reign."
