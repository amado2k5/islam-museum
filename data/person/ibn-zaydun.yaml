id: person/ibn-zaydun
class: person
label: { ar: "أبو الوليد ابن زيدون" }
summary:
  ar: "أبو الوليد أحمد بن عبد الله ابن زيدون الأندلسي المخزومي الشاعر؛ كان من أعيان قرطبة وخلع عذاره في ولادة بنت المستكفي وقال فيها القصائد الطنانة والمقطعات، فلما ظهر لولادة أنه مال إلى جاريتها السوداء كتبت إليه «لو كنت تنصف في الهوى ما بيننا لم تهو جاريتي» ولقبته بالمسدس، وأهدى باكورة تفاح إلى المعتضد والد المعتمد {cite:nafh-tib-maqqari p. 209-210}."
  en: "Abu'l-Walid Ibn Zaydun, the Cordoban poet whose famous odes mourn Wallada — she answered his defection to her songstress with the al-Musaddas lampoon; he later moved to Seville's Abbadid court {cite:nafh-tib-maqqari p. 209-210}."
  es: "Abu'l-Walid Ibn Zaydun, el poeta cordobés cuyas famosas odas lamentan a Wallada —ella respondió a su deserción por su cantante con la sátira al-Musaddas—; más tarde se trasladó a la corte abadí de Sevilla {cite:nafh-tib-maqqari p. 209-210}."
  fr: "Abu'l-Walid Ibn Zaydun, le poète de Cordoue dont les célèbres odes pleurent Wallada — elle répondit à sa défection vers sa chanteuse avec la satire al-Musaddas; il s'installa plus tard à la cour abbadide de Séville {cite:nafh-tib-maqqari p. 209-210}."
  ur: "ابو الولید ابن زیدون، قرطبی شاعر جس کی مشہور غزلیں ولدا کا ماتم کرتی ہیں — اس نے اپنی گلوکارہ کو اس کے انحراف کا جواب المصدص کے چراغ سے دیا۔ بعد میں وہ سیویل کی عبادید عدالت میں چلا گیا۔ 209-210}۔"
  tr: "Şair Ebu el-Velid Ahmed bin Abdullah bin Zeydun el-Endülüs el-Makhzumi, Kordoba'nın önemli figürlerinden biriydi ve bint al-Mustakfi'nin doğuşunda onurunu aldı, bununla ilgili büyük şiirler ve parçalar yazdı. Velada, onun siyah köle kızına karşı eğilimli olduğunu anladığında, ona \"Eğer aramızda sadece aşık olsaydın, benim köleliğim yoldan çıkmazdı,\" diye yazdı ve ona tabanca dedi. İlk elmayı el-Mu'tamid'in babası el-Mu'tadid'e hediye etti {atı:nafh-tib-maqqari, s. 209-210}."
  id: "Abu al-Walid Ahmad ibn Abdullah ibn Zaydun al-Andalusi al-Makhzumi, sang penyair, adalah salah satu tokoh terkenal di Cordoba, dan ia melepas penghormatannya dalam kelahiran bint al-Mustakfi, menulis puisi-puisi besar dan fragmen tentangnya. Ketika Walada menyadari bahwa ia cenderung kepada budak perempuan hitamnya, ia menulis kepadanya, \"Jika kau hanya jatuh cinta di antara kami, budak perempuanku tidak akan tersesat,\" dan memanggilnya pistol. Ia memberikan apel pertama kepada al-Mu'tadid, ayah al-Mu'tamid {cite:nafh-tib-maqqari, hlm. 209-210}."
