summary:
  ar: "جستنيان، قائد المدافعين عن القسطنطينية في حصار 857هـ/1453م على رواية الصلابي؛ استمات في الدفاع عن الثغرة التي فتحتها المدافع العثمانية بوادي ليكوس يوم 18 أبريل وعن الأسوار {cite:dawlat-uthmaniyya-salabi p. 96}، فلما أُصيب بجراح بليغة في الهجوم الأخير انسحب من ساحة المعركة وركب إحدى السفن فاراً، فتولى الإمبراطور قسطنطين قيادة المدافعين بنفسه محله {cite:dawlat-uthmaniyya-salabi p. 110}."
  en: "Giustiniani, commander of Constantinople's defenders in the 857/1453 siege in al-Salabi's account; he fought to the last over the breach the Ottoman guns opened at the Lycus valley on 18 April {cite:dawlat-uthmaniyya-salabi p. 96}, and when gravely wounded in the final assault he left the field and fled aboard a ship — the emperor Constantine taking over command of the defence in his place {cite:dawlat-uthmaniyya-salabi p. 110}."
  es: "Giustiniani, comandante de los defensores de Constantinopla en el asedio de 857/1453 según el relato de al-Salabi; luchó hasta el final por la brecha que los cañones otomanos abrieron en el valle del Lycus el 18 de abril {cite:dawlat-uthmaniyya-salabi p. 96}, y cuando resultó gravemente herido en el asalto final abandonó el campo de batalla y huyó a bordo de un barco; el emperador Constantino tomó el mando de la defensa en su lugar {cite:dawlat-uthmaniyya-salabi p. 110}."
  fr: "Giustiniani, commandant des défenseurs de Constantinople lors du siège de 857/1453 selon le récit d'al-Salabi; il combattit jusqu'au bout à la brèche ouverte par les canons ottomans dans la vallée du Lycus le 18 avril {cite:dawlat-uthmaniyya-salabi p. 96}, et lorsqu'il fut grièvement blessé lors de l'assaut final, il quitta le champ de bataille et s'enfuit à bord d'un navire — l'empereur Constantin prenant le commandement de la défense à sa place {cite:dawlat-uthmaniyya-salabi p. 110}."
  ur: "السلابی کے کھاتے میں 857/1453 کے محاصرے میں قسطنطنیہ کے محافظوں کا کمانڈر Giustiniani؛ اس نے 18 اپریل کو وادی لائکس میں عثمانی بندوقوں کی خلاف ورزی پر آخری دم تک لڑا۔ 96}، اور آخری حملے میں شدید زخمی ہونے پر وہ میدان چھوڑ کر ایک بحری جہاز پر سوار ہو کر بھاگ گیا - شہنشاہ قسطنطین نے اس کی جگہ دفاع کی کمان سنبھال لی۔ 110}۔"
  tr: "El-Selabi'nin anlatımına göre, 857 Hicri/1453 M.S. kuşatması sırasında Konstantinopolis savunucularının komutanı olan Justinianus, 18 Nisan'da Osmanlı toplarıyla Likos Vadisi'nde açılan yarığı ve surları şiddetle savundu {cite:dawlat-uthmaniyya-salabi s. 96}. Son saldırıda ağır yaralandığında savaş alanından çekildi ve kaçan bir gemiye bindi, böylece İmparator Konstantin onun yerine savunucuların komutasını bizzat aldı {cite:dawlat-uthmaniyya-salabi s. 110}."
  id: "Justinianus, komandan para pembela Konstantinopel selama pengepungan tahun 857 H/1453 M, menurut catatan al-Salabi, dengan gigih mempertahankan celah yang dibuka oleh meriam Ottoman di Lembah Likos pada 18 April dan tembok-tembok {cite:dawlat-uthmaniyya-salabi hlm. 96}. Ketika ia terluka parah dalam serangan terakhir, ia mundur dari medan perang dan menaiki kapal yang melarikan diri, sehingga Kaisar Konstantinus sendiri mengambil alih komando para pembela menggantikannya {cite:dawlat-uthmaniyya-salabi hlm. 110}."
