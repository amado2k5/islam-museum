summary:
  ar: "جستنيان، قائد المدافعين عن القسطنطينية في حصار 857هـ/1453م على رواية الصلابي؛ استمات في الدفاع عن الثغرة التي فتحتها المدافع العثمانية بوادي ليكوس يوم 18 أبريل وعن الأسوار {cite:dawlat-uthmaniyya-salabi p. 96}، فلما أُصيب بجراح بليغة في الهجوم الأخير انسحب من ساحة المعركة وركب إحدى السفن فاراً، فتولى الإمبراطور قسطنطين قيادة المدافعين بنفسه محله {cite:dawlat-uthmaniyya-salabi p. 110}."
  en: "Giustiniani, commander of Constantinople's defenders in the 857/1453 siege in al-Salabi's account; he fought to the last over the breach the Ottoman guns opened at the Lycus valley on 18 April {cite:dawlat-uthmaniyya-salabi p. 96}, and when gravely wounded in the final assault he left the field and fled aboard a ship — the emperor Constantine taking over command of the defence in his place {cite:dawlat-uthmaniyya-salabi p. 110}."
