summary:
  ar: "أحد فقهاء المدينة، ويقول ربيعة إن الأمر في الفتيا انتهى إلى سعيد بن المسيب، ثم بعد موته إلى القاسم وسالم، بحسب الشيرازي. ويذكر الكتاب أنه كان من الفقهاء العشرة الذين دعاهم عمر بن عبد العزيز إلى مجلس الشورى بالمدينة، وأنه كان من شيوخ عمر بن عبد العزيز الذين تأدب بهم. {cite:salabi-umayyad-state-2020 p.169-173}"
  en: "A jurist of Medina; Rabi'a says the fatwa passed after Sa'id ibn al-Musayyab to al-Qasim and Salim, as Shirazi reports."
