summary:
  ar: "أحمد بن موسى بن داود العروسي، شهاب الدين، فاضل مصري ولد بمنية عروس وتعلم في الأزهر، من كتبه شرح على نظم التنوير في إسقاط التدبير وحاشية على الملوي على السمرقندية. يذكر الزركلي وفاته سنة 1208 هـ."
  en: "Ahmad ibn Musa ibn Dawud al-Arusi, Shihab al-Din, an Egyptian scholar born at Minyat Arus and educated at al-Azhar; author of a commentary on the versification of al-Tanwir and a gloss on al-Malawi on al-Samarqandiyya. Al-Zirikli prints his death as 1208 AH (1793)."
  fr: "Ahmad ibn Musa ibn Dawud al-Arusi, Shihab al-Din, savant égyptien né à Minyat Arus et formé à al-Azhar ; auteur d'un commentaire de la versification d'al-Tanwir et d'une glose sur al-Malawi à propos d'al-Samarqandiyya. Al-Zirikli donne sa mort en 1208 H (1793 ap. J.-C.)."
  es: "Ahmad ibn Musa ibn Dawud al-Arusi, Shihab al-Din, un erudito egipcio nacido en Minyat Arus y educado en al-Azhar; autor de un comentario sobre la versificación de al-Tanwir y una glosa sobre al-Malawi en al-Samarqandiyya. Al-Zirikli imprime su muerte como 1208 AH (1793)."
  ur: "احمد بن موسیٰ بن داؤد العروسی، شہاب الدین، ایک مصری عالم منیات عروس میں پیدا ہوئے اور الازہر میں تعلیم حاصل کی۔ التنویر کی توثیق پر ایک تفسیر کے مصنف اور المالوی پر سمرقندیہ پر ایک تالیف۔ الزرکلی نے ان کی وفات 1208ھ (1793) کو چھاپا۔"
  tr: "Munyat Arus'ta doğan bilgili bir Mısırlı alim olan Ahmed ibn Musa ibn Davud el-Arusi, Şihab el-Din, el-Ezher'de okudu. Eserleri arasında \"et-Tenvir fi İskat el-Tadbir\" şiiri üzerine bir şerh ve el-Malavi'nin Semerkandiyye üzerine yaptığı şerh üzerine bir açıklama bulunmaktadır. El-Zerkali onun H. 1208'deki ölümünden bahseder."
  id: "Ahmad ibn Musa ibn Dawud al-Arusi, Shihab al-Din, seorang sarjana Mesir terpelajar yang lahir di Munyat Arus, belajar di al-Azhar. Di antara karyanya adalah tafsir puisi \"al-Tanwir fi Isqat al-Tadbir\" dan ulasan al-Malawi tentang al-Samarqandiyya. Al-Zarkali menyebutkan kematiannya pada tahun 1208 H."
