summary:
  ar: "أحمد بن موسى بن داود العروسي، شهاب الدين، فاضل مصري ولد بمنية عروس وتعلم في الأزهر، من كتبه شرح على نظم التنوير في إسقاط التدبير وحاشية على الملوي على السمرقندية. يذكر الزركلي وفاته سنة 1208 هـ."
  en: "Ahmad ibn Musa ibn Dawud al-Arusi, Shihab al-Din, an Egyptian scholar born at Minyat Arus and educated at al-Azhar; author of a commentary on the versification of al-Tanwir and a gloss on al-Malawi on al-Samarqandiyya. Al-Zirikli prints his death as 1208 AH (1793)."
