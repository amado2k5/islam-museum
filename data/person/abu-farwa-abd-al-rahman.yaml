id: person/abu-farwa-abd-al-rahman
class: person
label: { ar: "أبو فروة عبد الرحمن بن الأسود", en: "Abu Farwa Abd al-Rahman ibn al-Aswad" }
summary:
  ar: "عند البلاذري: لُقّب أبو فروة بفروة كانت عليه حين سبي؛ قال ابن الكلبي كان عربياً من أراشة من بلي سبي أيام أبي بكر من جبل الجليل بالشام وقيل إنه من سبي عين التمر فابتاعه ناعم الأسدي ثم ابتاعه عثمان وجعله بحفر القبور فلما وثب الناس بعثمان كان معهم عليه فقال له عثمان رد المظالم فقال له أنت أولاها ابتعتك من مال الصدقة لتحفر القبور فتركت ذلك وكان ابنه عبد الله بن أبي فروة من سراة الموالي والربيع بن يونس بن محمد بن أبي فروة صاحب المنصور من سلالته."
  en: "In al-Baladhuri: named Abu Farwa for the fur garment on him when captured; al-Kalbi said he was an Arab of Arasha of Bali captured in Abu Bakr's days from Syria's Jabal al-Jalil — also said of Ayn al-Tamr's captives; Na'im al-Asadi bought him, then Uthman bought him for grave-digging; when the people rose on Uthman he was with them against him, Uthman saying 'repel the wrongs' — he answered 'you are first among them: I bought you from alms-money to dig graves and you abandoned it'; his son Abdallah was among the notable mawali, and al-Mansur's minister al-Rabi' ibn Yunus ibn Muhammad ibn Abi Farwa was of his line."
