summary:
  ar: "أبو جعفر محمد بن جرير بن يزيد بن خالد الطبري الآملي عمالة علامة وقته وإمام عصره وفقيه زمانه، ولد بآمل سنة ٢٢٤ ومات في شوال سنة ٣١٠ وله ثمانية عقود وسبع سنين، أخذ الحديث عن الشيوخ الفضلاء مثل محمد بن حميد الرازي وأبي كريب وهناد بن السري وعباد بن يعقوب وعبيد الله بن إسماعيل الهباري وإسماعيل بن موسى وعمران بن موسى القزاز وبشر بن معاذ العقدي، وقرأ الفقه على داود بن علي وأخذ فقه الشافعي عن الربيع بن سليمان بمصر وعن الحسن بن محمد الزعفراني ببغداد وأخذ فقه مالك عن يونس بن عبد الأعلى وبني عبد الحكم وابن أخي وهب وأخذ فقه أهل العراق عن أبي مقاتل بالري، وأدرك الأسانيد العالية بمصر والشام والعراق والكوفة والبصرة والري وكان متفننا في جميع العلوم علم القرآن والنحو والشعر واللغة والفقه كثير الحفظ، وله مذهب في الفقه اختاره لنفسه ومن كتبه كتاب اللطيف في الفقه وكتاب البسيط في الفقه ولم يتمه وكتاب التاريخ ويضاف إليه القطعان وآخر ما أملى منه إلى سنة ٣٠٢ وقد اختصره وحذف أسانيده جماعة وألحق به جماعة من حيث قطع إلى زمان ابن النديم وكتاب التفسير لم يعمل أحسن منه وكتاب القراءات وكتاب الخفيف في الفقه وكتاب المسترشد وكتاب تهذيب الآثار ولم يتمه وكتاب اختلاف الفقهاء {cite:fihrist-ibn-al-nadim p. 326-327}. وعند ابن الأثير توفي ببغداد سنة 310هـ ودُفن ليلاً بداره لأن العامة اجتمعت ومنعت من دفنه نهاراً وألصقوا عليه الرفض ثم ألصقوا عليه الإلحاد، وكان علي بن عيسى يقول والله لو سُئل هؤلاء عن معنى الرفض والإلحاد ما عرفوه ولا فهموه، وإنما تعصب عليه بعض الحنابلة ووقعوا فيه فتبعهم غيرهم، وسببه أن الطبرى جمع كتاباً في اختلاف الفقهاء لم يُصنف مثله ولم يذكر فيه أحمد بن حنبل فقيل له في ذلك فقال لم يكن فقيهاً وإنما كان محدثاً فناشب ذلك على الحنابلة وشغبوا عليه، وقال ابن خزيمة حين طالع كتاب التفسير له ما أعلم على أديم الأرض أعلم من أبي جعفر ولقد ظلمته الحنابلة، وقال الخطيب أبو بكر كان أحد أئمة العلماء يُحتكم بقوله ويُرجع إلى رأيه لمعرفته وفضله وقد جمع من العلوم ما لم يشاركه فيه أحد من أهل عصره، وقال أبو محمد عبد الله بن أحمد الجرجاني كان أبو جعفر ممن لا يأخذه في الله لومة لائم ولا يعدل في علمه وبنيانه عن حق يلزمه لربه والمسلمين إلى باطل لرغبة ولا رهبة {cite:kamil-ibn-al-athir p. 99-100} وعند ابن الجوزي أُحضر دار علي بن عيسى في ذي القعدة سنة تسع وثلاثمائة لمناظرة الحنابلة فحضر ولم يحضروا فعاد إلى منزله، وكانوا قد نقموا عليه أشياء {cite:muntazam-ibn-al-jawzi p. 449-450}. وعند ابن الجوزي مكث أربعين سنة يكتب في كل يوم منها أربعين ورقة، ولما عرض عليهم تفسيرًا في ثلاثين ألف ورقة قالوا هذا مما تفنى الأعمار قبل تمامه فقال ماتت الهمم واختصره في نحو ثلاثة آلاف ورقة ومثله في التاريخ؛ وتوفي وقت المغرب من عشية الأحد ليومين بقيا من شوال سنة عشر وثلاثمائة ودفن يوم الاثنين برحبة يعقوب في ناحية باب خراسان في حجرة بإزاء داره وقيل بل دفن ليلًا لم يؤذن به أحد واجتمع من لا يحصيهم إلا الله وصلى على قبره عدة شهور، وذكر ثابت بن سنان أنه أُخفيت حاله لأن العامة منعوا من دفنه بالنهار وادّعوا عليه الرفض ثم الإلحاد لأنه كان يرى جواز المسح على القدمين ولا يوجب غسلها، وكان أبو بكر بن أبي داود قد رفع في حقه قصة إلى نصر الحاجب أنكر منها أشياء وكتب في جوابها: لا عصابة في الإسلام كهذه العصابة الحنبلية، واستقبح ابن الجوزي تعميم الذم {cite:muntazam-ibn-al-jawzi p. 171-172}."
  en: "Al-Tabari — b. 224 at Amul, d. Shawwal 310 at 87; the Fihrist's account of his teachers, his own madhhab and his books {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Tabari – né 224 à Amul, décédé Shawwal 310 à 87 ans ; le compte du Fihrist de ses enseignants, son propre madhhab et ses livres {cite:fihrist-ibn-al-nadim}"
  es: "Al-Tabari — n. 224 en Amul, m. Shawwal 310 a los 87 años; el relato del Fihrist sobre sus maestros, su propia escuela jurídica y sus libros {cite:fihrist-ibn-al-nadim}"
  ur: "الطبری - بی۔ امول میں 224، ڈی۔ شوال 310 بمطابق 87; فہرست کا اپنے اساتذہ کا بیان، اس کے اپنے مذہب اور اس کی کتابیں"
  tr: "Ebu Ca'far Muhammed bin Jarir bin Yezid ibn Halid el-Taberi el-Amuli, zamanının önde gelen figürü, döneminin imamı ve zamanının bir hukukçusuydu. 224 Hicri yılında Amil'de doğdu ve 310 Hicri yılında Şavval'de öldü. Sekiz on yıl yedi yaşındaydı. Muhammed bin Hümayd el-Razi, Ebu Kurayb, Hanad ibn al-Sari, 'Abbad ibn Ya'qub, Ubayd Allah ibn İsmail el-Hubari, İsmail ibn Musa, İmran ibn Musa el-Kazaz ve Bişr ibn Mu'adh al-Uqdi gibi erdemli şeyhlerden hadis çalıştı. Davud bin Ali'nin yanında fıkıh ve Şafii fıkıhı okudu. Davud bin Ali'nin yanında fıkıh ve Şafii fıkıhı okudu Mısır'da El-Rabi' bin Süleyman'dan, Bağdat'ta ise El-Hasan ibn Muhammed el-Za'ferani'den. Malik fıkıhını Yunus bin Abdül-A'la, Banu Abdül-Hakam ve yeğeni Vahb'dan aldı. Ayrıca Ebu Mukatil'den Rayy'de Irak halkının fikıhını da inceledi. Mısır, Levant, Irak, Kufe, Basra ve Rey'deki yüksek aktarım zincirlerini ustalıkla öğrendi. Kur'an, dilbilgisi, şiir, dil ve fıkıh dahil tüm fenlerde yetkindi ve kapsamlı ezberleşirdi. Kendisi için seçtiği bir hukuk okulu vardı. Kitapları arasında Kitab al-Latif fıkıh, el-Basit fi al-Fiqh ve el-Lamtuyye el-Tutuma ile el-Tarih vardı Buna sürüler de eklendi ve ondan dikte edilen son kitap 302 yılındadır. Onu kısalttı, aktarım zincirlerini gruplar halinde çıkardı ve kesildiği yerden İbn el-Nadim zamanına kadar bir grup ekledi; Tafsir kitabı (ondan daha iyi değildi), okumalar kitabı, el-Khafif fi-el-Fiqh kitabı, el-Mustastir kitabı, tamamlanmamış Tahdhib el-Athar kitabı ve İhtilaf el-Fukaha'nın kitabı {atıf:Fihrist-ibn-al-Nadim s. 326-327}. İbn al-Athir'e göre, 310 Hile yılında Bağdat'ta öldü ve gece evinde gömüldü; çünkü halk gündüz toplanıp defnedilmesini engelledi, onu reddetmiş olarak nitelendirildi ve sonra ateist olarak nitelendirdi. Ali ibn İsa şöyle derdi: 'Tanrı aşkına, bu insanlara reddetme ve ateizmin anlamı sorulsaydı, anlamazlar ya da anlamazlardı. Bazı Hanbalılar ona kesinlikle karşıydı, ona düştü, bazıları ise onu takip etti. Bunun sebebi, el-Taberi'nin hukukçular arasındaki farklılıklar üzerine bir kitap derlemesiydi, ancak buna benzer bir şey yazmadı, ayrıca Ahmed ibn Hanbal'dan bahsetmedi. Bu konuda kendisine soru sorulduğunda, kendisinin bir hukukçu olmadığını söyledi. O sadece bir hadis âlimiydi ve bu da Hanbalılar arasında bir çatışmaya ve onların ona karşı isyanına yol açtı. İbn Huzeyme, tafsir kitabını incelerken, 'Yeryüzünde bilinen, Ebu Ca'far'dan daha bilgilidir' dedi ve Hanbaliler ona kötülük etti. El-Hatib Ebu Bekir şöyle dedi: Ebu Bekir, bilgisi ve erdemi sayesinde sözlerine ve görüşlerine dayanan önde gelen alimlerden biriydi. Zamanının hiç kimsesinin kendisiyle paylaşmadığı bilgileri topladı. Ebu Muhammed Abdullah ibn Ahmed el-Jurcani, Ebu Ca'fer'in Allah uğruna hiçbir suç ya da suç üstlenmeyeceklerinden biri olduğunu söyledi. Bilgisi ve yapısı, onu Rabbine ve Müslümanlara bağlayan bir hakka dayanarak haklıdır; arzu ve korkusuzlukla yalan söylemeye (atıf:kamil-ibn-al-athir s. 99-100} Ve İbn al-Jawzi ile birlikte, 309 Hicri yılında Dhu al-Qi'dah'ta Ali ibn İsa'nın evini Hanbalilerle tartışmak için getirdi, ancak o katıldı, fakat onlar katılmadı, bu yüzden evine döndü ve onlar ona karşı kin beslemişti {atıf:Muntazam-ibn-al-jawzi s. 449-450}. İbn el-Cevzi kırk yıl boyunca her gün kırk sayfa yazdı. Onlara otuz bin sayfalık bir yorum sunduğunda, bunun hayat tamamlanmadan geçmesi gereken bir şey olduğunu söylediler. O dedi ki, 'Hırs öldü,' ve bunu yaklaşık üç bin sayfaya özetledi, tarihte de aynı. Pazar akşamı gün batımında iki gün boyunca öldü, 300 Hile yılında Şevval'de kaldı ve Pazartesi günü Bab Horasan bölgesindeki Ya'qub Rahbah'ında, evinin karşısındaki bir odaya defnedildi. Bazıları gece gömüldüğünü, kimsenin buna izin verilmediğini ve herkesin toplandığını söyler Sadece Allah tarafından sayılan ve mezarında aylarca namaz kılan kişidir. Tebit bin Sinan, durumunun gizlendiğini çünkü sıradan halkın gündüzleri gömülmesini yasakladığını ve ayaklarını silmenin ve yıkamanın uygun olmadığına inandığı için ateizm yaptıklarını belirtmiştir. Ebu Bekir bin Ebi Davud, Nasr el-Hacib'e bir haber vermiş, bazılarını reddetmiş ve şöyle yazmıştır: İslam'da bu Hanbali çetesi gibi bir çete yoktur. İbn el-Cavazi, suçun genelleştirilmesini kınamıştır {atıf:Muntazam-ibn-al-Jawzi s. 171-172}."
  id: "Abu Ja'far Muhammad ibn Jarir ibn Yazid ibn Khalid al-Tabari al-Amuli adalah tokoh terkemuka pada zamannya, imam pada zamannya, dan ahli hukum pada zamannya. Ia lahir di Amil pada tahun 224 H dan meninggal di Shawwal pada tahun 310 H. Ia memiliki usia delapan dekade tujuh tahun. Ia mempelajari hadits dari para sheikh yang berbudi luhur seperti Muhammad ibn Humayd al-Razi, Abu Kurayb, Hanad ibn al-Sari, 'Abbad ibn Ya'qub, Ubayd Allah ibn Ismail al-Hubari, Ismail ibn Musa, Imran ibn Musa al-Qazzaz, dan Bishr ibn Mu'adh al-'Uqdi. Ia mempelajari fiksi di bawah bimbingan Dawud ibn Ali dan mempelajari fiksi Shafi'i Dari Al-Rabi' ibn Sulayman di Mesir, dan dari Al-Hasan ibn Muhammad Al-Za'farani di Baghdad. Ia mempelajari hukum Malik dari Yunus ibn Abd al-A'la, Banu Abd al-Hakam, dan keponakannya Wahb. Ia juga mempelajari fiqdemen rakyat Irak dari Abu Muqatil di Rayy. Ia menguasai rantai transmisi tinggi di Mesir, Levant, Irak, Kufa, Basra, dan Rayy. Ia mahir dalam semua ilmu termasuk Al-Quran, tata bahasa, puisi, bahasa, dan firisprudensi, dengan hafalan yang luas. Ia memiliki aliran fiqh yang dipilihnya sendiri. Di antara bukunya adalah Kitab al-Latif fiqh, al-Basit fi al-Fiqh dan al-Lamtuyyat al-Tutuma, serta al-Tarikh Ditambah lagi adalah kawanan-kawanan, dan yang terakhir didikte darinya adalah pada tahun 302. Ia meringkasnya, menghilangkan rantai transmisinya secara bergolongan, dan menambahkan satu kelompok dari tempat ia dipotong hingga masa Ibn al-Nadim, kitab Tafsir yang tidak lebih baik darinya, kitab bacaan, kitab al-Khafif fi al-Fiqh, kitab al-Mustasthir, kitab Tahdhib al-Athar tetapi tidak selesai, dan kitab Ikhtilaf al-Fuqaha {cite:fihrist-ibn-al-nadim hlm. 326-327}. Menurut Ibn al-Athir, ia meninggal di Baghdad pada tahun 310 H dan dimakamkan pada malam hari di rumahnya karena rakyat biasa berkumpul dan mencegah pemakamannya di siang hari, melabelinya sebagai penolakan, lalu melabelinya ateis. Ali ibn Isa biasa berkata, 'Demi Tuhan, jika orang-orang ini ditanya tentang arti penolakan dan ateisme, mereka tidak akan mengerti atau memahaminya. Beberapa Hanbal sangat condong menentangnya, jatuh ke dalamnya, dan yang lain mengikutinya. Alasannya adalah al-Tabari menyusun buku tentang perbedaan di antara ahli hukum tanpa menulis buku serupa, juga tidak menyebut Ahmad ibn Hanbal. Ia ditanya tentang hal ini, dan ia mengatakan ia bukan seorang ahli hukum. Ia hanyalah seorang ulama hadis, yang menyebabkan konflik di antara Hanbalis dan pemberontakan mereka terhadapnya. Ibn Khuzaymah berkata ketika meninjau buku tafsirnya, 'Apa yang diketahui di bumi lebih berpengetahuan daripada Abu Ja'far,' dan Hanbal telah menyakitinya. Al-Khatib Abu Bakr berkata: Abu Bakr adalah salah satu ulama terkemuka yang mengandalkan kata-katanya dan pendapatnya karena pengetahuan dan kebajikan. Ia mengumpulkan pengetahuan yang tidak dibagi oleh siapa pun di zamannya. Abu Muhammad Abdullah ibn Ahmad al-Jurjani mengatakan Abu Ja'far termasuk di antara mereka yang tidak akan diambil oleh kesalahan atau kesalahan demi Allah. Ia dibenarkan dalam pengetahuan dan strukturnya yang didasarkan pada hak yang mengikatnya kepada Tuhan dan umat Muslim, ke dalam kebohongan karena keinginan dan tanpa rasa takut {cite:kamil-ibn-al-athir hlm. 99-100} Dan bersama Ibn al-Jawzi, ia membawa rumah Ali ibn Isa di Dhu al-Qi'dah pada tahun 309 H untuk berdebat dengan Hanbali, tetapi ia hadir, namun mereka tidak hadir, sehingga ia kembali ke rumahnya, dan mereka menyimpan dendam terhadapnya {cite:Muntazam-ibn-al-jawzi hlm. 449-450}. Ibn al-Jawzi menghabiskan empat puluh tahun, menulis empat puluh halaman setiap hari. Ketika ia memberikan komentar pada tiga puluh ribu halaman, mereka mengatakan bahwa ini adalah sesuatu yang akan hilang sebelum kehidupan selesai. Ia berkata, 'Ambisi telah mati,' dan ia merangkumnya menjadi sekitar tiga ribu halaman, dan hal yang sama berlaku dalam sejarah. Ia meninggal saat matahari terbenam pada Minggu malam selama dua hari, tetap di Shawwal pada tahun 300 H, dan dimakamkan pada hari Senin di Rahbah Ya'qub di daerah Bab Khorasan, di sebuah ruangan di seberang rumahnya. Beberapa mengatakan ia dimakamkan pada malam hari, dan tidak ada yang diizinkan melakukannya, dan semua orang berkumpul Siapa pun yang hanya dihitung oleh Allah dan berdoa di atas makamnya selama beberapa bulan. Thabit ibn Sinan menyebutkan bahwa kondisinya disembunyikan karena rakyat biasa melarangnya dimakamkan di siang hari dan berdoa agar dia ditolak, kemudian ateisme, karena dia percaya diperbolehkan untuk mengelap kaki dan tidak perlu mencucinya. Abu Bakr ibn Abi Dawud telah mengajukan cerita terhadapnya kepada Nasr al-Hajib, menyangkal sebagian dan menulis sebagai tanggapan: Tidak ada geng dalam Islam seperti geng Hanbali ini. Ibn al-Jawzi mengutuk generalisasi kesalahan {cite:muntazam-ibn-al-jawzi hlm. 171-172}."
