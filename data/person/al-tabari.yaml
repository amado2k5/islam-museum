label: { ar: "الطبري", en: "al-Tabari" }
summary:
  ar: "أبو جعفر محمد بن جرير بن يزيد بن خالد الطبري الآملي عمالة علامة وقته وإمام عصره وفقيه زمانه، ولد بآمل سنة ٢٢٤ ومات في شوال سنة ٣١٠ وله ثمانية عقود وسبع سنين، أخذ الحديث عن الشيوخ الفضلاء مثل محمد بن حميد الرازي وأبي كريب وهناد بن السري وعباد بن يعقوب وعبيد الله بن إسماعيل الهباري وإسماعيل بن موسى وعمران بن موسى القزاز وبشر بن معاذ العقدي، وقرأ الفقه على داود بن علي وأخذ فقه الشافعي عن الربيع بن سليمان بمصر وعن الحسن بن محمد الزعفراني ببغداد وأخذ فقه مالك عن يونس بن عبد الأعلى وبني عبد الحكم وابن أخي وهب وأخذ فقه أهل العراق عن أبي مقاتل بالري، وأدرك الأسانيد العالية بمصر والشام والعراق والكوفة والبصرة والري وكان متفننا في جميع العلوم علم القرآن والنحو والشعر واللغة والفقه كثير الحفظ، وله مذهب في الفقه اختاره لنفسه ومن كتبه كتاب اللطيف في الفقه وكتاب البسيط في الفقه ولم يتمه وكتاب التاريخ ويضاف إليه القطعان وآخر ما أملى منه إلى سنة ٣٠٢ وقد اختصره وحذف أسانيده جماعة وألحق به جماعة من حيث قطع إلى زمان ابن النديم وكتاب التفسير لم يعمل أحسن منه وكتاب القراءات وكتاب الخفيف في الفقه وكتاب المسترشد وكتاب تهذيب الآثار ولم يتمه وكتاب اختلاف الفقهاء {cite:fihrist-ibn-al-nadim p. 326-327}. وعند ابن الأثير توفي ببغداد سنة 310هـ ودُفن ليلاً بداره لأن العامة اجتمعت ومنعت من دفنه نهاراً وألصقوا عليه الرفض ثم ألصقوا عليه الإلحاد، وكان علي بن عيسى يقول والله لو سُئل هؤلاء عن معنى الرفض والإلحاد ما عرفوه ولا فهموه، وإنما تعصب عليه بعض الحنابلة ووقعوا فيه فتبعهم غيرهم، وسببه أن الطبرى جمع كتاباً في اختلاف الفقهاء لم يُصنف مثله ولم يذكر فيه أحمد بن حنبل فقيل له في ذلك فقال لم يكن فقيهاً وإنما كان محدثاً فناشب ذلك على الحنابلة وشغبوا عليه، وقال ابن خزيمة حين طالع كتاب التفسير له ما أعلم على أديم الأرض أعلم من أبي جعفر ولقد ظلمته الحنابلة، وقال الخطيب أبو بكر كان أحد أئمة العلماء يُحتكم بقوله ويُرجع إلى رأيه لمعرفته وفضله وقد جمع من العلوم ما لم يشاركه فيه أحد من أهل عصره، وقال أبو محمد عبد الله بن أحمد الجرجاني كان أبو جعفر ممن لا يأخذه في الله لومة لائم ولا يعدل في علمه وبنيانه عن حق يلزمه لربه والمسلمين إلى باطل لرغبة ولا رهبة {cite:kamil-ibn-al-athir p. 99-100}"
  en: "Al-Tabari — b. 224 at Amul, d. Shawwal 310 at 87; the Fihrist's account of his teachers, his own madhhab and his books {cite:fihrist-ibn-al-nadim}"
