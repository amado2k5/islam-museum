class: person
label: { ar: "الطبري", en: "al-Tabari" }
summary:
  ar: "أبو جعفر محمد بن جرير بن يزيد بن خالد الطبري الآملي عمالة علامة وقته وإمام عصره وفقيه زمانه، ولد بآمل سنة ٢٢٤ ومات في شوال سنة ٣١٠ وله ثمانية عقود وسبع سنين، أخذ الحديث عن الشيوخ الفضلاء مثل محمد بن حميد الرازي وأبي كريب وهناد بن السري وعباد بن يعقوب وعبيد الله بن إسماعيل الهباري وإسماعيل بن موسى وعمران بن موسى القزاز وبشر بن معاذ العقدي، وقرأ الفقه على داود بن علي وأخذ فقه الشافعي عن الربيع بن سليمان بمصر وعن الحسن بن محمد الزعفراني ببغداد وأخذ فقه مالك عن يونس بن عبد الأعلى وبني عبد الحكم وابن أخي وهب وأخذ فقه أهل العراق عن أبي مقاتل بالري، وأدرك الأسانيد العالية بمصر والشام والعراق والكوفة والبصرة والري وكان متفننا في جميع العلوم علم القرآن والنحو والشعر واللغة والفقه كثير الحفظ، وله مذهب في الفقه اختاره لنفسه ومن كتبه كتاب اللطيف في الفقه وكتاب البسيط في الفقه ولم يتمه وكتاب التاريخ ويضاف إليه القطعان وآخر ما أملى منه إلى سنة ٣٠٢ وقد اختصره وحذف أسانيده جماعة وألحق به جماعة من حيث قطع إلى زمان ابن النديم وكتاب التفسير لم يعمل أحسن منه وكتاب القراءات وكتاب الخفيف في الفقه وكتاب المسترشد وكتاب تهذيب الآثار ولم يتمه وكتاب اختلاف الفقهاء {cite:fihrist-ibn-al-nadim p. 326-327}."
  en: "Al-Tabari — b. 224 at Amul, d. Shawwal 310 at 87; the Fihrist's account of his teachers, his own madhhab and his books {cite:fihrist-ibn-al-nadim}"
