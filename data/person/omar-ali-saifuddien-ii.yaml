summary:
  ar: "السلطان الثالث والعشرون لبروناي (حكم 1828–1852)، ابن محمد جمال العالم الأول. كان قاصرًا حين مات والده سنة 1804 وطالب بالعرش سنة 1825؛ وشهد حكمه صيرورة جيمس بروك راجا ساراواك والتنازل عن لابوان لبريطانيا سنة 1846 ومعاهدة الصداقة والتجارة سنة 1847. توفي في 18 تشرين الثاني 1852 وخلفه ابنه عبد المؤمن."
  en: "The 23rd Sultan of Brunei (reigned 1828–1852), son of Muhammad Jamalul Alam I. A minor when his father died in 1804, he asserted his claim to the throne in 1825; his reign saw James Brooke become Rajah of Sarawak, the cession of Labuan to Britain in 1846 and the treaty of friendship and commerce of 1847. He died on 18 November 1852 and was succeeded by his son Abdul Momin."
  ur: "برونائی کے تیئسویں سلطان (حکمرانی 1828ء–1852ء)، محمد جمال عالم اول کے بیٹے۔ 1804ء میں والد کی وفات کے وقت نابالغ تھے اور 1825ء میں تخت کا دعویٰ کیا؛ ان کے دور میں جیمز بروک ساراواک کے راجا بنے، 1846ء میں لابوان برطانیہ کو دیا گیا اور 1847ء میں دوستی و تجارت کا معاہدہ ہوا۔ 18 نومبر 1852ء کو وفات پائی اور ان کے بیٹے عبد المومن جانشین ہوئے۔"
