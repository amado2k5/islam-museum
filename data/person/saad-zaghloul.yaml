summary:
  ar: "زعيم وطني مصري وقائد ثورة 1919، درس في الأزهر ومدرسة الحقوق وعمل قاضيًا ووزيرًا للمعارف ثم للحقانية، وقاد الوفد المصري المطالب بالاستقلال فنُفي إلى مالطا وسيشل، ثم صار أول رئيس وزراء من حزب الوفد سنة 1924 ورئيس مجلس النواب حتى وفاته سنة 1927."
  en: "Egyptian national leader and leader of the 1919 revolution. He studied at al-Azhar and the law school, worked as a judge and as minister of education and then of justice, and led the Egyptian delegation demanding independence, for which he was exiled to Malta and the Seychelles; he became the Wafd's first prime minister in 1924 and president of the Chamber of Deputies until his death in 1927."
  ur: "مصری قومی رہنما اور 1919 کی بغاوت کے قائد۔ انہوں نے الازہر اور لا اسکول میں تعلیم حاصل کی، جج رہے اور وزیرِ تعلیم اور پھر وزیرِ انصاف ہوئے، آزادی کا مطالبہ کرنے والے مصری وفد کی قیادت کی جس پر انہیں مالٹا اور سیشلز جلاوطن کیا گیا؛ وہ 1924 میں وفد کے پہلے وزیرِ اعظم بنے اور 1927 میں وفات تک ایوانِ نمائندگان کے صدر رہے۔"
