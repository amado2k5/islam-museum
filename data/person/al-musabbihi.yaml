summary:
  ar: "الأمير المختار عز الملك محمد بن عبيد الله بن القاسم بن أحمد المسبحي الكاتب؛ كان في خدمة الحاكم بأمر الله صاحب مصر سنة سبع وتسعين وثلاثمائة وتولى ديوان الترتيب؛ المؤرخ صاحب التاريخ الكبير في أخبار مصر ومن حلّ بها من الولاة والأمراء والعلماء والخلفاء وأسواقها ومجالسها وأسعارها وهو ثلاث عشرة ألف ورقة يستغنى بمضمونه عن غيره؛ وله تصانيف أخر منها التلويح والتصريح والغرق والشرق والطعام والإدام ودرك البغية وقصص الأنبياء والمفاتحة والمناكحة والأمثلة للدول المقبلة؛ رثى أباه قاضي القضاة عبيد الله بأبيات {cite:wafayat-ayan}."
  en: "Al-Amir al-Mukhtar Muhammad b. Ubayd Allah al-Musabbihi (306–420) — Fatimid court official and historian of Egypt; author of the great 13,000-folio Tarikh on Egypt's rulers, scholars, markets and assemblies, and of many other works {cite:wafayat-ayan}."
  fr: "Al-Amir al-Mukhtar Muhammad b. Ubayd Allah al-Musabbihi (306-420) - Fonctionnaire de la cour fatimide et historien de l'Égypte ; auteur du grand Tarikh de 13 000 folio sur les dirigeants, les savants, les marchés et les assemblées de l'Égypte, et de nombreux autres travaux {cite:wafayat-ayan}."
  es: "Al-Amir al-Mukhtar Muhammad b. Ubayd Allah al-Musabbihi (306–420) — Funcionario de la corte fatimí e historiador de Egipto; autor del gran Tarikh de 13.000 folios sobre los gobernantes, eruditos, mercados y asambleas de Egipto, y de muchas otras obras {cite:wafayat-ayan}."
  ur: "الامیر المختار محمد بن۔ عبید اللہ المصبیحی (306-420) - فاطمی درباری اہلکار اور مصر کا مورخ؛ مصر کے حکمرانوں، علماء، بازاروں اور اسمبلیوں کے بارے میں عظیم 13,000 فولیو تاریخ کے مصنف اور بہت سی دوسری تصانیف {حوالہ: وفایت-عیان}۔"
