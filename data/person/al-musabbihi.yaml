summary:
  ar: "الأمير المختار عز الملك محمد بن عبيد الله بن القاسم بن أحمد المسبحي الكاتب؛ كان في خدمة الحاكم بأمر الله صاحب مصر سنة سبع وتسعين وثلاثمائة وتولى ديوان الترتيب؛ المؤرخ صاحب التاريخ الكبير في أخبار مصر ومن حلّ بها من الولاة والأمراء والعلماء والخلفاء وأسواقها ومجالسها وأسعارها وهو ثلاث عشرة ألف ورقة يستغنى بمضمونه عن غيره؛ وله تصانيف أخر منها التلويح والتصريح والغرق والشرق والطعام والإدام ودرك البغية وقصص الأنبياء والمفاتحة والمناكحة والأمثلة للدول المقبلة؛ رثى أباه قاضي القضاة عبيد الله بأبيات {cite:wafayat-ayan}."
  en: "Al-Amir al-Mukhtar Muhammad b. Ubayd Allah al-Musabbihi (306–420) — Fatimid court official and historian of Egypt; author of the great 13,000-folio Tarikh on Egypt's rulers, scholars, markets and assemblies, and of many other works {cite:wafayat-ayan}."
