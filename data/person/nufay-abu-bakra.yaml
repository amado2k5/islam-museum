summary:
  ar: نفيع أبو بكرة؛ أحد النافعين اللذين ذكرهما أبو المختار في قصيدته على عمال الأهواز مع نافع بن الحارث بن كلدة أخيه.
  en: Nufay' Abu Bakra; one of 'the two Nafi's' named in Abu al-Mukhtar's satire, with his brother Nafi' ibn al-Harith ibn Kallada.
  es: "Nufay' Abu Bakra; uno de los 'dos Nafi' mencionados en la sátira de Abu al-Mukhtar, junto con su hermano Nafi' ibn al-Harith ibn Kallada."
  fr: "Nufay' Abu Bakra; l'un des « deux Nafi' » mentionnés dans la satire d'Abu al-Mukhtar, avec son frère Nafi' ibn al-Harith ibn Kallada."
  ur: "نفعی ابوبکرہ؛ ابومختار کے طنز میں ان دو نافعوں میں سے ایک کا نام اپنے بھائی نافع ابن حارث ابن کلدہ کے ساتھ ہے۔"
