summary:
  ar: "شاعر كشميري من القرن التاسع عشر تعلّم الأدب الفارسي، تُوجت شهرته بمثنويه «گلریز» المقتبس من رومانسية فارسية لضياء الدين نخشبي، وجمع محمد يوسف تينغ أكثر شعره في مجلدين (1972، 1978)."
  en: "Nineteenth-century Kashmiri poet educated in Persian literature, whose fame rests on his mathnavi Gulrez, a free rendering of a Persian romance by Zia-ud-Din Nakhshabi; Mohammad Yousuf Taing collected most of his poetry in two volumes (1972, 1978)."
  ur: "انیسویں صدی کے کشمیری شاعر جو فارسی ادب کے عالم تھے؛ ان کی شہرت مثنوی «گلریز» پر قائم ہے، جو ضیاء الدین نخشبی کی فارسی رومانوی داستان کی آزاد ترجمانی ہے؛ محمد یوسف تائینگ نے ان کا بیشتر کلام دو جلدوں (1972ء، 1978ء) میں جمع کیا۔"
