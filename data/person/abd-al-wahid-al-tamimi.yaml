id: person/abd-al-wahid-al-tamimi
class: person
label: { ar: "أبو الفضل عبد الواحد بن عبد العزيز التميمي الحنبلي", en: "Abu al-Fadl Abd al-Wahid ibn Abd al-Aziz al-Tamimi al-Hanbali", fr: "Abu al-Fadl Abd al-Wahid ibn Abd al-Aziz al-Tamimi al-Hanbali", es: "Abu al-Fadl Abd al-Wahid ibn Abd al-Aziz al-Tamimi al-Hanbali", ur: "ابو الفضل عبد الواحد بن عبد العزیز التمیمی الحنبلی" }
summary:
  ar: "عبد الواحد بن عبد العزيز بن الحارث بن أسد بن الليث بن سليمان بن الأسود بن سفيان أبو الفضل التميمي، رئيس الحنابلة ببغداد ووجههم في زمانه، حدث عن أبي بكر النجاد والبغوي وابن الجعابي، وصنف في أصول الدين وفروعه ومن أشهر مصنفاته اعتقاد الإمام أحمد. كان مقدماً عند الخليفة القادر بالله، وتوفي ببغداد في ذي القعدة سنة عشر وأربعمائة ودُفن إلى جانب قبر الإمام أحمد بن حنبل، وصلى عليه نحو خمسين ألف إنسان {cite:muntazam-ibn-al-jawzi j.7 p.295}."
  en: "Abd al-Wahid ibn Abd al-Aziz ibn al-Harith ibn Asad ibn al-Layth ibn Sulayman ibn al-Aswad ibn Sufyan, Abu al-Fadl al-Tamimi, head of the Hanbalis of Baghdad and their leading figure in his time. He related hadith from Abu Bakr al-Najjad, al-Baghawi and Ibn al-Ja'abi, and wrote on the principles of religion and its branches; among his best-known works is the Creed of Imam Ahmad. He was held in high regard by the caliph al-Qadir bi-Llah. He died in Baghdad in Dhu al-Qa'da of the year 410 and was buried beside the grave of Imam Ahmad ibn Hanbal; about fifty thousand people prayed over him {cite:muntazam-ibn-al-jawzi j.7 p.295}."
  fr: "Abd al-Wahid ibn Abd al-Aziz ibn al-Harith ibn Asad ibn al-Layth ibn Sulayman ibn al-Aswad ibn Sufyan, Abu al-Fadl al-Tamimi, chef des hanbalites de Bagdad et leur figure majeure en son temps. Il transmit le hadith d'Abu Bakr al-Najjad, d'al-Baghawi et d'Ibn al-Ja'abi, et écrivit sur les fondements de la religion et ses branches ; parmi ses œuvres les plus connues figure la Croyance de l'imam Ahmad. Il était tenu en haute estime par le calife al-Qadir bi-Llah. Il mourut à Bagdad en dhu al-qa'da de l'an 410 et fut inhumé près de la tombe de l'imam Ahmad ibn Hanbal ; environ cinquante mille personnes prièrent sur lui {cite:muntazam-ibn-al-jawzi j.7 p.295}."
  es: "Abd al-Wahid ibn Abd al-Aziz ibn al-Harith ibn Asad ibn al-Layth ibn Sulayman ibn al-Aswad ibn Sufyan, Abu al-Fadl al-Tamimi, jefe de los hanbalíes de Bagdad y su figura más destacada en su época. Recitó hadices de Abu Bakr al-Najjad, al-Baghawi e Ibn al-Ja'abi, y escribió sobre los principios de la religión y sus ramas; entre sus obras más conocidas se encuentra el Credo del Imam Ahmad. Fue muy estimado por el califa al-Qadir bi-Llah. Murió en Bagdad en Dhu al-Qa'da del año 410 y fue enterrado junto a la tumba del Imam Ahmad ibn Hanbal; cerca de cincuenta mil personas oraron por él {cite:muntazam-ibn-al-jawzi j.7 p.295}."
  ur: "عبد الواحد بن عبد العزیز بن الحارث ابن اسد ابن اللیث ابن سلیمان بن اسود ابن سفیان، ابو الفضل التمیمی، بغداد کے حنبلیوں کے سربراہ اور اپنے زمانے میں ان کی سرکردہ شخصیت۔ انہوں نے ابو بکر النجاد، البغوی اور ابن الجعبی سے حدیثیں نقل کیں اور اصول دین اور اس کی شاخوں پر لکھا۔ ان کی مشہور تصانیف میں امام احمد کا عقیدہ ہے۔ خلیفہ القادر باللہ کے نزدیک ان کا بہت احترام تھا۔ آپ کی وفات ذوالقعدہ 410 میں بغداد میں ہوئی اور امام احمد بن حنبل کی قبر کے پاس دفن ہوئے۔ تقریباً پچاس ہزار لوگوں نے آپ پر نماز پڑھی۔"
  tr: "Abdülvahid ibn Abdülaziz ibn el-Harith ibn Asad ibn el-Layth ibn Sulayman ibn el-Aswad ibn Sufyan, Ebu el-Fadl el-Tamimi, Bağdat'taki Hanbelilerin başı ve zamanının önde gelen şahsiyetiydi. Ebu Bekir el-Neced, el-Baghawi ve İbn el-Caabi'den hadis rivayet etmiş ve dinin esasları ve dalları üzerine eserler yazmıştır. En ünlü eserleri arasında İmam Ahmed'in akidesi üzerine yazdığı risale yer almaktadır. Halife el-Kadir Billa tarafından büyük saygı görmüştür. Hicri 410 yılının Zilhicce ayında Bağdat'ta vefat etmiş ve İmam Ahmed ibn Hanbel'in kabrinin yanına defnedilmiştir. Yaklaşık elli bin kişi onun için dua etmiştir."
  id: "Abd al-Wahid ibn Abd al-Aziz ibn al-Harith ibn Asad ibn al-Layth ibn Sulayman ibn al-Aswad ibn Sufyan, Abu al-Fadl al-Tamimi, adalah kepala mazhab Hanbali di Baghdad dan tokoh terkemuka mereka pada masanya. Ia meriwayatkan hadits dari Abu Bakr al-Najad, al-Baghawi, dan Ibn al-Ja’abi, serta menulis karya-karya tentang dasar-dasar dan cabang-cabang agama. Di antara karya-karyanya yang paling terkenal adalah risalahnya tentang akidah Imam Ahmad. Ia sangat dihormati oleh Khalifah al-Qadir Billah. Ia wafat di Baghdad pada bulan Dzul Qi'dah tahun 410 Hijriah dan dimakamkan di samping makam Imam Ahmad ibn Hanbal. Sekitar lima puluh ribu orang mendoakannya."
