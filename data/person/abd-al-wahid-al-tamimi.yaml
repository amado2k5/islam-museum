id: person/abd-al-wahid-al-tamimi
class: person
label: { ar: "أبو الفضل عبد الواحد بن عبد العزيز التميمي الحنبلي", en: "Abu al-Fadl Abd al-Wahid ibn Abd al-Aziz al-Tamimi al-Hanbali" }
summary:
  ar: "عبد الواحد بن عبد العزيز بن الحارث بن أسد بن الليث بن سليمان بن الأسود بن سفيان أبو الفضل التميمي، رئيس الحنابلة ببغداد ووجههم في زمانه، حدث عن أبي بكر النجاد والبغوي وابن الجعابي، وصنف في أصول الدين وفروعه ومن أشهر مصنفاته اعتقاد الإمام أحمد. كان مقدماً عند الخليفة القادر بالله، وتوفي ببغداد في ذي القعدة سنة عشر وأربعمائة ودُفن إلى جانب قبر الإمام أحمد بن حنبل، وصلى عليه نحو خمسين ألف إنسان {cite:muntazam-ibn-al-jawzi j.7 p.295}."
  en: "Abd al-Wahid ibn Abd al-Aziz ibn al-Harith ibn Asad ibn al-Layth ibn Sulayman ibn al-Aswad ibn Sufyan, Abu al-Fadl al-Tamimi, head of the Hanbalis of Baghdad and their leading figure in his time. He related hadith from Abu Bakr al-Najjad, al-Baghawi and Ibn al-Ja'abi, and wrote on the principles of religion and its branches; among his best-known works is the Creed of Imam Ahmad. He was held in high regard by the caliph al-Qadir bi-Llah. He died in Baghdad in Dhu al-Qa'da of the year 410 and was buried beside the grave of Imam Ahmad ibn Hanbal; about fifty thousand people prayed over him {cite:muntazam-ibn-al-jawzi j.7 p.295}."
