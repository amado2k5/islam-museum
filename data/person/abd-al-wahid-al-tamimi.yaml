summary:
  ar: "عبد الواحد بن عبد العزيز بن الحارث بن أسد بن الليث بن سليمان بن الأسود بن سفيان أبو الفضل التميمي، رئيس الحنابلة ببغداد ووجههم في زمانه، حدث عن أبي بكر النجاد والبغوي وابن الجعابي، وصنف في أصول الدين وفروعه ومن أشهر مصنفاته اعتقاد الإمام أحمد. كان مقدماً عند الخليفة القادر بالله، وتوفي ببغداد في ذي القعدة سنة عشر وأربعمائة ودُفن إلى جانب قبر الإمام أحمد بن حنبل، وصلى عليه نحو خمسين ألف إنسان {cite:muntazam-ibn-al-jawzi j.7 p.295}."
