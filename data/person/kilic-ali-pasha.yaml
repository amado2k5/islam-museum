summary:
  ar: "قبودان ⁦(أمير)⁩ البحر العثماني؛ بعد استقرار الدولة في تونس تطلعت أنظاره إلى المغرب لضمه للدولة العثمانية، فصدرت إليه الأوامر بالتوجه إليه فوصل الجزائر في جمادى الآخرة ٩٨٩هـ/يونيو ١٥٨١م، لكن أحمد المنصور سدّ مداخل مملكته وحصّن الثغور ووجه سفارة إلى إستانبول وقارب اتفاقاً عسكرياً مع إسبانيا، فقبل السلطان الأمر الواقع وأمره ونائبه جعفر باشا بالتخلي عن العمل في المغرب والانتقال إلى الشرق حيث اضطربت أمور الحجاز — فتخلى عن هدفه الطموح في استرداد الأندلس. توفي سنة ٩٩٥هـ/١٥٨٧م، وبموته انتهى في الجزائر نظام البايلربك وخلفه قبوداناً للبحر حسن فنزيانو {cite:dawlat-uthmaniyya-salabi p. 270-273}."
  en: "Ottoman kapudan pasha; once the state was settled in Tunis he set his sights on annexing Morocco and was ordered to march, reaching Algiers in Jumada II 989/June 1581. But Ahmad al-Mansur sealed his kingdom's passes, fortified the shores, sent an embassy to Istanbul and neared a military agreement with Spain, so the sultan accepted the fait accompli and ordered Uluj Ali and his deputy Jafar Pasha to abandon the Morocco operation for the east, where the Hejaz had grown troubled — ending his ambition of recovering al-Andalus. He died in 995/1587; with him ended Algiers' beylerbey system, and Hasan Veneziano succeeded him as kapudan {cite:dawlat-uthmaniyya-salabi p. 270-273}."
  es: "Kapudan pasha otomano; una vez establecido el estado en Túnez, puso sus ojos en la anexión de Marruecos y recibió la orden de marchar, llegando a Argel en Jumada II 989/junio de 1581. Pero Ahmad al-Mansur selló los pasos de su reino, fortificó las costas, envió una embajada a Estambul y estuvo cerca de un acuerdo militar con España, por lo que el sultán aceptó el hecho consumado y ordenó a Uluj Ali y a su lugarteniente Jafar Pasha que abandonaran la operación en Marruecos y se dirigieran al este, donde el Hiyaz se había vuelto inestable, poniendo fin a su ambición de recuperar al-Ándalus. Murió en 995/1587; con él terminó el sistema de beylerbeys de Argel, y Hasan Veneziano lo sucedió como kapudan {cite:dawlat-uthmaniyya-salabi p. 270-273}."
  fr: "Le kapudan pacha ottoman, une fois l'État établi à Tunis, se consacra à l'annexion du Maroc et reçut l'ordre de marcher. Il atteignit Alger en Jumada II 989/juin 1581. Mais Ahmad al-Mansur ferma les cols de son royaume, fortifia les côtes, envoya une ambassade à Istanbul et était sur le point de conclure un accord militaire avec l'Espagne. Le sultan accepta donc le fait accompli et ordonna à Uluj Ali et à son adjoint Jafar Pacha d'abandonner l'opération marocaine pour se tourner vers l'est, où le Hedjaz était en proie à l'agitation, mettant ainsi fin à son ambition de reconquérir al-Andalus. Il mourut en 995/1587; avec lui disparut le système des beylerbeys d'Alger, et Hasan Veneziano lui succéda comme kapudan (voir: Dawlat-Uthmaniyya-Salabi, p. 270-273)."
  ur: "عثمانی کپودن پاشا؛ ایک بار جب ریاست تیونس میں آباد ہو گئی تو اس نے مراکش کو الحاق کرنے پر اپنی نگاہیں مرکوز کیں اور اسے مارچ کرنے کا حکم دیا گیا، جمادۃ II 989/جون 1581 میں الجزائر پہنچ گیا۔ لیکن احمد المنصور نے اپنی بادشاہی کے راستے سیل کر دیے، ساحلوں کو مضبوط کر لیا، سفارت خانہ استنبول بھیجا اور سپاہ کے ساتھ ملٹری معاہدے کو تسلیم کر لیا۔ اور الوج علی اور اس کے نائب جعفر پاشا کو حکم دیا کہ وہ مشرق کی طرف مراکش کی کارروائی کو ترک کر دیں، جہاں حجاز پریشان ہو گیا تھا - اس کے الندولس کی بازیابی کے عزائم کو ختم کر دیا۔ ان کی وفات 995/1587 میں ہوئی۔ اس کے ساتھ ہی الجزائر کے بیلربی نظام کا خاتمہ ہوا، اور حسن وینزیانو اس کی جگہ کپودان بنا۔ 270-273}۔"
