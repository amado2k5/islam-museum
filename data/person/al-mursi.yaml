summary:
  ar: "المحدث المفسر النحوي؛ سمع الموطأ من أبي محمد ابن عبيد الله ورحل إلى أن وصل إلى أقصى خراسان وسمع الكشي من منصور الفراوي وأبي روح والكبار، وكان كثير الأسفار والتطواف جماعاً لفنون العلم ذكياً ثاقب الذهن له تصانيف كثيرة مع زهد وورع وفقر وتعفف؛ سئل عنه الحافظ الضياء فقال فقيه مناظر نحوي من أهل السنة صحبناه وما رأينا منه إلا خيراً {cite:shadharat-dhahab p. 277}."
  en: "The wandering mufassir-nahwi (b. 570) — heard the Muwatta, travelled to the far edge of Khurasan for the Kashshi; Diya al-Maqdisi called him 'faqih, debater, grammarian, of ahl al-sunna'; died mid-Rabi' I 655 on the road, buried at Tall Za'qa {cite:shadharat-dhahab p. 277}."
