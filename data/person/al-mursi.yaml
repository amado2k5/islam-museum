summary:
  ar: "المحدث المفسر النحوي؛ سمع الموطأ من أبي محمد ابن عبيد الله ورحل إلى أن وصل إلى أقصى خراسان وسمع الكشي من منصور الفراوي وأبي روح والكبار، وكان كثير الأسفار والتطواف جماعاً لفنون العلم ذكياً ثاقب الذهن له تصانيف كثيرة مع زهد وورع وفقر وتعفف؛ سئل عنه الحافظ الضياء فقال فقيه مناظر نحوي من أهل السنة صحبناه وما رأينا منه إلا خيراً {cite:shadharat-dhahab p. 277}."
  en: "The wandering mufassir-nahwi (b. 570) — heard the Muwatta, travelled to the far edge of Khurasan for the Kashshi; Diya al-Maqdisi called him 'faqih, debater, grammarian, of ahl al-sunna'; died mid-Rabi' I 655 on the road, buried at Tall Za'qa {cite:shadharat-dhahab p. 277}."
  fr: "Le moufassir-nahwi errant (né 570) – entendu le Muwatta, a voyagé à l'extrémité du Khurasan pour le Kashshi ; Diya al-Maqdisi l'a appelé « faqih, débatteur, grammairien, de ahl al-sunna » ; est mort mi-Rabi I 655 sur la route, enterré à Tall Za'qa {cite:shadharat-dhahab p. 277}."
  es: "El Mufassir-Nahwi errante (n. 570): escuchó al Muwatta, viajó hasta el extremo más alejado de Khurasan en busca de los Kashshi; Diya al-Maqdisi lo llamó 'faqih, polemista, gramático, de ahl al-sunna'; murió a mediados de Rabi' I 655 en el camino, enterrado en Tall Za'qa {cita: shadharat-dhahab p. 277}."
  ur: "آوارہ مفسر نوی ⁦(متوفی 570)⁩ - موطا سنا، کاشی کے لیے خراسان کے دور تک سفر کیا۔ دیاالمقدسی نے اسے 'فقیہ، مناظرہ کرنے والا، گرامر، اہل السنہ' کہا۔ ربیع الثانی 655 کے وسط میں سڑک پر فوت ہوئے، قد زعقاء میں دفن ہوئے۔ 277}۔"
  tr: "Hadis âlimi ve dilbilgisi tercümanı; Muwatta'yı Ebu Muhammed bin Ubeyd Allah'tan duydu ve Horasan'ın en uzak köşelerine kadar yolculuk etti. El-Kaşşi, Mansur el-Feravi, Ebu Ruh ve yaşlılardan duydu. Çeşitli bilimleri birleştirerek geniş çapta seyahat etti ve çevrede dolaştı, zeki ve keskin zihinliydi; birçok işi olan zahidlik, dindarlık, yoksulluk ve iffet ile birlikte. El-Hafız el-Diya hakkında soruldu ve şöyle dedi: Ehl-sünnetten bir fıkhih ve dilbilgici ona eşlik etti, ondan sadece iyilik gördük. {kaynak:Shadharat-Dhahab, s. 277}."
  id: "Ulama hadis dan penafsir tata bahasa; ia mendengar Muwatta' dari Abu Muhammad ibn Ubayd Allah dan melakukan perjalanan hingga mencapai penjuru terjauh Khorasan. Al-Kashshi mendengar dari Mansur al-Farawi, Abu Ruh, dan para tetua. Ia banyak bepergian dan mengelilingi dunia, menggabungkan berbagai ilmu, cerdas dan tajam, dengan banyak karya bersama asketisme, kesalehan, kemiskinan, dan kesucian. Al-Hafiz al-Diya ditanya tentang dirinya, dan ia berkata: Seorang ahli hukum dan tata bahasa dari Ahl al-Sunnah menemaninya, dan kami hanya melihat kebaikan darinya. {cite:Shadharat-Dhahab, hlm. 277}."
