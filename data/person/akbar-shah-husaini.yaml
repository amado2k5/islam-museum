id: person/akbar-shah-husaini
class: person
label: { ar: "أكبر شاه حسيني", en: "Akbar Shah Husaini", fr: "Akbar Shah Husaini", ur: "اکبر شاہ حسینی", es: "Akbar Shah Husaini" }
summary:
  ar: "شاعر صوفي ابن الشيخ شاه راجو وصديق السلطان أبي الحسن قطب شاه، درس الفلسفة والأدب الهندوسيين، وترجم كتبًا هندوسية إلى الفارسية وكتب رسائل بالسنسكريتية ولغات هندية {cite:zebrowski-deccani-painting-1983 p. 186}."
  en: "Mystical poet, son of Shah Raju and intimate friend of Sultan Abul Hasan Qutb Shah, a student of Hindu philosophy and literature who translated Hindu books into Persian and wrote treatises in Sanskrit and other Indian languages {cite:zebrowski-deccani-painting-1983 p. 186}."
  fr: "Poète mystique, fils de Shah Raju et ami intime du sultan Abul Hasan Qutb Shah, étudiant de la philosophie et de la littérature hindoues qui traduisit des livres hindous en persan et écrivit des traités en sanskrit et dans d’autres langues indiennes {cite:zebrowski-deccani-painting-1983 p. 186}."
  ur: "صوفی شاعر، شاہ راجو کے بیٹے اور سلطان ابو الحسن قطب شاہ کے گہرے دوست، ہندو فلسفہ و ادب کے طالب علم جنہوں نے ہندو کتابیں فارسی میں ترجمہ کیں اور سنسکرت اور دوسری ہندوستانی زبانوں میں رسائل لکھے {cite:zebrowski-deccani-painting-1983 p. 186}۔"
  es: "Poeta místico, hijo de Shah Raju y amigo íntimo del sultán Abul Hasan Qutb Shah, estudiante de filosofía y literatura hindú que tradujo libros hindúes al persa y escribió tratados en sánscrito y otras lenguas indias {cite:zebrowski-deccani-painting-1983 p. 186}."
  tr: "Şeyh Şah Raju'nun oğlu ve Sultan Ebu el-Hasan Kutub Şah'ın arkadaşı olan bir Sufi şair, Hindu felsefesi ve edebiyatı üzerine eğitim aldı, Hindu kitaplarını Farsçaya çevirdi ve Sanskritçe ve Hint dillerinde mektuplar yazdı. {cite:zebrowski-deccani-painting-1983 s. 186}"
  id: "Seorang penyair Sufi, putra Sheikh Shah Raju dan sahabat Sultan Abu al-Hasan Qutb Shah, ia mempelajari filsafat dan sastra Hindu, menerjemahkan buku-buku Hindu ke dalam bahasa Persia, dan menulis surat dalam bahasa Sansekerta dan bahasa-bahasa India {cite:zebrowski-deccani-painting-1983 p. 186}."
