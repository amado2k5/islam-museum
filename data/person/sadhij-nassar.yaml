summary:
  ar: "صحفية وناشطة فلسطينية من حيفا (1900–1970)، عملت مع زوجها نجيب نصار في جريدة الكرمل وأسّست فيها «صحيفة النساء» سنة 1926، وشاركت في تأسيس جمعية الاتحاد النسائي العربي بحيفا، وكانت أول فلسطينية تُعتقل سياسيًا في عهد الانتداب البريطاني، إذ احتُجزت أحد عشر شهرًا في بيت لحم سنة 1939؛ وبعد نكبة 1948 عاشت في لبنان ثم دمشق حيث توفيت."
  en: "Palestinian journalist and activist from Haifa (1900–1970). She worked with her husband Najib Nassar on the newspaper al-Karmil, founding its Women's Section in 1926, co-founded the Arab Women's Union in Haifa, and was the first Palestinian woman taken as a political prisoner under the British Mandate, held for eleven months in Bethlehem in 1939; after the Nakba of 1948 she lived in Lebanon and then Damascus, where she died."
  ur: "حیفہ سے تعلق رکھنے والی فلسطینی صحافی اور کارکن (1900–1970)۔ انہوں نے اپنے شوہر نجیب نصار کے ساتھ اخبار الکرمل میں کام کیا، 1926ء میں اس کا خواتین کا صفحہ قائم کیا، حیفہ میں عرب خواتین یونین کی تاسیس میں حصہ لیا، اور برطانوی انتداب کے دور میں سیاسی قیدی بننے والی پہلی فلسطینی خاتون بنیں؛ 1939ء میں انہیں گیارہ ماہ بیت لحم میں قید رکھا گیا؛ 1948ء کے نکبہ کے بعد وہ لبنان اور پھر دمشق میں رہیں جہاں ان کا انتقال ہوا۔"
