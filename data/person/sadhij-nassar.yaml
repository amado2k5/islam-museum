summary:
  ar: "صحفية وناشطة فلسطينية من حيفا (1900–1970)، عملت مع زوجها نجيب نصار في جريدة الكرمل وأسّست فيها «صحيفة النساء» سنة 1926، وشاركت في تأسيس جمعية الاتحاد النسائي العربي بحيفا، وكانت أول فلسطينية تُعتقل سياسيًا في عهد الانتداب البريطاني، إذ احتُجزت أحد عشر شهرًا في بيت لحم سنة 1939؛ وبعد نكبة 1948 عاشت في لبنان ثم دمشق حيث توفيت."
  en: "Palestinian journalist and activist from Haifa (1900–1970). She worked with her husband Najib Nassar on the newspaper al-Karmil, founding its Women's Section in 1926, co-founded the Arab Women's Union in Haifa, and was the first Palestinian woman taken as a political prisoner under the British Mandate, held for eleven months in Bethlehem in 1939; after the Nakba of 1948 she lived in Lebanon and then Damascus, where she died."
  ur: "حیفہ سے تعلق رکھنے والی فلسطینی صحافی اور کارکن (1900–1970)۔ انہوں نے اپنے شوہر نجیب نصار کے ساتھ اخبار الکرمل میں کام کیا، 1926ء میں اس کا خواتین کا صفحہ قائم کیا، حیفہ میں عرب خواتین یونین کی تاسیس میں حصہ لیا، اور برطانوی انتداب کے دور میں سیاسی قیدی بننے والی پہلی فلسطینی خاتون بنیں؛ 1939ء میں انہیں گیارہ ماہ بیت لحم میں قید رکھا گیا؛ 1948ء کے نکبہ کے بعد وہ لبنان اور پھر دمشق میں رہیں جہاں ان کا انتقال ہوا۔"
  es: "Periodista y activista palestina de Haifa (1900-1970). Trabajó con su esposo Najib Nassar en el periódico al-Karmil, fundando su sección femenina en 1926, cofundó la Unión de Mujeres Árabes en Haifa y fue la primera mujer palestina encarcelada como prisionera política bajo el Mandato Británico, permaneciendo recluida durante once meses en Belén en 1939. Tras la Nakba de 1948 vivió en el Líbano y luego en Damasco, donde falleció."
  fr: "Journaliste et militante palestinienne originaire de Haïfa (1900-1970). Elle travailla avec son mari Najib Nassar au journal al-Karmil, dont elle fonda la section féminine en 1926, co-fonda l'Union des femmes arabes à Haïfa et fut la première femme palestinienne faite prisonnière politique sous le mandat britannique, détenue pendant onze mois à Bethléem en 1939; après la Nakba de 1948, elle vécut au Liban puis à Damas, où elle mourut."
  tr: "Hayfa'dan Filistinli gazeteci ve aktivist olan Sherly, 1900–1970 yılları arasında Kocası Najib Nassar ile birlikte Al-Karmel gazetesinde çalıştı ve 1926'da \"Al-Nisa Gazetesi\"ni kurdu. Ayrıca Hayfa'da Arap Kadınlar Birliği Derneği'nin kurulmasına da katıldı. İngiliz Mandası döneminde siyasi olarak tutuklanan ilk Filistinli kadın oldu, 1939'da Beytüllahim'de on bir ay gözaltında kaldı; 1948 Nakba'sından sonra Lübnan'da ve ardından Şam'da yaşadı ve orada hayatını kaybetti."
  id: "Seorang jurnalis dan aktivis Palestina dari Haifa (1900–1970), ia bekerja bersama suaminya Najib Nassar di surat kabar Al-Karmel, di mana ia mendirikan \"Surat Kabar Al-Nisa\" pada tahun 1926. Ia juga berpartisipasi dalam pendirian Asosiasi Serikat Perempuan Arab di Haifa. Ia adalah wanita Palestina pertama yang ditangkap secara politik selama Mandat Inggris, ditahan selama sebelas bulan di Betlehem pada tahun 1939; setelah Nakba tahun 1948, ia tinggal di Lebanon dan kemudian di Damaskus, tempat ia meninggal."
