id: person/yazid-ibn-abi-muslim
class: person
label: { ar: "يزيد بن أبي مسلم" }
summary:
  ar: "عند البلاذري: مولى الحجاج بن يوسف ولّاه يزيد بن عبد الملك إفريقية والمغرب فقدمها سنة اثنتين ومائة فوسم حرسه من البربر على أيديهم بكلمة «حرسي» فتضافروا على قتله في مصلاه لصلاة المغرب. وأدخل على سليمان بن عبد الملك مكبلاً بالحديد فقال له سليمان عزمت عليك لتخبرني عن الحجاج أتراه يهوي بعد في جهنم أم قد استقر فيها فقال يا أمير المؤمنين قد بذل لكم نصحه وأحقن دونكم دمه وأمن وليكم وأخاف عدوكم وإنه يوم القيامة لعن يمين أبيك عبد الملك ويسار أخيك الوليد فاجعله حيث شئت، فأطلقه سليمان وقال قبحه الله ما كان أحسن ترتيبه لنفسه ولصاحبه {cite:muruj-al-dhahab p. 167} ويذكر الكتاب أن سليمان لما وقف عليه موثوقاً بالحديد سأله عن الحجاج، فرد بأن الحجاج بذل النصيحة وحفظ الذمة للخلفاء وأخاف عدوهم. {cite:salabi-umayyad-state-2020 p.151} ويذكر الكتاب أن عمر بن عبد العزيز كتب بعزله عن إفريقية، لأنه كان يتظاهر بالتأله ويأمر بتعذيب الناس، وكان يسبّح ويذكر الله أثناء التعذيب. {cite:salabi-umayyad-state-2020 p.202} ويذكر الكتاب أنه قُتل في إفريقية سنة 102هـ بعد أن عزم على رد أهل الذمة الذين أسلموا إلى قراهم ووضع الجزية على رقابهم، فقتله الجند ووليّ عليهم محمد بن يزيد، فكتب يزيد بن عبد الملك إليهم أنه لم يرض ما فعل، وأقر محمد بن يزيد على إفريقية. {cite:salabi-umayyad-state-2020 p.434-435}"
  en: "In al-Baladhuri: al-Hajjaj ibn Yusuf's mawla; Yazid ibn Abd al-Malik gave him Ifriqiya and the Maghreb, and he came in year 102 — he branded his Berber guard 'my guard' on their hands, so they conspired and killed him in his prayer-place at maghrib."
  es: "En al-Baladhuri: el mawla de al-Hajjaj ibn Yusuf; Yazid ibn Abd al-Malik le dio Ifriqiya y el Magreb, y él llegó en el año 102; marcó a su guardia bereber con 'mi guardia' en sus manos, por lo que conspiraron y lo mataron en su lugar de oración al mediodía."
  fr: "Dans al-Baladhuri: le mawla d'al-Hajjaj ibn Yusuf; Yazid ibn Abd al-Malik lui a donné l'Ifriqiya et le Maghreb, et il est venu en l'an 102 — il a marqué ses gardes berbères « ma garde » sur leurs mains, alors ils ont conspiré et l'ont tué dans son lieu de prière au maghrib."
  ur: "البلادوری میں ہے: الحجاج ابن یوسف کا مولا؛ یزید بن عبد الملک نے اسے افریقیہ اور مغرب دیا، اور وہ سنہ 102 میں آیا - اس نے اپنے بربر گارڈ کو ان کے ہاتھوں پر 'مائی گارڈ' کا نشان لگایا، تو انہوں نے سازش کی اور مغرب کے وقت اس کی نماز گاہ میں اسے قتل کردیا۔"
  tr: "El-Baladhuri'ye göre: O, el-Haccac bin Yusuf'un özgür kölesiydi. Yezid bin Abd al-Malik onu İfrikiye ve Mağrip'e atadı ve 102 Hicri yılında geldi. Berberi muhafızları tarafından 'Harsi' kelimesiyle işaretlendi ve Mağrip namazı için namazında onu öldürmek için güçlerini birleştirdiler. Süleyman bin Abdülmelik'e demir zincirlenmiş şekilde girdi. Süleyman ona, \"Sana el-Hacc hakkında bilgi vermeye karar verdim. Onun hala cehenneme battığını mı görüyorsun yoksa orada mı yerleşti?\" dedi. Dedi ki, \"Ey Müminlerin Komutanı, sana öğüt verdi, kanını bağışlayacağım ve koruyucunu güvence altına alacağım, düşmanından korkuyorum. Gerçekten de Diriliş Günü'nde babanı Abdülmelik'e ve kardeşin el-Velid'e lanet et, onu istediğin yere koy.\" Süleyman onu serbest bıraktı ve dedi ki, \"Allah onu rezil etsin; kendisi ve yoldaşları için daha iyi değildi.\" {atıf:Muruj-al-Dhahab, s. 167} Kitapta belirtilir ki, Süleyman onu demir ile güvenilir bulduğunda ona el-Haccaj hakkında soru sormuş, Süleyman ise halifelerin güvenini koruduğunu ve düşmanlarından korktuğuna karşılık vermiştir. {cite:selabi-umayyad-state-2020 s.151} Kitapta, Ömer bin Abdülaziz'in onu Ifriqiya'dan uzaklaştırmak için yazdığı, çünkü tanrı numarası yapmış gibi davrandığı ve insanlara işkence emrettiği belirtilir; işkence sırasında Allah'ı yüceltmiş ve hatırlamıştır. {cite:Selabi-Umayyad-state-2020 s.202} Kitapta, 102 Hicri yılında İfrikiye'de, köylerine dönen zimmileri göndermeye karar verdikten sonra öldürüldüğü ve boyunlarına cizye koyduğu belirtilir. Askerler onu öldürdü ve Muhammed bin Yezid onların başına atandı. Yezid bin Abdül-Malik onlara yaptıklarından memnun olmadığını yazdı ve Muhammed bin Yezid İfrikiyayı kabul etti. {atı:Selabi-Emevi-devlet-2020 s.434-435}"
  id: "Menurut al-Baladhuri: Ia telah dibebaskan sebagai budak al-Hajjaj ibn Yusuf. Yazid ibn Abd al-Malik menunjuknya ke Ifriqiya dan Maghreb, dan ia tiba pada tahun 102 H. Pengawal Berbernya ditandai dengan kata 'Harsi' oleh mereka, dan mereka bergabung untuk membunuhnya di tempat shalat Maghrib. Ia menyerang Sulayman ibn Abd al-Malik yang dirantai dengan besi. Sulayman berkata kepadanya, \"Aku telah bertekad memberitahumu tentang al-Hajjaj. Apakah kau melihat dia masih tenggelam ke Neraka atau dia menetap di sana?\" Ia berkata, \"Wahai Panglima Orang Beriman, dia telah memberimu nasihat, dan aku akan menyelamatkan darahnya dan mengamankan walimu, dan aku takut pada musuhmu. Memang, pada Hari Kebangkitan, kutuklah ayahmu Abd al-Malik dan saudaramu al-Walid, maka tempatkan dia di mana pun engkau mau.\" Maka Suleiman melepaskannya dan berkata, \"Semoga Allah mempermalukannya; dia tidak lebih baik untuk dirinya dan sahabatnya.\" {cite:muruj-al-dhahab, hlm. 167} Kitab itu menyebutkan bahwa ketika Suleiman merasa dia dapat dipercaya dengan besi, dia bertanya tentang al-Hajjaj, dan dia menjawab bahwa al-Hajjaj telah memberi nasihat dan menjaga kepercayaan para khalifah karena takut pada musuh mereka. {cite:salabi-umayyad-state-2020 hlm.151} Buku tersebut menyebutkan bahwa Umar ibn Abd al-Aziz menulis untuk menyingkirkannya dari Ifriqiya karena ia berpura-pura didewakan dan memerintahkan penyiksaan orang, dan ia memuliakan serta mengingat Tuhan selama penyiksaan itu. {cite:salabi-umayyad-state-2020 hlm.202} Buku tersebut menyebutkan bahwa ia dibunuh di Ifriqiya pada tahun 102 H setelah ia memutuskan mengirim para dhimmi yang telah berpindah ke desa mereka dan memaksakan jizya di leher mereka. Para tentara membunuhnya dan Muhammad ibn Yazid diangkat menjadi pengawas. Yazid ibn Abd al-Malik menulis kepada mereka bahwa ia tidak puas dengan apa yang telah dilakukannya, dan Muhammad ibn Yazid mengakui Ifriqiya. {cite:salabi-umayyad-state-2020 hlm.434-435}"
