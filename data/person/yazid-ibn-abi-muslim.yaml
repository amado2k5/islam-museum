id: person/yazid-ibn-abi-muslim
class: person
label: { ar: "يزيد بن أبي مسلم" }
summary:
  ar: "عند البلاذري: مولى الحجاج بن يوسف ولّاه يزيد بن عبد الملك إفريقية والمغرب فقدمها سنة اثنتين ومائة فوسم حرسه من البربر على أيديهم بكلمة «حرسي» فتضافروا على قتله في مصلاه لصلاة المغرب. وأدخل على سليمان بن عبد الملك مكبلاً بالحديد فقال له سليمان عزمت عليك لتخبرني عن الحجاج أتراه يهوي بعد في جهنم أم قد استقر فيها فقال يا أمير المؤمنين قد بذل لكم نصحه وأحقن دونكم دمه وأمن وليكم وأخاف عدوكم وإنه يوم القيامة لعن يمين أبيك عبد الملك ويسار أخيك الوليد فاجعله حيث شئت، فأطلقه سليمان وقال قبحه الله ما كان أحسن ترتيبه لنفسه ولصاحبه {cite:muruj-al-dhahab p. 167} ويذكر الكتاب أن سليمان لما وقف عليه موثوقاً بالحديد سأله عن الحجاج، فرد بأن الحجاج بذل النصيحة وحفظ الذمة للخلفاء وأخاف عدوهم. {cite:salabi-umayyad-state-2020 p.151} ويذكر الكتاب أن عمر بن عبد العزيز كتب بعزله عن إفريقية، لأنه كان يتظاهر بالتأله ويأمر بتعذيب الناس، وكان يسبّح ويذكر الله أثناء التعذيب. {cite:salabi-umayyad-state-2020 p.202} ويذكر الكتاب أنه قُتل في إفريقية سنة 102هـ بعد أن عزم على رد أهل الذمة الذين أسلموا إلى قراهم ووضع الجزية على رقابهم، فقتله الجند ووليّ عليهم محمد بن يزيد، فكتب يزيد بن عبد الملك إليهم أنه لم يرض ما فعل، وأقر محمد بن يزيد على إفريقية. {cite:salabi-umayyad-state-2020 p.434-435}"
  en: "In al-Baladhuri: al-Hajjaj ibn Yusuf's mawla; Yazid ibn Abd al-Malik gave him Ifriqiya and the Maghreb, and he came in year 102 — he branded his Berber guard 'my guard' on their hands, so they conspired and killed him in his prayer-place at maghrib."
