summary:
  ar: "صحابي سلمي أنصاري، أخو معاذ بن عمرو الجموح؛ ذكره موسى بن عقبة وأبو معشر والواقدي فيمن شهد بدراً أو أحداً."
  en: "A Salimi Ansari Companion, brother of Mu'adh ibn Amr al-Jamuh; Musa ibn Uqba, Abu Ma'shar and al-Waqidi name him among those who witnessed Badr or Uhud."
  ur: "سلمی انصاری صحابی، معاذ بن عمرو بن جموح کا بھائی؛ موسی بن عقبہ، ابو معشر اور واقدی اسے بدر میں شریک گناتے ہیں۔"
  es: "Un compañero de Salimi Ansari, hermano de Mu'adh ibn Amr al-Jamuh; Musa ibn Uqba, Abu Ma'shar y al-Waqidi lo nombran entre los que presenciaron Badr o Uhud."
  fr: "Un Compagnon Salimi Ansari, frère de Mu'adh ibn Amr al-Jamuh; Musa ibn Uqba, Abu Ma'shar et al-Waqidi le citent parmi ceux qui ont été témoins de Badr ou d'Uhud."
  tr: "Selma el-Ensari'nin bir yoldaşı, Mu'adh bin Amr al-Jamuh'un kardeşi; Musa ibn Uqbah, Ebu Ma'shar ve el-Vaqidi tarafından Badr veya Uhud'a tanıklık edenler arasında anılmıştır."
  id: "Sahabat Salma al-Ansari, saudara Mu'adh ibn Amr al-Jamuh; ia disebutkan oleh Musa ibn Uqbah, Abu Ma'shar, dan al-Waqidi di antara mereka yang menyaksikan Badr atau Uhud."
