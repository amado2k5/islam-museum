summary:
  ar: "القاضي ضياء الدين أبو الفضائل القاسم بن القاضي تاج الدين أبي طاهر يحيى بن عبد الله؛ سمع الحديث بالإسكندرية من الحافظ أبي طاهر السلفي وروى عن عمارة اليمني الفقيه شيئاً من شعره؛ تولى القضاء بدمشق بعد عمه كمال الدين بوصية من عمه تاج الدين أنفذها السلطان فأقام به مدة ثم عرف أن ميل السلطان إلى الشيخ شرف الدين ابن أبي عصرون فسأله الإقالة فأقاله وتولى شرف الدين؛ ولما مات صلاح الدين سُمِّر ولده الملك الأفضل نور الدين علي له على نظر الأوقاف بدمشق؛ ثم فارق دمشق وانتدب إلى حماة فولاه الملك المنصور ناصر الدين محمد بن تقي الدين عمر القضاء بها فأقام إلى أن مات وله شعر {cite:wafayat-ayan}."
  en: "Qadi Diya al-Din al-Qasim (554–599) — qadi of Damascus by his uncle's testament, then stepped aside for Sharaf al-Din Ibn Abi Asrun when he saw the sultan's preference; ended as qadi of Hama under al-Malik al-Mansur Muhammad b. Taqi al-Din {cite:wafayat-ayan}."
