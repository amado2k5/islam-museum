summary:
  ar: "القاضي ضياء الدين أبو الفضائل القاسم بن القاضي تاج الدين أبي طاهر يحيى بن عبد الله؛ سمع الحديث بالإسكندرية من الحافظ أبي طاهر السلفي وروى عن عمارة اليمني الفقيه شيئاً من شعره؛ تولى القضاء بدمشق بعد عمه كمال الدين بوصية من عمه تاج الدين أنفذها السلطان فأقام به مدة ثم عرف أن ميل السلطان إلى الشيخ شرف الدين ابن أبي عصرون فسأله الإقالة فأقاله وتولى شرف الدين؛ ولما مات صلاح الدين سُمِّر ولده الملك الأفضل نور الدين علي له على نظر الأوقاف بدمشق؛ ثم فارق دمشق وانتدب إلى حماة فولاه الملك المنصور ناصر الدين محمد بن تقي الدين عمر القضاء بها فأقام إلى أن مات وله شعر {cite:wafayat-ayan}."
  en: "Qadi Diya al-Din al-Qasim (554–599) — qadi of Damascus by his uncle's testament, then stepped aside for Sharaf al-Din Ibn Abi Asrun when he saw the sultan's preference; ended as qadi of Hama under al-Malik al-Mansur Muhammad b. Taqi al-Din {cite:wafayat-ayan}."
  es: "Qadi Diya al-Din al-Qasim (554–599): cadí de Damasco según el testamento de su tío, luego se hizo a un lado por Sharaf al-Din Ibn Abi Asrun cuando vio la preferencia del sultán; Terminó como cadí de Hama bajo al-Malik al-Mansur Muhammad b. Taqi al-Din {cita:wafayat-ayan}."
  fr: "Qadi Diya al-Din al-Qasim (554-599) — cadi de Damas par le testament de son oncle, puis s'est écarté pour Sharaf al-Din Ibn Abi Asrun lorsqu'il a vu la préférence du sultan; terminé comme cadi de Hama sous al-Malik al-Mansur Muhammad b. Taqi al-Din {cite: wafayat-ayan}."
  ur: "قادی دیا الدین القاسم (554-599) - اپنے چچا کے وصیت کے مطابق دمشق کا قاضی، پھر جب اس نے سلطان کی ترجیح دیکھی تو شرف الدین ابن ابی عصرون کے لیے الگ ہو گیا۔ المالک المنصور محمد بن کے دور میں حما کے قاضی کے طور پر ختم ہوا۔ تقی الدین۔"
  tr: "Hakim Diya'ddin Ebu el-Fada'il el-Kasım bin el-Kaddi Taceddin Ebu Tahir Yahya ibn Abdullah; İskenderiye'de hadis alimi Ebu Tahir el-Selefi'den hadis duydu ve Yemenli fihih Amar'dan bazı şiirlerini anlattı. Amcası Kamaleddin'den sonra, amcası Tac Din'in vasiyetiyle Şam'da yargıyı devraldı; Sultan bu vasiyeti yerine getirdi ve bir süre orada kaldı. Sultanın şeyhi kayırdığını öğrendi Sharaf al-Din ibn Ebi Asrun, bu yüzden görevden alınmasını istedi ve onu görevden aldı. Şeraf el-Din Şeraf Din görevini üstlendi. Salah al-Din öldüğünde, oğlu el-Afdal el-Malik Nur al-Din Ali onu Şam'daki vakıfların başına atadı. Daha sonra Şam'dan ayrıldı ve Hama'ya geçici olarak atandı. Kral el-Mensur Nasir el-Din Muhammed ibn Taqi al-Din Omar onu orada yargıç olarak atadı ve ölümüne kadar orada kaldı. Şiirleri vardır {alıntı: Wafayat-ayan}."
  id: "Hakim Diya' al-Din Abu al-Fada'il al-Qasim ibn al-Qadi Taj al-Din Abu Tahir Yahya ibn Abdullah; ia mendengar hadis di Alexandria dari ulama hadis Abu Tahir al-Salafi dan menceritakan beberapa puisinya dari ahli hukum Yaman, Amar. Ia mengambil alih kehakiman di Damaskus setelah pamannya Kamal al-Din melalui wasiat pamannya Taj al-Din, yang kemudian dieksekusi oleh Sultan, dan ia tinggal di sana untuk sementara waktu. Ia mengetahui bahwa sultan lebih menyukai Sheikh Sharaf al-Din -Din ibn Abi Asrun, maka ia meminta pemecatan, dan ia memecatnya. Sharaf al-Din mengambil alih posisi Sharaf al-Din. Ketika Salah al-Din wafat, putranya al-Afdal al-Malik Nur al-Din Ali mengangkatnya sebagai kepala dana di Damaskus. Ia kemudian meninggalkan Damaskus dan dipinjamkan ke Hama. Raja al-Mansur Nasir al-Din Muhammad ibn Taqi al-Din Omar mengangkatnya sebagai hakim di sana, dan ia tetap di sana hingga wafat. Ia memiliki puisi {cite:Wafayat-Ayan}."
