summary:
  ar: "أبو سهل محمد بن سليمان بن هارون الصعلوكي الحنفي، من بني حنيفة، صاحب أبي إسحاق المروزي. مات في آخر سنة تسع وستين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 60}، وكان فقيهاً أديباً شاعراً متكلماً مفسراً صوفياً كاتباً، وعنه أخذ ابنه أبو الطيب وفقهاء نيسابور {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  en: "Abu Sahl Muhammad ibn Sulayman ibn Harun al-Su'luki al-Hanafi, of the Banu Hanifa, a companion of Abu Ishaq al-Marwazi. He died at the end of the year 369 AH {cite:tabaqat-fuqaha-abbas-1981 p. 60}; he was a jurist, man of letters, poet, theologian (mutakallim), exegete (mufassir), Sufi and writer, and his son Abu al-Tayyib and the jurists of Nishapur learned from him {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
