summary:
  ar: "إلياس بن مضر بن نزار بن معد جد بطون قريش، كان ولده من ليلى بنت حلوان بن عمران بن الحاف بن قضاعة وهي خندف: عمرو وهو مدركة، وعامر وهو طابخة، وعمير وهو قمعة، ونسب ولد إلياس إلى أمهم خندف على ما ذهب إليه قصي بن كلاب في شعره أمي خندف والياس أبي {cite:muruj-al-dhahab p. 567}."
  en: "Quraysh's forebear whose sons by Khindif — 'Amr, 'Amir and 'Umayr, better known as Mudrika, Tabikha and Qama'a — were reckoned by their mother in Qusayy's boast {cite:muruj-al-dhahab p. 567}."
