  es: "Banquera emiratí; consejera delegada del Grupo First Abu Dhabi Bank (FAB) desde 2021, la primera mujer en dirigir el banco más grande de los Emiratos Árabes Unidos, tras una trayectoria profesional que abarca instituciones bancarias y de desarrollo humano."
  fr: "Banquière émiratie; PDG du groupe First Abu Dhabi Bank (FAB) depuis 2021, la première femme à diriger la plus grande banque des Émirats arabes unis, après une carrière qui s'étend sur les secteurs bancaire et des institutions de développement humain."
