  ar: مصرفية إماراتية؛ الرئيس التنفيذي لمجموعة بنك أبوظبي الأول ⁦(FAB)⁩ منذ 2021، أول امرأة تقود أكبر مصرف في الإمارات، بعد مسيرة في القطاع المصرفي والتطوير البشري.
  en: Emirati banker; Group CEO of First Abu Dhabi Bank (FAB) since 2021, the first woman to lead the UAE's largest bank, after a career spanning banking and human-development institutions.
