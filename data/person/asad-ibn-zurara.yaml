  ur: "یثرب کے خزرجی بنو نجار کے سردار؛ عقبہ میں اسلام قبول کرنے والے ابتدائی چھ افراد میں شامل تھے اور بنو نجار کے نقیب مقرر ہوئے۔ {cite:mubarakpuri-raheeq}"
