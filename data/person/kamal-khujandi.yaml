faith:
  - value: sufi
    basis: documented
    note: "His Sufi mastership is attested for the man himself by two independent scholarly traditions: Iranica's entry (Losensky) opens 'Persian poet and Sufi', records that he established his reputation as a Sufi shaikh in Khujand and Transoxiana, and describes the khanqah at Waliankuh in Tabriz — granted by Sultan Husayn Jalayirid — as the base of his spiritual activity, his divan collected by his disciples and his burial at his retreat; the Persian biographical tradition (Dehkhoda; Safa's History of Literature, behind the Persian biography) likewise counts him among the 'arifan and describes the khanqah life. No source names an ORDER for him — no Naqshbandi, Khalwati or other affiliation is attested anywhere read — and no source names a school of law; the segment therefore records Sufism itself, not an order and not a madhhab."
    sources:
      - source/iranica-kamal-kojandi
      - source/wikipedia-kamal-khujandi-fa

