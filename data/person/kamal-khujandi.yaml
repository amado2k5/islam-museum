summary:
  ar: "شاعر فارسي وصوفي من خجند (نحو 1320-1400)، اسمه الكامل كمال الدين مسعود، عُرف بشيخ كمال. ذاع صيته شاعراً وشيخاً صوفياً في خجند وما وراء النهر، ثم ارتحل غرباً فاستقر في تبريز، حيث بنى له السلطان حسين الجلائري خانقاه في وليانكوه جعلها مقر نشاطه الأدبي والروحي، وجمع مريدوه ديوانه من بعده. أسره طقطمش خان سنة 1385 وحمله إلى سراي فأقام بها أربع سنين. توفي في تبريز ودُفن عند مرقده. لا يذكر أي مصدر طريقةً صوفية بعينها انتسب إليها."
  en: "Persian poet and Sufi of Khujand (c. 1320–1400), full name Kamal al-Din Mas'ud, known as Shaykh Kamal. He made his reputation as a poet and a Sufi shaikh in Khujand and Transoxiana, then travelled west and settled in Tabriz, where Sultan Husayn Jalayirid built him a khanqah at Waliankuh that became the base of his literary and spiritual activity; his disciples collected his divan. Carried off to Saray by Toqtamish Khan in 1385, he lived there four years before returning to Tabriz, where he died and was buried at his retreat. No source names a Sufi order to which he belonged."
  ur: "خجند کے فارسی شاعر اور صوفی (تقریباً 1320ء–1400ء)، پورا نام کمال الدین مسعود، جو شیخ کمال کے نام سے معروف ہوئے۔ انھوں نے خجند اور ماوراء النہر میں شاعر اور صوفی شیخ کی حیثیت سے شہرت پائی، پھر مغرب کا رخ کیا اور تبریز میں بس گئے، جہاں سلطان حسین جلایری نے ان کے لیے ولیان کوہ میں ایک خانقاہ بنوائی جو ان کی ادبی و روحانی سرگرمیوں کا مرکز بنی؛ ان کے مریدوں نے ان کا دیوان مرتب کیا۔ 1385ء میں توقتمش خان انھیں سرائے لے گیا، جہاں وہ چار برس رہے، پھر تبریز لوٹے اور وہیں وفات پائی اور اپنے مرقد میں دفن ہوئے۔ کسی ماخذ میں ان کے کسی صوفی سلسلے سے انتساب کا ذکر نہیں۔"

