summary:
  ar: "أبو الفتح ابن التعاويذي محمد بن عبد الله الكاتب الشاعر المشهور؛ نسب إلى التعاويذي لأنه نشأ في حجره وهو جده لأمه، وكان شاعراً لطيفاً عذب الكلام سهل الألفاظ سار نظمه في الآفاق وتقدم على شعراء العراق، قال ابن خلكان كان شاعر وقته لم يكن فيه مثله، جمع شعره بين جزالة الألفاظ وعذوبتها ورقة المعاني ودقتها وهو في غاية الحسن والحلاوة، وفيما أعتقده لم يكن قبله بمائتي سنة من يضاهيه؛ وعمي في آخر عمره وجمع ديوانه بنفسه قبل العمى وعمل له خطبة ظريفة ورتبه أربعة فصول وكل ما جدده بعد ذلك سماه الزيادات، وله في عماه أشياء يرثي بها عينيه وزمان شبابه، وكان له باسمه راتب في الديوان فالتمس أن يُنقل باسم أولاده فنُقل؛ توفي سنة أربع وثمانين وخمسمائة {cite:shadharat-dhahab p. 761}."
  en: "Abu al-Fath Muhammad b. Abdallah Ibn al-Ta'awidhi, the celebrated scribe-poet; named for his maternal grandfather al-Ta'awidhi who raised him. A tender poet, sweet of speech, easy of wording, his verse flew the horizons and he led the poets of Iraq — Ibn Khallikan calls him the poet of his age without equal, joining strength of phrase to sweetness, delicacy of meaning to precision, and in his belief no one in two hundred years had matched him. Blind in later life, he had already gathered his own diwan with a clever four-part preface, naming later additions 'the Supplements'; in blindness he wrote elegies on his eyes and his youth. His diwan stipend was transferred at his request to his sons' names. He died in 584 {cite:shadharat-dhahab p. 761}."
