summary:
  ar: "أبو الفتح ابن التعاويذي محمد بن عبد الله الكاتب الشاعر المشهور؛ نسب إلى التعاويذي لأنه نشأ في حجره وهو جده لأمه، وكان شاعراً لطيفاً عذب الكلام سهل الألفاظ سار نظمه في الآفاق وتقدم على شعراء العراق، قال ابن خلكان كان شاعر وقته لم يكن فيه مثله، جمع شعره بين جزالة الألفاظ وعذوبتها ورقة المعاني ودقتها وهو في غاية الحسن والحلاوة، وفيما أعتقده لم يكن قبله بمائتي سنة من يضاهيه؛ وعمي في آخر عمره وجمع ديوانه بنفسه قبل العمى وعمل له خطبة ظريفة ورتبه أربعة فصول وكل ما جدده بعد ذلك سماه الزيادات، وله في عماه أشياء يرثي بها عينيه وزمان شبابه، وكان له باسمه راتب في الديوان فالتمس أن يُنقل باسم أولاده فنُقل؛ توفي سنة أربع وثمانين وخمسمائة {cite:shadharat-dhahab p. 761}."
  en: "Abu al-Fath Muhammad b. Abdallah Ibn al-Ta'awidhi, the celebrated scribe-poet; named for his maternal grandfather al-Ta'awidhi who raised him. A tender poet, sweet of speech, easy of wording, his verse flew the horizons and he led the poets of Iraq — Ibn Khallikan calls him the poet of his age without equal, joining strength of phrase to sweetness, delicacy of meaning to precision, and in his belief no one in two hundred years had matched him. Blind in later life, he had already gathered his own diwan with a clever four-part preface, naming later additions 'the Supplements'; in blindness he wrote elegies on his eyes and his youth. His diwan stipend was transferred at his request to his sons' names. He died in 584 {cite:shadharat-dhahab p. 761}."
  fr: "Abu al-Fath Muhammad b. Abdallah Ibn al-Ta'awidhi, le célèbre poète secrétaire ; nommé d'après son grand-père maternel al-Ta'awidhi, qui l'éleva. Poète tendre, à la parole douce et à l'expression aisée, ses vers parcoururent les horizons et il domina les poètes d'Iraq — Ibn Khallikan l'appelle le poète de son temps, sans égal, joignant la force de l'expression à la douceur, la délicatesse du sens à la précision, et à son avis personne en deux cents ans ne l'avait égalé. Devenu aveugle à la fin de sa vie, il avait déjà réuni lui-même son diwan avec une préface ingénieuse en quatre parties, nommant les ajouts ultérieurs « les Suppléments » ; aveugle, il écrivit des élégies sur ses yeux et sa jeunesse. Sa pension du diwan fut transférée, à sa demande, au nom de ses fils. Il mourut en 584 {cite:shadharat-dhahab p. 761}."
  es: "Abu al-Fath Muhammad b. Abdallah Ibn al-Ta'awidhi, el célebre escriba y poeta, recibió su nombre en honor a su abuelo materno, al-Ta'awidhi, quien lo crió. Poeta tierno, de dulce elocuencia y fluidez expresiva, sus versos trascendieron fronteras y lideró a los poetas de Irak. Ibn Khallikan lo considera el poeta sin igual de su época, que combinaba fuerza expresiva con dulzura, delicadeza de significado con precisión, y creía que nadie en doscientos años lo había igualado. Ciego en su vejez, ya había reunido su propio diván con un ingenioso prefacio en cuatro partes, denominando a las adiciones posteriores «los Suplementos». En su ceguera, escribió elegías sobre sus ojos y su juventud. Su estipendio del diván fue transferido, a petición suya, a los nombres de sus hijos. Murió en 584 {cite:shadharat-dhahab p. 761}."
  ur: "ابو الفتح محمد ب۔ عبداللہ ابن التویذی، مشہور مصنف شاعر؛ اس کا نام ان کے نانا التویدھی کے نام پر رکھا گیا جس نے ان کی پرورش کی۔ نرم مزاج شاعر، لہجے میں شیریں، لفظوں میں آسان، اس کی نظم نے افق پر اڑان بھری اور اس نے عراق کے شاعروں کی رہنمائی کی، ابن خلیقان اسے اپنے زمانے کا شاعر کہتا ہے، جس میں فقرے کی طاقت مٹھاس، معنویت کی نزاکت اور نفاست سے ملتی ہے، اور ان کے عقیدے میں دو سو سال میں کوئی بھی اس سے مماثلت نہیں رکھتا تھا۔ بعد کی زندگی میں نابینا، اس نے پہلے ہی ایک ہوشیار چار حصوں پر مشتمل دیوان کے ساتھ اپنا دیوان جمع کر لیا تھا، بعد میں اضافے کو 'دی سپلیمنٹس' کا نام دیا تھا۔ اندھے پن میں اس نے اپنی آنکھوں اور اپنی جوانی پر افسانے لکھے۔ ان کا دیوان وظیفہ ان کی درخواست پر ان کے بیٹوں کے نام منتقل کر دیا گیا۔ ان کی وفات 584ھ میں ہوئی۔ 761}۔"
  tr: "Ünlü yazar ve şair Ebu el-Feth İbn el-Ta'avidhi, Muhammed ibn Abdullah; Ta'avidhi'nin yanında büyüdüğü ve anne tarafından dedesi olduğu için onun adını almıştır. Tatlı sözleriyle ve akıcı üslubuyla nazik bir şairdi ve şiirleri geniş bir alana yayılmış, Irak şairlerini geride bırakmıştır. İbn Hallikan, onun zamanının şairi olduğunu ve onun gibisinin olmadığını söylemiştir. Şiirleri, sözcüklerin belagat ve tatlılığını, anlamların inceliği ve kesinliğiyle birleştirmiş, son derece güzel ve tatlı olmuştur. Bildiğim kadarıyla, ondan önce iki yüz yıl boyunca ona denk bir şair olmamıştır. Hayatının sonlarında kör olmuş ve kör olmadan önce Divan'ını kendisi derlemiş, ona zekice bir giriş yazmış ve dört bölüme ayırmıştır; daha sonra eklediği her şeye eklemeler demiştir. Kör olduğu dönemde, gözlerine ve gençlik yıllarına duyduğu özlemi dile getirdiği şeyler yazmıştır. Divan'da kendi adına kayıtlı bir maaşı vardı, bu yüzden maaşının çocuklarının adına geçirilmesini istedi ve bu isteği kabul edildi. Hicri 584 yılında vefat etti."
  id: "Abu al-Fath Ibn al-Ta’awidhi, Muhammad ibn Abdullah, penulis dan penyair terkenal; ia diberi nama al-Ta’awidhi karena dibesarkan di bawah asuhannya, dan al-Ta’awidhi adalah kakek dari pihak ibunya. Ia adalah penyair yang lembut dengan kata-kata yang manis dan diksi yang mudah, dan puisinya tersebar luas, dan ia melampaui para penyair Irak. Ibn Khallikan mengatakan bahwa ia adalah penyair pada zamannya, dan tidak ada seorang pun yang seperti dia. Puisinya menggabungkan kefasihan dan kemanisan kata-kata dengan kehalusan dan ketepatan makna, dan sangat indah dan manis. Sejauh yang saya ketahui, tidak ada seorang pun yang menyamainya selama dua ratus tahun sebelumnya. Ia menjadi buta di akhir hayatnya, dan ia menyusun Diwannya sendiri sebelum kebutaannya, dan ia menulis pengantar yang cerdas untuknya dan menyusunnya menjadi empat bab, dan semua yang ia tambahkan setelah itu disebut tambahan. Ia menulis hal-hal selama kebutaannya di mana ia meratapi penglihatannya dan masa mudanya. Ia memiliki gaji yang tercatat atas namanya di Diwan, sehingga ia meminta agar gaji tersebut dialihkan atas nama anak-anaknya, dan permohonannya dikabulkan. Ia meninggal pada tahun 584 Hijriah."
