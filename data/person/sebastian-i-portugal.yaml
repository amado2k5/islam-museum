summary:
  ar: "ملك البرتغال الشاب؛ قبل عرض المتوكل المخلوع التنازل عن شواطئ المغرب مقابل طرد عمه، وجمع عشرات الألوف من الأسبان والبرتغاليين والطليان والألمان في ألف مركب — تقديرات المؤرخين بين ثمانين ألفاً ومائة وخمسة وعشرين — راغباً بحرب مقدسة تعلو شأنه بين ملوك أوروبا في وصف الصلابي. ورد على خطاب عبد الملك التحدي بالتريث مخالفاً مشورة أركان جيشه، وقُتل في وادي المخازن يوم ٣٠ جمادى الآخرة ٩٨٦هـ/٤ أغسطس ١٥٧٨م، فسقط نجم البرتغال وتهاوت قوتها كما يصف مؤرخها لويس ماريه {cite:dawlat-uthmaniyya-salabi p. 260-267}."
  en: "The young king of Portugal; he accepted the deposed al-Mutawakkil's offer of Morocco's coasts for his uncle's expulsion, massed tens of thousands — chroniclers say between eighty and a hundred and twenty-five thousand — of Spanish, Portuguese, Italians and Germans in a thousand ships, desiring, in al-Salabi's words, a holy war to raise his name among Europe's kings. To Abd al-Malik's taunting letter he answered by delay against his commanders' counsel; he was killed at Wadi al-Makhazin, 30 Jumada II 986/4 August 1578, and Portugal's star sank as her own historian Luís de Menezes mourns {cite:dawlat-uthmaniyya-salabi p. 260-267}."
  es: "El joven rey de Portugal aceptó la oferta del depuesto al-Mutawakkil de las costas de Marruecos a cambio de la expulsión de su tío, y reunió a decenas de miles —los cronistas dicen entre ochenta y ciento veinticinco mil— de españoles, portugueses, italianos y alemanes en mil barcos, deseando, en palabras de al-Salabi, una guerra santa para enaltecer su nombre entre los reyes de Europa. A la carta burlona de Abd al-Malik respondió con dilación, en contra del consejo de sus comandantes; murió en Wadi al-Makhazin el 30 de Jumada II de 986/4 de agosto de 1578, y la estrella de Portugal se hundió, como lamenta su propio historiador Luís de Menezes {cite:dawlat-uthmaniyya-salabi p. 260-267}."
  fr: "Le jeune roi du Portugal, ayant accepté l'offre du déchu al-Mutawakkil de lui céder les côtes marocaines en échange de l'expulsion de son oncle, rassembla des dizaines de milliers d'hommes – les chroniqueurs parlent de quatre-vingts à cent vingt-cinq mille – d'Espagnols, de Portugais, d'Italiens et d'Allemands à bord d'un millier de navires, désirant, selon les termes d'al-Salabi, une guerre sainte pour asseoir son nom parmi les rois d'Europe. À la lettre provocatrice d'Abd al-Malik, il répondit par un sursis, contre l'avis de ses commandants; il fut tué à Wadi al-Makhazin, le 30 Jumada II 986 (4 août 1578), et le Portugal connut un déclin, comme le déplore son propre historien, Luís de Menezes (voir: Dawlat-Uthmaniyya-Salabi, p. 260-267)."
  ur: "پرتگال کے نوجوان بادشاہ؛ اس نے معزول المتوکل کی اپنے چچا کی بے دخلی کے لیے مراکش کے ساحلوں کی پیشکش کو قبول کر لیا، جس کی تعداد دسیوں ہزار تھی - تاریخ نگاروں کا کہنا ہے کہ اسی سے ایک لاکھ پچیس ہزار کے درمیان - ہسپانوی، پرتگالی، اطالویوں اور جرمنوں کے ایک ہزار بحری جہازوں میں، جس کی خواہش تھی، یورپ کے جنگجوؤں کے درمیان اس کے نام کا اعلان کیا گیا۔ بادشاہ عبد الملک کے طنزیہ خط کا اس نے اپنے کمانڈروں کے مشورے کے خلاف تاخیر سے جواب دیا۔ وہ وادی المخازین، 30 جمادی الثانی 986/4 اگست 1578 میں مارا گیا، اور پرتگال کا ستارہ اس وقت ڈوب گیا جب اس کے اپنے مورخ لوئس ڈی مینیز نے سوگ منایا۔ 260-267}۔"
