summary:
  ar: "صحابي أنصاري أوسي يعرف بكنيته واسمه مالك، من بليّ حليف بني عبد الأشهل؛ كان نقيباً في بيعة العقبة الثانية وأول من بايع، وشهد بدراً والمشاهد، وآخى النبي بينه وبين عثمان بن مظعون، واختُلف في وفاته بين حياة النبي وسنة إحدى وعشرين والقتل بصفين."
  en: "An Awsi Ansari Companion known by his kunya, named Malik, of Bali and an ally of Banu Abd al-Ashhal; their naqib at the second pledge of Aqaba and the first to give his hand. He witnessed Badr and all the battles, was paired in brotherhood with Uthman ibn Maz'un, and his death is reported variously in the Prophet's lifetime, in 21 AH, or at Siffin."
  ur: "اوسی انصاری صحابی، کنیت سے مشہور، نام مالک، بلی کے اور بنو عبد الاشہل کے حلیف؛ دوسری بیعت عقبہ میں ان کے نقیب۔"
  fr: "Compagnon ansari des Aws connu par sa kunya, de son nom Malik, des Bali et allié des Banu Abd al-Ashhal ; leur naqib au second serment d'Aqaba et le premier à donner sa main. Il fut présent à Badr et à toutes les batailles, fut uni en fraternité à Uthman ibn Maz'un, et sa mort est rapportée diversement du vivant du Prophète, en 21 H, ou à Siffin."
  es: "Un compañero de los Ansari de la tribu Awsi, conocido por su kunya, llamado Malik, originario de Bali y aliado de los Banu Abd al-Ashhal; fue su naqib en el segundo juramento de Aqaba y el primero en entregar su mano. Presenció Badr y todas las batallas, fue hermano de Uthman ibn Maz'un, y su muerte se narra de diversas maneras: en vida del Profeta, en el año 21 de la Hégira, o en Siffin."
