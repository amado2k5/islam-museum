summary:
  ar: "صحابي أنصاري أوسي يعرف بكنيته واسمه مالك، من بليّ حليف بني عبد الأشهل؛ كان نقيباً في بيعة العقبة الثانية وأول من بايع، وشهد بدراً والمشاهد، وآخى النبي بينه وبين عثمان بن مظعون، واختُلف في وفاته بين حياة النبي وسنة إحدى وعشرين والقتل بصفين."
  en: "An Awsi Ansari Companion known by his kunya, named Malik, of Bali and an ally of Banu Abd al-Ashhal; their naqib at the second pledge of Aqaba and the first to give his hand. He witnessed Badr and all the battles, was paired in brotherhood with Uthman ibn Maz'un, and his death is reported variously in the Prophet's lifetime, in 21 AH, or at Siffin."
  ur: "اوسی انصاری صحابی، کنیت سے مشہور، نام مالک، بلی کے اور بنو عبد الاشہل کے حلیف؛ دوسری بیعت عقبہ میں ان کے نقیب۔"
