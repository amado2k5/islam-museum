summary:
  ar: "الحافظ الأديب أبو الحسن عبد الغافر بن إسماعيل الفارسي صاحب تاريخ نيسابور ومصنف مجمع الغرائب ومصنف المفهم في شرح مسلم؛ كان إماماً في الحديث واللغة والأدب والبلاغة فقيهاً شافعياً، حدث عن جده لأمه أبي القاسم القشيري وطبقته وأجاز له أبو محمد الجوهري وآخرون، وتفقه بإمام الحرمين فلازمه أربع سنين وأخذ عنه الخلاف والفقه، ورحل فأكثر الأسفار ولقي العلماء ثم رجع إلى نيسابور وولي خطابتها وأخذ التفسير والأصول عن خاليه أبي سعيد عبد الله وأبي سعيد عبد الواحد ابني أبي القاسم القشيري؛ توفي سنة تسع وعشرين وخمسمائة بنيسابور عن ثمان وسبعين سنة {cite:shadharat-dhahab p. 573}."
  en: "The hafiz and littérateur Abu al-Hasan Abd al-Ghafir ibn Ismail al-Farisi — author of the Tarikh Nishapur, Majma al-ghara'ib and al-Mufhim, a commentary on Muslim; imam in hadith, language, adab and balagha and a Shafi'i jurist; he transmitted from his maternal grandfather Abu al-Qasim al-Qushayri's generation, kept Imam al-Haramayn's company four years learning khilaf and fiqh, travelled widely, then returned to Nishapur as its khatib, taking tafsir and usul from his uncles Abu Sa'id Abdallah and Abu Sa'id Abd al-Wahid, sons of al-Qushayri; d. at Nishapur in 529 at seventy-eight {cite:shadharat-dhahab p. 573}."
  fr: "Le hafiz et lettré Abu al-Hasan Abd al-Ghafir ibn Ismail al-Farisi — auteur du Tarikh Nishapur, du Majma al-ghara'ib et d'al-Mufhim, commentaire de Muslim ; imam en hadith, en langue, en adab et en balagha, et juriste chaféite ; il transmit de la génération de son grand-père maternel Abu al-Qasim al-Qushayri, fréquenta l'imam al-Haramayn quatre ans pour apprendre le khilaf et le fiqh, voyagea beaucoup, puis revint à Nishapur comme khatib, prenant le tafsir et les usul de ses oncles Abu Sa'id Abdallah et Abu Sa'id Abd al-Wahid, fils d'al-Qushayri ; m. à Nishapur en 529 à soixante-dix-huit ans {cite:shadharat-dhahab p. 573}."
  es: "El hafiz y literato Abu al-Hasan Abd al-Ghafir ibn Ismail al-Farisi, autor de Tarikh Nishapur, Majma al-ghara'ib y al-Mufhim, un comentario sobre Muslim; imán en hadices, lengua, adab y balagha y jurista shafi'i; heredó de la generación de su abuelo materno Abu al-Qasim al-Qushayri, hizo compañía al Imam al-Haramayn durante cuatro años aprendiendo khilaf y fiqh, viajó mucho y luego regresó a Nishapur como su khatib, tomando tafsir y usul de sus tíos Abu Sa'id Abdallah y Abu Sa'id Abd al-Wahid, hijos de al-Qushayri; d. en Nishapur en 529 a los setenta y ocho años {cita: shadharat-dhahab p. 573}."
  ur: "حافظ اور ادیب ابو الحسن عبد الغفار ابن اسماعیل الفارسی - تاریخ نیشاپور کے مصنف، مجمع الغرائب اور المفیم، مسلم کی تفسیر؛ حدیث، زبان، ادب اور بلاغہ میں امام اور شافعی فقیہ؛ اس نے اپنے نانا ابو القاسم القشیری کی نسل سے منتقل کیا، امام الحرمین کی صحبت میں چار سال تک خلافت اور فقہ سیکھتے رہے، بڑے پیمانے پر سفر کیا، پھر اس کے خطیب کی حیثیت سے نیشاپور واپس آئے، اپنے ماموں ابو سعید عبداللہ اور ابو سعید القشیری کے بیٹے ابو سعید القشیری سے تفسیر اور اصول لیا۔ d نیشاپور میں 529 میں 78 {حوالہ: شدارت ذہاب ص۔ 573}۔"
