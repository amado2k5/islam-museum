summary:
  ar: "الحافظ الأديب أبو الحسن عبد الغافر بن إسماعيل الفارسي صاحب تاريخ نيسابور ومصنف مجمع الغرائب ومصنف المفهم في شرح مسلم؛ كان إماماً في الحديث واللغة والأدب والبلاغة فقيهاً شافعياً، حدث عن جده لأمه أبي القاسم القشيري وطبقته وأجاز له أبو محمد الجوهري وآخرون، وتفقه بإمام الحرمين فلازمه أربع سنين وأخذ عنه الخلاف والفقه، ورحل فأكثر الأسفار ولقي العلماء ثم رجع إلى نيسابور وولي خطابتها وأخذ التفسير والأصول عن خاليه أبي سعيد عبد الله وأبي سعيد عبد الواحد ابني أبي القاسم القشيري؛ توفي سنة تسع وعشرين وخمسمائة بنيسابور عن ثمان وسبعين سنة {cite:shadharat-dhahab p. 573}."
  en: "The hafiz and littérateur Abu al-Hasan Abd al-Ghafir ibn Ismail al-Farisi — author of the Tarikh Nishapur, Majma al-ghara'ib and al-Mufhim, a commentary on Muslim; imam in hadith, language, adab and balagha and a Shafi'i jurist; he transmitted from his maternal grandfather Abu al-Qasim al-Qushayri's generation, kept Imam al-Haramayn's company four years learning khilaf and fiqh, travelled widely, then returned to Nishapur as its khatib, taking tafsir and usul from his uncles Abu Sa'id Abdallah and Abu Sa'id Abd al-Wahid, sons of al-Qushayri; d. at Nishapur in 529 at seventy-eight {cite:shadharat-dhahab p. 573}."
