summary:
  ar: "محمد باقر بن محمد تقي المجلسي الأصفهاني، علامة إمامي، تولى مشيخة الإسلام في أصفهان وترجم إلى الفارسية مجموعة كبيرة من الأحاديث، صاحب «بحار الأنوار» في 25 جزءاً؛ يذكر الأعلام وفاته سنة 1111 هـ الموافقة 1700 م."
  en: "Muhammad Baqir al-Majlisi of Isfahan, an Imami (Twelver) scholar who held the office of shaykh al-Islam there and translated many hadiths into Persian, author of Bihar al-Anwar in 25 parts; al-A'lam gives his death as 1111 AH, 1700 CE."
  es: "Muhammad Baqir al-Majlisi de Isfahán, un erudito imamí (duodecimano) que ocupó el cargo de shaykh al-Islam allí y tradujo muchos hadices al persa, autor de Bihar al-Anwar en 25 partes; al-A'lam indica que murió en el año 1111 AH, 1700 d.C."
  fr: "Muhammad Baqir al-Majlisi d'Ispahan, un érudit imamite (duodécimain) qui occupa la fonction de cheikh al-Islam et traduisit de nombreux hadiths en persan, auteur de Bihar al-Anwar en 25 parties; al-A'lam indique sa mort en 1111 AH, 1700 CE."
  ur: "اصفہان کے محمد باقر المجلسی، ایک امامی ⁦(بارہ)⁩ عالم جو وہاں شیخ الاسلام کے عہدے پر فائز رہے اور بہت سی احادیث کا فارسی میں ترجمہ کیا، بہار الانوار کے مصنف 25 حصوں میں؛ العالم نے اپنی وفات 1111ھ، 1700 عیسوی بتائی ہے۔"
  tr: "İmam alimi Muhammed Bakir bin Muhammed Taqi el-Majlisi el-İsfahani, İsfahan'da İslam'ın liderliğini üstlenmiş ve büyük bir hadis koleksiyonunu Farsçaya çevirmiştir. 25 ciltlik 'Bihar al-Anwar'ın yazarıdır; önde gelen kişiler onun 1111 Hicri yılında, yani 1700 yılında öldüğünü belirtmektedir."
  id: "Muhammad Baqir ibn Muhammad Taqi al-Majlisi al-Isfahani, seorang ulama Imami, mengambil alih kepemimpinan Islam di Isfahan dan menerjemahkan kumpulan hadis yang besar ke dalam bahasa Persia. Ia adalah penulis 'Bihar al-Anwar' dalam 25 jilid; tokoh-tokoh terkemuka menyebutkan kematiannya pada tahun 1111 H, yang bertepatan dengan tahun 1700 M."
