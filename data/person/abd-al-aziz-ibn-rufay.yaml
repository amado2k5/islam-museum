summary:
  ar: "عبد العزيز بن رفيع الأسدي الطائفي ثم الكوفي، أبو عبد الله، محدث ثقة روى عن ابن عباس وابن عمر وأنس؛ توفي سنة ١٣٠هـ."
  en: "Abd al-Aziz ibn Rufay al-Asadi, of Ta'if and then Kufa, Abu Abd Allah, a reliable hadith transmitter who narrated from Ibn Abbas, Ibn Umar and Anas; he died in 130 AH."
  fr: "Abd al-Aziz ibn Rufay al-Asadi, de Taëf puis de Koufa, Abu Abd Allah, transmetteur de hadiths fiable qui rapporta d'Ibn Abbas, d'Ibn Umar et d'Anas ; il mourut en 130 H."
  es: "Abd al-Aziz ibn Rufay al-Asadi, de Ta'if y luego de Kufa, Abu Abd Allah, un transmisor de hadices fiable que narró de Ibn Abbas, Ibn Umar y Anas; murió en el año 130 AH."
  ur: "طائف اور پھر کوفہ کے عبد العزیز بن رفیع الاسدی، ابو عبد اللہ، ایک معتبر حدیث نقل کرنے والے جنہوں نے ابن عباس، ابن عمر اور انس سے روایت کی ہے۔ آپ کی وفات 130ھ میں ہوئی۔"
  tr: "Abdul Aziz bin Rafie Al-Asadi Al-Ta’ifi, daha sonra Al-Kufi, Abu Abdullah, İbn Abbas, İbn Ömer ve Enes’ten rivayet etmiş güvenilir bir hadis ravisidir; Hicri 130 yılında vefat etmiştir."
  id: "Abdul Aziz bin Rafie Al-Asadi Al-Ta’ifi kemudian Al-Kufi, Abu Abdullah, seorang perawi hadits terpercaya yang meriwayatkan dari Ibnu Abbas, Ibnu Omar dan Anas; beliau wafat pada tahun 130 Hijriah."
