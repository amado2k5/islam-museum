summary:
  ar: "مفتي سان بطرسبورغ وإمام جامعها الكبير، من أبرز وجوه مسلمي روسيا؛ يخدم جالية متنوعة من التتار والقزق والأوزبك والطاجيك والعرب، وتُلقى الخطب في الجامع بالعربية والتترية والروسية، وقد قاد إمامة الجامع عقودًا بحسب التقارير الصحفية."
  en: "Mufti of St Petersburg and imam of its cathedral mosque, among the best-known faces of Russia's Muslims; he serves a diverse congregation of Tatars, Kazakhs, Uzbeks, Tajiks and Arabs, with sermons delivered in Arabic, Tatar and Russian, and press reports credit him with decades leading the mosque's imamate."
  ur: "سینٹ پیٹرزبرگ کے مفتی اور اس کی جامع مسجد کے امام، جو روس کے مسلمانوں کے مشہور چہروں میں شمار ہوتے ہیں؛ وہ تاتار، قازق، ازبک، تاجک اور عرب نژاد متنوع جماعت کی خدمت کرتے ہیں اور مسجد میں خطبے عربی، تاتاری اور روسی میں دیے جاتے ہیں؛ صحافی رپورٹوں کے مطابق انہوں نے برسوں امامت قائم رکھی۔"
  es: "Muftí de San Petersburgo e imán de su mezquita catedralicia, uno de los rostros más conocidos de los musulmanes rusos; atiende a una congregación diversa de tártaros, kazajos, uzbekos, tayikos y árabes, con sermones pronunciados en árabe, tártaro y ruso, y los informes de prensa le atribuyen décadas al frente del imamato de la mezquita."
