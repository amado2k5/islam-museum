label: { ar: "المهلب بن أبي صفرة", en: "al-Muhallab ibn Abi Sufra" }
summary:
  ar: "المهلب بن أبي صفرة الأزدي؛ أمير أهل البصرة وقائد حروب الأزارقة؛ منح امرأته خيرة بنت ضمرة القشيرية مهلبان وخيركان بالبصرة وهي أم أبي عيينة ابنه. ولي خراسان سنة 78هـ على توصية الخليفة عبد الملك، وأرسل جحافل المسلمين إلى بلاد تركمان سنة 80هـ، وعبر نهر بلخ وغزا سمرقند وبخارى وطخارستان، وكان يخمّس الغنائم لبيت المال ويقسم الباقي على أصحابه، وتوفي سنة 82هـ وهو والٍ على خراسان. {cite:salabi-umayyad-state-2020 p.85-86}"
  en: "Al-Muhallab ibn Abi Sufra al-Azdi; the Basrans' amir and commander of the Azraqite wars — he gave his wife Khayra bint Damra the Mahallaban and Khayrakan estates, mother of Abu Uyayna."
