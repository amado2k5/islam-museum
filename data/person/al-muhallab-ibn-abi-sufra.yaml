class: person
label: { ar: "المهلب بن أبي صفرة", en: "al-Muhallab ibn Abi Sufra", fr: "al-Muhallab ibn Abi Sufra", es: "al-Muhallab ibn Abi Sufra", ur: "المحلب ابن ابی صفرہ" }
summary:
  ar: "المهلب بن أبي صفرة الأزدي؛ أمير أهل البصرة وقائد حروب الأزارقة؛ منح امرأته خيرة بنت ضمرة القشيرية مهلبان وخيركان بالبصرة وهي أم أبي عيينة ابنه. ولي خراسان سنة 78هـ على توصية الخليفة عبد الملك، وأرسل جحافل المسلمين إلى بلاد تركمان سنة 80هـ، وعبر نهر بلخ وغزا سمرقند وبخارى وطخارستان، وكان يخمّس الغنائم لبيت المال ويقسم الباقي على أصحابه، وتوفي سنة 82هـ وهو والٍ على خراسان. {cite:salabi-umayyad-state-2020 p.85-86}"
  en: "Al-Muhallab ibn Abi Sufra al-Azdi; the Basrans' amir and commander of the Azraqite wars — he gave his wife Khayra bint Damra the Mahallaban and Khayrakan estates, mother of Abu Uyayna."
  fr: "Al-Muhallab ibn Abi Sufra al-Azdi ; l'émir des Basrans et commandant des guerres azraqites - il a donné à sa femme Khayra bint Damra les domaines Mahallaban et Khayrakan, mère d'Abu Uyayna."
  es: "Al-Muhallab ibn Abi Sufra al-Azdi; Emir de los basranos y comandante de las guerras azraqitas: le dio a su esposa Khayra bint Damra las propiedades de Mahallaban y Khayrakan, madre de Abu Uyayna."
  ur: "المحلب ابن ابی صفرا ازدی؛ بصریوں کے امیر اور ازراقی جنگوں کے کمانڈر - اس نے اپنی بیوی خضرہ بنت دمرہ کو محللبن اور خیرکان کی جاگیریں دیں جو ابو عیینہ کی والدہ تھیں۔"
  tr: "Basra prensi ve Azariqa savaşlarının komutanı Al-Muhallab ibn Ebi Safra el-Ezdi, oğlu Ebu Uyaynah'ın annesi olan eşi Khaira bint Damrah al-Qushayriyya'ya Muhalban ve Khayrkan'ı Basra'da verdi. Halife Abd al-Malik'in tavsiyesiyle 78 Hicri'nde Horasan valisi olarak atandı, 80 H.C. Türkmen topraklarına Müslüman lejyonları gönderdi, Balh Nehri'ni geçti ve Semerkant, Buhara'yı ve Tokharistan'ı fethetti. Hazine için ganimeti topladı ve kalanını yoldaşlarına dağıttı. 82 Hicri yılında, Horasan valisi iken vefat etti. {cite:Salabi-Umayyad-state-2020 s.85-86}"
  id: "Al-Muhallab ibn Abi Safra al-Azdi, pangeran Basra dan komandan perang Azariqa, memberikan istrinya Khaira bint Damrah al-Qushayriyya Muhalban dan Khayrkan di Basra, yang merupakan ibu dari putranya Abu Uyaynah. Ia diangkat menjadi gubernur Khurasan pada tahun 78 H atas rekomendasi Khalifah Abd al-Malik, mengirim legiun Muslim ke wilayah Turkmen pada tahun 80 H, menyeberangi Sungai Balkh, dan menaklukkan Samarkand, Bukhara, dan Tokharistan. Ia mengumpulkan rampasan untuk harta dan membagikan sisanya kepada para rekan-rekannya. Ia meninggal pada tahun 82 AH saat menjabat sebagai gubernur Khorasan. {cite:salabi-umayyad-state-2020 hlm.85-86}"
