summary:
  ar: "نواب دانباري في تنغايل (1863-1929)، وأول وزير مسلم في البنغال الموحدة ووزير تعليمها. قاد مع خواجة سليم الله المطالبة بجامعة في دكا سنة 1911 وقاد مشروع قانونها في المجلس التشريعي الإمبراطوري، وموّل منحا ومؤسسات تعليمية، وكان صاحب جريدة «مهير سوداكر» وراعي أدباء، وشارك في وفد سيملا 1906 وتأسيس رابطة مسلمي عموم الهند."
  en: "Nawab of Dhanbari in Tangail (1863–1929), the first Muslim minister of united Bengal and its minister of education. With Khwaja Salimullah he led the 1911 demand for a university at Dhaka and piloted its bill through the Imperial Legislative Assembly; he funded scholarships and educational institutions, owned the newspaper Mihir-Shudhakar, patronised writers, and took part in the 1906 Simla Deputation and the founding of the All-India Muslim League."
  ur: "ٹانگائل میں دھنباری کے نواب (1863ء–1929ء)، متحدہ بنگال کے پہلے مسلمان وزیر اور اس کے وزیرِ تعلیم۔ انھوں نے خواجہ سلیم اللہ کے ساتھ 1911ء میں ڈھاکہ میں یونیورسٹی کا مطالبہ کیا اور اس کا بل شاہی قانون ساز اسمبلی سے منظور کرایا؛ وظائف اور تعلیمی اداروں کی مالی مدد کی، اخبار «مہر سدھاکر» کے مالک رہے، ادیبوں کی سرپرستی کی، اور 1906ء کے شملہ وفد اور آل انڈیا مسلم لیگ کے قیام میں حصہ لیا۔"
