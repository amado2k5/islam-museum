summary:
  ar: "نواب دانباري في تنغايل (1863-1929)، وأول وزير مسلم في البنغال الموحدة ووزير تعليمها. قاد مع خواجة سليم الله المطالبة بجامعة في دكا سنة 1911 وقاد مشروع قانونها في المجلس التشريعي الإمبراطوري، وموّل منحا ومؤسسات تعليمية، وكان صاحب جريدة «مهير سوداكر» وراعي أدباء، وشارك في وفد سيملا 1906 وتأسيس رابطة مسلمي عموم الهند."
  en: "Nawab of Dhanbari in Tangail (1863–1929), the first Muslim minister of united Bengal and its minister of education. With Khwaja Salimullah he led the 1911 demand for a university at Dhaka and piloted its bill through the Imperial Legislative Assembly; he funded scholarships and educational institutions, owned the newspaper Mihir-Shudhakar, patronised writers, and took part in the 1906 Simla Deputation and the founding of the All-India Muslim League."
  ur: "ٹانگائل میں دھنباری کے نواب ⁦(1863ء–1929ء)⁩، متحدہ بنگال کے پہلے مسلمان وزیر اور اس کے وزیرِ تعلیم۔ انھوں نے خواجہ سلیم اللہ کے ساتھ 1911ء میں ڈھاکہ میں یونیورسٹی کا مطالبہ کیا اور اس کا بل شاہی قانون ساز اسمبلی سے منظور کرایا؛ وظائف اور تعلیمی اداروں کی مالی مدد کی، اخبار «مہر سدھاکر» کے مالک رہے، ادیبوں کی سرپرستی کی، اور 1906ء کے شملہ وفد اور آل انڈیا مسلم لیگ کے قیام میں حصہ لیا۔"
  es: "Nawab de Dhanbari en Tangail (1863-1929), primer ministro musulmán de la Bengala unificada y ministro de educación. Junto con Khwaja Salimullah, lideró la demanda de 1911 para la creación de una universidad en Dhaka e impulsó su proyecto de ley en la Asamblea Legislativa Imperial; financió becas e instituciones educativas, fue propietario del periódico Mihir-Shudhakar, patrocinó a escritores y participó en la delegación de Simla de 1906 y en la fundación de la Liga Musulmana de la India."
  fr: "Le nawab de Dhanbari à Tangail (1863-1929) fut le premier ministre musulman du Bengale unifié et son ministre de l'Éducation. Avec Khwaja Salimullah, il mena la campagne de 1911 pour la création d'une université à Dacca et fit adopter le projet de loi par l'Assemblée législative impériale. Il finança des bourses d'études et des établissements d'enseignement, possédait le journal Mihir-Shudhakar, soutint des écrivains et participa à la délégation de Simla en 1906 ainsi qu'à la fondation de la Ligue musulmane panindienne."
  tr: "Tanghal'da Nawab Danbari (1863-1929) ve birleşik Bengal'in ilk Müslüman bakanı ile Eğitim Bakanıydı. 1911'de Khwaja Salimullah ile birlikte Dakka'da bir üniversite talepine öncülük etti, İmparatorluk Yasama Konseyi'nde tasarıyı yürüttü, hibeler ve eğitim kurumları finanse etti, 'Mehir Sudhakar' gazetesinin sahibiydi, yazarları destekledi, 1906'daki Simla heyetine katıldı ve Tüm Hindistan Müslüman Ligi'ni kurdu."
  id: "Nawab Danbari di Tanghal (1863-1929), dan menteri Muslim pertama di Bengal yang bersatu serta Menteri Pendidikannya. Ia memimpin tuntutan untuk universitas di Dhaka bersama Khwaja Salimullah pada tahun 1911, memimpin rancangan undang-undangnya di Dewan Legislatif Kekaisaran, mendanai hibah dan institusi pendidikan, menjadi pemilik surat kabar 'Mehir Sudhakar,' mendampingi para penulis, berpartisipasi dalam delegasi Simla tahun 1906, dan mendirikan All India Muslim League."
