label: { ar: "عبد الله بن دراج", en: "Abdallah ibn Darraj", fr: "Abdallah ibn Darraj", es: "Abdallah ibn Darraj" }
summary:
  ar: "مولى معاوية بن أبي سفيان؛ عند البلاذري استخرج له أيام ولايته خراج الكوفة مع المغيرة بن شعبة ضياعاً من موات مرفوض ونقوض مياه ومغايص وآجام ضرب عليها المسنيات ثم حازها الحجاج لعبد الملك بن مروان وعمرها."
  en: "Mu'awiya's mawla; in al-Baladhuri he had estates reclaimed during his tenure of Kufa's kharaj office under al-Mughira — dead land, stagnant waters, springs and reed-beds staked with milestones — which al-Hajjaj then seized for Abd al-Malik and cultivated."
  fr: "Client de Mu'awiya ; chez al-Baladhuri, il fit remettre en valeur des domaines pendant qu'il tenait l'office du kharaj de Koufa sous al-Mughira — terres mortes, eaux stagnantes, sources et roselières bornées de jalons —, dont al-Hajjaj s'empara ensuite pour Abd al-Malik et qu'il mit en culture."
  es: "En al-Baladhuri, Mu'awiya recuperó propiedades durante su mandato como administrador de Kufa bajo la tutela de al-Mughira: tierras muertas, aguas estancadas, manantiales y cañaverales marcados con mojones, que al-Hajjaj luego se apropió para Abd al-Malik y cultivó."
