id: person/abdallah-ibn-darraj
class: person
label: { ar: "عبد الله بن دراج", en: "Abdallah ibn Darraj", fr: "Abdallah ibn Darraj", es: "Abdallah ibn Darraj", ur: "عبداللہ بن دراج" }
summary:
  ar: "مولى معاوية بن أبي سفيان؛ عند البلاذري استخرج له أيام ولايته خراج الكوفة مع المغيرة بن شعبة ضياعاً من موات مرفوض ونقوض مياه ومغايص وآجام ضرب عليها المسنيات ثم حازها الحجاج لعبد الملك بن مروان وعمرها."
  en: "Mu'awiya's mawla; in al-Baladhuri he had estates reclaimed during his tenure of Kufa's kharaj office under al-Mughira — dead land, stagnant waters, springs and reed-beds staked with milestones — which al-Hajjaj then seized for Abd al-Malik and cultivated."
  fr: "Client de Mu'awiya ; chez al-Baladhuri, il fit remettre en valeur des domaines pendant qu'il tenait l'office du kharaj de Koufa sous al-Mughira — terres mortes, eaux stagnantes, sources et roselières bornées de jalons —, dont al-Hajjaj s'empara ensuite pour Abd al-Malik et qu'il mit en culture."
  es: "En al-Baladhuri, Mu'awiya recuperó propiedades durante su mandato como administrador de Kufa bajo la tutela de al-Mughira: tierras muertas, aguas estancadas, manantiales y cañaverales marcados con mojones, que al-Hajjaj luego se apropió para Abd al-Malik y cultivó."
  ur: "معاویہ کا مولا; البلادھوری میں اس نے المغیرہ کے ماتحت کوفہ کے خرج دفتر کے اپنے دور میں جائیدادیں دوبارہ حاصل کی تھیں - مردہ زمین، ٹھہرے ہوئے پانی، چشمے اور سرکنڈے کے پلنگ جو سنگ میلوں سے جڑے ہوئے تھے - جسے الحجاج نے پھر عبد الملک کے لیے قبضہ کر لیا اور کاشت کی۔"
  tr: "Muaviye ibn Abi Sufyan'ın azatlı kölesi; El-Baladhuri'ye göre, valiliği sırasında El-Mughira ibn Şuba ile birlikte Kufa vergisini, sahipsiz verimsiz topraklardan arazileri, su kaynaklarını, dalış alanlarını ve çalılıkları ondan aldı ve üzerlerine sulama kanalları kurdu; daha sonra El-Haccac bunları Abd el-Malik ibn Mervan için ele geçirdi ve geliştirdi."
  id: "Budak yang dibebaskan oleh Muawiyah ibn Abi Sufyan; menurut Al-Baladhuri, selama masa pemerintahannya, ia memungut pajak Kufa untuknya bersama Al-Mughira ibn Shu’ba, tanah-tanah dari lahan mati yang tidak diklaim, lubang air, area menyelam, dan semak belukar, dan ia membangun saluran irigasi di atasnya, kemudian Al-Hajjaj merebutnya untuk Abd al-Malik ibn Marwan dan mengembangkannya."
