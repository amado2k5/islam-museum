summary:
  ar: "مصارع روماني تركي في وزن 130 كغ، وُلد في يوزغات سنة 1989. بطل عالم خمس مرات وبطل أوروبا ثلاث عشرة مرة، وصاحب فضية أولمبية (2016) وبرونزيتين (2012 و2020). أُعلن سنة 2025 عن إيقافه أربع سنوات في قضية منشطات، وقال إنه سيطعن في القرار، وسجّلت المقالات فوزه بلقب أوروبي جديد سنة 2026."
  en: "Turkish Greco-Roman wrestler at 130 kg, born in Yozgat in 1989. A five-time world champion and thirteen-time European champion, with an Olympic silver medal (2016) and two bronzes (2012, 2020). A four-year anti-doping ban was announced in 2025, which he said he would appeal, and the articles record a further European title in 2026."
  ur: "ترک گریکو رومن پہلوان (130 کلوگرام)، جو 1989 میں یوزغات میں پیدا ہوئے۔ پانچ بار عالمی اور تیرہ بار یورپی چیمپئن؛ اولمپک چاندی (2016) اور دو کانسی کے تمغے (2012، 2020)۔ 2025 میں ان پر چار سالہ پابندی کا اعلان ہوا جس پر انہوں نے اپیل کا کہا، اور مضامین میں 2026 میں ان کا ایک اور یورپی خطاب درج ہے۔"
