summary:
  ar: "أبو إسحق أحمد بن محمد بن إبراهيم النيسابوري الثعلبي، المفسر، من أصحاب السراج؛ كان حافظاً واعظاً رأساً في التفسير والعربية متين الديانة، وقال ابن خلكان كان أوحد زمانه في علم التفسير وصنف التفسير الكبير الذي فاق غيره من التفاسير وله كتاب العرائس في قصص الأنبياء وغير ذلك {cite:shadharat-dhahab p. 230}."
  en: "Abu Ishaq Ahmad b. Muhammad al-Tha'labi of Nishapur — the Qur'an exegete, 'unique in his age in the science of tafsir' per Ibn Khallikan, author of the great commentary al-Kashf wa-l-Bayan and Ara'is al-Majalis on the tales of the prophets; died in 427 {cite:shadharat-dhahab p. 230}."
