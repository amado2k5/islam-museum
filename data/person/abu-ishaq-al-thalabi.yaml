label: { ar: "أبو إسحق الثعلبي المفسر", en: "Abu Ishaq al-Tha'labi, the exegete", fr: "Abu Ishaq al-Tha'labi, l'exégète", es: "Abu Ishaq al-Tha'labi, the exegete", ur: "ابو اسحاق الثعلبی، مفسر" }
summary:
  ar: "أبو إسحق أحمد بن محمد بن إبراهيم النيسابوري الثعلبي، المفسر، من أصحاب السراج؛ كان حافظاً واعظاً رأساً في التفسير والعربية متين الديانة، وقال ابن خلكان كان أوحد زمانه في علم التفسير وصنف التفسير الكبير الذي فاق غيره من التفاسير وله كتاب العرائس في قصص الأنبياء وغير ذلك {cite:shadharat-dhahab p. 230}."
  en: "Abu Ishaq Ahmad b. Muhammad al-Tha'labi of Nishapur — the Qur'an exegete, 'unique in his age in the science of tafsir' per Ibn Khallikan, author of the great commentary al-Kashf wa-l-Bayan and Ara'is al-Majalis on the tales of the prophets; died in 427 {cite:shadharat-dhahab p. 230}."
  fr: "Abu Ishaq Ahmad b. Muhammad al-Tha'labi de Nishapur — l'exégète du Coran, « unique en son temps dans la science du tafsir » selon Ibn Khallikan, auteur du grand commentaire al-Kashf wa-l-Bayan et des Ara'is al-Majalis sur les histoires des prophètes ; mort en 427 {cite:shadharat-dhahab p. 230}."
  es: "Abu Ishaq Ahmad b. Muhammad al-Tha'labi de Nishapur — el exégeta del Corán, 'único en su época en la ciencia del tafsir' según Ibn Khallikan, autor del gran comentario al-Kashf wa-l-Bayan y Ara'is al-Majalis sobre los relatos de los profetas; murió en 427 {cita: shadharat-dhahab p. 230}."
  ur: "ابو اسحاق احمد بی۔ نیشاپور کے محمد الثعلبی - قرآن کا مفسر، 'علم تفسیر میں اپنے دور میں منفرد' فی ابن خلیقان، عظیم تفسیر الکشف والبیان اور انبیاء کے قصوں پر عریض المجالس کے مصنف؛ 427ء میں وفات پائی۔ 230}۔"
  tr: "Tefsirci Ebu İshak Ahmed ibn Muhammed ibn İbrahim el-Nisaburi el-Sa'labi, Siraj'ın sahabelerinden biriydi. Ezberci, vaiz ve tefsir ile Arapça alanında önde gelen bir şahsiyet olup, güçlü bir imana sahipti. İbn Hallikan, tefsir ilminde zamanında eşsiz olduğunu ve diğer tefsirleri aşan büyük bir tefsir eseri yazdığını söylemiştir. Ayrıca peygamberlerin kıssaları üzerine el-Ara'is adlı bir kitap ve başka eserler de yazmıştır. {kaynak: Şadharat-Dhaba s. 230}"
  id: "Abu Ishaq Ahmad ibn Muhammad ibn Ibrahim al-Nisaburi al-Tha’labi, sang penafsir, adalah salah satu sahabat al-Siraj. Beliau adalah seorang penghafal Al-Quran, pendakwah, dan tokoh terkemuka dalam bidang tafsir dan bahasa Arab, serta seorang yang beriman teguh. Ibn Khallikan mengatakan bahwa beliau unik pada zamannya dalam ilmu tafsir, dan beliau menulis tafsir besar yang melampaui tafsir-tafsir lainnya. Beliau juga menulis kitab al-‘Ara’is tentang kisah para nabi dan karya-karya lainnya. {cite:shadharat-dhahab p. 230}"
