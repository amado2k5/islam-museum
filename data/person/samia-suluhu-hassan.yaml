summary:
  ar: "سياسية تنزانية (ولدت 1960) من زنجبار، وهي سادس رئيس لتنزانيا منذ 19 مارس 2021 وأول امرأة تشغل المنصب. شغلت وزارات في حكومة زنجبار بين 2000 و2010، وكانت عضوة في البرلمان ووزيرة دولة لشؤون الاتحاد، ثم نائبة الرئيس جون ماغوفولي من 2015 حتى وفاته فخلفته في الرئاسة وأعيد انتخابها سنة 2025 في انتخابات متنازع عليها. تنسبها تصنيفات المقالات إلى المسلمين التنزانيين دون أن يسمي نصٌّ مدرستها."
  en: "Tanzanian politician (born 1960) from Zanzibar who has been the sixth president of Tanzania since 19 March 2021 and the first woman to hold the office. She held ministries in the Zanzibar government between 2000 and 2010, served as a member of parliament and minister of state for union affairs, then as vice-president under John Magufuli from 2015 until his death, when she succeeded him; she was re-elected in 2025 in a contested election. The articles' categories file her among Tanzanian Muslims, but no text names a school for her."
  ur: "تنزانیہ کی سیاست دان (پیدائش 1960ء) جن کا تعلق زنجبار سے ہے؛ وہ 19 مارچ 2021ء سے تنزانیہ کی چھٹی صدر اور اس عہدے پر فائز ہونے والی پہلی خاتون ہیں۔ وہ 2000ء سے 2010ء تک زنجبار حکومت میں وزیر رہیں، رکنِ پارلیمان اور وزیرِ مملکت برائے یونین امور رہیں، پھر 2015ء سے جان ماگوفولی کی نائب صدر رہیں اور ان کی وفات پر صدر بنیں؛ 2025ء میں متنازع انتخابات میں دوبارہ منتخب ہوئیں۔ مضامین کے زمرے انہیں تنزانیہ کے مسلمانوں میں شمار کرتے ہیں، مگر کوئی متن ان کا مذہبی مکتب فکر بیان نہیں کرتا۔"
