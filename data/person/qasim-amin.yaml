summary:
  ar: "قاضٍ وكاتب مصري (1863–1908) وأحد مؤسسي الحركة الوطنية المصرية وجامعة القاهرة؛ اشتهر بكتابيه «تحرير المرأة» (1899) و«المرأة الجديدة» (1900) اللذين دعا فيهما إلى تعليم المرأة ورفع الحجاب وإصلاح قوانين الزواج والطلاق، فأثارا جدلًا واسعًا ما زال مستمرًا حول مكانته بوصفه من أوائل المدافعين عن حقوق المرأة في العالم العربي."
  en: "Egyptian jurist and writer (1863–1908), a founder of the Egyptian national movement and of Cairo University. He is best known for The Liberation of Women (1899) and The New Woman (1900), which argued for women's education, the abolition of the veil and reform of marriage and divorce law, and which ignited a debate — still running — over his standing as one of the Arab world's first advocates of women's rights."
  ur: "مصری قاضی اور مصنف (1863–1908)، مصری قومی تحریک اور جامعہ قاہرہ کے بانیوں میں سے ایک؛ اپنی دو کتابوں «تحریر المرأة» (1899) اور «المرأة الجديدة» (1900) کے لیے مشہور، جن میں انہوں نے خواتین کی تعلیم، حجاب کے خاتمے اور شادی و طلاق کے قوانین کی اصلاح کی دعوت دی، اور جن پر آج تک بحث جاری ہے۔"
