summary:
  ar: "قاضٍ وكاتب مصري (1863–1908) وأحد مؤسسي الحركة الوطنية المصرية وجامعة القاهرة؛ اشتهر بكتابيه «تحرير المرأة» (1899) و«المرأة الجديدة» (1900) اللذين دعا فيهما إلى تعليم المرأة ورفع الحجاب وإصلاح قوانين الزواج والطلاق، فأثارا جدلًا واسعًا ما زال مستمرًا حول مكانته بوصفه من أوائل المدافعين عن حقوق المرأة في العالم العربي."
  en: "Egyptian jurist and writer (1863–1908), a founder of the Egyptian national movement and of Cairo University. He is best known for The Liberation of Women (1899) and The New Woman (1900), which argued for women's education, the abolition of the veil and reform of marriage and divorce law, and which ignited a debate — still running — over his standing as one of the Arab world's first advocates of women's rights."
  ur: "مصری قاضی اور مصنف (1863–1908)، مصری قومی تحریک اور جامعہ قاہرہ کے بانیوں میں سے ایک؛ اپنی دو کتابوں «تحریر المرأة» (1899) اور «المرأة الجديدة» (1900) کے لیے مشہور، جن میں انہوں نے خواتین کی تعلیم، حجاب کے خاتمے اور شادی و طلاق کے قوانین کی اصلاح کی دعوت دی، اور جن پر آج تک بحث جاری ہے۔"
  es: "Jurista y escritor egipcio (1863-1908), fundador del movimiento nacional egipcio y de la Universidad de El Cairo. Es conocido principalmente por La liberación de la mujer (1899) y La nueva mujer (1900), obras en las que defendía la educación femenina, la abolición del velo y la reforma de las leyes de matrimonio y divorcio, y que suscitaron un debate —aún vigente— sobre su papel como uno de los primeros defensores de los derechos de la mujer en el mundo árabe."
  fr: "Juriste et écrivaine égyptienne (1863-1908), fondatrice du mouvement national égyptien et de l'université du Caire, elle est surtout connue pour ses ouvrages *La Libération de la femme* (1899) et *La Femme nouvelle* (1900), qui plaident pour l'éducation des femmes, l'abolition du voile et la réforme du droit du mariage et du divorce, et qui ont suscité un débat – toujours d'actualité – sur sa place parmi les premiers défenseurs des droits des femmes dans le monde arabe."
  tr: "Mısırlı bir yargıç ve yazar (1863–1908), Mısır Ulusal Hareketi ve Kahire Üniversitesi'nin kurucularından biri; \"Kadınların Kurtuluşu\" (1899) ve \"Yeni Kadın\" (1900) adlı kitaplarıyla ünlendi; bu kitaplarda kadınların eğitimini, başörtüsünün kaldırılmasını ve evlilik ile boşanma yasalarının reformunu savundu. Bu tartışmalar, Arap dünyasında kadın haklarının en erken savunucularından biri olarak statüsü hakkında geniş çaplı ve devam eden tartışmalara yol açtı."
  id: "Seorang hakim dan penulis Mesir (1863–1908), serta salah satu pendiri Gerakan Nasional Mesir dan Universitas Kairo; ia menjadi terkenal lewat bukunya \"The Liberation of Women\" (1899) dan \"The New Woman\" (1900), di mana ia menyerukan pendidikan perempuan, pencabutan hijab, serta reformasi undang-undang pernikahan dan perceraian. Hal-hal ini memicu perdebatan luas dan berkelanjutan tentang statusnya sebagai salah satu pembela hak perempuan paling awal di dunia Arab."
