summary:
  ar: "الشاعر؛ له قصيدته المشهورة في رثاء بغداد سنة ست وخمسين وستمائة ومنها: «لسائل الدمع عن بغداد أخبار * فما وقوفك والأحباب قد ساروا * يا زائرين إلى الزوراء لا تقدوا * فما بذاك الحي والدار ديار» ومنها: «علا الصليب على أعلى منابرها * وقام بالأمر من يحويه زنار» {cite:shadharat-dhahab p. 279-280}."
  en: "The poet of the famous Baghdad elegy of 656 — 'Ask the tears for Baghdad's tidings... over her highest minbars the cross stood high, and the girdle-wearer gave the orders' {cite:shadharat-dhahab p. 279-280}."
  es: "El poeta de la famosa elegía de Bagdad de 656: «Pide a las lágrimas las noticias de Bagdad... sobre sus minbares más altos se alzaba la cruz, y el portador del cinturón daba las órdenes» {cita: shadharat-dhahab págs. 279-280}."
  fr: "Le poète de la célèbre élégie de Bagdad de 656 — « Demandez aux larmes les nouvelles de Bagdad... au-dessus de ses plus hauts minbars la croix se dressait, et celle qui portait la ceinture donnait les ordres » {cite: shadharat-dhahab p. 279-280}."
  ur: "656 کے بغداد کے مشہور مصرعے کا شاعر - 'بغداد کی خبر کے لیے آنسوؤں سے پوچھو... اس کے سب سے اونچے منبر پر صلیب اونچا کھڑا تھا، اور کمر بند باندھنے والے نے حکم دیا'۔ 279-280}۔"
  tr: "Şair; 656 Hicri yılında Bağdat'a ağıt tutan ünlü şiiri vardır; şöyle demiştir: \"Bağdat haberlerini gözyaşı bilen soran kişiye * Peki neden ayağa kalktın ve sevdiklerin gitti * Ey El-Zevra'ya gelen ziyaretçiler, dikkatinizi dağıtmayın * Çünkü o mahallede ne ev ne de konutlarda ev yoktur,\" ve aralarında: \"Haç en yüksek kürsülerine dikildi * Ve iş, onu kemerle taşıyan kişi tarafından yapıldı\" {atıf:shadharat-dhahab, s. 279-280}."
  id: "Penyair; ia memiliki puisi terkenalnya yang meratapi Baghdad pada tahun 656 H, termasuk: \"Kepada orang yang bertanya dengan air mata tentang berita Baghdad * Jadi mengapa kau berdiri dan orang-orang tercinta telah pergi * Wahai pengunjung Al-Zawraa, jangan terganggu * Karena tidak ada rumah di lingkungan itu atau rumah di rumah,\" dan di antara mereka: \"Salib diangkat di mimbar tertingginya * Dan urusan itu dilakukan oleh orang yang membawanya dengan ikat pinggang\" {cite:shadharat-dhahab, hlm. 279-280}."
