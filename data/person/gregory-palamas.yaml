summary:
  ar: "غريغوريوس بالاماس مطران سالونيك وعالم لاهوت بيزنطي بارز، أُخذ أسيراً إلى أراضي العثمانيين سنة 1354م، فالتقى الجماعات المسيحية هناك وشارك في مناظرة لاهوتية علنية نظّمها أورخان في نيقية {cite:encyclopaedia-of-islam-2 vol. 8 p. 188}."
  en: "Gregory Palamas, Metropolitan of Thessalonica and a distinguished Byzantine theologian, was taken prisoner into Ottoman territory in 1354. There he met the Christian communities and took part in a public theological debate that Orkhan organised at Nicaea {cite:encyclopaedia-of-islam-2 vol. 8 p. 188}."
  ur: "گریگوری پالاماس سالونیکا کے مطران اور بازنطینی دینیات کے نمایاں عالم تھے۔ 1354ء میں انہیں قیدی بنا کر عثمانی علاقے میں لے جایا گیا، جہاں انہوں نے مسیحی جماعتوں سے ملاقات کی اور اورخان کے منعقد کردہ نیقیہ کے کھلے دینیاتی مناظرے میں شرکت کی {cite:encyclopaedia-of-islam-2 vol. 8 p. 188}۔"
