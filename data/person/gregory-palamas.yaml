summary:
  ar: "غريغوريوس بالاماس مطران سالونيك وعالم لاهوت بيزنطي بارز، أُخذ أسيراً إلى أراضي العثمانيين سنة 1354م، فالتقى الجماعات المسيحية هناك وشارك في مناظرة لاهوتية علنية نظّمها أورخان في نيقية {cite:encyclopaedia-of-islam-2 vol. 8 p. 188}."
  en: "Gregory Palamas, Metropolitan of Thessalonica and a distinguished Byzantine theologian, was taken prisoner into Ottoman territory in 1354. There he met the Christian communities and took part in a public theological debate that Orkhan organised at Nicaea {cite:encyclopaedia-of-islam-2 vol. 8 p. 188}."
  ur: "گریگوری پالاماس سالونیکا کے مطران اور بازنطینی دینیات کے نمایاں عالم تھے۔ 1354ء میں انہیں قیدی بنا کر عثمانی علاقے میں لے جایا گیا، جہاں انہوں نے مسیحی جماعتوں سے ملاقات کی اور اورخان کے منعقد کردہ نیقیہ کے کھلے دینیاتی مناظرے میں شرکت کی {cite:encyclopaedia-of-islam-2 vol. 8 p. 188}۔"
  es: "Gregorio Palamás, metropolitano de Tesalónica y distinguido teólogo bizantino, fue hecho prisionero en territorio otomano en 1354. Allí conoció a las comunidades cristianas y participó en un debate teológico público que Orkhan organizó en Nicea {cite:encyclopaedia-of-islam-2 vol. 8 p. 188}."
  fr: "Grégoire Palamas, métropolite de Thessalonique et théologien byzantin distingué, fut fait prisonnier en territoire ottoman en 1354. Il y rencontra les communautés chrétiennes et participa à un débat théologique public organisé par Orkhan à Nicée {cite:encyclopaedia-of-islam-2 vol. 8 p. 188}."
  tr: "Selanik Metropoliti ve önde gelen Bizans ilahiyatçısı Gregory Palamas, 1354 yılında Osmanlı topraklarına esir alındı; burada Hristiyan gruplarla tanıştı ve Orhan tarafından İznik'te düzenlenen halka açık bir teolojik tartışmaya katıldı {cite:Encyclopaedia-of-Islam-2 cilt 8, s. 188}."
  id: "Gregory Palamas, Metropolitan Thessaloniki dan teolog Bizantium terkemuka, ditangkap ke tanah Ottoman pada tahun 1354 M, di mana ia bertemu dengan kelompok Kristen dan berpartisipasi dalam debat teologis publik yang diselenggarakan oleh Orhan di Nicaea {cite:Encyclopaedia-of-Islam-2 vol. 8, hlm. 188}."
