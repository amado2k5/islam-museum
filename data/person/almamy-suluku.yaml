    note: "No source read names a religion, school or order for Suluku personally, still less two independent ones. What the sources give, in full: his regnal style Almamy is the Fula imamate title (from al-imam) borne by the rulers of Futa Jallon and adopted by Muslim rulers across the region, and his Limba kingship title was Gbaku; the Sierra Leone Web biography and Wikidata describe his wars, trade policy and diplomacy in detail without ever stating his personal religion, and the Limba of his period stood largely outside the Islamic world of the coast and the Futa. A borrowed regnal title is an office, not an attestation of the man's own school or affiliation, and by the lane rule neither it nor his milieu counts; his faith is therefore left unknown under the two-source rule and the doubt rule ('if we have doubt then unclassified'), and that position is stated here in full."
