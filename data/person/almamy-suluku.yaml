summary:
  ar: "ألمامي سولوكو (ح. 1820 – 1906)، الحاكم الليمبي لبلاد بيريوا في شمال سيراليون، وابن زعيمها سانكيلاي. صار في شبابه كوروغبا (قائد الحرب) فجعل بيريوا من أكبر ممالك سيراليون، وتُوّج گباكو (ملكًا) عليها، وأغناها بحماية التجارة المارة بعاصمتها بومبان إلى فريتاون. حافظ على استقلاله بالمناورة السياسية وحدها: فحين احتلت قوات ساموري توريه الماندينكا بيريوا سنة 1884 تظاهر بالتعاون معها وهو يحذّر البريطانيين سرًا حتى انسحبت، وفي التسعينيات أظهر الولاء للبريطانيين وفعل ما يشاء، وحين اندلع تمرد 1898 أرسل سرًا المحاربين والسلاح إلى باي بوريه ثم كتب للبريطانيين يعرض وساطته. رفضت رعيته تقسيم مملكته ما دام حيًا، وحين سأله مسؤول بريطاني شيخًا أن يسمي خليفته أجاب: «سولوكو لن يموت». توفي سنة 1906."
  en: "Almamy Suluku (c. 1820 – 1906), the Limba ruler of the Biriwa country in northern Sierra Leone and son of its chief Sankailay. As a young man he became Kurugba (war captain) and made Biriwa one of the largest kingdoms in Sierra Leone, and was crowned Gbaku (king) over it; he enriched it by fostering and protecting the trade that passed through its capital Bumban on the way to Freetown. He kept his independence by political manoeuvre alone: when Samori Touré's Mandinka forces occupied Biriwa in 1884 he pretended to co-operate with them while secretly warning the British until they withdrew; in the 1890s he professed loyalty to the British while doing exactly as he pleased; and when the 1898 rebellion broke out he secretly sent warriors and weapons to Bai Bureh, then wrote to the British offering his services as mediator. His subjects refused to let his kingdom be broken up while he lived, and when an aged Suluku was asked by a British official to name his successor he replied, 'Suluku will never die'. He died in 1906."
  ur: "المامی سولوکو (تقریباً 1820ء – 1906ء)، شمالی سیرا لیون کے علاقے بیریوا کے لمبا حکمران اور اس کے سردار سانکیلائی کے بیٹے۔ جوانی میں وہ کوروغبا (سپہ سالار) بنے اور بیریوا کو سیرا لیون کی بڑی سلطنتوں میں شامل کر دیا، پھر گباکو (بادشاہ) کا تاج پہنا؛ انہوں نے دارالحکومت بومبان سے فری ٹاؤن جانے والی تجارت کی حفاظت کر کے اسے مالا مال کیا۔ انہوں نے اپنی آزادی محض سیاسی تدبیر سے برقرار رکھی: 1884ء میں ساموری تورے کی ماندنکا فوجوں کے قبضے پر بظاہر تعاون کیا مگر خفیہ طور پر انگریزوں کو خبردار کرتے رہے یہاں تک کہ وہ پیچھے ہٹ گئیں؛ 1898ء کی بغاوت میں بائی بورے کو خفیہ طور پر جنگجو اور ہتھیار بھیجے اور ساتھ ہی انگریزوں کو ثالثی کی پیشکش بھی کر دی۔ ان کی رعایا نے ان کی زندگی میں سلطنت کی تقسیم قبول نہ کی، اور جب ایک برطانوی اہلکار نے بڑھاپے میں ان سے جانشین کا نام پوچھا تو جواب دیا: «سولوکو کبھی نہیں مرے گا»۔ وفات 1906ء میں ہوئی۔"
