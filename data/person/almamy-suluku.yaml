summary:
  ar: "ألمامي سولوكو ⁦(ح. 1820 – 1906)⁩، الحاكم الليمبي لبلاد بيريوا في شمال سيراليون، وابن زعيمها سانكيلاي. صار في شبابه كوروغبا ⁦(قائد الحرب)⁩ فجعل بيريوا من أكبر ممالك سيراليون، وتُوّج گباكو ⁦(ملكًا)⁩ عليها، وأغناها بحماية التجارة المارة بعاصمتها بومبان إلى فريتاون. حافظ على استقلاله بالمناورة السياسية وحدها: فحين احتلت قوات ساموري توريه الماندينكا بيريوا سنة 1884 تظاهر بالتعاون معها وهو يحذّر البريطانيين سرًا حتى انسحبت، وفي التسعينيات أظهر الولاء للبريطانيين وفعل ما يشاء، وحين اندلع تمرد 1898 أرسل سرًا المحاربين والسلاح إلى باي بوريه ثم كتب للبريطانيين يعرض وساطته. رفضت رعيته تقسيم مملكته ما دام حيًا، وحين سأله مسؤول بريطاني شيخًا أن يسمي خليفته أجاب: «سولوكو لن يموت». توفي سنة 1906."
  en: "Almamy Suluku (c. 1820 – 1906), the Limba ruler of the Biriwa country in northern Sierra Leone and son of its chief Sankailay. As a young man he became Kurugba (war captain) and made Biriwa one of the largest kingdoms in Sierra Leone, and was crowned Gbaku (king) over it; he enriched it by fostering and protecting the trade that passed through its capital Bumban on the way to Freetown. He kept his independence by political manoeuvre alone: when Samori Touré's Mandinka forces occupied Biriwa in 1884 he pretended to co-operate with them while secretly warning the British until they withdrew; in the 1890s he professed loyalty to the British while doing exactly as he pleased; and when the 1898 rebellion broke out he secretly sent warriors and weapons to Bai Bureh, then wrote to the British offering his services as mediator. His subjects refused to let his kingdom be broken up while he lived, and when an aged Suluku was asked by a British official to name his successor he replied, 'Suluku will never die'. He died in 1906."
  ur: "المامی سولوکو ⁦(تقریباً 1820ء – 1906ء)⁩، شمالی سیرا لیون کے علاقے بیریوا کے لمبا حکمران اور اس کے سردار سانکیلائی کے بیٹے۔ جوانی میں وہ کوروغبا ⁦(سپہ سالار)⁩ بنے اور بیریوا کو سیرا لیون کی بڑی سلطنتوں میں شامل کر دیا، پھر گباکو ⁦(بادشاہ)⁩ کا تاج پہنا؛ انہوں نے دارالحکومت بومبان سے فری ٹاؤن جانے والی تجارت کی حفاظت کر کے اسے مالا مال کیا۔ انہوں نے اپنی آزادی محض سیاسی تدبیر سے برقرار رکھی: 1884ء میں ساموری تورے کی ماندنکا فوجوں کے قبضے پر بظاہر تعاون کیا مگر خفیہ طور پر انگریزوں کو خبردار کرتے رہے یہاں تک کہ وہ پیچھے ہٹ گئیں؛ 1898ء کی بغاوت میں بائی بورے کو خفیہ طور پر جنگجو اور ہتھیار بھیجے اور ساتھ ہی انگریزوں کو ثالثی کی پیشکش بھی کر دی۔ ان کی رعایا نے ان کی زندگی میں سلطنت کی تقسیم قبول نہ کی، اور جب ایک برطانوی اہلکار نے بڑھاپے میں ان سے جانشین کا نام پوچھا تو جواب دیا: «سولوکو کبھی نہیں مرے گا»۔ وفات 1906ء میں ہوئی۔"
  es: "Almamy Suluku (c. 1820 – 1906), gobernante limba del país de Biriwa en el norte de Sierra Leona e hijo de su jefe Sankailay. De joven, se convirtió en kurugba (capitán de guerra) y convirtió a Biriwa en uno de los reinos más grandes de Sierra Leona, siendo coronado Gbaku (rey). Lo enriqueció fomentando y protegiendo el comercio que pasaba por su capital, Bumban, camino a Freetown. Mantuvo su independencia únicamente mediante maniobras políticas: cuando las fuerzas mandinka de Samori Touré ocuparon Biriwa en 1884, fingió cooperar con ellas mientras advertía secretamente a los británicos hasta que se retiraron; en la década de 1890 profesó lealtad a los británicos mientras hacía lo que le placía; y cuando estalló la rebelión de 1898, envió secretamente guerreros y armas a Bai Bureh, y luego escribió a los británicos ofreciendo sus servicios como mediador. Sus súbditos se negaron a permitir que su reino se desintegrara mientras él viviera, y cuando un funcionario británico le pidió al anciano Suluku que nombrara a su sucesor, respondió: «Suluku jamás morirá». Falleció en 1906."
  fr: "Almamy Suluku (vers 1820-1906), souverain Limba du pays Biriwa, au nord de la Sierra Leone, était le fils du chef Sankailay. Jeune homme, il devint Kurugba (capitaine de guerre) et fit de Biriwa l'un des plus vastes royaumes de Sierra Leone, dont il fut couronné Gbaku (roi). Il contribua à l'essor de son royaume en favorisant et en protégeant le commerce transitant par sa capitale, Bumban, sur la route de Freetown. Il conserva son indépendance par de simples manœuvres politiques: lorsque les forces mandingues de Samori Touré occupèrent Biriwa en 1884, il feignit de coopérer avec elles tout en avertissant secrètement les Britanniques jusqu'à leur retrait; dans les années 1890, il afficha sa loyauté envers les Britanniques tout en agissant à sa guise; et lorsque la rébellion éclata en 1898, il envoya secrètement des guerriers et des armes à Bai Bureh, puis écrivit aux Britanniques pour leur proposer ses services de médiateur. Ses sujets refusèrent de laisser son royaume se démanteler de son vivant, et lorsqu'un fonctionnaire britannique demanda à Suluku, alors âgé, de désigner son successeur, il répondit: « Suluku ne mourra jamais. » Il mourut en 1906."
  tr: "Almami Soloko (yak. 1820–1906), kuzey Sierra Leone'deki Berewa topraklarının Limbe hükümdarı ve lideri Sankilai'nin oğlu. Gençliğinde savaş ağası (Kurogba) oldu, Berewa'yı Sierra Leone'nin en büyük krallıklarından biri yaptı, Gpaku'yu (kral) taç giydi ve başkent Bomban'dan Freetown'a giden ticareti koruyarak şehri zenginleştirdi. Bağımsızlığını yalnızca siyasi manevralarla korudu: 1884'te Tori'nin Samori kuvvetleri Mandinka Berewa'yı işgal ettiğinde, onlarla işbirliği yapıyormuş gibi yaptı ve İngilizleri gizlice uyardı, ta ki geri çekilene kadar. 1990'larda Britanyalılara sadakat gösterdi ve istediğini yaptı. 1898 isyanı patlak verdiğinde, gizlice savaşçılar ve silahlar gönderdi Bay Bureh'e ve ardından İngilizlere arabuluculuğunu teklif eden bir mektup yazdı. Tebaası, o hayatta olduğu sürece krallığını bölmeyi reddetti ve bir İngiliz yetkili ona yaşlıyken halefini atamasını istediğinde, \"Soloco ölmeyecek.\" diye yanıt verdi. 1906'da öldü."
  id: "Almami Soloko (sekitar 1820–1906), penguasa Limbe atas tanah Berewa di Sierra Leone utara, dan putra pemimpinnya Sankilai. Di masa mudanya, ia menjadi panglima perang (Kurogba), menjadikan Berewa salah satu kerajaan terbesar di Sierra Leone, menobatkan Gpaku (raja) atasnya, dan memperkayanya dengan melindungi perdagangan yang melewati ibu kotanya Bomban ke Freetown. Ia mempertahankan kemerdekaannya hanya melalui manuver politik: ketika pasukan Samori di Tori menduduki Mandinka Berewa pada tahun 1884, ia pura-pura bekerja sama dengan mereka sambil diam-diam memperingatkan Inggris hingga mereka mundur. Pada tahun 1990-an, ia menunjukkan kesetiaan kepada Inggris dan melakukan apa pun yang ia inginkan. Ketika pemberontakan tahun 1898 pecah, ia diam-diam mengirim prajurit dan senjata ke Bay Bureh lalu menulis surat kepada Inggris menawarkan mediasi. Rakyatnya menolak membagi kerajaannya selama ia masih hidup, dan ketika seorang pejabat Inggris memintanya sebagai tetua untuk menunjuk penerusnya, ia menjawab: \"Soloco tidak akan mati.\" Ia meninggal pada tahun 1906."
