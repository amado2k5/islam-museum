id: person/jalal-al-din-ubaydallah-ibn-yunus
class: person
label: { ar: "جلال الدين عبيد الله بن يونس", en: "Jalal al-Din Ubaydallah ibn Yunus", es: "Jalal al-Din Ubaydallah ibn Yunus", fr: "Jalal al-Din Ubaydallah ibn Yunus", ur: "جلال الدین عبیداللہ ابن یونس" }
summary:
  ar: "جلال الدين عبيد الله بن يونس وزير الخليفة الناصر لدين الله؛ جعله المقدم على عسكر كثير أرسله ثالث صفر سنة أربع وثمانين وخمسمائة إلى مساعدة قزل على كف السلطان طغرل عن البلاد، فالتقى طغرل ثامن ربيع الأول بدية مرج عند همذان فانهزم عسكر بغداد وتفرق، وثبت هو قائماً ومعه مصحف وسيف حتى أسره رجل من عسكر طغرل وأخذ ما معه من خزانة وسلاح ودواب؛ وكان صلاح الدين قد توقع هزيمته لحداثة عهده بالولاية وقلة معرفته بالحرب {cite:kamil-ibn-al-athir p. 178-179}."
  en: "Al-Nasir's vizier, sent at the head of the caliphal host to aid Qizil — broken at Daya Marj in Rabi' I 584, he stood with mushaf and sword until a trooper of Tughril's took him and his treasury; Saladin had predicted the rout of a minister new to office and war {cite:kamil-ibn-al-athir p. 178-179}."
  es: "El visir de Al-Nasir, enviado al frente del ejército califal para ayudar a Qizil —derrotado en Daya Marj en Rabi' I 584—, se mantuvo firme con el Corán y la espada hasta que un soldado de Tughril lo capturó a él y a su tesoro; Saladino había predicho la derrota de un ministro nuevo en el cargo y en la guerra {cite:kamil-ibn-al-athir p. 178-179}."
  fr: "Le vizir d'Al-Nasir, envoyé à la tête de l'armée califale pour aider Qizil, fut vaincu à Daya Marj en Rabi' I 584. Il tint bon avec son mushaf et son épée jusqu'à ce qu'un soldat de Tughril le prenne avec son trésor; Saladin avait prédit la déroute d'un ministre nouveau dans ses fonctions et à la guerre {cite:kamil-ibn-al-athir p. 178-179}."
  ur: "الناصر کا وزیر، جو قزل کی مدد کے لیے خلیفہ کے سربراہ کے پاس بھیجا گیا - ربیع اول 584 میں دیا مرج کے مقام پر ٹوٹا، وہ مصحف اور تلوار کے ساتھ کھڑا رہا یہاں تک کہ طغرل کے ایک دستے نے اسے اور اس کے خزانے کو لے لیا؛ صلاح الدین نے عہدہ اور جنگ میں نئے وزیر کی شکست کی پیشین گوئی کی تھی۔ 178-179}۔"
  tr: "Halife el-Nasir li-Din Allah'ın bakanı Celaleddin Ubeydullah bin Yunus, onu Kahir ordusunun komutanı olarak atadı ve 584 Hicri yılının üçüncü Seferi'ne Kazil'e Sultan Tuğril'i ülkeden püskürtmesinde yardım etmesi için gönderdi. Tuğril, Rebi'l-Avval'ın sekizinde Hamadan'a yakın Diya Marj'da Tuğril ile karşılaştı ve Bağdat ordusu yenildi ve dağıldı. Tuğril'in ordusundan bir adam onu yakalayıp hazinesi, silahları ve hayvanlarını ele geçirene kadar bir Kur'an ve kılıç taşıyarak ayakta durdu. Salaheddin, eyaletteki genç saltanatının yapısı ve savaş konusundaki sınırlı bilgisi nedeniyle yenilgisini önceden tahmin etmişti {atıf:kamil-ibn-al-athir s. 178-179}."
  id: "Jalal al-Din Ubayd Allah ibn Yunus, menteri Khalifah al-Nasir li-Din Allah, mengangkatnya sebagai komandan tentara Kahir dan mengirimnya pada tanggal ketiga Safar tahun 584 H untuk membantu Qazil mengusir Sultan Tughril dari negeri itu. Tughril bertemu Tughril pada tanggal delapan Rabi' al-Awwal di Diya Marj dekat Hamadan, dan pasukan Baghdad dikalahkan dan tercerai-berai. Ia tetap berdiri, membawa Al-Qur'an dan pedang sampai seorang pria dari pasukan Tughril menangkapnya dan mengambil harta, senjata, serta ternaknya. Salah al-Din telah memperkirakan kekalahannya karena sifat mudanya di provinsi tersebut dan pengetahuan terbatasnya tentang perang {cite:kamil-ibn-al-athir hlm. 178-179}."
