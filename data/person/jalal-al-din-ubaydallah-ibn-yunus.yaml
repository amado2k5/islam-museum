summary:
  ar: "جلال الدين عبيد الله بن يونس وزير الخليفة الناصر لدين الله؛ جعله المقدم على عسكر كثير أرسله ثالث صفر سنة أربع وثمانين وخمسمائة إلى مساعدة قزل على كف السلطان طغرل عن البلاد، فالتقى طغرل ثامن ربيع الأول بدية مرج عند همذان فانهزم عسكر بغداد وتفرق، وثبت هو قائماً ومعه مصحف وسيف حتى أسره رجل من عسكر طغرل وأخذ ما معه من خزانة وسلاح ودواب؛ وكان صلاح الدين قد توقع هزيمته لحداثة عهده بالولاية وقلة معرفته بالحرب {cite:kamil-ibn-al-athir p. 178-179}."
  en: "Al-Nasir's vizier, sent at the head of the caliphal host to aid Qizil — broken at Daya Marj in Rabi' I 584, he stood with mushaf and sword until a trooper of Tughril's took him and his treasury; Saladin had predicted the rout of a minister new to office and war {cite:kamil-ibn-al-athir p. 178-179}."
