summary:
  ar: "أبو الحسين أحمد بن محمد النوري، من صوفية بغداد في أيام الموفق، يعدّه السراج في اللمع «من الواجدين ومن أهل الإشارات اللطيفة» وله كلام مشكل وأشعار كثيرة؛ ويروي أن غلام خليل شهد عليه بالزندقة عند الموفق لقوله في عشق الله، فاحتج بآية المحبة فبكى الموفق {cite:luma-sarraj-jadir-dar-al-fath p. 546} {cite:luma-sarraj-jadir-dar-al-fath p. 547}."
  en: "Abu al-Husayn Ahmad ibn Muhammad al-Nuri, a Baghdad Sufi of al-Muwaffaq's time, whom al-Sarraj in al-Luma' counts 'among the ecstatics and the people of subtle allusions', with difficult sayings and many verses; he relates that Ghulam Khalil testified to al-Muwaffaq that he was a zindiq for his talk of loving God passionately, and that he answered with the verse of divine love and al-Muwaffaq wept {cite:luma-sarraj-jadir-dar-al-fath p. 546} {cite:luma-sarraj-jadir-dar-al-fath p. 547}."
  ur: "ابو الحسین احمد بن محمد نوری، موفق کے زمانے کے بغدادی صوفی، جنہیں سراج اللمع میں «واجدین اور لطیف اشارات والوں میں سے» شمار کرتے ہیں، جن کا کلام مشکل اور اشعار بہت ہیں؛ وہ بیان کرتے ہیں کہ غلام خلیل نے موفق کے سامنے اللہ سے عشق کی بات پر ان کے زندیق ہونے کی گواہی دی، تو انہوں نے آیتِ محبت سے جواب دیا اور موفق رو پڑا {cite:luma-sarraj-jadir-dar-al-fath p. 546} {cite:luma-sarraj-jadir-dar-al-fath p. 547}۔"
