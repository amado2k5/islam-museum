  en: "In al-Baladhuri: a man of the Tunis frontier army who gathered a host against Musa al-Hadi's agent al-Aghlab ibn Salim, besieging him at Qayrawan; when al-Aghlab fell dead to an arrow, Harish and his army fled, al-Aghlab's men pursued three days and killed him at Suq al-Ahad — the original also reads 'Nafid' and 'Kharish'."
