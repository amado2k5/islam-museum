id: person/harish-al-tunisi
class: person
label: { ar: "حريش" }
summary:
  ar: "عند البلاذري: رجل كان من جند الثغر من تونس جمع على الأغلب بن سالم عامل موسى الهادي فحصره بقيروان إفريقية فلما أصيب الأغلب بسهم ميتاً انهزم حريش وجيشه فأتبعهم أصحاب الأغلب ثلاثة أيام فقتلوهم وقتلوا حريشاً بموضع يعرف بسوق الأحد — وفي الأصل «نافد» و«خريش»."
  en: "In al-Baladhuri: a man of the Tunis frontier army who gathered a host against Musa al-Hadi's agent al-Aghlab ibn Salim, besieging him at Qayrawan; when al-Aghlab fell dead to an arrow, Harish and his army fled, al-Aghlab's men pursued three days and killed him at Suq al-Ahad — the original also reads 'Nafid' and 'Kharish'."
  es: "En al-Baladhuri: un hombre del ejército fronterizo de Túnez que reunió un ejército contra el agente de Musa al-Hadi, al-Aghlab ibn Salim, sitiándolo en Qayrawan; cuando al-Aghlab cayó muerto por una flecha, Harish y su ejército huyeron, los hombres de al-Aghlab lo persiguieron durante tres días y lo mataron en Suq al-Ahad; el original también dice 'Nafid' y 'Kharish'."
  fr: "Dans al-Baladhuri: un homme de l'armée frontalière de Tunis qui rassembla une armée contre l'agent de Musa al-Hadi, al-Aghlab ibn Salim, l'assiégeant à Qayrawan; lorsqu'al-Aghlab tomba mortellement touché par une flèche, Harish et son armée s'enfuirent, les hommes d'al-Aghlab le poursuivirent pendant trois jours et le tuèrent à Suq al-Ahad — le texte original porte également les noms de « Nafid » et « Kharish »."
