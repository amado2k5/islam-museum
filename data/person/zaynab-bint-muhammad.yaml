summary:
  ar: أكبر بنات النبي وأول من تزوج منهن؛ زوجها أبو العاص بن الربيع، وأجارته في المدينة، وأعادها النبي إليه بعد إسلامه، وتوفيت في أول سنة 8هـ.
  en: The Prophet's eldest daughter, married to Abu al-As ibn al-Rabi; she gave him protection in Medina, the Prophet returned her to him after he embraced Islam, and she died at the start of 8 AH.
  ur: "نبی کی بڑی بیٹی، ابو العاص بن ربیع کی بیوی؛ مدینہ میں اس نے اسے پناہ دی اور نبی نے اسے واپس کیا۔"
  es: "La hija mayor del Profeta, casada con Abu al-As ibn al-Rabi, le brindó protección en Medina. El Profeta la devolvió a él después de que abrazara el Islam, y ella falleció a principios del año 8 de la Hégira."
  fr: "La fille aînée du Prophète, mariée à Abu al-As ibn al-Rabi; elle lui offrit sa protection à Médine, le Prophète la lui rendit après qu'il eut embrassé l'Islam, et elle mourut au début de l'an 8 de l'Hégire."
  tr: "Peygamber'in en büyük kızı ve onunla ilk evlenen kişi; Ebu el-Es ibn el-Rabi ile evlendi ve onu Medine'de kiracı olarak aldı. Peygamber, İslam'a geçtikten sonra onu kendisine geri verdi. 8 Hicri yılının başlarında vefat etti."
  id: "Putri sulung Nabi dan yang pertama menikahinya; ia menikahi Abu al-As ibn al-Rabi dan menjadikannya penyewa di Madinah. Nabi mengembalikannya kepadanya setelah ia memeluk Islam. Ia wafat pada awal tahun 8 H."
