summary:
  ar: "سبحان قلي خان (1625–1702)، سادس خان بخارى من الأسرة الأشتارخانية، حكم بلخ من 1651 إلى 1680 ثم بخارى من 1681 إلى وفاته. واجه غارات خوارزم المتكررة وردّها سنة 1687، وتبادل السفارات مع أورانغزيب والسلطان العثماني أحمد الثاني، وبنى مدارس في بخارى وبلخ ومستشفى دار الشفاء في بخارى. كان طبيبًا يمارس العلاج بنفسه، فألّف بالتركية الوسطى كتاب «إحياء الطب سبحاني» ورسالة في الفلك، ونظم الشعر باسم قلمي «نيشوني»."
  en: "Subhan Quli Khan (1625-1702) was the sixth khan of Bukhara of the Ashtarkhanid dynasty, ruling Balkh from 1651 to 1680 and then Bukhara from 1681 until his death. He faced repeated Khwarazmian raids and defeated them in 1687, exchanged embassies with Aurangzeb and the Ottoman sultan Ahmed II, and built madrasas in Bukhara and Balkh and the Dor-ush-Shifo hospital in Bukhara. Himself a practising physician, he wrote the medical work Ihya at-tibb Subhani in Central Asian Turkic and a treatise on astronomy, and composed poetry under the pen name Nishoni."
  ur: "سبحان قلی خان (1625ء–1702ء) بخارا کے اشترخانی خاندان کے چھٹے خان تھے؛ 1651ء سے 1680ء تک بلخ اور پھر 1681ء سے وفات تک بخارا پر حکمران رہے۔ انھوں نے خوارزم کے پے در پے حملے روکے اور 1687ء میں انھیں شکست دی، اورنگزیب اور عثمانی سلطان احمد ثانی سے سفارتیں بدلیں، اور بخارا و بلخ میں مدارس اور بخارا میں دار الشفا اسپتال بنوایا۔ وہ خود علاج کرنے والے طبیب تھے؛ انھوں نے وسطی ایشیائی ترکی میں طبی کتاب «احیاء الطب سبحانی» اور فلکیات پر ایک رسالہ لکھا اور «نیشونی» تخلص سے شعر کہے۔"

