summary:
  ar: "عالم النفس الأمريكي أبراهام ماسلو، كما يقدّمه طارق السويدان: نزل سنة 1943 بنظرية «هرم الحاجات الإنسانية» التي ترتّب حاجات الإنسان من الفيزيولوجية إلى تحقيق الذات."
  en: "The American psychologist Abraham Maslow, as presented by Tareq al-Suwaidan: in 1943 he published the 'hierarchy of human needs', ordering man's needs from the physiological to self-actualisation."
  ur: "امریکی ماہر نفسیات ابراہم ماسلو، جیسا کہ طارق السویدان پیش کرتے ہیں: 1943 میں «انسانی ضرورتوں کا ھرمی» نازل کیا جس نے انسان کی ضرورتوں کو جسمانی سے خود انکشاف تک ترتیب دیا۔"
  fr: "Le psychologue américain Abraham Maslow, tel que le présente Tareq al-Suwaidan : en 1943, il publia la « hiérarchie des besoins humains », ordonnant les besoins de l'homme des besoins physiologiques jusqu'à la réalisation de soi."
  es: "El psicólogo estadounidense Abraham Maslow, según lo presenta Tareq al-Suwaidan: en 1943 publicó la \"jerarquía de las necesidades humanas\", ordenando las necesidades del hombre desde las fisiológicas hasta la autorrealización."
