names:
  - { value: "أقضى القضاة برهان الدين أبو إسحاق إبراهيم بن محمد بن عباد الله بن محمد بن مفلح الحنبلي", kind: full }
gender: male
summary:
  ar: "أقضى القضاة برهان الدين إبراهيم بن مفلح الحنبلي شيخ الإسلام سيد العلماء والحكام ذو الدين المتين والورع واليقين شيخ العصر وبركته؛ اشتغل وحصل ودأب وجمع وسلم إليه القول والفعل من أرباب المذاهب كلها وصار مرجع الفقهاء والناس والمعول عليه في الأمور وباشر قضاء دمشق مراراً مع الدين والورع ونفوذ الكلمة وصنف شرح المقنع في الفقه وطبقات الأصحاب مرتبة على حروف المعجم سماه المقصد الأرشد في ترجمة أصحاب الإمام أحمد وصنف كتاباً في الأصول وغير ذلك، توفي بدمشق في خامس شعبان سنة أربع وثمانين وثمانمائة بمنزلة بالصالحية ودفن بالروضة عند أسلافه {cite:shadharat-dhahab p. 338-339}."
  en: "Burhan al-Din ibn Muflih — 'shaykh al-Islam, master of scholars and rulers, blessing of the age,' Damascus's qadi time and again; author of sharh al-Muqni' and the alphabetical Hanbali tabaqat al-Maqsad al-Arshad; died 5 Sha'ban 884 at Salihiyya, buried by his ancestors in the Rawda {cite:shadharat-dhahab p. 338-339}."
  es: "Burhan al-Din ibn Muflih: 'sheij al-Islam, maestro de eruditos y gobernantes, bendición de la época', cadí de Damasco una y otra vez; autor de sharh al-Muqni' y del tabaqat al-Maqsad al-Arshad alfabético en hanbalí; murió el 5 de Sha'ban de 884 en Salihiyya, enterrado por sus antepasados en Rawda {cita: shadharat-dhahab p. 338-339}."
  fr: "Burhan al-Din ibn Muflih — « cheikh al-Islam, maître des érudits et des dirigeants, bénédiction du siècle », le cadi de Damas à maintes reprises; auteur de Sharh al-Muqni' et du tabaqat alphabétique hanbali al-Maqsad al-Arshad; décédé le 5 Sha'ban 884 à Salihiyya, enterré par ses ancêtres à Rawda {cite:shadharat-dhahab p. 338-339}."
  ur: "برہان الدین ابن مفلح - 'شیخ الاسلام، علماء اور حکمرانوں کے ماسٹر، عمر کی برکت،' دمشق کے قاضی بار بار؛ شرح المقنی کے مصنف اور حروف تہجی حنبلی طبقات المقصد الارشاد؛ وفات 5 شعبان 884 کو صالحیہ میں ان کے آباء و اجداد نے روضہ میں دفن کی 338-339}۔"
  tr: "Hakim, İslam'ın şeyhi, alimlerin ve yöneticilerin ustası, sağlam dine, dindarlığa ve kesinliğe sahip, dönemin efendisi ve bereketine sahip Burhan al-Din İbrahim ibn Muflih al-Hanbali'ydi. Çalışkan, gayretli, gayretli ve derliydi; tüm düşünce ve eylem mezhebinden tüm alimler ona emanet edilmişti. Hukukçular, insanlar için referans noktası oldu ve konularda güvenildi. Şam'da din, dindarlık ve Sözün etkisi. Fıkıh alanında al-Muqni' ve sahabelerin sınıfları üzerine bir yorum yazdı; sözlükte alfabetik olarak düzenlenmiş sahabeler Al-Maqsid al-Arshad fi bi-bijram adını verdi. İlkeler ve diğer konular üzerine bir kitap yazdı. 884 Hicri yılında, Şaban ayının beşinde, El-Salihiye'deki görevinde Şam'da öldü ve atalarının yanına El-Ravide'de defnedildi {alıntı: Shadharat-Dhahab, s. 338-339}."
  id: "Hakimnya adalah Burhan al-Din Ibrahim ibn Muflih al-Hanbali, Sheikh Islam, guru para ulama dan penguasa, memiliki agama, kesalehan, dan keyakinan yang kuat, penguasa zaman itu dan berkatnya. Ia rajin, rajin, rajin, dan terkendali, dan kepada siapa semua ulama dari semua aliran pemikiran dan perbuatan dipercayakan kepadanya. Ia menjadi rujukan bagi para ahli hukum, masyarakat, dan diandalkan dalam urusan ini. Ia berulang kali menjabat sebagai hakim di Damaskus dengan agama, kesalehan, dan pengaruh kata itu. Ia menulis komentar tentang al-Muqni' dalam bidang hukum dan kelas-kelas sahabat disusun secara alfabetis dalam kamus, yang ia sebut Al-Maqsid al-Arshad fi bi-bijram para sahabat Imam Ahmad. Ia menulis sebuah buku tentang prinsip dan topik lainnya. Ia meninggal di Damaskus pada tanggal lima Sha'ban tahun 884 H dalam posisinya di Al-Salihiyah dan dimakamkan di Al-Rawdah dekat leluhurnya {cite:Shadharat-Dhahab, hlm. 338-339}."
