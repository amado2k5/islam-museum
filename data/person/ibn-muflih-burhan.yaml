gender: male
summary:
  ar: "أقضى القضاة برهان الدين إبراهيم بن مفلح الحنبلي شيخ الإسلام سيد العلماء والحكام ذو الدين المتين والورع واليقين شيخ العصر وبركته؛ اشتغل وحصل ودأب وجمع وسلم إليه القول والفعل من أرباب المذاهب كلها وصار مرجع الفقهاء والناس والمعول عليه في الأمور وباشر قضاء دمشق مراراً مع الدين والورع ونفوذ الكلمة وصنف شرح المقنع في الفقه وطبقات الأصحاب مرتبة على حروف المعجم سماه المقصد الأرشد في ترجمة أصحاب الإمام أحمد وصنف كتاباً في الأصول وغير ذلك، توفي بدمشق في خامس شعبان سنة أربع وثمانين وثمانمائة بمنزلة بالصالحية ودفن بالروضة عند أسلافه {cite:shadharat-dhahab p. 338-339}."
  en: "Burhan al-Din ibn Muflih — 'shaykh al-Islam, master of scholars and rulers, blessing of the age,' Damascus's qadi time and again; author of sharh al-Muqni' and the alphabetical Hanbali tabaqat al-Maqsad al-Arshad; died 5 Sha'ban 884 at Salihiyya, buried by his ancestors in the Rawda {cite:shadharat-dhahab p. 338-339}."
