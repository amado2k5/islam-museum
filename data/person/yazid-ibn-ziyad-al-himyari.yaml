summary:
  ar: "يزيد بن زياد بن ربيعة بن مفرع الحميري؛ أقطعه شريك بن الأعور بأمر ابن زياد أرضاً بكرمان فباعها بعد هرب ابن زياد من البصرة."
  en: "Yazid ibn Ziyad ibn Rabi'a ibn Mufarri' al-Himyari; granted Kirman land at Ibn Ziyad's letter to Shurayk, sold after Ibn Ziyad's flight from Basra."
  es: "Yazid ibn Ziyad ibn Rabi'a ibn Mufarri' al-Himyari; concedió a Kirman tierras en la carta de Ibn Ziyad a Shurayk, vendidas después de la huida de Ibn Ziyad de Basora."
  fr: "Yazid ibn Ziyad ibn Rabi'a ibn Mufarri' al-Himyari; a accordé à Kirman des terres à la lettre d'Ibn Ziyad à Shurayk, vendues après la fuite d'Ibn Ziyad de Bassorah."
  ur: "یزید بن زیاد بن ربیعہ ابن مفری الحمیری؛ ابن زیاد کے شوریق کو لکھے گئے خط پر کرمان کو زمین دی، جو ابن زیاد کی بصرہ سے پرواز کے بعد فروخت ہوئی۔"
  tr: "Yezid ibn Ziyad ibn Rabi'ah ibn Mufra' al-Himyari; Şerik bin el-A'war, İbn Ziyad'ın emriyle ona Kerman'da toprak verdi ve İbn Ziyad Basra'dan kaçtıktan sonra Sharik besli toprakları sattı."
  id: "Yazid ibn Ziyad ibn Rabi'ah ibn Mufra' al-Himyari; Sharik ibn al-A'war memberinya tanah di Kerman atas perintah Ibn Ziyad, dan ia menjualnya setelah Ibn Ziyad melarikan diri dari Basra."
