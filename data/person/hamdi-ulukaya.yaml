summary:
  ar: "حمدي أولوكايا ⁦(وُلد سنة ١٩٧٢ في إيليتش بشرق تركيا)⁩ رجل أعمال تركي أمريكي من أصل كردي، مؤسس شركة تشوباني لليوغورت المصفّى ومالكها ورئيسها التنفيذي؛ نشأ في أسرة كردية لتربية الماشية ومنتجات الألبان، ونشط في الحركة الحقوقية الكردية قبل انتقاله إلى الولايات المتحدة سنة ١٩٩٤، وبنى تشوباني من مصنع يوغورت متعثر اشتراه سنة ٢٠٠٥ حتى تجاوزت مبيعاتها مليار دولار، وعُرف بعمله الخيري ودعمه لتوظيف اللاجئين."
  en: "Hamdi Ulukaya (born 1972 in Ilic, eastern Turkey) is a Turkish-American businessman of Kurdish ethnicity, founder, owner and CEO of the Chobani strained-yogurt company; raised in a Kurdish dairy-farming family and active in the Kurdish-rights movement before moving to the United States in 1994, he built Chobani from a derelict yogurt plant bought in 2005 into a billion-dollar brand, and is known for his philanthropy and his hiring of refugees."
  ur: "حمدی اولوکایا ⁦(پیدائش 1972، ایلیچ، مشرقی ترکی)⁩ کرد نژاد ترک امریکی کاروباری ہیں، چوبانی کمپنی کے بانی و سی ای او؛ کرد مویشی پال خاندان میں پرورش پائی، کرد حقوق کی تحریک سے وابستہ رہے، 1994 میں امریکہ منتقل ہوئے، اور 2005 میں خریدے گئے کارخانے سے چوبانی کو ارب ڈالر برانڈ بنایا؛ وہ سماجی کاموں اور مہاجرین کی ملازمت کے لیے بھی معروف ہیں۔"
