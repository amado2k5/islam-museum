summary:
  ar: "الشيخ يحيى الشيرواني القليوري الحنفي شيخ الطريقة الخلوتية في أرض باكو؛ ومن بقية أصحابه نزل بشيروان واختلف إليه أعيان الأمراء والسلاطين والعلماء والفقراء وروى من الأوراد اللطيفة ومن الخدمة الجزيلة وثقل حملها، وكان فيه منه ظاهر في زهده وعبادته وقد تبعه من الفقراء ما يزيد على عشرة آلاف ورسمهم على الخلوات والأذكار والأوراد وقد فرقهم على خلفائه في بلاد شيروان وبكوية وأرمينية وجيلان وآذريجان والعجم فما كاد يسلم أحد إلى شيخ من غير طريقته، قيل إنه أول من أوجد نظام الخلفاء الذي عليه مشايخ الطرق اليوم ويقال إن أصل الخلوية إليه، توفي في سنة ثمان وستين وثمانمائة أو قبل بقليل بأرض باكو {cite:shadharat-dhahab p. 309}."
  en: "Yahya al-Shirwani — 'shaykh of the Khalwati way at Baku,' who 'first instituted the khulafa' system on which the turuq run today' and whose name some give to the very Khalwatiyya; over ten thousand murids followed him and his deputies were planted across Shirvan, Armenia, Gilan and 'Ajam; died ~868 at Baku {cite:shadharat-dhahab p. 309}."
  es: "Yahya al-Shirwani — 'shaykh de la vía Khalwati en Bakú', quien 'instituyó por primera vez el sistema khulafa' sobre el cual se rigen los turuq hoy en día' y cuyo nombre algunos dan a la propia Khalwatiyya; más de diez mil murids lo siguieron y sus delegados se establecieron en Shirvan, Armenia, Gilan y 'Ajam; murió alrededor del año 868 en Bakú {cita: shadharat-dhahab p. 309}."
  fr: "Yahya al-Shirwani — « cheikh de la voie Khalwati à Bakou », qui « a institué le premier le système des khulafas sur lequel les turuq fonctionnent aujourd'hui » et dont certains donnent le nom à la Khalwatiyya elle-même; plus de dix mille murids l'ont suivi et ses adjoints ont été implantés à travers le Shirvan, l'Arménie, le Gilan et l'Ajam; mort vers 868 à Bakou {cite: shadharat-dhahab p. 309}."
  ur: "یحییٰ الشیروانی - 'باکو میں خلوطی طریقہ کے شیخ'، جس نے 'سب سے پہلے خلفاء' کا نظام قائم کیا جس پر آج تروک چلتے ہیں' اور جن کا نام کچھ لوگ خلوطیہ کو دیتے ہیں۔ دس ہزار سے زیادہ مریدوں نے اس کی پیروی کی اور شیروان، آرمینیا، گیلان اور عجم میں اس کے نائبین لگائے گئے۔ 868ء میں باکو میں وفات پائی۔ 309}۔"
  tr: "Şeyh Yahya el-Şirvani el-Kalyuri el-Hanafi, Bakü topraklarındaki Halvatiye tarikatının şeyhiydi; yoldaşları arasında, önde gelen prensler, sultanlar, alimler ve yoksulların anlaşmazlık yaşadığı Şirvan'da yerleşti. Nazik ilahilerden, büyük hizmetlerden ve görevlerinin ağır yüklerinden anlattı. Münzeviyetinde ve ibadetinde kendini gösteriyordu. On binden fazla fakir insan onu takip etti ve onları inzivalara, dualara yazdı, ve ilahiler. Bunları Şirvan, Bakuye, Ermenistan, Cilan, Azerbaycan ve Arap olmayanlara dağıttı. Neredeyse hiç kimse kendi tarikatı dışında bir şeyh'e emanet edilmedi. Bugün tarikatların şeyhlerine göre halifelik sistemini ilk kuran kişi olduğu söylenir ve khaliyya'nın kökeninin ondan geldiği söylenir. 868 Hicri yılında ya da kısa bir süre önce Bakü topraklarında öldü {alıntı: Shadharat-Dhahab, s. 309}."
  id: "Sheikh Yahya al-Shirwani al-Qalyuri al-Hanafi adalah sheikh tarekat Khalwatiya di tanah Baku; di antara para sahabatnya, ia menetap di Shirwan, di mana para pangeran, sultan, cendekiawan, dan orang miskin yang terkemuka berselisih pendapat. Ia menceritakan dari himne lembut, pelayanan besar, dan beban berat tugasnya. Ia terlihat jelas dalam asketisme dan pemujaannya. Lebih dari sepuluh ribu orang miskin mengikutinya, dan ia menuliskan mereka dalam masa persembunyian, doa dan himne. Ia membagikannya kepada para khalifahnya di tanah Shirwan, Bakuyya, Armenia, Jilan, Azerbaijan, dan non-Arab. Hampir tidak ada yang dipercayakan kepada seorang sheikh selain ordonya. Dikatakan bahwa ia adalah yang pertama mendirikan sistem khalifah mengikuti sheikh ordo saat ini, dan konon asal-usul khaliyya berasal darinya. Ia meninggal pada tahun 868 H, atau tak lama sebelumnya di tanah Baku {cite:Shadharat-Dhahab, hlm. 309}."
