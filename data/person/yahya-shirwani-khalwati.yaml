summary:
  ar: "الشيخ يحيى الشيرواني القليوري الحنفي شيخ الطريقة الخلوتية في أرض باكو؛ ومن بقية أصحابه نزل بشيروان واختلف إليه أعيان الأمراء والسلاطين والعلماء والفقراء وروى من الأوراد اللطيفة ومن الخدمة الجزيلة وثقل حملها، وكان فيه منه ظاهر في زهده وعبادته وقد تبعه من الفقراء ما يزيد على عشرة آلاف ورسمهم على الخلوات والأذكار والأوراد وقد فرقهم على خلفائه في بلاد شيروان وبكوية وأرمينية وجيلان وآذريجان والعجم فما كاد يسلم أحد إلى شيخ من غير طريقته، قيل إنه أول من أوجد نظام الخلفاء الذي عليه مشايخ الطرق اليوم ويقال إن أصل الخلوية إليه، توفي في سنة ثمان وستين وثمانمائة أو قبل بقليل بأرض باكو {cite:shadharat-dhahab p. 309}."
  en: "Yahya al-Shirwani — 'shaykh of the Khalwati way at Baku,' who 'first instituted the khulafa' system on which the turuq run today' and whose name some give to the very Khalwatiyya; over ten thousand murids followed him and his deputies were planted across Shirvan, Armenia, Gilan and 'Ajam; died ~868 at Baku {cite:shadharat-dhahab p. 309}."
