summary:
  ar: "القاضي أبو علي ابن أبي هريرة البغدادي. درس على أبي العباس ابن سريج وعلى أبي إسحاق المروزي، وشرح المزني، وعلّق عنه الشرح أبو علي الطبري، ودرّس ببغداد ومات سنة خمس وأربعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}. ذكر الخطيب أنه مات في رجب من تلك السنة {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  en: "Qadi Abu Ali Ibn Abi Hurayra al-Baghdadi. He studied under Abu al-Abbas Ibn Surayj and under Abu Ishaq al-Marwazi, and wrote a commentary on al-Muzani, which Abu Ali al-Tabari recorded from him; he taught in Baghdad and died in 345 {cite:tabaqat-fuqaha-abbas-1981 p. 59}. al-Khatib mentions that he died in Rajab of that year {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
