summary:
  ar: "القاضي أبو علي ابن أبي هريرة البغدادي. درس على أبي العباس ابن سريج وعلى أبي إسحاق المروزي، وشرح المزني، وعلّق عنه الشرح أبو علي الطبري، ودرّس ببغداد ومات سنة خمس وأربعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}. ذكر الخطيب أنه مات في رجب من تلك السنة {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  en: "Qadi Abu Ali Ibn Abi Hurayra al-Baghdadi. He studied under Abu al-Abbas Ibn Surayj and under Abu Ishaq al-Marwazi, and wrote a commentary on al-Muzani, which Abu Ali al-Tabari recorded from him; he taught in Baghdad and died in 345 {cite:tabaqat-fuqaha-abbas-1981 p. 59}. al-Khatib mentions that he died in Rajab of that year {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  fr: "Le cadi Abu Ali Ibn Abi Hurayra al-Baghdadi. Il étudia auprès d'Abu al-Abbas Ibn Surayj et d'Abu Ishaq al-Marwazi, et écrivit un commentaire d'al-Muzani, qu'Abu Ali al-Tabari consigna de lui ; il enseigna à Bagdad et mourut en 345 {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Khatib mentionne qu'il mourut en Rajab de cette année {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  es: "Qadi Abu Ali Ibn Abi Hurayra al-Baghdadi. Estudió con Abu al-Abbas Ibn Surayj y con Abu Ishaq al-Marwazi, y escribió un comentario sobre al-Muzani, que Abu Ali al-Tabari transcribió de él; enseñó en Bagdad y murió en 345 {cite:tabaqat-fuqaha-abbas-1981 p. 59}. Al-Khatib menciona que murió en Rajab de ese año {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  ur: "قاضی ابو علی ابن ابی ہریرہ البغدادی۔ اس نے ابو العباس ابن سریج اور ابو اسحاق المروازی سے تعلیم حاصل کی، اور المزانی پر ایک تفسیر لکھی، جسے ابو علی الطبری نے ان سے درج کیا ہے۔ آپ نے بغداد میں درس دیا اور 345 میں وفات پائی۔ 59}۔ الخطیب نے ذکر کیا ہے کہ ان کی وفات اسی سال رجب میں ہوئی۔ 59}۔"
