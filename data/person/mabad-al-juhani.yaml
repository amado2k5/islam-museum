  ar: "معبد الجهني تابع أبا يونس الأسواري المعروف بسنسويه في الكلام في القدر عند البلخي، وكان أبو يونس رجلا من الأساورة وأول من تكلم في القدر والاعتزال، ويقال إن سليمان بن عبد الملك تكلم فيه {cite:fihrist-ibn-al-nadim p. 557}."
