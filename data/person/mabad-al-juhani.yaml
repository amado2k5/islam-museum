  tr: "Juhani Tapınağı'nı, Al-Balkhi'ye göre kader üzerine konuşmasında Sansuwayh olarak bilinen Ebu Yunus el-Esvari takip etti. Ebu Yunus, Asvara'dan bir adamdı ve kader ile Mu'tazilit (Mu'tazilitler) hakkında ilk konuşan kişiydi. Süleyman ibn Abdülmelik'in bundan bahsettiği söylenir {atıf:Fihrist-ibn-al-Nadim s. 557}."
  id: "Kuil Juhani diikuti oleh Abu Yunus al-Aswari, yang dikenal sebagai Sansuwayh, dalam ceramahnya tentang predestinasi menurut al-Balkhi. Abu Yunus adalah orang dari Aswara dan yang pertama berbicara tentang predestinasi dan Mu'tazilite (Mu'tazilit). Konon Sulayman ibn Abd al-Malik membicarakannya {cite:fihrist-ibn-al-nadim hlm. 557}."
