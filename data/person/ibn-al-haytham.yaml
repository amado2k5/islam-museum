summary:
  ar: "الحسن بن الهيثم، عالم عربي في الرياضيات والفيزياء، صنّف كتاب المناظر في البصريات، ويصفه محقق طبعة الكتاب بأنه من القرن الخامس الهجري {cite:manazir-sabra-1983 p.9}. وُلد في البصرة نحو354هـ/965م، وقصد مصر في عهد الحاكم وحاول تنظيم جريان النيل، ثم عاد إلى القاهرة ينسخ المخطوطات العلمية. وتعدّه دائرة المعارف الإسلامية من أبرز الرياضيين العرب وأفضل الفيزيائيين، وتنسب إليه أكثر من مئة مصنف."
  en: "Arab mathematician and physicist whose Kitab al-Manazir is the principal optical work of the Islamic world. The editor places him in the fifth century AH {cite:manazir-sabra-1983 p.9}. Born at Basra around 354 AH/965, he went to Egypt under al-Hakim, tried to regulate the Nile, and later earned his living in Cairo copying scientific manuscripts. The Encyclopaedia of Islam counts him among the principal Arab mathematicians and the best physicist, with more than a hundred titles to his name."
  ur: "الحسن بن الہیثم ایک عرب ریاضی دان اور طبیعیات دان تھے جن کی کتاب المناظر بصریات میں اسلامی دنیا کی بنیادی تصنیف ہے۔ کتاب کے محقق انھیں پانچویں صدی ہجری میں رکھتے ہیں {cite:manazir-sabra-1983 p.9}۔ وہ بصرہ میں تقریباً354ھ/965ء میں پیدا ہوئے، الحاکم کے عہد میں مصر گئے اور نیل کو منظم کرنے کی کوشش کی، پھر قاہرہ میں علمی مخطوطات کی نقل سے گزر بسر کی۔ اسلامی دائرۃ المعارف انھیں نمایاں ترین عرب ریاضی دانوں اور بہترین طبیعیات دان میں شمار کرتی ہے اور ان کی سو سے زیادہ تصانیف بتاتی ہے۔"
