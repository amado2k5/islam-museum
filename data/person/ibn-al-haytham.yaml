    basis: self-identified
    note: "The Kitab al-Manazir opens in his own name with the basmala (Kuwait 1983 ed., scan p. 60), and TDV records that he wrote treatises answering Ibn al-Rawandi's and Abu Bakr al-Razi's criticism of prophethood and against the Mu'tazila's views on the divine attributes and the threat of punishment (wa'id) (TDV, vol. 21, pp. 82–87). This shows him a Muslim in his own words; no source read names his school, so he is recorded under the museum's Sunni frame."
    sources: [source/manazir-sabra-1983, source/tdv-ibnul-heysem]
