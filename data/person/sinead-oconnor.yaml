summary:
  ar: شينيد أوكونور ⁦(1966–2023)⁩ مغنية وموسيقية أيرلندية حائزة جائزة غرامي، اشتهرت بأغنية Nothing Compares 2 U؛ اعتنقت الإسلام سنة 2018 متخذةً اسم شهادة صداقة؛ توفيت في 26 يوليو 2023.
  en: Sinéad O'Connor ⁦(1966–2023)⁩ was an Irish singer and musician, a Grammy-winning artist famous for Nothing Compares 2 U, who converted to Islam in 2018 taking the name Shuhada' Sadaqat; she died on
    26 July 2023.
  ur: شینایڈ اوکونر ⁦(1966–2023)⁩ آئرش گلوکارہ اور موسیقار تھیں، گرامی یافتہ فنکارہ جو Nothing Compares 2 U سے مشہور ہوئیں، 2018 میں اسلام قبول کر کے شہادت صداقت نام رکھا؛ 26 جولائی 2023 کو وفات پائی۔
  es: "Sinéad O'Connor (1966–2023) fue una cantante y música irlandesa, artista ganadora de un premio Grammy famosa por Nothing Compares 2 U, que se convirtió al Islam en 2018 adoptando el nombre de Shuhada' Sadaqat; falleció el 26 de julio de 2023."
  fr: "Sinéad O'Connor (1966–2023) était une chanteuse et musicienne irlandaise, une artiste lauréate d'un Grammy célèbre pour Nothing Compares 2 U, qui s'est convertie à l'islam en 2018 en prenant le nom de Shuhada' Sadaqat; elle est décédée le 26 juillet 2023."
