id: person/al-kahina
class: person
label: { ar: "الكاهنة ملكة البربر", en: "Al-Kahina, Queen of the Berbers" }
summary:
  ar: "الكاهنة ملكة البربر؛ غزاها حسان بن النعمان الغساني والي إفريقية فهزمته فلحق بقصور في حيز برقة سُمّيت قصور حسان ثم غزاها ثانية فقتلها وسبى سبياً من البربر.، وعند ابن خلدون وهي دُهية ماتية بنت تيفان ملكة جبل أوراس وقومها من جراوة؛ زحف إليها حسان بن النعمان سنة 79هـ فدخل القيروان ثم مضى إليها حتى نزل وادي مسكيانة فاقتتلوا قتالاً شديداً فانهزم المسلمون وقتل منهم خلق كثير وأسرت خالد بن يزيد القيسي ولم تزل هي والبربر في اتباع حسان والعرب حتى أخرجوهم من عمل قابس واتخذت عهداً عند أسيرها خالد بالرضاع مع ابنيها وأقامت في سلطان إفريقية خمس سنين ثم خربت جميع المدن والضياع حين عاد حسان سنة 74هـ فشق ذلك على البربر فاستأمنوا لحسان فأمنهم وانهزمت في جموعها وقتلت بمكان البئر المعروف بها بجبل أوراس {cite:tarikh-ibn-khaldun-ibar p. 1607-1608}"
  en: "Al-Kahina, queen of the Berbers; Hassan ibn al-Nu'man al-Ghassani, Ifriqiya's governor, raided her and she routed him — he falling back to the Barqa-bound castles named Qusur Hassan — then raiding again he killed her and took a captivity of Berbers."
