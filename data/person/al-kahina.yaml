label: { ar: "الكاهنة ملكة البربر", en: "Al-Kahina, Queen of the Berbers", es: "Al-Kahina, Queen of the Berbers", fr: "Al-Kahina, Queen of the Berbers", ur: "الکہینہ، بربروں کی ملکہ" }
summary:
  ar: "الكاهنة ملكة البربر؛ غزاها حسان بن النعمان الغساني والي إفريقية فهزمته فلحق بقصور في حيز برقة سُمّيت قصور حسان ثم غزاها ثانية فقتلها وسبى سبياً من البربر. وعند ابن خلدون وهي دُهية ماتية بنت تيفان ملكة جبل أوراس وقومها من جراوة؛ زحف إليها حسان بن النعمان سنة 79هـ فدخل القيروان ثم مضى إليها حتى نزل وادي مسكيانة فاقتتلوا قتالاً شديداً فانهزم المسلمون وقتل منهم خلق كثير وأسرت خالد بن يزيد القيسي ولم تزل هي والبربر في اتباع حسان والعرب حتى أخرجوهم من عمل قابس واتخذت عهداً عند أسيرها خالد بالرضاع مع ابنيها وأقامت في سلطان إفريقية خمس سنين ثم خربت جميع المدن والضياع حين عاد حسان سنة 74هـ فشق ذلك على البربر فاستأمنوا لحسان فأمنهم وانهزمت في جموعها وقتلت بمكان البئر المعروف بها بجبل أوراس {cite:tarikh-ibn-khaldun-ibar p. 1607-1608} ذكر الكتاب أن حسان بن النعمان لقيها عند نهر يدعى نيني أو مسكيانة فانتصرت وانسحب إلى قابس، ثم قتلها حسان بعد أن دلّه خالد بن يزيد العبسي على مواضع الجموع، وكان مقتلها عند بئر سميت باسمها قرب قابس. {cite:salabi-umayyad-state-2020 p.59-60}"
  en: "Al-Kahina, queen of the Berbers; Hassan ibn al-Nu'man al-Ghassani, Ifriqiya's governor, raided her and she routed him — he falling back to the Barqa-bound castles named Qusur Hassan — then raiding again he killed her and took a captivity of Berbers."
  es: "Al-Kahina, reina de los bereberes; Hassan ibn al-Nu'man al-Ghassani, gobernador de Ifriqiya, la atacó y ella lo derrotó —él se replegó a los castillos de Qusur Hassan, cerca de Barqa—, luego la atacó de nuevo, la mató y tomó cautivos a los bereberes."
  fr: "Al-Kahina, reine des Berbères; Hassan ibn al-Nu'man al-Ghassani, gouverneur d'Ifriqiya, l'attaqua et elle le mit en déroute — il se replia sur les châteaux de Qusur Hassan, près de Barqa — puis, lors d'un nouveau raid, il la tua et fit prisonnier des Berbères."
  ur: "الکہینہ، بربروں کی ملکہ؛ عفریقیہ کے گورنر حسن بن النعمان الغسانی نے اس پر چھاپہ مارا اور اس نے اسے بھگا دیا - وہ برقع کے ساتھ قصر حسن نامی قلعے میں واپس گرا - پھر دوبارہ چھاپہ مار کر اسے قتل کر دیا اور بربروں کو قید کر لیا۔"
  tr: "El-Kahina, Berberilerin kraliçesiydi; İfrikiye valisi Hasan ibn al-Nu'man al-Ghassani tarafından işgal edildi ve onu mağlup etti. Kürenaika bölgesindeki Qusur Hassan adlı sarayları takip etti, sonra tekrar işgal etti, onu öldürdü ve Berberileri esir aldı. İbn Haldun'a göre, Aurès Dağı kraliçesi Dahiyya Matiya bint Tifan ve Jarawa'dan gelen halkı Hasan ibn al-Nu'man 79 Hicri'de oraya yürüdü, Kairouan'a girdi ve oradan Meskiana vadisine ulaştı. Şiddetli savaştılar, Müslümanlar yenildi, birçoğu öldürüldü ve Halid bin Yezid el-Kaisi esir alındı. O ve Berberiler, Hassan ve Arapları takip etmeye devam ettiler, ta ki onları Gabes'in işinden kovana kadar. Esir Halid ile oğullarına bakmak için bir antlaşma yaptı ve beş yıl boyunca İfriqiye sultanlığında kaldı, ardından tüm şehirler yıkıldı. Kayıp, Hassan'ın 74 Hicri yılında geri dönmesiyle gerçekleşti; bu durum Berberileri rahatsız etti ve onlar da Hassan'a sığınarak korumalarını sağladı. Grup, Aurès Dağı olarak bilinen yerde yenildi ve öldürüldü {atıf:History-ibn-Khaldun-ibar s. 1607-1608}. Kitapta, Hasan ibn al-Nu'man'ın onu Nini veya Miskiana adlı bir nehir yakınında gördüğü, bu yüzden Hasan zafer kazandığı ve Gabes'e çekildiği belirtilir. Sonra Hassan, Halid bin Yezid el-Absi kalabalıkların yerlerini belirttikten sonra onu öldürdü. Gabes yakınlarında onun adını taşıyan bir kuyuda öldürüldü. {cite:salabi-umayyad-state-2020 s.59-60}"
  id: "Al-Kahina adalah ratu Berber; ia diserang oleh Hassan ibn al-Nu'man al-Ghassani, gubernur Ifriqiya, yang mengalahkannya. Ia mengejar istana-istana di wilayah Cyrenaica yang disebut Qusur Hassan, lalu menyerbu lagi, membunuhnya, dan menangkap orang Berber. Menurut Ibn Khaldun, Dahiyya Matiya bint Tifan, ratu Gunung Aurès dan rakyatnya dari Jarawa, Hassan ibn al-Nu'man berbaris ke sana pada tahun 79 H, memasuki Kairouan, dan kemudian pergi ke sana hingga mencapai lembah Meskiana. Mereka bertempur dengan sengit, Muslim dikalahkan, banyak yang tewas, dan Khalid ibn Yazid al-Qaisi ditangkap. Dia dan bangsa Berber terus mengikuti Hassan dan orang Arab sampai mereka mengusir mereka dari pekerjaan Gabes. Dia membuat perjanjian dengan tawanannya, Khalid, untuk merawat putra-putranya dan tinggal di kesultanan Ifriqiya selama lima tahun, setelah itu semua kota dihancurkan. Kehilangan terjadi ketika Hassan kembali pada tahun 74 H, yang membuat orang Berber khawatir, yang kemudian berlindung kepada Hassan, yang kemudian mengamankan perlindungan mereka. Kelompok itu dikalahkan dan dibunuh di sumur yang dikenal sebagai Gunung Aurès {cite:History-ibn-Khaldun-ibar hlm. 1607-1608}. Buku tersebut menyebutkan bahwa Hassan ibn al-Nu'man bertemu dengannya di dekat sungai bernama Nini atau Miskiana, sehingga dia menang dan mundur ke Gabes. Kemudian Hassan membunuhnya setelah Khalid ibn Yazid al-Absi menunjukkan lokasi kerumunan itu. Dia dibunuh di sebuah sumur yang dinamai menurut namanya dekat Gabes. {cite:salabi-umayyad-state-2020 hlm.59-60}"
