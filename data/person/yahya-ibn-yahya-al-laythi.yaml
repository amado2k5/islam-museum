summary:
  ar: "من أهل الأندلس؛ قدم على الإمام مالك بن أنس بالمدينة فأخذ عنه الموطأ، فصارت روايته أشهر رواياته وأوسعها انتشاراً في المغرب والأندلس. وعند المقري قال ابن حزم: كان يحيى بن يحيى متكيناً عند السلطان مقبول القول في القضاة فكان لا يُولى قاضٍ في أقطار بلاد الأندلس إلا بمشورته واختياره ولا يشير إلا بأصحابه ومن كان على مذهبه ومع ذلك لم يتقلد قضاء قط ولا أجاب إليه؛ وأفتى الأمير عبد الرحمن بن الحكم في جارية وقع عليها في رمضان بالصوم شهرين متتابعين وقال لمن عترض عليه بمذهب مالك في التخيير: لو فتحنا له هذا الباب سهل عليه أن يطأ كل يوم ويعتق رقبة لكن حملته على أصعب الأمور لئلا يعود، وكان ممن انهم بالهيج في وقعة الربض المشهورة ففر إلى طليطلة ثم استأمن فكتب له الحكم أماناً، وقال ابن الفرضي: لم يُعطَ أحد من أهل الأندلس منذ دخلها الإسلام ما أعطي يحيى من الحظوة وعظم القدر {cite:nafh-tib-maqqari p. 13}، وعند المقري وحكي أنه لما ارتحل إلى مالك لازمه فبينما هو عنده في مجلسه إذ قال قائل حضر الفيل فخرج أصحاب مالك كأنهم ولم يخرج يحيى فقال له مالك ما لك لم تخرج وليس الفيل في بلادك فقال إنما جئت من الأندلس لأنظر إليك وأتعلم من هديك وعلمك ولم أكن لأنظر إلى الفيل فأعجب به مالك وقال هذا عاقل الأندلس، وتوفي سنة 234هـ برجب وقبره يستسقى به بقرطبة {cite:nafh-tib-maqqari p. 11}"
  en: "From al-Andalus; he came to Imam Malik in Medina and studied the Muwatta with him. His recension became the most widely read transmission of the book in the Maghrib and al-Andalus."
  es: "Procedente de al-Ándalus, llegó a Medina para reunirse con el imán Malik y estudiar con él el Muwatta. Su recensión se convirtió en la transmisión más leída del libro en el Magreb y al-Ándalus."
  fr: "Originaire d'al-Andalus, il se rendit à Médine auprès de l'imam Malik et étudia avec lui la Muwatta. Sa recension devint la transmission la plus lue de cet ouvrage au Maghreb et en al-Andalus."
  ur: "اندلس سے؛ وہ مدینہ میں امام مالک کے پاس آئے اور ان سے موطا کا مطالعہ کیا۔ ان کی تجدید مغرب اور اندلس میں کتاب کی سب سے زیادہ پڑھی جانے والی ٹرانسمیشن بن گئی۔"
  tr: "Endülüs halkından İmam Malik bin Anas'a Medine'ye geldi ve ondan Muwatta'yı öğrendi; bu da onun rivayetini en ünlü ve Mağrip ile Endülüs'te en yaygın haline getirdi. el-Maqri'ye göre, İbn Hazm şöyle demiştir: Yahya ibn Yahya sultan tarafından güvenilirdi ve hakimlerle ilgili görüşleri kabul ederdi, bu yüzden Endülüs topraklarında yargıç atamaz, sadece kendi öğüdü ve seçimiyle atar, sadece yoldaşları ve mezhebine bağlı olanlarla görüşürdü. Buna rağmen, asla yargıç olmadı ve ona cevap vermedi. Prens Abdülrahman ibn al-Hakam, Ramazan ayında iki ay üst üste oruç tutan bir köle kız hakkında fetva verdi ve Malik'in seçtiği doktrine göre kendisine karşı çıkanlara şöyle dedi: Eğer bu kapıyı ona açsaydık, her gün ayak basıp bir köleyi özgür bırakması kolay olurdu, ancak en zorlu sıkıntılara dayandığı için geri dönmedi. Ünlü El-Rabd Savaşı'nda Haij'de bulunanlar arasındaydı, bu yüzden Toledo'ya kaçtı, sonra güvenliğe ulaştı ve hüküm ona verildi. İbn el-Feradi şöyle dedi: Endülüs halkından kimse, İslam'a girişinden beri Yahya'ya verilen lütuf ve büyük statü görmedi. {alıntı: nafh-tib-maqqari s. 13} Ve el-Maqri'ye göre, Malik'e seyahat ettiğinde, onunla birlikte kaldığı ve 'Fil geldi.' dediği anlatılır. Malik'in yoldaşları sanki hiç çıkmamış gibi dışarı çıktılar. Yahya ona dedi ki, 'Neden dışarı çıkmadın? Fil senin topraklarında değil.' O dedi ki, 'Endülüs'ten seni görmek ve rehberliğinden öğrenmek için geldim, ama fil bakmayacaktım.' Malik ona hayran kaldı ve dedi ki: Bu, Endülüs'ün bilge adamıdır. 234 Hicri'de Recep'te öldü ve mezarı Kordoba'da yağmur için kullanıldı. {alıntı:nafh-tib-maqqari s. 11}"
  id: "Dari masyarakat al-Andalus, ia datang kepada Imam Malik ibn Anas di Madinah dan mempelajari Muwatta darinya, menjadikan narasinya paling terkenal dan tersebar luas di Maghreb dan al-Andalus. Menurut al-Maqri, Ibn Hazm berkata: Yahya ibn Yahya dipercaya oleh sultan dan menerima pendapat tentang hakim, sehingga ia tidak akan mengangkat hakim di tanah al-Andalus kecuali atas nasihat dan pilihannya, dan hanya akan berkonsultasi dengan sahabat-sahabatnya dan mereka yang mengikuti alirannya. Namun demikian, ia tidak pernah memegang jabatan hakim maupun menanggapinya. Pangeran Abd al-Rahman ibn al-Hakam mengeluarkan fatwa mengenai seorang budak perempuan yang telah berpuasa selama dua bulan berturut-turut selama Ramadan, dan ia berkata kepada mereka yang menentang menurut ajaran Malik dalam pilihan: Jika kita membuka pintu ini untuknya, akan mudah baginya untuk menginjakkan kaki setiap hari dan membebaskan seorang budak, tetapi itu menanggung kesulitan terberat sehingga dia tidak kembali. Dia termasuk di antara mereka yang berada di Al-Haij selama Pertempuran terkenal Al-Rabdh, sehingga dia melarikan diri ke Toledo, kemudian mengamankan keselamatan, dan hukuman diberikan kepadanya. Ibn al-Faradi berkata: Tidak ada seorang pun dari rakyat al-Andalus, sejak masuk ke Islam, yang diberi restu dan status besar seperti yang diberikan kepada Yahya. nafh-tib-maqqari hlm. 13} Dan menurut al-Maqri, diceritakan bahwa ketika dia pergi ke Malik, dia tinggal bersamanya saat bersama Malik di halaman ketika dia berkata, 'Gajah telah tiba.' Teman-teman Malik keluar seolah-olah mereka belum keluar. Yahya berkata kepadanya, Malik, 'Mengapa kamu tidak keluar? Gajah itu tidak ada di tanahmu.' Dia berkata, 'Aku datang dari al-Andalus untuk melihatmu dan belajar dari bimbingan dan pengetahuanmu, tapi aku tidak akan melihat gajah itu.' Malik mengaguminya dan berkata: Inilah orang bijak dari al-Andalus. Dia meninggal pada tahun 234 H di Rajab, dan makamnya digunakan untuk hujan di Cordoba. {cite:nafh-tib-maqqari hlm. 11}"
