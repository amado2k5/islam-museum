summary:
  ar: "من أهل الأندلس؛ قدم على الإمام مالك بن أنس بالمدينة فأخذ عنه الموطأ، فصارت روايته أشهر رواياته وأوسعها انتشاراً في المغرب والأندلس. وعند المقري قال ابن حزم: كان يحيى بن يحيى متكيناً عند السلطان مقبول القول في القضاة فكان لا يُولى قاضٍ في أقطار بلاد الأندلس إلا بمشورته واختياره ولا يشير إلا بأصحابه ومن كان على مذهبه ومع ذلك لم يتقلد قضاء قط ولا أجاب إليه؛ وأفتى الأمير عبد الرحمن بن الحكم في جارية وقع عليها في رمضان بالصوم شهرين متتابعين وقال لمن عترض عليه بمذهب مالك في التخيير: لو فتحنا له هذا الباب سهل عليه أن يطأ كل يوم ويعتق رقبة لكن حملته على أصعب الأمور لئلا يعود، وكان ممن انهم بالهيج في وقعة الربض المشهورة ففر إلى طليطلة ثم استأمن فكتب له الحكم أماناً، وقال ابن الفرضي: لم يُعطَ أحد من أهل الأندلس منذ دخلها الإسلام ما أعطي يحيى من الحظوة وعظم القدر {cite:nafh-tib-maqqari p. 13}، وعند المقري وحكي أنه لما ارتحل إلى مالك لازمه فبينما هو عنده في مجلسه إذ قال قائل حضر الفيل فخرج أصحاب مالك كأنهم ولم يخرج يحيى فقال له مالك ما لك لم تخرج وليس الفيل في بلادك فقال إنما جئت من الأندلس لأنظر إليك وأتعلم من هديك وعلمك ولم أكن لأنظر إلى الفيل فأعجب به مالك وقال هذا عاقل الأندلس، وتوفي سنة 234هـ برجب وقبره يستسقى به بقرطبة {cite:nafh-tib-maqqari p. 11}"
  en: "From al-Andalus; he came to Imam Malik in Medina and studied the Muwatta with him. His recension became the most widely read transmission of the book in the Maghrib and al-Andalus."
