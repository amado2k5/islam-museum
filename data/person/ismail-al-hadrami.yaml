summary:
  ar: "شيخ الشافعية ومربي الصوفية باليمن، قطب الدين عند المناوي: «قدوة الفريقين وعمدة الطريقين»؛ له شرح المهذب ومختصر مسلم ومختصر بهجة المجالس وفتاوى، وولي قضاء الأقضية فأنكر المنكرات ثم عزل نفسه، وكتب للسلطان في شقفة من خزف: يا يوسف كثر شاكوك وقلّ شاكروك فإما عدلت وإما انفصلت؛ وله كرامات قال المطري كادت تبلغ التواتر، منها إشارته إلى الشمس فوقفت حتى دخل زبيد {cite:shadharat-dhahab p. 630-631}."
  en: "Hadramawt's qutb — 'exemplar of the two companies' (al-Munawi): sharh al-Muhadhdhab and mukhtasar of Sahih Muslim, chief judge who resigned after writing the sultan on a potsherd; the karama tales include the sun held for his entering Zabid {cite:shadharat-dhahab p. 630-631}."
  es: "el qutb de Hadramawt: 'ejemplo de las dos compañías' (al-Munawi): sharh al-Muhadhdhab y mukhtasar de Sahih Muslim, juez principal que dimitió después de escribir al sultán en un tiesto; los cuentos de karama incluyen el sol sostenido para su entrada en Zabid {cita: shadharat-dhahab p. 630-631}."
  fr: "Qutb d'Hadramawt — « modèle des deux sociétés » (al-Munawi): sharh al-Muhadhdhab et mukhtasar de Sahih Muslim, juge en chef qui a démissionné après avoir écrit au sultan sur un tesson de poterie; les contes de karama incluent le soleil retenu pour son entrée dans Zabid {cite: shadharat-dhahab p. 630-631}."
  ur: "حضرموت کا قطب - 'دو کمپنیوں کا نمونہ' ⁦(المناوی)⁩: شرح المحدث اور صحیح مسلم کا مختار، چیف جج جس نے ایک برتن پر سلطان لکھنے کے بعد استعفیٰ دے دیا؛ کرامات کی کہانیوں میں زبید میں داخل ہونے کے لیے سورج کا انعقاد بھی شامل ہے۔ 630-631}۔"
  tr: "Yemen'deki Şafii şeyhi ve Sufi eğitimcisi Kutb al-Manawi'ye göre: 'İki mezhebin rol modeli ve iki yolun direği'; Şerh al-Muhadhdhab, Mukhtasar Müslüman, Mukhtasar Bahjat al-Macaliler ve fetvalar yazdı. Hakimlerin yargıcı olarak görev yaptı ancak yanlışlarını reddetti ve sonra kendini görevden aldı. Bir çömlek parçası üzerine sultana yazdı: Ey Yusuf, çok şüphe var ve söyle, ya adilsin ya da ayrılırsın; ve Al-Matari'nin neredeyse mutevatir seviyesine ulaştığını söylediği mucizeler vardır; bunlar arasında güneşe işaret etmesi ve Zabid girene kadar ayakta durması da vardır {atıf: shadharat-dhahab, s. 630-631}."
  id: "Sheikh Shafi'i dan pendidik Sufi di Yaman, Qutb al-Din menurut al-Manawi: 'Panutan dari dua sekte dan pilar dua jalan'; ia menulis Sharh al-Muhadhdhab, Mukhtasar Muslim, Mukhtasar Bahjat al-Majalis, dan fatwa. Ia menjabat sebagai hakim hakim tetapi menyangkal kesalahan dan kemudian membubarkan diri. Ia menulis kepada sultan di atas sepotong tembikar: Wahai Yusuf, ada banyak keraguan dan ucapkan terima kasih, jadi kamu harus adil atau berpisah; dan dia memiliki mukjizat yang dikatakan Al-Matari hampir mencapai tingkat mutawatir, termasuk menunjuk ke matahari dan berdiri sampai Zabid masuk {cite:shadharat-dhahab, hlm. 630-631}."
