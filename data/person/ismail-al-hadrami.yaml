  ar: "شيخ الشافعية ومربي الصوفية باليمن، قطب الدين عند المناوي: «قدوة الفريقين وعمدة الطريقين»؛ له شرح المهذب ومختصر مسلم ومختصر بهجة المجالس وفتاوى، وولي قضاء الأقضية فأنكر المنكرات ثم عزل نفسه، وكتب للسلطان في شقفة من خزف: يا يوسف كثر شاكوك وقلّ شاكروك فإما عدلت وإما انفصلت؛ وله كرامات قال المطري كادت تبلغ التواتر، منها إشارته إلى الشمس فوقفت حتى دخل زبيد {cite:shadharat-dhahab p. 630-631}."
  en: "Hadramawt's qutb — 'exemplar of the two companies' (al-Munawi): sharh al-Muhadhdhab and mukhtasar of Sahih Muslim, chief judge who resigned after writing the sultan on a potsherd; the karama tales include the sun held for his entering Zabid {cite:shadharat-dhahab p. 630-631}."
