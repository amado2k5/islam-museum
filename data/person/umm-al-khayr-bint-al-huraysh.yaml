gender: female
roles: [poet]
summary:
  ar: "خطيبة من بارق بالكوفة، ناصرت علي بن أبي طالب يوم صفين بخطبة حماسية، ثم أوفدها معاوية إليه فسألها عن كلامها يومئذ وعن عثمان وطلحة والزبير؛ يروي خبرها كحالة في «أعلام النساء» عن بلاغات النساء وغيره."
  en: "An orator of Bariq at Kufa who supported Ali ibn Abi Talib at Siffin with a rousing speech; Mu'awiya later summoned her and asked her about that speech and about Uthman, Talha and al-Zubayr. Kahhala's A'lam al-Nisa' tells her story from Balaghat al-Nisa' and other works."
  ur: "کوفہ میں بارق کی ایک خطیبہ جنہوں نے صفین میں ایک ولولہ انگیز خطبے سے علی بن ابی طالب کی حمایت کی؛ بعد میں معاویہ نے انہیں بلوا کر اس خطبے اور عثمان، طلحہ و زبیر کے بارے میں سوال کیے۔ کحالہ کی «اعلام النساء» بلاغات النساء وغیرہ سے ان کا واقعہ نقل کرتی ہے۔"
