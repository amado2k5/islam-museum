gender: female
roles: [poet]
summary:
  ar: "خطيبة من بارق بالكوفة، ناصرت علي بن أبي طالب يوم صفين بخطبة حماسية، ثم أوفدها معاوية إليه فسألها عن كلامها يومئذ وعن عثمان وطلحة والزبير؛ يروي خبرها كحالة في «أعلام النساء» عن بلاغات النساء وغيره."
  en: "An orator of Bariq at Kufa who supported Ali ibn Abi Talib at Siffin with a rousing speech; Mu'awiya later summoned her and asked her about that speech and about Uthman, Talha and al-Zubayr. Kahhala's A'lam al-Nisa' tells her story from Balaghat al-Nisa' and other works."
  ur: "کوفہ میں بارق کی ایک خطیبہ جنہوں نے صفین میں ایک ولولہ انگیز خطبے سے علی بن ابی طالب کی حمایت کی؛ بعد میں معاویہ نے انہیں بلوا کر اس خطبے اور عثمان، طلحہ و زبیر کے بارے میں سوال کیے۔ کحالہ کی «اعلام النساء» بلاغات النساء وغیرہ سے ان کا واقعہ نقل کرتی ہے۔"
  es: "Oradora de Bariq en Kufa, quien apoyó a Ali ibn Abi Talib en Siffin con un discurso apasionado, Mu'awiya la convocó posteriormente y le preguntó sobre ese discurso y sobre Uthman, Talha y al-Zubayr. La obra A'lam al-Nisa' de Kahhala narra su historia a partir de Balaghat al-Nisa' y otras obras."
  fr: "Une oratrice de Bariq à Koufa qui soutint Ali ibn Abi Talib à Siffin par un discours vibrant; Mu'awiya la convoqua plus tard et l'interrogea à ce sujet, ainsi que sur Uthman, Talha et al-Zubayr. L'ouvrage de Kahhala, A'lam al-Nisa', relate son histoire d'après Balaghat al-Nisa' et d'autres écrits."
  tr: "Kufe'deki Bareq'ten bir vaiz olarak, Sifin'de Ali ibn Ebi Talib'e tutkulu bir vaaz vermiştir. Sonra Muaviye onu yanına gönderip o günkü konuşmasını ve Uthman, Talha ve Al-Zubayr hakkında sordu; onun anlatımı \"A'lam al-Nisa\"da kadınların zarafeti ve diğer konular hakkında bir vaka olarak anlatılır."
  id: "Seorang pengkhotbah dari Bareq di Kufa, ia mendukung Ali ibn Abi Talib pada hari Siffin dengan khotbah penuh semangat. Kemudian Muawiyah mengirimnya kepadanya dan menanyakan tentang pidatonya hari itu serta tentang Uthman, Talha, dan Al-Zubayr; kisahnya diceritakan sebagai kasus dalam \"A'lam al-Nisa\" tentang keanggunan wanita dan lainnya."
