label: { ar: "أبو العنبس الصيمري", en: "Abu'l-'Anbas al-Saymari", fr: "Abu'l-'Anbas al-Saymari", es: "Abu'l-'Anbas al-Saymari", ur: "ابوالعنباس السماری۔" }
summary:
  ar: "مضحك المتوكل، عارض قصيدة البحتري عن أي ثغر تبتسم بهجاء فاضح من أي سلح تلتقم حتى ضحك المتوكل واستلقى على قفاه وأمر لكل واحد منهما وللمبرد البصري بعشرة آلاف درهم، ومن خبره حماره الذي مات فأنشده في المنام هام قلبي بأتان عند باب الصيدلاني فأمر المتوكل المغنين أن يغنوا ذلك اليوم بشعر الحمار {cite:muruj-al-dhahab p. 478-480}."
  en: "Al-Mutawakkil's jester whose obscene counter-ode to al-Buhturi and whose dead donkey's love-elegy set the whole court singing {cite:muruj-al-dhahab p. 478-480}."
  fr: "Le bouffon d'al-Mutawakkil, dont la contre-ode obscène à al-Buhturi et l'élégie amoureuse sur son âne mort firent chanter toute la cour {cite:muruj-al-dhahab p. 478-480}."
  es: "El bufón de Al-Mutawakkil, cuya obscena contraoda a al-Buhturi y cuya elegía de amor por el burro muerto hizo cantar a toda la corte {cite:muruj-al-dhahab p. 478-480}."
  ur: "المتوکل کا مضحکہ خیز جس کا البطوری کے خلاف فحش کلامی اور جس کے مردہ گدھے کی محبت نے پورے دربار کو گایا ہوا تھا {حوالہ: مروج الذہب ص۔ 478-480}۔"
  tr: "El-Mutavakkil komikti. El-Buhturi'nin hangi ağzın gülümsediği hakkındaki şiirine, hangi pisliği yuttuğuna dair skandal niteliğinde bir hicivle karşı çıktı; ta ki El-Mutavakkil gülüp sırt üstü yere yatıp her biri için ve El-Mubarrad El-Basri için on bin dirhem emredene kadar. Eşeğinin öldüğü haberini de rüyasında ona şöyle okudu: \"Kalbim eczacının kapısında bir dişi eşek özledi.\" Bunun üzerine El-Mutavakkil o gün şarkıcılara eşeğin şiirini okumalarını emretti. {cite:muruj-al-dhahab s. 478-480}"
  id: "Al-Mutawakkil itu lucu. Ia menentang puisi Al-Buhturi tentang mulut mana yang tersenyum dengan sindiran yang memalukan tentang sampah apa yang ditelannya, sampai Al-Mutawakkil tertawa dan berbaring telentang lalu memesan sepuluh ribu dirham untuk masing-masing dari mereka dan untuk Al-Mubarrad Al-Basri. Dan dari kabar tentang keledainya yang mati, ia membacakan kepadanya dalam mimpi: Hatiku mendambakan seekor keledai betina di depan pintu apoteker, maka Al-Mutawakkil memerintahkan para penyanyi untuk bernyanyi hari itu dengan puisi tentang keledai tersebut. {cite:muruj-al-dhahab hlm. 478-480}."
