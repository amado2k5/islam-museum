id: person/abdullah-ibn-al-zubayr
class: person
label: { ar: "عبد الله بن الزبير", en: "'Abd Allah ibn al-Zubayr" }
summary:
  ar: "ابن الزبير بن العوام وأسماء بنت أبي بكر، بايعه أهل مكة والعراق خليفة فخاض فتنة الحرة وبناء الكعبة وحصره الحجاج بمكة خمسين ليلة من ذي القعدة سنة اثنتين وسبعين حتى قتل، ولما قتل أخوه مصعب صعد المنبر فقال أتانا خبر من العراق أحزننا وأفرحنا وهو قتل مصعب، أما والله لا نموت حتفاً كميتة آل أبي العاص وإنما نموت قعصاً بالرماح وقتلاً تحت ظلال السيوف {cite:muruj-al-dhahab p. 104-105}. وضمه عثمان إلى لجنة نسخ المصاحف الأربعة مع زيد بن ثابت وسعيد بن العاص وعبد الرحمن بن الحارث {cite:sahih-al-bukhari 4987}."
  en: "al-Zubayr ibn al-'Awwam and Asma' bint Abi Bakr's son — the Meccan counter-caliph of the second fitna, besieged by al-Hajjaj for fifty nights in 72; his minbar elegy for Mus'ab: 'we die not in our beds like the family of Abu'l-'As but pierced by spears beneath the swords' shade' {cite:muruj-al-dhahab p. 104-105}."
