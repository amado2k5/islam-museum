id: person/abdullah-ibn-al-zubayr
class: person
label: { ar: "عبد الله بن الزبير", en: "'Abd Allah ibn al-Zubayr" }
summary:
  ar: "ابن الزبير بن العوام وأسماء بنت أبي بكر، وُلد في المدينة نحو سنة 624م، وبايعه أهل مكة والعراق خليفة، وحاصره الحجاج في مكة حتى قتل سنة 73هـ/692م، وفي روايات أخرى خمسين ليلة من ذي القعدة سنة اثنتين وسبعين {cite:muruj-al-dhahab p. 104-105}. وضمه عثمان إلى لجنة نسخ المصاحف الأربعة مع زيد بن ثابت وسعيد بن العاص وعبد الرحمن بن الحارث {cite:sahih-al-bukhari 4987}."
  en: "Son of al-Zubayr ibn al-Awwam and Asma bint Abi Bakr, born at Medina about 624. The people of Mecca and Iraq gave him allegiance as caliph, and al-Hajjaj besieged him at Mecca until he was killed in 73/692; al-Mas'udi gives fifty nights from Dhu al-Qa'da 72, while the Encyclopaedia of Islam gives more than six months {cite:muruj-al-dhahab p. 104-105}. 'Uthman placed him on the commission that copied the codices, with Zayd ibn Thabit, Sa'id ibn al-'As and 'Abd al-Rahman ibn al-Harith {cite:sahih-al-bukhari 4987}."
  ur: "زبیر بن عوام اور اسماء بنت ابوبکر کے بیٹے، مدینہ میں تقریباً 624ء میں پیدا ہوئے۔ مکہ اور عراق کے لوگوں نے انھیں خلیفہ مانا اور حجاج نے مکہ میں ان کا محاصرہ کیا یہاں تک کہ وہ سنہ 73ھ/692ء میں قتل ہوئے؛ مسعودی سنہ 72 کے ذوالقعدہ سے پچاس راتیں بتاتا ہے، جبکہ دائرۃ المعارف اسلامیہ چھ ماہ سے زیادہ {cite:muruj-al-dhahab p. 104-105}۔ عثمان نے انھیں مصاحف نقل کرنے والی کمیٹی میں زید بن ثابت، سعید بن العاص اور عبد الرحمن بن الحارث کے ساتھ رکھا {cite:sahih-al-bukhari 4987}۔"
