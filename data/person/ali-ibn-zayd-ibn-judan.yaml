summary:
  ar: "علي بن زيد بن جدعان القرشي التيمي البصري ⁦(ت 131هـ)⁩، أحد علماء التابعين بالبصرة، روى عن أنس وأبي عثمان النهدي وسعيد بن المسيب، وعنه شعبة وعبد الوارث وخلق. يجمع الذهبي في «ميزان الاعتدال» اختلاف النقاد فيه: قيل له بعد موت الحسن اجلس مجلسه، ودافع عنه حماد بن سلمة، وضعّفه ابن عيينة وأحمد والقطان، وقال البخاري وأبو حاتم لا يحتج به، وقال الترمذي صدوق، ونُسب إلى التشيع، ويسوق له الذهبي أحاديث منكرة {cite:mizan-itidal-bijawi-v3 p. 127-129}."
  en: "Ali ibn Zayd ibn Jud'an al-Qurashi al-Taymi of Basra (d. 131 AH), one of the scholars of the Successors in Basra, who narrated from Anas, Abu Uthman al-Nahdi and Sa'id ibn al-Musayyab, with Shu'ba, Abd al-Warith and many others narrating from him. Al-Dhahabi's Mizan al-I'tidal gathers the critics' disagreement: he was invited to take al-Hasan al-Basri's seat after his death and was defended by Hammad ibn Salama, but Ibn Uyayna, Ahmad and al-Qattan weakened him, al-Bukhari and Abu Hatim said he is not a proof, al-Tirmidhi called him truthful, he was described as inclining to Shi'ism, and al-Dhahabi cites objectionable hadiths of his."
