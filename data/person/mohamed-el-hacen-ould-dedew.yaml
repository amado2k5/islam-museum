summary:
  ar: "عالم موريتاني ومؤلف وشاعر. وُلد في بوتلميت في 31 أكتوبر 1963 ونشأ في أسرة علمية، فحفظ القرآن صغيرًا ودرس القراءات العشر على والدته وحصل على إجازات في كتب الحديث الكبرى. يرأس مركز تكوين العلماء وجامعة عبد الله بن يسين بنواكشوط، وكان نائب رئيس الاتحاد العالمي لعلماء المسلمين سنة 2014؛ أسس مركز تكوين العلماء سنة 2007 فأغلقته السلطات سنة 2018، وسُجن مرارًا في عهد الرئيس معاوية ولد سيد أحمد الطايع."
  en: "Mauritanian Muslim scholar, author and poet. Born in Boutilimit on 31 October 1963 and raised in a scholarly family, he memorised the Qur'an as a boy, studied the ten readings with his mother and earned licenses in the major hadith collections. He heads the Center for the Development of Scholars and Abdallah ibn Yasin University in Nouakchott, and was vice-president of the International Union of Muslim Scholars in 2014; he founded the Centre for the Formation of Scholars in 2007, which the authorities closed in 2018, and was imprisoned repeatedly under President Maaouiya Ould Sid'Ahmed Taya."
  ur: "موریطانیہ کے مسلمان عالم، مصنف اور شاعر۔ 31 اکتوبر 1963ء کو بوتلیمیٹ میں پیدا ہوئے اور علمی خاندان میں پروان چڑھے؛ بچپن میں قرآن حفظ کیا، والدہ سے عشرہ قراءات پڑھیں اور کتبِ حدیث کی اجازات حاصل کیں۔ نواکشوط میں مرکزِ تکوینِ علما اور جامعہ عبد اللہ بن یسین کے سربراہ ہیں اور 2014ء میں عالمی اتحاد برائے مسلم علما کے نائب صدر رہے؛ انھوں نے 2007ء میں مرکزِ تکوینِ علما قائم کیا جسے حکام نے 2018ء میں بند کر دیا، اور صدر معاویہ ولد سید احمد الطایع کے دور میں بارہا قید رہے۔"
