summary:
  ar: "أبو محرز الطفاوي، من أهل الاجتهاد في العبادة، لحق المتقدمين. روى عنه عون بن حمارة قوله إن أهل الفطنة طلبوا العلو في الدارين بالأعمال، وإن الناس كُلِّفوا بالدنيا فلم ينالوا منها فوق قسمتهم."
  en: "Abu Mahriz al-Tufawi, a man of diligent worship who reached the earlier generation; Awn ibn Hamara relates his saying that the discerning sought high station in both abodes through deeds, and that people were absorbed in the world and gained from it no more than their share."
  ur: "ابو محرز طفاوی عبادت میں محنت کرنے والوں میں سے تھے اور اگلے بزرگوں سے ملے۔ عون بن حمارہ نے ان کا قول نقل کیا کہ دانا لوگوں نے دونوں گھروں میں بلندی اعمال کے ذریعے طلب کی، اور لوگ دنیا میں مشغول ہو کر اس سے اپنے حصے سے زیادہ کچھ نہ پا سکے۔"
