label: { ar: "طغرل بك" }
names:
  - { value: "أبو طالب محمد بن ميكائيل المعروف بطغرل بك السلجوقي", kind: full }
gender: male
summary:
  ar: "أول ملوك السلجوقية وأصلهم من أعمال بخارى وهم أهل عمود، أول ممالكهم الري ثم نيسابور وأخذ أخوه داود بلخاً وغيرها واقتسما الممالك فملك طغرلبك العراق وقمع الرافضة وزال به شعارهم وكان عادلاً في الجملة حليماً كريماً محافظاً على الصلوات يصوم الخميس والاثنين ويعمر المساجد؛ وفي ليلة الاثنين خامس عشر صفر سنة خمس وخمسين زفت ابنة القائم إليه وضربت لها سرادق من دجلة إلى الدار وجلست على سرير ملبس بالذهب فدخل السلطان فقبل الأرض وخرج من غير أن يمازح ولم تقم له ولا كشفت برقعها ولا أبصرته فأنفذ لها عقدين فاخرين وقطعة ياقوت حمراء ودخل من الغد فقبل الأرض وجلس على سرير ملبس بالفضة بازاءها ساعة ثم أنفذ لها جواهر كثيرة وفرجية مكللة بالذهب ثم أخرجها معه من بغداد على كره إلى الري، ودخل بابنة القائم وله سبعون سنة وعاش عقبها ما بشر بولد ومات بالري وحملوا تابوته فدفنوه عند قبر أخيه داود بن جعفر بك؛ وطغرل بضم الطاء وسكون الغين المعجمة اسم تركي مركب من طغرل وهو بلغة الترك علم لطائر معروف عندهم وبك معناه أمير {cite:shadharat-dhahab p. 302-303}. وعند ابن الجوزي أنه استولى على نيسابور سنة ٤٣٤ وأنفذ أخاه إبراهيم ينال لأخذ الري والجبل، وخاطب جلال الدولة من الري سنة ٤٣٥ بـ«الملك الجليل» ونفسه «طغربك بن ميكائيل مولى أمير المؤمنين» {cite:muntazam-ibn-al-jawzi j.8 p.456,458-459}، وفتح أصبهان سنة ٤٤٣ فوجد في هدم دار مراكب مرصعة وقناطير دنانير وبرنيات صينية مملوءة بالجوهر {cite:muntazam-ibn-al-jawzi j.8 p.493}، وغزا بلاد الروم سنة ٤٤٦ {cite:muntazam-ibn-al-jawzi j.8 p.502}."
  en: "Tughril Beg, first Saljuq king, of the tent-folk of the Bukhara marches; he took Iraq, suppressed the Rafida and removed their slogan, ruled justly, fasted Mondays and Thursdays and built mosques; in 455 the caliph al-Qa'im's daughter was escorted to him in a gold-draped procession — he kissed the ground before her unseen, sent her jewels and a crown-set robe, then carried her unwilling to al-Rayy — and died there childless at over seventy, buried by his brother Da'ud {cite:shadharat-dhahab p. 302-303}."
  es: "Tughril Beg, primer rey selyúcida, del pueblo de las tiendas de campaña de las marcas de Bujará; tomó Irak, reprimió a los Rafida y eliminó su lema, gobernó con justicia, ayunó los lunes y los jueves y construyó mezquitas; en 455 la hija del califa al-Qa'im fue escoltada hasta él en una procesión cubierta de oro; él besó el suelo ante ella sin ser visto, le envió joyas y una túnica con una corona, luego la llevó a regañadientes a al-Rayy, y murió allí sin descendencia a la edad de más de setenta años, enterrado por su hermano Da'ud {cite:shadharat-dhahab p. 302-303}."
  fr: "Tughril Beg, premier roi seldjoukide, issu du peuple des tentes des marches de Boukhara; il conquit l'Irak, réprima les Rafida et supprima leur slogan, gouverna avec justice, jeûna les lundis et jeudis et fit construire des mosquées; en 455, la fille du calife al-Qa'im fut conduite à lui dans une procession drapée d'or — il baisa le sol devant elle sans la voir, lui envoya des bijoux et une robe ornée d'une couronne, puis la porta à contrecœur jusqu'à al-Rayy — et mourut là sans enfant à plus de soixante-dix ans, enterré par son frère Da'ud {cite:shadharat-dhahab p. 302-303}."
  ur: "تغرل بیگ، پہلا سلجوق بادشاہ، بخارا مارچ کے خیمہ عوام کا۔ اس نے عراق پر قبضہ کیا، رافضیوں کو دبایا اور ان کا نعرہ ہٹایا، انصاف سے حکومت کی، پیر اور جمعرات کے روزے رکھے اور مساجد تعمیر کیں۔ 455 میں خلیفہ القائم کی بیٹی کو سونے کے لبادے والے جلوس میں اس کے پاس لے جایا گیا - اس نے اس کے غیب سے پہلے زمین کو بوسہ دیا، اس کے زیورات اور ایک تاج پہنا ہوا لباس بھیجا، پھر اسے الرائے لے گئے - اور وہیں ستر سال کی عمر میں بے اولاد وفات پاگئے، اسے اس کے بھائی داؤد نے دفن کیا۔ 302-303}۔"
  tr: "İlk Selçuklu kralları, aslen Buhara bölgesinden, Amud halkıydı. İlk krallıkları Ray, sonra Nişapur'du. Kardeşi Davud Balkha ve diğerlerini aldı ve krallıkları paylaştılar. Tuğril Beg Irak'ı yönetti, Rafidah'ı bastırdı ve onların amblemini sona erdirdi. Genellikle adil, hoşgörülü, cömert ve namazlara bağlıydı, Perşembe ve Pazartesi oruç tutar, cami inşa ederdi. 55. yılın Safar ayının on beşinci Pazartesi gecesi, Kaim'in kızı onunla evlendi ve Dicle'den eve kadar bir çadır kuruldu, kız altınla kaplı bir yatağa oturdu. Sultan içeri girdi, yere öptü ve ayrıldı Ancak şaka yapıyordu, o ne onun için ayağa kalktı, ne peçesini açtı, ne de onu gördü. İki lüks kolye ve bir parça kırmızı yakut yaptı, ertesi gün içeri girdi, yere öptü ve bir saat boyunca onunla birlikte gümüş kaplı bir yatakta oturdu. Sonra ona birçok mücevher ve altınla süslenmiş bir brokar verdi. Sonra onu Bağdat'tan Rayy'e götürdü ve yetmiş yaşındaki el-Kaim'in kızıyla birlikte içeri girdi. Bundan sonra çocuk habercisi olmadan yaşadı, Rayy'de öldü. Tabutunu taşıdılar ve onu kardeşi Davud bin Ja'far Bey'in mezarına gömdüler; Tuğril ise han'da bir ḍamma, ghāyn'de bir sukun ile. Al-Mu'jamah, Türkçe'de aralarında bilinen bir kuşun adıdır ve prens anlamına gelir {atıf:shadharat-dhahab s. 302-303} İbn el-Jawzi'ye göre, 434 Hicri'de Nişapur'u ele geçirmiş ve kardeşi İbrahim Yanal'i sulama ve dağı ele geçirmesi için göndermiştir. 435'te Ray'lı Celal al-Dawla'ya 'büyük kral', kendisini ise 'Tuğhribk ibn Mika'il, Sadıkların Komutanının özgür kanı' olarak hitap etmiş {cite:Muntazam-ibn-al-jawzi J.8 s.456,458-459} ve 443 Hicri'de İsfahan'ı fethetmiş ve mücevherlerle dolu mücevherli gemiler, dinarlar ve Çin barnetlerinden oluşan bir evin yıkımında bulunmuştur {cite:Muntazam-ibn-al-jawzi J.8 s.493} ve 446'da Romalıların topraklarına saldırmıştır {cite:Muntazam-ibn-al-jawzi J.8 s.502}."
  id: "Raja-raja Seljuk pertama, yang berasal dari wilayah Bukhara, adalah rakyat Amud. Kerajaan pertama mereka adalah Ray, kemudian Nishapur. Saudaranya Dawood mengambil Balkha dan yang lain, dan mereka membagi kerajaan. Tughril Beg memerintah Irak, menumpas Rafidah, dan mengakhiri lambang mereka. Ia umumnya adil, pemaaf, murah hati, dan menjalankan doa, berpuasa pada Kamis dan Senin, serta membangun masjid. Pada malam Senin, tanggal lima belas Safar, tahun 55, putri Qa'im menikah dengannya, dan sebuah tenda didirikan untuknya dari Tigris ke rumah, dan ia duduk di atas ranjang yang dilapisi emas. Sultan masuk, mencium tanah, dan pergi Namun, ia hanya bercanda, dan Anna tidak membelanya, tidak membuka kerudungnya, juga tidak melihatnya. Ia membuat dua kalung mewah dan sepotong rubi merah, masuk keesokan harinya, mencium tanah, dan duduk di atas ranjang berpakaian perak bersama Anna selama satu jam. Kemudian ia memberinya banyak permata dan brokat berhias emas. Kemudian ia membawanya dari Baghdad ke Rayy, dan ia masuk bersama putri al-Qa'im yang berusia tujuh puluh tahun. Setelah itu ia hidup tanpa meramalkan anak, meninggal di Rayy. Mereka membawa peti matinya dan menguburkannya di makam saudaranya Dawud ibn Ja'far Bey; dan Tughril dengan ḍamma di ṣāʾ dan sukun di ghāyn. Al-Mu'jamah adalah nama Turki yang berasal dari Tughril, yang dalam bahasa Turkik adalah nama burung yang dikenal di antara mereka, yang berarti pangeran {cite:shadharat-dhahab hlm. 302-303}. Menurut Ibn al-Jawzi, ia merebut Nishapur pada tahun 434 H dan mengirim saudaranya Ibrahim Yanal untuk merebut irigasi dan gunung. Ia menyebut Jalal al-Dawla dari Ray pada tahun 435 sebagai 'raja agung' dan dirinya sendiri sebagai 'Tughribk ibn Mika'il, orang bebas dari Panglima Para Beriman' {cite:Muntazam-ibn-al-jawzi J.8 hlm.456,458-459}, dan menaklukkan Isfahan pada tahun 443 H dan menemukan penghancuran sebuah rumah kapal berhias permata, dinar, dan barnet Cina yang diisi dengan permata {cite:Muntazam-ibn-al-jawzi J.8 hlm.493}, dan menyerbu tanah Romawi pada tahun 446 {cite:Muntazam-ibn-al-jawzi J.8 hlm.502}."
