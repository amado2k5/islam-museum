summary:
  ar: "أول ملوك السلجوقية وأصلهم من أعمال بخارى وهم أهل عمود، أول ممالكهم الري ثم نيسابور وأخذ أخوه داود بلخاً وغيرها واقتسما الممالك فملك طغرلبك العراق وقمع الرافضة وزال به شعارهم وكان عادلاً في الجملة حليماً كريماً محافظاً على الصلوات يصوم الخميس والاثنين ويعمر المساجد؛ وفي ليلة الاثنين خامس عشر صفر سنة خمس وخمسين زفت ابنة القائم إليه وضربت لها سرادق من دجلة إلى الدار وجلست على سرير ملبس بالذهب فدخل السلطان فقبل الأرض وخرج من غير أن يمازح ولم تقم له ولا كشفت برقعها ولا أبصرته فأنفذ لها عقدين فاخرين وقطعة ياقوت حمراء ودخل من الغد فقبل الأرض وجلس على سرير ملبس بالفضة بازاءها ساعة ثم أنفذ لها جواهر كثيرة وفرجية مكللة بالذهب ثم أخرجها معه من بغداد على كره إلى الري، ودخل بابنة القائم وله سبعون سنة وعاش عقبها ما بشر بولد ومات بالري وحملوا تابوته فدفنوه عند قبر أخيه داود بن جعفر بك؛ وطغرل بضم الطاء وسكون الغين المعجمة اسم تركي مركب من طغرل وهو بلغة الترك علم لطائر معروف عندهم وبك معناه أمير {cite:shadharat-dhahab p. 302-303}."
  en: "Tughril Beg, first Saljuq king, of the tent-folk of the Bukhara marches; he took Iraq, suppressed the Rafida and removed their slogan, ruled justly, fasted Mondays and Thursdays and built mosques; in 455 the caliph al-Qa'im's daughter was escorted to him in a gold-draped procession — he kissed the ground before her unseen, sent her jewels and a crown-set robe, then carried her unwilling to al-Rayy — and died there childless at over seventy, buried by his brother Da'ud {cite:shadharat-dhahab p. 302-303}."
