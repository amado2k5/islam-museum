label:
  ar: دسيم بن إبراهيم الكردي
  en: Daysim ibn Ibrahim al-Kurdi
summary:
  ar: "دسيم بن إبراهيم الكردي؛ تنازع لشكري بن المرزبان وبنيه على أذربيجان فاستدعاه أهلها لقتالهم، واستولى على أذربيجان وغلب الحمدانيين على معادنها، وكان الديلم الذين عنده من عسكر وشمكير قد استمالهم المرزبان فنزعوا إليه، فحاصره دسيم بتبريز ثم هرب إلى أردبيل ثم إلى أرمينية فنزل على صاحبها حاجيق بن الديراني، واستقر الملك للمرزبان سنة 330هـ."
  en: "Daysim ibn Ibrahim the Kurd; rival of al-Marzuban's house for Azerbaijan, invited in by its people to fight them — he held Azerbaijan and beat the Hamdanids off its mines, but when the Daylam in his host defected to al-Marzuban he was besieged in Tabriz, fled to Ardabil then to Hajjiq ibn al-Dayrani of Armenia, and the kingship settled for al-Marzuban in 330 AH."
