summary:
  ar: "القاضي الشافعي المؤرخ؛ ولد بحماة ورحل إلى بغداد فتفقه بها وسمع بالقاهرة وحدث بها وبكثير من بلاد الشام، وولي قضاء بلده همدان وقضاء حماة أيضاً، وكان إماماً في مذهب الشافعي عالماً بالتاريخ؛ من تصانيفه شرح مشكل الوسيط وأدب القاضي وكتاب في التاريخ والفرق الإسلامية والتاريخ الكبير المظفري {cite:shadharat-dhahab p. 221}."
  en: "The Shafi'i qadi-historian (b. Hama 583, d. Jumada II 642) — judge of Hamadan then of Hama; author of Sharh Mushkil al-Wasit, Adab al-Qadi, a book on the Islamic sects, and al-Tarikh al-Kabir al-Muzaffari {cite:shadharat-dhahab p. 221}."
  es: "El cadí-historiador Shafi'i (n. Hama 583, m. Jumada II 642) — juez de Hamadan y luego de Hama; autor de Sharh Mushkil al-Wasit, Adab al-Qadi, un libro sobre las sectas islámicas, y al-Tarikh al-Kabir al-Muzaffari {cita: shadharat-dhahab p. 221}."
  fr: "Le qadi-historien Shafi'i (né à Hama 583, décédé à Jumada II 642) — juge de Hamadan puis de Hama; auteur de Sharh Mushkil al-Wasit, Adab al-Qadi, un livre sur les sectes islamiques, et al-Tarikh al-Kabir al-Muzaffari {cite:shadharat-dhahab p. 221}."
  ur: "شافعی قاضی مؤرخ ⁦(پیدائش حما 583، وفات جمادی الثانی 642)⁩ - حمدان پھر حما کے قاضی؛ شرح مشکیل الوسط کے مصنف، ادیب القادی، اسلامی فرقوں پر ایک کتاب، اور التاریخ الکبیر المظفری 221}۔"
