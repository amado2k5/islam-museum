id: person/al-muhadhdhab-ibn-muqbil
class: person
label: { ar: "المهذب بن مقبل الطبيب", en: "al-Muhadhdhab ibn Muqbil, the physician", fr: "al-Muhadhdhab ibn Muqbil, le médecin", es: "al-Muhadhdhab ibn Muqbil, the physician", ur: "المحدث ابن مقبل، طبیب" }
summary:
  ar: "الحكيم المهذب علي بن أحمد بن مقبل الطبيب المشهور؛ يقول ابن الأثير: كان أعلم أهل زمانه بالطب وروى الحديث، وكان مقيماً بالموصل وبها مات، كثير الصدقة حسن الأخلاق وله تصنيف حسن في الطب؛ توفي في المحرم سنة عشر وستمائة {cite:kamil-ibn-al-athir p. 360-361}."
  en: "Mosul's celebrated physician — 'most learned of his age in medicine', a transmitter of hadith, generous and well-mannered, author of a good medical work — died Muharram 610 {cite:kamil-ibn-al-athir p. 360-361}."
  fr: "Le célèbre médecin de Mossoul - « le plus savant de son âge en médecine », un transmetteur de hadith, généreux et bien élevé, auteur d'un bon travail médical - est mort Muharram 610 {cite:kamil-ibn-al-athir p. 360-361}."
  es: "El célebre médico de Mosul —«el más erudito de su época en medicina», transmisor de hadices, generoso y de buenos modales, autor de una buena obra médica— murió en Muharram de 610 {cite:kamil-ibn-al-athir p. 360-361}."
  ur: "موصل کے مشہور طبیب - 'طب میں اپنی عمر کے سب سے زیادہ سیکھنے والے'، حدیث کے ٹرانسمیٹر، سخی اور خوش اخلاق، ایک اچھے طبی کام کے مصنف - محرم 610 میں وفات پاگئے۔ 360-361}۔"
  tr: "Seçkin bilge Ali ibn Ahmed ibn Muqbil, ünlü hekim; İbn al-Athir şöyle der: Zamanının en bilgili tıp bilgisiydi ve hadisleri rivayet etti. Musul'da yaşadı ve orada vefat etti. Sadakatte cömertti, iyi karakterliydi ve tıpta iyi bir iş çıkardı; altı yüz yaşında Muharrem'de öldü {atıf:kamil-ibn-al-athir s. 360-361}."
  id: "Resi terhormat Ali ibn Ahmad ibn Muqbil, tabib terkenal; Ibn al-Athir berkata: Ia adalah yang paling berpengetahuan dalam bidang kedokteran pada masanya dan menceritakan hadits. Ia tinggal di Mosul, tempat ia wafat. Ia murah hati dalam amal, berkarakter baik, dan memiliki pekerjaan yang baik di bidang kedokteran; ia meninggal pada Muharram pada tahun enam ratus {cite:kamil-ibn-al-athir hlm. 360-361}."
