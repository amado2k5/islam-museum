summary:
  ar: "يونس بن حبيب النحوي البصري؛ قال أنا أدركت ما بين آل زياد وآل ابن عامر متباعداً بسبب نهر الأبلة الذي أتمه زياد دون ابن عامر.، وكان أعلم الناس بتصاريف النحو، وكانت حلقته بالبصرة ينتابها طلاب العلم وفصحاء الأعراب، وجاوز المائة ومات سنة ثلاث وثمانين ومائة {cite:fihrist-ibn-al-nadim p. 111-112}"
  en: "Yunus ibn Habib, Basra's grammarian; 'I lived when the houses of Ziyad and Ibn Amir stood estranged over the Ubulla canal Ziyad completed without him'."
