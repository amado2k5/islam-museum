summary:
  ar: "شيخ الحنابلة وصاحب التصانيف؛ كان إماماً علامة ورعاً صالحاً غزير العلم حسن المحاضرة، تفقه على القاضي أبي يعلى وتخرج به أئمة وقرأ عليه الفقه جماعة منهم عبد الواحد بن تيمية وأبو بكر الدينوري والشيخ عبد القادر الجيلي، وقال السلفي: أبو الخطاب من أئمة أصحاب أحمد يفتي في مذهبه ويناظر؛ توفي آخر يوم الأربعاء أربع عشر جمادى الآخرة سنة عشر وخمسمائة ودفن إلى جانب قبر الإمام أحمد {cite:shadharat-dhahab p. 507-508}."
  en: "Shaykh of the Hanbalis — pupil of Qadi Abu Ya'la, teacher of Abd al-Wahhab b. Taymiyya and Abd al-Qadir al-Jili; al-Silafi counted him among the imams of Ahmad's school; d. 14 Jumada II 510 and buried beside Imam Ahmad's grave {cite:shadharat-dhahab p. 507-508}."
