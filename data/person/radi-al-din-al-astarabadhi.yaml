died: { edtf: "1285~", hijri: "0684", calendar: julian, precision: year, status: tradition, derived: true, sources: [source/encyclopaedia-of-islam-2], note: "EI2: the commentary was completed in 683 AH (1284-5); Radi al-Din was reported to have died in 684 or 686 AH (1285-1288). 684 AH is given first and kept here; 686 AH is the second account {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}." }
summary:
  ar: "عالم نحوي من أهل الشيعة، ألّف شرحًا مشهورًا على «الكافية» لابن الحاجب، أتمه سنة 683هـ ⁦(1284-1285م)⁩، ويُقال إنه توفي سنة 684هـ، وقيل 686هـ؛ ولم يعرف السيوطي عن حياته سوى هذين التاريخين {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
  en: "A grammarian who was a Shi'i, according to the entry's judgement; author of a celebrated commentary on Ibn al-Hajib's Kafiya, completed in 683 AH (1284-5). He is reported to have died in 684 or 686 AH; al-Suyuti knew nothing of his life beyond the date of the commentary and of his death {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
  es: "Un gramático chiíta, según la información de la entrada; autor de un célebre comentario sobre la Kafiya de Ibn al-Hajib, completado en el año 683 de la Hégira (1284-1285). Se dice que murió en el año 684 o 686 de la Hégira; al-Suyuti no supo nada de su vida más allá de la fecha del comentario y de su muerte {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
  fr: "Grammairien chiite, selon l'article, il est l'auteur d'un commentaire célèbre de la Kafiya d'Ibn al-Hajib, achevé en 683 AH (1284-1285). Il serait mort en 684 ou 686 AH; al-Suyuti ignore tout de sa vie après la date du commentaire et de sa mort (encyclopédie de l'islam, vol. 2, p. 770)."
  ur: "ایک گرامر جو ایک شیعہ تھا، اندراج کے فیصلے کے مطابق؛ ابن الحجیب کی قافیہ کی مشہور تفسیر کے مصنف، 683ھ (1284-5) میں مکمل ہوئے۔ ان کی وفات 684 یا 686 ہجری میں بتائی جاتی ہے۔ سیوطی اپنی زندگی کے بارے میں تفسیر کی تاریخ اور وفات سے آگے کچھ نہیں جانتے تھے {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد 1 ص۔ 770}۔"
  tr: "İbn el-Hacib'in \"El-Kafiye\" üzerine ünlü bir şerh yazan bir Şii dilbilgicisi, bu eserin 683 Hicri (1284-1285 M.S.) yılında tamamlandığı söylenir. Öldüğü söylenir, bazıları ise 686 Hicri olduğunu söyler. El-Suyuti hayatını yalnızca bu iki tarihte bilir {atıf:İslam Ansiklopedisi-2 cilt 1, s. 770}."
  id: "Seorang ahli tata bahasa Syiah yang menulis komentar terkenal tentang \"Al-Kafiyah\" oleh Ibn al-Hajib, menyelesaikannya pada tahun 683 H (1284-1285 M). Dikatakan ia meninggal pada tahun 684 H, dan beberapa mengatakan 686 H. Al-Suyuti hanya mengetahui tentang kehidupannya pada dua tanggal ini {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 770}."
