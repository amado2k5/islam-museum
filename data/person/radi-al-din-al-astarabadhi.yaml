summary:
  ar: "عالم نحوي من أهل الشيعة، ألّف شرحًا مشهورًا على «الكافية» لابن الحاجب، أتمه سنة 683هـ (1284-1285م)، ويُقال إنه توفي سنة 684هـ، وقيل 686هـ؛ ولم يعرف السيوطي عن حياته سوى هذين التاريخين {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
  en: "A grammarian who was a Shi'i, according to the entry's judgement; author of a celebrated commentary on Ibn al-Hajib's Kafiya, completed in 683 AH (1284-5). He is reported to have died in 684 or 686 AH; al-Suyuti knew nothing of his life beyond the date of the commentary and of his death {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
