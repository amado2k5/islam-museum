summary:
  ar: "شاعر جاهلي لقبه الحادرة، واسمه قطبة بن أوس بن محصن بن جرول كما في طبعة المفضليات؛ له قصيدة «بكرت سمية بكرة فتمتع» في المفضليات {{cite:mufaddaliyyat-rahmaniyya-1926 p.9}}."
  en: "A pre-Islamic poet nicknamed al-Hadira, named Qutba ibn Aws ibn Muhsin ibn Jarwal in the edition of the Mufaddaliyyat; his ode \"Sumayya set out early\" is in the Mufaddaliyyat {{cite:mufaddaliyyat-rahmaniyya-1926 p.9}}."
  es: "Un poeta preislámico apodado al-Hadira, llamado Qutba ibn Aws ibn Muhsin ibn Jarwal en la edición del Mufaddaliyyat; su oda \"Sumayya partió temprano\" está en Mufaddaliyyat {{cite:mufaddaliyyat-rahmaniyya-1926 p.9}}."
  fr: "Un poète préislamique surnommé al-Hadira, nommé Qutba ibn Aws ibn Muhsin ibn Jarwal dans l'édition du Mufaddaliyyat; son ode \"Sumayya partit tôt\" se trouve dans le Mufaddaliyyat {{cite:mufaddaliyyat-rahmaniyya-1926 p.9}}."
  ur: "ایک قبل از اسلام شاعر جس کا نام الہدیرہ تھا، جس کا نام مفدلیت کے ایڈیشن میں قطبہ ابن اوس ابن محسن ابن جروال ہے۔ ان کی غزل \"سمیہ جلدی نکل گئی\" مفدلیہ {{حوالہ:مفادالیات-رحمانیہ-1926 ص9}} میں ہے۔"
