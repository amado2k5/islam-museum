summary:
  ar: "مؤرخ تركي للعصر العثماني المتأخر في جامعة برينستون، حيث ترأس قسم دراسات الشرق الأدنى (2005–2014). وُلد في أنطاكيا سنة 1955 وتعلّم في جامعة إسطنبول، وهو من أبرز دارسي جمعية الاتحاد والترقي وتركيا الفتاة؛ من أعماله «تركيا الفتاة في المعارضة» (1995) و«التحضير لثورة» (2001) و«أتاتورك: سيرة فكرية» (2011). نال جائزة توبيتاك للخدمة (2010) والجائزة الكبرى الرئاسية للثقافة والفنون (2012)."
  en: "Turkish historian of the late Ottoman Empire at Princeton University, where he chaired the Department of Near Eastern Studies from 2005 to 2014. Born at Antakya in 1955 and educated at Istanbul University, he is a leading scholar of the Committee of Union and Progress and the Young Turks; his works include Young Turks in Opposition (1995), Preparation for a Revolution (2001) and Ataturk: An Intellectual Biography (2011). He received the TUBITAK Service Award in 2010 and the Presidential Culture and Arts Grand Award in 2012."
  ur: "ترک مؤرخ، جو آخری عثمانی دور کے ماہر ہیں اور پرنسٹن یونیورسٹی میں شعبہ مشرقِ قریب کے سربراہ رہے ⁦(2005ء–2014ء)⁩۔ 1955ء میں انطاکیہ میں پیدا ہوئے اور استنبول یونیورسٹی سے تعلیم پائی؛ وہ انجمن اتحاد و ترقی اور نوجوان ترکوں کے ممتاز محقق ہیں۔ ان کی تصانیف میں «ینگ ٹرکس ان اپوزیشن» ⁦(1995ء)⁩، «پریپریشن فار اے ریوولوشن» ⁦(2001ء)⁩ اور «اتاترک: ایک فکری سوانح» ⁦(2011ء)⁩ شامل ہیں۔ انہیں 2010ء میں توبیتاک سروس ایوارڈ اور 2012ء میں صدارتی ثقافت و فنون کا بڑا ایوارڈ ملا۔"
  es: "Historiador turco del Imperio Otomano tardío en la Universidad de Princeton, donde dirigió el Departamento de Estudios del Cercano Oriente de 2005 a 2014. Nacido en Antakya en 1955 y formado en la Universidad de Estambul, es un destacado especialista en el Comité de Unión y Progreso y los Jóvenes Turcos. Entre sus obras destacan Los jóvenes turcos en oposición (1995), Preparación para una revolución (2001) y Atatürk: Una biografía intelectual (2011). Recibió el Premio al Servicio de TUBITAK en 2010 y el Gran Premio Presidencial de Cultura y Artes en 2012."
  fr: "Historien turc spécialiste de la fin de l'Empire ottoman à l'Université de Princeton, où il a dirigé le département d'études du Proche-Orient de 2005 à 2014, il est né à Antakya en 1955 et a fait ses études à l'Université d'Istanbul. Éminent éminent du Comité Union et Progrès et des Jeunes-Turcs, il est l'auteur de plusieurs ouvrages, dont *Les Jeunes-Turcs dans l'opposition* (1995), *Préparation à une révolution* (2001) et *Atatürk: une biographie intellectuelle* (2011). Il a reçu le prix du service du TÜBİTAK en 2010 et le Grand Prix présidentiel de la culture et des arts en 2012."
  tr: "Osmanlı döneminin geç döneminde Princeton Üniversitesi'nde Yakın Doğu Çalışmaları Bölümü'ne başkanlık yapmış (2005–2014) Türk tarihçisidir. 1955 yılında Antakya'da doğmuş ve İstanbul Üniversitesi'nde eğitim görmüştür. Birlik ve İlerleme Derneği ile Genç Türkiye'nin önde gelen öğrencilerindendir; eserleri arasında \"Genç Türkiye Muhalefette\" (1995), \"Bir Devrime Hazırlık\" (2001) ve \"Atatürk: Entelektüel Bir Biyografi\" (2011) bulunmaktadır. Tobitak Hizmet Ödülü (2010) ve Cumhurbaşkanlığı Kültür ve Sanat Büyük Ödülü'nü (2012) aldı."
  id: "Sejarawan Turki dari era Ottoman akhir di Universitas Princeton, di mana ia memimpin Departemen Studi Timur Dekat (2005–2014). Ia lahir di Antakya pada tahun 1955 dan belajar di Universitas Istanbul. Ia adalah mahasiswa terkemuka dari Asosiasi Persatuan dan Kemajuan serta Turki Muda; di antara karyanya adalah \"Turki Muda dalam Oposisi\" (1995), \"Mempersiapkan Revolusi\" (2001), dan \"Atatürk: Biografi Intelektual\" (2011). Ia menerima Penghargaan Layanan Tobitak (2010) dan Hadiah Utama Presiden untuk Budaya dan Seni (2012)."
