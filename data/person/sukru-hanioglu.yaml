summary:
  ar: "مؤرخ تركي للعصر العثماني المتأخر في جامعة برينستون، حيث ترأس قسم دراسات الشرق الأدنى (2005–2014). وُلد في أنطاكيا سنة 1955 وتعلّم في جامعة إسطنبول، وهو من أبرز دارسي جمعية الاتحاد والترقي وتركيا الفتاة؛ من أعماله «تركيا الفتاة في المعارضة» (1995) و«التحضير لثورة» (2001) و«أتاتورك: سيرة فكرية» (2011). نال جائزة توبيتاك للخدمة (2010) والجائزة الكبرى الرئاسية للثقافة والفنون (2012)."
  en: "Turkish historian of the late Ottoman Empire at Princeton University, where he chaired the Department of Near Eastern Studies from 2005 to 2014. Born at Antakya in 1955 and educated at Istanbul University, he is a leading scholar of the Committee of Union and Progress and the Young Turks; his works include Young Turks in Opposition (1995), Preparation for a Revolution (2001) and Ataturk: An Intellectual Biography (2011). He received the TUBITAK Service Award in 2010 and the Presidential Culture and Arts Grand Award in 2012."
  ur: "ترک مؤرخ، جو آخری عثمانی دور کے ماہر ہیں اور پرنسٹن یونیورسٹی میں شعبہ مشرقِ قریب کے سربراہ رہے (2005ء–2014ء)۔ 1955ء میں انطاکیہ میں پیدا ہوئے اور استنبول یونیورسٹی سے تعلیم پائی؛ وہ انجمن اتحاد و ترقی اور نوجوان ترکوں کے ممتاز محقق ہیں۔ ان کی تصانیف میں «ینگ ٹرکس ان اپوزیشن» (1995ء)، «پریپریشن فار اے ریوولوشن» (2001ء) اور «اتاترک: ایک فکری سوانح» (2011ء) شامل ہیں۔ انہیں 2010ء میں توبیتاک سروس ایوارڈ اور 2012ء میں صدارتی ثقافت و فنون کا بڑا ایوارڈ ملا۔"
