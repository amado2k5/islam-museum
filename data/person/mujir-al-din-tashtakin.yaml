label: { ar: "مجير الدين طاشتكين", en: "Mujir al-Din Tashtakin" }
summary:
  ar: "مجير الدين طاشتكين أمير الحاج العراقي؛ نهى شمس الدين ابن المقدم أمير حاج الشام عن الإفاضة من عرفات قبله سنة ثلاث وثمانين وخمسمائة فلم يقف له، فركب في أصحابه وتبعه من غوغاء الحاج العراقي وطماعتهم الجم الغفير فهجموا على حاج الشام فقتلوا جماعة ونهبوا الأموال وأثخنوا ابن المقدم بالجراحات فمات بمنى من يومه؛ وكان ابن المقدم قد أخذه طاشتكين إلى خيمته ليمرضه ويستدرك ما فارط في حقه {cite:kamil-ibn-al-athir p. 162-163}."
  en: "The Iraqi Hajj's amir — insisting the Syrian caravan could not depart Arafat before his, he rode out with his men and the Iraqi rabble; the assault on the Syrian pilgrims left their amir Ibn al-Muqaddam dead of wounds at Mina, though Tashtakin had taken him into his own tent to treat him and mend what had passed {cite:kamil-ibn-al-athir p. 162-163}."
