id: person/mujir-al-din-tashtakin
class: person
label: { ar: "مجير الدين طاشتكين", en: "Mujir al-Din Tashtakin", es: "Mujir al-Din Tashtakin", fr: "Mujir al-Din Tashtakin", ur: "مجیر الدین تشتکین" }
summary:
  ar: "مجير الدين طاشتكين أمير الحاج العراقي؛ نهى شمس الدين ابن المقدم أمير حاج الشام عن الإفاضة من عرفات قبله سنة ثلاث وثمانين وخمسمائة فلم يقف له، فركب في أصحابه وتبعه من غوغاء الحاج العراقي وطماعتهم الجم الغفير فهجموا على حاج الشام فقتلوا جماعة ونهبوا الأموال وأثخنوا ابن المقدم بالجراحات فمات بمنى من يومه؛ وكان ابن المقدم قد أخذه طاشتكين إلى خيمته ليمرضه ويستدرك ما فارط في حقه {cite:kamil-ibn-al-athir p. 162-163}."
  en: "The Iraqi Hajj's amir — insisting the Syrian caravan could not depart Arafat before his, he rode out with his men and the Iraqi rabble; the assault on the Syrian pilgrims left their amir Ibn al-Muqaddam dead of wounds at Mina, though Tashtakin had taken him into his own tent to treat him and mend what had passed {cite:kamil-ibn-al-athir p. 162-163}."
  es: "El emir del Hajj iraquí, insistiendo en que la caravana siria no podía partir de Arafat antes que la suya, salió con sus hombres y la chusma iraquí; el ataque a los peregrinos sirios dejó a su emir Ibn al-Muqaddam muerto de heridas en Mina, aunque Tashtakin lo había llevado a su propia tienda para tratarlo y curar lo sucedido {cite:kamil-ibn-al-athir p. 162-163}."
  fr: "L'émir du Hajj irakien, insistant sur le fait que la caravane syrienne ne pouvait pas quitter Arafat avant la sienne, partit avec ses hommes et la foule irakienne; l'assaut contre les pèlerins syriens laissa leur émir Ibn al-Muqaddam mort de ses blessures à Mina, bien que Tashtakin l'eût emmené dans sa propre tente pour le soigner et panser ce qui était passé {cite:kamil-ibn-al-athir p. 162-163}."
  ur: "عراقی حج کے امیر نے اصرار کیا کہ شام کا قافلہ عرفات سے پہلے روانہ نہیں ہو سکتا، وہ اپنے آدمیوں اور عراقی ہجوم کے ساتھ باہر نکلا۔ شامی زائرین پر حملے نے ان کے امیر ابن المقدم کو منیٰ میں زخموں کی تاب نہ لاتے ہوئے دم توڑ دیا، حالانکہ تاشتقین انہیں اپنے خیمے میں لے گئے تھے تاکہ ان کا علاج کریں اور جو کچھ گزر چکا تھا اس کی اصلاح کریں۔ 162-163}۔"
