summary:
  ar: مقدمة وكاتبة طعام بريطانية بنغلاديشية الأصل وُلدت سنة 1984 في لوتن؛ فازت ببرنامج «الخبز البريطاني العظيم» سنة 2015، فصارت من أشهر مقدمي الطعام البريطانيين ببرامجها وكتبها الخاصة، وخبزت كعكة عيد ميلاد
    الملكة إليزابيث الثانية التسعين.
  en: British-Bangladeshi baker, television presenter and author born in Luton in 1984; winner of The Great British Bake Off in 2015, she became one of Britain's best-known food presenters with her own
    shows and books, and baked the Queen's 90th birthday cake.
  ur: برطانوی بنگلہ دیشی نژاد بیکر، ٹی وی پیش کنندہ اور مصنفہ جو 1984 میں لوٹن میں پیدا ہوئی؛ 2015 میں The Great British Bake Off جیتا، اپنے شوز اور کتابوں سے برطانیہ کی مشہور ترین فوڈ پیش کنندگان میں بنی
    اور ملکہ کی 90 ویں سالگرہ کا کیک بنایا۔
  es: "Pastelera, presentadora de televisión y autora británico-bangladesí nacida en Luton en 1984; ganadora de The Great British Bake Off en 2015, se convirtió en una de las presentadoras de programas de cocina más conocidas de Gran Bretaña con sus propios programas y libros, y horneó el pastel del 90 cumpleaños de la Reina."
  fr: "Pâtissière, présentatrice de télévision et auteure britannique d'origine bangladaise, née à Luton en 1984; gagnante de l'émission The Great British Bake Off en 2015, elle est devenue l'une des présentatrices culinaires les plus connues de Grande-Bretagne avec ses propres émissions et livres, et a réalisé le gâteau du 90e anniversaire de la Reine."
  tr: "Bangladeş kökenli İngiliz yemek sunucusu ve yazar olan Elizabeth 2015 yılında 'Great British Bread' programını kazandı; kendi programları ve kitaplarıyla en ünlü İngiliz yemek sunucularından biri oldu ve Kraliçe II. Elizabeth'in 90. doğum günü pastasını yaptı."
  id: "Seorang pembawa acara makanan dan penulis asal Inggris keturunan Bangladesh, lahir pada tahun 1984 di Luton, ia memenangkan program 'Great British Bread' pada tahun 2015, menjadi salah satu pembawa acara makanan Inggris paling terkenal dengan acara dan bukunya sendiri, serta ia memanggang kue ulang tahun ke-90 Ratu Elizabeth II."
