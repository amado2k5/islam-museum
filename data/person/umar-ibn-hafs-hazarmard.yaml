id: person/umar-ibn-hafs-hazarmard
class: person
label: { ar: "عمر بن حفص هزارمرد" }
summary:
  ar: "عند البلاذري: عمر بن حفص بن عثمان بن قبيصة بن أبي صفرة العتكي ولّاه المنصور إفريقية بعد عزل محمد بن الأشعث — وجاء عند ذلك «ولّى عمر بن حفص هزارمرد مكانه» وقال في موضع آخر «وهو الذي سبي هزار مرد» وكان المنصور به معجباً — فدخل إفريقية وغزا منها حتى بلغ أقصى بلاد البربر وابتنى العباسية فقاتله أبو خاتم الإباضي فاستشهد وجماعة من أهل بيته."
  en: "In al-Baladhuri: Umar ibn Hafs ibn Uthman ibn Qubaysa ibn Abi Sufra al-Ataki; al-Mansur gave him Ifriqiya after dismissing Muhammad ibn al-Ash'ath — the text there reads 'he appointed Umar ibn Hafs Hazarmard in his place', while elsewhere 'he being the one who captured Hazarmard' — al-Mansur admired him; he entered Ifriqiya, raided to the farthest Berber lands, built al-Abbasiyya, then Abu Khatim al-Ibadi fought him and he was martyred with a group of his household."
  es: "En al-Baladhuri: Umar ibn Hafs ibn Uthman ibn Qubaysa ibn Abi Sufra al-Ataki; al-Mansur le dio Ifriqiya después de destituir a Muhammad ibn al-Ash'ath — el texto allí dice 'nombró a Umar ibn Hafs Hazarmard en su lugar', mientras que en otro lugar 'siendo él quien capturó a Hazarmard' — al-Mansur lo admiraba; entró en Ifriqiya, realizó incursiones en las tierras bereberes más lejanas, construyó al-Abbasiyya, luego Abu Khatim al-Ibadi luchó contra él y fue martirizado con un grupo de su familia."
  fr: "Dans al-Baladhuri: Umar ibn Hafs ibn Uthman ibn Qubaysa ibn Abi Sufra al-Ataki; al-Mansur lui donna Ifriqiya après avoir renvoyé Muhammad ibn al-Ash'ath — le texte dit: « il nomma Umar ibn Hafs Hazarmard à sa place », tandis qu'ailleurs: « c'est lui qui captura Hazarmard » — al-Mansur l'admirait; il entra à Ifriqiya, mena des raids jusqu'aux terres berbères les plus reculées, construisit al-Abbasiyya, puis Abu Khatim al-Ibadi le combattit et il fut martyrisé avec un groupe de sa famille."
