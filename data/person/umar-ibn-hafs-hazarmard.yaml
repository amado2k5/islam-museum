label: { ar: "عمر بن حفص هزارمرد" }
summary:
  ar: "عند البلاذري: عمر بن حفص بن عثمان بن قبيصة بن أبي صفرة العتكي ولّاه المنصور إفريقية بعد عزل محمد بن الأشعث — وجاء عند ذلك «ولّى عمر بن حفص هزارمرد مكانه» وقال في موضع آخر «وهو الذي سبي هزار مرد» وكان المنصور به معجباً — فدخل إفريقية وغزا منها حتى بلغ أقصى بلاد البربر وابتنى العباسية فقاتله أبو خاتم الإباضي فاستشهد وجماعة من أهل بيته."
  en: "In al-Baladhuri: Umar ibn Hafs ibn Uthman ibn Qubaysa ibn Abi Sufra al-Ataki; al-Mansur gave him Ifriqiya after dismissing Muhammad ibn al-Ash'ath — the text there reads 'he appointed Umar ibn Hafs Hazarmard in his place', while elsewhere 'he being the one who captured Hazarmard' — al-Mansur admired him; he entered Ifriqiya, raided to the farthest Berber lands, built al-Abbasiyya, then Abu Khatim al-Ibadi fought him and he was martyred with a group of his household."
