summary:
  ar: "الأستاذ محمد فريد وجدي، رئيس تحرير مجلة الأزهر سابقاً، وكاتب في الدفاع عن الإسلام أمام أسئلة العلم والفلسفة في النصف الأول من القرن العشرين؛ توفي سنة ١٣٧٣هـ / ١٩٥٤م كما يذكر غلاف كتابه «الإسلام دين عام خالد» {cite:al-islam-din-amm-khalid-azhar p. 2}."
  en: "Muhammad Farid Wajdi, former editor-in-chief of the al-Azhar magazine and a writer who answered scientific and philosophical doubts about Islam; the title page of his book gives his death as 1373 AH / 1954 CE {cite:al-islam-din-amm-khalid-azhar p. 2}."
  es: "Muhammad Farid Wajdi, ex redactor jefe de la revista al-Azhar y escritor que respondió a dudas científicas y filosóficas sobre el Islam; la portada de su libro indica que falleció en 1373 AH / 1954 CE {cite:al-islam-din-amm-khalid-azhar p. 2}."
  fr: "Muhammad Farid Wajdi, ancien rédacteur en chef du magazine al-Azhar et auteur qui a répondu aux doutes scientifiques et philosophiques sur l'islam; la page de titre de son livre indique sa mort en 1373 AH / 1954 CE {cite:al-islam-din-amm-khalid-azhar p. 2}."
  ur: "محمد فرید وجدی، الازہر میگزین کے سابق چیف ایڈیٹر اور ایک مصنف جنہوں نے اسلام کے بارے میں سائنسی اور فلسفیانہ شبہات کا جواب دیا؛ ان کی کتاب کے ٹائٹل پیج پر ان کی وفات 1373ھ / 1954 عیسوی درج ہے 2}۔"
  tr: "Profesör Muhammed Farid Wagdi, Al-Azhar dergisinin eski genel yayın yönetmeni ve yirminci yüzyılın ilk yarısında bilim ve felsefe soruları karşısında İslam'ı savunan yazar; 1373 Hicri / 1954 yılında vefat etti; bu, 'İslam Ebedi Kamu Dini Olarak' kitabının kapağında belirtildiği gibi, {cite:al-Islam-din-amm-khalid-azhar, s. 2}."
  id: "Profesor Muhammad Farid Wagdi, mantan pemimpin redaksi majalah Al-Azhar dan penulis yang membela Islam di tengah pertanyaan sains dan filsafat pada paruh pertama abad kedua puluh; ia meninggal pada tahun 1373 H / 1954 M, seperti yang disebutkan di sampul bukunya 'Islam sebagai Agama Publik Abadi' {cite:al-Islam-din-amm-khalid-azhar, hlm. 2}."
