summary:
  ar: "يوسف بن أحمد بن أبي بكر، نجم الدين الخاصي، نسبة إلى الخاص قرية من قرى خوارزم، فقيه حنفي، كان إماماً فاضلاً، تفقه على أبي بكر محمد بن عبد الله، وعلى الصدر الشهيد حسام الدين عمر والحسن قاضيخان، وله كتاب الفتاوى ومختصر الفصول. (٦٣٤-؟ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13353}"
  en: "Yusuf ibn Ahmad ibn Abi Bakr, Najm al-Din al-Khassi, from the village of al-Khass in Khwarazm. A Hanafi jurist and a distinguished imam, he studied with Abu Bakr Muhammad ibn Abd Allah and with al-Sadr al-Shahid Husam al-Din Umar and al-Hasan Qadikhan. His works include al-Fatawa and Mukhtasar al-Fusul. Birth 634 H as printed; death not given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13353}"
