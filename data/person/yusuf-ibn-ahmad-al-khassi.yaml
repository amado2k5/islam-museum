summary:
  ar: "يوسف بن أحمد بن أبي بكر، نجم الدين الخاصي، نسبة إلى الخاص قرية من قرى خوارزم، فقيه حنفي، كان إماماً فاضلاً، تفقه على أبي بكر محمد بن عبد الله، وعلى الصدر الشهيد حسام الدين عمر والحسن قاضيخان، وله كتاب الفتاوى ومختصر الفصول. ⁦(٦٣٤-؟ه)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13353}"
  en: "Yusuf ibn Ahmad ibn Abi Bakr, Najm al-Din al-Khassi, from the village of al-Khass in Khwarazm. A Hanafi jurist and a distinguished imam, he studied with Abu Bakr Muhammad ibn Abd Allah and with al-Sadr al-Shahid Husam al-Din Umar and al-Hasan Qadikhan. His works include al-Fatawa and Mukhtasar al-Fusul. Birth 634 H as printed; death not given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13353}"
  es: "Yusuf ibn Ahmad ibn Abi Bakr, Najm al-Din al-Khassi, del pueblo de al-Khass en Khwarazm. Jurista hanafi y distinguido imán, estudió con Abu Bakr Muhammad ibn Abd Allah y con al-Sadr al-Shahid Husam al-Din Umar y al-Hasan Qadikhan. Sus obras incluyen al-Fatawa y Mukhtasar al-Fusul. Nacimiento 634 H según lo impreso; muerte no dada. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13353}"
  fr: "Yusuf ibn Ahmad ibn Abi Bakr, Najm al-Din al-Khassi, du village d'al-Khass à Khwarazm. Juriste Hanafi et imam éminent, il a étudié avec Abu Bakr Muhammad ibn Abd Allah et avec al-Sadr al-Shahid Husam al-Din Umar et al-Hasan Qadikhan. Ses œuvres incluent al-Fatawa et Mukhtasar al-Fusul. Naissance 634 H tel qu'imprimé; la mort n'est pas donnée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13353}"
  ur: "یوسف بن احمد ابن ابی بکر، نجم الدین الخاصی، خوارزم کے گاؤں الخاص سے۔ ایک حنفی فقیہ اور ایک ممتاز امام، اس نے ابوبکر محمد بن عبد اللہ، الصدر الشہد حسام الدین عمر، اور الحسن قادیخان سے تعلیم حاصل کی۔ ان کی تصانیف میں الفتاوی اور مختار الفصل شامل ہیں۔ پیدائش 634ھ ⁦(مطبوعہ)⁩؛ موت کی تاریخ نہیں دی گئی. {حوالہ: فقہ الموسوع کویتیہ نور v3 ص13353}"
  tr: "Yusuf ibn Ahmed ibn Ebi Bekir, Necmeddin el-Hasi, Kwarerezm'in bir köyünde el-Hass'ın adını taşıyan, Hanefi bir hukukçu olup, erdemli bir imamdı. Ebu Bekir Muhammed bin Abdullah, el-Sadr el-Şehid Hüssam el-Din Ömer ve el-Hasan Kadikhan'ın yanında hukuk eğitimi aldı. El-Fetava ve Muhtesar el-Fusul adlı kitabı yazdı. (634-?H). {alıntı:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.13353}"
  id: "Yusuf ibn Ahmad ibn Abi Bakr, Najm al-Din al-Khasi, dinamai menurut al-Khass di sebuah desa Khwarazm, seorang ahli hukum Hanafi, adalah seorang imam yang berbudi luhur. Ia mempelajari fiqh-mawsua-kuwaiti di bawah bimbingan Abu Bakr Muhammad ibn Abdullah, al-Sadr al-Shahid Hussam al-Din Umar, dan al-Hasan Qadikhan. Ia menulis buku al-Fatawa wa Mukhtasar al-Fusul. (634-?H). {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.13353}"
