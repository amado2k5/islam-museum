summary:
  ar: "السلطان الثامن عشر لبويان في منداناو (حكم 1875–1902)، وُلد باسم أنوار الدين أوتو. بنى تحالفًا عبر حوض نهر بولانغي، وفقد إحدى عينيه في قتال الإسبان سنة 1864، وأبقى بويان عصية على الحملات الإسبانية المتعاقبة، موقّعًا معاهدات سلام مفروضة سنتي 1875 و1887 دون خضوع؛ وامتد نفوذه في ذروته من بحيرة بولوان إلى خليج سارانغاني. توفي في ساباكان في آذار 1902."
  en: "The 18th Sultan of Buayan in Mindanao (reigned 1875–1902), born Anwarud-din Uto. He built a coalition across the Pulangi River basin, lost an eye fighting the Spanish in 1864, and kept Buayan unconquered through successive Spanish offensives, signing imposed peace treaties in 1875 and 1887 without submitting; at his peak his domain ran from Lake Buluan to Sarangani Bay. He died at Sapakan in March 1902."
  ur: "منداناؤ میں بویان کے اٹھارویں سلطان (حکومت 1875ء–1902ء)، ولادت کا نام انوار الدین اوتو تھا۔ انہوں نے دریائے پولانگی کے طاس میں اتحاد قائم کیا، 1864ء میں ہسپانویوں سے لڑتے ہوئے ایک آنکھ کھوئی، اور یکے بعد دیگرے ہسپانوی حملوں کے باوجود بویان کو ناقابلِ تسخیر رکھا؛ 1875ء اور 1887ء میں مسلط شدہ امن معاہدے کیے مگر اطاعت نہ کی۔ عروج پر ان کا علاقہ جھیل بولوان سے خلیج سارانگانی تک پھیلا تھا۔ مارچ 1902ء میں ساپاکان میں وفات پائی۔"
