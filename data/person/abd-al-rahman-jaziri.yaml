summary:
  ar: "عبد الرحمن بن محمد عوض الجزيري، فقيه من علماء الأزهر، ولد بجزيرة شندويل من مركز سوهاج بمصر سنة 1299 هـ الموافقة 1882م، وعُيّن مفتشاً للمساجد بوزارة الأوقاف ثم أستاذاً في كلية أصول الدين وعضواً في هيئة كبار العلماء، وصاحب «الفقه على المذاهب الأربعة»؛ توفي بحلوان سنة 1360 هـ الموافقة 1941م."
  en: "Abd al-Rahman ibn Muhammad Awad al-Jaziri, a jurist of al-Azhar born on the island of Shandawil in the Sohag district of Egypt in 1299 AH (1882 CE), later inspector of mosques in the Ministry of Endowments, professor at the Faculty of Usul al-Din and member of the Council of Senior Scholars, author of al-Fiqh ala al-Madhahib al-Arba'a; he died at Helwan in 1360 AH (1941 CE)."
