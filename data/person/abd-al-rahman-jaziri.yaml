summary:
  ar: "عبد الرحمن بن محمد عوض الجزيري، فقيه من علماء الأزهر، ولد بجزيرة شندويل من مركز سوهاج بمصر سنة 1299 هـ الموافقة 1882م، وعُيّن مفتشاً للمساجد بوزارة الأوقاف ثم أستاذاً في كلية أصول الدين وعضواً في هيئة كبار العلماء، وصاحب «الفقه على المذاهب الأربعة»؛ توفي بحلوان سنة 1360 هـ الموافقة 1941م."
  en: "Abd al-Rahman ibn Muhammad Awad al-Jaziri, a jurist of al-Azhar born on the island of Shandawil in the Sohag district of Egypt in 1299 AH (1882 CE), later inspector of mosques in the Ministry of Endowments, professor at the Faculty of Usul al-Din and member of the Council of Senior Scholars, author of al-Fiqh ala al-Madhahib al-Arba'a; he died at Helwan in 1360 AH (1941 CE)."
  fr: "Abd al-Rahman ibn Muhammad Awad al-Jaziri, juriste d'al-Azhar né sur l'île de Shandawil dans le district de Sohag en Égypte en 1299 H (1882 ap. J.-C.), plus tard inspecteur des mosquées au ministère des Waqfs, professeur à la Faculté d'Usul al-Din et membre du Conseil des grands savants, auteur d'al-Fiqh ala al-Madhahib al-Arba'a ; il mourut à Helwan en 1360 H (1941 ap. J.-C.)."
  es: "Abd al-Rahman ibn Muhammad Awad al-Jaziri, jurista de al-Azhar, nació en la isla de Shandawil, en el distrito de Sohag, Egipto, en 1299 AH (1882 d. C.). Posteriormente fue inspector de mezquitas en el Ministerio de Dotaciones, profesor en la Facultad de Usul al-Din y miembro del Consejo de Altos Eruditos, autor de al-Fiqh ala al-Madhahib al-Arba'a; falleció en Helwan en 1360 AH (1941 d. C.)."
  ur: "عبدالرحمن بن محمد عواد الجزیری، الازہر کے ایک فقیہ، مصر کے سوہاگ ضلع کے جزیرے شنداویل میں 1299 ہجری ⁦(1882 عیسوی)⁩ میں پیدا ہوئے، بعد میں وزارت اوقاف میں مساجد کے انسپکٹر، اصول الصنعتین کے فیکلٹی کے پروفیسر اور مصنف العلم الدین کی کونسل کے رکن۔ الا المذہیب العربیہ؛ آپ کی وفات 1360ھ ⁦(1941ء)⁩ میں ہلوان میں ہوئی۔"
