label: { ar: "القضاعي القاضي أبو عبد الله محمد بن سلامة" }
summary:
  ar: "القضاعي القاضي أبو عبد الله محمد بن سلامة بن جعفر بن علي بن حكمون المصري، الفقيه الشافعي قاضي الديار المصرية؛ مصنف كتاب الشهاب وكتاب مناقب الإمام الشافعي وأخباره وكتاب الإنباء عن الأنبياء وتواريخ الخلفاء وكتاب خطط مصر؛ قال ابن ما كولا: كان متفنناً في عدة علوم لم أر بمصر من يجري مجراه؛ وحج سنة خمس وأربعين وأربعمائة وسمع منه الخطيب البغدادي الحديث؛ توفي بمنصرة في ذي الحجة سنة أربع وخمسين وأربعمائة وصلى عليه يوم جمعة بعد العصر {cite:shadharat-dhahab p. 301-302}."
  en: "Al-Quda'i — Abu Abdallah Muhammad b. Salama, the Shafi'i judge of Egypt and author of *al-Shihab*, the life of al-Shafi'i, *al-Inba' 'an al-anbiya'*, the history of the caliphs, and the Khitat of Egypt; Ibn Makula: 'I saw none in Egypt like him, versed in many sciences'; made hajj in 445 where al-Khatib al-Baghdadi heard him; died at Mansura in Dhu al-Hijja 454 {cite:shadharat-dhahab p. 301-302}."
