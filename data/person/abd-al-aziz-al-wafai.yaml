class: person
label: { ar: "عز الدين عبد العزيز بن محمد الوفائي", en: "Izz al-Din Abd al-Aziz ibn Muhammad al-Wafa'i", fr: "Izz al-Din Abd al-Aziz ibn Muhammad al-Wafa'i", ur: "عز الدین عبد العزیز بن محمد الوفائی", es: "Izz al-Din Abd al-Aziz ibn Muhammad al-Wafa'i" }
summary:
  ar: "فلكي مصري ⁦(811–879هـ)⁩، ميقاتي بالجامع المؤيدي بالقاهرة، مخترع آلة «دائرة المعدل»، له أكثر من عشرين رسالة {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24}."
  en: "Egyptian astronomer (811–879 AH), timekeeper at the Mu'ayyadi Mosque in Cairo, inventor of the instrument called da'irat al-mu'addil, with more than twenty treatises {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24}."
  fr: "Astronome égyptien (811–879 H), chronométreur (muwaqqit) à la mosquée al-Mu'ayyadi du Caire, inventeur de l'instrument appelé da'irat al-mu'addil, auteur de plus de vingt traités {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24}."
  ur: "مصری ماہرِ فلکیات ⁦(811–879ھ)⁩، قاہرہ کی جامع مؤیدی کے میقاتی، «دائرۃ المعدل» نامی آلے کے موجد، بیس سے زیادہ رسائل کے مصنف {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24}۔"
  es: "Astrónomo egipcio (811–879 AH), cronometrador de la mezquita Mu'ayyadi en El Cairo, inventor del instrumento llamado da'irat al-mu'addil, con más de veinte tratados {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24}."
  tr: "Kahire'deki El-Muayyad Camii'nde zaman tutucu olarak görev yapan, \"Ekvator Çemberi\" makinesinin mucidi olan Mısırlı bir astronom (811-879 Hicri), yirmiden fazla risaleye sahiptir. {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 24}."
  id: "Seorang astronom Mesir (811–879 H), penjaga waktu di Masjid Al-Mu'ayyad di Kairo, penemu mesin “Lingkaran Khatulistiwa”, ia memiliki lebih dari dua puluh risalah {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24}."
