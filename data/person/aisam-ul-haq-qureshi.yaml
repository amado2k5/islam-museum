summary:
  ar: "لاعب كرة مضرب باكستاني سابق تخصص في الزوجي، وُلد في لاهور سنة 1980، وهو الباكستاني الوحيد الذي بلغ نهائي بطولة كبرى، إذ وصل مع روهان بوبانا إلى نهائي زوجي الرجال في بطولة أمريكا المفتوحة 2010 ومع كفيتا بيشكه إلى نهائي الزوجي المختلط في البطولة نفسها، وبلغ أعلى تصنيف له الثامن عالميا في الزوجي في يونيو 2011 وفاز بثمانية عشر لقبا في بطولات الرابطة منها باريس للماسترز 2011 وميامي 2013، وهو أنجح لاعب في تاريخ باكستان في كأس ديفيز وقائد منتخبها منذ 2022، ونال مع بوبانا جائزة آرثر آش الإنسانية سنة 2010 وأسسا حملة «أوقفوا الحرب وابدأوا التنس»، وعُيّن سفيرا للنوايا الحسنة لبرنامج الأمم المتحدة الإنمائي، ويرأس الاتحاد الباكستاني للتنس منذ فبراير 2024، واعتزل بطولات الرابطة في نوفمبر 2025."
  en: "Pakistani former professional tennis player who specialised in doubles, born in Lahore in 1980. He is the only Pakistani ever to reach a Grand Slam final, doing so in both men's doubles (with Rohan Bopanna) and mixed doubles (with Květa Peschke) at the 2010 US Open, reached a career-high doubles ranking of world No. 8 in June 2011, and won 18 ATP Tour titles including the 2011 Paris Masters and the 2013 Miami Open. Pakistan's most successful Davis Cup player and the team's captain from 2022, he shared the 2010 Arthur Ashe Humanitarian Award with Bopanna, co-founded the 'Stop War Start Tennis' campaign, served as a UNDP goodwill ambassador, has presided over the Pakistan Tennis Federation since February 2024, and retired from ATP Tour events in November 2025."
  ur: "پاکستانی سابق پیشہ ور ٹینس کھلاڑی جو ڈبلز میں مہارت رکھتے تھے، 1980 میں لاہور میں پیدا ہوئے۔ وہ گرینڈ سلیم فائنل تک پہنچنے والے واحد پاکستانی ہیں: 2010 کے یو ایس اوپن میں روہن بوپنا کے ساتھ مردوں کے ڈبلز اور کویٹا پیشکے کے ساتھ مکسڈ ڈبلز کے فائنل تک پہنچے، جون 2011 میں ڈبلز کی عالمی درجہ بندی میں نمبر 8 تک پہنچے اور اے ٹی پی ٹور کے 18 خطاب جیتے جن میں 2011 کا پیرس ماسٹرز اور 2013 کا میامی اوپن شامل ہیں۔ وہ پاکستان کے کامیاب ترین ڈیوس کپ کھلاڑی اور 2022 سے ٹیم کے کپتان ہیں، بوپنا کے ساتھ 2010 کا آرتھر ایش انسان دوستی ایوارڈ حاصل کیا، «جنگ روکو، ٹینس شروع کرو» مہم کی بنیاد رکھی، یو این ڈی پی کے خیرسگالی سفیر رہے، فروری 2024 سے پاکستان ٹینس فیڈریشن کے صدر ہیں، اور نومبر 2025 میں اے ٹی پی ٹور ایونٹس سے ریٹائر ہو گئے۔"
  es: "Ex tenista profesional pakistaní especializado en dobles, nacido en Lahore en 1980. Es el único pakistaní en alcanzar una final de Grand Slam, tanto en dobles masculinos (con Rohan Bopanna) como en dobles mixtos (con Květa Peschke) en el US Open de 2010. Alcanzó el puesto número 8 del ranking mundial de dobles en junio de 2011 y ganó 18 títulos del ATP Tour, incluyendo el Masters de París de 2011 y el Abierto de Miami de 2013. El jugador pakistaní más exitoso en la Copa Davis y capitán del equipo desde 2022, compartió el Premio Humanitario Arthur Ashe de 2010 con Bopanna, cofundó la campaña \"Stop War Start Tennis\", fue embajador de buena voluntad del PNUD, presidió la Federación de Tenis de Pakistán desde febrero de 2024 y se retiró de los eventos del ATP Tour en noviembre de 2025."
  fr: "Ancien joueur de tennis professionnel pakistanais, spécialiste du double, né à Lahore en 1980. Il est le seul Pakistanais à avoir atteint une finale de Grand Chelem, en double messieurs (avec Rohan Bopanna) et en double mixte (avec Květa Peschke) à l'US Open 2010. Il a atteint le 8e rang mondial en double en juin 2011 et a remporté 18 titres ATP, dont le Masters de Paris 2011 et l'Open de Miami 2013. Joueur pakistanais le plus titré en Coupe Davis et capitaine de l'équipe à partir de 2022, il a partagé le prix humanitaire Arthur Ashe 2010 avec Bopanna, a cofondé la campagne « Stop War Start Tennis », a été ambassadeur de bonne volonté du PNUD, a présidé la Fédération pakistanaise de tennis depuis février 2024 et a pris sa retraite des tournois ATP en novembre 2025."
  tr: "1980 yılında Lahor'da doğan ve çiftler konusunda uzmanlaşmış eski bir Pakistanlı tenis oyuncusu olan bu isim, 2010 ABD Açık'ta Rohan Bopanna ile erkekler çiftler finaline ve aynı turnuvada Kveta Bishke ile karışık çiftler finaline ulaşarak Grand Slam finaline ulaşan tek Pakistanlı oyuncudur. Haziran 2011'de çiftlerde dünya sıralamasında sekizinci sıraya kadar yükselmiş ve 2011 Paris Masters ve 2013 Miami Masters dahil olmak üzere ATP turnuvalarında on sekiz şampiyonluk kazanmıştır. Davis Kupası'nda Pakistan tarihinin en başarılı oyuncusudur ve 2022'den beri milli takım kaptanlığını yapmaktadır. Bopanna ile birlikte 2010 yılında Arthur Ashe İnsani Yardım Ödülü'nü kazanmış ve \"Savaşı Durdur ve Tenise Başla\" kampanyasını kurmuştur. Birleşmiş Milletler Kalkınma Programı İyi Niyet Elçisi olarak atandı ve Şubat 2024'ten beri Pakistan Tenis Federasyonu başkanlığını yürütüyor. Kasım 2025'te ATP turnuvalarından emekli oldu."
  id: "Mantan pemain tenis Pakistan yang berspesialisasi dalam ganda, lahir di Lahore pada tahun 1980, ia adalah satu-satunya pemain Pakistan yang pernah mencapai final Grand Slam, setelah mencapai final ganda putra di US Open 2010 bersama Rohan Bopanna dan final ganda campuran di turnamen yang sama bersama Kveta Bishke. Ia mencapai peringkat tertinggi kedelapan di dunia dalam ganda pada Juni 2011 dan memenangkan delapan belas gelar di turnamen ATP, termasuk Paris Masters pada 2011 dan Miami pada 2013. Ia adalah pemain paling sukses dalam sejarah Pakistan di Piala Davis dan telah menjadi kapten tim nasional sejak 2022. Ia dan Bopanna memenangkan Penghargaan Kemanusiaan Arthur Ashe pada 2010 dan mendirikan kampanye \"Hentikan Perang dan Mulailah Tenis\". Ia diangkat sebagai Duta Besar Kehormatan untuk Program Pembangunan Perserikatan Bangsa-Bangsa dan telah menjadi presiden Federasi Tenis Pakistan sejak Februari 2024. Ia pensiun dari turnamen ATP pada November 2025."
