summary:
  ar: "لاعب كرة مضرب باكستاني سابق تخصص في الزوجي، وُلد في لاهور سنة 1980، وهو الباكستاني الوحيد الذي بلغ نهائي بطولة كبرى، إذ وصل مع روهان بوبانا إلى نهائي زوجي الرجال في بطولة أمريكا المفتوحة 2010 ومع كفيتا بيشكه إلى نهائي الزوجي المختلط في البطولة نفسها، وبلغ أعلى تصنيف له الثامن عالميا في الزوجي في يونيو 2011 وفاز بثمانية عشر لقبا في بطولات الرابطة منها باريس للماسترز 2011 وميامي 2013، وهو أنجح لاعب في تاريخ باكستان في كأس ديفيز وقائد منتخبها منذ 2022، ونال مع بوبانا جائزة آرثر آش الإنسانية سنة 2010 وأسسا حملة «أوقفوا الحرب وابدأوا التنس»، وعُيّن سفيرا للنوايا الحسنة لبرنامج الأمم المتحدة الإنمائي، ويرأس الاتحاد الباكستاني للتنس منذ فبراير 2024، واعتزل بطولات الرابطة في نوفمبر 2025."
  en: "Pakistani former professional tennis player who specialised in doubles, born in Lahore in 1980. He is the only Pakistani ever to reach a Grand Slam final, doing so in both men's doubles (with Rohan Bopanna) and mixed doubles (with Květa Peschke) at the 2010 US Open, reached a career-high doubles ranking of world No. 8 in June 2011, and won 18 ATP Tour titles including the 2011 Paris Masters and the 2013 Miami Open. Pakistan's most successful Davis Cup player and the team's captain from 2022, he shared the 2010 Arthur Ashe Humanitarian Award with Bopanna, co-founded the 'Stop War Start Tennis' campaign, served as a UNDP goodwill ambassador, has presided over the Pakistan Tennis Federation since February 2024, and retired from ATP Tour events in November 2025."
  ur: "پاکستانی سابق پیشہ ور ٹینس کھلاڑی جو ڈبلز میں مہارت رکھتے تھے، 1980 میں لاہور میں پیدا ہوئے۔ وہ گرینڈ سلیم فائنل تک پہنچنے والے واحد پاکستانی ہیں: 2010 کے یو ایس اوپن میں روہن بوپنا کے ساتھ مردوں کے ڈبلز اور کویٹا پیشکے کے ساتھ مکسڈ ڈبلز کے فائنل تک پہنچے، جون 2011 میں ڈبلز کی عالمی درجہ بندی میں نمبر 8 تک پہنچے اور اے ٹی پی ٹور کے 18 خطاب جیتے جن میں 2011 کا پیرس ماسٹرز اور 2013 کا میامی اوپن شامل ہیں۔ وہ پاکستان کے کامیاب ترین ڈیوس کپ کھلاڑی اور 2022 سے ٹیم کے کپتان ہیں، بوپنا کے ساتھ 2010 کا آرتھر ایش انسان دوستی ایوارڈ حاصل کیا، «جنگ روکو، ٹینس شروع کرو» مہم کی بنیاد رکھی، یو این ڈی پی کے خیرسگالی سفیر رہے، فروری 2024 سے پاکستان ٹینس فیڈریشن کے صدر ہیں، اور نومبر 2025 میں اے ٹی پی ٹور ایونٹس سے ریٹائر ہو گئے۔"
