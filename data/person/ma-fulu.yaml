summary:
  ar: "جنرال مسلم صيني (1854–1900)، ابن الجنرال ما تشيانلينغ وشقيق ما فوشيانغ. نال شهادة «جينشي» العسكرية وخدم حارسًا للإمبراطور في شبابه، ثم قاد قوات الهوي ضمن «شجعان قانسو» في قمع ثورة الدونغان 1895–1896، وقُتل سنة 1900 وهو يدافع عن بوابة تشنغيانغ في بكين ضد تحالف الدول الثماني أثناء ثورة الملاكمين."
  en: "A Chinese Muslim general (1854–1900), son of General Ma Qianling and brother of Ma Fuxiang. He took the military jinshi degree and served as an imperial guard in his youth, then led Hui troops among the Kansu Braves in suppressing the Dungan revolt of 1895–1896, and was killed in 1900 defending the Zhengyang Gate in Peking against the Eight-Nation Alliance during the Boxer Rebellion."
  ur: "ایک چینی مسلمان جنرل (1854ء–1900ء)، جنرل ما چیان لنگ کے بیٹے اور ما فو شیانگ کے بھائی۔ انہوں نے عسکری جن شی کی ڈگری حاصل کی اور جوانی میں شہنشاہ کے محافظ رہے، پھر 1895ء–1896ء کی دونغان بغاوت کو کچلنے میں «کانسو بہادر» فوج میں ہوئی دستوں کی قیادت کی، اور 1900ء میں باکسر بغاوت کے دوران آٹھ ملکی اتحاد کے خلاف پیکنگ کے ژینگ یانگ دروازے کا دفاع کرتے ہوئے قتل ہوئے۔"
