summary:
  ar: "أبو جعفر محمد بن الحسن بن علي الطوسي، شيخ الطائفة وعلّامة الإمامية؛ ولد بطوس سنة ٣٨٥هـ/٩٩٥م وقدم بغداد سنة ٤٠٨هـ فلازم الشيخ المفيد ثم كان أبرز تلاميذ الشريف المرتضى وخلفه في رئاسة الشيعة سنة ٤٣٦هـ، وقرّبه الخليفة القائم فجعله على أعلى كرسي للكلام بالعاصمة، وصارت داره بالكرخ مركز الإمامية العلمي حتى أحرقت داره ومكتبته سنة ٤٤٩هـ فلجأ إلى النجف وبها توفي سنة ٤٦٠هـ ودُفن فيها؛ له «التبيان» و«التهذيب» و«الاستبصار» و«الفهرست» و«الرجال» {cite:encyclopaedia-of-islam-2 vol. 10 pp. 744-745} {cite:tarikh-islam-dhahabi p. 490-491}."
  en: "Abu Ja'far Muhammad ibn al-Hasan ibn Ali al-Tusi, 'Shaykh al-Ta'ifa' and leading scholar of Imami Shi'ism; born at Tus in Ramadan 385/995, he moved to Baghdad in 408/1017, studied under al-Shaykh al-Mufid and then became the principal disciple of al-Sharif al-Murtada, succeeding him at the head of the capital's Shi'a in 436/1044. The caliph al-Qa'im gave him the chief chair of theology and his Karkh house was the Imami intellectual centre until it was sacked and burned in 449/1057, when he took refuge at Najaf, dying there in Muharram 460/1067; author of al-Tibyan, Tahdhib al-Ahkam, al-Istibsar, the Fihrist and the Rijal {cite:encyclopaedia-of-islam-2 vol. 10 pp. 744-745} {cite:tarikh-islam-dhahabi p. 490-491}."
  ur: "ابو جعفر محمد بن حسن بن علی طوسی، 'شیخ الطائفہ' اور امامیہ کے ممتاز علم؛ طوس میں 385ھ/995ء میں پیدا ہوئے، 408ھ/1017ء میں بغداد آئے، شیخ مفید سے پڑھے اور پھر شریف مرتضیٰ کے مخصوص شاگرد بنے اور 436ھ/1044ء میں ان کی وفات پر دارالخلافہ کے شیعوں کے سرکردہ عالم ہوئے؛ خلیفہ قائم نے انہیں کلام کی اہم ترین کرسی دی اور ان کا کرخ کا گھر امامیہ کا علمی مرکز رہا یہاں تک کہ 449ھ/1057ء میں جلا دیا گیا، جس پر وہ نجف میں پناہ گزین ہوئے اور وہیں محرم 460ھ/1067ء میں فوت ہوئے؛ تصانیف: التبیان، تہذیب الاحکام، الاستبصار، فہرست اور رجال {cite:encyclopaedia-of-islam-2 vol. 10 pp. 744-745} {cite:tarikh-islam-dhahabi p. 490-491}۔"
