summary:
  ar: "كتب إلى عمر بن عبد العزيز إن الدنيا دار عقوبة لها يجمع من لا عقل له وبها يغتر من لا علم له فكن بها كالمداوي جرحه واصبر على شدة الدواء لما تخاف من عاقبة الداء {cite:muruj-al-dhahab p. 175}."
  en: "His letter to the caliph — 'this world is a house of punishment; be in it like one tending his wound, bearing the bitter medicine for fear of the disease's end' {cite:muruj-al-dhahab p. 175}."
  es: "Su carta al califa: «Este mundo es una casa de castigo; compórtate en él como quien cura su herida, llevando la amarga medicina por temor al final de la enfermedad» {cita:muruj-al-dhahab p. 175}."
  fr: "Sa lettre au calife — « ce monde est une maison de châtiment; sois-y comme celui qui soigne sa blessure, supportant le remède amer par crainte de la fin de la maladie » {cite: muruj-al-dhahab p. 175}."
  ur: "خلیفہ کو اس کا خط - 'یہ دنیا عذاب کا گھر ہے۔ اس میں اس طرح ہو جیسے کوئی اپنے زخم کا علاج کر رہا ہو، بیماری کے خاتمے کے خوف سے کڑوی دوا لے رہا ہو''۔ 175}۔"
  tr: "Ömer bin Abdülaziz'e şöyle yazdı: 'Dünya onun cezası yeridir, akılsızları toplar, bilgisizleri orada kandırır. O halde yarasını iyileştiren gibi ol ve hastalığın sonuçlarından korktuğun için şifanın şiddetine sabırlı ol.' {alıntı:Muruj-al-Dhahab, s. 175}."
  id: "Ia menulis kepada Umar ibn Abd al-Aziz: 'Dunia adalah tempat hukuman untuknya, mengumpulkan mereka yang tidak waras, dan di dalamnya menipu mereka yang tidak tahu. Maka jadilah seperti orang yang menyembuhkan lukanya di dalamnya, dan bersabarlah dengan keparahan penyembuhan karena kamu takut akan konsekuensi penyakit itu.' {cite:muruj-al-dhahab, hlm. 175}."
