id: person/ahmad-ibn-harith-qadi-al-jama
class: person
label: { ar: "قاضي الجماعة ابن حريث", en: "Qadi al-Jama'a Ibn Harith (Ahmad ibn 'Abd al-Rahman)", fr: "Le cadi de la communauté Ibn Harith (Ahmad ibn 'Abd al-Rahman)", es: "Qadi al-Jama'a Ibn Harith (Ahmad ibn 'Abd al-Rahman)", ur: "قضاء الجامع ابن حارث ⁦(احمد بن عبدالرحمٰن)⁩" }
summary:
  ar: "أحمد بن عبد الرحمن بن محمد بن سعد بن حريث، أبو العباس، اللخمي الجياني القرطبي، قاضي الجماعة، وكان مقرئا مجودا محدثا مكثرا، ذاكرا لمسائل الفقه، عارفا بأصوله، ماهرا في كثير من علوم الأوائل، ثاقب الذهن متوقد الذكاء. من تصانيفه: المشرق في إصلاح المنطق، وتنزيه القرآن عما لا يليق بالبيان. والتاريخ في المدخل ⁦(513-592 هـ)⁩ مكتوب بترتيب معكوس، والمثبت هنا 513-592هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10361}"
  en: "Ahmad ibn 'Abd al-Rahman ibn Muhammad ibn Sa'd ibn Harith, Abu al-'Abbas al-Lakhmi al-Jayyani al-Qurtubi, Qadi al-Jama'a of Cordoba: a skilled reciter, a critic of recitation, a transmitter of many hadiths, versed in the points of law and its roots, and skilled in many of the ancient sciences, with a keen and quick mind. His works include al-Mashriq fi Islah al-Mantiq and Tanzih al-Quran 'an ma la yaliq bi-al-bayan. The heading prints the dates reversed; this entry reads them as 513 to 592 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10361}"
  fr: "Ahmad ibn 'Abd al-Rahman ibn Muhammad ibn Sa'd ibn Harith, Abu al-'Abbas al-Lakhmi al-Jayyani al-Qurtubi, cadi de la communauté de Cordoue : habile récitant et critique de la récitation, transmetteur de nombreux hadiths, versé dans les questions juridiques et leurs fondements et dans de nombreuses sciences anciennes, à l'esprit vif et rapide. Ses œuvres comprennent al-Mashriq fi Islah al-Mantiq et Tanzih al-Quran 'an ma la yaliq bi-al-bayan. Le titre imprime les dates à l'envers ; cette notice les lit comme 513 à 592 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10361}"
  es: "Ahmad ibn 'Abd al-Rahman ibn Muhammad ibn Sa'd ibn Harith, Abu al-'Abbas al-Lakhmi al-Jayyani al-Qurtubi, Qadi al-Jama'a de Córdoba: un recitador experto, crítico de la recitación, transmisor de numerosos hadices, versado en los puntos de la ley y sus raíces, y experto en muchas de las ciencias antiguas, con una mente aguda y ágil. Entre sus obras se incluyen al-Mashriq fi Islah al-Mantiq y Tanzih al-Quran 'an ma la yaliq bi-al-bayan. El encabezado imprime las fechas al revés; esta entrada las lee como 513 a 592 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10361}"
  ur: "احمد بن عبدالرحمٰن بن محمد بن سعد بن حارث، ابو العباس لقمی الجیانی القرطبی، قادی الجماعۃ قرطبہ: ایک ماہر قاری، قراءت کا نقاد، بہت سی احادیث کی ترسیل کرنے والا، بہت سی حدیثوں کا ماہر، اس کی جڑیں اور اصولوں کا ماہر۔ سائنس، ایک گہری اور تیز دماغ کے ساتھ۔ ان کی تصانیف میں المشرق فی اصلاح المنطق اور تنزیح القرآن ما لا یعلق با البیان شامل ہیں۔ سرخی الٹ تاریخوں کو پرنٹ کرتی ہے۔ اس اندراج میں انہیں 513 تا 592 ہجری لکھا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10360}"
