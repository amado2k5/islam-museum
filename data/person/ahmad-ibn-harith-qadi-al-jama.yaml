label: { ar: "قاضي الجماعة ابن حريث", en: "Qadi al-Jama'a Ibn Harith (Ahmad ibn 'Abd al-Rahman)" }
summary:
  ar: "أحمد بن عبد الرحمن بن محمد بن سعد بن حريث، أبو العباس، اللخمي الجياني القرطبي، قاضي الجماعة، وكان مقرئا مجودا محدثا مكثرا، ذاكرا لمسائل الفقه، عارفا بأصوله، ماهرا في كثير من علوم الأوائل، ثاقب الذهن متوقد الذكاء. من تصانيفه: المشرق في إصلاح المنطق، وتنزيه القرآن عما لا يليق بالبيان. والتاريخ في المدخل (513-592 هـ) مكتوب بترتيب معكوس، والمثبت هنا 513-592هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10361}"
  en: "Ahmad ibn 'Abd al-Rahman ibn Muhammad ibn Sa'd ibn Harith, Abu al-'Abbas al-Lakhmi al-Jayyani al-Qurtubi, Qadi al-Jama'a of Cordoba: a skilled reciter, a critic of recitation, a transmitter of many hadiths, versed in the points of law and its roots, and skilled in many of the ancient sciences, with a keen and quick mind. His works include al-Mashriq fi Islah al-Mantiq and Tanzih al-Quran 'an ma la yaliq bi-al-bayan. The heading prints the dates reversed; this entry reads them as 513 to 592 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10361}"
