summary:
  ar: "الحسن بن مخلد بن الجراح، من بيت الوزراء؛ استُوزر للمعتمد من الغد الذي هلك فيه عبيد الله بن يحيى بن خاقان سنة ثلاث وستين ومائتين، ثم تقدم موسى بن بغا فهرب إلى بغداد واستُوزر مكانه سليمان بن وهب لست خلون من ذي الحجة {cite:muntazam-ibn-al-jawzi p. 120}."
  en: "Draft card for al-Hasan ibn Makhlad ibn al-Jarrah, the tenth-century Abbasid vizier of the Christian Jarrahid house, d. 882; the source entry is not yet checked on the page."
  es: "Ficha de borrador para al-Hasan ibn Makhlad ibn al-Jarrah, visir abasí del siglo X de la casa cristiana Jarrahid, fallecido en 882; la entrada de la fuente aún no se ha comprobado en la página."
  fr: "Fiche d'engagement d'al-Hasan ibn Makhlad ibn al-Jarrah, vizir abbasside du Xe siècle de la maison chrétienne Jarrahid, mort en 882; la source n'est pas encore vérifiée sur la page."
  ur: "دسویں صدی کے عباسی وزیر الحسن بن مخلد ابن الجراح کے لیے ڈرافٹ کارڈ عیسائی جراحد کے گھر، ڈی۔ 882; صفحہ پر ماخذ کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "El-Hasan ibn Mukhlid ibn al-Cerrah, Bakanlar Evi'nden; Ubeyd Allah ibn Yahya ibn Khaqan 263 Hicri yılında öldüğünden itibaren al-Mu'tamid için rehberlik hizmeti aradı. Sonra Musa ibn Bagha ilerledi ve Bağdat'a kaçtı, Süleyman bin Vahb ise Zhu'l-Hicce'nin altı ayının koruyucusu olarak yerini istedi {atıf:muntazam-ibn-al-jawzi, s. 120}."
  id: "Al-Hasan ibn Mukhlid ibn al-Jarrah, dari Dewan Menteri; ia mencari pelayanan bimbingan untuk al-Mu'tamid sejak hari berikutnya, ketika Ubayd Allah ibn Yahya ibn Khaqan wafat pada tahun 263 H. Kemudian Musa ibn Bagha maju dan melarikan diri ke Baghdad, dan Sulayman ibn Wahb mencari posisinya sebagai pelindung enam bulan Dhu al-Hijjah {cite:muntazam-ibn-al-jawzi, hlm. 120}."
