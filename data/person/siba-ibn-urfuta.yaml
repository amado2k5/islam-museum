  ur: "ابن ہشام نے الدراوردی سے اپنے والد سے نقل کیا ہے کہ جب وہ تبوک کے لیے روانہ ہوئے تو نبی نے انہیں مدینہ کا انچارج بنایا - ابن ہشام کے اپنے اس بیان کے خلاف کہ نائب محمد بن مسلمہ تھا۔"
