summary:
  ar: "مقرئ وفقيه ونحوي وكاتب بليغ من أهل تازة بالمغرب، تولى ديوان الإنشاء بفاس في عهد السلطان المريني أبي سعيد، ودرّس القراءات بجامع القرويين، وأثر في علم القراءات بقصيدته «الدرر اللوامع»."
  en: "Maghrebi reader, jurist, grammarian and writer from Taza who headed the chancery at Fez under the Marinid sultan Abu Sa'id, taught readings at the Qarawiyyin, and influenced the science of recitation through his poem al-Durar al-Lawami."
  es: "Lector, jurista, gramático y escritor magrebí de Taza que dirigió la cancillería de Fez bajo el sultán mariní Abu Sa'id, impartió clases de lectura en el Qarawiyyin e influyó en la ciencia de la recitación a través de su poema al-Durar al-Lawami."
  fr: "Lecteur, juriste, grammairien et écrivain maghrébin originaire de Taza, qui dirigea la chancellerie de Fès sous le sultan mérinide Abu Sa'id, enseigna la lecture à la Qarawiyyin et influença la science de la récitation grâce à son poème al-Durar al-Lawami."
  ur: "مغربی قاری، فقیہ، گرامر اور تزہ کے مصنف جنہوں نے مرینیڈ سلطان ابو سعید کے ماتحت فیز میں چانسری کی سربراہی کی، قراویین میں پڑھائی کی تعلیم دی، اور اپنی نظم الدرار اللومی کے ذریعے تلاوت کی سائنس کو متاثر کیا۔"
  tr: "Fas'ın Taza kentinden Kur'an okuyucusu, hukukçu, dilbilgicisi ve etkileyici bir yazar olan Sí, Marinid Sultanı Ebu Said döneminde Fes'te Yazı Diwanı'nın başkanlığını yaptı, El-Karawiyyin Camii'nde Kur'an okumalarını inceledi ve \"Al-Durar Al-Lawami\" adlı şiiriyle Kur'an okuma bilimini etkiledi."
  id: "Sebagai pembaca Al-Quran, ahli hukum, ahli tata bahasa, dan penulis fasih dari Taza di Maroko, ia memimpin Diwan Penulisan di Fez pada masa pemerintahan Sultan Marinid Abu Sa'id, mempelajari bacaan Al-Quran di Masjid Al-Qarawiyyin, dan memengaruhi ilmu pembacaan Al-Qur'an melalui puisinya \"Al-Durar Al-Lawami'.\""
