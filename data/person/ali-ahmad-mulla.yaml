summary:
  ar: "مؤذن المسجد الحرام وشيخ مؤذنيه ⁦(وُلد بمكة 1366هـ)⁩، من أسرة توارثت الأذان في الحرم، بدأ يؤذن فيه صبيًا في الرابعة عشرة وعُيّن رسميًا في 1975 ⁦(وتقول المقالة الإنجليزية 1984)⁩، ولقّبه بعضهم «بلال الحرم»، وكان أول من أذّن للمغرب بعد فك حصار الحرم في 1979."
  en: "Muezzin of the Masjid al-Haram and head of its muezzins (born in Mecca, 1366 AH), from a family that has given the call to prayer at the Haram for generations; he first called the adhan there at fourteen and was formally appointed in 1975 (the English article says 1984). Some call him 'the Bilal of the Haram'; he gave the first sunset adhan after the 1979 siege of the mosque ended."
  fr: "Muezzin de la Masjid al-Haram et chef de ses muezzins (né à La Mecque, 1366 de l’hégire), d'une famille qui a donné l'appel à la prière au Haram depuis des générations ; il a d'abord appelé l'adhan à quatorze ans et a été officiellement nommé en 1975 (l'article anglais dit 1984). Certains l'appellent « le Bilal du Haram » ; il a donné le premier coucher de soleil adhan après la fin du siège de la mosquée en 1979."
  ur: "مسجد حرام کے مؤذن اور شیخ المؤذنین ⁦(پیدائش مکہ، 1366ھ)⁩، ایک ایسے خاندان سے جس میں حرم کی اذان نسل در نسل چلی آئی؛ چودہ برس کی عمر میں پہلی بار وہاں اذان دی اور 1975ء میں باقاعدہ مقرر ہوئے ⁦(انگریزی مضمون 1984ء کہتا ہے)⁩۔ بعض انھیں «بلالِ حرم» کہتے ہیں؛ 1979ء میں حرم کا محاصرہ ختم ہونے کے بعد مغرب کی پہلی اذان انھوں نے دی۔"
  es: "Muecín de la Mezquita Sagrada (Masjid al-Haram) y jefe de sus muecines (nacido en La Meca, 1366 AH), perteneciente a una familia que ha realizado la llamada a la oración en el Haram durante generaciones; realizó la primera llamada a la oración allí a los catorce años y fue nombrado formalmente en 1975 (el artículo en inglés menciona 1984). Algunos lo llaman \"el Bilal del Haram\"; realizó la primera llamada a la oración del atardecer tras el fin del asedio a la mezquita en 1979."
  tr: "Mescidin müezzini ve baş müezzini (1366 Hicri Mekke'de doğdu), Haram'da ezan hakkını miras alan bir aileden geliyordu. On dört yaşında çocukken orada azan etmeye başladı ve 1975'te resmi olarak atandı (İngilizce makalede 1984 denir). Bazıları ona 'Bilal al-Haram' lakabını taktı ve Haram kuşatması 1979'da kaldırıldıktan sonra Magrip'e ilk çağrı yapan oydu."
  id: "Muezzin Masjid Agung dan kepala muezzin (lahir di Mekah 1366 H), berasal dari keluarga yang mewarisi panggilan salat dalam Haram. Ia mulai memanggil adhan di sana saat masih anak laki-laki pada usia empat belas tahun dan secara resmi diangkat pada tahun 1975 (artikel bahasa Inggris mengatakan 1984). Beberapa orang menjulukinya 'Bilal al-Haram,' dan ia adalah yang pertama memanggil Maghrib setelah pengepungan Haram dicabut pada tahun 1979."
