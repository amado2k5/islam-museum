summary:
  ar: "مؤذن المسجد الحرام وشيخ مؤذنيه ⁦(وُلد بمكة 1366هـ)⁩، من أسرة توارثت الأذان في الحرم، بدأ يؤذن فيه صبيًا في الرابعة عشرة وعُيّن رسميًا في 1975 ⁦(وتقول المقالة الإنجليزية 1984)⁩، ولقّبه بعضهم «بلال الحرم»، وكان أول من أذّن للمغرب بعد فك حصار الحرم في 1979."
  en: "Muezzin of the Masjid al-Haram and head of its muezzins (born in Mecca, 1366 AH), from a family that has given the call to prayer at the Haram for generations; he first called the adhan there at fourteen and was formally appointed in 1975 (the English article says 1984). Some call him 'the Bilal of the Haram'; he gave the first sunset adhan after the 1979 siege of the mosque ended."
  ur: "مسجد حرام کے مؤذن اور شیخ المؤذنین ⁦(پیدائش مکہ، 1366ھ)⁩، ایک ایسے خاندان سے جس میں حرم کی اذان نسل در نسل چلی آئی؛ چودہ برس کی عمر میں پہلی بار وہاں اذان دی اور 1975ء میں باقاعدہ مقرر ہوئے ⁦(انگریزی مضمون 1984ء کہتا ہے)⁩۔ بعض انھیں «بلالِ حرم» کہتے ہیں؛ 1979ء میں حرم کا محاصرہ ختم ہونے کے بعد مغرب کی پہلی اذان انھوں نے دی۔"
