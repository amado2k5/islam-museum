summary:
  ar: "\u0645\u0624\u0630\u0646 \u0627\u0644\u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0631\u0627\u0645 \u0648\u0634\u064a\u062e \u0645\u0624\u0630\u0646\u064a\u0647 (\u0648\u064f\u0644\u062f \u0628\u0645\u0643\u0629 1366\u0647\u0640)\u060c \u0645\u0646 \u0623\u0633\u0631\u0629 \u062a\u0648\u0627\u0631\u062b\u062a \u0627\u0644\u0623\u0630\u0627\u0646 \u0641\u064a \u0627\u0644\u062d\u0631\u0645\u060c \u0628\u062f\u0623 \u064a\u0624\u0630\u0646 \u0641\u064a\u0647 \u0635\u0628\u064a\u064b\u0627 \u0641\u064a \u0627\u0644\u0631\u0627\u0628\u0639\u0629 \u0639\u0634\u0631\u0629 \u0648\u0639\u064f\u064a\u0651\u0646 \u0631\u0633\u0645\u064a\u064b\u0627 \u0641\u064a 1975 (\u0648\u062a\u0642\u0648\u0644 \u0627\u0644\u0645\u0642\u0627\u0644\u0629 \u0627\u0644\u0625\u0646\u062c\u0644\u064a\u0632\u064a\u0629 1984)\u060c \u0648\u0644\u0642\u0651\u0628\u0647 \u0628\u0639\u0636\u0647\u0645 \u00ab\u0628\u0644\u0627\u0644 \u0627\u0644\u062d\u0631\u0645\u00bb\u060c \u0648\u0643\u0627\u0646 \u0623\u0648\u0644 \u0645\u0646 \u0623\u0630\u0651\u0646 \u0644\u0644\u0645\u063a\u0631\u0628 \u0628\u0639\u062f \u0641\u0643 \u062d\u0635\u0627\u0631 \u0627\u0644\u062d\u0631\u0645 \u0641\u064a 1979."
  en: "Muezzin of the Masjid al-Haram and head of its muezzins (born in Mecca, 1366 AH), from a family that has given the call to prayer at the Haram for generations; he first called the adhan there at fourteen and was formally appointed in 1975 (the English article says 1984). Some call him 'the Bilal of the Haram'; he gave the first sunset adhan after the 1979 siege of the mosque ended."
  ur: "\u0645\u0633\u062c\u062f \u062d\u0631\u0627\u0645 \u06a9\u06d2 \u0645\u0624\u0630\u0646 \u0627\u0648\u0631 \u0634\u06cc\u062e \u0627\u0644\u0645\u0624\u0630\u0646\u06cc\u0646 (\u067e\u06cc\u062f\u0627\u0626\u0634 \u0645\u06a9\u06c1\u060c 1366\u06be)\u060c \u0627\u06cc\u06a9 \u0627\u06cc\u0633\u06d2 \u062e\u0627\u0646\u062f\u0627\u0646 \u0633\u06d2 \u062c\u0633 \u0645\u06cc\u06ba \u062d\u0631\u0645 \u06a9\u06cc \u0627\u0630\u0627\u0646 \u0646\u0633\u0644 \u062f\u0631 \u0646\u0633\u0644 \u0686\u0644\u06cc \u0622\u0626\u06cc\u061b \u0686\u0648\u062f\u06c1 \u0628\u0631\u0633 \u06a9\u06cc \u0639\u0645\u0631 \u0645\u06cc\u06ba \u067e\u06c1\u0644\u06cc \u0628\u0627\u0631 \u0648\u06c1\u0627\u06ba \u0627\u0630\u0627\u0646 \u062f\u06cc \u0627\u0648\u0631 1975\u0621 \u0645\u06cc\u06ba \u0628\u0627\u0642\u0627\u0639\u062f\u06c1 \u0645\u0642\u0631\u0631 \u06c1\u0648\u0626\u06d2 (\u0627\u0646\u06af\u0631\u06cc\u0632\u06cc \u0645\u0636\u0645\u0648\u0646 1984\u0621 \u06a9\u06c1\u062a\u0627 \u06c1\u06d2)\u06d4 \u0628\u0639\u0636 \u0627\u0646\u06be\u06cc\u06ba \u00ab\u0628\u0644\u0627\u0644\u0650 \u062d\u0631\u0645\u00bb \u06a9\u06c1\u062a\u06d2 \u06c1\u06cc\u06ba\u061b 1979\u0621 \u0645\u06cc\u06ba \u062d\u0631\u0645 \u06a9\u0627 \u0645\u062d\u0627\u0635\u0631\u06c1 \u062e\u062a\u0645 \u06c1\u0648\u0646\u06d2 \u06a9\u06d2 \u0628\u0639\u062f \u0645\u063a\u0631\u0628 \u06a9\u06cc \u067e\u06c1\u0644\u06cc \u0627\u0630\u0627\u0646 \u0627\u0646\u06be\u0648\u06ba \u0646\u06d2 \u062f\u06cc\u06d4"
