id: person/ibn-baqi-al-zahiri
class: person
label: { ar: "ابن بقي الظاهري قاضي مراكش" }
summary:
  ar: "أبو القاسم أحمد بن يزيد بن عبد الرحمن بن أحمد الأموي مولاهم البغوي القرطي ابن بقي؛ قاضي الجماعة، سمع جده أبا الحسن ومحمد بن عبد الحق الخزرجي وأجاز له شريح وجماعة؛ كان ظاهري المذهب مسند أهل المغرب وعالمهم ورئيسهم، ولي القضاء بمراكش مضافاً إلى الغاية العليا وغير ذلك؛ توفي في نصف رمضان سنة خمس وعشرين وستمائة وقد تجاوز ثمانياً وثمانين سنة، وآخر من روى عنه عبد الله بن الحنبلي ببغداد {cite:shadharat-dhahab p. 117}."
  en: "Ibn Baqi — the Cordoban mawla of the Umayyads, qadi al-jama'a of Marrakesh, the last great Zahiri: musnid, scholar and chief of the Maghreb's men of knowledge; he died mid-Ramadan 625 past eighty-eight, the last of his line hearing him at Baghdad {cite:shadharat-dhahab p. 117}."
  es: "Ibn Baqi — el mawla cordobés de los Omeyas, qadi al-jama'a de Marrakech, el último gran zahiri: musnid, erudito y jefe de los hombres de conocimiento del Magreb; murió a mediados del Ramadán de 625, pasados los ochenta y ocho años, siendo el último de su linaje quien lo escuchó en Bagdad {cite:shadharat-dhahab p. 117}."
  fr: "Ibn Baqi — le mawla de Cordoue des Omeyyades, cadi al-jama'a de Marrakech, le dernier grand Zahiri: musnid, érudit et chef des hommes de science du Maghreb; il mourut au milieu du Ramadan 625 à plus de quatre-vingt-huit ans, le dernier de sa lignée à l'avoir entendu à Bagdad {cite: shadharat-dhahab p. 117}."
  ur: "ابن باقی - بنی امیہ کے قرطبی مولا، مراکش کے قاضی الجماعۃ، آخری عظیم ظاہری: مسنید، عالم اور مغرب کے اہل علم کے سربراہ؛ ان کا انتقال رمضان المبارک کے وسط میں 625بجے اٹھاسی کو ہوا، اس کی آخری سطر بغداد میں سنائی دی۔ 117}۔"
  tr: "Ebu el-Kasım Ahmed bin Yezid bin Abdülrahman ibn Ahmed el-Umavi, onların özgür bırakılmış el-Baghawi el-Kurti ibn Baqi; cemaatin yargıcı. Dedesi Ebu el-Hasan ve Muhammed bin Abdülhak el-Hazraci ondan haber almış ve eğitim almasına ve cemaat kurmasına izin vermiştir. O, düşünce okulunun Zahirisi, Mağrip'in ileticisi, alimi ve lideriydi. Marakeş'te yargı görevlerinin yanı sıra en yüksek rütbeler ve diğer görevlerde bulundu. 625 Hile Ramazan ortasında, seksen sekiz yılı aşarak vefat etti. Onun son anlatıcısı Bağdat'tan Abdullah ibn al-Hanbali idi {alıntı:şadharat-dahab, s. 117}."
  id: "Abu al-Qasim Ahmad ibn Yazid ibn Abd al-Rahman ibn Ahmad al-Umawi, mantan mereka al-Baghawi al-Qurti ibn Baqi; seorang hakim komunitas. Kakeknya Abu al-Hasan dan Muhammad ibn Abd al-Haqq al-Khazraji mendengar kabarnya dan mengizinkannya untuk belajar dan berkumpul. Ia adalah Zahiri aliran pemikiran, penyalur Maghreb, ulama mereka, dan pemimpinnya. Ia memegang jabatan yudisial di Marrakesh selain pangkat tertinggi dan urusan lainnya. Ia meninggal pada pertengahan Ramadan tahun 625 H, setelah berusia delapan puluh delapan tahun. Narator terakhir darinya adalah Abdullah ibn al-Hanbali di Baghdad {cite:shadharat-dhahab, hlm. 117}."
