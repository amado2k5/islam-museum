label: { ar: "ابن بقي الظاهري قاضي مراكش" }
summary:
  ar: "أبو القاسم أحمد بن يزيد بن عبد الرحمن بن أحمد الأموي مولاهم البغوي القرطي ابن بقي؛ قاضي الجماعة، سمع جده أبا الحسن ومحمد بن عبد الحق الخزرجي وأجاز له شريح وجماعة؛ كان ظاهري المذهب مسند أهل المغرب وعالمهم ورئيسهم، ولي القضاء بمراكش مضافاً إلى الغاية العليا وغير ذلك؛ توفي في نصف رمضان سنة خمس وعشرين وستمائة وقد تجاوز ثمانياً وثمانين سنة، وآخر من روى عنه عبد الله بن الحنبلي ببغداد {cite:shadharat-dhahab p. 117}."
  en: "Ibn Baqi — the Cordoban mawla of the Umayyads, qadi al-jama'a of Marrakesh, the last great Zahiri: musnid, scholar and chief of the Maghreb's men of knowledge; he died mid-Ramadan 625 past eighty-eight, the last of his line hearing him at Baghdad {cite:shadharat-dhahab p. 117}."
