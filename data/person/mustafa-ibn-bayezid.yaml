  ar: "الأمير مصطفى بن بايزيد الأول؛ أحد أبناء بايزيد الخمسة، ظُنّ أنه قُتل في معركة أنقرة سنة ٨٠٤هـ {cite:dawlat-uthmaniyya-salabi p. 70}. ثم ظهر في عهد ابن أخيه مراد الثاني قائداً لحركة تمرد تدعمها أعداء الدولة، ويذكر الصلابي أن الإمبراطور البيزنطي مانويل الثاني كان خلف دسائسه وأمدّه بالمساعدات حتى حاصر غاليبولي ابتغاء اتخاذها قاعدة له، فقبض عليه السلطان مراد وقدّمه للمشنقة {cite:dawlat-uthmaniyya-salabi p. 79}."
  en: "Prince Mustafa, son of Bayezid I — presumed killed at Ankara in 804, he reappeared under his nephew Murad II at the head of a rising the book says emperor Manuel II financed; he besieged Gallipoli for a base, was captured and hanged {cite:dawlat-uthmaniyya-salabi p. 70, 79}."
issue: { ar: "هل كان مصطفى الظاهر في عهد مراد الثاني هو ابن بايزيد حقاً أم مدّعٍ («مصطفى الكاذب»)؟", en: "Was the Mustafa who rose against Murad II truly Bayezid's son or an impostor ('Düzme Mustafa')?" }
