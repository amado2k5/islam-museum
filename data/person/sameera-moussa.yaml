summary:
  ar: "سميرة موسى ⁦(3 آذار 1917 – آب 1952)⁩ فيزيائية مصرية، أول عالمة ذرة مصرية وأول معيدة في كلية العلوم بجامعة فؤاد الأول ⁦(جامعة القاهرة)⁩؛ أجرت بحوثًا رائدة في الإشعاع المؤيِّن وتطبيقاته الطبية، ونظمت مؤتمر «الذرة من أجل السلام»، وقُتلت في حادث سيارة في الولايات المتحدة سنة 1952 وسط مزاعم اغتيال لم تثبت."
  en: "Sameera Moussa (3 March 1917 – August 1952) was an Egyptian physicist, Egypt's first woman nuclear physicist and the first woman to work at Cairo University; she pioneered research into ionising radiation and its medical uses, organised the Atomic Energy for Peace conference, and was killed in a car crash in the United States in 1952 amid unproven assassination claims."
  ur: "سمیرہ موسیٰ (3 مارچ 1917 – اگست 1952) مصری طبیعیات دان تھیں، مصر کی پہلی خاتون جوہری طبیعیات دان اور قاہرہ یونیورسٹی میں کام کرنے والی پہلی خاتون؛ انھوں نے آئیونائزنگ شعاعوں اور اس کے طبی استعمالات پر ابتدائی تحقیق کی، «ایٹم برائے امن» کانفرنس منعقد کی، اور 1952 میں امریکہ میں کار حادثے میں جاں بحق ہوئیں جس پر قتل کے غیر ثابت شدہ دعوے بھی سامنے آئے۔"
