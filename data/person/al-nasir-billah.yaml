label: { ar: "الناصر لدين الله أحمد بن المستضيء" }
summary:
  ar: "خليفة عباسي [٥٧٥–٦٢٢هـ]، أبو العباس أحمد بن المستضيء، ولد يوم الاثنين عاشر رجب سنة ثلاث وخمسين وخمس مئة وأمه تركية اسمها زمرد، ولم يل الخلافة أحد أطول مدة منه فإنه أقام فيها سبعة وأربعين سنة، وكانت له حيل لطيفة ومكائد غامضة وأصحاب أخبار يوصلون إليه أحوال الملوك الظاهرة والباطنة حتى قال الذهبي قيل إن الناصر كان مخدوماً من الجن، وقال الموفق عبد اللطيف أحيا هيبة الخلافة وكانت قد ماتت بموت المعتصم ثم ماتت بموته وخطب له ببلاد الأندلس وبلاد الصين، وقال ابن واصل كان رديء السيرة في الرعية مائلاً إلى الظلم والعسف وكان يتشيع ويميل إلى مذهب الإمامية بخلاف آبائه حتى إن ابن الجوزي سئل بحضرته من أفضل الناس بعد رسول الله فقال أفضلهم بعده من كانت ابنته تحته، واشتغل في وسط ولايته برواية الحديث وجمع كتاباً سبعين حديثاً وصل إلى حلب وسمعه الناس، وقل بصره في آخر عمره وكانت جارية علمها الخط بنفسه تكتب مثل خطه على التواقيع، وكسر بغير قتال قصد خوارزمشاه بغداد حين وقع الثلج على عسكره بهمدان، ومات يوم الأحد سلخ رمضان سنة اثنتين وعشرين وست مئة {cite:tarikh-khulafa-minhaj-1434 p. 686-690}."
  en: "Abbasid caliph [575–622], longest reign of any — forty-seven years. His web of correspondents reached every court till men said he was served by jinn; al-Muwaffaq: 'he revived the caliphate's awe that died with al-Mu'tasim'. Ibn Wasil's counter-verdict: an unjust sira, lands taken, Imami leanings — Ibn al-Jawzi's diplomatic 'best after the Prophet: he whose daughter lay beneath him'. Mid-reign he took up hadith, a seventy-hadith booklet heard as far as Aleppo; blind at the end, a slave-girl he taught wrote his rescripts. Khwarazmshah's march broke in snow without a battle; he died Sunday at Ramadan's end, 622 {cite:tarikh-khulafa-minhaj-1434 p. 686-690}."
