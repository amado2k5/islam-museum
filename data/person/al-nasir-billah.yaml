id: person/al-nasir-billah
class: person
label:
  ar: الناصر لدين الله أحمد بن المستضيء
  en: al-Nasir li-Din Allah Ahmad ibn al-Mustadi'
  fr: "al-Nasir li-Din Allah Ahmad ibn al-Mustadi'"
  ur: الناصر لدین اللہ احمد بن المستضیء
  es: "al-Nasir li-Din Allah Ahmad ibn al-Mustadi'"
summary:
  ar: خليفة عباسي [٥٧٥–٦٢٢هـ]، أبو العباس أحمد بن المستضيء، ولد يوم الاثنين عاشر رجب سنة ثلاث وخمسين وخمس مئة وأمه تركية اسمها
    زمرد، ولم يل الخلافة أحد أطول مدة منه فإنه أقام فيها سبعة وأربعين سنة، وكانت له حيل لطيفة ومكائد غامضة وأصحاب أخبار يوصلون
    إليه أحوال الملوك الظاهرة والباطنة حتى قال الذهبي قيل إن الناصر كان مخدوماً من الجن، وقال الموفق عبد اللطيف أحيا هيبة
    الخلافة وكانت قد ماتت بموت المعتصم ثم ماتت بموته وخطب له ببلاد الأندلس وبلاد الصين، وقال ابن واصل كان رديء السيرة في الرعية
    مائلاً إلى الظلم والعسف وكان يتشيع ويميل إلى مذهب الإمامية بخلاف آبائه حتى إن ابن الجوزي سئل بحضرته من أفضل الناس بعد
    رسول الله فقال أفضلهم بعده من كانت ابنته تحته، واشتغل في وسط ولايته برواية الحديث وجمع كتاباً سبعين حديثاً وصل إلى حلب
    وسمعه الناس، وقل بصره في آخر عمره وكانت جارية علمها الخط بنفسه تكتب مثل خطه على التواقيع، وكسر بغير قتال قصد خوارزمشاه
    بغداد حين وقع الثلج على عسكره بهمدان، ومات يوم الأحد سلخ رمضان سنة اثنتين وعشرين وست مئة {cite:tarikh-khulafa-minhaj-1434
    p. 686-690}. ويذكر ابن الأثير أنه بقي آخر عمره ثلاث سنين عاطلاً عن الحركة بالكلية قد ذهبت إحدى عينيه، وأصابه دوسنطاريا
    عشرين يوماً ومات، وكان قبيح السيرة في رعيته ظالماً فخرب في أيامه العراق وتفرق أهله وأخذ أملاكهم، وجعل جل همه في رمي البندق
    والطيور المناسيب وسراويلات الفتوة فأبطل الفتوة في البلاد إلا من يلبس منه مئة سراويل ولبسها منه كثير من الملوك، ومنع الرمي
    بالبندق إلا لمن ينتسب إليه فلم يمتثل إلا رجل يقال له ابن السفت فراره من العراق فلما عوتب قال يكفيني فخراً أنه ليس في الدنيا
    أحد إلا رمى للخليفة إلا أنا، ويذكر ابن الأثير أن العجم ينسبون إليه صحيحاً أنه هو الذي أطمع التتر في البلاد وراسلهم في
    ذلك فهو الطامة الكبرى التي يصغر عندها كل ذنب عظيم {cite:kamil-ibn-al-athir p. 452-453}.
  en: 'Abbasid caliph [575–622], longest reign of any — forty-seven years. His web of correspondents reached every court till
    men said he was served by jinn; al-Muwaffaq: ''he revived the caliphate''s awe that died with al-Mu''tasim''. Ibn Wasil''s
    counter-verdict: an unjust sira, lands taken, Imami leanings — Ibn al-Jawzi''s diplomatic ''best after the Prophet: he
    whose daughter lay beneath him''. Mid-reign he took up hadith, a seventy-hadith booklet heard as far as Aleppo; blind
    at the end, a slave-girl he taught wrote his rescripts. Khwarazmshah''s march broke in snow without a battle; he died
    Sunday at Ramadan''s end, 622 {cite:tarikh-khulafa-minhaj-1434 p. 686-690}.'
  fr: "calife abbasside [575-622], le règne le plus long de tous – quarante-sept ans. Son réseau de correspondants a atteint chaque cour jusqu'à ce que les hommes ont dit qu'il était servi par les djinns ; al-Muwaffaq : « il a ressuscité la crainte du califat qui est mort avec al-Mu'tasim ». Le contre-vérdicte d'Ibn Wasil : une sira injuste, des terres prises, des penchants imami - le diplomate d'Ibn al-Jawzi « meilleur après le Prophète : celui dont la fille gisait sous lui ». Au milieu du règne, il prit un hadith, un livret de soixante-dix hadiths entendu jusqu’à Alep  ; aveugle à la fin, une esclave qu’il enseigna écrivit ses rescrits. La marche de Khwarazmshah s'est brisée dans la neige sans bataille ; il est mort dimanche à la fin du Ramadan, 622 {cite:tarikh-khulafa-minhaj-1434 p. 686-690}."
  ur: عباسی خلیفہ، جن کا عہد 575–622ھ پر محیط تھا۔ سیوطی ان کے طویل اقتدار، مختلف درباروں سے رابطوں، حدیث میں دلچسپی اور ان
    کی حکومت کے بارے میں مختلف مؤرخین کی آرا نقل کرتے ہیں۔ {cite:tarikh-khulafa-minhaj-1434 p. 686-690}
  es: "Califa abasí [575–622], el reinado más largo de todos: cuarenta y siete años. Su red de corresponsales llegó a todas las cortes, hasta el punto de que se decía que era servido por genios; al-Muwaffaq: «revivió el respeto al califato que murió con al-Mu'tasim». El veredicto contrario de Ibn Wasil: una sira injusta, tierras tomadas, inclinaciones imamíes; el diplomático Ibn al-Jawzi: «el mejor después del Profeta: aquel cuya hija yacía bajo él». A mediados de su reinado se dedicó al hadiz, un folleto de setenta hadices que llegó hasta Alepo; ciego al final, una esclava a la que enseñó escribió sus rescriptos. La marcha de Khwarazmshah se interrumpió en la nieve sin batalla; murió el domingo al final del Ramadán de 622 {cite:tarikh-khulafa-minhaj-1434 p. 686-690}."
  tr: "Bir Abbasi halifesi [575–622 Hj.], Ebu el-Abbas Ahmed bin Mustadi', 553 Hicri yılının Rajab'ının onuncu Pazartesi günü doğdu ve annesi Türk'tü, adı Zumurrud'du. Halifeliği ondan daha uzun süre elinde tutan olmadı, çünkü orada kırk yedi yıl yaşadı. Gizli hileleri, gizemli planları ve kralların görünen ve gizli durumlarını aktaran güvenilir kaynakları vardı. El-Dhahabi, el-Nasir'in cinlerin hizmetkarı olduğu söylendiğini söyledi. El-Muvaffaq Abd al-Latif, el-Mu'tasim öldükten sonra ölen ve ardından ölen halifeliğin itibarını yeniden canlandırdığını söyledi ölümünden sonra Endülüs ve Çin'de vaazlar verdi. İbn Vesil, halkın arasında kötü davranışlı olduğunu, adaletsizliğe ve zulme eğilimli olduğunu, atalarının aksine Şii olduğunu ve imami mezhebine eğilimli olduğunu söyledi. İbn el-Cavazi'ye huzurunda Allah'ın Elçi'nden sonra en iyi kişiler hakkında soruldu ve şöyle dedi: Onlardan sonra en iyisi kızıydı. Görev süresi boyunca hadis anlatımıyla uğraştı, yetmiş hadis kitabı derledi, bunlar Halep'e ulaştı ve halk tarafından dinlendi. Hayatının ilerleyen yıllarında görme yetisi azaldı. Kendi başına el yazısını öğreten bir köle kızdı, kendi yazısı gibi yazdı İmzaları savaşmadan kırdı ve Hamadan'da ordusuna kar yağdığında Bağdat'taki Harezmşah'a yöneldi; 226 Hicri yılında Ramazan ayında Pazar günü hayatını kaybetti {atıf:Tarikh-khulafa-minhaj-1434 s. 686-690}. İbn al-Athir, hayatının son üç yılında fiziksel olarak hareketsiz kaldığını, tamamen hareketsiz kaldığını, bir gözünü kaybettiğini, yirmi gün boyunca dizanteri çektiğini ve öldüğünü belirtir. Tebaası ve baskıcı arasında kötü davranışlar sergilediği için, onun döneminde Irak yıkıldı, halkı dağıldı ve mülklerine el konuldu. Dikkatinin çoğunu fındık, kuş ve zorbanın pantolonlarını atmaya verdi. Yüz pantolon giyenler dışında topraklarda fibulizmi kaldırdı ve birçok kral pantolon giydi. Ayrıca fındıkla atışı sadece kendisiyle bağlantılı olanlar için yasakladı, bu yüzden sadece İbn adında bir adam itaat etti. Kaçışı için Irak'tan kaçtı ve azarlandığında, 'Bu dünyada benden başka kimsenin olmaması benim için yeterli bir gururdur.' dedi. İbn al-Athir, Arap olmayanların ona gerçek bir şekilde topraklardaki Tatarları arzulayan ve onları bu iş için gönderen kişi olduğunu iddia ettiklerini belirtir; çünkü o, her büyük günahı azaltan en büyük felakettir {cite:kamil-ibn-al-athir s. 452-453}."
  id: "Seorang khalifah Abbasiyah [575–622 H], Abu al-Abbas Ahmad ibn al-Mustadi', lahir pada hari Senin, tanggal sepuluh Rajab tahun 553 H, dan ibunya adalah orang Turki bernama Zumurrud. Tidak ada yang memegang kekhalifahan lebih lama darinya, karena ia tinggal di sana selama empat puluh tujuh tahun. Ia memiliki tipu muslihat halus, skema misterius, dan sumber terpercaya yang menyampaikan kepadanya kondisi nyata dan tersembunyi para raja. Al-Dhahabi mengatakan bahwa al-Nasir adalah pelayan jin. Al-Muwaffaq Abd al-Latif mengatakan ia menghidupkan kembali prestise kekhalifahan, yang telah punah setelah kematian al-Mu'tasim dan kemudian wafat setelah kematiannya, ia menyampaikan khotbah di Andalusia dan Tiongkok. Ibn Wasil mengatakan bahwa ia berperilaku buruk di antara para rakyat, cenderung pada ketidakadilan dan penindasan, dan ia adalah Syiah serta cenderung pada aliran pemikiran Imam, berbeda dengan leluhurnya. Ibn al-Jawzi bahkan pernah ditanya di hadapannya tentang orang-orang terbaik setelah Rasulullah, dan ia berkata: Yang terbaik di antara mereka setelah dia adalah putrinya. Selama masa jabatannya, ia terlibat dalam narasi hadits, menyusun tujuh puluh kitab hadis yang sampai ke Aleppo dan didengar oleh masyarakat. Penglihatannya menurun di tahun-tahun akhir hidupnya. Dia adalah seorang gadis budak yang mengajarkan tulisan tangannya sendiri, menulis seperti aksara miliknya sendiri Ia mematahkan tanda tangan tanpa bertarung dan menuju Khwarezmshah di Baghdad ketika salju turun di pasukannya di Hamadan, dan ia meninggal pada hari Minggu selama Ramadan tahun 226 AH {cite:Tarikh-khulafa-minhaj-1434 hlm. 686-690}. Ibn al-Athir menyebutkan bahwa ia tetap tidak aktif secara fisik selama tiga tahun terakhir hidupnya, benar-benar tidak aktif, kehilangan satu matanya, menderita disentri selama dua puluh hari, dan meninggal. Ia berperilaku buruk di antara rakyatnya dan penindas, sehingga selama masa kekuasaannya Irak dihancurkan, rakyatnya tercerai-berai, dan harta mereka disita. Ia memusatkan sebagian besar perhatiannya pada melempar kacang hazel, burung, dan celana para pengganggu. Ia menghapus fibulisme di negeri kecuali bagi mereka yang mengenakan seratus celana, dan banyak raja memakainya. Ia juga melarang menembak dengan kacang hazel kecuali yang berafiliasi dengannya, sehingga hanya seorang pria bernama Ibn yang mematuhi. Dia melarikan diri dari Irak karena melarikan diri, dan ketika dia dimarahi, dia berkata, 'Sudah cukup kebanggaan bagiku bahwa tidak ada seorang pun di dunia ini selain aku.' Ibn al-Athir menyebutkan bahwa orang non-Arab secara otentik mengaitkan kepadanya bahwa dialah yang menginginkan Tatar di tanah ini dan mengirim mereka tentang hal ini, karena dia adalah bencana terbesar yang mengurangi setiap dosa besar {cite:kamil-ibn-al-athir hlm. 452-453}."
