summary:
  ar: "داعية بريطاني اشتهر بلقب قناته «الفانوس المسلم» (The Muslim Lantern)، يقيم مناظرات وحوارات مع المسيحيين والملحدين وغيرهم في ركن الخطباء بحديقة هايد بارك في لندن، ويبثها على قناته في يوتيوب منذ سنة 2021."
  en: "British Muslim dawah speaker known by his channel name The Muslim Lantern. He debates and talks with Christians, atheists and others at Speakers' Corner in London's Hyde Park, and publishes the conversations on his YouTube channel, launched in 2021."
  ur: "برطانوی مسلمان مبلغ جو اپنے چینل «دی مسلم لالٹین» (The Muslim Lantern) کے نام سے جانے جاتے ہیں۔ وہ لندن کے ہائیڈ پارک کے اسپیکرز کارنر میں عیسائیوں، ملحدوں اور دیگر لوگوں سے مباحثے اور گفتگو کرتے ہیں اور انہیں 2021 سے اپنے یوٹیوب چینل پر نشر کرتے ہیں۔"
  es: "Orador musulmán británico conocido por su canal The Muslim Lantern. Debate y conversa con cristianos, ateos y otras personas en Speakers' Corner, en Hyde Park, Londres, y publica las conversaciones en su canal de YouTube, lanzado en 2021."
  fr: "Ce prédicateur musulman britannique, connu sous le nom de The Muslim Lantern, anime des débats et des discussions avec des chrétiens, des athées et d'autres personnes à Speakers' Corner, dans le parc Hyde de Londres. Il publie ces conversations sur sa chaîne YouTube, lancée en 2021."
  tr: "'The Muslim Lantern' lakabıyla tanınan İngiliz bir vaiz olan Shern, Londra'daki Hyde Park Park'taki Orators' Corner'da Hristiyanlar, ateistler ve diğerleriyle tartışmalar ve diyaloglar düzenliyor ve 2021'den beri bunları YouTube kanalında yayınlıyor."
  id: "Seorang pengkhotbah Inggris yang terkenal dengan julukan salurannya 'The Muslim Lantern,' ia mengadakan debat dan dialog dengan umat Kristen, ateis, dan lainnya di Orators' Corner di Hyde Park Park, London, dan telah menyiarkan mereka di saluran YouTube-nya sejak 2021."
