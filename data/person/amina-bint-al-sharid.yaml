summary:
  en: "An eloquent woman of Ali's partisans whom Mu'awiya imprisoned in Damascus for two years after Ali's killing; when the head of her husband Umar b. al-Humq — the first head carried in Islam — was thrown into her cell she cursed the caliph in famous words, and she died of plague at Homs soon after her release."
  ar: "امرأة فصيحة اللسان حاضرة الجواب من شيعة علي بن أبي طالب؛ حبسها معاوية في سجن دمشق سنتين بعد مقتل علي، فلما أُلقي في حجرها رأس زوجها عمر بن الحمق — وهو أول رأس حُمل في الإسلام — لعنته بكلام خالده، ثم خرجت من سجنهـا بعد أن بذل لها معاوية ما يسكت لسانها، فلم تطمئن فأقامت في الجزيرة حتى قضى عليها الطاعون بحمص."
  es: "Una elocuente mujer partidaria de Ali a quien Mu'awiya encarceló en Damasco durante dos años tras el asesinato de Ali; cuando la cabeza de su esposo Umar b. al-Humq —la primera cabeza que se exhibió en el Islam— fue arrojada a su celda, maldijo al califa con palabras célebres, y murió de peste en Homs poco después de su liberación."
  fr: "Une femme éloquente, partisane d'Ali, que Mu'awiya emprisonna à Damas pendant deux ans après la mort d'Ali; lorsque la tête de son mari Umar b. al-Humq — la première tête portée en Islam — fut jetée dans sa cellule, elle maudit le calife en des termes célèbres, et elle mourut de la peste à Homs peu après sa libération."
  ur: "علی کے حامیوں کی ایک فصیح عورت جسے معاویہ نے علی کے قتل کے بعد دو سال تک دمشق میں قید رکھا۔ جب ان کے شوہر عمر بن الحمق - اسلام میں اٹھائے جانے والے پہلے سر - کو اس کی کوٹھری میں ڈال دیا گیا تھا اس نے مشہور الفاظ میں خلیفہ پر لعنت بھیجی تھی، اور رہائی کے فوراً بعد حمص میں طاعون سے مر گئی۔"
  tr: "Ali bin Ebi Talib'in takipçilerinden hızlıca cevap veren etkileyici bir kadın; Muaviye, Ali'nin ölümünden sonra onu iki yıl boyunca Şam hapishanesinde hapsetti. Kocası Ömer bin el-Hamk—İslam'ın ilk başı olan kişi—kucağına atıldığında, ona Halidah'ın sözleriyle lanet etti, ardından Muaviye dilini susturmak için her şeyi yapınca hapishanesinden serbest bırakıldı. Rahatlamadı ve Homs'taki veba onu yok edene kadar adada kaldı."
  id: "Seorang wanita fasih yang cepat menjawab dari para pengikut Ali ibn Abi Talib; Muawiyah memenjarakannya di penjara Damaskus selama dua tahun setelah kematian Ali. Ketika suaminya Umar ibn al-Hamq—kepala Islam pertama yang diambil di pangkuannya—dilemparkan ke pangkuannya. Dia mengutuknya dengan kata-kata Khalidah, lalu dibebaskan dari penjaranya setelah Muawiya melakukan segala cara untuk membungkam lidahnya. Dia tidak merasa tenang dan tetap tinggal di pulau sampai wabah di Homs memusnahkannya."
