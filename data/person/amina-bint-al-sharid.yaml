summary:
  en: "An eloquent woman of Ali's partisans whom Mu'awiya imprisoned in Damascus for two years after Ali's killing; when the head of her husband Umar b. al-Humq — the first head carried in Islam — was thrown into her cell she cursed the caliph in famous words, and she died of plague at Homs soon after her release."
  ar: "امرأة فصيحة اللسان حاضرة الجواب من شيعة علي بن أبي طالب؛ حبسها معاوية في سجن دمشق سنتين بعد مقتل علي، فلما أُلقي في حجرها رأس زوجها عمر بن الحمق — وهو أول رأس حُمل في الإسلام — لعنته بكلام خالده، ثم خرجت من سجنهـا بعد أن بذل لها معاوية ما يسكت لسانها، فلم تطمئن فأقامت في الجزيرة حتى قضى عليها الطاعون بحمص."
