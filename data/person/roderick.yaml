summary:
  ar: "ملك القوط في الأندلس، ويذكر الكتاب أنه كان مشغولاً بقتال البشكنس حين بلغه الهجوم الإسلامي، فعاد مسرعاً لصده، وأن أبناء غطيشة ومن معهم خذلوه في المعركة، وأنه هلك في وادي لكة على اختلاف الروايات بين الغرق والقتل {cite:salabi-umayyad-state-2020 p.69}."
  tr: "Endülüs'teki Gotların kralı ve kitapta, İslami saldırıyı duyduğunda Basklarla savaşmakla meşgul olduğu ve hızla geri dönüp onu püskürttüğü belirtilir. Ghatisha'nın oğulları ve yoldaşları onu savaşta yenmiş ve farklı anlatımlara göre, boğulup öldürerek Lakka Vadisi'nde ölmüştür {cite:salabi-umayyad-state-2020 s.69}."
  id: "Raja Goth di Andalusia, dan buku menyebutkan bahwa ia sibuk melawan Basque ketika mendengar tentang serangan Islam, sehingga ia segera kembali untuk mengusirnya. Putra-putra Ghatisha dan rekan-rekannya mengalahkannya dalam pertempuran, dan ia tewas di Lembah Lakka, menurut berbagai catatan, antara tenggelam dan membunuh {cite:salabi-umayyad-state-2020 hlm.69}."
