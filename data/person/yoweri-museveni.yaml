summary:
  ar: "سياسي أوغندي وقائد سابق للمتمردين (ولد 1944) صار رئيس أوغندا في 29 يناير 1986 بعد حرب الأدغال، وأعيد انتخابه مرات متتالية كان آخرها انتخابات يناير 2026، فصار من أطول قادة العالم بقاء في الحكم. درس في جامعة دار السلام وأسس جبهة الإنقاذ الوطني ثم الجيش المقاومة الوطني. لم تسمِّ مصادر هذا السجل له انتماء دينيا في نصوصها؛ وتحمل ويكيداتا له قيمتين مسيحيتين (الأنجليكانية والبروتستانتية) على مستوى البيانات المنظمة فقط."
  en: "Ugandan politician and former rebel leader (born 1944) who became president of Uganda on 29 January 1986 after the Bush War and has been re-elected repeatedly, most recently in the January 2026 election, making him one of the world's longest-serving leaders. He studied at the University of Dar es Salaam and founded the Front for National Salvation and then the National Resistance Army. The texts consulted for this record name no religious affiliation for him; Wikidata carries two Christian values for him (Anglicanism and Protestantism) at the structured-data level only."
  ur: "یوگنڈا کے سیاست دان اور سابق باغی رہنما (پیدائش 1944ء) جو جنگِ جھاڑی (بش وار) کے بعد 29 جنوری 1986ء کو یوگنڈا کے صدر بنے اور بار بار منتخب ہوتے رہے، آخری بار جنوری 2026ء کے انتخابات میں، یوں وہ دنیا کے طویل ترین عرصے تک حکمران رہنے والوں میں شامل ہیں۔ انہوں نے جامعہ دارالسلام میں تعلیم پائی اور فرنٹ فار نیشنل سالویشن اور پھر نیشنل ریزسٹنس آرمی کی بنیاد رکھی۔ اس ریکارڈ کے لیے دیکھے گئے مصادر اپنے متن میں ان کا کوئی مذہبی انتماء بیان نہیں کرتے؛ ویکیمیڈیا ڈیٹا (ویکی ڈیٹا) میں ان کے لیے صرف ساختی ڈیٹا کی سطح پر دو مسیحی اقدار (انگلیکانیت اور پروٹسٹنٹ ازم) درج ہیں۔"
