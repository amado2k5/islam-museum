summary:
  ar: "منجوتكين، أمير العزيز بالله الفاطمي؛ حاصر حلب وهزم الروم على العاصي وأحرق نواحي إنطاكية، ونازل حلب ثلاثة عشر شهراً حتى وصل بسيل ملك الروم فانسحب، نحو 382-383هـ."
  en: "Manjutakin, commander of the Fatimid al-Aziz; besieged Aleppo, defeated the Byzantines at the Orontes, burned Antioch's countryside, and pressed the siege thirteen months until King Basil arrived and he withdrew, c. 382-383 AH."
  es: "Manjutakin, comandante del fatimí al-Aziz, sitió Alepo, derrotó a los bizantinos en el Orontes, incendió los alrededores de Antioquía y mantuvo el asedio durante trece meses hasta que el rey Basilio llegó y se retiró, alrededor del año 382-383 de la Hégira."
  fr: "Manjutakin, commandant des Fatimides al-Aziz; assiégea Alep, vainquit les Byzantins à l'Oronte, brûla la campagne d'Antioche et maintint le siège pendant treize mois jusqu'à l'arrivée et le retrait du roi Basile, vers 382-383 AH."
  ur: "منجوتاکین، فاطمی العزیز کے کمانڈر؛ حلب کا محاصرہ کیا، اورونٹس میں بازنطینیوں کو شکست دی، انطاکیہ کے دیہی علاقوں کو جلا دیا، اور محاصرہ کو تیرہ ماہ تک دبایا جب تک کہ بادشاہ باسل کے آنے اور دستبردار نہ ہو گئے۔ 382-383ھ۔"
  tr: "Al-Aziz Billah'ın Fatimi prensi Mangutkin, Halep'i kuşattı, Orontes'te Bizanslıları yendi, Antakya'nın çevresini yaktı ve Halep'te on üç ay kaldı; ta ki Roma kralının seline ulaşana kadar; kral yaklaşık 382-383 Hicri yıllarında geri çekildi."
  id: "Mangutkin, pangeran Fatimiyah dari Al-Aziz Billah, mengepung Aleppo, mengalahkan Bizantium di Orontes, membakar pinggiran Antiokhia, dan tinggal di Aleppo selama tiga belas bulan hingga ia tiba di banjir raja Romawi, yang kemudian mundur sekitar tahun 382-383 H."
