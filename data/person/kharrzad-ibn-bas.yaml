summary:
  ar: "خرزاد بن باس؛ عصى الحجاج ولحق بأيذج وتحصن في قلعة تعرف به فلما طال عليه الحصار نزل مستخفياً يلحق بعبد الملك فظفر به مكرم بن الفرز ومعه درتان في قلنسوته فبعث به إلى الحجاج فضرب عنقه."
  en: "Kharrzad ibn Bas; he defied al-Hajjaj, fortified his castle at Ayadhaj, then slipped the siege for Abd al-Malik — Mukram ibn al-Farz caught him, two dirhams in his cap, and al-Hajjaj beheaded him."
  es: "Kharrzad ibn Bas desafió a al-Hajjaj, fortificó su castillo en Ayadhaj y luego eludió el asedio de Abd al-Malik. Mukram ibn al-Farz lo capturó, con dos dirhams en su gorro, y al-Hajjaj lo decapitó."
  fr: "Kharrzad ibn Bas; il défia al-Hajjaj, fortifia son château à Ayadhaj, puis échappa au siège pour Abd al-Malik — Mukram ibn al-Farz le rattrapa, deux dirhams dans sa casquette, et al-Hajjaj le décapita."
  ur: "خرزاد بن باس؛ اس نے الحجاج کی مخالفت کی، عیاض میں اس کے قلعے کو مضبوط کیا، پھر عبد الملک کے لیے محاصرہ ختم کر دیا - مکرم بن الفرز نے اسے پکڑ لیا، اس کی ٹوپی میں دو درہم تھے، اور الحجاج نے اس کا سر قلم کر دیا۔"
