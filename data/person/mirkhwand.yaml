summary:
  ar: "مؤرخ فارسي نقل عن جامع التواريخ لرشيد الدين فقرات كاملة دون أن يذكر اسمه، بحسب قراءة الخشاب {cite:jami-al-tawarikh-khashshab-1960 p. 128}. وينقل كذلك عن الكتاب في أخبار المغول {cite:jami-al-tawarikh-khashshab-1960 p. 128}، وهو من المؤرخين الذين لم يذكروا الأجزاء الأخيرة من الكتاب {cite:jami-al-tawarikh-khashshab-1960 p. 128}."
  en: "A Persian historian who copied whole passages of Rashid al-Din's Jami' al-Tawarikh without naming him, according to the editor {cite:jami-al-tawarikh-khashshab-1960 p. 128}. He drew on the work for Mongol history {cite:jami-al-tawarikh-khashshab-1960 p. 128} and, in the editor's reading, never mentions its later volumes {cite:jami-al-tawarikh-khashshab-1960 p. 128}."
  es: "Historiador persa que copió pasajes enteros del Jami' al-Tawarikh de Rashid al-Din sin nombrarlo, según el editor {cite:jami-al-tawarikh-khashshab-1960 p. 128}. Se sirvió de la obra para la historia mongol {cite:jami-al-tawarikh-khashshab-1960 p. 128}; según la lectura del editor, no menciona sus volúmenes posteriores {cite:jami-al-tawarikh-khashshab-1960 p. 128}."
  fr: "Historien persan qui recopia des passages entiers du Jami' al-Tawarikh de Rashid al-Din sans le nommer, selon l'éditeur {cite:jami-al-tawarikh-khashshab-1960 p. 128}. Il s'appuie sur l'ouvrage pour l'histoire mongole {cite:jami-al-tawarikh-khashshab-1960 p. 128} ; selon la lecture de l'éditeur, il ne mentionne pas ses volumes ultérieurs {cite:jami-al-tawarikh-khashshab-1960 p. 128}."
  ur: "فارسی مؤرخ جس نے رشید الدین کی جامع التواریخ سے پورے پورے حصے نقل کیے مگر ان کا نام نہیں لیا، مرتب کے مطابق {cite:jami-al-tawarikh-khashshab-1960 p. 128}۔ اس نے منگول تاریخ کے لیے کتاب سے استفادہ کیا {cite:jami-al-tawarikh-khashshab-1960 p. 128}، اور مرتب کی قراءت کے مطابق اس کی بعد کی جلدوں کا ذکر نہیں کرتا {cite:jami-al-tawarikh-khashshab-1960 p. 128}۔"
  tr: "Bir İranlı tarihçi, Khashab okumasına göre {cite:jami-al-tawarikh-khashshab-1960 s. 128} belirtildiği üzere, Rashid al-Din'in Jami'al-Tawarikh-khashshab adlı eserinden tüm paragrafları alıntılamıştır. Ayrıca 'Akhbar al-Maghul' kitabından alıntı yapmaktadır {cite:jami-al-tawarikh-khashshab-1960 s. 128} ve kitabın son bölümlerinden bahsetmeyen tarihçiler arasındadır {cite:jami-al-tawarikh-khashshab-1960 s. 128}."
  id: "Seorang sejarawan Persia mengutip seluruh paragraf dari Jami' al-Tawarikh karya Rashid al-Din tanpa menyebut namanya, menurut bacaan Khashab {cite:jami-al-tawarikh-khashshab-1960 hlm. 128}. Ia juga mengutip dari buku 'Akhbar al-Maghul' {cite:jami-al-tawarikh-khashshab-1960 hlm. 128}, dan ia termasuk sejarawan yang tidak menyebutkan bagian akhir buku {cite:jami-al-tawarikh-khashshab-1960 hlm. 128}."
