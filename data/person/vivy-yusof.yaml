summary:
  ar: "رائدة أعمال وشخصية إعلامية ماليزية وُلدت سنة 1987. شاركت في تأسيس منصة الأزياء فاشن فالت ⁦(FashionValet)⁩ وعلامة الأوشحة ذا داك ⁦(dUCk)⁩، وقدّمت برنامج الواقع «Love Vivy»، قبل أن تلفت قضايا مالية لاحقة للشركة انتباه الرأي العام الماليزي."
  en: "Malaysian entrepreneur and media personality, born in 1987. She co-founded the fashion platform FashionValet and the scarf label dUCk and starred in the reality series Love Vivy; later financial questions around the company drew Malaysian public attention."
  ur: "ملائشی سماجی و کاروباری شخصیت اور انفلوئنسر، 1987ء میں پیدا ہوئیں۔ انھوں نے فیشن پلیٹ فارم FashionValet اور اسکارف برانڈ dUCk کی مشترکہ بنیاد رکھی اور ریئلٹی سیریز Love Vivy میں مرکزی کردار ادا کیا؛ بعد ازاں کمپنی سے جڑے مالی سوالات ملائشی عوامی توجہ کا مرکز بنے۔"
  es: "Empresaria y personalidad mediática malasia, nacida en 1987. Cofundó la plataforma de moda FashionValet y la marca de bufandas dUCk, y protagonizó el reality show Love Vivy; posteriormente, las cuestiones financieras en torno a la empresa atrajeron la atención del público malasio."
  fr: "Entrepreneuse et personnalité médiatique malaisienne, née en 1987. Elle a cofondé la plateforme de mode FashionValet et la marque d'écharpes dUCk et a joué dans la série de téléréalité Love Vivy; par la suite, des questions financières concernant l'entreprise ont attiré l'attention du public malaisien."
  tr: "1987 doğumlu Malezyalı girişimci ve medya kişiliği. Moda platformu FashionValet'i ve atkı markası dUCk'yi kurdu, ayrıca şirketin sonraki finansal sorunları Malezya halkının dikkatini çekmeden önce \"Love Vivy\" adlı reality şovu sundu."
  id: "Pengusaha dan tokoh media Malaysia yang lahir pada tahun 1987. Ia ikut mendirikan platform fashion FashionValet dan merek syal dUCk, serta membawakan acara realitas \"Love Vivy\" sebelum masalah keuangan perusahaan tersebut menarik perhatian publik Malaysia."
