label: { ar: "المعز لدين الله معد بن المنصور" }
summary:
  ar: "رابع ملوك الدولة العبيدية، معد بن المنصور بن القائم، لقب بالمعز لدين الله وصفت له المغرب، أرسل مولاه جوهراً القائد في مئة ألف فارس فملك مصر واختط القاهرة وبنى دار الإمارة المعروفة بالقصرين وقطع خطبة بني العباس ودخل المعز إلى مصر في رمضان سنة اثنين وستين ومعه توابيت آبائه وهو الذي بنى القاهرة {cite:tarikh-khulafa-minhaj-1434 p. 617,620-622}."
  en: "Ma'add ibn al-Mansur, fourth Ubaydid ruler, titled al-Mu'izz li-Din Allah; his mawla Jawhar took Egypt with a hundred thousand horse, laid out Cairo and built the Two Palaces; al-Mu'izz entered Egypt in Ramadan 362 carrying his fathers' coffins — the builder of Cairo {cite:tarikh-khulafa-minhaj-1434 p. 617,620-622}."
