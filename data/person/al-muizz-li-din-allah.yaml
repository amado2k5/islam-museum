id: person/al-muizz-li-din-allah
education:
  did_you_know:
    ar: "المعز لدين الله رابع ملوك العبيديين؛ أرسل مولاه جوهراً القائد في مئة ألف فارس فملك مصر واختط القاهرة وبنى دار الإمارة."
    en: "Al-Mu'izz li-Din Allah, fourth Ubaydi ruler, sent his freedman Jawhar the commander with a hundred thousand horsemen; he took Egypt, laid out al-Qahira and built the emir's palace."
    ur: "معز لدین اللہ، چوتھے عبیدی حکمران، نے اپنے آزاد کردہ غلام جوہر سردار کو ایک لاکھ سواروں کے ساتھ بھیجا؛ اس نے مصر فتح کیا، قاہرہ بسایا اور امارت کا محل بنایا۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/tarikh-ibn-khaldun-ibar]
class: person
label: { ar: "المعز لدين الله معد بن المنصور", en: "al-Mu'izz li-Din Allah Ma'add ibn al-Mansur" }
summary:
  ar: "رابع ملوك الدولة العبيدية، معد بن المنصور بن القائم، لقب بالمعز لدين الله وصفت له المغرب، أرسل مولاه جوهراً القائد في مئة ألف فارس فملك مصر واختط القاهرة وبنى دار الإمارة المعروفة بالقصرين وقطع خطبة بني العباس ودخل المعز إلى مصر في رمضان سنة اثنين وستين ومعه توابيت آبائه وهو الذي بنى القاهرة {cite:tarikh-khulafa-minhaj-1434 p. 617,620-622}، وأقيمت الخطبة والدعوة بالحرمين له في ذي الحجة سنة ثلاث وستين ومات سنة خمس وستين وقام بعده ابنه نزار ولقب العزيز {cite:tarikh-khulafa-minhaj-1434 p. 626-627}. وعند ابن الأثير توفي بمصر سابع عشر ربيع الآخر سنة 365هـ وعمره خمس وأربعون سنة وكان أول الخلفاء العلويين ملك مصر وخرج إليها، وكان يغري بالنجوم ويعمل بأقوال المنجمين وقد عمل سرداباً يحتمي فيه وقت الموت، وستر ابنه العزيز موته حتى عيد النصر فصلى بالناس ودعا لنفسه وعزى بأبيه {cite:kamil-ibn-al-athir p. 487-488}"
  en: "Ma'add ibn al-Mansur, fourth Ubaydid ruler, titled al-Mu'izz li-Din Allah; his mawla Jawhar took Egypt with a hundred thousand horse, laid out Cairo and built the Two Palaces; al-Mu'izz entered Egypt in Ramadan 362 carrying his fathers' coffins — the builder of Cairo {cite:tarikh-khulafa-minhaj-1434 p. 617,620-622}."
