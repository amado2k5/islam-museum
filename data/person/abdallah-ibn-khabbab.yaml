summary:
  ar: "عامل علي على المدائن، ذبحته الخوارج لما اجتمعوا عليها على عبد الله بن وهب الراسبي وبقروا بطن امرأته الحامل وقتلوا غيرها من النساء، وكانت جريمتهم من أسباب مسير علي إلى النهروان {cite:muruj-al-dhahab p. 695}."
  en: "Ali's governor of Mada'in — slaughtered with his pregnant wife's womb split open when the Kharijites mustered under Ibn Wahb, the atrocity that helped bring Ali to Nahrawan {cite:muruj-al-dhahab p. 695}."
  fr: "Gouverneur d'Ali à al-Mada'in — égorgé, le ventre de son épouse enceinte fendu, lorsque les kharijites se rassemblèrent autour d'Ibn Wahb, atrocité qui contribua à mener Ali à Nahrawan {cite:muruj-al-dhahab p. 695}."
  es: "El gobernador de Ali en Mada'in fue asesinado con el vientre de su esposa embarazada abierto cuando los jariyitas se reunieron bajo el mando de Ibn Wahb, la atrocidad que ayudó a llevar a Ali a Nahrawan {cite:muruj-al-dhahab p. 695}."
  ur: "مدین کے گورنر علی نے اپنی حاملہ بیوی کے رحم کے ٹکڑے کے ساتھ ذبح کر دیا جب خوارج ابن وہب کے ماتحت جمع ہوئے، اس ظلم نے علی کو نہروان تک پہنچانے میں مدد کی۔ 695}۔"
  tr: "Ali'nin Medine valisi, Hariciler Abdullah bin Vahb el-Rasibi'ye karşı toplandıklarında öldürüldü. Hamile karısının karnını yarıp diğer kadınları da öldürdüler. Bu suç, Ali'nin Nahravan'a yürüyüşünün sebeplerinden biriydi. {cite:muruj-al-dhahab s. 695}"
  id: "Gubernur Madain pada masa Ali dibunuh oleh kaum Kharijites ketika mereka berkumpul melawan Abdullah bin Wahb al-Rasibi. Mereka merobek perut istrinya yang sedang hamil dan membunuh wanita-wanita lain. Kejahatan mereka adalah salah satu alasan Ali melakukan perjalanan ke Nahrawan. {cite:muruj-al-dhahab p. 695}"
