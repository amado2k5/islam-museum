label: { ar: "أبو يعقوب القراح الهروي", en: "Abu Ya'qub al-Qarrah al-Harawi", fr: "Abu Ya'qub al-Qarrah al-Harawi", es: "Abu Ya'qub al-Qarrah al-Harawi", ur: "ابو یعقوب القرۃ الحروی" }
summary:
  ar: "أبو يعقوب إسحق بن إبراهيم بن محمد السرخسي ثم الهروي القراح، الحافظ محدث هراة؛ روى عن زاهر بن أحمد السرخسي وخلق كثير، وزاد عدد شيوخه على ألف ومائتي نفس وصنف تصانيف كثيرة، وكان زاهداً صالحاً مقلاً من الدنيا، وله سبع وسبعون سنة {cite:shadharat-dhahab p. 244}."
  en: "Abu Ya'qub Ishaq al-Qarrah of Herat — the city's hadith master, who heard from more than twelve hundred shaykhs and composed many works; an ascetic of scant means, he died in 429 aged seventy-seven {cite:shadharat-dhahab p. 244}."
  fr: "Abu Ya'qub Ishaq al-Qarrah de Hérat, maître du hadith de la ville, entendit plus de mille deux cents cheikhs et composa de nombreux ouvrages ; ascète de peu de moyens, il mourut en 429 à soixante-dix-sept ans {cite:shadharat-dhahab p. 244}."
  es: "Abu Ya'qub Ishaq al-Qarrah de Herat — el maestro de hadices de la ciudad, que escuchó a más de mil doscientos shaykhs y compuso muchas obras; un asceta de escasos recursos, murió en 429 a la edad de setenta y siete años {cite:shadharat-dhahab p. 244}."
  ur: "ہرات کے ابو یعقوب اسحاق القراء - شہر کے حدیث کے ماہر، جنہوں نے بارہ سو سے زیادہ شیخوں سے سنا اور بہت سے کام مرتب کیے؛ قلیل اسباب کا ایک سنیاسی، ستر سال کی عمر میں 429 میں وفات پا گیا۔ 244}۔"
