summary:
  ar: "بطاقة أولية لإسحاق بك بن إسحاق باشا، سنجق بكي سكوبية وقائد الحدود العثمانية في القرن الخامس عشر، توفي سنة ١٤٤٤م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ishak Bey ibn Ishak Pasha, the fifteenth-century sanjak-bey of Skopje and Ottoman frontier commander, d. 1444; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Ishak Bey ibn Ishak Pasha, sanjak-bey de Skopje del siglo XV y comandante fronterizo otomano, fallecido en 1444; la entrada de la fuente aún no se ha verificado en la página."
  fr: "Fiche d'engagement d'Ishak Bey ibn Ishak Pasha, sanjak-bey de Skopje au XVe siècle et commandant de la frontière ottomane, mort en 1444; la source n'est pas encore vérifiée sur la page."
  ur: "اسکوپجے کے پندرہویں صدی کے سنجک بے اور عثمانی سرحدی کمانڈر اسحاق بے ابن اسحاق پاشا کے لیے ڈرافٹ کارڈ، ڈی۔ 1444; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Üsküp Sancaq Beyi ve on beşinci yüzyılda Osmanlı sınırlarının komutanı olan İshaq Bey ibn İshak Paşa'nın ön kartı 1444 yılında öldü; Osmanlı tarih kitaplarında anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Ishaq Bey ibn Ishaq Pasha, Sanjak Bey Skopje dan komandan perbatasan Ottoman pada abad kelima belas, meninggal pada tahun 1444 M; ia dikenang dalam buku sejarah Ottoman, dan biografinya belum pernah diulas di halaman."
