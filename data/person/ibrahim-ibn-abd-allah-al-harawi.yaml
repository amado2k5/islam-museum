  ar: "إبراهيم بن عبد الله الهروي"
  en: "Ibrahim ibn Abd Allah al-Harawi"
  es: "Ibrahim ibn Abd Allah al-Harawi"
  fr: "Ibrahim ibn Abd Allah al-Harawi"
  ur: "ابراہیم بن عبد اللہ الحروی"
roles: [scholar, muhaddith]
gender: male
summary:
  ar: "إبراهيم بن عبد الله بن حاتم الهروي، أبو إسحاق، حافظ نزل بغداد، روى عنه الترمذي وابن ماجه وابن أبي الدنيا وجماعة، وكان صالحا زاهدا متعففا دائم الصيام، توفي في رمضان سنة 244 هـ {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 6 p. 22}."
  en: "Ibrahim ibn Abd Allah ibn Hatim al-Harawi, Abu Ishaq, a hadith hafiz who settled in Baghdad; al-Tirmidhi, Ibn Majah and Ibn Abi al-Dunya narrated from him; al-Safadi describes him as upright, ascetic and a continual faster; he died in Ramadan 244 AH {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 6 p. 22}."
  es: "Ibrahim ibn Abd Allah ibn Hatim al-Harawi, Abu Ishaq, un hadiz hafiz que se estableció en Bagdad; al-Tirmidhi, Ibn Majah e Ibn Abi al-Dunya narraron de él; al-Safadi lo describe como íntegro, asceta y un continuo ayunador; murió en Ramadán 244 AH {citar:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 6p. 22}."
  fr: "Ibrahim ibn Abd Allah ibn Hatim al-Harawi, Abu Ishaq, un hafiz hadith installé à Bagdad; al-Tirmidhi, Ibn Majah et Ibn Abi al-Dunya ont rapporté de lui; al-Safadi le décrit comme un homme droit, ascétique et continuellement plus rapide; il est mort pendant le Ramadan 244 AH {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 18h. 22}."
  ur: "ابراہیم بن عبد اللہ بن حاتم الحروی، ابو اسحاق، ایک حدیث حافظ جو بغداد میں آباد ہوئے؛ ترمذی، ابن ماجہ اور ابن ابی الدنیا نے ان سے روایت کی ہے۔ الصفادی نے اسے سیدھے سادھے، سنیاسی اور مسلسل تیز رفتار کے طور پر بیان کیا ہے۔ آپ کی وفات رمضان المبارک 244 ہجری میں ہوئی۔ 6ص۔ 22}۔"
