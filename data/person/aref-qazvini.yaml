summary:
  ar: "شاعر وموسيقي إيراني (1882–1934) اسمه الكامل ابوالقاسم عارف قزوینی، عُرف بـ«شاعر ملی» أي شاعر إيران الوطني؛ كانت تصانيفه الوطنية والسياسية أناشيد الثورة الدستورية، وقضى سنواته الأخيرة فقيرًا في همدان."
  en: "Iranian poet, lyricist and musician (1882-1934), full name Abolqasem Aref Qazvini, known as Iran's 'national poet'; his patriotic and political tasnifs were the songs of the Constitutional Revolution, and he spent his last years in poverty at Hamadan."
