summary:
  ar: "أبو الفضل العباس بن الفرج الرياشي، النحوي اللغوي البصري، عالم راوية ثقة عارف بأيام العرب، روى عن الأصمعي وأبي عبيدة وروى عنه إبراهيم الحربي وابن أبي الدنيا، وقتله الزنج بالبصرة في شوال سنة 257 هـ."
  en: "Abu al-Fadl al-Abbas ibn al-Faraj al-Riyashi, the Basran grammarian and philologist, a reliable transmitter versed in the battle-days of the Arabs, who narrated from al-Asma'i and Abu Ubayda and was narrated from by Ibrahim al-Harbi and Ibn Abi al-Dunya; killed by the Zanj at Basra in Shawwal 257 AH (871 CE)."
  fr: "Abu al-Fadl al-Abbas ibn al-Faraj al-Riyashi, grammairien et philologue de Bassora, transmetteur fiable versé dans les journées de bataille des Arabes, qui transmit d'al-Asma'i et d'Abu Ubayda et de qui transmirent Ibrahim al-Harbi et Ibn Abi al-Dunya ; tué par les Zanj à Bassora en Shawwal 257 H (871 ap. J.-C.)."
  es: "Abu al-Fadl al-Abbas ibn al-Faraj al-Riyashi, el gramático y filólogo de Basora, un transmisor fiable versado en los días de batalla de los árabes, que narró de al-Asma'i y Abu Ubayda y fue narrado por Ibrahim al-Harbi e Ibn Abi al-Dunya; asesinado por los Zanj en Basora en Shawwal 257 AH (871 d. C.)."
  ur: "ابو الفضل العباس ابن الفراج الریاشی، بصری گرامر اور ماہر فلکیات، عربوں کے جنگ کے دنوں میں ایک قابل اعتماد ٹرانسمیٹر، جس نے اسماء اور ابو عبیدہ سے روایت کی ہے اور اسے ابراہیم الحربی اور ابن العبیہ نے روایت کیا ہے۔ شوال 257 ہجری ⁦(871 عیسوی)⁩ میں بصرہ میں زنج کے ہاتھوں قتل ہوا۔"
  tr: "Basra'lı dilbilimci ve gramerci Ebu el-Fadl el-Abbas ibn el-Faraj el-Riyaşi, Arapların tarihini bilen güvenilir bir âlim ve rivayetçiydi. El-Esmaî ve Ebu Ubeyde'den rivayet etmiş, İbrahim el-Harbi ve İbn Abi el-Dünye de ondan rivayet etmiştir. Hicri 257 yılının Şevval ayında Basra'da Zenç tarafından öldürülmüştür."
  id: "Abu al-Fadl al-Abbas ibn al-Faraj al-Riyashi, seorang ahli tata bahasa dan bahasa dari Basra, seorang ulama dan perawi terpercaya yang mengetahui sejarah bangsa Arab. Ia meriwayatkan dari al-Asma’i dan Abu Ubaidah, dan Ibrahim al-Harbi serta Ibn Abi al-Dunya juga meriwayatkan darinya. Ia dibunuh oleh suku Zanj di Basra pada bulan Syawal tahun 257 Hijriah."
