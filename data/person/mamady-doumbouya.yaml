summary:
  ar: "جنرال وسياسي غيني من إقليم كانكان، من شعب الماندينكا، خدم في الفيلق الأجنبي الفرنسي وقاد مجموعة القوات الخاصة الغينية، وقاد انقلاب 5 سبتمبر 2021 الذي أطاح بالرئيس ألفا كوندي فصار رئيسا مؤقتا في 1 أكتوبر 2021، ثم فاز بانتخابات ديسمبر 2025 ونُصّب رئيسا مدنيا خامسا لغينيا في 17 يناير 2026. تاريخ ميلاده متنازع عليه: المقالات تعطي 5 ديسمبر 1984، والسيرة الرسمية للرئاسة الغينية تعطي 4 مارس 1980."
  en: "Guinean general and politician from the Kankan Region, of Mandinka origin, who served in the French Foreign Legion and commanded Guinea's Special Forces Group, led the coup of 5 September 2021 that overthrew President Alpha Condé and became interim president on 1 October 2021, then won the December 2025 election and was inaugurated as Guinea's fifth, civilian president on 17 January 2026. His birth date is disputed: the articles give 5 December 1984, while the Guinean presidency's official biography gives 4 March 1980."
  ur: "گنی جنرل و سیاست دان، کانکان علاقے سے، ماندینکا اصل سے؛ فرانسیسی فارن لیجن میں خدمت کی اور گنی کی اسپیشل فورسز گروپ کی کمان سنبھالی، 5 ستمبر 2021ء کی بغاوت کی قیادت کی جس نے صدر الفا کوندے کو ہٹایا، 1 اکتوبر 2021ء کو عبوری صدر بنے، پھر دسمبر 2025ء کا انتخاب جیت کر 17 جنوری 2026ء کو گنی کے پانچویں، سویلین صدر کے طور پر حلف اٹھایا۔ ان کی تاریخِ پیدائش متنازع ہے۔"
