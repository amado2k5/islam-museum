id: person/abu-abdallah-al-baridi
class: person
label: { ar: "أبو عبد الله أحمد بن محمد البريدي", en: "Abu Abdallah al-Baridi", fr: "Abu Abdallah al-Baridi", es: "Abu Abdallah al-Baridi", ur: "ابو عبداللہ الباریدی" }
summary:
  ar: "كبير إخوته البريديين؛ ضمن الخاصة بالأهواز وأخوه أبو يوسف على سري لما ولى علي بن عيسى الوزارة، فقال لعن الله من يقنع بهذا مالي فإن لطبلي صوتاً سوف يُسمع بعد أيام، فلما وُزّر ابن مقلة بذل له أخوه أبو الحسين عشرين ألف دينار فقلّد أبا عبد الله الأهواز جميعها سوى السوس وجنديسابور وأخاه أبا الحسين الفراتية وأخاهما أبا يوسف الخاصة والإسالة، وقال ابن مكولا البريدي بالباء الموحدة والراء المهملة منسوب إلى البريد وقال ابن مسكويه بالياء المعجمة {cite:kamil-ibn-al-athir p. 137}."
  en: "Eldest of the Baridi brothers; tax-farmer of the khassa who scorned it — 'my drum has a voice that will soon be heard' — and bought his way through Ibn Muqla's vizierate to all of Ahwaz, while Ibn Makula and Ibn Miskawayh disputed the nisba's spelling {cite:kamil-ibn-al-athir p. 137}."
  fr: "L'aîné des frères Baridi ; fermier fiscal de la khassa qui la dédaignait — « mon tambour a une voix qu'on entendra bientôt » — et qui s'acheta, par le vizirat d'Ibn Muqla, tout l'Ahwaz, tandis qu'Ibn Makula et Ibn Miskawayh débattaient de l'orthographe de la nisba {cite:kamil-ibn-al-athir p. 137}."
  es: "El mayor de los hermanos Baridi; recaudador de impuestos de la khassa que la despreció —'mi tambor tiene una voz que pronto será escuchada'— y compró su camino a través del visirato de Ibn Muqla hasta todo Ahwaz, mientras que Ibn Makula e Ibn Miskawayh disputaban la ortografía de la nisba {cite:kamil-ibn-al-athir p. 137}."
  ur: "بریدی بھائیوں میں سب سے بڑا؛ خاصہ کے ٹیکس کاشتکار جس نے اس کی تذلیل کی - 'میرے ڈھول کی آواز ہے جو جلد ہی سنی جائے گی' - اور ابن مقلہ کے وظیفہ کے ذریعے تمام اہواز میں اپنا راستہ خریدا، جب کہ ابن مکلہ اور ابن مسکاوی نے نسبہ کے املا پر اختلاف کیا۔ 137}۔"
  tr: "Kardeşlerinin en büyüğü olan, Ahvaz'ın özel mensupları ve kardeşi Ebu Yusuf Ali Sari'den olan İbn Muqla, Ali bin İsa vekâlete atandığında, \"Allah benim bu paramla yetinenlere lanet etsin, çünkü davulumun sesi birkaç gün sonra duyulacak\" dedi. İbn Muqla vekâlete atandığında, kardeşi Ebu el-Hüseyin ona yirmi bin dinar verdi. Bunun üzerine İbn Muqla, Susa ve Cundişapur hariç tüm Ahvaz'a Ebu Abdullah'ı, özel mensuplara ve Isala'ya ise kardeşi Ebu el-Hüseyin el-Furatiye ve onların kardeşi Ebu Yusuf'u atadı. İbn Muqla, \"Postacı, tek bir ba ve sessiz bir ra ile yazılır, postacıya atfedilir\" dedi. İbn Miskawayh ise, \"Noktalı bir ya ile yazılır\" dedi. {kaynak: Kamil İbn el-Athir s. 137}"
  id: "Kakak tertua dari saudara-saudaranya, para pembawa pos; di antara yang istimewa di Ahwaz dan saudaranya Abu Yusuf Ali Sari, ketika Ali bin Isa menjabat sebagai menteri, ia berkata, “Semoga Allah melaknat siapa pun yang puas dengan uangku ini, karena genderangku memiliki suara yang akan terdengar setelah beberapa hari.” Ketika Ibn Muqla diangkat menjadi menteri, saudaranya Abu al-Husayn memberinya dua puluh ribu dinar, sehingga ia menunjuk Abu Abdullah untuk seluruh Ahwaz kecuali Susa dan Jundishapur, dan saudaranya Abu al-Husayn al-Furatiyah, dan saudara mereka Abu Yusuf untuk yang istimewa dan Isala. Ibn Makula berkata, “Pembawa pos memiliki satu huruf ba dan ra yang senyap, yang dinisbahkan kepada pembawa pos.” Ibn Miskawayh berkata, “Dengan huruf ya yang bertitik.” {kutip:kamil-ibn-al-athir hlm. 137}"
