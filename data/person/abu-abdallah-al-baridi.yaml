id: person/abu-abdallah-al-baridi
class: person
label: { ar: "أبو عبد الله أحمد بن محمد البريدي" }
summary:
  ar: "كبير إخوته البريديين؛ ضمن الخاصة بالأهواز وأخوه أبو يوسف على سري لما ولى علي بن عيسى الوزارة، فقال لعن الله من يقنع بهذا مالي فإن لطبلي صوتاً سوف يُسمع بعد أيام، فلما وُزّر ابن مقلة بذل له أخوه أبو الحسين عشرين ألف دينار فقلّد أبا عبد الله الأهواز جميعها سوى السوس وجنديسابور وأخاه أبا الحسين الفراتية وأخاهما أبا يوسف الخاصة والإسالة، وقال ابن مكولا البريدي بالباء الموحدة والراء المهملة منسوب إلى البريد وقال ابن مسكويه بالياء المعجمة {cite:kamil-ibn-al-athir p. 137}."
  en: "Eldest of the Baridi brothers; tax-farmer of the khassa who scorned it — 'my drum has a voice that will soon be heard' — and bought his way through Ibn Muqla's vizierate to all of Ahwaz, while Ibn Makula and Ibn Miskawayh disputed the nisba's spelling {cite:kamil-ibn-al-athir p. 137}."
