summary:
  ar: "من علماء الأزهر الشريف، ألّف رسالة «أصول التربية والتعليم في القرآن الكريم والسنة النبوية» في مخطوطة بكلية اللغة العربية، وأتمّها سنة 1356هـ/1937م بحسب تحقيق المجمع. يذكر المحقق أنه لم يقف له على ترجمة في المصادر التي اعتمدها سوى أنه كان بكلية اللغة العربية {cite:usul-al-tarbiya-azhar p. 11}."
  en: "A scholar of al-Azhar who wrote the treatise on the principles of education in the Qur'an and the Sunna, preserved as a manuscript at the Faculty of Arabic Language. The editor states that no biography of him was found beyond his association with that faculty (p. 11)."
  es: "Un erudito de al-Azhar que escribió el tratado sobre los principios de la educación en el Corán y la Sunna, conservado como manuscrito en la Facultad de Lengua Árabe. El editor afirma que no se encontró ninguna biografía suya más allá de su vinculación con dicha facultad (p. 11)."
  fr: "Un érudit d'al-Azhar, auteur d'un traité sur les principes de l'éducation dans le Coran et la Sunna, conservé sous forme de manuscrit à la Faculté de langue arabe. L'éditeur précise qu'aucune biographie de lui n'a été retrouvée, hormis son lien avec cette faculté (p. 11)."
  ur: "الازہر کے ایک اسکالر جنہوں نے قرآن و سنت میں تعلیم کے اصولوں پر مقالہ لکھا، فیکلٹی آف عربی لینگویج میں ایک مخطوطہ کے طور پر محفوظ ہے۔ ایڈیٹر کا کہنا ہے کہ اس فیکلٹی کے ساتھ ان کی وابستگی کے علاوہ ان کی کوئی سوانح حیات نہیں ملی ⁦(ص 11)⁩۔"
  tr: "El-Azhar âlimlerinden biri olan bu kişi, Arap Dili Fakültesi'nde bulunan \"Kur'an-ı Kerim ve Peygamber Sünnetinde Eğitimin Temelleri\" adlı eserin yazarıdır. Akademinin araştırmasına göre, bu eseri 1356 Hicri/1937 Miladi yılında tamamlamıştır. Editör, danıştığı kaynaklarda, Arap Dili Fakültesi'ne bağlı olması dışında, kendisiyle ilgili herhangi bir biyografi bulamadığını belirtmektedir. {cite:usul-al-tarbiya-azhar s. 11}"
  id: "Salah satu ulama Al-Azhar, beliau adalah penulis risalah \"Dasar-Dasar Pendidikan dalam Al-Qur'an dan Sunnah Nabi,\" sebuah manuskrip yang tersimpan di Fakultas Bahasa Arab. Menurut penelitian Akademi, beliau menyelesaikannya pada tahun 1356 H/1937 M. Editor mencatat bahwa ia tidak menemukan biografi tentang beliau dalam sumber-sumber yang dikonsultasikan, selain bahwa beliau berafiliasi dengan Fakultas Bahasa Arab {cite:usul-al-tarbiya-azhar hlm. 11}."
