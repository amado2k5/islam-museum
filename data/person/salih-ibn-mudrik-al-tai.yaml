summary:
  ar: "شيخ من طيء خرج على حاج سنة خمس وثمانين ومائتين بالأجفر يوم الأربعاء لاثنتي عشرة ليلة بقين من المحرم، فأخذ الأدوال والتجارات والنساء الحرائر والمماليك، وذُكر أنه أخذ من الناس ألفي ألف دينار {cite:muntazam-ibn-al-jawzi p. 294}."
  en: "A Tayyi' chief who fell on the pilgrim caravan of 285 at al-Ajfar, seizing mounts, goods and captives — said to have taken two million dinars from the pilgrims {cite:muntazam-ibn-al-jawzi p. 294}."
  es: "Un jefe Tayyi' que atacó la caravana de peregrinos de 285 personas en al-Ajfar, apoderándose de monturas, bienes y cautivos; se dice que tomó dos millones de dinares de los peregrinos {cite:muntazam-ibn-al-jawzi p. 294}."
  fr: "Un chef Tayyi' qui s'est attaqué à la caravane de pèlerins de 285 à al-Ajfar, s'emparant de montures, de biens et de captifs — aurait pris deux millions de dinars aux pèlerins {cite:muntazam-ibn-al-jawzi p. 294}."
  ur: "ایک طائی کا سردار جو 285 کے قافلے پر الجفر کے مقام پر گرا، سواریوں، سامان اور قیدیوں کو اپنے قبضے میں لے لیا، کہا کہ اس نے حاجیوں سے بیس لاکھ دینار لیے ہیں۔ 294}۔"
