summary:
  ar: "علي بن محمد بن علي، حميد الدين الضرير، من أهل رامش قرية من أعمال بخارى، من علماء الحنفية، إمام فقيه أصولي محدث متقن، تفقه على شمس الأئمة الكردري، وتفقه عليه حافظ الدين النسفي صاحب الكنز، وانتهت إليه رئاسة العلم بما وراء النهر. من تصانيفه «الفوائد» حاشية على الهداية، و«شرح المنظومة النسفية»، و«شرح الجامع الكبير». توفي سنة 667هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  en: "Ali ibn Muhammad ibn Ali, Hamid al-Din al-Darir, from Ramish, a village in the lands of Bukhara, a Hanafi scholar, a jurist, usuli and careful traditionist. He studied with Shams al-A'imma al-Kurdari, and Hafiz al-Din al-Nasafi, author of al-Kanz, studied with him; the leadership of learning beyond the river came to him. His works include 'al-Fawa'id', glosses on the Hidaya, commentaries on the Nasafi poem and on al-Jami' al-kabir. He died in 667 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  es: "Ali ibn Muhammad ibn Ali, Hamid al-Din al-Darir, originario de Ramish, una aldea en la región de Bujará, fue un erudito hanafí, jurista, usuli y un meticuloso tradicionalista. Estudió con Shams al-A'imma al-Kurdari, y Hafiz al-Din al-Nasafi, autor de al-Kanz, también fue su maestro; el liderazgo del saber más allá del río recayó sobre él. Entre sus obras destacan 'al-Fawa'id', glosas sobre la Hidaya, comentarios sobre el poema nasafi y sobre al-Jami' al-kabir. Falleció en el año 667 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  fr: "Ali ibn Muhammad ibn Ali, dit Hamid al-Din al-Darir, originaire de Ramish, village de la région de Boukhara, était un savant hanafite, juriste, usuli et traditionaliste rigoureux. Il étudia auprès de Shams al-A'imma al-Kurdari et Hafiz al-Din al-Nasafi, auteur d'al-Kanz. Il exerça une influence considérable sur le savoir au-delà du Nil. Parmi ses œuvres figurent al-Fawa'id, des gloses sur la Hidaya, des commentaires sur le poème de Nasafi et sur al-Jami' al-Kabir. Il mourut en 667 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  ur: "علی بن محمد ابن علی، حامد الدین الدار، بخارا کی سرزمین کے ایک گاؤں رامش سے، ایک حنفی عالم، فقیہ، اصولی اور محتاط روایت دان۔ اس نے شمس الائمہ الکرداری سے تعلیم حاصل کی، اور الکنز کے مصنف حافظ الدین النصفی نے ان کے ساتھ تعلیم حاصل کی۔ دریا کے پار سیکھنے کی قیادت اس کے پاس آئی۔ ان کی تصانیف میں 'الفوائد'، ہدایہ پر چمک، نصفی نظم کی تفسیر اور الجامع الکبیر شامل ہیں۔ ان کی وفات 667ھ میں ہوئی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2059}"
  tr: "Buhara'nın ilçesindeki Ramash köyünden Ali bin Muhammed bin Ali, Hamid al-Din al-Darir, Hanefi âlimi, imam, hukukçu, usul ve titiz hadis âlimi olarak, Şems el-İimmah el-Kurdari'nin yanında fıkıh okudu, onun yanında el-Kanz'ın yazarı Hafızdin el-Nasafi'nin yanında eğitim aldı ve nihayetinde nehrin ötesindeki bilginin liderliğini elinde tuttu. Eserleri arasında \"El-Feva'id\" (El-Hidayah üzerine bir tefsir), \"Şerh el-Manzuma el-Nasifiye\" ve \"Şerh el-Cemi' el-Kabir\" bulunmaktadır. 667 Hicri yılında vefat etti. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.2059}"
  id: "Ali ibn Muhammad ibn Ali, Hamid al-Din al-Darir, dari masyarakat Ramash, sebuah desa di distrik Bukhara, seorang ulama Hanafi, imam, ahli hukum, usul, dan ulama hadis yang teliti, mempelajari fiksi di bawah Shams al-A'immah al-Kurdari, belajar di bawah bimbingan Hafiz al-Din al-Nasafi, penulis al-Kanz, dan akhirnya memimpin ilmu pengetahuan di luar sungai. Di antara karyanya adalah \"Al-Fawa'id,\" komentar atas Al-Hidayah, \"Sharh al-Manzuma al-Nasifiyah,\" dan \"Sharh al-Jami' al-Kabir.\" Ia meninggal pada tahun 667 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2059}"
