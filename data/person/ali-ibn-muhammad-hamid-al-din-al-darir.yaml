summary:
  ar: "علي بن محمد بن علي، حميد الدين الضرير، من أهل رامش قرية من أعمال بخارى، من علماء الحنفية، إمام فقيه أصولي محدث متقن، تفقه على شمس الأئمة الكردري، وتفقه عليه حافظ الدين النسفي صاحب الكنز، وانتهت إليه رئاسة العلم بما وراء النهر. من تصانيفه «الفوائد» حاشية على الهداية، و«شرح المنظومة النسفية»، و«شرح الجامع الكبير». توفي سنة 667هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  en: "Ali ibn Muhammad ibn Ali, Hamid al-Din al-Darir, from Ramish, a village in the lands of Bukhara, a Hanafi scholar, a jurist, usuli and careful traditionist. He studied with Shams al-A'imma al-Kurdari, and Hafiz al-Din al-Nasafi, author of al-Kanz, studied with him; the leadership of learning beyond the river came to him. His works include 'al-Fawa'id', glosses on the Hidaya, commentaries on the Nasafi poem and on al-Jami' al-kabir. He died in 667 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
