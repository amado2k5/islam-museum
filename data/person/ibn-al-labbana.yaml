summary:
  ar: "أبو بكر ابن اللبانة الداني الشاعر؛ لم يرِد عند ابن خلكان تاريخ وفاته ولا في الكتب، لكن ورد في كتاب «الخصّة» لأبي الحجاج يوسف البياسي أن ابن اللبانة قدم مراكش في ذي الحجة سنة تسع وثلاثين وأربعمائة ومدح ملكها بأبيات أولها «ملك بروعك في حلى رعياته راقت برونقة صنائع زمانه»؛ ونسب إليه ابن الأبّار بيتان في قصيدة {cite:wafayat-ayan}."
  en: "Ibn al-Labbana — the Andalusi poet of Denia; per al-Bayyasi's Khassa he reached Almoravid Marrakesh in Dhu al-Hijja 439 and praised its king; no death date reached Ibn Khallikan {cite:wafayat-ayan}."
