summary:
  ar: "كان آخر من روى عن أبي سعد ابن أبي عصرون، وسمع من الفضل بن البانياسي ويحيى الثقفي وبنيسابور من منصور الفراوي وبإصبهان من علي بن منصور الثقفي؛ وكان ثقة خيراً نبيلاً به صمم مفرط سمع الناس من لفظه {cite:shadharat-dhahab p. 273}."
  en: "The deaf Ansari (b. 572, d. 22 Safar 654) — last transmitter from Ibn Abi Asrun; so deaf that people heard the hadith only from his own lips {cite:shadharat-dhahab p. 273}."
  es: "El sordo Ansari (n. 572, m. 22 Safar 654) — último transmisor de Ibn Abi Asrun; tan sordo que la gente escuchó el hadiz solo de sus propios labios {cita: shadharat-dhahab p. 273}."
  fr: "Ansari, sourd (né en 572, mort le 22 Safar 654) — dernier transmetteur d'Ibn Abi Asrun; si sourd que les gens n'entendaient le hadith que de ses propres lèvres {cite: shadharat-dhahab p. 273}."
  ur: "بہرہ انصاری ⁦(متوفی 572، وفات 22 صفر 654)⁩ - ابن ابی عصرون سے آخری ٹرانسمیٹر؛ اتنے بہرے کہ لوگ حدیث صرف اس کے اپنے لبوں سے سنتے تھے۔ 273}۔"
  tr: "Ebu Said bin Ebi Asroon'dan son rivayet eden oydu, el-Fadl ibn el-Baniasi, Yahya el-Tekafi ve Banisapur'dan Mansur el-Feravi'den, İsfahan'dan ise Ali bin Mansur el-Tekafi'den dinledi; güvenilir, soylu ve aşırı sağırdı, insanlar onun sözlerini buradan duydular {atıf:shadharat-dhahab, s. 273}."
  id: "Ia adalah yang terakhir menceritakan dari Abu Sa'd ibn Abi Asroon, dan ia mendengar dari al-Fadl ibn al-Baniasi, Yahya al-Thaqafi, dan Banisapur dari Mansur al-Farawi, serta dari Isfahan dari Ali ibn Mansur al-Thaqafi; ia dapat dipercaya, mulia, dan memiliki tuli yang berlebihan, yang membuat orang mendengar kata-katanya {cite:Shadharat-Dhahab, hlm. 273}."
