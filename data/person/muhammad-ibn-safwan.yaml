summary:
  ar: "محمد بن صفوان، أبو مرحب، الأنصاري، صحابي. وقيل صفوان بن محمد، وقال الطبري إن محمد بن صفوان هو الصواب، وقال ابن عبد البر إن صفوان بن محمد أكثر. لم يعرف ابن أبي خيثمة من أي الأنصار هو، وقال العسكري إنه من بني مالك من الأوس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3137}"
  en: "Muhammad ibn Safwan, Abu Marhab, al-Ansari, a Companion. Some give the name as Safwan ibn Muhammad; al-Tabari holds Muhammad ibn Safwan to be correct, and Ibn Abd al-Barr says Safwan ibn Muhammad is the more common form. Ibn Abi Khaythama did not know which Ansari clan he belonged to; al-Askari says he was of Banu Malik of the Aws. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3137}"
