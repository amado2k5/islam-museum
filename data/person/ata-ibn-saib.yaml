summary:
  ar: "عطاء بن السائب بن زيد الثقفي، أبو زيد الكوفي ⁦(ت نحو 136هـ)⁩، من علماء التابعين وقراء الكوفة المجوّدين، تلا على أبي عبد الرحمن السلمي. يذكره الذهبي في «ميزان الاعتدال» مثالاً للثقة الذي تغيّر بأخرة وساء حفظه، فصار النقاد يقبلون ما سمعه منه القدماء كشعبة والثوري وحماد بن زيد، ويتوقفون فيما سمع منه المتأخرون {cite:mizan-itidal-bijawi-v3 p. 70-73}. وهو غير «عطاء بن السائب الخشل» مولى بني الليث الذي يذكره البلاذري في فتح بلخ."
  en: "Ata ibn al-Sa'ib ibn Zayd al-Thaqafi, Abu Zayd of Kufa (d. c. 136 AH), a scholar of the Successors and one of Kufa's skilled Qur'an reciters, who recited to Abu Abd al-Rahman al-Sulami. Al-Dhahabi's Mizan al-I'tidal presents him as the example of a trustworthy man whose memory changed late in life: critics accepted what early students such as Shu'ba, al-Thawri and Hammad ibn Zayd heard from him, and held back on what later students heard. He is not the Ata ibn al-Sa'ib al-Khashl, client of Banu Layth, whom al-Baladhuri mentions at Balkh."
  es: "Ata ibn al-Sa'ib ibn Zayd al-Thaqafi, Abu Zayd de Kufa (fallecido en el año 136 de la Hégira), erudito de los Sucesores y uno de los recitadores más hábiles del Corán en Kufa, recitó a Abu Abd al-Rahman al-Sulami. El Mizan al-I'tidal de Al-Dhahabi lo presenta como ejemplo de un hombre digno de confianza cuya memoria se deterioró en la vejez: los críticos aceptaron lo que los primeros discípulos, como Shu'ba, al-Thawri y Hammad ibn Zayd, oyeron de él, y retuvieron lo que oyeron los discípulos posteriores. No se trata del Ata ibn al-Sa'ib al-Khashl, cliente de Banu Layth, a quien al-Baladhuri menciona en Balkh."
  fr: "Ata ibn al-Sa'ib ibn Zayd al-Thaqafi, Abu Zayd de Koufa (mort en 136 AH), érudit des Successeurs et l'un des récitateurs coraniques les plus habiles de Koufa, récita le Coran à Abu Abd al-Rahman al-Sulami. Al-Dhahabi, dans son ouvrage Mizan al-I'tidal, le présente comme l'exemple d'un homme digne de confiance dont la mémoire s'est altérée avec l'âge: les critiques ont retenu ce que les premiers élèves, tels que Shu'ba, al-Thawri et Hammad ibn Zayd, avaient entendu de lui, et ont écarté ce que les élèves plus tardifs avaient entendu. Il ne s'agit pas d'Ata ibn al-Sa'ib al-Khashl, disciple des Banu Layth, mentionné par al-Baladhuri à Balkh."
  ur: "عطاء بن السائب ابن زید الثقفی، ابو زید آف کوفہ ⁦(م 136ھ)⁩، جانشینوں کے ایک عالم اور کوفہ کے ماہر قرآن قاریوں میں سے ایک، جس نے ابو عبدالرحمٰن السلمی کو تلاوت کی۔ الذہبی کا میزان الاعتدال اسے ایک قابل اعتماد آدمی کی مثال کے طور پر پیش کرتا ہے جس کی یادداشت زندگی کے آخر میں بدل گئی: ناقدین نے اس بات کو قبول کیا جیسے شعبی، الثوری اور حماد بن زید جیسے ابتدائی طالب علموں نے ان سے سنا، اور بعد کے طالب علموں نے جو کچھ سنا اس کو روک دیا۔ وہ بنو لیث کے مؤکل عطا بن السائب الخشال نہیں ہیں، جن کا ذکر البلادوری نے بلخ میں کیا ہے۔"
