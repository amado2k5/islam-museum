summary:
  ar: "عطاء بن السائب بن زيد الثقفي، أبو زيد الكوفي (ت نحو 136هـ)، من علماء التابعين وقراء الكوفة المجوّدين، تلا على أبي عبد الرحمن السلمي. يذكره الذهبي في «ميزان الاعتدال» مثالاً للثقة الذي تغيّر بأخرة وساء حفظه، فصار النقاد يقبلون ما سمعه منه القدماء كشعبة والثوري وحماد بن زيد، ويتوقفون فيما سمع منه المتأخرون {cite:mizan-itidal-bijawi-v3 p. 70-73}. وهو غير «عطاء بن السائب الخشل» مولى بني الليث الذي يذكره البلاذري في فتح بلخ."
  en: "Ata ibn al-Sa'ib ibn Zayd al-Thaqafi, Abu Zayd of Kufa (d. c. 136 AH), a scholar of the Successors and one of Kufa's skilled Qur'an reciters, who recited to Abu Abd al-Rahman al-Sulami. Al-Dhahabi's Mizan al-I'tidal presents him as the example of a trustworthy man whose memory changed late in life: critics accepted what early students such as Shu'ba, al-Thawri and Hammad ibn Zayd heard from him, and held back on what later students heard. He is not the Ata ibn al-Sa'ib al-Khashl, client of Banu Layth, whom al-Baladhuri mentions at Balkh."
died: { hijri: "0136", edtf: "0753", calendar: julian, precision: year, status: tradition, derived: true, note: "الذهبي: بقي إلى سنة ست وثلاثين ومائة، فيكون قد شارف مائة سنة {cite:mizan-itidal-bijawi-v3 p. 71}؛ التحويل مشتق.", sources: [source/mizan-itidal-bijawi-v3] }
