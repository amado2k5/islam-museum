    summary:
      ar: "أحمد: ثقة ثقة رجل صالح، من سمع منه قديماً فصحيح ومن سمع حديثاً لم يكن بشيء؛ البخاري: أحاديثه القديمة صحيحة؛ أبو حاتم: محله الصدق قبل أن يخلط؛ النسائي: ثقة في حديثه القديم، ورواية شعبة والثوري وحماد بن زيد عنه جيدة."
      en: "Ahmad: trustworthy, trustworthy, a righteous man; who heard from him early has sound reports, who heard late has nothing; al-Bukhari: his early hadiths are sound; Abu Hatim: his place is truthfulness before he became confused; al-Nasa'i: trustworthy in his early hadith, and the narration of Shu'ba, al-Thawri and Hammad ibn Zayd from him is good."
