summary:
  ar: "إبراهيم بن عقبة بن أبي عياش المدني، مولى آل الزبير بن العوام، تابعي من شيوخ مالك، أخو موسى ومحمد ابني عقبة؛ سمع أم خالد بنت خالد بن سعيد وسعيد بن المسيب وعروة وكريباً، وروى عنه مالك والثوري وابن عيينة وغيرهم، ووصفه ابن عبد البر بأنه ثقة حجة فيما نقل {cite:tamhid-furqan-2017-v1 p. 258-259}."
  en: "Ibrahim b. 'Uqba b. Abi 'Ayyash of Medina, client of the family of al-Zubayr b. al-'Awwam, a Successor and one of Malik's teachers, brother of Musa and Muhammad b. 'Uqba; he heard Umm Khalid bint Khalid b. Sa'id, Sa'id b. al-Musayyab, 'Urwa and Kurayb, and Malik, al-Thawri, Ibn 'Uyayna and others transmitted from him; Ibn 'Abd al-Barr calls him trustworthy and an authority in what he transmitted {cite:tamhid-furqan-2017-v1 p. 258-259}."
  ur: "ابراہیم بن عقبہ بن ابی عیاش مدنی، آلِ زبیر بن عوام کے مولیٰ، تابعی اور امام مالک کے شیوخ میں سے، موسیٰ اور محمد بن عقبہ کے بھائی؛ انہوں نے ام خالد بنت خالد بن سعید، سعید بن مسیب، عروہ اور کریب سے سنا، اور ان سے مالک، ثوری، ابن عیینہ وغیرہ نے روایت کی؛ ابن عبد البر انہیں ثقہ اور اپنی نقل میں حجت کہتے ہیں {cite:tamhid-furqan-2017-v1 p. 258-259}۔"
