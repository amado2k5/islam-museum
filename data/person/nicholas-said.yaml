summary:
  ar: "رحّالة وكاتب كانوري وُلد باسم محمد علي بن سعيد في كوكاوا بإمبراطورية بورنو نحو سنة 1836، وهو ابن الجنرال باركا غانا. استُعبد صبيا ونُقل عبر الصحراء إلى طرابلس، ثم خدم أسيادا عثمانيين والأمير الروسي منشيكوف، واعتنق المسيحية الأرثوذكسية بعماد في ريغا سنة 1855 واتخذ اسم نيكولاس. أتقن لغات كثيرة وجاب خمس قارات، ثم هاجر إلى الولايات المتحدة وخدم رقيبا في فوج ماساتشوستس الخامس والخمسين أثناء الحرب الأهلية، وكتب سيرته الذاتية."
  en: "A Kanuri traveller and author born Mohammed Ali ben Said in Kukawa in the Bornu Empire about 1836, the son of the general Barca Gana. Enslaved as a boy and carried across the Sahara to Tripoli, he served Ottoman masters and then the Russian prince Menshikov, was baptised an Orthodox Christian at Riga in 1855 and took the name Nicholas. He mastered many languages and travelled on five continents, then emigrated to the United States, served as a sergeant in the 55th Massachusetts Infantry during the Civil War, and wrote his autobiography."
  ur: "کانوری سیاح اور مصنف، جو محمد علی بن سعید کے نام سے تقریباً 1836 میں سلطنتِ بورنو کے کوکاوا میں پیدا ہوئے اور جنرل بارکا گانا کے بیٹے تھے۔ لڑکپن میں غلام بنا کر صحارا پار طرابلس لے جائے گئے، عثمانی آقاؤں اور پھر روسی شہزادے منشیکوف کی خدمت کی، 1855 میں ریگا میں بپتسمہ لے کر آرتھوڈوکس مسیحی ہوئے اور نکولس نام اختیار کیا۔ انہوں نے کئی زبانیں سیکھیں، پانچ براعظموں کا سفر کیا، پھر امریکا ہجرت کی، خانہ جنگی میں 55ویں میساچوسٹس رجمنٹ میں سارجنٹ رہے اور اپنی خودنوشت لکھی۔"
