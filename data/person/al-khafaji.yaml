label: { ar: "الخفاجي أخو المستنصر", en: "al-Khafaji, brother of al-Mustansir", es: "al-Khafaji, brother of al-Mustansir", fr: "al-Khafaji, brother of al-Mustansir", ur: "الخفاجی، المستنصر کے بھائی" }
summary:
  ar: "أخو المستنصر بالله فيه شهامة زائدة وكان يقول لئن وليت لأعبرن بالعساكر نهر جيحون وآخذ البلاد من أيدي التتار وأستأصلهم فلما مات المستنصر لم ير الدويدار ولا الشرابي تقليده خوفاً منه وأقاما ابنه أحمد للينه وضعف رأيه ليكون لهما الأمر {cite:tarikh-khulafa-minhaj-1434 p. 703}."
  en: "Al-Mustansir's fierce brother who vowed 'let me rule and I will cross the Jayhun and root out the Tatars' — the duwaydar and sharabi feared him and raised the soft Ahmad instead {cite:tarikh-khulafa-minhaj-1434 p. 703}."
  es: "El feroz hermano de Al-Mustansir, que juró \"déjenme gobernar y cruzaré el Jayhun y erradicaré a los tártaros\", el duwaydar y el sharabi le temieron y en su lugar criaron al dócil Ahmad {cite:tarikh-khulafa-minhaj-1434 p. 703}."
  fr: "Le frère féroce d'Al-Mustansir qui a juré « laissez-moi régner et je traverserai le Jayhun et déracinerai les Tatars » — le duwaydar et le sharabi le craignaient et ont élevé le doux Ahmad à sa place {cite:tarikh-khulafa-minhaj-1434 p. 703}."
  ur: "المستنصر کا سخت بھائی جس نے عہد کیا تھا کہ 'مجھے حکومت کرنے دو اور میں جیہون کو عبور کر کے تاتاریوں کو جڑ سے اکھاڑ پھینکوں گا' - دویدار اور شرابی نے اس سے ڈرتے ہوئے اس کے بجائے نرم احمد کو اٹھایا {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 703}۔"
