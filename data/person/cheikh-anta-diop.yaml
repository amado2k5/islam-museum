summary:
  ar: "مؤرخ وعالِم فيزياء وأنثروبولوجيا سنغالي، وُلد في تييتو سنة 1923 في أسرة مسلمة من الطريقة المريدية، ودرس في باريس، ودافع بأعماله عن الأصل الأفريقي للحضارة المصرية القديمة، وأسّس مختبرًا للتأريخ بالكربون المشع في داكار، وتوفي سنة 1986."
  en: "Senegalese historian, physicist and anthropologist, born at Thieytou in 1923 into a Muslim family of the Mouride brotherhood. Trained in Paris, he argued in his works for the African origin of ancient Egyptian civilisation and founded a radiocarbon dating laboratory at Dakar. He died in 1986."
  ur: "سینیگالی مؤرخ، طبیعیات دان اور ماہرِ بشریات، جو 1923 میں تیئیتو میں مریدی سلسلے کے ایک مسلم گھرانے میں پیدا ہوئے۔ پیرس میں تعلیم پائی، اپنی تصانیف میں قدیم مصری تہذیب کی افریقی اصل کا دفاع کیا، اور ڈاکار میں ریڈیو کاربن تاریخ کاری کی تجربہ گاہ قائم کی۔ 1986 میں وفات پائی۔"
