summary:
  ar: "مؤرخ وعالِم فيزياء وأنثروبولوجيا سنغالي، وُلد في تييتو سنة 1923 في أسرة مسلمة من الطريقة المريدية، ودرس في باريس، ودافع بأعماله عن الأصل الأفريقي للحضارة المصرية القديمة، وأسّس مختبرًا للتأريخ بالكربون المشع في داكار، وتوفي سنة 1986."
  en: "Senegalese historian, physicist and anthropologist, born at Thieytou in 1923 into a Muslim family of the Mouride brotherhood. Trained in Paris, he argued in his works for the African origin of ancient Egyptian civilisation and founded a radiocarbon dating laboratory at Dakar. He died in 1986."
  ur: "سینیگالی مؤرخ، طبیعیات دان اور ماہرِ بشریات، جو 1923 میں تیئیتو میں مریدی سلسلے کے ایک مسلم گھرانے میں پیدا ہوئے۔ پیرس میں تعلیم پائی، اپنی تصانیف میں قدیم مصری تہذیب کی افریقی اصل کا دفاع کیا، اور ڈاکار میں ریڈیو کاربن تاریخ کاری کی تجربہ گاہ قائم کی۔ 1986 میں وفات پائی۔"
  es: "Historiador, físico y antropólogo senegalés, nacido en Thieytou en 1923 en el seno de una familia musulmana perteneciente a la hermandad Mouride. Formado en París, defendió en sus obras el origen africano de la antigua civilización egipcia y fundó un laboratorio de datación por radiocarbono en Dakar. Falleció en 1986."
  fr: "Historien, physicien et anthropologue sénégalais, né à Thieytou en 1923 dans une famille musulmane de la confrérie des Mourides. Formé à Paris, il défendit dans ses travaux l'origine africaine de la civilisation égyptienne antique et fonda un laboratoire de datation au radiocarbone à Dakar. Il mourut en 1986."
  tr: "1923'te Tito'da Muridi tarikatına mensup Müslüman bir ailede doğan Senegalli tarihçi, fizikçi ve antropolog, Paris'te eğitim gördü ve eserleriyle antik Mısır uygarlığının Afrika kökenini savundu. Dakar'da bir radyokarbon tarihleme laboratuvarı kurdu ve 1986'da vefat etti."
  id: "Seorang sejarawan, fisikawan, dan antropolog Senegal, lahir di Tito pada tahun 1923 dalam keluarga Muslim ordo Muridi, belajar di Paris, dan membela asal-usul Afrika dari peradaban Mesir kuno melalui karya-karyanya. Ia mendirikan laboratorium penanggalan radiokarbon di Dakar dan meninggal pada tahun 1986."
