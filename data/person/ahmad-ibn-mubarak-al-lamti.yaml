summary:
  ar: "أبو العباس أحمد بن مبارك السجلماسي اللمطي (1679 – 1743)، فقيه مالكي مغربي من سجلماسة، انتقل مع أسرته إلى فاس سنة 1698 فدرس على خمسة من شيوخ القرويين ونال الإجازة، ثم لزم الشيخ عبد العزيز الدباغ تلميذًا وملازمًا، فجمع كلامه بعد وفاته في كتاب «الإبريز من كلام سيدي عبد العزيز الدباغ» الذي صار من أشهر كتب المناقب الصوفية وانتقل أثره إلى إندونيسيا. له مصنفات في الأصول والفقه، ومات بفاس ودُفن بباب الفتوح بجوار شيخه."
  en: "Abu al-Abbas Ahmad ibn Mubarak al-Sijilmasi al-Lamti (1679 – 1743) was a Moroccan Maliki jurist from Sijilmasa who moved with his family to Fez in 1698, studied under five scholars of al-Qarawiyyin and received his ijaza, then became the disciple and close companion of the Sufi master Abd al-Aziz al-Dabbagh, whose lectures he compiled after the master's death into the al-Ibriz, one of the most widely read works of Sufi hagiography, later influential as far as Indonesia. He wrote further works on legal theory and jurisprudence, died at Fez, and was buried at Bab al-Futuh beside his teacher."
  ur: "ابو العباس احمد بن مبارک السجلماسی اللمطی (1679ء – 1743ء) سجلماسہ سے تعلق رکھنے والے مغربی مالکی فقیہ تھے؛ 1698ء میں خاندان سمیت فاس منتقل ہوئے، قرویین کے پانچ شیوخ سے پڑھا اور اجازہ پایا، پھر صوفی شیخ عبد العزیز الدباغ کے شاگرد و مصاحب بنے اور ان کی وفات کے بعد ان کے اقوال کو «الابریز» میں جمع کیا، جو صوفی مناقب کی مشہور ترین کتابوں میں شمار ہوتی ہے اور جس کا اثر انڈونیشیا تک پہنچا۔ اصول و فقہ میں بھی تصانیف چھوڑیں؛ فاس میں وفات پائی اور باب الفتوح میں اپنے شیخ کے پہلو میں دفن ہوئے۔"

