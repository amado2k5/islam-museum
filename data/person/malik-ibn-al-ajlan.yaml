summary:
  ar: "مالك بن العجلان السالمي الخزرجي، قاتل الفطيون اليهودي؛ لما زُفت أخته وأخبرته أنها تدخل على الفطيون قبل زوجها دخل عليه فقتله، ثم هرب إلى الشام فألجأ أبا جبيلة الخزرجي إلى قسمه ألا يمس طيباً حتى يذل يهود يثرب، فكان قتله أول غلبة الأنصار على المدينة {cite:kamil-ibn-al-athir p. 487-488}."
  en: "Malik ibn al-Ajlan al-Khazraji: when his sister confessed she must enter al-Fityawn's chamber before her bridegroom's, he killed the Jewish tyrant and fled to Syria — the act that set Abu Jubayla's purge in motion and ended Jewish supremacy at Yathrib {cite:kamil-ibn-al-athir p. 487-488}."
  es: "Malik ibn al-Ajlan al-Khazraji: cuando su hermana confesó que debía entrar en la cámara de al-Fityawn antes que en la de su prometido, mató al tirano judío y huyó a Siria, acto que puso en marcha la purga de Abu Jubayla y acabó con la supremacía judía en Yathrib {cite:kamil-ibn-al-athir p. 487-488}."
  fr: "Malik ibn al-Ajlan al-Khazraji: lorsque sa sœur lui a avoué qu'elle devait entrer dans la chambre d'al-Fityawn avant celle de son fiancé, il a tué le tyran juif et s'est enfui en Syrie — l'acte qui a déclenché la purge d'Abu Jubayla et mis fin à la suprématie juive à Yathrib {cite:kamil-ibn-al-athir p. 487-488}."
