summary:
  ar: "مهاجم سعودي معتزل ومدرّب لاحق، وُلد في الرياض سنة 1972. قضى مسيرته مع الهلال (1989–2007) مع إعارة قصيرة إلى وولفرهامبتون واندررز سنة 2000، وخاض 156 مباراة دولية سجل فيها 46 هدفًا، وشارك في أربع كؤوس عالم (1994–2006) وسجل في ثلاث منها. بعد اعتزاله درّب الهلال والشباب، وقدّم برنامجًا حواريًا تلفزيونيًا."
  en: "Saudi Arabian former professional footballer (forward) and later manager, born in Riyadh in 1972. He spent his career at Al-Hilal (1989–2007) with a short loan at Wolverhampton Wanderers in 2000, won 156 caps and scored 46 goals for Saudi Arabia, and played at four FIFA World Cups (1994–2006), scoring at three of them. After retiring he managed Al-Hilal and Al-Shabab and presented a television talk show."
  ur: "سعودی سابق پیشہ ور فٹبالر (فارورڈ) اور بعد ازاں مینیجر، 1972 میں ریاض میں پیدا ہوئے۔ انہوں نے اپنا کیریئر الہلال میں گزارا (1989–2007) جس میں 2000 میں وولور ہیمپٹن وانڈررز کو مختصر قرض بھی شامل تھا؛ سعودی عرب کے لیے 156 میچوں میں 46 گول کیے اور چار فیفا ورلڈ کپ (1994–2006) کھیلے جن میں سے تین میں گول کیا۔ ریٹائرمنٹ کے بعد انہوں نے الہلال اور الشباب کی کوچنگ کی اور ایک ٹیلی ویژن ٹاک شو کی میزبانی بھی کی۔"
