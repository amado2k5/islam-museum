summary:
  ar: "مهاجم سعودي معتزل ومدرّب لاحق، وُلد في الرياض سنة 1972. قضى مسيرته مع الهلال (1989–2007) مع إعارة قصيرة إلى وولفرهامبتون واندررز سنة 2000، وخاض 156 مباراة دولية سجل فيها 46 هدفًا، وشارك في أربع كؤوس عالم (1994–2006) وسجل في ثلاث منها. بعد اعتزاله درّب الهلال والشباب، وقدّم برنامجًا حواريًا تلفزيونيًا."
  en: "Saudi Arabian former professional footballer (forward) and later manager, born in Riyadh in 1972. He spent his career at Al-Hilal (1989–2007) with a short loan at Wolverhampton Wanderers in 2000, won 156 caps and scored 46 goals for Saudi Arabia, and played at four FIFA World Cups (1994–2006), scoring at three of them. After retiring he managed Al-Hilal and Al-Shabab and presented a television talk show."
  ur: "سعودی سابق پیشہ ور فٹبالر ⁦(فارورڈ)⁩ اور بعد ازاں مینیجر، 1972 میں ریاض میں پیدا ہوئے۔ انہوں نے اپنا کیریئر الہلال میں گزارا (1989–2007) جس میں 2000 میں وولور ہیمپٹن وانڈررز کو مختصر قرض بھی شامل تھا؛ سعودی عرب کے لیے 156 میچوں میں 46 گول کیے اور چار فیفا ورلڈ کپ (1994–2006) کھیلے جن میں سے تین میں گول کیا۔ ریٹائرمنٹ کے بعد انہوں نے الہلال اور الشباب کی کوچنگ کی اور ایک ٹیلی ویژن ٹاک شو کی میزبانی بھی کی۔"
  es: "Exfutbolista profesional saudí (delantero) y posteriormente entrenador, nacido en Riad en 1972. Desarrolló su carrera en el Al-Hilal (1989-2007), con una breve cesión al Wolverhampton Wanderers en 2000. Fue internacional con Arabia Saudí en 156 ocasiones, anotando 46 goles, y participó en cuatro Copas Mundiales de la FIFA (1994-2006), marcando en tres de ellas. Tras su retiro, dirigió al Al-Hilal y al Al-Shabab, además de presentar un programa de entrevistas en televisión."
  fr: "Ancien footballeur professionnel saoudien (attaquant) devenu entraîneur, né à Riyad en 1972. Il a évolué à Al-Hilal (1989-2007), avec un court prêt à Wolverhampton Wanderers en 2000. International saoudien à 156 reprises, il a inscrit 46 buts et participé à quatre Coupes du monde de la FIFA (1994-2006), marquant lors de trois d'entre elles. Après sa retraite de footballeur, il a entraîné Al-Hilal et Al-Shabab et animé une émission de télévision."
  tr: "Emekli bir Suudi forvet ve daha sonra antrenör olan Swen, 1972'de Riyad'da doğdu. Kariyerini Al Hilal'de (1989–2007) 2000 yılında kısa süreli bir kiralık olarak Wolverhampton Wanderers'a geçirdi; 156 uluslararası maçta oynadı, 46 gol attı, dört Dünya Kupası'na (1994–2006) katıldı ve bunların üçünde gol attı. Emekli olduktan sonra Al Hilal ve Al Shabab takımlarını çalıştırdı ve bir televizyon sohbet programı sundu."
  id: "Seorang striker Saudi yang sudah pensiun dan kemudian menjadi pelatih, ia lahir di Riyadh pada tahun 1972. Ia menghabiskan kariernya bersama Al Hilal (1989–2007) dengan status pinjaman singkat ke Wolverhampton Wanderers pada tahun 2000, bermain dalam 156 pertandingan internasional dan mencetak 46 gol, serta berpartisipasi di empat Piala Dunia (1994–2006), mencetak gol di tiga di antaranya. Setelah pensiun, ia melatih Al Hilal dan Al Shabab serta membawakan acara bincang-bincang televisi."
