id: person/ibn-naghrila
class: person
label: { ar: "ابن نغريلة", en: "Ibn Naghrila (Samuel ha-Nagid)", ur: "ابن نغریلہ" }
names: ["Ismail ibn Naghrila", "Samuel ha-Nagid", "Samuel Ibn Nagrello", "Ibn al-Naghralla", "Ibn Nagrella"]
summary:
  ar: "ابن نغريلة، ويسميه المقال الإنجليزي صموئيل ها-ناغيد، وزير يهودي في غرناطة الزيرية، تذكره دائرة المعارف الإسلامية أشهر وزراء الطوائف اليهود وتؤرخ وفاته بسنة 448هـ/1056-7م. أعاد بناء حصن الحمراء الأول بين 443 و447هـ/1052-1056م، وخلفه في الوزارة ابنه يوسف، ودار بينه وبين ابن حزم جدل، وقد ظلت سيرته في الدائرة مبثوثة في مقالات أخرى لا في ترجمة مستقلة {cite:encyclopaedia-of-islam-2 vol. 11 p. 199}."
  en: "Ibn Naghrila, called Samuel ha-Nagid in Hebrew sources, was the Jewish vizier of Zirid Granada, named by the Encyclopaedia of Islam as the most famous Jewish vizier of the taifa period, with his death given as 448/1056-7. He rebuilt the early fortress of the Alhambra between 443/1052 and 447/1056, was succeeded in office by his son Joseph, and was the target of a polemic by Ibn Hazm. The Encyclopaedia has no entry of its own for him; what it says is scattered through other articles {cite:encyclopaedia-of-islam-2 vol. 11 p. 199}."
  ur: "ابن نغریلہ، جنہیں عبرانی ماخذ میں صموئیل ہا-ناگید کہا جاتا ہے، زیری غرناطہ کے یہودی وزیر تھے۔ دائرۃ المعارف الاسلامیہ انہیں ملوک الطوائف کے دور کا سب سے مشہور یہودی وزیر کہتی ہے اور ان کی وفات 448ھ/1056-7ء بتاتی ہے۔ انہوں نے 443ھ/1052ء اور 447ھ/1056ء کے درمیان الحمراء کے ابتدائی قلعے کی تعمیرِ نو کی، ان کے بعد ان کے بیٹے یوسف اس منصب پر آئے، اور ابن حزم نے ان کے ساتھ مناظرہ کیا۔ دائرے میں ان کے لیے الگ مضمون نہیں، جو کچھ ہے وہ دوسرے مضامین میں بکھرا ہوا ہے {cite:encyclopaedia-of-islam-2 vol. 11 p. 199}."
