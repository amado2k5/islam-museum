kids:
  ar: "ابن نغريلة وزير في غرناطة قبل نحو ألف سنة، وكان يكتب الشعر ويبني حصناً صار أصل قصر الحمراء."
  en: "Ibn Naghrila was a minister in Granada about a thousand years ago, who wrote poetry and rebuilt a fortress on the hill where the Alhambra later stood."
