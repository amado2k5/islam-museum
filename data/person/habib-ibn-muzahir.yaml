roles: [military]
gender: male
summary:
  ar: "حبيب بن مظهر، أو مظاهر، بن رئاب الأسدي الكندي ثم الفقعسي، تابعي من القواد الشجعان، نزل الكوفة وصحب علي بن أبي طالب في حروبه، وكان على ميسرة الحسين يوم كربلاء وقتل معه سنة 61 هـ."
  en: "Habib ibn Muzahir (also written Muzhir or Mutahhir) ibn Ri'ab al-Asadi al-Kindi al-Faq'asi, a Tabi'i and brave commander who settled in Kufa and accompanied Ali ibn Abi Talib in his wars; he commanded the left wing of al-Husayn at Karbala at the age of seventy-five and was killed there in 61 AH (680)."
  es: "Habib ibn Muzahir (también escrito Muzhir o Mutahhir) ibn Ri'ab al-Asadi al-Kindi al-Faq'asi, un Tabi'i y valiente comandante que se estableció en Kufa y acompañó a Ali ibn Abi Talib en sus guerras; comandó el ala izquierda de al-Husayn en Karbala a la edad de setenta y cinco años y murió allí en el año 61 AH (680)."
  fr: "Habib ibn Muzahir (également écrit Muzhir ou Mutahhir) ibn Ri'ab al-Asadi al-Kindi al-Faq'asi, un Tabi'i et un commandant courageux qui s'est installé à Kufa et a accompagné Ali ibn Abi Talib dans ses guerres; il commandait l'aile gauche d'al-Husayn à Karbala à l'âge de soixante-quinze ans et y a été tué en 61 AH (680)."
  ur: "حبیب ابن مظاہر ⁦(جسے مظہر یا مطاہر بھی لکھا جاتا ہے)⁩ ابن ریاض الاسدی الکندی الفقاسی، ایک تابعی اور بہادر سپہ سالار جو کوفہ میں آباد ہوا اور جنگوں میں علی ابن ابی طالب کا ساتھ دیا۔ اس نے 75 سال کی عمر میں کربلا میں حسین کے بائیں بازو کی کمان کی اور وہیں 61 ہجری (680) میں قتل ہوا۔"
