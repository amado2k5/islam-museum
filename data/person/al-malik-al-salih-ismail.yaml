id: person/al-malik-al-salih-ismail
class: person
label: { ar: "الملك الصالح إسماعيل بن نور الدين", en: "al-Malik al-Salih Isma'il ibn Nur al-Din", fr: "al-Malik al-Salih Isma'il ibn Nur al-Din" , ur: "ملک صالح اسماعیل بن نور الدین", es: "al-Malik al-Salih Isma'il ibn Nur al-Din"}
summary:
  ar: "ابن نور الدين محمود بن زنكي، خلفه صبياً لما مات سنة تسع وستين فتحركت الفرنج بالسواحل فصولحوا بمال وهودنوا {cite:tarikh-khulafa-minhaj-1434 p. 684}، وصار بعدها صاحب حلب، وتوفي بها في رجب سنة سبع وسبعين وعمره نحو تسع عشرة سنة؛ ولما اشتد مرضه وصف له الأطباء شرب الخمر للتداوي فأبى حتى يستفتي الفقهاء، فأفتاه فقيه بجوازه فقال له: أرأيت إن قدّر الله قرب الأجل أيؤخره شرب الخمر؟ فقال لا، فقال: والله لا لقيت الله وقد استعملت ما حرم عليّ، ولم يشربه؛ ولما أيس من نفسه أحضر الأمراء والأجناد ووصاهم بتسليم البلد إلى ابن عمه عز الدين مسعود صاحب الموصل دون زوج أخته عماد الدين صاحب سنجار، وعلل ذلك بأن عماد الدين لا يقدر على حفظها من صلاح الدين وعز الدين يقدر، ووصفه ابن الأثير بأنه كان حليماً كريماً عفيف اليد والفرج واللسان ملازماً للدين عادلاً في رعيته {cite:kamil-ibn-al-athir p. 106-107}."
  en: "Nur al-Din's boy-heir at Damascus in 569; the Franks stirred on the coasts and were bought off with money {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  fr: "Encore enfant, il succéda à Nur al-Din à Damas en 569. Les Francs s’agitèrent sur le littoral, et on les apaisa par un versement d’argent {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  ur: "نور الدین کے کم سن وارث، جنہیں ۵۶۹ھ میں دمشق کی حکومت ملی؛ ان کے دور میں شام کی سیاست اور حلب کی جانشینی کے تنازعات نمایاں تھے۔ {cite:tarikh-khulafa-minhaj-1434}"
  es: "El joven heredero de Nur al-Din en Damasco en 569; los francos se agitaron en las costas y fueron sobornados con dinero {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  tr: "İbn Nur al-Din Mahmoud ibn Zangi, 69. yılda öldüğünde çocuk olarak miras aldı. Franklar kıyılar boyunca hareket etti, böylece parayla barıştılar ve barış yaptılar {atıf:History-Khulafa-minhaj-1434, s. 684}. Daha sonra Halep'in hükümdarı oldu ve yaklaşık on dokuz yaşında, yetmiş yedi yılın Recep'inde orada öldü. Hastalığı kötüleştiğinde, doktorlar ona tedavi için şarap içmesini önerdi, ancak dini bir karar isteyene kadar kabul etmedi. Bir fıhikçi ona izin veren bir fetva çıkardı ve şöyle dedi: Eğer Allah ölümün yakın olduğunu buyurursa, şarap içmek onu geciktirir mi? O da şöyle cevap verdi: Hayır. Allah'a yemin ederim, bana yasak olanı kullanırken Allah'la karşılaşmadım ve o da içmedi. Kendinden umutsuzluğa kapıldığında, prensleri ve askerleri getirdi ve şehri, kayınbiraderi İmaddin'e, Sincar hükümdarı İmaddin'e değil, kuzeni Musul hükümdarı İzzeddin Mes'ud'a teslim etmelerini emretti. Bunu, İmam el-Din'in Salah-Din'den koruyamadığını, ancak İzzeddin'in koruyabildiğini söyleyerek açıkladı. İbn el-Athir onu hoşgörülü, cömert, iffetli, dine bağlı ve tebaasının arasında adil biri olarak tanımladı {atı: kamil-ibn-a-athir s. 106-107}."
  id: "Ibn Nur al-Din Mahmoud ibn Zangi, ia digantikan saat masih anak-anak ketika meninggal pada tahun enam puluh sembilan. Bangsa Frank bergerak di sepanjang pantai, sehingga mereka berdamai dengan uang dan berdamai {cite:History-Khulafa-minhaj-1434, hlm. 684}. Ia kemudian menjadi penguasa Aleppo dan meninggal di sana di Rajab pada tahun tujuh puluh tujuh pada usia sekitar sembilan belas tahun. Ketika penyakitnya memburuk, dokter meresepkannya minum anggur untuk pengobatan, tetapi ia menolak sampai ia mengajukan keputusan agama. Seorang ahli hukum mengeluarkan fatwa yang mengizinkannya dan berkata: Jika Tuhan memerintahkan kematian sudah dekat, apakah minum anggur akan menundanya? Ia menjawab: Tidak. Demi Tuhan, aku tidak bertemu Tuhan saat menggunakan apa yang dilarang bagiku, dan Ia tidak meminumnya. Ketika ia putus asa, ia membawa para pangeran dan prajurit dan memerintahkan mereka untuk menyerahkan kota itu kepada sepupunya Izz al-Din Mas'ud, penguasa Mosul, bukan kepada saudara iparnya, Imad al-Din, penguasa Sinjar. Ia menjelaskan hal ini dengan mengatakan bahwa Imad al-Din tidak dapat melindunginya dari Salah al-Din, tetapi Izz al-Din bisa. Ibn al-Athir menggambarkannya sebagai sosok yang pemurah, murah hati, suci, dan berbicara dengan baik, berpegang pada agama dan adil di antara rakyatnya {cite:kamil-ibn-al-athir hlm. 106-107}."
