id: person/al-malik-al-salih-ismail
class: person
label: { ar: "الملك الصالح إسماعيل بن نور الدين" }
summary:
  ar: "ابن نور الدين محمود بن زنكي، خلفه صبياً لما مات سنة تسع وستين فتحركت الفرنج بالسواحل فصولحوا بمال وهودنوا {cite:tarikh-khulafa-minhaj-1434 p. 684}، وصار بعدها صاحب حلب، وتوفي بها في رجب سنة سبع وسبعين وعمره نحو تسع عشرة سنة؛ ولما اشتد مرضه وصف له الأطباء شرب الخمر للتداوي فأبى حتى يستفتي الفقهاء، فأفتاه فقيه بجوازه فقال له: أرأيت إن قدّر الله قرب الأجل أيؤخره شرب الخمر؟ فقال لا، فقال: والله لا لقيت الله وقد استعملت ما حرم عليّ، ولم يشربه؛ ولما أيس من نفسه أحضر الأمراء والأجناد ووصاهم بتسليم البلد إلى ابن عمه عز الدين مسعود صاحب الموصل دون زوج أخته عماد الدين صاحب سنجار، وعلل ذلك بأن عماد الدين لا يقدر على حفظها من صلاح الدين وعز الدين يقدر، ووصفه ابن الأثير بأنه كان حليماً كريماً عفيف اليد والفرج واللسان ملازماً للدين عادلاً في رعيته {cite:kamil-ibn-al-athir p. 106-107}."
  en: "Nur al-Din's boy-heir at Damascus in 569; the Franks stirred on the coasts and were bought off with money {cite:tarikh-khulafa-minhaj-1434 p. 684}."
