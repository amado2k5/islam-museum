label:
  ar: "القاضي أبو عبد الله الصيمري الحنفي"
  en: "al-Saymari, Abu Abdallah al-Husayn ibn Ali"
  fr: "al-Saymari, Abu Abdallah al-Husayn ibn Ali"
  es: "al-Saymari, Abu Abdallah al-Husayn ibn Ali"
  ur: "السمری، ابو عبداللہ الحسین ابن علی"
names:
  - { value: "الحسين بن علي الصيمري أبو عبد الله", kind: full }
summary:
  ar: "قاضي بغداد الحنفي، نسبة إلى نهر من أنهار البصرة يقال له الصيمر عليه قرى؛ ولد سنة إحدى وخمسين وثلاثمائة، وكان أحد الفقهاء المذكورين من العراقيين حسن العبارة جيد النظر، ولى قضاء المدائن ثم القضاء بربع الكرخ، وحدّث عن أبي بكر المفيد وابن شاذان وابن شاهين، وكان صدوقًا وافر العقل جميل المعاشرة عارفًا بحقوق العلماء. كتب في فتنة لقب «ملك الملوك» سنة ٤٢٩ يجيز إطلاقها لجواز تفاضل ملوك الأرض. توفي في شوال سنة ست وثلاثين وأربعمائة ودُفن في داره بدرب الزرادين {cite:muntazam-ibn-al-jawzi j.8 p.439,461}."
  en: "The Hanafi qadi of Baghdad — born 351, a jurist of fine expression and sound reasoning who judged al-Mada'in then the Karkh quarter; among the jurists who permitted the 'malik al-muluk' laqab in 429. Died Shawwal 436, buried in his house at Darb al-Zaradin {cite:muntazam-ibn-al-jawzi j.8 p.439,461}."
  fr: "Les Hanafites de Bagdad – nés en 351, un juriste d’expression fine et de bon raisonnement qui a jugé al-Mada’in alors le quartier Karkh  ; parmi les juristes qui ont permis le laqab « malik al-muluk  » en 429. Décédé Shawwal 436, enterré dans sa maison à Darb al-Zaradi {cite:muntazam-ibn-al-jawzi j.8 p.439,461}."
  es: "El cadí hanafí de Bagdad, nacido en 351, fue un jurista de bella expresión y razonamiento sólido que juzgó al-Mada'in, entonces el barrio de Karkh; uno de los juristas que permitieron el laqab 'malik al-muluk' en 429. Murió en Shawwal de 436 y fue enterrado en su casa en Darb al-Zaradin {cite:muntazam-ibn-al-jawzi j.8 p.439,461}."
  ur: "بغداد کے حنفی قاضی - 351 میں پیدا ہوئے، ایک عمدہ بیان اور صحیح استدلال کے فقیہ تھے جنہوں نے المدائن پھر کرخ کوارٹر کا فیصلہ کیا۔ فقہاء میں سے جنہوں نے 429 میں 'ملک الملوک' لقب کی اجازت دی۔ شوال 436 میں وفات ہوئی، دارب الزارادین میں اپنے گھر میں دفن ہوئے۔"
  tr: "Bağdat'ın Hanefi yargıcı, Basra'da köyleri olan El-Seymir adlı bir nehirden adını alır; 351 Hicri yılında doğmuş, yukarıda bahsedilen Iraklı hukukçulardan biri, hitabet konusunda yetenekli ve iyi bir anlayışa sahipti. Şehirlerde yargıçlık yaptı, ardından Rabi' al-Karkh'ta yargıç olarak görev yaptı. Ebu Bekir el-Mufid, İbn Şadhan ve İbn Şahin'den rivayet etti. Doğru, zeki, terbiyeli ve alimlerin hakları konusunda bilgiliydi. 429 yılındaki Fitna'da 'Kralların Kralı' unvanını yazdı ve bu unvanı yeryüzü krallarının üstünlüğünü sağlamak için kullandı. 436 Hicri yılında Şavval'da öldü ve Darb al-Zeredin'deki evine defnedildi {alıntı::] Muntazam-ibn-al-Jawzi j.8 s.439,461}."
  id: "Hakim Hanafi Baghdad, dinamai dari sebuah sungai di Basra bernama Al-Saymir, yang memiliki desa; lahir pada tahun 351 H, ia adalah salah satu ahli hukum Irak yang telah disebutkan sebelumnya, fasih berbicara dan memiliki wawasan yang baik. Ia menjabat sebagai hakim di kota-kota dan kemudian sebagai hakim di Rabi' al-Karkh. Ia menceritakan dari Abu Bakr al-Mufid, Ibn Shadhan, dan Ibn Shaheen. Ia adalah sosok yang jujur, cerdas, sopan, dan berpengetahuan tentang hak-hak para ulama. Ia menulis dalam Fitna tahun 429 M gelar 'Raja segala Raja' yang memungkinkan penggunaannya untuk memberikan keunggulan raja-raja dunia. Ia meninggal di Shawwal pada tahun 436 H dan dimakamkan di rumahnya di Darb al-Zaradidin {cite:muntazam-ibn-al-jawzi j.8 hlm.439,461}."
