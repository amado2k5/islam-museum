label:
  ar: "القاضي أبو عبد الله الصيمري الحنفي"
  en: "al-Saymari, Abu Abdallah al-Husayn ibn Ali"
names:
  - { value: "الحسين بن علي الصيمري أبو عبد الله", kind: full }
summary:
  ar: "قاضي بغداد الحنفي، نسبة إلى نهر من أنهار البصرة يقال له الصيمر عليه قرى؛ ولد سنة إحدى وخمسين وثلاثمائة، وكان أحد الفقهاء المذكورين من العراقيين حسن العبارة جيد النظر، ولى قضاء المدائن ثم القضاء بربع الكرخ، وحدّث عن أبي بكر المفيد وابن شاذان وابن شاهين، وكان صدوقًا وافر العقل جميل المعاشرة عارفًا بحقوق العلماء. كتب في فتنة لقب «ملك الملوك» سنة ٤٢٩ يجيز إطلاقها لجواز تفاضل ملوك الأرض. توفي في شوال سنة ست وثلاثين وأربعمائة ودُفن في داره بدرب الزرادين {cite:muntazam-ibn-al-jawzi j.8 p.439,461}."
  en: "The Hanafi qadi of Baghdad — born 351, a jurist of fine expression and sound reasoning who judged al-Mada'in then the Karkh quarter; among the jurists who permitted the 'malik al-muluk' laqab in 429. Died Shawwal 436, buried in his house at Darb al-Zaradin {cite:muntazam-ibn-al-jawzi j.8 p.439,461}."
