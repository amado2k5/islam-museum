summary:
  en: "One of the three chief poets of the Prophet from the Ansar (Banu Salama of Khazraj); he witnessed the Second Pledge of al-Aqaba, fought in the early campaigns, defended the community with his eloquent verses at Hunayn, and was later one of the three whose repentance at Tabuk was accepted. وحديثه عن تخلفه عن تبوك من أطول أخبار الصحيح وأشهرها {cite:sahih-al-bukhari 4418}."
  ar: "شاعر رسول الله وأحد فرسان الأنصار من بني سلمة من الخزرج؛ شهد العقبة الثانية والمشاهد، ونافح عن الإسلام بقصائده في حنين ومسير الطائف، وهو أحد الثلاثة الذين خُلّفوا في تبوك فتيب عليهم."
