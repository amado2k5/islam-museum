summary:
  en: "One of the three chief poets of the Prophet from the Ansar (Banu Salama of Khazraj); he witnessed the Second Pledge of al-Aqaba, fought in the early campaigns, defended the community with his eloquent verses at Hunayn, and was later one of the three whose repentance at Tabuk was accepted. وحديثه عن تخلفه عن تبوك من أطول أخبار الصحيح وأشهرها {cite:sahih-al-bukhari 4418}."
  ar: "شاعر رسول الله وأحد فرسان الأنصار من بني سلمة من الخزرج؛ شهد العقبة الثانية والمشاهد، ونافح عن الإسلام بقصائده في حنين ومسير الطائف، وهو أحد الثلاثة الذين خُلّفوا في تبوك فتيب عليهم."
  ur: "خزرج کے بنو سلمہ سے انصاری شاعر؛ بیعت عقبہ ثانیہ اور ابتدائی مہمات میں شریک ہوئے۔ تبوک سے پیچھے رہنے والے ان تین افراد میں تھے جن کی توبہ قبول ہونے کا ذکر ان کی روایت میں آیا ہے۔ {cite:sahih-al-bukhari 4418}"
  es: "Uno de los tres principales poetas del Profeta de Ansar (Banu Salama de Khazraj); fue testigo del Segundo Juramento de al-Aqaba, luchó en las primeras campañas, defendió a la comunidad con sus elocuentes versos en Hunayn y más tarde fue uno de los tres cuyo arrepentimiento en Tabuk fue aceptado. وحديثه عن تخلفه عن تبوك من أطول أخبار الصحيح وأشهرها {cita:sahih-al-bukhari 4418}."
  fr: "L'un des trois principaux poètes du Prophète des Ansar (Banu Salama de Khazraj); il fut témoin du deuxième serment d'al-Aqaba, combattit lors des premières campagnes, défendit la communauté avec ses vers éloquents à Hunayn et fut plus tard l'un des trois dont le repentir à Tabuk fut accepté. وحديثه عن تخلفه عن تبوك من أطول أخبار الصحيح وأشهرها {cite: sahih-al-bukhari 4418}."
  tr: "Allah'ın Elçisi şairi ve Khazraj'dan Banu Salama'dan Ensar şövalyelerinden biri; İkinci Akabe ve El-Maşah Savaşı'na tanıklık etti, Hunayn ve Taif Yolculuğu'nda şiirleriyle İslam'ı savundu ve Tabuk'tan ayrılıp onlara tövbe eden üç kişiden biriydi."
  id: "Penyair Rasul Allah dan salah satu ksatria Ansar dari Banu Salama dari Khazraj; ia menyaksikan Aqaba Kedua dan Pertempuran Al-Mashah, membela Islam dengan puisinya di Hunayn dan Perjalanan Taif, dan merupakan salah satu dari tiga orang yang meninggalkan Tabuk dan bertobat kepada mereka."
