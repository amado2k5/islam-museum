summary:
  ar: "أحمد بن محمد الخلوتي، الشهير بالصاوي، فقيه مالكي، أخذ عن الدردير والدسوقي، ونسبته إلى «صاء الحجر» في الغربية بمصر، وتوفي بالمدينة المنورة. من مؤلفاته حاشية على تفسير الجلالين، وحاشية على شرح الدردير لأقرب المسالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  en: "Ahmad ibn Muhammad al-Khalwati, known as al-Sawi, a Maliki jurist who studied with al-Dardir and al-Dasuqi. His nisba refers to Sa' al-Hajar in the Gharbiyya province of Egypt. He died in Medina. His works include a gloss on the Jalalayn commentary and a gloss on al-Dardir's commentary on Aqrab al-masalik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  fr: "Ahmad ibn Muhammad al-Khalwati, connu comme al-Sawi, juriste malikite ayant étudié auprès d'al-Dardir et d'al-Dasuqi. Sa nisba renvoie à Sa' al-Hajar dans la province égyptienne de Gharbiyya. Il mourut à Médine. Ses œuvres comprennent une glose du commentaire des Jalalayn et une glose du commentaire d'al-Dardir sur Aqrab al-masalik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  es: "Ahmad ibn Muhammad al-Khalwati, también conocido como al-Sawi, fue un jurista malikí que estudió con al-Dardir y al-Dasuqi. Su nisba hace referencia a Sa' al-Hajar en la provincia de Gharbiyya, en Egipto. Falleció en Medina. Entre sus obras se incluyen una glosa sobre el comentario de Jalalayn y otra sobre el comentario de al-Dardir sobre Aqrab al-masalik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  ur: "احمد بن محمد الخلواتی، جسے الساوی کے نام سے بھی جانا جاتا ہے، ایک مالکی فقیہ تھا جس نے الدردیر اور الدسوقی کے ساتھ تعلیم حاصل کی۔ اس کے نسبہ سے مراد مصر کے صوبہ غربیہ میں ص الحجر ہے۔ مدینہ میں وفات پائی۔ ان کی تصانیف میں جلالین کی تفسیر اور الدردیر کی تفسیر عقرب المسالک پر ایک تالیف شامل ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1630}"
  tr: "Ahmed ibn Muhammed el-Halveti, el-Savi olarak da bilinir, el-Dardir ve el-Dasuki'nin öğrencisi olan bir Maliki fıkıhçısıdır. Mısır'ın Garbiyye bölgesinde Sa' el-Hacer'in adını almıştır ve Medine'de vefat etmiştir. Eserleri arasında Tefsir el-Celaleyn üzerine bir tefsir ve el-Dardir'in Akrab el-Masalik açıklaması üzerine bir tefsir bulunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1630}"
  id: "Ahmad ibn Muhammad al-Khalwati, yang dikenal sebagai al-Sawi, adalah seorang ahli hukum Maliki yang belajar di bawah bimbingan al-Dardir dan al-Dasuqi. Ia dinamai Sa' al-Hajar di wilayah Gharbiyya, Mesir, dan meninggal di Madinah. Di antara karyanya adalah komentar atas Tafsir al-Jalalayn dan komentar atas penjelasan al-Dardir tentang Aqrab al-Masalik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
