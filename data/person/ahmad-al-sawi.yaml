summary:
  ar: "أحمد بن محمد الخلوتي، الشهير بالصاوي، فقيه مالكي، أخذ عن الدردير والدسوقي، ونسبته إلى «صاء الحجر» في الغربية بمصر، وتوفي بالمدينة المنورة. من مؤلفاته حاشية على تفسير الجلالين، وحاشية على شرح الدردير لأقرب المسالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  en: "Ahmad ibn Muhammad al-Khalwati, known as al-Sawi, a Maliki jurist who studied with al-Dardir and al-Dasuqi. His nisba refers to Sa' al-Hajar in the Gharbiyya province of Egypt. He died in Medina. His works include a gloss on the Jalalayn commentary and a gloss on al-Dardir's commentary on Aqrab al-masalik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
