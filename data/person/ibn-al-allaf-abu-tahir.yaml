summary:
  ar: "أبو طاهر محمد بن علي بن محمد بن يوسف المقرئ الواعظ المعروف بابن العلاف، من رجال إسناد «فضائل الصحابة» لأحمد بن حنبل: قرأه على أبي بكر القطيعي سنة 368هـ وسمعه منه أبو الحسين الطيوري سنة 436هـ؛ وصفه الخطيب بأنه صدوق مستور ظاهر الوقار، وكان له مجلس وعظ بجامع المهدي ثم حلقة بجامع المنصور ببغداد، وتوفي عشية الجمعة 24 ربيع الآخر سنة 442هـ."
  en: "Abu Tahir Muhammad ibn Ali ibn Muhammad ibn Yusuf al-Muqri', the preacher known as Ibn al-Allaf, a link in the chain of Ahmad ibn Hanbal's Fada'il al-Sahaba: he read it to Abu Bakr al-Qati'i in 368 AH and Abu al-Husayn al-Tuyuri heard it from him in 436. Al-Khatib called him truthful, discreet and of evident dignity; he held a preaching session in the Mahdi mosque and then a teaching circle in the Mansur mosque in Baghdad, and died on the eve of Friday 24 Rabi' II 442."
  es: "Abu Tahir Muhammad ibn Ali ibn Muhammad ibn Yusuf al-Muqri', el predicador conocido como Ibn al-Allaf, un eslabón en la cadena de Fada'il al-Sahaba de Ahmad ibn Hanbal: se lo leyó a Abu Bakr al-Qati'i en el año 368 de la Hégira y Abu al-Husayn al-Tuyuri lo escuchó de él en el año 436. Al-Khatib lo llamó veraz, discreto y de evidente dignidad; impartió una clase en la mezquita Mahdi y luego dirigió un círculo de enseñanza en la mezquita Mansur de Bagdad, y murió en la víspera del viernes 24 de Rabi' II del año 442."
  fr: "Abou Tahir Muhammad ibn Ali ibn Muhammad ibn Yusuf al-Muqri', le prédicateur connu sous le nom d'Ibn al-Allaf, un maillon de la chaîne de transmission du Fada'il al-Sahaba d'Ahmad ibn Hanbal: il le lut à Abou Bakr al-Qati'i en 368 AH et Abou al-Husayn al-Tuyuri l'entendit de lui en 436. Al-Khatib le qualifia de véridique, discret et d'une dignité manifeste; il tint une session de prédication à la mosquée du Mahdi, puis un cercle d'enseignement à la mosquée Mansur à Bagdad, et mourut à la veille du vendredi 24 Rabi' II 442."
  ur: "ابو طاہر محمد بن علی بن محمد بن یوسف المقری، ابن العلف کے نام سے مشہور مبلغ، احمد بن حنبل کی فدائیل الصحابہ کے سلسلہ کی ایک کڑی ہے: اس نے اسے 368 ہجری میں ابوبکر القطی کو پڑھ کر سنایا اور ابو الحسین نے انہیں 46 ہجری میں ان سے سنا۔ سچا، سمجھدار اور واضح وقار کا؛ اس نے مسجد مہدی میں ایک تبلیغی اجلاس منعقد کیا اور پھر بغداد کی منصور مسجد میں درسی حلقہ بنایا، اور جمعہ 24 ربیع الثانی 442 کے موقع پر وفات پائی۔"
