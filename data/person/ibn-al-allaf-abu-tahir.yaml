summary:
  ar: "أبو طاهر محمد بن علي بن محمد بن يوسف المقرئ الواعظ المعروف بابن العلاف، من رجال إسناد «فضائل الصحابة» لأحمد بن حنبل: قرأه على أبي بكر القطيعي سنة 368هـ وسمعه منه أبو الحسين الطيوري سنة 436هـ؛ وصفه الخطيب بأنه صدوق مستور ظاهر الوقار، وكان له مجلس وعظ بجامع المهدي ثم حلقة بجامع المنصور ببغداد، وتوفي عشية الجمعة 24 ربيع الآخر سنة 442هـ."
  en: "Abu Tahir Muhammad ibn Ali ibn Muhammad ibn Yusuf al-Muqri', the preacher known as Ibn al-Allaf, a link in the chain of Ahmad ibn Hanbal's Fada'il al-Sahaba: he read it to Abu Bakr al-Qati'i in 368 AH and Abu al-Husayn al-Tuyuri heard it from him in 436. Al-Khatib called him truthful, discreet and of evident dignity; he held a preaching session in the Mahdi mosque and then a teaching circle in the Mansur mosque in Baghdad, and died on the eve of Friday 24 Rabi' II 442."
