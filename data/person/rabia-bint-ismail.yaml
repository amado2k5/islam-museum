summary:
  ar: "رابعة بنت إسماعيل عابدة من أهل الشام، زوجة أحمد بن أبي الحواري؛ يميزها ابن الجوزي في «صفة الصفوة» من رابعة العدوية البصرية، ويروي عن زوجها أحوالها في الحب والأنس والخوف."
  en: "Rabi'a bint Isma'il, a devout woman of Syria and wife of Ahmad ibn Abi al-Hawari; Ibn al-Jawzi in Sifat al-Safwa distinguishes her from the Basran Rabi'a al-Adawiyya and relates from her husband her states of love, intimacy and fear."
  ur: "رابعہ بنت اسماعیل، شام کی ایک عابدہ اور احمد بن ابی الحواری کی اہلیہ؛ ابن الجوزی «صفۃ الصفوہ» میں انہیں بصرہ کی رابعہ العدویہ سے الگ کرتے ہیں اور ان کے شوہر سے ان کی محبت، انس اور خوف کی کیفیات نقل کرتے ہیں۔"
