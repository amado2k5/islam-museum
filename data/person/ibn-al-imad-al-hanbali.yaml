  fr: "Abd al-Hayy ibn Ahmad Ibn al-Imad al-Hanbali (al-Akri), historien, juriste et homme de lettres, auteur de Shadharat al-Dhahab; né dans le quartier Salihiyya de Damas et mort à La Mecque en pèlerinage en 1089 AH (1679 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 p. 290}."
