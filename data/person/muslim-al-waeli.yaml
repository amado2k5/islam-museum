summary:
  ar: "رادود حسيني ومنشد عراقي من محافظة ذي قار، وُلد سنة 1999 في مدينة سوق الشيوخ، وبدأ قراءة القصائد الحسينية صبيا سنة 2008 في مواكب مدينته، ثم صار من أشهر رواديد جيله في العراق، وأدى في العتبات الحسينية والعلوية وفي دول عدة، ونالت قناته على يوتيوب الدرع الذهبي سنة 2021."
  en: "Iraqi Husayni radud (eulogist) and munshid from Dhi Qar governorate, born in 1999 in Suq al-Shuyukh. He began reciting Husayni eulogies as a boy in 2008 in his town's processions, became one of the best-known raduds of his generation in Iraq, performed at the Husayni and Alawiyya shrines and in several countries, and his YouTube channel received the gold creator award in 2021."
  ur: "عراقی حسینی رادود اور منشد، جو 1999 میں سوق الشیوخ، محافظہ ذی قار میں پیدا ہوئے۔ انہوں نے 2008 میں بچپن ہی سے اپنے شہر کے مواکب میں حسینی قصائد پڑھنا شروع کیے، عراق میں اپنے دور کے معروف رادودوں میں شامل ہوئے، حسینی و علوی عتبات اور کئی ممالک میں پڑھا، اور 2021 میں ان کے یوٹیوب چینل کو گولڈ کریئیٹر ایوارڈ ملا۔"
