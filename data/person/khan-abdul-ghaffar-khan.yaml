summary:
  ar: "زعيم بشتوني ومناضل لاعنفي (1890–1988) من أوتمانزاي في هشتنگار، عُرف بـ«باشا خان» و«غاندي الحدود». أسس حركة «خُداي خدمتگار» (القمصان الحمر) سنة 1929 لمقاومة الحكم البريطاني باللاعنف، وعارض تقسيم الهند، وقضى سنوات طويلة في سجون بريطانيا ثم باكستان، ودُفن بوصيته في جلال آباد بأفغانستان."
  en: "Pashtun leader and nonviolent activist (1890–1988) from Utmanzai in Hashtnagar, known as Bacha Khan and the 'Frontier Gandhi'. In 1929 he founded the Khudai Khidmatgar ('Servants of God', the Red Shirts) to resist British rule nonviolently; he opposed the Partition of India, spent long years in British and then Pakistani prisons, and by his will was buried at Jalalabad in Afghanistan."
  ur: "ہشٹنگر کے اتمانزئی سے تعلق رکھنے والے پشتون رہنما اور عدم تشدد کے علمبردار (1890ء–1988ء)، ’باچا خان‘ اور ’سرحدی گاندھی‘ کہلائے۔ انھوں نے 1929ء میں برطانوی راج کے خلاف عدم تشدد کی مزاحمت کے لیے ’خدائی خدمتگار‘ تحریک (سرخ پوش) قائم کی، تقسیم ہند کی مخالفت کی، برطانوی اور پھر پاکستانی جیلوں میں طویل عرصہ گزارا، اور وصیت کے مطابق جلال آباد، افغانستان میں دفن ہوئے۔"
