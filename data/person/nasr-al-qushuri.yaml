  id: "Nasr al-Qashuri adalah salah satu juru tulis al-Hallaj dan yang ia sebut Sheikh al-Salih, dan baginya adalah kitab al-Durra, salah satu buku al-Hallaj {cite:fihrist-ibn-al-nadim hlm. 271-272}."
