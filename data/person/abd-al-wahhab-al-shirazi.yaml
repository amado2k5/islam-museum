names:
  - { value: "أبو العلاء مجد الدين عبد الوهاب بن شرف الإسلام عبد الواحد بن محمد بن علي الشيرازي الأنصاري", kind: full }
summary:
  ar: "أبو العلاء مجد الدين عبد الوهاب بن شرف الإسلام الشيرازي الأصل الأنصاري، شيخ الحنابلة بالشام في وقته؛ قال ولده ناصح الدين عبد الرحمن: ولد والدي سنة ثمان وتسعين وأربعمائة وأتى ودرس وهو ابن نيف وعشرين سنة إلى أن مات وما زال عزماً معظماً قوياً، ولما مرض مرض الموت رآني وقد بكيت فقال لي ما يبكيك فقلت خيراً، قال لا تحزن عليّ أنا ما توليت قضاءً ولا شحنية ولا حبست ولا ضربت ولا دخلت بين الناس ولا ظلمت أحداً فإن كان لي ذنوب فبيني وبين الله عز وجل، ولو ستون سنة وأنا والله ساجاهد في دين الله تعالى؛ وكان الشيخ الموفق وأخوه أبو عمر إذا أشكل عليهما شيء سألا شيخهما هذا؛ توفي ثاني عشري ربيع الآخر ودفن بسفح قاسيون سنة ست وثمانين وخمسمائة {cite:shadharat-dhahab p. 765-766}."
  en: "Abu al-Ala Majd al-Din Abd al-Wahhab al-Shirazi al-Ansari, shaykh of the Hanbalis of Sham in his day; b. 498, came and taught from twenty-odd till death, still hale, revered and strong. On his deathbed he saw his son weeping and said: 'Do not grieve for me — I never held a judgeship or constable's post, never jailed or struck a man, never came between people or wronged anyone; if I have sins they are between me and God. Sixty years I have strove in God's religion.' Muwaffaq al-Din and his brother Abu Umar would bring him their hard questions. He died 12 Rabi' II 586 and was buried at the foot of Qasyun {cite:shadharat-dhahab p. 765-766}."
  fr: "Abu al-Ala Majd al-Din Abd al-Wahhab al-Shirazi al-Ansari, cheikh des hanbalites du Sham en son temps ; né en 498, il vint et enseigna de vingt et quelques années jusqu'à sa mort, toujours vigoureux, vénéré et fort. Sur son lit de mort, il vit son fils pleurer et dit : « Ne t'afflige pas pour moi — je n'ai jamais occupé de judicature ni de charge de police, jamais emprisonné ni frappé personne, jamais ne me suis interposé entre les gens ni n'ai lésé quiconque ; si j'ai des péchés, ils sont entre moi et Dieu. Soixante ans j'ai lutté pour la religion de Dieu. » Muwaffaq al-Din et son frère Abu Umar lui soumettaient leurs questions difficiles. Il mourut le 12 rabi' II 586 et fut inhumé au pied du Qasyun {cite:shadharat-dhahab p. 765-766}."
  es: "Abu al-Ala Majd al-Din Abd al-Wahhab al-Shirazi al-Ansari, shaykh de los hanbalíes de Sham en su época (nacido en 498), enseñó desde los veintitantos años hasta su muerte, aún con buena salud, venerado y fuerte. En su lecho de muerte vio a su hijo llorando y le dijo: «No te aflijas por mí; jamás ostenté un cargo de juez ni de alguacil, jamás encarcelé ni golpeé a nadie, jamás intervine entre la gente ni hice daño a nadie; si he pecado, son pecados entre Dios y yo. Durante sesenta años me he esforzado en la religión de Dios». Muwaffaq al-Din y su hermano Abu Umar le planteaban sus preguntas más difíciles. Murió el 12 de Rabi' II de 586 y fue enterrado al pie de Qasyun (cita: shadharat-dhahab, págs. 765-766)."
  ur: "ابو الاعلٰی ماجد الدین عبد الوہاب الشیرازی الانصاری، اپنے دور میں شام کے حنبلیوں کے شیخ؛ ب 498، آیا اور بیس سے موت تک پڑھایا، اب بھی حلیم، قابل احترام اور مضبوط۔ بستر مرگ پر اس نے اپنے بیٹے کو روتے ہوئے دیکھا اور کہا: 'میرے لیے غم نہ کرو، میں نے کبھی جج یا کانسٹیبل کے عہدے پر فائز نہیں ہوئے، نہ کبھی کسی کو جیل میں ڈالا اور نہ ہی کسی کو مارا، نہ کبھی لوگوں کے درمیان آیا اور نہ ہی کسی پر ظلم کیا۔ اگر میرے گناہ ہیں تو وہ میرے اور خدا کے درمیان ہیں۔ میں نے ساٹھ سال خدا کے دین میں جدوجہد کی ہے۔ موفق الدین اور اس کے بھائی ابو عمر اس کے پاس اپنے سخت سوالات لے کر آتے۔ آپ کی وفات 12 ربیع الثانی 586 میں ہوئی اور قصیون کے دامن میں دفن ہوئے۔ 765-766}۔"
