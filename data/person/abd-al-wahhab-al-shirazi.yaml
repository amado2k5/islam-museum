names:
  - { value: "أبو العلاء مجد الدين عبد الوهاب بن شرف الإسلام عبد الواحد بن محمد بن علي الشيرازي الأنصاري", kind: full }
summary:
  ar: "أبو العلاء مجد الدين عبد الوهاب بن شرف الإسلام الشيرازي الأصل الأنصاري، شيخ الحنابلة بالشام في وقته؛ قال ولده ناصح الدين عبد الرحمن: ولد والدي سنة ثمان وتسعين وأربعمائة وأتى ودرس وهو ابن نيف وعشرين سنة إلى أن مات وما زال عزماً معظماً قوياً، ولما مرض مرض الموت رآني وقد بكيت فقال لي ما يبكيك فقلت خيراً، قال لا تحزن عليّ أنا ما توليت قضاءً ولا شحنية ولا حبست ولا ضربت ولا دخلت بين الناس ولا ظلمت أحداً فإن كان لي ذنوب فبيني وبين الله عز وجل، ولو ستون سنة وأنا والله ساجاهد في دين الله تعالى؛ وكان الشيخ الموفق وأخوه أبو عمر إذا أشكل عليهما شيء سألا شيخهما هذا؛ توفي ثاني عشري ربيع الآخر ودفن بسفح قاسيون سنة ست وثمانين وخمسمائة {cite:shadharat-dhahab p. 765-766}."
  en: "Abu al-Ala Majd al-Din Abd al-Wahhab al-Shirazi al-Ansari, shaykh of the Hanbalis of Sham in his day; b. 498, came and taught from twenty-odd till death, still hale, revered and strong. On his deathbed he saw his son weeping and said: 'Do not grieve for me — I never held a judgeship or constable's post, never jailed or struck a man, never came between people or wronged anyone; if I have sins they are between me and God. Sixty years I have strove in God's religion.' Muwaffaq al-Din and his brother Abu Umar would bring him their hard questions. He died 12 Rabi' II 586 and was buried at the foot of Qasyun {cite:shadharat-dhahab p. 765-766}."
