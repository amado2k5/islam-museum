summary:
  ar: "السلطان محمد الثاني الفاتح (ت ٨٨٦هـ/١٤٨١م)؛ السلطان العثماني السابع في سلسلة آل عثمان، يُلقب بالفاتح وأبي الخيرات. تولى حكم الدولة بعد وفاة والده في ١٦ محرم سنة ٨٥٥هـ الموافق ١٨ فبراير ١٤٥١م وكان عمره اثنتين وعشرين سنة، وحكم ما يقرب من ثلاثين عاماً كانت خيراً وعزة للمسلمين. امتاز بشخصية فذة جمعت بين القوة والعدل، وفاق أقرانه في مدرسة الأمراء بمعرفة كثير من لغات عصره وميله الشديد لدراسة كتب التاريخ. أعاد تنظيم إدارات الدولة وحدد مواردها وطور كتائب الجيش وزودها بأحدث الأسلحة وطور البلاط السلطاني، ثم توج انتصاراته بفتح القسطنطينية عاصمة الإمبراطورية البيزنطية وجعلها عاصمة للدولة العثمانية {cite:dawlat-uthmaniyya-salabi p. 87}."
  en: "Mehmed II 'the Conqueror' (d. 886 AH/1481 CE) — acceded 16 Muharram 855 (18 February 1451) aged twenty-two, a linguist and army-reformer who crowned his thirty-year reign with the conquest of Constantinople {cite:dawlat-uthmaniyya-salabi p. 87}."
