    note: "Named in an imperial order of 975 AH (1568) as the builder of the Mostar Bridge, which the entry dates to about 974 AH (1566-67); the same order is read as evidence against the old attribution of the bridge to Sinan. The entry takes him to be among the architects Sinan trained, but only says this appears so. A 971 AH (1563-64) survey of repair accounts at Samatya, with Sinan, is probably his too; the entry does not settle it. A separate TDV entry on another Mimar Hayreddin was not read."
