summary:
  ar: "مدرب كرة قدم مغربي ولاعب سابق ⁦(وُلد سنة 1975 في كورباي إيسون بفرنسا)⁩. ظهير أيمن مثّل المغرب دوليًا، ثم درّب الفتح الرباطي والوداد — الذي فاز معه بدوري أبطال أفريقيا 2022 — وقاد منتخب المغرب إلى نصف نهائي كأس العالم 2022 لأول مرة لمنتخب أفريقي وعربي، وإلى لقب كأس أمم أفريقيا 2025."
  en: "Moroccan football manager and former player (born 1975 in Corbeil-Essonnes, France). A right-back capped by Morocco, he coached FUS Rabat and Wydad AC — winning the 2022 CAF Champions League with the latter — and led Morocco to the semi-finals of the 2022 FIFA World Cup, a first for an African and Arab team, and to the 2025 Africa Cup of Nations title."
  ur: "مراکشی فٹبال مینیجر اور سابق کھلاڑی ⁦(پیدائش 1975، کوربئے ایسون، فرانس)⁩۔ رائٹ بیک کے طور پر مراکش کی نمائندگی کی؛ فس رباط اور وداد کو کوچ کیا — وداد کے ساتھ 2022 کیف چیمپیئنز لیگ جیتی — اور مراکش کو 2022 فیفا ورلڈ کپ کے سیمی فائنل تک پہنچایا، جو کسی افریقی اور عرب ٹیم کے لیے پہلا موقع تھا، اور 2025 افریقہ کپ آف نیشنز کا خطاب دلایا۔"
  es: "Entrenador y exfutbolista marroquí (nacido en 1975 en Corbeil-Essonnes, Francia). Lateral derecho internacional con Marruecos, dirigió al FUS Rabat y al Wydad AC —con este último ganó la Liga de Campeones de la CAF en 2022— y llevó a Marruecos a las semifinales de la Copa Mundial de la FIFA 2022, un hito para un equipo africano y árabe, y a la Copa Africana de Naciones 2025."
  fr: "Entraîneur et ancien joueur de football marocain (né en 1975 à Corbeil-Essonnes, France). International marocain au poste d'arrière droit, il a entraîné le FUS Rabat et le Wydad AC — remportant la Ligue des champions de la CAF 2022 avec ce dernier — et a mené le Maroc en demi-finales de la Coupe du monde de la FIFA 2022, une première pour une équipe africaine et arabe, et à la victoire lors de la Coupe d'Afrique des Nations 2025."
  tr: "Fas futbol antrenörü ve eski oyuncu (1975 doğumlu, Courbaye-Essonne, Fransa). Fas'ı uluslararası alanda temsil eden, ardından Fath Rabat ve Wydad'ı çalıştıran bir sağ bek (bu takımla 2022 CAF Şampiyonlar Ligi'ni kazandı) ve Fas milli takımını ilk kez Afrika ve Arap takımı olarak 2022 Dünya Kupası yarı finaline, ayrıca 2025 Afrika Uluslar Kupası şampiyonluğuna taşıdı."
  id: "Seorang pelatih sepak bola Maroko dan mantan pemain (lahir tahun 1975 di Courbaye-Essonne, Prancis). Seorang bek kanan yang mewakili Maroko secara internasional, kemudian melatih Fath Rabat dan Wydad — dengan siapa ia memenangkan Liga Champions CAF 2022 — dan memimpin tim nasional Maroko ke semifinal Piala Dunia 2022 untuk pertama kalinya untuk tim Afrika dan Arab, serta meraih gelar Piala Afrika 2025."
