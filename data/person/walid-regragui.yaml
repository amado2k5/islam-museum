summary:
  ar: "مدرب كرة قدم مغربي ولاعب سابق (وُلد سنة 1975 في كورباي إيسون بفرنسا). ظهير أيمن مثّل المغرب دوليًا، ثم درّب الفتح الرباطي والوداد — الذي فاز معه بدوري أبطال أفريقيا 2022 — وقاد منتخب المغرب إلى نصف نهائي كأس العالم 2022 لأول مرة لمنتخب أفريقي وعربي، وإلى لقب كأس أمم أفريقيا 2025."
  en: "Moroccan football manager and former player (born 1975 in Corbeil-Essonnes, France). A right-back capped by Morocco, he coached FUS Rabat and Wydad AC — winning the 2022 CAF Champions League with the latter — and led Morocco to the semi-finals of the 2022 FIFA World Cup, a first for an African and Arab team, and to the 2025 Africa Cup of Nations title."
  ur: "مراکشی فٹبال مینیجر اور سابق کھلاڑی (پیدائش 1975، کوربئے ایسون، فرانس)۔ رائٹ بیک کے طور پر مراکش کی نمائندگی کی؛ فس رباط اور وداد کو کوچ کیا — وداد کے ساتھ 2022 کیف چیمپیئنز لیگ جیتی — اور مراکش کو 2022 فیفا ورلڈ کپ کے سیمی فائنل تک پہنچایا، جو کسی افریقی اور عرب ٹیم کے لیے پہلا موقع تھا، اور 2025 افریقہ کپ آف نیشنز کا خطاب دلایا۔"
