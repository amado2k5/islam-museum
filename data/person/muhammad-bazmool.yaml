summary:
  ar: "عالم سعودي من مكة المكرمة، أستاذ في قسم الكتاب والسنة بكلية الدعوة وأصول الدين في جامعة أم القرى، تخصصه علوم القرآن والحديث، وله مؤلفات في السنة وأصول الفقه والأخلاق، وكُلّف مفوضا للإفتاء بمنطقة مكة المكرمة في موسم حج 1443هـ."
  en: "Saudi scholar from Makkah, professor in the Department of the Book and the Sunna at the College of Da'wa and Usul al-Din, Umm al-Qura University, specialising in the sciences of the Qur'an and Hadith, author of works on the Sunna, legal theory and ethics, and commissioned as ifta commissioner for the Makkah Region in the Hajj season of 1443 AH."
  ur: "مکہ مکرمہ کے سعودی عالم، جامعہ ام القری کے کلیہ الدعوہ و اصول الدین میں شعبہ الکتاب والسنہ کے استاد؛ ان کا تخصص علومِ قرآن و حدیث ہے، سنت، اصولِ فقہ اور اخلاق پر ان کی تصانیف ہیں، اور حج 1443ھ کے موسم میں انہیں منطقہ مکہ مکرمہ کا مفوضِ افتاء مقرر کیا گیا۔"
