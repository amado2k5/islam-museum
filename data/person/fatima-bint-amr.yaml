summary:
  ar: "أم عبد الله والد النبي، فجدّة النبي لأبيه؛ من بني مخزوم، بنت عمرو بن عائذ بن عمران بن مخزوم بن يقظة بن مرة، وبسببها كان أخوال عبد الله من بني مخزوم الذين منعوا ذبحه؛ وعند البلاذري أمها فاطمة بنت عبد الله بن رزام الهوازنية."
  en: "Mother of Abdullah, the Prophet's father, and so his paternal grandmother; of Banu Makhzum, daughter of Amr ibn Aidh ibn Imran ibn Makhzum ibn Yaqaza ibn Murra, which made Abdullah's maternal uncles the Makhzumis who prevented his sacrifice; al-Baladhuri names her mother as Fatima bint Abdullah ibn Rizam of Hawazin."
