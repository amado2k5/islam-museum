id: person/fatima-bint-amr
education:
  did_you_know:
    ar: "فاطمة بنت عمرو أم عبد الله والد النبي فجدّته لأبيه من بني مخزوم؛ وبسببها كان أخوال عبد الله مخزوميون منعوا ذبحه."
    en: "Fatima bint Amr, mother of the Prophet's father Abd Allah — his grandmother on the Makhzum side; through her Abd Allah's uncles were Makhzumis, the men who shielded him from slaughter."
    ur: "فاطمہ بنت عمرو، نبی کے والد عبداللہ کی ماں — مخزومی طرف سے ان کی دادی؛ اسی نسب سے عبداللہ کے ماموں مخزومی تھے جنھوں نے ان کی قربانی روکی۔"
    sources: [source/mubarakpuri-raheeq, source/tabaqat-ibn-sad]
