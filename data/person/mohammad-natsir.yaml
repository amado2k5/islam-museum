summary:
  ar: "عالم وسياسي إندونيسي (1908–1993) من سومطرة الغربية، خامس رؤساء وزراء إندونيسيا (1950–1951) وزعيم حزب ماشومي، كتب خمسة وأربعين كتابًا ومئات المقالات في الإسلام والدولة، وسُجن 1962–1964، وأسس المجلس الإندونيسي للدعوة الإسلامية، ونال جائزة الملك فيصل لخدمة الإسلام (1980)، وسُمّي بطلًا قوميًا لإندونيسيا في 2008."
  en: "Indonesian scholar and politician (1908–1993) from West Sumatra, fifth prime minister of Indonesia (1950–1951) and leader of the Masyumi party, author of forty-five books and hundreds of articles on Islam and the state; imprisoned 1962–1964, founder of the Indonesian Islamic Propagation Council, King Faisal Prize for Service to Islam (1980), and a National Hero of Indonesia since 2008."
  ur: "مغربی سماٹرا کے انڈونیشیائی عالم اور سیاست دان ⁦(1908ء–1993ء)⁩، انڈونیشیا کے پانچویں وزیرِ اعظم ⁦(1950ء–1951ء)⁩ اور ماشومی پارٹی کے رہنما، اسلام اور ریاست پر پینتالیس کتب اور سیکڑوں مضامین کے مصنف؛ 1962ء–1964ء قید رہے، انڈونیشی اسلامی دعوتی کونسل کے بانی، شاہ فیصل انعام برائے خدمتِ اسلام ⁦(1980ء)⁩، اور 2008ء سے انڈونیشیا کے قومی ہیرو۔"
