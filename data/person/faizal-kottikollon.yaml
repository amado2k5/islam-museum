summary:
  ar: "فايزال إدافالاث كوتيكولون (وُلد في 6 تموز 1963 في ماهي)، رجل أعمال هندي يقيم في الإمارات، مؤسس مجموعة كيف القابضة ورئيسها. بدأ بتجارة الخردة في عجمان سنة 1995، وبنى شركة الإمارات تكنو كاستينغ لتصبح من أبرز شركات الصبّ قبل بيعها لشركة تايكو، ثم طوّر أعمال كيف في الإنشاءات خارج الموقع والرعاية الصحية والعافية، ومنها مستشفى ميترا في كوزيكود. وأسس مع زوجته شبّانة مؤسسة فايزال وشبّانة سنة 2007."
  en: "Faizal Edavalath Kottikollon (born 6 July 1963 at Mahé) is a UAE-based Indian businessman, founder and chairman of KEF Holdings. He began with steel scrap trading in Ajman in 1995, built Emirates Techno Casting into a leading foundry business that was sold to Tyco, and then developed KEF's offsite-construction, healthcare and wellness ventures, including Meitra Hospital in Kozhikode. With his wife Shabana he co-founded the Faizal & Shabana Foundation in 2007."
  ur: "فیضل ایڈاوالتھ کوٹیکولن (پیدائش 6 جولائی 1963، ماہے) متحدہ عرب امارات میں مقیم بھارتی تاجر اور کے ای ایف ہولڈنگز کے بانی و چیئرمین ہیں۔ انھوں نے 1995 میں عجمان میں سکریپ تجارت سے آغاز کیا، ایمریٹس ٹیکنو کاسٹنگ کو معروف فاؤنڈری کاروبار بنا کر ٹائیکو کو فروخت کیا، اور پھر کے ای ایف کے آف سائٹ تعمیرات، صحت اور تندرستی کے منصوبے پروان چڑھائے، جن میں کوژیکوڈ کا میترا اسپتال شامل ہے۔ انھوں نے اپنی اہلیہ شبانہ کے ساتھ 2007 میں فیضل و شبانہ فاؤنڈیشن کی مشترکہ بنیاد رکھی۔"

