id: person/ibn-nubata-al-misri
class: person
label: { ar: "جمال الدين ابن نباتة المصري" }
summary:
  ar: "الأديب الشهير جمال الدين ابن نباتة المصري كاتب الإنشاء؛ من إنشائه توقيع السلطان أبي الحسن المريني بمصاحفه الثلاثة الموقوفة على المساجد الثلاثة ومنه: وهو الذي مد يمينه بالسيف والقلم فكتيب في أصحابها وسطر الختمات الشريفة فأيد الله حزبه بما سطر من أحزابها {cite:nafh-tib-maqqari p. 403-404}."
  en: "Jamal al-Din Ibn Nubata al-Misri, the celebrated secretary of chancery; his insha' includes the waqf titulature for Abu al-Hasan al-Marini's three endowed mushafs — 'who stretched his right hand with sword and pen' {cite:nafh-tib-maqqari p. 403-404}."
  es: "Jamal al-Din Ibn Nubata al-Misri, el célebre secretario de cancillería; su insha' incluye la titulación waqf para los tres mushafs dotados de Abu al-Hasan al-Marini: 'quien extendió su mano derecha con espada y pluma' {cite:nafh-tib-maqqari p. 403-404}."
  fr: "Jamal al-Din Ibn Nubata al-Misri, le célèbre secrétaire de chancellerie; son insha' comprend la titulature waqf pour les trois mushafs dotés d'Abu al-Hasan al-Marini — « qui a étendu sa main droite avec l'épée et la plume » {cite: nafh-tib-maqqari p. 403-404}."
  ur: "جمال الدین ابن نوبتہ المصری، مشہور سیکرٹری آف چانسری؛ ان کے انشاء میں ابو الحسن المرینی کے تین مصحف کے لیے وقف کا عنوان بھی شامل ہے - 'جنہوں نے اپنا دایاں ہاتھ تلوار اور قلم سے بڑھایا'۔ 403-404}۔"
  tr: "Ünlü yazar Cemaleddin İbn Nebata el-Masri, bu eserin yazarı; eserleri arasında, Sultan Ebu el-Hasan el-Marini'nin üç camiye bağışladığı üç Kur'an'ın imzası da vardı; bunlar arasında: Sağ elini kılıç ve kalemle uzattı, sahiplerine yazıtlar yazdı ve soylu mühürler yazdı; Allah onun partisini yazdığı mektuplarla destekledi {atıf:nafh-tib-maqqari s. 403-404}."
  id: "Penulis terkenal Jamal al-Din Ibn Nabata al-Masri, penulis karya tersebut; di antara karyanya adalah tanda tangan Sultan Abu al-Hasan al-Marini atas tiga Al-Qur'an yang dianugerahkan kepada tiga masjid tersebut, termasuk: Ia mengulurkan tangan kanannya dengan pedang dan pena, menulis prasasti pada pemiliknya dan menulis segel mulia, dan Tuhan mendukung rombongannya dengan huruf-huruf yang ia tulis {cite:nafh-tib-maqqari hlm. 403-404}."
