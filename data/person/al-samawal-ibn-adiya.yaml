id: person/al-samawal-ibn-adiya
class: person
label: { ar: "السموأل بن عادياء", en: "al-Samaw'al ibn 'Adiya", fr: "al-Samaw'al ibn 'Adiya", es: "al-Samaw'al ibn 'Adiya", ur: "سماوئل بن عدیہ" }
summary:
  ar: "السموأل بن حسان بن عادياء، له عند المسعودي خبر مشهور وخبر خازن الكاهن حين طرقه ليلاً وانقياده إلى ذمته، وما كان من العير الأقمر والظليم الأحمر والفرس الأشقر والجمل الأزور والشيخ الأحقر، أتى عليه في كتابيه أخبار الزمان والكتاب الأوسط {cite:muruj-al-dhahab p. 500}."
  en: "Samaw'al ibn 'Adiya — of the famous tale with Khazin the night-knocking kahin and his trust, the grey ass, red ostrich, blond horse, wall-eyed camel and humiliated elder — treated in al-Mas'udi's Akhbar al-Zaman and Middle Book {cite:muruj-al-dhahab p. 500}."
  fr: "Samaw'al ibn 'Adiya - du conte célèbre avec Khazin le kahin nuit-frapper et sa confiance, l'âne gris, l'autruche rouge, le cheval blond, chameau aux yeux muraux et aîné humilié - traité dans Akhbar al-Zaman d'al-Mas'udi et livre du milieu {cite:muruj-al-dhahab p. 500}."
  es: "Samaw'al ibn 'Adiya — del famoso cuento con Khazin, el kahin que llama a la puerta por la noche, y su confianza, el asno gris, el avestruz rojo, el caballo rubio, el camello bizco y el anciano humillado — tratado en el Akhbar al-Zaman y el Libro Medio de al-Mas'udi {cite:muruj-al-dhahab p. 500}."
  ur: "سماول بن عدیہ - خزین کے ساتھ رات کو دستک دینے والی کہانی اور اس کا اعتماد، سرمئی گدا، سرخ شتر مرغ، سنہرے بالوں والا گھوڑا، دیوار کی آنکھوں والا اونٹ اور ذلیل بزرگ - المسعودی کی اخبار الزمان اور درمیانی کتاب میں بیان کیا گیا ہے۔ 500}۔"
  tr: "El-Samva'il bin Hasan ibn 'Adiya', el-Mes'udi ile ilgili iyi bilinen bir haber ve gece kapıyı çalıp sorumluluğuna getirilen kahin Hazen'in hikayesi ile ay benzeri leş, kırmızı koyu tenli at, sarı at, mavi deve ve mütevazı şeyh arasında bulunan eşyalar ona iki kitabı olan Akhbar al-Zaman ve Al-Kitab al-Wasat {cite:muruj-al-dhahab, s. 500} ile getirilmiştir."
  id: "Al-Samwa'il ibn Hassan ibn 'Adiya', yang memiliki laporan terkenal tentang al-Mas'udi dan kisah Khazen sang peramal ketika ia mengetuk pintu pada malam hari dan ditanggungjawab, serta apa yang ada di antara bangkai seperti bulan, kuda berkulit gelap merah, kuda pirang, unta azur, dan sheikh yang rendah hati, dibawa kepadanya dalam dua bukunya, Akhbar al-Zaman dan Al-Kitab al-Wasat {cite:muruj-al-dhahab, hlm. 500}."
