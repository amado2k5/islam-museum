label: { ar: "الهربذ", en: "al-Hirbadh", es: "al-Hirbadh", fr: "al-Hirbadh", ur: "الحربد" }
summary:
  ar: "الهربذ صاحب دارابجرد شادروان علم أهل فارس ودينهم؛ صالح عثمان بن أبي العاص على مال أعطاه إياه وعلى أن أهل دارابجرد أسوة من فتحت بلاده ويقال إنه صالح على فسا أيضاً."
  en: "The Hirbadh, master of Darabjird — banner-town of Fars's folk and their religion; he truced Uthman on payment and equal terms with the surrendered towns, and is said to have truced Fasa as well."
  es: "El Hirbadh, señor de Darabjird, ciudad emblemática del pueblo de Fars y su religión, pactó una tregua con Uthman a cambio de un pago y en igualdad de condiciones con las ciudades rendidas, y se dice que también pactó una tregua con Fasa."
  fr: "Le Hirbadh, maître de Darabjird — ville bannière du peuple de Fars et de sa religion; il a conclu une trêve avec Uthman en échange d'un paiement et à des conditions égales avec les villes qui se sont rendues, et on dit qu'il a également conclu une trêve avec Fasa."
  ur: "ہیرباد، درابجرد کا ماسٹر - فارس کے لوگوں اور ان کے مذہب کا بینر شہر؛ اس نے عثمان کو ہتھیار ڈالنے والے شہروں کے ساتھ معاوضے اور مساوی شرائط پر اعتماد کیا، اور کہا جاتا ہے کہ اس نے فاسا کو بھی سمجھا۔"
  tr: "Darabjerd'in hükümdarı el-Harbadh, İran halkına ve dinlerine eğitim vermiştir; Salih Osman bin Ebi el-As zengindi ve ona servet vermiştir; Darabjerd halkı, toprakları fethedilenler gibi ve Salih'in Fasa'ya da iyi davrandığı söylenir."
  id: "Al-Harbadh, penguasa Darabjerd, mengajarkan masyarakat Persia dan agama mereka; Saleh Uthman ibn Abi al-As adalah orang kaya dan memberinya kekayaan, dan bahwa orang-orang Darabjerd mirip dengan mereka yang tanahnya telah ditaklukkan, dan dikatakan bahwa Saleh juga baik atas Fasa."
