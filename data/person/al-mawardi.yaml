summary:
  ar: "الشيخ الإمام أبو الحسن علي بن محمد الماوردي البصري الشافعي المتوفى سنة ٤٥٠هـ؛ كان من وجوه فقهاء الشافعية وولي القضاء ببلدان كثيرة، وله تصانيف كثيرة في أصول الفقه وفروعه منها المقترن والنكت في التفسير والأحكام السلطانية وقوانين الوزراء والحكم والأمثال، وكان يقول «بسطت الفقه في أربعة آلاف ورقة وقد اختصرته في أربعين» يريد بالمبسوط الحاوي وبالختصر الإقناع {cite:muntazam-ibn-al-jawzi j.8 p.114}؛ وصاحب أعلام النبوة المختصر المشتمل على أحد وعشرين باباً {cite:kashf-zunun-furqan p. 518}."
  en: "Abu al-Hasan Ali ibn Muhammad al-Mawardi al-Shafi'i, d. AH 450 — author of A'lam al-Tubwa, a twenty-one-chapter epitome on the proofs of prophethood {cite:kashf-zunun-furqan p. 518}."
