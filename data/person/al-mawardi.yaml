    ar: "الماوردي أبو الحسن علي البصري الشافعي المتوفى ٤٥٠هـ، من وجوه فقهاء الشافعية، ولي القضاء ببلدان كثيرة وله «الأحكام السلطانية»."
    en: "Al-Mawardi, Abu al-Hasan the Basran Shafi'i who died in 450 AH, stood among the schoolmasters of Shafi'i fiqh, judged in many lands, and wrote the 'Ordinances of Government'."
    ur: "ماوردی، ابوالحسن بصری شافعی، 450ھ میں فوت ہوئے، شافعی فقیہوں کے بزرگوں میں تھے، کئی شہروں میں قاضی رہے اور «الاحکام السلطانیہ» لکھی۔"
    sources: [source/encyclopaedia-of-islam-2, source/fihrist-ibn-al-nadim]
