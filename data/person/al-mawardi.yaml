label: { ar: "الماوردي", en: "al-Mawardi", ur: "ماوردی" }
summary:
  ar: "الشيخ الإمام أبو الحسن علي بن محمد الماوردي البصري الشافعي المتوفى سنة ٤٥٠هـ؛ كان من وجوه فقهاء الشافعية وولي القضاء ببلدان كثيرة، وله تصانيف كثيرة في أصول الفقه وفروعه منها المقترن والنكت في التفسير والأحكام السلطانية وقوانين الوزراء والحكم والأمثال، وكان يقول «بسطت الفقه في أربعة آلاف ورقة وقد اختصرته في أربعين» يريد بالمبسوط الحاوي وبالختصر الإقناع {cite:muntazam-ibn-al-jawzi j.8 p.199}؛ وصاحب أعلام النبوة المختصر المشتمل على أحد وعشرين باباً {cite:kashf-zunun-furqan p. 518}. ويحكي ابن الجوزي عنه أن الخليفة وجّهه إلى عماد الدين أبي كليجار بالأهواز سنة ٤٢٣ في أمر لقبه، فردّ «السلطان المعظم» إذ هو من ألقاب الخليفة نفسه، وسائر ما يرويه بضمير المتكلم من مفاوضته {cite:muntazam-ibn-al-jawzi j.8 p.407-409}. وفي رمضان ٤٢٩ امتنع من الجواز في لقب «ملك الملوك» لجلال الدولة فانقطع عن خدمته ثم استدعاه الملك بكرة العيد فأعظمه وقال له إنه لو حاباه لما زاد ما بينهما وإن مخالفته إنما كانت للدين {cite:muntazam-ibn-al-jawzi j.8 p.439-440}. وفي سنة ٤٣٤ كان رسول الخليفة بتوقيعه إلى جلال الدولة في شأن الجوالي — يقول «خرج التوقيع من الخليفة وكنت أنا الرسول» {cite:muntazam-ibn-al-jawzi j.8 p.455-456}، وفي ٤٣٥ رُسّل إلى طغربك بتقبيح ما فعل في البلاد والأمر بالإحسان في الرعية فتلقّاه طغربك أربعة فراسخ إجلالًا لرسالة الخليفة {cite:muntazam-ibn-al-jawzi j.8 p.457-458}."
  en: "Abu al-Hasan Ali ibn Muhammad al-Mawardi al-Shafi'i, d. AH 450 — author of A'lam al-Tubwa, a twenty-one-chapter epitome on the proofs of prophethood {cite:kashf-zunun-furqan p. 518}."
  ur: "ابوالحسن علی بن محمد ماوردی شافعی، وفات 450ھ — «اعلام النبوۃ» کے مؤلف، نبوت کی دلائل پر اکیس بابوں پر مشتمل مختصر کتاب {cite:kashf-zunun-furqan p. 518}۔"
