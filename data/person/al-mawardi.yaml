label: { ar: "الماوردي", en: "al-Mawardi", fr: "al-Mawardi", ur: "ماوردی", es: "al-Mawardi" }
summary:
  ar: "الشيخ الإمام أبو الحسن علي بن محمد الماوردي البصري الشافعي المتوفى سنة ٤٥٠هـ؛ كان من وجوه فقهاء الشافعية وولي القضاء ببلدان كثيرة، وله تصانيف كثيرة في أصول الفقه وفروعه منها المقترن والنكت في التفسير والأحكام السلطانية وقوانين الوزراء والحكم والأمثال، وكان يقول «بسطت الفقه في أربعة آلاف ورقة وقد اختصرته في أربعين» يريد بالمبسوط الحاوي وبالختصر الإقناع {cite:muntazam-ibn-al-jawzi j.8 p.199}؛ وصاحب أعلام النبوة المختصر المشتمل على أحد وعشرين باباً {cite:kashf-zunun-furqan p. 518}. ويحكي ابن الجوزي عنه أن الخليفة وجّهه إلى عماد الدين أبي كليجار بالأهواز سنة ٤٢٣ في أمر لقبه، فردّ «السلطان المعظم» إذ هو من ألقاب الخليفة نفسه، وسائر ما يرويه بضمير المتكلم من مفاوضته {cite:muntazam-ibn-al-jawzi j.8 p.407-409}. وفي رمضان ٤٢٩ امتنع من الجواز في لقب «ملك الملوك» لجلال الدولة فانقطع عن خدمته ثم استدعاه الملك بكرة العيد فأعظمه وقال له إنه لو حاباه لما زاد ما بينهما وإن مخالفته إنما كانت للدين {cite:muntazam-ibn-al-jawzi j.8 p.439-440}. وفي سنة ٤٣٤ كان رسول الخليفة بتوقيعه إلى جلال الدولة في شأن الجوالي — يقول «خرج التوقيع من الخليفة وكنت أنا الرسول» {cite:muntazam-ibn-al-jawzi j.8 p.455-456}، وفي ٤٣٥ رُسّل إلى طغربك بتقبيح ما فعل في البلاد والأمر بالإحسان في الرعية فتلقّاه طغربك أربعة فراسخ إجلالًا لرسالة الخليفة {cite:muntazam-ibn-al-jawzi j.8 p.457-458}."
  en: "Abu al-Hasan Ali ibn Muhammad al-Mawardi al-Shafi'i, d. AH 450 — author of A'lam al-Tubwa, a twenty-one-chapter epitome on the proofs of prophethood {cite:kashf-zunun-furqan p. 518}."
  fr: "Abu al-Hasan Ali ibn Muhammad al-Mawardi al-Shafi'i, mort en 450 de l’hégire - auteur de A'lam al-Tubwa, une quintessence de vingt et un chapitres sur les preuves de la prophétie {cite:kashf-zunun-furqan p. 518}."
  ur: "ابوالحسن علی بن محمد ماوردی شافعی، وفات 450ھ — «اعلام النبوۃ» کے مؤلف، نبوت کی دلائل پر اکیس بابوں پر مشتمل مختصر کتاب {cite:kashf-zunun-furqan p. 518}۔"
  es: "Abu al-Hasan Ali ibn Muhammad al-Mawardi al-Shafi'i, m. 450 H.H. autor de A'lam al-Tubwa, un epítome de veintiún capítulos sobre las pruebas de la profecía {citar:kashf-zunun-furqan p. 518}."
  tr: "450 Hicri'de ölen Şeyh İmam Ebu el-Hasan Ali bin Muhammed el-Mawardi el-Basri el-Şafi'i, önde gelen Şafii hukukçularından biriydi ve birçok ülkede yargıç olarak görev yaptı. Fıkıh ilkeleri ve dalları üzerine birçok eser yazdı; bunlar arasında Al-Muqtarin, Al-Nukat fi al-Tafsir, al-Ahkam al-Sultani, Qawanun al-Wazir, al-Hukm ve Süleyman'ın Atasözleri bulunmaktadır. Genellikle şöyle derdi: \"Fihiyi dört bin sayfaya genişlettim ve kırk sayfaya yoğunlaştırdım.\" 'al-mabsut' ile 'ikna edici' anlamına gelir {cite:muntazam-ibn-al-jawzi j.8 s.199}; ve yirmi bir bölümden oluşan A'lam al-Nubuwwwah'ın yazarıdır {cite:kashf-zunun-furqan, s. 518}. İbn al-Jawzi, halifenin 423 Hicri yılında Ahvaz'da Imadeddin Ebu Kalijar'a unvanı hakkında hitap ettiğini ona anlatır. O da 'büyük Sultan' diye cevap verir; bu, halifenin kendisinin unvanlarından biridir ve bunların hepsini birinci şahıs olarak anlatır {atıf:Muntazam-ibn-al-jawzi J.8 s.407-409}. Ramazan 429'da, Celal-Devle'ye 'Kralların Kralı' unvanını kabul etmeyi reddetti ve hizmetini bıraktı. Sonra kral, bayram arifesinde onu çağırdı, onurlandırdı ve eğer onu sevseydi anlaşmazlıklarını artırmayacağını, muhalefetinin sadece din için olduğunu söyledi {cite:Muntazam-ibn-al-jawzi J.8 s.439-440}. 434 yılında, halifenin elçisi Celal-Devle'ye el-Cewali ile ilgili olarak imzaladı ve şöyle dedi: \"Imza halifeden geldi, ben elçiydim\" {atıf:Muntazam-ibn-al-Jawzi j.8 s.455-456}. 435 yılında, Tughribak'a elçiler göndererek ülkede yaptıklarını kınadı ve tebaalar arasında iyilik emretti; Tughribak da halifenin mesajına saygı göstererek ona dört farsakh aldı {cite:Muntazam-ibn-al-Jawzi j.8 s.457-458}."
  id: "Sheikh Imam Abu al-Hasan Ali ibn Muhammad al-Mawardi al-Basri al-Shafi'i, yang meninggal pada tahun 450 H, adalah salah satu ahli hukum Shafi'i terkemuka dan pernah menjabat sebagai hakim di banyak negara. Ia menulis banyak karya tentang prinsip fiksi dan cabangnya, termasuk Al-Muqtarin, Al-Nukat fi al-Tafsir, al-Ahkam al-Sultani, Qawanun al-Wazir, al-Hukm, dan Amsal. Ia biasa berkata, \"Saya telah memperluas yurisprudensi dalam empat ribu halaman dan meringkasnya menjadi empat puluh halaman.\" Dengan 'al-mabsut,' ia maksudkan 'meyakinkan' {cite:muntazam-ibn-al-jawzi j.8 hlm.199}; dan penulis A'lam al-Nubuwwwah, yang mencakup dua puluh satu bab {cite:kashf-zunun-furqan, hlm. 518}. Ibn al-Jawzi menceritakan darinya bahwa khalifah memanggilnya kepada Imad al-Din Abu Kalijar dalam Ahvaz pada tahun 423 H mengenai gelarnya. Ia menjawab 'Sultan Agung,' yang merupakan salah satu gelar khalifah itu sendiri, dan semua yang ia ceritakan dalam negosiasi orang pertama {cite:Muntazam-ibn-al-jawzi J.8 hlm.407-409}. Pada Ramadan 429, ia menolak menerima gelar 'Raja segala Raja' kepada Jalal al-Dawla, sehingga ia menghentikan pelayanannya. Kemudian raja memanggilnya pada malam Idul Fitri, menghormatinya, dan berkata bahwa jika ia mencintainya, ia tidak akan memperbesar perselisihan mereka, dan bahwa penentangannya hanya karena agama {cite:Muntazam-ibn-al-jawzi J.8 hlm.439-440}. Pada tahun 434, utusan khalifah menandatanganinya kepada Jalal al-Dawla mengenai al-Jawali, dengan mengatakan, \"Tanda tangan itu berasal dari khalifah, dan aku adalah utusan\" {cite:muntazam-ibn-al-jawzi j.8 hlm.455-456}. Pada tahun 435, ia mengirim utusan kepada Tughribak mengutuk apa yang telah dilakukannya di tanah itu dan memerintahkan kebaikan di antara rakyat, dan Tughribak menerima empat farsakh sebagai penghormatan atas pesan khalifah {cite:muntazam-ibn-al-jawzi j.8 hlm.457-458}."
