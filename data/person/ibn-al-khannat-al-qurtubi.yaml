summary:
  ar: "شاعر قرطبي أصمعي كان أبوه يبيع الحنطة بقرطبة؛ تعهد بنوه بنو ذكوان بالتعليم واتصل بدولة بني حمود وكان من شعراء علي بن حمود المختصين به، وتوفي سنة سبع وثلاثين وأربعمائة {cite:nafh-tib-maqqari p. 519}."
  en: "Cordoban poet of humble origin — his father sold wheat — whom the Banu Dhi'l-Nun educated and who became the Hammudid court poet, dying in 437 {cite:nafh-tib-maqqari p. 519}."
  es: "Poeta cordobés de origen humilde —su padre vendía trigo— a quien los Banu Dhi'l-Nun educaron y que se convirtió en poeta de la corte Hammudí, muriendo en 437 {cite:nafh-tib-maqqari p. 519}."
  fr: "Poète cordouan d'origine humble — son père vendait du blé — éduqué par les Banu Dhi'l-Nun et devenu poète de cour hammudide, mourant en 437 {cite:nafh-tib-maqqari p. 519}."
  ur: "قرطبی شاعر جو عاجز ہے - اس کے والد نے گندم بیچی - جسے بنو ذی النون نے تعلیم دی اور جو حمود کے درباری شاعر بن گئے، 437 میں انتقال کر گئے۔ 519}۔"
  tr: "Babası Cordoba'da buğday satan bir Kordobalı şairdi; oğulları Banu Dhakwan eğitimi emanet etti ve Hammud devletiyle bağlantılıydı. Ali ibn Hamoud'un bu konuda uzmanlaşmış şairleri arasındaydı ve dört yüz otuz yedi yaşında vefat etti {cite:nafh-tib-maqqari, s. 519}."
  id: "Seorang penyair Cordoba yang ayahnya menjual gandum di Cordoba; putranya, Banu Dhakwan, mempercayakan pendidikan dan terhubung dengan negara Hammud. Ia termasuk di antara penyair Ali ibn Hamoud yang mengkhususkan diri di bidang itu, dan ia meninggal pada tahun empat ratus tiga puluh tujuh {cite:nafh-tib-maqqari, hlm. 519}."
