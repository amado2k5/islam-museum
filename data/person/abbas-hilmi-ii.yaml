summary:
  ar: "الخديوي عباس حلمي الثاني، وُلد في الإسكندرية سنة 1874م، وتولّى حكم مصر سنة 1892م، ثم خُلع سنة 1914م بعد أن أعلنت بريطانيا الحماية على مصر، وتوفي في جنيف سنة 1944م. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
  en: "Khedive of Egypt, born in Alexandria on 14 July 1874. He succeeded his father Tawfiq on 8 January 1892. The British proclaimed a protectorate over Egypt in December 1914 and deposed him, and he lived in Istanbul, Vienna and Switzerland, dying in Geneva on 20 December 1944. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
  ur: "مصر کے خدیو، جو 14 جولائی 1874 کو اسکندریہ میں پیدا ہوئے۔ 8 جنوری 1892 کو تخت پر بیٹھے۔ دسمبر 1914 میں برطانیہ نے مصر پر تحفظ کا اعلان کیا اور انہیں معزول کر دیا۔ 20 دسمبر 1944 کو جنیوا میں وفات پائی۔ {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
