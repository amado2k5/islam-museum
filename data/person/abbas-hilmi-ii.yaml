id: person/abbas-hilmi-ii
class: person
label: { ar: "عباس حلمي الثاني", en: "Abbas Hilmi II", fr: "Abbas Hilmi II", ur: "عباس حلمی ثانی", es: "Abbas Hilmi II" }
summary:
  ar: "الخديوي عباس حلمي الثاني، وُلد في الإسكندرية سنة 1874م، وتولّى حكم مصر سنة 1892م، ثم خُلع سنة 1914م بعد أن أعلنت بريطانيا الحماية على مصر، وتوفي في جنيف سنة 1944م. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
  en: "Khedive of Egypt, born in Alexandria on 14 July 1874. He succeeded his father Tawfiq on 8 January 1892. The British proclaimed a protectorate over Egypt in December 1914 and deposed him, and he lived in Istanbul, Vienna and Switzerland, dying in Geneva on 20 December 1944. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
  fr: "Khédive d'Égypte, né à Alexandrie le 14 juillet 1874. Il succéda à son père Tawfiq le 8 janvier 1892. Les Britanniques proclamèrent un protectorat sur l'Égypte en décembre 1914 et le déposèrent ; il vécut à Istanbul, à Vienne et en Suisse, et mourut à Genève le 20 décembre 1944. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
  ur: "مصر کے خدیو، جو 14 جولائی 1874 کو اسکندریہ میں پیدا ہوئے۔ 8 جنوری 1892 کو تخت پر بیٹھے۔ دسمبر 1914 میں برطانیہ نے مصر پر تحفظ کا اعلان کیا اور انہیں معزول کر دیا۔ 20 دسمبر 1944 کو جنیوا میں وفات پائی۔ {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
  es: "Jedive de Egipto, nacido en Alejandría el 14 de julio de 1874. Sucedió a su padre, Tawfiq, el 8 de enero de 1892. Los británicos proclamaron un protectorado sobre Egipto en diciembre de 1914 y lo depusieron. Vivió en Estambul, Viena y Suiza, y falleció en Ginebra el 20 de diciembre de 1944. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
  tr: "Hidiv Abbas Hilmi II, 1874 yılında İskenderiye'de doğdu. 1892'de Mısır'ın yönetimini üstlendi, İngiltere'nin Mısır üzerinde himaye ilan etmesinin ardından 1914'te görevden alındı ve 1944'te Cenevre'de öldü. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
  id: "Khedive Abbas Hilmi II lahir di Alexandria pada tahun 1874. Ia mengambil alih kekuasaan Mesir pada tahun 1892, digulingkan pada tahun 1914 setelah Inggris mendeklarasikan protektorat atas Mesir, dan meninggal di Jenewa pada tahun 1944. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 32–34}"
