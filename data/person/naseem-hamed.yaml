summary:
  ar: "ملاكم بريطاني محترف سابق (وُلد سنة 1974 في شفيلد لأبوين يمنيين)، نافس بين عامي 1992 و2002. حمل ألقاب منظمة الملاكمة العالمية والاتحاد الدولي للملاكمة والمجلس العالمي للملاكمة في وزن الريشة بين 1995 و2000، وكان البطل الخطي من 1998 إلى 2001، واعتزل بسجل 36 فوزا (31 بالضربة القاضية) وهزيمة واحدة، وأُدرج في قاعة مشاهير الملاكمة الدولية سنة 2015. عُرف بدخلاته الاستعراضية إلى الحلبة وبتلاوته التكبير بصوت عال قبل نزالاته."
  en: "British former professional boxer (born 1974 in Sheffield, to Yemeni parents) who competed from 1992 to 2002. He held the WBO, IBF and WBC featherweight titles between 1995 and 2000, reigned as lineal champion from 1998 to 2001, retired with a record of 36 wins (31 by knockout) and one loss, and was inducted into the International Boxing Hall of Fame in 2015. He was known for his theatrical ring entrances and for reciting the takbir aloud before his fights."
  ur: "برطانوی سابق پیشہ ور مکے باز (پیدائش 1974، شیفیلڈ، یمنی والدین کے ہاں) جنہوں نے 1992 سے 2002 تک مقابلے کیے۔ انہوں نے 1995 سے 2000 کے درمیان ڈبلیو بی او، آئی بی ایف اور ڈبلیو بی سی فیدر ویٹ ٹائٹل رکھے، 1998 سے 2001 تک لائنل چیمپئن رہے، 36 فتوحات (31 ناک آؤٹ) اور ایک شکست کے ریکارڈ کے ساتھ ریٹائر ہوئے، اور 2015 میں بین الاقوامی باکسنگ ہال آف فیم میں شامل کیے گئے۔ وہ اپنے نمائشی اندازِ داخلے اور لڑائی سے پہلے بلند آواز تکبیر پڑھنے کے لیے مشہور تھے۔"
