summary:
  ar: "الصدر الأعظم أحمد كوبريللي ابن محمد كوبريللي؛ سار على نهج أبيه في رد هجمات الحلف المقدس. رفض الصلح مع النمسا والبندقية وسار على رأس جيش لقتال النمسا، ففتح عام ١٠٧٤هـ أعظم قلعة في النمسا وهي قلعة نوهزل شرقي فيينا في ٢٥ صفر ١٠٧٤هـ/٢٨ سبتمبر ١٦٦٣م. وفي عهده حاولت فرنسا التقرب من الدولة وتجديد الامتيازات فرفض، ولما أرسل لويس الرابع عشر السفير الفرنسي مع أسطول حربي للتهديد زاده ذلك ثباتاً وقال: إن الامتيازات كانت منحة وليست معاهدة واجبة التنفيذ، فتراجعت فرنسا واستعملت سياسة اللين حتى جددت لها المعاهدات القديمة. وبوفاته ضعف النظام العثماني فهاجمت النمسا بلاد المجر واغتصبت نوهزل وبست وبودا {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  en: "Fazıl Ahmed Köprülü (d. ~1676) — took Neuhausl, Austria's greatest fortress, in September 1663, and faced down Louis XIV's gunboat diplomacy: 'the capitulations were a grant, not an executable treaty.' His death broke the dam: Austria seized Buda and Venice took Athens {cite:dawlat-uthmaniyya-salabi p. 307-308}."
