summary:
  ar: "الصدر الأعظم أحمد كوبريللي ابن محمد كوبريللي؛ سار على نهج أبيه في رد هجمات الحلف المقدس. رفض الصلح مع النمسا والبندقية وسار على رأس جيش لقتال النمسا، ففتح عام ١٠٧٤هـ أعظم قلعة في النمسا وهي قلعة نوهزل شرقي فيينا في ٢٥ صفر ١٠٧٤هـ/٢٨ سبتمبر ١٦٦٣م. وفي عهده حاولت فرنسا التقرب من الدولة وتجديد الامتيازات فرفض، ولما أرسل لويس الرابع عشر السفير الفرنسي مع أسطول حربي للتهديد زاده ذلك ثباتاً وقال: إن الامتيازات كانت منحة وليست معاهدة واجبة التنفيذ، فتراجعت فرنسا واستعملت سياسة اللين حتى جددت لها المعاهدات القديمة. وبوفاته ضعف النظام العثماني فهاجمت النمسا بلاد المجر واغتصبت نوهزل وبست وبودا {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  en: "Fazıl Ahmed Köprülü (d. ~1676) — took Neuhausl, Austria's greatest fortress, in September 1663, and faced down Louis XIV's gunboat diplomacy: 'the capitulations were a grant, not an executable treaty.' His death broke the dam: Austria seized Buda and Venice took Athens {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  es: "Fazıl Ahmed Köprülü (fallecido alrededor de 1676) tomó Neuhausl, la fortaleza más importante de Austria, en septiembre de 1663, y se enfrentó a la diplomacia de las cañoneras de Luis XIV: «las capitulaciones fueron una concesión, no un tratado ejecutable». Su muerte rompió el dique: Austria se apoderó de Buda y Venecia tomó Atenas {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  fr: "Fazıl Ahmed Köprülü (d. ~1676) — prit Neuhausl, la plus grande forteresse d'Autriche, en septembre 1663, et fit face à la diplomatie de la canonnière de Louis XIV: « les capitulations étaient une concession, pas un traité exécutoire ». Sa mort brisa le barrage: l'Autriche s'empara de Buda et Venise prit Athènes {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  ur: "فضل احمد کوپرلو ⁦(متوفی ~1676)⁩ - ستمبر 1663 میں آسٹریا کے سب سے بڑے قلعے نیوہاؤسل پر قبضہ کیا، اور لوئس XIV کی گن بوٹ ڈپلومیسی کا سامنا کرنا پڑا: 'تسلیمات ایک گرانٹ تھے، قابل عمل معاہدہ نہیں۔' اس کی موت نے ڈیم کو توڑ دیا: آسٹریا نے بوڈا پر قبضہ کر لیا اور وینس نے ایتھنز پر قبضہ کر لیا۔ 307-308}۔"
  tr: "Muhammed Koprilli'nin oğlu Sadrazam Ahmed Koprilli, babasının yolunu izleyerek Kutsal İttifak'ın saldırılarını püskürttü. Avusturya ve Venedik ile barış yapmayı reddetti ve ordu başında Avusturya ile savaşmak üzere yürüdü. 1074 Hicri'de, 25 Safar 1074 Hicri / 28 Eylül 1663'te Viyana'nın doğusundaki Avusturya'nın en büyük kalesi olan Neuhsel Kalesi'ni fethetti. Saltanatı sırasında Fransa, devlete yaklaşmaya ve ayrıcalıklarını yenilemeye çalıştı, ancak o reddetti. XIV. Louis, Fransız elçisini askeri filosuyla tehdit etmek için gönderdiğinde, bunu pekiştirdi ve tavizlerin bağlayıcı antlaşmalar değil, hibe olduğunu söyledi. Fransa geri çekildi ve eski antlaşmalar yenilenene kadar hoşgörü politikası uyguladı. Onun ölümüyle Osmanlı rejimi zayıfladı, bu yüzden Avusturya Macaristan'a saldırdı ve Nohzel, Best ile Buda'ya tecavüz etti {cite:dawlat-uthmaniyya-salabi s. 307-308}."
  id: "Grand Vizier Ahmed Koprilli, putra Muhammad Koprilli, mengikuti jejak ayahnya dalam menangkis serangan Aliansi Suci. Ia menolak berdamai dengan Austria dan Venesia dan memimpin pasukan untuk melawan Austria. Pada tahun 1074 H, ia menaklukkan benteng terbesar di Austria, Kastil Neuhsel, di timur Wina, pada 25 Safar 1074 H / 28 September 1663 M. Selama pemerintahannya, Prancis berusaha mendekatkan diri dengan negara dan memperbarui hak istimewanya, tetapi ia menolak. Ketika Louis XIV mengirim duta besar Prancis dengan armada militer untuk mengancamnya, ia menegaskan hal ini dan mengatakan bahwa konsesi tersebut adalah pemberian, bukan perjanjian yang mengikat. Prancis mundur dan menggunakan kebijakan kelonggaran sampai perjanjian lama diperbarui untuknya. Dengan kematiannya, rezim Ottoman melemah, sehingga Austria menyerang Hungaria dan memperkosa Nohzel, Best, dan Buda {cite:dawlat-uthmaniyya-salabi hlm. 307-308}."
