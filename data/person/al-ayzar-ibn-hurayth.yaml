summary:
  ar: "راوٍ كوفي؛ عند البلاذري نقل جدولاً بديلاً لضرائب عمر على السواد: على جريب الحنطة درهمين وجريبين وعلى جريب الشعير درهماً وجريباً وعلى جريب الكرم عشرة دراهم وعلى جريب الرطبة عشرة دراهم وعلى جريب القطن خمسة دراهم وعلى النخلة من الفارسي درهماً وعلى الدقلتين درهماً."
  en: "Kufan narrator; in al-Baladhuri he transmits an alternative table of Umar's Sawad levies — two dirhams and two jaribs per wheat jarib, a dirham and jarib on barley, ten on vine, ten on ratba, five on cotton, a dirham per Farsi palm and on the two daqal grades."
