id: person/al-ayzar-ibn-hurayth
class: person
label: { ar: "العيزار بن حريث", en: "al-Ayzar ibn Hurayth", fr: "Al-Ayzar ibn Hurayth", es: "al-Ayzar ibn Hurayth", ur: "الاثار ابن حریث" }
summary:
  ar: "راوٍ كوفي؛ عند البلاذري نقل جدولاً بديلاً لضرائب عمر على السواد: على جريب الحنطة درهمين وجريبين وعلى جريب الشعير درهماً وجريباً وعلى جريب الكرم عشرة دراهم وعلى جريب الرطبة عشرة دراهم وعلى جريب القطن خمسة دراهم وعلى النخلة من الفارسي درهماً وعلى الدقلتين درهماً."
  en: "Kufan narrator; in al-Baladhuri he transmits an alternative table of Umar's Sawad levies — two dirhams and two jaribs per wheat jarib, a dirham and jarib on barley, ten on vine, ten on ratba, five on cotton, a dirham per Farsi palm and on the two daqal grades."
  fr: "Narrateur de Kufa ; chez al-Baladhuri, il transmet un autre barème des prélèvements d’Umar dans le Sawad — deux dirhams et deux jaribs par jarib de blé, un dirham et un jarib pour l’orge, dix pour la vigne, dix pour la ratba, cinq pour le coton, un dirham par palmier farsi et sur les deux catégories de daqal."
  es: "narrador kufan; en al-Baladhuri transmite una tabla alternativa de los impuestos Sawad de Umar: dos dirhams y dos jaribs por jarib de trigo, un dirham y jarib por cebada, diez por vid, diez por ratba, cinco por algodón, un dirham por palma farsi y por los dos grados de daqal."
  ur: "کوفان راوی؛ البلادوری میں وہ عمر کی سواد لیویز کا ایک متبادل جدول منتقل کرتا ہے - دو درہم اور دو جریب فی گندم کے جریب، ایک درہم اور جریب جو پر، دس بیل پر، دس رتبہ پر، پانچ کپاس پر، ایک درہم فی فارسی کھجور اور دو دقال درجات پر۔"
  tr: "Küfeli bir rivayetçi olan El-Baladhuri, Ömer'in Sawad'dan aldığı vergilere ilişkin alternatif bir tabloyu şöyle aktarmıştır: bir jarib buğday için iki dirhem ve iki jarib; bir jarib arpa için bir dirhem ve bir jarib; bir jarib bağ için on dirhem; bir jarib taze hurma için on dirhem; bir jarib pamuk için beş dirhem; bir hurma ağacı için bir dirhem; ve iki hurma için bir dirhem."
  id: "Seorang perawi dari Kufan, Al-Baladhuri, meriwayatkan tabel alternatif pajak Umar atas suku Sawad: untuk satu jarib gandum, dua dirham dan dua jarib; untuk satu jarib jelai, satu dirham dan satu jarib; untuk satu jarib kebun anggur, sepuluh dirham; untuk satu jarib kurma segar, sepuluh dirham; untuk satu jarib kapas, lima dirham; untuk satu pohon kurma Persia, satu dirham; dan untuk dua buah kurma, satu dirham."
