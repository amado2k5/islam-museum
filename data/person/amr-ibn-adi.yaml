summary:
  en: "The first Lakhmid king of al-Hira, appointed after Jadhima al-Abrash’s death in the reign of Shapur son of Ardashir; from him the Lakhmid kings succeeded each other until Khosrow replaced them with Persian governors."
  ar: "أول ملوك اللخميين على الحيرة؛ وُلي بعد موت جذيمة في عهد كسرى سابور بن أردشير، فلم تزل الملوك من اللخميين تتوالى عليها حتى ولّى الفرس عاملاً فارسياً. وعند المسعودي أنه ابن رقاش بنت مالك أخت جذيمة من عدي بن نصر بن ربيعة اللخمي الذي كان نديم جذيمة وساقيه، فعشقته رقاش فقالت له إذا سقيت القوم فامزج لهم وغدق للملك فإذا أخذت الخمر منه فاخطبني منه، ففعل فتزوجها وهرب عدي وولدت عمرو، فكان أول من نزل من الملوك الحيرة واتخذها دار ملك وإليه تنسب الملوك النصرانية، وكان ملكه مائة سنة {cite:muruj-al-dhahab p. 409-412}"
