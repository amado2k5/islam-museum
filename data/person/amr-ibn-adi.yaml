summary:
  en: "The first Lakhmid king of al-Hira, appointed after Jadhima al-Abrash’s death in the reign of Shapur son of Ardashir; from him the Lakhmid kings succeeded each other until Khosrow replaced them with Persian governors."
  ar: "أول ملوك اللخميين على الحيرة؛ وُلي بعد موت جذيمة في عهد كسرى سابور بن أردشير، فلم تزل الملوك من اللخميين تتوالى عليها حتى ولّى الفرس عاملاً فارسياً. وعند المسعودي أنه ابن رقاش بنت مالك أخت جذيمة من عدي بن نصر بن ربيعة اللخمي الذي كان نديم جذيمة وساقيه، فعشقته رقاش فقالت له إذا سقيت القوم فامزج لهم وغدق للملك فإذا أخذت الخمر منه فاخطبني منه، ففعل فتزوجها وهرب عدي وولدت عمرو، فكان أول من نزل من الملوك الحيرة واتخذها دار ملك وإليه تنسب الملوك النصرانية، وكان ملكه مائة سنة {cite:muruj-al-dhahab p. 409-412}"
  es: "El primer rey lajmí de al-Hira fue nombrado tras la muerte de Jadhima al-Abrash durante el reinado de Shapur, hijo de Ardashir; a partir de él, los reyes lajmíes se sucedieron unos a otros hasta que Khosrow los reemplazó con gobernadores persas."
  fr: "Le premier roi Lakhmid d'al-Hira, nommé après la mort de Jadhima al-Abrash sous le règne de Shapur fils d'Ardashir; à partir de lui, les rois Lakhmid se sont succédé jusqu'à ce que Khosrow les remplace par des gouverneurs persans."
  ur: "الحیرہ کا پہلا لخمید بادشاہ، جو اردشیر کے بیٹے شاپور کے دور حکومت میں جدیمہ الابرش کی موت کے بعد مقرر کیا گیا تھا۔ اس سے لخمید بادشاہ ایک دوسرے کے جانشین ہوئے یہاں تک کہ خسرو نے ان کی جگہ فارسی گورنروں کو لے لیا۔"
  tr: "Lakhmilerin el-Hirah üzerindeki ilk kralı, Khosrow döneminde Cadhima'nın ölümünden sonra Sapur ibn Ardashir atandı. Lakhmid kralları, Persler Perslerin valisi olana kadar tahta çıkmaya devam etti. al-Mas'udi'ye göre, Jadhima'nın kardeşi Rakash bint Malik'in oğluydu; Jadhima'nın yoldaşı ve kadeh taşıyıcısı olan 'Adi ibn Nasr ibn Rabi'ah al-Lakhmi'dir. Rakash ona aşık oldu ve şöyle dedi: 'Halka su verirsen, karıştır ve krala dök. Ondan şarap aldığında, ondan bana evlenme teklif et.' O da öyle yaptı, onunla evlendi ve 'Adi kaçtı, Amr doğurdu. Al-Hirah'a yerleşen ilk kral oldu ve burası Hristiyan kralların atfedildiği bir kralın ikametgahı oldu. Hükümdarlığı yüz yıl sürdü. {cite:] Muruj-al-Dhahab, s. 409-412}"
  id: "Raja pertama Lakhmid atas al-Hirah diangkat setelah kematian Jadhima pada masa pemerintahan Khosrow, Sapur ibn Ardashir. Raja-raja Lakhmid terus mewarisi hingga bangsa Persia menjadi gubernur Persia. Menurut al-Mas'udi, ia adalah putra Raqash bint Malik, saudari Jadhima, dari 'Adi ibn Nasr ibn Rabi'ah al-Lakhmi, yang merupakan sahabat dan pembawa cawan Jadhima. Raqash jatuh cinta padanya dan berkata kepadanya, 'Jika kau memberi rakyat air, campurkan air itu untuk mereka dan tuangkan kepada raja. Ketika kau mengambil anggur darinya, tawarkanlah padaku darinya.' Ia melakukannya, menikahinya, dan 'Adi melarikan diri, dan Amr melahirkan. Ia adalah raja pertama yang menetap di al-Hirah, menjadikannya kediaman seorang raja, yang dikaitkan dengan raja-raja Kristen. Pemerintahannya berlangsung seratus tahun. {cite:Muruj-al-Dhahab, hlm. 409-412}"
