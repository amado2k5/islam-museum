    ar: "عمرو بن عدي أول ملوك اللخميين على الحيرة، وليها بعد موت جذيمة في عهد كسرى سابور، ولم تزل ملوك اللخم تتوالى عليها حتى ولّى الفرس عاملاً."
    en: "Amr ibn Adi was the first Lakhmid king over al-Hira, installed after Jadhima's death under Khusraw Sabur; the Lakhmid kings held it in succession until the Persians appointed their own governor."
