summary:
  ar: "عبد الملك بن عمر بن عبد العزيز، أمير أموي ابن الخليفة عمر بن عبد العزيز، لازم أباه وكان من أحب الناس إليه، ومات قبيل وفاة أبيه في دير سمعان بالمعرة سنة 101 هـ ⁦(719 م)⁩ بحسب الأعلام، ولابن رجب رسالة في سيرته."
  en: "Abd al-Malik ibn Umar ibn Abd al-Aziz, an Umayyad prince, son of the caliph Umar ibn Abd al-Aziz, who stayed at his father's side and was among those dearest to him; he died shortly before his father at Dayr Sim'an near al-Ma'arra in 101 AH (719 CE according to al-A'lam), and Ibn Rajab wrote a treatise on his life."
