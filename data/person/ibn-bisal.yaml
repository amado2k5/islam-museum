summary:
  ar: "نور الدين ابن بصال الإسكندراني المشهور قديماً بابن السقطي؛ ولد سنة ثلاث وسبعين وسبعمائة قال ابن حجر واشتغل كثيراً في عدة فنون ولم يكن بالماهر وكان يتعانى توقيع الإنشاء وسمع من سراج الدين بن الملقن وغيره وكتب بخطه كثيراً من تصانيف ابن الملقن وحدث باليسير ولازم مجالس الإملاء عندي نحواً من عشرين سنة، وتوفي آخر يوم الأربعاء ثالث عشر جمادى الأولى سنة سبع وأربعين وثمانمائة {cite:shadharat-dhahab p. 260-261}."
  en: "Ibn Bisal of Alexandria (b. 773) — Ibn Hajar's own twenty-year companion in his dictation sessions ('he attended my imla' some twenty years'); copied much of Ibn al-Mulaqqin's corpus in his own hand; died end of Wednesday 13 Jumada I 847 {cite:shadharat-dhahab p. 260-261}."
