summary:
  ar: "نور الدين ابن بصال الإسكندراني المشهور قديماً بابن السقطي؛ ولد سنة ثلاث وسبعين وسبعمائة قال ابن حجر واشتغل كثيراً في عدة فنون ولم يكن بالماهر وكان يتعانى توقيع الإنشاء وسمع من سراج الدين بن الملقن وغيره وكتب بخطه كثيراً من تصانيف ابن الملقن وحدث باليسير ولازم مجالس الإملاء عندي نحواً من عشرين سنة، وتوفي آخر يوم الأربعاء ثالث عشر جمادى الأولى سنة سبع وأربعين وثمانمائة {cite:shadharat-dhahab p. 260-261}."
  en: "Ibn Bisal of Alexandria (b. 773) — Ibn Hajar's own twenty-year companion in his dictation sessions ('he attended my imla' some twenty years'); copied much of Ibn al-Mulaqqin's corpus in his own hand; died end of Wednesday 13 Jumada I 847 {cite:shadharat-dhahab p. 260-261}."
  es: "Ibn Bisal de Alejandría (n. 773) — Compañero de Ibn Hajar durante veinte años en sus sesiones de dictado («asistió a mi imla durante unos veinte años»); copió gran parte del corpus de Ibn al-Mulaqqin de su puño y letra; murió al final del miércoles 13 de Jumada I de 847 {cita: shadharat-dhahab págs. 260-261}."
  fr: "Ibn Bisal d'Alexandrie (né en 773) — Compagnon d'Ibn Hajar pendant vingt ans lors de ses séances de dictée (« il a assisté à mon imla pendant une vingtaine d'années »); a copié une grande partie du corpus d'Ibn al-Mulaqqin de sa propre main; est mort à la fin du mercredi 13 Jumada I 847 {cite: shadharat-dhahab p. 260-261}."
  ur: "ابن بسال آف سکندریہ ⁦(پیدائش 773)⁩ - ابن حجر کا اپنا بیس سالہ ساتھی اپنی ڈکٹیشن سیشنز میں ⁦('اس نے میرے امامہ میں تقریباً بیس سال شرکت کی')⁩؛ ابن الملقن کی بہت سی کتابیں اپنے ہاتھ سے نقل کیں۔ وفات بروز بدھ 13 جمادی الثانی 847۔ 260-261}۔"
  tr: "Nur al-Din Ibn Basal al-Iskandarani, eskiden İbn al-Saqati olarak bilinen, 773 Hicri yılında doğdu. İbn Hajar, birçok alanda yoğun çalıştığını ancak yetenekli olmadığını ve bestede zorlandığını söyledi. Siraj al-Din ibn al-Mulqān ve diğerlerinden dinledi. İbn al-Mulqān'ın birçok eserini kendi el yazısıyla yazdı, rahatlıkla konuştu ve yaklaşık yirmi yıl boyunca dikte oturumlarıma katıldı. 847 Hicri yılının 13'ü Çarşamba günü vefat etti {cite:shadharat-dhahab, s. 260-261}."
  id: "Nur al-Din Ibn Basal al-Iskandarani, sebelumnya dikenal sebagai Ibn al-Saqati, lahir pada tahun 773 H. Ibn Hajar mengatakan ia bekerja secara ekstensif di berbagai bidang tetapi tidak terampil dan kesulitan dalam komposisi. Ia mendengar dari Siraj al-Din ibn al-Mulqān dan lainnya. Ia menulis banyak karya Ibn al-Mulqān dengan tulisan tangannya, berbicara dengan mudah, dan menghadiri sesi dikte saya selama sekitar dua puluh tahun. Ia meninggal pada hari Rabu, 13 Jumada al-Awwal, 847 H {cite:shadharat-dhahab, hlm. 260-261}."
