summary:
  ar: "أنوشتكين الدزبري، قائد عساكر الخليفة الظاهر بمصر إلى الشام؛ كان عامله على البلاد إلى عسقلان فنازل حسان بن مفرج وقومه بني كلاب، ثم جهزه الظاهر سنة 429هـ لقتال صالح بن مرداس وحسان فلقيهما على الأردن بطبرية فانهزما وقتل صالحاً وابنه الأصغر."
  en: "Anushtakin al-Dizbiri, commander of the Fatimid caliph al-Zahir's armies to Syria; his authority reached Ascalon where he faced Hasan ibn Mufarrij and the Kilabis, then al-Zahir dispatched him in 429 AH against Salih ibn Mirdas and Hasan — he met them at the Jordan by Tiberias, routed them, and killed Salih and his younger son."
