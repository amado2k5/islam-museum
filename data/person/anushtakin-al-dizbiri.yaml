  fr: "Anushtakin al-Dizbiri"
  ur: "انوشتکین الدزبیری۔"
summary:
  ar: "أنوشتكين الدزبري، قائد عساكر الخليفة الظاهر بمصر إلى الشام؛ كان عامله على البلاد إلى عسقلان فنازل حسان بن مفرج وقومه بني كلاب، ثم جهزه الظاهر سنة 429هـ لقتال صالح بن مرداس وحسان فلقيهما على الأردن بطبرية فانهزما وقتل صالحاً وابنه الأصغر، ويذكره ابن الجوزي في أحداث سنة ٤٢٠ {cite:muntazam-ibn-al-jawzi j.8 p.388}."
  en: "Anushtakin al-Dizbiri, commander of the Fatimid caliph al-Zahir's armies to Syria; his authority reached Ascalon where he faced Hasan ibn Mufarrij and the Kilabis, then al-Zahir dispatched him in 429 AH against Salih ibn Mirdas and Hasan — he met them at the Jordan by Tiberias, routed them, and killed Salih and his younger son."
  es: "Anushtakin al-Dizbiri, comandante de los ejércitos del califa fatimí al-Zahir en Siria, llegó hasta Ascalón, donde se enfrentó a Hasan ibn Mufarrij y a los Kilabis. Posteriormente, en el año 429 de la Hégira, al-Zahir lo envió contra Salih ibn Mirdas y Hasan. Anushtakin los encontró en el Jordán, cerca de Tiberíades, los derrotó y mató a Salih y a su hijo menor."
  fr: "Anushtakin al-Dizbiri, commandant des armées du calife fatimide al-Zahir en Syrie; son autorité s'étendit jusqu'à Ascalon où il affronta Hasan ibn Mufarrij et les Kilabis, puis al-Zahir l'envoya en 429 AH contre Salih ibn Mirdas et Hasan — il les rencontra au Jourdain près de Tibériade, les mit en déroute et tua Salih et son plus jeune fils."
  ur: "انوشتاکین الدزبیری، شام میں فاطمی خلیفہ الظاہر کی فوجوں کے کمانڈر؛ اس کی حکومت اسکالون تک پہنچی جہاں اس کا مقابلہ حسن بن مفرج اور کلیابیوں سے ہوا، پھر الظاہر نے اسے 429 ہجری میں صالح بن مرداس اور حسن کے خلاف روانہ کیا - اس نے ان سے اردن کے مقام پر تبریاس کے ذریعے ملاقات کی، انہیں شکست دی، اور صالح اور اس کے چھوٹے بیٹے کو قتل کردیا۔"
