label: { ar: "كميل بن زياد النخعي", en: "Kumayl ibn Ziyad al-Nakha'i", es: "Kumayl ibn Ziyad al-Nakha'i", fr: "Kumayl ibn Ziyad al-Nakha'i", ur: "کمیل بن زیاد النخعی" }
summary:
  ar: "كميل بن زياد النخعي، من أصحاب علي بن أبي طالب الملازمين له. يروي الصلابي في هذا الجزء أن علياً أخذ بيده إلى ناحية الجبّان ⁦(الصحراء)⁩، فلما جلس وتنفس قال له: «يا كميل بن زياد، القلوب أوعية فخيرها أوعاها للعلم»، ثم فصّل له وصيته في العلماء وطلاب العلم والرعاع {cite:sallabi-ali-vol1 p. 201}. ولا يذكر هذا الجزء من أخبار كميل شيئاً بعد ذلك، فتبقى سيرته الأخرى خارج هذا النص."
  en: "Kumayl ibn Ziyad al-Nakha'i, one of Ali's close companions; Ali took him by the hand into the open desert and gave him counsel on knowledge and its people. This section of the book records no other episode of his life."
  es: "Kumayl ibn Ziyad al-Nakha'i, uno de los compañeros más cercanos de Ali, fue llevado de la mano al desierto y le ofreció consejos sobre el conocimiento y sus habitantes. Esta sección del libro no registra ningún otro episodio de su vida."
  fr: "Kumayl ibn Ziyad al-Nakha'i, un des proches compagnons d'Ali, fut emmené par ce dernier dans le désert où il reçut des conseils sur la connaissance et les peuples qui la peuplent. Ce passage du livre ne relate aucun autre épisode de sa vie."
  ur: "کمیل بن زیاد النخعی، علی کے قریبی ساتھیوں میں سے ایک؛ علی نے اس کا ہاتھ پکڑ کر کھلے صحرا میں لے لیا اور اسے علم اور اس کے لوگوں کے بارے میں نصیحت کی۔ کتاب کے اس حصے میں ان کی زندگی کا کوئی دوسرا واقعہ درج نہیں ہے۔"
  tr: "Kumayl bin Ziyad al-Nakha'i, Ali ibn Abi Talib'in yakın arkadaşlarından biridir. El-Sallabi bu bölümde, Ali'nin korkağın (çölün) yanına elini götürdüğünü, oturup nefes aldığında ona şöyle dediğini anlatır: \"Ey Kumayl ibn Ziyad, kalpler kaplardır, en iyileri bilgi için kaplardır,\" ardından bilginlere, bilgi öğrencilerine ve kalabalığa verdiği tavsiyeleri ayrıntılı olarak anlatmıştır {cite:sallabi-ali-cilt 1, s. 201}. Kumayl'in anlatımlarının bu kısmı bundan sonra anılmaz, bu yüzden diğer biyografisi bu metnin dışında kalmıştır."
  id: "Kumayl ibn Ziyad al-Nakha'i, salah satu sahabat Ali ibn Abi Talib yang dekat dengannya. Al-Sallabi menceritakan dalam bagian ini bahwa Ali mengangkat tangannya ke sisi pengecut (padang pasir), dan ketika dia duduk dan bernapas, dia berkata kepadanya: \"Wahai Kumayl ibn Ziyad, hati adalah wadah, maka yang terbaik adalah wadah untuk pengetahuan,\" lalu dia merinci nasihatnya kepada para cendekiawan, pelajar pengetahuan, dan gerombolan {cite:sallabi-ali-vol1, hlm. 201}. Bagian dari catatan Kumayil ini tidak disebutkan lagi setelah itu, sehingga biografi lainnya tetap berada di luar teks ini."
