summary:
  ar: "محمد جواد ظريف (وُلد 7 كانون الثاني 1960) دبلوماسي وأكاديمي إيراني، سفير بلاده لدى الأمم المتحدة 2002–2007، ووزير خارجيتها من 15 آب 2013 إلى 25 آب 2021 في حكومة حسن روحاني حيث قاد المفاوضات التي أنتجت الاتفاق النووي سنة 2015، ثم نائب الرئيس للشؤون الاستراتيجية من آب 2024 إلى آذار 2025."
  en: "Mohammad Javad Zarif (born 7 January 1960) is an Iranian diplomat and academic: ambassador to the United Nations 2002–2007, foreign minister from 15 August 2013 to 25 August 2021 under Hassan Rouhani, where he led the negotiations that produced the 2015 nuclear agreement, and vice president for strategic affairs from August 2024 to March 2025."
