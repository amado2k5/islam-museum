summary:
  ar: "كرمخو ألفا (نحو 1700 – نحو 1751)، واسمه إبراهيم موسى سمبغو، عالم فولاني قاد الجهاد الذي أسّس إمامة فوتا جلون في غينيا، أول دولة مسلمة يقيمها الفولبي في غرب أفريقيا. انتخبه تسعة من العلماء قائداً بعد نصر تالانسان، فحكم من تمبو مقيداً بمجلسهم، وعُرف بعلمه وتقواه، حتى غلبه الاستغراق في العبادة سنة 1748 فصار ابن عمه إبراهيم سوري قائداً فعلياً، ثم خلفه رسمياً عند وفاته نحو 1751."
  en: "Karamokho Alfa (c. 1700 – c. 1751), born Ibrahima Musa Sambeghu, was a Fula scholar who led the jihad that founded the Imamate of Futa Jallon in Guinea, the first Muslim state founded by the Fulbe in West Africa. Elected leader by the nine ulama after the victory at Talansan, he ruled from Timbo constrained by their council and was known for his scholarship and piety, until excessive devotion overcame him in 1748 and his cousin Ibrahim Sori became de facto leader, formally succeeding him at his death around 1751."
  ur: "کرمخو الفا (تقریباً 1700 – تقریباً 1751)، اصل نام ابراہیم موسیٰ سمبغو، فولانی عالم تھے جنھوں نے اس جہاد کی قیادت کی جس نے گنی میں فوٹا جالون کی امامت قائم کی، جو مغربی افریقہ میں فولبے کی قائم کردہ پہلی مسلم ریاست تھی۔ تالانسان کی فتح کے بعد نو علما نے انھیں قائد منتخب کیا؛ وہ ٹمبو سے حکومت کرتے رہے مگر ان کی مجلس کے پابند رہے، اور اپنے علم و تقویٰ کے لیے مشہور تھے، یہاں تک کہ 1748 میں عبادت میں حد سے زیادہ استغراق نے انھیں ناکارہ کر دیا اور ان کے چچا زاد بھائی ابراہیم سوری عملاً قائد بن گئے اور تقریباً 1751 میں ان کی وفات پر باقاعدہ جانشین ہوئے۔"

