summary:
  ar: "هامان وزير فرعون في القصة القرآنية. يقول عمر عبد الكافي إنه ذُكر في القرآن ست مرات ولم يجد له ذكرًا في التوراة والإنجيل، ويروي أن قراءة الهيروغليفية بعد حجر رشيد كشفت أنه كان وزيرًا للقلاع والإنشاءات، ويعدّ ذلك دليلًا على أن القرآن كلام الله؛ وهذا قوله."
  en: "Haman is Pharaoh's minister in the Qur'anic story. Omar Abdelkafy says he is mentioned six times in the Qur'an and that he found no mention of him in the Torah or Gospel, and relates that the reading of hieroglyphs after the Rosetta Stone showed he was minister of fortresses and building works, which he takes as proof that the Qur'an is God's word; this is his claim."
  ur: "ہامان قرآنی قصے میں فرعون کا وزیر ہے۔ عمر عبد الکافی کہتے ہیں کہ اس کا ذکر قرآن میں چھ بار آیا اور انہیں تورات و انجیل میں اس کا ذکر نہیں ملا، اور بیان کرتے ہیں کہ حجرِ رشید کے بعد ہیروگلیفی پڑھنے سے معلوم ہوا کہ وہ قلعوں اور تعمیرات کا وزیر تھا، اور وہ اسے قرآن کے کلام اللہ ہونے کی دلیل سمجھتے ہیں؛ یہ ان کا دعویٰ ہے۔"
  es: "En el relato coránico, Hamán es ministro del faraón. Omar Abdelkafy afirma que se le menciona seis veces en el Corán y que no encontró ninguna mención de él en la Torá ni en el Evangelio. Relata que la lectura de los jeroglíficos tras el descubrimiento de la Piedra Rosetta reveló que era ministro de fortalezas y obras de construcción, lo que él considera prueba de que el Corán es la palabra de Dios. Esta es su afirmación."
  fr: "Haman est ministre du Pharaon dans le récit coranique. Omar Abdelkafy affirme qu'il est mentionné six fois dans le Coran et qu'il n'en a trouvé aucune trace dans la Torah ni dans l'Évangile. Il rapporte que le déchiffrement des hiéroglyphes après la découverte de la pierre de Rosette a révélé qu'il était ministre des forteresses et des travaux de construction, ce qu'il considère comme une preuve que le Coran est la parole de Dieu; telle est sa thèse."
  tr: "Haman, Kur'an hikayesinde Firavun'un hizmetkarı. Omar Abd al-Kafi, Kur'an'da altı kez bahsedildiğini ancak Tevrat veya İncil'de anılmadığını söyler. Rosetta taşından sonra hiyeroglifleri okuduğunda kaleler ve yapılar bakanı olduğunu ortaya çıkardığını anlatır; bu da Kur'an'ın Allah'ın sözü olduğuna dair kanıt olarak kabul edilir; bu onun ifadesidir."
  id: "Haman, menteri Firaun dalam kisah Al-Qur'an. Omar Abd al-Kafi mengatakan bahwa ia disebutkan dalam Al-Qur'an enam kali tetapi tidak disebutkan dalam Taurat atau Injil. Ia menceritakan bahwa membaca hieroglif setelah batu Rosetta mengungkapkan bahwa ia adalah menteri kastil dan bangunan, yang dianggap sebagai bukti bahwa Al-Qur'an adalah firman Tuhan; itulah pernyataannya."
