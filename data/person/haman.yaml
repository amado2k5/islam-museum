label:
  ar: "هامان"
  en: "Haman"
  ur: "ہامان"
summary:
  ar: "هامان وزير فرعون في القصة القرآنية. يقول عمر عبد الكافي إنه ذُكر في القرآن ست مرات ولم يجد له ذكرًا في التوراة والإنجيل، ويروي أن قراءة الهيروغليفية بعد حجر رشيد كشفت أنه كان وزيرًا للقلاع والإنشاءات، ويعدّ ذلك دليلًا على أن القرآن كلام الله؛ وهذا قوله."
  en: "Haman is Pharaoh's minister in the Qur'anic story. Omar Abdelkafy says he is mentioned six times in the Qur'an and that he found no mention of him in the Torah or Gospel, and relates that the reading of hieroglyphs after the Rosetta Stone showed he was minister of fortresses and building works, which he takes as proof that the Qur'an is God's word; this is his claim."
  ur: "ہامان قرآنی قصے میں فرعون کا وزیر ہے۔ عمر عبد الکافی کہتے ہیں کہ اس کا ذکر قرآن میں چھ بار آیا اور انہیں تورات و انجیل میں اس کا ذکر نہیں ملا، اور بیان کرتے ہیں کہ حجرِ رشید کے بعد ہیروگلیفی پڑھنے سے معلوم ہوا کہ وہ قلعوں اور تعمیرات کا وزیر تھا، اور وہ اسے قرآن کے کلام اللہ ہونے کی دلیل سمجھتے ہیں؛ یہ ان کا دعویٰ ہے۔"
