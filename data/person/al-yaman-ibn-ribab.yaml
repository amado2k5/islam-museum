  ar: "من علية علماء الخوارج وله كتب مصنفة في مذاهبهم، وأخوه علي بن رباب من علية علماء الرافضة، يجتمعان في كل سنة ثلاثة أيام يتناظران فيها ثم يفترقان ولا يسلم أحدهما على الآخر {cite:muruj-al-dhahab p. 183}."
