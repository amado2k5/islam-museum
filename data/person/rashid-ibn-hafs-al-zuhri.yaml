summary:
  ar: "راشد بن حفص بن عمر بن عبد الرحمن بن عوف الزهري. ذكره ابن حبان في الثقات، وروى عنه إبراهيم بن عبد المطلب بن السائب بن أبي وداعة، وقال ابن أبي حاتم عن أبيه: هو مجهول، وهو مستخرج من كتاب الواقدي. لم تُذكر سنة وفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
  en: "Rashid ibn Hafs ibn Umar ibn Abd al-Rahman ibn Awf al-Zuhri. Ibn Hibban counted him among the trustworthy; Ibrahim ibn Abd al-Muttalib ibn al-Sa'ib ibn Abi Wada'a transmitted from him. Ibn Abi Hatim reports his father's view that he is unknown, and that he is drawn from the book of al-Waqidi. No death date is given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
  es: "Rashid ibn Hafs ibn Umar ibn Abd al-Rahman ibn Awf al-Zuhri. Ibn Hibban lo consideró digno de confianza; Ibrahim ibn Abd al-Muttalib ibn al-Sa'ib ibn Abi Wada'a transmitió de él. Ibn Abi Hatim relata la opinión de su padre de que es desconocido y que proviene del libro de al-Waqidi. No se indica la fecha de su muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
  fr: "Rashid ibn Hafs ibn Umar ibn Abd al-Rahman ibn Awf al-Zuhri. Ibn Hibban le comptait parmi les personnes dignes de confiance; Ibrahim ibn Abd al-Muttalib ibn al-Sa'ib ibn Abi Wada'a a transmis ses enseignements. Ibn Abi Hatim rapporte l'avis de son père selon lequel il est inconnu et que ses écrits proviennent du livre d'al-Waqidi. Aucune date de décès n'est mentionnée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
  ur: "راشد بن حفص ابن عمر بن عبدالرحمٰن بن عوف الزہری۔ ابن حبان نے اسے ثقہ لوگوں میں شمار کیا ہے۔ ابراہیم بن عبد المطلب ابن السائب ابن ابی وداع نے ان سے روایت کی ہے۔ ابن ابی حاتم نے اپنے والد کا قول نقل کیا ہے کہ وہ نامعلوم ہیں، اور یہ کہ وہ کتاب الواقدی سے اخذ کیا گیا ہے۔ موت کی کوئی تاریخ نہیں دی گئی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص2060}"
