summary:
  ar: "راشد بن حفص بن عمر بن عبد الرحمن بن عوف الزهري. ذكره ابن حبان في الثقات، وروى عنه إبراهيم بن عبد المطلب بن السائب بن أبي وداعة، وقال ابن أبي حاتم عن أبيه: هو مجهول، وهو مستخرج من كتاب الواقدي. لم تُذكر سنة وفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
  en: "Rashid ibn Hafs ibn Umar ibn Abd al-Rahman ibn Awf al-Zuhri. Ibn Hibban counted him among the trustworthy; Ibrahim ibn Abd al-Muttalib ibn al-Sa'ib ibn Abi Wada'a transmitted from him. Ibn Abi Hatim reports his father's view that he is unknown, and that he is drawn from the book of al-Waqidi. No death date is given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2060}"
