summary:
  ar: "ضابط سوري (1883–1920)، وزير الحربية ورئيس أركان الجيش العربي في المملكة السورية، قاد القوات السورية في معركة ميسلون ضد الفرنسيين وقُتل فيها في 24 يوليو 1920، فصار رمزا وطنيا سوريا."
  en: "Syrian officer (1883–1920), minister of war and chief of general staff of the Arab Army of the Arab Kingdom of Syria, who led the Syrian forces at the Battle of Maysalun against the French and was killed there on 24 July 1920, becoming Syria's supreme national martyr."
  ur: "شامی افسر (1883–1920)، مملکتِ سوریہ کے وزیرِ حرب اور عرب فوج کے رئیسِ ارکان، جنہوں نے معرکۂ میسلون میں فرانسیسیوں کے خلاف شامی افواج کی قیادت کی اور 24 جولائی 1920 کو وہیں مارے گئے، یوں وہ شام کے عظیم ترین قومی شہید بن گئے۔"
