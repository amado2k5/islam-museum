gender: male
roles: [philosopher]
summary:
  ar: "فيلسوف يوناني قديم، صار اسمه في العربية «أنبادوقليس»، ولم يكن له دور في الفلسفة الإسلامية المعتمدة على كتبه الأصلية، بل نُسبت إليه آراء أفلاطونية محدثة في كتب مثل «كتاب الجواهر الخمسة»، وعدّته الكتابات السيرية أول الفلاسفة الخمسة العظام {cite:encyclopaedia-of-islam-2 vol. 1 p. 506}."
  en: "Greek philosopher whose name passed into Arabic as Anbaduklis. The authentic Empedocles had little place in Islamic philosophy, but late Neoplatonic treatises were put into his mouth, the best known being the Book of the Five Substances, and the biographical literature counted him the first of the five great philosophers {cite:encyclopaedia-of-islam-2 vol. 1 p. 506}."
  es: "Filósofo griego cuyo nombre pasó al árabe como Anbaduklis. El auténtico Empédocles tuvo poca relevancia en la filosofía islámica, pero se le atribuyeron tratados neoplatónicos tardíos, siendo el más conocido el Libro de las Cinco Sustancias, y la literatura biográfica lo considera el primero de los cinco grandes filósofos {cite:encyclopaedia-of-islam-2 vol. 1 p. 506}."
  fr: "Philosophe grec dont le nom est passé en arabe sous la forme Anbaduklis. L'Empédocle authentique n'occupe qu'une place mineure dans la philosophie islamique, mais on lui attribue des traités néoplatoniciens tardifs, dont le plus connu est le Livre des Cinq Substances, et la littérature biographique le considère comme le premier des cinq grands philosophes {cite:encyclopaedia-of-islam-2 vol. 1 p. 506}."
  ur: "یونانی فلسفی جس کا نام عربی میں انبدکلس کے نام سے گزرا۔ مستند Empedocles کو اسلامی فلسفہ میں بہت کم مقام حاصل تھا، لیکن دیر سے نوپلاٹونک مقالے اس کے منہ میں ڈالے گئے، جو سب سے زیادہ مشہور کتاب ہے جو پانچ مادوں کی کتاب ہے، اور سوانحی ادب نے اسے پانچ عظیم فلسفیوں میں سے پہلا شمار کیا۔ 1 ص۔ 506}۔"
  tr: "Antik Yunan filozofu olan Anpadocles, Arapça'da 'Anpadocles' olarak bilinir, orijinal kitaplarına dayanarak İslam felsefesinde hiçbir rolü yoktu. Bunun yerine, 'Beş Mücevher Kitabı' gibi kitaplarda modern Platoncu görüşler ona atfedilmiş ve biyografik yazılar onu beş büyük filozoftan ilki olarak kabul etmiştir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 506}."
  id: "Seorang filsuf Yunani kuno, yang dikenal dalam bahasa Arab sebagai 'Anpadocles,' ia tidak memiliki peran dalam filsafat Islam berdasarkan buku-buku aslinya. Sebaliknya, pandangan Platonik modern dikaitkan dengannya dalam buku-buku seperti 'Buku Lima Permata,' dan tulisan biografi menganggapnya sebagai yang pertama dari lima filsuf besar {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 506}."
