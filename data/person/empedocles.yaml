summary:
  ar: "فيلسوف يوناني قديم، صار اسمه في العربية «أنبادوقليس»، ولم يكن له دور في الفلسفة الإسلامية المعتمدة على كتبه الأصلية، بل نُسبت إليه آراء أفلاطونية محدثة في كتب مثل «كتاب الجواهر الخمسة»، وعدّته الكتابات السيرية أول الفلاسفة الخمسة العظام {cite:encyclopaedia-of-islam-2 vol. 1 p. 506}."
  en: "Greek philosopher whose name passed into Arabic as Anbaduklis. The authentic Empedocles had little place in Islamic philosophy, but late Neoplatonic treatises were put into his mouth, the best known being the Book of the Five Substances, and the biographical literature counted him the first of the five great philosophers {cite:encyclopaedia-of-islam-2 vol. 1 p. 506}."
