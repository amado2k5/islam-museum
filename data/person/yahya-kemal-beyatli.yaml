summary:
  ar: "شاعر وكاتب وسياسي ودبلوماسي تركي، وُلد في سكوبيه سنة 1884 وتوفي في إسطنبول سنة 1958. عاش في باريس شابًا، وعاد إلى إسطنبول سنة 1912 أستاذًا وشاعرًا معروفًا، وكان نائبًا في البرلمان وسفيرًا لتركيا في بولندا والبرتغال وباكستان، وجعل شعره مبنيًا على النغم والإيقاع الداخلي ومشحونًا بحنين الحضارة العثمانية ومدينة إسطنبول."
  en: "Turkish poet, author, politician and diplomat, born at Skopje in 1884 and died at Istanbul in 1958. He spent his youth in Paris, returned to Istanbul in 1912 as a known poet and professor, sat as a deputy in parliament and served as Turkey's ambassador to Poland, Portugal and Pakistan; his poetry is built on melody and inner rhythm and is charged with longing for Ottoman civilisation and for Istanbul."
  ur: "ترک شاعر، مصنف، سیاست دان اور سفارت کار، 1884ء میں سکوپیے میں پیدا ہوئے اور 1958ء میں استنبول میں وفات پائی۔ جوانی پیرس میں گزاری، 1912ء میں استنبول لوٹے، رکنِ پارلیمان رہے اور پولینڈ، پرتگال اور پاکستان میں ترکی کے سفیر رہے؛ ان کی شاعری نغمے اور عثمانی تہذیب کی یاد سے بھرپور ہے۔"
