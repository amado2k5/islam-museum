summary:
  ar: "\u062d\u0627\u0641\u0638 \u0648\u0642\u0627\u0631\u0626 \u0648\u0645\u0648\u0644\u062f\u062e\u0648\u0627\u0646 \u062a\u0631\u0643\u064a (1930\u20132004)\u060c \u0643\u0641\u064a\u0641 \u0645\u0646\u0630 \u0635\u063a\u0631\u0647\u060c \u0639\u064f\u062f\u0651 \u0622\u062e\u0631 \u0645\u0645\u062b\u0644\u064a \u062a\u0642\u0644\u064a\u062f \u0627\u0644\u062a\u0644\u0627\u0648\u0629 \u0627\u0644\u0625\u0633\u0637\u0646\u0628\u0648\u0644\u064a\u060c \u0648\u0623\u062f\u0651\u0649 \u0627\u0644\u0642\u0631\u0622\u0646 \u0648\u0627\u0644\u0645\u0648\u0644\u062f \u0648\u0627\u0644\u0642\u0635\u064a\u062f\u0629 \u0648\u0627\u0644\u063a\u0632\u0644 \u0648\u0627\u0644\u0623\u0630\u0627\u0646\u060c \u0648\u0643\u0627\u0646 \u062d\u0627\u0636\u0631\u064b\u0627 \u0644\u0627 \u064a\u064f\u0633\u062a\u063a\u0646\u0649 \u0639\u0646\u0647 \u0641\u064a \u0627\u062d\u062a\u0641\u0627\u0644\u0627\u062a \u0630\u0643\u0631\u0649 \u0645\u0648\u0644\u0627\u0646\u0627\u060c \u0648\u0644\u0647 \u062a\u0633\u062c\u064a\u0644\u0627\u062a \u0628\u0627\u0644\u0642\u0631\u0622\u0646 \u0648\u0627\u0644\u0645\u0648\u0644\u062f \u0648\u0627\u0644\u062a\u0643\u0628\u064a\u0631\u0627\u062a \u0648\u0627\u0644\u0646\u0639\u0648\u062a."
  en: "Turkish hafiz, reciter and mevlid singer (1930\u20132004), blind from childhood, regarded as the last representative of the Istanbul tradition of recitation; he performed the Qur'an, the mevlid, kaside, gazel and the adhan, was a fixture of the Mevlana commemorations, and recorded the Qur'an, the mevlid and collections of tekbir, durak and naat."
