summary:
  ar: "حافظ وقارئ ومولدخوان تركي (1930–2004)، كفيف منذ صغره، عُدّ آخر ممثلي تقليد التلاوة الإسطنبولي، وأدّى القرآن والمولد والقصيدة والغزل والأذان، وكان حاضرًا لا يُستغنى عنه في احتفالات ذكرى مولانا، وله تسجيلات بالقرآن والمولد والتكبيرات والنعوت."
  en: "Turkish hafiz, reciter and mevlid singer (1930–2004), blind from childhood, regarded as the last representative of the Istanbul tradition of recitation; he performed the Qur'an, the mevlid, kaside, gazel and the adhan, was a fixture of the Mevlana commemorations, and recorded the Qur'an, the mevlid and collections of tekbir, durak and naat."
  ur: "ترک حافظ، قاری اور مولد خواں ⁦(1930ء–2004ء)⁩، بچپن سے نابینا، جنھیں استنبول کی روایتِ تلاوت کا آخری نمائندہ سمجھا جاتا ہے؛ انھوں نے قرآن، مولد، قصیدہ، غزل اور اذان پڑھی، مولانا کی یادگاری تقریبات کا لازمی حصہ رہے، اور قرآن، مولد اور تکبیر، دُرَک اور نعت کے مجموعے ریکارڈ کیے۔"
