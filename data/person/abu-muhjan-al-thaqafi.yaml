id: person/abu-muhjan-al-thaqafi
class: person
label: { ar: "أبو محجن بن حبيب الثقفي", en: "Abu Muhjan ibn Habib al-Thaqafi", fr: "Abu Muhjan ibn Habib al-Thaqafi", es: "Abu Muhjan ibn Habib al-Thaqafi", ur: "ابو محجن بن حبیب ثقفی" }
summary:
  ar: "أبو محجن بن حبيب الثقفي؛ عند البلاذري حمل يوم الجسر على الفيل فضرب رجله فعلقها بعد أن ضرب أبو عبيد خرطومه وله شعر في مصاب أصحابه يوم الجسر."
  en: "Abu Muhjan ibn Habib al-Thaqafi; in al-Baladhuri he charged the elephant at the Day of the Bridge and hamstrung its leg after Abu Ubayd struck its trunk; he left verses on that day's fallen."
  fr: "Abu Muhjan ibn Habib al-Thaqafi ; chez al-Baladhuri, il chargea l'éléphant le jour du Pont et lui trancha le jarret après qu'Abu Ubayd eut frappé sa trompe ; il laissa des vers sur les morts de ce jour."
  es: "Abu Muhjan ibn Habib al-Thaqafi; en al-Baladhuri embistió al elefante en el Día del Puente y le lesionó la pata después de que Abu Ubayd le golpeara la trompa; dejó versículos sobre los caídos de ese día."
  ur: "ابو محجن بن حبیب ثقفی، البلادوری میں اس نے پل کے دن ہاتھی کو چارج کیا اور ابو عبید کے سونڈ پر مارنے کے بعد اس کی ٹانگ کاٹ دی۔ اس نے اس دن کے زوال پر آیات چھوڑ دیں۔"
  tr: "El-Baladhuri'ye göre, Ebu Mahjan bin Habib el-Saqafi, köprü gününde file saldırmış ve bacağına vurmuş, bunun üzerine Ebu Ubaid hortumuna vurmuş ve fil bağlanmıştır. Köprü gününde arkadaşlarının başına gelen talihsizliklerle ilgili şiirleri de vardır."
  id: "Abu Mahjan bin Habib Al-Thaqafi; menurut Al-Baladhuri, ia menyerang gajah pada hari terjadinya peristiwa jembatan dan memukul kakinya, sehingga gajah itu diikat setelah Abu Ubaid memukul belalainya. Ia memiliki puisi tentang kemalangan para sahabatnya pada hari terjadinya peristiwa jembatan."
