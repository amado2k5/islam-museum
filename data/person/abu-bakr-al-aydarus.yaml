id: person/abu-bakr-al-aydarus
class: person
label: { ar: "الشيخ أبو بكر العيدروس الشاذلي", en: "Shaykh Abu Bakr al-Aydarus al-Shadhili" }
summary:
  ar: "الشيخ الصالح العارف بالله أبو بكر بن عبد الله الشاذلي المعروف بالعيدروس مبتكر القهوة المتخذة من البن المجلوب من اليمن، في شذرات الذهب كأن أصل اتخاذه لها أنه مر في سياحته بشجر البن قافلات من مرة حين رآه متروكاً مع كثرته فوجد فيه تجفيفاً للدماغ واجتلاباً للسهر وتنشيطاً للعبادة فاتخذه قوتاً وطعاماً وشراباً وأرشد أتباعه إلى ذلك ثم انتشرت في اليمن ثم في بلاد الحجاز ثم في الشام ومصر ثم سائر البلاد واختلف العلماء في أوائل القرن العاشر في القهوة حتى ذهب إلى تحريمها جماعة منهم الشيخ شهاب الدين العيثاوي الشافعي والقطب بن سلطان الحنفي والشيخ أحمد بن عبد الحق السنباطي تبعاً لأبيه والأكثرون ذهبوا إلى أنها مباحة قال النجم الغزي في الكواكب السائرة وقد انعقد الإجماع بعد من ذكرناه على ذلك {cite:shadharat-dhahab p. 456}."
  en: "The Shadhili saint al-Aydarus, 'innovator of coffee' — encountering the abandoned coffee tree on his wanderings he found it dried the brain, invited wakefulness and quickened worship, so he took it as food and drink and guided his followers to it; it spread from Yemen to the Hijaz, Syria, Egypt and beyond, and the early-tenth-century scholars divided over it, a party prohibiting it while most held it licit until, as al-Ghazzi says, consensus settled on that {cite:shadharat-dhahab p. 456}."
