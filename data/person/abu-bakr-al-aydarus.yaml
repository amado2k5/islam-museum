id: person/abu-bakr-al-aydarus
class: person
label: { ar: "الشيخ أبو بكر العيدروس الشاذلي", en: "Shaykh Abu Bakr al-Aydarus al-Shadhili", fr: "Le shaykh Abu Bakr al-Aydarus al-Shadhili", es: "Shaykh Abu Bakr al-Aydarus al-Shadhili", ur: "شیخ ابوبکر العیدارس الشہدلی" }
summary:
  ar: "الشيخ الصالح العارف بالله أبو بكر بن عبد الله الشاذلي المعروف بالعيدروس مبتكر القهوة المتخذة من البن المجلوب من اليمن، في شذرات الذهب كأن أصل اتخاذه لها أنه مر في سياحته بشجر البن قافلات من مرة حين رآه متروكاً مع كثرته فوجد فيه تجفيفاً للدماغ واجتلاباً للسهر وتنشيطاً للعبادة فاتخذه قوتاً وطعاماً وشراباً وأرشد أتباعه إلى ذلك ثم انتشرت في اليمن ثم في بلاد الحجاز ثم في الشام ومصر ثم سائر البلاد واختلف العلماء في أوائل القرن العاشر في القهوة حتى ذهب إلى تحريمها جماعة منهم الشيخ شهاب الدين العيثاوي الشافعي والقطب بن سلطان الحنفي والشيخ أحمد بن عبد الحق السنباطي تبعاً لأبيه والأكثرون ذهبوا إلى أنها مباحة قال النجم الغزي في الكواكب السائرة وقد انعقد الإجماع بعد من ذكرناه على ذلك {cite:shadharat-dhahab p. 456}."
  en: "The Shadhili saint al-Aydarus, 'innovator of coffee' — encountering the abandoned coffee tree on his wanderings he found it dried the brain, invited wakefulness and quickened worship, so he took it as food and drink and guided his followers to it; it spread from Yemen to the Hijaz, Syria, Egypt and beyond, and the early-tenth-century scholars divided over it, a party prohibiting it while most held it licit until, as al-Ghazzi says, consensus settled on that {cite:shadharat-dhahab p. 456}."
  fr: "Le saint shadhilite al-Aydarus, « inventeur du café » — rencontrant au cours de ses errances le caféier délaissé, il trouva qu'il asséchait le cerveau, invitait à la veille et ravivait l'adoration ; il en fit donc sa nourriture et sa boisson et y guida ses disciples ; le café se répandit du Yémen au Hedjaz, en Syrie, en Égypte et au-delà, et les savants du début du dixième siècle se divisèrent à son sujet, un groupe l'interdisant tandis que la plupart le tenaient pour licite jusqu'à ce que, comme le dit al-Ghazzi, le consensus s'établisse sur ce point {cite:shadharat-dhahab p. 456}."
  es: "El santo shadhili al-Aydarus, 'innovador del café', al encontrarse con un cafeto abandonado en sus andanzas, descubrió que despejaba el cerebro, incitaba al despertar y avivaba la adoración, por lo que lo tomó como alimento y bebida y guió a sus seguidores hacia él; se extendió desde Yemen hasta el Hiyaz, Siria, Egipto y más allá, y los eruditos de principios del siglo X se dividieron al respecto, un grupo lo prohibía mientras que la mayoría lo consideraba lícito hasta que, como dice al-Ghazzi, se llegó a un consenso {cite:shadharat-dhahab p. 456}."
  ur: "شادھیلی سنت العیدارس، 'کافی کے اختراعی' - اپنی آوارہ گردی میں کافی کے ترک شدہ درخت کا سامنا کرتے ہوئے اس نے پایا کہ اس نے دماغ کو خشک کیا، بیداری کی دعوت دی اور عبادت کو تیز کیا، تو اس نے اسے کھانے پینے کے طور پر لیا اور اپنے پیروکاروں کو اس کی طرف رہنمائی کی۔ یہ یمن سے حجاز، شام، مصر اور اس سے آگے تک پھیل گیا، اور دسویں صدی کے اوائل کے علماء اس پر تقسیم ہو گئے، ایک جماعت نے اسے منع کیا جبکہ اکثر نے اسے جائز قرار دیا یہاں تک کہ جیسا کہ الغازی کہتے ہیں، اس پر اتفاق رائے ہو گیا۔ 456}۔"
