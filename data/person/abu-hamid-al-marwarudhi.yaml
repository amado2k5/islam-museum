summary:
  ar: "القاضي أبو حامد أحمد بن عامر بن بشر المروروذي، صاحب أبي إسحاق المروزي. مات سنة اثنتين وستين وثلاثمائة، ونزل البصرة ودرّس بها، وصنّف «الجامع» في المذهب، وشرح المزني، وصنّف في أصول الفقه، وكان إماماً لا يشق غباره، وعنه أخذ فقهاء البصرة {cite:tabaqat-fuqaha-abbas-1981 p. 60}. حاشية الكتاب تذكر أن ابن خلكان والسبكي يختلفان في نسبه بين «ابن عامر بن بشر» و«ابن بشر بن عامر» {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  en: "Qadi Abu Hamid Ahmad ibn Amir ibn Bishr al-Marwarudhi, a companion of Abu Ishaq al-Marwazi. He died in 362, settled in Basra and taught there, wrote the 'al-Jami' on the school, commented on al-Muzani, and wrote on the principles of jurisprudence. He was an imam none could keep pace with, and the jurists of Basra took from him {cite:tabaqat-fuqaha-abbas-1981 p. 60}. The editor's footnote notes that Ibn Khallikan and al-Subki differ on his lineage, between 'Ibn Amir ibn Bishr' and 'Ibn Bishr ibn Amir' {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
