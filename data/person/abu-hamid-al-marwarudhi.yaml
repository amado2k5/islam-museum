summary:
  ar: "القاضي أبو حامد أحمد بن عامر بن بشر المروروذي، صاحب أبي إسحاق المروزي. مات سنة اثنتين وستين وثلاثمائة، ونزل البصرة ودرّس بها، وصنّف «الجامع» في المذهب، وشرح المزني، وصنّف في أصول الفقه، وكان إماماً لا يشق غباره، وعنه أخذ فقهاء البصرة {cite:tabaqat-fuqaha-abbas-1981 p. 60}. حاشية الكتاب تذكر أن ابن خلكان والسبكي يختلفان في نسبه بين «ابن عامر بن بشر» و«ابن بشر بن عامر» {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
