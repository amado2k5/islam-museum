summary:
  ar: "القاضي أبو حامد أحمد بن عامر بن بشر المروروذي، صاحب أبي إسحاق المروزي. مات سنة اثنتين وستين وثلاثمائة، ونزل البصرة ودرّس بها، وصنّف «الجامع» في المذهب، وشرح المزني، وصنّف في أصول الفقه، وكان إماماً لا يشق غباره، وعنه أخذ فقهاء البصرة {cite:tabaqat-fuqaha-abbas-1981 p. 60}. حاشية الكتاب تذكر أن ابن خلكان والسبكي يختلفان في نسبه بين «ابن عامر بن بشر» و«ابن بشر بن عامر» {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  en: "Qadi Abu Hamid Ahmad ibn Amir ibn Bishr al-Marwarudhi, a companion of Abu Ishaq al-Marwazi. He died in 362, settled in Basra and taught there, wrote the 'al-Jami' on the school, commented on al-Muzani, and wrote on the principles of jurisprudence. He was an imam none could keep pace with, and the jurists of Basra took from him {cite:tabaqat-fuqaha-abbas-1981 p. 60}. The editor's footnote notes that Ibn Khallikan and al-Subki differ on his lineage, between 'Ibn Amir ibn Bishr' and 'Ibn Bishr ibn Amir' {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  fr: "Le cadi Abu Hamid Ahmad ibn Amir ibn Bishr al-Marwarudhi, compagnon d'Abu Ishaq al-Marwazi. Il mourut en 362, s'établit à Bassora et y enseigna, écrivit « al-Jami' » sur l'école, commenta al-Muzani et écrivit sur les fondements du droit. C'était un imam que nul ne pouvait suivre, et les juristes de Bassora apprirent auprès de lui {cite:tabaqat-fuqaha-abbas-1981 p. 60}. La note de l'éditeur signale qu'Ibn Khallikan et al-Subki divergent sur sa généalogie, entre « Ibn Amir ibn Bishr » et « Ibn Bishr ibn Amir » {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  es: "Qadi Abu Hamid Ahmad ibn Amir ibn Bishr al-Marwarudhi, compañero de Abu Ishaq al-Marwazi. Murió en 362, se estableció en Basora y enseñó allí, escribió el 'al-Jami' sobre la escuela, comentó sobre al-Muzani y escribió sobre los principios de la jurisprudencia. Fue un imán con el que nadie podía competir, y los juristas de Basora tomaron de él {cite:tabaqat-fuqaha-abbas-1981 p. 60}. La nota al pie del editor señala que Ibn Khallikan y al-Subki difieren en su linaje, entre 'Ibn Amir ibn Bishr' e 'Ibn Bishr ibn Amir' {cite:tabaqat-fuqaha-abbas-1981 p. 60}."
  ur: "قادی ابو حامد احمد بن عامر بن بشر المروضی، ابو اسحاق المروازی کے صحابی۔ 362 میں وفات پائی، بصرہ میں سکونت اختیار کی اور وہاں درس دیا، مکتب پر 'الجامع' لکھا، المزنی پر تبصرہ کیا، اور اصول فقہ پر لکھا۔ وہ ایک ایسے امام تھے جس کے ساتھ کوئی نہیں چل سکتا تھا، اور بصرہ کے فقہاء نے ان سے امامت لی ہے۔ 60}۔ ایڈیٹر کا حاشیہ نوٹ کرتا ہے کہ ابن خلیقان اور السبکی کے سلسلہ نسب میں 'ابن عامر ابن بشر' اور 'ابن بشر ابن عامر' کے درمیان اختلاف ہے {حوالہ:طبقات-فقہا-عباس-1981 صفحہ۔ 60}۔"
  tr: "Ebu İshak el-Marvezi'nin sahabesi olan kadı Ebu Hamid Ahmed ibn 'Amir ibn Bişr el-Marvezi, Hicri 362 yılında vefat etti. Basra'ya yerleşti, orada ders verdi ve Maliki mezhebi üzerine \"El-Cami\" adlı eseri, el-Muzani'nin eserine bir tefsir ve fıkıh esasları üzerine bir kitap yazdı. Eşsiz bir imamdı ve Basra'nın fıkıhçıları ondan ders aldı. Kitaptaki dipnotta, İbn Hallikan ve el-Subki'nin soyu konusunda farklı görüşlere sahip oldukları, bazılarının onu \"İbn 'Amir ibn Bişr\", bazılarının ise \"İbn Bişr ibn 'Amir\" olarak adlandırdığı belirtiliyor."
  id: "Hakim Abu Hamid Ahmad ibn 'Amir ibn Bishr al-Marwazi, sahabat Abu Ishaq al-Marwazi, wafat pada tahun 362 H. Beliau menetap di Basra, mengajar di sana, dan menulis kitab \"Al-Jami'\" tentang mazhab Maliki, sebuah komentar atas karya al-Muzani, dan sebuah buku tentang prinsip-prinsip yurisprudensi. Beliau adalah seorang imam yang tak tertandingi, dan para ahli hukum Basra belajar darinya. Catatan kaki dalam buku tersebut menyebutkan bahwa Ibn Khallikan dan al-Subki berbeda pendapat tentang silsilahnya, sebagian menyebutnya \"Ibn 'Amir ibn Bishr\" dan sebagian lainnya \"Ibn Bishr ibn 'Amir.\""
