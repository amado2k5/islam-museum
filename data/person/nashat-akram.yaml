summary:
  ar: "صانع ألعاب عراقي وُلد سنة 1984 في الحلة ولُقّب «المايسترو»، وكان من أبرز لاعبي منتخب العراق الفائز بكأس آسيا 2007، وانهارت صفقته مع مانشستر سيتي سنة 2008 لرفض تصريح العمل، ثم لعب لتفينتي الهولندي في موسم فوزه بالدوري، ولأندية في العراق والسعودية والإمارات وقطر والصين."
  en: "Iraqi playmaker, born in 1984 in Hillah and nicknamed 'the Maestro'. A leading figure in the Iraq side that won the 2007 AFC Asian Cup, he saw a 2008 move to Manchester City collapse when he was refused a work permit, then played for FC Twente in their Dutch title-winning season and for clubs in Iraq, Saudi Arabia, the Emirates, Qatar and China."
  ur: "عراقی پلے میکر، 1984 میں حلہ میں پیدا ہوئے اور «استاد» (المايسترو) کے لقب سے مشہور ہوئے۔ 2007 کا اے ایف سی ایشیائی کپ جیتنے والی عراقی ٹیم کے نمایاں کھلاڑی تھے؛ 2008 میں مانچسٹر سٹی سے ان کا معاہدہ ورک پرمٹ مسترد ہونے سے ختم ہو گیا، پھر انہوں نے ایف سی ٹوینٹے کے لیے اس کے ڈچ خطاب والے سیزن میں اور عراق، سعودی عرب، امارات، قطر اور چین کے کلبوں کے لیے کھیلا۔"
