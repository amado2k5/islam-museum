summary:
  ar: "أبو عبد الرحمن عبد الله بن أحمد بن حنبل ⁦(213–290هـ)⁩، الحافظ ابن الإمام أحمد وأكثر الناس رواية عنه؛ روى عن أبيه وعن أكثر من أربعمائة شيخ، وعنه النسائي وابن أبي حاتم وأبو بكر القطيعي، وهو راوي «فضائل الصحابة» عن أبيه وصاحب زيادات فيه عن شيوخه؛ وثقه الدارقطني ووصفه الخلال بالصلاح وصدق اللهجة."
  en: "Abu Abd al-Rahman Abd Allah ibn Ahmad ibn Hanbal (213–290 AH), the hafiz son of Imam Ahmad and his most prolific transmitter. He narrated from his father and from more than four hundred teachers, and al-Nasa'i, Ibn Abi Hatim and Abu Bakr al-Qati'i narrated from him. He transmitted his father's Fada'il al-Sahaba and added to it from his own teachers; al-Daraqutni called him trustworthy and al-Khallal praised his piety and truthfulness."
  fr: "Abu Abd al-Rahman Abd Allah ibn Ahmad ibn Hanbal (213–290 H), le hafiz fils de l'imam Ahmad et son transmetteur le plus prolifique. Il rapporta de son père et de plus de quatre cents maîtres, et al-Nasa'i, Ibn Abi Hatim et Abu Bakr al-Qati'i rapportèrent de lui. Il transmit les Fada'il al-Sahaba de son père et y ajouta des récits de ses propres maîtres ; al-Daraqutni le jugea digne de confiance et al-Khallal loua sa piété et sa véracité."
  es: "Abu Abd al-Rahman Abd Allah ibn Ahmad ibn Hanbal (213–290 AH), hijo del Imam Ahmad y su transmisor más prolífico, narró de su padre y de más de cuatrocientos maestros. Al-Nasa'i, Ibn Abi Hatim y Abu Bakr al-Qati'i narraron de él. Transmitió el Fada'il al-Sahaba de su padre y lo complementó con enseñanzas de sus propios maestros. Al-Daraqutni lo consideró digno de confianza y Al-Khallal elogió su piedad y veracidad."
  ur: "ابو عبدالرحمٰن عبد اللہ بن احمد بن حنبل ⁦(213-290 ہجری)⁩، امام احمد کے حافظ بیٹے اور ان کے سب سے زیادہ پروان چڑھانے والے۔ انہوں نے اپنے والد سے اور چار سو سے زائد اساتذہ سے روایت کی ہے اور ان سے نسائی، ابن ابی حاتم اور ابوبکر القطی نے روایت کی ہے۔ اس نے اپنے والد کے فدائیل الصحابہ کو منتقل کیا اور اپنے اساتذہ سے اس میں اضافہ کیا۔ الدارقطنی نے اسے ثقہ کہا اور الخلال نے ان کی تقویٰ اور سچائی کی تعریف کی۔"
  tr: "Ebu Abdülrahman Abdullah ibn Ahmed ibn Hanbel (213-290 Hicri), ezberci, İmam Ahmed'in oğlu ve ondan en çok rivayet eden kişidir; babasından ve dört yüzden fazla şeyhten rivayet etmiştir; Nesai, İbn Abi Hatim ve Ebu Bekr el-Kati'i de ondan rivayet etmişlerdir. \"Sahabelerin Faziletleri\" adlı eseri babasından rivayet eden ve şeyhlerinden eklemeler yapan kişidir; Darakutni ona güvenmiş, Halal ise onu salih ve doğru sözlü olarak tanımlamıştır."
  id: "Abu Abd al-Rahman Abdullah ibn Ahmad ibn Hanbal (213–290 H), seorang penghafal Al-Quran, putra Imam Ahmad, dan orang yang paling banyak meriwayatkan Al-Quran darinya; ia meriwayatkan dari ayahnya dan dari lebih dari empat ratus syekh, dan al-Nasa’i, Ibn Abi Hatim, dan Abu Bakr al-Qati’i juga meriwayatkan darinya. Ia adalah perawi kitab “Keutamaan Para Sahabat” dari ayahnya dan orang yang menambahkan kitab tersebut dari para syekhnya; al-Daraqutni mempercayainya, dan al-Khallal menggambarkannya sebagai orang yang saleh dan jujur."
