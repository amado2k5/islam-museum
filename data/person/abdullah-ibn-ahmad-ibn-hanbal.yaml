summary:
  ar: "أبو عبد الرحمن عبد الله بن أحمد بن حنبل (213–290هـ)، الحافظ ابن الإمام أحمد وأكثر الناس رواية عنه؛ روى عن أبيه وعن أكثر من أربعمائة شيخ، وعنه النسائي وابن أبي حاتم وأبو بكر القطيعي، وهو راوي «فضائل الصحابة» عن أبيه وصاحب زيادات فيه عن شيوخه؛ وثقه الدارقطني ووصفه الخلال بالصلاح وصدق اللهجة."
  en: "Abu Abd al-Rahman Abd Allah ibn Ahmad ibn Hanbal (213–290 AH), the hafiz son of Imam Ahmad and his most prolific transmitter. He narrated from his father and from more than four hundred teachers, and al-Nasa'i, Ibn Abi Hatim and Abu Bakr al-Qati'i narrated from him. He transmitted his father's Fada'il al-Sahaba and added to it from his own teachers; al-Daraqutni called him trustworthy and al-Khallal praised his piety and truthfulness."
