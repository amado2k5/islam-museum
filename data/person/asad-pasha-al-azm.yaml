summary:
  ar: "والي دمشق العثماني من سنة 1743 إلى عزله سنة 1757، وأبرز رجال أسرة العظم التي حكمت أقاليم الشام العثمانية. سحق جنود الإنكشارية المتمردين سنة 1746، وحمى قافلة الحج الشامية سنوات طويلة، وبنى قصر العظم بدمشق وخان أسعد باشا. عُزل سنة 1757 واختلفت الروايات في مصرعه سنة 1758."
  en: "Ottoman governor of Damascus from 1743 until his deposition in 1757, and the most prominent figure of the al-Azm family that governed the provinces of Ottoman Syria. He crushed the rebellious janissaries in 1746, protected the Syrian Hajj caravan for years, and built the Azm Palace in Damascus and Khan As'ad Pasha. Deposed in 1757, he was executed the following year, with two accounts of his death."
  ur: "دمشق کے عثمانی گورنر 1743 سے 1757 میں معزولی تک، اور العظم خاندان کی نمایاں ترین شخصیت جس نے عثمانی شام کے صوبوں پر حکومت کی۔ انہوں نے 1746 میں باغی ینی چریوں کو کچلا، برسوں شامی قافلۂ حج کی حفاظت کی، اور دمشق میں قصر العظم اور خان اسعد پاشا تعمیر کرائے۔ 1757 میں معزول ہوئے اور اگلے سال قتل کر دیے گئے، جن کی موت کی دو روایتیں ہیں۔"
