summary:
  ar: "عبد الوهاب بن بخت، صاحب البطال، مولى آل مروان من أهل مكة، محدث ثقة روى عن ابن عمر وأنس وأبي هريرة وروى عنه مالك وأيوب السختياني، روى له مسلم وأصحاب السنن الأربعة، وقتل غازيا مع البطال في أرض الروم سنة 113 هـ."
  en: "Abd al-Wahhab ibn Bakht, the companion of al-Battal, a freedman of the house of Marwan from the people of Mecca; a reliable hadith transmitter from Ibn Umar, Anas and Abu Hurayra, from whom Malik and Ayyub al-Sakhtiyani narrated and whom Muslim and the four Sunan record; killed raiding Byzantine land with al-Battal in 113 AH (731 CE)."
  fr: "Abd al-Wahhab ibn Bakht, le compagnon d'al-Battal, affranchi de la maison de Marwan, des gens de La Mecque ; transmetteur de hadith fiable d'Ibn Umar, d'Anas et d'Abu Hurayra, de qui transmirent Malik et Ayyub al-Sakhtiyani et que Muslim et les quatre Sunan rapportent ; tué en razzia en terre byzantine avec al-Battal en 113 H (731 ap. J.-C.)."
  es: "Abd al-Wahhab ibn Bakht, compañero de al-Battal, un liberto de la casa de Marwan de la gente de La Meca; un transmisor de hadices fiable de Ibn Umar, Anas y Abu Hurayra, de quien Malik y Ayyub al-Sakhtiyani narraron y de quien Muslim y los cuatro Sunan registran; murió asaltando tierras bizantinas con al-Battal en el año 113 AH (731 d. C.)."
  ur: "عبد الوہاب بن بخت، البطل کا صحابی، اہل مکہ سے مروان کے گھر کا آزاد کرنے والا؛ ابن عمر، انس اور ابو ہریرہ سے ایک معتبر حدیث نقل کرنے والا، جن سے مالک اور ایوب السختیانی نے روایت کی ہے اور جسے مسلم اور چار سنن روایت کرتے ہیں۔ 113 ہجری ⁦(731 عیسوی)⁩ میں الباطل کے ساتھ بازنطینی سرزمین پر چھاپہ مار کر ہلاک ہوا۔"
