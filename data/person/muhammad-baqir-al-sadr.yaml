summary:
  ar: "فقيه ومفكر شيعي عراقي ⁦(1935–1980)⁩ من أسرة الصدر العلمية، حاز مرتبة المرجعية في الحوزة العلمية بالنجف. أسّس مع أقرانه مدرسة دراسات في الاقتصاد والفلسفة الإسلامية بكتابيه «اقتصادنا» و«فلسفتنا»، وأُعدم مع أخته بنت الهدى على يد نظام البعث العراقي سنة 1980."
  en: "Iraqi Shia jurist and thinker (1935–1980) of the Sadr scholarly family, who attained the rank of marja' in the Najaf seminary. With colleagues he founded a school of Islamic economics and philosophy through his books Iqtisaduna (Our Economics) and Falsafatuna (Our Philosophy); he was executed with his sister Bint al-Huda by the Iraqi Ba'athist regime in 1980."
  ur: "عراقی شیعہ فقیہ اور مفکر ⁦(1935–1980)⁩ جو علمی صدر خاندان سے تھے اور حوزۂ نجف میں مرجعیت کے درجے تک پہنچے۔ انہوں نے رفقاء کے ساتھ «اقتصادنا» اور «فلسفتنا» کے ذریعے اسلامی معیشت اور فلسفے کا مکتب قائم کیا؛ 1980 میں عراقی بعثی حکومت نے انہیں ان کی بہن بنت الہدیٰ کے ساتھ شہید کیا۔"
  es: "Jurista y pensador chií iraquí (1935-1980), perteneciente a la distinguida familia Sadr, que alcanzó el rango de marja' en el seminario de Nayaf. Junto con sus colegas, fundó una escuela de economía y filosofía islámicas a través de sus libros Iqtisaduna (Nuestra Economía) y Falsafatuna (Nuestra Filosofía). Fue ejecutado junto con su hermana Bint al-Huda por el régimen baazista iraquí en 1980."
