summary:
  ar: "علي خادم حسيني (وُلد 30 تشرين الأول 1975) مهندس طبي حيوي إيراني المولد كندي-أمريكي، أخذ دكتوراه معهد ماساتشوستس للتقانة سنة 2005 بإشراف روبرت لانغر، وشغل مناصب في كلية طب هارفارد وجامعة كاليفورنيا في لوس أنجلوس، وقاد معهد تيراساكي للابتكار الطبي الحيوي، وعمل في المواد الحيوية وهندسة الأنسجة ومنصات الأعضاء على رقاقة، وأسّس شركات منها أوبسيديو."
  en: "Ali Khademhosseini (born 30 October 1975) is an Iranian-born Canadian-American biomedical engineer. He took his MIT doctorate in 2005 under Robert Langer, held posts at Harvard Medical School and UCLA, led the Terasaki Institute for Biomedical Innovation, and works on biomaterials, tissue engineering and organ-on-a-chip platforms; he co-founded the company Obsidio."
