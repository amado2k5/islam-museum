summary:
  en: "A freedwoman attached to a family of Banu Abd al-Muttalib. In this edition she is named both as one of two possible carriers of Hatib's letter, and as a woman who had harmed the Prophet in Mecca — ordered killed at the conquest, then amnestied; years later a horse trampled her at al-Abtah in Umar's caliphate."
  ar: "مولاة لبني عبد المطلب؛ وردت في هذه النسخة إحدىَ روايتين لهوية ناقلة كتاب حاطب إلى قريش، ووردت أيضًا في قائمة من أمر النبي بقتلهم يوم الفتح لأذاها إياه بمكة، فأُمنت ثم وطئتها خيل بالأبطح فقتلتها في زمن عمر."
