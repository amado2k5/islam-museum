summary:
  en: "A freedwoman attached to a family of Banu Abd al-Muttalib. In this edition she is named both as one of two possible carriers of Hatib's letter, and as a woman who had harmed the Prophet in Mecca — ordered killed at the conquest, then amnestied; years later a horse trampled her at al-Abtah in Umar's caliphate."
  ar: "مولاة لبني عبد المطلب؛ وردت في هذه النسخة إحدىَ روايتين لهوية ناقلة كتاب حاطب إلى قريش، ووردت أيضًا في قائمة من أمر النبي بقتلهم يوم الفتح لأذاها إياه بمكة، فأُمنت ثم وطئتها خيل بالأبطح فقتلتها في زمن عمر."
  es: "Una mujer liberada vinculada a una familia de Banu Abd al-Muttalib. En esta edición se la menciona como una de las dos posibles portadoras de la carta de Hatib, y también como una mujer que perjudicó al Profeta en La Meca: fue condenada a muerte durante la conquista, pero luego amnistiada; años más tarde, un caballo la pisoteó en al-Abtah, en el califato de Umar."
  fr: "Affranchie et rattachée à une famille des Banu Abd al-Muttalib, elle est mentionnée dans cette édition comme l'une des deux possibles porteuses de la lettre de Hatib, et comme une femme ayant nui au Prophète à La Mecque – condamnée à mort lors de la conquête, puis graciée; des années plus tard, elle fut piétinée par un cheval à al-Abtah, sous le califat d'Omar."
  ur: "بنو عبد المطلب کے خاندان سے منسلک ایک آزاد عورت۔ اس ایڈیشن میں اس کا نام حاطب کے خط کے دو ممکنہ کیریئرز میں سے ایک کے طور پر رکھا گیا ہے، اور ایک عورت کے طور پر جس نے مکہ میں نبی کو نقصان پہنچایا تھا - فتح کے وقت قتل کرنے کا حکم دیا گیا، پھر معافی دی گئی۔ برسوں بعد عمر کی خلافت میں ایک گھوڑے نے اسے الابتہ میں روند ڈالا۔"
