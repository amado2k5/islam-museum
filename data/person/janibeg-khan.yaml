id: person/janibeg-khan
class: person
label:
  ar: جاني بك بن أزبك ملك الدست
  en: Janibeg ibn Uzbek Khan
  es: "Janibeg ibn Uzbek Khan"
  fr: "Janibeg ibn Uzbek Khan"
  ur: "جانی بیگ ابن ازبک خان"
summary:
  ar: "جاني بك بن أزبك، ملك الدست بالشمال بعد أبيه؛ ردد العساكر إلى خراسان إلى أن ملكها سنة 738هـ ثم زحف إلى أذربيجان وتوريز وكان الشيخ الصغير ابن دمرداش بن جوبان غلب عليها، فزحف جاني بك في العساكر لاستردادها."
  en: "Janibeg ibn Uzbek Khan, king of the northern Dasht after his father; he pushed the armies back to Khurasan until he held it in 738 AH, then marched on Azerbaijan and Tabriz which al-Shaykh al-Saghir ibn Dimurdash ibn Chuban had seized, advancing with the hosts to recover them."
  es: "Janibeg ibn Uzbek Khan, rey del Dasht del norte tras la muerte de su padre, hizo retroceder a los ejércitos hasta Jorasán, donde lo conquistó en el año 738 de la Hégira. Luego marchó sobre Azerbaiyán y Tabriz, ciudades que al-Shaykh al-Saghir ibn Dimurdash ibn Chuban había tomado, avanzando con las huestes para recuperarlas."
  fr: "Janibeg ibn Uzbek Khan, roi du Dasht du Nord après son père; il repoussa les armées jusqu'au Khorasan jusqu'à ce qu'il le tienne en 738 AH, puis marcha sur l'Azerbaïdjan et Tabriz que al-Shaykh al-Saghir ibn Dimurdash ibn Chuban avait pris, avançant avec les armées pour les récupérer."
  ur: "جانی بیگ ابن ازبک خان، اپنے والد کے بعد شمالی دشت کا بادشاہ؛ اس نے فوجوں کو خراسان کی طرف دھکیل دیا یہاں تک کہ اس نے 738 ہجری میں اس پر قبضہ کر لیا، پھر آذربائیجان اور تبریز پر چڑھائی کی جس پر الشیخ الصغیر ابن دیمردش ابن چوبان نے قبضہ کر لیا تھا، اور ان کی بازیابی کے لیے میزبانوں کے ساتھ پیش قدمی کی۔"
  tr: "Babasından sonra kuzeyde El-Dast'ın hükümdarı olan Jani Bey bin Azbek, birliklerini Horasan'a çekti, sonra 738 Hicri'de kontrolü ele geçirdi, ardından Azerbaycan ve Turiz'e ilerledi. Şeyh el-Saghir ibn Demerdaş bin Cüben burada galip geldi, bu yüzden Jani Beg ordularla birlikte şehri geri almak için yürüdü."
  id: "Jani Bey ibn Azbek, penguasa Al-Dast di utara setelah ayahnya, mundurkan pasukan ke Khorasan hingga ia mengambil alih pada tahun 738 H, lalu maju ke Azerbaijan dan Turiz. Sheikh al-Saghir ibn Demerdash ibn Juban berhasil di sana, sehingga Jani Beg berbaris bersama pasukan untuk merebut kembali wilayah tersebut."
