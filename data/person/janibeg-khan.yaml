  en: Janibeg ibn Uzbek Khan
summary:
  ar: "جاني بك بن أزبك، ملك الدست بالشمال بعد أبيه؛ ردد العساكر إلى خراسان إلى أن ملكها سنة 738هـ ثم زحف إلى أذربيجان وتوريز وكان الشيخ الصغير ابن دمرداش بن جوبان غلب عليها، فزحف جاني بك في العساكر لاستردادها."
  en: "Janibeg ibn Uzbek Khan, king of the northern Dasht after his father; he pushed the armies back to Khurasan until he held it in 738 AH, then marched on Azerbaijan and Tabriz which al-Shaykh al-Saghir ibn Dimurdash ibn Chuban had seized, advancing with the hosts to recover them."
