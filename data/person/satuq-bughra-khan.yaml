summary:
  ar: "بطاقة أولية لستوق بغرا خان، الخان القراخاني الذي يُروى أنه أول خان تركي أسلم في آسيا الوسطى، توفي سنة ٩٥٥م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Satuq Bughra Khan, the Karakhanid khan remembered as the first Turkic khan of Central Asia to embrace Islam, d. 955; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Satuq Bughra Khan, el kan karajánida recordado como el primer kan turco de Asia Central en abrazar el Islam, fallecido en 955; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature de Satuq Bughra Khan, le khan karakhanide connu comme le premier khan turc d'Asie centrale à embrasser l'islam, mort en 955; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "ستوق بغرا خان کے لیے ڈرافٹ کارڈ، کارخانید خان کو اسلام قبول کرنے والے وسطی ایشیا کے پہلے ترک خان کے طور پر یاد کیا جاتا ہے۔ 955; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Orta Asya'da İslam'a geçen ilk Türk Han olduğu söylenen Karakhani Han'ın ön kartı 955 yılında ölmüştür; İslami Sözlüklerde adı geçmektedir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Sutuk Baghra Khan, Khan Karakhani yang dikatakan sebagai Khan Turkik pertama yang memeluk Islam di Asia Tengah, meninggal pada tahun 955 M; ia disebutkan dalam Kamus Islam dan terjemahannya belum ditinjau di halaman tersebut."
