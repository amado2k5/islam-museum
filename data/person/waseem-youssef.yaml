summary:
  ar: "داعية إسلامي أردني من أصل فلسطيني، وُلد في إربد سنة 1981، عمل خطيبا وإماما في جامع الشيخ زايد الكبير بأبوظبي، وقدّم برامج دينية على قناة أبوظبي منذ سنة 2014، واشتهر بهجومه على جماعة الإخوان المسلمين والسلفية وبتصريحاته المثيرة للجدل."
  en: "Jordanian Muslim preacher of Palestinian origin, born in Irbid in 1981. He served as preacher and imam at the Sheikh Zayed Grand Mosque in Abu Dhabi, presented religious programmes on Abu Dhabi TV from 2014, and became known for his attacks on the Muslim Brotherhood and on Salafism and for his controversial statements."
