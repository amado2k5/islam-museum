  ar: "زينب بنت علي فواز العاملي (ت ١٩١٤م)؛ مؤرخة من شهيرات الكاتبات. ولدت في جبل عامل بسورية من أسرة معروفة في قرية تبنين، وانتقلت إلى مصر فنشأت في القاهرة، ووارت دمشق فأقامت مدة يسيرة وتزوجت بأديب يطمي الدمشقي ثم افترقا فعادت إلى مصر وتوفيت في القاهرة. لها «الدر المنثور في طبقات ربات الخدور» في مجلد كبير وهو أفضل ما صُنّف في بابه على قول الزركلي، ولها «مجموع رسائل» ومباحث كانت تنشرها في الصحف والمجلات {cite:al-aalam tarjama}."
  en: "Zaynab Fawwaz of Jabal Amil (d. 1914 CE) — author of al-Durr al-Manthur, the great biographical dictionary of famous women, 'the best composed in its genre' {cite:al-aalam tarjama}."
