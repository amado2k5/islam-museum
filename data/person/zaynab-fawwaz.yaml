summary:
  ar: "زينب بنت علي فواز العاملي ⁦(ت ١٩١٤م)⁩؛ مؤرخة من شهيرات الكاتبات. ولدت في جبل عامل بسورية من أسرة معروفة في قرية تبنين، وانتقلت إلى مصر فنشأت في القاهرة، ووارت دمشق فأقامت مدة يسيرة وتزوجت بأديب يطمي الدمشقي ثم افترقا فعادت إلى مصر وتوفيت في القاهرة. لها «الدر المنثور في طبقات ربات الخدور» في مجلد كبير وهو أفضل ما صُنّف في بابه على قول الزركلي، ولها «مجموع رسائل» ومباحث كانت تنشرها في الصحف والمجلات {cite:al-aalam tarjama}."
  en: "Zaynab Fawwaz of Jabal Amil (d. 1914 CE) — author of al-Durr al-Manthur, the great biographical dictionary of famous women, 'the best composed in its genre' {cite:al-aalam tarjama}."
  es: "Zaynab Fawwaz de Jabal Amil (m. 1914 d.C.) — autora de al-Durr al-Manthur, el gran diccionario biográfico de mujeres famosas, 'el mejor compuesto en su género' {cite:al-aalam tarjama}."
  fr: "Zaynab Fawwaz de Jabal Amil (décédée en 1914 CE) — auteure d'al-Durr al-Manthur, le grand dictionnaire biographique de femmes célèbres, « le mieux composé dans son genre » {cite:al-aalam tarjama}."
  ur: "جبل عامل کی زینب فواز ⁦(متوفی 1914 عیسوی)⁩ - الدر المنتھر کی مصنفہ، مشہور خواتین کی عظیم سوانح عمری لغت، 'اپنی صنف میں بہترین تحریر' {حوالہ: العالم ترجمہ}۔"
  tr: "Zainab bint Ali Fawaz al-Amili (ö. 1914); bir tarihçi ve ünlü kadın yazarlardan biridir. Suriye'nin Cebel Amel köyünde, Tebnine köyünde tanınmış bir ailede doğdu, Mısır'a taşındı, Kahire'de büyüdü ve kısa bir süre Şam'da yaşadı, yazar Yatami al-Dimashqi ile evlendi, ardından ayrıldılar, Mısır'a döndüler ve Kahire'de öldüler. Al-Zarkali'ye göre bölümdeki en iyi eser olan 'Al-Durr al-Manthur fi Tabaqat Rabat al-Khudur' adlı büyük bir cilt yazdı. Ayrıca gazete ve dergilerde yayımladığı mektuplar ve çalışmalar koleksiyonu vardı {cite:al-aalam tarjama}."
  id: "Zainab bint Ali Fawaz al-Amili (wafat 1914 M); seorang sejarawan dan salah satu penulis wanita terkenal. Ia lahir di Jabal Amel, Suriah, dari keluarga terkenal di desa Tebnine, pindah ke Mesir, tumbuh besar di Kairo, dan tinggal di Damaskus untuk waktu singkat, menikah dengan penulis Yatami al-Dimashqi, lalu mereka berpisah, kembali ke Mesir, dan meninggal di Kairo. Ia menulis 'Al-Durr al-Manthur fi Tabaqat Rabat al-Khudur' dalam sebuah volume besar, yang menurut al-Zarkali merupakan karya terbaik dalam bab tersebut. Ia juga memiliki kumpulan surat dan studi yang ia terbitkan di surat kabar dan majalah {cite:al-aalam tarjama}."
