names:
  - { value: "مسند الدنيا أبو الوقت عبد الأول بن عيسى السجزي ثم الهروي الماليني الصوفي الزاهد", kind: full }
summary:
  ar: "مسند الدنيا أبو الوقت عبد الأول بن عيسى السجزي ثم الهروي الصوفي الزاهد؛ سمع الصحيح ومسند الدارمي وعبد بن حميد من جمال الإسلام الداودي سنة خمس وستين وأربعمائة وصحب شيخ الإسلام الأنصاري وخدمه وقدم بغداد فازدحم الخلق عليه وكان خيراً متواضعاً متودداً حسن السمت متين الديانة محباً للرواية؛ حمله أبوه من هراة إلى بوشنج فسمع صحيح البخاري وعزم على الحج فأصبح ميتاً وكان آخر كلمة قالها «يا ليت قومي يعلمون بما غفر لي ربي وجعلني من المكرمين»؛ توفي سادس ذي القعدة سنة ثلاث وخمسين وخمسمائة ببغداد وله خمس وتسعون سنة ودفن بالشونيزية وعُمر متى يُلحق الأصاغر بالأكابر {cite:shadharat-dhahab p. 646}."
  en: "Musnid al-dunya Abu al-Waqt Abd al-Awwal ibn Isa al-Sijzi then of Herat, Sufi ascetic; he heard the Sahih and the Musnads of al-Darimi and Abd ibn Humayd from Jamal al-Islam al-Dawudi in 465, attended Shaykh al-Islam al-Ansari, and when he reached Baghdad the crowds pressed on him; his father carried him from Herat to Bushanj where he heard Sahih al-Bukhari — setting out for hajj he awoke dead, his last words 'would that my people knew how my Lord has forgiven me'; d. 6 Dhu al-Qa'da 553 at Baghdad aged ninety-five, buried at the Shuniziyya — 'he lived till the younger were joined to the elder' {cite:shadharat-dhahab p. 646}."
  fr: "Le musnid du monde Abu al-Waqt Abd al-Awwal ibn Isa al-Sijzi, puis de Hérat, ascète soufi ; il entendit le Sahih et les Musnad d'al-Darimi et d'Abd ibn Humayd auprès de Jamal al-Islam al-Dawudi en 465, fréquenta le shaykh al-Islam al-Ansari, et, lorsqu'il arriva à Bagdad, les foules se pressèrent autour de lui ; son père le porta de Hérat à Bushanj, où il entendit le Sahih d'al-Bukhari — partant pour le pèlerinage, il fut trouvé mort au réveil, ses dernières paroles étant « si seulement les miens savaient comment mon Seigneur m'a pardonné » ; mort le 6 Dhu al-Qa'da 553 à Bagdad à quatre-vingt-quinze ans, enterré à la Shuniziyya — « il vécut assez pour que les plus jeunes rejoignent les aînés » {cite:shadharat-dhahab p. 646}."
  es: "Musnid al-dunya Abu al-Waqt Abd al-Awwal ibn Isa al-Sijzi, entonces de Herat, asceta sufí; escuchó el Sahih y los Musnads de al-Darimi y Abd ibn Humayd de Jamal al-Islam al-Dawudi en 465, asistió a Shaykh al-Islam al-Ansari, y cuando llegó a Bagdad las multitudes lo apretujaron; su padre lo llevó de Herat a Bushanj donde escuchó el Sahih al-Bukhari; partiendo para el Hajj, despertó muerto, sus últimas palabras fueron \"ojalá mi pueblo supiera cómo mi Señor me ha perdonado\"; murió el 6 de Dhu al-Qa'da de 553 en Bagdad a la edad de noventa y cinco años, enterrado en Shuniziyya: \"vivió hasta que los jóvenes se unieron a los mayores\" {cite:shadharat-dhahab p. 646}."
  ur: "مسند الدنیا ابو الوقت عبد الاول ابن عیسی السجزی پھر ہرات کے، صوفی سنیاسی؛ اس نے 465 میں جمال الاسلام الداؤدی سے الدارمی اور عبد بن حمید کی صحیح اور مسندیں سنی، شیخ الاسلام الانصاری کے پاس حاضر ہوئے، اور جب وہ بغداد پہنچے تو ہجوم نے ان پر دباؤ ڈالا۔ اس کے والد اسے ہرات سے بوشنج لے گئے جہاں انہوں نے صحیح البخاری سنی - حج کے لیے روانہ ہو کر وہ مردہ حالت میں بیدار ہوئے، اس کے آخری الفاظ 'کاش میری قوم کو معلوم ہوتا کہ میرے رب نے مجھے کیسے بخش دیا'۔ d 6 ذی القعدہ 553 بغداد میں پچانوے سال کی عمر میں، شونیزیہ میں دفن ہوئے - 'وہ اس وقت تک زندہ رہے جب تک چھوٹے بڑے سے مل گئے'۔ 646}۔"
  tr: "Dünya alimi Ebu el-Vakt Abdülevvel ibn İsa el-Sijzi, daha sonra el-Haravi, sufi zahit; 465 yılında Cemal el-İslam el-Davudi'den Darimi ve Abd ibn Hamid'in Sahih ve Musned'ini dinledi ve Şeyh el-İslam el-Ensari'ye eşlik etti ve ona hizmet etti. Bağdat'a geldiğinde insanlar etrafını sardı. O iyi, mütevazı, dost canlısı, güzel karakterli, dindar ve rivayet seven biriydi. Babası onu Herat'tan Buşanj'a götürdü ve orada Buhari'nin Sahih'ini dinledi ve Hac yapmaya karar verdi. Ancak ertesi sabah vefat etti ve son sözleri şunlardı: \"Keşke halkım Rabbimin beni nasıl affettiğini ve beni şereflilerden kıldığını bilseydi.\" O, 553 yılında Zilhicce ayının altıncı günü Bağdat'ta vefat etti. Doksan beş yaşındaydı ve Şuniziyye'ye defnedildi. Yaşı, gençlerin yaşlılarla birleştiği yaştır. {Kaynak: Şadharat-dahab, s. 646}"
  id: "Ulama dunia, Abu al-Waqt Abd al-Awwal ibn Isa al-Sijzi, kemudian al-Harawi, seorang sufi pertapa; beliau mendengar Shahih dan Musnad al-Darimi dan Abd ibn Hamid dari Jamal al-Islam al-Dawudi pada tahun 465, dan beliau menemani Syekh al-Islam al-Ansari dan melayaninya, dan beliau datang ke Baghdad dan orang-orang mengerumuninya, dan beliau adalah orang yang baik, rendah hati, ramah, berakhlak mulia, teguh dalam agama, dan pencinta riwayat; ayahnya membawanya dari Herat ke Bushanj, dan beliau mendengar Shahih al-Bukhari dan beliau memutuskan untuk melaksanakan ibadah haji, tetapi beliau wafat keesokan paginya, dan kata-kata terakhir yang diucapkannya adalah, “Semoga kaumku mengetahui bagaimana Tuhanku telah mengampuniku dan menjadikan aku salah satu orang yang dimuliakan.” Dia wafat pada tanggal enam Dzul Qa'dah tahun lima ratus lima puluh tiga di Baghdad, dan usianya sembilan puluh lima tahun, dan dia dimakamkan di al-Shuniziyya, dan usianya adalah ketika orang muda bergabung dengan orang tua {cite:shadharat-dhahab p. 646}."
