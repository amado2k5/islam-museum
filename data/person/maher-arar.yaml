summary:
  ar: "مهندس كمبيوتر كندي من أصل سوري، احتُجز في نيويورك سنة 2002 ورُحّل إلى سوريا حيث سُجن وعُذّب، ثم برّأه تحقيق أوكونور الكندي من كل صلة بالإرهاب، فاعتذرت له الحكومة الكندية ودفعت له تعويضًا سنة 2007."
  en: "Syrian-born Canadian computer engineer who was detained in New York in 2002, deported to Syria, imprisoned and tortured there, then cleared of any link to terrorism by Canada's O'Connor inquiry; the Canadian government apologised to him and paid him compensation in 2007."
  ur: "شامی نژاد کینیڈین کمپیوٹر انجینئر جنہیں 2002 میں نیویارک میں حراست میں لے کر شام بھیج دیا گیا، جہاں وہ قید رہے اور تشدد کا نشانہ بنے؛ کینیڈا کی اوکونر انکوائری نے انہیں دہشت گردی سے ہر تعلق سے بری قرار دیا، اور کینیڈین حکومت نے 2007 میں ان سے معذرت کی اور انہیں معاوضہ دیا۔"
