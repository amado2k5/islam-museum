summary:
  ar: "الأمير جم بن محمد الفاتح؛ كان ببروسة حين بلغه موت أبيه فنال اعتراف أهلها به سلطاناً، واقترح على أخيه بايزيد الثاني الصلح ثم تقسيم الدولة قسمين أوروبياً وآسيوياً، فرفض بايزيد التقسيم لأنه يفتت ما سهر أسلافه على توحيده، وسار بجيش إلى بروسة ففرّ جم إلى سلطان المماليك قايتباي في مصر فأكرمه وأمده بما يحتاجه لسفر الحج {cite:dawlat-uthmaniyya-salabi p. 163}. ولما عاد من الحج كتب إليه بايزيد: «بما أنك قمت بواجباتك الدينية في الحج فلماذا تسعى إلى الأمور الدنيوية وقد كان الملك نصيبي بأمر الله؟» فأجاب: «هل من العدل أن تضطجع على مهد الراحة والنعيم... وأنا أضع رأسي على الشوك؟» فأثار أتباعه في الأناضول وهُزم مرتين {cite:dawlat-uthmaniyya-salabi p. 163-164}، ثم لجأ إلى رودس عند فرسان القديس يوحنا فعقد معهم اتفاقاً نقضوه تحت ضغط بايزيد فصار سجيناً، وباع الفرسان رهينته إلى البابا إينوسنت الثامن، ولما مات بقي عند خلفه إسكندر السادس حتى قُتل، واتهمت كتب التاريخ — على نقل الصلابي — بايزيد الثاني في ذلك {cite:dawlat-uthmaniyya-salabi p. 164}."
  en: "Prince Cem, son of Mehmed II: proclaimed sultan at Bursa on his father's death, he offered his brother Bayezid II first peace, then a partition — Europe to Bayezid, Asia to himself — which Bayezid refused as dissolving what their forefathers had united; defeated at Bursa, Cem fled to the Mamluk Qaytbay, who honoured him and equipped his hajj {cite:dawlat-uthmaniyya-salabi p. 163}. Returning, he answered Bayezid's letter ('why chase worldly things, when kingship was my lot by God's command?') with 'Is it just that you lie on a bed of ease while I lay my head on thorns?' — raised his Anatolian followers, was defeated twice, and took refuge with the Knights of St John at Rhodes, who broke their compact under Bayezid's pressure and made him their prisoner, then sold the hostage to Pope Innocent VIII; on Innocent's death he passed to Alexander VI until he was killed — the chronicles, as al-Salabi relays, accusing Bayezid II {cite:dawlat-uthmaniyya-salabi p. 164}."
  es: "Príncipe Cem, hijo de Mehmed II: proclamado sultán en Bursa tras la muerte de su padre, ofreció a su hermano Bayezid II primero la paz, luego una partición — Europa para Bayezid, Asia para él — que Bayezid rechazó por disolver lo que sus antepasados habían unido; derrotado en Bursa, Cem huyó al mameluco Qaytbay, quien lo honró y lo preparó para el hajj {cite:dawlat-uthmaniyya-salabi p. 163}. Al regresar, respondió a la carta de Bayezid («¿por qué perseguir cosas mundanas, cuando el reino era mi destino por mandato de Dios?») con «¿Es justo que tú yazcas en un lecho de comodidad mientras yo apoyo mi cabeza sobre espinas?» — reunió a sus seguidores anatolios, fue derrotado dos veces y se refugió con los Caballeros de San Juan en Rodas, quienes rompieron su pacto bajo la presión de Bayezid y lo hicieron prisionero, para luego vender al rehén al Papa Inocencio VIII; Tras la muerte de Inocencio, pasó a manos de Alejandro VI hasta que fue asesinado; las crónicas, como relata al-Salabi, acusan a Bayezid II {cite:dawlat-uthmaniyya-salabi p. 164}."
  fr: "Le prince Cem, fils de Mehmed II, proclamé sultan à Bursa à la mort de son père, offrit d'abord la paix à son frère Bayezid II, puis un partage – l'Europe à Bayezid, l'Asie à lui-même – que Bayezid refusa, considérant qu'il dissolvait ce que leurs ancêtres avaient uni. Vaincu à Bursa, Cem s'enfuit auprès du Mamelouk Qaytbay, qui l'honora et finança son pèlerinage à La Mecque (dawlat-uthmaniyya-salabi p. 163). À son retour, il répondit à la lettre de Bayezid (« Pourquoi courir après les choses de ce monde, alors que la royauté était mon lot par la volonté de Dieu ? ») par: « Est-il juste que tu te reposes sur un lit de confort tandis que je pose ma tête sur des épines ? » – il leva ses partisans anatoliens, fut vaincu à deux reprises et se réfugia auprès des Chevaliers de Saint-Jean à Rhodes, qui, sous la pression de Bayezid, rompirent leur pacte et le firent prisonnier, puis vendirent l'otage au pape Innocent VIII. à la mort d'Innocent, il passa à Alexandre VI jusqu'à ce qu'il soit tué — les chroniques, comme le rapporte al-Salabi, accusant Bayezid II {cite:dawlat-uthmaniyya-salabi p. 164}."
  ur: "شہزادہ سیم، محمد دوم کا بیٹا: اپنے والد کی موت پر برسا میں سلطان کا اعلان کیا، اس نے اپنے بھائی بایزید دوم کو پہلے امن کی پیشکش کی، پھر تقسیم - یورپ کو بایزید، ایشیا کو اپنے لیے - جسے بایزید نے ان کے آباؤ اجداد کے اتحاد کو تحلیل کرنے کے طور پر انکار کر دیا۔ برسا میں شکست کھا کر سیم مملوک قطبی کی طرف بھاگا، جس نے اسے عزت بخشی اور اس کے حج کو آراستہ کیا۔ 163}۔ واپس آ کر اس نے بایزید کے خط کا جواب دیا ⁦('دنیاوی چیزوں کا پیچھا کیوں کرتے ہو، جب بادشاہی خدا کے حکم سے میری جان تھی؟')⁩ 'کیا یہ صرف اتنا ہے کہ تم آرام کے بستر پر لیٹتے ہو جب کہ میں کانٹوں پر سر رکھ رہا ہوں؟' - اپنے اناطولیہ کے پیروکاروں کو اٹھایا، دو بار شکست ہوئی، اور رہوڈز میں سینٹ جان کے شورویروں کے پاس پناہ لی، جنہوں نے بایزید کے دباؤ میں اپنا معاہدہ توڑ دیا اور اسے اپنا قیدی بنا لیا، پھر پوپ انوسنٹ ہشتم کو یرغمالی بیچ دیا۔ بے گناہ کی موت پر وہ سکندر ششم کے پاس چلا گیا یہاں تک کہ وہ مارا گیا - تاریخ، جیسا کہ السلابی بیان کرتا ہے، بایزید ثانی پر الزام لگاتا ہے 164}۔"
