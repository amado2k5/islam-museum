summary:
  ar: "سائقة سباقات سعودية، وُلدت في جدة سنة 1992. أول سائقة سباقات سعودية وأول سعودية تحمل رخصة سباق، وأول سعودية تفوز بسباق دولي؛ أسست فريق «ذيبة موتورسبورت» سنة 2022، وأدرجتها بي بي سي في قائمة 100 امرأة لسنة 2022."
  en: "Saudi racing driver, born in Jeddah in 1992. The first Saudi Arabian woman racing driver, the first Saudi woman to hold a racing licence and the first to win an international motor race; she founded Theeba Motorsport in 2022 and was named to the BBC 100 Women list of 2022."
  ur: "سعودی ریسنگ ڈرائیور، 1992 میں جدہ میں پیدا ہوئیں۔ پہلی سعودی خاتون ریسنگ ڈرائیور، ریسنگ لائسنس رکھنے والی پہلی سعودی خاتون اور بین الاقوامی دوڑ جیتنے والی پہلی سعودی خاتون؛ انہوں نے 2022 میں ذیبہ موٹرسپورٹ قائم کی اور بی بی سی کی 2022 کی 100 خواتین کی فہرست میں شامل ہوئیں۔"
  es: "Piloto de carreras saudí, nacida en Yeda en 1992. La primera mujer piloto de carreras saudí, la primera mujer saudí en obtener una licencia de carreras y la primera en ganar una carrera internacional de automovilismo; fundó Theeba Motorsport en 2022 y fue incluida en la lista BBC 100 Women de 2022."
  fr: "Pilote automobile saoudienne, née à Djeddah en 1992. Première femme pilote automobile saoudienne, première Saoudienne à détenir une licence de course et première à remporter une course automobile internationale; elle a fondé Theeba Motorsport en 2022 et a été nommée sur la liste des 100 femmes de la BBC en 2022."
  tr: "1992'de Cidde doğumlu bir Suudi yarış pilotu. İlk Suudi kadın yarış pilotu, yarış lisansına sahip ilk Suudi kadın ve uluslararası bir yarış kazanan ilk Suudi kadın; 2022'de 'Dhiba Motorsport' takımını kurdu ve BBC'nin 2022 yılı için 100 kadın listesine dahil edildi."
  id: "Seorang pembalap Saudi, lahir di Jeddah pada tahun 1992. Pembalap wanita Saudi pertama, wanita Saudi pertama yang memegang lisensi balap, dan wanita Saudi pertama yang memenangkan balapan internasional; Dia mendirikan tim 'Dhiba Motorsport' pada tahun 2022, dan dimasukkan oleh BBC dalam daftar 100 wanita untuk tahun 2022."
