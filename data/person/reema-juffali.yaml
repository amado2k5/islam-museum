summary:
  ar: "سائقة سباقات سعودية، وُلدت في جدة سنة 1992. أول سائقة سباقات سعودية وأول سعودية تحمل رخصة سباق، وأول سعودية تفوز بسباق دولي؛ أسست فريق «ذيبة موتورسبورت» سنة 2022، وأدرجتها بي بي سي في قائمة 100 امرأة لسنة 2022."
  en: "Saudi racing driver, born in Jeddah in 1992. The first Saudi Arabian woman racing driver, the first Saudi woman to hold a racing licence and the first to win an international motor race; she founded Theeba Motorsport in 2022 and was named to the BBC 100 Women list of 2022."
  ur: "سعودی ریسنگ ڈرائیور، 1992 میں جدہ میں پیدا ہوئیں۔ پہلی سعودی خاتون ریسنگ ڈرائیور، ریسنگ لائسنس رکھنے والی پہلی سعودی خاتون اور بین الاقوامی دوڑ جیتنے والی پہلی سعودی خاتون؛ انہوں نے 2022 میں ذیبہ موٹرسپورٹ قائم کی اور بی بی سی کی 2022 کی 100 خواتین کی فہرست میں شامل ہوئیں۔"
