summary:
  ar: "روائي وكاتب مسرحي وصحفي كويتي وُلد سنة 1981. بدأ برواية «سجين المرايا» (2010)، وفازت روايته «ساق البامبو» بالجائزة العالمية للرواية العربية سنة 2013 فكان أصغر فائز بها، وتناولت موضوع العمالة الوافدة والهوية في الخليج. من أعماله «فئران أمي حصة» التي تناولت الطائفية في الكويت، وثلاثية «أسفار مدينة الطين» (2023–2024)."
  en: "Kuwaiti novelist, playwright and journalist, born in 1981. He debuted with The Prisoner of Mirrors (2010); his novel The Bamboo Stalk, about migrant labour and identity in the Gulf, won the International Prize for Arabic Fiction in 2013, making him its youngest winner. His works include Mama Hissa's Mice, on sectarianism in Kuwait, and the trilogy The Scrolls of Mud City (2023–2024)."
  ur: "کویتی ناول نگار، ڈراما نویس اور صحافی، 1981 میں پیدا ہوئے۔ ان کا پہلا ناول «سجين المرايا» (2010) تھا؛ «ساق البامبو» نے 2013 میں عربی فکشن کا عالمی انعام جیتا اور وہ اس کے سب سے کم عمر فاتح بنے۔ ان کے دیگر کاموں میں «فئران أمي حصة» اور ثلاثیہ «أسفار مدينة الطين» شامل ہیں۔"
  es: "Novelista, dramaturgo y periodista kuwaití, nacido en 1981. Debutó con El prisionero de los espejos (2010); su novela El tallo de bambú, sobre el trabajo migrante y la identidad en el Golfo Pérsico, ganó el Premio Internacional de Ficción Árabe en 2013, convirtiéndose en el ganador más joven de dicho premio. Entre sus obras destacan Los ratones de Mama Hissa, sobre el sectarismo en Kuwait, y la trilogía Los pergaminos de la ciudad de barro (2023-2024)."
  fr: "Romancier, dramaturge et journaliste koweïtien, né en 1981, il a fait ses débuts littéraires avec *Le Prisonnier des miroirs* (2010). Son roman *La Tige de bambou*, qui traite du travail migrant et de l'identité dans le Golfe, a remporté le Prix international de la fiction arabe en 2013, faisant de lui le plus jeune lauréat de ce prix. Parmi ses œuvres figurent *Les Souris de Mama Hissa*, qui aborde le sectarisme au Koweït, et la trilogie *Les Rouleaux de la ville de boue* (2023-2024)."
  tr: "1981 doğumlu Kuveytli romancı, oyun yazarı ve gazeteci. \"Aynaların Tutsağı\" (2010) romanıyla başladı ve \"Bambu Bacağı\" adlı romanı 2013'te Uluslararası Arap Kurgu Ödülü'nü kazanarak en genç kazanan oldu. Kitap, Körfez'deki göçmen işçilik ve kimlik konusunu ele aldı. Eserleri arasında Kuveyt'teki mezhepçilikle ilgili \"Annemin Fareleri\" ve 2023–2024 yılları arasında yayımlanan \"Kil Şehri Seyahatleri\" üçlemesi yer alıyor."
  id: "Novelis, dramawan, dan jurnalis Kuwait yang lahir pada tahun 1981. Ia memulai dengan novel \"Prisoner of Mirrors\" (2010), dan novelnya \"Bamboo Leg\" memenangkan Penghargaan Internasional untuk Fiksi Arab pada tahun 2013, menjadikannya pemenang termuda. Novel ini membahas topik tenaga kerja migran dan identitas di Teluk. Di antara karyanya adalah \"My Mother's Mice,\" yang membahas sektarianisme di Kuwait, dan trilogi \"Travels of the City of Clay\" (2023–2024)."
