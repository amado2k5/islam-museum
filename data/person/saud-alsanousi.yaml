summary:
  ar: "روائي وكاتب مسرحي وصحفي كويتي وُلد سنة 1981. بدأ برواية «سجين المرايا» (2010)، وفازت روايته «ساق البامبو» بالجائزة العالمية للرواية العربية سنة 2013 فكان أصغر فائز بها، وتناولت موضوع العمالة الوافدة والهوية في الخليج. من أعماله «فئران أمي حصة» التي تناولت الطائفية في الكويت، وثلاثية «أسفار مدينة الطين» (2023–2024)."
  en: "Kuwaiti novelist, playwright and journalist, born in 1981. He debuted with The Prisoner of Mirrors (2010); his novel The Bamboo Stalk, about migrant labour and identity in the Gulf, won the International Prize for Arabic Fiction in 2013, making him its youngest winner. His works include Mama Hissa's Mice, on sectarianism in Kuwait, and the trilogy The Scrolls of Mud City (2023–2024)."
  ur: "کویتی ناول نگار، ڈراما نویس اور صحافی، 1981 میں پیدا ہوئے۔ ان کا پہلا ناول «سجين المرايا» (2010) تھا؛ «ساق البامبو» نے 2013 میں عربی فکشن کا عالمی انعام جیتا اور وہ اس کے سب سے کم عمر فاتح بنے۔ ان کے دیگر کاموں میں «فئران أمي حصة» اور ثلاثیہ «أسفار مدينة الطين» شامل ہیں۔"
