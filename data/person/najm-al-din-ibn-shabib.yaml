summary:
  ar: "الفقيه الأصولي الحراني نزيل القاهرة؛ آخر من روى عن الحافظ عبد القادر الرهاوي، وسمع من الخطيب أبي عبد الله بن تيمية، وجالس ابن عمه مجد الدين بن تيمية وبحث معه كثيراً حتى انتهت إليه معرفة المذهب ودقائقه وغوامضه؛ من تصانيفه «الرعاية الصغرى» و«الرعاية الكبرى» في الفقه وكتاب «الوافي» و«مقدمة في أصول الدين» و«صفة المفتي والمستفتي»؛ وولي نيابة القضاء بالقاهرة وروى عنه الدمياطي والمزي والبرزالي {cite:shadharat-dhahab p. 748-749}."
  en: "The Harrani Hanbali jurist — last rawi of al-Rahawi, Majd al-Din Ibn Taymiyya's debating companion until the madhhab's subtleties ended with him; author of al-Ri'aya al-Sughra and al-Kubra, al-Wafi, Sifat al-Mufti; Cairo's deputy qadi, dead at ninety-two {cite:shadharat-dhahab p. 748-749}."
