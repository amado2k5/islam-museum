summary:
  ar: "فضل بن سلمة بن جرير بن منخل، أبو سلمة، الجهني، البجائي، وأصله من إلبيرة، فقيه مالكي. سمع من شيوخ بلده وشيوخ إفريقية، ولازم حماساً وأهل العناية بالفقه، وكان حافظاً للفقه على مذهب مالك بعيد الصيت فيه. توفي سنة 319 هـ بحسب ما ذكره الكتاب. من تصانيفه «الواضحة»، و«الموازية»، و«المستخرجة»، واختصر «المدونة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15415}"
  en: "Fadl ibn Salama ibn Jarir ibn Munkhul, Abu Salama al-Jahani, from Bijaya, originally from Ilbira, a Maliki jurist. He studied with teachers of his city and of Ifriqiya, and kept company with Hammas and men of learning in law; he was known as a memoriser of the Maliki school. The book gives 319 AH as his death year. His works include al-Wadiha, al-Muwazzia, al-Mustakhraja, and an abridgement of the Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15415}"
