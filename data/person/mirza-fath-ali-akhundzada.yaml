summary:
  ar: "ميرزا فتح علي آخوندزاده، أول من كتب مسرحيات أصيلة بالتركية الأذربيجانية، وُلد في شكي (نوخا) وتوفي سنة 1878م، وكتب ست مسرحيات هزلية بين 1850 و1857م، ودعا إلى الولاء للسلطة الروسية ليسهّل انتقال مسلمي القوقاز إلى الحياة الحديثة {cite:encyclopaedia-of-islam-2 vol. 1 p. 353}."
  en: "Mirza Fath 'Ali Akhund-zada, the first writer of original plays in a Turkish idiom (Azerbaijani). Born at Sheki (now Nukha) in 1812, he died in 1878. Between 1850 and 1857 he wrote six comedies and a historical-satirical narrative, which attacked feudalism, corruption and superstition {cite:encyclopaedia-of-islam-2 vol. 1 p. 353}."
