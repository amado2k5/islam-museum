summary:
  ar: "أمير خان، زعيم بتاني من صامبهل في روهيلكند، بدأ جنديًا مرتزقًا، ثم صار قائد عصابات، ونال لقب نواب سنة 1798م من جسونت راو هولكر، وأسس سنة 1817م، بعد اتفاقه مع اللورد هاستنجز، دولة طونك {cite:encyclopaedia-of-islam-2 vol. 1 p. 466-467}."
  en: "Amir Khan, a Pathan predatory chief born at Sambhal in Rohilkhand, who began as a sihbandi soldier for zamindars and Maratha officials, became a leader of bandits, and was given the title nawab in 1798 by Jaswant Rao Holkar. By his treaty of 1817 with Lord Hastings he kept his territories, and so founded the state of Tonk {cite:encyclopaedia-of-islam-2 vol. 1 p. 466-467}."
  es: "Amir Khan, un jefe pastún depredador nacido en Sambhal, en Rohilkhand, que comenzó como soldado sihbandi al servicio de zamindares y funcionarios marathas, se convirtió en líder de bandidos y recibió el título de nawab en 1798 de manos de Jaswant Rao Holkar. Mediante su tratado de 1817 con Lord Hastings, conservó sus territorios y fundó así el estado de Tonk {cite:encyclopaedia-of-islam-2 vol. 1 p. 466-467}."
  fr: "Amir Khan, un chef pachtoune pillard né à Sambhal dans le Rohilkhand, qui commença comme soldat sihbandi au service des zamindars et des fonctionnaires marathes, devint un chef de bandits et reçut le titre de nawab en 1798 de Jaswant Rao Holkar. Par son traité de 1817 avec Lord Hastings, il conserva ses territoires et fonda ainsi l'État de Tonk (voir Encyclopaedia of Islam, vol. 2, p. 466-467)."
  ur: "امیر خان، روہیل کھنڈ کے سنبھل میں پیدا ہونے والا ایک پٹھان شکاری سردار، جس نے زمینداروں اور مراٹھا حکام کے لیے ایک سہبندی سپاہی کے طور پر آغاز کیا، ڈاکوؤں کا لیڈر بن گیا، اور جسونت راؤ ہولکر نے اسے 1798 میں نواب کا خطاب دیا تھا۔ لارڈ ہیسٹنگز کے ساتھ 1817 کے اپنے معاہدے کے ذریعے اس نے اپنے علاقوں کو برقرار رکھا اور اس طرح ریاست ٹونک کی بنیاد رکھی۔ 1 ص۔ 466-467}۔"
  tr: "Rohilkand'daki Sambhal'dan bir Betani lideri olan Amir Khan, paralı asker olarak başladı, ardından çete lideri oldu ve 1798'de Jaswant Rao Holkar'dan Nawab unvanını aldı. 1817'de Lord Hastings ile yapılan bir anlaşmanın ardından Tonk devletini kurdu {cite:Encyclopaedia-of-Islam-2 cilt 1, ss. 466-467}."
  id: "Amir Khan, seorang pemimpin Betani dari Sambhal di Rohilkand, memulai kariernya sebagai tentara bayaran, kemudian menjadi pemimpin geng, dan menerima gelar Nawab pada tahun 1798 dari Jaswant Rao Holkar. Pada tahun 1817, setelah mencapai kesepakatan dengan Lord Hastings, ia mendirikan negara bagian Tonk {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 466-467}."
