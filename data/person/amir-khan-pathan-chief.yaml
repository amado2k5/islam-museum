summary:
  ar: "أمير خان، زعيم بتاني من صامبهل في روهيلكند، بدأ جنديًا مرتزقًا، ثم صار قائد عصابات، ونال لقب نواب سنة 1798م من جسونت راو هولكر، وأسس سنة 1817م، بعد اتفاقه مع اللورد هاستنجز، دولة طونك {cite:encyclopaedia-of-islam-2 vol. 1 p. 466-467}."
  en: "Amir Khan, a Pathan predatory chief born at Sambhal in Rohilkhand, who began as a sihbandi soldier for zamindars and Maratha officials, became a leader of bandits, and was given the title nawab in 1798 by Jaswant Rao Holkar. By his treaty of 1817 with Lord Hastings he kept his territories, and so founded the state of Tonk {cite:encyclopaedia-of-islam-2 vol. 1 p. 466-467}."
