summary:
  ar: "السلطان السعدي الذي استفاد من جهود الدولة العثمانية والشعب الجزائري بقيادة خير الدين بربروسة، فحاصر مدينة آسفي بأزمور سنة ٩٤١هـ/١٥٣٤م وكادت تقع بيده لولا النجدات البرتغالية. وألحق بخصومه الوطاسيين هزيمة في موقعة بئر عقبة قرب وادي العبيد سنة ٩٤٣هـ/١٥٣٦م، ثم استجاب لعرض هدنة برتغالي فاتفق الطرفان على هدنة في ٢٥ ذي القعدة ٩٤٤هـ/٢٥ أبريل ١٥٣٧م لمدة ثلاث سنوات مع تبادل تجاري {cite:dawlat-uthmaniyya-salabi p. 219-222}."
  en: "The Sa'di sultan who profited from Ottoman-Algerian pressure: he besieged Safi and Azemmour in 941/1534 (relieved only by Portuguese aid), crushed his Wattasid rivals at Bi'r 'Uqba in 943/1536, then accepted a three-year truce and trade agreement with Portugal on 25 Dhu'l-Qa'da 944/25 April 1537 {cite:dawlat-uthmaniyya-salabi p. 219-222}."
  fr: "Sultan saadien qui profita de la pression ottomano-algérienne : il assiégea Safi et Azemmour en 941 H/1534 ap. J.-C., secourues uniquement par l'aide portugaise, écrasa ses rivaux wattassides à Bi'r 'Uqba en 943 H/1536 ap. J.-C., puis accepta une trêve et un accord commercial de trois ans avec le Portugal le 25 dhou al-qi'da 944 H/25 avril 1537 ap. J.-C. {cite:dawlat-uthmaniyya-salabi p. 219-222}."
  es: "El sultán Sa'di que se benefició de la presión otomano-argelina: sitió Safi y Azemmour en 941/1534 (solo fue aliviado por la ayuda portuguesa), aplastó a sus rivales Wattasíes en Bi'r 'Uqba en 943/1536, y luego aceptó una tregua de tres años y un acuerdo comercial con Portugal el 25 de Dhu'l-Qa'da de 944/25 de abril de 1537 {cite:dawlat-uthmaniyya-salabi p. 219-222}."
  ur: "سعدی سلطان جس نے عثمانی-الجزائر کے دباؤ سے فائدہ اٹھایا: اس نے 941/1534 میں صفی اور عزیمور کا محاصرہ کیا ⁦(صرف پرتگالی امداد سے راحت ملی)⁩، 943/1536 میں بائر عقبہ میں اپنے وطاصد حریفوں کو کچل دیا، پھر پورٹوگ کے ساتھ تین سال کا تجارتی معاہدہ کیا ذوالقعدہ 944/25 اپریل 1537 {حوالہ:دولت عثمانیہ صلابی ص۔ 219-222}۔"
