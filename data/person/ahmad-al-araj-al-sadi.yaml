summary:
  ar: "السلطان السعدي الذي استفاد من جهود الدولة العثمانية والشعب الجزائري بقيادة خير الدين بربروسة، فحاصر مدينة آسفي بأزمور سنة ٩٤١هـ/١٥٣٤م وكادت تقع بيده لولا النجدات البرتغالية. وألحق بخصومه الوطاسيين هزيمة في موقعة بئر عقبة قرب وادي العبيد سنة ٩٤٣هـ/١٥٣٦م، ثم استجاب لعرض هدنة برتغالي فاتفق الطرفان على هدنة في ٢٥ ذي القعدة ٩٤٤هـ/٢٥ أبريل ١٥٣٧م لمدة ثلاث سنوات مع تبادل تجاري {cite:dawlat-uthmaniyya-salabi p. 219-222}."
  en: "The Sa'di sultan who profited from Ottoman-Algerian pressure: he besieged Safi and Azemmour in 941/1534 (relieved only by Portuguese aid), crushed his Wattasid rivals at Bi'r 'Uqba in 943/1536, then accepted a three-year truce and trade agreement with Portugal on 25 Dhu'l-Qa'da 944/25 April 1537 {cite:dawlat-uthmaniyya-salabi p. 219-222}."
