id: person/abu-ali-al-hasan-al-marrakushi
class: person
label: { ar: "أبو علي الحسن بن عمر المراكشي", en: "Abu Ali al-Hasan ibn Umar al-Marrakushi", ur: "ابو علی الحسن بن عمر المراکشی", fr: "Abu Ali al-Hasan ibn Umar al-Marrakushi", es: "Abu Ali al-Hasan ibn Umar al-Marrakushi" }
summary:
  ar: "فلكي ورياضي وجغرافي مغربي من القرن السابع الهجري، صاحب «جامع المبادئ والغايات»، اشتهر بعمل المزاول الشمسية {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16}."
  en: "Moroccan astronomer, mathematician and geographer of the seventh century AH, author of Jami' al-mabadi' wal-ghayat, known for sundial construction {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16}."
  ur: "ساتویں صدی ہجری کے مغربی ماہرِ فلکیات، ریاضی دان اور جغرافیہ دان، «جامع المبادی والغایات» کے مصنف، دھوپ گھڑیوں کی تیاری کے لیے مشہور {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16}۔"
  fr: "Astronome, mathématicien et géographe marocain du septième siècle de l'Hégire, auteur du Jami' al-mabadi' wal-ghayat, connu pour la construction de cadrans solaires {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16}."
  es: "El astrónomo, matemático y geógrafo marroquí del siglo VII d. H., autor de Jami' al-Mabadi' wal-Ghayat, conocido por la construcción del reloj de sol {cita:bibalex-azhar-astronomy-manuscripts-2006 p. 16}."
  tr: "Hicri yedinci yüzyıldan kalma Faslı bir astronom, matematikçi ve coğrafyacı, \"İlkeler ve Amaçlar Koleksiyonu\"nun yazarı, güneş saatleri yapmasıyla ünlüdür {cite:bibalex-azhar-astronomy-manuscripts-2006 s. 16}."
  id: "Seorang astronom, matematikawan, dan ahli geografi Maroko dari abad ketujuh Hijriah, penulis \"Kumpulan Prinsip dan Tujuan\", terkenal karena membuat jam matahari {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 16}."
