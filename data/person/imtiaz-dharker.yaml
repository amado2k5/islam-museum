summary:
  ar: "إمتياز داركر (وُلدت في 31 كانون الثاني 1954) شاعرة وفنانة وصانعة أفلام وثائقية باكستانية بريطانية، وُلدت في لاهور ونشأت في غلاسكو. نالت الميدالية الذهبية للملكة للشعر سنة 2014، وعُيّنت مستشارة لجامعة نيوكاسل سنة 2020، ومُنحت وسام الإمبراطورية البريطانية (OBE) في تكريمات رأس السنة 2025. من مجموعاتها «بردة وقصائد أخرى» (1989) و«بطاقات بريدية من الله» (1997) و«أتكلم نيابة عن الشيطان» (2001) و«فوق القمر» (2014) و«قارئ الظل» (2024)."
  en: "Imtiaz Dharker (born 31 January 1954) is a Pakistani-British poet, artist and documentary film-maker, born in Lahore and brought up in Glasgow. She won the Queen's Gold Medal for Poetry in 2014, was appointed Chancellor of Newcastle University in 2020, and was appointed OBE in the 2025 New Year Honours. Her collections include Purdah and Other Poems (1989), Postcards from God (1997), I Speak for the Devil (2001), Over the Moon (2014) and Shadow Reader (2024)."
  ur: "امتیاز دھارکر (پیدائش 31 جنوری 1954) پاکستانی برطانوی شاعرہ، فنکارہ اور دستاویزی فلم ساز ہیں، جو لاہور میں پیدا ہوئیں اور گلاسگو میں پروان چڑھیں۔ انہوں نے 2014 میں شاعری کے لیے ملکہ کا طلائی تمغہ جیتا، 2020 میں نیو کیسل یونیورسٹی کی چانسلر مقرر ہوئیں، اور 2025 کے نئے سال کے اعزازات میں انہیں او بی ای (OBE) سے نوازا گیا۔ ان کے مجموعوں میں «Purdah» (1989)، «Postcards from God» (1997)، «I Speak for the Devil» (2001)، «Over the Moon» (2014) اور «Shadow Reader» (2024) شامل ہیں۔"

