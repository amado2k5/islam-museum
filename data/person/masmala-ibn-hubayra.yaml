summary:
  ar: "مصقلة بن هبيرة بن شبل أحد بني ثعلبة بن شيبان بن ثعلبة بن عكابة؛ ولاه معاوية طبرستان وضم إليه عشرة آلاف فكاده العدو حتى توغل فأخذوا عليه المضايق ودهدهوا الصخور فهلك هو وجيشه وضرب به المثل حتى يرجع مصقلة من طبرستان."
  en: "Masmala ibn Hubayra ibn Shabal of Tha'laba ibn Shayban ibn Tha'laba ibn Ukaba; Mu'awiya made him governor of Tabaristan with ten or twenty thousand, the enemy lured him deep then rolled the narrows' rocks down — his army annihilated, his name a proverb for the never-returning."
  es: "Masmala ibn Hubayra ibn Shabal de Tha'laba ibn Shayban ibn Tha'laba ibn Ukaba; Mu'awiya lo nombró gobernador de Tabaristán con diez o veinte mil hombres, el enemigo lo atrajo a lo profundo y luego hizo rodar las rocas del estrecho; su ejército fue aniquilado, y su nombre se convirtió en un proverbio para los que nunca regresan."
  fr: "Masmala ibn Hubayra ibn Shabal de Tha'laba ibn Shayban ibn Tha'laba ibn Ukaba; Mu'awiya le nomma gouverneur du Tabaristan avec dix ou vingt mille hommes, l'ennemi l'attira profondément puis fit rouler les rochers du détroit — son armée anéantie, son nom devenu proverbe pour celui qui ne revient jamais."
  ur: "مسملہ بن ہبیرہ بن شبل ثعلبہ بن شیبان بن ثعلبہ ابن عکبہ۔ معاویہ نے اسے دس یا بیس ہزار کے ساتھ طبرستان کا گورنر بنایا، دشمن نے اسے گہرا لالچ دیا پھر تنگ پتھروں کو نیچے لڑھکا دیا- اس کی فوج فنا ہو گئی، اس کا نام کبھی نہ لوٹنے والے کے لیے کہاوت ہے۔"
