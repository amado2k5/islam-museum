summary:
  ar: "مصقلة بن هبيرة بن شبل أحد بني ثعلبة بن شيبان بن ثعلبة بن عكابة؛ ولاه معاوية طبرستان وضم إليه عشرة آلاف فكاده العدو حتى توغل فأخذوا عليه المضايق ودهدهوا الصخور فهلك هو وجيشه وضرب به المثل حتى يرجع مصقلة من طبرستان."
  en: "Masmala ibn Hubayra ibn Shabal of Tha'laba ibn Shayban ibn Tha'laba ibn Ukaba; Mu'awiya made him governor of Tabaristan with ten or twenty thousand, the enemy lured him deep then rolled the narrows' rocks down — his army annihilated, his name a proverb for the never-returning."
