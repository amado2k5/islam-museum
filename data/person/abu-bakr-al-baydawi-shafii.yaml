label:
  ar: أبو بكر البيضاوي الشافعي (محمد بن أحمد)
  en: Abu Bakr al-Baydawi al-Shafii (Muhammad ibn Ahmad), judge and jurist
  ur: ابوبکر البیضاوی شافعی (محمد بن احمد)
summary:
  ar: 'محمد بن أحمد بن العباس، أبو بكر البيضاوي الفارسي القاضي الشافعي، فقيه أديب،
    توفي سنة 468ه بحسب ما ذكر المدخل. من تصانيفه: التبصرة في فروع الفقه، والأدلة في
    تعليل مسائل التبصرة، والتذكرة في شرح مسائل التبصرة، والإرشاد في شرح كفاية الصيمري.
    {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7514} '
  en: 'Muhammad ibn Ahmad ibn al-Abbas, Abu Bakr al-Baydawi al-Farisi, a Shafii judge,
    jurist and man of letters; the entry gives his death as 468 AH. His works include
    al-Tabsira on the branches of fiqh, al-Adilla on the causes of the Tabsira''s
    rulings, al-Tadhkira on its problems, and al-Irshad on the Kifaya of al-Sayməri.
    {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7514} '
  ur: 'محمد بن احمد بن العباس، ابوبکر البیضاوی فارسی، شافعی قاضی، فقیہ اور ادیب؛ مدخل
    کے مطابق وفات 468 ہجری ہے۔ تصانیف میں «التبصرۃ» فروع فقہ پر، «الادلۃ» تبصرہ کے
    مسائل کی علت پر، «التذکرۃ» اور «الارشاد» شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7514} '
