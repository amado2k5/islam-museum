summary:
  ar: "نور الدين بن أقبرص المصري الشافعي؛ ولد سنة اثنتين وثمانمائة تقريباً وسمع من الناصر الأنطاكي والزين العراقي وشيخ الإسلام زكريا وتفقه به ولازم ابن حجر وكتب عنه كثيراً وتصرف بالقضاء وتقلب في الرياسة وتفرد بنظر الأوقاف بالديار المصرية في دولة الملك الظاهر جقمق حين خلع الحافظ حمزة بن العماد أو قبل ذلك بقليل ومال عليه ميلاً عظيماً ولم يزل نظر الأوقاف بها بيد أولاده وأحفاده، توفي في رمضان سنة اثنتين وستين وثمانمائة في أول ليلة منه {cite:shadharat-dhahab p. 302}."
  en: "Ibn Aqbaras (b. ~802) — sole nazir of Egypt's awqaf under Jaqmaq after Ibn al-Imad's dismissal; studied under al-'Iraqi and Zakariyya and 'companied Ibn Hajar'; died the first night of Ramadan 862 — the awqaf-nazirate stayed in his sons' and grandsons' hands {cite:shadharat-dhahab p. 302}."
