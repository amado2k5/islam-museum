  ar: "فيزيائي فلكي ومهندس طيران مالي، وُلد سنة 1952. عمل ملاحًا بين الكواكب في مختبر الدفع النفاث بناسا في بعثتي مارس باثفايندر وغاليليو، وأسس مبادرات لتعليم العلوم في أفريقيا، وتولى رئاسة وزراء مالي سنة 2012."
