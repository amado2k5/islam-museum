label: { ar: "واصل بن عطاء أبو حذيفة" }
summary:
  ar: "واصل بن عطاء الغزال، أبو حذيفة، شيخ المعتزلة وصاحب القول بالمنزلة بين المنزلتين، وبهذا الباب سميت المعتزلة كما قال المسعودي، مات في سنة إحدى وثلاثين ومائة {cite:muruj-al-dhahab p. 208-209}. وفي تكملة الفهرست: كان واصل بن عطاء الغزال طويل العنق جدا حتى عابه بذلك عمرو بن عبيد فلما حضر واصل مناظرته قال عمرو أرى عنقا لا يفلح صاحبها فلما سلم وجلس قال واصل أما علمت أن من عاب الصنعة فقد عاب الصانع لتعلق ما بينهما فاسترجع عمرو وقال لا أعود إلى مثلها يا أبا حذيفة ثم ناظره واصل فقطعه، وله من التصانيف كتاب أصناف المرجئة وكتاب التوبة وكتاب المنزلة بين المنزلتين وكتاب خطبته التي أخرج منها الراء وكتاب معاني القرآن وكتاب الخطب في التوحيد والعدل وكتاب ما جرى بينه وبين عمرو بن عبيد وكتاب السبيل إلى معرفة الحق وكتاب في الدعوة وكتاب طبقات أهل العلم والجهل، وكانت ولادته سنة ٨٠ للهجرة بمدينة رسول الله وتوفي سنة ١٣١ {cite:fihrist-ibn-al-nadim supplement p. 525}"
  en: "Wasil ibn Ata' al-Ghazzal, Abu Hudhayfa — head of the Mu'tazila and author of the 'intermediate rank' doctrine, from which (al-Mas'udi says) the school took its name; he died in 131 {cite:muruj-al-dhahab p. 208-209}."
  es: "Wasil ibn Ata' al-Ghazzal, Abu Hudhayfa — jefe de los Mu'tazila y autor de la doctrina del 'rango intermedio', de la cual (al-Mas'udi dice) la escuela tomó su nombre; murió en 131 {cite:muruj-al-dhahab p. 208-209}."
  fr: "Wasil ibn Ata' al-Ghazzal, Abu Hudhayfa — chef des Mu'tazilites et auteur de la doctrine du « rang intermédiaire », dont (selon al-Mas'udi) l'école a tiré son nom; il est mort en 131 {cite:muruj-al-dhahab p. 208-209}."
  ur: "واصل بن عطاء الغزال، ابو حذیفہ - معتزلہ کے سربراہ اور 'درمیانی درجے کے' نظریے کے مصنف، جس سے ⁦(المسعودی کہتے ہیں)⁩ مکتب نے اپنا نام لیا؛ آپ کی وفات 131ھ میں ہوئی۔ 208-209}۔"
  tr: "Mu'tazillerin şeyhi ve iki rütbe arasındaki konumun yazarı Vesil bin Ata el-Gazel, Ebu Hudhayfah ve bu bölümde Mu'tazila el-Mes'udi olarak adlandırılmıştır. Yüz otuz birinci yılında öldü {atıf:muruj-al-dhahab s. 208-209}. İndeksin devamında: Wasil ibn Ata al-Ghazal o kadar uzundu ki, Amr ibn Ubaid onu bu yüzden azarladı. Wasil onunla tartışmaya geldiğinde, Amr, 'Sahibi sahip olamayacağı bir kolye görüyorum.' dedi. Selamlayıp oturduğunda, Wasil şöyle dedi: 'Zanaatkârı eleştiren kimse, zanaatkârı eleştirir, çünkü aralarındaki gerilim vardır?' Amr hatırladı ve 'Aynı şeye dönmeyeceğim, ey Ebu Hudhayfa.' dedi. Sonra Wasil onunla tartıştı ve sözünü kesti. Yazıları arasında 'Asanaf al-Murji'ah' kitabı, Tövbe Kitabı, İki Manzalita arasındaki Manzala Kitabı ve verdiği vaaz kitabı yer alıyor Bunlar arasında Ra, 'Kur'an'ın Anlamları' kitabı, Tek Tanrıcılık ve Adalet Üzerine Vaazlar Kitabı, Kendisi ile Amr ibn Ubeyd Arasında Olanlar Kitabı, Hakikatı Bilme Yolu Kitabı, Davah üzerine bir kitap ve Bilgi ve Cehalet Halkının Sınıfları Kitabı bulunmaktadır. 80 Hicri yılında Allah'ın Elçisi şehrinde doğdu ve 131 yılında vefat etti {atıf:fihrist-ibn-al-nadim ek s. 525}"
  id: "Wasil ibn Ata al-Ghazal, Abu Hudhayfah, sheikh Mu'tazili, dan penulis pandangan posisi antara kedua barisan, dan dalam bab ini Mu'tazila disebut seperti yang dikatakan al-Mas'udi. Ia wafat pada tahun seratus tiga puluh satu {cite:muruj-al-dhahab hlm. 208-209}. Dalam kelanjutan indeks: Wasil ibn Ata al-Ghazal sangat tinggi sampai-sampai Amr ibn Ubaid menegurnya karena itu. Ketika Wasil datang untuk berdebat, Amr berkata, 'Saya melihat kalung yang pemiliknya tidak akan berhasil.' Ketika dia menyapa dan duduk, Wasil berkata, 'Apakah kamu tidak tahu bahwa siapa pun yang mengkritik pengrajin, dia mengkritik pengrajin, karena ketegangan di antara mereka melekat?' Amr teringat dan berkata, 'Saya tidak akan kembali ke hal yang sama, wahai Abu Hudhayfah.' Kemudian Wasil berdebat dengannya dan memotong pembicaraannya. Di antara tulisannya adalah buku 'Asanaf al-Murji'ah,' Kitab Pertobatan, Kitab Manzala antara Dua Manzalita, dan kitab khotbahnya yang dia sampaikan Di antaranya adalah Ra, buku 'Makna Al-Qur'an,' Kitab Khotbah tentang Monoteisme dan Keadilan, Kitab Apa yang Terjadi Antara Dia dan Amr ibn Ubaid, Kitab Jalan Menuju Mengetahui Kebenaran, Kitab tentang Da'wah, dan Kitab Kelas-kelas Orang-orang Pengetahuan dan Kebodohan. Dia lahir pada tahun 80 H di kota Rasulullah Allah dan wafat pada tahun 131 {cite:fihrist-ibn-al-nadim supplement hlm. 525}"
