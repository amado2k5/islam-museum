label: { ar: "واصل بن عطاء أبو حذيفة" }
summary:
  ar: "واصل بن عطاء الغزال، أبو حذيفة، شيخ المعتزلة وصاحب القول بالمنزلة بين المنزلتين، وبهذا الباب سميت المعتزلة كما قال المسعودي، مات في سنة إحدى وثلاثين ومائة {cite:muruj-al-dhahab p. 208-209}. وفي تكملة الفهرست: كان واصل بن عطاء الغزال طويل العنق جدا حتى عابه بذلك عمرو بن عبيد فلما حضر واصل مناظرته قال عمرو أرى عنقا لا يفلح صاحبها فلما سلم وجلس قال واصل أما علمت أن من عاب الصنعة فقد عاب الصانع لتعلق ما بينهما فاسترجع عمرو وقال لا أعود إلى مثلها يا أبا حذيفة ثم ناظره واصل فقطعه، وله من التصانيف كتاب أصناف المرجئة وكتاب التوبة وكتاب المنزلة بين المنزلتين وكتاب خطبته التي أخرج منها الراء وكتاب معاني القرآن وكتاب الخطب في التوحيد والعدل وكتاب ما جرى بينه وبين عمرو بن عبيد وكتاب السبيل إلى معرفة الحق وكتاب في الدعوة وكتاب طبقات أهل العلم والجهل، وكانت ولادته سنة ٨٠ للهجرة بمدينة رسول الله وتوفي سنة ١٣١ {cite:fihrist-ibn-al-nadim supplement p. 525}"
  en: "Wasil ibn Ata' al-Ghazzal, Abu Hudhayfa — head of the Mu'tazila and author of the 'intermediate rank' doctrine, from which (al-Mas'udi says) the school took its name; he died in 131 {cite:muruj-al-dhahab p. 208-209}."
