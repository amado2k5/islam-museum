  ar: "ملك الفرنج الذي افتتح القدس؛ كان جبّاراً شجاعاً، همّ بأخذ مصر وسار في جموعه حتى وصل ثم رجع عليلاً فمات سنة إحدى عشرة وخمسمائة، فشقّوه وصبروه ورموا حشوته ودفن ببيت المقدس، وتملك القدس بعده القمص صاحب الرها {cite:shadharat-dhahab p. 510}."
