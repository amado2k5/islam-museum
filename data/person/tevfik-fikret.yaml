summary:
  ar: "توفيق فكرت (وُلد في إسطنبول في 24 ديسمبر 1867 – توفي فيها في 19 أغسطس 1915)، واسمه الأصلي محمد توفيق، شاعر عثماني ومعلّم يُعد مؤسس المدرسة الحديثة في الشعر التركي وقائد جماعة «ثروة الفنون»، صاحب «الرباب المحطّم» و«دفتر خالوق»، عُرف بنقده الصريح للاستبداد الحميدي ودفاعه عن حرية التعبير والحكم الدستوري."
  en: "Tevfik Fikret (born in Istanbul on 24 December 1867 – died there on 19 August 1915), the pen name of Mehmed Tevfik, was an Ottoman poet and educator considered the founder of the modern school of Turkish poetry and the leader of the Servet-i Fünun circle; author of Rubab-ı Şikeste (1900) and Haluk'un Defteri (1911), he was an open critic of Abdülhamid II's absolutism and an advocate of free speech and constitutional government."
  ur: "توفیق فکرت (پیدائش: استنبول، 24 دسمبر 1867ء – وفات: استنبول، 19 اگست 1915ء)، اصل نام محمد توفیق، عثمانی شاعر اور معلم؛ جدید ترکی شاعری کے بانی اور «ثروتِ فنون» حلقے کے قائد شمار ہوتے ہیں، «رَبابِ شکستہ» اور «خالوق کا دفتر» کے مصنف۔"
