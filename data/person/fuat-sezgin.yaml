summary:
  ar: "مؤرخ تركي للعلوم عند العرب والمسلمين، أكمل «تاريخ التراث العربي» في سبعة عشر مجلدًا امتدادًا لعمل بروكلمان. وُلد في بدليس سنة 1924 وتتلمذ في جامعة إسطنبول على هلموت ريتر؛ وبعد إقصائه في انقلاب 1960 انتقل إلى فرانكفورت، فأسس معهد تاريخ العلوم العربية الإسلامية (1982) ومتحفه للآلات العلمية، وافتُتح متحف شقيق في إسطنبول سنة 2008. توفي في إسطنبول سنة 2018."
  en: "Turkish historian of Arab-Islamic science whose seventeen-volume Geschichte des arabischen Schrifttums carried Brockelmann's history of Arabic literature forward. Born at Bitlis in 1924 and trained at Istanbul University under Hellmut Ritter, he was dismissed after the 1960 coup and moved to Frankfurt, where he founded the Institute for the History of the Arab-Islamic Sciences (1982) and its museum of scientific instruments; a sister museum opened in Istanbul in 2008. He died in Istanbul in 2018."
  ur: "ترک مؤرخِ سائنس، جنہوں نے عربی ادب کی تاریخ پر بروکلمان کے کام کو آگے بڑھاتے ہوئے «تاریخ التراث العربی» سترہ جلدوں میں مکمل کی۔ 1924ء میں بدلیس میں پیدا ہوئے اور استنبول یونیورسٹی میں ہیلمٹ رٹر کے شاگرد رہے؛ 1960ء کی بغاوت کے بعد برطرف ہو کر فرینکفرٹ چلے گئے، جہاں عربی اسلامی علوم کی تاریخ کا ادارہ (1982ء) اور اس کا عجائب گھر قائم کیا؛ 2008ء میں استنبول میں بھی ایسا ہی عجائب گھر کھلا۔ 2018ء میں استنبول میں وفات پائی۔"
