summary:
  ar: "أحد أهل بدر، أوصى عمر أبا عبيدة أن لا يقطع أمراً دونه ودون سليط بن قيس، فاعترض على قطع جسر الفرات بعد العبور وقال سوف يهلك من معك من المسلمين بسوء سياستك لا يجدون ملجأ من هذه الصحارى {cite:muruj-al-dhahab p. 604}."
  en: "The Badri counsellor Umar paired with Abu 'Ubayda — who warned that cutting the Euphrates bridge behind them would leave the Muslims no refuge {cite:muruj-al-dhahab p. 604}."
  es: "El consejero de Badri, Umar, se asoció con Abu 'Ubayda, quien advirtió que cortar el puente del Éufrates a sus espaldas no dejaría refugio a los musulmanes {cite:muruj-al-dhahab p. 604}."
  fr: "Le conseiller Badri Umar s'est associé à Abu 'Ubayda — qui a averti que couper le pont de l'Euphrate derrière eux ne laisserait aucun refuge aux musulmans {cite:muruj-al-dhahab p. 604}."
  ur: "بدری کے مشیر عمر نے ابو عبیدہ کے ساتھ جوڑا بنایا - جس نے خبردار کیا کہ فرات کے پل کو اپنے پیچھے کاٹ دینے سے مسلمانوں کو کوئی پناہ نہیں ملے گی۔ 604}۔"
  tr: "Bedr'in halkından Ömer Ebu Ubayde'ye kendisi ya da Suleyt bin Kays olmadan hiçbir şeyi kesmemesini tavsiye etti. Ebu Ubeyde, yanınızdaki Müslümanların kötü politikalarınız yüzünden yok olacaklarını, bu çöllerde sığınak bulamayacaklarını söyledi {atıf:Muruj-al-Dhahab, s. 604}."
  id: "Salah satu orang Badr, Umar, menasihati Abu Ubaidah untuk tidak memutus apa pun tanpa dirinya atau Sulayt ibn Qays. Ia menolak pemotongan Jembatan Efrat setelah menyeberang, mengatakan bahwa Muslim yang bersamamu akan binasa karena kebijakan burukmu; mereka tidak akan menemukan perlindungan di gurun-gurun ini {cite:muruj-al-dhahab, hlm. 604}."
