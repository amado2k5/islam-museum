summary:
  ar: "شيخ الحنابلة بل شيخ الإسلام وفقيه الشام وقدوة العباد وفريد وقته؛ شرح «المقنع» لعمه الموفق في عشر مجلدات ضخمة، وأخذ الأصول عن السيف الآمدي، وانتهت إليه رئاسة المذهب في عصره بل رئاسة العلم في زمانه. جمع ابن الخباز ترجمته وأخباره في مائة وخمسين جزءاً، وقال الذهبي: ما رأيت سيرة عالم أطول منها أبداً. وكان النووي يقول: هو أجل شيوخي. ولي القضاء ما يزيد على اثنتي عشرة سنة على كره منه ولم يتناول عليه معلوماً، وكان متواضعاً عند العامة مترفعاً عند الملوك، وممن أخذ عنه تقي الدين ابن تيمية والمِزّي والبرزالي؛ ومن رثاء ابن تيمية له: سيد أهل الإسلام في زمانه وقطب فلك الأيام في أوانه {cite:shadharat-dhahab p. 645-647}."
  en: "The Hanbali colossus (b. 597, d. end-Rabi' II 682) — sharh al-Muqni' in ten heavy volumes, usul from al-Amidi, 'the headship of knowledge in his age'; Ibn al-Khabbaz filled 150 parts with his sira ('the longest scholar's life I ever saw' — Dhahabi); al-Nawawi called him 'the greatest of my shaykhs'; judged a dozen years unpaid, then removed himself; Ibn Taymiyya's eulogy: 'sayyid of the people of Islam in his time' {cite:shadharat-dhahab p. 645-647}."
  es: "El coloso hanbalí (n. 597, m. finales de Rabi' II 682) — sharh al-Muqni' en diez pesados volúmenes, usul de al-Amidi, 'la cabeza del conocimiento en su época'; Ibn al-Khabbaz llenó 150 partes con su sira ('la vida de erudito más larga que jamás haya visto' — Dhahabi); al-Nawawi lo llamó 'el más grande de mis shaykhs'; juzgó que llevaba doce años sin cobrar, luego se retiró; el elogio de Ibn Taymiyya: 'sayyid de la gente del Islam en su tiempo' {cite:shadharat-dhahab p. 645-647}."
  fr: "Le colosse hanbalite (né en 597, mort fin Rabi' II 682) — sharh al-Muqni' en dix volumes imposants, usul d'al-Amidi, « la référence en matière de savoir à son époque »; Ibn al-Khabbaz a rempli 150 parties de sa sira (« la plus longue vie d'érudit que j'aie jamais vue » — Dhahabi); al-Nawawi l'a qualifié de « plus grand de mes cheikhs »; il a été juge pendant douze ans sans être rémunéré, puis s'est retiré; l'éloge d'Ibn Taymiyya: « sayyid des gens de l'Islam en son temps » {cite: shadharat-dhahab p. 645-647}."
  ur: "حنبلی مجموعہ ⁦(پیدائش 597، وفات آخر ربیع الثانی 682)⁩ - شرح المقنی دس بھاری جلدوں میں، العمدی سے اصول، 'اپنے دور میں علم کی سربراہی'؛ ابن الخباز نے اپنی سیرت کے 150 حصے بھرے ⁦('سب سے طویل عالم کی زندگی جو میں نے کبھی دیکھی' - ذہبی)⁩؛ النووی نے انہیں 'میرے شیخوں میں سب سے بڑا' کہا۔ ایک درجن سال بلا معاوضہ فیصلہ کیا، پھر خود کو ہٹا دیا؛ ابن تیمیہ کی تعریف: 'اپنے زمانے میں اہل اسلام کے سید' 645-647}۔"
  tr: "Hanbali şeyhi, gerçekten İslam şeyhi, Levant hukukçusu, halkın örneği ve zamanının eşsizi; amcası Al-Muwaffaq tarafından on büyük ciltte \"Muqni\"yi açıkladı, ilkeleri Al-Saif Al-Amidi'den öğrendi ve kendi döneminde okulun başı, hatta kendi zamanında bilgi liderliği oldu. İbn al-Khabbaz biyografisini ve raporlarını yüz elli ciltte derledi ve el-Dhahabi şöyle dedi: Bir âlimin biyografisini bundan daha uzun görmemiştim. Al-Nawawi derdi ki: O, öğretmenlerim arasında en seçkin olanıydı. Hoşlanmamasına rağmen on iki yıldan fazla yargı görevini yürüttü ve bilinen hiçbir konuyu tartışmadı. Halk arasında alçakgönüllüydü, kralların önünde yükseltildi ve onun yanında eğitim görenler arasında Taqi al-Din İbn Teymiyye, el-Mizzi ve el-Barzali vardı. Ağıtı arasında: zamanının İslam efendisi ve kendi zamanında evrenin kutbu {cit:] Shadharat-Dhahab, s. 645-647}."
  id: "Sheikh Hanbali, memang Sheikh Islam, ahli hukum Levant, teladan rakyat, dan unik pada zamannya; ia menjelaskan \"Al-Muqni'\" oleh pamannya Al-Muwaffaq dalam sepuluh jilid besar, dan ia mempelajari prinsip-prinsip tersebut dari Al-Saif Al-Amidi, dan ia menjadi kepala sekolah pada zamannya, bahkan pemimpin ilmu pengetahuan pada masanya. Ibn al-Khabbaz menyusun biografi dan laporannya dalam seratus lima puluh jilid, dan al-Dhahabi berkata: Saya belum pernah melihat biografi seorang ulama yang lebih panjang dari ini. Al-Nawawi biasa berkata: Dia adalah guru saya yang paling terhormat. Dia memegang kehakiman selama lebih dari dua belas tahun meskipun tidak suka, dan dia tidak membahas hal-hal yang diketahui. Dia rendah hati di antara rakyat biasa, diangkat di hadapan raja, dan di antara mereka yang belajar di bawah bimbingannya adalah Taqi al-Din Ibn Taymiyyah, al-Mizzi, dan al-Barzali. Di antara eleginya: penguasa Islam pada zamannya dan kutub alam semesta pada zamannya {cite:Shadharat-Dhahab, hlm. 645-647}."
