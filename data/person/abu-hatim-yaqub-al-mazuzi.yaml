summary:
  ar: "أبو حاتم يعقوب بن لبيد المزوزي النفوسي، إمام إباضي في المغرب، حكم طرابلس في منتصف القرن الثاني الهجري، ولقّبه الإباضية «إمام الدفاع»، وقُتل في معركة مع جيش عباسي سنة 155هـ/772م، والموسوعة تنقل روايات الفريقين. {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
  en: "Abu Hatim Yaqub b. Labid al-Mazuzi al-Nafusi, an Ibadi imam in the Maghrib who held Tripoli in the middle of the second/eighth century, given by the Ibadis the title imam al-difa' ('imam of defence'), and killed in a battle against an 'Abbasid army in 155/772. {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
  ur: "ابو حاتم یعقوب بن لبید المزوزی النفوسی، مغرب کے ایک اباضی امام، جنہوں نے دوسری صدی ہجری کے وسط میں طرابلس پر قبضہ کیا، اباضیوں نے انہیں «امام الدفاع» کا لقب دیا، اور 155ھ/772ء میں عباسی لشکر سے جنگ میں مارے گئے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
