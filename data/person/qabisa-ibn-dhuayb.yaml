summary:
  ar: "من علماء الأمة في الزهري، وكان يعدّه أبو الزناد من فقهاء المدينة الأربعة مع سعيد بن المسيب وعبد الملك بن مروان وعروة بن الزبير، بحسب الشيرازي. وصفه الكتاب بأنه وزير عبد الملك ومستشاره وملازمه في سفره وإقامته، وعارض خلع عبد العزيز بن مروان من ولاية العهد، وتوسط في أمر سعيد بن المسيب بعد ضربه، وقرّب الزهري إلى عبد الملك. ويذكر الكتاب وفاته سنة 86هـ وقيل 87هـ وقيل 88هـ. {cite:salabi-umayyad-state-2020 p.33-36}"
  en: "One of the four Medinan jurists named by Abu al-Zinad, with Sa'id ibn al-Musayyab, Abd al-Malik ibn Marwan and Urwa ibn al-Zubayr, as Shirazi reports."
