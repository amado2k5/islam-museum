summary:
  ar: "أبو الحسين مسلم بن الحجاج بن مسلم القشيري النيسابوري، الإمام الحافظ صاحب «الجامع الصحيح»؛ من المحدثين العلماء بالحديث والفقه وله كتاب الصحيح وكتاب الأسماء والكنى وكتاب الأوحاد وكتاب المفرد وكتاب التاريخ وكتاب الطبقات {cite:fihrist-ibn-al-nadim p. 322}. وُلد بنيسابور بعد المائتين — ٢٠٢ أو ٢٠٤ أو ٢٠٦هـ — وأول سماعه سنة ٢١٨هـ، ورحل من حداثته إلى الحجاز والعراق والشام ومصر، وصنّف صحيحه من ثلاثمائة ألف حديث مسموعة في خمس عشرة سنة وهو نحو أربعة آلاف حديث، وقام من مجلس الذهلي في مسألة اللفظ، وتوفي بنصر آباد ظاهر نيسابور لخمس بقين من رجب سنة ٢٦١هـ وعمره خمس وخمسون {cite:wafayat-ayan v p. 195} {cite:tazkirat-al-huffaz j.2 p. 526-528} {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-692}."
  en: "Abu al-Husayn Muslim ibn al-Hajjaj ibn Muslim al-Qushayri al-Naysaburi, the imam and memoriser who authored the Jami' al-Sahih; among the traditionist scholars of hadith and fiqh, with books including the Sahih, the Asma' wal-Kuna, the Awhad, the Mufrad, the Tarikh and the Tabaqat {cite:fihrist-ibn-al-nadim p. 322}. Born at Nishapur after the year 200 — reported as 202, 204 or 206 — he first heard hadith in 218, journeyed from his youth to the Hijaz, Iraq, Syria and Egypt, and drew his Sahih from three hundred thousand heard hadiths over fifteen years, the book running to some four thousand; he rose out of al-Dhuhli's circle over the lafz question and died at Nasrabad outside Nishapur five nights before the end of Rajab 261, aged fifty-five lunar years {cite:wafayat-ayan v p. 195} {cite:tazkirat-al-huffaz j.2 p. 526-528} {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-692}."
  ur: "ابو الحسین مسلم بن حجاج بن مسلم قشیری نیشاپوری، امام و حافظ اور «جامع صحیح» کے مصنف؛ حدیث و فقہ کے علماء محدثین میں سے، ان کی تصانیف میں صحیح، اسماء والکنیٰ، اوحاد، مفرد، تاریخ اور طبقات ہیں {cite:fihrist-ibn-al-nadim p. 322}۔ 200ھ کے بعد نیشاپور میں پیدا ہوئے — روایات 202، 204 یا 206ھ ہیں — پہلا سماع 218ھ، جوانی سے حجاز، عراق، شام اور مصر کی رحلات، اور تین لاکھ مسموعہ احادیث میں سے پندرہ برس میں صحیح مرتب کی جو تقریباً چار ہزار احادیث پر مشتمل ہے؛ مسئلۂ لفظ پر ذہلی کی مجلس سے اٹھے، اور رجب کے آخری پانچ دن رہتے ہوئے 261ھ میں نیشاپور کے باہر نصرآباد میں پچپن قمری برس کی عمر میں فوت ہوئے {cite:wafayat-ayan v p. 195} {cite:tazkirat-al-huffaz j.2 p. 526-528} {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-692}۔"
