label: { ar: "مسلم بن الحجاج", en: "Muslim Ibn Al Hajjaj" }
summary:
  ar: "أبو الحسين مسلم بن الحجاج القشيري النيسابوري من المحدثين العلماء بالحديث والفقه وله كتاب الصحيح وكتاب الأسماء والكنى وكتاب الأوحاد وكتاب المفرد وكتاب التاريخ وكتاب الطبقات {cite:fihrist-ibn-al-nadim p. 322}. وتذكر «في رحاب السنة» أنه وُلد سنة 206هـ على الصحيح، وتوفي بنيسابور في رجب سنة 261هـ، وأن صحيحه انتُقي من ثلاثمائة ألف حديث في نحو خمس عشرة سنة {cite:fi-rihab-al-sunna-azhar p. 87}{cite:fi-rihab-al-sunna-azhar p. 88}{cite:fi-rihab-al-sunna-azhar p. 92}"
  en: "Muslim ibn al-Hajjaj — whose Sahih the Fihrist records {cite:fihrist-ibn-al-nadim}"
