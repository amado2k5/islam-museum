summary:
  ar: "أبو الحسين مسلم بن الحجاج القشيري النيسابوري، من أبرز الجامعين الأوائل للأحاديث النبوية، وُلد بنيسابور سنة 202هـ أو 206هـ وتوفي سنة 261هـ. رحل في طلب الحديث إلى العراق والحجاز والشام ومصر، وسمع من شيوخ منهم يحيى بن يحيى والقعنبي وقتيبة بن سعيد وأحمد بن حنبل. وتصف دائرة المعارف الإسلامية كتابه «الجامع الصحيح» بأنه، مع صحيح البخاري، أوثق مجموعة عند علماء الحديث من أهل السنة، وبأنه أنفع الكتب الستة للمؤرخين المعاصرين بسبب ترتيب أبوابه."
  en: "Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi was one of the outstanding early collectors of Prophetic traditions, born at Nishapur in 202 or 206 AH and dead in 261 AH. He travelled for hadith to Iraq, the Hijaz, Syria and Egypt and heard from teachers including Yahya ibn Yahya, al-Qa'nabi, Qutayba ibn Sa'id and Ahmad ibn Hanbal. The Encyclopaedia of Islam describes his al-Jami' al-sahih as, with al-Bukhari's Sahih, the most reliable collection in the view of Sunni hadith experts, and as the most useful of the Six Books for modern historians because of its chapter organisation."
  ur: "ابو الحسین مسلم بن حجاج قشیری نیشاپوری نبوی احادیث کے ابتدائی نمایاں جامعین میں سے تھے، جو نیشاپور میں 202 یا 206 ہجری میں پیدا ہوئے اور 261 ہجری میں فوت ہوئے۔ انہوں نے حدیث کے لیے عراق، حجاز، شام اور مصر کا سفر کیا اور یحییٰ بن یحییٰ، قعنبی، قتیبہ بن سعید اور احمد بن حنبل جیسے اساتذہ سے سنا۔ انسائیکلوپیڈیا آف اسلام ان کی الجامع الصحیح کو، بخاری کی صحیح کے ساتھ، اہل سنت کے ماہرین حدیث کے نزدیک سب سے معتبر مجموعہ اور ابواب کی ترتیب کے باعث جدید مورخین کے لیے کتب ستہ میں سب سے مفید قرار دیتا ہے۔"
