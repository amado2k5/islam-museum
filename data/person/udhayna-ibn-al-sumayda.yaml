summary:
  ar: "أذينة بن السميدع العملاقي ممن ملكته الروم من العماليق على مشارق الشام والغرب والجزيرة، ذكره الأعشى بقوله أزال أذينة عن ملكه وأخرج عن ملكه ذا يزن، وملك بعده حسان بن أذينة ثم عمرو بن طرب ويقال هو المعروف بأمه زباء وكان بينه وبين جذيمة الأبرش حروب فقتله جذيمة {cite:muruj-al-dhahab p. 450}."
  en: "The Amalekite set by Rome over east Syria, the west and the Jazira — the 'Udhayna' of al-A'sha's famous line — succeeded by Hassan then Amr ibn Tarib, al-Zabba's father, whom Jadhima killed in their wars {cite:muruj-al-dhahab p. 450}."
  es: "Los amalecitas establecidos por Roma sobre el este de Siria, el oeste y el Jazira —la 'Udhayna' de la famosa línea de al-A'sha— fueron sucedidos por Hassan y luego por Amr ibn Tarib, padre de al-Zabba, a quien Jadhima mató en sus guerras {cite:muruj-al-dhahab p. 450}."
  fr: "Les Amalécites installés par Rome sur l'est de la Syrie, l'ouest et la Jazira — l'« Udhayna » de la célèbre lignée d'al-A'sha — furent remplacés par Hassan puis Amr ibn Tarib, le père d'al-Zabba, que Jadhima tua lors de leurs guerres {cite:muruj-al-dhahab p. 450}."
  ur: "عمالیقیوں کو روم نے مشرقی شام، مغرب اور جزیرہ پر قائم کیا - العشا کی مشہور سطر کا 'ادھینا' - اس کے بعد حسن کے بعد عمرو بن تریب، الزبہ کے والد تھے، جنہیں جدیما نے ان کی جنگوں میں قتل کیا تھا۔ 450}۔"
