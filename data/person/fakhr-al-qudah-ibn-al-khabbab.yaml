summary:
  ar: "المقرئ ناظر الأوقاف؛ تفرد بالرواية عن المأموني فبقي صحيح مسلم يُروى عنه بعد موت أصحابه؛ وكان من الثقات المتقنين {cite:shadharat-dhahab p. 249}."
  en: "Muqri' and overseer of the awqaf (d. 648) — sole transmitter from al-Ma'muni, so that Sahih Muslim lived on in him after his peers had gone {cite:shadharat-dhahab p. 249}."
  es: "Muqri' y supervisor del awqaf (m. 648) — único transmisor de al-Ma'muni, de modo que Sahih Muslim siguió vivo en él después de que sus compañeros se hubieran ido {cite:shadharat-dhahab p. 249}."
  fr: "Muqri' et surveillant des awqaf (d. 648) — seul transmetteur d'al-Ma'muni, de sorte que le Sahih Muslim a continué à vivre en lui après que ses pairs soient partis {cite:shadharat-dhahab p. 249}."
  ur: "مقری اور اوقاف کے نگران ⁦(متوفی 648)⁩ - الممونی کی طرف سے واحد ٹرانسمیٹر، تاکہ صحیح مسلم اس کے ساتھیوں کے چلے جانے کے بعد اس میں زندہ رہے۔ 249}۔"
  tr: "Vakıfların okuyan ve gözetmeni; al-Ma'muni'den benzersiz bir şekilde rivayet etti, böylece yoldaşlarının ölümünden sonra ondan gerçek Müslüman olarak anlatıldı; güvenilir ve kesin olanlardan biriydi {atıf:shadharat-dhahab, s. 249}."
  id: "Pembaca dan pengawas wakaf; ia secara unik menceritakan dari al-Ma'muni, sehingga tetap menjadi Muslim otentik yang diceritakan darinya setelah kematian para sahabatnya; ia termasuk yang dapat dipercaya dan tepat {cite:shadharat-dhahab, hlm. 249}."
