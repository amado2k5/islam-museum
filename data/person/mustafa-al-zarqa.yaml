summary:
  ar: "فقيه وقانوني سوري (1904–1999) وُلد في حلب في أسرة علمية، ودرّس الحقوق المدنية والشريعة في جامعتي دمشق والأردنية، وانتُخب نائبا عن حلب وتولى وزارتي العدل والأوقاف. من أشهر كتبه «المدخل الفقهي العام»، ونال جائزة الملك فيصل العالمية في الدراسات الإسلامية عام 1984، وتوفي في الرياض."
  en: "Syrian jurist and legal scholar (1904–1999), born in Aleppo into a scholarly family. He taught civil law and sharia at the universities of Damascus and Jordan, sat as a deputy for Aleppo and twice held ministerial office; his al-Madkhal al-Fiqhi al-'Amm is a standard modern restatement of Islamic jurisprudence, and he received the King Faisal International Prize for Islamic Studies in 1984. He died in Riyadh."
  ur: "سوری فقیہ اور قانونی عالم (1904ء–1999ء)، حلب میں ایک علمی خاندان میں پیدا ہوئے۔ دمشق اور اردن کی جامعات میں مدنی قانون اور شریعت کے استاد رہے، حلب سے رکن اسمبلی منتخب ہوئے اور دو بار وزیر رہے؛ ان کی مشہور کتاب «المدخل الفقہی العام» ہے اور انھیں 1984ء میں الدراسات اسلامیہ کا شاہ فیصل عالمی انعام ملا۔ ان کا انتقال ریاض میں ہوا۔"
