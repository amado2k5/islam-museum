summary:
  ar: "محدث وفقيه من بلدة بغ في خراسان، بين مرو وهراة، ومن كتبه «شرح السنة». وفي شذرات الذهب توفي سنة ست عشرة وخمس مئة بمرو الروذ في شوال ودفن عند شيخه القاضي حسين، وكان سيداً زاهداً قانعاً يأكل الخبز وحده فلم يزل في ذلك حتى صار يأكله بالزيت وكان ابن أخيه يصنع الفراء، وقال ابن الأهدل هو صاحب الفنون الجامعة والمصنفات النافعة منها معالم التنزيل والجمع بين الصحيحين والمصابيح وصنف في الفقه التهذيب وشرح السنة وكان لا يلقي الدرس إلا على طهارة، وقال السبكي ما رأيناه يختار شيئاً إلا وإذا بحث عنه وجد أقوى من غيره مع اختصار كلامه وهو يدل على ذهن كثير، ونسبته إلى بغ قرية بقرب هراة {cite:shadharat-dhahab p. 529}."
  en: "A hadith scholar and jurist from the town of Baghh in Khurasan, between Marw and Herat. His works include Sharh al-Sunna."
