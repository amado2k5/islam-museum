summary:
  ar: "محدث وفقيه من بلدة بغ في خراسان، بين مرو وهراة، ومن كتبه «شرح السنة». وفي شذرات الذهب توفي سنة ست عشرة وخمس مئة بمرو الروذ في شوال ودفن عند شيخه القاضي حسين، وكان سيداً زاهداً قانعاً يأكل الخبز وحده فلم يزل في ذلك حتى صار يأكله بالزيت وكان ابن أخيه يصنع الفراء، وقال ابن الأهدل هو صاحب الفنون الجامعة والمصنفات النافعة منها معالم التنزيل والجمع بين الصحيحين والمصابيح وصنف في الفقه التهذيب وشرح السنة وكان لا يلقي الدرس إلا على طهارة، وقال السبكي ما رأيناه يختار شيئاً إلا وإذا بحث عنه وجد أقوى من غيره مع اختصار كلامه وهو يدل على ذهن كثير، ونسبته إلى بغ قرية بقرب هراة {cite:shadharat-dhahab p. 529}."
  en: "A hadith scholar and jurist from the town of Baghh in Khurasan, between Marw and Herat. His works include Sharh al-Sunna."
  fr: "Savant du hadith et juriste de la ville de Baghh au Khorassan, entre Marw et Hérat. Ses œuvres comprennent Sharh al-Sunna."
  es: "Es un erudito en hadices y jurista originario de Baghh, en Jorasán, entre Marw y Herat. Entre sus obras destaca Sharh al-Sunna."
  ur: "وہ مروہ اور ہرات کے درمیان خراسان کے باغ نامی قصبے سے حدیث کے عالم اور فقیہ ہیں۔ ان کی تصانیف میں شرح السنۃ شامل ہے۔"
  tr: "Horasan'da, Merv ve Herat arasında yer alan Bagh kasabasından bir hadis âlimi ve fıkıhçıydı. Eserleri arasında \"Şerhü'l-Sünnet\" (Sünnetin Açıklaması) bulunmaktadır. Şadharat el-Dhahab'da, Hicri 516 yılında Şevval ayında Merv el-Rudh'da vefat ettiği ve hocası Kadı Hüseyin'in yanına defnedildiği belirtilmektedir. Asil, zühd sahibi ve kanaatkâr bir insandı; ekmeği tek başına yerdi ve bu şekilde devam etti, ta ki üzerine yağ sürmeye başlayana kadar. Yeğeni kürkçüydü. İbn el-Ahdal, onun kapsamlı sanatların ve faydalı eserlerin ustası olduğunu, bunlar arasında Ma'alim el-Tanzil (Vahinin İşaretleri), el-Cem'beyn el-Sahihayn (İki Sahih'in Toplanması) ve el-Masabih (Lambalar) bulunduğunu söylemiştir. Ayrıca fıkıh alanında el-Tahdhib (İyileştirme) ve Şerh el-Sünne (Sünnetin Açıklaması) adlı eserlerin de yazarıdır. Ritüel temizliğini tamamlamadan ders vermezdi. El-Subki, onun kısa konuşmasına rağmen, araştırdığında diğerlerinden daha güçlü bulduğu bir şeyi seçtiğini, bunun da büyük bir zekâya işaret ettiğini söylemiştir. Nisbesi, Herat yakınlarındaki Bagh köyüne aittir. {cite:shadharat-dhahab s. 529}"
  id: "Seorang ulama hadits dan ahli fiqih dari kota Bagh di Khorasan, antara Merv dan Herat. Di antara kitab-kitabnya adalah \"Sharh al-Sunnah\" (Penjelasan Sunnah). Dalam Shadharat al-Dhahab, disebutkan bahwa beliau wafat pada tahun 516 H di Merv al-Rudh pada bulan Syawal dan dimakamkan di samping gurunya, Qadi Husayn. Beliau adalah seorang yang mulia, sakti, dan puas diri yang hanya makan roti dan terus melakukannya hingga akhirnya mulai makan roti dengan minyak. Keponakannya adalah seorang pengrajin bulu. Ibn al-Ahdal mengatakan bahwa beliau adalah ahli dalam berbagai bidang ilmu dan karya-karya bermanfaat, termasuk Ma'alim al-Tanzil (Tanda-Tanda Wahyu), al-Jam' bayn al-Sahihayn (Kumpulan Dua Kitab Sahih), dan al-Masabih (Lampu-Lampu). Beliau juga menulis kitab al-Tahdhib (Penyempurnaan) dan Sharh al-Sunnah (Penjelasan Sunnah) tentang fiqih. Beliau tidak akan memberikan pelajaran kecuali dalam keadaan suci secara ritual. Al-Subki berkata bahwa kami tidak pernah melihatnya memilih sesuatu kecuali setelah menelitinya, beliau menemukan bahwa hal itu lebih kuat daripada yang lain, meskipun pidatonya singkat, yang menunjukkan pikiran yang hebat. Nisba (nama julukan) beliau adalah Bagh, sebuah desa dekat Herat. {cite:shadharat-dhahab p. 529}"
