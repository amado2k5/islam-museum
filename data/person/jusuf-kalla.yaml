  es: "Político y empresario indonesio, nacido en 1942 en Sulawesi. Fue vicepresidente de Indonesia en dos ocasiones (2004-2009 y 2014-2019), presidente de la Cruz Roja Indonesia y un destacado mediador en la resolución de conflictos, incluido el proceso de paz de Aceh."
  fr: "Homme politique et homme d'affaires indonésien, né en 1942 à Sulawesi. Deux fois vice-président de l'Indonésie (2004-2009 et 2014-2019), président de la Croix-Rouge indonésienne et médiateur reconnu dans le cadre du règlement des conflits, notamment le processus de paix d'Aceh."
