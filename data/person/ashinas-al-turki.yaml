summary:
  ar: "مولى المعتصم؛ عند البلاذري دفع إليه قصر الرشيد بالقاطول ثم أنزله فيمن ضم إليه من القواد كرخ فيروز بسر من رأى وعند السيوطي استخلفه الواثق على السلطنة سنة ثمان وعشرين وألبسه وشاحين مجوهرين وتاجاً مجوهراً وأظن أنه أول خليفة استخلف سلطاناً {cite:tarikh-khulafa-minhaj-1434 p. 529}. وأقطعه المعتصم وأصحابه من الأتراك الموضع المعروف بكرخ سامرا {cite:muruj-al-dhahab p. 445}"
  en: "al-Mu'tasim's mawla; in al-Baladhuri given Qasr al-Rashid at al-Qatul, then settled with his attached commanders at Karkh Fayruz in Sur man Ra'a."
  es: "mawla de al-Mu'tasim; en al-Baladhuri dio Qasr al-Rashid en al-Qatul, luego se instaló con sus comandantes adjuntos en Karkh Fayruz en Surman Ra'a."
  fr: "le mawla d'al-Mu'tasim; à al-Baladhuri donné Qasr al-Rashid à al-Qatul, puis s'installe avec ses commandants adjoints à Karkh Fayruz à Sur man Ra'a."
  ur: "معتصم کا مولا؛ البلادھوری میں القطول میں قصر الرشید کو دیا، پھر سور من راع میں کرخ فیروز میں اپنے منسلک کمانڈروں کے ساتھ آباد ہوا۔"
  tr: "O, el-Mu'tasim'in özgür adamıydı; el-Baladhuri'ye göre, el-Reşid'in sarayı bir tuteli ile verildi, ardından Rukh Fairuz gibi ona komutan olarak katılanların arasına, gördüğü herkesten gizli olarak yerleştirildi. El-Suyuti'ye göre, el-Vetik onu yirmi sekizinci yılda sultanlığın varisi olarak atadı, ona iki mücevherli şal ve mücevherli bir taç giydirdi. Sanırım onun yerine sultan olan ilk halife oldu {atıf:Tarikh-khulafa-minhaj-1434 s. 529}. Al-Mu'tasim ve Türklerden arkadaşları Rukh Samarra olarak bilinen yerde şehri kesmiş {atıf:Muruj-al-dhahab s. 445}"
  id: "Ia adalah mantan al-Mu'tasim; menurut al-Baladhuri, ia diberikan istana al-Rashid dengan tutel, lalu ditempatkan di antara mereka yang bergabung dengannya sebagai komandan seperti Rukh Fairuz, secara rahasia dari siapa pun yang dilihatnya. Menurut al-Suyuti, al-Wathiq mengangkatnya sebagai penerus kesultanan pada tahun dua puluh delapan, mengenakan dua selendang permata dan mahkota berhias permata. Saya percaya ia adalah khalifah pertama yang menggantikannya sebagai sultan {cite:Tarikh-khulafa-minhaj-1434 hlm. 529}. Al-Mu'tasim dan para sahabatnya dari Turki memutus jalur itu di tempat yang dikenal sebagai Rukh Samarra {cite:Muruj-al-dhahab hlm. 445}"
