  ar: "مولى المعتصم؛ عند البلاذري دفع إليه قصر الرشيد بالقاطول ثم أنزله فيمن ضم إليه من القواد كرخ فيروز بسر من رأى وعند السيوطي استخلفه الواثق على السلطنة سنة ثمان وعشرين وألبسه وشاحين مجوهرين وتاجاً مجوهراً وأظن أنه أول خليفة استخلف سلطاناً {cite:tarikh-khulafa-minhaj-1434 p. 529}.، وأقطعه المعتصم وأصحابه من الأتراك الموضع المعروف بكرخ سامرا {cite:muruj-al-dhahab p. 445}"
  en: "al-Mu'tasim's mawla; in al-Baladhuri given Qasr al-Rashid at al-Qatul, then settled with his attached commanders at Karkh Fayruz in Sur man Ra'a."
