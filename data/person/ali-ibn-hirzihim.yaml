summary:
  ar: "فقيه مغربي مشهور يصفه العيدروس، نقلاً عن اليافعي، بأنه كان مطاعاً مسموع الكلمة، بالغ في الإنكار على إحياء علوم الدين وهمّ بإحراق نسخه في الجامع يوم الجمعة، ثم رجع عن إنكاره بعد رؤيا رآها، ولازم مطالعة الإحياء حتى صار من أكابر المشايخ؛ ويُروى عن أبي الحسن الشاذلي أنه مات وأثر السياط على ظهره {cite:ihya-kitab-al-shab-pts13-16 p. 779} {cite:ihya-kitab-al-shab-pts13-16 p. 780}."
  en: "A celebrated Maghribi jurist who, according to al-Aydarus quoting al-Yafi'i, was obeyed and listened to, denounced the Ihya' vehemently and meant to burn its copies in the congregational mosque on a Friday, then gave up his objection after a dream and devoted himself to reading the Ihya' until he became one of the great masters; Abu al-Hasan al-Shadhili is reported to have said he died with the marks of the lashes still on his back {cite:ihya-kitab-al-shab-pts13-16 p. 779} {cite:ihya-kitab-al-shab-pts13-16 p. 780}."
  ur: "مغرب کے ایک مشہور فقیہ، جن کے بارے میں عیدروس، یافعی سے نقل کرتے ہوئے، بتاتے ہیں کہ ان کی بات مانی اور سنی جاتی تھی، انہوں نے احیاء علوم الدین کا سخت انکار کیا اور جمعہ کے دن جامع مسجد میں اس کے نسخے جلانے کا ارادہ کیا، پھر ایک خواب کے بعد اپنے انکار سے رجوع کیا اور احیاء کے مطالعے میں لگ گئے یہاں تک کہ بڑے مشائخ میں سے ہو گئے؛ ابو الحسن شاذلی سے منقول ہے کہ ان کی وفات ہوئی تو کوڑوں کے نشان ان کی پیٹھ پر تھے {cite:ihya-kitab-al-shab-pts13-16 p. 779} {cite:ihya-kitab-al-shab-pts13-16 p. 780}۔"
