  ar: "زُيَيْد بن الصلت بن معد يكرب الكندي، مدني، اختُلف في صحبته، روى عن أبي بكر وعمر وعثمان ، وروى عنه عروة والزهري وإبراهيم بن قارظ وقتادة، وقال ابن معين: ثقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
  en: "Zuyayd ibn al-Salt ibn Ma'd Yakrib al-Kindi, a Madinan. Scholars differ on whether he met the Prophet. He transmitted from Abu Bakr, Umar and Uthman, and was transmitted from by Urwa, al-Zuhri, Ibrahim ibn Qarizh and Qatada; Ibn Ma'in called him trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
