label:
  ar: "زُيَيْد بن الصلت"
  en: "Zuyayd ibn al-Salt"
  es: "Zuyayd ibn al-Salt"
  fr: "Zuyayd ibn al-Salt"
  ur: "زید بن الصلت"
summary:
  ar: "زُيَيْد بن الصلت بن معد يكرب الكندي، مدني، اختُلف في صحبته، روى عن أبي بكر وعمر وعثمان ، وروى عنه عروة والزهري وإبراهيم بن قارظ وقتادة، وقال ابن معين: ثقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
  en: "Zuyayd ibn al-Salt ibn Ma'd Yakrib al-Kindi, a Madinan. Scholars differ on whether he met the Prophet. He transmitted from Abu Bakr, Umar and Uthman, and was transmitted from by Urwa, al-Zuhri, Ibrahim ibn Qarizh and Qatada; Ibn Ma'in called him trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
  es: "Zuyayd ibn al-Salt ibn Ma'd Yakrib al-Kindi, en Medina. Los eruditos discrepan sobre si conoció al Profeta. Transmitió de Abu Bakr, Umar y Uthman, y fue transmitido por Urwa, al-Zuhri, Ibrahim ibn Qarizh y Qatada; Ibn Ma'in lo consideró digno de confianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
  fr: "Zuyayd ibn al-Salt ibn Ma'd Yakrib al-Kindi, à Médine. Les savants divergent quant à savoir s'il a rencontré le Prophète. Il a transmis les hadiths d'après Abu Bakr, 'Umar et 'Uthman, et ceux-ci ont été transmis par 'Urwa, al-Zuhri, Ibrahim ibn Qarizh et Qatada; Ibn Ma'in le considérait comme digne de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
  ur: "زید بن الصلت ابن معد یکریب الکندی، ایک مدینہ۔ اس بارے میں علماء کا اختلاف ہے کہ آیا وہ نبی سے ملا تھا۔ اس نے ابوبکر، عمر اور عثمان سے روایت کی ہے، اور عروہ، الزہری، ابراہیم بن قریظ اور قتادہ سے نقل ہوئی ہے۔ ابن معین نے اسے ثقہ کہا۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 15407}"
  tr: "Medinanlı olan Zayd ibn al-Salt ibn Ma'd Yakrab al-Kindi, farklı dostluklarla birlikte Ebu Bekir, Ömer ve Osman ile ondan Urve, el-Zuhri, İbrahim ibn Qariz ve Katadah'tan rivayet etti. İbn Ma'in şöyle dedi: Güvenilir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15407}"
  id: "Zayd ibn al-Salt ibn Ma'd Yakrab al-Kindi, seorang Madinah dengan teman yang berbeda, menceritakan dari Abu Bakr, Umar, dan Uthman, serta dari dia Urwah, al-Zuhri, Ibrahim ibn Qariz, dan Qatadah. Ibn Ma'in berkata: Dapat dipercaya. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.15407}"
