summary:
  ar: "أحمد بن جعفر بن هانئ، المملوء من المعاني، المكلوء من التواني، صاحب الأحوال الرفيعة، يستدل بالآيات والبراهين، ويعتبر بالأدلة والملامات. كان ينقل عنه أبو نعيم أقوالًا في العبودية والمعونة والخشية والتوفيق، وذكر أن من لزم الخدمة ورث منازل القربة."
  en: "Ahmad ibn Ja'far ibn Hani, filled with meaning and free of idleness, one of lofty states, who reasons from signs and proofs and takes lessons from the marks of guidance. Abu Nu'aym records his sayings on service, help from the Master, fear of God and success, and his saying that whoever keeps to service inherits the stations of nearness."
  ur: "احمد بن جعفر بن ہانی، معانی سے لبریز اور سستی سے محفوظ، بلند احوال والے، جو آیات اور دلائل سے استدلال کرتے اور ہدایت کی علامات سے سبق لیتے تھے۔ ابو نعیم نے ان کے بندگی، مالک کی مدد، خشیت اور توفیق کے بارے میں اقوال نقل کیے ہیں، اور ان کا قول ہے کہ جو خدمت سے وابستہ رہے وہ قربت کے مقامات کا وارث ہوتا ہے۔"
