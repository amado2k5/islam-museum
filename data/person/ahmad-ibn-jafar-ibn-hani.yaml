gender: male
roles: [mystic, transmitter]
summary:
  ar: "أحمد بن جعفر بن هانئ، المملوء من المعاني، المكلوء من التواني، صاحب الأحوال الرفيعة، يستدل بالآيات والبراهين، ويعتبر بالأدلة والملامات. كان ينقل عنه أبو نعيم أقوالًا في العبودية والمعونة والخشية والتوفيق، وذكر أن من لزم الخدمة ورث منازل القربة."
  en: "Ahmad ibn Ja'far ibn Hani, filled with meaning and free of idleness, one of lofty states, who reasons from signs and proofs and takes lessons from the marks of guidance. Abu Nu'aym records his sayings on service, help from the Master, fear of God and success, and his saying that whoever keeps to service inherits the stations of nearness."
  fr: "Ahmad ibn Ja'far ibn Hani, décrit comme plein de sens, exempt d'oisiveté et aux états spirituels élevés, raisonnant à partir des signes et des preuves et tirant leçon des marques de guidance. Abu Nu'aym rapporte ses paroles sur le service, l'aide du Maître, la crainte de Dieu et la réussite, ainsi que sa parole selon laquelle la persévérance dans le service fait hériter des stations de proximité."
  ur: "احمد بن جعفر بن ہانی، معانی سے لبریز اور سستی سے محفوظ، بلند احوال والے، جو آیات اور دلائل سے استدلال کرتے اور ہدایت کی علامات سے سبق لیتے تھے۔ ابو نعیم نے ان کے بندگی، مالک کی مدد، خشیت اور توفیق کے بارے میں اقوال نقل کیے ہیں، اور ان کا قول ہے کہ جو خدمت سے وابستہ رہے وہ قربت کے مقامات کا وارث ہوتا ہے۔"
  es: "Ahmad ibn Ja'far ibn Hani, lleno de significado y libre de ociosidad, de elevados estados, razonaba a partir de signos y pruebas y aprendía de las señales de la guía. Abu Nu'aym registra sus dichos sobre el servicio, la ayuda del Maestro, el temor de Dios y el éxito, y su afirmación de que quien persevera en el servicio hereda los estados de cercanía."
  tr: "Hikmet dolu ve gafletten uzak, yüce makamlara sahip Ahmed ibn Cafer ibn Hani', ayetler ve delillerle akıl yürütür, delillere ve öğütlere kulak verirdi. Ebu Nu'aym, kulluk, ilahi yardım, saygı ve başarı konularında ondan alıntı yapmış ve hizmette sebat edenin Allah'a yakınlık makamlarını miras alacağını belirtmiştir."
  id: "Ahmad ibn Ja'far ibn Hani', yang penuh dengan kebijaksanaan dan bebas dari kelalaian, pemilik kedudukan yang tinggi, berargumentasi dengan ayat-ayat dan bukti-bukti, serta memperhatikan bukti dan nasihat. Abu Nu'aym mengutipnya tentang pengabdian, pertolongan ilahi, penghormatan, dan kesuksesan, dan menyatakan bahwa siapa pun yang tekun dalam pengabdian akan mewarisi kedudukan kedekatan dengan Tuhan."
