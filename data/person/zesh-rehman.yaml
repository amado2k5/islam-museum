summary:
  ar: "مدافع بريطاني من أصل باكستاني (وُلد سنة 1983 في برمنغهام)، أول لاعب بريطاني آسيوي يلعب في الدرجة الأولى الإنجليزية وفي درجاتها الأربع كلها، لعب لفولهام وكوينز بارك رينجرز وأندية في تايلاند وهونغ كونغ وماليزيا، ومثّل باكستان دولياً ثم اتجه إلى التدريب في هونغ كونغ وبورتسموث."
  en: "British defender of Pakistani origin (born 1983 in Birmingham), the first British Asian to play in England's top division and the first to play in all four divisions, who played for Fulham, Queens Park Rangers and clubs in Thailand, Hong Kong and Malaysia, represented Pakistan internationally, and moved into coaching in Hong Kong and at Portsmouth."
  ur: "پاکستانی نژاد برطانوی محافظ (پیدائش 1983، برمنگھم)، انگلستان کے ٹاپ ڈویژن اور چاروں ڈویژنوں میں کھیلنے والے پہلے برطانوی ایشیائی کھلاڑی، جو فلہم، کوئینز پارک رینجرز اور تھائی لینڈ، ہانگ کانگ و ملائیشیا کے کلبوں کے لیے کھیلے، پاکستان کی بین الاقوامی نمائندگی کی، اور پھر ہانگ کانگ اور پورٹسماؤتھ میں کوچنگ سے وابستہ ہوئے۔"
