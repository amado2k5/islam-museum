summary:
  ar: شمس فريدلاندر ⁦(1940–2022)⁩ فنان ومصمم وأستاذ أمريكي مسلم، أستاذ فخري بالجامعة الأمريكية بالقاهرة، ومقام ⁦(ممثل)⁩ للطريقة الخلوتية الجراحية، ومن أشهر مؤلفي الغرب عن جلال الدين الرومي؛ توفي في 22 نوفمبر
    2022.
  en: Shems Friedlander ⁦(1940–2022)⁩ was an American Muslim artist, graphic designer and professor emeritus at the American University in Cairo, a muqaddam of the Halveti-Jerrahi Sufi order, and one of
    the West's best-known authors on Jalaluddin Rumi; he died on 22 November 2022.
  ur: شمس فریڈلینڈر ⁦(1940–2022)⁩ امریکی مسلم فنکار، گرافک ڈیزائنر اور امریکن یونیورسٹی ان قاہرہ کے پروفیسر ایمریٹس تھے، حلوتی-جراحی صوفی سلسلے کے مقام ⁦(نمائندہ)⁩ اور جلال الدین رومی پر مغرب کے معروف مصنفین
    میں؛ 22 نومبر 2022 کو وفات پائی۔
  es: "Shems Friedlander (1940-2022) fue un artista musulmán estadounidense, diseñador gráfico y profesor emérito de la Universidad Americana de El Cairo, muqaddam de la orden sufí Halveti-Jerrahi y uno de los autores occidentales más conocidos sobre Jalaluddin Rumi; falleció el 22 de noviembre de 2022."
  fr: "Shems Friedlander (1940–2022) était un artiste, graphiste et professeur émérite musulman américain à l'Université américaine du Caire, un muqaddam de l'ordre soufi Halveti-Jerrahi et l'un des auteurs occidentaux les plus connus sur Jalaluddin Rumi; il est décédé le 22 novembre 2022."
  tr: "Shams Friedlander (1940–2022), Amerikalı bir sanatçı, tasarımcı ve Müslüman profesör, Kahire'deki Amerikan Üniversitesi'nde fahri profesör, cerrahi inziva yönteminin makamı (temsilcisi) ve Celaleddin Rumi hakkında en ünlü Batılı yazarlardan biriydi; 22 Kasım 2022'de vefat etti."
  id: "Shams Friedlander (1940–2022) adalah seorang seniman, desainer, dan profesor Muslim asal Amerika, profesor kehormatan di American University di Kairo, serta maqam (perwakilan) metode retret bedah, serta salah satu penulis Barat paling terkenal tentang Jalal al-Din Rumi; ia meninggal dunia pada 22 November 2022."
