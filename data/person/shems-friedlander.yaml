  en: Shems Friedlander ⁦(1940–2022)⁩ was an American Muslim artist, graphic designer and professor emeritus at the American University in Cairo, a muqaddam of the Halveti-Jerrahi Sufi order, and one of
    the West's best-known authors on Jalaluddin Rumi; he died on 22 November 2022.
  ur: شمس فریڈلینڈر ⁦(1940–2022)⁩ امریکی مسلم فنکار، گرافک ڈیزائنر اور امریکن یونیورسٹی ان قاہرہ کے پروفیسر ایمریٹس تھے، حلوتی-جراحی صوفی سلسلے کے مقام ⁦(نمائندہ)⁩ اور جلال الدین رومی پر مغرب کے معروف مصنفین
    میں؛ 22 نومبر 2022 کو وفات پائی۔
