id: person/bishr-ibn-safwan-al-kalbi
class: person
label: { ar: "بشر بن صفوان الكلبي" }
summary:
  ar: "عند البلاذري: ولّاه يزيد بن عبد الملك إفريقية بعد مقتل يزيد بن أبي مسلم فضرب عنق عبد الله بن موسى بن نصير المتّهم بقتله وتأليب الناس عليه ثم ولّاه هشام بن عبد الملك أيضاً فتوفي بالقيروان سنة تسع ومائة — وفي نسخة «بسر». ويذكر الكتاب أنه كان والي إفريقية عند بداية خلافة هشام بن عبد الملك، وأنه استخلف قبل وفاته نفاش بن قرط الكلبي. {cite:salabi-umayyad-state-2020 p.485}"
  en: "In al-Baladhuri: Yazid ibn Abd al-Malik gave him Ifriqiya after Yazid ibn Abi Muslim's killing — he struck off the neck of Abdallah ibn Musa ibn Nusayr, accused of that killing and of stirring the people; Hisham ibn Abd al-Malik kept him on and he died at Qayrawan in year 109 — one copy reads 'Busr'."
gender: male
