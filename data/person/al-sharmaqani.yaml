summary:
  ar: "مقرئ بغدادي من أهل نسا نزل بغداد، كان من حفاظ القرآن العالمين باختلاف القراء ووجوه القراءات، حدّث عن جماعة وكان صدوقًا. روي عنه أنه زلّ إلى دجلة في زمان مجاعة يأكل ما يرمى به الأصحاب، فرفعه رئيس الرؤساء ابن المسلمة بسره: أمر غلامه أن يعمل مفتاحًا للمسجد الذي يأوي إليه بدرب الزعفراني من غير أن يعلمه، وأن يُحمل إليه كل يوم ثلاثة أرطال خبز سميد ودجاجة وحلوى وسكر نفعلًا؛ فلما وجد الشرمقاني ذلك مطروحًا في القبلة والباب مغلق قال في نفسه «هذا من الجنة، ويجب كتمانه، فإن من شرط الكرامة كتمانها»، حتى أفصح له ابن العلاف بعد إلحاح فقال يجب أن تدعو لابن المسلمة فإنه هو الذي فعل ذلك — فنغّص عليه عيشه وبانت عليه شواهد الانكسار. توفي في صفر سنة إحدى وخمسين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.554-555}."
  en: "A Quran-master of Nasa settled in Baghdad, keeper of the readings. In a year of famine he was seen gathering thrown scraps by the Tigris; the ra'is al-ru'asa' Ibn al-Muslima, without telling him, had a key made to his mosque-lodge in the Za'farani alley and three ratls of fine bread, a chicken, sweets and sugar delivered daily. Finding the food laid out with the door locked he told himself 'this is from Paradise, and a karamah must be kept secret' — until pressed, and then told it was Ibn al-Muslima's doing, whereupon his ease turned to visible distress. Died Safar 451 {cite:muntazam-ibn-al-jawzi j.8 p.554-555}."
  fr: "Un maître du Coran de la Nasa s’installa à Bagdad, gardien des lectures. Dans une année de famine, il a été vu ramasser des restes jetés par le Tigre ; le ra'is al-ru'asa 'Ibn al-Muslima, sans lui dire, avait une clé faite à sa mosquée-lodge dans la ruelle Za'farani et trois ratls de pain fin, un poulet, des bonbons et du sucre livrés quotidiennement. Trouvant la nourriture disposée avec la porte verrouillée, il se dit « c'est du paradis, et une karamah doit être gardée secrète » - jusqu'à ce qu'il soit pressé, puis dit que c'était l'œuvre d'Ibn al-Muslima, après quoi son aisance s'est transformée en détresse visible. Décédé Safar 451 {cite:muntazam-ibn-al-jawzi j.8 p.554-555}."
  es: "Un maestro del Corán de la Nasa, afincado en Bagdad, era el guardián de las lecturas. En un año de hambruna, se le vio recogiendo restos de comida arrojados por el Tigris; el ra'is al-ru'asa' Ibn al-Muslima, sin avisarle, mandó hacer una llave para su mezquita-albergue en el callejón Za'farani y le entregaba diariamente tres ratls de pan fino, un pollo, dulces y azúcar. Al encontrar la comida preparada con la puerta cerrada, pensó: «Esto viene del Paraíso, y un karamah debe mantenerse en secreto», hasta que lo presionaron y le dijeron que era obra de Ibn al-Muslima, momento en el que su tranquilidad se transformó en visible angustia. Murió en Safar de 451 {cite:muntazam-ibn-al-jawzi j.8 p.554-555}."
  ur: "ناسا کا ایک قرآن ماسٹر بغداد میں مقیم تھا، قراءت کا نگران۔ قحط کے ایک سال میں اسے دجلہ کی طرف سے پھینکے گئے ٹکڑوں کو جمع کرتے ہوئے دیکھا گیا۔ رئیس الروصع ابن المسلمہ نے اسے بتائے بغیر، ظفرانی گلی میں واقع اپنی مسجد کے لاج کی ایک چابی بنائی تھی اور تین رتن باریک روٹی، ایک مرغی، مٹھائی اور چینی روزانہ پہنچائی جاتی تھی۔ دروازے پر بند پڑا کھانا ڈھونڈ کر اس نے اپنے آپ سے کہا کہ 'یہ جنت کی طرف سے ہے، اور ایک کرامت کو خفیہ رکھنا چاہیے' - جب تک دبایا نہ جائے، اور پھر بتایا کہ یہ ابن المسلمہ کا کام ہے، جس کے بعد اس کی آسانی ظاہری پریشانی میں بدل گئی۔ متوفی صفر 451۔"
  tr: "Nasa halkından Bağdat'ta yerleşen bir Bağdatlı kârifci olan Sher, çeşitli okunanlar ve çeşitli yorumlar arasında bilinen Kur'an ezbercileri arasındaydı. Bir gruptan rivayet etti ve dürüsttü. Kıtlık zamanında Dicle'ye gizlice gittiği ve sahabelerin ona attığı şeyleri yediği rivayet edilir. Şeflerin reisi İbn el-Müslim gizlice onu büyüttü: Hizmetkarına Dare'de sığındığı caminin anahtarını yapmasını emretti b al-Za'farani haberi olmadan ona her gün üç kilo irmik ekmeği, tavuk, tatlı ve şeker getirmesini istedi. El-Şermakani bunu Kıble'de kapı kapalı olarak serdiğini görünce kendi kendine, \"Bu cennetten geliyor ve gizlenmelidir, çünkü gizlemek onur şartıdır,\" dedi. İbn al-Allaf ısrar ettikten sonra ona, Müslüman kadının oğlu için dua etmen gerektiğini söyledi, çünkü bunu yapan oydu—bu da hayatını zorlaştırdı ve yenilgi belirtilerini gösterdi. Dört yüz elli bir yılında Safar'da öldü {cite:Muntazam-ibn-al-jawzi J.8 s.554-555}."
  id: "Seorang pembaca Baghdadi dari masyarakat Nasa yang menetap di Baghdad, ia termasuk di antara para penghafal Al-Qur'an yang dikenal di antara para pembaca dan berbagai penafsiran. Ia bercerita dari kelompok dan jujur. Diceritakan bahwa ia menyelinap ke Sungai Tigris saat masa kelaparan, memakan apa yang dilemparkan para sahabat kepadanya. Kepala para kepala, Ibn al-Muslimah, diam-diam membesarkannya: Ia memerintahkan pelayannya untuk membuat kunci masjid di mana ia berlindung di Darb al-Muslimah -Za'farani tanpa sepengetahuannya, dan membawakan tiga pon roti semolina, ayam, permen, dan gula setiap hari. Ketika Al-Sharmaqani menemukan ini terbentang di Qibla dengan pintu tertutup, ia berkata pada dirinya sendiri, \"Ini berasal dari Surga dan harus disembunyikan, karena menyembunyikannya adalah syarat martabat.\" Ibn al-Allaf berkata kepadanya setelah bersikeras bahwa kamu harus berdoa untuk putra wanita Muslim itu, karena dialah yang melakukannya—yang membuat hidupnya sulit dan menunjukkan tanda-tanda kekalahan. Ia meninggal di Safar pada tahun empat ratus lima puluh satu {cite:Muntazam-ibn-al-jawzi J.8 hlm.554-555}."
