summary:
  ar: "مقرئ بغدادي من أهل نسا نزل بغداد، كان من حفاظ القرآن العالمين باختلاف القراء ووجوه القراءات، حدّث عن جماعة وكان صدوقًا. روي عنه أنه زلّ إلى دجلة في زمان مجاعة يأكل ما يرمى به الأصحاب، فرفعه رئيس الرؤساء ابن المسلمة بسره: أمر غلامه أن يعمل مفتاحًا للمسجد الذي يأوي إليه بدرب الزعفراني من غير أن يعلمه، وأن يُحمل إليه كل يوم ثلاثة أرطال خبز سميد ودجاجة وحلوى وسكر نفعلًا؛ فلما وجد الشرمقاني ذلك مطروحًا في القبلة والباب مغلق قال في نفسه «هذا من الجنة، ويجب كتمانه، فإن من شرط الكرامة كتمانها»، حتى أفصح له ابن العلاف بعد إلحاح فقال يجب أن تدعو لابن المسلمة فإنه هو الذي فعل ذلك — فنغّص عليه عيشه وبانت عليه شواهد الانكسار. توفي في صفر سنة إحدى وخمسين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.554-555}."
  en: "A Quran-master of Nasa settled in Baghdad, keeper of the readings. In a year of famine he was seen gathering thrown scraps by the Tigris; the ra'is al-ru'asa' Ibn al-Muslima, without telling him, had a key made to his mosque-lodge in the Za'farani alley and three ratls of fine bread, a chicken, sweets and sugar delivered daily. Finding the food laid out with the door locked he told himself 'this is from Paradise, and a karamah must be kept secret' — until pressed, and then told it was Ibn al-Muslima's doing, whereupon his ease turned to visible distress. Died Safar 451 {cite:muntazam-ibn-al-jawzi j.8 p.554-555}."
