id: person/al-mustansir-hafsi
class: person
label:
  ar: المستنصر بالله الحفصي
  en: al-Mustansir billah al-Hafsi
  ur: "مستنصر باللہ حفصی"
summary:
  ar: "أبو عبد الله محمد بن أبي زكريا، ثاني خلفاء الدولة الحفصية؛ بويع بعد هلاك أبيه سنة 647هـ واختار لعلامته «الحمد لله والشكر لله»، وفي دولته دخلت مكة في الدعوة الحفصية وخطب له شرفها على المنابر، وتلقب بالإمام المستنصر بالله أمير المؤمنين، وبنى الآثار المشهورة بتونس ومنها بستان أبي فهر الذي وصفه ابن خلدون، وقتل عميه اللحياني وأبا إبراهيم وحمل رؤوسهما إليه."
  en: "Abu Abd Allah Muhammad ibn Abi Zakariya, second caliph of the Hafsid state; acclaimed after his father's death in 647 AH, choosing for his motto «الحمد لله والشكر لله», in whose reign Mecca entered the Hafsid da'wa and its sharif preached him from the minbars, taking the title Imam al-Mustansir billah Commander of the Faithful, builder of the famed Abu Fahr garden at Tunis."
  ur: "ابو زکریا کے بیٹے اور حفصی خاندان کے دوسرے حکمران؛ ان کے دور میں مکہ میں حفصی دعوت کا خطبہ پڑھا گیا اور تونس میں ابو فہر کا باغ تعمیر ہوا۔ {cite:tarikh-ibn-khaldun-ibar}"
