label:
  ar: المستنصر بالله الحفصي
  en: al-Mustansir billah al-Hafsi
  fr: "al-Mustansir billah al-Hafsi"
  ur: "مستنصر باللہ حفصی"
  es: "al-Mustansir billah al-Hafsi"
summary:
  ar: "أبو عبد الله محمد بن أبي زكريا، ثاني خلفاء الدولة الحفصية؛ بويع بعد هلاك أبيه سنة 647هـ واختار لعلامته «الحمد لله والشكر لله»، وفي دولته دخلت مكة في الدعوة الحفصية وخطب له شرفها على المنابر، وتلقب بالإمام المستنصر بالله أمير المؤمنين، وبنى الآثار المشهورة بتونس ومنها بستان أبي فهر الذي وصفه ابن خلدون، وقتل عميه اللحياني وأبا إبراهيم وحمل رؤوسهما إليه."
  en: "Abu Abd Allah Muhammad ibn Abi Zakariya, second caliph of the Hafsid state; acclaimed after his father's death in 647 AH, choosing for his motto «الحمد لله والشكر لله», in whose reign Mecca entered the Hafsid da'wa and its sharif preached him from the minbars, taking the title Imam al-Mustansir billah Commander of the Faithful, builder of the famed Abu Fahr garden at Tunis."
  fr: "Abu Abd Allah Muhammad ibn Abi Zakariya, deuxième calife de l'État hafside ; acclamé après la mort de son père en 647 de l’hégire, choisissant pour sa devise « الحمد لله والشكر لله », dans le règne duquel la Mecque est entrée dans la da'wa hafside et son Sharif l'a prêché depuis les minbars, prenant le titre d'Imam al-Mustansir billah Commandant des fidèles, constructeur du célèbre jardin d'Abu Fahr."
  ur: "ابو زکریا کے بیٹے اور حفصی خاندان کے دوسرے حکمران؛ ان کے دور میں مکہ میں حفصی دعوت کا خطبہ پڑھا گیا اور تونس میں ابو فہر کا باغ تعمیر ہوا۔ {cite:tarikh-ibn-khaldun-ibar}"
  es: "Abu Abd Allah Muhammad ibn Abi Zakariya, segundo califa del estado Hafsid; aclamado tras la muerte de su padre en el año 647 AH, eligiendo como lema «الحمد لله والشكر لله», durante cuyo reinado La Meca entró en la da'wa Hafsid y su sharif le predicó desde los minbars, adoptando el título de Imam al-Mustansir billah Comandante de los Creyentes, constructor del famoso jardín Abu Fahr en Túnez."
  tr: "Hafsid devletinin ikinci halifesi Ebu Abdullah Muhammed bin Ebi Zekariya, babasının 647 Hicri yılında ölümünden sonra bağlılık yemini etti ve işareti için 'Allah'a hamd olsun, Allah'a şükür' seçti. Devleti sırasında Mekke Hafsid misyonuna girdi ve kürsüden ona fahri vaazlar verdi. İmam el-Mustansir Billah (Müminlerin Komutanı) unvanını aldı ve İbn Haldun'un anlattığı Ebu Fihr Bustanı da dahil olmak üzere Tunus'ta ünlü anıtlar inşa etti. Amcaları el-Lihyani ve Ebu İbrahim'i öldürdü ve başlarını kendisine götürdü."
  id: "Abu Abdullah Muhammad ibn Abi Zakariya, khalifah kedua negara Hafsid, bersumpah setia setelah kematian ayahnya pada tahun 647 H dan memilih sebagai tanda 'Puji Tuhan dan syukur kepada Allah.' Selama masa pemerintahannya, Mekah memasuki misi Hafsid, dan ia menyampaikan khotbah kehormatan dari mimbar kepadanya. Ia bergelar Imam al-Mustansir Billah, Panglima Orang Beriman, dan membangun monumen terkenal di Tunisia, termasuk Bustan Abu Fihr, yang digambarkan oleh Ibn Khaldun. Ia membunuh pamannya al-Lihyani dan Abu Ibrahim, dan membawa kepala mereka kepadanya."
