summary:
  ar: "الحسان بن المفرج بن الجراح الطائي، أمير بني جراح من طيء بفلسطين في أيام القادر بالله؛ حضر عنده أبو القاسم بن المغربي ليحمله على مباينة العزيز صاحب مصر، ومضى المغربي إلى مكة فأطمع أبا الفتوح الحسن بن جعفر أميرها في الملك {cite:muntazam-ibn-al-jawzi j.7 p.166}."
  en: "Al-Hassan b. al-Mufarrij b. al-Jarrah al-Ta'i, amir of the Banu Jarrah of Tayy in Palestine under al-Qadir: Abu'l-Qasim b. al-Mughrabi came to him to draw him away from the Fatimid al-'Aziz, then went on to Mecca to tempt its amir Abu'l-Futuh al-Hasan b. Ja'far with sovereignty {cite:muntazam-ibn-al-jawzi j.7 p.166}."
  es: "Al-Hassan b. al-Mufarrij b. al-Jarrah al-Ta'i, emir de los Banu Jarrah de Tayy en Palestina bajo al-Qadir: Abu'l-Qasim b. al-Mughrabi fue a verlo para apartarlo del fatimí al-'Aziz, luego fue a La Meca para tentar a su emir Abu'l-Futuh al-Hasan b. Ja'far con la soberanía {cite:muntazam-ibn-al-jawzi j.7 p.166}."
  fr: "Al-Hassan b. al-Mufarrij b. al-Jarrah al-Ta'i, émir des Banu Jarrah de Tayy en Palestine sous al-Qadir: Abu'l-Qasim b. al-Mughrabi est venu le voir pour le détourner des Fatimides al-'Aziz, puis s'est rendu à La Mecque pour tenter son émir Abu'l-Futuh al-Hasan b. Ja'far avec la souveraineté {cite:muntazam-ibn-al-jawzi j.7 p.166}."
  ur: "الحسن بی۔ المفرج ب۔ الجراح الطائی، القادر کے تحت فلسطین میں بنو جراح طائی کے امیر: ابو القاسم بن۔ المغربی اسے فاطمی العزیز سے دور کرنے کے لیے اس کے پاس آیا، پھر مکہ کے امیر ابو الفتوح الحسن بن ابی المکرمہ کو پھنسانے کے لیے مکہ چلا گیا۔ جعفر خود مختاری کے ساتھ {حوالہ:منتظم ابن الجوزی ج7 ص166}۔"
  tr: "El-Hasan bin el-Müferrij ibn el-Cerre el-Tay, Filistin'deki Tayy'den Banu Cerre Emiri'nin el-Kadir Billah döneminde görev yapmıştı; Ebu el-Kasım bin el-Mağribi, Mısır hükümdarı el-Aziz'in yabancılaşmasına karşı ona rehberlik etti. El-Mağribi daha sonra Mekke'ye giderek valisi Ebu el-Futuh el-Hasan ibn Ca'fer'i krallığı kendisine güvence altına alması için davet etti {atıf:Muntazam-ibn-al-Jawzi j.7 s.166}."
  id: "Al-Hassan ibn al-Mufarrij ibn al-Jarrah al-, Emir Banu Jarrah dari Tayy di Palestina pada masa al-Qadir Billah; Abu al-Qasim ibn al-Maghribi melawatnya untuk membimbingnya menghadapi keterasingan al-Aziz, penguasa Mesir. Al-Maghribi kemudian pergi ke Mekah dan menggoda Abu al-Futuh al-Hasan ibn Ja'far, gubernurnya, untuk memastikan kerajaan itu {cite:muntazam-ibn-al-jawzi j.7 hlm.166}."
