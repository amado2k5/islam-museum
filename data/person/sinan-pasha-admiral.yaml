summary:
  ar: "بطاقة أولية لسنان الدين يوسف باشا، الأميرال العثماني أخو خير الدين بربروسا الذي شارك في فتح طرابلس وبنى القوة البحرية في أوائل القرن السادس عشر، توفي سنة ١٥٥٣م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Sinan al-Din Yusuf Pasha, the Ottoman kapudan pasha and brother of Khayr al-Din Barbarossa who took part in the conquest of Tripoli, d. 1553; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Sinan al-Din Yusuf Pasha, el kapudan pasha otomano y hermano de Khayr al-Din Barbarroja, quien participó en la conquista de Trípoli, fallecido en 1553; la entrada de la fuente aún no ha sido verificada en la página."
  fr: "Fiche de conscription de Sinan al-Din Yusuf Pacha, le kapudan pacha ottoman et frère de Khayr al-Din Barberousse qui participa à la conquête de Tripoli, mort en 1553; la source n'est pas encore vérifiée sur la page."
  ur: "سنان الدین یوسف پاشا، عثمانی کپوڈن پاشا اور خیرالدین باربروسا کے بھائی کے لیے ڈرافٹ کارڈ جنہوں نے طرابلس کی فتح میں حصہ لیا، ڈی۔ 1553; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Trablus'un fethine katılan ve on altıncı yüzyılın başlarında deniz kuvvetini kuran Osmanlı amirali ve Khaireddin Barbarossa'nın kardeşi Sanan al-Din Yusuf Paşa'nın ön kartı 1553 yılında ölmüştür; Osmanlı tarih kitaplarında kendisi anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Sanan al-Din Yusuf Pasha, laksamana Ottoman dan saudara Khair al-Din Barbarossa, yang ikut serta dalam penaklukan Tripoli dan membangun angkatan laut pada awal abad keenam belas, meninggal pada tahun 1553 M; Buku sejarah Ottoman menyebutkannya dan biografinya belum diulas di halaman."
