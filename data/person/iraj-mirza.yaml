summary:
  ar: "أمير قاجاري وشاعر فارسي (1874–1926) لُقّب بجلال‌الممالک؛ من روّاد الشعر بالعامية الفارسية، اشتهر بهجائه الاجتماعي اللاذع وبمنظومتَي «عارف‌نامه» و«زهره و منوچهر» وبقصيدته «قلب مادر»."
  en: "Qajar prince and Persian poet (1874-1926), titled Jalal-ol-Mamalek; a pioneer of colloquial Persian verse famed for his biting social satire, the Arefnameh and Zohreh-o Manuchehr verse tales, and the poem 'Mother's Heart'."
