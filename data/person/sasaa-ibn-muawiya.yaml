summary:
  ar: "صعصعة بن معاوية التميمي، عمّ الأحنف بن قيس، من بني مقاعس من تميم؛ وفد على النبي فأسلم، ويروي الحاكم عنه أنه سمعه يقرأ آيتي الزلزلة في مثقال الذرة من الخير والشر فقال: لا أبالي ألا أسمع غيرها، حسبي حسبي {cite:mustadrak-ilmiyya-ata-v3 p. 711}."
  en: "Sa'sa'a ibn Mu'awiya al-Tamimi, paternal uncle of al-Ahnaf ibn Qays, of Banu Muqa'is of Tamim. He came to the Prophet in a delegation and accepted Islam; al-Hakim reports that he heard the Prophet recite the two verses of Surat al-Zalzala on an atom's weight of good and evil and said: 'I do not mind if I never hear anything else; it is enough for me, enough' {cite:mustadrak-ilmiyya-ata-v3 p. 711}."
  ur: "صعصعہ بن معاویہ تمیمی، احنف بن قیس کے چچا، بنو تمیم کی شاخ بنو مقاعس سے۔ وہ وفد میں نبی کے پاس آئے اور اسلام قبول کیا؛ حاکم روایت کرتے ہیں کہ انہوں نے نبی کو سورۂ زلزال کی وہ دو آیتیں پڑھتے سنا جن میں ذرہ برابر نیکی اور بدی کا ذکر ہے، تو کہا: 'مجھے پروا نہیں کہ اس کے سوا کچھ نہ سنوں؛ میرے لیے یہی کافی ہے، کافی' {cite:mustadrak-ilmiyya-ata-v3 p. 711}۔"
