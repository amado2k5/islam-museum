summary:
  ar: "صعصعة بن معاوية التميمي، عمّ الأحنف بن قيس، من بني مقاعس من تميم؛ وفد على النبي فأسلم، ويروي الحاكم عنه أنه سمعه يقرأ آيتي الزلزلة في مثقال الذرة من الخير والشر فقال: لا أبالي ألا أسمع غيرها، حسبي حسبي {cite:mustadrak-ilmiyya-ata-v3 p. 711}."
  en: "Sa'sa'a ibn Mu'awiya al-Tamimi, paternal uncle of al-Ahnaf ibn Qays, of Banu Muqa'is of Tamim. He came to the Prophet in a delegation and accepted Islam; al-Hakim reports that he heard the Prophet recite the two verses of Surat al-Zalzala on an atom's weight of good and evil and said: 'I do not mind if I never hear anything else; it is enough for me, enough' {cite:mustadrak-ilmiyya-ata-v3 p. 711}."
  ur: "صعصعہ بن معاویہ تمیمی، احنف بن قیس کے چچا، بنو تمیم کی شاخ بنو مقاعس سے۔ وہ وفد میں نبی کے پاس آئے اور اسلام قبول کیا؛ حاکم روایت کرتے ہیں کہ انہوں نے نبی کو سورۂ زلزال کی وہ دو آیتیں پڑھتے سنا جن میں ذرہ برابر نیکی اور بدی کا ذکر ہے، تو کہا: 'مجھے پروا نہیں کہ اس کے سوا کچھ نہ سنوں؛ میرے لیے یہی کافی ہے، کافی' {cite:mustadrak-ilmiyya-ata-v3 p. 711}۔"
  es: "Sa'sa'a ibn Mu'awiya al-Tamimi, tío paterno de al-Ahnaf ibn Qays, de Banu Muqa'is de Tamim. Llegó al Profeta en una delegación y aceptó el Islam; al-Hakim relata que escuchó al Profeta recitar los dos versículos de la Sura al-Zalzala sobre el peso atómico del bien y del mal y dijo: 'No me importa no escuchar nada más; es suficiente para mí, suficiente' {cite:mustadrak-ilmiyya-ata-v3 p. 711}."
  fr: "Sa'sa'a ibn Mu'awiya al-Tamimi, oncle paternel d'al-Ahnaf ibn Qays, de la tribu des Banu Muqa'is de Tamim, vint trouver le Prophète au sein d'une délégation et se convertit à l'islam. Al-Hakim rapporte qu'il entendit le Prophète réciter les deux versets de la sourate al-Zalzala sur le poids d'un atome du bien et du mal, et déclara: « Peu m'importe de ne plus jamais rien entendre; cela me suffit amplement. » (Mustadrak-ilmiyya-ata-v3 p. 711)."
  tr: "Ehnaf bin Kays'ın amcası Sa'sa'ah ibn Muaviye al-Tamimi, Tamim'in Banu Maka'is'inden Peygamber'e geldi ve İslam'ı benimsedi. El-Hakim, ondan Zazala'nın iki ayetini iyilik ve kötülük ağırlığında okurken duyduğunu anlatır ve şöyle der: Başka bir şey duysam da umurumda değil; benim yeterliliğim {cite:mustadrak-ilmiyya-ata-v3, s. 711}."
  id: "Sa'sa'ah ibn Mu'awiyah al-Tamimi, paman al-Ahnaf ibn Qays, dari Banu Maqa'i Tamim; ia datang kepada Nabi dan memeluk Islam. Al-Hakim menceritakan darinya bahwa ia mendengar Nabi mengucapkan dua ayat al-Zazala dengan berat gandum baik dan jahat, dan ia berkata: Saya tidak peduli jika saya mendengar apa pun lagi; cukup saya {cite:mustadrak-ilmiyya-ata-v3, hlm. 711}."
