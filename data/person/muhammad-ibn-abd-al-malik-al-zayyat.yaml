id: person/muhammad-ibn-abd-al-malik-al-zayyat
class: person
label: { ar: "محمد بن عبد الملك الزيات" }
summary:
  ar: "وزير المعتصم، رثاه عند موته جامعاً بين العزاء والهناء بقوله قد قلت إذ غيبوك واصطفقت عليك أيد بالترب والطيز اذهب فنعم الحفيظ كنت على الدنيا ونعم الظهير للدين ما يجبر الله أمة فقدت مثلك إلا بمثل هارون {cite:tarikh-khulafa-minhaj-1434 p. 526-527}.، وقيل كان زنديقا عند ابن النديم فيمن كان يرمى بالزندقة من الملوك والرؤساء {cite:fihrist-ibn-al-nadim p. 473}، ومن ولده أحمد بن محمد بن عبد الملك الزيات الذي من ولده أبو طالب أحمد بن الحسين بن علي صاحب ابن وحشية وراوي كتبه عنه {cite:fihrist-ibn-al-nadim p. 433}"
  en: "Al-Mu'tasim's vizier; he elegized him joining condolence and congratulation — 'go, for a fine keeper you were over the world and a fine backer of the faith; God mends a nation that loses your like only with a Harun' {cite:tarikh-khulafa-minhaj-1434 p. 526-527}."
