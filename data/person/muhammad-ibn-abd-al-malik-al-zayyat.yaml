id: person/muhammad-ibn-abd-al-malik-al-zayyat
class: person
label:
  ar: محمد بن عبد الملك الزيات
summary:
  ar: وزير المعتصم، رثاه عند موته جامعاً بين العزاء والهناء بقوله قد قلت إذ غيبوك واصطفقت عليك أيد بالترب والطيز اذهب فنعم الحفيظ كنت على الدنيا ونعم الظهير للدين ما يجبر الله أمة فقدت مثلك إلا بمثل هارون {cite:tarikh-khulafa-minhaj-1434 p. 526-527}. وقيل كان زنديقا عند ابن النديم فيمن كان يرمى بالزندقة من الملوك والرؤساء {cite:fihrist-ibn-al-nadim p. 473}، ومن ولده أحمد بن محمد بن عبد الملك الزيات الذي من ولده أبو طالب أحمد بن الحسين بن علي صاحب ابن وحشية وراوي كتبه عنه {cite:fihrist-ibn-al-nadim p. 433}
  en: Al-Mu'tasim's vizier; he elegized him joining condolence and congratulation — 'go, for a fine keeper you were over the world and a fine backer of the faith; God mends a nation that loses your like only with a Harun' {cite:tarikh-khulafa-minhaj-1434 p. 526-527}.
  es: "El visir de Al-Mu'tasim le dedicó una elegía, combinando condolencias y felicitaciones: «Vete, pues fuiste un gran guardián del mundo y un gran defensor de la fe; Dios sana a una nación que pierde a alguien como tú solo con un Harun» {cita: tarikh-khulafa-minhaj-1434 págs. 526-527}."
  fr: "Le vizir d'Al-Mu'tasim; il l'a encensé en joignant condoléances et félicitations — 'va, car tu étais un excellent gardien du monde et un excellent défenseur de la foi; Dieu ne répare une nation qui perd un homme comme toi qu'avec un Harun' {cite:tarikh-khulafa-minhaj-1434 p. 526-527}."
  ur: "المعتصم کا وزیر؛ اس نے تعزیت اور مبارکباد میں شامل ہوتے ہوئے اسے التجا کیا - 'جاؤ، ایک بہترین رکھوالے کے لیے تم پوری دنیا میں تھے اور ایمان کے بہترین حمایتی تھے۔ خدا ایسی قوم کی اصلاح کرتا ہے جو آپ کی طرح ہارون سے محروم ہو جاتی ہے۔ 526-527}۔"
  tr: "Vezir el-Mu'tasim, onun ölümünde yas tutarak, başsağlığını ve sevincini birleştirerek şöyle dedi: Dedim ki, seni götürdüklerinde ve eller toprak ve eşekle yapıştığında, git. Gerçekten de, mükemmel koruyucu dünyanın koruyucusu ve dinin mükemmel destekçisiydi. Allah, benzerliğini kaybeden bir ulusu ancak Harun'un örneğiyle zorlamaz. {cite:Tarikh-khulafa-minhaj-1434 s. 526-527}. İbn el-Nadim'e göre, kralları ve liderleri suçlayanlar arasında sapkın olduğu söylenir {atıf:fihrist-ibn-al-nadim s. 473} ve soyundan gelen Ahmed ibn Muhammed ibn Abd al-Malik al-Zayyat'tan da geçer; Ebu Talib Ahmed ibn al-Husayn ibn Ali, İbn Vahşiyyah'ın yazarı ve ondan anlatıcı {atı:fihrist-ibn-al-nadim s. 433}"
  id: "Wazir al-Mu'tasim, meratapi kematiannya, menggabungkan belasungkawa dan sukacita, berkata: Aku berkata, ketika mereka membawa kamu pergi dan tangan mencengkeram kamu dengan debu dan keledai, pergilah. Memang, pelindung yang mulia adalah pelindung dunia dan pendukung agama yang sangat baik. Tuhan tidak akan memaksa sebuah bangsa yang kehilangan rupanya kecuali dengan teladan Harun. {cite:Tarikh-khulafa-minhaj-1434 hlm. 526-527}. Dikatakan bahwa dia adalah seorang bidat menurut Ibn al-Nadim di antara mereka yang menuduh raja dan pemimpin {cite:fihrist-ibn-al-nadim hlm. 473}, dan dari keturunannya Ahmad ibn Muhammad ibn Abd al-Malik al-Zayyat, dari siapa Abu Talib Ahmad ibn al-Husayn ibn Ali adalah penulis Ibn Wahshiyyah dan narator darinya {cite:fihrist-ibn-al-nadim hlm. 433}"
