summary:
  ar: "ضابط وسياسي موريتاني (وُلد 1956) من أكجوجت، شخصية قيادية في انقلاب 2005 الذي أطاح بالرئيس الطايع وقائد انقلاب 2008، ترأّس المجلس الأعلى للدولة (2008–2009) ثم شغل رئاسة موريتانيا من 5 أغسطس 2009 إلى 1 أغسطس 2019 — منهيا ولايته بأول انتقال سلمي للسلطة في تاريخ البلاد — وترأّس الاتحاد الأفريقي في 2014–2015؛ وبعد مغادرته المنصب اتُّهم بالفساد وأُدين في ديسمبر 2023 وحُكم عليه استئنافا في مايو 2025 بالسجن خمس عشرة سنة."
  en: "Mauritanian military officer and politician (born 1956) from Akjoujt, a leading figure in the 2005 coup that ousted President Taya and the leader of the 2008 coup, who headed the High Council of State (2008–2009) and then served as President of Mauritania from 5 August 2009 to 1 August 2019 — ending in the country's first peaceful transfer of power — and chaired the African Union in 2014–2015; after leaving office he was charged with corruption, convicted in December 2023, and sentenced on appeal in May 2025 to fifteen years in prison."
  ur: "موریتانی فوجی افسر و سیاست دان (پیدائش 1956ء)، اکجوجت سے؛ 2005ء کی بغاوت — جس نے صدر طايع کو ہٹایا — کی ایک اہم شخصیت اور 2008ء کی بغاوت کے قائد؛ اعلیٰ ریاستی کونسل کے سربراہ (2008ء–2009ء) رہے اور پھر 5 اگست 2009ء تا 1 اگست 2019ء موریتانیہ کے صدر رہے — ان کی مدتِ صدارت ملک میں اقتدار کی پہلی پُرامن منتقلی پر ختم ہوئی — اور 2014ء–2015ء میں افریقی یونین کے چیئرپرسن رہے؛ عہدہ چھوڑنے کے بعد ان پر بدعنوانی کا الزام لگا، دسمبر 2023ء میں مجرم قرار پائے اور مئی 2025ء میں اپیل پر سزا بڑھ کر پندرہ سال قید ہو گئی۔"
