summary:
  ar: "الداعية المؤسس لدعوة المرابطين؛ بعثه الفقيه وجاج بن زلو اللمطي بسجلماسة مع وفد لمتونة العائدين من الحج يعلمهم القرآن ويقيم لهم الدين فاستصعبوا علمه وطرحوه فأعرض عنهم وترهب في جزيرة بحر النيل مع يحيى بن عمر اللمتوني ومن اتبعهما حتى كمل معهم ألف فقال لهم إن ألفاً لن تغلب من قلة وقد تعين علينا القيام بالحق والدعاء إليه فخرجوا وقتلوا من استعصى من قبائل لمتونة وكدالة ومسوفة حتى أنابوا إلى الحق {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  en: "Abdallah ibn Yasin al-Jazuli, founder of the Almoravid call; sent by the jurist Wajjaj b. Zallu with the returning Lamtuna pilgrims to teach them the Quran, rejected for his rigour, he withdrew with Yahya b. Umar to an island ribat until a thousand gathered, then declared that a thousand would not be beaten by fewness and rose {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  fr: "Abdallah ibn Yasin al-Jazuli, fondateur de la da'wa almoravide ; envoyé par le juriste Wajjaj b. Zallu avec les pèlerins lamtuna de retour pour leur enseigner le Coran, rejeté pour sa rigueur, il se retira avec Yahya b. Umar dans un ribat insulaire jusqu'à ce que mille hommes se rassemblent, puis déclara que mille ne seraient pas vaincus par le petit nombre et se souleva {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  es: "Abdallah ibn Yasin al-Jazuli, fundador de la llamada almorávide; enviado por el jurista Wajjaj b. Zallu con los peregrinos que regresaban de Lamtuna para enseñarles el Corán, rechazado por su rigor, se retiró con Yahya b. Umar a un ribat en una isla hasta que se reunieron mil, entonces declaró que mil no serían vencidos por la escasez y se levantó {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  ur: "عبداللہ بن یاسین الجزولی، الموراوید کال کے بانی؛ فقیہ وجاج ب کی طرف سے بھیجا گیا زلو واپس آنے والے لامتنا حجاج کے ساتھ انہیں قرآن پڑھانے کے لیے، اس کی سختی کی وجہ سے رد کر دیا گیا، وہ یحییٰ بن کے ساتھ پیچھے ہٹ گیا۔ عمر ایک جزیرہ رباط کی طرف گئے یہاں تک کہ ایک ہزار جمع ہو گئے، پھر اعلان کیا کہ ایک ہزار کو تھوڑے سے نہیں مارا جائے گا اور اٹھ کھڑے ہوئے۔ 1645}۔"
