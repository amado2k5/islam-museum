summary:
  ar: "الداعية المؤسس لدعوة المرابطين؛ بعثه الفقيه وجاج بن زلو اللمطي بسجلماسة مع وفد لمتونة العائدين من الحج يعلمهم القرآن ويقيم لهم الدين فاستصعبوا علمه وطرحوه فأعرض عنهم وترهب في جزيرة بحر النيل مع يحيى بن عمر اللمتوني ومن اتبعهما حتى كمل معهم ألف فقال لهم إن ألفاً لن تغلب من قلة وقد تعين علينا القيام بالحق والدعاء إليه فخرجوا وقتلوا من استعصى من قبائل لمتونة وكدالة ومسوفة حتى أنابوا إلى الحق {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  en: "Abdallah ibn Yasin al-Jazuli, founder of the Almoravid call; sent by the jurist Wajjaj b. Zallu with the returning Lamtuna pilgrims to teach them the Quran, rejected for his rigour, he withdrew with Yahya b. Umar to an island ribat until a thousand gathered, then declared that a thousand would not be beaten by fewness and rose {cite:tarikh-ibn-khaldun-ibar p. 1645}."
