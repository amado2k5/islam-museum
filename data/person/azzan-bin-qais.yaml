summary:
  ar: "عزان بن قيس البوسعيدي (لا سنة ولادة له في أي مصدر – قُتل في مطرح في يناير 1871)، إمام عُمان من 1868 إلى 1871: خلع ابن عمه سالم بن ثويني وانتخبه أهل الحل والعقد، ثم هزمه تركي بن سعيد في ضنك سنة 1869 وقُتل في مطرح فمهد قتله لسلطنة تركي."
  en: "Azzan bin Qais Al Busaidi (no birth year in any source – killed at Muttrah in January 1871), Imam of Oman from 1868 to 1871: he deposed his cousin Salim bin Thuwaini and was elected by the ahl al-hall wa'l-'aqd, was defeated by Turki bin Said at Dhank in 1869, and was killed at Muttrah, clearing the way for Turki's sultanate."
  ur: "عزان بن قیس البوسعیدی (کسی ماخذ میں پیدائش کا سال مذکور نہیں – قتل جنوری 1871ء کو مطرح میں)، 1868ء سے 1871ء تک عمان کے امام: انہوں نے چچا زاد سالم بن ثوینی کو معزول کیا اور اہلِ حل و عقد نے انہیں منتخب کیا، 1869ء میں ضنک میں ترکی بن سعید سے شکست کھائی اور مطرح میں قتل ہوئے جس سے ترکی کی سلطنت کی راہ ہموار ہوئی۔"
