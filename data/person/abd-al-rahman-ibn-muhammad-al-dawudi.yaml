summary:
  ar: عبد الرحمن بن محمد بن المظفر بن محمد بن داود، أبو الحسن الداودي البوسنجي، فقيه ومحدث. تفقه على أبي بكر القفال وأبي الطيب الصعلوكي وأبي حامد الإسفراييني وأبي الحسن الطليسي، وسمع من عبد الله بن أحمد بن حموية السرخسي وأبي محمد بن أبي سريج وأبي طاهر الزيادي وغيرهم. وروى عنه أبو الوقت ومسافر بن محمد وعائشة بنت عبد الله البوسنجية وأبو المحاسن أسعد بن زياد الماليني وغيرهم. وقال عبد الله بن يوسف الجرجاني إنه استقر ببوسنج للتصنيف والتدريس والفتوى والتذكير حتى توفي، وكان له حظ من النظم والنثر. وعنوان المصدر يذكر وفاته سنة 467 هـ وميلاده سنة 374 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5498}
  en: Abd al-Rahman ibn Muhammad ibn al-Muzaffar ibn Muhammad ibn Dawud, Abu al-Hasan al-Dawudi al-Busanji, a jurist and traditionist. He studied law with Abu Bakr al-Qaffal, Abu al-Tayyib al-Su'luki, Abu Hamid al-Isfara'ini and Abu al-Hasan al-Tulaysi, and heard hadith from Abd Allah ibn Ahmad ibn Hamawayh al-Sarakhsi, Abu Muhammad ibn Abi Sarij and Abu Tahir al-Ziyadi and others. Abu al-Waqt, Musafir ibn Muhammad, Aisha bint Abd Allah al-Busanjiyya and Abu al-Mahasin Asad ibn Ziyad al-Malini related from him. Abd Allah ibn Yusuf al-Jurjani said he settled in Busanj to write, teach, issue fatwas and preach until his death, and he had a share of verse and prose. The heading gives death 467 AH and birth 374 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5498}
  fr: "Abd al-Rahman ibn Muhammad ibn al-Muzaffar ibn Muhammad ibn Dawud, Abu al-Hasan al-Dawudi al-Busanji, juriste et traditionniste. Il étudia le droit auprès d'Abu Bakr al-Qaffal, d'Abu al-Tayyib al-Su'luki, d'Abu Hamid al-Isfara'ini et d'Abu al-Hasan al-Tulaysi, et entendit le hadith d'Abd Allah ibn Ahmad ibn Hamawayh al-Sarakhsi, d'Abu Muhammad ibn Abi Sarij, d'Abu Tahir al-Ziyadi et d'autres. Abu al-Waqt, Musafir ibn Muhammad, Aisha bint Abd Allah al-Busanjiyya et Abu al-Mahasin Asad ibn Ziyad al-Malini transmirent de lui. Abd Allah ibn Yusuf al-Jurjani dit qu'il s'établit à Busanj pour écrire, enseigner, donner des fatwas et prêcher jusqu'à sa mort, et qu'il avait sa part de vers et de prose. L'en-tête donne sa mort en 467 H et sa naissance en 374 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5498}"
  ur: عبد الرحمن بن محمد بن المظفر بن محمد بن داود، ابو الحسن داودی بوسنجی، فقیہ اور محدث۔ انہوں نے ابو بکر القفال، ابو الطیب الصعلوکی، ابو حامد الاسفرائینی اور ابو الحسن الطلیسی سے فقہ پڑھی، اور عبد اللہ بن احمد بن حموية السرخسی، ابو محمد بن ابی سریج اور ابو طاہر الزیادی وغیرہ سے حدیث سنی۔ ان سے ابو الوقت، مسافر بن محمد، عائشہ بنت عبد اللہ البوسنجیہ اور ابو المحاسن اسعد بن زیاد الماليني وغیرہ نے روایت کیا۔ عبد اللہ بن یوسف الجرجانی کے مطابق وہ بوسنج میں تصنیف، تدریس، فتویٰ اور وعظ کے لیے ٹھہرے رہے یہاں تک کہ وفات پائی، اور انہیں نظم و نثر کا ذوق تھا۔ عنوان کے مطابق وفات 467 ہجری اور ولادت 374 ہجری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5498}
  es: "Abd al-Rahman ibn Muhammad ibn al-Muzaffar ibn Muhammad ibn Dawud, Abu al-Hasan al-Dawudi al-Busanji, fue un jurista y tradicionalista. Estudió derecho con Abu Bakr al-Qaffal, Abu al-Tayyib al-Su'luki, Abu Hamid al-Isfara'ini y Abu al-Hasan al-Tulaysi, y escuchó hadices de Abd Allah ibn Ahmad ibn Hamawayh al-Sarakhsi, Abu Muhammad ibn Abi Sarij, Abu Tahir al-Ziyadi y otros. Abu al-Waqt, Musafir ibn Muhammad, Aisha bint Abd Allah al-Busanjiyya y Abu al-Mahasin Asad ibn Ziyad al-Malini estaban relacionados con él. Abd Allah ibn Yusuf al-Jurjani afirmó que se estableció en Busanj para escribir, enseñar, emitir fatuas y predicar hasta su muerte, y que poseía una parte del Corán y la prosa. El encabezado indica que falleció en el año 467 de la Hégira y nació en el año 374 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5498}"
  tr: "Abdurrahman ibn Muhammed ibn el-Muzaffar ibn Muhammed ibn Davud, Ebu el-Hasan el-Davud el-Busanci, hukukçu ve hadis alimiydi. Ebu Bekir el-Kaffal, Ebu el-Tayyib el-Sa'luki, Ebu Hamid el-İsfarayini ve Ebu el-Hasan el-Talisi'den içtihat okudu. Abdullah ibn Ahmad ibn Hamawayh al-Sarakhsi, Abu Muhammad ibn Abi Surayj, Abu Tahir al-Ziyadi ve diğerlerinden hadis duydu. Ondan hadis rivayet edenler arasında Ebu'l-Vakt, Musafir ibn Muhammed, Aişe bint Abdullah el-Busanci, Ebu'l-Mahasin Es'ad ibn Ziyad el-Malini ve diğerleri vardı. Abdullah ibn Yusuf el-Jurjani, ölümüne kadar yazmak, ders vermek, hukuki görüş bildirmek ve hatırlatmalarda bulunmak üzere Busanj'a yerleştiğini söyledi. Hem şiire hem de düzyazıya yeteneği vardı. Kaynak, onun 467 Hicri yılında öldüğünü ve 374 Hicri yılında doğduğunu belirtmektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5498}"
  id: "Abd al-Rahman ibn Muhammad ibn al-Muzaffar ibn Muhammad ibn Dawud, Abu al-Hasan al-Dawudi al-Busanji, adalah seorang ahli hukum dan sarjana hadis. Ia belajar yurisprudensi di bawah bimbingan Abu Bakr al-Qaffal, Abu al-Tayyib al-Sa'luki, Abu Hamid al-Isfarayini, dan Abu al-Hasan al-Talisi. Beliau mendengar hadis dari Abdullah bin Ahmad bin Hamawayh al-Sarakhsi, Abu Muhammad bin Abi Surayj, Abu Tahir al-Ziyadi, dan lain-lain. Diantara yang meriwayatkan hadits darinya adalah Abu al-Waqt, Musafir ibn Muhammad, Aisha binti Abdullah al-Busanji, Abu al-Mahasin As'ad ibn Ziyad al-Malini, dan lain-lain. Abdullah ibn Yusuf al-Jurjani mengatakan bahwa ia menetap di Busanj untuk menulis, mengajar, mengeluarkan pendapat hukum, dan memberikan pengingat hingga kematiannya. Ia juga memiliki bakat dalam bidang puisi dan prosa. Sumber tersebut menyebutkan kematiannya pada tahun 467 H dan kelahirannya pada tahun 374 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5498}"
