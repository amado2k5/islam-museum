summary:
  ar: عبد الرحمن بن محمد بن المظفر بن محمد بن داود، أبو الحسن الداودي البوسنجي، فقيه ومحدث. تفقه على أبي بكر القفال وأبي الطيب الصعلوكي وأبي حامد الإسفراييني وأبي الحسن الطليسي، وسمع من عبد الله بن أحمد بن حموية السرخسي وأبي محمد بن أبي سريج وأبي طاهر الزيادي وغيرهم. وروى عنه أبو الوقت ومسافر بن محمد وعائشة بنت عبد الله البوسنجية وأبو المحاسن أسعد بن زياد الماليني وغيرهم. وقال عبد الله بن يوسف الجرجاني إنه استقر ببوسنج للتصنيف والتدريس والفتوى والتذكير حتى توفي، وكان له حظ من النظم والنثر. وعنوان المصدر يذكر وفاته سنة 467 هـ وميلاده سنة 374 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5498}
  en: Abd al-Rahman ibn Muhammad ibn al-Muzaffar ibn Muhammad ibn Dawud, Abu al-Hasan al-Dawudi al-Busanji, a jurist and traditionist. He studied law with Abu Bakr al-Qaffal, Abu al-Tayyib al-Su'luki, Abu Hamid al-Isfara'ini and Abu al-Hasan al-Tulaysi, and heard hadith from Abd Allah ibn Ahmad ibn Hamawayh al-Sarakhsi, Abu Muhammad ibn Abi Sarij and Abu Tahir al-Ziyadi and others. Abu al-Waqt, Musafir ibn Muhammad, Aisha bint Abd Allah al-Busanjiyya and Abu al-Mahasin Asad ibn Ziyad al-Malini related from him. Abd Allah ibn Yusuf al-Jurjani said he settled in Busanj to write, teach, issue fatwas and preach until his death, and he had a share of verse and prose. The heading gives death 467 AH and birth 374 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5498}
  ur: عبد الرحمن بن محمد بن المظفر بن محمد بن داود، ابو الحسن داودی بوسنجی، فقیہ اور محدث۔ انہوں نے ابو بکر القفال، ابو الطیب الصعلوکی، ابو حامد الاسفرائینی اور ابو الحسن الطلیسی سے فقہ پڑھی، اور عبد اللہ بن احمد بن حموية السرخسی، ابو محمد بن ابی سریج اور ابو طاہر الزیادی وغیرہ سے حدیث سنی۔ ان سے ابو الوقت، مسافر بن محمد، عائشہ بنت عبد اللہ البوسنجیہ اور ابو المحاسن اسعد بن زیاد الماليني وغیرہ نے روایت کیا۔ عبد اللہ بن یوسف الجرجانی کے مطابق وہ بوسنج میں تصنیف، تدریس، فتویٰ اور وعظ کے لیے ٹھہرے رہے یہاں تک کہ وفات پائی، اور انہیں نظم و نثر کا ذوق تھا۔ عنوان کے مطابق وفات 467 ہجری اور ولادت 374 ہجری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5498}
