summary:
  ar: "ناظم الزهاوي (وُلد في 2 حزيران 1967 في بغداد)، رجل أعمال وسياسي بريطاني، وُلد لعائلة الزهاوي الكردية البغدادية وفرّ من العراق إلى المملكة المتحدة طفلًا أثناء صعود صدام حسين إلى السلطة. شارك في تأسيس شركة الاستطلاعات يوغوف سنة 2000 وكان رئيسها التنفيذي 2005–2010، ثم كان عضو البرلمان عن ستراتفورد أون آفون 2010–2024، فوزيرًا للتعليم (2021–2022) ووزيرًا للمالية (تموز–أيلول 2022) ورئيسًا لحزب المحافظين (2022–2023)."
  en: "Nadhim Zahawi (born 2 June 1967 in Baghdad) is a British businessman and politician, born to the Kurdish Baghdadi al-Zahawi family, who fled Iraq for the United Kingdom as a child during Saddam Hussein's rise to power. He co-founded the polling company YouGov in 2000 and was its chief executive from 2005 to 2010, then MP for Stratford-on-Avon from 2010 to 2024, serving as Secretary of State for Education (2021-2022), Chancellor of the Exchequer (July to September 2022) and Chairman of the Conservative Party (2022-2023)."
  ur: "ندیم زہاوی (پیدائش 2 جون 1967، بغداد) برطانوی کاروباری شخصیت اور سیاست دان ہیں، جو بغداد کے کرد زہاوی خاندان میں پیدا ہوئے اور صدام حسین کے عروج کے دوران بچپن میں عراق سے برطانیہ فرار ہوئے۔ انھوں نے 2000 میں رائے شماری کی کمپنی یوگوو کی مشترکہ بنیاد رکھی اور 2005 سے 2010 تک اس کے چیف ایگزیکٹو رہے، پھر 2010 سے 2024 تک اسٹریٹفورڈ-آن-ایون کے رکن پارلیمنٹ رہے، بطور وزیرِ تعلیم (2021–2022)، وزیرِ خزانہ (جولائی تا ستمبر 2022) اور کنزرویٹو پارٹی کے چیئرمین (2022–2023) خدمات انجام دیں۔"

