summary:
  ar: "السلطان محمود الأول (١١٤٣–١١٦٨هـ/١٧٣٠–١٧٥٤م)؛ استقدم في عهده أول مستشار أوروبي فرنسي للشئون العسكرية وهو الكسندر الكونت (بونفال). وحين أعلنت روسيا والنمسا الحرب على بولندا واحتلتها روسيا وقاتلتا الدولة العثمانية، تمكن العثمانيون من وقف تقدم الروس في البغدان ووقف تقدم النمسا في البوسنة والصرب والأفلاق وانتصروا على الصرب وجيوش النمسا التي انسحبت، فطلبت النمسا الصلح عن طريق فرنسا ووقعت معاهدة بلغراد عام ١١٥٢هـ/١٧٣٩م وتنازلت فيها عن مدينة بلغراد وبلاد الصرب والأفلاق، وتعهدت روسيا بعدم بناء سفن في البحر الأسود وهدم قلاع ميناء آزوف {cite:dawlat-uthmaniyya-salabi p. 313}."
  en: "Mahmud I (r. 1143–1168/1730–1754) — brought in the first European military adviser (the Comte de Bonneval), yet won the war that produced the Treaty of Belgrade 1739: Austria ceded Belgrade, Serbia and Wallachia back, and Russia pledged no Black Sea fleet {cite:dawlat-uthmaniyya-salabi p. 313}."
