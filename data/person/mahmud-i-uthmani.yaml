summary:
  ar: "السلطان محمود الأول ⁦(١١٤٣–١١٦٨هـ/١٧٣٠–١٧٥٤م)⁩؛ استقدم في عهده أول مستشار أوروبي فرنسي للشئون العسكرية وهو الكسندر الكونت ⁦(بونفال)⁩. وحين أعلنت روسيا والنمسا الحرب على بولندا واحتلتها روسيا وقاتلتا الدولة العثمانية، تمكن العثمانيون من وقف تقدم الروس في البغدان ووقف تقدم النمسا في البوسنة والصرب والأفلاق وانتصروا على الصرب وجيوش النمسا التي انسحبت، فطلبت النمسا الصلح عن طريق فرنسا ووقعت معاهدة بلغراد عام ١١٥٢هـ/١٧٣٩م وتنازلت فيها عن مدينة بلغراد وبلاد الصرب والأفلاق، وتعهدت روسيا بعدم بناء سفن في البحر الأسود وهدم قلاع ميناء آزوف {cite:dawlat-uthmaniyya-salabi p. 313}."
  en: "Mahmud I (r. 1143–1168/1730–1754) — brought in the first European military adviser (the Comte de Bonneval), yet won the war that produced the Treaty of Belgrade 1739: Austria ceded Belgrade, Serbia and Wallachia back, and Russia pledged no Black Sea fleet {cite:dawlat-uthmaniyya-salabi p. 313}."
  es: "Mahmud I (r. 1143–1168/1730–1754) — trajo al primer asesor militar europeo (el conde de Bonneval), pero ganó la guerra que produjo el Tratado de Belgrado de 1739: Austria cedió Belgrado, Serbia y Valaquia, y Rusia no prometió ninguna flota del Mar Negro {cite:dawlat-uthmaniyya-salabi p. 313}."
  fr: "Mahmud Ier (r. 1143–1168/1730–1754) — a fait venir le premier conseiller militaire européen (le comte de Bonneval), mais a gagné la guerre qui a produit le traité de Belgrade de 1739: l'Autriche a cédé Belgrade, la Serbie et la Valachie, et la Russie a promis de ne pas avoir de flotte en mer Noire {cite:dawlat-uthmaniyya-salabi p. 313}."
  ur: "محمود اول (r. 1143–1168/1730–1754) – پہلے یورپی فوجی مشیر ⁦(کومٹے ڈی بونیوال)⁩ کو لایا گیا، پھر بھی وہ جنگ جیت گئی جس نے معاہدہ بلغراد 1739 کو جنم دیا: آسٹریا نے بلغراد، سربیا اور والاچیا کو واپس کر دیا، اور روس نے کوئی وعدہ نہیں کیا۔ 313}۔"
  tr: "Sultan I. Mahmud (1143–1168 Hicri / 1730–1754), saltanatı sırasında ilk Avrupa-Fransız askeri danışmanı olan Kont Alexander (Bonval) olarak atadı. Rusya ve Avusturya Polonya'ya savaş ilan ettiğinde, Rusya şehri işgal etti ve Osmanlı İmparatorluğu ile savaştı; Osmanlılar Bağdan'daki Rus ilerleyişini durdurmayı ve Avusturya'nın Bosna, Sırbistan ve Eflak'taki ilerleyişini durdurmayı başardı; geri çekilen Sırp ve Avusturya ordularını yendi. Avusturya, Fransa üzerinden barış talep etti, 1152 Hicri/1739 yılında Belgrad Antlaşması'nı imzalayarak Belgrad şehri, Sırbistan ve Alavik topraklarını devretti. Rusya, Karadeniz'de gemi inşa etmeyeceğine ve Azak limanının kalelerini yıkacağına söz verdi {cite:dawlat-uthmaniyya-salabi, s. 313}."
  id: "Sultan Mahmud I (1143–1168 H / 1730–1754 M) menunjuk selama pemerintahannya penasihat militer Eropa-Prancis pertama, Count Alexander (Bonval). Ketika Rusia dan Austria menyatakan perang terhadap Polandia, Rusia mendudukinya, dan melawan Kekaisaran Ottoman, Ottoman berhasil menghentikan kemajuan Rusia di Baghdan dan menghentikan kemajuan Austria di Bosnia, Serbia, dan Wallachia, mengalahkan tentara Serbia dan Austria yang mundur. Austria meminta perdamaian melalui Prancis, menandatangani Perjanjian Beograd pada 1152 H/1739 M, menyerahkan kota Beograd, Serbia, dan wilayah Alavik. Rusia berjanji tidak akan membangun kapal di Laut Hitam dan menghancurkan benteng-benteng pelabuhan Azov {cite:dawlat-uthmaniyya-salabi, hlm. 313}."
