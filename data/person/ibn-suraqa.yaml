  ar: "محمد بن أحمد بن محمد، أبو بكر الأنصاري الشاطبي المصري، محدث فقيه فرضي شاعر، شيخ دار الحديث الكاملية بالقاهرة، توفي سنة 662هـ. من تصانيفه «الحيل الشرعية»، و«إعجاز القرآن»، و«كتاب الأعداد»، و«شرح الكافي في الفرائض». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3479}"
