summary:
  ar: "محمد بن أحمد بن محمد، أبو بكر الأنصاري الشاطبي المصري، محدث فقيه فرضي شاعر، شيخ دار الحديث الكاملية بالقاهرة، توفي سنة 662هـ. من تصانيفه «الحيل الشرعية»، و«إعجاز القرآن»، و«كتاب الأعداد»، و«شرح الكافي في الفرائض». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3479}"
  en: "Muhammad ibn Ahmad ibn Muhammad, Abu Bakr al-Ansari al-Shatibi al-Misri (d. 662 AH), a hadith scholar, jurist, expert in inheritance and poet, and head of the Kamiliyya hadith school in Cairo. Among his works are al-Hiyal al-shar'iyya and a commentary on al-Kafi on inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3479}"
  es: "Muhammad ibn Ahmad ibn Muhammad, Abu Bakr al-Ansari al-Shatibi al-Misri (fallecido en 662 AH), fue un erudito del hadiz, jurista, experto en herencia y poeta, y director de la escuela de hadices Kamiliyya en El Cairo. Entre sus obras destacan al-Hiyal al-shar'iyya y un comentario sobre al-Kafi acerca de la herencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3479}"
  fr: "Muhammad ibn Ahmad ibn Muhammad, dit Abu Bakr al-Ansari al-Shatibi al-Misri (mort en 662 AH), était un érudit du hadith, juriste, spécialiste des successions et poète. Il dirigea l'école de hadith Kamiliyya au Caire. Parmi ses œuvres figurent al-Hiyal al-shar'iyya et un commentaire d'al-Kafi sur l'héritage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3479}"
