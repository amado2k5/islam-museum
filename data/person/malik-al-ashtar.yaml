id: person/malik-al-ashtar
class: person
label: { ar: "مالك الأشتر النخعي", en: "Malik al-Ashtar al-Nakha'i", es: "Malik al-Ashtar al-Nakha'i", fr: "Malik al-Ashtar al-Nakha'i", ur: "مالک الاشتر النخعی" }
summary:
  ar: "مالك بن الحارث الأشتر النخعي، من أصحاب علي وقادته؛ عند البلاذري في اختلاف أول قاطع للدرب: لما وجّه أبو عبيدة ميسرة بن مسروق العبسي فأوقع بالروم ومن معهم من مستعربة غسان وتنوخ وإياد، لحق به مالك الأشتر مدداً من قبل أبي عبيدة وهو بأنطاكية. وعند المسعودي هو مالك بن الحارث النخعي الذي سار من الكوفة في مائتي رجل في جيش الثائرين على عثمان {cite:muruj-al-dhahab p. 637}"
  en: "Malik ibn al-Harith al-Ashtar al-Nakha'i, companion and commander of Ali; in al-Baladhuri's disputed account of the first crossing of the Darb: when Abu Ubayda sent Maysara ibn Masruq al-Absi who fell upon the Byzantines and their musta'riba of Ghassan, Tanukh and Iyad, Malik al-Ashtar came up to him as reinforcement from Abu Ubayda at Antioch."
  es: "Malik ibn al-Harith al-Ashtar al-Nakha'i, compañero y comandante de Ali; en el relato controvertido de al-Baladhuri sobre el primer cruce del Darb: cuando Abu Ubayda envió a Maysara ibn Masruq al-Absi, quien atacó a los bizantinos y su musta'riba de Ghassan, Tanukh e Iyad, Malik al-Ashtar llegó a él como refuerzo de Abu Ubayda en Antioquía."
  fr: "Malik ibn al-Harith al-Ashtar al-Nakha'i, compagnon et commandant d'Ali; dans le récit contesté d'al-Baladhuri de la première traversée du Darb: lorsqu'Abu Ubayda envoya Maysara ibn Masruq al-Absi qui s'attaqua aux Byzantins et à leurs musta'riba de Ghassan, Tanukh et Iyad, Malik al-Ashtar vint à lui en renfort d'Abu Ubayda à Antioche."
  ur: "مالک بن الحارث اشتر النخعی، علی کے ساتھی اور کمانڈر؛ البلادوری کی شرح میں پہلی کراسنگ کے متنازعہ بیان میں: جب ابو عبیدہ نے میسرہ بن مسروق العبسی کو بھیجا جو بازنطینیوں اور غسان، تنخ اور عیاض کے مستعریبا پر برسا تو مالک الاشتر انطاکیہ میں ابو عبیدہ سے کمک کے طور پر اس کے پاس آیا۔"
  tr: "Ali'nin yoldaşlarından ve komutanlarından biri olan Malik ibn al-Haris el-Aştar el-Nakha'i; el-Baladhuri'ye göre ilk kesin anlaşmazlık şuydu: Ebu Ubeyde Maysarah ibn Masruq al-Absi'yi gönderip Romalıları ve Gassan, Nukh ile Iyad'dan gelen Araplaşmış yoldaşlarını yendi, Malik el-Aştar Antakya'dayken Ebu Ubeyde'den takviye olarak ona katıldı. El-Mes'udi'ye göre, kendisi Kufa'dan iki yüz adamla Osman'a karşı isyancı ordusunda yürüyen Malik ibn al-Harit el-Nakha'i'dir {atı:Muruj-al-Dhahab, s. 637}"
  id: "Malik ibn al-Harith al-Ashtar al-Nakha'i, salah satu sahabat dan komandan Ali; menurut al-Baladhuri, perselisihan pertama yang menentukan adalah: Ketika Abu Ubaidah mengirim Maysarah ibn Masruq al-Absi dan mengalahkan Romawi serta rekan-rekan Arabisasi mereka dari Ghassan, Nukh, dan Iyad, Malik al-Ashtar bergabung dengannya sebagai bala bantuan dari Abu Ubaidah saat ia berada di Antiokhia. Menurut al-Mas'udi, ia adalah Malik ibn al-Harith al-Nakha'i, yang berbaris dari Kufa dengan dua ratus orang dalam pasukan pemberontak melawan Uthman {cite:muruj-al-dhahab, hlm. 637}"
