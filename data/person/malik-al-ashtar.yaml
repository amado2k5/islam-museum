label: { ar: "مالك الأشتر النخعي", en: "Malik al-Ashtar al-Nakha'i" }
summary:
  ar: "مالك بن الحارث الأشتر النخعي، من أصحاب علي وقادته؛ عند البلاذري في اختلاف أول قاطع للدرب: لما وجّه أبو عبيدة ميسرة بن مسروق العبسي فأوقع بالروم ومن معهم من مستعربة غسان وتنوخ وإياد، لحق به مالك الأشتر مدداً من قبل أبي عبيدة وهو بأنطاكية. وعند المسعودي هو مالك بن الحارث النخعي الذي سار من الكوفة في مائتي رجل في جيش الثائرين على عثمان {cite:muruj-al-dhahab p. 637}"
  en: "Malik ibn al-Harith al-Ashtar al-Nakha'i, companion and commander of Ali; in al-Baladhuri's disputed account of the first crossing of the Darb: when Abu Ubayda sent Maysara ibn Masruq al-Absi who fell upon the Byzantines and their musta'riba of Ghassan, Tanukh and Iyad, Malik al-Ashtar came up to him as reinforcement from Abu Ubayda at Antioch."
