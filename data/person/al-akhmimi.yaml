id: person/al-akhmimi
class: person
label: { ar: "الأخميمي", en: "Al Akhmimi" }
summary:
  ar: "عثمان بن سويد أبو ثري الأخميمي من أخميم قرية من قرى مصر، وكان مقدما في صناعة الكيمياء ورأسا فيها وله مع ابن وحشية مناظرات وبينه وبينه مكاتبات، وله من الكتب كتاب الكبريت الأحمر وكتاب الإبانة وكتاب التصحيحات وكتاب صرف التوهم عن ذي النون المصري وكتاب التعليقات وكتاب آلات القدماء وكتاب الحل والعقد وكتاب التدبير وكتاب التصعيد والتقطير وكتاب الجحيم الأعظم وكتاب مناظرات العلماء ومفاوضاتهم {cite:fihrist-ibn-al-nadim p. 505}."
  en: "Uthman ibn Suwayd al-Akhmimi — the Egyptian alchemist who corresponded with Ibn Wahshiyya {cite:fihrist-ibn-al-nadim}"
