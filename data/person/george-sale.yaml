summary:
  ar: "المستشرق والمترجم الإنجليزي لمعاني القرآن. يذكر زقزوق أن مقدمة ترجمته الإنجليزية، التي تعود عنده إلى سنة ١٧٣٦م، جزمت بأن النبي هو مؤلف القرآن، وأن لهذه المقدمة أثراً طويلاً في الكتابات الأوروبية، وأن سيل وُصف بأنه نصف مسلم. هذه الأحكام من الكتاب، وتُنسب إليه."
  en: "English orientalist and translator of the Qur'an. Zaqzuq reports that the preface to his English translation, dated 1736 in the book, stated that the Prophet was the author of the Qur'an, that the preface shaped European writing for a long time, and that Sale was called half a Muslim. These are the author's statements, attributed to him."
