  ar: "جورج سيل"
  en: "George Sale"
  es: "George Sale"
  fr: "George Sale"
  ur: "جارج سیل"
roles: [translator, orientalist]
gender: male
summary:
  ar: "المستشرق والمترجم الإنجليزي لمعاني القرآن. يذكر زقزوق أن مقدمة ترجمته الإنجليزية، التي تعود عنده إلى سنة ١٧٣٦م، جزمت بأن النبي هو مؤلف القرآن، وأن لهذه المقدمة أثراً طويلاً في الكتابات الأوروبية، وأن سيل وُصف بأنه نصف مسلم. هذه الأحكام من الكتاب، وتُنسب إليه."
  en: "English orientalist and translator of the Qur'an. Zaqzuq reports that the preface to his English translation, dated 1736 in the book, stated that the Prophet was the author of the Qur'an, that the preface shaped European writing for a long time, and that Sale was called half a Muslim. These are the author's statements, attributed to him."
  es: "Orientalista inglés y traductor del Corán. Zaqzuq relata que el prefacio de su traducción al inglés, fechado en 1736 en el libro, afirmaba que el Profeta era el autor del Corán, que dicho prefacio influyó en la literatura europea durante mucho tiempo y que a Salé se le consideraba medio musulmán. Estas son las declaraciones del autor, atribuidas a él."
  fr: "Zaqzuq, orientaliste anglais et traducteur du Coran, rapporte que la préface de sa traduction anglaise, datée de 1736, affirmait que le Prophète était l'auteur du Coran, que cette préface influença durablement la littérature européenne et que Sale était considéré comme un musulman à moitié. Ces propos lui sont attribués."
  ur: "انگریزی مستشرق اور قرآن کے مترجم۔ زقزوق نے رپورٹ کیا ہے کہ کتاب میں اس کے انگریزی ترجمے کے دیباچے، مورخہ 1736، میں بتایا گیا ہے کہ پیغمبر قرآن کے مصنف تھے، اس دیباچے نے ایک طویل عرصے تک یورپی تحریر کو شکل دی، اور سیل کو آدھا مسلمان کہا گیا۔ یہ مصنف کے بیانات ہیں، جو ان سے منسوب ہیں۔"
  tr: "Kur'an'ın Anlamlarının Oryantalist ve İngilizce çeviri. Zaqzouq, İngilizce çevirisinin girişinde, 1736 yılına tarihlenen ve Peygamber'in Kur'an'ın yazarı olduğunu, bu girişin Avrupa yazılarını uzun süreli etkilediğini ve Ciel'in yarı Müslüman olarak tanımlandığını belirtir. Bu hükümler kitaptan alınmış olup ona atfedilmiştir."
  id: "Orientalis dan Penerjemah Inggris dari Makna Al-Qur'an. Zaqzouq menyebutkan bahwa pengantar terjemahan bahasa Inggrisnya, yang berasal dari tahun 1736 M, menyatakan bahwa Nabi adalah penulis Al-Qur'an, bahwa pengantar ini memiliki pengaruh panjang terhadap tulisan-tulisan Eropa, dan bahwa Ciel digambarkan sebagai setengah Muslim. Putusan-putusan ini berasal dari kitab dan dikaitkan dengannya."
