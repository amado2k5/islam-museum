summary:
  ar: "العلامة الموصلي الشافعي أحد الأعلام؛ تفقه على والده وببغداد على معيد النظامية السديد السلماسي فبرع في الأصول والخلاف، وقرأ النحو على ابن سعدون القرطبي، وأكب على الاشتغال بالعقليات حتى بلغ فيها الغاية وقيل إنه كان يتقن أربعة عشر فناً — وقيل أربعة وعشرين علماً دراية متقنة — وتفرد بإتقان علم الرياضي ولم يكن له نظير، وكان يتهم في دينه لكون العلوم العقلية غالبة عليه؛ ولما وصلت كتب فخر الدين الرازي إلى الموصل لم يفهم أحد اصطلاحه فيها سواه، وأهل الذمة يقرءون عليه التوراة والإنجيل ويعترفون أنهم لا يجدون من يوضحهما مثله؛ رآه ابن خلكان بالموصل في رمضان سنة ست وعشرين وتردد إليه دفعات {cite:shadharat-dhahab p. 206-207}."
  en: "Kamal al-Din Ibn Yunus (b. 551, d. 14 Sha'ban 639, Mosul) — the polymath said to master fourteen sciences, peerless in riyadi, the only man in Mosul who could parse al-Razi's terminology; dhimmis read Torah and Gospel with him, conceding none explained them better; Ibn Khallikan saw him in 626 {cite:shadharat-dhahab p. 206-207}."
  es: "Kamal al-Din Ibn Yunus (n. 551, m. 14 Sha'ban 639, Mosul) — el polímata que se decía dominaba catorce ciencias, sin igual en riyadi, el único hombre en Mosul que podía analizar la terminología de al-Razi; los dhimmis leían la Torá y el Evangelio con él, admitiendo que nadie los explicaba mejor; Ibn Khallikan lo vio en 626 {cita: shadharat-dhahab p. 206-207}."
  fr: "Kamal al-Din Ibn Yunus (né en 551, mort le 14 Sha'ban 639, Mossoul) — le polymathe qui, disait-on, maîtrisait quatorze sciences, était sans égal en riyadi, le seul homme à Mossoul capable de décrypter la terminologie d'al-Razi; les dhimmis lisaient la Torah et l'Évangile avec lui, reconnaissant qu'aucun ne les expliquait mieux; Ibn Khallikan le vit en 626 {cite: shadharat-dhahab p. 206-207}."
  ur: "کمال الدین ابن یونس ⁦(پیدائش 551، وفات 14 شعبان 639، موصل)⁩ - پولی میتھ نے چودہ علوم میں مہارت حاصل کرنے کے لیے کہا، ریاضی میں بے مثال، موصل کا واحد آدمی جو الرازی کی اصطلاحات کو پارس کر سکتا تھا۔ ذمیوں نے اس کے ساتھ تورات اور انجیل پڑھی، یہ مانتے ہوئے کہ ان کی بہتر وضاحت کسی نے نہیں کی۔ ابن خلیقان نے اسے 626 میں دیکھا۔ 206-207}۔"
  tr: "Alim El-Mevsili El-Şafii, önde gelen isimlerden biriydi; babasının yanında ve Bağdat'ta Nizamiye El-Sadid El-Selmasi'nin desteğiyle fıkıh eğitimi aldı, prensiplerde ve anlaşmazlıkta üstün başarı gösterdi. İbn Sâdun el-Kurtubi'nin yanında dilbilgisi okudu ve en üst seviyeye ulaşana kadar entelektüellere kendini adadı. On dört bilimde ustalaştığı söylenir—ve yirmi dört bilimi kesin bilgiyle ustalaştığı söylenir—ve matematikte eşsiz ustalıkla benzersiz olduğu söylenir. Dini bilimlerle suçlandı çünkü akılcı bilimler ona baskındı. Fakhr al-Din el-Razi'nin kitapları Musul'a ulaştığında, orada onun terimlerini sadece kendisi anlayamadı. Zimmi halkı ona Tevrat ve İncil'i okudu ve onları kendisi gibi açıklayacak birini bulamadıklarını kabul etti. İbn Hallikan, yirmi altı yılında Ramazan ayında Musul'da onu gördü ve defalarca ziyaret etti {alıntı:] Shadharat-Dhahab s. 206-207}."
  id: "Ulama Al-Mawsili Al-Shafi'i adalah salah satu tokoh terkemuka; ia mempelajari hukum di bawah bimbingan ayahnya dan di Baghdad di bawah penguatan Nizamiyyah Al-Sadid Al-Salmasi, unggul dalam prinsip dan perbedaan pendapat. Ia mempelajari tata bahasa di bawah bimbingan Ibn Sa'dun al-Qurtubi dan mendedikasikan dirinya kepada para intelektual hingga mencapai tingkat tertinggi. Dikatakan ia menguasai empat belas ilmu—dan dikatakan menguasai dua puluh empat ilmu dengan pengetahuan yang tepat—dan ia unik dalam menguasai matematika yang tiada tanding. Ia dituduh mempelajari agama karena ilmu rasional mendominasi dirinya. Ketika buku-buku Fakhr al-Din al-Razi sampai di Mosul, tidak ada yang memahami istilahnya di sana kecuali dirinya. Orang-orang dhimmi membacakan Taurat dan Injil kepadanya dan mengakui mereka tidak menemukan siapa pun yang bisa menjelaskannya seperti dirinya. Ibn Khallikan melihatnya di Mosul pada Ramadan tahun dua puluh enam, dan berulang kali mengunjunginya {cite:Shadharat-Dhahab hlm. 206-207}."
