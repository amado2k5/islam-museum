summary:
  ar: "العلامة الموصلي الشافعي أحد الأعلام؛ تفقه على والده وببغداد على معيد النظامية السديد السلماسي فبرع في الأصول والخلاف، وقرأ النحو على ابن سعدون القرطبي، وأكب على الاشتغال بالعقليات حتى بلغ فيها الغاية وقيل إنه كان يتقن أربعة عشر فناً — وقيل أربعة وعشرين علماً دراية متقنة — وتفرد بإتقان علم الرياضي ولم يكن له نظير، وكان يتهم في دينه لكون العلوم العقلية غالبة عليه؛ ولما وصلت كتب فخر الدين الرازي إلى الموصل لم يفهم أحد اصطلاحه فيها سواه، وأهل الذمة يقرءون عليه التوراة والإنجيل ويعترفون أنهم لا يجدون من يوضحهما مثله؛ رآه ابن خلكان بالموصل في رمضان سنة ست وعشرين وتردد إليه دفعات {cite:shadharat-dhahab p. 206-207}."
  en: "Kamal al-Din Ibn Yunus (b. 551, d. 14 Sha'ban 639, Mosul) — the polymath said to master fourteen sciences, peerless in riyadi, the only man in Mosul who could parse al-Razi's terminology; dhimmis read Torah and Gospel with him, conceding none explained them better; Ibn Khallikan saw him in 626 {cite:shadharat-dhahab p. 206-207}."
