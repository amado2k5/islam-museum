summary:
  ar: "طبيبة وسياسية باكستانية وُلدت في كراتشي سنة 1956، انتُخبت لعضوية الجمعية الوطنية خمس مرات عن بدين في السند، وصارت سنة 2008 أول امرأة ترأس الجمعية الوطنية في تاريخ باكستان فبقيت في المنصب حتى 2013، ثم تركت حزب الشعب سنة 2018 وشغلت وزارة التنسيق بين الأقاليم حتى 2022."
  en: "Pakistani physician and politician born in Karachi in 1956. Elected to the National Assembly five times from Badin in Sindh, she became in 2008 the first woman Speaker of the National Assembly in Pakistan's history, serving until 2013; she left the PPP in 2018 and served as Federal Minister for Inter Provincial Coordination until 2022."
  ur: "پاکستانی ڈاکٹر و سیاست دان، جو 1956 میں کراچی میں پیدا ہوئی۔ سندھ کے بدین سے پانچ بار قومی اسمبلی کی رکن منتخب ہوئی، 2008 میں پاکستان کی تاریخ میں قومی اسمبلی کی پہلی خاتون اسپیکر بنی اور 2013 تک اس منصب پر رہی؛ 2018 میں پیپلز پارٹی چھوڑی اور 2022 تک بین الصوبائی رابطے کی وفاقی وزیر رہی۔"
