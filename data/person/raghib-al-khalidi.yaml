summary:
  ar: "قاضٍ مقدسي (1866–1952) من عائلة الخالدي، خدم في قضاء القدس ثم يافا، وأسس المكتبة الخالدية التي افتُتحت للجمهور سنة 1900 في البلدة القديمة بالقدس، وجمعت مخطوطات العائلة المتراكمة عبر قرون، بوقفٍ أقامته والدته خديجة خانم."
  en: "Jerusalem judge (1866–1952) of the Khalidi family who served in the judiciary of Jerusalem and then Jaffa, and founded the Khalidi Library, opened to the public in 1900 in the Old City of Jerusalem, gathering the family's centuries-old manuscript collections under a waqf established by his mother Khadija Khanum."
  ur: "قدس کے قاضی (1866–1952) جن کا تعلق الخالدی خاندان سے تھا؛ انہوں نے قدس اور پھر یافا کی عدالتوں میں خدمات انجام دیں، اور خالدیہ کتب خانہ قائم کیا جو 1900ء میں قدیم قدس میں عوام کے لیے کھلا، جس میں خاندان کی صدیوں پرانی مخطوطات کی ذخیرہ اندوزی ان کی والدہ خدیجہ خانم کے قائم کردہ وقف کے تحت جمع ہوئی۔"
