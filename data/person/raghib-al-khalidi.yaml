  layer: own-research
  source: "Raghib al-Khalidi has no Wikipedia article and no Wikidata item — searched by his English and Arabic names in this session — so this record rests on the English Wikipedia's Khalidi Library article (revision fetched live from the MediaWiki API and asserted), André Raymond's 'The Khàalidiyya Library in Jerusalem' (MELA Notes 71–72, 2000–2001), the Jerusalem Post's 2016 library history as reposted by the Khalidi Library, and Tarif Khalidi's 'A Family's History' (Khalidi Library, October 2020), all read in full. KINSHIP: no source read attests an uncle–nephew relation between Raghib and Yusuf al-Khalidi. The nephew of Yusuf attested by both Raymond and Tarif Khalidi is Ruhi al-Khalidi, son of Yusuf's brother Yasin. Raghib was a younger kinsman of the same Jerusalem family — Rashid Khalidi calls Raghib his grandfather and Yusuf his great-great-great-uncle, a distant kinship for which the schema has no predicate — so no family edge is written in either record. The library endowment's benefactor is called Raghib's grandmother by the Khalidi Library article and his mother Khadija by Raymond, Tarif Khalidi and Rashid Khalidi; the mother reading is followed. Existence checks by name fragments (raghib, khalidi) across data/person on origin/main found raghib-al-nashashibi and other namesakes only, and no prior record for this man."
