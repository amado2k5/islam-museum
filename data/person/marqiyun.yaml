label: { ar: "مرقيون", en: "Marqiyun", es: "Marqiyun", fr: "Marqiyun", ur: "مارکیون" }
summary:
  ar: "مرقيون صاحب المرقيونية، ظهر في ملك ططوس أنطونيانوس في السنة الأولى من ملكه قبل ظهور ماني بنحو مائة سنة {cite:fihrist-ibn-al-nadim p. 458}. ولمرقيون كتاب إنجيل سماه ولأصحابه المرقيونية كتاب يختصون به يكتبون به ديانتهم وهم يتسترون بالنصرانية وبخراسان كثير {cite:fihrist-ibn-al-nadim p. 475}"
  en: "Marcion — appeared in Antoninus's first year, a century before Mani {cite:fihrist-ibn-al-nadim}"
  es: "Marción — apareció en el primer año de Antonino, un siglo antes que Mani {cite:fihrist-ibn-al-nadim}"
  fr: "Marcion — apparut la première année d'Antonin, un siècle avant Mani {cite:fihrist-ibn-al-nadim}"
  ur: "مارسیون - منی سے ایک صدی پہلے، انتونینس کے پہلے سال میں نمودار ہوا۔"
  tr: "Markionizmin sahibi Marcion, Titus Antonian'ın saltanatının ilk yılında, Mani'nin ortaya çıkışından yaklaşık yüz yıl önce ortaya çıktı {cite:fihrist-ibn-al-nadim s. 458}. Markkianların bir İncil kitabı vardı ve onun adlandırdığı bir İncil kitabı vardı, Marcionlu takipçileri ise dinlerini yazmaya adanmış, Hristiyanlıkta ve Horasan'ın büyük bir kısmında saklanırken {cite:fihrist-ibn-al-nadim s. 475}"
  id: "Marcion, pemilik Marqionisme, muncul pada masa pemerintahan Titus Antonian pada tahun pertama pemerintahannya, sekitar seratus tahun sebelum kemunculan Mani {cite:fihrist-ibn-al-nadim hlm. 458}. Bangsa Marqian memiliki sebuah kitab Injil yang ia beri nama, dan para pengikutnya di Marcionian memiliki sebuah buku yang didedikasikan untuk menulis agama mereka sambil bersembunyi dalam Kekristenan dan banyak bahasa Khorasan {cite:fihrist-ibn-al-nadim hlm. 475}"
