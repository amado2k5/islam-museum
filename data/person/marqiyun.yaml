summary:
  ar: "مرقيون صاحب المرقيونية، ظهر في ملك ططوس أنطونيانوس في السنة الأولى من ملكه قبل ظهور ماني بنحو مائة سنة {cite:fihrist-ibn-al-nadim p. 458}. ولمرقيون كتاب إنجيل سماه ولأصحابه المرقيونية كتاب يختصون به يكتبون به ديانتهم وهم يتسترون بالنصرانية وبخراسان كثير {cite:fihrist-ibn-al-nadim p. 475}"
  en: "Marcion — appeared in Antoninus's first year, a century before Mani {cite:fihrist-ibn-al-nadim}"
