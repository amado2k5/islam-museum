summary:
  ar: 'فلكي أندلسي من إشبيلية في النصف الأول من القرن السادس/الثاني عشر
    ⁦(Geber عند اللاتين)⁩، ألّف «إصلاح المجسطي» ناقداً نظرية بطلميوس الكوكبية —
    تذكره EI2 في صف من انتقدوا المجسطي إلى جانب ابن الهيثم والبيطروجي
    {cite:encyclopaedia-of-islam-2}.'
  en: 'Andalusi astronomer of Seville, first half of the sixth/twelfth
    century (Geber to the Latins); author of the Islah al-Majisti, a
    correction of Ptolemy''s planetary theory — EI2 lists him with Ibn
    al-Haytham and al-Bitruji among the critics of the Almagest
    {cite:encyclopaedia-of-islam-2}.'
  ur: 'اشبیلیہ کا اندلسی ماہر فلکیات، چھٹی/بارہویں صدی کی پہلی ششماہی
    ⁦(لاطینی میں Geber)⁩؛ اصلاح المجسطی کا مصنف جس نے بطلموس کے سیاروں کے
    نظریے کی اصلاح کی — EI2 اسے ابن الھیثم اور بطروجی کے ساتھ المجسطی کے
    ناقدین میں گنتی ہے {cite:encyclopaedia-of-islam-2}۔'
  es: "Astrónomo andalusí de Sevilla, primera mitad del siglo VI/XII (Geber para los latinos); autor de la Islah al-Majisti, una corrección de la teoría planetaria de Ptolomeo. La enciclopedia EI2 lo incluye junto con Ibn al-Haytham y al-Bitruji entre los críticos del Almagesto {cite:encyclopaedia-of-islam-2}."
  fr: "Astronome andalou de Séville, première moitié du VIe/XIIe siècle (Geber pour les Latins); auteur de l'Islah al-Majisti, une correction de la théorie planétaire de Ptolémée — EI2 le cite avec Ibn al-Haytham et al-Bitruji parmi les critiques de l'Almageste {cite:encyclopaedia-of-islam-2}."
  tr: "6./12. yüzyılın ilk yarısında Sevilla'dan bir Endülüslü astrolog (Latince), 'Almagest'in Reformu'nu yazdı ve Ptolemaios'un gezegen teorisini eleştirdi — EI2, onu İbn al-Heytham ve el-Baytruji ile birlikte Almagest'i eleştirenler arasında anıyor {cite:encyclopaedia-of-islam-2}."
  id: "Seorang astrolog Andalusia dari Sevilla pada paruh pertama abad ke-6/12 (Geber dalam bahasa Latin), menulis 'Reformasi Almagest,' yang mengkritik teori planet Ptolemy — EI2 menyebutnya sebagai salah satu yang mengkritik Almagest bersama Ibn al-Haytham dan al-Baytruji {cite:encyclopaedia-of-islam-2}."
