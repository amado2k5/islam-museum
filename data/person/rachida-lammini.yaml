summary:
  ar: "معلمة وواعظة مغربية تُعرف بـ«الأستاذة رشيدة لميني»، تقدم دروسا دينية قصيرة بالدارجة المغربية والعربية في تدبر القرآن وموضوعات السكينة والأسرة وإصلاح النفس، وانتشرت مقاطع دروسها على نطاق واسع عبر يوتيوب وتيك توك تحت وسم «كلام من ذهب»."
  en: "Moroccan teacher and preacher known as Ustadha Rachida Lammini, who gives short religious lessons in Moroccan Darija and Arabic on Qur'an reflection, inner peace, family and self-reform; clips of her lessons circulate widely on YouTube and TikTok under the tag 'words of gold' (kalam min dhahab)."
  ur: "مراکشی معلمہ اور واعظہ، جو «استاذہ رشیدہ لامینی» کے نام سے مشہور ہیں؛ وہ مراکشی دارجہ اور عربی میں قرآن پر تدبر، سکونِ قلب، خاندان اور اصلاحِ نفس پر مختصر دینی دروس دیتی ہیں، اور ان کے دروس کے کلپس یوٹیوب اور ٹک ٹاک پر «کلام من ذهب» کے عنوان سے بڑے پیمانے پر پھیلتے ہیں۔"
  es: "La maestra y predicadora marroquí conocida como Ustadha Rachida Lammini imparte breves lecciones religiosas en dariya marroquí y árabe sobre la reflexión del Corán, la paz interior, la familia y la autoformación; fragmentos de sus lecciones circulan ampliamente en YouTube y TikTok bajo la etiqueta \"palabras de oro\" (kalam min dhahab)."
  fr: "Ustadha Rachida Lammini, enseignante et prédicatrice marocaine, donne de courtes leçons religieuses en darija marocain et en arabe sur la réflexion coranique, la paix intérieure, la famille et la réforme de soi; des extraits de ses leçons circulent largement sur YouTube et TikTok sous le tag « paroles d'or » (kalam min dhahab)."
  tr: "'Profesör Rachida Lamini' olarak bilinen Faslı öğretmen ve vaiz olan Sher, Fas ve Arap lehçesinde Kur'an tepkisi, huzur, aile ve kendini ıslah etme konularında kısa dini dersler veriyor. Ders klipleri YouTube ve TikTok'ta 'Golden Words' etiketiyle geniş çapta yayıldı."
  id: "Seorang guru dan pengkhotbah Maroko yang dikenal sebagai 'Profesor Rachida Lamini,' ia menawarkan pelajaran singkat keagamaan dalam dialek Maroko dan Arab tentang refleksi Al-Qur'an, topik ketenangan, keluarga, dan reformasi diri. Klip pelajarannya telah tersebar luas di YouTube dan TikTok dengan tagar 'Golden Words.'"
