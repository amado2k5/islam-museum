  ar: "معلمة وواعظة مغربية تُعرف بـ«الأستاذة رشيدة لميني»، تقدم دروسا دينية قصيرة بالدارجة المغربية والعربية في تدبر القرآن وموضوعات السكينة والأسرة وإصلاح النفس، وانتشرت مقاطع دروسها على نطاق واسع عبر يوتيوب وتيك توك تحت وسم «كلام من ذهب»."
  en: "Moroccan teacher and preacher known as Ustadha Rachida Lammini, who gives short religious lessons in Moroccan Darija and Arabic on Qur'an reflection, inner peace, family and self-reform; clips of her lessons circulate widely on YouTube and TikTok under the tag 'words of gold' (kalam min dhahab)."
  ur: "مراکشی معلمہ اور واعظہ، جو «استاذہ رشیدہ لامینی» کے نام سے مشہور ہیں؛ وہ مراکشی دارجہ اور عربی میں قرآن پر تدبر، سکونِ قلب، خاندان اور اصلاحِ نفس پر مختصر دینی دروس دیتی ہیں، اور ان کے دروس کے کلپس یوٹیوب اور ٹک ٹاک پر «کلام من ذهب» کے عنوان سے بڑے پیمانے پر پھیلتے ہیں۔"
