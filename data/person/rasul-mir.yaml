summary:
  ar: "شاعر الغزل الرومانسي الكشميري من دورو شاه آباد، الملقب بإمام العشقية و«جان كيتس كشمير»، الذي أدخل الغزل رسمياً إلى الشعر الكشميري ولم يبقَ من كلامه سوى نحو تسع وسبعين قصيدة."
  en: "Kashmiri romantic ghazal poet of Doru Shahabad, called Imam-e-Ishqiya Shairi and the John Keats of Kashmir, who formally brought the ghazal into Kashmiri poetry; some seventy-nine poems of his survive."
  ur: "ڈورو شاہ آباد کے کشمیری رومانوی غزل گو شاعر، جنھیں امامِ عشقیہ شاعری اور «کشمیری جان کیٹس» کہا جاتا ہے؛ انھوں نے غزل کو باقاعدہ کشمیری شاعری میں داخل کیا اور ان کا کلام تقریباً اناسی نظموں پر مشتمل ہے۔"
