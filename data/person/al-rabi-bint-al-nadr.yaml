id: person/al-rabi-bint-al-nadr
class: person
label: { ar: "الربيع بنت النضر", en: "al-Rabi' bint al-Nadr", fr: "al-Rabi' bint al-Nadr", es: "al-Rabi' bint al-Nadr", ur: "الربیع بنت الندر" }
summary:
  ar: "الربيع بنت النضر عمة أنس بن مالك؛ يقال صار إليها الحسن البصري وأخوه سعيد من سبي ميسان فأعتقتهما فولاؤهما لها ويقال بل جميلة امرأة أنس من بني سلمة."
  en: "Al-Rabi' bint al-Nadr, Anas ibn Malik's aunt; it is said al-Hasan al-Basri and his brother fell to her from Maysan's captives and she freed them — others say it was Jamila, Anas's wife of Salima."
  fr: "Al-Rabi' bint al-Nadr, la tante d'Anas ibn Malik ; il est dit que al-Hasan al-Basri et son frère sont tombés sur elle des captifs de Maysan et elle les a libérés - d'autres disent que c'était Jamila, la femme d'Anas de Salima."
  es: "Al-Rabi' bint al-Nadr, tía de Anas ibn Malik; se dice que al-Hasan al-Basri y su hermano cayeron ante ella, cautivos de Maysan, y ella los liberó; otros dicen que fue Jamila, la esposa de Salima, esposa de Anas."
  ur: "الربیع بنت الندر، انس بن مالک کی خالہ؛ کہا جاتا ہے کہ حسن البصری اور اس کا بھائی میسان کے قیدیوں سے اس کے پاس آئے اور اس نے انہیں آزاد کر دیا - دوسروں کا کہنا ہے کہ یہ جمیلہ تھی، سلیمہ کی بیوی انس۔"
  tr: "Anas ibn Malik'in teyzesi El-Rabi'bin el-Nadr; Hasan el-Basri ve kardeşi Sa'id'in Maysan'ın esiri olduğu ve onları serbest bırakıp kendisine bağlılıklarını verdiği söylenir. Gerçekten de Banu Salamah'dan Anas'ın karısının güzel olduğu söylenir."
  id: "Al-Rabi' bint al-Nadr, bibi Anas ibn Malik; konon Hasan al-Basri dan saudaranya Sa'id menjadi tawanan Maysan, dan ia membebaskan mereka serta memberikan kesetiaan kepadanya. Dikatakan bahwa memang istri Anas dari Banu Salamah sangat cantik."
