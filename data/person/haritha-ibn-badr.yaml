summary:
  ar: "حارثة بن بدر الغداني شاعر البصرة؛ قال ويقال بل قاله البعيث المجاشعي في جامع زياد: بنى زياد لذكر الله مصنعة من الحجارة لم تعمل من الطين لولا تماور أيدي الإنس ترفعها إذا لقلنا من أعمال الشياطين."
  en: "Haritha ibn Badr al-Ghudani, Basra's poet; his — or al-Ba'ith al-Mujashi'i's — verse on Ziyad's mosque: a stone fabric not of clay that, but for human hands, we had called the demons' work."
  es: "Haritha ibn Badr al-Ghudani, poeta de Basora; su verso —o el de al-Ba'ith al-Mujashi'i— sobre la mezquita de Ziyad: una estructura de piedra, no de arcilla, que, de no ser por las manos humanas, habíamos llamado obra de los demonios."
  fr: "Haritha ibn Badr al-Ghudani, poète de Bassora; son vers — ou celui d'al-Ba'ith al-Mujashi'i — sur la mosquée de Ziyad: une construction de pierre non d'argile qui, sans les mains humaines, nous l'aurions appelée l'œuvre des démons."
  ur: "حارثہ بن بدر الغدانی، بصرہ کے شاعر؛ زیاد کی مسجد پر ان کی - یا البیت المجاشی کی - آیت: ایک پتھر کا کپڑا جو مٹی کا نہیں، بلکہ انسانی ہاتھوں کے لیے ہے، ہم نے اسے شیاطین کا کام کہا تھا۔"
  tr: "Basra şairi Haritha ibn Badr el-Ghadani şöyle demiştir ve söylenir, gerçekten de Ziyad Camii'nde el-Bait el-Mücaşii tarafından şöyle der: Ziyad, Allah'ı anmak için taş yapılmış bir taş inşa etti, kilden yapılmamış, insan ellerinin komploları için değil, şeytanların işleriyle vurulduğumuzda onu kaldırmak için yapılan komplolar için."
  id: "Haritha ibn Badr al-Ghadani, penyair Basra, berkata, dan memang dikatakan, dan memang dikatakan oleh al-Ba'ith al-Mujashi'i di Masjid Ziyad: Ziyad membangun batu dari batu yang terbuat dari batu untuk mengenang Tuhan, bukan dari tanah liat, jika bukan untuk konspirasi tangan manusia untuk mengangkatnya ketika kita terkena perbuatan setan."
