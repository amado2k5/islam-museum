summary:
  ar: "البوري ندياي ⁦(ح. 1848 – 1901)⁩، آخر بوربا ⁦(ملك)⁩ لجولوف المستقلة في السنغال الحالية، والمشهور بمقاومته العازمة للغزو الفرنسي. وُلد في تيال بجولوف وقُتل أبوه سنة 1851 فنشأ في كايور إلى جانب قريبه لات ديور، واعتنق معه الإسلام في ستينيات القرن التاسع عشر بقيادة المرابط مابا دياخو با وتزوج إحدى بناته، ثم صار بوربا سنة 1875 فأحكم سيطرته على جولوف وواصل أسلمتها وحصّن عاصمته يانغ يانغ، ودعم ابن عمه لات ديور ضد الفرنسيين، وبقيت جولوف آخر مملكة مستقلة في شمال السنغامبيا حتى زحف دودز على يانغ يانغ في مايو 1890، فاتجه شرقا إلى أحمدو تال وقاتل معه، وواصل طريقه نحو سوكوتو حتى مات في دوسو بالنيجر سنة 1901."
  en: "Alboury Ndiaye (c. 1848 – 1901), the last Buurba (king) of an independent Jolof in present-day Senegal, famed for his determined resistance to the French conquest. Born at Tyal in Jolof, he lost his father in 1851 and was raised in Cayor alongside his kinsman Lat Dior; with Lat Dior he embraced Islam in the 1860s under the marabout Maba Diakhou Ba, whose daughter he married. He became Buurba in 1875, re-established firm royal control, continued the Islamization of Jolof and fortified his capital Yang-Yang; he backed his cousin Lat Dior against the French, and Jolof remained the last independent kingdom of northern Senegambia until Dodds marched on Yang-Yang in May 1890. He then moved east to Ahmadu Tall and fought beside him, and continued towards Sokoto until he died at Dosso in Niger in 1901."
  fr: "Alboury Ndiaye (vers 1848 – 1901), le dernier Buurba (roi) d'un Jolof indépendant dans l'actuel Sénégal, célèbre pour sa résistance déterminée à la conquête française. Né à Tyal en Jolof, il perd son père en 1851 et grandit à Cayor aux côtés de son parent Lat Dior  ; avec Lat Dior, il embrasse l'islam dans les années 1860 sous le marabout Maba Diakhou Ba, dont il épouse la fille. Il devint Buurba en 1875, rétablit un contrôle royal ferme, poursuivit l'islamisation de Jolof et fortifia sa capitale Yang-Yang  ; Il a soutenu son cousin Lat Dior contre les Français, et Jolof est resté le dernier royaume indépendant du nord de la Sénégambie jusqu'à ce que Dodds marche sur Yang-Yang en mai 1890. Il s'est ensuite déplacé vers l'est à Ahmadu Tall et a combattu à ses côtés, et a continué vers Sokoto jusqu'à sa mort à Dosso au Niger en 1901."
  ur: "البوری ندیائے ⁦(تقریباً 1848ء – 1901ء)⁩، موجودہ سینیگال میں آزاد یولوف کے آخری «بوربا» ⁦(بادشاہ)⁩، جو فرانسیسی فتح کے خلاف پُرعزم مزاحمت کے لیے مشہور ہیں۔ یولوف کے تیال میں پیدا ہوئے، 1851ء میں والد قتل ہوئے تو کایور میں اپنے رشتہ دار لات دیور کے ساتھ پرورش پائی؛ 1860ء کی دہائی میں لات دیور کے ساتھ مرابط مابا دیاخو با کی قیادت میں اسلام قبول کیا اور مابا کی صاحبزادی سے شادی کی۔ 1875ء میں بوربا بنے، یولوف پر مضبوط اقتدار قائم کیا، اس کی اسلامی تشکیل جاری رکھی اور دارالحکومت یانگ یانگ کو قلعہ بند کیا؛ فرانسیسیوں کے خلاف اپنے کزن لات دیور کا ساتھ دیا، اور مئی 1890ء میں ڈوڈز کے یانگ یانگ پر چڑھائی تک یولوف شمالی سینیگامبیا کی آخری آزاد ریاست رہا۔ پھر مشرق میں احمدو تال کے پاس گئے اور ان کے ساتھ لڑے، اور سوکوٹو کی طرف بڑھتے ہوئے 1901ء میں نائجر کے دوسو میں وفات پائی۔"
  es: "Alboury Ndiaye (c. 1848 – 1901), último Buurba (rey) de un Jolof independiente en el actual Senegal, famoso por su decidida resistencia a la conquista francesa. Nacido en Tyal, en Jolof, perdió a su padre en 1851 y se crio en Cayor junto a su pariente Lat Dior; con Lat Dior abrazó el islam en la década de 1860 bajo la guía del marabú Maba Diakhou Ba, con cuya hija se casó. Se convirtió en Buurba en 1875, restableció un firme control real, continuó la islamización de Jolof y fortificó su capital, Yang-Yang; apoyó a su primo Lat Dior contra los franceses, y Jolof siguió siendo el último reino independiente del norte de Senegambia hasta que Dodds marchó sobre Yang-Yang en mayo de 1890. Luego se trasladó al este, a Ahmadu Tall, y luchó a su lado, y continuó hacia Sokoto hasta que murió en Dosso, en Níger, en 1901."
  tr: "Al-Bouri Ndiaye (yaklaşık 1848 – 1901), günümüz Senegal'inde bağımsız Joulof'un son Borba'sı (kralı) olup, Fransız işgaline karşı kararlı direnişiyle ünlüsüdür. Jolof'taki Tial'da doğdu ve 1851'de babasını öldürdü. Cayor'da akrabası Lat Dior ile birlikte büyüdü. 1860'larda Murabid Maba Diajo Ba'nın liderliğinde onunla birlikte İslam'a geçti ve kızlarından biriyle evlendi. 1875'te Bourba oldu, Jolof üzerindeki kontrolünü pekiştirdi ve İslamlaşmayı sürdürdü, başkenti Yangyang'ı tahkim etti ve kuzeni Lat Dior'u Fransızlara karşı destekledi. Jolof, Dodds'un Mayıs 1890'da Yangyang'a yürüdüğüne kadar kuzey Senegambia'daki son bağımsız krallık olarak kaldı. Daha sonra doğuya, Ahmadu Tal'a yöneldi ve onunla birlikte savaştı, 1901'de Nijer'in Doso kentinde ölene kadar Sokoto'ya doğru yoluna devam etti."
  id: "Al-Bouri Ndiaye (sekitar 1848 – 1901) adalah Borba (raja) terakhir dari Joulof yang merdeka di wilayah Senegal saat ini, terkenal karena perlawanannya yang gigih terhadap invasi Prancis. Ia lahir di Tial di Jolof dan membunuh ayahnya pada tahun 1851. Ia tumbuh besar di Cayor bersama kerabatnya Lat Dior. Ia ikut masuk Islam bersamanya pada tahun 1860-an di bawah kepemimpinan Murabid Maba Diajo Ba dan menikahi salah satu putrinya. Ia kemudian menjadi Bourba pada tahun 1875, memperkuat kendali atas Jolof dan melanjutkan Islamisasinya, memperkuat ibu kotanya Yangyang, serta mendukung sepupunya Lat Dior melawan Prancis. Jolof tetap menjadi kerajaan merdeka terakhir di Senegambia utara hingga Dodds maju ke Yangyang pada Mei 1890. Ia kemudian menuju timur ke Ahmadu Tal dan bertempur bersamanya, melanjutkan perjalanannya menuju Sokoto hingga ia meninggal di Doso, Niger, pada tahun 1901."
