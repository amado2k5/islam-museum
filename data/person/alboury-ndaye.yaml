summary:
  ar: "البوري ندياي (ح. 1848 – 1901)، آخر بوربا (ملك) لجولوف المستقلة في السنغال الحالية، والمشهور بمقاومته العازمة للغزو الفرنسي. وُلد في تيال بجولوف وقُتل أبوه سنة 1851 فنشأ في كايور إلى جانب قريبه لات ديور، واعتنق معه الإسلام في ستينيات القرن التاسع عشر بقيادة المرابط مابا دياخو با وتزوج إحدى بناته، ثم صار بوربا سنة 1875 فأحكم سيطرته على جولوف وواصل أسلمتها وحصّن عاصمته يانغ يانغ، ودعم ابن عمه لات ديور ضد الفرنسيين، وبقيت جولوف آخر مملكة مستقلة في شمال السنغامبيا حتى زحف دودز على يانغ يانغ في مايو 1890، فاتجه شرقا إلى أحمدو تال وقاتل معه، وواصل طريقه نحو سوكوتو حتى مات في دوسو بالنيجر سنة 1901."
  en: "Alboury Ndiaye (c. 1848 – 1901), the last Buurba (king) of an independent Jolof in present-day Senegal, famed for his determined resistance to the French conquest. Born at Tyal in Jolof, he lost his father in 1851 and was raised in Cayor alongside his kinsman Lat Dior; with Lat Dior he embraced Islam in the 1860s under the marabout Maba Diakhou Ba, whose daughter he married. He became Buurba in 1875, re-established firm royal control, continued the Islamization of Jolof and fortified his capital Yang-Yang; he backed his cousin Lat Dior against the French, and Jolof remained the last independent kingdom of northern Senegambia until Dodds marched on Yang-Yang in May 1890. He then moved east to Ahmadu Tall and fought beside him, and continued towards Sokoto until he died at Dosso in Niger in 1901."
  ur: "البوری ندیائے (تقریباً 1848ء – 1901ء)، موجودہ سینیگال میں آزاد یولوف کے آخری «بوربا» (بادشاہ)، جو فرانسیسی فتح کے خلاف پُرعزم مزاحمت کے لیے مشہور ہیں۔ یولوف کے تیال میں پیدا ہوئے، 1851ء میں والد قتل ہوئے تو کایور میں اپنے رشتہ دار لات دیور کے ساتھ پرورش پائی؛ 1860ء کی دہائی میں لات دیور کے ساتھ مرابط مابا دیاخو با کی قیادت میں اسلام قبول کیا اور مابا کی صاحبزادی سے شادی کی۔ 1875ء میں بوربا بنے، یولوف پر مضبوط اقتدار قائم کیا، اس کی اسلامی تشکیل جاری رکھی اور دارالحکومت یانگ یانگ کو قلعہ بند کیا؛ فرانسیسیوں کے خلاف اپنے کزن لات دیور کا ساتھ دیا، اور مئی 1890ء میں ڈوڈز کے یانگ یانگ پر چڑھائی تک یولوف شمالی سینیگامبیا کی آخری آزاد ریاست رہا۔ پھر مشرق میں احمدو تال کے پاس گئے اور ان کے ساتھ لڑے، اور سوکوٹو کی طرف بڑھتے ہوئے 1901ء میں نائجر کے دوسو میں وفات پائی۔"
