summary:
  ar: "الشيخ نصر الدين جحا الرومي، تركي الأصل من أهل الأناضول، ولد في سيوري حصار، ووفاته في آق شهر. ينسب إليه الأتراك أخبار جحا، ويُذكر أن ضريحه في آق شهر، وتُنقل عن الكتاب تعليقات على الخلط بين الشخصيتين. {cite:juha-nawadir-kubra-djuwaydi p. 6-8}"
  en: "Sheikh Nasreddin Hoca, a Turk from Anatolia, born in Seyitgazi and died in Akşehir. The Turks attribute many Juha stories to him; the editor notes his tomb in Akşehir and the confusion between the two figures. {cite:juha-nawadir-kubra-djuwaydi p. 6-8}"
  ur: "شیخ نصر الدین خوجہ، ترک نژاد، اناطولیہ کے رہنے والے؛ سیورے حصار میں پیدا ہوئے اور آق شہر میں وفات پائی۔ ترکوں نے جحا کی بہت سی حکایات انہی سے منسوب کیں، اور مرتب ان دونوں شخصیتوں کے خلط کا ذکر کرتے ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 6-8}"
