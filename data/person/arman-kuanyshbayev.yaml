summary:
  ar: "داعية كازاخستاني يُعرف بـ«الأستاذ أرمان»، عدّت دراسة محكّمة متابعي حسابه على إنستغرام بنحو 814 ألف متابع في يناير 2025، وتبلغ قناته الخاصة على يوتيوب نحو 128 ألف مشترك؛ يصفه الباحثون بأسلوب رحيم لطيف يبسّط المفاهيم الدينية، وهو على صلة بمجلس علماء المسلمين في البلاد."
  en: "A Kazakhstani preacher known as 'Ustaz Arman', whose Instagram account counted 814 thousand followers in a peer-reviewed study (January 2025) and whose own YouTube channel counts about 128 thousand subscribers; researchers describe a compassionate, gentle style that makes religious principles easy to grasp, and he is connected with the country's Council of Islamic Scholars."
  ur: "ارمان کوانیشباییف، جو «استاذ ارمان» کے نام سے جانے جاتے ہیں، قازقستان کے مبلغ ہیں؛ ایک محققانہ مطالعے کے مطابق جنوری 2025 میں ان کے انسٹاگرام فالوورز تقریباً 814 ہزار تھے اور ان کے ذاتی یوٹیوب چینل کے تقریباً 128 ہزار سبسکرائبر ہیں۔ محققین ان کے اسلوب کو شفیق اور نرم قرار دیتے ہیں جو دینی مفاہیم کو آسان بنا کر پیش کرتا ہے، اور وہ ملک کی علماء کونسل سے منسلک ہیں۔"
  es: "Un predicador kazajo conocido como 'Ustaz Arman', cuya cuenta de Instagram contaba con 814 mil seguidores en un estudio revisado por pares (enero de 2025) y cuyo propio canal de YouTube tiene alrededor de 128 mil suscriptores; los investigadores describen un estilo compasivo y amable que facilita la comprensión de los principios religiosos, y está vinculado al Consejo de Eruditos Islámicos del país."
  fr: "Un prédicateur kazakh connu sous le nom d'« Ustaz Arman », dont le compte Instagram comptait 814 000 abonnés dans une étude évaluée par des pairs (janvier 2025) et dont la propre chaîne YouTube compte environ 128 000 abonnés; les chercheurs décrivent un style compatissant et doux qui rend les principes religieux faciles à comprendre, et il est lié au Conseil des oulémas islamiques du pays."
  tr: "'Profesör Arman' olarak bilinen Kazak vaiz, Instagram hesap takipçilerini detaylı bir şekilde inceledi ve Ocak 2025'te yaklaşık 814.000 takipçi saydı ve özel YouTube kanalının yaklaşık 128.000 abonesi var; araştırmacılar onu şefkatli, dini kavramları basitleştiren bir şekilde nazik biri olarak tanımlıyor ve ülkedeki Müslüman Alimler Konseyi ile bağlantılı."
  id: "Seorang pengkhotbah Kazakh yang dikenal sebagai 'Profesor Arman,' studi mendalam terhadap pengikut akun Instagram-nya mencatat sekitar 814.000 pengikut pada Januari 2025, dan saluran YouTube pribadinya memiliki sekitar 128.000 pelanggan; para peneliti menggambarkannya sebagai sosok yang penuh kasih, lembut dengan cara yang menyederhanakan konsep agama, dan ia terhubung dengan Dewan Ulama Muslim di negara tersebut."
