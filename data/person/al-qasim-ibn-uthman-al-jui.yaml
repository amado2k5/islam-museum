summary:
  ar: "القاسم بن عثمان الجوعي، زاهد لُقّب بالجوعي لصبره على ترك الطعام، يروي عنه أحمد بن أبي الحواري كلامًا في المحبة والمعرفة، وروى الحديث عن سفيان بن عيينة وغيره بحسب «حلية الأولياء»."
  en: "Al-Qasim ibn Uthman al-Ju'i, an ascetic nicknamed al-Ju'i (\"the hungry\") for his indifference to food; Ahmad ibn Abi al-Hawari relates his sayings on love and knowledge of God, and he transmitted hadith from Sufyan ibn Uyayna and others according to Hilyat al-Awliya."
  ur: "قاسم بن عثمان جوعی ایک زاہد تھے۔ کھانا چھوڑنے پر صبر کی وجہ سے انہیں جوعی کہا گیا۔ احمد بن ابی الحواری ان سے محبت اور معرفت کے اقوال نقل کرتے ہیں۔ «حلیۃ الاولیاء» کے مطابق انہوں نے سفیان بن عیینہ اور دوسروں سے حدیث روایت کی۔"
