summary:
  ar: "سياسي هندي (1894–1954) من منطقة بارابانكي. درس في الكلية المحمدية الأنجلو-شرقية، ونشط في حركتي الخلافة وعدم التعاون، وصار وزيرًا في حكومة الولاية ثم أول وزير للاتصالات في الهند المستقلة (1947–1952) ووزير الغذاء والزراعة (1952–1954) أيام نقص الغذاء والحصص التموينية، وتوفي في دلهي وهو في المنصب."
  en: "Indian politician (1894–1954) from Barabanki district. Educated at the Muhammadan Anglo-Oriental College, he was active in the Khilafat and non-cooperation movements, served as a provincial minister, then as independent India's first Minister of Communications (1947–1952) and as Minister of Food and Agriculture (1952–1954) through the years of food scarcity and rationing, dying in office at Delhi."
  ur: "ضلع بارہ بنکی کے ہندوستانی سیاست دان (1894ء–1954ء)۔ محمڈن اینگلو اورینٹل کالج سے تعلیم پائی، تحریک خلافت اور عدم تعاون میں سرگرم رہے، صوبائی وزیر بنے، پھر آزاد ہندوستان کے پہلے وزیر مواصلات (1947ء–1952ء) اور وزیر خوراک و زراعت (1952ء–1954ء) رہے، اور دہلی میں عہدے پر رہتے ہوئے وفات پائی۔"
