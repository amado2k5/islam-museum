summary:
  ar: "مزاحم بن خاقان بن عرطوج، أبو الفوارس، قائد تركي الأصل بغدادي المنشأ، أرسله المعتز لإخماد ثورة الإسكندرية سنة 252 هـ فولاه إمرة مصر سنة 253، وتوفي بمصر وهو في الإمارة سنة 254 هـ."
  en: "Muzahim ibn Khaqan ibn Urtuj, Abu al-Fawaris, a Turkic-born commander raised in Baghdad whom al-Mu'tazz sent to crush the Alexandria revolt in 252 AH and then appointed to the command of Egypt in 253; he died in Egypt in office in 254 AH (868)."
  es: "Muzahim ibn Khaqan ibn Urtuj, Abu al-Fawaris, un comandante de origen turco criado en Bagdad a quien al-Mu'tazz envió a aplastar la revuelta de Alejandría en el 252 AH y luego fue nombrado comandante de Egipto en el 253; murió en Egipto en el cargo en el 254 AH (868)."
  fr: "Muzahim ibn Khaqan ibn Urtuj, Abu al-Fawaris, un commandant d'origine turque élevé à Bagdad qu'al-Mu'tazz envoya écraser la révolte d'Alexandrie en 252 AH puis nommé au commandement de l'Égypte en 253; il mourut en Égypte en fonction en 254 AH (868)."
  ur: "مظہیم ابن خاقان ابن ارتوج، ابو الفوارس، ایک ترک نژاد کمانڈر جس کی پرورش بغداد میں ہوئی جسے المعتز نے 252 ہجری میں اسکندریہ کی بغاوت کو کچلنے کے لیے بھیجا اور پھر 253 میں مصر کی کمان پر مقرر کیا؛ ان کا انتقال 254ھ (868) میں مصر میں ہوا۔"
  tr: "Muzahim ibn Khaqan ibn Artuj, Ebu el-Fawaris, Türk kökenli ve Bağdadî kökenli bir komutandı. El-Mu'tazz, onu 252 Hicri'de İskenderiye isyanını bastırmak için gönderdi, 253 Hicri'de Mısır valisi olarak atadı ve 254 Hicri'de görevdeyken Mısır'da öldü."
  id: "Muzahim ibn Khaqan ibn Artuj, Abu al-Fawaris, adalah seorang komandan keturunan Turki yang berasal dari Baghdadi. Al-Mu'tazz mengirimnya untuk menumpas pemberontakan Alexandria pada tahun 252 H, mengangkatnya sebagai gubernur Mesir pada tahun 253 H, dan meninggal di Mesir saat masih menjabat pada tahun 254 H."
