summary:
  ar: "أحمد ياسين (1936 – 22 مارس 2004) داعية وسياسي فلسطيني وُلد في قرية الجورة قرب عسقلان ولجأ مع أسرته إلى غزة سنة 1948، وأصابه شلل رباعي منذ السادسة عشرة. عمل معلمًا للعربية وخطيبًا في مساجد غزة، وشارك في إقامة فرع فلسطيني للإخوان المسلمين، وأسّس المجمع الإسلامي سنة 1973، ثم شارك في تأسيس حركة حماس سنة 1987 وصار قائدها الروحي. سجنته إسرائيل سنة 1989 وحُكم عليه بالسجن المؤبد، وأُطلق سنة 1997 في صفقة تبادل مع الأردن، واغتالته إسرائيل بصاروخ في غزة فجر 22 مارس 2004."
  en: "Ahmed Yassin (1936 – 22 March 2004) was a Palestinian preacher and politician born in the village of al-Jura near Ashkelon who fled with his family to Gaza in 1948 and was quadriplegic from the age of sixteen. He worked as an Arabic teacher and a preacher in Gaza's mosques, helped set up a Palestinian branch of the Muslim Brotherhood, founded the Mujama al-Islamiya in 1973, and co-founded Hamas in 1987, becoming its spiritual leader. Israel imprisoned him in 1989 under a life sentence, released him in 1997 in an exchange arrangement with Jordan, and assassinated him by missile in Gaza on 22 March 2004."
  ur: "احمد یاسین (1936ء – 22 مارچ 2004ء) فلسطینی مبلغ اور سیاست دان تھے جو عسقلان کے قریب گاؤں الجورہ میں پیدا ہوئے اور 1948ء میں خاندان کے ساتھ غزہ آئے؛ سولہ برس کی عمر سے وہ چاروں اعضاء سے معذور تھے۔ غزہ میں عربی کے استاد اور مساجد کے خطیب رہے، اخوان المسلمین کی فلسطینی شاخ کے قیام میں شریک ہوئے، 1973ء میں المجمع الاسلامی اور 1987ء میں حماس کے شریکِ بانی بنے اور اس کے روحانی رہنما قرار پائے۔ اسرائیل نے 1989ء میں انہیں عمر قید دی، 1997ء میں اردن کے ساتھ تبادلے میں رہا کیا، اور 22 مارچ 2004ء کو غزہ میں میزائل حملے میں شہید کر دیا۔"
