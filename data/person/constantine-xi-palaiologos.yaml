summary:
  ar: "قسطنطين، آخر أباطرة بيزنطة، قاد دفاع القسطنطينية بنفسه ضد محمد الفاتح سنة 857هـ/1453م. ينقل الصلابي أنه استمات في محاولات ثني السلطان بالأموال والهدايا، وطلب المساعدات من الدول الأوروبية وعلى رأسها البابا حتى مال إلى توحيد الكنيسة الأرثوذكسية مع الكاثوليك فأغضب ذلك جمهور الأرثوذكس {cite:dawlat-uthmaniyya-salabi p. 93-94}، وأنه رفض في مجلسين متتاليين نصيحة معاونيه بالخروج من المدينة لطلب النجدات مصرّاً على أن يكون مصيره مصير شعبه {cite:dawlat-uthmaniyya-salabi p. 100-103}، وأنه رد رسالة الفاتح الأخيرة بأنه يدفع الجزية أما المدينة فأقسم أن يدافع عنها إلى آخر نفس: «فإما أن يحفظ عرشه أو يدفن تحت أسوارها» {cite:dawlat-uthmaniyya-salabi p. 104}. ولما رفعت الأعلام العثمانية على الأبراج خلع ملابسه حتى لا يُعرف ونزل عن حصانه وقاتل حتى قُتل في ساحة المعركة {cite:dawlat-uthmaniyya-salabi p. 110}."
  en: "Constantine, the last Byzantine emperor, who led Constantinople's defence in person against Mehmed II in 857/1453. Al-Salabi recounts his desperate gifts and bribes to turn the sultan away, his appeals to Europe and the Pope — leaning toward uniting the Orthodox church with Rome, which enraged his own Orthodox {cite:dawlat-uthmaniyya-salabi p. 93-94} — his twice refusing his councillors' advice to leave the city, insisting his fate was his people's {cite:dawlat-uthmaniyya-salabi p. 100-103}, and his answer to Mehmed's final offer of safe-conduct: he would pay tribute, but had sworn to defend the city to his last breath, 'either keeping his throne or buried beneath its walls' {cite:dawlat-uthmaniyya-salabi p. 104}. When the Ottoman banners rose on the towers he cast off his clothes so he would not be known, dismounted, and fought until he was killed {cite:dawlat-uthmaniyya-salabi p. 110}."
  es: "Constantino, el último emperador bizantino, que dirigió personalmente la defensa de Constantinopla contra Mehmed II en 857/1453. Al-Salabi relata sus desesperados regalos y sobornos para alejar al sultán, sus apelaciones a Europa y al Papa —inclinándose por unir la iglesia ortodoxa con Roma, lo que enfureció a su propia iglesia ortodoxa {cite:dawlat-uthmaniyya-salabi p. 93-94}— su negativa en dos ocasiones al consejo de sus consejeros de abandonar la ciudad, insistiendo en que su destino era el de su pueblo {cite:dawlat-uthmaniyya-salabi p. 100-103}, y su respuesta a la última oferta de salvoconducto de Mehmed: pagaría tributo, pero había jurado defender la ciudad hasta su último aliento, \"ya sea conservando su trono o enterrado bajo sus muros\" {cite:dawlat-uthmaniyya-salabi p. 104}. Cuando las banderas otomanas se alzaron en las torres, se despojó de sus ropas para no ser reconocido, desmontó y luchó hasta morir {cite:dawlat-uthmaniyya-salabi p. 110}."
  fr: "Constantin, le dernier empereur byzantin, qui mena personnellement la défense de Constantinople contre Mehmed II en 857/1453. Al-Salabi relate ses présents désespérés et ses pots-de-vin pour dissuader le sultan, ses appels à l'Europe et au pape – penchant pour l'union de l'Église orthodoxe avec Rome, ce qui provoqua la colère de ses propres orthodoxes {cite:dawlat-uthmaniyya-salabi p. 93-94} – son refus à deux reprises de suivre l'avis de ses conseillers de quitter la ville, insistant sur le fait que son destin était celui de son peuple {cite:dawlat-uthmaniyya-salabi p. 100-103}, et sa réponse à l'ultime offre de sauf-conduit de Mehmed: il paierait le tribut, mais avait juré de défendre la ville jusqu'à son dernier souffle, « soit en conservant son trône, soit en étant enterré sous ses murs » {cite:dawlat-uthmaniyya-salabi p. 104}. Lorsque les bannières ottomanes se sont levées sur les tours, il a jeté ses vêtements pour ne pas être reconnu, est descendu de cheval et a combattu jusqu'à ce qu'il soit tué {cite:dawlat-uthmaniyya-salabi p. 110}."
  ur: "قسطنطین، آخری بازنطینی شہنشاہ، جس نے 857/1453 میں محمود II کے خلاف قسطنطنیہ کے دفاع کی ذاتی طور پر قیادت کی۔ السلابی نے سلطان کو ہٹانے کے لیے اپنے مایوس تحائف اور رشوت کا ذکر کیا، یورپ اور پوپ سے اس کی اپیلیں - آرتھوڈوکس چرچ کو روم کے ساتھ متحد کرنے کی طرف جھکاؤ، جس نے اس کے اپنے آرتھوڈوکس کو غصہ دلایا۔ 93-94} - اس نے دو بار اپنے کونسلروں کے شہر چھوڑنے کے مشورے سے انکار کرتے ہوئے اس بات پر اصرار کیا کہ اس کی قسمت اس کے لوگوں کی تھی۔ 100-103}، اور محمد کی آخری پیش کش پر اس کا جواب: وہ خراج تحسین پیش کرے گا، لیکن اس نے اپنی آخری سانس تک شہر کا دفاع کرنے کی قسم کھائی تھی، 'یا تو اپنا تخت برقرار رکھوں گا یا اس کی دیواروں کے نیچے دفن ہوں گے'۔ 104}۔ جب عثمانی جھنڈے برجوں پر چڑھے تو اس نے اپنے کپڑے اتار دیے تاکہ اسے پہچانا نہ جائے، نیچے اترا اور اس وقت تک لڑتا رہا جب تک کہ اسے قتل نہ کر دیا جائے۔ 110}۔"
  tr: "Bizans'ın son imparatoru Konstantin, 857 Hicri / 1453 yılında Fatih Mehmed'e karşı Konstantinopolis'in savunmasını bizzat yönetti. Al-Salabi, Sultan'ı caydırmak için para ve hediyelerle caydırmaya devam ettiğini, özellikle Papa'dan yardım istediğini, ancak Ortodoks Kilisesi'ni Katoliklerle birleştirmeye eğilimli hale geldiğini ve bunun Ortodoks halkını kızdırdığını bildirir {cite:dawlat-uthmaniyya-salabi s. 93-94}. Ayrıca iki ardışık konsilde yardımcılarının yardım aramak için şehri terk etme tavsiyesini reddetti ve kaderinin halkının kaderi olmasını istedi {cite:dawlat-uthmaniyya-salabi s. 100-103}. Fatihin son mektubunu reddetti ve şehre haraç ödeyeceğini söyledi, ancak son nefesine kadar savunmaya yemin etti: \"Ya tahtı korunur ya da duvarlarının altına gömülür\" {cite:dawlat-uthmaniyya-salabi s. 104}. Osmanlı bayrakları kulelere dikildiğinde, tanınmamak için kıyafetlerini çıkardı, atından indi ve savaş alanında öldürülene kadar savaştı {cite:dawlat-uthmaniyya-salabi s. 110}."
  id: "Konstantinus, kaisar terakhir Bizantium, secara pribadi memimpin pertahanan Konstantinopel melawan Mehmed Sang Penakluk pada tahun 857 H / 1453 M. Al-Salabi melaporkan bahwa ia terus berusaha mencegah Sultan dengan uang dan hadiah, serta mencari bantuan dari negara-negara Eropa, terutama Paus, hingga ia cenderung menyatukan Gereja Ortodoks dengan Katolik, yang membuat marah publik Ortodoks {cite:dawlat-uthmaniyya-salabi hlm. 93-94}. Ia juga menolak dalam dua konsili berturut-turut nasihat para pembantunya untuk meninggalkan kota mencari bantuan, bersikeras bahwa nasibnya adalah nasib rakyatnya {cite:dawlat-uthmaniyya-salabi hlm. 100-103}. Ia menolak surat terakhir sang penakluk dengan mengatakan akan membayar upeti kepada kota, tetapi ia bersumpah akan membelanya hingga akhir hanya: \"Entah takhtanya tetap terjaga atau ia dikubur di bawah temboknya\" {cite:dawlat-uthmaniyya-salabi hlm. 104}. Ketika bendera Ottoman dikibarkan di menara, ia melepas pakaiannya agar tidak dikenali, turun dari kudanya, dan bertempur hingga tewas di medan perang {cite:dawlat-uthmaniyya-salabi hlm. 110}."
