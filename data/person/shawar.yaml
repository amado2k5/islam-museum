label: { ar: "شاور صاحب مصر" }
summary:
  ar: "صاحب مصر، استنجد بالفرنج على أسد الدين شيركوه سنة اثنتين وستين فدخلوا من دمياط، وفي سنة أربع وستين أحرق الفسطاط خوفاً من الفرنج لما حاصروا القاهرة ثم كاتب نور الدين يستنجد به {cite:tarikh-khulafa-minhaj-1434 p. 679-680}. وأمر بصلب القاضي الرشيد الغساني الأسواني شنقاً ظلماً، فلما قتل شاور بعد حين حفروا له قبراً فوجدوا الرشيد مدفوناً فيه فدفنا معاً {cite:shadharat-dhahab p. 685}."
  en: "Egypt's vizier who twice bought rescue — the Franks through Damietta in 562, then burnt al-Fustat before their siege and called Nur al-Din in 564 {cite:tarikh-khulafa-minhaj-1434 p. 679-680}."
