label: { ar: "شاور صاحب مصر" }
summary:
  ar: "صاحب مصر، استنجد بالفرنج على أسد الدين شيركوه سنة اثنتين وستين فدخلوا من دمياط، وفي سنة أربع وستين أحرق الفسطاط خوفاً من الفرنج لما حاصروا القاهرة ثم كاتب نور الدين يستنجد به {cite:tarikh-khulafa-minhaj-1434 p. 679-680}. وأمر بصلب القاضي الرشيد الغساني الأسواني شنقاً ظلماً، فلما قتل شاور بعد حين حفروا له قبراً فوجدوا الرشيد مدفوناً فيه فدفنا معاً {cite:shadharat-dhahab p. 685}."
  en: "Egypt's vizier who twice bought rescue — the Franks through Damietta in 562, then burnt al-Fustat before their siege and called Nur al-Din in 564 {cite:tarikh-khulafa-minhaj-1434 p. 679-680}."
  es: "El visir de Egipto que compró el rescate dos veces: a los francos a través de Damietta en 562, luego quemó al-Fustat antes de su asedio y llamó a Nur al-Din en 564 {cite:tarikh-khulafa-minhaj-1434 p. 679-680}."
  fr: "Le vizir d'Égypte qui a acheté deux fois le sauvetage des Francs à travers Damiette en 562, puis a brûlé al-Fustat avant leur siège et a appelé Nur al-Din en 564 {cite:tarikh-khulafa-minhaj-1434 p. 679-680}."
  ur: "مصر کا وزیر جس نے دو بار ریسکیو خریدا - فرینکوں نے 562 میں ڈیمیٹا کے ذریعے، پھر ان کے محاصرے سے پہلے الفستات کو جلا دیا اور 564 میں نورالدین کو بلایا۔ 679-680}۔"
  tr: "Mısır hükümdarı, altmış iki yılında Asad al-Din Shirkuh'a karşı Franklardan yardım istedi, bu yüzden Damietta'dan girdiler. Altmış dört yılda, Franklar Kahire'yi kuşattığında Fustat korkusuyla yakıldı. Sonra Nur al-Din ona yardım için yazdı {atıf:Tarikh-Khulafa-minhaj-1434 s. 679-680}. Yargıç al-Rashid al-Ghassani al-Aswani'nin haksız yere asılmasını emretti. Öldürüldüğünde, bir süre sonra onun için bir mezar kazıldı ve al-Rashid'i orada gömülü buldular, biz de onu birlikte gömdük {cite:shadharat-dhahab s. 685}."
  id: "Penguasa Mesir meminta bantuan dari bangsa Franka melawan Asad al-Din Shirkuh pada tahun enam puluh dua, sehingga mereka masuk dari Damietta. Pada tahun enam puluh empat, Fustat dibakar karena takut pada bangsa Franka saat mereka mengepung Kairo. Kemudian Nur al-Din menulis surat kepadanya untuk meminta bantuan {cite:Tarikh-Khulafa-minhaj-1434 hlm. 679-680}. Ia memerintahkan hukuman gantung tidak adil terhadap Hakim al-Rashid al-Ghassani al-Aswani. Setelah beberapa waktu, mereka menggali makam untuknya dan menemukan al-Rashid dimakamkan di sana, sehingga kami menguburnya bersama {cite:shadharat-dhahab hlm. 685}."
