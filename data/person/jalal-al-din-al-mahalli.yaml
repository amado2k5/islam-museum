summary:
  ar: "جلال الدين محمد بن أحمد بن محمد بن إبراهيم المحلي الشافعي ⁦(791–864هـ)⁩، الأصولي المتكلم الفقيه المفسر، وُلد بمصر، ودرّس بالمؤيدية والبرقوقية، وعُرض عليه القضاء فامتنع؛ من كتبه شرح جمع الجوامع وشرح الورقات في الأصول وشرح المنهاج في الفقه، وفسّر القرآن من الكهف إلى الناس ثم الفاتحة، فأتمّه السيوطي فصار «تفسير الجلالين» {cite:tafsir-jalalayn-tamir-maktabat-al-iman p.4} {cite:tafsir-jalalayn-tamir-maktabat-al-iman p.3}."
  en: "Jalal al-Din Muhammad ibn Ahmad ibn Muhammad ibn Ibrahim al-Mahalli the Shafi'i (791–864 AH), legal theorist, theologian, jurist and exegete, born in Egypt; he taught at the Mu'ayyadiyya and the Barquqiyya and declined a judgeship. His works include commentaries on Jam' al-Jawami' and al-Waraqat in legal theory and on al-Minhaj in law; he explained the Qur'an from al-Kahf to al-Nas and then al-Fatiha, and al-Suyuti completed it as Tafsir al-Jalalayn {cite:tafsir-jalalayn-tamir-maktabat-al-iman p.4} {cite:tafsir-jalalayn-tamir-maktabat-al-iman p.3}."
  ur: "جلال الدین محمد بن احمد بن محمد بن ابراہیم محلی شافعی (791–864ھ)، اصولی، متکلم، فقیہ اور مفسر، مصر میں پیدا ہوئے؛ مؤیدیہ اور برقوقیہ میں تدریس کی اور قضا کی پیشکش ٹھکرا دی۔ ان کی کتابوں میں اصول میں جمع الجوامع اور الورقات کی شرحیں اور فقہ میں المنہاج کی شرح ہیں؛ انہوں نے سورۂ کہف سے سورۂ ناس تک اور پھر سورۂ فاتحہ کی تفسیر کی، جسے سیوطی نے مکمل کیا اور وہ «تفسیر الجلالین» بنی {cite:tafsir-jalalayn-tamir-maktabat-al-iman p.4} {cite:tafsir-jalalayn-tamir-maktabat-al-iman p.3}۔"
