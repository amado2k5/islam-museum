summary:
  ar: "شاعر فارسي من مراغة في أذربيجان، وُلد نحو سنة 680هـ ⁦(1281م)⁩، وتخلص باسم شيخه أوحد الدين الكرماني، وتوفي سنة 738هـ ⁦(1337م)⁩ ودفن في مسقط رأسه. صاحب ديوان نحو عشرة آلاف بيت، وأعظم شعره في مثنوياته ومنها «جام جم» {cite:encyclopaedia-of-islam-2 vol. 1 p. 813}."
  en: "Persian poet from Maragha in Adharbayjan, born about 680 AH (1281-2), who took his takhallus from his master Awhad al-Din of Kirman. He died in 738 AH (1337-8) and was buried at his birthplace. He wrote a diwan of about ten thousand verses; his best work is in his mathnawis, among them the Jam-i Jam {cite:encyclopaedia-of-islam-2 vol. 1 p. 813}."
  es: "Poeta persa de Maragha en Adharbayjan, nacido alrededor del año 680 de la Hégira (1281-1282), que recibió su título de maestro Awhad al-Din de Kirman. Falleció en el año 738 de la Hégira (1337-1338) y fue enterrado en su lugar de nacimiento. Escribió un diwan de aproximadamente diez mil versos; su obra más destacada se encuentra en sus mathnawis, entre ellos el Jam-i Jam {cite:encyclopaedia-of-islam-2 vol. 1 p. 813}."
  fr: "Poète persan originaire de Maragha, en Adharbayjan, né vers 680 AH (1281-1282), il reçut son takhallus de son maître Awhad al-Din de Kirman. Il mourut en 738 AH (1337-1338) et fut inhumé dans son lieu de naissance. Il composa un diwan d'environ dix mille vers; son œuvre majeure se trouve dans ses mathnawis, parmi lesquels le Jam-i Jam (voir: Encyclopaedia of Islam, vol. 2, p. 813)."
