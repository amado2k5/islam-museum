summary:
  ar: "شاعر فارسي من مراغة في أذربيجان، وُلد نحو سنة 680هـ (1281م)، وتخلص باسم شيخه أوحد الدين الكرماني، وتوفي سنة 738هـ (1337م) ودفن في مسقط رأسه. صاحب ديوان نحو عشرة آلاف بيت، وأعظم شعره في مثنوياته ومنها «جام جم» {cite:encyclopaedia-of-islam-2 vol. 1 p. 813}."
  en: "Persian poet from Maragha in Adharbayjan, born about 680 AH (1281-2), who took his takhallus from his master Awhad al-Din of Kirman. He died in 738 AH (1337-8) and was buried at his birthplace. He wrote a diwan of about ten thousand verses; his best work is in his mathnawis, among them the Jam-i Jam {cite:encyclopaedia-of-islam-2 vol. 1 p. 813}."
