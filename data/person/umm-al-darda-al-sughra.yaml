summary:
  ar: "هجيمة بنت حيي الوصابية الحميرية، أم الدرداء الصغرى، فقيهة محدثة تابعية من أهل دمشق، نشأت في حجر أبي الدرداء وتزوجها، وعاشت معظمة عند بني أمية بين بيت المقدس ودمشق، وروى لها مسلم وأبو داود والترمذي وابن ماجة، وتذكر وفاتها بعد سنة 81 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 p. 77} {cite:shadharat-dhahab vol. 1 p. 333}."
  en: "Hujayma bint Huyayy al-Wasabiyya al-Himyariyya, Umm al-Darda al-Sughra, a female jurist and hadith transmitter of the Tabi'un generation from Damascus; she grew up in the care of Abu al-Darda and married him, lived honoured under the Umayyads between Jerusalem and Damascus, and has hadith recorded for her by Muslim, Abu Dawud, al-Tirmidhi and Ibn Majah; her death is placed after 81 AH (about 700 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 p. 77} {cite:shadharat-dhahab vol. 1 p. 333}."
  es: "Hujayma bint Huyayy al-Wasabiyya al-Himyariyya, Umm al-Darda al-Sughra, jurista y transmisora de hadices de la generación Tabi'un de Damasco; creció bajo el cuidado de Abu al-Darda y se casó con él, vivió honrada bajo los omeyas entre Jerusalén y Damasco, y tiene hadices registrados para ella por Muslim, Abu Dawud, al-Tirmidhi e Ibn Majah; su muerte se sitúa después del 81 d. H. (alrededor del 700 d. C.) {cita:alam-zirikli-dar-al-ilm-2002 vol. 8p. 77} {citar: shadharat-dhahab vol. 1 pág. 333}."
  fr: "Hujayma bint Huyayy al-Wasabiyya al-Himyariyya, Umm al-Darda al-Sughra, une juriste et transmettrice de hadiths de la génération Tabi'un de Damas; elle a grandi sous la garde d'Abou al-Darda et l'a épousé, a vécu honorée sous les Omeyyades entre Jérusalem et Damas, et a des hadiths enregistrés pour elle par Muslim, Abu Dawud, al-Tirmidhi et Ibn Majah; sa mort est placée après 81 AH (environ 700 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 20h. 77} {cite: shadharat-dhahab vol. 1 p. 333}."
