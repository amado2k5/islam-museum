  note: "The death date is genuinely unsettled and all readings are preserved. The draft stub and the queue gave 1692, following the 1103 AH reading in al-Dhari'a which WikiNoor also records (alongside 1100 AH); the English article gives 18 Ramadan 1691; the Persian article says only that he died in Qom between 1100 and 1107 AH. Encyclopaedia Iranica shows, from the dated completion of the third volume of his Tawhid commentary on 18 Ramadan 1107 / 20 April 1696, that he was still alive then; 1696 is therefore the earliest defensible year and is recorded here, with the earlier readings left standing in this note."
