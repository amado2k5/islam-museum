summary:
  ar: "قاضي سعيد قمي ⁦(محمد سعيد بن محمد مفيد، ١٦٤٠–بعد ١٦٩٦م)⁩، المعروف بـ«حكيم كوجك» أي الحكيم الصغير، فيلسوف وفقيه ومتصوّف وطبيب بلاط صفوي من قم، جعل شرحه الضخم على «كتاب التوحيد» لابن بابويه منه أبرز أصوات مدرسة قم وناقداً لملا صدرا."
  en: "Qadi Sa'id Qumi (Muhammad-Sa'id b. Muhammad-Mofid, 1640–after 1696), known as Hakim Kuchak, 'the Little Sage', was a Safavid philosopher, jurist, mystic and court physician of Qom whose vast commentary on Ibn Babawayh's Book of Tawhid made him the leading voice of the Qom school and a critic of Mulla Sadra."
faith:
  - value: shia-twelver
    basis: documented
    note: "Attested for the man himself by independent texts: Encyclopaedia Iranica introduces him as a 'Shiʿite philosopher, jurist, and mystic' and describes his stand in the period's central theological debate as a 'traditional Twelver Shiʿite' separation of God's essence from His attributes; the Persian article calls him a Shi'a marjaʿ and traditionist of the Qom school, and WikiNoor names him one of the Imami scholars of the Safavid era. His life's work was a commentary on the Tawhid of Ibn Babawayh, the Imami traditionist. The texts' own Twelver and Imami wording is followed."
