label: { ar: "حافظ نور الله ⁦(خطاط لكهنؤ)⁩", en: "Hafiz Nurullah (calligrapher of Lucknow)", ur: "حافظ نور اللہ ⁦(لکھنؤ کے خطاط)⁩", es: "Hafiz Nurullah (calligrapher of Lucknow)", fr: "Hafiz Nurullah (calligrapher of Lucknow)" }
summary:
  ar: "أستاذ النستعليق في لكهنؤ في عهد نواب أودھ آصف الدولة وسعادت علي خان، تلميذ عبد الرحيم «فرمان نويس» تلميذ آقا عبد الرشيد، ومات قبل أن يتم «گلستان» سعدي للنواب {cite:salim-tarikh-khatt-o-khattatin-2001 p. 264}."
  en: "Master of nasta'liq at Lucknow under the nawabs of Awadh Asaf al-Dawla and Sa'adat Ali Khan, pupil of Abd al-Rahim 'Farman-navis', himself a pupil of Aqa Abd al-Rashid; he died before finishing a Gulistan of Sa'di for the nawab {cite:salim-tarikh-khatt-o-khattatin-2001 p. 264}."
  ur: "نوابانِ اودھ آصف الدولہ اور سعادت علی خان کے عہد میں لکھنؤ کے استادِ نستعلیق، آقا عبد الرشید کے شاگرد عبد الرحیم فرمان نویس کے شاگرد؛ نواب کے لیے سعدی کی «گلستان» مکمل کرنے سے پہلے فوت ہوئے {cite:salim-tarikh-khatt-o-khattatin-2001 p. 264}۔"
  es: "Maestro de nasta'liq en Lucknow bajo los nawabs de Awadh Asaf al-Dawla y Sa'adat Ali Khan, alumno de Abd al-Rahim 'Farman-navis', él mismo alumno de Aqa Abd al-Rashid; Murió antes de terminar un Gulistan de Sa'di para el nawab {cita:salim-tarikh-khatt-o-khattatin-2001 p. 264}."
  fr: "Maître de nasta'liq à Lucknow sous les nababs d'Awadh Asaf al-Dawla et Sa'adat Ali Khan, élève d'Abd al-Rahim 'Farman-navis', lui-même élève d'Aqa Abd al-Rashid; il est mort avant de terminer un Gulistan de Sa'di pour le nawab {cite:salim-tarikh-khatt-o-khattatin-2001 p. 264}."
  tr: "Awadh Asaf Daula'nın Nawabı ve Saad Ali Khan döneminde Lucknow'da Nastaliq öğretmeniydi; Abdul Rahim 'Farman Nawais'in öğrencisi Agha Abdul Rashid'in öğrencisi idi ve Saadi'nin Nawab için yazdığı 'Gulistan' tamamlanmadan önce vefat etti {cite:salim-tarikh-khatt-o-khattatin-2001, s. 264}."
  id: "Ia adalah guru Nastaliq di Lucknow pada masa pemerintahan Nawab Awadh Asaf Daula dan Saad Ali Khan, murid Abdul Rahim 'Farman Nawais,' murid Agha Abdul Rashid, dan meninggal sebelum 'Gulistan' Saadi untuk Nawab selesai {cite:salim-tarikh-khatt-o-khattatin-2001, hlm. 264}."
