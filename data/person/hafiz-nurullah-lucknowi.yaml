summary:
  ar: "أستاذ النستعليق في لكهنؤ في عهد نواب أودھ آصف الدولة وسعادت علي خان، تلميذ عبد الرحيم «فرمان نويس» تلميذ آقا عبد الرشيد، ومات قبل أن يتم «گلستان» سعدي للنواب {cite:salim-tarikh-khatt-o-khattatin-2001 p. 264}."
  en: "Master of nasta'liq at Lucknow under the nawabs of Awadh Asaf al-Dawla and Sa'adat Ali Khan, pupil of Abd al-Rahim 'Farman-navis', himself a pupil of Aqa Abd al-Rashid; he died before finishing a Gulistan of Sa'di for the nawab {cite:salim-tarikh-khatt-o-khattatin-2001 p. 264}."
  ur: "نوابانِ اودھ آصف الدولہ اور سعادت علی خان کے عہد میں لکھنؤ کے استادِ نستعلیق، آقا عبد الرشید کے شاگرد عبد الرحیم فرمان نویس کے شاگرد؛ نواب کے لیے سعدی کی «گلستان» مکمل کرنے سے پہلے فوت ہوئے {cite:salim-tarikh-khatt-o-khattatin-2001 p. 264}۔"
