  ar: أنصاري أوسي، ابن أخي سعد بن معاذ سيد الأوس؛ ثبت ذكره في حديث صحيح يوم الخندق يحمل مجنّ عمه، وشهد قتل كعب بن الأشرف؛ واختُلف هل استُشهد بأحد.
  en: An Ansari of the Aws, nephew of Sa'd ibn Mu'adh, chief of the Aws. A sound report places him at the Trench carrying his uncle's shield, and he took part in the killing of Ka'b ibn al-Ashraf; whether he was martyred at Uhud is disputed.
