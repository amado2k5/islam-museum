summary:
  ar: "صحفية وصانعة أفلام وثائقية باكستانية كندية، وُلدت في كراتشي سنة 1978. اشتهرت بأفلام تسلّط الضوء على عدم المساواة ضد النساء، وفازت بجائزتي أوسكار عن «إنقاذ وجه» (2012) و«فتاة في النهر: ثمن الغفران» (2016) وبسبع جوائز إيمي، فكانت أول باكستانية تفوز بالأوسكار، ومنحتها حكومة باكستان وسام هلال الامتياز سنة 2012 وأدرجتها مجلة تايم ضمن أكثر مئة شخصية تأثيرًا في العالم في السنة نفسها."
  en: "Pakistani-Canadian journalist and documentary filmmaker, born in Karachi in 1978. She is known for films that highlight inequality against women, won two Academy Awards for Saving Face (2012) and A Girl in the River: The Price of Forgiveness (2016) and seven Emmy Awards, was the first Pakistani to win an Academy Award, received Pakistan's Hilal-i-Imtiaz in 2012, and was named by TIME among the world's 100 most influential people that year."
  ur: "پاکستانی کینیڈین صحافی اور دستاویزی فلم ساز، جو 1978 میں کراچی میں پیدا ہوئیں۔ وہ خواتین کے خلاف عدم مساوات کو اجاگر کرنے والی فلموں کے لیے مشہور ہیں، «Saving Face» (2012) اور «A Girl in the River» (2016) پر دو اکیڈمی ایوارڈ اور سات ایمی ایوارڈ جیتے، آسکر جیتنے والی پہلی پاکستانی بنیں، 2012 میں حکومتِ پاکستان نے انھیں ہلالِ امتیاز دیا اور ٹائم میگزین نے انھیں دنیا کی سو سب سے بااثر شخصیات میں شامل کیا۔"
