summary:
  ar: "عالم وصحفي جزائري (نحو 1890–1961)؛ وُلد بسيدي عقبة وتلقى العلم بالمدينة المنورة ومكة حيث أدار جريدة «القبلة» للشريف حسين، ثم عاد إلى الجزائر 1920 فكان من أبرز دعاة الإصلاح وعضوًا مؤسسًا في جمعية العلماء المسلمين الجزائريين (1931)، واشتهر بمواعظه ومقالاته وفتواه زمن الحرب العالمية الثانية بحماية اليهود."
  en: "Algerian scholar and journalist (about 1890–1961). Born at Sidi Okba, he studied in Medina and Mecca, where Sharif Hussein put him in charge of the newspaper al-Qibla; back in Algeria from 1920 he became a leading reform preacher and a founding member of the Association of Algerian Muslim Ulama (1931), known for his preaching, his journalism and his wartime fatwa protecting Jews."
  ur: "جزائری عالم اور صحافی (تقریباً 1890–1961)؛ سیدی عقبہ میں پیدا ہوئے، مدینہ منورہ اور مکہ میں تعلیم پائی جہاں شریف حسین نے انہیں اخبار «القبلہ» کی ادارت سونپی، پھر 1920 میں جزائر لوٹ کر اصلاحی دعوت کے سرکردہ واعظ اور جمعیۃ العلماء المسلمین الجزائریین (1931) کے بانی ارکان میں سے بنے، اور جنگ عظیم دوم کے دوران یہودیوں کے تحفظ کے فتوے سے مشہور ہوئے۔"
