summary:
  ar: "أبو عثمان أحمد بن محمد بن إسحاق بن يزيد بن عجلان، المقرون تعبده وتقشفه بالبذل والسخاء، ختن ابن رجاء بن صهيب. كانت العبادة عنه مشهورة، والكرم عنه مأثور، وكان كثير الحديث."
  en: "Abu Uthman Ahmad ibn Muhammad ibn Ishaq ibn Yazid ibn Ajlan, whose worship and asceticism were joined to generosity and giving; he was the son-in-law of Ibn Raja' ibn Suhayb; his worship was well known, his generosity was reported, and he transmitted much hadith."
  ur: "ابو عثمان احمد بن محمد بن اسحاق بن یزید بن عجلان، جن کی عبادت اور زہد کے ساتھ سخاوت بھی تھی؛ وہ ابن رجاء بن صہیب کے داماد تھے۔ ان کی عبادت مشہور تھی، ان کی سخاوت منقول تھی، اور وہ بہت حدیثیں بیان کرتے تھے۔"
  es: "Abu Uthman Ahmad ibn Muhammad ibn Ishaq ibn Yazid ibn Ajlan, cuya devoción y ascetismo estaban unidos a la generosidad y la caridad; era yerno de Ibn Raja' ibn Suhayb; su devoción era bien conocida, su generosidad era reconocida y transmitió muchos hadices."
  fr: "Abu Uthman Ahmad ibn Muhammad ibn Ishaq ibn Yazid ibn Ajlan, dont le culte et l'ascétisme étaient associés à la générosité et au don; il était le gendre d'Ibn Raja' ibn Suhayb; son culte était bien connu, sa générosité était rapportée, et il a transmis de nombreux hadiths."
  tr: "Takvası ve zühdü cömertlik ve eli açıklığıyla birleşmiş olan Ebu Osman Ahmed ibn Muhammed ibn İshak ibn Yazid ibn Aclan, İbn Raja' ibn Suhaib'in damadıydı. İbadeti herkesçe biliniyor, cömertliği iyi belgelenmişti ve hadis rivayetinde çok üretken bir kişiydi."
  id: "Abu Uthman Ahmad ibn Muhammad ibn Ishaq ibn Yazid ibn Ajlan, yang kesalehan dan asketismenya dipadukan dengan kemurahan hati dan kedermawanannya, adalah menantu dari Ibn Raja' ibn Suhaib. Ibadahnya terkenal, kemurahan hatinya terdokumentasi dengan baik, dan ia adalah perawi hadits yang produktif."
