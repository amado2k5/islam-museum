  ar: "أبو عثمان أحمد بن محمد بن إسحاق بن يزيد بن عجلان، المقرون تعبده وتقشفه بالبذل والسخاء، ختن ابن رجاء بن صهيب. كانت العبادة عنه مشهورة، والكرم عنه مأثور، وكان كثير الحديث."
  en: "Abu Uthman Ahmad ibn Muhammad ibn Ishaq ibn Yazid ibn Ajlan, whose worship and asceticism were joined to generosity and giving; he was the son-in-law of Ibn Raja' ibn Suhayb; his worship was well known, his generosity was reported, and he transmitted much hadith."
