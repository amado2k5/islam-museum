summary:
  ar: "أياز أمير همذان، أتابك ملكشاه بن بركيارق، أدى دوراً في صراع الأميرين السلجوقيين بركيارق ومحمد الأول، وقُتل غدراً سنة 499هـ ⁦(1105م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 829}."
  en: "Ayaz, lord of Hamadhan and atabeg of Malikshah son of Barkiyaruq, took part in the struggle between the Seljuk princes Barkiyaruq and Muhammad I, and was murdered by Muhammad in 499 AH (1105) {cite:encyclopaedia-of-islam-2 vol. 1 p. 829}."
  es: "Ayaz, señor de Hamadhan y atabeg de Malikshah hijo de Barkiyaruq, tomó parte en la lucha entre los príncipes selyúcidas Barkiyaruq y Muhammad I, y fue asesinado por Muhammad en 499 AH (1105) {cite:encyclopaedia-of-islam-2 vol. 1 p. 829}."
  fr: "Ayaz, seigneur de Hamadhan et atabeg de Malikshah, fils de Barkiyaruq, participa à la lutte entre les princes seldjoukides Barkiyaruq et Muhammad Ier, et fut assassiné par Muhammad en 499 AH (1105) {cite:encyclopaedia-of-islam-2 vol. 1 p. 829}."
  ur: "ایاز، حمادان کے سردار اور ملک شاہ ولد برقیاروق کے عتبیگ نے سلجوقی شہزادوں برقیاروق اور محمد اول کے درمیان لڑائی میں حصہ لیا اور 499 ہجری (1105) میں محمد کے ہاتھوں قتل ہوا۔ 1 ص۔ 829}۔"
  tr: "Hamadan'ın Emiri Ayaz, Atabeg Malikşah ibn Barkiyariq, Selçuklu prensleri Barkiyariq ile Mehmed I arasındaki çatışmada rol oynamış ve 499 Hicri (1105 M.S.) yılında haince öldürülmüştür. {cit:Encyclopaedia-of-Islam-2 cilt 1, s. 829}."
  id: "Ayaz, Emir Hamadan, Atabeg Malikshah ibn Barkiyariq, berperan dalam konflik antara pangeran Seljuk Barkiyariq dan Mehmed I, dan dibunuh secara licik pada tahun 499 H (1105 M) {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 829}."
