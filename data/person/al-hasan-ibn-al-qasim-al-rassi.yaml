summary:
  ar: عم الهادي، كان مع أخيه محمد وأخي الهادي عبد الله حين لقيهم محمد بن عبيد الله بالفرع.
  en: An uncle of al-Hadi, present at al-Fur' with his brother Muhammad when Muhammad ibn Ubaydallah met them.
  ur: ہادی کے چچا، جو فرع میں اپنے بھائی محمد کے ساتھ تھے جب محمد بن عبید اللہ ان سے ملے۔
  es: "Un tío de al-Hadi, presente en al-Fur' con su hermano Muhammad cuando Muhammad ibn Ubaydallah se reunió con ellos."
  fr: "Un oncle d'al-Hadi, présent à al-Fur' avec son frère Muhammad lorsque Muhammad ibn Ubaydallah les rencontra."
  tr: "El-Hadi'nin amcası, Muhammed bin Ubeyd Allah onları El-Fara'da gördüğünde kardeşi Muhammed ve benim kardeşim Abdullah ile birlikteydi."
  id: "Paman Al-Hadi bersama saudaranya Muhammad dan saudara saya Abdullah ketika Muhammad bin Ubayd Allah bertemu mereka di Al-Fara'."
