  ar: "الحسن بن عز الدين بن الحسن، الناصر للدين، من أئمة الزيدية باليمن، دعا لنفسه في حصن كحلان بعد وفاة أبيه سنة 900 هـ، ثم فسخ القضاء إمامته، وتوفي في فللة، له القسطاس المقبول، ⁦(862 - 929 هـ = 1458 - 1523 م)⁩."
