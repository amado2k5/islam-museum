summary:
  ar: "صالح بن مسلم الباهلي أخو قتيبة؛ خلفه على ما وراء النهر ففتح كاسان وأورشت من فرغانة وكان نصر بن سيار معه في جيشه وفتح سخر وأخسكت مدينة فرغانة القديمة."
  en: "Salih ibn Muslim al-Bahili, Qutayba's brother; left beyond the river he took Kasan, Urusht, Sakhr and Akhsikath — Farghana's old city — with Nasr ibn Sayyar in his host."
  es: "Salih ibn Muslim al-Bahili, hermano de Qutayba, dejó el río y tomó Kasan, Urusht, Sakhr y Akhsikath —la ciudad vieja de Farghana— con Nasr ibn Sayyar en su ejército."
  fr: "Salih ibn Muslim al-Bahili, le frère de Qutayba; partit au-delà du fleuve et prit Kasan, Urusht, Sakhr et Akhsikath — la vieille ville de Farghana — avec Nasr ibn Sayyar dans son armée."
  ur: "صالح بن مسلم الباہلی، قتیبہ کے بھائی؛ دریا سے پرے چھوڑ کر وہ کسان، اُرش، صخر اور اخسیکاتھ — فرغانہ کے پرانے شہر — کو اپنے میزبان میں نصر بن سیار کے ساتھ لے گیا۔"
  tr: "Salih bin Müslüm el-Bahili Qutaybah'ın kardeşiydi; nehrin ötesinde, Nasr ibn Sayyar ile birlikte Fergana'dan Kasan ve Ursht'u fethetti; Sakhr ve eski Fergana şehri fethedildi."
  id: "Saleh ibn Muslim al-Bahili adalah saudara Qutaybah; ia menggantikannya di seberang sungai dan menaklukkan Kasan serta Ursht dari Fergana, bersama Nasr ibn Sayyar dalam pasukannya, dan penaklukan Sakhr serta kota kuno Ferghana pun ditaklukkan."
