summary:
  ar: "قُتل في سنة تسع وثمانين ومائتين؛ وذكر الطبري أن القاسم بن عبيد الله خشي أن يقدم بدر على المكتفى فيخبره بما همّ به القاسم من صرف الخلافة عن ولد المعتضد {cite:tabari-tarikh-abu-al-fadl j.10 p.89}. وعند المسعودي هو بدر بن خير من موالي المتوكل وكان في خدمة ناشئ غلام الموفق صاحب ركابه ثم اتصل بالمعتضد وقرب من قلبه حتى كانت تلتمس به الحوائج وكانت الشعراء تقرن مدحه بمدح المعتضد {cite:muruj-al-dhahab p. 636}"
