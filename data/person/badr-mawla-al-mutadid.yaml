id: person/badr-mawla-al-mutadid
class: person
label: { ar: "بدر غلام المعتضد" }
summary:
  ar: "قُتل في سنة تسع وثمانين ومائتين؛ وذكر الطبري أن القاسم بن عبيد الله خشي أن يقدم بدر على المكتفى فيخبره بما همّ به القاسم من صرف الخلافة عن ولد المعتضد {cite:tabari-tarikh-abu-al-fadl j.10 p.89}. وعند المسعودي هو بدر بن خير من موالي المتوكل وكان في خدمة ناشئ غلام الموفق صاحب ركابه ثم اتصل بالمعتضد وقرب من قلبه حتى كانت تلتمس به الحوائج وكانت الشعراء تقرن مدحه بمدح المعتضد {cite:muruj-al-dhahab p. 636}"
  tr: "289 Hicri yılında öldürüldü; el-Taberi, el-Kasım bin Ubeyd Allah'ın, Bedr'in el-Mutafi'nin oğlundan halifeliği saptırma planını bildireceğinden korktuğunu belirtmiştir {atıf:tabari-tarikh-abu-al-fadl j.10 s.89}. El-Mes'udi'ye göre, o, el-Muvaakkil'in özgür bırakılanlarından biri olan Badr ibn Hayr'dı ve el-Muvafık'ın genç oğluna, yani onun atının yoldaşına hizmet etti. Sonra el-Mu'tadid ile bağlantı kurdu ve kalbine yaklaştı, böylece onun ihtiyaçlarını aradı; şairler onun övgüsünü al-Mu'tadid övgüsleriyle birleştirdiler {atıf:Muruj-al-Dhahab, s. 636}"
  id: "Ia dibunuh pada tahun 289 H; al-Tabari menyebutkan bahwa al-Qasim ibn Ubayd Allah takut Badr akan datang ke hadapan al-Muktafi dan memberitahunya tentang rencana al-Qasim untuk mengalihkan kekhalifahan dari putra al-Mu'tadid {cite:tabari-tarikh-abu-al-fadl j.10 hlm.89}. Menurut al-Mas'udi, ia adalah Badr ibn Khayr, salah satu mantan al-Mutawakkil, yang melayani putra muda al-Muwaffaq, sahabat tunggangannya. Kemudian ia berhubungan dengan al-Mu'tadid dan mendekati hatinya sehingga ia mencari kebutuhannya, dan para penyair menggabungkan pujiannya dengan pujian kepada al-Mu'tadid {cite:Muruj-al-Dhahab, hlm. 636}"
