class: person
label: { ar: "طلحة بن عبد الله بن خلف الخزاعي", en: "Talha ibn Abdallah ibn Khalaf al-Khuza'i", es: "Talha ibn Abdallah ibn Khalaf al-Khuza'i", fr: "Talha ibn Abdallah ibn Khalaf al-Khuza'i", ur: "طلحہ بن عبداللہ بن خلف الخزاعی" }
summary:
  ar: "طلحة بن عبد الله بن خلف الخزاعي الذي يعرف بطلحة الطلحات؛ بعثه سلم بن زياد ففدى أبا عبيدة بن زياد من أسر كابل بخمسمائة ألف درهم وسار من كابل إلى سجستان والياً عليها من قبل سلم فجبى وأعطى زواره ومات بسجستان."
  en: "Talha ibn Abdallah ibn Khalaf al-Khuza'i — Talhat al-Talhat; sent by Salm ibn Ziyad, he ransomed Abu Ubayda ibn Ziyad from Kabul's captivity for five hundred thousand dirhams, then governed Sijistan for Salm, levying and rewarding his followers until he died there."
  es: "Talha ibn Abdallah ibn Khalaf al-Khuza'i — Talhat al-Talhat; enviado por Salm ibn Ziyad, rescató a Abu Ubayda ibn Ziyad del cautiverio de Kabul por quinientos mil dirhams, luego gobernó Sijistan para Salm, recaudando impuestos y recompensando a sus seguidores hasta que murió allí."
  fr: "Talha ibn Abdallah ibn Khalaf al-Khuza'i — Talhat al-Talhat; envoyé par Salm ibn Ziyad, il racheta Abu Ubayda ibn Ziyad de la captivité de Kaboul pour cinq cent mille dirhams, puis gouverna le Sijistan pour Salm, levant et récompensant ses partisans jusqu'à sa mort là-bas."
  ur: "طلحہ بن عبداللہ ابن خلف الخزاعی - طلعت الطلحات؛ سالم ابن زیاد کی طرف سے بھیجا گیا، اس نے ابو عبیدہ ابن زیاد کو کابل کی قید سے پانچ لاکھ درہم کے عوض فدیہ دیا، پھر سلم کے بدلے سجستان پر حکومت کی، اپنے پیروکاروں پر ٹیکس لگاتے اور انعام دیتے رہے یہاں تک کہ وہ وہاں مر گیا۔"
  tr: "Talha ibn Abdullah ibn Khalaf al-Khuza'i, Talha al-Talhat olarak bilinir, Salm ibn Ziyad tarafından gönderildi; Salm, Kabil'deki esirlerden Ebu Ubeyde ibn Ziyad'ı beş yüz bin dirhem ile fidye etti. Kabil'den Sijaistan'a vali olarak Salim'den önce yürüdü, onu topladı, ziyaretçilerine verdi ve Sijistan'da öldü."
  id: "Talha ibn Abdullah ibn Khalaf al-Khuza'i, yang dikenal sebagai Talha al-Talhat, dikirim oleh Salm ibn Ziyad, yang menebus Abu Ubaidah ibn Ziyad dari tawanan Kabul dengan lima ratus ribu dirham. Ia berbaris dari Kabul ke Sijistan sebagai gubernurnya di hadapan Salim, mengambilnya, memberikannya kepada para tamunya, dan meninggal di Sijistan."
