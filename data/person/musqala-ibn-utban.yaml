id: person/musqala-ibn-utban
class: person
label: { ar: "مصقلة بن عتبان الشيباني", en: "Musqala ibn 'Utban", es: "Musqala ibn 'Utban", fr: "Musqala ibn 'Utban", ur: "مسقلہ بن عتبان" }
summary:
  ar: "من غلبة الخوارج وشعرائهم، فيه قال وأبلغ أمير المؤمنين رسالة فإنك إن لا ترض بكر بن وائل يكن لك يوم بالعراق عصيب فمنا سويد والبطين وقعنب ومنا أمير المؤمنين شبيب، غزالة ذات النذر منا حميدة لها في سهام المسلمين نصيب، ولا صلح ما دامت منابر أرضنا يقوم عليها من ثقيف خطيب {cite:muruj-al-dhahab p. 182-183}."
  en: "The Kharijite strongman-poet whose defiance rostered Shayban's champions — Shabib the 'Commander of the Faithful' and vow-keeping Ghazala, 'no peace while a Thaqafi mounts our minbars' {cite:muruj-al-dhahab p. 182-183}."
  es: "El caudillo-poeta jariyí cuya rebeldía reunió a los campeones de Shayban: Shabib, el 'Comandante de los Creyentes', y Ghazala, que cumple sus votos, 'no habrá paz mientras un Thaqafi suba a nuestros minbars' {cite:muruj-al-dhahab p. 182-183}."
  fr: "Le poète-homme fort kharijite dont la rébellion a rallié les champions de Shayban — Shabib le « Commandeur des Fidèles » et Ghazala, fidèle à ses vœux, « pas de paix tant qu'un Thaqafi monte sur nos minbars » {cite: muruj-al-dhahab p. 182-183}."
  ur: "خوارجی طاقتور شاعر جس کی نافرمانی نے شیبان کے چیمپئنز - شبیب 'وفاداروں کا کمانڈر' اور غزالہ کا عہد کرنے والا، 'سکون نہیں جب تک کہ ایک ثقفی ہمارے منبر پر چڑھ جائے' {حوالہ: مروج الذہب صفحہ 182-183}۔"
  tr: "Haricilerin ve şairlerinin hakimiyetinden, Müminlerin Komutanı'na şöyle bir mesaj iletti: Eğer Bakr ibn Wa'il'den memnun değilsen, Irak'ta zor bir gün geçireceksin. Aramızda Suwayd, Al-Bateen, Qa'nab ve aramızda Müminlerin Komutanı Şabil var. Bizden yemin etmiş bir ceylan övgüye değerdir, Müslümanların oklarında pay sahibi ve topraklarımızın kürsüleri Thaqif ve hatip tarafından inşa edildiği sürece barış olmaz {cite:muruj-al-dhahab, s. 182-183}."
  id: "Dari dominasi Kharijit dan para penyair mereka, di mana ia berkata dan menyampaikan pesan kepada Panglima Orang Beriman: Jika kamu tidak senang dengan Bakr ibn Wa'il, kamu akan mengalami hari yang sulit di Irak. Di antara kami adalah Suwayd, Al-Bateen, Qa'nab, dan di antara kami Panglima Orang Beriman, Shabib. Seekor gazel dengan sumpah dari kami patut dipuji, dia berperan dalam panah umat Muslim, dan tidak ada perdamaian selama mimbar tanah kami dibangun di atasnya oleh Thaqif dan orator {cite:muruj-al-dhahab, hlm. 182-183}."
