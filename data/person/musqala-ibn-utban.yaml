summary:
  ar: "من غلبة الخوارج وشعرائهم، فيه قال وأبلغ أمير المؤمنين رسالة فإنك إن لا ترض بكر بن وائل يكن لك يوم بالعراق عصيب فمنا سويد والبطين وقعنب ومنا أمير المؤمنين شبيب، غزالة ذات النذر منا حميدة لها في سهام المسلمين نصيب، ولا صلح ما دامت منابر أرضنا يقوم عليها من ثقيف خطيب {cite:muruj-al-dhahab p. 182-183}."
  en: "The Kharijite strongman-poet whose defiance rostered Shayban's champions — Shabib the 'Commander of the Faithful' and vow-keeping Ghazala, 'no peace while a Thaqafi mounts our minbars' {cite:muruj-al-dhahab p. 182-183}."
