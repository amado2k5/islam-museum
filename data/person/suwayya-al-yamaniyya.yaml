summary:
  ar: "عابدة من أهل اليمن يذكرها ابن الجوزي في «صفة الصفوة» برواية أبي هشام القرشي العامري: نزلت في بعض رباعهم بمكة، وكان يُسمع لها بالليل نحيب، فبعث جاريته فسمعتها تناجي ربها معترفة بنعمه وبتقصيرها، ثم صرخت وسقطت، ووجدوها ميتة في الصباح."
  en: "A devout woman of Yemen whom Ibn al-Jawzi includes in Sifat al-Safwa on the report of Abu Hisham, a Qurashi of Banu Amir: she lodged in one of their houses, sobbing was heard from her at night, his maid listened and heard her confessing God's favours and her own failings, then she cried out and fell, and in the morning they found her dead."
