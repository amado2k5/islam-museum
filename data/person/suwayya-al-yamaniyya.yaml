summary:
  ar: "عابدة من أهل اليمن يذكرها ابن الجوزي في «صفة الصفوة» برواية أبي هشام القرشي العامري: نزلت في بعض رباعهم بمكة، وكان يُسمع لها بالليل نحيب، فبعث جاريته فسمعتها تناجي ربها معترفة بنعمه وبتقصيرها، ثم صرخت وسقطت، ووجدوها ميتة في الصباح."
  en: "A devout woman of Yemen whom Ibn al-Jawzi includes in Sifat al-Safwa on the report of Abu Hisham, a Qurashi of Banu Amir: she lodged in one of their houses, sobbing was heard from her at night, his maid listened and heard her confessing God's favours and her own failings, then she cried out and fell, and in the morning they found her dead."
  es: "Una mujer devota de Yemen, a quien Ibn al-Jawzi incluye en Sifat al-Safwa según el relato de Abu Hisham, un Qurashi de Banu Amir: se hospedó en una de sus casas, se oyeron sollozos de ella por la noche, su criada la escuchó y oyó confesar los favores de Dios y sus propias faltas, luego gritó y cayó, y por la mañana la encontraron muerta."
  fr: "Une femme pieuse du Yémen, qu'Ibn al-Jawzi inclut dans Sifat al-Safwa d'après le récit d'Abu Hisham, un Qurashi de Banu Amir: elle logeait dans l'une de leurs maisons; on l'entendit sangloter la nuit; sa servante écouta et l'entendit confesser les faveurs de Dieu et ses propres manquements, puis elle cria et tomba, et au matin on la trouva morte."
  ur: "یمن کی ایک پرہیزگار عورت جسے ابن الجوزی نے بنو عامر کے ایک قریشی ابو ہشام کی روایت پر سیفۃ الصفوی میں شامل کیا ہے: وہ ان کے ایک گھر میں ٹھہری ہوئی تھی، رات کو اس سے رونے کی آوازیں آتی تھیں، اس کی لونڈی نے سنا اور اسے خدا کے احسانات اور اپنی ناکامیوں کا اقرار کرتے ہوئے سنا، پھر صبح کو وہ مردہ ہو کر گر پڑی۔"
