summary:
  ar: "مشعل الأحمد الجابر الصباح (وُلد 27 سبتمبر 1940) أمير الكويت منذ 16 ديسمبر 2023، خلفًا لأخيه غير الشقيق نواف الأحمد. رجل أمن قضى مسيرته في وزارة الداخلية وجهاز مباحث أمن الدولة الذي رأسه 1967–1980، ثم نائبًا لرئيس الحرس الوطني من 2004، ووليًا للعهد من 2020 وهو في الثمانين. في 2024 حلّ مجلس الأمة مرتين وعلّق العمل ببعض مواد الدستور لمدة تصل إلى أربع سنوات، وعيّن صباح الخالد الصباح وليًا للعهد."
  en: "Mishal Al-Ahmad Al-Jaber Al-Sabah (born 27 September 1940) is Emir of Kuwait since 16 December 2023, succeeding his half-brother Nawaf Al-Ahmad. A security man, he spent his career in the Ministry of Interior and the state security service he headed from 1967 to 1980, then as deputy chief of the National Guard from 2004, and crown prince from 2020, in his eighties. In 2024 he twice dissolved the National Assembly, suspended selected articles of the constitution for up to four years, and appointed Sabah Al-Khalid Al-Sabah crown prince."
  ur: "مشعل الاحمد الجابر الصباح (پیدائش 27 ستمبر 1940ء) 16 دسمبر 2023ء سے کویت کے امیر ہیں اور اپنے سوتیلے بھائی نواف الاحمد کے جانشین بنے۔ سکیورٹی شعبے سے وابستہ رہے: وزارتِ داخلہ اور ریاستی سلامتی سروس کے سربراہ (1967ء تا 1980ء)، پھر نیشنل گارڈ کے نائب سربراہ اور 2020ء سے ولی عہد رہے۔ 2024ء میں انہوں نے قومی اسمبلی دو بار تحلیل کی اور آئین کی بعض دفعات معطل کر دیں۔"
