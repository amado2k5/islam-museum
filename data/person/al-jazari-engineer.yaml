summary:
  ar: "مهندس ومؤلف في الحيل، تصفه TDV عالماً إسلامياً وتذكر خدمته للأرتقيين بآمد بين 1181 و1206م وكتابه المؤلف بطلب ناصر الدين محمود، الذي تؤرخ إتمامه بسنة 1205م {cite:tdv-cezeri pp. 505–506}. ومن آلات الكتاب ساعة الفيل التي تحفظ ورقة متأخرة منها في المتروبوليتان، مؤرخة 715هـ/1315م، وليست آلة باقية من حياته {cite:met-elephant-clock-575123 Catalogue Entry}."
  en: "An engineer and author on mechanical devices, identified by TDV as an Islamic scholar serving the Artuqids at Amid in 1181–1206. His book, commissioned by Nasir al-Din Mahmud, is dated there to completion in 1205 {cite:tdv-cezeri pp. 505–506}. Its elephant clock survives in a later manuscript folio at the Met, dated 715/1315, not an original working machine {cite:met-elephant-clock-575123 Catalogue Entry}."
  ur: "میکانکی حیلوں کے انجینئر اور مصنف؛ ٹی ڈی وی انہیں اسلامی عالم، 1181–1206ء میں آمد کے ارتقی دربار سے وابستہ بتاتا اور ناصر الدین محمود کی فرمائش پر لکھی کتاب کی تکمیل 1205ء دیتا ہے {cite:tdv-cezeri pp. 505–506}۔ ہاتھی کی گھڑی اسی کتاب میں ہے؛ میٹ کا 715ھ/1315ء کا ورق بعد کی نقل ہے، ان کی اصل چلتی مشین نہیں {cite:met-elephant-clock-575123 Catalogue Entry}۔"
