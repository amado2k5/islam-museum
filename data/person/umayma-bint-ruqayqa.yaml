summary:
  ar: "أميمة بنت رقيقة بنت عبد الله بن بجاد بن عمير بن الحارث، لها صحبة، روت عن النبي وعن أزواج النبي، وروى عنها محمد بن المنكدر، وروت حديث المبايعة بالنساء وقول النبي إني لا أصافح النساء وإنما قولي لامرأة كقولي لمائة امرأة. (؟ - ؟). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13351}"
  en: "Umayma bint Ruqayqa bint Abd Allah ibn Bijad ibn Umayr ibn al-Harith, a Companion. She narrated from the Prophet and from his wives, and Muhammad ibn al-Munkadir narrated from her. She transmitted the report of the women's pledge, in which the Prophet said he does not shake hands with women and that his word to one woman is his word to a hundred. Dates not given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13351}"
