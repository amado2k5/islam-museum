summary:
  ar: "الشيخ الزاهد الكبير؛ كان زاهداً عابداً قدوة صاحب حال وكشف وكرامات وله زاوية وأتباع؛ ولد بمشهد صفين ثم انتقل إلى بالس ونشأ بها وروى عن يحيى الثقفي؛ توفي في سلخ رجب ببلاد حلب ثم نقل تابوته ودفن بجبل قاسيون في أول سنة سبعين وقبره ظاهر يزار قاله الذهبي؛ وقال غيره كان شافعي المذهب أشعري العقيدة؛ وقد ألف حفيده الشيخ محمد بن عمر بن الشيخ أبي بكر في مناقبه مؤلفاً حسناً {cite:shadharat-dhahab p. 303-304}."
  en: "The great ascetic of Balis (b. 584) — a guide with kashf and a zawiya and following; he died end of Rajab 658 in Aleppo's lands and his coffin was carried to Mount Qasyun in 670 where his tomb is still visited; his grandson wrote his manaqib {cite:shadharat-dhahab p. 303-304}."
  fr: "Le grand ascète de Balis (né en 584) — guide doué de kashf, avec une zawiya et des disciples ; il mourut fin Rajab 658 dans la région d'Alep et son cercueil fut porté au mont Qasyun en 670, où sa tombe est encore visitée ; son petit-fils écrivit ses manaqib {cite:shadharat-dhahab p. 303-304}."
  es: "El gran asceta de Balis (n. 584), guía con kashf y zawiya y seguidores; murió a finales de Rajab 658 en tierras de Alepo y su ataúd fue llevado al monte Qasyun en 670, donde su tumba todavía se visita; su nieto escribió su manaqib {cite:shadharat-dhahab p. 303-304}."
  ur: "بالس کا عظیم سنیاسی ⁦(متوفی 584)⁩ - کشف اور زاویہ اور پیروی کے ساتھ رہنما؛ وہ رجب 658 کے آخر میں حلب کی سرزمین میں فوت ہوا اور اس کا تابوت 670 میں کوہ قصیون پر لے جایا گیا جہاں ان کی قبر اب بھی دیکھی جاتی ہے۔ ان کے پوتے نے اپنا مناقب لکھا۔ 303-304}۔"
  tr: "Büyük münzevi şeyh; münzevi, ibadet eden, örnek, manevi hallere, vahiylere ve mucizelere sahip bir insandı. Bir zaviyesi (Sufi tekkesi) ve takipçileri vardı. Meşhed Siffin'de doğdu, sonra Balis'e taşındı ve orada büyüdü. Yahya el-Sakafi'den rivayet etti. Receb ayının sonunda Halep topraklarında vefat etti. Sonra tabutu taşındı ve yetmişinci yılın başında Kasiye Dağı'na defnedildi. El-Dhahabi'nin dediği gibi, mezarı görülebilir ve ziyaret edilir. Başkaları onun fıkıhta Şafiî, inançta ise Eş'ari olduğunu söyler. Torunu Şeyh Muhammed bin Ömer bin Şeyh Ebu Bekir, onun faziletleri hakkında güzel bir kitap yazdı. {cite:şadharat-dhahab s. 303-304}"
  id: "Syekh pertapa agung itu; beliau adalah seorang pertapa, seorang penyembah, seorang teladan, seorang manusia dengan keadaan spiritual, wahyu, dan mukjizat. Beliau memiliki zawiya (perkumpulan Sufi) dan pengikut. Beliau lahir di Mashhad Siffin, kemudian pindah ke Balis dan dibesarkan di sana. Beliau meriwayatkan dari Yahya al-Thaqafi. Beliau wafat pada akhir bulan Rajab di tanah Aleppo. Kemudian peti jenazahnya dipindahkan dan beliau dimakamkan di Gunung Qasiun pada awal tahun tujuh puluh. Makamnya terlihat dan dikunjungi, sebagaimana dikatakan oleh al-Dhahabi. Yang lain mengatakan bahwa beliau adalah seorang Syafi'i dalam fiqih dan seorang Asy'ari dalam akidah. Cucunya, Syekh Muhammad bin Omar bin Syekh Abi Bakr, menulis sebuah buku yang bagus tentang keutamaannya. {cite:shadharat-dhahab hlm. 303-304}"
