summary:
  ar: "الشيخ الزاهد الكبير؛ كان زاهداً عابداً قدوة صاحب حال وكشف وكرامات وله زاوية وأتباع؛ ولد بمشهد صفين ثم انتقل إلى بالس ونشأ بها وروى عن يحيى الثقفي؛ توفي في سلخ رجب ببلاد حلب ثم نقل تابوته ودفن بجبل قاسيون في أول سنة سبعين وقبره ظاهر يزار قاله الذهبي؛ وقال غيره كان شافعي المذهب أشعري العقيدة؛ وقد ألف حفيده الشيخ محمد بن عمر بن الشيخ أبي بكر في مناقبه مؤلفاً حسناً {cite:shadharat-dhahab p. 303-304}."
  en: "The great ascetic of Balis (b. 584) — a guide with kashf and a zawiya and following; he died end of Rajab 658 in Aleppo's lands and his coffin was carried to Mount Qasyun in 670 where his tomb is still visited; his grandson wrote his manaqib {cite:shadharat-dhahab p. 303-304}."
