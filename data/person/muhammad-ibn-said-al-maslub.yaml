summary:
  ar: "محمد بن سعيد المصلوب، شامي من أهل دمشق من أصحاب مكحول، روى عن الزهري وعبادة بن نسي. يصفه الذهبي في «ميزان الاعتدال» بأنه هالك اتُّهم بالزندقة فصُلب، ونقل عن عبد الله بن أحمد عن أبيه أن أبا جعفر المنصور صلبه على الزندقة، وعن أبي زرعة الدمشقي أنه كان يقول: لا بأس إذا كان كلاماً حسناً أن تضع له إسناداً. وعدّه النسائي في الكذابين المعروفين بوضع الحديث، وغيّر الرواة اسمه على وجوه كثيرة ستراً له، حتى قال ابن سوادة إنهم قلبوا اسمه على مائة اسم وزيادة {cite:mizan-itidal-bijawi-v3 p. 561-563}."
  en: "Muhammad ibn Sa'id al-Maslub ('the crucified'), a Syrian of Damascus and companion of Makhul, who narrated from al-Zuhri and Ubada ibn Nusayy. Al-Dhahabi's Mizan al-I'tidal calls him ruined, accused of heresy and crucified; it reports through Abd Allah ibn Ahmad that Abu Ja'far al-Mansur crucified him for zandaqa, and through Abu Zur'a al-Dimashqi that he used to say there was no harm in making up a chain for a fine saying. Al-Nasa'i counted him among the liars known for forging hadith, and transmitters disguised his name in many ways, so that Ibn Sawada said they turned it into more than a hundred names."
  es: "Muhammad ibn Sa'id al-Maslub («el crucificado»), un sirio de Damasco y compañero de Makhul, narró de al-Zuhri y Ubada ibn Nusayy. El Mizan al-I'tidal de Al-Dhahabi lo llama arruinado, acusado de herejía y crucificado; relata a través de Abd Allah ibn Ahmad que Abu Ja'far al-Mansur lo crucificó por zandaqa, y a través de Abu Zur'a al-Dimashqi que solía decir que no había nada de malo en inventar una cadena de transmisión para un buen dicho. Al-Nasa'i lo incluyó entre los mentirosos conocidos por falsificar hadices, y los transmisores disfrazaron su nombre de muchas maneras, de modo que Ibn Sawada dijo que lo convirtieron en más de cien nombres."
  fr: "Muhammad ibn Sa'id al-Maslub (« le crucifié »), Syrien de Damas et compagnon de Makhul, rapporta des hadiths d'après al-Zuhri et Ubada ibn Nusayy. Le Mizan al-I'tidal d'al-Dhahabi le décrit comme ruiné, accusé d'hérésie et crucifié. Il rapporte, par l'intermédiaire d'Abd Allah ibn Ahmad, qu'Abu Ja'far al-Mansur le crucifia pour aumône illégale (zandaqa), et par l'intermédiaire d'Abu Zur'a al-Dimashqi, qu'il affirmait qu'il n'y avait pas de mal à inventer une chaîne de transmission pour une parole de valeur. Al-Nasa'i le comptait parmi les menteurs réputés pour avoir forgé des hadiths, et les transmetteurs dissimulèrent son nom de multiples façons, si bien qu'Ibn Sawada rapporta qu'ils lui donnèrent plus d'une centaine de noms."
  ur: "محمد بن سعید المصلب ⁦('صلیب')⁩، دمشق کا ایک شامی اور مکول کا ساتھی، جس نے الزہری اور عبادہ بن نصی سے روایت کی ہے۔ الذہبی کا میزان الاعتدال اسے برباد، بدعت کا الزام اور مصلوب کہتا ہے۔ عبد اللہ بن احمد سے روایت ہے کہ ابو جعفر المنصور نے اسے زندقہ کی وجہ سے سولی پر چڑھایا، اور ابو زرعہ دمشقی کے ذریعے سے کہ وہ کہتے تھے کہ نفلی قول پر زنجیر بنانے میں کوئی حرج نہیں۔ النسائی نے ان کا شمار ان جھوٹوں میں کیا جو حدیثیں جعل کرنے کے لیے مشہور ہیں، اور نقل کرنے والوں نے اس کا نام کئی طریقوں سے چھپا لیا، اس لیے ابن سویدہ نے کہا کہ انھوں نے اسے سو سے زیادہ ناموں میں بدل دیا۔"
  tr: "Şamlı ve Makhul halkından olan Muhammed ibn Sa'id al-Maslub, al-Zuhri ve Ubadah ibn Nasi'den rivayet etmiştir. Al-Dhahabi onu 'Mizan al-I'tidal'da sapkınlıkla suçlanan ve çarmıha gerilmiş bir bozulma yaşayan biri olarak tanımlar. Abdullah ibn Ahmad'dan babasından Ebu Ca'fer el-Mansur'un onu sapkınlıkla çarmıha gerdiğini ve Ebu Zur'ah el-Dimashqi'den şöyle derdi: 'İyi bir konuşma varsa bir aktarım zinciri verilmelidir.' El-Nasa'i onu hadis uydurduğu bilinen yalancılar arasında saydı ve diğer rivayetçiler adını örtbas etmek için birçok şekilde kullandılar; öyle ki İbn Suvadah, adını yüzlerce isme ve daha fazlasına çevirdiklerini söyledi {cite:mizan-itidal-bijawi-v3, s. 561-563}."
  id: "Muhammad ibn Sa'id al-Maslub, seorang Levantine dari Damaskus dan di antara masyarakat Makhul, menceritakan dari al-Zuhri dan Ubadah ibn Nasi. Al-Dhahabi menggambarkannya dalam 'Mizan al-I'tidal' sebagai seorang yang mudah rusak yang dituduh sesat dan disalib. Ia melaporkan dari Abdullah ibn Ahmad dari ayahnya bahwa Abu Ja'far al-Mansur menyalibkannya dengan ajaran sesat, dan dari Abu Zur'ah al-Dimashqi yang biasa ia katakan: 'Diperbolehkan jika berbicara baik diberikan rantai transmisi.' Al-Nasa'i menganggapnya sebagai salah satu pembohong yang dikenal karena memalsukan hadits, dan narator lain mempertimbangkan namanya dengan berbagai cara untuk menutupinya, sampai-sampai Ibn Suwadah mengatakan namanya diubah menjadi seratus nama dan lebih {cite:mizan-itidal-bijawi-v3, hlm. 561-563}."
