summary:
  ar: "محمد بن سعيد المصلوب، شامي من أهل دمشق من أصحاب مكحول، روى عن الزهري وعبادة بن نسي. يصفه الذهبي في «ميزان الاعتدال» بأنه هالك اتُّهم بالزندقة فصُلب، ونقل عن عبد الله بن أحمد عن أبيه أن أبا جعفر المنصور صلبه على الزندقة، وعن أبي زرعة الدمشقي أنه كان يقول: لا بأس إذا كان كلاماً حسناً أن تضع له إسناداً. وعدّه النسائي في الكذابين المعروفين بوضع الحديث، وغيّر الرواة اسمه على وجوه كثيرة ستراً له، حتى قال ابن سوادة إنهم قلبوا اسمه على مائة اسم وزيادة {cite:mizan-itidal-bijawi-v3 p. 561-563}."
  en: "Muhammad ibn Sa'id al-Maslub ('the crucified'), a Syrian of Damascus and companion of Makhul, who narrated from al-Zuhri and Ubada ibn Nusayy. Al-Dhahabi's Mizan al-I'tidal calls him ruined, accused of heresy and crucified; it reports through Abd Allah ibn Ahmad that Abu Ja'far al-Mansur crucified him for zandaqa, and through Abu Zur'a al-Dimashqi that he used to say there was no harm in making up a chain for a fine saying. Al-Nasa'i counted him among the liars known for forging hadith, and transmitters disguised his name in many ways, so that Ibn Sawada said they turned it into more than a hundred names."
