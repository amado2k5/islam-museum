      en: "Al-Thawri and Ahmad: a liar, and Ahmad: he forged hadith deliberately; al-Nasa'i: neither trustworthy nor reliable, one of the known forgers; Abu Ahmad al-Hakim: he forged hadith; al-Daraqutni: abandoned; Ahmad: Abu Ja'far crucified him for heresy."
