summary:
  ar: "محمد بن محمد بن مصطفى بن عثمان، أبو سعيد الخادمي، فقيه أصولي حنفي أصله من بخارى، ولد وتوفي في قرية خادم من توابع قونية، واشتهر بدرس التفسير في أياصوفية، من كتبه مجمع الحقائق والبريقة المحمودية."
  en: "Muhammad ibn Muhammad ibn Mustafa ibn Uthman, Abu Sa'id al-Khadimi, a Hanafi jurist of the principles of jurisprudence whose family came from Bukhara; born and died in the village of Khadim near Konya; known for a lesson on tafsir at Hagia Sophia; author of Majami' al-Haqa'iq and al-Bariqa al-Mahmudiyya. Al-Zirikli prints 1113-1176 AH (1701-1763)."
  fr: "Muhammad ibn Muhammad ibn Mustafa ibn Uthman, Abu Sa'id al-Khadimi, juriste hanafite spécialiste des fondements du droit, dont la famille venait de Boukhara ; né et mort au village de Khadim près de Konya ; connu pour une leçon de tafsir à Sainte-Sophie ; auteur des Majami' al-Haqa'iq et d'al-Bariqa al-Mahmudiyya. Al-Zirikli imprime 1113-1176 H (1701-1763)."
  es: "Muhammad ibn Muhammad ibn Mustafa ibn Uthman, Abu Sa'id al-Khadimi, jurista hanafí de los principios de la jurisprudencia, cuya familia procedía de Bujará; nació y murió en la aldea de Khadim, cerca de Konya; conocido por una lección sobre tafsir en Santa Sofía; autor de Majami' al-Haqa'iq y al-Bariqa al-Mahmudiyya. Al-Zirikli imprime entre 1113 y 1176 AH (1701-1763)."
  ur: "محمد بن محمد بن مصطفیٰ ابن عثمان، ابو سعید الخادیمی، اصول فقہ کے حنفی فقیہ جن کا خاندان بخارا سے آیا تھا۔ قونیہ کے قریب خادم نامی گاؤں میں پیدا ہوا اور وفات پائی۔ ہاگیہ صوفیہ میں تفسیر پر ایک سبق کے لیے جانا جاتا ہے۔ مجمع الحقائق اور الباریقہ المحمودیہ کے مصنف۔ الزرکلی 1113-1176ھ (1701-1763) پرنٹ کرتا ہے۔"
