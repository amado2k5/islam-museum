summary:
  ar: "محمد بن محمد بن مصطفى بن عثمان، أبو سعيد الخادمي، فقيه أصولي حنفي أصله من بخارى، ولد وتوفي في قرية خادم من توابع قونية، واشتهر بدرس التفسير في أياصوفية، من كتبه مجمع الحقائق والبريقة المحمودية."
  en: "Muhammad ibn Muhammad ibn Mustafa ibn Uthman, Abu Sa'id al-Khadimi, a Hanafi jurist of the principles of jurisprudence whose family came from Bukhara; born and died in the village of Khadim near Konya; known for a lesson on tafsir at Hagia Sophia; author of Majami' al-Haqa'iq and al-Bariqa al-Mahmudiyya. Al-Zirikli prints 1113-1176 AH (1701-1763)."
