summary:
  ar: "أبو رفاعة عمارة بن وثيمة بن الفرات؛ حدث عن أبي صالح كاتب الليث بن سعد وعن أبيه وثيمة وغيرهما وصنف تاريخاً على السنين وحدث به؛ ومولده بمصر {cite:wafayat-ayan}."
  en: "Abu Rifa'a Umara b. Wathima b. al-Furat — Egyptian chronicler; transmitted from Ibn Lahi'a's katib and from his father, and composed an annalistic history; the continuation that survives under his name makes him one of the earliest Muslim annalists {cite:wafayat-ayan}."
  fr: "Abu Rifa'a Umara b. Wathima b. al-Furat — chroniqueur égyptien ; il transmit du katib d'Ibn Lahi'a et de son père, et composa une histoire annalistique ; la continuation qui survit sous son nom fait de lui l'un des premiers annalistes musulmans {cite:wafayat-ayan}."
  es: "Abu Rifa'a Umara b. Wathima b. al-Furat — Cronista egipcio; transmitido del katib de Ibn Lahi'a y de su padre, y compuso una historia analística; la continuación que sobrevive bajo su nombre lo convierte en uno de los primeros analistas musulmanes {cite:wafayat-ayan}."
  ur: "ابو رفاعہ عمارہ بی۔ وتھیما بی۔ الفورات - مصری تاریخ نگار؛ ابن لہیہ کے کاتب سے اور ان کے والد سے نقل کیا اور ایک تجزیاتی تاریخ لکھی۔ ان کے نام کے تحت زندہ رہنے والا تسلسل انہیں ابتدائی مسلم تجزیہ نگاروں میں سے ایک بناتا ہے۔"
  tr: "Ebu Rifa’ah Ammarah ibn Wathima ibn al-Furat; el-Layth ibn Sa’d’ın kâtibi Ebu Salih’ten, babası Wathima’dan ve diğerlerinden rivayet etmiş ve yıl yıl bir tarih derleyip nakletmiştir; Mısır’da doğmuştur. {cite:wafayat-ayan}"
  id: "Abu Rifa’ah Ammarah ibn Wathima ibn al-Furat; ia meriwayatkan berdasarkan otoritas Abu Salih, juru tulis al-Layth ibn Sa’d, dan berdasarkan otoritas ayahnya Wathima dan lainnya, dan ia menyusun sejarah berdasarkan tahun dan meriwayatkannya; dan ia lahir di Mesir {cite:wafayat-ayan}."
