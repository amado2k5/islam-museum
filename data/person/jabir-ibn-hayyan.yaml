class: person
label: { ar: "جابر بن حيان", en: "Jabir Ibn Hayyan", es: "Jabir Ibn Hayyan", fr: "Jabir Ibn Hayyan", ur: "جابر ابن حیان" }
summary:
  ar: "أبو عبد الله جابر بن حيان بن عبد الله السكوفي المعروف بالصوفي، اختلف الناس في أمره: قالت الشيعة إنه من كبارهم وأحد الأبواب وزعموا أنه كان صاحب جعفر الصادق وكان من أهل الكوفة، وزعم قوم من الفلاسفة أنه كان منهم وله في المنطق والفلسفة مصنفات، وزعم أهل صناعة الذهب والفضة أن الرياسة انتهت إليه في عصره وأن أمره كان مكتوما وأنه كان يتنقل في البلدان خوفا من السلطان، وقيل إنه كان في جملة البرامكة متحققا بجعفر بن يحيى فمن زعم هذا قال إنه عنى بسيده جعفر البرمكي وقالت الشيعة إنما عنى جعفر الصادق، وحدث ابن النديم بعض الثقات أنه كان ينزل بشارع باب الشام في درب الذهب وأن أكثر مقامه بالكوفة وبها كان يدبر الإكسير لصحة هوائها، ولما أصيب بالكوفة الإزج الذي وجد فيه هاون ذهب نحو مائة رطل ذكر أن الموضع كان دار جابر في أيام عز الدولة بن معز الدولة، وقال جماعة إن جابرا لا أصل له ولا حقيقة وإن المصنفات صنفها الناس ونحلوه إياها فرد ابن النديم بأن رجلا فاضلا يصنف كتابا في ألفي ورقة ثم ينحله لغيره ضرب من الجهل وأن الرجل له حقيقة، ويقول الرازي في كتبه قال أستاذنا أبو موسى جابر بن حيان {cite:fihrist-ibn-al-nadim p. 498-500}."
  en: "The contested alchemist — Sufi/Barmaki/Shi'i claims; Ibn al-Nadim insists he was real {cite:fihrist-ibn-al-nadim}"
  es: "El controvertido alquimista —afirmaciones sufíes/barmakis/chiíes; Ibn al-Nadim insiste en que fue real {cite:fihrist-ibn-al-nadim}"
  fr: "L'alchimiste controversé — affirmations soufies/barmaki/chiites; Ibn al-Nadim insiste sur son existence réelle {cite:fihrist-ibn-al-nadim}"
  ur: "مقابلہ کرنے والا کیمیا دان — صوفی/برمکی/شیعی دعویٰ کرتا ہے۔ ابن الندیم کا اصرار ہے کہ وہ حقیقی تھا"
  tr: "Sufi olarak bilinen Ebu Abdullah Cabir bin Hayyan ibn Abdullah el-Sukufi geniş çapta saygı görürdü: Şiiler onun büyük figürlerinden biri ve kapı kapılarından biri olduğunu söyler, Cafer Sadiq'in yoldaşı ve Kufe'den olduğunu iddia ederlerdi. Bazı filozoflar onun onlardan biri olduğunu ve mantık ile felsefe eserleri olduğunu iddia eder. Altın ve gümüş zanaatkarlığı uzmanları, liderliğin kendi döneminde sona erdiğini, işlerinin gizli tutulduğunu ve hükümdardan korktuğu için ülkeler arasında seyahat ettiğini iddia ederler. Ayrıca onun Barmakiler arasında olduğu da söylenir, yani bir farkında Ja'far bin Yahya. Bunu iddia eden kişi, efendisi Ja'far al-Barmaki'yi kastettiğini söyler. Şiiler sadece Ca'far al-Sadiq'i kastettiğini söyler. İbn el-Nadim, bazı güvenilir kişilerden Darb al-Dhahab'daki Bab al-Sham Caddesi'nde kaldığını ve iksirlerinin çoğunun Kufe'de olduğunu, havanın sağlam olması için iksirler düzenlediğini anlatmıştır. Kufa'da Azj tarafından vurulduğunda, yaklaşık yüz pound ağırlığında bir havan bulduğunda, buranın İzz'd-Devle bin Muizz al-Dawla döneminde Cabir'in ikametgahı olduğu belirtilmiştir. Bazıları Cabir'in kökeni veya kökeni olmadığını söylemiştir Aslında, eserler insanlar tarafından yazılmış ve onlar tarafından çözülmüştür. İbn el-Nadim ise erdemli bir adamın iki bin sayfalık bir kitap yazıp sonra başkaları için cehaletten yazdığını, insanın bir gerçeği olduğunu belirtmiştir. El-Razi kitaplarında öğretmenimiz Ebu Musa Cabir ibn Hayyan'ın {atıf:fihrist-ibn-al-nadim s. 498-500} olduğunu söyler."
  id: "Abu Abdullah Jabir ibn Hayyan ibn Abdullah al-Sukufi, yang dikenal sebagai Sufi, sangat dihormati: kaum Syiah mengatakan ia adalah salah satu tokoh besar mereka dan salah satu gerbang, mengklaim ia adalah sahabat Ja'far al-Sadiq dan dari Kufa. Beberapa filsuf mengklaim ia adalah salah satu dari mereka dan memiliki karya dalam logika dan filsafat. Para ahli kerajinan emas dan perak mengklaim bahwa kepemimpinan berakhir pada zamannya, bahwa urusannya dirahasiakan, dan bahwa ia bepergian antar negara karena takut pada penguasa. Dikatakan juga bahwa ia termasuk di antara Barmakid, seorang yang tersadar Ja'far ibn Yahya. Siapa pun yang mengklaim ini mengatakan bahwa ia bermaksud dengan gurunya Ja'far al-Barmaki. Syiah mengatakan ia hanya bermaksud Ja'far al-Sadiq. Ibn al-Nadim menceritakan dari beberapa orang terpercaya bahwa ia dulu pernah tinggal di Jalan Bab al-Sham di Darb al-Dhahab, dan sebagian besar tempat tinggalnya berada di Kufa, di mana ia menyiapkan eliksir untuk memastikan udara di sana sehat. Ketika ia dibunuh oleh Azj di Kufa, di mana ia menemukan semen seberat sekitar seratus pon, disebutkan bahwa tempat itu adalah kediaman Jabir pada masa Izz al-Dawla ibn Mu'izz al-Dawla. Beberapa mengatakan bahwa Jabir tidak memiliki asal maupun Faktanya, karya-karya itu ditulis oleh orang-orang dan diselesaikan oleh mereka. Ibn al-Nadim menjawab bahwa seorang pria berbudi luhur menulis sebuah buku dalam dua ribu halaman lalu menyusunnya untuk orang lain karena ketidaktahuan, dan bahwa orang itu memiliki kebenaran. Al-Razi mengatakan dalam bukunya bahwa guru kita Abu Musa Jabir ibn Hayyan {cite:fihrist-ibn-al-nadim hlm. 498-500}."
