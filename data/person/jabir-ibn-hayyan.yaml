label: { ar: "جابر بن حيان", en: "Jabir Ibn Hayyan" }
summary:
  ar: "أبو عبد الله جابر بن حيان بن عبد الله السكوفي المعروف بالصوفي، اختلف الناس في أمره: قالت الشيعة إنه من كبارهم وأحد الأبواب وزعموا أنه كان صاحب جعفر الصادق وكان من أهل الكوفة، وزعم قوم من الفلاسفة أنه كان منهم وله في المنطق والفلسفة مصنفات، وزعم أهل صناعة الذهب والفضة أن الرياسة انتهت إليه في عصره وأن أمره كان مكتوما وأنه كان يتنقل في البلدان خوفا من السلطان، وقيل إنه كان في جملة البرامكة متحققا بجعفر بن يحيى فمن زعم هذا قال إنه عنى بسيده جعفر البرمكي وقالت الشيعة إنما عنى جعفر الصادق، وحدث ابن النديم بعض الثقات أنه كان ينزل بشارع باب الشام في درب الذهب وأن أكثر مقامه بالكوفة وبها كان يدبر الإكسير لصحة هوائها، ولما أصيب بالكوفة الإزج الذي وجد فيه هاون ذهب نحو مائة رطل ذكر أن الموضع كان دار جابر في أيام عز الدولة بن معز الدولة، وقال جماعة إن جابرا لا أصل له ولا حقيقة وإن المصنفات صنفها الناس ونحلوه إياها فرد ابن النديم بأن رجلا فاضلا يصنف كتابا في ألفي ورقة ثم ينحله لغيره ضرب من الجهل وأن الرجل له حقيقة، ويقول الرازي في كتبه قال أستاذنا أبو موسى جابر بن حيان {cite:fihrist-ibn-al-nadim p. 498-500}."
  en: "The contested alchemist — Sufi/Barmaki/Shi'i claims; Ibn al-Nadim insists he was real {cite:fihrist-ibn-al-nadim}"
