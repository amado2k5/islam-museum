summary:
  ar: "شاعر ووزير أندلسي من غرناطة (1333-1393)، من أبوَيه المتواضعين، قدَّمه أستاذه لسان الدين بن الخطيب إلى بلاط بني الأحمر، فرافق السلطان محمد الخامس إلى المغرب وصار عند عودته كاتم سرّه وشاعر بلاطه، ثم خلف أستاذه في الوزارة سنة 1371 وكان له يد في قتله. ما تزال قصائده منقوشة على نوافير الحمراء وقصورها. سجنه يوسف الثاني نحو سنتين، ثم قُتل في داره بأمر محمد السابع وهو يقرأ القرآن."
  en: "Andalusi poet and vizier from Granada (1333–1393), of humble origin, brought to the Nasrid court by his teacher Ibn al-Khatib. He accompanied Sultan Muhammad V into Moroccan exile and on his restoration became his private secretary and court poet; in 1371 he succeeded his own teacher as vizier and had a hand in his killing. His verses still decorate the fountains and palaces of the Alhambra. Imprisoned for nearly two years by Yusuf II, he was murdered at home on Muhammad VII's orders while reading the Quran."
  ur: "غرناطہ کے اندلسی شاعر اور وزیر (1333ء–1393ء)، معمولی گھرانے سے تھے؛ ان کے استاد لسان الدین ابن الخطیب نے انھیں بنو احمر کے دربار سے متعارف کرایا۔ وہ سلطان محمد خامس کے ساتھ مغرب گئے اور ان کی واپسی پر ان کے معتمد خاص اور درباری شاعر بنے؛ 1371ء میں اپنے ہی استاد کے بعد وزیر بنے اور ان کے قتل میں ملوث رہے۔ ان کے اشعار آج بھی الحمراء کے فواروں اور محلات پر کندہ ہیں۔ یوسف ثانی نے انھیں قریب دو برس قید رکھا، پھر محمد سابع کے حکم پر وہ گھر میں قرآن پڑھتے ہوئے قتل کر دیے گئے۔"

