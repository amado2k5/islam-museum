label: { ar: "الزغل أبو عبد الله سلطان غرناطة" }
summary:
  ar: "أبو عبد الله محمد بن سعد المعروف بالزغل، أخو السلطان أبي الحسن؛ كان بمالقة يوم كسرة النصارى عندها فقُتل منهم نحو ثلاثة آلاف وأسر نحو ألفين من جملتها نحو ثلاثين من الأكابر {cite:nafh-tib-maqqari p. 518}. ولما تعذر أمر أخيه بالصرع وذهاب بصره قدمه أخوه وخلع له نفسه، فاستقل بالملك بعده بينما بقي ابن أخيه أبو عبد الله في أسر العدو {cite:nafh-tib-maqqari p. 519}."
  en: "Abu Abdallah Muhammad ibn Sa'd, known as al-Zaghal ('the Valiant'), brother of sultan Abu al-Hasan — he held Malaga during the great Christian repulse of 888 (some 3,000 killed, 2,000 captured), then took sole rule when his brother, stricken by epilepsy and blindness, abdicated in his favour while his nephew Boabdil remained in captivity {cite:nafh-tib-maqqari p. 518-519}."
