id: person/al-zaghal
class: person
label: { ar: "الزغل أبو عبد الله سلطان غرناطة", en: "al-Zaghal Abu Abd Allah, sultan of Granada", fr: "al-Zaghal Abou Abd Allah, sultan de Grenade", es: "al-Zaghal Abu Abd Allah, sultan of Granada", ur: "الزغل ابو عبد اللہ، غرناطہ کا سلطان" }
summary:
  ar: "أبو عبد الله محمد بن سعد المعروف بالزغل، أخو السلطان أبي الحسن؛ كان بمالقة يوم كسرة النصارى عندها فقُتل منهم نحو ثلاثة آلاف وأسر نحو ألفين من جملتها نحو ثلاثين من الأكابر {cite:nafh-tib-maqqari p. 518}. ولما تعذر أمر أخيه بالصرع وذهاب بصره قدمه أخوه وخلع له نفسه، فاستقل بالملك بعده بينما بقي ابن أخيه أبو عبد الله في أسر العدو {cite:nafh-tib-maqqari p. 519}."
  en: "Abu Abdallah Muhammad ibn Sa'd, known as al-Zaghal ('the Valiant'), brother of sultan Abu al-Hasan — he held Malaga during the great Christian repulse of 888 (some 3,000 killed, 2,000 captured), then took sole rule when his brother, stricken by epilepsy and blindness, abdicated in his favour while his nephew Boabdil remained in captivity {cite:nafh-tib-maqqari p. 518-519}."
  fr: "Abu Abdallah Muhammad ibn Sa'd, connu sous le nom d'al-Zaghal (« le vaillant »), frère du sultan Abu al-Hasan - il a tenu Malaga pendant la grande répulsion chrétienne de 888 (environ 3 000 tués, 2 000 capturés), puis a pris le pouvoir lorsque son frère, atteint d'épilepsie et de cécité, a abdiqué en sa faveur tandis que son neveu Boabdil restait en captivité {cite:nafh-tib-maqqari p. 518-519}."
  es: "Abu Abdallah Muhammad ibn Sa'd, conocido como al-Zaghal ('el Valiente'), hermano del sultán Abu al-Hasan, gobernó Málaga durante la gran derrota cristiana de 888 (unos 3.000 muertos, 2.000 capturados), y luego tomó el poder absoluto cuando su hermano, aquejado de epilepsia y ceguera, abdicó en su favor mientras su sobrino Boabdil permanecía en cautiverio {cite:nafh-tib-maqqari p. 518-519}."
  ur: "ابو عبداللہ محمد بن سعد، جسے الزغل ⁦('بہادر' کے نام سے جانا جاتا ہے)⁩، سلطان ابو الحسن کا بھائی - اس نے 888 کے عظیم عیسائی پسپائی کے دوران ملاگا پر قبضہ کیا ⁦(تقریباً 3,000 مارے گئے، 2,000 پکڑے گئے)⁩، پھر اس وقت واحد حکومت سنبھالی جب اس کا بھائی، مرگی کے مرض میں مبتلا تھا، اس کے بوڑھے اور معدہ کے مرض میں مبتلا تھے۔ اسیری میں رہا 518-519}۔"
