roles: [scholar]
gender: male
summary:
  ar: "ثور بن يزيد الكلاعي الحمصي، محدث وفقيه عالم حمص، عدّه الذهبي من أوعية العلم، وقيل إنه نُسب إلى القول بالقدر؛ توفي سنة ١٥٣هـ بحسب ابن سعد وخليفة."
  en: "Thawr ibn Yazid al-Kala'i of Homs, hadith transmitter and jurist, called a vessel of knowledge by al-Dhahabi, who also records the charge that he held the doctrine of qadar; he died in 153 AH according to Ibn Sa'd and Khalifa."
  es: "Thawr ibn Yazid al-Kala'i de Homs, transmisor de hadices y jurista, llamado un recipiente de conocimiento por al-Dhahabi, quien también registra la acusación de que sostenía la doctrina del qadar; murió en el año 153 AH según Ibn Sa'd y Khalifa."
  fr: "Thawr ibn Yazid al-Kala'i de Homs, transmetteur de hadiths et juriste, qualifié de réceptacle de la connaissance par al-Dhahabi, qui rapporte également l'accusation selon laquelle il soutenait la doctrine du qadar; il mourut en 153 AH selon Ibn Sa'd et Khalifa."
  ur: "حمص کے ثور بن یزید الکلائی، حدیث کی ترسیل کرنے والا اور فقیہ، جسے الذہبی نے علم کا برتن کہا ہے، جو اس الزام کو بھی درج کرتا ہے کہ وہ عقیدہ قدر رکھتا تھا۔ ابن سعد اور خلیفہ کے مطابق 153ھ میں وفات پائی۔"
  tr: "Homslu hadis âlimi ve alâhi Tevr bin Yezid el-Kal'i el-Himsi, el-Dhahabi tarafından bilgi taşıyıcıları arasında kabul edilir ve kaderin inancına bağlandığı söylenir; İbn Sad ve Halife'ye göre 153 Hicri yılında ölmüştür."
  id: "Thawr ibn Yazid al-Kala'i al-Himsi, seorang ulama hadis dan ahli hukum dari Homs, dianggap oleh al-Dhahabi sebagai salah satu wadah pengetahuan, dan dikatakan ia dikaitkan dengan kepercayaan pada takdir; ia wafat pada tahun 153 H menurut Ibn Sa'd dan Khalifa."
