summary:
  ar: "تابعي وقاضٍ من رجال الحديث؛ أصله من الكوفة وسكن البصرة وولي القضاء بمرو، روى عن أبيه وابن عباس وابن عمر وأبي هريرة وغيرهم، ووثّقه ابن معين والعجلي وأبو حاتم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5154}."
  en: "A Successor and judge among the transmitters: from Kufa, he lived in Basra and held the judgeship of Marw; he transmitted from his father, Ibn Abbas, Ibn Umar and Abu Hurayra, and Ibn Ma'in, al-Ijli and Abu Hatim graded him trustworthy {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5154}."
  fr: "Suivant et juge parmi les transmetteurs : originaire de Koufa, il vécut à Bassora et occupa la judicature de Merv ; il transmit de son père, d'Ibn Abbas, d'Ibn Umar et d'Abu Hurayra, et Ibn Ma'in, al-Ijli et Abu Hatim le jugèrent digne de confiance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5154}."
  es: "Un sucesor y juez entre los transmisores: de Kufa, vivió en Basora y ocupó el cargo de juez de Marw; transmitió de su padre, Ibn Abbas, Ibn Umar y Abu Hurayra, e Ibn Ma'in, al-Ijli y Abu Hatim lo consideraron digno de confianza {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5154}."
  ur: "منتقل کرنے والوں میں ایک جانشین اور قاضی: کوفہ سے، وہ بصرہ میں مقیم تھے اور مرو کے عہدہ پر فائز تھے۔ اس نے اپنے والد، ابن عباس، ابن عمر اور ابو ہریرہ سے نقل کیا ہے، اور ابن معین، العجلی اور ابو حاتم نے اسے ثقہ قرار دیا ہے {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 5154}۔"
  tr: "Hadis âlimlerinden bir takipçi ve kadı; aslen Kufalıdır, Basra'da yaşamış ve Merv'de kadılık görevini üstlenmiştir. Babası İbn Abbas, İbn Ömer, Ebu Hurayra ve diğerlerinden rivayet etmiştir. İbn Ma'in, El-Ajli ve Ebu Hatim tarafından güvenilir bulunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5154}"
  id: "Seorang pengikut dan hakim dari kalangan ahli Hadits; asalnya dari Kufa, ia tinggal di Basra dan memegang jabatan hakim di Merv. Ia meriwayatkan dari ayahnya, Ibnu Abbas, Ibnu Omar, Abu Hurairah dan lainnya. Ia dianggap dapat dipercaya oleh Ibnu Ma'in, Al-Ajli dan Abu Hatim {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5154}."
