id: person/sakkut-al-barghawati
class: person
label:
  ar: سكوت البرغواطي الحاجب
  en: Sakkut al-Barghawati
  es: "Sakkut al-Barghawati"
  fr: "Sakkut al-Barghawati"
  ur: "سکوت البرغاوتی"
summary:
  ar: "سكوت البرغواطي الحاجب؛ كان عبداً للشيخ حداد من موالي بني حمود اشتراه من سبي برغواطة في بعض أيام جهادهم، ثم صار إلى علي بن حمود فأخذت النجابة بضبعه إلى أن استقل بأمرهم واقتعد كرسي عملهم بطنجة وسبتة وأطاعته قبائل غمارة، واتصلت أيامه إلى دولة المرابطين فنازله يوسف بن تاشفين فجهز إليه العساكر للقائد صالح بن عمران فالتقوا بظاهر طنجة سنة 471هـ فانكشفت عساكر سكوت ولحق ابنه ضياء الدولة المعز بسبتة، ثم نازلها المعز بن يوسف سنة 476هـ واقتحموها عنوة فأُتي بسكوت فأساء إيجابه في طلب المال فقتل لوقته وعثر على ذخائره وفيها خاتم يحيى بن علي بن حمود، وانقرضت دولة آل حمود."
  en: "Sakkut the Barghawati hajib; a slave of the shaykh Haddad of the Hammudid mawali, bought from Barghawata captives in their jihad days, who passed to Ali ibn Hammud where talent carried him until he seized their office and sat on their throne at Tangier and Ceuta with all Ghumara obeying him — into the Almoravid era, when Salih ibn Imran's host shattered him before Tangier in 471, his son Diya' al-Din falling back on Ceuta which al-Mu'izz ibn Yusuf stormed in 476; Sakkut, ill-answering the demand for treasure, was killed on the spot, and among his hoard they found the seal-ring of Yahya ibn Ali ibn Hammud — so ended the Hammudid state."
  es: "Sakkut, el hajib de Barghawata, esclavo del shaykh Haddad del mawali Hammudí, comprado a los cautivos de Barghawata en sus días de yihad, pasó a manos de Ali ibn Hammud, donde su talento lo llevó hasta que se apoderó de su cargo y se sentó en su trono en Tánger y Ceuta con toda la Ghumara obedeciéndole, hasta la era almorávide, cuando el ejército de Salih ibn Imran lo derrotó ante Tánger en 471, su hijo Diya' al-Din retrocedió hacia Ceuta, que al-Mu'izz ibn Yusuf asaltó en 476; Sakkut, al no responder adecuadamente a la demanda de tesoros, fue asesinado en el acto, y entre su tesoro encontraron el anillo de sello de Yahya ibn Ali ibn Hammud; así terminó el estado Hammudí."
  fr: "Sakkut, le hajib de Barghawati, esclave du cheikh Haddad du mawali hammudique, fut acheté aux captifs de Barghawata lors de leur jihad. Il passa ensuite au service d'Ali ibn Hammud, où son talent le porta jusqu'à ce qu'il s'empare de leur charge et s'assoie sur leur trône à Tanger et Ceuta, avec tous les Ghumara qui lui obéissaient. À l'époque almoravide, en 471, l'armée de Salih ibn Imran le vainquit devant Tanger. Son fils, Diya' al-Din, se replia sur Ceuta, que prit d'assaut al-Mu'izz ibn Yusuf en 476. Sakkut, refusant de payer le trésor demandé, fut tué sur-le-champ, et parmi son butin, on trouva l'anneau sigillaire de Yahya ibn Ali ibn Hammud. Ainsi prit fin l'État hammudique."
  ur: "سکوت برضاوتی حجیب؛ حمودی موالی کے شیخ حداد کا ایک غلام، جو جہاد کے دنوں میں برغواتہ کے قیدیوں سے خریدا گیا تھا، جو علی ابن حمود کے پاس گیا جہاں پر ہنر اسے لے گیا یہاں تک کہ اس نے ان کے عہدہ پر قبضہ کر لیا اور تمام غماروں کے ساتھ ان کے تخت پر بیٹھا اور تمام غمارہ کے ساتھ ان کی اطاعت کرتے ہوئے - الموراوید سے پہلے جب عمران خان کی میزبانی میں اس کی میزبانی کی۔ تانگیر 471 میں، اس کا بیٹا دیا الدین سیوٹا پر واپس گر رہا تھا جس پر المعز ابن یوسف نے 476 میں حملہ کیا تھا۔ سکوت، خزانے کے مطالبے کا غلط جواب دے رہا تھا، موقع پر ہی مارا گیا، اور اس کے ذخیرے کے درمیان انہیں یحییٰ بن علی ابن حمود کی مہر کی انگوٹھی ملی- اس طرح حمود ریاست کا خاتمہ ہوا۔"
  tr: "Sukut el-Barghawati al-Hajib; Bani Hammoud'un müttefilisi Şeyh Haddad'ın kölesiydi ve cihadı sırasında Barghawata'nın esaretinden onu satın aldı. Sonra Ali ibn Hammoud'a geldi; onun başarısı onların emriyle bağımsızlığını kazandı ve Tanca ile Ceuta'da yerleşti. Ghumara kabileleri ona itaat etti. Günleri Almoravid devletiyle bağlantılıydı, bu yüzden Yusuf bin Taşfin onunla ve Komutan Saleh ibf'in askerleriyle karşı karşıya geldi n İmranlar onun için hazırlanmıştı. 471 Hicri'de Tanca'nın dışında buluştular; burada Sukut'un birlikleri açığa çıktı ve oğlu Diya' al-Dawla al-Mu'izz Ceuta'ya katıldı. Sonra el-Mu'izz ibn Yusuf zorla şehre saldırdı, ancak Bisukout getirildi ve parayı kabul etmeyi reddetti, bu yüzden o sırada öldürüldü. Yahya ibn Ali ibn Hammoud'un yüzüğünü içeren mühimmatı bulundu ve Hammud hanedanı sona erdi."
  id: "Sukut al-Barghawati al-Hajib; ia adalah budak Sheikh Haddad, klien Bani Hammoud, yang dibelinya dari tahanan Barghawata selama beberapa hari jihad mereka. Kemudian ia datang kepada Ali ibn Hammoud, yang keberhasilannya berlanjut hingga ia merdeka atas perintah mereka dan mengambil tempat di Tangier dan Ceuta. Suku-suku Ghumara menaatinya. Hari-harinya terkait dengan negara Almoravid, sehingga Yusuf ibn Tashfin menghadangnya, dan tentara Komandan Saleh ibib n Imran sudah siap menghadapinya. Mereka bertemu di pinggiran Tangier pada tahun 471 H, di mana pasukan Sukut terekspos dan putranya Diya' al-Dawla al-Mu'izz bergabung dengan Ceuta. Kemudian al-Mu'izz ibn Yusuf menyerbu dengan paksa, tetapi Bisukout dibawa dan menolak menerima uang itu, sehingga ia dibunuh saat itu. Amunisinya, yang berisi cincin Yahya ibn Ali ibn Hammoud, ditemukan, dan dinasti Hammoud punah."
