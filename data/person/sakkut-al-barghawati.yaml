id: person/sakkut-al-barghawati
class: person
label:
  ar: سكوت البرغواطي الحاجب
  en: Sakkut al-Barghawati
summary:
  ar: "سكوت البرغواطي الحاجب؛ كان عبداً للشيخ حداد من موالي بني حمود اشتراه من سبي برغواطة في بعض أيام جهادهم، ثم صار إلى علي بن حمود فأخذت النجابة بضبعه إلى أن استقل بأمرهم واقتعد كرسي عملهم بطنجة وسبتة وأطاعته قبائل غمارة، واتصلت أيامه إلى دولة المرابطين فنازله يوسف بن تاشفين فجهز إليه العساكر للقائد صالح بن عمران فالتقوا بظاهر طنجة سنة 471هـ فانكشفت عساكر سكوت ولحق ابنه ضياء الدولة المعز بسبتة، ثم نازلها المعز بن يوسف سنة 476هـ واقتحموها عنوة فأُتي بسكوت فأساء إيجابه في طلب المال فقتل لوقته وعثر على ذخائره وفيها خاتم يحيى بن علي بن حمود، وانقرضت دولة آل حمود."
  en: "Sakkut the Barghawati hajib; a slave of the shaykh Haddad of the Hammudid mawali, bought from Barghawata captives in their jihad days, who passed to Ali ibn Hammud where talent carried him until he seized their office and sat on their throne at Tangier and Ceuta with all Ghumara obeying him — into the Almoravid era, when Salih ibn Imran's host shattered him before Tangier in 471, his son Diya' al-Din falling back on Ceuta which al-Mu'izz ibn Yusuf stormed in 476; Sakkut, ill-answering the demand for treasure, was killed on the spot, and among his hoard they found the seal-ring of Yahya ibn Ali ibn Hammud — so ended the Hammudid state."
