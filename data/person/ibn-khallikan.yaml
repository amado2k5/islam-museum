summary:
  ar: "قاضي القضاة ابن خلكان صاحب وفيات الأعيان، ولد بأربل سنة ثمان وست مئة وسمع البخاري من ابن مكرم وتفقه بالموصل على كمال الدين بن يونس وبالشام على ابن شداد ولقي كبار العلماء وبرع في الفضائل والآداب وسكن مصر مدة وناب في القضاء ثم ولي قضاء الشام عشر سنين وعزل بابن الصايغ سنة تسع وستين فأقام سبع سنين معزولاً بمصر ثم رد إلى قضاء الشام ثم عزل ثانياً في أول سنة ثمانين واستمر معزولاً وبيده الأمينية والنجيبية، قال الذهبي كان إماماً فاضلاً متقناً عارفاً بالمذهب حسن الفتاوى جيد القريحة بصيراً بالعربية علامة في الأدب والشعر وأيام الناس كثير الاطلاع حلو المذاكرة وافر الحرمة من سروات الناس كريماً جواداً ممدحاً وقد جمع كتاباً نفيساً في وفيات الأعيان، توفي سنة إحدى وثمانين وست مئة {cite:shadharat-dhahab p. 379}."
  en: "Ibn Khallikan, chief qadi of Damascus and author of Wafayat al-A'yan — born at Irbil 608, trained under Kamal al-Din ibn Yunus at Mosul and Ibn Shaddad in Syria, twice appointed and twice dismissed from the Damascus qadaship; al-Dhahabi: 'he compiled a precious book on the deaths of the notables' {cite:shadharat-dhahab p. 379}."
