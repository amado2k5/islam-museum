summary:
  ar: "قاضي القضاة ابن خلكان صاحب وفيات الأعيان، ولد بأربل سنة ثمان وست مئة وسمع البخاري من ابن مكرم وتفقه بالموصل على كمال الدين بن يونس وبالشام على ابن شداد ولقي كبار العلماء وبرع في الفضائل والآداب وسكن مصر مدة وناب في القضاء ثم ولي قضاء الشام عشر سنين وعزل بابن الصايغ سنة تسع وستين فأقام سبع سنين معزولاً بمصر ثم رد إلى قضاء الشام ثم عزل ثانياً في أول سنة ثمانين واستمر معزولاً وبيده الأمينية والنجيبية، قال الذهبي كان إماماً فاضلاً متقناً عارفاً بالمذهب حسن الفتاوى جيد القريحة بصيراً بالعربية علامة في الأدب والشعر وأيام الناس كثير الاطلاع حلو المذاكرة وافر الحرمة من سروات الناس كريماً جواداً ممدحاً وقد جمع كتاباً نفيساً في وفيات الأعيان، توفي سنة إحدى وثمانين وست مئة {cite:shadharat-dhahab p. 379}."
  en: "Ibn Khallikan, chief qadi of Damascus and author of Wafayat al-A'yan — born at Irbil 608, trained under Kamal al-Din ibn Yunus at Mosul and Ibn Shaddad in Syria, twice appointed and twice dismissed from the Damascus qadaship; al-Dhahabi: 'he compiled a precious book on the deaths of the notables' {cite:shadharat-dhahab p. 379}."
  es: "Ibn Khallikan, cadí principal de Damasco y autor de Wafayat al-A'yan, nació en Irbil en 608, se formó con Kamal al-Din ibn Yunus en Mosul y con Ibn Shaddad en Siria, fue nombrado y destituido dos veces del cargo de cadí de Damasco; al-Dhahabi: «compiló un valioso libro sobre las muertes de los notables» {cita: shadharat-dhahab p. 379}."
  fr: "Ibn Khallikan, cadi en chef de Damas et auteur de Wafayat al-A'yan — né à Erbil en 608, formé par Kamal al-Din ibn Yunus à Mossoul et Ibn Shaddad en Syrie, nommé deux fois et destitué deux fois de la charge de cadi de Damas; al-Dhahabi: « il a compilé un précieux livre sur les décès des notables » {cite: shadharat-dhahab p. 379}."
  ur: "ابن خلقان، دمشق کے چیف قادی اور وفایت العیان کے مصنف - اربیل میں 608 میں پیدا ہوئے، موصل میں کمال الدین ابن یونس کے زیر تربیت اور شام میں ابن شداد میں، دو مرتبہ تقرر اور دو مرتبہ دمشق سے برطرف ہوئے۔ الذہبی: 'اس نے معززین کی موت پر ایک قیمتی کتاب تالیف کی' 379}۔"
  tr: "Baş Yargıç İbn Khallikan, Wafayat al-A'yan'ın yazarı, 860 Hâm yılında Erbil'de doğdu. El-Buhari'yi İbn Makram'dan dinledi ve Musul'da Kamal al-Din ibn Yunus'tan ve Levant'ta İbn Shaddad'dan hukuk eğitimi aldı. Büyük alimlerle tanıştı ve erdem ile görgü kurallarında üstün oldu. Bir süre Mısır'da yaşadı ve yardımcı yargıç olarak görev yaptı. Daha sonra on yıl Levant yargıcı olarak görev yaptı, 1969'da İbn el-Seyh tarafından görevden alındı, yedi yıl boyunca Mısır'da izole kaldı, ardından tekrar el-Şam yargısına döndü, seksen yılın ilk yılında tekrar işten çıkarıldı ve vakıfında görevden alınmaya devam etti. Al-Dhahabi'ye göre, El-Necibiyah erdemli, bilgili bir imamdı, düşünce okulunda bilgili, fetvalarda iyi, zekâda keskin, Arapça'da sezgili, edebiyat, şiir ve halk döneminde seçkin bir figür, çok bilgili, eğitimde hoş, halk arasında çok saygı duyulan, cömert, cömert ve övgüye değer bir figürdü. Önemli kişilerin ölümleri üzerine değerli bir kitap derledi. 1681 Hicri yılında vefat etti {atıf:shadharat-dhahab, s. 379}."
  id: "Ketua Hakim Ibn Khallikan, penulis Wafayat al-A'yan, lahir di Erbil pada tahun 860 H. Ia mendengar al-Bukhari dari Ibn Makram dan belajar hukum di Mosul di bawah bimbingan Kamal al-Din ibn Yunus serta di Levant di bawah Ibn Shaddad. Ia bertemu dengan para cendekiawan besar dan unggul dalam kebajikan serta tata krama. Ia tinggal di Mesir untuk sementara waktu dan menjabat sebagai wakil hakim. Kemudian ia menjabat sebagai hakim Levant selama sepuluh tahun, diberhentikan oleh Ibn al-Saigh pada tahun 1969, tinggal dalam isolasi di Mesir selama tujuh tahun, kemudian kembali ke pengadilan al-Sham, diberhentikan lagi pada tahun pertama delapan puluh tahun dan tetap diberhentikan dalam kepercayaannya. Al-Najibiyyah, kata Al-Dhahabi, adalah seorang imam yang berbudi luhur dan berpengetahuan luas, berpengetahuan dalam aliran pemikiran, mahir dalam fatwa, tajam dalam intelektual, tajam dalam bahasa Arab, tokoh terkemuka dalam sastra, puisi, dan masa rakyat, sangat berpengetahuan, ramah dalam belajar, sangat dihormati oleh masyarakat, murah hati, dermawan, dan terpuji. Ia menyusun sebuah buku berharga tentang kematian tokoh-tokoh ternama. Ia meninggal pada tahun 1681 H {cite:shadharat-dhahab, hlm. 379}."
