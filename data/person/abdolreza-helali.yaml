  ar: "مدّاح إيراني، وُلد في خرمشهر سنة 1981 ونشأ في طهران، واشتهر بابتكاراته في المدح لا سيما أسلوب الشور وبقيادة هيئة الرضا في طهران، وأسّس سنة 2022 مجمع «تكية آغا مرتضى علي» الثقافي الاجتماعي؛ بلغ حسابه على إنستغرام 508,193 متابعًا في نوفمبر 2026 عند قراءته على المنصة."
  en: "Iranian maddah (eulogist), born in Khorramshahr in 1981 and raised in Tehran, known for his innovations in maddahi, especially the shoor style, and for leading Tehran's Heyat al-Reza; in 2022 he founded the Takiyegah Agha Morteza Ali cultural and social complex. His Instagram account counted 508,193 followers in November 2026 when read on the platform."
  ur: "ایرانی مداح، جو 1981ء میں خرمشہر میں پیدا ہوئے اور تہران میں پروان چڑھے؛ وہ مداحی میں اپنی اختراعات، خصوصاً «شور» اسلوب، اور تہران کی ہیئت الرضا کی قیادت کے لیے مشہور ہیں، اور ان کے انسٹاگرام اکاؤنٹ کے فالوور نومبر 2026ء میں پلیٹ فارم پر پڑھنے پر 508,193 تھے۔"
