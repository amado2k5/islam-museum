summary:
  ar: "مدّاح إيراني، وُلد في خرمشهر سنة 1981 ونشأ في طهران، واشتهر بابتكاراته في المدح لا سيما أسلوب الشور وبقيادة هيئة الرضا في طهران، وأسّس سنة 2022 مجمع «تكية آغا مرتضى علي» الثقافي الاجتماعي؛ بلغ حسابه على إنستغرام 508,193 متابعًا في نوفمبر 2026 عند قراءته على المنصة."
  en: "Iranian maddah (eulogist), born in Khorramshahr in 1981 and raised in Tehran, known for his innovations in maddahi, especially the shoor style, and for leading Tehran's Heyat al-Reza; in 2022 he founded the Takiyegah Agha Morteza Ali cultural and social complex. His Instagram account counted 508,193 followers in November 2026 when read on the platform."
  fr: "Maddah (panégyriste) iranien, né à Khorramshahr en 1981 et élevé à Téhéran, connu pour ses innovations dans la maddahi, notamment le style shoor, et pour diriger la Heyat al-Reza de Téhéran ; en 2022, il fonda le complexe culturel et social Takiyegah Agha Morteza Ali. Son compte Instagram comptait 508 193 abonnés en novembre 2026, lu sur la plateforme."
  ur: "ایرانی مداح، جو 1981ء میں خرمشہر میں پیدا ہوئے اور تہران میں پروان چڑھے؛ وہ مداحی میں اپنی اختراعات، خصوصاً «شور» اسلوب، اور تہران کی ہیئت الرضا کی قیادت کے لیے مشہور ہیں، اور ان کے انسٹاگرام اکاؤنٹ کے فالوور نومبر 2026ء میں پلیٹ فارم پر پڑھنے پر 508,193 تھے۔"
  es: "Orador religioso iraní (maddah), nacido en Khorramshahr en 1981 y criado en Teherán, conocido por sus innovaciones en el maddahi, especialmente en el estilo shoor, y por dirigir el grupo Heyat al-Reza de Teherán. En 2022 fundó el complejo cultural y social Takiyegah Agha Morteza Ali. Su cuenta de Instagram contaba con 508.193 seguidores en noviembre de 2026, según consta en la plataforma."
  tr: "1981 yılında Horramşahr'da doğan ve Tahran'da büyüyen İranlı bir ağıtçı olan Rıza Morteza Ali, özellikle Şur tarzındaki yenilikleri ve Tahran'daki Rıza Vakfı'nı yönetmesiyle ünlendi. 2022 yılında \"Tekkiye Ağa Morteza Ali\" kültür ve sosyal kompleksini kurdu. Kasım 2026'da platformda ağıt yakmaya başladığında Instagram hesabı 508.193 takipçiye ulaştı."
  id: "Seorang pembaca pidato duka cita asal Iran, lahir di Khorramshahr pada tahun 1981 dan dibesarkan di Teheran, ia terkenal karena inovasinya dalam pidato duka cita, terutama gaya Shour, dan karena memimpin Yayasan Reza di Teheran. Pada tahun 2022, ia mendirikan kompleks budaya dan sosial “Tekkiye Agha Morteza Ali”. Akun Instagram-nya mencapai 508.193 pengikut pada November 2026 ketika ia membacakan pidato di platform tersebut."
