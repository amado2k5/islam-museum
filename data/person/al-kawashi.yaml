summary:
  ar: "المفسر العلامة المقريء الزاهد نزيل كواشة قلعة الموصل؛ برع في القراءات والتفسير والعربية، وصنف التفسير الكبير والصغير. قال الذهبي: كان منقطع القرين عديم النظير زهداً وصلاحاً وتبتلاً وصدقاً واجتهاداً، كان يزوره السلطان فمن دونه ولا يعبأ بهم ولا يقوم لهم ويتبرم بهم ولا يقبل لهم شيئاً، وله كشف وكرامات، وأخذ عنه القراءات ابن خروف الموصلي وغيره {cite:shadharat-dhahab p. 642-643}."
  en: "Mosul's hermit-mufassir of Kawasha (b. 591) — a large and a small tafsir, qurra' master; Dhahabi: 'the sultan and those below visited him; he rose for none and accepted nothing' {cite:shadharat-dhahab p. 642-643}."
  es: "El ermitaño-mufassir de Kawasha de Mosul (n. 591) — un tafsir grande y uno pequeño, maestro de qurra'; Dhahabi: 'el sultán y los de abajo lo visitaban; no se levantaba por nadie y no aceptaba nada' {cita: shadharat-dhahab pág. 642-643}."
  fr: "L'ermite-mufassir de Mossoul de Kawasha (né en 591) — un grand et un petit tafsir, maître de qurra'; Dhahabi: « le sultan et ceux d'en bas lui ont rendu visite; il ne s'est levé pour personne et n'a rien accepté » {cite: shadharat-dhahab p. 642-643}."
  ur: "موصل کا مرجع مفسر کاواشا ⁦(متوفی 591)⁩ - ایک بڑی اور ایک چھوٹی تفسیر، قراء ماسٹر؛ ذہبی: 'سلطان اور نیچے والے اس کی عیادت کرتے تھے۔ وہ کسی کے لیے اٹھ کھڑا ہوا اور کچھ بھی قبول نہیں کیا۔ 642-643}۔"
