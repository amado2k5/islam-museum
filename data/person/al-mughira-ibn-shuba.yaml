  did_you_know:
    ar: "المغيرة بن شعبة الثقفي عُرف بدهائه؛ تقدم بالكرزن فضرب باب اللات يوم هدمها سنة ٩هـ بعد أن سقط يمازح أصحابه فأُرعب أهل الطائف ظناً أنه قُتل."
    en: "Al-Mughira ibn Shu'ba the Thaqafi, known for his wit, led the strike on al-Lat's gate when it was razed in year 9 — he had tumbled off it in jest, and the people of al-Ta'if panicked thinking him dead."
