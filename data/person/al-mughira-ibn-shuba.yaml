summary:
  en: "Thaqafi Companion renowned for wit and statecraft; he broke the gate of al-Lat with the pickaxe during its demolition in 9 AH, first feigning a collapse that struck terror into the watching Thaqafis."
  ar: "صحابي ثقفي عُرف بدهائه ومكره السياسي؛ تقدّم بالكُرزُن فضرب باب اللات يوم هدمها سنة 9هـ بعد أن سقط يمازح أصحابه فأُرعب أهل الطائف ظناً أن «الربة» قتلته.، وسفارته إلى ذي الجناحين قبل نهاوند: جعل يطعن برمحه في بسطهم ليغضبهم ثم وثب فقعد مع الملك على سريره فلما لكزوه قال إنا لا نفعل برسلكم هكذا فإن كنت فجرت واستخففت فلا تؤاخذوني، وقال للملك بل نقطع إليكم {cite:muruj-al-dhahab p. 618}، وجاء علياً فأشار عليه بإقرار معاوية وعمال عثمان على أعمالهم حتى تأتي طاعتهم، فلما خرج من الغد قال إنما الرأي أن تعاجلهم بالنزع فتعرف السامع من غيره، فقال له ابن عباس أما أمس فقد نصحك وأما اليوم فقد غشك، وذكر عنه أنه قال نصحته فلم يقبل فغششته، وقال علي لا والله لا أستعمل معاوية يومين أبداً {cite:muruj-al-dhahab p. 647-649}"
