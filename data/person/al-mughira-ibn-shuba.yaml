summary:
  en: "Thaqafi Companion renowned for wit and statecraft; he broke the gate of al-Lat with the pickaxe during its demolition in 9 AH, first feigning a collapse that struck terror into the watching Thaqafis."
  fr: "Thaqafi Compagnon réputé pour son esprit et son art de gouverner ; il a brisé la porte d'al-Lat avec la pioche lors de sa démolition en 9 de l’hégire, feignant d'abord un effondrement qui a frappé la terreur dans les Thaqafis observateurs."
  ar: "صحابي ثقفي عُرف بدهائه ومكره السياسي؛ تقدّم بالكُرزُن فضرب باب اللات يوم هدمها سنة 9هـ بعد أن سقط يمازح أصحابه فأُرعب أهل الطائف ظناً أن «الربة» قتلته. وسفارته إلى ذي الجناحين قبل نهاوند: جعل يطعن برمحه في بسطهم ليغضبهم ثم وثب فقعد مع الملك على سريره فلما لكزوه قال إنا لا نفعل برسلكم هكذا فإن كنت فجرت واستخففت فلا تؤاخذوني، وقال للملك بل نقطع إليكم {cite:muruj-al-dhahab p. 618}، وجاء علياً فأشار عليه بإقرار معاوية وعمال عثمان على أعمالهم حتى تأتي طاعتهم، فلما خرج من الغد قال إنما الرأي أن تعاجلهم بالنزع فتعرف السامع من غيره، فقال له ابن عباس أما أمس فقد نصحك وأما اليوم فقد غشك، وذكر عنه أنه قال نصحته فلم يقبل فغششته، وقال علي لا والله لا أستعمل معاوية يومين أبداً {cite:muruj-al-dhahab p. 647-649}، ونصح علياً بعد بيعته أن يستعمل طلحة على الكوفة والزبير على البصرة ويبعث إلى معاوية بعهده على الشام حتى تلزمه طاعته فأبى وقال لا والله لا يراني الله استعين به ما دام على حاله، فانصرف مغضباً وأنشد نصحت علياً في ابن هند مقالة فردت، وكاتبه معاوية بعد الجمل أن قد ظهر من رأي ابن أبي طالب ما تقدم من وعده لك في طلحة والزبير {cite:muruj-al-dhahab p. 665-666}، وهو راوي حديث قيام النبي حتى انتفخت قدماه وجوابه «أفلا أكون عبداً شكوراً» {cite:sahih-muslim 2820}"
  ur: "ثقیف کے صحابی جو سیاسی تدبیر کے لیے معروف تھے؛ موجودہ عربی روایت میں لات کے انہدام، نہاوند سے پہلے سفارت اور علی کو صوبائی عمال کے بارے میں ان کے مشوروں کا ذکر ہے۔ {cite:mubarakpuri-raheeq}"
  es: "Thaqafi Companion, reconocido por su ingenio y habilidad política, rompió la puerta de al-Lat con un pico durante su demolición en el año 9 de la Hégira, fingiendo primero un derrumbe que aterrorizó a los Thaqafi que observaban."
  tr: "Kurnazlığı ve siyasi kurnazlığıyla tanınan bir Tekafi sahabesi; Kerzan ile ilerledi ve 9 Hicri'de düştükten sonra Bab al-Lat'ın yıkıldığı gün onu çaldı; yoldaşlarıyla şaka yaparak, 'Rab'in onu öldürdüğünü düşünerek Taif halkını korkuttu. Ve Dhu al-Janahyn'e yaptığı elçiliği, Nahavand'dan önce: Mızraklarını saplayarak onları kızdırmaya başladı, sonra atlayıp kralın yatağına oturdu. Onlar ona vurduklarında, 'Bunu elçilerinize yapmayız. Eğer saygısız ve dikkatsiz isem, beni hesap verme.' dedi. Krala dedi ki, 'Bunun yerine sizden koparacağız.' {atıf:Muruj-al-Dhahab, s. 618} Sonra Ali geldi ve Muaviye ile Uthman'ın vekillerine, itaatleri gelene kadar yaptıklarını onaylamalarını işaret etti. Ertesi gün ayrıldığında dedi ki: Tek yol, onları hızla uzaklaştırmaktır ki dinleyici diğerlerinden tanınsın. İbn Abbas ona dedi ki, 'Şey... Dün sana tavsiye verdi, ama bugün seni kandırdı. Ali'nin ona öğüt verdiğini söylediği ama kabul etmediği, bu yüzden onu kandırdığı belirtildi. Ali, 'Hayır, Allah'a yemin ederim, Muaviy'yi asla iki günlüğüne atamayacağım {cite:muruj-al-dhahab s. 647-649} dedi. Yemin ettikten sonra Ali, Talha'yı Kufa'nın üstüne, Al-Zubeyr'i Basra'nın üzerine atamasını ve Muaviyet'i Levant'a göndermesini, itaat etmek zorunda kalana kadar göndermesini tavsiye etti, ancak o reddetti ve 'Hayır, Allah aşkına, o halde olduğu sürece onu görmeyeceğim.' dedi. Öfkeyle ayrıldı ve Muaviye tarafından yazılmış 'Ali'ye İbn Hind'de öğüt verdim' adlı bir makaleyi okudu. Cezadan sonra, İbn Ebi Talib'in görüşünden, Talha ve el-Zubeyr hakkında size daha önce ne vaat ettiğini anlaşılmıştır {cite:muruj-al-dhahab s. 665-666} ve Peygamber'in durusunu ayakları şişene kadar anlatır ve cevabı, \"Minnettar bir hizmetkar olmamalı mıyım?\" olmuştur. {cite:sahih-muslim 2820}"
  id: "Seorang sahabat Thaqafi yang dikenal dengan kecerdikan dan kecerdikan politiknya; ia maju bersama Kerzan dan mengetuk Bab al-Lat pada hari kota itu dihancurkan pada tahun 9 H setelah ia jatuh, bercanda dengan teman-temannya, membuat rakyat Taif ketakutan karena mengira 'Tuhan' telah membunuhnya. Dan utusannya kepada Dhu al-Janahyn di hadapan Nahavand: Dia mulai menusuk tombak mereka untuk membuat mereka marah, lalu melompat dan duduk bersama raja di ranjangnya. Ketika mereka memukulnya, dia berkata, 'Kami tidak melakukan ini kepada utusanmu. Jika aku tidak sopan dan ceroboh, jangan salahkan aku.' Dia berkata kepada raja, 'Sebaliknya, kami akan memutuskan hubungan darimu.' {cite:muruj-al-dhahab, hlm. 618} Kemudian Ali datang dan memberi isyarat kepada para agen Muawiyah dan Uthman untuk menyetujui perbuatan mereka sampai ketaatan mereka datang. Ketika dia pergi keesokan harinya, dia berkata: Satu-satunya cara adalah dengan segera mengeluarkan mereka agar pendengar dapat dikenali dari yang lain. Ibn Abbas berkata kepadanya, 'Um... Kemarin dia menasihatimu, tetapi hari ini dia menipumu. Disebutkan bahwa Ali berkata dia menasihatinya tetapi tidak menerima, maka dia menipunya. Ali berkata, 'Tidak, demi Tuhan, aku tidak akan pernah mengangkat Muawiya selama dua hari sama sekali {cite:muruj-al-dhahab hlm. 647-649}. Setelah sumpahnya, Ali menyarankan untuk mengangkat Talha atas Kufa dan Al-Zubair atas Basra, serta mengirim Muawiyah dengan janjinya ke atas Levant sampai dia terpaksa mematuhinya, tetapi dia menolak dan berkata, 'Tidak, demi Tuhan, aku tidak akan menemuinya selama dia masih dalam keadaannya.' Dia pergi dengan marah dan mengucapkan 'Aku menasihati Ali dalam Ibn Hind' sebuah artikel yang diulang, ditulis oleh Muawiya Setelah kalimat, dari pendapat Ibn Abi Talib menjadi jelas apa yang sebelumnya dijanjikan kepada Anda mengenai Talha dan al-Zubayr {cite:muruj-al-dhahab hlm. 665-666}, dan ia menceritakan hadits tentang kedudukan Nabi hingga kakinya membengkak, dan jawabannya adalah, \"Bukankah aku harus menjadi hamba yang bersyukur?\" {cite:sahih-muslim 2820}"
