summary:
  ar: "بنّاء سلام وعالم اجتماع من أصل بنغلاديشي مقيم في بانكوك؛ شارك في تأسيس الشبكة الآسيوية للعمل الإسلامي ⁦(AMAN، 1990)⁩ والمؤسسة الآسيوية للموارد ⁦(ARF، 1996)⁩ ويشغل أمينها العام، وهو مدير مشارك لمدرسة دراسات السلام وتحويل النزاعات في بانكوك، ونسّق المنتدى الثقافي الآسيوي للتنمية ⁦(ACFOD)⁩ في التسعينيات وحرّر كتبًا في حقوق الإنسان والحوار بين الأديان."
  en: "Bangladeshi-born peacebuilder and scholar based in Bangkok. He co-founded the Asian Muslim Action Network ⁦(AMAN, 1990)⁩ and the Asian Resource Foundation ⁦(ARF, 1996)⁩, of which he is Secretary General, is co-director of Bangkok's School of Peace Studies and Conflict Transformation, coordinated the Asian Cultural Forum on Development ⁦(ACFOD)⁩ in the 1990s, and has edited volumes on human rights and interfaith dialogue in Asia."
  ur: "بنگلادیشی نژاد ماہرِ سماجیات اور صلح ساز، بانکاک میں مقیم۔ ایشین مسلم ایکشن نیٹ ورک ⁦(AMAN، 1990)⁩ اور ایشین ریسورس فاؤنڈیشن ⁦(ARF، 1996)⁩ کے شریک بانی اور جنرل سیکریٹری، بانکاک کے اسکول آف پیس اسٹڈیز اینڈ کنفلکٹ ٹرانسفارمیشن کے شریک ڈائریکٹر، 1990ء کی دہائی میں ایشین کلچرل فورم آن ڈیولپمنٹ ⁦(ACFOD)⁩ کے کوآرڈینیٹر، اور انسانی حقوق و بین المذاہب مکالمے پر کئی کتابوں کے مدیر۔"
  es: "Constructor de paz y académico nacido en Bangladesh y residente en Bangkok. Cofundó la Red de Acción Musulmana Asiática (AMAN, 1990) y la Fundación de Recursos Asiáticos (ARF, 1996), de la cual es Secretario General; es codirector de la Escuela de Estudios de Paz y Transformación de Conflictos de Bangkok; coordinó el Foro Cultural Asiático sobre el Desarrollo (ACFOD) en la década de 1990; y ha editado volúmenes sobre derechos humanos y diálogo interreligioso en Asia."
