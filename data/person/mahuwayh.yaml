summary:
  ar: "مرزبان مرو؛ عند البلاذري تلقى يزدجرد معظماً مبجلاً فلما أمر بمحاسبته وسأله عن الأموال كتب إلى نيزك يحرضه عليه وتضافرا على قتله."
  en: "Marw's marzban; in al-Baladhuri, who honored the fleeing Yazdgard, then — ordered to account — incited Nizak Tarkhan and joined his killing."
  es: "Marw's marzban; en al-Baladhuri, quien honró al fugitivo Yazdgard, luego, obligado a rendir cuentas, incitó a Nizak Tarkhan y se unió a su asesinato."
  fr: "Le marzban de Marw; dans al-Baladhuri, qui a honoré le fuyard Yazdgard, puis — sommé de rendre des comptes — a incité Nizak Tarkhan et s'est joint à son meurtre."
  ur: "مرو کا مرزبان؛ البلادھوری میں، جس نے فرار ہونے والے یزدگرد کی عزت کی، پھر - حساب کا حکم دیا - نزاک ترکھان کو اکسایا اور اس کے قتل میں شامل ہوگیا۔"
  tr: "Marw Marzbanı; el-Baladhuri ile birlikte Yazdegerd saygın ve onurlu bir figür kazandı. Hesap vermesini emrettiğinde ve parayı sorduğunda, Nizak'a kendisine karşı onu kışkırtan bir mektup yazdı ve birlikte onu öldürmek için güçlerini birleştirdiler."
  id: "Marzban Marw; bersama al-Baladhuri, Yazdegerd menerima sosok yang dihormati dan terhormat. Ketika ia memerintahkan pertanggungjawabannya dan menanyakan tentang uang itu, ia menulis surat kepada Nizak menghasutnya untuk melawannya, dan mereka bergabung untuk membunuhnya."
