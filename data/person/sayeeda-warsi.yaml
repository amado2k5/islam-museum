summary:
  ar: "سعيدة حسين وارسي، البارونة وارسي (وُلدت في 28 آذار 1971 في ديوزبري)، سياسية ومحامية بريطانية من أبوين مهاجرين باكستانيين. صارت عضوة في مجلس اللوردات سنة 2007، وشاركت في رئاسة حزب المحافظين (2010–2012)، وكانت أول مسلمة تخدم في مجلس الوزراء البريطاني، فشغلت منصب وزيرة دولة أولى للشؤون الخارجية ووزيرة الإيمان والمجتمعات، ثم استقالت من الحكومة في آب 2014 احتجاجًا على سياستها تجاه غزة، وغادرت حزب المحافظين سنة 2024."
  en: "Sayeeda Hussain Warsi, Baroness Warsi (born 28 March 1971 in Dewsbury) is a British politician and lawyer, the daughter of Pakistani immigrants. Raised to the peerage in 2007, she co-chaired the Conservative Party (2010-2012) and was the first Muslim to serve in the British Cabinet, as Senior Minister of State for Foreign and Commonwealth Affairs and Minister for Faith and Communities; she resigned from the government in August 2014 over its Gaza policy and left the Conservative Party in 2024."
  ur: "سعیدہ حسین وارثی، بیرونیس وارثی (پیدائش 28 مارچ 1971، ڈیوزبری) برطانوی سیاست دان اور وکیل ہیں، جو پاکستانی مہاجر والدین کی بیٹی ہیں۔ 2007 میں انہیں لارڈ بنایا گیا، وہ کنزرویٹو پارٹی کی مشترکہ چیئرمین رہیں (2010–2012) اور برطانوی کابینہ میں خدمات انجام دینے والی پہلی مسلمان بنیں، بطور سینئر وزیرِ مملکت برائے خارجہ و دولتِ مشترکہ امور اور وزیر برائے عقیدہ و برادریاں؛ اگست 2014 میں انہوں نے غزہ پر حکومتی پالیسی کی مخالفت میں استعفیٰ دیا اور 2024 میں کنزرویٹو پارٹی چھوڑ دی۔"

