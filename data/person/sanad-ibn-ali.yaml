label: { ar: "سند بن علي", en: "Sanad Ibn Ali" }
summary:
  ar: "سند بن علي الحاسب المنجم، قرأ ابن النديم بخط ابن الجهم أن كتاب المدخل سند بن علي وهبه لأبي معشر فانتحله أبو معشر لأن أبا معشر تعلم النجوم على كبر ولم يبلغ عقل أبي معشر صنعة هذا الكتاب ولا التسع المقلات في المواليد ولا الكتاب في القرانات المنسوب إلى ابن البازيار هذا كله لسند بن علي، وقد فسر سند إقليدس قرأ أبو علي منه تسع مقالات وبعض العاشرة {cite:fihrist-ibn-al-nadim p. 384-385}."
  en: "Sanad ibn Ali — the court astrologer whose Introduction Abu Ma'shar appropriated {cite:fihrist-ibn-al-nadim}"
