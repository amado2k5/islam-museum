summary:
  ar: "سند بن علي الحاسب المنجم، قرأ ابن النديم بخط ابن الجهم أن كتاب المدخل سند بن علي وهبه لأبي معشر فانتحله أبو معشر لأن أبا معشر تعلم النجوم على كبر ولم يبلغ عقل أبي معشر صنعة هذا الكتاب ولا التسع المقلات في المواليد ولا الكتاب في القرانات المنسوب إلى ابن البازيار هذا كله لسند بن علي، وقد فسر سند إقليدس قرأ أبو علي منه تسع مقالات وبعض العاشرة {cite:fihrist-ibn-al-nadim p. 384-385}."
  en: "Sanad ibn Ali — the court astrologer whose Introduction Abu Ma'shar appropriated {cite:fihrist-ibn-al-nadim}"
  es: "Sanad ibn Ali — el astrólogo de la corte cuya Introducción Abu Ma'shar se apropió {cite:fihrist-ibn-al-nadim}"
  fr: "Sanad ibn Ali — l'astrologue de la cour dont l'introduction a été reprise par Abu Ma'shar {cite:fihrist-ibn-al-nadim}"
  ur: "سناد ابن علی - درباری نجومی جس کا تعارف ابو معشر نے مختص کیا {حوالہ: فہرست ابن الندیم"
  tr: "Astrolog İbn Ali'nin zinciri. İbn al-Nadim, İbn al-Jahm'ın yazısında 'Al-Madkhal' kitabının İbn Ali tarafından Ebu Ma'shar'a hediye edildiğini okumuştur, ancak Ebu Ma'shar onu seçmiştir çünkü Abu Ma'shar astronomiyi ileri düzeyde öğrenmiştir ve Abu Ma'shar'ın zihni bu kitabın sanatına, ne Mevlid'deki dokuz Makalatı'na ne de İbn al-Baziyar'a atfedilen Kur'an kitabına ulaşmamıştır. Tüm bunlar İbn Ali'nin zincirine atfedilir. Evklid zinciri, Ebu Ali tarafından yorumlanmıştır; Ebu Ali dokuz risale ve onuncusundan bazılarını okudu {atıf:Fihrist-ibn-al-nadim s. 384-385}."
  id: "Rantai Ibn Ali sang ahli nujum. Ibn al-Nadim membaca dalam naskah Ibn al-Jahm bahwa kitab 'Al-Madkhal' diberikan oleh Ibn Ali kepada Abu Ma'shar, tetapi Abu Ma'shar memilihnya karena Abu Ma'shar mempelajari astronomi pada tingkat lanjut, dan pikiran Abu Ma'shar tidak mencapai keahlian buku ini, juga sembilan Maqalat tentang Mawlid, maupun buku Al-Qur'an yang dikaitkan dengan Ibn al-Baziyar. Semua ini dikaitkan dengan rantai Ibn Ali. Rantai Euclid ditafsirkan oleh Abu Ali dari mana Abu Ali membaca sembilan risalah dan beberapa yang kesepuluh {cite:fihrist-ibn-al-nadim hlm. 384-385}."
