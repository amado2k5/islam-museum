summary:
  ar: "الحسن بن علي بن يحيى بن تميم بن المعز بن باديس؛ آخر ملوك بني زيري بإفريقية؛ ولي وعمره اثنتا عشرة سنة وتسعة أشهر؛ وفي أيامه أخذ رجار الفرنجي صاحب صقلية طرابلس الغرب عنوة بالسيف في سادس المحرم سنة إحدى وأربعين وخمسمائة ثم أخذ المهدية في صفر سنة ثلاث وأربعين فخرج الحسن منها هارباً وقد اصطحب ما خف عليه حمله من النفائس فنزل على محرز بن زياد أحد أمراء العرب بالمعلقة ثم أضمر له صاحب بجاية الغدر فنزله الجزائر وأقام به حتى فتح عبد المؤمن بجاية سنة سبع وأربعين؛ وانقرضت بذلك دولة بني باديس بعد مائتي سنة وثمان سنين {cite:wafayat-ayan}."
  en: "Al-Hasan b. Ali (b. Rajab 502, Susa) — last Zirid king of Ifriqiya; enthroned at twelve, lost Tripoli (541) and al-Mahdiyya (543) to Roger II's fleet, fled to the Arabs' amir Mahriz b. Ziyad, was lured to Algiers by Bougie's ruler, and the Banu Badis state ended after 208 years {cite:wafayat-ayan}."
  es: "Al-Hasan b. Ali (n. Rajab 502, Susa) — último rey zirí de Ifriqiya; entronizado a los doce años, perdió Trípoli (541) y al-Mahdiyya (543) ante la flota de Roger II, huyó al emir árabe Mahriz b. Ziyad, fue atraído a Argel por el gobernante de Bougie, y el estado Banu Badis terminó después de 208 años {cite:wafayat-ayan}."
  fr: "Al-Hasan b. Ali (né en Rajab 502, Suse) — dernier roi Ziride d'Ifriqiya; intronisé à douze ans, perdit Tripoli (541) et al-Mahdiyya (543) face à la flotte de Roger II, s'enfuit auprès de l'émir arabe Mahriz b. Ziyad, fut attiré à Alger par le souverain de Bougie, et l'État des Banu Badis prit fin après 208 ans {cite:wafayat-ayan}."
  ur: "الحسن بی۔ علی ⁦(پیدائش رجب 502، سوسا)⁩ - افریقیہ کا آخری زرد بادشاہ؛ بارہ سال کی عمر میں تخت نشین ہوئے، طرابلس (541) اور المہدیہ (543) کو راجر دوم کے بحری بیڑے سے محروم کر کے عربوں کے امیر محریز بن کے پاس بھاگ گئے۔ زیاد کو بوگی کے حکمران نے الجزائر کی طرف راغب کیا، اور بنو بدیس کی ریاست 208 سال بعد ختم ہو گئی۔"
  tr: "El-Hasan ibn Ali ibn Yahya ibn Tamim ibn el-Muizz ibn Badis, Banu Ziri'nin İfrikiye'deki son kralı; on iki yaş dokuz aylıkken hüküm sürdü. Onun döneminde, Sicilya, Trablus, batı Frank tüccarları, 541 Hicri yılının altıncı Muharrem'inde zorla kılıçla esir alındılar, ardından 43 Hicri yılında Sefer'de Mehdiye'yi ele geçirdiler. El-Hasan oradan taşıyabileceği değerli eşyalarla kaçtı ve Al-Mu'allaka'daki Arap prenslerinden Muharrez ibn Ziyad'da kaldı. Sonra Bejaia hükümdarı onu sattı ve Cezayir'e yerleşti, Abdül-Mu'min 1947'de Bejaia'yı fethedene kadar orada kaldı; böylece Banu Badis devleti iki yüz sekiz yıl sonra sona erdi {atıf:wafayat-ayan}."
  id: "Al-Hasan ibn Ali ibn Yahya ibn Tamim ibn al-Mu'izz ibn Badis, raja terakhir Banu Ziri di Ifriqiya; ia memerintah pada usia dua belas tahun sembilan bulan. Pada masa pemerintahannya, para pedagang Franka, penguasa Sisilia, Tripoli, barat, ditangkap paksa dengan pedang pada tanggal enam Muharram tahun 541 H, kemudian merebut Mahdiya di Safar pada tahun 43 H. Al-Hasan melarikan diri dari sana membawa barang-barang berharga yang bisa ia bawa dan tinggal di Muharrez ibn Ziyad, salah satu pangeran Arab di Al-Mu'allaqa. Kemudian penguasa Bejaia mengkhianatinya, dan ia menetap di Algiers dan tinggal di sana hingga Abd al-Mu'min menaklukkan Bejaia pada tahun 1947; demikianlah negara Banu Badis berakhir setelah dua ratus delapan tahun {cite:wafayat-ayan}."
