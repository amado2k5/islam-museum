summary:
  ar: "الحسن بن علي بن يحيى بن تميم بن المعز بن باديس؛ آخر ملوك بني زيري بإفريقية؛ ولي وعمره اثنتا عشرة سنة وتسعة أشهر؛ وفي أيامه أخذ رجار الفرنجي صاحب صقلية طرابلس الغرب عنوة بالسيف في سادس المحرم سنة إحدى وأربعين وخمسمائة ثم أخذ المهدية في صفر سنة ثلاث وأربعين فخرج الحسن منها هارباً وقد اصطحب ما خف عليه حمله من النفائس فنزل على محرز بن زياد أحد أمراء العرب بالمعلقة ثم أضمر له صاحب بجاية الغدر فنزله الجزائر وأقام به حتى فتح عبد المؤمن بجاية سنة سبع وأربعين؛ وانقرضت بذلك دولة بني باديس بعد مائتي سنة وثمان سنين {cite:wafayat-ayan}."
  en: "Al-Hasan b. Ali (b. Rajab 502, Susa) — last Zirid king of Ifriqiya; enthroned at twelve, lost Tripoli (541) and al-Mahdiyya (543) to Roger II's fleet, fled to the Arabs' amir Mahriz b. Ziyad, was lured to Algiers by Bougie's ruler, and the Banu Badis state ended after 208 years {cite:wafayat-ayan}."
