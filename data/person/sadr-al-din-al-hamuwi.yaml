summary:
  ar: "شيخ الشيوخ؛ قدم على الذهبي في الشام سنة خمس وتسعين طالباً للحديث فسمع الكثير وروى عن أصحاب المؤيد الطوسي، وأخبر أن ملك التتار غازان بن أرغون أسلم على يده بواسطة نائبه نوروز وكان يوماً مشهوداً {cite:shadharat-dhahab p. 748}."
  en: "Shaykh al-shuyukh — Dhahabi's eyewitness visitor in 695 who reported that the Mongol khan Ghazan took Islam at his hand through the na'ib Nawruz, 'a witnessed day' {cite:shadharat-dhahab p. 748}."
  es: "Shaykh al-shuyukh — Visitante de Dhahabi que presenció el suceso en 695 y que informó que el khan mongol Ghazan tomó el Islam de su mano a través del na'ib Nawruz, 'un día presenciado' {cite:shadharat-dhahab p. 748}."
  fr: "Cheikh al-shuyukh — Visiteur témoin oculaire de Dhahabi en 695 qui a rapporté que le khan mongol Ghazan s'est converti à l'islam par son intermédiaire lors du na'ib Nawruz, « un jour témoigné » {cite: shadharat-dhahab p. 748}."
  ur: "شیخ الشیوخ - ذہبی کا عینی شاہد 695 میں دیکھنے والا جس نے بتایا کہ منگول خان غزن نے نائب نوروز کے ذریعے اسلام کو اپنے ہاتھ میں لیا، 'ایک گواہی کا دن'۔ 748}۔"
  tr: "Şeyh al-Şüyukh; doksan beşinci yılda Levant'taki al-Dhahabi'ye hadis öğrencisi olarak gelmiştir. Al-Mu'eyyad al-Tusi'nin sahabelerinden çok şey duymuş ve rivayet etmiş, Tatar kralı Gazan bin Arghun'un vekil Nevruz aracılığıyla İslam'ı benimsediğini ve bunun önemli bir gün olduğunu bildirmiştir {atıf:shadharat-dhahab, s. 748}."
  id: "Shaykh al-Shuyukh; ia datang ke al-Dhahabi di Levant pada tahun sembilan puluh lima sebagai murid hadits. Ia banyak mendengar dan menceritakan dari para sahabat al-Mu'ayyad al-Tusi, dan memberitahu bahwa raja Tatar, Ghazan ibn Arghun, memeluk Islam melalui wakilnya Nowruz, dan itu adalah hari yang penting {cite:shadharat-dhahab, hlm. 748}."
