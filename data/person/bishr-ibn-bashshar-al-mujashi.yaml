summary:
  ar: "بشر بن بشار المجاشعي، كان من العابدين، لقي ببيت المقدس ثلاثة عُبّاد فسمع منهم وصايا في التسليم للقدر، وفي طلب رضوان الله بترك مناهيه، وفي ترك التدبير دون تدبيره."
  en: "Bishr ibn Bashshar al-Mujashi'i, one of the worshippers, who met three worshippers in Jerusalem and heard from each a counsel: submission to the decree, seeking God's pleasure by leaving what He forbids, and not managing one's affairs apart from His management."
  ur: "بشر بن بشار مجاشعی عابدوں میں سے تھے۔ بیت المقدس میں تین عابدوں سے ملے اور ہر ایک سے نصیحت سنی: تقدیر کے سامنے سپردگی، منع کی گئی چیزوں کو چھوڑ کر اللہ کی رضا طلب کرنا، اور اپنے معاملات کی تدبیر اللہ کی تدبیر کے بغیر نہ کرنا۔"
