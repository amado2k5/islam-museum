summary:
  ar: "شهدة بنت أبي نصر أحمد بن الفرج الدينوري البغدادية الكاتبة المسندة فخر النساء؛ كانت دينة عابدة صالحة سمعها أبوها الكثير وصارت مسندة العراق وروت عن طراد وابن البطر وطائفة وكانت ذات بر وخير؛ توفيت في أواخر المحرم سنة أربع وسبعين وخمسمائة عن نيف وتسعين سنة {cite:shadharat-dhahab p. 728}."
  en: "Shuhdah bint Abi Nasr al-Dinuri of Baghdad, the calligrapher-musnida 'Pride of Women'; devout and righteous, her father had her hear much hadith and she became the musnida of Iraq, transmitting from Turad and Ibn al-Batr among others; d. late Muharram 574 at ninety-odd {cite:shadharat-dhahab p. 728}."
