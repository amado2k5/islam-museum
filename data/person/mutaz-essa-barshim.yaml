summary:
  ar: "لاعب وثب عال قطري من أصل سوداني، وُلد في الدوحة سنة 1991، تخرج في أكاديمية أسباير، وهو ثاني أعلى قافز في التاريخ بأفضل قفزة شخصية 2.43 مترا، وبطل العالم ثلاث مرات ⁦(لندن 2017 والدوحة 2019 ويوجين 2022)⁩، وبطل أولمبي في طوكيو 2020 إذ تقاسم الذهبية مع الإيطالي جانماركو تامبيري في لحظة أولمبية نادرة، ونال أيضا فضيتي لندن 2012 ⁦(بعد ترقية برونزيته سنة 2021)⁩ وريو 2016 وبرونزية باريس 2024 فأكمل مجموعتين من الميداليات الأولمبية، ويحمل الرقم القياسي الآسيوي في الوثب العالي، ويدربه البولندي السويدي ستانيسلاف شتشيربا منذ سنة 2009."
  en: "Qatari high jumper of Sudanese origin, born in Doha in 1991 and a graduate of the Aspire Academy. He is the second-highest jumper of all time with a personal best of 2.43 metres, a three-time world champion (London 2017, Doha 2019, Eugene 2022), and the Tokyo 2020 Olympic champion, where he shared the gold medal with Italy's Gianmarco Tamberi in a rare moment of Olympic agreement. He also holds silver medals from London 2012 (promoted from bronze in 2021) and Rio 2016 and a bronze from Paris 2024, holds the Asian high jump record, and has been coached by Stanisław Szczyrba since 2009."
  ur: "سوڈانی نژاد قطری اونچی چھلانگ کے کھلاڑی، جو 1991 میں دوحہ میں پیدا ہوئے اور ایسپائر اکیڈمی کے فارغ التحصیل ہیں۔ وہ 2.43 میٹر کی ذاتی بہترین چھلانگ کے ساتھ تاریخ کے دوسرے بلند ترین چھلانگ باز ہیں، تین مرتبہ عالمی چیمپئن رہے ⁦(لندن 2017، دوحہ 2019، یوجین 2022)⁩، اور ٹوکیو 2020 کے اولمپک چیمپئن ہیں جہاں انھوں نے اٹلی کے جان مارکو ٹامبیری کے ساتھ طلائی تمغا مشترکہ طور پر حاصل کیا۔ ان کے پاس لندن 2012 ⁦(جس کا کانسی کا تمغا 2021 میں چاندی میں تبدیل ہوا)⁩ اور ریو 2016 کی چاندی اور پیرس 2024 کا کانسی کا تمغا بھی ہے، وہ ایشیائی ریکارڈ کے حامل ہیں، اور 2009 سے ان کے کوچ ستانی سلاف شزیربا ہیں۔"
  es: "Saltador de altura catarí de origen sudanés, nacido en Doha en 1991 y graduado de la Academia Aspire. Es el segundo saltador más alto de todos los tiempos con una mejor marca personal de 2,43 metros, tres veces campeón del mundo (Londres 2017, Doha 2019, Eugene 2022) y campeón olímpico de Tokio 2020, donde compartió la medalla de oro con el italiano Gianmarco Tamberi en un raro momento de acuerdo olímpico. También cuenta con medallas de plata de Londres 2012 (ascendió del bronce en 2021) y Río 2016, y un bronce de París 2024, posee el récord asiático de salto de altura y ha sido entrenado por Stanisław Szczyrba desde 2009."
  fr: "Sauteur en hauteur qatari d'origine soudanaise, né à Doha en 1991 et ancien élève de l'Académie Aspire, il est le deuxième meilleur sauteur en hauteur de tous les temps avec un record personnel de 2,43 mètres. Triple champion du monde (Londres 2017, Doha 2019, Eugene 2022), il a également remporté l'or aux Jeux olympiques de Tokyo 2020, ex aequo avec l'Italien Gianmarco Tamberi, un rare moment d'entente olympique. Médaillé d'argent à Londres en 2012 (après avoir remporté le bronze en 2021) et à Rio en 2016, ainsi que du bronze à Paris en 2024, il détient le record d'Asie du saut en hauteur et est entraîné par Stanisław Szczyrba depuis 2009."
  tr: "Sudan kökenli Katar yüksek atlayıcısı olan Sher, 1991'de Doha doğumlu, Aspire Academy'den mezun olmuş ve kişisel en iyi derecesi olan 2.43 metre ile tarihin en yüksek ikinci atlayıcısıdır. Üç kez dünya şampiyonu (Londra 2017, Doha 2019 ve Eugene 2022) ve Tokyo 2020 Olimpiyat şampiyonudur; nadir bir olimpiyat anında İtalyan Gianmarco Tamperi ile altın madalyayı paylaşmıştır. Ayrıca Londra 2012'de (2021'de bronz terfi ettikten sonra) ve Rio 2016 ile Paris'te iki set Olimpiyat madalyası kazanmıştır. Yüksek atlamada Asya rekorunu elinde tutmaktadır ve 2009'dan beri Polonya-İsveçli Stanisław Szczęba tarafından çalıştırılmaktadır."
  id: "Pelompat tinggi asal Qatar asal Sudan, lahir di Doha pada tahun 1991, ia lulus dari Aspire Academy dan merupakan pelompat tertinggi kedua dalam sejarah dengan rekor pribadi 2,43 meter. Ia adalah juara dunia tiga kali (London 2017, Doha 2019, dan Eugene 2022), serta juara Olimpiade di Tokyo 2020, berbagi medali emas dengan pembalap Italia Gianmarco Tamperi dalam momen langka di Olimpiade. Ia juga meraih medali perak di London 2012 (setelah promosi perunggu pada 2021) dan Rio 2016 serta Paris 2024, menyelesaikan dua set medali Olimpiade. Ia memegang rekor Asia di lompat tinggi dan telah dilatih oleh Stanisław Szczęba dari Polandia-Swedia sejak 2009."
