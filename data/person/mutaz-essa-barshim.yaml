summary:
  ar: "لاعب وثب عال قطري من أصل سوداني، وُلد في الدوحة سنة 1991، تخرج في أكاديمية أسباير، وهو ثاني أعلى قافز في التاريخ بأفضل قفزة شخصية 2.43 مترا، وبطل العالم ثلاث مرات (لندن 2017 والدوحة 2019 ويوجين 2022)، وبطل أولمبي في طوكيو 2020 إذ تقاسم الذهبية مع الإيطالي جانماركو تامبيري في لحظة أولمبية نادرة، ونال أيضا فضيتي لندن 2012 (بعد ترقية برونزيته سنة 2021) وريو 2016 وبرونزية باريس 2024 فأكمل مجموعتين من الميداليات الأولمبية، ويحمل الرقم القياسي الآسيوي في الوثب العالي، ويدربه البولندي السويدي ستانيسلاف شتشيربا منذ سنة 2009."
  en: "Qatari high jumper of Sudanese origin, born in Doha in 1991 and a graduate of the Aspire Academy. He is the second-highest jumper of all time with a personal best of 2.43 metres, a three-time world champion (London 2017, Doha 2019, Eugene 2022), and the Tokyo 2020 Olympic champion, where he shared the gold medal with Italy's Gianmarco Tamberi in a rare moment of Olympic agreement. He also holds silver medals from London 2012 (promoted from bronze in 2021) and Rio 2016 and a bronze from Paris 2024, holds the Asian high jump record, and has been coached by Stanisław Szczyrba since 2009."
  ur: "سوڈانی نژاد قطری اونچی چھلانگ کے کھلاڑی، جو 1991 میں دوحہ میں پیدا ہوئے اور ایسپائر اکیڈمی کے فارغ التحصیل ہیں۔ وہ 2.43 میٹر کی ذاتی بہترین چھلانگ کے ساتھ تاریخ کے دوسرے بلند ترین چھلانگ باز ہیں، تین مرتبہ عالمی چیمپئن رہے (لندن 2017، دوحہ 2019، یوجین 2022)، اور ٹوکیو 2020 کے اولمپک چیمپئن ہیں جہاں انھوں نے اٹلی کے جان مارکو ٹامبیری کے ساتھ طلائی تمغا مشترکہ طور پر حاصل کیا۔ ان کے پاس لندن 2012 (جس کا کانسی کا تمغا 2021 میں چاندی میں تبدیل ہوا) اور ریو 2016 کی چاندی اور پیرس 2024 کا کانسی کا تمغا بھی ہے، وہ ایشیائی ریکارڈ کے حامل ہیں، اور 2009 سے ان کے کوچ ستانی سلاف شزیربا ہیں۔"
