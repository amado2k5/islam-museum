summary:
  ar: "دبلوماسي سوري وعضو في حزب البعث، وزير خارجية سوريا من 2006 حتى وفاته سنة 2020 ونائب رئيس مجلس الوزراء من 2012. مثّل سوريا سفيرًا لدى الولايات المتحدة (1990–2000) وكان الوجه الدبلوماسي للنظام خلال الحرب الأهلية."
  en: "Syrian diplomat and Ba'ath Party member, foreign minister of Syria from 2006 until his death in 2020 and deputy prime minister from 2012. He served as ambassador to the United States (1990–2000) and was the regime's diplomatic face during the civil war."
  ur: "شامی سفارت کار اور بعث پارٹی کے رکن، 2006 سے 2020 میں اپنی وفات تک شام کے وزیر خارجہ اور 2012 سے نائب وزیر اعظم رہے۔ وہ امریکہ میں شام کے سفیر (1990–2000) رہے اور خانہ جنگی کے دوران حکومت کا سفارتی چہرہ تھے۔"
  es: "Diplomático sirio y miembro del Partido Baaz, ministro de Asuntos Exteriores de Siria desde 2006 hasta su fallecimiento en 2020 y viceprimer ministro desde 2012. Fue embajador en Estados Unidos (1990-2000) y representó diplomáticamente al régimen durante la guerra civil."
  fr: "Diplomate syrien et membre du parti Baas, ministre des Affaires étrangères de Syrie de 2006 jusqu'à sa mort en 2020 et vice-Premier ministre à partir de 2012. Il a été ambassadeur aux États-Unis (1990-2000) et a été le visage diplomatique du régime pendant la guerre civile."
  tr: "Suriyeli diplomat ve Baas Partisi üyesi, 2006'dan 2020'deki ölümüne kadar Suriye Dışişleri Bakanı ve 2012'den itibaren Başbakan Yardımcısı olarak görev yaptı. 1990–2000 yılları arasında Amerika Birleşik Devletleri büyükelçisi olarak Suriye'yi temsil etti ve iç savaş sırasında rejimin diplomatik yüzü oldu."
  id: "Seorang diplomat Suriah dan anggota Partai Baath, Menteri Luar Negeri Suriah dari 2006 hingga wafatnya pada 2020, dan Wakil Perdana Menteri sejak 2012. Ia mewakili Suriah sebagai duta besar untuk Amerika Serikat (1990–2000) dan menjadi wajah diplomatik rezim selama perang saudara."
