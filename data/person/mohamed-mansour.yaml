summary:
  ar: "محمد منصور (وُلد في كانون الثاني 1948 في الإسكندرية)، رجل أعمال مصري بريطاني يرأس مجموعة منصور التي أسسها والده لطفي منصور وقادها منذ وفاته سنة 1976. شغل منصب وزير النقل في مصر بين 2005 و2009، وأسس شركة مان كابيتال في لندن، وحصل على لقب فارس سنة 2024، وهو مالك نادي سان دييغو في الدوري الأميركي لكرة القدم."
  en: "Mohamed Mansour (born January 1948 in Alexandria) is an Egyptian-British businessman who chairs the Mansour Group, founded by his father Loutfy Mansour and led by Mohamed Mansour since his father's death in 1976. He served as Egypt's Minister of Transportation from 2005 to 2009, founded Man Capital in London, was knighted in 2024, and owns the Major League Soccer club San Diego FC."
  ur: "محمد منصور (پیدائش جنوری 1948، اسکندریہ) مصری برطانوی تاجر ہیں جو منصور گروپ کے چیئرمین ہیں؛ یہ گروپ ان کے والد لطفی منصور نے قائم کیا اور 1976 میں ان کی وفات کے بعد محمد منصور اس کی قیادت کر رہے ہیں۔ وہ 2005 سے 2009 تک مصر کے وزیرِ نقل و حمل رہے، لندن میں مان کیپٹل کی بنیاد رکھی، 2024 میں نائٹ کا خطاب پایا اور امریکی میجر لیگ ساکر کلب سان ڈیاگو ایف سی کے مالک ہیں۔"

