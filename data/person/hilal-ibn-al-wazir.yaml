summary:
  ar: "هلال بن الوزير، الممتدل المستجير إلى مولاه العليم الخبير. روى خير النساج أنه كان معه فنظر إلى غلام، فدعا الله أن يغفر له ما كدح على نفسه من سوء نظره، وأن يكون الله شاهدًا على أفعاله."
  en: "Hilal ibn al-Wazir al-Sufi, who sought refuge in his Lord, the All-Knowing; Khayr al-Nassaj relates that when Hilal looked at a youth, he prayed to God as witness of deeds and what the eyes hide, asking forgiveness for what he had brought upon himself by that bad look."
  ur: "ہلال بن الوزیر صوفی، جو اپنے علیم و خبیر آقا کی پناہ لیتے تھے۔ خیر نساج نقل کرتے ہیں کہ ہلال نے ایک نوجوان کی طرف دیکھا تو اللہ سے دعا کی کہ وہ ان کے اعمال اور آنکھوں کے چھپے ہوئے رازوں کا گواہ ہے، اور اس بری نظر سے اپنے نفس پر جو بوجھ ڈالا اسے معاف کر دے۔"
