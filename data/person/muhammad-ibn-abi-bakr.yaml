id: person/muhammad-ibn-abi-bakr
class: person
label: { ar: "محمد بن أبي بكر الصديق" }
summary:
  ar: "ابن أبي بكر، ولد يوم دفع النبي من جحفة إلى مكة في حجة الوداع سمي بذلك؛ أشار به أهل مصر على عثمان عاملاً عليهم فكتب عهده وخرج معهم من المدينة، فلما ظهر كتاب عامل مصر المخبوء في الإداوة رجع وختم الكتاب وكان ممن تسور دار عثمان فأخذ بلحيته فقال له عثمان لو رآك أبوك لساءه مكانك مني فتراخت يده وقام تائباً وأقر لعلي أنه دخل يريد قتله ولم يقتله {cite:tarikh-khulafa-minhaj-1434 p. 272-275}. وفي رواية المسعودي كان ممن دخل على عثمان فأخذه بلحيته فقال له يا محمد والله لو رآك أبوك لساءه مكانك فتراخت يده وخرج، وقال هو والله لقد دخلت عليه وأنا أريد قتله فلما خاطبني بما قال خرجت ولا أعلم بتخلف الرجلين عني {cite:muruj-al-dhahab p. 638-639}"
  en: "Son of Abu Bakr, born on the Farewell Pilgrimage as the Prophet set out from al-Juhfa for Mecca and named for him. The Egyptians proposed him to Uthman as their governor and he rode out with them bearing his commission; when the hidden letter to Egypt's governor was found in the water-skin he returned, sealed it before witnesses, and was among those who scaled Uthman's house — he seized Uthman's beard, but when Uthman said 'had your father seen you he would have disliked your station over me' his hand slackened and he withdrew repentant, later confessing to Ali that he had entered meaning to kill him but had not done so {cite:tarikh-khulafa-minhaj-1434 p. 272-275}."
