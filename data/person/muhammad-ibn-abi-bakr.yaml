id: person/muhammad-ibn-abi-bakr
class: person
label: { ar: "محمد بن أبي بكر الصديق" }
summary:
  ar: "ابن أبي بكر، ولد يوم دفع النبي من جحفة إلى مكة في حجة الوداع سمي بذلك؛ أشار به أهل مصر على عثمان عاملاً عليهم فكتب عهده وخرج معهم من المدينة، فلما ظهر كتاب عامل مصر المخبوء في الإداوة رجع وختم الكتاب وكان ممن تسور دار عثمان فأخذ بلحيته فقال له عثمان لو رآك أبوك لساءه مكانك مني فتراخت يده وقام تائباً وأقر لعلي أنه دخل يريد قتله ولم يقتله {cite:tarikh-khulafa-minhaj-1434 p. 272-275}. وفي رواية المسعودي كان ممن دخل على عثمان فأخذه بلحيته فقال له يا محمد والله لو رآك أبوك لساءه مكانك فتراخت يده وخرج، وقال هو والله لقد دخلت عليه وأنا أريد قتله فلما خاطبني بما قال خرجت ولا أعلم بتخلف الرجلين عني {cite:muruj-al-dhahab p. 638-639}"
  en: "Son of Abu Bakr, born on the Farewell Pilgrimage as the Prophet set out from al-Juhfa for Mecca and named for him. The Egyptians proposed him to Uthman as their governor and he rode out with them bearing his commission; when the hidden letter to Egypt's governor was found in the water-skin he returned, sealed it before witnesses, and was among those who scaled Uthman's house — he seized Uthman's beard, but when Uthman said 'had your father seen you he would have disliked your station over me' his hand slackened and he withdrew repentant, later confessing to Ali that he had entered meaning to kill him but had not done so {cite:tarikh-khulafa-minhaj-1434 p. 272-275}."
  es: "Hijo de Abu Bakr, nació durante la Peregrinación de Despedida cuando el Profeta partió de al-Juhfa hacia La Meca y recibió su nombre. Los egipcios lo propusieron a Uthman como su gobernador y él partió con ellos portando su nombramiento; cuando se encontró la carta oculta al gobernador de Egipto en el odre de agua, regresó, la selló ante testigos y estuvo entre los que escalaron la casa de Uthman; agarró la barba de Uthman, pero cuando Uthman dijo \"si tu padre te hubiera visto, habría desaprobado tu posición sobre mí\", su mano se aflojó y se retiró arrepentido, confesando más tarde a Ali que había entrado con la intención de matarlo pero no lo había hecho {cite:tarikh-khulafa-minhaj-1434 p. 272-275}."
  fr: "Fils d'Abou Bakr, il naquit lors du Pèlerinage d'Adieu, alors que le Prophète partait d'al-Juhfa pour La Mecque, et reçut son nom. Les Égyptiens le proposèrent à Uthman comme gouverneur et il partit avec eux, porteur de sa commission. Lorsque la lettre cachée destinée au gouverneur d'Égypte fut découverte dans l'outre, il revint, la scella devant témoins et fut parmi ceux qui escaladèrent la maison d'Uthman. Il saisit la barbe d'Uthman, mais lorsque celui-ci lui dit: « Si ton père t'avait vu, il aurait désapprouvé ta position au-dessus de moi », sa main se relâcha et il se retira, repentant. Plus tard, il confessa à Ali qu'il était entré avec l'intention de le tuer, mais qu'il ne l'avait pas fait."
  ur: "ابوبکر کا بیٹا، حجۃ الوداع کے موقع پر پیدا ہوا جب نبی نے الجحفہ سے مکہ کے لیے روانہ ہوئے اور ان کے لیے نام رکھا۔ مصریوں نے اسے عثمان کے سامنے اپنا گورنر بنانے کی تجویز دی اور وہ ان کے ساتھ اپنی کمشن لے کر نکلا۔ جب مصر کے گورنر کو چھپا ہوا خط پانی کی کھال میں پایا گیا تو اس نے اسے واپس کر دیا، گواہوں کے سامنے اسے سیل کر دیا، اور عثمان کے گھر کی پیمائش کرنے والوں میں شامل تھا - اس نے عثمان کی داڑھی پکڑ لی، لیکن جب عثمان نے کہا کہ اگر آپ کے والد نے آپ کو دیکھا ہوتا تو وہ مجھ پر آپ کے مقام کو ناپسند کرتے، اس کا ہاتھ ڈھیلا ہو گیا اور اس نے علی کو قتل کرنے کے لیے پیچھے ہٹ لیا، لیکن بعد میں اس نے اسے قتل کرنے کے لیے پیچھے ہٹ لیا۔ ایسا نہیں کیا تھا {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 272-275}۔"
