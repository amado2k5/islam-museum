summary:
  ar: "فيزيائي نووي وكاتب باكستاني، وُلد في كراتشي سنة 1950. درّس الفيزياء في جامعة القائد الأعظم من 1973 إلى 2020، واشتُهر بدفاعه العلني عن العلمانية وحرية التعبير والمزاج العلمي في باكستان، وبمعارضته الأسلحة النووية. كتابه «الإسلام والعلم: الأرثوذكسية الدينية والمعركة من أجل العقلانية» (1991) — بمقدمة عبد السلام — من أشهر كتبه، ونال جائزة كالينغا لليونسكو سنة 2003 لتبسيط العلوم."
  en: "Pakistani nuclear physicist and author, born in Karachi in 1950. He taught physics at Quaid-e-Azam University from 1973 to 2020, and is known for his vocal defence of secularism, freedom of speech and scientific temper in Pakistan, and his opposition to nuclear weapons. His book Islam and Science: Religious Orthodoxy and the Battle for Rationality (1991), with a preface by Abdus Salam, is his best-known work; he received UNESCO's Kalinga Prize in 2003 for the popularisation of science."
  ur: "پاکستانی جوہری طبیعیات دان اور مصنف، جو 1950ء میں کراچی میں پیدا ہوئے۔ انھوں نے 1973ء سے 2020ء تک قائد اعظم یونیورسٹی میں طبیعیات پڑھائی، اور وہ پاکستان میں سیکولرزم، آزادیٔ اظہار اور سائنسی مزاج کے بھرپور دفاع اور جوہری ہتھیاروں کی مخالفت کے لیے جانے جاتے ہیں۔ ان کی کتاب «اسلام اور سائنس: مذہبی قدامت پسندی اور عقلانیت کی جنگ» (1991ء) — عبد السلام کے دیباچے کے ساتھ — ان کی مشہور ترین تصنیف ہے؛ انھیں 2003ء میں سائنس کی ترویج پر یونیسکو کا کالنگا پرائز ملا۔"
