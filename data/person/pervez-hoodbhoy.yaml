summary:
  ar: "فيزيائي نووي وكاتب باكستاني، وُلد في كراتشي سنة 1950. درّس الفيزياء في جامعة القائد الأعظم من 1973 إلى 2020، واشتُهر بدفاعه العلني عن العلمانية وحرية التعبير والمزاج العلمي في باكستان، وبمعارضته الأسلحة النووية. كتابه «الإسلام والعلم: الأرثوذكسية الدينية والمعركة من أجل العقلانية» (1991) — بمقدمة عبد السلام — من أشهر كتبه، ونال جائزة كالينغا لليونسكو سنة 2003 لتبسيط العلوم."
  en: "Pakistani nuclear physicist and author, born in Karachi in 1950. He taught physics at Quaid-e-Azam University from 1973 to 2020, and is known for his vocal defence of secularism, freedom of speech and scientific temper in Pakistan, and his opposition to nuclear weapons. His book Islam and Science: Religious Orthodoxy and the Battle for Rationality (1991), with a preface by Abdus Salam, is his best-known work; he received UNESCO's Kalinga Prize in 2003 for the popularisation of science."
  ur: "پاکستانی جوہری طبیعیات دان اور مصنف، جو 1950ء میں کراچی میں پیدا ہوئے۔ انھوں نے 1973ء سے 2020ء تک قائد اعظم یونیورسٹی میں طبیعیات پڑھائی، اور وہ پاکستان میں سیکولرزم، آزادیٔ اظہار اور سائنسی مزاج کے بھرپور دفاع اور جوہری ہتھیاروں کی مخالفت کے لیے جانے جاتے ہیں۔ ان کی کتاب «اسلام اور سائنس: مذہبی قدامت پسندی اور عقلانیت کی جنگ» ⁦(1991ء)⁩ — عبد السلام کے دیباچے کے ساتھ — ان کی مشہور ترین تصنیف ہے؛ انھیں 2003ء میں سائنس کی ترویج پر یونیسکو کا کالنگا پرائز ملا۔"
  es: "Físico nuclear y autor pakistaní, nacido en Karachi en 1950. Impartió clases de física en la Universidad Quaid-e-Azam desde 1973 hasta 2020, y es conocido por su firme defensa del laicismo, la libertad de expresión y el espíritu científico en Pakistán, así como por su oposición a las armas nucleares. Su libro «Islam y ciencia: ortodoxia religiosa y la batalla por la racionalidad» (1991), con prólogo de Abdus Salam, es su obra más conocida; recibió el Premio Kalinga de la UNESCO en 2003 por su labor de divulgación científica."
  fr: "Physicien nucléaire et auteur pakistanais, né à Karachi en 1950, il a enseigné la physique à l'Université Quaid-e-Azam de 1973 à 2020. Il est reconnu pour sa défense ardente de la laïcité, de la liberté d'expression et de l'esprit scientifique au Pakistan, ainsi que pour son opposition aux armes nucléaires. Son ouvrage le plus connu est *Islam et science: Orthodoxie religieuse et combat pour la rationalité* (1991), préfacé par Abdus Salam. Il a reçu le prix Kalinga de l'UNESCO en 2003 pour sa contribution à la vulgarisation scientifique."
  tr: "1950 yılında Karaçi'de doğmuş Pakistanlı bir nükleer fizikçi ve yazardır. 1973-2020 yılları arasında Quaid-e-Azam Üniversitesi'nde fizik okudu ve Pakistan'da laiklik, ifade özgürlüğü ve bilimsel mizacın kamuoyunda savunması ile nükleer silahlara karşı çıkmasıyla ünlendi. 'İslam ve Bilim: Dini Ortodoksluk ve Akılcılık İçin Mücadele' (1991) adlı kitabı — Abdus Salam'ın önsözüyle — en ünlü eserlerinden biridir ve 2003 yılında UNESCO tarafından bilimi basitleştirdiği için Kalinga Ödülü'nü aldı."
  id: "Seorang fisikawan nuklir dan penulis Pakistan, lahir di Karachi pada tahun 1950. Ia belajar fisika di Universitas Quaid-e-Azam dari tahun 1973 hingga 2020, dan menjadi terkenal karena pembelaannya secara terbuka terhadap sekularisme, kebebasan berekspresi, dan temperamen ilmiah di Pakistan, serta penentangannya terhadap senjata nuklir. Bukunya 'Islam and Science: Religious Orthodoxy and the Battle for Rationality' (1991) — dengan pengantar oleh Abdus Salam — adalah salah satu karya terkenalnya, dan ia menerima Penghargaan Kalinga dari UNESCO pada tahun 2003 atas penyederhanaan ilmu pengetahuan."
