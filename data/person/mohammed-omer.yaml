summary:
  ar: محمد عمر ⁦(1984–)⁩ صحفي فلسطيني من رفح بغزة، حائز جائزة مارثا غيلهورن للصحافة سنة 2008، ومؤلف كتاب «Shell Shocked» عن الحرب على غزة.
  en: 'Mohammed Omer (born 1984) is a Palestinian journalist from Rafah, Gaza, who won the 2008 Martha Gellhorn Prize for Journalism and authored Shell Shocked: On the Ground Under Israel''s Gaza Assault.'
  ur: محمد عمر ⁦(1984–)⁩ غزہ کے رفح سے فلسطینی صحافی ہیں جنھیں 2008 کا مارتا گیلہورن صحافت انعام ملا اور «Shell Shocked» کی تصنیف کی، جو غزہ کی جنگ کے میدانی مشاہدے پر ہے۔
  es: "Mohammed Omer (nacido en 1984) es un periodista palestino de Rafah, Gaza, que ganó el Premio Martha Gellhorn de Periodismo en 2008 y es autor de Shell Shocked: On the Ground Under Israel's Gaza Assault (Conmocionados: Sobre el terreno bajo el ataque israelí en Gaza)."
  fr: "Mohammed Omer (né en 1984) est un journaliste palestinien originaire de Rafah, à Gaza, qui a remporté le prix Martha Gellhorn de journalisme en 2008 et est l'auteur de Shell Shocked: On the Ground Under Israel's Gaza Assault."
  tr: "Mohammed Omar (1984–), Gazze'nin Rafah kentinden Filistinli bir gazetecidir; 2008'de Martha Gellhorn Gazetecilik Ödülü'nü kazanmış ve Gazze savaşı hakkında \"Shell Shocked\" adlı kitabın yazarıdır."
  id: "Mohammed Omar (1984–) adalah seorang jurnalis Palestina dari Rafah, Gaza, pemenang Penghargaan Jurnalisme Martha Gellhorn pada tahun 2008, dan penulis buku \"Shell Shocked\" tentang perang di Gaza."
