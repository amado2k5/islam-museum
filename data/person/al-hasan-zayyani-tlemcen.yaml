summary:
  ar: "أخو أبي زيان أحمد الثاني الذي بايعه أهل تلمسان مكانه بعد أن كرهوا أخاه لتقربه من الأسبان؛ دعمه حسن بن خير الدين فاعترف بسلطة الدولة العثمانية وبقيت حامية عثمانية في قلعة المشوار بتلمسان {cite:dawlat-uthmaniyya-salabi p. 230}."
  en: "Brother of Abu Zayyan Ahmad II, whom the people of Tlemcen acclaimed in his stead for the other's leanings to Spain; backed by Hasan b. Khayr al-Din he acknowledged Ottoman authority, an Ottoman garrison remaining at al-Mashwar castle {cite:dawlat-uthmaniyya-salabi p. 230}."
  es: "Hermano de Abu Zayyan Ahmad II, a quien el pueblo de Tlemcen aclamó en su lugar debido a las inclinaciones del otro hacia España; respaldado por Hasan b. Khayr al-Din, reconoció la autoridad otomana, permaneciendo una guarnición otomana en el castillo de al-Mashwar {cite:dawlat-uthmaniyya-salabi p. 230}."
  fr: "Frère d'Abu Zayyan Ahmad II, que les habitants de Tlemcen acclamèrent à sa place en raison des penchants de l'autre pour l'Espagne; soutenu par Hasan b. Khayr al-Din, il reconnut l'autorité ottomane, une garnison ottomane restant au château d'al-Mashwar {cite:dawlat-uthmaniyya-salabi p. 230}."
  ur: "ابو زیان احمد دوم کا بھائی، جسے ٹیلمسن کے لوگوں نے اسپین کی طرف دوسرے کے جھکاؤ کی وجہ سے ان کی جگہ سراہا؛ حسن بی کی حمایت خیرالدین نے عثمانی اتھارٹی کو تسلیم کیا، یہ ایک عثمانی چھاؤنی ہے جو المشہور قلعہ میں باقی ہے۔ 230}۔"
  tr: "Abi Zayan Ahmed II'nin kardeşiydi; Tlemcen halkı, kardeşinden nefret ettikten sonra onun yerine bağlılık yemini etti; Hasan ibn Khayral-Din onu destekledi, Osmanlı devletinin otoritesini tanıdı ve Osmanlı garnizonu Tlemcen'deki Miswar kalesinde kaldı {cite:dawlat-uthmaniyya-salabi, s. 230}."
  id: "Ia adalah saudara dari Abi Zayan Ahmad II, yang menjadi tempat pengabdian rakyat Tlemcen setelah membenci saudaranya karena kedekatannya dengan Spanyol; Hassan ibn Khayr al-Din mendukungnya, mengakui otoritas negara Ottoman, dan garnisun Ottoman tetap berada di benteng Miswar di Tlemcen {cite:dawlat-uthmaniyya-salabi, hlm. 230}."
