id: person/yahya-ibn-aktham
class: person
label: { ar: "يحيى بن أكثم" }
summary:
  ar: "قاضي المأمون ونديمه، راوية عنه في الحديث، وله معه محاورات ونوادر، ومن قوله له إن خضنا في الطب كنت جالينوس في معرفته وفي الفقه كنت علي بن أبي طالب في علمه {cite:tarikh-khulafa-minhaj-1434 p. 497,503,515}. ودارت بينه وبين ثمامة بن أشرس عند المأمون مسألة فقه فقال هذا قول عمر وابن مسعود وابن عمرو وجابر فقال ثمامة أخطأوا كلهم فاستعظمها وقال إن هذا يخطئ أصحاب رسول الله كلهم {cite:muruj-al-dhahab p. 402-403}، وعند المسعودي هو من أهل مرو من بني تميم تفقه للبصريين كعثمان البتي وله مصنفات وكتاب التنبيه يرد فيه على العراقيين ومناظرات مع أبي سليمان أحمد بن أبي داود، واتصل بالمأمون ونادمه حتى أذاع باللواط وفرض أربعمائة غلام مرد اختارهم حسان الوجوه فافتضح بهم ورثاه راشد بن إسحاق، وسخط عليه المأمون سنة خمس عشرة ومائتين بمصر فبعث به إلى العراق {cite:muruj-al-dhahab p. 415-417}، ومات بالربذة سنة ثلاث وأربعين ومائتين {cite:muruj-al-dhahab p. 513}، ودافع عنه ابن خلدون عما ينقله المجان من الميل إلى الغلمان فقال بهتان على الله وفريه على العلماء يستندون إلى أخبار القصاص الواهية لعلها من افتراء أعدائه فإنه كان محسوداً في كماله وخلّته للسلطان، وذكر أن ابن حنبل لما ذكر ما يرميه به الناس قال سبحان الله ومن يقول هذا وأنكره إنكاراً شديداً، وأثنى عليه إسماعيل القاضي وقال يحيى بن أكثم أبرأ إلى الله من أن يكون فيه شيء مما كان يرمى به من أمر الغلمان ولقد كنت أقف على رسائله فأجده شديد الخوف من الله، وذكره ابن حبان في الثقات وقال لا يشتغل بما يحكى عنه لأن أكثرها لا يصح عنه، وأنكر ابن خلدون حديث الزنبيل في سبب إصهار المأمون إلى الحسن بن سهل في ابنته بوران {cite:muqaddima-ibn-khaldun p. 30-31}"
  en: "Al-Ma'mun's judge and boon-companion, his transmitter in hadith — 'were we to discuss medicine you would be Galen, in fiqh Ali ibn Abi Talib' {cite:tarikh-khulafa-minhaj-1434 p. 497,503,515}."
  es: "El juez y compañero de bendiciones de Al-Ma'mun, su transmisor en hadices: \"Si discutiéramos sobre medicina, serías Galeno, en fiqh Ali ibn Abi Talib\" {cita:tarikh-khulafa-minhaj-1434 págs. 497, 503, 515}."
  fr: "Le juge et compagnon bienfaiteur d'Al-Ma'mun, son transmetteur de hadiths — « si nous devions discuter de médecine, tu serais Galien, en fiqh Ali ibn Abi Talib » {cite:tarikh-khulafa-minhaj-1434 p. 497,503,515}."
  ur: "المامون کے منصف اور ساتھی، حدیث میں اس کا ٹرانسمیٹر - 'اگر ہم طب پر بحث کریں گے تو آپ گیلن ہوں گے، فقہ علی ابن ابی طالب میں'۔ 497,503,515}۔"
  tr: "El-Me'mun'un hakimi ve sahabi, ondan hadis anlatıyor, onunla sohbetler ve anekdotlar yapıyordu. Sözü arasında, 'Eğer tıbba girseydik, Galen'i tanırdım ve fihh alanında bilgisi Ali bin Ebi Talib olurdu.' {alıntı:Tarikh-khulafa-minhaj-1434, s. 497,503,515}. Kendisi ile Thumama ibn Ashras ile al-Ma'mun arasında bir hukuk meselesi yaşandı; Ma'mun, bunun Umar, İbn Mas'ud, İbn Amr ve Jabir'in görüşü olduğunu söyledi. Thumama ise, 'Hepsi yanıldı,' dedi ve bunu eleştirerek, Allah'ın Resulef'in tüm sahabelerinin hata yaptığını söyledi {cite:muruj-al-dhahab, s. 402-403}. El-Mesudi'ye göre, o Marw'dandı, Banu Tamim'dendi ve Basranlar için fıkıh eğitimi almıştı, tıpkı Osman el-Batti gibi. Iraklıları çürüttüğü ve Ebu Süleyman Ahmed bin Ebi Davud ile tartıştığı eserler ve uyarılar kitabı yazdı. El-Memun ile bağlantı kurdu ve ondan pişman oldu, ta ki sodomi yayıp dört yüz çocuğu mahkûm edene kadar Ölenlerin yakışıklı yüzleri tarafından reddedildi ve Rashid bin İshaq onu yas tuttu. El-Memun, 215 Hicri yılında Mısır'da ona kızdı ve onu Irak'a gönderdi {atıf:muruj-al-dhahab s. 415-417} ve 243 Hicri yılında Rabdha'da öldü {atıf:Muruj-al-Dhahab s. 513}. İbn Haldun, onun çocuklara karşı serbestçe ilettiği eğilimlerden onu savundu; bunun Tanrı'ya yönelik bir iftira ve zayıf misilleme raporlarına dayanan alimlere karşı bir yalan olduğunu, çünkü onun mükemmelliği ve hükümdara yakınlığı nedeniyle kıskandığını belirtti. İbn'in Hanbal, insanların onu suçladığı şeylerden bahsettiğinde, şöyle dedi: Allah'a şükürler olsun, bunu söyleyen ise bunu kesinlikle reddeder. İsmail el-Kadı onu övdü ve şöyle dedi: Yahya ibn Aktham, çocuklarla ilgili olarak suçladığı şeyden hiçbir şey olmadığı için Allah huzurunda masumdur. Mektuplarını incelediğimde Allah'tan derin bir korku duyduğunu gördüm. İbn Hibban, güvenilir kitaplarda ondan bahsetti ve hakkında rivayet edilenlerle ilgilenmediğini, çünkü çoğunun kendisinden gerçek olmadığını söyledi. İbn Haldun, el-Memun'un el-Hasan bin Sahl ile evliliğinin sebebiyle ilgili hadislerini kızı Buran'da reddetti {atıf:mukaddima-ibn-haldun s. 30-31}"
  id: "Hakim dan sahabat al-Ma'mun, yang menceritakan darinya dalam hadits, dan ia berbincang serta bercerita dengan Galen. Di antara ucapannya, 'Jika kita masuk dunia kedokteran, aku akan mengenal Galen, dan dalam hukum, aku akan menjadi Ali ibn Abi Talib dalam pengetahuannya.' {sitasi:Tarikh-khulafa-minhaj-1434, hlm. 497,503,515}. Sebuah masalah hukum terjadi antara dia dan Thumama ibn Ashras bersama al-Ma'mun, yang mengatakan ini adalah pandangan Umar, Ibn Mas'ud, Ibn Amr, dan Jabir. Thumama berkata, 'Mereka semua salah,' dan dia mengkritiknya, mengatakan bahwa semua sahabat Rasul Allah melakukan kesalahan {cite:muruj-al-dhahab, hlm. 402-403}. Menurut al-Masudi, dia berasal dari Marw, dari Banu Tamim, yang mempelajari fiksi untuk Basran seperti Uthman al-Batti. Dia menulis karya dan sebuah buku peringatan di mana dia membantah orang Irak dan berdebat dengan Abu Sulayman Ahmad ibn Abi Dawud. Dia berhubungan dengan al-Ma'mun dan menyesalinya sampai dia menyebarkan sodomi dan menjatuhkan hukuman kepada empat ratus anak laki-laki Ia ditolak oleh wajah tampan almarhum, dan Rashid ibn Ishaq berduka. Al-Ma'mun marah kepadanya di Mesir pada tahun 215 H dan mengirimnya ke Irak {cite:muruj-al-dhahab hlm. 415-417}, dan meninggal di Rabdha pada tahun 243 H {cite:Muruj-al-dhahab hlm. 513}. Ibn Khaldun membelanya dari apa yang ia sampaikan secara terbuka kepada anak-anak itu, mengatakan itu adalah fitnah terhadap Tuhan dan kebohongan terhadap para ulama yang mengandalkan laporan lemah tentang pembalasan, mungkin dari rekayasa musuh-musuhnya, karena ia iri karena kesempurnaan dan kedekatannya dengan penguasa. Ia menyebutkan bahwa Ibn Ketika Hanbal menyebutkan apa yang dituduhkan orang-orang kepadanya, ia berkata: Segala puji Allah, dan siapa pun yang berkata demikian sangat menyangkalnya. Ismail al-Qadi memujinya dan berkata: Yahya ibn Aktham tidak bersalah di hadapan Allah, tidak ada dalam dirinya apa pun yang dulu ia tuduhkan terkait urusan anak-anak. Saya sering memeriksa surat-suratnya dan mendapati ia sangat takut kepada Allah. Ibn Hibban menyebutnya dalam buku-buku terpercaya dan mengatakan ia tidak terlibat dalam apa yang diceritakan tentang dirinya karena sebagian besar darinya tidak otentik. Ibn Khaldun menolak hadits al-Zanbil mengenai alasan pernikahan al-Ma'mun dengan al-Hasan ibn Sahl dalam putrinya Buran {cite:muqaddima-ibn-khaldun hlm. 30-31}"
