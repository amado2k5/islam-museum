id: person/yahya-ibn-aktham
class: person
label: { ar: "يحيى بن أكثم" }
summary:
  ar: "قاضي المأمون ونديمه، راوية عنه في الحديث، وله معه محاورات ونوادر، ومن قوله له إن خضنا في الطب كنت جالينوس في معرفته وفي الفقه كنت علي بن أبي طالب في علمه {cite:tarikh-khulafa-minhaj-1434 p. 497,503,515}. ودارت بينه وبين ثمامة بن أشرس عند المأمون مسألة فقه فقال هذا قول عمر وابن مسعود وابن عمرو وجابر فقال ثمامة أخطأوا كلهم فاستعظمها وقال إن هذا يخطئ أصحاب رسول الله كلهم {cite:muruj-al-dhahab p. 402-403}، وعند المسعودي هو من أهل مرو من بني تميم تفقه للبصريين كعثمان البتي وله مصنفات وكتاب التنبيه يرد فيه على العراقيين ومناظرات مع أبي سليمان أحمد بن أبي داود، واتصل بالمأمون ونادمه حتى أذاع باللواط وفرض أربعمائة غلام مرد اختارهم حسان الوجوه فافتضح بهم ورثاه راشد بن إسحاق، وسخط عليه المأمون سنة خمس عشرة ومائتين بمصر فبعث به إلى العراق {cite:muruj-al-dhahab p. 415-417}، ومات بالربذة سنة ثلاث وأربعين ومائتين {cite:muruj-al-dhahab p. 513}، ودافع عنه ابن خلدون عما ينقله المجان من الميل إلى الغلمان فقال بهتان على الله وفريه على العلماء يستندون إلى أخبار القصاص الواهية لعلها من افتراء أعدائه فإنه كان محسوداً في كماله وخلّته للسلطان، وذكر أن ابن حنبل لما ذكر ما يرميه به الناس قال سبحان الله ومن يقول هذا وأنكره إنكاراً شديداً، وأثنى عليه إسماعيل القاضي وقال يحيى بن أكثم أبرأ إلى الله من أن يكون فيه شيء مما كان يرمى به من أمر الغلمان ولقد كنت أقف على رسائله فأجده شديد الخوف من الله، وذكره ابن حبان في الثقات وقال لا يشتغل بما يحكى عنه لأن أكثرها لا يصح عنه، وأنكر ابن خلدون حديث الزنبيل في سبب إصهار المأمون إلى الحسن بن سهل في ابنته بوران {cite:muqaddima-ibn-khaldun p. 30-31}"
  en: "Al-Ma'mun's judge and boon-companion, his transmitter in hadith — 'were we to discuss medicine you would be Galen, in fiqh Ali ibn Abi Talib' {cite:tarikh-khulafa-minhaj-1434 p. 497,503,515}."
