summary:
  ar: أخو أنس بن مالك وابن أم سليم، كان حادي النبي في أسفاره، وشهد المشاهد إلا بدراً، ولاقى بلاءً يوم اليمامة، واستُشهد في حصن تستر في خلافة عمر نحو سنة 20هـ.
  en: The brother of Anas ibn Malik and son of Umm Sulaym, he was the Prophet's camel-driver chanting on his journeys, took part in the campaigns except Badr, distinguished himself at al-Yamama, and was killed at the fortress of Tustar in Umar's
    caliphate, around 20 AH.
