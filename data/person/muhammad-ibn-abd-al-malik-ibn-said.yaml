id: person/muhammad-ibn-abd-al-malik-ibn-said
class: person
label: { ar: "محمد بن عبد الملك بن سعيد" }
gender: male
summary:
  ar: "وزير جليل بعيد الصيت عالي الهمة كثير الأموال؛ ولد عام أربعة عشر وخمسمائة وولي للموحدين أعمالاً كثيرة بمراكش وسلا وإشبيلية وغرناطة واتصلت ولايته على أعمال غرناطة، وذكره السهيلي في شرح السيرة حيث ذكر أنه عاين كتاب رسول الله إلى هرقل مكرماً عند أذفونش، ومدحه الرصافي، وأمر المنصور بالقبض عليه سنة 593هـ ثم رضي عنه وأمره أن يكتب بخطه كل ما أخذ له فصرفه عليه، وتوفي بشعبان سنة تسعة وثمانين وخمسمائة بغرناطة {cite:nafh-tib-maqqari p. 337-338}."
  en: "The great Almohad wazir of Granada, born 514, who saw the Prophet's letter to Heraclius still honoured at Alfonso's court, whom al-Rusafi praised and al-Mansur briefly arrested in 593; he died at Granada in Sha'ban 589 {cite:nafh-tib-maqqari p. 337-338}."
