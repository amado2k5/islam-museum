id: person/muhammad-ibn-abd-al-malik-ibn-said
class: person
label: { ar: "محمد بن عبد الملك بن سعيد" }
gender: male
summary:
  ar: "وزير جليل بعيد الصيت عالي الهمة كثير الأموال؛ ولد عام أربعة عشر وخمسمائة وولي للموحدين أعمالاً كثيرة بمراكش وسلا وإشبيلية وغرناطة واتصلت ولايته على أعمال غرناطة، وذكره السهيلي في شرح السيرة حيث ذكر أنه عاين كتاب رسول الله إلى هرقل مكرماً عند أذفونش، ومدحه الرصافي، وأمر المنصور بالقبض عليه سنة 593هـ ثم رضي عنه وأمره أن يكتب بخطه كل ما أخذ له فصرفه عليه، وتوفي بشعبان سنة تسعة وثمانين وخمسمائة بغرناطة {cite:nafh-tib-maqqari p. 337-338}."
  en: "The great Almohad wazir of Granada, born 514, who saw the Prophet's letter to Heraclius still honoured at Alfonso's court, whom al-Rusafi praised and al-Mansur briefly arrested in 593; he died at Granada in Sha'ban 589 {cite:nafh-tib-maqqari p. 337-338}."
  es: "El gran visir almohade de Granada, nacido en 514, que vio cómo la carta del Profeta a Heraclio seguía siendo honrada en la corte de Alfonso, a quien al-Rusafi elogió y al-Mansur arrestó brevemente en 593; murió en Granada en Sha'ban 589 {cite:nafh-tib-maqqari p. 337-338}."
  fr: "Le grand vizir almohade de Grenade, né en 514, qui vit la lettre du Prophète à Héraclius encore honorée à la cour d'Alphonse, qu'al-Rusafi loua et qu'al-Mansur arrêta brièvement en 593; il mourut à Grenade en Sha'ban 589 {cite:nafh-tib-maqqari p. 337-338}."
  ur: "غرناطہ کا عظیم الموحد وزیر، 514 میں پیدا ہوا، جس نے ہرقل کے نام پیغمبر کے خط کو الفانسو کے دربار میں اب بھی عزت و احترام کے ساتھ دیکھا، جس کی الرصافی نے تعریف کی اور المنصور کو 593 میں مختصر طور پر گرفتار کر لیا۔ آپ کی وفات غرناطہ میں شعبان 589 میں ہوئی۔ 337-338}۔"
  tr: "Büyük, hırslı ve büyük hırslı bir din adamıydı; 500 Hicri yılında doğdu, Marakeş, Salé, Sevilla ve Granada'da Almohadlar için birçok görev üstlendi. Granada üzerindeki otoritesi bağlantılıydı. Al-Suhaili, biyografi üzerine yazdığı yorumda ondan bahsetti; burada Elçi'nin Herakleios'a yazdığı mektubu Adhfunsh'ta onurlandırılırken inceledi, övdü ve Al-Mansur 593 Hicri'de tutuklanmasını emretti, ardından onu onayladı ve kendisi için aldığı her şeyi kendi el yazısıyla yazmasını emretti, böylece o da ona harcadı. 589 Hicri yılında Granada'da Şa'ban'da öldü {cite:nafh-tib-maqqari s. 337-338}."
  id: "Seorang menteri besar yang sangat ambisius dengan ambisi besar; lahir pada tahun 500 H, ia memegang banyak jabatan untuk Almohad di Marrakesh, Salé, Seville, dan Granada. Kewenangannya atas Granada terkait. Al-Suhaili menyebutnya dalam komentarnya atas biografi, di mana ia memeriksa surat Utusan Tuhan kepada Heraclius yang dihormati pada Adhfunsh, memujinya, dan Al-Mansur memerintahkan penangkapannya pada tahun 593 H, lalu menyetujuinya dan memerintahkannya menulis dengan tulisan tangannya sendiri segala sesuatu yang telah ia ambil untuknya, sehingga ia menghabiskannya untuknya. Ia meninggal di Sha'ban pada tahun 589 H. di Granada {cite:nafh-tib-maqqari hlm. 337-338}."
