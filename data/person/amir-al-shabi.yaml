label: { ar: "عامر الشعبي" }
gender: male
roles: [scholar]
summary:
  ar: "أرسله عبد الملك بن مروان رسولاً إلى ملك الروم، وينقل الكتاب رواية تذكر أن ملك الروم عدّ إرسال الخليفة رسولاً بلا حراسة دليلاً على قصد الغدر به، وأن الشعبي ردّ بما نجا به. ويعلّق الكتاب بأن نيات الروم لم تكن سليمة مع المسلمين حتى في زمن الصلح والمراسلات {cite:salabi-umayyad-state-2020 p.56-57}."
  tr: "Abdülmelik bin Mervan onu Roma Kralı'na elçi olarak gönderdi ve kitap, Roma kralının halifeyi korumasız bir elçi göndermeyi ihanet niyetinin kanıtı olarak gördüğünü ve el-Şa'bi'nin hayatta kaldıklarıyla karşılık verdiğini belirtir. Kitap, Romalıların niyetlerinin barış ve yazışma döneminde bile Müslümanlara karşı samimi olmadığını belirtir {cite:salabi-umayyad-state-2020 s.56-57}."
  id: "Abd al-Malik ibn Marwan mengirimnya sebagai utusan kepada Raja Romawi, dan buku tersebut melaporkan bahwa raja Romawi mempertimbangkan mengirim khalifah sebagai utusan tanpa penjagaan sebagai bukti niatnya untuk mengkhianatinya, dan bahwa al-Sha'bi menanggapi dengan apa yang telah ia selamatkan. Buku tersebut berkomentar bahwa niat orang Romawi tidak tulus kepada Muslim bahkan pada masa damai dan korespondensi {cite:salabi-umayyad-state-2020 hlm.56-57}."
