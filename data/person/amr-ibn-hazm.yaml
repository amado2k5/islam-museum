summary:
  ar: أنصاري أخو عمارة بن حزم؛ شهد الخندق وما بعدها واستعمله النبي على نجران، وروى عنه ابنه محمد كتاباً كتبه له فيه الفرائض والزكاة والديات أخرجه أبو داود والنسائي وابن حبان والدارمي؛ مات في خلافة عمر عند أبي نعيم، ويرجح ابن حجر أنه عاش بعد الخمسين.
  en: An Ansari, brother of Umara ibn Hazm; he took part in al-Khandaq and later campaigns, and the Prophet appointed him over Najran; his son Muhammad narrated from him a letter the Prophet wrote for him on the obligations, zakat and blood-money,
    which Abu Dawud, al-Nasa'i, Ibn Hibban and al-Darimi record; Abu Nu'aym says he died under Umar, while Ibn Hajar judges it likelier that he lived past the fifties AH.
