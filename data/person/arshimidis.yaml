label: { ar: "أرشميدس", en: "Arshimidis", es: "Arshimidis", fr: "Arshimidis", ur: "ارشمیدیس" }
summary:
  ar: "أرشميدس، أخبر ابن النديم ثقة أن الروم أحرقت من كتب أرشميدس خمسة عشر حملا، والموجود منها كتاب الكرة والأسطوانة مقالتان وكتاب تربيع الدائرة وكتاب تسبيع الدائرة وكتاب الدوائر الماسة وكتاب المثلثات وكتاب الخطوط المتوازية وكتاب المأخوذات في أصول الهندسة وكتاب المفروضات وكتاب خواص المثلثات القائمة الزوايا وكتاب آلة ساعات الماء التي ترمي بالبنادق {cite:fihrist-ibn-al-nadim p. 372}."
  en: "Archimedes — fifteen loads of his books burned by the Romans, says the Fihrist's informant {cite:fihrist-ibn-al-nadim}"
  es: "Arquímedes: quince cargamentos de sus libros fueron quemados por los romanos, según el informante de Fihrist {cite:fihrist-ibn-al-nadim}."
  fr: "Archimède — quinze chargements de ses livres brûlés par les Romains, selon l'informateur de Fihrist {cite:fihrist-ibn-al-nadim}"
  ur: "آرکیمیڈیز - اس کی پندرہ کتابیں رومیوں نے جلا دی تھیں، فہرسٹ کے مخبر کا کہنا ہے کہ"
  tr: "Arşimet, İbn el-Nadim, Romalıların on beş yük Arşimet kitabını yaktığını güvenilir şekilde bildirdi; bunlar arasında 'Küre ve Silindir' kitabı, 'Çemberin Karesleme' kitabı, Çemberin Eşitlenmesi Kitabı, Elmas Çemberler Kitabı, Üçgenler Kitabı, Paralel Çizgiler Kitabı, Geometri İlkeleri Kitabı'nda Alın' Kitabı, Varsayımlar Kitabı, Dik Üçgenlerin Özellikleri Kitabı ve Tüfek Fırlatan Su Saati Makinesi Kitabı {atı:Fihrist-ibn-al-Nadim s. 372} yer almaktadır."
  id: "Archimedes, Ibn al-Nadim memberitahu dengan dapat dipercaya bahwa orang Romawi membakar lima belas muatan buku Archimedes, termasuk buku 'Bola dan Silinder,' buku 'Persegi Lingkaran,' Buku Penyeimbangan Lingkaran, Buku Lingkaran Berlian, Buku Segitiga, Buku Garis Paralel, Buku Diambil dalam Prinsip Geometri, Buku Asumsi, Buku Sifat-sifat Segitiga Siku-siku, dan Buku Mesin Jam Air yang Melempar Senapan {cite:fihrist-ibn-al-nadim hlm. 372}."
