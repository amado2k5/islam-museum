id: person/arshimidis
class: person
label: { ar: "أرشميدس", en: "Arshimidis" }
summary:
  ar: "أرشميدس، أخبر ابن النديم ثقة أن الروم أحرقت من كتب أرشميدس خمسة عشر حملا، والموجود منها كتاب الكرة والأسطوانة مقالتان وكتاب تربيع الدائرة وكتاب تسبيع الدائرة وكتاب الدوائر الماسة وكتاب المثلثات وكتاب الخطوط المتوازية وكتاب المأخوذات في أصول الهندسة وكتاب المفروضات وكتاب خواص المثلثات القائمة الزوايا وكتاب آلة ساعات الماء التي ترمي بالبنادق {cite:fihrist-ibn-al-nadim p. 372}."
  en: "Archimedes — fifteen loads of his books burned by the Romans, says the Fihrist's informant {cite:fihrist-ibn-al-nadim}"
