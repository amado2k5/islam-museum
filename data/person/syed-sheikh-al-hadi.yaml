summary:
  ar: "كاتب ومصلح ملايوي من أصل عربي حضرمي (1867–1934) وُلد في ملقا وكان من مؤسسي حركة «كاوم مودا» في ملايا البريطانية؛ شارك في تأسيس مجلة «الإمام» (1906)، وأدار مدارس إصلاحية في سنغافورة وملقا وبينانغ، وأسّس مطبعة جلوتونغ، وكتب رواية «حكاية فريدة هانم» التي تُعد أول رواية ملايوية."
  en: "Malay writer and reformer of Hadrami Arab descent (1867–1934), born in Malacca, who was a founder of the Kaum Muda movement in British Malaya; he co-founded the journal Al-Imam (1906), ran reformist madrasas in Singapore, Malacca and Penang, founded the Jelutong Press, and wrote Hikayat Faridah Hanom, regarded as the first Malay novel."
  ur: "حضرمی عرب نژاد ملائی مصنف اور مصلح (1867ء–1934ء) جو ملاکا میں پیدا ہوئے اور برطانوی ملایا میں «کاوم مودا» تحریک کے بانیوں میں سے تھے؛ انہوں نے مجلہ «الامام» (1906ء) کی تاسیس میں حصہ لیا، سنگاپور، ملاکا اور پینانگ میں اصلاحی مدارس چلائے، جلوتونگ پریس قائم کیا اور «حکایت فریدہ ہانم» لکھی جو پہلا ملائی ناول سمجھا جاتا ہے۔"
