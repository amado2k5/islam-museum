label: { ar: "عبد الملك بن حبيب", en: "Abd al-Malik ibn Habib", fr: "Abd al-Malik ibn Habib", es: "Abd al-Malik ibn Habib", ur: "عبد الملک بن حبیب" }
summary:
  ar: "عالم الأندلس في عصره؛ روى ابن وضاح عن إبراهيم بن المندر أنه أتى المشرق بغِرارة مملوءة وقال له: هذا علمك — أي كتب سمعه منه إجازةً، وقيل فيه عند دخوله المشرق إذ ازدراه من رآه لصغر جسمه: لا تنظرن إلى جسمي وقلته وانظر لصدري وما يحوي من السنّ فربّ ذي منظر من غير معرفة ورب من تزدريه العين ذو وطن وربّ لؤلؤة في عين مزبلة لم تُلقَ لها إلا إلى زمن؛ وردّ المقري على ما نُسب إليه من عدم معرفة الحديث فقد نقل عنه جهابذة المحدثين ولأهل الأندلس غرائب لم يعرفها أهل المشرق {cite:nafh-tib-maqqari p. 10-11}."
  en: "Abd al-Malik b. Habib, Cordoba's scholar who carried his learning east in a stuffed bookbag — his reported answer to the scorners of his small frame: pearls lie unlooked-for in dung-heaps {cite:nafh-tib-maqqari p. 10-11}."
  fr: "Abd al-Malik b. Habib, le savant de Cordoue qui porta son savoir en Orient dans un sac de livres bien rempli — sa réponse rapportée à ceux qui raillaient sa petite taille : les perles gisent inaperçues dans les tas de fumier {cite:nafh-tib-maqqari p. 10-11}."
  es: "Abd al-Malik b. Habib, el erudito de Córdoba que llevó su saber hacia el este en una mochila llena de libros, respondió a quienes se burlaban de su pequeña estatura: las perlas yacen inesperadas en montones de estiércol {cite:nafh-tib-maqqari p. 10-11}."
  ur: "عبد الملک بی۔ حبیب، قرطبہ کے اسکالر جنہوں نے اپنی تعلیم کو ایک بھرے ہوئے کتابی تھیلے میں مشرق کی طرف لے جایا - اپنے چھوٹے فریم کے طعنہ دینے والوں کو ان کا بتایا گیا جواب: گوبر کے ڈھیروں میں موتی نظر نہیں آتے۔ 10-11}۔"
