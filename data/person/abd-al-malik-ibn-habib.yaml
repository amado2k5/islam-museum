label: { ar: "عبد الملك بن حبيب" }
summary:
  ar: "عالم الأندلس في عصره؛ روى ابن وضاح عن إبراهيم بن المندر أنه أتى المشرق بغِرارة مملوءة وقال له: هذا علمك — أي كتب سمعه منه إجازةً، وقيل فيه عند دخوله المشرق إذ ازدراه من رآه لصغر جسمه: لا تنظرن إلى جسمي وقلته وانظر لصدري وما يحوي من السنّ فربّ ذي منظر من غير معرفة ورب من تزدريه العين ذو وطن وربّ لؤلؤة في عين مزبلة لم تُلقَ لها إلا إلى زمن؛ وردّ المقري على ما نُسب إليه من عدم معرفة الحديث فقد نقل عنه جهابذة المحدثين ولأهل الأندلس غرائب لم يعرفها أهل المشرق {cite:nafh-tib-maqqari p. 10-11}."
  en: "Abd al-Malik b. Habib, Cordoba's scholar who carried his learning east in a stuffed bookbag — his reported answer to the scorners of his small frame: pearls lie unlooked-for in dung-heaps {cite:nafh-tib-maqqari p. 10-11}."
