  en: "The Khurasani amir killed by Amr b. al-Layth; his head was displayed at Baghdad in 284 {cite:muruj-al-dhahab p. 621}. Ibn al-Jawzi: he entered Nishapur behind Amr ibn al-Layth and had the khutba made for the Alid Muhammad ibn Zayd, then was routed and killed; his head reached Baghdad in Muharram 284 and was displayed east side till noon, west till night {cite:muntazam-ibn-al-jawzi p. 162, 171}."
