label: { ar: "رافع بن هرثمة", en: "Rafi' ibn Harthama", es: "Rafi' ibn Harthama", fr: "Rafi' ibn Harthama", ur: "رافع بن حارثمہ" }
summary:
  ar: "قتله عمرو بن الليث الصفار وورد الخبر بذلك سنة ثلاث وثمانين ومائتين، وأدخل رأسه إلى بغداد سنة أربع وثمانين فصلب ساعة من نهار ثم رد إلى دار السلطان {cite:muruj-al-dhahab p. 621}."
  en: "The Khurasani amir killed by Amr b. al-Layth; his head was displayed at Baghdad in 284 {cite:muruj-al-dhahab p. 621}. Ibn al-Jawzi: he entered Nishapur behind Amr ibn al-Layth and had the khutba made for the Alid Muhammad ibn Zayd, then was routed and killed; his head reached Baghdad in Muharram 284 and was displayed east side till noon, west till night {cite:muntazam-ibn-al-jawzi p. 162, 171}."
  es: "El emir de Jorasán fue asesinado por Amr ibn al-Layth; su cabeza fue exhibida en Bagdad en 284 {cite:muruj-al-dhahab p. 621}. Ibn al-Jawzi: entró en Nishapur detrás de Amr ibn al-Layth e hizo que se preparara la jutba para el Alid Muhammad ibn Zayd, luego fue derrotado y asesinado; su cabeza llegó a Bagdad en Muharram 284 y fue exhibida en el lado este hasta el mediodía, y en el oeste hasta la noche {cite:muntazam-ibn-al-jawzi p. 162, 171}."
  fr: "L'émir du Khorasan fut tué par Amr ibn al-Layth; sa tête fut exposée à Bagdad en 284 (cf. Muruj al-Dhahab, p. 621). Ibn al-Jawzi entra à Nishapur derrière Amr ibn al-Layth et fit prononcer le sermon (khutba) pour l'Alid Muhammad ibn Zayd, puis fut mis en déroute et tué; sa tête parvint à Bagdad en Muharram 284 et fut exposée à l'est jusqu'à midi, puis à l'ouest jusqu'à la nuit (cf. Muntazam ibn al-Jawzi, p. 162, 171)."
  ur: "خراسانی امیر کو عمرو بن نے قتل کیا۔ اللیث اس کا سر بغداد میں 284 میں ظاہر کیا گیا تھا۔ 621}۔ ابن الجوزی: وہ عمرو بن لیث کے پیچھے نیشاپور میں داخل ہوا اور علید محمد بن زید کے لیے خطبہ دیا، پھر مارا مارا گیا۔ آپ کا سر 284 محرم الحرام میں بغداد پہنچا اور مشرق کی طرف دوپہر تک، مغرب سے رات تک ظاہر ہوتا رہا۔ 162، 171}۔"
