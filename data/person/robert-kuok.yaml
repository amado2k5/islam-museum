summary:
  ar: "روبرت كيوك (وُلد في 6 تشرين الأول 1923 في جوهور بهرو) رجل أعمال ومستثمر ومحسن ماليزي من أصل صيني يقيم في هونغ كونغ منذ 1973، مؤسس مجموعة كيوك؛ بدأ كاتبًا في قسم تجارة الأرز لدى ميتسوبيشي أيام الاحتلال الياباني، فأسس مع شقيقيه شركة الأخوة كيوك سنة 1949 وسيطر على معظم سوق السكر الماليزي فلُقب «ملك السكر في آسيا»، وبنى سلسلة فنادق شانغريلا وطوّر مجموعة كيري، ونشر مذكراته سنة 2018، وعُدّ أغنى مواطني ماليزيا."
  en: "Robert Kuok (born 6 October 1923 at Johor Bahru) is a Malaysian business magnate, investor and philanthropist of Chinese descent, based in Hong Kong since 1973 and founder of the Kuok Group; he began as a clerk in Mitsubishi's rice-trading department during the Japanese occupation, founded Kuok Brothers with his brothers in 1949, came to control most of Malaysia's sugar market — earning the name 'Sugar King of Asia' — built the Shangri-La hotel chain and the Kerry Group, published his memoir in 2018, and has long been counted Malaysia's wealthiest citizen."
  ur: "رابرٹ کوک (پیدائش 6 اکتوبر 1923، جوہر بہرو) چینی نسل کے ملائیشیائی کاروباری، سرمایہ کار و مخیر ہیں، 1973 سے ہانگ کانگ مقیم اور کوک گروپ کے بانی؛ انھوں نے جاپانی قبضے کے دوران مٹسوبشی کے چاول کی تجارت کے شعبے میں کلرک کے طور پر آغاز کیا، 1949 میں اپنے بھائیوں کے ساتھ کوک برادرز قائم کی، ملائیشیا کی چینی کی منڈی کے بیشتر حصے پر قابض ہو کر «ایشیا کے شوگر کنگ» کہلائے، شانگریلا ہوٹل چین اور کیری گروپ بنائے، 2018 میں اپنی یادداشتیں شائع کیں، اور طویل عرصے سے ملائیشیا کے امیر ترین شہری شمار ہوتے ہیں۔"
