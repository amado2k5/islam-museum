id: person/ubaydallah-ibn-umar
class: person
label: { ar: "عبيد الله بن عمر", en: "Ubaydallah ibn Umar", es: "Ubaydallah ibn Umar", fr: "Ubaydallah ibn Umar", ur: "عبیداللہ ابن عمر" }
summary:
  ar: "عبيد الله بن عمر بن الخطاب؛ قتل هرمزان بعد قتل أبيه إذ اتهم بمجالسة أبي لؤلؤة على قتل عمر فقال له امض بنا ننظر إلى فرس لي فضربه بالسيف وهو غافل فقتله. وكان بصفين في صف معاوية، وامتنعت زوجته الشيبانية بنت هانئ أن تشد عليه سلاحه فشجها بقوس، فقتله حريث بن جابر الجعفي وقيل الأشتر وقيل علي نفسه، ولما بذلت نساؤه في جيفته عشرة آلاف قال علي جيفته جيفة كلب لا يحل بيعها لكنه أجابهن فدفعها إلى الشيبانية فمضت بها {cite:muruj-al-dhahab p. 676-677}"
  en: "Ubaydallah ibn Umar ibn al-Khattab; suspecting Hurmuzan of counselling Abu Lu'lu'a over his father's murder, he drew him out to see a horse and cut him down unawares."
  es: "Ubaydallah ibn Umar ibn al-Khattab, sospechando que Hurmuzan estaba instigando a Abu Lu'lu'a sobre el asesinato de su padre, lo atrajo hacia un caballo y lo abatió por sorpresa."
  fr: "Ubaydallah ibn Umar ibn al-Khattab; soupçonnant Hurmuzan de conseiller Abu Lu'lu'a au sujet du meurtre de son père, il l'attira à la vue d'un cheval et le tua par surprise."
  ur: "عبیداللہ ابن عمر بن الخطاب؛ ہرمزان کو اپنے والد کے قتل کے بارے میں ابو للوعہ سے مشورہ کرنے کا شبہ تھا، اس نے اسے گھوڑا دیکھنے کے لیے باہر نکالا اور بے خبری میں اسے کاٹ دیا۔"
  tr: "Ubayd Allah ibn Umar ibn al-Khattab; Hurmuzan, babasını öldürdükten sonra öldürüldü; çünkü Ebu Lu'lu'ah ile Umar'ın öldürülmesi konusunda onunla oturmakla suçlanmıştı. Ona, 'Hadi gidip bir atımı görelim.' dedi. Babası farkında olmadan kılıçla vurdu ve onu öldürdü. Siffin'de, Muaviye'nin yanındaydı ve karısı el-Şeybaniye bint Hani silahını çekmeyi reddetti, bu yüzden ona yayla vurdu. Harith ibn Cabir al-Ju'fi, bazıları el-Aştar der, bazıları Ali'nin kendisi der, onu öldürdü. Eşleri cesedi için on bin teklif ettiğinde, leşinin satılamayacak bir köpek leşi olduğunu söyledi, ancak karşılık verdi ve onu al-Şeybaniyeh'e verdi, o da onu yanına aldı {atıf:muruj-al-dhahab s. 676-677}"
  id: "Ubayd Allah ibn Umar ibn al-Khattab; Hurmuzan dibunuh setelah membunuh ayahnya, karena ia dituduh duduk bersama Abu Lu'lu'ah atas pembunuhan Umar. Ia berkata kepadanya, 'Mari kita lihat kudaku.' Ia memukulnya dengan pedang saat ia tidak sadar, sehingga tewas. Ia berada di Siffin di sisi Muawiyah, dan istrinya al-Shaybaniyah bint Hani menolak menghunus senjatanya terhadapnya, sehingga ia memukulnya dengan busur. Harith ibn Jabir al-Ju'fi, ada yang mengatakan al-Ashtar, atau ada yang mengatakan Ali sendiri, membunuhnya. Ketika istrinya menawarkan sepuluh ribu untuk mayatnya, ia mengatakan bangkainya adalah bangkai anjing yang tidak bisa dijual, tetapi ia membalas dan menyerahkannya kepada al-Shaybaniyah, yang membawanya bersamanya {cite:muruj-al-dhahab hlm. 676-677}"
