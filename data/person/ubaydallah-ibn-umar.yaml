label: { ar: "عبيد الله بن عمر", en: "Ubaydallah ibn Umar" }
summary:
  ar: "عبيد الله بن عمر بن الخطاب؛ قتل هرمزان بعد قتل أبيه إذ اتهم بمجالسة أبي لؤلؤة على قتل عمر فقال له امض بنا ننظر إلى فرس لي فضربه بالسيف وهو غافل فقتله. وكان بصفين في صف معاوية، وامتنعت زوجته الشيبانية بنت هانئ أن تشد عليه سلاحه فشجها بقوس، فقتله حريث بن جابر الجعفي وقيل الأشتر وقيل علي نفسه، ولما بذلت نساؤه في جيفته عشرة آلاف قال علي جيفته جيفة كلب لا يحل بيعها لكنه أجابهن فدفعها إلى الشيبانية فمضت بها {cite:muruj-al-dhahab p. 676-677}"
  en: "Ubaydallah ibn Umar ibn al-Khattab; suspecting Hurmuzan of counselling Abu Lu'lu'a over his father's murder, he drew him out to see a horse and cut him down unawares."
