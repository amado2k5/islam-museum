summary:
  ar: من أشعر قريش، كان شديداً على المسلمين ثم أسلم في الفتح؛ هرب إلى نجران بعد الفتح فبلغته أبيات حسان بن ثابت فعاد وأسلم وقال شعراً في اعتذاره، وقال المرزباني إن النبي أمر له بحلة لما مدحه.
  en: One of the finest poets of Quraysh, harsh against the Muslims, who embraced Islam at the conquest; he fled to Najran after the fall of Mecca, verses of Hassan ibn Thabit reached him, he returned and became Muslim and composed verses of
    apology; al-Marzubani says the Prophet ordered him a robe when he praised him.
