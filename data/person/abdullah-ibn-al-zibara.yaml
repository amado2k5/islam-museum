summary:
  ar: من أشعر قريش، كان شديداً على المسلمين ثم أسلم في الفتح؛ هرب إلى نجران بعد الفتح فبلغته أبيات حسان بن ثابت فعاد وأسلم وقال شعراً في اعتذاره، وقال المرزباني إن النبي أمر له بحلة لما مدحه.
  en: One of the finest poets of Quraysh, harsh against the Muslims, who embraced Islam at the conquest; he fled to Najran after the fall of Mecca, verses of Hassan ibn Thabit reached him, he returned and became Muslim and composed verses of
    apology; al-Marzubani says the Prophet ordered him a robe when he praised him.
  ur: "قریش کے ممتاز شاعروں میں سے، مسلمانوں کے خلاف سخت، فتح مکہ پر مسلمان ہوئے؛ مکہ گرنے کے بعد نجران بھاگ گئے، پھر واپس آئے۔"
  fr: "L'un des meilleurs poètes de Quraysh, dur envers les musulmans, qui embrassa l'islam lors de la conquête ; il s'enfuit à Najran après la chute de La Mecque, des vers de Hassan ibn Thabit lui parvinrent, il revint, devint musulman et composa des vers d'excuse ; al-Marzubani dit que le Prophète lui fit donner un vêtement lorsqu'il fit son éloge."
  es: "Uno de los poetas más destacados de Quraysh, crítico acérrimo de los musulmanes que abrazaron el Islam tras la conquista; huyó a Najrán después de la caída de La Meca, le llegaron versos de Hassan ibn Thabit, regresó, se convirtió al Islam y compuso versos de apología; al-Marzubani dice que el Profeta le ordenó vestirse con una túnica cuando lo elogió."
  tr: "Kureyş kabilesinin en hitabet ustalarından biri olan Hasan bin Sabit, Müslümanlara karşı sertti, ancak fetih sırasında İslamiyet'i kabul etti. Fetihten sonra Necran'a kaçtı ve Hasan bin Sabit'in şiirleri ona ulaştı, bunun üzerine geri döndü, İslamiyet'i kabul etti ve özür dileyen şiirler yazdı. El-Marzubani, Peygamber'in onu övdüğünde ona bir elbise verilmesini emrettiğini söyledi."
  id: "Salah satu tokoh Quraisy yang paling fasih berbicara, ia bersikap keras terhadap kaum Muslimin, kemudian ia masuk Islam selama penaklukan. Ia melarikan diri ke Najran setelah penaklukan, dan syair-syair Hasan bin Thabit sampai kepadanya, sehingga ia kembali dan masuk Islam serta menggubah puisi sebagai pembelaannya. Al-Marzubani berkata bahwa Nabi memerintahkan agar ia diberi jubah ketika ia memujinya."
