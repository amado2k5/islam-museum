summary:
  ar: "عينته الأوامر السلطانية بيلربكاً على الجزائر بينما كان القائد يحيى مبحراً نحو وهران لإكمال خطة صالح رايس، فتولى القيادة في الحصار الذي لم يفتح المدينة بسبب النجدات الأسبانية المتواصلة، سنة ٩٦٣هـ/١٥٥٦م. ولقي مصرعه سنة ٩٦٤هـ/١٥٥٧م فأعاد السلطان حسن بن خير الدين إلى الجزائر {cite:dawlat-uthmaniyya-salabi p. 244-245}."
  en: "Named beylerbey of Algiers by sultanic order while the commander Yahya was already sailing on Oran to carry out Salih Reis's plan; he took over the siege that failed to take the city for Spain's continuous relief, in 963/1556. He met his death in 964/1557, whereupon the sultan returned Hasan b. Khayr al-Din to Algiers {cite:dawlat-uthmaniyya-salabi p. 244-245}."
