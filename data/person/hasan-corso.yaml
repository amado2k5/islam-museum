summary:
  ar: "عينته الأوامر السلطانية بيلربكاً على الجزائر بينما كان القائد يحيى مبحراً نحو وهران لإكمال خطة صالح رايس، فتولى القيادة في الحصار الذي لم يفتح المدينة بسبب النجدات الأسبانية المتواصلة، سنة ٩٦٣هـ/١٥٥٦م. ولقي مصرعه سنة ٩٦٤هـ/١٥٥٧م فأعاد السلطان حسن بن خير الدين إلى الجزائر {cite:dawlat-uthmaniyya-salabi p. 244-245}."
  en: "Named beylerbey of Algiers by sultanic order while the commander Yahya was already sailing on Oran to carry out Salih Reis's plan; he took over the siege that failed to take the city for Spain's continuous relief, in 963/1556. He met his death in 964/1557, whereupon the sultan returned Hasan b. Khayr al-Din to Algiers {cite:dawlat-uthmaniyya-salabi p. 244-245}."
  es: "Nombrado beylerbey de Argel por orden del sultán mientras el comandante Yahya ya navegaba hacia Orán para llevar a cabo el plan de Salih Reis, asumió el asedio que fracasó en su intento de tomar la ciudad para el continuo socorro de España, en 963/1556. Encontró la muerte en 964/1557, tras lo cual el sultán devolvió a Hasan b. Khayr al-Din a Argel {cite:dawlat-uthmaniyya-salabi p. 244-245}."
  fr: "Nommé beylerbey d'Alger par ordre du sultanat alors que le commandant Yahya était déjà en route pour Oran afin de mettre à exécution le plan de Salih Reis, il prit la relève du siège qui n'avait pas permis de prendre la ville pour le secours continu de l'Espagne, en 963/1556. Il trouva la mort en 964/1557, après quoi le sultan ramena Hasan b. Khayr al-Din à Alger {cite:dawlat-uthmaniyya-salabi p. 244-245}."
  ur: "سلطانی حکم کے مطابق الجزائر کے بیلربی کا نام دیا گیا جب کہ کمانڈر یحییٰ صالح رئیس کے منصوبے کو عملی جامہ پہنانے کے لیے پہلے ہی اوران پر سفر کر رہا تھا۔ اس نے 963/1556 میں محاصرہ سنبھال لیا جو اسپین کی مسلسل امداد کے لیے شہر کو لینے میں ناکام رہا۔ اس کی موت 964/1557 میں ہوئی، اس کے بعد سلطان نے حسن بن کو واپس کر دیا۔ خیرالدین ٹو الجزائر {حوالہ:دولت عثمانیہ صلابی ص۔ 244-245}۔"
