summary:
  ar: "مهندسة وريادية اجتماعية إندونيسية أمضت نحو ثلاثة عقود في إيصال الكهرباء إلى القرى النائية عبر محطات كهرومائية صغيرة، وصلت أعمالها إلى أكثر من نصف مليون إنسان."
  en: "Indonesian engineer and social entrepreneur who spent some three decades bringing electricity to remote villages through community micro-hydropower plants, work credited with reaching more than half a million people."
  ur: "انڈونیشیائی انجینئر اور سماجی کاروباری خاتون جنھوں نے تقریباً تین دہائیوں دیہی چھوٹے پن بجلی گھروں کے ذریعے دور دراز گاؤں کو بجلی پہنچائی؛ ان کے کام سے نصف ملین سے زائد لوگ مستفید ہوئے۔"
  es: "Ingeniero indonesio y emprendedor social que dedicó unas tres décadas a llevar electricidad a aldeas remotas mediante microcentrales hidroeléctricas comunitarias, una labor que, según se cree, ha beneficiado a más de medio millón de personas."
  fr: "Ingénieur et entrepreneur social indonésien qui a consacré une trentaine d'années à apporter l'électricité à des villages reculés grâce à des microcentrales hydroélectriques communautaires, un travail qui aurait permis d'atteindre plus d'un demi-million de personnes."
  tr: "Endonezyalı bir mühendis ve sosyal girişimci, neredeyse otuz yıl boyunca küçük hidroelektrik santralleri aracılığıyla uzak köylere elektrik ulaştırıyor ve çalışmaları yarım milyondan fazla insana ulaştı."
  id: "Seorang insinyur dan pengusaha sosial Indonesia yang telah menghabiskan hampir tiga dekade mengalirkan listrik ke desa-desa terpencil melalui pembangkit listrik tenaga air kecil, yang karyanya telah menjangkau lebih dari setengah juta orang."
