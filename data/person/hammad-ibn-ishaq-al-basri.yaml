summary:
  ar: "حماد بن إسحاق بن إسماعيل بن حماد بن زيد الأزدي، ولد سنة تسع وتسعين ومائة وولي القضاء ببغداد وحدّث بها عن القعنبي، وروى عنه الحسين الحاملي، وكان ثقة فصيحًا يعرف مذهب مالك، كثير التصانيف في فنون، توفي بالسوس سنة سبع وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 59}."
  en: "Hammad ibn Ishaq al-Azdi — qadi of Baghdad, transmitter from al-Qa'nabi, described as trustworthy, eloquent, versed in Malik's madhhab and author of many works; died at al-Sus in 267 {cite:muntazam-ibn-al-jawzi p. 59}."
  es: "Hammad ibn Ishaq al-Azdi — cadí de Bagdad, transmisor de al-Qa'nabi, descrito como digno de confianza, elocuente, versado en la escuela de pensamiento de Malik y autor de numerosas obras; murió en al-Sus en 267 {cite:muntazam-ibn-al-jawzi p. 59}."
  fr: "Hammad ibn Ishaq al-Azdi — cadi de Bagdad, transmetteur d'al-Qa'nabi, décrit comme digne de confiance, éloquent, versé dans le madhhab de Malik et auteur de nombreuses œuvres; mort à al-Sus en 267 {cite:muntazam-ibn-al-jawzi p. 59}."
  ur: "حماد بن اسحاق العزدی - بغداد کے قاضی، القنبی سے نقل کرنے والے، ثقہ، فصیح، مالک کے مذھب میں مہارت رکھنے والے اور بہت سے کاموں کے مصنف کے طور پر بیان کیے گئے؛ سنہ 267 میں السوس میں وفات پائی۔ 59}۔"
