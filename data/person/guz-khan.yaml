summary:
  ar: "كوميدي وممثل بريطاني وُلد في كوفنتري سنة 1986 باسم غلام دستغير خان لأبوين باكستانيين بنجابيين. عمل معلمًا للعلوم الإنسانية قبل أن ينتشر مقطعه «باكيسوروس» سنة 2015 بشخصيته «مبين»، ثم ابتكر مسلسل بي بي سي الكوميدي «رجل مثل مبين» ومثّل فيه (2017–2025)، وظهر في «تاسك ماستر» و«علمنا يعني الموت» و«الجنتلمن»."
  en: "British comedian and actor, born in Coventry in 1986 as Ghulam Dastgir Khan to Pakistani Punjabi parents. A humanities teacher before comedy, he went viral in 2015 with his character Mobeen in the 'Pakisaurus' video, then created and starred in the BBC comedy Man Like Mobeen (2017–2025), and has appeared in Taskmaster, Our Flag Means Death and The Gentlemen."
  ur: "برطانوی کامیڈین اور اداکار، جو 1986 میں کوونٹری میں غلام دستگیر خان کے نام سے پاکستانی پنجابی والدین کے ہاں پیدا ہوئے۔ کامیڈی سے پہلے انسانی علوم کے استاد رہے؛ 2015 میں اپنے کردار «مبین» کی «پاکی سارس» ویڈیو سے وائرل ہوئے، پھر بی بی سی کی کامیڈی «مین لائک مبین» (2017–2025) بنائی اور اس میں اداکاری کی، اور «ٹاسک ماسٹر»، «آور فلیگ مینز ڈیتھ» اور «دی جنٹلمین» میں نظر آئے۔"

