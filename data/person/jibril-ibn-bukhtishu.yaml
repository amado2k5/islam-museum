  ar: "طبيب درس في بيمارستان جنديسابور، وخدم الخلفاء الرشيد وغيره، ولد وعاش في جنديسابور. وعند المسعودي منع الرشيد عن سمكة أهديت له بالحيرة فجعل في ثلاثة أقداح قطعاً منها وصب على واحد خمراً وعلى الثاني ماءً بثلج وخلط الثالث بألوان الطعام، فلما انتبه الرشيد وجد ما صب عليه الخمر قد تفتت وما في الماء قد ربا وما خالطه الطعام قد تغيرت رائحته وحدثت له سهوكة، فحمل إليه خمسة آلاف دينار وقال من يلومني على محبة هذا الرجل {cite:muruj-al-dhahab p. 332-333}"
  en: "A physician who studied at the hospital of Gundishapur and served the caliphs including al-Rashid. He was born and lived in Gundishapur."
