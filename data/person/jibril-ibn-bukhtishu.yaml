summary:
  ar: "طبيب درس في بيمارستان جنديسابور، وخدم الخلفاء الرشيد وغيره، ولد وعاش في جنديسابور. وعند المسعودي منع الرشيد عن سمكة أهديت له بالحيرة فجعل في ثلاثة أقداح قطعاً منها وصب على واحد خمراً وعلى الثاني ماءً بثلج وخلط الثالث بألوان الطعام، فلما انتبه الرشيد وجد ما صب عليه الخمر قد تفتت وما في الماء قد ربا وما خالطه الطعام قد تغيرت رائحته وحدثت له سهوكة، فحمل إليه خمسة آلاف دينار وقال من يلومني على محبة هذا الرجل {cite:muruj-al-dhahab p. 332-333}"
  en: "A physician who studied at the hospital of Gundishapur and served the caliphs including al-Rashid. He was born and lived in Gundishapur."
  es: "Médico que estudió en el hospital de Gundishapur y sirvió a los califas, entre ellos al-Rashid. Nació y vivió en Gundishapur."
  fr: "Médecin ayant étudié à l'hôpital de Gundishapur et ayant servi les califes, notamment al-Rashid, il est né et a vécu à Gundishapur."
  ur: "ایک طبیب جس نے گنڈیشاپور کے ہسپتال میں تعلیم حاصل کی اور الرشید سمیت خلفاء کی خدمت کی۔ وہ گنڈیشاپور میں پیدا ہوئے اور رہتے تھے۔"
  tr: "Jundishapur hastanesinde eğitim görmüş, Halifeler el-Reşid ve diğerlerine hizmet etmiş, Cündişapur'da doğmuş ve yaşamıştır. El-Mes'udi'ye göre, el-Reşid ona el-Hirah'ta hediye edilen bir balığı yasaklamış, bu yüzden üç bardağa parçalar koymuş, birine şarap dökmüş, diğerine buzlu su dökmüş ve üçüncüsünü gıda boyalarıyla karıştırmıştır. El-Reşid fark ettiğinde, üzerine dökülen şarabın ufalandığını, sudakinin griye döndüğünü ve yemekle karışan şeyin kokusunun değişip ona talihsizlik getirdiğini fark etmiştir. Ona beş bin dinar getirmiş ve 'Bu adamı sevdiğim için kim beni suçlayabilir?' demiştir. {alıntı:Muruj-al-Dhahab, s. 332-333}"
  id: "Seorang dokter yang belajar di rumah sakit Jundishapur, melayani Khalifah al-Rashid dan lainnya, dan lahir serta tinggal di Jundishapur. Menurut al-Mas'udi, al-Rashid melarangnya mendapatkan ikan yang diberikan kepadanya di al-Hirah, jadi ia menaruh potongan-potongan ikan itu dalam tiga cangkir, menuangkan anggur di satu cangkir, air dengan es di cangkir lainnya, dan mencampur yang ketiga dengan pewarna makanan. Ketika al-Rashid menyadari, ia mendapati anggur yang dituangkan padanya telah hancur, apa yang ada di dalam air menjadi abu-abu, dan apa yang bercampur dengan makanan berubah bau dan menyebabkan kemalangan baginya. Ia membawakan lima ribu dinar dan berkata, 'Siapa yang bisa menyalahkan saya karena mencintai orang ini?' {cite:muruj-al-dhahab, hlm. 332-333}"
