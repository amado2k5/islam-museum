summary:
  ar: "محمد بن أحمد الشربيني، شمس الدين، فقيه شافعي ومفسر من أهل القاهرة، صاحب السراج المنير في تفسير القرآن ومغني المحتاج في شرح منهاج الطالبين؛ توفي سنة 977هـ الموافقة 1570م."
  en: "Muhammad ibn Ahmad al-Shirbini, Shams al-Din, a Shafi'i jurist and exegete of Cairo, author of al-Siraj al-munir, a commentary on the Qur'an, and Mughni al-muhtaj, a commentary on al-Nawawi's Minhaj al-talibin; died 977 AH, 1570 CE."
  es: "Muhammad ibn Ahmad al-Shirbini, Shams al-Din, jurista y exégeta shafi'í de El Cairo, autor de al-Siraj al-munir, un comentario sobre el Corán, y Mughni al-muhtaj, un comentario sobre el Minhaj al-talibin de al-Nawawi; murió en el año 977 de la Hégira (1570 d. C.)."
  fr: "Muhammad ibn Ahmad al-Shirbini, Shams al-Din, juriste et exégète chaféite du Caire, auteur d'al-Siraj al-munir, un commentaire sur le Coran, et de Mughni al-muhtaj, un commentaire sur Minhaj al-talibin d'al-Nawawi; mort en 977 AH, 1570 CE."
  ur: "محمد بن احمد الشربینی، شمس الدین، قاہرہ کے شافعی فقیہ اور مفسر، السراج المنیر کے مصنف، تفسیر قرآن، اور مغنی المحتاج، ایک تفسیر النبوی کی منہاج الطالبین؛ وفات 977ھ بمطابق 1570ء۔"
  tr: "Muhammed ibn Ahmed al-Sharbini, Şemseddin, Kahire'den bir Şafii hukukçu ve tefsir, El-Sirec el-Munir fi Tafsir al-Kur'an wa Mughni al-Muhtaj fi Sharh Minhaj al-Talibin'in yazarı; 977 H.S.'de vefat etti, bu da M.S. 1570'e karşılık gelir."
  id: "Muhammad ibn Ahmad al-Sharbini, Shams al-Din, seorang ahli hukum dan penafsir Shafi'i dari Kairo, penulis Al-Siraj al-Munir fi Tafsir al-Qur'an wa Mughni al-Muhtaj fi Sharh Minhaj al-Talibin; meninggal pada tahun 977 H, setara dengan tahun 1570 M."
