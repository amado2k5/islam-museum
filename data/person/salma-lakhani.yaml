summary:
  ar: "سيدة أعمال وناشطة مجتمعية كندية من أصل أوغندي، نُصّبت سنة 2020 نائبة لحاكم ألبرتا فكانت أول مسلمة وأول جنوب آسيوية تتولّى منصبًا نيابيًا ملكيًا في كندا، بعد عقود من العمل التطوعي في إدمونتون."
  en: "Ugandan-born Canadian businesswoman and community advocate installed in 2020 as lieutenant governor of Alberta — the first Muslim and the first South Asian to hold a viceregal office in Canada — after decades of volunteer service in Edmonton."
