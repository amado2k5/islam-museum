summary:
  ar: "صاحب الكرك من بيت أيوب، ابن الناصر داود؛ سمع من ابن اللتي وروى عنه الدمياطي في معجمه، وتوفي بالقدس في ذي الحجة وله سبعون سنة {cite:shadharat-dhahab p. 774}."
  en: "Lord of Karak from the house of Ayyub, son of al-Nasir Dawud; he heard from Ibn al-Lati, and al-Dimyati transmitted from him in his Mu'jam, and he died in Jerusalem in Dhu'l-Hijja, aged seventy {cite:shadharat-dhahab p. 774}."
  es: "Señor de Karak de la casa de Ayyub, hijo de al-Nasir Dawud; escuchó de Ibn al-Lati, y al-Dimyati transmitió de él en su Mu'jam, y murió en Jerusalén en Dhu'l-Hijja, a la edad de setenta años {cite:shadharat-dhahab p. 774}."
  fr: "Seigneur de Karak de la maison d'Ayyub, fils d'al-Nasir Dawud; il a entendu d'Ibn al-Lati, et al-Dimyati a transmis de lui dans son Mu'jam, et il est mort à Jérusalem en Dhu'l-Hijja, à l'âge de soixante-dix ans {cite: shadharat-dhahab p. 774}."
  ur: "کرک کے رب ایوب کے گھر سے، الناصر داؤد کے بیٹے؛ انہوں نے ابن لاطی سے سنا، اور الدمیاطی نے ان سے اپنے معجم میں نقل کیا، اور ان کی وفات یروشلم میں ذی الحجہ میں ستر سال کی عمر میں ہوئی. 774}۔"
