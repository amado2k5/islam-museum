summary:
  ar: "محامٍ وسياسي بنغلاديشي (وُلد في 20 أبريل 1937 في كلكتا)، من أبرز واضعي دستور بنغلاديش سنة 1972 ويُلقب بأبي الدستور، تولى وزارتي القانون (1972–1973) والخارجية (1973–1975) في حكومات الاستقلال الأولى، وأسس حزب غانو فورم وقاد ائتلاف الجبهة الوطنية المتحدة سنة 2018، واعتزل السياسة في أكتوبر 2023 وبقي رئيسًا فخريًا لحزبه."
  en: "Bangladeshi jurist and politician (born 20 April 1937 at Calcutta), a principal drafter of Bangladesh's 1972 constitution and styled its father, who served as law minister (1972–1973) and foreign minister (1973–1975) in the first independence governments, founded the Gano Forum, led the Jatiya Oikya Front coalition in 2018, and retired from politics in October 2023, remaining his party's emeritus president."
  ur: "بنگلہ دیشی منصف اور سیاست دان (پیدائش 20 اپریل 1937ء، کلکتہ)، بنگلہ دیش کے 1972ء کے آئین کے اہم مصنف اور «بابائے آئین» کہلاتے ہیں، پہلی آزادی حکومتوں میں وزیرِ قانون (1972ء–1973ء) اور وزیرِ خارجہ (1973ء–1975ء) رہے، گانو فورم کی بنیاد رکھی، 2018ء میں قومی متحدہ محاذ کی قیادت کی اور اکتوبر 2023ء میں سیاست سے کنارہ کش ہو کر پارٹی کے صدرِ فخری بنے۔"
