summary:
  ar: "محامٍ وسياسي بنغلاديشي ⁦(وُلد في 20 أبريل 1937 في كلكتا)⁩، من أبرز واضعي دستور بنغلاديش سنة 1972 ويُلقب بأبي الدستور، تولى وزارتي القانون (1972–1973) والخارجية (1973–1975) في حكومات الاستقلال الأولى، وأسس حزب غانو فورم وقاد ائتلاف الجبهة الوطنية المتحدة سنة 2018، واعتزل السياسة في أكتوبر 2023 وبقي رئيسًا فخريًا لحزبه."
  en: "Bangladeshi jurist and politician (born 20 April 1937 at Calcutta), a principal drafter of Bangladesh's 1972 constitution and styled its father, who served as law minister (1972–1973) and foreign minister (1973–1975) in the first independence governments, founded the Gano Forum, led the Jatiya Oikya Front coalition in 2018, and retired from politics in October 2023, remaining his party's emeritus president."
  ur: "بنگلہ دیشی منصف اور سیاست دان ⁦(پیدائش 20 اپریل 1937ء، کلکتہ)⁩، بنگلہ دیش کے 1972ء کے آئین کے اہم مصنف اور «بابائے آئین» کہلاتے ہیں، پہلی آزادی حکومتوں میں وزیرِ قانون ⁦(1972ء–1973ء)⁩ اور وزیرِ خارجہ ⁦(1973ء–1975ء)⁩ رہے، گانو فورم کی بنیاد رکھی، 2018ء میں قومی متحدہ محاذ کی قیادت کی اور اکتوبر 2023ء میں سیاست سے کنارہ کش ہو کر پارٹی کے صدرِ فخری بنے۔"
  es: "Jurista y político bangladesí (nacido el 20 de abril de 1937 en Calcuta), uno de los principales redactores de la constitución de Bangladesh de 1972 y considerado su padre, que se desempeñó como ministro de Justicia (1972-1973) y ministro de Asuntos Exteriores (1973-1975) en los primeros gobiernos de independencia, fundó el Foro Gano, lideró la coalición Jatiya Oikya Front en 2018 y se retiró de la política en octubre de 2023, permaneciendo como presidente emérito de su partido."
  fr: "Juriste et homme politique bangladais (né le 20 avril 1937 à Calcutta), principal rédacteur de la constitution du Bangladesh de 1972 et surnommé son père, qui a été ministre de la Justice (1972-1973) et ministre des Affaires étrangères (1973-1975) dans les premiers gouvernements d'indépendance, a fondé le Forum Gano, a dirigé la coalition Jatiya Oikya Front en 2018 et s'est retiré de la politique en octobre 2023, restant président émérite de son parti."
  tr: "Avukat ve Bangladeşli siyasetçi (20 Nisan 1937, Kalküta doğumlu), 1972 Anayasası'nın en önde gelen taslakçılarından biri olan ve Anayasa'nın Babası olarak bilinir. İlk bağımsızlık hükümetlerinde Hukuk Bakanı (1972–1973) ve Dışişleri Bakanı (1973–1975) olarak görev yaptı. Gano Forum partisini kurdu ve 2018'de Birleşik Ulusal Cephe koalisyonuna liderlik etti. Ekim 2023'te siyasetten emekli oldu ve partisinin onursal başkanı olarak kaldı."
  id: "Seorang pengacara dan politisi Bangladesh (lahir 20 April 1937 di Calcutta), salah satu penyusun Konstitusi Bangladesh 1972 yang paling menonjol, dikenal sebagai Bapak Konstitusi. Ia menjabat sebagai Menteri Hukum (1972–1973) dan Luar Negeri (1973–1975) dalam pemerintahan kemerdekaan pertama. Ia mendirikan partai Forum Gano dan memimpin koalisi United National Front pada tahun 2018. Ia pensiun dari dunia politik pada Oktober 2023 dan tetap menjabat sebagai presiden kehormatan partainya."
