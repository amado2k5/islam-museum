summary:
  ar: "لاعب كريكت أسترالي دولي سابق، وُلد في إسلام آباد بباكستان سنة 1986 وهاجرت أسرته إلى نيو ساوث ويلز وهو في الرابعة. ضارب أيسر في أعلى الترتيب لعب 88 اختبارا و40 مباراة يوم واحد لأستراليا بين 2011 و2026 وسجّل 6229 جولة اختبار و16 مئوية، وهو أول مسلم وأول مولود في باكستان يلعب كريكت الاختبار لأستراليا. كان أعلى مسجلي أستراليا في بطولة العالم للاختبار 2021–2023 برصيد 1621 جولة حين فازت أستراليا باللقب، ونال جائزة أفضل لاعب اختبار في العالم من المجلس الدولي للكريكت عن سنة 2023، وعاد بمئويتين توأمين في اختبار الرماد بسيدني في يناير 2022 وسجّل أعلى نتيجة له 232 أمام سريلانكا في يناير 2025، واعتزل الكريكت الدولية في يناير 2026 بعد اختبار الرماد الختامي في سيدني."
  en: "Australian former international cricketer, born in Islamabad, Pakistan, in 1986; his family emigrated to New South Wales when he was four. A left-handed top-order batter, he played 88 Tests and 40 One Day Internationals for Australia between 2011 and 2026, scoring 6,229 Test runs with 16 centuries, and was the first Muslim and the first Pakistani-born cricketer to play Test cricket for Australia. He was Australia's highest scorer in the 2021–2023 World Test Championship with 1,621 runs as Australia won the title, was named ICC Test Cricketer of the Year for 2023, made a celebrated comeback with twin centuries in the January 2022 Sydney Ashes Test and a career-best 232 against Sri Lanka in January 2025, and retired from international cricket in January 2026 after the final Ashes Test in Sydney."
  ur: "آسٹریلیا کے سابق بین الاقوامی کرکٹ کھلاڑی، جو 1986 میں اسلام آباد، پاکستان میں پیدا ہوئے اور چار سال کی عمر میں خاندان کے ساتھ نیو ساؤتھ ویلز منتقل ہوئے۔ بائیں ہاتھ کے ممتاز بلے باز کی حیثیت سے انھوں نے 2011ء سے 2026ء کے درمیان آسٹریلیا کے لیے 88 ٹیسٹ اور 40 ایک روزہ میچ کھیلے، 6,229 ٹیسٹ رنز اور 16 سنچریاں بنائیں، اور وہ آسٹریلیا کے لیے ٹیسٹ کرکٹ کھیلنے والے پہلے مسلمان اور پہلے پاکستانی نژاد کھلاڑی بنے۔ وہ 2023 میں آئی سی سی ٹیسٹ کرکٹر آف دی ایئر قرار پائے اور جنوری 2026 میں بین الاقوامی کرکٹ سے ریٹائر ہوئے۔"
