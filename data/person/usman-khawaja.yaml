summary:
  ar: "لاعب كريكت أسترالي دولي سابق، وُلد في إسلام آباد بباكستان سنة 1986 وهاجرت أسرته إلى نيو ساوث ويلز وهو في الرابعة. ضارب أيسر في أعلى الترتيب لعب 88 اختبارا و40 مباراة يوم واحد لأستراليا بين 2011 و2026 وسجّل 6229 جولة اختبار و16 مئوية، وهو أول مسلم وأول مولود في باكستان يلعب كريكت الاختبار لأستراليا. كان أعلى مسجلي أستراليا في بطولة العالم للاختبار 2021–2023 برصيد 1621 جولة حين فازت أستراليا باللقب، ونال جائزة أفضل لاعب اختبار في العالم من المجلس الدولي للكريكت عن سنة 2023، وعاد بمئويتين توأمين في اختبار الرماد بسيدني في يناير 2022 وسجّل أعلى نتيجة له 232 أمام سريلانكا في يناير 2025، واعتزل الكريكت الدولية في يناير 2026 بعد اختبار الرماد الختامي في سيدني."
  en: "Australian former international cricketer, born in Islamabad, Pakistan, in 1986; his family emigrated to New South Wales when he was four. A left-handed top-order batter, he played 88 Tests and 40 One Day Internationals for Australia between 2011 and 2026, scoring 6,229 Test runs with 16 centuries, and was the first Muslim and the first Pakistani-born cricketer to play Test cricket for Australia. He was Australia's highest scorer in the 2021–2023 World Test Championship with 1,621 runs as Australia won the title, was named ICC Test Cricketer of the Year for 2023, made a celebrated comeback with twin centuries in the January 2022 Sydney Ashes Test and a career-best 232 against Sri Lanka in January 2025, and retired from international cricket in January 2026 after the final Ashes Test in Sydney."
  ur: "آسٹریلیا کے سابق بین الاقوامی کرکٹ کھلاڑی، جو 1986 میں اسلام آباد، پاکستان میں پیدا ہوئے اور چار سال کی عمر میں خاندان کے ساتھ نیو ساؤتھ ویلز منتقل ہوئے۔ بائیں ہاتھ کے ممتاز بلے باز کی حیثیت سے انھوں نے 2011ء سے 2026ء کے درمیان آسٹریلیا کے لیے 88 ٹیسٹ اور 40 ایک روزہ میچ کھیلے، 6,229 ٹیسٹ رنز اور 16 سنچریاں بنائیں، اور وہ آسٹریلیا کے لیے ٹیسٹ کرکٹ کھیلنے والے پہلے مسلمان اور پہلے پاکستانی نژاد کھلاڑی بنے۔ وہ 2023 میں آئی سی سی ٹیسٹ کرکٹر آف دی ایئر قرار پائے اور جنوری 2026 میں بین الاقوامی کرکٹ سے ریٹائر ہوئے۔"
  es: "Exjugador internacional de críquet australiano, nacido en Islamabad, Pakistán, en 1986; su familia emigró a Nueva Gales del Sur cuando él tenía cuatro años. Bateador zurdo de la parte alta del orden, jugó 88 Tests y 40 One Day Internationals para Australia entre 2011 y 2026, anotando 6229 carreras en Tests con 16 siglos, y fue el primer musulmán y el primer jugador de críquet nacido en Pakistán en jugar críquet Test para Australia. Fue el máximo anotador de Australia en el Campeonato Mundial de Test 2021-2023 con 1621 carreras cuando Australia ganó el título, fue nombrado Jugador de Críquet Test del Año de la ICC en 2023, tuvo un regreso célebre con dos siglos en el Test Ashes de Sídney en enero de 2022 y un récord personal de 232 contra Sri Lanka en enero de 2025, y se retiró del críquet internacional en enero de 2026 después del último Test Ashes en Sídney."
  fr: "Né à Islamabad (Pakistan) en 1986, cet ancien joueur de cricket international australien a vu sa famille émigrer en Nouvelle-Galles du Sud à l'âge de quatre ans. Batteur gaucher de haut niveau, il a disputé 88 Tests et 40 ODI pour l'Australie entre 2011 et 2026, totalisant 6 229 runs en Test, dont 16 centuries. Il fut le premier musulman et le premier joueur de cricket d'origine pakistanaise à jouer en Test pour l'Australie. Meilleur marqueur australien du Championnat du monde de Test 2021-2023 avec 1 621 runs, il contribua à la victoire de l'Australie et fut nommé Joueur de l'année ICC en Test pour 2023. Il effectua un retour remarqué avec un double century lors du Test des Ashes de Sydney en janvier 2022 et un record personnel de 232 runs contre le Sri Lanka en janvier 2025. Il prit sa retraite internationale en janvier 2026 après le dernier Test des Ashes à Sydney."
  tr: "1986'da Pakistan'ın İslamabad kentinde doğan eski bir Avustralya uluslararası kriketçisi olan Sher, dört yaşındayken ailesi Yeni Güney Galler'e göç etti. Üst sıra solak atıcısı olan Sher, 2011 ile 2026 yılları arasında Avustralya için 88 Test ve 40 tek günlük maç oynadı, 6.229 Test vuruşu ve yüzde 16 ile oynadı. Avustralya için Test kriketi oynayan ilk Müslüman ve Pakistan doğumlu oyuncudur. 2021–2023 Test Dünya Şampiyonası'nda Avustralya'nın en çok sayı yapan oyuncusu oldu ve Avustralya şampiyonluğu kazandığında 1.621 koşu yaptı. 2023 ICC Dünya Test Yılın Oyuncusu ödülünü kazandı, Ocak 2022'de Sydney'deki Ash Testinde iki çift yüzyılla geri döndü ve Ocak 2025'te Sri Lanka'ya karşı en yüksek skoru olan 232'yi yaptı. Ocak 2026'da Sydney'deki son Ash Testinden sonra uluslararası kriketten emekli oldu."
  id: "Mantan pemain kriket internasional Australia, lahir di Islamabad, Pakistan, pada tahun 1986, keluarganya pindah ke New South Wales saat ia berusia empat tahun. Sebagai pemain kidal tingkat atas, ia bermain 88 Test dan 40 pertandingan satu hari untuk Australia antara 2011 dan 2026, mencetak 6.229 inning Test dan 16 persentil. Ia adalah Muslim dan Pakistan pertama yang bermain kriket Test untuk Australia. Ia menjadi pencetak skor terbanyak Australia di Kejuaraan Dunia Test 2021–2023 dengan 1.621 run saat Australia memenangkan gelar. Ia memenangkan penghargaan ICC World Test Player of the Year untuk 2023, kembali dengan dua double century di Ash Test di Sydney pada Januari 2022, mencetak skor tertingginya 232 melawan Sri Lanka pada Januari 2025. Ia pensiun dari kriket internasional pada Januari 2026 setelah Ash Test terakhir di Sydney."
