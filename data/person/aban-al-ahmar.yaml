summary:
  ar: "أبان بن عثمان بن يحيى بن زكريا اللؤلؤي البجلي بالولاء، أبو عبد الله، المعروف بالأحمر، عالم بالأخبار والأنساب إمامي، أصله من الكوفة وكان يسكنها تارة ويسكن البصرة تارة؛ صاحب كتاب المغازي، توفي نحو 200هـ الموافق نحو 815م."
  en: "Aban ibn Uthman ibn Yahya ibn Zakariyya al-Lu'lu'i al-Bajali, by clientship, Abu Abdallah, known as al-Ahmar: a scholar of reports and genealogies, labelled Imami (Shi'i) in al-A'lam; of Kufan origin, he lived at times in Kufa and at times in Basra; author of a book of maghazi; died about 200 AH, about 815 CE."
  fr: "Aban ibn Uthman ibn Yahya ibn Zakariyya al-Lu'lu'i al-Bajali, par clientèle, Abu Abdallah, dit al-Ahmar : savant des récits et des généalogies, qualifié d'imamite (chiite) dans al-A'lam ; d'origine koufienne, il vécut tantôt à Koufa, tantôt à Bassora ; auteur d'un livre de maghazi ; mort vers 200 H, vers 815 ap. J.-C."
  es: "Aban ibn Uthman ibn Yahya ibn Zakariyya al-Lu'lu'i al-Bajali, por clientelismo, Abu Abdallah, conocido como al-Ahmar: un erudito de informes y genealogías, etiquetado como Imami (Chií) en al-A'lam; de origen kufano, vivió en ocasiones en Kufa y en ocasiones en Basora; autor de un libro de maghazi; murió alrededor del año 200 AH, alrededor del año 815 d. C."
  ur: "ابان بن عثمان بن یحییٰ ابن زکریا اللوئی البجلی، بذریعہ موصوف، ابو عبداللہ، الاحمر کے نام سے جانا جاتا ہے: رپورٹوں اور نسبوں کے ماہر، الاعلام میں امامی ⁦(شیعہ)⁩ کا لیبل لگاتے ہیں۔ کوفان کی نسل سے، وہ کبھی کوفہ میں اور کبھی بصرہ میں رہتے تھے۔ مغازی کی ایک کتاب کے مصنف؛ ان کی وفات تقریباً 200 ہجری یعنی 815 عیسوی میں ہوئی۔"
