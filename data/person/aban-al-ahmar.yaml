summary:
  ar: "أبان بن عثمان بن يحيى بن زكريا اللؤلؤي البجلي بالولاء، أبو عبد الله، المعروف بالأحمر، عالم بالأخبار والأنساب إمامي، أصله من الكوفة وكان يسكنها تارة ويسكن البصرة تارة؛ صاحب كتاب المغازي، توفي نحو 200هـ الموافق نحو 815م."
  en: "Aban ibn Uthman ibn Yahya ibn Zakariyya al-Lu'lu'i al-Bajali, by clientship, Abu Abdallah, known as al-Ahmar: a scholar of reports and genealogies, labelled Imami (Shi'i) in al-A'lam; of Kufan origin, he lived at times in Kufa and at times in Basra; author of a book of maghazi; died about 200 AH, about 815 CE."
