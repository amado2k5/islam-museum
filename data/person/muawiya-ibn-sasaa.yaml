id: person/muawiya-ibn-sasaa
class: person
label: { ar: "معاوية بن صعصعة", en: "Mu'awiya ibn Sa'sa'a", es: "Mu'awiya ibn Sa'sa'a", fr: "Mu'awiya ibn Sa'sa'a", ur: "معاویہ بن صاع" }
summary:
  ar: "معاوية بن صعصعة بن معاوية؛ ابن عم الأحنف بن قيس؛ أعان حميري بن هلال في نزاع المرغاب فلما شكا بشير أن مرغابه مسرح إبلهم وبقرهم قال معاوية أمن أجل ثلث بقرة عقفاء وأتان وديق تريد أن تغلبنا على حمنا."
  en: "Mu'awiya ibn Sa'sa'a ibn Mu'awiya, al-Ahnaf ibn Qays's cousin's son; he backed Humayri in the Marghab feud — when Bashir pleaded the canal was their herds' pasture: 'for a bow-legged cow, a she-ass and a kid you would take our pasture?'"
  es: "Mu'awiya ibn Sa'sa'a ibn Mu'awiya, hijo del primo de al-Ahnaf ibn Qays; apoyó a Humayri en la disputa de Marghab, cuando Bashir alegó que el canal era el pasto de sus rebaños: \"¿Por una vaca patizamba, una asna y un cabrito querríais tomar nuestro pasto?\"."
  fr: "Mu'awiya ibn Sa'sa'a ibn Mu'awiya, fils du cousin d'al-Ahnaf ibn Qays; il a soutenu Humayri dans la querelle de Marghab — lorsque Bashir a plaidé que le canal était le pâturage de leurs troupeaux: « pour une vache aux pattes arquées, une ânesse et un chevreau, vous prendriez notre pâturage ? »"
  ur: "معاویہ بن صاعع بن معاویہ، احنف ابن قیس کے چچا زاد بھائی کا بیٹا۔ اس نے مرغاب کے جھگڑے میں ہمیری کی حمایت کی - جب بشیر نے عرض کیا کہ نہر ان کے ریوڑ کی چراگاہ ہے: 'ایک کمان والی گائے، گدھے اور ایک بچے کے لیے آپ ہماری چراگاہ لیں گے؟'"
  tr: "Muaviye ibn Sa'sa'ah ibn Muawiyah, el-Ahnaf ibn Qays'ın kuzeni, Humayri ibn Hilal'e merghab üzerindeki anlaşmazlıkta yardım etti. Beşir, merghabının deve ve sığırlarının kesimhanesi olduğunu şikayet ettiğinde, Muaviye şöyle dedi: Bir günah keçisi, eşek ve eşeğe bir ineğin üçte birini vermek güvenli midir, onlar bizi eşeklerimiz yüzünden yenmek istiyorlar?"
  id: "Muawiyah ibn Sa'sa'ah ibn Muawiyah, sepupu al-Ahnaf ibn Qays, membantu Humayri ibn Hilal dalam perselisihan tentang marghab. Ketika Bashir mengeluh bahwa marghabnya adalah tempat penyembelihan unta dan ternak mereka, Muawiya berkata: Apakah aman memberikan sepertiga sapi kepada kambing hitam, keledai, dan keledai yang ingin mengalahkan kita atas keledai kita?"
