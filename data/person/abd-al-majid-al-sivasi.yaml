summary:
  ar: "عبد المجيد شمس الدين بن محرم أبي الليث بن محمد السيواسي، واعظ من علماء الدولة العثمانية، استدعاه السلطان محمد الثالث من سيواس إلى الآستانة فأقام للوعظ والإرشاد إلى أن توفي، وله نحو عشرين كتاباً ورسالة؛ ٩٧١ إلى ١٠٤٩هـ الموافقة ١٥٦٤ إلى ١٦٣٩م."
  en: "Abd al-Majid, Shams al-Din, ibn Muharram, Abu al-Layth, ibn Muhammad al-Sivasi, a preacher among the scholars of the Ottoman state, summoned by Sultan Mehmed III from Sivas to Istanbul, where he stayed preaching and guiding until his death, author of about twenty books and treatises; 971 to 1049 AH, equal to 1564 to 1639 CE."
