  es: "Abd al-Majid al-Sivasi"
  ur: "عبد المجید السیواسی"
roles: [sufi, preacher, scholar]
gender: male
summary:
  ar: "عبد المجيد شمس الدين بن محرم أبي الليث بن محمد السيواسي، واعظ من علماء الدولة العثمانية، استدعاه السلطان محمد الثالث من سيواس إلى الآستانة فأقام للوعظ والإرشاد إلى أن توفي، وله نحو عشرين كتاباً ورسالة؛ ٩٧١ إلى ١٠٤٩هـ الموافقة ١٥٦٤ إلى ١٦٣٩م."
  en: "Abd al-Majid, Shams al-Din, ibn Muharram, Abu al-Layth, ibn Muhammad al-Sivasi, a preacher among the scholars of the Ottoman state, summoned by Sultan Mehmed III from Sivas to Istanbul, where he stayed preaching and guiding until his death, author of about twenty books and treatises; 971 to 1049 AH, equal to 1564 to 1639 CE."
  fr: "Abd al-Majid, Shams al-Din, ibn Muharram, Abu al-Layth, ibn Muhammad al-Sivasi, prédicateur parmi les savants de l'État ottoman, appelé par le sultan Mehmed III de Sivas à Istanbul, où il resta à prêcher et à guider jusqu'à sa mort, auteur d'une vingtaine de livres et de traités ; 971 à 1049 H, soit 1564 à 1639 ap. J.-C."
  es: "Abd al-Majid, Shams al-Din, ibn Muharram, Abu al-Layth, ibn Muhammad al-Sivasi, predicador entre los eruditos del estado otomano, convocado por el sultán Mehmed III de Sivas a Estambul, donde permaneció predicando y guiando hasta su muerte, autor de unos veinte libros y tratados; 971 a 1049 AH, equivalente a 1564 a 1639 d. C."
  ur: "عبد الماجد، شمس الدین، ابن محرم، ابو اللیث، ابن محمد السیواسی، سلطنت عثمانیہ کے علماء میں سے ایک مبلغ، جنہیں سلطان محمد سوم نے سیواس سے استنبول بلوایا، جہاں وہ اپنی موت تک تبلیغ اور رہنمائی کرتے رہے، تقریباً دو کتابوں کے مصنف تھے۔ 971 تا 1049 ہجری، 1564 تا 1639 عیسوی کے برابر۔"
  tr: "Osmanlı devletinin âlimlerinden vaiz Abdülmecid Şemseddin ibn Muharrem Ebu el-Leyth ibn Muhammed el-Siwasi, Sultan III. Muhammed tarafından Sivas'tan İstanbul'a çağrılmış ve vefatına kadar burada vaaz verip yol göstermiştir. Yaklaşık yirmi kitap ve mektubu bulunmaktadır; Hicri 971-1049 yılları, yani Miladi 1564-1639 yılları arasındadır."
  id: "Abdul Majid Shams al-Din ibn Muharram Abi al-Layth ibn Muhammad al-Siwasi, seorang pendakwah dari kalangan ulama negara Utsmani, dipanggil oleh Sultan Muhammad III dari Siwa ke Istanbul, tempat ia tinggal untuk berdakwah dan membimbing hingga wafat. Ia memiliki sekitar dua puluh buku dan surat; hidup pada tahun 971 hingga 1049 Hijriah, yang setara dengan tahun 1564 hingga 1639 Masehi."
