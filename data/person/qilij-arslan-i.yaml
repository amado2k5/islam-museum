label:
  ar: قليج أرسلان بن سليمان بن قطلمش
  en: Qilij Arslan I ibn Sulayman
  es: "Qilij Arslan I ibn Sulayman"
  fr: "Qilij Arslan I ibn Sulayman"
summary:
  ar: "قليج أرسلان بن سليمان بن قطلمش، سلطان سلاجقة الروم؛ ملك بعد أبيه قونية وأقصرا وسائر بلاد الروم، ولما زحف الإفرنج إلى سواحل الشام سنة 490هـ مروا ببلاده فنازعهم، ثم استولى على الموصل وديار بكر وأعمالها وجلس على التخت، ولما حاصر جاولي سكاوو الرحبة سار من الموصل لحربه فتفرق عنه قومه وحمل على جاولي بنفسه فصرع صاحب الراية ثم هزمه أصحاب جاولي فألقى نفسه في الخابور فغرق، وولي بلاد الروم ابنه مسعود."
  en: "Qilij Arslan ibn Sulayman ibn Qutulmush, Seljuk sultan of Rum; succeeding his father over Konya, Aqsaray and the Rum lands, he fought the Frankish hosts crossing his country toward the Levantine coast in 490 AH, then took Mosul, Diyar Bakr and their districts and sat on the throne — marching from Mosul against Jawali Saqawa's siege of al-Rahba, his host deserted him, he charged Jawali in person, was beaten back by Jawali's men and threw himself into the Khabur where he drowned; his son Mas'ud took the Rum lands."
  es: "Qilij Arslan ibn Sulayman ibn Qutulmush, sultán selyúcida de Rum; sucediendo a su padre en Konya, Aqsaray y las tierras de Rum, luchó contra los ejércitos francos que cruzaban su país hacia la costa levantina en el año 490 de la Hégira, luego tomó Mosul, Diyar Bakr y sus distritos y se sentó en el trono; marchando desde Mosul contra el asedio de al-Rahba por parte de Jawali Saqawa, su ejército lo abandonó, cargó contra Jawali en persona, fue derrotado por los hombres de Jawali y se arrojó al Khabur donde se ahogó; su hijo Mas'ud tomó las tierras de Rum."
  fr: "Qilij Arslan ibn Sulayman ibn Qutulmush, sultan seldjoukide de Rum, succéda à son père sur Konya, Aqsaray et les terres de Rum. En 490 AH, il combattit les armées franques traversant son pays vers la côte levantine, puis prit Mossoul, Diyar Bakr et leurs districts et s'assit sur le trône. Marchant de Mossoul contre le siège d'al-Rahba par Jawali Saqawa, il fut abandonné par ses troupes, chargea Jawali en personne, fut repoussé par les hommes de Jawali et se jeta dans le Khabur où il se noya. Son fils Mas'ud prit les terres de Rum."
