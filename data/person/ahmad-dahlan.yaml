  ar: "مصلح وعالم إندونيسي (1868–1923)، وُلد باسم محمد درويش في يوغياكارتا، حجّ ودرس في مكة سنوات، ثم أسس جمعية المحمدية سنة 1912 لتكون أداة إصلاح ديني وتعليمي، فغدت من أكبر المنظمات الإسلامية في إندونيسيا."
  en: "Indonesian reformer and religious leader (1868–1923), born as Muhammad Darwis in Yogyakarta. He performed the Hajj and studied in Mecca for years, then founded the Muhammadiyah in 1912 as an instrument of religious and educational reform; it became one of the largest Muslim organisations in Indonesia."
  ur: "انڈونیشیائی مصلح اور عالم (1868–1923)، اصل نام محمد درویش، یوگیاکارتا میں پیدا ہوئے۔ انہوں نے حج کیا اور برسوں مکہ میں تعلیم حاصل کی، پھر 1912 میں دینی و تعلیمی اصلاح کے لیے محمدیہ کی بنیاد رکھی، جو انڈونیشیا کی سب سے بڑی مسلم تنظیموں میں سے ایک بن گئی۔"
