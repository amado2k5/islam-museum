summary:
  ar: "أبو سعد عبد الرحمن بن محمد — واسمه مأمون — بن علي المتولي، الفقيه الشافعي النيسابوري؛ كان جامعاً بين العلم والدين وحسن السيرة وتحقيق المناظرة وله يد قوية في الأصول والفقه والخلاف؛ أخذ الفقه بمرو عن أبي القاسم الفوراني وببخارى عن أبي سهل الإبهواري؛ تولى التدريس بالمدرسة النظامية ببغداد بعد وفاة أبي إسحاق الشيرازي فعزل وأعيد واستمر عليها إلى وفاته؛ تخرج عليه جماعة من الأئمة؛ صنف في الفقه تتمة الإبانة فعاجلته المنية قبل إكماله {cite:wafayat-ayan}."
  en: "Abu Sa'd al-Mutawalli of Nishapur (426–478) — Shafi'i jurist who succeeded Abu Ishaq al-Shirazi at the Baghdad Nizamiyya; author of Tatimmat al-Ibana, unfinished at his death {cite:wafayat-ayan}."
