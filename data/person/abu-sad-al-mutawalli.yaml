summary:
  ar: "أبو سعد عبد الرحمن بن محمد — واسمه مأمون — بن علي المتولي، الفقيه الشافعي النيسابوري؛ كان جامعاً بين العلم والدين وحسن السيرة وتحقيق المناظرة وله يد قوية في الأصول والفقه والخلاف؛ أخذ الفقه بمرو عن أبي القاسم الفوراني وببخارى عن أبي سهل الإبهواري؛ تولى التدريس بالمدرسة النظامية ببغداد بعد وفاة أبي إسحاق الشيرازي فعزل وأعيد واستمر عليها إلى وفاته؛ تخرج عليه جماعة من الأئمة؛ صنف في الفقه تتمة الإبانة فعاجلته المنية قبل إكماله {cite:wafayat-ayan}."
  en: "Abu Sa'd al-Mutawalli of Nishapur (426–478) — Shafi'i jurist who succeeded Abu Ishaq al-Shirazi at the Baghdad Nizamiyya; author of Tatimmat al-Ibana, unfinished at his death {cite:wafayat-ayan}."
  fr: "Abu Sa'd al-Mutawalli de Nishapur (426–478) — juriste shafi'ite qui succéda à Abu Ishaq al-Shirazi à la Nizamiyya de Bagdad ; auteur de la Tatimmat al-Ibana, inachevée à sa mort {cite:wafayat-ayan}."
  es: "Abu Sa'd al-Mutawalli de Nishapur (426–478): jurista shafi'i que sucedió a Abu Ishaq al-Shirazi en Bagdad Nizamiyya; autor de Tatimmat al-Ibana, inacabado a su muerte {cita:wafayat-ayan}."
  ur: "ابو سعد المتولی آف نیشاپور (426-478) - شافعی فقیہ جو بغداد نظامیہ میں ابو اسحاق الشیرازی کے بعد آئے۔ تتمۃ الابانہ کے مصنف، اپنی موت پر نامکمل {حوالہ: وفایت-عیان}۔"
  tr: "Nişapurlu Şafiî fıkıhçısı Ebu Saad Abdülrahman ibn Muhammed - diğer adıyla Ma'mun - ibn Ali el-Mutavali; ilim, din, iyi ahlak ve tartışma yürütme yeteneğini bir araya getirmiş, ilkeler, fıkıh ve ihtilaflar konusunda güçlü bir kavrayışa sahip olmuştur; fıkıh eğitimini Merv'de Ebu el-Kasım el-Furani'den ve Buhara'da Ebu Sahl el-İbhaveri'den almıştır; Ebu İshak el-Şirazi'nin ölümünden sonra Bağdat'taki Nizamiye Okulu'nda öğretmenliği devralmış, daha sonra görevden alınmış ve tekrar göreve getirilmiş, ölümüne kadar burada görev yapmıştır; birçok imam onun yanında mezun olmuştur; fıkıh alanında el-İbana'ya bir ek yazmış, ancak tamamlayamadan vefat etmiştir."
  id: "Abu Saad Abd al-Rahman ibn Muhammad — yang bernama Ma’mun — ibn Ali al-Mutawalli, seorang ahli hukum mazhab Syafi'i dari Nishapur; beliau menggabungkan ilmu, agama, perilaku baik, dan kemampuan berdebat, serta memiliki pemahaman yang kuat tentang prinsip-prinsip, yurisprudensi, dan perselisihan; beliau mempelajari yurisprudensi di Marw di bawah bimbingan Abu al-Qasim al-Furani dan di Bukhara di bawah bimbingan Abu Sahl al-Ibhawari; beliau mengambil alih pengajaran di Sekolah Nizamiyya di Baghdad setelah kematian Abu Ishaq al-Shirazi, kemudian diberhentikan dan diangkat kembali, dan beliau terus mengajar di sana hingga wafatnya; sekelompok imam lulus di bawah bimbingannya; beliau menulis sebuah suplemen untuk kitab al-Ibana dalam bidang yurisprudensi, tetapi beliau meninggal sebelum menyelesaikannya."
