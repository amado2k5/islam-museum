  fr: "Abou Ya'qub al-Saffar, transmetteur d'Abd al-Wahhab et d'al-Waqidi, décrit comme un hafiz rigoureux et digne de confiance; son dernier élève fut Ibn Makhlid. Il mourut en 262 av. J.-C. (Muntazam Ibn al-Jawzi, p. 120)."
  ur: "ابو یعقوب الصفار، عبد الوہاب اور الواقدی سے ٹرانسمیٹر، ایک مستحسن، ثقہ حافظ کے طور پر بیان کیا گیا ہے۔ ان کے آخری شاگرد ابن مخلد تھے۔ ان کی وفات 262 میں ہوئی۔ 120}۔"
