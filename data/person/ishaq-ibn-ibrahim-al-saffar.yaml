  ar: "أبو يعقوب الصفار؛ روى عن عبد الوهاب والواقدي، وروى عنه ابن صاعد والباغندي وآخر من روى عنه ابن مخلد، وكان ثبتًا ثقة متقنًا حافظًا؛ توفي سنة اثنتين وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 120}."
