class: person
label: { ar: "عبد العزيز بن عبد الله بن عامر", en: "Abd al-Aziz ibn Abdallah ibn Amir", fr: "Abd al-Aziz ibn Abdallah ibn Amir", es: "Abd al-Aziz ibn Abdallah ibn Amir", ur: "عبد العزیز بن عبداللہ ابن عامر" }
summary:
  ar: "عبد العزيز بن عبد الله بن عامر؛ ولى سجستان من قبل القباع الحارث بن عبد الله بن أبي ربيعة المخزومي في أيام ابن الزبير فأدخلوه زرنج وحاربوا رتبيل فقتله أبو عفراء عمير المازني ثم أخذ جميع ما في بيت المال وانصرف بمشورة عبد الله بن ناشرة فجاء ابن ناشرة ودخل زرنج فأعاده وكيع بن أبي سود إلى المدينة وأخرج ابن ناشرة فقاتله فعثرت به فرسه فقتل."
  en: "Abd al-Aziz ibn Abdallah ibn Amir; governed Sijistan for the Zubayrid al-Quba' — al-Harith ibn Abdallah ibn Abi Rabi'a — entered Zaranj and warred on Rutbil till Abu Afra'a Umayr killed him; then emptied the treasury and left on Ibn Nashira's counsel, was restored by Waki' ibn Abi Sud, and expelled Ibn Nashira who fell by his stumbling horse."
  fr: "Abd al-Aziz ibn Abdallah ibn Amir ; il gouverna le Sijistan pour le zubayride al-Quba' — al-Harith ibn Abdallah ibn Abi Rabi'a —, entra à Zaranj et guerroya contre Rutbil jusqu'à ce qu'Abu Afra'a Umayr soit tué ; puis il vida le trésor et partit sur le conseil d'Ibn Nashira, fut rétabli par Waki' ibn Abi Sud, et chassa Ibn Nashira, qui périt par la chute de son cheval."
  es: "Abd al-Aziz ibn Abdallah ibn Amir; Gobernó Sijistan para el Zubayrid al-Quba' — al-Harith ibn Abdallah ibn Abi Rabi'a — entró en Zaranj y guerreó contra Rutbil hasta que Abu Afra'a Umayr lo mató; luego vació el tesoro y partió por consejo de Ibn Nashira, fue restaurado por Waki' ibn Abi Sud, y expulsó a Ibn Nashira, quien cayó por su caballo que tropezó."
  ur: "عبد العزیز ابن عبداللہ ابن عامر؛ زبیرد القبہ کے لیے سجستان پر حکومت کی - الحارث ابن عبداللہ ابن ابی ربیعہ - زرنج میں داخل ہوئے اور رتبیل پر جنگ کرتے رہے یہاں تک کہ ابو عفراء عمیر نے اسے قتل کر دیا۔ پھر خزانہ خالی کر دیا اور ابن نشیرہ کے مشورے پر چھوڑ دیا، وکیع ابن ابی سعود نے بحال کیا، اور ابن نشیرہ کو نکال دیا جو اس کے گھوڑے سے گرا تھا۔"
  tr: "Abdul Aziz bin Abdullah bin Amer; İbn Zübeyr zamanında Al-Kabba' Al-Harith bin Abdullah bin Abi Rabi'a Al-Makhzumi tarafından Sijistan valiliğine atanmıştı. Onu Zaranj'a getirdiler ve Ratbil ile savaştılar, bunun üzerine Ebu Afra' Umair Al-Mazini onu öldürdü. Sonra hazinedeki her şeyi alıp Abdullah bin Naşira'nın tavsiyesi üzerine oradan ayrıldı. Sonra İbn Naşira geldi ve Zaranj'a girdi, bunun üzerine Waki' bin Abi Sud onu Medine'ye geri getirdi ve İbn Naşira'yı dışarı çıkardı, onunla savaştılar ve atı tökezledi ve öldürüldü."
  id: "Abdul Aziz bin Abdullah bin Amer; ia diangkat menjadi gubernur Sijistan oleh Al-Qabba’ Al-Harith bin Abdullah bin Abi Rabi’a Al-Makhzumi pada masa Ibn Al-Zubayr. Mereka membawanya ke Zaranj dan berperang melawan Ratbil, sehingga Abu Afra’ Umair Al-Mazini membunuhnya. Kemudian ia mengambil semua harta benda di perbendaharaan dan pergi atas saran Abdullah bin Nashira. Kemudian Ibn Nashira datang dan memasuki Zaranj, sehingga Waki’ bin Abi Sud membawanya kembali ke Madinah dan membawa Ibn Nashira keluar, lalu ia berperang melawannya, dan kudanya tersandung dan ia terbunuh."
