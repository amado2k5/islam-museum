summary:
  ar: "عبد العزيز بن عبد الله بن عامر؛ ولى سجستان من قبل القباع الحارث بن عبد الله بن أبي ربيعة المخزومي في أيام ابن الزبير فأدخلوه زرنج وحاربوا رتبيل فقتله أبو عفراء عمير المازني ثم أخذ جميع ما في بيت المال وانصرف بمشورة عبد الله بن ناشرة فجاء ابن ناشرة ودخل زرنج فأعاده وكيع بن أبي سود إلى المدينة وأخرج ابن ناشرة فقاتله فعثرت به فرسه فقتل."
  en: "Abd al-Aziz ibn Abdallah ibn Amir; governed Sijistan for the Zubayrid al-Quba' — al-Harith ibn Abdallah ibn Abi Rabi'a — entered Zaranj and warred on Rutbil till Abu Afra'a Umayr killed him; then emptied the treasury and left on Ibn Nashira's counsel, was restored by Waki' ibn Abi Sud, and expelled Ibn Nashira who fell by his stumbling horse."
