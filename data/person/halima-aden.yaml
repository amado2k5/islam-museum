summary:
  ar: عارضة أزياء صومالية أمريكية وُلدت سنة 1997 في مخيم كاكوما للاجئين؛ أول متسابقة تلبس الحجاب والبوركيني في مسابقة ملكة جمال أمريكية، وأول عارضة محجبة على أغلفة كبرى، ثم تركت عروض الأزياء سنة 2020 التزامًا
    بقيمها الدينية.
  en: Somali-American model born in 1997 in the Kakuma refugee camp; the first contestant to wear hijab and burkini in a US pageant and the first hijabi cover model on major magazines, she left runway modelling
    in 2020 over religious conviction.
  ur: صومالی امریکی ماڈل جو 1997 میں کاکوما مہاجر کیمپ میں پیدا ہوئی؛ امریکی مقابلہ میں حجاب اور برکینی پہننے والی پہلی متسابقہ اور بڑی میگزینوں پر پہلی محجبہ ماڈل، اس نے 2020 میں مذہبی اقدار کی خاطر رن
    وے چھوڑا۔
  es: "Modelo somalí-estadounidense nacida en 1997 en el campo de refugiados de Kakuma; la primera concursante en usar hiyab y burkini en un certamen de belleza estadounidense y la primera modelo con hiyab en aparecer en la portada de importantes revistas, dejó el modelaje de pasarela en 2020 por convicciones religiosas."
  fr: "Mannequin somalo-américaine née en 1997 dans le camp de réfugiés de Kakuma; première candidate à porter le hijab et le burkini dans un concours de beauté américain et première mannequin voilée à faire la couverture de grands magazines, elle a quitté le mannequinat en 2020 par conviction religieuse."
  tr: "1997'de Kakuma mülteci kampında doğan Somali-Amerikalı bir model; Miss America yarışmasında başörtüsü ve burkini giyen ilk yarışmacı, büyük kapaklarda başörtüsü takan ilk model ve dini değerlerine bağlılıkla 2020'de moda gösterilerinden ayrılan kişi."
  id: "Model Somalia-Amerika yang lahir pada tahun 1997 di kamp pengungsi Kakuma; kontestan pertama yang mengenakan hijab dan burkini dalam kontes Miss America, dan model pertama yang mengenakan hijab di sampul besar, kemudian meninggalkan pertunjukan busana pada 2020 karena komitmen pada nilai-nilai agamanya."
