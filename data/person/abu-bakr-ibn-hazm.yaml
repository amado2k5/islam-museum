id: person/abu-bakr-ibn-hazm
class: person
label: { ar: "أبو بكر بن حزم", en: "Abu Bakr ibn Hazm", fr: "Abu Bakr ibn Hazm", es: "Abu Bakr ibn Hazm", ur: "ابوبکر بن حزم" }
gender: male
summary:
  ar: "والي المدينة في عهد عمر بن عبد العزيز؛ كتب إليه الخليفة، ومعه ولاة الأقاليم، يطلب جمع أحاديث النبي وتدوينها خوفاً من ضياع العلم بموت حامليه، وذلك في خلافة عمر ⁦(99–101هـ)⁩ حسب الكتاب {cite:umayyad-birth-to-fall-2006 p. 169}{cite:umayyad-birth-to-fall-2006 p. 172}. ويذكر الكتاب أن عمر بن عبد العزيز كتب إليه، وهو والي المدينة، أن يجمع ما كان من حديث رسول الله وسنة ماضية وحديث عمرة بنت عبد الرحمن، فيكتبه لخوف دروس العلم وذهاب أهله، وأن ينسخوا له كتاب النبي في الصدقات. {cite:salabi-umayyad-state-2020 p.297-301} ويذكر الكتاب أنه كان أمير المدينة ثم قاضيها، وأن رزقه كان ثلاثمائة دينار في الشهر، وأنه كان أعلم أهل زمانه بالقضاء. {cite:salabi-umayyad-state-2020 p.387-388}"
  en: "Governor of Medina in the time of Umar ibn Abd al-Aziz. The caliph wrote to him, together with the governors of the provinces, asking that the Messenger of God's hadith be gathered and written down, for fear that knowledge would be lost with the death of those who carried it; this was in the caliphate of Umar (99-101 AH), according to the book {cite:umayyad-birth-to-fall-2006 p. 169}{cite:umayyad-birth-to-fall-2006 p. 172}. The book says that Umar ibn Abd al-Aziz wrote to him, while he was governor of Medina, to gather whatever existed of the Messenger's hadith, the established sunna, and the hadith of Amra bint Abd al-Rahman, and to write it down for fear that knowledge would decay and its people would pass away; and that they should copy out for him the Prophet's writing on alms. {cite:salabi-umayyad-state-2020 p.297-301} The book also states that he was governor of Medina and then its judge, that his stipend was three hundred dinars a month, and that he was the most knowledgeable man of his age in judgeship {cite:salabi-umayyad-state-2020 p.387-388}"
  fr: "Gouverneur de Médine au temps d'Umar ibn Abd al-Aziz. Le calife lui écrivit, ainsi qu'aux gouverneurs des provinces, pour demander que les hadiths du Messager de Dieu soient rassemblés et mis par écrit, de crainte que le savoir ne disparaisse avec la mort de ceux qui le portaient ; ce fut sous le califat d'Umar (99-101 H), selon le livre {cite:umayyad-birth-to-fall-2006 p. 169}{cite:umayyad-birth-to-fall-2006 p. 172}. Le livre dit qu'Umar ibn Abd al-Aziz lui écrivit, alors qu'il était gouverneur de Médine, de rassembler ce qui existait des hadiths du Messager, de la sunna établie et des hadiths d'Amra bint Abd al-Rahman, et de les écrire de crainte que le savoir ne se perde et que ses gens ne disparaissent ; et qu'on lui recopie l'écrit du Prophète sur l'aumône. {cite:salabi-umayyad-state-2020 p.297-301} Le livre indique aussi qu'il fut gouverneur de Médine puis son cadi, que son traitement était de trois cents dinars par mois, et qu'il était l'homme le plus savant de son temps en matière de judicature {cite:salabi-umayyad-state-2020 p.387-388}"
  es: "Gobernador de Medina en tiempos de Umar ibn Abd al-Aziz. El califa le escribió, junto con los gobernadores de las provincias, pidiéndoles que recopilaran y escribieran los hadices del Mensajero de Dios, por temor a que el conocimiento se perdiera con la muerte de quienes lo transmitían; esto ocurrió durante el califato de Umar (99-101 AH), según el libro {cite:umayyad-birth-to-fall-2006 p. 169}{cite:umayyad-birth-to-fall-2006 p. 172}. El libro dice que Umar ibn Abd al-Aziz le escribió, mientras era gobernador de Medina, para que recopilara todo lo que existiera de los hadices del Mensajero, la sunna establecida y los hadices de Amra bint Abd al-Rahman, y los escribiera por temor a que el conocimiento se perdiera y su gente desapareciera; y que le copiaran los escritos del Profeta sobre la limosna. {cite:salabi-umayyad-state-2020 p.297-301} El libro también afirma que fue gobernador de Medina y luego su juez, que su estipendio era de trescientos dinares al mes y que era el hombre más sabio de su época en materia judicial. {cite:salabi-umayyad-state-2020 p.387-388}"
  ur: "عمر بن عبدالعزیز کے دور میں مدینہ کے گورنر۔ خلیفہ نے صوبوں کے گورنروں کے ساتھ مل کر اسے خط لکھا اور کہا کہ رسول اللہ کی حدیث کو جمع کر کے لکھ لیا جائے، اس خوف سے کہ اسے لے جانے والوں کی موت کے ساتھ علم ختم ہو جائے گا۔ یہ عمر ⁦(99-101 ہجری)⁩ کی خلافت میں تھا، کتاب کے مطابق {حوالہ: امیہ-پیدائش سے زوال-2006 صفحہ۔ 169}{حوالہ:امیاد-پیدائش سے زوال-2006 صفحہ۔ 172}۔ کتاب میں کہا گیا ہے کہ عمر بن عبدالعزیز نے جب وہ مدینہ کے گورنر تھے، انہیں لکھا کہ رسول اللہ کی حدیث، ثابت سنت اور عمرہ بنت عبدالرحمٰن کی حدیث میں سے جو کچھ موجود ہے اسے اکٹھا کریں اور اس خوف سے لکھیں کہ علم ختم ہو جائے گا اور اس کے لوگ ختم ہو جائیں گے۔ اور یہ کہ وہ اس کے لیے بھیک پر نبی کی تحریر نقل کریں۔ کتاب میں یہ بھی بتایا گیا ہے کہ وہ مدینہ کے گورنر اور پھر اس کے قاضی تھے، ان کا وظیفہ تین سو دینار ماہانہ تھا، اور یہ کہ وہ قاضی کے عہدہ پر اپنی عمر کے سب سے زیادہ علم والے آدمی تھے۔"
  tr: "Ömer ibn Abdülaziz döneminde Medine valisine, halife tarafından, hadislerin (Hz. Muhammed'in sözleri ve fiilleri) rivayetçilerinin vefatıyla kaybolma korkusuyla, Peygamber'in hadislerini toplayıp kaydetmesi talimatı verilmiştir. Bu olay, Ömer'in halifeliği döneminde (99-101 Hicri) gerçekleşmiştir. Kitapta, Ömer ibn Abdülaziz'in, Medine valisi iken ona, Allah Resulü'nün hadislerini, yerleşik sünneti ve Umre bint Abdülrahman'ın hadislerini toplayıp, bilginin ve alimlerinin vefatıyla kaybolma korkusuyla yazmasını emrettiği belirtilmektedir. Ayrıca onlara Peygamberin zekât (sadaka) hakkındaki kitabını kopyalamalarını emretti. {cite:salabi-umayyad-state-2020 s. 297–301}. Kitap ayrıca onun Medine valisi ve daha sonra kadısı olduğunu, aylık maaşının üç yüz dinar olduğunu ve fıkıh konularında zamanının en bilgili kişisi olduğunu belirtmektedir. {cite:salabi-umayyad-state-2020 s.387-388}"
  id: "Gubernur Madinah pada masa pemerintahan Umar ibn Abd al-Aziz diperintahkan oleh Khalifah, bersama dengan para gubernur provinsi, untuk mengumpulkan dan mencatat hadits-hadits Nabi (ucapan dan perbuatan Nabi Muhammad) karena khawatir akan hilangnya ilmu pengetahuan seiring dengan wafatnya para perawinya. Hal ini terjadi pada masa kekhalifahan Umar (99–101 H), menurut kitab {cite:umayyad-birth-to-fall-2006 hlm. 169}{cite:umayyad-birth-to-fall-2006 hlm. 172}. Kitab tersebut menyatakan bahwa Umar ibn Abd al-Aziz menulis surat kepadanya, ketika ia menjabat sebagai gubernur Madinah, untuk mengumpulkan hadits-hadits Rasulullah, Sunnah yang telah ditetapkan, dan hadits Umrah binti Abd al-Rahman, dan untuk menuliskannya karena khawatir akan hilangnya ilmu pengetahuan dan wafatnya para ulama. Ia juga memerintahkan mereka untuk menyalin kitab Nabi tentang zakat (sedekah). {cite:salabi-umayyad-state-2020 hlm. 297–301}. Kitab tersebut selanjutnya menyatakan bahwa ia adalah gubernur Madinah dan kemudian menjadi hakimnya, bahwa gajinya tiga ratus dinar sebulan, dan bahwa ia adalah orang yang paling berpengetahuan pada zamannya dalam hal-hal fiqih. {cite:salabi-umayyad-state-2020 hlm. 387-388}"
