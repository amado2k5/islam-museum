id: person/abu-bakr-ibn-hazm
class: person
label: { ar: "أبو بكر بن حزم", en: "Abu Bakr ibn Hazm" }
gender: male
summary:
  ar: "والي المدينة في عهد عمر بن عبد العزيز؛ كتب إليه الخليفة، ومعه ولاة الأقاليم، يطلب جمع أحاديث النبي وتدوينها خوفاً من ضياع العلم بموت حامليه، وذلك في خلافة عمر (99–101هـ) حسب الكتاب {cite:umayyad-birth-to-fall-2006 p. 169}{cite:umayyad-birth-to-fall-2006 p. 172}. ويذكر الكتاب أن عمر بن عبد العزيز كتب إليه، وهو والي المدينة، أن يجمع ما كان من حديث رسول الله وسنة ماضية وحديث عمرة بنت عبد الرحمن، فيكتبه لخوف دروس العلم وذهاب أهله، وأن ينسخوا له كتاب النبي في الصدقات. {cite:salabi-umayyad-state-2020 p.297-301} ويذكر الكتاب أنه كان أمير المدينة ثم قاضيها، وأن رزقه كان ثلاثمائة دينار في الشهر، وأنه كان أعلم أهل زمانه بالقضاء. {cite:salabi-umayyad-state-2020 p.387-388}"
  en: "Governor of Medina in the time of Umar ibn Abd al-Aziz. The caliph wrote to him, together with the governors of the provinces, asking that the Messenger of God's hadith be gathered and written down, for fear that knowledge would be lost with the death of those who carried it; this was in the caliphate of Umar (99-101 AH), according to the book {cite:umayyad-birth-to-fall-2006 p. 169}{cite:umayyad-birth-to-fall-2006 p. 172}. The book says that Umar ibn Abd al-Aziz wrote to him, while he was governor of Medina, to gather whatever existed of the Messenger's hadith, the established sunna, and the hadith of Amra bint Abd al-Rahman, and to write it down for fear that knowledge would decay and its people would pass away; and that they should copy out for him the Prophet's writing on alms. {cite:salabi-umayyad-state-2020 p.297-301} The book also states that he was governor of Medina and then its judge, that his stipend was three hundred dinars a month, and that he was the most knowledgeable man of his age in judgeship {cite:salabi-umayyad-state-2020 p.387-388}"
