id: person/salih-ibn-mirdas
class: person
label: { ar: "صالح بن مرداس أسد الدولة الكلابي" }
summary:
  ar: "صالح بن مرداس أسد الدولة الكلابي، من أمراء عرب البادية؛ قصد مدينة حلب وبها مرتضى الدولة بن الجراح غلام أبي الفضائل بن نصر بن سيف الدولة نيابة عن الظاهر بن الحاكم العبيدي صاحب مصر فاستولى عليها وانتزعها منه، وكان ذا بأس وعزيمة وأهل غيرة وشوكة، وكان تملّكه لها في ثالث عشر ذي الحجة سنة سبع عشرة وأربعمائة؛ فجهّز إليه الظاهر أميرَ الجيوش أنوشكين الدزبري فتلاقيا على الأقحوانة من أعمال فلسطين فجرت بينهما مقتلة انجلت عن قتل صالح في جمادى الأولى سنة عشرين وأربعمائة، وهو أول ملوك بني مرداس المتملّكين بحلب {cite:shadharat-dhahab p. 214-215}."
  en: "Salih b. Mirdas, Asad al-Dawla al-Kilabi — a desert-Arab amir who seized Aleppo from al-Murtada b. al-Jarrah, the Fatimid deputy, on 13 Dhu al-Hijja 417 and ordered its affairs; al-Zahir sent his commander-in-chief Anushtakin al-Dizbiri, they met at al-Uqhuwana near Tiberias, and the battle ended with Salih dead in Jumada I 420 — the first of the Banu Mirdas kings of Aleppo {cite:shadharat-dhahab p. 214-215}."
