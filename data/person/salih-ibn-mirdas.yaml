id: person/salih-ibn-mirdas
class: person
label:
  ar: صالح بن مرداس الكلابي
  en: Salih ibn Mirdas al-Kilabi
summary:
  ar: "صالح بن مرداس أمير بني كلاب ومؤسس دولتهم بحلب؛ ابتدأ أمره بملك الرحبة بعد أن قتل ابن مجلكان صاحبها واستولى على أمواله وأقام دعوة العلويين بمصر، ثم سار إلى حلب فملكها من يد ابن شعبان الكتامي وحصره في القلعة حتى استأمنه سنة 424هـ واتسع ملكه من بعلبك إلى عنه، وقُتل سنة 429هـ في واقعة طبرية مع أنوشتكين أمير عساكر الظاهر من مصر ونجا ابنه نصر شبل الدولة."
  en: "Salih ibn Mirdas, amir of Banu Kilab and founder of their Aleppo state; he began by taking al-Rahba after killing its lord Ibn Majlakan and proclaiming the Alid da'wa of Egypt, then seized Aleppo from Ibn Sha'ban al-Katami, besieging him in the citadel until he surrendered it in 424 AH, his realm stretching from Baalbek to Ana — he was killed in 429 AH at the Tiberias encounter with Anushtakin, commander of al-Zahir's Egyptian army, while his son Nasr Shibl al-Dawla escaped."
