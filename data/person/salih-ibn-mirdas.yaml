id: person/salih-ibn-mirdas
class: person
label: { ar: "صالح بن مرداس أسد الدولة الكلابي" }
summary:
  ar: "صالح بن مرداس أسد الدولة الكلابي، من أمراء عرب البادية؛ قصد مدينة حلب وبها مرتضى الدولة بن الجراح غلام أبي الفضائل بن نصر بن سيف الدولة نيابة عن الظاهر بن الحاكم العبيدي صاحب مصر فاستولى عليها وانتزعها منه، وكان ذا بأس وعزيمة وأهل غيرة وشوكة، وكان تملّكه لها في ثالث عشر ذي الحجة سنة سبع عشرة وأربعمائة؛ فجهّز إليه الظاهر أميرَ الجيوش أنوشكين الدزبري فتلاقيا على الأقحوانة من أعمال فلسطين فجرت بينهما مقتلة انجلت عن قتل صالح في جمادى الأولى سنة عشرين وأربعمائة، وهو أول ملوك بني مرداس المتملّكين بحلب {cite:shadharat-dhahab p. 214-215}. ويذكر ابن الجوزي قتله وابنه على يد عساكر مصر عند الأردن في أحداث سنة ٤٢٠ {cite:muntazam-ibn-al-jawzi j.8 p.388}."
  en: "Salih b. Mirdas, Asad al-Dawla al-Kilabi — a desert-Arab amir who seized Aleppo from al-Murtada b. al-Jarrah, the Fatimid deputy, on 13 Dhu al-Hijja 417 and ordered its affairs; al-Zahir sent his commander-in-chief Anushtakin al-Dizbiri, they met at al-Uqhuwana near Tiberias, and the battle ended with Salih dead in Jumada I 420 — the first of the Banu Mirdas kings of Aleppo {cite:shadharat-dhahab p. 214-215}."
  es: "Salih b. Mirdas, Asad al-Dawla al-Kilabi — un emir árabe del desierto que tomó Alepo de al-Murtada b. al-Jarrah, el lugarteniente fatimí, el 13 de Dhu al-Hijja 417 y ordenó sus asuntos; al-Zahir envió a su comandante en jefe Anushtakin al-Dizbiri, se encontraron en al-Uqhuwana cerca de Tiberíades, y la batalla terminó con la muerte de Salih en Jumada I 420 — el primero de los reyes Banu Mirdas de Alepo {cite:shadharat-dhahab p. 214-215}."
  fr: "Salih b. Mirdas, Asad al-Dawla al-Kilabi — un émir arabe du désert qui s'empara d'Alep, alors détenu par al-Murtada b. al-Jarrah, le vice-roi fatimide, le 13 Dhu al-Hijja 417, et en prit le contrôle; al-Zahir envoya son commandant en chef Anushtakin al-Dizbiri; ils se rencontrèrent à al-Uqhuwana, près de Tibériade, et la bataille se termina par la mort de Salih en Jumada I 420 — le premier des rois Banu Mirdas d'Alep {cite: shadharat-dhahab p. 214-215}."
  ur: "صالح ب۔ میرداس، اسد الدولہ الکلبی - ایک صحرائی عرب امیر جس نے المرتضیٰ سے حلب پر قبضہ کیا۔ فاطمی نائب الجراح نے 13 ذی الحجہ 417 کو اس کے امور کا حکم دیا۔ الظاہر نے اپنے سپہ سالار انوشتاکین الدزبیری کو بھیجا، ان کی ملاقات تبریاس کے قریب العقوانہ میں ہوئی، اور جنگ کا خاتمہ صالح کی موت کے ساتھ جمعہ اول 420 میں ہوا جو حلب کے بنو مرداس بادشاہوں میں سے پہلا تھا۔ 214-215}۔"
  tr: "Kilabi kabilesinin aslanı Salih ibn Mirdas, Bedevi Araplarının prenslerinden biriydi; Halep şehrine gitti; burada Mısır hükümdarı el-Zahir ibn Nasr ibn Saif al-Dawla'nın hizmetkârı Murtada ibn al-Jarrah, Mısır hükümdarı el-Zahir bin el-Hakim el-Ubeydi'yi temsil ederek şehri ele geçirip ondan aldı. O, güçlü, kararlı ve gayretli bir adamdı ve güçlüydü. Onu on yüz on yedi yılın Zulhice'nin on üçüncüsünde ele geçirdi. Ordu komutanı Anuşkin el-Dazbari onun için hazırlık yaptı. Filistin Krizanteminde buluştular ve aralarında bir katliam gerçekleşti; dört yüz yirmi yedinci yılda Cumada-Avval'da Saleh'i bağışladı. O, Banu Mirdas'ın Halep'e sahip olan ilk kralı oldu {alıntı:Shadharat-Dhahab, s. 214-215}. İbn el-Cavazi, 420 yılındaki olaylar sırasında Mısır askerleri tarafından kendisi ve oğlunun Ürdün yakınlarında öldürüldüğünden bahseder {cite:muntazam-ibn-al-jawzi j.8 s.388}."
  id: "Saleh ibn Mirdas, singa suku Kilabi, adalah salah satu pangeran Arab Badui; ia pergi ke kota Aleppo, di mana Murtada ibn al-Jarrah, pelayan Abu al-Fadail ibn Nasr ibn Saif al-Dawla, mewakili al-Zahir ibn al-Hakim al-Ubaydi, penguasa Mesir, merebutnya dan merebutnya darinya. Ia adalah pria yang kuat, penuh tekad, dan bersemangat serta kuat. Ia mengambil alih kota itu pada tanggal tiga belas Dhu al-Hijjah tahun empat ratus tujuh belas. Al-Zahir, komandan pasukan, Anushkin al-Dazbari, mempersiapkan untuknya. Mereka bertemu di Krisan Palestina, dan terjadi pembunuhan di antara mereka, menyelamatkan Saleh di Jumada al-Awwal pada tahun empat ratus dua puluh tujuh. Ia adalah raja pertama Banu Mirdas yang memiliki Aleppo {cite::Shadharat-Dhahab, hlm. 214-215}. Ibn al-Jawzi menyebutkan pembunuhan dirinya dan putranya oleh tentara Mesir di dekat Yordania selama peristiwa tahun 420 {cite:muntazam-ibn-al-jawzi j.8 hlm.388}."
