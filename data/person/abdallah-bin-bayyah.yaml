born: { edtf: "1935", hijri: "1354", calendar: gregorian, precision: year, status: historical, derived: true, note: "Born in Timbedra ⁦(تمبدغة)⁩, Hodh Ech Chargui, Mauritania; the year 1935 is given by all three articles and by Wikidata. No Hijri year is stated in the articles, so 1354 is a derived conversion (the Arabic article's categories likewise file him under births of 1354 AH); the museum holds no place entity for Timbedra, so the birthplace is carried here and in the prose.", sources: [source/wikipedia-abdallah-bin-bayyah-en, source/wikipedia-abdallah-bin-bayyah-ar, source/wikidata-abdallah-bin-bayyah] }
summary:
  ar: "فقيه موريتاني ⁦(ولد عام 1935 في تمبدغة)⁩، وزير سابق للتعليم والعدل ونائب أول رئيس للجمهورية الموريتانية، يرأس اليوم مجلس الإمارات للإفتاء الشرعي ومنتدى تعزيز السلم في المجتمعات المسلمة ويدرّس في جامعة الملك عبد العزيز بجدة."
  en: "Mauritanian jurist (born 1935 in Timbedra), a former minister of education and of justice and vice-president of Mauritania, who now chairs the UAE Council for Fatwa, presides over the Forum for Promoting Peace in Muslim Societies, and teaches at King Abdulaziz University in Jeddah."
  fr: "Juriste mauritanien (né en 1935 à Timbedra), ancien ministre de l'Éducation et de la Justice et vice-président de la Mauritanie, qui préside aujourd'hui le Conseil de la fatwa des Émirats arabes unis et le Forum pour la promotion de la paix dans les sociétés musulmanes, et enseigne à l'université du roi Abdulaziz à Djeddah."
  es: "Jurista mauritano (nacido en 1935 en Timbedra), exministro de educación y justicia y vicepresidente de Mauritania, que actualmente preside el Consejo de Fatwas de los EAU, dirige el Foro para la Promoción de la Paz en las Sociedades Musulmanas y enseña en la Universidad Rey Abdulaziz de Yeda."
  ur: "موریطانیہ کے فقیہ ⁦(پیدائش 1935 ٹمبیدرا میں)⁩، سابق وزیر تعلیم و انصاف اور موریطانیہ کے نائب صدر، جو اب یو اے ای کونسل برائے فتویٰ کے سربراہ ہیں، مسلم معاشروں میں امن کے فروغ کے لیے فورم کے صدر ہیں، اور جدہ کی کنگ عبدالعزیز یونیورسٹی میں پڑھاتے ہیں۔"
  tr: "1935'te Timbédra'da doğan Moritanyalı bir hukukçu, eski Eğitim ve Adalet Bakanı ve Moritanya Cumhuriyeti Birinci Başkan Yardımcısı olan bu kişi, şu anda Birleşik Arap Emirlikleri Şeriat Fetvaları Konseyi ve Müslüman Toplumlarda Barışı Geliştirme Forumu'nun başkanlığını yürütmekte ve Cidde'deki Kral Abdulaziz Üniversitesi'nde öğretim üyesi olarak görev yapmaktadır."
  id: "Seorang ahli hukum Mauritania (lahir tahun 1935 di Timbédra), mantan Menteri Pendidikan dan Kehakiman serta Wakil Presiden Pertama Republik Mauritania, saat ini ia memimpin Dewan Emirat untuk Fatwa Syariah dan Forum untuk Mempromosikan Perdamaian di Masyarakat Muslim serta mengajar di Universitas Raja Abdulaziz di Jeddah."
