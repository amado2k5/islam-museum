  - { value: sunni-maliki, basis: documented, note: "Two article infoboxes name his school personally and agree. The English infobox gives denomination Sunni, creed Ash'ari and jurisprudence Maliki, referenced to the Princeton Encyclopedia of Islamic Political Thought (p. 347); the Arabic infobox independently gives Ahl al-Sunna wal-Jama'a and the Maliki madhhab. The Urdu lead's 'Maliki jurist' derives from the Arabic article family and is not counted as a third attestation, and the English text's description of him as a specialist in all four traditional Sunni schools with an emphasis on the Maliki Madhhab is expertise wording, not the attestation relied on. Both infoboxes also give the Ash'ari creed, for which the faith enum has no compound value, so it is recorded in this note only. His promotion of Sufism, reported by the English article, is advocacy rather than attested membership, so no sufi segment is recorded.", sources: [source/wikipedia-abdallah-bin-bayyah-en, source/wikipedia-abdallah-bin-bayyah-ar] }
