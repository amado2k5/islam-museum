summary:
  ar: "فقيه موريتاني (ولد عام 1935 في تمبدغة)، وزير سابق للتعليم والعدل ونائب أول رئيس للجمهورية الموريتانية، يرأس اليوم مجلس الإمارات للإفتاء الشرعي ومنتدى تعزيز السلم في المجتمعات المسلمة ويدرّس في جامعة الملك عبد العزيز بجدة."
  en: "Mauritanian jurist (born 1935 in Timbedra), a former minister of education and of justice and vice-president of Mauritania, who now chairs the UAE Council for Fatwa, presides over the Forum for Promoting Peace in Muslim Societies, and teaches at King Abdulaziz University in Jeddah."
