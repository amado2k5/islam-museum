id: person/abu-jafar-muhammad-ibn-ubaydallah-al-abbasi
class: person
label:
  ar: أبو جعفر محمد بن عبيد الله العباسي
  en: Abu Jafar Muhammad ibn Ubaydallah al-Abbasi
  ur: ابو جعفر محمد بن عبید اللہ عباسی
summary:
  ar: والد علي بن محمد راوي «سيرة الهادي إلى الحق»، من أوائل من قبلوا دعوة الهادي قبل خروجه إلى اليمن ورافقوه إليها، وتصفه صفحة الافتتاح بالعالم الحبر وبأنه قُتل بنجران.
  en: Father of Ali ibn Muhammad, the narrator of Sirat al-Hadi ila al-Haqq; among the first to accept al-Hadi's call before he left for Yemen, he went there with him, and the opening page calls him a great scholar and says he died a martyr at Najran.
  ur: «سیرت الہادی الی الحق» کے راوی علی بن محمد کے والد؛ ہادی کے یمن جانے سے پہلے ان کی دعوت قبول کرنے والے اولین لوگوں میں سے، ان کے ساتھ یمن گئے؛ آغاز کا صفحہ انہیں عالم حبر کہتا ہے اور نجران میں شہید۔
