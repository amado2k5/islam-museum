id: person/abu-jafar-muhammad-ibn-ubaydallah-al-abbasi
class: person
label:
  ar: أبو جعفر محمد بن عبيد الله العباسي
  en: Abu Jafar Muhammad ibn Ubaydallah al-Abbasi
  ur: ابو جعفر محمد بن عبید اللہ عباسی
  fr: "Abu Jafar Muhammad ibn Ubaydallah al-Abbasi"
  es: "Abu Jafar Muhammad ibn Ubaydallah al-Abbasi"
summary:
  ar: والد علي بن محمد راوي «سيرة الهادي إلى الحق»، من أوائل من قبلوا دعوة الهادي قبل خروجه إلى اليمن ورافقوه إليها، وتصفه صفحة الافتتاح بالعالم الحبر وبأنه قُتل بنجران.
  en: Father of Ali ibn Muhammad, the narrator of Sirat al-Hadi ila al-Haqq; among the first to accept al-Hadi's call before he left for Yemen, he went there with him, and the opening page calls him a great scholar and says he died a martyr at Najran.
  ur: «سیرت الہادی الی الحق» کے راوی علی بن محمد کے والد؛ ہادی کے یمن جانے سے پہلے ان کی دعوت قبول کرنے والے اولین لوگوں میں سے، ان کے ساتھ یمن گئے؛ آغاز کا صفحہ انہیں عالم حبر کہتا ہے اور نجران میں شہید۔
  fr: "Père d'Ali ibn Muhammad, le narrateur de la Sirat al-Hadi ila al-Haqq ; parmi les premiers à accepter l'appel d'al-Hadi avant son départ pour le Yémen, il s'y rendit avec lui, et la page d'ouverture le dit grand savant et rapporte qu'il mourut en martyr à Najran."
  es: "Padre de Ali ibn Muhammad, el narrador de Sirat al-Hadi ila al-Haqq; fue uno de los primeros en aceptar el llamado de al-Hadi antes de que partiera hacia Yemen, fue allí con él, y la página inicial lo llama un gran erudito y dice que murió como mártir en Najran."
  tr: "Ali bin Muhammed'in babası, \"El-Hadi ila El-Hak'ın Biyografisi\"nin anlatıcısı, El-Hadi'nin Yemen'e gitmeden önce yaptığı daveti kabul eden ilk kişiler arasındaydı ve ona orada eşlik etti. Giriş sayfasında kendisi bilgili bir alim olarak tanımlanır ve Necran'da öldürüldüğü belirtilir."
  id: "Ayah Ali bin Muhammad, narator \"Biografi Al-Hadi ila Al-Haq,\" adalah salah satu orang pertama yang menerima undangan Al-Hadi sebelum beliau pergi ke Yaman dan menemaninya ke sana. Halaman pembuka menggambarkannya sebagai seorang ulama yang berilmu dan menyatakan bahwa beliau terbunuh di Najran."
