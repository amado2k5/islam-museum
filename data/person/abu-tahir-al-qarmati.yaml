label: { ar: "أبو طاهر سليمان القرمطي", en: "Abu Tahir Sulayman al-Qarmati", fr: "Abu Tahir Sulayman al-Qarmati" , ur: "ابو طاہر سلیمان قرمطی", es: "Abu Tahir Sulayman al-Qarmati"}
summary:
  ar: "ابن أبي سعيد القرمطي، هاجم ركب الحاج في المسجد الحرام يوم التروية سنة سبع عشرة فقتل الحجيج وطرح القتلى في زمزم وكسر الحجر الأسود بالدبوس واقتلعه وبقي عندهم أكثر من عشرين سنة حتى أعيد في خلافة المطيع، وصعد على باب الكعبة وهو يقول أنا بالله وبالله أنا يخلق الخلق وأفنيهم أنا فلم يفلح بعدها وتقطع جسده بالجدري {cite:tarikh-khulafa-minhaj-1434 p. 592-593}. وعند ابن الأثير دخل الكوفة سنة 312هـ بعد أن طلب البصرة والأهواز فلم يُجب فهزم جعفر بن ورقاء وأقام بظاهر الكوفة ستة أيام، وهزم يوسف بن أبي الساج سنة 315هـ وأسره وقت المغرب بعد أن احتقر قلتهم وكتب كتاب الفتح قبل اللقاء، ثم عبر إلى الأنبار من الحديثة في سفن واستولى عليها وعقد جسرها {cite:kamil-ibn-al-athir p. 115-126}، وعند ابن الأثير وافى الحجاج بمكة يوم التروية سنة 317هـ فنهبهم وقتلهم حتى في البيت نفسه وقلع الحجر الأسود وباب الكعبة وطرح القتلى في زمزم فلما أنكر عليه المهدي عبيد الله بإفريقية وبرئ منه أعاد الحجر {cite:kamil-ibn-al-athir p. 154-155}، وعند ابن الجوزي وفي ربيع الآخر سنة 311هـ دخل البصرة سحراً في ألف وسبعمائة رجل بنصب سلالم بالليل على سورها ووضع السيف في أهلها وأحرق المربد ونقض الجامع وأقام بها سبعة عشر يوماً يحمل على الجمال الأمتعة والنساء والصبيان {cite:muntazam-ibn-al-jawzi p. 466} وعند ابن الجوزي غلب على الأمر بعد قتل أبيه سنة إحدى وثلاثمائة إذ كان أبوه عهد إلى ابنه سعيد فلم يضطلع بالأمر {cite:muntazam-ibn-al-jawzi p. 412-413}."
  en: "Abu Sa'id's son; in 317 he massacred the pilgrims in the Haram, cast the dead into Zamzam, broke and wrenched out the Black Stone — kept over twenty years — and cried from the Ka'ba's door 'I create mankind and destroy them'. He prospered no more, dying torn by smallpox {cite:tarikh-khulafa-minhaj-1434 p. 592-593}."
  fr: "Fils d'Abu Sa'id ; en 317, il massacra les pèlerins dans le Haram, jeta les morts dans Zamzam, brisa et arracha la Pierre noire, gardée plus de vingt ans, et cria de la porte de la Kaaba : « Je crée les hommes et les détruis. » Il ne prospéra plus et mourut ravagé par la variole {cite:tarikh-khulafa-minhaj-1434 p. 592-593}."
  ur: "قرمطی رہنما ابو سعید کے بیٹے؛ ۳۱۷ھ میں مکہ پر حملے، حاجیوں کے قتل اور حجر اسود کو وہاں سے لے جانے کے واقعات سے وابستہ ہیں۔ {cite:muntazam-ibn-al-jawzi}"
  es: "Hijo de Abu Sa'id, en el año 317 masacró a los peregrinos en el Haram, arrojó los cadáveres al Zamzam, rompió y arrancó la Piedra Negra —que había permanecido allí durante más de veinte años— y gritó desde la puerta de la Kaaba: «Yo creo a la humanidad y la destruyo». No prosperó más, pues murió desgarrado por la viruela {cite:tarikh-khulafa-minhaj-1434 p. 592-593}."
  tr: "İbn Abi Sa'id el-Karmati, 17. yılda Tarviye Günü'nde Kutsal Mescid'deki Hac kervanına saldırdı, hacıları öldürdü ve ölüleri Zemzem kuyusuna attı. Kara Taşı bir iğneyle kırdı ve kökünden söktü; taş, yirmi yıldan fazla bir süre onlarla kaldı ve ancak Muti' halifeliği döneminde geri verildi. Kâbe'nin kapısına çıkarak, \"Ben Allah'a yemin ederim, ben Allah'a yemin ederim. Yaratılışı ben yaratırım, yok ederim.\" dedi. Bundan sonra başarılı olamadı ve bedeni çiçek hastalığına yakalandı. {cite:tarikh-khulafa-minhaj-1434 pp. 592-593}. İbn el-Athir'e göre, Basra ve Ahvaz'ı istedikten sonra cevap alamayınca 312 Hicri yılında Kufe'ye girdi. Cafer ibn Varak'ı yendi ve altı gün Kufe dışında kaldı. Hicri 315 yılında Yusuf ibn Abi al-Saj'ı yenmiş ve sayıca az olduklarını hafife alarak gün batımında esir almıştı. Savaştan önce zafer mektubunu yazmıştı. Daha sonra gemilerle Haditha'dan Anbar'a geçmiş, şehri ele geçirmiş ve köprüsünü inşa etmişti. {Kaynak: Kamil İbn Al-Athir s. 115-126} İbn Al-Athir'e göre, hacılar Hicri 317 yılında Terviye Günü'nde Mekke'ye vardıklarında, onları yağmalamış ve hatta Kâbe'nin içinde öldürmüştü. Kara Taşı ve Kâbe'nin kapısını söküp ölüleri Zemzem'e atmıştı. İfrikiye'de el-Mehdi Ubeyd-i Allah onu kınayıp reddettiğinde, Kara Taşı geri vermişti. {Kaynak: Kamil İbn Al-Athir s. 115-126} İbn el-Cevzi'ye göre, Hicri 311 yılının Rebiü'l-Ahir ayında şafak vakti bin yedi yüz adamla Basra'ya girdi, geceleyin surlarına merdivenler kurdu, halkını kılıçtan geçirdi, harman yerini yaktı ve camiyi yıktı, on yedi gün orada kaldı, malları, kadınları ve çocukları develerle taşıdı. {kaynak: Muntazam-ibn-el-Cevzi, s. 466} İbn el-Cevzi'ye göre, babasının öldürülmesinin ardından 301 yılında iktidarı ele geçirdi, çünkü babası bu işi oğlu Sa'id'e emanet etmişti, ancak Sa'id işin başına geçmedi. {kaynak: Muntazam-ibn-el-Cevzi, s. 412-413}"
  id: "Ibn Abi Sa'id al-Qarmati menyerang kafilah haji di Masjidil Haram pada Hari Tarwiyah tahun ketujuh belas, membunuh para peziarah dan membuang mayat-mayat ke Zamzam. Ia memecahkan Batu Hitam dengan peniti dan mencabutnya, dan batu itu tetap berada di tangan mereka selama lebih dari dua puluh tahun hingga dikembalikan pada masa kekhalifahan al-Muti'. Ia memanjat pintu Ka'bah, seraya berkata, \"Aku adalah Allah, dan aku adalah Allah. Aku menciptakan ciptaan dan aku menghancurkannya.\" Ia tidak beruntung setelah itu, dan tubuhnya dirusak oleh cacar. {cite:tarikh-khulafa-minhaj-1434 pp. 592-593}. Menurut Ibn al-Athir, ia memasuki Kufa pada tahun 312 H setelah meminta Basra dan Ahwaz, tetapi tidak mendapat tanggapan. Ia mengalahkan Ja'far ibn Warqa' dan tinggal di luar Kufa selama enam hari. Dia mengalahkan Yusuf ibn Abi al-Saj pada tahun 315 H dan menangkapnya saat matahari terbenam setelah meremehkan jumlah mereka yang sedikit dan menulis surat kemenangan sebelum pertempuran. Kemudian dia menyeberang ke Anbar dari al-Haditha dengan kapal, merebutnya, dan membangun jembatannya. {kutip:kamil-ibn-al-athir hlm. 115-126}, dan menurut Ibn al-Athir, para peziarah tiba di Mekah pada Hari Tarwiyah tahun 317 H, lalu dia menjarah dan membunuh mereka bahkan di dalam Ka'bah itu sendiri, dan dia mengambil Batu Hitam dan pintu Ka'bah dan membuang mayat-mayat ke Zamzam. Ketika al-Mahdi Ubayd Allah dalam Ifriqiyah mengecamnya dan mengingkarinya, dia mengembalikan Batu itu {kutip:kamil-ibn-al-athir hlm. 154-155}, dan menurut Ibn al-Jawzi, pada bulan Rabi’ al-Akhir tahun 311 H, ia memasuki Basra pada waktu subuh dengan seribu tujuh ratus orang, memasang tangga di malam hari di temboknya, dan membantai penduduknya, membakar tempat pengirikan dan menghancurkan masjid, dan tinggal di sana selama tujuh belas hari, membawa barang-barang, wanita dan anak-anak di atas unta {kutip:muntazam-ibn-al-jawzi hlm. 466}, dan menurut Ibn al-Jawzi, ia merebut kekuasaan setelah pembunuhan ayahnya pada tahun 301, karena ayahnya telah mempercayakan masalah itu kepada putranya Sa’id, tetapi ia tidak mengambil alih masalah tersebut {kutip:muntazam-ibn-al-jawzi hlm. 412-413}."
