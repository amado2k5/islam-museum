id: person/abu-tahir-al-qarmati
class: person
label: { ar: "أبو طاهر سليمان القرمطي" }
summary:
  ar: "ابن أبي سعيد القرمطي، هاجم ركب الحاج في المسجد الحرام يوم التروية سنة سبع عشرة فقتل الحجيج وطرح القتلى في زمزم وكسر الحجر الأسود بالدبوس واقتلعه وبقي عندهم أكثر من عشرين سنة حتى أعيد في خلافة المطيع، وصعد على باب الكعبة وهو يقول أنا بالله وبالله أنا يخلق الخلق وأفنيهم أنا فلم يفلح بعدها وتقطع جسده بالجدري {cite:tarikh-khulafa-minhaj-1434 p. 592-593}.، وعند ابن الأثير دخل الكوفة سنة 312هـ بعد أن طلب البصرة والأهواز فلم يُجب فهزم جعفر بن ورقاء وأقام بظاهر الكوفة ستة أيام، وهزم يوسف بن أبي الساج سنة 315هـ وأسره وقت المغرب بعد أن احتقر قلتهم وكتب كتاب الفتح قبل اللقاء، ثم عبر إلى الأنبار من الحديثة في سفن واستولى عليها وعقد جسرها {cite:kamil-ibn-al-athir p. 115-126}، وعند ابن الأثير وافى الحجاج بمكة يوم التروية سنة 317هـ فنهبهم وقتلهم حتى في البيت نفسه وقلع الحجر الأسود وباب الكعبة وطرح القتلى في زمزم فلما أنكر عليه المهدي عبيد الله بإفريقية وبرئ منه أعاد الحجر {cite:kamil-ibn-al-athir p. 154-155}، وعند ابن الجوزي وفي ربيع الآخر سنة 311هـ دخل البصرة سحراً في ألف وسبعمائة رجل بنصب سلالم بالليل على سورها ووضع السيف في أهلها وأحرق المربد ونقض الجامع وأقام بها سبعة عشر يوماً يحمل على الجمال الأمتعة والنساء والصبيان {cite:muntazam-ibn-al-jawzi p. 466}"
  en: "Abu Sa'id's son; in 317 he massacred the pilgrims in the Haram, cast the dead into Zamzam, broke and wrenched out the Black Stone — kept over twenty years — and cried from the Ka'ba's door 'I create mankind and destroy them'. He prospered no more, dying torn by smallpox {cite:tarikh-khulafa-minhaj-1434 p. 592-593}."
