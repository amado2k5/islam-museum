summary:
  ar: "السلطان الثامن والعشرون لبروناي (1950–1967)، الملقّب بمهندس بروناي الحديثة. وُلد في مدينة بروناي سنة 1914 أخا أصغر للسلطان أحمد تاج الدين، فخلفه سنة 1950 ومنح بروناي أول دستور مكتوب سنة 1959 وأبقاها خارج الاتحاد الماليزي سنة 1963 ونظّم إدارتها الإسلامية، ثم تنحّى سنة 1967 لابنه الأكبر حسن البلقية وبقي مرشدا له حتى وفاته سنة 1986."
  en: "The 28th Sultan of Brunei (1950–1967), remembered as the Architect of Modern Brunei. Born in Brunei Town in 1914, a younger brother of Sultan Ahmad Tajuddin, he succeeded in 1950, gave Brunei its first written constitution in 1959, kept it out of the Malaysian federation in 1963 and regularised its Islamic administration, then abdicated in 1967 in favour of his eldest son Hassanal Bolkiah, remaining his mentor until his death in 1986."
  ur: "برونائی کے اٹھائیسویں سلطان (1950ء–1967ء)، جو جدید برونائی کے معمار کے طور پر یاد کیے جاتے ہیں۔ 1914ء میں برونائی ٹاؤن میں سلطان احمد تاج الدین کے چھوٹے بھائی پیدا ہوئے، 1950ء میں تخت نشین ہوئے، 1959ء میں برونائی کو اس کا پہلا تحریری آئین دیا، 1963ء میں اسے ملائیشیائی وفاق سے باہر رکھا اور اس کی اسلامی انتظامیہ کو منظم کیا، پھر 1967ء میں اپنے بڑے بیٹے حسن البلقیہ کے حق میں دستبردار ہوئے اور 1986ء میں وفات تک ان کے مرشد رہے۔"
