summary:
  ar: "السلطان الثامن والعشرون لبروناي (1950–1967)، الملقّب بمهندس بروناي الحديثة. وُلد في مدينة بروناي سنة 1914 أخا أصغر للسلطان أحمد تاج الدين، فخلفه سنة 1950 ومنح بروناي أول دستور مكتوب سنة 1959 وأبقاها خارج الاتحاد الماليزي سنة 1963 ونظّم إدارتها الإسلامية، ثم تنحّى سنة 1967 لابنه الأكبر حسن البلقية وبقي مرشدا له حتى وفاته سنة 1986."
  en: "The 28th Sultan of Brunei (1950–1967), remembered as the Architect of Modern Brunei. Born in Brunei Town in 1914, a younger brother of Sultan Ahmad Tajuddin, he succeeded in 1950, gave Brunei its first written constitution in 1959, kept it out of the Malaysian federation in 1963 and regularised its Islamic administration, then abdicated in 1967 in favour of his eldest son Hassanal Bolkiah, remaining his mentor until his death in 1986."
  ur: "برونائی کے اٹھائیسویں سلطان ⁦(1950ء–1967ء)⁩، جو جدید برونائی کے معمار کے طور پر یاد کیے جاتے ہیں۔ 1914ء میں برونائی ٹاؤن میں سلطان احمد تاج الدین کے چھوٹے بھائی پیدا ہوئے، 1950ء میں تخت نشین ہوئے، 1959ء میں برونائی کو اس کا پہلا تحریری آئین دیا، 1963ء میں اسے ملائیشیائی وفاق سے باہر رکھا اور اس کی اسلامی انتظامیہ کو منظم کیا، پھر 1967ء میں اپنے بڑے بیٹے حسن البلقیہ کے حق میں دستبردار ہوئے اور 1986ء میں وفات تک ان کے مرشد رہے۔"
  es: "El 28.º sultán de Brunéi (1950-1967), recordado como el arquitecto del Brunéi moderno. Nacido en Brunéi Town en 1914, hermano menor del sultán Ahmad Tajuddin, ascendió al trono en 1950, otorgó a Brunéi su primera constitución escrita en 1959, lo mantuvo fuera de la federación malasia en 1963 y regularizó su administración islámica, para luego abdicar en 1967 en favor de su hijo mayor, Hassanal Bolkiah, quien siguió siendo su mentor hasta su muerte en 1986."
  fr: "Le 28e sultan de Brunei (1950-1967), considéré comme l'architecte du Brunei moderne, est né à Brunei Town en 1914. Frère cadet du sultan Ahmad Tajuddin, il accède au trône en 1950, dote le Brunei de sa première constitution écrite en 1959, préserve le pays de la fédération malaisienne en 1963 et régularise son administration islamique. Il abdique ensuite en 1967 en faveur de son fils aîné, Hassanal Bolkiah, dont il reste le mentor jusqu'à sa mort en 1986."
  tr: "Brunei'nin yirmi sekizinci Sultanı (1950–1967), Modern Brunei'nin Mühendisi lakabını aldı. 1914'te Brunei'de doğdu, Sultan Ahmad Tajudin'in küçük kardeşi, 1950'de onun yerine geçti, 1959'da Brunei'ye ilk yazılı anayasasını verdi, 1963'te Malezya Federasyonu dışında tuttu ve İslami yönetimini organize etti. Daha sonra 1967'de en büyük oğlu Hassan Al-Bolkiah'a devretti; Bolkiah, 1986'daki ölümüne kadar onun akıl hocası olarak kaldı."
  id: "Sultan Brunei ke-28 (1950–1967), dijuluki Insinyur Brunei Modern. Ia lahir di Brunei pada tahun 1914, adik dari Sultan Ahmad Tajudin, menggantikannya pada tahun 1950, memberikan konstitusi tertulis pertama kepada Brunei pada tahun 1959, menjaganya di luar Federasi Malaysia pada tahun 1963, dan mengorganisir administrasi Islamnya. Ia kemudian mengundurkan diri pada tahun 1967 dari putra sulungnya Hassan Al-Bolkiah, yang tetap menjadi mentornya hingga wafat pada tahun 1986."
