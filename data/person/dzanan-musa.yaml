summary:
  ar: "لاعب كرة سلة بوسني (وُلد سنة 1999) من بيهاتش، اختاره بروكلين نتس في المرتبة 29 من درافت NBA سنة 2018 بعد بروزه مع تشيديفيتا، فاز بلقب اليوروليغ مع ريال مدريد سنة 2023 وبجائزة أفضل لاعب في الدوري الإسباني مع بريوغان سنة 2022، وانضم إلى دبي لكرة السلة سنة 2025، وهو من أبرز لاعبي منتخب البوسنة والهرسك."
  en: "Bosnian basketball player (born 1999) from Bihać, drafted 29th overall by the Brooklyn Nets in 2018 after emerging at Cedevita; he won the EuroLeague with Real Madrid in 2023 and the Liga ACB MVP award with Breogán in 2022, joined Dubai Basketball in 2025, and leads the Bosnia and Herzegovina national team."
  ur: "بوسنیائی باسکٹ بال کھلاڑی (پیدائش 1999) جن کا تعلق بیہاچ سے ہے؛ 2018 کے NBA ڈرافٹ میں بروکلین نیٹس نے انہیں منتخب کیا، 2023 میں ریال میڈرڈ کے ساتھ یورولیگ جیتا اور 2025 میں دبئی باسکٹ بال سے وابستہ ہوئے؛ بوسنیا و ہرزیگووینا کی قومی ٹیم کے نمایاں کھلاڑی ہیں۔"
