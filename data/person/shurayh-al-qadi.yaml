id: person/shurayh-al-qadi
class: person
label: { ar: "شريح القاضي" }
summary:
  ar: "قاضي الكوفة المشهور، ترافع إليه علي مع يهودي في درع فقضى لليهودي لأن شهادة الابن لا تجوز للأب، فشهد اليهودي شهادة الحق وأسلم إعجاباً بقضائه على أمير المؤمنين {cite:tarikh-khulafa-minhaj-1434 p. 306-307}."
  en: "The famous judge of Kufa; when Ali pleaded against a Jew over a coat of mail he ruled for the Jew, holding a son's testimony inadmissible for a father — whereupon the Jew bore witness to the truth and embraced Islam, amazed that a verdict had gone against the Commander of the Faithful {cite:tarikh-khulafa-minhaj-1434 p. 306-307}."
  es: "El famoso juez de Kufa; cuando Ali abogó contra un judío por una cota de malla, falló a favor del judío, considerando inadmisible el testimonio de un hijo para un padre, tras lo cual el judío dio testimonio de la verdad y abrazó el Islam, asombrado de que un veredicto hubiera ido en contra del Comandante de los Creyentes {cite:tarikh-khulafa-minhaj-1434 p. 306-307}."
  fr: "Le célèbre juge de Kufa; lorsqu'Ali plaida contre un Juif au sujet d'une cotte de mailles, il trancha en faveur du Juif, déclarant le témoignage d'un fils inadmissible pour un père — sur quoi le Juif témoigna de la vérité et embrassa l'Islam, étonné qu'un verdict ait été rendu contre le Commandeur des Croyants {cite:tarikh-khulafa-minhaj-1434 p. 306-307}."
