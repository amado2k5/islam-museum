summary:
  ar: "أسدي حليف بني عبد شمس؛ قدّمه خالد بن الوليد أمامه إلى بزاخة مع ثابت بن أقرم البلوي حليف الأنصار فلقيهما هبال بن خويلد فقتلهما، وخرج طليحة بن خويلد وسلمة أخوه فلقيا عكاشة وثابتاً فقتلاهما — وقد قال طليحة فيهما بيته المشهور في ابن أقرم وعكاشة الغنمي."
  en: "An Asadi, ally of Banu Abd Shams; Khalid ibn al-Walid sent him forward to Buzakha with Thabit ibn Aqram al-Balawi, the Ansar's ally, where Hibal ibn Khuwaylid met and killed them — and Tulayha ibn Khuwaylid and his brother Salama then went out, met Ukasha and Thabit and killed them, Tulayha uttering his famous verse on Ibn Aqram and 'Ukasha al-Ghanmi'."
  ur: "اسدی، بنو عبد شمس کا حلیف؛ خالد بن ولید نے اسے انصار کے حلیف ثابت بن اقرم البلوی کے ساتھ بزاخہ آگے بھیجا۔"
  es: "An Asadi, aliado de Banu Abd Shams; Khalid ibn al-Walid lo envió a Buzakha con Thabit ibn Aqram al-Balawi, el aliado de los Ansar, donde Hibal ibn Khuwaylid los encontró y los mató, y Tulayha ibn Khuwaylid y su hermano Salama salieron, se encontraron con Ukasha y Thabit y los mataron, Tulayha pronunció su famoso verso sobre Ibn Aqram y 'Ukasha al-Ghanmi'."
  fr: "An Asadi, allié des Banu Abd Shams; Khalid ibn al-Walid l'a envoyé à Buzakha avec Thabit ibn Aqram al-Balawi, l'allié des Ansar, où Hibal ibn Khuwaylid les a rencontrés et les a tués - et Tulayha ibn Khuwaylid et son frère Salama sont ensuite sortis, ont rencontré Ukasha et Thabit et les ont tués, Tulayha prononçant son célèbre vers sur Ibn Aqram et « Ukasha al-Ghanmi »."
  tr: "Banu Abd Shams'ın müttefiki Asadi; Halid ibn al-Walid, onu Ensar'ın müttefiki Thabit ibn Aqram al-Balawi ile birlikte Bazakha'ya getirdi. Hubal ibn Khuwaylid onları karşıladı ve öldürdü. Tulayha ibn Khuwaylid ve kardeşi Salama dışarı çıktı, Ukasha ve Thabit ile karşılaştı ve onları öldürdü — Tulaiha ünlü evinde İbn Aqram ve Ukasha al-Ghanmi hakkında onlardan bahsetti."
  id: "Asadi, sekutu Banu Abd Shams; Khalid ibn al-Walid membawanya ke Bazakha bersama Thabit ibn Aqram al-Balawi, sekutu Ansar. Hubal ibn Khuwaylid bertemu mereka dan membunuh mereka. Tulayha ibn Khuwaylid dan saudaranya Salama keluar, bertemu Ukasha dan Thabit, dan membunuh mereka — Tulaiha berkata tentang mereka di rumah terkenalnya tentang Ibn Aqram dan Ukasha al-Ghanmi."
