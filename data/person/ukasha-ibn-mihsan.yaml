summary:
  ar: "أسدي حليف بني عبد شمس؛ قدّمه خالد بن الوليد أمامه إلى بزاخة مع ثابت بن أقرم البلوي حليف الأنصار فلقيهما هبال بن خويلد فقتلهما، وخرج طليحة بن خويلد وسلمة أخوه فلقيا عكاشة وثابتاً فقتلاهما — وقد قال طليحة فيهما بيته المشهور في ابن أقرم وعكاشة الغنمي."
  en: "An Asadi, ally of Banu Abd Shams; Khalid ibn al-Walid sent him forward to Buzakha with Thabit ibn Aqram al-Balawi, the Ansar's ally, where Hibal ibn Khuwaylid met and killed them — and Tulayha ibn Khuwaylid and his brother Salama then went out, met Ukasha and Thabit and killed them, Tulayha uttering his famous verse on Ibn Aqram and 'Ukasha al-Ghanmi'."
