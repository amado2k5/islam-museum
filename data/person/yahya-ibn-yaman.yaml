roles: [scholar]
gender: male
summary:
  ar: "يحيى بن يمان العجلي الكوفي، أبو زكريا، محدث ومقرئ صحب سفيان الثوري وأكثر عنه؛ وصفه الذهبي بالحافظ الصادق العابد، وتكلم النقاد في حفظه بعد إصابته بالفالج، وتوفي سنة 189 هـ."
  en: "Yahya ibn Yaman al-Ijli al-Kufi, Abu Zakariyya, hadith scholar and Qur'an reciter who kept company with Sufyan al-Thawri and narrated much from him; al-Dhahabi calls him truthful and devout, the critics discussed his memory after a paralysis, and he died in 189 AH."
  es: "Yahya ibn Yaman al-Ijli al-Kufi, Abu Zakariyya, erudito de hadices y recitador del Corán que frecuentaba a Sufyan al-Thawri y narró mucho de él; al-Dhahabi lo llama veraz y devoto, los críticos discutieron sobre su memoria después de una parálisis, y murió en el año 189 de la Hégira."
  fr: "Yahya ibn Yaman al-Ijli al-Kufi, Abu Zakariyya, érudit du hadith et récitateur du Coran qui fréquentait Sufyan al-Thawri et rapportait beaucoup de choses de lui; al-Dhahabi le qualifie de véridique et pieux, les critiques ont discuté de sa mémoire après une paralysie, et il est mort en 189 AH."
  ur: "یحییٰ بن یمان العجلی الکوفی، ابو زکریا، حدیث کے عالم اور قاری قرآن جنہوں نے سفیان الثوری کے ساتھ صحبت کی اور ان سے بہت کچھ روایت کیا۔ الذہبی اسے سچا اور متقی کہتا ہے، ناقدین نے فالج کے بعد ان کی یادداشت پر بحث کی اور 189 ہجری میں ان کا انتقال ہوا۔"
  tr: "Yahya ibn Yaman al-Ajli al-Kufi, Sufyan al-Thawri ile birlikte olan ve ondan daha fazla rivayet eden hadis âlimi ve şiirci Ebu Zekariya; el-Dhahabi onu samimi ve dindar bir ezberci olarak tanımlamıştır. Eleştirmenler, felç geçirdikten sonra ezberlediğinden bahsetmiş ve 189 Hicri yılında vefat etmiştir."
  id: "Yahya ibn Yaman al-Ajli al-Kufi, Abu Zakariya, seorang ulama hadis dan pembaca yang menemani Sufyan al-Thawri dan menceritakan lebih banyak darinya; al-Dhahabi menggambarkannya sebagai seorang penghafal yang tulus dan taat. Para kritikus membicarakan hafalannya setelah mengalami stroke, dan ia meninggal pada tahun 189 H."
