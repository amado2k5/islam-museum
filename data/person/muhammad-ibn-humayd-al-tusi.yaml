summary:
  ar: "أمير طوسي، حدث مولاه فائق الخادم أن جاريته غنت من وراء الستارة يا قمر القصر متى تطلع فزج غلامه بنفسه من الدار إلى دجلة فهتكت الجارية الستارة ورمت بنفسها على أثره فلم يوجد منهما أحد فقطع محمد الشراب وقام عن مجلسه {cite:muruj-al-dhahab p. 488}."
  en: "The amir of Tus whose drinking-party ended when his page and singer drowned themselves for love in the Tigris {cite:muruj-al-dhahab p. 488}."
  es: "El emir de Tus cuya fiesta terminó cuando su paje y cantante se ahogaron por amor en el Tigris {cite:muruj-al-dhahab p. 488}."
  fr: "L'émir de Tus dont la fête arrosée prit fin lorsque son page et son chanteur se noyèrent d'amour dans le Tigre {cite:muruj-al-dhahab p. 488}."
  ur: "طوس کا امیر جس کی شراب نوشی کی پارٹی اس وقت ختم ہوئی جب اس کے صفحہ اور گلوکار نے دجلہ میں محبت کے لیے خود کو غرق کر دیا۔ 488}۔"
  tr: "Prens Tusi, efendisi Faiq al-Khadim, köle kızının perdenin arkasından 'Ey sarayın ayı, ne zaman bakarsan' diye şarkı söylediğini anlattı. Bunun üzerine hizmetçisi evden Dicle'e atladı, köle kız perdeyi kırıp peşinden atladı ama hiçbiri bulunamadı. Bunun üzerine Muhammed içkiyi kesti ve konseyinden ayrıldı {atıf:muruj-al-dhahab, s. 488}."
  id: "Pangeran Tusi, tuannya Faiq al-Khadim, menceritakan bahwa budak perempuannya bernyanyi dari balik tirai, 'Wahai bulan istana, kapan pun kau melihat.' Jadi pelayannya melompat keluar dari rumah ke Sungai Tigris, dan budak perempuan itu memecahkan tirai dan melompat mengejarnya, tetapi tidak ada satu pun dari mereka yang ditemukan. Maka Muhammad memotong minuman itu dan meninggalkan dewannya {cite:muruj-al-dhahab, hlm. 488}."
