summary:
  ar: "محمد باقر بن محمد مؤمن الخراساني السبزواري، فقيه إمامي من الشيعة الإمامية، أصله من سبزوار في خراسان، سافر إلى العراق وسكن أصبهان وكان شيخ الإسلام فيها، وتوفي سنة 1090هـ؛ من كتبه «ذخيرة المعاد» و«كفاية الأحكام» و«روضات الأنوار»."
  en: "Muhammad Baqir al-Sabzawari, an Imami (Twelver Shi'i) jurist whose family came from Sabzawar in Khurasan; he travelled to Iraq, settled in Isfahan where he was shaykh al-Islam, and died in 1090 AH; his books include Dhakhirat al-Ma'ad, Kifayat al-Ahkam and Rawdat al-Anwar."
