summary:
  ar: "جحا العربي، أبو الغصن، صاحب النوادر يُضرب به المثل في الحمق والغفلة. يذكر المحقق أن أمه كانت خادمة لوالدة أنس بن مالك، وأنه شهد ثورة أبي مسلم الخراساني، وأن الجاحظ أول من ذكره من المؤلفين العرب، وأنه ورد في فهرست ابن النديم بين كتب أخبار المغفلين. {cite:juha-nawadir-kubra-djuwaydi p. 4-5}"
  en: "The Arab Juha, Abu al-Ghusn, a jester proverbial for foolishness and heedlessness. The editor records that his mother served Anas ibn Malik's mother, that he witnessed Abu Muslim's revolt, that al-Jahiz was the first Arab author to mention him, and that Ibn al-Nadim lists a Nawadir Juha among books on fools. {cite:juha-nawadir-kubra-djuwaydi p. 4-5}"
  ur: "عربی جحا، ابو الغصن، ایک لطیفہ گو جو حماقت اور غفلت کی مثال ہیں۔ مرتب کے مطابق ان کی والدہ انس بن مالک کی والدہ کی خادمہ تھیں، انہوں نے ابو مسلم خراسانی کی تحریک دیکھی، جاحظ عرب مؤلفین میں سب سے پہلے ان کا ذکر کرنے والے تھے، اور ابن الندیم کی فہرست میں احمقوں کی کتابوں میں 'نوادر جحا' درج ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 4-5}"
  es: "El árabe Juha, Abu al-Ghusn, un bufón proverbial por su necedad e imprudencia. El editor registra que su madre sirvió a la madre de Anas ibn Malik, que presenció la revuelta de Abu Muslim, que al-Jahiz fue el primer autor árabe en mencionarlo, y que Ibn al-Nadim incluye a un Nawadir Juha entre los libros sobre necios. {cite:juha-nawadir-kubra-djuwaydi p. 4-5}"
  fr: "Le Juha arabe, Abu al-Ghusn, bouffon proverbial pour sa sottise et son insouciance. L'éditeur rapporte que sa mère était au service de la mère d'Anas ibn Malik, qu'il fut témoin de la révolte d'Abu Muslim, qu'al-Jahiz fut le premier auteur arabe à le mentionner, et qu'Ibn al-Nadim cite un certain Nawadir Juha parmi les ouvrages consacrés aux fous. {cite:juha-nawadir-kubra-djuwaydi p. 4-5}"
  tr: "Anekdotların yazarı Juha al-Arabi, Abu al-Ghusn, aptallık ve dikkatsizlik için atasözü olarak kullanılır. Araştırmacı, annesinin Anas ibn Malik'in annesinin hizmetkarı olduğunu, Ebu Müslüm el-Horasani'nin isyanına tanık olduğunu, el-Cahiz'in onu ilk Arap yazar olarak andığını ve İbn el-Nadim'in kataloğunda aptalların anlatımları kitapları arasında yer aldığını belirtir. {Alıntı:Juha-nawadir-Kubra-Djuwaydi s. 4-5}"
  id: "Juha al-Arabi, Abu al-Ghusn, penulis anekdot, digunakan sebagai peribahasa untuk kebodohan dan kelalaian. Penyelidik menyebutkan bahwa ibunya adalah pelayan ibu Anas ibn Malik, bahwa ia menyaksikan pemberontakan Abu Muslim al-Khurasani, bahwa al-Jahiz adalah penulis Arab pertama yang menyebutnya, dan bahwa ia muncul dalam katalog Ibn al-Nadim di antara kitab-kitab catatan orang bodoh. {sitasi: Juha-Nawadir-Kubra-Djuwaydi hlm. 4-5}"
