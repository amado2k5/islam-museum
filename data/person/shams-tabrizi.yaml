summary:
  ar: "بطاقة أولية لشمس التبريزي، المتصوف الذي صاحبه جلال الدين الرومي فانقلبت به حاله، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في معجم الأعلام على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Shams Tabrizi, the mystic whose companionship transformed Jalal al-Din Rumi, named from an open reference description (Wikidata); his al-A'lam entry is not yet checked on the page, so no dates are given."
  es: "Ficha preliminar de Shams Tabrizi, el místico cuya compañía transformó a Jalal al-Din Rumi, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en al-A'lam aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche provisoire de Shams Tabrizi, le mystique dont la compagnie a transformé Jalal al-Din Rumi, nommé d'après une description de référence ouverte (Wikidata); son entrée al-A'lam n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "شمس تبریزی کے لیے ڈرافٹ کارڈ، وہ صوفیانہ جس کی صحبت نے جلال الدین رومی کو تبدیل کر دیا، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا؛ اس کے العالم اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Celaleddin Rumi'ye eşlik eden Sufi Şems el-Tabrizi ve durumu iptal edildiği ön kart, açık bir referans açıklamasında (Wikidata) belirtilmiştir. Çevirisi henüz Sözlük Seçkinleri Sözlüğü'nde incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan Shams al-Tabrizi, seorang Sufi yang menemani Jalal al-Din Rumi, dan kondisinya dibatalkan, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya belum ditinjau dalam Kamus Tokoh di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
