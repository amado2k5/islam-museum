id: person/al-mutadid-billah-cairo
class: person
label: { ar: "المعتضد بالله أبو الفتح أبو بكر بن المستكفي", en: "al-Mu'tadid bi'llah Abu'l-Fath Abu Bakr ibn al-Mustakfi", fr: "al-Mu'tadid bi'llah Abu'l-Fath Abu Bakr ibn al-Mustakfi", es: "al-Mu'tadid bi'llah Abu'l-Fath Abu Bakr ibn al-Mustakfi", ur: "المتعد باللہ ابوالفتح ابوبکر بن المستقفی" }
summary:
  ar: "خليفة القاهرة [٧٥٣–٧٦٣هـ]، بويع بالخلافة بعد موت أخيه الحاكم سنة ثلاث وخمسين بعهد منه وكان خيراً متواضعاً محباً لأهل العلم مات في جمادى الأولى سنة ثلاث وستين وسبع مئة، وفي أيامه خلع المنصور أبو بكر السلطان لفساده ونفي إلى قوص وقتل بها مجازاة لما فعله والده مع الخليفة كما قال {cite:tarikh-khulafa-minhaj-1434 p. 753-755}."
  en: "Cairo caliph [753–763], hailed by his brother's deed — 'good, humble, loving the people of knowledge' {cite:tarikh-khulafa-minhaj-1434 p. 753-755}."
  fr: "Le Caire calife [753-763], salué par l'acte de son frère – « bon, humble, aimant les gens de la connaissance » {cite:tarikh-khulafa-minhaj-1434 p. 753-755}."
  es: "Califa de El Cairo [753–763], aclamado por la acción de su hermano: «bueno, humilde, amante de la gente de conocimiento» {cite:tarikh-khulafa-minhaj-1434 p. 753-755}."
  ur: "قاہرہ کا خلیفہ [753-763]، اپنے بھائی کے عمل سے سراہا گیا - 'اچھے، حلیم، اہل علم سے محبت کرنے والا' 753-755}۔"
  tr: "Kahire Halifesi [753–763 H.M.]. Kardeşi el-Hakim'in 53 Hicri yılında, saltanatı sırasında vefatından sonra halifeliğe bağlılık yemini etti. Şefkatli, alçakgönüllü ve sevgi dolu bir âlimdi. 63 Hicri yılında Cumede el-Avval'de öldü. Saltanatı sırasında, el-Mansur, Ebu Bekir el-Sultan'ı yolsuzluğu nedeniyle tahttan indirdi, onu Kus'a sürgün etti ve babasının halifeye yaptıklarının karşılığında orada öldürüldü; dediği gibi: {alıntı:History-khulafa-minhaj-1434, s. 753-755}."
  id: "Khalifah Kairo [753–763 H]. Ia disumpah setia kepada kekhalifahan setelah kematian saudaranya al-Hakim pada tahun 53 H, selama masa pemerintahannya. Ia adalah seorang ulama yang baik hati, rendah hati, dan penuh kasih. Ia meninggal di Jumada al-Awwal pada tahun 63 H. Selama pemerintahannya, al-Mansur menggulingkan Abu Bakr al-Sultan karena korupsinya, mengasingkannya ke Qus, dan dibunuh di sana sebagai imbalan atas apa yang ayahnya lakukan kepada khalifah, seperti yang ia katakan: {cite:History-khulafa-minhaj-1434, hlm. 753-755}."
