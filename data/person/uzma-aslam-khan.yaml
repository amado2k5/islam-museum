summary:
  ar: "عظمى أسلم خان (وُلدت سنة 1969) روائية باكستانية، وُلدت في لاهور ونشأت في معظمها في كراتشي، وقضت سنوات طفولتها الأولى في مانيلا وطوكيو ولندن. درست في كليتي هوبارت وويليام سميث وفي جامعة أريزونا، ولها خمس روايات، من «قصة العفن النبيل» (2001) و«التعدي» (2003) إلى «التاريخ الحقيقي المعجز لنومي علي» (2019)؛ ونالت روايتها «أرقّ من الجلد» (2012) جائزة مهرجان كراتشي الأدبي وسفارة فرنسا للرواية."
  en: "Uzma Aslam Khan (born 1969) is a Pakistani novelist, born in Lahore and raised largely in Karachi, with her earliest years spent in Manila, Tokyo and London. Educated at Hobart and William Smith Colleges and the University of Arizona, she is the author of five novels, from The Story of Noble Rot (2001) and Trespassing (2003) to The Miraculous True History of Nomi Ali (2019); Thinner Than Skin (2012) won the KLF–Embassy of France Fiction Prize."
  ur: "عظمی اسلم خان (پیدائش 1969) پاکستانی ناول نگار ہیں، جو لاہور میں پیدا ہوئیں اور زیادہ تر کراچی میں پلی بڑھیں، جبکہ بچپن کے ابتدائی سال منیلا، ٹوکیو اور لندن میں گزرے۔ ہوبارٹ اینڈ ولیم سمتھ کالجز اور یونیورسٹی آف ایریزونا سے تعلیم پائی؛ ان کے پانچ ناول ہیں، «The Story of Noble Rot» (2001) اور «Trespassing» (2003) سے لے کر «The Miraculous True History of Nomi Ali» (2019) تک؛ «Thinner Than Skin» (2012) نے کے ایل ایف–فرانسیسی سفارت خانہ فکشن انعام جیتا۔"

