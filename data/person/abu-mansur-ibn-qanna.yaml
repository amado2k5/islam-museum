id: person/abu-mansur-ibn-qanna
class: person
label: { ar: "أبو منصور ابن قنا وزير أبي كليجار", en: "Abu Mansur ibn Qanna", fr: "Abu Mansur ibn Qanna", es: "Abu Mansur ibn Qanna", ur: "ابو منصور بن کنانہ" }
summary:
  ar: "وزير عماد الدولة أبي كليجار البويهي؛ كان فاضلًا، ومن آثاره أنه أوقف دار كتب على طلاب العلم جمع فيها تسعة عشر ألف مجلد ما فيها إلا أصل منسوب، وفيها أربعة آلاف ورقة بخط بني مقلة {cite:muntazam-ibn-al-jawzi j.8 p.406}."
  en: "Vizier of Imad al-Dawla Abu Kalijar al-Buwayhi; a man of merit, and among his works he endowed a library for students of learning, which held nineteen thousand volumes, none in it except an original with an established attribution, and in it four thousand leaves in the hand of the Banu Muqla {cite:muntazam-ibn-al-jawzi j.8 p.406}."
  fr: "Vizir d'Imad al-Dawla Abu Kalijar le Bouyide ; homme de mérite, parmi ses œuvres il constitua en waqf une bibliothèque pour les étudiants, qui comptait dix-neuf mille volumes, aucun qui ne fût un original d'attribution établie, et parmi eux quatre mille feuillets de la main des Banu Muqla {cite:muntazam-ibn-al-jawzi j.8 p.406}."
  es: "Visir de Imad al-Dawla Abu Kalijar al-Buwayhi; un hombre de mérito, y entre sus obras dotó una biblioteca para estudiantes de saber, que contenía diecinueve mil volúmenes, ninguno excepto un original con una atribución establecida, y en ella cuatro mil hojas escritas por los Banu Muqla {cite:muntazam-ibn-al-jawzi j.8 p.406}."
  ur: "عماد الدولہ ابو کلیجار البویحی کے وزیر؛ ایک قابل آدمی تھا، اور اس نے اپنے کاموں میں سے علمی طلباء کے لیے ایک کتب خانہ عطا کیا، جس میں انیس ہزار جلدیں تھیں، اس میں ایک اصل کے علاوہ کوئی بھی نہیں تھا جس میں ایک مستند انتساب تھا، اور اس میں بنو مقلہ کے ہاتھ میں چار ہزار پتے تھے۔"
  tr: "Bakan İmadüldale Ebu Kilijar el-Buveyhi erdemli bir kişiydi ve eserleri arasında ilim talebelerine bir kütüphane bağışlaması da vardı; bu kütüphanede on dokuz bin cilt eser topladı, bunların hepsi orijinal ve atfedilmiş eserlerdi ve bunların arasında Beni Muqla'nın el yazısıyla yazılmış dört bin belge bulunuyordu. {cite:muntazam-ibn-al-jawzi j.8 p.406}"
  id: "Menteri Imad al-Dawla Abi Kilijar al-Buwayhi adalah orang yang berbudi luhur, dan di antara karya-karyanya adalah beliau mewariskan sebuah perpustakaan kepada para pencari ilmu, di mana beliau mengumpulkan sembilan belas ribu jilid buku, yang semuanya asli dan telah dikaitkan dengan penulisnya, dan di dalamnya terdapat empat ribu lembar kertas yang ditulis tangan oleh Bani Muqla {cite:muntazam-ibn-al-jawzi j.8 p.406}."
