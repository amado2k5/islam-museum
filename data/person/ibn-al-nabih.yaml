summary:
  ar: "الكمال أبو الحسن علي بن محمد المعروف بابن النبيه المصري؛ كاتب الملك الأشرف وشاعره؛ رأى يوماً الملك الأشرف في دواة كاتبه وشاعره الكمال المذكور بيتاً قد كتبه في الحال دون بيت فقال الملك الأشرف قولاً رائعاً: يا كمال فلك الإعلان جاوبت لعظيم شئت ما تطلعه تحفى فتقطع فبي تفنى أبداً {cite:wafayat-ayan}."
  en: "Kamal al-Din Ibn al-Nabih al-Misri — katib and poet of al-Malik al-Ashraf Musa; the famous exchange where the king answered a lone verse with a rebuke on his wrist {cite:wafayat-ayan}."
  es: "Kamal al-Din Ibn al-Nabih al-Misri — katib y poeta de al-Malik al-Ashraf Musa; el famoso intercambio en el que el rey respondió a un solo verso con una reprimenda en su muñeca {cite:wafayat-ayan}."
  fr: "Kamal al-Din Ibn al-Nabih al-Misri — katib et poète d'al-Malik al-Ashraf Musa; le célèbre échange où le roi répondit à un verset isolé par une réprimande sur son poignet {cite:wafayat-ayan}."
  ur: "کمال الدین ابن النبیح المصری - کاتب و شاعر المالک الاشرف موسیٰ؛ مشہور تبادلہ جہاں بادشاہ نے اپنی کلائی پر ڈانٹ کے ساتھ ایک واحد آیت کا جواب دیا۔"
  tr: "El-Kemal Ebu el-Hasan Ali ibn Muhammed, İbn el-Nabih el-Masri olarak bilinir, Kral el-Eşref'in kâtipi ve şairi, bir keresinde yazarı ve şairi Kamal'ın mürekkebinde hemen yazdığı bir ayeti ve dizesiz bir dizesini görmüştür. Kral el-Eşref harika bir söz söylemiştir: Ey Kamal, büyük olanı cevapladın. Ne istersen istersen bir hediye istersin ve o armağan kesilir ve sonsuza dek yok olur {kaynak:vafayat-ayan}."
  id: "Al-Kamal Abu al-Hasan Ali ibn Muhammad, yang dikenal sebagai Ibn al-Nabih al-Masri, juru tulis dan penyair Raja al-Ashraf, pernah melihat dalam tinta penulis dan penyairnya, Kamal yang disebutkan tadi, sebuah bait yang langsung ia tulis tanpa bait. Raja al-Ashraf mengucapkan pepatah yang indah: Wahai Kamal, engkau telah menjawab yang agung. Apa pun yang kau inginkan, kau menginginkan hadiah dan itu akan dipotong dan musnah selamanya {cite:wafayat-ayan}."
