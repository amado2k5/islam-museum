    ar: "هبة قطب، أستاذة الطب الشرعي بالقاهرة المولودة سنة 1967، صارت سنة 2003 أول أخصائية مرخّصة في الطب الجنسي في مصر، وتجيب في برامجها الفضائية عن أسئلة المشاهدين في العلاقات الزوجية مستندة إلى القرآن."
    en: "Heba Kotb, a Cairo professor of forensic medicine born in 1967, became the first licensed sexologist in Egypt in 2003, and answers viewers' questions on marital sexuality on satellite television, grounding her answers in the Qur'an."
