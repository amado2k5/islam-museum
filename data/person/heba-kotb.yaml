summary:
  ar: "طبيبة مصرية وأستاذة الطب الشرعي بجامعة القاهرة ومقدّمة برامج تلفزيونية في الصحة الجنسية والعلاقات الزوجية، وُلدت في القاهرة سنة 1967. صارت سنة 2003 أول أخصائية مرخّصة في الطب الجنسي في مصر، واشتهرت في العالم العربي ببرنامجها «كلام كبير» على قناة المحور منذ 2006، الذي تجيب فيه عن أسئلة المشاهدين في إطار إسلامي، ولها كتاب «للكبار فقط»."
  en: "Egyptian physician, professor of forensic medicine at Cairo University and television presenter on sexual health and marital relations, born in Cairo in 1967. In 2003 she became the first licensed sexologist in Egypt, and she became known across the Arab world for her Al-Mehwar programme Kalam Kibeer (The Big Talk), from 2006, in which she answers viewers' questions within an Islamic frame. She is the author of Lil Kubaar Faqat (Adults Only)."
  ur: "مصری طبیبہ، جامعہ قاہرہ میں طبِ قانونی کی پروفیسر اور جنسی صحت و ازدواجی تعلقات پر ٹیلی ویژن پیش کار، جو 1967 میں قاہرہ میں پیدا ہوئیں۔ 2003 میں وہ مصر کی پہلی لائسنس یافتہ ماہرِ جنسیات بنیں، اور 2006 سے المحور چینل پر اپنے پروگرام «کلام بڑا» کے ذریعے عرب دنیا میں مشہور ہوئیں، جس میں وہ اسلامی تناظر میں ناظرین کے سوالات کے جواب دیتی ہیں۔ ان کی کتاب «صرف بڑوں کے لیے» بھی ہے۔"
  es: "Médica egipcia, profesora de medicina forense en la Universidad de El Cairo y presentadora de televisión especializada en salud sexual y relaciones matrimoniales, nació en El Cairo en 1967. En 2003 se convirtió en la primera sexóloga licenciada de Egipto y se hizo conocida en todo el mundo árabe por su programa Al-Mehwar Kalam Kibeer (La gran charla), desde 2006, en el que responde a las preguntas de los telespectadores desde una perspectiva islámica. Es autora de Lil Kubaar Faqat (Solo para adultos)."
  fr: "Médecin égyptienne, professeure de médecine légale à l'Université du Caire et présentatrice d'émissions de télévision sur la santé sexuelle et les relations conjugales, née au Caire en 1967. En 2003, elle est devenue la première sexologue agréée d'Égypte et s'est fait connaître dans le monde arabe grâce à son émission « Kalam Kibeer » (La Grande Discussion) diffusée sur Al-Mehwar à partir de 2006, dans laquelle elle répond aux questions des téléspectateurs dans une perspective islamique. Elle est l'auteure de « Lil Kubaar Faqat » (Réservé aux adultes)."
