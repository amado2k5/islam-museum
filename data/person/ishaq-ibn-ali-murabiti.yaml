summary:
  ar: إسحاق بن علي بن يوسف بن تاشفين، آخر ملوك المرابطين؛ بويع بعد هلاك أخيه تاشفين فلما وصل الموحدون إلى مراكش خرج إليهم في خاصته فقتلوه، وملك عبد المؤمن المغرب سنة 542هـ.
  en: Ishaq ibn Ali ibn Yusuf ibn Tashfin, the last Almoravid king; acclaimed after his brother Tashfin's death, he came out with his retinue when the Almohads reached Marrakesh and they killed him, Abd al-Mu'min taking the Maghreb in 542 AH.
