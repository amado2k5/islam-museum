summary:
  ar: "شيخ الشيوخ؛ كان أبوه قاضي حماة، وولد بدمشق سنة ست وثمانين وكان مفرط الذكاء؛ رحل به أبوه فسمع من ابن كليب جزء ابن عرفة ومن أبي المجد المسند كله؛ وله محفوظات كثيرة وفضائل شهيرة وحرمة وجلالة ولين جانب يكرم من يعرف ومن لا يعرف؛ مات بحماة ودفن بظاهرها في ثامن رمضان بتربة كان أعدها له، وله شعر {cite:shadharat-dhahab p. 535-536}."
  en: "Hama's shaykh al-shuyukh (b. Damascus 586), 'of exceeding intelligence' — carried by his father the qadi on rihla, he heard all of Abu al-Majd's Musnad; died 8 Ramadan 662 in a turba he had prepared {cite:shadharat-dhahab p. 535-536}."
