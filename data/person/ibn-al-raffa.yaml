summary:
  ar: "شيخ الشيوخ؛ كان أبوه قاضي حماة، وولد بدمشق سنة ست وثمانين وكان مفرط الذكاء؛ رحل به أبوه فسمع من ابن كليب جزء ابن عرفة ومن أبي المجد المسند كله؛ وله محفوظات كثيرة وفضائل شهيرة وحرمة وجلالة ولين جانب يكرم من يعرف ومن لا يعرف؛ مات بحماة ودفن بظاهرها في ثامن رمضان بتربة كان أعدها له، وله شعر {cite:shadharat-dhahab p. 535-536}."
  en: "Hama's shaykh al-shuyukh (b. Damascus 586), 'of exceeding intelligence' — carried by his father the qadi on rihla, he heard all of Abu al-Majd's Musnad; died 8 Ramadan 662 in a turba he had prepared {cite:shadharat-dhahab p. 535-536}."
  es: "El shaykh al-shuyukh de Hama (nacido en Damasco en 586), \"de inteligencia excepcional\", llevado por su padre el cadí en rihla, escuchó todo el Musnad de Abu al-Majd; murió el 8 de Ramadán de 662 en un turba que él mismo había preparado {cita: shadharat-dhahab págs. 535-536}."
  fr: "Le cheikh al-shuyukh de Hama (né à Damas en 586), « d'une intelligence exceptionnelle » — transporté par son père le cadi sur rihla, il a entendu tout le Musnad d'Abu al-Majd; est mort le 8 Ramadan 662 dans une turba qu'il avait préparée {cite: shadharat-dhahab p. 535-536}."
  ur: "حما کے شیخ الشیوخ ⁦(متوفی دمشق 586)⁩، 'زیادہ ذہانت کا' - اس کے والد قادی نے رحلہ پر اٹھایا، اس نے ابو المجد کی تمام مسند سنی؛ 8رمضان المبارک 662 کو اس نے تیار کردہ تربہ میں وفات پائی۔ 535-536}۔"
  tr: "Şeyhlerin şeyhi; babası Hama'nın yargıcıydı, seksen altıncı yılda Şam'da doğmuş ve son derece zekiydi; babası onunla birlikte seyahat etmiş, İbn Kulayb'dan İbn Arafa'nın rolünü ve Ebu al-Majed'den tüm Musnad'ı duymuştur. Birçok ezberlenmiş eser, ünlü erdem, kutsallık, ihtişam ve hem bilenleri hem de bilmeyenleri onurlandıran nazik bir tarafı vardır. Hama'da öldü ve Ramazan'ın sekizinde kendisi için hazırlanmış toprağa dış konumuna defnedildi. Şiirleri vardır {atıf:shadharat-dhahab s. 535-536}."
  id: "Sheikh para sheikh; ayahnya adalah hakim Hama, lahir di Damaskus pada tahun delapan puluh enam, dan ia sangat cerdas; ayahnya ikut bepergian dengannya, dan ia mendengar dari Ibn Kulayb bagian Ibn 'Arafa dan dari Abu al-Majd seluruh Musnad. Ia memiliki banyak karya yang dihafal, kebajikan terkenal, kesucian, keagungan, dan sisi lembut yang menghormati baik yang tahu maupun yang tidak. Ia meninggal di Hama dan dimakamkan di tempat luarnya pada tanggal delapan Ramadan di tanah yang telah disiapkan untuknya. Ia memiliki puisi {cite:shadharat-dhahab hlm. 535-536}."
