roles: [military, ruler]
gender: male
summary:
  ar: "أحمد بن إبراهيم بن كيغلغ، أبو العباس، من أمراء العصر العباسي تركي الأصل ولد ونشأ ببغداد وارتقى إلى القيادة، وولي دمشق والأردن ومصر مرتين وأصبهان، وذكره الثعالبي في اليتيمة شاعرا أديبا؛ نحو ٢٥٨ إلى ما بعد ٣٢٣هـ الموافقة نحو ٨٧٢ إلى ٩٣٥م."
  en: "Ahmad ibn Ibrahim ibn Kayghalagh, Abu al-Abbas, an emir of the Abbasid era of Turkish origin, born and raised in Baghdad, who rose to command, governed Damascus and Jordan, Egypt twice and Isfahan, and whom al-Tha'alibi names in al-Yatima as a poet and littérateur. About 258 to after 323 AH, about 872 to 935 CE."
  fr: "Ahmad ibn Ibrahim ibn Kayghalagh, Abu al-Abbas, émir abbasside d'origine turque, né et élevé à Bagdad, devenu commandant et gouverneur de Damas et de Jordanie, d'Égypte à deux reprises et d'Ispahan ; al-Tha'alibi le cite dans al-Yatima comme poète et lettré. D'environ 258 H à après 323 H, soit environ 872 à 935 ap. J.-C."
  es: "Ahmad ibn Ibrahim ibn Kayghalagh, Abu al-Abbas, emir de la era abasí de origen turco, nacido y criado en Bagdad, llegó a comandar y gobernar Damasco y Jordania, Egipto en dos ocasiones e Isfahán, y a quien al-Tha'alibi menciona en al-Yatima como poeta y literato. Vivió aproximadamente entre el 258 y después del 323 d. H., es decir, entre el 872 y el 935 d. C."
  ur: "احمد بن ابراہیم ابن کیغلاغ، ابو العباس، ترک نژاد عباسی دور کا ایک امیر، بغداد میں پیدا ہوا اور پرورش پائی، جس نے کمان سنبھالی، دمشق اور اردن، مصر اور اصفہان پر دو بار حکومت کی، اور جنہیں الثعلبی نے التمیمہ اور شاعر کے طور پر نام دیا ہے۔ تقریباً 258 سے 323 ہجری کے بعد تقریباً 872 سے 935 عیسوی تک۔"
  tr: "Abbasî döneminin prenslerinden biri olan, Türk kökenli Ahmed ibn İbrahim ibn Kayghalagh (Ebu el-Abbas), Bağdat'ta doğup büyüdü ve liderliğe yükseldi. Şam, Ürdün, Mısır (iki kez) ve İsfahan'ı yönetti. El-Salibi, El-Yatima'da onu şair ve yazar olarak anmıştır; yaklaşık 258 Hicri yılından 323 Hicri yılına kadar, yani yaklaşık 872-935 Miladi yılları arasında hüküm sürmüştür."
  id: "Ahmad ibn Ibrahim ibn Kayghalagh, Abu al-Abbas, salah satu pangeran pada era Abbasiyah, berasal dari Turki, lahir dan dibesarkan di Baghdad dan naik ke tampuk kepemimpinan. Ia memerintah Damaskus, Yordania, Mesir dua kali, dan Isfahan. Al-Tha’alibi menyebutnya dalam Al-Yatima sebagai penyair dan penulis; dari sekitar tahun 258 hingga setelah 323 H, yang setara dengan sekitar tahun 872 hingga 935 M."
