summary:
  ar: "أحمد بن إبراهيم بن كيغلغ، أبو العباس، من أمراء العصر العباسي تركي الأصل ولد ونشأ ببغداد وارتقى إلى القيادة، وولي دمشق والأردن ومصر مرتين وأصبهان، وذكره الثعالبي في اليتيمة شاعرا أديبا؛ نحو ٢٥٨ إلى ما بعد ٣٢٣هـ الموافقة نحو ٨٧٢ إلى ٩٣٥م."
  en: "Ahmad ibn Ibrahim ibn Kayghalagh, Abu al-Abbas, an emir of the Abbasid era of Turkish origin, born and raised in Baghdad, who rose to command, governed Damascus and Jordan, Egypt twice and Isfahan, and whom al-Tha'alibi names in al-Yatima as a poet and littérateur. About 258 to after 323 AH, about 872 to 935 CE."
