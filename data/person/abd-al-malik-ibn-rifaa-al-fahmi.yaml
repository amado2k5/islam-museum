gender: male
roles: [emir]
summary:
  ar: "أقره عمر بن عبد العزيز والياً على مصر، وذكر الكتاب نقلاً عن ابن تغري بردي أنه كان حسن السيرة عفيفاً عن الأموال، ثقة عادلاً بين الرعية، ثم عزله عمر في ربيع الأول سنة 99هـ دون ذكر السبب، وولى مكانه أيوب بن شرحبيل {cite:salabi-umayyad-state-2020 p.388}."
  en: "Umar ibn Abd al-Aziz confirmed him as governor of Egypt. The book, citing Ibn Taghri Birdi, says that he was of good conduct, abstained from wealth, and was trustworthy and just among his subjects. Then Umar removed him in Rabi' al-Awwal 99 without giving a reason, and appointed Ayyub ibn Sharahil in his place {cite:salabi-umayyad-state-2020 p.388}."
  fr: "Umar ibn Abd al-Aziz le confirma comme gouverneur d'Égypte. Le livre, citant Ibn Taghri Birdi, dit qu'il était de bonne conduite, s'abstenait des richesses, et était digne de confiance et juste envers ses sujets. Puis Umar le révoqua en rabi' al-awwal 99 sans en donner la raison, et nomma Ayyub ibn Sharahil à sa place {cite:salabi-umayyad-state-2020 p.388}."
  es: "Umar ibn Abd al-Aziz lo confirmó como gobernador de Egipto. El libro, citando a Ibn Taghri Birdi, afirma que era de buena conducta, se abstenía de las riquezas y era digno de confianza y justo con sus súbditos. Luego, Umar lo destituyó en Rabi' al-Awwal 99 sin dar ninguna razón y nombró en su lugar a Ayyub ibn Sharahil {cite:salabi-umayyad-state-2020 p.388}."
  ur: "عمر بن عبدالعزیز نے انہیں مصر کا گورنر مقرر کیا۔ کتاب میں ابن طغری بردی کا حوالہ دیتے ہوئے کہا گیا ہے کہ وہ اچھے اخلاق کے مالک تھے، مال سے پرہیز کرتے تھے اور اپنی رعایا میں امانت دار اور انصاف پسند تھے۔ پھر عمر نے ربیع الاول 99 میں بغیر وجہ بتائے انہیں ہٹا دیا اور ان کی جگہ ایوب بن شراحل کو مقرر کر دیا۔"
