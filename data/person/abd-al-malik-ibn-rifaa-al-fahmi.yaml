summary:
  ar: "أقره عمر بن عبد العزيز والياً على مصر، وذكر الكتاب نقلاً عن ابن تغري بردي أنه كان حسن السيرة عفيفاً عن الأموال، ثقة عادلاً بين الرعية، ثم عزله عمر في ربيع الأول سنة 99هـ دون ذكر السبب، وولى مكانه أيوب بن شرحبيل {cite:salabi-umayyad-state-2020 p.388}."
  en: "Umar ibn Abd al-Aziz confirmed him as governor of Egypt. The book, citing Ibn Taghri Birdi, says that he was of good conduct, abstained from wealth, and was trustworthy and just among his subjects. Then Umar removed him in Rabi' al-Awwal 99 without giving a reason, and appointed Ayyub ibn Sharahil in his place {cite:salabi-umayyad-state-2020 p.388}."
