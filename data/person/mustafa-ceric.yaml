summary:
  ar: "عالم بوسني كان رئيس العلماء والمفتي العام في البوسنة والهرسك (1993–2012). وُلد سنة 1952 في فيليكو تشاينو قرب فيسوكو، وتخرج في مدرسة الغازي خسرو بك بسراييفو ثم في الأزهر (1978)، وعمل إمامًا في شيكاغو حيث نال الدكتوراه من جامعة شيكاغو (1986) برسالة في لاهوت أبي منصور الماتريدي. شارك في تأسيس الأكاديمية البوسنية للعلوم والفنون (2011) والمؤتمر البوسني العالمي (2012) ويرأسه، ونال جائزة اليونسكو للسلام سنة 2003."
  en: "Bosnian scholar who served as Grand Mufti (Reis-ul-ulema) of Bosnia and Herzegovina from 1993 to 2012. Born in 1952 at Veliko Čajno near Visoko, he graduated from the Gazi Husrev-beg Madrasa in Sarajevo and from Al-Azhar (1978), and served as an imam in Chicago, where he took his PhD at the University of Chicago (1986) with a dissertation on the theology of Abu Mansur al-Maturidi. He co-founded the Bosniak Academy of Sciences and Arts (2011) and the World Bosniak Congress (2012), which he presides over, and co-received the UNESCO Félix Houphouët-Boigny Peace Prize in 2003."
  ur: "بوسنیائی عالم، جو بوسنیا و ہرزیگووینا کے رئیس العلماء اور مفتیِ اعظم رہے (1993–2012ء)۔ 1952ء میں ویسوکو کے قریب ویلیکو چائنو میں پیدا ہوئے، سرائیوو کی غازی خسرو بیگ مدرسہ اور الازہر (1978ء) سے فارغ التحصیل ہوئے، اور شکاگو میں امام رہے جہاں یونیورسٹی آف شکاگو سے ابو منصور ماتریدی کے الٰہیات پر مقالے کے ساتھ پی ایچ ڈی کی (1986ء)۔ انہوں نے بوسنیائی اکیڈمی آف سائنسز اینڈ آرٹس (2011ء) اور ورلڈ بوسنیائی کانگریس (2012ء) کی تاسیس میں حصہ لیا اور اس کے صدر ہیں، اور 2003ء میں یونیسکو کا امن انعام پایا۔"
