summary:
  ar: "قيس بن الملوح، لقيه أبو الهياج بن سابق النجدي في فلاة بني عامر فكان يفر منه كما تفر الوحش حتى أنس وأنشده قيس بن ذريح فبكى وقال أنا والله أشعر منه وأنشأ أبى القلب إلا حبها عامرية لها كنية عمرو وليس لها عمرو، وكان أبوه وأهله قوماً أبراراً به يوضع له الطعام والثياب بحيث يراها {cite:muruj-al-dhahab p. 540-541}."
  en: "Qays ibn al-Mulawwah met alive in the 'Amir wastes — 'I am the better poet' he said, then recited his Layla verse {cite:muruj-al-dhahab p. 540-541}."
