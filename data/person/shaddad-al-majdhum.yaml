summary:
  ar: "شداد المجذوم، العابد المشهور المذكور في الراضين من العباد. أصابه الجذام بالبصرة، فلما عاده أصحاب الحسن قال: ما فاتني حزبي من الليل منذ سقطتُ، وما بي إلا أني لا أقدر على حضور صلاة الجماعة."
  en: "Shaddad al-Majdhum, a famous worshipper named among those content with God; leprosy struck him in Basra, and when companions of al-Hasan visited him he said: I have not missed my night portion since I fell ill, and my only trouble is that I cannot attend the congregational prayer."
  ur: "شداد مجذوم عبادت گزار تھے، جو اللہ سے راضی رہنے والے بندوں میں مشہور اور ذکر کیے جاتے ہیں۔ بصرہ میں انہیں کوڑھ ہو گیا، تو حسن بصری کے ساتھیوں نے عیادت کی۔ انہوں نے کہا: بیماری کے بعد سے میری رات کا وظیفہ نہیں چھوٹا، اور مجھے بس یہ تکلیف ہے کہ جماعت کی نماز میں حاضر نہیں ہو سکتا۔"
