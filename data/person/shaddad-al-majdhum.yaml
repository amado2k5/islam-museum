summary:
  ar: "شداد المجذوم، العابد المشهور المذكور في الراضين من العباد. أصابه الجذام بالبصرة، فلما عاده أصحاب الحسن قال: ما فاتني حزبي من الليل منذ سقطتُ، وما بي إلا أني لا أقدر على حضور صلاة الجماعة."
  en: "Shaddad al-Majdhum, a famous worshipper named among those content with God; leprosy struck him in Basra, and when companions of al-Hasan visited him he said: I have not missed my night portion since I fell ill, and my only trouble is that I cannot attend the congregational prayer."
  ur: "شداد مجذوم عبادت گزار تھے، جو اللہ سے راضی رہنے والے بندوں میں مشہور اور ذکر کیے جاتے ہیں۔ بصرہ میں انہیں کوڑھ ہو گیا، تو حسن بصری کے ساتھیوں نے عیادت کی۔ انہوں نے کہا: بیماری کے بعد سے میری رات کا وظیفہ نہیں چھوٹا، اور مجھے بس یہ تکلیف ہے کہ جماعت کی نماز میں حاضر نہیں ہو سکتا۔"
  es: "Shaddad al-Majdhum, un famoso devoto considerado entre los que están contentos con Dios, contrajo lepra en Basora, y cuando los compañeros de al-Hasan lo visitaron, dijo: No he faltado a mi porción nocturna desde que enfermé, y mi único problema es que no puedo asistir a la oración en congregación."
  fr: "Shaddad al-Majdhum, un célèbre adorateur cité parmi ceux qui se contentent de Dieu, fut frappé par la lèpre à Bassora, et lorsque des compagnons d'al-Hasan lui rendirent visite, il dit: « Je n'ai pas manqué ma prière de nuit depuis que je suis tombé malade, et mon seul souci est que je ne peux pas assister à la prière en congrégation. »"
  tr: "Hizmetçiler arasında Memnun olanlar arasında adı geçen ünlü ibadet eden Shaddad al-Majdhum. Basra'da cüzzam hastalığına yakalandı ve el-Hasan'ın sahabeleri ona döndüğünde şöyle dedi: Düştüğümden beri gece partimi kaçırmadım ve cemaat namazına katılamaktan başka bir şeyim yok."
  id: "Shaddad al-Majdhum, pemuja terkenal yang disebut di antara para pelayan yang puas. Ia menderita kusta di Basra, dan ketika para sahabat al-Hasan kembali kepadanya, ia berkata: Aku tidak pernah melewatkan pestaku di malam hari sejak aku jatuh, dan aku tidak punya apa-apa selain tidak bisa menghadiri doa berjamaah."
