  es: "Jurista y teólogo turco, nacido en 1934 en Çorum. Profesor de fiqh en la Facultad de Teología de la Universidad de Marmara hasta 2001 y una de las principales referencias contemporáneas en derecho islámico en Turquía; columnista de larga trayectoria en Yeni Şafak."
