summary:
  ar: "المحدث الحنبلي النابلسي الدمشقي؛ ارتحل في طلب الحديث إلى الأمصار فسمع بمكة من ابن الحصري وبمصر من البوصيري والأرتاحي والحافظ عبد الغني، وببغداد من المبارك بن كليب وابن الجوزي، وبأصبهان من أبي المكارم اللبان، وبخراسان من عبد المنعم الفراوي والمؤيد الطوسي، وبنيسابور من أبي سعد الصفار، وبحران من الحافظ عبد القادر الرهاوي وانقطع إليه مدة؛ قال عمر بن الحاجب كان عبداً صالحاً صاحب كرامات ذا مروءة مع فقر مدقع، روي عنه الحافظ الضياء والمنذري والبرزالي والقاضي سليمان بن حمزة {cite:shadharat-dhahab p. 203-204}."
  en: "Abu al-Tahir al-Mundhiri (b. 574 Damascus, d. 4 Shawwal 639 below Qasyun) — the Hanbali whose rihla ran Mecca to Nishapur, long-companion of Abd al-Qadir al-Rahawi at Harran; Ibn al-Hajib: 'a man of karamat and muru'a amid utter poverty' {cite:shadharat-dhahab p. 203-204}."
