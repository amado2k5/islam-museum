summary:
  ar: "المحدث الحنبلي النابلسي الدمشقي؛ ارتحل في طلب الحديث إلى الأمصار فسمع بمكة من ابن الحصري وبمصر من البوصيري والأرتاحي والحافظ عبد الغني، وببغداد من المبارك بن كليب وابن الجوزي، وبأصبهان من أبي المكارم اللبان، وبخراسان من عبد المنعم الفراوي والمؤيد الطوسي، وبنيسابور من أبي سعد الصفار، وبحران من الحافظ عبد القادر الرهاوي وانقطع إليه مدة؛ قال عمر بن الحاجب كان عبداً صالحاً صاحب كرامات ذا مروءة مع فقر مدقع، روي عنه الحافظ الضياء والمنذري والبرزالي والقاضي سليمان بن حمزة {cite:shadharat-dhahab p. 203-204}."
  en: "Abu al-Tahir al-Mundhiri (b. 574 Damascus, d. 4 Shawwal 639 below Qasyun) — the Hanbali whose rihla ran Mecca to Nishapur, long-companion of Abd al-Qadir al-Rahawi at Harran; Ibn al-Hajib: 'a man of karamat and muru'a amid utter poverty' {cite:shadharat-dhahab p. 203-204}."
  fr: "Abu al-Tahir al-Mundhiri (né 574 Damas, décédé 4 Shawwal 639 sous Qasyun) – le Hanbali dont le rihla courait de La Mecque à Nichapour, long compagnon d’Abd al-Qadir al-Rahawi à Harran  ; Ibn al-Hajib  : « un homme de karamat et de murou’a au milieu d’une pauvreté totale  » {cite:shadharat-dhahab p. 203-204}."
  es: "Abu al-Tahir al-Mundhiri (n. 574 Damasco, m. 4 Shawwal 639 debajo de Qasyun): el hanbali cuya rihla corrió desde La Meca hasta Nishapur, compañero de larga data de Abd al-Qadir al-Rahawi en Harran; Ibn al-Hajib: 'un hombre de karamat y muru'a en medio de la pobreza absoluta' {cita: shadharat-dhahab p. 203-204}."
  ur: "ابو الطاہر المنذری ⁦(وفات: 574 دمشق، وفات: 4 شوال 639 ذیل قصیون)⁩ - حنبلی جن کا رحلہ مکہ سے نیشاپور تک چلا گیا، حران میں عبد القادر الرحاوی کے دیرینہ ساتھی تھے۔ ابن الحاجب: 'ایک شخص کرامت اور مرعوبیت کے درمیان'۔ 203-204}۔"
