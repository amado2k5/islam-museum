id: person/taj-al-din-yildiz
class: person
label: { ar: "تاج الدين الدز" }
summary:
  ar: "تاج الدين الدز من أول مماليك شهاب الدين الغوري وأكبرهم محلاً عنده بحيث كان أهل شهاب الدين يخدمونه، صاحب كرمان التي بين غزنة ولهاور؛ لما قتل مولاه سنة اثنتين وستمائة خرج يستقبل المحفة فقبّل الأرض على عادته في حياته ثم كشف عنه فلما رآه ميتاً مزق ثيابه وصاح وبكى فأبكى الناس وكان يوماً مشهوداً، وطمع أن يملك غزنة فتسلم خزانة شهاب الدين من الوزير مؤيد الملك بميل الأتراك إليه وادعى أن غياث الدين محمود بن غياث الدين أخا شهاب الدين جعله نائبه فيها {cite:kamil-ibn-al-athir p. 304-305}."
  tr: "Taceddin el-Diz, Şihabeddin el-Guri'nin ilk Memlüklerinden biri ve bölgesinin en büyüğüydü; çünkü Şihabdin halkı ona hizmet ediyordu. Gazni ile Hawr arasında yer alan Kerman'ın hükümdarıydı. Efendisi 602 Hicri yılında öldürüldüğünde, avluyu karşılamaya çıktı, hayatında olduğu gibi toprağı öptü ve sonra onu ortaya çıkardı. Onu ölü görünce kıyafetlerini yırttı, ağladı ve ağladı. Unutulmaz bir gündü. Gazna'yı yönetmeyi umuyordu, bu yüzden Türklerin ona olan eğilimiyle vezir Mu'eyyad al-Mulk'ten Şihab al-Din'in hazinesini devraldı. Ghiyath al-Din Mahmud bin Giyath al-Din'in, Şihab al-Din'in kardeşi, onu oraya vekili olarak atadığını iddia etti {alıntı:) Kamil-ibn-al-Athir s. 304-305}."
  id: "Taj al-Din al-Diz adalah salah satu Mamluk pertama Shihab al-Din al-Ghuri dan yang terbesar di wilayahnya, karena orang-orang Shihab al-Din melayaninya. Dia adalah penguasa Kerman, yang terletak di antara Ghazni dan Hawr. Ketika gurunya dibunuh pada tahun 602 H, dia keluar untuk menerima halaman itu, mencium tanah seperti kebiasaannya dalam hidupnya, lalu membuka penutupnya. Ketika melihat dia mati, dia merobek pakaiannya, menangis, dan menangis. Hari itu adalah hari yang tak terlupakan. Dia berharap memerintah Ghazna, sehingga dia mengambil alih harta Shihab al-Din dari wazir Mu'ayyad al-Mulk dengan kecenderungan orang Turki terhadapnya. Dia mengklaim bahwa Ghiyath al-Din Mahmoud ibn Ghiyath al-Din, saudara Shihab al-Din, mengangkatnya sebagai wakilnya di sana {cite:Kamil-ibn-al-Athir hlm. 304-305}."
