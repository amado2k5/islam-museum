summary:
  ar: "تاج الدين الدز من أول مماليك شهاب الدين الغوري وأكبرهم محلاً عنده بحيث كان أهل شهاب الدين يخدمونه، صاحب كرمان التي بين غزنة ولهاور؛ لما قتل مولاه سنة اثنتين وستمائة خرج يستقبل المحفة فقبّل الأرض على عادته في حياته ثم كشف عنه فلما رآه ميتاً مزق ثيابه وصاح وبكى فأبكى الناس وكان يوماً مشهوداً، وطمع أن يملك غزنة فتسلم خزانة شهاب الدين من الوزير مؤيد الملك بميل الأتراك إليه وادعى أن غياث الدين محمود بن غياث الدين أخا شهاب الدين جعله نائبه فيها {cite:kamil-ibn-al-athir p. 304-305}."
