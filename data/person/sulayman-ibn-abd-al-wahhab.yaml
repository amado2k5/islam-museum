summary:
  ar: "سليمان بن عبد الوهاب بن سليمان التميمي النجدي، أخو الشيخ محمد بن عبد الوهاب، يذكر الزركلي أنه عارض أخاه في الدعوة وكتب رسائل في ذلك ثم عاد وأظهر الندم، وتوفي نحو سنة 1210 هـ."
  en: "Sulayman ibn Abd al-Wahhab ibn Sulayman al-Tamimi al-Najdi, brother of Shaykh Muhammad ibn Abd al-Wahhab; al-Zirikli says he opposed his brother's call and wrote treatises on it, then returned and expressed regret; died about 1210 AH (about 1795)."
  es: "Sulayman ibn Abd al-Wahhab ibn Sulayman al-Tamimi al-Najdi, hermano del jeque Muhammad ibn Abd al-Wahhab; al-Zirikli dice que se opuso al llamado de su hermano y escribió tratados al respecto, luego regresó y expresó su arrepentimiento; murió alrededor del año 1210 AH (alrededor de 1795)."
  fr: "Sulayman ibn Abd al-Wahhab ibn Sulayman al-Tamimi al-Najdi, frère du cheikh Muhammad ibn Abd al-Wahhab; al-Zirikli dit qu'il s'est opposé à l'appel de son frère et a écrit des traités à ce sujet, puis est revenu et a exprimé des regrets; est mort vers 1210 AH (environ 1795)."
  ur: "سلیمان بن عبد الوہاب ابن سلیمان تمیمی النجدی، شیخ محمد بن عبد الوہاب کے بھائی؛ الزرکلی کہتے ہیں کہ اس نے اپنے بھائی کی دعوت کی مخالفت کی اور اس پر مقالے لکھے، پھر واپس آکر افسوس کا اظہار کیا۔ وفات 1210ھ ⁦(تقریباً 1795ء)⁩۔"
  tr: "Şeyh Muhammed bin Abdül-Vahhab'ın kardeşi Süleyman el-Temimi el-Necdi, çağrıda kardeşine karşı çıktığını, bu konuda mektuplar yazdığını, sonra geri dönüp pişmanlık gösterdiğini ve yaklaşık 1210 Hicri yılında öldüğünü belirtir."
  id: "Sulayman ibn Abd al-Wahhab ibn Suleiman al-Tamimi al-Najdi, saudara Sheikh Muhammad ibn Abd al-Wahhab, menyebutkan bahwa ia menentang saudaranya dalam panggilan itu dan menulis surat tentang hal itu, lalu kembali dan menunjukkan penyesalan, dan meninggal sekitar tahun 1210 H."
