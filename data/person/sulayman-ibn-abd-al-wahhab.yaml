summary:
  ar: "سليمان بن عبد الوهاب بن سليمان التميمي النجدي، أخو الشيخ محمد بن عبد الوهاب، يذكر الزركلي أنه عارض أخاه في الدعوة وكتب رسائل في ذلك ثم عاد وأظهر الندم، وتوفي نحو سنة 1210 هـ."
  en: "Sulayman ibn Abd al-Wahhab ibn Sulayman al-Tamimi al-Najdi, brother of Shaykh Muhammad ibn Abd al-Wahhab; al-Zirikli says he opposed his brother's call and wrote treatises on it, then returned and expressed regret; died about 1210 AH (about 1795)."
  es: "Sulayman ibn Abd al-Wahhab ibn Sulayman al-Tamimi al-Najdi, hermano del jeque Muhammad ibn Abd al-Wahhab; al-Zirikli dice que se opuso al llamado de su hermano y escribió tratados al respecto, luego regresó y expresó su arrepentimiento; murió alrededor del año 1210 AH (alrededor de 1795)."
