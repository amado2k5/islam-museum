summary:
  ar: "تاج الدولة جعفر بن ثقة الدولة يوسف بن عبد الله الكلبي صاحب صقلية؛ كان أديباً شاعراً، وله الأبيات السائرة في غلامين على أحدهما ثوب ديباج أحمر وعلى الآخر ثوب ديباج أسود: «أرى بدرين قد طلعا على غصنين في نسقر وفي ثوبين قد صبغا صباغ الحد والحدق»، وكان عمله لهذه الأبيات سنة سبع وعشرين وخمسمائة {cite:wafayat-ayan}."
  en: "Taj al-Dawla Ja'far — son of the Kalbid emir of Sicily; poet-prince remembered for the two youths in red and black satin verse (527) {cite:wafayat-ayan}."
