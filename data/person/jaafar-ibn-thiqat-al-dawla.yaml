label: { ar: "جعفر بن ثقة الدولة", en: "Ja'far ibn Thiqat al-Dawla", es: "Ja'far ibn Thiqat al-Dawla", fr: "Ja'far ibn Thiqat al-Dawla", ur: "جعفر بن ثابت الدولہ" }
summary:
  ar: "تاج الدولة جعفر بن ثقة الدولة يوسف بن عبد الله الكلبي صاحب صقلية؛ كان أديباً شاعراً، وله الأبيات السائرة في غلامين على أحدهما ثوب ديباج أحمر وعلى الآخر ثوب ديباج أسود: «أرى بدرين قد طلعا على غصنين في نسقر وفي ثوبين قد صبغا صباغ الحد والحدق»، وكان عمله لهذه الأبيات سنة سبع وعشرين وخمسمائة {cite:wafayat-ayan}."
  en: "Taj al-Dawla Ja'far — son of the Kalbid emir of Sicily; poet-prince remembered for the two youths in red and black satin verse (527) {cite:wafayat-ayan}."
  es: "Taj al-Dawla Ja'far — hijo del emir Kalbid de Sicilia; príncipe poeta recordado por los dos jóvenes en verso de satén rojo y negro (527) {cite:wafayat-ayan}."
  fr: "Taj al-Dawla Ja'far — fils de l'émir Kalbid de Sicile; prince-poète dont on se souvient pour les deux jeunes gens en vers de satin rouge et noir (527) {cite:wafayat-ayan}."
  ur: "تاج الدولہ جعفر - سسلی کے کالبیڈ امیر کا بیٹا؛ شاعر شہزادے کو سرخ اور سیاہ ساٹن آیت (527) میں دو نوجوانوں کے لئے یاد کیا گیا"
  tr: "Tac al-Dawla Ja'far ibn Thiqa al-Dawla Yusuf ibn Abdullah al-Kalbi, Sicilya'nın hükümdarı; edebi bir figür ve şairdi. En sık yazdığı dizeleri iki genç hakkında yazdı; biri kırmızı brokar giysi, diğeri siyah brokar giysiler giymişti: \"Naskar'da iki dalda iki ağaç görüyorum, ve iki giysi ile sınır ile daqın boyasıyla boyanmış iki giysi giysiyle.\" Bu dizeler üzerine yaptığı çalışmalar 527 Hicri yılındadır."
  id: "Taj al-Dawla Ja'far ibn Thiqa al-Dawla Yusuf ibn Abdullah al-Kalbi, penguasa Sisilia; ia adalah tokoh sastra dan penyair. Ia menulis bait paling sering tentang dua pemuda, satu mengenakan pakaian brokat merah dan yang lain brokat hitam: \"Aku melihat dua pohon di dua cabang di Nasqar, dan dua pakaian yang diwarnai dengan pewarna dari batas dan daqq.\" Karyanya pada ayat-ayat ini adalah pada tahun 527 H."
