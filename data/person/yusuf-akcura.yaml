summary:
  ar: "مؤرخ وكاتب وسياسي تاتاري (1876–1935)، وُلد في سيمبيرسك وتوفي في إسطنبول. غدت رسالته «أوضاع السياسة الثلاثة» (1904) نصًا مؤسسًا للقومية التركية؛ وشارك في تأسيس جمعية «الوطن التركي» ومجلتها، وكان نائبًا عن إسطنبول ثم قارص في مجلس الأمة التركي، ورئيسًا للجمعية التاريخية التركية منذ 1932."
  en: "Tatar historian, writer and politician (1876–1935), born at Simbirsk and died at Istanbul. His 1904 essay Üç Tarz-ı Siyaset (Three Types of Policy) became a founding text of Turkish nationalism; he co-founded the Türk Yurdu association and its journal, sat in the Turkish Grand National Assembly for Istanbul and then Kars, and presided over the Turkish Historical Society from 1932."
  ur: "تاتار مورخ، مصنف اور سیاست دان (1876–1935)، جو سمبرسک میں پیدا ہوئے اور استنبول میں وفات پائے۔ ان کا مضمون «اوچ طرزِ سیاست» (1904) ترک قوم پرستی کی بنیادی تحریروں میں شمار ہوتا ہے؛ انہوں نے «ترک یوردو» انجمن اور اس کے رسالے کی بنیاد میں حصہ لیا، ترک مجلسِ امت میں استنبول اور پھر قارص کے نائب رہے، اور 1932 سے ترک تاریخی انجمن کے صدر رہے۔"
  es: "Historiador, escritor y político tártaro (1876-1935), nacido en Simbirsk y fallecido en Estambul. Su ensayo de 1904, Üç Tarz-ı Siyaset (Tres tipos de política), se convirtió en un texto fundacional del nacionalismo turco; cofundó la asociación Türk Yurdu y su revista, fue miembro de la Gran Asamblea Nacional Turca por Estambul y luego por Kars, y presidió la Sociedad Histórica Turca desde 1932."
  fr: "Historien, écrivain et homme politique tatar (1876-1935), né à Simbirsk et mort à Istanbul. Son essai de 1904, Üç Tarz-ı Siyaset (Trois types de politique), est devenu un texte fondateur du nationalisme turc; il a cofondé l’association Türk Yurdu et sa revue, a siégé à la Grande Assemblée nationale turque pour Istanbul puis Kars, et a présidé la Société historique turque à partir de 1932."
  tr: "Tatar tarihçi, yazar ve siyasetçi (1876–1935), Sempirsk'te doğmuş ve İstanbul'da vefat etmiştir. \"Üç Siyasi Devlet\" (1904) adlı eseri Türk milliyetçiliğinin kurucu metni olmuştur; Türk Vatan Derneği ve dergisinin kuruluşunda yer almış, İstanbul milletvekili olarak görev yapmış, ardından Türk Ulusal Meclisi üyesi ve 1932'den itibaren Türk Tarih Derneği başkanı olmuştur."
  id: "Seorang sejarawan, penulis, dan politisi Tatar (1876–1935), lahir di Sempirsk dan meninggal di Istanbul. Risalahnya \"Tiga Negara Politik\" (1904) menjadi teks pendiri nasionalisme Turki; ia berpartisipasi dalam pendirian Asosiasi Tanah Air Turki dan majalahnya, menjabat sebagai deputi untuk Istanbul dan kemudian anggota Majelis Nasional Turki, serta presiden Perhimpunan Sejarah Turki sejak 1932."
