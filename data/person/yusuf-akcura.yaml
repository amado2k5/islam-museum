summary:
  ar: "مؤرخ وكاتب وسياسي تاتاري (1876–1935)، وُلد في سيمبيرسك وتوفي في إسطنبول. غدت رسالته «أوضاع السياسة الثلاثة» (1904) نصًا مؤسسًا للقومية التركية؛ وشارك في تأسيس جمعية «الوطن التركي» ومجلتها، وكان نائبًا عن إسطنبول ثم قارص في مجلس الأمة التركي، ورئيسًا للجمعية التاريخية التركية منذ 1932."
  en: "Tatar historian, writer and politician (1876–1935), born at Simbirsk and died at Istanbul. His 1904 essay Üç Tarz-ı Siyaset (Three Types of Policy) became a founding text of Turkish nationalism; he co-founded the Türk Yurdu association and its journal, sat in the Turkish Grand National Assembly for Istanbul and then Kars, and presided over the Turkish Historical Society from 1932."
  ur: "تاتار مورخ، مصنف اور سیاست دان (1876–1935)، جو سمبرسک میں پیدا ہوئے اور استنبول میں وفات پائے۔ ان کا مضمون «اوچ طرزِ سیاست» (1904) ترک قوم پرستی کی بنیادی تحریروں میں شمار ہوتا ہے؛ انہوں نے «ترک یوردو» انجمن اور اس کے رسالے کی بنیاد میں حصہ لیا، ترک مجلسِ امت میں استنبول اور پھر قارص کے نائب رہے، اور 1932 سے ترک تاریخی انجمن کے صدر رہے۔"
