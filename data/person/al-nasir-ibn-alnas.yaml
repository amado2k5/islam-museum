label:
  ar: الناصر بن علناس الحمادي
  en: al-Nasir ibn Alnas al-Hammadi
summary:
  ar: "الناصر بن علناس الحمادي، أعظم ملوك آل حماد؛ ملك القلعة وبجاية واستولى على إفريقية فأخرج ولد المعز بن باديس منها واتصلت له القيروان والمهدية، وبنى بالقيروان منزله المعروف بالناصرية واستمال العلماء والصلحاء ومال عن مذهب الشيعة إلى مذاهب أهل السنة فخطب للخليفة العباسي وأمضى سنته في العدل، وكان له فضل ابن جحاف قاضي بلنسية فأكرمه حين قدم عليه، ثم حارب العرب الهلالية وقوي أمره حتى صار ملك إفريقية والمغرب الأوسط جميعاً."
  en: "al-Nasir ibn Alnas al-Hammadi, greatest of the Hammadid kings; master of the Qal'a and Bijaya who seized Ifriqiya itself from al-Mu'izz ibn Badis's heirs and held Qayrawan and Mahdiyya — he built his Qayrawan residence the Nasiriyya, courted scholars, turned from Shi'ism to the Sunni creed and had the Abbasid caliph named in the khutba, and warred the Hilali Arabs until his rule embraced all of Ifriqiya and the Middle Maghreb."
