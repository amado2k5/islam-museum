label:
  ar: الناصر بن علناس الحمادي
  en: al-Nasir ibn Alnas al-Hammadi
  fr: "al-Nasir ibn Alnas al-Hammadi"
  es: "al-Nasir ibn Alnas al-Hammadi"
summary:
  ar: "الناصر بن علناس الحمادي، أعظم ملوك آل حماد؛ ملك القلعة وبجاية واستولى على إفريقية فأخرج ولد المعز بن باديس منها واتصلت له القيروان والمهدية، وبنى بالقيروان منزله المعروف بالناصرية واستمال العلماء والصلحاء ومال عن مذهب الشيعة إلى مذاهب أهل السنة فخطب للخليفة العباسي وأمضى سنته في العدل، وكان له فضل ابن جحاف قاضي بلنسية فأكرمه حين قدم عليه، ثم حارب العرب الهلالية وقوي أمره حتى صار ملك إفريقية والمغرب الأوسط جميعاً."
  en: "al-Nasir ibn Alnas al-Hammadi, greatest of the Hammadid kings; master of the Qal'a and Bijaya who seized Ifriqiya itself from al-Mu'izz ibn Badis's heirs and held Qayrawan and Mahdiyya — he built his Qayrawan residence the Nasiriyya, courted scholars, turned from Shi'ism to the Sunni creed and had the Abbasid caliph named in the khutba, and warred the Hilali Arabs until his rule embraced all of Ifriqiya and the Middle Maghreb."
  fr: "al-Nasir ibn Alnas al-Hammadi, le plus grand des rois Hammadides  ; maître des Qal'a et des Bijaya qui s'empara de l'Ifriqiya elle-même des héritiers d'al-Mu'izz ibn Badis et détenait Qayrawan et Mahdiyya - il construisit sa résidence Qayrawan la Nasiriyya, des savants courtisés et a fait la guerre aux Arabes Hilali jusqu'à ce que son règne embrasse tout l'Ifriqiya et le Moyen- Maghreb."
  es: "al-Nasir ibn Alnas al-Hammadi, el más grande de los reyes hammadid; maestro de Qal'a y Bijaya que arrebató la propia Ifriqiya a los herederos de al-Mu'izz ibn Badis y retuvo Qayrawan y Mahdiyya; construyó su residencia en Qayrawan, Nasiriyya, cortejó a eruditos, se volvió del credo chií al sunita e hizo nombrar al califa abasí en la khutba, y luchó contra los árabes hilali hasta que su gobierno abarcó toda Ifriqiya y el Oriente Medio. Magreb."
