summary:
  ar: "علي بن ثابت، كان من العمال، وكان يحث المريدين على رفض الأثقال ونبذ الأشغال. قال لهم: إن استطعت أن لا تكون في كلا العمرين بمنزلة واحدة فافعل."
  en: "Ali ibn Thabit, a worker, who urged those who sought God to shed heavy burdens and cast aside preoccupations; he said: if you can, do not be on the same footing in both lives."
  ur: "علی بن ثابت محنت کش تھے اور مریدوں کو بوجھ اتار پھینکنے اور مشغولیات چھوڑنے کی ترغیب دیتے تھے۔ کہا: اگر ہو سکے تو دونوں زندگیوں میں ایک ہی درجے پر نہ رہو۔"
  es: "Ali ibn Thabit, un trabajador, exhortó a quienes buscaban a Dios a deshacerse de las cargas pesadas y dejar de lado las preocupaciones; dijo: si podéis, no estéis en el mismo plano en ambas vidas."
  fr: "Ali ibn Thabit, un travailleur, exhortait ceux qui cherchaient Dieu à se délester de leurs lourds fardeaux et à se débarrasser de leurs préoccupations; il disait: si vous le pouvez, ne soyez pas sur un pied d'égalité dans les deux vies."
  tr: "Ali ibn Tabit işçiler arasındaydı ve öğrencilerine ağır görevleri reddetmelerini ve işi bırakmalarını öğütledi. Onlara şöyle dedi: Eğer yapabiliyorsanız, her iki çağda da eşit olmayın, o zaman yapın."
  id: "Ali ibn Thabit termasuk di antara para pekerja dan mendesak murid-muridnya untuk menolak tugas berat dan meninggalkan pekerjaan. Ia berkata kepada mereka: Jika kalian bisa, jangan setara di kedua zaman, maka lakukanlah."
