summary:
  ar: "ماهويه مرزبان مرو؛ قدم على علي بن أبي طالب في خلافته وهو بالكوفة فكتب له إلى الدهاقين والأساورة والدهشلارين أن يؤدوا إليه الجزية فانتقضت عليهم خراسان."
  en: "Mahwiya, marzban of Marw; he came to Ali at Kufa and carried back the caliph's letters to the dahqans, asawira and dahshalarin for the jizya — and Khurasan broke away."
  es: "Mahwiya, marzban de Marw; fue a ver a Ali en Kufa y llevó las cartas del califa a los dahqans, asawira y dahshalarin para el pago de la jizya, y Jorasán se separó."
  fr: "Mahwiya, marzban de Marw; il vint trouver Ali à Kufa et rapporta les lettres du calife aux dahqans, asawira et dahshalarin pour la jizya — et le Khorasan fit sécession."
  ur: "مہویہ، مرو کے مرزبان؛ وہ کوفہ میں علی کے پاس آیا اور جزیہ کے لیے خلیفہ کے خطوط دہقان، عسویرہ اور دہشالرین کو واپس لے گئے اور خراسان ٹوٹ گیا۔"
  tr: "Marw'lı Mahuwayh Marzban; Halifeliği sırasında Kufa'dayken Ali bin Ebi Talib'in yanına geldi ve ona Dahaqlar, Asawra ve Dahshlarin'e cizye ödemesi için mektup yazdı; Horasan onlara karşı isyan etti."
  id: "Mahuwayh Marzban dari Marw; ia datang kepada Ali ibn Abi Talib selama masa khalifah dan berada di Kufa dan menulis surat kepadanya kepada para Dahaq, Asawra, dan Dahshlarin untuk membayar jizya, dan Khorasan memberontak melawan mereka."
