label: { ar: "قسّام الحارثي", en: "Qassam al-Harithi", es: "Qassam al-Harithi", fr: "Qassam al-Harithi", ur: "قسام الحارثی۔" }
summary:
  ar: "قسّام الحارثي من أهل بَلغينا بجبل سنّبر؛ كان راعياً ثم تنقلت الأحوال به فصار مقدم الأحداث والشباب بدمشق وكثرت أعوانه حتى غلب على دمشق ولم يبق للنائب معه أمر؛ فسار إليه جيش من مصر لقصده ولمحاربته فضعف أمره واختفى ثم استأمن فقُيّدوه وبُعث إلى مصر سنة ست وسبعين وثلاثمائة فعُفي عنه وخمل أمره {cite:shadharat-dhahab p. 87}."
  en: "Qassam al-Harithi — a shepherd from Balghina on Jabal Sanbar who rose to lead the young men of Damascus until he took the city outright; an army came from Egypt, his cause collapsed, he hid, then took safe-conduct, was chained and shipped to Egypt in 376 — and pardoned {cite:shadharat-dhahab p. 87}."
  es: "Qassam al-Harithi — un pastor de Balghina en Jabal Sanbar que llegó a liderar a los jóvenes de Damasco hasta que tomó la ciudad por completo; un ejército llegó de Egipto, su causa se derrumbó, se escondió, luego obtuvo un salvoconducto, fue encadenado y enviado a Egipto en 376 — y perdonado {cite:shadharat-dhahab p. 87}."
  fr: "Qassam al-Harithi — un berger de Balghina sur Jabal Sanbar qui s'est élevé pour diriger les jeunes hommes de Damas jusqu'à prendre la ville; une armée est venue d'Égypte, sa cause s'est effondrée, il s'est caché, puis a obtenu un sauf-conduit, a été enchaîné et expédié en Égypte en 376 — et gracié {cite:shadharat-dhahab p. 87}."
  ur: "قسام الحارثی - جبل صنبر پر بلغینہ کا ایک چرواہا جو دمشق کے جوانوں کی رہنمائی کے لیے اٹھ کھڑا ہوا یہاں تک کہ اس نے شہر کو مکمل طور پر لے لیا۔ مصر سے ایک لشکر آیا، اس کا مقصد ختم ہو گیا، وہ چھپ گیا، پھر حفاظت سے کام لیا، زنجیروں میں جکڑا گیا اور 376 میں مصر بھیج دیا گیا- اور معاف کر دیا گیا۔ 87}۔"
  tr: "Kassam al-Harthi, Cebel Sanbar'daki Balghina halkından geliyordu; çobandı, ancak koşullar değişti ve Şam'daki gençlik ve olayların önde gelen figürü oldu. Destekçileri arttı, sonunda Şam'ı ele geçirdi ve yardımcısına gitmedi. Mısır'dan bir ordu ona karşı yürüdü, ancak durumu zayıfladı ve ortadan kayboldu. Daha sonra güvenliğini sağladı, tutuklandı ve 376 Hicri yılında Mısır'a gönderildi, burada affedildi ve işleri geçersiz hale geldi {atıf:shadharat-dhahab, s. 87}."
  id: "Qassam al-Harthi berasal dari masyarakat Balghina di Jabal Sanbar; ia adalah seorang gembala, tetapi keadaan berubah dan ia menjadi tokoh utama dalam kalangan pemuda dan peristiwa di Damaskus. Para pendukungnya bertambah hingga ia menaklukkan Damaskus dan meninggalkan segala urusan untuk wakilnya. Pasukan dari Mesir berjalan ke arahnya untuk melawannya, tetapi keadaannya melemah dan ia menghilang. Ia kemudian mengamankan keselamatan, ditangkap, dan dikirim ke Mesir pada tahun 376 H, di mana ia diampuni dan urusannya menjadi batal {cite:shadharat-dhahab, hlm. 87}."
