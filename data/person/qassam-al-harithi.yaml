summary:
  ar: "قسّام الحارثي من أهل بَلغينا بجبل سنّبر؛ كان راعياً ثم تنقلت الأحوال به فصار مقدم الأحداث والشباب بدمشق وكثرت أعوانه حتى غلب على دمشق ولم يبق للنائب معه أمر؛ فسار إليه جيش من مصر لقصده ولمحاربته فضعف أمره واختفى ثم استأمن فقُيّدوه وبُعث إلى مصر سنة ست وسبعين وثلاثمائة فعُفي عنه وخمل أمره {cite:shadharat-dhahab p. 87}."
  en: "Qassam al-Harithi — a shepherd from Balghina on Jabal Sanbar who rose to lead the young men of Damascus until he took the city outright; an army came from Egypt, his cause collapsed, he hid, then took safe-conduct, was chained and shipped to Egypt in 376 — and pardoned {cite:shadharat-dhahab p. 87}."
