summary:
  ar: "أورنغزيب عالمكير، أبو المظفر محيي الدين محمد، الابن الثالث لشاه جهان وممتاز محل، وُلد سنة 1027هـ ⁦(1618م)⁩ في دهود بمالوا، وحكم سنة 1068هـ ⁦(1658م)⁩ بعد حرب الخلافة التي هزم فيها أخاه دارا شكوه، وتوفي سنة 1118هـ ⁦(1707م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 817}."
  en: "Aurangzeb 'Alamgir, Abu al-Muzaffar Muhammad Muhyi al-Din, the third son of Shahjahan and Mumtaz Mahal, born at Dhod in Malwa in 1027 AH (1618) and emperor from 1068 AH (1658) after the war of succession in which he defeated his brother Dara Shukoh. He died in 1118 AH (1707) {cite:encyclopaedia-of-islam-2 vol. 1 p. 817}."
  es: "Aurangzeb 'Alamgir, Abu al-Muzaffar Muhammad Muhyi al-Din, tercer hijo de Shahjahan y Mumtaz Mahal, nació en Dhod en Malwa en 1027 AH (1618) y fue emperador desde 1068 AH (1658) después de la guerra de sucesión en la que derrotó a su hermano Dara Shukoh. Murió en 1118 AH (1707) {cite:encyclopaedia-of-islam-2 vol. 1 p. 817}."
  fr: "Aurangzeb 'Alamgir, Abu al-Muzaffar Muhammad Muhyi al-Din, troisième fils de Shah Jahan et de Mumtaz Mahal, né à Dhod dans le Malwa en 1027 AH (1618), devint empereur en 1068 AH (1658) après la guerre de succession au cours de laquelle il vainquit son frère Dara Shukoh. Il mourut en 1118 AH (1707) {cite:encyclopaedia-of-islam-2 vol. 1 p. 817}."
  ur: "اورنگزیب عالمگیر، ابو المظفر محمد محی الدین، شاہجہان اور ممتاز محل کا تیسرا بیٹا، مالوہ کے علاقے ڈھود میں 1027ھ (1618) میں پیدا ہوا اور 1068ھ (1658) سے شہنشاہ، جانشینی کی جنگ کے بعد جس میں اس نے اپنے بھائی شوکو درا کو شکست دی۔ ان کی وفات 1118 ہجری (1707) میں ہوئی۔ 1 ص۔ 817}۔"
  tr: "Aurangzeb Alamkir, Abu al-Muzaffar Muhyiddin Muhammed, Şah Cahan ve Mumtaz Mahal'in üçüncü oğluydu; 1027 Hicri (1618 M.S.) yılında Malva'daki Dahud'da doğdu ve 1068 Hicri (1658 M.S.) Halifelik Savaşı'ndan sonra hüküm sürdü; bu savaşta kardeşi Dar Şikuh yenildi ve 1118 Hicri (1707 M.S.) yılında öldü. {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 817}."
  id: "Aurangzeb Alamkir, Abu al-Muzaffar Muhyiddin Muhammad, adalah putra ketiga dari Shah Jahan dan Mumtaz Mahal, lahir pada tahun 1027 H (1618 M) di Dahud, Malwa, dan memerintah pada tahun 1068 H (1658 M) setelah Perang Kekhalifahan di mana saudaranya Dar Shikuh dikalahkan, dan meninggal pada tahun 1118 H (1707 M) {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 817}."
