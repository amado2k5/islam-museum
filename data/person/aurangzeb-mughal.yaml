  ar: "أورنغزيب عالمكير، أبو المظفر محيي الدين محمد، الابن الثالث لشاه جهان وممتاز محل، وُلد سنة 1027هـ (1618م) في دهود بمالوا، وحكم سنة 1068هـ (1658م) بعد حرب الخلافة التي هزم فيها أخاه دارا شكوه، وتوفي سنة 1118هـ (1707م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 817}."
  en: "Aurangzeb 'Alamgir, Abu al-Muzaffar Muhammad Muhyi al-Din, the third son of Shahjahan and Mumtaz Mahal, born at Dhod in Malwa in 1027 AH (1618) and emperor from 1068 AH (1658) after the war of succession in which he defeated his brother Dara Shukoh. He died in 1118 AH (1707) {cite:encyclopaedia-of-islam-2 vol. 1 p. 817}."
