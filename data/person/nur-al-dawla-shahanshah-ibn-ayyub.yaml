summary:
  ar: "الأمير نور الدولة شاهنشاه بن نجم الدين أيوب بن شاذي بن مروان؛ أخو السلطان صلاح الدين وكان أكبر الإخوة؛ وهو والد عز الدين فروخشاه والد الملك الأمجد صاحب بعلبك ووالد الملك المظفر تقي الدين عمر صاحب حماة والأم عذراء صاحبة المدرسة العذراوية بدمشق؛ وقُتل في الواقعة التي اجتمع فيها الفرنج — سبعمائة ألف ما بين فارس وراجل على ما يقال — إلى باب دمشق {cite:wafayat-ayan}."
  en: "Nur al-Dawla Shahanshah b. Ayyub (k. 543) — Salah al-Din's eldest brother; father of the princes of Baalbek and Hama and of Udhra of the Udhrawiyya; killed in the great Frankish engagement before Damascus {cite:wafayat-ayan}."
