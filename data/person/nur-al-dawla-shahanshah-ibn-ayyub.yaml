died: { edtf: "1148", hijri: "0543", calendar: julian, precision: month, status: tradition, derived: true, note: "قُتل في الواقعة التي اجتمع فيها الفرنج إلى باب دمشق في شهر ربيع الأول سنة ثلاث وأربعين وخمسمائة {cite:wafayat-ayan}." }
summary:
  ar: "الأمير نور الدولة شاهنشاه بن نجم الدين أيوب بن شاذي بن مروان؛ أخو السلطان صلاح الدين وكان أكبر الإخوة؛ وهو والد عز الدين فروخشاه والد الملك الأمجد صاحب بعلبك ووالد الملك المظفر تقي الدين عمر صاحب حماة والأم عذراء صاحبة المدرسة العذراوية بدمشق؛ وقُتل في الواقعة التي اجتمع فيها الفرنج — سبعمائة ألف ما بين فارس وراجل على ما يقال — إلى باب دمشق {cite:wafayat-ayan}."
  en: "Nur al-Dawla Shahanshah b. Ayyub (k. 543) — Salah al-Din's eldest brother; father of the princes of Baalbek and Hama and of Udhra of the Udhrawiyya; killed in the great Frankish engagement before Damascus {cite:wafayat-ayan}."
  es: "Nur al-Dawla Shahanshah b. Ayyub (m. 543) — Hermano mayor de Salah al-Din; padre de los príncipes de Baalbek y Hama y de Udhra de la Udhrawiyya; muerto en la gran batalla franca frente a Damasco {cite:wafayat-ayan}."
  fr: "Nur al-Dawla Shahanshah b. Ayyub (k. 543) — Frère aîné de Salah al-Din; père des princes de Baalbek et Hama et d'Udhra de la tribu des Udhrawiyya; tué lors du grand engagement franc devant Damas {cite:wafayat-ayan}."
  ur: "نور الدولہ شہنشاہ بی۔ ایوب (k. 543) — صلاح الدین کا سب سے بڑا بھائی؛ بعلبک اور حما کے شہزادوں کا باپ اور اُدھراویہ کے اُدھرا کا۔ دمشق سے پہلے فرینک کی عظیم مصروفیت میں مارا گیا۔"
  tr: "Prens Nur al-Dawla Shahanshah ibn Najm al-Din Ayyub ibn Shadhi ibn Marwan; Sultan Salah al-Din'in kardeşi ve kardeşlerin en büyüğü; Izz al-Din Farukhshah'ın, Baalbek hükümdarı Kral Al-Amjad'ın babası, Hama'nın hükümdarı Kral al-Muzaffar Taqi al-Din Omar'ın babası ve Şam'daki Adhraviye okulunun sahibi Adhra'nın babasıdır. Frankların—söylenirse yedi yüz bin İranlı ve adamın—Şam Kapısı'nda toplandığı olayda öldürüldü {atıf:wafayat-ayan}."
  id: "Pangeran Nur al-Dawla Shahanshah ibn Najm al-Din Ayyub ibn Shadhi ibn Marwan; saudara Sultan Salah al-Din dan yang tertua dari saudara-saudara; ia adalah ayah dari Izz al-Din Farukhshah, ayah dari Raja Al-Amjad, penguasa Baalbek, ayah dari Raja al-Muzaffar Taqi al-Din Omar, penguasa Hama, dan ibunya Adhra, pemilik sekolah Adhrawiya di Damaskus. Ia tewas dalam insiden di mana orang Franka—dilaporkan tujuh ratus ribu orang Persia dan pria—berkumpul di Gerbang Damaskus {cite:wafayat-ayan}."
