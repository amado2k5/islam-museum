class: person
label: { ar: "أبو اليمن الكندي", en: "Abu al-Yumn al-Kindi", es: "Abu al-Yumn al-Kindi", fr: "Abu al-Yumn al-Kindi", ur: "ابو الیومن الکندی" }
summary:
  ar: "العلامة تاج الدين أبو اليمن زيد بن الحسن بن زيد بن الحسن البغدادي المقرئ النحوي اللغوي؛ شيخ القراء والنحويين بالشام ومسند العصر؛ ولد سنة عشرين وخمسمائة وأكمل القراءات العشر وله عشرة أعوام وهذا ما لا يُعلم تهيأ لأحد سواه؛ اعتنى به سبط الخياط فأقرأه وجهزه إلى أبي القاسم هبة الله بن الطبر وأبي منصور بن خيرون وأبي بكر خطيب الموصل وأبي الفضل بن المهتدي بالله؛ ونال الجاه الوافر فإن الملك المعظم كان مديماً للاشتغال عليه وكان ينزل إليه من القلعة؛ توفي في سادس شوال سنة ثلاث عشرة وستمائة ونزل الناس بموته درجة في القراءات والحديث لأنه آخر من سمع من القاضي أبي بكر آخر من سمع من الجوهري آخر من روى عن القطيعي آخر من روى عن الكري {cite:shadharat-dhahab p. 54-55}."
  en: "The alim Taj al-Din Abu al-Yumn Zayd ibn al-Hasan ibn Zayd ibn al-Hasan al-Baghdadi, reader, grammarian and philologist; shaykh of the readers and grammarians in Syria and musnid of his age. Born in 520, he completed the ten readings at the age of ten, a feat not known to have been achieved by anyone else. Sibt al-Khayyat took him up, taught him, and sent him to Abu al-Qasim Hibat Allah ibn al-Tabbar, Abu Mansur ibn Khayrun, Abu Bakr the khatib of Mosul, and Abu al-Fadl ibn al-Muhtadi bi-Allah. He attained ample standing: al-Malik al-Mu'azzam was constant in studying with him and would come down to him from the citadel. He died on the sixth of Shawwal 613, and people's standing in the readings and hadith dropped by one rung at his death, because he was the last to have heard from al-Qadi Abu Bakr, the last to have heard from al-Jawhari, the last to transmit from al-Qati'i, and the last to transmit from al-Kurri {cite:shadharat-dhahab p. 54-55}."
  es: "El erudito Taj al-Din Abu al-Yumn Zayd ibn al-Hasan ibn Zayd ibn al-Hasan al-Baghdadi, lector, gramático y filólogo; shaykh de los lectores y gramáticos de Siria y musnid de su época. Nacido en 520, completó las diez lecturas a la edad de diez años, una hazaña que nadie más ha logrado. Sibt al-Khayyat lo acogió, lo instruyó y lo envió a Abu al-Qasim Hibat Allah ibn al-Tabbar, Abu Mansur ibn Khayrun, Abu Bakr el khatib de Mosul y Abu al-Fadl ibn al-Muhtadi bi-Allah. Alcanzó un alto rango: al-Malik al-Mu'azzam estudiaba constantemente con él y bajaba a verlo desde la ciudadela. Murió el sexto de Shawwal 613, y la posición de la gente en las lecturas y hadices bajó un escalón con su muerte, porque fue el último en haber escuchado a al-Qadi Abu Bakr, el último en haber escuchado a al-Jawhari, el último en transmitir de al-Qati'i, y el último en transmitir de al-Kurri {cite:shadharat-dhahab p. 54-55}."
  fr: "Le savant Taj al-Din Abu al-Yumn Zayd ibn al-Hasan ibn Zayd ibn al-Hasan al-Baghdadi, lecteur, grammairien et philologue, fut le cheikh des lecteurs et des grammairiens de Syrie et le maître des études coraniques (musnid) de son époque. Né en 520, il acheva la lecture des dix livres à l'âge de dix ans, un exploit unique en son genre. Sibt al-Khayyat le prit sous son aile, l'instruisit et l'envoya auprès d'Abu al-Qasim Hibat Allah ibn al-Tabbar, d'Abu Mansur ibn Khayrun, d'Abu Bakr, le khatib de Mossoul, et d'Abu al-Fadl ibn al-Muhtadi, par la grâce d'Allah. Il acquit une grande renommée: al-Malik al-Mu'azzam étudiait régulièrement avec lui et descendait de la citadelle pour le rencontrer. Il mourut le six Shawwal 613, et le statut des personnes dans les lectures et les hadiths baissa d'un cran à sa mort, car il était le dernier à avoir entendu d'al-Qadi Abu Bakr, le dernier à avoir entendu d'al-Jawhari, le dernier à transmettre d'al-Qati'i et le dernier à transmettre d'al-Kurri {cite:shadharat-dhahab p. 54-55}."
  ur: "عالم تاج الدین ابو الیومن زید ابن الحسن ابن زید ابن الحسن البغدادی، قاری، گرامر اور ماہر فلسفی؛ شام کے قارئین اور گرامر کے شیخ اور اپنے دور کے مسنید۔ 520 میں پیدا ہوئے، اس نے دس سال کی عمر میں دس ریڈنگ مکمل کی، ایسا کارنامہ جو کسی اور نے حاصل نہیں کیا تھا۔ سبط الخیاط نے اسے اٹھایا، پڑھایا اور ابو القاسم ہیبت اللہ ابن الطبر، ابو منصور بن خیرون، ابوبکر خطیب موصل اور ابو الفضل بن المحتدی کے پاس بھیجا۔ اس نے کافی مقام حاصل کیا: الملک المعظم اس کے ساتھ مسلسل مطالعہ کرتے تھے اور قلعہ سے ان کے پاس آتے تھے۔ آپ کی وفات 6 شوال 613 کو ہوئی، اور آپ کی وفات کے بعد قراء ات اور حدیث میں لوگوں کا کھڑا ہونا ایک دم گھٹ گیا، کیونکہ آپ نے سب سے آخر میں القادی ابوبکر سے سنا، سب سے آخر میں الجوہری سے سنا، سب سے آخری جو القطیٰ سے سنا، اور سب سے آخر میں الکری سے روایت کی۔ 54-55}۔"
