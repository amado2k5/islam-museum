id: person/al-kindi-abu-al-yumn
class: person
label: { ar: "أبو اليمن الكندي", en: "Abu al-Yumn al-Kindi" }
summary:
  ar: "العلامة تاج الدين أبو اليمن زيد بن الحسن بن زيد بن الحسن البغدادي المقرئ النحوي اللغوي؛ شيخ القراء والنحويين بالشام ومسند العصر؛ ولد سنة عشرين وخمسمائة وأكمل القراءات العشر وله عشرة أعوام وهذا ما لا يُعلم تهيأ لأحد سواه؛ اعتنى به سبط الخياط فأقرأه وجهزه إلى أبي القاسم هبة الله بن الطبر وأبي منصور بن خيرون وأبي بكر خطيب الموصل وأبي الفضل بن المهتدي بالله؛ ونال الجاه الوافر فإن الملك المعظم كان مديماً للاشتغال عليه وكان ينزل إليه من القلعة؛ توفي في سادس شوال سنة ثلاث عشرة وستمائة ونزل الناس بموته درجة في القراءات والحديث لأنه آخر من سمع من القاضي أبي بكر آخر من سمع من الجوهري آخر من روى عن القطيعي آخر من روى عن الكري {cite:shadharat-dhahab p. 54-55}."
  en: "The alim Taj al-Din Abu al-Yumn Zayd ibn al-Hasan ibn Zayd ibn al-Hasan al-Baghdadi, reader, grammarian and philologist; shaykh of the readers and grammarians in Syria and musnid of his age. Born in 520, he completed the ten readings at the age of ten, a feat not known to have been achieved by anyone else. Sibt al-Khayyat took him up, taught him, and sent him to Abu al-Qasim Hibat Allah ibn al-Tabbar, Abu Mansur ibn Khayrun, Abu Bakr the khatib of Mosul, and Abu al-Fadl ibn al-Muhtadi bi-Allah. He attained ample standing: al-Malik al-Mu'azzam was constant in studying with him and would come down to him from the citadel. He died on the sixth of Shawwal 613, and people's standing in the readings and hadith dropped by one rung at his death, because he was the last to have heard from al-Qadi Abu Bakr, the last to have heard from al-Jawhari, the last to transmit from al-Qati'i, and the last to transmit from al-Kurri {cite:shadharat-dhahab p. 54-55}."
