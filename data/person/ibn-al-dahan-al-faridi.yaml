summary:
  ar: "أبو شجاع محمد بن علي بن شعيب المعروف بابن الدهان، الملقب فخر الدين، البغدادي الفرضي الحاسب الأديب؛ انتقل من بغداد إلى الموصل فصحب جمال الدين الأصبهاني الوزير، ثم تحول إلى خدمة السلطان صلاح الدين فولاه ديوان مسافارقين، ثم دخل دمشق وارتحل إلى مصر سنة ست وثمانين وخمسمائة وعاد فاتخذ دمشق دار إقامة؛ له أوضاع الجداول في الفرائض، وصنّف «غريب الحديث» في ستة عشر مجلداً لطافاً، وجمع تاريخاً، وله شعر جيد أثنى عليه ابن المستوفي في تاريخ إربل والعماد الكاتب في الخريدة {cite:wafayat-ayan}."
  en: "Ibn al-Dahan al-Faridi (d. 590) — Baghdadi inheritance-law specialist and littérateur in Salah al-Din's chancery; his Gharib al-Hadith ran to sixteen volumes; died at al-Hilla returning from Hajj {cite:wafayat-ayan}."
