label: { ar: "ابن الدهان الفرضي", en: "Ibn al-Dahan", es: "Ibn al-Dahan", fr: "Ibn al-Dahan", ur: "ابن الدحان" }
died: { edtf: "1194", hijri: "0590", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في صفر سنة تسعين وخمسمائة بالحلة الصيفية؛ حج من دمشق وعاد على طريق العراق فعثر جمله بالحلة {cite:wafayat-ayan}." }
summary:
  ar: "أبو شجاع محمد بن علي بن شعيب المعروف بابن الدهان، الملقب فخر الدين، البغدادي الفرضي الحاسب الأديب؛ انتقل من بغداد إلى الموصل فصحب جمال الدين الأصبهاني الوزير، ثم تحول إلى خدمة السلطان صلاح الدين فولاه ديوان مسافارقين، ثم دخل دمشق وارتحل إلى مصر سنة ست وثمانين وخمسمائة وعاد فاتخذ دمشق دار إقامة؛ له أوضاع الجداول في الفرائض، وصنّف «غريب الحديث» في ستة عشر مجلداً لطافاً، وجمع تاريخاً، وله شعر جيد أثنى عليه ابن المستوفي في تاريخ إربل والعماد الكاتب في الخريدة {cite:wafayat-ayan}."
  en: "Ibn al-Dahan al-Faridi (d. 590) — Baghdadi inheritance-law specialist and littérateur in Salah al-Din's chancery; his Gharib al-Hadith ran to sixteen volumes; died at al-Hilla returning from Hajj {cite:wafayat-ayan}."
  es: "Ibn al-Dahan al-Faridi (m. 590): especialista bagdadí en derecho sucesorio y literato de la cancillería de Salah al-Din; su Gharib al-Hadith constaba de dieciséis volúmenes; murió en al-Hilla regresando del Hajj {cita:wafayat-ayan}."
  fr: "Ibn al-Dahan al-Faridi (mort en 590) — Baghdadi, spécialiste du droit des successions et littérateur à la chancellerie de Salah al-Din; son Gharib al-Hadith comptait seize volumes; est mort à al-Hilla en revenant du Hajj {cite: wafayat-ayan}."
  ur: "ابن الدحان الفریدی ⁦(متوفی 590)⁩ - بغدادی وراثت قانون کے ماہر اور صلاح الدین کے دفتر میں لکھاری؛ ان کی غریب الحدیث سولہ جلدوں پر مشتمل ہے۔ حج سے واپسی پر ہللا میں وفات پائی۔"
  tr: "Ebu Şuca' Muhammed bin Ali bin Şuayb, İbn el-Dahhan olarak bilinir, Fıhr el-Din lakaplı, Bağdadi el-Fardi, edebi figür, Bağdat'tan Musul'a Cemaleddin el-Esbahani eşliğinde vezir eşliğinde taşındı, ardından Sultan Salahdin'e hizmet etmek üzere transfer oldu, onu Misfariqin Diwanı olarak atadı, ardından Şam'a girdi, 586 Hicri yılında Mısır'a gitti ve geri dönüp Şam'ı ikametgahı yaptı. 'Gharib al-Hadis'i on altı güzel ciltte yazdı, bir tarih topladı ve İbn el-Mustawfi tarafından Erbil Tarihi'nde ve el-İmad el-Katib tarafından Khuaid'de övülen güzel şiirler yazdı."
  id: "Abu Shuja' Muhammad ibn Ali ibn Shu'ayb, yang dikenal sebagai Ibn al-Dahhan, dijuluki Fakhr al-Din, sang Baghdadi al-Fardi, tokoh sastra, pindah dari Baghdad ke Mosul, ditemani oleh Jamal al-Din al-Asbahani, sang wazir, lalu ia pindah untuk melayani Sultan Salah al-Din, mengangkatnya sebagai Diwan Misfariqin, kemudian masuk ke Damaskus, melakukan perjalanan ke Mesir pada tahun 586 H, dan kembali dan menjadikan Damaskus sebagai tempat tinggalnya. Ia menulis 'Gharib al-Hadith' dalam enam belas jilid yang indah, mengumpulkan sejarah, dan menulis puisi-puisi baik yang dipuji oleh Ibn al-Mustawfi dalam Sejarah Erbil dan al-Imad al-Katib dalam al-Khuraida {cite:wafayat-ayan}."
