summary:
  ar: "داعية شاب باكستاني، الرئيس التنفيذي لمنظمة «يوث كلوب باكستان» (Youth Club Pakistan) وأميرها، وهي منظمة شبابية غير ربحية تأسست سنة 2011 ومقرها إسلام آباد، تنظم فعاليات ومؤتمرات دينية وتعليمية وبرامج لإشراك الشباب في إسلام آباد ولاهور ومدن باكستانية أخرى، وتنشر محاضراته عبر قناة المنظمة على يوتيوب."
  en: "Pakistani youth preacher, chief executive and ameer of Youth Club Pakistan, a non-profit youth organisation founded in 2011 and based in Islamabad that runs religious and educational conferences and youth engagement programmes in Islamabad, Lahore and other Pakistani cities; his talks circulate through the organisation's YouTube channel."
  ur: "پاکستانی نوجوان مبلغ، «یوتھ کلب پاکستان» (Youth Club Pakistan) کے چیف ایگزیکٹو اور امیر — یہ 2011 میں قائم ہونے والی اسلام آباد کی ایک غیر منافع بخش نوجوان تنظیم ہے جو اسلام آباد، لاہور اور دیگر پاکستانی شہروں میں دینی و تعلیمی کانفرنسز اور نوجوانوں کے پروگرام منعقد کرتی ہے؛ ان کی تقاریر تنظیم کے یوٹیوب چینل کے ذریعے پھیلتی ہیں۔"
