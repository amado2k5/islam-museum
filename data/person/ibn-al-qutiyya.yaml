died: { edtf: "0977", hijri: "0367", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم الثلاثاء لسبع بقين من شهر ربيع الأول سنة سبع وستين وثلاثمائة بمدينة قرطبة ودفن بمقبرة قريش؛ وقيل في رجب من السنة المذكورة والأول أصح {cite:wafayat-ayan}." }
summary:
  ar: "أبو بكر محمد بن عمر بن عبد العزيز بن إبراهيم بن عيسى بن مزاحم، المعروف بابن القوطية؛ الأندلسي الإشبيلي الأصل القرطبي المولد والدار؛ سمع بإشبيلية وقرطبة وكان من أعلم أهل زمانه باللغة العربية ومع ذلك حافظاً للحديث والفقه والخبر والنادر وأروى الناس للأشعار وأدركهم للآثار؛ كان مضطلعاً بأخبار الأندalus وأهلها ورواية سير أمرائها وأحوال فقهائها وشعرائها؛ صنف كتاب «تصاريف الأفعال» الذي فتح هذا الباب فجاء من بعده ابن القطاع وتبعه؛ وكان مع فضائله من العباد النساك وجيد الشعر لكنه ترك ذلك ورفضه؛ سمي ابن القوطية بجدته قوطية بنت ملك من ملوك الأندalus {cite:wafayat-ayan}."
  en: "Ibn al-Qutiyya (d. 367) — the Sevillan philologist of Cordoba, 'son of the Gothic woman' (his grandmother was a Visigothic princess); foremost scholar of Arabic in his time and the leading authority on the history of al-Andalus; author of Tasrif al-Af'al, which opened the genre later continued by Ibn al-Qatta' {cite:wafayat-ayan}."
