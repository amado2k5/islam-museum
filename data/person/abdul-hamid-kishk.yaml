summary:
  ar: "خطيب وداعية مصري كفيف من خرّيجي كلية أصول الدين بالأزهر (1933–1996)، خطب على منبر مسجد عين الحياة بالقاهرة نحو عشرين سنة، وانتشرت أكثر من ألفي خطبة له على أشرطة الكاسيت في العالم العربي، واعتُقل سنة 1965 ثم سنة 1981، ولُقّب بفارس المنابر."
  en: "Blind Egyptian preacher and graduate of al-Azhar's faculty of Usul al-Din (1933–1996), who preached from the pulpit of the 'Ain al-Hayat mosque in Cairo for about twenty years; more than two thousand of his sermons spread on cassette across the Arab world, he was detained in 1965 and again in 1981, and he was called 'the knight of the pulpits'."
  ur: "نابینا مصری خطیب اور داعی، ازہر کے کلیہ اصول الدین کے فاضل (1933–1996)، جنہوں نے قاہرہ کی مسجد عین الحیاۃ کے منبر سے تقریباً بیس سال خطبے دیے؛ ان کے دو ہزار سے زائد خطبے کیسٹوں پر عرب دنیا میں پھیلے، 1965 اور پھر 1981 میں گرفتار ہوئے، اور «فارس المنابر» کہلائے۔"
