summary:
  ar: من سادات الأنصار من بني سلمة، كان له صنم من خشب في داره يعظمه حتى أسلم بعد أن ألقاه فتيان قومه مراراً في العذرة، وقال ابن الكلبي إنه آخر الأنصار إسلاماً؛ قال النبي لبني سلمة «بل سيدكم عمرو بن الجموح» وكان يولم له إذا تزوج؛ واستشهد بأحد. وقبل الإسلام كان من بني حرام بن كعب بن سلمة، وأجار سعد بن معاذ الأشهلي يوم بعاث حين انهزم {cite:samhudi-wafa-al-wafa p. 228}.
  en: A chief of the Ansar from Banu Salima, who kept a wooden idol in his house until he embraced Islam, after the young men of his clan threw it repeatedly into the dung pits; Ibn al-Kalbi says he was the last of the Ansar to become Muslim;
    the Prophet told Banu Salima 'rather, your chief is Amr ibn al-Jamuh', and he gave the wedding feast when the Prophet married; he was killed at Uhud.
