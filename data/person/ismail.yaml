summary:
  en: "Son of Ibrahim and Hajar, settled as an infant with his mother at Mecca where Zamzam sprang; he married into Jurhum, fathered twelve sons whose tribes spread from Mecca, and built the Kaaba with his father; the Adnani Arabs trace their lineages to him."
  ar: "ابن إبراهيم من هاجر؛ أسكنه أبوه مع أمه بمكة رضيعاً ففاضت لهما زمزم، وتزوج من جرهم ورُزق اثني عشر ولداً تشعبت منهم القبائل، وبنى مع أبيه البيت وولي زعامة مكة وولايته طول حياته. وفي مسلم قال النبي «اصطفى الله كنانة من ولد إسماعيل» {cite:sahih-muslim 2276}."
