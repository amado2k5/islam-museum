summary:
  en: "Son of Ibrahim and Hajar, settled as an infant with his mother at Mecca where Zamzam sprang; he married into Jurhum, fathered twelve sons whose tribes spread from Mecca, and built the Kaaba with his father; the Adnani Arabs trace their lineages to him."
  ar: "ابن إبراهيم من هاجر؛ أسكنه أبوه مع أمه بمكة رضيعاً ففاضت لهما زمزم، وتزوج من جرهم ورُزق اثني عشر ولداً تشعبت منهم القبائل، وبنى مع أبيه البيت وولي زعامة مكة وولايته طول حياته. وفي مسلم قال النبي «اصطفى الله كنانة من ولد إسماعيل» {cite:sahih-muslim 2276}."
  es: "Hijo de Ibrahim y Hajar, se estableció de niño con su madre en La Meca, donde brotaba el río Zamzam; se casó con Jurhum, tuvo doce hijos cuyas tribus se extendieron desde La Meca y construyó la Kaaba con su padre; los árabes Adnani remontan su linaje a él."
  fr: "Fils d'Ibrahim et d'Hajar, il s'installa enfant avec sa mère à La Mecque, où jaillissait Zamzam; il épousa une femme de la tribu de Jurhum, engendra douze fils dont les tribus s'étendirent depuis La Mecque, et construisit la Kaaba avec son père; les Arabes Adnani font remonter leur lignée à lui."
  ur: "ابراہیم اور حجر کے بیٹے، اپنی والدہ کے ساتھ مکہ میں جہاں زمزم کا اضافہ ہوا تھا، بچپن میں ہی آباد ہوئے؛ اس نے جرہم میں شادی کی، بارہ بیٹے پیدا ہوئے جن کے قبیلے مکہ سے پھیلے، اور اپنے باپ کے ساتھ کعبہ تعمیر کیا۔ عدنانی عرب اپنے نسب کا پتہ لگاتے ہیں۔"
  tr: "İbn İbrahim Hacer'den; babası onu annesiyle birlikte bebekken Mekke'ye yerleştirdi ve zamzam onlar için taştı. Komşularından evlendi ve kabilelerin ayrıldığı on iki oğlu oldu. Evi babasıyla birlikte inşa etti ve hayatı boyunca Mekke'nin liderliğini ve otoritesini elinde tuttu. Müslüman dilinde Peygamber şöyle dedi: \"Allah, İsmail'in soyundan Kinana'yı seçti\" {atıf:sahih-müslüman 2276}."
  id: "Ibn Ibrahim dari Hagar; ayahnya menikahkannya bersama ibunya di Mekah saat masih bayi, dan Zamzam meluap bagi mereka. Ia menikah dengan tetangga mereka dan memiliki dua belas putra dari mana suku-suku itu bercabang. Ia membangun rumah bersama ayahnya dan memegang kepemimpinan serta otoritas Mekah sepanjang hidupnya. Dalam bahasa Muslim, Nabi berkata: \"Allah memilih Kinana dari keturunan Ismael\" {cite:sahih-muslim 2276}."
