id: person/muanis-al-muzaffar
class: person
label: { ar: "مؤنس الخادم الملقب بالمظفر" }
summary:
  ar: "الخادم، ملقب بالمظفر، خرج على المقتدر سنة سبع عشرة لكونه بلغه أنه يريد أن يولي إمرة الأمراء هارون بن غريب مكانه فأخرجه ليلة أربع عشر المحرم وخلعه وبايع للقاهر ثم عاد المقتدر بسعي الجند، وركب عليه ثانية سنة عشرين فلما التقى الجمعان رمى بربري المقتدر بحربة فسقط ثم ذبحه بالسيف وشيل رأسه على رمح {cite:tarikh-khulafa-minhaj-1434 p. 591-593}، ثم اتفق هو وابن مقلة وآخرون على خلع القاهر بابن المكتفي فتحيل القاهر عليهم حتى أمسكهم وذبحهم {cite:tarikh-khulafa-minhaj-1434 p. 597}.، وعند ابن الأثير في قتل المقتدر سنة 320هـ كان في الراشدية لم يشهد الحرب فلما حُمل إليه الرأس بكى ولطم وجهه وقال يا مفسدون ما هكذا أوصيتكم والله لنُقتلنّ كلنا، وقال ابن الأثير كان ما فعله سبباً لتجرأة أصحاب الأطراف على الخلفاء وانحلال الهيبة وضعف أمر الخلافة {cite:kamil-ibn-al-athir p. 180-181}"
  en: "The eunuch 'al-Muzaffar'; he deposed al-Muqtadir in 317 and hailed al-Qahir, saw him restored within days, then rode on him again in 320 — at the encounter a Berber's javelin unhorsed the caliph and he was butchered, his head borne on a lance {cite:tarikh-khulafa-minhaj-1434 p. 591-593}."
