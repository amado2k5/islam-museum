id: person/muanis-al-muzaffar
class: person
label: { ar: "مؤنس الخادم الملقب بالمظفر" }
summary:
  ar: "الخادم، ملقب بالمظفر، خرج على المقتدر سنة سبع عشرة لكونه بلغه أنه يريد أن يولي إمرة الأمراء هارون بن غريب مكانه فأخرجه ليلة أربع عشر المحرم وخلعه وبايع للقاهر ثم عاد المقتدر بسعي الجند، وركب عليه ثانية سنة عشرين فلما التقى الجمعان رمى بربري المقتدر بحربة فسقط ثم ذبحه بالسيف وشيل رأسه على رمح {cite:tarikh-khulafa-minhaj-1434 p. 591-593}، ثم اتفق هو وابن مقلة وآخرون على خلع القاهر بابن المكتفي فتحيل القاهر عليهم حتى أمسكهم وذبحهم {cite:tarikh-khulafa-minhaj-1434 p. 597}.، وعند ابن الأثير في قتل المقتدر سنة 320هـ كان في الراشدية لم يشهد الحرب فلما حُمل إليه الرأس بكى ولطم وجهه وقال يا مفسدون ما هكذا أوصيتكم والله لنُقتلنّ كلنا، وقال ابن الأثير كان ما فعله سبباً لتجرأة أصحاب الأطراف على الخلفاء وانحلال الهيبة وضعف أمر الخلافة {cite:kamil-ibn-al-athir p. 180-181}، وعند ابن الأثير قبض عليه القاهر سنة 321هـ بحيلة أظهروا فيها أن أبا طاهر القرمطي ورد الكوفة ليخرج علي بن بليق بالجيش فيخلو بهم، وأرسل إليه طريف السبكري يدعوه إلى الدار فجاء وقد استولى عليه الكبر والضعف فقبض عليه وحبسه ولم يره، ثم لما شغب أصحابه وثاروا وأحرقوا روشن دار الوزير ونادوا بشعار مؤنس ذبحه القاهر في شعبان 321هـ بعد أن حُمل إليه رأسا بليق وابنه في طشت فتشاغل واسترجع ولعن قاتلهما فقال القاهر جروا برجل الكلب الملعون فذُبح وطيف برأسه معهما في جانبي بغداد ثم أعيدت الرؤوس إلى خزانة الرؤوس {cite:kamil-ibn-al-athir p. 190-195}"
  en: "The eunuch 'al-Muzaffar'; he deposed al-Muqtadir in 317 and hailed al-Qahir, saw him restored within days, then rode on him again in 320 — at the encounter a Berber's javelin unhorsed the caliph and he was butchered, his head borne on a lance {cite:tarikh-khulafa-minhaj-1434 p. 591-593}."
