id: person/muanis-al-muzaffar
class: person
label: { ar: "مؤنس الخادم الملقب بالمظفر" }
summary:
  ar: "الخادم، ملقب بالمظفر، خرج على المقتدر سنة سبع عشرة لكونه بلغه أنه يريد أن يولي إمرة الأمراء هارون بن غريب مكانه فأخرجه ليلة أربع عشر المحرم وخلعه وبايع للقاهر ثم عاد المقتدر بسعي الجند، وركب عليه ثانية سنة عشرين فلما التقى الجمعان رمى بربري المقتدر بحربة فسقط ثم ذبحه بالسيف وشيل رأسه على رمح {cite:tarikh-khulafa-minhaj-1434 p. 591-593}، ثم اتفق هو وابن مقلة وآخرون على خلع القاهر بابن المكتفي فتحيل القاهر عليهم حتى أمسكهم وذبحهم {cite:tarikh-khulafa-minhaj-1434 p. 597}. وعند ابن الأثير في قتل المقتدر سنة 320هـ كان في الراشدية لم يشهد الحرب فلما حُمل إليه الرأس بكى ولطم وجهه وقال يا مفسدون ما هكذا أوصيتكم والله لنُقتلنّ كلنا، وقال ابن الأثير كان ما فعله سبباً لتجرأة أصحاب الأطراف على الخلفاء وانحلال الهيبة وضعف أمر الخلافة {cite:kamil-ibn-al-athir p. 180-181}، وعند ابن الأثير قبض عليه القاهر سنة 321هـ بحيلة أظهروا فيها أن أبا طاهر القرمطي ورد الكوفة ليخرج علي بن بليق بالجيش فيخلو بهم، وأرسل إليه طريف السبكري يدعوه إلى الدار فجاء وقد استولى عليه الكبر والضعف فقبض عليه وحبسه ولم يره، ثم لما شغب أصحابه وثاروا وأحرقوا روشن دار الوزير ونادوا بشعار مؤنس ذبحه القاهر في شعبان 321هـ بعد أن حُمل إليه رأسا بليق وابنه في طشت فتشاغل واسترجع ولعن قاتلهما فقال القاهر جروا برجل الكلب الملعون فذُبح وطيف برأسه معهما في جانبي بغداد ثم أعيدت الرؤوس إلى خزانة الرؤوس {cite:kamil-ibn-al-athir p. 190-195} وعند ابن الجوزي لُقّب المظفر في ربيع الآخر سنة تسع وثلاثمائة وأُنشئت الكتب بذلك عن المقتدر إلى أمراء النواحي، وعُقد له في جمادى الأولى على مصر والشام {cite:muntazam-ibn-al-jawzi p. 449}."
  en: "The eunuch 'al-Muzaffar'; he deposed al-Muqtadir in 317 and hailed al-Qahir, saw him restored within days, then rode on him again in 320 — at the encounter a Berber's javelin unhorsed the caliph and he was butchered, his head borne on a lance {cite:tarikh-khulafa-minhaj-1434 p. 591-593}."
  es: "El eunuco 'al-Muzaffar'; depuso a al-Muqtadir en 317 y aclamó a al-Qahir, lo vio restaurado en cuestión de días, luego volvió a montarlo en 320; en el encuentro, una jabalina bereber derribó al califa de su caballo y fue masacrado, su cabeza llevada en una lanza {cite:tarikh-khulafa-minhaj-1434 p. 591-593}."
  fr: "L'eunuque 'al-Muzaffar'; il déposa al-Muqtadir en 317 et salua al-Qahir, le vit restauré en quelques jours, puis monta à nouveau sur lui en 320 — lors de la rencontre, un javelot berbère désarçonna le calife et il fut massacré, sa tête portée sur une lance {cite:tarikh-khulafa-minhaj-1434 p. 591-593}."
  ur: "خواجہ سرا 'المظفر'؛ اس نے 317 میں مقتدیر کو معزول کیا اور القاہر کی تعریف کی، اسے دنوں میں بحال ہوتے دیکھا، پھر 320 میں اس پر دوبارہ سوار ہوا - مقابلے میں ایک بربر کے برچھے نے خلیفہ کو گھوڑا مارا اور اسے قتل کر دیا گیا، اس کا سر ایک لانس پر رکھا گیا تھا۔ 591-593}۔"
  tr: "Al-Khadim, lakabı Al-Muzaffar, on yedinci H yılında Al-Muqtadir'e karşı isyan etti çünkü Harun bin Gharib'i kendi yerine prenslerin hükümdarı olarak atamak istediğini duymuştu. On dördüncü Muharrem gecesi onu görevden aldı, görevden aldı, Al-Qahir'e bağlılık yemini etti, ardından ordunun çabasıyla geri döndü, 20. yılda tekrar bindi ve iki grup karşılaştığında, Al-Muqtadir'in Berberisini mızrakla vurdu, Berber yere düştü, ardından kılıçla katletti ve başını mızrakla vurdu {alıntı:Tarikh-Khulafa-minhaj-1434 s. 591-593}. Sonra o, İbn Muqalla ve diğerleri, İbn el-Muktafi ile birlikte Al-Qahir'i devirmeyi ve ardından Al-Qahir'i kandırmayı kabul ettiler; ta ki Al-Qahir onları yakalayıp katledene kadar {atıf:Tarikh-Khulafa-minhaj-1434, s. 597}. İbn al-Athir, 320 H.'de Rashidids'te olan ve savaşı görmeyen el-Muqtadir'in öldürülmesinde rol aldı. Başı ona getirildiğinde ağladı, yüzüne tokat attı ve dedi ki, 'Ey yozlaştırıcılar, size emrettiğim budur, Allah aşkına, hepimizi öldüreceğiz.' İbn al-Athir, yaptığı şeyin, halifelere karşı fraksiyon yöneticilerinin cesaretinin, prestijin azalmasının ve halifeliğin işlerinin zayıflamasının sebebi olduğunu söyledi {cite:kamil-ibn-al-athir s. 180-181}. İbn al-Athir'e göre, 321 Hicri yılında, Ebu Tahir el-Karmatinin Kufe'ye dönüp Ali ibn Baliq'i orduyla gönderip sonra ayrıldığını gösteren bir hile ile el-Kahir tarafından yakalandı. Tarif al-Subkari ona eve davet etti, o da kibir ve zayıflıkla geldi, onu tutukladı, hapse attı ve görmedi. Sonra yoldaşları isyan etti, isyan etti, vezirin evinin ışığını yaktı ve 'Mu'nas, el-Kahir'in Şaban 321 Hicri'de katlettiği kişi' sloganını tekrarladı; o da pürüzsüz bir kafa ve oğlunu bir leğende taşıdı. Dikkati dağıldı, toparlandı ve katillerini lanetledi. El-Kahir dedi ki, 'Lanetli köpeğin bacağını sürüklediler,' ve o da onu katledek başıyla birlikte Bağdat'ın her iki yanında katletti. Sonra başlar başlar hazinesine geri verildi {alıntı: Kamil-ibn-al-Athir s. 190-195} İbn al-Jawzi, 309 Hicri yılında Rabi' al-Thani'de el-Muzaffar unvanını vermiş ve bu şekilde al-Muqtadir'den bölge yöneticilerine kitaplar verilmiş, ayrıca Cemade el-Avvel'de Mısır ve Şam üzerinde bir sözleşme yapılmıştır {atıf:muntazam-ibn-al-jawzi s. 449}."
  id: "Al-Khadim, yang dijuluki Al-Muzaffar, memberontak melawan Al-Muqtadir pada tahun ketujuh belas AH karena ia mendengar bahwa ia ingin mengangkat Harun ibn Gharib sebagai penguasa para pangeran menggantikannya. Ia mengusirnya pada malam tanggal empat belas Muharram, menggulingkannya, bersumpah setia kepada Al-Qahir, lalu kembali dengan usaha pasukan, menungganginya lagi pada tahun ke-20, dan ketika kedua kelompok bertemu, ia menembak Berber Al-Muqditar dengan tombak, yang jatuh, lalu membantainya dengan pedang dan memukul kepalanya dengan tombak {cite:Tarikh-Khulafa-minhaj-1434 hlm. 591-593}. Kemudian dia, Ibn Muqalla, dan yang lain sepakat untuk menggulingkan Al-Qahir bersama Ibn al-Muktafi dan kemudian menipu Al-Qahir sampai dia menangkap dan membantai mereka {cite:Tarikh-Khulafa-minhaj-1434, hlm. 597}. Ibn al-Athir terlibat dalam pembunuhan al-Muqtadir pada tahun 320 H, yang berada di kalangan Rashidid dan tidak menyaksikan pertempuran itu. Ketika kepala itu dibawa kepadanya, ia menangis, menampar wajahnya, dan berkata, 'Wahai para perosak, inilah yang telah Aku perintahkan kepadamu, demi Tuhan, kami akan membunuh kita semua.' Ibn al-Athir mengatakan apa yang ia lakukan adalah alasan keberanian para penguasa faksi melawan khalifah, menurunnya prestise, dan melemahnya urusan kekhalifahan {cite:kamil-ibn-al-athir hlm. 180-181}. Menurut Ibn al-Athir, ia ditangkap oleh al-Qahir pada tahun 321 H dengan trik di mana mereka menunjukkan bahwa Abu Tahir al-Qarmati telah kembali ke Kufa untuk mengirim Ali ibn Baliq bersama pasukan dan kemudian pergi. bersama mereka. Tarif al-Subkari mengirim surat kepadanya mengundangnya ke rumah itu, dan dia datang, dikuasai oleh kesombongan dan kelemahan, menangkapnya, memenjarakannya, dan tidak melihatnya. Kemudian, ketika teman-temannya memberontak, memberontak, dan membakar cahaya rumah wazir sambil meneriakkan slogan 'Mu'nas, yang dibantai al-Qahir dalam Sha'ban 321 AH' setelah dia membawa kepala ramping dan putranya di sebuah baskom. Dia menjadi terganggu, pulih, dan mengutuk pembunuh mereka. Al-Qahir berkata, 'Mereka menyeret kaki anjing terkutuk itu,' dan dia membantunya dan membantunya dengan kepala bersama mereka di kedua sisi Baghdad. Kemudian kepala-kepala itu dikembalikan ke perbendaharaan kepala {cite: kamil-ibn-al-athir hlm. 190-195} Ibn al-Jawzi memberikan gelar al-Muzaffar dalam Rabi' al-Thani pada tahun 309 H, dan buku-buku dibuat dengan cara ini dari al-Muqtadir kepada para penguasa wilayah, dan kontrak dibuat untuknya di Jumada al-Awwal atas Mesir dan Levant {cite:muntazam-ibn-al-jawzi hlm. 449}."
