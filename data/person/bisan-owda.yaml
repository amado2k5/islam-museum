summary:
  ar: صحفية وصانعة أفلام وناشطة فلسطينية، وُلدت في بيت حانون سنة 1997 أو 1998. اشتهرت بفيديوهاتها من غزة التي تبدأ بعبارة «أنا بيسان من غزة وما زلت حية» بالتعاون مع AJ+، ونالت عنها جائزة إيمي للأخبار والوثائقيات
    وجائزة بيبودي وجائزة إدوارد ر. مورو سنة 2024.
  en: Palestinian journalist, filmmaker and activist, born in Beit Hanoun in 1997 or 1998. She became known for Gaza videos opening with 'It's Bisan from Gaza and I'm still alive' produced with AJ+, for
    which she won a News & Documentary Emmy, a Peabody Award and an Edward R. Murrow Award in 2024.
  ur: فلسطینی صحافی، فلم ساز اور کارکن، 1997 یا 1998 میں بیت حانون میں پیدا ہوئیں۔ وہ AJ+ کے ساتھ بنائی گئی اپنی ویڈیوز — جو «میں بيسان غزہ سے ہوں اور اب بھی زندہ ہوں» سے شروع ہوتی ہیں — کے سبب مشہور ہوئیں،
    جن پر انہیں 2024 میں نیوز اینڈ ڈاکیومنٹری ایمی، پیبوڈی اور ایڈورڈ آر مورو ایوارڈ ملے۔
  es: "Periodista, cineasta y activista palestina, nacida en Beit Hanoun en 1997 o 1998. Se dio a conocer por sus vídeos sobre Gaza que comenzaban con la frase \"Soy Bisan de Gaza y sigo viva\", producidos con AJ+, por los que ganó un premio Emmy de noticias y documentales, un premio Peabody y un premio Edward R. Murrow en 2024."
  fr: "Journaliste, cinéaste et militante palestinienne, née à Beit Hanoun en 1997 ou 1998. Elle s'est fait connaître grâce à ses vidéos sur Gaza qui commencent par « C'est Bisan de Gaza et je suis toujours en vie », produites avec AJ+, pour lesquelles elle a remporté un Emmy Award dans la catégorie Actualités et Documentaires, un Peabody Award et un Edward R. Murrow Award en 2024."
  tr: "1997 veya 1998 yılında Beit Hanoun'da doğmuş Filistinli bir gazeteci, film yapımcısı ve aktivisttir. AJ+ ile iş birliği içinde yaptığı \"Ben Gazze'den Bisan'ım ve hâlâ yaşıyorum\" ifadesiyle başlayan Gazze'den videolarıyla ünlendi. 2024 yılında Haber ve Belgesel dalında Emmy Ödülleri, Peabody Ödülleri ve Edward R. Morrow Ödülleri kazandı."
  id: "Seorang jurnalis, pembuat film, dan aktivis Palestina, lahir di Beit Hanoun pada tahun 1997 atau 1998. Ia menjadi terkenal berkat video-videonya dari Gaza yang dimulai dengan frasa \"Saya Bisan dari Gaza dan saya masih hidup,\" bekerja sama dengan AJ+. Ia memenangkan Emmy Awards untuk Berita dan Dokumenter, Peabody Awards, dan Edward R. Morrow Awards pada tahun 2024."
