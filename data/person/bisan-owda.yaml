summary:
  ar: صحفية وصانعة أفلام وناشطة فلسطينية، وُلدت في بيت حانون سنة 1997 أو 1998. اشتهرت بفيديوهاتها من غزة التي تبدأ بعبارة «أنا بيسان من غزة وما زلت حية» بالتعاون مع AJ+، ونالت عنها جائزة إيمي للأخبار والوثائقيات
    وجائزة بيبودي وجائزة إدوارد ر. مورو سنة 2024.
  en: Palestinian journalist, filmmaker and activist, born in Beit Hanoun in 1997 or 1998. She became known for Gaza videos opening with 'It's Bisan from Gaza and I'm still alive' produced with AJ+, for
    which she won a News & Documentary Emmy, a Peabody Award and an Edward R. Murrow Award in 2024.
  ur: فلسطینی صحافی، فلم ساز اور کارکن، 1997 یا 1998 میں بیت حانون میں پیدا ہوئیں۔ وہ AJ+ کے ساتھ بنائی گئی اپنی ویڈیوز — جو «میں بيسان غزہ سے ہوں اور اب بھی زندہ ہوں» سے شروع ہوتی ہیں — کے سبب مشہور ہوئیں،
    جن پر انہیں 2024 میں نیوز اینڈ ڈاکیومنٹری ایمی، پیبوڈی اور ایڈورڈ آر مورو ایوارڈ ملے۔
