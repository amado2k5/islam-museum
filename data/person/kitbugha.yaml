summary:
  ar: "مقدم التتار على الشام؛ سكن قلعة دمشق نائباً عن هلاكو بعد استسلامها وتسلم بعلبك وقلعتها وأخذ نابلس ونواحيها بالسيف وبقي في خدمته الملك الناصر أشهراً، ثم قُتل في المصاف يوم عين جالوت غربي بيسان ومعه طائفة من أمراء المغول {cite:shadharat-dhahab p. 298-299}."
  en: "Hulagu's lieutenant over Syria — installed in Damascus's citadel, took Baalbek and Nablus, held al-Nasir in his train; killed in the melee at Ayn Jalut with a company of Mongol amirs {cite:shadharat-dhahab p. 298-299}."
  es: "El lugarteniente de Hulagu en Siria — instalado en la ciudadela de Damasco, tomó Baalbek y Nablus, mantuvo a al-Nasir en su séquito; murió en la refriega de Ayn Jalut con una compañía de emires mongoles {cita: shadharat-dhahab págs. 298-299}."
  fr: "Lieutenant de Hulagu en Syrie — installé dans la citadelle de Damas, il prit Baalbek et Naplouse, et garda al-Nasir dans son entourage; tué dans la mêlée d'Ayn Jalut avec une compagnie d'émirs mongols {cite:shadharat-dhahab p. 298-299}."
  ur: "شام پر ہلاگو کے لیفٹیننٹ نے - دمشق کے قلعے میں نصب کیا، بعلبیک اور نابلس کو لے لیا، الناصر کو اپنی ٹرین میں رکھا؛ عین جالوت میں منگول امیروں کی ایک جماعت کے ساتھ ہنگامہ آرائی میں مارا گیا۔ 298-299}۔"
  tr: "Levant'taki Tatar lideri; teslim olduktan sonra Şam Kalesi'nde Hulagu'nun yardımcısı olarak ikamet etti, Baalbek'i ve kalesini ele geçirdi, Nablus ve çevresini kılıçla ele geçirdi ve aylarca Kral Al-Nasir ile hizmetinde kaldı. Daha sonra Beisan'ın batısındaki Ain Jalut'taki savaşlarda, bir grup Moğol prensiyle birlikte öldürüldü {cite:shadharat-dhahab, s. 298-299}."
  id: "Pemimpin Tatar atas Levant; ia tinggal di Benteng Damaskus sebagai wakil Hulagu setelah penyerahan kota itu, merebut Baalbek dan bentengnya, merebut Nablus dan sekitarnya dengan pedang, dan tetap melayani Raja Al-Nasir selama berbulan-bulan. Ia kemudian tewas dalam pertempuran di Ain Jalut, barat Beisan, bersama sekelompok pangeran Mongol {cite:shadharat-dhahab, hlm. 298-299}."
