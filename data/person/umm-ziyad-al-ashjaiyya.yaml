summary:
  ar: 'صحابية أشجعية خرجت مع النبي في غزوة خيبر مع خمس نسوة أخريات، فسألهن النبي: «بإذن من خرجتن؟» فأجبن أنهن خرجن لمداواة الجرحى ومناولة السهام وسقي السويق، فقُسم لهن من التمر.'
  en: A Companion of Ashja' who went out with the Prophet on the Khaybar campaign with five other women; the Prophet asked 'With whose leave did you come out?' and they answered that they had come to treat the wounded, hand out arrows and give
    out barley drink, and dates were apportioned to them.
