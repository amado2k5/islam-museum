summary:
  ar: 'صحابية أشجعية خرجت مع النبي في غزوة خيبر مع خمس نسوة أخريات، فسألهن النبي: «بإذن من خرجتن؟» فأجبن أنهن خرجن لمداواة الجرحى ومناولة السهام وسقي السويق، فقُسم لهن من التمر.'
  en: A Companion of Ashja' who went out with the Prophet on the Khaybar campaign with five other women; the Prophet asked 'With whose leave did you come out?' and they answered that they had come to treat the wounded, hand out arrows and give
    out barley drink, and dates were apportioned to them.
  ur: "اشجع کی صحابیہ جو خیبر کی مہم میں پانچ دیگر عورتوں کے ساتھ نبی کے ساتھ گئی؛ نبی نے پوچھا «کس کی اجازت سے نکلیں»۔"
  es: "Una compañera de Ashja' que salió con el Profeta en la campaña de Khaybar con otras cinco mujeres; el Profeta preguntó: \"¿Con permiso de quién habéis salido?\" y ellas respondieron que habían venido a atender a los heridos, repartir flechas y dar bebida de cebada, y se les repartieron dátiles."
  fr: "Une compagne d'Ashja' qui était partie avec le Prophète lors de la campagne de Khaybar avec cinq autres femmes; le Prophète leur demanda: « Avec la permission de qui êtes-vous venues ? » et elles répondirent qu'elles étaient venues soigner les blessés, distribuer des flèches et de la boisson à l'orge, et des dattes leur furent attribuées."
