summary:
  ar: "موظّف في الإدارة النمساوية المجرية من أصل بافاري، وهو المؤسّس والمدير الأول للمتحف الوطني للبوسنة والهرسك في سراييفو؛ جمع ونشر مجموعة مبكرة كبرى من الشعر الشفهي لمسلمي البوسنة في جزأين (1888–1889)، وأسّس مجلة المتحف وحرّرها وأطلق مجلة «ندا» الأدبية."
  en: "Austro-Hungarian official of Bavarian descent and founding director of the National Museum of Bosnia and Herzegovina in Sarajevo. He compiled and published an early major collection of Bosnian Muslim oral poetry in two volumes (1888–89), founded and edited the museum journal Glasnik and launched the literary magazine Nada."
  ur: "باویرین نسل کے آسٹرو ہنگری اہلکار اور سرائیوو میں بوسنیا و ہرزیگوینا کے قومی عجائب گھر کے بانی و پہلے ڈائریکٹر۔ انھوں نے بوسنیائی مسلمانوں کی زبانی شاعری کا بڑا ابتدائی مجموعہ دو جلدوں میں مرتب و شائع کیا (1888–89)، عجائب گھر کا جریدہ جاری و مرتب کیا اور ادبی مجلہ «ندا» کی بنیاد رکھی۔"
