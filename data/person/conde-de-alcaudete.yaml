summary:
  ar: "حاكم وهران الأسباني؛ إليه بعث المزوار بوغانم رسالة وساطة السعديين مطلع ربيع الأول ٩٦٣هـ/يناير ١٥٥٥م، فأرسل إلى فاس وفداً من ثلاثة للاتفاق على حملة مشتركة ضد العثمانيين، ثم رفع تقرير الوفد إلى الأمير فليب بن الإمبراطور شارل مشفوعاً بخطاب يعلن فيه استعداده هو ومن حوله ليكونوا رهائن لدى الشريف إن اقتضت الصفقة {cite:dawlat-uthmaniyya-salabi p. 241-243}. ولما أدرك أن استرجاع العثمانيين تلمسان يهدد الوجود الأسباني أعد اثني عشر ألف مقاتل وهاجم مستغانم ليجعلها قاعدة للهجوم على الجزائر، فباءت محاولته بالفشل وقُتل مع خسائر فادحة في ذي القعدة ٩٦٥هـ/أغسطس ١٥٥٨م {cite:dawlat-uthmaniyya-salabi p. 246}."
  en: "The Spanish governor of Oran. Al-Muzawwar Bu Ghannam's mediation letter reached him early Rabi' I 963/January 1555; he sent a three-man embassy to Fez to arrange a joint anti-Ottoman campaign, then forwarded its report to Prince Philip, Charles's son, with a letter declaring himself and all his household ready to be the sharif's hostages if the bargain required it {cite:dawlat-uthmaniyya-salabi p. 241-243}. Seeing the Ottoman recovery of Tlemcen as a mortal threat to Spanish Oran, he led twelve thousand men against Mostaganem to make it his base against Algiers; the attempt failed and he was killed in Dhu'l-Qa'da 965/August 1558 {cite:dawlat-uthmaniyya-salabi p. 246}."
  es: "El gobernador español de Orán, Al-Muzawwar Bu Ghannam, recibió a principios de Rabi' I de 963/enero de 1555 una carta de mediación. Envió una embajada de tres hombres a Fez para organizar una campaña conjunta contra los otomanos y luego remitió su informe al príncipe Felipe, hijo de Carlos, con una carta en la que se declaraba a sí mismo y a toda su casa dispuestos a ser rehenes del jerife si el trato lo requería {cite:dawlat-uthmaniyya-salabi p. 241-243}. Al ver la recuperación otomana de Tlemcen como una amenaza mortal para el Orán español, dirigió a doce mil hombres contra Mostaganem para convertirla en su base contra Argel; el intento fracasó y murió en Dhu'l-Qa'da de 965/agosto de 1558 {cite:dawlat-uthmaniyya-salabi p. 246}."
  fr: "Le gouverneur espagnol d'Oran, Al-Muzawwar Bu Ghannam, reçut la lettre de médiation au début du mois de Rabi' I 963/janvier 1555. Il dépêcha une ambassade de trois hommes à Fès afin d'organiser une campagne conjointe contre les Ottomans, puis transmit son rapport au prince Philippe, fils de Charles, accompagné d'une lettre dans laquelle il se déclarait, ainsi que toute sa maisonnée, prêts à être les otages du chérif si les négociations l'exigeaient (voir: Dawlat-Uthmaniyya-Salabi, p. 241-243). Percevant la reprise de Tlemcen par les Ottomans comme une menace mortelle pour Oran, il mena douze mille hommes contre Mostaganem afin d'en faire sa base contre Alger; la tentative échoua et il fut tué en Dhu'l-Qa'da 965/août 1558 (voir: Dawlat-Uthmaniyya-Salabi, p. 246)."
  ur: "اوران کا ہسپانوی گورنر۔ المزور بو غنم کا ثالثی خط ربیع اول 963/جنوری 1555ء کے اوائل میں پہنچا۔ اس نے تین افراد پر مشتمل ایک سفارت خانہ فیز کو بھیجا تاکہ ایک مشترکہ خلاف عثمانی مہم کا انتظام کیا جائے، پھر اس کی رپورٹ چارلس کے بیٹے شہزادہ فلپ کو ایک خط کے ساتھ بھیجی جس میں یہ اعلان کیا گیا تھا کہ اگر سودا کی ضرورت پڑی تو وہ خود کو اور اپنے تمام گھر والوں کو شریف کا یرغمال بنانے کے لیے تیار ہیں۔ 241-243}۔ Tlemcen کی عثمانی بازیابی کو ہسپانوی اوران کے لیے ایک جان لیوا خطرہ کے طور پر دیکھتے ہوئے، اس نے بارہ ہزار آدمیوں کی قیادت مستگنیم کے خلاف کی تاکہ اسے الجزائر کے خلاف اپنا اڈہ بنایا جا سکے۔ یہ کوشش ناکام ہوئی اور ذوالقعدہ 965/اگست 1558 میں مارا گیا۔ 246}۔"
