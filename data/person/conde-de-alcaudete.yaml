summary:
  ar: "حاكم وهران الأسباني؛ إليه بعث المزوار بوغانم رسالة وساطة السعديين مطلع ربيع الأول ٩٦٣هـ/يناير ١٥٥٥م، فأرسل إلى فاس وفداً من ثلاثة للاتفاق على حملة مشتركة ضد العثمانيين، ثم رفع تقرير الوفد إلى الأمير فليب بن الإمبراطور شارل مشفوعاً بخطاب يعلن فيه استعداده هو ومن حوله ليكونوا رهائن لدى الشريف إن اقتضت الصفقة {cite:dawlat-uthmaniyya-salabi p. 241-243}. ولما أدرك أن استرجاع العثمانيين تلمسان يهدد الوجود الأسباني أعد اثني عشر ألف مقاتل وهاجم مستغانم ليجعلها قاعدة للهجوم على الجزائر، فباءت محاولته بالفشل وقُتل مع خسائر فادحة في ذي القعدة ٩٦٥هـ/أغسطس ١٥٥٨م {cite:dawlat-uthmaniyya-salabi p. 246}."
  en: "The Spanish governor of Oran. Al-Muzawwar Bu Ghannam's mediation letter reached him early Rabi' I 963/January 1555; he sent a three-man embassy to Fez to arrange a joint anti-Ottoman campaign, then forwarded its report to Prince Philip, Charles's son, with a letter declaring himself and all his household ready to be the sharif's hostages if the bargain required it {cite:dawlat-uthmaniyya-salabi p. 241-243}. Seeing the Ottoman recovery of Tlemcen as a mortal threat to Spanish Oran, he led twelve thousand men against Mostaganem to make it his base against Algiers; the attempt failed and he was killed in Dhu'l-Qa'da 965/August 1558 {cite:dawlat-uthmaniyya-salabi p. 246}."
