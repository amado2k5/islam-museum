summary:
  ar: "عالم أزهري مصري (1832–1917)؛ وُلد في محلة بشر بالبحيرة ودرس في الأزهر، وتولى مشيخة الأزهر مرتين (1899–1903 ومن 1909 حتى وفاته)، وكان من فقهاء المالكية ورئيس علمائهم في الأزهر، وله مؤلفات في النحو والتوحيد والأدب، وتوفي في القاهرة ودُفن في مدفن السادة المالكية بقرافة السيدة نفيسة."
  en: "Egyptian Azhari scholar (1832–1917). Born at Mahallat Bishr in Beheira and educated at al-Azhar, he served twice as Shaykh al-Azhar (1899–1903 and 1909 until his death); he was a Maliki jurist and head of the Maliki scholars at al-Azhar, wrote on grammar, theology and literature, and died in Cairo, where he was buried in the Maliki cemetery in the Qarafa of Sayyida Nafisa."
  ur: "مصری ازہری عالم (1832–1917)؛ بحیرہ کے گاؤں محلہ بشر میں پیدا ہوئے اور الازہر میں تعلیم پائی، دو بار شیخ الازہر بنے (1899–1903 اور 1909 سے وفات تک)؛ وہ مالکی فقیہ اور الازہر میں مالکی علما کے سربراہ تھے، نحو و عقائد و ادب پر کتابیں لکھیں، اور قاہرہ میں انتقال کر کے قرافہ سیدہ نفیسہ کے مالکی قبرستان میں دفن ہوئے۔"
