summary:
  ar: "أنتوني تان (وُلد سنة 1982 في كوالالمبور بماليزيا، واسمه الصيني تشين بينغياو) رجل أعمال ماليزي المولد سنغافوري، شارك في تأسيس شركة طلب سيارات الأجرة مايتكسي سنة 2012 — التي أُعيدت تسميتها غراب — وهو رئيسها التنفيذي للمجموعة؛ درس في جامعة شيكاغو وكلية هارفارد للأعمال حيث وضع مع زميلته تان هوي لينغ (لا قرابة بينهما) خطة العمل الفائزة، وحصل على الجنسية السنغافورية سنة 2016 حين نقلت الشركة مقرها إلى سنغافورة، وأدرجته فوربس سنة 2021 بين أغنى أهل سنغافورة."
  en: "Anthony Tan (born 1982 in Kuala Lumpur, Malaysia; Chinese name Chen Bingyao) is a Malaysian-born Singaporean businessman, co-founder in 2012 of the taxi-booking company MyTeksi — rebranded Grab — and its group chief executive; educated at the University of Chicago and Harvard Business School, where he and his classmate Tan Hooi Ling (no relation) wrote the winning business plan, he took Singapore citizenship in 2016 as the company moved its headquarters to Singapore, and Forbes listed him among Singapore's richest people in 2021."
  ur: "انتھونی ٹان (پیدائش 1982، کوالالمپور، ملائیشیا؛ چینی نام چن بنگیاؤ) ملائیشیا میں پیدا ہونے والے سنگاپوری کاروباری ہیں، 2012 میں ٹیکسی بکنگ کمپنی مائی ٹیکسی — جس کا نام گریب رکھا گیا — کے شریک بانی اور اس کے گروپ چیف ایگزیکٹو ہیں؛ شکاگو یونیورسٹی و ہارورڈ بزنس اسکول سے تعلیم پائی جہاں انھوں نے اپنی ہم جماعت ٹان ہوئی لنگ (جن سے ان کا کوئی رشتہ نہیں) کے ساتھ فاتح کاروباری منصوبہ لکھا، 2016 میں کمپنی کے صدر دفتر کی سنگاپور منتقلی کے ساتھ سنگاپوری شہریت لی، اور فوربز نے 2021 میں انھیں سنگاپور کے امیر ترین افراد میں شمار کیا۔"
