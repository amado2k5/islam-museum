summary:
  en: "A tribal chief who rode out hunting the Quraysh bounty on the Prophet's head, but on meeting him embraced Islam on the spot with seventy of his people, and raised his turban on his spear as a banner of safe-conduct."
  ar: "رئيس قومه خرج في طلب النبي رجاء مكافأة قريش؛ فلما لقيه وكلّمه أسلم مكانه مع سبعين رجلاً من قومه، ثم نزع عمامته وعقدها برمحه راية تعلن بأن ملك الأمن والسلام قد جاء."
  ur: "قبائلی سردار جو نبی کے سر پر قریش کے انعام کے شکار نکلا، مگر ان سے ملاقات پر ستر افراد کے ساتھ اسی وقت مسلمان ہوا۔"
  fr: "Chef de tribu parti à la poursuite de la récompense promise par Quraysh pour la tête du Prophète, qui, en le rencontrant, embrassa l'islam sur-le-champ avec soixante-dix des siens, et hissa son turban au bout de sa lance comme bannière de sauf-conduit."
  es: "Un jefe tribal que salió a cazar a los Quraysh con la recompensa ofrecida por la cabeza del Profeta, al encontrarse con él, abrazó el Islam en el acto junto con setenta de su gente, y alzó su turbante sobre su lanza como estandarte de salvoconducto."
  tr: "Halkının reisi, Kureyş'ten bir ödül umarak Peygamberi aramaya çıktı. Onunla karşılaştığında ve konuştuğunda, yetmiş adamıyla birlikte anında İslam'ı kabul etti. Sonra sarığını çıkarıp mızrağına bağlayarak, güvenlik ve barış kralının geldiğini ilan eden bir sancak gibi astı."
  id: "Pemimpin kaumnya pergi mencari Nabi, dengan harapan mendapat hadiah dari kaum Quraisy. Ketika ia bertemu dan berbicara dengan Nabi, ia langsung memeluk Islam bersama tujuh puluh orang dari kaumnya. Kemudian ia melepas sorbannya dan mengikatnya pada tombaknya sebagai panji yang mengumumkan bahwa raja keamanan dan perdamaian telah datang."
