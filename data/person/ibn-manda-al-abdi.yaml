summary:
  ar: "الحافظ أبو عبد الله محمد بن يحيى بن منده العبدي الحافظ المشهور صاحب كتاب «تاريخ أصبهان»؛ كان أحد الحفاظ الثقات وهم أهل بيت كبير خرج منه جماعة من العلماء، وإنما أمّ الحافظ المذكور وأمها برة بنت محمد كانتا من بني عبد الله فنُسب إلى أخواله {cite:wafayat-ayan}."
  tr: "Ezberci Ebu Abdullah Muhammed bin Yahya ibn Manda el-Abdi, ünlü hadis âlimi ve 'Tarih İsfahan' kitabının yazarı; kendisi, bir grup alimin çıktığı seçkin bir evden güvenilir ezbercilerden biriydi. Bahsi geçen Hafız'ın annesi ve annesi Barrah bint Muhammed Banu Abdullah'tan geldikleri için annesinin amcalarına atfedilmiştir {atıf:wafayat-ayan}."
  id: "Pengapal Abu Abdullah Muhammad ibn Yahya ibn Manda al-Abdi, ulama hadis terkenal, penulis buku 'Tarikh Isfahan'; ia adalah salah satu penghafal terpercaya dari keluarga terkemuka yang menjadi sumber sekelompok ulama. Ibu Hafiz yang disebutkan tadi dan ibunya Barrah bint Muhammad berasal dari Banu Abdullah, sehingga ia dikaitkan dengan paman dari pihak ibu {cite:wafayat-ayan}."
