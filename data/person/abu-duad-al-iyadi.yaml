  ar: "أبو دؤاد الإيادي، شاعر جاهلي من الحيرة، معاصر للمنذر بن ماء السماء (نحو 506-554م) الذي ولّاه على خيله، واشتهر بوصف الخيل. {cite:encyclopaedia-of-islam-2 vol. 1 p. 134}"
  en: "Abu Duad al-Iyadi, a pre-Islamic poet of al-Hira, a contemporary of al-Mundhir b. Ma' al-Sama' (about 506-554), who put him in charge of his horses, and famous for his descriptions of horses. {cite:encyclopaedia-of-islam-2 vol. 1 p. 134}"
  ur: "ابو دؤاد الایادی، حیرہ کے ایک قبل از اسلام کے شاعر، جو منذر بن ماء السماء (تقریباً 506-554ء) کے ہم عصر تھے، جنہوں نے انہیں اپنے گھوڑوں کا نگران مقرر کیا، اور گھوڑوں کے وصف میں مشہور تھے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 134}"
