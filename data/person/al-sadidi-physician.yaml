summary:
  ar: "الشيخ السديد شيخ الطب بالديار المصرية شرف الدين عبد الله بن علي؛ أخذ الصناعة عن الموفق ابن المطين وخدم العاضد صاحب مصر ونال الحرمة والجاه العريض وعمر دهراً، وأخذ عنه نفيس الدين ابن الزبير، وحكى بعضهم أن الشيخ السديد حصل له في يوم ثلاثون ألف دينار، وحكى عنه ابن الزبير تلميذه أنه طهر ولد الحافظ لدين الله فحصل له من الذهب نحو خمسين ألف دينار؛ توفي سنة اثنتين وتسعين وخمسمائة {cite:shadharat-dhahab p. 789}."
  en: "Al-Shaykh al-Sadidi Sharaf al-Din Abdallah b. Ali, head of medicine in Egypt; trained under al-Muwaffaq Ibn al-Matin and served al-Adid, winning wide honour and a long life; among his pupils Nafis al-Din Ibn al-Zubayr. It was said his take in one day was thirty thousand dinars, and his student Ibn al-Zubayr told that he circumcised al-Hafiz li-Din Allah's son for about fifty thousand in gold. He died in 592 {cite:shadharat-dhahab p. 789}."
