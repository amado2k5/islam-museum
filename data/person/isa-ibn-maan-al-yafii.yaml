label:
  ar: "عيسى بن معان اليافعي"
  en: "Isa ibn Ma'an al-Yafi'i"
  ur: "عیسیٰ بن معان یافعی"
summary:
  ar: "رجل من خيار يافع حبسه ابن خلف فاحتال في الحبس حتى خرج منه، فنُقل أبو القاسم ابن الهادي من أجل ذلك إلى دار أخرى، ثم صار اليافعي إلى حراز."
  en: "A man of the best of Yafi' jailed by Ibn Khalaf, who worked at the prison until he got out of it, because of which al-Hadi's son Abu al-Qasim was moved to another house, and who later reached Haraz."
  ur: "یافع کے بہتر لوگوں میں سے ایک شخص جسے ابن خلف نے قید کیا تھا اور جو قید میں کوشش کرتا رہا یہاں تک کہ نکل گیا، جس کے سبب ہادی کے بیٹے ابو القاسم کو دوسرے گھر منتقل کیا گیا، اور جو بعد میں حراز پہنچا۔"
