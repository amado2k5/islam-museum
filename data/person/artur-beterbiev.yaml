summary:
  ar: "ملاكم محترف روسي وكندي ⁦(وُلد سنة 1985 في خاسافيورت بداغستان، من أصل شيشاني)⁩. بطل العالم للهواة سنة 2009، فاز بنزالاته الاحترافية العشرين الأولى كلها بالضربة القاضية، وحمل ألقاب الاتحاد الدولي للملاكمة والمجلس العالمي للملاكمة ورابطة الملاكمة العالمية لخفيف الثقيل، وصار البطل بلا منازع في أكتوبر 2024 بفوزه على دميتري بيفول، ثم خسر نزال الإعادة في فبراير 2025؛ سجله 21 فوزا ⁦(20 بالضربة القاضية)⁩ وهزيمة واحدة. يقيم في مونتريال ويحمل الجنسية الكندية."
  en: "Russian and Canadian professional boxer (born 1985 in Khasavyurt, Dagestan, of Chechen descent). A world amateur champion in 2009, he won his first 20 professional fights by knockout, held the IBF, WBC and WBA light-heavyweight titles, and became undisputed champion in October 2024 by beating Dmitry Bivol, losing the rematch in February 2025; his record stands at 21 wins (20 by knockout) and one loss. He lives in Montreal and is a Canadian citizen."
  ur: "روسی و کینیڈین پیشہ ور مکے باز ⁦(پیدائش 1985، خاسافیورت، داغستان، چیچن نژاد)⁩۔ 2009 کے عالمی امیچر چیمپئن، انہوں نے اپنے پہلے 20 پیشہ ورانہ مقابلے ناک آؤٹ سے جیتے، آئی بی ایف، ڈبلیو بی سی اور ڈبلیو بی اے لائٹ ہیوی ویٹ ٹائٹل رکھے، اور اکتوبر 2024 میں دمتری بیول کو ہرا کر بلا مقابلہ چیمپئن بنے، پھر فروری 2025 میں ری میچ ہار گئے؛ ان کا ریکارڈ 21 فتوحات ⁦(20 ناک آؤٹ)⁩ اور ایک شکست ہے۔ وہ مونٹریال میں رہتے ہیں اور کینیڈین شہری ہیں۔"
  es: "Boxeador profesional ruso y canadiense (nacido en 1985 en Khasavyurt, Daguestán, de ascendencia chechena). Campeón mundial amateur en 2009, ganó sus primeras 20 peleas profesionales por nocaut, ostentó los títulos de peso semipesado de la FIB, el CMB y la AMB, y se convirtió en campeón indiscutible en octubre de 2024 al vencer a Dmitry Bivol, perdiendo la revancha en febrero de 2025; su récord es de 21 victorias (20 por nocaut) y una derrota. Reside en Montreal y es ciudadano canadiense."
  fr: "Boxeur professionnel russo-canadien (né en 1985 à Khasavyurt, au Daghestan, d'origine tchétchène). Champion du monde amateur en 2009, il a remporté ses 20 premiers combats professionnels par KO, a détenu les titres IBF, WBC et WBA des mi-lourds et est devenu champion incontesté en octobre 2024 en battant Dmitry Bivol, avant de s'incliner lors du match revanche en février 2025. Son palmarès est de 21 victoires (dont 20 par KO) et une défaite. Il réside à Montréal et possède la nationalité canadienne."
  tr: "Profesyonel bir Rus ve Kanadalı boksör (1985'te Dağıstan'ın Khasavoort kentinde doğmuş, Çeçen kökenli). 2009'da Dünya Amatör Şampiyonu oldu, ilk yirmi profesyonel maçının tamamını nakavtla kazandı; Uluslararası Boks Federasyonu, Dünya Boks Konseyi ve Dünya Hafif Ağır Siklet Boks Birliği'ni elinde bulundurdu. Ekim 2024'te Dmitry Bivol'u yenerek tartışmasız şampiyon oldu, ardından Şubat 2025'te rövanşta kaybetti; 21 galibiyet (20'si nakavtla) ve bir mağlubiyet aldı. Montreal'de yaşıyor ve Kanada vatandaşlığına sahip."
  id: "Petinju profesional Rusia dan Kanada (lahir tahun 1985 di Khasavoort, Dagestan, keturunan Chechnya). Juara Amatir Dunia tahun 2009, memenangkan semua dua puluh pertarungan profesional pertamanya dengan knockout, memegang gelar International Boxing Federation, World Boxing Council, dan World Light Heavyweight Boxing Association. Ia menjadi juara tak terbantahkan pada Oktober 2024 dengan mengalahkan Dmitry Bivol, lalu kalah dalam pertandingan ulang pada Februari 2025; ia mencatat 21 kemenangan (20 lewat KO) dan satu kekalahan. Ia tinggal di Montreal dan memiliki kewarganegaraan Kanada."
