summary:
  ar: "ملاكم محترف روسي وكندي (وُلد سنة 1985 في خاسافيورت بداغستان، من أصل شيشاني). بطل العالم للهواة سنة 2009، فاز بنزالاته الاحترافية العشرين الأولى كلها بالضربة القاضية، وحمل ألقاب الاتحاد الدولي للملاكمة والمجلس العالمي للملاكمة ورابطة الملاكمة العالمية لخفيف الثقيل، وصار البطل بلا منازع في أكتوبر 2024 بفوزه على دميتري بيفول، ثم خسر نزال الإعادة في فبراير 2025؛ سجله 21 فوزا (20 بالضربة القاضية) وهزيمة واحدة. يقيم في مونتريال ويحمل الجنسية الكندية."
  en: "Russian and Canadian professional boxer (born 1985 in Khasavyurt, Dagestan, of Chechen descent). A world amateur champion in 2009, he won his first 20 professional fights by knockout, held the IBF, WBC and WBA light-heavyweight titles, and became undisputed champion in October 2024 by beating Dmitry Bivol, losing the rematch in February 2025; his record stands at 21 wins (20 by knockout) and one loss. He lives in Montreal and is a Canadian citizen."
  ur: "روسی و کینیڈین پیشہ ور مکے باز (پیدائش 1985، خاسافیورت، داغستان، چیچن نژاد)۔ 2009 کے عالمی امیچر چیمپئن، انہوں نے اپنے پہلے 20 پیشہ ورانہ مقابلے ناک آؤٹ سے جیتے، آئی بی ایف، ڈبلیو بی سی اور ڈبلیو بی اے لائٹ ہیوی ویٹ ٹائٹل رکھے، اور اکتوبر 2024 میں دمتری بیول کو ہرا کر بلا مقابلہ چیمپئن بنے، پھر فروری 2025 میں ری میچ ہار گئے؛ ان کا ریکارڈ 21 فتوحات (20 ناک آؤٹ) اور ایک شکست ہے۔ وہ مونٹریال میں رہتے ہیں اور کینیڈین شہری ہیں۔"
