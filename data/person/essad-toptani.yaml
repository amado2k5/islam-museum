summary:
  ar: "سياسي وضابط عثماني ألباني من تيرانا، رئيس وزراء ألبانيا 1914–1916 ومؤسس جمهورية ألبانيا الوسطى في دوريس، واغتيل في باريس سنة 1920؛ ويذكره كثير من الألبان بوصفه خائناً لتسليمه شكودر ولتحالفه مع صربيا."
  en: "Albanian politician and Ottoman officer from Tirana, prime minister of Albania from 1914 to 1916 and founder of the Republic of Central Albania based at Durrës; assassinated in Paris in 1920 and remembered by many Albanians as a traitor for surrendering Shkodër and for his alliance with Serbia."
  ur: "تیرانا سے تعلق رکھنے والے البانوی سیاست دان اور عثمانی افسر، 1914 سے 1916 تک البانیا کے وزیرِ اعظم اور دوریس میں قائم وسطی البانیا جمہوریہ کے بانی؛ 1920 میں پیرس میں قتل ہوئے اور اشقودرہ کے حوالے کرنے اور صربیا سے اتحاد کی وجہ سے بہت سے البانوی انھیں غدار سمجھتے ہیں۔"
