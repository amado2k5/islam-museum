summary:
  ar: "سليمان بن كثير الخزاعي، نقيب النقباء في الدعوة العباسية بخراسان؛ استماله الإمام إبراهيم بن محمد بنفوذه الشخصي فأعاد التلاحم بين الجماعة الخراسانية والرئاسة في الحميمة، وعرض عليه إبراهيم قيادة الدعوة فاعتذر شيخاً مسناً قائلاً «لا آلي على اثنين من الناس»، فاختير أبو مسلم مكانه؛ وأعلن هو الثورة في خراسان يوم الخميس ٢٥ رمضان ١٢٩هـ على يديه، واتخذ الأنصار السواد شعاراً فعرفوا بالمسودة، وأقام أول صلاة لهم في سفيذنج يوم عيد الفطر؛ ولما تفرد أبو مسلم بالأمر قتل سليمان بن كثير وابنه محمد دون العودة إلى الخليفة {cite:tarikh-dawla-abbasiyya-taqqush p. 22-25}."
  en: "Sulayman ibn Kathir al-Khuza'i — the naqib of naqibs who proclaimed the revolution on 25 Ramadan 129 AH, declined its leadership, and was put to death by Abu Muslim {cite:tarikh-dawla-abbasiyya-taqqush p. 22-25}."
