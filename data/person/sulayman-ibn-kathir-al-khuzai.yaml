label: { ar: "سليمان بن كثير الخزاعي" }
gender: male
roles: [agent, military]
summary:
  ar: "سليمان بن كثير الخزاعي، نقيب النقباء في الدعوة العباسية بخراسان؛ استماله الإمام إبراهيم بن محمد بنفوذه الشخصي فأعاد التلاحم بين الجماعة الخراسانية والرئاسة في الحميمة، وعرض عليه إبراهيم قيادة الدعوة فاعتذر شيخاً مسناً قائلاً «لا آلي على اثنين من الناس»، فاختير أبو مسلم مكانه؛ وأعلن هو الثورة في خراسان يوم الخميس ٢٥ رمضان ١٢٩هـ على يديه، واتخذ الأنصار السواد شعاراً فعرفوا بالمسودة، وأقام أول صلاة لهم في سفيذنج يوم عيد الفطر؛ ولما تفرد أبو مسلم بالأمر قتل سليمان بن كثير وابنه محمد دون العودة إلى الخليفة {cite:tarikh-dawla-abbasiyya-taqqush p. 22-25}."
  en: "Sulayman ibn Kathir al-Khuza'i — the naqib of naqibs who proclaimed the revolution on 25 Ramadan 129 AH, declined its leadership, and was put to death by Abu Muslim {cite:tarikh-dawla-abbasiyya-taqqush p. 22-25}."
  es: "Sulayman ibn Kathir al-Khuza'i, el naqib de los naqibs que proclamó la revolución el 25 de Ramadán de 129 AH, declinó su liderazgo y fue ejecutado por Abu Muslim {citar:tarikh-dawla-abbasiyya-taqqush p. 22-25}."
  fr: "Sulayman ibn Kathir al-Khuza'i — le naqib des naqibs qui a proclamé la révolution le 25 Ramadan 129 AH, a décliné sa direction et a été mis à mort par Abu Muslim {cite: tarikh-dawla-abbasiyya-taqqush p. 22-25}."
  ur: "سلیمان بن کثیر الخزاعی - نقیبوں کے نقیب تھے جنہوں نے 25 رمضان 129 ہجری کو انقلاب کا اعلان کیا، اس کی قیادت سے انکار کر دیا، اور ابو مسلم کے ہاتھوں قتل کر دیا گیا۔ 22-25}۔"
  tr: "Horasan'daki Abbasi hareketinin liderlerinin başı olan Süleyman bin Kathir el-Huza'i, İmam İbrahim bin Muhammed tarafından kişisel etkisiyle ele geçirildi ve Horasani cemaati ile el-Hümaymah liderliği arasında birlik yeniden kuruldu. İbrahim ona misyonun liderliğini teklif etti, ancak yaşlı bir şeyh 'İki kişi üzerinde otorite yoktur.' diyerek özür diledi. Yerine Ebu Müslim seçildi; 25 Ramazan 129 Hicri Perşembe günü Horasan'da devrimi onun aracılığıyla ilan etti. Ensar, 'al-mudsawa' olarak bilinen siyah sloganı benimsedi. İlk namazlarını Kurban Bayramı'nda Sufaithang'da yaptı. Ebu Müslim tek başına mülkiyete geçtiğinde, halifeliğe dönmeden Süleyman bin Kathir ve oğlu Muhammed'i öldürdü {cite:history-dawla-abbasiyya-taqquş s. 22-25}."
  id: "Sulayman ibn Kathir al-Khuza'i, pemimpin gerakan Abbasiyah di Khorasan, ditangkap oleh Imam Ibrahim ibn Muhammad dengan pengaruh pribadinya, yang mengembalikan persatuan antara komunitas Khorasani dan kepemimpinan di al-Humaymah. Ibrahim menawarkan kepemimpinan misi kepadanya, tetapi seorang sheikh tua meminta maaf dengan berkata, 'Tidak ada otoritas atas dua orang.' Abu Muslim dipilih menggantikannya; ia menyatakan revolusi di Khurasan pada hari Kamis, 25 Ramadan 129 H, melalui dirinya. Ansar mengadopsi hitam-hitam sebagai slogan mereka, yang dikenal sebagai 'al-mudsawa.' Ia mengadakan shalat pertama mereka di Sufaithang pada Idul Fitri. Ketika Abu Muslim mengambil alih sendiri, ia membunuh Sulayman ibn Kathir dan putranya Muhammad tanpa kembali ke khalifah {cite:history-dawla-abbasiyya-taqqush hlm. 22-25}."
