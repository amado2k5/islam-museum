summary:
  ar: "عالم ومربٍّ تيجاني سنغالي (1925–2017)، ابن سرين بابكر سي وحفيد الحاج مالك سي. أسس منذ سنة 1950 حركة تعليمية بين شباب المسلمين المتعلمين — «كوزري ميزولمان» ومجلة «الإسلام الأبدي» واتحادات الداهرات — وكان المرشد الروحي لجماعة المسترشدين والمسترشدات. أسس حزب التضامن السنغالي (1959) وعمل سفيرًا لدى الجمهورية العربية المتحدة وكان من كبار الصناعيين. اعترفت به أسرته في سنواته الأخيرة خليفةً لها، وتوفي في داكار في 15 مارس 2017."
  en: "Senegalese Tijani scholar and teacher (1925–2017), son of Serigne Babacar Sy and grandson of El Hadj Malick Sy. From 1950 he built a teaching movement among Senegal's educated Muslim youth — the Causerie musulmane instructive, the journal L'Islam éternel and the federation of the dahiras — and he was the spiritual guide of the Dahiratoul Moustarchidina wal Moustarchidaty. He founded the Parti de la Solidarité Sénégalaise (1959), served as ambassador to the United Arab Republic, and became a major industrialist. In his last years the Sy family recognised him as its khalifa; he died at Dakar on 15 March 2017."
  ur: "سینیگال کے تیجانی عالم اور معلم (1925ء–2017ء)، سرین بابکر سی کے فرزند اور الحاج مالک سی کے پوتے۔ انھوں نے 1950ء سے سینیگال کے تعلیم یافتہ مسلم نوجوانوں میں ایک تعلیمی تحریک قائم کی — «کوزری مسلمان»، رسالہ «اسلامِ ابدی» اور داہروں کی فیڈریشن — اور وہ جماعتِ مسترشدین کے روحانی مرشد تھے۔ انھوں نے پارٹی آف سینیگالیز سولڈیریٹی (1959ء) بنائی، متحدہ عرب جمہوریہ میں سفیر رہے اور بڑے صنعت کار بنے۔ آخری برسوں میں سی خاندان نے انھیں اپنا خلیفہ تسلیم کیا؛ وہ 15 مارچ 2017ء کو ڈکار میں وفات پا گئے۔"
