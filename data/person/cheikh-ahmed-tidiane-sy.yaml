    basis: documented
    note: "Settled on attestation of the man himself, expressly not on descent or office — his hereditary khalifa is not the evidence, and his father's record stands unknown on headship alone under the same restored rule. First family, the French article on him: born into the Tijaniyya to a khalifa father, 'il est tout à fait normal qu'il soit initié dans ce cadre' — he was initiated within that framework; his adherence to the Tijaniyya 'ne découle pas forcément de ses ascendants familiaux', resting instead on values he found in his namesake Ahmad al-Tijani; and the article quotes his own verse 'Mon Seigneur m'a béni en ce que je m'appelle At-Tijany' ('My Lord has blessed me in that I am named At-Tijany') and lists his homage Nahnou Awladou Tijani ('We are the children of Tijani'). Second family, the French article on his son Serigne Moustapha Sy and the scholarship it cites — Villalon's chapter 'The Moustarchidine of Senegal. The Family Politics of a Contemporary Tijan Movement' in Triaud (ed.), La Tijâniyya (Karthala, 2005), and Samson's Karthala monograph on the movement (2005): the Dahiratoul Moustarchidina wal Moustarchidaty 'est sorti du giron de la confrérie tidiane', and on 20 February 1978 Serigne Cheikh Ahmed Tidiane Sy, as its spiritual guide, confirmed the movement's official character — a Tijani movement he personally guided from the 1970s, decades before his family's late recognition of him as khalifa, a 'khalife général' title he himself rejected as colonial. His initiation and professed adherence in one family and his personal guidance of a Tijani movement in a second settle sufi. No source names a legal school for him, and tariqa is not madhhab, so no sunni segment is recorded. Wikidata carries no religion value."
