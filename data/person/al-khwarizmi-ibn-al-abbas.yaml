summary:
  ar: "أبو بكر محمد بن العباس الخوارزمي الشاعر المشهور ويقال له الطبرخزي لأن أباه من خوارزم وأمه من طبرستان، وهو ابن أخت أبي جعفر الطبري صاحب التاريخ؛ وكان مولده سنة ثلاث وعشرين وثلاثمائة على ما ذكره الثعالبي في اليتيمة؛ وكان أحد الشعراء المجيدين الكبار وإماماً في اللغة والأنساب، أقام بالشام مدة وسكن بنواحي حلب؛ يُحكى أنه قصد الصاحب ابن عباد فقال له الحاجب إن مولاه ألزم نفسه ألا يدخل عليه من الأدباء إلا من يحفظ عشرين ألف بيت من شعر العرب، فقال الخوارزمي هذا القدر من شعر الرجال أم من شعر النساء، فقال الصاحب هذا يريد أن يكون أبا بكر الخوارزمي فأذن له؛ له ديوان رسائل وديوان شعر {cite:wafayat-ayan}."
