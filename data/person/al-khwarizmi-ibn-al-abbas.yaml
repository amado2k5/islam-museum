born: { edtf: "0934~", hijri: "0323", calendar: julian, precision: year, status: tradition, derived: true, note: "كان مولده سنة ثلاث وعشرين وثلاثمائة على ما ذكره الثعالبي في اليتيمة {cite:wafayat-ayan}." }
summary:
  ar: "أبو بكر محمد بن العباس الخوارزمي الشاعر المشهور ويقال له الطبرخزي لأن أباه من خوارزم وأمه من طبرستان، وهو ابن أخت أبي جعفر الطبري صاحب التاريخ؛ وكان مولده سنة ثلاث وعشرين وثلاثمائة على ما ذكره الثعالبي في اليتيمة؛ وكان أحد الشعراء المجيدين الكبار وإماماً في اللغة والأنساب، أقام بالشام مدة وسكن بنواحي حلب؛ يُحكى أنه قصد الصاحب ابن عباد فقال له الحاجب إن مولاه ألزم نفسه ألا يدخل عليه من الأدباء إلا من يحفظ عشرين ألف بيت من شعر العرب، فقال الخوارزمي هذا القدر من شعر الرجال أم من شعر النساء، فقال الصاحب هذا يريد أن يكون أبا بكر الخوارزمي فأذن له؛ له ديوان رسائل وديوان شعر {cite:wafayat-ayan}."
  en: "Abu Bakr Muhammad ibn al-Abbas al-Khwarizmi, the well-known poet, also called al-Tabarkhazi because his father was from Khwarazm and his mother from Tabaristan. He was the son of a sister of Abu Ja'far al-Tabari, author of the History. His birth was in 323, according to al-Tha'alibi in the Yatima. He was one of the great accomplished poets and an imam in language and genealogy. He stayed in Syria for a time and settled in the districts of Aleppo. It is related that he went to al-Sahib Ibn Abbad, and the chamberlain told him that his master had bound himself not to admit any man of letters who could not recite twenty thousand verses of Arab poetry. Al-Khwarizmi asked whether this quantity was of the poetry of men or of the poetry of women. Al-Sahib said, 'This man wants to be Abu Bakr al-Khwarizmi,' and admitted him. He has a diwan of epistles and a diwan of poetry {cite:wafayat-ayan}."
