summary:
  ar: "أبو بكر محمد بن عبد الغني بن أبي بكر بن شجاع البغدادي الحنبلي، الملقب معين الدين المعروف بابن نقطة؛ الحافظ المحدث من طلبة الحديث المشهورين به المكثرين من سماعه وكتابته والراحلين في تحصيله؛ رحل في خراسان وبلاد الجبل والجزيرة والشام ومصر ولقي المشايخ وكتب الكثير وعلّق التعاليق النافعة؛ ذيّل على الإكمال، وله كتاب لطيف في الأنساب مثل الذيل على كتابي ابن طاهر المقدسي وأبي موسى الأصبهاني، وكتاب التقييد في معرفة الرواة والسنن والمسانيد؛ قال ابن خلكان: كنت أسمع به في وقته ولم أجتمع به، وكدت يومئذ مقيماً بمدينة حلب للاشتغال فوصلنا خبر موته {cite:wafayat-ayan}."
  en: "Mu'in al-Din Ibn Naqta (d. 629) — the Baghdadi hadith traveller and hafiz; journeyed through Khurasan, the Jibal, the Jazira, Syria and Egypt; author of a dhayl on al-Ikmal, a book on nasab, and al-Taqyid on transmitters {cite:wafayat-ayan}."
