died: { edtf: "1231", hijri: "0629", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي في الثاني والعشرين من صفر سنة تسع وعشرين وستمائة ببغداد؛ وكتب بخطه على تكملة ابن الأبار «توفي في عاشر شعبان سنة ثمان وعشرين وستمائة» {cite:wafayat-ayan}." }
summary:
  ar: "أبو بكر محمد بن عبد الغني بن أبي بكر بن شجاع البغدادي الحنبلي، الملقب معين الدين المعروف بابن نقطة؛ الحافظ المحدث من طلبة الحديث المشهورين به المكثرين من سماعه وكتابته والراحلين في تحصيله؛ رحل في خراسان وبلاد الجبل والجزيرة والشام ومصر ولقي المشايخ وكتب الكثير وعلّق التعاليق النافعة؛ ذيّل على الإكمال، وله كتاب لطيف في الأنساب مثل الذيل على كتابي ابن طاهر المقدسي وأبي موسى الأصبهاني، وكتاب التقييد في معرفة الرواة والسنن والمسانيد؛ قال ابن خلكان: كنت أسمع به في وقته ولم أجتمع به، وكدت يومئذ مقيماً بمدينة حلب للاشتغال فوصلنا خبر موته {cite:wafayat-ayan}."
  en: "Mu'in al-Din Ibn Naqta (d. 629) — the Baghdadi hadith traveller and hafiz; journeyed through Khurasan, the Jibal, the Jazira, Syria and Egypt; author of a dhayl on al-Ikmal, a book on nasab, and al-Taqyid on transmitters {cite:wafayat-ayan}."
  es: "Mu'in al-Din Ibn Naqta (m. 629): el viajero y hafiz del hadiz bagdadí; viajó a través de Khurasan, Jibal, Jazira, Siria y Egipto; autor de un dhayl sobre al-Ikmal, un libro sobre nasab y al-Taqyid sobre transmisores {citar:wafayat-ayan}."
  fr: "Mu'in al-Din Ibn Naqta (mort en 629) — le voyageur de hadiths Baghdadi et hafiz; a voyagé à travers le Khurasan, le Jibal, la Jazira, la Syrie et l'Égypte; auteur d'un dhayl sur al-Ikmal, d'un livre sur le nasab, et d'al-Taqyid sur les émetteurs {cite:wafayat-ayan}."
  ur: "معین الدین ابن نکتہ ⁦(متوفی 629)⁩ - بغدادی حدیث کا مسافر اور حافظ؛ خراسان، جبل، جزیرہ، شام اور مصر کا سفر کیا۔ الاکمال پر ایک دھیل کے مصنف، نصاب پر ایک کتاب، اور ٹرانسمیٹر پر التقید {حوالہ: وفائیت-عیان}۔"
  tr: "Ebu Bekir Muhammed bin Abdülghani ibn Ebi Bekir ibn Şuca'el-Bağdadi el-Hanbali, lakaplı adı Mu'in al-Din, İbn Nuqta olarak bilinir; hadisin ünlü öğrencileri arasında ezberci ve hadis âlimidir; bu hadisleri sıkça duyan ve yazanlar, ayrıca takip edenler; Horasan'da, dağlık topraklarda, Cazire'de, Şam'da ve Mısır'da seyahat etti, şeyhlerle görüştü, birçok kitap yazdı ve faydalı tefsirler üzerine yorumlar yaptı; ekler El-İkmal'e ve soybilim üzerine güzel bir kitap yazdı; İbn Tahir el-Makdisi ve Ebu Musa el-İsfahani'nin kitaplarının eki ve 'El-Taqyid fi Ma'rifat al-Ruwat, Sunan ve Musnad' adlı kitabı; İbn Hallikan şöyle dedi: Onun zamanında onu duyardım ama onunla tanışmadım. O zamanlar, neredeyse iş için Halep şehrinde kalıyordum ki ölüm haberini aldık {alıntı: Wafayat-ayan}."
  id: "Abu Bakr Muhammad ibn Abd al-Ghani ibn Abi Bakr ibn Shuja' al-Baghdadi al-Hanbali, dijuluki Mu'in al-Din, dikenal sebagai Ibn Nuqta; seorang penghafal dan ulama hadis di antara para murid hadis terkenal yang sering mendengar dan menulisnya serta mereka yang mengejarnya; ia melakukan perjalanan di Khorasan, tanah pegunungan, Jazira, Levant, dan Mesir, bertemu dengan para sheikh, menulis banyak buku, dan mengomentari komentar yang bermanfaat; dilampirkan pada Al-Alkitab ikmal, dan ia menulis buku silsilah yang indah, seperti lampiran untuk buku-buku Ibn Tahir al-Maqdisi dan Abu Musa al-Isfahani, serta buku 'Al-Taqyid fi Ma'rifat al-Ruwat, Sunan, and Musnads'; Ibn Khallikan berkata: Saya biasa mendengar tentang beliau pada zamannya tetapi tidak pernah bertemu dengannya. Pada waktu itu, saya hampir tinggal di kota Aleppo untuk bekerja ketika kami menerima kabar kematiannya {cite:Wafayat-Ayan}."
