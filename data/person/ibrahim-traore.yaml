summary:
  ar: "ضابط وسياسي بوركيني، وُلد سنة 1988 في كيرا بإقليم موهون. قاد انقلاب 30 سبتمبر 2022 الذي أطاح بالكابتن بول-هنري سانداوغو داميبا فصار رئيسًا انتقاليًا لبوركينا فاسو، ثم مُدّدت الفترة الانتقالية سنة 2024 خمس سنوات؛ جمع بينه عضوية تحالف دول الساحل ونأيٌ عن فرنسا وتقاربٌ مع روسيا."
  en: "Burkinabe officer and politician, born in 1988 in Kera, Mouhoun province. He led the 30 September 2022 coup that removed Paul-Henri Sandaogo Damiba and became transitional president of Burkina Faso; the transition was extended for five years in 2024. He steered the country away from France and towards Russia within the Alliance of Sahel States."
  ur: "برکینابے افسر اور سیاست دان، 1988 میں موہون صوبے کے کیرا میں پیدا ہوئے۔ انھوں نے 30 ستمبر 2022 کی بغاوت کی قیادت کی جس نے پال-ہینری سنداؤگو دامیبا کو ہٹایا اور وہ برکینا فاسو کے عبوری صدر بنے؛ 2024 میں عبوری مدت پانچ سال بڑھا دی گئی۔ انھوں نے ساحل ریاستوں کے اتحاد کے اندر ملک کو فرانس سے دور اور روس کی طرف مائل کیا۔"
  es: "Oficial y político burkinés, nacido en 1988 en Kera, provincia de Mouhoun. Lideró el golpe de Estado del 30 de septiembre de 2022 que derrocó a Paul-Henri Sandaogo Damiba y se convirtió en presidente de transición de Burkina Faso; la transición se prorrogó por cinco años en 2024. Orientó al país desde Francia hacia Rusia dentro de la Alianza de Estados del Sahel."
  fr: "Officier et homme politique burkinabé, né en 1988 à Kera, dans la province de Mouhoun, il a mené le coup d'État du 30 septembre 2022 qui a renversé Paul-Henri Sandaogo Damiba et est devenu président de transition du Burkina Faso; la transition a été prolongée de cinq ans en 2024. Il a orienté le pays vers la Russie et l'a éloigné de la France au sein de l'Alliance des États du Sahel."
  tr: "1988'de Kira (Mohoun Eyaleti) doğumlu bir Burkinabe subayı ve siyasetçi. 30 Eylül 2022'de Kaptan Paul-Henri Sandaogo Damiba'yı görevden alan ve onu Burkina Faso'nun geçici cumhurbaşkanı yapan darbeye öncülük etti. Geçiş dönemi 2024'te beş yıl uzatıldı; Sahel İttifakı'na katıldı, Fransa'dan uzaklaştı ve Rusya ile ittifak kurdu."
  id: "Seorang perwira dan politisi Burkinabe, lahir pada tahun 1988 di Kira, Provinsi Mohoun. Ia memimpin kudeta 30 September 2022 yang menggulingkan Kapten Paul-Henri Sandaogo Damiba dan menjadikannya presiden sementara Burkina Faso. Masa transisi diperpanjang selama lima tahun pada tahun 2024; ia bergabung dengan Aliansi Sahel, menjauhkan diri dari Prancis, dan bersekutu dengan Rusia."
