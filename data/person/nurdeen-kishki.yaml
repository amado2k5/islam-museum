summary:
  ar: "داعية تنزاني يُعرف بالشيخ نور الدين «كيشكي»، يدعو منذ سنة 1995: في المساجد أولًا، ثم على الأشرطة والأقراص، ثم عبر الإنترنت. قناته «Kishki Online TV» أول قناة إسلامية من نوعها في تنزانيا تنال الجائزة الفضية من يوتيوب، وبلغ عدد مشتركيها نحو 371 ألفًا في نوفمبر 2026. يقود مؤسسة الحكمة التي تنظّم مسابقة دولية لتلاوة القرآن في دار السلام، ونال سنة 2025 درجة الماجستير في الدعوة من جامعة المدينة العالمية في ماليزيا."
  en: "Tanzanian preacher known as Sheikh Nurdeen 'Kishki', who has preached since 1995 — in mosques first, then on cassette, VHS, VCD and DVD, and now online. His channel Kishki Online TV, the first Islamic channel of its kind in Tanzania to receive a YouTube Silver Award, counted about 371,000 subscribers in November 2026. He leads the Al-Hikma Foundation, whose international Qur'an competition is held in Dar es Salaam, and in 2025 he earned a Master's degree in Da'wah from Al-Madinah International University in Malaysia."
  ur: "تنزانی واعظ جو شیخ نور دین «کشکی» کے نام سے معروف ہیں اور 1995 سے دعوت دے رہے ہیں: پہلے مساجد میں، پھر کیسٹ اور ڈسک پر، اب آن لائن۔ ان کا چینل «Kishki Online TV» تنزانیہ کی اپنی نوعیت کی پہلی اسلامی چینل تھی جسے یوٹیوب سلور ایوارڈ ملا، اور نومبر 2026 میں اس کے تقریباً 371 ہزار سبسکرائبر تھے۔ وہ الحکمہ فاؤنڈیشن کے سربراہ ہیں جس کی بین الاقوامی مسابقۂ تلاوت دارالسلام میں ہوتی ہے، اور 2025 میں انہوں نے ملائیشیا کی المدینہ انٹرنیشنل یونیورسٹی سے دعوت میں ماسٹرز کی ڈگری حاصل کی۔"
  es: "El predicador tanzano conocido como Sheikh Nurdeen 'Kishki', que predica desde 1995, primero en mezquitas, luego en casete, VHS, VCD y DVD, y ahora en línea. Su canal Kishki Online TV, el primer canal islámico de su tipo en Tanzania en recibir un premio YouTube Silver Award, contaba con aproximadamente 371.000 suscriptores en noviembre de 2026. Dirige la Fundación Al-Hikma, cuyo concurso internacional del Corán se celebra en Dar es Salaam, y en 2025 obtuvo una maestría en Da'wah (predicación islámica) de la Universidad Internacional Al-Madinah en Malasia."
  fr: "Le prédicateur tanzanien connu sous le nom de Cheikh Nurdeen « Kishki » prêche depuis 1995, d'abord dans les mosquées, puis sur cassettes, VHS, VCD et DVD, et maintenant en ligne. Sa chaîne Kishki Online TV, première chaîne islamique du genre en Tanzanie à recevoir un YouTube Silver Award, comptait environ 371 000 abonnés en novembre 2026. Il dirige la Fondation Al-Hikma, dont le concours international de récitation du Coran se tient à Dar es Salaam, et a obtenu en 2025 une maîtrise en Da'wah (prédication islamique) à l'Université internationale Al-Madinah en Malaisie."
  tr: "Tanzanyalı bir vaiz olan Şeyh Nooruddin \"Kishki\" olarak bilinen Kishki, 1995'ten beri önce camilerde, sonra kasetlerde ve disklerde, son olarak ise çevrimiçi olarak vaaz vermektedir. Kanalı \"Kishki Online TV,\" Tanzanya'da YouTube'dan gümüş ödül alan ilk İslami kanal olup, Kasım 2026 itibarıyla yaklaşık 371.000 abonesi bulunmaktadır. Dar es Salaam'da uluslararası bir Kur'an okuma yarışması düzenleyen Al-Hikma Vakfı'nı yönetiyor ve 2025 yılında Malezya'daki Uluslararası Şehir Üniversitesi'nden Davah alanında yüksek lisans derecesi aldı."
  id: "Seorang pengkhotbah Tanzania yang dikenal sebagai Sheikh Nooruddin \"Kishki,\" ia telah berkhotbah sejak 1995: pertama di masjid, lalu di kaset dan cakram, dan akhirnya secara daring. Saluran miliknya, \"Kishki Online TV,\" adalah saluran Islam pertama sejenis di Tanzania yang memenangkan penghargaan perak dari YouTube, dengan sekitar 371.000 pelanggan per November 2026. Ia memimpin Al-Hikma Foundation, yang menyelenggarakan kompetisi pembacaan Al-Qur'an internasional di Dar es Salaam, dan pada 2025 ia meraih gelar magister Da'wah dari International City University di Malaysia."
