summary:
  ar: "داعية تنزاني يُعرف بالشيخ نور الدين «كيشكي»، يدعو منذ سنة 1995: في المساجد أولًا، ثم على الأشرطة والأقراص، ثم عبر الإنترنت. قناته «Kishki Online TV» أول قناة إسلامية من نوعها في تنزانيا تنال الجائزة الفضية من يوتيوب، وبلغ عدد مشتركيها نحو 371 ألفًا في نوفمبر 2026. يقود مؤسسة الحكمة التي تنظّم مسابقة دولية لتلاوة القرآن في دار السلام، ونال سنة 2025 درجة الماجستير في الدعوة من جامعة المدينة العالمية في ماليزيا."
  en: "Tanzanian preacher known as Sheikh Nurdeen 'Kishki', who has preached since 1995 — in mosques first, then on cassette, VHS, VCD and DVD, and now online. His channel Kishki Online TV, the first Islamic channel of its kind in Tanzania to receive a YouTube Silver Award, counted about 371,000 subscribers in November 2026. He leads the Al-Hikma Foundation, whose international Qur'an competition is held in Dar es Salaam, and in 2025 he earned a Master's degree in Da'wah from Al-Madinah International University in Malaysia."
  ur: "تنزانی واعظ جو شیخ نور دین «کشکی» کے نام سے معروف ہیں اور 1995 سے دعوت دے رہے ہیں: پہلے مساجد میں، پھر کیسٹ اور ڈسک پر، اب آن لائن۔ ان کا چینل «Kishki Online TV» تنزانیہ کی اپنی نوعیت کی پہلی اسلامی چینل تھی جسے یوٹیوب سلور ایوارڈ ملا، اور نومبر 2026 میں اس کے تقریباً 371 ہزار سبسکرائبر تھے۔ وہ الحکمہ فاؤنڈیشن کے سربراہ ہیں جس کی بین الاقوامی مسابقۂ تلاوت دارالسلام میں ہوتی ہے، اور 2025 میں انہوں نے ملائیشیا کی المدینہ انٹرنیشنل یونیورسٹی سے دعوت میں ماسٹرز کی ڈگری حاصل کی۔"
