summary:
  ar: "بنى مدرسة بواسط وإلى جانبها جامعاً، وبنى ببغداد مدرسة في سوق السلطان، وجدد بمكة الرباط الذي اشتهر به وعين عرفة التي في الموقف وأجرى ماءها لانتفاع الحج بها، وأوقف على ذلك أوقافاً سنية {cite:shadharat-dhahab p. 269}."
  en: "The amir-patron (d. 653) — a madrasa and mosque at Wasit, a Baghdad madrasa on Suq al-Sultan, and at Mecca the restored ribat bearing his name plus the running water of Ayn Arafa for the pilgrims {cite:shadharat-dhahab p. 269}."
  es: "El amir-patron (m. 653) — una madrasa y mezquita en Wasit, una madrasa en Bagdad en Suq al-Sultan, y en La Meca el ribat restaurado que lleva su nombre, además del agua corriente de Ayn Arafa para los peregrinos {cite:shadharat-dhahab p. 269}."
  fr: "L'émir-patron (mort en 653) — une madrasa et une mosquée à Wasit, une madrasa de Bagdad sur Suq al-Sultan, et à La Mecque le ribat restauré portant son nom ainsi que l'eau courante d'Ayn Arafa pour les pèlerins {cite:shadharat-dhahab p. 269}."
  ur: "امیر سرپرست ⁦(متوفی 653)⁩ - واسط میں ایک مدرسہ اور مسجد، سق السلطان پر بغداد کا ایک مدرسہ، اور مکہ میں بحال شدہ رباط جس کا نام اس کے نام سے ہے اور حجاج کے لیے عین عرفہ کا بہتا پانی 269}۔"
  tr: "Wasit'te bir okul ve yanında bir cami inşa etti, Bağdat'ta Sultan pazarında bir okul kurdu, ünlü olduğu Mekke'deki ribatı yeniledi ve istasyonda Arafah alanını açtı, suyunu Hac için boşalttı ve bunun için Sünni vakıflar bağışladı {atıf:shadharat-dhahab, s. 269}."
  id: "Ia membangun sebuah sekolah di Wasit dan di sebelahnya sebuah masjid, dan di Baghdad ia membangun sekolah di pasar Sultan, merenovasi ribat di Mekah yang membuatnya terkenal, dan membuka situs Arafah di stasiun tersebut, menguras airnya untuk manfaat Haji di sana, serta memberikan dana Sunni untuk ini {cite:shadharat-dhahab, hlm. 269}."
