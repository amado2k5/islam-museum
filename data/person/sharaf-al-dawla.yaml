label: { ar: "شرف الدولة بن ركن الدولة" }
died: { edtf: "0989~", hijri: "0379-06", calendar: julian, precision: month, status: tradition, derived: true, note: "مرض بالاستسقاء ومات في جمادى الآخرة سنة تسع وسبعين وله تسع وعشرون سنة، وتملك بغداد سنتين وثمانية أشهر وولى بعده أخوه أبو نصر بهاء الدولة {cite:shadharat-dhahab p. 94}." }
summary:
  ar: "ابن ركن الدولة، قصد أخاه صمصام الدولة سنة ست وسبعين فانتصر عليه وكحله ومال العسكر إليه وقدم بغداد وركب الطائع إليه يهنئه بالبلاد وعهد إليه بالسلطنة وتوجه وقرئ عهده والطائع يسمع، وأمر سنة ثمان وسبعين برصد الكواكب السبعة في مسيرها كما فعل المأمون، ومات سنة تسع وسبعين وعهد إلى أخيه أبي نصر {cite:tarikh-khulafa-minhaj-1434 p. 631}."
  en: "Rukn al-Dawla's son; he beat and blinded his brother Samsam al-Dawla in 376, took Baghdad, was invested and crowned by a visiting al-Ta'i' — his deed read in the caliph's hearing — ordered a Ma'mun-like observation of the seven planets in 378, and died in 379 leaving it to his brother Abu Nasr {cite:tarikh-khulafa-minhaj-1434 p. 631}."
