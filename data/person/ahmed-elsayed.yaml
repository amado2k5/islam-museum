summary:
  ar: "داعية وباحث، وُلد في ينبع بالسعودية سنة 1985 ونشأ فيها ثم انتقل إلى المدينة المنورة، المشرف العام على برنامج «البناء المنهجي» و«أكاديمية الجيل الصاعد» وبرنامج «صناعة المحاور»، ورسالته المعلنة في الحياة «إحياء منهاج النبوة»، وله مؤلفات وبرامج مرئية واسعة الانتشار بين الشباب."
  en: "Preacher and researcher, born in Yanbu, Saudi Arabia, in 1985, raised there and later based in Madinah. He is the general supervisor of the 'al-Bina' al-Manhaji' programme, the 'Rising Generation Academy' and the 'San'at al-Muhawir' programme; his stated life mission is 'reviving the Prophetic method' (ihya' minhaj al-nubuwwa), and his books and video programmes circulate widely among young people."
  ur: "مبلغ اور محقق، جو 1985 میں سعودی عرب کے شہر ینبع میں پیدا ہوئے، وہیں پلے بڑھے اور بعد میں مدینہ منورہ منتقل ہوئے۔ وہ «البناء المنهجي» پروگرام، «أكاديمية الجيل الصاعد» اور «صناعة المحاور» کے نگرانِ عام ہیں؛ ان کا اعلانیہ مشن «إحياء منهاج النبوة» ہے، اور ان کی کتب و ویڈیو پروگرام نوجوانوں میں وسیع پیمانے پر گردش کرتے ہیں۔"
  es: "Predicador e investigador, nacido en Yanbu, Arabia Saudita, en 1985, donde creció y que posteriormente residió en Medina. Es el supervisor general del programa 'al-Bina' al-Manhaji', la 'Academia de la Nueva Generación' y el programa 'San'at al-Muhawir'. Su misión declarada es 'revivir el método profético' (ihya' minhaj al-nubuwwa), y sus libros y programas de vídeo tienen una amplia difusión entre los jóvenes."
  fr: "Prédicateur et chercheur, né à Yanbu (Arabie saoudite) en 1985, il y a grandi et s'est ensuite installé à Médine. Il est le superviseur général du programme « al-Bina' al-Manhaji' », de la « Rising Generation Academy » et du programme « San'at al-Muhawir ». Sa mission de vie est de « faire revivre la méthode prophétique » (ihya' minhaj al-nubuwwa), et ses livres et programmes vidéo sont largement diffusés auprès des jeunes."
  tr: "Vaiz ve araştırmacı olan bu kişi, 1985 yılında Suudi Arabistan'ın Yanbu şehrinde doğdu ve Medine'ye taşınmadan önce orada büyüdü. \"Sistematik Yapılandırma\" programı, \"Yükselen Nesil Akademisi\" ve \"Diyalog Oluşturma\" programının genel sorumlusudur. Hayattaki misyonunu \"Peygamberlik Metodolojisini Canlandırmak\" olarak ilan etmiştir. Gençler arasında yaygın olarak dağıtılan video programları ve yazılı eserleri bulunmaktadır."
  id: "Seorang pendakwah dan peneliti, ia lahir di Yanbu, Arab Saudi pada tahun 1985 dan dibesarkan di sana sebelum pindah ke Madinah. Ia adalah pengawas umum program “Pembangunan Sistematis”, “Akademi Generasi Penerus”, dan program “Pembuatan Dialog”. Misi hidupnya yang dinyatakan adalah “Menghidupkan Kembali Metodologi Kenabian”. Ia telah menulis karya dan mendistribusikan program video secara luas di kalangan anak muda."
