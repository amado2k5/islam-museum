summary:
  ar: "داعية وباحث، وُلد في ينبع بالسعودية سنة 1985 ونشأ فيها ثم انتقل إلى المدينة المنورة، المشرف العام على برنامج «البناء المنهجي» و«أكاديمية الجيل الصاعد» وبرنامج «صناعة المحاور»، ورسالته المعلنة في الحياة «إحياء منهاج النبوة»، وله مؤلفات وبرامج مرئية واسعة الانتشار بين الشباب."
  en: "Preacher and researcher, born in Yanbu, Saudi Arabia, in 1985, raised there and later based in Madinah. He is the general supervisor of the 'al-Bina' al-Manhaji' programme, the 'Rising Generation Academy' and the 'San'at al-Muhawir' programme; his stated life mission is 'reviving the Prophetic method' (ihya' minhaj al-nubuwwa), and his books and video programmes circulate widely among young people."
  ur: "مبلغ اور محقق، جو 1985 میں سعودی عرب کے شہر ینبع میں پیدا ہوئے، وہیں پلے بڑھے اور بعد میں مدینہ منورہ منتقل ہوئے۔ وہ «البناء المنهجي» پروگرام، «أكاديمية الجيل الصاعد» اور «صناعة المحاور» کے نگرانِ عام ہیں؛ ان کا اعلانیہ مشن «إحياء منهاج النبوة» ہے، اور ان کی کتب و ویڈیو پروگرام نوجوانوں میں وسیع پیمانے پر گردش کرتے ہیں۔"
