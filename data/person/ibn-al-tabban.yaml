class: person
label: { ar: "عبد الله بن إسحاق ابن التبان", en: "Ibn al-Tabban al-Qayrawani", es: "Ibn al-Tabban al-Qayrawani", fr: "Ibn al-Tabban al-Qayrawani", ur: "ابن الطبان القیروانی" }
died: { edtf: "0981~", hijri: "0371", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي سنة إحدى وسبعين وثلاثمائة {cite:shadharat-dhahab p. 76}." }
summary:
  ar: "أبو محمد عبد الله بن إسحاق القيرواني المعروف بابن التبان، شيخ المالكية بالمغرب؛ قال القاضي عياض: ضُربت إليه آباط الإبل من الأمصار، وكان حافظاً بعيداً من التصنع والرياء فصيحاً {cite:shadharat-dhahab p. 76}."
  en: "Abu Muhammad Abdallah b. Ishaq al-Qayrawani, called Ibn al-Tabban (d. 371) — shaykh of the Maghreb Malikis; al-Qadi Iyad said camel-posts were driven to him from every quarter, a hafiz far from affectation and ostentation, eloquent {cite:shadharat-dhahab p. 76}."
  es: "Abu Muhammad Abdallah b. Ishaq al-Qayrawani, llamado Ibn al-Tabban (m. 371), jeque de los Malikis del Magreb; al-Qadi Iyad dijo que le llevaron puestos de camellos de todas partes, un hafiz lejos de la afectación y la ostentación, elocuente {cita: shadharat-dhahab p. 76}."
  fr: "Abou Muhammad Abdallah b. Ishaq al-Qayrawani, appelé Ibn al-Tabban (mort en 371) — cheikh des Malikis du Maghreb; al-Qadi Iyad a déclaré que des postes de chameaux lui étaient conduits de tous côtés, un hafiz loin de l'affectation et de l'ostentation, éloquent {cite: shadharat-dhahab p. 76}."
  ur: "ابو محمد عبداللہ بی۔ اسحاق القیروانی، جسے ابن الطبان ⁦(متوفی 371)⁩ کہا جاتا ہے - مغرب مالکیوں کے شیخ؛ القادی عیاض نے کہا کہ ہر چوتھائی سے ان کی طرف اونٹوں کے دھاگے چلائے جاتے تھے، ایک حافظ جو محبت اور دکھاوے سے دور تھا 76}۔"
  tr: "Ebu Muhammed Abdullah bin İshaq el-Qayrawani, İbn el-Tabban olarak bilinir, Mahili Malikilerin şeyhi; Hakim İyad: Bölgelerden deve eyerleri onun için vurulmuş, kendisi gösterişten uzak, etkileyici bir ezberciydi {atıf:Shadharat-Dhahab, s. 76}."
  id: "Abu Muhammad Abdullah ibn Ishaq al-Qayrawani, dikenal sebagai Ibn al-Tabban, sheikh Malikis di Maghreb; Hakim Iyad berkata: pelana unta dari daerah terpencil dibuatkan untuknya, dan ia adalah penghafal yang jauh dari kepura-puraan dan kemegahan, fasih {cite:shadharat-dhahab, hlm. 76}."
