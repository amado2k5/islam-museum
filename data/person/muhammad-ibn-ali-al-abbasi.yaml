summary:
  ar: "محمد بن علي بن عبد الله بن العباس صاحب الدعوة؛ عند البلاذري سمى مولى علي يحيى بن صفوان مهللاً لبيت أنشده له وأعتقه وكانت له مولاتان منيرة وأم عبيدة حاضنتهم أقطعهما المنصور قطائع ببغداد."
  en: "Muhammad ibn Ali ibn Abdallah ibn al-Abbas, head of the da'wa; in al-Baladhuri he renamed Ali's mawla Yahya 'Mihlahil' from a verse and freed him — his mawlas Munira and Umm Ubayda their fosterer received Baghdad qati'as from al-Mansur."
  es: "Muhammad ibn Ali ibn Abdallah ibn al-Abbas, jefe de la da'wa; en al-Baladhuri cambió el nombre del mawla Yahya de Ali a 'Mihlahil' a partir de un verso y lo liberó; sus mawlas Munira y Umm Ubayda, su adoptante, recibieron qati'as de Bagdad de al-Mansur."
  fr: "Muhammad ibn Ali ibn Abdallah ibn al-Abbas, chef de la da'wa; à al-Baladhuri, il a renommé le mawla Yahya d'Ali « Mihlahil » à partir d'un verset et l'a libéré — ses mawlas Munira et Umm Ubayda, leur nourrice, ont reçu des qati'as de Bagdad d'al-Mansur."
