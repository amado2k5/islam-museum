roles: [poet]
summary:
  ar: "شاعر جاهلي من بني سعد له قصيدة «أودى الشباب حميدا ذو التعاجيب» في المفضليات، كما تقدّمها الطبعة بقولها «وقال سلامة بن جندل السعدي» {{cite:mufaddaliyyat-rahmaniyya-1926 p.46}}."
  en: "A pre-Islamic poet of Banu Sa'd whose ode \"Youth has gone, praised, the possessor of wonders\" is in the Mufaddaliyyat, which the edition introduces as \"Salama ibn Jandal al-Sa'di said\" {{cite:mufaddaliyyat-rahmaniyya-1926 p.46}}."
  es: "Un poeta preislámico de Banu Sa'd cuya oda \"La juventud se ha ido, alabada, poseedora de maravillas\" se encuentra en el Mufaddaliyyat, que la edición introduce como \"Salama ibn Jandal al-Sa'di dijo\" {{cite:mufaddaliyyat-rahmaniyya-1926 p.46}}."
  fr: "Un poète préislamique de Banu Sa'd dont l'ode « La jeunesse s'en est allée, louée, possesseur de merveilles » se trouve dans le Mufaddaliyyat, que l'édition présente comme « Salama ibn Jandal al-Sa'di a dit » {{cite:mufaddaliyyat-rahmaniyya-1926 p.46}}."
  ur: "بنو سعد کا ایک قبل از اسلام شاعر جس کی غزل \"جوانی چلی گئی، تعریف کی گئی، عجائبات کا مالک\" مفدلیت میں ہے، جس کا تعارف \"سلمہ ابن جندل السعدی \" کے طور پر کرتا ہے۔"
  tr: "Banu Sa'd'dan bir İslam öncesi şair, Al-Mufedaliyat'ta 'Gençlik Öldü, Hamid, Mucizelere Sahipti' adlı şiiri yazmış ve baskı bundan önce şu ifadeyle yayımlanmıştır: 'Salama ibn Jandal al-Sa'di buyurdu' {{cite:mufaddaliyyat-rahmaniyya-1926 s.46}}."
  id: "Seorang penyair pra-Islam dari Banu Sa'd menulis puisi 'Pemuda Mati, Hamid, Memiliki Keajaiban' dalam Al-Mufaddaliyat, dan edisi ini mendahuluinya dengan frasa: 'Salama ibn Jandal al-Sa'di berkata' {{cite:mufaddaliyyat-rahmaniyya-1926 hlm.46}}."
