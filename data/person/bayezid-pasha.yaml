summary:
  ar: "بايزيد باشا؛ الوزير الأول للسلطان محمد الأول جلبي. يذكر الصلابي أنه قاد الجيش الثاني ضد بير كلجة مصطفى داعية الشيخ بدر الدين، فانتصر عليه في موقعة قره بورنو بعد أن كان بير كلجة قد قتل القائد سيسمان وهزم جيشه {cite:dawlat-uthmaniyya-salabi p. 75}. ولما دنا أجل السلطان محمد سنة ٨٢٤هـ/١٤٢١م أوصاه بولاية ابنه مراد، فاتفق بايزيد مع الوزير إبراهيم على إخفاء موت السلطان على الجند حتى وصل مراد الثاني بعد واحد وأربعين يوماً وتسلّم مقاليد الحكم {cite:dawlat-uthmaniyya-salabi p. 77-78}."
  en: "Bayezid Pasha, first vizier of Mehmed I — al-Sallabi credits him with commanding the second army against Börklüce Mustafa and winning at Qara Burnu after Börklüce had killed the commander Shishman {cite:dawlat-uthmaniyya-salabi p. 75}. On the sultan's deathbed in 824/1421 he received the charge for young Murad and, with the vizier Ibrahim, concealed Mehmed's death forty-one days until the heir arrived {cite:dawlat-uthmaniyya-salabi p. 77-78}."
