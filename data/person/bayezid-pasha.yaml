summary:
  ar: "بايزيد باشا؛ الوزير الأول للسلطان محمد الأول جلبي. يذكر الصلابي أنه قاد الجيش الثاني ضد بير كلجة مصطفى داعية الشيخ بدر الدين، فانتصر عليه في موقعة قره بورنو بعد أن كان بير كلجة قد قتل القائد سيسمان وهزم جيشه {cite:dawlat-uthmaniyya-salabi p. 75}. ولما دنا أجل السلطان محمد سنة ٨٢٤هـ/١٤٢١م أوصاه بولاية ابنه مراد، فاتفق بايزيد مع الوزير إبراهيم على إخفاء موت السلطان على الجند حتى وصل مراد الثاني بعد واحد وأربعين يوماً وتسلّم مقاليد الحكم {cite:dawlat-uthmaniyya-salabi p. 77-78}."
  en: "Bayezid Pasha, first vizier of Mehmed I — al-Sallabi credits him with commanding the second army against Börklüce Mustafa and winning at Qara Burnu after Börklüce had killed the commander Shishman {cite:dawlat-uthmaniyya-salabi p. 75}. On the sultan's deathbed in 824/1421 he received the charge for young Murad and, with the vizier Ibrahim, concealed Mehmed's death forty-one days until the heir arrived {cite:dawlat-uthmaniyya-salabi p. 77-78}."
  es: "Bayezid Pasha, primer visir de Mehmed I — al-Sallabi le atribuye el mando del segundo ejército contra Börklüce Mustafa y la victoria en Qara Burnu después de que Börklüce matara al comandante Shishman {cite:dawlat-uthmaniyya-salabi p. 75}. En el lecho de muerte del sultán en 824/1421 recibió el mando del joven Murad y, junto con el visir Ibrahim, ocultó la muerte de Mehmed durante cuarenta y un días hasta la llegada del heredero {cite:dawlat-uthmaniyya-salabi p. 77-78}."
  fr: "Bayezid Pacha, premier vizir de Mehmed Ier, est reconnu par al-Sallabi pour avoir commandé la seconde armée contre Börklüce Mustafa et remporté la victoire à Qara Burnu après que Börklüce eut tué le commandant Shishman (source: Dawlat-Uthmaniyya-Salabi, p. 75). Sur le lit de mort du sultan en 824/1421, il reçut la charge du jeune Murad et, avec le vizir Ibrahim, dissimula la mort de Mehmed pendant quarante et un jours, jusqu’à l’arrivée de l’héritier (source: Dawlat-Uthmaniyya-Salabi, p. 77-78)."
  ur: "بایزید پاشا، محمد اول کے پہلے وزیر - السلبی نے اسے برکلوس مصطفی کے خلاف دوسری فوج کی کمان کرنے اور قرہ برنو میں فتح حاصل کرنے کا سہرا دیا ہے جب بورکلس نے کمانڈر شیشمان کو ہلاک کر دیا تھا۔ 75}۔ 824/1421 میں سلطان کے بستر مرگ پر اس نے نوجوان مراد کی ذمہ داری حاصل کی اور وزیر ابراہیم کے ساتھ مل کر محمد کی موت کو اکتالیس دن تک چھپایا یہاں تک کہ وارث پہنچ گیا۔ 77-78}۔"
  tr: "Bayezid Paşa; Sultan Mehmed I Çelebi'nin başbakanı. El-Sallabi, Şeyh Badr al-Din'in vaizi Bir Kilceh Mustafa'ya karşı İkinci Ordu'yu yönettiğini ve Bir Kilca'nın komutan Sisman'ı öldürüp ordusunu yendikten sonra Karaburnu Savaşı'nda onu yendiğini belirtir {cite:Dawlat-uthmaniyya-Salabi s. 75}. Sultan Muhammed 824 Hicri / 1421 M.S.'de yaklaştığında, oğlu Murad'ın valiliğini ona emanet etti. Bayezid, vezir İbrahim ile sultanın ölümünü askerlerden gizlemek için anlaştı; ta ki Murad II kırk bir gün sonra gelip yönetimi devralana kadar {cite:Dawlat-uthmaniyya-Salabi s. 77-78}."
  id: "Bayezid Pasha; perdana menteri Sultan Mehmed I Çelebi. Al-Sallabi menyebutkan bahwa ia memimpin Tentara Kedua melawan Bir Kilceh Mustafa, pendakwah Sheikh Badr al-Din, dan mengalahkannya di Pertempuran Karaburnu setelah Bir Kilca membunuh komandan Sisman dan mengalahkan pasukannya {cite:Dawlat-uthmaniyya-Salabi hlm. 75}. Ketika Sultan Muhammad mendekat pada tahun 824 H / 1421 M, ia mempercayakan kepadanya untuk memimpin putranya Murad. Bayezid sepakat dengan wazir Ibrahim untuk menyembunyikan kematian sultan dari para tentara sampai Murad II tiba empat puluh satu hari kemudian dan mengambil alih kepemimpinan {cite:Dawlat-uthmaniyya-Salabi hlm. 77-78}."
