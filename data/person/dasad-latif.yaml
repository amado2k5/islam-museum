summary:
  ar: "داعية ومحاضر جامعي إندونيسي وُلد في بينرانغ بجنوب سولاوسي سنة 1973، يُدرّس علوم الاتصال في جامعة حسن الدين بمكاسر منذ 2006 ويحمل دكتوراه في الاتصال من جامعة ماليزيا الوطنية (2016) وثانية في الشريعة من جامعة علاء الدين الإسلامية (2018)، واشتهر بمحاضرات دينية خفيفة الروح بلهجة بوغيس المحلية تُبث تلفزيونياً وعلى يوتيوب، وترشح سنة 2013 لمنصب نائب عمدة مكاسر."
  en: "Indonesian preacher and university lecturer born in Pinrang, South Sulawesi, in 1973. He has taught communications at Hasanuddin University in Makassar since 2006, holds a doctorate in communications from Universiti Kebangsaan Malaysia (2016) and a second doctorate in sharia from UIN Alauddin (2018), and is known for light, humorous sermons in the local Bugis dialect broadcast on television and YouTube. He ran for deputy mayor of Makassar in 2013."
  ur: "انڈونیشی مبلغ و جامعی مدرس، جو 1973ء میں جنوبی سولاویسی کے پنرانگ میں پیدا ہوئے۔ 2006ء سے مکاسر کی حسن الدین یونیورسٹی میں ابلاغیات پڑھا رہے ہیں، نیشنل یونیورسٹی آف ملائیشیا سے ابلاغیات میں ⁦(2016ء)⁩ اور علاء الدین اسلامی یونیورسٹی سے شریعت میں ⁦(2018ء)⁩ ڈاکٹریٹ رکھتے ہیں، اور بوگیس لہجے میں مزاحیہ دینی خطبات سے شہرت رکھتے ہیں۔"
