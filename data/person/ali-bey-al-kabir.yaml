summary:
  ar: "علي بك الكبير (1728 – 1773) مملوكي صار شيخ البلد في مصر العثمانية والحاكم الفعلي لها، فسكّ النقود باسمه وأوقف الخراج السنوي إلى إسطنبول وسعى عمليًا إلى الاستقلال، وضمّ الحجاز وغزا الشام بين 1770 و1771. خُطف طفلًا من أبخازيا وبيع في القاهرة فتربّى في بيت إبراهيم كتخدا واعتنق الإسلام، وانتهى حكمه بخيانة تابعه محمد بك أبو الدهب؛ جُرح في معركة الصالحية سنة 1773 ونُقل إلى القاهرة فمات فيها."
  en: "Ali Bey al-Kabir (1728–1773) was a mamluk who became shaykh al-balad and effective ruler of Ottoman Egypt, minting coins in his own name, stopping the annual tribute to Istanbul and in 1769 practically pursuing independence, then conquering the Hejaz and invading Syria in 1770–1771. Kidnapped as a boy from Abkhazia and sold in Cairo, he was raised in Ibrahim Ketkhuda's household and converted to Islam; his rule ended through the betrayal of his own general Abu al-Dahab, and he died in Cairo of wounds taken at the battle of al-Salihiyya in 1773."
  ur: "علی بیگ الکبیر (1728ء – 1773ء) مملوک تھے جو عثمانی مصر میں شیخ البلد اور درحقیقت حکمران بنے؛ اپنے نام کے سکے ڈھلوائے، استنبول کو سالانہ خراج روکا اور عملی طور پر خود مختاری کی راہ اپنائی، پھر حجاز فتح کیا اور 1770ء تا 1771ء شام پر چڑھائی کی۔ بچپن میں ابخازیا سے اغوا ہو کر قاہرہ میں بکے، ابراہیم کتخدا کے گھر پرورش پائی اور اسلام قبول کیا۔ ان کے خاص جرنیل ابو الدهب کی غداری پر حکومت ختم ہوئی؛ صالحیہ کی لڑائی میں زخمی ہو کر قاہرہ لائے گئے اور وہیں وفات پائی۔"

