  note: "The English, Arabic and Urdu articles agree on 1728, the Arabic article pairing it with 1140 AH. He was born in the Principality of Abkhazia; the accounts of his parentage differ — Pleshcheev and Fındıklılı Efendi make him ethnically Abkhazian, the Encyclopaedia of Islam, following his contemporary biographer Lusignan, makes him supposedly the son of a Greek Orthodox priest named David, Mikaberidze makes his father a Georgian Orthodox priest, and the Arabic article also carries a version making him a Romanian Orthodox priest's son from Amasya; Wikidata's birthplaces, Samegrelo and Istanbul, reflect those rival traditions. Abkhazia has no museum place record, so no born_in edge is written."
