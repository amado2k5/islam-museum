label: { ar: "المطيع لله الفضل بن المقتدر" }
summary:
  ar: "خليفة عباسي [٣٣٤–٣٦٣هـ]، أبو القاسم الفضل بن المقتدر، أمه أم ولد اسمها مشغلة ولد سنة إحدى وثلاث مئة، بويع عند خلع المستكفي وقرر له معز الدولة كل يوم نفقة مئة دينار فقط {cite:tarikh-khulafa-minhaj-1434 p. 614-615}، ونزل في طيارة إلى دار معز الدولة يعزيه في أخته فخرج إليه وقبل الأرض مرات، وصادره بختيار سنة اثنتين وستين فباع قماشه وحمل أربع مئة ألف درهم وشاع أن الخليفة صودر، وأثبت خلعه على القاضي ابن أم شيبان وصار يسمى الشيخ الفاضل {cite:tarikh-khulafa-minhaj-1434 p. 620-624}."
  en: "Abbasid caliph [334–363], Abu'l-Qasim al-Fadl ibn al-Muqtadir, born 301 to the slave Mashghala, hailed on al-Mustakfi's deposition with a stipend of only a hundred dinars a day fixed by Mu'izz al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 614-615}."
