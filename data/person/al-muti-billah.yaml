class: person
label: { ar: "المطيع لله الفضل بن المقتدر", en: "al-Muti li-llah al-Fadl ibn al-Muqtadir", fr: "al-Muti li-llah al-Fadl ibn al-Muqtadir", es: "al-Muti li-llah al-Fadl ibn al-Muqtadir", ur: "المطی للہ الفضل ابن مقتدیر" }
summary:
  ar: "خليفة عباسي [٣٣٤–٣٦٣هـ]، أبو القاسم الفضل بن المقتدر، أمه أم ولد اسمها مشغلة ولد سنة إحدى وثلاث مئة، بويع عند خلع المستكفي وقرر له معز الدولة كل يوم نفقة مئة دينار فقط {cite:tarikh-khulafa-minhaj-1434 p. 614-615}، ونزل في طيارة إلى دار معز الدولة يعزيه في أخته فخرج إليه وقبل الأرض مرات، وصادره بختيار سنة اثنتين وستين فباع قماشه وحمل أربع مئة ألف درهم وشاع أن الخليفة صودر، وأثبت خلعه على القاضي ابن أم شيبان وصار يسمى الشيخ الفاضل {cite:tarikh-khulafa-minhaj-1434 p. 620-624}. وعند المسعودي لما طلبه المستكفي هرب وقيل إلى أحمد بن بويه الديلمي متنكراً فأحسن إليه ولم يظهره، فلما مات توزون ودخل الديلمي بغداد وخرج الأتراك عنها صار إلى ناصر الدولة الحسن بن عبد الله بن حمدان وانحدر معه هو وابن عمه أبو عبد الله بن أبي العلاء، وكان المستكفي مختفياً ببغداد يطلبه أشد الطلب وأنزله في بيعة النصارى المعروفة بدرنا من الجانب الغربي {cite:muruj-al-dhahab p. 710}، وعند المسعودي كانت خلافته إلى غرة جمادى الأولى سنة ست وثلاثين وثلثمائة وهو وقت فراغ المصنف من كتابه سنتين وثمانية أشهر وخمسة عشر يوماً على حساب الزيجات {cite:muruj-al-dhahab p. 735}، ولحقه سنة ستين وثلاثمائة داء الفالج فبطل نصفه وثقل لسانه {cite:shadharat-dhahab p. 28}"
  en: "Abbasid caliph [334–363], Abu'l-Qasim al-Fadl ibn al-Muqtadir, born 301 to the slave Mashghala, hailed on al-Mustakfi's deposition with a stipend of only a hundred dinars a day fixed by Mu'izz al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 614-615}."
  fr: "calife abbasside [334-363], Abu'l-Qasim al-Fadl ibn al-Muqtadir, né 301 à l'esclave Mashghala, salué sur la déposition d'al-Mustakfi avec une allocation de seulement cent dinars par jour fixée par Mu'izz al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 614-615}."
  es: "El califa abasí [334–363], Abu'l-Qasim al-Fadl ibn al-Muqtadir, nacido en 301 del esclavo Mashghala, saludó la deposición de al-Mustakfi con un estipendio de sólo cien dinares por día fijado por Mu'izz al-Dawla {cita:tarikh-khulafa-minhaj-1434 p. 614-615}."
  ur: "عباسی خلیفہ [334-363]، ابو القاسم الفضل ابن المقتدیر، غلام مشغلہ کے ہاں 301 میں پیدا ہوئے، المستکفی کی معزولی کی تعریف کی گئی جس کا وظیفہ صرف سو دینار یومیہ تھا جس کا وظیفہ معز الدعوۃ الدعوۃ الدعوۃ الدعوۃ الدعوۃ الدعوۃ الخلفاء 4۔ ص 614-615}۔"
  tr: "Bir Abbasi halifesi [334–363 H.C.], annesi 3100 Hicri doğumlu Mughalma adında bir anne olan Ebu el-Kasım el-Fadl bin Muktadir, el-Mustakfi'nin tahttan indirilmesinde bağlılık yemini etti ve Mu'izz al-Dawla ona günde sadece yüz dinar vermeyi kabul etti {alıntı: Tarikh-Khulafa-minhaj-1434 s. 614-615}. Mu'izz al-Dawla'nın evine uçup kız kardeşine başsağlığı diledi, ona gitti, toprağı birkaç kez öptü, 1962'de Bakhtiyar tarafından el koydu, kumaşını sattı ve dört yüz bin dirhem taşıdı. Halifenin el koyduğu söylentisi vardı ve Ibn um Şeyban'a tahttan indirilmesini onaylayarak erdemli şeyh olarak tanındı {cite:History-Khulafa-minhaj-1434 s. 620-624}. al-Mas'udi'ye göre, el-Mustakfi onu çağırdığında kaçtı. Ahmed ibn Buyah al-Daylami'ye kılık değiştirdiği söylendi, ancak iyi muamele gördü ama gösterilmedi. Tuzun öldüğünde ve al-Daylami Bağdat'a girdiğinde, Türkler ayrıldığında, Nasir al-Dawla al-Hasan ibn Abdullah ibn Hamdan'a gitti. O ve kuzeni Ebu Abdullah ibn Ebi el-'Ala' onunla birlikte indi. El-Mustakfi Bağdat'ta saklanıyor, onu en acil şekilde talep ediyordu ve batı tarafından Durna olarak bilinen Hristiyanlara bağlılık yemini etti. {alıntı: Muruj-al-Dhahab s. 710} ve el-Mes'udi'ye göre halifeliği, üç yüz otuz altı yılındaki ilk Jumada al-Awwal tarihine kadar sürmüştür; bu tarihte yazar kitabını evlilikleri sayarak iki yıl, sekiz ay ve on beş gün ile tamamlamıştır {atıf:Muruj-al-dhahab s. 735} ve üç yüz altmış yaşında felç geçirmiş, bu durum hayatının yarısını etkisiz hale getirmiş ve dili ağırlaşmıştır {atıf:shadharat-dhahab s. 28}"
  id: "Seorang khalifah Abbasiyah [334–363 H], Abu al-Qasim al-Fadl ibn al-Muqtadir, yang ibunya adalah ibu bernama Mughalma, lahir pada tahun 3100 H, disumpah setia setelah penggulingan al-Mustakfi, dan Mu'izz al-Dawla setuju hanya memberinya seratus dinar per hari {cite:Tarikh-Khulafa-minhaj-1434 hlm. 614-615}. Ia terbang ke rumah Mu'izz al-Dawla untuk menyampaikan belasungkawa kepada saudara perempuannya, pergi kepadanya, mencium tanah itu beberapa kali, menyitanya oleh Bakhtiyar pada tahun 1962, menjual kainnya, dan membawa empat ratus ribu dirham. Beredar kabar bahwa khalifah telah menyita, dan ia mengonfirmasi pencopotannya kepada hakim Ibn um Shayban dan dikenal sebagai Sheikh yang berbudi luhur {cite:History-Khulafa-minhaj-1434 hlm. 620-624}. Menurut al-Mas'udi, ketika al-Mustakfi memanggilnya, ia melarikan diri. Dikatakan kepada Ahmad ibn Buyah al-Daylami dengan menyamar, tetapi ia diperlakukan dengan baik namun tidak menunjukkannya. Ketika Tuzun meninggal dan al-Daylami memasuki Baghdad dan orang Turki pergi, ia pergi kepada Nasir al-Dawla al-Hasan ibn Abdullah ibn Hamdan. Ia dan sepupunya Abu Abdullah ibn Abi al-'Ala' turun bersamanya. Al-Mustakfi bersembunyi di Baghdad, menuntutnya dengan sangat mendesak, dan ia menerima sumpah setia kepada orang Kristen yang dikenal sebagai Durna dari sisi barat. {kutip: Muruj-al-Dhahab hlm. 710} dan menurut al-Mas'udi kekhalifahannya berlangsung hingga tanggal pertama Jumada al-Awwal pada tahun tiga ratus tiga puluh enam, yaitu saat penulis menyelesaikan bukunya dengan dua tahun, delapan bulan, dan lima belas hari menghitung pernikahan {cite:Muruj-al-dhahab hlm. 735}, dan pada tahun tiga ratus enam puluh, ia menderita lumpuh, yang membatalkan setengah hidupnya dan lidahnya menjadi berat {cite:shadharat-dhahab hlm. 28}"
