class: person
label: { ar: "المطيع لله الفضل بن المقتدر" }
summary:
  ar: "خليفة عباسي [٣٣٤–٣٦٣هـ]، أبو القاسم الفضل بن المقتدر، أمه أم ولد اسمها مشغلة ولد سنة إحدى وثلاث مئة، بويع عند خلع المستكفي وقرر له معز الدولة كل يوم نفقة مئة دينار فقط {cite:tarikh-khulafa-minhaj-1434 p. 614-615}، ونزل في طيارة إلى دار معز الدولة يعزيه في أخته فخرج إليه وقبل الأرض مرات، وصادره بختيار سنة اثنتين وستين فباع قماشه وحمل أربع مئة ألف درهم وشاع أن الخليفة صودر، وأثبت خلعه على القاضي ابن أم شيبان وصار يسمى الشيخ الفاضل {cite:tarikh-khulafa-minhaj-1434 p. 620-624}. وعند المسعودي لما طلبه المستكفي هرب وقيل إلى أحمد بن بويه الديلمي متنكراً فأحسن إليه ولم يظهره، فلما مات توزون ودخل الديلمي بغداد وخرج الأتراك عنها صار إلى ناصر الدولة الحسن بن عبد الله بن حمدان وانحدر معه هو وابن عمه أبو عبد الله بن أبي العلاء، وكان المستكفي مختفياً ببغداد يطلبه أشد الطلب وأنزله في بيعة النصارى المعروفة بدرنا من الجانب الغربي {cite:muruj-al-dhahab p. 710}، وعند المسعودي كانت خلافته إلى غرة جمادى الأولى سنة ست وثلاثين وثلثمائة وهو وقت فراغ المصنف من كتابه سنتين وثمانية أشهر وخمسة عشر يوماً على حساب الزيجات {cite:muruj-al-dhahab p. 735}، ولحقه سنة ستين وثلاثمائة داء الفالج فبطل نصفه وثقل لسانه {cite:shadharat-dhahab p. 28}"
  en: "Abbasid caliph [334–363], Abu'l-Qasim al-Fadl ibn al-Muqtadir, born 301 to the slave Mashghala, hailed on al-Mustakfi's deposition with a stipend of only a hundred dinars a day fixed by Mu'izz al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 614-615}."
