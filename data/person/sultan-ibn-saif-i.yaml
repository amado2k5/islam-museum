summary:
  ar: "سلطان بن سيف بن مالك اليعربي، ثاني أئمة اليعاربة الإباضية في عمان، بويع يوم وفاة الإمام ناصر بن مرشد بنزوى سنة ١٠٥٠هـ، فطرد البرتغاليين من مسقط وبنى سفنا كثيرة وهاجم مراكزهم في الهند وساحل إفريقية، وتوفي بنزوى سنة ١٠٩١هـ الموافقة ١٦٨٠م."
  en: "Sultan ibn Saif ibn Malik al-Ya'ribi, the second of the Ya'ariba imams of the Ibadis in Oman; he was pledged allegiance on the day Imam Nasir ibn Murshid died, in Nizwa in 1050 AH, expelled the Portuguese from Muscat, built many ships and attacked Portuguese posts in India and on the African coast. He died in Nizwa in 1091 AH, 1680 CE."
