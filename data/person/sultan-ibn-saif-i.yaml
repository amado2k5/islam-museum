summary:
  ar: "سلطان بن سيف بن مالك اليعربي، ثاني أئمة اليعاربة الإباضية في عمان، بويع يوم وفاة الإمام ناصر بن مرشد بنزوى سنة ١٠٥٠هـ، فطرد البرتغاليين من مسقط وبنى سفنا كثيرة وهاجم مراكزهم في الهند وساحل إفريقية، وتوفي بنزوى سنة ١٠٩١هـ الموافقة ١٦٨٠م."
  en: "Sultan ibn Saif ibn Malik al-Ya'ribi, the second of the Ya'ariba imams of the Ibadis in Oman; he was pledged allegiance on the day Imam Nasir ibn Murshid died, in Nizwa in 1050 AH, expelled the Portuguese from Muscat, built many ships and attacked Portuguese posts in India and on the African coast. He died in Nizwa in 1091 AH, 1680 CE."
  es: "Sultan ibn Saif ibn Malik al-Ya'ribi, el segundo de los imanes Ya'ariba de los ibadíes en Omán, juró lealtad el día en que murió el imán Nasir ibn Murshid en Nizwa en el año 1050 de la Hégira. Expulsó a los portugueses de Mascate, construyó numerosos barcos y atacó puestos portugueses en la India y en la costa africana. Murió en Nizwa en el año 1091 de la Hégira (1680 d. C.)."
  fr: "Sultan Ibn Saif Ibn Malik al-Ya'ribi, deuxième imam Ya'ariba des Ibadites d'Oman, prêta allégeance le jour du décès de l'imam Nasir Ibn Murshid, à Nizwa en 1050 de l'Hégire. Il chassa les Portugais de Mascate, fit construire de nombreux navires et attaqua les postes portugais en Inde et sur la côte africaine. Il mourut à Nizwa en 1091 de l'Hégire (1680 de l'ère chrétienne)."
