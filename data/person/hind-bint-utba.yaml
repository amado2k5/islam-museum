  en: "Daughter of the Meccan elder Utba ibn Rabi'a and wife of Abu Sufyan: the sira's most vivid figure of Meccan defiance at Uhud, who converted with the conquest of Mecca; mother of the caliph Mu'awiya."
  ar: "ابنة شيخ مكة عتبة بن ربيعة وزوجة أبي سفيان: أوضح صور السيرة في التحدي المكي بأحد، وأسلمت يوم الفتح؛ أم الخليفة معاوية. وفي الصحيح جاءت النبي فقالت «ما كان على ظهر الأرض من أهل خباء أحب إلي أن يذلوا من أهل خبائك، ثم ما أصبح اليوم أهل خباء أحب إلي أن يعزوا من أهل خبائك» وسألته عن أبي سفيان «رجل مسيك» فأذن لها بالمعروف {cite:sahih-al-bukhari 3825}."
