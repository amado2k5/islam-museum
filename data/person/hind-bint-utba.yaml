summary:
  en: "Daughter of the Meccan elder Utba ibn Rabi'a and wife of Abu Sufyan: the sira's most vivid figure of Meccan defiance at Uhud, who converted with the conquest of Mecca; mother of the caliph Mu'awiya."
  ar: "ابنة شيخ مكة عتبة بن ربيعة وزوجة أبي سفيان: أوضح صور السيرة في التحدي المكي بأحد، وأسلمت يوم الفتح؛ أم الخليفة معاوية. وفي الصحيح جاءت النبي فقالت «ما كان على ظهر الأرض من أهل خباء أحب إلي أن يذلوا من أهل خبائك، ثم ما أصبح اليوم أهل خباء أحب إلي أن يعزوا من أهل خبائك» وسألته عن أبي سفيان «رجل مسيك» فأذن لها بالمعروف {cite:sahih-al-bukhari 3825}."
  ur: "مکہ کے بزرگ عتبہ بن ربیعہ کی بیٹی، ابو سفیان کی اہلیہ اور معاویہ کی والدہ؛ سیرت میں احد کے موقع پر مخالفت اور پھر فتح مکہ پر ان کے قبول اسلام کا ذکر ہے۔ {cite:ibn-ishaq-guillaume}"
  es: "Hija del anciano mecano Utba ibn Rabi'a y esposa de Abu Sufyan: la figura más vívida de la resistencia mecana en Uhud, según la sira, que se convirtió con la conquista de La Meca; madre del califa Mu'awiya."
  fr: "Fille de l'ancien mecquois Utba ibn Rabi'a et épouse d'Abu Sufyan: la figure la plus marquante de la résistance mecquoise à Uhud, qui se convertit avec la conquête de La Mecque; mère du calife Mu'awiya."
  tr: "Mekke Şeyhi Utbah ibn Rabi'ah'ın kızı ve Ebu Sufyan'ın eşi: Mekke'deki en açık biyografi örnekleri Uhud'a meydan okudu ve fetih gününde İslam'ı benimsedi; Halife Muaviye'nin annesiydi. Gerçek rivayette Peygamber gelip şöyle dedi: \"Yeryüzünde saklanan herkes, sizin saklandığınız yerlerdekilerden bana daha çok sevilir ve bugün olanlar, sizin saklandığınız yerlerdekilerden daha çok benim için daha sevilir.\" Ona \"yaramazlık yapan bir adam\" olan Abu Sufyan hakkında sordu ve Abu Sufyan ona iyilik yapmasına izin verdi {cite:sahih-al-bukhari 3825}."
  id: "Putri Sheikh Mekah Utbah ibn Rabi'ah dan istri Abu Sufyan: Contoh biografi paling jelas di Mekah menantang di Uhud, dan dia memeluk Islam pada hari penaklukan; dia adalah ibu Khalifah Muawiyah. Dalam riwayat otentik itu, Nabi datang dan berkata: \"Siapa pun orang yang bersembunyi di bumi lebih saya sukai daripada orang-orang di tempat persembunyianmu, dan apa yang terjadi hari ini lebih saya sukai daripada mereka di tempat persembunyianmu.\" Dia bertanya tentang Abu Sufyan, \"seorang pria yang suka berbuat nakal,\" dan dia mengizinkannya berbuat baik {cite:sahih-al-bukhari 3825}."
