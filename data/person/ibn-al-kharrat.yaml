summary:
  ar: "الحافظ المعروف بابن الخراط أحد الأعلام، مؤلف الأحكام الكبرى والصغرى والجمع بين الصحيحين وكتاب الغريبين في اللغة وكتاب الجمع بين السنة وغير ذلك، نزل بجاية وولي خطابتها وبها توفي بعد محنة لحقته من الدولة في ربيع الآخر سنة اثنتين وثمانين وخمس مئة عن إحدى وسبعين سنة وكان مع جلالته في العلم قانعاً متعففاً موصوفاً بالصلاح والورع ولزوم السنة {cite:shadharat-dhahab p. 751}."
  en: "Ibn al-Kharrat the Sevillian hafiz, author of al-Ahkam al-Kubra and al-Jam' bayn al-Sahihayn; he settled at Bijaya as its preacher and died there in 582 after suffering at the hands of the state, contented, ascetic, holding fast to the Sunna {cite:shadharat-dhahab p. 751}."
