roles: [scholar]
gender: male
summary:
  ar: "عبد الله بن محمود بن مودود الموصلي البلدحي، مجد الدين أبو الفضل، فقيه حنفي من كبارهم، ولد بالموصل وولي قضاء الكوفة مدة ثم درّس ببغداد وتوفي بها سنة 683 هـ، صاحب «الاختيار لتعليل المختار»."
  en: "Abdallah ibn Mahmud ibn Mawdud al-Mawsili al-Baldahi, Majd al-Din Abu al-Fadl, one of the great Hanafi jurists, born at Mosul, judge of Kufa for a time, then a teacher at Baghdad where he died in 683 AH; author of 'al-Ikhtiyar li-Ta'lil al-Mukhtar'."
  es: "Abdallah ibn Mahmud ibn Mawdud al-Mawsili al-Baldahi, Majd al-Din Abu al-Fadl, uno de los grandes juristas hanafíes, nacido en Mosul, juez de Kufa durante un tiempo, luego maestro en Bagdad donde murió en el año 683 de la Hégira; autor de 'al-Ikhtiyar li-Ta'lil al-Mukhtar'."
  fr: "Abdallah ibn Mahmud ibn Mawdud al-Mawsili al-Baldahi, Majd al-Din Abu al-Fadl, l'un des grands juristes hanafites, né à Mossoul, juge de Kufa pendant un certain temps, puis enseignant à Bagdad où il mourut en 683 AH; auteur de 'al-Ikhtiyar li-Ta'lil al-Mukhtar'."
  ur: "عبداللہ بن محمود ابن مودود الموسیلی البلدہی، مجد الدین ابو الفضل، عظیم حنفی فقہاء میں سے ایک، موصل میں پیدا ہوئے، ایک وقت کے لیے کوفہ کے قاضی، پھر بغداد میں استاد رہے جہاں ان کی وفات 683 ہجری میں ہوئی۔ \"الاختیار لِتعلیل المختار\" کے مصنف۔"
