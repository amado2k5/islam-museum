gender: male
summary:
  ar: "من زعماء الخوارج؛ اجتمع عليه الخوارج بالبصرة بعد الفرقة، فسار بهم إلى الأهواز. وينسب الكتاب إليه القول بكفر القاعدة عن القتال وقتل الأطفال، ويصف لين ظاهره وحسن عشرته، ويذكر أن ذلك ظهر منه بعد أن كان الخوارج على رأي واحد {cite:khudari-umayyad-state p.309}."
  tr: "Haricilerin liderlerinden biriydi; ayrılıktan sonra Hariciler Basra'da etrafında toplandı ve onlarla birlikte Ahvaz'a yürüdü. Kitap, El-Kaide'nin çocuklarla savaşmaya ve öldürmeye inanmadığını, onun yumuşaklığını ve iyi dostluğunu anlatır; bunun Hariciler birleşik görüşte olduktan sonra ortaya çıktığını belirtir {cite:khudari-umayyad-state s.309}."
  id: "Ia adalah salah satu pemimpin Kharijit; Kharijit berkumpul di sekitarnya di Basra setelah perpecahan, dan ia ikut berbaris bersama mereka ke Ahvaz. Buku tersebut mengaitkan kepadanya pernyataan bahwa kaidahnya tidak mengizinkan pertempuran dan pembunuhan anak-anak, menggambarkan kelembutan dan kebersamaan baiknya, dan menyebutkan bahwa hal ini muncul setelah Kharijit sepakat {cite:khudari-umayyad-state hlm.309}."
