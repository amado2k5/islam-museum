summary:
  ar: "هشيم بن بشير بن القاسم بن دينار، أبو معاوية، السلمي الواسطي، وقيل إنه بخاري الأصل، محدث بغداد ومفسر وفقيه، كثير الحديث ثقة ثبتا يدلس كثيرا، روى عن الزهري وطبقته، وروى عنه مالك بن أنس وشعبة والثوري. من تصانيفه «تفسير القرآن» و«كتاب السنن» و«كتاب القراءات». عاش بين 104 و183هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  en: "Hushaym ibn Bashir ibn al-Qasim ibn Dinar, Abu Mu'awiya, al-Sulami al-Wasiti, though some say he was of Bukharan origin, the hadith scholar of Baghdad, a commentator and jurist, prolific and trustworthy, but a frequent 'mudallis' (who omits intermediaries). He transmitted from al-Zuhri and his generation, and Malik ibn Anas, Shu'ba and al-Thawri transmitted from him. His works include a Qur'an commentary, a book of Sunan and a book of readings. He lived from 104 to 183 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  es: "Hushaym ibn Bashir ibn al-Qasim ibn Dinar, Abu Mu'awiya, al-Sulami al-Wasiti, aunque algunos afirman que era de origen bujariano, el erudito de hadices de Bagdad, comentarista y jurista, prolífico y fidedigno, pero frecuentemente omitido de intermediarios (mudallis). Transmitió de al-Zuhri y su generación, y Malik ibn Anas, Shu'ba y al-Thawri transmitieron de él. Entre sus obras se incluyen un comentario del Corán, un libro de Sunan y un libro de lecturas. Vivió entre el 104 y el 183 d. H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  fr: "Hushaym ibn Bashir ibn al-Qasim ibn Dinar, également connu sous le nom d'Abu Mu'awiya ou al-Sulami al-Wasiti (bien que certains le disent d'origine boukharienne), était un érudit du hadith de Bagdad, commentateur et juriste prolifique et digne de confiance, mais souvent considéré comme un « mudalli » (qui omettait les intermédiaires). Il transmit les hadiths d'al-Zuhri et de sa génération, et Malik ibn Anas, Shu'ba et al-Thawri les transmettirent également. Parmi ses œuvres figurent un commentaire du Coran, un recueil de Sunan et un livre de lectures. Il vécut de 104 à 183 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  ur: "ہشیم بن بشیر بن القاسم ابن دینار، ابو معاویہ، السلمی الوصیطی، اگرچہ بعض کہتے ہیں کہ وہ بخاری نژاد، بغداد کے محدث، مفسر اور فقیہ، فاضل اور ثقہ تھے، لیکن متواتر 'مدلس' ⁦(جو ثالثی کو چھوڑ دیتے ہیں)⁩۔ انہوں نے زہری اور ان کی نسل سے روایت کی ہے اور مالک بن انس، شعبہ اور الثوری نے ان سے روایت کی ہے۔ ان کی تصانیف میں ایک قرآن کی تفسیر، ایک کتاب سنن اور ایک کتاب قرأت شامل ہے۔ وہ 104 سے 183 ہجری تک زندہ رہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص2073}"
