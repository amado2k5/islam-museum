summary:
  ar: "هشيم بن بشير بن القاسم بن دينار، أبو معاوية، السلمي الواسطي، وقيل إنه بخاري الأصل، محدث بغداد ومفسر وفقيه، كثير الحديث ثقة ثبتا يدلس كثيرا، روى عن الزهري وطبقته، وروى عنه مالك بن أنس وشعبة والثوري. من تصانيفه «تفسير القرآن» و«كتاب السنن» و«كتاب القراءات». عاش بين 104 و183هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
  en: "Hushaym ibn Bashir ibn al-Qasim ibn Dinar, Abu Mu'awiya, al-Sulami al-Wasiti, though some say he was of Bukharan origin, the hadith scholar of Baghdad, a commentator and jurist, prolific and trustworthy, but a frequent 'mudallis' (who omits intermediaries). He transmitted from al-Zuhri and his generation, and Malik ibn Anas, Shu'ba and al-Thawri transmitted from him. His works include a Qur'an commentary, a book of Sunan and a book of readings. He lived from 104 to 183 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2073}"
