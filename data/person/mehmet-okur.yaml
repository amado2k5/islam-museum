  ar: "لاعب كرة سلة تركي سابق ومدرب (وُلد سنة 1979 في يالوفا)، أول لاعب تركي يفوز ببطولة NBA (مع ديترويت بيستونز سنة 2004)، وأمضى سبعة مواسم مع يوتا جاز، ثم صار سنة 2016 أول مواطن تركي يعمل مدرباً في NBA."
