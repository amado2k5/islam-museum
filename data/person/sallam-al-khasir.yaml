aliases: [person/salm-al-khasir]
summary:
  ar: "شاعر رثى البرامكة بقوله خوت أنجم الجدوى وشلت يد الندى وغاضت بحار الجود بعد البرامك {cite:muruj-al-dhahab p. 367}. وعدّه ابن النديم في الشعراء الذين يظهرون الإسلام ويبطنون الزندقة {cite:fihrist-ibn-al-nadim p. 473}."
  en: "The poet of 'the seas of bounty ebbed after the Barmakids' {cite:muruj-al-dhahab p. 367}. وعدّه ابن النديم في الشعراء الذين يظهرون الإسلام ويبطنون الزندقة {cite:fihrist-ibn-al-nadim p. 473}."
  es: "El poeta de «los mares de abundancia retrocedieron tras los Barmakids» {cita:muruj-al-dhahab p. 367}. Ibn al-Nadim lo incluyó entre los poetas que exteriormente profesan el Islam pero interiormente albergan herejía {cita:fihrist-ibn-al-nadim p. 473}."
  fr: "Le poète de « la mer de l'abondance s'est retirée après les Barmakids » {cite:muruj-al-dhahab p. 367}. Ibn al-Nadim l'a inclus parmi les poètes qui professent extérieurement l'islam mais qui abritent intérieurement l'hérésie {cite:fihrist-ibn-al-nadim p. 473}."
  ur: "'برمکوں کے بعد فضل کے سمندر ابل پڑے' کا شاعر 367}۔ ان اشعار میں ابن الندیم کا وعدہ جو اسلام کا اظہار کرتے ہیں اور بدعت پر مشتمل ہیں 473}۔"
  tr: "Barmakilere ağıt tutan bir şair, şöyle demiştir: 'Kardeşler erdem yıldızlarıdır, çiy eli felç oldu ve cömertlik denizleri Barmakilerden sonra battı.' {atıf:muruj-al-dhahab, s. 367}. İbn el-Nadim, onu açıkça İslam'ı benimseyen ve sapkınlığı gizleyen şairler arasında vaat etti {atıf:fihrist-ibn-al-nadim s. 473}."
  id: "Seorang penyair yang meratapi Barmakid, berkata: 'Saudara adalah bintang kebajikan, tangan embun lumpuh, dan lautan kemurahan hati tenggelam setelah Barmakid' {cite:muruj-al-dhahab, hlm. 367}. Ibn al-Nadim menjanjikan dia di antara para penyair yang secara terbuka memeluk Islam dan menyembunyikan bid'ah {cite:fihrist-ibn-al-nadim hlm. 473}."
