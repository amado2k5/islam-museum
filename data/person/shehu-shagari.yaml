summary:
  ar: "سياسي نيجيري (1925–2018) من بلدة شاجاري بولاية صكتو، عمل معلّما ثم نائبا في مجلس النواب من 1954 ووزيرا اتحاديا في مناصب متعاقبة، فصار أول رئيس منتخب ديمقراطيا لنيجيريا في الجمهورية الثانية (1979–1983)، وأعيد انتخابه سنة 1983 ثم أطاح به انقلاب نهاية ذلك العام. مات في أبوجا في 28 ديسمبر 2018 عن 93 عاما."
  en: "Nigerian politician (1925–2018) from the town of Shagari in Sokoto State who worked as a teacher, sat in the House of Representatives from 1954 and held a succession of federal cabinet posts, before becoming Nigeria's first democratically elected president in the Second Republic (1979–1983). Re-elected in 1983, he was overthrown by a coup at the end of that year. He died in Abuja on 28 December 2018, aged 93."
  ur: "نائجریائی سیاست دان ⁦(1925ء–2018ء)⁩، ریاست صوکوتو کے قصبہ شاگاری سے تعلق؛ مدرس رہے، 1954 سے ایوانِ نمائندگان کے رکن اور پے در پے وفاقی وزیر رہے، پھر دوسری جمہوریہ میں نائجریا کے پہلے جمہوری طور پر منتخب صدر بنے ⁦(1979ء–1983ء)⁩۔ 1983 میں دوبارہ منتخب ہوئے مگر اسی سال کے اختتام پر بغاوت نے انھیں ہٹا دیا۔ 28 دسمبر 2018 کو ابوجا میں 93 برس کی عمر میں وفات پائی۔"
  es: "Político nigeriano (1925-2018) originario de Shagari, en el estado de Sokoto, que se desempeñó como maestro, fue miembro de la Cámara de Representantes desde 1954 y ocupó diversos cargos en el gabinete federal, antes de convertirse en el primer presidente de Nigeria elegido democráticamente durante la Segunda República (1979-1983). Reelegido en 1983, fue derrocado por un golpe de Estado a finales de ese año. Falleció en Abuja el 28 de diciembre de 2018, a los 93 años."
  fr: "Homme politique nigérian (1925-2018), originaire de Shagari, dans l'État de Sokoto, il exerça la profession d'enseignant, siégea à la Chambre des représentants à partir de 1954 et occupa plusieurs postes ministériels fédéraux avant de devenir le premier président démocratiquement élu du Nigeria, sous la Deuxième République (1979-1983). Réélu en 1983, il fut renversé par un coup d'État à la fin de cette même année. Il s'est éteint à Abuja le 28 décembre 2018, à l'âge de 93 ans."
  tr: "Sekoto Eyaleti'nin Shagari kasabasından Nijeryalı bir politikacı (1925–2018) olan Nijerya, öğretmen olarak çalıştı, ardından 1954'ten itibaren Temsilciler Meclisi üyesi ve ardışık federal bakan olarak görev yaptı. İkinci Cumhuriyet'te (1979–1983) Nijerya'nın demokratik olarak seçilen ilk cumhurbaşkanı oldu, 1983'te yeniden seçildi ve o yılın sonunda bir darbeyle görevden alındı. 28 Aralık 2018'de Abuja'da 93 yaşında hayatını kaybetti."
  id: "Seorang politikus Nigeria (1925–2018) dari kota Shagari di Negara Bagian Sekoto, ia bekerja sebagai guru, kemudian sebagai anggota Dewan Perwakilan Rakyat sejak 1954, dan sebagai menteri federal dalam beberapa posisi berturut-turut. Ia menjadi presiden Nigeria pertama yang terpilih secara demokratis di Republik Kedua (1979–1983), terpilih kembali pada tahun 1983, dan digulingkan dalam kudeta pada akhir tahun itu. Ia meninggal di Abuja pada 28 Desember 2018, di usia 93 tahun."
