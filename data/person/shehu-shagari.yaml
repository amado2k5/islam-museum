summary:
  ar: "سياسي نيجيري (1925–2018) من بلدة شاجاري بولاية صكتو، عمل معلّما ثم نائبا في مجلس النواب من 1954 ووزيرا اتحاديا في مناصب متعاقبة، فصار أول رئيس منتخب ديمقراطيا لنيجيريا في الجمهورية الثانية (1979–1983)، وأعيد انتخابه سنة 1983 ثم أطاح به انقلاب نهاية ذلك العام. مات في أبوجا في 28 ديسمبر 2018 عن 93 عاما."
  en: "Nigerian politician (1925–2018) from the town of Shagari in Sokoto State who worked as a teacher, sat in the House of Representatives from 1954 and held a succession of federal cabinet posts, before becoming Nigeria's first democratically elected president in the Second Republic (1979–1983). Re-elected in 1983, he was overthrown by a coup at the end of that year. He died in Abuja on 28 December 2018, aged 93."
  ur: "نائجریائی سیاست دان (1925ء–2018ء)، ریاست صوکوتو کے قصبہ شاگاری سے تعلق؛ مدرس رہے، 1954 سے ایوانِ نمائندگان کے رکن اور پے در پے وفاقی وزیر رہے، پھر دوسری جمہوریہ میں نائجریا کے پہلے جمہوری طور پر منتخب صدر بنے (1979ء–1983ء)۔ 1983 میں دوبارہ منتخب ہوئے مگر اسی سال کے اختتام پر بغاوت نے انھیں ہٹا دیا۔ 28 دسمبر 2018 کو ابوجا میں 93 برس کی عمر میں وفات پائی۔"
