id: person/bugha-al-kabir
class: person
label: { ar: "بُغا مولى المعتصم ⁦(بُغا الكبير)⁩", en: "Bugha, mawla of al-Mu'tasim (Bugha the Elder)", es: "Bugha, mawla of al-Mu'tasim (Bugha the Elder)", fr: "Bugha, mawla of al-Mu'tasim (Bugha the Elder)", ur: "بگھا، معتصم کا مولا ⁦(بغضہ بزرگ)⁩" }
summary:
  ar: "بُغا مولى المعتصم بالله؛ عند البلاذري عن أهل برذعة: كان والي أرمينية وأذربيجان وشمشاط فعمّر شمكور في سنة 240 بعد أن أخربتها الساوردية وأسكنها قوماً خرجوا إليه من الخزر مستأمنين لرغبتهم في الإسلام ونقل إليها التجار من برذعة وسمّاها المتوكلية. وعند المسعودي حيل به فطرحت الرقاع في مضرب المتوكل أنه دبر قتله وفي مضربه هو أن غلماناً عزموا على الفتك بالخليفة فركب بخيله يحرس المواضع فصدق المتوكل الرقاع وقال له أبت نفسي مكانك مني وخلفه بالشام فأحدث الموالي عليه ما أحدثوا ولم يعلم أحد الحيلة إلى أن تمت {cite:muruj-al-dhahab p. 502-503}"
  en: "Bugha, mawla of al-Mu'tasim bi'llah (the Elder); in al-Baladhuri from Bardha'a's people: while governor of Armenia, Adharbayjan and Shimshat he rebuilt Shamkur in year 240 after the Sawardiyya had ruined it, settling in it people who came out to him from the Khazars under safe-conduct desiring Islam, transferring Bardha'a's merchants to it and naming it al-Mutawakkiliyya."
  es: "Bugha, mawla de al-Mu'tasim bi'llah (el Mayor); en al-Baladhuri del pueblo de Bardha'a: mientras era gobernador de Armenia, Adharbayjan y Shimshat, reconstruyó Shamkur en el año 240 después de que Sawardiyya lo arruinara, instalando en él a personas que vinieron a él desde los jázaros bajo salvoconducto deseando el Islam, transfiriendo allí a los comerciantes de Bardha'a y llamándolo al-Mutawakkiliyya."
  fr: "Bugha, mawla d'al-Mu'tasim bi'llah (l'Ancien); à al-Baladhuri du peuple de Bardha'a: alors qu'il était gouverneur de l'Arménie, Adharbayjan et Shimshat, il reconstruisit Shamkur en 240 après que les Sawardiyya l'avaient ruiné, y installant les gens qui lui étaient venus des Khazars sous sauf-conduit désirant l'Islam, y transférant les marchands de Bardha'a et le nommant al-Mutawakkiliyya."
  ur: "بگھا، معتصم باللہ ⁦(بزرگ)⁩ کا مولا؛ البلادوری میں بردعہ کے لوگوں سے: آرمینیا، ادھربایجان اور شمشات کے گورنر رہتے ہوئے، اس نے 240 میں شمکور کو سوروردیہ کے برباد کرنے کے بعد دوبارہ تعمیر کیا، اس میں ان لوگوں کو آباد کیا جو خزروں سے اسلام کے خواہاں تھے، محفوظ طرز عمل کے تحت اس کے پاس آئے تھے، بردعا اور اسے نمرچوں میں منتقل کیا تھا۔ المتوکلیہ۔"
  tr: "Buğa, el-Mutasim Billah'ın özgür kalınan adamıydı; el-Baladhuri'ye göre Bardha'a halkından: Ermenistan, Azerbaycan ve Şaşat valisiydi. Savardidler tarafından yıkıldıktan sonra 240 Hicri Shamkur'u atadı. Orada İslam'a geçmek isteyen Hazar halkıyla birlikte yerleşti. Bardha'a'dan tüccarlar buraya nakledildi ve buraya al-Mutawakkil adını verdiler. al-Mas'a göre 'ud, aldandı ve al-Ruqa'a, al-Mutavakkil'in seferinde onu öldürmeyi planladığıyla suçlandı. Savaşında iki çocuk halifeyi öldürmeye karar verdi, bu yüzden mevzileri korumak için süvarilerine bindi. Al-Mutawakkil el-Ruka'a'ya inandı ve 'Yerini benden almayı tercih ederim ve onun yerine al-Şam'da geçerim.' dedi. Özgür bırakılmışlar ona ne yaptıklarını anlattılar ve kimse hilenin tamamlanana kadar bilemedi {alıntı:Muruj-al-Dhahab, s. 502-503}."
  id: "Bugha adalah mantan al-Mu'tasim Billah; menurut al-Baladhuri dari masyarakat Bardha'a: Ia adalah gubernur Armenia, Azerbaijan, dan Shashat. Ia mengangkat Shamkur pada tahun 240 H setelah Savardid menghancurkannya. Ia menetap di sana bersama orang-orang Khazar yang datang kepadanya untuk mencari perlindungan karena ingin masuk Islam. Para pedagang dari Bardha'a dipindahkan ke sana dan menamainya al-Mutawakkil. Menurut al-Mas'ud, ia telah ditipu dan al-Ruqa'a dituduh dalam kampanye al-Mutawakkil bahwa ia berencana membunuhnya. Dalam pertempurannya, dua anak laki-laki memutuskan untuk membunuh khalifah, sehingga ia menuruni pasukan kavaleri untuk menjaga posisi. Al-Mutawakkil percaya pada al-Ruqa'a dan berkata, 'Saya lebih memilih tempatmu daripada saya dan menggantikannya di al-Sham.' Para mantan anak memberitahu apa yang telah mereka lakukan, dan tak seorang pun tahu trik itu sampai selesai {cite::Muruj-al-Dhahab, hlm. 502-503}."
