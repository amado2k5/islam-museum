id: person/bugha-al-kabir
class: person
label: { ar: "بُغا مولى المعتصم (بُغا الكبير)", en: "Bugha, mawla of al-Mu'tasim (Bugha the Elder)" }
summary:
  ar: "بُغا مولى المعتصم بالله؛ عند البلاذري عن أهل برذعة: كان والي أرمينية وأذربيجان وشمشاط فعمّر شمكور في سنة 240 بعد أن أخربتها الساوردية وأسكنها قوماً خرجوا إليه من الخزر مستأمنين لرغبتهم في الإسلام ونقل إليها التجار من برذعة وسمّاها المتوكلية.، وعند المسعودي حيل به فطرحت الرقاع في مضرب المتوكل أنه دبر قتله وفي مضربه هو أن غلماناً عزموا على الفتك بالخليفة فركب بخيله يحرس المواضع فصدق المتوكل الرقاع وقال له أبت نفسي مكانك مني وخلفه بالشام فأحدث الموالي عليه ما أحدثوا ولم يعلم أحد الحيلة إلى أن تمت {cite:muruj-al-dhahab p. 502-503}"
  en: "Bugha, mawla of al-Mu'tasim bi'llah (the Elder); in al-Baladhuri from Bardha'a's people: while governor of Armenia, Adharbayjan and Shimshat he rebuilt Shamkur in year 240 after the Sawardiyya had ruined it, settling in it people who came out to him from the Khazars under safe-conduct desiring Islam, transferring Bardha'a's merchants to it and naming it al-Mutawakkiliyya."
