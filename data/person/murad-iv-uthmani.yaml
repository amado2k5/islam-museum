summary:
  ar: "مراد الرابع بن أحمد الأول، سلطان عثماني ⁦(1049-1032هـ)⁩؛ أصلح الداخلية وقضى على طغاة العسكر، وقاد بنفسه استرداد بغداد من الصفويين سنة 1048هـ، ولقبه المؤرخون بمؤسس الدولة الثاني؛ توفي 1640م وترك الخزينة مملوءة."
  en: "Murad IV b. Ahmad I, Ottoman sultan (1032-1049 AH); reformed the interior and crushed the military tyrants, personally led the recovery of Baghdad from the Safavids in 1048, called 'second founder of the state' by historians; died 1640 leaving a full treasury."
  es: "Murad IV, hijo de Ahmad I, sultán otomano (1032-1049 AH); reformó el interior y aplastó a los tiranos militares, dirigió personalmente la recuperación de Bagdad de los safávidas en 1048, llamado \"segundo fundador del estado\" por los historiadores; murió en 1640 dejando un tesoro repleto."
  fr: "Murad IV b. Ahmad I, sultan ottoman (1032-1049 AH); réforma l'intérieur et écrasa les tyrans militaires, mena personnellement la reprise de Bagdad aux Safavides en 1048, appelé « second fondateur de l'État » par les historiens; mourut en 1640 en laissant un trésor plein."
  ur: "مراد چہارم ب۔ احمد اول، عثمانی سلطان ⁦(1032-1049ھ)⁩؛ داخلہ کی اصلاح کی اور فوجی ظالموں کو کچل دیا، ذاتی طور پر 1048 میں صفویوں سے بغداد کی بازیابی کی قیادت کی، جسے مورخین نے 'ریاست کا دوسرا بانی' کہا ہے۔ 1640 میں انتقال کر گئے ایک مکمل خزانہ چھوڑ کر۔"
