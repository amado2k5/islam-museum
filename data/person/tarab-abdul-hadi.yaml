summary:
  ar: "ناشطة نسوية فلسطينية من جنين (1910–1976)، شاركت في تأسيس المؤتمر النسائي العربي الفلسطيني سنة 1929، أول منظمة نسائية في فلسطين زمن الانتداب، وكانت من قيادات جمعية السيدات العربيات؛ وهي زوجة السياسي عوني عبد الهادي."
  en: "Palestinian feminist activist from Jenin (1910–1976). In 1929 she co-founded the Palestine Arab Women's Congress, the first women's organization in Mandate Palestine, and was a leading organizer of the Arab Women's Association; she was the wife of the politician Awni Abd al-Hadi."
  ur: "جنین سے تعلق رکھنے والی فلسطینی حقوق نسواں کی کارکن (1910–1976)؛ 1929 میں انھوں نے فلسطینی عرب خواتین کانگریس کی مشترکہ بنیاد رکھی، جو انتداب فلسطین کی پہلی خواتین تنظیم تھی، اور عرب خواتین ایسوسی ایشن کی نمایاں منتظم رہیں؛ وہ سیاست دان عونی عبد الہادی کی اہلیہ تھیں۔"
