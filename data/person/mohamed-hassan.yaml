summary:
  ar: "داعية إسلامي مصري، وُلد في قرية دموه بمحافظة الدقهلية سنة 1962، حفظ القرآن في الثامنة من عمره، وتلقى العلم عن ابن باز وابن عثيمين وابن جبرين، ودرّس الحديث في جامعة الإمام محمد بن سعود بالقصيم، وأطلق قناة الرحمة الفضائية سنة 2007 فكانت منصته الأبرز، ويرأس مجلس إدارة مجمع أهل السنة بالمنصورة، وله أكثر من خمسة عشر كتابا."
  en: "Egyptian Muslim preacher, born in the village of Damouh in Dakahlia Governorate in 1962. He memorised the Quran by the age of eight, studied under Ibn Baz, Ibn Uthaymin and Ibn Jibrin, taught hadith at Imam Muhammad ibn Saud University in Qassim, and in 2007 launched the Al Rahma satellite channel, which became his principal platform. He chairs the board of the Ahl al-Sunna Complex in Mansoura and has written more than fifteen books."
  ur: "مصری مسلمان مبلغ، جو 1962 میں محافظہ دقہلیہ کے گاؤں دموہ میں پیدا ہوئے۔ انہوں نے آٹھ برس کی عمر میں قرآن حفظ کیا، ابن باز، ابن عثیمین اور ابن جبرین سے علم حاصل کیا، قسیم میں جامعہ امام محمد بن سعود میں حدیث پڑھائی، اور 2007 میں الرحمہ سیٹلائٹ چینل شروع کیا جو ان کا سب سے بڑا پلیٹ فارم بنا۔ وہ منصوره میں مجمع اہل السنہ کے بورڈ کے صدر ہیں اور انہوں نے پندرہ سے زائد کتابیں لکھیں۔"
