summary:
  ar: "سياسي أفغاني وقائد مجاهدين، من أسرة مجددي العلمية الصوفية في كابل. درس الشريعة في الأزهر ودرّس في جامعة كابل، وأسس جبهة التحرير الوطني الأفغاني سنة 1979 وكان أول من دعا إلى الجهاد ضد النظام الشيوعي، ثم صار رئيس أفغانستان المؤقت من أبريل إلى يونيو 1992 بعد سقوط حكومة نجيب الله، ورأس اللويا جيرغا سنة 2003 ومجلس الشيوخ لاحقا، وتوفي في كابل سنة 2019."
  en: "Afghan politician and mujahideen leader, from Kabul's Mojaddedi family of religious scholars. He studied Islamic law at al-Azhar and taught at Kabul University, founded the Afghan National Liberation Front in 1979 and was the first to call for jihad against the communist regime, then served as interim president of Afghanistan from April to June 1992 after the fall of Najibullah's government. He chaired the 2003 loya jirga and later the upper house, and died at Kabul in 2019."
  ur: "افغان سیاست دان اور مجاہد رہنما، کابل کے مجددی علمی خاندان سے۔ جامعہ ازہر میں شریعت کی تعلیم پائی اور جامعہ کابل میں تدریس کی، 1979ء میں افغان نیشنل لبریشن فرنٹ قائم کیا اور کمیونسٹ حکومت کے خلاف جہاد کی پہلی آواز اٹھائی، پھر نجیب اللہ حکومت کے خاتمے کے بعد اپریل تا جون 1992ء افغانستان کے عبوری صدر رہے۔ 2003ء کے لویا جرگے کی صدارت کی اور بعد میں ایوانِ بالا کے سربراہ رہے، اور 2019ء میں کابل میں انتقال کر گئے۔"
