summary:
  ar: "أبو علي محمد بن أحمد بن عبد الله بن أحمد بن الوليد الكرخي، شيخ المعتزلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} أخذ عن أبي الحسين البصري وغيره، وقرأ ابن السمناني الكلام عليه، وكان ذا زهد وورع وقناعة وتعبد، ولما افتقر جعل ينقض داره ويبيع خشبها ويتقوت به، وكانت من حسان الدور ببغداد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} وقال الحافظ الذهبي: له عدة تصانيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} والمصادر المذكورة: العبر في خبر من غبر، وشذرات الذهب، وسير أعلام النبلاء، والجواهر المضيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} وفي رأس الترجمة تاريخان «٤٨٧» و«٤٠٥» ولم يُبيّن أيهما الوفاة وأيهما الميلاد."
  en: "Abu Ali Muhammad ibn Ahmad ibn Abd Allah ibn Ahmad ibn al-Walid al-Karkhi, the shaykh of the Mu'tazila. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} He learned from Abu al-Husayn al-Basri and others, and Ibn al-Samnani read kalam with him; he was a man of asceticism, scrupulousness, contentment and devotion, and when poverty struck he began dismantling his house and selling its timber for food, though it was among the fine houses of Baghdad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} Al-Dhahabi said he has several works. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} The cited sources are al-'Ibar fi khabar man ghabar, Shadharat al-dhahab, Siyar a'lam al-nubala' and al-Jawahir al-mudi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} The heading prints two figures, 487 and 405, without saying which is the birth and which the death."
  es: "Abu Ali Muhammad ibn Ahmad ibn Abd Allah ibn Ahmad ibn al-Walid al-Karkhi, el shaykh de los Mu'tazila. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} Aprendió de Abu al-Husayn al-Basri y otros, e Ibn al-Samnani leyó kalam con él; era un hombre de ascetismo, escrupulosidad, contentamiento y devoción, y cuando la pobreza lo golpeó comenzó a desmantelar su casa y vender su madera para obtener comida, aunque estaba entre las casas más bellas de Bagdad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} Al-Dhahabi dijo que tiene varias obras. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} Las fuentes citadas son al-'Ibar fi khabar man ghabar, Shadharat al-dhahab, Siyar a'lam al-nubala' y al-Jawahir al-mudi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} El encabezado imprime dos cifras, 487 y 405, sin decir cuál es el nacimiento y cuál la muerte."
  fr: "Abou Ali Muhammad ibn Ahmad ibn Abd Allah ibn Ahmad ibn al-Walid al-Karkhi, le cheikh des Mu'tazilites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} Il étudia auprès d'Abou al-Husayn al-Basri et d'autres, et Ibn al-Samnani étudia le kalam avec lui; c'était un homme ascétique, scrupuleux, content de lui-même et dévotionnel. Lorsque la pauvreté le frappa, il commença à démanteler sa maison et à vendre son bois pour se nourrir, bien qu'elle comptât parmi les plus belles demeures de Bagdad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} Al-Dhahabi rapporte qu'il est l'auteur de plusieurs ouvrages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} Les sources citées sont al-'Ibar fi khabar man ghabar, Shadharat al-dhahab, Siyar a'lam al-nubala' et al-Jawahir al-mudi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} Le titre imprime deux chiffres, 487 et 405, sans dire lequel est la naissance et lequel est la mort."
  ur: "ابو علی محمد بن احمد بن عبد اللہ بن احمد بن ولید الکرخی، معتزلہ کے شیخ۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 18077} انہوں نے ابو الحسین البصری اور دیگر لوگوں سے علم حاصل کیا اور ابن سمنانی نے ان کے ساتھ کلام پڑھا۔ وہ پرہیزگاری، پرہیزگاری، قناعت اور عقیدت کا آدمی تھا، اور جب غربت پڑ گئی تو اس نے اپنا گھر توڑنا شروع کر دیا اور اس کی لکڑی کھانے کے لیے بیچنا شروع کر دی، حالانکہ یہ بغداد کے عمدہ گھروں میں سے تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18077} الذہبی نے کہا کہ اس کے کئی کام ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18077} مذکور مآخذ الابر فی خبر من غبر، شدارت الذہب، سیار اعلام النبلاء اور الجواہر المدیعہ ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 18077} سرخی دو اعداد 487 اور 405 پرنٹ کرتی ہے، بغیر یہ کہے کہ کون سا پیدائش ہے اور کون سی موت۔"
