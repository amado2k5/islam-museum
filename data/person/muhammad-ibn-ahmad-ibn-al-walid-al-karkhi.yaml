summary:
  ar: "أبو علي محمد بن أحمد بن عبد الله بن أحمد بن الوليد الكرخي، شيخ المعتزلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} أخذ عن أبي الحسين البصري وغيره، وقرأ ابن السمناني الكلام عليه، وكان ذا زهد وورع وقناعة وتعبد، ولما افتقر جعل ينقض داره ويبيع خشبها ويتقوت به، وكانت من حسان الدور ببغداد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} وقال الحافظ الذهبي: له عدة تصانيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} والمصادر المذكورة: العبر في خبر من غبر، وشذرات الذهب، وسير أعلام النبلاء، والجواهر المضيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} وفي رأس الترجمة تاريخان «٤٨٧» و«٤٠٥» ولم يُبيّن أيهما الوفاة وأيهما الميلاد."
  en: "Abu Ali Muhammad ibn Ahmad ibn Abd Allah ibn Ahmad ibn al-Walid al-Karkhi, the shaykh of the Mu'tazila. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} He learned from Abu al-Husayn al-Basri and others, and Ibn al-Samnani read kalam with him; he was a man of asceticism, scrupulousness, contentment and devotion, and when poverty struck he began dismantling his house and selling its timber for food, though it was among the fine houses of Baghdad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} Al-Dhahabi said he has several works. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} The cited sources are al-'Ibar fi khabar man ghabar, Shadharat al-dhahab, Siyar a'lam al-nubala' and al-Jawahir al-mudi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18077} The heading prints two figures, 487 and 405, without saying which is the birth and which the death."
