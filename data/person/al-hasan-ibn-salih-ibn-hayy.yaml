id: person/al-hasan-ibn-salih-ibn-hayy
class: person
label: { ar: "الحسن بن صالح بن حي", en: "Al Hasan Ibn Salih Ibn Hayy", es: "Al Hasan Ibn Salih Ibn Hayy", fr: "Al Hasan Ibn Salih Ibn Hayy", ur: "الحسن ابن صالح ابن حیا" }
summary:
  ar: "الحسن بن صالح بن حي ولد سنة مائة ومات متخفيا سنة ثمان وستين ومائة، وكان من كبار الشيعة الزيدية وعظمائهم وعلمائهم وكان فقيها متكلما وله كتاب التوحيد وكتاب إمامة ولد علي من فاطمة وكتاب الجامع في الفقه، وله أخوان علي بن صالح وصالح بن صالح على مذهبه وكان علي متكلما {cite:fihrist-ibn-al-nadim p. 253}."
  en: "Al-Hasan ibn Salih ibn Hayy — the Zaydi jurist who died in hiding in 168 {cite:fihrist-ibn-al-nadim}"
  es: "Al-Hasan ibn Salih ibn Hayy — el jurista zaidí que murió escondido en 168 {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Hasan ibn Salih ibn Hayy — le juriste zaydite mort caché en 168 {cite:fihrist-ibn-al-nadim}"
  ur: "الحسن بن صالح ابن حیی - زیدی فقیہ جو 168 میں روپوش ہوئے"
  tr: "El-Hasan bin Salih ibn Hayy, yüzüncü yılda doğdu ve kılık değiştirerek öldü. Büyük Zeydi Şiilerinden ve onların büyük alimlerinden biriydi. Bir hukukçu ve teologdu. Tevhid kitabı, Fatime'den doğan İmamat kitabı ve El-Cemi fi el-Fiqh adlı kitabı yazdı. Onun okulundan Ali ibn Salih ve Salih ibn Salih adında kardeşleri vardı ve Ali bir ilahiyatçıydı {cite:fihrist-ibn-al-nadim s. 253}."
  id: "Al-Hasan ibn Salih ibn Hayy lahir pada tahun seratus dan meninggal dengan menyamar. Ia adalah salah satu Syiah Zaydi besar dan para ulama besar mereka. Ia adalah ahli hukum dan teolog. Ia menulis kitab Tawhid, kitab Imamate yang lahir dari Fatimah, dan buku Al-Jami' fi al-Fiqh. Ia memiliki saudara laki-laki Ali ibn Salih dan Saleh ibn Salih yang mengikuti sekolahnya, dan Ali adalah seorang teolog {cite:fihrist-ibn-al-nadim hlm. 253}."
