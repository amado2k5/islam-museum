label: { ar: "الحسن بن صالح بن حي", en: "Al Hasan Ibn Salih Ibn Hayy" }
summary:
  ar: "الحسن بن صالح بن حي ولد سنة مائة ومات متخفيا سنة ثمان وستين ومائة، وكان من كبار الشيعة الزيدية وعظمائهم وعلمائهم وكان فقيها متكلما وله كتاب التوحيد وكتاب إمامة ولد علي من فاطمة وكتاب الجامع في الفقه، وله أخوان علي بن صالح وصالح بن صالح على مذهبه وكان علي متكلما {cite:fihrist-ibn-al-nadim p. 253}."
  en: "Al-Hasan ibn Salih ibn Hayy — the Zaydi jurist who died in hiding in 168 {cite:fihrist-ibn-al-nadim}"
sources: [source/fihrist-ibn-al-nadim]
