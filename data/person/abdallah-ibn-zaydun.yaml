summary:
  ar: "عبد الله بن أحمد بن غالب بن زيدون؛ يُكنى أبا بكر؛ والد الشاعر أبي الوليد ابن زيدون؛ ذكره ابن بشكوال في كتاب «الصلة» وأثنى عليه؛ وكان يخضب بالسواد {cite:wafayat-ayan}."
  en: "Abdallah b. Ahmad b. Ghalib b. Zaydun (354–405) — kunya Abu Bakr; father of the poet Ibn Zaydun; praised by Ibn Bashkuwal in al-Sila; died at al-Bira and was buried at Cordoba {cite:wafayat-ayan}."
  fr: "Abdallah b. Ahmad b. Ghalib b. Zaydun (354–405) — kunya Abu Bakr ; père du poète Ibn Zaydun ; loué par Ibn Bashkuwal dans al-Sila ; mort à al-Bira et inhumé à Cordoue {cite:wafayat-ayan}."
  es: "Abdalá b. Ahmad b. Ghalib b. Zaydún (354–405) – kunya Abu Bakr; padre del poeta Ibn Zaydun; elogiado por Ibn Bashkuwal en al-Sila; murió en al-Bira y fue enterrado en Córdoba {cita:wafayat-ayan}."
  ur: "عبداللہ بی احمد بی۔ غالب بی۔ زیدون (354-405) - کنیا ابوبکر؛ شاعر ابن زیدون کے والد؛ ابن بشکوال نے السلا میں تعریف کی ہے۔ البیرہ میں وفات پائی اور قرطبہ میں دفن ہوئے۔"
  tr: "Abdullah ibn Ahmed ibn Ghalib ibn Zaydun; Ebu Bekir olarak da bilinir; şair Ebu el-Velid ibn Zaydun'un babası; İbn Başkuwal onu \"El-Sila\" adlı kitabında zikretmiş ve övmüştür; ve saçlarını siyaha boyardı. {Kaynak: Wafayat-ayan}"
  id: "Abdullah ibn Ahmad ibn Ghalib ibn Zaydun; dikenal sebagai Abu Bakr; ayah dari penyair Abu al-Walid ibn Zaydun; Ibn Bashkuwal menyebutkannya dalam kitab “Al-Sila” dan memujinya; dan dia biasa mewarnai rambutnya menjadi hitam {cite:wafayat-ayan}."
