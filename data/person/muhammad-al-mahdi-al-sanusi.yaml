summary:
  ar: "محمد بن محمد بن علي السنوسي، المهدي ⁦(١٨٤٣–نحو ١٩٠٢م)⁩؛ زعيم السنوسية الثاني، خلف أباه بعد موته واشتهر بالصلاح، وقويت الطريقة في أيامه حتى انتشرت زواياها من المغرب الأقصى إلى الهند ومن وداي إلى الآستانة وأكثرها في الصحراء الكبرى وشمال أفريقية، وكان في كل زاوية خليفة يدير شؤونها ويعلم أولاد الناس ويقتني الماشية ويشتغل بالزراعة، يساعده المريدون وينفق على الزاوية وما يفيض عنه يرسله إلى الشيخ، فأصبح صاحب الطريقة أشبه بملك يُجبى إليه الخراج. وخاف السلطان عبد الحميد مغبة أمره فشعر الشيخ بذلك فرحل سنة ١٣١٢هـ إلى واحة الكفرة وانتقل منها إلى وداي فتوفي فيها {cite:al-aalam tarjama}."
  en: "Muhammad al-Mahdi al-Sanusi (1843–c. 1902 CE) — second leader of the Sanusiyya, under whom its zawiyas stretched from Morocco to India, each a self-supporting khalifa-run community {cite:al-aalam tarjama}."
  es: "Muhammad al-Mahdi al-Sanusi (1843–c. 1902 d. C.): segundo líder de los Sanusiyya, bajo cuyo mando sus zawiyas se extendían desde Marruecos hasta la India, cada una de las cuales era una comunidad autosuficiente dirigida por un califa {citar:al-aalam tarjama}."
  fr: "Muhammad al-Mahdi al-Sanusi (1843 – vers 1902 CE) — deuxième chef de la Sanusiyya, sous lequel ses zawiyas s'étendaient du Maroc à l'Inde, chacune étant une communauté autonome dirigée par un khalifa {cite: al-aalam tarjama}."
  ur: "محمد المہدی السنوسی ⁦(1843-c. 1902 عیسوی)⁩ - سنوسیہ کا دوسرا رہنما، جس کے ماتحت اس کے زاویہ مراکش سے ہندوستان تک پھیلے ہوئے تھے، ہر ایک خلیفہ کے زیر انتظام چلنے والی ایک کمیونٹی {حوالہ: العالم ترجمہ}۔"
  tr: "Muhammed bin Muhammed bin Ali el-Sanusi, Mehdi (1843–yaklaşık 1902), Sanusiyya'nın ikinci lideri, babasının ölümünden sonra onun yerine geçti ve doğruluğuyla ün kazandı. Onun döneminde tarikat o kadar güçlendi ki, zawiyaları uzak batıdan Hindistan'a, Wadai'den İstanbul'a kadar yayıldı; bunların çoğu Sahra ve Kuzey Afrika'daydı. Her zawiya'da, işlerini yöneten, halkın çocuklarını eğiten, hayvan satın alan ve tarımla uğraşan bir halife vardı. Öğrencileri ona yardım etti ve fazlalığı şeyha gönderdi. Böylece tarikatın lideri, vergilendirilen bir kral gibi oldu. Sultan Abdulhamid, eylemlerinin sonuçlarından korktu, bu yüzden şeyh bunu fark etti ve 1312 Hicri'de Kufra vahasına gitti, ardından Wadi'ye taşındı ve orada öldü {cite:al-al-alam tarjama}."
  id: "Muhammad bin Muhammad bin Ali al-Sanusi, Mahdi (1843–sekitar 1902 M), pemimpin kedua Sanusiyya, menggantikan ayahnya setelah kematiannya dan menjadi terkenal karena kebenarannya. Selama masa itu, tatanan ini tumbuh begitu kuat sehingga zawiya-zawiya menyebar dari barat jauh ke India, dari Wadai hingga Istanbul, sebagian besar berada di Sahara dan Afrika Utara. Di setiap zawiya, ada seorang khalifah yang mengelola urusannya, mendidik anak-anak rakyat, membeli ternak, dan bertani. Para murid membantunya, dan sisa apa pun ia kirimkan kepada sheikh. Dengan demikian, pemimpin ordo menjadi seperti raja yang dikenakan pajak. Sultan Abdul Hamid takut akan konsekuensi dari tindakannya, sehingga sheikh menyadari hal ini, sehingga ia pergi pada tahun 1312 H ke oasis Kufra, lalu pindah ke Wadi, di mana ia meninggal {cite:al-aalam tarjama}."
