summary:
  ar: "محمد بن محمد بن علي السنوسي، المهدي (١٨٤٣–نحو ١٩٠٢م)؛ زعيم السنوسية الثاني، خلف أباه بعد موته واشتهر بالصلاح، وقويت الطريقة في أيامه حتى انتشرت زواياها من المغرب الأقصى إلى الهند ومن وداي إلى الآستانة وأكثرها في الصحراء الكبرى وشمال أفريقية، وكان في كل زاوية خليفة يدير شؤونها ويعلم أولاد الناس ويقتني الماشية ويشتغل بالزراعة، يساعده المريدون وينفق على الزاوية وما يفيض عنه يرسله إلى الشيخ، فأصبح صاحب الطريقة أشبه بملك يُجبى إليه الخراج. وخاف السلطان عبد الحميد مغبة أمره فشعر الشيخ بذلك فرحل سنة ١٣١٢هـ إلى واحة الكفرة وانتقل منها إلى وداي فتوفي فيها {cite:al-aalam tarjama}."
  en: "Muhammad al-Mahdi al-Sanusi (1843–c. 1902 CE) — second leader of the Sanusiyya, under whom its zawiyas stretched from Morocco to India, each a self-supporting khalifa-run community {cite:al-aalam tarjama}."
