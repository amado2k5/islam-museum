summary:
  ar: "سعد الدين علي بن محمد بن عراق الفقيه المقرئ الشامي الحجازي الشافعي؛ ولد كما ذكره والده في السفينة العراقية سنة سبع وتسعمائة بساحل بيروت، وحفظ القرآن وهو ابن خمس سنين في سنتين، ولازم والده في قراءة ختمة كل جمعة ست سنين فعادت بركة الله عليه وحفظ كتباً عديدة في فنون شتى، وأخذ القراءات عن تلميذ أبيه الشيخ أحمد بن عبد الوهاب خطيب قرية مجدل مغوش، وكان ذا قدم راسخة في الفقه والحديث والقراءات ومشاركة جيدة في غيرها وله اشتغال في الفرائض والحساب والميقات وقوة في نظم الأشعار الفائقة، وكان ذا سكينة ووقار لكنه أصم صماً فاحشاً، وولي خطابة المسجد النيري، ودخل دمشق وحلب في رحلته إلى الروم؛ قال ابن طولون وذكر لي أنه عمل شرحاً على صحيح مسلم على تصنيع القسطلاني على صحيح البخاري وشرع في شرح على العباب في فقه الشافعية، وسافر من دمشق في عوده من الروم لزيارة بيت المقدس يوم الخميس ثالث جمادى الآخرة سنة تسع وأربعين، وذكر أنه في مدة إقامته بدمشق كان يزور قبر ابن العربي ويبيت عنده، وأنه أشهر شرب القهوة بدمشق فكثرت من يومئذ حوانيتها — ومن العجيب أن والده كان ينكرها وخرب بيتها بمكة — وتوفي بالمدينة المنورة وهو خطيبها وإمامها {cite:shadharat-dhahab p. 337-338}."
  en: "Sa'd al-Din b. 'Iraq — b. 907 on Beirut's coast aboard the 'Iraqi ship; Qur'an memorized at five in two years, a khatma every Friday for six; a deaf man of the deepest learning, khatib of Medina — and the man who made coffee famous at Damascus, whence its shops multiplied — his own father had denounced it and destroyed its house in Mecca {cite:shadharat-dhahab p. 337-338}."
  es: "Sa'd al-Din b. 'Iraq — n. 907 en la costa de Beirut a bordo del barco 'Iraqi; memorizado del Corán a los cinco años en dos años, un khatma cada viernes durante seis; un hombre sordo de profundo conocimiento, khatib de Medina — y el hombre que hizo famoso el café en Damasco, de donde se multiplicaron sus tiendas — su propio padre lo había denunciado y destruido su casa en La Meca {cite:shadharat-dhahab p. 337-338}."
  fr: "Sa'd al-Din b. 'Iraq — né en 907 sur la côte de Beyrouth à bord du navire 'Iraqi; mémorisation du Coran à cinq ans en deux ans, une khatma chaque vendredi pendant six ans; un homme sourd d'une érudition profonde, khatib de Médine — et l'homme qui a rendu le café célèbre à Damas, d'où ses boutiques se sont multipliées — son propre père l'avait dénoncé et avait détruit sa maison à La Mecque {cite:shadharat-dhahab p. 337-338}."
  ur: "سعد الدین بی۔ 'عراق - بی. بیروت کے ساحل پر 'عراقی جہاز' پر سوار 907؛ دو سال میں پانچ بجے قرآن حفظ کیا، ہر جمعہ کو چھ کے لیے ایک خاتمہ۔ گہرے علم کا ایک بہرا آدمی، مدینہ کا خطیب - اور وہ شخص جس نے دمشق میں کافی کو مشہور کیا، جہاں سے اس کی دکانیں بڑھ گئیں - اس کے اپنے والد نے اس کی مذمت کی تھی اور مکہ میں اس کے گھر کو تباہ کر دیا تھا۔ 337-338}۔"
  tr: "Saad al-Din Ali ibn Muhammad ibn Iraq, Levant Hicazi al-Shafi'i'den hukukçu, şifacı ve şivaberci; babasının da belirttiği gibi, 907 Hicri yılında Beyrut açıklarında Irak gemisinde doğdu. Kur'an'ı beş yaşında iki yıl içinde ezberledi ve altı yıl boyunca her Cuma günü babasının izinden giderek okumayı tamamladı; bu da ona bereket getirdi. Çeşitli alanlarda birçok kitap ezberledi ve babasının öğrencisi Majdal Maghoush köyünün vaizi Şeyh Ahmed bin Abdul Wahhab'dan okuma çalışmaları yaptı. Fıkıh, hadis ve Kur'an okumalarında sağlam bir temeli vardı ve iyi bir katılım gösterdi Diğer alanlarda miras hukuku, aritmetik ve mikat ile ilgilendi ve olağanüstü şiirler yazmada ustaydı. Sakin ve saygındı ama son derece sağır ve sağırdı. El-Nayri Camii'nin vaizi olarak atandı ve Romalılara doğru yolculuğunda Şam ve Halep'e girdi. İbn Tulun bana, Sahih Al-Kastallani ve Sahih al-Buhari üzerine Sahih Muslim üzerine bir tefsir yazdığını ve Şafii fıkhatında el-Abbab üzerine yorum yapmaya başladığını söyledi. Kırk dokuzuncu yılın üçüncü Cumadeliu'l-Ahhirah'ı Perşembe günü Romalılardan dönerken Şam'dan Kudüs'ü ziyaret etmek üzere yola çıktı. Şam'da kaldığı süre boyunca İbn el-Arabi'nin mezarını ziyaret ettiğini ve orada gecelediğini, Şam'da kahve içmesiyle ünlü olduğunu, bu yüzden o günden itibaren dükkanların arttığını — garip bir şekilde babasının bunu reddettiğini ve Mekke'deki evini yıktığını — ve kendisinin Medine'de vaiz ve imamı iken öldüğünü belirtmiştir {atıf:shadharat-dhahab, s. 337-338}."
  id: "Saad al-Din Ali ibn Muhammad ibn Iraq, seorang ahli hukum, pembaca, dan pembaca dari Hijazi al-Shafi'i Levant; ia lahir, seperti yang disebutkan ayahnya, di kapal Irak pada tahun 907 AH di lepas pantai Beirut. Ia menghafal Al-Qur'an pada usia lima tahun dalam dua tahun, dan mengikuti ayahnya dalam membaca penyelesaian bacaan setiap Jumat selama enam tahun, yang membawa berkah kepadanya. Ia menghafal banyak buku di berbagai bidang, dan belajar pembacaan di bawah murid ayahnya, Sheikh Ahmad ibn Abdul Wahhab, pengkhotbah di desa Majdal Maghoush. Ia memiliki dasar yang kuat dalam fiqh, hadis, dan pembacaan Al-Qur'an, dengan partisipasi yang baik Di bidang lain, ia terlibat dalam hukum warisan, aritmatika, dan miqat, serta mahir menulis puisi luar biasa. Ia terbiasa dan bermartabat tetapi sangat tuli dan tuli. Ia diangkat sebagai pengkhotbah Masjid Al-Nayri, dan memasuki Damaskus dan Aleppo dalam perjalanannya ke Romawi. Ibn Tulun mengatakan kepada saya bahwa ia menulis komentar tentang Sahih Muslim tentang Sahih al-Qastallani dan Sahih al-Bukhari, dan mulai mengomentari al-'Abbab dalam yurisprudensi Shafi'i. Ia melakukan perjalanan dari Damaskus saat kembali dari Romawi untuk mengunjungi Yerusalem pada hari Kamis, tanggal tiga Jumada al-Akhirah tahun empat puluh sembilan, Ia menyebutkan bahwa selama tinggal di Damaskus, ia biasa mengunjungi makam Ibn al-Arabi dan menginap di sana, dan ia menjadi terkenal karena minum kopi di Damaskus, sehingga sejak hari itu toko-tokonya semakin banyak — anehnya, ayahnya menyangkal dan menghancurkan rumahnya di Mekah — dan ia meninggal di Madinah saat ia menjadi pengkhotbah dan imam di sana {cite:shadharat-dhahab, hlm. 337-338}."
