summary:
  ar: "سعد الدين علي بن محمد بن عراق الفقيه المقرئ الشامي الحجازي الشافعي؛ ولد كما ذكره والده في السفينة العراقية سنة سبع وتسعمائة بساحل بيروت، وحفظ القرآن وهو ابن خمس سنين في سنتين، ولازم والده في قراءة ختمة كل جمعة ست سنين فعادت بركة الله عليه وحفظ كتباً عديدة في فنون شتى، وأخذ القراءات عن تلميذ أبيه الشيخ أحمد بن عبد الوهاب خطيب قرية مجدل مغوش، وكان ذا قدم راسخة في الفقه والحديث والقراءات ومشاركة جيدة في غيرها وله اشتغال في الفرائض والحساب والميقات وقوة في نظم الأشعار الفائقة، وكان ذا سكينة ووقار لكنه أصم صماً فاحشاً، وولي خطابة المسجد النيري، ودخل دمشق وحلب في رحلته إلى الروم؛ قال ابن طولون وذكر لي أنه عمل شرحاً على صحيح مسلم على تصنيع القسطلاني على صحيح البخاري وشرع في شرح على العباب في فقه الشافعية، وسافر من دمشق في عوده من الروم لزيارة بيت المقدس يوم الخميس ثالث جمادى الآخرة سنة تسع وأربعين، وذكر أنه في مدة إقامته بدمشق كان يزور قبر ابن العربي ويبيت عنده، وأنه أشهر شرب القهوة بدمشق فكثرت من يومئذ حوانيتها — ومن العجيب أن والده كان ينكرها وخرب بيتها بمكة — وتوفي بالمدينة المنورة وهو خطيبها وإمامها {cite:shadharat-dhahab p. 337-338}."
  en: "Sa'd al-Din b. 'Iraq — b. 907 on Beirut's coast aboard the 'Iraqi ship; Qur'an memorized at five in two years, a khatma every Friday for six; a deaf man of the deepest learning, khatib of Medina — and the man who made coffee famous at Damascus, whence its shops multiplied — his own father had denounced it and destroyed its house in Mecca {cite:shadharat-dhahab p. 337-338}."
