  fr: "Ibn Misk al-Sakhawi"
  ur: "ابن مسک الصخاوی۔"
roles: [scholar]
gender: male
summary:
  ar: "عبد الرحمن بن أحمد بن عبد الرحمن، زين الدين ابن مسك السخاوي، أديب شافعي مصري، من كتبه اللمعة المسكية في شرح المقصورة الدريدية ومثلث ابن مسك، توفي سنة 1123 هـ الموافقة 1711 م."
  en: "Abd al-Rahman ibn Ahmad ibn Abd al-Rahman, Zayn al-Din Ibn Misk al-Sakhawi, an Egyptian Shafi'i man of letters whose books include al-Lum'a al-Miskiyya, a commentary on al-Maqsura al-Duraydiyya, and Muthallath Ibn Misk; died 1123 AH (1711)."
  es: "Abd al-Rahman ibn Ahmad ibn Abd al-Rahman, Zayn al-Din Ibn Misk al-Sakhawi, un hombre de letras egipcio Shafi'i cuyos libros incluyen al-Lum'a al-Miskiyya, un comentario sobre al-Maqsura al-Duraydiyya, y Muthallath Ibn Misk; murió en 1123 d. H. (1711)."
  fr: "Abd al-Rahman ibn Ahmad ibn Abd al-Rahman, Zayn al-Din Ibn Misk al-Sakhawi, un homme de lettres égyptien Shafi'i dont les livres incluent al-Lum'a al-Miskiyya, un commentaire sur al-Maqsura al-Duraydiyya et Muthallath Ibn Misk; décédé en 1123 AH (1711)."
  ur: "عبدالرحمٰن بن احمد بن عبدالرحمن، زین الدین ابن مسک الصخاوی، ایک مصری شافعی خطوط کا آدمی جس کی کتابوں میں المعروف المسکیہ، المقصورۃ الدریدیہ کی تفسیر، اور مطلع ابن مسک؛ وفات 1123ھ (1711)۔"
  tr: "Abd al-Rahman ibn Ahmed ibn Abd al-Rahman, Zain al-Din Ibn Misk al-Sakhavi, Mısırlı bir Şafii edebi figürdü. Kitapları arasında al-Lum'ah al-Miskiyah fi Sharh al-Maqsura al-Duraydiyya ve İbn Musk'ın üçgeni yer alır. 1123 Hicri'de, yani 1711 yılında öldü."
  id: "Abd al-Rahman ibn Ahmad ibn Abd al-Rahman, Zain al-Din Ibn Misk al-Sakhawi, adalah tokoh sastra Shafi'i Mesir. Di antara bukunya adalah al-Lum'ah al-Miskiyah fi Sharh al-Maqsura al-Duraydiyya dan segitiga Ibn Musk. Ia meninggal pada tahun 1123 H, yang setara dengan tahun 1711 M."
