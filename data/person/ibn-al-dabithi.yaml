summary:
  ar: "الحافظ المؤرخ المقريء، نسبة إلى دبيثا قرية بواسط؛ سمع من أبي طالب الكناني وابن شاتيل وعبد المنعم بن الفراوي وطبقتهم، وتفقه على أبي الحسن بن البوقي وأتقن العربية وتقدم وساد، وعلق الأصول والخلاف وعُني بالحديث ورجاله، وصنّف كتاباً في تاريخ واسط وذيلاً على ذيل ابن السمعاني وأسمعهما؛ قال الحافظ ضياء الدين المقدسي «هو شيخي وهو آخر الحفاظ المكثرين، ما رأت عيناي مثله في حفظ التواريخ والسير وأيام الناس»، وأضرّ في آخر عمره {cite:shadharat-dhahab p. 185-186}."
  en: "Ibn al-Dabithi (b. 558, d. 8 Rabi' II 637, Baghdad) — Wasit's historian: a Tarikh Wasit and a continuation to Ibn al-Sam'ani's Dhayl; al-Diya' al-Maqdisi called him 'my shaykh, the last of the great memorizers of histories' {cite:shadharat-dhahab p. 185-186}."
  es: "Ibn al-Dabithi (n. 558, m. 8 Rabi' II 637, Bagdad) - historiador de Wasit: un Tarikh Wasit y continuación del Dhayl de Ibn al-Sam'ani; al-Diya' al-Maqdisi lo llamó 'mi shaykh, el último de los grandes memorizadores de historias' {cita: shadharat-dhahab p. 185-186}."
  fr: "Ibn al-Dabithi (né en 558, décédé le 8 Rabi' II 637, Bagdad) — L'historien de Wasit: un Tarikh Wasit et une continuation du Dhayl d'Ibn al-Sam'ani; al-Diya' al-Maqdisi l'appelait 'mon shaykh, le dernier des grands mémorisateurs d'histoires' {cite: shadharat-dhahab p. 185-186}."
  ur: "ابن الدبیثی ⁦(پیدائش 558، وفات: 8 ربیع الثانی 637، بغداد)⁩ - واسط کا مؤرخ: تاریخ وصیت اور ابن سمعانی کی ڈھیل کا تسلسل؛ الدیاء المقدسی نے انہیں 'میرا شیخ، تاریخ کے عظیم حافظوں میں سے آخری' کہا۔ 185-186}۔"
  tr: "Ezberci, tarihçi ve şifaetçi, Wasit'teki Dabitha köyüne atfedildi; Ebu Talib el-Kinani, İbn Şatil ve Abdülmünim ibn el-Farawi'den ve onların sınıflarından dinledi. Ebu el-Hasan bin el-Buqi'nin yanında fıkıh okudu, Arapça'yı ustalıkla öğrendi, temelleri geliştirdi ve kurdu, prensipler ve anlaşmazlıklar üzerine yorumlar yaptı, hadis ve rivayetçilerine dikkat etti. Wasit tarihi üzerine bir kitap ve İbn al-Sam'ani'nin ekine ek yazdı, her ikisini de dinledi. El-Hafiz Diya el-Din el-Makdisi, \"O benim şeyhimdir ve sayısız ezberleyicinin sonuncusudur. Gözlerim, tarihleri, biyografileri ve halkın günlerini ezberlerken onun gibi bir şey görmedim.\" Hayatının ilerleyen dönemlerinde zarar gördü {atıf: şadharat-dhahab, s. 185-186}."
  id: "Pengapal, sejarawan, dan pembaca yang mengaitkan dengan Dabitha, sebuah desa di Wasit; ia mendengar dari Abu Talib al-Kinani, Ibn Shatil, dan Abd al-Mun'im ibn al-Farawi beserta kelas-kelas mereka. Ia mempelajari hukum di bawah Abu al-Hasan ibn al-Buqi, menguasai bahasa Arab, mengembangkan dan membangun fondasi, mengomentari prinsip dan perselisihan, serta memperhatikan hadits dan para naratornya. Ia menulis sebuah buku tentang sejarah Wasit dan suplemen untuk Ibn al-Sam'ani dan mendengar keduanya. Al-Hafiz Diya al-Din al-Maqdisi berkata, \"Dia adalah sheikhi saya dan yang terakhir dari banyak pengapal. Mataku belum pernah melihat sesuatu seperti dia dalam menghafal sejarah, biografi, dan hari-hari rakyat.\" Dia dirugikan di akhir hidupnya {cite:shadharat-dhahab, hlm. 185-186}."
