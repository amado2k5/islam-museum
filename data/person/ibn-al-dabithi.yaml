summary:
  ar: "الحافظ المؤرخ المقريء، نسبة إلى دبيثا قرية بواسط؛ سمع من أبي طالب الكناني وابن شاتيل وعبد المنعم بن الفراوي وطبقتهم، وتفقه على أبي الحسن بن البوقي وأتقن العربية وتقدم وساد، وعلق الأصول والخلاف وعُني بالحديث ورجاله، وصنّف كتاباً في تاريخ واسط وذيلاً على ذيل ابن السمعاني وأسمعهما؛ قال الحافظ ضياء الدين المقدسي «هو شيخي وهو آخر الحفاظ المكثرين، ما رأت عيناي مثله في حفظ التواريخ والسير وأيام الناس»، وأضرّ في آخر عمره {cite:shadharat-dhahab p. 185-186}."
  en: "Ibn al-Dabithi (b. 558, d. 8 Rabi' II 637, Baghdad) — Wasit's historian: a Tarikh Wasit and a continuation to Ibn al-Sam'ani's Dhayl; al-Diya' al-Maqdisi called him 'my shaykh, the last of the great memorizers of histories' {cite:shadharat-dhahab p. 185-186}."
