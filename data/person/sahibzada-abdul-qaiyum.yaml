summary:
  ar: "مربٍّ وسياسي پشتوني (1863–1937) من طوبي في صوابي. بدأ موظفا في إدارة الهند البريطانية فصار وكيلا سياسيا في خيبر وچترال، وساعد دوراند في مفاوضات خط دوراند سنة 1893، وأسّس الكلية الإسلامية في بيشاور على نهج السيد أحمد خان، وصار سنة 1937 أول رئيس وزراء لإقليم الحدود الشمالية الغربية، وتوفي بعد أشهر من إسقاط حكومته."
  en: "Pashtun educationist and politician (1863–1937) of Topi in Swabi. He rose through the British Indian administration to political agent in Khyber and Chitral, assisted Mortimer Durand in the Durand Line negotiations of 1893, founded Islamia College, Peshawar, on Sir Syed Ahmad Khan's model of educating Muslims, and in 1937 became the first Chief Minister of the North-West Frontier Province, dying months after his ministry fell."
  ur: "طوبی (صوابی) کے پشتون ماہرِ تعلیم اور سیاست دان (1863ء–1937ء)۔ وہ برطانوی ہند کی انتظامیہ میں ترقی کر کے خیبر اور چترال کے پولیٹیکل ایجنٹ بنے، 1893ء میں ڈیورنڈ لائن کے مذاکرات میں مورٹیمر ڈیورنڈ کے معاون رہے، سر سید احمد خان کے نمونے پر پشاور میں اسلامیہ کالج قائم کیا، اور 1937ء میں شمال مغربی سرحدی صوبے کے پہلے وزیرِ اعلیٰ بنے؛ اپنی وزارت کے خاتمے کے چند ماہ بعد وفات پائی۔"
