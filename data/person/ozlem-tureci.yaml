summary:
  ar: "طبيبة مناعة ألمانية من أصل تركي، وُلدت في زيغن سنة 1967 لأبوين مهاجرين تركيين، وشاركت زوجها أوغور شاهين وكريستوف هوبر في تأسيس شركتي غانيميد (2001) وبيوأنتك (2008)، وقادت بوصفها الرئيسة الطبية لبيوأنتك التطوير السريري للقاح BNT162b2، أول لقاح بتقنية الحمض النووي الريبي المرسال يُعتمد للاستعمال البشري، وهي أستاذة العلاج المناعي الشخصي في معهد هاي-ترون وجامعة ماينز منذ 2021."
  en: "Turkish-German physician and immunologist, born in Siegen in 1967 to Turkish immigrant parents, who co-founded Ganymed Pharmaceuticals (2001) and BioNTech (2008) with her husband Uğur Şahin and Christoph Huber, led the clinical development of BNT162b2 — the first mRNA vaccine approved for human use — as BioNTech's chief medical officer, and has been Professor of Personalized Immunotherapy at HI-TRON and Johannes Gutenberg University Mainz since 2021."
  ur: "ترک نژاد جرمن ماہرِ امیونولوجی، جو 1967 میں زیگن میں ترک مہاجر والدین کے گھر پیدا ہوئیں، جنہوں نے اپنے شوہر اوغور شاہین اور کرسٹوف ہوبر کے ساتھ گینی میڈ (2001) اور بائیو این ٹیک (2008) قائم کیں، بائیو این ٹیک کی چیف میڈیکل آفیسر کی حیثیت سے BNT162b2 کی کلینیکل تیاری کی قیادت کی، جو انسانی استعمال کے لیے منظور ہونے والی پہلی ایم آر این اے ویکسین بنی، اور 2021 سے ہائی-ٹرون اور یونیورسٹی آف مائنز میں پرسنلائزڈ امیونوتھراپی کی پروفیسر ہیں۔"
  es: "Médica e inmunóloga turco-alemana, nacida en Siegen en 1967 de padres inmigrantes turcos, cofundó Ganymed Pharmaceuticals (2001) y BioNTech (2008) con su esposo Uğur Şahin y Christoph Huber, dirigió el desarrollo clínico de BNT162b2 —la primera vacuna de ARNm aprobada para uso humano— como directora médica de BioNTech, y es profesora de Inmunoterapia Personalizada en HI-TRON y la Universidad Johannes Gutenberg de Maguncia desde 2021."
  fr: "Médecin et immunologiste turco-allemande, née à Siegen en 1967 de parents immigrants turcs, qui a cofondé Ganymed Pharmaceuticals (2001) et BioNTech (2008) avec son mari Uğur Şahin et Christoph Huber, a dirigé le développement clinique du BNT162b2 — le premier vaccin à ARNm approuvé pour l'usage humain — en tant que directrice médicale de BioNTech, et est professeure d'immunothérapie personnalisée à HI-TRON et à l'Université Johannes Gutenberg de Mayence depuis 2021."
  tr: "Türk kökenli Alman immünolog olan Swen, 1967'de Siegen'de Türk göçmen ebeveynlerin çocuğu olarak doğmuş, eşi Uğur Şahin ve Christoph Huber ile birlikte Ganymede'i (2001) ve BioNTech'i (2008) kurmuş, BioNTech'in Baş Tıbbi Sorumlusu olarak BNT162b2 aşısının klinik geliştirilmesine liderlik etmiştir; bu aşı insan kullanımı için onaylanan ilk mRNA aşısıdır. 2021'den beri Hi-Tron Enstitüsü ve Mainz Üniversitesi'nde kişisel immünoterapi profesörü olarak görev yapmaktadır."
  id: "Seorang imunolog Jerman keturunan Turki, lahir di Siegen pada tahun 1967 dari orang tua imigran Turki, ia ikut mendirikan Ganymede (2001) dan BioNTech (2008) bersama suaminya Ugur Şahin dan Christoph Huber, dan sebagai Chief Medical Officer BioNTech, ia memimpin pengembangan klinis vaksin BNT162b2, vaksin mRNA pertama yang disetujui untuk penggunaan manusia. Sejak 2021, ia telah menjadi profesor imunoterapi pribadi di Hi-Tron Institute dan University of Mainz."
