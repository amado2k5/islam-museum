summary:
  ar: "طبيبة مناعة ألمانية من أصل تركي، وُلدت في زيغن سنة 1967 لأبوين مهاجرين تركيين، وشاركت زوجها أوغور شاهين وكريستوف هوبر في تأسيس شركتي غانيميد (2001) وبيوأنتك (2008)، وقادت بوصفها الرئيسة الطبية لبيوأنتك التطوير السريري للقاح BNT162b2، أول لقاح بتقنية الحمض النووي الريبي المرسال يُعتمد للاستعمال البشري، وهي أستاذة العلاج المناعي الشخصي في معهد هاي-ترون وجامعة ماينز منذ 2021."
  en: "Turkish-German physician and immunologist, born in Siegen in 1967 to Turkish immigrant parents, who co-founded Ganymed Pharmaceuticals (2001) and BioNTech (2008) with her husband Uğur Şahin and Christoph Huber, led the clinical development of BNT162b2 — the first mRNA vaccine approved for human use — as BioNTech's chief medical officer, and has been Professor of Personalized Immunotherapy at HI-TRON and Johannes Gutenberg University Mainz since 2021."
  ur: "ترک نژاد جرمن ماہرِ امیونولوجی، جو 1967 میں زیگن میں ترک مہاجر والدین کے گھر پیدا ہوئیں، جنہوں نے اپنے شوہر اوغور شاہین اور کرسٹوف ہوبر کے ساتھ گینی میڈ (2001) اور بائیو این ٹیک (2008) قائم کیں، بائیو این ٹیک کی چیف میڈیکل آفیسر کی حیثیت سے BNT162b2 کی کلینیکل تیاری کی قیادت کی، جو انسانی استعمال کے لیے منظور ہونے والی پہلی ایم آر این اے ویکسین بنی، اور 2021 سے ہائی-ٹرون اور یونیورسٹی آف مائنز میں پرسنلائزڈ امیونوتھراپی کی پروفیسر ہیں۔"
