label: { ar: "هرثمة بن عرفجة البارقي", en: "Harthama ibn Arfaja al-Bariqi" }
summary:
  ar: "هرثمة بن عرفجة البارقي وعند ابن دريد عرفجة بن هرثمة؛ أول من اختط الموصل وأسكنها العرب ومصّرها ولاها عمر بعد عزل عتبة بن فرقد وكان بها الحصن وبيع النصارى ومنازل قليلة ومحلة اليهود فأنزل العرب منازلهم واختط لهم وبنى المسجد الجامع وقيل نزل الحديثة أولاً فمصّرها واختطها قبل الموصل."
  en: "Harthama ibn Arfaja al-Bariqi — Ibn Durayd reverses the nasab; first to lay out Mosul's plots, settle Arabs and make it a misr, appointed by Umar after Utba's dismissal; he found a fort, Christian churches, few houses and the Jewish quarter, housed the Arabs on their allotments and built the congregational mosque — some say he first misr-ed and plotted al-Haditha before Mosul."
