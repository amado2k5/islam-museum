label: { ar: "هرثمة بن عرفجة البارقي", en: "Harthama ibn Arfaja al-Bariqi", es: "Harthama ibn Arfaja al-Bariqi", fr: "Harthama ibn Arfaja al-Bariqi", ur: "حارثمہ بن عرفجہ الباریقی" }
summary:
  ar: "هرثمة بن عرفجة البارقي وعند ابن دريد عرفجة بن هرثمة؛ أول من اختط الموصل وأسكنها العرب ومصّرها ولاها عمر بعد عزل عتبة بن فرقد وكان بها الحصن وبيع النصارى ومنازل قليلة ومحلة اليهود فأنزل العرب منازلهم واختط لهم وبنى المسجد الجامع وقيل نزل الحديثة أولاً فمصّرها واختطها قبل الموصل."
  en: "Harthama ibn Arfaja al-Bariqi — Ibn Durayd reverses the nasab; first to lay out Mosul's plots, settle Arabs and make it a misr, appointed by Umar after Utba's dismissal; he found a fort, Christian churches, few houses and the Jewish quarter, housed the Arabs on their allotments and built the congregational mosque — some say he first misr-ed and plotted al-Haditha before Mosul."
  es: "Harthama ibn Arfaja al-Bariqi — Ibn Durayd invierte el nasab; primero trazó los terrenos de Mosul, asentó a los árabes y lo convirtió en un misr, nombrado por Umar después del despido de Utba; encontró un fuerte, iglesias cristianas, algunas casas y el barrio judío, alojó a los árabes en sus parcelas y construyó la mezquita congregacional; algunos dicen que primero estableció el misr y trazó al-Haditha antes que Mosul."
  fr: "Harthama ibn Arfaja al-Bariqi — Ibn Durayd inverse le nasab; premier à tracer les parcelles de Mossoul, à y installer des Arabes et à en faire un misr, nommé par Umar après le renvoi d'Utba; il a trouvé un fort, des églises chrétiennes, quelques maisons et le quartier juif, a logé les Arabes sur leurs parcelles et a construit la mosquée du vendredi — certains disent qu'il a d'abord misr et tracé al-Haditha avant Mossoul."
  ur: "حارثمہ ابن عرفجہ الباریقی - ابن دورید نے نصاب کو الٹ دیا؛ سب سے پہلے موصل کے پلاٹوں کو ترتیب دینا، عربوں کو آباد کرنا اور اسے ایک مسر بنانا، جسے عمر نے عتبہ کی برطرفی کے بعد مقرر کیا تھا۔ اس نے ایک قلعہ، عیسائی گرجا گھر، چند مکانات اور یہودی کوارٹر تلاش کیے، عربوں کو ان کی الاٹمنٹ پر رکھا اور اجتماعی مسجد بنائی - کچھ کہتے ہیں کہ اس نے سب سے پہلے مسرور کیا اور موصل سے پہلے الحدیدہ کی منصوبہ بندی کی۔"
