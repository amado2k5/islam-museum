label: { ar: "عبد الله بن بحينة", en: "Abdallah ibn Bahina" }
summary:
  ar: "عبد الله بن مالك بن القشب بن جندب، أبو محمد، صحابي معروف بابن بحينة. روى عن النبي وعنه الأعرج وعطاء بن يسار وغيرهم. وهو من الصحابة الذين نقل الفقهاء عنهم حديث الإحرام بالحجامة. ويذكر الكتاب ترجمته دون تاريخ وفاة مؤكد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7144}"
  en: "Abdallah ibn Malik ibn al-Qashib ibn Jundab, Abu Muhammad, a Companion known as Ibn Bahina. He related from the Prophet, and al-A'raj and Ata' ibn Yasar related from him. The jurists cite him in the rules of ihram on cupping. The entry gives no firm date of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7144}"
