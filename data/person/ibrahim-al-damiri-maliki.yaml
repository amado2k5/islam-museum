summary:
  ar: "قاضي القضاة برهان الدين إبراهيم الدميري المالكي؛ تحصّل بحده وولي قضاء قضاة المالكية بالقاهرة وجاور الشيخ أحمد بن المرغي في الزعفران، ومات — كما ذكر الكواكب — لما كان في وعظة ليلة الاثنين للسلطان الغوري في رمضان غصب إبراهيم الدميري على الوعظ أمامه، مات يوم الأربعاء ثالث عشر رمضان سنة ثلاث عشرة وتسعمائة وصلى عليه الغوري {cite:shadharat-dhahab p. 466}."
  en: "Cairo's Maliki chief qadi — he had preached forcibly before Sultan al-Ghuri one Monday night in Ramadan, then died Wednesday 13 Ramadan 913; al-Ghuri led his funeral prayer {cite:shadharat-dhahab p. 466}."
  es: "El cadí principal malikí de El Cairo predicó a la fuerza ante el sultán al-Ghuri una noche de lunes de Ramadán, y murió el miércoles 13 de Ramadán de 913; al-Ghuri dirigió su oración fúnebre {cita: shadharat-dhahab pág. 466}."
  fr: "Le cadi en chef malikite du Caire — il avait prêché avec force devant le sultan al-Ghuri un lundi soir du Ramadan, puis est décédé le mercredi 13 Ramadan 913; al-Ghuri a dirigé sa prière funéraire {cite:shadharat-dhahab p. 466}."
  ur: "قاہرہ کے مالکی چیف قادی - اس نے رمضان المبارک میں ایک پیر کی رات سلطان الثوری کے سامنے زبردستی تبلیغ کی تھی، پھر بدھ 13 رمضان 913 کو انتقال کر گئے۔ الثوری نے ان کی نماز جنازہ پڑھائی۔ 466}۔"
  tr: "Baş Yargıç Burhan al-Din İbrahim el-Damiri el-Maliki; kendi cezasını aldı ve Kahire'de Maliki yargıçlarının hakimi olarak atandı; el-Za'faran'da Şeyh Ahmed ibn el-Marghi ile birlikte yaşadı. El-Kavikib'in de belirttiği gibi, Ramazan ayında Sultan el-Guri'nin Pazartesi gecesi vaazında İbrahim el-Damiri onu önünde vaaz vermeye zorladığında öldü. Ramazan'ın on üçüncü Çarşamba günü dokuz yüz on üçüncü yılda vefat etti ve el-Guri onun üzerine cenaze namazını yaptı {alıntı:shadharat-dhahab, s. 466}."
  id: "Hakim Agung Burhan al-Din Ibrahim al-Damiri al-Maliki; ia memperoleh hukuman sendiri dan diangkat sebagai hakim hakim Maliki di Kairo, tinggal bersama Sheikh Ahmad ibn al-Marghi di al-Za'faran. Ia meninggal — seperti yang disebutkan oleh Al-Kawakib — ketika, selama khotbah Senin malam Sultan al-Ghuri di Ramadan, Ibrahim al-Damiri memaksanya untuk berkhotbah di hadapannya. Ia meninggal pada hari Rabu, tanggal tiga belas Ramadan, tahun sembilan ratus tiga belas, dan al-Ghuri memimpin doa pemakaman untuknya {cite:shadharat-dhahab, hlm. 466}."
