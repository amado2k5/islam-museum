summary:
  ar: "قاضي القضاة برهان الدين إبراهيم الدميري المالكي؛ تحصّل بحده وولي قضاء قضاة المالكية بالقاهرة وجاور الشيخ أحمد بن المرغي في الزعفران، ومات — كما ذكر الكواكب — لما كان في وعظة ليلة الاثنين للسلطان الغوري في رمضان غصب إبراهيم الدميري على الوعظ أمامه، مات يوم الأربعاء ثالث عشر رمضان سنة ثلاث عشرة وتسعمائة وصلى عليه الغوري {cite:shadharat-dhahab p. 466}."
