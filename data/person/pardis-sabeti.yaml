summary:
  ar: "برديس كريستين ثابتي (وُلدت 25 ديسمبر 1975) عالمة أحياء حاسوبية ووراثة طبية وتطورية إيرانية-أمريكية، أستاذة في جامعة هارفارد ومعهد برود. طوّرت اختبارات إحصائية لكشف مناطق الجينوم الخاضعة للانتقاء الطبيعي، وقادت أعمال التسلسل الجيني في تفشّي إيبولا وحمى لاسا في غرب أفريقيا، واختيرت ضمن شخصيات العام لمجلة تايم سنة 2014 وضمن قائمة تايم 100 سنة 2015، وانتُخبت عضوة في الأكاديمية الوطنية للعلوم سنة 2026."
  en: "Pardis Christine Sabeti (born 25 December 1975) is an Iranian-American computational biologist, medical geneticist and evolutionary geneticist, a professor at Harvard University and a core institute member at the Broad Institute. She developed statistical tests that detect regions of the genome under natural selection, led genomic work on the West African Ebola and Lassa fever outbreaks, was one of Time's Persons of the Year in 2014 and a Time 100 honoree in 2015, and was elected to the National Academy of Sciences in 2026."
  ur: "پردیس کرسٹین سبیتی (پیدائش 25 دسمبر 1975ء) ایرانی نژاد امریکی کمپیوٹیشنل حیاتیات دان، طبی و ارتقائی جینیات کی ماہر، ہارورڈ یونیورسٹی اور براڈ انسٹی ٹیوٹ میں پروفیسر ہیں۔ انہوں نے قدرتی انتخاب کے تحت جینوم کے خطوں کی نشاندہی کرنے والے شماریاتی ٹیسٹ وضع کیے، مغربی افریقا میں ایبولا اور لاسا بخار کی وباؤں پر جینومی تحقیق کی قیادت کی، 2014ء میں ٹائم کی پرسنز آف دی ایئر اور 2015ء میں ٹائم 100 میں شامل ہوئیں، اور 2026ء میں نیشنل اکیڈمی آف سائنسز کی رکن منتخب ہوئیں۔"
