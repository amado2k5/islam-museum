summary:
  ar: "الطبيب البارع العشاب، صاحب كتاب المفردات في الأدوية؛ انتهت إليه معرفة النبات وصفاته ومنافعه وأماكنه، وله اتصال بخدمة الملك الكامل ثم ابنه الصالح، وكان رئيساً في الديار المصرية؛ توفي بدمشق في شعبان {cite:shadharat-dhahab p. 242}."
  en: "The Malagan physician-botanist (d. Sha'ban 646, Damascus) — author of the Mufradat materia medica; in him the knowledge of plants, their properties, benefits and habitats terminated; served al-Kamil then al-Salih and headed the profession in Egypt {cite:shadharat-dhahab p. 242}."
  es: "El médico-botánico malagueño (m. Sha'ban 646, Damasco) — autor de la materia médica Mufradat; en él culminó el conocimiento de las plantas, sus propiedades, beneficios y hábitats; sirvió a al-Kamil y luego a al-Salih y dirigió la profesión en Egipto {cite:shadharat-dhahab p. 242}."
  fr: "Le médecin-botaniste malaguène (mort en Sha'ban 646, Damas) — auteur de la Mufradat materia medica; en lui s'achève la connaissance des plantes, de leurs propriétés, de leurs bienfaits et de leurs habitats; servit al-Kamil puis al-Salih et dirigea la profession en Égypte {cite: shadharat-dhahab p. 242}."
  ur: "ملاگن ماہر نباتات ⁦(متوفی شعبان 646، دمشق)⁩ - مفرادات میٹیریا میڈیکا کے مصنف؛ اس میں پودوں، ان کی خصوصیات، فوائد اور رہائش گاہوں کا علم ختم ہو گیا۔ الکامل پھر الصالح کی خدمت کی اور مصر میں پیشے کی سربراہی کی۔ 242}۔"
  tr: "Yetenekli bitki uzmanı hekim, Al-Mufradat fi al-Adwiya kitabının yazarı; bitkiler, özellikleri, faydaları ve konumları hakkında bilgi edindi. Kral El-Kamil ve ardından oğlu El-Salih'in hizmetiyle bağlantılıydı. Mısır'da bir liderdi; Şa'ban'da Şam'da öldü {kaynak: shadharat-dhahab, s. 242}."
  id: "Dokter herbal yang terampil, penulis buku Al-Mufradat fi al-Adwiya; ia memperoleh pengetahuan tentang tumbuhan, sifatnya, manfaatnya, dan lokasinya. Ia terhubung dengan pelayanan Raja Al-Kamil dan kemudian putranya Al-Salih. Ia adalah pemimpin di Mesir; ia meninggal di Damaskus dalam Sha'ban {cite:shadharat-dhahab, hlm. 242}."
