summary:
  ar: "فيزيائي نظري باكستاني، وُلد في جهنك بالبنجاب سنة 1926 لأسرة تدين بالأحمدية، وشارك في جائزة نوبل في الفيزياء سنة 1979 عن نظرية توحيد القوتين الكهرومغناطيسية والضعيفة، فكان أول باكستاني ينال جائزة نوبل، وأسس المركز الدولي للفيزياء النظرية في ترييستي سنة 1964 وهيئة أبحاث الفضاء الباكستانية، وغادر بلاده احتجاجا سنة 1974 بعد أن أعلن برلمانها أعضاء الجماعة الأحمدية غير مسلمين، وتوفي في أكسفورد سنة 1996."
  en: "Pakistani theoretical physicist, born in Jhang, Punjab, in 1926 into a family professing Ahmadiyya. He shared the 1979 Nobel Prize in Physics for the theory unifying the electromagnetic and weak forces, the first Pakistani to win a Nobel Prize; founded the International Centre for Theoretical Physics in Trieste in 1964 and Pakistan's space agency SUPARCO; left his country in protest in 1974 after its parliament declared members of the Ahmadiyya community non-Muslim; and died in Oxford in 1996."
  ur: "پاکستانی نظریاتی طبیعیات دان، جو 1926 میں پنجاب کے جھنگ میں ایک احمدی خاندان میں پیدا ہوئے۔ انہوں نے برقی مقناطیسی اور کمزور قوتوں کے اتحاد کے نظریے پر 1979 میں طبیعیات کا نوبل انعام مشترکہ طور پر پایا اور نوبل پانے والے پہلے پاکستانی بنے؛ 1964 میں ٹریسٹے میں بین الاقوامی مرکز برائے نظریاتی طبیعیات اور پاکستان کا خلائی ادارہ سپارکو قائم کیا؛ 1974 میں پارلیمنٹ کے احمدی برادری کو غیر مسلم قرار دینے پر احتجاجاً وطن چھوڑا، اور 1996 میں آکسفورڈ میں وفات پائی۔"
