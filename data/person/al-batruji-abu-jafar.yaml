summary:
  ar: "أبو جعفر البطروجي أحمد بن عبد الرحمن الأندلسي أحد الأئمة؛ روى عن أبي عبد الله الطلاعي وأبي علي الغساني وطبقتهما وكان إماماً عاقلاً بصيراً بمذهب مالك ودقائقه إماماً في الحديث ومعرفة رجاله وعلله وله مصنفات مشهورة ولم يكن في وقته بالأندلس مثله لكنه كان قليل العربية رث الهيئة خاملاً؛ توفي في المحرم سنة اثنتين وأربعين وخمسمائة {cite:shadharat-dhahab p. 610-611}."
  en: "Abu Ja'far al-Batruji Ahmad ibn Abd al-Rahman of al-Andalus, one of the imams; he transmitted from Abu Abdallah al-Tala'i, Abu Ali al-Ghassani and their peers — a wise imam perceptive in Malik's madhhab and its subtleties and in hadith with its narrators and defects, author of well-known works; none in al-Andalus matched him in his time though spare in Arabicity, shabby of dress and obscure; d. Muharram 542 {cite:shadharat-dhahab p. 610-611}."
