summary:
  ar: "عبد المغيث بن زهير الحربي أبو العزيز ابن حرب الحنبلي محدث بغداد؛ ولد سنة خمسمائة تقريباً وسمع من أبي القاسم بن الحصين وابن كادش وغيرهما وعُني بهذا الشأن وحصل الأصول ولم يزل يسمع حتى سمع من أقرانه، وتفقه على القاضي أبي الحسين ابن الفراء، وكان صالحاً متديناً صدوقاً أميناً مجتهداً في اتباع السنة والآثار، وجمع وصنف وحدث وبُورك له حتى حدث بجميع مروياته وسمع منه الكبار؛ قال ابن الحنبلي سمعت منه وكان حافظاً زاهداً ورعاً كنت إذا رأيته خُيل إلي أنه أحمد بن حنبل لأنه كان قصيراً؛ توفي ليلة الأحد ثالث عشري المحرم ودفن بتكة قبر الإمام أحمد {cite:shadharat-dhahab p. 755-756}."
  en: "Abd al-Mughith b. Zuhayr al-Harbi, Abu al-Aziz Ibn Harb the Hanbali, traditionist of Baghdad; b. c.500, heard hadith from Ibn al-Husayn, Ibn Kadish and their peers down to his own generation, trained in fiqh under Qadi Ibn al-Furra'; pious, truthful, trusted, he compiled, taught and was blessed to transmit his entire corpus — the great heard from him, and Ibn al-Hanbali who studied under him said his short stature made him look the very image of Ahmad b. Hanbal; he died the night of Sunday 13 Muharram and was buried near Imam Ahmad's grave. Al-Dhahabi notes he compiled a tract on Abu Hanifa's virtues that includes fabrications {cite:shadharat-dhahab p. 755-756}."
