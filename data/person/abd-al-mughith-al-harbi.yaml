summary:
  ar: "عبد المغيث بن زهير الحربي أبو العزيز ابن حرب الحنبلي محدث بغداد؛ ولد سنة خمسمائة تقريباً وسمع من أبي القاسم بن الحصين وابن كادش وغيرهما وعُني بهذا الشأن وحصل الأصول ولم يزل يسمع حتى سمع من أقرانه، وتفقه على القاضي أبي الحسين ابن الفراء، وكان صالحاً متديناً صدوقاً أميناً مجتهداً في اتباع السنة والآثار، وجمع وصنف وحدث وبُورك له حتى حدث بجميع مروياته وسمع منه الكبار؛ قال ابن الحنبلي سمعت منه وكان حافظاً زاهداً ورعاً كنت إذا رأيته خُيل إلي أنه أحمد بن حنبل لأنه كان قصيراً؛ توفي ليلة الأحد ثالث عشري المحرم ودفن بتكة قبر الإمام أحمد {cite:shadharat-dhahab p. 755-756}."
  en: "Abd al-Mughith b. Zuhayr al-Harbi, Abu al-Aziz Ibn Harb the Hanbali, traditionist of Baghdad; b. c.500, heard hadith from Ibn al-Husayn, Ibn Kadish and their peers down to his own generation, trained in fiqh under Qadi Ibn al-Furra'; pious, truthful, trusted, he compiled, taught and was blessed to transmit his entire corpus — the great heard from him, and Ibn al-Hanbali who studied under him said his short stature made him look the very image of Ahmad b. Hanbal; he died the night of Sunday 13 Muharram and was buried near Imam Ahmad's grave. Al-Dhahabi notes he compiled a tract on Abu Hanifa's virtues that includes fabrications {cite:shadharat-dhahab p. 755-756}."
  fr: "Abd al-Mughith b. Zuhayr al-Harbi, Abu al-Aziz Ibn Harb le hanbalite, traditionniste de Bagdad ; né vers 500, il entendit le hadith d'Ibn al-Husayn, d'Ibn Kadish et de leurs pairs jusqu'à sa propre génération, et se forma au fiqh auprès du cadi Ibn al-Furra' ; pieux, véridique, digne de confiance, il compila, enseigna et eut la bénédiction de transmettre l'ensemble de son corpus — les grands entendirent de lui, et Ibn al-Hanbali, qui étudia auprès de lui, dit que sa petite taille le faisait ressembler trait pour trait à Ahmad b. Hanbal ; il mourut la nuit du dimanche 13 muharram et fut inhumé près de la tombe de l'imam Ahmad. Al-Dhahabi note qu'il compila un opuscule sur les mérites d'Abu Hanifa qui contient des récits forgés {cite:shadharat-dhahab p. 755-756}."
  es: "Abd al-Mughith b. Zuhayr al-Harbi, Abu al-Aziz Ibn Harb el Hanbali, tradicionalista de Bagdad; 500 a. C., escuchó hadices de Ibn al-Husayn, Ibn Kadish y sus contemporáneos hasta su propia generación, se formó en fiqh con Qadi Ibn al-Furra'; piadoso, veraz y digno de confianza, compiló, enseñó y tuvo la bendición de transmitir toda su obra; los grandes escucharon de él, e Ibn al-Hanbali, quien estudió con él, dijo que su baja estatura lo hacía parecerse mucho a Ahmad b. Hanbal; murió la noche del domingo 13 de Muharram y fue enterrado cerca de la tumba del Imam Ahmad. Al-Dhahabi señala que compiló un tratado sobre las virtudes de Abu Hanifa que incluye invenciones {cite:shadharat-dhahab p. 755-756}."
  ur: "عبد المغیث بی۔ ظہیر الحربی، ابو العزیز ابن حرب حنبلی، محدث بغداد؛ bc500، ابن الحسین، ابن قادش اور ان کے ساتھیوں سے ان کی اپنی نسل سے حدیث سنی، جو قادی ابن الفوراء کے تحت فقہ میں تربیت یافتہ تھے۔ پرہیزگار، سچے، قابل اعتماد، انہوں نے مرتب کیا، سکھایا اور اپنا پورا کارپس منتقل کرنے کی سعادت حاصل کی - جس نے ان سے عظیم سنا، اور ابن الحنبلی جنہوں نے ان کے ماتحت تعلیم حاصل کی، کہا کہ ان کے چھوٹے قد نے انہیں احمد بن محمد کی شبیہہ بنا دیا۔ حنبل; آپ کا انتقال اتوار 13 محرم کی رات ہوا اور امام احمد کی قبر کے پاس دفن کیا گیا۔ الذہبی نوٹ کرتے ہیں کہ انہوں نے ابوحنیفہ کے فضائل پر ایک ٹریکٹ مرتب کیا جس میں من گھڑت باتیں شامل ہیں۔ 755-756}۔"
  tr: "Bağdatlı hadis alimi Abdülmuğh ibn Zuhair el-Harbi, Ebu el-Aziz ibn Harb el-Hanbeli; yaklaşık 500 yılında doğdu ve Ebu el-Kâsım ibn el-Hüseyn, İbn Kadiş ve diğerlerinden hadis öğrendi. Bu konuyla ilgilendi, temel bilgileri edindi ve akranlarından hadis öğrenene kadar dinlemeye devam etti. Kadı Ebu el-Hüseyn ibn el-Farra'dan fıkıh eğitimi aldı. Salih, dindar, doğru sözlü, güvenilir ve Sünnet ve rivayetlere uymada gayretli bir kişiydi. Hadisleri topladı, derledi ve rivayet etti ve tüm rivayetlerini aktarıncaya kadar mübarek oldu ve büyük alimler ondan hadis öğrendi. İbn el-Hanbeli şöyle dedi: Ondan hadis öğrendim ve o, ezberci, zühd sahibi ve takva sahibiydi. Onu gördüğümde, kısa boylu olduğu için Ahmed ibn Hanbel olduğunu sandım. O, Muharrem ayının on üçüncü Pazar gecesi vefat etti ve İmam Ahmed'in türbesine defnedildi. {kaynak:şadharat-dhahab s. 755-756}"
  id: "Abd al-Mughith ibn Zuhair al-Harbi, Abu al-Aziz ibn Harb al-Hanbali, ulama hadits Baghdad; beliau lahir sekitar tahun 500 dan belajar dari Abu al-Qasim ibn al-Husayn, Ibn Kadish, dan lainnya. Beliau tertarik pada masalah ini dan mempelajari dasar-dasarnya serta terus belajar hingga mendapat bimbingan dari para ulama sezamannya. Beliau mempelajari fiqih di bawah bimbingan Hakim Abu al-Husayn ibn al-Farra’. Beliau adalah orang yang saleh, religius, jujur, dapat dipercaya, dan tekun dalam mengikuti Sunnah dan riwayat-riwayat. Beliau mengumpulkan, menyusun, dan meriwayatkan hadits, dan beliau diberkati hingga meriwayatkan semua riwayatnya, dan para ulama besar pun belajar darinya. Ibn al-Hanbali berkata: Aku belajar darinya, dan beliau adalah seorang penghafal, seorang laku asketis, dan saleh. Ketika aku melihatnya, aku membayangkan bahwa beliau adalah Ahmad ibn Hanbal karena perawakannya pendek. Beliau wafat pada malam Minggu, tanggal tiga belas Muharram, dan dimakamkan di makam Imam Ahmad. {cite:shadharat-dhahab hlm. 755-756}"
