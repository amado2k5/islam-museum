summary:
  ar: "مدرّب ملاكمة أمريكي من فيلادلفيا (1965–2020). درّب برنارد هوبكينز وشين موزلي، واشتُهر بكشفه لفائف يد أنطونيو مارغاريتو المحشوة بالجص سنة 2009 قبل نزاله مع موزلي. تصفه مقالة ويكيبيديا الإنجليزية بأنه مسلم متدين، عُرف بلقب «الأخ ناظم»."
  en: "American boxing trainer from Philadelphia (1965–2020). He trained Bernard Hopkins and Shane Mosley, and is remembered for exposing Antonio Margarito's plaster-loaded hand wraps in 2009 before the Mosley fight. The English Wikipedia article describes him as a devout Muslim, known as 'Brother' Naazim."
  ur: "فلاڈیلفیا سے تعلق رکھنے والے امریکی باکسنگ ٹرینر (1965–2020)۔ انہوں نے برنارڈ ہاپکنز اور شین موزلی کو تربیت دی، اور 2009 میں موزلی کی لڑائی سے پہلے انٹونیو مارگاریٹو کے پلاسٹر بھرے ہینڈ ریپس بے نقاب کرنے سے شہرت پائی۔ انگریزی ویکیپیڈیا مضمون انہیں ایک پابند مسلمان بتاتا ہے جو «برادر ناظم» کے نام سے جانے جاتے تھے۔"
