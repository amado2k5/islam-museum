label: { ar: "عبد المسيح بن عمرو بن بقيلة", en: "Abd al-Masih ibn Amr ibn Buqayla" }
summary:
  ar: "عند البلاذري: عبد المسيح بن عمرو بن قيس بن حيان بن بقيلة — واسم بقيلة الحارث — من الأزد كان كبير السن حين خرج إلى خالد بن الوليد مفاوضاً عن أهل الحيرة فجرى بينهما الحوار المشهور «من بطن أمي» «في ثيابي» «على الأرض» «بنيناها للسفيه حتى يجيء الحليم» واصطلحا على مائة ألف يؤدونها كل سنة وهو أول مال حمل إلى المدينة من العراق سنة اثنتي عشرة."
  en: "In al-Baladhuri: Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla — Buqayla's name being al-Harith — of Azd; an old man when he came out to negotiate al-Hira's peace with Khalid ibn al-Walid, their famous exchange running 'from my mother's belly', 'in my clothes', 'on the earth', 'we built them for the fool until the wise man comes'; they agreed a hundred thousand yearly — the first money carried to Medina from Iraq, year 12."
