class: person
label: { ar: "عبد المسيح بن عمرو بن بقيلة", en: "Abd al-Masih ibn Amr ibn Buqayla", fr: "Abd al-Masih ibn Amr ibn Buqayla", es: "Abd al-Masih ibn Amr ibn Buqayla", ur: "عبد المسیح ابن عمرو بن بکیلہ" }
summary:
  ar: "عند البلاذري: عبد المسيح بن عمرو بن قيس بن حيان بن بقيلة — واسم بقيلة الحارث — من الأزد كان كبير السن حين خرج إلى خالد بن الوليد مفاوضاً عن أهل الحيرة فجرى بينهما الحوار المشهور «من بطن أمي» «في ثيابي» «على الأرض» «بنيناها للسفيه حتى يجيء الحليم» واصطلحا على مائة ألف يؤدونها كل سنة وهو أول مال حمل إلى المدينة من العراق سنة اثنتي عشرة."
  en: "In al-Baladhuri: Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla — Buqayla's name being al-Harith — of Azd; an old man when he came out to negotiate al-Hira's peace with Khalid ibn al-Walid, their famous exchange running 'from my mother's belly', 'in my clothes', 'on the earth', 'we built them for the fool until the wise man comes'; they agreed a hundred thousand yearly — the first money carried to Medina from Iraq, year 12."
  fr: "Chez al-Baladhuri : Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla — Buqayla s'appelant al-Harith — des Azd ; vieillard lorsqu'il sortit négocier la paix d'al-Hira avec Khalid ibn al-Walid, leur célèbre échange allant de « du ventre de ma mère » à « dans mes vêtements », « sur la terre » et « nous les avons bâties pour le sot jusqu'à ce que vienne le sage » ; ils convinrent de cent mille par an — le premier argent porté d'Irak à Médine, en l'an 12."
  es: "En al-Baladhuri: Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla —el nombre de Buqayla era al-Harith— de Azd; un anciano cuando salió a negociar la paz de al-Hira con Khalid ibn al-Walid, su famoso intercambio fue 'desde el vientre de mi madre', 'en mi ropa', 'en la tierra', 'las construimos para el tonto hasta que llegue el sabio'; acordaron cien mil al año —el primer dinero llevado a Medina desde Irak, año 12."
  ur: "البلادوری میں ہے: عبد المسیح ابن عمرو بن قیس ابن حیان ابن بکیلہ - بکیلہ کا نام حارث ہے - ازد کا۔ ایک بوڑھا آدمی جب وہ خالد بن الولید کے ساتھ الحیرہ کی صلح پر گفت و شنید کے لیے نکلا، ان کا مشہور تبادلہ 'میری ماں کے پیٹ سے'، 'میرے کپڑوں میں'، 'زمین پر'، 'ہم نے انہیں احمقوں کے لیے بنایا جب تک کہ عقلمند نہ آجائے'؛ انہوں نے ایک لاکھ سالانہ پر اتفاق کیا - پہلی رقم جو عراق سے مدینہ لے گئی، سال 12۔"
  tr: "El-Baladhuri'ye göre: Azd kabilesinden Abdülmesih bin Amr bin Kays bin Hayyan bin Bakila (Bakila'nın adı El-Harith idi). Hira halkı adına Halid bin El-Valid ile görüşmek üzere gittiğinde yaşlı bir adamdı. Aralarında şu meşhur diyalog geçti: \"Annemin karnından,\" \"Elbiselerimin içinde,\" \"Yerde,\" \"Akıllı adam gelene kadar bunu ahmak için kurduk.\" Her yıl yüz bin ödenmesi konusunda anlaştılar ve bu, on ikinci yılda Irak'tan Medine'ye getirilen ilk paraydı."
  id: "Menurut Al-Baladhuri: Abd Al-Masih bin Amr bin Qais bin Hayyan bin Baqila — dan nama Baqila adalah Al-Harith — berasal dari suku Azd. Ia sudah tua ketika pergi menemui Khalid bin Al-Walid untuk bernegosiasi atas nama penduduk Hira. Dialog terkenal terjadi di antara mereka: “Dari rahim ibuku,” “Dalam pakaianku,” “Di tanah,” “Kami membangunnya untuk orang bodoh sampai orang bijak datang.” Mereka sepakat untuk membayar seratus ribu setiap tahun, dan ini adalah uang pertama yang dibawa ke Madinah dari Irak pada tahun kedua belas."
