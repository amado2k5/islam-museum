summary:
  ar: "وزير العزيز نزار بن المعز العبيدي صاحب مصر؛ كان أولاً يهودياً يزعم أنه من ولد هارون بن عمران وقيل إنه كان يزعم أنه من ولد السموأل بن عاديا اليهودي صاحب الحصن الأبلق، ولد ببغداد عند باب القز سنة ثمان عشرة وثلاث مئة وتعلم الكتابة والحساب وأنفذه أبوه إلى مصر سنة إحدى وثلاثين وثلاث مئة فانقطع إلى خواص كافور الإخشيدي فجعله على عمارة داره ثم أجلسه في ديوانه الخاص لما رأى من نجابته ونزاهته، وأمر كافور الدواوين ألا يمضي دينار ولا درهم إلا بتوقيعه، وأسلم يوم الاثنين لثماني عشرة ليلة خلت من شعبان سنة ست وخمسين وثلاث مئة ورتب لنفسه شيخاً يقرئه القرآن والنحو {cite:wafayat-ayan p. 27-28}. ولما مات كافور قبض عليه الوزير ابن الفرات في جملة أصحاب الدواوين فبذل الأموال حتى أفرج عنه وسار مستخفياً قاصداً بلاد المغرب فاتصل بالمعز، ونقل ابن زولاق أنه أول من وزر للدولة الفاطمية في الديار المصرية، وتولى وزارة العزيز يوم الجمعة ثامن عشر رمضان سنة ثمان وستين وثلاث مئة {cite:wafayat-ayan p. 28-29}. وكان يحب أهل العلم ورتب لنفسه مجلساً في كل ليلة جمعة يقرأ فيه بنفسه مصنفاته على الناس تحضره القضاة والفقهاء والقراء والنحاة، وفي داره قوم يكتبون القرآن وآخرون يكتبون كتب الحديث والفقه والأدب حتى الطب ويشكلون المصاحف وينقطونها، وصنف كتاباً في الفقه مما سمعه من المعز وولده العزيز وقرأه بنفسه على الناس في مجلس رمضاني سنة تسع وستين، ويقال إن الحارة المعروفة بالوزيرية بالقاهرة داخل باب سعادة منسوبة إلى أصحابه {cite:wafayat-ayan p. 29-30}. ومرض في ذي القعدة سنة ثمانين وأخذته سكتة وتوفي ليلة الأحد لخمس خلون من ذي الحجة سنة ثمانين وثلاث مئة، وكفن في خمسين ثوباً وخرج العزيز بغير مظلة وصلى عليه وبكى وحضر مواراته، وقيل إنه رثاه مائة شاعر {cite:wafayat-ayan p. 33-34}."
  en: "Wazir of the Fatimid al-Aziz; a Baghdad Jew by birth who claimed descent from Aaron — or, some said, from al-Samaw'al b. Adiya of the famous faithfulness — who learned secretarial craft at Bab al-Qazz, reached Egypt in 331 and rose from stewarding Kafur al-Ikhshidi's house to countersigning every dinar in his diwans; converted on 18 Sha'ban 356, fled Ibn al-Furat's purge to al-Mu'izz in the Maghreb, and per Ibn Zulaq was the first vizier of the Fatimid state in Egypt, taking office 18 Ramadan 368 {cite:wafayat-ayan p. 27-29}. He kept a Friday-night majlis where he read his own compositions to judges, jurists, qurra' and grammarians, staffed his house with Qur'an and hadith copyists, wrote a fiqh compendium from what he heard of al-Mu'izz and al-Aziz, and the Cairene quarter al-Waziriyya inside Bab Sa'ada is said to be named for his retainers {cite:wafayat-ayan p. 29-30}. He died of a stroke on 5 Dhu al-Hijja 380 — shrouded in fifty cloths, mourned by a hundred poets, with al-Aziz himself riding uncanopied to pray over him {cite:wafayat-ayan p. 33-34}."
