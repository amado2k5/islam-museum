summary:
  ar: "وزير العزيز نزار بن المعز العبيدي صاحب مصر؛ كان أولاً يهودياً يزعم أنه من ولد هارون بن عمران وقيل إنه كان يزعم أنه من ولد السموأل بن عاديا اليهودي صاحب الحصن الأبلق، ولد ببغداد عند باب القز سنة ثمان عشرة وثلاث مئة وتعلم الكتابة والحساب وأنفذه أبوه إلى مصر سنة إحدى وثلاثين وثلاث مئة فانقطع إلى خواص كافور الإخشيدي فجعله على عمارة داره ثم أجلسه في ديوانه الخاص لما رأى من نجابته ونزاهته، وأمر كافور الدواوين ألا يمضي دينار ولا درهم إلا بتوقيعه، وأسلم يوم الاثنين لثماني عشرة ليلة خلت من شعبان سنة ست وخمسين وثلاث مئة ورتب لنفسه شيخاً يقرئه القرآن والنحو {cite:wafayat-ayan p. 27-28}. ولما مات كافور قبض عليه الوزير ابن الفرات في جملة أصحاب الدواوين فبذل الأموال حتى أفرج عنه وسار مستخفياً قاصداً بلاد المغرب فاتصل بالمعز، ونقل ابن زولاق أنه أول من وزر للدولة الفاطمية في الديار المصرية، وتولى وزارة العزيز يوم الجمعة ثامن عشر رمضان سنة ثمان وستين وثلاث مئة {cite:wafayat-ayan p. 28-29}. وكان يحب أهل العلم ورتب لنفسه مجلساً في كل ليلة جمعة يقرأ فيه بنفسه مصنفاته على الناس تحضره القضاة والفقهاء والقراء والنحاة، وفي داره قوم يكتبون القرآن وآخرون يكتبون كتب الحديث والفقه والأدب حتى الطب ويشكلون المصاحف وينقطونها، وصنف كتاباً في الفقه مما سمعه من المعز وولده العزيز وقرأه بنفسه على الناس في مجلس رمضاني سنة تسع وستين، ويقال إن الحارة المعروفة بالوزيرية بالقاهرة داخل باب سعادة منسوبة إلى أصحابه {cite:wafayat-ayan p. 29-30}. ومرض في ذي القعدة سنة ثمانين وأخذته سكتة وتوفي ليلة الأحد لخمس خلون من ذي الحجة سنة ثمانين وثلاث مئة، وكفن في خمسين ثوباً وخرج العزيز بغير مظلة وصلى عليه وبكى وحضر مواراته، وقيل إنه رثاه مائة شاعر {cite:wafayat-ayan p. 33-34}."
  en: "Wazir of the Fatimid al-Aziz; a Baghdad Jew by birth who claimed descent from Aaron — or, some said, from al-Samaw'al b. Adiya of the famous faithfulness — who learned secretarial craft at Bab al-Qazz, reached Egypt in 331 and rose from stewarding Kafur al-Ikhshidi's house to countersigning every dinar in his diwans; converted on 18 Sha'ban 356, fled Ibn al-Furat's purge to al-Mu'izz in the Maghreb, and per Ibn Zulaq was the first vizier of the Fatimid state in Egypt, taking office 18 Ramadan 368 {cite:wafayat-ayan p. 27-29}. He kept a Friday-night majlis where he read his own compositions to judges, jurists, qurra' and grammarians, staffed his house with Qur'an and hadith copyists, wrote a fiqh compendium from what he heard of al-Mu'izz and al-Aziz, and the Cairene quarter al-Waziriyya inside Bab Sa'ada is said to be named for his retainers {cite:wafayat-ayan p. 29-30}. He died of a stroke on 5 Dhu al-Hijja 380 — shrouded in fifty cloths, mourned by a hundred poets, with al-Aziz himself riding uncanopied to pray over him {cite:wafayat-ayan p. 33-34}."
  es: "Wazir del fatimí al-Aziz; un judío de Bagdad de nacimiento que afirmaba descender de Aarón —o, según algunos, de al-Samaw'al b. Adiya de la famosa fidelidad— que aprendió el oficio de secretario en Bab al-Qazz, llegó a Egipto en 331 y ascendió desde administrador de la casa de Kafur al-Ikhshidi hasta refrendar cada dinar en sus diwanes; se convirtió el 18 de Sha'ban de 356, huyó de la purga de Ibn al-Furat a al-Mu'izz en el Magreb, y según Ibn Zulaq fue el primer visir del estado fatimí en Egipto, asumiendo el cargo el 18 de Ramadán de 368 {cite:wafayat-ayan p. 27-29}. Celebraba una reunión los viernes por la noche donde leía sus propias composiciones a jueces, juristas, qurra' y gramáticos; tenía copistas del Corán y los hadices en su casa; escribió un compendio de fiqh a partir de lo que escuchó de al-Mu'izz y al-Aziz; y se dice que el barrio cairota de al-Waziriyya, dentro de Bab Sa'ada, debe su nombre a sus sirvientes {cite:wafayat-ayan p. 29-30}. Murió de un derrame cerebral el 5 de Dhu al-Hijja de 380, envuelto en cincuenta telas, llorado por cien poetas, con el propio al-Aziz cabalgando sin dosel para rezar por él {cite:wafayat-ayan p. 33-34}."
  fr: "Le vizir fatimide al-Aziz, né à Bagdad et se réclamant de la descendance d'Aaron — ou, selon certains, d'al-Samaw'al b. Adiya, célèbre pour sa fidélité —, apprit le métier de secrétaire à Bab al-Qazz, arriva en Égypte en 331 et passa de intendant de la maison de Kafur al-Ikhshidi à contresigner chaque dinar dans ses diwans; converti le 18 Sha'ban 356, il s'enfuit lors de la purge d'Ibn al-Furat pour se réfugier à al-Mu'izz au Maghreb, et, selon Ibn Zulaq, fut le premier vizir de l'État fatimide en Égypte, entrant en fonction le 18 Ramadan 368 {cite:wafayat-ayan p. 27-29}. Il tenait un majlis le vendredi soir où il lisait ses propres compositions à des juges, des juristes, des exégètes coraniques et des grammairiens; il employait des copistes du Coran et des hadiths à son service; il rédigea un recueil de fiqh à partir des enseignements d’al-Mu’izz et d’al-Aziz; et le quartier cairote d’al-Waziriyya, situé à l’intérieur de Bab Sa’ada, tiendrait son nom de ses serviteurs (voir: Wafayat-ayan, p. 29-30). Il mourut d’une attaque cérébrale le 5 Dhu al-Hijja 380, enveloppé dans cinquante étoffes, pleuré par une centaine de poètes, et al-Aziz lui-même vint prier sur lui à cheval, sans dais (voir: Wafayat-ayan, p. 33-34)."
  ur: "فاطمی العزیز کے وزیر؛ پیدائشی طور پر ایک بغدادی یہودی جس نے ہارون کی نسل کا دعویٰ کیا - یا بعض نے کہا، السماءالب۔ مشہور وفاداری کا عدیہ - جس نے باب القز میں خفیہ کاری کی تعلیم حاصل کی، 331 میں مصر پہنچی اور کافور الاخشدی کے گھر کی ذمہ داری سے اٹھ کر اپنے دیوانوں میں ہر دینار کا مقابلہ کیا۔ 18 شعبان 356 کو تبدیل ہوا، مغرب میں ابن الفرات کی پاکی سے المعز میں فرار ہو گیا، اور فی ابن ذوالق مصر میں فاطمی ریاست کا پہلا وزیر تھا، جس نے 18 رمضان 368 کو عہدہ سنبھالا۔ 27-29}۔ اس نے جمعہ کی رات کی مجلس رکھی جہاں اس نے ججوں، فقہاء، قراء اور گرامر کے ماہرین کو اپنی تالیفات پڑھ کر سنائیں، قرآن اور حدیث کے نسخوں کے ساتھ اپنے گھر کا عملہ لگایا، المعز اور العزیز کے بارے میں جو کچھ سنا اس سے فقہ کا مجموعہ لکھا، اور کیرین کوارٹر الوزیریہ کا نام بطین کے اندر رکھا گیا۔ {حوالہ: وفایت آیان ص 29-30}۔ ان کا انتقال 5 ذی الحجہ 380 کو فالج کا دورہ پڑنے سے ہوا - پچاس کپڑوں میں کفن دیا گیا، سو شاعروں نے سوگوار کیا، خود العزیز ان پر نماز ادا کرنے کے لیے بغیر چھت کے سوار تھے۔ 33-34}۔"
  tr: "Mısır hükümdarı Aziz Nizar ibn al-Mu'izz al-Obaidi'nin bakanı, başlangıçta Harun ibn İmran'ın soyundan geldiği iddia edilen bir Yahudiydi. Söylenene göre, el-Ablak kalesinin sahibi Yahudi Samawal ibn 'Adiya'nın soyundan geldiği söylenir. 318 Hicri yılında Bağdat'ta Bab al-Kız yakınlarında doğdu, yazı ve aritmetik öğrendi ve babası onu 331 Hicri'de Mısır'a gönderdi. Kafur el-İhşidi'nin yakın dostlarıyla yakınlaştı, onu evini yönetmesi için atadı, ardından soyluluğunu ve dürüstlüğünü gördüğü için özel diwanına oturttu. Kafur, diwanlara imzası olmadan dinar veya dirhem değişimi yapmamalarını emretti. 356 Hicri yılında, Şaban'dan on sekiz gece önce, Pazartesi günü İslam'a geçti ve Kur'an ile dilbilgisini öğretmesi için bir şeyh atadı {alıntı: Wafayat-Ayan, s. 27-28}. Kafur öldüğünde, vezir İbn el-Furat onu diwanlar arasında tutukladı, bu yüzden parayı bıraktı ve serbest bırakılana kadar gizlice Mağrip'e giderek el-Mu'izz ile iletişime geçti. İbn Zulaq, Mısır'daki Fatımi devletinin ilk bakanı olduğunu ve 368 H. yılının Ramazan ayının on sekizinci Cuma günü el-Aziz'in vezirliğini devraldığını bildirdi. {kaynak:wafayat-ayan, s. 28-29}. Alimleri severdi ve her Cuma gecesi eserlerini halka şahsen okurdu; bu toplantıya hakimler, hukukçular, şiavetçiler ve dilbilgicileri katılırdı. Evinde bazıları Kur'an'ı yazarken, bazıları hadis, fıkıh, edebiyat ve hatta tıp üzerine kitaplar yazarak Kur'an'ları oluşturup sulandırdı. El-Muizz ve sevgili oğlundan duyduklarına dayanarak bir hukuk kitabı yazdı ve 1969'da bir Ramazan toplantısında halka şahsen okudu. Kahire'de, Saada Kapısı içindeki Al-Waziriya mahallesinin onun sahabelerine atfedildiği söylenir {kaynak:wafayat-ayan, s. 29-30}. Seksen yılında, Dhu al-Qi'dah'ta hastalandı ve felç geçirdi. 380 Hicri yılında, Zhu'z-Hicce'den beş gün önce, Pazar gecesi vefat etti. Elli giysiyle örtüldü, sevgilisi şemsiyesiz dışarı çıktı, onun için dua etti, ağladı ve cenazesine katıldı. Yüz şairin onun için yas tuttuğu söylenir {atıf:wafayat-ayan s. 33-34}."
  id: "Menteri Aziz Nizar ibn al-Mu'izz al-Obaidi, penguasa Mesir, awalnya adalah seorang Yahudi yang diklaim sebagai keturunan Harun ibn Imran. Dikatakan ia adalah keturunan Samawal ibn 'Adiya, orang Yahudi yang memiliki benteng al-Ablak. Ia lahir di Baghdad dekat Bab al-Qiz pada tahun 318 H, belajar menulis dan berhitung, dan ayahnya mengirimnya ke Mesir pada tahun 331 H. Ia menjadi dekat dengan rekan-rekan dekat Kafur al-Ikhshidi, menunjuknya untuk mengelola rumahnya, lalu menempatkannya di diwan pribadinya karena melihat kemuliaan dan integritasnya. Kafur memerintahkan para diwan untuk tidak menukar dinar atau dirham tanpa tanda tangannya. Ia memeluk Islam pada hari Senin, delapan belas malam sebelum Sha'ban pada tahun 356 H, dan menunjuk seorang sheikh untuk mengajarinya Al-Qur'an dan tata bahasa {cite::Wafayat-Ayan, hlm. 27-28}. Ketika Kafur meninggal, wazir Ibn al-Furat menangkapnya di antara anggota para diwan, sehingga ia menyerahkan uang itu hingga dibebaskan dan diam-diam pergi ke Maghreb, di mana ia menghubungi al-Mu'izz. Ibn Zulaq melaporkan bahwa ia adalah menteri pertama negara Fatimiyah di Mesir, dan ia mengambil alih jabatan wazir al-Aziz pada hari Jumat, tanggal delapan belas Ramadan, tahun 368 H. {cite:wafayat-ayan, hlm. 28-29}. Ia menyukai para ulama dan mengatur pertemuan setiap Jumat malam di mana ia secara pribadi membacakan karyanya kepada masyarakat, dihadiri oleh hakim, ahli hukum, pembaca, dan ahli tata bahasa. Di rumahnya, beberapa menulis Al-Qur'an, yang lain menulis buku tentang hadits, firitur, sastra, bahkan kedokteran, membentuk dan mencairkan Al-Qur'an. Ia menulis sebuah buku tentang hukum berdasarkan apa yang didengarnya dari Al-Mu'izz dan putranya tercinta, yang ia bacakan secara pribadi kepada masyarakat dalam pertemuan Ramadan tahun 1969. Dikatakan bahwa lingkungan yang dikenal sebagai Al-Waziriya di Kairo, di dalam Gerbang Saada, dikaitkan dengan teman-temannya {cite:wafayat-ayan, hlm. 29-30}. Ia jatuh sakit di Dhu al-Qi'dah pada tahun delapan puluh dan mengalami stroke. Ia meninggal pada malam Minggu, lima hari sebelum Dhu al-Hijjah pada tahun 380 H. Ia mengenakan lima puluh pakaian, dan orang tercinta itu keluar tanpa payung, berdoa untuknya, menangis, dan menghadiri pemakamannya. Dikatakan seratus penyair berduka atas dirinya {cite:wafayat-ayan hlm. 33-34}."
