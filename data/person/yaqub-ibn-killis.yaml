summary:
  ar: "وزير العزيز نزار بن المعز العبيدي صاحب مصر؛ كان أولاً يهودياً يزعم أنه من ولد هارون بن عمران وقيل إنه كان يزعم أنه من ولد السموأل بن عاديا اليهودي صاحب الحصن الأبلق، ولد ببغداد عند باب القز وتعلم الكتابة والحساب وأنفذه أبوه إلى مصر سنة إحدى وثلاثين وثلاث مئة فانقطع إلى خواص كافور الإخشيدي فجعله على عمارة داره ثم أجلسه في ديوانه الخاص لما رأى من نجابته ونزاهته {cite:wafayat-ayan p. 27-28}."
  en: "Wazir of the Fatimid al-Aziz; a Baghdad Jew by birth who claimed descent from Aaron — or, some said, from al-Samaw'al b. Adiya of the famous faithfulness — who learned secretarial craft at Bab al-Qazz, reached Egypt in 331 and rose from stewarding Kafur al-Ikhshidi's house to his private diwan {cite:wafayat-ayan p. 27-28}."
