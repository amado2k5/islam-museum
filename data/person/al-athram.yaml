label: { ar: "أحمد بن هانئ الأثرم", en: "Al Athram", fr: "Al-Athram", es: "Al Athram", ur: "الاتھرام" }
summary:
  ar: "الأثرم من أصحاب أحمد بن حنبل واسمه أحمد بن محمد بن هانئ ويكنى أبا بكر من أهل إسكاف بني جنيد وله كتاب السنن في الفقه على مذاهب أحمد وشواهده من الحديث وكتاب التاريخ وكتاب العلل وكتاب الناسخ والمنسوخ في الحديث {cite:fihrist-ibn-al-nadim p. 321}."
  en: "Al-Athram — Ibn Hanbal's companion whose Sunan follows his master's madhhab {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Athram — compagnon d’Ibn Hanbal dont les Sunan suivent l’école de son maître {cite:fihrist-ibn-al-nadim}"
  es: "Al-Athram — Compañero de Ibn Hanbal cuyo Sunan sigue la escuela de pensamiento de su maestro {cite:fihrist-ibn-al-nadim}"
  ur: "الاتھرام - ابن حنبل کا ساتھی جس کی سنن اپنے آقا کے مذہب کی پیروی کرتی ہے {حوالہ: فہرست ابن الندیم"
  tr: "El-Athram, Ahmed ibn Hanbel'in sahabelerinden biriydi. Adı Ahmed ibn Muhammed ibn Hani' idi ve Ebu Bekir olarak da bilinirdi. İskef Beni Cüneyd kabilesindendi. Ahmed mezheplerine göre fıkıhta sünnet ve hadislerden deliller üzerine bir kitabı, tarih üzerine bir kitabı, eksiklikler üzerine bir kitabı ve nesih ve neshedilmiş hadisler üzerine bir kitabı vardı. {cite:fihrist-ibn-al-nadim s. 321}"
  id: "Al-Athram adalah salah satu sahabat Ahmad ibn Hanbal. Namanya adalah Ahmad ibn Muhammad ibn Hani’ dan ia dikenal sebagai Abu Bakr. Ia berasal dari kaum Iskaf Bani Junaid. Ia memiliki sebuah buku tentang Sunan dalam fiqih menurut mazhab Ahmad dan bukti pendukungnya dari Hadits, sebuah buku tentang sejarah, sebuah buku tentang kekurangan, dan sebuah buku tentang pembatalan dan Hadits yang dibatalkan. {cite:fihrist-ibn-al-nadim p. 321}."
