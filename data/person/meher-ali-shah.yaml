summary:
  ar: "عالم ومتصوف وشاعر بنجابي (1859–1937)، وُلد في غولرة شريف وتوفي فيها. بايع خواجة شمس الدين السيالوي على الطريقة الجشتية النظامية ونال منه الخلافة، وعُرف عالمًا حنفيًا وقائدًا للحركة المناهضة للأحمدية، وله «سيف جشتيائي» و«تصفية ما بين السنة والشيعة» وشعر بنجابي مشهور."
  en: "Punjabi scholar, Sufi and poet (1859–1937), born at Golra Sharif and died there. He took bay'ah with Khawaja Shams-ud-din Sialvi in the Chishti Nizami order and received khilafa from him, was known as a Hanafi scholar, led the anti-Ahmadiyya movement, and wrote Saif-e-Chishtiyai, Tasfiah Mabain Sunni wa Shi'ah and celebrated Punjabi poetry."
  ur: "پنجابی عالم، صوفی اور شاعر (1859ء–1937ء)، گولڑہ شریف میں پیدا ہوئے اور وہیں وصال ہوا۔ خواجہ شمس الدین سیالوی سے سلسلہ چشتیہ نظامیہ میں بیعت ہوئے اور خلافت سے نوازے گئے، حنفی عالم مانے جاتے تھے اور تحریکِ مخالفِ قادیانیت کے قائد تھے؛ ان کی مشہور تصانیف میں «سیفِ چشتیائی» اور «تصفیہ مابین سنی و شیعہ» شامل ہیں۔"
