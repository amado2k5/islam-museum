id: person/turkan-khatun
class: person
label: { ar: "تركان زوجة ملكشاه" }
summary:
  ar: "زوجة السلطان ملكشاه، لما مات كتمت موته وأرسلت إلى الأمراء سراً فاستحلفتهم لولدها محمود وهو ابن خمس سنين وأرسلت إلى المقتدي في أن يسلطنه فأجاب ولقبه ناصر الدنيا والدين {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  en: "Malikshah's wife; on his death she hid it, secretly had the amirs swear to her five-year-old Mahmud, and secured his sultanate from the caliph as Nasir al-Dunya wa'l-Din {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  es: "La esposa de Malikshah; tras su muerte, ella lo ocultó, hizo que los emires juraran por su hijo Mahmud, de cinco años, y aseguró su sultanato del califa como Nasir al-Dunya wa'l-Din {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  fr: "L'épouse de Malikshah; à sa mort, elle le cacha, fit secrètement jurer aux émirs sur son fils Mahmud, âgé de cinq ans, et obtint son sultanat du calife sous le nom de Nasir al-Dunya wa'l-Din {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  ur: "ملک شاہ کی بیوی؛ اس کی موت پر اس نے اسے چھپا دیا، امیروں نے اپنے پانچ سالہ محمود سے خفیہ طور پر حلف لیا، اور ناصر الدنیا والالدین کی حیثیت سے اپنی سلطنت کو خلیفہ سے محفوظ کر لیا۔ 653}۔"
  tr: "Sultan Malikşah'ın eşi, öldüğünde ölümünü gizledi ve prenslere gizlice mesajlar gönderdi; prensler beş yaşındaki oğlu Mahmud adına yemin ettirdiler ve onu yönetmesi için takipçiye gönderdiler; takipçi ona cevap verip Dünyanın ve Dinin Nasir'i unvanını verdi {cite:History-Khulafa-minhaj-1434, s. 653}."
  id: "Istri Sultan Malikshah, ketika ia meninggal, menyembunyikan kematiannya dan diam-diam mengirim pesan kepada para pangeran, yang membuat mereka bersumpah atas nama putranya Mahmud, yang berusia lima tahun, dan mengirim kepada pengikutnya untuk memerintahnya, yang menjawab dan memberinya gelar Nasir Dunia dan Agama {cite:History-Khulafa-minhaj-1434, hlm. 653}."
