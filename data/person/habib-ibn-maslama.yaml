summary:
  ar: "فهري من قريش؛ وجّهه خالد بن الوليد مع بشر بن أبي أرطاة العامري إلى غوطة دمشق في مسيره من العراق إلى الشام فأغارا على قرى من قراها."
  en: "A Fihri of Quraysh; Khalid ibn al-Walid sent him with Busr ibn Abi Artat al-Amiri to the Ghouta of Damascus on his march from Iraq to Syria, and they raided villages of its countryside."
  ur: "قریش کے بنو فہر سے تعلق رکھنے والے؛ خالد بن ولید نے عراق سے شام جاتے ہوئے انہیں بسر بن ابی ارطاۃ کے ساتھ دمشق کے غوطہ کی طرف بھیجا۔ {cite:futuh-buldan-maarif-1407}"
  es: "Un Fihri de Quraysh, Khalid ibn al-Walid, lo envió con Busr ibn Abi Artat al-Amiri a la Ghouta de Damasco en su marcha de Irak a Siria, y juntos saquearon aldeas de sus alrededores."
  fr: "Un Fihri de Quraysh; Khalid ibn al-Walid l'envoya avec Busr ibn Abi Artat al-Amiri à la Ghouta de Damas lors de sa marche d'Irak vers la Syrie, et ils pillèrent des villages de sa campagne."
  tr: "Kurayşlı Fahri; Halid bin el-Velid, onu Bişr ibn Ebi Artah el-Amiri ile birlikte Irak'tan Şam'a yaptığı yolculukta Şam'ın Gutası'na gönderdi ve burada bazı köylere baskın düzenledi."
  id: "Fahri dari Quraisy; Khalid ibn al-Walid mengirimnya bersama Bishr ibn Abi Artah al-Amiri ke Ghouta Damaskus dalam perjalanannya dari Irak ke Levant, di mana ia menyerang beberapa desanya."
