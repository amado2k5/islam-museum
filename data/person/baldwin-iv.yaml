summary:
  ar: "بلدوين الرابع ملك بيت المقدس الفرنجي المصاب بالجذام. يذكر ابن الأثير أنه خلف أباه مري وهو مجذوم عاجز عن تدبير الملك، فتولى القمص ريموند صاحب طرابلس تدبيره، ويقول لاحقاً إن ملك الفرنج المجذوم أوصى بالملك لابن أخت له صغير. وتنسب دائرة المعارف الإسلامية إليه بناء حصن مخاضة يعقوب سنة 573هـ/1178م الذي هدمه صلاح الدين سنة 575هـ/1179م {cite:kamil-ibn-al-athir p. 68} {cite:kamil-ibn-al-athir p. 141} {cite:encyclopaedia-of-islam-2 vol. 2 p. 582}."
  en: "Baldwin IV was the Frankish king of Jerusalem who suffered from leprosy. Ibn al-Athir says he succeeded his father Amalric as a leper unable to manage the kingdom, so that Raymond, count of Tripoli, directed its affairs, and later that the leper king of the Franks left the crown to a young nephew. The Encyclopaedia of Islam credits him with building the fortress at Jacob's Ford in 573/1178, which Saladin destroyed in 575/1179 {cite:kamil-ibn-al-athir p. 68} {cite:kamil-ibn-al-athir p. 141} {cite:encyclopaedia-of-islam-2 vol. 2 p. 582}."
  ur: "بالڈون چہارم بیت المقدس کا فرنگی بادشاہ تھا جو کوڑھ کے مرض میں مبتلا تھا۔ ابن الاثیر لکھتے ہیں کہ وہ اپنے باپ مری کا جانشین بنا تو مجذوم اور سلطنت چلانے سے عاجز تھا، چنانچہ طرابلس کے کونٹ ریمنڈ نے اس کے امور سنبھالے، اور بعد میں بتاتے ہیں کہ مجذوم فرنگی بادشاہ نے اپنے ایک چھوٹے بھانجے کو تخت کی وصیت کی۔ دائرۃ المعارف الاسلامیہ اس سے 573ھ/1178ء میں مخاضۂ یعقوب کے قلعے کی تعمیر منسوب کرتا ہے جسے صلاح الدین نے 575ھ/1179ء میں تباہ کیا {cite:kamil-ibn-al-athir p. 68} {cite:kamil-ibn-al-athir p. 141} {cite:encyclopaedia-of-islam-2 vol. 2 p. 582}."
