label: { ar: "قطام" }
summary:
  ar: "امرأة من الخوارج عشقها عبد الرحمن بن ملجم فنكحها وأصدقها ثلاثة آلاف درهم وعبدًا وقينة وقتل علي، وفي ذلك قال الفرزدق أبياته المشهورة فلا مهر أغلى من علي وإن علا ولا فتك إلا دون فتك ابن ملجم {cite:tarikh-khulafa-minhaj-1434 p. 296}.، وعند المسعودي كانت أجمل أهل زمانها وكان علي قد قتل أباها وأخاها يوم النهروان، فلما خطبها ابن ملجم ابن عمها قالت لا أتزوج حتى تسمي لي فاشترطت الثلاثة آلاف والعبد والقينة وقتل علي، وضربت كلة في المسجد الأعظم معتكفة وعصبت ابن ملجم وشبيباً بحرير {cite:muruj-al-dhahab p. 701-702}"
  en: "A Khariji woman whom Abd al-Rahman ibn Muljim loved and married, giving her as dower three thousand dirhams, a slave, a singing-girl, and the killing of Ali — celebrated in al-Farazdaq's famous verses: 'no dower was dearer than Ali, however high, nor any treachery below Ibn Muljim's' {cite:tarikh-khulafa-minhaj-1434 p. 296}."
