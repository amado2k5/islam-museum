label: { ar: "قطام" }
summary:
  ar: "امرأة من الخوارج عشقها عبد الرحمن بن ملجم فنكحها وأصدقها ثلاثة آلاف درهم وعبدًا وقينة وقتل علي، وفي ذلك قال الفرزدق أبياته المشهورة فلا مهر أغلى من علي وإن علا ولا فتك إلا دون فتك ابن ملجم {cite:tarikh-khulafa-minhaj-1434 p. 296}. وعند المسعودي كانت أجمل أهل زمانها وكان علي قد قتل أباها وأخاها يوم النهروان، فلما خطبها ابن ملجم ابن عمها قالت لا أتزوج حتى تسمي لي فاشترطت الثلاثة آلاف والعبد والقينة وقتل علي، وضربت كلة في المسجد الأعظم معتكفة وعصبت ابن ملجم وشبيباً بحرير {cite:muruj-al-dhahab p. 701-702}"
  en: "A Khariji woman whom Abd al-Rahman ibn Muljim loved and married, giving her as dower three thousand dirhams, a slave, a singing-girl, and the killing of Ali — celebrated in al-Farazdaq's famous verses: 'no dower was dearer than Ali, however high, nor any treachery below Ibn Muljim's' {cite:tarikh-khulafa-minhaj-1434 p. 296}."
  es: "Una mujer jariyí a la que Abd al-Rahman ibn Muljim amó y con la que se casó, dándole como dote tres mil dirhams, un esclavo, una cantante y el asesinato de Ali, celebrado en los famosos versos de al-Farazdaq: «Ninguna dote fue más preciada que Ali, por muy alta que fuera, ni ninguna traición inferior a la de Ibn Muljim» {cite:tarikh-khulafa-minhaj-1434 p. 296}."
  fr: "Une femme kharijite qu'Abd al-Rahman ibn Muljim a aimée et épousa, lui donnant en dot trois mille dirhams, un esclave, une chanteuse et le meurtre d'Ali — célébré dans les célèbres vers d'al-Farazdaq: « aucune dot n'était plus chère qu'Ali, aussi élevée soit-elle, ni aucune trahison inférieure à celle d'Ibn Muljim » {cite: tarikh-khulafa-minhaj-1434 p. 296}."
  ur: "ایک خارجی عورت جس سے عبدالرحمٰن بن ملجم نے محبت کی اور اس سے شادی کی، اسے تین ہزار درہم مہر، ایک غلام، ایک گلوکارہ، اور علی کا قتل - الفرازدق کی مشہور آیات میں منایا گیا ہے: 'علی سے زیادہ مہر عزیز نہیں تھا، خواہ کتنا ہی اونچا ہو، اور نہ ہی مجھ سے نیچے کوئی خیانت'۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 296}۔"
  tr: "Harici bir kadın Abd al-Rahman ibn Mulcam tarafından sevilirdi, bu yüzden onunla evlendi ve üç bin dirhem, bir köle ve bir köle sevdi ve Ali öldürüldü. Al-Farazdaq ünlü dizelerinde şöyle demiştir: 'Ali'den daha değerli bir çeyiz yoktur, soylu ya da ölümcül olsa bile, İbn Muljam'ı öldüren kişi hariç.' {alıntı:Tarih-Khulafa-minhaj-1434, s. 296}. al-Mas'udi'ye göre, zamanının en güzeliydi ve Ali, Nahrawan gününde babasını ve kardeşini öldürmüştü. Kuzeni İbn Muljam ona evlenme teklif ettiğinde, Ali 'Beni adlandırana kadar evlenmem.' dedi. Üç bin, köle ve köle şart koştu ve Ali öldürüldü. Büyük Camii'de inzivada dövüldü ve İbn Muljam ile genç adamlar ipek olarak bağlandı {atıf:Muruj-al-dhahab, s. 701-702}"
  id: "Seorang wanita Kharij dicintai oleh Abd al-Rahman ibn Muljam, sehingga ia menikahinya dan mencintainya tiga ribu dirham, seorang budak, dan seorang budak, dan Ali dibunuh. Al-Farazdaq berkata dalam bait-baitnya yang terkenal: 'Tidak ada mas kawin yang lebih berharga daripada Ali, meskipun ia mulia atau berbahaya, kecuali orang yang membunuh Ibn Muljam.' {cite:Sejarah-Khulafa-minhaj-1434, hlm. 296}. Menurut al-Mas'udi, dia adalah yang tercantik pada zamannya, dan Ali telah membunuh ayah dan saudaranya pada hari Nahrawan. Ketika Ibn Muljam, sepupunya, melamarnya, dan dia berkata, 'Aku tidak akan menikah sampai kau menyebutku.' Dia menetapkan tiga ribu, budak dan budak, dan Ali dibunuh. Dia dipukuli di Masjid Besar dalam pengasingan dan diikat Ibn Muljam serta pemuda sutra {cite:Muruj-al-dhahab, hlm. 701-702}"
