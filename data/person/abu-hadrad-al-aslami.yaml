roles: [companion]
gender: male
summary:
  ar: "صحابي أسلمي، والد عبد الله؛ اختُلف في اسمه بين سلامة بن عمير وعبد وعبيد، روى عن النبي وروى عنه ابنه، وقال ابن سعد إنه مات سنة إحدى وسبعين وعقبه مغلطاي بأن التأريخ لترجمة ولده."
  en: "An Aslami Companion, father of Abdallah; his name is given variously as Salama ibn Umayr, Abd or Ubayd. He narrated from the Prophet and was narrated from by his son; Ibn Sa'd dates his death to 71 AH, which Mughlatai reassigns to the son's entry."
  ur: "اسلمی صحابی، عبد اللہ کے والد؛ نام سلامہ بن عمیر، عبد یا عبید مختلف روایات میں ہے۔"
  fr: "Compagnon aslamite, père d'Abdallah ; son nom est donné diversement comme Salama ibn Umayr, Abd ou Ubayd. Il rapporta du Prophète et son fils rapporta de lui ; Ibn Sa'd date sa mort de 71 H, date que Mughlatai réattribue à la notice du fils."
  es: "Compañero de la Iglesia Aslami, padre de Abdallah; su nombre aparece indistintamente como Salama ibn Umayr, Abd o Ubayd. Narró del Profeta y fue narrado por su hijo; Ibn Sa'd fecha su muerte en el año 71 de la Hégira, fecha que Mughlatai atribuye a la entrada del hijo."
  tr: "Abdullah'ın babası Aslam'ın bir arkadaşı; adı Seleme bin Umair, Abd ve Ubaid arasında tartışmalıdır. Peygamberimizden rivayet etmiş, oğlu da ondan rivayet etmiştir. İbn Saad, yetmiş birinci yılda vefat ettiğini söylemiş, halefi Muğaltay ise tarihin oğlunun biyografisine dayandığını belirtmiştir."
  id: "Seorang sahabat Aslam, ayah dari Abdullah; namanya diperdebatkan antara Salamah bin Umair, Abd, dan Ubaid. Ia meriwayatkan dari Nabi, dan putranya meriwayatkan darinya. Ibnu Saad berkata bahwa ia wafat pada tahun tujuh puluh satu, dan penggantinya, Mughaltai, mengatakan bahwa sejarah tersebut adalah untuk biografi putranya."
