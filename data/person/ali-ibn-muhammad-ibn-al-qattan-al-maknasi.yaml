id: person/ali-ibn-muhammad-ibn-al-qattan-al-maknasi
class: person
gender: male
label:
  ar: علي بن محمد بن عبد الملك المكناسي (ابن القطان)
  en: Ali ibn Muhammad ibn Abd al-Malik al-Maknasi (Ibn al-Qattan, Maliki hadith scholar)
summary:
  ar: فقيه مالكي من حفاظ الحديث من أهل مكناسة؛ ولي القضاء بسجلماسة، وسمع من أبي عبد الله بن الفخار وأبي عبد الله بن البقال وأبي ذر الخشني وغيرهم، وكتب إليه أبو جعفر بن مضاء وأبو محمد التادلي؛ من تصانيفه النظر في أحكام النظر وبيان الوهم والإيهام الواقعين في كتاب الأحكام ونظم الجمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}
  en: A Maliki jurist and hadith memorizer of Meknes; judge at Sijilmasa; heard from Ibn al-Fakhkhar, Ibn al-Baqqal, Abu Dharr al-Khushani and others; Ibn Mudaa and al-Tadili corresponded with him. Works include al-Nazar fi Ahkam al-Nazar and Bayan al-Wahm wal-Iham. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}
  ur: مکناس کے مالکی فقیہ اور حفاظِ حدیث میں سے؛ سجلماسہ میں قاضی رہے، ابن الفخار، ابن البقال اور ابو ذر الخشنی سے سماع کیا؛ تصانیف میں النظر فی احکام النظر اور بیان الوہم والإیہام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}
