id: person/ali-ibn-muhammad-ibn-al-qattan-al-maknasi
class: person
gender: male
label:
  ar: علي بن محمد بن عبد الملك المكناسي ⁦(ابن القطان)⁩
  en: Ali ibn Muhammad ibn Abd al-Malik al-Maknasi (Ibn al-Qattan, Maliki hadith scholar)
  es: "Ali ibn Muhammad ibn Abd al-Malik al-Maknasi (Ibn al-Qattan, Maliki hadith scholar)"
  fr: "Ali ibn Muhammad ibn Abd al-Malik al-Maknasi (Ibn al-Qattan, Maliki hadith scholar)"
  ur: "علی بن محمد بن عبد الملک المقناسی ⁦(ابن القطان، مالکی عالم حدیث)⁩"
summary:
  ar: فقيه مالكي من حفاظ الحديث من أهل مكناسة؛ ولي القضاء بسجلماسة، وسمع من أبي عبد الله بن الفخار وأبي عبد الله بن البقال وأبي ذر الخشني وغيرهم، وكتب إليه أبو جعفر بن مضاء وأبو محمد التادلي؛ من تصانيفه النظر في أحكام النظر وبيان الوهم والإيهام الواقعين في كتاب الأحكام ونظم الجمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}
  en: A Maliki jurist and hadith memorizer of Meknes; judge at Sijilmasa; heard from Ibn al-Fakhkhar, Ibn al-Baqqal, Abu Dharr al-Khushani and others; Ibn Mudaa and al-Tadili corresponded with him. Works include al-Nazar fi Ahkam al-Nazar and Bayan al-Wahm wal-Iham. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}
  ur: مکناس کے مالکی فقیہ اور حفاظِ حدیث میں سے؛ سجلماسہ میں قاضی رہے، ابن الفخار، ابن البقال اور ابو ذر الخشنی سے سماع کیا؛ تصانیف میں النظر فی احکام النظر اور بیان الوہم والإیہام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}
  es: "Un jurista Maliki y memorizador de hadices de Meknes; juez en Sijilmasa; escuchó de Ibn al-Fakhkhar, Ibn al-Baqqal, Abu Dharr al-Khushani y otros; Ibn Mudaa y al-Tadili mantuvieron correspondencia con él. Las obras incluyen al-Nazar fi Ahkam al-Nazar y Bayan al-Wahm wal-Iham. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}"
  fr: "Juriste malékite et mémorisateur de hadiths de Meknès; juge à Sijilmasa; entendu d'Ibn al-Fakhkhar, Ibn al-Baqqal, Abu Dharr al-Khushani et d'autres; Ibn Mudaa et al-Tadili correspondaient avec lui. Les œuvres incluent al-Nazar fi Ahkam al-Nazar et Bayan al-Wahm wal-Iham. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}"
  tr: "Meknasa'dan hadis ezberleyen bir Maliki hukukçusudur; Sijilmasa'da yargıç olarak görev yapmıştır. Ebu Abdullah bin el-Fakhar, Ebu Abdullah ibn el-Bakkal, Ebu Dharr el-Haşni ve diğerlerinin yanında eğitim görmüştür. Ebu Ca'fer bin Muda' ve Ebu Muhammed el-Tadli ona yazmıştır; eserleri arasında 'El-Nazar fi Ahkam el-Nazar' ve Hükümler Kitabı'nda 'Bayan al-Wahm wa al-I'mah' (İllüstrasyon ve Aydınlanma) ile Nezm al-Cuman bulunmaktadır. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.7832}"
  id: "Seorang ahli hukum Maliki yang menghafal hadits dari Meknasa; ia pernah menjabat sebagai hakim di Sijilmasa. Ia belajar di bawah bimbingan Abu Abdullah ibn al-Fakhar, Abu Abdullah ibn al-Baqqal, Abu Dharr al-Khashni, dan lainnya. Abu Ja'far ibn Muda' dan Abu Muhammad al-Tadli menulis surat kepadanya; di antara karyanya adalah 'Al-Nazar fi Ahkam al-Nazar' dan 'Bayan al-Wahm wa al-I'mah' (Ilustrasi dan Peneranganan) dalam Kitab Keputusan dan Nazm al-Juman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7832}"
