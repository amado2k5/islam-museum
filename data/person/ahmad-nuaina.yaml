summary:
  ar: "\u0642\u0627\u0631\u0626 \u0642\u0631\u0622\u0646 \u0648\u0637\u0628\u064a\u0628 \u0623\u0637\u0641\u0627\u0644 \u0645\u0635\u0631\u064a \u2066(\u0648\u064f\u0644\u062f 1954)\u2069\u060c \u0642\u0627\u0631\u0626 \u0645\u0639\u062a\u0645\u062f \u0628\u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0648\u0627\u0644\u062a\u0644\u0641\u0632\u064a\u0648\u0646 \u0627\u0644\u0645\u0635\u0631\u064a\u064a\u0646 \u0645\u0646\u0630 1979\u060c \u0639\u064f\u0631\u0641 \u0628\u0640\u00ab\u0627\u0644\u0642\u0627\u0631\u0626 \u0627\u0644\u0637\u0628\u064a\u0628\u00bb \u0648\u0628\u0642\u0631\u0627\u0621\u062a\u0647 \u0641\u064a \u0627\u062d\u062a\u0641\u0627\u0644\u0627\u062a \u0627\u0644\u0631\u0626\u0627\u0633\u0629 \u0645\u0646\u0630 \u0639\u0647\u062f \u0627\u0644\u0633\u0627\u062f\u0627\u062a\u060c \u0648\u0639\u064a\u0651\u0646\u0647 \u0648\u0632\u064a\u0631 \u0627\u0644\u0623\u0648\u0642\u0627\u0641 \u0641\u064a \u0623\u0643\u062a\u0648\u0628\u0631 2025 \u0634\u064a\u062e\u064b\u0627 \u0644\u0639\u0645\u0648\u0645 \u0627\u0644\u0645\u0642\u0627\u0631\u0626 \u0627\u0644\u0645\u0635\u0631\u064a\u0629."
  en: "Egyptian Qur'an reciter and paediatrician (born 1954), an official reciter of Egyptian Radio and Television since 1979, known as 'the physician reciter' and for reciting at presidential ceremonies from Sadat's time on; in October 2025 the Minister of Awqaf appointed him Chief of Egyptian Quran Recitations."
