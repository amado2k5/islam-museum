  ar: "محمد بن مصطفى ابن الحاج حسن، المعروف بحاجي حسن زاده، فقيه حنفي عارف بالتفسير من مستعربي الترك، درس في عدة مدارس ببروسة وإستانبول وولي القضاء في عهد السلطان محمد خان وابنه بايزيد، وتوفي سنة 911 هـ."
  en: "Muhammad ibn Mustafa ibn al-Hajj Hasan, known as Haji Hasan-zade, a Hanafi jurist learned in exegesis and one of the Turks who mastered Arabic; he taught in several madrasas of Bursa and Istanbul, held judgeships under Sultan Mehmed and his son Bayezid, and died in 911 AH (1505)."
