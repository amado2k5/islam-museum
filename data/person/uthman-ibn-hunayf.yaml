summary:
  ar: أنصاري أخو سهل بن حنيف؛ قال الترمذي وحده إنه شهد بدراً وقال الجمهور إن أول مشاهده أحد، بعثه عمر على مساحة الأرض بعد فتح الكوفة، وولاه علي على البصرة فغلبه عليها طلحة والزبير فكانت قصتها المشهورة في وقعة الجمل؛ مات في خلافة معاوية.
  en: An Ansari, brother of Sahl ibn Hunayf; al-Tirmidhi alone said he fought at Badr, while the majority say his first campaign was Uhud; Umar sent him to survey the land after Kufa was conquered, and Ali appointed him over Basra but Talha and
    al-Zubayr took it from him, the well-known episode behind the battle of the Camel; he died in Mu'awiya's caliphate.
  ur: "انصاری، سہل بن حنیف کا بھائی؛ ترمذی نے اکیلے کہا کہ وہ بدر میں لڑا، جبکہ اکثر کہتے ہیں اس کی پہلی مہم احد تھی؛ عمر نے اسے ایک مہم پر بھیجا۔"
  es: "An Ansari, hermano de Sahl ibn Hunayf; al-Tirmidhi afirma que fue el único que luchó en Badr, mientras que la mayoría dice que su primera campaña fue en Uhud; Umar lo envió a explorar el territorio tras la conquista de Kufa, y Ali lo nombró al mando de Basora, pero Talha y al-Zubayr se la arrebataron, en el conocido episodio que dio origen a la batalla del Camello; murió durante el califato de Mu'awiya."
  fr: "An-Ansari, frère de Sahl ibn Hunayf; al-Tirmidhi est le seul à dire qu'il a combattu à Badr, tandis que la majorité affirme que sa première campagne fut à Uhud; Umar l'envoya explorer la région après la conquête de Kufa, et Ali le nomma à la tête de Bassora, mais Talha et al-Zubayr lui en prirent le pouvoir, épisode bien connu à l'origine de la bataille du Chameau; il mourut sous le califat de Mu'awiya."
  tr: "Sahl ibn Hunayf'in kardeşi Ansari; sadece El-Tirmidi Badr'a tanık olduğunu söyledi ve çoğunluk onun ilk gördüğünü Uhud olarak gördü. Ömer onu Kufe'nin fethinden sonra ülke boyunca gönderdi ve Ali onu Basra'nın başına atadı; burada Talha ve El-Zubeyr üstün geldi. Ünlü hikayesi Deve Savaşı'dır; Muaviye halifeliği sırasında öldü."
  id: "Ansari, saudara Sahl ibn Hunayf; hanya Al-Tirmidhi yang mengatakan ia menyaksikan Badr, dan mayoritas mengatakan penampakan pertamanya adalah Uhud. Umar mengirimnya melintasi negeri setelah penaklukan Kufa, dan Ali mengangkatnya sebagai pemimpin Basra, di mana Talha dan Al-Zubayr menang. Kisah terkenalnya adalah Pertempuran Unta; ia meninggal saat kekhalifahan Muawiyah."
