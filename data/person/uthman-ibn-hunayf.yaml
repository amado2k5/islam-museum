summary:
  ar: أنصاري أخو سهل بن حنيف؛ قال الترمذي وحده إنه شهد بدراً وقال الجمهور إن أول مشاهده أحد، بعثه عمر على مساحة الأرض بعد فتح الكوفة، وولاه علي على البصرة فغلبه عليها طلحة والزبير فكانت قصتها المشهورة في وقعة الجمل؛ مات في خلافة معاوية.
  en: An Ansari, brother of Sahl ibn Hunayf; al-Tirmidhi alone said he fought at Badr, while the majority say his first campaign was Uhud; Umar sent him to survey the land after Kufa was conquered, and Ali appointed him over Basra but Talha and
    al-Zubayr took it from him, the well-known episode behind the battle of the Camel; he died in Mu'awiya's caliphate.
