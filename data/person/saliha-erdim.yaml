summary:
  ar: "مستشارة أسرية وكاتبة تركية، وُلدت في خاوزه بولاية صامسون سنة 1956، درست العلوم السلوكية في جامعة نيوبورت الدولية ونالت فيها الماجستير، وأتمّت سنة 2012 تدريب العلاجات المعرفية والسلوكية، وشاركت في تأسيس شركة «يريوزو» للتعليم والاستشارات، وقدّمت برامج إذاعية في تربية الأسرة منذ سنة 1997، وكتبت كتباً واسعة الانتشار في الزواج وتربية الأبناء، ويتابعها على إنستغرام نحو 1.4 مليون شخص."
  en: "Turkish family counsellor and author, born in Havza, Samsun, in 1956. She studied behavioural sciences at International Newport University, taking her master's in the same field, completed cognitive and behavioural therapy training in 2012, co-founded the Yeryüzü Eğitim Danışmanlık consultancy, has presented family-education radio programmes since 1997, and has written widely read books on marriage and parenting; about 1.4 million people follow her on Instagram."
  ur: "ترک خاندانی مشیر اور مصنفہ، جو 1956ء میں صامسون کے علاقے خاوزه میں پیدا ہوئیں۔ انہوں نے انٹرنیشنل نیوپورٹ یونیورسٹی سے رفتاری علوم میں تعلیم اور اسی شعبے میں ماسٹرز کیا، 2012ء میں ادراکی و رفتاری علاج کی تربیت مکمل کی، «یریوزو» تعلیم و مشاورت کمپنی کی شریک بانی بنیں، 1997ء سے خاندانی تعلیم کے ریڈیو پروگرام پیش کر رہی ہیں، اور شادی و بچوں کی تربیت پر وسیع پیمانے پر پڑھی جانے والی کتابیں لکھیں؛ انسٹاگرام پر ان کے تقریباً 14 لاکھ پیروکار ہیں۔"
