summary:
  ar: "مستشارة أسرية وكاتبة تركية، وُلدت في خاوزه بولاية صامسون سنة 1956، درست العلوم السلوكية في جامعة نيوبورت الدولية ونالت فيها الماجستير، وأتمّت سنة 2012 تدريب العلاجات المعرفية والسلوكية، وشاركت في تأسيس شركة «يريوزو» للتعليم والاستشارات، وقدّمت برامج إذاعية في تربية الأسرة منذ سنة 1997، وكتبت كتباً واسعة الانتشار في الزواج وتربية الأبناء، ويتابعها على إنستغرام نحو 1.4 مليون شخص."
  en: "Turkish family counsellor and author, born in Havza, Samsun, in 1956. She studied behavioural sciences at International Newport University, taking her master's in the same field, completed cognitive and behavioural therapy training in 2012, co-founded the Yeryüzü Eğitim Danışmanlık consultancy, has presented family-education radio programmes since 1997, and has written widely read books on marriage and parenting; about 1.4 million people follow her on Instagram."
  ur: "ترک خاندانی مشیر اور مصنفہ، جو 1956ء میں صامسون کے علاقے خاوزه میں پیدا ہوئیں۔ انہوں نے انٹرنیشنل نیوپورٹ یونیورسٹی سے رفتاری علوم میں تعلیم اور اسی شعبے میں ماسٹرز کیا، 2012ء میں ادراکی و رفتاری علاج کی تربیت مکمل کی، «یریوزو» تعلیم و مشاورت کمپنی کی شریک بانی بنیں، 1997ء سے خاندانی تعلیم کے ریڈیو پروگرام پیش کر رہی ہیں، اور شادی و بچوں کی تربیت پر وسیع پیمانے پر پڑھی جانے والی کتابیں لکھیں؛ انسٹاگرام پر ان کے تقریباً 14 لاکھ پیروکار ہیں۔"
  es: "Consejera familiar y autora turca, nacida en Havza, Samsun, en 1956. Estudió ciencias del comportamiento en la Universidad Internacional de Newport, donde obtuvo su maestría en la misma disciplina. Completó su formación en terapia cognitivo-conductual en 2012, cofundó la consultora Yeryüzü Eğitim Danışmanlık, presenta programas de radio sobre educación familiar desde 1997 y ha escrito libros muy leídos sobre matrimonio y crianza de los hijos; cuenta con aproximadamente 1,4 millones de seguidores en Instagram."
  fr: "Conseillère familiale et auteure turque, née à Havza, Samsun, en 1956. Elle a étudié les sciences du comportement à l'Université internationale de Newport, où elle a obtenu une maîtrise, a suivi une formation en thérapie cognitivo-comportementale en 2012, a cofondé le cabinet de conseil Yeryüzü Eğitim Danışmanlık, anime des émissions de radio sur l'éducation familiale depuis 1997 et a écrit des ouvrages sur le mariage et la parentalité qui ont rencontré un vif succès; environ 1,4 million de personnes la suivent sur Instagram."
  tr: "Aile danışmanı ve Türk yazar olan Såmsun, 1956 yılında Samsun Eyaleti, Khavze'de doğmuş, Newport Uluslararası Üniversitesi'nde davranış bilimleri okudu ve yüksek lisans derecesi aldı. 2012 yılında bilişsel ve davranışsal terapi eğitimini tamamladı. Eğitim ve danışmanlık şirketi 'Yerozu'nun kurucu ortaklarından oldu, 1997'den beri aile yetiştirme üzerine radyo programları sunmakta ve evlilik ile çocuk yetiştirme üzerine geniş çapta dolaşan kitaplar yazmıştır. Instagram'da yaklaşık 1,4 milyon kişi tarafından takip edilmektedir."
  id: "Seorang konselor keluarga dan penulis Turki, lahir di Khavze, Provinsi Samsun, pada tahun 1956, ia belajar ilmu perilaku di Newport International University dan meraih gelar master. Pada tahun 2012, ia menyelesaikan pelatihan terapi kognitif dan perilaku. Ia ikut mendirikan perusahaan pendidikan dan konsultasi 'Yerozu,' telah menjadi pembawa acara radio tentang pengasuhan keluarga sejak 1997, dan telah menulis buku yang banyak beredar tentang pernikahan dan pengasuhan anak. Ia diikuti oleh sekitar 1,4 juta orang di Instagram."
