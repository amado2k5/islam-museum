summary:
  ar: "الأمير الأرتقي صاحب ماردين؛ وليها بعد أخيه سقمان وكانا من أمراء تتش صاحب الشام، واستولى أيلغازي على حلب بعد موت أولاد تتش واستولى على ميافارقين، وكان فارساً شجاعاً كثير الغزو كثير العطاء؛ توفي سنة ست عشرة وخمسمائة وولي بعده بماردين ابنه حسام الدين تمرتاش {cite:shadharat-dhahab p. 528}."
  en: "The Artuqid amir Najm al-Din Ilghazi, lord of Mardin after his brother Sukman — both former amirs of Tutush; he took Aleppo after Tutush's sons died and Mayyafariqin too, a brave and generous campaigner; d. 516, succeeded in Mardin by his son Husam al-Din Timurtash {cite:shadharat-dhahab p. 528}."
