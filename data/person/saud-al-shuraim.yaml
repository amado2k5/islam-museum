summary:
  ar: "قارئ وعالم سعودي، إمام وخطيب المسجد الحرام من 1991 حتى اعتزاله سنة 2022. وُلد بالرياض سنة 1966، وحفظ القرآن في شبابه، ونال الماجستير في الفقه المقارن من المعهد العالي للقضاء والدكتوراه من جامعة أم القرى، وعمل قاضيا بالمحكمة الشرعية الكبرى بمكة وأستاذا وعميدا بكليات الشريعة والدراسات القضائية بجامعة أم القرى، وله نحو خمسة عشر مؤلفا."
  en: "Saudi reciter and scholar, imam and khatib of the Grand Mosque from 1991 until his retirement in 2022. Born at Riyadh in 1966, he memorised the Qur'an in his youth, took a master's in comparative jurisprudence at the Higher Judicial Institute and a doctorate at Umm al-Qura University, served as a judge of the Grand Sharia Court in Mecca and as professor and dean at Umm al-Qura, and wrote some fifteen works."
  ur: "سعودی قارئ اور عالم، 1991 سے 2022 میں ریٹائرمنٹ تک مسجد حرام کے امام و خطیب رہے۔ 1966 میں ریاض میں پیدا ہوئے، جوانی میں قرآن حفظ کیا، انسیٹی ٹیوٹ آف جوڈیشری سے فقہ مقارن میں ماسٹرز اور جامعہ ام القریٰ سے ڈاکٹریٹ حاصل کی، مکہ کی بڑی شرعی عدالت کے جج اور ام القریٰ میں استاد و ڈین رہے، اور تقریباً پندرہ کتابیں لکھیں۔"
