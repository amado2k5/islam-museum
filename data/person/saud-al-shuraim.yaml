summary:
  ar: "قارئ وعالم سعودي، إمام وخطيب المسجد الحرام من 1991 حتى اعتزاله سنة 2022. وُلد بالرياض سنة 1966، وحفظ القرآن في شبابه، ونال الماجستير في الفقه المقارن من المعهد العالي للقضاء والدكتوراه من جامعة أم القرى، وعمل قاضيا بالمحكمة الشرعية الكبرى بمكة وأستاذا وعميدا بكليات الشريعة والدراسات القضائية بجامعة أم القرى، وله نحو خمسة عشر مؤلفا."
  en: "Saudi reciter and scholar, imam and khatib of the Grand Mosque from 1991 until his retirement in 2022. Born at Riyadh in 1966, he memorised the Qur'an in his youth, took a master's in comparative jurisprudence at the Higher Judicial Institute and a doctorate at Umm al-Qura University, served as a judge of the Grand Sharia Court in Mecca and as professor and dean at Umm al-Qura, and wrote some fifteen works."
  ur: "سعودی قارئ اور عالم، 1991 سے 2022 میں ریٹائرمنٹ تک مسجد حرام کے امام و خطیب رہے۔ 1966 میں ریاض میں پیدا ہوئے، جوانی میں قرآن حفظ کیا، انسیٹی ٹیوٹ آف جوڈیشری سے فقہ مقارن میں ماسٹرز اور جامعہ ام القریٰ سے ڈاکٹریٹ حاصل کی، مکہ کی بڑی شرعی عدالت کے جج اور ام القریٰ میں استاد و ڈین رہے، اور تقریباً پندرہ کتابیں لکھیں۔"
  es: "Recitador y erudito saudí, imán y predicador de la Gran Mezquita desde 1991 hasta su jubilación en 2022. Nacido en Riad en 1966, memorizó el Corán en su juventud, obtuvo una maestría en jurisprudencia comparada en el Instituto Judicial Superior y un doctorado en la Universidad Umm al-Qura, se desempeñó como juez del Gran Tribunal de la Sharia en La Meca y como profesor y decano en Umm al-Qura, y escribió unas quince obras."
  fr: "Récitation et érudit saoudien, imam et khatib de la Grande Mosquée de 1991 jusqu'à sa retraite en 2022. Né à Riyad en 1966, il a mémorisé le Coran dans sa jeunesse, obtenu une maîtrise en jurisprudence comparée à l'Institut supérieur de la magistrature et un doctorat à l'Université Umm al-Qura, a été juge du Grand Tribunal de la charia à La Mecque et professeur et doyen à Umm al-Qura, et a écrit une quinzaine d'ouvrages."
  tr: "Suudi bir şahmetçi ve alim, 1991'den 2022'de emekli olana kadar Büyük Camii imamı ve vaizi olmuştur. 1966'da Riyad'da doğmuş, gençliğinde Kur'an'ı ezberlemiş, Yüksek Yargı Enstitüsü'nden karşılaştırmalı fıkıh alanında yüksek lisans ve Um Al-Kura Üniversitesi'nden doktora derecesi almış, Mekke'deki Büyük Şeriat Mahkemesi'nde yargıç olarak çalışmış ve Um Al-Qura Üniversitesi Şeriat ve Yargı Fakülteleri'nde profesör ve dekan olarak görev yapmıştır. Yaklaşık on beş eser yazmıştır."
  id: "Seorang pembaca dan cendekiawan Saudi, Imam dan pengkhotbah Masjid Agung dari tahun 1991 hingga pensiun pada tahun 2022. Ia lahir di Riyadh pada tahun 1966, menghafal Al-Qur'an di masa mudanya, meraih gelar magister dalam bidang hukum komparatif dari Institut Tinggi Kehakiman dan gelar doktor dari Universitas um Al-Qura, bekerja sebagai hakim di Pengadilan Syariah Agung di Mekah, serta sebagai profesor dan dekan di Perguruan Tinggi Syariah dan Studi Yudisial di Universitas um Al-Qura. Ia menulis sekitar lima belas karya."
