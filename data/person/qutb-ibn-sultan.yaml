summary:
  ar: "قطب الدين أبو عبد الله محمد بن سلطان الدمشقي الصالحي الحنفي، شيخ الإسلام مفتي بلاد الشام؛ ولد ليلة ثاني عشر ربيع الأول سنة سبعين وثمانمائة وأخذ عن القاضي عبد البر بن الشحنة وغيره، وولي تدريس القصاعية المختصة بالحنفية وتدريس الظاهرية التي هي مسكنه والنظر عليها وله تدريس في الجامع الأموي وغير ذلك من المناصب العلية، وولي القضاء بمصر في زمن الغوري نيابة عن شيخه ابن الشحنة؛ وكفّ بصره من بعد مع بقاء جمال عينيه بحيث يظن أنهما بصيرتان، وكان حسن الوجه والذات جليل المقدار مهيباً معظماً نافذ الكلمة عند الدولة يردون الأمراء إليه في الفتوى ماسك زمام الفقهاء، وكان يملي من يكتب الجواب على الأسئلة التي ترفع إليه واتخذ خاتماً منقوشاً يختم به على الفتوى خوفاً من التلبيس عليه، وكان يقول بتحريم القهوة وصنّف مؤلفاً في الفقه ورسالة في تحريم الأفيون والبرق اللامع في المنع من البركة في الجامع؛ توفي ليلة الثلاثاء سابع عشر ذي القعدة ودُفن داخل تربة القلندرية من باب الصغير {cite:shadharat-dhahab p. 699-700}."
  en: "Shaykh al-Islam, mufti of Syria — b. eve of 12 Rabi' I 870; Egypt's qadi under al-Ghuri as Ibn al-Shihna's deputy, then blind with eyes still seeming to see; 'nafidh al-kalima' with the state, seal-engraver of his own fatwas against forgery, author of the coffee-prohibition tract, an anti-opium risala, and al-Barq al-Lami' against mosque dancing; died Tuesday eve 17 Dhu'l-Qa'da [950], buried in the Qalandariyya turba {cite:shadharat-dhahab p. 699-700}."
  es: "Shaykh al-Islam, mufti de Siria - n. víspera del 12 Rabi' I 870; el cadí de Egipto bajo el mando de al-Ghuri como lugarteniente de Ibn al-Shihna, entonces ciego y con ojos que todavía parecían ver; 'nafidh al-kalima' con el Estado, grabador de sus propios fatwas contra la falsificación, autor del tratado sobre la prohibición del café, un risala contra el opio, y al-Barq al-Lami' contra los bailes de las mezquitas; murió la víspera del martes 17 Dhu'l-Qa'da [950], enterrado en Qalandariyya turba {cita:shadharat-dhahab p. 699-700}."
  fr: "Cheikh al-Islam, mufti de Syrie — b. veille du 12 Rabi' I 870; le cadi égyptien sous al-Ghuri en tant qu'adjoint d'Ibn al-Shihna, alors aveugle avec des yeux semblant encore voir; « Nafidh al-kalima » avec l'État, graveur de sceaux de ses propres fatwas contre la contrefaçon, auteur du tract interdisant le café, d'une risala anti-opium et al-Barq al-Lami » contre la danse dans les mosquées; décédé mardi soir 17 Dhu'l-Qa'da [950], enterré dans la turba de Qalandariyya {cite:shadharat-dhahab p. 699-700}."
  ur: "شیخ الاسلام، شام کے مفتی - بی۔ 12 ربیع الاول 870 کی شام؛ مصر کا قادی الثوری کے ماتحت ابن الشہنہ کے نائب کے طور پر، پھر آنکھوں سے اندھا، ابھی تک نظر آتا ہے۔ ریاست کے ساتھ 'نفید الکلیمہ'، جعل سازی کے خلاف اپنے فتووں پر مہر ثبت کرنے والا، کافی کی ممانعت کا مصنف، افیون مخالف رسالہ، اور البرق اللامی' مسجد میں رقص کے خلاف؛ منگل کی شام 17 ذوالقعدہ [950] کو وفات پائی، قلندریہ تربہ میں دفن ہوئے۔ 699-700}۔"
  tr: "Kutsubdin Ebu Abdullah Muhammed bin Sultan el-Dimashqi el-Salihi el-Hanafi, Şeyh el-İslam ve Levant müftüsü; 870 Hicri yılında Rabi'l-Avwel'in on ikinci gecesinde doğdu, yargıç Abdülbarr bin Şahnah ve diğerlerinin yanında eğitim aldı. Hanefi okulu olan el-Kassa'iya'da, Zahiriya okulunda öğretmenlik yapmak üzere atandı ve onu denetledi. Ayrıca Emevi Camii'nde ders verdi ve diğer yüksek görevlerde bulundu. El-Ghuuri'nin döneminde öğretmeni İbn al-Shahna adına Mısır'da yargıç olarak görev yaptı; daha sonra gözlerinin güzelliğini koruyarak görme yetkisini kaybetti, öyle ki Kendisinin anlayışlı, iyi bir yüzü ve saygın bir yapısı olduğu, onurlu ve devlette etkili olduğu düşünülür. Prensler onu fetvalar için yönlendirir, hukukçuların dizginlerini tutardı. Kendisine yöneltilen sorulara kimin cevap vereceğini dikte eder ve yanılmaktan korktuğu için fetvanı mühürlemek için oyma bir mühür kullanırdı. Kahve yasağına ilan etti ve fıkıh üzerine bir eser, afyon yasağı üzerine bir risale ve camide kutsama yasağı üzerine 'Al-Barq al-Balami' yazdı. Zul al-Qi'dah'ın on yedinci Salı gecesi öldü ve Bab al-Saghir'deki Qalandariyya mezarına defnedildi {cite:shadharat-dhahab, s. 699-700}."
  id: "Qutb al-Din Abu Abdullah Muhammad ibn Sultan al-Dimashqi al-Salihi al-Hanafi, Sheikh al-Islam dan Mufti Levant; lahir pada malam tanggal dua belas Rabi' al-Awwal tahun 870 H, ia belajar di bawah Hakim Abd al-Barr ibn al-Shahnah dan lainnya. Ia ditunjuk untuk mengajar aliran Hanafi al-Qassa'iya, sekolah Zahiriya yang menjadi tempat tinggalnya, dan mengawasinya. Ia juga mengajar di Masjid Umayyah dan memegang jabatan tinggi lainnya. Ia pernah menjadi hakim di Mesir pada masa al-Ghuuri atas nama gurunya Ibn al-Shahna; kemudian ia kehilangan penglihatannya sambil tetap menjaga keindahan matanya, sehingga Ia diyakini memiliki wawasan yang cerdas, memiliki wajah yang baik dan postur yang bermartabat, bermartabat, dan berpengaruh di negara bagian. Para pangeran akan merujuknya untuk fatwa, memegang kendali sebagai ahli hukum. Ia mendikte siapa yang menulis jawaban atas pertanyaan yang diajukan kepadanya, dan menggunakan segel berukir untuk menyegel fatwa karena takut disesatkan. Ia menyatakan larangan kopi dan menulis sebuah karya tentang hukum, sebuah risalah tentang larangan opium, serta 'Al-Barq al-Balami' tentang larangan berkat di masjid. Ia meninggal pada malam Selasa, tanggal tujuh belas Dhu al-Qi'dah, dan dimakamkan di dalam makam Qalandariyya di Bab al-Saghir {cite:shadharat-dhahab, hlm. 699-700}."
