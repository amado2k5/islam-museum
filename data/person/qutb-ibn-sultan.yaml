summary:
  ar: "قطب الدين أبو عبد الله محمد بن سلطان الدمشقي الصالحي الحنفي، شيخ الإسلام مفتي بلاد الشام؛ ولد ليلة ثاني عشر ربيع الأول سنة سبعين وثمانمائة وأخذ عن القاضي عبد البر بن الشحنة وغيره، وولي تدريس القصاعية المختصة بالحنفية وتدريس الظاهرية التي هي مسكنه والنظر عليها وله تدريس في الجامع الأموي وغير ذلك من المناصب العلية، وولي القضاء بمصر في زمن الغوري نيابة عن شيخه ابن الشحنة؛ وكفّ بصره من بعد مع بقاء جمال عينيه بحيث يظن أنهما بصيرتان، وكان حسن الوجه والذات جليل المقدار مهيباً معظماً نافذ الكلمة عند الدولة يردون الأمراء إليه في الفتوى ماسك زمام الفقهاء، وكان يملي من يكتب الجواب على الأسئلة التي ترفع إليه واتخذ خاتماً منقوشاً يختم به على الفتوى خوفاً من التلبيس عليه، وكان يقول بتحريم القهوة وصنّف مؤلفاً في الفقه ورسالة في تحريم الأفيون والبرق اللامع في المنع من البركة في الجامع؛ توفي ليلة الثلاثاء سابع عشر ذي القعدة ودُفن داخل تربة القلندرية من باب الصغير {cite:shadharat-dhahab p. 699-700}."
  en: "Shaykh al-Islam, mufti of Syria — b. eve of 12 Rabi' I 870; Egypt's qadi under al-Ghuri as Ibn al-Shihna's deputy, then blind with eyes still seeming to see; 'nafidh al-kalima' with the state, seal-engraver of his own fatwas against forgery, author of the coffee-prohibition tract, an anti-opium risala, and al-Barq al-Lami' against mosque dancing; died Tuesday eve 17 Dhu'l-Qa'da [950], buried in the Qalandariyya turba {cite:shadharat-dhahab p. 699-700}."
