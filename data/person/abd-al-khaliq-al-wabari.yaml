summary:
  ar: "عبد الخالق بن عبد الحميد بن عبد الله، أبو الفضل، الوبري الخوارزمي الضرير. فقيه حنفي وأصولي وأديب، وكان من رؤساء أصحاب أبي حنيفة وأئمتهم، وإليه الفتوى والتدريس بخوارزم، وحافظا للفقه والأشعار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  en: "Abd al-Khaliq ibn Abd al-Hamid ibn Abd Allah, Abu al-Fadl, al-Wabari al-Khwarazmi, a blind Hanafi jurist, legal theorist and man of letters. Ibn al-Shi'ar, quoted in the book, describes him as one of the leaders and imams of the companions of Abu Hanifa, responsible for fatwas and teaching in Khwarazm. Dates are not given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
