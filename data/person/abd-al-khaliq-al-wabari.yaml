id: person/abd-al-khaliq-al-wabari
class: person
label: { ar: "عبد الخالق الوبري", en: "Abd al-Khaliq al-Wabari", fr: "Abd al-Khaliq al-Wabari", es: "Abd al-Khaliq al-Wabari", ur: "عبد الخالق الوباری" }
summary:
  ar: "عبد الخالق بن عبد الحميد بن عبد الله، أبو الفضل، الوبري الخوارزمي الضرير. فقيه حنفي وأصولي وأديب، وكان من رؤساء أصحاب أبي حنيفة وأئمتهم، وإليه الفتوى والتدريس بخوارزم، وحافظا للفقه والأشعار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  en: "Abd al-Khaliq ibn Abd al-Hamid ibn Abd Allah, Abu al-Fadl, al-Wabari al-Khwarazmi, a blind Hanafi jurist, legal theorist and man of letters. Ibn al-Shi'ar, quoted in the book, describes him as one of the leaders and imams of the companions of Abu Hanifa, responsible for fatwas and teaching in Khwarazm. Dates are not given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  fr: "Abd al-Khaliq ibn Abd al-Hamid ibn Abd Allah, Abu al-Fadl, al-Wabari al-Khwarazmi, juriste hanafite aveugle, théoricien du droit et lettré. Ibn al-Shi'ar, cité dans le livre, le décrit comme l'un des chefs et imams des compagnons d'Abu Hanifa, chargé des fatwas et de l'enseignement au Khwarezm. Aucune date n'est donnée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  es: "Abd al-Khaliq ibn Abd al-Hamid ibn Abd Allah, Abu al-Fadl, al-Wabari al-Khwarazmi, jurista hanafí ciego, teórico jurídico y hombre de letras. Ibn al-Shi'ar, citado en el libro, lo describe como uno de los líderes e imanes de los compañeros de Abu Hanifa, responsable de las fatuas y la enseñanza en Khwarazm. No se proporcionan fechas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  ur: "عبد الخالق بن عبد الحمید ابن عبد اللہ، ابو الفضل، الوباری الخوارزمی، ایک نابینا حنفی فقیہ، قانونی نظریہ دان اور خطوط کا آدمی۔ ابن الشعر، جس کا کتاب میں حوالہ دیا گیا ہے، انہیں ابو حنیفہ کے اصحاب کے پیشوا اور اماموں میں سے ایک کے طور پر بیان کیا ہے، جو خوارزم میں فتوے اور تدریس کے ذمہ دار تھے۔ تاریخیں نہیں دی گئیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7165}"
