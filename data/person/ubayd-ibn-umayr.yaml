summary:
  ar: "عبيد بن عمير الليثي، من التابعين، يفرد له أحمد بن حنبل في كتاب الزهد باباً فيه مواعظه، ومنها دعوته أهل القرآن في الشتاء إلى قيام الليل الطويل وصيام النهار القصير، والإكثار من التسبيح لمن عجز عن السهر والإنفاق والقتال {cite:zuhd-ahmad-dkim-1983 p. 458}."
  en: "Ubayd ibn Umayr al-Laythi, of the Successors' generation, to whom Ahmad ibn Hanbal gives a chapter of Kitab al-Zuhd with his admonitions, among them his call to the people of the Qur'an in winter to use the long night for prayer and the short day for fasting, and to multiply glorification of God if unable to keep vigil, spend or fight {cite:zuhd-ahmad-dkim-1983 p. 458}."
  ur: "عبید بن عمیر لیثی، تابعین میں سے، جن کے لیے احمد بن حنبل کتاب الزہد میں ایک باب لاتے ہیں جس میں ان کی نصیحتیں ہیں، ان میں سردیوں میں اہلِ قرآن کو لمبی رات قیام اور چھوٹے دن روزے میں گزارنے کی دعوت، اور جو شب بیداری، خرچ اور جہاد سے عاجز ہو اس کے لیے کثرتِ تسبیح {cite:zuhd-ahmad-dkim-1983 p. 458}۔"
  es: "Ubayd ibn Umayr al-Laythi, de la generación de los Sucesores, a quien Ahmad ibn Hanbal dedica un capítulo del Kitab al-Zuhd con sus exhortaciones, entre ellas su llamado a la gente del Corán en invierno para que utilicen la larga noche para la oración y el corto día para el ayuno, y para que multipliquen la glorificación de Dios si no pueden mantener la vigilia, gastar o luchar {cite:zuhd-ahmad-dkim-1983 p. 458}."
  fr: "Ubayd ibn Umayr al-Laythi, de la génération des Successeurs, à qui Ahmad ibn Hanbal consacre un chapitre du Kitab al-Zuhd contenant ses admonitions, parmi lesquelles son appel aux gens du Coran en hiver à utiliser la longue nuit pour la prière et le court jour pour le jeûne, et à multiplier la glorification de Dieu s'ils sont incapables de veiller, de dépenser ou de combattre {cite:zuhd-ahmad-dkim-1983 p. 458}."
  tr: "Tabiylerden Ubeyd ibn Umair al-Laythi, Ahmed bin Hanbal tarafından Asketizm Kitabı'nda ona ithaf edilmiştir; bu bölümde kışın Kur'an halkına uzun gece ayağa kalkıp kısa gün oruç tutmaları ve geç saatlere kadar uyanık kalamayan, harcayamayanlar ve savaşamayanlar için yüceltilmesi çağrısı yer alır {cite:zuhd-ahmad-dkim-1983, s. 458}."
  id: "Ubayd ibn Umair al-Laythi, salah satu Tabi'in, didedikasikan kepadanya oleh Ahmad ibn Hanbal dalam Kitab Asketisme, sebuah bab yang memuat nasihatnya, termasuk seruannya kepada umat Al-Qur'an di musim dingin untuk berdiri di malam yang panjang dan berpuasa di hari yang singkat, serta meningkatkan pemuliaan bagi mereka yang tidak mampu begadang larut, menghabiskan waktu, dan berjuang {cite:zuhd-ahmad-dkim-1983, hlm. 458}."
