summary:
  ar: "عبيد بن عمير بن قتادة الليثي الجندعي المكي، الواعظ المفسر، ولد في حياة الرسول، وحدث عن أبيه وعمر وعلي وأبي ذر وعائشة وابن عباس، وعنه ابنه عبد الله وعطاء بن أبي رباح وعمرو بن دينار، من ثقات التابعين وأئمتهم بمكة، قال ابن معين وأبو زرعة إنه ثقة. (؟-٧٤ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13362}"
  en: "Ubayd ibn Umayr ibn Qatada al-Laythi al-Jundai al-Makki, a preacher and exegete born in the Prophet's lifetime. He narrated from his father, Umar, Ali, Abu Dharr, Aisha and Ibn Abbas; his son Abd Allah, Ata ibn Abi Rabah and Amr ibn Dinar narrated from him. He was among the reliable Successors and leaders of Mecca; Ibn Ma'in and Abu Zur'a called him reliable. Death 74 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13362}"
