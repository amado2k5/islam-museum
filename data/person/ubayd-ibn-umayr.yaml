summary:
  ar: "عبيد بن عمير الليثي، من التابعين، يفرد له أحمد بن حنبل في كتاب الزهد باباً فيه مواعظه، ومنها دعوته أهل القرآن في الشتاء إلى قيام الليل الطويل وصيام النهار القصير، والإكثار من التسبيح لمن عجز عن السهر والإنفاق والقتال {cite:zuhd-ahmad-dkim-1983 p. 458}."
  en: "Ubayd ibn Umayr al-Laythi, of the Successors' generation, to whom Ahmad ibn Hanbal gives a chapter of Kitab al-Zuhd with his admonitions, among them his call to the people of the Qur'an in winter to use the long night for prayer and the short day for fasting, and to multiply glorification of God if unable to keep vigil, spend or fight {cite:zuhd-ahmad-dkim-1983 p. 458}."
  ur: "عبید بن عمیر لیثی، تابعین میں سے، جن کے لیے احمد بن حنبل کتاب الزہد میں ایک باب لاتے ہیں جس میں ان کی نصیحتیں ہیں، ان میں سردیوں میں اہلِ قرآن کو لمبی رات قیام اور چھوٹے دن روزے میں گزارنے کی دعوت، اور جو شب بیداری، خرچ اور جہاد سے عاجز ہو اس کے لیے کثرتِ تسبیح {cite:zuhd-ahmad-dkim-1983 p. 458}۔"
