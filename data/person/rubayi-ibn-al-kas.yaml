summary:
  ar: "ربعي بن الكاس العنبري؛ أمر علي ابن عباس أن يوليه سجستان فوجهه في أربعة آلاف ومعه الحصين بن أبي الحر ونايل بن ذي الحرة على المقدمة فقاتلهم حسكة بن عتاب فقتلوه وضبط البلاد وقال راجزهم تمن الذين اقتحموا سجستان يقدمنا الماجد عبد الرحمن على ابن عتاب وجند الشيطان أن لا نوالي شيعة ابن عفان إنا وجدنا في منير الفرقان."
  en: "Rubay'i ibn al-Kas al-Anbari; sent by Ali through Ibn Abbas with four thousand to Sijistan — al-Husayn ibn Abi al-Hurr and Na'il ibn Dhi al-Hurra on the van — killed Hasaka and held the country, their rajaz vowing not to befriend 'the party of Ibn Affan, for we found in the Book of the Furqan'."
