label: { ar: "ربعي بن الكاس العنبري", en: "Rubay'i ibn al-Kas al-Anbari", es: "Rubay'i ibn al-Kas al-Anbari", fr: "Rubay'i ibn al-Kas al-Anbari" }
summary:
  ar: "ربعي بن الكاس العنبري؛ أمر علي ابن عباس أن يوليه سجستان فوجهه في أربعة آلاف ومعه الحصين بن أبي الحر ونايل بن ذي الحرة على المقدمة فقاتلهم حسكة بن عتاب فقتلوه وضبط البلاد وقال راجزهم تمن الذين اقتحموا سجستان يقدمنا الماجد عبد الرحمن على ابن عتاب وجند الشيطان أن لا نوالي شيعة ابن عفان إنا وجدنا في منير الفرقان."
  en: "Rubay'i ibn al-Kas al-Anbari; sent by Ali through Ibn Abbas with four thousand to Sijistan — al-Husayn ibn Abi al-Hurr and Na'il ibn Dhi al-Hurra on the van — killed Hasaka and held the country, their rajaz vowing not to befriend 'the party of Ibn Affan, for we found in the Book of the Furqan'."
  es: "Rubay'i ibn al-Kas al-Anbari, enviado por Ali a través de Ibn Abbas con cuatro mil hombres a Sijistan —al-Husayn ibn Abi al-Hurr y Na'il ibn Dhi al-Hurra en la vanguardia—, mató a Hasaka y se apoderó del país, y su rajaz juró no hacerse amigo del \"partido de Ibn Affan, porque encontramos en el Libro del Furqan\"."
  fr: "Rubay'i ibn al-Kas al-Anbari; envoyé par Ali par l'intermédiaire d'Ibn Abbas avec quatre mille hommes au Sijistan — al-Husayn ibn Abi al-Hurr et Na'il ibn Dhi al-Hurra à l'avant-garde — tua Hasaka et prit le contrôle du pays, leur rajaz jurant de ne pas se lier d'amitié avec « le parti d'Ibn Affan, car nous avons trouvé dans le Livre du Furqan »."
