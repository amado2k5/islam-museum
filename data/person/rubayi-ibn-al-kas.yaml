class: person
label: { ar: "ربعي بن الكاس العنبري", en: "Rubay'i ibn al-Kas al-Anbari", es: "Rubay'i ibn al-Kas al-Anbari", fr: "Rubay'i ibn al-Kas al-Anbari", ur: "ربیع ابن الکاس الانباری۔" }
summary:
  ar: "ربعي بن الكاس العنبري؛ أمر علي ابن عباس أن يوليه سجستان فوجهه في أربعة آلاف ومعه الحصين بن أبي الحر ونايل بن ذي الحرة على المقدمة فقاتلهم حسكة بن عتاب فقتلوه وضبط البلاد وقال راجزهم تمن الذين اقتحموا سجستان يقدمنا الماجد عبد الرحمن على ابن عتاب وجند الشيطان أن لا نوالي شيعة ابن عفان إنا وجدنا في منير الفرقان."
  en: "Rubay'i ibn al-Kas al-Anbari; sent by Ali through Ibn Abbas with four thousand to Sijistan — al-Husayn ibn Abi al-Hurr and Na'il ibn Dhi al-Hurra on the van — killed Hasaka and held the country, their rajaz vowing not to befriend 'the party of Ibn Affan, for we found in the Book of the Furqan'."
  es: "Rubay'i ibn al-Kas al-Anbari, enviado por Ali a través de Ibn Abbas con cuatro mil hombres a Sijistan —al-Husayn ibn Abi al-Hurr y Na'il ibn Dhi al-Hurra en la vanguardia—, mató a Hasaka y se apoderó del país, y su rajaz juró no hacerse amigo del \"partido de Ibn Affan, porque encontramos en el Libro del Furqan\"."
  fr: "Rubay'i ibn al-Kas al-Anbari; envoyé par Ali par l'intermédiaire d'Ibn Abbas avec quatre mille hommes au Sijistan — al-Husayn ibn Abi al-Hurr et Na'il ibn Dhi al-Hurra à l'avant-garde — tua Hasaka et prit le contrôle du pays, leur rajaz jurant de ne pas se lier d'amitié avec « le parti d'Ibn Affan, car nous avons trouvé dans le Livre du Furqan »."
  ur: "ربیع ابن الکاس الانباری؛ علی کی طرف سے ابن عباس کے ذریعے چار ہزار کے ساتھ سجستان بھیجے گئے - الحسین ابن ابی الحر اور نائل بن ذی الحرۃ نے وین پر - ہساکا کو قتل کیا اور ملک پر قبضہ کر لیا، ان کے رجز نے ابن عفان کی جماعت سے دوستی نہ کرنے کا عہد کیا، کیونکہ ہم نے کتاب فرقان میں پایا ہے۔"
  tr: "Rabi'i ibn al-Kass al-Anbari; Ali ibn Abbas ona Sijistan'ı atamasını emretti ve o da dört bin adamıyla önde Husayn ibn Abi al-Hurr ve Nayel ibn Dhi al-Hurrah ile birlikte önde yürüttü. Hasakah ibn Attab onlarla savaştı, onu öldürdü ve toprağı kontrol etti. Komutanı şöyle dedi: 'Sijistan'a saldıranlar, Majid Abd al-Rahman tarafından İbn Attab ve şeytanın askerlerine götürülmelidir, biz İbn Affan'ın takipçilerine sadık olmayacağız, Munir al-Furqan'da bulduğumuz gibi.'"
  id: "Rabi'i ibn al-Kass al-Anbari; Ali ibn Abbas memerintahkannya untuk menunjuk Sijistan kepadanya, dan ia memimpin Sijistan dengan empat ribu orang al-Husayn ibn Abi al-Hurr dan Nayel ibn Dhi al-Hurrah di garis depan. Hasakah ibn Attab melawan mereka, membunuhnya, dan menguasai tanah. Komandannya berkata: 'Mereka yang menyerbu Sijistan harus dipimpin oleh Majid Abd al-Rahman ke Ibn Attab dan tentara iblis, kami tidak akan setia kepada pengikut Ibn Affan, kami temukan di Munir al-Furqan.'"
