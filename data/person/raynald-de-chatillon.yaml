id: person/raynald-de-chatillon
class: person
label: { ar: "أرناط صاحب الكرك", en: "Raynald de Châtillon", es: "Raynald de Châtillon", fr: "Raynald de Châtillon", ur: "رینالڈ ڈی چیٹیلون" }
summary:
  ar: "البرنس أرناط صاحب الكرك، يصفه ابن الأثير بأنه كان من شياطين الفرنج ومردتهم وأشدهم عداوة للمسلمين؛ عزم سنة سبع وسبعين على المسير في البر إلى تيماء ثم إلى المدينة فكاده عز الدين فرخشاه نائب دمشق حتى انقطع طمعه {cite:kamil-ibn-al-athir p. 105}، وسنة ثمان وسبعين عمل أسطولاً بالكرك فُرّغ قطعاً وحُمل إلى بحر أيلة فجمعها وأقلع بها فرقتين، فحصرت إحداهما أيلة وسارت الأخرى إلى عيذاب تغير على السواحل وتأخذ مراكب المسلمين، وكانوا عازمين على دخول الحجاز وأخذ الحاج ثم اليمن، فأدركهم أسطول مصر بقيادة حسام الدين لؤلؤ الحاجب بساحل الجوزاء فأفناهم {cite:kamil-ibn-al-athir p. 117-118}."
  en: "Raynald (Arnat), lord of Kerak — whom Ibn al-Athir calls the most hostile of the Franks; in 577 he planned an overland march through Tayma toward Medina until Farrukhshah blocked him, and in 578 he hauled a dismantled fleet to the Gulf of Aqaba to raid the Hijaz coast before Husam al-Din Lu'lu''s fleet destroyed it {cite:kamil-ibn-al-athir p. 105, 117-118}."
  es: "Reinaldo (Arnat), señor de Kerak, a quien Ibn al-Athir llama el más hostil de los francos; en 577 planeó una marcha por tierra a través de Tayma hacia Medina hasta que Farrukhshah lo bloqueó, y en 578 llevó una flota desmantelada al Golfo de Aqaba para atacar la costa del Hiyaz antes de que la flota de Husam al-Din Lu'lu la destruyera {cite:kamil-ibn-al-athir p. 105, 117-118}."
  fr: "Raynald (Arnat), seigneur de Kerak — qu'Ibn al-Athir appelle le plus hostile des Francs; en 577, il planifia une marche terrestre à travers Tayma vers Médine jusqu'à ce que Farrukhshah le bloque, et en 578, il transporta une flotte démantelée jusqu'au golfe d'Aqaba pour attaquer la côte du Hedjaz avant que la flotte de Husam al-Din Lu'lu' ne la détruise {cite:kamil-ibn-al-athir p. 105, 117-118}."
  ur: "رینالڈ ⁦(ارنات)⁩، کیرک کا آقا — جسے ابن الثیر فرینکوں کا سب سے زیادہ دشمن کہتا ہے۔ 577 میں اس نے تیما کے راستے مدینہ کی طرف ایک زمینی مارچ کا منصوبہ بنایا یہاں تک کہ فرخشاہ نے اسے روک دیا، اور 578 میں اس نے ایک تباہ شدہ بیڑہ خلیج عقبہ کی طرف لے کر حجاز کے ساحل پر چھاپہ مارا اس سے پہلے کہ حسام الدین لولو کے بحری بیڑے نے اسے تباہ کر دیا۔ 105، 117-118}۔"
