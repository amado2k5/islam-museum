label: { ar: "أرناط صاحب الكرك", en: "Raynald de Châtillon" }
summary:
  ar: "البرنس أرناط صاحب الكرك، يصفه ابن الأثير بأنه كان من شياطين الفرنج ومردتهم وأشدهم عداوة للمسلمين؛ عزم سنة سبع وسبعين على المسير في البر إلى تيماء ثم إلى المدينة فكاده عز الدين فرخشاه نائب دمشق حتى انقطع طمعه {cite:kamil-ibn-al-athir p. 105}، وسنة ثمان وسبعين عمل أسطولاً بالكرك فُرّغ قطعاً وحُمل إلى بحر أيلة فجمعها وأقلع بها فرقتين، فحصرت إحداهما أيلة وسارت الأخرى إلى عيذاب تغير على السواحل وتأخذ مراكب المسلمين، وكانوا عازمين على دخول الحجاز وأخذ الحاج ثم اليمن، فأدركهم أسطول مصر بقيادة حسام الدين لؤلؤ الحاجب بساحل الجوزاء فأفناهم {cite:kamil-ibn-al-athir p. 117-118}."
  en: "Raynald (Arnat), lord of Kerak — whom Ibn al-Athir calls the most hostile of the Franks; in 577 he planned an overland march through Tayma toward Medina until Farrukhshah blocked him, and in 578 he hauled a dismantled fleet to the Gulf of Aqaba to raid the Hijaz coast before Husam al-Din Lu'lu''s fleet destroyed it {cite:kamil-ibn-al-athir p. 105, 117-118}."
