summary:
  ar: "الزاهد أحد أصحاب الشيخ عبد الله اليونيني؛ قال السخاوي في طبقاته كان من كبار أولياء الله؛ حكى خادمه أنه سأله كم مرة رحت إلى مكة في ليلة فقال ثلاث عشرة مرة، وحكى ابنه أنه كانت تفتح له أبواب بعلبك بالليل؛ وأعطى سايساً كردياً الحال ثم أمره بدفنه بعد ثلاثة أيام فمات السايس بعد ثلاث {cite:shadharat-dhahab p. 219}."
  en: "The Baalbek ascetic, companion of Abdallah al-Yunini (d. 641) — al-Sakhawi counts him among the great awliya'; his tradition credits him with reaching Mecca in a night thirteen times and with Baalbek's gates opening for him after dark {cite:shadharat-dhahab p. 219}."
  es: "El asceta de Baalbek, compañero de Abdallah al-Yunini (m. 641) — al-Sakhawi lo cuenta entre los grandes awliya'; su tradición le atribuye haber llegado a La Meca en una noche trece veces y que las puertas de Baalbek se le abrieran después del anochecer {cite:shadharat-dhahab p. 219}."
  fr: "L'ascète de Baalbek, compagnon d'Abdallah al-Yunini (mort en 641) — al-Sakhawi le compte parmi les grands awliya'; sa tradition lui attribue le fait d'avoir atteint La Mecque en une nuit treize fois et que les portes de Baalbek se soient ouvertes pour lui après la tombée de la nuit {cite:shadharat-dhahab p. 219}."
  ur: "بعلبک سنیاسی، عبداللہ ال یونی ⁦(متوفی 641)⁩ کا ساتھی - ال سخاوی اسے عظیم اولیاء میں شمار کرتا ہے۔ اس کی روایت میں اسے تیرہ بار ایک رات میں مکہ پہنچنے اور بعلبک کے دروازے اندھیرے کے بعد کھلنے کا سہرا دیا جاتا ہے۔ 219}۔"
  tr: "Zühi, Şeyh Abdullah el-Yunini'nin yoldaşlarından biriydi; El-Sakhavi, Tebakat'ında onun Allah'ın büyük azizlerinden biri olduğunu söyledi; kulu ona bir gecede kaç kez Mekke'ye gittiğini sorduğunu ve onun on üç kez söylediğini anlattı. Oğlu ayrıca Baalbek kapılarının gece kendisi için açıldığını; Saisa'ya Kürt statüsü verdiğini ve üç gün sonra gömülmesini emrettiğini, Sai'lerin ise üç gün sonra öldüğünü söyledi {cite:shadharat-dhahab, s. 219}."
  id: "Pertapa itu adalah salah satu sahabat Sheikh Abdullah al-Younini; Al-Sakhawi mengatakan dalam Tabaqat bahwa ia adalah salah satu wali agung Tuhan; hambanya menceritakan bahwa ia bertanya berapa kali ia pergi ke Mekah dalam satu malam, dan ia menjawab tiga belas kali. Putranya juga mengatakan bahwa gerbang Baalbek dibuka untuknya pada malam hari; ia memberikan status Kurdi kepada Saisa dan kemudian memerintahkan agar ia dimakamkan setelah tiga hari, dan Sais meninggal setelah tiga {cite:shadharat-dhahab, hlm. 219}."
