summary:
  ar: "كاتب تركماني سوفيتي (1894–1974)، من مؤسسي الأدب التركماني السوفيتي: حرّر صحيفة «تركمانستان» ومجلة «توكماك» في العشرينيات، وترأس إدارة العلوم في جمهورية تركمانستان في 1934–1936، وألّف رواية «الخطوة الحاسمة» التي نالت جائزة الدولة للاتحاد السوفيتي سنة 1948 ورواية «نيبيط داغ» سنة 1957؛ كاتب الشعب في جمهورية تركمانستان وعضو أكاديمية علومها."
  en: "Turkmen Soviet writer (1894–1974), a founder of Turkmen Soviet literature: editor of the newspaper Turkmenistan and the journal Tokmak in the 1920s, head of the Turkmen SSR's science administration in 1934–1936, and author of the novel The Decisive Step, which won the USSR State Prize in 1948, and of Nebit Dag (1957); People's Writer of the Turkmen SSR and an academician of its Academy of Sciences."
  ur: "ترکمان سوویت ادیب (1894ء–1974ء)، ترکمان سوویت ادب کے بانیوں میں سے ایک: 1920ء کی دہائی میں اخبار «ترکمانستان» اور مجلہ «توکماق» کے مدیر، 1934ء–1936ء میں ترکمان جمہوریہ کی سائنس انتظامیہ کے سربراہ، اور ناول «فیصلہ کن قدم» کے مصنف جسے 1948ء میں سوویت یونین کا ریاستی انعام ملا، اور «نیبط داغ» (1957ء) کے مصنف؛ ترکمان جمہوریہ کے عوامی ادیب اور اس کی اکیڈمی آف سائنسز کے رکن۔"
