summary:
  ar: "مؤرخ فارسي كتب في القرن السابع عشر، ويدل كلامه على أن بضع مجلدات من جامع التواريخ كانت تحت يده {cite:jami-al-tawarikh-khashshab-1960 p. 132}. وفي جزئه الخاص بالصين يكرر قطعة نشرت باسم عبد الله البيضاوي تكرارا موجزا {cite:jami-al-tawarikh-khashshab-1960 p. 151}، ويذكر أنه نقل أخبار ملوك خطاى عن تاريخ غازان، أي جامع رشيدي {cite:jami-al-tawarikh-khashshab-1960 p. 151}."
  en: "A Persian historian of the seventeenth century. His own words, the editor says, show that several volumes of Jami' al-Tawarikh were in his hands {cite:jami-al-tawarikh-khashshab-1960 p. 132}. In his Chinese section he gives a short repetition of the passage published under the name of al-Baydawi {cite:jami-al-tawarikh-khashshab-1960 p. 151}, and he states that his account of the kings of Khitai came from the history of Ghazan, that is the Jami' Rashidi {cite:jami-al-tawarikh-khashshab-1960 p. 151}."
  es: "Historiador persa del siglo XVII. Según el editor, sus propias palabras muestran que tenía en sus manos varios volúmenes del Jami' al-Tawarikh {cite:jami-al-tawarikh-khashshab-1960 p. 132}. En su sección sobre China repite de forma breve un pasaje publicado bajo el nombre de al-Baydawi {cite:jami-al-tawarikh-khashshab-1960 p. 151}, y afirma que tomó la historia de los reyes de Jitai de la historia de Ghazan, es decir, el Jami' Rashidi {cite:jami-al-tawarikh-khashshab-1960 p. 151}."
  fr: "Historien persan du XVIIe siècle. Selon l'éditeur, ses propres paroles montrent qu'il disposait de plusieurs volumes du Jami' al-Tawarikh {cite:jami-al-tawarikh-khashshab-1960 p. 132}. Dans sa partie sur la Chine, il reprend brièvement un passage publié sous le nom d'al-Baydawi {cite:jami-al-tawarikh-khashshab-1960 p. 151} ; il dit tirer l'histoire des rois du Khitaï de l'histoire de Ghazan, c'est-à-dire du Jami' Rashidi {cite:jami-al-tawarikh-khashshab-1960 p. 151}."
  ur: "سترہویں صدی کا فارسی مؤرخ۔ مرتب کے مطابق اس کے اپنے الفاظ بتاتے ہیں کہ جامع التواریخ کی کئی جلدیں اس کے پاس تھیں {cite:jami-al-tawarikh-khashshab-1960 p. 132}۔ اپنے چینی حصے میں اس نے البیضاوی کے نام سے شائع ہونے والے ایک ٹکڑے کا مختصر اعادہ کیا {cite:jami-al-tawarikh-khashshab-1960 p. 151}، اور کہا کہ خطائی بادشاہوں کی تفصیل اس نے غازان کی تاریخ، یعنی جامع رشیدی، سے لی {cite:jami-al-tawarikh-khashshab-1960 p. 151}۔"
