summary:
  ar: "محمد علي باشا، توفي سنة ١٢٦٥هـ/١٨٤٩م، مؤسس الأسرة العلوية في مصر، وُلد في قولة في أواخر ستينيات القرن الثامن عشر وصار والياً عثمانياً على مصر من ١٨٠٥ إلى ١٨٤٨م بعد صراع مع المماليك وأعيان القاهرة. أنهى قوة المماليك سنة ١٨١١م، وأقام احتكارات زراعية وصناعة ومدارس وبعثات، وأرسل أبناءه إلى الحجاز والسودان واليونان والشام، حتى فرضت الدول الأوروبية تسوية سنة ١٨٤٠م وأقرّ له السلطان حكماً وراثياً على مصر سنة ١٨٤١م. وتوفي في الإسكندرية سنة ١٨٤٩م ودُفن في جامع القلعة، وتقول دائرة المعارف الإسلامية إن حصيلة إصلاحاته مختلطة."
  en: "Muhammad Ali Pasha (d. 1265 AH/1849 CE), founder of Egypt's Muhammad Ali dynasty, was born in Kavala in the late 1760s and became Ottoman governor of Egypt from 1805 to 1848 after contests with the Mamluks and Cairo's notables. He ended Mamluk power in 1811, built agricultural monopolies, factories, schools and student missions, and sent his sons to the Hijaz, the Sudan, Greece and Syria, until the European powers imposed a settlement in 1840 and the sultan confirmed hereditary rule in Egypt in 1841. He died in Alexandria and was buried in the Citadel mosque; the Encyclopaedia of Islam calls the balance sheet of his reforms mixed."
  ur: "محمد علی پاشا، وفات 1265ھ/1849ء، مصر میں خاندانِ محمد علی کے بانی، اٹھارہویں صدی کی ساٹھ کی دہائی کے اواخر میں قولہ میں پیدا ہوئے اور مملوکوں اور قاہرہ کے معززین سے کشمکش کے بعد 1805ء سے 1848ء تک مصر کے عثمانی والی رہے۔ انہوں نے 1811ء میں مملوک طاقت ختم کی، زرعی اجارہ داریاں، کارخانے، مدارس اور طلبہ کے وفود قائم کیے، اور اپنے بیٹوں کو حجاز، سوڈان، یونان اور شام بھیجا، یہاں تک کہ 1840ء میں یورپی طاقتوں نے تصفیہ مسلط کیا اور سلطان نے 1841ء میں مصر کی موروثی حکومت کی توثیق کی۔ اسکندریہ میں وفات پائی اور قلعے کی مسجد میں دفن ہوئے؛ دائرۃ المعارف الاسلامیہ ان کی اصلاحات کے حاصل کو ملا جلا کہتا ہے."
