summary:
  ar: "محمد علي باشا (ت ١٢٦٥هـ/١٨٤٩م)؛ مؤسس الدولة محمدية العلوية المصرية ومن كبار رجال الإصلاح. ألباني الأصل مستعرب، ولد في قولة بالرومللي واحترف التجارة فأثرى، وقدم مصر شهد حرب أبي قير سنة ١٢١٤هـ وألّف حوله عدداً كبيراً من الألبانيين اعتمد عليهم، وجامل الممليك فناصروه، وثابر حتى صار والي مصر سنة ١٢٢٠هـ، فأخذ في تنظيم حكومتها وإصلاح شؤونها، فأنشأ السفن في النيل وضمّ معظم السودان الشرقي إلى مصر وأنشأ في الإسكندرية «ترسانة»، وقاتل السعوديين فأخرجهم من الحجاز، واستولى على سورية ثم انتُزعت منه بعد أن جعلت له الدولة العثمانية بلاد مصر والسودان خديوية يتوارثها أبناؤه، وكان ذلك سنة ١٢٥٦هـ. وكثرت في أيامه المدارس والمعامل في الديار المصرية وأرسل البعثات لتلقي العلم في أوروبا، واعتزل الأمور لابنه إبراهيم باشا سنة ١٢٦٥هـ وتوفي في الإسكندرية {cite:al-aalam tarjama}."
  en: "Muhammad Ali Pasha (d. 1265 AH/1849 CE) — the Albanian-born founder of Egypt's Muhammad Ali dynasty: the Nile fleet, the Alexandria arsenal, the Sudan annexation and the European missions {cite:al-aalam tarjama}."
