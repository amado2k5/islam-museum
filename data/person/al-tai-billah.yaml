id: person/al-tai-billah
education:
  did_you_know:
    ar: "الطائع بالله ابن المطيع بويع له لما فالج أبوه بمشورة سبكتكين حاجب عز الدولة، وعُقد له الأمر يوم ثالث عشر ذي القعدة سنة ٣٦٣هـ."
    en: "Al-Ta'i' bi'llah, son of al-Muti', was pledged when his father was stricken — on the counsel of Sabuktakin, Izz al-Dawla's chamberlain — and the matter was settled for him on the thirteenth of Dhu al-Qa'da, 363 AH."
    ur: "طائع باللہ، مطیع کے بیٹے، کو بیعت ملی جب ان کے باپ فالج کے مارے گرے — عزالدولہ کے حاجب سبکتکین کے مشورے پر — اور 363ھ ذوالقعدہ کے تیرہویں دن ان کے لیے امر بندھا گیا۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/tarikh-khulafa-minhaj-1434]
class: person
label: { ar: "الطائع لله عبد الكريم بن المطيع", en: "al-Ta'i' li-Llah Abd al-Karim ibn al-Muti'", fr: "al-Ta'i' li-Llah Abd al-Karim ibn al-Muti'" , ur: "طائع للہ عبد الکریم بن مطیع", es: "al-Ta'i' li-Llah Abd al-Karim ibn al-Muti'"}
summary:
  ar: "خليفة عباسي [٣٦٣–٣٨١هـ]، ابن المطيع، بويع له لما فالج أبوه وثقل لسانه بمشورة سبكتكين حاجب عز الدولة وعقد له الأمر يوم الأربعاء ثالث عشر ذي القعدة سنة ثلاث وستين، وقال الذهبي كان المطيع وابنه مستضعفين مع بني بويه {cite:tarikh-khulafa-minhaj-1434 p. 624}، وهو أبو بكر عبد الكريم بن المطيع وأمه أم ولد اسمها هزار نزل له أبوه وله ثلاث وأربعون سنة فركب عليه البردة وبين يديه سبكتكين، وقطعت خطبته ببغداد وغيرها من العشرين من جمادى الأولى إلى عاشر رجب لما وقع بينه وبين عضد الدولة، وجلس له بمصحف عثمان والبردة والقضيب وسيف رسول الله وأفوض لعضد الدولة أمور الرعية شرقاً وغرباً، وركب إليه يهنئه سنة سبعين فتلقاه ولم تجر عادة بخروج الخلفاء لتلقي أحد، وقال السيوطي انظر إلى هذا الأمر وهو الخليفة المستضعف الذي لم تضعف الخلافة في زمن أحد ما ضعفت في زمنه ولا قوي أمر سلطان ما قوي أمر عضد الدولة {cite:tarikh-khulafa-minhaj-1434 p. 626-630}. وعند ابن الأثير خلع المطيع له في منتصف ذي القعدة سنة 363هـ بعد أن مرض مرض النعنج ونقل لسانه وتعذرت عليه الحركة فدعاه سبكتكين علم الدفعة أن يخلع نفسه ويسلمها إلى ولده الطائع وهو أبو الفضل عبد الكريم بن المستكفي ففعل وأشهد على نفسه بالخلع ثالث عشر ذي القعدة وكانت مدة خلافته تسعاً وعشرين سنة وخمسة أشهر غير أيام {cite:kamil-ibn-al-athir p. 468-469}"
  en: "Abbasid caliph [363–381], al-Mu'ti's son, hailed when his father suffered paralysis at Subuktakin's counsel — the deed done Wednesday 13 Dhu'l-Qa'da 363; al-Dhahabi says father and son were alike helpless among the Buyids {cite:tarikh-khulafa-minhaj-1434 p. 624}."
  fr: "Le calife abbasside [363-381], fils d'al-Mu'ti, a salué la paralysie de son père au conseil de Subuktakin - l'acte fait mercredi 13 Dhu'l-Qa'da 363 ; al-Dhahabi dit que le père et le fils étaient également impuissants parmi les Buyids {cite:tarikh-khulafa-minhaj-1434 p. 624}."
  ur: "عباسی خلیفہ، جنہوں نے اپنے والد مطیع کے بعد ۳۶۳ھ میں خلافت سنبھالی؛ ان کا دور آل بویہ کے سیاسی غلبے میں گزرا۔ {cite:kamil-ibn-al-athir}"
  es: "El califa abasí [363–381], hijo de al-Mu'ti, fue aclamado cuando su padre sufrió parálisis por consejo de Subuktakin; el hecho se realizó el miércoles 13 de Dhu'l-Qa'da 363; al-Dhahabi dice que padre e hijo estaban igualmente indefensos entre los Buyíes {cite:tarikh-khulafa-minhaj-1434 p. 624}."
  tr: "Bir Abbasi halifesi [363–381 H.), el-Muti'nin oğlu, babası felç olduğunda ve dili ağırlaştığında, İzzdöv'ün başkâhi Sabuktikin'in tavsiyesiyle ona bağlılık yemini etmişti ve bu iş altmış üçüncü yılın Zhu Kı'dah ayının on üçüncü Çarşamba günü onun için ayarlandı. El-Dhahabi, el-Muti' ve oğlunun Büüilerle birlikte ezildiğini söylemiştir {atıf:Tarikh-khulafa-minhaj-1434, s. 624}. O, Ebu Bekir Abdülkerim bin el-Muti'ydi ve annesi Hazar adında bir anneydi. Babası kırk üç yaşındayken yanına geldi, bu yüzden Sabuktakin ile birlikte burdaya bindi ve vaazı Bağdat'ta ve diğerlerinde kısa kesildi Cumedül-Avval'in yirminci gününden Recep'in onuncusuna kadar, Adud al-Dawla ile karşılaştığında, Osman'ın Kur'anı, Burda, asa ve kılıcı ile birlikte Tanrı'nın Elçisi'nin kılıcıyla oturdu ve Edud al-Dawla'ya doğu ve batı tebaasının işlerini emanet etti. Yetmişte ona tebrik etmek için yanına geldi ve Edud Devle onunla karşılaştı. Halifelerin kimseyle görüşmeye gitmesi alışılmış değildi. El-Suyuti şöyle dedi: Şu meseleye bakın: Hiçbir zamanın halifeliğini zayıflatmayan ve bir sultanın gücü Adud al-Devla'nın işlerini güçlendirmeyen ezilen halife. {Tarih-Külefe Mişhaj-1434, s. 626-630}. İbn al-Athir'e göre, itaatkar olarak tahttan indirilmesi 363 Hicri yılının ortasında, jujube hastalığına yakalandıktan sonra dili hareket ettirilmeden alındı. Bunun üzerine Sebuktakin onu çağırdı ve sınıf ona tahttan çekilip tahtı sadık oğlu Ebu el-Fadl Abdülkerim bin Mustaskafi'ye teslim etmeyi öğretti. O da tahttan çekildiğini ve Dhu al-Qi'dah'ın on üçüncüsünde tahttan çekildiğine tanıklık etti. Halifeliği günler hariç yirmi dokuz yıl beş ay sürdü {cite:kamil-ibn-al-athir s. 468-469}"
  id: "Seorang khalifah Abbasiyah [363–381 H], putra al-Muti', telah bersumpah setia kepadanya ketika ayahnya lumpuh dan lidahnya menjadi berat atas nasihat Sabuktikin, kepala kamar Izz al-Dawla, dan urusan itu diatur untuknya pada hari Rabu, tanggal tiga belas Dhu al-Qi'dah tahun enam puluh tiga. Al-Dhahabi mengatakan bahwa al-Muti' dan putranya ditindas bersama dengan para Buyid {cite:Tarikh-khulafa-minhaj-1434, hlm. 624}. Ia adalah Abu Bakr Abd al-Karim ibn al-Muti' dan ibunya adalah seorang ibu bernama Hazar. Ayahnya datang kepadanya ketika ia berusia empat puluh tiga tahun, sehingga ia menaiki burda bersama Sabuktakin di depannya, dan khotbahnya terhenti di Baghdad dan antara lain Dari tanggal dua puluh Jumada al-Awwal hingga kesepuluh Rajab, ketika ia menghadapi Adud al-Dawla, dan duduk bersama Al-Qur'an Uthman, Burda, tongkat, dan pedang Rasulullah, serta mempercayakan Adud al-Dawla urusan rakyat timur dan barat. Ia menunggang kuda untuk mengucapkan selamat pada tahun tujuh puluh, dan ia bertemu dengannya. Tidak biasa bagi khalifah untuk keluar menemui siapa pun. Al-Suyuti berkata: Lihatlah hal ini: khalifah yang tertindas tidak melemahkan kekhalifahan pada zaman siapa pun maupun kekuasaan sultan tidak memperkuat urusan 'Adud al-Dawla. {cite:Tarikh-khulafa-minhaj-1434, hlm. 626-630}. Menurut Ibn al-Athir, pendudukannya yang taat dilakukan pada pertengahan Dhu al-Qi'dah tahun 363 H setelah ia jatuh sakit jujube, lidahnya bergerak, dan tidak bisa bergerak. Maka Sebuktakin memanggilnya, dan kelas mengajarinya untuk turun tahta dan menyerahkannya kepada putra setianya, Abu al-Fadl Abd al-Karim ibn al-Mustaskafi. Ia melakukannya, dan ia bersaksi tentang pengunduran diri pada tanggal ketiga belas Dhu al-Qi'dah. Khalifahnya berlangsung selama dua puluh sembilan tahun lima bulan, tidak termasuk hari {cite:kamil-ibn-al-athir hlm. 468-469}"
