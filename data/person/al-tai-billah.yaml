education:
  did_you_know:
    ar: "الطائع بالله ابن المطيع بويع له لما فالج أبوه بمشورة سبكتكين حاجب عز الدولة، وعُقد له الأمر يوم ثالث عشر ذي القعدة سنة ٣٦٣هـ."
    en: "Al-Ta'i' bi'llah, son of al-Muti', was pledged when his father was stricken — on the counsel of Sabuktakin, Izz al-Dawla's chamberlain — and the matter was settled for him on the thirteenth of Dhu al-Qa'da, 363 AH."
    ur: "طائع باللہ، مطیع کے بیٹے، کو بیعت ملی جب ان کے باپ فالج کے مارے گرے — عزالدولہ کے حاجب سبکتکین کے مشورے پر — اور 363ھ ذوالقعدہ کے تیرہویں دن ان کے لیے امر بندھا گیا۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/tarikh-khulafa-minhaj-1434]
