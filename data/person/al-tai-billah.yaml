label: { ar: "الطائع لله عبد الكريم بن المطيع", en: "al-Ta'i' li-Llah Abd al-Karim ibn al-Muti'" }
summary:
  ar: "خليفة عباسي [٣٦٣–٣٨١هـ]، ابن المطيع، بويع له لما فالج أبوه وثقل لسانه بمشورة سبكتكين حاجب عز الدولة وعقد له الأمر يوم الأربعاء ثالث عشر ذي القعدة سنة ثلاث وستين، وقال الذهبي كان المطيع وابنه مستضعفين مع بني بويه {cite:tarikh-khulafa-minhaj-1434 p. 624}، وهو أبو بكر عبد الكريم بن المطيع وأمه أم ولد اسمها هزار نزل له أبوه وله ثلاث وأربعون سنة فركب عليه البردة وبين يديه سبكتكين، وقطعت خطبته ببغداد وغيرها من العشرين من جمادى الأولى إلى عاشر رجب لما وقع بينه وبين عضد الدولة، وجلس له بمصحف عثمان والبردة والقضيب وسيف رسول الله وأفوض لعضد الدولة أمور الرعية شرقاً وغرباً، وركب إليه يهنئه سنة سبعين فتلقاه ولم تجر عادة بخروج الخلفاء لتلقي أحد، وقال السيوطي انظر إلى هذا الأمر وهو الخليفة المستضعف الذي لم تضعف الخلافة في زمن أحد ما ضعفت في زمنه ولا قوي أمر سلطان ما قوي أمر عضد الدولة {cite:tarikh-khulafa-minhaj-1434 p. 626-630}. وعند ابن الأثير خلع المطيع له في منتصف ذي القعدة سنة 363هـ بعد أن مرض مرض النعنج ونقل لسانه وتعذرت عليه الحركة فدعاه سبكتكين علم الدفعة أن يخلع نفسه ويسلمها إلى ولده الطائع وهو أبو الفضل عبد الكريم بن المستكفي ففعل وأشهد على نفسه بالخلع ثالث عشر ذي القعدة وكانت مدة خلافته تسعاً وعشرين سنة وخمسة أشهر غير أيام {cite:kamil-ibn-al-athir p. 468-469}"
  en: "Abbasid caliph [363–381], al-Mu'ti's son, hailed when his father suffered paralysis at Subuktakin's counsel — the deed done Wednesday 13 Dhu'l-Qa'da 363; al-Dhahabi says father and son were alike helpless among the Buyids {cite:tarikh-khulafa-minhaj-1434 p. 624}."
