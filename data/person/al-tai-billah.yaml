summary:
  ar: "خليفة عباسي [٣٦٣–٣٨١هـ]، ابن المطيع، بويع له لما فالج أبوه وثقل لسانه بمشورة سبكتكين حاجب عز الدولة وعقد له الأمر يوم الأربعاء ثالث عشر ذي القعدة سنة ثلاث وستين، وقال الذهبي كان المطيع وابنه مستضعفين مع بني بويه {cite:tarikh-khulafa-minhaj-1434 p. 624}."
  en: "Abbasid caliph [363–381], al-Mu'ti's son, hailed when his father suffered paralysis at Subuktakin's counsel — the deed done Wednesday 13 Dhu'l-Qa'da 363; al-Dhahabi says father and son were alike helpless among the Buyids {cite:tarikh-khulafa-minhaj-1434 p. 624}."
