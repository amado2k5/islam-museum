summary:
  ar: "أخو عمرو بن المنذر، من ملوك الحيرة في الجاهلية؛ كان شاباً يعجبه اللهو، وأقام عنده طرفة والمتلمس. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 23}"
  en: "A brother of Amr ibn al-Mundhir, one of the rulers of al-Hira in pre-Islamic times; he was a young man fond of revelry, with whom Tarafa and al-Mutalammis stayed. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 23}"
  ur: "عمرو بن المنذر کے بھائی، جاہلیت میں حیرہ کے حکمرانوں میں سے؛ وہ جوان تھے اور تفریح پسند تھے، ان کے پاس طرفہ اور متلمس ٹھہرے۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 23}"
