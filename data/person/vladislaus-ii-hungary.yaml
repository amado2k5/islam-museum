  ar: "فيلاديسلاف الثاني جاجليو، ملك المجر؛ ينقل الصلابي أنه عزم على فك التعهدات التي أعطاها أسلافه لسلاطين الدولة العثمانية وذهب إلى حد قتل مبعوث السلطان [[person/sulayman-al-qanuni|سليمان]] الذي كان يطالب بالجزية السنوية، فردّ سليمان سنة 1521م بغزوة كبيرة ضد المجر انتهت بموقعة [[event/battle-mohacs-932|موهاكس]] {cite:dawlat-uthmaniyya-salabi p. 201-202}."
  en: "Vladislaus II Jagiellon, king of Hungary; al-Salabi records that he resolved to annul his forebears' undertakings to the Ottoman sultans and went so far as to kill [[person/sulayman-al-qanuni|Süleyman]]'s envoy sent to claim the yearly tribute — answered in 1521 by the great campaign that ended at [[event/battle-mohacs-932|Mohács]] {cite:dawlat-uthmaniyya-salabi p. 201-202}."
