summary:
  ar: "فيلاديسلاف الثاني جاجليو، ملك المجر؛ ينقل الصلابي أنه عزم على فك التعهدات التي أعطاها أسلافه لسلاطين الدولة العثمانية وذهب إلى حد قتل مبعوث السلطان [[person/sulayman-al-qanuni|سليمان]] الذي كان يطالب بالجزية السنوية، فردّ سليمان سنة 1521م بغزوة كبيرة ضد المجر انتهت بموقعة [[event/battle-mohacs-932|موهاكس]] {cite:dawlat-uthmaniyya-salabi p. 201-202}."
  en: "Vladislaus II Jagiellon, king of Hungary; al-Salabi records that he resolved to annul his forebears' undertakings to the Ottoman sultans and went so far as to kill [[person/sulayman-al-qanuni|Süleyman]]'s envoy sent to claim the yearly tribute — answered in 1521 by the great campaign that ended at [[event/battle-mohacs-932|Mohács]] {cite:dawlat-uthmaniyya-salabi p. 201-202}."
  es: "Vladislao II Jagellón, rey de Hungría; al-Salabi registra que resolvió anular los compromisos de sus antepasados con los sultanes otomanos y llegó incluso a matar al enviado de [[person/sulayman-al-qanuni|Süleyman]] enviado para reclamar el tributo anual, a lo que se respondió en 1521 con la gran campaña que terminó en [[event/battle-mohacs-932|Mohács]] {cite:dawlat-uthmaniyya-salabi p. 201-202}."
  fr: "Vladislas II Jagellon, roi de Hongrie; al-Salabi rapporte qu'il résolut d'annuler les engagements de ses ancêtres envers les sultans ottomans et alla jusqu'à tuer l'envoyé de Süleyman envoyé pour réclamer le tribut annuel — auquel répondit en 1521 la grande campagne qui se termina à Mohács {cite:dawlat-uthmaniyya-salabi p. 201-202}."
  ur: "Vladislaus II Jagiellon، ہنگری کا بادشاہ؛ السلابی نے ریکارڈ کیا ہے کہ اس نے عثمانی سلطانوں کے ساتھ اپنے آباؤ اجداد کے وعدوں کو منسوخ کرنے کا عزم کیا اور اس حد تک چلے گئے کہ [[شخص/سلیمان-القانونی|سلیمان]] کے ایلچی کو سالانہ خراج کا دعوی کرنے کے لیے بھیجا گیا — اس کا جواب 1521 میں ایک عظیم مہم کے ذریعے دیا گیا جس کا اختتام [Mohattle/mobattle] [2] پر ختم ہوا۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 201-202}۔"
  tr: "Macaristan Kralı Vladislaus II Jaglio; Al-Salabi, atalarının Osmanlı sultanlarına verdiği sözleri bozmaya kararlı olduğunu ve yıllık haraç talep eden Sultan'ın elçisini [[kişi/süleyman-al-qanuni|Süleyman]]]'ı öldürecek kadar ileri gittiğini bildirir. 1521 yılında Süleyman, Macaristan'a karşı büyük bir seferle karşılık verdi ve bu sefer [[olay/savaş-mohacs-932|Mohacs]] {cite:dawlat-uthmaniyya-salabi s. 201-202} ile sona erdi."
  id: "Vladislaus II Jaglio, Raja Hungaria; Al-Salabi melaporkan bahwa ia bertekad untuk melanggar janji yang telah dibuat leluhurnya kepada sultan Ottoman dan bahkan membunuh utusan Sultan [[orang/sulayman-al-qanuni|Suleiman]], yang menuntut upeti tahunan. Pada tahun 1521 M, Suleiman merespons dengan kampanye besar melawan Hungaria yang berakhir dengan Pertempuran [[event/battle-mohacs-932|Mohacs]] {cite:dawlat-uthmaniyya-salabi hlm. 201-202}."
