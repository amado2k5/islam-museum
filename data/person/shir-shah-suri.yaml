summary:
  ar: "بطاقة أولية لشير شاه السوري، مؤسس الدولة السورية في الهند الذي أزال حكم همايون المغولي سنين، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Sher Shah Suri, founder of the Suri state in India who displaced the Mughal Humayun for years, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Sher Shah Suri, fundador del estado Suri en la India, quien desplazó al mogol Humayun durante años, nombrado a partir de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de convocation de Sher Shah Suri, fondateur de l'État Suri en Inde qui a supplanté le Moghol Humayun pendant des années, nommée d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "ہندوستان میں سوری ریاست کے بانی شیر شاہ سوری کے لیے ڈرافٹ کارڈ جس نے مغل ہمایوں کو برسوں تک بے گھر کیا، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Hindistan'da Suriye devletinin kurucusu ve yıllarca Humayun'u Moğol yönetimini deviren Şer Şah el-Suri için ön kart ve açık bir referans tanımında (Wikidata) yer almaktadır. Hasan İbrahim'in İslam Tarihi adlı eserindeki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal untuk Sher Shah al-Suri, pendiri negara Suriah di India yang menggulingkan pemerintahan Mongol Humayun selama bertahun-tahun, dan muncul dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam karya Hasan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggal tidak disebutkan di sini."
