summary:
  ar: "نبي من سبط يهوذا بن إسرائيل بن إسحاق بن إبراهيم في عصر بني حضورا، أوحى الله إليه أن يأتي بختنصر فيأمره أن يغزو العرب الذين لا أغلاق لبيوتهم، فأتاه فقال الملك صدقت لي سبع ليال أومر في نومي بما ذكرت وأبشر بخطابك، فسار إلى بني حضورا فأهلكهم {cite:muruj-al-dhahab p. 464}."
