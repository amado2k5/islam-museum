  es: "El profeta de Judá ordenó enviar a Bukhtanassar contra \"los árabes cuyas casas no tienen cerrojos\"; el rey respondió que había estado viendo la misma orden en sueños durante siete noches {cite:muruj-al-dhahab p. 464}."
  fr: "Le prophète de Juda a ordonné d'envoyer Bukhtanassar contre « les Arabes dont les maisons n'ont pas de verrous » — le roi a répondu qu'il avait vu le même ordre en rêve pendant sept nuits {cite:muruj-al-dhahab p. 464}."
