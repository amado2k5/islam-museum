id: person/barquq
class: person
label: { ar: "السلطان الظاهر برقوق" }
summary:
  ar: "أول من تسلطن من الجراكسة، تسلطن في رمضان سنة أربع وثمانين ولقب الظاهر، وقبض على الخليفة المتوكل وخلعه وحبسه بقلعة الجبل سنة خمس وثمانين وبويع الواثق عمر ثم المستعصم زكريا ثم ندم فأخرج المتوكل من الحبس وأعاده إلى الخلافة، وحبس بالكرك لما أعيد الصالح حاجي ثم أخرج سنة اثنتين وتسعين وعاد إلى ملكه فاستمر إلى أن مات في شوال سنة إحدى وثمان مئة وأقيم مكانه ابنه فرج {cite:tarikh-khulafa-minhaj-1434 p. 760-761}. وفي شذرات الذهب برقوق بن أنس الجركسي العثماني اشتراه يلبغا الكبير من الخواجا عثمان الذي أحضره من بلاد الجركس وكان اسمه الطنبغا فسماه برقوقاً لنتوء في عينيه ثم نفي إلى الكرك بعد قتل يلبغا ثم اتصل بخدمة منجك نائب الشام فحضر معه إلى مصر ثم اتصل بخدمة الأشرف شعبان فلما قتل الأشرف ترقى برقوق إلى أن أعطي إمرة أربعين واستقل هو وبركة بتدبير المملكة بعد القبض على طشتمور العلائي فلم تطل الأيام حتى اختلفا ودام الحرب بينهما أياماً إلى أن قبض برقوق على بركة وسجنه بالإسكندرية وانفرد برقوق بتدبير المملكة إلى أن دخل شهر رمضان سنة أربع وثمانين فتم له الأمر استقلالاً بالملك فجلس على تخت الملك ولقب الملك الظاهر وبايعه الخليفة المتوكل والقضاة والأمراء وخلعوا الصالح حاجي بن الأشرف وكان شهماً شجاعاً ذا هيبة خبيراً بالأمور عارفاً بالفروسية يحب الفقراء ويتواضع لهم ويتصدق كثيراً وأبطل في ولايته كثيراً من المكوس وضخم ملكه حتى خطب له على منابر توريز وضربت الدنانير والدراهم فيها باسمه وعلى منابر ماردين والموصل وسنجار ومن آثاره المدرسة القائمة بين القصرين بالقاهرة لم يتقدم بناء مثلها وعمل جسر الشريعة فانتفع به المسافرون كثيراً وبالجملة فإنه كان أعظم ملوك الجراكسة بلا مدافعة وتوفي على فراشه ليلة نصف شوال سنة إحدى وثمان مئة بالقاهرة عن نحو ستين سنة وترك من الذهب العين ألفي ألف ألف دينار وأربع مئة ألف دينار ومن الأثاث وغيره ما قيمته ألف ألف دينار وأربع مئة ألف دينار قاله المقريزي وعهد بالسلطنة إلى ابنه فرج وله يومئذ عشر سنين {cite:shadharat-dhahab p. 14-15}."
  en: "First Circassian sultan (784), founder of the Burji line; he imprisoned and deposed caliph al-Mutawakkil, repented and restored him, was himself jailed at Karak then restored in 792, ruling till Shawwal 801 {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
  es: "Primer sultán circasiano (784), fundador de la línea Burji; encarceló y depuso al califa al-Mutawakkil, se arrepintió y lo restituyó, fue encarcelado él mismo en Karak y luego restituido en 792, gobernando hasta Shawwal 801 {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
  fr: "Premier sultan circassien (784), fondateur de la lignée Burji; il emprisonna et déposa le calife al-Mutawakkil, se repentit et le rétablit, fut lui-même emprisonné à Karak puis rétabli en 792, régnant jusqu'en Shawwal 801 {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
  ur: "پہلا سرکیسیئن سلطان (784)، برجی لائن کا بانی؛ اس نے خلیفہ المتوکل کو قید کیا اور معزول کیا، توبہ کی اور اسے بحال کیا، خود کرک میں جیل میں ڈال دیا گیا پھر 792 میں بحال کیا گیا، شوال 801 تک حکومت کی۔ 760-761}۔"
  tr: "Çerkeslerden ilk hüküm süren kişi, seksen dördüncü yılın Ramazan ayında el-Zahir unvanıyla gerçekleşti. Halife el-Mutavakkil tutuklandı, tahttan indirildi ve 1985'te Qala'at al-Jabal'da hapsedildi. El-Vetik Ömer ve ardından El-Musta'sim Zekariya daha sonra bundan pişman oldu. El-Mütevakkil hapisten çıktı ve halifeliğe geri döndü. El-Salih Hacı yeniden göreve getirildiğinde Karak'ta hapsedildi, ardından 1992'de serbest bırakıldı ve krallığına döndü; 8101 Hicri yılında Şevval'de ölene kadar kaldı; yerine oğlu Faraj geçti {atıf:Tarih-Khulafa-minhaj-1434, s. 760-761}. Barquq bin Anas Al-Jarkasi altın parçalarında Osmanlı İmparatorluğu, Büyük Yalbugha tarafından Khawaja Osman'dan satın aldı ve Osman, Çereş topraklarından getirmişti ve adı Al-Tanbagha olduğu için gözlerindeki bir şişlik nedeniyle Barquq adını verdi. Sonra Yalbugha'yı öldürdükten sonra Karak'a sürgün edildi. Sonra Şam milletvekili Manjak'ın hizmetine katıldı ve onunla birlikte Mısır'a geldi, ardından Ashraf Shaaban'ın hizmetine katıldı. Al-Ashraf öldürüldüğünde Barquq terfi etti, Arba'in Emirliği verildi ve Taşmur Al-Alai'nin ele geçirilmesinden sonra Baraka ile krallığın yönetimini devraldı. Çok geçmeden anlaşmazlıklar yaşadılar ve sürdüler Aralarındaki savaş günlerce sürdü, ta ki Barquq Baraka'yı ele geçirip İskenderiye'de hapse atana kadar. Barquq, krallığın yönetimini tek başına üstlendi ve seksen dördüncü yılın Ramazan ayına kadar krallığı yönetti; o tarihte kral olarak bağımsızlık kazandı. Kralın tahtına oturdu, Kral el-Zahir ve Halife Al-Muwaakkil unvanı verildi; yargıçlar ve prensler Al-Salih Hacı ibn al-Ashraf'ı tahttan indirdi. O, soylu, prestijli, işlerinde bilgili, binicilikte bilgili bir adamdı, yoksulları seven, onlar için alçakgönüllü, çok sadaka veren, hükümdarlığı sırasında verginin çoğunu kaldıran ve saltanatını o kadar uzattı ki Touriz kürsüsünde ona bir vaaz verildi ve bu vaaz iptal edildi. Dinar ve dirhemler onun adına ve Mardin, Musul ve Sinjar'daki kürsülerde yer almaktadır. Anıtları arasında Kahire'deki iki saray arasında kurulan okul da vardır. Benzer bir inşaat ilerletilmedi ve Şeriat Köprüsü'nün inşası yolculara büyük fayda sağladı. Genel olarak, savunma hattı olmayan Çerkeslerin en büyük kralıydı. 810 Hicri yılının ortası gecesi, yaklaşık altmış yaşında Kahire'de yatağında öldü. El-Maqrizi'nin belirttiğine göre, geride iki bin dinar ve dört yüz bin dinar altın ile mobilya bıraktı; bunların arasında bin dört yüz bin dinar değerinde eşyalar da vardı. Sultanlık, o dönemde on yaşında olan oğlu Faraj'a emanet edildi {atıf:shadharat-dhahab, s. 14-15}."
  id: "Khalifah al-Mutawakkil pertama kali memerintah dari Circassia adalah pada Ramadan tahun delapan puluh empat, dengan gelar al-Zahir. Khalifah al-Mutawakkil ditangkap, digulingkan, dan dipenjara di Qala'at al-Jabal pada tahun 1985. Al-Wathiq Umar, kemudian Al-Musta'sim Zakariya, kemudian menyesalinya. Al-Mutawakkil dibebaskan dari penjara dan dikembalikan ke kekhalifahan. Ia dipenjara di Karak ketika al-Salih Haji diangkat kembali, kemudian dibebaskan pada tahun 1992 dan kembali ke kerajaannya, tinggal hingga wafat di Shawwal pada tahun 8101 H, dan putranya Faraj menggantikannya {cite:History-Khulafa-minhaj-1434, hlm. 760-761}. Dalam fragmen emas Barquq bin Anas Al-Jarkasi, Kekaisaran Ottoman membelinya oleh Yalbugha yang Agung dari Khawaja Osman yang membawanya dari tanah Circassian dan namanya Al-Tanbagha sehingga dia menamai Barquq karena ada benjolan di matanya. Kemudian dia diasingkan ke Karak setelah membunuh Yalbugha. Kemudian dia bergabung dengan Manjak wakil Damaskus dan ikut bersamanya ke Mesir lalu bergabung dengan Ashraf Shaaban. Ketika Al-Ashraf dibunuh, Barquq dipromosikan hingga dia diberikan Emirat Arba'in dan dia serta Baraka mengambil alih pengelolaan kerajaan setelah penaklukan Tashmur Al-Alai. Tidak lama kemudian mereka tidak sepakat dan bertahan Perang di antara mereka berlangsung selama beberapa hari hingga Barquq menangkap Baraka dan memenjarakannya di Alexandria. Barquq mengambil alih pengelolaan kerajaan secara tunggal hingga bulan Ramadan tahun delapan puluh empat, ketika ia diberikan kemerdekaan sebagai raja. Ia duduk di takhta raja, diberi gelar Raja al-Zahir, dan Khalifah Al-Mutawakkil, bersama para hakim dan pangeran, yang menggulingkan Al-Salih Haji ibn al-Ashraf. Ia adalah pria bangsawan, pemberani, bergengsi, berpengetahuan dalam urusannya, berpengetahuan dalam dunia berkuda, mencintai orang miskin, merendahkan hati mereka, banyak beramal, menghapus sebagian besar pajak selama pemerintahannya, dan memperluas pemerintahannya hingga ia mendapat khotbah di mimbar Touriz, dan ia pun dilaksanakan. Dinar dan dirham atas namanya dan di mimbar Mardin, Mosul, dan Sinjar. Di antara monumennya adalah sekolah yang didirikan di antara dua istana di Kairo. Tidak ada pembangunan serupa yang dikembangkan, dan pembangunan Jembatan Syariah sangat menguntungkan para pelancong. Secara keseluruhan, ia adalah raja terbesar bangsa Circassia, tanpa garis pertahanan. Ia meninggal di tempat tidurnya pada malam pertengahan Shawwal tahun 810 H di Kairo pada usia sekitar enam puluh tahun. Ia meninggalkan dua ribu dinar dan empat ratus ribu dinar emas dan perabotan, serta barang-barang lain bernilai seribu empat ratus ribu dinar, seperti yang dinyatakan oleh Al-Maqrizi. Kesultanan dipercayakan kepada putranya Faraj, yang saat itu berusia sepuluh tahun {cite:shadharat-dhahab, hlm. 14-15}."
