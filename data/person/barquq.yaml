label: { ar: "السلطان الظاهر برقوق" }
summary:
  ar: "أول من تسلطن من الجراكسة، تسلطن في رمضان سنة أربع وثمانين ولقب الظاهر، وقبض على الخليفة المتوكل وخلعه وحبسه بقلعة الجبل سنة خمس وثمانين وبويع الواثق عمر ثم المستعصم زكريا ثم ندم فأخرج المتوكل من الحبس وأعاده إلى الخلافة، وحبس بالكرك لما أعيد الصالح حاجي ثم أخرج سنة اثنتين وتسعين وعاد إلى ملكه فاستمر إلى أن مات في شوال سنة إحدى وثمان مئة وأقيم مكانه ابنه فرج {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
  en: "First Circassian sultan (784), founder of the Burji line; he imprisoned and deposed caliph al-Mutawakkil, repented and restored him, was himself jailed at Karak then restored in 792, ruling till Shawwal 801 {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
