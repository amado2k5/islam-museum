label: { ar: "السلطان الظاهر برقوق" }
summary:
  ar: "أول من تسلطن من الجراكسة، تسلطن في رمضان سنة أربع وثمانين ولقب الظاهر، وقبض على الخليفة المتوكل وخلعه وحبسه بقلعة الجبل سنة خمس وثمانين وبويع الواثق عمر ثم المستعصم زكريا ثم ندم فأخرج المتوكل من الحبس وأعاده إلى الخلافة، وحبس بالكرك لما أعيد الصالح حاجي ثم أخرج سنة اثنتين وتسعين وعاد إلى ملكه فاستمر إلى أن مات في شوال سنة إحدى وثمان مئة وأقيم مكانه ابنه فرج {cite:tarikh-khulafa-minhaj-1434 p. 760-761}. وفي شذرات الذهب برقوق بن أنس الجركسي العثماني اشتراه يلبغا الكبير من الخواجا عثمان الذي أحضره من بلاد الجركس وكان اسمه الطنبغا فسماه برقوقاً لنتوء في عينيه ثم نفي إلى الكرك بعد قتل يلبغا ثم اتصل بخدمة منجك نائب الشام فحضر معه إلى مصر ثم اتصل بخدمة الأشرف شعبان فلما قتل الأشرف ترقى برقوق إلى أن أعطي إمرة أربعين واستقل هو وبركة بتدبير المملكة بعد القبض على طشتمور العلائي فلم تطل الأيام حتى اختلفا ودام الحرب بينهما أياماً إلى أن قبض برقوق على بركة وسجنه بالإسكندرية وانفرد برقوق بتدبير المملكة إلى أن دخل شهر رمضان سنة أربع وثمانين فتم له الأمر استقلالاً بالملك فجلس على تخت الملك ولقب الملك الظاهر وبايعه الخليفة المتوكل والقضاة والأمراء وخلعوا الصالح حاجي بن الأشرف وكان شهماً شجاعاً ذا هيبة خبيراً بالأمور عارفاً بالفروسية يحب الفقراء ويتواضع لهم ويتصدق كثيراً وأبطل في ولايته كثيراً من المكوس وضخم ملكه حتى خطب له على منابر توريز وضربت الدنانير والدراهم فيها باسمه وعلى منابر ماردين والموصل وسنجار ومن آثاره المدرسة القائمة بين القصرين بالقاهرة لم يتقدم بناء مثلها وعمل جسر الشريعة فانتفع به المسافرون كثيراً وبالجملة فإنه كان أعظم ملوك الجراكسة بلا مدافعة وتوفي على فراشه ليلة نصف شوال سنة إحدى وثمان مئة بالقاهرة عن نحو ستين سنة وترك من الذهب العين ألفي ألف ألف دينار وأربع مئة ألف دينار ومن الأثاث وغيره ما قيمته ألف ألف دينار وأربع مئة ألف دينار قاله المقريزي وعهد بالسلطنة إلى ابنه فرج وله يومئذ عشر سنين {cite:shadharat-dhahab p. 14-15}."
  en: "First Circassian sultan (784), founder of the Burji line; he imprisoned and deposed caliph al-Mutawakkil, repented and restored him, was himself jailed at Karak then restored in 792, ruling till Shawwal 801 {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
