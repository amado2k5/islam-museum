summary:
  ar: "تاج الدين سبط ابن الشهيد؛ قال البرهان البقاعي الإمام العلامة القدوة كان يعرض علوماً كثيرة ويجلي أي كتاب يقرأ عليه سواء كان عنده له شرح أم لا وكان فصيح العبارة حسن التقرير صحيح الذهن شديد الانجماع عن الناس مع خفة الروح ولطافة المزاج والصبر على الطلبة وكثرة التلاوة وإيثار العزلة في الجامع مع التجمل في اللباس والهيئة، توفي صبح يوم الثلاثاء تاسع شهر رمضان بدمشق عن ثلاث وثلاثين سنة ولم أر جنازة أحفل من جنازته ووالله لم يحصل لي بأحد من النفع ما حصل لي به {cite:shadharat-dhahab p. 197}."
  en: "Taj al-Din, 'the Imam, the exemplar' per al-Buqa'i — could expound any book read to him offhand; solitary, elegant, endlessly teaching; died at Damascus Tuesday 9 Ramadan 831 at thirty-three — 'I never saw a fuller funeral' {cite:shadharat-dhahab p. 197}."
