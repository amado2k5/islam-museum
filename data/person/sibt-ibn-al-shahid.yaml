summary:
  ar: "تاج الدين سبط ابن الشهيد؛ قال البرهان البقاعي الإمام العلامة القدوة كان يعرض علوماً كثيرة ويجلي أي كتاب يقرأ عليه سواء كان عنده له شرح أم لا وكان فصيح العبارة حسن التقرير صحيح الذهن شديد الانجماع عن الناس مع خفة الروح ولطافة المزاج والصبر على الطلبة وكثرة التلاوة وإيثار العزلة في الجامع مع التجمل في اللباس والهيئة، توفي صبح يوم الثلاثاء تاسع شهر رمضان بدمشق عن ثلاث وثلاثين سنة ولم أر جنازة أحفل من جنازته ووالله لم يحصل لي بأحد من النفع ما حصل لي به {cite:shadharat-dhahab p. 197}."
  en: "Taj al-Din, 'the Imam, the exemplar' per al-Buqa'i — could expound any book read to him offhand; solitary, elegant, endlessly teaching; died at Damascus Tuesday 9 Ramadan 831 at thirty-three — 'I never saw a fuller funeral' {cite:shadharat-dhahab p. 197}."
  es: "Taj al-Din, 'el Imam, el ejemplo' según al-Buqa'i, podía explicar cualquier libro que se le leyera de memoria; solitario, elegante, enseñaba sin cesar; murió en Damasco el martes 9 de Ramadán de 831 a los treinta y tres años: 'Nunca vi un funeral más completo' {cita: shadharat-dhahab p. 197}."
  fr: "Taj al-Din, « l'Imam, l'exemple » selon al-Buqa'i — pouvait expliquer n'importe quel livre qu'on lui lisait spontanément; solitaire, élégant, enseignant sans cesse; mort à Damas le mardi 9 Ramadan 831 à trente-trois ans — « Je n'ai jamais vu de funérailles plus complètes » {cite: shadharat-dhahab p. 197}."
  ur: "تاج الدین، 'امام، نمونہ' فی البقائی - کسی بھی کتاب کو جو اسے پڑھی جاتی ہے اس کی وضاحت کر سکتے ہیں۔ تنہا، خوبصورت، نہ ختم ہونے والی تعلیم؛ دمشق میں منگل 9 رمضان المبارک 831 کو تینتیس میں وفات پائی - 'میں نے کبھی پورا جنازہ نہیں دیکھا'۔ 197}۔"
  tr: "Örnek alim Taceddin Sibt bin el-Şahid; örnek alim El-Burhan el-Bakai şöyle dedi: Birçok bilimsel bilgi sundu ve hangi kitabı okuyacağını açıkladı, açıklaması olsun ya da olmasın. Güzel konuşan, iyi konuşan, terbiyeli, aklı başında, insanlarla çok sosyal, hafif ruhlu, nazik mizaclı, öğrencilere karşı sabırlı, sık sık okunan ve camide inzivayı tercih eden biriydi. Ramazan ayının dokuzuncusu Salı sabahı, Şam'da otuz üç yaşında vefat etti ve onun cenazesi kadar şenlikli bir cenaze görmedim. Tanrı aşkına, kimse bana fayda sağlamadı {atıf:shadharat-dhahab s. 197}."
  id: "Taj al-Din Sibt ibn al-Shahid; Al-Burhan al-Baqa'i, seorang ulama teladan, berkata: Ia menyampaikan banyak ilmu pengetahuan dan memperjelas buku mana yang harus dibaca, apakah ia memiliki penjelasan atau tidak. Ia fasih, fasih berbicara, berperilaku baik, berpikiran waras, sangat bersosialisasi dengan orang-orang, berjiwa ringan, bersifat lembut, sabar dengan murid, sering membaca bacaan, dan lebih suka menyendiri di masjid, beserta penampilan dan penampilannya. Ia meninggal pada pagi hari Selasa, tanggal sembilan Ramadan, di Damaskus pada usia tiga puluh tiga tahun, dan saya belum pernah melihat pemakaman yang lebih meriah daripada miliknya. Demi Tuhan, tidak ada yang mendapat manfaat darinya {cite:shadharat-dhahab hlm. 197}."
