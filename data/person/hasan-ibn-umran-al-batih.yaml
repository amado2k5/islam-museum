id: person/hasan-ibn-umran-al-batih
class: person
label: { ar: "الحسن بن عمران بن شاهين" }
summary:
  ar: "ابن عمران بن شاهين صاحب البطائح؛ لما مات أبوه سنة 369هـ بعد ولاية أربعين سنة ولى مكانه فتجدد لعضد الدولة طمع في أعمال البطيحة فجهز العساكر مع وزيره المطهر بن عبد الله فسدّ القوارع والأنهار الداخلة في البطائح فنقض الحسن بعض تلك السدود فأهلكها الماء وجرى بينه وبين المطهر وقعة في الماء استظهر عليه الحسن {cite:kamil-ibn-al-athir p. 514}."
  en: "Umran ibn Shahin's son and heir in the Batayih; when Adud al-Dawla sent the vizier al-Mutahhar to dam the marsh inlets, Hasan breached the dykes, drowned the works and beat him in a water-battle {cite:kamil-ibn-al-athir p. 514}."
  es: "Hijo y heredero de Umran ibn Shahin en Batayih; cuando Adud al-Dawla envió al visir al-Mutahhar a represar las ensenadas del pantano, Hasan rompió los diques, inundó las obras y lo derrotó en una batalla acuática {cite:kamil-ibn-al-athir p. 514}."
  fr: "Umran ibn Shahin, fils et héritier des Batayih; lorsqu'Adud al-Dawla envoya le vizir al-Mutahhar pour endiguer les bras du marais, Hasan brisa les digues, noya les ouvrages et le battit dans une bataille d'eau {cite:kamil-ibn-al-athir p. 514}."
  ur: "عمران بن شاہین کا بیٹا اور بطیح میں وارث؛ جب عدود الدولہ نے وزیر المطہر کو دلدلی نالیوں کو بند کرنے کے لیے بھیجا تو حسن نے بند توڑ دیے، کاموں کو غرق کر دیا اور پانی کی لڑائی میں اسے مارا پیٹا۔ 514}۔"
  tr: "El-Beytih'in hükümdarı İbn İmran bin Şahin; babası kırk yıl süren hükümdarlığın ardından 369 H.'de öldüğünde onun yerine geçti. Devlete desteğini yeniledi, El-Beytih'in işlerini gözler önüne serdi ve bu yüzden bakanı El-Mütahhar bin Abdullah ile birlikte orduları El-Beytih'e giren nehir ve nehirleri yok etmek için hazırladı. El-Hasan bu barajlardan bazılarını yıktı, su onları yok etti ve kendisi ile El-Mütahhar arasında bir su olayı yaşandı; bunu El-Hasan belirtti {atı:kamil-ibn-al-athir s. 514}."
  id: "Ibn Imran ibn Shaheen, penguasa Al-Bata'ih; ketika ayahnya meninggal pada tahun 369 H setelah empat puluh tahun memerintah, ia menggantikannya. Ia memperbarui dukungannya terhadap negara, menginginkan urusan Al-Batiha, sehingga ia mempersiapkan pasukan bersama menterinya Al-Mutahhar bin Abdullah untuk menghancurkan sungai-sungai yang masuk ke Al-Bata'ih. Al-Hasan merusak beberapa bendungan itu, air menghancurkannya, dan terjadi insiden air antara dirinya dan Al-Mutahhar, yang ditunjuk Al-Hasan {cite:kamil-ibn-al-athir hlm. 514}."
