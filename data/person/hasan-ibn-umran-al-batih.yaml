summary:
  ar: "ابن عمران بن شاهين صاحب البطائح؛ لما مات أبوه سنة 369هـ بعد ولاية أربعين سنة ولى مكانه فتجدد لعضد الدولة طمع في أعمال البطيحة فجهز العساكر مع وزيره المطهر بن عبد الله فسدّ القوارع والأنهار الداخلة في البطائح فنقض الحسن بعض تلك السدود فأهلكها الماء وجرى بينه وبين المطهر وقعة في الماء استظهر عليه الحسن {cite:kamil-ibn-al-athir p. 514}."
  en: "Umran ibn Shahin's son and heir in the Batayih; when Adud al-Dawla sent the vizier al-Mutahhar to dam the marsh inlets, Hasan breached the dykes, drowned the works and beat him in a water-battle {cite:kamil-ibn-al-athir p. 514}."
