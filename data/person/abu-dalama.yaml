label: { ar: "أبو دلامة", en: "Abu Dalama", fr: "Abu Dalama", es: "Abu Dalama", ur: "ابودلمہ" }
summary:
  ar: "أبو دلامة زند بن الجون؛ كان أسود مولى لبني أسد وأبوه عبد لرجل منهم فأعتقه؛ صاحب نوادر وحكايات وأدب ونظم؛ أدرك آخر بني أمية ولم تكن له نباهة في أيامهم ونبغ في أيام بني العباس فانقطع إلى السفاح والمنصور والمهدي وكانوا يقدمونه ويستطربون نوادره؛ وقيل إنه بقي إلى خلافة الرشيد ولا يثبت؛ كان مطبوعاً كثير النوادر {cite:wafayat-ayan}."
  en: "Abu Dalama Zand b. al-Jawn — the celebrated black jester-poet, mawla of Banu Asad; attached to al-Saffah, al-Mansur and al-Mahdi, famed for wit, verse and anecdotes; said to have lived into Harun's reign {cite:wafayat-ayan}."
  fr: "Abu Dalama Zand b. al-Jawn — le célèbre poète-bouffon noir, mawla des Banu Asad ; attaché à al-Saffah, al-Mansur et al-Mahdi, réputé pour son esprit, ses vers et ses anecdotes ; il aurait vécu jusqu'au règne de Harun {cite:wafayat-ayan}."
  es: "Abu Dalama Zand b. al-Jawn — el célebre bufón-poeta negro, mawla de Banu Asad; vinculado a al-Saffah, al-Mansur y al-Mahdi, famoso por su ingenio, versos y anécdotas; se dice que vivió hasta el reinado de Harún {cite:wafayat-ayan}."
  ur: "ابودلمہ زند بی۔ الجون - مشہور سیاہ فام شاعر، بنو اسد کا مولا؛ الصفح، المنصور اور المہدی سے منسلک، عقل، آیت اور قصے کے لیے مشہور؛ کہا جاتا ہے کہ وہ ہارون کے دور حکومت میں رہتے تھے۔"
  tr: "Ebu Dulama Zand ibn el-Cun; Beni Esad kabilesinin siyah tenli bir kölesiydi ve babası da onlardan birinin kölesiydi, babası onu azat etmişti; anekdotlar, hikayeler, edebiyat ve şiir konusunda yetenekli bir adamdı; Beni Emevi kabilesinin son dönemlerinde yaşadı, ancak o dönemde pek bir önemi yoktu, Beni Abbas döneminde ise öne çıktı, bu yüzden Saffe, Mansur ve Mehdi kabilelerine yakınlaştı ve onlar da ona öncelik verip anekdotlarından zevk alırlardı; Raşid halifeliğine kadar yaşadığı söylenir, ancak bu doğrulanmamıştır; doğuştan yetenekliydi ve birçok anekdotu vardı."
  id: "Abu Dulama Zand ibn al-Jun; ia adalah seorang budak berkulit hitam dari Bani Asad, dan ayahnya adalah seorang budak dari salah satu dari mereka, yang membebaskannya; ia adalah seorang yang gemar bercerita, berkisah, menulis sastra, dan berpuisi; ia hidup pada masa akhir Bani Umayyah, tetapi ia tidak memiliki kedudukan penting pada masa mereka, dan ia unggul pada masa Bani Abbas, sehingga ia dekat dengan al-Saffah, al-Mansur, dan al-Mahdi, dan mereka akan memberinya prioritas dan menikmati cerita-ceritanya; dan dikatakan bahwa ia tetap tinggal sampai masa kekhalifahan al-Rashid, tetapi ini tidak terkonfirmasi; ia berbakat secara alami dan memiliki banyak cerita."
