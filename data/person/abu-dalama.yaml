summary:
  ar: "أبو دلامة زند بن الجون؛ كان أسود مولى لبني أسد وأبوه عبد لرجل منهم فأعتقه؛ صاحب نوادر وحكايات وأدب ونظم؛ أدرك آخر بني أمية ولم تكن له نباهة في أيامهم ونبغ في أيام بني العباس فانقطع إلى السفاح والمنصور والمهدي وكانوا يقدمونه ويستطربون نوادره؛ وقيل إنه بقي إلى خلافة الرشيد ولا يثبت؛ كان مطبوعاً كثير النوادر {cite:wafayat-ayan}."
  en: "Abu Dalama Zand b. al-Jawn — the celebrated black jester-poet, mawla of Banu Asad; attached to al-Saffah, al-Mansur and al-Mahdi, famed for wit, verse and anecdotes; said to have lived into Harun's reign {cite:wafayat-ayan}."
