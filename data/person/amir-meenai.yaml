summary:
  ar: "شاعر أردي من لكهنؤ (1828–1900) ولغوي وصاحب معجم. تعلّم في فرنكي محل، وخدم في رامبور رئيسًا لمكتبتها وأستاذًا شعريًا لحاكمها خلفًا لغالب، ومات في حيدر آباد وهو يسعى لنشر معجمه «أمير اللغات». عُدّ رائد شعر النعت بالأردية، وله أكثر من أربعين كتابًا."
  en: "Lucknow Urdu poet (1828–1900), linguist and lexicographer. Educated at Farangi Mahal, he served at Rampur as head of the state library and as the ruler's poetic mentor, succeeding Ghalib in that post, and died at Hyderabad while seeking support to publish his dictionary Ameer-ul-Lughaat. He is counted a pioneer of Urdu naat poetry and wrote over forty books."
  ur: "لکھنؤ کے اردو شاعر (1828ء–1900ء)، ماہر لسانیات و لغت نگار۔ فرنگی محل سے تعلیم پائی، رام پور میں ریاست کی لائبریری کے نگران اور نواب کے استاد مقرر ہوئے، غالب کے بعد یہ منصب انہیں ملا، اور لغت «امیر اللغات» کی اشاعت کی کوشش میں حیدر آباد گئے جہاں انتقال ہوا۔ اردو نعت کے اولین شعرا میں شمار ہوتے ہیں اور چالیس سے زائد کتابیں چھوڑیں۔"
