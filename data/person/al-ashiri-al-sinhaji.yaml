summary:
  ar: "الحافظ مجد الدين أبو محمد عبد الله بن محمد بن عبد الله بن علي الأشيري الصنهاجي؛ أجاز لابن خلكان جميع ما يرويه على اختلاف أنواع الروايات وكتب له بذلك في فهرسته بخطه سنة تسع وخمسين وخمسمائة {cite:wafayat-ayan}."
  en: "The hafiz Majd al-Din Abu Muhammad Abd Allah ibn Muhammad ibn Abd Allah ibn Ali al-Ashiri al-Sinhaji; he licensed Ibn Khallikan to transmit all that he narrated, in every kind of transmission, and wrote this for him in his own hand in his index in the year 559 {cite:wafayat-ayan}."
  es: "El hafiz Majd al-Din Abu Muhammad Abd Allah ibn Muhammad ibn Abd Allah ibn Ali al-Ashiri al-Sinhaji; autorizó a Ibn Khallikan a transmitir todo lo que narró, en cualquier tipo de transmisión, y escribió esto para él de su puño y letra en su índice en el año 559 {cite:wafayat-ayan}."
  fr: "Le hafiz Majd al-Din Abu Muhammad Abd Allah ibn Muhammad ibn Abd Allah ibn Ali al-Ashiri al-Sinhaji; il autorisa Ibn Khallikan à transmettre tout ce qu'il a rapporté, dans toutes sortes de transmission, et écrivit cela pour lui de sa propre main dans son index en l'an 559 {cite:wafayat-ayan}."
