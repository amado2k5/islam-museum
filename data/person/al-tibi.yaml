summary:
  ar: "الحسين بن محمد بن عبد الله، شرف الدين الطيبي، من علماء الحديث والتفسير والبيان، قال ابن حجر: كان آية في استخراج الدقائق من القرآن والسنن، وكان شديد الرد على المبتدعة والفلاسفة. من تصانيفه «التبيان في المعاني والبيان»، و«الخلاصة في أصول الحديث»، و«شرح مشكاة المصابيح»، و«الكاشف عن حقائق السنن». توفي سنة 743هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490}"
  en: "Al-Husayn ibn Muhammad ibn Abd Allah, Sharaf al-Din al-Tibi, a scholar of hadith, exegesis and rhetoric (d. 743 AH). Ibn Hajar said he was a marvel at drawing out subtleties from the Qur'an and the Sunna, and he was firm in refuting innovators and philosophers. His works include al-Tibyan fi al-ma'ani wa al-bayan and a commentary on the Mishkat al-masabih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3490}"
