summary:
  ar: "عالم من صكتو وقائد المهدية في السودان الأوسط ⁦(نحو 1840–1898)⁩، حفيد حفيد عثمان دان فوديو؛ بايع المهدي السوداني محمد أحمد سنة 1883 فنصّبه نائبًا له على خلافة صكتو، وأقام دولة مهدية في بلدا بأداماوا، وهزم أميرها زبير سنة 1893، ثم تحالف مع رابح الزبير فصار إمام بورنو، وقُتل سنة 1898 وهو يحاول الفرار من ديكوا."
  en: "Sokoto scholar and the leading Mahdist leader of the Central Sudan (c. 1840–1898), great-grandson of Usman dan Fodio. In 1883 he pledged allegiance to the Sudanese Mahdi, Muhammad Ahmad, who appointed him his deputy over the Sokoto Caliphate; he built a Mahdist state at Balda in Adamawa, defeated its Lamido Zubeiru in 1893, then allied with Rabih az-Zubayr and served as Imam of Bornu, and was killed in 1898 trying to flee Dikwa."
  ur: "سکوٹو کے عالم اور وسطی سوڈان میں مہدی تحریک کے سب سے بڑے رہنما (تقریباً 1840–1898)، جو عثمان دان فودیو کے پرپوتے تھے۔ 1883 میں انھوں نے سوڈانی مہدی محمد احمد کی بیعت کی، جنھوں نے انھیں خلافت سکوٹو پر اپنا نائب مقرر کیا؛ انھوں نے اداماوا کے بلدا میں مہدی ریاست قائم کی، 1893 میں وہاں کے امیر زبیرو کو شکست دی، پھر رابح الزبیر سے اتحاد کر کے بورنو کے امام بنے، اور 1898 میں ڈکوا سے فرار کی کوشش میں مارے گئے۔"
