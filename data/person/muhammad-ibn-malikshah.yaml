id: person/muhammad-ibn-malikshah
class: person
label: { ar: "السلطان محمد بن ملكشاه غياث الدنيا والدين" }
summary:
  ar: "ابن ملكشاه، خرج على أخيه السلطان بركياروق فانتصر عليه فقلده الخليفة ولقب غياث الدنيا والدين وخطب له ببغداد ثم جرت بينهما عدة وقعات ووقع الصلح سنة سبع وتسعين، ولما مات بركياروق سنة ثمان وتسعين خرج على ولده الطفل فاجتمعت الكلمة عليه وعاد إلى أصبهان سلطاناً متمكناً، وأخذ قلعة الباطنية بأصبهان سنة خمس مئة ورفع الضرائب والمكوس ببغداد سنة إحدى وخمس مئة، ومات سنة إحدى عشرة وأقيم ابنه محمود وله أربع عشرة سنة {cite:tarikh-khulafa-minhaj-1434 p. 657-661}."
  en: "Malikshah's son; he beat his brother Barkyaruq and was invested Ghiyath al-Dunya wa'l-Din with khutba at Baghdad, made peace in 497, then took the whole sultanate from Barkyaruq's child in 498. He took the Batiniyya's Isfahan castle in 500, lifted Baghdad's taxes in 501, and died in 511 leaving fourteen-year-old Mahmud {cite:tarikh-khulafa-minhaj-1434 p. 657-661}."
