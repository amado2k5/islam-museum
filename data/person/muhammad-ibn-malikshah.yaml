id: person/muhammad-ibn-malikshah
class: person
label: { ar: "السلطان محمد بن ملكشاه غياث الدنيا والدين" }
summary:
  ar: "ابن ملكشاه، خرج على أخيه السلطان بركياروق فانتصر عليه فقلده الخليفة ولقب غياث الدنيا والدين وخطب له ببغداد ثم جرت بينهما عدة وقعات ووقع الصلح سنة سبع وتسعين، ولما مات بركياروق سنة ثمان وتسعين خرج على ولده الطفل فاجتمعت الكلمة عليه وعاد إلى أصبهان سلطاناً متمكناً، وأخذ قلعة الباطنية بأصبهان سنة خمس مئة ورفع الضرائب والمكوس ببغداد سنة إحدى وخمس مئة، ومات سنة إحدى عشرة وأقيم ابنه محمود وله أربع عشرة سنة {cite:tarikh-khulafa-minhaj-1434 p. 657-661}."
  en: "Malikshah's son; he beat his brother Barkyaruq and was invested Ghiyath al-Dunya wa'l-Din with khutba at Baghdad, made peace in 497, then took the whole sultanate from Barkyaruq's child in 498. He took the Batiniyya's Isfahan castle in 500, lifted Baghdad's taxes in 501, and died in 511 leaving fourteen-year-old Mahmud {cite:tarikh-khulafa-minhaj-1434 p. 657-661}."
  es: "Hijo de Malikshah; venció a su hermano Barkyaruq y fue investido Ghiyath al-Dunya wa'l-Din con un sermón en Bagdad, firmó la paz en 497, luego tomó todo el sultanato del hijo de Barkyaruq en 498. Tomó el castillo de Isfahán de los Batiniyya en 500, eliminó los impuestos de Bagdad en 501 y murió en 511 dejando a Mahmud de catorce años {cite:tarikh-khulafa-minhaj-1434 p. 657-661}."
  fr: "Fils de Malikshah, il vainquit son frère Barkyaruq et fut investi Ghiyath al-Dunya wa'l-Din avec khutba à Bagdad, fit la paix en 497, puis prit tout le sultanat à l'enfant de Barkyaruq en 498. Il prit le château d'Ispahan des Batiniyya en 500, leva les impôts de Bagdad en 501 et mourut en 511 laissant Mahmud, âgé de quatorze ans {cite:tarikh-khulafa-minhaj-1434 p. 657-661}."
  ur: "ملک شاہ کا بیٹا؛ اس نے اپنے بھائی برقیاروق کو مارا اور غیاث الدنیا والدین کو بغداد میں خطبہ دیا، 497 میں صلح کر لی، پھر 498 میں برقیاروق کے بچے سے پوری سلطنت چھین لی۔ اس نے 500 میں بطینیہ کا اصفہان قلعہ لیا اور 500 میں اس کی موت ہو گئی۔ 511 چودہ سالہ محمود کو چھوڑ کر {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 657-661}۔"
  tr: "Kardeşi Sultan Barkiyaruq'a karşı isyan eden İbn Malikşah, onu yendi ve halife onu taklit ederek ona dünya ve din Ghiyath unvanını verdi. Ona Bağdat'ta bir vaaz verdi. Aralarında birkaç savaş oldu ve 1997'de barış imzalandı. Barkiyaruq 1998'de öldüğünde, bebek oğluna karşı isyan etti ve aleyhine söz toplandı. Güçlü bir sultan olarak İsfahan'a döndü, 500 Hicri'de İsfahan'daki el-Batiniyya kalesini aldı, 501'de Bağdat'ta vergi ve özel tüketim vergilerini artırdı, on birinci yılda öldü ve oğlu Mahmud on dört yaşında büyütüldü {cite:History-Khulafa-minhaj-1434, s. 657-661}."
  id: "Ibn Malikshah, yang memberontak melawan saudaranya Sultan Barkiyaruq, mengalahkannya, dan khalifah menirunya, memberinya gelar Ghiyath dunia dan agama. Ia memberinya khotbah di Baghdad. Beberapa pertempuran terjadi di antara mereka, dan perdamaian ditandatangani pada tahun 1997. Ketika Barkiyaruq meninggal pada tahun 1998, ia memberontak melawan putranya yang masih bayi, dan kabar tersebar menentangnya. Ia kembali ke Isfahan sebagai sultan yang kuat, merebut benteng al-Batiniyya di Isfahan pada tahun 500 H, menaikkan pajak dan cukai di Baghdad pada tahun 501, meninggal pada tahun sebelas, dan putranya Mahmoud dibesarkan pada usia empat belas tahun {cite:History-Khulafa-minhaj-1434, hlm. 657-661}."
