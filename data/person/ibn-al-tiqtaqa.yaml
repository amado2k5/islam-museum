summary:
  ar: "صفي الدين محمد بن علي بن طباطبا المعروف بابن الطقطقي، مؤرخ عراقي من أهل الموصل ينتهي نسبه إلى الحسن بن علي عن طريق إبراهيم الطباطبا؛ وُلد على ما يظهر قريباً من فتح المغول بغداد سنة ٦٥٦هـ، وكان أبوه تاج الدين علي نقيباً كبيراً للعلويين فخسر حياته وماله في صراع سياسي مع الأخوين الجويني، وكان هو أيضاً نقيباً على العلويين بسلطان أضيق، وسافر كثيراً في العراق وأذربيجان؛ وأثناء إقامة بالموصل في طريقه إلى تبريز ألّف بين جمادى الآخرة وشوال ٧٠١هـ تاريخه «الفخري في الآداب السلطانية» لفخر الدين عيسى بن إبراهيم، وهو مرشد موجز للملوك ثم تراجم الخلفاء ووزرائهم إلى زمن المستعصم، وتوفي سنة ٧٠٩هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 988} {cite:tarikh-islam-dhahabi s.a. 601-610 p. 738} {cite:al-aalam j.3 p. 149}."
  en: "Safi al-Din Muhammad ibn Ali ibn Tabataba, known as Ibn al-Tiqtaqa, an Iraqi historian of Mosul whose line runs to al-Hasan ibn Ali through Ibrahim al-Tabataba; born, it seems, shortly after the Mongol sack of Baghdad in 656/1258. His father Taj al-Din Ali, chief naqib of the Alids, lost his life and property in political intrigue against the Juwayni brothers; the son too was a naqib of the Alids with more limited authority, and travelled widely in Iraq and Adharbaydjan. During a stay at Mosul on the way to Tabriz, between Jumada II and Shawwal 701 (February–early June 1302), he composed his history al-Fakhri fi l-Adab al-Sultaniyya for Fakhr al-Din Isa ibn Ibrahim — a brief mirror for princes followed by lives of the caliphs and their viziers down to al-Musta'sim. He died in 709/1309 {cite:encyclopaedia-of-islam-2 vol. 3 p. 988} {cite:tarikh-islam-dhahabi s.a. 601-610 p. 738} {cite:al-aalam j.3 p. 149}."
  ur: "صفی الدین محمد بن علی بن طباطبا المعروف ابن طقطقی، موصل کا عراقی مؤرخ جس کا نسب ابراہیم طباطبا کے ذریعے حسن بن علی تک پہنچتا ہے؛ غالباً 656ھ/1258ء میں بغداد کی مغول فتح کے فوراً بعد پیدا ہوا۔ اس کا والد تاج الدین علی علویوں کا سرکردہ نقیب تھا جو جوینی بھائیوں کی سیاسی چال میں جان اور مال سے ہاتھ بیٹھا؛ بیٹا بھی محدود دائرے میں علویوں کا نقیب تھا اور عراق و آذربائیجان میں کثیر سفر کیا۔ تبریز کے راستے موصل کی اقامت میں اس نے جمادی الثانی تا شوال 701ھ (فروری تا ابتدائی جون 1302ء) فخر الدین عیسیٰ بن ابراہیم کے لیے «الفخری فی الآداب السلطانیۃ» لکھی — مرشد الملوک کے بعد مستعصم تک خلفاء اور ان کے وزراء کی تراجم۔ 709ھ/1309ء میں فوت ہوا {cite:encyclopaedia-of-islam-2 vol. 3 p. 988} {cite:tarikh-islam-dhahabi s.a. 601-610 p. 738} {cite:al-aalam j.3 p. 149}۔"
