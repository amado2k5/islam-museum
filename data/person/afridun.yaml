  ar: "أفريدون قاد الجماعة إلى حرب الضحاك ذي الأفواه وقد شالوا راية من الجلود تسميها الفرس درفش كاوان فأخذه وقيده في جبل دنباوند، وولى ابنه طوحاً على الترك وسلم على الروم، وغلط قوم فزعموا أن الترك من ولد طوح ولو كانوا ولده ما ولّاه عليهم {cite:muruj-al-dhahab p. 439-440}."
  en: "The deliverer who took and bound al-Dahhak in Mount Damavand under the leather banner, and set his son Tuj over the Turks and Salm over Rum — al-Mas'udi's proof that the Turks were not Tuj's offspring {cite:muruj-al-dhahab p. 439-440}."
