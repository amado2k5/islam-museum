summary:
  ar: "أفريدون قاد الجماعة إلى حرب الضحاك ذي الأفواه وقد شالوا راية من الجلود تسميها الفرس درفش كاوان فأخذه وقيده في جبل دنباوند، وولى ابنه طوحاً على الترك وسلم على الروم، وغلط قوم فزعموا أن الترك من ولد طوح ولو كانوا ولده ما ولّاه عليهم {cite:muruj-al-dhahab p. 439-440}."
  en: "The deliverer who took and bound al-Dahhak in Mount Damavand under the leather banner, and set his son Tuj over the Turks and Salm over Rum — al-Mas'udi's proof that the Turks were not Tuj's offspring {cite:muruj-al-dhahab p. 439-440}."
  fr: "Libérateur qui captura et enchaîna al-Dahhak au mont Damavand sous la bannière de cuir, et plaça son fils Tuj à la tête des Turcs et Salm à celle de Rum : preuve pour al-Mas'udi que les Turcs n'étaient pas les descendants de Tuj {cite:muruj-al-dhahab p. 439-440}."
  es: "El libertador que tomó y ató a al-Dahhak en el monte Damavand bajo el estandarte de cuero, y puso a su hijo Tuj sobre los turcos y a Salm sobre Rum: la prueba de al-Mas'udi de que los turcos no eran descendientes de Tuj {cite:muruj-al-dhahab p. 439-440}."
  ur: "نجات دہندہ جس نے الضحاک کو کوہ دماوند میں چمڑے کے جھنڈے کے نیچے باندھا اور اپنے بیٹے کو ترکوں پر اور سلم کو رم پر بٹھایا - المسعودی اس بات کا ثبوت ہے کہ ترک توج کی اولاد نہیں تھے {حوالہ: مروج الذہب صفحہ 439-440}۔"
