id: person/zarqa-al-yamama
class: person
label: { ar: "زرقاء اليمامة", en: "Zarqa' al-Yamama" }
summary:
  ar: "يمامة بنت مرة أخت رباح بن مرة، امرأة زرقاء من جديس ليس في الأرض أبصر منها تبصر الراكب على مسيرة ثلاث ليال، أنذرت قومها بجيش حسان حين سارت الأشجار فقالت يا جديس لقد سارت إليكم الشجر وأرى رجلاً من وراء شجرة ينهش كتفاً أو يخصف نعلاً فكذبوها فأفناهم حسان، ثم أمر بنزع عينيها فإذا في داخلها عروق سود قالت حجر أسود يقال له الإثمد كنت أكتحل به فنشب إلى بصري فكانت أول من اكتحل به فاتخذوه كحلاً، وأمر بها فصلبت على باب جو وقال سموا جواً باليمامة فسميت بها إلى اليوم {cite:muruj-al-dhahab p. 455-456}."
  en: "The far-sighted woman of Jadis — three nights' sight — who warned her people of trees marching and was disbelieved; Hassan's sack followed, her eyes were drawn to reveal the antimony veins of the first kohl, and she was crucified on Jaww's gate, whence the town took her name {cite:muruj-al-dhahab p. 455-456}."
