class: person
label: { ar: "زرقاء اليمامة", en: "Zarqa' al-Yamama", es: "Zarqa' al-Yamama", fr: "Zarqa' al-Yamama", ur: "زرقا یمامہ" }
summary:
  ar: "يمامة بنت مرة أخت رباح بن مرة، امرأة زرقاء من جديس ليس في الأرض أبصر منها تبصر الراكب على مسيرة ثلاث ليال، أنذرت قومها بجيش حسان حين سارت الأشجار فقالت يا جديس لقد سارت إليكم الشجر وأرى رجلاً من وراء شجرة ينهش كتفاً أو يخصف نعلاً فكذبوها فأفناهم حسان، ثم أمر بنزع عينيها فإذا في داخلها عروق سود قالت حجر أسود يقال له الإثمد كنت أكتحل به فنشب إلى بصري فكانت أول من اكتحل به فاتخذوه كحلاً، وأمر بها فصلبت على باب جو وقال سموا جواً باليمامة فسميت بها إلى اليوم {cite:muruj-al-dhahab p. 455-456}."
  en: "The far-sighted woman of Jadis — three nights' sight — who warned her people of trees marching and was disbelieved; Hassan's sack followed, her eyes were drawn to reveal the antimony veins of the first kohl, and she was crucified on Jaww's gate, whence the town took her name {cite:muruj-al-dhahab p. 455-456}."
  es: "La mujer de Jadis, con su visión de tres noches, advirtió a su pueblo sobre los árboles que marchaban y no le creyeron; le siguió el saco de Hassan, sus ojos fueron atraídos para revelar las vetas de antimonio del primer kohl, y fue crucificada en la puerta de Jaww, de donde la ciudad tomó su nombre {cite:muruj-al-dhahab p. 455-456}."
  fr: "La femme clairvoyante de Jadis — vision de trois nuits — qui avertit son peuple de la marche des arbres et ne fut pas crue; le sac de Hassan suivit, ses yeux furent tirés pour révéler les veines d'antimoine du premier khôl, et elle fut crucifiée à la porte de Jaww, d'où la ville prit son nom {cite:muruj-al-dhahab p. 455-456}."
  ur: "جدیس کی دور اندیش عورت - تین راتوں کی نظر - جس نے اپنے لوگوں کو درختوں کے مارچ کرنے سے خبردار کیا اور وہ کافر تھی۔ حسن کی بوری کا تعاقب ہوا، اس کی آنکھیں پہلے کوہل کی اینٹیمونی رگوں کو ظاہر کرنے کے لیے کھینچی گئیں، اور اسے جبو کے دروازے پر مصلوب کیا گیا، اسی وجہ سے اس شہر نے اس کا نام رکھا۔ 455-456}۔"
  tr: "Yamama bint Murrah, Rabah ibn Murrah'ın kız kardeşi, Jadis'ten mavi bir kadın, yeryüzünde ondan daha fazla görülmemiş, üç gecelik yolculukta biniciyi görmüştür. Ağaçlar yürürken Hasan'ın ordusu hakkında halkını uyarmıştır. Şöyle demiştir: 'Ey Jadis, ağaçlar sana geldi ve bir ağacın arkasından bir adamın omzunu ısırdığını ya da sandalet kestiğini görüyorum.' Onu reddettiler ve Hassan onları yok etti. Sonra gözlerini oymasını emretti, içinde siyah damarlar vardı. Kadın dedi ki, 'Al-Ithmad adında siyah bir taş, onunla sürme yapmak için kullanırdım.' Bana göründü ve onu sürme olarak kullanan ilk kişi oydu. Onu sürme olarak aldılar. Jawa'nın kapısında çarmıha gerilmesini emretti ve 'Jawa adını ver' dedi, bu yüzden bugün hâlâ onun adını taşıyor. {alıntı:) dedi Muruj-al-Dhahab, s. 455-456}."
  id: "Yamama bint Murrah, saudari Rabah ibn Murrah, seorang wanita biru dari Jadis, tidak terlihat di bumi lebih sering darinya, yang melihat penunggang itu dalam perjalanan tiga malam. Dia memperingatkan kaumnya tentang pasukan Hasan ketika pohon-pohon berjalan. Dia berkata, 'Wahai Jadis, pohon-pohon telah datang kepadamu, dan aku melihat seorang pria dari balik pohon menggigit bahu atau memotong sandal.' Mereka menolaknya, dan Hassan memusnahkan mereka. Kemudian dia memerintahkan agar matanya dicabut, dan di dalamnya ada urat hitam. Dia berkata, 'Sebuah batu hitam bernama Al-Ithmad, aku menggunakannya untuk membuat kohl darinya.' Batu itu muncul di mataku, dan dia adalah yang pertama menggunakannya sebagai kohl. Mereka menganggapnya sebagai kohl. Dia memerintahkan agar dia disalibkan di depan pintu Jawa, dan berkata, 'Sebut saja Jawa' sesuai dengan Al-Yamamah, maka namanya masih dipakai hingga hari ini. {cite:Muruj-al-Dhahab, hlm. 455-456}."
