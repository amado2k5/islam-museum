summary:
  ar: "ظهير الدين محمد بابر، أول سلاطين المغول في الهند، ولد في 6 محرم 888هـ/14 فبراير 1483م، استرد كابل وكندهار ثم هزم إبراهيم لودي في بانيبت سنة 932هـ/1526م وأسس سلطنته، وتوفي في آغرة سنة 937هـ/1530م {cite:encyclopaedia-of-islam-2 vol. 1 p. 904-905}."
  en: "Zahir al-Din Muhammad Babur, first Mughal ruler in India, born 6 Muharram 888/14 February 1483; after losing and retaking Samarkand he secured Kabul and Qandahar, destroyed Ibrahim Lodi at Panipat in 932/1526 and died at Agra in 937/1530 {cite:encyclopaedia-of-islam-2 vol. 1 p. 904-905}."
  ur: "ہندوستان میں مغل حکومت کے بانی، جو ۱۴۸۳ء میں پیدا ہوئے؛ کابل و قندھار پر حکومت کے بعد پانی پت میں ابراہیم لودھی کو شکست دی اور ۱۵۳۰ء میں آگرہ میں وفات پائی۔ {cite:encyclopaedia-of-islam-2}"
  es: "Zahir al-Din Muhammad Babur, primer gobernante mogol de la India, nació el 6 de Muharram de 888/14 de febrero de 1483; después de perder y reconquistar Samarcanda, aseguró Kabul y Kandahar, derrotó a Ibrahim Lodi en Panipat en 932/1526 y murió en Agra en 937/1530 {cite:encyclopaedia-of-islam-2 vol. 1 p. 904-905}."
  fr: "Zahir al-Din Muhammad Babur, premier souverain moghol en Inde, né le 6 Muharram 888/14 février 1483; après avoir perdu et repris Samarcande, il sécurisa Kaboul et Qandahar, détruisit Ibrahim Lodi à Panipat en 932/1526 et mourut à Agra en 937/1530 {cite:encyclopaedia-of-islam-2 vol. 1 p. 904-905}."
  tr: "Hindistan'ın ilk Babür sultanı Zahiruddin Muhammed Babur, 6 Muharrem 888 Hicri / 14 Şubat 1483'te doğdu. Kabil ve Kandahar'ı geri aldı, ardından 932 Hicri/1526 yılında Banipet'te İbrahim Lodi'yi yendi ve imparatorluğunu kurdu. 937 Hicri/1530 yılında Agra'da öldü {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 904-905}."
  id: "Zahiruddin Muhammad Babur, sultan Mughal pertama di India, lahir pada 6 Muharram 888 H / 14 Februari 1483 M. Ia merebut kembali Kabul dan Kandahar, kemudian mengalahkan Ibrahim Lodi di Banipet pada 932 H/1526 M dan mendirikan kekaisarannya. Ia meninggal di Agra pada tahun 937 H/1530 M {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 904-905}."
