summary:
  ar: "الوليد بن طريف الشاري، خارجي الجزيرة في عهد الرشيد؛ ثار سنة ١٧٨ وعظم أمره فأرسل إليه هارون يزيد بن مزيد الشيباني ابن أخي معن بن زائدة، فقالت البرامكة المنحرفة عن يزيد للرشيد إنما يتجافى يزيد عن الوليد لما بينهما من الرحم — وعند السمعاني في الأنساب وابن خلكان أنه شيباني وعند ابن الأثير أنه تغلبي، وشيبان وتغلب كلتيهما من وائل فهذا هو الرحم على كل حال. وكان يوم خرج يقول «قسورة لا يسقط بين لباني / أنا الوليد بن طريف الشاري»؛ وقال يزيد لأصحابه إنما هي الخوارج ولهم حملة فاثبتوا فإذا انقضت حملتهم فاحملوا عليهم فإنهم إذا انهزموا لم يرجعوا، فقُتل الوليد ووقفت منه أخته الفارعة الخارجية موقف الخنساء من أخويها فرثته بجملة قصائد {cite:duha-islam p. 951-952, 957}."
  en: "al-Walid ibn Tarif — the Shabani (or Taghlibi) Khariji lion of the Jazira, 178 AH; 'I am al-Walid ibn Tarif the Shari'; mourned by his sister al-Fari'a as al-Khansa' mourned her brothers {cite:duha-islam p. 951-952, 957}."
  fr: "Al-Walid ibn Tarif – le lion Shabani (ou Taghlibi) Khariji de la Jazira, 178 de l’hégire ; « Je suis al-Walid ibn Tarif la Shari » ; pleuré par sa sœur al-Fari'a alors que al-Khansa pleurait ses frères {cite:duha-islam p. 951-952, 957}."
  es: "al-Walid ibn Tarif: el león Shabani (o Taghlibi) Khariji de Jazira, 178 d.H.; 'Soy al-Walid ibn Tarif el Shari'; llorado por su hermana al-Fari'a como al-Khansa' lloraba a sus hermanos {cita:duha-islam p. 951-952, 957}."
  ur: "الولید بن طریف - شعبانی ⁦(یا تغلبی)⁩ خارجی شیر جزیرہ، 178 ہجری؛ 'میں الولید بن طریف شری ہوں'؛ اپنی بہن الفاریہ کی طرف سے ماتم کیا گیا جیسا کہ الخنساء نے اپنے بھائیوں کا ماتم کیا 951-952، 957}۔"
  tr: "Al-Walid bin Tarif al-Shari, el-Reşid'in saltanatı sırasında Cazire'nin bir Kharicira'sıydı; 178 Hicri yılında isyan etti ve durumu daha da kötüleşti. Harun, Ma'n bin Zaidah'ın yeğeni Yezid bin Mazid el-Şeybani'yi ona gönderdi. Yezid'den sapan Barmakiler, el-Reşid'e Yezid'in sadece aralarındaki akrabalık bağları nedeniyle el-Velid'den uzaklaştığını söylediler—ve soy ağacındaki el-Sam'ani ile İbn Hallikan'a göre bu Şeybani, İbn el-Athir'e göre ise Taghlibi, Şeyban ve Taglib, her ikisi de Vayl'den, yani bu her halükarda akrabalıktır. Ayrıldığında, \"Kasura kabilemin arasına girmez / Ben El-Velid bin Tarif el-Şeri'yim.\" derdi. Yezid yoldaşlarına, 'Onlar Hawarij'dir ve bir seferleri var, bu yüzden sağlam durun. Seferleri bittiğinde onlara saldırın, çünkü yenilirlerse geri dönmezler.' Elvid öldürüldü ve kız kardeşi Fari'ah el-Hansa onun yanında durdu, kardeşlerine karşı durdu ve onu bir dizi şiirle püskürttü {atıf:Duha-İslam, s. 951-952, 957}."
  id: "Al-Walid ibn Tarif al-Shari, seorang Kharijira Jazira pada masa pemerintahan al-Rashid; ia memberontak pada tahun 178 H, dan situasinya menjadi buruk. Harun mengirim Yazid ibn Mazid al-Shaybani, keponakan Ma'n ibn Zaidah, kepadanya. Barmakid yang menyimpang dari Yazid mengatakan kepada al-Rashid bahwa Yazid hanya menjauh dari al-Walid karena ikatan kekerabatan di antara mereka—dan menurut al-Sam'ani dalam silsilah dan Ibn Khallikan, itu adalah Shaybani, dan menurut Ibn al-Athir, itu adalah Taghlibi, dan Shayban serta Taghlib, keduanya dari Wa'il, jadi ini adalah kekerabatan dalam hal apa pun. Ketika dia pergi, dia berkata, \"Qasura tidak jatuh di antara suku saya / Saya Al-Walid ibn Tarif al-Shari.\" Yazid berkata kepada teman-temannya, 'Mereka adalah Khawarij, dan mereka memiliki kampanye, jadi berdirilah teguh. Ketika kampanye mereka berakhir, serang mereka, karena jika mereka kalah, mereka tidak akan kembali.' Al-Walid terbunuh, dan saudara perempuannya, Fari'ah al-Khansa, berdiri di sisinya dan mengambil sikap melawan saudara-saudaranya, dan dia mengusirnya dengan serangkaian puisi {cite:Duha-Islam, hlm. 951-952, 957}."
