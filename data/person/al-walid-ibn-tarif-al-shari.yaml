summary:
  ar: "الوليد بن طريف الشاري، خارجي الجزيرة في عهد الرشيد؛ ثار سنة ١٧٨ وعظم أمره فأرسل إليه هارون يزيد بن مزيد الشيباني ابن أخي معن بن زائدة، فقالت البرامكة المنحرفة عن يزيد للرشيد إنما يتجافى يزيد عن الوليد لما بينهما من الرحم — وعند السمعاني في الأنساب وابن خلكان أنه شيباني وعند ابن الأثير أنه تغلبي، وشيبان وتغلب كلتيهما من وائل فهذا هو الرحم على كل حال. وكان يوم خرج يقول «قسورة لا يسقط بين لباني / أنا الوليد بن طريف الشاري»؛ وقال يزيد لأصحابه إنما هي الخوارج ولهم حملة فاثبتوا فإذا انقضت حملتهم فاحملوا عليهم فإنهم إذا انهزموا لم يرجعوا، فقُتل الوليد ووقفت منه أخته الفارعة الخارجية موقف الخنساء من أخويها فرثته بجملة قصائد {cite:duha-islam p. 951-952, 957}."
  en: "al-Walid ibn Tarif — the Shabani (or Taghlibi) Khariji lion of the Jazira, 178 AH; 'I am al-Walid ibn Tarif the Shari'; mourned by his sister al-Fari'a as al-Khansa' mourned her brothers {cite:duha-islam p. 951-952, 957}."
