summary:
  ar: "أبو اليمان، قرين الخير، الحبر ابن سليمان. روى أحمد بن أبي الحواري عن أبي سليمان الداراني أن شيخًا زعموا أنه يعرف اسم الله الأعظم، فقال لمن سأله: تعرف قلبك؟ فإذا رأيته رقّ فذلك اسم الله الأعظم."
  en: "Abu al-Yaman, whose epithets are a companion of good and the learned son of Sulayman; Ahmad ibn Abi al-Hawari relates from Abu Sulayman al-Darani that an old man among them was said to know the greatest name of God; asked, he told the questioner to know his own heart: when he sees it grow tender, that is the greatest name."
  ur: "ابو الیمان، خیر کے ساتھی، عالم ابن سلیمان۔ احمد بن ابی الحواری نے ابو سلیمان دارانی سے نقل کیا کہ ہمارے ہاں ایک بزرگ کے بارے میں کہا جاتا تھا کہ وہ اسم اعظم جانتے ہیں؛ جب سوال کیا گیا تو انہوں نے کہا: اپنا دل پہچانو؛ جب تم دیکھو کہ وہ نرم ہو گیا تو یہی اسم اعظم ہے۔"
  fr: "Abu al-Yaman, dont les qualificatifs sont compagnon du bien et fils savant de Sulayman ; Ahmad ibn Abi al-Hawari rapporte d'Abu Sulayman al-Darani qu'un vieil homme parmi eux passait pour connaître le plus grand nom de Dieu ; interrogé, il dit au questionneur de connaître son propre cœur : quand il le voit s'attendrir, c'est là le plus grand nom."
  es: "Abu al-Yaman, cuyos epítetos son compañero de los buenos y el sabio hijo de Sulayman; Ahmad ibn Abi al-Hawari relata de Abu Sulayman al-Darani que se decía que un anciano entre ellos conocía el nombre más grande de Dios; al ser preguntado, le dijo al que le preguntaba que conociera su propio corazón: cuando lo ve ablandarse, ese es el nombre más grande."
  tr: "İyiliğin yoldaşı, âlim İbn Süleyman, Ebu el-Yaman. Ahmed İbn Abi el-Havari, Ebu Süleyman el-Darani'den rivayetle, Allah'ın en büyük ismini bildiğini iddia eden bir şeyhin kendisine soran kişiye şöyle dediğini aktarmıştır: Kalbini tanıyor musun? Eğer yumuşadığını görürsen, işte o Allah'ın en büyük ismidir."
  id: "Abu al-Yaman, sahabat kebaikan, ulama Ibn Sulayman. Ahmad Ibn Abi al-Hawari meriwayatkan dari Abu Sulayman al-Darani bahwa seorang syekh yang mengaku mengetahui Nama Allah Yang Maha Agung berkata kepada orang yang bertanya kepadanya: Apakah kamu mengenal hatimu? Jika kamu melihatnya melunak, maka itulah Nama Allah Yang Maha Agung."
