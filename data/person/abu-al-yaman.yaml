summary:
  ar: "أبو اليمان، قرين الخير، الحبر ابن سليمان. روى أحمد بن أبي الحواري عن أبي سليمان الداراني أن شيخًا زعموا أنه يعرف اسم الله الأعظم، فقال لمن سأله: تعرف قلبك؟ فإذا رأيته رقّ فذلك اسم الله الأعظم."
  en: "Abu al-Yaman, whose epithets are a companion of good and the learned son of Sulayman; Ahmad ibn Abi al-Hawari relates from Abu Sulayman al-Darani that an old man among them was said to know the greatest name of God; asked, he told the questioner to know his own heart: when he sees it grow tender, that is the greatest name."
  ur: "ابو الیمان، خیر کے ساتھی، عالم ابن سلیمان۔ احمد بن ابی الحواری نے ابو سلیمان دارانی سے نقل کیا کہ ہمارے ہاں ایک بزرگ کے بارے میں کہا جاتا تھا کہ وہ اسم اعظم جانتے ہیں؛ جب سوال کیا گیا تو انہوں نے کہا: اپنا دل پہچانو؛ جب تم دیکھو کہ وہ نرم ہو گیا تو یہی اسم اعظم ہے۔"
