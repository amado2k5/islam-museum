summary:
  ar: "السير سيد أحمد خان، مصلح تعليمي وحديث إسلامي من مسلمي الهند، ولد في دلهي سنة 1232هـ/1817م، وأسس كلية محمدان الأنجلو-الشرقية في عليكره سنة 1878م، وأصدر «تهذيب الأخلاق»، وأنشأ مؤتمر التعليم الإسلامي سنة 1886م، ودعا المسلمين إلى الابتعاد عن المؤتمر الوطني سنة 1887م، وأيّد السلطة البريطانية، واعتُبر من السابقين إلى باكستان {cite:encyclopaedia-of-islam-2 vol. 1 p. 309}."
  en: "Sir Sayyid Ahmad Khan, educational reformer and founder of modern Islamic thought in India (1817–1898). Born in Delhi, he wrote the Athar al-sanadid on the monuments of Delhi (1847). After the revolt of 1857 he worked for reconciliation with the British. He founded the periodical Tahdhib al-akhlaq, the Muhammadan Anglo-Oriental College at Aligarh (1878) and the Muhammadan Educational Conference (1886), and in 1887 advised Muslims to stay out of the National Congress {cite:encyclopaedia-of-islam-2 vol. 1 p. 309}."
