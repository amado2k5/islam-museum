summary:
  ar: "السير سيد أحمد خان، مصلح تعليمي وحديث إسلامي من مسلمي الهند، ولد في دلهي سنة 1232هـ/1817م، وأسس كلية محمدان الأنجلو-الشرقية في عليكره سنة 1878م، وأصدر «تهذيب الأخلاق»، وأنشأ مؤتمر التعليم الإسلامي سنة 1886م، ودعا المسلمين إلى الابتعاد عن المؤتمر الوطني سنة 1887م، وأيّد السلطة البريطانية، واعتُبر من السابقين إلى باكستان {cite:encyclopaedia-of-islam-2 vol. 1 p. 309}."
  en: "Sir Sayyid Ahmad Khan, educational reformer and founder of modern Islamic thought in India (1817–1898). Born in Delhi, he wrote the Athar al-sanadid on the monuments of Delhi (1847). After the revolt of 1857 he worked for reconciliation with the British. He founded the periodical Tahdhib al-akhlaq, the Muhammadan Anglo-Oriental College at Aligarh (1878) and the Muhammadan Educational Conference (1886), and in 1887 advised Muslims to stay out of the National Congress {cite:encyclopaedia-of-islam-2 vol. 1 p. 309}."
  es: "Sir Sayyid Ahmad Khan, reformador educativo y fundador del pensamiento islámico moderno en la India (1817-1898). Nacido en Delhi, escribió el Athar al-sanadid sobre los monumentos de Delhi (1847). Tras la revuelta de 1857, trabajó por la reconciliación con los británicos. Fundó la revista Tahdhib al-akhlaq, el Colegio Anglo-Oriental Muhammadan en Aligarh (1878) y la Conferencia Educativa Muhammadan (1886), y en 1887 aconsejó a los musulmanes que se mantuvieran al margen del Congreso Nacional {cite:encyclopaedia-of-islam-2 vol. 1 p. 309}."
  fr: "Sir Sayyid Ahmad Khan, réformateur de l'éducation et fondateur de la pensée islamique moderne en Inde (1817-1898), est né à Delhi. Il est l'auteur de l'Athar al-sanadid, un traité sur les monuments de Delhi (1847). Après la révolte de 1857, il œuvre pour la réconciliation avec les Britanniques. Il fonde la revue Tahdhib al-akhlaq, le Muhammadan Anglo-Oriental College d'Aligarh (1878) et la Muhammadan Educational Conference (1886). En 1887, il conseille aux musulmans de ne pas participer au Congrès national (voir Encyclopaedia of Islam, vol. 1, p. 309)."
  ur: "سر سید احمد خان، تعلیمی مصلح اور ہندوستان میں جدید اسلامی فکر کے بانی (1817-1898)۔ دہلی میں پیدا ہوئے، انہوں نے دہلی کی یادگاروں پر اطہر السنادید (1847) لکھی۔ 1857 کی بغاوت کے بعد اس نے انگریزوں کے ساتھ مفاہمت کے لیے کام کیا۔ انہوں نے رسالہ تہذیب الاخلاق، علی گڑھ میں محمڈن اینگلو اورینٹل کالج (1878) اور محمڈن ایجوکیشنل کانفرنس (1886) کی بنیاد رکھی اور 1887 میں مسلمانوں کو نیشنل کانگریس سے باہر رہنے کا مشورہ دیا۔ 1 ص۔ 309}۔"
  tr: "Sir Syed Ahmad Khan, Hindistan Müslümanlarından eğitim reformcusu ve İslami hadis âlimiydi; 1232 Hicri / 1817 yılında Delhi'de doğdu. 1878'de Aligarh'da Anglo-Doğu Muhammed Koleji'ni kurdu, 'Tahdhib al-Akhlaq'ı yayımladı, 1886'da İslami Eğitim Konferansı'nı kurdu, 1887'de Müslümanları Ulusal Kongre'den uzak durmaya çağırdı, İngiliz otoritesini destekledi ve Pakistan'a giren ilk kişilerden biri olarak kabul edildi {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 309}."
  id: "Sir Syed Ahmad Khan adalah seorang reformis pendidikan dan ulama hadis Islam dari umat Muslim India, lahir di Delhi pada tahun 1232 H / 1817 M. Ia mendirikan Anglo-Eastern Mohammadan College di Aligarh pada tahun 1878, menerbitkan 'Tahdhib al-Akhlaq', mendirikan Konferensi Pendidikan Islam pada tahun 1886, menyerukan kepada umat Muslim untuk menjauh dari Kongres Nasional pada tahun 1887, mendukung otoritas Inggris, dan dianggap sebagai salah satu yang pertama memasuki Pakistan {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 309}."
