summary:
  ar: "عمر بن محمد الليثي البغدادي، أبو الفرج، فقيه مالكي، تفقه بالقاضي إسماعيل وغيره من المالكيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} روى عنه أبو بكر الأبهري، وأبو علي بن السكن، وأبو القاسم الشافعي، وعلي بن الحسين بن بندار، وعمر بن المؤمل الطرسوسي وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} ولي قضاء طرسوس وأنطاكية والمصيصة وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} من تصانيفه «الحاوي» في مذهب مالك، و«اللمع» في أصول الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} أوردته الموسوعة بوفاة سنة 331هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243}"
  en: "Umar ibn Muhammad al-Laythi al-Baghdadi, Abu al-Faraj, a Maliki jurist who studied fiqh under the qadi Isma'il and other Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} Abu Bakr al-Abhari, Abu Ali ibn al-Sakan, Abu al-Qasim al-Shafi'i, Ali ibn al-Husayn ibn Bandar and Umar ibn al-Mu'ammal al-Tarsusi transmitted from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} He held the judgeship of Tarsus, Antioch, al-Massisa and other towns. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} His works include al-Hawi on the madhhab of Malik and al-Luma' on usul al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} The encyclopedia dates his death to 331 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243}"
  ur: "عمر بن محمد الليثی بغدادی، ابو الفرج، مالکی فقیہ جنھوں نے قاضی اسماعیل اور دیگر مالکیوں سے فقہ پڑھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} ان سے ابو بکر الابھری، ابو علی بن السکن، ابو القاسم الشافعی، علی بن الحسین بن بندار اور عمر بن المؤمل الطرسوسی وغیرہ نے روایت کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} وہ طرسوس، انطاکیہ، مصیصہ اور دیگر شہروں کے قاضی رہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} ان کی تصانیف میں امام مالک کے مذہب پر «الحاوی» اور اصول فقہ پر «اللمع» شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243} موسوعہ نے ان کی وفات 331ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16243}"
