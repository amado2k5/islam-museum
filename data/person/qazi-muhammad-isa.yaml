summary:
  ar: "محام وسياسي من بيشين في بلوشستان (1914–1976): أسّس رابطة بلوشستان الإسلامية وصار أصغر أعضاء لجنة عمل الرابطة الإسلامية لعموم الهند، ومثّل بلوشستان في جلسة قرار لاهور 1940، وجاب الهند داعيا لباكستان، ثم كان سفير باكستان في البرازيل وعضو وفودها إلى الأمم المتحدة."
  en: "Barrister and politician from Pishin in Balochistan (1914–1976): founder of the Balochistan Muslim League and the youngest member of the All-India Muslim League's Working Committee, who represented Balochistan at the 1940 Lahore Resolution session, campaigned across India for Pakistan, and later served as Pakistan's ambassador to Brazil and on its United Nations delegations."
  ur: "Barrister and politician from Pishin in Balochistan (1914–1976): founder of the Balochistan Muslim League and the youngest member of the All-India Muslim League's Working Committee, who represented Balochistan at the 1940 Lahore Resolution session, campaigned across India for Pakistan, and later served as Pakistan's ambassador to Brazil and on its United Nations delegations."
