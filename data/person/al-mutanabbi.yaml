summary:
  ar: "أعظم شعراء العربية ومدّاح الدهر؛ حل بمصر ضيفاً على الأستاذ كافور الإخشيدي وكان فاتك الرومي الإخشيدي يسمع بكرم فاتك وكثرة سخائه غير أنه لا يقدر على قصد خدمته خوفاً من كافور فالتقيا بالصحراء مصادفة من غير ميعاد فحمل له فاتك هدية قيمتها ألف دينار ثم أتبعها بهدايا فاستأذن المتنبي كافور في مدحه فأذن له فمدحه بقصيدته التي أولها لا حيل عندك تهديها ولا مال وفيها كفاتك ودخول الكاف منقصة كالشمس ولت وما للشمس أمثال، فلما توفي فاتك بمصر في شوال سنة خمس وخمسين وثلاث مئة رثاه بقصيدته التي أولها الحزن يقلق والتجمل يردع والدمع بينهما عصيّ طليع وهي من المراثي الفائقة وكان قد خرج من مصر بها {cite:shadharat-dhahab p. 14-15}."
  en: "Arabic's greatest panegyrist; at Kafur's court in Egypt he met the Ikhshidid commander Fatik by chance in the desert — Fatik sent him a thousand-dinar gift, and al-Mutanabbi praised him in the ode 'no stratagem avails you...'; when Fatik died in 355 he mourned him with the towering elegy 'sorrow perturbs, patience dissuades' and left Egypt with it {cite:shadharat-dhahab p. 14-15}."
