label: { ar: "المتنبي", en: "al-Mutanabbi", ur: "متنبی" }
names:
  - { value: "أبو الطيب أحمد بن الحسين المتنبي", kind: full }
gender: male
summary:
  ar: "أعظم شعراء العربية ومدّاح الدهر؛ حل بمصر ضيفاً على الأستاذ كافور الإخشيدي وكان فاتك الرومي الإخشيدي يسمع بكرم فاتك وكثرة سخائه غير أنه لا يقدر على قصد خدمته خوفاً من كافور فالتقيا بالصحراء مصادفة من غير ميعاد فحمل له فاتك هدية قيمتها ألف دينار ثم أتبعها بهدايا فاستأذن المتنبي كافور في مدحه فأذن له فمدحه بقصيدته التي أولها لا حيل عندك تهديها ولا مال وفيها كفاتك ودخول الكاف منقصة كالشمس ولت وما للشمس أمثال، فلما توفي فاتك بمصر في شوال سنة خمس وخمسين وثلاث مئة رثاه بقصيدته التي أولها الحزن يقلق والتجمل يردع والدمع بينهما عصيّ طليع وهي من المراثي الفائقة وكان قد خرج من مصر بها {cite:shadharat-dhahab p. 14-15}."
  en: "Arabic's greatest panegyrist; at Kafur's court in Egypt he met the Ikhshidid commander Fatik by chance in the desert — Fatik sent him a thousand-dinar gift, and al-Mutanabbi praised him in the ode 'no stratagem avails you...'; when Fatik died in 355 he mourned him with the towering elegy 'sorrow perturbs, patience dissuades' and left Egypt with it {cite:shadharat-dhahab p. 14-15}. Born at Kufa in 303/915, he led a rising in the Samawa, was imprisoned at Hims, then served as official poet of Sayf al-Dawla at Aleppo for nine years, of Kafur in Egypt and of Adud al-Dawla at Shiraz before he was killed near Dayr al-Aqul in 354/965 {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-771}."
  ur: "عربی کا عظیم ترین مدحت گو شاعر؛ مصر میں کافور کی دربار میں اخشیدی سردار فاتک سے اتفاقاً صحرا میں ملا — فاتک نے ہزار دینار کا تحفہ بھیجا اور متنبی نے اس کی مدح میں قصیدہ کہا؛ جب فاتک 355ھ میں فوت ہوا تو متنبی نے بلند پایہ مرثیہ لکھا اور مصر سے رخصت ہوا {cite:shadharat-dhahab p. 14-15}۔ 303ھ/915ء میں کوفہ میں پیدا ہوا، سماوہ میں بغاوت کی، حمص میں قید رہا، پھر نو برس حلب میں سيف الدولہ کا، مصر میں کافور کا اور شیراز میں عضدالدولہ کا شاعر رہا، یہاں تک کہ 354ھ/965ء میں دیر عاقول کے قریب مارا گیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-771}۔"
