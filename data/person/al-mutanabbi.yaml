summary:
  ar: "أعظم شعراء العربية ومدّاح الدهر؛ حل بمصر ضيفاً على الأستاذ كافور الإخشيدي وكان فاتك الرومي الإخشيدي يسمع بكرم فاتك وكثرة سخائه غير أنه لا يقدر على قصد خدمته خوفاً من كافور فالتقيا بالصحراء مصادفة من غير ميعاد فحمل له فاتك هدية قيمتها ألف دينار ثم أتبعها بهدايا فاستأذن المتنبي كافور في مدحه فأذن له فمدحه بقصيدته التي أولها لا حيل عندك تهديها ولا مال وفيها كفاتك ودخول الكاف منقصة كالشمس ولت وما للشمس أمثال، فلما توفي فاتك بمصر في شوال سنة خمس وخمسين وثلاث مئة رثاه بقصيدته التي أولها الحزن يقلق والتجمل يردع والدمع بينهما عصيّ طليع وهي من المراثي الفائقة وكان قد خرج من مصر بها {cite:shadharat-dhahab p. 14-15}."
  en: "Arabic's greatest panegyrist; at Kafur's court in Egypt he met the Ikhshidid commander Fatik by chance in the desert — Fatik sent him a thousand-dinar gift, and al-Mutanabbi praised him in the ode 'no stratagem avails you'; when Fatik died in 355 he mourned him with the towering elegy 'sorrow perturbs, patience dissuades' and left Egypt with it {cite:shadharat-dhahab p. 14-15}. Born at Kufa in 303/915, he led a rising in the Samawa, was imprisoned at Hims, then served as official poet of Sayf al-Dawla at Aleppo for nine years, of Kafur in Egypt and of Adud al-Dawla at Shiraz before he was killed near Dayr al-Aqul in 354/965 {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-771}."
  fr: "Le plus grand panégyriste de l'arabe ; à la cour de Kafur en Égypte, il a rencontré par hasard le commandant ikhshidid Fatik dans le désert - Fatik lui a envoyé un cadeau de mille dinars, et al-Mutanabbi l'a loué dans l'ode \"aucun stratagème ne vous sert\" ; quand Fatik est mort en 355 il l'a pleuré avec l'élégie imposante 'déchire des perturbations, la patience dissuade' et a quitté l'Égypte avec elle {cite:shadharat-dhahab p. 14-15}. Né à Koufa en 303/915, il a dirigé un soulèvement dans le Samawa, a été emprisonné à Hims, puis a servi comme poète officiel de Sayf al-Dawla à Alep pendant neuf ans, de Kafur en Égypte et d'Adud al-Dawla à Chiraz avant d'être tué près de Deir al-Aql en 354/965 {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-771}."
  ur: "عربی کا عظیم ترین مدحت گو شاعر؛ مصر میں کافور کی دربار میں اخشیدی سردار فاتک سے اتفاقاً صحرا میں ملا — فاتک نے ہزار دینار کا تحفہ بھیجا اور متنبی نے اس کی مدح میں قصیدہ کہا؛ جب فاتک 355ھ میں فوت ہوا تو متنبی نے بلند پایہ مرثیہ لکھا اور مصر سے رخصت ہوا {cite:shadharat-dhahab p. 14-15}۔ 303ھ/915ء میں کوفہ میں پیدا ہوا، سماوہ میں بغاوت کی، حمص میں قید رہا، پھر نو برس حلب میں سيف الدولہ کا، مصر میں کافور کا اور شیراز میں عضدالدولہ کا شاعر رہا، یہاں تک کہ 354ھ/965ء میں دیر عاقول کے قریب مارا گیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-771}۔"
  es: "El mayor panegírico árabe; en la corte de Kafur en Egipto conoció por casualidad al comandante ikhshidí Fatik en el desierto; Fatik le envió un regalo de mil dinares, y al-Mutanabbi lo alabó en la oda 'ninguna estratagema te sirve'; cuando Fatik murió en 355, lo lloró con la imponente elegía 'el dolor perturba, la paciencia disuade' y se fue de Egipto con ella {cite:shadharat-dhahab p. 14-15}. Nacido en Kufa en 303/915, lideró una rebelión en el Samawa, fue encarcelado en Hims, luego sirvió como poeta oficial de Sayf al-Dawla en Alepo durante nueve años, de Kafur en Egipto y de Adud al-Dawla en Shiraz antes de ser asesinado cerca de Dayr al-Aqul en 354/965 {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-771}."
  tr: "En büyük Arap şairi ve zamanın övgücüsü; Profesör Kafur el-İhşidi'nin misafiri olarak Mısır'a gelmiştir. Fatak el-Rumi el-İhşidi, Fatak'ın cömertliğini ve büyük cömertliğini duymuştur, ancak Kafur'dan korktuğu için ayinine katılamaz. Randevu olmadan tesadüfen çölde karşılaşmışlardır, bu yüzden Fatak ona bin dinar değerinde bir hediye ve ardından hediyeler getirmiştir. El-Mutanabbi, Kafur'dan kendisini övmek için izin istemiştir, Kafur da izin verip övgü bildirmiştir Şiiriyle başlar: 'Onu hediye etmek için ne hilen, ne de zenginliğin var, ve bu senin yeterliliğini barındırır.' 'Kaf' harfi güneş gibi küçülmüştür ve güneşin eşi yoktur. 355 Hicri yılında Mısır'da Şavval'da vefat ettiğinde, şiirine üzülmüş, süslemeler engellenmiş ve aralarındaki gözyaşları öncü bir çubuk gibi başlamış, hüzün ve ölçülülükle başlayan şiirine yakınmıştır. Bu, Mısır'dan ayrılırken gösterdiği olağanüstü ağıtlardan biriydi {alıntı: Shadharat-Dhahab, s. 14-15}."
  id: "Penyair Arab terbesar dan puji zaman; ia datang ke Mesir sebagai tamu Profesor Kafur al-Ikhshidi. Fatak al-Rumi al-Ikhshidi mendengar tentang kemurahan hati dan kemurahan hati Fatak, tetapi ia tidak dapat menghadiri ibadahnya karena takut pada Kafur. Mereka bertemu di gurun secara kebetulan tanpa janji, sehingga Fatak membawakan hadiah senilai seribu dinar, diikuti hadiah. Al-Mutanabbi meminta izin Kafur untuk memujinya, dan ia memberinya izin dan pp. membesarkannya dengan puisinya, yang dimulai de: 'Kamu tidak punya trik untuk memberikannya, juga tidak memiliki kekayaan, dan itu mengandung kecukupanmu.' Huruf 'kaf' berkurang seperti matahari, dan matahari tidak ada tandingannya. Ketika dia meninggal di Mesir di Shawwal pada tahun 355 H, dia meratapi puisinya yang dimulai dengan kesedihan dan pengekangan, hiasan dihentikan, dan air mata di antara mereka menjadi tongkat utama. Itu adalah salah satu elegi luar biasa yang dia bawa saat meninggalkan Mesir {cite:Shadharat-Dhahab, hlm. 14-15}."
