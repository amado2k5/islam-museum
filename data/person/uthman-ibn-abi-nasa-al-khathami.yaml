gender: male
summary:
  ar: "والي الأندلس من قبل عبيدة بن عبد الرحمن السليمي صاحب إفريقية؛ قدمها سنة عشر ومائة وعزل لخمسة أشهر بحذيفة بن الأحوص القيسي ثم عاد {cite:nafh-tib-maqqari p. 272}."
  en: "Governor of al-Andalus under Ubayda of Ifriqiya; he arrived in 110 and was twice interrupted by the short rule of Hudhayfa b. al-Ahwas {cite:nafh-tib-maqqari p. 272}."
  es: "Gobernador de al-Andalus bajo Ubayda de Ifriqiya; llegó en 110 y fue interrumpido dos veces por el breve gobierno de Hudhayfa b. al-Ahwas {cite:nafh-tib-maqqari p. 272}."
  fr: "Gouverneur d'al-Andalus sous Ubayda d'Ifriqiya; il arriva en 110 et fut interrompu à deux reprises par le court règne de Hudhayfa b. al-Ahwas {cite:nafh-tib-maqqari p. 272}."
  ur: "عفریقیہ کے عبیدہ کے ماتحت الاندلس کا گورنر؛ وہ 110 میں پہنچا اور دو بار حذیفہ بن کی مختصر حکمرانی میں خلل پڑا۔ الاحواس {حوالہ: نفح تبع مقری ص۔ 272}۔"
  tr: "Endülüs valisi olarak Ifrikiye hükümdarı Ubeyde bin Abdurrahman el-Süleymi tarafından görevlendirildi; 100 Hicri yılında atandı ve Hudeyfa bin el-Ahvas el-Kaysi tarafından beş ay görevden alındı, ardından geri döndü {atıf:nafh-tib-maqqari, s. 272}."
  id: "Ia menjadi gubernur al-Andalus oleh Ubaidah ibn Abd al-Rahman al-Sulaymi, penguasa Ifriqiya; ia diangkat pada tahun 100 H dan diberhentikan selama lima bulan oleh Hudhayfah ibn al-Ahwas al-Qaysi, lalu kembali {cite:nafh-tib-maqqari, hlm. 272}."
