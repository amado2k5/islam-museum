summary:
  ar: "محمد بن عبد الله بن عمر بن مكي بن عبد الصمد، أبو عبد الله الأموي الدمشقي، المعروف بابن الوكيل، فقيه شافعي أصولي، عارف بالفقه وأصوله، سمع بالقاهرة من ابن دقيق العيد، وبدمشق من شرف الدين الفزاري وإسحاق النحاس وعمه صدر الدين، ودرّس بمشهد الحسين، وناب في الحكم بدمشق، وولاه الناصر تدريس الشامية البرانية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832} توفي سنة 738 هـ بحسب عنوان الترجمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832}"
  en: "Muhammad ibn Abd Allah ibn Umar ibn Makki ibn Abd al-Samad, Abu Abd Allah al-Umawi al-Dimashqi, known as Ibn al-Wakil: a Shafi'i jurist and usulist who knew the law and its principles well. He heard in Cairo from Ibn Daqiq al-Id and in Damascus from Sharaf al-Din al-Fazari, Ishaq al-Nahhas and his uncle Sadr al-Din; he taught at the shrine of al-Husayn, deputised in judging at Damascus, and was given by al-Nasir the teaching of al-Shamiyya al-Barraniyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832} His death is given as 738 AH in the heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832}"
