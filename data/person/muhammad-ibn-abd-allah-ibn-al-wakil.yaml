summary:
  ar: "محمد بن عبد الله بن عمر بن مكي بن عبد الصمد، أبو عبد الله الأموي الدمشقي، المعروف بابن الوكيل، فقيه شافعي أصولي، عارف بالفقه وأصوله، سمع بالقاهرة من ابن دقيق العيد، وبدمشق من شرف الدين الفزاري وإسحاق النحاس وعمه صدر الدين، ودرّس بمشهد الحسين، وناب في الحكم بدمشق، وولاه الناصر تدريس الشامية البرانية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832} توفي سنة 738 هـ بحسب عنوان الترجمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832}"
  en: "Muhammad ibn Abd Allah ibn Umar ibn Makki ibn Abd al-Samad, Abu Abd Allah al-Umawi al-Dimashqi, known as Ibn al-Wakil: a Shafi'i jurist and usulist who knew the law and its principles well. He heard in Cairo from Ibn Daqiq al-Id and in Damascus from Sharaf al-Din al-Fazari, Ishaq al-Nahhas and his uncle Sadr al-Din; he taught at the shrine of al-Husayn, deputised in judging at Damascus, and was given by al-Nasir the teaching of al-Shamiyya al-Barraniyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832} His death is given as 738 AH in the heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832}"
  es: "Muhammad ibn Abd Allah ibn Umar ibn Makki ibn Abd al-Samad, Abu Abd Allah al-Umawi al-Dimashqi, conocido como Ibn al-Wakil: un jurista y usulista shafi'í que conocía bien la ley y sus principios. Estudió en El Cairo con Ibn Daqiq al-Id y en Damasco con Sharaf al-Din al-Fazari, Ishaq al-Nahhas y su tío Sadr al-Din; enseñó en el santuario de al-Husayn, fue juez en Damasco y recibió de al-Nasir la enseñanza de al-Shamiyya al-Barraniyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832} Su muerte se indica como 738 AH en el encabezado. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832}"
  fr: "Muhammad ibn Abd Allah ibn Umar ibn Makki ibn Abd al-Samad, Abu Abd Allah al-Umawi al-Dimashqi, connu sous le nom d'Ibn al-Wakil: juriste et usuliste chaféite, il maîtrisait parfaitement la loi et ses principes. Il étudia au Caire auprès d'Ibn Daqiq al-Id et à Damas auprès de Sharaf al-Din al-Fazari, Ishaq al-Nahhas et son oncle Sadr al-Din. Il enseigna au sanctuaire d'al-Husayn, exerça des fonctions de juge suppléant à Damas et reçut d'al-Nasir l'enseignement d'al-Shamiyya al-Barraniyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832} Sa mort est datée de l'an 738 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8832}"
  ur: "محمد بن عبد اللہ بن عمر بن مکی ابن عبد الصمد، ابو عبد اللہ العموی الدمشقی، ابن الوکیل کے نام سے جانا جاتا ہے: ایک شافعی فقیہ اور اصول پسند جو قانون اور اس کے اصولوں کو اچھی طرح جانتے تھے۔ اس نے قاہرہ میں ابن دقیق العد سے اور دمشق میں شرف الدین الفزاری، اسحاق النحاس اور اپنے چچا صدرالدین سے سنا۔ اس نے امام حسین کے مزار پر درس دیا، دمشق میں عدالت میں تعینات کیا گیا، اور الناصر نے الشامیہ البرانیہ کی تعلیم دی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 8832} عنوان میں ان کی وفات 738ھ بتائی گئی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص8832}"
  tr: "Muhammed ibn Abdullah ibn Ömer ibn Makki ibn Abdül-Samad, Ebu Abdullah el-Umawi el-Dimashqi, İbn el-Vekil olarak bilinir, fıkıh ve onun prensipleri konusunda bilgili bir Şafii hukukçu ve usuliydi. Kahire'de İbn Dakık el-Eid'den, Şam'da ise Şerafeddin el-Fazari, İshaq el-Nahhas ve amcası Sadr el-Din'den eğitim aldı. Meşhed el-Hüseyin'de eğitim gördü, Şam'da vali yardımcısı olarak görev yaptı ve el-Nasir tarafından Levant el-Baraniyya'sını öğretmek üzere atandı. {alıntı:] fiqh-mawsua-kuwaitiyya-noor-v3 s.8832} biyografi başlığına göre 738 Hicri'de öldü. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.8832}"
  id: "Muhammad ibn Abdullah ibn Umar ibn Makki ibn Abd al-Samad, Abu Abdullah al-Umawi al-Dimashqi, dikenal sebagai Ibn al-Wakil, adalah seorang ahli hukum dan usuli Shafi'i yang berpengetahuan tentang hukum dan prinsip-prinsipnya. Ia belajar di Kairo dari Ibn Daqiq al-'Eid, dan di Damaskus dari Sharaf al-Din al-Fazari, Ishaq al-Nahhas, dan pamannya Sadr al-Din. Ia belajar di Mashhad al-Husayn, menjabat sebagai wakil gubernur di Damaskus, dan ditunjuk oleh al-Nasir untuk mengajar al-Baraniyya Levantine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8832} meninggal pada tahun 738 H menurut judul biografi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8832}"
