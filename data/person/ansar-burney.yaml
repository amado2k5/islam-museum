summary:
  ar: "أنصار برني (وُلد في 14 أغسطس 1956) محامٍ وناشط حقوق إنسان باكستاني من كراتشي، سُجن في عهد الحكم العسكري لنشاطه الطلابي المؤيد للديمقراطية، فأسس عند إطلاقه جمعية مساعدة السجناء ثم صندوق أنصار برني الدولي العامل على تحرير السجناء المظلومين وإنقاذ المخطوفين ومكافحة الاتجار بالبشر، وشغل منصب الوزير الاتحادي لحقوق الإنسان في الحكومة المؤقتة 2007–2008."
  en: "Ansar Burney (born 14 August 1956) is a Pakistani lawyer and human-rights activist from Karachi who, after imprisonment under martial law for his pro-democracy student activism, founded the Prisoners Aid Society and the Ansar Burney Trust International — working to free wrongfully held prisoners, recover kidnapped children and fight human trafficking — and served as Pakistan's federal minister for human rights in the 2007–2008 caretaker cabinet."
  ur: "انصار برنی (پیدائش 14 اگست 1956ء) کراچی سے تعلق رکھنے والے پاکستانی وکیل اور انسانی حقوق کے فعالیت پسند ہیں جو مارشل لا دور میں جمہوریت نواز طالب علم سرگرمیوں پر قید رہے، رہائی کے بعد پرزنرز ایڈ سوسائٹی اور انصار برنی ٹرسٹ انٹرنیشنل قائم کیے جو بے گناہ قیدیوں کی رہائی، اغوا شدہ بچوں کی بازیابی اور انسانی اسمگلنگ کے خاتمے کے لیے کام کرتے ہیں، اور 2007ء–2008ء کی نگراں کابینہ میں وفاقی وزیر برائے انسانی حقوق رہے۔"
