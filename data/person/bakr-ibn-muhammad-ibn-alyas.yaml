summary:
  ar: "عامل السامانيين بنيسابور؛ اتصل به أسفار بن شيرويه وخدمه فسيره إلى جرجان ليفتحها فما زال به حتى توفي بها فولاها الأمير السعيد نصر بن أحمد أسفار سنة 315هـ {cite:kamil-ibn-al-athir p. 129-130}."
  en: "Samanid agent at Nishapur; Asfar attached himself to him and was sent against Jurjan, and when Bakr died there Nasr ibn Ahmad confirmed Asfar over it in 315 {cite:kamil-ibn-al-athir p. 129-130}."
  es: "Agente samaní en Nishapur; Asfar se unió a él y fue enviado contra Jurjan, y cuando Bakr murió allí, Nasr ibn Ahmad confirmó a Asfar sobre ella en 315 {cite:kamil-ibn-al-athir p. 129-130}."
  fr: "agent samanide à Nishapur; Asfar s'est attaché à lui et a été envoyé contre Jurjan, et lorsque Bakr est mort là-bas, Nasr ibn Ahmad a confirmé Asfar à ce poste en 315 {cite:kamil-ibn-al-athir p. 129-130}."
  ur: "نیشاپور میں سامانی ایجنٹ؛ اسفار نے اپنے آپ کو اس سے جوڑ لیا اور اسے جرجان کے خلاف بھیجا گیا اور جب بکر کا انتقال وہاں ہوا تو نصر بن احمد نے 315 میں اسفار کی تصدیق کی۔ 129-130}۔"
