summary:
  ar: "أبو العباس الحريري المصري؛ نشأ في العبادة والاشتغال بالعلم وقرأ القرآن بالسبع ثم خدم سيدي محمد بن عنان وأخذ عنه الطريق وزوّجه ابنته وقربه أكثر من جميع أصحابه، ثم صحب بعده سيدي علي المرصفي وأذن له أن يتصدى للإرشاد، ولم يرشد حتى سمع الهواتف تأمره بذلك فدعا إلى طريق الله ولقّن نحو عشرة آلاف مريد؛ ولما حضرته الوفاة قال: خرجنا من الدنيا ولم يصح معنا صاحب في الطريق؛ وبنى له زاوية بمصر وعدة مساجد بدمياط والمحلة وغيرهما، ووقعت له كرامات كثيرة منها أنه جلس عند الشعراني بعد المغرب في رمضان فقرأ قبل أذان العشاء خمس ختمات، ووى أربعين يوماً، وكان كثير التحمل لهموم الخلق حتى صار كأنه شن بالٌ وكان مع ذلك لا يعد نفسه من أهل الطريق؛ توفي بثغر دمياط ودُفن بزاوية الشيخ شمس الدين الدمياطي وقبره بها ظاهر يُزار {cite:shadharat-dhahab p. 677-678}."
  en: "Ibn 'Anan's favourite son-in-law and al-Murshifi's successor — he would not give guidance until voices bade him, then instructed some ten thousand murids; 'we left the world and no companion in the Path went with us' were his dying words; five khatmas before the maghrib adhan in al-Sha'rani's presence, a forty-day fast; buried at Damietta in al-Shami's zawiya, his grave still visited {cite:shadharat-dhahab p. 677-678}."
  fr: "Gendre favori d’Ibn Anan et successeur d’al-Marsafi, il ne voulut guider qu’après que des voix le lui eurent commandé, puis instruisit environ dix mille murids ; « nous avons quitté ce monde sans compagnon dans la voie » furent ses derniers mots. Le récit lui attribue cinq khatmas avant l’appel à la prière de la nuit en présence d’al-Sha’rani et un jeûne de quarante jours ; enterré à Damiette dans la zawiya de Shams al-Din al-Damyati, sa tombe est toujours visitée {cite:shadharat-dhahab p. 677-678}."
  es: "El yerno favorito de Ibn 'Anan y sucesor de al-Murshifi, no impartía orientación hasta que las voces se lo ordenaban, y entonces instruyó a unos diez mil murids; \"dejamos el mundo y ningún compañero en el Camino se fue con nosotros\" fueron sus últimas palabras; cinco khatmas antes del adhan del maghrib en presencia de al-Sha'rani, un ayuno de cuarenta días; enterrado en Damietta en la zawiya de al-Shami, su tumba todavía es visitada {cite:shadharat-dhahab p. 677-678}."
  ur: "ابن عنان کے پسندیدہ داماد اور مرشفی کے جانشین - وہ اس وقت تک رہنمائی نہیں کرتے تھے جب تک کہ آوازیں اسے نہ مانیں، پھر دس ہزار مریدوں کو ہدایت نہ دیں۔ 'ہم دنیا سے چلے گئے اور راہ میں کوئی ساتھی ہمارے ساتھ نہ گیا' اس کے مرتے ہوئے الفاظ تھے۔ الشعرانی کی موجودگی میں مغرب کی اذان سے پہلے پانچ خطائیں، چالیس روزہ روزہ؛ الشامی کے زاویہ میں دمیطہ میں دفن ہوئے، ان کی قبر اب بھی دیکھی جاتی ہے۔ 677-678}۔"
  tr: "Ebu el-Abbas el-Hariri el-Masri; ibadet ve bilgiye bağlılıkla büyüdü, Kur'an'ı yedi ayet halinde okudu, sonra Sidi Muhammed bin Anan'a hizmet etti, ondan yolunu seçti, kızıyla evlendi ve onu tüm arkadaşlarından daha yakın yaptı. Sonra Sidi Ali el-Marsafi ile birlikte hareket etti ve ona rehberlik etmesine izin verdi. Rehberliği ancak kendisinden emreden bir çağrı duydu, bu yüzden Allah'ın yoluna seslendi ve yaklaşık on bin öğrenciye eğitim verdi. Ölüm yaklaşırken şöyle dedi: Bu dünyadan ayrıldık ve yolda bizimle birlikte bir yoldaş bulunmadı; Mısır'da bir zaviye ve Damietta, Mahalla ve başka yerlerde birkaç cami inşa etti. Birçok mucize başına geldi; Ramazan'da Mağrip bittikten sonra El-Şa'rani ile oturup, işa ezan öncesinde kırk gün süren beş hatmat namazı okudu. İnsanların endişelerine çok sabırlıydı, ta ki bir baş belası gibi görünene kadar, ancak kendini yol halkı arasında görmedi. Damietta limanında öldü ve mezarı açıkça ziyaret edildiği Şeyh Şemseddin El-Dimiati'nin Zawiya'sına defnedildi {atıf:shadharat-dhahab, s. 677-678}."
  id: "Abu al-Abbas al-Hariri al-Masri; ia tumbuh dalam ibadah dan pengabdian pada ilmu, membaca Al-Qur'an dalam tujuh ayat, kemudian melayani Sidi Muhammad ibn Anan, mengambil jalan darinya, menikahi putrinya, dan membawanya lebih dekat daripada semua sahabatnya. Ia kemudian menemani Sidi Ali al-Marsafi dan mengizinkannya untuk menjalani bimbingan. Ia tidak menerima bimbingan sampai mendengar panggilan darinya yang memerintahkannya, sehingga ia memanggil jalan Allah dan mengajar sekitar sepuluh ribu murid. Ketika kematian mendekat, ia berkata: Kami meninggalkan dunia ini, dan tidak ada teman yang ditemukan bersama kami dalam perjalanan; ia membangun zawiya di Mesir dan beberapa masjid di Damietta, Mahalla, dan tempat lain. Banyak mukjizat menimpanya, termasuk duduk bersama Al-Sha'rani setelah Maghrib di Ramadan, di mana ia membaca lima shalat Khatmat sebelum panggilan shalat Isha, berlangsung selama empat puluh hari. Ia sangat sabar dengan kekhawatiran orang-orang sampai tampak sebagai pembuat masalah, namun ia tidak menganggap dirinya sebagai salah satu orang di jalan. Ia meninggal di pelabuhan Damietta dan dimakamkan di Zawiya Sheikh Shams al-Din Al-Dimiati, di mana makamnya jelas dikunjungi {cite:shadharat-dhahab, hlm. 677-678}."
