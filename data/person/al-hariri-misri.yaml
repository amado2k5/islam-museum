summary:
  ar: "أبو العباس الحريري المصري؛ نشأ في العبادة والاشتغال بالعلم وقرأ القرآن بالسبع ثم خدم سيدي محمد بن عنان وأخذ عنه الطريق وزوّجه ابنته وقربه أكثر من جميع أصحابه، ثم صحب بعده سيدي علي المرصفي وأذن له أن يتصدى للإرشاد، ولم يرشد حتى سمع الهواتف تأمره بذلك فدعا إلى طريق الله ولقّن نحو عشرة آلاف مريد؛ ولما حضرته الوفاة قال: خرجنا من الدنيا ولم يصح معنا صاحب في الطريق؛ وبنى له زاوية بمصر وعدة مساجد بدمياط والمحلة وغيرهما، ووقعت له كرامات كثيرة منها أنه جلس عند الشعراني بعد المغرب في رمضان فقرأ قبل أذان العشاء خمس ختمات، ووى أربعين يوماً، وكان كثير التحمل لهموم الخلق حتى صار كأنه شن بالٌ وكان مع ذلك لا يعد نفسه من أهل الطريق؛ توفي بثغر دمياط ودُفن بزاوية الشيخ شمس الدين الدمياطي وقبره بها ظاهر يُزار {cite:shadharat-dhahab p. 677-678}."
  en: "Ibn 'Anan's favourite son-in-law and al-Murshifi's successor — he would not give guidance until voices bade him, then instructed some ten thousand murids; 'we left the world and no companion in the Path went with us' were his dying words; five khatmas before the maghrib adhan in al-Sha'rani's presence, a forty-day fast; buried at Damietta in al-Shami's zawiya, his grave still visited {cite:shadharat-dhahab p. 677-678}."
