  ur: "ابو الغشام بن طریف"
summary:
  ar: "رجل من آل طريف حبسه أبو العتاهية بظهر ومعه جماعة من آل يعفر، ثم فتحه أهل ظهر من الحبس سنة 288هـ بعد مقتل ابن أبي عباد، وأقام بظهر معهم."
  en: "A man of Al Tarif jailed by Abu al-Atahiya at Zahr with a group of Al Ya'fur, whom the men of Zahr freed in 288 AH after Ibn Abi Abbad was killed and who stayed at Zahr with them."
  ur: "آل طریف کا ایک شخص جسے ابو العتاہیہ نے ظہر میں آل یعفر کی ایک جماعت کے ساتھ قید کیا، اور جسے ظہر کے لوگوں نے سنہ 288ھ میں ابن ابی عباد کے قتل کے بعد آزاد کر دیا اور وہ ان کے ساتھ ظہر میں ٹھہرا۔"
