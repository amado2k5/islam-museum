summary:
  ar: "عيسى بن أبي عيسى ماهان، أبو جعفر الرازي، يقول الذهبي في «ميزان الاعتدال» إنه صالح الحديث، روى عن الشعبي وعطاء وقتادة والربيع بن أنس، ولد بالبصرة واستوطن الري، وعنه ابنه عبد الله وأبو نعيم وعلي بن الجعد. وثّقه ابن معين، وقال أبو حاتم صدوق، وقال أحمد والنسائي ليس بالقوي، وقال ابن المديني ثقة كان يخلط، وقال الفلاس سيئ الحفظ، وقال ابن حبان ينفرد بالمناكير عن المشاهير، ومن مروياته حديث طويل في المعراج فيه ألفاظ منكرة جداً وحديث القنوت في الصبح {cite:mizan-itidal-bijawi-v3 p. 319-320}."
  en: "Isa ibn Abi Isa Mahan, Abu Ja'far al-Razi, whom al-Dhahabi's Mizan al-I'tidal calls fair in hadith; he narrated from al-Sha'bi, Ata, Qatada and al-Rabi' ibn Anas, was born in Basra and settled in Rayy, and his son Abd Allah, Abu Nu'aym and Ali ibn al-Ja'd narrated from him. Ibn Ma'in declared him trustworthy and Abu Hatim truthful; Ahmad and al-Nasa'i said not strong, Ibn al-Madini trustworthy but confused, al-Fallas of poor memory, and Ibn Hibban that he transmits objectionable reports alone from well-known narrators; among them are a long hadith on the Night Journey with very objectionable wordings and the report of qunut in the dawn prayer."
  fr: "Isa ibn Abi Isa Mahan, Abu Ja'far al-Razi, que le Mizan al-I'tidal d'al-Dhahabi dit acceptable dans le hadith ; il rapporta d'al-Sha'bi, d'Ata, de Qatada et d'al-Rabi' ibn Anas, naquit à Bassora et s'établit à Rayy, et son fils Abd Allah, Abu Nu'aym et Ali ibn al-Ja'd rapportèrent de lui. Ibn Ma'in le déclara digne de confiance et Abu Hatim véridique ; Ahmad et al-Nasa'i dirent pas solide, Ibn al-Madini digne de confiance mais confus, al-Fallas de mauvaise mémoire, et Ibn Hibban qu'il rapporte seul des récits répréhensibles d'après des transmetteurs connus ; parmi eux figurent un long hadith sur le Voyage nocturne aux formulations très répréhensibles et le récit du qunut dans la prière de l'aube."
  es: "Isa ibn Abi Isa Mahan, Abu Ja'far al-Razi, a quien el Mizan al-I'tidal de al-Dhahabi llama justo en los hadices; narró de al-Sha'bi, Ata, Qatada y al-Rabi' ibn Anas, nació en Basora y se estableció en Rayy, y su hijo Abd Allah, Abu Nu'aym y Ali ibn al-Ja'd narraron de él. Ibn Ma'in lo declaró digno de confianza y Abu Hatim veraz; Ahmad y al-Nasa'i dijeron que no era fuerte, Ibn al-Madini digno de confianza pero confuso, al-Fallas de mala memoria, e Ibn Hibban que transmite informes objetables solo de narradores conocidos; entre ellos hay un largo hadiz sobre el Viaje Nocturno con formulaciones muy objetables y el informe del qunut en la oración del amanecer."
  ur: "عیسیٰ بن ابی عیسیٰ مہان، ابو جعفر الرازی، جنہیں الذہبی کا میزان الاطلاع حدیث میں منصفانہ کہتا ہے۔ انہوں نے الشعبی، عطا، قتادہ اور ربیع بن انس سے روایت کی، وہ بصرہ میں پیدا ہوئے اور رے میں آباد ہوئے، اور ان سے ان کے بیٹے عبداللہ، ابو نعیم اور علی بن الجعد نے روایت کی ہے۔ ابن معین نے اسے ثقہ اور ابو حاتم کو سچا قرار دیا۔ احمد اور النسائی نے کہا کہ مضبوط نہیں، ابن المدینی ثقہ لیکن مبہم، کمزور حافظہ والا الفلاس، اور ابن حبان نے کہا کہ وہ معروف راویوں سے اکیلے ہی قابل اعتراض رپورٹیں نقل کرتے ہیں۔ ان میں رات کے سفر پر ایک طویل حدیث جس میں انتہائی قابل اعتراض الفاظ اور فجر کی نماز میں قنوت کی روایت ہے۔"
