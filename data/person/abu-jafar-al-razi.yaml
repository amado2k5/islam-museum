summary:
  ar: "عيسى بن أبي عيسى ماهان، أبو جعفر الرازي، يقول الذهبي في «ميزان الاعتدال» إنه صالح الحديث، روى عن الشعبي وعطاء وقتادة والربيع بن أنس، ولد بالبصرة واستوطن الري، وعنه ابنه عبد الله وأبو نعيم وعلي بن الجعد. وثّقه ابن معين، وقال أبو حاتم صدوق، وقال أحمد والنسائي ليس بالقوي، وقال ابن المديني ثقة كان يخلط، وقال الفلاس سيئ الحفظ، وقال ابن حبان ينفرد بالمناكير عن المشاهير، ومن مروياته حديث طويل في المعراج فيه ألفاظ منكرة جداً وحديث القنوت في الصبح {cite:mizan-itidal-bijawi-v3 p. 319-320}."
  en: "Isa ibn Abi Isa Mahan, Abu Ja'far al-Razi, whom al-Dhahabi's Mizan al-I'tidal calls fair in hadith; he narrated from al-Sha'bi, Ata, Qatada and al-Rabi' ibn Anas, was born in Basra and settled in Rayy, and his son Abd Allah, Abu Nu'aym and Ali ibn al-Ja'd narrated from him. Ibn Ma'in declared him trustworthy and Abu Hatim truthful; Ahmad and al-Nasa'i said not strong, Ibn al-Madini trustworthy but confused, al-Fallas of poor memory, and Ibn Hibban that he transmits objectionable reports alone from well-known narrators; among them are a long hadith on the Night Journey with very objectionable wordings and the report of qunut in the dawn prayer."
