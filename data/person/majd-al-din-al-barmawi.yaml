summary:
  ar: "مجد الدين إسماعيل البرماوي المصري الشافعي؛ ولد في حدود الخمسين وسبعمائة ودخل القاهرة قديماً وأخذ عن المشايخ وسمع ومهر في الفقه والفنون وتصدى للتدريس وخطب بجامع عمرو بمصر وتوفي في نصف ربيع الآخر سنة أربع وثلاثين وثمانمائة وكان عنده فضيلة ومعرفة ويحاضر بالأدب وغيره {cite:shadharat-dhahab p. 208}."
  en: "Majd al-Din Isma'il al-Barmawi (b. ~750) — khatib at Cairo's Amr mosque, learned in fiqh and the arts and a lecturer on adab; died mid-Rabi' II 834 {cite:shadharat-dhahab p. 208}."
  es: "Majd al-Din Isma'il al-Barmawi (n. ~750): khatib en la mezquita Amr de El Cairo, erudito en fiqh y artes y profesor de adab; murió a mediados de Rabi' II 834 {cita: shadharat-dhahab p. 208}."
  fr: "Majd al-Din Isma'il al-Barmawi (né ~ 750) — khatib à la mosquée Amr du Caire, instruit en fiqh et en arts et conférencier en adab; est mort au milieu de Rabi' II 834 {cite: shadharat-dhahab p. 208}."
  ur: "مجدالدین اسماعیل البرماوی ⁦(متوفی ~750)⁩ - قاہرہ کی عمرو مسجد میں خطیب، فقہ اور فنون کی تعلیم حاصل کی اور ادب پر لیکچرر؛ متوفی وسط ربیع دوم 834 {حوالہ: شدارت ذہاب ص۔ 208}۔"
  tr: "Majd el-Din İsmail el-Barmawi el-Masri el-Şafii; yaklaşık 750 yılında doğdu, ilk zamanlarda Kahire'ye girdi, şeyhlerin yanında eğitim aldı, fıkıh ve sanat alanında bilgi ve uzmanlık kazandı, öğretmenlik yaptı ve Mısır'daki Amr Camii'nde vaazlar verdi. 834 Hicri yılında Rabi'al-Thani'nin ortasında vefat etti. Erdem ve bilgiye sahipti, edebiyat ve diğer konularda dersler verdi {atıf:shadharat-dhahab, s. 208}."
  id: "Majd al-Din Ismail al-Barmawi al-Masri al-Shafi'i; lahir sekitar tahun 750, masuk Kairo pada masa awal, belajar di bawah para sheikh, memperoleh pengetahuan dan keahlian dalam bidang hukum dan seni, mulai mengajar, dan menyampaikan khotbah di Masjid Amr di Mesir. Ia meninggal di tengah Rabi' al-Thani pada tahun 834 H. Ia memiliki kebajikan dan pengetahuan, mengajar tentang sastra dan mata pelajaran lain {cite:shadharat-dhahab, hlm. 208}."
