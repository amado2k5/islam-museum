summary:
  ar: "بطاقة أولية لأروى بنت كريز بن ربيعة، والدة عثمان بن عفان وابنة عم النبي في الجاهلية والإسلام، ماتت في أوائل القرن السابع؛ تذكرها كتب التراجم ولم تُراجع ترجمتها على الصفحة بعد."
  en: "Draft card for Arwa bint Kurayz ibn Rabi'a, mother of Uthman ibn Affan and a cousin of the Prophet, who died in the early seventh century; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar de Arwa bint Kurayz ibn Rabi'a, madre de Uthman ibn Affan y prima del Profeta, fallecida a principios del siglo VII; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet pour Arwa bint Kurayz ibn Rabi'a, mère d'Uthman ibn Affan et cousine du Prophète, décédée au début du VIIe siècle; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "عروہ بنت کریز ابن ربیعہ کے لیے ڈرافٹ کارڈ، عثمان بن عفان کی والدہ اور رسول اللہ کی کزن، جو ساتویں صدی کے اوائل میں فوت ہوئیں؛ سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Osman bin Affan'ın annesi ve Peygamber'in kuzeni Arwa bint Kariz bin Rabi'ah'ın ön kartı, yedinci yüzyılın başlarında vefat etti; biyografik kitaplarda kendisi ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Arwa bint Kariz bin Rabi'ah, ibu dari Uthman bin Affan dan sepupu Nabi pada era pra-Islam dan Islam, yang meninggal pada awal abad ketujuh; buku biografi menyebutkannya dan biografinya belum diulas di halaman tersebut."
