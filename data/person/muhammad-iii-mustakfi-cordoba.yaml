summary:
  ar: "محمد بن عبد الرحمن بن عبيد الله بن الناصر الأموي، أبو عبد الرحمن، المستكفي بالله ⁦(366 - 416 هـ / 976 - 1025 م)⁩: صاحب قرطبة من ملوك الأمويين بالأندلس، ثار بطائفة من الغوغاء على المستظهر بالله فقتلوه وتولى الأمر بعده سنة 414 هـ وأقام سبعة عشر شهراً ثم خلعه أهل قرطبة وتوفي مقتولاً أو مسموماً. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 190–191}"
  en: "Muhammad ibn Abd al-Rahman ibn Ubaydallah ibn al-Nasir al-Umawi, Abu Abd al-Rahman, al-Mustakfi bi-llah (366-416 AH / 976-1025): lord of Cordoba among the Umayyad rulers of al-Andalus, who rose with a band of rabble against al-Mustazhir bi-llah, whom they killed, and took power in 414 AH; he lasted seventeen months before the people of Cordoba deposed him, and he died killed or poisoned. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 190–191}"
  es: "Muhammad ibn Abd al-Rahman ibn Ubaydallah ibn al-Nasir al-Umawi, Abu Abd al-Rahman, al-Mustakfi bi-llah (366-416 AH / 976-1025): señor de Córdoba entre los gobernantes omeyas de al-Ándalus, que se alzó con una turba contra al-Mustazhir bi-llah, a quien asesinaron, y tomó el poder en el año 414 AH; su reinado duró diecisiete meses antes de que el pueblo de Córdoba lo depusiera, y murió asesinado o envenenado. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 190–191}"
  fr: "Muhammad ibn Abd al-Rahman ibn Ubaydallah ibn al-Nasir al-Umawi, Abu Abd al-Rahman, al-Mustakfi bi-llah (366-416 AH / 976-1025): seigneur de Cordoue parmi les souverains omeyyades d’al-Andalus, il se souleva avec une bande de rebelles contre al-Mustazhir bi-llah, qu’ils assassinèrent, et prit le pouvoir en 414 AH; il régna dix-sept mois avant d’être déposé par les habitants de Cordoue, et mourut assassiné ou empoisonné. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 pp. 190–191}"
  ur: "محمد بن عبدالرحمٰن بن عبیداللہ ابن الناصر العموی، ابو عبدالرحمن، المستقفی باللہ ⁦(366-416ھ / 976-1025)⁩: اندلس کے اموی حکمرانوں میں قرطبہ کا آقا، جس نے المستقبل کے خلاف اٹھ کھڑے ہوئے۔ باللہ، جسے انہوں نے قتل کیا، اور 414 ہجری میں اقتدار سنبھالا۔ قرطبہ کے لوگوں کے اسے معزول کرنے سے پہلے وہ سترہ مہینے تک رہا، اور وہ مارا گیا یا زہر دے کر مر گیا۔ {حوالہ:عالم-زرقلی-در-العلم-2002 جلد۔ 6 صفحہ 190–191}"
  tr: "Muhammed bin Abdülrahman ibn Ubeyd Allah ibn el-Nasir el-Emevi, Ebu Abdülrahman, el-Mustasakifi Billah (366 - 416 Hicri / 976 - 1025 M.S.): Endülüs'teki Emevi krallarından biri olan Kordoba'nın hükümdarı, el-Mustazir bi-Allah'a karşı bir grup kalabalıkla ayaklandı ve onu öldürdü. 414 Hicri'de onun ardından iktidarı ele geçirdi, on yedi ay kaldı, ardından Kordoba halkı onu tahttan indirdi ve ya öldürülmüş ya da zehirlenmiş olarak öldü. {cite:alam-zirikli-dar-al-ilm-2002 cilt 6 ss. 190–191}"
  id: "Muhammad ibn Abd al-Rahman ibn Ubayd Allah ibn al-Nasir al-Umayyad, Abu Abd al-Rahman, al-Mustasakifi Billah (366 - 416 H / 976 - 1025 M): Penguasa Cordoba, salah satu raja Umayyah di al-Andalus, memberontak bersama sekelompok massa melawan al-Mustadhir bi-Allah dan membunuhnya. Ia mengambil alih kekuasaan setelahnya pada tahun 414 H, tinggal selama tujuh belas bulan, kemudian rakyat Cordoba menggulingkannya, dan ia meninggal entah dibunuh atau diracun. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 hlm. 190–191}"
