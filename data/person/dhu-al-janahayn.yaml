label: { ar: "ذو الجناحين", en: "Dhu'l-Janahayn", es: "Dhu'l-Janahayn", fr: "Dhu'l-Janahayn", ur: "ذوالجناحین" }
summary:
  ar: "ملك جمع فارس بنهاوند، قطع نهرهم للمغيرة بن شعبة رسولاً إليه فأقعده في بهجة الملك على سريره وتاجه وأبناء الملوك سماطين، فجعل المغيرة يطعن برمحه في بسطهم ليغضبهم ووثب فقعد مع الملك على سريره فجذبوه فقال إنا لا نفعل برسلكم هكذا، فقال الملك إن شئتم قطعنا إليكم قال بل نقطع إليكم فتسلل المسلمون كل خمسة وستة إليهم، ووقع ذو الجناحين عن بغلة شهباء في الوقعة فانشق بطنه {cite:muruj-al-dhahab p. 618-619}."
  en: "The Persian king-commander at Nahawand — al-Mughira's famous embassy to his throne, the spear-poked carpets and the leap onto the royal seat; he fell from his grey mule in the rout and split his belly {cite:muruj-al-dhahab p. 618-619}."
  es: "El rey-comandante persa en Nahawand — la famosa embajada de al-Mughira a su trono, las alfombras atravesadas por lanzas y el salto al asiento real; cayó de su mula gris en la desbandada y se partió el vientre {cite:muruj-al-dhahab p. 618-619}."
  fr: "Le roi-commandant perse à Nahawand — la fameuse ambassade d'al-Mughira à son trône, les tapis percés de lances et le saut sur le siège royal; il tomba de sa mule grise dans la déroute et se fendit le ventre {cite:muruj-al-dhahab p. 618-619}."
  ur: "نہاوند میں فارسی بادشاہ کا کمانڈر - المغیرہ کا اپنے تخت کے لیے مشہور سفارت خانہ، نیزے سے پھنسے ہوئے قالین اور شاہی نشست پر چھلانگ؛ وہ اپنے سرمئی خچر سے راستے میں گرا اور اس کا پیٹ پھٹ گیا۔ 618-619}۔"
  tr: "Bir kral Safen'i Nahavand'da topladı. Nehirlerini El-Muhira bin Şuba ona elçi olarak geçti, onu kralın avlusunda tahtı ve tacına oturttu ve kralların oğulları dağıldı. El-Muhira onları kızdırmak için mızrağıyla bıçakladı, ardından atlayıp kralın yatağına oturdu, kral onu çekip 'Elçilerinize bunu yapmayacağız.' dedi. Kral, 'İsterseniz sizi keseriz.' dedi. Müslümanlar her beş-altı kişiden biri gizlice girdi. İki Kanatlı Adam savaşta Şahba'nın katırından düştü ve midesi yarıldı {cite:muruj-al-dhahab, s. 618-619}."
  id: "Seorang raja mengumpulkan Persia di Nahavand. Sungai mereka diseberangi oleh Al-Mughira ibn Shu'ba sebagai utusan kepadanya, mendudukkannya di halaman raja di atas takhta dan mahkotanya, dan anak-anak raja tercerai-berai. Al-Mughira menusuk mereka dengan tombaknya untuk membuat marah dan melompat serta duduk bersama raja di ranjangnya, yang menariknya dan berkata, 'Kami tidak akan melakukan ini pada utusanmu.' Raja berkata, 'Jika kau mau, kami akan memotong jalanmu.' Muslim menyelinap masuk setiap lima atau enam orang. Orang Bersayap Dua jatuh dari keledai Shahba dalam pertempuran, dan perutnya pecah {cite:muruj-al-dhahab, hlm. 618-619}."
