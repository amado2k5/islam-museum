label: { ar: "ذو الجناحين", en: "Dhu'l-Janahayn" }
summary:
  ar: "ملك جمع فارس بنهاوند، قطع نهرهم للمغيرة بن شعبة رسولاً إليه فأقعده في بهجة الملك على سريره وتاجه وأبناء الملوك سماطين، فجعل المغيرة يطعن برمحه في بسطهم ليغضبهم ووثب فقعد مع الملك على سريره فجذبوه فقال إنا لا نفعل برسلكم هكذا، فقال الملك إن شئتم قطعنا إليكم قال بل نقطع إليكم فتسلل المسلمون كل خمسة وستة إليهم، ووقع ذو الجناحين عن بغلة شهباء في الوقعة فانشق بطنه {cite:muruj-al-dhahab p. 618-619}."
  en: "The Persian king-commander at Nahawand — al-Mughira's famous embassy to his throne, the spear-poked carpets and the leap onto the royal seat; he fell from his grey mule in the rout and split his belly {cite:muruj-al-dhahab p. 618-619}."
