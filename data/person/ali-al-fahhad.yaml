  fr: "Le mamluk de Sanjar Shah (mort en 651) – un champion émir qui, quand son maître a été tué, a quitté le monde pour adorer ; il avait l’habitude de se rappeler comment son seigneur ouvrait le coffre en or et disait « prendre avec vos deux mains », et qu’il a tout laissé pour Dieu {cite:shadharat-dhahab p. 259}."
  es: "El mameluco de Sanjar Shah (m. 651) — un emir campeón que, cuando su señor murió, dejó el mundo para adorar; solía recordar cómo su señor abría el cofre de oro y decía 'tómalo con tus dos manos', y que lo dejó todo para Dios {cita: shadharat-dhahab p. 259}."
