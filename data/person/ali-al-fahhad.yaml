  ar: "مملوك سنجر شاه بن غازي صاحب الجزيرة؛ كان أميراً شجاعاً فلما قُتل سيده ترك الدنيا ولزم العبادة وصار من كبار الأعاجيب بالزهد والورع؛ حكى عن نفسه أن سيده كان إذا أراد أن يعطيه شيئاً فتح له خزانة الذهب وقال خذ بيديك، وترك كل ذلك لله؛ وله أحوال مشهورة {cite:shadharat-dhahab p. 259}."
