summary:
  ar: "سيد مير قاسم سياسي كشميري شارك في صياغة دستور جامو وكشمير وأسّس حزب المؤتمر في الولاية، وتولّى رئاسة وزرائها من 1971 إلى 1975، ثم استقال ليفسح المجال لعودة الشيخ عبد الله."
  en: "Syed Mir Qasim was a Kashmiri politician who helped draft the Jammu and Kashmir constitution, founded the Congress party in the state, and served as its chief minister from 1971 to 1975, resigning to make way for Sheikh Abdullah's return."
  ur: "سید میر قاسم کشمیری سیاست دان تھے جنھوں نے جموں و کشمیر کے آئین کی تدوین میں حصہ لیا، ریاست میں کانگریس کی بنیاد رکھی اور 1971ء سے 1975ء تک اس کے وزیر اعلیٰ رہے، پھر شیخ عبد اللہ کی واپسی کے لیے استعفا دیا۔"
