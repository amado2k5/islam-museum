summary:
  ar: "هابيل خوراكيوالا (وُلد سنة 1942 في بومباي)، رجل أعمال صيدلاني هندي، مؤسس شركة ووكهارت ورئيسها، التي بناها من شركة والده «وورلي للكيماويات» بعد تأسيسها سنة 1967 لتصبح مجموعة متعددة الجنسيات في الأدوية الجنيسة والتقنية الحيوية والمستشفيات. تخرج في الصيدلة من جامعة بوردو، وعمل مستشاراً لجامعة همدرد وقنصلاً فخرياً عاماً للسويد في مومباي."
  en: "Habil Khorakiwala (born 1942 in Bombay) is an Indian pharmaceutical businessman, founder and chairman of Wockhardt, which he built from his father's Worli Chemical Works after founding the company in 1967 into a multinational group in generics, biotechnology and hospitals. A pharmacy graduate of Purdue University, he has served as chancellor of Jamia Hamdard University and as Sweden's honorary consul general in Mumbai."
  ur: "ہابیل خوراکی والا (پیدائش 1942، بمبئی) بھارتی ادویات ساز کاروباری، ووکارڈ کے بانی و چیئرمین ہیں، جسے انھوں نے 1967 میں قائم کر کے اپنے والد کی ورلی کیمیکل ورکس سے جنیرک ادویات، بائیو ٹیکنالوجی اور اسپتالوں کے کثیر القومی گروپ میں بدل دیا۔ پرڈیو یونیورسٹی سے فارمیسی کے فارغ التحصیل، وہ جامعہ ہمدرد کے چانسلر اور ممبئی میں سویڈن کے اعزازی قونصل جنرل رہ چکے ہیں۔"

