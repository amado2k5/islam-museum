label:
  ar: القاسم بن حمود المأمون
  en: al-Qasim ibn Hammud al-Ma'mun
summary:
  ar: "القاسم بن حمود بن ميمون الإدريسي، أخو علي بن حمود الناصر؛ اختصا معاً بسليمان بن الحكم المستعين لما نصبه البرابرة خليفة بالأندلس وأحسنا الغناء في ولايته، فعقد له على الجزيرة الخضراء، ثم لما هلك أخوه علي قام بالخلافة من بعده ولقب المأمون، وتنازعه ابن أخيه يحيى بن علي الأمر بعد أبيه فغلب عليه يحيى، وكان من أواخر خلفاء بني حمود بقرطبة."
  en: "al-Qasim ibn Hammud ibn Maymun al-Idrisi, brother of Ali ibn Hammud al-Nasir; the two stood by Sulayman ibn al-Hakam al-Musta'in when the Berbers set him up as caliph in al-Andalus and served him well, al-Qasim receiving Algeciras — after Ali's death he took the caliphate as al-Ma'mun, contested by his nephew Yahya ibn Ali who prevailed over him, one of the last Hammudid caliphs of Cordoba."
