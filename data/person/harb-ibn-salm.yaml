label: { ar: "حرب بن سلم بن زياد", en: "Harb ibn Salm ibn Ziyad", es: "Harb ibn Salm ibn Ziyad", fr: "Harb ibn Salm ibn Ziyad", ur: "حرب بن سلم ابن زیاد" }
summary:
  ar: "حرب بن سلم بن زياد؛ نسب إليه نهر وخاصم فيه عبد الأعلى بن عبد الله بن عامر فلما توجه القضاء لعبد الأعلى أتاه حرب فقال خاصمتك في هذا النهر وقد ندمت وأنت شيخ المشيرة وسيدها فهو لك فقال عبد الأعلى بل هو لك فلما كان المشي قال موالي عبد الأعلى ما أتاك حرب حتى توجه لك القضاء فقال والله لا رجعت فيما جعلت له أبداً."
  en: "Harb ibn Salm ibn Ziyad; he contested his canal with Abd al-A'la ibn Abdallah ibn Amir — and when the verdict turned to Abd al-A'la, Harb yielded 'it is yours, sheikh of the counsel', Abd al-A'la yielded back 'it is yours', and when his mawlas warned Harb had only come after the judgment swung, he answered 'never shall I take back what I made his'."
  es: "Harb ibn Salm ibn Ziyad disputó su canal con Abd al-A'la ibn Abdallah ibn Amir, y cuando el veredicto favoreció a Abd al-A'la, Harb cedió diciendo \"es tuyo, jeque del consejo\", Abd al-A'la respondió \"es tuyo\", y cuando sus mawlas le advirtieron que Harb solo había llegado después de que el veredicto se inclinara, él respondió \"jamás retiraré lo que le hice suyo\"."
  fr: "Harb ibn Salm ibn Ziyad; il contesta son canal avec Abd al-A'la ibn Abdallah ibn Amir — et lorsque le verdict se tourna vers Abd al-A'la, Harb céda « il est à vous, cheikh du conseil », Abd al-A'la céda à son tour « il est à vous », et lorsque ses mawlas l'avertirent qu'il n'était venu qu'après que le jugement ait basculé, il répondit « jamais je ne reprendrai ce que j'ai fait sien »."
  ur: "حرب بن سلم ابن زیاد؛ اس نے عبد العلا بن عبداللہ ابن عامر کے ساتھ اپنی نہر کا مقابلہ کیا - اور جب فیصلہ عبد الاعلٰی کی طرف ہوا تو حرب نے جواب دیا 'یہ تمہارا ہے، شیخ مشیر'، عبد العلا نے پیچھے ہٹ کر کہا 'یہ تمہارا ہے'، اور جب اس کے مولاؤں نے حرب کو تنبیہ کی تو میں نے جواب دیا کہ میں فیصلہ کے بعد ہی واپس آؤں گا۔ میں نے اس کا کیا بنایا۔"
  tr: "Harb ibn Salm ibn Ziyad; ona bir nehir atfedildi ve Abd al-A'la ibn Abdullah ibn 'Amir ile bu konuda tartıştı. Yargı Abd al-A'la'ya gittiğinde, Harb yanına geldi ve dedi ki: Bu nehir üzerinde tartıştım ve sen meclisin başı ve ustası olduğun zaman pişman oldum, bu yüzden senin. Abd al-A'la dedi ki, 'Aksi halde, o senin.' Gitmek üzereyken, 'Abd al-A'la'nın özgür sahipleri, yargıç olarak atanana kadar size gelmedi.' dedi. Dedi ki, 'Allah'a yemin ederim, onun için atadıklarına asla geri dönmeyeceğim.'"
  id: "Harb ibn Salm ibn Ziyad; sebuah sungai dikaitkan dengannya dan ia berdebat dengan Abd al-A'la ibn Abdullah ibn 'Amir tentang sungai itu. Ketika pengadilan pergi kepada Abd al-A'la, Harb datang kepadanya dan berkata: Aku telah memperdebatkanmu tentang sungai ini dan menyesalinya saat kau menjadi kepala dan penguasa dewan, maka sungai itu milikmu. Abd al-A'la berkata, 'Sebaliknya, itu milikmu.' Ketika ia hendak pergi, ia berkata, 'Para mantan Abd al-A'la tidak datang kepadamu sampai ia diangkat sebagai hakim.' Ia berkata, 'Demi Allah, aku tidak akan pernah kembali ke apa yang telah kau tetapkan untuknya.'"
