label: { ar: "حرب بن سلم بن زياد", en: "Harb ibn Salm ibn Ziyad" }
summary:
  ar: "حرب بن سلم بن زياد؛ نسب إليه نهر وخاصم فيه عبد الأعلى بن عبد الله بن عامر فلما توجه القضاء لعبد الأعلى أتاه حرب فقال خاصمتك في هذا النهر وقد ندمت وأنت شيخ المشيرة وسيدها فهو لك فقال عبد الأعلى بل هو لك فلما كان المشي قال موالي عبد الأعلى ما أتاك حرب حتى توجه لك القضاء فقال والله لا رجعت فيما جعلت له أبداً."
  en: "Harb ibn Salm ibn Ziyad; he contested his canal with Abd al-A'la ibn Abdallah ibn Amir — and when the verdict turned to Abd al-A'la, Harb yielded 'it is yours, sheikh of the counsel', Abd al-A'la yielded back 'it is yours', and when his mawlas warned Harb had only come after the judgment swung, he answered 'never shall I take back what I made his'."
