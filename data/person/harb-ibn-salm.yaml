class: person
label: { ar: "حرب بن سلم بن زياد", en: "Harb ibn Salm ibn Ziyad", es: "Harb ibn Salm ibn Ziyad", fr: "Harb ibn Salm ibn Ziyad" }
summary:
  ar: "حرب بن سلم بن زياد؛ نسب إليه نهر وخاصم فيه عبد الأعلى بن عبد الله بن عامر فلما توجه القضاء لعبد الأعلى أتاه حرب فقال خاصمتك في هذا النهر وقد ندمت وأنت شيخ المشيرة وسيدها فهو لك فقال عبد الأعلى بل هو لك فلما كان المشي قال موالي عبد الأعلى ما أتاك حرب حتى توجه لك القضاء فقال والله لا رجعت فيما جعلت له أبداً."
  en: "Harb ibn Salm ibn Ziyad; he contested his canal with Abd al-A'la ibn Abdallah ibn Amir — and when the verdict turned to Abd al-A'la, Harb yielded 'it is yours, sheikh of the counsel', Abd al-A'la yielded back 'it is yours', and when his mawlas warned Harb had only come after the judgment swung, he answered 'never shall I take back what I made his'."
  es: "Harb ibn Salm ibn Ziyad disputó su canal con Abd al-A'la ibn Abdallah ibn Amir, y cuando el veredicto favoreció a Abd al-A'la, Harb cedió diciendo \"es tuyo, jeque del consejo\", Abd al-A'la respondió \"es tuyo\", y cuando sus mawlas le advirtieron que Harb solo había llegado después de que el veredicto se inclinara, él respondió \"jamás retiraré lo que le hice suyo\"."
  fr: "Harb ibn Salm ibn Ziyad; il contesta son canal avec Abd al-A'la ibn Abdallah ibn Amir — et lorsque le verdict se tourna vers Abd al-A'la, Harb céda « il est à vous, cheikh du conseil », Abd al-A'la céda à son tour « il est à vous », et lorsque ses mawlas l'avertirent qu'il n'était venu qu'après que le jugement ait basculé, il répondit « jamais je ne reprendrai ce que j'ai fait sien »."
