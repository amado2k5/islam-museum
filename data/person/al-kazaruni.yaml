summary:
  ar: "جمال الدين الكازروني المدني الشيخ الإمام العالم؛ انتهت إليه رياسة العلم بالمدينة النبوية وولي قضاءها وخطابتها ثم صرف ودخل القاهرة مراراً ولم يخلف بعده من يقاربه بالمدينة المنورة، توفي سنة ثلاث وأربعين وثمانمائة {cite:shadharat-dhahab p. 247}."
  en: "Al-Kazaruni al-Madani — Medina's head of scholarship, its qadi and khatib until removed; repeatedly in Cairo, and 'Medina saw none to compare with him after'; died 843 {cite:shadharat-dhahab p. 247}."
  es: "Al-Kazaruni al-Madani — Jefe de los estudios de Medina, su cadí y khatib hasta su destitución; estuvo repetidamente en El Cairo, y «Medina no vio a nadie que se le comparara después»; murió en 843 {cita: shadharat-dhahab p. 247}."
  fr: "Al-Kazaruni al-Madani — chef des études de Médine, son cadi et khatib jusqu'à sa destitution; à plusieurs reprises au Caire, et « Médine n'a vu personne à comparer avec lui après lui »; mort en 843 {cite: shadharat-dhahab p. 247}."
  ur: "الکزارونی المدنی - مدینہ کا علمی سربراہ، اس کا قاضی اور خطیب جب تک ہٹا دیا جائے؛ قاہرہ میں بار بار، اور 'مدینہ نے اس کے بعد اس کے ساتھ موازنہ کرنے والا کوئی نہیں دیکھا'؛ وفات 843۔ 247}۔"
  tr: "Cemaleddin el-Kazruni el-Medeni, şeyh, alim imam, sonunda Peygamber'in Medine'sinde bilgi başı oldu, yargı ve vaizi devraldı, ardından vefat etti ve Kahire'ye defalarca girdi, Medine'de yakınlarından kimseyi bırakmadı. 843 Hicri yılında vefat etti {cite:shadharat-dhahab, s. 247}."
  id: "Jamal al-Din al-Kazruni al-Madani, sang sheikh, Imam yang berilmu, akhirnya menjadi kepala ilmu di Madinah Nabi, mengambil alih kehakiman dan pengkhotbahnya, lalu meninggal dunia dan berulang kali masuk ke Kairo, meninggalkan tidak ada orang terdekatnya di Madinah. Ia meninggal pada tahun 843 H {cite:shadharat-dhahab, hlm. 247}."
