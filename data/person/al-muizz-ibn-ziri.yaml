label:
  ar: المعز بن زيري بن عطية
  en: al-Mu'izz ibn Ziri ibn Atiyya
summary:
  ar: "المعز بن زيري بن عطية المغراوي، ثاني ملوك بني زيري بفاس؛ بايعته مغراوة كافة من بعد أبيه فضبط ولايته، واستجدى للمنصور واعتلق بالدعوة العامرية ثم رغب إلى عبد الملك المظفر أن يعيده إلى عمله على مال يحمله إليه وعلى أن يكون ولده معنصر رهينة بقرطبة فأجابه إلى ذلك وأعاده سنة 406هـ، وخرج عليه ابن عمه معنصر فنازعه فاس، وتوارث ولده الملك إلى أن وقع بهم القائد صنهاجي المسمى حمامة أبو العطاف واستولى على فاس وسائر عملهم، ودام بقاؤهم في الفتن إلى دولة المرابطين."
  en: "al-Mu'izz ibn Ziri ibn Atiyya al-Maghrawi, second king of the Banu Ziri at Fez; all Maghrawa gave him bay'a after his father, he clung to the Amirid da'wa, then petitioned Abd al-Malik al-Muzaffar to restore his office against tribute and his son Ma'nsar as hostage at Cordoba — restored in 406, he was fought for Fez by his cousin Ma'nsar, and his heirs kept the city until the Sanhaja commander Hamama Abu al-Attaf seized it and all their realm, the line lingering in the fitnas until the Almoravid state."
