summary:
  ar: "الحافظ جمال الدين الطاهر بن الحسين الأهدل محدث الديار اليمنية؛ ولد سنة أربع عشرة وتسعمائة بقرية المراوعة ثم انتقل إلى زبيد ولازم الحافظ عبد الرحمن بن الديبع وانتفع به انتفاعاً رقّاه إلى درجة الكمال وساد على الأمثال، ومن مشايخه أبو العباس الطنبذاوي ووجيه الدين ابن زياد والسيد عبد المحسن الأهدل وبرهان الدين مطير، وارتحل إلى مكة وجاور بها واجتمع بشيخ الإسلام أبي الحسن البكري والحافظ أبي السعادات المالكي، ثم انفرد بعد شيخه ابن الديبع برياسة الحديث وارتحل إليه الناس وكثر الآخذون عنه منهم الحافظ محي الدين اليزاز والصابوني وابن جعمان، وتخرج به ابن ابنته العلامة السيد الحسين بن أبي بكر بن الطاهر؛ وكان أوحد عصره علماً وعملاً وحفظاً وإتقاناً ومعرفة بأسماء الرجال وجميع علوم الحديث بحيث كان مسند الدنيا؛ توفي يوم الأربعاء سابع عشر ربيع الأول بزبيد ودُفن بباب سهام بمقبرة أهله {cite:shadharat-dhahab p. 439}."
  en: "Al-Tahir b. al-Ahdal — b. 914 at al-Marawi'a, Ibn al-Dibba''s successor in hadith-riyasa at Zabid; after a Meccan mujawara he became 'musnid al-dunya,' teacher of al-Yazzaz, al-Sabuni and Ibn Ja'man; died Wednesday 17 Rabi' I 998 at Zabid {cite:shadharat-dhahab p. 439}."
  fr: "Al-Tahir b. al-Ahdal – né en 914 à al-Marawi'a, successeur d'Ibn al-Dibba dans le hadith-riyasa à Zabid ; après un mujawara mecquois, il est devenu 'musnid al-dunya', professeur d'al-Yazzaz, al-Sabuni et Ibn Ja'man ; décédé mercredi 17 Rabi' I 998 {cite:shadharat-dhahab p. 439}."
  es: "Al-Tahir b. al-Ahdal—b. 914 en al-Marawi'a, sucesor de Ibn al-Dibba en hadith-riyasa en Zabid; después de un mujawara de La Meca, se convirtió en 'musnid al-dunya', maestro de al-Yazzaz, al-Sabuni e Ibn Ja'man; murió el miércoles 17 Rabi' I 998 en Zabid {cita: shadharat-dhahab p. 439}."
  ur: "الطاہر بی۔ الاحدال - ب. 914 المرویۃ، ابن الدیبہ کا جانشین حدیث ریاضہ زبید میں؛ مکی مجاورہ کے بعد وہ 'مسند الدنیا' بن گیا، الیزاز، الصابونی اور ابن جمن کا استاد؛ بدھ 17 ربیع الثانی 998 کو زبید میں وفات پائی۔ 439}۔"
  tr: "Hadisâlim Cemaldin el-Tahir bin el-Hüseyin el-Ahdal, Yemen topraklarının hadis âlimidir; 1914 Hâl'da el-Maravi'ah köyünde doğmuş, ardından Zabid'e taşınmış ve burada hadis âlimi Abdurrahman ibn al-Dib'i yakından takip ederek ondan büyük fayda sağlamış, onu mükemmelliğe taşımış ve atasözlerini ustalıkla öğrenmiştir. Öğretmenleri arasında Ebu el-Abbas el-Tanbadevi, Vecihaddin İbn Ziyad, Seyyid Abdüldin Muhsin el-Ahdal ve Burhan al-Din Mutair vardı. Mekke'ye seyahat etti, orada yaşadı ve Şeyh el-İslam Ebu el-Hasan el-Bakri ile hafız Ebu el-Sedat el-Maliki ile görüştü. Daha sonra öğretmeni İbn el-Diba'dan sonra tek lider oldu Hadisler, hadisler arasında haberci Muhyiddin al-Yazzaz, al-Sabuni ve İbn Ju'man da dahil olmak üzere birçok kişi tarafından aktarılmıştır. Kızının oğlu, âlim Seyyid al-Hüseyin bin Ebi Bekir ibn el-Tahir bu mezunluktan mezun olmuştur. Kendi döneminin bilgi, pratik, ezberleme, kesinlik ve rivayetçi isimleri ile tüm hadis bilimleri konusunda önde gelen alimi olup, dünyanın başbakanı olmuştur. Çarşamba günü, Rebi'l-Avval'in on yedinci günü Zabid'de vefat etti ve ailesinin mezarlığındaki Bab Siham'a defnedildi {atıf:şadharat-dhahab, s. 439}."
  id: "Ulama hadis Jamal al-Din al-Tahir ibn al-Husayn al-Ahdal, ulama hadis tanah Yaman; lahir pada tahun 1914 H di desa al-Marawi'ah, kemudian pindah ke Zabid, di mana ia mengikuti dengan dekat ulama hadis Abd al-Rahman ibn al-Dib' dan sangat mendapat manfaat darinya, mengangkatnya menjadi sempurna dan menguasai peribahasa. Di antara gurunya adalah Abu al-Abbas al-Tanbadawi, Wajih al-Din Ibn Ziyad, Sayyid Abd al-Muhsin al-Ahdal, dan Burhan al-Din Mutair. Ia pergi ke Mekah, tinggal di sana, dan bertemu dengan Shaykh al-Islam Abu al-Hasan al-Bakri dan hafiz Abu al-Sa'adat al-Maliki. Kemudian, setelah gurunya Ibn al-Diba', ia menjadi pemimpin tunggal Hadits telah diwariskan kepadanya oleh banyak orang, termasuk penghafal Muhyiddin al-Yazzaz, al-Sabuni, dan Ibn Ju'man. Putra putrinya, ulama Sayyid al-Husayn ibn Abi Bakr ibn al-Tahir, lulus dari hadits ini. Ia adalah ulama terkemuka pada zamannya dalam pengetahuan, praktik, hafalan, ketelitian, dan pengetahuan atas nama-nama narator serta semua ilmu hadis, menjadikannya pemimpin dunia. Ia meninggal pada hari Rabu, tanggal tujuh belas Rabi' al-Awwal di Zabid dan dimakamkan di Bab Siham, di pemakaman keluarganya {cite:shadharat-dhahab, hlm. 439}."
