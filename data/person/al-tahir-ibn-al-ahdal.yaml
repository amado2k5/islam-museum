summary:
  ar: "الحافظ جمال الدين الطاهر بن الحسين الأهدل محدث الديار اليمنية؛ ولد سنة أربع عشرة وتسعمائة بقرية المراوعة ثم انتقل إلى زبيد ولازم الحافظ عبد الرحمن بن الديبع وانتفع به انتفاعاً رقّاه إلى درجة الكمال وساد على الأمثال، ومن مشايخه أبو العباس الطنبذاوي ووجيه الدين ابن زياد والسيد عبد المحسن الأهدل وبرهان الدين مطير، وارتحل إلى مكة وجاور بها واجتمع بشيخ الإسلام أبي الحسن البكري والحافظ أبي السعادات المالكي، ثم انفرد بعد شيخه ابن الديبع برياسة الحديث وارتحل إليه الناس وكثر الآخذون عنه منهم الحافظ محي الدين اليزاز والصابوني وابن جعمان، وتخرج به ابن ابنته العلامة السيد الحسين بن أبي بكر بن الطاهر؛ وكان أوحد عصره علماً وعملاً وحفظاً وإتقاناً ومعرفة بأسماء الرجال وجميع علوم الحديث بحيث كان مسند الدنيا؛ توفي يوم الأربعاء سابع عشر ربيع الأول بزبيد ودُفن بباب سهام بمقبرة أهله {cite:shadharat-dhahab p. 439}."
  en: "Al-Tahir b. al-Ahdal — b. 914 at al-Marawi'a, Ibn al-Dibba''s successor in hadith-riyasa at Zabid; after a Meccan mujawara he became 'musnid al-dunya,' teacher of al-Yazzaz, al-Sabuni and Ibn Ja'man; died Wednesday 17 Rabi' I 998 at Zabid {cite:shadharat-dhahab p. 439}."
