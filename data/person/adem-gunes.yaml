summary:
  ar: "مربٍّ وكاتب تركي في تربية الأطفال والأسرة، وُلد سنة 1969 في أنقرة، وتخرّج في كلية التربية بجامعة روتردام، وألّف 22 كتابًا بالتركية وكتابين بالإنجليزية في تربية الأطفال، منها «سرّ الطفولة» و«التربية بلا عقاب». بلغت قناته على يوتيوب 317,000 مشترك كما في 15 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish pedagogue and author on child and family education, born in 1969 in Ankara. He graduated from Rotterdam University's pedagogy faculty and has written 22 books in Turkish and 2 in English on child education, among them Çocukluk Sırrı (The Wonder of Childhood) and Cezasız Eğitim (Education Without Punishment). His YouTube channel counted 317,000 subscribers as of 15 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  fr: "Pédagogue turc et auteur sur l'éducation des enfants et de la famille, né en 1969 à Ankara. Diplômé de la faculté de pédagogie de l'université de Rotterdam, auteur de 22 livres turcs et 2 anglais sur l'éducation des enfants, dont Çocukluk Sırrı (Les Merveilles de l'enfance) et Cezasız Eğitim (L'Éducation sans punition). Sa chaîne YouTube comptait 317 000 abonnés au 15 novembre 2026 selon vidIQ : chiffre daté de plateforme, non un fait vérifié par le musée."
  ur: "ترک ماہرِ تعلیمِ اطفال اور مصنف، جو 1969ء میں انقرہ میں پیدا ہوئے، روٹرڈیم یونیورسٹی کے شعبۂ تعلیم سے فارغ التحصیل ہوئے، اور بچوں کی تعلیم پر ترکی میں 22 اور انگریزی میں 2 کتابیں لکھیں، جن میں «بچپن کا راز» اور «سزا کے بغیر تعلیم» شامل ہیں۔ vidIQ کے مطابق 15 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 317,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
