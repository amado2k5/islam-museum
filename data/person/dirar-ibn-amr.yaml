summary:
  ar: "ضرار بن عمرو، من رءوس المعتزلة؛ نقل المسعودي عنه وعن ثمامة بن أشرس وعمرو بن عثمان الجاحظ أنهم زعموا أن النبط خير من العرب، ويناقش أحمد أمين قراءة المسعودي وذهب إلى أن ضراراً وأصحابه لم يقتصروا على أن الخلافة لا يلزم أن تكون في قريش ولا في العرب بل قالوا إن غير العربي ولو نبطياً أولى من القرشي لأنه يسهل خلعه إذا جار وظلم، وفي شرح النووي على مسلم «ولا اعتداد بسخافة ضرار بن عمرو في قوله إن غير القرشي من الهوان خلعه إن عرض منه أمر» {cite:duha-islam p. 60-61}."
  en: "Dirar ibn Amr — a head of the Mu'tazila; al-Mas'udi names him with Thumama and al-Jahiz as holding the Nabataean better than the Arab — read by Ahmad Amin as a political argument for easy deposition rather than belittlement of Arabs {cite:duha-islam p. 60-61}."
