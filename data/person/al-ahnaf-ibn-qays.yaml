id: person/al-ahnaf-ibn-qays
class: person
label: { ar: "الأحنف بن قيس", en: "al-Ahnaf ibn Qays", fr: "Al-Ahnaf ibn Qays" , ur: "احنف بن قیس", es: "al-Ahnaf ibn Qays"}
summary:
  ar: "الأحنف بن قيس واسمه الضحاك بن قيس التميمي؛ عند البلاذري وجهه أبو موسى إلى قاشان ففتحها عنوة ووجهه عبد الله بن بديل إلى اليهودية فصالحه أهلها على مثل صلح جي وكان على مقدمة أبي موسى في رواية. وعند المسعودي كان معتزلاً في قومه من بني تميم بوادي السباع فلما مر به الزبير منصرفاً قال ما أصنع بالزبير وقد جمع بين فئتين عظيمتين وهو مار إلى منزله سالماً فلحقه نفر منهم فقتلوه، وقيل قتله بإرساله من أرسل من قومه {cite:muruj-al-dhahab p. 657}"
  en: "al-Ahnaf ibn Qays — al-Dahhak ibn Qays al-Tamimi; in al-Baladhuri, sent by Abu Musa to take Qashan by force and by Ibn Budayl to al-Yahudiyya on Jayy's terms, on Abu Musa's vanguard in one version."
  fr: "Al-Ahnaf ibn Qays — al-Dahhak ibn Qays al-Tamimi ; chez al-Baladhuri, envoyé par Abu Musa prendre Qashan de force et par Ibn Budayl à al-Yahudiyya aux conditions accordées à Jayy ; selon une version, il commandait l’avant-garde d’Abu Musa."
  ur: "ضحاک بن قیس تمیمی کے نام سے بھی معروف قائد؛ بلاذری ان کی قم و کاشان اور اصفہان کی مہمات میں ذمہ داریوں کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
  es: "al-Ahnaf ibn Qays—al-Dahhak ibn Qays al-Tamimi; en al-Baladhuri, enviado por Abu Musa para tomar Qashan por la fuerza y por Ibn Budayl a al-Yahudiyya según los términos de Jayy, en la vanguardia de Abu Musa en una versión."
  tr: "El-Ahnaf ibn Kays (adı el-Dahhak ibn Kays el-Tamimi) Ebu Musa tarafından Kaşan'a gönderilmiş ve el-Baladhuri'ye göre şehri zorla ele geçirmiştir. Abdullah ibn Budayl onu el-Yahudiyye'ye göndermiş ve halkı onunla Jayy barış antlaşmasına benzer şartlarda barışmıştır. Bir rivayete göre, Ebu Musa'nın öncü birliklerinin komutanıydı. El-Mas'udi, onun Beni Tamim kabilesinden olan halkıyla birlikte Vadi el-Siba'da inzivada yaşadığını belirtir. El-Zübeyr dönüş yolunda yanından geçerken, \"El-Zübeyr'le ne yapabilirim? İki büyük hizbi birleştirdi ve güvenli bir şekilde evine gidiyor\" demiştir. Bazıları onu yakalayıp öldürmüştür. Ayrıca, kabilesinden gönderdiği biri tarafından öldürüldüğü de söylenir. {kaynak:muruj-al-dhahab s. 657}"
  id: "Al-Ahnaf ibn Qays, yang nama aslinya adalah al-Dahhak ibn Qays al-Tamimi, diutus oleh Abu Musa ke Kashan, yang ditaklukkannya dengan kekerasan, menurut al-Baladhuri. Abdullah ibn Budayl mengutusnya ke al-Yahudiyya, dan penduduknya berdamai dengannya dengan syarat yang mirip dengan perjanjian damai Jayy. Menurut salah satu riwayat, ia memimpin pasukan terdepan Abu Musa. Al-Mas'udi menyatakan bahwa ia hidup menyendiri bersama kaumnya dari Banu Tamim di Wadi al-Siba'. Ketika al-Zubayr lewat di dekatnya dalam perjalanan pulang, ia berkata, \"Apa yang bisa kulakukan dengan al-Zubayr? Dia telah menyatukan dua faksi besar, dan dia pulang dengan selamat.\" Beberapa dari mereka mengejarnya dan membunuhnya. Dikatakan juga bahwa ia dibunuh oleh seseorang yang ia kirim dari sukunya. {cite:muruj-al-dhahab p. 657}"
