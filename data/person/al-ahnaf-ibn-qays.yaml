label: { ar: "الأحنف بن قيس", en: "al-Ahnaf ibn Qays" }
summary:
  ar: "الأحنف بن قيس واسمه الضحاك بن قيس التميمي؛ عند البلاذري وجهه أبو موسى إلى قاشان ففتحها عنوة ووجهه عبد الله بن بديل إلى اليهودية فصالحه أهلها على مثل صلح جي وكان على مقدمة أبي موسى في رواية. وعند المسعودي كان معتزلاً في قومه من بني تميم بوادي السباع فلما مر به الزبير منصرفاً قال ما أصنع بالزبير وقد جمع بين فئتين عظيمتين وهو مار إلى منزله سالماً فلحقه نفر منهم فقتلوه، وقيل قتله بإرساله من أرسل من قومه {cite:muruj-al-dhahab p. 657}"
  en: "al-Ahnaf ibn Qays — al-Dahhak ibn Qays al-Tamimi; in al-Baladhuri, sent by Abu Musa to take Qashan by force and by Ibn Budayl to al-Yahudiyya on Jayy's terms, on Abu Musa's vanguard in one version."
