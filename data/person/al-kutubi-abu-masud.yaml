names:
  - { value: "أبو مسعود عبد الجليل بن محمد بن عبد الواحد الكوتبي الأصبهاني", kind: full }
summary:
  ar: "الحافظ أبو مسعود عبد الجليل بن محمد الكوتبي الأصبهاني؛ توفي في شعبان سنة ثلاث وخمسين وخمسمائة عن سبع وثمانين سنة وحدث عن رزق الله التميمي وأبي بكر بن ماجة الإبهري وخلق؛ قال أبو موسى المديني أو حدوقة في علم وطريقته وتواضعه محدثاً لفظاً وحفظاً على منبر وعظه، وقال ابن ناصر الدين كان إماماً حافظاً من أولاد الحديثين وكان ابن عساكر يفخم أمره وأثنى عليه ابن السمعاني {cite:shadharat-dhahab p. 647}."
  en: "The hafiz Abu Mas'ud Abd al-Jalil ibn Muhammad al-Kutubi of Isfahan; d. Sha'ban 553 aged eighty-seven, transmitting from Rizqallah al-Tamimi and Abu Bakr ibn Majah al-Ibahri among others; Abu Musa al-Madini praised his method and humility, Ibn Nasir al-Din called him an imam-hafiz 'of the sons of the muhaddithin', and Ibn Asakir held him in high honour, as did Ibn al-Sam'ani {cite:shadharat-dhahab p. 647}."
  es: "El hafiz Abu Mas'ud Abd al-Jalil ibn Muhammad al-Kutubi de Isfahán; d. Sha'ban 553, de ochenta y siete años, transmitiendo desde Rizqallah al-Tamimi y Abu Bakr ibn Majah al-Ibahri, entre otros; Abu Musa al-Madini elogió su método y humildad, Ibn Nasir al-Din lo llamó imán-hafiz 'de los hijos de los muhaddithin', e Ibn Asakir lo tuvo en gran honor, al igual que Ibn al-Sam'ani {citar: shadharat-dhahab p. 647}."
  fr: "Le hafiz Abu Mas'ud Abd al-Jalil ibn Muhammad al-Kutubi d'Ispahan; d. Sha'ban 553 âgé de quatre-vingt-sept ans, transmettant entre autres depuis Rizqallah al-Tamimi et Abu Bakr ibn Majah al-Ibahri; Abu Musa al-Madini a loué sa méthode et son humilité, Ibn Nasir al-Din l'a appelé un imam-hafiz « des fils des muhaddithin », et Ibn Asakir l'a tenu en grand honneur, tout comme Ibn al-Sam'ani {cite: shadharat-dhahab p. 647}."
  ur: "اصفہان کے حافظ ابو مسعود عبد الجلیل بن محمد الکتوبی؛ d شعبان 553، عمر ستاسی، رضق اللہ التمیمی اور ابو بکر بن ماجہ الابہری سے منقول ہے۔ ابو موسیٰ المدینی نے ان کے طریقہ اور عاجزی کی تعریف کی، ابن ناصر الدین نے انہیں محدثین کے فرزندوں کا امام حافظ کہا، اور ابن عساکر نے ان کی تعظیم و تکریم کی، جیسا کہ ابن سمعانی نے بیان کیا ہے۔ 647}۔"
  tr: "Ezberleyen Ebu Mes'ud Abdul Celil bin Muhammed el-Kutubi el-Esbahani; 553 Hicri yılında seksen yedi yaşında Şaban'da öldü. Rizq Allah el-Temimi'den Ebu Bekir bin Majah el-İbahri ve onun karakterini rivayet etti; Ebu Musa el-Medini ya da Haduqah, onun bilgisi, yöntemi ve alçakgönüllülüğü hakkında, vaazlarının kürsüsünde konuşma ve ezberleme konusunda bir rivayetçi olarak anlattı. İbn Nasireddin, kendisinin iki hadisin çocukları arasında bir imam ve ezberci olduğunu, İbn Asakir'in işlerinde çok saygı gördüğünü söyledi. İbn al-Sam'ani onu övdü {alıntı:şadharat-dhahab, s. 647}."
  id: "Pengapal Abu Mas'ud Abdul Jalil ibn Muhammad al-Kutubi al-Asbahani; ia meninggal di Sha'ban pada tahun 553 H, pada usia delapan puluh tujuh tahun. Ia menceritakan dari Rizq Allah al-Tamimi, Abu Bakr ibn Majah al-Ibahri, dan karakternya; Abu Musa al-Madini, atau Haduqah, berkata tentang pengetahuan, metode, dan kerendahan hatinya, seorang narator dalam ucapan dan hafalan di mimbar khotbahnya. Ibn Nasir al-Din mengatakan bahwa ia adalah imam dan penghafal di antara anak-anak dua hadis itu, dan Ibn Asakir sangat dihormati dalam urusannya. Ibn al-Sam'ani memujinya {cite:shadharat-dhahab, hlm. 647}."
