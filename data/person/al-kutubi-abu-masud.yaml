summary:
  ar: "الحافظ أبو مسعود عبد الجليل بن محمد الكوتبي الأصبهاني؛ توفي في شعبان سنة ثلاث وخمسين وخمسمائة عن سبع وثمانين سنة وحدث عن رزق الله التميمي وأبي بكر بن ماجة الإبهري وخلق؛ قال أبو موسى المديني أو حدوقة في علم وطريقته وتواضعه محدثاً لفظاً وحفظاً على منبر وعظه، وقال ابن ناصر الدين كان إماماً حافظاً من أولاد الحديثين وكان ابن عساكر يفخم أمره وأثنى عليه ابن السمعاني {cite:shadharat-dhahab p. 647}."
  en: "The hafiz Abu Mas'ud Abd al-Jalil ibn Muhammad al-Kutubi of Isfahan; d. Sha'ban 553 aged eighty-seven, transmitting from Rizqallah al-Tamimi and Abu Bakr ibn Majah al-Ibahri among others; Abu Musa al-Madini praised his method and humility, Ibn Nasir al-Din called him an imam-hafiz 'of the sons of the muhaddithin', and Ibn Asakir held him in high honour, as did Ibn al-Sam'ani {cite:shadharat-dhahab p. 647}."
