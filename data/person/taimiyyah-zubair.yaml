summary:
  ar: "معلمة قرآن وتفسير، وهي ابنة الدكتور إدريس زبير والدكتورة فرحت هاشمي مؤسسي منظمة الهدى العالمية. أكملت في منتصف مراهقتها أول دراسة لترجمة القرآن وتفسيره، ودرست النحو والفقه والتفسير، وتدرّس دراسات القرآن والحديث في معهد الهدى، وتنتشر محاضراتها عبر منصة مسلم سنترال."
  en: "Teacher of Qur'an and tafsir, and the daughter of Dr Idrees Zubair and Dr Farhat Hashmi, the founders of Al Huda International. She completed her first study of the translation and tafseer of the Qur'an in her mid teens, studied Arabic grammar, fiqh and tafseer, and teaches Qur'an and Hadith studies at the AlHuda Institute; her lectures are carried by Muslim Central."
  ur: "قرآن و تفسیر کی معلمہ، اور ڈاکٹر ادریس زبیر اور ڈاکٹر فرحت ہاشمی — الہدیٰ انٹرنیشنل کے بانیوں — کی بیٹی۔ انہوں نے کم عمری میں قرآن کے ترجمے و تفسیر کا پہلا مطالعہ مکمل کیا، عربی قواعد، فقہ اور تفسیر پڑھی، اور الہدیٰ انسٹیٹیوٹ میں قرآن و حدیث کی تعلیم دیتی ہیں؛ ان کے دروس مسلم سینٹرل پر شائع ہوتے ہیں۔"
