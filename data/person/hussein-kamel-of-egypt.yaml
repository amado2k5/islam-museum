summary:
  ar: "سلطان مصر من 19 ديسمبر 1914 إلى 9 أكتوبر 1917، الابن الثاني للخديوي إسماعيل. نصبته بريطانيا بعد عزل ابن أخيه الخديوي عباس حلمي الثاني، ونجا من محاولتي اغتيال سنة 1915، ولما توفي رفض ابنه كمال الدين حسين أن يخلفه فاعتلى أخوه أحمد فؤاد العرش باسم فؤاد الأول."
  en: "Sultan of Egypt from 19 December 1914 to 9 October 1917, the second son of Khedive Isma'il. Britain installed him after deposing his nephew, Khedive Abbas Hilmi II; he survived two assassination attempts in 1915, and on his death his son Kamal el Dine Hussein declined the throne, so his brother Ahmed Fuad succeeded him as Fuad I."
  ur: "مصر کے سلطان 19 دسمبر 1914 سے 9 اکتوبر 1917 تک، خدیو اسماعیل کے دوسرے بیٹے۔ برطانیہ نے انہیں اپنے بھتیجے خدیو عباس حلمی ثانی کو معزول کر کے بٹھایا؛ وہ 1915 میں قتل کی دو کوششوں سے بچ گئے، اور ان کی وفات پر ان کے بیٹے کمال الدین حسین نے تخت سے انکار کر دیا تو ان کے بھائی احمد فؤاد، فؤاد اول کے نام سے، جانشین ہوئے۔"
