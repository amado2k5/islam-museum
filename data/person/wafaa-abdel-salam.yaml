label:
  ar: «وفاء عبد السلام»
  en: "Wafaa Abdel Salam"
  ur: «وفا عبد السلام»
summary:
  ar: «واعظة مصرية بوزارة الأوقاف، وصفتها التقارير بأنها «الواعظة الأولى» بالوزارة؛ تأهلت مع واعظات الوزارة منذ عام 2017 ودرست في أكاديمية الأوقاف الدولية، وكانت من المكرَّمات في احتفالية المولد النبوي، وتشارك في دورات الوزارة التدريبية للواعظات وقوافلها الدعوية وتظهر في برامج تلفزيونية، وتنشر مقاطع دعوية قصيرة على حسابها في تيك توك.»
  en: "An Egyptian female preacher (wa'iza) at the Ministry of Awqaf, described in reports as 'the first female preacher' at the ministry; she trained with the ministry's female preachers from 2017, studied at the International Awqaf Academy, was among those honoured at a Mawlid celebration, takes part in the ministry's training courses and dawah caravans for female preachers, appears on television programmes, and publishes short dawah clips on her TikTok account."
  ur: «وزارتِ اوقاف مصر کی واعظہ، جنہیں رپورٹوں میں وزارت کی «پہلی واعظہ» کہا گیا؛ انہوں نے 2017 سے وزارت کی واعظات کے ساتھ تربیت حاصل کی اور بین الاقوامی اوقاف اکیڈمی میں تعلیم پائی، میلاد کی تقریب میں اعزاز پانے والوں میں شامل رہیں، وزارت کے تربیتی کورسز اور دعوتی قافلوں میں حصہ لیتی ہیں، ٹیلی ویژن پروگراموں میں آتی ہیں اور اپنے ٹک ٹاک حساب پر مختصر دعوتی کلپس شائع کرتی ہیں۔»
