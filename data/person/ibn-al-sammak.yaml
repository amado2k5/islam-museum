id: person/ibn-al-sammak
class: person
label: { ar: "ابن السماك الواعظ" }
summary:
  ar: "واعظ، دخل على الرشيد فاستسقى فأتي بكوز فقال على رسلك يا أمير المؤمنين لو منعت هذه الشربة بكم كنت تشتريها قال بنصف ملكي فلما شربها قال أسألك لو منعت خروجها من بدنك بماذا كنت تشتري خروجها قال بجميع ملكي قال إن ملكاً قيمته شربة ماء لجدير ألا ينافس فيه فبكى هارون {cite:tarikh-khulafa-minhaj-1434 p. 468}."
  en: "A preacher who asked al-Rashid, as he raised a cup of water: 'Had this sip been denied you, what would you have paid for it?' 'Half my kingdom.' 'And for its exit from your body?' 'All my kingdom.' 'A kingdom priced at a sip of water is hardly worth contesting' — and Harun wept {cite:tarikh-khulafa-minhaj-1434 p. 468}."
  es: "Un predicador le preguntó a al-Rashid, mientras este alzaba una copa de agua: «Si te hubieran negado este sorbo, ¿cuánto habrías pagado por él?». «La mitad de mi reino». «¿Y por su salida de tu cuerpo?». «Todo mi reino». «Un reino valorado en un sorbo de agua difícilmente merece la pena disputarlo», y Harún lloró {cite:tarikh-khulafa-minhaj-1434 p. 468}."
  fr: "Un prédicateur demanda à al-Rashid, alors qu'il levait une coupe d'eau: « Si cette gorgée t'avait été refusée, combien aurais-tu payé pour elle ? » « La moitié de mon royaume. » « Et pour sa sortie de ton corps ? » « Tout mon royaume. » « Un royaume qui se paie une gorgée d'eau ne vaut guère la peine d'être contesté » — et Harun pleura {cite:tarikh-khulafa-minhaj-1434 p. 468}."
