label: { ar: "ابن السماك الواعظ" }
summary:
  ar: "واعظ، دخل على الرشيد فاستسقى فأتي بكوز فقال على رسلك يا أمير المؤمنين لو منعت هذه الشربة بكم كنت تشتريها قال بنصف ملكي فلما شربها قال أسألك لو منعت خروجها من بدنك بماذا كنت تشتري خروجها قال بجميع ملكي قال إن ملكاً قيمته شربة ماء لجدير ألا ينافس فيه فبكى هارون {cite:tarikh-khulafa-minhaj-1434 p. 468}."
  en: "A preacher who asked al-Rashid, as he raised a cup of water: 'Had this sip been denied you, what would you have paid for it?' 'Half my kingdom.' 'And for its exit from your body?' 'All my kingdom.' 'A kingdom priced at a sip of water is hardly worth contesting' — and Harun wept {cite:tarikh-khulafa-minhaj-1434 p. 468}."
