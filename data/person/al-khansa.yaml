summary:
  en: "The elegiac poet of Banu Sulaym (Qays 'Aylan), famous for her laments for her brothers Sakhr and Mu'awiya killed before Islam; she embraced Islam with her sons and gave them to the cause — the four were martyred at al-Qadisiyya, and she was heard saying that God's honouring her with their martyrdom comforted her."
  ar: "شاعرة بني سليم ورائية العرب، اشتهرت برثاء أخويها صخر ومعاوية قبل الإسلام؛ أسلمت هي وبنوها فاستشهد أبناؤها الأربعة يوم القادسية، وبلغها ذلك فقالت ما روي عنها من الصبر والقناعة بما شرفها الله به من استشهادهم. وتمثل بها الأصمعي عند الرشيد يوم أجرى حلبة الخيل بالرقة وفرسه السابق وفرس المأمون الثانية جاري أباه فأقبلا وهما يتنازعان ملاءة الحضر {cite:muruj-al-dhahab p. 350}"
  ur: "بنو سلیم ⁦(قیس عیلان)⁩ کی رثائی شاعرہ، اپنے بھائیوں صخر اور معاویہ کے مرثیوں کے لیے مشہور جو اسلام سے پہلے مارے گئے؛ اسلام لائیں۔"
  es: "La poetisa elegíaca de Banu Sulaym (Qays 'Aylan), famosa por sus lamentos por sus hermanos Sakhr y Mu'awiya, asesinados antes del Islam; abrazó el Islam junto con sus hijos y los entregó a la causa; los cuatro fueron martirizados en al-Qadisiyya, y se la oyó decir que el hecho de que Dios la honrara con su martirio la consolaba."
  fr: "La poétesse élégiaque de Banu Sulaym (Qays 'Aylan), célèbre pour ses lamentations sur ses frères Sakhr et Mu'awiya tués avant l'Islam; elle embrassa l'Islam avec ses fils et les donna à la cause — les quatre furent martyrisés à al-Qadisiyya, et on l'entendit dire que le fait que Dieu l'honore par leur martyre la réconfortait."
  tr: "Banu Süleym şairi ve Arapların bir anlatıcısı olan Sâh, İslam öncesinde kardeşleri Sakhr ve Muaviye'yi övmesiyle ünlendi; kendisi ve oğulları İslam'ı benimsedi ve dört oğlu el-Kadisiye gününde şehit oldu. Bunu duydu ve Allah'ın onları şehitlikleriyle onurlandırmada anlattığı sabır ve memnuniyeti anlattı. Al-Asma'i, Reqqa at turu yaptığı gün Al-Rashid'i temsil etti; bu at, babasının komşusu Al-Ma'mun'un ikinci atıydı, böylece şehrin lüksü üzerine tartışırken geldiler {cite:muruj-al-dhahab s. 350}"
  id: "Seorang penyair Banu Sulaym dan narator bangsa Arab, ia menjadi terkenal karena memuji saudara-saudaranya Sakhr dan Muawiyah sebelum Islam; ia dan putra-putranya memeluk Islam, dan keempat putranya gugur pada hari al-Qadisiyyah. Ia mendengar hal ini dan menceritakan kesabaran serta kepuasan yang diceritakan Allah dalam menghormati mereka dengan syahid mereka. Al-Asma'i mewakilinya bersama Al-Rashid pada hari ia mengadakan putaran kuda di Raqqa, kuda sebelumnya, dan kuda kedua Al-Ma'mun, tetangga ayahnya, sehingga mereka datang sambil berdebat tentang kemewahan kota {cite:muruj-al-dhahab hlm. 350}"
