summary:
  en: "The elegiac poet of Banu Sulaym (Qays 'Aylan), famous for her laments for her brothers Sakhr and Mu'awiya killed before Islam; she embraced Islam with her sons and gave them to the cause — the four were martyred at al-Qadisiyya, and she was heard saying that God's honouring her with their martyrdom comforted her."
  ar: "شاعرة بني سليم ورائية العرب، اشتهرت برثاء أخويها صخر ومعاوية قبل الإسلام؛ أسلمت هي وبنوها فاستشهد أبناؤها الأربعة يوم القادسية، وبلغها ذلك فقالت ما روي عنها من الصبر والقناعة بما شرفها الله به من استشهادهم. وتمثل بها الأصمعي عند الرشيد يوم أجرى حلبة الخيل بالرقة وفرسه السابق وفرس المأمون الثانية جاري أباه فأقبلا وهما يتنازعان ملاءة الحضر {cite:muruj-al-dhahab p. 350}"
