summary:
  ar: "طبيب وسياسي بشتوني (1883–1958) من أوتمانزاي، الأخ الأكبر لعبد الغفار خان، عُرف بـ«الدكتور خان صاحب». درس الطب في بومباي ولندن وخدم في الحرب الأولى، ثم قاد حكومة المقاطعة الحدودية الشمالية الغربية، وعارض تقسيم الهند، وصار أول رئيس وزراء لباكستان الغربية سنة 1955، واغتيل في لاهور سنة 1958."
  en: "Pashtun physician and politician (1883–1958) from Utmanzai, elder brother of Abdul Ghaffar Khan, known as Dr. Khan Sahib. He studied medicine at Bombay and London and served in the First World War, led the government of the North-West Frontier Province, opposed the Partition of India, became the first Chief Minister of West Pakistan in 1955, and was assassinated at Lahore in 1958."
  ur: "اتمانزئی سے تعلق رکھنے والے پشتون طبیب اور سیاست دان ⁦(1883ء–1958ء)⁩، عبد الغفار خان کے بڑے بھائی، ’ڈاکٹر خان صاحب‘ کے نام سے مشہور۔ انھوں نے بمبئی اور لندن میں طب پڑھی اور پہلی جنگِ عظیم میں خدمات انجام دیں، شمال مغربی سرحدی صوبے کی حکومت کی قیادت کی، تقسیمِ ہند کی مخالفت کی، 1955ء میں مغربی پاکستان کے پہلے وزیرِ اعلیٰ بنے اور 1958ء میں لاہور میں قتل ہوئے۔"
