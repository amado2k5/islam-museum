summary:
  ar: "باحث وداعية كويتي وأستاذ مشارك في الفقه المقارن والسياسة الشرعية بكلية الشريعة والدراسات الإسلامية في جامعة الكويت، متخصص في الاقتصاد الإسلامي والصيرفة الإسلامية، عمل مراقبا شرعيا في بيت التمويل الكويتي وعميدا مساعدا في كليته، ويرأس مجلس جمعية مرتقى العلمية."
  en: "Kuwaiti researcher and preacher and associate professor of comparative fiqh and Sharia politics at the College of Sharia and Islamic Studies, Kuwait University; a specialist in Islamic economics and Islamic banking who worked as a Sharia controller at Kuwait Finance House and as an assistant dean of his college, and chairs the board of the Murtaqa Scientific Society."
  ur: "کویتی محقق اور مبلغ، جامعہ کویت کے کلیہ الشریعہ میں فقہِ مقارن اور سیاستِ شرعیہ کے مشارک استاد، اسلامی معاشیات اور اسلامی بینکاری کے ماہر، بیت التمويل الكويتي میں شرعی نگراں اور اپنے کلیہ کے معاون عمید رہے، اور جمعیہ مرتقیٰ علمیہ کے بورڈ کے صدر ہیں۔"
