summary:
  ar: "المؤرخ المصري حسن إبراهيم حسن ⁦(ت 1371هـ/1951م)⁩، صاحب «تاريخ الإسلام السياسي والديني والثقافي والاجتماعي»؛ مسح نسخة محلية من كتابه على رف الحصاد."
  en: "The Egyptian historian Hasan Ibrahim Hasan (d. 1371 AH/1951), author of Tarikh al-Islam al-siyasi wa-l-dini wa-l-thaqafi wa-l-ijtima'i; a local scan of his book is on the harvest shelf."
  es: "El historiador egipcio Hasan Ibrahim Hasan (m. 1371 AH/1951), autor de Tarikh al-Islam al-siyasi wa-l-dini wa-l-thaqafi wa-l-ijtima'i; una copia local escaneada de su libro se encuentra en el estante de la cosecha."
  fr: "L'historien égyptien Hasan Ibrahim Hasan (mort en 1371 AH/1951), auteur de Tarikh al-Islam al-siyasi wa-l-dini wa-l-thaqafi wa-l-ijtima'i; un scan local de son livre se trouve sur l'étagère des récoltes."
  ur: "مصری مؤرخ حسن ابراہیم حسن ⁦(متوفی 1371ھ/1951)⁩، تاریخ الاسلام السیاسی واللدنی وال ثقفی و اجتمائی کے مصنف؛ اس کی کتاب کا مقامی اسکین کٹائی کے شیلف پر ہے۔"
  tr: "Mısırlı tarihçi Hasan İbrahim Hassan (ö. 1371 Hicri / 1951 M.S.), 'Siyasi, Dini, Kültürel ve Sosyal İslam'ın Tarihi' adlı kitabın yazarı; kitabının yerel bir kopyası hasat rafında tarandı."
  id: "Sejarawan Mesir Hassan Ibrahim Hassan (wafat 1371 H / 1951 M), penulis 'Sejarah Islam Politik, Agama, Budaya, dan Sosial'; salinan lokal bukunya dipindai di rak panen."
