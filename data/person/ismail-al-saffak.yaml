label:
  ar: إسماعيل السفاك الأخيضري
  en: Ismail al-Saffak al-Ukhaydhiri
  es: "Ismail al-Saffak al-Ukhaydhiri"
  fr: "Ismail al-Saffak al-Ukhaydhiri"
  ur: "اسماعیل الصفک الخیری"
summary:
  ar: "إسماعيل بن يوسف بن إبراهيم بن موسى الجون العلوي، الملقب بالسفاك؛ خرج في أعراب الحجاز سنة 251هـ فقصد مكة فهرب عاملها جعفر بسباسات وانتهب منازل أصحاب السلطان وقتل جماعة من الجند وأهل مكة وأخذ الذهب والفضة وكسوة الكعبة وأقام في ذلك خمسين يوماً، وسار إلى المدينة فحاصرها حتى مات أهلها جوعاً ولم يُصلَّ أحد في مسجدها، واستباح جدة وأخذ أموال التجار، وخطب لنفسه بمكة، وكان يتردد بالحجاز منذ اثنتين وعشرين سنة ومات ولم يعقب، فولي مكانه أخوه محمد الأخيضر مؤسس ملك اليمامة."
  en: "Ismail ibn Yusuf ibn Ibrahim ibn Musa al-Jawn the Alid, called al-Saffak ('the shedder of blood'); he rose among the Hijaz Arabs in 251, drove Mecca's governor Ja'far out, plundered the caliphal households, killed troops and townsfolk, took the gold, silver and the Ka'ba's kiswa and looted for fifty days — then besieged Medina until its people starved and none prayed in the Prophet's mosque, sacked Jeddah's merchants, and had himself named in the khutba at Mecca; after twenty-two years haunting the Hijaz he died heirless and his brother Muhammad al-Ukhaydhir founded the Yamama kingship."
  es: "Ismail ibn Yusuf ibn Ibrahim ibn Musa al-Jawn el Alid, llamado al-Saffak ('el derramador de sangre'); ascendió entre los árabes del Hiyaz en 251, expulsó al gobernador de La Meca, Ja'far, saqueó las casas del califa, mató a soldados y habitantes de las ciudades, se apoderó del oro, la plata y la kiswa de la Kaaba y saqueó durante cincuenta días; luego sitió Medina hasta que su gente murió de hambre y nadie rezó en la mezquita del Profeta, saqueó a los comerciantes de Yeda y se hizo mencionar en la jutba de La Meca; después de veintidós años aterrorizando el Hiyaz, murió sin herederos y su hermano Muhammad al-Ukhaydhir fundó el reino de Yamama."
  fr: "Ismail ibn Yusuf ibn Ibrahim ibn Musa al-Jawn l'Alid, surnommé al-Saffak (« celui qui répand le sang »), s'éleva parmi les Arabes du Hedjaz en 251, chassa le gouverneur de La Mecque, Ja'far, pilla les demeures califales, massacra les troupes et les habitants, s'empara de l'or, de l'argent et de la kiswa de la Kaaba et pilla pendant cinquante jours; puis il assiégea Médine jusqu'à ce que ses habitants meurent de faim et que personne ne prie dans la mosquée du Prophète, pilla les marchands de Djeddah et se fit citer dans le sermon (khutba) à La Mecque; après vingt-deux ans passés à hanter le Hedjaz, il mourut sans héritier et son frère Muhammad al-Ukhaydhir fonda la royauté Yamama."
  ur: "اسماعیل بن یوسف بن ابراہیم بن موسیٰ الجون الد الصافق ⁦('خون بہانے والا')⁩ کہلاتا ہے۔ وہ 251 میں حجاز عرب کے درمیان کھڑا ہوا، مکہ کے گورنر جعفر کو نکال باہر کیا، خلیفہ کے گھرانوں کو لوٹا، فوجوں اور بستیوں کے لوگوں کو قتل کیا، سونا، چاندی اور کعبہ کا کسوہ لے لیا اور پچاس دن تک لوٹ مار کی، پھر مدینہ کا محاصرہ کیا یہاں تک کہ مسجد نبوی میں کوئی بھوکا نہیں پڑا، مسجد نبوی میں نماز ادا کی گئی۔ تاجروں، اور مکہ میں خطبہ میں اپنا نام لیا تھا۔ بائیس سال حجاز میں رہنے کے بعد وہ بے وراثت سے مر گیا اور اس کے بھائی محمد الخذیر نے یمامہ کی بادشاہت کی بنیاد رکھی۔"
  tr: "İsmail ibn Yusuf ibn İbrahim ibn Musa al-Jawn al-Alawi, lakaplı el-Safak, 251 Hicri'de Hicaz'daki bedeviler arasına çıktı, Mekke'ye gitti; burada vali Cafer Beşat kaçtı, hükümdarların evlerini yağmaladı, bir grup asker ve Mekke halkını öldürdü, altın, gümüş ve Kabe'nin örtüsünü aldı, orada elli gün kaldı. Medine'ye yürüdü, halkı açlıktan ölene kadar kuşattı ve kimse camide namaz kılmadı. Cidde'yi ihlal etti, tüccarların parasını aldı ve Mekke'de kendine vaaz verdi. Yirmi iki yıl boyunca Hicaz'a sık sık gitti ve başarısız oldu. Kardeşi Muhammed el-Akhaidir, El-Yamamah krallığının kurucusu oldu."
  id: "Ismail ibn Yusuf ibn Ibrahim ibn Musa al-Jawn al-Alawi, yang dijuluki al-Saffak, berangkat di antara suku Badui Hijaz pada tahun 251 H, menuju Mekah, di mana gubernurnya Ja'far Basbasat melarikan diri, menjarah rumah para penguasa, membunuh sekelompok tentara dan penduduk Mekah, mengambil emas, perak, dan perlindungan Ka'bah, tinggal di sana selama lima puluh hari. Ia berbaris ke Madinah, mengepungnya hingga rakyatnya meninggal kelaparan dan tidak ada yang berdoa di masjidnya. Ia melanggar Jeddah, mengambil uang pedagang, dan memberikan khotbah kepada dirinya sendiri di Mekah. Ia sering berada di Hijaz selama dua puluh dua tahun dan meninggal tanpa hasil. Saudaranya Muhammad al-Akhaidir, pendiri kerajaan Al-Yamamah, menggantikannya."
