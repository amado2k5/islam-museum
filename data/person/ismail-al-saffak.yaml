id: person/ismail-al-saffak
class: person
label:
  ar: إسماعيل السفاك الأخيضري
  en: Ismail al-Saffak al-Ukhaydhiri
summary:
  ar: "إسماعيل بن يوسف بن إبراهيم بن موسى الجون العلوي، الملقب بالسفاك؛ خرج في أعراب الحجاز سنة 251هـ فقصد مكة فهرب عاملها جعفر بسباسات وانتهب منازل أصحاب السلطان وقتل جماعة من الجند وأهل مكة وأخذ الذهب والفضة وكسوة الكعبة وأقام في ذلك خمسين يوماً، وسار إلى المدينة فحاصرها حتى مات أهلها جوعاً ولم يُصلَّ أحد في مسجدها، واستباح جدة وأخذ أموال التجار، وخطب لنفسه بمكة، وكان يتردد بالحجاز منذ اثنتين وعشرين سنة ومات ولم يعقب، فولي مكانه أخوه محمد الأخيضر مؤسس ملك اليمامة."
  en: "Ismail ibn Yusuf ibn Ibrahim ibn Musa al-Jawn the Alid, called al-Saffak ('the shedder of blood'); he rose among the Hijaz Arabs in 251, drove Mecca's governor Ja'far out, plundered the caliphal households, killed troops and townsfolk, took the gold, silver and the Ka'ba's kiswa and looted for fifty days — then besieged Medina until its people starved and none prayed in the Prophet's mosque, sacked Jeddah's merchants, and had himself named in the khutba at Mecca; after twenty-two years haunting the Hijaz he died heirless and his brother Muhammad al-Ukhaydhir founded the Yamama kingship."
