summary:
  ar: "داعية ماليزي موجّه إلى الشباب، وُلد في سونغاي بيتاني بولاية قدح سنة 1983 وتخصص في الشريعة واللغة العربية في دمشق. أسس معهد تحفيظ القرآن الذي صار «أكاديمية دار العلمي»، ويرأس شركة «دعوة غلوبال»، واشتهر بمواعظه عن أشراط الساعة وسير الصحابة؛ بلغ متابعوه 3.4 ملايين على تيك توك و1.3 مليون على إنستغرام بحسب تحليل معهد ISEAS في أكتوبر 2026، وجمعت مبادرته «ركوب دعوة الشباب» في ألور ستار نحو 40 ألف شاب في سبتمبر 2026."
  en: "Malaysian youth-focused preacher, born in Sungai Petani, Kedah, in 1983 and trained in Shariah and Arabic in Damascus. He founded the tahfiz school that became Akademi Darul Ilmi and heads Dakwah Global Sdn. Bhd.; he is known for sermons on the signs of the end times and the lives of the Companions. ISEAS analysis in October 2026 counted 3.4 million TikTok and 1.3 million Instagram followers for him, and his 'Ride Dakwah Anak Muda' gathering in Alor Setar drew some 40,000 young people in September 2026."
  ur: "نوجوانوں پر مرکوز ملائیشیائی مبلغ، 1983 میں قدح کے سنگائی پیتانی میں پیدا ہوئے اور دمشق میں شریعت و عربی کی تعلیم حاصل کی۔ انہوں نے تحفیظ اسکول قائم کیا جو اکیڈمی دار العلمی بنا، اور ڈاکواہ گلوبل کے سربراہ ہیں؛ قیامت کی نشانیوں اور صحابہ کی سیرت پر خطبات سے معروف ہیں۔ اکتوبر 2026 کے ISEAS تجزیے کے مطابق ٹک ٹاک پر ان کے فالوورز 3.4 ملین اور انسٹاگرام پر 1.3 ملین تھے، اور ستمبر 2026 میں الور ستار میں ان کی «رائیڈ ڈاکواہ انک مودا» تقریب میں تقریباً 40 ہزار نوجوان شریک ہوئے۔"
