id: person/abu-al-hayja-al-samin
class: person
label: { ar: "أبو الهيجاء السمين", en: "Abu al-Hayja al-Samin", fr: "Abu al-Hayja al-Samin", es: "Abu al-Hayja al-Samin", ur: "ابو الحیاۃ الثمین" }
summary:
  ar: "الأمير أبو الهيجاء السمين، من أكبر أمراء الصلاحية وأشجعهم؛ قتل الكنز أخاه — وكان أميراً في أقطاعه بالصعيد — فعظم قتله عليه، فسار إلى قتاله وسيّر معه صلاح الدين جماعة من الأمراء وكثيراً من العسكر، فافتتح مدينة طود بعد قتال أهلها ثم لحق الكنز فقتله ومن معه سنة سبعين وخمسمائة {cite:kamil-ibn-al-athir p. 64-65}."
  en: "Abu al-Hayja 'the Fat', among the greatest and bravest of the Salahiyya amirs — when Kanz killed his brother in his Upper-Egypt iqta', he marched with Saladin's detachment, took Tud by storm, then ran Kanz down and killed him in 570 {cite:kamil-ibn-al-athir p. 64-65}."
  fr: "Abu al-Hayja « le Gros », parmi les plus grands et les plus braves des émirs de la Salahiyya — lorsque Kanz tua son frère dans son iqta' de Haute-Égypte, il marcha avec le détachement de Saladin, prit Tud d'assaut, puis rattrapa Kanz et le tua en 570 {cite:kamil-ibn-al-athir p. 64-65}."
  es: "Abu al-Hayja 'el Gordo', uno de los más grandes y valientes emires salahíyya, cuando Kanz mató a su hermano en su iqta' del Alto Egipto, marchó con el destacamento de Saladino, tomó Tud por asalto, luego persiguió a Kanz y lo mató en 570 {cite:kamil-ibn-al-athir p. 64-65}."
  ur: "ابو الحیجہ 'موٹا'، صالحیہ امیروں میں سب سے بڑا اور بہادر تھا - جب کنز نے اپنے بھائی کو اپنے بالائی مصر اقطا میں قتل کیا، اس نے صلاح الدین کے دستے کے ساتھ کوچ کیا، طوفان کے ساتھ طود لے گیا، پھر کنز کو نیچے بھاگا اور 570 میں اسے قتل کر دیا۔ 64-65}۔"
  tr: "Selahiyye'nin en büyük ve en cesur prenslerinden biri olan Ebu el-Hayca el-Samin, Yukarı Mısır'daki beyliğinde prens olan kardeşi el-Kanz'ı öldürdü ve bu ölümden dolayı çok üzüldü. Bu yüzden onunla savaşmak için yola çıktı ve Selahaddin onunla birlikte bir grup prens ve çok sayıda asker gönderdi. Halkıyla savaştıktan sonra Tod şehrini fethetti, ardından el-Kanz'ı yakaladı ve onu ve yanındakileri Hicri 570 yılında öldürdü. {Kaynak: Kamil İbn el-Atir s. 64-65}"
  id: "Pangeran Abu al-Hayja’ al-Samin, salah satu pangeran terbesar dan paling berani dari Salahiyya, membunuh saudaranya al-Kanz—yang merupakan seorang pangeran di wilayah kekuasaannya di Mesir Hulu—dan ia sangat sedih atas pembunuhan itu. Maka ia berangkat untuk melawannya, dan Saladin mengirimkan sekelompok pangeran dan banyak tentara bersamanya. Ia menaklukkan kota Tod setelah memerangi penduduknya, kemudian ia mengejar al-Kanz dan membunuhnya beserta orang-orang yang bersamanya pada tahun 570 H {cite:kamil-ibn-al-athir p. 64-65}."
