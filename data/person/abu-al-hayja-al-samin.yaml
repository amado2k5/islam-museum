summary:
  ar: "الأمير أبو الهيجاء السمين، من أكبر أمراء الصلاحية وأشجعهم؛ قتل الكنز أخاه — وكان أميراً في أقطاعه بالصعيد — فعظم قتله عليه، فسار إلى قتاله وسيّر معه صلاح الدين جماعة من الأمراء وكثيراً من العسكر، فافتتح مدينة طود بعد قتال أهلها ثم لحق الكنز فقتله ومن معه سنة سبعين وخمسمائة {cite:kamil-ibn-al-athir p. 64-65}."
  en: "Abu al-Hayja 'the Fat', among the greatest and bravest of the Salahiyya amirs — when Kanz killed his brother in his Upper-Egypt iqta', he marched with Saladin's detachment, took Tud by storm, then ran Kanz down and killed him in 570 {cite:kamil-ibn-al-athir p. 64-65}."
