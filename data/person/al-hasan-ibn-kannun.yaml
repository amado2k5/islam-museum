id: person/al-hasan-ibn-kannun
class: person
label:
  ar: الحسن بن كنون الإدريسي
  en: al-Hasan ibn Kannun al-Idrisi
summary:
  ar: "الحسن بن كنون الإدريسي، آخر ملوك الأدارسة بالمغرب؛ لما أقبل أخوه أبو العيش إلى جهاد العدوة استخلفه على عمله فلما هلك شهيداً سنة 343هـ استجد الملك وشحذ عزائم ملوك زناتة أوليائه فأثخن فيهم، وتحصن من قائد الفاطميين جوهر بقلعة النسر معقلهم بقرب سبتة ثم دعا للشيعة ونقض طاعة المروانية، فأجاز الحكم المستنصر عسكره مع محمد بن قاسم بن طملس سنة 362هـ فكان الظهور للحسن عليهم، فأرسل الحكم مولاه غالب بن عبد الرحمن الملقب الشهامة في الأموال والجنود فبثّ المال في رؤساء البرابرة وضيّق عليه حتى أجلى عن المغرب، فلحق بالقيروان ثم بقرطبة فأُحفل به دخولاً، ثم استدعاه المغرب ودعا لنفسه فتقبضوا عليه وأشخصوه إلى الأندلس فقتل في طريقه فانقرض ملك الأدارسة."
  en: "al-Hasan ibn Kannun al-Idrisi, the last Idrisid king of the Maghreb; succeeding his martyred brother Abu al-Aysh in 343 he renewed the kingship and ground down his Zanata foes, held Qal'at al-Nasr against the Fatimid Jawhar, proclaimed the Shi'a and broke Marwanid obedience — until he routed al-Hakam's army under Ibn Tumlus in 362, whereupon the mawla Ghalib 'al-Shahama' was sent with treasure and troops, bought the Berber chiefs and starved him out to Qayrawan then Cordoba; called back by the Maghreb to claim the kingship he was seized, carried back to Andalus and killed on the way, ending Idrisid rule."
