id: person/al-hasan-ibn-kannun
class: person
label:
  ar: الحسن بن كنون الإدريسي
  en: al-Hasan ibn Kannun al-Idrisi
  es: "al-Hasan ibn Kannun al-Idrisi"
  fr: "al-Hasan ibn Kannun al-Idrisi"
  ur: "الحسن بن کنن الادریسی"
summary:
  ar: "الحسن بن كنون الإدريسي، آخر ملوك الأدارسة بالمغرب؛ لما أقبل أخوه أبو العيش إلى جهاد العدوة استخلفه على عمله فلما هلك شهيداً سنة 343هـ استجد الملك وشحذ عزائم ملوك زناتة أوليائه فأثخن فيهم، وتحصن من قائد الفاطميين جوهر بقلعة النسر معقلهم بقرب سبتة ثم دعا للشيعة ونقض طاعة المروانية، فأجاز الحكم المستنصر عسكره مع محمد بن قاسم بن طملس سنة 362هـ فكان الظهور للحسن عليهم، فأرسل الحكم مولاه غالب بن عبد الرحمن الملقب الشهامة في الأموال والجنود فبثّ المال في رؤساء البرابرة وضيّق عليه حتى أجلى عن المغرب، فلحق بالقيروان ثم بقرطبة فأُحفل به دخولاً، ثم استدعاه المغرب ودعا لنفسه فتقبضوا عليه وأشخصوه إلى الأندلس فقتل في طريقه فانقرض ملك الأدارسة."
  en: "al-Hasan ibn Kannun al-Idrisi, the last Idrisid king of the Maghreb; succeeding his martyred brother Abu al-Aysh in 343 he renewed the kingship and ground down his Zanata foes, held Qal'at al-Nasr against the Fatimid Jawhar, proclaimed the Shi'a and broke Marwanid obedience — until he routed al-Hakam's army under Ibn Tumlus in 362, whereupon the mawla Ghalib 'al-Shahama' was sent with treasure and troops, bought the Berber chiefs and starved him out to Qayrawan then Cordoba; called back by the Maghreb to claim the kingship he was seized, carried back to Andalus and killed on the way, ending Idrisid rule."
  es: "Al-Hasan ibn Kannun al-Idrisi, el último rey idrisí del Magreb, sucedió a su hermano mártir Abu al-Aysh en 343, restauró la monarquía y aplastó a sus enemigos Zanata, defendió Qal'at al-Nasr contra el fatimí Jawhar, proclamó a los chiíes y rompió la obediencia marwaní, hasta que derrotó al ejército de al-Hakam, liderado por Ibn Tumlus, en 362. Entonces, el mawla Ghalib 'al-Shahama' fue enviado con tesoros y tropas, compró a los jefes bereberes y los obligó a huir hasta Qayrawan y luego a Córdoba. Llamado de nuevo por el Magreb para reclamar el trono, fue apresado, llevado de vuelta a Al-Ándalus y asesinado en el camino, poniendo fin al gobierno idrisí."
  fr: "Al-Hasan ibn Kannun al-Idrisi, le dernier roi idrisside du Maghreb, succéda à son frère martyr Abu al-Aysh en 343. Il rétablit le pouvoir royal, écrasa ses ennemis zanata, défendit Qal'at al-Nasr contre les Fatimides de Jawhar, proclama le chiisme et rompit l'obéissance des Marwanides. En 362, il mit en déroute l'armée d'al-Hakam commandée par Ibn Tumlus. Le mawla Ghalib al-Shahama fut alors envoyé avec des trésors et des troupes, racheta les chefs berbères et l'affama jusqu'à Qayrawan, puis Cordoue. Rappelé par le Maghreb pour revendiquer le trône, il fut capturé, ramené en Andalousie et tué en chemin, mettant ainsi fin au règne idrisside."
  ur: "الحسن بن کنن الادریسی، مغرب کا آخری ادریسی بادشاہ؛ 343 میں اپنے شہید بھائی ابو العیش کے بعد اس نے بادشاہی کی تجدید کی اور اپنے زناتا دشمنوں کو نیست و نابود کیا، فاطمی جوہر کے خلاف قلات النصر کا انعقاد کیا، شیعوں کا اعلان کیا اور مروانیوں کی اطاعت کو توڑا- یہاں تک کہ اس نے ابن تملس کے ماتحت الحکم کی فوج کو شکست دے دی جہاں 36 م ثلاثہ کو ذوالجلال میں فتح نصیب ہوئی۔ خزانہ اور فوج کے ساتھ بھیجا، بربر کے سرداروں کو خریدا اور اسے قیروان پھر قرطبہ کی طرف بھوکا مارا۔ مغرب کی طرف سے واپس بلایا گیا تاکہ وہ بادشاہت کا دعویٰ کر سکے جس پر وہ قبضہ کر لیا گیا تھا، اندلس واپس لے جایا گیا اور راستے میں مارا گیا، ادریس کی حکومت کا خاتمہ ہوا۔"
