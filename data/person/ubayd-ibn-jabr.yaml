summary:
  ar: "عبيد بن جبر، أبو جعفر الغفاري، مولاهم المصري، تابعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} روى عن مولاه أبي بصرة الغفاري، وروى عنه كليب بن ذهل الحضرمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} روى له أبو داود حديثًا واحدًا، وذكره الفسوي في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} ونقل ابن يونس أنه قيل إنه كان قبطيًا ممن بعثهم المقوقس مع مارية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961}"
  en: "Ubayd ibn Jabr, Abu Ja'far al-Ghifari, a client of the Ghifar and Egyptian, a Successor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} He narrated from his master Abu Basra al-Ghifari, and Kulayb ibn Dhahl al-Hadrami narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Abu Dawud has one hadith from him, and al-Fasawi listed him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Ibn Yunus reports that he was said to be a Copt among those sent by al-Muqawqis with Maria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961}"
  es: "Ubayd ibn Jabr, Abu Ja'far al-Ghifari, cliente de Ghifar y egipcio, su sucesor. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Él narró de su maestro Abu Basra al-Ghifari, y Kulayb ibn Dhahl al-Hadrami narró de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Abu Dawud tiene un hadiz suyo y al-Fasawi lo incluyó entre los dignos de confianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Ibn Yunus informa que se decía que era un copto entre los enviados por al-Muqawqis con María. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961}"
  fr: "Ubayd ibn Jabr, Abu Ja'far al-Ghifari, client du Ghifar et égyptien, son successeur. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Il a raconté de son maître Abu Basra al-Ghifari, et Kulayb ibn Dhahl al-Hadrami a raconté de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Abu Dawud a un hadith de lui, et al-Fasawi l'a répertorié parmi les dignes de confiance. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Ibn Yunus rapporte qu'il aurait été copte parmi ceux envoyés par al-Muqawqis avec Marie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961}"
  ur: "عبید بن جبر، ابو جعفر الغفاری، غفار کا مؤکل اور مصری، اس کا جانشین۔ انہوں نے اپنے آقا ابو بصرہ الغفاری سے روایت کی ہے اور کلیب بن ذہل الحدرمی نے ان سے روایت کی ہے۔ {حوالہ: فقہ الموسویۃ-کویتیہ-نور-v3 ص14961} ابوداؤد نے ان سے ایک حدیث نقل کی ہے، اور الفساوی نے انہیں ثقہ قرار دیا ہے۔ ابن یونس روایت کرتے ہیں کہ وہ ان لوگوں میں سے ایک قبطی تھے جنہیں مقوقس نے مریم کے ساتھ بھیجا تھا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص14961}"
  tr: "Ubeyd bin Cebr, Ebu Ca'fer el-Giferi, özgür bırakılan köleleri el-Masri, bir Tabi'i. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.14961} Özgür bırakılan kölesi Ebu Basra el-Ghifari'den, Kulayb ibn Dhuhl al-Hadrami ise ondan rivayet etti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14961} Ebu Davud ondan bir hadis anlattı ve al-Fasavi güvenilir kaynaklarda bunu andı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14961} İbn Yunus, el-Muqawqis'in Maria ile gönderilenler arasında kendisinin Kıpti olduğunu bildirmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14961}"
  id: "Ubayd ibn Jabr, Abu Ja'far al-Ghifari, budak mereka yang dibebaskan al-Masri, seorang Tabi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14961} Ia menceritakan dari budaknya yang telah dibebaskan, Abu Basra al-Ghifari, dan Kulayb ibn Dhuhl al-Hadrami menceritakan darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14961} Abu Dawud menceritakan satu hadis darinya, dan al-Fasawi menyebutkannya dalam catatan yang dapat dipercaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14961} Ibn Yunus melaporkan bahwa ia adalah seorang Koptik di antara mereka yang dikirim oleh al-Muqawqis bersama Maria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14961}"
