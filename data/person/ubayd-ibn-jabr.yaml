summary:
  ar: "عبيد بن جبر، أبو جعفر الغفاري، مولاهم المصري، تابعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} روى عن مولاه أبي بصرة الغفاري، وروى عنه كليب بن ذهل الحضرمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} روى له أبو داود حديثًا واحدًا، وذكره الفسوي في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} ونقل ابن يونس أنه قيل إنه كان قبطيًا ممن بعثهم المقوقس مع مارية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961}"
  en: "Ubayd ibn Jabr, Abu Ja'far al-Ghifari, a client of the Ghifar and Egyptian, a Successor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} He narrated from his master Abu Basra al-Ghifari, and Kulayb ibn Dhahl al-Hadrami narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Abu Dawud has one hadith from him, and al-Fasawi listed him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961} Ibn Yunus reports that he was said to be a Copt among those sent by al-Muqawqis with Maria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14961}"
