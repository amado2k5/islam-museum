summary:
  ar: قرشي أموي، عم عثمان بن عفان ووالد مروان؛ أسلم يوم الفتح وسكن المدينة ثم نفاه النبي إلى الطائف، وأُعيد إلى المدينة في خلافة عثمان ومات بها؛ واختلفت الروايات في سبب نفيه، وفي كثير منها كلام لابن حجر في الإسناد.
  en: A Qurashi of the Umayyad clan, uncle of Uthman ibn Affan and father of Marwan. He accepted Islam on the day of the conquest, settled in Medina, was exiled by the Prophet to al-Ta'if, was brought back under Uthman and died in Medina. Reports
    on the reason for his exile differ, and Ibn Hajar comments on the chains of several of them.
