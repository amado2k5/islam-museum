summary:
  ar: "فاطمة بنت الحسين، كتبت إلى الخليفة عمر بن عبد العزيز تشكره على ما فعل حين قسم ألف دينار من سهم ذوي القربى في بني هاشم وساوى فيها بين الذكر والأنثى والكبير والصغير {cite:salabi-umayyad-state-2020 p.358}. لم يحدد الكتاب نسبها على وجه الدقة؛ فالتعيين المذكور هنا مقتصر على الاسم الوارد في النص."
  tr: "Fatimah bint Al-Huseyn, Halife Ömer bin Abdülaziz'e, akrabalarının paylarından bin dinarı Banu Haşim arasında paylaştırarak erkek ve kadın, yaşlılar ve gençleri eşitlediği için teşekkür etti, {atıf:salabi-umayyad-state-2020 s.358}. Kitapta onun kesin soy ağacı belirtilmemiştir; burada bahsedilen isim metinde belirtilen isimle sınırlıdır."
  id: "Fatimah bint Al-Husayn menulis kepada Khalifah Umar ibn Abd al-Aziz mengucapkan terima kasih atas apa yang telah dilakukannya ketika membagi seribu dinar dari bagian kerabat di antara Banu Hashim, menyamakan laki-laki dan perempuan, orang tua dan muda, {cite:salabi-umayyad-state-2020 hlm.358}. Buku tersebut tidak menyebutkan garis keturunan pastinya; sebutan yang disebutkan di sini terbatas pada nama yang disebutkan dalam teks."
