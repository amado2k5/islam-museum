summary:
  ar: "شبل المدري، لُوحظ باللطف فبَرِئ. اشتهى لحمًا فأخذته حدأة من يده، فنوى الصوم ورجع إلى المسجد، ثم جاءت حدأة أخرى تنازعها الطعمة فسقطت من إحداهما قطعة في دار امرأته، فطبختها، فلما أفطر شبل وأخبرته بالقصة بكى وقال: الحمد لله الذي لم ينسَ شبلًا وإن كان شبل ينساه."
  en: "Shibl al-Madri, watched over with gentleness and made whole. He craved meat, and a kite snatched it from his hand; he vowed a fast and returned to the mosque; another kite came and fought over the prey, and a piece fell into his household, where his wife cooked it; when he came home to break the fast and asked where the meat came from, she told him of the two kites, and he wept and said: praise God who did not forget Shibl, though Shibl forgets Him."
  ur: "شبل مدری، جن پر نرمی سے نظر کی گئی اور وہ شفا پا گئے۔ انہیں گوشت کی خواہش ہوئی، تو ایک چیل ان کے ہاتھ سے چھین کر لے گئی؛ انہوں نے روزے کی نذر مانی اور مسجد لوٹ آئے۔ پھر دوسری چیل آئی اور دونوں نے گوشت پر جھپٹا مارا، اور ایک ٹکڑا ان کے گھر میں گرا، جسے ان کی بیوی نے پکایا۔ جب شبل افطار کے لیے گھر آئے اور پوچھا کہ یہ گوشت کہاں سے آیا، تو بیوی نے دونوں چیلوں کا قصہ سنایا؛ وہ روئے اور کہا: اللہ کی حمد ہے جس نے شبل کو نہیں بھلایا، اگرچہ شبل اسے بھول جاتا ہے۔"
