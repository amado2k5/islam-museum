summary:
  ar: "أبو الفرج العلاء بن علي بن محمد بن علي بن أحمد بن عبيد الله الواسطي المعروف بابن السوادي؛ الكاتب الشاعر؛ كان شاعراً فاضلاً ظريفاً خليعاً مطبوعاً من بيت كبير في بلده مشهوراً بالكتابة والنباهة واليسر؛ وقال عماد الدين الكاتب في «الخريدة»: أنشدني لنفسه...؛ وأُعجب ابن خلكان ببيت له فنظمه في دوبيت {cite:wafayat-ayan}."
  en: "Ibn al-Sawwadi al-Wasiti (482–556 or 551) — Wasit's katib-poet of a great house; al-Imad quoted him in the Kharida and Ibn Khallikan reworked one of his lines into a quatrain {cite:wafayat-ayan}."
  es: "Ibn al-Sawwadi al-Wasiti (482–556 o 551) — Poeta katib de Wasit de una gran casa; al-Imad lo citó en el Kharida e Ibn Khallikan reelaboró uno de sus versos en una cuarteta {cite:wafayat-ayan}."
  fr: "Ibn al-Sawwadi al-Wasiti (482–556 ou 551) — Katib-poète de Wasit d'une grande maison; al-Imad l'a cité dans la Kharida et Ibn Khallikan a retravaillé l'un de ses vers en un quatrain {cite:wafayat-ayan}."
  ur: "ابن السوادی الوصطی ⁦(482-556 یا 551)⁩ - وسط کا ایک عظیم گھر کا کاتب شاعر؛ العماد نے اسے خریدہ میں نقل کیا ہے اور ابن خلیقان نے اس کی ایک سطر کو دوبارہ ترتیب دیا ہے۔"
  tr: "Ebu el-Faraj el-Ala ibn Ali bin Muhammed ibn Ali ibn Ahmed ibn Ubeyd Allah el-Vasiti, İbn el-Savadi olarak bilinir; yazar ve şair; kasabasındaki seçkin bir aileden gelen, yazısı, zekâsı ve kolaylığıyla ünlü, erdemli, esprili ve mütevazı bir şairdi. Yazar İmadeddin 'El-Khuraidah'ta şöyle demiştir: Beni kendisi için okumuştu...; İbn Hallikan onun şiirinden etkilenmiş ve onu beyt olarak {atıf:vafayat-ayan} şeklinde bestelemiştir."
  id: "Abu al-Faraj al-'Ala ibn Ali ibn Muhammad ibn Ali ibn Ahmad ibn Ubayd Allah al-Wasiti, dikenal sebagai Ibn al-Sawadi; penulis dan penyair; ia adalah penyair yang berbudi luhur, cerdas, dan rendah hati dari keluarga terkemuka di kotanya, terkenal karena tulisan, kecerdasan, dan kemudahan. Imad al-Din, sang penulis, berkata dalam 'Al-Khuraidah': Ia membacakan saya untuk dirinya sendiri...; Ibn Khallikan terkesan dengan puisinya dan menulisnya dalam bentuk bait {cite:wafayat-ayan}."
