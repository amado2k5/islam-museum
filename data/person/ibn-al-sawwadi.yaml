  ar: "أبو الفرج العلاء بن علي بن محمد بن علي بن أحمد بن عبيد الله الواسطي المعروف بابن السوادي؛ الكاتب الشاعر؛ كان شاعراً فاضلاً ظريفاً خليعاً مطبوعاً من بيت كبير في بلده مشهوراً بالكتابة والنباهة واليسر؛ وقال عماد الدين الكاتب في «الخريدة»: أنشدني لنفسه...؛ وأُعجب ابن خلكان ببيت له فنظمه في دوبيت {cite:wafayat-ayan}."
  en: "Ibn al-Sawwadi al-Wasiti (482–556 or 551) — Wasit's katib-poet of a great house; al-Imad quoted him in the Kharida and Ibn Khallikan reworked one of his lines into a quatrain {cite:wafayat-ayan}."
