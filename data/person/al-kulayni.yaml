  ar: "محمد بن يعقوب الكليني، يعد من أفاضل الشيعة ورؤسائهم وهو عند الشيعة كالبخاري عند أهل السنة ويسمونه «ثقة الإسلام»؛ له كتاب الكافي في ثلاثة أجزاء: الأول في الأصول والثاني والثالث في الفروع، ويحتوي ستة عشر ألف حديث قسمها — كما فعل أهل السنة — إلى صحيح وحسن وقوي وضعيف، وقد اتفق في جمعه عشرون عاماً، ومات ببغداد سنة ٣٢٨ أو سنة ٣٢٩ ودفن بالكوفة {cite:duha-islam p. 850, 891}."
  en: "al-Kulayni — 'the Bukhari of the Shi'a', titled Thiqat al-Islam; his al-Kafi gathered sixteen thousand hadiths over twenty years {cite:duha-islam p. 850, 891}."
