summary:
  ar: "محمد بن يعقوب الكليني أبو جعفر، محدث إمامي من قرية كلين قرب الري؛ تلمذ بقم ثم كان شيخ الإمامية بالري في زمانه عند النجاشي، وانتقل إلى بغداد نحو العقد الأول من القرن الرابع فأتم بها «الكافي» في عشرين سنة {cite:encyclopaedia-of-islam-2 vol. 5 p. 400-401}. يعد عند أحمد أمين من أفاضل الشيعة ورؤسائهم وهو عندهم كالبخاري عند أهل السنة ويسمونه «ثقة الإسلام»؛ «الكافي» فيه ستة عشر ألف حديث في ثلاثة أجزاء {cite:duha-islam p. 850, 891}. ومات ببغداد سنة ٣٢٨ أو ٣٢٩، والأرجح شعبان ٣٢٩/أيار 941 {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}."
  en: "Muhammad ibn Ya'qub al-Kulayni, Abu Ja'far, the Imami traditionist from Kulayn near Rayy; schooled at Qumm, then shaykh of the Imamiyya of Rayy in al-Najashi's words, he moved to Baghdad about the first decade of the 4th century and there finished al-Kafi after twenty years' work {cite:encyclopaedia-of-islam-2 vol. 5 p. 400-401} — 'the Bukhari of the Shi'a', titled Thiqat al-Islam, his al-Kafi holding sixteen thousand hadiths {cite:duha-islam p. 850, 891}. Died at Baghdad 328 or 329, most likely Sha'ban 329/May 941 {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}."
  ur: "محمد بن یعقوب کلینی، ابو جعفر، رے کے قریب گاؤں کلین کا امامی محدث؛ قم میں تلمذ حاصل کیا، پھر نجاشی کے بقول اپنے زمانے میں رے کے امامیہ کا شیخ تھا، اور چوتھی صدی کے پہلے عشرے میں بغداد منتقل ہو کر وہاں بیس سال کی محنت سے «الکافی» مکمل کی {cite:encyclopaedia-of-islam-2 vol. 5 p. 400-401} — شیعوں کے نزدیک ان کا وہی مقام ہے جو اہلِ سنت میں بخاری کا، انہیں «ثقۃ الاسلام» کہا جاتا ہے اور الکافی میں سولہ ہزار احادیث ہیں {cite:duha-islam p. 850, 891}۔ بغداد میں 328 یا 329ھ میں فوت ہوا، غالباً شعبان 329/مئی 941ء {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}۔"
