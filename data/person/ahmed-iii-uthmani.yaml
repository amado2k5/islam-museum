summary:
  ar: "أحمد الثالث، السلطان العثماني الثالث والعشرون، وُلد سنة 1084هـ/1673م وحكم من 1115هـ/1703م إلى 1143هـ/1730م. خاضت الدولة في عهده حروباً مع روسيا والبندقية والنمسا، فاستعادت المورة من البندقية وخسرت بلغراد بصلح بساروفتز سنة 1718م. وبعد ذلك غلب على عهده عصر التوليب بما فيه من ترف وفنون وأول مطبعة في إسطنبول، حتى ثارت إسطنبول سنة 1730م فتنازل عن العرش ومات سنة 1149هـ/1736م."
  en: "Ahmed III, the twenty-third Ottoman sultan, was born in 1084/1673 and reigned from 1115/1703 to 1143/1730. His reign brought wars with Russia, Venice and Austria: the Morea was regained from Venice, and Belgrade was lost under the Treaty of Passarowitz in 1718. The later years, the Age of Tulips, were marked by court pleasure, the arts and the first printing press in Istanbul, until a rising in Istanbul in 1730 forced his abdication; he died in 1149/1736."
  ur: "احمد ثالث عثمانی سلطنت کے تئیسویں سلطان تھے، جو 1084ھ/1673ء میں پیدا ہوئے اور 1115ھ/1703ء سے 1143ھ/1730ء تک حکمران رہے۔ ان کے دور میں روس، وینس اور آسٹریا سے جنگیں ہوئیں، مورہ وینس سے واپس لیا گیا اور 1718ء کے معاہدۂ پساروویتس میں بلغراد ہاتھ سے گیا۔ بعد کے برس عہد لالہ کہلاتے ہیں، جن میں دربار کی تفریح، فنون اور استنبول کا پہلا چھاپہ خانہ نمایاں رہے، یہاں تک کہ 1730ء کی بغاوت نے انہیں دستبردار ہونے پر مجبور کیا اور وہ 1149ھ/1736ء میں فوت ہوئے۔"
