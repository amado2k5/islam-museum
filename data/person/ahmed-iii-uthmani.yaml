summary:
  ar: "السلطان أحمد الثالث (١١١٥–١١٤٣هـ/١٧٠٣–١٧٣٠م)؛ في عهده ظلت راية الجهاد مرفوعة فأعادت الدولة المورة وآزاق، وحاصر المجاهدون قيصر روسيا بطرس وخليلته ومعهما مئتا ألف كادوا يقعون في الأسر لولا أن رفع الصدر الأعظم بلطه جي باشا الحصار ووقع معاهدة فلكزن (بروث) في جمادى الآخرة ١١٢٣هـ فعزله السلطان. وتوسطت هولندا وإنكلترا فوقعت معاهدة أدرنة ١١٢٥هـ وفيها تنازلت روسيا عن سواحل البحر الأسود. وانتصر العثمانيون على البنادقة واستولوا على كريت وجزراً، لكن النمسا انتصرت وسقطت بلغراد عام ١١٢٩هـ/١٧١٧م، فعُقد صلح بساروفتز عام ١١٣٠هـ/١٧١٨م انتزعت به النمسا بلغراد وأكثر الصرب وجزءاً من الأفلاق وعادت المورة للعثمانيين {cite:dawlat-uthmaniyya-salabi p. 310-311}."
  en: "Ahmed III (r. 1115–1143/1703–1730) — recovered the Morea and Azov, nearly captured Peter the Great on the Pruth, then lost Belgrade to Austria and signed Passarowitz (1718): Serbia and part of Wallachia gone, Morea kept {cite:dawlat-uthmaniyya-salabi p. 310-311}."
