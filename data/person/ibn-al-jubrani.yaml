summary:
  ar: "ابن الجبراني، شيخ الشهاب الشواء وأديب حلب اللغوي؛ كان من قرية جبرين قورسطايا من أعمال عزاز نسب إليها، متضلعاً من علم الأدب خصوصاً اللغة فإنها كانت غالبة عليه وكان متبحراً فيها، وله تصدر في جامع حلب في المقصورة الشرقية على صحن الجامع؛ وسمعه ابن خلكان — وهو يومئذ مشتغل بالأدب — يتكلم في قاعدة الأفعال الثلاثية التي أولها واو على فعل بكسر العين وأن مضارعها أربع لغات إلا الثمانية الشاذة ورم وورث وورع ووري وومق ووثق ووفق وولي؛ وذكر ابن الشعار أنه كان عارفاً بعلوم القرآن واللغة والنحو معرفة جيدة وكان شديد الكلب للدنيا يحتمل ضيق العيش حتى جمع مالاً لم يستفد منه أحد؛ مولده سنة إحدى وستين وخمسمائة وتوفي سابع رجب سنة ثمان وعشرين وستمائة بحلب ودفن في سفح جبل جوشن {cite:wafayat-ayan p. 237}."
  en: "Ibn al-Jubrani — the Aleppine philologist of Jubran Qurastaya who held the east maqsura of Aleppo's Jami', where Ibn Khallikan heard him discourse on the quadrisemy of waw-initial verbs; a master of Qur'anic sciences, language and grammar who, per Ibn al-Sha'ar, hoarded his hard-won fortune and left no famous pupil; died 7 Rajab 628, buried at Jabal Jawshan {cite:wafayat-ayan p. 237}."
  es: "Ibn al-Jubrani — el filólogo alepino de Jubran Qurastaya que ocupó la maqsura oriental del Jami' de Alepo, donde Ibn Khallikan lo escuchó disertar sobre la cuadrisemia de los verbos iniciales waw; un maestro de las ciencias coránicas, la lengua y la gramática que, según Ibn al-Sha'ar, acaparó su fortuna ganada con tanto esfuerzo y no dejó ningún alumno famoso; murió el 7 de Rajab de 628, enterrado en Jabal Jawshan {cite:wafayat-ayan p. 237}."
  fr: "Ibn al-Jubrani — le philologue d'Alep de Jubran Qurastaya qui occupait la maqsura orientale du Jami' d'Alep, où Ibn Khallikan l'entendit disserter sur la quadrisémie des verbes commençant par waw; un maître des sciences coraniques, de la langue et de la grammaire qui, selon Ibn al-Sha'ar, a amassé sa fortune durement gagnée et n'a laissé aucun élève célèbre; mort le 7 Rajab 628, enterré à Jabal Jawshan {cite:wafayat-ayan p. 237}."
  ur: "ابن الجبرانی - جوبران قرستایا کے حلب کے ماہر فلکیات ہیں جنہوں نے حلب کے جامع کے مشرقی مقصورہ پر قبضہ کیا، جہاں ابن خلیقان نے اسے واو ابتدائی فعل کی چودھراہٹ پر گفتگو سنی۔ قرآنی علوم، زبان اور گرامر کا ایک ماہر جس نے ابن الشعر کے مطابق اپنی محنت سے جیتی ہوئی دولت جمع کی اور کوئی مشہور شاگرد نہیں چھوڑا۔ وفات 7 رجب 628، جبل جوشاں میں دفن ہوئیں۔ 237}۔"
