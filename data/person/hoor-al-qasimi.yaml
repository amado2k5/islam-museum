summary:
  ar: "حور القاسمي (وُلدت سنة 1980) قيّمة فنية إماراتية وابنة حاكم الشارقة، مؤسسة مؤسسة الشارقة للفنون ورئيستها ومديرتها، إذ أنشأتها سنة 2009 بعد أن شاركت في تقييم الدورة السادسة لبينالي الشارقة وهي في الثانية والعشرين من عمرها. درست في كلية سليد للفنون الجميلة والأكاديمية الملكية للفنون والكلية الملكية للفنون في لندن، واختيرت الشخصية الأكثر تأثيرًا في عالم الفن المعاصر في قائمة باور 100 لمجلة آرت ريفيو سنة 2024."
  en: "Hoor Al Qasimi (born 1980) is an Emirati art curator, a daughter of the Ruler of Sharjah, and the founder, president and director of the Sharjah Art Foundation, which she established in 2009 after co-curating the Sharjah Biennial's sixth edition at the age of twenty-two. Educated at the Slade School of Fine Art, the Royal Academy of Arts and the Royal College of Art, she was named the most influential person in the contemporary art world in ArtReview's Power 100 of 2024."
  ur: "حور القاسمی (پیدائش 1980) اماراتی فن کیوریٹر، حاکمِ شارجہ کی صاحبزادی، اور شارجہ آرٹ فاؤنڈیشن کی بانی، صدر و ڈائریکٹر ہیں، جسے انھوں نے 2009 میں قائم کیا، جبکہ اس سے پہلے وہ 22 برس کی عمر میں شارجہ بائی اینال کی چھٹی نمائش کی شریک کیوریٹر رہ چکی تھیں۔ انھوں نے سلیڈ اسکول آف فائن آرٹ، رائل اکیڈمی آف آرٹس اور رائل کالج آف آرٹ سے تعلیم حاصل کی، اور 2024 میں آرٹ ری ویو کی پاور 100 فہرست میں انہیں عصری فن کی دنیا کی سب سے بااثر شخصیت قرار دیا گیا۔"
