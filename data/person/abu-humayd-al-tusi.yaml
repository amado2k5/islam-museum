label: { ar: "أبو حميد الطوسي", en: "Abu Humayd al-Tusi", fr: "Abu Humayd al-Tusi", es: "Abu Humayd al-Tusi", ur: "ابو حمید طوسی" }
summary:
  ar: "من قواد أهل خراسان، لقي سابقاً الخوارزمي بسوق الكناسة فعلم منه مقتل إبراهيم الإمام وأن الوصية لأخيه أبي العباس وأنه بالكوفة، فأخبر أبا الجهم وموسى بن كعب وغدا سابق فمضيا إليهم فبايع أبو العباس وأكبّ يقبل أطرافه وأبو سلمة لا يعلم {cite:muruj-al-dhahab p. 241-242}."
  en: "The Khurasani commander whose chance meeting with Sabiq in the sweeper's market uncovered the hidden Abbasids and triggered al-Saffah's bay'a {cite:muruj-al-dhahab p. 241-242}."
  fr: "Le chef khurasanien dont la rencontre fortuite avec Sabiq au marché d'al-Kunasa révéla les Abbassides cachés et déclencha la bay'a d'al-Saffah {cite:muruj-al-dhahab p. 241-242}."
  es: "El comandante de Jorasán cuyo encuentro casual con Sabiq en el mercado de los barrenderos descubrió a los abasíes ocultos y desencadenó la bay'a de al-Saffah {cite:muruj-al-dhahab p. 241-242}."
  ur: "خراسانی کمانڈر جس کی جھاڑو دینے والے بازار میں صابق سے موقع ملاقات نے چھپے ہوئے عباسیوں کو بے نقاب کیا اور الصفح کی بیع کو متحرک کر دیا۔ 241-242}۔"
  tr: "Horasan halkının önderlerinden biri olan bu kişi, El-Kanasa pazarında El-Harezmi ile karşılaştı ve ondan İmam İbrahim'in öldürüldüğünü ve vasiyetin kardeşi Ebu el-Abbas'a bırakıldığını, onun da Kûfe'de olduğunu öğrendi. Bunun üzerine Ebu el-Cehm ve Musa bin Kaab'ı bilgilendirdi ve ertesi gün onların yanına gitti. Ebu el-Abbas biat etti ve eğilerek onun uzuvlarını öptü. Ebu Seleme ise bundan habersizdi. {Kaynak: Muruj-al-Dhahab s. 241-242}"
  id: "Salah seorang pemimpin penduduk Khorasan, ia bertemu Al-Khwarizmi di pasar Al-Kanasa dan mengetahui darinya tentang pembunuhan Ibrahim sang Imam dan bahwa wasiat itu ditujukan kepada saudaranya Abu Al-Abbas dan bahwa ia berada di Kufa, maka ia memberitahukan hal itu kepada Abu Al-Jahm dan Musa bin Kaab dan keesokan harinya ia pergi menemui mereka dan Abu Al-Abbas berbaiat dan membungkuk untuk mencium anggota tubuhnya dan Abu Salama tidak mengetahuinya {cite:muruj-al-dhahab p. 241-242}."
