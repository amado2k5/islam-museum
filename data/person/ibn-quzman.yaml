label: { ar: "أبو بكر ابن قزمان" }
summary:
  ar: "الزجال القرطبي أبو بكر ابن قزمان؛ قال فيه لسان الدين ابن الخطيب: كان نسيج وحده أدباً وظرفاً ولوذعية وشهرة، وهذه الطريقة الزجلية بديعة تتحكم فيها ألقاب البديع وتنفسح لكثير مما يضيق على الشاعر سلوكه وبلغ فيها أبو بكر مبلغاً حجبره الله عمن سواه فهو آيتها المعجزة وحجتها البالغة وفارسها المعلم والمبتدئ فيها والمتمم؛ واشتمل عليه المتوكل على الله فرقاه إلى مجالسه وكساه ملابسه {cite:nafh-tib-maqqari p. 28}."
  en: "The Cordoban zajal master Abu Bakr Ibn Quzman; Ibn al-Khatib judged him the art's miraculous sign and its definitive master, patronised by the Abbadid al-Mutawakkil {cite:nafh-tib-maqqari p. 28}."
