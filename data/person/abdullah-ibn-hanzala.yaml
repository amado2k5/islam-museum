  ar: "قائد خلع أهل المدينة ليزيد سنة ثلاث وستين، قال والله ما خرجنا على يزيد حتى خفنا أن نرمى بالحجارة من السماء أن رجلاً ينكح أمهات الأولاد والبنات والأخوات ويشرب الخمر ويدع الصلاة {cite:tarikh-khulafa-minhaj-1434 p. 344-345}. وعند المسعودي خرج هو وعبد الله بن مطيع العدوي على مسرف بن عقبة يوم الحرة {cite:muruj-al-dhahab p. 67}"
  en: "Leader of Medina's deposition of Yazid in 63: 'by God, we did not march out against Yazid until we feared stones raining from heaven — a man who weds mothers of sons, daughters and sisters, drinks wine and abandons prayer' {cite:tarikh-khulafa-minhaj-1434 p. 344-345}."
