id: person/qutuz
class: person
label: { ar: "السلطان المظفر سيف الدين قطز المعزي" }
summary:
  ar: "مملوك المعز أيبك وأتابك ولده الملك المنصور علي، لما نزل التتار على آمد سنة سبع وخمسين وقدم ابن العديم يطلب النجدة جمع الأمراء والأعيان فقضى الشيخ عز الدين بن عبد السلام بوجوب قتالهم وأخذ ما يستعان به بشرط بيع حوائص الأمراء وآلاتهم وعدم أخذ أموال العامة، ثم قبض على ابن أستاذه وقال هذا صبي والوقت صعب ولا بد من أن يقوم رجل شجاع ينتصب للجهاد وتسلطن ولقب بالملك المظفر، وقاد المصريين إلى الشام فهزم التتار عند عين جالوت يوم الجمعة خامس عشري رمضان سنة ثمان وخمسين، وقتله بيبرس وجماعة من الأمراء قريباً من المنزلة الصالحية في ذي القعدة {cite:tarikh-khulafa-minhaj-1434 p. 719-721}."
  en: "Aybak's mamluk and his boy's atabeg; when the Tatars stood at Amid and Ibn al-Adim begged aid, he seized the sultanate as al-Muzaffar — 'the time is hard; a brave man must stand for jihad' — broke the Tatars at Ayn Jalut, 15 Ramadan 658, and was killed by Baybars's party near al-Manzila al-Salihiyya in Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 719-721}. Ibn al-Imad adds the famous reports: the delouser al-Bardajani heard him promise an amirate of fifty on the strength of a dream — 'the Prophet told me: you will hold Egypt and break the Tatars' — and the astrologer foretold the same to Qutuz and Baybars both; he claimed descent as Mahmud b. Mamdud, nephew of Khwarazmshah's sister, and left no male heir {cite:shadharat-dhahab p. 301-302}."
died: { edtf: "1260-10-24~", hijri: "0658-11-16", calendar: julian, precision: day, status: tradition, derived: true, note: "قُتل يوم سادس عشر ذي القعدة بقرب قطية ولم يخلف ولداً ذكراً {cite:shadharat-dhahab p. 299, 301}." }
