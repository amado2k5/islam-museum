id: person/qutuz
class: person
label: { ar: "السلطان المظفر سيف الدين قطز المعزي" }
summary:
  ar: "مملوك المعز أيبك وأتابك ولده الملك المنصور علي، لما نزل التتار على آمد سنة سبع وخمسين وقدم ابن العديم يطلب النجدة جمع الأمراء والأعيان فقضى الشيخ عز الدين بن عبد السلام بوجوب قتالهم وأخذ ما يستعان به بشرط بيع حوائص الأمراء وآلاتهم وعدم أخذ أموال العامة، ثم قبض على ابن أستاذه وقال هذا صبي والوقت صعب ولا بد من أن يقوم رجل شجاع ينتصب للجهاد وتسلطن ولقب بالملك المظفر، وقاد المصريين إلى الشام فهزم التتار عند عين جالوت يوم الجمعة خامس عشري رمضان سنة ثمان وخمسين، وقتله بيبرس وجماعة من الأمراء قريباً من المنزلة الصالحية في ذي القعدة {cite:tarikh-khulafa-minhaj-1434 p. 719-721}."
  en: "Aybak's mamluk and his boy's atabeg; when the Tatars stood at Amid and Ibn al-Adim begged aid, he seized the sultanate as al-Muzaffar — 'the time is hard; a brave man must stand for jihad' — broke the Tatars at Ayn Jalut, 15 Ramadan 658, and was killed by Baybars's party near al-Manzila al-Salihiyya in Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 719-721}. Ibn al-Imad adds the famous reports: the delouser al-Bardajani heard him promise an amirate of fifty on the strength of a dream — 'the Prophet told me: you will hold Egypt and break the Tatars' — and the astrologer foretold the same to Qutuz and Baybars both; he claimed descent as Mahmud b. Mamdud, nephew of Khwarazmshah's sister, and left no male heir {cite:shadharat-dhahab p. 301-302}."
  es: "El mameluco de Aybak y el atabeg de su hijo; cuando los tártaros estaban en Amid e Ibn al-Adim imploró ayuda, se apoderó del sultanato como al-Muzaffar —'el tiempo es difícil; un hombre valiente debe defender la yihad'— derrotó a los tártaros en Ayn Jalut, 15 Ramadan 658, y fue asesinado por el grupo de Baybars cerca de al-Manzila al-Salihiyya en Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 719-721}. Ibn al-Imad añade los famosos informes: el ilusionista al-Bardajani lo oyó prometer un emirato de cincuenta basándose en un sueño —'el Profeta me dijo: controlarás Egipto y derrotarás a los tártaros'— y el astrólogo predijo lo mismo a Qutuz y Baybars; afirmó descender como Mahmud b. Mamdud, sobrino de la hermana de Khwarazmshah, y no dejó heredero varón {citar: shadharat-dhahab p. 301-302}."
  fr: "Le mamelouk d'Aybak et son fils, l'atabeg, lorsque les Tatars se tenaient à Amid et qu'Ibn al-Adim implora de l'aide, il s'empara du sultanat sous le nom d'al-Muzaffar — « les temps sont durs; un homme courageux doit se lever pour le djihad » — brisa les Tatars à Ayn Jalut, le 15 Ramadan 658, et fut tué par le groupe de Baybars près d'al-Manzila al-Salihiyya en Dhu'l-Qa'da {cite:tarikh-khulafa-minhaj-1434 p. 719-721}. Ibn al-Imad ajoute les célèbres récits: le dépoussiéreur al-Bardajani l'entendit promettre un émirat de cinquante sur la base d'un rêve — « le Prophète m'a dit: tu tiendras l'Égypte et briseras les Tatars » — et l'astrologue prédit la même chose à Qutuz et à Baybars; il prétendait descendre de Mahmud b. Mamdud, neveu de la sœur de Khwarazmshah, et n'a laissé aucun héritier mâle {cite: shadharat-dhahab p. 301-302}."
  ur: "ایبک کا مملوک اور اس کے لڑکے کا عتاب؛ جب تاتاری امید پر کھڑے ہوئے اور ابن العدیم نے مدد کی درخواست کی تو اس نے سلطان کو المظفر کے طور پر پکڑ لیا - 'وقت مشکل ہے؛ ایک بہادر آدمی کو جہاد کے لیے کھڑا ہونا چاہیے'' - عین جالوت، 15 رمضان 658 میں تاتاریوں کو توڑا، اور ذوالقعدہ میں المنزل الصالحیہ کے قریب بیبرس کی جماعت کے ہاتھوں مارا گیا۔ 719-721}۔ ابن عماد مشہور روایتوں میں اضافہ کرتے ہیں: دلعزیز البردجانی نے اسے خواب کے زور پر پچاس امیری کا وعدہ کرتے ہوئے سنا - 'رسول اللہ نے مجھ سے فرمایا: تم مصر کو پکڑو گے اور تاتاریوں کو توڑ دو گے' - اور نجومی نے قطوز اور بیبرس دونوں کو بھی اسی کی پیشین گوئی کی تھی۔ اس نے محمود بن کے طور پر نزول کا دعویٰ کیا۔ خوارزم شاہ کی بہن کے بھتیجے ممدود نے کوئی مرد وارث نہیں چھوڑا۔ 301-302}۔"
  tr: "Memlük el-Muizz Aybak ve oğlu el-Mensur Ali, Tatarlar 57 yılının başında geldiğinde ve İbn al-Adim yardım istediğinde, prensleri ve ileri gelenleri topladılar. Şeyh İzzeddin bin Abdülselam, onlarla savaşmanın gerekli olduğunu ve emirlerin ekipmanlarını satmak ve kamu fonu almamak şartıyla ne gerekiyorsa aldığını hükmetti. Sonra öğretmeninin oğlunu tutukladı ve dedi ki, 'Bu bir çocuk ve zamanlar zordur, cesur bir adam ayağa kalkıp savaşmalı ve otoriteyi ele geçirmelidir.' Mısırlıları Levant'a götürdü ve 58 yılının on beşinci Ramazan günü Eyn Celut'ta Tatarları yendi, Baybars ve bir grup prensi Salihid mevzisi yakınlarında öldürdü {cite:Tarikh-Khulafa-minhaj-1434, s. 719-721}."
  id: "Mamluk al-Mu'izz Aybak dan putranya al-Mansur Ali, ketika Tatar tiba pada awal tahun 57 dan Ibn al-Adim datang untuk mencari bantuan, mengumpulkan para pangeran dan tokoh-tokoh. Sheikh Izz al-Din ibn Abd al-Salam memutuskan bahwa melawan mereka adalah perlu dan ia mengambil apa pun yang diperlukan dengan syarat menjual peralatan dan perlengkapan para emir tanpa mengambil dana publik. Kemudian ia menangkap putra gurunya dan berkata, 'Ini anak laki-laki dan masa sulit, dan seorang pria pemberani harus bangkit untuk berjuang dan mengambil kekuasaan.' Ia memimpin orang Mesir ke Levant dan mengalahkan Tatar di Ain Jalut pada hari Jumat, tanggal lima belas Ramadan tahun 58, dan membunuh Baybars serta sekelompok pangeran di dekat posisi Salihid di Dhu al-Qi'dah {cite:Tarikh-Khulafa-minhaj-1434, hlm. 719-721}."
died: { edtf: "1260-10-24~", hijri: "0658-11-16", calendar: julian, precision: day, status: tradition, derived: true, note: "قُتل يوم سادس عشر ذي القعدة بقرب قطية ولم يخلف ولداً ذكراً {cite:shadharat-dhahab p. 299, 301}." }
