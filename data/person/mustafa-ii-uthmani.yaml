summary:
  ar: "السلطان مصطفى الثاني ⁦(١١٠٦–١١١٥هـ/١٦٩٤–١٧٠٣م)⁩؛ ولد عام ١٠٧٤هـ وتولى الخلافة بعد عمه أحمد الثاني. في عهده بدأ تراجع المد الإسلامي عن ديار أوروبا الشرقية، ووقّعت معاهدة كارلوفتس عام ١١١٠هـ/١٦٩٩م التي انسحب بموجبها العثمانيون من بلاد المجر وإقليم ترانسلفانيا، وأصبحت كل الدول التي كانت تدفع الجزية ممتنعة من دفعها. وكان التنازل عن الأراضي بداية الانسحاب العثماني من أوروبا وانتقالاً إلى عصر التفكك. ويعزو الصلابي التراجع إلى ضعف الإيمان وضعف روح الجهاد، وهو تفسير المؤلف. وعلى أثر تدخل الإنكشارية ومطالبتهم بعزل الصدور ورفض السلطان ذلك قرروا عزله، فتوفي بعد أربعة أشهر وكان في التاسعة والثلاثين {cite:dawlat-uthmaniyya-salabi p. 310}."
  en: "Mustafa II (r. 1106–1115/1694–1703) — the sultan of Karlowitz: Hungary and Transylvania lost, the tributary powers stopped paying, and the Ottoman retreat from Europe began. Deposed by the Janissaries, dead within four months at 39 {cite:dawlat-uthmaniyya-salabi p. 310}."
  es: "Mustafa II (r. 1106–1115/1694–1703) — sultán de Karlowitz: Hungría y Transilvania se perdieron, las potencias tributarias dejaron de pagar y comenzó la retirada otomana de Europa. Fue depuesto por los jenízaros y murió a los cuatro meses a los 39 años {cite:dawlat-uthmaniyya-salabi p. 310}."
  fr: "Mustafa II (r. 1106–1115/1694–1703) — sultan de Karlowitz: la Hongrie et la Transylvanie sont perdues, les puissances tributaires cessent de payer leurs tributs et le retrait ottoman d’Europe commence. Déposé par les janissaires, il meurt quatre mois plus tard à l’âge de 39 ans."
  ur: "مصطفی دوم (r. 1106–1115/1694–1703) - کارلووٹز کا سلطان: ہنگری اور ٹرانسلوانیا ہار گئے، معاون طاقتوں نے ادائیگی کرنا بند کر دی، اور یورپ سے عثمانیوں کی پسپائی شروع ہو گئی۔ جنیسریز کے ذریعہ معزول، 39 میں چار ماہ کے اندر فوت ہو گیا {حوالہ:دولت عثمانیہ صلابی ص۔ 310}۔"
  tr: "Sultan II. Mustafa (1106–1115 Hicri / 1694–1703 M.S); 1074 Hicri doğumlu Amcası II. Ahmed'in ardından halifeliği üstlendi. Saltanatı sırasında İslam dalgası Doğu Avrupa'dan çekilmeye başladı ve 1110 Hicri / 1699 yılında Karlovitz Antlaşması imzalandı; bu antlaşmaya göre Osmanlılar Macaristan ve Transilvanya'dan çekildi ve haraç ödeyen tüm devletler haraç ödemeyi reddetti. Toprakların devri, Osmanlıların Avrupa'dan çekilmesinin başlangıcını ve parçalanma dönemine geçişi işaret etti. El-Sallabi, bu gerilemenin zayıf inanç ve zayıf cihat ruhuna bağlar; yazarın yorumu budur. Yeniçerilerin müdahalesi ve el-Sadr'ın görevden alınması talepleri üzerine Sultan bunu reddetti, onu görevden almaya karar verdiler. Dört ay sonra, otuz dokuz yaşında öldü {cite:dawlat-uthmaniyya-salabi, s. 310}."
  id: "Sultan Mustafa II (1106–1115 H / 1694–1703 M); lahir pada 1074 H, ia mengambil alih kekhalifahan setelah pamannya Ahmed II. Selama pemerintahannya, gelombang Islam mulai mereda dari Eropa Timur, dan Perjanjian Karlovitz ditandatangani pada 1110 H / 1699 M, di mana Ottoman menarik diri dari Hungaria dan Transylvania, dan semua negara yang dulu membayar upeti menolak membayarnya. Penyerahan wilayah menandai awal penarikan Ottoman dari Eropa dan transisi menuju era fragmentasi. Al-Sallabi mengaitkan kemunduran ini dengan lemahnya iman dan lemahnya semangat jihad, yang merupakan interpretasi penulis. Setelah intervensi para Janissari dan tuntutan mereka untuk menyingkirkan al-Sadr, yang ditolak oleh Sultan, mereka memutuskan untuk menyingkirkannya. Ia meninggal empat bulan kemudian pada usia tiga puluh sembilan {cite:dawlat-uthmaniyya-salabi, hlm. 310}."
