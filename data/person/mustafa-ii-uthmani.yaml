summary:
  ar: "السلطان مصطفى الثاني (١١٠٦–١١١٥هـ/١٦٩٤–١٧٠٣م)؛ ولد عام ١٠٧٤هـ وتولى الخلافة بعد عمه أحمد الثاني. في عهده بدأ تراجع المد الإسلامي عن ديار أوروبا الشرقية، ووقّعت معاهدة كارلوفتس عام ١١١٠هـ/١٦٩٩م التي انسحب بموجبها العثمانيون من بلاد المجر وإقليم ترانسلفانيا، وأصبحت كل الدول التي كانت تدفع الجزية ممتنعة من دفعها. وكان التنازل عن الأراضي بداية الانسحاب العثماني من أوروبا وانتقالاً إلى عصر التفكك. وعلى أثر تدخل الإنكشارية ومطالبتهم بعزل الصدور ورفض السلطان ذلك قرروا عزله، فتوفي بعد أربعة أشهر وكان في التاسعة والثلاثين {cite:dawlat-uthmaniyya-salabi p. 310}."
  en: "Mustafa II (r. 1106–1115/1694–1703) — the sultan of Karlowitz: Hungary and Transylvania lost, the tributary powers stopped paying, and the Ottoman retreat from Europe began. Deposed by the Janissaries, dead within four months at 39 {cite:dawlat-uthmaniyya-salabi p. 310}."
