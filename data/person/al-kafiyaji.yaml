names:
  - { value: "محيي الدين أبو عبد الله محمد بن سليمان بن سعد بن مسعود الرومي البرعمي الحنفي المعروف بالكافياجي", kind: full }
gender: male
summary:
  ar: "محيي الدين الكافياجي الحنفي؛ لقب بذلك لكثرة اشتغاله بكتاب الكافية في النحو، قال السيوطي في بغية الوعاة شيخنا العلامة أستاذ الأستاذين، ولد سنة ثمان وثمانين وسبعمائة واشتغل بالعلم أول ما بلغ ورحل إلى بلاد العجم والتتر ولقي العلماء الأجلاء فأخذ عن الشمس الفنري والبرهان حيدرة والشيخ واجد وابن فرشته شارح المجمع وغيرهم ورحل إلى القاهرة أيام الأشرف برسباي فظهرت فضائله وولي المشيخة بتربة الأشرف ثم ولى مشيخة الشيخونية لما رغب عنها ابن الهمام، وكان إماماً كبيراً في المعقولات كلها والكلام وأصول الفقه والنحو والتصريف والإعراب والمعاني والبيان والجدل والمنطق والفلسفة والهيئة بحيث لا يشق أحد غباره في شيء من هذه العلوم، وأما تصانيفه في العلوم العقلية فلا تحصى حتى أن السيوطي سأله أن يسميها له ليكتبها في ترجمته فقال لا أقدر على ذلك ولى مؤلفات كثيرة أنسيتها فلا أعرف الآن أسماءها، وأجلها وأنفعها شرح قواعد الإعراب وشرح كلتي الشهادة وله مختصر في علوم الحديث ومختصر في علوم التفسير يسمى التيسير قدر ثلاث كراريس وكان يقول إنه اخترع هذا العلم ولم يسبق إليه، وكان صحيح العقيدة في الديانات حسن الاعتقاد في الصوفية محباً لأهل الحديث كارهاً لأهل البدع كثير التعبد على غير سنة كثير الصدقة والبذل لا يبقي على شيء، ولازمه السيوطي أربع عشرة سنة فما جثاه من مرة إلا وسمع منه من التحقيقات والعجائب ما لم يسمعه قبل ذلك وقال ما كنت أعد الشيخ إلا والداً بعد والدي، توفي شهيد الإسهال ليلة الجمعة رابع جمادى الأولى سنة تسع وسبعين وثمانمائة {cite:shadharat-dhahab p. 326-328}."
  en: "Al-Kafiyaji (b. 788) — al-Suyuti's 'master of masters,' nicknamed for his lifelong work on the Kafiya; studied under al-Fanari, Haydar and Ibn Firishta in 'Ajam, held the Shaykhuniyya after Ibn al-Humam; so prolific he could not recall his own titles; 'in Zayd qā'im there are 113 discussions' — Suyuti companied him fourteen years 'and counted him a second father'; died Friday night 4 Jumada I 879 {cite:shadharat-dhahab p. 326-328}."
