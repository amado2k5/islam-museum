id: person/ali-ibn-rabah-al-lakhmi
class: person
label: { ar: "علي بن رباح اللخمي" }
gender: male
summary:
  ar: "تابعي بصري لخمي يكنى أبا عبد الله؛ ولد عام اليرموك سنة خمس عشرة وكانت له عند عبد العزيز بن مروان مكانة وهو الذي زف ابنته أم البنين لزوجها الوليد، ثم عتب عليه عبد العزيز فأغزاه إفريقية، وكان من التابعين الثلاثة الذين دخلوا الأندلس عند ابن حبيب {cite:nafh-tib-maqqari p. 314-315}."
  en: "The Basran Lakhmi tabi'i born in the year of Yarmuk who served Abd al-Aziz b. Marwan, gave away Umm al-Banin to al-Walid, was posted to Ifriqiya in disgrace, and entered al-Andalus {cite:nafh-tib-maqqari p. 314-315}."
  es: "El Basran Lakhmi probablemente nació en el año de Yarmuk, quien sirvió a Abd al-Aziz b. Marwan, tras entregar a Umm al-Banin a al-Walid, fue enviado a Ifriqiya en desgracia y entró en al-Andalus {cite:nafh-tib-maqqari p. 314-315}."
  fr: "Le Basran Lakhmi est probablement né l'année de Yarmouk, qui a servi Abd al-Aziz b. Marwan, après avoir donné Umm al-Banin à al-Walid, a été envoyé à Ifriqiya en disgrâce et est entré en al-Andalus {cite:nafh-tib-maqqari p. 314-315}."
  ur: "بصران لخمی تابعی یرموک کے سال میں پیدا ہوئے جنہوں نے عبد العزیز بن عبدالعزیز کی خدمت کی۔ مروان نے ام البنین کو الولید کے حوالے کر دیا، ذلت کے ساتھ افریقیہ میں تعینات کیا گیا، اور اندلس میں داخل ہو گیا۔ 314-315}۔"
  tr: "Basri Lakhmi Tabi'i, Abu Abdullah olarak bilinir, on beşinci yılın Yarmuk yılında doğdu ve Abdul Aziz ibn Marwan ile bir statüye sahipti. Kızı um al-Banin'i onun kocası al-Walid ile evlendiren kişiydi. Bunun üzerine Abdul Aziz onu azarladı ve İfrikiye'yi işgal etti. O, İbn Habib'in yönetiminde Endülüs'e giren üç Tabi'un arasındaydı {cite:nafh-tib-maqqari, s. 314-315}."
  id: "Basri Lakhmi Tabi'i, yang dikenal sebagai Abu Abdullah, lahir pada tahun Yarmouk tahun lima belas dan memiliki status bersama Abdul Aziz ibn Marwan. Dia adalah orang yang menikahkan putrinya um al-Banin dengan suaminya al-Walid. Kemudian Abdul Aziz menegurnya dan menyerbu Ifriqiya. Dia termasuk di antara tiga Tabi'un yang masuk ke al-Andalus di bawah Ibn Habib {cite:nafh-tib-maqqari, hlm. 314-315}."
