id: person/hulagu
class: person
label: { ar: "هولاكو خان" }
summary:
  ar: "مقدم التتار، وصل إلى بغداد سنة ست وخمسين في مئتي ألف فهزم عسكر الخليفة ودخلها يوم عاشوراء وقتل الخليفة المستعصم رفساً ولم يتم للوزير العلقمي ما أراد من إقامة خليفة علوي فاطرحه وصار في صورة بعض الغلمان ومات كمداً، وأرسل إلى الناصر صاحب دمشق كتباً مهددة فيها أجب ملك البسيطة ونحن جيوش الهلكة لا جيوش الملكة {cite:tarikh-khulafa-minhaj-1434 p. 715-719}. وعند ابن خلدون وزحف إلى العراق سنة 652هـ وقد فتح الري وأصبهان وهمدان وتتبع قلاع الإسماعيلية ثم قصد قلعة الموت سنة 655هـ فبلغه كتاب ابن العلقمي فسار إلى بغداد واستدعى أمراء التتر ونزل بغداد فأمن المستعصم فخرج إليه فقتله وسار بعد الفتح إلى الشام سنة 658هـ {cite:tarikh-ibn-khaldun-ibar p. 900-901}"
  en: "The Tatar commander who took Baghdad in 656, had al-Musta'sim trampled to death, threw off al-Alqami's Alid scheme to a groom's rank — he died of grief — and wrote Damascus's lord the 'answer the king of the earth' letters {cite:tarikh-khulafa-minhaj-1434 p. 715-719}."
  es: "El comandante tártaro que tomó Bagdad en 656, hizo que al-Musta'sim fuera pisoteado hasta la muerte, relegó el plan de al-Alqami a un rango de esposo —murió de pena— y escribió al señor de Damasco las cartas de \"responde al rey de la tierra\" {cite:tarikh-khulafa-minhaj-1434 p. 715-719}."
  fr: "Le commandant tatar qui prit Bagdad en 656, fit piétiner à mort al-Musta'sim, rejeta le plan alide d'al-Alqami au rang de palefrenier — il mourut de chagrin — et écrivit au seigneur de Damas les lettres « répondez au roi de la terre » {cite:tarikh-khulafa-minhaj-1434 p. 715-719}."
  ur: "تاتاری کمانڈر جس نے 656 میں بغداد پر قبضہ کیا، المستسم کو روند کر موت کے گھاٹ اتار دیا، علقمی کی الد سکیم کو دولہا کے درجے پر پھینک دیا - وہ غم سے مر گیا - اور دمشق کے آقا کو 'زمین کے بادشاہ کو جواب دیں' کے خطوط لکھے۔ 715-719}۔"
  tr: "Tatar lider, 56 Hile yılında, 2000 yılında Bağdat'a geldi, halifenin ordusunu yendi, Aşura'ya girdi ve Halife el-Musta'sim'i tekmeleyerek öldürdü. Vezir el-Alqami istediği şeyi başaramadı, bu yüzden onu terk etti, bazı gençler gibi kederden öldü. Şam hükümdarı el-Nasir'e tehditkar mektuplar gönderdi: 'Biz yıkım ordularıyız, kraliçenin orduları değil.' {atıf:Tarikh-khulafa-minhaj-1434, s. 715-719}. İbn Haldun ile birlikte 652 Hicri'de Irak'a yürüdü, Rayy, İsfahan ve Hamadan'ı fethetti, İsmaili kalelerini takip etti ve ardından 655 H yılında Ölüm Kalesi'ne yöneldi. İbn el-Alqami'nin mektubunu aldı, bu yüzden Bağdat'a gitti, Tatar prenslerini çağırdı ve Bağdat'ta kaldı. El-Mustasim güvendeydi, ona gitti, onu öldürdü ve fetihten sonra 658 Hicri'de Levant'a yürüdü {atıf:Tarikh-ibn-khaldun-ibar s. 900-901}"
  id: "Pemimpin Tatar tiba di Baghdad pada tahun 56 H, pada tahun 2000, mengalahkan pasukan khalifah, memasuki wilayah itu di Ashura, dan membunuh Khalifah al-Musta'sim dengan tendangan. Wazir al-Alqami tidak mencapai apa yang diinginkannya untuk mendirikan khalifah Alawi, sehingga ia meninggalkannya, menjadi seperti beberapa pemuda, meninggal karena kesedihan. Ia mengirim surat ancaman kepada al-Nasir, penguasa Damaskus, mengatakan: 'Kami adalah pasukan kehancuran, bukan pasukan ratu.' {kutip: Tarikh-khulafa-minhaj-1434, hlm. 715-719}. Bersama Ibn Khaldun, ia berbaris ke Irak pada tahun 652 H, menaklukkan Rayy, Isfahan, dan Hamadan, mengejar benteng-benteng Ismaili, lalu menuju Benteng Kematian pada tahun 655 H. Ia menerima surat dari Ibn al-Alqami, sehingga ia pergi ke Baghdad, memanggil para pangeran Tatar, dan tinggal di Baghdad. Al-Musta'sim aman, pergi kepadanya, membunuhnya, dan setelah penaklukan, ia berbaris ke Levant pada tahun 658 H {cite:Tarikh-ibn-khaldun-ibar hlm. 900-901}"
