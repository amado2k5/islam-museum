label: { ar: "هولاكو خان" }
summary:
  ar: "مقدم التتار، وصل إلى بغداد سنة ست وخمسين في مئتي ألف فهزم عسكر الخليفة ودخلها يوم عاشوراء وقتل الخليفة المستعصم رفساً ولم يتم للوزير العلقمي ما أراد من إقامة خليفة علوي فاطرحه وصار في صورة بعض الغلمان ومات كمداً، وأرسل إلى الناصر صاحب دمشق كتباً مهددة فيها أجب ملك البسيطة ونحن جيوش الهلكة لا جيوش الملكة {cite:tarikh-khulafa-minhaj-1434 p. 715-719}. وعند ابن خلدون وزحف إلى العراق سنة 652هـ وقد فتح الري وأصبهان وهمدان وتتبع قلاع الإسماعيلية ثم قصد قلعة الموت سنة 655هـ فبلغه كتاب ابن العلقمي فسار إلى بغداد واستدعى أمراء التتر ونزل بغداد فأمن المستعصم فخرج إليه فقتله وسار بعد الفتح إلى الشام سنة 658هـ {cite:tarikh-ibn-khaldun-ibar p. 900-901}"
  en: "The Tatar commander who took Baghdad in 656, had al-Musta'sim trampled to death, threw off al-Alqami's Alid scheme to a groom's rank — he died of grief — and wrote Damascus's lord the 'answer the king of the earth' letters {cite:tarikh-khulafa-minhaj-1434 p. 715-719}."
