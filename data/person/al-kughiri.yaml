summary:
  ar: "شمس الدين الكغيري المجلوني الأصل ثم الدمشقي؛ ولد في العشر الأول من شوال سنة سبع وخمسين وسبعمائة وحفظ التنبيه وأخذ عن ابن قاضي شهبة ولازم الشيخ شمس الدين الغزي مدة طويلة واشتهر بحفظ الفروع وناب في الحكم وولي قضاء الركب وجمع شرحاً على البخاري في ست مجلدات وصنف عين البهية في شرح التنبيه واختصر الروض الأنف للسهيلي وسماها زهر الروض، توفي في ثالث عشر المحرم سنة إحدى وثلاثين وثمانمائة {cite:shadharat-dhahab p. 196}."
  en: "Shams al-Din al-Kughiri (b. 757) — famed for memorized furu', qadi al-rakb, compiler of a six-volume commentary on al-Bukhari plus 'Ayn al-Bahiyya and Zahr al-Rawd; died 13 Muharram 831 {cite:shadharat-dhahab p. 196}."
  es: "Shams al-Din al-Kughiri (n. 757), famoso por memorizar 'furry', qadi al-rakb, compilador de un comentario en seis volúmenes sobre al-Bukhari más 'Ayn al-Bahiyya y Zahr al-Rawd; murió el 13 de Muharram 831 {cita: shadharat-dhahab p. 196}."
  fr: "Shams al-Din al-Kughiri (né en 757) — célèbre pour ses poils mémorisés », qadi al-rakb, compilateur d'un commentaire en six volumes sur al-Bukhari plus « Ayn al-Bahiyya et Zahr al-Rawd »; décédé le 13 Muharram 831 {cite: shadharat-dhahab p. 196}."
  ur: "شمس الدین الکغیری ⁦(پیدائش 757)⁩ - حافظے کے لیے مشہور، قضا الرقب، البخاری کے علاوہ 'عین البحیہ اور زہر الرود پر چھ جلدوں پر مشتمل تفسیر کا مرتب؛ وفات 13 محرم 831۔ 196}۔"
  tr: "Şemseddin el-Kaghiri, aslen Majluni'den, sonra Şam'dan; Yedi yüz elli yedi yılın ilk on gününde doğdu, Tanbih'i ezberledi ve İbn Kaddi Şahbah'ın yanında eğitim aldı, uzun süre Şeyh Şemseddin el-Gazi ile yakından ilişkili oldu, şubeleri ezberlemesiyle ünlendi, yönetimde vekil olarak atandı, kervanların hakimi olarak atandı, al-Buhari üzerine altı ciltlik tefsir derledi, 'Ayn al-Bahiyyah' yazdı, Tanbih'i açıkladı, al-Rawd al-Anf'ı al-Suhayli tarafından kısalttı ve Zahr al-Rawd adını verdi. Muharrem ayının on üçüncüsünde, sekiz yüz otuz bir yılda vefat etti {cite:shadharat-dhahab, s. 196}."
  id: "Shams al-Din al-Kaghiri, berasal dari Majluni dan kemudian dari Damaskus; lahir pada sepuluh hari pertama Shawwal tahun tujuh ratus lima puluh tujuh, ia menghafal Tanbih dan belajar di bawah bimbingan Ibn Qadi Shahbah, yang lama terkait dengan Sheikh Shams al-Din al-Ghazi, terkenal karena menghafal cabang-cabang, diangkat sebagai wakil pemerintahan, diangkat sebagai hakim karavan, menyusun komentar tentang al-Bukhari dalam enam jilid, menulis 'Ayn al-Bahiyyah, menjelaskan Tanbih, al-Rawd al-Anf yang diringkas oleh al-Suhayli, dan menamainya Zahr al-Rawd. Ia meninggal pada tanggal tiga belas Muharram tahun delapan ratus tiga puluh satu {cite:shadharat-dhahab, hlm. 196}."
