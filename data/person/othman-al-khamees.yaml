summary:
  ar: "عالم ومحدّث كويتي، وُلد في الكويت سنة 1962، اشتهر منذ أواخر التسعينات بمناظراته التلفزيونية مع علماء الشيعة الإثني عشرية ممثلا للجانب السني، ولا سيما عبر قناة المستقلة، ثم عبر قناة صفا التي شارك في تأسيسها، وله برامج سؤال وجواب تلفزيونية وعبر مواقع التواصل."
  en: "Kuwaiti scholar and hadith specialist, born in Kuwait in 1962. He became known from the late 1990s for televised debates with Twelver Shia scholars in which he represented the Sunni side, above all on the al-Mustakilla channel and later on the Safa channel, which he co-founded, and he hosts question-and-answer programmes on television and social media."
  ur: "کویتی عالم اور محدث، جو 1962 میں کویت میں پیدا ہوئے۔ وہ نوے کی دہائی کے اواخر سے شیعہ اثنا عشری علماء کے ساتھ ٹیلی ویژن مناظروں میں سنی جانب کی نمائندگی کی وجہ سے معروف ہوئے، خصوصاً المستقلہ چینل اور بعد میں صفا چینل پر جس کی تاسیس میں انہوں نے حصہ لیا، اور وہ ٹیلی ویژن و سوشل میڈیا پر سوال و جواب کے پروگرام کرتے ہیں۔"
