summary:
  ar: "سلطان گولكنده ⁦(1626–1672م)⁩، قبل سنة 1636م «انقياد نامه» التي جعلت مملكته محمية مغولية، وفي عهده دخل الأثر المغولي تصوير گولكنده، ومن أبرز صوره «موكبه على فيل» في لينينغراد {cite:zebrowski-deccani-painting-1983 p. 175} {cite:zebrowski-deccani-painting-1983 p. 182}."
  en: "Sultan of Golconda (1626–72), who accepted the Inqiyad-nama (Deed of Submission) of 1636 making his kingdom a Mughal protectorate; Mughal influence entered Golconda painting in his reign, whose masterpiece is his Procession on an elephant in Leningrad {cite:zebrowski-deccani-painting-1983 p. 175} {cite:zebrowski-deccani-painting-1983 p. 182}."
  ur: "گولکنڈہ کے سلطان ⁦(1626–72ء)⁩، جنہوں نے 1636ء کا «انقیاد نامہ» قبول کیا جس سے ان کی سلطنت مغل زیرِ حمایت بن گئی؛ ان کے دور میں گولکنڈہ کی مصوری میں مغل اثر آیا، اور شاہکار لینن گراڈ میں «ہاتھی پر ان کا جلوس» ہے {cite:zebrowski-deccani-painting-1983 p. 175} {cite:zebrowski-deccani-painting-1983 p. 182}۔"
