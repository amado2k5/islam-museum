summary:
  ar: "عالمة ومربية أمريكية، مؤسسة منظمة رابطة التعليمية النسائية في مينيسوتا ورئيستها التنفيذية ورئيسة جامعة رباط التابعة لها؛ قضت عشرين سنة في دمشق تدرس العلوم الإسلامية والقرآن والعربية، وتحمل دكتوراه في القيادة وماجستيرا في نظريات المناهج والتعليم، ولها كتابا «قطرات الفرح» و«مشروع لينا» وترجمات مشتركة لنصوص تراثية."
  en: "American Islamic scholar and educator, founder and CEO of Rabata, the women's educational nonprofit in Minnesota, and President of its Ribat University. She spent twenty years in Damascus studying Islamic sciences, Quran and Arabic, holds a doctorate in leadership and a master's in Curriculum Theory and Instruction, and is the author of Joy Jots and Project Lina and a co-translator of classical texts."
  ur: "امریکی مسلمان عالمہ اور معلمہ، مینیسوٹا میں خواتین کی تعلیمی غیر منفعتی تنظیم رابطہ کی بانی و سربراہ اور اس کی رباط یونیورسٹی کی صدر؛ انہوں نے دمشق میں بیس سال اسلامی علوم، قرآن اور عربی کی تعلیم حاصل کی، قیادت میں ڈاکٹریٹ اور نصاب و تعلیم میں ماسٹرز کیا، اور وہ «جوائے جاٹس» اور «پروجیکٹ لینا» کی مصنفہ اور کلاسیکی متون کی شریک مترجم ہیں۔"
  es: "Académica y educadora islámica estadounidense, fundadora y directora ejecutiva de Rabata, la organización educativa sin fines de lucro para mujeres en Minnesota, y presidenta de su Universidad Ribat. Pasó veinte años en Damasco estudiando ciencias islámicas, el Corán y el árabe. Posee un doctorado en liderazgo y una maestría en teoría e instrucción curricular, y es autora de Joy Jots y Project Lina, además de co-traductora de textos clásicos."
  fr: "Spécialiste américaine des sciences islamiques et pédagogue, elle est la fondatrice et directrice générale de Rabata, une organisation éducative à but non lucratif du Minnesota dédiée aux femmes, et la présidente de son université, Ribat. Elle a passé vingt ans à Damas à étudier les sciences islamiques, le Coran et l'arabe. Titulaire d'un doctorat en leadership et d'une maîtrise en théorie et enseignement des programmes d'études, elle est l'auteure de « Joy Jots » et de « Project Lina », et co-traductrice de textes classiques."
  tr: "Amerikalı bir akademisyen ve eğitimci, Minnesota Kadın Eğitim Derneği'nin kurucusu, CEO'su ve bağlı Rabat Üniversitesi'nin başkanı; yirmi yıl boyunca Şam'da İslam bilimleri, Kur'an ve Arapça eğitimi aldı. Liderlik alanında doktora ve müfredat ile eğitim teorileri alanında yüksek lisans derecesine sahiptir. \"Drops of Joy\" ve \"Lina Project\" adlı iki kitabı ile miras metinlerinin ortak çevirileri bulunmaktadır."
  id: "Seorang cendekiawan dan pendidik Amerika, pendiri Women's Educational Association di Minnesota, CEO-nya, dan presiden Universitas Rabat yang berafiliasi; ia menghabiskan dua puluh tahun di Damaskus mempelajari ilmu Islam, Al-Qur'an, dan Arab. Ia meraih gelar PhD dalam kepemimpinan dan gelar magister dalam kurikulum serta teori pendidikan. Ia memiliki dua buku berjudul \"Drops of Joy\" dan \"Lina Project,\" serta terjemahan bersama dari teks warisan."
