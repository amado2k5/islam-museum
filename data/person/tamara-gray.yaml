summary:
  ar: "عالمة ومربية أمريكية، مؤسسة منظمة رابطة التعليمية النسائية في مينيسوتا ورئيستها التنفيذية ورئيسة جامعة رباط التابعة لها؛ قضت عشرين سنة في دمشق تدرس العلوم الإسلامية والقرآن والعربية، وتحمل دكتوراه في القيادة وماجستيرا في نظريات المناهج والتعليم، ولها كتابا «قطرات الفرح» و«مشروع لينا» وترجمات مشتركة لنصوص تراثية."
  en: "American Islamic scholar and educator, founder and CEO of Rabata, the women's educational nonprofit in Minnesota, and President of its Ribat University. She spent twenty years in Damascus studying Islamic sciences, Quran and Arabic, holds a doctorate in leadership and a master's in Curriculum Theory and Instruction, and is the author of Joy Jots and Project Lina and a co-translator of classical texts."
  ur: "امریکی مسلمان عالمہ اور معلمہ، مینیسوٹا میں خواتین کی تعلیمی غیر منفعتی تنظیم رابطہ کی بانی و سربراہ اور اس کی رباط یونیورسٹی کی صدر؛ انہوں نے دمشق میں بیس سال اسلامی علوم، قرآن اور عربی کی تعلیم حاصل کی، قیادت میں ڈاکٹریٹ اور نصاب و تعلیم میں ماسٹرز کیا، اور وہ «جوائے جاٹس» اور «پروجیکٹ لینا» کی مصنفہ اور کلاسیکی متون کی شریک مترجم ہیں۔"
