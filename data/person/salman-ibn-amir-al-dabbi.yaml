summary:
  ar: "سلمان بن عامر الضبي، صحابي من بني ضبة نزل البصرة وله دار بحضرة المسجد الجامع وتوفي بها في خلافة عثمان، بحسب خليفة بن خياط؛ ويروي الحاكم عنه أنه سأل النبي عن أبيه الذي كان يصل الرحم ويقري الضيف ومات قبل الإسلام {cite:mustadrak-ilmiyya-ata-v3 p. 706}."
  en: "Salman ibn 'Amir al-Dabbi, a Companion of Banu Dabba who settled in Basra, where he had a house by the congregational mosque and died in the caliphate of 'Uthman, according to Khalifa ibn Khayyat; al-Hakim reports that he asked the Prophet about his father, who had kept family ties and fed guests but died before Islam {cite:mustadrak-ilmiyya-ata-v3 p. 706}."
  ur: "سلمان بن عامر ضبی، بنو ضبہ کے صحابی جو بصرہ میں آباد ہوئے، جامع مسجد کے پاس ان کا گھر تھا اور خلیفہ بن خیاط کے مطابق عثمان کی خلافت میں وہیں وفات پائی؛ حاکم روایت کرتے ہیں کہ انہوں نے نبی سے اپنے والد کے بارے میں پوچھا جو صلہ رحمی کرتے اور مہمان نوازی کرتے تھے مگر اسلام سے پہلے فوت ہو گئے {cite:mustadrak-ilmiyya-ata-v3 p. 706}۔"
