summary:
  ar: "شاعر، بدأ الشعراء في وصف سيف الصمصامة يوم وضعه الهادي بين يديه بأبيات أولها حاز صمصامة الزبيدي عمرو من جميع الأنام موسى الأمين، فوهب له السيف والمكتل ففرق المكتل على الشعراء ثم اشترى منه السيف بخمسين ألفاً {cite:muruj-al-dhahab p. 323-324}."
  en: "The poet whose Samsama ode won the sword itself plus a basket of dinars from al-Hadi {cite:muruj-al-dhahab p. 323-324}."
  es: "El poeta cuya oda Samsama ganó la espada y una canasta de dinares de al-Hadi {cita:muruj-al-dhahab p. 323-324}."
  fr: "Le poète dont l'ode Samsama a remporté l'épée elle-même ainsi qu'un panier de dinars d'al-Hadi {cite:muruj-al-dhahab p. 323-324}."
  ur: "وہ شاعر جس کے صمصام نے خود تلوار جیتی تھی اور الہادی سے دینار کی ٹوکری بھی۔ 323-324}۔"
  tr: "Şairler, şairler Al-Samsamah kılıcını Al-Hadi'nin önüne koyduğu gün şiirlerle anlatmaya başladılar; bunlardan ilki, Samsama Al-Zubaidi'nin tüm halk tarafından Amr'a verildiği, güvenilir Musa idi. Ona kılıcı ve kılıcı hediye etti, böylece Al-Muktal şairler arasında dağıtıldı, ardından kılıç elli bin dolara satın alındı {atıf:Muruj-al-Dhahab, s. 323-324}."
  id: "Para penyair, para penyair mulai menggambarkan pedang Al-Samsamah pada hari Al-Hadi meletakkannya di hadapannya beserta ayat-ayat, yang pertama adalah bahwa Samsama Al-Zubaidi diberikan kepada Amr oleh semua orang, Musa yang dapat dipercaya. Ia memberinya pedang dan pedang, sehingga Al-Muktal dibagikan kepada para penyair, lalu pedang itu dibeli darinya seharga lima puluh ribu {cite:muruj-al-dhahab, hlm. 323-324}."
