summary:
  ar: "محب الله بن عبد الشكور، من أهل «بهار» بالهند، فقيه وأصولي حنفي محقق. ولاه السلطان عالمكير قضاء لكهنو ثم قضاء حيدر آباد، ثم ولاه الصدارة في ممالك الهند. من تصانيفه «مسلّم الثبوت» في أصول الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1642}"
  en: "Muhibb Allah ibn Abd al-Shakur, of Bihar in India, a Hanafi jurist and usuli who was a verifier. The emperor Aurangzeb appointed him judge of Lucknow and then of Hyderabad, and later chief of the Indian realms. His work Musallam al-thubut is on usul al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1642}"
