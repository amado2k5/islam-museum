summary:
  ar: "محب الله بن عبد الشكور، من أهل «بهار» بالهند، فقيه وأصولي حنفي محقق. ولاه السلطان عالمكير قضاء لكهنو ثم قضاء حيدر آباد، ثم ولاه الصدارة في ممالك الهند. من تصانيفه «مسلّم الثبوت» في أصول الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1642}"
  en: "Muhibb Allah ibn Abd al-Shakur, of Bihar in India, a Hanafi jurist and usuli who was a verifier. The emperor Aurangzeb appointed him judge of Lucknow and then of Hyderabad, and later chief of the Indian realms. His work Musallam al-thubut is on usul al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1642}"
  es: "Muhibb Allah ibn Abd al-Shakur, de Bihar, India, fue un jurista y usuli hanafí, además de verificador. El emperador Aurangzeb lo nombró juez de Lucknow y luego de Hyderabad, y posteriormente jefe de los reinos indios. Su obra Musallam al-thubut trata sobre usul al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1642}"
  fr: "Muhibb Allah ibn Abd al-Shakur, originaire du Bihar en Inde, était un juriste hanafite et usuli, également vérificateur. L'empereur Aurangzeb le nomma juge de Lucknow, puis d'Hyderabad, et plus tard chef des royaumes indiens. Son ouvrage Musallam al-thubut traite de l'usul al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1642}"
  ur: "محب اللہ ابن عبد الشکور، ہندوستان میں بہار کا، ایک حنفی فقیہ اور اصولی جو تصدیق کرنے والا تھا۔ شہنشاہ اورنگزیب نے انہیں لکھنؤ اور پھر حیدرآباد کا جج اور بعد میں ہندوستانی ریاستوں کا سربراہ مقرر کیا۔ ان کی تصنیف مسلم الثبوت اصول الفقہ پر ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1642}"
  tr: "Hindistan'ın Bihar eyaletinden Muhibullah ibn Abd al-Shakur, Hanefi hukukçu ve fıkıh alimi. Sultan Alamkair onu önce Lahor yargıcı, ardından Haydarabad yargıcı ve daha sonra Hindistan krallıklarının başı olarak atadı. Eserleri arasında hukuk prensiplerinde 'Muslim al-Thubut' yer alır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1642}"
  id: "Muhibullah ibn Abd al-Shakur, dari Bihar di India, seorang ahli hukum Hanafi dan sarjana hukum. Sultan Alamkair mengangkatnya sebagai hakim Lahore, kemudian sebagai hakim Hyderabad, dan kemudian sebagai kepala di kerajaan-kerajaan India. Di antara karyanya adalah 'Muslim al-Thubut' dalam prinsip-prinsip fiq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1642}"
