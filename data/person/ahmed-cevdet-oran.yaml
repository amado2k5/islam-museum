summary:
  ar: "صحفي وناشر عثماني تركي (1862–1935) أسس صحيفة «إقدام» وحرّرها من 1894 إلى 1928، وكان من أوائل الصحفيين الأتراك الذين كتبوا بتركية مبسطة، وعارض جمعية الاتحاد والترقي فنُفي إلى سويسرا وفرنسا، ثم دعم حرب الاستقلال التركية."
  en: "Ottoman-Turkish journalist and publisher (1862-1935) who founded and edited the newspaper Ikdam from 1894 to 1928, was among the first Turkish journalists to write in a purified Turkish, opposed the Committee of Union and Progress and was exiled to Switzerland and France, and then supported the Turkish War of Independence."
