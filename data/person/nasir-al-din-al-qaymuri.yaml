summary:
  ar: "الأمير مقدم الجيوش؛ أنشأ المدرسة بدمشق شرقي جامع بني أمية وما تزال تلك المحلة تعرف بالقيميرية تسمية لها باسم المدرسة؛ كان بطلاً شجاعاً رئيساً عادلاً جواداً وهو الذي ملك دمشق للناصر؛ توفي مرابطاً بالساحل في ربيع الأول {cite:shadharat-dhahab p. 552}."
  en: "Commander of the armies — founder of the madrasa east of the Umayyad Mosque whose quarter is still called al-Qaymiriyya; 'a brave champion, a chief, just and generous', and the man who delivered Damascus to al-Nasir; he died on coastal ribat duty, Rabi' I 665 {cite:shadharat-dhahab p. 552}."
  es: "Comandante de los ejércitos, fundador de la madrasa al este de la Mezquita Omeya, cuyo barrio aún se llama al-Qaymiriyya; \"un valiente campeón, un jefe, justo y generoso\", y el hombre que entregó Damasco a al-Nasir; murió en servicio de ribat costero, Rabi' I 665 {cita: shadharat-dhahab p. 552}."
  fr: "Commandant des armées — fondateur de la madrasa à l'est de la mosquée des Omeyyades dont le quartier est encore appelé al-Qaymiriyya; « un champion courageux, un chef, juste et généreux », et l'homme qui a livré Damas à al-Nasir; il est mort en service de ribat côtier, Rabi' I 665 {cite:shadharat-dhahab p. 552}."
