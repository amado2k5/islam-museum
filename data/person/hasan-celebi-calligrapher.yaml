summary:
  ar: "حطّاط تركي كبير ملقّب بـ«رئيس الحطاطين» ⁦(1937 – 24 فبراير 2025)⁩؛ وُلد في قرية إنجيكوي بقضاء أولطو في أرضروم وحفظ القرآن صغيرًا، وخدم مؤذنًا وإمامًا في مساجد إسطنبول ثم تفرّغ للخط منذ 1961 على يد حامد الآمدي وكمال بطاناي في الثلث والنسخ والتعليق والرقعة؛ زيّن بخطه مساجد منها الجامع الأزرق وجامع تشامليجا الكبير ومسجد سري سندايان بماليزيا، وأشرف على تجديد لوحات المسجد النبوي، ودُرّج سنة 2010 «كنزًا بشريًا حيًا»، وربّى أكثر من خمسين خطاطًا."
  en: "Renowned Turkish master calligrapher hailed as 'Master of Calligraphers' ⁦(1937 – 24 February 2025)⁩. Born in the village of İnciköy in Oltu, Erzurum, he memorised the Qur'an as a boy, served as muezzin and imam in Istanbul mosques, then devoted himself to calligraphy from 1961 under Hamid Aytaç and Kemal Batanay in the thuluth, naskh, ta'liq and riq'a scripts. His inscription adorns the Blue Mosque, the Grand Çamlıca Mosque and Malaysia's Sri Sendayan Mosque, and he oversaw the renewal of calligraphic panels at Al-Masjid al-Nabawi; named a 'Living Human Treasure' in 2010, he trained over fifty calligraphers."
  ur: "نامور ترک خطاط، «استادِ خطاطین» کے لقب سے معروف ⁦(1937 – 24 فروری 2025)⁩۔ ارضروم کے ضلع اولطو کے گاؤں انجی کوئے میں پیدا ہوئے، بچپن میں حافظِ قرآن ہوئے، استنبول کی مسجدوں میں مؤذن و امام رہے، پھر 1961 سے حامد آیتاج اور کمال باتانے سے ثلث، نسخ، تعلیق اور رقعہ رسم الخط سیکھ کر خطاطی کو اپنایا۔ ان کی تحریریں بلیو مسجد، جامع چاملیجا اور ملائیشیا کی سری سندایان مسجد کو مزین ہیں اور انہوں نے مسجدِ نبوی کے کتیبات کی تجديد کی نگرانی کی؛ 2010 میں «زندہ انسانی خزانہ» قرار پائے اور پچاس سے زائد خطاط تیار کیے۔"
  es: "Reconocido maestro calígrafo turco, aclamado como el \"Maestro de los Calígrafos\" (1937-24 de febrero de 2025). Nacido en la aldea de İnciköy, en Oltu, Erzurum, memorizó el Corán de niño, sirvió como muecín e imán en mezquitas de Estambul y, a partir de 1961, se dedicó a la caligrafía bajo la tutela de Hamid Aytaç y Kemal Batanay en los estilos thuluth, naskh, ta'liq y riq'a. Su inscripción adorna la Mezquita Azul, la Gran Mezquita Çamlıca y la Mezquita Sri Sendayan de Malasia, y supervisó la renovación de los paneles caligráficos de Al-Masjid al-Nabawi. Nombrado \"Tesoro Humano Viviente\" en 2010, formó a más de cincuenta calígrafos."
