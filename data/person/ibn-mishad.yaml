summary:
  ar: "شيخ من مستوري أهل الدينور وصوفيتها وزهادها، خرج إلى ابن علان القزويني وبيده مصحف منشور فقال أيها الشيخ اتق الله وارفع السيف عن هؤلاء المسلمين فلا ذنب لهم، فأمر ابن علان بأخذ المصحف من يده فضرب به وجهه ثم أمر به فذبح {cite:muruj-al-dhahab p. 726}."
  en: "Dinawar's ascetic elder, slaughtered after being struck with his own mushaf {cite:muruj-al-dhahab p. 726}."
  es: "El anciano asceta de Dinawar, asesinado tras ser golpeado con su propio mushaf {cite:muruj-al-dhahab p. 726}."
  fr: "L'aîné ascétique de Dinawar, abattu après avoir été frappé avec son propre mushaf {cite:muruj-al-dhahab p. 726}."
  ur: "دیناور کا بزرگ، اپنے ہی مصحف سے ٹکرانے کے بعد ذبح ہو گیا۔ 726}۔"
  tr: "Dinawar'ın gizli kami, sufiler ve münzehilerden bir şeyh, elinde basılı bir Kur'an'la İbn Allan al-Qazwini yanına gitti. O dedi ki, 'Ey Şeyh, Allah'tan kork ve bu Müslümanlardan kılıcı kaldır, çünkü onlar günah taşımaz.' İbn Allan Kur'an'ı elinden almasını emretti, yüzüne vurdu ve ardından katledilmesini emretti {cite:Muruj-al-Dhahab, s. 726}."
  id: "Seorang sheikh dari kaum tersembunyi Dinawar, para sufi, dan pertapa pergi kepada Ibn Allan al-Qazwini sambil memegang Al-Qur'an yang dicetak. Ia berkata, 'Wahai Sheikh, takutlah Allah dan angkat pedang dari umat Muslim ini, karena mereka tidak membawa dosa.' Ibn Allan memerintahkan agar Al-Qur'an diambil dari tangannya, memukul wajahnya dengan Al-Qur'an, lalu memerintahkan agar Al-Qur'an disembelih {cite:muruj-al-dhahab, hlm. 726}."
