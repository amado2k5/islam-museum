summary:
  ar: المحسن بن محمد بن كرامة الجشمي البيهقي، مفسر عالم بالأصول والكلام، حنفي ثم معتزلي فزيدي، شيخ الزمخشري، اشتهر بصنعاء وقتل بمكة سنة 494 هـ، صاحب «التهذيب» في التفسير.
  en: al-Muhsin ibn Muhammad ibn Karama al-Jushami al-Bayhaqi, an exegete and scholar of principles and theology, Hanafi, then Mu'tazili, then Zaydi, teacher of al-Zamakhshari; he became known in Sanaa and was killed in Mecca in 494 AH. Author of 'al-Tahdhib' on exegesis.
