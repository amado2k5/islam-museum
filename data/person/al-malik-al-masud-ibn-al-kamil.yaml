died: { edtf: "1229~", hijri: "0626~", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي ليلة الاثنين نصف شعبان وحمل إلى القلعة الجديدة التي في الجزيرة وأُخفي موته ثلاثة أيام؛ سنة وفاته متعذرة التعيين من المقروء {cite:wafayat-ayan}. وفي الشذرات أنه سار إلى مكة فمرض مرضاً مزمناً فوصل إليها وقد أفلج ويبست يداه ورجلاه ورأى في نفسه العبر ثم مات فدفنوه في المعلى {cite:shadharat-dhahab p. 120}." }
summary:
  ar: "الملك المسعود أفسيس — وأفسيس بلغة اليمن موت — بن الملك الكامل ناصر الدين محمد؛ كان أكبر أولاد الملك الكامل وولاه على اليمن؛ رحل عن الديار المصرية متوجهاً إلى اليمن يوم الاثنين سابع عشر رمضان سنة إحدى عشرة وستمائة ودخل مكة في الثالث من ذي القعدة من السنة وخطب له بها وحج ودخل زبيد وملكها في مستهل المحرم سنة اثنتي عشرة ثم ملك مكة في ربيع الآخر سنة عشرين وستمائة أخذها من الشريف حسن بن قتادة الحسني {cite:wafayat-ayan}، ونهبها عسكره إلى العصر حتى أخذوا الثياب عن الناس وأمر بنبش قبر الشريف قتادة بن إدريس وإحراقه فنبشوه فإذا التابوت فارغ {cite:kamil-ibn-al-athir p. 435-436}؛ وكان جباراً عنيداً يحج وهو يرمي بالبندق ويدخل غلمانه الحرم ويضربون الناس بالسيوف، وزاد في بلاد اليمن التجار الوافدين من السند والهند حتى كتب لكل تاجر إلى بعض بلاد اليمن واستولى على ماله فاحتمل في خمسمائة مركب ومعه ألف خادم ومائة قنطار عنبر وعود ومسك ومائة ألف ثوب ومائة صندوق أموال وجواهر {cite:shadharat-dhahab p. 120}؛ ولما بلغ الملك الكامل ما فعله الشيخ صديق — الذي تولى القاهرة — بُني عليه قبة؛ وتوفي الملك المسعود باليمن {cite:wafayat-ayan}."
  en: "Al-Malik al-Mas'ud Atsiz — 'Afsis' meaning death in the Yemeni tongue — al-Kamil's eldest son and sultan of Yemen; his army sacked Mecca in 620 stripping the pilgrims and he ordered the murdered sharif Qatada's grave exhumed {cite:kamil-ibn-al-athir p. 435-436}; a tyrant who musketed on Hajj, let his ghilman sword the sanctuary's crowd, and stripped the India-bound merchants of Zabid till he loaded five hundred ships with ambergris, aloes and jewel-chests; he died paralysed at Mecca and was buried at al-Ma'la {cite:shadharat-dhahab p. 120}."
  es: "Al-Malik al-Mas'ud Atsiz — 'Afsis' que significa muerte en la lengua yemení — hijo mayor de al-Kamil y sultán de Yemen; su ejército saqueó La Meca en 620 despojando a los peregrinos y ordenó exhumar la tumba del sharif Qatada asesinado {cite:kamil-ibn-al-athir p. 435-436}; un tirano que disparó mosquetes en el Hajj, dejó que su espada ghilman matara a la multitud del santuario y despojó a los mercaderes que se dirigían a la India de Zabid hasta cargar quinientos barcos con ámbar gris, áloes y cofres de joyas; murió paralizado en La Meca y fue enterrado en al-Ma'la {cite:shadharat-dhahab p. 120}."
  fr: "Al-Malik al-Mas'ud Atsiz — « Afsis », qui signifie « mort » en yéménite — fils aîné d'al-Kamil et sultan du Yémen, pilla La Mecque en 620, dépouillant les pèlerins, et ordonna l'exhumation de la tombe du chérif assassiné Qatada (voir: Kamil ibn al-Athir, p. 435-436). Tyran, il fit tirer des mousquets pendant le Hajj, laissa ses ghilmans massacrer à l'épée la foule du sanctuaire et dépouilla les marchands de Zabid, en route pour l'Inde, jusqu'à ce qu'il ait chargé cinq cents navires d'ambre gris, d'aloès et de coffres à bijoux. Il mourut paralysé à La Mecque et fut enterré à al-Ma'la (voir: Hadharat Dhahab, p. 120)."
  ur: "المالک المسعود عطس - 'افسس' کا مطلب یمنی زبان میں موت - الکامل کا بڑا بیٹا اور یمن کا سلطان؛ اس کی فوج نے 620 میں حجاج کو برطرف کرتے ہوئے مکہ کو توڑ دیا اور اس نے مقتول شریف قتادہ کی قبر کو نکالنے کا حکم دیا۔ 435-436}; ایک ظالم جس نے حج پر حملہ کیا، اس کے غلمان نے حرم کے ہجوم پر تلوار چلائی، اور زبید کے ہندوستان جانے والے تاجروں کو اس وقت تک چھین لیا جب تک کہ اس نے پانچ سو بحری جہازوں کو عنبر، ایلو اور زیورات کے سینے سے لاد دیا۔ وہ مکہ میں مفلوج ہو کر فوت ہوئے اور المعلا میں دفن ہوئے۔ 120}۔"
  tr: "Kral El-Mes'ud Efes — ve Yemen lehçesinde Efes 'Ölüm' anlamına gelir — Kral El-Kamil Nasireddin Muhammed'in oğludur; Kral el-Kamil'in en büyük oğluydu ve onu Yemen valisi olarak atamıştır; 601 yılının on yedinci Ramazan'ı Pazartesi günü Yemen'e gitmek üzere Mısır'dan ayrılmış, yılın üçüncü Zulüd-Kı'da'sında Mekke'ye girmiş, orada vaaz vermiş, Hacı kılmış, Zabi'ye girmiş ve 12. yılda Muharrem başında hüküm sürmüş, ardından 620 Hicri yılında Rabi'l-Tani'de Mekke'nin kralı olmuştur. Onu Şerif Hasan bin Katede el-Hasani'den almıştır { Kaynak: Wafayat-Ayan} ve askerleri evi öğleden sonraya kadar yağmaladı, sonra halktan kıyafetleri aldılar ve Şerif Katada bin İdris'in mezarının mezarının çıkarılıp yakılmasını emretti, mezarı çıkardılar ve tabut boşaldı. {Cite:Kamil-ibn-al-Athir s. 435-436}; O, fındık atarken hac yapan, hizmetkarlarını kutsal alana giren ve insanları kılıçla vuran zorba ve inatçı bir hacıydı. Yemen'de Sindh ve Hindistan'dan gelen tüccarların sayısını artırdı, sonunda Yemen'in bazı bölgelerine gönderilen her tüccara yazdı ve beş yüz gemi taşıyarak servetini ele geçirdi; beş yüz gemi taşıdı, bin hizmetçi, yüz sentil kehribar, ud, misk ve yüz kişi taşıyordu. Bin giysi ve yüz sandık para ile mücevher {atıf:shadharat-dhahab s. 120}; kral tam aşamaya ulaştığında, Kahire'yi ele geçiren Şeyh Siddiq onun üzerine bir kubbe inşa etti; ve Kral El-Mes'ud Yemen'de öldü {atıf:wafayat-ayan}."
  id: "Raja Al-Mas'ud Ephesus — dan Ephesus dalam dialek Yaman berarti 'Kematian' — putra Raja Al-Kamil Nasir al-Din Muhammad; ia adalah putra sulung Raja Al-Kamil dan mengangkatnya sebagai gubernur Yaman; ia meninggalkan Mesir menuju Yaman pada hari Senin, tanggal tujuh belas Ramadan, tahun 601, memasuki Mekah pada tanggal ketiga Dhu al-Qi'dah tahun itu, memberikan khutbah di sana, melaksanakan Haji, memasuki Zabid, dan memerintahnya pada awal Muharram pada tahun 12, kemudian menjadi raja Mekah di Rabi' al-Thani pada tahun 620 H. Ia mengambilnya dari Sharif Hasan ibn Qatada al-Hasani { Kutip: Wafayat-Ayan}, dan pasukannya menjarah hingga sore hari sampai mereka mengambil pakaian dari rakyat, dan ia memerintahkan penggalian dan pembakaran makam Sharif Qatada ibn Idris, yang kemudian mereka gali, dan peti mati pun kosong. {cite:Kamil-ibn-al-Athir hlm. 435-436}; ia adalah seorang tiran dan peziarah keras kepala yang melakukan ziarah sambil melemparkan kacang hazel, para pelayannya masuk ke tempat suci, dan memukul orang dengan pedang. Ia menambah jumlah pedagang dari Sindh dan India di Yaman hingga ia menulis kepada setiap pedagang ke beberapa bagian Yaman dan merebut hartanya, membawa lima ratus kapal yang membawa seribu pelayan, seratus kuintal amber, oud, musk, dan seratus kuintal amber, oud, musk, dan seratus Seribu pakaian dan seratus peti berisi uang dan perhiasan {cite:shadharat-dhahab hlm. 120}; ketika raja mencapai tahap lengkap, Sheikh Siddiq — yang mengambil alih Kairo — membangun kubah di atasnya; dan Raja Al-Mas'ud wafat di Yaman {cite:wafayat-ayan}."
