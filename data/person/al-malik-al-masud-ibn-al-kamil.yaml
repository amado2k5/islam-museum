summary:
  ar: "الملك المسعود بن الملك الكامل ناصر الدين محمد؛ كان أكبر أولاد الملك الكامل وولاه على اليمن؛ رحل عن الديار المصرية متوجهاً إلى اليمن يوم الاثنين سابع عشر رمضان سنة إحدى عشرة وستمائة ودخل مكة في الثالث من ذي القعدة من السنة وخطب له بها وحج ودخل زبيد وملكها في مستهل المحرم سنة اثنتي عشرة ثم ملك مكة في ربيع الآخر سنة عشرين وستمائة أخذها من الشريف حسن بن قتادة الحسني؛ ولما بلغ الملك الكامل ما فعله الشيخ صديق — الذي تولى القاهرة — بُني عليه قبة؛ وتوفي الملك المسعود باليمن {cite:wafayat-ayan}."
  en: "Al-Malik al-Mas'ud b. al-Kamil — the Ayyubid conqueror of Yemen; entered Mecca in 611, took Zabid in 612 and Mecca again in 620 from the Hasanid sharif; died in Yemen and his death was concealed three days {cite:wafayat-ayan}."
