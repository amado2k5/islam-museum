class: person
label: { ar: "الملك المسعود بن الكامل", en: "al-Malik al-Mas'ud ibn al-Kamil" }
aliases: [person/al-masud-atsiz-yemen]
died: { edtf: "1229~", hijri: "0626~", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي ليلة الاثنين نصف شعبان وحمل إلى القلعة الجديدة التي في الجزيرة وأُخفي موته ثلاثة أيام؛ سنة وفاته متعذرة التعيين من المقروء {cite:wafayat-ayan}. وفي الشذرات أنه سار إلى مكة فمرض مرضاً مزمناً فوصل إليها وقد أفلج ويبست يداه ورجلاه ورأى في نفسه العبر ثم مات فدفنوه في المعلى {cite:shadharat-dhahab p. 120}." }
summary:
  ar: "الملك المسعود أفسيس — وأفسيس بلغة اليمن موت — بن الملك الكامل ناصر الدين محمد؛ كان أكبر أولاد الملك الكامل وولاه على اليمن؛ رحل عن الديار المصرية متوجهاً إلى اليمن يوم الاثنين سابع عشر رمضان سنة إحدى عشرة وستمائة ودخل مكة في الثالث من ذي القعدة من السنة وخطب له بها وحج ودخل زبيد وملكها في مستهل المحرم سنة اثنتي عشرة ثم ملك مكة في ربيع الآخر سنة عشرين وستمائة أخذها من الشريف حسن بن قتادة الحسني {cite:wafayat-ayan}، ونهبها عسكره إلى العصر حتى أخذوا الثياب عن الناس وأمر بنبش قبر الشريف قتادة بن إدريس وإحراقه فنبشوه فإذا التابوت فارغ {cite:kamil-ibn-al-athir p. 435-436}؛ وكان جباراً عنيداً يحج وهو يرمي بالبندق ويدخل غلمانه الحرم ويضربون الناس بالسيوف، وزاد في بلاد اليمن التجار الوافدين من السند والهند حتى كتب لكل تاجر إلى بعض بلاد اليمن واستولى على ماله فاحتمل في خمسمائة مركب ومعه ألف خادم ومائة قنطار عنبر وعود ومسك ومائة ألف ثوب ومائة صندوق أموال وجواهر {cite:shadharat-dhahab p. 120}؛ ولما بلغ الملك الكامل ما فعله الشيخ صديق — الذي تولى القاهرة — بُني عليه قبة؛ وتوفي الملك المسعود باليمن {cite:wafayat-ayan}."
  en: "Al-Malik al-Mas'ud Atsiz — 'Afsis' meaning death in the Yemeni tongue — al-Kamil's eldest son and sultan of Yemen; his army sacked Mecca in 620 stripping the pilgrims and he ordered the murdered sharif Qatada's grave exhumed {cite:kamil-ibn-al-athir p. 435-436}; a tyrant who musketed on Hajj, let his ghilman sword the sanctuary's crowd, and stripped the India-bound merchants of Zabid till he loaded five hundred ships with ambergris, aloes and jewel-chests; he died paralysed at Mecca and was buried at al-Ma'la {cite:shadharat-dhahab p. 120}."
