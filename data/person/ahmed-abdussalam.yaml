summary:
  ar: "داعية يحفظ أرشيف أسابيل برنامجه التلفزيوني «أصلّي عليه» عن الصلاة على النبي ومحبته واتباعه ⁦(اثنتان وعشرون حلقة)⁩، ويذكره في متحدثي مصر؛ يتكلم في تسجيلاته بلهجة مصرية تمزج الفصحى بالعامية، ويدعو فيها للعاملين في القناة التي تبث البرنامج. لا مقالة له في ويكيبيديا ولا مدخل في ويكيداتا؛ ما في هذه الصفحة من تسجيلاته ومنسوب إليه."
  en: "A preacher whose television programme 'Osalli Alayh' ('I Invoke Blessings on Him', twenty-two episodes) on invoking blessings on the Prophet, loving him and following him, is kept by the Assabile archive, which lists him among the speakers of Egypt; in the recordings he speaks a formal Arabic mixed with Egyptian colloquial and prays for the crew of the channel that broadcasts the programme. No Wikipedia article or Wikidata item about him was found; what this page holds comes from his recordings and is attributed to him."
  ur: "ایک داعی جن کا نبی پر درود، ان کی محبت اور اتباع پر ٹیلی وژن پروگرام «اُصلّی علیہ» (بائیس اقساط) اسابیل آرکائیو میں محفوظ ہے، جو انہیں مصر کے مقررین میں شمار کرتا ہے؛ ریکارڈنگز میں وہ مصری بول چال ملی فصیح عربی بولتے ہیں اور پروگرام نشر کرنے والے چینل کے عملے کے لیے دعا کرتے ہیں۔ ان کے بارے میں ویکیپیڈیا کا کوئی مضمون یا ویکی ڈیٹا کا کوئی اندراج نہیں ملا؛ اس صفحے کی معلومات ان کی ریکارڈنگز سے ہیں اور انہی سے منسوب ہیں۔"
