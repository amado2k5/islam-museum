summary:
  ar: "قائد المأمون؛ عند البلاذري وجهه إلى قم وقد عصى أهلها ومنعوا الخراج فقتل رئيسهم يحيى بن عمران وهدم سور مدينتهم وألصقه بالأرض وجباها سبعة آلاف ألف درهم وكسراً."
  en: "al-Ma'mun's commander; in al-Baladhuri, sent against rebellious Qumm — killed its chief Yahya ibn Imran, razed its wall, and levied seven million dirhams plus increments."
  es: "Comandante de al-Ma'mun; en al-Baladhuri, enviado contra la rebelde Qumm, mató a su jefe Yahya ibn Imran, arrasó su muralla y le impuso siete millones de dirhams más recargos."
  fr: "Le commandant d'al-Ma'mun; à al-Baladhuri, envoyé contre la rébellion de Qumm — tua son chef Yahya ibn Imran, rasa son mur et leva sept millions de dirhams plus des augmentations."
  ur: "المامون کا کمانڈر؛ البلادھوری میں، جسے باغی قم کے خلاف بھیجا گیا تھا - اس کے سربراہ یحییٰ بن عمران کو قتل کر دیا، اس کی دیوار کو گرا دیا، اور سات ملین درہم کے علاوہ اضافہ کر دیا۔"
