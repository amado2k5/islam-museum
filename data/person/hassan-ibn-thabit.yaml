  - { kind: laqab, lang: ar, value: "شاعر الرسول" }
gender: male
roles: [companion, poet]
traditions: [sunni]
summary:
  ar: "شاعر الرسول وشاعر الأنصار من الخزرج، كانت له شهرة في الجاهلية ومدح أمراء الغساسنة واللخميين، وجعلته مقالة دائرة المعارف الإسلامية أبرز شعراء ظهور الإسلام. اختلف في وفاته فرجحت المقالة نحو 40هـ/659م، وذكرت روايات أخرى 50هـ و54هـ. ويضم ديوانه برواية ابن حبيب 228 قصيدة، ويقدّر كاتب المقالة أن نحو 60 إلى 70 في المئة من الشعر المنسوب إليه قد يكون منحولاً. وكان النبي ينصب له منبراً في المسجد ويقول: «اللهم أيده بروح القدس»؛ وزار الحارث بن أبي شمر الغساني بالشام وقال له حين ساماه النعمان بن المنذر يا بن الفريعة لقد نبئت أنك تفضل النعمان عليّ فقال وكيف أفضله عليك فوالله لقفاك أحسن من وجهه ثم أتم الفخر شعراً في ابن الفريعة {cite:muruj-al-dhahab p. 426-427}، وفي مسلم سمعه البراء يقول له النبي «اهجهم وجبريل معك» {cite:sahih-muslim 2486}"
  en: "Poet of the Khazraj and of the Prophet, who already had a reputation in the Jahiliyya and had praised Ghassanid and Lakhmid princes; the Encyclopaedia of Islam calls him the most prominent of the poets associated with the rise of Islam. The date of his death is uncertain: the article judges about 40/659 most likely, against other reports of 50 and 54. His Diwan in Ibn Habib's recension has 228 poems, and the article's author estimates that some 60 to 70 percent of the poetry ascribed to him may be spurious."
  ur: "خزرج کے شاعر اور نبی کے شاعر، جاہلیت میں بھی ان کی شہرت تھی اور وہ غسانی اور لخمی امیروں کی مدح کر چکے تھے؛ دائرۃ المعارف اسلامیہ انہیں ظہورِ اسلام سے وابستہ شعراء میں سب سے نمایاں کہتا ہے۔ ان کی وفات کی تاریخ غیر یقینی ہے: مقالہ تقریباً 40ھ/659ء کو زیادہ ممکن سمجھتا ہے، جبکہ دوسری روایات 50ھ اور 54ھ کی ہیں۔ ابن حبیب کی روایت میں ان کے دیوان میں 228 قصیدے ہیں، اور مقالے کے مصنف کا اندازہ ہے کہ ان سے منسوب شاعری کا تقریباً 60 سے 70 فیصد جعلی ہو سکتا ہے۔"
  es: "Poeta del Khazraj y del Profeta, que ya gozaba de renombre en la época preislámica y había elogiado a los príncipes gasánidas y lajmíes; la Enciclopedia del Islam lo considera el más destacado de los poetas asociados al surgimiento del Islam. La fecha de su muerte es incierta: el artículo la sitúa alrededor del año 40/659 como la más probable, frente a otros informes que la sitúan en el 50 y el 54. Su Diwan, en la recensión de Ibn Habib, contiene 228 poemas, y el autor del artículo estima que entre el 60 y el 70 por ciento de la poesía que se le atribuye podría ser apócrifa."
  fr: "Poète des Khazraj et du Prophète, déjà réputé à l'époque préislamique (Jahiliyya) pour avoir fait l'éloge des princes ghassanides et lakhmides, il est considéré par l'Encyclopédie de l'Islam comme le plus éminent des poètes associés à l'essor de l'islam. La date de sa mort demeure incertaine: l'article privilégie l'an 40/659, contre d'autres sources qui avancent les dates de 50 et 54. Son Diwan, selon la recension d'Ibn Habib, comprend 228 poèmes, et l'auteur de l'article estime que 60 à 70 % des poèmes qui lui sont attribués pourraient être apocryphes."
  tr: "Khazraj hanedanından Peygamber ve Ensar'ın şairi olan Khazraj hanedanından olan Shy, İslam öncesi dönemde ünlüydü ve Gassanid ile Lahmid prenslerini övdü. İslam Ansiklopedisi üzerine yazdığı makale, onu İslam'ın gelişinin en önde gelen şairlerinden biri yaptı. Ölümü konusunda anlaşmazlıklar vardır; makale yaklaşık 40 Hicri / 659 M.S. yıllarını desteklerken, diğer anlatımlar 50 Hicri ve 54 Hicri yıllarını savunur. İbn Habib'in anlatımına göre diwanı 228 şiir içerir ve makalenin yazarı, kendisine atfedilen şiirlerin yaklaşık yüzde 60 ila %70'inin çarpıtılmış olabileceğini tahmin etmektedir. Peygamber onun için camide bir kürsü kurar ve şöyle derdi: 'Ey Allah, ona Kutsal Ruh'la destek ol.' Levant'ta Al-Haris bin Ebi Şemmar el-Ghassani'yi ziyaret etti ve ona şöyle dedi: 'Al-Nu'man ibn al-Mundhir onu çağırdığında, 'Ey el-Feri'ah'ın oğlu, sana bildirdim, sen el-Nu'man'ı benden üstün tuttuğunu bildirdim.' O dedi ki, 'Onu senden nasıl tercih edebilirim? Allah'a yemin yüzün onunkinden daha güzel.' Sonra İbn el-Furay'ah hakkında övünen şiirini tamamladı {cite:muruj-al-dhahab, s. 426-427} ve el-Bar'a'nın rivayet ettiği bir Müslümanda Peygamber ona dedi ki, 'Onları kışkırt, Cebrail seninle olsun.' {cite:sahih-muslim 2486}"
  id: "Penyair Nabi dan Ansar dari dinasti Khazraj, ia terkenal pada era pra-Islam dan memuji pangeran Ghassanid dan Lakhmid. Artikel tentang Ensiklopedia Islam menjadikannya salah satu penyair paling menonjol pada masa munculnya Islam. Ada perbedaan pendapat mengenai kematiannya, dengan artikel tersebut mendukung sekitar tahun 40 H / 659 M, sementara riwayat lain menyebutkan 50 H dan 54 H (54 H). Menurut narasi Ibn Habib, diwannya mencakup 228 puisi, dan penulis artikel memperkirakan sekitar 60 hingga 70 persen puisi yang dikaitkan dengannya mungkin terdistorsi. Nabi akan mendirikan mimbar untuknya di masjid dan berkata: 'Ya Allah, sokonglah dia dengan Roh Kudus.' Ia mengunjungi Al-Harith ibn Abi Shammar al-Ghassani di Levant dan berkata kepadanya, 'Ketika al-Nu'man ibn al-Mundhir memanggilnya 'Wahai putra al-Fari'ah, aku telah memberitahumu bahwa Engkau lebih memilih al-Nu'man daripada aku.' Ia berkata, 'Bagaimana aku bisa memilih dia daripada dirimu? Demi Allah, wajahmu lebih baik daripada wajahnya.' Kemudian ia menyelesaikan puisi penuh kebanggaan tentang Ibn al-Furay'ah {cite:muruj-al-dhahab, hlm. 426-427}, dan dalam sebuah Muslim yang diceritakan oleh al-Bara'a, Nabi berkata kepadanya, 'Bangkitkan mereka, dan Gabriel bersamamu.' {cite:sahih-muslim 2486}"
