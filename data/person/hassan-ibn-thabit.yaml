summary:
  en: "The renowned 'Poet of the Prophet'; an Ansari chief of Banu al-Najjar who defended Islam and the Prophet with his eloquent poetry, endorsed by the Prophet with the supplication 'O God, support him with the Holy Spirit'; lived to over a hundred years."
  ar: "شاعر الرسول وشاعر الأنصار؛ صحابي جليل من بني النجار كان ينفح عن رسول الله ويهجو خصومه بشعره، وكان النبي ينصب له منبراً في المسجد ويقول: «اللهم أيده بروح القدس»؛ عُمّر طويلاً وتوفي في خلافة معاوية.، وزار الحارث بن أبي شمر الغساني بالشام وقال له حين ساماه النعمان بن المنذر يا بن الفريعة لقد نبئت أنك تفضل النعمان عليّ فقال وكيف أفضله عليك فوالله لقفاك أحسن من وجهه ثم أتم الفخر شعراً في ابن الفريعة {cite:muruj-al-dhahab p. 426-427}، وفي مسلم سمعه البراء يقول له النبي «اهجهم وجبريل معك» {cite:sahih-muslim 2486}"
