summary:
  ar: "شاعر الرسول وشاعر الأنصار من الخزرج، كانت له شهرة في الجاهلية ومدح أمراء الغساسنة واللخميين، وجعلته مقالة دائرة المعارف الإسلامية أبرز شعراء ظهور الإسلام. اختلف في وفاته فرجحت المقالة نحو 40هـ/659م، وذكرت روايات أخرى 50هـ و54هـ. ويضم ديوانه برواية ابن حبيب 228 قصيدة، ويقدّر كاتب المقالة أن نحو 60 إلى 70 في المئة من الشعر المنسوب إليه قد يكون منحولاً. وكان النبي ينصب له منبراً في المسجد ويقول: «اللهم أيده بروح القدس»؛ وزار الحارث بن أبي شمر الغساني بالشام وقال له حين ساماه النعمان بن المنذر يا بن الفريعة لقد نبئت أنك تفضل النعمان عليّ فقال وكيف أفضله عليك فوالله لقفاك أحسن من وجهه ثم أتم الفخر شعراً في ابن الفريعة {cite:muruj-al-dhahab p. 426-427}، وفي مسلم سمعه البراء يقول له النبي «اهجهم وجبريل معك» {cite:sahih-muslim 2486}"
  en: "Poet of the Khazraj and of the Prophet, who already had a reputation in the Jahiliyya and had praised Ghassanid and Lakhmid princes; the Encyclopaedia of Islam calls him the most prominent of the poets associated with the rise of Islam. The date of his death is uncertain: the article judges about 40/659 most likely, against other reports of 50 and 54. His Diwan in Ibn Habib's recension has 228 poems, and the article's author estimates that some 60 to 70 percent of the poetry ascribed to him may be spurious."
  ur: "خزرج کے شاعر اور نبی کے شاعر، جاہلیت میں بھی ان کی شہرت تھی اور وہ غسانی اور لخمی امیروں کی مدح کر چکے تھے؛ دائرۃ المعارف اسلامیہ انہیں ظہورِ اسلام سے وابستہ شعراء میں سب سے نمایاں کہتا ہے۔ ان کی وفات کی تاریخ غیر یقینی ہے: مقالہ تقریباً 40ھ/659ء کو زیادہ ممکن سمجھتا ہے، جبکہ دوسری روایات 50ھ اور 54ھ کی ہیں۔ ابن حبیب کی روایت میں ان کے دیوان میں 228 قصیدے ہیں، اور مقالے کے مصنف کا اندازہ ہے کہ ان سے منسوب شاعری کا تقریباً 60 سے 70 فیصد جعلی ہو سکتا ہے۔"
