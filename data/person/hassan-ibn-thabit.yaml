  did_you_know:
    ar: "حسان بن ثابت شاعر الأنصار والمدافع عن النبي بشعره، وكان النبي ينصب له منبراً في المسجد فيقول عليه."
    en: "Hassan ibn Thabit, poet of the Ansar who defended the Prophet with verse; the Prophet set up a pulpit for him in the mosque to recite from."
    ur: "حسان بن ثابت، انصار کے شاعر جنھوں نے شعر سے نبی کا دفاع کیا؛ نبی نے ان کے لیے مسجد میں منبر نصب کیا جس پر وہ کلام کہتے۔"
    sources: [source/mubarakpuri-raheeq, source/sahih-al-bukhari]
class: person
label: { en: "Hassan ibn Thabit", ar: "حسان بن ثابت", ur: "حسان بن ثابت", es: "Hassan ibn Thabit", fr: "Hassan ibn Thabit" }
