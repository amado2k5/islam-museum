summary:
  ar: "زين الدين بن علي بن أحمد العاملي الجبعي، إمامي، عالم بالحديث بحاث، ويعرف بالشهيد الثاني، ولد في جبع بلبنان سنة ٩١١هـ ورحل إلى مصر والحجاز والعراق وبلاد الروم وقتل بعد استدعاء السلطان له سنة ٩٦٦هـ، له منية المريد وروض الجنان ومسالك الأفهام."
  en: "Zayn al-Din ibn Ali ibn Ahmad al-Amili al-Juba'i, an Imami (Twelver Shi'i) scholar of hadith, known as al-Shahid al-Thani, born at Jaba in Lebanon in 911 AH, who travelled to Egypt, the Hijaz, Iraq and the lands of Rum and was killed after the sultan summoned him in 966 AH (1559); author of Munyat al-Murid, Rawd al-Jinan and Masalik al-Afham."
