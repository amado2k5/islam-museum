summary:
  ar: "عصام بن يزيد بن عجلان، أبو سعيد الملقب بخير. صحب سفيان الثوري ثلاث عشرة سنة، وكان رسوله إلى الخليفة المهدي، فعرض عليه المال والبر فلم يقبل، ثم رجع إلى أصبهان بعد وفاة سفيان فسكنها."
  en: "Isam ibn Yazid ibn Ajlan, Abu Sa'id, called Khayr; he kept the company of Sufyan al-Thawri for thirteen years and was his messenger to the caliph al-Mahdi, who offered him gifts and money, which he refused; after Sufyan's death he returned to Isfahan and settled there."
  ur: "عصام بن یزید بن عجلان، ابو سعید جنہیں خیر کہا جاتا تھا؛ انہوں نے سفیان ثوری کی تیرہ سال صحبت کی، اور خلیفہ مہدی کے پاس ان کے قاصد تھے۔ مہدی نے انہیں مال اور انعام کی پیشکش کی مگر انہوں نے قبول نہ کیا؛ سفیان کی وفات کے بعد اصفہان لوٹ کر وہیں رہے۔"
  es: "Isam ibn Yazid ibn Ajlan, Abu Sa'id, llamado Khayr, acompañó a Sufyan al-Thawri durante trece años y fue su mensajero ante el califa al-Mahdi, quien le ofreció regalos y dinero, que él rechazó. Tras la muerte de Sufyan, regresó a Isfahán y se estableció allí."
  fr: "Isam ibn Yazid ibn Ajlan, Abu Sa'id, appelé Khayr; il a fréquenté Sufyan al-Thawri pendant treize ans et a été son messager auprès du calife al-Mahdi, qui lui a offert des cadeaux et de l'argent, qu'il a refusés; après la mort de Sufyan, il est retourné à Ispahan et s'y est installé."
  tr: "İssam bin Yezid bin Eclan, Ebu Said, lakaplı Hayr. Sufyan el-Tevri'ye on üç yıl boyunca eşlik etti ve Halife el-Mehdi'ye elçi olarak hizmet etti. Para ve sadaka teklif edildi, ancak reddetti. Sufyan'ın ölümünden sonra İsfahan'a döndü ve orada yerleşti."
  id: "Issam ibn Yazid ibn Ajlan, Abu Sa'id, dijuluki Khair. Ia mendampingi Sufyan al-Thawri selama tiga belas tahun dan menjadi utusan kepada Khalifah al-Mahdi. Ia ditawari uang dan sedekah, tetapi ia menolak. Setelah kematian Sufyan, ia kembali ke Isfahan dan menetap di sana."
