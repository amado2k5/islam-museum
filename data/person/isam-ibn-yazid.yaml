summary:
  ar: "عصام بن يزيد بن عجلان، أبو سعيد الملقب بخير. صحب سفيان الثوري ثلاث عشرة سنة، وكان رسوله إلى الخليفة المهدي، فعرض عليه المال والبر فلم يقبل، ثم رجع إلى أصبهان بعد وفاة سفيان فسكنها."
  en: "Isam ibn Yazid ibn Ajlan, Abu Sa'id, called Khayr; he kept the company of Sufyan al-Thawri for thirteen years and was his messenger to the caliph al-Mahdi, who offered him gifts and money, which he refused; after Sufyan's death he returned to Isfahan and settled there."
  ur: "عصام بن یزید بن عجلان، ابو سعید جنہیں خیر کہا جاتا تھا؛ انہوں نے سفیان ثوری کی تیرہ سال صحبت کی، اور خلیفہ مہدی کے پاس ان کے قاصد تھے۔ مہدی نے انہیں مال اور انعام کی پیشکش کی مگر انہوں نے قبول نہ کیا؛ سفیان کی وفات کے بعد اصفہان لوٹ کر وہیں رہے۔"
