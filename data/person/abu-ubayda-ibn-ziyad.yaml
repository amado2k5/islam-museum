summary:
  ar: "أبو عبيدة بن زياد؛ أسره أهل كابل لما نكثوا ففداه طلحة بن عبد الله بن خلف الخزاعي بخمسمائة ألف درهم بإرسال سلم بن زياد."
  en: "Abu Ubayda ibn Ziyad; captured by Kabul's people when they broke, ransomed by Talha ibn Abdallah — Talhat al-Talhat — for five hundred thousand dirhams at Salm ibn Ziyad's sending."
  fr: "Abu Ubayda ibn Ziyad, capturé par les habitants de Kaboul lorsqu'ils rompirent le pacte, fut racheté par Talha ibn Abdallah — Talhat al-Talhat — pour cinq cent mille dirhams, à la demande de Salm ibn Ziyad."
  es: "Abu Ubayda ibn Ziyad fue capturado por la gente de Kabul cuando se desmoronaron, y fue rescatado por Talha ibn Abdallah — Talhat al-Talhat — por quinientos mil dirhams por orden de Salm ibn Ziyad."
  ur: "ابو عبیدہ ابن زیاد؛ کابل کے لوگوں نے اس وقت پکڑا جب انہوں نے توڑ دیا، طلحہ بن عبد اللہ - طلعت الطلحات - نے سالم ابن زیاد کے بھیجے جانے پر پانچ لاکھ درہم کے عوض فدیہ دیا۔"
