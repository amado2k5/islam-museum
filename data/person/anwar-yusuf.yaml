summary:
  ar: "شيخ إثيوبي يقدّم دروس التفسير والحديث والأدعية بلغة الأفان أورومو على قناته في يوتيوب (@sheikhanwaryusuf) منذ 2014؛ بلغت القناة 213 ألف مشترك وقرابة ستة آلاف مقطع في أكتوبر 2026، وهي من أكبر قنوات الدعوة بلغة الأورومو."
  en: "An Ethiopian sheikh who has taught Qur'an commentary (tafsir), hadith and supplication in Afaan Oromo on his YouTube channel (@sheikhanwaryusuf) since 2014; the channel reached 213,000 subscribers and nearly six thousand videos in October 2026, among the largest dawah channels in the Oromo language."
  ur: "انور یوسف ایتھوپیا کے شیخ ہیں جو 2014ء سے اپنے یوٹیوب چینل (@sheikhanwaryusuf) پر افان اورومو زبان میں تفسیر، حدیث اور دعاؤں کے دروس دیتے ہیں؛ اکتوبر 2026ء میں چینل کے سبسکرائبر 213 ہزار اور ویڈیوز تقریباً چھ ہزار تک پہنچ گئیں۔"
  es: "Un jeque etíope que ha enseñado comentarios del Corán (tafsir), hadices y súplicas en Afaan Oromo en su canal de YouTube (@sheikhanwaryusuf) desde 2014; El canal alcanzó 213.000 suscriptores y casi seis mil vídeos en octubre de 2026, uno de los canales dawah más grandes en idioma oromo."
  fr: "Un cheikh éthiopien qui enseigne le commentaire du Coran (tafsir), le hadith et la supplication en afaan oromo sur sa chaîne YouTube (@sheikhanwaryusuf) depuis 2014; la chaîne a atteint 213 000 abonnés et près de six mille vidéos en octobre 2026, parmi les plus grandes chaînes de dawah en langue oromo."
  tr: "Bir Etiyopyalı şeyh, 2014'ten beri YouTube kanalında (@sheikhanwaryusuf) Avan Oromo dilinde Tafsir, Hadis ve namaz dersleri vermektedir; kanal Ekim 2026'ya kadar 213.000 aboneye ve yaklaşık altı bin klipe ulaşarak Oromo dilindeki en büyük Davet kanallarından biri olmuştur."
  id: "Seorang sheikh Ethiopia telah memberikan pelajaran dalam Tafsir, Hadis, dan doa dalam bahasa Avan Oromo di saluran YouTube-nya (@sheikhanwaryusuf) sejak 2014; saluran ini mencapai 213.000 pelanggan dan hampir enam ribu klip pada Oktober 2026, menjadikannya salah satu saluran Dawah terbesar dalam bahasa Oromo."
