summary:
  ar: "المثنى بن الصباح أبو عبد الله اليماني ثم المكي الأبناوي، من رجال الحديث المكثرين، روى عن مجاهد وطاوس وابن أبي مليكة وعطاء بن أبي رباح وعمرو بن دينار وغيرهم، وعنه ابن المبارك وعيسى بن يونس وغيرهم. قال ابن معين إنه ثقة، وقال الترمذي والنسائي ليس بثقة، وقال النسائي في موضع آخر متروك الحديث، وقال الدارقطني ضعيف. (؟ - ١٤٩ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13365}"
  en: "al-Muthanna ibn al-Sabbah, Abu Abd Allah, of Yemen, then Mecca, a prolific narrator. He narrated from Mujahid, Tawus, Ibn Abi Mulayka, Ata ibn Abi Rabah and Amr ibn Dinar; Ibn al-Mubarak and Isa ibn Yunus narrated from him. Ibn Ma'in called him reliable; al-Tirmidhi and al-Nasa'i denied it, and al-Nasa'i later called him abandoned; al-Daraqutni called him weak. Death 149 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13365}"
