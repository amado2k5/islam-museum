summary:
  ar: "المثنى بن الصباح أبو عبد الله اليماني ثم المكي الأبناوي، من رجال الحديث المكثرين، روى عن مجاهد وطاوس وابن أبي مليكة وعطاء بن أبي رباح وعمرو بن دينار وغيرهم، وعنه ابن المبارك وعيسى بن يونس وغيرهم. قال ابن معين إنه ثقة، وقال الترمذي والنسائي ليس بثقة، وقال النسائي في موضع آخر متروك الحديث، وقال الدارقطني ضعيف. ⁦(؟ - ١٤٩ه)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13365}"
  en: "al-Muthanna ibn al-Sabbah, Abu Abd Allah, of Yemen, then Mecca, a prolific narrator. He narrated from Mujahid, Tawus, Ibn Abi Mulayka, Ata ibn Abi Rabah and Amr ibn Dinar; Ibn al-Mubarak and Isa ibn Yunus narrated from him. Ibn Ma'in called him reliable; al-Tirmidhi and al-Nasa'i denied it, and al-Nasa'i later called him abandoned; al-Daraqutni called him weak. Death 149 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13365}"
  fr: "al-Muthanna ibn al-Sabbah, Abu Abd Allah, du Yémen, puis La Mecque, un narrateur prolifique. Il a raconté de Mujahid, Tawus, Ibn Abi Mulayka, Ata ibn Abi Rabah et Amr ibn Dinar ; Ibn al-Moubarak et Isa ibn Yunus ont raconté de lui. Ibn Ma'in l'a appelé fiable ; al-Tirmidhi et al-Nasai l'ont nié, et al-Nasai l’a plus tard appelé abandonné ; al-Daraqutni l'a appelé faible. Death 149 H tel qu'imprimé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13365}"
  es: "Al-Muthanna ibn al-Sabbah, Abu Abd Allah, de Yemen, entonces La Meca, fue un narrador prolífico. Narró de Mujahid, Tawus, Ibn Abi Mulayka, Ata ibn Abi Rabah y Amr ibn Dinar; Ibn al-Mubarak e Isa ibn Yunus narraron de él. Ibn Ma'in lo consideró fiable; al-Tirmidhi y al-Nasa'i lo negaron, y al-Nasa'i posteriormente lo consideró abandonado; al-Daraqutni lo consideró débil. Falleció en el año 149 de la Hégira (según la versión impresa). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13365}"
  ur: "المثنیٰ بن الصباح، ابو عبد اللہ، یمن، پھر مکہ، ایک مشہور راوی۔ انہوں نے مجاہد، طاؤس، ابن ابی ملیکہ، عطاء بن ابی رباح اور عمرو بن دینار سے روایت کی ہے۔ ان سے ابن مبارک اور عیسیٰ بن یونس نے روایت کی ہے۔ ابن معین نے اسے معتبر کہا ہے۔ ترمذی اور نسائی نے اس کی تردید کی ہے اور النسائی نے بعد میں اسے مردود کہا ہے۔ الدارقطنی نے اسے ضعیف کہا۔ وفات 149ھ بطور مطبوعہ۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 13365}"
  tr: "El-Müthanna ibn el-Sebbe, Ebu Abdullah el-Yamani, o zamanlar el-Makki el-Abnavi, önde gelen bir hadis anlatıcısıydı. Mücahid, Tavus, İbn Abi Mulayka, Ata bin Ebi Rabah, Amr bin Dinar ve diğerlerinden rivayet etti. Ondan İbn el-Mübarek, İsa ibn Yunus ve diğerleri vardı. İbn Ma'in güvenilir olduğunu söyledi, el-Tirmidi ve el-Nasa'i ise güvenilir olmadığını söyledi. En-Nasai başka bir yerde hadisin terk edildiğini, el-Daraqutni ise zayıf olduğunu söyledi. (? - 149 Hj). {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.13365}"
  id: "Al-Muthanna ibn al-Sabbah, Abu Abdullah al-Yamani, kemudian al-Makki al-Abnawi, adalah seorang narator hadis terkemuka. Ia menceritakan dari Mujahid, Tawus, Ibn Abi Mulaykah, Ata ibn Abi Rabah, Amr ibn Dinar, dan lainnya. Dari dirinya adalah Ibn al-Mubarak, Isa ibn Yunus, dan lainnya. Ibn Ma'in mengatakan bahwa ia dapat dipercaya, dan al-Tirmidhi serta al-Nasa'i mengatakan ia tidak dapat dipercaya. An-Nasa'i mengatakan di tempat lain bahwa hadis telah ditinggalkan, dan al-Daraqutni mengatakan itu lemah. (? - 149 AH). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13365}"
