id: person/al-fadl-ibn-sahl
class: person
label: { ar: "الفضل بن سهل", en: "al-Fadl ibn Sahl" }
summary:
  ar: "رفع المأمون منزلته في سنة ست وتسعين ومائة، فعقد له على المشرق وسمّاه «ذا الرياستين» {cite:tabari-tarikh-abu-al-fadl j.8 p.424}. وكتب إليه طاهر بعد وقعة الري أطال الله بقاك وكبت أعداك كتابي إليك ورأس علي بن عيسى بين يدي وخاتمه في إصبعي {cite:muruj-al-dhahab p. 376}، وغلب على المأمون حتى ضايقه في جارية أراد شراءها فقتله وادعى قوم أن المأمون دس عليه من قتله {cite:muruj-al-dhahab p. 399}"
  en: "In 196 al-Ma'mun raised his rank, appointed him over the East and named him 'Dhu al-Riyasatayn' {cite:tabari-tarikh-abu-al-fadl j.8 p.424}. After the battle of al-Rayy, Tahir wrote to him: 'May God prolong your life and humble your enemies. My letter reaches you with the head of Ali ibn Isa before me and his ring on my finger' {cite:muruj-al-dhahab p. 376}. He gained such sway over al-Ma'mun that he pressed him over a slave-girl he wished to buy; then he was killed, and some claimed that al-Ma'mun had secretly sent someone to kill him {cite:muruj-al-dhahab p. 399}."
