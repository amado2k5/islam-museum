id: person/al-fadl-ibn-sahl
class: person
label: { ar: "الفضل بن سهل", en: "al-Fadl ibn Sahl", ur: "فضل بن سهل" }
summary:
  ar: "رفع المأمون منزلته في سنة ست وتسعين ومائة، فعقد له على المشرق وسمّاه «ذا الرياستين» {cite:tabari-tarikh-abu-al-fadl j.8 p.424}. وكتب إليه طاهر بعد وقعة الري أطال الله بقاك وكبت أعداك كتابي إليك ورأس علي بن عيسى بين يدي وخاتمه في إصبعي {cite:muruj-al-dhahab p. 376}، وغلب على المأمون حتى ضايقه في جارية أراد شراءها فقتله وادعى قوم أن المأمون دس عليه من قتله {cite:muruj-al-dhahab p. 399}. ويذكر ابن النديم في «الفهرست» أنه أنشأ قلماً اخترعه هو أحسن الأقلام يعرف بالرياسي ويتفرع إلى عدة أقلام {cite:fihrist-ibn-al-nadim p. 19}."
  en: "In 196 al-Ma'mun raised his rank, appointed him over the East and named him 'Dhu al-Riyasatayn' {cite:tabari-tarikh-abu-al-fadl j.8 p.424}. After the battle of al-Rayy, Tahir wrote to him: 'May God prolong your life and humble your enemies. My letter reaches you with the head of Ali ibn Isa before me and his ring on my finger' {cite:muruj-al-dhahab p. 376}. He gained such sway over al-Ma'mun that he pressed him over a slave-girl he wished to buy; then he was killed, and some claimed that al-Ma'mun had secretly sent someone to kill him {cite:muruj-al-dhahab p. 399}. Ibn al-Nadim records in the Fihrist that he created a pen he invented, the finest of pens, known as the Riyasi, branching into several pens {cite:fihrist-ibn-al-nadim p. 19}."
  ur: "196ھ میں مامون نے اس کا رتبہ بڑھایا، مشرق پر اسے مقرر کیا اور «ذو الرئاستین» کا لقب دیا {cite:tabari-tarikh-abu-al-fadl j.8 p.424}۔ ری کی جنگ کے بعد طاہر نے اسے لکھا: «اللہ تمہیں عمر دے اور دشمنوں کو پست کرے۔ میرا خط علی بن عیسیٰ کے سر کے سامنے اور اس کی انگوٹھی میری انگلی میں کے ساتھ تمہیں پہنچے» {cite:muruj-al-dhahab p. 376}۔ وہ مامون پر اس قدر غالب ہوا کہ اسے ایک جاریہ خریدنے پر تنگ کیا، پھر اسے قتل کر دیا گیا اور بعض نے کہا کہ مامون نے قاتل بھیجے {cite:muruj-al-dhahab p. 399}۔ ابن ندیم «الفہرست» میں لکھتا ہے کہ اس نے ایک قلم ایجاد کیا جو تمام اقلام میں بہترین تھا، «ریاسی» کے نام سے جانا جاتا تھا اور کئی اقلام میں شاخیں پھیلا {cite:fihrist-ibn-al-nadim p. 19}۔"
