id: person/al-fadl-ibn-sahl
class: person
label: { ar: "الفضل بن سهل", en: "al-Fadl ibn Sahl", fr: "Al-Fadl ibn Sahl", ur: "فضل بن سهل", es: "al-Fadl ibn Sahl" }
summary:
  ar: "رفع المأمون منزلته في سنة ست وتسعين ومائة، فعقد له على المشرق وسمّاه «ذا الرياستين» {cite:tabari-tarikh-abu-al-fadl j.8 p.424}. وكتب إليه طاهر بعد وقعة الري أطال الله بقاك وكبت أعداك كتابي إليك ورأس علي بن عيسى بين يدي وخاتمه في إصبعي {cite:muruj-al-dhahab p. 376}، وغلب على المأمون حتى ضايقه في جارية أراد شراءها فقتله وادعى قوم أن المأمون دس عليه من قتله {cite:muruj-al-dhahab p. 399}. ويذكر ابن النديم في «الفهرست» أنه أنشأ قلماً اخترعه هو أحسن الأقلام يعرف بالرياسي ويتفرع إلى عدة أقلام {cite:fihrist-ibn-al-nadim p. 19}."
  en: "In 196 al-Ma'mun raised his rank, appointed him over the East and named him 'Dhu al-Riyasatayn' {cite:tabari-tarikh-abu-al-fadl j.8 p.424}. After the battle of al-Rayy, Tahir wrote to him: 'May God prolong your life and humble your enemies. My letter reaches you with the head of Ali ibn Isa before me and his ring on my finger' {cite:muruj-al-dhahab p. 376}. He gained such sway over al-Ma'mun that he pressed him over a slave-girl he wished to buy; then he was killed, and some claimed that al-Ma'mun had secretly sent someone to kill him {cite:muruj-al-dhahab p. 399}. Ibn al-Nadim records in the Fihrist that he created a pen he invented, the finest of pens, known as the Riyasi, branching into several pens {cite:fihrist-ibn-al-nadim p. 19}."
  fr: "En 196 H, al-Ma’mun éleva son rang, le nomma à la tête de l’Orient et l’appela « Dhu al-Riyasatayn » {cite:tabari-tarikh-abu-al-fadl j.8 p.424}. Après la bataille d’al-Rayy, Tahir lui écrivit : « Que Dieu prolonge ta vie et humilie tes ennemis. Ma lettre te parvient avec la tête d’Ali ibn Isa devant moi et sa bague à mon doigt » {cite:muruj-al-dhahab p. 376}. Il acquit une telle emprise sur al-Ma’mun qu’il fit pression sur lui au sujet d’une esclave qu’il souhaitait acheter ; puis il fut tué, et certains prétendirent qu’al-Ma’mun avait secrètement envoyé quelqu’un le tuer {cite:muruj-al-dhahab p. 399}. Ibn al-Nadim consigne dans le Fihrist qu’il créa une écriture qu’il inventa, la plus belle des écritures, connue comme Riyasi, donnant naissance à plusieurs écritures {cite:fihrist-ibn-al-nadim p. 19}."
  ur: "196ھ میں مامون نے اس کا رتبہ بڑھایا، مشرق پر اسے مقرر کیا اور «ذو الرئاستین» کا لقب دیا {cite:tabari-tarikh-abu-al-fadl j.8 p.424}۔ ری کی جنگ کے بعد طاہر نے اسے لکھا: «اللہ تمہیں عمر دے اور دشمنوں کو پست کرے۔ میرا خط علی بن عیسیٰ کے سر کے سامنے اور اس کی انگوٹھی میری انگلی میں کے ساتھ تمہیں پہنچے» {cite:muruj-al-dhahab p. 376}۔ وہ مامون پر اس قدر غالب ہوا کہ اسے ایک جاریہ خریدنے پر تنگ کیا، پھر اسے قتل کر دیا گیا اور بعض نے کہا کہ مامون نے قاتل بھیجے {cite:muruj-al-dhahab p. 399}۔ ابن ندیم «الفہرست» میں لکھتا ہے کہ اس نے ایک قلم ایجاد کیا جو تمام اقلام میں بہترین تھا، «ریاسی» کے نام سے جانا جاتا تھا اور کئی اقلام میں شاخیں پھیلا {cite:fihrist-ibn-al-nadim p. 19}۔"
  es: "En 196, al-Ma'mun lo elevó de rango, lo nombró jefe del Este y lo denominó 'Dhu al-Riyasatayn' {cite:tabari-tarikh-abu-al-fadl j.8 p.424}. Después de la batalla de al-Rayy, Tahir le escribió: 'Que Dios prolongue tu vida y humille a tus enemigos. Mi carta te llega con la cabeza de Ali ibn Isa delante de mí y su anillo en mi dedo' {cite:muruj-al-dhahab p. 376}. Llegó a tener tal influencia sobre al-Ma'mun que lo presionó para que comprara a una esclava; entonces fue asesinado, y algunos afirmaron que al-Ma'mun había enviado secretamente a alguien para matarlo {cite:muruj-al-dhahab p. 399}. Ibn al-Nadim registra en el Fihrist que creó una pluma que él mismo inventó, la más fina de las plumas, conocida como Riyasi, de la cual se ramificaron varias plumas {cite:fihrist-ibn-al-nadim p. 19}."
  tr: "El-Ma'mun, Hicri 196 yılında onu Doğu valisi olarak atayarak statüsünü yükseltti ve ona \"Dhu al-Riyasatayn\" (İki Prensliğin Sahibi) adını verdi. {kaynak:tabari-tarikh-abu-al-fadl cilt 8, s. 424}. Rayy Muharebesi'nden sonra Tahir ona şöyle yazdı: \"Allah ömrünü uzatsın ve düşmanlarını alt etsin. Sana yazdığım mektup, elimde Ali ibn İsa'nın başı ve parmağımda yüzüğüyle birlikte.\" {kaynak:muruj-al-dhahab, s. 376}. El-Ma'mun üzerinde öyle bir etki kazandı ki, satın almak istediği bir cariye yüzünden ona sataştı ve bu yüzden onu öldürdü. Bazıları El-Ma'mun'un onu başka birine öldürttüğünü iddia eder. {kaynak:muruj-al-dhahab, s. 399}. İbn el-Nadim, \"el-Fihrist\" adlı eserinde, icat ettiği ve en ince kalemlerden biri olan el-Riyasi adlı kalemi yarattığını ve bunun çeşitli kalem türlerine ayrıldığını belirtir. {cite:fihrist-ibn-al-nadim s. 19}."
  id: "Al-Ma'mun mengangkat statusnya pada tahun 196 H, mengangkatnya sebagai gubernur Timur dan menyebutnya \"Dhu al-Riyasatayn\" (Pemilik Dua Kerajaan) {cite:tabari-tarikh-abu-al-fadl vol. 8 p.424}. Setelah Perang Rayy, Tahir menulis kepadanya, \"Semoga Allah memperpanjang umurmu dan menaklukkan musuh-musuhmu. Suratku kepadamu disertai kepala Ali bin Isa di tanganku dan cincinnya di jariku\" {cite:muruj-al-dhahab p. 376}. Ia memperoleh pengaruh yang begitu besar atas al-Ma'mun sehingga ia mengganggunya terkait seorang budak perempuan yang ingin dibelinya, sehingga al-Ma'mun membunuhnya. Beberapa orang mengklaim bahwa al-Ma'mun menyuruh orang lain untuk membunuhnya {cite:muruj-al-dhahab p. 399}. Ibn al-Nadim menyebutkan dalam \"al-Fihrist\" bahwa ia menciptakan pena yang ia ciptakan sendiri, pena terbaik, yang dikenal sebagai al-Riyasi, yang kemudian berkembang menjadi beberapa jenis pena {cite:fihrist-ibn-al-nadim p. 19}."
