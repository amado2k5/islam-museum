summary:
  ar: "أم هشام بنت حارثة بن النعمان الأنصارية، صحابية من أهل بيعة الرضوان، جارة النبي بالمدينة؛ يذكر غضنفر أنها كانت تطبخ له حين نزل عند أبي أيوب، وأنها حفظت سورة ق من فيه لكثرة ما كان يقرؤها في الجمع والأعياد، وروت عنها أختها عمرة وغيرها."
  en: "Umm Hisham bint Haritha ibn al-Nu'man al-Ansariyya, a Companion of the Pledge of Ridwan and neighbour of the Prophet in Medina. Ghadanfar says she cooked for him while he stayed with Abu Ayyub, learned Surat Qaf from his own recitation at Friday and Eid prayers, and that her sister Amra and others narrated from her."
