  ar: "أم هشام بنت حارثة"
  en: "Umm Hisham bint Haritha"
  ur: "ام ہشام بنت حارثہ"
  es: "Umm Hisham bint Haritha"
  fr: "Umm Hisham bint Haritha"
roles: [companion]
gender: female
summary:
  ar: "أم هشام بنت حارثة بن النعمان الأنصارية، صحابية من أهل بيعة الرضوان، جارة النبي بالمدينة؛ يذكر غضنفر أنها كانت تطبخ له حين نزل عند أبي أيوب، وأنها حفظت سورة ق من فيه لكثرة ما كان يقرؤها في الجمع والأعياد، وروت عنها أختها عمرة وغيرها."
  en: "Umm Hisham bint Haritha ibn al-Nu'man al-Ansariyya, a Companion of the Pledge of Ridwan and neighbour of the Prophet in Medina. Ghadanfar says she cooked for him while he stayed with Abu Ayyub, learned Surat Qaf from his own recitation at Friday and Eid prayers, and that her sister Amra and others narrated from her."
  ur: "ام ہشام بنت حارثہ بن نعمان الانصاریہ، بیعت رضوان کی صحابیہ اور مدینہ میں نبی کی ہمسائیہ۔"
  es: "Umm Hisham bint Haritha ibn al-Nu'man al-Ansariyya, compañera del Juramento de Ridwan y vecina del Profeta en Medina. Ghadanfar afirma que ella le cocinaba mientras él se hospedaba con Abu Ayyub, aprendió la Sura Qaf de su propia recitación en las oraciones del viernes y del Eid, y que su hermana Amra y otros narraron de ella."
  fr: "Umm Hisham bint Haritha ibn al-Nu'man al-Ansariyya, Compagne du Serment de Ridwan et voisine du Prophète à Médine, était, selon Ghadanfar, la cuisinière du Prophète pendant son séjour chez Abu Ayyub. Elle apprit la sourate Qaf en l'écoutant réciter lors des prières du vendredi et de l'Aïd, et sa sœur Amra, ainsi que d'autres personnes, rapportèrent ces récits d'elle."
  tr: "Ridvan yemininden bir sahabe ve Medine'de Peygamber'in komşusu olan um Hisham bint Haritha ibn al-Nu'man al-Ansariyyah; Ghadanfar, Ebu Eyyub'un yanında kaldığında onun için yemek pişirdiğini, Cuma namazı ve bayramlarda sık sık okuduğu şeylerden Kaf suresini ezberlediğini, kız kardeşi Umre ve diğerlerinin ondan rivayet ettiğini belirtir."
  id: "um Hisham bint Haritha ibn al-Nu'man al-Ansariyyah, sahabat dari janji Ridwan, dan tetangga Nabi di Madinah; Ghadanfar menyebutkan bahwa dia biasa memasak untuknya saat dia tinggal bersama Abu Ayyub, dan bahwa dia menghafal Surah Qaf dari apa yang sering dibacanya saat shalat dan perayaan Jumat, serta saudara perempuannya Umrah dan lainnya yang menceritakan darinya."
