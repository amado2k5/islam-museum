summary:
  ar: "أمية بن الصامت، العابد القانت، في المواطن ثابت، ولنفسه ماقت، ولشيطانه شامت. كان إذا نظر إلى غلام تألّم، وقال: لقد خفت أن لا أنجو من معرته ولا أخلص من إثمه، ولو وافيت القيامة بعمل سبعين صديقًا، واستغفر الله من بلاء جنته عيناه."
  en: "Umayya ibn al-Samit, a devout worshipper, steadfast in the stations, who held his own self in contempt and rejoiced that his Satan was defeated; Khayr al-Nassaj relates that when Umayya looked at a youth he was tried by the sight; he said that he feared he would not be saved from its harm nor cleared of its sin even if he came to the Resurrection with the deeds of seventy truthful ones, and he asked God's forgiveness for the trial his eyes had brought him, and wept until he nearly died."
  ur: "امیہ بن صامت عبادت گزار، مواقع میں ثابت قدم، اپنے نفس کو ملامت کرنے والے اور اپنے شیطان پر خوش ہونے والے تھے۔ خیر نساج نقل کرتے ہیں کہ جب امیہ نے ایک نوجوان کی طرف دیکھا تو اس نظر کو اپنے لیے آزمائش سمجھا؛ انہوں نے کہا کہ ڈر ہے کہ میں اس کے نقصان سے نہ بچ سکوں اور اس کے گناہ سے نہ نکل سکوں، اگرچہ قیامت میں سترّ صدیقوں کے عمل لے کر آؤں۔ انہوں نے اپنی آنکھوں کی آزمائش پر استغفار کیا اور روتے روتے قریب تھا کہ جان چلی جائے۔"
