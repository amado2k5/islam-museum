summary:
  ar: "بطريرك الإسكندرية في عهد هشام بن عبد الملك؛ يذكر الكتاب أنه دخل المدينة في احتفال مشهور تتقدمه الشموع والصلبان والأناجيل، وذلك ضمن أخبار أهل الكتاب في عهد هشام {cite:salabi-umayyad-state-2020 p.459}. لم يحدد الكتاب رقمه في سلسلة البطاركة."
  tr: "Hisham ibn Abd al-Malik döneminde İskenderiye Patriği; kitapta, Hisham'ın saltanatı sırasında Kitap Ahli raporlarının bir parçası olarak, mumlar, haçlar ve İncillerle birlikte şehre girdiği belirtilir {cite:salabi-umayyad-state-2020 s.459}. Kitapta ataerkil zincirdeki numarası belirtilmemiştir."
  id: "Patriark Alexandria pada masa pemerintahan Hisham ibn Abd al-Malik; buku tersebut menyebutkan bahwa ia memasuki kota dalam perayaan terkenal yang didahului oleh lilin, salib, dan injil, sebagai bagian dari laporan Umat Kitab selama masa pemerintahan Hisham {cite:salabi-umayyad-state-2020 hlm.459}. Buku ini tidak menyebutkan nomornya dalam rantai patriarkal."
