label: { ar: "أبو الحسين القدوري أحمد بن محمد", en: "Abu al-Husayn al-Quduri Ahmad ibn Muhammad", fr: "Abu al-Husayn al-Quduri Ahmad ibn Muhammad", es: "Abu al-Husayn al-Quduri Ahmad ibn Muhammad", ur: "ابو الحسین القدوری احمد بن محمد" }
summary:
  ar: "أبو الحسين أحمد بن محمد بن أحمد بن جعفر بن حمدان البغدادي القدوري، الفقيه شيخ الحنفية بالعراق، انتهت إليه رياسة المذهب وعظم جاهه وبعد صيته، وكان حسن العبارة في النظم؛ صنف في المذهب المختصر المشهور وغيره، وكان يناظر الشيخ أبا حامد الإسفراييني الفقيه الشافعي ويبالغ في تعظيمه؛ وكانت ولادته سنة اثنتين وستين وثلاثمائة، وتوفي ببغداد ودُفن من يومه بداره في درب أبي خلف ثم نُقل إلى تربة في شارع المنصور فدُفن بجانب أبي بكر الخوارزمي الفقيه الحنفي {cite:shadharat-dhahab p. 233-234}."
  en: "Abu al-Husayn Ahmad b. Muhammad al-Quduri of Baghdad — head of Iraq's Hanafis and author of the celebrated Mukhtasar; a gifted prose-writer who debated Abu Hamid al-Isfarayini yet magnified him beyond measure. Born 362, he died on Sunday 5 Rajab 428 and was buried beside Abu Bakr al-Khwarizmi the Hanafi {cite:shadharat-dhahab p. 233-234}."
  fr: "Abu al-Husayn Ahmad b. Muhammad al-Quduri de Bagdad – chef des Hanafis irakiens et auteur du célèbre Mukhtasar ; un prose-écrivain doué qui a débattu Abu Hamid al-Isfarayini mais l'a magnifié au-delà de toute mesure. Né en 362, il est mort dimanche 5 Rajab 428 et a été enterré à côté d'Abou Bakr al-Khwarizmi le Hanafite {cite:shadharat-dhahab p. 233-234}."
  es: "Abu al-Husayn Ahmad b. Muhammad al-Quduri de Bagdad, líder de los hanafíes iraquíes y autor del célebre Mukhtasar, fue un prosista de gran talento que debatió con Abu Hamid al-Isfarayini, a quien engrandeció enormemente. Nació en 362 y falleció el domingo 5 de Rajab de 428. Fue enterrado junto a Abu Bakr al-Khwarizmi, el hanafí (cita: shadharat-dhahab, págs. 233-234)."
  ur: "ابو الحسین احمد ب۔ بغداد کے محمد القدوری - عراق کے حنفیوں کے سربراہ اور مشہور مختار کے مصنف؛ ایک باصلاحیت نثر نگار جس نے ابو حامد الاسفارائنی پر بحث کی لیکن اس کے باوجود اس کی تعریف حد سے زیادہ کی۔ 362 میں پیدا ہوئے، آپ کی وفات 5 رجب 428 بروز اتوار کو ہوئی اور ابو بکر الخوارزمی حنفی کے پاس دفن ہوئے۔ 233-234}۔"
