label: { ar: "أبو الحسين القدوري أحمد بن محمد" }
summary:
  ar: "أبو الحسين أحمد بن محمد بن أحمد بن جعفر بن حمدان البغدادي القدوري، الفقيه شيخ الحنفية بالعراق، انتهت إليه رياسة المذهب وعظم جاهه وبعد صيته، وكان حسن العبارة في النظم؛ صنف في المذهب المختصر المشهور وغيره، وكان يناظر الشيخ أبا حامد الإسفراييني الفقيه الشافعي ويبالغ في تعظيمه؛ وكانت ولادته سنة اثنتين وستين وثلاثمائة، وتوفي ببغداد ودُفن من يومه بداره في درب أبي خلف ثم نُقل إلى تربة في شارع المنصور فدُفن بجانب أبي بكر الخوارزمي الفقيه الحنفي {cite:shadharat-dhahab p. 233-234}."
  en: "Abu al-Husayn Ahmad b. Muhammad al-Quduri of Baghdad — head of Iraq's Hanafis and author of the celebrated Mukhtasar; a gifted prose-writer who debated Abu Hamid al-Isfarayini yet magnified him beyond measure. Born 362, he died on Sunday 5 Rajab 428 and was buried beside Abu Bakr al-Khwarizmi the Hanafi {cite:shadharat-dhahab p. 233-234}."
