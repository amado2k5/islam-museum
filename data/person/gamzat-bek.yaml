summary:
  ar: "غمزت بك (حمزة بك) بن إسكندر بك (1789–1834)، ثاني أئمة داغستان (1832–1834) وخليفة غازي محمد؛ قائد آواري من أسرة نبيلة قاد قوات الإمام الأول، فلما قُتل غازي محمد في غيمري انتُخب إماما، فأخضع معظم الهضبة الآوارية واستولى على خونزاخ عاصمة خانات الآفار وأباد أسرتها الحاكمة، ثم اغتاله في مسجد خونزاخ في 19 سبتمبر (1 أكتوبر) 1834 حاجي عثمان، أخو حاجي مراد، ثأرا للأسرة."
  en: "Gamzat-bek (Hamzat Bek) ibn Iskandar-Bek (1789–1834) was the second Imam of Dagestan (1832–1834) and the successor of Ghazi Muhammad. An Avar commander of noble birth who had led the first imam's forces, he was proclaimed imam on Ghazi Muhammad's death at Gimry, subjugated most of the Avar plateau and captured Khunzakh, capital of the Avar Khanate, destroying its ruling family; he was assassinated in the Khunzakh mosque on 19 September (1 October) 1834 by Hajji Uthman, brother of Hajji Murad, in revenge for the family."
  ur: "غمزت بیک (حمزہ بیک) بن اسکندر بیک (1789–1834) داغستان کے دوسرے امام (1832–1834) اور غازی محمد کے جانشین تھے۔ آوار اشرافیہ سے تعلق رکھنے والے اس سپہ سالار نے پہلے امام کی فوجوں کی قیادت کی؛ غازی محمد کی گمری میں شہادت پر وہ امام منتخب ہوئے، بیشتر آوار سطح مرتفع کو مطیع کیا اور آوار خانات کے دارالحکومت خونزاخ پر قبضہ کر کے اس کے حکمران خاندان کو ختم کر دیا؛ 19 ستمبر (1 اکتوبر) 1834 کو خونزاخ کی مسجد میں حاجی مراد کے بھائی حاجی عثمان نے خاندان کے انتقام میں انہیں قتل کر دیا۔"
