id: person/al-hasan-ibn-ali-zirid
class: person
label: { ar: "الحسن بن علي آخر ملوك آل باديس" }
summary:
  ar: "آخر سلاطين آل باديس بالمهدية؛ ولي وهو غلام ابن اثنتي عشرة سنة وقام بأمره مولاه صندل ثم مولاه موفق، ولما استولى النصارى على المهدية لحق بالعرب من رياح فلم يجد لديهم مصرخاً ثم أجاز إلى بونة والجزائر حتى فتح الموحدون الجزائر سنة 547هـ فخرج إلى عبد المؤمن فلقاه تكرمة وقبولاً وصحبه في غزواته، ولما افتتح عبد المؤمن المهدية سنة 555هـ أسكنه بها وأقطعه رحيش فأقام ثماني سنين ثم هلك في طريقه إلى مراكش سنة 566هـ {cite:tarikh-ibn-khaldun-ibar p. 1636}."
  en: "Last Zirid sultan of Mahdiyya, enthroned a boy of twelve under his freedmen Sandal and Muwaffaq; after the Norman capture he fled to the Arabs then to the Almohads, and Abd al-Mu'min restored him in Mahdiyya 555 until he died en route to Marrakesh {cite:tarikh-ibn-khaldun-ibar p. 1636}."
