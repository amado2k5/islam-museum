id: person/al-hasan-ibn-ali-zirid
class: person
label: { ar: "الحسن بن علي آخر ملوك آل باديس", en: "al-Hasan ibn Ali, last of the Banu Badis", es: "al-Hasan ibn Ali, last of the Banu Badis", fr: "al-Hasan ibn Ali, last of the Banu Badis", ur: "حسن بن علی، بنو بدیس کے آخری" }
summary:
  ar: "آخر سلاطين آل باديس بالمهدية؛ ولي وهو غلام ابن اثنتي عشرة سنة وقام بأمره مولاه صندل ثم مولاه موفق، ولما استولى النصارى على المهدية لحق بالعرب من رياح فلم يجد لديهم مصرخاً ثم أجاز إلى بونة والجزائر حتى فتح الموحدون الجزائر سنة 547هـ فخرج إلى عبد المؤمن فلقاه تكرمة وقبولاً وصحبه في غزواته، ولما افتتح عبد المؤمن المهدية سنة 555هـ أسكنه بها وأقطعه رحيش فأقام ثماني سنين ثم هلك في طريقه إلى مراكش سنة 566هـ {cite:tarikh-ibn-khaldun-ibar p. 1636}."
  en: "Last Zirid sultan of Mahdiyya, enthroned a boy of twelve under his freedmen Sandal and Muwaffaq; after the Norman capture he fled to the Arabs then to the Almohads, and Abd al-Mu'min restored him in Mahdiyya 555 until he died en route to Marrakesh {cite:tarikh-ibn-khaldun-ibar p. 1636}."
  es: "El último sultán zirí de Mahdiyya entronizó a un niño de doce años bajo el mando de sus libertos Sandal y Muwaffaq; tras la captura normanda, huyó a los árabes y luego a los almohades, y Abd al-Mu'min lo restituyó en Mahdiyya en el año 555 hasta que murió de camino a Marrakech {cite:tarikh-ibn-khaldun-ibar p. 1636}."
  fr: "Dernier sultan ziride de la Mahdiyya, intronisé à l'âge de douze ans sous ses affranchis Sandal et Muwaffaq; après la capture normande, il s'enfuit chez les Arabes puis chez les Almohades, et Abd al-Mu'min le rétablit en 555 Mahdiyya jusqu'à sa mort en route vers Marrakech {cite:tarikh-ibn-khaldun-ibar p. 1636}."
  ur: "مہدیہ کے آخری زرد سلطان نے اپنے آزاد کردہ صندل اور موفق کے تحت بارہ سال کے ایک لڑکے کو تخت نشین کیا۔ نارمن کی گرفتاری کے بعد وہ عربوں کی طرف بھاگا پھر المحدث کی طرف، اور عبدالمومن نے اسے مہدیہ 555 میں بحال کیا یہاں تک کہ وہ مراکیش جاتے ہوئے مر گیا۔ 1636}۔"
  tr: "Badis ailesinin Mahdia'daki son sultanı, ustası Sandal tarafından atanan on iki yaşında bir çocuktu, ardından müvekkili Muwaffaq olarak atandı. Hristiyanlar Mahdia'yı ele geçirdiğinde, rüzgarla Araplara katıldı ancak onlardan sığınak bulamadı. Daha sonra Bouna ve Cezayir'e izin verdi, ta ki Almohadlar 547 Hicri'de Cezayir'i fethedene kadar. Abd al-Mu'min'e gitti; Abd al-Mu'min, seferleri sırasında onur, kabul ve dostlukla karşılandı. Abd al-Mu'min 555 Hicri'de Mahdia'yı fethettiğinde oraya yerleşti ve burayı çorak bir bölgeye böldü; burada sekiz yıl kaldıktan sonra 566 Hicri'de Marakeş'e giderken hayatını kaybetti {cite:Tarikh-ibn-khaldun-ibar s. 1636}."
  id: "Sultan terakhir keluarga Badis di Mahdia adalah seorang anak laki-laki berusia dua belas tahun yang diangkat oleh tuannya Sandal, yang kemudian menjadi kliennya Muwaffaq. Ketika orang Kristen menguasai Mahdia, ia bergabung dengan bangsa Arab melalui angin tetapi tidak menemukan perlindungan dari mereka. Ia kemudian memberikan izin kepada Bouna dan Algiers hingga Almohad menaklukkan Aljazair pada tahun 547 H. Ia pergi menemui Abd al-Mu'min, yang menyambutnya dengan kehormatan, penerimaan, dan persahabatan selama kampanyenya. Ketika Abd al-Mu'min menaklukkan Mahdia pada tahun 555 H, ia menetap di sana dan membaginya menjadi daerah tandus, di mana ia tinggal selama delapan tahun sebelum meninggal dalam perjalanan ke Marrakesh pada tahun 566 H. {cite:Tarikh-ibn-khaldun-ibar hlm. 1636}."
