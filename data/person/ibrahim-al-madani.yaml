  ar: "مؤذن ومدرّس سعودي (1974–2026) من المدينة المنورة، حمل إجازة جامعية في الدراسات القرآنية، وعُيّن مؤذنًا في المسجد الحرام في مايو 2018 فاشتهر بأذان الفجر والتكبيرات والتبليغ، وتوفي في 21 سبتمبر 2026 ودُفن في المعلاة."
  en: "Saudi muezzin and teacher (1974–2026) from Medina with a university degree in Qur'anic studies, appointed a muezzin of the Masjid al-Haram in May 2018 and known for the dawn adhan, the takbirat and relaying the imam's calls; he died on 21 September 2026 and was buried at al-Ma'la."
  ur: "مدینہ کے سعودی مؤذن اور استاد ⁦(1974ء–2026ء)⁩، علومِ قرآن میں یونیورسٹی کی سند رکھتے تھے، مئی 2018ء میں مسجد حرام کے مؤذن مقرر ہوئے اور فجر کی اذان، تکبیرات اور تبلیغ کے لیے معروف ہوئے؛ 21 ستمبر 2026ء کو فوت ہوئے اور جنت المعلیٰ میں دفن ہوئے۔"
