summary:
  ar: "مؤذن ومدرّس سعودي (1974–2026) من المدينة المنورة، حمل إجازة جامعية في الدراسات القرآنية، وعُيّن مؤذنًا في المسجد الحرام في مايو 2018 فاشتهر بأذان الفجر والتكبيرات والتبليغ، وتوفي في 21 سبتمبر 2026 ودُفن في المعلاة."
  en: "Saudi muezzin and teacher (1974–2026) from Medina with a university degree in Qur'anic studies, appointed a muezzin of the Masjid al-Haram in May 2018 and known for the dawn adhan, the takbirat and relaying the imam's calls; he died on 21 September 2026 and was buried at al-Ma'la."
  ur: "مدینہ کے سعودی مؤذن اور استاد ⁦(1974ء–2026ء)⁩، علومِ قرآن میں یونیورسٹی کی سند رکھتے تھے، مئی 2018ء میں مسجد حرام کے مؤذن مقرر ہوئے اور فجر کی اذان، تکبیرات اور تبلیغ کے لیے معروف ہوئے؛ 21 ستمبر 2026ء کو فوت ہوئے اور جنت المعلیٰ میں دفن ہوئے۔"
  es: "Muecín y maestro saudí (1974-2026) originario de Medina, licenciado en estudios coránicos, fue nombrado muecín de la Mezquita Sagrada (Masjid al-Haram) en mayo de 2018 y conocido por el adhan del amanecer, el takbirat y por transmitir las llamadas del imán; falleció el 21 de septiembre de 2026 y fue enterrado en al-Ma'la."
  fr: "Muezzin et enseignant saoudien (1974-2026) originaire de Médine, titulaire d'un diplôme universitaire en études coraniques, nommé muezzin de la Masjid al-Haram en mai 2018 et connu pour l'adhan de l'aube, les takbirat et la transmission des appels de l'imam; il est décédé le 21 septembre 2026 et a été enterré à al-Ma'la."
  tr: "Medine'den Suudi müezzini ve öğretmen (1974–2026) olan Swe, Kur'an çalışmaları alanında üniversite diploması aldı ve Mayıs 2018'de Mescid-Camii'de müezzin olarak atandı. Fecr ezanı, tekbirler ve vaazlarıyla ünlendi. 21 Eylül 2026'da vefat etti ve El-Ma'la'da defnedildi."
  id: "Seorang muezin Saudi dan guru (1974–2026) dari Madinah, ia meraih gelar universitas dalam studi Al-Qur'an dan diangkat sebagai muizin di Masjid Agung pada Mei 2018. Ia menjadi terkenal karena panggilan doa Fajr, takbir, dan dakwah. Ia meninggal dunia pada 21 September 2026 dan dimakamkan di Al-Ma'la."
