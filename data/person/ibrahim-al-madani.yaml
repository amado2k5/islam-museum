summary:
  ar: "\u0645\u0624\u0630\u0646 \u0648\u0645\u062f\u0631\u0651\u0633 \u0633\u0639\u0648\u062f\u064a (1974\u20132026) \u0645\u0646 \u0627\u0644\u0645\u062f\u064a\u0646\u0629 \u0627\u0644\u0645\u0646\u0648\u0631\u0629\u060c \u062d\u0645\u0644 \u0625\u062c\u0627\u0632\u0629 \u062c\u0627\u0645\u0639\u064a\u0629 \u0641\u064a \u0627\u0644\u062f\u0631\u0627\u0633\u0627\u062a \u0627\u0644\u0642\u0631\u0622\u0646\u064a\u0629\u060c \u0648\u0639\u064f\u064a\u0651\u0646 \u0645\u0624\u0630\u0646\u064b\u0627 \u0641\u064a \u0627\u0644\u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0631\u0627\u0645 \u0641\u064a \u0645\u0627\u064a\u0648 2018 \u0641\u0627\u0634\u062a\u0647\u0631 \u0628\u0623\u0630\u0627\u0646 \u0627\u0644\u0641\u062c\u0631 \u0648\u0627\u0644\u062a\u0643\u0628\u064a\u0631\u0627\u062a \u0648\u0627\u0644\u062a\u0628\u0644\u064a\u063a\u060c \u0648\u062a\u0648\u0641\u064a \u0641\u064a 21 \u0633\u0628\u062a\u0645\u0628\u0631 2026 \u0648\u062f\u064f\u0641\u0646 \u0641\u064a \u0627\u0644\u0645\u0639\u0644\u0627\u0629."
  en: "Saudi muezzin and teacher (1974\u20132026) from Medina with a university degree in Qur'anic studies, appointed a muezzin of the Masjid al-Haram in May 2018 and known for the dawn adhan, the takbirat and relaying the imam's calls; he died on 21 September 2026 and was buried at al-Ma'la."
  ur: "\u0645\u062f\u06cc\u0646\u06c1 \u06a9\u06d2 \u0633\u0639\u0648\u062f\u06cc \u0645\u0624\u0630\u0646 \u0627\u0648\u0631 \u0627\u0633\u062a\u0627\u062f \u2066(1974\u0621\u20132026\u0621)\u2069\u060c \u0639\u0644\u0648\u0645\u0650 \u0642\u0631\u0622\u0646 \u0645\u06cc\u06ba \u06cc\u0648\u0646\u06cc\u0648\u0631\u0633\u0679\u06cc \u06a9\u06cc \u0633\u0646\u062f \u0631\u06a9\u06be\u062a\u06d2 \u062a\u06be\u06d2\u060c \u0645\u0626\u06cc 2018\u0621 \u0645\u06cc\u06ba \u0645\u0633\u062c\u062f \u062d\u0631\u0627\u0645 \u06a9\u06d2 \u0645\u0624\u0630\u0646 \u0645\u0642\u0631\u0631 \u06c1\u0648\u0626\u06d2 \u0627\u0648\u0631 \u0641\u062c\u0631 \u06a9\u06cc \u0627\u0630\u0627\u0646\u060c \u062a\u06a9\u0628\u06cc\u0631\u0627\u062a \u0627\u0648\u0631 \u062a\u0628\u0644\u06cc\u063a \u06a9\u06d2 \u0644\u06cc\u06d2 \u0645\u0639\u0631\u0648\u0641 \u06c1\u0648\u0626\u06d2\u061b 21 \u0633\u062a\u0645\u0628\u0631 2026\u0621 \u06a9\u0648 \u0641\u0648\u062a \u06c1\u0648\u0626\u06d2 \u0627\u0648\u0631 \u062c\u0646\u062a \u0627\u0644\u0645\u0639\u0644\u06cc\u0670 \u0645\u06cc\u06ba \u062f\u0641\u0646 \u06c1\u0648\u0626\u06d2\u06d4"
