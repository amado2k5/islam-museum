summary:
  ar: "سلطان مصر والشام ومؤسس الدولة الأيوبية، وُلد بتكريت سنة 1137 أو 1138م وتوفي بدمشق في 4 مارس 1193م. صار وزيرًا لمصر سنة 1169م، وأنهى الخلافة الفاطمية سنة 1171م، ووحّد الشام والجزيرة وفلسطين ومصر بين 1174 و1186م، واسترد بيت المقدس في 2 أكتوبر 1187م. {cite:britannica-saladin}"
  en: "Sultan of Egypt and Syria and founder of the Ayyubid dynasty, born at Tikrit in 1137 or 1138 and died at Damascus on 4 March 1193. He became vizier of Egypt in 1169, ended the Fatimid caliphate in 1171, united Syria, northern Mesopotamia, Palestine and Egypt between 1174 and 1186, and recovered Jerusalem on 2 October 1187. {cite:britannica-saladin}"
  ur: "مصر و شام کے سلطان اور ایوبی خاندان کے بانی، جو 1137 یا 1138ء میں تکریت میں پیدا ہوئے اور 4 مارچ 1193ء کو دمشق میں وفات پائی۔ وہ 1169ء میں مصر کے وزیر بنے، 1171ء میں فاطمی خلافت ختم کی، 1174 سے 1186ء تک شام، شمالی عراق، فلسطین اور مصر کو متحد کیا، اور 2 اکتوبر 1187ء کو بیت المقدس واپس لیا۔ {cite:britannica-saladin}"
  es: "Sultán de Egipto y Siria y fundador de la dinastía ayubí, nació en Tikrit en 1137 o 1138 y murió en Damasco el 4 de marzo de 1193. Se convirtió en visir de Egipto en 1169, puso fin al califato fatimí en 1171, unificó Siria, el norte de Mesopotamia, Palestina y Egipto entre 1174 y 1186, y recuperó Jerusalén el 2 de octubre de 1187. {cite:britannica-saladin}"
  fr: "Sultan d'Égypte et de Syrie et fondateur de la dynastie ayyoubide, né à Tikrit en 1137 ou 1138 et mort à Damas le 4 mars 1193. Il devint vizir d'Égypte en 1169, mit fin au califat fatimide en 1171, unifia la Syrie, le nord de la Mésopotamie, la Palestine et l'Égypte entre 1174 et 1186, et reconquit Jérusalem le 2 octobre 1187."
  tr: "Mısır ve Şam Sultanı ve Eyyubi devletinin kurucusu olan Eyübi devletinin kurucusu, 1137 veya 1138 yılında Tikrit'te doğdu ve 4 Mart 1193'te Şam'da öldü. 1169'da Mısır veziri oldu, 1171'de Fatımi Halifeliği'ni sona erdirdi, 1174 ile 1186 yılları arasında Levant, Cazira, Filistin ve Mısır'ı birleştirdi ve 2 Ekim 1187'de Kudüs'ü geri aldı. {kaynak:britannica-saladin}"
  id: "Sultan Mesir dan Levant serta pendiri negara Ayyubid, lahir di Tikrit pada tahun 1137 atau 1138 M dan meninggal di Damaskus pada 4 Maret 1193 M. Ia menjadi wazir Mesir pada tahun 1169 M, mengakhiri Khalifah Fatimiyah pada tahun 1171 M, menyatukan Levant, Jazira, Palestina, dan Mesir antara tahun 1174 dan 1186 M, serta merebut kembali Yerusalem pada 2 Oktober 1187 M. {cite:britannica-saladin}"
born: { edtf: "1137/1138", hijri: "0532~", calendar: julian, precision: year, status: historical, derived: true, sources: [source/britannica-saladin], note: "Britannica gives 1137/38 at Tikrit; the Hijri year is converted, so it is derived." }
