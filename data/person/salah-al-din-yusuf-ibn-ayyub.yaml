summary:
  ar: "سلطان مصر والشام ومؤسس الدولة الأيوبية، وُلد بتكريت سنة 1137 أو 1138م وتوفي بدمشق في 4 مارس 1193م. صار وزيرًا لمصر سنة 1169م، وأنهى الخلافة الفاطمية سنة 1171م، ووحّد الشام والجزيرة وفلسطين ومصر بين 1174 و1186م، واسترد بيت المقدس في 2 أكتوبر 1187م. {cite:britannica-saladin}"
  en: "Sultan of Egypt and Syria and founder of the Ayyubid dynasty, born at Tikrit in 1137 or 1138 and died at Damascus on 4 March 1193. He became vizier of Egypt in 1169, ended the Fatimid caliphate in 1171, united Syria, northern Mesopotamia, Palestine and Egypt between 1174 and 1186, and recovered Jerusalem on 2 October 1187. {cite:britannica-saladin}"
  ur: "مصر و شام کے سلطان اور ایوبی خاندان کے بانی، جو 1137 یا 1138ء میں تکریت میں پیدا ہوئے اور 4 مارچ 1193ء کو دمشق میں وفات پائی۔ وہ 1169ء میں مصر کے وزیر بنے، 1171ء میں فاطمی خلافت ختم کی، 1174 سے 1186ء تک شام، شمالی عراق، فلسطین اور مصر کو متحد کیا، اور 2 اکتوبر 1187ء کو بیت المقدس واپس لیا۔ {cite:britannica-saladin}"
