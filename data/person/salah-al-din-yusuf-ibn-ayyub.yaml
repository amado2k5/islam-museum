id: person/salah-al-din-yusuf-ibn-ayyub
class: person
label: { ar: "صلاح الدين يوسف بن أيوب الملك الناصر" }
summary:
  ar: "ابن أخ أسد الدين شيركوه، أخذ الإسكندرية في بعثة سنة اثنتين وستين وحاصره الفرنج أربعة شهر، ثم ولي وزارة مصر بعد عمه سنة أربع وستين ولقبه العاضد الملك الناصر فقام بالسلطنة أتم قيام، وقطع الخطبة العبيدية بمصر سنة سبع وأقام الخطبة للمستضيء بعد أن ابتدأ بها الأمير العالم الأعجمي، وتسلم القصر بذخائره فاستمر البيع فيه عشر سنين، وصلب أهل مؤامرة إعادة الدعوة سنة تسع وستين، وأمر ببناء السور الأعظم المحيط بمصر والقاهرة سنة اثنتين وسبعين وقلعة جبل المقطم وبنى تربة الإمام الشافعي {cite:tarikh-khulafa-minhaj-1434 p. 679-685}، وفي سنة ثلاث وثمانين أخذ كثيراً من البلاد الشامية التي كانت بيد الفرنج وأعظمها بيت المقدس بعد إحدى وتسعين سنة فأزال ما أحدثوا من الآثار وبنى مدرسة للشافعية ولم يهدم القمامة اقتداء بعمر، ولما تولى الناصر بعث إليه بالخلع والتقليد فكتب إليه والخادم ولله الحمد يعدد سوابق في الإسلام والدولة العباسية لا يعدها أولية أبي مسلم لأنه والى ثم وارى ولا آخرية طغرلبك لأنه نصر ثم حجر، ومات سنة تسع وثمانين فلم يخلف من المال سوى دينار واحد وستة وثلاثين درهماً {cite:tarikh-khulafa-minhaj-1434 p. 690-693}."
  en: "Shirkuh's nephew, who held Alexandria four months in 562, took Egypt's vizierate as al-Malik al-Nasir in 564, ended the Ubaydid khutba in Muharram 567 after the Ajami al-Amir al-Alim led it, sold the palace treasures over ten years, crucified the restoration plotters of 569, and ordered Cairo's great wall, the Muqattam citadel and al-Shafi'i's turba {cite:tarikh-khulafa-minhaj-1434 p. 679-685}."
