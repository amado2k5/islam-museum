summary:
  ar: "صوفي نقشبندي من وادي نيلم، اتخذ مقامه في كيان شريف قرب أثمقام، وأخذ البيعة عن بير صديق مير، وانتشر أتباعه و خلفاؤه في كشمير؛ وما زال عرسه السنوي يقام في بابا نغري بوانغت حيث يقيم خلفاؤه من آل لارفي."
  en: "Naqshbandi Sufi of the Neelam Valley who made his seat at Kiyan Sharif near Athmuqam, took initiation from Pir Siddiq Mir, and spread a circle of khalifas across Kashmir; his annual urs is still kept at Baba Nagri, Wangat, by the Larvi family who descend from his khalifas."
  ur: "وادی نیلم کے نقشبندی صوفی بزرگ، جن کا آستانہ کیاں شریف (اتھمقام کے قریب) تھا؛ انھوں نے پیر صدیق میر سے بیعت حاصل کی اور کشمیر بھر میں خلفاء کا سلسلہ پھیلایا؛ ان کا سالانہ عرس آج بھی بابا نگری وانگت میں آلِ لاروی کے اہتمام سے منایا جاتا ہے۔"
