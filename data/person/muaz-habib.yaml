summary:
  ar: "منشد إثيوبي يؤدي المنظومة والنشيدة بالأمهرية، وله أعمال بالصومالية أيضًا؛ قناته الرسمية على يوتيوب (@MuazHabibofficial) بلغت 608 آلاف مشترك في نوفمبر 2026، وبعض مقاطعه تجاوزت عشرة ملايين مشاهدة، وهو أبرز وجه في النشيد الإثيوبي المعاصر على المنصات."
  en: "An Ethiopian vocal artist who performs menzuma and neshida (Islamic devotional song) in Amharic, with works in Somali as well; his official YouTube channel (@MuazHabibofficial) reached 608,000 subscribers in November 2026 and several of his videos have passed ten million views, making him the leading figure of contemporary Ethiopian neshida on the platforms."
  ur: "معاذ حبیب ایتھوپیا کے منشد ہیں جو امہری زبان میں منظومہ اور نشید پیش کرتے ہیں اور صومالی میں بھی ان کے کام موجود ہیں؛ ان کے سرکاری یوٹیوب چینل (@MuazHabibofficial) کے سبسکرائبر نومبر 2026ء میں 608 ہزار تک پہنچے اور ان کی کئی ویڈیوز ایک کروڑ سے زائد بار دیکھی گئیں۔"
  es: "Artista vocal etíope que interpreta menzuma y neshida (canciones devocionales islámicas) en amárico, con obras también en somalí; su canal oficial de YouTube (@MuazHabibofficial) alcanzó los 608.000 suscriptores en noviembre de 2026 y varios de sus vídeos han superado los diez millones de visualizaciones, lo que lo convierte en la figura principal de la neshida etíope contemporánea en las plataformas."
  fr: "Un artiste vocal éthiopien qui interprète des menzuma et des neshida (chants dévotionnels islamiques) en amharique, avec des œuvres également en somali; sa chaîne YouTube officielle (@MuazHabibofficial) a atteint 608 000 abonnés en novembre 2026 et plusieurs de ses vidéos ont dépassé les dix millions de vues, faisant de lui la figure de proue de la neshida éthiopienne contemporaine sur les plateformes."
  tr: "Etiyopyalı bir şarkıcı olarak şiir ve marşı Amharca seslendiriyor, ayrıca Somali'de de eserleri var; resmi YouTube kanalı (@MuazHabibofficial) Kasım 2026'da 608.000 aboneye ulaştı ve bazı klipleri on milyonu aştı. Çağdaş Etiyopya marşının platformlarda en önde gelen figürüdür."
  id: "Seorang penyanyi Ethiopia yang membawakan puisi dan lagu kebangsaan dalam bahasa Amharik, dan ia juga memiliki karya di Somalia; saluran YouTube resminya (@MuazHabibofficial) mencapai 608.000 pelanggan pada November 2026, dan beberapa klipnya telah melampaui sepuluh juta penayangan. Ia adalah tokoh paling menonjol dalam lagu kebangsaan Ethiopia kontemporer di platform."
