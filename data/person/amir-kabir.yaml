summary:
  ar: "ميرزا تقي خان فراهاني (9 يناير 1807 – 10 يناير 1852)، المعروف بأمير كبير، الوزير الأول لناصر الدين شاه من 1848 إلى 1851 وأبرز مصلحي إيران القاجارية. ابن طبّاخ في دار أحد الوزراء، ارتقى حتى أعاد ترتيب مالية الدولة وجيشها وإدارتها، فأسس مدرسة دار الفنون وجريدة «وقايع اتفاقيه»؛ ثم عُزل ونُفي إلى كاشان وقُتل في حمام فين بأمر الشاه."
  en: "Mirza Taghi Khan-e Farahani (9 January 1807 – 10 January 1852), known as Amir Kabir, chief minister of Naser al-Din Shah from 1848 to 1851 and the outstanding reformer of Qajar Iran. The son of a cook in a ministerial household, he rose to reorder the state's finances, army and administration, founding the Dar ol-Fonun college and the newspaper Vaqaye'-ye Ettefaqiyeh; dismissed and exiled to Kashan, he was murdered in the Fin Garden on the Shah's order."
  ur: "میرزا تقی خان فراہانی (9 جنوری 1807 تا 10 جنوری 1852)، جو امیر کبیر کے نام سے مشہور ہیں، 1848 سے 1851 تک ناصر الدین شاہ کے وزیرِ اعظم اور قاجاری ایران کے ممتاز ترین مصلح تھے۔ ایک وزیری گھرانے کے باورچی کے بیٹے نے ترقی کر کے ریاست کی مالیات، فوج اور انتظامیہ کو ازسرِ نو منظم کیا، دار الفنون کالج اور اخبار «وقایعِ اتفاقیہ» کی بنیاد رکھی؛ پھر معزول ہو کر کاشان جلا وطن ہوئے اور شاہ کے حکم پر باغِ فین میں قتل کر دیے گئے۔"
