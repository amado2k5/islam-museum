summary:
  ar: "ابن أبي الدنيا واسمه عبيد الله بن محمد بن عبيد ويكنى أبا بكر وكان قرشيا من ولاء وكان يؤدب المكتفي بالله وكان ورعا زاهدا عالما بالأخبار والروايات وتوفي يوم الثلاثاء لأربع عشرة ليلة خلت من جمادى الآخرة سنة إحدى وثمانين ومائتين وله كتاب مكايد الشيطان وكتاب الحلم وكتاب فقه النبي وكتاب ذم الملاهي وكتاب ذم الفحش وكتاب العفو وكتاب ذم المسكر وكتاب التوكيد وكتاب فضل شهر رمضان وكتاب صدقة الفطر وكتاب تزويج فاطمة وكتاب القراءة وكتاب الأصوات وكتاب الأمر بالمعروف والنهي عن المنكر وكتاب الهم والحزن والكمد وكتاب الإخلاص والنية وكتاب الطواعين وكتاب الصبر وآداب اللسان وكتاب الرغائب وكتاب أخبار قريش وكتاب ذم الدنيا وكتاب صفة الميزان وكتاب صفة الصراط وكتاب الموقف وكتاب شجرة طوبا وكتاب سدرة المنتهى وكتاب مكارم الأخلاق وكتاب ذكر الموت والقبور وكتاب فعل المنكر وكتاب التقوى وكتاب زهد مالك بن دينار {cite:fihrist-ibn-al-nadim p. 262}."
  en: "Ibn Abi al-Dunya — tutor to al-Muktafi, the great wa'z bibliographer {cite:fihrist-ibn-al-nadim}"
