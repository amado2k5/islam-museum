summary:
  ar: "موظفة دولية وسياسية سعودية، وُلدت سنة 1945. مديرة تنفيذية لصندوق الأمم المتحدة للسكان من 2001 إلى 2010، فكانت أوّل سعودي يرأس وكالة أممية، وعُيّنت سنة 2013 من أوائل النساء في مجلس الشورى السعودي."
  en: "Saudi international civil servant and politician, born in 1945. Executive Director of the United Nations Population Fund from 2001 to 2010 — the first Saudi to head a UN agency — and in 2013 appointed among the first women members of Saudi Arabia's Shura Council."
  ur: "سعودی بین الاقوامی افسر اور سیاست دان، 1945ء میں پیدا ہوئیں۔ 2001ء سے 2010ء تک اقوام متحدہ کے آبادی فنڈ ⁦(UNFPA)⁩ کی ایگزیکٹو ڈائریکٹر رہیں — کسی اقوام متحدہ ایجنسی کی سربراہ بننے والی پہلی سعودی شخصیت — اور 2013ء میں سعودی شوریٰ کونسل کی پہلی خاتون ارکان میں شامل ہوئیں۔"
  es: "Funcionaria internacional y política saudí, nacida en 1945. Directora Ejecutiva del Fondo de Población de las Naciones Unidas de 2001 a 2010 —la primera saudí en dirigir una agencia de la ONU— y en 2013 nombrada una de las primeras mujeres miembros del Consejo de la Shura de Arabia Saudí."
  fr: "Fonctionnaire internationale et femme politique saoudienne, née en 1945. Directrice exécutive du Fonds des Nations Unies pour la population de 2001 à 2010 — la première Saoudienne à diriger une agence de l'ONU — et nommée en 2013 parmi les premières femmes membres du Conseil de la Choura d'Arabie saoudite."
  tr: "1945 doğumlu Suudi uluslararası ve siyasi bir çalışan. 2001-2010 yılları arasında Birleşmiş Milletler Nüfus Fonu'nun İcra Direktörü olarak görev yaptı, BM ajansının başına geçen ilk Suudi oldu ve 2013'te Suudi Şura Konseyi'ne ilk kadınlardan biri olarak atandı."
  id: "Seorang pegawai internasional dan politik Saudi, lahir pada tahun 1945. Direktur Eksekutif Dana Kependudukan Perserikatan Bangsa-Bangsa dari tahun 2001 hingga 2010, menjadi orang Saudi pertama yang memimpin lembaga PBB, dan diangkat pada tahun 2013 sebagai salah satu perempuan pertama di Dewan Syura Saudi."
