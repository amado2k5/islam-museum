label: { ar: "زيري بن مناد الصنهاجي" }
died: { edtf: "0971~", hijri: "0360-09", calendar: julian, precision: month, status: tradition, derived: true, note: "قُتل في شهر رمضان سنة ستين وثلاثمائة في حربه مع جعفر الأندلسي، كبا به فرسه فسقط إلى الأرض فقتل {cite:shadharat-dhahab p. 29-30}." }
summary:
  ar: "سيد صنهاجة؛ كتب إليه القائم الفاطمي سنة 333هـ وإلى سادات كتامة والقبائل يحضهم على الاجتماع بالمهدية وقتال أبي يزيد الخارجي فتهيأوا للمسير {cite:kamil-ibn-al-athir p. 318}. وعند ابن خلدون اختط مدينة أشير للتحصن بها سفح جبل تيطرا وعقد له المعز لدين الله على قومه وأذن له في اتخاذ القصور والمنازل والحمامات بمدينة أشير وعقد له على تاهرت وأعمالها، وكان من أعظم أوليائهم واستطال بهم على عدوه من مغراوة فانحرفت مغراوة وسائر زناتة عن الشيعة سائر أيامهم، ولما كانت فتنة أبي يزيد كان لزيري منافرة إلى الخوارج وتسريب الحشود إلى مناصرة العبيديين، ثم اختط ابنه بلكين بأمره وعلى عهده مدينة الجزائر المنسوبة لبني مزغنة بساحل البحر ومدينة مليانة بالعدوة الشرقية من شلف ومدينة المدية {cite:tarikh-ibn-khaldun-ibar p. 1630}"
  en: "Lord of Sanhaja; al-Qa'im summoned him with the Kutama chiefs to Mahdiyya to fight Abu Yazid in 333 — the house that would rule Ifriqiya for the Fatimids {cite:kamil-ibn-al-athir p. 318}."
