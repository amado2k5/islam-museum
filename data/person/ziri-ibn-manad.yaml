id: person/ziri-ibn-manad
class: person
label: { ar: "زيري بن مناد الصنهاجي" }
died: { edtf: "0971~", hijri: "0360-09", calendar: julian, precision: month, status: tradition, derived: true, note: "قُتل في شهر رمضان سنة ستين وثلاثمائة في حربه مع جعفر الأندلسي، كبا به فرسه فسقط إلى الأرض فقتل {cite:shadharat-dhahab p. 29-30}." }
summary:
  ar: "سيد صنهاجة؛ كتب إليه القائم الفاطمي سنة 333هـ وإلى سادات كتامة والقبائل يحضهم على الاجتماع بالمهدية وقتال أبي يزيد الخارجي فتهيأوا للمسير {cite:kamil-ibn-al-athir p. 318}. وعند ابن خلدون اختط مدينة أشير للتحصن بها سفح جبل تيطرا وعقد له المعز لدين الله على قومه وأذن له في اتخاذ القصور والمنازل والحمامات بمدينة أشير وعقد له على تاهرت وأعمالها، وكان من أعظم أوليائهم واستطال بهم على عدوه من مغراوة فانحرفت مغراوة وسائر زناتة عن الشيعة سائر أيامهم، ولما كانت فتنة أبي يزيد كان لزيري منافرة إلى الخوارج وتسريب الحشود إلى مناصرة العبيديين، ثم اختط ابنه بلكين بأمره وعلى عهده مدينة الجزائر المنسوبة لبني مزغنة بساحل البحر ومدينة مليانة بالعدوة الشرقية من شلف ومدينة المدية {cite:tarikh-ibn-khaldun-ibar p. 1630}"
  en: "Lord of Sanhaja; al-Qa'im summoned him with the Kutama chiefs to Mahdiyya to fight Abu Yazid in 333 — the house that would rule Ifriqiya for the Fatimids {cite:kamil-ibn-al-athir p. 318}."
  es: "Señor de Sanhaja; al-Qa'im lo convocó junto con los jefes de Kutama a Mahdiyya para luchar contra Abu Yazid en 333, la casa que gobernaría Ifriqiya para los fatimíes {cita:kamil-ibn-al-athir p. 318}."
  fr: "Seigneur de Sanhaja; al-Qa'im l'a convoqué avec les chefs Kutama à Mahdiyya pour combattre Abu Yazid en 333 — la maison qui allait gouverner Ifriqiya pour les Fatimides {cite:kamil-ibn-al-athir p. 318}."
  ur: "سنہاجا کا رب؛ القائم نے اسے 333 میں ابو یزید سے لڑنے کے لیے کوتمہ کے سرداروں کے ساتھ مہدیہ میں بلایا - وہ گھر جو فاطمیوں کے لیے عفریقیہ پر حکومت کرے گا {حوالہ: کامل ابن الاثیر ص۔ 318}۔"
  tr: "Seyyid Sanhaca; Fatımi Kaim, 333 Hicri yılında ona ve Katama ile kabilelerin liderlerine yazarak onları Mahdiye'de toplanmaya ve Ebu Yezid el-Harici ile savaşmaya çağırdı, böylece yürüyüşe hazırlandılar {atıf:kamil-ibn-al-athir s. 318}. İbn Haldun ayrıca Aşir şehrini Titra Dağı'nın eteğinde kendini tahkim etmesi için görevlendirdi; ona halkının üzerinde El-Mu'izz li-Din Allah'ı verdi, Aşir'deki sarayları, evleri ve hamamları ele geçirme izni verdi ve Tahert ile toprakları üzerinde kontrol verdi. Onların en büyük müttefiklerinden biriydi ve düşmanına karşı Mağrawa'dan onları yönetti, böylece Mahili ve diğer serveti ömür boyu Şiilerden saptı. Ebu Yezid'in kargaşasında Ziri Haricilere düşmanca davrandı ve Ubeydileri desteklemek için kalabalığa sızdı. Daha sonra, onun emriyle ve hükümdarlığı sırasında, oğlu Belkin, sahilde Banu Mazghna'ya atfedilen Cezayir şehrini, doğu Adwa'da ise Chlef ve Médéa şehrinden kurdu {atıfta olmuş:] Tarih-ibn-Haldun-ibar, s. 1630}"
  id: "Sayyid Sanhaja; Qa'im Fatimiyah menulis kepadanya pada tahun 333 H dan para kepala Katama serta suku-suku, mendesak mereka untuk berkumpul di Mahdiya dan melawan Abu Yazid al-Khariji, sehingga mereka bersiap untuk berbaris {cite:kamil-ibn-al-athir hlm. 318}. Ibn Khaldun juga menugaskan kota Ashir untuk memperkuat dirinya di kaki Gunung Titra, dan ia menunjuk Al-Mu'izz li-Din Allah atas rakyatnya, memberinya izin untuk mengambil alih istana, rumah, dan pemandian di Ashir, serta memberinya kendali atas Tahert dan wilayahnya. Ia adalah salah satu sekutu terbesar mereka dan memimpin mereka melawan musuhnya dari Maghrawa, sehingga Maghrawa dan kekayaannya lainnya menyimpang dari Syiah sepanjang hidup mereka. Ketika kekacauan Abu Yazid muncul, Ziri bermusuhan dengan Kharijit dan menyusup ke massa untuk mendukung Ubaydid. Kemudian, atas perintahnya dan selama pemerintahannya, putranya Belkin mendirikan kota Aljir, yang dikaitkan dengan Banu Mazghna di tepi pantai, dan kota Miliana di timur Adwa dari Chlef dan kota Médéa {cite:History-ibn-Khaldun-ibar hlm. 1630}"
