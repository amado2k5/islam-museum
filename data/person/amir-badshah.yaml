summary:
  ar: 'محمد أمين بن محمود البخاري، المعروف بأمير بادشاه، مفسر أصولي، توفي سنة 987ه
    بحسب ما ذكر المدخل. من تصانيفه: تيسير التحرير، وتفسير سورة الفتح، ورسالة في الحج
    أن الحج المبرور يكفر الذنوب، ورسالة في تحقيق حرف «قد». {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7513} '
  en: 'Muhammad Amin ibn Mahmud al-Bukhari, known as Amir Badshah, an exegete and
    a scholar of usul al-fiqh; the entry gives his death as 987 AH. His works include
    Taysir al-Tahrir, a commentary on the sura of Victory, a treatise that a pilgrimage
    accepted removes sins, and a treatise on the particle qad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7513} '
  ur: 'محمد امین بن محمود بخاری، امیر بادشاہ کے نام سے معروف، مفسر اور اصولی؛ مدخل
    کے مطابق وفات 987 ہجری ہے۔ تصانیف میں «تیسیر التحریر»، سورۂ فتح کی تفسیر، حج مبرور
    کے گناہ مٹانے پر رسالہ اور حرف «قد» کی تحقیق پر رسالہ شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7513} '
  es: "Muhammad Amin ibn Mahmud al-Bukhari, conocido como Amir Badshah, fue un exegeta y erudito en usul al-fiqh; su muerte se registró en el año 987 de la Hégira. Entre sus obras destacan Taysir al-Tahrir, un comentario sobre la sura de la Victoria, un tratado sobre la peregrinación aceptada que elimina los pecados y un tratado sobre la partícula qad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7513}"
  fr: "Muhammad Amin ibn Mahmud al-Bukhari, connu sous le nom d'Amir Badshah, exégète et spécialiste du fiqh (jurisprudence islamique), est décédé en 987 AH. Parmi ses œuvres figurent le Taysir al-Tahrir, un commentaire de la sourate de la Victoire, un traité affirmant que le pèlerinage accompli efface les péchés, et un traité sur la particule qad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7513}"
  tr: "Muhammed Emin bin Mahmud el-Buhari, Emir Badşah olarak bilinir, usul (usul) tefsirini alimdir ve kayda göre 987 Hicri'de ölmüştür. Eserleri arasında: Teysir-el-Tahrir, Fet Suresi'nin Tafsiri, Kabul edilen Hac üzerine bir inceleme ve 'Kad' harfinin doğrulanması üzerine bir risale. {alıntı:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.7513}"
  id: "Muhammad Amin ibn Mahmoud al-Bukhari, yang dikenal sebagai Amir Badshah, adalah seorang ulama penafsir usul (usul), yang wafat pada tahun 987 H menurut entri tersebut. Di antara karyanya: Taysir al-Tahrir, Tafsir Surah al-Fath, Risalah tentang Haji yang diterima menebus dosa, dan risalah tentang verifikasi huruf 'Qad'. {sitasi:fiqh-mawsua-kuwaityya-noor-v3 hlm.7513}"
