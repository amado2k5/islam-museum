summary:
  ar: 'محمد أمين بن محمود البخاري، المعروف بأمير بادشاه، مفسر أصولي، توفي سنة 987ه
    بحسب ما ذكر المدخل. من تصانيفه: تيسير التحرير، وتفسير سورة الفتح، ورسالة في الحج
    أن الحج المبرور يكفر الذنوب، ورسالة في تحقيق حرف «قد». {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7513} '
  en: 'Muhammad Amin ibn Mahmud al-Bukhari, known as Amir Badshah, an exegete and
    a scholar of usul al-fiqh; the entry gives his death as 987 AH. His works include
    Taysir al-Tahrir, a commentary on the sura of Victory, a treatise that a pilgrimage
    accepted removes sins, and a treatise on the particle qad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7513} '
  ur: 'محمد امین بن محمود بخاری، امیر بادشاہ کے نام سے معروف، مفسر اور اصولی؛ مدخل
    کے مطابق وفات 987 ہجری ہے۔ تصانیف میں «تیسیر التحریر»، سورۂ فتح کی تفسیر، حج مبرور
    کے گناہ مٹانے پر رسالہ اور حرف «قد» کی تحقیق پر رسالہ شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7513} '
