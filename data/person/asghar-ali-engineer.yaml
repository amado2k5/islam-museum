    note: "FLAGGED for a founder ruling. He was born into a Dawoodi Bohra priestly family — his father Shaikh Qurban Hussain was a Bohra amil — was trained in Qur'anic tafsir, tawil, fiqh and hadith, led the Progressive Dawoodi Bohra reform movement from the 1972 Udaipur revolt, and was elected general secretary of the Central Board of Dawoodi Bohra Community in 1977; in 2004 the Dawoodi Bohra establishment expelled him. Obituaries uniformly frame all of this as community belonging and movement leadership, and community membership, family background and movement leadership never count as personal school attestation. One commentator (Sumanto Al Qurtuby, 2013) wrote that 'although he was devoted to Shiism, Engineer strongly criticised its clergy system', preserved here; the English article's categories file him under 'Dawoodi Bohra people' and 'Indian Ismailis', which are filings; Wikidata gives a bare, unsourced Islam. Whether the Bohra reading should be mapped to shia-ismaili is preserved for the founder; under the doubt rule the value stays unknown."
