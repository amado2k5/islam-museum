summary:
  ar: "كاتب إصلاحي وناشط اجتماعي هندي، قائد حركة البهرة الداودية التقدمية، عُرف عالميًا بعمله في لاهوت التحرير في الإسلام؛ أسّس معهد الدراسات الإسلامية (1980) ومركز دراسة المجتمع والعلمانية (1993)، وألّف أكثر من خمسين كتابًا، ونال جائزة رايت ليفيلهوود (2004)."
  en: "Indian reformist writer and social activist, leader of the Progressive Dawoodi Bohra movement and internationally known for his work on liberation theology in Islam; he founded the Institute of Islamic Studies (1980) and the Centre for Study of Society and Secularism (1993), wrote more than fifty books, and received the Right Livelihood Award in 2004."
  ur: "ہندوستانی اصلاحی مصنف اور سماجی کارکن، پروگریسو داؤدی بوہرہ تحریک کے رہنما، جو اسلام میں لبریشن تھیولوجی پر اپنے کام کے باعث عالمی شہرت رکھتے تھے؛ انھوں نے انسٹی ٹیوٹ آف اسلامک اسٹڈیز (1980ء) اور سینٹر فار اسٹڈی آف سوسائٹی اینڈ سیکیولرزم (1993ء) قائم کیے، پچاس سے زائد کتابیں لکھیں، اور 2004ء میں رائٹ لائیولی ہڈ ایوارڈ پایا۔"
