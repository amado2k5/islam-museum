summary:
  ar: "جلال طالباني (1933 – 3 أكتوبر 2017)، سياسي كردي عراقي، مؤسس الاتحاد الوطني الكردستاني وقائده، وأول رئيس غير عربي لجمهورية العراق، إذ تولى الرئاسة من 2005 إلى 2014 بعد عقود من النضال السياسي والعسكري من أجل حقوق الأكراد. عُرف بلقب «مام جلال» أي العم جلال، واشتهر بدور الوسيط الجامع بين الفرقاء العراقيين حتى وفاته في برلين سنة 2017."
  en: "Jalal Talabani (1933 – 3 October 2017) was an Iraqi Kurdish politician, founder and leader of the Patriotic Union of Kurdistan and the first non-Arab president of the Republic of Iraq, holding the presidency from 2005 to 2014 after decades of political and military struggle for Kurdish rights. Known as 'Mam Jalal' — Uncle Jalal — he was noted as a unifying mediator among Iraq's factions until his death at Berlin in 2017."
  ur: "جلال طالبانی (1933ء – 3 اکتوبر 2017ء) ایک عراقی کرد سیاست دان، پٹریاٹک یونین آف کردستان کے بانی و رہنما اور جمہوریۂ عراق کے پہلے غیر عرب صدر تھے؛ انہوں نے کرد حقوق کی دہائیوں کی سیاسی و عسکری جدوجہد کے بعد 2005ء سے 2014ء تک صدارت سنبھالی۔ وہ «مام جلال» یعنی چچا جلال کے لقب سے معروف تھے اور 2017ء میں برلن میں وفات تک عراقی دھڑوں کے درمیان مصالحتی واسطے کے طور پر جانے جاتے تھے۔"
