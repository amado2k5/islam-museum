summary:
  ar: "يزيد بن تزوان الملقب هبنقة العائشي؛ ذمه سليمان بن عبد الملك في خطبته الأولى إذ كان يؤثر سمان إبله بالعلف والمرعى ويقول أنا لا أصلح ما أفسد الله وكان سليمان يعطي ويصطنع أهل النعم واليسار ويدع من سواهم."
  en: "Yazid ibn Tazwan, called Habanqa al-'A'ishi; singled out in Sulayman's first khutba — the man who prized fattened camels saying 'I do not mend what God has corrupted' — while Sulayman favored the rich."
  es: "Yazid ibn Tazwan, llamado Habanqa al-'A'ishi; mencionado en la primera jutba de Sulayman —el hombre que apreciaba los camellos engordados diciendo 'No reparo lo que Dios ha corrompido'— mientras que Sulayman favorecía a los ricos."
  fr: "Yazid ibn Tazwan, surnommé Habanqa al-'A'ishi, fut cité lors du premier sermon de Sulayman – l'homme qui appréciait les chameaux engraissés en disant « Je ne répare pas ce que Dieu a corrompu » – tandis que Sulayman favorisait les riches."
