label: { ar: "يزيد بن تزوان هبنقة العائشي", en: "Yazid ibn Tazwan 'Habanqa'", es: "Yazid ibn Tazwan 'Habanqa'", fr: "Yazid ibn Tazwan 'Habanqa'", ur: "یزید بن تزوان حبانقہ" }
summary:
  ar: "يزيد بن تزوان الملقب هبنقة العائشي؛ ذمه سليمان بن عبد الملك في خطبته الأولى إذ كان يؤثر سمان إبله بالعلف والمرعى ويقول أنا لا أصلح ما أفسد الله وكان سليمان يعطي ويصطنع أهل النعم واليسار ويدع من سواهم."
  en: "Yazid ibn Tazwan, called Habanqa al-'A'ishi; singled out in Sulayman's first khutba — the man who prized fattened camels saying 'I do not mend what God has corrupted' — while Sulayman favored the rich."
  es: "Yazid ibn Tazwan, llamado Habanqa al-'A'ishi; mencionado en la primera jutba de Sulayman —el hombre que apreciaba los camellos engordados diciendo 'No reparo lo que Dios ha corrompido'— mientras que Sulayman favorecía a los ricos."
  fr: "Yazid ibn Tazwan, surnommé Habanqa al-'A'ishi, fut cité lors du premier sermon de Sulayman – l'homme qui appréciait les chameaux engraissés en disant « Je ne répare pas ce que Dieu a corrompu » – tandis que Sulayman favorisait les riches."
  ur: "یزید بن تزوان جسے حبانکہ العاشی کہتے ہیں۔ سلیمان کے پہلے خطبے میں بیان کیا گیا تھا - وہ شخص جس نے موٹے اونٹوں کی قیمت میں کہا کہ 'میں اس کی اصلاح نہیں کرتا جو خدا نے خراب کیا ہے' - جبکہ سلیمان نے امیروں کی حمایت کی۔"
  tr: "Habanqa al-Aishi lakaplı Yezid bin Tazwan, ilk vaazında Süleyman bin Abdülmelik tarafından develerini yem ve otlakla şişirdirken, 'Allah'ın bozduğunu düzeltmem' dediği için eleştirildi. Süleyman, solaklara iyilik verir ve uydurur, diğerlerini geride bırakırdı."
  id: "Yazid ibn Tazwan, yang dijuluki Habanqa al-Aishi, dikritik oleh Sulayman ibn Abd al-Malik dalam khotbah pertamanya ketika ia biasa menggemukkan untanya dengan pakan dan padang rumput, dengan berkata, 'Aku tidak memperbaiki apa yang telah dirusak Tuhan.' Sulayman biasa memberi dan memalsukan jasa dan orang kidal serta meninggalkan yang lain."
