summary:
  ar: "عبد الرحمن بن محمود بن عبيدان البعلي، زين الدين، أبو الفرج، فقيه حنبلي، سمع الحديث وتفقه على تقي الدين ⁦(ابن تيمية)⁩ وغيره، وبرع وأفتى، وكان عارفاً بالفقه والأصول والحديث والعربية والتصوف، وتخرج به جماعة منهم عز الدين حمزة بن شيخ السلامية. من تصانيفه المطلع في الأحكام على أبواب المقنع، وشرح قطعة من المقنع، وزوائد الكافي والمحرر على المقنع. توفي سنة 734 هـ، وولد سنة 675 هـ على ما يذكر العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15809}"
  en: "Abd al-Rahman ibn Mahmud ibn Ubaydan al-Ba'li, Zayn al-Din, Abu al-Faraj, a Hanbali jurist. He heard hadith, studied fiqh under Taqi al-Din (Ibn Taymiyya) and others, excelled, and gave fatwas. Ibn Rajab says he knew fiqh and its fine points, usul, hadith, grammar and Sufism, and trained a circle including Izz al-Din Hamza ibn Shaykh al-Salamiyya. His works include al-Mutli fi al-ahkam ala abwab al-Muqni, a partial commentary on al-Muqni, and Zawa'id al-Kafi and al-Muharrir on al-Muqni. The header gives his death as 734 AH and his birth as 675 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15809}"
  fr: "Abd al-Rahman ibn Mahmud ibn Ubaydan al-Ba'li, Zayn al-Din, Abu al-Faraj, juriste hanbalite. Il entendit le hadith, étudia le fiqh auprès de Taqi al-Din (Ibn Taymiyya) et d'autres, excella et donna des fatwas. Ibn Rajab dit qu'il connaissait le fiqh et ses subtilités, les fondements du droit, le hadith, la grammaire et le soufisme, et qu'il forma un cercle dont faisait partie Izz al-Din Hamza ibn Shaykh al-Salamiyya. Ses œuvres comprennent al-Mutli fi al-ahkam ala abwab al-Muqni, commentaire partiel d'al-Muqni, ainsi que les Zawa'id al-Kafi et al-Muharrir sur al-Muqni. L'en-tête donne sa mort en 734 H et sa naissance en 675 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15809}"
  es: "Abd al-Rahman ibn Mahmud ibn Ubaydan al-Ba'li, Zayn al-Din, Abu al-Faraj, un jurista hanbali. Escuchó hadices, estudió fiqh con Taqi al-Din (Ibn Taymiyya) y otros, se destacó y pronunció fatwas. Ibn Rajab dice que conocía el fiqh y sus puntos finos, usul, hadiz, gramática y sufismo, y entrenó un círculo que incluía a Izz al-Din Hamza ibn Shaykh al-Salamiyya. Sus obras incluyen al-Mutli fi al-ahkam ala abwab al-Muqni, un comentario parcial sobre al-Muqni, y Zawa'id al-Kafi y al-Muharrir sobre al-Muqni. El encabezado indica su muerte en 734 AH y su nacimiento en 675 AH. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15809}"
  ur: "عبدالرحمن بن محمود ابن عبیدان البالی، زین الدین، ابو الفراج، حنبلی فقیہ۔ انہوں نے حدیثیں سنی، تقی الدین ⁦(ابن تیمیہ)⁩ اور دیگر لوگوں سے فقہ کا مطالعہ کیا، فضیلت حاصل کی اور فتوے جاری کئے۔ ابن رجب کہتے ہیں کہ وہ فقہ اور اس کے عمدہ نکات، اصول، حدیث، گرامر اور تصوف کو جانتے تھے، اور انہوں نے ایک حلقہ کی تربیت کی جس میں عزالدین حمزہ بن شیخ السلمیہ بھی شامل تھے۔ ان کی تصانیف میں المطلی فی الاحکام علواب المقنی، المقنی کی ایک جزوی تفسیر، اور زوائد الکافی اور المحرر المقنی پر شامل ہیں۔ ہیڈر ان کی وفات 734ھ اور ولادت 675ھ بتاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 15809}"
  tr: "Abdülrahman ibn Mahmud ibn Ubeydan el-Ba'li, Zeyn el-Din, Ebu el-Feraj, Hanbeli bir hukukçu idi. Hadis ve fıkıh ilmini Takî el-Din (İbn Taymiyye) ve diğerlerinin yanında öğrenmiş, bu alanda üstün başarı göstermiş ve hukuki görüşler ortaya koymuştur. Fıkıh, ilkeleri, hadis, Arapça dilbilgisi ve tasavvuf konularında bilgiliydi. İzz el-Din Hamza ibn Şeyh el-Selamiye de dahil olmak üzere birçok öğrencisi onun yanında mezun olmuştur. Eserleri arasında; el-Mutla' fi el-Ahkam 'ala Abwab el-Muqni', el-Muqni'nin bir bölümüne tefsir ve el-Kafi ile el-Muharrar 'ala el-Muqni'ye eklemeler bulunmaktadır. Başlığa göre 734 Hicri yılında vefat etmiş, 675 Hicri yılında doğmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15809}"
  id: "Abd al-Rahman ibn Mahmud ibn Ubaydan al-Ba'li, Zayn al-Din, Abu al-Faraj, adalah seorang ahli hukum Hanbali. Ia belajar Hadits dan fiqih di bawah bimbingan Taqi al-Din (Ibn Taymiyyah) dan lainnya, unggul di bidang tersebut dan mengeluarkan pendapat hukum. Ia berpengetahuan luas dalam fiqih, prinsip-prinsipnya, Hadits, tata bahasa Arab, dan Sufisme. Sekelompok muridnya lulus di bawah bimbingannya, termasuk Izz al-Din Hamza ibn Shaykh al-Salamiyya. Di antara karyanya adalah: al-Mutla' fi al-Ahkam 'ala Abwab al-Muqni', sebuah komentar atas sebagian dari al-Muqni', dan tambahan untuk al-Kafi dan al-Muharrar 'ala al-Muqni'. Ia wafat pada tahun 734 H dan lahir pada tahun 675 H, sesuai dengan judulnya. {mengutip:fiqh-mawsua-kuwaitiyya-noor-v3 hal.15809}"
