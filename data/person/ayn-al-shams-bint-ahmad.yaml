  ar: "عين الشمس بنت أحمد بن أبي الفرج، الفقيهة الأصبهانية، سمعت من إسماعيل بن الإخشيذ ومن أبي ذر وكانت آخر من حدث عنهما، وتوفيت في ربيع الآخر سنة 610 هـ."
