  fr: "Ayn al-Shams bint Ahmad ibn Abi al-Faraj, la juriste d'Ispahan, qui a entendu d'Isma'il ibn al-Ikhshid et d'Abu Dharr et a été la dernière à rapporter d'eux; est décédée en Rabi' al-Akhir 610 AH (1213)."
  ur: "عین الشمس بنت احمد بن ابی الفراج، اصفہان کی خاتون فقیہ، جنہوں نے اسماعیل بن الاخشد اور ابوذر سے سنا اور ان سے آخری روایت بیان کی۔ ربیع الآخر 610ھ (1213) میں وفات پائی۔"
