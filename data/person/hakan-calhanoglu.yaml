summary:
  ar: "لاعب كرة قدم محترف (وُلد سنة 1994 في مانهايم بألمانيا) يلعب وسطًا مع إنتر ميلان ويقود منتخب تركيا. متخصص في الركلات الحرة، برز مع كارلسروه وهامبورغ، ولعب لباير ليفركوزن وإيه سي ميلان، ثم عبر إلى إنتر سنة 2021 وفاز معه بالدوري الإيطالي وكأس إيطاليا؛ تجاوزت مبارياته الدولية مع تركيا مائة مباراة."
  en: "Professional footballer (born 1994 in Mannheim, Germany) who plays as a midfielder for Inter Milan and captains Turkey. A free-kick specialist, he rose at Karlsruher SC and Hamburger SV, played for Bayer Leverkusen and AC Milan, and crossed to city rivals Inter in 2021, winning Serie A and the Coppa Italia; he has won more than a hundred caps for Turkey."
  ur: "پیشہ ور فٹبالر (پیدائش 1994، مانہائم، جرمنی) جو انٹر میلان کے لیے مڈفیلڈر کھیلتے ہیں اور ترکیہ کی کپتانی کرتے ہیں۔ فری کک کے ماہر، کارلسروہے اور ہیمبرگ سے ابھرے، بائر لیورکوزن اور اے سی میلان کے لیے کھیلے، 2021 میں انٹر میں شامل ہو کر سیری آ اور کوپا اطالیہ جیتے؛ ترکیہ کے لیے سو سے زائد بین الاقوامی میچ کھیل چکے ہیں۔"
