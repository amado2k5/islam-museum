summary:
  ar: موسى بن سليمان الجوزجاني الحنفي، أبو سليمان، صاحب أبي يوسف ومحمد بن الحسن، حدث عنهما وعن ابن المبارك وروى عنه أبو حاتم الرازي وغيره؛ قال الذهبي إنه كان صدوقاً محبوباً إلى أهل الحديث، وقيل إن المأمون عرض عليه القضاء فامتنع.
  en: Musa ibn Sulayman al-Juzjani al-Hanafi, Abu Sulayman, a companion of Abu Yusuf and Muhammad ibn al-Hasan who narrated from them and from Ibn al-Mubarak, with Abu Hatim al-Razi and others narrating from him; al-Dhahabi calls him truthful and beloved of the hadith people, and it is said he declined the judgeship offered by al-Ma'mun.
