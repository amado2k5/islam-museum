  en: Mussa ibn Sulayman al-Juzjani
  es: "Mussa ibn Sulayman al-Juzjani"
  fr: "Mussa ibn Sulayman al-Juzjani"
  ur: "موسیٰ بن سلیمان الجزانی"
roles:
  - muhaddith
gender: male
summary:
  ar: موسى بن سليمان الجوزجاني الحنفي، أبو سليمان، صاحب أبي يوسف ومحمد بن الحسن، حدث عنهما وعن ابن المبارك وروى عنه أبو حاتم الرازي وغيره؛ قال الذهبي إنه كان صدوقاً محبوباً إلى أهل الحديث، وقيل إن المأمون عرض عليه القضاء فامتنع.
  en: Musa ibn Sulayman al-Juzjani al-Hanafi, Abu Sulayman, a companion of Abu Yusuf and Muhammad ibn al-Hasan who narrated from them and from Ibn al-Mubarak, with Abu Hatim al-Razi and others narrating from him; al-Dhahabi calls him truthful and beloved of the hadith people, and it is said he declined the judgeship offered by al-Ma'mun.
  es: "Musa ibn Sulayman al-Juzjani al-Hanafi, Abu Sulayman, compañero de Abu Yusuf y Muhammad ibn al-Hasan, quien narró de ellos y de Ibn al-Mubarak, con Abu Hatim al-Razi y otros narrando de él; al-Dhahabi lo llama veraz y amado por la gente del hadiz, y se dice que rechazó el cargo de juez ofrecido por al-Ma'mun."
  fr: "Musa ibn Sulayman al-Juzjani al-Hanafi, Abu Sulayman, un compagnon d'Abu Yusuf et de Muhammad ibn al-Hasan qui a rapporté d'eux et d'Ibn al-Mubarak, avec Abu Hatim al-Razi et d'autres rapportant de lui; al-Dhahabi le qualifie de véridique et aimé des gens du hadith, et il est dit qu'il a refusé la charge de juge offerte par al-Ma'mun."
  ur: "موسیٰ بن سلیمان الجزانی الحنفی، ابو سلیمان، ابو یوسف اور محمد بن الحسن کے صحابی جنہوں نے ان سے اور ابن المبارک سے روایت کی، ابو حاتم الرازی اور دوسرے ان سے روایت کرتے ہیں۔ الذہبی اسے سچا اور اہل حدیث کا محبوب کہتا ہے، اور کہا جاتا ہے کہ اس نے المامون کی طرف سے پیش کردہ جج کو ٹھکرا دیا۔"
