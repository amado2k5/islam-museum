  fr: "Fiche de convocation de Sari Saltuk, le derviche guerrier du XIIIe siècle des Balkans auquel des actes et des sanctuaires sont attribués de la Roumélie à la Crimée, mort en 1297; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "بلقان کے تیرہویں صدی کے جنگجو درویش ساری سالٹوک کے لیے ڈرافٹ کارڈ جس کے اعمال اور مزارات رومیلیا سے کریمیا تک منسوب ہیں، ڈی۔ 1297; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
