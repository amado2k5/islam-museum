  ar: "بطاقة أولية لساري صالتق، درويش غازي البلقان في القرن الثالث عشر الذي تُنسب إليه أقدار وأضرحة من الروم إلى القرم، توفي سنة ١٢٩٧م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
