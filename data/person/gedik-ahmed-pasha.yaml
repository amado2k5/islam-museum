summary:
  ar: "كدك أحمد باشا، صدر أعظم وقائد عثماني من أصل صربي، أدخله السلطان مراد الثاني القصر، وصار أمير أناضول في 1461م، وأسهم في تثبيت الفتوح في الأناضول ضد القرمانيين والآق قويونلو، ثم فتح كافا في القرم سنة 1475م، وانتزع أوترانتو سنة 1480م، وتوفي في 6 شوال 887هـ/18 نوفمبر 1482م {cite:encyclopaedia-of-islam-2 vol. 1 p. 314}."
  en: "Gedik Ahmed Pasha, Ottoman grand vizier and admiral, born in Serbia and taken into Murad II's palace. He became beglerbegi of Anatolia in 1461 and grand vizier in 1470, and helped to consolidate the conquests in Anatolia against the Karamanids and the Ak Koyunlu. He took Kaffa in the Crimea in 1475 and Otranto in 1480, and died on 6 Shawwal 887/18 November 1482 {cite:encyclopaedia-of-islam-2 vol. 1 p. 314}."
  es: "Gedik Ahmed Pasha, gran visir y almirante otomano, nació en Serbia y fue acogido en el palacio de Murad II. Se convirtió en beglerbegi de Anatolia en 1461 y en gran visir en 1470, y contribuyó a consolidar las conquistas en Anatolia contra los karamánidas y los Ak Koyunlu. Tomó Kaffa en Crimea en 1475 y Otranto en 1480, y murió el 6 de Shawwal de 887/18 de noviembre de 1482 {cite:encyclopaedia-of-islam-2 vol. 1 p. 314}."
  fr: "Gedik Ahmed Pacha, grand vizir et amiral ottoman, né en Serbie et accueilli au palais de Murad II, devint beglerbegi d'Anatolie en 1461, puis grand vizir en 1470. Il contribua à consolider les conquêtes en Anatolie contre les Karamanides et les Ak Koyunlu. Il prit Kaffa en Crimée en 1475 et Otrante en 1480. Il mourut le 6 Shawwal 887/18 novembre 1482 (voir Encyclopaedia of Islam, vol. 2, p. 314)."
