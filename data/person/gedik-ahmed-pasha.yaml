summary:
  ar: "كدك أحمد باشا، صدر أعظم وقائد عثماني من أصل صربي، أدخله السلطان مراد الثاني القصر، وصار أمير أناضول في 1461م، وأسهم في تثبيت الفتوح في الأناضول ضد القرمانيين والآق قويونلو، ثم فتح كافا في القرم سنة 1475م، وانتزع أوترانتو سنة 1480م، وتوفي في 6 شوال 887هـ/18 نوفمبر 1482م {cite:encyclopaedia-of-islam-2 vol. 1 p. 314}."
  en: "Gedik Ahmed Pasha, Ottoman grand vizier and admiral, born in Serbia and taken into Murad II's palace. He became beglerbegi of Anatolia in 1461 and grand vizier in 1470, and helped to consolidate the conquests in Anatolia against the Karamanids and the Ak Koyunlu. He took Kaffa in the Crimea in 1475 and Otranto in 1480, and died on 6 Shawwal 887/18 November 1482 {cite:encyclopaedia-of-islam-2 vol. 1 p. 314}."
