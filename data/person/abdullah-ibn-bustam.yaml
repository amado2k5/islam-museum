summary:
  ar: رجل ذكر كتاب نجران أنه أفسد على الهادي وبذل مالاً لليامين، ثم هرب والتمس الأمان بوساطة الدعام فآمنه الهادي في جمادى الآخرة 286هـ.
  en: A man whom the Najran letter says worked mischief against al-Hadi and offered the Yam money, then fled and sought safe-conduct through al-Da'am, which al-Hadi gave in Jumada II 286 AH.
  ur: ایک شخص جس کے بارے میں نجران کے خط میں ہے کہ اس نے ہادی کے خلاف فساد کیا اور یام کو مال دیا، پھر وہ بھاگا اور دعام کے ذریعے امان مانگی جو ہادی نے جمادی الآخرہ 286ھ میں دی۔
