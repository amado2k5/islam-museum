summary:
  ar: "خامس شاهات الدولة الصفوية في إيران (حكم 1587/1588–1629)، الابن الثالث لمحمد خدا بنده، وأقوى حكام الأسرة. حدّ من نفوذ القزلباش بجيش جديد من الغلمان، واستعاد الأراضي من الأوزبك والعثمانيين، وطرد البرتغاليين من هرمز بمساعدة إنجليزية (1622)، ونقل العاصمة إلى أصفهان وجعلها مركزًا للفن والتجارة، ورعى التشيّع الاثني عشري، وحجّ ماشيًا من أصفهان إلى مشهد سنة 1601."
  en: "Fifth Safavid shah of Iran (r. 1587/88-1629), third son of Mohammad Khodabanda, and the dynasty's most powerful ruler. He curbed the Qizilbash with a new ghulam army, retook the lands lost to the Uzbeks and Ottomans, expelled the Portuguese from Hormuz with English help (1622), moved the capital to Isfahan and made it a centre of art and trade, and patronised Twelver Shi'ism, walking on pilgrimage from Isfahan to Mashhad in 1601."
  ur: "ایران کے پانچویں صفوی شاہ (دورِ حکومت 1587ء/1588ء–1629ء)، محمد خدا بندہ کے تیسرے بیٹے اور خاندان کے سب سے طاقتور حکمران۔ انھوں نے غلاموں کی نئی فوج سے قزلباشوں کا زور توڑا، ازبکوں اور عثمانیوں سے کھوئے ہوئے علاقے واپس لیے، انگریزوں کی مدد سے پرتگالیوں کو ہرمز سے نکالا (1622ء)، دار الحکومت اصفہان منتقل کیا اور اسے فن و تجارت کا مرکز بنایا، اور اثنا عشری تشیّع کی سرپرستی کی؛ 1601ء میں اصفہان سے مشہد تک پیدل زیارت کی۔"

