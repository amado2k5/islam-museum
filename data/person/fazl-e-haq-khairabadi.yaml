summary:
  ar: "عالم وفيلسوف وشاعر هندي (1797–1861) من خير آباد، مفتٍ ومتكلم، درس الحديث على الشاه عبد القادر والشاه عبد العزيز الدهلويين، وحرّر أول ديوان لميرزا غالب، وردّ على «تقوية الإيمان» للشاه إسماعيل الدهلوي بكتابه «تحقيق الفتوى في إبطال الطغوى». في سنة 1857 أصدر من دلهي فتوى مؤيدة للجهاد ضد الحكم البريطاني، فحُكم عليه بالسجن المؤبد في جزر أندمان حيث توفي."
  en: "Indian scholar, philosopher and poet (1797–1861) of Khairabad, a mufti and theologian who studied hadith under Shah Abd al-Qadir and Shah Abd al-Aziz Dehlvi, edited the first diwan of Mirza Ghalib, and answered Shah Ismail Dehlvi's Taqwiyat al-Iman with his Tahqeeq al-Fatwa fi Ibtal al-Taghwa. In 1857 he issued from Delhi a fatwa supporting jihad against British rule; he was sentenced to life imprisonment in the Andaman Islands, where he died."
  ur: "ہندوستانی عالم، فلسفی اور شاعر (1797ء–1861ء)، خیرآباد سے تعلق؛ مفتی و متکلم، جنھوں نے شاہ عبدالقادر اور شاہ عبدالعزیز دہلوی سے حدیث پڑھی، مرزا غالب کے پہلے دیوان کی تدوین کی، اور شاہ اسماعیل دہلوی کی «تقویۃ الایمان» کا رد «تحقیق الفتویٰ فی ابطال الطغویٰ» میں لکھا۔ 1857ء میں دہلی سے انگریز حکومت کے خلاف جہاد کا فتویٰ دیا؛ کالا پانی کی سزا ہوئی اور جزائرِ انڈمان میں وفات پائی۔"
