summary:
  ar: "كيميائي فيزيائي تونسي أمريكي، وُلد سنة 1961، أستاذ بمعهد ماساتشوستس للتقنية. ابتكر طريقة الحقن الساخن لتصنيع النقاط الكمومية الغروية المتجانسة، ونال جائزة نوبل في الكيمياء سنة 2023 مشاركةً عن اكتشاف النقاط الكمومية وتخليقها."
  en: "Tunisian-American physical chemist, born in 1961, professor at MIT. He pioneered hot-injection synthesis of uniform colloidal quantum dots and shared the 2023 Nobel Prize in Chemistry for the discovery and synthesis of quantum dots."
  ur: "تیونسی نژاد امریکی طبیعی کیمیا دان، 1961 میں پیدا ہوئے، ایم آئی ٹی کے پروفیسر۔ انہوں نے یکساں کولائیڈل کوانٹم ڈاٹس کی تیاری کا طریقۂ حار حقن ایجاد کیا اور کوانٹم ڈاٹس کی دریافت و تیاری پر 2023 کا نوبل انعام برائے کیمیا مشترکہ طور پر حاصل کیا۔"
  es: "Químico físico tunecino-estadounidense, nacido en 1961, profesor del MIT. Fue pionero en la síntesis por inyección en caliente de puntos cuánticos coloidales uniformes y compartió el Premio Nobel de Química de 2023 por el descubrimiento y la síntesis de puntos cuánticos."
  fr: "Chimiste physico-américain tuniso-américain, né en 1961, professeur au MIT. Il a été un pionnier de la synthèse par injection à chaud de points quantiques colloïdaux uniformes et a partagé le prix Nobel de chimie 2023 pour la découverte et la synthèse des points quantiques."
  tr: "Tunuslu-Amerikalı fizik kimyager, 1961 doğumlu, Massachusetts Teknoloji Enstitüsü'nde profesör. Homojen kolloidal kuantum noktalarının üretimi için sıcak enjeksiyon yöntemini icat etti ve kuantum noktalarının keşfi ve sentezine yaptığı katkılar nedeniyle 2023'te Nobel Kimya Ödülü'nü kazandı."
  id: "Ahli kimia fisika Tunisia-Amerika, lahir tahun 1961, profesor di Massachusetts Institute of Technology. Ia menemukan metode injeksi panas untuk memproduksi titik kuantum koloid homogen dan memenangkan Hadiah Nobel Kimia pada tahun 2023 atas kontribusinya dalam penemuan dan sintesis titik kuantum."
