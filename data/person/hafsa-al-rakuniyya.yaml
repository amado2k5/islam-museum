gender: female
roles: [poet]
summary:
  ar: "حفصة بنت الحاج الركونية، شاعرة أديبة من أشراف غرناطة، وصفها ابن دحية بأنها رخيمة الشعر رقيقة النظم والنثر؛ ارتجلت أبياتاً بين يدي عبد المؤمن بن علي، ولها مع أبي جعفر بن سعيد مراسلات شعرية، وكتبت تهنئة للسيد أبي سعيد صاحب غرناطة."
  en: "Hafsa bint al-Hajj al-Rakuniyya, a poet and woman of letters of the notables of Granada, whom Ibn Dihya called graceful in verse and delicate in poetry and prose; she improvised verses before Abd al-Mu'min ibn Ali, exchanged poems with Abu Ja'far ibn Sa'id, and wrote a festival greeting to the sayyid Abu Sa'id, governor of Granada."
  es: "Hafsa bint al-Hajj al-Rakuniyya, poetisa y mujer de letras perteneciente a la élite de Granada, a quien Ibn Dihya describió como elegante en verso y delicada en poesía y prosa; improvisó versos ante Abd al-Mu'min ibn Ali, intercambió poemas con Abu Ja'far ibn Sa'id y escribió un saludo festivo al sayyid Abu Sa'id, gobernador de Granada."
  fr: "Hafsa bint al-Hajj al-Rakuniyya, poétesse et femme de lettres parmi les notables de Grenade, qu'Ibn Dihya qualifiait de gracieuse dans ses vers et délicate dans sa poésie et sa prose; elle improvisait des vers devant Abd al-Mu'min ibn Ali, échangeait des poèmes avec Abu Ja'far ibn Sa'id et écrivait un message de vœux au sayyid Abu Sa'id, gouverneur de Grenade."
  ur: "حفصہ بنت الحج الرقونیہ، ایک شاعرہ اور غرناطہ کے معززین کے خطوط کی خاتون، جسے ابن دحیہ نے آیت میں خوبصورت اور شاعری اور نثر میں نازک کہا؛ اس نے عبد المومن ابن علی سے پہلے اشعار تیار کیے، ابو جعفر ابن سعید کے ساتھ نظموں کا تبادلہ کیا، اور غرناطہ کے گورنر سید ابو سعید کو تہوار کی مبارکباد لکھی۔"
  tr: "Granada soylularından bir şair ve yazar olan Hafsa bint al-Hajj al-Rukuniyyah, İbn Dihya tarafından zarif kompozisyon ve düzyazıya sahip bir şair olarak tanımlanmıştır; Abd al-Mu'min ibn Ali'nin önünde doğaçlama şiirler yazmış, Ebu Ca'far bin Sa'id ile mektuplaşmış ve Granada hükümdarı Seyyid Ebu Said'e tebrikler yazmıştır."
  id: "Hafsa bint al-Hajj al-Rukuniyyah, seorang penyair dan penulis dari kalangan bangsawan Granada, digambarkan oleh Ibn Dihya sebagai penyair dengan komposisi dan prosa yang halus; ia mengimprovisasi puisi di hadapan Abd al-Mu'min ibn Ali, berkorespondensi dengan Abu Ja'far ibn Sa'id, dan menulis ucapan selamat kepada Sayyid Abu Sa'id, penguasa Granada."
