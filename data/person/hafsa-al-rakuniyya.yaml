summary:
  ar: "حفصة بنت الحاج الركونية، شاعرة أديبة من أشراف غرناطة، وصفها ابن دحية بأنها رخيمة الشعر رقيقة النظم والنثر؛ ارتجلت أبياتاً بين يدي عبد المؤمن بن علي، ولها مع أبي جعفر بن سعيد مراسلات شعرية، وكتبت تهنئة للسيد أبي سعيد صاحب غرناطة."
  en: "Hafsa bint al-Hajj al-Rakuniyya, a poet and woman of letters of the notables of Granada, whom Ibn Dihya called graceful in verse and delicate in poetry and prose; she improvised verses before Abd al-Mu'min ibn Ali, exchanged poems with Abu Ja'far ibn Sa'id, and wrote a festival greeting to the sayyid Abu Sa'id, governor of Granada."
