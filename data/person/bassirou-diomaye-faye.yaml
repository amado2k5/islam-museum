summary:
  ar: "سياسي سنغالي (وُلد 1980) من ندياغانياو، مفتش ضرائب سابق والأمين العام لحزب باستيف، سُجن في 2023–2024 ثم فاز بانتخابات 2024 خلفا لمرشح الحزب الممنوع عثمان سونكو، فصار الرئيس الخامس للسنغال في 2 أبريل 2024 وأصغر رؤسائها؛ سمى سونكو رئيسا للوزراء ثم اختلف معه وأقاله في مايو 2026."
  en: "Senegalese politician (born 1980) from Ndiaganiao, a former tax inspector and general secretary of PASTEF who was imprisoned in 2023–2024 and then won the 2024 presidential election in place of the party's barred candidate Ousmane Sonko, becoming Senegal's fifth and youngest president on 2 April 2024; he appointed Sonko prime minister, then fell out with him and dismissed him in May 2026."
  ur: "سینیگال کے سیاست دان (پیدائش 1980ء) جن کا تعلق نڈیاگانیاؤ سے ہے؛ سابق ٹیکس انسپکٹر اور پاسٹف کے جنرل سیکرٹری، 2023ء–2024ء میں قید رہے، پھر پارٹی کے نااہل امیدوار عثمان سونکو کی جگہ 2024ء کا صدارتی انتخاب جیت کر 2 اپریل 2024ء کو سینیگال کے پانچویں اور کم عمر ترین صدر بنے؛ سونکو کو وزیر اعظم بنایا، پھر اختلاف کے بعد مئی 2026ء میں انھیں برطرف کر دیا۔"
