summary:
  ar: "يوسف بن درة الشاعر المعروف بابن الدّرّى، الموصلي الأصل؛ كان شاباً ذكياً، ذكره أبو شجاع بن الدهان في تاريخه أنه هلك مع الحاج سنة خمس وأربعين وخمسمائة لما خرجت عليهم زعب — بطن مشهور من سليم — فهلك من الحجاج خلق كثير قتلاً وجوعاً وعطشاً، وذكره عماد الدين الكاتب الأصبهاني في خريدة القصر وأبو المعالي الحظيري في زينة الدهر، ومن مشهور شعره قوله في رجل أرجل: مدوّر الكعب فاتخذه لتل غرس وثل عرش أخرجها في بنات نعش {cite:wafayat-ayan p. 230-231}."
  en: "Yusuf ibn Durra 'Ibn al-Darra' — the sharp young Mosuli poet who perished with the Hajj caravan in 545 AH when the Za'b of Sulaym fell upon it and multitudes died by sword, hunger and thirst; his verses were gathered in Imad al-Din's Kharida and al-Haziri's Zinat al-Dahr {cite:wafayat-ayan p. 230-231}."
  es: "Yusuf ibn Durra 'Ibn al-Darra' — el agudo joven poeta mosuli que pereció con la caravana del Hajj en el año 545 AH cuando el Za'b de Sulaym cayó sobre ella y multitudes murieron por espada, hambre y sed; sus versos fueron recopilados en el Kharida de Imad al-Din y en el Zinat al-Dahr de al-Haziri {cite:wafayat-ayan p. 230-231}."
  fr: "Yusuf ibn Durra 'Ibn al-Darra' — le jeune poète mosoulien brillant qui périt avec la caravane du Hajj en 545 AH lorsque le Za'b de Sulaym s'abattit sur elle et que des multitudes moururent par l'épée, la faim et la soif; ses vers ont été rassemblés dans le Kharida d'Imad al-Din et le Zinat al-Dahr d'al-Haziri {cite: wafayat-ayan p. 230-231}."
  ur: "یوسف بن درہ 'ابن الدرہ' - ایک تیز نوجوان موصلی شاعر جو 545 ہجری میں حج کے قافلے کے ساتھ اس وقت ہلاک ہو گیا جب سلیم کا زعاب اس پر گرا اور بھیڑ تلوار، بھوک اور پیاس سے مر گئی۔ اس کی آیات عماد الدین کی خریدہ اور الحزیری کی زینت الدہر میں جمع کی گئی ہیں۔ 230-231}۔"
  tr: "Musullu olan şair Yusuf ibn Durra, aslen Musul'dan olan ve zeki bir gençti. Ebu Şuca' ibn el-Dahhan tarihinde, 545 Hicri yılında Hac ile birlikte öldüğünü ve Süleym'in ünlü bir kolu olan Za'ab'ın onlara geldiğini belirtmiştir. Hacıların çoğu ölüm, açlık ve susuzluktan öldü. İsfahan'ın kâtipi İmad el-Din, onu Kharida al-Kasr'da, Ebu el-Ma'ali el-Haziri'yi ise Zina al-Dahr'da anmıştır. Ünlü şiirlerinden biri, bacaklı bir adam hakkında şöyle bir sözü vardır: 'Topuğu yuvarlaktı, bu yüzden onu bir tepe, bir bitki ve bir taht olarak aldı ve bunları tabutta çıkardı {atıf:wafayat-ayan s. 230-231}."
  id: "Yusuf ibn Durra, penyair yang dikenal sebagai Ibn al-Durra, berasal dari Mosul, adalah seorang pemuda yang cerdas. Abu Shuja' ibn al-Dahhan menyebutkan dalam sejarahnya bahwa ia meninggal bersama al-Hajj pada tahun 545 H ketika Za'ab—cabang Sulaym yang terkenal—datang kepada mereka. Banyak peziarah meninggal karena kematian, kelaparan, dan haus. Imad al-Din, juru tulis Isfahan, menyebutnya dalam Kharida al-Qasr dan Abu al-Ma'ali al-Haziri dalam Zina al-Dahr. Di antara puisinya yang terkenal adalah perkataannya tentang seorang pria berkaki: 'Tumitnya bulat, sehingga ia menganggapnya sebagai sebuah bukit, sebuah tanaman, dan sebuah takhta, yang ia bawa keluar dalam peti mati {cite:wafayat-ayan hlm. 230-231}."
