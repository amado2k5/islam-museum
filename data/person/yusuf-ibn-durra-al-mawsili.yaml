summary:
  ar: "يوسف بن درة الشاعر المعروف بابن الدّرّى، الموصلي الأصل؛ كان شاباً ذكياً، ذكره أبو شجاع بن الدهان في تاريخه أنه هلك مع الحاج سنة خمس وأربعين وخمسمائة لما خرجت عليهم زعب — بطن مشهور من سليم — فهلك من الحجاج خلق كثير قتلاً وجوعاً وعطشاً، وذكره عماد الدين الكاتب الأصبهاني في خريدة القصر وأبو المعالي الحظيري في زينة الدهر، ومن مشهور شعره قوله في رجل أرجل: مدوّر الكعب فاتخذه لتل غرس وثل عرش أخرجها في بنات نعش {cite:wafayat-ayan p. 230-231}."
  en: "Yusuf ibn Durra 'Ibn al-Darra' — the sharp young Mosuli poet who perished with the Hajj caravan in 545 AH when the Za'b of Sulaym fell upon it and multitudes died by sword, hunger and thirst; his verses were gathered in Imad al-Din's Kharida and al-Haziri's Zinat al-Dahr {cite:wafayat-ayan p. 230-231}."
