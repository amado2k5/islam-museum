label: { ar: "مدعم مولى رسول الله", en: "Mid'am, the Prophet's freedman", es: "Mid'am, the Prophet's freedman", fr: "Mid'am, the Prophet's freedman", ur: "میثم، پیغمبر کا آزاد کرنے والا" }
summary:
  ar: "غلام النبي المعروف بمدعم، رمي بسهم فقتل في غزاة وادي القرى، ولأجلها زاد الواقدي على قول ابن إسحاق أن النبي قاتل في إحدى عشرة غزوة {cite:muruj-al-dhahab p. 580}."
  en: "The Prophet's servant Mid'am — shot dead by an arrow at Wadi'l-Qura, the combat for which al-Waqidi counts the Prophet in eleven raids against Ibn Ishaq's nine {cite:muruj-al-dhahab p. 580}."
  es: "El sirviente del Profeta, Mid'am, fue asesinado a tiros por una flecha en Wadi'l-Qura, combate por el cual al-Waqidi cuenta al Profeta en once incursiones contra las nueve de Ibn Ishaq {cite:muruj-al-dhahab p. 580}."
  fr: "Le serviteur du Prophète, Mid'am, tué par une flèche à Wadi'l-Qura, combat pour lequel al-Waqidi compte le Prophète dans onze raids contre les neuf d'Ibn Ishaq {cite:muruj-al-dhahab p. 580}."
  ur: "پیغمبر کا خادم مدعام - وادی القراء میں ایک تیر سے مارا گیا، یہ لڑائی جس کے لئے الواقدی نے پیغمبر کو ابن اسحاق کے نو کے خلاف گیارہ چھاپوں میں شمار کیا ہے {حوالہ: مروج الذہب صفحہ 580}۔"
  tr: "Peygamber'in hizmetkârı Mu'dam, Vadi el-Kura baskınlarında okla vurularak öldürüldü. Bu nedenle, el-Vaqidi, İbn İshaq'ın Peygamber'in on bir savaşta savaştığını belirtmesine ekledi {atıf:muruj-al-dhahab, s. 580}."
  id: "Hamba Nabi, yang dikenal sebagai Mu'dam, ditembak panah dan tewas dalam serangan Wadi al-Qura. Karena alasan ini, al-Waqidi menambahkan pernyataan Ibn Ishaq bahwa Nabi bertempur dalam sebelas pertempuran {cite:muruj-al-dhahab, hlm. 580}."
