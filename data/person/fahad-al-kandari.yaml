summary:
  ar: "قارئ قرآن ومقدم برامج كويتي، وُلد في الكويت سنة 1982، وهو إمام المسجد الكبير في مدينة الكويت. بدأ إمامة المصلين في الرابعة عشرة من عمره وأتم حفظ القرآن في الخامسة عشرة، واشتهر ببرامجه التلفزيونية مثل «مسافر مع القرآن» و«بالقرآن اهتديت» و«وسام القرآن»، وتنشر قناته الرسمية على يوتيوب تلاواته وبرامجه لجمهور واسع."
  en: "Kuwaiti Qur'an reciter and television presenter, born in Kuwait in 1982, and imam of the Grand Mosque in Kuwait City. He began leading prayer at fourteen and completed memorising the Qur'an at fifteen, and became known for television programmes such as Musafir ma'a al-Qur'an (Traveller with the Qur'an), Bil-Qur'an Ihtadayt (Guided by the Qur'an) and Wisam al-Qur'an; his official YouTube channel publishes his recitations and programmes to a wide audience."
  ur: "کویتی قاریِ قرآن اور ٹیلی ویژن پیش کار، جو 1982 میں کویت میں پیدا ہوئے اور کویت شہر کی جامع مسجد کے امام ہیں۔ انہوں نے چودہ برس کی عمر میں امامت شروع کی اور پندرہ برس کی عمر میں حفظِ قرآن مکمل کیا، اور «مسافر مع القرآن»، «بالقرآن اهتديت» اور «وسام القرآن» جیسے ٹیلی ویژن پروگراموں سے مشہور ہوئے؛ ان کا رسمی یوٹیوب چینل ان کی تلاوتیں اور پروگرام وسیع ناظرین تک پہنچاتا ہے۔"
