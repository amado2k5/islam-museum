summary:
  ar: "عمار بن أبي الخصيب؛ جرى على يديه بناء المسجد الجامع في مدينة المهدي المحمدية بالري وكتب اسمه على حائطه وكان البناء مؤرخاً سنة ثمان وخمسين ومائة."
  en: "Ammar ibn Abi al-Khasib; the builder who executed the congregational mosque of al-Mahdi's al-Muhammadiyya at Rayy — his name inscribed on its wall — in the building dated 158 AH."
  es: "Ammar ibn Abi al-Khasib; el constructor que mandó construir la mezquita congregacional de al-Mahdi's al-Muhammadiyya en Rayy —su nombre está inscrito en su muro— en el edificio que data del año 158 AH."
  fr: "Ammar ibn Abi al-Khasib; le constructeur qui a réalisé la mosquée du vendredi de l'al-Muhammadiyya d'al-Mahdi à Rayy — son nom est inscrit sur son mur — dans le bâtiment daté de 158 AH."
  ur: "عمار بن ابی الخصیب؛ وہ بلڈر جس نے رے میں المہدی کی آل محمدیہ کی اجتماعی مسجد کو انجام دیا - اس کا نام اس کی دیوار پر کندہ ہے - اس عمارت میں 158 ہجری۔"
  tr: "Ammar bin Ebi el-Hasib; onun liderliğinde Rayy'deki El-Mehdi el-Muhammediye şehrinde Büyük Camii inşa edildi ve adı duvarına kazındı. Bina 158 H yılına tarihlendi."
  id: "Ammar ibn Abi al-Khasib; di bawah kepemimpinannya, pembangunan Masjid Agung di kota Al-Mahdi al-Muhammadiyah di Rayy, dan namanya terukir di dindingnya. Bangunan tersebut bertanggal tahun 158 H."
