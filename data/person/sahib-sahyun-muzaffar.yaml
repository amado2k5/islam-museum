  ar: "صاحب قلعة صهيون؛ تملكها بعد والده ثلاثاً وثلاثين سنة وكان حازماً سايساً مهيباً؛ عمر تسعين سنة ودفن بقلعة صهيون وتملك بعده ابنه سيف الدين محمد {cite:shadharat-dhahab p. 306}."
