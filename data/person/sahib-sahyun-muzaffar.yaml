  es: "Señor del castillo de Sahyun durante treinta y tres años después de su padre: «resuelto, autoritario, imponente»; vivió noventa años, fue enterrado en el castillo y su hijo Sayf al-Din Muhammad le sucedió {cite:shadharat-dhahab p. 306}."
  fr: "Seigneur du château de Sahyun pendant trente-trois ans après son père — « résolu, autoritaire, impressionnant »; il vécut quatre-vingt-dix ans, fut enterré dans le château, et son fils Sayf al-Din Muhammad lui succéda {cite: shadharat-dhahab p. 306}."
  ur: "اپنے والد کے بعد تینتیس سال تک سہیون قلعے کا لارڈ - 'پرعزم، کمانڈنگ، خوفناک'؛ وہ نوے سال زندہ رہے، قلعہ میں دفن ہوئے، اور اس کا بیٹا سیف الدین محمد جانشین ہوا۔ 306}۔"
