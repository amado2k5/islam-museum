summary:
  ar: "من ولد مالك بن حنظلة بن مالك حليف بني نوفل بن عبد مناف، وأمه من بني مازن بن منصور؛ ارتدت خولان باليمن فسار إليها في خلافة أبي بكر فقاتلها حتى أذعنت وأقرت بالصدقة — وقيل لم يلق حرباً فرجعوا إلى الإسلام؛ فصارت اليمن بين ثلاثة: المهاجر بن أبي أمية على صنعاء ومخاليفها، وزياد بن لبيد على ما كان في يده، ويعلى. وعند المسعودي خلف خمسمائة ألف دينار وديوناً على الناس وعقارات وغير ذلك من التركة ما قيمته ثلاثمائة ألف دينار {cite:muruj-al-dhahab p. 629}"
  en: "A descendant of Malik ibn Hanzala ibn Malik, confederate of Banu Nawfal ibn Abd Manaf, his mother of Banu Mazin ibn Mansur; when Khawlan apostatized in Yemen he campaigned against them under Abu Bakr until they yielded and affirmed the alms — some say he met no fighting and they returned to Islam — leaving Yemen between three: al-Muhajir ibn Abi Umayya over San'a and its districts, Ziyad ibn Labid over what was in his hands, and Ya'la."
