summary:
  ar: "من ولد مالك بن حنظلة بن مالك حليف بني نوفل بن عبد مناف، وأمه من بني مازن بن منصور؛ ارتدت خولان باليمن فسار إليها في خلافة أبي بكر فقاتلها حتى أذعنت وأقرت بالصدقة — وقيل لم يلق حرباً فرجعوا إلى الإسلام؛ فصارت اليمن بين ثلاثة: المهاجر بن أبي أمية على صنعاء ومخاليفها، وزياد بن لبيد على ما كان في يده، ويعلى. وعند المسعودي خلف خمسمائة ألف دينار وديوناً على الناس وعقارات وغير ذلك من التركة ما قيمته ثلاثمائة ألف دينار {cite:muruj-al-dhahab p. 629}"
  en: "A descendant of Malik ibn Hanzala ibn Malik, confederate of Banu Nawfal ibn Abd Manaf, his mother of Banu Mazin ibn Mansur; when Khawlan apostatized in Yemen he campaigned against them under Abu Bakr until they yielded and affirmed the alms — some say he met no fighting and they returned to Islam — leaving Yemen between three: al-Muhajir ibn Abi Umayya over San'a and its districts, Ziyad ibn Labid over what was in his hands, and Ya'la."
  es: "Descendiente de Malik ibn Hanzala ibn Malik, confederado de Banu Nawfal ibn Abd Manaf, su madre de Banu Mazin ibn Mansur; cuando Khawlan apostató en Yemen, hizo campaña contra ellos bajo el mando de Abu Bakr hasta que se rindieron y confirmaron la limosna —algunos dicen que no encontró lucha y que volvieron al Islam— dejando Yemen entre tres: al-Muhajir ibn Abi Umayya sobre Sana y sus distritos, Ziyad ibn Labid sobre lo que estaba en sus manos y Ya'la."
  fr: "Descendant de Malik ibn Hanzala ibn Malik, confédéré de Banu Nawfal ibn Abd Manaf, sa mère de Banu Mazin ibn Mansur; lorsque Khawlan apostasia au Yémen, il fit campagne contre eux sous Abu Bakr jusqu'à ce qu'ils cèdent et confirment l'aumône — certains disent qu'il ne rencontra aucun combat et qu'ils retournèrent à l'islam — laissant le Yémen entre trois: al-Muhajir ibn Abi Umayya sur San'a et ses districts, Ziyad ibn Labid sur ce qui était entre ses mains, et Ya'la."
  ur: "مالک بن حنظلہ بن مالک کی اولاد، بنو نوفل بن عبد مناف کے اتحادی، بنو مازن بن منصور کی والدہ؛ جب خولان نے یمن میں ارتداد کیا تو اس نے ابوبکر کے ماتحت ان کے خلاف مہم چلائی یہاں تک کہ انہوں نے صدقہ دیا اور اس کی تصدیق کی - کچھ کہتے ہیں کہ اس کی کوئی لڑائی نہیں ہوئی اور وہ اسلام میں واپس آئے - یمن کو تین کے درمیان چھوڑ دیا: المہاجر ابن ابی امیہ صنعاء اور اس کے اضلاع پر، زیاد بن لبید جو اس کے ہاتھ میں تھا،"
