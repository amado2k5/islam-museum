label: { ar: "السلطان بركياروق بن ملكشاه" }
summary:
  ar: "ابن ملكشاه، خرج على أخيه محمود ابن الخمس لما استحلفت له أمه تركان الأمراء فقلده الخليفة المقتدي ولقبه ركن الدين في محرم سنة سبع وثمانين، وقتل السلطان أرسلان أرغون بن ألب أرسلان صاحب خراسان سنة تسعين فتملكها بركياروق ودانت له البلاد والعباد، وخرج عليه أخوه محمد بن ملكشاه {cite:tarikh-khulafa-minhaj-1434 p. 653,656-657}، ومات سنة ثمان وتسعين فأقام الأمراء بعده ولده جلال الدولة ملكشاه وله دون خمس سنين فخرج عمه محمد فاجتمعت الكلمة عليه {cite:tarikh-khulafa-minhaj-1434 p. 659}."
  en: "Malikshah's son; he rose against his five-year-old brother Mahmud and was invested by al-Muqtadi as Rukn al-Din in Muharram 487, took Khurasan when Arslan Arghun was killed in 490, and was then fought by his brother Muhammad {cite:tarikh-khulafa-minhaj-1434 p. 653,656-657}."
