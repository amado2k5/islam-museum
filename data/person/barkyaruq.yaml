id: person/barkyaruq
class: person
label: { ar: "السلطان بركياروق بن ملكشاه" }
summary:
  ar: "ابن ملكشاه، خرج على أخيه محمود ابن الخمس لما استحلفت له أمه تركان الأمراء فقلده الخليفة المقتدي ولقبه ركن الدين في محرم سنة سبع وثمانين، وقتل السلطان أرسلان أرغون بن ألب أرسلان صاحب خراسان سنة تسعين فتملكها بركياروق ودانت له البلاد والعباد، وخرج عليه أخوه محمد بن ملكشاه {cite:tarikh-khulafa-minhaj-1434 p. 653,656-657}، ومات سنة ثمان وتسعين فأقام الأمراء بعده ولده جلال الدولة ملكشاه وله دون خمس سنين فخرج عمه محمد فاجتمعت الكلمة عليه {cite:tarikh-khulafa-minhaj-1434 p. 659}."
  en: "Malikshah's son; he rose against his five-year-old brother Mahmud and was invested by al-Muqtadi as Rukn al-Din in Muharram 487, took Khurasan when Arslan Arghun was killed in 490, and was then fought by his brother Muhammad {cite:tarikh-khulafa-minhaj-1434 p. 653,656-657}."
  es: "Hijo de Malikshah; se alzó contra su hermano Mahmud, de cinco años, y fue investido por al-Muqtadi como Rukn al-Din en Muharram 487, tomó Jorasán cuando Arslan Arghun fue asesinado en 490, y luego fue combatido por su hermano Muhammad {cite:tarikh-khulafa-minhaj-1434 p. 653,656-657}."
  fr: "Le fils de Malikshah; il se souleva contre son frère Mahmud, âgé de cinq ans, et fut investi par al-Muqtadi comme Rukn al-Din en Muharram 487, prit le Khorasan lorsque Arslan Arghun fut tué en 490, et fut ensuite combattu par son frère Muhammad {cite:tarikh-khulafa-minhaj-1434 p. 653,656-657}."
  ur: "ملک شاہ کا بیٹا؛ وہ اپنے پانچ سالہ بھائی محمود کے خلاف کھڑا ہوا اور المقتدی نے محرم 487 میں رکن الدین کے طور پر سرمایہ کاری کی، خراسان پر قبضہ کیا جب ارسلان ارغون 490 میں مارا گیا، اور اس کے بعد اس کے بھائی محمد نے اس کا مقابلہ کیا۔ 653,656-657}۔"
  tr: "İbn Malikşah, annesi Turkan al-Umra ona yemin ettiğinde kardeşi Mahmud bin el-Hums'a karşı isyan etti. Halife el-Muktadi onu hapse attı ve seksen yedinci yılın Muharrem'inde Rukn al-Din unvanını verdi. Doksan yılında Horasan'ın hükümdarı olan Sultan Arslan Arghun ibn Alp Arslan, Barkiyaruq tarafından öldürüldü ve ülke ile halkı onun için mahvoldu. Kardeşi Muhammed bin Malikşah ona karşı isyan etti {alıntı:Tarih-Khulafa-minhaj-1434, s. 653,656-657} ve doksan sekizinci yılda öldü. Ondan sonra, beş yaşından küçük olan oğlu Celal al-Dawla Malikşah isyan etti ve söz ona karşı birleşti {cite:History-Khulafa-minhaj-1434, s. 659}."
  id: "Ibn Malikshah memberontak melawan saudaranya Mahmud ibn al-Khums ketika ibunya Turkan al-Umra berjanji kepadanya. Khalifah al-Muqtadi memenjarakannya dan memberinya gelar Rukn al-Din pada Muharram tahun delapan puluh tujuh. Sultan Arslan Arghun ibn Alp Arslan, penguasa Khorasan pada tahun sembilan puluh, dibunuh oleh Barkiyaruq, dan negara serta rakyatnya hancur baginya. Saudaranya Muhammad ibn Malikshah memberontak melawannya {cite:History-Khulafa-minhaj-1434, hlm. 653,656-657}, dan meninggal pada tahun sembilan puluh delapan. Setelah itu, putranya Jalal al-Dawla Malikshah, yang berusia di bawah lima tahun, memberontak, dan firman bersatu melawannya {cite:History-Khulafa-minhaj-1434, hlm. 659}."
