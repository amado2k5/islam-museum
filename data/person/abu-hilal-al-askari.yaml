  ar: "أبو هلال العسكري، وُلد وعاش في عسكر مكرم بخوزستان ودرس في أصفهان وبغداد والبصرة، وتاريخ ميلاده غير معروف على وجه الدقة ويُفهم من بيت له أنه وُلد في أوائل القرن الرابع الهجري. صاحب «الفروق اللغوية»."
