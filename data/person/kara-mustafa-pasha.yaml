summary:
  ar: "قره مصطفى باشا، الصدر الأعظم في عهد السلطان محمد الرابع؛ استطاع أن يوقف تدخل النساء في شئون السلطنة، وتمكن من القضاء على محاولات رجال البلاط السلطاني لإفساد الدولة، وقضى على العابثين والمفسدين وقاطعي الطريق في مختلف الولايات {cite:dawlat-uthmaniyya-salabi p. 307}."
  en: "Kara Mustafa Pasha — Mehmed IV's grand vizier who ended the women's interference in the sultanate and crushed palace corruption and highway robbery across the provinces {cite:dawlat-uthmaniyya-salabi p. 307}."
  es: "Kara Mustafa Pasha — gran visir de Mehmed IV que puso fin a la injerencia de las mujeres en el sultanato y aplastó la corrupción palaciega y el robo en los caminos de todas las provincias {cite:dawlat-uthmaniyya-salabi p. 307}."
  fr: "Kara Mustafa Pacha — Grand vizir de Mehmed IV qui mit fin à l'ingérence des femmes dans le sultanat et écrasa la corruption du palais et le vol sur les routes à travers les provinces {cite:dawlat-uthmaniyya-salabi p. 307}."
  ur: "کارا مصطفی پاشا - محمد چہارم کا عظیم وزیر جس نے سلطنت میں خواتین کی مداخلت کو ختم کیا اور صوبوں میں محلاتی بدعنوانی اور شاہراہ پر ڈکیتی کو کچل دیا۔ 307}۔"
