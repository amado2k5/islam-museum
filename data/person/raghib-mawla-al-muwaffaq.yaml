summary:
  ar: "خادم ومولى أبي أحمد الموفق، غزا في البحر سنة خمس وثمانين ومائتين فأظفره الله بمراكب كثيرة من الروم وبجميع ما فيها، فضُربت أعناق ثلاثة آلاف منهم وأُحرقت المراكب وفُتح حصون كثيرة {cite:muntazam-ibn-al-jawzi p. 295}."
  en: "A client of Abu Ahmad al-Muwaffaq; in 285 he led a naval raid that took many Byzantine ships, beheaded three thousand, burned the vessels and captured fortresses {cite:muntazam-ibn-al-jawzi p. 295}."
  es: "Cliente de Abu Ahmad al-Muwaffaq; en 285 dirigió una incursión naval que capturó muchos barcos bizantinos, decapitó a tres mil, quemó las embarcaciones y capturó fortalezas {cite:muntazam-ibn-al-jawzi p. 295}."
  fr: "Client d'Abu Ahmad al-Muwaffaq; en 285, il mena un raid naval qui prit de nombreux navires byzantins, décapita trois mille hommes, brûla les navires et captura des forteresses {cite:muntazam-ibn-al-jawzi p. 295}."
  ur: "ابو احمد الموفق کا مؤکل؛ 285 میں اس نے ایک بحری حملے کی قیادت کی جس میں بہت سے بازنطینی بحری جہاز لے گئے، تین ہزار کے سر قلم کیے گئے، کشتیوں کو جلایا اور قلعوں پر قبضہ کر لیا۔ 295}۔"
