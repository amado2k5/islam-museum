summary:
  ar: "عالم وفقيه مغربي، وُلد في وجدة في 21 رمضان 1368 (17 يوليو 1949). تتلمذ على الفقيه بنسعيد مهداوي، ونال شهادات من كلية الشريعة بفاس ودار الحديث الحسنية وجامعتي محمد الخامس ومحمد الأول حيث درّس الدراسات الإسلامية. ترأس المجلس العلمي المحلي بوجدة ثم المجلس العلمي الجهوي بجهة الشرق، وهو عضو بالمجلس العلمي الأعلى ومدير معهد البعث الإسلامي بوجدة، وألقى ثلاثة دروس حسنية أمام الملك محمد السادس. له مؤلفات في الفقه واللغة والتربية، منها «شخصية الفقه المالكي»."
  en: "Moroccan Muslim scholar and jurist, born at Oujda on 21 Ramadan 1368 (17 July 1949). He studied under the jurist Bensaid Mahdawi and took degrees from the Faculty of Sharia at Fez, Dar al-Hadith al-Hassania and the universities Mohammed V and Mohammed I, where he taught Islamic studies. He presided over the local scientific council of Oujda and then over the regional scientific council for the Oriental region, is a member of the Supreme Scientific Council and director of the Baath Islamic Institute at Oujda, and delivered three Ramadan Hassania lectures before King Mohammed VI. His works cover jurisprudence, language and education, among them 'The Character of Maliki Jurisprudence'."
  ur: "مراکشی مسلمان عالم اور فقیہ، 21 رمضان 1368ھ (17 جولائی 1949ء) کو وجدة میں پیدا ہوئے۔ انھوں نے فقیہ بن سعید مہداوی سے تعلیم حاصل کی اور فاس کی کلیۂ شریعت، دار الحدیث الحسنیہ اور جامعات محمد خامس و محمد اول سے اسناد لیں، جہاں وہ اسلامی مطالعات کی تدریس بھی کرتے رہے۔ وہ وجدة کی مقامی علمی کونسل اور پھر مشرقی خطے کی علاقائی علمی کونسل کے صدر رہے، سپریم سائنٹفک کونسل کے رکن اور وجدة میں معہد البعث الاسلامی کے ڈائریکٹر ہیں، اور شاہ محمد ششم کے سامنے تین دروسِ حسنیہ پیش کر چکے ہیں۔ ان کی تصانیف فقہ، زبان اور تعلیم پر ہیں، جن میں «شخصیتِ فقہِ مالکی» بھی شامل ہے۔"
