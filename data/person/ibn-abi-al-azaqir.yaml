id: person/ibn-abi-al-azaqir
class: person
label: { ar: "ابن أبي العزاقر", en: "Ibn Abi Al Azaqir" }
summary:
  ar: "أبو جعفر محمد بن علي الشلمغاني المعروف بابن أبي العزاقر، قال ابن النديم قد استقصيت ذكره في أخبار الشيعة، وكان له قدم في صناعة الكيمياء وله من الكتب كتاب الخمائر وكتاب الحجر وكتاب شرح كتاب الرحمة لجابر وكتاب البرانيات {cite:fihrist-ibn-al-nadim p. 507}. وعند ابن الأثير أحدث مذهباً عالياً في التشيع والتناسخ وحلول الإلهية واتصل بالمحسن بن أبي الحسن بن الفرات في وزارة أبيه الثالثة، وكانوا يعتقدون فيه ومنهم قيل الحسين بن القاسم ابن وهب الذي وزر للمقتدر وأبو جعفر ابن أبي عون وإبراهيم بن محمد بن أبي عون وابن شبيب الزيات وأحمد بن محمد بن عبدوس، وقُبض عليه في شوال 322هـ في وزارة ابن مقلة وصُلب وأُحرق في ذي القعدة وكان من مذهبه أن الله يحل في كل شيء وأن اللاهوت ظهر في خمسة ناسوتية وخمسة أبالسة أعداء لهم {cite:kamil-ibn-al-athir p. 218-219}"
  en: "Ibn Abi al-Azaqir al-Shalmaghani — Shi'a figure with standing in alchemy {cite:fihrist-ibn-al-nadim}"
