label: { ar: "ابن أبي العزاقر", en: "Ibn Abi Al Azaqir", es: "Ibn Abi Al Azaqir", fr: "Ibn Abi Al Azaqir", ur: "ابن ابی الازقر" }
summary:
  ar: "أبو جعفر محمد بن علي الشلمغاني المعروف بابن أبي العزاقر، قال ابن النديم قد استقصيت ذكره في أخبار الشيعة، وكان له قدم في صناعة الكيمياء وله من الكتب كتاب الخمائر وكتاب الحجر وكتاب شرح كتاب الرحمة لجابر وكتاب البرانيات {cite:fihrist-ibn-al-nadim p. 507}. وعند ابن الأثير أحدث مذهباً عالياً في التشيع والتناسخ وحلول الإلهية واتصل بالمحسن بن أبي الحسن بن الفرات في وزارة أبيه الثالثة، وكانوا يعتقدون فيه ومنهم قيل الحسين بن القاسم ابن وهب الذي وزر للمقتدر وأبو جعفر ابن أبي عون وإبراهيم بن محمد بن أبي عون وابن شبيب الزيات وأحمد بن محمد بن عبدوس، وقُبض عليه في شوال 322هـ في وزارة ابن مقلة وصُلب وأُحرق في ذي القعدة وكان من مذهبه أن الله يحل في كل شيء وأن اللاهوت ظهر في خمسة ناسوتية وخمسة أبالسة أعداء لهم {cite:kamil-ibn-al-athir p. 218-219}"
  en: "Ibn Abi al-Azaqir al-Shalmaghani — Shi'a figure with standing in alchemy {cite:fihrist-ibn-al-nadim}"
  es: "Ibn Abi al-Azaqir al-Shalmaghani - Figura chiita de pie en alquimia {cita:fihrist-ibn-al-nadim}"
  fr: "Ibn Abi al-Azaqir al-Shalmaghani - Figure chiite avec position en alchimie {cite: fihrist-ibn-al-nadim}"
  ur: "ابن ابی الازقر الشلمغانی - کیمیا میں کھڑے شیعہ شخصیت"
  tr: "Ebu Ca'far Muhammed bin Ali el-Şalmağani, İbn Ebi el-Azaqir olarak bilinir, şöyle demiştir: Şiilerin raporlarında onu ayrıntılı şekilde andım. Simya alanında önemli bir rol oynamış ve 'Kitab al-Khama'ir', 'Kitab al-Hajar', Jabir'in 'Şerh Kitab al-Rahmah' ve 'Kitab al-Baraniyat' (atıf:Fihrist-ibn-al-nadim s. 507} gibi kitaplar yazmıştır. İbn al-Athir ile birlikte Şiilik, reenkarnasyon ve ilahi geliş konusunda yüksek bir öğreti kurdu. Babası üçüncü görev döneminde el-Muhsin ibn Ebi el-Hasan ibn el-Furat ile bağlantı kurdu ve onlar ona inandılar. Bunlar arasında, el-Muktadir'e bakan olarak atanan el-Hüseyin ibn Kasım ibn Vahb, Ebu Cafer ibn Abi Avn, İbrahim ibn Muhammed ibn Ebi Avn, İbn Şabib el-Zeyyat ve Ahmed ibn Muhammed ibn Abdus vardı. 322 Hicri Shavval'da İbn Muqalla'nın hizmetinde yakalandı, çarmıha gerildi ve Zhu'd-Qi'dah'ta yakıldı. Onun öğretisi, Allah'ın her şeyde yasal olduğu ve ilahiliğin beş dünyevi ve beş şeytani düşmanda ortaya çıktığı yönündeydi {atıf: Kamil-ibn-al-Athir s. 218-219}"
  id: "Abu Ja'far Muhammad ibn Ali al-Shalmaghani, yang dikenal sebagai Ibn Abi al-Azaqir, berkata: Saya telah menyebutkannya secara mendalam dalam laporan Syiah. Ia memiliki peran penting di bidang alkimia dan menulis buku-buku seperti 'Kitab al-Khama'ir', 'Kitab al-Hajar', 'Sharh Kitab al-Rahmah' oleh Jabir, dan 'Kitab al-Baraniyat' {cite:fihrist-ibn-al-nadim hlm. 507}. Bersama Ibn al-Athir, ia menetapkan doktrin tinggi dalam Syiah, reinkarnasi, dan kedatangan ketuhanan. Ia berhubungan dengan al-Muhsin ibn Abi al-Hasan ibn al-Furat selama masa pemerintahan ketiga ayahnya, dan mereka percaya kepadanya. Di antara mereka adalah al-Husayn ibn al-Qasim ibn Wahb, yang diangkat menjadi menteri al-Muqtadir, Abu Ja'far ibn Abi Awn, Ibrahim ibn Muhammad ibn Abi Awn, Ibn Shabib al-Zayyat, dan Ahmad ibn Muhammad ibn Abdus. Ia ditangkap pada Shawwal tahun 322 H dalam pelayanan Ibn Muqalla, disalibkan, dan dibakar dalam Dhu al-Qi'dah. Doktrin beliau adalah bahwa Allah itu maha berkah dalam segala hal, dan bahwa ketuhanan muncul dalam lima musuh duniawi dan lima musuh jahat {cite:kamil-ibn-al-athir hlm. 218-219}"
