summary:
  ar: "أبو جعفر محمد بن علي الشلمغاني المعروف بابن أبي العزاقر، قال ابن النديم قد استقصيت ذكره في أخبار الشيعة، وكان له قدم في صناعة الكيمياء وله من الكتب كتاب الخمائر وكتاب الحجر وكتاب شرح كتاب الرحمة لجابر وكتاب البرانيات {cite:fihrist-ibn-al-nadim p. 507}."
  en: "Ibn Abi al-Azaqir al-Shalmaghani — Shi'a figure with standing in alchemy {cite:fihrist-ibn-al-nadim}"
