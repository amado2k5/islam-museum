summary:
  ar: "خان بخارى الشيباني (الخان الأعلى 1583–1598)، ابن إسكندر خان. وحّد الإمارات الشيبانيّة من جديد، وأخذ بخارى سنة 1557، وفتح بلخ وطشقند وفرغانة وبدخشان وخراسان وخوارزم، وأصلح سكّ العملة، ومات في سمرقند."
  en: "Shaybanid khan of Bukhara (supreme khan 1583–1598), son of Iskandar Khan. He reunified the Shaybanid appanages, took Bukhara in 1557, conquered Balkh, Tashkent, Fergana, Badakhshan, Khorasan and Khwarazm, reformed the coinage, and died at Samarkand."
  ur: "بخارا کے شیبانی خان (خانِ اعلیٰ 1583–1598ء)، اسکندر خان کے بیٹے۔ انھوں نے شیبانی ریاستوں کو دوبارہ متحد کیا، 1557ء میں بخارا لیا، بلخ، تاشقند، فرغانہ، بدخشاں، خراسان اور خوارزم فتح کیے، سکوں کی اصلاح کی اور سمرقند میں وفات پائی۔"
