summary:
  ar: "لاعب كرة قدم مالي (1946–2023)، وُلد وتوفي في باماكو. مهاجم بدأ مع ريال باماكو وستاد ماليان، ثم صار أيقونة سانت إتيان بطلًا لفرنسا ثلاث مرات وفائزًا بكأسها مرتين، ولعب لمرسيليا وفالنسيا وسبورتينغ لشبونة، وكان أول فائز بجائزة أفضل لاعب أفريقي سنة 1970، ولُقّب بـ«النمر الأسود». وهو غير الموسيقي ساليف كيتا (مواليد 1949)."
  en: "Malian footballer (1946–2023), born and died in Bamako. A striker who began with Real Bamako and Stade Malien, became an icon at Saint-Étienne — three French league titles and two French Cups — and played for Marseille, Valencia and Sporting CP; he was the first winner of the African Footballer of the Year award in 1970 and was nicknamed the 'Black Panther'. He is not the musician Salif Keita (born 1949)."
  ur: "مالی کے فٹبالر (1946–2023)، باماکو میں پیدا ہوئے اور وہیں وفات پائی۔ اسٹرائیکر جنہوں نے ریال باماکو اور ستاد مالین سے آغاز کیا، پھر سینٹ ایٹیئن کے نمایاں کھلاڑی بنے — تین فرانسیسی لیگ خطاب اور دو فرانسیسی کپ — اور مارسیلی، ویلنسیا اور اسپورٹنگ لزبن کے لیے کھیلے؛ 1970 میں افریقہ کے بہترین فٹبالر کا ایوارڈ پانے والے پہلے کھلاڑی تھے اور «بلیک پینتھر» کہلائے۔ وہ موسیقار سلیف کیتا (پیدائش 1949) نہیں ہیں۔"
