summary:
  ar: "لاعب كرة قدم مالي (1946–2023)، وُلد وتوفي في باماكو. مهاجم بدأ مع ريال باماكو وستاد ماليان، ثم صار أيقونة سانت إتيان بطلًا لفرنسا ثلاث مرات وفائزًا بكأسها مرتين، ولعب لمرسيليا وفالنسيا وسبورتينغ لشبونة، وكان أول فائز بجائزة أفضل لاعب أفريقي سنة 1970، ولُقّب بـ«النمر الأسود». وهو غير الموسيقي ساليف كيتا ⁦(مواليد 1949)⁩."
  en: "Malian footballer (1946–2023), born and died in Bamako. A striker who began with Real Bamako and Stade Malien, became an icon at Saint-Étienne — three French league titles and two French Cups — and played for Marseille, Valencia and Sporting CP; he was the first winner of the African Footballer of the Year award in 1970 and was nicknamed the 'Black Panther'. He is not the musician Salif Keita (born 1949)."
  ur: "مالی کے فٹبالر (1946–2023)، باماکو میں پیدا ہوئے اور وہیں وفات پائی۔ اسٹرائیکر جنہوں نے ریال باماکو اور ستاد مالین سے آغاز کیا، پھر سینٹ ایٹیئن کے نمایاں کھلاڑی بنے — تین فرانسیسی لیگ خطاب اور دو فرانسیسی کپ — اور مارسیلی، ویلنسیا اور اسپورٹنگ لزبن کے لیے کھیلے؛ 1970 میں افریقہ کے بہترین فٹبالر کا ایوارڈ پانے والے پہلے کھلاڑی تھے اور «بلیک پینتھر» کہلائے۔ وہ موسیقار سلیف کیتا ⁦(پیدائش 1949)⁩ نہیں ہیں۔"
  es: "Futbolista maliense (1946-2023), nacido y fallecido en Bamako. Delantero que comenzó su carrera en el Real Bamako y el Stade Malien, se convirtió en un ícono del Saint-Étienne —ganó tres títulos de liga y dos Copas de Francia— y jugó en el Marsella, el Valencia y el Sporting CP. Fue el primer ganador del premio al Futbolista Africano del Año en 1970 y fue apodado la «Pantera Negra». No se trata del músico Salif Keita (nacido en 1949)."
  fr: "Footballeur malien (1946-2023), né et mort à Bamako. Attaquant, il a débuté au Real Bamako et au Stade Malien, avant de devenir une figure emblématique de Saint-Étienne (trois titres de champion de France et deux Coupes de France). Il a également joué pour Marseille, Valence et le Sporting CP. Premier Ballon d'Or africain en 1970, il était surnommé la « Panthère noire ». À ne pas confondre avec le musicien Salif Keita (né en 1949)."
  tr: "Malili futbolcu (1946–2023), Bamako'da doğup vefat etti. Real Bamako ve Stade Maliane'de başlayan bir forvet, ardından üç kez Fransa şampiyonu ve iki kez kupa kazanan Saint-Étienne'nin simgesi haline geldi. Marsilya, Valensiya ve Sporting Lizbon'da oynadı, 1970'te ödülü kazanan ilk Afrikalı oyuncu oldu ve 'Kara Panter' lakabını aldı. Müzisyen Salif Keita değil (1949 doğumlu)."
  id: "Pesepakbola Mali (1946–2023), lahir dan meninggal di Bamako. Seorang penyerang yang memulai karier di Real Bamako dan Stade Maliane, kemudian menjadi ikon Saint-Étienne, juara Prancis tiga kali dan juara piala dua kali. Ia bermain untuk Marseille, Valencia, dan Sporting Lisbon, menjadi pemain Afrika pertama yang memenangkan penghargaan tersebut pada tahun 1970, dan dijuluki 'Black Panther.' Ia bukan musisi Salif Keita (lahir 1949)."
