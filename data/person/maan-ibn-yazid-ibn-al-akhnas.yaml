  fr: "Ma'n ibn Yazid ibn al-Akhnas (Companion)"
summary:
  ar: "معن بن يزيد بن الأخنس بن حبيب السلمي، أبو يزيد، صحابي من بني مالك بن خفاف. روى عن النبي، وروى عنه أبو الجويرية الجرمي وسهيل بن ذراع وعتبة بن رافع. كانت له مكانة عند عمر بن الخطاب، وشهد بدراً وفتح دمشق، ونزل الكوفة ثم دخل مصر وسكن الشام، وشهد صفين مع معاوية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6455}"
  en: "Ma'n ibn Yazid ibn al-Akhnas al-Sulami, Abu Yazid, a Companion from the clan of Banu Malik ibn Khafaf. He narrated from the Prophet, and Abu al-Juwayriya al-Jarmi, Suhayl ibn Dharr and Utba ibn Rafi' narrated from him. He held a standing with Umar ibn al-Khattab, fought at Badr and at the conquest of Damascus, lived in Kufa, entered Egypt and then settled in Syria, and fought at Siffin with Mu'awiya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6455}"
  ur: "معن بن یزید بن اخنس السلمی، ابو یزید، بنو مالک بن خفاف قبیلے کا صحابی؛ نبی سے روایت کیا اور ان سے دوسروں نے بھی روایت کیا۔"
  es: "Ma'n ibn Yazid ibn al-Akhnas al-Sulami, Abu Yazid, un Compañero del clan Banu Malik ibn Khafaf. Narró del Profeta, y Abu al-Juwayriya al-Jarmi, Suhayl ibn Dharr y Utba ibn Rafi' narraron de él. Mantuvo una posición de confianza con Umar ibn al-Khattab, luchó en Badr y en la conquista de Damasco, vivió en Kufa, entró en Egipto y luego se estableció en Siria, y luchó en Siffin con Mu'awiya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6455}"
  fr: "Ma'n ibn Yazid ibn al-Akhnas al-Sulami, Abu Yazid, Compagnon du clan des Banu Malik ibn Khafaf, rapporta des hadiths du Prophète. Abu al-Juwayriya al-Jarmi, Suhayl ibn Dharr et Utba ibn Rafi' rapportèrent également de lui. Il était proche d'Umar ibn al-Khattab, combattit à Badr et lors de la prise de Damas, vécut à Koufa, se rendit en Égypte puis s'établit en Syrie, et combattit à Siffin aux côtés de Mu'awiya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6455}"
  tr: "Ma'n ibn Yazid ibn al-Akhnas ibn Habib al-Sulami, Ebu Yezid, Banu Malik ibn Khafaf'tan bir sahabe. Peygamber'den rivayet etti, Ebu al-Juwayriyah al-Jurmi, Suhail ibn Dhira' ve Utbah ibn Rafi'yi ondan rivayet etti. Umar ibn al-Hattab ile birlikte görev yaptı, Badr'ın Şam'ın fethine tanıklık etti, Kufe'ye yerleşti, sonra Mısır'a girdi, Levant'a yerleşti ve Muaviye ile Sifin'e katıldı. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.6455}"
  id: "Ma'n ibn Yazid ibn al-Akhnas ibn Habib al-Sulami, Abu Yazid, sahabat dari Banu Malik ibn Khafaf. Ia menceritakan dari Nabi, dan Abu al-Juwayriyah al-Jurmi, Suhail ibn Dhira', serta Utbah ibn Rafi' menceritakan darinya. Ia memegang jabatan bersama Umar ibn al-Khattab, menyaksikan Badr, penaklukan Damaskus, menetap di Kufa, lalu masuk ke Mesir, menetap di Levant, dan ikut serta dalam Siffin bersama Muawiyah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6455}"
