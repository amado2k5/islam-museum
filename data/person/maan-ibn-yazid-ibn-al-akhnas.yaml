  en: "Ma'n ibn Yazid ibn al-Akhnas (Companion)"
summary:
  ar: "معن بن يزيد بن الأخنس بن حبيب السلمي، أبو يزيد، صحابي من بني مالك بن خفاف. روى عن النبي، وروى عنه أبو الجويرية الجرمي وسهيل بن ذراع وعتبة بن رافع. كانت له مكانة عند عمر بن الخطاب، وشهد بدراً وفتح دمشق، ونزل الكوفة ثم دخل مصر وسكن الشام، وشهد صفين مع معاوية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6455}"
  en: "Ma'n ibn Yazid ibn al-Akhnas al-Sulami, Abu Yazid, a Companion from the clan of Banu Malik ibn Khafaf. He narrated from the Prophet, and Abu al-Juwayriya al-Jarmi, Suhayl ibn Dharr and Utba ibn Rafi' narrated from him. He held a standing with Umar ibn al-Khattab, fought at Badr and at the conquest of Damascus, lived in Kufa, entered Egypt and then settled in Syria, and fought at Siffin with Mu'awiya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6455}"
