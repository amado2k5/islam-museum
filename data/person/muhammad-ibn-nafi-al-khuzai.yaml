  fr: "Il examina la Pierre Noire alors qu'elle était déracinée: la noirceur n'était présente qu'à sa tête, le reste était blanc, sa longueur était celle d'un os d'avant-bras {cite:tarikh-khulafa-minhaj-1434 p. 616}."
  ur: "اس نے حجر اسود کا جائزہ لیا جب وہ اکھڑ گیا: صرف اس کے سر پر سیاہی، باقی سفید، اس کی لمبائی ایک بازو کی ہڈی۔ 616}۔"
