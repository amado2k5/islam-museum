summary:
  ar: "زين الدين قاسم بن قطلوبغا الجمالي المصري الحنفي العلامة المفنن؛ قال البرهان البقاعي في عنوان الزمان ولد سنة اثنتين وثمانمائة تقريباً بالقاهرة ونشأ بها وحفظ القرآن العظيم ثم أخذ في الجد حتى شاع ذكره وانتشر صيته وأثنى عليه مشايخه وصنف التصانيف المفيدة فمنها شرح درر البحار وتخريج أحاديث الاختيار في جزأين ورجال شرح معاني الآثار للطحاوي في مجلد وتخريج أحاديث البزدوي في الأصول مجلد لطيف وأحاديث الفرائض كذلك وتخريج أحاديث شرح القدوري للأقطع مجلد لطيف وثقات الرجال عمل في أربع مجلدات وتصحيح على مجمع البحرين لابن الساعاتي وشرح فرائض المجمع وحاشية على التلويح وصل فيها إلى أثناء بحث السنة في مجلد وشرح منظومة ابن الجزري في علم الحديث المسماة بالهداية وغير ذلك، وأخذ عن ابن الهمام وغيره من علماء عصره وأخذ عنه من لا يحصى كثرة وبالجملة فهو من حسنات الدهر، توفي في ربيع الآخر سنة تسع وسبعين وثمانمائة عن سبع وسبعين سنة {cite:shadharat-dhahab p. 326}."
  en: "Qasim ibn Qutlubugha (b. ~802 Cairo) — the Hanafi mufannin: Takhrij Ahadith al-Ikhtiyar, rijal of Sharh Ma'ani al-Athar, Thiqat al-Rijal in four volumes, a hashiya on al-Talwih reaching 'the discourse of the Sunna'; Ibn al-Humam's pupil; died Rabi' II 879 at seventy-seven {cite:shadharat-dhahab p. 326}."
