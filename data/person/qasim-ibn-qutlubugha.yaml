summary:
  ar: "زين الدين قاسم بن قطلوبغا الجمالي المصري الحنفي العلامة المفنن؛ قال البرهان البقاعي في عنوان الزمان ولد سنة اثنتين وثمانمائة تقريباً بالقاهرة ونشأ بها وحفظ القرآن العظيم ثم أخذ في الجد حتى شاع ذكره وانتشر صيته وأثنى عليه مشايخه وصنف التصانيف المفيدة فمنها شرح درر البحار وتخريج أحاديث الاختيار في جزأين ورجال شرح معاني الآثار للطحاوي في مجلد وتخريج أحاديث البزدوي في الأصول مجلد لطيف وأحاديث الفرائض كذلك وتخريج أحاديث شرح القدوري للأقطع مجلد لطيف وثقات الرجال عمل في أربع مجلدات وتصحيح على مجمع البحرين لابن الساعاتي وشرح فرائض المجمع وحاشية على التلويح وصل فيها إلى أثناء بحث السنة في مجلد وشرح منظومة ابن الجزري في علم الحديث المسماة بالهداية وغير ذلك، وأخذ عن ابن الهمام وغيره من علماء عصره وأخذ عنه من لا يحصى كثرة وبالجملة فهو من حسنات الدهر، توفي في ربيع الآخر سنة تسع وسبعين وثمانمائة عن سبع وسبعين سنة {cite:shadharat-dhahab p. 326}."
  en: "Qasim ibn Qutlubugha (b. ~802 Cairo) — the Hanafi mufannin: Takhrij Ahadith al-Ikhtiyar, rijal of Sharh Ma'ani al-Athar, Thiqat al-Rijal in four volumes, a hashiya on al-Talwih reaching 'the discourse of the Sunna'; Ibn al-Humam's pupil; died Rabi' II 879 at seventy-seven {cite:shadharat-dhahab p. 326}."
  es: "Qasim ibn Qutlubugha (n. ~802 El Cairo) — el mufannin hanafí: Takhrij Ahadith al-Ikhtiyar, rijal de Sharh Ma'ani al-Athar, Thiqat al-Rijal en cuatro volúmenes, una hashiya sobre al-Talwih que alcanza 'el discurso de la Sunna'; alumno de Ibn al-Humam; murió Rabi' II 879 a los setenta y siete años {cita: shadharat-dhahab p. 326}."
  fr: "Qasim ibn Qutlubugha (né ~ 802 Le Caire) — le mufannin Hanafi: Takhrij Ahadith al-Ikhtiyar, rijal de Sharh Ma'ani al-Athar, Thiqat al-Rijal en quatre volumes, une hashiya sur al-Talwih atteignant « le discours de la Sunna »; Élève d'Ibn al-Humam; est mort Rabi' II 879 à soixante-dix-sept ans {cite: shadharat-dhahab p. 326}."
  ur: "قاسم بن قتالبُوغہ ⁦(متوفی ~ 802 قاہرہ)⁩ - حنفی مفنین: تخریج احادیث الاختیار، شرح معانی الاطہر کا رجال، شرح الرجال چار جلدوں میں، التلویح پر ایک ہشیہ 'سنت' تک پہنچنا؛ ابن الہمام کا شاگرد؛ ربیع الثانی کی وفات 879ء میں سترہ میں ہوئی۔ 326}۔"
  tr: "Zeynetin Kasım bin Qutlubugha el-Cemali el-Misri el-Hanafi, seçkin alim ve sanatçı; El-Burhan el-Bikai 'Unwan al-Zaman'da şöyle demiştir: 802 Hicri Yılı Kahire'de doğdu, orada büyüdü, büyük Kur'an'ı ezberledi, sonra onu ciddiye aldı; ta ki adı yayıldığında, ünü yayılana ve öğretmenleri onu övene kadar. Seçkin eserler yazdı; bunlar arasında Sharh Durar al-Bihar, seçtiği hadislerin iki ciltlik doğrulanması, el-Tahavi'nin Rijal Sharh Ma'ani al-Athar'ı tek ciltte ve el-Bazdavinin hadislerinin prensipte doğrulanması, güzel bir cilt, miras kanunlarının hadisleri ve El-Kuduri'nin hadislerinin açıklamasının el-Akta'ta tarafından doğrulanması gibi faydalı eserler kaleme aldı. Güvenilir kişiler üzerinde dört ciltte çalıştı; İbn el-Sa'ati'nin Majma'el-Bahreyn üzerine bir düzeltmesi, Majma'nın fıkıhı üzerine bir tefsir ve el-Talevih'in ipucuna dair kenar bir tefhi kaleme aldı. Sünneti bir cilt halinde araştırma ve İbn el-Cezeri'nin hadis ilindeki şiirini açıklama ve diğerlerini anlatma zamanına ulaştı. İbn al-Humam ve döneminin diğer alimlerinin yanında çalıştı, sayısız alim ondan ders aldı ve bu da onu zamanının en iyilerinden biri yaptı. 879 Hicri yılında Rabi'l-Akhir'de yetmiş yedi yaşında vefat etti {atıf: şadharat-dhahab, s. 326}."
  id: "Zain al-Din Qasim ibn Qutlubugha al-Jamali al-Misri al-Hanafi, seorang ulama dan seniman terkemuka; Al-Burhan al-Biqa'i berkata dalam 'Unwan al-Zaman: Ia lahir pada tahun 802 H di Kairo, tumbuh di sana, menghafal Al-Qur'an agung, lalu menganggapnya serius hingga sebutannya menjadi luas, reputasinya menyebar, dan guru-gurunya memujinya. Ia menulis karya-karya bermanfaat, termasuk Sharh Durar al-Bihar, pengesahan hadis pilihan dalam dua jilid, Rijal Sharh Ma'ani al-Athar oleh al-Tahawi dalam satu jilid, dan pengesahan hadis al-Bazdawi dalam prinsip, sebuah jilid yang bagus, serta hadis hukum warisan, dan pengesahan hadis penjelasan Al-Quduri oleh al-Aqta'ta, sebuah jilid yang bagus. Ia mengerjakan tokoh-tokoh terpercaya dalam empat jilid, koreksi atas Majma' al-Bahrain oleh Ibn al-Sa'ati, komentar tentang yurisprudensi Majma', dan komentar marginal tentang petunjuk al-Talawih. Ia sampai pada masa meneliti Sunnah dalam sebuah buku dan menjelaskan puisi Ibn al-Jazari dalam ilmu hadits yang disebut al-Hidayah dan lainnya. Ia belajar di bawah bimbingan Ibn al-Humam dan ulama lain pada zamannya, dan banyak ulama belajar darinya, menjadikannya salah satu yang terbaik pada zamannya. Ia meninggal di Rabi' al-Akhir pada tahun 879 H pada usia tujuh puluh tujuh {cite:shadharat-dhahab, hlm. 326}."
