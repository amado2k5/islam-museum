  ar: "مصور مغولي عمّ بشن داس، بدأ التصوير في ثمانينيات القرن السادس عشر على الأقل وعمل لأكبر وجهانگير وشاه جهان، اشتهر بمشاهد الأسود تصارع البشر، ووصفه بيتش بالمتكيف لا المجدد {cite:beach-grand-mogul-1978 p. 147}."
