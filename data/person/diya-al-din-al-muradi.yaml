names:
  - { value: "ضياء الدين أبو إسحاق إبراهيم بن عيسى المرادي الأندلسي ثم المصري ثم الدمشقي الفقيه الشافعي", kind: full }
died: { edtf: "1269~", hijri: "0667~", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي بمصر في أوائل سنة ثمان وستين قاله النووي؛ ترجمته في أموات 668 {cite:shadharat-dhahab p. 568}." }
summary:
  ar: "الإمام الحافظ المتقن المحقق الضابط الزاهد الورع، شيخ النووي؛ ذكره النووي فيما ألحقه في طبقات ابن الصلاح فقال: ولم تر عيني في وقته مثله، وكان بارعاً في معرفة الحديث وعلومه وتحقيق ألفاظه لا سيما الصحيحان، ذا عناية بالغة، والنحو والفقه ومعارف الصوفية، حسن المذاكرة فيها؛ وكان عندي من كبار السالكين في طرائق الحقائق، حسن التعليم، صحبته نحو عشر سنين فلم أر منه شيئاً يكره؛ وكان من السماحة بمحل عالٍ على قدر وجده، وأما الشفقة على المسلمين ونصيحتهم فقل نظيره فيهما {cite:shadharat-dhahab p. 568-569}."
  en: "Al-Nawawi's own shaykh — whose testimony runs: 'my eyes never saw his like; brilliant in the knowledge of hadith and its sciences, the Sahihs above all; I kept his company some ten years and saw nothing blameworthy; few had his tenderness and care for the Muslims' {cite:shadharat-dhahab p. 568-569}."
  es: "El propio shaykh de Al-Nawawi —cuyo testimonio dice: 'nunca vi a nadie como él; brillante en el conocimiento del hadiz y sus ciencias, sobre todo los Sahihs; estuve en su compañía unos diez años y no vi nada reprochable; pocos tenían su ternura y cuidado por los musulmanes' {cita: shadharat-dhahab págs. 568-569}."
  fr: "Le propre cheikh d'Al-Nawawi — dont le témoignage est le suivant: « mes yeux n'ont jamais vu son pareil; brillant dans la connaissance du hadith et de ses sciences, les Sahihs au-dessus de tout; j'ai gardé sa compagnie pendant une dizaine d'années et je n'ai rien vu de blâmable; peu avaient sa tendresse et son attention pour les musulmans » {cite: shadharat-dhahab p. 568-569}."
  ur: "النووی کے اپنے شیخ - جن کی گواہی چلتی ہے: 'میری آنکھوں نے ان جیسا کبھی نہیں دیکھا۔ حدیث اور اس کے علوم کے علم میں شاندار، صحاح سب سے بڑھ کر۔ میں نے تقریباً دس سال اس کی صحبت رکھی اور کوئی بھی قابلِ مذمت نہیں دیکھا۔ مسلمانوں کے لیے ان کی شفقت اور نگہداشت بہت کم لوگوں کے پاس تھی۔ 568-569}۔"
  tr: "İmam, ezberci, titiz, kesin, kesin, zahi ve dindar öğretmen; el-Nawawi, Tabaqat İbn al-Salah'da eklediklerinde ondan bahsetti: Zamanında onun gibi birini hiç görmedim. Hadisleri, ilimlerini anlamada ve sözlerini doğrulamada, özellikle iki Sahih derlemesini anlamada yetenekliydi. Dilbilgisi, fıkıh ve tasavvuf bilgisi konusunda büyük bir dikkati ve ustalığı vardı. Bunları iyi inceledi. Hakikat yollarının büyük arayışçılarından biriydi, iyi öğretilmişti. Yaklaşık on yıl boyunca ona eşlik ettim ve ondan hiç hoşlanmadığı bir şey görmedim. Cömertti ve bulgularına göre yüksek bir statüye sahipti. Müslümanlara karşı şefkati ve öğütleri açısından ise, aralarında eşdeğeri nadirdir {atıf: shadharat-dhahab, s. 568-569}."
  id: "Imam, pengapal, guru yang teliti, tepat, tepat, asketik, dan saleh; al-Nawawi menyebutnya dalam apa yang ditambahkannya dalam Tabaqat Ibn al-Salah, mengatakan: Saya belum pernah melihat orang seperti dia pada zamannya. Dia mahir memahami hadits, ilmunya, dan memverifikasi kata-katanya, terutama dua kumpulan Sahih. Dia sangat memperhatikan dan menguasai tata bahasa, firih, dan pengetahuan Sufi. Dia mempelajarinya dengan baik. Dia termasuk pencari jalan kebenaran yang besar, yang diajarkan dengan baik. Saya menemaninya selama sekitar sepuluh tahun dan tidak pernah melihat sesuatu yang tidak disukai darinya. Dia murah hati dan memegang status tinggi menurut temuannya. Adapun belas kasihnya terhadap Muslim dan nasihatnya, sebandingnya di antara mereka jarang (cite:shadharat-dhahab, hlm. 568-569}."
