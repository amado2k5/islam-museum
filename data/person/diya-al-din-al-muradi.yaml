summary:
  ar: "الإمام الحافظ المتقن المحقق الضابط الزاهد الورع، شيخ النووي؛ ذكره النووي فيما ألحقه في طبقات ابن الصلاح فقال: ولم تر عيني في وقته مثله، وكان بارعاً في معرفة الحديث وعلومه وتحقيق ألفاظه لا سيما الصحيحان، ذا عناية بالغة، والنحو والفقه ومعارف الصوفية، حسن المذاكرة فيها؛ وكان عندي من كبار السالكين في طرائق الحقائق، حسن التعليم، صحبته نحو عشر سنين فلم أر منه شيئاً يكره؛ وكان من السماحة بمحل عالٍ على قدر وجده، وأما الشفقة على المسلمين ونصيحتهم فقل نظيره فيهما {cite:shadharat-dhahab p. 568-569}."
  en: "Al-Nawawi's own shaykh — whose testimony runs: 'my eyes never saw his like; brilliant in the knowledge of hadith and its sciences, the Sahihs above all; I kept his company some ten years and saw nothing blameworthy; few had his tenderness and care for the Muslims' {cite:shadharat-dhahab p. 568-569}."
  es: "El propio shaykh de Al-Nawawi —cuyo testimonio dice: 'nunca vi a nadie como él; brillante en el conocimiento del hadiz y sus ciencias, sobre todo los Sahihs; estuve en su compañía unos diez años y no vi nada reprochable; pocos tenían su ternura y cuidado por los musulmanes' {cita: shadharat-dhahab págs. 568-569}."
  fr: "Le propre cheikh d'Al-Nawawi — dont le témoignage est le suivant: « mes yeux n'ont jamais vu son pareil; brillant dans la connaissance du hadith et de ses sciences, les Sahihs au-dessus de tout; j'ai gardé sa compagnie pendant une dizaine d'années et je n'ai rien vu de blâmable; peu avaient sa tendresse et son attention pour les musulmans » {cite: shadharat-dhahab p. 568-569}."
  ur: "النووی کے اپنے شیخ - جن کی گواہی چلتی ہے: 'میری آنکھوں نے ان جیسا کبھی نہیں دیکھا۔ حدیث اور اس کے علوم کے علم میں شاندار، صحاح سب سے بڑھ کر۔ میں نے تقریباً دس سال اس کی صحبت رکھی اور کوئی بھی قابلِ مذمت نہیں دیکھا۔ مسلمانوں کے لیے ان کی شفقت اور نگہداشت بہت کم لوگوں کے پاس تھی۔ 568-569}۔"
