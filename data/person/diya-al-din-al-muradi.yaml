died: { edtf: "1269~", hijri: "0667~", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي بمصر في أوائل سنة ثمان وستين قاله النووي؛ ترجمته في أموات 668 {cite:shadharat-dhahab p. 568}." }
summary:
  ar: "الإمام الحافظ المتقن المحقق الضابط الزاهد الورع، شيخ النووي؛ ذكره النووي فيما ألحقه في طبقات ابن الصلاح فقال: ولم تر عيني في وقته مثله، وكان بارعاً في معرفة الحديث وعلومه وتحقيق ألفاظه لا سيما الصحيحان، ذا عناية بالغة، والنحو والفقه ومعارف الصوفية، حسن المذاكرة فيها؛ وكان عندي من كبار السالكين في طرائق الحقائق، حسن التعليم، صحبته نحو عشر سنين فلم أر منه شيئاً يكره؛ وكان من السماحة بمحل عالٍ على قدر وجده، وأما الشفقة على المسلمين ونصيحتهم فقل نظيره فيهما {cite:shadharat-dhahab p. 568-569}."
  en: "Al-Nawawi's own shaykh — whose testimony runs: 'my eyes never saw his like; brilliant in the knowledge of hadith and its sciences, the Sahihs above all; I kept his company some ten years and saw nothing blameworthy; few had his tenderness and care for the Muslims' {cite:shadharat-dhahab p. 568-569}."
