summary:
  ar: "وارث شاه (1722 – 1798) شاعر بنجابي صوفي، صاحب أشهر صياغة لقصة الحب الشعبية «هير رانجها» (1766). وُلد في جنديالا شير خان في أسرة سادة، وتعلّم في قصور على غلام مرتضى، ثم أقام في ملكا هانس قرب باكبتن في حجرة بجوار مسجدها حتى وفاته، وقبره في مسقط رأسه. جمع في «هير» بين الحكاية الشعبية والتجربة الصوفية فصارت أشهر قصص البنجاب، وما زالت أبياته أمثالاً جارية."
  en: "Waris Shah (1722–1798) was a Punjabi Sufi poet, author of the best-known rendition of the folk romance Heer Ranjha (1766). Born at Jandiala Sher Khan into a Sayyid family, he was educated at Kasur under Ghulam Murtaza, then lived at Malka Hans beside Pakpattan in a cell adjoining its mosque until his death; his tomb stands in his birthplace. His Heer joined the folk tale to Sufi experience and became Punjab's most famous romance, its verses still current as proverbs."
  ur: "وارث شاہ ⁦(1722ء – 1798ء)⁩ پنجابی صوفی شاعر تھے، مشہور زمانہ قصہ ”ہیر رانجھا“ ⁦(1766ء)⁩ کے خالق۔ جنڈیالہ شیر خان میں سادات گھرانے میں پیدا ہوئے، قصور میں غلام مرتضیٰ سے تعلیم پائی، پھر پاکپتن کے قریب ملکہ ہانس میں مسجد سے ملحق حجرے میں زندگی گزاری؛ مزار ان کے آبائی قصبے میں ہے۔ ان کی ”ہیر“ نے لوک داستان کو صوفیانہ تجربے سے جوڑ کر پنجاب کی مشہور ترین داستان بنا دیا اور اس کے اشعار آج بھی ضرب المثل ہیں۔"
  es: "Waris Shah (1722-1798) fue un poeta sufí punjabí, autor de la versión más conocida del romance popular Heer Ranjha (1766). Nacido en Jandiala Sher Khan en el seno de una familia Sayyid, se educó en Kasur con Ghulam Murtaza y vivió en Malka Hans, junto a Pakpattan, en una celda contigua a la mezquita, hasta su muerte; su tumba se encuentra en su lugar de nacimiento. Su Heer fusionó el cuento popular con la experiencia sufí y se convirtió en el romance más famoso del Punjab, cuyos versos aún se utilizan como proverbios."
  fr: "Waris Shah (1722-1798) était un poète soufi punjabi, auteur de la version la plus célèbre du roman populaire Heer Ranjha (1766). Né à Jandiala Sher Khan dans une famille Sayyid, il fit ses études à Kasur auprès de Ghulam Murtaza, puis vécut à Malka Hans, près de Pakpattan, dans une cellule attenante à la mosquée, jusqu'à sa mort; son tombeau se trouve dans son lieu de naissance. Son Heer mêle le conte populaire à l'expérience soufie et devint le roman le plus célèbre du Pendjab, dont les vers sont encore utilisés comme proverbes."
  tr: "Warith Shah (1722–1798), popüler aşk hikayesi 'Heer Ranjha'nın (1766) en ünlü bestesinin yazarı olan Pencaplı bir Sufi şairdi. Jandiala Sher Khan'da soylu bir ailede doğdu, Ghulam Murtada'nın saraylarında eğitim gördü, ardından ölümüne kadar Pakbaten yakınlarındaki Malka Hans'ta onun camisinin yanındaki bir odada yaşadı ve mezarı memleketindedir. 'Heer' adlı eserinde halk hikayelerini Sufi deneyimiyle birleştirerek onları Pencap'ın en ünlü hikayeleri haline getirdi ve şiirleri hâlâ devam eden atasözleri olarak kalmıştır."
  id: "Warith Shah (1722–1798) adalah seorang penyair Sufi Punjabi, penulis komposisi paling terkenal berupa kisah cinta populer 'Heer Ranjha' (1766). Ia lahir di Jandiala Sher Khan dalam keluarga bangsawan, belajar di istana Ghulam Murtada, kemudian tinggal di Malka Hans dekat Pakbaten di sebuah ruangan di sebelah masjidnya hingga kematiannya, dan makamnya berada di kampung halamannya. Dalam 'Heer,' ia menggabungkan cerita rakyat dengan pengalaman Sufi, menjadikannya cerita paling terkenal di Punjab, dan bait-baitnya tetap menjadi peribahasa yang terus berlangsung."

