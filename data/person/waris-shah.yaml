summary:
  ar: "وارث شاه (1722 – 1798) شاعر بنجابي صوفي، صاحب أشهر صياغة لقصة الحب الشعبية «هير رانجها» (1766). وُلد في جنديالا شير خان في أسرة سادة، وتعلّم في قصور على غلام مرتضى، ثم أقام في ملكا هانس قرب باكبتن في حجرة بجوار مسجدها حتى وفاته، وقبره في مسقط رأسه. جمع في «هير» بين الحكاية الشعبية والتجربة الصوفية فصارت أشهر قصص البنجاب، وما زالت أبياته أمثالاً جارية."
  en: "Waris Shah (1722–1798) was a Punjabi Sufi poet, author of the best-known rendition of the folk romance Heer Ranjha (1766). Born at Jandiala Sher Khan into a Sayyid family, he was educated at Kasur under Ghulam Murtaza, then lived at Malka Hans beside Pakpattan in a cell adjoining its mosque until his death; his tomb stands in his birthplace. His Heer joined the folk tale to Sufi experience and became Punjab's most famous romance, its verses still current as proverbs."
  ur: "وارث شاہ (1722ء – 1798ء) پنجابی صوفی شاعر تھے، مشہور زمانہ قصہ ”ہیر رانجھا“ (1766ء) کے خالق۔ جنڈیالہ شیر خان میں سادات گھرانے میں پیدا ہوئے، قصور میں غلام مرتضیٰ سے تعلیم پائی، پھر پاکپتن کے قریب ملکہ ہانس میں مسجد سے ملحق حجرے میں زندگی گزاری؛ مزار ان کے آبائی قصبے میں ہے۔ ان کی ”ہیر“ نے لوک داستان کو صوفیانہ تجربے سے جوڑ کر پنجاب کی مشہور ترین داستان بنا دیا اور اس کے اشعار آج بھی ضرب المثل ہیں۔"

