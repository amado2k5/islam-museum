id: person/al-nusayr
class: person
label: { ar: "النُّسَير", en: "al-Nusayr", fr: "al-Nusayr", es: "al-Nusayr", ur: "النصیر" }
summary:
  ar: "قائد غارات على تخوم العراق زمن الفتح؛ عند البلاذري وجّهه المثنى بن حارثة وحذيفة بن محصن بعد يوم الجسر إلى تكريت فأغار على بني تغلب وأصاب نعماً وشاء وآمن أهل عكبراء والبردان وهزم خرزاد بن ماهبنذاذ عند قصر سابور ويذكر أيضاً أنه توجه من قبل خالد بن الوليد فأغار على قرى مسكن وقطربل وورد في بعض المواضع التسير بدل النسير."
  en: "Raider on the Iraq marches at the conquest; in al-Baladhuri sent by al-Muthanna ibn Haritha with Hudhayfa ibn Mihsan to Tikrit after the Day of the Bridge, safe-conducting Ukbara and al-Baradan and routing Khurzad ibn Mahibandadh at Qasr Sabur; also said sent by Khalid ibn al-Walid against Maskin and Qatarrabul villages — the name appears as al-Tusayr in places."
  fr: "Raider sur les marches de l'Irak à la conquête ; à al-Baladhuri envoyé par al-Muthanna ibn Haritha avec Hudhayfa ibn Mihsan à Tikrit après le jour du pont, Ukbara et al-Baradan sécuritaire et routage Khurzad ibn Mahibandadh à Qasr Sabur ; a également déclaré envoyé par Khalid ibn al-Walid contre Maskin et Qatarrabul villages – le nom apparaît comme al-Tusayr dans certains endroits."
  es: "Asaltante en Irak marcha hacia la conquista; en al-Baladhuri enviado por al-Muthanna ibn Haritha con Hudhayfa ibn Mihsan a Tikrit después del Día del Puente, salvaguardando a Ukbara y al-Baradan y derrotando a Khurzad ibn Mahibandadh en Qasr Sabur; También se dice enviado por Khalid ibn al-Walid contra las aldeas de Maskin y Qatarrabul; el nombre aparece como al-Tusayr en algunos lugares."
  ur: "عراق پر حملہ آور فتح کی طرف مارچ کرتا ہے۔ البلادوری میں المثنیٰ ابن حارثہ نے حذیفہ بن محصن کے ساتھ یومِ برج کے بعد تکریت بھیجا، عقبرہ اور البردان کو بحفاظت انجام دیا اور قصر صابور پر خرزاد ابن مہی بندہ کو روانہ کیا۔ یہ بھی کہا کہ خالد بن الولید کی طرف سے مسکین اور قطررابول دیہاتوں کے خلاف بھیجا گیا تھا - یہ نام جگہوں پر التوصیر کے طور پر ظاہر ہوتا ہے۔"
  tr: "Fetih sırasında Irak sınırlarına yapılan baskınların komutanıydı; el-Baladhuri'ye göre, El-Müthanna ibn Haritha ve Hudhayfah ibn Muhsin, Köprü Günü'nden sonra Tikrit'e gitti, burada Banu Taghlib'e baskın düzenledi, Na''a vurdu ve Ekbera ile el-Bardan halkını güvence altına aldı. Sabour sarayında Hərzed bin Mahbandad'ı yendi. Ayrıca Halid bin el-Velid tarafından yönlendirildiği, Maskan ve Katarbal köylerine baskın düzenlediği ve bazı yerlerde sefer yerine yürüyüş yaptığı da belirtilir."
  id: "Ia adalah komandan serangan di perbatasan Irak selama penaklukan; menurut al-Baladhuri, Al-Muthanna ibn Haritha dan Hudhayfah ibn Muhsin menuju Tikrit setelah Hari Jembatan, di mana ia menyerang Banu Taghlib, menyerang Na'am, dan mengamankan rakyat Akbara dan Al-Bardan. Ia mengalahkan Kharzad ibn Mahbandadh di istana Sabour. Juga disebutkan bahwa ia dipimpin oleh Khalid ibn al-Walid, menyerang desa Maskan dan Qatarbal, dan di beberapa tempat, disebutkan bahwa berbaris bukan ekspedisi."
