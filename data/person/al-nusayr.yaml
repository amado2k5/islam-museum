summary:
  ar: "قائد غارات على تخوم العراق زمن الفتح؛ عند البلاذري وجّهه المثنى بن حارثة وحذيفة بن محصن بعد يوم الجسر إلى تكريت فأغار على بني تغلب وأصاب نعماً وشاء وآمن أهل عكبراء والبردان وهزم خرزاد بن ماهبنذاذ عند قصر سابور ويذكر أيضاً أنه توجه من قبل خالد بن الوليد فأغار على قرى مسكن وقطربل وورد في بعض المواضع التسير بدل النسير."
  en: "Raider on the Iraq marches at the conquest; in al-Baladhuri sent by al-Muthanna ibn Haritha with Hudhayfa ibn Mihsan to Tikrit after the Day of the Bridge, safe-conducting Ukbara and al-Baradan and routing Khurzad ibn Mahibandadh at Qasr Sabur; also said sent by Khalid ibn al-Walid against Maskin and Qatarrabul villages — the name appears as al-Tusayr in places."
