summary:
  ar: "إمام بغدادي فقيه محدث فصيح، أحد رواة مذهب الشافعي القديم — قال الماوردي: هو أنبت رواة القديم. كان يتولى القراءة على الشافعي في مجلسه يحضره أحمد وأبو ثور، وقال: قدم علينا الشافعي فاجتمعنا إليه فقال التمسوا من يقرأ لكم فلم يجترئ أحد أن يقرأ عليه غيري، فقرأت عليه الكتب كلها إلا كتابين قرأهما عليّ: المناسك والصلاة. سمع من سفيان بن عيينة والشافعي وعبيدة بن حميد وعبد الوهاب الثقفي ويزيد بن هارون، وروى عنه البخاري وأبو داود والترمذي والنسائي وابن ماجة وابن خزيمة وأبو عوانة، وقال النسائي: ثقة. نُسب إلى قرية بالسواد اسمها الزعفرانية، وسُمي ببغداد درب الزعفران به وبه مسجد الشافعي الذي درّس فيه الشيرازي. توفي في شهر رمضان سنة ستين ومائتين {cite:tabaqat-shafiiyya-subki j.1 p.250-258}."
  en: "A Baghdad imam — jurist, hadith scholar and master of eloquence — counted among the transmitters of al-Shafi'i's 'old' (Iraqi) corpus; al-Mawardi called him 'the most flourishing of the qadim transmitters'. He was the reader in al-Shafi'i's circle attended by Ahmad and Abu Thawr: 'when al-Shafi'i came to us none dared read to him but me, and I read him all the books save two he read to me.' He heard Ibn 'Uyayna, 'Ubayda b. Humayd and Yazid b. Harun; the Six-save-Muslim transmitted from him, and al-Nasa'i graded him thiqa. Baghdad's Darb al-Za'faran took its name from him and held the mosque where al-Shirazi taught. He died in Ramadan 260 {cite:tabaqat-shafiiyya-subki j.1 p.250-258}."
