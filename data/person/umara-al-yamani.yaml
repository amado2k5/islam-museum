summary:
  ar: "عمارة بن أبي الحسن اليمني الشاعر، كان بمصر يحسن لشمس الدولة تورانشاه قصد اليمن ويصف البلاد له ويعظمها في عينه فزادته رغبة فيها؛ ثم صار من أركان مؤامرة إعادة الدولة العلوية وقال لأصحابه: وأنا قد أبعدت أخاه إلى اليمن خوفاً أن يسد مسده، وتقررت القاعدة على استدعاء الفرنج من صقلية وساحل الشام والثورة بالقاهرة إذا قصدوا البلاد؛ فكشفها زين الدين علي بن نجا لصلاح الدين فقبض على المقدمين وصلبهم في ثاني رمضان سنة تسع وستين وخمسمائة وكان عمارة فيهم {cite:kamil-ibn-al-athir p. 52-54}."
  en: "The Yemeni poet at Saladin's Cairo — his praise of Yemen fired Turanshah's appetite for the 569 conquest ('I sent his brother far to Yemen lest he take his place'); then a pillar of the Fatimid-restoration plot with its Frankish collusion, betrayed by the informer Ibn Naja and crucified 2 Ramadan 569 {cite:kamil-ibn-al-athir p. 52-54}."
