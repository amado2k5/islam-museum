summary:
  ar: "عمارة بن أبي الحسن اليمني الشاعر، كان بمصر يحسن لشمس الدولة تورانشاه قصد اليمن ويصف البلاد له ويعظمها في عينه فزادته رغبة فيها؛ ثم صار من أركان مؤامرة إعادة الدولة العلوية وقال لأصحابه: وأنا قد أبعدت أخاه إلى اليمن خوفاً أن يسد مسده، وتقررت القاعدة على استدعاء الفرنج من صقلية وساحل الشام والثورة بالقاهرة إذا قصدوا البلاد؛ فكشفها زين الدين علي بن نجا لصلاح الدين فقبض على المقدمين وصلبهم في ثاني رمضان سنة تسع وستين وخمسمائة وكان عمارة فيهم {cite:kamil-ibn-al-athir p. 52-54}."
  en: "The Yemeni poet at Saladin's Cairo — his praise of Yemen fired Turanshah's appetite for the 569 conquest ('I sent his brother far to Yemen lest he take his place'); then a pillar of the Fatimid-restoration plot with its Frankish collusion, betrayed by the informer Ibn Naja and crucified 2 Ramadan 569 {cite:kamil-ibn-al-athir p. 52-54}."
  es: "El poeta yemení en el Cairo de Saladino —sus elogios a Yemen avivaron el apetito de Turanshah por la conquista de 569 («Envié a su hermano lejos a Yemen para que no ocupara su lugar»); luego un pilar de la conspiración de restauración fatimí con su complicidad franca, traicionado por el informante Ibn Naja y crucificado el 2 de Ramadán de 569 {cite:kamil-ibn-al-athir p. 52-54}."
  fr: "Le poète yéménite au Caire de Saladin — ses éloges du Yémen ont attisé l'appétit de Turanshah pour la conquête de 569 (« J'ai envoyé son frère loin au Yémen de peur qu'il ne prenne sa place »); puis un pilier du complot de restauration fatimide avec sa collusion franque, trahi par l'informateur Ibn Naja et crucifié le 2 Ramadan 569 {cite:kamil-ibn-al-athir p. 52-54}."
  ur: "صلاح الدین کے قاہرہ میں یمنی شاعر - یمن کی اس کی تعریف نے 569 کی فتح کے لیے توران شاہ کی بھوک کو بھڑکا دیا ⁦('میں نے اس کے بھائی کو بہت دور یمن بھیج دیا کہیں وہ اس کی جگہ نہ لے')⁩؛ پھر فاطمی بحالی کی سازش کا ایک ستون اس کی فرینکش ملی بھگت سے، جسے مخبر ابن نجا نے دھوکہ دیا اور 2 رمضان 569 کو مصلوب کر دیا۔ 52-54}۔"
  tr: "Şair Amara ibn Abi al-Hasan al-Yamani, Mısır'daydı ve Yemen'e seyahat eden Şems al-Dawla Turanshah'a hayran kaldı; Turanshah ona toprakları tarif etti ve hayranlık duydu, bu da onun onlara olan arzusunu artırdı. Sonra Alaouit devletini yeniden kurma komplosunun direklerinden biri oldu ve yoldaşlarına şöyle dedi: Kardeşini Yemen'e sürgün ettim, çünkü kuşatmasını engelleyeceğinden korkuyorum. Frankların Sicilya, Levant kıyısından ve Kahire'deki isyanın topraklara giderse çağrılmasına karar verildi; Zain al-Din Ali ibn Naja bunu Salah al-Din'e açıkladı; Salah al-Din, beş yüz altmış dokuz yılının ikinci Ramazan'ında öncüleri yakalayıp çarmıha gerdi ve Amara da onların arasındaydı {cite:kamil-ibn-al-athir s. 52-54}."
  id: "Amara ibn Abi al-Hasan al-Yamani, sang penyair, berada di Mesir mengagumi Shams al-Dawla Turanshah, yang melakukan perjalanan ke Yaman dan menggambarkan tanah-tanah itu kepadanya dan mengaguminya, yang semakin meningkatkan keinginannya akan tanah itu. Kemudian ia menjadi salah satu pilar konspirasi untuk mengembalikan negara Alaouite dan berkata kepada para sahabatnya: Aku telah mengasingkan saudaranya ke Yaman karena takut ia akan menghalangi pengepungannya. Diputuskan untuk memanggil orang Frank dari Sisilia, pantai Levant, dan pemberontakan di Kairo jika mereka pergi ke tanah tersebut; Zain al-Din Ali ibn Naja mengungkapkan hal ini kepada Salah al-Din, yang menangkap dan menyalibkan para perintis pada tanggal kedua Ramadan tahun lima ratus enam puluh sembilan, dan Amara termasuk di antara mereka {cite:kamil-ibn-al-athir hlm. 52-54}."
