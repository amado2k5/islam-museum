summary:
  ar: "من الأبناء — أولاد الفرس الذين وجههم كسرى إلى اليمن مع ابن ذي يزن وعليهم وهرز — أسلم فاستماله قيس بن هبيرة المرادي لقتل الأسود العنسي، فكان ممن دخل عليه سحراً في بيته بصنعاء؛ واختلف في القاتل: فمنهم من قال قيس ذبحه واحتز رأسه، ومنهم من قال إن فيروز قتله وأن قيساً أجاز عليه، وقال عمر لما ادّعياه بالمدينة «قتله هذا الأسد» يعني فيروز، وذكر بعض أهل العلم أن النبي قال في مرضه قبل وفاته بخمسة أيام «قد قتل الله الأسود العنسي قتله الرجل الصالح فيروز بن الديلمي»."
  en: "One of the Abna' — sons of the Persians Kisra sent to Yemen with Ibn Dhi Yazan under Wahriz — who embraced Islam and was won over by Qays ibn Hubayra al-Muradi for the killing of al-Aswad al-Ansi, entering his house at dawn in San'a; the slayer is disputed: some say Qays slaughtered him and took his head, others that Fayruz killed him and Qays merely finished it, Umar saying when both claimed it in Medina 'this lion killed him' meaning Fayruz, and some scholars record the Prophet saying in his illness five days before his death 'God has killed al-Aswad al-Ansi; the righteous man Fayruz ibn al-Daylami killed him'."
