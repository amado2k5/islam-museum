summary:
  ar: "عبد الله بن يزيد بن زيد بن حصين الأنصاري الخطمي، أبو موسى، صحابي شهد الحديبية وهو صغير، وشهد الجمل وصفين مع علي، وكان أميرا له على الكوفة. روى عن النبي وعن أبي أيوب وأبي مسعود وزيد بن ثابت. وعنه ابنه موسى والشعبي ومحمد بن سيرين. توفي نحو سنة 70هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  en: "Abd Allah ibn Yazid ibn Zayd al-Ansari al-Khatmi, Abu Musa, a Companion who as a young man witnessed Hudaybiyya, fought with Ali at the Camel and Siffin, and was his governor in Kufa. He narrated from the Prophet, Abu Ayyub, Abu Mas'ud and Zayd ibn Thabit; his son Musa, al-Sha'bi and Muhammad ibn Sirin narrated from him. The page gives his death as about 70 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
