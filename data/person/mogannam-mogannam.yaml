summary:
  ar: "محامٍ وناشط سياسي فلسطيني مسيحي من القدس (توفي 1945)، هاجر إلى الولايات المتحدة قبل الحرب العالمية الأولى ودرس الحقوق فيها، ثم عاد مع زوجته متيل مغنم إلى القدس في مطلع عشرينيات القرن العشرين، وكان من مؤسسي حزب الدفاع الوطني وضباطه، وتدرب في مكتبه أحمد الشقيري أول رئيس لمنظمة التحرير الفلسطينية."
  en: "Palestinian Christian lawyer and political activist from Jerusalem (died 1945). He emigrated to the United States before the First World War and studied law there, returned with his wife Matiel Mogannam to Jerusalem in the early 1920s, and was a founding member and officer of the National Defense Party; the young Ahmad Shuqairi, later the PLO's first chairman, trained in his law office."
  ur: "قدس سے تعلق رکھنے والے فلسطینی مسیحی وکیل اور سیاسی کارکن (وفات 1945ء)۔ وہ پہلی جنگِ عظیم سے قبل امریکہ ہجرت کر گئے اور وہیں قانون کی تعلیم حاصل کی، بیسویں صدی کے بیس کی دہائی کے آغاز میں اپنی اہلیہ متیل مغنم کے ساتھ قدس واپس آئے، اور حزبِ دفاعِ وطنی کے بانی ارکان اور عہدیداروں میں شامل رہے؛ نوجوان احمد الشقیری، جو بعد میں تنظیمِ آزادی فلسطین کے پہلے چیئرمین بنے، نے ان کے دفتر میں تربیت حاصل کی۔"
