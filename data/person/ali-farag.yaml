summary:
  ar: "لاعب اسكواش مصري محترف سابق، وُلد في القاهرة سنة 1992. بطل العالم أربع مرات ⁦(2018–19 و2020–21 و2021–22 و2022–23)⁩ ومصنّف أول عالميًا سابقًا، اعتزل في مايو 2025 وفي رصيده 46 لقبًا في جولة المحترفين."
  en: "Egyptian former professional squash player, born in Cairo in 1992. A four-time world champion (2018–19, 2020–21, 2021–22 and 2022–23) and former world No. 1, he retired in May 2025 with 46 PSA titles."
  fr: "Ancien joueur de squash professionnel égyptien, né au Caire en 1992. quadruple champion du monde (2018-2019, 2020-2021, 2021-2022 et 2022-2023) et ancien numéro 1 mondial, il a pris sa retraite en mai 2025 avec 46 titres PSA."
  ur: "مصری سابق پیشہ ور اسکواش کھلاڑی، 1992 میں قاہرہ میں پیدا ہوئے۔ چار مرتبہ عالمی چیمپئن ⁦(2018–19، 2020–21، 2021–22 اور 2022–23)⁩ اور سابق عالمی نمبر 1؛ مئی 2025 میں 46 پی ایس اے خطابات کے ساتھ ریٹائر ہوئے۔"
  es: "Exjugador profesional de squash egipcio, nacido en El Cairo en 1992. Cuatro veces campeón del mundo (2018-19, 2020-21, 2021-22 y 2022-23) y antiguo número 1 del mundo, se retiró en mayo de 2025 con 46 títulos de la PSA."
  tr: "1992 yılında Kahire'de doğmuş eski profesyonel Mısırlı squash oyuncusu. Dört kez dünya şampiyonu (2018–19, 2020–21, 2021–22 ve 2022–23) ve eski bir dünya bir numarası olan Sher, Mayıs 2025'te Pro Tour'da 46 şampiyonlukla emekli oldu."
  id: "Mantan pemain squash profesional Mesir, lahir di Kairo pada tahun 1992. Juara dunia empat kali (2018–19, 2020–21, 2021–22, dan 2022–23) serta mantan nomor satu dunia, ia pensiun pada Mei 2025 dengan 46 gelar di Pro Tour."
