label: { ar: "المختار بن أبي عبيد", en: "al-Mukhtar ibn Abi Ubayd" }
summary:
  ar: "المختار بن أبي عبيد الثقفي؛ عند البلاذري نسب إليه أو لغيره قول حب أهل الكوفة شرف وبغضهم تلف.، وعند المسعودي قال لابن الزبير إني لأعرف قوماً لو أن لهم رجلاً له رفق وعلم لاستخرج لك منهم جنداً قال من هم قال شيعة بني هاشم بالكوفة فبعثه إليها، فجعل يظهر البكاء على الطالبيين ويحث على أخذ الثار حتى مالت إليه الشيعة وأخرج ابن مطيع من قصر الإمارة وغلب على الكوفة وابتنى داراً وبستاناً {cite:muruj-al-dhahab p. 71}"
  en: "al-Mukhtar ibn Abi Ubayd al-Thaqafi; in al-Baladhuri the saying 'the Kufans' love is honor and their hatred ruin' is attributed to him — or to another."
