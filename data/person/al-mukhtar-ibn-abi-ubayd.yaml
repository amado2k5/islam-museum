id: person/al-mukhtar-ibn-abi-ubayd
education:
  did_you_know:
    ar: "المختار بن أبي عبيد الثقفي؛ قال لابن الزبير عند المسعودي إني لأعرف قوماً لو أن لهم رجلاً له رفق وعلم لاستخرج لك منهم الجيش العرمرم."
    en: "Al-Mukhtar ibn Abi Ubayd al-Thaqafi told Ibn al-Zubayr, per al-Mas'udi: 'I know a people — had they a man of gentleness and learning he could draw you a mighty army out of them'."
    ur: "مختار بن ابی عبید ثقفی نے ابن زبیر سے کہا، مسعودی کے مطابق: «میں ایک قوم جانتا ہوں — اگر ان کے پاس نرمی اور علم والا شخص ہو تو وہ تمہارے لیے بڑا لشکر نکال سکتا ہے»۔"
    sources: [source/muruj-al-dhahab, source/tarikh-ibn-khaldun-ibar]
class: person
label: { ar: "المختار بن أبي عبيد", en: "al-Mukhtar ibn Abi Ubayd", fr: "al-Mukhtar ibn Abi Ubayd", es: "al-Mukhtar ibn Abi Ubayd", ur: "المختار ابن ابی عبید" }
summary:
  ar: "المختار بن أبي عبيد الثقفي؛ عند البلاذري نسب إليه أو لغيره قول حب أهل الكوفة شرف وبغضهم تلف. وعند المسعودي قال لابن الزبير إني لأعرف قوماً لو أن لهم رجلاً له رفق وعلم لاستخرج لك منهم جنداً قال من هم قال شيعة بني هاشم بالكوفة فبعثه إليها، فجعل يظهر البكاء على الطالبيين ويحث على أخذ الثار حتى مالت إليه الشيعة وأخرج ابن مطيع من قصر الإمارة وغلب على الكوفة وابتنى داراً وبستاناً {cite:muruj-al-dhahab p. 71}، وقتل معه عبيد الله بن علي بن أبي طالب، وقالت حرمه حين دعين إلى البراءة منه كيف نتبرأ من رجل يقول ربى الله كان صائم نهاره قائم ليله قد بذل دمه لله ولرسوله في طلب قتلة ابن بنت رسول الله {cite:muruj-al-dhahab p. 93}"
  en: "al-Mukhtar ibn Abi Ubayd al-Thaqafi; in al-Baladhuri the saying 'the Kufans' love is honor and their hatred ruin' is attributed to him — or to another."
  fr: "al-Mukhtar ibn Abi Ubayd al-Thaqafi ; dans al-Baladhuri le dicton « l'amour des Kufans est l'honneur et leur haine ruine » lui est attribué - ou à un autre."
  es: "al-Mukhtar ibn Abi Ubayd al-Thaqafi; en al-Baladhuri se le atribuye a él, o a otro, el dicho \"el amor de los kufanos es honor y su odio ruina\"."
  ur: "المختار ابن ابی عبید الثقفی؛ البلادوری میں کہاوت 'کوفوں کی محبت عزت ہے اور ان کی نفرت بربادی' اس کی طرف یا کسی اور کی طرف منسوب ہے۔"
  tr: "El-Muhtar bin Ebi Ubeyd el-Tekafi; el-Baladhuri'ye göre, Kufe halkını sevmenin bir onur olduğu ve onlara nefret etmenin utanç olduğu sözü ona ya da başkalarına atfedilir. El-Mes'udi'ye göre, İbn Zübeyr'e şöyle demiştir: Eğer iyi ve bilgili bir adamları olsaydı, sana asker gönderecek bir halk tanıyorum. O dedi ki, 'Onlar kim?' 'Şiiler Kufe'dedir.' dedi. Talibiler için ağlamaya başladı ve intikam almalarını öğüttü, ta ki Şiiler ona yönelene kadar. İbn Muti' valilik sarayından kovuldu, Kufe'yi kontrol etti, bir ev ve meyve bahçesi inşa etti ve Ubeyd Allah ibn Ali bin Ebi Talib'i de onunla birlikte öldürdü. Eşi, onu reddetmesi istendiğinde, 'Efendim, gündüz oruç tutup gece ayakta duruyordu, kanını Allah ve Elçisi için feda ederek Resulun oğlunun katillerini takip etti.' diyen bir adamı nasıl reddedebiliriz dedi. {Muruj-al-Dhahab, s. 93}"
  id: "Al-Mukhtar ibn Abi Ubayd al-Thaqafi; menurut al-Baladhuri, dikatakan kepada dia atau orang lain bahwa mencintai rakyat Kufa adalah kehormatan, dan kebencian terhadap mereka adalah aib. Menurut al-Mas'udi, dia berkata kepada Ibn al-Zubayr: Aku mengenal sebuah bangsa yang, jika mereka memiliki orang yang baik hati dan berpengetahuan, dia akan mengirim tentara untukmu. Dia berkata, 'Siapa mereka?' Dia berkata, 'Orang Syiah ada di Kufa.' Dia mulai menangis atas Talibid dan mendesak mereka untuk membalas dendam sampai Syiah condong kepadanya. Ibn Muti' diusir dari istana gubernur, mengambil alih Kufa, membangun sebuah rumah dan kebun, serta membunuh Ubayd Allah ibn Ali ibn Abi Talib bersamanya. Istrinya berkata, ketika dipanggil untuk mengusirnya, bagaimana mungkin kita menolak seseorang yang berkata, 'Tuhanku, dia berpuasa siang dan berdiri di malam hari, telah mengorbankan darahnya untuk Tuhan dan Rasul-Nya dalam mengejar pembunuh putra Rasul Allah.' {cite:Muruj-al-Dhahab, hlm. 93}"
