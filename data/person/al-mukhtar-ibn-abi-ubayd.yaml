id: person/al-mukhtar-ibn-abi-ubayd
education:
  did_you_know:
    ar: "المختار بن أبي عبيد الثقفي؛ قال لابن الزبير عند المسعودي إني لأعرف قوماً لو أن لهم رجلاً له رفق وعلم لاستخرج لك منهم الجيش العرمرم."
    en: "Al-Mukhtar ibn Abi Ubayd al-Thaqafi told Ibn al-Zubayr, per al-Mas'udi: 'I know a people — had they a man of gentleness and learning he could draw you a mighty army out of them'."
    ur: "مختار بن ابی عبید ثقفی نے ابن زبیر سے کہا، مسعودی کے مطابق: «میں ایک قوم جانتا ہوں — اگر ان کے پاس نرمی اور علم والا شخص ہو تو وہ تمہارے لیے بڑا لشکر نکال سکتا ہے»۔"
    sources: [source/muruj-al-dhahab, source/tarikh-ibn-khaldun-ibar]
