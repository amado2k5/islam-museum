summary:
  ar: "أكاديمي وسياسي هندي (1897–1969)، من مؤسسي الجامعة الملية الإسلامية ونائب رئيسها من 1926 إلى 1948، ثم نائب رئيس جامعة عليكرة الإسلامية (1948–1956). حاكم بيهار (1957–1962)، ونائب رئيس الهند (1962–1967)، ورئيسها من 13 مايو 1967 حتى وفاته في المنصب في 3 مايو 1969 — أول مسلم يتولى الرئاسة. نال وسام «بهارات راتنا» سنة 1963."
  en: "Indian educationist and politician (1897–1969), a founding member of Jamia Millia Islamia and its vice-chancellor from 1926 to 1948, then vice-chancellor of Aligarh Muslim University (1948–1956). Governor of Bihar (1957–1962), vice president of India (1962–1967) and president from 13 May 1967 until his death in office on 3 May 1969 — the first Muslim to hold the office. He was awarded the Bharat Ratna in 1963."
  ur: "ہندوستانی ماہرِ تعلیم اور سیاست دان (1897ء–1969ء)، جامعہ ملیہ اسلامیہ کے بانی ارکان میں سے ایک اور 1926ء سے 1948ء تک اس کے وائس چانسلر، پھر علی گڑھ مسلم یونیورسٹی کے وائس چانسلر (1948ء–1956ء)۔ بہار کے گورنر (1957ء–1962ء)، ہندوستان کے نائب صدر (1962ء–1967ء) اور 13 مئی 1967ء سے 3 مئی 1969ء کو عہدے میں وفات تک صدرِ ہند — یہ عہدہ سنبھالنے والے پہلے مسلمان۔ 1963ء میں انھیں بھارت رتن دیا گیا۔"
