label:
  ar: زينب النفزاوية
  en: Zaynab al-Nafzawiyya
summary:
  ar: زينب بنت إسحاق النفزاوية، اشتهرت بالجمال والرئاسة حتى قيل إنها كانت تشاور في الأمر؛ تزوجت لقوطاً بن يوسف المغراوي أمير أغمات، فلما هلك في حرب المرابطين تزوجها أبو بكر بن عمر، فلما رحل إلى الصحراء واستخلف يوسف بن تاشفين نزل له عنها فتزوجها، وأشارت عليه أن يظهر الاستبداد في أحواله، وكانت يده اليسرى في بناء دولة المرابطين.
  en: Zaynab bint Ishaq al-Nafzawiyya, famed for beauty and command; she married Laqut ibn Yusuf al-Maghrawi of Aghmat, then Abu Bakr ibn Umar who ceded her with the realm to Yusuf ibn Tashfin when he departed for the Sahara, and she counselled Yusuf to make his sovereignty public, standing as the hidden hand in the Almoravid state's founding.
