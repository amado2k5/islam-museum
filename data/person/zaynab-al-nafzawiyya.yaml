id: person/zaynab-al-nafzawiyya
class: person
label:
  ar: زينب النفزاوية
  en: Zaynab al-Nafzawiyya
  es: "Zaynab al-Nafzawiyya"
  fr: "Zaynab al-Nafzawiyya"
  ur: "زینب النفزاویہ"
summary:
  ar: زينب بنت إسحاق النفزاوية، اشتهرت بالجمال والرئاسة حتى قيل إنها كانت تشاور في الأمر؛ تزوجت لقوطاً بن يوسف المغراوي أمير أغمات، فلما هلك في حرب المرابطين تزوجها أبو بكر بن عمر، فلما رحل إلى الصحراء واستخلف يوسف بن تاشفين نزل له عنها فتزوجها، وأشارت عليه أن يظهر الاستبداد في أحواله، وكانت يده اليسرى في بناء دولة المرابطين.
  en: Zaynab bint Ishaq al-Nafzawiyya, famed for beauty and command; she married Laqut ibn Yusuf al-Maghrawi of Aghmat, then Abu Bakr ibn Umar who ceded her with the realm to Yusuf ibn Tashfin when he departed for the Sahara, and she counselled Yusuf to make his sovereignty public, standing as the hidden hand in the Almoravid state's founding.
  es: "Zaynab bint Ishaq al-Nafzawiyya, famosa por su belleza y autoridad, se casó con Laqut ibn Yusuf al-Maghrawi de Aghmat, y luego con Abu Bakr ibn Umar, quien la cedió junto con el reino a Yusuf ibn Tashfin cuando este partió hacia el Sahara. Zaynab aconsejó a Yusuf que hiciera pública su soberanía, convirtiéndose así en la mano oculta en la fundación del estado almorávide."
  fr: "Zaynab bint Ishaq al-Nafzawiyya, célèbre pour sa beauté et son autorité; elle épousa Laqut ibn Yusuf al-Maghrawi d'Aghmat, puis Abu Bakr ibn Umar qui la céda avec le royaume à Yusuf ibn Tashfin lorsqu'il partit pour le Sahara, et elle conseilla à Yusuf de rendre sa souveraineté publique, jouant ainsi le rôle de la main invisible dans la fondation de l'État almoravide."
  ur: "زینب بنت اسحاق النفزاویہ، خوبصورتی اور حکم کے لیے مشہور؛ اس نے اخمت کے لاقوت بن یوسف المغراوی سے شادی کی، پھر ابوبکر بن عمر سے جس نے اسے یوسف بن تاشفین کے حوالے کر دیا جب وہ صحارا کے لیے روانہ ہوئے، اور اس نے یوسف کو مشورہ دیا کہ وہ اپنی خودمختاری کو عام کرے، الموراوی ریاست کی تشکیل میں چھپے ہوئے ہاتھ کے طور پر کھڑا ہے۔"
  tr: "Zeyneb bint İshaq el-Nefzavi, güzelliği ve liderliğiyle ünlüydü; öyle ki bazı konularda danışmanlık yaptığı söylenir; Ağmat valisi Quta ibn Yusuf el-Mağrawi ile evlendi. Ebu Bekir bin Ömer Almoravid savaşında öldüğünde onunla evlendi. Çöle gidip Yusuf bin Taşfin'i atadığında yerleşti ve onunla evlendi. Yusuf ona işlerinde despotizm göstermesini tavsiye etti ve Almoravid devletinin inşasında sol kol oldu."
  id: "Zaynab bint Ishaq al-Nafzawiya terkenal karena kecantikan dan kepemimpinannya, sampai-sampai dikatakan ia menjadi konsultan dalam berbagai hal; ia menikah dengan Quta ibn Yusuf al-Maghrawi, gubernur Aghmat. Ketika ia meninggal dalam perang Almoravid, Abu Bakr ibn Umar menikahinya. Ketika ia pergi ke gurun dan mengangkat Yusuf ibn Tashfin, ia menetap dan menikahinya. Ia menasihatinya untuk menunjukkan sikap diktator dalam urusannya, dan ia menjadi tangan kiri dalam membangun negara Almoravid."
