summary:
  ar: "أمير المؤمنين المستعين أبو الفضل العباس بن المتوكل بن المعتضد؛ استقر في الخلافة بعهد من أبيه في رجب سنة ثمان وثمانمائة وقرر أيضاً سلطاناً مع الخلافة مدة إلى أن تسلطن المؤيد فعزله من الخلافة وقرر فيها أخاه داود ولقبه المعتضد واعتقل المستعين بالإسكندرية فلم يزل بها إلى أن تكلم ططر في المملكة فأرسل في إطلاقه وأذن له في المجيء إلى القاهرة فاختار الاستمرار بالإسكندرية لأنه استطابها وحصل له مال كثير من التجارة إلى أن توفي بها شهيداً بالطاعون سنة ثلاث وثلاثين وثمانمائة وخلف ولده جدياً {cite:shadharat-dhahab p. 203}."
  en: "al-Musta'in Billah, Abbasid caliph of Cairo from Rajab 808 — briefly sultan as well until al-Mu'ayyad deposed him for his brother al-Mu'tadid Dawud; held at Alexandria, refused repatriation for love of the city and its trade profits, and died there a plague martyr in 833 {cite:shadharat-dhahab p. 203}."
