summary:
  ar: أم أنس خادم النبي، اشتهرت بكنيتها واختُلف في اسمها؛ أسلمت مع السابقين من الأنصار فغضب زوجها الأول مالك وخرج إلى الشام ومات بها، وخطبها أبو طلحة قبل أن يسلم فكان صداقها إسلامه، وغزت مع النبي واتخذت خنجراً يوم حنين.
  en: The mother of Anas, the Prophet's servant, known by her kunya with her name disputed; she embraced Islam among the earliest of the Ansar, her first husband Malik left for Syria angry and died there, Abu Talha proposed to her before he was
    Muslim and his Islam became her dower; she campaigned with the Prophet and carried a dagger at Hunayn.
