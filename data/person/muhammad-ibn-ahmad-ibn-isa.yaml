label: { ar: "محمد بن أحمد بن عيسى بن الشيخ", en: "Muhammad ibn Ahmad ibn Isa", es: "Muhammad ibn Ahmad ibn Isa", fr: "Muhammad ibn Ahmad ibn Isa", ur: "محمد بن احمد ابن عیسیٰ" }
summary:
  ar: "تحصن بآمد بعد وفاة أبيه أحمد بن عيسى بن الشيخ سنة ست وثمانين ومائتين فحاصرها المعتضد وبث جيوشه حولها، ورفض كتاب عمته أم الشريف وقال لرسولها ما بآراء النساء تساس الدول، فلما عظم القتال نزل على الأمان {cite:muruj-al-dhahab p. 604-606}."
  en: "The Shaybanid who held Amad against al-Mu'tadid's siege in 286 until forced down on terms {cite:muruj-al-dhahab p. 604-606}."
  es: "Los shaybaníes que mantuvieron a Amad contra el asedio de al-Mu'tadid en 286 hasta que fueron obligados a ceder bajo ciertas condiciones {cite:muruj-al-dhahab p. 604-606}."
  fr: "Les Shaybanides qui ont tenu Amad contre le siège d'al-Mu'tadid en 286 jusqu'à ce qu'ils soient forcés de se rendre à des conditions {cite:muruj-al-dhahab p. 604-606}."
  ur: "شیبانی جنہوں نے 286 میں عماد کو المتدید کے محاصرے کے خلاف روکا یہاں تک کہ شرائط پر مجبور کیا گیا 604-606}۔"
  tr: "Babası Ahmed bin İsa ibn Şeyh'in 286 Hicri yılında ölümünden sonra Amad'da kendini güçlendirdi. El-Mutadid burayı kuşattı ve ordularını etrafına yaydı. Teyzesi Ümmü Şerif'in mektubunu reddetti ve elçisine kadınların görüşlerinin devletleri yönetmeyeceğini söyledi. Çatışmalar şiddetlendiğinde, güvenle yerleşti {atıf:Muruj-al-Dhahab, s. 604-606}."
  id: "Ia memperkuat dirinya di Amad setelah kematian ayahnya Ahmad ibn Isa ibn al-Sheikh pada tahun 286 H. Al-Mu'tadid mengepungnya dan menyebarkan pasukannya di sekitarnya. Ia menolak surat bibinya um al-Sharif dan memberitahu utusannya bahwa pendapat perempuan tidak akan menguasai negara-negara. Ketika pertempuran semakin sengit, ia menidurkan diri dengan aman {cite:muruj-al-dhahab, hlm. 604-606}."
