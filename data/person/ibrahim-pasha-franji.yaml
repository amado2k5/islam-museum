summary:
  ar: "إبراهيم باشا الفرنجي، الصدر الأعظم في عهد [[person/sulayman-al-qanuni|سليمان القانوني]]؛ ينقل الصلابي أنه حين قويت فتنة قلندر جلبي في قونية ومرعش وهزمت بهرام باشا، نجحت الحيلة مع العصاة إذ استمال إبراهيم باشا بعض رجال قلندر جلبي فقلّت قواته فهُزم وقُتل {cite:dawlat-uthmaniyya-salabi p. 201}."
  en: "Pargalı Ibrahim Pasha, grand vizier under [[person/sulayman-al-qanuni|Süleyman the Magnificent]]; al-Salabi records that when Qalender Çelebi's revolt in Konya and Maraş grew strong enough to kill Bahram Pasha, Ibrahim's stratagem won over some of the rebel's men — his forces dwindled, and he was defeated and killed {cite:dawlat-uthmaniyya-salabi p. 201}."
  es: "Pargalı Ibrahim Pasha, gran visir bajo [[person/sulayman-al-qanuni|Süleyman el Magnífico]]; al-Salabi registra que cuando la revuelta de Qalender Çelebi en Konya y Maraş se hizo lo suficientemente fuerte como para matar a Bahram Pasha, la estratagema de Ibrahim convenció a algunos de los hombres del rebelde; sus fuerzas disminuyeron y fue derrotado y asesinado {cite:dawlat-uthmaniyya-salabi p. 201}."
  fr: "Pargalı Ibrahim Pacha, grand vizir sous [[person/sulayman-al-qanuni|Süleyman le Magnifique]]; al-Salabi rapporte que lorsque la révolte de Qalender Çelebi à Konya et Maraş devint suffisamment forte pour tuer Bahram Pacha, la ruse d'Ibrahim a convaincu certains des hommes du rebelle — ses forces ont diminué, et il a été vaincu et tué {cite:dawlat-uthmaniyya-salabi p. 201}."
  ur: "پارگلی ابراہیم پاشا، وزیر اعظم کے ماتحت [[شخص/سلیمان القانونی|سلیمان عظیم]]؛ الصلبی نے ریکارڈ کیا ہے کہ جب قونیہ اور مراش میں قلندر چیلیبی کی بغاوت اس قدر مضبوط ہوئی کہ بہرام پاشا کو قتل کر دیا جائے، ابراہیم کی حکمت عملی نے باغیوں کے کچھ آدمیوں پر فتح حاصل کر لی - اس کی فوجیں کم ہو گئیں، اور وہ شکست کھا کر ہلاک ہو گیا۔ 201}۔"
  tr: "İbrahim Paşa el-Frangi, [[kişi/süleyman-al-kanuni|Süleyman Müteahhit]] döneminde Sadrazam olmuş; El-Sallabi, Kalandar Çelebi'nin Konya ve Maraş'taki isyanı şiddetlenip Bahram Paşa'nın yenildiğinde, isyancıların başarılı olduğunu, İbrahim Paşa'nın Kâlendar Çelebi'nin bazı adamlarını kazandığını ve kuvvetlerinin zayıfladığını, bunun sonucunda yenildiğini ve öldürüldüğünü bildirir {cite:Dawlat-Uthmaniyya-Salabi, s. 201}."
  id: "Ibrahim Pasha al-Frangi, Wazir Agung pada masa pemerintahan [[orang/sulayman-al-qanuni|Suleiman yang Agung]]; Al-Sallabi melaporkan bahwa ketika pemberontakan Qalandar Çelebi di Konya dan Maraş semakin intens dan Bahram Pasha dikalahkan, para pemberontak berhasil karena Ibrahim Pasha berhasil memenangkan beberapa orang Qalandar Çelebi, sehingga pasukannya melemah, sehingga ia dikalahkan dan dibunuh {cite:dawlat-uthmaniyya-salabi, hlm. 201}."
