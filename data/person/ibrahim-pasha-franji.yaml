  ar: "إبراهيم باشا الفرنجي، الصدر الأعظم في عهد [[person/sulayman-al-qanuni|سليمان القانوني]]؛ ينقل الصلابي أنه حين قويت فتنة قلندر جلبي في قونية ومرعش وهزمت بهرام باشا، نجحت الحيلة مع العصاة إذ استمال إبراهيم باشا بعض رجال قلندر جلبي فقلّت قواته فهُزم وقُتل {cite:dawlat-uthmaniyya-salabi p. 201}."
  en: "Pargalı Ibrahim Pasha, grand vizier under [[person/sulayman-al-qanuni|Süleyman the Magnificent]]; al-Salabi records that when Qalender Çelebi's revolt in Konya and Maraş grew strong enough to kill Bahram Pasha, Ibrahim's stratagem won over some of the rebel's men — his forces dwindled, and he was defeated and killed {cite:dawlat-uthmaniyya-salabi p. 201}."
