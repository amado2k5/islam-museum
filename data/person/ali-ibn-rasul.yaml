label:
  ar: علي بن رسول التركماني
  en: Ali ibn Rasul al-Turkmani
summary:
  ar: "علي بن رسول التركماني، مؤسس دولة بني رسول باليمن؛ كان أستاذ دار الملك المسعود يوسف بن الكامل فاستخلفه على اليمن لما ارتحل إلى مكة مريضاً، وخلع موسى الأشرف بن المسعود واستبد بملك اليمن وأخذ بدعوة الكامل بمصر وبعث أخويه رهناً على الطاعة، ثم هلك سنة 629هـ فولي ابنه المنصور عمر."
  en: "Ali ibn Rasul al-Turkmani, founder of the Rasulid state in Yemen; ustadh-dar of the Ayyubid al-Malik al-Mas'ud Yusuf ibn al-Kamil, left as his lieutenant when al-Mas'ud rode sick to Mecca — he deposed al-Mas'ud's son Musa al-Ashraf, took Yemen for himself while keeping the Kamil's da'wa and sending his brothers as hostages of obedience, then died in 629 AH leaving the throne to his son al-Mansur Umar."
