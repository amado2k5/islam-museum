label:
  ar: علي بن رسول التركماني
  en: Ali ibn Rasul al-Turkmani
  es: "Ali ibn Rasul al-Turkmani"
  fr: "Ali ibn Rasul al-Turkmani"
summary:
  ar: "علي بن رسول التركماني، مؤسس دولة بني رسول باليمن؛ كان أستاذ دار الملك المسعود يوسف بن الكامل فاستخلفه على اليمن لما ارتحل إلى مكة مريضاً، وخلع موسى الأشرف بن المسعود واستبد بملك اليمن وأخذ بدعوة الكامل بمصر وبعث أخويه رهناً على الطاعة، ثم هلك سنة 629هـ فولي ابنه المنصور عمر."
  en: "Ali ibn Rasul al-Turkmani, founder of the Rasulid state in Yemen; ustadh-dar of the Ayyubid al-Malik al-Mas'ud Yusuf ibn al-Kamil, left as his lieutenant when al-Mas'ud rode sick to Mecca — he deposed al-Mas'ud's son Musa al-Ashraf, took Yemen for himself while keeping the Kamil's da'wa and sending his brothers as hostages of obedience, then died in 629 AH leaving the throne to his son al-Mansur Umar."
  es: "Ali ibn Rasul al-Turkmani, fundador del estado rasulí en Yemen; ustadh-dar del ayubí al-Malik al-Mas'ud Yusuf ibn al-Kamil, quien quedó como su lugarteniente cuando al-Mas'ud viajó enfermo a La Meca, depuso al hijo de al-Mas'ud, Musa al-Ashraf, se anexionó Yemen manteniendo la da'wa de Kamil y enviando a sus hermanos como rehenes de obediencia, y murió en el año 629 de la Hégira dejando el trono a su hijo al-Mansur Umar."
  fr: "Ali ibn Rasul al-Turkmani, fondateur de l'État rasulide au Yémen; ustadh-dar de l'Ayyoubide al-Malik al-Mas'ud Yusuf ibn al-Kamil, quitta son poste de lieutenant lorsque al-Mas'ud se rendit malade à La Mecque — il déposa le fils d'al-Mas'ud, Musa al-Ashraf, prit le Yémen pour lui-même tout en maintenant la da'wa de Kamil et en envoyant ses frères comme otages d'obéissance, puis mourut en 629 AH en laissant le trône à son fils al-Mansur Umar."
