label: { ar: "العباس بن عمرو الغنوي", en: "Al-Abbas ibn Amr al-Ghanawi", fr: "Al-Abbas ibn Amr al-Ghanawi", es: "Al-Abbas ibn Amr al-Ghanawi", ur: "العباس ابن عمرو الغنوی" }
summary:
  ar: "خرج من البصرة في سنة سبع وثمانين ومائتين، فيما ذُكر، نحو أبي سعيد الجنابي ومن انضوى إليه من القرامطة {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. وعند ابن الجوزي ولّاه المعتضد في ربيع الآخر سنة سبع وثمانين اليمامة والبحرين ومحاربة أبي سعيد القرمطي فسار إليهم فاقتتلوا فأُسر العباس وقُتل أصحابه فانزعج أهل البصرة وهموا بالجلاء عنها ثم أُطلق، وروي أنه كان معه عشرة آلاف فقبض عليهم أبو سعيد فنجا العباس وحده {cite:muntazam-ibn-al-jawzi p. 316-317}."
  en: "He set out from Basra in 287, as it is reported, toward Abu Sa'id al-Janabi and those of the Qaramita who had joined him {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. According to Ibn al-Jawzi, al-Mu'tadid appointed him in Rabi' al-Akhir 287 over al-Yamama and Bahrayn, and to fight Abu Sa'id al-Qarmati. He marched against them and they fought; al-Abbas was taken prisoner and his companions were killed, and the people of Basra were alarmed and resolved to leave the city, until he was released. It is related that he had ten thousand men with him, whom Abu Sa'id seized, and that al-Abbas alone escaped {cite:muntazam-ibn-al-jawzi p. 316-317}."
  fr: "Il partit de Bassora en 287, à ce que l'on rapporte, contre Abu Sa'id al-Janabi et ceux des Qarmates qui l'avaient rejoint {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. Selon Ibn al-Jawzi, al-Mu'tadid le nomma en rabi' al-akhir 287 sur al-Yamama et Bahrayn, et pour combattre Abu Sa'id al-Qarmati. Il marcha contre eux et ils se battirent ; al-Abbas fut fait prisonnier et ses compagnons tués, et les gens de Bassora, alarmés, résolurent de quitter la ville, jusqu'à ce qu'il soit libéré. On rapporte qu'il avait avec lui dix mille hommes, dont Abu Sa'id s'empara, et qu'al-Abbas seul en réchappa {cite:muntazam-ibn-al-jawzi p. 316-317}."
  es: "Partió de Basora en el año 287, según se relata, hacia Abu Sa'id al-Janabi y los Qaramita que se le habían unido {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. Según Ibn al-Jawzi, al-Mu'tadid lo designó en Rabi' al-Akhir 287 al mando de al-Yamama y Bahrayn, y para luchar contra Abu Sa'id al-Qarmati. Marchó contra ellos y lucharon; al-Abbas fue hecho prisionero y sus compañeros fueron asesinados, y la gente de Basora se alarmó y decidió abandonar la ciudad hasta que fuera liberado. Se cuenta que tenía diez mil hombres con él, a quienes Abu Sa'id capturó, y que al-Abbas fue el único que escapó {cite:muntazam-ibn-al-jawzi pp. 316-317}."
  ur: "وہ بصرہ سے 287 میں روانہ ہوا جیسا کہ روایت ہے کہ ابو سعید الجنبی اور قرمطہ کے ان لوگوں کی طرف جو اس کے ساتھ شامل ہوئے تھے {حوالہ: طبری تاریخ ابو الفضل ج10 ص77}۔ ابن الجوزی کے مطابق، المتعد نے اسے ربیع الآخر 287 میں یمامہ اور بحرین پر اور ابو سعید القرماتی سے لڑنے کے لیے مقرر کیا۔ اس نے ان کے خلاف مارچ کیا اور وہ لڑے۔ عباس کو قید کر لیا گیا اور ان کے ساتھیوں کو قتل کر دیا گیا، اور بصرہ کے لوگ گھبرا گئے اور انہوں نے اس وقت تک شہر چھوڑنے کا عزم کر لیا، جب تک وہ رہا نہ ہو جائیں۔ روایت ہے کہ اس کے ساتھ دس ہزار آدمی تھے جنہیں ابوسعید نے پکڑ لیا اور عباس اکیلے بچ نکلا۔ 316-317}۔"
  tr: "Bahsedildiği üzere, 287 Hicri yılında Ebu Said el-Cennebi ve Karmatilerden kendisine katılanlarla birlikte Basra'dan ayrıldı {kaynak: Tabari-tarikh-ebu-el-fadl c.10 s.77}. İbn el-Cevzi'ye göre, el-Mu'tedid onu 287 Hicri yılının Rabi' el-Ahir ayında el-Yamame ve Bahreyn'i yönetmek ve Ebu Said el-Karmati ile savaşmakla görevlendirdi. Onlara doğru yürüdü ve savaştılar. El-Abbas esir alındı ve arkadaşları öldürüldü. Basra halkı telaşlandı ve oradan kaçmayı düşündü. Sonra serbest bırakıldı. Rivayet edildiğine göre, yanında on bin adam vardı, ancak Ebu Said onları esir aldı ve sadece El-Abbas kurtuldu {kaynak: Muntazam-ibn-el-Cevzi s. 316-317}."
  id: "Ia meninggalkan Basra pada tahun 287 H, sebagaimana disebutkan, bersama Abu Saeed al-Jannabi dan orang-orang yang bergabung dengannya dari kaum Qarmati {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. Menurut Ibn al-Jawzi, al-Mu'tadid menunjuknya pada bulan Rabi' al-Akhir tahun 287 H untuk memerintah al-Yamamah dan Bahrain dan untuk memerangi Abu Saeed al-Qarmati. Ia bergerak menuju mereka, dan mereka bertempur. Al-Abbas ditangkap, dan para sahabatnya terbunuh. Penduduk Basra panik dan mempertimbangkan untuk melarikan diri. Kemudian ia dibebaskan. Diriwayatkan bahwa ia membawa sepuluh ribu orang bersamanya, tetapi Abu Saeed menangkap mereka, dan al-Abbas sendirian berhasil melarikan diri {cite:muntazam-ibn-al-jawzi p. 316-317}."
