id: person/abbas-ibn-amr-al-ghanawi
class: person
label: { ar: "العباس بن عمرو الغنوي", en: "Al-Abbas ibn Amr al-Ghanawi" }
summary:
  ar: "خرج من البصرة في سنة سبع وثمانين ومائتين، فيما ذُكر، نحو أبي سعيد الجنابي ومن انضوى إليه من القرامطة {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. وعند ابن الجوزي ولّاه المعتضد في ربيع الآخر سنة سبع وثمانين اليمامة والبحرين ومحاربة أبي سعيد القرمطي فسار إليهم فاقتتلوا فأُسر العباس وقُتل أصحابه فانزعج أهل البصرة وهموا بالجلاء عنها ثم أُطلق، وروي أنه كان معه عشرة آلاف فقبض عليهم أبو سعيد فنجا العباس وحده {cite:muntazam-ibn-al-jawzi p. 316-317}."
  en: "He set out from Basra in 287, as it is reported, toward Abu Sa'id al-Janabi and those of the Qaramita who had joined him {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. According to Ibn al-Jawzi, al-Mu'tadid appointed him in Rabi' al-Akhir 287 over al-Yamama and Bahrayn, and to fight Abu Sa'id al-Qarmati. He marched against them and they fought; al-Abbas was taken prisoner and his companions were killed, and the people of Basra were alarmed and resolved to leave the city, until he was released. It is related that he had ten thousand men with him, whom Abu Sa'id seized, and that al-Abbas alone escaped {cite:muntazam-ibn-al-jawzi p. 316-317}."
