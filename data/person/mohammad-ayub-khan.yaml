summary:
  ar: "أمير من أسرة بركزاي تولى إمارة أفغانستان لفترة وجيزة (1879-1880)، ويُذكر بلقب «منتصر مايواند» لهزيمته جيشا بريطانيا هنديا في معركة مايواند في 27 يوليو 1880 أثناء الحرب الإنجليزية الأفغانية الثانية. هُزم عند قندهار في سبتمبر من العام نفسه، وعاش لاحقا متقاعدا بريطانيا في لاهور حيث توفي سنة 1914."
  en: "Barakzai prince, briefly Emir of Afghanistan (12 October 1879 – 31 May 1880), remembered as the Victor of Maiwand for defeating a British-Indian army at the Battle of Maiwand on 27 July 1880 during the Second Anglo-Afghan War. Defeated at Kandahar that September, he ended his life as a British pensioner at Lahore, where he died in 1914."
  ur: "بارکزئی شہزادے، مختصر عرصے کے لیے افغانستان کے امیر (12 اکتوبر 1879ء – 31 مئی 1880ء)، جو دوسری اینگلو افغان جنگ میں 27 جولائی 1880ء کو میوند کی جنگ میں برطانوی ہندی فوج کو شکست دینے پر «فاتحِ میوند» کے لقب سے یاد کیے جاتے ہیں۔ اسی سال ستمبر میں قندھار پر شکست کے بعد وہ برطانوی پنشنر کی حیثیت سے لاہور میں رہے اور 1914ء میں وہیں وفات پائی۔"
