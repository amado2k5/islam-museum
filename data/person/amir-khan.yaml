summary:
  ar: "ملاكم بريطاني محترف سابق (وُلد سنة 1986 في بولتون لأسرة باكستانية بنجابية). فاز بفضية أولمبياد أثينا 2004 وهو في السابعة عشرة، وحمل لقب رابطة الملاكمة العالمية للوزن الخفيف الوسط من 2009 ووحّده مع لقب الاتحاد الدولي سنة 2011، ونافس على لقب عالمي للوزن المتوسط ضد ساؤول ألفاريز سنة 2016، واعتزل سنة 2022 بسجل 34 فوزا و6 هزائم. أسس مؤسسة أمير خان الخيرية."
  en: "British former professional boxer (born 1986 in Bolton, to a Pakistani Punjabi family). He won silver at the 2004 Athens Olympics at seventeen, held the WBA light-welterweight title from 2009 and unified it with the IBF title in 2011, challenged Canelo Álvarez for a middleweight world title in 2016, and retired in 2022 with a record of 34 wins and 6 losses. He founded the Amir Khan Foundation."
  ur: "برطانوی سابق پیشہ ور مکے باز (پیدائش 1986، بولٹن، پاکستانی پنجابی خاندان میں)۔ انہوں نے سترہ برس کی عمر میں 2004 کے ایتھنز اولمپکس میں چاندی کا تمغہ جیتا، 2009 سے ڈبلیو بی اے لائٹ ویلٹر ویٹ ٹائٹل رکھا اور 2011 میں اسے آئی بی ایف ٹائٹل کے ساتھ متحد کیا، 2016 میں کینیلو الواریز سے مڈل ویٹ عالمی ٹائٹل کے لیے مقابلہ کیا، اور 2022 میں 34 فتوحات اور 6 شکستوں کے ریکارڈ کے ساتھ ریٹائر ہوئے۔ انہوں نے امیر خان فاؤنڈیشن قائم کی۔"
