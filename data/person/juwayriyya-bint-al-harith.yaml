summary:
  en: "Mother of the Believers; daughter of the chieftain of Banu al-Mustaliq, captured at al-Muraysi'; upon seeking the Prophet's help to pay her ransom contract, he offered to pay it and marry her, which led the Muslims to emancipate a hundred families of her tribe, making Aisha call her the greatest blessing to her people."
  ar: "أم المؤمنين؛ ابنة الحارث بن أبي ضرار سيد بني المصطلق؛ سُبيت يوم المريسيع وكاتبت ثابت بن قيس، فقضى النبي كتابتها وتزوجها، فكان زواجها أعظم بركة على قومها إذ أعتق المسلمون مائة أهل بيت من بني المصطلق إكراماً لأصهار رسول الله."
