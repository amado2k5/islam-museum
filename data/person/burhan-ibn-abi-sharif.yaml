summary:
  ar: "شيخ مشايخ الإسلام ومرجع الخاص والعام؛ ولد بالقدس سنة ثلاث وثلاثين وثمانمائة وأخذ عن أخيه الكمال ثم رحل إلى القاهرة فأخذ الفقه عن العلم البلقيني والشمس القاياتي والأصول عن الجلال المحلي والحديث عن شيخ الإسلام ابن حجر، وتزوج ابنة قاضي القضاة شرف الدين يحيى المناوي وناب عنه. فُوّض إليه قضاء مصر في تاسع عشر ذي الحجة سنة ست وتسعمائة وبقي فيه إلى سنة عشر فعُزل بابن الفرفور، ثم أنعم عليه الغوري بمشيخة قبته قبالة مدرسته الغورية. وفي سنة تسع عشرة أفتى بصحة رجوع رجل وامرأة عن إقرارهما بالزنا فغضب السلطان وأمر بضربهما حتى ماتا تحت الضرب وشنقهما على بابه وعزله مع القضاة الأربعة؛ فلزم بيته والناس يقصدونه ويتقوت من مصبنة له بالقدس ولا يأكل من معاليم المشيخة شيئاً، وكان الناس يقولون إن جميع ما وقع للغوري بسِرّ الشيخ. له شرح المنهاج في أربع مجلدات كبار وشرح الحاوي وكتاب في آيات الناسخ والمنسوخ. توفي فجر الجمعة ليومين من المحرم سنة ثلاث وعشرين ودُفن غربي ضريح الإمام الشافعي {cite:shadharat-dhahab p. 519-520}."
  en: "Shaykh mashayikh al-Islam, 'the recourse of elite and commoner' — b. Jerusalem 833; Egypt's chief qadi 906–910, then shaykh of the Ghuriyya qubba until 919, when he ruled that a coerced adultery confession could be retracted: al-Ghuri had the pair beaten to death and hanged at his door, dismissing him and all four chief judges. He withdrew home, living off a Jerusalem soap-factory, and 'people said all that befell al-Ghuri was by the shaykh's secret'. Author of the four-volume Sharh al-Minhaj; died dawn Friday 2 Muharram 923, buried beside Imam al-Shafi'i {cite:shadharat-dhahab p. 519-520}."
