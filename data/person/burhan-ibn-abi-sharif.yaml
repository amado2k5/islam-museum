summary:
  ar: "شيخ مشايخ الإسلام ومرجع الخاص والعام؛ ولد بالقدس سنة ثلاث وثلاثين وثمانمائة وأخذ عن أخيه الكمال ثم رحل إلى القاهرة فأخذ الفقه عن العلم البلقيني والشمس القاياتي والأصول عن الجلال المحلي والحديث عن شيخ الإسلام ابن حجر، وتزوج ابنة قاضي القضاة شرف الدين يحيى المناوي وناب عنه. فُوّض إليه قضاء مصر في تاسع عشر ذي الحجة سنة ست وتسعمائة وبقي فيه إلى سنة عشر فعُزل بابن الفرفور، ثم أنعم عليه الغوري بمشيخة قبته قبالة مدرسته الغورية. وفي سنة تسع عشرة أفتى بصحة رجوع رجل وامرأة عن إقرارهما بالزنا فغضب السلطان وأمر بضربهما حتى ماتا تحت الضرب وشنقهما على بابه وعزله مع القضاة الأربعة؛ فلزم بيته والناس يقصدونه ويتقوت من مصبنة له بالقدس ولا يأكل من معاليم المشيخة شيئاً، وكان الناس يقولون إن جميع ما وقع للغوري بسِرّ الشيخ. له شرح المنهاج في أربع مجلدات كبار وشرح الحاوي وكتاب في آيات الناسخ والمنسوخ. توفي فجر الجمعة ليومين من المحرم سنة ثلاث وعشرين ودُفن غربي ضريح الإمام الشافعي {cite:shadharat-dhahab p. 519-520}."
  en: "Shaykh mashayikh al-Islam, 'the recourse of elite and commoner' — b. Jerusalem 833; Egypt's chief qadi 906–910, then shaykh of the Ghuriyya qubba until 919, when he ruled that a coerced adultery confession could be retracted: al-Ghuri had the pair beaten to death and hanged at his door, dismissing him and all four chief judges. He withdrew home, living off a Jerusalem soap-factory, and 'people said all that befell al-Ghuri was by the shaykh's secret'. Author of the four-volume Sharh al-Minhaj; died dawn Friday 2 Muharram 923, buried beside Imam al-Shafi'i {cite:shadharat-dhahab p. 519-520}."
  es: "Shaykh mashayikh al-Islam, «el recurso de la élite y del pueblo llano» — n. Jerusalén 833; cadí principal de Egipto 906–910, luego jeque de la qubba Ghuriyya hasta 919, cuando dictaminó que una confesión de adulterio forzada podía ser retractada: al-Ghuri mandó golpear hasta la muerte a la pareja y ahorcarlos en su puerta, destituyéndolo a él y a los cuatro jueces principales. Se retiró a su casa, viviendo de una fábrica de jabón en Jerusalén, y «la gente decía que todo lo que le sucedió a al-Ghuri fue por el secreto del jeque». Autor de la obra en cuatro volúmenes Sharh al-Minhaj; murió al amanecer del viernes 2 de Muharram de 923, enterrado junto al Imam al-Shafi'i {cite:shadharat-dhahab p. 519-520}."
  fr: "Cheikh Mashayikh al-Islam, « le recours de l'élite et du peuple », né à Jérusalem en 833, fut le cadi en chef d'Égypte de 906 à 910, puis cheikh de la qubba Ghuriyya jusqu'en 919. Cette année-là, il décréta qu'un aveu d'adultère extorqué pouvait être rétracté. Al-Ghuri fit alors battre à mort le couple et les fit pendre devant sa porte, le destituant ainsi que les quatre principaux juges. Il se retira chez lui, vivant des revenus d'une savonnerie de Jérusalem, et « on disait que tout ce qui était arrivé à al-Ghuri était dû au secret du cheikh ». Auteur du Sharh al-Minhaj en quatre volumes, il mourut à l'aube du vendredi 2 Muharram 923 et fut enterré auprès de l'imam al-Shafi'i (voir: shadharat-dhahab, p. 519-520)."
  ur: "شیخ مشائخ الاسلام، 'اشرافیہ اور عام لوگوں کا سہارا'۔ یروشلم 833; مصر کے چیف قاضی 906-910، پھر غوریہ قبا کے شیخ 919 تک، جب اس نے یہ فیصلہ دیا کہ جبری زنا کے اعتراف کو واپس لیا جا سکتا ہے: الغوری نے اس جوڑے کو مار مار کر اس کے دروازے پر لٹکا دیا، اسے اور چاروں چیف ججوں کو برطرف کر دیا۔ وہ یروشلم کے صابن کے کارخانے میں رہنے کے بعد گھر واپس لے گیا، اور 'لوگوں نے کہا کہ الغوری پر جو کچھ ہوا وہ شیخ کے راز سے تھا'۔ چار جلدوں کے مصنف شرح المنہاج؛ جمعہ کی صبح 2 محرم 923 کو وفات پائی، امام شافعی کے پہلو میں دفن ہوئے۔ 519-520}۔"
