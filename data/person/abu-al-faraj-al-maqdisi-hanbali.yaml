class: person
label: { ar: "أبو الفرج المقدسي عبد الواحد بن محمد", en: "Abu al-Faraj al-Maqdisi, Abd al-Wahid ibn Muhammad", fr: "Abu al-Faraj al-Maqdisi, Abd al-Wahid ibn Muhammad", es: "Abu al-Faraj al-Maqdisi, Abd al-Wahid ibn Muhammad" }
summary:
  ar: "أبو الفرج عبد الواحد بن محمد بن علي المقدسي، الفقيه الحنبلي الدمشقي المقر، لازم القاضي أبا يعلى بن الفراء وتفقه به، ودرّس ووعظ، وبث مذهب أحمد بأعمال بيت المقدس؛ من تصانيفه المنتخب في الفقه والمبهج والإيضاح والتبصرة في أصول الدين وكتاب الجواهر في التفسير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11493}."
  en: "Abu al-Faraj Abd al-Wahid ibn Muhammad ibn Ali al-Maqdisi, a Hanbali jurist settled in Damascus; he studied with Qadi Abu Ya'la ibn al-Farra, taught and preached, and spread the school of Ahmad ibn Hanbal in the districts of Bayt al-Maqdis; his works include al-Muntakhab in fiqh, al-Mubhij, al-Idah, al-Tabsira in usul al-din and Kitab al-Jawahir in tafsir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11493}."
  fr: "Abu al-Faraj Abd al-Wahid ibn Muhammad ibn Ali al-Maqdisi, juriste hanbalite établi à Damas ; il étudia auprès du cadi Abu Ya'la ibn al-Farra, enseigna et prêcha, et répandit l'école d'Ahmad ibn Hanbal dans les districts de Bayt al-Maqdis ; ses œuvres comprennent al-Muntakhab en fiqh, al-Mubhij, al-Idah, al-Tabsira sur les fondements de la religion et le Kitab al-Jawahir en exégèse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11493}."
  es: "Abu al-Faraj Abd al-Wahid ibn Muhammad ibn Ali al-Maqdisi, jurista hanbali afincado en Damasco; estudió con Qadi Abu Ya'la ibn al-Farra, enseñó y predicó, y difundió la escuela de Ahmad ibn Hanbal en los distritos de Bayt al-Maqdis; sus obras incluyen al-Muntakhab en fiqh, al-Mubhij, al-Idah, al-Tabsira en usul al-din y Kitab al-Jawahir en tafsir {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11493}."
