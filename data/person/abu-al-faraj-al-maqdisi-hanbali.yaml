  ar: "أبو الفرج عبد الواحد بن محمد بن علي المقدسي، الفقيه الحنبلي الدمشقي المقر، لازم القاضي أبا يعلى بن الفراء وتفقه به، ودرّس ووعظ، وبث مذهب أحمد بأعمال بيت المقدس؛ من تصانيفه المنتخب في الفقه والمبهج والإيضاح والتبصرة في أصول الدين وكتاب الجواهر في التفسير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11493}."
  en: "Abu al-Faraj Abd al-Wahid ibn Muhammad ibn Ali al-Maqdisi, a Hanbali jurist settled in Damascus; he studied with Qadi Abu Ya'la ibn al-Farra, taught and preached, and spread the school of Ahmad ibn Hanbal in the districts of Bayt al-Maqdis; his works include al-Muntakhab in fiqh, al-Mubhij, al-Idah, al-Tabsira in usul al-din and Kitab al-Jawahir in tafsir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11493}."
