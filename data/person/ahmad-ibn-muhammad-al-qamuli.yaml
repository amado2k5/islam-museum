summary:
  ar: "أحمد بن محمد بن أبي الحزم، نجم الدين أبو العباس القرشي المخزومي القَمُولي الشافعي، نسبة إلى «قمولة» بصعيد مصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14964} كان إمامًا في الفقه عارفًا بالأصول والعربية، وناب في الحكم بمصر، وولي الحسبة والتدريس والقضاء في مدن عدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14964} من تصانيفه «البحر المحيط في شرح الوسيط» للغزالي، و«جواهر البحر»، و«الروض الزاهر فيما يحتاج إليه المسافر»، و«موضح الطريق»، و«شرح الكافية» لابن الحاجب، و«تكملة تفسير ابن الخطيب». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14964}"
  en: "Ahmad ibn Muhammad ibn Abi al-Hazm, Najm al-Din Abu al-Abbas al-Qurashi al-Makhzumi al-Qamuli al-Shafi'i, named after Qamula in Upper Egypt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14964} He was an imam in fiqh, knowledgeable in usul and Arabic, deputised in judgement in Egypt, and held the hisba, teaching and judgeship in several cities. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14964} His works include al-Bahr al-muhit, a commentary on al-Ghazali's al-Wasit, Jawahir al-bahr, al-Rawd al-zahir, Mawdih al-tariq, a commentary on Ibn al-Hajib's al-Kafiya, and a completion of Ibn al-Khatib's tafsir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14964}"
