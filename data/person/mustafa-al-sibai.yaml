summary:
  ar: "مصطفى حسني السباعي ⁦(1915 – 3 أكتوبر 1964)⁩ عالم فقيه وداعية وسياسي سوري؛ أول سوري ينال الدكتوراه في الشريعة من الأزهر (1949) بأطروحته «السنة ومكانتها في التشريع الإسلامي»، ومؤسس الإخوان المسلمين في سوريا وأول مراقب عام لها (1945)، ومؤسس كلية الشريعة بجامعة دمشق وأول عميد لها (1955)، ونائب عن دمشق (1949)؛ من مؤلفاته «اشتراكية الإسلام» و«المرأة بين الفقه والقانون» و«من روائع حضارتنا»."
  en: "Mustafa Husni al-Siba'i (1915 – 3 October 1964) was a Syrian jurist, preacher and politician: the first Syrian to earn a doctorate in Sharia from al-Azhar (1949), with the thesis 'The Sunna and its Place in Islamic Legislation'; founder of the Muslim Brotherhood in Syria and its first General Guide (1945); founder of the Faculty of Sharia at Damascus University and its first dean (1955); and a Damascus deputy in parliament from 1949. His books include The Socialism of Islam, Woman between Fiqh and Law and Glimpses of our Civilisation."
  ur: "مصطفی حسنی السباعی (1915ء – 3 اکتوبر 1964ء) سوری عالمِ فقیہ، داعی اور سیاست دان تھے؛ الازہر سے شریعت میں ڈاکٹریٹ پانے والے پہلے سوری (1949ء)، جن کا مقالہ «السنہ و مکانتہا فی التشریع الاسلامی» تھا؛ سوریہ میں اخوان المسلمون کے بانی اور اس کے پہلے مراقبِ عام (1945ء)؛ جامعہ دمشق کی کلیۂ شریعہ کے بانی اور پہلے عمید (1955ء)؛ اور 1949ء میں دمشق سے رکنِ پارلیمان۔ ان کی تصانیف میں «اشتراکیۃ الاسلام»، «المرأة بین الفقہ والقانون» اور «من روائع حضارتنا» شامل ہیں۔"
