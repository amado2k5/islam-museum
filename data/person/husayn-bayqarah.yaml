summary:
  ar: "بطاقة أولية لسلطان حسين بايقرا، آخر سلاطين التيموريين الكبار في هراة وعاصر جامي وبهزاد، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Sultan Husayn Bayqarah, the last great Timurid at Herat and patron of Jami and Bihzad, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para el sultán Husayn Bayqarah, el último gran timúrida de Herat y mecenas de Jami y Bihzad, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de projet du sultan Husayn Bayqarah, le dernier grand Timouride à Hérat et protecteur de Jami et Bihzad, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "ہرات کے آخری عظیم تیموری اور جامی اور بہزاد کے سرپرست سلطان حسین باقرہ کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ سے بیان کیا گیا ہے ⁦(وکی ڈیٹا)⁩؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Herat'taki son büyük Timuri sultanı ve Cami ile Behzad'ın çağdaşı olan Sultan Hüseyin Bayqra'nın ön kartı açık bir referans tanımında (Wikidata) belirtilmiştir. Hasan İbrahim'in İslam Tarihi adlı eserindeki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan Sultan Husayn Bayqra, sultan Timurid utama terakhir di Herat dan sezaman Jami dan Behzad, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
