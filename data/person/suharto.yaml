summary:
  ar: "عسكري وسياسي إندونيسي، وُلد سنة 1921 في كيميوسوك قرب يوغياكارتا لأبوين جاويين مسلمين. صعد في الجيش، وتولى السلطة بين 1965 و1967 وصار ثاني رئيس لإندونيسيا، فحكم بنظامه «النظام الجديد» حتى استقالته سنة 1998 إثر الأزمة المالية الآسيوية، وتوفي في جاكرتا سنة 2008."
  en: "Indonesian military officer and politician, born in 1921 at Kemusuk near Yogyakarta to Javanese Muslim parents. He rose through the army, took power in 1965–1967 and became Indonesia's second president, ruling under his 'New Order' until his resignation in 1998 during the Asian financial crisis; he died at Jakarta in 2008."
  ur: "انڈونیشی فوجی افسر اور سیاست دان، جو 1921ء میں یوگیاکارتا کے قریب کیموسوک میں جاوی مسلمان والدین کے ہاں پیدا ہوئے۔ فوج میں ترقی پائی، 1965ء–1967ء میں اقتدار سنبھالا اور انڈونیشیا کے دوسرے صدر بنے؛ اپنے «نیو آرڈر» کے تحت 1998ء میں ایشیائی مالی بحران کے دوران استعفے تک حکمران رہے، اور 2008ء میں جکارتہ میں انتقال کر گئے۔"
