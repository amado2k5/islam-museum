summary:
  ar: "أبو نزار؛ إليه ينتهي الجزء المتفق على صحته من نسب النبي عند أهل السير والأنساب {cite:mubarakpuri-raheeq p.48}، وعنده يقف كثير من النسابين لقوله «كذب النسّابون» حين يبلغ النسب عدنان {cite:ibn-hisham-sira 1/1-4} {cite:muruj-al-dhahab p.565-566}، وعند بعضهم أن قضاعة بن معد من ولده وعند آخرين هو قحطاني."
  en: "Father of Nizar; the agreed-sound part of the Prophet's lineage ends at him with the sira and genealogy scholars {cite:mubarakpuri-raheeq p.48}, and many genealogists stop here on the report «the genealogists lie» when the line reaches Adnan {cite:ibn-hisham-sira 1/1-4} {cite:muruj-al-dhahab p.565-566}; some count Quda'a ibn Ma'add among his sons, others make Quda'a Qahtani."
