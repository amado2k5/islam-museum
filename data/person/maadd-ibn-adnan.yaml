summary:
  ar: "معد بن عدنان الذي ينتهي إليه نسب العرب العدنانية، نهى النبي أن يتجاوز عنه في النسب لعلمه بتباعد الأنساب وكثرة الآراء في طول المدة والأعصار، وقد اختلف أهل النسب فيما فوقه على ما ذكر المسعودي من نسخة ابن هشام عن ابن إسحاق ونسخة أخرى ورواية ابن الأعرابي عن هشام بن محمد الكلبي {cite:muruj-al-dhahab p. 565-566}."
  en: "The Adnani forefather at whom the Prophet bade genealogy stop — above him the copies diverge, in Ibn Hisham's rescension, another version, and Ibn al-A'rabi's from Hisham al-Kalbi {cite:muruj-al-dhahab p. 565-566}."
  es: "El antepasado Adnani en quien el Profeta ordenó detener la genealogía —por encima de él las copias divergen, en la recensión de Ibn Hisham, otra versión, y la de Ibn al-A'rabi de Hisham al-Kalbi {cite:muruj-al-dhahab p. 565-566}."
  fr: "L'ancêtre Adnani auquel le Prophète a ordonné d'arrêter la généalogie — au-delà de lui les copies divergent, dans la recension d'Ibn Hisham, une autre version, et celle d'Ibn al-A'rabi d'après Hisham al-Kalbi {cite:muruj-al-dhahab p. 565-566}."
  ur: "عدنانی باپ دادا جن پر نبی نے نسب بند کرنے کا حکم دیا تھا - ان کے اوپر نقلیں مختلف ہوتی ہیں، ابن ہشام کی رجعت میں، ایک اور نسخہ، اور ابن العربی کا ہشام الکلبی سے۔ 565-566}۔"
