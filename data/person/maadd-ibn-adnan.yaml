label: { ar: "معد بن عدنان", en: "Ma'add ibn 'Adnan" }
summary:
  ar: "معد بن عدنان الذي ينتهي إليه نسب العرب العدنانية، نهى النبي أن يتجاوز عنه في النسب لعلمه بتباعد الأنساب وكثرة الآراء في طول المدة والأعصار، وقد اختلف أهل النسب فيما فوقه على ما ذكر المسعودي من نسخة ابن هشام عن ابن إسحاق ونسخة أخرى ورواية ابن الأعرابي عن هشام بن محمد الكلبي {cite:muruj-al-dhahab p. 565-566}."
  en: "The Adnani forefather at whom the Prophet bade genealogy stop — above him the copies diverge, in Ibn Hisham's rescension, another version, and Ibn al-A'rabi's from Hisham al-Kalbi {cite:muruj-al-dhahab p. 565-566}."
