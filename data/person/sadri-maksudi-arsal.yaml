summary:
  ar: "حقوقي وسياسي وعالم تاتاري (1878–1957)، وُلد في طاشسو قرب قازان وتوفي في إسطنبول. كان نائبًا عن قازان في مجلس الدوما الروسي الثاني والثالث، ورئيسًا لدولة إيديل أورال قصيرة العمر سنة 1918، ثم هاجر بعد انتصار البلاشفة فصار أستاذًا لتاريخ الحقوق في أنقرة وإسطنبول ونائبًا لثلاث دورات في البرلمان التركي."
  en: "Tatar jurist, politician and scholar (1878–1957), born at Taşsu near Kazan and died at Istanbul. He sat for Kazan in the second and third Russian State Dumas and was president of the short-lived Idel-Ural State in 1918; after the Bolshevik victory he emigrated, becoming a professor of legal history at Ankara and Istanbul and a deputy for three terms in the Turkish parliament."
  ur: "تاتار قانون دان، سیاست دان اور عالم (1878–1957)، جو قازان کے قریب طاشسو میں پیدا ہوئے اور استنبول میں وفات پائے۔ روسی دوما کے دوسرے اور تیسرے اجلاس میں قازان کے نائب رہے اور 1918 میں قلیل مدتی ریاستِ ادیل اورال کے صدر بنے؛ بالشویکوں کی کامیابی کے بعد ہجرت کر کے انقرہ اور استنبول میں تاریخِ قانون کے استاد اور ترک پارلیمان میں تین مدتوں تک نائب رہے۔"
