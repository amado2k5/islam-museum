summary:
  ar: "حسن الذوادي (وُلد سنة 1978) محامٍ قطري كان الأمين العام للجنة العليا للمشاريع والإرث، الجهة التي سلّمت كأس العالم 2022 في قطر. تخرج في القانون من جامعة شيفيلد، وقاد ملف استضافة قطر للمونديال وتنظيمه، وكان وجه قطر الأبرز في الرد على الانتقادات المتعلقة بحقوق العمال ومزاعم فساد ملف الاستضافة، التي نفاها."
  en: "Hassan Al Thawadi (born 1978) is a Qatari lawyer who was Secretary General of the Supreme Committee for Delivery and Legacy, the body that delivered the 2022 FIFA World Cup in Qatar. A law graduate of the University of Sheffield, he led Qatar's bid and tournament delivery and was the country's most prominent public voice in answering criticism over workers' rights and the bid-corruption allegations, which he denied."
  ur: "حسن الذوادی (پیدائش 1978) قطری وکیل ہیں جو سپریم کمیٹی فار ڈیلیوری اینڈ لیگسی کے سیکرٹری جنرل رہے، وہ ادارہ جس نے قطر میں 2022 فیفا عالمی کپ منعقد کرایا۔ یونیورسٹی آف شیفیلڈ سے قانون کے فارغ، انھوں نے قطر کی میزبانی کی بولی اور ٹورنامنٹ کی تکمیل کی قیادت کی اور مزدوروں کے حقوق پر تنقید اور بولی میں بدعنوانی کے الزامات کے جواب میں ملک کی نمایاں ترین عوامی آواز رہے، جن الزامات کی انھوں نے تردید کی۔"
