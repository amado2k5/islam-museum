summary:
  ar: "سياسي غاني (1909–1972) من نكروفول في ساحل الذهب، قاد حزب المؤتمر الشعبي إلى استقلال غانا سنة 1957 فصار أول رئيس وزرائها، ثم أول رئيس للجمهورية (1960–1966) وأبرز دعاة الوحدة الإفريقية ومن مؤسسي منظمة الوحدة الإفريقية، حتى أطاح به الجيش سنة 1966 فعاش منفيا في غينيا ومات في بوخارست في 27 أبريل 1972. نشأ كاثوليكيا وتعمّد في الإيمان الكاثوليكي وعلّم في معهد كاثوليكي وفكّر في أن يصير يسوعيا؛ لم ينسبه أي مصدر مستعمل إلى الإسلام قط، وهو يقف في المتحف ضمن قائمة القادة المعاصرين المفوَّضة من المؤسس لا بوصفه مسلما."
  en: "Ghanaian politician (1909–1972) from Nkroful in the Gold Coast who led the Convention People's Party to Ghana's independence in 1957, becoming its first prime minister and then first president of the republic (1960–1966), a leading Pan-Africanist and a founder of the Organisation of African Unity, until the army overthrew him in 1966; he lived in exile in Guinea and died in Bucharest on 27 April 1972. He was raised Catholic, baptised into the Catholic faith, taught at a Catholic seminary and considered becoming a Jesuit; no source used presents him as a Muslim, and he stands in the museum on the founder's contemporary-leaders queue, not as a Muslim figure."
  ur: "گھانائی سیاست دان ⁦(1909ء–1972ء)⁩، ساحلِ ذہب کے نکروفول سے؛ کنونشن پیپلز پارٹی کو 1957ء میں گھانا کی آزادی تک لے گئے، پہلے وزیرِ اعظم اور پھر جمہوریہ کے پہلے صدر ⁦(1960ء–1966ء)⁩ بنے، پان افریقی اتحاد کے ممتاز داعی اور تنظیمِ وحدتِ افریقہ کے بانیوں میں سے تھے، یہاں تک کہ 1966ء میں فوج نے انھیں ہٹا دیا؛ گنی میں جلاوطنی گزاری اور 27 اپریل 1972ء کو بخارسٹ میں انتقال ہوا۔"
  es: "Político ghanés (1909-1972) originario de Nkroful, en la Costa de Oro, que lideró el Partido de la Convención Popular hacia la independencia de Ghana en 1957, convirtiéndose en su primer primer ministro y luego en el primer presidente de la república (1960-1966). Fue un destacado panafricanista y fundador de la Organización para la Unidad Africana, hasta que el ejército lo derrocó en 1966. Vivió en el exilio en Guinea y falleció en Bucarest el 27 de abril de 1972. Fue criado en la fe católica, bautizado en la fe católica, enseñó en un seminario católico y consideró la posibilidad de hacerse jesuita; ninguna fuente lo presenta como musulmán, y en el museo figura en la fila de líderes contemporáneos del fundador, no como una figura musulmana."
  fr: "Homme politique ghanéen (1909-1972) originaire de Nkroful, en Côte-de-l'Or, il mena le Convention People's Party à l'indépendance du Ghana en 1957, dont il devint le premier Premier ministre puis le premier président (1960-1966). Figure de proue du panafricanisme et fondateur de l'Organisation de l'unité africaine, il fut renversé par l'armée en 1966. Il vécut en exil en Guinée et mourut à Bucarest le 27 avril 1972. Élevé dans la foi catholique, il fut baptisé, fit ses études dans un séminaire catholique et envisagea de devenir jésuite. Aucune source ne le présente comme musulman, et au musée, il figure parmi les contemporains du fondateur, et non comme une figure musulmane."
  tr: "Altın Kıyı'daki Necroful'dan Ganalı bir politikacı (1909–1972) olan Parti, 1957'de Halk Kongresi partisini Gana'nın bağımsızlığına taşıdı; partinin ilk Başbakanı, ardından Cumhuriyetin ilk Cumhurbaşkanı (1960–1966) oldu ve Afrika birliğinin önde gelen savunucularından biri ve Afrika Birliği Örgütü'nün kurucularından biri oldu; ta ki 1966'da ordu tarafından devrilene kadar. Gine'de sürgünde yaşadı ve 27 Nisan 1972'de Bükreş'te hayatını kaybetti. Katolik olarak yetiştirildi, Katolik inancıyla vaftiz edildi, Katolik bir enstitüde eğitim aldı ve Cizvit olmayı düşündü; hiçbir kullanılan kaynak onu İslam'a atfetmedi ve müzede, kurucusunun görev yaptığı çağdaş liderler listesinde yer alıyor, ancak Müslüman olarak değil."
  id: "Seorang politikus Ghana (1909–1972) dari Necroful di Gold Coast, ia memimpin partai People's Congress menuju kemerdekaan Ghana pada tahun 1957, menjadi Perdana Menteri pertama, kemudian Presiden Republik pertama (1960–1966), serta pendukung terkemuka persatuan Afrika dan salah satu pendiri Organisasi Persatuan Afrika, hingga ia digulingkan oleh tentara pada tahun 1966. Ia hidup dalam pengasingan di Guinea dan meninggal di Bucharest pada 27 April 1972. Ia dibesarkan sebagai Katolik, dibaptis dalam iman Katolik, belajar di institusi Katolik, dan mempertimbangkan untuk menjadi seorang Jesuit; tidak ada sumber yang pernah mengaitkannya dengan Islam, dan ia berada di museum tersebut di antara daftar pemimpin kontemporer yang ditugaskan oleh pendiri, bukan sebagai seorang Muslim."
