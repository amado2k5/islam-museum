summary:
  ar: "سياسي غاني (1909–1972) من نكروفول في ساحل الذهب، قاد حزب المؤتمر الشعبي إلى استقلال غانا سنة 1957 فصار أول رئيس وزرائها، ثم أول رئيس للجمهورية (1960–1966) وأبرز دعاة الوحدة الإفريقية ومن مؤسسي منظمة الوحدة الإفريقية، حتى أطاح به الجيش سنة 1966 فعاش منفيا في غينيا ومات في بوخارست في 27 أبريل 1972. نشأ كاثوليكيا وتعمّد في الإيمان الكاثوليكي وعلّم في معهد كاثوليكي وفكّر في أن يصير يسوعيا؛ لم ينسبه أي مصدر مستعمل إلى الإسلام قط، وهو يقف في المتحف ضمن قائمة القادة المعاصرين المفوَّضة من المؤسس لا بوصفه مسلما."
  en: "Ghanaian politician (1909–1972) from Nkroful in the Gold Coast who led the Convention People's Party to Ghana's independence in 1957, becoming its first prime minister and then first president of the republic (1960–1966), a leading Pan-Africanist and a founder of the Organisation of African Unity, until the army overthrew him in 1966; he lived in exile in Guinea and died in Bucharest on 27 April 1972. He was raised Catholic, baptised into the Catholic faith, taught at a Catholic seminary and considered becoming a Jesuit; no source used presents him as a Muslim, and he stands in the museum on the founder's contemporary-leaders queue, not as a Muslim figure."
  ur: "گھانائی سیاست دان (1909ء–1972ء)، ساحلِ ذہب کے نکروفول سے؛ کنونشن پیپلز پارٹی کو 1957ء میں گھانا کی آزادی تک لے گئے، پہلے وزیرِ اعظم اور پھر جمہوریہ کے پہلے صدر (1960ء–1966ء) بنے، پان افریقی اتحاد کے ممتاز داعی اور تنظیمِ وحدتِ افریقہ کے بانیوں میں سے تھے، یہاں تک کہ 1966ء میں فوج نے انھیں ہٹا دیا؛ گنی میں جلاوطنی گزاری اور 27 اپریل 1972ء کو بخارسٹ میں انتقال ہوا۔"
