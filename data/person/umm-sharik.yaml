summary:
  ar: صحابية من بني عامر بن لؤي، اختُلف في اسمها ونسبها؛ تروي بعض الأخبار أنها أسلمت بمكة ودعت نساء قريش سراً فعُذبت، وأنها وهبت نفسها للنبي فلم يقبلها ولم تتزوج حتى ماتت؛ وقد نبّه ابن حجر على ضعف بعض أسانيد ذلك.
  en: A Companion of Banu Amir ibn Lu'ayy whose name and lineage are disputed; some reports say she embraced Islam at Mecca, called the women of Quraysh in secret and was tortured, and that she offered herself to the Prophet, who did not accept,
    and she never married; Ibn Hajar points out the weakness of some chains.
