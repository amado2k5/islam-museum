summary:
  ar: "طبيب يوناني هندي (1868–1927) من دلهي، من أسرة أطباء خدمت البلاط المغولي، لُقّب بـ«مسيح الملك». أسس كلية الطبية في دلهي وكان من مؤسسي الجامعة الملية الإسلامية وأول مستشار لها (1920–1927)، وترأس المؤتمر الوطني الهندي والرابطة الإسلامية ولجنة الخلافة."
  en: "Indian Unani physician of Delhi (1868–1927), from a family of physicians who had served the Mughal court, honoured as Masih-ul-Mulk, 'Healer of the Nation'. He founded the Tibbia College in Delhi, was a founder of Jamia Millia Islamia and its first chancellor (1920–1927), and presided over the Indian National Congress, the Muslim League and the Khilafat Committee."
  ur: "دہلی کے ہندوستانی یونانی طبیب (1868ء–1927ء)، اطبا کے اس خاندان سے تھے جو مغل دربار سے وابستہ رہا، ’مسیح الملک‘ کہلائے۔ انھوں نے دہلی میں طبیہ کالج قائم کیا، جامعہ ملیہ اسلامیہ کے بانیوں میں سے تھے اور اس کے پہلے شیخ الجامعہ (1920ء–1927ء) رہے، اور انڈین نیشنل کانگریس، مسلم لیگ اور خلافت کمیٹی کی صدارت کی۔"
