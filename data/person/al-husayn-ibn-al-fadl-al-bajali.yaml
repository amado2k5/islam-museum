  en: "Al-Husayn ibn al-Fadl al-Bajali"
summary:
  ar: "الحسين بن الفضل بن عمير البجلي، أبو علي، الكوفي ثم النيسابوري، المفسر اللغوي المحدث، إمام عصره في معاني القرآن. أقدمه ابن طاهر إلى نيسابور فبقي يعلم الناس ويفتي بها حتى توفي. سمع من يزيد بن هارون والحسن بن قتيبة وحميد الطويل وطائفة من الكبار، وحدّث عنه أبو الطيب محمد بن عبد الله بن المبارك ومحمد بن صالح بن هانئ وآخرون. ويذكر العنوان أن ولادته سنة 178 هـ ووفاته سنة 282 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15815}"
  en: "Al-Husayn ibn al-Fadl ibn Umayr al-Bajali, Abu Ali, of Kufa and then Nishapur, an exegete, philologist and hadith scholar, the leading authority of his age on the meanings of the Qur'an. Ibn Tahir brought him to Nishapur, where he taught and gave fatwas until his death. He heard from Yazid ibn Harun, al-Hasan ibn Qutayba, Humayd al-Tawil and others, and transmitted to him Abu al-Tayyib Muhammad ibn Abd Allah ibn al-Mubarak and Muhammad ibn Salih ibn Hani. The header gives his birth as 178 AH and his death as 282 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15815}"
