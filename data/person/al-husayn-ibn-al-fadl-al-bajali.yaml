summary:
  ar: "الحسين بن الفضل بن عمير البجلي، أبو علي، الكوفي ثم النيسابوري، المفسر اللغوي المحدث، إمام عصره في معاني القرآن. أقدمه ابن طاهر إلى نيسابور فبقي يعلم الناس ويفتي بها حتى توفي. سمع من يزيد بن هارون والحسن بن قتيبة وحميد الطويل وطائفة من الكبار، وحدّث عنه أبو الطيب محمد بن عبد الله بن المبارك ومحمد بن صالح بن هانئ وآخرون. ويذكر العنوان أن ولادته سنة 178 هـ ووفاته سنة 282 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15815}"
  en: "Al-Husayn ibn al-Fadl ibn Umayr al-Bajali, Abu Ali, of Kufa and then Nishapur, an exegete, philologist and hadith scholar, the leading authority of his age on the meanings of the Qur'an. Ibn Tahir brought him to Nishapur, where he taught and gave fatwas until his death. He heard from Yazid ibn Harun, al-Hasan ibn Qutayba, Humayd al-Tawil and others, and transmitted to him Abu al-Tayyib Muhammad ibn Abd Allah ibn al-Mubarak and Muhammad ibn Salih ibn Hani. The header gives his birth as 178 AH and his death as 282 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15815}"
  es: "Al-Husayn ibn al-Fadl ibn Umayr al-Bajali, Abu Ali, de Kufa y luego de Nishapur, fue un exegeta, filólogo y erudito de hadices, la principal autoridad de su época en la interpretación del Corán. Ibn Tahir lo llevó a Nishapur, donde enseñó y emitió fatuas hasta su muerte. Recibió enseñanzas de Yazid ibn Harun, al-Hasan ibn Qutayba, Humayd al-Tawil y otros, y le transmitió las enseñanzas de Abu al-Tayyib Muhammad ibn Abd Allah ibn al-Mubarak y Muhammad ibn Salih ibn Hani. El encabezado indica que nació en el año 178 de la Hégira y falleció en el año 282 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15815}"
  fr: "Al-Husayn ibn al-Fadl ibn Umayr al-Bajali, dit Abu Ali, originaire de Koufa puis de Nishapur, était un exégète, philologue et spécialiste du hadith, considéré comme la plus grande autorité de son époque en matière d'interprétation du Coran. Ibn Tahir l'amena à Nishapur, où il enseigna et émit des fatwas jusqu'à sa mort. Il reçut l'enseignement de Yazid ibn Harun, d'al-Hasan ibn Qutayba, d'Humayd al-Tawil et d'autres, et reçut également celui d'Abu al-Tayyib Muhammad ibn Abd Allah ibn al-Mubarak et de Muhammad ibn Salih ibn Hani. La notice biographique indique sa naissance en 178 AH et sa mort en 282 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15815}"
  ur: "الحسین بن الفضل ابن عمیر البجلی، ابو علی، کوفہ اور پھر نیشاپور، ایک مفسر، فلسفی اور حدیث کے اسکالر، قرآن کے معانی پر اپنے زمانے کے سب سے بڑے اتھارٹی۔ ابن طاہر اسے نیشاپور لے آئے، جہاں اس نے مرتے دم تک پڑھایا اور فتویٰ دیا۔ اس نے یزید بن ہارون، حسن بن قتیبہ، حمید التویل اور دیگر لوگوں سے سنا، اور ابو الطیب محمد بن عبد اللہ ابن المبارک اور محمد بن صالح بن ہانی سے سنا۔ ہیڈر ان کی ولادت 178ھ اور وفات 282ھ بتاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 15815}"
