id: person/al-samiri-ibn-sinina
class: person
label: { ar: "ابن سنينة السامري", en: "Ibn Sinina al-Samiri", fr: "Ibn Sinina al-Samiri", es: "Ibn Sinina al-Samiri", ur: "ابن سینا السمیری۔" }
summary:
  ar: "أبو عبد الله نصير الدين محمد بن عبد الله بن الحسين السامري الفقيه الفرضي الحنبلي المعروف بابن سنينة؛ قال ابن النجار ولد سنة خمس وثلاثين وخمسمائة بسامرا وسمع من ابن البطي وأبي حكيم النهرواني وغيرهما ببغداد وتفقه على أبي حكيم ولازمه وبرع في الفقه والفرائض وصنف فيهما تصانيف مشهورة منها «كتاب المستوعب في الفقه» و«كتاب الفروق» و«كتاب البيان في الفرائض»؛ وولي القضاء بسامرا وأعمالها مدة ثم ولي القضاء والحسبة ببغداد ثم عُزل عن القضاء وبقي على الحسبة ثم عُزل عنها وولي إشراف ديوان الزمام وعُزل أيضاً ولُقب في أيام ولاياته معظم الدين، ولما عُزل لزم بيته مدة ثم أُذن له بالعود إلى بلده فعاد إليها ثم رجع إلى بغداد في آخر عمره وبها توفي؛ توفي ليلة الثلاثاء سابع عشر رجب سنة ست عشرة وستمائة ودفن بمقبرة باب حرب {cite:shadharat-dhahab p. 70-71}."
  en: "Abu Abdallah Nasir al-Din Muhammad ibn Abdallah ibn al-Husayn al-Samiri, the Hanbali jurist and expert in inheritance law, known as Ibn Sinina. Ibn al-Najjar said he was born at Samarra in 535 and heard from Ibn al-Batti, Abu Hakim al-Nahrawani and others at Baghdad. He studied fiqh under Abu Hakim, kept close to him, and excelled in fiqh and the furud, writing well-known works on both, among them al-Mustawab fi al-fiqh, Kitab al-Furuq and al-Bayan fi al-faraid. He served for a time as qadi of Samarra and its districts, then as qadi and muhtasib of Baghdad. He was dismissed from the qadiship and kept the hisba, was then dismissed from that too and put in charge of the Diwan al-Zimam, and was dismissed from that as well. During his terms of office he was given the title Mu'azzam al-Din. After his dismissal he kept to his house for a time, was then permitted to return to his town and went back, and at the end of his life returned to Baghdad, where he died. He died on the night of Tuesday 17 Rajab 616 and was buried in the cemetery of Bab Harb {cite:shadharat-dhahab p. 70-71}."
  fr: "Abu Abdallah Nasir al-Din Muhammad ibn Abdallah ibn al-Husayn al-Samiri, le juriste hanbalite et expert en droit de l'héritage, connu sous le nom d'Ibn Sinina. Ibn al-Najjar dit qu'il est né à Samarra en 535 et a entendu Ibn al-Batti, Abu Hakim al-Nahrawani et d'autres à Bagdad. Il a étudié le fiqh sous Abou Hakim, s'est tenu près de lui et a excellé dans le fiqh et le furud, écrivant des œuvres bien connues sur les deux, parmi lesquelles al-Mustawab fi al-fiqh, Kitab al-Furuq et al-Bayân fi al-faraïd. Il a servi pendant un certain temps comme qadi de Samarra et ses districts, puis comme qadi et muhtasib de Bagdad. Il a été renvoyé de la cadiat et a gardé l'hisba, a ensuite été congédié de cela aussi et mis en charge du Diwan al-Zimam, et a également été congédié de cela. Pendant son mandat, il a reçu le titre de Mu'azzam al-Din. Après son renvoi, il resta chez lui pendant un certain temps, fut ensuite autorisé à retourner dans sa ville et revint, et à la fin de sa vie retourna à Bagdad, où il mourut. Il est mort dans la nuit du mardi 17 Rajab 616 et a été enterré dans le cimetière de Bab Harb {cite:shadharat-dhahab p. 70-71}."
  es: "Abu Abdallah Nasir al-Din Muhammad ibn Abdallah ibn al-Husayn al-Samiri, el jurista hanbalí y experto en derecho sucesorio, conocido como Ibn Sinina. Ibn al-Najjar dijo que nació en Samarra en 535 y que tuvo conocimiento de Ibn al-Batti, Abu Hakim al-Nahrawani y otros en Bagdad. Estudió fiqh con Abu Hakim, mantuvo una estrecha relación con él y sobresalió en fiqh y furud, escribiendo obras reconocidas sobre ambos temas, entre ellas al-Mustawab fi al-fiqh, Kitab al-Furuq y al-Bayan fi al-faraid. Sirvió durante un tiempo como cadí de Samarra y sus distritos, luego como cadí y muhtasib de Bagdad. Fue destituido del cadí y conservó la hisba, luego fue destituido también de esta y puesto a cargo del Diwan al-Zimam, y posteriormente fue destituido también de este. Durante su mandato se le otorgó el título de Mu'azzam al-Din. Tras su destitución, permaneció un tiempo en su casa, luego se le permitió regresar a su ciudad natal y volvió, y al final de su vida regresó a Bagdad, donde falleció. Murió la noche del martes 17 de Rajab de 616 y fue enterrado en el cementerio de Bab Harb {cita: shadharat-dhahab, págs. 70-71}."
  ur: "ابو عبد اللہ ناصر الدین محمد بن عبداللہ ابن الحسین السمیری، حنبلی فقیہ اور وراثت کے قانون کے ماہر، ابن سینا کے نام سے مشہور ہیں۔ ابن النجار نے کہا کہ وہ سامرہ میں 535 میں پیدا ہوئے اور بغداد میں ابن البطی، ابو حکیم النہروانی اور دیگر سے سنا۔ انہوں نے ابو حکیم کے ماتحت فقہ کی تعلیم حاصل کی، ان کے قریب رہے، اور فقہ اور فرود میں مہارت حاصل کی، دونوں پر معروف تصانیف لکھیں، ان میں المستواب فی الفقہ، کتاب الفروق اور البیان فی الفرید ہیں۔ اس نے کچھ عرصہ سامرا اور اس کے اضلاع کے قاضی کی حیثیت سے خدمات انجام دیں، پھر بغداد کے قاضی اور محتسب کی حیثیت سے خدمات انجام دیں۔ اسے قادیانیت سے برطرف کر کے حسبہ رکھا گیا، پھر اس سے بھی برطرف کر کے دیوان الضمام کا انچارج بنا دیا گیا، اور اس سے بھی برطرف کر دیا گیا۔ اپنی مدت ملازمت کے دوران انہیں معظم الدین کا خطاب دیا گیا۔ برطرفی کے بعد وہ کچھ دیر تک اپنے گھر میں رہے، پھر اسے اپنے شہر واپس جانے کی اجازت دی گئی اور واپس چلے گئے، اور اپنی زندگی کے آخر میں بغداد واپس آگئے، جہاں اس کا انتقال ہوگیا۔ آپ کا انتقال منگل 17 رجب 616ء کی رات ہوا اور باب حرب کے قبرستان میں دفن ہوئے۔ 70-71}۔"
