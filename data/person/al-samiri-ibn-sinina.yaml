id: person/al-samiri-ibn-sinina
class: person
label: { ar: "ابن سنينة السامري" }
summary:
  ar: "أبو عبد الله نصير الدين محمد بن عبد الله بن الحسين السامري الفقيه الفرضي الحنبلي المعروف بابن سنينة؛ قال ابن النجار ولد سنة خمس وثلاثين وخمسمائة بسامرا وسمع من ابن البطي وأبي حكيم النهرواني وغيرهما ببغداد وتفقه على أبي حكيم ولازمه وبرع في الفقه والفرائض وصنف فيهما تصانيف مشهورة منها «كتاب المستوعب في الفقه» و«كتاب الفروق» و«كتاب البيان في الفرائض»؛ وولي القضاء بسامرا وأعمالها مدة ثم ولي القضاء والحسبة ببغداد ثم عُزل عن القضاء وبقي على الحسبة ثم عُزل عنها وولي إشراف ديوان الزمام وعُزل أيضاً ولُقب في أيام ولاياته معظم الدين، ولما عُزل لزم بيته مدة ثم أُذن له بالعود إلى بلده فعاد إليها ثم رجع إلى بغداد في آخر عمره وبها توفي؛ توفي ليلة الثلاثاء سابع عشر رجب سنة ست عشرة وستمائة ودفن بمقبرة باب حرب {cite:shadharat-dhahab p. 70-71}."
