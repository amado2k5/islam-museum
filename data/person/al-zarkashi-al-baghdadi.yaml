  ar: "شمس الدين الزركشي البغدادي نزيل القاهرة؛ مهر في القراءات وشارك في الفنون وتعانى النظم وله قصيدة حسنة في العروض وشرحها ونظم العواطل الحوالي ست عشرة قصيدة على سبعة عشر بحراً ليس فيها نقطة، وسمع منه ابن حجر وسمع هو أيضاً من ابن حجر ورافقه في السماع وجرت له في آخر عمره محنة، توفي في ذي الحجة سنة اثنتي عشرة وثمانمائة {cite:shadharat-dhahab p. 112}."
