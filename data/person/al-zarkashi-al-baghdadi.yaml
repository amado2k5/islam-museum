summary:
  ar: "شمس الدين الزركشي البغدادي نزيل القاهرة؛ مهر في القراءات وشارك في الفنون وتعانى النظم وله قصيدة حسنة في العروض وشرحها ونظم العواطل الحوالي ست عشرة قصيدة على سبعة عشر بحراً ليس فيها نقطة، وسمع منه ابن حجر وسمع هو أيضاً من ابن حجر ورافقه في السماع وجرت له في آخر عمره محنة، توفي في ذي الحجة سنة اثنتي عشرة وثمانمائة {cite:shadharat-dhahab p. 112}."
  en: "Shams al-Din al-Zarkashi al-Baghdadi of Cairo — recitations-master who composed al-'Awatil al-Hawali: sixteen qasidas across seventeen metres containing not a single dotted letter; heard hadith with Ibn Hajar; died Dhu al-Hijja 812 {cite:shadharat-dhahab p. 112}."
  fr: "Shams al-Din al-Zarkashi al-Baghdadi du Caire – récitations-maître qui a composé al-'Awatil al-Hawali : seize qasidas sur dix-sept mètres ne contenant pas une seule lettre pointillée ; entendu hadith avec Ibn Hajar ; mort Dhu al-Hijja 812 {cite:shadharat-dhahab p. 112}."
  es: "Shams al-Din al-Zarkashi al-Baghdadi de El Cairo, maestro de recitaciones que compuso al-'Awatil al-Hawali: dieciséis qasidas a lo largo de diecisiete metros que no contenían ni una sola letra de punto; escuchó hadices con Ibn Hajar; murió Dhu al-Hijja 812 {cita: shadharat-dhahab p. 112}."
  ur: "قاہرہ کا شمس الدین الزرقاشی البغدادی - قراء ات کا ماہر جس نے الاواطل الحوالی کی تالیف کی: سترہ میٹر پر سولہ قصیدے جن میں ایک حرف بھی نہیں تھا۔ ابن حجر سے حدیث سنی۔ وفات ذی الحجہ 812۔ 112}۔"
  tr: "Kahire'de yaşayan Şemseddin el-Zerkaşi el-Bağdadi; Kur'an okumalarında yetenekliydi, çeşitli sanatlara katıldı ve şiirle mücadele etti. Prosodi ve açıklaması üzerine güzel bir şiir yazdı. Noktasız on yedi metrede on altı şiir yazdı. İbn Hacer ondan ve İbn Hacer'den dinledi, dinlemesine eşlik etti. İlerleyen yıllarında zorluklarla karşılaştı. Sekiz yüz on iki yılda Zhu'l-Hicce'de vefat etti {atıf:şadharat-dhahab, s. 112}."
  id: "Shams al-Din al-Zarkashi al-Baghdadi, seorang penduduk Kairo; ahli membaca Al-Qur'an, berpartisipasi dalam berbagai seni, dan berjuang dalam puisi. Ia menulis puisi indah tentang prosodi dan penjelasannya. Ia menulis enam belas puisi dalam jarak tujuh belas meter tanpa titik. Ibn Hajar mendengar kabarnya dan juga dari Ibn Hajar, menemaninya dalam mendengarkan. Ia menghadapi kesulitan di tahun-tahun tuanya. Ia meninggal di Dhu al-Hijjah pada tahun delapan ratus dua belas {cite:shadharat-dhahab, hlm. 112}."
