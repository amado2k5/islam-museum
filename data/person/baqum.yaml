summary:
  ar: نجار مولى لبني أمية يُنسب إليه في بعض الروايات صنع منبر النبي من طرفاء الغابة ذي الدرجات الثلاث، وأسانيدها ضعيفة عند ابن حجر؛ ويُسمّى باقوم أيضاً الرومي الذي ذُكر أنه أعان قريشاً في بناء الكعبة.
  en: A carpenter, client of the Banu Umayya, to whom some reports attribute the Prophet's three-step tamarisk minbar (the chains are weak in Ibn Hajar's assessment). The name Baqum is also given to the Roman said to have helped Quraysh rebuild
    the Kaaba.
