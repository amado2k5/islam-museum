education:
  did_you_know:
    ar: "عاتكة بنت عبد المطلب عمة النبي وزوج أبي أمية والد أم سلمة؛ اشتهرت برؤياها قبل بدر بثلاث ليال، واختُلف في إسلامها."
    en: "Atika bint Abd al-Muttalib, the Prophet's aunt and wife of Abu Umayya, Umm Salama's father; she is remembered for a dream three nights before Badr — her own Islam is debated."
    ur: "عاتکہ بنت عبدالمطلب، نبی کی پھوپھی اور ام سلمہ کے والد ابو امیہ کی بیوی؛ بدر سے تین رات پہلے کے اپنے خواب کے لیے مشہور ہیں — ان کے اسلام میں اختلاف ہے۔"
    sources: [source/ibn-hajar-isaba, source/ibn-hisham-saqqa]
