summary:
  ar: عمة النبي وزوج أبي أمية بن المغيرة والد أم سلمة، ولدت له عبد الله وقريبة؛ اشتهرت برؤياها قبل بدر بثلاث ليال، واختُلف في إسلامها.
  en: An aunt of the Prophet and wife of Abu Umayya ibn al-Mughira, the father of Umm Salama, to whom she bore Abdullah and Quraiba; known for the dream she had three nights before Badr. Whether she embraced Islam is disputed.
