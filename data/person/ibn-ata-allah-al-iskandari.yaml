label:
  ar: ابن عطاء الله الإسكندري
  en: Ibn Ata Allah al-Iskandari
  ur: ابن عطاء اللہ اسکندری
  es: "Ibn Ata Allah al-Iskandari"
  fr: "Ibn Ata Allah al-Iskandari"
summary:
  ar: "تاج الدين أحمد بن محمد بن عطاء الله الإسكندري ⁦(ت 709هـ)⁩، الشيخ الزاهد الواعظ تلميذ أبي العباس المرسي وصاحب الشاذلية؛ يصفه الذهبي في سير الأعلام بأنه «من كبار القائمين على الشيخ تقي الدين ابن تيمية»، وأن جنازته كانت مشهودة {cite:siyar-alam-nubala-ideas-house}."
  en: "Taj al-Din Ahmad ibn Muhammad ibn Ata Allah al-Iskandari (d. 709 AH), the ascetic preacher, pupil of Abu'l-Abbas al-Mursi of the Shadhili order; al-Dhahabi describes him in the Siyar as 'one of the great opponents of Shaykh Taqi al-Din Ibn Taymiyya', whose funeral was widely attended {cite:siyar-alam-nubala-ideas-house}."
  es: "Taj al-Din Ahmad ibn Muhammad ibn Ata Allah al-Iskandari (m. 709 d. H.), el predicador asceta, alumno de Abu'l-Abbas al-Mursi de la orden Shadhili; al-Dhahabi lo describe en el Siyar como \"uno de los grandes oponentes de Shaykh Taqi al-Din Ibn Taymiyya\", cuyo funeral contó con una gran asistencia {cita:siyar-alam-nubala-ideas-house}."
  fr: "Taj al-Din Ahmad ibn Muhammad ibn Ata Allah al-Iskandari (mort en 709 AH), le prédicateur ascétique, élève d'Abu'l-Abbas al-Mursi de l'ordre Shadhili; al-Dhahabi le décrit dans le Siyar comme « l'un des grands opposants à Shaykh Taqi al-Din Ibn Taymiyya », dont les funérailles ont été largement suivies {cite: siyar-alam-nubala-ideas-house}."
  ur: "تاج الدین احمد بن محمد بن عطاء اللہ اسکندری ⁦(متوفی 709ھ)⁩، متوفی مبلغ، شدھیلی ترتیب کے ابو العباس المرسی کے شاگرد؛ الذہبی نے سیار میں اسے شیخ تقی الدین ابن تیمیہ کے بڑے مخالفین میں سے ایک کے طور پر بیان کیا ہے، جن کے جنازے میں بڑے پیمانے پر شرکت کی گئی تھی۔"
  tr: "Taceddin Ahmed bin Muhammed bin Ata Allah el-İskendari (ö. 709 H.), münzevi şeyh, vaiz, Ebu el-Abbas el-Mursi'nin öğrencisi ve el-Şaziliyya'nın yazarı; el-Dhahabi onu Siyar al-A'lam'da \"Şeyh Taqi al-Din İbn Teymiyye'nin büyük liderlerinden biri\" olarak tanımlar ve cenazesinin tanık olduğunu belirtir {atıf:siyar-alam-nubala-ideas-house}."
  id: "Taj al-Din Ahmad ibn Muhammad ibn Ata Allah al-Iskandari (wafat 709 H), seorang pertapa, pengkhotbah, murid Abu al-Abbas al-Mursi, dan penulis al-Shadhiliyya; al-Dhahabi menggambarkannya dalam Siyar al-A'lam sebagai \"salah satu pemimpin besar Sheikh Taqi al-Din Ibn Taymiyyah,\" dan bahwa pemakamannya disaksikan {cite:siyar-alam-nubala-ideas-house}."
