summary:
  ar: "تاج الدين أحمد بن محمد بن عطاء الله الإسكندري (ت 709هـ)، الشيخ الزاهد الواعظ تلميذ أبي العباس المرسي وصاحب الشاذلية؛ يصفه الذهبي في سير الأعلام بأنه «من كبار القائمين على الشيخ تقي الدين ابن تيمية»، وأن جنازته كانت مشهودة {cite:siyar-alam-nubala-ideas-house}."
  en: "Taj al-Din Ahmad ibn Muhammad ibn Ata Allah al-Iskandari (d. 709 AH), the ascetic preacher, pupil of Abu'l-Abbas al-Mursi of the Shadhili order; al-Dhahabi describes him in the Siyar as 'one of the great opponents of Shaykh Taqi al-Din Ibn Taymiyya', whose funeral was widely attended {cite:siyar-alam-nubala-ideas-house}."
