summary:
  ar: "قلندر جلبي، قائد تمرد في منطقتي قونية ومرعش في عهد [[person/sulayman-al-qanuni|سليمان القانوني]]؛ يصفه الصلابي بأنه كان على رأس ثلاثين ألفاً، وينقل عن بعض المؤرخين أنه جعل شعاره أن من قتل مسلماً سنياً واعتدى على امرأة سنية حاز أكبر الثواب — وهو قول منقول عن المؤرخين لا يقرره النص بنفسه {cite:dawlat-uthmaniyya-salabi p. 200-201}. توجه بهرام باشا لقمع عصيانه فقتله العصاة، ثم استمال الصدر الأعظم [[person/ibrahim-pasha-franji|إبراهيم باشا]] بعض رجاله فقلّت قواته وهُزم وقُتل {cite:dawlat-uthmaniyya-salabi p. 201}."
  en: "Qalender Çelebi, leader of the rising in Konya and Maraş under [[person/sulayman-al-qanuni|Süleyman]]; al-Salabi puts thirty thousand followers at his back and quotes 'some historians' that he made killing a Sunni Muslim and assaulting a Sunni woman a claim to the greatest reward — a saying the book attributes to the historians rather than asserts itself {cite:dawlat-uthmaniyya-salabi p. 200-201}. His rebels killed Bahram Pasha sent against them, until Grand Vizier [[person/ibrahim-pasha-franji|Ibrahim Pasha]] won over some of his men, his forces dwindled, and he was defeated and killed {cite:dawlat-uthmaniyya-salabi p. 201}."
