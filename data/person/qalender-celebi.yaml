  ur: "قلندر چیلیبی"
gender: male
roles: [rebel]
summary:
  ar: "قلندر جلبي، قائد تمرد في منطقتي قونية ومرعش في عهد [[person/sulayman-al-qanuni|سليمان القانوني]]؛ يصفه الصلابي بأنه كان على رأس ثلاثين ألفاً، وينقل عن بعض المؤرخين أنه جعل شعاره أن من قتل مسلماً سنياً واعتدى على امرأة سنية حاز أكبر الثواب — وهو قول منقول عن المؤرخين لا يقرره النص بنفسه {cite:dawlat-uthmaniyya-salabi p. 200-201}. توجه بهرام باشا لقمع عصيانه فقتله العصاة، ثم استمال الصدر الأعظم [[person/ibrahim-pasha-franji|إبراهيم باشا]] بعض رجاله فقلّت قواته وهُزم وقُتل {cite:dawlat-uthmaniyya-salabi p. 201}."
  en: "Qalender Çelebi, leader of the rising in Konya and Maraş under [[person/sulayman-al-qanuni|Süleyman]]; al-Salabi puts thirty thousand followers at his back and quotes 'some historians' that he made killing a Sunni Muslim and assaulting a Sunni woman a claim to the greatest reward — a saying the book attributes to the historians rather than asserts itself {cite:dawlat-uthmaniyya-salabi p. 200-201}. His rebels killed Bahram Pasha sent against them, until Grand Vizier [[person/ibrahim-pasha-franji|Ibrahim Pasha]] won over some of his men, his forces dwindled, and he was defeated and killed {cite:dawlat-uthmaniyya-salabi p. 201}."
  es: "Qalender Çelebi, líder del levantamiento en Konya y Maraş bajo [[person/sulayman-al-qanuni|Süleyman]]; al-Salabi pone treinta mil seguidores a su espalda y cita a 'algunos historiadores' que hizo del asesinato de un musulmán sunita y la agresión a una mujer sunita un derecho a la mayor recompensa, una afirmación que el libro atribuye a los historiadores en lugar de afirmarla él mismo {cite:dawlat-uthmaniyya-salabi p. 200-201}. Sus rebeldes mataron a Bahram Pasha enviado contra ellos, hasta que el Gran Visir [[person/ibrahim-pasha-franji|Ibrahim Pasha]] ganó a algunos de sus hombres, sus fuerzas disminuyeron y fue derrotado y asesinado {cite:dawlat-uthmaniyya-salabi p. 201}."
  fr: "Qalender Çelebi, chef du soulèvement de Konya et Maraş sous Süleyman al-Qanuni, est soutenu par trente mille hommes. Al-Salabi cite « certains historiens » selon lesquels il aurait fait du meurtre d'un musulman sunnite et de l'agression d'une femme sunnite un motif de récompense suprême – une affirmation que l'ouvrage attribue aux historiens plutôt que de la présenter lui-même (voir: Dawlat Uthmaniyya Salabi, p. 200-201). Ses rebelles tuèrent Bahram Pacha, envoyé contre eux, jusqu'à ce que le grand vizir Ibrahim Pacha rallie une partie de ses hommes à sa cause. Ses forces s'amenuisèrent, et il fut vaincu et tué (voir: Dawlat Uthmaniyya Salabi, p. 201)."
  ur: "قلندر چیلیبی، قونیہ اور ماراش میں [[شخص/سلیمان-القانونی|سلیمان]] کے تحت ابھرنے والے رہنما؛ الصلبی نے تیس ہزار پیروکاروں کو اپنی پشت پر کھڑا کیا اور 'کچھ مورخین' کا حوالہ دیا کہ اس نے ایک سنی مسلمان کو قتل کرنے اور ایک سنی عورت پر حملہ کرنے کو سب سے بڑے ثواب کا دعویٰ قرار دیا - یہ کتاب خود دعویٰ کرنے کے بجائے مورخین کی طرف منسوب ہے {حوالہ: دولت عثمانیہ صلابی 200-201}۔ اس کے باغیوں نے ان کے خلاف بھیجے گئے بہرام پاشا کو قتل کر دیا، یہاں تک کہ وزیر اعظم [[شخص/ابراہیم پاشا-فرانجی|ابراہیم پاشا]] نے اپنے کچھ آدمیوں پر فتح حاصل کر لی، اس کی فوجیں کم ہو گئیں، اور وہ شکست کھا کر ہلاک ہو گیا۔ 201}۔"
  tr: "[[person/sulayman-al-qanuni|Süleyman Yüce]] döneminde Konya ve Maraş bölgelerinde isyan lideri olan Qalandar Çelebi; el-Sallabi onu otuz bin askerin lideri olarak tanımlar ve bazı tarihçiler, bir Sünni Müslümanı öldüren ve bir Sünni kadına saldıran kişinin en büyük ödülü alacağı sloganını belirtir — bu ifade metnin kendisinde doğrulanmayan tarihçiler tarafından aktarılmıştır {cite:dawlat-uthmaniyya-salabi s. 200-201}. Bahram Paşa isyanını bastırmaya gitti ve isyancılar tarafından öldürüldü, ardından Sadrazam [[kişi/İbrahim-paşa-franji|İbrahim Paşa]] bazı adamlarını kazandı, bu yüzden kuvvetleri zayıfladı, yenildi ve öldürüldü {cite:dawlat-uthmaniyya-salabi s. 201}."
  id: "Qalandar Çelebi, pemimpin pemberontakan di wilayah Konya dan Maraş pada masa pemerintahan [[orang/sulayman-al-qanuni|Suleiman yang Agung]]; al-Sallabi menggambarkannya memimpin tiga puluh ribu, dan beberapa sejarawan melaporkan bahwa ia membuat motto bahwa siapa pun yang membunuh Muslim Sunni dan menyerang wanita Sunni menerima hadiah terbesar — pernyataan yang disampaikan oleh sejarawan yang tidak dikonfirmasi oleh teks itu sendiri {cite:dawlat-uthmaniyya-salabi hlm. 200-201}. Bahram Pasha pergi untuk menumpas pemberontakannya dan dibunuh oleh para pemberontak, kemudian Grand Vizier [[person/ibrahim-pasha-franji|Ibrahim Pasha]] memenangkan beberapa pasukannya, sehingga pasukannya melemah, ia dikalahkan dan dibunuh {cite:dawlat-uthmaniyya-salabi hlm. 201}."
