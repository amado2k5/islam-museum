summary:
  ar: "مخرجة أفلام وثائقية أمريكية من أصل مصري، وُلدت في واشنطن العاصمة سنة 1974 ونشأت في الكويت والقاهرة؛ أخرجت «ستارت أب دوت كوم» (2001) و«غرفة التحكم» (2004) عن الجزيرة وقيادة الحرب على العراق، و«الميدان» (2013) عن ثورة مصر الذي رُشّح للأوسكار، وشاركت في إخراج «الاختراق الكبير» (2019) و«العهد» (2020)."
  en: "American documentary film director of Egyptian origin, born in Washington, D.C. in 1974 and raised in Kuwait and Cairo. She directed Startup.com (2001), Control Room (2004) on Al Jazeera and the command of the Iraq war, and The Square (2013) on Egypt's revolution, which was nominated for an Academy Award, and co-directed The Great Hack (2019) and The Vow (2020)."
