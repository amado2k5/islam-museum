summary:
  ar: "ملاكمة جزائرية وُلدت سنة 1999 بولاية تيارت. فازت بذهبية وزن الوسط في أولمبياد باريس 2024، فكانت أوّل جزائرية وعربية وإفريقية تفوز بذهبية أولمبية في الملاكمة، بعد جدل واسع حول أهليتها أكدت فيه اللجنة الأولمبية الدولية حقّها في المنافسة."
  en: "Algerian boxer, born in 1999 in Tiaret province. Gold medallist in the welterweight division at the Paris 2024 Olympics — the first Algerian, Arab and African woman to win Olympic boxing gold — after a wide eligibility controversy in which the International Olympic Committee affirmed her right to compete."
  ur: "الجزائری مکے باز، 1999ء میں صوبہ تیارت میں پیدا ہوئیں۔ پیرس اولمپکس 2024ء میں ویلٹر ویٹ میں طلائی تمغہ جیتا — اولمپک مکے بازی میں طلائی تمغہ جیتنے والی پہلی الجزائری، عرب اور افریقی خاتون — اس سے قبل اہلیت پر وسیع تنازع رہا جس میں بین الاقوامی اولمپک کمیٹی نے ان کے کھیلنے کے حق کی تصدیق کی۔"
  es: "Boxeadora argelina, nacida en 1999 en la provincia de Tiaret. Medallista de oro en la categoría de peso wélter en los Juegos Olímpicos de París 2024 —la primera mujer argelina, árabe y africana en ganar una medalla de oro olímpica en boxeo— tras una amplia controversia sobre su elegibilidad en la que el Comité Olímpico Internacional confirmó su derecho a competir."
