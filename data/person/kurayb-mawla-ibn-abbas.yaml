summary:
  ar: "كريب بن أبي مسلم، مولى عبد الله بن عباس، تابعي مدني سمع أسامة بن زيد وابن عباس، وروى عنه بنو عقبة الثلاثة وبكير بن الأشج، ووصفه ابن عبد البر بأنه ثقة حجة؛ ونقل عن موسى بن عقبة أنه مات بالمدينة سنة ثمان وتسعين في آخر خلافة سليمان بن عبد الملك {cite:tamhid-furqan-2017-v1 p. 260}."
  en: "Kurayb b. Abi Muslim, client of 'Abd Allah b. 'Abbas, a Medinan Successor who heard Usama b. Zayd and Ibn 'Abbas; the three sons of 'Uqba and Bukayr b. al-Ashajj transmitted from him, and Ibn 'Abd al-Barr calls him trustworthy and an authority; he reports from Musa b. 'Uqba that Kurayb died in Medina in 98 AH, at the end of the caliphate of Sulayman b. 'Abd al-Malik {cite:tamhid-furqan-2017-v1 p. 260}."
  ur: "کریب بن ابی مسلم، عبد اللہ بن عباس کے مولیٰ، مدنی تابعی جنہوں نے اسامہ بن زید اور ابن عباس سے سنا؛ ان سے عقبہ کے تینوں بیٹوں اور بکیر بن اشج نے روایت کی، اور ابن عبد البر انہیں ثقہ اور حجت کہتے ہیں؛ وہ موسیٰ بن عقبہ سے نقل کرتے ہیں کہ کریب 98ھ میں، سلیمان بن عبد الملک کی خلافت کے آخر میں، مدینہ میں فوت ہوئے {cite:tamhid-furqan-2017-v1 p. 260}۔"
  es: "Kurayb b. Abi Muslim, cliente de 'Abd Allah b. 'Abbas, un sucesor de Medina que escuchó a Usama b. Zayd e Ibn 'Abbas; los tres hijos de 'Uqba y Bukayr b. al-Ashajj transmitieron de él, e Ibn 'Abd al-Barr lo llama digno de confianza y una autoridad; informa de Musa b. 'Uqba que Kurayb murió en Medina en el año 98 AH, al final del califato de Sulayman b. 'Abd al-Malik {cite:tamhid-furqan-2017-v1 p. 260}."
  fr: "Kurayb b. Abi Muslim, client de 'Abd Allah b. 'Abbas, un successeur médinois qui a entendu Usama b. Zayd et Ibn 'Abbas; les trois fils de 'Uqba et Bukayr b. al-Ashajj ont transmis de lui, et Ibn 'Abd al-Barr le qualifie de digne de confiance et d'autorité; il rapporte de Musa b. 'Uqba que Kurayb est mort à Médine en 98 AH, à la fin du califat de Sulayman b. 'Abd al-Malik {cite:tamhid-furqan-2017-v1 p. 260}."
  tr: "Medine'den bir Tabi'i olan Abdullah ibn Abbas'ın özgür adamı Kurayb ibn Abi Muslim, Usama ibn Zayd ve İbn Abbas'tan haber aldı ve üç Banu Uqbah ile Bakir ibn al-Ashaj ondan rivayet etti. İbn Abd al-Barr onu güvenilir ve yetkili biri olarak tanımladı; Musa ibn Uqbah'tan bildirildiğine göre, doksan sekizinci yılda, Süleyman bin Abdülmelik'in halifeliğinin sonunda Medine'de öldü {cite:tamhid-furqan-2017-v1, s. 260}."
  id: "Kurayb ibn Abi Muslim, mantan Abdullah ibn Abbas, seorang Tabi'i dari Madinah, mendengar dari Usama ibn Zayd dan Ibn Abbas, serta tiga Banu Uqbah dan Bakir ibn al-Ashaj menceritakan darinya. Ibn Abd al-Barr menggambarkannya sebagai dapat dipercaya dan berwibawa; dilaporkan dari Musa ibn Uqbah bahwa ia meninggal di Madinah pada tahun sembilan puluh delapan pada akhir masa khalifah Sulayman ibn Abd al-Malik {cite:tamhid-furqan-2017-v1, hlm. 260}."
