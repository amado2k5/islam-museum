class: person
label: { ar: "كورش الملك", en: "King Cyrus", es: "King Cyrus", fr: "King Cyrus", ur: "کنگ سائرس" }
summary:
  ar: "كورش الملك حين ولد المسيح عيسى بعث ثلاثة أنفس دفع إلى أحدهم صرة من لبان وإلى آخر صرة من مر وإلى آخر صرة من تبر وسيرهم يهتدون بنجم وصفه لهم فساروا حتى انتهوا إلى المسيح وأمه مريم بأرض الشام، وكان إذا ساروا سار معهم النجم وإذا وقفوا وقف بوقوفهم، والنصارى تغلو في قصة هؤلاء النفر وهذا الخبر موجود في الإنجيل وقد شرحه المسعودي في كتابه أخبار الزمان {cite:muruj-al-dhahab p. 551}."
  en: "King Cyrus who at Christ's birth dispatched the three gift-bearers — frankincense, myrrh and gold — guided by a star that moved and halted with them until they reached Mary and her son in Syria; the report is in the Gospel, fully treated in al-Mas'udi's Akhbar al-Zaman {cite:muruj-al-dhahab p. 551}."
  es: "El rey Ciro, quien en el nacimiento de Cristo envió a los tres portadores de regalos —incienso, mirra y oro— guiados por una estrella que se movía y se detenía con ellos hasta que llegaron a María y a su hijo en Siria; el relato se encuentra en el Evangelio, tratado en detalle en el Akhbar al-Zaman de al-Mas'udi {cite:muruj-al-dhahab p. 551}."
  fr: "Le roi Cyrus, qui à la naissance du Christ envoya les trois porteurs de cadeaux — l'encens, la myrrhe et l'or — guidés par une étoile qui se déplaçait et s'arrêtait avec eux jusqu'à ce qu'ils atteignent Marie et son fils en Syrie; ce récit se trouve dans l'Évangile, traité en détail dans l'Akhbar al-Zaman d'al-Mas'udi {cite:muruj-al-dhahab p. 551}."
  ur: "بادشاہ سائرس جس نے مسیح کی پیدائش کے وقت تین تحفے دینے والوں کو روانہ کیا - لوبان، مرر اور سونا - ایک ستارے کی رہنمائی میں جو ان کے ساتھ چلتا اور رکا یہاں تک کہ وہ شام میں مریم اور اس کے بیٹے تک پہنچ گئے۔ یہ رپورٹ انجیل میں ہے، جس کا مکمل علاج المسعودی کے اخبار الزمان میں کیا گیا ہے۔ 551}۔"
  tr: "Kral Kiros, İsa doğduğunda üç ruh gönderdi: birine bir demet tütsü, diğerine bir demet mir ve diğerine bir demet pirinç verildi. Yürüyüşleri, onlar için tarif ettiği bir yıldız tarafından yönlendirildi, böylece Levant diyarında İsa ve annesi Meryem'e ulaşana kadar yürüdüler. Yürüdüklerinde yıldız onlarla yürür, durduklarında ise yanlarında dururdu. Hristiyanlar bu insanların hikayesini abartır ve bu hikaye, al-Mas'udi'nin 'Zamanın Kronikleri' kitabında açıklandığı gibi İncil'de bulunur {cite:muruj-al-dhahab, s. 551}."
  id: "Raja Cyrus, ketika Yesus lahir, mengirim tiga jiwa: satu diberi seikat dupa, satu lagi seikat mur, dan yang lain seikat kuningan. Perjalanan mereka dipandu oleh bintang yang dijelaskan Raja untuk mereka, sehingga mereka berjalan sampai mencapai Kristus dan ibunya Maria di tanah Levant. Ketika mereka berjalan, bintang itu berjalan bersama mereka, dan ketika mereka berhenti, bintang itu berdiri di samping mereka. Orang Kristen melebih-lebihkan kisah orang-orang ini, dan kisah ini ditemukan dalam Injil, seperti yang dijelaskan oleh al-Mas'udi dalam bukunya 'Chronicles of the Times' {cite:muruj-al-dhahab, hlm. 551}."
