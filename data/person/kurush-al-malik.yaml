  ar: "كورش الملك حين ولد المسيح عيسى بعث ثلاثة أنفس دفع إلى أحدهم صرة من لبان وإلى آخر صرة من مر وإلى آخر صرة من تبر وسيرهم يهتدون بنجم وصفه لهم فساروا حتى انتهوا إلى المسيح وأمه مريم بأرض الشام، وكان إذا ساروا سار معهم النجم وإذا وقفوا وقف بوقوفهم، والنصارى تغلو في قصة هؤلاء النفر وهذا الخبر موجود في الإنجيل وقد شرحه المسعودي في كتابه أخبار الزمان {cite:muruj-al-dhahab p. 551}."
