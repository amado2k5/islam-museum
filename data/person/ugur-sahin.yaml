summary:
  ar: "طبيب مناعة وأستاذ أورام تركي ألماني، وُلد في إسكندرون سنة 1965 وهاجر طفلا إلى ألمانيا، شارك زوجته أوزليم توريتشي وآخرين في تأسيس شركات غانيميد (2001) وبيوأنتك (2008) وترون (2010)، وقاد تطوير أول لقاح بتقنية الحمض النووي الريبي المرسال ضد كوفيد-19، ونال جائزة مصطفى سنة 2019."
  en: "Turkish-German immunologist and professor of oncology, born in İskenderun in 1965 and brought to Germany as a child, who co-founded Ganymed Pharmaceuticals (2001), BioNTech (2008) and TRON (2010) with his wife Özlem Türeci and others, led the development of the first mRNA vaccine against COVID-19, and received the Mustafa Prize in 2019."
  ur: "ترک نژاد جرمن ماہرِ امیونولوجی اور آنکولوجی کے پروفیسر، جو 1965 میں اسکندرون میں پیدا ہوئے اور بچپن میں جرمنی منتقل ہوئے، جنہوں نے اپنی اہلیہ اوزلم تورےچی اور دیگر کے ساتھ گینی میڈ (2001)، بائیو این ٹیک (2008) اور ٹرون (2010) قائم کیں، کووڈ-19 کے خلاف پہلی ایم آر این اے ویکسین کی تیاری کی قیادت کی، اور 2019 میں مصطفی پرائز پایا۔"
