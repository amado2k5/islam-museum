label: { ar: "أسفار بن شيرويه الجبلي", en: "Asfar ibn Shiruya" }
summary:
  ar: "الديلمي الذي استولى على طبرستان والري وجرجان وقزوين وزنجان وأبهر وقم وهمذان والكرخ بعد قتاله ماكان بن كاكي والداعي الأطروش، وكان لا يدين بملة الإسلام فتجبر وطغى وخالف على صاحب خراسان وأراد نصب سرير من ذهب للملك بالري، وخرب قزوين وسبى وقلع أبوابها وأمر بنكس المؤذن عن صومعة الجامع على أم رأسه وخرب المساجد ومنع الصلوات، وضرب على كل رأس ديناراً من مسلم وذمي وغريب حتى من في الفنادق والخانات وكتب لهم براءات كبراءات أهل الذمة، وأخبر المسعودي أنه رأى غرباء أدوا هذه الجزية بالري وأخذوا براءتها، فلما ساءت سيرته توجهت عليه الحيلة من وزيره مرداويج بن زيار وسلار صاحب الطرم فهرب إلى قلعة الموت ليأخذ ذخائره فذبحه مرداويج من ساعته {cite:muruj-al-dhahab p. 721-724}."
  en: "The non-Muslim Daylamite who took Rayy and Qazvin, wrecked mosques, taxed every head a dinar, and was slaughtered by Mardawij {cite:muruj-al-dhahab p. 721-724}."
