summary:
  ar: "الديلمي الذي استولى على طبرستان والري وجرجان وقزوين وزنجان وأبهر وقم وهمذان والكرخ بعد قتاله ماكان بن كاكي والداعي الأطروش، وكان لا يدين بملة الإسلام فتجبر وطغى وخالف على صاحب خراسان وأراد نصب سرير من ذهب للملك بالري، وخرب قزوين وسبى وقلع أبوابها وأمر بنكس المؤذن عن صومعة الجامع على أم رأسه وخرب المساجد ومنع الصلوات، وضرب على كل رأس ديناراً من مسلم وذمي وغريب حتى من في الفنادق والخانات وكتب لهم براءات كبراءات أهل الذمة، وأخبر المسعودي أنه رأى غرباء أدوا هذه الجزية بالري وأخذوا براءتها، فلما ساءت سيرته توجهت عليه الحيلة من وزيره مرداويج بن زيار وسلار صاحب الطرم فهرب إلى قلعة الموت ليأخذ ذخائره فذبحه مرداويج من ساعته {cite:muruj-al-dhahab p. 721-724}. وعند ابن الأثير كان ابتداء أمره أنه كان من أصحاب ماكان بن كاكي وكان سئم الخلق والعشرة فأخرجه ماكان من عسكره فاتصل ببكر بن محمد بن ألياس بنيسابور وخدمه فسيره إلى جرجان ليفتحها، واستدعى مرداويج بن زيار من جيلان فجعله أمير الجيش فاستوليا على طبرستان، وولّاه السعيد نصر بن أحمد جرجان سنة 315هـ بعد موت بكر {cite:kamil-ibn-al-athir p. 129-130}"
  en: "The non-Muslim Daylamite who took Rayy and Qazvin, wrecked mosques, taxed every head a dinar, and was slaughtered by Mardawij {cite:muruj-al-dhahab p. 721-724}."
  es: "El daylamita no musulmán que tomó Rayy y Qazvin, destrozó mezquitas, impuso un impuesto de un dinar a cada cabeza y fue masacrado por los mardawij {cite:muruj-al-dhahab p. 721-724}."
  fr: "Le Daylamite non musulman qui prit Rayy et Qazvin, détruisit des mosquées, imposa un dinar à chaque tête et fut massacré par Mardawij {cite:muruj-al-dhahab p. 721-724}."
  ur: "غیر مسلم دیلامائٹ جس نے رے اور قزوین پر قبضہ کیا، مساجد کو تباہ کیا، ہر سر پر ایک دینار ٹیکس لگایا اور مردویج کے ہاتھوں ذبح کیا گیا۔ 721-724}۔"
  tr: "Makan ibn Kaki ve çağıran El-Atrüş ile savaştıktan sonra Tabaristan, Rayy, Gorgan, Kazvin, Zencan, Abhar, Kum, Hamadhan ve El-Karh'ı ele geçiren El-Daylami, İslam'a bağlı değildi, bu yüzden kibirli, zorba davrandı, Horasan hükümdarına karşı çıktı ve kral için Rayy'de altın bir taht kurmak istedi. Kazvin'i yıktı, esir aldı, kapılarını yıktı, müezzinin caminin minaresinden çıkarılmasını emretti, camileri yıktı, namaz kıldı ve Müslüman, Zimmi ya da yabancı olsun, otel ve hanlıklardaki herkesin başına bir dinar koydu ve onları onurlu kişiler olarak beraat ettirdi Zimmiler El-Mes'udi, Rayı'da bu vergiyi ödeyen yabancılar gördüğünü ve onun masumiyetini kabul ettiğini bildirdi. Davranışları kötüleşince, bakanı Mardavic ibn Ziyar ve Taram'ın hükümdarı Salar ona başvurdu. Erzaklarını almak için ölüm kalesine kaçtı, ancak Mardawij onu kendi zamanında katletti {atıf:Muruj-al-dhahab, s. 721-724}. İbn al-Athir'e göre, ilişkisi Makan ibn Kaki'nin yoldaşlarından biri olması ve onun karakterinden ve dostluğundan yorulmasıyla başlamıştır. Makan ordusundan onu göndermiş, bu yüzden Bakr ibn Muhammed ibn İlyas ile Nişapur'da bağlantı kurmuş ve ona hizmet etmiş, böylece onu Gorgan'a fethetmek için göndermiştir. Mardawij ibn Ziyar'ı Jilan'dan çağırmış, onu ordu komutanı olarak atamış ve Tabaristan valisi olarak atamıştır. Al-Sa'id Nasr ibn Ahmad Jurjan, Bakr'ın ölümünden sonra 315 H.'de onu atamıştır {atıf:kamil-ibn-al-athir s. 129-130}"
  id: "Al-Daylami, yang merebut Tabaristan, Rayy, Gorgan, Qazvin, Zanjan, Abhar, Qom, Hamadhan, dan Al-Karkh setelah berperang melawan Makan ibn Kaki dan pemanggil Al-Atrush, tidak setia kepada Islam, sehingga ia menjadi arogan, tiran, menentang penguasa Khorasan, dan ingin mendirikan takhta emas untuk raja di Rayy. Ia menghancurkan Qazvin, mengambil tawanan, merobek gerbangnya, memerintahkan agar muezzin dikeluarkan dari menara masjid, menghancurkan masjid, mencegah shalat, dan menempelkan dinar di setiap kepala, baik Muslim, Dhimmi, maupun asing, bahkan mereka yang tinggal di hotel dan khanate, dan membebaskan mereka sebagai orang terhormat Para dhimmi. Al-Mas'udi melaporkan bahwa ia melihat orang asing yang membayar upeti ini di Rayy dan mengambil kepolosan Rayy. Ketika perilakunya memburuk, menterinya Mardawij ibn Ziyar dan Salar penguasa Taram mendekatinya. Ia melarikan diri ke benteng maut untuk mengambil persediaan, tetapi Mardawij membantunya pada waktunya sendiri {cite:Muruj-al-dhahab, hlm. 721-724}. Menurut Ibn al-Athir, urusannya dimulai karena ia adalah salah satu sahabat Makan ibn Kaki dan lelah dengan karakter serta kebersamaannya. Makan dari pasukannya mengirimnya, sehingga ia berhubungan dengan Bakr ibn Muhammad ibn Ilyas di Nishapur dan melayaninya, sehingga ia mengirimnya ke Gorgan untuk menaklukkannya. Ia memanggil Mardawij ibn Ziyar dari Jilan, mengangkatnya sebagai komandan pasukan, dan mengangkatnya sebagai gubernur Tabaristan. Al-Sa'id Nasr ibn Ahmad Jurjan mengangkatnya pada tahun 315 H setelah kematian Bakr {cite:kamil-ibn-al-athir hlm. 129-130}"
