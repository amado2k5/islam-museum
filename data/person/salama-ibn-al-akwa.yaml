summary:
  en: "A famed Companion celebrated as the swiftest runner and premier foot-archer among the Muslims; hero of the Expedition of Dhu Qarad where he pursued the raiders on foot and recovered the captured camels; fought valiantly at Khaybar, Hunayn, and the Ridwan Pledge."
  ar: "صحابي جليل من شجعان العرب وفرسان المشاة المشهورين بسرعة العدو؛ بايع تحت الشجرة ثلاثاً، وبطل معركة ذي قرد حين طارد مغيري غطفان بمفرده عدواً على قدميه حتى استنقذ لقاح النبي، وقال فيه النبي: «خير رجالتنا سلمة بن الأكوع»."
  ur: "مشہور صحابی جو مسلمانوں میں سب سے تیز رفتار اور بہترین پیادہ تیرانداز شمار ہوتا تھا؛ ذو قرد کی مہم کا ہیرو۔"
  es: "Un célebre Compañero, reconocido como el corredor más veloz y el mejor arquero a pie entre los musulmanes; héroe de la Expedición de Dhu Qarad, donde persiguió a los asaltantes a pie y recuperó los camellos capturados; luchó valientemente en Khaybar, Hunayn y el Juramento de Ridwan."
  fr: "Un Compagnon célèbre, reconnu comme le coureur le plus rapide et le meilleur archer à pied parmi les musulmans; héros de l'expédition de Dhu Qarad où il poursuivit les pillards à pied et récupéra les chameaux capturés; combattit vaillamment à Khaybar, Hunayn et lors du Serment de Ridwan."
  tr: "Cesur Araplar ve ünlü piyade süvarileri arasında hızlı yenilgileri nedeniyle asil bir yoldaştı; ağacın altında üç kez bağlılık yemini etti ve Dh Qard Savaşı'nın kahramanı oldu; tek başına Ghatafan düşmanını yaya olarak kovalayarak Peygamber'in aşısını kurtardı. Peygamber onun hakkında şöyle dedi: \"En iyi adamlarımız Salamah ibn al-Akwa'dır.\""
  id: "Seorang sahabat mulia di antara para Arab pemberani dan penunggang infanteri terkenal karena kekalahan cepat mereka; ia bersumpah setia di bawah pohon tiga kali dan menjadi pahlawan Pertempuran Dhi Qard ketika ia sendirian mengejar musuh Ghatafan dengan berjalan kaki hingga ia menyelamatkan vaksin Nabi. Nabi berkata tentangnya: \"Orang terbaik kami adalah Salamah ibn al-Akwa'.\""
