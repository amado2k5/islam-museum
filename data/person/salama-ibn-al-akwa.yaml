  en: "A famed Companion celebrated as the swiftest runner and premier foot-archer among the Muslims; hero of the Expedition of Dhu Qarad where he pursued the raiders on foot and recovered the captured camels; fought valiantly at Khaybar, Hunayn, and the Ridwan Pledge."
  ar: "صحابي جليل من شجعان العرب وفرسان المشاة المشهورين بسرعة العدو؛ بايع تحت الشجرة ثلاثاً، وبطل معركة ذي قرد حين طارد مغيري غطفان بمفرده عدواً على قدميه حتى استنقذ لقاح النبي، وقال فيه النبي: «خير رجالتنا سلمة بن الأكوع»."
