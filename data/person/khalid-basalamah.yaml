summary:
  ar: "داعية إندونيسي ورجل أعمال، وُلد في ماكاسار سنة 1975، درس في الجامعة الإسلامية بالمدينة المنورة، ويُعد من أبرز وجوه الدعوة السلفية في إندونيسيا، تصل محاضراته إلى ملايين المتابعين عبر يوتيوب ومنصات التواصل."
  en: "Indonesian preacher and entrepreneur, born in Makassar in 1975. He studied at the Islamic University of Madinah and is a prominent figure of the Salafi movement in Indonesia, whose lectures reach millions of followers on YouTube and social media."
  ur: "انڈونیشیائی مبلغ اور کاروباری شخصیت، جو 1975 میں مکاسر میں پیدا ہوئے۔ انہوں نے مدینہ منورہ کی اسلامی یونیورسٹی میں تعلیم حاصل کی اور انڈونیشیا میں سلفی تحریک کی نمایاں شخصیات میں سے ہیں؛ ان کے خطبات یوٹیوب اور سوشل میڈیا پر لاکھوں لوگوں تک پہنچتے ہیں۔"
  es: "Predicador y empresario indonesio, nacido en Makassar en 1975. Estudió en la Universidad Islámica de Medina y es una figura destacada del movimiento salafista en Indonesia, cuyas conferencias llegan a millones de seguidores en YouTube y las redes sociales."
  fr: "Prédicateur et entrepreneur indonésien, né à Makassar en 1975. Il a étudié à l'Université islamique de Médine et est une figure importante du mouvement salafiste en Indonésie, dont les conférences touchent des millions d'adeptes sur YouTube et les réseaux sociaux."
  tr: "1975 yılında Makassar'da doğan Endonezyalı vaiz ve iş insanı, Medine'deki İslam Üniversitesi'nde eğitim görmüştür. Endonezya'daki Selefi savunuculuğunun en önde gelen isimlerinden biri olarak kabul edilir. Konferansları YouTube ve sosyal medya platformlarında milyonlarca takipçiye ulaşmaktadır."
  id: "Seorang pendakwah dan pengusaha Indonesia, lahir di Makassar pada tahun 1975, belajar di Universitas Islam di Madinah. Ia dianggap sebagai salah satu tokoh paling menonjol dalam advokasi Salafi di Indonesia. Ceramahnya menjangkau jutaan pengikut di YouTube dan platform media sosial."
