summary:
  ar: "عبد الله بن خازم بن أسماء بن الصلت السلمي؛ كانت داره بالبصرة لعمته دجاجة أم عبد الله بن عامر فأقطعته إياها وكان مع عبد الرحمن بن سمرة من الأشراف في فتح كابل وضرب فيلاً كان مع المشركين فسقط على الباب الذي خرجوا منه فلم يقدروا على غلقه فدخلها المسلمون عنوة وقال أبو مخنف الذي عقر الفيل المهلب."
  en: "Abdallah ibn Khazim ibn Asma' ibn al-Salt al-Sulami; his Basra house came as a qati'a from his aunt Dajaja, Abdallah ibn Amir's mother."
