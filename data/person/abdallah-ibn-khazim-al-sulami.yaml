class: person
label: { ar: "عبد الله بن خازم السلمي", en: "Abdallah ibn Khazim al-Sulami", fr: "Abdallah ibn Khazim al-Sulami", es: "Abdallah ibn Khazim al-Sulami", ur: "عبداللہ بن خزیم السلمی۔" }
summary:
  ar: "عبد الله بن خازم بن أسماء بن الصلت السلمي؛ كانت داره بالبصرة لعمته دجاجة أم عبد الله بن عامر فأقطعته إياها وكان مع عبد الرحمن بن سمرة من الأشراف في فتح كابل وضرب فيلاً كان مع المشركين فسقط على الباب الذي خرجوا منه فلم يقدروا على غلقه فدخلها المسلمون عنوة وقال أبو مخنف الذي عقر الفيل المهلب."
  en: "Abdallah ibn Khazim ibn Asma' ibn al-Salt al-Sulami; his Basra house came as a qati'a from his aunt Dajaja, Abdallah ibn Amir's mother."
  fr: "Abdallah ibn Khazim ibn Asma' ibn al-Salt al-Sulami ; sa maison de Bassora lui vint en concession de sa tante Dajaja, mère d'Abdallah ibn Amir."
  es: "Abdallah ibn Khazim ibn Asma' ibn al-Salt al-Sulami; su casa en Basora vino como qati'a de su tía Dajaja, la madre de Abdallah ibn Amir."
  ur: "عبداللہ بن خزیم بن اسماء بن الصلت السلمی؛ ان کا بصرہ گھر ان کی خالہ دجاجہ عبداللہ بن عامر کی والدہ سے قتیہ کے طور پر آیا تھا۔"
  tr: "Abdullah bin Khazim bin Asma bin Al-Salt Al-Sulami; Basra'daki evi, Abdullah bin Amer'in annesi olan teyzesi Dajaja'ya aitti, bu yüzden evi ona verdi. Kabil'in fethinde soylulardan Abdül Rahman bin Samra ile birlikteydi ve müşriklerin elindeki bir file vurdu, fil onların çıkış kapısına düştü, kapıyı kapatamadılar, böylece Müslümanlar zorla içeri girdiler. Ebu Mikhnaf, fili sakatlayanın Al-Muhallab olduğunu söyledi."
  id: "Abdullah bin Khazim bin Asma bin Al-Salt Al-Sulami; rumahnya di Basra adalah milik bibinya, Dajaja, ibu dari Abdullah bin Amer, sehingga ia memberikannya kepada Abdullah bin Amer. Ia bersama Abdul Rahman bin Samra, salah seorang bangsawan, dalam penaklukan Kabul, dan ia memukul seekor gajah yang bersama kaum musyrik, sehingga gajah itu jatuh di pintu tempat mereka keluar, sehingga mereka tidak dapat menutupnya, lalu kaum Muslim masuk dengan paksa. Abu Mikhnaf berkata bahwa orang yang melumpuhkan gajah itu adalah Al-Muhallab."
