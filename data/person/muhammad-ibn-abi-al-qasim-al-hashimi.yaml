summary:
  ar: "محمد بن أبي القاسم الهاشمي مولاهم، كان من المؤانسين بذكر الله والمشهورين بإجابة الدعاء، قارب المائة، ووعظ جبارًا فقطعت يداه ورجلاه، فقال لإخوانه: لا تعزوني، بل هنّئوني بما ساق الله إليّ."
  en: "Muhammad ibn Abi al-Qasim al-Hashimi, their client, one of those intimate with God's remembrance and known for answered prayer, who came near a hundred years; when he admonished a tyrant and had his hands and feet cut off, he told his brothers: do not console me, but congratulate me on what God has brought to me."
  ur: "محمد بن ابی القاسم ہاشمی، جو ان کے مولیٰ تھے، اللہ کے ذکر سے انس رکھنے والے اور دعا کی قبولیت میں مشہور تھے، اور سو کے قریب عمر کو پہنچے۔ ایک ظالم کو نصیحت کرنے پر ان کے ہاتھ پاؤں کاٹ دیے گئے تو انہوں نے بھائیوں سے کہا: مجھے تعزیت نہ دو، بلکہ اس پر مبارک باد دو جو اللہ نے میرے لیے بھیجا۔"
