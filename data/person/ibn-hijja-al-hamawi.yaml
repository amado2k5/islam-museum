summary:
  ar: "تقي الدين ابن حجة الحموي الأديب البارع الحنفي دينار الشام؛ ولد بحماة سنة سبع وسبعين وسبعمائة وعمل الحرير يعقد الأرزال وينظم الأزجال ثم مال إلى الأدب فنثر ونظم واتصل بخدمة نائب دمشق الأمير شيخ المحمودي ثم قدم صحبته القاهرة فلما تسلطن قربه وأدناه وجعله من ندمائه وخواصه وصار شاعره وعظم في الدولة وصارت له ثروة وحشمة، قال ابن حجر ما رأيت مثل الحافظ ابن حجر من شاعر العصر فقال الشيخ تقي الدين بن حجة، ونظم بديعيته المشهورة على طريقة شيخه عز الدين الموصلي وشرحها شرحاً حافلاً عديم النظير، ولما توفي الملك المؤيد تسلط عليه جماعة من شعراء عصره وهجوه لأنه كان ظنيناً بنفسه وشعره مزرياً بغيره حتى خرج من مصر وسكن وطنه حماة ومات بها، توفي بحماة في خامس عشر شعبان سنة سبع وثلاثين وثمانمائة {cite:shadharat-dhahab p. 219-220}."
  en: "Taqi al-Din Ibn Hijja of Hama (b. 777) — from silk-weaver to al-Mu'ayyad Shaykh's court poet and 'poet of the age' per Ibn Hajar; his famous Badi'iyya on al-Mawsili's model with its peerless commentary; driven home to Hama by rival poets' lampoons after his patron's death, died there 15 Sha'ban 837 {cite:shadharat-dhahab p. 219-220}."
  es: "Taqi al-Din Ibn Hijja de Hama (n. 777): de tejedor de seda a poeta de la corte de al-Mu'ayyad Shaykh y \"poeta de la época\" según Ibn Hajar; su famosa Badi'iyya basada en el modelo de al-Mawsili con su comentario incomparable; conducido a casa en Hama por los satirizadores de poetas rivales después de la muerte de su patrón, murió allí el 15 de Sha'ban 837 {cita: shadharat-dhahab p. 219-220}."
  fr: "Taqi al-Din Ibn Hijja de Hama (né en 777) — du tisserand de soie au poète de la cour d'al-Mu'ayyad Shaykh et « poète de l'époque » selon Ibn Hajar; sa célèbre Badi'iyya sur le modèle d'al-Mawsili avec son commentaire sans égal; reconduit chez lui à Hama par les pamphlets des poètes rivaux après la mort de son patron, y mourut le 15 Sha'ban 837 {cite: shadharat-dhahab p. 219-220}."
  ur: "تقی الدین ابن حجا آف حما ⁦(متوفی 777)⁩ - ریشم بنانے والے سے لے کر المعیاد شیخ کے درباری شاعر اور ابن حجر کے مطابق 'عمر کے شاعر' تک؛ الموسیلی کے نمونے پر ان کی مشہور بدیعہ اپنی بے مثال تفسیر کے ساتھ؛ اپنے سرپرست کی موت کے بعد حریف شاعروں کے چراغوں کے ذریعہ حما کی طرف گھر چلا گیا، وہیں 15 شعبان 837 میں وفات پائی۔ 219-220}۔"
