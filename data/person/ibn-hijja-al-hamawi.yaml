summary:
  ar: "تقي الدين ابن حجة الحموي الأديب البارع الحنفي دينار الشام؛ ولد بحماة سنة سبع وسبعين وسبعمائة وعمل الحرير يعقد الأرزال وينظم الأزجال ثم مال إلى الأدب فنثر ونظم واتصل بخدمة نائب دمشق الأمير شيخ المحمودي ثم قدم صحبته القاهرة فلما تسلطن قربه وأدناه وجعله من ندمائه وخواصه وصار شاعره وعظم في الدولة وصارت له ثروة وحشمة، قال ابن حجر ما رأيت مثل الحافظ ابن حجر من شاعر العصر فقال الشيخ تقي الدين بن حجة، ونظم بديعيته المشهورة على طريقة شيخه عز الدين الموصلي وشرحها شرحاً حافلاً عديم النظير، ولما توفي الملك المؤيد تسلط عليه جماعة من شعراء عصره وهجوه لأنه كان ظنيناً بنفسه وشعره مزرياً بغيره حتى خرج من مصر وسكن وطنه حماة ومات بها، توفي بحماة في خامس عشر شعبان سنة سبع وثلاثين وثمانمائة {cite:shadharat-dhahab p. 219-220}."
  en: "Taqi al-Din Ibn Hijja of Hama (b. 777) — from silk-weaver to al-Mu'ayyad Shaykh's court poet and 'poet of the age' per Ibn Hajar; his famous Badi'iyya on al-Mawsili's model with its peerless commentary; driven home to Hama by rival poets' lampoons after his patron's death, died there 15 Sha'ban 837 {cite:shadharat-dhahab p. 219-220}."
  es: "Taqi al-Din Ibn Hijja de Hama (n. 777): de tejedor de seda a poeta de la corte de al-Mu'ayyad Shaykh y \"poeta de la época\" según Ibn Hajar; su famosa Badi'iyya basada en el modelo de al-Mawsili con su comentario incomparable; conducido a casa en Hama por los satirizadores de poetas rivales después de la muerte de su patrón, murió allí el 15 de Sha'ban 837 {cita: shadharat-dhahab p. 219-220}."
  fr: "Taqi al-Din Ibn Hijja de Hama (né en 777) — du tisserand de soie au poète de la cour d'al-Mu'ayyad Shaykh et « poète de l'époque » selon Ibn Hajar; sa célèbre Badi'iyya sur le modèle d'al-Mawsili avec son commentaire sans égal; reconduit chez lui à Hama par les pamphlets des poètes rivaux après la mort de son patron, y mourut le 15 Sha'ban 837 {cite: shadharat-dhahab p. 219-220}."
  ur: "تقی الدین ابن حجا آف حما ⁦(متوفی 777)⁩ - ریشم بنانے والے سے لے کر المعیاد شیخ کے درباری شاعر اور ابن حجر کے مطابق 'عمر کے شاعر' تک؛ الموسیلی کے نمونے پر ان کی مشہور بدیعہ اپنی بے مثال تفسیر کے ساتھ؛ اپنے سرپرست کی موت کے بعد حریف شاعروں کے چراغوں کے ذریعہ حما کی طرف گھر چلا گیا، وہیں 15 شعبان 837 میں وفات پائی۔ 219-220}۔"
  tr: "Taqi al-Din İbn Huccah el-Hamawi, yetenekli bir Hanefi edebi figürü ve Levant'ın dinarıydı; 777 Hicri yılında Hama'da doğdu. İpek çalıştı, arzal bağladı ve zajallar yazdı. Sonra edebiyata, düzyazıya ve besteciliğe yöneldi, Şam'ın vekili Prens Şeyh el-Mahmudi ile bağlantı kurdu. Sonra ona Kahire'ye eşlik etti. İktidara geldiğinde onu yakınlaştırdı ve aşağı indi, yakın dostlarından biri yaptı. Onun şairi oldu, devlette yükseldi ve zenginlik ve onur kazandı. İbn Hacar şöyle dedi: O dönemde el-Hafız İbn Hajar gibi bir şair görmedim. Şeyh Taqi al-Din ibn Hucce şöyle dedi, şiir yazdı. Ünlü söylemi, öğretmeni İzzeddin el-Mevsili'den esinlenilerek hazırlanmış ve eşsiz ve zengin bir açıklamayla açıklamıştır. Kral el-Mueyyad öldüğünde, zamanının bir grup şairi onu ele geçirip kendisini ve şiirlerini diğerlerine kıyasla sefil olarak görmüş gibi hicvetmişti; ta ki Mısır'dan ayrılıp memleketi Hama'ya yerleşene ve orada ölene kadar. Sekiz yüz otuz yedi yılında, Şaban ayının on beşinde Hama'da öldü {cite:shadharat-dhahab, s. 219-220}."
  id: "Taqi al-Din Ibn Hujjah al-Hamawi adalah tokoh sastra Hanafi yang terampil dan dinar dari Levant; ia lahir di Hama pada tahun 777 H. Ia bekerja dengan sutra, mengikat arzal, dan menyusun zajal. Kemudian ia beralih ke sastra, prosa, dan komposis, serta berhubungan dengan wakil Damaskus, Pangeran Sheikh al-Mahmoudi. Ia kemudian menemaninya ke Kairo. Ketika ia memperoleh kekuasaan, ia mendekatkan dan menurunkannya, menjadikannya salah satu rekan dekat dan rekan dekatnya. Ia menjadi penyairnya, naik tahta, dan memperoleh kekayaan serta martabat. Ibn Hajar berkata: Saya belum pernah melihat penyair seperti al-Hafiz Ibn Hajar pada masa itu. Sheikh Taqi al-Din ibn Hujjah berkata, dan ia menulis puisi. Retorika terkenalnya ditiru dari gurunya Izz al-Din al-Mawsili dan menjelaskannya dengan penjelasan yang tiada banding dan kaya. Ketika Raja al-Mu'ayyad wafat, sekelompok penyair pada zamannya mengambil alih dan menyindir dia karena dia curiga pada dirinya sendiri dan puisinya lebih buruk dibandingkan yang lain, sampai dia meninggalkan Mesir, menetap di tanah kelahirannya Hama, dan meninggal di sana. Dia meninggal di Hama pada tanggal lima belas Sha'ban tahun delapan ratus tiga puluh tujuh {cite:shadharat-dhahab, hlm. 219-220}."
