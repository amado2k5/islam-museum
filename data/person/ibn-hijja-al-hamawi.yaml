summary:
  ar: "تقي الدين ابن حجة الحموي الأديب البارع الحنفي دينار الشام؛ ولد بحماة سنة سبع وسبعين وسبعمائة وعمل الحرير يعقد الأرزال وينظم الأزجال ثم مال إلى الأدب فنثر ونظم واتصل بخدمة نائب دمشق الأمير شيخ المحمودي ثم قدم صحبته القاهرة فلما تسلطن قربه وأدناه وجعله من ندمائه وخواصه وصار شاعره وعظم في الدولة وصارت له ثروة وحشمة، قال ابن حجر ما رأيت مثل الحافظ ابن حجر من شاعر العصر فقال الشيخ تقي الدين بن حجة، ونظم بديعيته المشهورة على طريقة شيخه عز الدين الموصلي وشرحها شرحاً حافلاً عديم النظير، ولما توفي الملك المؤيد تسلط عليه جماعة من شعراء عصره وهجوه لأنه كان ظنيناً بنفسه وشعره مزرياً بغيره حتى خرج من مصر وسكن وطنه حماة ومات بها، توفي بحماة في خامس عشر شعبان سنة سبع وثلاثين وثمانمائة {cite:shadharat-dhahab p. 219-220}."
  en: "Taqi al-Din Ibn Hijja of Hama (b. 777) — from silk-weaver to al-Mu'ayyad Shaykh's court poet and 'poet of the age' per Ibn Hajar; his famous Badi'iyya on al-Mawsili's model with its peerless commentary; driven home to Hama by rival poets' lampoons after his patron's death, died there 15 Sha'ban 837 {cite:shadharat-dhahab p. 219-220}."
