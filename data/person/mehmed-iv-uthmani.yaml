summary:
  ar: "السلطان محمد الرابع (١٠٥٨–١٠٩٩هـ/١٦٤٨–١٦٨٧م)؛ ولد عام ١٠٥١هـ وتولى المسئولية وهو ابن سبع سنين بعد قتل أبيه إبراهيم. ورأت أوروبا أن الوقت حان للنيل من الدولة فكونت الحلف المقدس الذي ضم النمسا وبولونيا والبندقية ورهبان مالطة والبابا وروسيا، وبدأ الهجوم الصليبي على ديار الدولة، فقيّض الله لها آل كوبريللي: أعاد الصدر الأعظم محمد كوبريللي للدولة هيبتها حتى وفاته عام ١٠٧٢هـ/١٦٦١م، وسار على نهجه ابنه أحمد كوبريللي الذي فتح قلعة نوهزل سنة ١٠٧٤هـ. وبوفاة أحمد كوبريللي ضعف النظام فاغتصبت النمسا نوهزل وبست وبودا واحتلت البندقية أثينا وكورنثة عام ١٠٩٧هـ، واتفق العلماء ورجال الدولة على عزل محمد الرابع فعُزل عام ١٠٩٩هـ وتولى مكانه أخوه سليمان الثاني {cite:dawlat-uthmaniyya-salabi p. 307-308}."
  en: "Mehmed IV (r. 1058–1099/1648–1687) — enthroned at seven after his father's killing; Europe formed the Holy League against him, and the Köprülü viziers answered it until defeats after Fazıl Ahmed's death forced the ulema and statesmen to depose him in 1099 {cite:dawlat-uthmaniyya-salabi p. 307-308}."
