summary:
  ar: "محمد الرابع هو السلطان العثماني التاسع عشر، حكم من 1058هـ إلى 1099هـ، 1648 إلى 1687م، وتولى العرش وهو في السابعة. شهد عهده حكم الوزراء الكوبريلليين وفتح كريت، ثم حصار فيينا الثاني الفاشل سنة 1094هـ/1683م وضياع معظم المجر. وخُلع في 2 محرم 1099هـ، 8 نوفمبر 1687م، بعد ثورة الجند عقب هزيمة موهاج، وتوفي في أدرنة سنة 1104هـ/1693م."
  en: "Mehmed IV, the nineteenth Ottoman sultan, reigned 1058 to 1099 AH, 1648 to 1687 CE, and came to the throne at seven. His reign saw the Köprülü viziers, the conquest of Crete, the failed second siege of Vienna in 1683 and the loss of most of Hungary. He was deposed on 2 Muharram 1099, 8 November 1687, after a troop revolt following the defeat at Mohács, and died at Edirne in 1693."
  ur: "محمد رابع انیسویں عثمانی سلطان تھے، جو 1058ھ سے 1099ھ، یعنی 1648ء سے 1687ء تک حکمران رہے اور سات برس کی عمر میں تخت نشین ہوئے۔ ان کے دور میں کوپرلو وزرا کی حکمرانی، کریٹ کی فتح، 1683ء میں ویانا کا ناکام دوسرا محاصرہ اور ہنگری کا بیشتر حصہ ہاتھ سے جانا شامل ہیں۔ موہاچ کی شکست کے بعد فوج کی بغاوت پر وہ 2 محرم 1099ھ، 8 نومبر 1687ء کو معزول ہوئے اور 1693ء میں ادرنہ میں فوت ہوئے۔"
