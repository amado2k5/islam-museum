summary:
  ar: "ضابط وسياسي بنغلاديشي (1 فبراير 1930 – 14 يوليو 2019)، استولى على السلطة في انقلاب غير دموي سنة 1982 وتولى رئاسة بنغلاديش من 1983 إلى 1990، وفي عهده جعل تعديل دستوري سنة 1988 الإسلامَ دينَ الدولة. أسس حزب جاتيا وظل رئيسه حتى وفاته، وانتُخب نائبًا عن رانجبور-3 في كل انتخابات عامة من 1991 إلى 2018، حتى أطاحت به انتفاضة شعبية سنة 1990 من الرئاسة وبقي شخصية مركزية في سياسة بنغلاديش ثلاثة عقود أخرى."
  en: "Bangladeshi military officer and politician (1 February 1930 – 14 July 2019) who seized power in a bloodless coup in 1982 and served as president of Bangladesh from 1983 to 1990; under his government a 1988 constitutional amendment made Islam the state religion. He founded the Jatiya Party and chaired it until his death, and was elected to parliament for Rangpur-3 at every general election from 1991 to 2018, remaining a central figure in Bangladeshi politics for three decades after a mass uprising forced his resignation in 1990."
  ur: "بنگلہ دیشی فوجی افسر اور سیاست دان (1 فروری 1930ء – 14 جولائی 2019ء)، جنھوں نے 1982ء میں غیر خونی بغاوت کے ذریعے اقتدار سنبھالا اور 1983ء سے 1990ء تک بنگلہ دیش کے صدر رہے؛ انھی کے دور میں 1988ء کی آئینی ترمیم نے اسلام کو ریاستی مذہب قرار دیا۔ انھوں نے جاتیہ پارٹی قائم کی اور وفات تک اس کے سربراہ رہے، اور 1991ء سے 2018ء تک ہر عام انتخاب میں رنگ پور-3 سے رکن پارلیمنٹ منتخب ہوئے۔"
