summary:
  ar: "ضابط وسياسي بنغلاديشي ⁦(1 فبراير 1930 – 14 يوليو 2019)⁩، استولى على السلطة في انقلاب غير دموي سنة 1982 وتولى رئاسة بنغلاديش من 1983 إلى 1990، وفي عهده جعل تعديل دستوري سنة 1988 الإسلامَ دينَ الدولة. أسس حزب جاتيا وظل رئيسه حتى وفاته، وانتُخب نائبًا عن رانجبور-3 في كل انتخابات عامة من 1991 إلى 2018، حتى أطاحت به انتفاضة شعبية سنة 1990 من الرئاسة وبقي شخصية مركزية في سياسة بنغلاديش ثلاثة عقود أخرى."
  en: "Bangladeshi military officer and politician (1 February 1930 – 14 July 2019) who seized power in a bloodless coup in 1982 and served as president of Bangladesh from 1983 to 1990; under his government a 1988 constitutional amendment made Islam the state religion. He founded the Jatiya Party and chaired it until his death, and was elected to parliament for Rangpur-3 at every general election from 1991 to 2018, remaining a central figure in Bangladeshi politics for three decades after a mass uprising forced his resignation in 1990."
  ur: "بنگلہ دیشی فوجی افسر اور سیاست دان ⁦(1 فروری 1930ء – 14 جولائی 2019ء)⁩، جنھوں نے 1982ء میں غیر خونی بغاوت کے ذریعے اقتدار سنبھالا اور 1983ء سے 1990ء تک بنگلہ دیش کے صدر رہے؛ انھی کے دور میں 1988ء کی آئینی ترمیم نے اسلام کو ریاستی مذہب قرار دیا۔ انھوں نے جاتیہ پارٹی قائم کی اور وفات تک اس کے سربراہ رہے، اور 1991ء سے 2018ء تک ہر عام انتخاب میں رنگ پور-3 سے رکن پارلیمنٹ منتخب ہوئے۔"
  es: "Oficial militar y político bangladesí (1 de febrero de 1930 - 14 de julio de 2019) que tomó el poder en un golpe de Estado incruento en 1982 y fue presidente de Bangladesh de 1983 a 1990; bajo su gobierno, una enmienda constitucional de 1988 convirtió al islam en la religión oficial del Estado. Fundó el Partido Jatiya y lo presidió hasta su muerte, y fue elegido diputado por Rangpur-3 en todas las elecciones generales desde 1991 hasta 2018, permaneciendo como una figura central en la política bangladesí durante tres décadas después de que un levantamiento popular forzara su dimisión en 1990."
  fr: "Officier militaire et homme politique bangladais (1er février 1930 – 14 juillet 2019), il s'empara du pouvoir lors d'un coup d'État sans effusion de sang en 1982 et fut président du Bangladesh de 1983 à 1990. Sous son gouvernement, une modification constitutionnelle de 1988 fit de l'islam la religion d'État. Il fonda le Jatiya Party, qu'il présida jusqu'à sa mort, et fut élu député de la circonscription de Rangpur-3 à chaque élection générale de 1991 à 2018. Il demeura une figure centrale de la vie politique bangladaise pendant trois décennies après sa démission forcée en 1990 suite à un soulèvement populaire."
  tr: "Bangladeşli bir subay ve politikacı olan Shers, 1 Şubat 1930 – 14 Temmuz 2019 tarihlerinde 1982'de kan dökülmeden yapılan bir darbeyle iktidarı ele geçirdi ve 1983-1990 yılları arasında Bangladeş cumhurbaşkanı olarak görev yaptı. Saltanatı sırasında, 1988'de yapılan bir anayasa değişikliğiyle İslam devlet dini oldu. Jatiya Partisi'ni kurdu ve ölümüne kadar lideri olarak kaldı. 1991'den 2018'e kadar her genel seçimde Rangpur-3 milletvekili olarak seçildi, ta ki 1990'daki halk ayaklanması onu cumhurbaşkanlığından uzaklaştırana kadar; otuz yıl daha Bangladeş siyasetinde merkezi bir figür olarak kaldı."
  id: "Seorang pejabat dan politisi Bangladesh (1 Februari 1930 – 14 Juli 2019), ia merebut kekuasaan melalui kudeta tanpa pertumpahan darah pada tahun 1982 dan menjabat sebagai presiden Bangladesh dari tahun 1983 hingga 1990. Selama masa pemerintahannya, amandemen konstitusi pada tahun 1988 menjadikan Islam sebagai agama negara. Ia mendirikan Partai Jatiya dan tetap menjadi pemimpinnya hingga wafat. Ia terpilih sebagai deputi untuk Rangpur-3 dalam setiap pemilihan umum dari tahun 1991 hingga 2018, hingga pemberontakan rakyat pada tahun 1990 menggulingkannya dari jabatan presiden, tetap menjadi tokoh sentral dalam politik Bangladesh selama tiga dekade berikutnya."
