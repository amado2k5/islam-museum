label: { ar: "أبو بكرة بن مسروح", en: "Abu Bakra ibn Masruh" }
summary:
  ar: "أبو بكرة بن مسروح نفيع الثقفي مولى رسول الله من مولدي ثقيف؛ شهد على المغيرة بن شعبة في قصة أم جميل فجلده عمر في القذف فلما قال أشهد إنه لزان قال له عمر حدوه فقال علي إن جعلتها شهادة فارجم صاحبك وحلف أن لا يكلم أخاه لأمه زياداً أبداً وكان قدم مع عتبة بن غزوان البصرة."
  en: "Abu Bakra ibn Masruh Nufay' al-Thaqafi, the Prophet's mawla of Thaqif's foundlings; his testimony in the Mughira affair earned him Umar's qadhf-flogging — swearing again 'he is an adulterer' he was warned of the hadd — 'then it is a claim and your man is stoned' — and he swore never again to speak to Ziyad, his half-brother by Sumayya; he had come to Basra with Utba ibn Ghazwan."
