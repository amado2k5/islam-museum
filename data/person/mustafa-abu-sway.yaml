  ar: "عالم فلسطيني، وُلد سنة 1957، أستاذ الدراسات الإسلامية في جامعة القدس. يحمل الدكتوراه في فلسفة الغزالي من كلية بوسطن، وشغل مناصب أكاديمية ووقفية في القدس، ويعتبر من أبرز المتحدثين عن شؤون المسجد الأقصى والأوقاف الإسلامية في المدينة."
  en: "Palestinian scholar, born in 1957, professor of Islamic studies at Al-Quds University. He holds a doctorate on al-Ghazali's philosophy from Boston College, has held academic and waqf-related posts in Jerusalem, and is among the most cited voices on Al-Aqsa Mosque and the Islamic endowments of the city."
  ur: "فلسطینی عالم، 1957 میں پیدا ہوئے، القدس یونیورسٹی میں اسلامیات کے پروفیسر۔ انھوں نے بوسٹن کالج سے امام غزالی کے فلسفے پر ڈاکٹریٹ لی، یروشلم میں تعلیمی اور وقفی عہدے سنبھالے، اور مسجدِ اقصیٰ اور شہر کے اسلامی اوقاف کے معاملات پر سب سے زیادہ حوالہ دیے جانے والی آوازوں میں شمار ہوتے ہیں۔"
