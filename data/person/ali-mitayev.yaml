summary:
  ar: "علي بامات غيرييفيتش ميتاييف (1881–1925)، شيخ صوفي شيشاني وقائد سياسي وعسكري؛ خلف والده الشيخ بامات غيري حاجي ميتاييف في المشيخة سنة 1914، وأسس مدرسة في قريته أفتوري، وقاد الفوج الشرعي في الحرب الأهلية الروسية، وصار عضوًا في اللجنة الثورية لمنطقة الشيشان ذاتية الحكم، ثم اعتُقل سنة 1924 وأُعدم رميًا بالرصاص في روستوف على الدون في سبتمبر 1925."
  en: "Ali Bamat-Gireyevich Mitayev (1881–1925) was a Chechen Sufi sheikh and political and military leader. He succeeded his father, Sheikh Bamat-Girey-Hajji Mitayev, as sheikh in 1914, founded a madrasa at his native Avtury, led the Sharia Regiment in the Russian Civil War, sat on the revolutionary committee of the Chechen Autonomous Oblast, and was arrested in 1924 and shot at Rostov-on-Don in September 1925."
  ur: "علی بامات گیریئیوچ میتاییف (1881–1925) چیچن صوفی شیخ اور سیاسی و عسکری رہنما تھے۔ وہ 1914 میں اپنے والد شیخ بامات گیرے حاجی میتاییف کے جانشین کے طور پر شیخ بنے، اپنے آبائی گاؤں افتوری میں مدرسہ قائم کیا، روسی خانہ جنگی میں شرعی رجمنٹ کی قیادت کی، چیچن خودمختار اوبلاست کی انقلابی کمیٹی کے رکن رہے، اور 1924 میں گرفتار ہو کر ستمبر 1925 میں روستوف-نا-دونو میں گولی مار کر ہلاک کیے گئے۔"
