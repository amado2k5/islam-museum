summary:
  ar: "شمس الدين النواجي الشافعي المصري الإمام العلامة الأديب؛ ولد بالقاهرة بعد سنة خمس وثمانين وسبعمائة تقريباً وقرأ بها القرآن وتلا ببعض السبع وحفظ العمدة والتنبيه والشاطبية والألفية وعرض بعضها على الشيخ زين الدين العراقي، ثم أقبل على التفهم فأخذ الفقه عن الشمس البرماوي والبرهان البيجوري والنحو وغيره من المعقول عن الشيخ عز الدين بن جماعة والشمس البساطي والشمس بن هشام العجيمي وحج مرتين ودخل دمياط والإسكندرية وتردد إلى المحلة، وأمعن النظر في علوم الأدب وأنعم حتى فاق أهل العصر فما رام بديع معنى إلا أطاعه وأنعم، وأطال الاعتناء بالأدب فوى فيه قصب السبق إلى أعلى الرتب، ومن مصنفاته حاشية على التوضيح في مجلد وبعض حاشية على الجامبردي وكتاب تأهيل الغريب يشتمل على قصائد مطولات كلها غزل والشقائق بديع الاكتفاء وخلع العذار في وصف العذار ومحافف الحسنات وروضة المجالس في بديع المجانسة ومراتع الغزلان في وصف الحسان من الغلمان وحلية الكميت في وصف الخمر، وكان سماه أولاً الحبور والسرور في وصف الجمور فحصلت له بسببه محنة عظيمة واستفتى عليه فغير تسميته، وذكر له ابن العماد أشياء حسنة وأخرى بضدها وأظهر تحاملاً عليه فلذلك لم يذكر شيئاً من ذلك، وتوفي سنة تسع وخمسين وثمانمائة {cite:shadharat-dhahab p. 295-297}."
  en: "Al-Nuwaji (b. Cairo ~785) — the celebrated man of letters who 'took the palm of precedence in adab'; author of Ta'hil al-Gharib (all-ghazal qasidas), Marati' al-Ghilzan on fair youths, and Hilyat al-Kumayt on wine — whose first title 'the wine-pitchers' brought him a grave ordeal and a fatwa forcing its renaming; died 859 {cite:shadharat-dhahab p. 295-297}."
