summary:
  ar: "شمس الدين النواجي الشافعي المصري الإمام العلامة الأديب؛ ولد بالقاهرة بعد سنة خمس وثمانين وسبعمائة تقريباً وقرأ بها القرآن وتلا ببعض السبع وحفظ العمدة والتنبيه والشاطبية والألفية وعرض بعضها على الشيخ زين الدين العراقي، ثم أقبل على التفهم فأخذ الفقه عن الشمس البرماوي والبرهان البيجوري والنحو وغيره من المعقول عن الشيخ عز الدين بن جماعة والشمس البساطي والشمس بن هشام العجيمي وحج مرتين ودخل دمياط والإسكندرية وتردد إلى المحلة، وأمعن النظر في علوم الأدب وأنعم حتى فاق أهل العصر فما رام بديع معنى إلا أطاعه وأنعم، وأطال الاعتناء بالأدب فوى فيه قصب السبق إلى أعلى الرتب، ومن مصنفاته حاشية على التوضيح في مجلد وبعض حاشية على الجامبردي وكتاب تأهيل الغريب يشتمل على قصائد مطولات كلها غزل والشقائق بديع الاكتفاء وخلع العذار في وصف العذار ومحافف الحسنات وروضة المجالس في بديع المجانسة ومراتع الغزلان في وصف الحسان من الغلمان وحلية الكميت في وصف الخمر، وكان سماه أولاً الحبور والسرور في وصف الجمور فحصلت له بسببه محنة عظيمة واستفتى عليه فغير تسميته، وذكر له ابن العماد أشياء حسنة وأخرى بضدها وأظهر تحاملاً عليه فلذلك لم يذكر شيئاً من ذلك، وتوفي سنة تسع وخمسين وثمانمائة {cite:shadharat-dhahab p. 295-297}."
  en: "Al-Nuwaji (b. Cairo ~785) — the celebrated man of letters who 'took the palm of precedence in adab'; author of Ta'hil al-Gharib (all-ghazal qasidas), Marati' al-Ghilzan on fair youths, and Hilyat al-Kumayt on wine — whose first title 'the wine-pitchers' brought him a grave ordeal and a fatwa forcing its renaming; died 859 {cite:shadharat-dhahab p. 295-297}."
  fr: "Al-Nuwaji (né au Caire 785) – le célèbre homme de lettres qui « a pris la palme de la préséance dans adab  » ; auteur de Ta'hil al-Gharib (tout-ghazal qasidas), Marati' al-Ghilzan sur les jeunes de foire, et Hilyat al-Kumayt sur le vin - dont le premier titre « les vignerons » lui a apporté une épreuve grave et une fatwa forçant son renommage ; est mort 859 {cite:shadharat-dhahab p. 295-297}."
  es: "Al-Nuwaji (n. El Cairo ~785) — el célebre hombre de letras que 'se llevó la palma de la precedencia en adab'; autor de Ta'hil al-Gharib (todas qasidas ghazal), Marati' al-Ghilzan sobre jóvenes rubios e Hilyat al-Kumayt sobre el vino — cuyo primer título 'las jarras de vino' le trajo una grave prueba y una fatwa que obligó a cambiarle el nombre; murió en 859 {cita: shadharat-dhahab p. 295-297}."
  ur: "النواجی ⁦(ب۔ قاہرہ ~ 785)⁩ - مشہور خطوط کا آدمی جس نے 'ادب میں سبقت حاصل کی'؛ تحریر الغریب ⁦(تمام غزل قصیدہ)⁩ کے مصنف، منصفانہ نوجوانوں پر مراتی الغزان، اور شراب پر ہلیات الکومیت - جس کا پہلا عنوان 'شراب کے گھڑے' اس کے لیے ایک سنگین آزمائش اور اس کے نام کو تبدیل کرنے پر مجبور کرنے کا فتویٰ لے کر آیا؛ متوفی 859 {حوالہ: شدارت ذہاب صفحہ 295-297}۔"
  tr: "Ünlü alim ve edebiyat figürü Şemseddin el-Nevici el-Şafii el-Masri, yaklaşık yedi yüz seksen beş hicri yaşından sonra Kahire'de doğdu. Orada Kur'an'ı okudu, yedi ayetten bazılarını okudu, el-'Umda, el-Tanbih, el-Şatibiye ve el-Alfiyye'yi ezberledi. Bunların bazılarını Şeyh Zeyn el-Din el-Irak'a sundu, ardından anlayış peşinde koştu, el-Şems el-Barmavi'den, el-Burhan el-Bijuri'den, dilbilgisi ve diğer akıl bilimlerini Şeyh İzzeddin bin Cema'ah, el-Şems el-Basati ve el-Şems bin Hişam el-Ecimi'den öğrendi. İki kez Hac yaptı, Damietta ve İskenderiye'ye girdi ve sık sık Mahalla'yı ziyaret etti. Edebiyat bilimlerini derinlemesine inceledi ve üstün başarılar elde etti Döneminin insanlarını aşana kadar Badi' anlam aradı; sadece itaat etmek ve nazik olmak için. Uzun süre edebiyata kendini adadı ve burada en yüksek rütbelere yükseldi. Eserleri arasında bir ciltte açıklama üzerine bir kenar not, Al-Jambardi üzerine bazı kenar notlar ve aşk şiiri üzerine uzun şiirler içeren Ta'il al-Gharib kitabı, Al-Shaqa'iq Badi'al-Siftifa, Khula' al-'Adhar'ın al-'Adhar el-Adhar'ı, Muhafif al-Hasanat, Rawdat al-Majalis in Badi' al-Majnasa', Marmat al-Ghazlan'ın çocuklar arasında yakışıklıları tanımlaması, Hilyat al-Kumayt'ın şarabı tanımlaması ve ilk olarak 'Al-Hubour wa al-Surur' olarak adlandırılması yer alır El-Cemur ona büyük sıkıntılar yaşattı ve aleyhine bir fetva danışıldı, fakat adını değiştirdi. İbn el-İmad kendisi ve diğerleri için iyi şeyler söyledi, ona karşı bir önyargı gösterdi, bu yüzden bunların hiçbirini anmadı. 859 Hicri yılında öldü {kaynak: şadharat-dhahab, s. 295-297}."
  id: "Shams al-Din al-Nawaji al-Shafi'i al-Masri, ulama dan tokoh sastra terkemuka, lahir di Kairo setelah sekitar tujuh ratus delapan puluh lima H. Ia membaca Al-Qur'an di sana, membaca beberapa dari tujuh ayat, menghafal al-'Umda, al-Tanbih, al-Shatibiyyah, dan al-Alfiyyah. Ia mempersembahkan beberapa ayat tersebut kepada Sheikh Zain al-Din al-Iraqi, kemudian melanjutkan pemahaman, mempelajari hukum dari al-Shams al-Barmawi, al-Burhan al-Bijuri, tata bahasa, dan ilmu rasional lainnya dari Sheikh Izz al-Din ibn Jama'ah, al-Shams al-Basati, dan al-Shams ibn Hisham al-Ajimi. Ia dua kali menunaikan Haji, masuk Damietta dan Alexandria, dan sering mengunjungi Mahalla. Ia mempelajari ilmu sastra secara mendalam dan unggul Hingga ia melampaui orang-orang pada zamannya, Badi' hanya mencari makna untuk taat dan bersikap lembut. Ia mendedikasikan dirinya lama pada sastra, di mana ia naik ke peringkat tertinggi. Di antara karyanya terdapat catatan pinggir tentang klarifikasi dalam satu jilid, beberapa catatan pinggir tentang Al-Jambardi, dan buku Ta'il al-Gharib, yang memuat puisi panjang yang semuanya berisi puisi cinta, Al-Shaqa'iq Badi' al-Siftifa, Khula' al-'Adhar dalam menggambarkan al-'Adhar, Muhafif al-Hasanat, Rawdat al-Majalis dalam Badi' al-Majnasa, Marmat al-Ghazlan yang menggambarkan tampannya di antara anak-anak, Hilyat al-Kumayt dalam menggambarkan anggur, dan ia pertama kali disebut 'Al-Hubour wa al-Surur' dalam menggambarkan Al-Jumur, yang menyebabkan penderitaan besar, dan sebuah fatwa dikonsultasikan terhadapnya, tetapi ia mengganti namanya. Ibn al-Imad menyebutkan hal-hal baik untuknya dan orang lain menentang mereka, menunjukkan sedikit bias terhadapnya, sehingga ia tidak menyebutkan hal itu. Ia meninggal pada tahun 859 H {cite:shadharat-dhahab, hlm. 295-297}."
