summary:
  ar: "سياسي تنزاني (1905–1972) عمل بحارا ثم قاد حزب أفروشيرازي، وصار بعد ثورة يناير 1964 أول رئيس لزنجبار، ووافق بعد ثلاثة أشهر على اتحادها مع تنجانيقا فنشأت تنزانيا وصار أول نائب لرئيسها. أمم الأراضي وأقام التعليم والصحة المجانيين، واغتاله أربعة مسلحين في مدينة زنجبار في 7 أبريل 1972 وهو يلعب الباو في مقر حزبه. وهو والد الرئيس السادس لزنجبار أماني عبيد كرومي."
  en: "Tanzanian politician (1905–1972) who worked as a seaman, led the Afro-Shirazi Party and, after the revolution of January 1964, became the first president of Zanzibar; three months later he agreed its union with Tanganyika, creating Tanzania, and became its first vice-president. He nationalised land and established free education and health services, and was shot dead by four gunmen in Zanzibar Town on 7 April 1972 while playing bao at his party's headquarters. He was the father of Zanzibar's sixth president, Amani Abeid Karume."
  ur: "تنزانیہ کے سیاست دان (1905ء–1972ء) جو ملاح رہے، پھر افروشیرازی پارٹی کی قیادت کی اور جنوری 1964ء کے انقلاب کے بعد زنجبار کے پہلے صدر بنے؛ تین ماہ بعد انہوں نے ٹینگانیکا کے ساتھ اتحاد پر رضامندی ظاہر کی جس سے تنزانیہ وجود میں آیا، اور وہ اس کے پہلے نائب صدر بنے۔ انہوں نے زمینوں کو قومی تحویل میں لیا اور مفت تعلیم و صحت قائم کی، اور 7 اپریل 1972ء کو زنجبار شہر میں پارٹی دفتر میں باؤ کھیلتے ہوئے چار مسلح افراد نے انہیں گولی مار کر ہلاک کر دیا۔ وہ زنجبار کے چھٹے صدر امانی عبید کرومی کے والد تھے۔"
