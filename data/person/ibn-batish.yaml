summary:
  ar: "العلامة الشافعي؛ دخل بغداد فتفقه بها وسمع من ابن الجوزي وغيره وبحلب من حنبل وبدمشق من جماعة، ودرس وأفتى وصنف تصانيف حسنة منها طبقات الشافعية وكتاب المغني في غريب المهذب، وكان من أعيان الأئمة عارفاً بالأصول قوي المشاركة في العلوم، لكن في كتابه المغني أوهام كثيرة نبه النووي في تهذيبه على كثير منها {cite:shadharat-dhahab p. 276}."
  en: "The Mosul Shafi'i (b. 575, d. Aleppo Jumada II 655) — author of Tabaqat al-Shafi'iyya and al-Mughni fi Gharib al-Muhadhdhab, whose errors al-Nawawi catalogued in his Tahdhib {cite:shadharat-dhahab p. 276}."
  es: "Mosul Shafi'i (n. 575, m. Alepo Jumada II 655) - autor de Tabaqat al-Shafi'iyya y al-Mughni fi Gharib al-Muhadhdhab, cuyos errores catalogó al-Nawawi en su Tahdhib {cita: shadharat-dhahab p. 276}."
  fr: "Le Mossoul Shafi'i (né en 575, décédé à Alep Jumada II 655) - auteur de Tabaqat al-Shafi'iyya et d'al-Mughni fi Gharib al-Muhadhdhab, dont al-Nawawi a catalogué les erreurs dans son Tahdhib {cite: shadharat-dhahab p. 276}."
  ur: "موصل شافعی ⁦(پیدائش 575، وفات حلب جمعہ دوم 655)⁩ - طبقات الشافعیہ اور المغنی فی غریب المحدث کے مصنف، جن کی غلطیاں النووی نے اپنی تہذیب میں درج کی ہیں۔ 276}۔"
  tr: "Alim El-Şafii; Bağdat'a girdi, orada fıkıh okudu ve İbn el-Cevzi ile diğerlerinden ve Halep'teki Hanbal ve Şam'dan bir gruptan dinledi. Öğretti, fetvalar yayımladı ve Tabaqat al-Shafi'iyya ile Al-Mughni fi Gharib al-Muhadhdhab adlı kitap gibi iyi eserler yazdı. İlkeler konusunda bilgili ve bilimlere güçlü katılım sağlayan önde gelen imamlar arasındaydı. Ancak, Al-Mughni adlı kitabında, al-Nawawi tarafından inceliklerinde birçok yanlış anlama ortaya konmuştur; bunların birçoğu {atı:shadharat-dhahab, s. 276}."
  id: "Cendekiawan Al-Shafi'i; ia masuk ke Baghdad, belajar hukum di sana, dan mendengar dari Ibn al-Jawzi dan lainnya, serta dari kelompok di Aleppo dari Hanbal dan Damaskus. Ia mengajar, mengeluarkan fatwa, dan menulis karya-karya baik termasuk Tabaqat al-Shafi'iyya dan buku Al-Mughni fi Gharib al-Muhadhdhab. Ia termasuk di antara imam terkemuka, berpengetahuan dalam prinsip-prinsip dan berpartisipasi kuat dalam ilmu pengetahuan. Namun, dalam bukunya Al-Mughni, banyak kesalahpahaman yang ditunjukkan oleh al-Nawawi dalam penyempurnaannya, banyak di antaranya {sitasi:shadharat-dhahab, hlm. 276}."
