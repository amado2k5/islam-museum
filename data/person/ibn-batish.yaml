  en: "The Mosul Shafi'i (b. 575, d. Aleppo Jumada II 655) — author of Tabaqat al-Shafi'iyya and al-Mughni fi Gharib al-Muhadhdhab, whose errors al-Nawawi catalogued in his Tahdhib {cite:shadharat-dhahab p. 276}."
