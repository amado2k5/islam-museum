summary:
  ar: "ابن أبي عبيد بن مسعود الثقفي؛ عند البلاذري أخذ اللواء يوم الجسر بعد عمّه الحكم فقتل ثم أخذه المثنى بن حارثة وانصرف بالناس."
  en: "Son of Abu Ubayd ibn Mas'ud al-Thaqafi; in al-Baladhuri he took the banner at the Day of the Bridge after his uncle al-Hakam and was killed, before al-Muthanna took it and withdrew the people."
  es: "Hijo de Abu Ubayd ibn Mas'ud al-Thaqafi; en al-Baladhuri tomó el estandarte el Día del Puente después de su tío al-Hakam y fue asesinado, antes de que al-Muthanna lo tomara y retirara al pueblo."
  fr: "Fils d'Abu Ubayd ibn Mas'ud al-Thaqafi; à al-Baladhuri, il prit l'étendard le jour du pont après son oncle al-Hakam et fut tué, avant qu'al-Muthanna ne le prenne et ne retire le peuple."
  ur: "ابو عبید بن مسعود ثقفی کے بیٹے؛ البلادوری میں اس نے برج کے دن اپنے چچا الحکم کے بعد جھنڈا لیا اور اسے قتل کر دیا گیا، اس سے پہلے کہ المثنا نے اسے لے لیا اور لوگوں کو واپس لے لیا۔"
