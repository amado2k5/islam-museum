summary:
  ar: "من البلاغة والعلم والفصاحة بالموضع الموصوف، قتله الحجاج سنة اثنتين وثمانين لخروجه مع ابن الأشعث وإنشائه الكتب له ووضعه الصدور والخطب، قتل صبراً وقيل ضربه بحربة في نحره، وهو القائل الناس ثلاثة عاقل وأحمق وفاجر فأما العاقل فالدين شريعته والحلم طبيعته والرأي الحسن سجيته {cite:muruj-al-dhahab p. 130-131}."
