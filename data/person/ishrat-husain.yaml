summary:
  ar: "عشرت حسين (وُلد 1941) اقتصادي ومصرفي وموظف حكومي باكستاني، وُلد في أغرا وانتقل مع أسرته إلى كراتشي بعد التقسيم، فعمل في البنك الدولي نحو عقدين ثم تولى منصب محافظ بنك الدولة الباكستاني في 1999–2006، وعمادة معهد إدارة الأعمال في كراتشي في 2008–2016، ومستشارية رئيس الوزراء للإصلاحات المؤسسية والتقشف في 2018–2022، ونال نشان الامتياز سنة 2015."
  en: "Ishrat Husain (born 1941) is a Pakistani economist, banker and civil servant, born at Agra, who moved with his family to Karachi after Partition, served some two decades at the World Bank, and then served as governor of the State Bank of Pakistan from 1999 to 2006, dean of the Institute of Business Administration, Karachi, from 2008 to 2016, and advisor to the Prime Minister on Institutional Reforms and Austerity from 2018 to 2022; he received the Nishan-e-Imtiaz in 2015."
  ur: "عشرت حسین (پیدائش 1941ء) پاکستانی ماہر اقتصادیات، بینکر اور سرکاری افسر ہیں، آگرہ میں پیدا ہوئے اور تقسیم کے بعد خاندان کے ساتھ کراچی منتقل ہوئے، عالمی بینک میں تقریباً دو دہائیاں خدمات انجام دیں، پھر 1999ء تا 2006ء گورنر بینک دولت پاکستان، 2008ء تا 2016ء انسٹیٹیوٹ آف بزنس ایڈمنسٹریشن کراچی کے ڈین، اور 2018ء تا 2022ء وزیر اعظم کے مشیر برائے ادارہ جاتی اصلاحات و کفایت شعاری رہے؛ 2015ء میں نشان امتیاز ملا۔"
