summary:
  ar: "مغنية عراقية وُلدت في بغداد سنة 1984، وهي ابنة الموسيقار كريم هميم. احترفت الغناء في الثانية والعشرين بعد مشاركتها في برنامج «نجوم العرب» على إم بي سي 1، وقدمت عشرات الأغاني الفردية والجماعية بلهجات عربية مختلفة وغنّت شارات مسلسلات كثيرة، وصارت أغنيتها «سر الحياة» (2019) الأكثر استماعًا لفنانة عربية على يوتيوب."
  en: "Iraqi singer born in Baghdad in 1984, the daughter of the musician Karim Hameem. She turned professional at twenty-two after competing in the Arab Stars programme on MBC 1, has released dozens of solo and joint songs in several Arabic dialects and sung the theme songs of many television series, and her 2019 song 'Ser Alhayah' became the most streamed song on YouTube by a female Arab artist."
  ur: "عراقی گلوکارہ، جو 1984 میں بغداد میں پیدا ہوئیں اور موسیقار كريم هميم کی بیٹی ہیں۔ انہوں نے ایم بی سی 1 کے پروگرام «نجوم العرب» میں شرکت کے بعد بائیس برس کی عمر میں پیشہ ورانہ گائیکی شروع کی، مختلف عربی لہجوں میں درجنوں انفرادی اور مشترکہ گانے پیش کیے اور کئی ٹیلی ویژن سلسلوں کے عنوانی گانے گائے، اور ان کا 2019 کا گانا «سر الحياة» یوٹیوب پر کسی عرب خاتون فنکار کا سب سے زیادہ سنا جانے والا گانا بن گیا۔"
