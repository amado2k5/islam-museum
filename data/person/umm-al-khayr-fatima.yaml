summary:
  ar: "أم الخير فاطمة بنت علي المقرئية؛ سمعت صحيح مسلم وغريبه وطالت مدة سماعها، وتوفيت نحو سنة اثنتين وثلاثين وخمسمائة وقد بلغت سبعاً وتسعين سنة {cite:shadharat-dhahab p. 582}."
  en: "Umm al-Khayr Fatima bint Ali the muqri'a; she transmitted Sahih Muslim and its Gharib over a long lifetime of samā', and died about 532 aged ninety-seven {cite:shadharat-dhahab p. 582}."
  es: "Umm al-Khayr Fatima bint Ali la muqri'a; transmitió Sahih Muslim y su Gharib durante una larga vida de samā', y murió alrededor del año 532 a la edad de noventa y siete años {cite:shadharat-dhahab p. 582}."
  fr: "Umm al-Khayr Fatima bint Ali la muqri'a; elle a transmis le Sahih Muslim et son Gharib au cours d'une longue vie de samā', et est décédée vers 532 à l'âge de quatre-vingt-dix-sept ans {cite:shadharat-dhahab p. 582}."
  ur: "ام الخیر فاطمہ بنت علی مقریہ؛ اس نے صحیح مسلم اور اس کے غریب کو سماع کی طویل زندگی میں منتقل کیا، اور تقریباً 532 سال کی عمر میں ان کی وفات ہوئی۔ 582}۔"
  tr: "Ümmü al-Khair Fatimah bint Ali al-Muqri'iyye; Sahih Müslüman'ı ve nadir rivayetlerini duydu ve işitmesi uzun sürdü. Yaklaşık beş yüz otuz iki Hâm yılında öldü ve doksan yedi yaşına ulaştı {atıf:shadharat-dhahab, s. 582}."
  id: "um al-Khair Fatimah bint Ali al-Muqri'iyyah; ia mendengar Sahih Muslim dan riwayatnya yang langka, dan pendengarannya memakan waktu lama. Ia meninggal sekitar tahun lima ratus tiga puluh dua H dan mencapai usia sembilan puluh tujuh tahun {cite:shadharat-dhahab, hlm. 582}."
