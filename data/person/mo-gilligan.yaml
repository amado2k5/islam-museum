summary:
  ar: "موسايا بيكيلا غيليغان (وُلد في 19 شباط 1988)، المعروف بمو غيليغان، فنان كوميدي ومقدم تلفزيوني بريطاني، وُلد في لامبث بلندن لأبوين من أصل جامايكي وسانت لوسي. اشتهر بمقاطع الكوميديا على وسائل التواصل منذ 2017، وشارك في تقديم «ذا بيغ نارستي شو»، وقدّم برنامجه «ذا لايتش شو» على القناة الرابعة، وهو من حكام برنامج «ذا ماسكد سينغر» البريطاني منذ 2020."
  en: "Mosiah Bikila Gilligan (born 19 February 1988), known as Mo Gilligan, is a British stand-up comedian and television presenter, born in Lambeth, London to parents of Jamaican and St Lucian descent. He rose through comedy clips on social media from 2017, co-hosted The Big Narstie Show, hosted The Lateish Show with Mo Gilligan on Channel 4, and has judged The Masked Singer UK since 2020."
  ur: "موسایا بکیلا گلیگن (پیدائش 19 فروری 1988)، جو مو گلیگن کے نام سے معروف ہیں، برطانوی اسٹینڈ اپ مزاح نگار اور ٹیلی ویژن پیش کار ہیں، جو لندن کے لیمبیتھ میں جمیکا اور سینٹ لوسیا نژاد والدین کے ہاں پیدا ہوئے۔ وہ 2017 سے سوشل میڈیا پر مزاحیہ کلپس سے مشہور ہوئے، «دی بگ نارسٹی شو» کی مشترکہ میزبانی کی، چینل 4 پر اپنا پروگرام «دی لیٹش شو» پیش کیا، اور 2020 سے «دی ماسکڈ سنگر» برطانیہ کے ججوں میں شامل ہیں۔"

