summary:
  ar: "الكندي الذي ولاه قباذ بن فيروز الحيرة بعد عزل المنذر بن ماء السماء، لأنه أجاب دعوة قباذ إلى المذهب المزدكي؛ فلما ملك كسرى أنوشروان وقتل مزدك أعاد المنذر وطلب الحارث، فأفلت إلى ديار كلب فبقي فيهم حتى مات، في رواية الرحيق المختوم."
  en: "The Kindite whom Qubadh ibn Firuz installed at al-Hira after dismissing al-Mundhir ibn Ma' al-Sama', because he had accepted Qubadh's Mazdakite doctrine; when Khosrow Anushirvan killed Mazdak and restored al-Mundhir he sought al-Harith, who escaped to the land of Kalb and remained there until his death, in al-Raheeq al-Makhtum's account."
  fr: "Kindite que Qubadh ibn Firuz installa à al-Hira après avoir destitué al-Mundhir ibn Ma’ al-Sama’, parce qu’il avait accepté la doctrine mazdakite de Qubadh ; lorsque Khosrow Anushirvan tua Mazdak et rétablit al-Mundhir, il rechercha al-Harith, qui s’enfuit au pays des Kalb et y demeura jusqu’à sa mort, selon le récit d’Al-Rahiq al-Makhtum."
  es: "El Kindite a quien Qubadh ibn Firuz instaló en al-Hira después de destituir a al-Mundhir ibn Ma' al-Sama', porque había aceptado la doctrina mazdakita de Qubadh; cuando Khosrow Anushirvan mató a Mazdak y restituyó a al-Mundhir buscó a al-Harith, quien escapó a la tierra de Kalb y permaneció allí hasta su muerte, según el relato de al-Raheeq al-Makhtum."
