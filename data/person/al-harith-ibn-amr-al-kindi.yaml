  ar: "الكندي الذي ولاه قباذ بن فيروز الحيرة بعد عزل المنذر بن ماء السماء، لأنه أجاب دعوة قباذ إلى المذهب المزدكي؛ فلما ملك كسرى أنوشروان وقتل مزدك أعاد المنذر وطلب الحارث، فأفلت إلى ديار كلب فبقي فيهم حتى مات، في رواية الرحيق المختوم."
  en: "The Kindite whom Qubadh ibn Firuz installed at al-Hira after dismissing al-Mundhir ibn Ma' al-Sama', because he had accepted Qubadh's Mazdakite doctrine; when Khosrow Anushirvan killed Mazdak and restored al-Mundhir he sought al-Harith, who escaped to the land of Kalb and remained there until his death, in al-Raheeq al-Makhtum's account."
