summary:
  ar: "قاد الحملة الاستطلاعية إلى الأندلس، وذكر الكتاب أنها كانت خمسمائة جندي منهم مئة فارس، وأنه مسلم من البربر، وعبرت من سبتة في رمضان سنة 91هـ (تموز 710م)، ونزلت قرب جزيرة عُرفت فيما بعد باسمه، وجالت في المنطقة وأرسلت جماعات إلى جبل طارق وغيره، فكانت معلوماتها أساساً لخطة الفتح {cite:salabi-umayyad-state-2020 p.67}."
