  id: "Dari Kharijit Yaman, ia memasuki Mekah dan Madinah bersama Abu Hamza al-Mukhtar ibn Awf pada tahun 129 H, memanggil Abdullah ibn Yahya al-Kindi. Ia tewas di Wadi al-Qura ketika bertemu dengan pasukan Marwan yang dipimpin oleh Abd al-Malik ibn Muhammad ibn Atiyah {cite:muruj-al-dhahab, hlm. 228-229}."
