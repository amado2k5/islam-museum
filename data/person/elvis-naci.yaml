summary:
  ar: "عالم دين وإمام ألباني (المولود 1977 في تيرانا)، مدير سابق للدعوة الإسلامية في المشيخة الإسلامية في ألبانيا وواعظ في جامع الطبّاق في تيرانا، ومؤسس مؤسسة فردوس الثقافية غير الربحية التي جمعت نداءاتها بعد زلزال 2019 أكثر من سبعة ملايين يورو؛ يتابع صفحته على فيسبوك أكثر من 1.4 مليون شخص."
  en: "Albanian theologian and imam (born 1977 in Tirana), formerly director of Islamic preaching at the Islamic Community of Albania and preacher at Tirana's Tabak (Tanners') Mosque, and founder of the Firdeus Non-Profit Cultural Foundation, whose appeals after the 2019 earthquake raised over €7 million; his Facebook page counts over 1.4 million followers."
  ur: "ایلوس ناچی (پیدائش 1977ء، تیرانا) البانوی عالمِ دین اور امام ہیں، البانیا کی اسلامی کمیونٹی میں اسلامی دعوت کے سابق ڈائریکٹر اور تیرانا کی طباق مسجد کے واعظ، اور فردوس فاؤنڈیشن کے بانی، جس کی 2019ء کے زلزلے کے بعد کی اپیلوں میں سات ملین یورو سے زائد رقم جمع ہوئی؛ ان کے فیس بک صفحے کے فالوورز چودہ لاکھ سے زائد ہیں۔"
