summary:
  ar: "أبو الحسن الخير بن محمد بن سهل الأنصاري الأندلسي البلنسي المحدث؛ رحل إلى المشرق وسافر في التجارة إلى الصين وكان فقيهاً عالماً متقناً سمع أبا عبد الله النعالي وطراد بن محمد وطائفة وسكن أصبهان مدة ثم بغداد وتفقه على الغزالي وتوفي في المحرم سنة إحدى وأربعين وخمسمائة {cite:shadharat-dhahab p. 608-609}."
  en: "Abu al-Hasan al-Khayr ibn Muhammad ibn Sahl al-Ansari of Valencia, the muhaddith; he journeyed east and travelled in trade as far as China — a precise jurist-scholar who heard Abu Abdallah al-Nu'ali, Tirad ibn Muhammad and others, dwelt a while at Isfahan then Baghdad, read fiqh under al-Ghazali, and died in Muharram 541 {cite:shadharat-dhahab p. 608-609}."
