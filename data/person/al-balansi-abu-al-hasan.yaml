summary:
  ar: "أبو الحسن الخير بن محمد بن سهل الأنصاري الأندلسي البلنسي المحدث؛ رحل إلى المشرق وسافر في التجارة إلى الصين وكان فقيهاً عالماً متقناً سمع أبا عبد الله النعالي وطراد بن محمد وطائفة وسكن أصبهان مدة ثم بغداد وتفقه على الغزالي وتوفي في المحرم سنة إحدى وأربعين وخمسمائة {cite:shadharat-dhahab p. 608-609}."
  en: "Abu al-Hasan al-Khayr ibn Muhammad ibn Sahl al-Ansari of Valencia, the muhaddith; he journeyed east and travelled in trade as far as China — a precise jurist-scholar who heard Abu Abdallah al-Nu'ali, Tirad ibn Muhammad and others, dwelt a while at Isfahan then Baghdad, read fiqh under al-Ghazali, and died in Muharram 541 {cite:shadharat-dhahab p. 608-609}."
  fr: "Abu al-Hasan al-Khayr ibn Muhammad ibn Sahl al-Ansari de Valence, traditionniste ; il voyagea en Orient et commerça jusqu’en Chine — savant juriste précis, il entendit notamment Abu Abdallah al-Nu’ali et Tirad ibn Muhammad, séjourna à Ispahan puis Bagdad, étudia le fiqh auprès d’al-Ghazali et mourut en muharram 541 H {cite:shadharat-dhahab p. 608-609}."
  es: "Abu al-Hasan al-Khayr ibn Muhammad ibn Sahl al-Ansari de Valencia, el muhaddith; viajó hacia el este y se dedicó al comercio hasta China; un jurista y erudito preciso que escuchó a Abu Abdallah al-Nu'ali, Tirad ibn Muhammad y otros, vivió un tiempo en Isfahán y luego en Bagdad, estudió fiqh con al-Ghazali y murió en Muharram 541 {cite:shadharat-dhahab p. 608-609}."
  ur: "ابو الحسن الخیر بن محمد بن سہل الانصاری والنسیا، محدث؛ اس نے مشرق کا سفر کیا اور تجارت میں چین تک کا سفر کیا - ایک قطعی فقیہہ جس نے ابو عبداللہ النعلی، تراد ابن محمد اور دیگر کو سنا، کچھ عرصہ اصفہان پھر بغداد میں مقیم رہے، الغزالی کے تحت فقہ پڑھی، اور محرم 541 میں وفات پائی۔ 608-609}۔"
  tr: "Hadis âlimi Ebu el-Hasan el-Hayr ibn Muhammed ibn Sahl el-Ensari el-Endülüs el-Belansi; Doğu'ya seyahat etmiş ve ticaret amacıyla Çin'e gitmiştir. Bilgili ve yetenekli bir fıkıhçıydı. Ebu Abdullah el-Na'ali, Tarad ibn Muhammed ve bir grup başkasından ilim öğrenmiştir. Bir süre İsfahan'da, daha sonra Bağdat'ta yaşamış ve Gazali'nin yanında fıkıh eğitimi almıştır. Hicri 541 yılının Muharrem ayında vefat etmiştir. {Kaynak: Şadharat-Dhaba s. 608-609}"
  id: "Abu al-Hasan al-Khayr ibn Muhammad ibn Sahl al-Ansari al-Andalusi al-Balansi, seorang ulama hadits; beliau melakukan perjalanan ke Timur dan berdagang ke Tiongkok. Beliau adalah seorang ahli hukum yang berilmu dan berpengalaman. Beliau belajar dari Abu Abdullah al-Na’ali, Tarad ibn Muhammad, dan sekelompok ulama lainnya. Beliau tinggal di Isfahan untuk sementara waktu, kemudian di Baghdad, dan mempelajari ilmu hukum di bawah bimbingan al-Ghazali. Beliau wafat pada bulan Muharram tahun 541 Hijriah. {cite:shadharat-dhahab hlm. 608-609}."
