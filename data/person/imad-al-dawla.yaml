  ar: "عماد الدولة أبو الحسن علي بن بويه الديلمي، أكبر إخوته أصحاب الدولة البويهية؛ مات بشيراز في جمادى الآخرة سنة 338هـ وكانت علته التي مات بها قرحة في كليته، فاضطرب جيشه بفارس وكتب معز الدولة إلى الصيمري بالمبادرة إلى شيراز لإصلاح الأمور بها {cite:kamil-ibn-al-athir p. 366}."
  en: "Imad al-Dawla Abu'l-Hasan Ali ibn Buwayh, eldest of the three Buyid brothers; he died at Shiraz in Jumada II 338 of a kidney ulcer, and his army's disorder drew the vizier al-Saymari from the marsh war {cite:kamil-ibn-al-athir p. 366}."
