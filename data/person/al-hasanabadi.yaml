label: { ar: "الحسناباذي", en: "Al Hasanabadi", es: "Al Hasanabadi", fr: "Al Hasanabadi", ur: "الحسن آبادی" }
summary:
  ar: "الحسناباذي رآه ابن النديم وكان يمضي إليه في جملة أصحابه وكان ينزل بناحية بين القصرين وكان ظريف العمل عجيب المغنى في عبارته وكلامه وما يورده، وخرج إلى أذربيجان لأمر لحقه ببغداد بعد نفى الشير مدي الديلمي فإنه كان يميل به {cite:fihrist-ibn-al-nadim p. 269}."
  en: "Al-Hasanabadi — the elegant da'i Ibn al-Nadim knew personally {cite:fihrist-ibn-al-nadim}"
  es: "Al-Hasanabadi — el elegante da'i que Ibn al-Nadim conoció personalmente {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Hasanabadi — l'élégant da'i qu'Ibn al-Nadim connaissait personnellement {cite:fihrist-ibn-al-nadim}"
  ur: "الحسن آبادی - خوبصورت داعی ابن الندیم کو ذاتی طور پر جانتے تھے"
  tr: "El-Hasan Abadi onu İbn el-Nadim tarafından görmüş ve yoldaşları arasında ziyaret etmişti. İki saray arasında bir bölgede kalıyordu. Çalışmasında espriliydi, ifadesi, konuşması ve aktardıklarında dikkat çekiciydi. El-Şir Madi el-Daylami'yi sürgün ettikten sonra Azerbaycan'a gidip Bağdat'ta onu takip etti, çünkü ona karşı eğilimliydi {atıf:Fihrist-ibn-al-Nadim s. 269}."
  id: "Al-Hasan Abadi melihatnya bersama Ibn al-Nadim dan sering mengunjunginya di antara teman-temannya. Ia tinggal di wilayah antara kedua istana. Ia cerdas dalam pekerjaannya dan luar biasa dalam ekspresi, ucapan, dan apa yang disampaikan. Ia pergi ke Azerbaijan untuk mengikutinya di Baghdad setelah mengasingkan al-Shir Madi al-Daylami, karena ia cenderung kepadanya {cite:fihrist-ibn-al-nadim hlm. 269}."
