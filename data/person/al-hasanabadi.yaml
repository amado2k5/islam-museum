summary:
  ar: "الحسناباذي رآه ابن النديم وكان يمضي إليه في جملة أصحابه وكان ينزل بناحية بين القصرين وكان ظريف العمل عجيب المغنى في عبارته وكلامه وما يورده، وخرج إلى أذربيجان لأمر لحقه ببغداد بعد نفى الشير مدي الديلمي فإنه كان يميل به {cite:fihrist-ibn-al-nadim p. 269}."
  en: "Al-Hasanabadi — the elegant da'i Ibn al-Nadim knew personally {cite:fihrist-ibn-al-nadim}"
