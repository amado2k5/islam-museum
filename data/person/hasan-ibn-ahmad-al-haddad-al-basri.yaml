summary:
  ar: "القاضي أبو محمد الحسن بن أحمد المعروف بالحداد البصري، أحد فقهاء الشافعية، لم يذكر الشيرازي على من درس ولا وقت وفاته، وذكر أنه رأى له كتاباً في أدب القضاء يدل على فضل كثير {cite:tabaqat-fuqaha-abbas-1981 p. 63}. ليس هو ابن الحداد المصري (person/ibn-al-haddad-al-misri)."
  tr: "Şafii hukukçularından biri olan Hakim Ebu Muhammed el-Hasan ibn Ahmed, el-Haddad el-Basri olarak bilinir, üzerinde çalıştığı el-Şirazi hakkında veya ölüm zamanından bahsetmemiş, ancak yargı görgü kuralları üzerine büyük bir erdemini belgeleyen bir kitabını gördüğünü belirtmiştir {atıf:tabaqat-fuqaha-abbas-1981, s. 63}. O, el-Haddad el-Masri'nin (kişi/ibn-al-haddad-al-misri) oğlu değildir."
  id: "Hakim Abu Muhammad al-Hasan ibn Ahmad, yang dikenal sebagai al-Haddad al-Basri, salah satu ahli hukum Shafi'i, tidak menyebutkan al-Shirazi tentang siapa ia belajar atau waktu kematiannya, melainkan menyebutkan bahwa ia melihat sebuah bukunya tentang etiket peradilan yang membuktikan jasa besarnya {cite:tabaqat-fuqaha-abbas-1981, hlm. 63}. Ia bukan putra al-Haddad al-Masri (orang/ibn-al-haddad-al-misri)."
