summary:
  ar: "استولى على خراسان وكرمان وسجستان سنة سبع وستين وعزم على قصد العراق وضرب السكة باسمه وعلى الوجه الآخر اسم المعتمد ثم إنه في آخر السنة قتله غلمانه {cite:tarikh-khulafa-minhaj-1434 p. 566}."
  en: "Seized Khurasan, Kirman and Sijistan in 267, resolved on Iraq and struck coin in his name with al-Mu'tamid's on the reverse — his own ghilman killed him by year's end {cite:tarikh-khulafa-minhaj-1434 p. 566}."
  es: "Se apoderó de Jorasán, Kirmán y Sijistán en 267, decidió conquistar Irak y acuñó monedas con su nombre y el de al-Mu'tamid en el reverso; su propio ghilman lo mató antes de que terminara el año {cite:tarikh-khulafa-minhaj-1434 p. 566}."
  fr: "Il s'empara du Khorasan, du Kirman et du Sijistan en 267, résolut de s'attaquer à l'Irak et frappa une pièce de monnaie à son nom avec celle d'al-Mu'tamid au revers — son propre ghilman le tua à la fin de l'année {cite:tarikh-khulafa-minhaj-1434 p. 566}."
  ur: "267 میں خراسان، کرمان اور سجستان پر قبضہ کیا، عراق پر فیصلہ کیا اور اس کے نام کا سکہ الٹے پر المتمید کے ساتھ مارا - اس کے اپنے غلمان نے سال کے آخر تک اسے قتل کر دیا۔ 566}۔"
