summary:
  ar: "صلاح الدين زركوب القونوي صائغ أمّي من مريدي جلال الدين الرومي، اختاره الرومي سنة 647هـ/1249م خليفةً له وقال إن شمس التبريزي ظهر له في صورته. شغل منصب النائب والخليفة نحو عشر سنين، وهو أول شيخ لمجلس الجماعة قرب مدرسة الرومي، وتوفي في أول المحرم 657هـ/29 كانون الأول 1258م {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
  en: "Salah al-Din Zarkub of Konya was an illiterate goldsmith and a disciple of Jalal al-Din Rumi, whom Rumi named his deputy in 647/1249, saying that Shams-i Tabrizi had appeared to him in his form. He served as deputy and khalifa for about ten years, is named as the first shaykh of the gathering-room beside Rumi's madrasa, and died on 1 Muharram 657/29 December 1258 {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
  ur: "صلاح الدین زرکوب قونوی ایک ان پڑھ سنار اور جلال الدین رومی کے مرید تھے جنہیں رومی نے 647ھ/1249ء میں اپنا نائب مقرر کیا اور کہا کہ شمس تبریزی ان کی صورت میں پھر ظاہر ہوئے ہیں۔ وہ تقریباً دس سال نائب و خلیفہ رہے، رومی کے مدرسے کے پاس جماعت خانے کے پہلے شیخ شمار ہوتے ہیں، اور یکم محرم 657ھ/29 دسمبر 1258ء کو فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
  es: "Salah al-Din Zarkub de Konya era un orfebre analfabeto y discípulo de Jalal al-Din Rumi, a quien Rumi nombró su lugarteniente en 647/1249, diciendo que Shams-i Tabrizi se le había aparecido en su forma. Sirvió como lugarteniente y califa durante unos diez años, es mencionado como el primer shaykh de la sala de reuniones junto a la madrasa de Rumi, y murió el 1 de Muharram de 657/29 de diciembre de 1258 {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
  fr: "Salah al-Din Zarkub de Konya était un orfèvre illettré et un disciple de Jalal al-Din Rumi, que ce dernier nomma son adjoint en 647/1249, affirmant que Shams-i Tabrizi lui était apparu sous cette forme. Il exerça les fonctions d'adjoint et de calife pendant une dizaine d'années, est mentionné comme le premier cheikh de la salle de réunion attenante à la madrasa de Rumi, et mourut le 1er Muharram 657/29 décembre 1258 (encyclopédie de l'islam, vol. 2, p. 419)."
  tr: "Salah al-Din Zarkub al-Qunawi, okuma yazma bilmeyen bir kuyumcu ve Celaleddin el-Rumi'nin öğrencisiydi; el-Rumi'yi 647 H/1249 M.S. halefi olarak seçti ve Şems el-Tebrizi'nin kendisine kendi suretinde göründüğünü söyledi. Yaklaşık on yıl boyunca vekil ve halife olarak görev yaptı, el-Rumi'nin okulunun yakınındaki cemaat meclisinin ilk şeyhiydi ve Muharrem 657 Hicri / 29 Aralık 1258 M.S. 1'de vefat etti {atıf:İslam Ansiklopedisi-2 cilt 2, s. 419}."
  id: "Salah al-Din Zarkub al-Qunawi, seorang tukang perhiasan buta huruf dan murid Jalal al-Din al-Rumi, yang dipilih al-Rumi sebagai penerusnya pada tahun 647 H/1249 M, dan mengatakan bahwa Shams al-Tabrizi muncul kepadanya dalam gambarnya. Ia menjabat sebagai wakil dan khalifah selama sekitar sepuluh tahun, menjadi sheikh pertama dewan komunitas dekat sekolah al-Rumi, dan meninggal pada tanggal 1 Muharram 657 H / 29 Desember 1258 M {cite:Encyclopaedia-of-Islam-2 vol. 2, hlm. 419}."
