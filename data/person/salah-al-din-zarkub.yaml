id: person/salah-al-din-zarkub
class: person
label: { ar: "صلاح الدين زركوب", en: "Salah al-Din Zarkub", ur: "صلاح الدین زرکوب" }
aliases: ["Salah al-Din Zarkub of Konya", "Salah Zarkub", "Salah al-Din the goldsmith", "صلاح الدين زركوب القونوي", "صلاح الدين الصائغ"]
summary:
  ar: "صلاح الدين زركوب القونوي صائغ أمّي من مريدي جلال الدين الرومي، اختاره الرومي سنة 647هـ/1249م خليفةً له وقال إن شمس التبريزي ظهر له في صورته. شغل منصب النائب والخليفة نحو عشر سنين، وهو أول شيخ لمجلس الجماعة قرب مدرسة الرومي، وتوفي في أول المحرم 657هـ/29 كانون الأول 1258م {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
  en: "Salah al-Din Zarkub of Konya was an illiterate goldsmith and a disciple of Jalal al-Din Rumi, whom Rumi named his deputy in 647/1249, saying that Shams-i Tabrizi had appeared to him in his form. He served as deputy and khalifa for about ten years, is named as the first shaykh of the gathering-room beside Rumi's madrasa, and died on 1 Muharram 657/29 December 1258 {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
  ur: "صلاح الدین زرکوب قونوی ایک ان پڑھ سنار اور جلال الدین رومی کے مرید تھے جنہیں رومی نے 647ھ/1249ء میں اپنا نائب مقرر کیا اور کہا کہ شمس تبریزی ان کی صورت میں پھر ظاہر ہوئے ہیں۔ وہ تقریباً دس سال نائب و خلیفہ رہے، رومی کے مدرسے کے پاس جماعت خانے کے پہلے شیخ شمار ہوتے ہیں، اور یکم محرم 657ھ/29 دسمبر 1258ء کو فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
