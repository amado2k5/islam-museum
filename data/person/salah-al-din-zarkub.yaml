kids:
  ar: "صلاح الدين كان صائغاً بسيطاً أحبّه الرومي وجعله قائد مريديه، لأنه رأى فيه نوراً طيباً."
  en: "Salah al-Din was a simple goldsmith whom Rumi loved and trusted so much that he made him leader of his followers."
