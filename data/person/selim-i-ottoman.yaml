label: { ar: "السلطان سليم شاه بن عثمان" }
summary:
  ar: "سلطان الدولة العثمانية، وصفه تلميذ السيوطي جرامرد الناصري بأنه فتنة المئة التاسعة لحروبه مع إخوته وقتله إياهم وأولادهم ثم حروبه صاحب الشرق وكسره إياه وقتله علي دولات وأخذه بلاده ثم اجتماعه بعسكر مصر على مرج دابق وقتله سلطانها قانصوه الغوري وأكابر أمرائها ثم دخوله مصر، فقال لم نر في التواريخ ولا سمعنا أن مصر من حين صارت دار الإسلام أصيبت بمثل هذه المصيبة {cite:tarikh-khulafa-minhaj-1434 p. 798}. وذكر ابن العماد أنه ولد بآماسية سنة خمس وسبعين وثمانمائة وجلس على السلطنة بعد أن نازع أباه بايزيد وهو ابن ست وأربعين سنة، وأنه قاتل طومان باي الثاني بالريدانية قتالاً شديداً ثم أراد تكريمه وولايته مصر فخاف خير بك عاقبة ذلك فحسّن له قتله فصُلب بباب زويلة، وأقام سليم بالمقياس مدة وولّى خير بك أمير الأمراء على مصر والغزالي على الشام وأبقى القضاة الأربعة والأوقاف على حالها، ثم عاد إلى القسطنطينية فظهرت في إبطه جمرة عجز عنها الأطباء فتوفي بعد علة نحو أربعين يوماً ودُفن عند قبر أبيه {cite:shadharat-dhahab p. 559-561}."
  en: "The Ottoman sultan whom Suyuti's student calls the ninth century's calamity — killer of his brothers, breaker of the East's lord, victor at Marj Dabiq over sultan Qansuh al-Ghawri, then swift conqueror of Egypt {cite:tarikh-khulafa-minhaj-1434 p. 798}."
