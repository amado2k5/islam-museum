label: { ar: "السلطان سليم شاه بن عثمان" , ur: "سلیم اول", en: "Selim I", es: "Selim I", fr: "Selim I"}
summary:
  ar: "سلطان الدولة العثمانية، وصفه تلميذ السيوطي جرامرد الناصري بأنه فتنة المئة التاسعة لحروبه مع إخوته وقتله إياهم وأولادهم ثم حروبه صاحب الشرق وكسره إياه وقتله علي دولات وأخذه بلاده ثم اجتماعه بعسكر مصر على مرج دابق وقتله سلطانها قانصوه الغوري وأكابر أمرائها ثم دخوله مصر، فقال لم نر في التواريخ ولا سمعنا أن مصر من حين صارت دار الإسلام أصيبت بمثل هذه المصيبة {cite:tarikh-khulafa-minhaj-1434 p. 798}. وذكر ابن العماد أنه ولد بآماسية سنة خمس وسبعين وثمانمائة وجلس على السلطنة بعد أن نازع أباه بايزيد وهو ابن ست وأربعين سنة، وأنه قاتل طومان باي الثاني بالريدانية قتالاً شديداً ثم أراد تكريمه وولايته مصر فخاف خير بك عاقبة ذلك فحسّن له قتله فصُلب بباب زويلة، وأقام سليم بالمقياس مدة وولّى خير بك أمير الأمراء على مصر والغزالي على الشام وأبقى القضاة الأربعة والأوقاف على حالها، ثم عاد إلى القسطنطينية فظهرت في إبطه جمرة عجز عنها الأطباء فتوفي بعد علة نحو أربعين يوماً ودُفن عند قبر أبيه {cite:shadharat-dhahab p. 559-561}."
  en: "The Ottoman sultan whom Suyuti's student calls the ninth century's calamity — killer of his brothers, breaker of the East's lord, victor at Marj Dabiq over sultan Qansuh al-Ghawri, then swift conqueror of Egypt {cite:tarikh-khulafa-minhaj-1434 p. 798}. Al-Salabi adds his love of Persian poetry and history, his taking historians and poets to the field, the dervish-rag embassy to Shah Ismail before Chaldiran, his argument that the Safavid threat — not western 'satiation' — turned the state east, and his use of the title 'khalifa of God through the earth's length and breadth' from 920/1514, before Syria and Egypt fell — the book's case against the later story of a caliphate surrendered by the last Abbasid of Cairo {cite:dawlat-uthmaniyya-salabi p. 175-190}."
  ur: "عثمانی سلطان جس کے عہد میں چالدران، مرج دابق اور ریدانیہ کی جنگیں ہوئیں، اور مصر و حجاز عثمانی اقتدار سے وابستہ ہوئے۔ {cite:tarikh-khulafa-minhaj-1434}"
  es: "El sultán otomano al que el estudiante de Suyuti llama la calamidad del siglo IX: asesino de sus hermanos, destructor del señor de Oriente, vencedor en Marj Dabiq sobre el sultán Qansuh al-Ghawri, luego rápido conquistador de Egipto {cite:tarikh-khulafa-minhaj-1434 p. 798}. Al-Salabi añade su amor por la poesía y la historia persas, su llevar a historiadores y poetas al campo, la embajada derviche-trag al Shah Ismail antes de Chaldiran, su argumento de que la amenaza safávida —no la 'saciedad' occidental— hizo girar el estado hacia el este, y su uso del título 'califa de Dios a través de la longitud y anchura de la tierra' desde 920/1514, antes de que cayeran Siria y Egipto: el caso del libro contra la historia posterior de un califato entregado por el último abasí de El Cairo {cite:dawlat-uthmaniyya-salabi p. 175-190}."
  fr: "Le sultan ottoman que l'élève de Suyuti qualifie de calamité du IXe siècle – meurtrier de ses frères, briseur du seigneur de l'Orient, vainqueur à Marj Dabiq contre le sultan Qansuh al-Ghawri, puis conquérant rapide de l'Égypte {cite:tarikh-khulafa-minhaj-1434 p. 798}. Al-Salabi ajoute son amour de la poésie et de l'histoire persanes, son implication auprès des historiens et des poètes sur le terrain, l'ambassade de chiffons de derviches auprès du Shah Ismaïl avant Chaldiran, son argument selon lequel la menace safavide – et non la « satiété » occidentale – a orienté l'État vers l'Est, et son utilisation du titre de « calife de Dieu sur toute la longueur et la largeur de la terre » à partir de 920/1514, avant la chute de la Syrie et de l'Égypte – autant d'arguments que le livre réfute contre le récit ultérieur d'un califat capitulé par le dernier Abbasside du Caire {cite:dawlat-uthmaniyya-salabi p. 175-190}."
