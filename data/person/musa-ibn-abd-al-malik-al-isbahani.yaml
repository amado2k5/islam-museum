died: { edtf: "0860", hijri: "0246", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي في شوال سنة ست وأربعين ومائتين {cite:wafayat-ayan}." }
summary:
  ar: "أبو عمران موسى بن عبد الملك بن هشام الأصبهاني، صاحب ديوان الخراج؛ كان من جلة الرؤساء وفضلاء الكتاب وأعيانهم، تنقل في الخدم في أيام جماعة من الخلفاء، وكان إليه ديوان السواد وغيره في أيام المتوكل، وكان مترسلاً له دواوين رسائل وقصائد؛ ومن أخباره قصة جاريته التي غنت أبياته لما وردنا القادسية في قافلة الحاج ثم اختفت فلم يُحس لها أثراً وبقي ذاكراً لها واجماً عليها؛ وتوفي في شوال سنة ست وأربعين ومائتين {cite:wafayat-ayan}."
  en: "Musa b. Abd al-Malik al-Isbahani (d. Shawwal 246) — chief of the kharaj divan under several caliphs, eloquent epistolist and poet, remembered for the story of the singing-girl lost to him at al-Qadisiyya {cite:wafayat-ayan}."
  es: "Musa b. Abd al-Malik al-Isbahani (m. Shawwal 246) — jefe del kharaj divan bajo varios califas, elocuente epistolar y poeta, recordado por la historia de la cantante que perdió en al-Qadisiyya {cite:wafayat-ayan}."
  fr: "Musa b. Abd al-Malik al-Isbahani (d. Shawwal 246) — chef du kharaj divan sous plusieurs califes, épistolier et poète éloquent, connu pour l'histoire de la jeune fille chanteuse perdue pour lui à al-Qadisiyya {cite:wafayat-ayan}."
  ur: "موسیٰ بی۔ عبد الملک الصبہانی ⁦(متوفی شوال 246)⁩ - کئی خلفاء کے تحت خرج دیوان کا سربراہ، فصیح خطیب اور شاعر، جو اس گانے والی لڑکی کی کہانی کے لیے یاد کرتا ہے جو القدسیہ میں اس سے ہار گئی تھی۔"
  tr: "Diwan al-Kharaj'ın sahibi Ebu İmran Musa bin Abd al-Malik ibn Hisham al-Isfahani; seçkin liderler, seçkin yazarlar ve önemli şahsiyetler arasındaydı. Halifelerin döneminde hizmet etti ve el-Mutevakkil döneminde Diwan al-Sawad ve diğerlerini bulundurdu. Ayrıca mektup ve şiir derlemeleri gönderildi. Raporları arasında, hacı kervanında el-Kadisiyyah'a vardığımızda onun dizelerini söyleyen hizmetkarının hikayesi de var, ancak ortadan kayboldu, hiçbir iz bırakmadı ve onu derinden hatırladı. 246 Hile yılında Şevval'de öldü."
  id: "Abu Imran Musa ibn Abd al-Malik ibn Hisham al-Isfahani, pemilik Diwan al-Kharaj; ia termasuk di antara pemimpin terkemuka, penulis terkemuka, dan tokoh terkemuka. Ia bertugas selama masa sekelompok khalifah, dan memiliki Diwan al-Sawad serta lainnya pada masa al-Mutawakkil. Ia juga menerima kumpulan surat dan puisi. Di antara laporannya adalah kisah pelayannya yang menyanyikan puisinya saat kami tiba di al-Qadisiyyah dalam karavan peziarah, namun kemudian menghilang, tidak meninggalkan jejak kehadirannya, dan ia tetap sangat teringat akan dirinya. Ia meninggal di Shawwal pada tahun 246 H."
