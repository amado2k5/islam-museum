summary:
  ar: "أبو عمران موسى بن عبد الملك بن هشام الأصبهاني، صاحب ديوان الخراج؛ كان من جلة الرؤساء وفضلاء الكتاب وأعيانهم، تنقل في الخدم في أيام جماعة من الخلفاء، وكان إليه ديوان السواد وغيره في أيام المتوكل، وكان مترسلاً له دواوين رسائل وقصائد؛ ومن أخباره قصة جاريته التي غنت أبياته لما وردنا القادسية في قافلة الحاج ثم اختفت فلم يُحس لها أثراً وبقي ذاكراً لها واجماً عليها؛ وتوفي في شوال سنة ست وأربعين ومائتين {cite:wafayat-ayan}."
  en: "Musa b. Abd al-Malik al-Isbahani (d. Shawwal 246) — chief of the kharaj divan under several caliphs, eloquent epistolist and poet, remembered for the story of the singing-girl lost to him at al-Qadisiyya {cite:wafayat-ayan}."
