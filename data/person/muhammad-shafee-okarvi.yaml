summary:
  ar: "عالم وخطيب باكستاني (1930–1984) من خيم كاران في البنجاب، هاجر إلى أوكارا سنة 1947 ثم استقر خطيباً في كراتشي. كان من مؤسسي جماعة أهل السنة في باكستان وأول رئيس لها، وأسس الجامعة الحنفية أشرف المدارس في أوكارا، وألقى أكثر من 18,000 خطاب في 38 عاماً، ونال وسام الامتياز (ستارة امتياز) بعد وفاته سنة 1985."
  en: "Pakistani scholar and orator (1930–1984) of Khem Karan in Punjab, who migrated to Okara in 1947 and settled as a preacher in Karachi. He was one of the founders of Jamaat Ahle Sunnat Pakistan and its first chairman, founded the Jamia Hanafiyya Ashraf-ul-Madaris at Okara, delivered over 18,000 speeches in 38 years, and was awarded the Sitara-i-Imtiaz posthumously in 1985."
  ur: "پاکستانی عالم اور خطیب (1930ء–1984ء) جن کا تعلق کھیم کرن، پنجاب سے تھا، 1947ء میں اوکاڑہ ہجرت کی اور پھر کراچی میں خطیب کی حیثیت سے آباد ہوئے۔ جماعت اہلِ سنت پاکستان کے بانیان اور اس کے پہلے چیئرمین تھے، اوکاڑہ میں جامعہ حنفیہ اشرف المدارس قائم کیا، 38 برس میں 18,000 سے زائد خطابات کیے اور 1985ء میں بعد از وفات ستارۂ امتیاز سے نوازے گئے۔"
