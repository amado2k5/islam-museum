summary:
  ar: "عاصم إعجاز خواجة اقتصادي باكستاني أمريكي وُلد في لندن لأبوين طبيبين من أصل كشميري، ونشأ في نيجيريا ثم باكستان، وتعلّم في معهد ماساتشوستس للتكنولوجيا وجامعة هارفارد، وهو أستاذ التمويل الدولي والتنمية (كرسي سوميتومو-فاسيد) في كلية كينيدي بجامعة هارفارد ومدير مركز التنمية الدولية فيها. شارك في تأسيس مركز البحوث الاقتصادية في باكستان، واستقال سنة 2018 من المجلس الاستشاري الاقتصادي الباكستاني احتجاجا على إقالة عاطف ميان."
  en: "Asim Ijaz Khwaja is a British-born Pakistani-American economist who serves as the Sumitomo-FASID Professor of International Finance and Development at Harvard Kennedy School and as director of Harvard's Center for International Development. Born in London to physician parents of Kashmiri descent, raised in Nigeria and Pakistan and educated at MIT and Harvard, he joined Harvard's faculty in 2001, co-founded the Center for Economic Research in Pakistan, and in 2018 resigned from Pakistan's Economic Advisory Council in protest at the removal of Atif Mian."
  ur: "عاصم اعجاز خواجہ ایک پاکستانی نژاد امریکی ماہر اقتصادیات ہیں جو لندن میں کشمیری نژاد طبیب والدین کے ہاں پیدا ہوئے، نائیجیریا اور پھر پاکستان میں پلے بڑھے، ایم آئی ٹی اور ہارورڈ سے تعلیم حاصل کی، اور ہارورڈ کینیڈی اسکول میں بین الاقوامی مالیات و ترقی کے سومیتومو۔فیسڈ پروفیسر اور ہارورڈ کے سینٹر فار انٹرنیشنل ڈویلپمنٹ کے ڈائریکٹر ہیں۔ انھوں نے پاکستان میں سینٹر فار اکنامک ریسرچ (CERP) کی بنیاد رکھنے میں حصہ لیا، اور 2018ء میں عاطف میاں کی برطرفی کے احتجاج میں پاکستان کی اقتصادی مشاورتی کونسل سے استعفیٰ دیا۔"
