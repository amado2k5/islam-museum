summary:
  ar: "عاصم إعجاز خواجة اقتصادي باكستاني أمريكي وُلد في لندن لأبوين طبيبين من أصل كشميري، ونشأ في نيجيريا ثم باكستان، وتعلّم في معهد ماساتشوستس للتكنولوجيا وجامعة هارفارد، وهو أستاذ التمويل الدولي والتنمية ⁦(كرسي سوميتومو-فاسيد)⁩ في كلية كينيدي بجامعة هارفارد ومدير مركز التنمية الدولية فيها. شارك في تأسيس مركز البحوث الاقتصادية في باكستان، واستقال سنة 2018 من المجلس الاستشاري الاقتصادي الباكستاني احتجاجا على إقالة عاطف ميان."
  en: "Asim Ijaz Khwaja is a British-born Pakistani-American economist who serves as the Sumitomo-FASID Professor of International Finance and Development at Harvard Kennedy School and as director of Harvard's Center for International Development. Born in London to physician parents of Kashmiri descent, raised in Nigeria and Pakistan and educated at MIT and Harvard, he joined Harvard's faculty in 2001, co-founded the Center for Economic Research in Pakistan, and in 2018 resigned from Pakistan's Economic Advisory Council in protest at the removal of Atif Mian."
  ur: "عاصم اعجاز خواجہ ایک پاکستانی نژاد امریکی ماہر اقتصادیات ہیں جو لندن میں کشمیری نژاد طبیب والدین کے ہاں پیدا ہوئے، نائیجیریا اور پھر پاکستان میں پلے بڑھے، ایم آئی ٹی اور ہارورڈ سے تعلیم حاصل کی، اور ہارورڈ کینیڈی اسکول میں بین الاقوامی مالیات و ترقی کے سومیتومو۔فیسڈ پروفیسر اور ہارورڈ کے سینٹر فار انٹرنیشنل ڈویلپمنٹ کے ڈائریکٹر ہیں۔ انھوں نے پاکستان میں سینٹر فار اکنامک ریسرچ (CERP) کی بنیاد رکھنے میں حصہ لیا، اور 2018ء میں عاطف میاں کی برطرفی کے احتجاج میں پاکستان کی اقتصادی مشاورتی کونسل سے استعفیٰ دیا۔"
  es: "Asim Ijaz Khwaja es un economista británico-estadounidense de origen paquistaní que ejerce como profesor Sumitomo-FASID de Finanzas y Desarrollo Internacionales en la Escuela Kennedy de Harvard y como director del Centro para el Desarrollo Internacional de Harvard. Nacido en Londres de padres médicos de ascendencia cachemir, se crió en Nigeria y Pakistán y se formó en el MIT y Harvard. Se unió al profesorado de Harvard en 2001, cofundó el Centro de Investigación Económica en Pakistán y, en 2018, dimitió del Consejo Asesor Económico de Pakistán en protesta por la destitución de Atif Mian."
  fr: "Asim Ijaz Khwaja est un économiste britannique d'origine pakistanaise et américaine. Il est professeur Sumitomo-FASID de finance internationale et de développement à la Harvard Kennedy School et directeur du Centre pour le développement international de Harvard. Né à Londres de parents médecins d'origine kashmiri, il a grandi au Nigeria et au Pakistan et a étudié au MIT et à Harvard. Il a rejoint la faculté de Harvard en 2001, a cofondé le Centre de recherche économique au Pakistan et, en 2018, a démissionné du Conseil consultatif économique du Pakistan pour protester contre la destitution d'Atif Mian."
  tr: "Asim Ijaz Khawaja, Keşmir kökenli doktorların çocuğu olarak Londra'da doğmuş Pakistan-Amerikalı bir ekonomisttir. Nijerya'da ve ardından Pakistan'da büyümüş, Massachusetts Teknoloji Enstitüsü ve Harvard Üniversitesi'nde eğitim görmüş, Harvard Kennedy Okulu'nda uluslararası finans ve kalkınma profesörü (Sumitomo-Fasid Kürsüsü) ve Uluslararası Kalkınma Merkezi'nin direktörüdür. Pakistan'da Ekonomik Araştırma Merkezi'nin kurucu ortaklarından olmuş ve Atif Mian'ın görevden alınmasına karşı protesto olarak 2018'de Pakistan Ekonomik Danışma Konseyi'nden istifa etmiştir."
  id: "Asim Ijaz Khawaja adalah seorang ekonom Pakistan-Amerika yang lahir di London dari keluarga dokter keturunan Kashmir. Ia tumbuh besar di Nigeria dan kemudian di Pakistan, belajar di Massachusetts Institute of Technology dan Harvard University, menjadi profesor keuangan dan pembangunan internasional (Sumitomo-Fasid Chair) di Harvard Kennedy School, serta direktur Center for International Development. Ia ikut mendirikan Economic Research Center di Pakistan dan mengundurkan diri pada tahun 2018 dari Pakistan Economic Advisory Council sebagai bentuk protes atas pemecatan Atif Mian."
