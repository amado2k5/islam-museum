summary:
  ar: "لاعب كرة قدم إيراني محترف (وُلد سنة 1992 في بوشهر). مهاجم برز مع برسيبوليس هدافًا للدوري الإيراني مرتين، ثم لعب لريو آفي وبورتو — حيث اختير هدفه المقصي ضد تشيلسي أجمل أهداف دوري الأبطال 2021 — وإنتر ميلان وأولمبياكوس قبل الوصل سنة 2026؛ دولي إيراني منذ 2015 شارك في ثلاث كؤوس عالم."
  en: "Iranian professional footballer (born 1992 in Bushehr). A striker who twice finished as the Iranian league's top scorer with Persepolis before playing for Rio Ave and Porto — where his bicycle kick against Chelsea was voted UEFA's goal of the season — Inter Milan and Olympiacos, joining Al Wasl in 2026; an Iran international since 2015 who played at three World Cups."
  ur: "ایرانی پیشہ ور فٹبالر (پیدائش 1992، بوشہر)۔ اسٹرائیکر جو پرسپولیس کے ساتھ دو بار ایرانی لیگ کے ٹاپ اسکورر رہے، پھر ریو آوے اور پورٹو کے لیے کھیلے — چیلسی کے خلاف ان کا بائیسکل کک گول یوئیفا کا سیزن گول قرار پایا — انٹر میلان اور اولمپیاکوس کے بعد 2026 میں الوصل میں شامل ہوئے؛ 2015 سے ایران کے بین الاقوامی کھلاڑی، تین ورلڈ کپ کھیلے۔"
