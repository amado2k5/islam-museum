summary:
  ar: "طبيب وعالم تركي أمريكي (مواليد 1962 في بازار بولاية ريزة)، أستاذ الوراثة والتمثيل الغذائي في كلية هارفارد للصحة العامة. نال شهادة الطب من جامعة أنقرة سنة 1986 والدكتوراه من كلية طب هارفارد سنة 1994، وأسس قسم الوراثة والأمراض المعقدة في هارفارد ورأسه ستة عشر عامًا. أثبتت أبحاثه أن الالتهاب المزمن منخفض الدرجة — ما سمّاه «الالتهاب الأيضي» — يقف وراء السمنة والسكري وأمراض الكبد الدهنية، وانتُخب سنة 2026 عضوًا في الأكاديمية الوطنية الأمريكية للعلوم."
  en: "Turkish-American physician-scientist (born 1962 at Pazar, Rize), James Stevens Simmons Professor of Genetics and Metabolism at the Harvard T.H. Chan School of Public Health. He took his medical degree at Ankara University in 1986 and his PhD at Harvard Medical School in 1994, founded Harvard's Department of Genetics and Complex Diseases and chaired it for sixteen years. His laboratory established that chronic low-grade inflammation — the 'metaflammation' he named — underlies obesity, diabetes and fatty liver disease, and in 2026 he was elected to the United States National Academy of Sciences."
  ur: "ترک نژاد امریکی طبیب و سائنس دان (پیدائش 1962ء، بازار، ریزے)، ہارورڈ ٹی ایچ چان اسکول آف پبلک ہیلتھ میں جینیٹکس اور میٹابولزم کے پروفیسر۔ 1986ء میں انقرہ یونیورسٹی سے طب کی ڈگری اور 1994ء میں ہارورڈ میڈیکل اسکول سے پی ایچ ڈی کیا؛ ہارورڈ کا شعبۂ جینیٹکس و پیچیدہ امراض قائم کیا اور سولہ برس اس کی صدارت کی۔ ان کی تجربہ گاہ نے ثابت کیا کہ دائمی خفیف سوزش — جسے انہوں نے «میٹا انفلامیشن» کا نام دیا — موٹاپے، ذیابیطس اور جگر کی چربی کی بیماری کی جڑ ہے؛ 2026ء میں وہ ریاستہائے متحدہ کی قومی اکیڈمی آف سائنسز کے رکن منتخب ہوئے۔"
