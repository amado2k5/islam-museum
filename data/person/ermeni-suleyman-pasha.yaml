label:
  ar: "سليمان باشا الأرمني"
  en: "Ermeni Süleyman Pasha"
  ur: "سليمان پاشا ارمنی"
summary:
  ar: "سليمان باشا الملقب «الأرمني» و«كوجا» (الكبير)؛ من أقارب إسماعيل آغا الملطي فلُقّب بذلك، تربى في القصر وصار ركابداراً، ثم أُعطي الوزارة وتولى أغاوية الإنكشارية في ذي الحجة ١٠٦٢هـ/نوفمبر ١٦٥٢م، أُقيل في ربيع الآخر ١٠٦٣هـ وأُرسل إلى كريت بسنجق ملطية، وفي ١٠٦٤هـ/١٦٥٤م استُدعي فصار وزيراً في الديوان {cite:sicill-i-osmani vol. 5, 'Süleyman Paşa (Koca)'}."
  en: "Süleyman Pasha, nicknamed 'the Armenian' and 'Koca' (the Great); a kinsman of İsmail Agha of Malatya whence the byname, palace-bred to rikâbdar, made vizier and agha of the Janissaries in Dhu'l-Hijja 1062/November 1652, dismissed in Rabīʿ II 1063 and sent to Crete with the sancak of Malatya, then recalled in 1064/1654 as a kubbe (dome) vizier {cite:sicill-i-osmani vol. 5, 'Süleyman Paşa (Koca)'}."
  ur: "سلیمان پاشا ملقب «ارمنی» اور «کوجا» (بڑا)؛ ملطیہ کے اسماعیل آغا کا رشتہ دار جس سے یہ عرفیت ملی، محل میں پلا اور رکابدار بنا، پھر وزارت پا کر ذی الحجہ ١٠٦٢ھ/نومبر ١٦٥٢ء میں ینی چریوں کا آغا ہوا، ربیع الثانی ١٠٦٣ھ میں معزول ہو کر ملطیہ کے سنجق کے ساتھ کریٹ بھیجا گیا، اور ١٠٦٤ھ/١٦٥٤ء میں واپس بلا کر قبہ وزیر بنا {cite:sicill-i-osmani vol. 5, 'Süleyman Paşa (Koca)'}."
