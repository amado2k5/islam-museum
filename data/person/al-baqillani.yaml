summary:
  ar: "القاضي أبو بكر محمد بن الطيب بن محمد بن جعفر الباقلاني البصري ⁦(ت ٤٠٣هـ/١٠١٣م)⁩، متكلم الأشاعرة وفقيه المالكية؛ وُلد بالبصرة وقضى أكثر عمره ببغداد، وأخذ علم الكلام عن أصحاب الأشعري ومنهم أبو عبد الله بن مجاهد الطائي، وكان أوحد زمانه في المناظرة حتى انتهت إليه الرياسة في مذهبه {cite:wafayat-ayan} {cite:shadharat-dhahab p. 169}. تولى القضاء مدة خارج بغداد، وزار شيراز، وحمل سنة ٣٦٩هـ/٩٨٠م جواب عضد الدولة إلى بلاط الروم {cite:encyclopaedia-of-islam-2 vol. 1 p. 233, 1018}. عدّه القاضي عياض في اثنين وخمسين مصنفاً بقيت منها ستة، منها «التمهيد» أقدم كتاب جدلي كامل في الكلام، و«الإنصاف»، و«إعجاز القرآن»؛ وقال ابن تيمية إنه «أفضل المتكلمين المنتسبين إلى الأشعري ليس فيهم مثله لا قبله ولا بعده» {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}."
  en: "The qadi Abu Bakr Muhammad ibn al-Tayyib ibn Muhammad ibn Ja'far al-Baqillani al-Basri (d. 403/1013), Ash'ari theologian and Maliki jurist. Born in Basra, he spent most of his adult life in Baghdad, learning kalam from al-Ash'ari's disciples, among them Abu Abd Allah ibn Mujahid al-Ta'i; unrivalled in his age in disputation, headship of the school devolved on him {cite:wafayat-ayan} {cite:shadharat-dhahab p. 169}. He held a qadi post outside Baghdad for a time, visited Shiraz, and in 369/980 carried Adud al-Dawla's reply to the Byzantine court {cite:encyclopaedia-of-islam-2 vol. 1 p. 233, 1018}. The qadi Iyad listed fifty-two works of his, of which six survive — including the Tamhid, the earliest complete manual of theological polemic, al-Insaf, and I'jaz al-Qur'an; Ibn Taymiyya called him 'the best of the mutakallimun attached to al-Ash'ari, with no equal before or after him' {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}."
  fr: "Le cadi Abu Bakr Muhammad ibn al-Tayyib ibn Muhammad ibn Ja’far al-Baqillani al-Basri (mort en 403 H/1013), théologien ash’arite et juriste malikite. Né à Bassora, il passa l’essentiel de sa vie adulte à Bagdad, apprenant le kalam des disciples d’al-Ash’ari, notamment Abu Abd Allah ibn Mujahid al-Ta’i ; sans égal en son temps dans le débat, il reçut la direction de l’école {cite:wafayat-ayan} {cite:shadharat-dhahab p. 169}. Il exerça un temps une charge de cadi hors de Bagdad, visita Chiraz et porta en 369 H/980 la réponse d’Adud al-Dawla à la cour byzantine {cite:encyclopaedia-of-islam-2 vol. 1 p. 233, 1018}. Le cadi Iyad répertoria cinquante-deux de ses œuvres, dont six subsistent — notamment le Tamhid, plus ancien manuel complet de polémique théologique, al-Insaf et I’jaz al-Qur’an ; Ibn Taymiyya l’appela « le meilleur des mutakallimun rattachés à al-Ash’ari, sans égal avant ni après lui » {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}."
  ur: "قاضی ابوبکر محمد بن الطیب بن محمد بن جعفر الباقلانی البصری ⁦(وفات 403ھ/1013ء)⁩، اشاعرہ کے متکلم اور مالکی فقیہ۔ بصرہ میں پیدا ہوئے اور بیشتر عمر بغداد میں گزاری؛ اشعری کے شاگردوں سے علم کلام پڑھا جن میں ابو عبد اللہ بن مجاہد طائی شامل ہیں؛ اپنے زمانے میں مناظرہ کے بے مثال ماہر، مذہب کی ریاست ان کے ہاتھ آئی {cite:wafayat-ayan} {cite:shadharat-dhahab p. 169}۔ کچھ عرصہ بغداد سے باہر قاضی رہے، شیراز گئے، اور 369ھ/980ء میں عضد الدولہ کا جواب دربار روم پہنچایا {cite:encyclopaedia-of-islam-2 vol. 1 p. 233, 1018}۔ قاضی عیاض نے ان کی باواں تصانیف گنوائیں جن میں چھ باقی ہیں — جدلی کلام کی پہلی مکمل کتاب «التمہید»، «الانصاف» اور «اعجاز قرآن»؛ ابن تیمیہ کے نزدیک وہ «اشعری سے منسوب متکلمین میں بہترین ہیں، نہ پہلے کوئی ان جیسا نہ بعد میں» {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}۔"
  es: "El cadí Abu Bakr Muhammad ibn al-Tayyib ibn Muhammad ibn Ja'far al-Baqillani al-Basri (m. 403/1013), teólogo ash'ari y jurista malikí. Nacido en Basora, pasó la mayor parte de su vida adulta en Bagdad, aprendiendo kalam de los discípulos de al-Ash'ari, entre ellos Abu Abd Allah ibn Mujahid al-Ta'i; sin rival en su época en la disputa, la dirección de la escuela recayó sobre él {cite:wafayat-ayan} {cite:shadharat-dhahab p. 169}. Ocupó un puesto de cadí fuera de Bagdad durante un tiempo, visitó Shiraz y en 369/980 llevó la respuesta de Adud al-Dawla a la corte bizantina {cite:encyclopaedia-of-islam-2 vol. 1 p. 233, 1018}. El cadí Iyad enumeró cincuenta y dos obras suyas, de las cuales seis sobreviven, incluyendo el Tamhid, el manual completo más antiguo de polémica teológica, al-Insaf e I'jaz al-Qur'an; Ibn Taymiyya lo llamó 'el mejor de los mutakallimun asociados a al-Ash'ari, sin igual antes ni después de él' {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}."
  tr: "Ebu Bekir Muhammed ibn el-Tayyib ibn Muhammed ibn Cafer el-Bakillani el-Basri (ö. 403 Hicri/1013 Miladi), Eş'ari teologu ve Maliki hukukçusu; Basra'da doğdu ve hayatının büyük bölümünü Bağdat'ta geçirdi. Ebu Abdullah ibn Mücahid el-Ta'i de dahil olmak üzere Eş'ari'nin takipçilerinden teoloji eğitimi aldı. Tartışmada zamanının eşsiz bir ismiydi ve düşünce okulunun liderliği ona geçti. Bir süre Bağdat dışında kadı olarak görev yaptı, Şiraz'ı ziyaret etti ve 369 Hicri/980 Miladi yılında Adud el-Dawla'nın cevabını Bizans sarayına götürdü. Kadı İyad, onu elli iki eser arasında listeledi; bunlardan altısı günümüze ulaşmıştır. Bunlar arasında teoloji üzerine en eski eksiksiz diyalektik kitap olan \"el-Tamhid\", \"el-İnsaf\" ve \"İ'caz el-Kur'an\" bulunmaktadır. İbn Taymiyye, onun “Eş'ari’ye bağlı ilahiyatçıların en iyisidir, ne ondan önce ne de ondan sonra onun gibisi yoktur” demiştir. {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}."
  id: "Hakim Abu Bakr Muhammad ibn al-Tayyib ibn Muhammad ibn Ja'far al-Baqillani al-Basri (wafat 403 H/1013 M), seorang teolog Ash'ari dan ahli hukum Maliki; ia lahir di Basra dan menghabiskan sebagian besar hidupnya di Baghdad. Ia belajar teologi di bawah para pengikut al-Ash'ari, termasuk Abu Abdullah ibn Mujahid al-Ta'i. Ia unik pada zamannya dalam berdebat, sampai-sampai kepemimpinan dalam aliran pemikirannya beralih kepadanya. Ia menjabat sebagai hakim untuk beberapa waktu di luar Baghdad, mengunjungi Shiraz, dan pada tahun 369 H/980 M membawa jawaban Adud al-Dawla ke pengadilan Bizantium. Hakim Iyad mencantumkannya di antara lima puluh dua karya, yang enam di antaranya masih ada, termasuk \"al-Tamhid,\" buku dialektika lengkap tertua tentang teologi, \"al-Insaf,\" dan \"I'jaz al-Qur'an.\" Ibn Taymiyyah mengatakan bahwa dia adalah “ahli teologi terbaik yang berafiliasi dengan al-Ash’ari, tidak ada seorang pun seperti dia di antara mereka, baik sebelum maupun sesudahnya.” {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}."
