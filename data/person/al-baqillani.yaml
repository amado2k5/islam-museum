summary:
  ar: "القاضي أبو بكر محمد بن الطيب بن محمد بن جعفر الباقلاني البصري (ت ٤٠٣هـ/١٠١٣م)، متكلم الأشاعرة وفقيه المالكية؛ وُلد بالبصرة وقضى أكثر عمره ببغداد، وأخذ علم الكلام عن أصحاب الأشعري ومنهم أبو عبد الله بن مجاهد الطائي، وكان أوحد زمانه في المناظرة حتى انتهت إليه الرياسة في مذهبه {cite:wafayat-ayan} {cite:shadharat-dhahab p. 169}. تولى القضاء مدة خارج بغداد، وزار شيراز، وحمل سنة ٣٦٩هـ/٩٨٠م جواب عضد الدولة إلى بلاط الروم {cite:encyclopaedia-of-islam-2 vol. 1 p. 233, 1018}. عدّه القاضي عياض في اثنين وخمسين مصنفاً بقيت منها ستة، منها «التمهيد» أقدم كتاب جدلي كامل في الكلام، و«الإنصاف»، و«إعجاز القرآن»؛ وقال ابن تيمية إنه «أفضل المتكلمين المنتسبين إلى الأشعري ليس فيهم مثله لا قبله ولا بعده» {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}."
  en: "The qadi Abu Bakr Muhammad ibn al-Tayyib ibn Muhammad ibn Ja'far al-Baqillani al-Basri (d. 403/1013), Ash'ari theologian and Maliki jurist. Born in Basra, he spent most of his adult life in Baghdad, learning kalam from al-Ash'ari's disciples, among them Abu Abd Allah ibn Mujahid al-Ta'i; unrivalled in his age in disputation, headship of the school devolved on him {cite:wafayat-ayan} {cite:shadharat-dhahab p. 169}. He held a qadi post outside Baghdad for a time, visited Shiraz, and in 369/980 carried Adud al-Dawla's reply to the Byzantine court {cite:encyclopaedia-of-islam-2 vol. 1 p. 233, 1018}. The qadi Iyad listed fifty-two works of his, of which six survive — including the Tamhid, the earliest complete manual of theological polemic, al-Insaf, and I'jaz al-Qur'an; Ibn Taymiyya called him 'the best of the mutakallimun attached to al-Ash'ari, with no equal before or after him' {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}."
  ur: "قاضی ابوبکر محمد بن الطیب بن محمد بن جعفر الباقلانی البصری (وفات 403ھ/1013ء)، اشاعرہ کے متکلم اور مالکی فقیہ۔ بصرہ میں پیدا ہوئے اور بیشتر عمر بغداد میں گزاری؛ اشعری کے شاگردوں سے علم کلام پڑھا جن میں ابو عبد اللہ بن مجاہد طائی شامل ہیں؛ اپنے زمانے میں مناظرہ کے بے مثال ماہر، مذہب کی ریاست ان کے ہاتھ آئی {cite:wafayat-ayan} {cite:shadharat-dhahab p. 169}۔ کچھ عرصہ بغداد سے باہر قاضی رہے، شیراز گئے، اور 369ھ/980ء میں عضد الدولہ کا جواب دربار روم پہنچایا {cite:encyclopaedia-of-islam-2 vol. 1 p. 233, 1018}۔ قاضی عیاض نے ان کی باواں تصانیف گنوائیں جن میں چھ باقی ہیں — جدلی کلام کی پہلی مکمل کتاب «التمہید»، «الانصاف» اور «اعجاز قرآن»؛ ابن تیمیہ کے نزدیک وہ «اشعری سے منسوب متکلمین میں بہترین ہیں، نہ پہلے کوئی ان جیسا نہ بعد میں» {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018} {cite:shadharat-dhahab p. 169-170}۔"
