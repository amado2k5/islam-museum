summary:
  ar: "سعيد بن المبارك بن أحمد بن صدقة، أبو البدر الحمامي، محدث بغدادي روى عن ابن ناصر وأبي الوقت، وذكره الذهبي في وفيات سنة 596هـ ⁦(1199 - 1200م)⁩؛ وهو غير ابن الدهان النحوي سعيد بن المبارك بن علي ⁦(494 - 569هـ)⁩ {cite:tarikh-islam-dhahabi}."
  en: "Sa'id ibn al-Mubarak ibn Ahmad ibn Sadaqa, Abu al-Badr al-Hammami, was a Baghdad hadith transmitter who narrated from Ibn Nasir and Abu al-Waqt, listed by al-Dhahabi among those who died in 596 AH (1199-1200). He is a different man from the grammarian Ibn al-Dahan, Sa'id ibn al-Mubarak ibn 'Ali (494-569 AH), who shares his name and has his own record (person/ibn-al-dahan) {cite:tarikh-islam-dhahabi}."
