id: person/al-jajarmi
class: person
label: { ar: "الجاجرمي", en: "al-Jajarmi" }
summary:
  ar: "الإمام معين الدين أبو حامد محمد بن إبراهيم الجاجرمي نسبة إلى جاجرم بلدة بين نيسابور وجرجان؛ الفقيه الشافعي مؤلف «الكفاية في الفقه»؛ قال ابن خلكان كان إماماً فاضلاً متقناً مبرزاً سكن نيسابور ودرّس وصنف في الفقه «الكفاية» وهو في غاية الإيجاز مع اشتماله على كثير من المسائل التي تقع في الفتاوى وهو في مجلد واحد، وله «إيضاح الوجيز» في مجلدين، وله طريقة مشهورة في الخلاف والفوائد المشهورة منسوبة إليه واشتغل عليه الناس وانتفعوا به وبكتبه من بعده خصوصاً القواعد فإن الناس أكبوا على الاشتغال بها؛ توفي بكرة نهار الجمعة عاشر رجب سنة ثلاث عشرة وستمائة بنيسابور {cite:shadharat-dhahab p. 56}."
  en: "The imam Mu'in al-Din Abu Hamid Muhammad ibn Ibrahim al-Jajarmi, nisba to Jajarm, a town between Nishapur and Jurjan; a Shafi'i jurist and author of al-Kifaya fi al-fiqh. Ibn Khallikan said he was an excellent, precise and outstanding imam who settled in Nishapur, taught and wrote on fiqh. His al-Kifaya is extremely concise while containing many of the questions that arise in fatwas, and it is in one volume; he also wrote Idah al-Wajiz in two volumes, and he had a well-known method in khilaf and well-known fawa'id attributed to him. People studied under him and benefited from him and his books after him, especially the Qawa'id, which people took up with great eagerness. He died on the morning of Friday, 10 Rajab 613, at Nishapur {cite:shadharat-dhahab p. 56}."
