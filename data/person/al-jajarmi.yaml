label: { ar: "الجاجرمي", en: "al-Jajarmi", es: "al-Jajarmi", fr: "al-Jajarmi", ur: "الججرمی" }
summary:
  ar: "الإمام معين الدين أبو حامد محمد بن إبراهيم الجاجرمي نسبة إلى جاجرم بلدة بين نيسابور وجرجان؛ الفقيه الشافعي مؤلف «الكفاية في الفقه»؛ قال ابن خلكان كان إماماً فاضلاً متقناً مبرزاً سكن نيسابور ودرّس وصنف في الفقه «الكفاية» وهو في غاية الإيجاز مع اشتماله على كثير من المسائل التي تقع في الفتاوى وهو في مجلد واحد، وله «إيضاح الوجيز» في مجلدين، وله طريقة مشهورة في الخلاف والفوائد المشهورة منسوبة إليه واشتغل عليه الناس وانتفعوا به وبكتبه من بعده خصوصاً القواعد فإن الناس أكبوا على الاشتغال بها؛ توفي بكرة نهار الجمعة عاشر رجب سنة ثلاث عشرة وستمائة بنيسابور {cite:shadharat-dhahab p. 56}."
  en: "The imam Mu'in al-Din Abu Hamid Muhammad ibn Ibrahim al-Jajarmi, nisba to Jajarm, a town between Nishapur and Jurjan; a Shafi'i jurist and author of al-Kifaya fi al-fiqh. Ibn Khallikan said he was an excellent, precise and outstanding imam who settled in Nishapur, taught and wrote on fiqh. His al-Kifaya is extremely concise while containing many of the questions that arise in fatwas, and it is in one volume; he also wrote Idah al-Wajiz in two volumes, and he had a well-known method in khilaf and well-known fawa'id attributed to him. People studied under him and benefited from him and his books after him, especially the Qawa'id, which people took up with great eagerness. He died on the morning of Friday, 10 Rajab 613, at Nishapur {cite:shadharat-dhahab p. 56}."
  es: "El imán Mu'in al-Din Abu Hamid Muhammad ibn Ibrahim al-Jajarmi, residente en Jajarm, ciudad situada entre Nishapur y Jurjan, fue un jurista shafi'í y autor de al-Kifaya fi al-fiqh. Ibn Khallikan afirmó que fue un imán excelente, preciso y sobresaliente, que se estableció en Nishapur, donde enseñó y escribió sobre fiqh. Su obra al-Kifaya es sumamente concisa, a la vez que aborda muchas de las cuestiones que surgen en las fatwas, y consta de un solo volumen. También escribió Idah al-Wajiz en dos volúmenes, y se le atribuyen un método reconocido en el khilaf y fawa'id de renombre. Muchos estudiaron con él y se beneficiaron de sus obras y de las posteriores, especialmente de los Qawa'id, que fueron recibidos con gran entusiasmo. Falleció la mañana del viernes 10 de Rajab de 613 en Nishapur {cite:shadharat-dhahab p. 56}."
  fr: "L'imam Mu'in al-Din Abu Hamid Muhammad ibn Ibrahim al-Jajarmi, né à Jajarm, ville située entre Nishapur et Jurjan, était un juriste chaféite et l'auteur d'al-Kifaya fi al-fiqh. Ibn Khallikan le décrit comme un imam excellent, précis et remarquable, établi à Nishapur, où il enseigna et écrivit sur le fiqh. Son ouvrage al-Kifaya, d'une grande concision, aborde de nombreuses questions fréquemment posées dans les fatwas et est publié en un seul volume. Il est également l'auteur d'Idah al-Wajiz, en deux volumes, et sa méthode de khilaf ainsi que ses fawa'id, qui lui sont attribués, sont réputés. Ses disciples furent nombreux à bénéficier de son enseignement et de ses écrits, notamment les Qawa'id, qui suscitèrent un vif intérêt. Il mourut le vendredi 10 Rajab 613 au matin, à Nishapur (cf. Hadharat-Dhahab, p. 56)."
  ur: "امام معین الدین ابو حامد محمد بن ابراہیم الجارمی، نسبہ تا جاجرم، نیشاپور اور جرجان کے درمیان ایک قصبہ؛ ایک شافعی فقیہ اور الکفایہ فی الفقہ کا مصنف۔ ابن خلقان نے کہا کہ وہ ایک بہترین، قطعی اور شاندار امام تھے جو نیشاپور میں آباد ہوئے، فقہ کی تعلیم دی اور لکھی۔ اس کا الکفایہ نہایت جامع ہے اور اس میں بہت سے سوالات ہیں جو فتاویٰ میں اٹھتے ہیں، اور یہ ایک جلد میں ہے۔ اس نے عدۃ الوجیز بھی دو جلدوں میں لکھی، اور ان کے پاس خلافت کا ایک معروف طریقہ تھا اور معروف فوائد ان سے منسوب تھے۔ لوگوں نے ان کے زیر سایہ تعلیم حاصل کی اور ان سے اور ان کے بعد کی کتابوں سے استفادہ کیا، خاص طور پر قوائد، جسے لوگوں نے بڑے شوق سے اٹھایا۔ آپ کا وصال جمعہ کی صبح 10 رجب 613 کو نیشاپور میں ہوا۔ 56}۔"
