label: { ar: "الجاجرمي" }
summary:
  ar: "الإمام معين الدين أبو حامد محمد بن إبراهيم الجاجرمي نسبة إلى جاجرم بلدة بين نيسابور وجرجان؛ الفقيه الشافعي مؤلف «الكفاية في الفقه»؛ قال ابن خلكان كان إماماً فاضلاً متقناً مبرزاً سكن نيسابور ودرّس وصنف في الفقه «الكفاية» وهو في غاية الإيجاز مع اشتماله على كثير من المسائل التي تقع في الفتاوى وهو في مجلد واحد، وله «إيضاح الوجيز» في مجلدين، وله طريقة مشهورة في الخلاف والفوائد المشهورة منسوبة إليه واشتغل عليه الناس وانتفعوا به وبكتبه من بعده خصوصاً القواعد فإن الناس أكبوا على الاشتغال بها؛ توفي بكرة نهار الجمعة عاشر رجب سنة ثلاث عشرة وستمائة بنيسابور {cite:shadharat-dhahab p. 56}."
