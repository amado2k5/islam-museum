summary:
  ar: "ثالث سلاطين تشيربون على الساحل الشمالي لجاوة، حكم 79 عامًا (1570–1649). وُلد باسم زين العارفين، وحافظ على ازدهار تشيربون وحيادها بين بنتن ومطرم، وقبل سيادة مطرم سنة 1619، ودُفن في مجمع أستانا غونونغ سمبونغ."
  en: "Third sultan of Cirebon, on the north coast of Java, who reigned for 79 years (1570–1649). Born Zainul Arifin, he kept Cirebon prosperous and neutral between Banten and Mataram, accepted Mataram's overlordship in 1619, and was buried in the Astana Gunung Sembung complex."
  ur: "جاوا کے شمالی ساحل پر واقع چیربون کے تیسرے سلطان، جنھوں نے 79 سال حکومت کی (1570–1649ء)۔ پیدائشی نام زین العارفین تھا؛ انھوں نے چیربون کو بنتن اور مطرم کے درمیان خوش حال اور غیر جانبدار رکھا، 1619ء میں مطرم کی بالادستی قبول کی، اور آستانا گونونگ سمبونگ میں دفن ہوئے۔"
