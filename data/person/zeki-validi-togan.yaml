summary:
  ar: "مؤرخ باشكيري وقائد حركة التحرر الباشكيرية (1890–1970): أعلن حكم باشكيريا الذاتي سنة 1917، وترأس باشريفكوم سنة 1919–1920، ثم صار من قادة حركة البسمتشي في تركستان قبل هجرته، وقضى بقية حياته أستاذا للتاريخ التركي في إسطنبول، وتوفي ودُفن فيها سنة 1970."
  en: "Bashkir historian and leader of the Bashkir liberation movement (1890–1970): he declared Bashkir autonomy in 1917, chaired the Bashrevkom in 1919–1920, then became a leader of the Basmachi movement in Turkistan before emigrating, and spent the rest of his life as a professor of Turkish history at Istanbul, where he died and was buried in 1970."
  ur: "باشقیر مؤرخ اور باشقیر آزادی کی تحریک کے رہنما (1890–1970): 1917 میں باشقیر خودمختاری کا اعلان کیا، 1919–1920 میں باشریفکوم کے صدر رہے، پھر ہجرت سے پہلے ترکستان میں بسمچی تحریک کے رہنما بنے، اور بقیہ زندگی استنبول میں ترک تاریخ کے استاد رہے، جہاں 1970 میں انتقال ہوا اور دفن ہوئے۔"
