id: person/hamid-ibn-al-abbas
class: person
label: { ar: "حامد بن العباس" }
summary:
  ar: "ضمن السواد وجدد المظالم فغلت الأسعار ببغداد سنة ثمان وشغبت العامة ووقع النهب وركب الجند فهاجتهم العامة ودام القتال أياماً وأحرقوا الجسر وفتحوا السجون ورجموا الوزير واختلت أحوال الدولة العباسية جداً {cite:tarikh-khulafa-minhaj-1434 p. 590}. وعند المسعودي خلع عليه الوزارة المقتدر يوم الثلاثاء لليلتين خلتا من جمادى الآخرة سنة ست وثلثمائة وفوضت الأمور إليه ثم قبض عليه {cite:muruj-al-dhahab p. 661}، وهو الذي صمد لقتل الحلاج وقام في ذلك وقد كاد السلطان أن يطلقه لأنه مس عليه وعلى من في داره من الخدم والنساء بالدعاء والرقى وكان يأكل اليسير ويصلي الكثير ويصوم الدهر فاستغواهم واسترقهم، وقال حامد للحلاج الآن صح أنك تدعي ما عرفت به فقتل وأحرق في آخر سنة تسع وثلاثمائة بعد أن ضرب ألف سوط وقطعت يداه {cite:fihrist-ibn-al-nadim p. 271-272}، وعند ابن الأثير هو الذي نُقل إليه أمر الحلاج فالتمس من المقتدر تسليمه إليه وألحّ حتى أخذه وأحضر القاضي أبا عمرو والقاضي أبا جعفر بن البهلول ووجوه الفقهاء والشهود فاستفتاهم فيه حتى كتبوا بإباحة دمه {cite:kamil-ibn-al-athir p. 94-95} وعند ابن الجوزي وُلّي لإحدى عشرة ليلة خلت من رجب سنة سبع وثمانين الخراج والضياع بفارس ودُفعت كتبه بالولاية إلى أخيه أحمد بن العباس وكان مقيمًا بواسط {cite:muntazam-ibn-al-jawzi p. 316-317}."
  en: "He farmed the Sawad and renewed the exactions; prices soared in Baghdad in 308, the mob rioted, burnt the bridge, opened the prisons and stoned the vizier — the Abbasid state was shaken to its core {cite:tarikh-khulafa-minhaj-1434 p. 590}."
  es: "Cultivó el Sawad y reanudó las exacciones; los precios se dispararon en Bagdad en 308, la multitud se amotinó, quemó el puente, abrió las prisiones y apedreó al visir; el estado abasí se vio sacudido hasta sus cimientos {cite:tarikh-khulafa-minhaj-1434 p. 590}."
  fr: "Il cultiva le Sawad et renouvela les exactions; les prix montèrent en flèche à Bagdad en 308, la foule se révolta, brûla le pont, ouvrit les prisons et lapida le vizir — l'État abbasside fut ébranlé jusqu'à ses fondements {cite:tarikh-khulafa-minhaj-1434 p. 590}."
  ur: "اس نے سواد کی کھیتی باڑی کی اور اس کی تجدید کی۔ 308 میں بغداد میں قیمتیں بڑھ گئیں، ہجوم نے ہنگامہ آرائی کی، پل جلا دیے، جیلیں کھول دیں اور وزیر کو سنگسار کیا - عباسی ریاست اپنے مرکز تک ہل گئی تھی۔ 590}۔"
  tr: "Karanlık ve yenilenen şikayetler altında, sekizinci yılda Bağdat'ta fiyatlar fırladı, halk isyan etti, yağmalar oldu, askerler atlara bindi, halk isyan etti, çatışmalar günlerce sürdü, köprüler yakıldı, hapishaneler açıldı, veziri taşladı ve Abbasi devleti çok huzursuz oldu {cite:History-khulafa-minhaj-1434, s. 590}. El-Mes'udi, 306 Hicri yılında Cumedül-Akhirah'ın önünde Salı günü el-Muqtadir vezirliğini iki gece boyunca görevden aldı. İşler ona devredildi, sonra tutuklandı {atıf:muruj-al-dhahab, s. 661}. El-Hallaj'ın öldürülmesine karşı direnen ve bunu gerçekleştiren oydu. Sultan, kendisine, hizmetçilere ve evindeki kadınlara dua ve rukıyâ ile zarar verdiği için neredeyse onu serbest bırakıyordu. Az yedi, çok dua etti ve ömür boyu oruç tuttu, bu yüzden onları baştan çıkarıp köleleştirdiler. Hamid şimdi el-Hallaj'a dedi ki, 'Doğru, senin bilindiğini iddia ediyorsun.' Sonunda öldürüldü ve yakıldı. Üç yüz dokuzuncu yılda, bin kırbaç cezası verildikten ve elleri kesildikten sonra {cite:Fihrist-ibn-al-Nadim s. 271-272}. İbn al-Athir'e göre, el-Hallaj meselesini ona devreden oydu, bu yüzden el-Muqtadir'den onu teslim etmesini istedi ve onu alana kadar ısrar etti. Hakim Ebu Amr, Hakim Ebu Ca'fer bin el-Behl, önde gelen hukukçular ve tanıklar çağırdı ve kanına izin veren yazıya kadar onlarla danıştı {atıf:kamil-ibn-al-athir s. 94-95}. İbn el-Cavazi'ye göre, Pers'te seksen yedinci yılda Recep'ten önce on bir gece vergi tuttu ve vasilik mektupları kardeşine teslim edildi Ahmed ibn al-Abbas Wasit'te ikamet ediyordu {cite:muntazam-ibn-al-jawzi s. 316-317}."
  id: "Di bawah kegelapan dan keluhan yang diperbarui, harga di Baghdad melonjak pada tahun kedelapan, rakyat biasa melakukan kerusuhan, penjarahan terjadi, tentara berkuda, masyarakat umum melakukan kerusuhan, pertempuran berlangsung berhari-hari, mereka membakar jembatan, membuka penjara, melempari wazir, dan negara Abbasiyah menjadi sangat terganggu {cite:History-khulafa-minhaj-1434, hlm. 590}. Al-Mas'udi memberhentikan jabatan wazir al-Muqtadir pada hari Selasa selama dua malam di hadapan Jumada al-Akhirah pada tahun 306 H. Urusan tersebut didelegasikan kepadanya, lalu dia ditangkap {cite:muruj-al-dhahab, hlm. 661}. Dialah yang teguh menentang pembunuhan al-Hallaj dan melaksanakannya. Sultan hampir membebaskannya karena telah menyakitinya dan para pelayan serta wanita di rumahnya dengan doa dan ruqyah. Dia makan sedikit, berdoa banyak, dan berpuasa seumur hidup, sehingga mereka menggoda dan memperbudak mereka. Hamid berkata kepada al-Hallaj sekarang, 'Memang benar bahwa kamu mengklaim apa yang kamu dikenal.' Dia dibunuh dan dibakar di akhirnya. Pada tahun tiga ratus sembilan, setelah ia menerima seribu cambukan dan tangannya dipotong {cite:fihrist-ibn-al-nadim hlm. 271-272}. Menurut Ibn al-Athir, dialah yang memindahkan urusan al-Hallaj kepadanya, sehingga ia meminta al-Muqtadir untuk menyerahkannya dan bertahan hingga ia menangkapnya. Ia memanggil Hakim Abu Amr, Hakim Abu Ja'far ibn al-Bahlul, ahli hukum terkemuka, dan saksi serta berkonsultasi dengan mereka hingga mereka menulis surat izin darahnya {cite:kamil-ibn-al-athir hlm. 94-95}. Menurut Ibn al-Jawzi, ia memegang pungutan selama sebelas malam di hadapan Rajab pada tahun delapan puluh tujuh di Persia, dan surat perwaliannya diserahkan kepada saudaranya Ahmad ibn al-Abbas tinggal di Wasit {cite:muntazam-ibn-al-jawzi hlm. 316-317}."
