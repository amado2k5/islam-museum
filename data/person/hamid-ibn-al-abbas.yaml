summary:
  ar: "ضمن السواد وجدد المظالم فغلت الأسعار ببغداد سنة ثمان وشغبت العامة ووقع النهب وركب الجند فهاجتهم العامة ودام القتال أياماً وأحرقوا الجسر وفتحوا السجون ورجموا الوزير واختلت أحوال الدولة العباسية جداً {cite:tarikh-khulafa-minhaj-1434 p. 590}.، وعند المسعودي خلع عليه الوزارة المقتدر يوم الثلاثاء لليلتين خلتا من جمادى الآخرة سنة ست وثلثمائة وفوضت الأمور إليه ثم قبض عليه {cite:muruj-al-dhahab p. 661}"
  en: "He farmed the Sawad and renewed the exactions; prices soared in Baghdad in 308, the mob rioted, burnt the bridge, opened the prisons and stoned the vizier — the Abbasid state was shaken to its core {cite:tarikh-khulafa-minhaj-1434 p. 590}."
