id: person/hamid-ibn-al-abbas
class: person
label: { ar: "حامد بن العباس" }
summary:
  ar: "ضمن السواد وجدد المظالم فغلت الأسعار ببغداد سنة ثمان وشغبت العامة ووقع النهب وركب الجند فهاجتهم العامة ودام القتال أياماً وأحرقوا الجسر وفتحوا السجون ورجموا الوزير واختلت أحوال الدولة العباسية جداً {cite:tarikh-khulafa-minhaj-1434 p. 590}.، وعند المسعودي خلع عليه الوزارة المقتدر يوم الثلاثاء لليلتين خلتا من جمادى الآخرة سنة ست وثلثمائة وفوضت الأمور إليه ثم قبض عليه {cite:muruj-al-dhahab p. 661}، وهو الذي صمد لقتل الحلاج وقام في ذلك وقد كاد السلطان أن يطلقه لأنه مس عليه وعلى من في داره من الخدم والنساء بالدعاء والرقى وكان يأكل اليسير ويصلي الكثير ويصوم الدهر فاستغواهم واسترقهم، وقال حامد للحلاج الآن صح أنك تدعي ما عرفت به فقتل وأحرق في آخر سنة تسع وثلاثمائة بعد أن ضرب ألف سوط وقطعت يداه {cite:fihrist-ibn-al-nadim p. 271-272}، وعند ابن الأثير هو الذي نُقل إليه أمر الحلاج فالتمس من المقتدر تسليمه إليه وألحّ حتى أخذه وأحضر القاضي أبا عمرو والقاضي أبا جعفر بن البهلول ووجوه الفقهاء والشهود فاستفتاهم فيه حتى كتبوا بإباحة دمه {cite:kamil-ibn-al-athir p. 94-95}"
  en: "He farmed the Sawad and renewed the exactions; prices soared in Baghdad in 308, the mob rioted, burnt the bridge, opened the prisons and stoned the vizier — the Abbasid state was shaken to its core {cite:tarikh-khulafa-minhaj-1434 p. 590}."
