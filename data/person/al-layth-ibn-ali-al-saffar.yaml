summary:
  ar: "الليث بن علي بن الليث؛ ابن أخي يعقوب وعمرو بن الليث الصفاري؛ تغلب على بلاد سجستان في سنة ست وتسعين ومائتين واستخلف عليها أخاه المعدل بن علي وسار إلى بلاد فارس فهرب منه سبك السبكري يطلب من الخليفة النجدة فجرّد المقتدر بالله الجيوش في رمضان سنة ست وتسعين وقدّم عليها مؤنساً المظفر وبدراً الكبير والحسين بن حمدان فالتقوا مع الليث فهُزم جمعه وأُسر هو وأخوه محمد وابنه إسماعيل ودُخل بهم بغداد في المحرم سنة سبع وتسعين وسُري الليث على الفيل ثم ملك أخوه المعدل سجستان فأخذها منه أحمد بن إسماعيل الساماني فانقضى أمر الصفارية {cite:wafayat-ayan}."
  en: "Al-Layth b. Ali b. al-Layth — last Saffarid; took Sistan in 296, marched on Fars, and was captured with his brother and son by Mu'nis the Muzaffar's army (297), paraded through Baghdad on an elephant; the dynasty ended with him {cite:wafayat-ayan}."
  es: "Al-Layth b. Ali b. al-Layth — último saffarí; tomó Sistán en 296, marchó sobre Fars y fue capturado junto con su hermano y su hijo por el ejército de Mu'nis el Muzaffar (297), desfiló por Bagdad en un elefante; la dinastía terminó con él {cite:wafayat-ayan}."
  fr: "Al-Layth b. Ali b. al-Layth — dernier Saffaride; prit le Sistan en 296, marcha sur le Fars et fut capturé avec son frère et son fils par l'armée de Mu'nis le Muzaffar (297), défilé à travers Bagdad sur un éléphant; la dynastie prit fin avec lui {cite:wafayat-ayan}."
  ur: "اللیث بی۔ علی بی ال لیث - آخری صفرد؛ 296 میں سیستان پر قبضہ کیا، فارس پر چڑھائی کی، اور اسے اپنے بھائی اور بیٹے کے ساتھ معنیس مظفر کی فوج (297) نے پکڑ لیا، ہاتھی پر سوار ہو کر بغداد سے نکلا۔ اس کے ساتھ خاندان کا خاتمہ ہوا۔"
  tr: "El-Leyt bin Ali ibn el-Leyth; Ya'qub ve Amr ibn al-Leyth el-Safari'nin yeğeni; 296 Hicri yılında Sijistan'ı fethetti ve kardeşi el-Muadil bin Ali'yi halefi olarak atadı. Pers'e yürüdü, ancak Subk el-Subkari halifeden yardım aramak için kaçtı. El-Muktadir Billah, 96 Hicri Ramazan ayında orduları dağıttı ve Mu'nasan ile birlikte onlara ilerledi el-Muzaffer, Badr el-Kabir ve Hüseyin bin Hamdan. El-Leyt ile karşılaştılar, grubunu yendiler, onu, kardeşi Muhammed'i ve oğlu İsmail'i esir aldılar ve doksan yedinci yılın Muharrem'inde Bağdat'a girdiler. El-Leyt bir fil üzerinde yola çıktı, ardından kardeşi el-Muadil Sijistan'ı yönetti; Ahmed bin İsmail el-Samani onu aldı ve Saffariyyat işlerini sona erdirdi {alıntı: Wafayat-ayan}."
  id: "Al-Layth ibn Ali ibn al-Layth; keponakan Ya'qub dan Amr ibn al-Layth al-Saffari; ia menaklukkan Sijistan pada tahun 296 H dan menunjuk saudaranya al-Mu'adil ibn Ali sebagai penerusnya. Ia berangkat ke Persia, tetapi Subk al-Subkari melarikan diri mencari bantuan dari khalifah. Al-Muqtadir Billah membubarkan pasukan pada Ramadan tahun 96 H, dan maju bersama Mu'. nasan al-Muzaffar, Badr al-Kabir, dan Husayn ibn Hamdan. Mereka bertemu al-Layth, mengalahkan kelompok mereka, menangkapnya, saudaranya Muhammad, dan putranya Ismail, lalu memasuki Baghdad dalam Muharram tahun sembilan puluh tujuh. Al-Layth berangkat menaiki gajah, kemudian saudaranya al-Mu'adil memerintah Sijistan, yang diambil Ahmad ibn Ismail al-Samani darinya, mengakhiri urusan Saffariyyat {cite:Wafayat-Ayan}."
