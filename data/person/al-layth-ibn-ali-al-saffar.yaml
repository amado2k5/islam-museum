summary:
  ar: "الليث بن علي بن الليث؛ ابن أخي يعقوب وعمرو بن الليث الصفاري؛ تغلب على بلاد سجستان في سنة ست وتسعين ومائتين واستخلف عليها أخاه المعدل بن علي وسار إلى بلاد فارس فهرب منه سبك السبكري يطلب من الخليفة النجدة فجرّد المقتدر بالله الجيوش في رمضان سنة ست وتسعين وقدّم عليها مؤنساً المظفر وبدراً الكبير والحسين بن حمدان فالتقوا مع الليث فهُزم جمعه وأُسر هو وأخوه محمد وابنه إسماعيل ودُخل بهم بغداد في المحرم سنة سبع وتسعين وسُري الليث على الفيل ثم ملك أخوه المعدل سجستان فأخذها منه أحمد بن إسماعيل الساماني فانقضى أمر الصفارية {cite:wafayat-ayan}."
  en: "Al-Layth b. Ali b. al-Layth — last Saffarid; took Sistan in 296, marched on Fars, and was captured with his brother and son by Mu'nis the Muzaffar's army (297), paraded through Baghdad on an elephant; the dynasty ended with him {cite:wafayat-ayan}."
