summary:
  ar: "شاعر بالأردية والفارسية ومفكر من البنجاب، درس في لاهور وكمبردج وميونخ؛ دعا في «أسرار خودي» و«جاويد نامه» ومحاضرات «تجديد الفكر الديني في الإسلام» إلى تنمية الذات وبعث المسلمين، وأعلن سنة 1930م ضرورة قيام دولة مسلمة في شمال غربي الهند، ويلقب بالأب الروحي لباكستان."
  en: "Poet in Urdu and Persian and thinker from the Punjab, educated in Lahore, Cambridge and Munich. In the Asrar-i khudi, the Javidnama and the lectures on the reconstruction of religious thought in Islam he called for the development of the self and the revival of the Muslims; in 1930 he stated the need for a Muslim state in north-west India, and he is called the spiritual father of Pakistan."
  ur: "پنجاب کے اردو اور فارسی شاعر اور مفکر، جنہوں نے لاہور، کیمبرج اور میونخ میں تعلیم پائی۔ «اسرار خودی»، «جاوید نامہ» اور تشکیل جدید الہیات اسلامیہ کے خطبات میں انہوں نے خودی کی تربیت اور مسلمانوں کے احیا کی دعوت دی؛ 1930ء میں شمال مغربی ہندوستان میں مسلم ریاست کی ضرورت بیان کی، اور پاکستان کے روحانی باپ کہلاتے ہیں۔"
