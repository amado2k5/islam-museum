class: person
label: { ar: "النضيرة بنت الضيزن", en: "al-Nadira bint al-Dayzan", fr: "al-Nadira bint al-Dayzan", es: "al-Nadira bint al-Dayzan", ur: "نادرہ بنت الدیان" }
summary:
  ar: "ابنة الضيزن ملك الحضر، أشرفت من الحصن على سابور فهويته وأعجبها جماله فأرسلت إليه إن تتزوجني دللتك على فتح هذا الحصن، فدلته على أن ينثر تبناً في الثرثار ويتبعه حيث يدخل ففتح الحصن، وأسكرت أباها طمعاً في تزوجه إياها، فلما عرس بها وتجافى جنبها عن فراشه وجد ورقة آس بين عكنها فسألها بم كان أبواك يغذيانك فقالت بالزبد والملح والثلج والشهد وصفو الخمر، فقال إني لجدير ألا أستبقيك بعد انقلاب أبويك وقومك وربطها بغدائرها إلى فرسين جموحين فقطعاها، وفيها قال عدي بن زيد العبادي شعره المشهور {cite:muruj-al-dhahab p. 553-554}."
  en: "The princess who loved Shapur from Hatra's wall, betrayed the water-gate for his hand, drugged her father's wine — then lost her own life when her delicate skin betrayed her pampered raising: torn between two stallions by her plaits, mourned in Adi ibn Zayd's famous verses {cite:muruj-al-dhahab p. 553-554}."
  fr: "La princesse qui aimait Shapur depuis le mur d'Hatra a trahi la porte de l'eau pour sa main, a drogué le vin de son père - puis a perdu sa propre vie lorsque sa peau délicate a trahi son élevage choyé : déchirée entre deux étalons par ses tresses, pleurée dans les célèbres vers d'Adi ibn Zayd {cite:muruj-al-dhahab p. 553-554}."
  es: "La princesa que amó a Shapur desde la muralla de Hatra, traicionó la puerta del agua por su mano, drogó el vino de su padre y luego perdió su propia vida cuando su delicada piel traicionó su crianza mimada: desgarrada entre dos sementales por sus trenzas, llorada en los famosos versos de Adi ibn Zayd {cite:muruj-al-dhahab p. 553-554}."
  ur: "شہزادی جس نے شاپور کو حاترہ کی دیوار سے پیار کیا، اس کے ہاتھ کے بدلے پانی کے دروازے کو دھوکہ دیا، اپنے باپ کی شراب کو نشہ کیا - پھر اپنی جان سے ہاتھ دھو بیٹھیں جب اس کی نازک جلد نے اس کی لاڈ پرورش کو دھوکہ دیا: اس کے تختوں سے دو گھوڑوں کے درمیان پھٹا ہوا، عدی ابن زید کی مشہور آیات میں ماتم کیا گیا ہے۔ 553-554}۔"
  tr: "Al-Dhaizan'ın kızı, Al-Hadr kralı, Sapur'u kaleden gözetledi ve kimliği ile güzelliğinden etkilendi. Ona göndererek, 'Benimle evlenirsen, sana bu kaleyi fethetme fırsatını göstereceğim.' dedi. Onu koyunları çathara saçması ve girdiği her yere takip etmesi için yönlendirdi. Kaleyi açtı ve onu sarhoş ederek evlenmek istedi. Onunla evlenip yatağından uzaklaştığında, boynunda bir mersin yaprağı buldu ve anne babasının ona ne verdiğini sordu. Kadın tereyağı, tuz, buz ve bal ile şarabı arıttığını söyledi. O dedi ki, 'Ailen ve halkın dönüp onu siperlerine bağlayıp iki vahşi ata bağladı ve onlar da onu kesti.' Bu bağlamda, 'Uday ibn Zayd al-Abadi ünlü şiirini okudu {atı: muruj-al-dhahab, s. 553-554}."
  id: "Putri Al-Dhaizan, raja Al-Hadr, mengawasi Sapur dari benteng, dan terkesan dengan identitas dan kecantikannya. Dia mengirim pesan kepadanya, berkata, 'Jika kau menikah denganku, aku akan menunjukkan kesempatan untuk menaklukkan benteng ini.' Dia membimbingnya untuk menyebarkan domba-domba di chathar dan mengikutinya ke mana pun dia masuk. Dia membuka benteng dan memabukkan Sapur untuk menikahinya. Ketika dia menikahinya dan menjauh dari tempat tidurnya, dia menemukan sehelai daun murt di lehernya dan bertanya apa yang biasa diberi makan orang tuanya. Dia berkata dengan mentega, garam, es, dan madu, lalu memurnikan anggur itu. Dia berkata, 'Aku tidak boleh menahanmu setelah orang tuamu dan rakyatmu berbalik dan mengikatnya ke paritnya pada dua kuda liar yang memotongnya.' Dalam hal ini, 'Uday ibn Zayd al-Abadi membacakan puisi terkenalnya {cite:muruj-al-dhahab, hlm. 553-554}."
