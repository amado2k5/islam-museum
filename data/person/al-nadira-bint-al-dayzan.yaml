label: { ar: "النضيرة بنت الضيزن", en: "al-Nadira bint al-Dayzan" }
summary:
  ar: "ابنة الضيزن ملك الحضر، أشرفت من الحصن على سابور فهويته وأعجبها جماله فأرسلت إليه إن تتزوجني دللتك على فتح هذا الحصن، فدلته على أن ينثر تبناً في الثرثار ويتبعه حيث يدخل ففتح الحصن، وأسكرت أباها طمعاً في تزوجه إياها، فلما عرس بها وتجافى جنبها عن فراشه وجد ورقة آس بين عكنها فسألها بم كان أبواك يغذيانك فقالت بالزبد والملح والثلج والشهد وصفو الخمر، فقال إني لجدير ألا أستبقيك بعد انقلاب أبويك وقومك وربطها بغدائرها إلى فرسين جموحين فقطعاها، وفيها قال عدي بن زيد العبادي شعره المشهور {cite:muruj-al-dhahab p. 553-554}."
  en: "The princess who loved Shapur from Hatra's wall, betrayed the water-gate for his hand, drugged her father's wine — then lost her own life when her delicate skin betrayed her pampered raising: torn between two stallions by her plaits, mourned in Adi ibn Zayd's famous verses {cite:muruj-al-dhahab p. 553-554}."
