id: person/al-khasibi
class: person
label: { ar: "الخصيبي", en: "al-Khasibi", es: "al-Khasibi", fr: "al-Khasibi", ur: "الخصیبی" }
summary:
  ar: "وزير القاهر بالله؛ أرسل إلى الساجية والحجرية يسألهم ما الذي حملهم على الاجتماع للقبض على القاهر فقالوا قد ثبت عندنا أنه يريد القبض على سيماء وقد عمل مطامير ليحبس فيها قوادنا، وقيل في سبب خلع القاهر أنه كان يقصر بالساجية والحجرية على قدر الإمكان ولا يقضي لأكابرهم حاجة ويؤخر أعطياتهم {cite:kamil-ibn-al-athir p. 209-210}."
  en: "Al-Qahir's vizier; the regiments answered his protest that the caliph was digging oubliettes for their captains — the chroniclers also blame the deposed caliph's stinginess toward them {cite:kamil-ibn-al-athir p. 209-210}."
  es: "El visir de Al-Qahir; los regimientos respondieron a su protesta de que el califa estaba cavando mazmorras para sus capitanes; los cronistas también culpan a la tacañería del califa depuesto hacia ellos {cite:kamil-ibn-al-athir p. 209-210}."
  fr: "Le vizir d'Al-Qahir; les régiments répondirent à sa protestation selon laquelle le calife creusait des oubliettes pour leurs capitaines — les chroniqueurs blâment également l'avarice du calife déchu à leur égard {cite:kamil-ibn-al-athir p. 209-210}."
  ur: "القاہر کا نظارہ؛ رجمنٹوں نے اس کے احتجاج کا جواب دیا کہ خلیفہ اپنے کپتانوں کے لیے بدگمانی کھود رہا ہے - تاریخ نگار بھی معزول خلیفہ کی بخل کو ان کے لیے مورد الزام ٹھہراتے ہیں۔ 209-210}۔"
  tr: "El-Kahir Billah'ın bakanı, El-Saciyya ve El-Hujariye'ye göndererek onları tutuklamak için buluşmaya neyin ittiğini sordu. Onlar, Sima'yı tutuklamayı planladığının bizim tarafından tespit edildiğini ve komutanlarımızı orada hapse atmak için tahkimat inşa ettiğini söylediler. El-Kahir'in görevden alınmasının sebebinin, El-Sajiya ve El-Hujariye'yi mümkün olduğunca sınırlaması, yaşlılarının ihtiyaçlarını karşılamaması veya ödemelerini geciktirmesi olduğu söylendi {atıf:Kamil-ibn-al-Athir s. 209-210}."
  id: "Menteri Al-Qahir Billah mengirim surat kepada Al-Sajiyya dan Al-Hujariyah untuk menanyakan apa yang mendorong mereka bertemu untuk menangkap Al-Qahir. Mereka mengatakan bahwa kami telah menetapkan bahwa dia berniat menangkap Sima, dan bahwa dia telah membuat benteng untuk memenjarakan para komandan kami di sana. Dikatakan alasan pencopotan Al-Qahir adalah karena dia membatasi penggunaan Al-Sajiya dan Al-Hujariya sebisa mungkin, tidak memenuhi kebutuhan para tetua mereka atau menunda pembayaran mereka {cite:kamil-ibn-al-athir hlm. 209-210}."
