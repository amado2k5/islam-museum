summary:
  ar: "مؤسس دولة الإمارات العربية المتحدة وأول رئيس لها (1971–2004) وحاكم أبوظبي (1966–2004)؛ حاكم المنطقة الشرقية (العين) من 1946، وخلف أخاه شخبوط في حكم أبوظبي في 6 أغسطس 1966، وقاد قيام الاتحاد في 2 ديسمبر 1971 وبقي رئيسًا له حتى وفاته في أبوظبي في 2 نوفمبر 2004، حيث دُفن في صحن مسجد الشيخ زايد الكبير الجديد."
  en: "Founding President of the United Arab Emirates (1971–2004) and ruler of Abu Dhabi (1966–2004). Governor of the Eastern Region (Al Ain) from 1946, he succeeded his brother Shakhbut as ruler of Abu Dhabi on 6 August 1966 and led the creation of the federation on 2 December 1971, remaining its president until his death at Abu Dhabi on 2 November 2004; he is buried in the courtyard of the new Sheikh Zayed Grand Mosque."
  ur: "متحدہ عرب امارات کے بانی اور پہلے صدر (1971ء–2004ء) اور ابوظبی کے حکمران (1966ء–2004ء)؛ 1946ء سے مشرقی علاقے (العین) کے گورنر رہے، 6 اگست 1966ء کو اپنے بھائی شخبوط کے جانشین بنے، 2 دسمبر 1971ء کو وفاق کے قیام کی قیادت کی اور 2 نومبر 2004ء کو ابوظبی میں وفات تک اس کے صدر رہے؛ نئی شیخ زاید جامع مسجد کے صحن میں مدفون ہیں۔"
