summary:
  ar: "قوهيار بن قارن أخو مازيار؛ كان يكاتب الحسن بن الحسين ومحمد بن إبراهيم يعلمهما أنه معهما على أخيه لحقد كان يحمله من الاستخفاف فدل على حيلة الكمين وأخذ بمنطقة أخيه حتى أخذ سلماً ووثب به بعض خاصة أخيه فقتل بطبرستان."
  en: "Quhyar ibn Qarin, Mazyar's brother; nursing his slights he secretly served al-Hasan ibn al-Husayn and Muhammad ibn Ibrahim against him, devised the ambush, seized his brother's belt as the hidden men closed — and was killed in Tabaristan by his brother's own retainers."
  es: "Quhyar ibn Qarin, hermano de Mazyar, resentido por sus agravios, sirvió en secreto a al-Hasan ibn al-Husayn y a Muhammad ibn Ibrahim en su contra, ideó la emboscada, se apoderó del cinturón de su hermano cuando los hombres ocultos se acercaban, y fue asesinado en Tabaristán por los propios hombres de confianza de su hermano."
  fr: "Quhyar ibn Qarin, frère de Mazyar; nourrissant ses affronts, il servit secrètement al-Hasan ibn al-Husayn et Muhammad ibn Ibrahim contre lui, conçut l'embuscade, s'empara de la ceinture de son frère alors que les hommes cachés se rapprochaient — et fut tué au Tabaristan par les propres hommes de son frère."
  ur: "قحیار ابن قرین، مزیار کے بھائی؛ اپنی ذلتوں کی پرواہ کرتے ہوئے اس نے خفیہ طور پر الحسن بن الحسین اور محمد بن ابراہیم کی خدمت کی، ان کے خلاف گھات لگا کر حملہ کیا، چھپے ہوئے لوگوں کے بند ہونے پر اپنے بھائی کی پٹی پر قبضہ کر لیا - اور طبرستان میں اپنے بھائی کے اپنے محافظوں کے ہاتھوں مارا گیا۔"
