summary:
  ar: "كاتبة ومدرّسة متخصصة في أسماء الله الحسنى؛ خريجة قانون من كلية لندن للاقتصاد وجامعة كاليفورنيا في بيركلي، وتحمل الدكتوراه. ألّفت كتاب «التأمل في أسماء الله» (2020) ودفتر «أسماء الله الحسنى» الموجَّه، وهي محاضِرة في معهد يقين للأبحاث الإسلامية ومدرّسة دورات لدى دار البروج، ودرست في كلية كامبريدج الإسلامية وتدرس التفسير والحديث في معهد السلام."
  en: "Writer and teacher specialising in the names of Allah. A law graduate of the London School of Economics and UC Berkeley who holds a PhD, she is the author of Reflecting on the Names of Allah (2020) and of the 99 Names of Allah guided journal. She is a Senior Fellow at the Yaqeen Institute, a course instructor for Al Buruj Press, studied at Cambridge Islamic College, and studies tafsir and hadith at Al-Salam Institute."
  ur: "اللہ کے ناموں پر تخصص رکھنے والی مصنفہ اور مدرسہ؛ لندن اسکول آف اکنامکس اور یو سی برکلے سے قانون کی گریجویٹ اور پی ایچ ڈی ہولڈر۔ «اسمائے الٰہی پر غور» (2020) اور «99 اسمائے الٰہی» رہنما جرنل کی مصنفہ ہیں، یقین انسٹی ٹیوٹ کی سینئر فیلو اور البروج پریس کی کورس انسٹرکٹر ہیں؛ کیمبرج اسلامک کالج میں پڑھا اور السلام انسٹی ٹیوٹ میں تفسیر و حدیث کی تعلیم حاصل کر رہی ہیں۔"
  es: "Escritora y profesora especializada en los nombres de Alá. Licenciada en Derecho por la London School of Economics y la Universidad de California en Berkeley, donde obtuvo su doctorado, es autora de «Reflexiones sobre los nombres de Alá» (2020) y del diario guiado «Los 99 nombres de Alá». Es investigadora principal del Instituto Yaqeen, instructora de cursos para Al Buruj Press, estudió en el Cambridge Islamic College y cursa estudios de tafsir y hadices en el Instituto Al-Salam."
  fr: "Écrivaine et enseignante spécialisée dans les noms d'Allah, elle est diplômée en droit de la London School of Economics et de l'Université de Californie à Berkeley, et titulaire d'un doctorat. Elle est l'auteure de *Reflecting on the Names of Allah* (2020) et du journal de méditation *99 Names of Allah*. Elle est chercheuse associée à l'Institut Yaqeen, formatrice pour Al Buruj Press, a étudié au Cambridge Islamic College et poursuit des études de tafsir et de hadith à l'Institut Al-Salam."
  tr: "Allah'ın Güzel İsimleri alanında uzmanlaşmış bir yazar ve öğretmen; Londra Ekonomi Okulu ve Kaliforniya Üniversitesi, Berkeley'den hukuk mezunu, doktora derecesine sahiptir. \"Allah'ın İsimleri Üzerine Meditasyon\" (2020) kitabının ve rehberli defter \"Allah'ın Güzel İsimleri\"nin yazarıdır. Yaqeen İslami Araştırmalar Enstitüsü'nde öğretim görevlisi ve Dar Al-Burouj'da ders eğitmenidir. Cambridge İslami Koleji'nde eğitim aldı ve Barış Enstitüsü'nde Tafsir ve Hadis dersleri veriyor."
  id: "Seorang penulis dan pengajar yang mengkhususkan diri dalam Nama-nama Indah Allah; lulusan hukum dari London School of Economics dan University of California, Berkeley, meraih gelar PhD. Ia menulis buku \"Meditation on the Names of Allah\" (2020) dan buku catatan berpemandu \"The Beautiful Names of Allah.\" Ia adalah dosen di Yaqeen Institute for Islamic Research dan instruktur kursus di Dar Al-Burouj. Ia belajar di Cambridge Islamic College dan mengajar Tafsir serta Hadis di Institute for Peace."
