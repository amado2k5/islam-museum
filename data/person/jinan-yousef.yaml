summary:
  ar: "كاتبة ومدرّسة متخصصة في أسماء الله الحسنى؛ خريجة قانون من كلية لندن للاقتصاد وجامعة كاليفورنيا في بيركلي، وتحمل الدكتوراه. ألّفت كتاب «التأمل في أسماء الله» (2020) ودفتر «أسماء الله الحسنى» الموجَّه، وهي محاضِرة في معهد يقين للأبحاث الإسلامية ومدرّسة دورات لدى دار البروج، ودرست في كلية كامبريدج الإسلامية وتدرس التفسير والحديث في معهد السلام."
  en: "Writer and teacher specialising in the names of Allah. A law graduate of the London School of Economics and UC Berkeley who holds a PhD, she is the author of Reflecting on the Names of Allah (2020) and of the 99 Names of Allah guided journal. She is a Senior Fellow at the Yaqeen Institute, a course instructor for Al Buruj Press, studied at Cambridge Islamic College, and studies tafsir and hadith at Al-Salam Institute."
  ur: "اللہ کے ناموں پر تخصص رکھنے والی مصنفہ اور مدرسہ؛ لندن اسکول آف اکنامکس اور یو سی برکلے سے قانون کی گریجویٹ اور پی ایچ ڈی ہولڈر۔ «اسمائے الٰہی پر غور» (2020) اور «99 اسمائے الٰہی» رہنما جرنل کی مصنفہ ہیں، یقین انسٹی ٹیوٹ کی سینئر فیلو اور البروج پریس کی کورس انسٹرکٹر ہیں؛ کیمبرج اسلامک کالج میں پڑھا اور السلام انسٹی ٹیوٹ میں تفسیر و حدیث کی تعلیم حاصل کر رہی ہیں۔"
