summary:
  en: "The Sahmi notable whose withholding of a Zabidi merchant's due sparked the events leading to the Fudul pact — the confederates rose and wrested the man's right from him."
  fr: "Notable sahmite dont le refus de payer son dû à un marchand zubaydite déclencha les événements menant au pacte d’al-Fudul — les confédérés se levèrent et lui arrachèrent le droit de cet homme."
  ar: "وجيه سهمي اشترى بضاعة رجل من زبيد وحبس عنه حقه؛ فكان سبب مناشدة الزبيدي واجتماع حلف الفضول الذي انتزع منه الحق — فيما يروى الكتاب عن سبب الحلف."
  es: "El notable sahmi cuya retención de la parte que le correspondía a un comerciante zabidi desencadenó los acontecimientos que llevaron al pacto de Fudul, fue el responsable de que los confederados se alzaran y le arrebataran su derecho."
  ur: "ساہمی قابل ذکر جس کے ایک زبیدی سوداگر کے واجبات کو روکنے سے فدول معاہدے کی طرف جانے والے واقعات کو جنم دیا - کنفیڈریٹ اٹھے اور اس سے اس آدمی کا حق چھین لیا۔"
  tr: "Vajih Şahmi, Zubaydlı bir adamdan mal satın aldı ve hakkını ondan esirgedi. Bu, Zubaydlıların itirazının ve Hilf el-Fudul'un toplanmasının sebebiydi; kitapta ittifakın sebebi olarak anlatıldığı gibi, Hilf el-Fudul da hakkını ondan aldı."
  id: "Wajih Sahmi membeli barang dari seorang pria dari Zubayd dan menahan haknya. Inilah alasan pengajuan banding Zubayd dan pertemuan Hilf al-Fudul, yang mengambil hak tersebut darinya — sebagaimana buku ini menceritakan alasan persekutuan tersebut."
