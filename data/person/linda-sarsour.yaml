summary:
  ar: "ناشطة سياسية أمريكية من أصل فلسطيني، وُلدت في بروكلين بنيويورك سنة 1980 أكبرَ أبناء مهاجرين فلسطينيين. قادت الجمعية العربية الأمريكية في نيويورك، واكتسبت شهرة وطنية باعتراضها على مراقبة الشرطة للمسلمين الأمريكيين، ثم شاركت في رئاسة مسيرة النساء سنة 2017 فاختارتها مجلة تايم ضمن أكثر مئة شخصية تأثيرًا، وكانت المدعية الرئيسية في دعوى الطعن في حظر السفر الذي فرضته إدارة ترمب، وأسست منصة إم باور تشينج للتنظيم عبر الإنترنت."
  en: "American political activist of Palestinian descent, born in Brooklyn, New York, in 1980, the eldest of seven children of Palestinian immigrants. She led the Arab American Association of New York, first gained national attention protesting police surveillance of American Muslims, co-chaired the 2017 Women's March — after which Time named her and her co-chairs among its 100 most influential people — was lead plaintiff in the legal challenge to the Trump travel ban, and co-founded the MPOWER Change online organising platform."
  ur: "فلسطینی نژاد امریکی سیاسی کارکن، جو 1980 میں بروکلن، نیویارک میں فلسطینی مہاجر والدین کے سات بچوں میں سب سے بڑی اولاد کے طور پر پیدا ہوئیں۔ انھوں نے نیویارک کی عرب امریکن ایسوسی ایشن کی قیادت کی، امریکی مسلمانوں کی پولیس نگرانی کے خلاف احتجاج سے قومی شہرت پائی، 2017 کی ویمنز مارچ کی شریک صدر رہیں، ٹرمپ کے سفری پابندی کے خلاف مقدمے کی مرکزی مدعی رہیں، اور ایم پاور چینج آن لائن پلیٹ فارم کی شریک بانی ہیں۔"
  es: "Activista política estadounidense de ascendencia palestina, nacida en Brooklyn, Nueva York, en 1980, la mayor de siete hijos de inmigrantes palestinos. Dirigió la Asociación Árabe Americana de Nueva York, saltó a la fama nacional protestando contra la vigilancia policial a los musulmanes estadounidenses, copresidió la Marcha de las Mujeres de 2017 —tras la cual la revista Time la incluyó, junto con sus copresidentas, entre las 100 personas más influyentes—, fue una de las principales defensoras en la impugnación legal de la prohibición de viajar impuesta por Trump y cofundó la plataforma de organización en línea MPOWER Change."
  fr: "Militante politique américaine d'origine palestinienne, née à Brooklyn (New York) en 1980, elle est l'aînée d'une famille de sept enfants d'immigrants palestiniens. Elle a dirigé l'Association arabo-américaine de New York, s'est fait connaître sur la scène nationale en protestant contre la surveillance policière des musulmans américains, a coprésidé la Marche des femmes de 2017 – à la suite de laquelle le magazine Time l'a classée, ainsi que ses coprésidentes, parmi les 100 personnes les plus influentes –, a été l'une des principales figures de la contestation judiciaire du décret anti-immigration de Trump et a cofondé la plateforme d'organisation en ligne MPOWER Change."
  tr: "1980 yılında Brooklyn, New York'ta doğan Filistin kökenli Amerikalı bir siyasi aktivist, Filistinli göçmenlerin en büyük çocuğudur. New York'ta Arap Amerikan Derneği'nin lideriydi, Amerikan Müslümanlarının polis gözetimine karşı çıkmasıyla ulusal üne kavuştu, ardından 2017'de Time dergisinin onu en etkili 100 kişi arasında seçtiği Kadınlar Yürüyüşü'ne liderlik etti. Trump yönetiminin getirdiği seyahat yasağına itiraz eden davanın baş davacısıydı ve mPower Change çevrimiçi örgütlenme platformunu kurdu."
  id: "Seorang aktivis politik Amerika keturunan Palestina, lahir di Brooklyn, New York pada tahun 1980, anak sulung imigran Palestina. Ia memimpin Asosiasi Arab Amerika di New York, meraih ketenaran nasional karena menentang pengawasan polisi terhadap Muslim Amerika, kemudian ikut serta memimpin Women's March pada tahun 2017, di mana majalah Time memilihnya sebagai salah satu dari 100 orang paling berpengaruh. Ia menjadi penggugat utama dalam gugatan yang menantang larangan perjalanan yang diberlakukan oleh pemerintahan Trump, dan mendirikan platform organisasi online mPower Change."
