summary:
  ar: "ناشطة سياسية أمريكية من أصل فلسطيني، وُلدت في بروكلين بنيويورك سنة 1980 أكبرَ أبناء مهاجرين فلسطينيين. قادت الجمعية العربية الأمريكية في نيويورك، واكتسبت شهرة وطنية باعتراضها على مراقبة الشرطة للمسلمين الأمريكيين، ثم شاركت في رئاسة مسيرة النساء سنة 2017 فاختارتها مجلة تايم ضمن أكثر مئة شخصية تأثيرًا، وكانت المدعية الرئيسية في دعوى الطعن في حظر السفر الذي فرضته إدارة ترمب، وأسست منصة إم باور تشينج للتنظيم عبر الإنترنت."
  en: "American political activist of Palestinian descent, born in Brooklyn, New York, in 1980, the eldest of seven children of Palestinian immigrants. She led the Arab American Association of New York, first gained national attention protesting police surveillance of American Muslims, co-chaired the 2017 Women's March — after which Time named her and her co-chairs among its 100 most influential people — was lead plaintiff in the legal challenge to the Trump travel ban, and co-founded the MPOWER Change online organising platform."
  ur: "فلسطینی نژاد امریکی سیاسی کارکن، جو 1980 میں بروکلن، نیویارک میں فلسطینی مہاجر والدین کے سات بچوں میں سب سے بڑی اولاد کے طور پر پیدا ہوئیں۔ انھوں نے نیویارک کی عرب امریکن ایسوسی ایشن کی قیادت کی، امریکی مسلمانوں کی پولیس نگرانی کے خلاف احتجاج سے قومی شہرت پائی، 2017 کی ویمنز مارچ کی شریک صدر رہیں، ٹرمپ کے سفری پابندی کے خلاف مقدمے کی مرکزی مدعی رہیں، اور ایم پاور چینج آن لائن پلیٹ فارم کی شریک بانی ہیں۔"
