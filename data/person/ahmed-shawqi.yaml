summary:
  ar: "شاعر وكاتب مسرحي مصري (1868–1932)، لُقّب بـ«أمير الشعراء» سنة 1927 ويُعدّ أعظم شعراء المدرسة الاتباعية العربية. كان شاعر بلاط الخديوي، ونُفي إلى إسبانيا إبّان الحرب العالمية الأولى، وهو رائد المسرح الشعري العربي بمسرحيات مثل «مجنون ليلى» و«مصرع كليوباترا»، وخلّف ديوانه «الشوقيات»."
  en: "Egyptian poet and playwright (1868–1932), crowned 'Prince of Poets' (Amir al-Shu'ara) by his peers in 1927 and regarded as the greatest poet of the Arabic neoclassical movement. Court poet to the Khedives, he was exiled to Spain during the First World War; he pioneered poetic drama in Arabic with plays such as Majnun Laila and The Death of Cleopatra, and left his collected verse as al-Shawqiyyat."
  ur: "مصری شاعر اور ڈراما نگار (1868–1932)، جنہیں 1927 میں «امیر الشعرا» کا لقب ملا اور عربی کلاسیکی احیا کے سب سے بڑے شاعر مانا جاتا ہے۔ خدیو کے درباری شاعر رہے، پہلی جنگ عظیم میں اسپین جلاوطن ہوئے، «مجنون لیلیٰ» اور «مصرع کلیوپیٹرا» جیسے ڈراموں سے عربی شعری ڈرامے کی بنیاد رکھی اور ان کا دیوان «الشوقیات» یادگار ہے۔"
