id: person/sulayman-ibn-abd-al-malik
class: person
label: { ar: "سليمان بن عبد الملك" }
summary:
  ar: "خليفة أموي توفي في سنة تسع وتسعين بدابق، وذكر الطبري وفاته واستخلافه عمر بن عبد العزيز {cite:tabari-tarikh-abu-al-fadl j.6 p.546}، وبعض سيره {cite:tabari-tarikh-abu-al-fadl j.6 p.547}. وعند المسعودي بلغ الوليد عنه تمني موته فكتب يعتب عليه فأجابه والله لئن كنت تمنيت ذلك لما يخطر بالبال أني لأول لاحق به ومنعي إلى أهله فعلام أتمنى زوال مدة لا يلبث متمنيها إلا بقدر ما يحل السفر بمنزل، فكتب إليه الوليد ما أحسن ما اعتذرت به وأنت الصادق في المقال والكامل في الفعال {cite:muruj-al-dhahab p. 155-156}، وبويع بدمشق يوم توفي الوليد للنصف من جمادى الآخرة سنة ست وتسعين وتوفي بمرج دابق يوم الجمعة لعشر بقين من صفر سنة تسع وتسعين فكانت ولايته سنتين وثمانية أشهر وخمس ليال وهو ابن تسع وثلاثين سنة وعهد إلى عمر بن عبد العزيز، وخطب أول ما ولي الحمد لله الذي ما شاء صنع وما شاء أعطى وما شاء منع وأقر عمال من كان قبله، وكان صاحب أكل يجوز المقدار شبعه في اليوم مائة رطل بالعراقي وكان يمد يده من فراشه فلا تقع إلا على سلة حلوى، وفي أيامه عمل الوشي الجيد باليمن والكوفة والإسكندرية ولبس الناس الوشي جميعاً حتى طباخه وأمر أن يكفن في الوشي المثقلة، وعلا المنبر يوماً بمرآة ومخصرة فخطب وأعجبته نفسه فقال أنا الملك الشاب السيد المهاب الكريم الوهاب فسمع جارية تقول أنت نعم المتاع لو كنت تبقى غير أن لا بقاء للإنسان فخرج باكياً ولم يمكث بعدها إلا مديدة {cite:muruj-al-dhahab p. 164-166} ويذكر الكتاب أن سليمان قال في خطبته إنه عزل كل أمير كرهته رعيته، وولّى على كل بلد من أجمع عليه خياره، وأن نهجه كان يقوم على اللين واستشارة النصحاء، بخلاف نهج عبد الملك والوليد. ويعرض الكتاب ما ينقله الشيعة عن شراهته في الأكل ويرى أنه مبالغة لا تتفق مع سيرته، وأنه كان ينهى الناس عن الغناء. {cite:salabi-umayyad-state-2020 p.143-154} ويذكر الكتاب أن سليمان جعل عمر بن عبد العزيز مستشاراً ملازماً له، وأنه عزل عمال الحجاج بمشورته، وأمر بإقامة الصلاة في وقتها، وأنكر عمر عليه تحكيم كتاب أبيه في ميراث بعض بنات عبد العزيز، وأنه أعطى الناس مالاً في المدينة فقال له عمر إنه زاد أهل الغنى غنى وترك أهل الفقر، ونصحه برد المظالم قبل الصدقات. {cite:salabi-umayyad-state-2020 p.179-182} وتصفه دائرة المعارف الإسلامية بأنه الخليفة الأموي السابع ⁦(96–99هـ/715–717م)⁩، وُلد نحو 55هـ، وتولى جند فلسطين في عهد الوليد، وجهّز الحملة الكبرى على القسطنطينية التي انتهت بحصار فاشل، ومات بدابق."
  en: "Seventh Umayyad caliph (96-99 AH/715-717 CE), son of Abd al-Malik ibn Marwan. According to the Encyclopaedia of Islam, he was probably born in Medina about 55 AH, governed the district of Filastin under al-Walid, and acceded unchallenged in 96 AH. His reign saw the great campaign against Constantinople, which ended in an unsuccessful siege, and he died at Dabiq in 99 AH."
  ur: "بنو امیہ کے ساتویں خلیفہ ⁦(96 سے 99ھ/715 سے 717ء)⁩، عبد الملک بن مروان کے بیٹے۔ اسلامی انسائیکلوپیڈیا کے مطابق وہ غالباً مدینہ میں تقریباً 55ھ میں پیدا ہوئے، ولید کے دور میں جند فلسطین کے والی رہے اور 96ھ میں بلا مزاحمت تخت نشین ہوئے۔ ان کے دور میں قسطنطنیہ کے خلاف عظیم مہم ہوئی جو ناکام محاصرے پر ختم ہوئی، اور ان کی وفات دابق میں 99ھ میں ہوئی."
  es: "Séptimo califa omeya (96-99 AH/715-717 d. C.), hijo de Abd al-Malik ibn Marwan. Según la Enciclopedia del Islam, probablemente nació en Medina alrededor del año 55 AH, gobernó el distrito de Filastin bajo el reinado de al-Walid y ascendió al trono sin oposición en el año 96 AH. Durante su reinado se libró la gran campaña contra Constantinopla, que culminó en un asedio fallido, y murió en Dabiq en el año 99 AH."
  fr: "Septième calife omeyyade (96-99 AH/715-717 ap. J.-C.), fils d'Abd al-Malik ibn Marwan. Selon l'Encyclopédie de l'Islam, il serait né à Médine vers 55 AH, aurait gouverné le district de Filastin sous l'autorité d'al-Walid, et accédé au pouvoir sans contestation en 96 AH. Son règne fut marqué par la grande campagne contre Constantinople, qui s'acheva par un siège infructueux. Il mourut à Dabiq en 99 AH."
  tr: "Doksan doksan yılında Dabiq'te ölen bir Emevi halifesi. El-Taberi, onun ölümünden ve Ömer ibn Abdülaziz tarafından devralınmasından bahsetmiştir {atıf:tabari-tarikh-abu-al-fadl J.6 s.546} ve bazı biyografilerinden {atıf:tabari-tarikh-abu-al-fadl j.6 s.547}. El-Mes'udi, Velid'in ölümünü istediğini ve ona azarlayan bir mektup yazdığını bildirdi. Şöyle yanıtladı: \"Tanrı aşkına, eğer bunu dileseydim, onu ilk takip eden ve ailesine dönmemi engelleyen kişi olacağım aklıma gelmezdi. Neden sadece bir evin seyahatine izin verdiği sürece sona eren bir dönemin sonunu dileyim ki?\" Al-Velid ona şöyle yazdı: \"Özür dilediğin şey ne kadar mükemmel, ve sen sözde doğru, eylemde mükemmelsin\" {alıntı:Muruj-al-Dhahab, s. 155-156}. Doksan altıncı yılda Cumada'l-Ahhirah'ın ortasında el-Velid'in öldüğü gün Şam'da bağlılık yemini etti ve aynı gün Marj Dabiq'te öldü Cuma günü doksan doksan dokuz Sefer'in onuncusuna kadar, yani görev süresi iki yıl, sekiz ay ve beş gece sürdü. Otuz dokuz yaşındaydı ve Ömer bin Abdülaziz'e emanet edildi. Göreve başladığında ilk vaazlarını söyledi: Tanrı'ya şükürler olsun, istediğini yaptı, istediğini verdi, istediğini kesti. Önündeki işçileri onayladı. Günlük miktarı Irak'ta yüz poundla doyurabilen bir yiyecek sahibiydi ve yatağından elini uzatıp sadece bir sepet şeker üzerine düşerdi. Günlerinde Yemen'de iyi wushi yapardı. Kufa ve İskenderiye ve tüm halk yemeğe kadar washi giydi ve ağır washi giydirilmesini emretti. Bir gün ayna ve yelek ile kürsüye çıktı, vaaz verdi, kendine hayran kaldı ve dedi ki, 'Ben genç kral, hayranlık uyandıran efendi, cömert ve cömert hayırseverim.' Bir köle kızın, 'Sen değerli bir malsın, keşke kalsaydın, ama insan için kalıcı bir şey yoktur.' dediğini duydu. Ağlayarak ayrıldı ve uzun süre kalmadı. {atıf:Muruj-al-Dhahab, s. 164-166} Kitapta Süleyman'ın vaazında, tebaasının hoşlanmadığı her prensleri görevden aldığını, üzerinde anlaştığı her ülkeyi atadığını ve yaklaşımının Abd al-Malik ve al-Walid'in yaklaşımından farklı olarak yumuşaklık ve bilgeye danışmaya dayandığını söylediğini belirtir. Kitap, Şiilerin onun yeme açgözlülüğü hakkında anlattıklarını, bunun davranışlarıyla örtüşmeyen bir abartı olduğunu ve insanların şarkı söylemesini yasakladığını anlatır. {cite:Selabi-Umayyad-state-2020 s.143-154} Kitap, Süleyman'ın Ömer bin Abdülaziz'i yakın danışmanı olarak atadığını, hacı işçilerini kendi tavsiyesiyle işten çıkardığını, namazın zamanında yapılmasını emrettiğini ve babasının mektubundaki Abdulaziz'in bazı kızlarının mirasıyla ilgili keyfi kararını, yani Medine'de halka para verdiğini reddettiğini belirtir; bunun üzerine Ömer ona zenginlerin servetini artırdığını ve fakirleri bıraktığını söyler ve sadaka vermeden önce dertlerini ödemesini tavsiye eder. {cite:salabi-umayyad-state-2020 s.179-182} İslami Ansiklopedi, onu yaklaşık 55 Hicri doğumlu yedinci Emevi Halifesi (96–99 Hicri / 715–717 MS) olarak tanımlar; el-Velid'in saltanatı sırasında Filistin askerlerine liderlik etmiş ve başarısız bir kuşatmayla sonuçlanan büyük Konstantinopolis'e yönelik seferi hazırlamış ve Dabiq'te ölmüştür."
  id: "Seorang khalifah Umayyah yang meninggal pada tahun sembilan puluh sembilan di Dabiq. Al-Tabari menyebutkan kematian dan pewarisannya oleh Umar ibn Abd al-Aziz {cite:tabari-tarikh-abu-al-fadl J.6 hlm.546}, serta beberapa biografinya {cite:tabari-tarikh-abu-al-fadl j.6 hlm.547}. Al-Mas'udi melaporkan bahwa Al-Walid menginginkan kematiannya dan menulis surat menegurnya. Ia menjawab, \"Demi Tuhan, jika aku menginginkan itu, aku tidak akan terpikir bahwa aku akan menjadi yang pertama mengikutinya dan menghalangiku kembali ke keluarganya. Mengapa aku harus menginginkan berakhirnya masa yang hanya berlangsung selama sebuah rumah diizinkan bepergian?\" Al-Walid menulis kepadanya, \"Betapa hebatnya apa yang kau ajukan maaf, dan engkau adalah yang jujur dalam pernyataan itu dan sempurna dalam tindakan\" {cite:muruj-al-dhahab, hlm. 155-156}. Ia diikrarkan setia di Damaskus pada hari al-Walid wafat di tengah Jumada al-Akhirah pada tahun sembilan puluh enam, dan ia meninggal di Marj Dabiq pada hari yang sama Jumat hingga tanggal sepuluh Safar tahun sembilan puluh sembilan, jadi masa jabatannya berlangsung dua tahun, delapan bulan, dan lima malam. Ia berusia tiga puluh sembilan tahun dan dipercayakan kepada Umar ibn Abd al-Aziz. Ia pertama kali memberikan khotbah saat menjabat: Segala puji bagi Allah, yang melakukan apa pun yang Dia kehendaki, dan Dia memberikan apa pun yang Dia kehendaki, dan Dia menahan apa pun yang dikehendaki. Dia menyetujui para pekerja di hadapannya. Dia adalah pemilik makanan yang jumlah hariannya bisa dipenuhi seratus pound dalam bahasa Irak, dan dia akan mengulurkan tangan dari tempat tidurnya dan hanya jatuh di atas keranjang permen. Selama hari-harinya, dia membuat wushi yang baik di Yaman. Kufa dan Alexandria, serta seluruh rakyat mengenakan washi sampai mereka memasak, dan ia memerintahkan agar ia dibalut dengan washi berat. Suatu hari, ia naik ke mimbar dengan cermin dan rompi, lalu memberikan khotbah, dan ia mengagumi dirinya sendiri dan berkata, 'Akulah raja muda, tuan yang mengagumkan, dermawan dan dermawan yang murah hati.' Ia mendengar seorang budak perempuan berkata, 'Kamu adalah harta yang mulia, jika saja kau mau tinggal, tetapi tidak ada yang bertahan lama bagi manusia.' Ia pergi sambil menangis dan tidak tinggal sampai lama setelahnya. {cite:muruj-al-dhahab, hlm. 164-166} Kitab itu menyebutkan bahwa Suleiman berkata dalam khotbahnya bahwa ia memberhentikan setiap pangeran yang tidak disukai rakyatnya, menunjuk atas setiap negara yang ia sepakati, dan pendekatannya didasarkan pada kelembutan dan konsultasi dengan orang bijak, berbeda dengan pendekatan Abd al-Malik dan al-Walid. Buku ini menyajikan apa yang dilaporkan oleh Syiah tentang kerakusan makannya, yang ia anggap sebagai berlebihan yang tidak sesuai dengan perilakunya, dan bahwa ia dulu melarang orang bernyanyi. {cite:salabi-umayyad-state-2020 hlm.143-154} Buku tersebut menyebutkan bahwa Sulayman menunjuk Umar ibn Abd al-Aziz sebagai penasihat dekatnya, bahwa ia memberhentikan para pekerja peziarah atas sarannya, memerintahkan agar doa diadakan tepat waktu, dan Umar menolak keputusan sewenang-wenang dalam surat ayahnya mengenai warisan beberapa putri Abdul Aziz, bahwa ia telah memberikan uang kepada masyarakat di Madinah, sehingga Umar memberitahunya bahwa orang kaya telah menambah kekayaan dan meninggalkan yang miskin, serta menyarankan agar ia membayar kembali keluhan sebelum memberi sedekah. {cite:salabi-umayyad-state-2020 hlm.179-182} Ensiklopedia Islam menggambarkannya sebagai Khalifah Umayyah ketujuh (96–99 H / 715–717 M), lahir sekitar tahun 55 H, yang memimpin tentara Palestina selama masa pemerintahan al-Walid, dan mempersiapkan kampanye besar melawan Konstantinopel yang berakhir dengan pengepungan yang gagal, dan ia meninggal di Dabiq."

