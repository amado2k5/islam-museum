summary:
  ar: "خليفة أموي توفي في سنة تسع وتسعين بدابق، وذكر الطبري وفاته واستخلافه عمر بن عبد العزيز {cite:tabari-tarikh-abu-al-fadl j.6 p.546}، وبعض سيره {cite:tabari-tarikh-abu-al-fadl j.6 p.547}.، وعند المسعودي بلغ الوليد عنه تمني موته فكتب يعتب عليه فأجابه والله لئن كنت تمنيت ذلك لما يخطر بالبال أني لأول لاحق به ومنعي إلى أهله فعلام أتمنى زوال مدة لا يلبث متمنيها إلا بقدر ما يحل السفر بمنزل، فكتب إليه الوليد ما أحسن ما اعتذرت به وأنت الصادق في المقال والكامل في الفعال {cite:muruj-al-dhahab p. 155-156}"
