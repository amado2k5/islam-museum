id: person/sulayman-ibn-abd-al-malik
class: person
label: { ar: "سليمان بن عبد الملك" }
summary:
  ar: "خليفة أموي توفي في سنة تسع وتسعين بدابق، وذكر الطبري وفاته واستخلافه عمر بن عبد العزيز {cite:tabari-tarikh-abu-al-fadl j.6 p.546}، وبعض سيره {cite:tabari-tarikh-abu-al-fadl j.6 p.547}.، وعند المسعودي بلغ الوليد عنه تمني موته فكتب يعتب عليه فأجابه والله لئن كنت تمنيت ذلك لما يخطر بالبال أني لأول لاحق به ومنعي إلى أهله فعلام أتمنى زوال مدة لا يلبث متمنيها إلا بقدر ما يحل السفر بمنزل، فكتب إليه الوليد ما أحسن ما اعتذرت به وأنت الصادق في المقال والكامل في الفعال {cite:muruj-al-dhahab p. 155-156}، وبويع بدمشق يوم توفي الوليد للنصف من جمادى الآخرة سنة ست وتسعين وتوفي بمرج دابق يوم الجمعة لعشر بقين من صفر سنة تسع وتسعين فكانت ولايته سنتين وثمانية أشهر وخمس ليال وهو ابن تسع وثلاثين سنة وعهد إلى عمر بن عبد العزيز، وخطب أول ما ولي الحمد لله الذي ما شاء صنع وما شاء أعطى وما شاء منع وأقر عمال من كان قبله، وكان صاحب أكل يجوز المقدار شبعه في اليوم مائة رطل بالعراقي وكان يمد يده من فراشه فلا تقع إلا على سلة حلوى، وفي أيامه عمل الوشي الجيد باليمن والكوفة والإسكندرية ولبس الناس الوشي جميعاً حتى طباخه وأمر أن يكفن في الوشي المثقلة، وعلا المنبر يوماً بمرآة ومخصرة فخطب وأعجبته نفسه فقال أنا الملك الشاب السيد المهاب الكريم الوهاب فسمع جارية تقول أنت نعم المتاع لو كنت تبقى غير أن لا بقاء للإنسان فخرج باكياً ولم يمكث بعدها إلا مديدة {cite:muruj-al-dhahab p. 164-166}"
