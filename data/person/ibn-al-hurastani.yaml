id: person/ibn-al-hurastani
class: person
label: { ar: "ابن الحرستاني" }
summary:
  ar: "قاضي القضاة جمال الدين أبو القاسم عبد الصمد بن محمد بن أبي الفضل الأنصاري الخزرجي الدمشقي الشافعي المعروف بابن الحرستاني؛ ولد سنة عشرين وخمسمائة وسمع سنة خمس وعشرين من عبد الكريم بن حمزة وجمال الإسلام وطاهر بن سهل الإسفراييني والكبار ودرّس وأفتى وبرع في المذهب وانتهى إليه علو الإسناد وكان صالحاً عابداً من قضاة العدل؛ رحل إلى حلب وتفقه بها على أبي الحسن المرادي وناب في القضاء عن ابن أبي عصرون ثم ولي قضاء الشام في آخر عمره سنة اثنتي عشرة ودرس بالعزيزية وكان يجلس للحكم بالمجاهدية؛ قال أبو شامة حدثني الشيخ عز الدين بن عبد السلام أنه لم ير أفقه منه وعليه كان ابتداء اشتغاله، وكان يحفظ كتاب الوسيط للغزالي؛ ولما طلب للقضاء امتنع من الولاية حتى ألحوا عليه فيها وكان صارماً عادلاً على طريقة السلف في لباسه وعفته، بقي في القضاء سنتين وسبعة أشهر، واتفق أهل دمشق على أنه ما فاتته صلاة بجامع دمشق في جماعة إلا إذا كان مريضاً؛ توفي في رابع ذي الحجة سنة أربع عشرة وستمائة وهو ابن خمس وتسعين سنة {cite:shadharat-dhahab p. 60-61}."
  tr: "Baş yargıç Cemaleddin Ebu el-Kasım Abdül-Samad ibn Muhammed bin Ebi el-Fadl el-Ensari el-Hazraci el-Dimashqi el-Şafi'i, yani İbn el-Harastani idi; 520 Hicri yılında doğdu, 25. yılda Abdul Kerim bin Hamza, Cemalül-İslam, Tahir ibn Sahl el-İsfarayini ve yaşlılardan dinledi. Okudu, fetvalar verdi, düşünce okulunda üstün oldu, yüksek aktarım zincirine ulaştı ve adaletin adil ve dindar bir yargıcıydı. Halep'e seyahat etti, orada Ebu el-Hasan el-Muradi'nin yanında hukuk eğitimi aldı, İbn Ebu Eser Asrun'un yargı temsilcisi olarak görev yaptı ve ardından el-Şam'ın yargısını üstlendi. İlerleyen yıllarında on iki yaşındaydı, El-Aziziye'de eğitim gördü ve Mücahidiye'de yargıç olarak görev yaptı. Ebu Şama bana, Şeyh İzzeddin bin Abdülselam'ın kendisinden daha bilgili bir figür görmediğini söylediğini ve bunun çalışmasının başlangıcı olduğunu söyledi. El-Gazali'nin Al-Waseet kitabını ezberledi. Yargıç olması istendiğinde, onlar ısrar edene kadar göreve başlamayı reddetti. Selefilerin tarzına uygun olarak giyim ve iffet konusunda katı ve adil davrandı. İki yıl yedi ay boyunca yargıda kaldı. Şam halkı, hasta olmadıkça cemaatle Şam camiisinde namaz kılmadığı konusunda hemfikirdi; 604 Hicce yılının 4'ünde, doksan beş yaşında öldü {alıntı: Shadharat-Dhahab, s. 60-61}."
  id: "Ketua Mahkamah Agung adalah Jamal al-Din Abu al-Qasim Abd al-Samad ibn Muhammad ibn Abi al-Fadl al-Khazraji al-Khazraji al-Dimashqi al-Shafi'i, dikenal sebagai Ibn al-Harastani; lahir pada tahun 520 H, ia mendengar pada tahun 25 dari Abdul Karim ibn Hamza, Jamal al-Islam, Tahir ibn Sahl al-Isfarayini, dan para tetua. Ia belajar, mengeluarkan fatwa, unggul dalam aliran pemikiran, mencapai rantai transmisi tinggi, dan merupakan hakim keadilan yang benar dan taat. Ia pergi ke Aleppo, belajar hukum di sana di bawah bimbingan Abu al-Hasan al-Muradi, bertindak sebagai perwakilan yudisial untuk Ibn Abi Asrun, dan kemudian mengambil alih kehakiman al-Sham. Pada tahun-tahun terakhirnya, ia berusia dua belas tahun, dan ia belajar di Al-Aziziyah serta pernah menjabat sebagai hakim di Mujahidiyah. Abu Shama mengatakan kepada saya bahwa Sheikh Izz al-Din ibn Abd al-Salam mengatakan kepada saya bahwa ia tidak melihat sosok yang lebih berpengetahuan darinya, dan itulah awal dari pekerjaannya. Ia menghafal buku Al-Ghazali, Al-Waseet. Ketika diminta menjadi hakim, ia menolak menjabat sampai mereka memaksanya. Ia tegas dan adil sesuai cara Salafi dalam pakaian dan kesuciannya. Ia tetap di lembaga peradilan selama dua tahun tujuh bulan. Rakyat Damaskus sepakat bahwa ia tidak pernah melewatkan shalat di masjid Damaskus dalam jamaah kecuali saat sakit; ia meninggal pada tanggal 4 Dhu al-Hijjah tahun 604 H pada usia sembilan puluh lima {cite:shadharat-dhahab, hlm. 60-61}."
