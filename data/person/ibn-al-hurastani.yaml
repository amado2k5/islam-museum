id: person/ibn-al-hurastani
class: person
label: { ar: "ابن الحرستاني" }
summary:
  ar: "قاضي القضاة جمال الدين أبو القاسم عبد الصمد بن محمد بن أبي الفضل الأنصاري الخزرجي الدمشقي الشافعي المعروف بابن الحرستاني؛ ولد سنة عشرين وخمسمائة وسمع سنة خمس وعشرين من عبد الكريم بن حمزة وجمال الإسلام وطاهر بن سهل الإسفراييني والكبار ودرّس وأفتى وبرع في المذهب وانتهى إليه علو الإسناد وكان صالحاً عابداً من قضاة العدل؛ رحل إلى حلب وتفقه بها على أبي الحسن المرادي وناب في القضاء عن ابن أبي عصرون ثم ولي قضاء الشام في آخر عمره سنة اثنتي عشرة ودرس بالعزيزية وكان يجلس للحكم بالمجاهدية؛ قال أبو شامة حدثني الشيخ عز الدين بن عبد السلام أنه لم ير أفقه منه وعليه كان ابتداء اشتغاله، وكان يحفظ كتاب الوسيط للغزالي؛ ولما طلب للقضاء امتنع من الولاية حتى ألحوا عليه فيها وكان صارماً عادلاً على طريقة السلف في لباسه وعفته، بقي في القضاء سنتين وسبعة أشهر، واتفق أهل دمشق على أنه ما فاتته صلاة بجامع دمشق في جماعة إلا إذا كان مريضاً؛ توفي في رابع ذي الحجة سنة أربع عشرة وستمائة وهو ابن خمس وتسعين سنة {cite:shadharat-dhahab p. 60-61}."
