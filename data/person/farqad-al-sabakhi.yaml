summary:
  ar: "فرقد بن يعقوب السبخي، أبو يعقوب البصري، حائك، تابعي روى عن إبراهيم النخعي وأنس بن مالك؛ أجمع نقاد الحديث على ضعفه {cite:tahdhib-al-kamal-mizzi j.6 p.24}."
  en: "Farqad ibn Ya'qub al-Sabakhi, Abu Ya'qub of Basra, a weaver and Follower who narrated from Ibrahim al-Nakha'i and Anas ibn Malik; the hadith critics are unanimous on his weakness {cite:tahdhib-al-kamal-mizzi j.6 p.24}."
  es: "Farqad ibn Ya'qub al-Sabakhi, Abu Ya'qub de Basora, un tejedor y seguidor que narró de Ibrahim al-Nakha'i y Anas ibn Malik; Los críticos de los hadices son unánimes sobre su debilidad {citar: tahdhib-al-kamal-mizzi j.6 p.24}."
  fr: "Farqad ibn Ya'qub al-Sabakhi, Abu Ya'qub de Bassorah, un tisserand et disciple qui a raconté d'Ibrahim al-Nakha'i et Anas ibn Malik; les critiques des hadiths sont unanimes sur sa faiblesse {cite:tahdhib-al-kamal-mizzi j.6 p.24}."
  ur: "فرقد بن یعقوب السبخی، ابو یعقوب بصرہ، ایک بُنار اور پیروکار جنہوں نے ابراہیم النخعی اور انس بن مالک سے روایت کی ہے۔ حدیث کے ناقدین اس کی ضعیف پر متفق ہیں {حوالہ: تحذیب الکمال مزی ج6 ص24}۔"
  tr: "Farqad ibn Ya'qub al-Subkhi, Abu Ya'qub al-Basri, bir dokumacı, bir Tabi'i, İbrahim el-Nakha'i ve Anas ibn Malik'ten rivayet edilmiştir; hadis eleştirmenleri zayıflığı konusunda oybirliğiyle hemfikirdir {cite:tahdhib-al-kamal-mizzi j.6 s.24}."
  id: "Farqad ibn Ya'qub al-Subkhi, Abu Ya'qub al-Basri, seorang penenun, seorang Tabi'i, diceritakan dari Ibrahim al-Nakha'i dan Anas ibn Malik; para kritikus hadis sepakat bulat akan kelemahannya {cite:tahdhib-al-kamal-mizzi j.6 hlm.24}."
