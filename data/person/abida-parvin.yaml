summary:
  ar: "مغنية وملحنة باكستانية من السند ⁦(وُلدت 1954)⁩، تُلقّب بملكة الموسيقى الصوفية، تغني الكافي والغزل والقوالي بالأردية والسندية والبنجابية والعربية والفارسية من شعر بلھے شاہ وشاه عبد اللطيف وأمير خسرو، انطلقت في إذاعة باكستان في 1973، ونالت أرفع أوسمة باكستان المدنية، نشان امتياز (2021)."
  en: "Pakistani singer and composer from Sindh (born 1954), called the queen of Sufi music, who sings kafi, ghazal and qawwali in Urdu, Sindhi, Punjabi, Arabic and Persian to the verse of Bulleh Shah, Shah Abdul Latif and Amir Khusrau; she broke through on Radio Pakistan in 1973 and received Pakistan's highest civil award, the Nishan-e-Imtiaz, in 2021."
  ur: "سندھ کی پاکستانی گلوکارہ اور موسیقار ⁦(پیدائش 1954ء)⁩، جنھیں صوفی موسیقی کی ملکہ کہا جاتا ہے، جو بلھے شاہ، شاہ عبد اللطیف اور امیر خسرو کے کلام پر اردو، سندھی، پنجابی، عربی اور فارسی میں کافی، غزل اور قوالی گاتی ہیں؛ 1973ء میں ریڈیو پاکستان سے شہرت پائی اور 2021ء میں پاکستان کا اعلیٰ ترین سول اعزاز نشانِ امتیاز ملا۔"
