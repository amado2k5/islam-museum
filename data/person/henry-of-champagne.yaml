label: { ar: "الكندهري صاحب صور", en: "Henry, Count of Champagne", es: "Henry, Count of Champagne", fr: "Henry, Count of Champagne", ur: "ہنری، شیمپین کا شمار" }
summary:
  ar: "الكندهري، وكان ابن أخت ملك إفرنسيس من أبيه وابن أخت ملك إنكلتار من أمه؛ ولي صور بعد قتل المركيس سنة ثمان وثمانين وخمسمائة وتزوج الملكة في ليلته وهي حامل — وليس الحمل عندهم مما يمنع النكاح — وملك بلاد الفرنج بالساحل بعد عود ملك إنكلتار، وكان عاقلاً كثير المداراة والاحتمال؛ أرسل إلى صلاح الدين يستعطفه ويستميله طالباً خلعة وقال: أنت تعلم أن لبس القباء والشربوش عندنا عيب وأنا ألبسهما منك محبة لك، فأنفذ إليه خلعة سنية منها القباء والشربوش فلبسهما بعكا؛ وعاش إلى سنة أربع وتسعين وخمسمائة فسقط من سطح فمات {cite:kamil-ibn-al-athir p. 214}."
  en: "The Count of Champagne — nephew of both the French and English kings — took Tyre after the Marquis's killing and married the queen that very night though she was pregnant; ruling the coast after Richard's departure, a prudent and patient man who asked Saladin for a robe of honour, swearing he wore the qaba' and sharbush out of love for him though they were shameful in Frankish eyes — he wore them at Acre; died in 594 falling from a roof {cite:kamil-ibn-al-athir p. 214}."
  es: "El conde de Champaña —sobrino de los reyes francés e inglés— tomó Tiro tras el asesinato del marqués y se casó con la reina esa misma noche, a pesar de que ella estaba embarazada; gobernó la costa tras la partida de Ricardo, un hombre prudente y paciente que le pidió a Saladino una túnica de honor, jurando que vestía el qaba' y el sharbush por amor a él, aunque eran vergonzosos a los ojos francos; los usó en Acre; murió en 594 al caer de un tejado {cite:kamil-ibn-al-athir p. 214}."
  fr: "Le comte de Champagne, neveu des rois de France et d'Angleterre, prit Tyr après l'assassinat du marquis et épousa la reine le soir même, bien qu'elle fût enceinte; gouvernant la côte après le départ de Richard, homme prudent et patient, il demanda à Saladin une robe d'honneur, jurant qu'il portait la qaba' et le sharbush par amour pour lui, bien qu'ils fussent honteux aux yeux des Francs — il les porta à Acre; il mourut en 594 en tombant d'un toit {cite:kamil-ibn-al-athir p. 214}."
  ur: "دی کاؤنٹ آف شیمپین - فرانسیسی اور انگریز دونوں بادشاہوں کے بھتیجے - نے مارکوئس کے قتل کے بعد ٹائر کو لے لیا اور اسی رات ملکہ سے شادی کر لی حالانکہ وہ حاملہ تھی۔ رچرڈ کے جانے کے بعد ساحل پر حکمرانی کرنے والا، ایک ہوشیار اور صبر کرنے والا شخص جس نے صلاح الدین سے اعزاز کا لباس طلب کیا، قسم کھائی کہ اس نے قبا پہنا اور اس سے محبت کی وجہ سے شرمندہ ہو گیا حالانکہ وہ فرینک کی نظروں میں شرمناک تھے — اس نے انہیں ایکر میں پہنا تھا۔ 594ء میں چھت سے گر کر فوت ہو گئے۔ 214}۔"
