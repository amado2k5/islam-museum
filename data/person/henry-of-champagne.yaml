id: person/henry-of-champagne
class: person
label: { ar: "الكندهري صاحب صور", en: "Henry, Count of Champagne" }
summary:
  ar: "الكندهري، وكان ابن أخت ملك إفرنسيس من أبيه وابن أخت ملك إنكلتار من أمه؛ ولي صور بعد قتل المركيس سنة ثمان وثمانين وخمسمائة وتزوج الملكة في ليلته وهي حامل — وليس الحمل عندهم مما يمنع النكاح — وملك بلاد الفرنج بالساحل بعد عود ملك إنكلتار، وكان عاقلاً كثير المداراة والاحتمال؛ أرسل إلى صلاح الدين يستعطفه ويستميله طالباً خلعة وقال: أنت تعلم أن لبس القباء والشربوش عندنا عيب وأنا ألبسهما منك محبة لك، فأنفذ إليه خلعة سنية منها القباء والشربوش فلبسهما بعكا؛ وعاش إلى سنة أربع وتسعين وخمسمائة فسقط من سطح فمات {cite:kamil-ibn-al-athir p. 214}."
  en: "The Count of Champagne — nephew of both the French and English kings — took Tyre after the Marquis's killing and married the queen that very night though she was pregnant; ruling the coast after Richard's departure, a prudent and patient man who asked Saladin for a robe of honour, swearing he wore the qaba' and sharbush out of love for him though they were shameful in Frankish eyes — he wore them at Acre; died in 594 falling from a roof {cite:kamil-ibn-al-athir p. 214}."
