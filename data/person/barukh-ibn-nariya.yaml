summary:
  ar: "كاتب أرميا النبي، وجد المسعودي في السفر الذي أثبته نسباً لمعد بن عدنان إلى قيدر بن إسماعيل بن إبراهيم في نحو ثلاثين أباً غير ما في النسخ العربية، وقد كان لأرميا مع معد بن عدنان أخبار يطول ذكرها وما كان من أمرهما بالشام ذكره المسعودي في كتبه السالفة، وإنما أورده ليعلم تنازع الناس في ذلك {cite:muruj-al-dhahab p. 566}."
  en: "Jeremiah's scribe — in whose scroll al-Mas'udi found a thirty-name chain from Ma'add back to Qaydar son of Ishmael, diverging from every Arabic version — cited precisely to show the lineage's contention; Jeremiah's own dealings with Ma'add in Syria were told in his earlier books {cite:muruj-al-dhahab p. 566}."
  es: "El escriba de Jeremías —en cuyo rollo al-Mas'udi encontró una cadena de treinta nombres desde Ma'add hasta Qaydar hijo de Ismael, que diverge de todas las versiones árabes— citó precisamente para mostrar la controversia del linaje; los propios tratos de Jeremías con Ma'add en Siria fueron relatados en sus libros anteriores {cite:muruj-al-dhahab p. 566}."
  fr: "Le scribe de Jérémie — dans le rouleau duquel al-Mas'udi a trouvé une chaîne de trente noms allant de Ma'add à Qaydar fils d'Ismaël, divergeant de toutes les versions arabes — a cité précisément pour montrer la contestation de la lignée; les propres relations de Jérémie avec Ma'add en Syrie ont été racontées dans ses livres antérieurs {cite:muruj-al-dhahab p. 566}."
  ur: "یرمیاہ کا لکھاری — جس کے طومار میں المسعودی کو معد سے واپس اسماعیل کے بیٹے قایدر تک ایک تیس نام کا سلسلہ ملا، جو کہ ہر عربی نسخے سے ہٹ کر ہے — حسب نسب کے جھگڑے کو ظاہر کرنے کے لیے قطعی طور پر حوالہ دیا گیا ہے۔ شام میں معد کے ساتھ یرمیاہ کے اپنے معاملات کو اس کی پہلی کتابوں میں بیان کیا گیا تھا {حوالہ: مروج الذہب صفحہ۔ 566}۔"
