summary:
  ar: "كاتب أرميا النبي، وجد المسعودي في السفر الذي أثبته نسباً لمعد بن عدنان إلى قيدر بن إسماعيل بن إبراهيم في نحو ثلاثين أباً غير ما في النسخ العربية، وقد كان لأرميا مع معد بن عدنان أخبار يطول ذكرها وما كان من أمرهما بالشام ذكره المسعودي في كتبه السالفة، وإنما أورده ليعلم تنازع الناس في ذلك {cite:muruj-al-dhahab p. 566}."
  en: "Jeremiah's scribe — in whose scroll al-Mas'udi found a thirty-name chain from Ma'add back to Qaydar son of Ishmael, diverging from every Arabic version — cited precisely to show the lineage's contention; Jeremiah's own dealings with Ma'add in Syria were told in his earlier books {cite:muruj-al-dhahab p. 566}."
