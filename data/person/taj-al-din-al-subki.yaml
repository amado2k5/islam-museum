summary:
  ar: "قاضي القضاة تاج الدين عبد الوهاب بن تقي الدين السبكي ⁦(٧٢٧–٧٧١هـ/١٣٢٧–١٣٧٠م)⁩، فقيه شافعي وأصولي ومحدّث ومؤرخ؛ ولد بالقاهرة وقدم دمشق مع أبيه سنة ٧٣٩هـ فقرأ على المزي ولازم الذهبي وتخرج بابن رافع، وولي الأشرفية وخطابة الجامع وتوقيع الدست ثم قضاء دمشق في حياة أبيه، فامتُحن وعُزل وحُبس وأُعيد مراراً حتى انتهت إليه رياسة الشام، ومات بدمشق؛ من كتبه «طبقات الشافعية» الكبرى والوسطى والصغرى و«جمع الجوامع» و«الأشباه والنظائر» {cite:durar-kamina-jil-1993 2/425-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  en: "Qadi al-Qudat Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki (727–771/1327–1370), Shafi'i jurist, legal theorist, muhaddith and historian; born in Cairo, he moved to Damascus with his father in 739, read with al-Mizzi, attended al-Dhahabi and took his hadith diploma with Ibn Raf'a, then held the Ashrafiyya, the mosque preachership, the tawqi' al-dast and finally the judgeship of Damascus in his father's lifetime; he was tried, dismissed, imprisoned and restored several times until the headship of Syria was his, and died in Damascus. His works include the three Tabaqat al-Shafi'iyya, Jam' al-Jawami' and al-Ashbah wa-l-Naza'ir {cite:durar-kamina-jil-1993 2/425-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  ur: "قاضی القضاة تاج الدین عبد الوہاب بن تقی الدین سبکی ⁦(727–771ھ/1327–1370ء)⁩، شافعی فقیہ، اصولی، محدث اور مؤرخ؛ قاہرہ میں پیدا ہوئے، 739ھ میں والد کے ساتھ دمشق آئے، مزی سے پڑھا، ذہبی کی صحبت میں رہے اور ابن رافع سے تخرج کیا؛ اشرفیہ، جامع کی خطابت، توقیع دست اور پھر والد کی حیات میں دمشق کا قضاء ملا؛ کئی بار آزمائے گئے، معزول اور قید ہوئے اور بحال ہوئے یہاں تک کہ شام کی ریاست ان تک پہنچی، اور دمشق میں فوت ہوئے۔ تصانیف میں «طبقات الشافعیہ» کی تینوں اصناف، «جمع الجوامع» اور «الاشباہ والنظائر» ہیں {cite:durar-kamina-jil-1993 2/425-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}۔"
  es: "Qadi al-Qudat Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki (727–771/1327–1370), jurista shafi'í, teórico jurídico, muhaddith e historiador; nacido en El Cairo, se trasladó a Damasco con su padre en 739, estudió con al-Mizzi, asistió a al-Dhahabi y obtuvo su diploma de hadiz con Ibn Raf'a, luego ocupó el cargo de Ashrafiyya, el de predicador de la mezquita, el de tawqi' al-dast y finalmente el de juez de Damasco en vida de su padre; fue juzgado, destituido, encarcelado y restituido varias veces hasta que se convirtió en jefe de Siria, y murió en Damasco. Sus obras incluyen los tres Tabaqat al-Shafi'iyya, Jam' al-Jawami' y al-Ashbah wa-l-Naza'ir {cita:durar-kamina-jil-1993 2/425-427} {cita:encyclopaedia-of-islam-2 vol. 9p. 745}."
  fr: "Qadi al-Qudat Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki (727–771/1327–1370), juriste chaféite, théoricien du droit, muhaddith et historien; né au Caire, il s'installe à Damas avec son père en 739, étudie avec al-Mizzi, fréquente al-Dhahabi et obtient son diplôme de hadith avec Ibn Raf'a, puis occupe l'Ashrafiyya, la prédication de la mosquée, le tawqi' al-dast et enfin la charge de juge de Damas du vivant de son père; il est jugé, destitué, emprisonné et rétabli à plusieurs reprises jusqu'à ce que la direction de la Syrie lui revienne, et meurt à Damas. Ses œuvres incluent les trois Tabaqat al-Shafi'iyya, Jam' al-Jawami' et al-Ashbah wa-l-Naza'ir {cite:durar-kamina-jil-1993 2/425-427} {cite:encyclopaedia-of-islam-2 vol. 21h. 745}."
  tr: "Baş Yargıç Taceddin Abdülvahhab bin Taki al-Din el-Subki (727–771 Hicri / 1327–1370 M.S.), Şafii bir hukukçu, hukukçu, ilke alimi, hadis alimi ve tarihçiydi; Kahire'de doğdu, 739 Hicri yılında babasıyla birlikte Şam'a geldi, el-Mizzi'nin yanında eğitim aldı, el-Dhahabi'ye bağlı kaldı, İbn Rafi'den mezun oldu, caminin vaizi olarak görev yaptı, el-Dast'ın imzası oldu ve babasının yaşamı boyunca Şam'da yargıladı. Sınandı, görevden alındı, hapsedildi ve defalarca geri döndü, ta ki el-Şam valisi olana kadar. Şam'da öldü; kitapları arasında \"Tabaqat al-Shafi'iyyah\" (büyük, orta ve küçük biçimler), \"Jam' al-Jawami'\" ve \"Ashbah wa al-Naza'ir\" yer alır. Durar-Kamina-Jil-1993 2/425-427} {Cite:Encyclopaedia-of-Islam-2 cilt 9 s. 745}."
  id: "Ketua Hakim Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki (727–771 H / 1327–1370 M) adalah seorang ahli hukum Shafi'i, ahli hukum, ulama prinsip, ulama hadits, dan sejarawan; lahir di Kairo, ia datang ke Damaskus bersama ayahnya pada tahun 739 H, belajar di bawah bimbingan al-Mizzi, menganut al-Dhahabi, lulus bersama Ibn Rafi ', dan bertugas sebagai pengkhotbah masjid, tanda tangan al-Dast, dan kemudian mengadili Damaskus selama masa hidup ayahnya. Ia diuji, dipecat, dipenjara, dan berulang kali kembali hingga menjadi gubernur al-Sham. Ia meninggal di Damaskus; di antara bukunya terdapat \"Tabaqat al-Shafi'iyyah\" (bentuk utama, tengah, dan minor), \"Jam' al-Jawami',\" dan \"Ashbah wa al-Naza'ir\" {kutip: Durar-Kamina-jil-1993 2/425-427} {sitasi: Ensiklopedia-Dari-Islam-2 Vol. 9 hlm. 745}."
