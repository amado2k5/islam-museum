summary:
  ar: "قاضي القضاة تاج الدين عبد الوهاب بن تقي الدين السبكي (٧٢٧–٧٧١هـ/١٣٢٧–١٣٧٠م)، فقيه شافعي وأصولي ومحدّث ومؤرخ؛ ولد بالقاهرة وقدم دمشق مع أبيه سنة ٧٣٩هـ فقرأ على المزي ولازم الذهبي وتخرج بابن رافع، وولي الأشرفية وخطابة الجامع وتوقيع الدست ثم قضاء دمشق في حياة أبيه، فامتُحن وعُزل وحُبس وأُعيد مراراً حتى انتهت إليه رياسة الشام، ومات بدمشق؛ من كتبه «طبقات الشافعية» الكبرى والوسطى والصغرى و«جمع الجوامع» و«الأشباه والنظائر» {cite:durar-kamina-jil-1993 2/425-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  en: "Qadi al-Qudat Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki (727–771/1327–1370), Shafi'i jurist, legal theorist, muhaddith and historian; born in Cairo, he moved to Damascus with his father in 739, read with al-Mizzi, attended al-Dhahabi and took his hadith diploma with Ibn Raf'a, then held the Ashrafiyya, the mosque preachership, the tawqi' al-dast and finally the judgeship of Damascus in his father's lifetime; he was tried, dismissed, imprisoned and restored several times until the headship of Syria was his, and died in Damascus. His works include the three Tabaqat al-Shafi'iyya, Jam' al-Jawami' and al-Ashbah wa-l-Naza'ir {cite:durar-kamina-jil-1993 2/425-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}."
  ur: "قاضی القضاة تاج الدین عبد الوہاب بن تقی الدین سبکی (727–771ھ/1327–1370ء)، شافعی فقیہ، اصولی، محدث اور مؤرخ؛ قاہرہ میں پیدا ہوئے، 739ھ میں والد کے ساتھ دمشق آئے، مزی سے پڑھا، ذہبی کی صحبت میں رہے اور ابن رافع سے تخرج کیا؛ اشرفیہ، جامع کی خطابت، توقیع دست اور پھر والد کی حیات میں دمشق کا قضاء ملا؛ کئی بار آزمائے گئے، معزول اور قید ہوئے اور بحال ہوئے یہاں تک کہ شام کی ریاست ان تک پہنچی، اور دمشق میں فوت ہوئے۔ تصانیف میں «طبقات الشافعیہ» کی تینوں اصناف، «جمع الجوامع» اور «الاشباہ والنظائر» ہیں {cite:durar-kamina-jil-1993 2/425-427} {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}۔"
