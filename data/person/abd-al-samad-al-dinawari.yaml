id: person/abd-al-samad-al-dinawari
class: person
label: { ar: "أبو القاسم عبد الصمد بن علي الدينوري الواعظ", en: "Abu al-Qasim Abd al-Samad ibn Ali al-Dinawari, the preacher" }
summary:
  ar: "عبد الصمد بن عمر بن علي بن إسحاق أبو القاسم الدينوري الواعظ الزاهد، قرأ القرآن ودرس فقه الشافعي على أبي سعيد الاصطخري وسمع الحديث من أبي بكر النجاد وروى عنه الأزجي والصيمري، ولزم طريقة يضرب بها المثل من مجاهدة النفس والتقشف والأمر بالمعروف. وكان يدق السعد في العطارين فسمع عطاراً يهودياً يقول لابنه إنه جرب المسلمين فما وجد فيهم ثقة، فاستأجر نفسه لحفظ دكانه على ثلاثة أرطال خبز ودرهمين كل يوم وأعمل معه سنة بلا خيانة ثم قال له إني ما أردت العمل معك وإنما سمعتك تقول لولدك إنك لم تر في المسلمين أميناً فأردت أن أكذب قولك، فأخبره واشتهر دينه عند الناس وانقطع إلى الوعظ. توفي بدرب شماس من نهر القلائين بالجانب الغربي يوم الثلاثاء لسبع بقين من ذي الحجة سنة سبع وتسعين ودفن بمقبرة الإمام أحمد {cite:muntazam-ibn-al-jawzi j.7 p.235-236}."
  en: "Abd al-Samad ibn Umar ibn Ali ibn Ishaq, Abu al-Qasim al-Dinawari, a preacher and ascetic. He recited the Qur'an and studied Shafi'i jurisprudence under Abu Sa'id al-Istakhri, and heard hadith from Abu Bakr al-Najjad; al-Azji and al-Sayyimari transmitted from him. He kept to a way of life proverbial for striving against the self, austerity and enjoining good. He used to pound galingale (sa'd) for the perfumers. He heard a Jewish perfumer tell his son that he had tested the Muslims and found no one trustworthy among them, so he hired himself to guard the man's shop for three ratls of bread and two dirhams a day, and served him for a year without betrayal. Then he told him that he had not wanted to work for him, but had heard him say to his son that he had found no honest man among the Muslims, and he wished to prove those words wrong; he informed him of his faith, and his piety became famous among the people, and he devoted himself to preaching. He died in Darb Shammas, by the Nahr al-Qala'in on the western side, on Tuesday, seven days before the end of Dhu al-Hijja of the year 397, and was buried in the cemetery of Imam Ahmad {cite:muntazam-ibn-al-jawzi j.7 p.235-236}."
