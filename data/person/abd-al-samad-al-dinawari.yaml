id: person/abd-al-samad-al-dinawari
class: person
label: { ar: "أبو القاسم عبد الصمد بن علي الدينوري الواعظ", en: "Abu al-Qasim Abd al-Samad ibn Ali al-Dinawari, the preacher", fr: "Abu al-Qasim Abd al-Samad ibn Ali al-Dinawari, le prédicateur", es: "Abu al-Qasim Abd al-Samad ibn Ali al-Dinawari, the preacher" }
summary:
  ar: "عبد الصمد بن عمر بن علي بن إسحاق أبو القاسم الدينوري الواعظ الزاهد، قرأ القرآن ودرس فقه الشافعي على أبي سعيد الاصطخري وسمع الحديث من أبي بكر النجاد وروى عنه الأزجي والصيمري، ولزم طريقة يضرب بها المثل من مجاهدة النفس والتقشف والأمر بالمعروف. وكان يدق السعد في العطارين فسمع عطاراً يهودياً يقول لابنه إنه جرب المسلمين فما وجد فيهم ثقة، فاستأجر نفسه لحفظ دكانه على ثلاثة أرطال خبز ودرهمين كل يوم وأعمل معه سنة بلا خيانة ثم قال له إني ما أردت العمل معك وإنما سمعتك تقول لولدك إنك لم تر في المسلمين أميناً فأردت أن أكذب قولك، فأخبره واشتهر دينه عند الناس وانقطع إلى الوعظ. توفي بدرب شماس من نهر القلائين بالجانب الغربي يوم الثلاثاء لسبع بقين من ذي الحجة سنة سبع وتسعين ودفن بمقبرة الإمام أحمد {cite:muntazam-ibn-al-jawzi j.7 p.235-236}."
  en: "Abd al-Samad ibn Umar ibn Ali ibn Ishaq, Abu al-Qasim al-Dinawari, a preacher and ascetic. He recited the Qur'an and studied Shafi'i jurisprudence under Abu Sa'id al-Istakhri, and heard hadith from Abu Bakr al-Najjad; al-Azji and al-Sayyimari transmitted from him. He kept to a way of life proverbial for striving against the self, austerity and enjoining good. He used to pound galingale (sa'd) for the perfumers. He heard a Jewish perfumer tell his son that he had tested the Muslims and found no one trustworthy among them, so he hired himself to guard the man's shop for three ratls of bread and two dirhams a day, and served him for a year without betrayal. Then he told him that he had not wanted to work for him, but had heard him say to his son that he had found no honest man among the Muslims, and he wished to prove those words wrong; he informed him of his faith, and his piety became famous among the people, and he devoted himself to preaching. He died in Darb Shammas, by the Nahr al-Qala'in on the western side, on Tuesday, seven days before the end of Dhu al-Hijja of the year 397, and was buried in the cemetery of Imam Ahmad {cite:muntazam-ibn-al-jawzi j.7 p.235-236}."
  fr: "Abd al-Samad ibn Umar ibn Ali ibn Ishaq, Abu al-Qasim al-Dinawari, prédicateur et ascète. Il récita le Coran et étudia la jurisprudence shafi'ite auprès d'Abu Sa'id al-Istakhri, et entendit le hadith d'Abu Bakr al-Najjad ; al-Azji et al-Sayyimari transmirent de lui. Il suivit une voie proverbiale pour la lutte contre l'âme, l'austérité et la commanderie du bien. Il pilait du souchet (sa'd) pour les parfumeurs. Il entendit un parfumeur juif dire à son fils qu'il avait mis les musulmans à l'épreuve et n'avait trouvé parmi eux personne de digne de confiance ; il se loua alors pour garder la boutique de cet homme pour trois ratls de pain et deux dirhams par jour, et le servit un an sans trahison. Puis il lui dit qu'il n'avait pas voulu travailler pour lui, mais qu'il l'avait entendu dire à son fils qu'il n'avait trouvé aucun homme honnête parmi les musulmans, et qu'il avait voulu démentir ces paroles ; il lui fit connaître sa foi, sa piété devint célèbre parmi les gens, et il se consacra à la prédication. Il mourut au Darb Shammas, près du Nahr al-Qala'in, sur la rive occidentale, un mardi, sept jours avant la fin de dhu al-hijja de l'an 397, et fut inhumé au cimetière de l'imam Ahmad {cite:muntazam-ibn-al-jawzi j.7 p.235-236}."
  es: "Abd al-Samad ibn Umar ibn Ali ibn Ishaq, Abu al-Qasim al-Dinawari, fue un predicador y asceta. Recitaba el Corán y estudiaba jurisprudencia shafi'í con Abu Sa'id al-Istakhri, y escuchó hadices transmitidos por Abu Bakr al-Najjad, al-Azji y al-Sayyimari. Llevaba una vida ejemplar, caracterizada por la lucha contra el ego, la austeridad y la práctica del bien. Solía moler galanga (sa'd) para los perfumistas. Un perfumista judío le contó a su hijo que había puesto a prueba a los musulmanes y no había encontrado a nadie de confianza, así que se ofreció como guardia de la tienda del hombre por tres ratls de pan y dos dirhams al día, y le sirvió durante un año sin traicionarlo. Entonces le dijo que no había querido trabajar para él, pero que lo había oído decir a su hijo que no había encontrado a ningún hombre honesto entre los musulmanes, y que deseaba demostrar que esas palabras eran falsas; le habló de su fe, y su piedad se hizo famosa entre la gente, y se dedicó a predicar. Murió en Darb Shammas, junto al Nahr al-Qala'in, en el lado occidental, un martes, siete días antes del final de Dhu al-Hijja del año 397, y fue enterrado en el cementerio del Imam Ahmad {cite:muntazam-ibn-al-jawzi j.7 p.235-236}."
