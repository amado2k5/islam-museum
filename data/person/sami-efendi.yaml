  note: "Born in the Haydarhâne quarter of Fatih, Istanbul, on 16 Dhu al-Hijja 1253, which the TDV İslâm Ansiklopedisi entry converts to 13 March 1838; the English article's text and Wikidata agree. The Turkish article gives 1837 and the Arabic article glosses the same Hijri date as 1837, and the English article's lead line misprints his years as 1858–1912. The record follows 1838, the conversion of the recorded Hijri date given by the scholarly entry, with the 1837 gloss disclosed. The Hijri year 1253 is the sources' own."
