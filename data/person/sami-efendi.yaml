  note: "Died at his home in Horhor, Fatih, Istanbul, on 1 July 1912, after a final year of paralysis, and was buried the next day in the hazire of the Fatih Mosque, as the TDV entry records; his tombstone inscription was written by his student Hacı Kâmil Efendi (Akdik). The Hijri year 1330 is the Arabic article's own."
