summary:
  ar: "خطاط عثماني (1838–1912)، من آخر كبار أساتذة الجلي تعليق والجلي ثلث؛ أعطى طغراء السلطان صورتها النهائية في عصر عبد الحميد الثاني، ودرّس الخط سنوات طويلة في قصر طوب قابي، ومن تلاميذه كامل أكديك وحسن رضا أفندي."
  en: "Ottoman calligrapher (1838–1912), the last great master of jali ta'liq and jali thuluth. He gave the sultan's tughra its definitive form in the reign of Abdülhamid II, taught calligraphy for many years at the Topkapi Palace, and counted Kâmil Akdik and Hasan Rıza Efendi among his students."
  ur: "عثمانی خطاط (1838–1912)، جلی تعلیق اور جلی ثلث کے آخری بڑے استاد۔ انہوں نے عبد الحمید ثانی کے دور میں سلطان کے طغرا کو اس کی نهایی صورت دی، برسوں طوپ قاپی محل میں خطاطی سکھائی، اور کامل آکدک اور حسن رضا آفندی ان کے شاگردوں میں سے تھے۔"
