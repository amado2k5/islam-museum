summary:
  ar: "روكسانا مصيلحي عالمة وبائيات وراثية إيرانية المولد نشأت في كندا، وأستاذة مشاركة في علم الوبائيات والإحصاء الحيوي في جامعة ألباني. تبحث في الأسباب الوراثية والبيئية للسرطان، ومنها سرطان المبيض والثدي وسرطانات العين الناجمة عن الإشعاع، وفي جينوميات متلازمة التعب المزمن ومضاعفات الحمل. أخذت درجاتها من جامعة كولومبيا البريطانية وأتمت زمالة ما بعد الدكتوراه في المعاهد الوطنية للصحة الأمريكية."
  en: "Roxana Moslehi is an Iranian-born genetic epidemiologist, raised in Canada and an associate professor of epidemiology and biostatistics at the University at Albany. Her research concerns the genetic and environmental causes of cancer — ovarian and breast cancer and radiation-induced eye cancers among them — and the genomics of myalgic encephalomyelitis/chronic fatigue syndrome and gestational complications. She took her degrees at the University of British Columbia and held a postdoctoral fellowship at the National Institutes of Health."
  ur: "رکسانا مصلحی ایرانی نژاد جینیاتی وبائیات دان ہیں، کینیڈا میں پلی بڑھیں اور یونیورسٹی ایٹ البانی میں وبائیات و حیاتی شماریات کی ایسوسی ایٹ پروفیسر ہیں۔ ان کی تحقیق سرطان کے جینیاتی و ماحولیاتی اسباب، از جملہ بیضہ دانی و چھاتی کے سرطان اور شعاعوں سے پیدا ہونے والے آنکھ کے سرطان، اور دائمی تھکاوٹ کے سنڈروم اور حمل کی پیچیدگیوں کی جینومکس پر ہے۔ انہوں نے اپنی تعلیم یونیورسٹی آف برٹش کولمبیا سے حاصل کی اور امریکی نیشنل انسٹی ٹیوٹس آف ہیلتھ میں پوسٹ ڈاکٹریٹ فیلوشپ مکمل کی۔"
