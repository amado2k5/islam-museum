summary:
  ar: "بدر الدين أبو المعالي السعدي المصري الحنبلي شيخ الإسلام الإمام العلامة الرحلة؛ ولد بالقاهرة سنة خمس أو ست وثلاثين وثمانمائة وسمع على الحافظ ابن حجر وغيره واشتغل في الفقه على عالم الحنابلة جمال الدين ابن هشام ولازمه ثم لازم العز الكناني وجد واجتهد وقرأ كثيراً من العلوم وحققها وحصل أنواعاً من الفنون وأتقنها وبرع في المذهب وصار من أعيانه وأخذ عن علماء الديار المصرية وغيرهم ممن ورد إلى القاهرة وأتقن العربية وغيرها من العلوم الشرعية والعقلية وتميز وفاق أقرانه ولزم خدمة شيخه القاضي عز الدين وفضل عليه فاستخلفه في الأحكام الشرعية وهو شاب ابن خمس وعشرين سنة أو نحوها وأذن له في الإفتاء والتدريس وشهد بأهليته وندبه للوقائع المهمة والأمور المشكلة فساد على أبناء جنسه وعظم أمره وعلا شأنه واشتهر صيته وفقيه ودرس وحج وقرأ على القاضي علاء الدين المرداوي كتابه الإنصاف ولازمه فشهد بفضله وأذن له بالإفتاء والتدريس أيضاً وباشر نيابة الحكم أكثر من خمس عشرة سنة وصار مفتي دار العدل وكانت مباشرته بعفة ونزاهة ثم ولي قضاء القضاة بالديار المصرية بعد موت شيخه العز الكناني وسلك أحسن الطرق من النزاهة والعفة حتى في قبول الهدية وصنف مناسك الحج على الصحيح من المذهب وهو كتاب في غاية الحسن، ذكره تلميذه العليمي في طبقاته وهو آخر من ذكرهم فيها، توفي فجأة ليلة الثلاثاء ثالث ذي القعدة سنة تسع وتسعين وثمانمائة {cite:shadharat-dhahab p. 366-367}."
  en: "Badr al-Din al-Sa'di (b. Cairo ~835) — 'shaykh al-Islam, the travelled 'allama': Ibn Hajar's hearer, Ibn Hisham's pupil, al-'Izz al-Kinani's deputy at twenty-five and his successor as Egypt's chief qadi, mufti of dar al-'adl, author of a praised Manasik al-Hajj — al-'Ulaymi's last tabaqat entry; died suddenly Tuesday night 3 Dhu'l-Qa'da 899 {cite:shadharat-dhahab p. 366-367}."
