  ur: "مصری یونیورسٹی میں لاگو ریاضی کے پروفیسر، پی ایچ ڈی اور لندن یونیورسٹی کے ڈی ایس سی، جنہوں نے محمد مرسی احمد کے ساتھ الخوارزمی کے الجبرا کے 1939 کے قاہرہ ایڈیشن کو متعارف کرایا اور اس کی تشریح کی۔"
