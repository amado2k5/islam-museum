summary:
  ar: "علاء الدين علي بن عثمان المارديني، المعروف بابن التركماني، فقيه حنفي من أهل مصر، تولى قضاء الحنفية بالديار المصرية، وأفتى ودرّس وصنّف في الفقه والأصول. من كتبه «الكفاية في مختصر الهداية»، و«مقدمة في أصول الفقه»، و«تخريج أحاديث الهداية». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1599}"
  en: "Ala' al-Din Ali ibn Uthman al-Mardini, known as Ibn al-Turkumani, a Hanafi jurist from Egypt who held the Hanafi judgeship there and taught, issued fatwas and wrote on law and usul al-fiqh. His works include al-Kifaya fi mukhtasar al-Hidaya, an introduction to usul al-fiqh, and a takhrij of the hadiths of the Hidaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1599}"
