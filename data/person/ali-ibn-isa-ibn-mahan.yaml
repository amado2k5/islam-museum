id: person/ali-ibn-isa-ibn-mahan
class: person
label: { ar: "علي بن عيسى بن ماهان" }
summary:
  ar: "أمير الأمين، ولاه بلاد الجبال سنة خمس وتسعين فخرج بأربعين ألفاً لقتال المأمون وأخذ معه قيد فضة ليقيد به المأمون بزعمه فهزمه طاهر بن الحسين في أقل من أربعة آلاف وذبح وحملت رأسه إلى المأمون فطيف بها في خراسان {cite:tarikh-khulafa-minhaj-1434 p. 475}. وعند المسعودي أصيب على باب قصره بخراسان في صبيحة الليلة التي قتل فيها جعفر مكتوب إن المساكين بنو برمك صبت عليهم غير الدهر إن لنا في أمرهم عبرة فليعتبر ساكن هذا القصر {cite:muruj-al-dhahab p. 366}، وقال في طاهر ما هو إلا شوكة من أغصاني وشرارة من ناري وما بينه وبين الموت إلا أن تقع عينه على سوادكم، فلما دنت عساكره من الري عدل إلى رستاق فهزمه طاهر وذبحه رجل يعرف بطاهر بن الراجي وتنازعوا في خاتمه ورأسه {cite:muruj-al-dhahab p. 375-376}"
  en: "Al-Amin's commander, given the mountain lands in 195; he marched with forty thousand to fight al-Ma'mun carrying a silver shackle for him, and was routed by Tahir ibn al-Husayn with under four thousand — slaughtered, his head paraded through Khurasan {cite:tarikh-khulafa-minhaj-1434 p. 475}."
  es: "El comandante de Al-Amin, a quien se le concedieron las tierras montañosas en 195, marchó con cuarenta mil hombres para luchar contra al-Ma'mun llevando un grillete de plata para él, y fue derrotado por Tahir ibn al-Husayn con menos de cuatro mil; fue masacrado y su cabeza desfiló por Jorasán {cite:tarikh-khulafa-minhaj-1434 p. 475}."
  fr: "Le commandant d'Al-Amin, à qui l'on avait donné les terres montagneuses en 195; il marcha avec quarante mille hommes pour combattre al-Ma'mun portant une chaîne d'argent pour lui, et fut mis en déroute par Tahir ibn al-Husayn avec moins de quatre mille hommes — massacrés, sa tête promenée à travers le Khorasan {cite:tarikh-khulafa-minhaj-1434 p. 475}."
  ur: "الامین کے کمانڈر کو 195 میں پہاڑی زمین دی گئی۔ اس نے چالیس ہزار کے ساتھ مامون سے لڑنے کے لیے اس کے لیے چاندی کا طوق لے کر روانہ کیا، اور طاہر بن الحسین نے چار ہزار سے کم کے ساتھ اس کا مقابلہ کیا - ذبح کیا گیا، اس کا سر خراسان سے گزرا۔ 475}۔"
  tr: "Emir el-Amin, doksan beşinci yılda onu dağlara atadı, ardından kırk bin kişiyle el-Memun'a karşı savaşmaya çıktı ve yanında gümüş bir kelepçe alarak el-Me'mun'a bağladı. Tahir ibn el-Hüseyin onu dört binden az bir adamla yendi, katletti ve başını el-Memun'a götürdü, o da Horasan'a götürdü {atıf:Tarikh-khulafa-minhaj-1434, s. 475}. El-Mes'udi'de, Ja'far'ın öldürüldüğü gece sabahı Horasan'daki sarayının kapısında yaralandı. Zavallı Banu Barmak'ın üzerine sadece zamanın geldiği yazılır. Gerçekten de onların işlerinde bir ders vardır. Bu sarayın sakinleri düşünülsün. {atıf:Muruj-al-Dhahab, s. 366} ve Tahir hakkında şöyle dedi: Tahir sadece dallardan çıkan bir diken ve ateşimden bir kıvılcımdır, onunla ölüm arasında ise gözü senin karanlığına takılıyor. Askerleri Rayy'ye yaklaştığında, Rustaq'a döndü, fakat Tahir onu yendi ve Tahir ibn al-Raji olarak bilinen bir adam tarafından katledildi. Yüzüğü ve başı üzerinde tartıştılar {cite:muruj-al-dhahab s. 375-376}"
  id: "Amir al-Amin menunjuknya ke pegunungan pada tahun sembilan puluh lima, lalu pergi dengan empat puluh ribu untuk melawan al-Ma'mun, membawa borgol perak untuk mengikatnya menurut al-Ma'mun. Tahir ibn al-Husayn mengalahkannya dalam waktu kurang dari empat ribu, membantainya, dan membawa kepalanya ke al-Ma'mun, yang membawanya ke Khurasan {cite:Tarikh-khulafa-minhaj-1434, hlm. 475}. Di Al-Mas'udi, ia terluka di pintu istananya di Khurasan pada pagi malam Ja'far dibunuh. Tertulis bahwa Banu Barmak yang malang hanya ditumpahkan oleh waktu. Memang, ada pelajaran dalam urusan mereka. Mari kita pertimbangkan penghuni istana ini. {cite:muruj-al-dhahab, hlm. 366}, dan ia berkata tentang Tahir bahwa ia hanyalah duri dari ranting dan percikan api dari apiku, dan di antara dia dan kematian adalah matanya jatuh pada kegelapanmu. Ketika pasukannya mendekati Rayy, ia berbalik ke Rustaq, tetapi Tahir mengalahkannya dan membantainya oleh seorang pria bernama Tahir ibn al-Raji. Mereka berdebat tentang cincin dan kepalanya {cite:muruj-al-dhahab hlm. 375-376}"
