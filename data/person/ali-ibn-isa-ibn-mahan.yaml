id: person/ali-ibn-isa-ibn-mahan
class: person
label: { ar: "علي بن عيسى بن ماهان" }
summary:
  ar: "أمير الأمين، ولاه بلاد الجبال سنة خمس وتسعين فخرج بأربعين ألفاً لقتال المأمون وأخذ معه قيد فضة ليقيد به المأمون بزعمه فهزمه طاهر بن الحسين في أقل من أربعة آلاف وذبح وحملت رأسه إلى المأمون فطيف بها في خراسان {cite:tarikh-khulafa-minhaj-1434 p. 475}. وعند المسعودي أصيب على باب قصره بخراسان في صبيحة الليلة التي قتل فيها جعفر مكتوب إن المساكين بنو برمك صبت عليهم غير الدهر إن لنا في أمرهم عبرة فليعتبر ساكن هذا القصر {cite:muruj-al-dhahab p. 366}، وقال في طاهر ما هو إلا شوكة من أغصاني وشرارة من ناري وما بينه وبين الموت إلا أن تقع عينه على سوادكم، فلما دنت عساكره من الري عدل إلى رستاق فهزمه طاهر وذبحه رجل يعرف بطاهر بن الراجي وتنازعوا في خاتمه ورأسه {cite:muruj-al-dhahab p. 375-376}"
  en: "Al-Amin's commander, given the mountain lands in 195; he marched with forty thousand to fight al-Ma'mun carrying a silver shackle for him, and was routed by Tahir ibn al-Husayn with under four thousand — slaughtered, his head paraded through Khurasan {cite:tarikh-khulafa-minhaj-1434 p. 475}."
