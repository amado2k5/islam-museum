label: { ar: "محمد بن الأشعث الكندي", en: "Muhammad ibn al-Ash'ath al-Kindi" }
summary:
  ar: "محمد بن الأشعث بن قيس الكندي؛ ولاه عبيد الله بن زياد طبرستان فصالحهم وعقد لهم عقداً فأمهلوا له حتى دخل ثم أخذوا عليه المضايق وقتلوا ابنه أبا بكر وفضخوه ونجا هو.، وعند المسعودي سأله ابن زياد عن مسلم بن عقيل عند هانئ بن عروة فأنكره، ثم أعطاه الأمان حين قاتل وحده وسلبه سيفه وسلاحه، وفيه قال الشاعر وتركت عمك أن تقاتل دونه فشلاً وقتلت وافد آل بيت محمد وسلبت أسيافاً له ودروعاً {cite:muruj-al-dhahab p. 56-57}"
  en: "Muhammad ibn al-Ash'ath ibn Qays al-Kindi; Ubaydallah ibn Ziyad's governor of Tabaristan — he treated and covenanted, they let him in, seized the narrows, killed his son Abu Bakr and crushed his skull, and he escaped."
