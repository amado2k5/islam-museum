summary:
  ar: "قائد الروم؛ سار سنة 315هـ في جيش عظيم إلى مدينة دبيل ومعه دبابات ومجانيق ومزارق يزرق بالنار عدّة اثني عشر رجلاً فلا يقوم بين يديه أحد، وخرجت سرية من طرسوس فوقع عليها العدو فاستظهر الروم وأسروا من المسلمين أربعمائة رجل فقتلوهم صبراً {cite:kamil-ibn-al-athir p. 130}."
  en: "The Byzantine Domestic; in 315 he marched on Dabil with siege-towers, mangonels and naphtha-tubes, while raiders cut down a Tarsus squadron and slaughtered four hundred captives {cite:kamil-ibn-al-athir p. 130}."
  fr: "Domestique byzantin ; en 315 H, il marcha sur Dabil avec tours de siège, mangonneaux et tubes à naphte, tandis que des assaillants taillaient en pièces un escadron de Tarse et massacraient quatre cents captifs {cite:kamil-ibn-al-athir p. 130}."
  es: "El Imperio Bizantino; en 315 marchó sobre Dabil con torres de asedio, mangoneles y tubos de nafta, mientras que los asaltantes aniquilaron un escuadrón de Tarso y masacraron a cuatrocientos cautivos {cite:kamil-ibn-al-athir p. 130}."
  ur: "بازنطینی گھریلو؛ 315 میں اس نے محاصرہ برجوں، مینگونیلز اور نیفتھا ٹیوبوں کے ساتھ دبیل پر چڑھائی کی، جب کہ حملہ آوروں نے ترسوس سکواڈرن کو کاٹ دیا اور چار سو اسیروں کو ذبح کر دیا۔ 130}۔"
