summary:
  ar: "كاتب وصحفي وشاعر سوري من أصل أرمني (1856–1885)؛ تعلّم في مدرسة اللعازريين بدمشق، وعمل في الجمارك ثم الصحافة في بيروت ومصر، وتتلمذ على جمال الدين الأفغاني، وأصدر في باريس جريدة «مصر القاهرة» (1879)، وجُمعت آثاره في «الدرر» بعد وفاته في قرية الحدث بلبنان."
  en: "Syrian writer, journalist and poet of Armenian origin (1856–1885). Schooled at the Lazarist school in Damascus, he worked in the customs houses and then in journalism in Beirut and Egypt, became a disciple of Jamal al-Din al-Afghani, founded the Paris journal Misr al-Qahira (1879), and died at al-Hadath in Lebanon; his works were collected as Al-Durar after his death."
  ur: "آرمینی نژاد سوری مصنف، صحافی اور شاعر (1856–1885)؛ دمشق کے لعازری اسکول میں تعلیم پائی، کسٹم ہاؤسز اور پھر بیروت و مصر میں صحافت سے وابستہ رہے، جمال الدین افغانی کے شاگرد بنے، پیرس میں اخبار «مصر القاہرہ» (1879) جاری کیا، اور لبنان کے گاؤں الحدث میں انتقال ہوا؛ ان کی تحریریں بعد از وفات «الدرر» میں جمع ہوئیں۔"
