summary:
  ar: "ياسر عرفات (أغسطس 1929 – 11 نوفمبر 2004)، المعروف بكنيته أبو عمار، سياسي فلسطيني وُلد في القاهرة لأبوين فلسطينيين ودرس الهندسة المدنية فيها. شارك في تأسيس حركة فتح وقادها، وترأّس منظمة التحرير الفلسطينية من 1969 حتى وفاته، وقاد الفلسطينيين من الكفاح المسلح إلى مفاوضات السلام، فكان عرّاب اتفاقات أوسلو والفائز بجائزة نوبل للسلام سنة 1994 وأول رئيس للسلطة الوطنية الفلسطينية. حاصره الجيش الإسرائيلي في مقرّه برام الله أكثر من سنتين، وتوفي في مستشفى عسكري بفرنسا، ودُفن مؤقتًا في المقاطعة برام الله."
  en: "Yasser Arafat (August 1929 – 11 November 2004), known by his kunya Abu Ammar, was a Palestinian political leader born in Cairo to Palestinian parents and trained there as a civil engineer. He co-founded and led Fatah, chaired the Palestine Liberation Organization from 1969 until his death, and led the Palestinians from armed struggle to peace negotiations, signing the Oslo Accords, sharing the 1994 Nobel Peace Prize, and becoming the first President of the Palestinian National Authority. Confined by the Israeli army in his Ramallah compound for over two years, he died in a French military hospital and was temporarily buried at the Mukataa in Ramallah."
  ur: "یاسر عرفات (اگست 1929ء – 11 نومبر 2004ء)، کنیت ابو عمار، فلسطینی سیاسی رہنما تھے جو قاہرہ میں فلسطینی والدین کے ہاں پیدا ہوئے اور وہیں سے سول انجینئرنگ پڑھی۔ وہ فتح کے شریکِ بانی اور رہنما، 1969ء سے وفات تک تنظیم آزادی فلسطین کے چیئرمین، اوسلو معاہدوں کے دستخط کنندہ، 1994ء کے نوبل امن انعام کے شریک اور فلسطینی اتھارٹی کے پہلے صدر تھے۔ رام اللہ میں اپنے احاطے میں دو برس سے زائد محصور رہنے کے بعد وہ فرانس کے ایک فوجی اسپتال میں وفات پا گئے۔"
