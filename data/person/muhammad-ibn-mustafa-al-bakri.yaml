summary:
  ar: "محمد بن مصطفى بن كمال الدين البكري الصديقي، كمال الدين، أبو الفتوح ⁦(١١٤٣ - ١١٩٦هـ = ١٧٣١ - ١٧٨٢م)⁩: أديب من فقهاء الحنفية بفلسطين، وُلد ببيت المقدس وتوفي بغزة؛ وهو ابن مصطفى البكري الدمشقي المتوفى سنة ١١٦٢هـ، وليس إياه."
  en: "Muhammad ibn Mustafa ibn Kamal al-Din al-Bakri al-Siddiqi, Kamal al-Din, Abu al-Futuh (1143 to 1196 AH = 1731 to 1782): a man of letters among the Hanafi jurists of Palestine, born in Jerusalem and died in Gaza; the son of Mustafa al-Bakri of Damascus (d. 1162 AH), not the same man."
  es: "Muhammad ibn Mustafa ibn Kamal al-Din al-Bakri al-Siddiqi, Kamal al-Din, Abu al-Futuh (1143 a 1196 AH = 1731 a 1782): un hombre de letras entre los juristas hanafíes de Palestina, nacido en Jerusalén y muerto en Gaza; hijo de Mustafa al-Bakri de Damasco (m. 1162 AH), no el mismo hombre."
  fr: "Muhammad ibn Mustafa ibn Kamal al-Din al-Bakri al-Siddiqi, Kamal al-Din, Abu al-Futuh (1143 à 1196 AH = 1731 à 1782): un homme de lettres parmi les juristes hanafites de Palestine, né à Jérusalem et mort à Gaza; le fils de Mustafa al-Bakri de Damas (mort en 1162 AH), qui n'est pas le même homme."
  ur: "محمد بن مصطفیٰ بن کمال الدین البکری الصدیقی، کمال الدین، ابو الفتوح ⁦(1143 تا 1196 ہجری = 1731 تا 1782)⁩: فلسطین کے حنفی فقہاء میں سے ایک خطیب آدمی، یروشلم میں پیدا ہوا اور وفات پائی۔ دمشق کے مصطفیٰ البکری کا بیٹا ⁦(متوفی 1162 ہجری)⁩، وہی آدمی نہیں۔"
