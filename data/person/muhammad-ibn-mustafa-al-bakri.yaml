  ar: "محمد بن مصطفى بن كمال الدين البكري الصديقي، كمال الدين، أبو الفتوح ⁦(١١٤٣ - ١١٩٦هـ = ١٧٣١ - ١٧٨٢م)⁩: أديب من فقهاء الحنفية بفلسطين، وُلد ببيت المقدس وتوفي بغزة؛ وهو ابن مصطفى البكري الدمشقي المتوفى سنة ١١٦٢هـ، وليس إياه."
  en: "Muhammad ibn Mustafa ibn Kamal al-Din al-Bakri al-Siddiqi, Kamal al-Din, Abu al-Futuh (1143 to 1196 AH = 1731 to 1782): a man of letters among the Hanafi jurists of Palestine, born in Jerusalem and died in Gaza; the son of Mustafa al-Bakri of Damascus (d. 1162 AH), not the same man."
