id: person/ibn-fadl-allah-al-umari
class: person
label: { ar: "ابن فضل الله العمري", en: "Ibn Fadl Allah al-Umari", ur: "ابن فضل اللہ عمری" }
summary:
  ar: "شهاب الدين أحمد بن فضل الله العمري (٧٠٠-٧٤٩هـ/١٣٠١-١٣٤٩م)؛ كاتب السر في ديوان الإنشاء بدولة المماليك ومؤلف «مسالك الأبصار في ممالك الأمصار» و«التعريف بالمصطلح الشريف». اعتذر في مقدمة مسالكه بأنه لم يُتِهم في تهامة ولا أعرق في عراق — فكتابه جمعٌ من الكتب والأفواه لا من المشاهدة {cite:umari-masalik-1924 p. 14}."
  en: "Shihab al-Din Ahmad ibn Fadl Allah al-Umari (700–749 AH / 1301–1349), head of the Mamluk chancery's correspondence bureau and author of Masalik al-Absar and al-Ta'rif bi'l-Mustalah al-Sharif — who begged the reader's pardon that he 'had not braved Tihama nor plunged into Iraq': a compiler from books and informants, not a traveller {cite:umari-masalik-1924 p. 14}."
  ur: "شہاب الدین احمد بن فضل اللہ عمری (700-749ھ/1301-1349ء)؛ مملوک دیوانِ انشا میں کاتبِ سر اور «مسالک الابصار فی ممالک الامصار» اور «التعریف بالمصطلح الشریف» کے مؤلف۔ مسالک کے دیباچے میں انہوں نے معذرت کی کہ نہ وہ تہامہ میں بھٹکے نہ عراق میں گہرے — اس کی کتاب کتابوں اور روایتوں سے مرتب ہوئی، مشاہدے سے نہیں {cite:umari-masalik-1924 p. 14}۔"
