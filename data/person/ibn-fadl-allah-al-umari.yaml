summary:
  ar: "شهاب الدين أحمد بن فضل الله العمري (٧٠٠-٧٤٩هـ)؛ كاتب السر في ديوان الإنشاء بدولة المماليك ومؤلف «مسالك الأبصار في ممالك الأمصار» و«التعريف بالمصطلح الشريف». اعتذر في مقدمة مسالكه بأنه لم يُتِهم في تهامة ولا أعرق في عراق — فكتابه جمعٌ من الكتب والأفواه لا من المشاهدة {cite:umari-masalik-1924 p. 14}."
  en: "Shihab al-Din Ahmad ibn Fadl Allah al-Umari (700–749 AH), head of the Mamluk chancery's correspondence bureau and author of Masalik al-Absar and al-Ta'rif bi'l-Mustalah al-Sharif — who begged the reader's pardon that he 'had not braved Tihama nor plunged into Iraq': a compiler from books and informants, not a traveller {cite:umari-masalik-1924 p. 14}."
