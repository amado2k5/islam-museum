  ar: "بطاقة أولية لكمال الدين محمد بن عبد الواحد السيواسي ابن الهمام، فقيه حنفي القرن الخامس عشر صاحب «فتح القدير»، توفي سنة ١٤٥٧م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Kamal al-Din Muhammad ibn Abd al-Wahid al-Siwasi Ibn al-Humam, the fifteenth-century Hanafi polymath author of Fath al-Qadir, d. 1457; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar para Kamal al-Din Muhammad ibn Abd al-Wahid al-Siwasi Ibn al-Humam, el polímata hanafí del siglo XV autor de Fath al-Qadir, fallecido en 1457; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet pour Kamal al-Din Muhammad ibn Abd al-Wahid al-Siwasi Ibn al-Humam, l'auteur polymathe hanafite du XVe siècle de Fath al-Qadir, mort en 1457; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "کمال الدین محمد بن عبد الواحد السیواسی ابن الحمام کے لیے ڈرافٹ کارڈ، جو پندرہویں صدی کے حنفی کثیر الثانی مصنف فتح القدیر، ڈی۔ 1457; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "15. yüzyıl Hanefi hukukçusu ve 'Fath al-Kadeer' kitabının yazarı Kamal al-Din Muhammed bin Abd al-Wahid ibn al-Humam için ön kart, 1457 yılında ölmüştür; biyografik kitaplarda da kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Kamal al-Din Muhammad ibn Abd al-Wahid al-Siwasi ibn al-Humam, seorang ahli hukum Hanafi abad ke-15 dan penulis 'Fath al-Qadeer,' yang meninggal pada tahun 1457 M; buku biografi menyebutkannya, dan biografinya belum pernah diulas di halaman tersebut."
