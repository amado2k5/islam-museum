summary:
  en: "A scribe of revelation who apostatized back to Quraysh; proscribed on the day of the Conquest, he was sheltered by his foster brother Uthman ibn Affan who pleaded for him until the Prophet granted him pardon; he returned to Islam and later governed Egypt under Umar and Uthman."
  ar: "كاتب للوحي في المدينة ارتد ولحق بمكة؛ أهدر النبي دمه يوم الفتح فاستأمن له أخوه من الرضاعة عثمان بن عفان بعد صمت طويل، فعفا عنه وأسلم وحسن إسلامه وولاه عمر ثم عثمان مصر."
