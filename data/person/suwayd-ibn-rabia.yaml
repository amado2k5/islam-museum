summary:
  ar: "رجل من بني تميم في الجاهلية، قتل أخاه، فنذر عمرو أن يقتل مائة من تميم بأخيه؛ وفي قصة عمرو مع امرأة ومع رجل من البراجم صار مثل 'الشقي وافد البراجم'. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 17-18}"
  en: "A man of Tamim in pre-Islamic times who killed his brother; the story of Amr's revenge, including the Barajim man, gave rise to the proverb 'the wretched one came to the Barajim'. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 17-18}"
  ur: "جاہلیت کے تمیم کے ایک شخص؛ انہوں نے اپنے بھائی کو قتل کیا، اور عمرو کے انتقام کے قصے سے 'بدبخت براجم کا مہمان ہوا' کا مثل بنا۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 17-18}"
