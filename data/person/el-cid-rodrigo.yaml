label: { ar: "ردريق القنبيطور" }
summary:
  ar: "ردريق الملقب في مصادر المسلمين بالقنبيطور والطاغية، قائد نصراني أنهضه يوسف بن أحمد بن هود صاحب سرقسطة للاستيلاء على بلنسية فدخلها وعاهد قاضيها ابن جحاف، واشترط عليه إحضار ذخيرة كانت للقادر بن ذي النون فأقسم أنها ليست عنده فاشترط عليه إن وُجدت عنده قتله فاتفق أنها وجدت عنده فأحرقه بالنار، وعاث في بلنسية واستولى عليها سنة ثمان وثمانين وأربعمائة وقيل التي قبلها وجزم ابن الأبار بأن حصاره إياها كان عشرين شهراً، وممن أُحرق فيها الأديب أبو جعفر ابن البني الشاعر، حتى فتحها أمير المسلمين يوسف بن تاشفين على يدي الأمير أبي محمد مزدلي سنة ٤٩٥ {cite:nafh-tib-maqqari p. 455-456}."
  en: "Rodrigo, called al-Qanbitur (el Campeador) and 'the tyrant' in the Muslim sources; raised by Yusuf ibn Hud of Zaragoza to take Valencia, he entered it in 488 after a twenty-month siege, burned the qadi Ibn Jahhaf alive over the hidden treasury, and destroyed the city until the Almoravid Mazdali retook it in 495 {cite:nafh-tib-maqqari p. 455-456}."
