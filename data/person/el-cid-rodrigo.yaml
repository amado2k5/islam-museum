id: person/el-cid-rodrigo
class: person
label: { ar: "ردريق القنبيطور" }
summary:
  ar: "ردريق الملقب في مصادر المسلمين بالقنبيطور والطاغية، قائد نصراني أنهضه يوسف بن أحمد بن هود صاحب سرقسطة للاستيلاء على بلنسية فدخلها وعاهد قاضيها ابن جحاف، واشترط عليه إحضار ذخيرة كانت للقادر بن ذي النون فأقسم أنها ليست عنده فاشترط عليه إن وُجدت عنده قتله فاتفق أنها وجدت عنده فأحرقه بالنار، وعاث في بلنسية واستولى عليها سنة ثمان وثمانين وأربعمائة وقيل التي قبلها وجزم ابن الأبار بأن حصاره إياها كان عشرين شهراً، وممن أُحرق فيها الأديب أبو جعفر ابن البني الشاعر، حتى فتحها أمير المسلمين يوسف بن تاشفين على يدي الأمير أبي محمد مزدلي سنة ٤٩٥ {cite:nafh-tib-maqqari p. 455-456}."
  en: "Rodrigo, called al-Qanbitur (el Campeador) and 'the tyrant' in the Muslim sources; raised by Yusuf ibn Hud of Zaragoza to take Valencia, he entered it in 488 after a twenty-month siege, burned the qadi Ibn Jahhaf alive over the hidden treasury, and destroyed the city until the Almoravid Mazdali retook it in 495 {cite:nafh-tib-maqqari p. 455-456}."
  es: "Rodrigo, llamado al-Qanbitur (el Campeador) y 'el tirano' en las fuentes musulmanas; levantado por Yusuf ibn Hud de Zaragoza para tomar Valencia, entró en ella en 488 después de un asedio de veinte meses, quemó vivo al cadí Ibn Jahhaf sobre el tesoro escondido y destruyó la ciudad hasta que el almorávide Mazdali la retomó en 495 {cite:nafh-tib-maqqari p. 455-456}."
  fr: "Rodrigo, appelé al-Qanbitur (el Campeador) et « le tyran » dans les sources musulmanes; levé par Yusuf ibn Hud de Saragosse pour prendre Valence, il y entra en 488 après un siège de vingt mois, brûla vif le cadi Ibn Jahhaf au sujet du trésor caché et détruisit la ville jusqu'à ce que l'Almoravide Mazdali la reprenne en 495 {cite:nafh-tib-maqqari p. 455-456}."
  ur: "روڈریگو، جسے مسلم ذرائع میں القنبیتور ⁦(ایل کیمپیڈور)⁩ اور 'ظالم' کہا جاتا ہے۔ زرگوزا کے یوسف بن ہود نے ویلنسیا پر قبضہ کرنے کے لیے اٹھایا، وہ بیس ماہ کے محاصرے کے بعد 488 میں اس میں داخل ہوا، اس نے چھپے ہوئے خزانے پر قاضی ابن جحف کو زندہ جلا دیا، اور شہر کو تباہ کر دیا یہاں تک کہ الموروید مزدلی نے اسے 495 ہجری قمری میں دوبارہ حاصل کر لیا۔ 455-456}۔"
  tr: "Müslüman kaynaklarda El-Qanbitur ve zorba olarak anılan Rudric, Zaragoza hükümdarı Yusuf ibn Ahmed ibn Hud tarafından Valensiya'yı ele geçirmek için yetiştirilen Hristiyan bir komutandı. Hazineyi girdi ve hakim İbn Jahaf'a yemin etti. El-Kadir bin Dhi el-Nun'a ait hazineyi getirmesini şart koştu ve bunun kendisinde olmadığını yemin etti. Eğer hazine kendisinde bulunursa onu öldüreceğini şart koştu. Kabul etti ki Bulundu ve yaktı. Valensiya'da yıkım yarattı ve 488 Hicri yılında ele geçirdi; önceki kuşatmanın İbn el-Abar tarafından kuşatmasının yirmi ay sürdüğü doğrulandığı söylenir. Yakanlar arasında, şair Ebu Ca'far ibn el-Bunni de vardı; ta ki Müslüman prens Yusuf ibn Taşfin, 495 Hicri yılında Prens Ebu Muhammed Mazdali'nin elinden ele geçirene kadar (alıntı: Nafh-tib-maqqari s. 455-456}."
  id: "Rudric, yang dijuluki dalam sumber Muslim sebagai Al-Qanbitur dan tiran, adalah seorang komandan Kristen yang diangkat oleh Yusuf ibn Ahmad ibn Hud, penguasa Zaragoza, untuk merebut Valencia. Ia masuk ke sana dan berjanji kepada hakimnya, Ibn Jahaf. Ia menetapkan bahwa ia harus membawa harta yang milik al-Qadir ibn Dhi al-Nun dan bersumpah bahwa harta itu tidak ada di tangannya. Ia menetapkan bahwa jika harta itu ditemukan bersamanya, ia akan membunuhnya. Ia setuju bahwa harta itu ditemukan, sehingga ia membakarnya. Ia membuat kekacauan di Valencia dan merebutnya pada tahun 488 H, dan dikatakan bahwa pengepungan sebelumnya dikonfirmasi oleh Ibn al-Abar bahwa pengepungannya berlangsung selama dua puluh bulan. Di antara yang membakarnya adalah penulis Abu Ja'far ibn al-Bunni, sang penyair, hingga pangeran Muslim Yusuf ibn Tashfin merebutnya di tangan Pangeran Abu Muhammad Mazdali pada tahun 495 H {cite::) Nafh-tib-maqqari hlm. 455-456}."
