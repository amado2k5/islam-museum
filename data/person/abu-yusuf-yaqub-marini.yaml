id: person/abu-yusuf-yaqub-marini
class: person
label: { ar: "أبو يوسف يعقوب المريني" }
summary:
  ar: "يعقوب بن عبد الحق صاحب المغرب وحضرة ملك فاس؛ انتصر به أهل الأندلس على الإفرنج الذين تكالبوا عليهم فاجتاز إلى الأندلس وهزم الإفرنج أشد هزيمة حتى قال بعضهم ما نصر المسلمون من العقاب حتى دخل يعقوب المريني وفتك في بعض غزواته بملك من النصارى يقال له ذونته، ويقال إنه قتل من جيشه أربعين ألفاً، وكان له من بلاد الأندلس رندة والجزيرة الحضراء وطريف وجبل طارق وغير ذلك وأعز الله به الدين بعد تمرّد الفرنج {cite:nafh-tib-maqqari p. 389}. ولما مات ولي ابنه يوسف ففر إليه الأذفونش ملك النصارى لائذاً به وقبل يده ورهن عنده تاجه فأعانه على استرجاع ملكه {cite:nafh-tib-maqqari p. 389}."
  en: "Abu Yusuf Ya'qub ibn Abd al-Haqq, Marinid sultan of Fez — the crossing whose victories Muslims had not seen since al-Iqab, slaying the Christian king Nuño and, as some said, forty thousand of his army; he held Ronda, Algeciras, Tarifa and Gibraltar, and under his son the Castilian Alfonso himself came begging, kissed his hand and pawned his crown for help recovering his throne {cite:nafh-tib-maqqari p. 389}."
