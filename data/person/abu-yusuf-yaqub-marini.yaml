label: { ar: "أبو يوسف يعقوب المريني", en: "Abu Yusuf Ya'qub al-Marini", fr: "Abu Yusuf Ya'qub al-Marini", es: "Abu Yusuf Ya'qub al-Marini", ur: "ابو یوسف یعقوب المرینی۔" }
summary:
  ar: "يعقوب بن عبد الحق صاحب المغرب وحضرة ملك فاس؛ انتصر به أهل الأندلس على الإفرنج الذين تكالبوا عليهم فاجتاز إلى الأندلس وهزم الإفرنج أشد هزيمة حتى قال بعضهم ما نصر المسلمون من العقاب حتى دخل يعقوب المريني وفتك في بعض غزواته بملك من النصارى يقال له ذونته، ويقال إنه قتل من جيشه أربعين ألفاً، وكان له من بلاد الأندلس رندة والجزيرة الحضراء وطريف وجبل طارق وغير ذلك وأعز الله به الدين بعد تمرّد الفرنج {cite:nafh-tib-maqqari p. 389}. ولما مات ولي ابنه يوسف ففر إليه الأذفونش ملك النصارى لائذاً به وقبل يده ورهن عنده تاجه فأعانه على استرجاع ملكه {cite:nafh-tib-maqqari p. 389}."
  en: "Abu Yusuf Ya'qub ibn Abd al-Haqq, Marinid sultan of Fez — the crossing whose victories Muslims had not seen since al-Iqab, slaying the Christian king Nuño and, as some said, forty thousand of his army; he held Ronda, Algeciras, Tarifa and Gibraltar, and under his son the Castilian Alfonso himself came begging, kissed his hand and pawned his crown for help recovering his throne {cite:nafh-tib-maqqari p. 389}."
  fr: "Abu Yusuf Ya'qub ibn Abd al-Haqq, sultan mérinide de Fès, traversa le détroit et remporta des victoires telles que les musulmans n'en avaient pas vu depuis al-Iqab, tuant le roi chrétien Nuño et, selon certains, quarante mille hommes de son armée. Il détenait Ronda, Algésiras, Tarifa et Gibraltar ; sous son fils, Alphonse de Castille vint lui-même demander secours, lui baisa la main et engagea sa couronne pour retrouver son trône {cite:nafh-tib-maqqari p. 389}."
  es: "Abu Yusuf Ya'qub ibn Abd al-Haqq, sultán mariní de Fez —el cruce cuyas victorias los musulmanes no habían visto desde al-Iqab, matando al rey cristiano Nuño y, según algunos, a cuarenta mil de su ejército; controlaba Ronda, Algeciras, Tarifa y Gibraltar, y bajo el reinado de su hijo el castellano Alfonso mismo acudió suplicando, besó su mano y empeñó su corona a cambio de ayuda para recuperar su trono {cite:nafh-tib-maqqari p. 389}."
  ur: "ابو یوسف یعقوب ابن عبد الحق، فیز کے مرید سلطان - وہ کراسنگ جس کی فتوحات مسلمانوں نے العقاب کے بعد سے نہیں دیکھی تھیں، عیسائی بادشاہ نوو کو قتل کیا اور جیسا کہ بعض نے کہا، اس کی چالیس ہزار فوج؛ اس نے رونڈا، الجیسیراس، طریفہ اور جبرالٹر کو تھام رکھا تھا، اور اس کے بیٹے کے ماتحت کاسٹیلین الفونسو خود بھیک مانگنے آیا، اس کے ہاتھ کو چوما اور اس کے تاج کو اپنے تخت کی بازیابی میں مدد کے لیے باندھا۔ 389}۔"
