summary:
  ar: "أبو المعالي مسعود بن محمد بن مسعود بن طاهر النيسابوري الطريثيثي الفقيه الشافعي، الملقب قطب الدين؛ تفقه بنيسابور وسمع الحديث ورأى الأستاذ أبا نصر القشيري، ودرّس بالمدرسة النظامية بنيسابور نيابة عن الجويني، وقدم دمشق سنة أربع وخمسمائة فوعظ بها ودرّس بالمدرسة الأمجدية ثم بالزاوية الغربية من جامع دمشق، ثم خرج إلى حلب ودرّس بالمدرستين اللتين بناهما نور الدين وأسد الدين شيركوه، ومضى إلى همذان فتولى التدريس بها ثم رجع؛ وكان متواضعاً قليل التصنع {cite:wafayat-ayan}."
  en: "Qutb al-Din al-Tarithithi (505–578) — Shafi'i who deputised for al-Juwayni at the Nishapur Nizamiyya, then taught at Damascus's Amjadiyya, Aleppo's twin madrasas and Hamadan; Ibn Khallikan often visited his grave {cite:wafayat-ayan}."
