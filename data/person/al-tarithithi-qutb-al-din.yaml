summary:
  ar: "أبو المعالي مسعود بن محمد بن مسعود بن طاهر النيسابوري الطريثيثي الفقيه الشافعي، الملقب قطب الدين؛ تفقه بنيسابور وسمع الحديث ورأى الأستاذ أبا نصر القشيري، ودرّس بالمدرسة النظامية بنيسابور نيابة عن الجويني، وقدم دمشق سنة أربع وخمسمائة فوعظ بها ودرّس بالمدرسة الأمجدية ثم بالزاوية الغربية من جامع دمشق، ثم خرج إلى حلب ودرّس بالمدرستين اللتين بناهما نور الدين وأسد الدين شيركوه، ومضى إلى همذان فتولى التدريس بها ثم رجع؛ وكان متواضعاً قليل التصنع {cite:wafayat-ayan}."
  en: "Qutb al-Din al-Tarithithi (505–578) — Shafi'i who deputised for al-Juwayni at the Nishapur Nizamiyya, then taught at Damascus's Amjadiyya, Aleppo's twin madrasas and Hamadan; Ibn Khallikan often visited his grave {cite:wafayat-ayan}."
  fr: "Qutb al-Din al-Tarithithi (505-578) - Shafi'i qui a délégué pour al-Juwaini au Nichapour Nizamiyya, puis a enseigné à Amjadiyya de Damas, les madrasas jumelles d'Alep et Hamadan ; Ibn Khallikan a souvent visité sa tombe {cite:wafayat-ayan}."
  es: "Qutb al-Din al-Tarithithi (505–578): Shafi'i, que sustituyó a al-Juwayni en Nishapur Nizamiyya, luego enseñó en Amjadiyya de Damasco, las madrasas gemelas de Alepo y Hamadan; Ibn Khallikan visitaba con frecuencia su tumba {cita:wafayat-ayan}."
  ur: "قطب الدین الطریثی (505-578) - شافعی جو نیشاپور نظامیہ میں الجوینی کے لیے تعینات ہوئے، پھر دمشق کے امجدیہ، حلب کے جڑواں مدارس اور ہمدان میں پڑھاتے رہے۔ ابن خلیقان اکثر ان کی قبر پر جاتے تھے۔"
  tr: "Ebu el-Ma'ali Mes'ud bin Muhammed ibn Mes'ud ibn Tahir al-Naysaburi el-Tarithithi, Şafii fihili ve Kutb al-Din olarak bilinir; Nişapur'da fıkıh okudu, hadis duydu ve öğretmen Ebu Nasr el-Kuşayri ile görüştü. El-Cüveyi adına Nişapur'daki Nizamiye okulunda eğitim aldı. 500 Hicri yılında Şam'a geldi, orada vaaz verdi ve Amcadiyya okulunda, ardından Şam caminin batı zavisinde öğretmenlik yaptı. Daha sonra Halep'e giderek Nur al-Din ve Eseddin Şirküh tarafından inşa edilen iki okulda ders verdi. Sonra Hamadan'a giderek orada ders verdi ve geri döndü; alçakgönüllü ve mütevazı, pek bir gösteriş yapmadan önce ders verdi."
  id: "Abu al-Ma'ali Mas'ud ibn Muhammad ibn Mas'ud ibn Tahir al-Naysaburi al-Tarithithi, ahli hukum Shafi'i yang dikenal sebagai Qutb al-Din; ia belajar hukum di Nishapur, mendengar hadits, dan bertemu dengan guru Abu Nasr al-Qushayri. Ia belajar di sekolah Nizamiyya di Nishapur atas nama al-Juwayni. Ia datang ke Damaskus pada tahun 500 H, berkhotbah di sana, dan mengajar di sekolah Amjadiyya, kemudian di zawiya barat masjid Damaskus. Ia kemudian pergi ke Aleppo dan mengajar di dua sekolah yang dibangun oleh Nur al-Din dan Asad al-Din Shirkuh. Ia kemudian pergi ke Hamadan, di mana ia mengajar sebelum kembali; ia rendah hati dan rendah hati, tanpa banyak kepura-puraan."
