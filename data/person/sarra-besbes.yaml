summary:
  ar: "مبارزة تونسية في سيف المبارزة، وُلدت في أبوظبي سنة 1989 لعائلة رياضية. فازت بذهبيات متعددة في بطولة أفريقيا، وحلّت ثامنة في أولمبياد لندن 2012 وخامسة في ريو 2016، ونالت برونزية بطولة العالم 2015 وذهبية كأس العالم في بوينس آيرس في العام نفسه، وشاركت أيضاً في طوكيو 2020."
  en: "Tunisian épée fencer, born in Abu Dhabi in 1989 into a sporting family. A multiple African Championships gold medallist, she placed eighth at the London 2012 Olympics and fifth at Rio 2016, won bronze at the 2015 World Championships and a World Cup gold in Buenos Aires the same year, and also competed at Tokyo 2020."
  ur: "تیونس کی ایپی مبارز، 1989 میں ابوظہبی میں ایک کھیلوں سے وابستہ خاندان میں پیدا ہوئیں۔ انہوں نے افریقی چیمپئن شپ میں متعدد طلائی تمغے جیتے، لندن 2012 اولمپکس میں آٹھویں اور ریو 2016 میں پانچویں نمبر پر رہیں، 2015 کی عالمی چیمپئن شپ میں کانسی اور اسی سال بیونس آئرس میں ورلڈ کپ طلائی تمغہ جیتا، اور ٹوکیو 2020 میں بھی حصہ لیا۔"
