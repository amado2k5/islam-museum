summary:
  ar: "موسى بن مساور أبو الهيثم الضبي، روى عن سفيان بن عيينة ووكيع. كان جيدًا فاضلًا، ترك ما ورثه عن أبيه لإخوته تورّعًا، لأن أباه كان يتولى للسلطان، وله آثار مشهورة في بناء الرباطات وإصلاح الطرق. ورُئي في المنام بعد موته، فقال: غفر لي؛ لأني حملت مع امرأة جرابًا ثقل عليها."
  en: "Musa ibn Musawwir Abu al-Haytham al-Dabbi, who transmitted from Sufyan ibn Uyayna and Waki'; a good and excellent man, he left what he inherited from his father to his brothers out of scrupulousness, because his father had served the ruler; he has well-known works in building caravanserais for travellers and mending roads. After his death he was seen in a dream and said he had been forgiven, because he once helped a woman carry a sack that was heavy for her."
  ur: "موسیٰ بن مساور ابو الہیثم ضبی، جنہوں نے سفیان بن عیینہ اور وکیع سے روایت کی۔ وہ نیک اور فاضل تھے؛ اپنے والد کی میراث احتیاط کی بنا پر اپنے بھائیوں کو چھوڑ دی، کیونکہ والد سلطان کے لیے کام کرتے تھے۔ مسافروں کے لیے سرائیں بنانے اور راستے درست کرنے میں ان کے مشہور کام ہیں۔ وفات کے بعد خواب میں دیکھے گئے تو کہا: مجھے بخش دیا گیا، کیونکہ میں نے ایک عورت کے بوجھل تھیلے کو اٹھانے میں اس کی مدد کی تھی۔"
