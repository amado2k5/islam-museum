summary:
  ar: "موسى بن مساور أبو الهيثم الضبي، روى عن سفيان بن عيينة ووكيع. كان جيدًا فاضلًا، ترك ما ورثه عن أبيه لإخوته تورّعًا، لأن أباه كان يتولى للسلطان، وله آثار مشهورة في بناء الرباطات وإصلاح الطرق. ورُئي في المنام بعد موته، فقال: غفر لي؛ لأني حملت مع امرأة جرابًا ثقل عليها."
  en: "Musa ibn Musawwir Abu al-Haytham al-Dabbi, who transmitted from Sufyan ibn Uyayna and Waki'; a good and excellent man, he left what he inherited from his father to his brothers out of scrupulousness, because his father had served the ruler; he has well-known works in building caravanserais for travellers and mending roads. After his death he was seen in a dream and said he had been forgiven, because he once helped a woman carry a sack that was heavy for her."
  ur: "موسیٰ بن مساور ابو الہیثم ضبی، جنہوں نے سفیان بن عیینہ اور وکیع سے روایت کی۔ وہ نیک اور فاضل تھے؛ اپنے والد کی میراث احتیاط کی بنا پر اپنے بھائیوں کو چھوڑ دی، کیونکہ والد سلطان کے لیے کام کرتے تھے۔ مسافروں کے لیے سرائیں بنانے اور راستے درست کرنے میں ان کے مشہور کام ہیں۔ وفات کے بعد خواب میں دیکھے گئے تو کہا: مجھے بخش دیا گیا، کیونکہ میں نے ایک عورت کے بوجھل تھیلے کو اٹھانے میں اس کی مدد کی تھی۔"
  es: "Musa ibn Musawwir Abu al-Haytham al-Dabbi, quien transmitió de Sufyan ibn Uyayna y Waki', fue un hombre bueno y excelente. Por escrupulosidad, dejó a sus hermanos la herencia de su padre, pues este había servido al gobernante. Se le reconoce por sus obras en la construcción de caravasares para viajeros y en la reparación de caminos. Tras su muerte, se le apareció en un sueño y se le dijo que había sido perdonado, pues una vez ayudó a una mujer a cargar un saco que le resultaba muy pesado."
  fr: "Musa ibn Musawwir Abu al-Haytham al-Dabbi, qui transmit l'enseignement de Sufyan ibn Uyayna et Waki', était un homme bon et vertueux. Par souci d'honnêteté, il légua à ses frères l'héritage de son père, car celui-ci avait servi le souverain. Il est réputé pour la construction de caravansérails et la réparation de routes. Après sa mort, il apparut en songe et déclara avoir été pardonné pour avoir jadis aidé une femme à porter un sac trop lourd pour elle."
  tr: "Musa ibn Masawir, Ebu el-Haytham el-Dabi, Sufyan ibn 'Uyaynah ve Waki'den rivayet etmiştir. İyi ve erdemliydi, babasından miras kalanları dindarlıktan kardeşlerine bıraktı, çünkü babası sultanın sorumlusuydu ve ribat yapımında ve yol onarımında ünlü eserleri vardı. Ölümünden sonra bir rüyasında şöyle dediği görüldü: Beni affet; çünkü ben ağır bir çuval taşıdım ve bir kadın."
  id: "Musa ibn Masawir, Abu al-Haytham al-Dhabi, menceritakan dari Sufyan ibn 'Uyaynah dan Waki'. Ia baik dan berbudi luhur, meninggalkan warisan dari ayahnya kepada saudara-saudaranya karena kesalehan, karena ayahnya memimpin sultan, dan ia memiliki pekerjaan terkenal dalam membangun ribat dan memperbaiki jalan. Ia terlihat dalam mimpi setelah kematiannya, berkata: Maafkan aku; karena aku membawa karung berat bersama seorang wanita."
