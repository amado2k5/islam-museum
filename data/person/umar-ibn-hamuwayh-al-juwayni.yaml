  en: "Shaykh al-shuyukh Abu al-Fath Umar ibn Ali ibn Hamuwayh al-Juwayni, the Sufi; he transmitted from his grandfather and al-Farawi, and Nur al-Din gave him the shaykhdom of Syria's shaykhs — a man of great dignity; his notice falls in year 577 at sixty-four {cite:shadharat-dhahab p. 739}."
