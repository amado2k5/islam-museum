summary:
  ar: "الأمير الكبير أستاد دار الملك الظاهر ثم أمير آخور؛ دخل مصر مع الظاهر بيبرس سنة خمسين ولم يزل في عزة وإقبال إلى أن مرض بأصل رمضان وعولج بأمره ولم يحول، وتوفي عاشر المحرم ودفن خارج باب النصر {cite:shadharat-dhahab p. 565}."
  en: "Al-Zahir's ustadh-dar, then amir akhur — entered Egypt with Baybars in 650 and knew only might and favour till illness in Ramadan; d. 10 Muharram, buried outside Bab al-Nasr {cite:shadharat-dhahab p. 565}."
  es: "El ustadh-dar de Al-Zahir, luego amir akhur, entró en Egipto con Baybars en 650 y conoció solo poder y favor hasta que enfermó en Ramadán; murió el 10 de Muharram, enterrado fuera de Bab al-Nasr {cita: shadharat-dhahab p. 565}."
  fr: "L'ustadh-dar d'Al-Zahir, puis amir akhur, est entré en Égypte avec Baybars en 650 et n'a connu que force et faveur jusqu'à sa maladie pendant le Ramadan; mort le 10 Muharram, enterré à l'extérieur de Bab al-Nasr {cite:shadharat-dhahab p. 565}."
  ur: "الظاہر کے استاذ دار، پھر امیر اخور - 650 میں بیبار کے ساتھ مصر میں داخل ہوئے اور رمضان میں بیماری تک صرف طاقت اور احسان جانتے تھے۔ d 10 محرم، باب النصر کے باہر دفن کیا گیا 565}۔"
  tr: "Büyük prens, o dönemde Akhur Emiri olan Al-Malik Al-Zahir'in hanedanının ustasıydı; 50 yılında Al-Zahir Baybars ile birlikte Mısır'a girdi ve Ramazan davasına yakalandıktan sonra, kendi emriyle tedavi edilip din değiştirmedi, Muharrem'in onuncusunda öldü ve Zafer Kapısı'nın dışında defnedildi {cite:shadharat-dhahab, s. 565}"
  id: "Pangeran agung itu adalah penguasa rumah Al-Malik Al-Zahir, yang saat itu menjadi Emir Akhur; ia masuk ke Mesir bersama Al-Zahir Baybars pada tahun 50 dan tetap dalam kehormatan dan pengabdian hingga jatuh sakit karena Ramadan, diperlakukan sesuai perintahnya sendiri dan tidak memeluk agama Islam, dan meninggal pada tanggal sepuluh Muharram dan dimakamkan di luar Gerbang Kemenangan {cite:shadharat-dhahab, hlm. 565}."
