summary:
  ar: "علي بن يحيى بن القاسم الصنهاجي، أبو الحسن، الجزيري، فقيه مالكي نزل الجزيرة الخضراء بالأندلس وولي قضاءها فنسب إليها، ودرس الفقه وعقد الشروط. من تصانيفه المقصد المحمود في تلخيص العقود في الشروط. توفي سنة 585 هـ عن نحو ستين سنة على ما ذكره العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  en: "Ali ibn Yahya ibn al-Qasim al-Sinhaji, Abu al-Hasan, al-Jaziri, a Maliki jurist who settled in al-Jazira al-Khadra in al-Andalus, became its judge, and taught fiqh and drew up contracts. His book al-Maqsid al-mahmud fi talkhis al-uqud is on contracts. The header gives 585 AH, about sixty years of age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
