label:
  ar: "الجزيري ⁦(علي بن يحيى الصنهاجي)⁩"
  en: "Al-Jaziri (Ali ibn Yahya al-Sinhaji)"
  es: "Al-Jaziri (Ali ibn Yahya al-Sinhaji)"
  fr: "Al-Jaziri (Ali ibn Yahya al-Sinhaji)"
  ur: "الجزیری ⁦(علی ابن یحیی السنہجی)⁩"
summary:
  ar: "علي بن يحيى بن القاسم الصنهاجي، أبو الحسن، الجزيري، فقيه مالكي نزل الجزيرة الخضراء بالأندلس وولي قضاءها فنسب إليها، ودرس الفقه وعقد الشروط. من تصانيفه المقصد المحمود في تلخيص العقود في الشروط. توفي سنة 585 هـ عن نحو ستين سنة على ما ذكره العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  en: "Ali ibn Yahya ibn al-Qasim al-Sinhaji, Abu al-Hasan, al-Jaziri, a Maliki jurist who settled in al-Jazira al-Khadra in al-Andalus, became its judge, and taught fiqh and drew up contracts. His book al-Maqsid al-mahmud fi talkhis al-uqud is on contracts. The header gives 585 AH, about sixty years of age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  es: "Ali ibn Yahya ibn al-Qasim al-Sinhaji, Abu al-Hasan, al-Jaziri, un jurista malikí que se estableció en al-Jazira al-Khadra en al-Ándalus, se convirtió en juez de la ciudad, impartió clases de fiqh y redactó contratos. Su libro al-Maqsid al-mahmud fi talkhis al-uqud trata sobre contratos. El encabezado indica el año 585 de la Hégira, aproximadamente sesenta años de edad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  fr: "Ali ibn Yahya ibn al-Qasim al-Sinhaji, dit Abu al-Hasan, al-Jaziri, juriste malikite, s'établit à al-Jazira al-Khadra, en al-Andalus, où il devint juge et enseigna le fiqh (jurisprudence islamique) et la rédaction de contrats. Son ouvrage, al-Maqsid al-mahmud fi talkhis al-uqud, traite des contrats. La date indiquée est 585 AH, soit environ soixante ans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  ur: "علی بن یحییٰ بن القاسم السنہجی، ابو الحسن، الجزیری، ایک مالکی فقیہ جو اندلس میں الجزیرہ الخدرہ میں مقیم تھے، اس کے قاضی بنے، اور فقہ کی تعلیم دی اور معاہدے کئے۔ ان کی کتاب المقدس المحمود فی تلخیص العقود عقد پر ہے۔ سرخی 585ھ بتاتی ہے، تقریباً ساٹھ سال کی عمر۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص15814}"
