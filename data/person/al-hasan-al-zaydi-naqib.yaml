summary:
  ar: "أبو تمام الحسن بن علي بن عبد الوهاب بن سليمان الزيدي (ت 384هـ تقريباً)، نقيب العباسيين وصاحب الصلاة؛ وهو أول من جُمع له بين الصلاة والنقابة سنة ثمانين وثلثمائة، واستُخلف له ابنه أبو الحسن الملقب بنظام الحضرتين على الصلاة وخُلع عليه {cite:muntazam-ibn-al-jawzi j.7 p.179}."
  en: "Abu Tamam al-Hasan b. 'Ali b. 'Abd al-Wahhab al-Zaydi (d. c. 384), naqib of the 'Abbasids and holder of the prayer-leadership; in 380 he was the first to combine the prayer and the niqaba, and his son Abu'l-Hasan — laqab Nizam al-Hadratayn — was appointed his deputy over the prayer and given the robe {cite:muntazam-ibn-al-jawzi j.7 p.179}."
