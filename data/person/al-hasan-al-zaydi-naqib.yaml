summary:
  ar: "أبو تمام الحسن بن علي بن عبد الوهاب بن سليمان الزيدي ⁦(ت 384هـ تقريباً)⁩، نقيب العباسيين وصاحب الصلاة؛ وهو أول من جُمع له بين الصلاة والنقابة سنة ثمانين وثلثمائة، واستُخلف له ابنه أبو الحسن الملقب بنظام الحضرتين على الصلاة وخُلع عليه {cite:muntazam-ibn-al-jawzi j.7 p.179}."
  en: "Abu Tamam al-Hasan b. 'Ali b. 'Abd al-Wahhab al-Zaydi (d. c. 384), naqib of the 'Abbasids and holder of the prayer-leadership; in 380 he was the first to combine the prayer and the niqaba, and his son Abu'l-Hasan — laqab Nizam al-Hadratayn — was appointed his deputy over the prayer and given the robe {cite:muntazam-ibn-al-jawzi j.7 p.179}."
  es: "Abu Tamam al-Hasan b. 'Ali b. 'Abd al-Wahhab al-Zaydi (dc 384), naqib de los 'Abbasíes y titular de la dirección de la oración; en 380 fue el primero en combinar la oración y el niqaba, y su hijo Abu'l-Hasan — laqab Nizam al-Hadratayn — fue nombrado su adjunto para la oración y se le dio la túnica {cite:muntazam-ibn-al-jawzi j.7 p.179}."
  fr: "Abu Tamam al-Hasan b. 'Ali b. 'Abd al-Wahhab al-Zaydi (mort en 384), naqib des 'Abbassides et détenteur de la direction de la prière; en 380, il fut le premier à combiner la prière et le niqaba, et son fils Abu'l-Hasan — laqab Nizam al-Hadratayn — fut nommé son adjoint pour la prière et reçut la robe {cite:muntazam-ibn-al-jawzi j.7 p.179}."
  ur: "ابو تمام الحسن بن۔ علی بی۔ عبد الوہاب الزیدی ⁦(ڈی سی 384)⁩، عباسیوں کے نقیب اور امامت کے حامل؛ 380 میں وہ نماز اور نقاب کو یکجا کرنے والے پہلے شخص تھے، اور ان کے بیٹے ابو الحسن - لقب نظام الحدرتین - کو نماز پر اس کا نائب مقرر کیا گیا تھا اور اسے یہ لباس دیا گیا تھا۔"
  tr: "Abbasilerin lideri ve duanın lideri, Ebu Temmam el-Hasan bin Ali bin Abdül-Vahhab ibn Süleyman el-Zeydi (ö. yaklaşık 384 Hicri yılında); 380 Hicri yılında dua ve birlikleri birleştiren ilk kişi oydu ve oğlu Ebu el-Hasan, lakaplı Nizam el-Hadretain, onun yerine namazda yer aldı ve görevden aldı {atıf:Muntazam-ibn-al-Jawzi j.7 s.179}."
  id: "Abu Tammam al-Hasan ibn Ali ibn Abd al-Wahhab ibn Sulayman al-Zaydi (wafat sekitar 384 H), pemimpin Abbasiyah dan pemimpin doa; ia adalah yang pertama menggabungkan doa dan sindikasi pada tahun 380 H, dan putranya Abu al-Hasan, yang dijuluki Nizam al-Hadratain, menggantikannya dalam doa dan menggulingkannya {cite:muntazam-ibn-al-jawzi j.7 hlm.179}."
