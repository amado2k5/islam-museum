summary:
  ar: "مناضلة استقلال هندية (1850–1924) عُرفت بـ«بي أما» (الأم)، والدة محمد علي جوهر وشوكت علي. رهنت حُليّها لتعليم أبنائها بعد وفاة زوجها، وانضمت إلى لجنة الخلافة، وألقت خطابًا مؤثرًا في دورة الرابطة الإسلامية سنة 1917، وجالت الهند حاشدة النساء لدعم حركة الخلافة وجمع التبرعات لها حتى وفاتها."
  en: "Indian independence activist (1850–1924) known as Bi Amma ('the Mother'), mother of Muhammad Ali Jauhar and Shaukat Ali. Widowed young, she pawned her own jewellery to educate her children, joined the Khilafat committee, gave a celebrated speech at the 1917 Muslim League session, and toured India rallying women and raising funds for the Khilafat and freedom movements until her death."
  ur: "ہندوستانی مجاہد آزادی (1850ء–1924ء) جو ’بی اماں‘ کے نام سے مشہور ہیں، محمد علی جوہر اور شوکت علی کی والدہ۔ بیوگی کے بعد انھوں نے اپنے زیورات رہن رکھ کر بچوں کو تعلیم دلوائی، خلافت کمیٹی میں شامل ہوئیں، 1917ء کے مسلم لیگ اجلاس میں پُرجوش تقریر کی اور وفات تک تحریک خلافت اور آزادی کے لیے ملک بھر کا دورہ کر کے خواتین کو متحرک کرتی اور چندہ جمع کرتی رہیں۔"
