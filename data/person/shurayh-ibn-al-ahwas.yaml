id: person/shurayh-ibn-al-ahwas
class: person
label: { ar: "شريح بن الأحوص" }
summary:
  ar: "ابن الأحوص بن جعفر الكلابي؛ طعن لقيط بن زرارة يوم شعب جبلة لما أقحم فرسه الجرف فسقط مرتثاً — ويقال إن الطاعن جزء بن خالد بن جعفر والأول أثبت {cite:ansab-al-ashraf p. 30}."
  en: "Son of al-Ahwas ibn Ja'far; he speared Laqit ibn Zurara down the ravine at Sha'b Jabala — though some give the thrust to Jaz' ibn Khalid {cite:ansab-al-ashraf p. 30}."
  es: "Hijo de al-Ahwas ibn Ja'far; atravesó con su lanza a Laqit ibn Zurara por el barranco de Sha'b Jabala, aunque algunos atribuyen el impacto a Jaz' ibn Khalid {cita:ansab-al-ashraf p. 30}."
  fr: "Fils d'al-Ahwas ibn Ja'far; il a transpercé Laqit ibn Zurara dans le ravin de Sha'b Jabala — bien que certains attribuent la poussée à Jaz' ibn Khalid {cite:ansab-al-ashraf p. 30}."
  ur: "الاحواس ابن جعفر کا بیٹا؛ اس نے لقیط بن زرارہ کو شعب جبلہ میں گھاٹی سے نیچے پھینک دیا - حالانکہ کچھ لوگ جاز بن خالد کو زور دیتے ہیں 30}۔"
