summary:
  ar: "الحافظ أبو موسى محمد بن أبي بكر عمر بن أبي عيسى الأصبهاني المديني؛ كان إمام عصره في الحفظ والمعرفة، رحل عن أصبهان في طلب الحديث ثم رجع إليها؛ له مصنفات مفيدة منها كتاب «المغيث» في جلد أكمل به كتاب «الغريبين» للبروي واستدرك عليه، وكتاب «الزيادات» ذيلاً على كتاب شيخه أبي الفضل محمد بن طاهر المقدسي «الأنساب»، وذيّل على «معرفة الصحابة» لابن منده {cite:wafayat-ayan}."
  en: "The hafiz Abu Musa Muhammad ibn Abi Bakr Umar ibn Abi Isa al-Isfahani al-Madini; he was the foremost figure of his age in memorization and knowledge. He travelled out of Isfahan in search of hadith and then returned to it. His useful works include al-Mughith, a single volume in which he completed al-Gharibayn of al-Bruwi and corrected it, and al-Ziyadat, a supplement to the Ansab of his teacher Abu al-Fadl Muhammad ibn Tahir al-Maqdisi; he also supplemented Ma'rifat al-sahaba of Ibn Mandah {cite:wafayat-ayan}."
