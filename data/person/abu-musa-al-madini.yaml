summary:
  ar: "الحافظ أبو موسى محمد بن أبي بكر عمر بن أبي عيسى الأصبهاني المديني؛ كان إمام عصره في الحفظ والمعرفة، رحل عن أصبهان في طلب الحديث ثم رجع إليها؛ له مصنفات مفيدة منها كتاب «المغيث» في جلد أكمل به كتاب «الغريبين» للبروي واستدرك عليه، وكتاب «الزيادات» ذيلاً على كتاب شيخه أبي الفضل محمد بن طاهر المقدسي «الأنساب»، وذيّل على «معرفة الصحابة» لابن منده {cite:wafayat-ayan}."
  en: "The hafiz Abu Musa Muhammad ibn Abi Bakr Umar ibn Abi Isa al-Isfahani al-Madini; he was the foremost figure of his age in memorization and knowledge. He travelled out of Isfahan in search of hadith and then returned to it. His useful works include al-Mughith, a single volume in which he completed al-Gharibayn of al-Bruwi and corrected it, and al-Ziyadat, a supplement to the Ansab of his teacher Abu al-Fadl Muhammad ibn Tahir al-Maqdisi; he also supplemented Ma'rifat al-sahaba of Ibn Mandah {cite:wafayat-ayan}."
  fr: "Le hafiz Abu Musa Muhammad ibn Abi Bakr Umar ibn Abi Isa al-Isfahani al-Madini ; il fut la figure majeure de son temps pour la mémoire et le savoir. Il quitta Ispahan à la recherche du hadith puis y revint. Ses ouvrages utiles comprennent al-Mughith, en un seul volume, où il compléta et corrigea al-Gharibayn d'al-Bruwi, et al-Ziyadat, supplément aux Ansab de son maître Abu al-Fadl Muhammad ibn Tahir al-Maqdisi ; il compléta aussi la Ma'rifat al-sahaba d'Ibn Mandah {cite:wafayat-ayan}."
  es: "El hafiz Abu Musa Muhammad ibn Abi Bakr Umar ibn Abi Isa al-Isfahani al-Madini fue la figura más destacada de su época en memorización y conocimiento. Viajó fuera de Isfahán en busca de hadices y luego regresó. Entre sus obras más valiosas se encuentran al-Mughith, un volumen único en el que completó al-Gharibayn de al-Bruwi y lo corrigió, y al-Ziyadat, un suplemento a los Ansab de su maestro Abu al-Fadl Muhammad ibn Tahir al-Maqdisi; también complementó Ma'rifat al-sahaba de Ibn Mandah {cite:wafayat-ayan}."
