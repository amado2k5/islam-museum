summary:
  ar: "عبد الرزاق بن عبد المحسن البدر (وُلد 1382هـ/1963م) عالم سعودي وأستاذ العقيدة بالجامعة الإسلامية بالمدينة المنورة يدرّس في المسجد النبوي، ابن العالم عبد المحسن العباد، وله مصنفات كثيرة في أسماء الله الحسنى والأدعية والأذكار، وتُبث دروسه عبر قناته على يوتيوب."
  en: "Abd al-Razzaq ibn Abd al-Muhsin Al-Badr (born 1382 AH / 1963 CE) is a Saudi scholar, professor of creed at the Islamic University of Madinah who also teaches in the Prophet's Mosque, son of the scholar Abd al-Muhsin Al-Abbad, and author of many works on the names of God, supplication and remembrance; his lessons are carried on his YouTube channel."
  ur: "عبد الرزاق بن عبد المحسن البدر (پیدائش 1382ھ/1963ء) سعودی عالم، جامعہ اسلامیہ مدینہ منورہ میں عقیدہ کے استاد اور مسجد نبوی کے مدرس ہیں؛ عالم عبد المحسن العباد کے صاحبزادے ہیں اور اسمائے الٰہی و ادعیہ و اذکار پر ان کی کئی تصانیف ہیں۔"
