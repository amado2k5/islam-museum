summary:
  ar: "السلطان السادس والعشرون لبروناي (1906–1924)، ابن هاشم جليل العالم أقام الدين. اعتلى العرش في السابعة عشرة تحت مجلس وصاية وتُوّج سنة 1918؛ وهو أول سلطان بروناي يتكلم الإنجليزية، وشجّع الزراعة والطب والتعليم والتعليم الإسلامي في إحدى أفقر فترات بروناي. توفي في أيلول 1924 وخلفه ابنه الأكبر أحمد تاج الدين."
  en: "The 26th Sultan of Brunei (1906–1924), son of Hashim Jalilul Alam Aqamaddin. He came to the throne aged seventeen under a regency council and was crowned in 1918; the first Bruneian sultan to speak English, he encouraged agriculture, medicine, education and Islamic learning through one of Brunei's poorest periods. He died in September 1924 and was succeeded by his eldest son Ahmad Tajuddin."
  ur: "برونائی کے چھبیسویں سلطان (1906ء–1924ء)، ہاشم جلیل العالم اقام الدین کے بیٹے۔ سترہ برس کی عمر میں مجلسِ وصایت کے تحت تخت نشین ہوئے اور 1918ء میں تاج پوشی ہوئی؛ وہ انگریزی بولنے والے پہلے برونائی سلطان تھے اور انہوں نے برونائی کے ایک غریب ترین دور میں زراعت، طب، تعلیم اور اسلامی تعلیم کی حوصلہ افزائی کی۔ ستمبر 1924ء میں وفات پائی اور ان کے بڑے بیٹے احمد تاج الدین جانشین ہوئے۔"
