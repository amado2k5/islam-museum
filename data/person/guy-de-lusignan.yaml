kids:
  ar: "غي دي لوزينيان ملك فرنجي قاد جيشه في معركة حطين وأُسر فيها، ثم أُطلق وانتقل بعد ذلك إلى جزيرة قبرص."
  en: "Guy de Lusignan was a Frankish king who led his army at the Battle of Hattin, was captured there, and was later set free and moved on to the island of Cyprus."
  ur: "گی دی لوزینیان ایک فرنگی بادشاہ تھے جنہوں نے حطین کی جنگ میں اپنی فوج کی قیادت کی، وہاں قید ہوئے، پھر رہا ہوئے اور بعد میں قبرص کے جزیرے پہنچ گئے۔"
