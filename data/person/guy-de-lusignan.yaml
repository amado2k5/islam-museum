summary:
  ar: "غي دي لوزينيان فارس قدم من بلاد الفرنج إلى الشام فتزوجته ملكة بيت المقدس ونقلت إليه الملك، وهو الذي يسميه ابن الأثير كي. قاد الفرنج في وقعة حطين سنة 583هـ/1187م فأُسر هو وأخوه وأرناط صاحب الكرك، وبقي أسيراً ثم أُطلق بعد فتح بيت المقدس. وتذكر دائرة المعارف الإسلامية أنه كان مدعياً لتاج بيت المقدس حين انضم إلى ريتشارد في قبرص، وأن ريتشارد باعه الجزيرة سنة 1192م {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 5 p. 341}."
  en: "Guy de Lusignan was a knight who came from the Frankish lands to Syria, married the queen of Jerusalem and received the kingdom through her; Ibn al-Athir calls him Kay. He led the Franks at Hattin in 583/1187, where he was taken prisoner with his brother and Raynald of Kerak, and was released after the fall of Jerusalem. The Encyclopaedia of Islam describes him as a claimant to the crown of Jerusalem when he joined Richard in Cyprus, and says Richard resold him the island in 1192 {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 5 p. 341}."
  ur: "گی دی لوزینیان ایک فرنگی شہسوار تھے جو شام آئے، یروشلم کی ملکہ سے ان کا نکاح ہوا اور اسی کے ذریعے سلطنت ان کے حصے میں آئی؛ ابن الاثیر انہیں «کی» لکھتے ہیں۔ 583ھ/1187ء میں حطین کی جنگ میں فرنگیوں کی قیادت انہی کے پاس تھی، وہاں وہ اپنے بھائی اور کرک کے ارناط سمیت قید ہوئے اور بیت المقدس کے فتح ہونے کے بعد رہا کیے گئے۔ دائرۃ المعارف الاسلامیہ کے مطابق جب وہ قبرص میں رچرڈ سے ملے تو بیت المقدس کے تاج کے دعوے دار تھے، اور رچرڈ نے 1192ء میں جزیرہ انہیں بیچ دیا {cite:kamil-ibn-al-athir p. 141} {cite:kamil-ibn-al-athir p. 148} {cite:encyclopaedia-of-islam-2 vol. 5 p. 341}."
