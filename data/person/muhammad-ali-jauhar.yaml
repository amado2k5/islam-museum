summary:
  ar: "سياسي وصحفي وشاعر هندي (1878–1931)، من مؤسسي العصبة الإسلامية لعموم الهند والجامعة الملية الإسلامية، ومن أبرز قادة حركة الخلافة. تعلم في عليكرة وكلية لينكولن بأكسفورد، وأسس أسبوعية «كومريد» الإنجليزية (1911) ويومية «همدرد» الأردية (1913)، وتولى رئاسة المؤتمر الوطني الهندي سنة 1923. سُجن مرارًا، آخرها بتهمة خطاب في مؤتمر الخلافة، ومثل العصبة في مؤتمر المائدة المستديرة الأول بلندن سنة 1930، وتوفي فيها ودُفن في القدس."
  en: "Indian politician, journalist and poet (1878–1931), a co-founder of the All-India Muslim League and of Jamia Millia Islamia and a leading figure of the Khilafat movement. Educated at Aligarh and Lincoln College, Oxford, he launched the English weekly The Comrade (1911) and the Urdu daily Hamdard (1913), and was president of the Indian National Congress in 1923. Repeatedly imprisoned, lastly for a speech at the Khilafat Conference, he represented the League at the first Round Table Conference in London in 1930, died there, and was buried in Jerusalem."
  ur: "ہندوستانی سیاست دان، صحافی اور شاعر (1878ء–1931ء)، آل انڈیا مسلم لیگ اور جامعہ ملیہ اسلامیہ کے بانیوں میں سے اور تحریک خلافت کے سرکردہ رہنما۔ علی گڑھ اور لنکن کالج، آکسفورڈ سے تعلیم پائی، انگریزی ہفت روزہ «کامریڈ» (1911ء) اور اردو روزنامہ «ہمدرد» (1913ء) جاری کیا، اور 1923ء میں انڈین نیشنل کانگریس کے صدر رہے۔ بارہا قید ہوئے، آخری بار خلافت کانفرنس کی تقریر پر، 1930ء میں لندن کی پہلی گول میز کانفرنس میں لیگ کی نمائندگی کی، وہیں انتقال ہوا اور بیت المقدس میں دفن ہوئے۔"
