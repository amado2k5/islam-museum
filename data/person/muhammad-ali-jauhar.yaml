summary:
  ar: "سياسي وصحفي وشاعر هندي (1878–1931)، من مؤسسي العصبة الإسلامية لعموم الهند والجامعة الملية الإسلامية، ومن أبرز قادة حركة الخلافة. تعلم في عليكرة وكلية لينكولن بأكسفورد، وأسس أسبوعية «كومريد» الإنجليزية (1911) ويومية «همدرد» الأردية (1913)، وتولى رئاسة المؤتمر الوطني الهندي سنة 1923. سُجن مرارًا، آخرها بتهمة خطاب في مؤتمر الخلافة، ومثل العصبة في مؤتمر المائدة المستديرة الأول بلندن سنة 1930، وتوفي فيها ودُفن في القدس."
  en: "Indian politician, journalist and poet (1878–1931), a co-founder of the All-India Muslim League and of Jamia Millia Islamia and a leading figure of the Khilafat movement. Educated at Aligarh and Lincoln College, Oxford, he launched the English weekly The Comrade (1911) and the Urdu daily Hamdard (1913), and was president of the Indian National Congress in 1923. Repeatedly imprisoned, lastly for a speech at the Khilafat Conference, he represented the League at the first Round Table Conference in London in 1930, died there, and was buried in Jerusalem."
  ur: "ہندوستانی سیاست دان، صحافی اور شاعر ⁦(1878ء–1931ء)⁩، آل انڈیا مسلم لیگ اور جامعہ ملیہ اسلامیہ کے بانیوں میں سے اور تحریک خلافت کے سرکردہ رہنما۔ علی گڑھ اور لنکن کالج، آکسفورڈ سے تعلیم پائی، انگریزی ہفت روزہ «کامریڈ» ⁦(1911ء)⁩ اور اردو روزنامہ «ہمدرد» ⁦(1913ء)⁩ جاری کیا، اور 1923ء میں انڈین نیشنل کانگریس کے صدر رہے۔ بارہا قید ہوئے، آخری بار خلافت کانفرنس کی تقریر پر، 1930ء میں لندن کی پہلی گول میز کانفرنس میں لیگ کی نمائندگی کی، وہیں انتقال ہوا اور بیت المقدس میں دفن ہوئے۔"
  es: "Político, periodista y poeta indio (1878-1931), cofundador de la Liga Musulmana de la India y de Jamia Millia Islamia, y figura destacada del movimiento Khilafat. Educado en Aligarh y en el Lincoln College de Oxford, fundó el semanario en inglés The Comrade (1911) y el diario en urdu Hamdard (1913), y fue presidente del Congreso Nacional Indio en 1923. Encarcelado en repetidas ocasiones, la última por un discurso en la Conferencia Khilafat, representó a la Liga en la primera Conferencia de Mesa Redonda en Londres en 1930, donde falleció y fue enterrado en Jerusalén."
  fr: "Homme politique, journaliste et poète indien (1878-1931), cofondateur de la Ligue musulmane panindienne et de la Jamia Millia Islamia, il fut une figure de proue du mouvement Khilafat. Après des études à Aligarh et au Lincoln College d'Oxford, il lança l'hebdomadaire anglais The Comrade (1911) et le quotidien ourdou Hamdard (1913), et présida le Congrès national indien en 1923. Emprisonné à plusieurs reprises, notamment pour un discours prononcé lors de la Conférence du Khilafat, il représenta la Ligue à la première Conférence de la Table ronde à Londres en 1930, où il mourut et fut inhumé à Jérusalem."
  tr: "Hindistanlı bir politikacı, gazeteci ve şair (1878–1931), Tüm Hindistan Müslüman Birliği ve Millia Müslüman Üniversitesi'nin kurucularından biri ve Hilafe Hareketi'nin en önde gelen liderlerinden biri. Alikra ve Oxford'daki Lincoln College'da eğitim gördü, İngilizce haftalık 'Comrade' (1911) ve Urduca günlük 'Hamdard'ı (1913) kurdu ve 1923'te Hindistan Ulusal Kongresi başkanlığını üstlendi. Sonuncusu Hilafet Konferansı'nda yaptığı konuşma suçlamasıyla defalarca hapse atıldı ve 1930'da Londra'daki ilk Yuvarlak Masa Konferansı'nda Birliği temsil etti; burada öldü ve Kudüs'te defnedildi."
  id: "Seorang politikus, jurnalis, dan penyair India (1878–1931), salah satu pendiri All India Muslim League dan Millia Muslim University, serta salah satu pemimpin paling terkemuka dari Gerakan Khilafa. Ia belajar di Alikra dan Lincoln College, Oxford, mendirikan mingguan Inggris 'Comrade' (1911) dan harian Urdu 'Hamdard' (1913), serta menjabat sebagai presiden Indian National Congress pada tahun 1923. Ia dipenjara berulang kali, yang terakhir atas tuduhan pidato di Konferensi Khilafat, dan mewakili League di Konferensi Meja Bundar pertama di London pada tahun 1930, di mana ia meninggal dan dimakamkan di Yerusalem."
