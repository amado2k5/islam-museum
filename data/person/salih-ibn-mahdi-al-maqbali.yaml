roles: [jurist]
gender: male
summary:
  ar: "صالح بن مهدي بن علي المقبلي، مجتهد وفقيه زيدي من اليمن، ولد في مقبل من بلاد كوكبان ونشأ في ثلا ثم رحل إلى مكة سنة 1080هـ وكتب فيها مؤلفاته وتوفي بها؛ ينتقد في كتبه التقليد وعدداً من الفرق."
  en: "Salih ibn Mahdi al-Maqbali, a Zaydi mujtahid and jurist from Yemen, born at Maqbal in the land of Kawkaban and raised in Thula; he moved to Mecca in 1080 AH, wrote his works there and died there, and his books criticise taqlid and several groups."
  es: "Salih ibn Mahdi al-Maqbali, un muytahid y jurista zaidí de Yemen, nació en Maqbal, en la tierra de Kawkaban, y se crió en Thula; se trasladó a La Meca en el año 1080 de la Hégira, escribió allí sus obras y murió allí, y sus libros critican el taqlid y a varios grupos."
  fr: "Salih ibn Mahdi al-Maqbali, un mujtahid et juriste zaydite du Yémen, né à Maqbal au pays de Kawkaban et élevé à Thula; il s'installa à La Mecque en 1080 AH, y écrivit ses œuvres et y mourut, et ses livres critiquent le taqlid et plusieurs groupes."
  ur: "صالح بن مہدی المقبلی، یمن کے ایک زیدی مجتہد اور فقیہ، کوکبان کی سرزمین میں مقبل میں پیدا ہوئے اور تھولا میں پرورش پائی۔ وہ 1080 ہجری میں مکہ چلے گئے، وہاں اپنی تصانیف لکھیں اور وہیں وفات پائی، اور ان کی کتابوں میں تقلید اور متعدد گروہوں پر تنقید کی گئی ہے۔"
