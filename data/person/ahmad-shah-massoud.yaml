summary:
  ar: "قائد عسكري وسياسي أفغاني، أبرز قادة المجاهدين في وادي بنجشير ضد الاحتلال السوفيتي (1979–1989)، عُرف بلقب أسد بنجشير. وزير دفاع دولة أفغانستان الإسلامية منذ 1992، قاد الجبهة الإسلامية المتحدة (تحالف الشمال) ضد طالبان من 1996 حتى اغتياله على يد انتحاريي القاعدة في 9 سبتمبر 2001، وسُمّي بعد وفاته بطلاً وطنياً لأفغانستان."
  en: "Afghan military commander and politician, the foremost mujahideen commander of the Panjshir Valley against the Soviet occupation (1979–1989), known as the Lion of Panjshir. Minister of Defence of the Islamic State of Afghanistan from 1992, he led the United Islamic Front (Northern Alliance) against the Taliban from 1996 until his assassination by al-Qaeda suicide bombers on 9 September 2001. He was posthumously named a national hero of Afghanistan."
  ur: "افغان عسکری قائد اور سیاست دان، سوویت قبضے (1979ء–1989ء) کے خلاف وادی پنجشیر کے ممتاز ترین مجاہد کمانڈر، جو شیر پنجشیر کے لقب سے معروف ہوئے۔ 1992ء سے اسلامی دولت افغانستان کے وزیر دفاع، انھوں نے 1996ء سے 9 ستمبر 2001ء کو القاعدہ کے خودکش بمباروں کے ہاتھوں اپنے قتل تک طالبان کے خلاف متحدہ اسلامی محاذ (شمالی اتحاد) کی قیادت کی۔ وفات کے بعد انھیں افغانستان کا قومی ہیرو قرار دیا گیا۔"
