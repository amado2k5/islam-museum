summary:
  ar: "قاضي القضاة؛ سمع من الخشوعي وتفقه على أبيه قاضي القضاة شمس الدين وعلى فخر الدين بن عساكر، وقل من نشأ مثله في صيانته وديانته واشتغاله؛ ناب عن أبيه وولي وكالة بيت المال ودرس بالإقبالية وغيرها ثم استقل بمنصب القضاء مدة ثم عزل واستمر على تدريس الإقبالية والجاروخية، وقد درس بالعادلية الكبيرة والناصرية وهو أول من درس بها، وخرج له الحافظ الدمياطي معجماً؛ قال الذهبي كان مشكور السيرة في القضاء لين الجانب حسن المداراة والاحتمال؛ رجع من عند هلاكو متمارضاً فأدركه الموت ببعلبك {cite:shadharat-dhahab p. 299-300}."
  en: "Damascus's qadi al-qudat (b. 590) — first mudarris of the Nasiriyya, al-Dimyati dedicated a mu'jam to him; 'praised for his conduct in office' per Dhahabi; returning ill from Hulagu's camp he died at Baalbek, Jumada II 658, aged 68 {cite:shadharat-dhahab p. 299-300}."
  es: "Qadi al-qudat de Damasco (n. 590): primer mudarris de Nasiriyya, al-Dimyati le dedicó un mu'jam; 'elogiado por su conducta en el cargo' según Dhahabi; Al regresar enfermo del campamento de Hulagu, murió en Baalbek, Jumada II 658, a la edad de 68 años {cita: shadharat-dhahab p. 299-300}."
  fr: "Le qadi al-qudat de Damas (né en 590) — premier mudarris des Nasiriyya, al-Dimyati lui dédia un mu'jam; « félicité pour sa conduite au pouvoir » selon Dhahabi; de retour malade du camp de Hulagu, il mourut à Baalbek, Joumada II 658, à l'âge de 68 ans {cite: shadharat-dhahab p. 299-300}."
  ur: "دمشق کی قضا القدات ⁦(متوفی 590)⁩ - نصیریہ کے پہلے مدارس، الدمیاتی نے اس کے لیے ایک مجمع وقف کیا۔ ذہبی کے مطابق 'عہدے میں ان کے طرز عمل کی تعریف کی گئی' ہلاگو کے کیمپ سے بیمار واپس آتے ہوئے اس کا انتقال بعلبیک میں ہوا، جمادی الثانی 658، عمر 68 سال۔ 299-300}۔"
  tr: "Baş Yargıç; El-Haşvai'den dinledi ve babası Baş Yargıç Şemseddin ile Fakhr al-Din bin Asakir'in yanında hukuk eğitimi aldı. Onun gibi koruma, dindarlık ve çalışmada çok az kişi yetişti; babasını temsil etti, kamu hazinesinin temsilciliğini yaptı, İkbali ve diğer alanlarda eğitim aldı, ardından bir süre yargıda bağımsız oldu, görevden alındı ve İkbali ile Cerükhi okullarında öğretmenliğe devam etti. El-Adliyya ve Nasiriye'de eğitim gördü, orada ilk öğretmen oldu. El-Hafız el-Dimyati onun için bir sözlük yayımladı. El-Dhahabi, yargıdaki davranışları için sabır ve hoşgörüyle övüldüğünü; Halaku'dan asi bir şekilde döndüğünü ve Baalbek'te ölümüyle karşılaştığını söyledi. {alıntı:Shadharat-Dhahab, s. 299-300}."
  id: "Ketua Hakim; ia mendengar dari Al-Khashwa'i dan mempelajari hukum di bawah ayahnya, Ketua Hakim Shams al-Din, dan Fakhr al-Din ibn Asakir. Hanya sedikit yang tumbuh seperti ia dalam pelestarian, kesalehan, dan pekerjaannya; ia mewakili ayahnya, mengangkat badan kas negara, belajar di Iqbali dan bidang lain, kemudian menjadi mandiri di peradilan untuk sementara waktu, diberhentikan, dan melanjutkan mengajar sekolah Iqbali dan Jarukhi. Ia belajar di Al-Adiliyya dan Nasiriyah, menjadi yang pertama mengajar di sana. Al-Hafiz Al-Dimyati menerbitkan kamus untuknya. Al-Dhahabi mengatakan ia dipuji atas perilakunya dalam peradilan, dengan kesabaran dan toleransi yang baik; ia kembali dari Halaku dengan cara yang memberontak, dan kematian menimpanya di Baalbek. {cite:Shadharat-Dhahab, hlm. 299-300}."
