summary:
  ar: "قاضي القضاة؛ سمع من الخشوعي وتفقه على أبيه قاضي القضاة شمس الدين وعلى فخر الدين بن عساكر، وقل من نشأ مثله في صيانته وديانته واشتغاله؛ ناب عن أبيه وولي وكالة بيت المال ودرس بالإقبالية وغيرها ثم استقل بمنصب القضاء مدة ثم عزل واستمر على تدريس الإقبالية والجاروخية، وقد درس بالعادلية الكبيرة والناصرية وهو أول من درس بها، وخرج له الحافظ الدمياطي معجماً؛ قال الذهبي كان مشكور السيرة في القضاء لين الجانب حسن المداراة والاحتمال؛ رجع من عند هلاكو متمارضاً فأدركه الموت ببعلبك {cite:shadharat-dhahab p. 299-300}."
  en: "Damascus's qadi al-qudat (b. 590) — first mudarris of the Nasiriyya, al-Dimyati dedicated a mu'jam to him; 'praised for his conduct in office' per Dhahabi; returning ill from Hulagu's camp he died at Baalbek, Jumada II 658, aged 68 {cite:shadharat-dhahab p. 299-300}."
