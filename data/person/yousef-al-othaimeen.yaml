  ar: يوسف العثيمين ⁦(1955–)⁩ دبلوماسي سعودي، أمين عام منظمة التعاون الإسلامي ⁦(2016–2021)⁩، ووزير سعودي سابق للشؤون الاجتماعية ⁦(2007–2015)⁩، من خبرة علم الاجتماع والعمل الحكومي.
  en: Yousef al-Othaimeen (born 1955) is a Saudi diplomat and sociologist who served as Secretary-General of the Organisation of Islamic Cooperation from 2016 to 2021, after eight years as Saudi Minister
    of Social Affairs (2007–2015).
