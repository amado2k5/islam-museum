  es: "Yousef al-Othaimeen (nacido en 1955) es un diplomático y sociólogo saudí que se desempeñó como Secretario General de la Organización para la Cooperación Islámica desde 2016 hasta 2021, después de ocho años como Ministro de Asuntos Sociales de Arabia Saudí (2007-2015)."
