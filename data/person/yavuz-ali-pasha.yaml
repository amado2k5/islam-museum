summary:
  ar: "بطاقة أولية لياووز علي باشا الملطي، بيلربي مصر ثم الصدر الأعظم العثماني في ١٦٠١–١٦٠٣م في عهد محمد الثالث، توفي سنة ١٦٠٤م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
