  fr: "Fiche de candidature de Yavuz Ali Pacha, beylerbey d'Égypte puis grand vizir ottoman de 1601 à 1603 sous Mehmed III, décédé en 1604; la source n'est pas encore vérifiée sur la page."
  ur: "یاوز علی پاشا کے لیے ڈرافٹ کارڈ، جو مصر کے بیلربی، پھر 1601-1603 کے عثمانی وزیر اعظم محمد III کے تحت، ڈی۔ 1604; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Mısır'ın hükümdarı ve ardından 1601-1603 yılları arasında Osmanlı Sadrazami olan Yavuz Ali Paşa El-Malti'nin ön kartı, 1604 yılında öldü; Osmanlı tarih kitaplarında anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Yavuz Ali Pasha Al-Malti, penguasa Mesir dan kemudian Grand Vizier Ottoman dari tahun 1601 hingga 1603 M selama masa pemerintahan Mehmed III, meninggal pada tahun 1604 M; ia dikenang dalam buku sejarah Ottoman, dan biografinya belum pernah diulas di halaman."
