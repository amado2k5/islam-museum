label: { ar: "تاج الدين أبو بكر صاحب زوزن", en: "Taj al-Din Abu Bakr of Zuzan" }
summary:
  ar: "تاج الدين أبو بكر أمير خوارزمشاه محمد بن تكش؛ بدأ جمالاً يكري الجمال في الأسفار ثم صار سروان جماله فرأى منه خوارزمشاه جلداً وأمانة فقدمه حتى صار من أعيان أمرائه وأثقتهم وولاه زوزن، فقال له: بلاد كرمان مجاورة لبلدي فلو أضاف إلي عسكراً لملكتها، ففتحها في أسرع وقت وملك مكران إلى السند وأطاعه صاحب هرمز وخطب لخوارزمشاه بقلهات وبعض عمان؛ كان عاقلاً ذا رأي وحزم وشجاعة {cite:kamil-ibn-al-athir p. 362-363}."
  en: "From camel-hirer to the Khwarazmshah's most trusted amir — Abu Bakr of Zuzan conquered Kirman, Makran and Sind, received Hormuz's tribute and raised his master's khutba on the Omani coast {cite:kamil-ibn-al-athir p. 362-363}."
