summary:
  ar: "الحسين بن علي الهاشمي (وُلد في إسطنبول سنة 1853 – توفي في عمان في 4 يونيو 1931)، شريف مكة وأميرها من نوفمبر 1908، من ذرية الحسن بن علي عبر فرع بني قتادة الذين حكموا مكة منذ 1201. أعلن الثورة العربية الكبرى على الدولة العثمانية في 10 يونيو 1916 بعد مراسلاته مع المندوب السامي البريطاني مكماهون، وصار ملكًا على الحجاز، ورفض التصديق على معاهدة فرساي احتجاجًا على وعد بلفور، وأصدر في 1917 و1918 مراسيم لحماية اللاجئين الأرمن. وبعد إلغاء تركيا الخلافة في 3 مارس 1924 أُعلن خليفة، لكن بريطانيا وفرنسا والوهابيين عارضوا خلافته؛ وفي أكتوبر 1924 تنازل لابنه علي بعد تقدم ابن سعود، ونُفي إلى قبرص في يونيو 1925، ثم أُعيد إلى عمان أواخر 1930 وتوفي فيها ودُفن في الحرم الشريف بالقدس. ابنه عبد الله صار ملكًا على الأردن وابنه فيصل ملكًا على العراق."
  en: "Hussein bin Ali al-Hashimi (born at Istanbul in 1853 – died at Amman on 4 June 1931) was Sharif and Emir of Mecca from November 1908, a descendant of Hasan ibn Ali through the Banu Qatadah branch that had ruled Mecca since 1201. After his correspondence with the British high commissioner McMahon he proclaimed the Great Arab Revolt against the Ottoman Empire on 10 June 1916 and became King of the Hejaz; he refused to ratify the Treaty of Versailles in protest at the Balfour Declaration, and in 1917 and 1918 issued decrees protecting Armenian refugees. After Turkey abolished the caliphate on 3 March 1924 he was proclaimed Caliph, a claim opposed by Britain, France and the Wahhabis; in October 1924, as Ibn Saud advanced, he abdicated to his son Ali, was exiled to Cyprus in June 1925, was brought back to Amman in late 1930, died there and was buried at the Haram al-Sharif in Jerusalem. His son Abdullah became King of Jordan and his son Faisal King of Iraq."
  ur: "حسین ابن علی ہاشمی (ولادت: استنبول، 1853ء – وفات: عمان، 4 جون 1931ء) نومبر 1908ء سے شریف و امیرِ مکہ رہے؛ وہ حسن بن علی کی نسل سے تھے، بنو قتادہ کی اس شاخ سے جس نے 1201ء سے مکہ پر حکومت کی۔ برطانوی ہائی کمشنر مکمہون سے خط کتابت کے بعد انہوں نے 10 جون 1916ء کو سلطنتِ عثمانیہ کے خلاف ثورۂ عربیہ کبریٰ کا اعلان کیا اور حجاز کے بادشاہ بنے؛ بالفور اعلان کے خلاف احتجاج میں معاہدۂ ورسائی کی توثیق سے انکار کیا اور 1917ء و 1918ء میں آرمینی پناہ گزینوں کے تحفظ کے فرامین جاری کیے۔ 3 مارچ 1924ء کو ترکی کے خلافت ختم کرنے کے بعد وہ خلیفہ قرار دیے گئے، مگر برطانیہ، فرانس اور وہابیوں نے مخالفت کی؛ اکتوبر 1924ء میں ابن سعود کی پیش قدمی پر بیٹے علی کے حق میں دست بردار ہوئے، جون 1925ء میں قبرص جلاوطن کیے گئے، 1930ء کے آخر میں عمان واپس آئے اور وہیں وفات پا کر حرم شریف، یروشلم میں دفن ہوئے۔ ان کے بیٹے عبداللہ اردن کے اور فیصل عراق کے بادشاہ بنے۔"
