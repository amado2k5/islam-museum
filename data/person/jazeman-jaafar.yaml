summary:
  ar: "سائق سباقات ماليزي، وُلد في كوالالمبور سنة 1992. فاز بلقب فورمولا بي إم دبليو آسيا سنة 2007 وهو في الرابعة عشرة، وحلّ ثانيًا في بطولة فورمولا 3 البريطانية سنة 2012 — وفاز في ذلك العام بسباق بو الكبير — ثم شارك في فورمولا رينو 3.5 وبلانبان وسوبر جي تي."
  en: "Malaysian racing driver, born in Kuala Lumpur in 1992. He won the Formula BMW Asia title in 2007 at fourteen, finished runner-up in British Formula 3 in 2012 — winning the Pau Grand Prix that year — and later raced in Formula Renault 3.5, Blancpain and Super GT."
  ur: "ملائیشیائی ریسنگ ڈرائیور، جو 1992 میں کوالالمپور میں پیدا ہوئے۔ انہوں نے چودہ سال کی عمر میں 2007 میں فارمولا BMW ایشیا کا خطاب جیتا، 2012 میں برطانوی فارمولا 3 میں دوسرے نمبر پر رہے — اسی سال پو گراں پری جیتی — اور بعد میں فارمولا رینو 3.5، بلان پان اور سپر GT میں ریس کی۔"
