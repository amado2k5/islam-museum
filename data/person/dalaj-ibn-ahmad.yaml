summary:
  ar: "دعلج بن أحمد بن دعلج بن عبد الرحمن السجستاني؛ أمير من أمراء الدولة العباسية ومن أهل الجود والمروءة، كان إذا بلغه عن محتاجٍ شيء أنعم عليه وتحقق حسابه إشفاقاً من الغلط، وأجاز من وقف أمام بابه بأموال {cite:wafayat-ayan}."
  en: "Da'laj b. Ahmad al-Sijistani — an Abbasid-era prince noted for generosity, who verified his ledger before granting gifts lest the petitioner be underpaid {cite:wafayat-ayan}."
  es: "Da'laj b. Ahmad al-Sijistani — un príncipe de la era abasí conocido por su generosidad, que verificaba su libro de cuentas antes de otorgar regalos para que el solicitante no recibiera un pago insuficiente {cite:wafayat-ayan}."
  fr: "Da'laj b. Ahmad al-Sijistani — un prince de l'époque abbasside réputé pour sa générosité, qui vérifiait son registre avant d'accorder des cadeaux afin que le demandeur ne soit pas sous-payé {cite:wafayat-ayan}."
  ur: "دلاج بی۔ احمد السجستانی — ایک عباسی دور کا شہزادہ جو سخاوت کے لیے مشہور تھا، جس نے تحائف دینے سے پہلے اپنے لیجر کی تصدیق کی تھی کہ کہیں درخواست گزار کو کم معاوضہ نہ دیا جائے۔"
  tr: "Da'laj ibn Ahmed ibn Da'laj ibn Abd al-Rahman al-Sijistani; Abbasi prensleri arasında bir prens ve cömert ve şövalyelik sahibiydi. Bir şey duyduğunda, hatalarına karşı merhametle ona kutsamalar verir, hesabını kapatır ve kapısında duran herkesin {atıf:wafayat-ayan} kabul etmesine izin verirdi."
  id: "Da'laj ibn Ahmad ibn Da'laj ibn Abd al-Rahman al-Sijistani; seorang pangeran di antara para pangeran Abbasiyah dan seorang yang murah hati serta berwibawa. Setiap kali mendengar sesuatu yang membutuhkan, ia akan memberkati dan melunasi kesalahannya, sebagai belas kasihan atas kesalahan, dan ia mengizinkan siapa pun yang berdiri di pintunya menerima {cite:wafayat-ayan}."
