  ar: "علي الجرجاني، من قدماء المتعبدين المتخلين من الشهوات، لقيه السري السقطي في طريقه إلى عبادان، وأوصاه بخمس خصال، وهو غير الشريف الجرجاني صاحب التعريفات."
  en: "Ali al-Jurjani, an early worshipper who renounced desires; al-Sari al-Saqati met him on the road to Abbadan and he gave him five counsels. He is a different man from al-Sharif al-Jurjani, the author of the Definitions."
  fr: "Ali al-Jurjani, un adorateur précoce qui a renoncé aux désirs ; al-Sari al-Saqati l'a rencontré sur le chemin d'Abbadan et il lui a donné cinq conseils. C’est un homme différent d’al-Sharif al-Jurjani, l’auteur des Définitions."
  ur: "علی جرجانی قدیم عابدوں میں سے تھے جنہوں نے خواہشات چھوڑ دیں۔ سری سقطی سے عبادان کے راستے پر ملاقات ہوئی اور انہوں نے پانچ نصیحتیں کیں۔ یہ شریف جرجانی، صاحبِ «التعریفات» سے مختلف شخص ہیں۔"
