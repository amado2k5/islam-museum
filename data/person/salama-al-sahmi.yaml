label:
  ar: "سلامة السهمي"
  en: "Salama al-Sahmi"
  ur: "سلامہ السہمی"
summary:
  ar: "سلامة السهمي، شاعر عربي من النصف الثاني من القرن الأول الهجري من بني سهم، فرع هذيل بالحجاز، من أنصار الدعوة المروانية، مدح عبد الملك وعبد العزيز ابني مروان، وخاصة أبا خالد عبد العزيز من بني أسيد. {cite:encyclopaedia-of-islam-2 vol. 1 p. 167}"
  en: "Salama al-Sahmi, an Arab poet of the second half of the first/seventh century, of the tribe of Sahm, a branch of Hudhayl in the Hijaz, who embraced the Marwanid cause, was imprisoned by Ibn al-Zubayr and freed on his death, and praised 'Abd al-Malik and his brother 'Abd al-'Aziz, above all the amir Abu Khalid 'Abd al-'Aziz of the Asid clan. The printed heading gives only 'SALAMA'; the entry's first line names no father, so the name here is Salama. {cite:encyclopaedia-of-islam-2 vol. 1 p. 167}"
  ur: "سلامہ السہمی، پہلی صدی ہجری کے دوسرے نصف کے عرب شاعر، بنو سہم کے جو حجاز میں ہذیل کی شاخ تھے، مروانی دعوت کے حامی، ابن زبیر کی قید سے ان کی موت پر رہائی پائی، اور عبدالملک اور ان کے بھائی عبدالعزیز کی مدح کی، خصوصاً امیر ابو خالد عبدالعزیز بنی اسید کی۔ مدخل کی سرخی میں صرف «SALAMA» ہے، اور متن کی پہلی سطر میں والد کا نام نہیں، اس لیے یہاں نام سلامہ رکھا گیا ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 167}"
