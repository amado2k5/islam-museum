id: person/abdullah-ibn-saba
class: person
label: { ar: "عبد الله بن سبأ", en: "Abd Allah ibn Saba" }
summary:
  ar: "رجل نسبته المصادر إلى يهود صنعاء ويكنى بابن السوداء، ظهر في أواخر خلافة عثمان فنشر دعوة الوصية لعلي ونقد الولاة، وتعده المصادر السنية والشيعية سبب إيقاد الفتنة التي انتهت بمقتل عثمان. ينقل الصلابي عن الطبري أنه طاف الحجاز والبصرة والكوفة والشام ومصر، ويرى أن شخصيته ثابتة وأن الشكوك فيها من المستشرقين ومن بعض المعاصرين، وأن دوره كان عاملاً من عوامل الفتنة لا سببها الوحيد {cite:sallabi-ali-vol2 p. 10}."
  en: "A man the sources tie to the Jews of Sana'a, called Ibn al-Sawda, who in the last years of Uthman's caliphate spread the claim that Ali held a right of succession by designation and attacked the governors. The author treats him as historically real and as one agitator among several causes of the strife that ended with Uthman's killing {cite:sallabi-ali-vol2 p. 10}."
