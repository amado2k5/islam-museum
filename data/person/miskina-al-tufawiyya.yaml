summary:
  ar: "عابدة من البصرة كانت تواظب على حلق الذكر وتنحدر إلى الأبلة لمجلس عيسى بن زاذان؛ يروي ابن الجوزي في «صفة الصفوة» رؤيا عمار الراهب لها بعد موتها."
  en: "A devout woman of Basra who kept to circles of remembrance and travelled down to al-Ubulla for the gathering of Isa ibn Zadhan; Ibn al-Jawzi's Sifat al-Safwa records Ammar al-Rahib's dream of her after her death."
  ur: "بصرہ کی ایک عابدہ جو ذکر کے حلقوں میں باقاعدگی سے جاتیں اور عیسیٰ بن زاذان کی مجلس کے لیے ابلہ جاتیں؛ ابن الجوزی کی «صفۃ الصفوہ» میں ان کی وفات کے بعد عمار راہب کا خواب مذکور ہے۔"
  es: "Una mujer devota de Basora que participaba en círculos de recuerdo y viajaba hasta al-Ubulla para la reunión de Isa ibn Zadhan; el Sifat al-Safwa de Ibn al-Jawzi registra el sueño que Ammar al-Rahib tuvo de ella después de su muerte."
  fr: "Une femme pieuse de Bassora qui fréquentait les cercles de mémoire et se rendait à al-Ubulla pour le rassemblement d'Isa ibn Zadhan; le Sifat al-Safwa d'Ibn al-Jawzi relate le rêve d'Ammar al-Rahib à son sujet après sa mort."
