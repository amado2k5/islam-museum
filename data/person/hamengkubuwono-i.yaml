summary:
  ar: "هامنكوبوونو الأول (أغسطس 1717 – 24 مارس 1792)، وُلد باسم رادن ماس سوجانا وعُرف بالأمير مانغكوبومي، مؤسس سلطنة يوجياكرتا وأول سلاطينها. قاتل أميرُ ماتارام هذا شركةَ الهند الشرقية الهولندية منذ 1746، فنال بموجب معاهدة غيانتي سنة 1755 نصف ماتارام، وبنى يوجياكرتا عاصمة له، وحكم حتى وفاته. أعلنته إندونيسيا بطلًا قوميًا سنة 2006."
  en: "Hamengkubuwono I (August 1717 – 24 March 1792), born Raden Mas Sujana and known as Prince Mangkubumi, was the founder and first sultan of Yogyakarta. A Mataram prince who fought the Dutch East India Company from 1746, he won half of Mataram under the Treaty of Giyanti in 1755, built Yogyakarta as his capital and reigned until his death. Indonesia named him a National Hero in 2006."
  ur: "ہامینگکوبوونو اول (اگست 1717ء – 24 مارچ 1792ء)، پیدائشی نام رادن ماس سوجانا اور شہزادہ مانگکوبومی کے نام سے معروف، یوگیاکارتا سلطنت کے بانی اور پہلے سلطان تھے۔ ماتارم کے اس شہزادے نے 1746ء سے ولندیزی ایسٹ انڈیا کمپنی سے جنگ کی، 1755ء میں گیانتی معاہدے کے تحت آدھا ماتارم حاصل کیا، یوگیاکارتا کو اپنا دارالحکومت بنایا اور وفات تک حکومت کی۔ انڈونیشیا نے 2006ء میں انہیں قومی ہیرو قرار دیا۔"

