summary:
  ar: "رابع شاهات الدولة الصفوية في إيران (حكم 1578–1587)، ابن الشاه طهماسب الأول وخليفة أخيه إسماعيل الثاني. كان شبه أعمى، وهيمنت على حكمه فصائل القزلباش وزوجته مهد عليا، فضعفت سلطة التاج في أثناء الحرب العثمانية الصفوية (1578–1590)، وسقطت تبريز سنة 1585، ثم خُلع سنة 1587 لصالح ابنه عباس الأول. وكان شاعرًا يتخلّص بلقب «فهمي»."
  en: "Fourth Safavid shah of Iran (r. 1578-1587), a son of Tahmasp I who succeeded his brother Ismail II. Nearly blind and dominated by Qizilbash factions and his wife Mahd-e Olya, he presided over a weakening crown during the Ottoman-Safavid war (1578-1590), lost Tabriz in 1585, and was deposed in 1587 in favour of his son Abbas I. He wrote poetry under the pen name Fahmi."
  ur: "ایران کے چوتھے صفوی شاہ (دورِ حکومت 1578ء–1587ء)، شاہ طہماسپ اول کے بیٹے اور اپنے بھائی اسماعیل دوم کے جانشین۔ تقریباً نابینا تھے؛ ان کے عہد میں قزلباش گروہوں اور ان کی اہلیہ مہدِ علیا کا غلبہ رہا، عثمانی صفوی جنگ (1578ء–1590ء) کے دوران تاج کی طاقت کمزور ہوئی، 1585ء میں تبریز ہاتھ سے گیا، اور 1587ء میں ان کے بیٹے عباس اول کے حق میں انھیں معزول کر دیا گیا۔ «فہمی» تخلص سے شاعری بھی کرتے تھے۔"

