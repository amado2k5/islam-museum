summary:
  ar: "علي بن عبد الواحد بن محمد الأنصاري السجلماسي الجزائري، أبو الحسن، فقيه مالكي من سلالة سعد بن عبادة الخزرجي، ولد بتافلات ونشأ بسجلماسة وتوفي بالجزائر سنة 1057 هـ، من كتبه «المنح الإحسانية في الأجوبة التلمسانية» و«اليواقيت الثمينة»."
  en: "Ali ibn Abd al-Wahid ibn Muhammad al-Ansari al-Sijilmasi al-Jazairi, Abu al-Hasan, a Maliki jurist of the line of Sa'd ibn Ubada al-Khazraji, born at Tafilalt, raised at Sijilmasa and dead in al-Jazair in 1057 AH; his books include 'al-Minah al-Ihsaniyya fi al-Ajwiba al-Tilimsaniyya' and 'al-Yawaqit al-Thamina'."
