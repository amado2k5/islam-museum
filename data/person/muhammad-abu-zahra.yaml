summary:
  ar: "محمد بن أحمد أبو زهرة، وصفه الزركلي بأنه أكبر علماء الشريعة الإسلامية في عصره، ولد بالمحلة الكبرى وتعلم بمدرسة القضاء الشرعي ودرّس بالجامعة وكلية الحقوق، وصنف أكثر من أربعين كتابا منها «أصول الفقه» وكتب الأئمة الأربعة؛ ١٣١٦ إلى ١٣٩٤هـ الموافقة ١٨٩٨ إلى ١٩٧٤م."
  en: "Muhammad ibn Ahmad Abu Zahra, whom al-Zirikli calls the greatest scholar of Islamic law of his age; born in al-Mahalla al-Kubra, trained at the School of Shari'a Judiciary, a university teacher and deputy dean of the Faculty of Law at Cairo, author of more than forty books including «Usul al-Fiqh» and a large study of each of the four imams. 1316 to 1394 AH, 1898 to 1974 CE."
