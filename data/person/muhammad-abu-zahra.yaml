summary:
  ar: "محمد بن أحمد أبو زهرة، وصفه الزركلي بأنه أكبر علماء الشريعة الإسلامية في عصره، ولد بالمحلة الكبرى وتعلم بمدرسة القضاء الشرعي ودرّس بالجامعة وكلية الحقوق، وصنف أكثر من أربعين كتابا منها «أصول الفقه» وكتب الأئمة الأربعة؛ ١٣١٦ إلى ١٣٩٤هـ الموافقة ١٨٩٨ إلى ١٩٧٤م."
  en: "Muhammad ibn Ahmad Abu Zahra, whom al-Zirikli calls the greatest scholar of Islamic law of his age; born in al-Mahalla al-Kubra, trained at the School of Shari'a Judiciary, a university teacher and deputy dean of the Faculty of Law at Cairo, author of more than forty books including «Usul al-Fiqh» and a large study of each of the four imams. 1316 to 1394 AH, 1898 to 1974 CE."
  es: "Muhammad ibn Ahmad Abu Zahra, a quien al-Zirikli considera el mayor erudito en derecho islámico de su época; nació en al-Mahalla al-Kubra, se formó en la Escuela de Derecho Islámico (Sharia), fue profesor universitario y vicedecano de la Facultad de Derecho de El Cairo, autor de más de cuarenta libros, entre ellos «Usul al-Fiqh» y un extenso estudio sobre cada uno de los cuatro imanes. Vivió entre 1316 y 1394 d. C. (1898-1974 d. C.)."
  fr: "Muhammad ibn Ahmad Abu Zahra, que al-Zirikli qualifie de plus grand juriste islamique de son époque, est né à al-Mahalla al-Kubra. Formé à l'École de jurisprudence de la charia, il fut professeur d'université et vice-doyen de la faculté de droit du Caire. Auteur de plus de quarante ouvrages, dont « Usul al-Fiqh » et une étude approfondie sur chacun des quatre imams, il vécut de 1316 à 1394 AH (1898-1974 ap. J.-C.)."
  ur: "محمد بن احمد ابو زہرہ، جنہیں الزرکلی نے اپنے دور کے اسلامی قانون کا سب سے بڑا عالم قرار دیا ہے۔ المحلہ الکبریٰ میں پیدا ہوئے، شریعہ عدلیہ کے اسکول میں تربیت یافتہ، یونیورسٹی کے استاد اور قاہرہ میں فیکلٹی آف لاء کے نائب ڈین، چالیس سے زائد کتابوں کے مصنف، بشمول «اصول الفقہ» اور چاروں اماموں میں سے ہر ایک کا بڑا مطالعہ۔ 1316 تا 1394 ہجری، 1898 تا 1974 عیسوی۔"
  tr: "Muhammed ibn Ahmed Abu Zehra, el-Zerkali tarafından döneminin en büyük İslam hukuku âlimi olarak tanımlanır; Mahalla el-Kubra'da doğmuş, Şeriat Yargı Fakültesi'nde eğitim görmüş, üniversite ve Hukuk Fakültesi'nde eğitim görmüştür. 1316-1394 Hicri yılları arasında 'Usul al-Fiqh' ve 'Dört İmamın Kitapları' dahil olmak üzere kırktan fazla kitap yazmıştır; bunlar arasında 1898-1974 yılları arasında yer alır."
  id: "Muhammad ibn Ahmad Abu Zahra, yang digambarkan oleh al-Zarkali sebagai ulama hukum Islam terbesar pada zamannya, lahir di Mahalla al-Kubra, belajar di Sekolah Kehakiman Syariah, dan belajar di universitas serta Fakultas Hukum. Ia menulis lebih dari empat puluh buku, termasuk 'Usul al-Fiqh' dan 'Kitab-kitab Empat Imam' dari tahun 1316 hingga 1394 H, yang bertepatan dengan tahun 1898 hingga 1974 M."
