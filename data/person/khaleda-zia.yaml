summary:
  ar: "سياسية بنغلاديشية (15 أغسطس 1946 – 30 ديسمبر 2025)، أرملة الرئيس ضياء الرحمن، وأول امرأة ترأس حكومة بنغلاديش. ترأست الحزب الوطني البنغلاديشي من سنة 1984 حتى وفاتها، وقادت الحركة المؤيدة للديمقراطية ضد نظام إرشاد، فترأست الوزراء من 1991 إلى 1996 ومن 2001 إلى 2006، وسُجنت بتهم فساد سنة 2018 ثم أُطلق سراحها وبُرّئت بعد انتفاضة يوليو 2024، وتوفيت في دكا فنالت جنازة رسمية."
  en: "Bangladeshi politician (15 August 1946 – 30 December 2025), the widow of President Ziaur Rahman and the first woman to head Bangladesh's government. She chaired the Bangladesh Nationalist Party from 1984 until her death, helped lead the pro-democracy movement against the Ershad regime, served as prime minister from 1991 to 1996 and from 2001 to 2006, was imprisoned on corruption charges in 2018 and released and acquitted after the July 2024 uprising, and died at Dhaka, receiving a state funeral."
  ur: "بنگلہ دیشی سیاست دان (15 اگست 1946ء – 30 دسمبر 2025ء)، صدر ضیاء الرحمان کی بیوہ اور بنگلہ دیش کی حکومت کی سربراہی کرنے والی پہلی خاتون۔ انھوں نے 1984ء سے اپنی وفات تک بنگلہ دیش نیشنلسٹ پارٹی کی سربراہی کی، ارشاد حکومت کے خلاف جمہوریت نواز تحریک کی قیادت میں شریک رہیں، 1991ء سے 1996ء اور 2001ء سے 2006ء تک وزیر اعظم رہیں، 2018ء میں بدعنوانی کے الزامات میں قید ہوئیں اور جولائی 2024ء کی بغاوت کے بعد رہا اور بری ہوئیں، اور ڈھاکہ میں وفات پائی جہاں انھیں سرکاری اعزاز کے ساتھ جنازہ ملا۔"
