  ar: "عبد الرحمن بن عبد القادر بن علي، أبو زيد الفاسي، فقيه باحث متفنن من أهل فاس نعته ابن زيدان بسيوطي زمانه، لازم المولى الرشيد وصنف نيفا وسبعين كتابا منها مفتاح الشفاء وأزهار البستانين؛ 1040 إلى 1096 هـ."
  en: "Abd al-Rahman ibn Abd al-Qadir al-Fasi, Abu Zayd, a jurist and polymath of Fez whom Ibn Zaydan called the al-Suyuti of his age, companion of Mawlay al-Rashid and author of more than seventy books, among them Miftah al-Shifa and Azhar al-Basatin; 1040 to 1096 AH (1631 to 1685)."
