summary:
  ar: "قاضي القضاة شهاب الدين السعدي الأنصاري الدمشقي الصالحي الحنبلي؛ كان صدراً رئيساً من رؤساء دمشق وهو من بيت علم ورياسة ولى قضاء دمشق عن البرهان ابن مفلح ولم تطل مدته ثم عزل فلم يلتفت إلى المنصب بعد ذلك واستمر في منزله بالصالحية معظماً وكان عنده سخاء وحسن لقاء وإكرام لمن يرد عليه، توفي بمكة المشرفة يوم الخميس ثالث شعبان سنة إحدى وتسعين وثمانمائة ودفن بالمعلاة {cite:shadharat-dhahab p. 350-351}."
  en: "Al-Sa'di — 'a head among Damascus's heads' from a house of knowledge and riyasa; briefly succeeded Burhan ibn Muflih as Damascus qadi then lived honoured at his Salihiyya home; died at Mecca Thursday 3 Sha'ban 891, buried at al-Ma'la {cite:shadharat-dhahab p. 350-351}."
  fr: "Al-Sa'di - \"une tête parmi les têtes de Damas\" d'une maison de la connaissance et riyasa ; a brièvement succédé à Burhan ibn Muflih que Damas qadi vivait alors honoré à sa maison Salihiyya ; est mort à La Mecque jeudi 3 chaabane 891, enterré à al-Ma'la {cite:shadharat-dhahab p. 350-351}."
  es: "Al-Sa'di — 'una cabeza entre las cabezas de Damasco' de una casa de conocimiento y riyasa; sucedió brevemente a Burhan ibn Muflih como cadí de Damasco y luego vivió honrado en su casa Salihiyya; murió en La Meca el jueves 3 de Sha'ban de 891, enterrado en al-Ma'la {cita: shadharat-dhahab págs. 350-351}."
  ur: "السعدی - 'دمشق کے سربراہوں میں سے ایک سر' علم اور ریاضت کے گھر سے؛ برہان بن مفلح کی جانشینی مختصر طور پر دمشق کے قاضی کے طور پر ہوئی اور پھر اپنے گھر صالحیہ میں عزت کے ساتھ رہنے لگے۔ جمعرات 3 شعبان 891 کو مکہ میں وفات پائی، المعلا میں دفن ہوئے۔ 350-351}۔"
  tr: "Baş Yargıç Şihabeddin el-Seydi el-Ensari el-Dimashqi el-Salihi el-Hanbali; Şam'ın bilgili ve lider bir ailesinden gelen bir başşefti. Şam yargıcını, görev süresi uzun sürmeyen el-Burhan bin Muflih'ten atadı. Görevden alındı ve sonrasında göreve dikkat etmedi, onuruna el-Salihiye'deki evinde kaldı. Cömertti, hoş selamlar veriyor ve kendisine cevap verenleri onurlandırıyordu. 891 Hicri yılında, Şa'ban'ın üçüncü günü Perşembe günü Mekke'de vefat etti ve Ma'la'da defnedildi {cite:shadharat-dhahab, s. 350-351}."
  id: "Ketua Hakim Shihab al-Din al-Sa'di al-Ansari al-Dimashqi al-Salihi al-Hanbali; ia adalah kepala suku Damaskus dari keluarga yang berpengetahuan dan berwibawa. Ia mengangkat hakim Damaskus dari al-Burhan ibn Muflih, yang masa jabatannya tidak berlangsung lama. Ia diberhentikan dan tidak memperhatikan jabatan tersebut setelahnya, dan tetap tinggal di rumahnya di al-Salihiyah sebagai penghormatan. Ia murah hati, ramah dalam menyapa, dan menghormati mereka yang meresponsnya. Ia wafat di Mekah pada hari Kamis, tanggal tiga Sha'ban, tahun 891 H, dan dimakamkan di Ma'la {cite:shadharat-dhahab, hlm. 350-351}."
