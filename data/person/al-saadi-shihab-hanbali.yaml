  en: "Al-Sa'di — 'a head among Damascus's heads' from a house of knowledge and riyasa; briefly succeeded Burhan ibn Muflih as Damascus qadi then lived honoured at his Salihiyya home; died at Mecca Thursday 3 Sha'ban 891, buried at al-Ma'la {cite:shadharat-dhahab p. 350-351}."
