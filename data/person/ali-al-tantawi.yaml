summary:
  ar: "فقيه وأديب وقاضٍ سوري (1909–1999)، كتب في «الرسالة» عشرين سنة، وقضى خمسة وعشرين عامًا في القضاء ووضع مشروع قانون الأحوال الشخصية السوري، ثم أقام في السعودية خمسًا وثلاثين سنة، فكانت برامجه «على مائدة الإفطار» و«نور وهداية» و«مسائل ومشكلات» من أطول البرامج عمرًا في إذاعتها وتلفزيونها، ونال جائزة الملك فيصل لخدمة الإسلام في 1990."
  en: "Syrian jurist, writer and judge (1909–1999) who wrote for al-Risala for twenty years, served twenty-five years as a judge and drafted Syria's personal-status law, then lived thirty-five years in Saudi Arabia, where his 'Ala Ma'idat al-Iftar', 'Nur wa Hidaya' and 'Masa'il wa Mushkilat' were among the longest-running programmes of its radio and television; King Faisal Prize for Service to Islam, 1990."
  ur: "شامی فقیہ، ادیب اور قاضی ⁦(1909ء–1999ء)⁩، جنھوں نے بیس برس «الرسالہ» میں لکھا، پچیس برس قضا میں گزارے اور شام کے قانونِ احوالِ شخصیہ کا مسودہ تیار کیا، پھر پینتیس برس سعودی عرب میں رہے، جہاں ان کے پروگرام «علیٰ مائدۃ الافطار»، «نور و ہدایہ» اور «مسائل و مشکلات» وہاں کے ریڈیو اور ٹیلی وژن کے طویل ترین پروگراموں میں تھے؛ 1990ء میں شاہ فیصل انعام برائے خدمتِ اسلام۔"
