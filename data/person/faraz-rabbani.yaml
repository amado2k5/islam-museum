summary:
  ar: "عالم ومدرّس كندي من أصل باكستاني، وُلد سنة 1974 في كراتشي. مؤسس منظمة طالب الهداية ⁦(SeekersGuidance)⁩ التعليمية غير الربحية ومديرها للتعليم، ومن روّاد التعليم الشرعي وخدمات الأسئلة الفقهية عبر الإنترنت في الغرب."
  en: "Canadian scholar and teacher of Pakistani origin, born in 1974 in Karachi. Founder and education director of the SeekersGuidance educational non-profit, and among the pioneers of online Islamic education and fatwa question services in the West."
  ur: "پاکستانی نژاد کینیڈین عالم اور مدرس، 1974ء میں کراچی میں پیدا ہوئے۔ غیر منافع بخش تعلیمی ادارے سیکرزگائیڈنس ⁦(SeekersGuidance)⁩ کے بانی اور ڈائریکٹرِ تعلیم، اور مغرب میں آن لائن دینی تعلیم و فقہی سوالات کی خدمات کے سر فہرست رہنماؤں میں شمار ہوتے ہیں۔"
  es: "Académica y docente canadiense de origen pakistaní, nacida en 1974 en Karachi. Fundadora y directora de educación de la organización educativa sin fines de lucro SeekersGuidance, y una de las pioneras de la educación islámica en línea y los servicios de consulta de fatwas en Occidente."
  fr: "Érudit et enseignant canadien d'origine pakistanaise, né en 1974 à Karachi. Fondateur et directeur pédagogique de l'organisme éducatif à but non lucratif SeekersGuidance, et parmi les pionniers de l'éducation islamique en ligne et des services de questions sur les fatwas en Occident."
  tr: "1974 yılında Karaçi'de doğmuş, Pakistan kökenli Kanadalı bir akademisyen ve öğretmendir. Kar amacı gütmeyen eğitim kuruluşu SeekersGuidance'ın kurucusu ve direktörü, ayrıca Batı'da İslami eğitim ve çevrimiçi fıkıh soru hizmetlerinin öncülerinden biridir."
  id: "Seorang cendekiawan dan guru asal Kanada keturunan Pakistan, lahir pada tahun 1974 di Karachi. Pendiri dan direktur organisasi pendidikan nirlaba SeekersGuidance, serta salah satu pelopor pendidikan Islam serta layanan pertanyaan yurisprudensi daring di Barat."
