label: { ar: "أبو زكريا اليفرني النحوي" }
summary:
  ar: "أبو زكريا يحيى بن علي بن سلطان اليفرني الفقيه النحوي الأديب الممترض على ابن حبيش؛ ولد سنة ٦٤١ وبرع في العربية وكان يلقب في المشرق بجبل النحو، وكان عند نفسه مجتهداً فلا يجيز نكاح الكتابيات خلافاً للإمام مالك وهو مذهب الإمام أحمد بن حنبل، ويرى أن الطلاق لا يكون إلا مرتين مرة للاستبراء ومرة للانفصال ولا يقول بالثلاث وهو خلاف الإجماع، وله في إعراب الآيات رأي خاص كقوله في إن هذان لساحران إن الهاء اسم إن وذان خبرها تفسيرية لا تحتاج لرابط؛ توفي سنة ٧٠٠ {cite:nafh-tib-maqqari p. 150-151}."
  en: "Abu Zakariya Yahya ibn Ali al-Yafrini — the jurist-grammarian who argued against Ibn Hubaysh; born 641, nicknamed in the Mashriq 'the mountain of grammar,' a self-standing mujtahid who forbade marrying kitabi women (the Hanbali view against Malik), held divorce counted only twice against consensus, and kept idiosyncratic parses of Quranic loci; he died in 700 {cite:nafh-tib-maqqari p. 150-151}."
