id: person/al-yafrini
class: person
label: { ar: "أبو زكريا اليفرني النحوي", en: "Abu Zakariya al-Yafrini, the grammarian", fr: "Abu Zakariya al-Yafrini, le grammairien", es: "Abu Zakariya al-Yafrini, the grammarian", ur: "ابو زکریا ال یفرینی، گرامر" }
summary:
  ar: "أبو زكريا يحيى بن علي بن سلطان اليفرني الفقيه النحوي الأديب الممترض على ابن حبيش؛ ولد سنة ٦٤١ وبرع في العربية وكان يلقب في المشرق بجبل النحو، وكان عند نفسه مجتهداً فلا يجيز نكاح الكتابيات خلافاً للإمام مالك وهو مذهب الإمام أحمد بن حنبل، ويرى أن الطلاق لا يكون إلا مرتين مرة للاستبراء ومرة للانفصال ولا يقول بالثلاث وهو خلاف الإجماع، وله في إعراب الآيات رأي خاص كقوله في إن هذان لساحران إن الهاء اسم إن وذان خبرها تفسيرية لا تحتاج لرابط؛ توفي سنة ٧٠٠ {cite:nafh-tib-maqqari p. 150-151}."
  en: "Abu Zakariya Yahya ibn Ali al-Yafrini — the jurist-grammarian who argued against Ibn Hubaysh; born 641, nicknamed in the Mashriq 'the mountain of grammar,' a self-standing mujtahid who forbade marrying kitabi women (the Hanbali view against Malik), held divorce counted only twice against consensus, and kept idiosyncratic parses of Quranic loci; he died in 700 {cite:nafh-tib-maqqari p. 150-151}."
  fr: "Abu Zakariya Yahya ibn Ali al-Yafrini – le juriste-grammarien qui a plaidé contre Ibn Hubaysh ; Né en 641, surnommé dans le Mashriq « la montagne de la grammaire », un mujtahid autoportant qui interdisait d'épouser des femmes kitabi (le point de vue hanbali contre Malik), a tenu le divorce compté seulement deux fois contre le consensus, et a gardé les parses idiosyncratiques des loci coraniques ; Il est mort en 700 {cite:nafh-tib-maqqari p. 150-151}."
  es: "Abu Zakariya Yahya ibn Ali al-Yafrini — el jurista-gramático que argumentó contra Ibn Hubaysh; nacido en 641, apodado en el Mashriq 'la montaña de la gramática', un muytahid independiente que prohibió casarse con mujeres kitabi (la visión hanbalí contra Malik), sostuvo que el divorcio contaba solo dos veces contra el consenso y mantuvo análisis idiosincrásicos de los loci coránicos; murió en 700 {cite:nafh-tib-maqqari p. 150-151}."
  ur: "ابو زکریا یحییٰ ابن علی ال یفرینی - فقیہ گرامر جس نے ابن حبیش کے خلاف بحث کی؛ 641 میں پیدا ہوئے، مشرق میں 'گرائمر کے پہاڑ' کا نام دیا گیا، ایک خود ساختہ مجتہد جس نے کتابی عورتوں سے شادی کرنے سے منع کیا ⁦(مالک کے خلاف حنبلی نظریہ)⁩، اتفاق رائے کے خلاف صرف دو بار طلاقیں شمار کیں، اور قرآنی لوکی کے مضحکہ خیز پارے رکھے؛ ان کی وفات 700ھ میں ہوئی۔ 150-151}۔"
  tr: "Ebu Zekeriye Yahya ibn Ali ibn Sultan el-Yafrani, İbn Hubaysh tarafından eleştirilen hukukçu, dilbilgisi ve edebi figür; 641 Hicri doğumlu, Arapça'da üstün başarılıydı ve Doğu'da Cebel-Nahw lakabıyla anıldı. Kendi gözünde bir hukukçuydu ve İmam Malik'in aksine yazılı kadınlar arasında evliliğe izin vermedi; İmam Malik'in aksine İmam Ahmed ibn Hanbal'in okuludur. Boşanmanın sadece iki kez verilmesi gerektiğine inanıyordu: bir kez istibra için, bir kez ayrılık için, ve üç kez söylemedi, bu da genel görüşe aykırıdır. Ayrıca 'ha' kelimesinin bir isim olduğunu ve 'in' wadhan (in-wadhan) bir yorumlayıcı kelime olduğunu ve bağlantı gerektirmediğini söyler; 700 yılında öldü {cite:nafh-tib-maqqari, s. 150-151}."
  id: "Abu Zakariya Yahya ibn Ali ibn Sultan al-Yafrani, seorang ahli hukum, ahli tata bahasa, dan tokoh sastra yang dikritik oleh Ibn Hubaysh; lahir pada tahun 641 H, ia unggul dalam bahasa Arab dan dijuluki di Timur sebagai Jabal al-Nahw. Ia adalah seorang ahli hukum di matanya sendiri dan tidak mengizinkan pernikahan antara wanita yang bertulis, berbeda dengan Imam Malik yang merupakan aliran Imam Ahmad ibn Hanbal. Ia percaya bahwa perceraian hanya boleh diberikan dua kali: sekali untuk istibra dan sekali untuk perpisahan, dan ia tidak mengucapkannya tiga kali, yang bertentangan dengan konsensus. Ia juga memiliki pendapat khusus tentang cara mengurai ayat, seperti mengatakan bahwa 'ha' adalah kata benda 'in' wadhan (in-wadhan) adalah kata interpretasi yang tidak memerlukan kaitan; ia meninggal pada tahun 700 {cite:nafh-tib-maqqari, hlm. 150-151}."
