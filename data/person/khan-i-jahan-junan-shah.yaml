summary:
  ar: "ابن خان جهان مقبول التلنگاني وخلَفه في وزارة فيروز شاه تغلق نحو عشرين سنة، وبانٍ للمسجد الأسود في نظام الدين (772هـ) والمسجد الكبير عند بوابة تركمان (789هـ) بحسب نقشيهما {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  en: "Son of Khan-i Jahan Maqbul Tilangani and his successor as Firuz Shah Tughluq's vizier for some twenty years, builder by their inscriptions of the Kali Masjid at Nizamuddin (AH 772) and the Kalan Masjid at Turkman Gate (AH 789) {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  ur: "خانِ جہاں مقبول تلنگانی کے بیٹے اور تقریباً بیس برس فیروز شاہ تغلق کے وزیر، جن کے کتبوں کے مطابق انہوں نے نظام الدین کی کالی مسجد (772ھ) اور ترکمان دروازے کی کلاں مسجد (789ھ) بنوائی {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}۔"
