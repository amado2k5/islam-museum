summary:
  ar: "ابن خان جهان مقبول التلنگاني وخلَفه في وزارة فيروز شاه تغلق نحو عشرين سنة، وبانٍ للمسجد الأسود في نظام الدين ⁦(772هـ)⁩ والمسجد الكبير عند بوابة تركمان ⁦(789هـ)⁩ بحسب نقشيهما {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  en: "Son of Khan-i Jahan Maqbul Tilangani and his successor as Firuz Shah Tughluq's vizier for some twenty years, builder by their inscriptions of the Kali Masjid at Nizamuddin (AH 772) and the Kalan Masjid at Turkman Gate (AH 789) {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  ur: "خانِ جہاں مقبول تلنگانی کے بیٹے اور تقریباً بیس برس فیروز شاہ تغلق کے وزیر، جن کے کتبوں کے مطابق انہوں نے نظام الدین کی کالی مسجد ⁦(772ھ)⁩ اور ترکمان دروازے کی کلاں مسجد ⁦(789ھ)⁩ بنوائی {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}۔"
  es: "Hijo de Khan-i Jahan Maqbul Tilangani y su sucesor como visir de Firuz Shah Tughluq durante unos veinte años, constructor según sus inscripciones de la Mezquita Kali en Nizamuddin (AH 772) y la Mezquita Kalan en Turkman Gate (AH 789) {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  fr: "Fils de Khan-i Jahan Maqbul Tilangani et son successeur comme vizir de Firuz Shah Tughluq pendant une vingtaine d'années, constructeur, selon leurs inscriptions, de la Kali Masjid à Nizamuddin (AH 772) et de la Kalan Masjid à Turkman Gate (AH 789) {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  tr: "İbn Han Cihan Maqbool al-Telgani ve Firuz Şah'ın vezirliğindeki halefi yaklaşık yirmi yıl kapalı kaldı ve Nizam al-Din'deki Kara Camii (772 H) ile Türkmen Kapısı'ndaki Büyük Camii (789 H) yazıtlarına göre kuruldu {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011, s. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011, s. 82}."
  id: "Ibn Khan Jahan Maqbool al-Telgani dan penerusnya dalam kepemimpinan wazir Firuz Shah tetap ditutup selama sekitar dua puluh tahun, dan Masjid Hitam di Nizam al-Din (772 H) serta Masjid Agung di Gerbang Turkmen (789 H) didirikan sesuai prasasti mereka {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011, hlm. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011, hlm. 82}."
