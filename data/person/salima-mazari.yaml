summary:
  ar: "سياسية أفغانية، وُلدت في إيران سنة 1980 في أسرة لاجئة فرّت من الغزو السوفيتي لأفغانستان، ودرست في جامعة طهران وعملت لدى المنظمة الدولية للهجرة قبل أن تعود إلى أفغانستان. عُيّنت سنة 2018 حاكمة لمديرية تشاركنت (تشهار كنت) في ولاية بلخ، فكانت إحدى ثلاث نساء فقط في هذا المنصب في البلاد، وقادت مقاومة مديريتها لهجوم طالبان سنة 2021 حتى سقوط الجمهورية، ثم نجت ووصلت إلى الولايات المتحدة."
  en: "Afghan politician, born in Iran in 1980 to a refugee family that had fled the Soviet invasion of Afghanistan. She studied at the University of Tehran and worked for the International Organization for Migration before returning to Afghanistan. Appointed in 2018 as district governor of Charkint (Chahar Kint) in Balkh province — one of only three women district governors in the country — she led her district's resistance to the Taliban's 2021 offensive until the republic collapsed, then escaped to the United States."
  ur: "افغان سیاست دان، 1980ء میں ایران میں ایک پناہ گزین خاندان میں پیدا ہوئیں جو افغانستان پر سوویت حملے سے فرار ہوا تھا۔ انھوں نے تہران یونیورسٹی سے تعلیم حاصل کی اور افغانستان واپسی سے قبل بین الاقوامی تنظیم برائے مہاجرت میں کام کیا۔ 2018ء میں وہ بلخ صوبے کے ضلع چارکنت کی گورنر مقرر ہوئیں — ملک کی صرف تین خواتین ضلعی گورنروں میں سے ایک — اور 2021ء میں طالبان کے حملے کے خلاف اپنے ضلع کی مزاحمت کی قیادت کی، پھر امریکہ فرار ہونے میں کامیاب ہوئیں۔"
