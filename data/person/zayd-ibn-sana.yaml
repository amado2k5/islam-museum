summary:
  ar: "زيد بن سعنة، من أحبار يهود المدينة، يروي الحاكم بإسناده عن عبد الله بن سلام قصة إسلامه: اختبر حلم النبي بأن طالبه بدين قبل أجله بغلظة، فأمر النبي عمر أن يقضيه ويزيده، فأسلم وتصدق بشطر ماله؛ وفي الرواية أنه شهد مشاهد كثيرة وتوفي في غزوة تبوك. صححه الحاكم، وأنكره الذهبي {cite:mustadrak-ilmiyya-ata-v3 p. 700-701}."
  en: "Zayd ibn Sa'na, one of the Jewish rabbis of Medina. Al-Hakim gives, through 'Abd Allah ibn Salam, the story of his conversion: he tested the Prophet's forbearance by roughly demanding a debt before it was due; the Prophet told 'Umar to repay him and add more, and Zayd accepted Islam and gave half his wealth in charity. The report says he took part in many campaigns and died on the Tabuk expedition. Al-Hakim declared it sound; al-Dhahabi rejected it {cite:mustadrak-ilmiyya-ata-v3 p. 700-701}."
  ur: "زید بن سعنہ، مدینہ کے یہودی احبار میں سے۔ حاکم عبد اللہ بن سلام کے واسطے سے ان کے اسلام کا قصہ روایت کرتے ہیں: انہوں نے نبی کے حلم کو آزمانے کے لیے مدت سے پہلے سختی سے قرض کا مطالبہ کیا؛ نبی نے عمر کو حکم دیا کہ قرض ادا کریں اور زیادہ دیں، تو زید نے اسلام قبول کیا اور آدھا مال صدقہ کیا۔ روایت کے مطابق وہ کئی غزوات میں شریک ہوئے اور غزوہ تبوک میں وفات پائی۔ حاکم نے اسے صحیح کہا اور ذہبی نے اس کا انکار کیا {cite:mustadrak-ilmiyya-ata-v3 p. 700-701}۔"
