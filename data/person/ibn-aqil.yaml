id: person/ibn-aqil
class: person
label: { ar: "ابن عقيل شيخ الحنابلة" }
summary:
  ar: "أبو الوفاء علي بن عقيل البغدادي، شيخ الحنابلة، غسل الخليفة المستظهر لما مات سنة ثنتي عشرة وخمس مئة {cite:tarikh-khulafa-minhaj-1434 p. 661}. كان قد درس الكلام على مذهب المعتزلة، فلما أنكر عليه الشريف أبو جعفر ومن معه من الشيوخ ما وجدوه بخطه في الكتب من مذاهب المبتدعة كتب في عاشر المحرم سنة 465هـ بخطه نسخة توبته يبرأ فيها «من مذاهب المبتدعة والاعتزال وغيره ومن صحبة أربابه وتعظيم أمثالهم والترحم على أسلافهم»، ومن مسألة الليل التي علقها ومن اعتقاده في الحلاج أنه من أهل الدين والزهد والكرامات، ونصّ على أنه «قتل بإجماع فقهاء عصره وأصابوا في ذلك وأخطأ هو»، واشترط على نفسه إن عاد «فلإمام المسلمين مكافأتي على ذلك بما يوجبه الشرع من ردع ونكال وإبعاد» وشهد عليه جماعة كثيرة من الشهود {cite:muntazam-ibn-al-jawzi j.8 p.275-276}."
  en: "Shaykh of the Hanbalis who washed the caliph al-Mustazhir's body in 512 {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  es: "Shaykh de los Hanbalis que lavó el cuerpo del califa al-Mustazhir en 512 {cita:tarikh-khulafa-minhaj-1434 p. 661}."
  fr: "Cheikh des Hanbalis qui lava le corps du calife al-Mustazir en 512 {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  ur: "حنبلیوں کے شیخ جنہوں نے 512 میں خلیفہ المستظیر کے جسم کو دھویا۔ 661}۔"
  tr: "Hanbali şeyhi Ebu el-Vafa Ali bin Akil el-Bağdadi, halife el-Mustazhir'i beş yüz on iki yaşında vefat ettiğinde yıkadı {Kaynak: Tarikh-khulafa-minhaj-1434, s. 661}. Mu'tazilite okuluna göre teoloji okudu. Şerif Ebu Ca'far ve yoldaşları, yenilikçilerin öğretilerini el yazısında buldukları şeyler nedeniyle onu eleştirdiklerinde, 465 Hicri yılının Muharrem ayının onuncusunda kendi el yazısıyla tövbesinin bir kopyasını yazdı ve \"yenilikçilerin, Mu'tazila'ların ve diğerlerinin, efendilerinin topluluğundan ve benzerlerini yücelterek atalarına merhamet dilemekten vazgeçti \"O gece olayı ve Al-Hallaj'a inandığı inancından, kendisinin din, münzevi ve mucizeler sahibi biri olduğuna dair yorumlarından, \"zamanının hukukçularının uzlaşmasıyla öldürüldüğünü, onların bunda haklı olduğunu ve onun yanıldığını\" belirterek, geri dönerse \"Müslümanların İmamı bunun için caydırıcılık, ceza ve sürgün kanununa göre beni ödüllendirecek\" şeklinde ifade etti. Birçok tanık buna tanıklık etti {atı:Muntazam-ibn-al-jawzi J.\"de 8 s.275-276}."
  id: "Abu al-Wafa Ali ibn Aqil al-Baghdadi, sheikh Hanbali, membasuh khalifah al-mustazhir ketika ia wafat pada tahun lima ratus dua belas {cite:Tarikh-khulafa-minhaj-1434, hlm. 661}. Ia telah mempelajari teologi menurut mazhab Mu'tazilite. Ketika Sharif Abu Ja'far dan para sahabatnya mengkritiknya atas apa yang mereka temukan dalam tulisan tangannya tentang doktrin para inovator, ia menulis pada tanggal sepuluh Muharram tahun 465 H dengan tulisan tangannya sendiri salinan pertobatannya, di mana ia menolak \"doktrin para inovator, Mu'tazila, dan lainnya, serta dari kelompok para guru mereka, memuliakan yang mereka suka, dan berdoa memohon belas kasihan kepada leluhur mereka.\" Dari kisah malam yang ia komentari dan keyakinannya kepada Al-Hallaj bahwa ia adalah orang yang beragama, asketis, dan mukjizat, ia menyatakan bahwa ia \"dibunuh oleh kesepakatan para ahli hukum pada zamannya, dan mereka benar dalam hal itu, dan ia salah,\" dengan menyatakan bahwa jika ia kembali, \"Imam umat Islam akan memberi penghargaan kepada saya sesuai dengan hukum pencegahan, hukuman, dan pengusiran.\" Banyak saksi bersaksi tentang hal ini {cite:Muntazam-ibn-al-jawzi J.8 hlm.275-276}."
