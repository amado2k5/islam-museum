label: { ar: "ابن عقيل شيخ الحنابلة" }
summary:
  ar: "أبو الوفاء علي بن عقيل البغدادي، شيخ الحنابلة، غسل الخليفة المستظهر لما مات سنة ثنتي عشرة وخمس مئة {cite:tarikh-khulafa-minhaj-1434 p. 661}. كان قد درس الكلام على مذهب المعتزلة، فلما أنكر عليه الشريف أبو جعفر ومن معه من الشيوخ ما وجدوه بخطه في الكتب من مذاهب المبتدعة كتب في عاشر المحرم سنة 465هـ بخطه نسخة توبته يبرأ فيها «من مذاهب المبتدعة والاعتزال وغيره ومن صحبة أربابه وتعظيم أمثالهم والترحم على أسلافهم»، ومن مسألة الليل التي علقها ومن اعتقاده في الحلاج أنه من أهل الدين والزهد والكرامات، ونصّ على أنه «قتل بإجماع فقهاء عصره وأصابوا في ذلك وأخطأ هو»، واشترط على نفسه إن عاد «فلإمام المسلمين مكافأتي على ذلك بما يوجبه الشرع من ردع ونكال وإبعاد» وشهد عليه جماعة كثيرة من الشهود {cite:muntazam-ibn-al-jawzi j.8 p.275-276}."
  en: "Shaykh of the Hanbalis who washed the caliph al-Mustazhir's body in 512 {cite:tarikh-khulafa-minhaj-1434 p. 661}."
