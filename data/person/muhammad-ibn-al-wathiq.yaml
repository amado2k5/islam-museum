id: person/muhammad-ibn-al-wathiq
class: person
label:
  ar: محمد بن الواثق
  en: Muhammad ibn al-Wathiq
  es: "Muhammad ibn al-Wathiq"
  fr: "Muhammad ibn al-Wathiq"
  ur: "محمد بن الوثیق"
gender: male
roles:
- prince
summary:
  ar: من بني العباس؛ لما عُرض الأمر على المعتز بعد خلع المهتدي عانقه محمد بن الواثق ترحيباً به وجلسا على السرير، وذلك في سياق خلع المعتز {cite:muruj-mari-2005 juz' 4 p. 143}.
  en: An Abbasid prince, son of al-Wathiq. When al-Mu'tazz was brought before the court, Muhammad ibn al-Wathiq rose and embraced him and they sat together on the throne, in the context of al-Mu'tazz's deposition {cite:muruj-mari-2005 juz' 4 p. 143}.
  es: "Un príncipe abasí, hijo de al-Wathiq. Cuando al-Mu'tazz fue llevado ante la corte, Muhammad ibn al-Wathiq se levantó y lo abrazó, y se sentaron juntos en el trono, en el contexto de la declaración de al-Mu'tazz {cite:muruj-mari-2005 juz' 4 p. 143}."
  fr: "Un prince abbasside, fils d'al-Wathiq. Lorsque al-Mu'tazz fut amené devant la cour, Muhammad ibn al-Wathiq se leva et l'embrassa, et ils s'assirent ensemble sur le trône, dans le contexte de la déposition d'al-Mu'tazz {cite:muruj-mari-2005 juz' 4 p. 143}."
  ur: "ایک عباسی شہزادہ، الوثیق کا بیٹا۔ جب المعتز کو عدالت میں پیش کیا گیا تو محمد بن الواثیق اٹھے اور اسے گلے لگایا اور وہ معتز کی معزولی کے تناظر میں ایک ساتھ تخت پر بیٹھ گئے۔ 143}۔"
  tr: "Banu Abbas'tan; el-Muhtadi'nin tahttan indirilmesinden sonra konu el-Mu'tazz'a sunulduğunda, Muhammed bin el-Vathiq onu sıcak bir şekilde kucakladı ve birlikte yatağa oturdular; el-Mu'tazz'ın ifadesi bağlamında {atıf:muruj-mari-2005 juz' 4 s. 143}."
  id: "dari Banu Abbas; ketika masalah ini disampaikan kepada al-Mu'tazz setelah penggulingan al-Muhtadi, Muhammad ibn al-Wathiq memeluknya dengan hangat dan mereka duduk di ranjang, dalam konteks deposisi al-Mu'tazz {cite:muruj-mari-2005 juz' 4 hlm. 143}."
