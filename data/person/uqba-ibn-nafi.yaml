id: person/uqba-ibn-nafi
class: person
label: { ar: "عقبة بن نافع الفهري", en: "Uqba ibn Nafi' al-Fihri" }
summary:
  ar: "عقبة بن نافع الفهري؛ ولّاه عمرو بن العاص المغرب فبلغ زويلة وسلّم ما بينها وبين برقة حسنة طاعتهم فأدّى مسلمهم الصدقة وأقرّ معاهدهم بالجزية ووضع عليهم ما رأى أنهم يطيقونه على أن تؤخذ الصدقة من الأغنياء فترد في الفقراء والجزية من الذمة فتحمل إلى مصر والعشر ونصف العشر من أرض المسلمين. ثم غزا إفريقية في عشرة آلاف فافتتحها واختطّ قيروانها — وكان موضعها غيضة لا تُرام من السباع والحيات فدعا ربه فأذهبها حتى كانت السباع تحمل أولادها هاربة — وبنى مسجدها الجامع في الموضع الذي أُري فيه المؤذن في منامه، وردّه يزيد بن معاوية على عمله فغزا السوس الأدنى وجوّل فيه لا يعرض له أحد. وكان نافع أخا عمرو بن العاص لأمه وقد بعثه عمرو بعد فتح مصر إلى القرى التي حولها فدخلت خيولهم أرض النوبة كما تدخل صوائف الروم فلقي المسلمون بها قتالاً شديداً حتى فقئت حدقهم فسمّوا دماة الحدق."
  en: "Uqba ibn Nafi' al-Fihri; Amr ibn al-As gave him the Maghreb — he reached Zawila, all between it and Barqa submitting in good obedience, their Muslims paying sadaqa, covenant-holders confirmed in jizya, laid at what he judged they could bear: sadaqa taken from the rich returned to the poor, the dhimma's jizya borne to Egypt, tithe and half-tithe from Muslim lands."
