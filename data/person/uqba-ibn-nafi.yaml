id: person/uqba-ibn-nafi
class: person
label: { ar: "عقبة بن نافع الفهري", en: "Uqba ibn Nafi' al-Fihri" , ur: "عقبہ بن نافع فہری", es: "Uqba ibn Nafi' al-Fihri", fr: "Uqba ibn Nafi' al-Fihri"}
summary:
  ar: "عقبة بن نافع الفهري؛ ولّاه عمرو بن العاص المغرب فبلغ زويلة وسلّم ما بينها وبين برقة حسنة طاعتهم فأدّى مسلمهم الصدقة وأقرّ معاهدهم بالجزية ووضع عليهم ما رأى أنهم يطيقونه على أن تؤخذ الصدقة من الأغنياء فترد في الفقراء والجزية من الذمة فتحمل إلى مصر والعشر ونصف العشر من أرض المسلمين. ثم غزا إفريقية في عشرة آلاف فافتتحها واختطّ قيروانها — وكان موضعها غيضة لا تُرام من السباع والحيات فدعا ربه فأذهبها حتى كانت السباع تحمل أولادها هاربة — وبنى مسجدها الجامع في الموضع الذي أُري فيه المؤذن في منامه، وردّه يزيد بن معاوية على عمله فغزا السوس الأدنى وجوّل فيه لا يعرض له أحد. وكان نافع أخا عمرو بن العاص لأمه وقد بعثه عمرو بعد فتح مصر إلى القرى التي حولها فدخلت خيولهم أرض النوبة كما تدخل صوائف الروم فلقي المسلمون بها قتالاً شديداً حتى فقئت حدقهم فسمّوا دماة الحدق."
  en: "Uqba ibn Nafi' al-Fihri; Amr ibn al-As gave him the Maghreb — he reached Zawila, all between it and Barqa submitting in good obedience, their Muslims paying sadaqa, covenant-holders confirmed in jizya, laid at what he judged they could bear: sadaqa taken from the rich returned to the poor, the dhimma's jizya borne to Egypt, tithe and half-tithe from Muslim lands."
  ur: "عمرو بن عاص نے انہیں مغرب کی ذمہ داری دی؛ زویلہ تک پہنچے، پھر افریقیہ کی مہم چلائی، قیروان کی بنیاد رکھی اور اس کی جامع مسجد بنوائی، جیسا کہ موجودہ عربی روایت میں بیان ہے۔ {cite:umayyad-birth-to-fall-2006}"
  es: "Uqba ibn Nafi' al-Fihri; Amr ibn al-As le dio el Magreb; llegó a Zawila, todo lo que había entre esta y Barqa se sometía en buena obediencia, sus musulmanes pagaban sadaqa, los titulares de pactos confirmados en jizya, fijados en lo que él consideraba que podían soportar: la sadaqa tomada de los ricos devuelta a los pobres, la jizya del dhimma llevada a Egipto, el diezmo y el medio diezmo de las tierras musulmanas."
  fr: "Uqba ibn Nafi' al-Fihri; Amr ibn al-As lui confia le Maghreb — il atteignit Zawila, tout entre elle et Barqa se soumettant en bonne obéissance, leurs musulmans payant la sadaqa, les détenteurs d'alliance confirmés dans la jizya, fixée à ce qu'il jugeait qu'ils pouvaient supporter: la sadaqa prise aux riches rendue aux pauvres, la jizya du dhimma versée à l'Égypte, la dîme et la demi-dîme des terres musulmanes."
  tr: "Uqbah ibn Nafi' al-Fihri; Amr ibn al-As onu batıda atadı, Zuwayla'ya ulaştı ve Cyrenaisaica'dan iyiliği yaptı. Müslümanlar sadakalarını ödedi, cizye antlaşmalarını onayladı ve zenginlerden sadaka alınıp fakirlere geri verilmesi, cizyenin zimmeden alınıp Mısır'a ve Müslüman topraklarının onda bir buçuk kısmına götürülmesi şartıyla ne kaldırabileceklerini onlara dayattı. Sonra on bin kişiyle İfrikiye'yi yağmaladı, fethetti ve Kairouan'ı fethetti—burası hayvanlar ve yılanlarla dolu geniş bir topraktı. Rabbisine dua etti ve hayvanlar yavrularını kaçarak taşıyana kadar oradan götürdü—ve müezzinin rüyasında görüldüğü yerde büyük camiyi inşa etti. Yezid bin Muaviye işine yeniden başladı, bu yüzden aşağı Sous'a baskın düzenledi, kimse yaklaşmadı. Nafi', annesinin kardeşi olan Amr ibn al-As'tı. Mısır'ı fethettikten sonra Amr onu çevre köylere gönderdi. Atları, tıpkı Roma süvarileri gibi Nubia topraklarına girdi ve Müslümanlar orada şiddetle savaştı, ta ki öğrencileri delinene kadar ve onlara Damam al-Hadik denildi."
  id: "Uqbah ibn Nafi' al-Fihri; Amr ibn al-As mengangkatnya di barat, mencapai Zuwayla, dan memberikan pelayanan baik antara wilayah itu dan Cyrenaica. Muslim membayar sedekah mereka, menyetujui perjanjian jizya mereka, dan memaksakan apa pun yang mereka anggap mampu tanggung, dengan syarat sedekah akan diambil dari orang kaya dan dikembalikan kepada yang miskin, dan jizya diambil dari dhimma dan dibawa ke Mesir dan sepersepuluh setengah tanah Muslim. Kemudian dia menyerang Ifriqiya dengan sepuluh ribu orang, menaklukkannya, dan menaklukkan Kairouan—tempatnya adalah tanah luas binatang dan ular. Dia berdoa kepada Tuhannya dan membawanya pergi sampai hewan-hewan membawa anak-anak mereka melarikan diri—dan membangun masjid agungnya di tempat muezzin terlihat dalam mimpinya. Yazid ibn Muawiya mengembalikan pekerjaannya, sehingga dia menyerang Sous-Sun bawah, berkeliaran tanpa ada yang mendekatinya. Nafi' adalah saudara Amr ibn al-As dari ibunya. Setelah menaklukkan Mesir, Amr mengirimnya ke desa-desa sekitar. Kuda-kuda mereka masuk ke tanah Nubia seperti halnya kavaleri Romawi, dan umat Muslim bertempur dengan sengit di sana sampai murid-murid mereka tertusuk, dan mereka disebut Damam al-Hadiq."
