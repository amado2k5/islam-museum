summary:
  ar: "شاعر وسياسي ومحامٍ فلسطيني من الرملة (1882–1958)، لُقّب بمعرّي فلسطين، فقد بصره في التاسعة من عمره ودرس تسع سنوات في الأزهر على يد محمد عبده ثم نال إجازة الحقوق من إسطنبول والدكتوراة من مصر، وأسّس الحزب الوطني العثماني سنة 1911 وجريدة «الجامعة الإسلامية» سنة 1933، وكان من أبرز معارضي قيادة أمين الحسيني، وتوفي في أريحا ودُفن في القدس."
  en: "Palestinian poet, politician and lawyer from Ramla (1882–1958), nicknamed the Mu'arri of Palestine. Blinded at the age of nine, he studied nine years at al-Azhar under Muhammad Abduh, took a law degree at Istanbul and a doctorate in Egypt, founded the Ottoman National Party in 1911 and the newspaper al-Jami'a al-Islamiyya in 1933, and was a leading opponent of Amin al-Husayni's leadership; he died at Jericho and was buried in Jerusalem."
  ur: "رملہ سے تعلق رکھنے والے فلسطینی شاعر، سیاست دان اور وکیل (1882–1958)، جنہیں «معریِ فلسطین» کہا جاتا تھا۔ وہ نو برس کی عمر میں بینائی سے محروم ہو گئے، الازہر میں محمد عبدہ کے زیرِ تعلیم نو سال گزارے، استنبول سے قانون کی ڈگری اور مصر سے ڈاکٹریٹ حاصل کی، 1911ء میں عثمانی قومی پارٹی اور 1933ء میں اخبار «الجامعہ الاسلامیہ» کی بنیاد رکھی، اور امین الحسینی کی قیادت کے نمایاں مخالف رہے؛ ان کا انتقال اریحا میں ہوا اور تدفین قدس میں ہوئی۔"
