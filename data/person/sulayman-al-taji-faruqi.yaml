summary:
  ar: "شاعر وسياسي ومحامٍ فلسطيني من الرملة (1882–1958)، لُقّب بمعرّي فلسطين، فقد بصره في التاسعة من عمره ودرس تسع سنوات في الأزهر على يد محمد عبده ثم نال إجازة الحقوق من إسطنبول والدكتوراة من مصر، وأسّس الحزب الوطني العثماني سنة 1911 وجريدة «الجامعة الإسلامية» سنة 1933، وكان من أبرز معارضي قيادة أمين الحسيني، وتوفي في أريحا ودُفن في القدس."
  en: "Palestinian poet, politician and lawyer from Ramla (1882–1958), nicknamed the Mu'arri of Palestine. Blinded at the age of nine, he studied nine years at al-Azhar under Muhammad Abduh, took a law degree at Istanbul and a doctorate in Egypt, founded the Ottoman National Party in 1911 and the newspaper al-Jami'a al-Islamiyya in 1933, and was a leading opponent of Amin al-Husayni's leadership; he died at Jericho and was buried in Jerusalem."
  ur: "رملہ سے تعلق رکھنے والے فلسطینی شاعر، سیاست دان اور وکیل (1882–1958)، جنہیں «معریِ فلسطین» کہا جاتا تھا۔ وہ نو برس کی عمر میں بینائی سے محروم ہو گئے، الازہر میں محمد عبدہ کے زیرِ تعلیم نو سال گزارے، استنبول سے قانون کی ڈگری اور مصر سے ڈاکٹریٹ حاصل کی، 1911ء میں عثمانی قومی پارٹی اور 1933ء میں اخبار «الجامعہ الاسلامیہ» کی بنیاد رکھی، اور امین الحسینی کی قیادت کے نمایاں مخالف رہے؛ ان کا انتقال اریحا میں ہوا اور تدفین قدس میں ہوئی۔"
  es: "Poeta, político y abogado palestino de Ramla (1882-1958), apodado el Mu'arri de Palestina. Ciego a los nueve años, estudió nueve años en al-Azhar con Muhammad Abduh, se licenció en Derecho en Estambul y obtuvo un doctorado en Egipto, fundó el Partido Nacional Otomano en 1911 y el periódico al-Jami'a al-Islamiyya en 1933, y fue uno de los principales opositores al liderazgo de Amin al-Husayni; murió en Jericó y fue enterrado en Jerusalén."
  fr: "Poète, homme politique et avocat palestinien originaire de Ramla (1882-1958), surnommé le Mu'arri de Palestine. Devenu aveugle à l'âge de neuf ans, il étudia neuf ans à al-Azhar sous la direction de Muhammad Abduh, obtint une licence en droit à Istanbul et un doctorat en Égypte, fonda le Parti national ottoman en 1911 et le journal al-Jami'a al-Islamiyya en 1933, et fut un opposant de premier plan au régime d'Amin al-Husayni; il mourut à Jéricho et fut enterré à Jérusalem."
  tr: "Ramla'dan (1882–1958) Filistinli bir şair, siyasetçi ve avukat, Filistin'in Ma'ari'si lakabıyla anılır. Dokuz yaşında görme yetisini kaybetti ve dokuz yıl boyunca El-Ezher'de Muhammed Abdu'nun yanında eğitim gördü, ardından İstanbul'dan hukuk diploması ve Mısır'dan doktora derecesi aldı. 1911'de Osmanlı Ulusal Partisi'ni, 1933'te ise \"İslami Üniversite\" gazetesini kurdu. Amin el-Hüseyni'nin liderliğinin en önde gelen muhaliflerinden biriydi, Eriha'da öldü ve Kudüs'te defnedildi."
  id: "Seorang penyair, politisi, dan pengacara Palestina dari Ramla (1882–1958), dijuluki Ma'ari Palestina. Ia kehilangan penglihatannya pada usia sembilan tahun dan belajar selama sembilan tahun di Al-Azhar di bawah bimbingan Muhammad Abdu, kemudian meraih gelar hukum dari Istanbul dan gelar doktor dari Mesir. Ia mendirikan Partai Nasional Ottoman pada tahun 1911 dan surat kabar \"Universitas Islam\" pada tahun 1933. Ia adalah salah satu penentang paling menonjol terhadap kepemimpinan Amin al-Husseini, meninggal di Yerikho, dan dimakamkan di Yerusalem."
