label: { ar: "أحمد بن نصر الخزاعي" }
summary:
  ar: "من أهل الحديث، كان قائماً بالأمر بالمعروف والنهي عن المنكر، أحضره الواثق من بغداد إلى سامراء مقيداً سنة إحدى وثلاثين وسأله عن القرآن فقال ليس بمخلوق وعن الرؤية فروى الحديث فقال له الواثق تكذب فقال بل تكذب أنت فقتله الواثق بيده وصلب رأسه ببغداد وجثته بسر من رأى ست سنين إلى أن أنزله المتوكل ودفنه {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
  en: "A hadith man devoted to commanding right and forbidding wrong; brought shackled to Samarra in 231 he refused createdness and told al-Wathiq 'you lie!', who beheaded him with his own hand — head crucified at Baghdad, body at Sur man Ra'a six years until al-Mutawakkil buried him {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
