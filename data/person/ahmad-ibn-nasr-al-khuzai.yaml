label: { ar: "أحمد بن نصر الخزاعي", en: "Ahmad ibn Nasr al-Khuza'i", es: "Ahmad ibn Nasr al-Khuza'i", fr: "Ahmad ibn Nasr al-Khuza'i", ur: "احمد بن نصر الخزاعی" }
summary:
  ar: "من أهل الحديث، كان قائماً بالأمر بالمعروف والنهي عن المنكر، أحضره الواثق من بغداد إلى سامراء مقيداً سنة إحدى وثلاثين وسأله عن القرآن فقال ليس بمخلوق وعن الرؤية فروى الحديث فقال له الواثق تكذب فقال بل تكذب أنت فقتله الواثق بيده وصلب رأسه ببغداد وجثته بسر من رأى ست سنين إلى أن أنزله المتوكل ودفنه {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
  en: "A hadith man devoted to commanding right and forbidding wrong; brought shackled to Samarra in 231 he refused createdness and told al-Wathiq 'you lie!', who beheaded him with his own hand — head crucified at Baghdad, body at Sur man Ra'a six years until al-Mutawakkil buried him {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
  es: "Un hombre de hadices dedicado a ordenar el bien y prohibir el mal; llevado encadenado a Samarra en 231 rechazó la creación y le dijo a al-Wathiq '¡mientes!', quien lo decapitó con su propia mano; la cabeza fue crucificada en Bagdad, el cuerpo en Sur man Ra'a durante seis años hasta que al-Mutawakkil lo enterró {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
  fr: "Un homme de hadith dévoué à commander le bien et à interdire le mal; amené enchaîné à Samarra en 231, il refusa la création et dit à al-Wathiq « tu mens ! », qui le décapita de sa propre main — tête crucifiée à Bagdad, corps à Sur man Ra'a six ans jusqu'à ce qu'al-Mutawakkil l'enterre {cite:tarikh-khulafa-minhaj-1434 p. 529-530}."
  ur: "ایک محدث شخص جو حق کا حکم دینے اور برائی سے منع کرنے کے لیے وقف تھا۔ 231 میں سامرہ میں بیڑی ڈال کر لایا اس نے خلقت سے انکار کیا اور الوثیق سے کہا کہ 'تم جھوٹ بولو!'، جس نے اس کا اپنے ہاتھ سے سر قلم کیا - بغداد میں سر کو مصلوب کیا گیا، سور من راع میں لاش چھ سال تک جب تک المتوکل نے اسے دفن نہیں کیا۔ 529-530}۔"
