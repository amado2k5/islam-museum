summary:
  ar: "عطاء بن السائب مولى بني الليث وهو الخشل؛ تولى خراب نوبهار بلخ في حملة قيس بن الهيثم واتخذ قناطر على ثلاثة أنهار من بلخ على فرسخ فقيل قناطر عطاء."
  en: "Ata ibn al-Sa'ib, Banu al-Layth's mawla, called al-Khashl; he ruined Balkh's Nawbahar in Qays ibn al-Haytham's campaign and built the three-river 'Qanatir Ata' a farsakh from the city."
  es: "Ata ibn al-Sa'ib, mawla de Banu al-Layth, llamado al-Khashl; arruinó Nawbahar de Balkh en la campaña de Qays ibn al-Haytham y construyó el 'Qanatir Ata' de tres ríos a farsakh de la ciudad."
  fr: "Ata ibn al-Sa'ib, le mawla de Banu al-Layth, appelé al-Khashl; il a ruiné le Nawbahar de Balkh lors de la campagne de Qays ibn al-Haytham et a construit les trois rivières « Qanatir Ata » à un farsakh de la ville."
  ur: "عطاء بن السائب، بنو لیث کا مولا، جسے الخشال کہا جاتا ہے۔ اس نے قیس بن الہیثم کی مہم میں بلخ کے نوبہار کو تباہ کر دیا اور شہر سے ایک فرسخ کے فاصلے پر تین دریا 'قناطیر عطا' تعمیر کیا۔"
