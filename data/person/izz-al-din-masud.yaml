id: person/izz-al-din-masud
class: person
label: { ar: "عز الدين مسعود بن مودود" }
summary:
  ar: "الأتابك عز الدين مسعود بن قطب الدين مودود بن زنكي، صاحب الموصل؛ لما مات ابن أخيه الملك الصالح بحلب سنة سبع وسبعين ووصى له بها دخلها في العشرين من شعبان وثار أهل حماة بشعاره، وأشار عليه عسكر حلب بقصد دمشق فأبى وقال بيننا يمين فلا نغدر به، ثم سلمها لأخيه عماد الدين بمبادلة سنجار وعاد إلى الموصل {cite:kamil-ibn-al-athir p. 107-108}."
  tr: "Musul hükümdarı El-Atabeg İzzeddin Mes'ud ibn Kutb al-Din Mewdud ibn Zangi, 77 Hicri yılında Halep'te öldü. Onu ona bıraktı ve Şaban ayının yirmininde kaydetti. Hama halkı onun sloganıyla ayaklandı. Halep ordusu ona Şam'a gitmesi için işaret etti, ancak o reddetti ve 'Yemin ederiz ki ihanet etmeyelim.' dedi. Sonra onu kardeşi İmaddin'e Sincar karşılığında teslim etti ve Musul'a döndü {atıf:kamil-ibn-al-athir s. 107-108}."
  id: "Al-Atabeg Izz al-Din Mas'ud ibn Qutb al-Din Mawdud ibn Zangi, penguasa Mosul, wafat di Aleppo pada tahun tujuh puluh tujuh H. Ia mewariskannya kepadanya dan memasukkannya pada tanggal dua puluh Sha'ban. Rakyat Hama bangkit dengan slogannya. Pasukan Aleppo memberi isyarat kepadanya untuk pergi ke Damaskus, tetapi ia menolak, berkata, 'Kami bersumpah agar tidak mengkhianatinya.' Kemudian ia menyerahkannya kepada saudaranya Imad al-Din sebagai imbalan atas Sinjar dan kembali ke Mosul {cite:kamil-ibn-al-athir hlm. 107-108}."
