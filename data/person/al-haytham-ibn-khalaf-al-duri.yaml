summary:
  ar: "الحافظ أبو محمد الهيثم بن خلف الدوري، محدث توفي ببغداد سنة 307 هـ، روى عن عبيد الله بن عمر القواريري وطبقته، وجمع وصنف، وكان ثقة عند ابن العماد."
  en: "The hafiz Abu Muhammad al-Haytham ibn Khalaf al-Duri, a hadith transmitter who died in Baghdad in 307 AH; he narrated from Ubaydallah ibn Umar al-Qawariri and his generation, compiled and wrote works, and was called trustworthy by Ibn al-Imad."
  es: "El hafiz Abu Muhammad al-Haytham ibn Khalaf al-Duri, transmisor de hadices que murió en Bagdad en el año 307 AH; narró de Ubaydallah ibn Umar al-Qawariri y su generación, recopiló y escribió obras, y fue considerado digno de confianza por Ibn al-Imad."
  fr: "Le hafiz Abu Muhammad al-Haytham ibn Khalaf al-Duri, un transmetteur de hadiths décédé à Bagdad en 307 AH; il a rapporté d'Ubaydallah ibn Umar al-Qawariri et de sa génération, a compilé et écrit des œuvres, et a été qualifié de digne de confiance par Ibn al-Imad."
  ur: "حافظ ابو محمد الہیثم بن خلف الدوری، ایک حدیث نقل کرنے والے، جو بغداد میں 307ھ میں فوت ہوئے۔ انہوں نے عبیداللہ ابن عمر القواریری اور ان کی نسل سے روایت کی، تالیف اور تصانیف کیں، اور ابن عماد نے انہیں ثقہ کہا۔"
