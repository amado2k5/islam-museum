  ar: "داعية إسلامي مصري، وُلد في قرية تلة بمحافظة المنيا سنة 1951، عُرف ببرامجه التلفزيونية مثل «الوعد الحق» و«هذا ديننا» وبكتبه في الإعجاز العلمي وأحاديث الدار الآخرة، وله جمهور واسع عبر القنوات الفضائية ويوتيوب."
