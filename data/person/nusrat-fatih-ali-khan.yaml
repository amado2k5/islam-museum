summary:
  ar: "قوّال ومغنٍّ وملحن باكستاني (1948–1997) من غرانة قوال بچوں کا دہلی، قاد فرقة أسرته منذ 1971 وحمل القوالي إلى جمهور العالم عبر ريل ورلد وبيتر غابرييل، وأحيا حفلات في أكثر من أربعين بلدًا، ونال وسام حسن الأداء (1987) وجائزة اليونسكو للموسيقى (1995)، وسجّل أكثر من 125 ألبوم قوالي بحسب غينيس."
  en: "Pakistani qawwal, singer and composer (1948–1997) of the Qawwal Bachon ka Gharana of Delhi, who led his family's party from 1971 and carried qawwali to world audiences through Real World and Peter Gabriel, performed in over forty countries, received the Pride of Performance (1987) and the UNESCO Music Prize (1995), and recorded more than 125 qawwali albums by Guinness's count."
  ur: "پاکستانی قوال، گلوکار اور موسیقار ⁦(1948ء–1997ء)⁩ قوال بچوں کے دہلی گھرانے سے، جنھوں نے 1971ء سے اپنے خاندان کی پارٹی کی قیادت کی، ریئل ورلڈ اور پیٹر گیبریل کے ذریعے قوالی کو عالمی سامعین تک پہنچایا، چالیس سے زیادہ ملکوں میں گایا، تمغۂ حسنِ کارکردگی ⁦(1987ء)⁩ اور یونیسکو میوزک پرائز ⁦(1995ء)⁩ پایا، اور گینیز کے مطابق 125 سے زیادہ قوالی البم ریکارڈ کیے۔"
  es: "Qawwal pakistaní, cantante y compositor (1948-1997) de la Qawwal Bachon ka Gharana de Delhi, que lideró el grupo musical de su familia desde 1971 y llevó el qawwali a audiencias de todo el mundo a través de Real World y Peter Gabriel, actuó en más de cuarenta países, recibió el premio Pride of Performance (1987) y el Premio de Música de la UNESCO (1995), y grabó más de 125 álbumes de qawwali según el Libro Guinness de los Récords."
  fr: "Le qawwal pakistanais, chanteur et compositeur (1948-1997) du Qawwal Bachon ka Gharana de Delhi, qui a dirigé le groupe de sa famille à partir de 1971 et a fait connaître le qawwali au public mondial grâce à Real World et Peter Gabriel, s'est produit dans plus de quarante pays, a reçu le Pride of Performance (1987) et le prix de musique de l'UNESCO (1995), et a enregistré plus de 125 albums de qawwali selon le Guinness World Records."
  tr: "Pakistanlı bir qawwal, şarkıcı ve besteci (1948–1997) olan Children Ka Delhi'den Gharana Qawwal'dan, 1971'den beri ailesinin grubunu yönetti ve Reelworld ve Peter Gabriel aracılığıyla kawwali'yi dünya çapında dinleyicilere taşıdı, kırktan fazla ülkede konserler verdi, İyi Performans Madalyası (1987) ve UNESCO Müzik Ödülü (1995) aldı ve Guinness'e göre 125'ten fazla Qawwali albümü kaydetti."
  id: "Sebagai qawwal, penyanyi, dan komposer Pakistan (1948–1997) dari Gharana Qawwal Children Ka Delhi, ia memimpin band keluarganya sejak 1971 dan membawa qawwali ke penonton global melalui Reelworld dan Peter Gabriel, tampil di lebih dari empat puluh negara, menerima Medal of Good Performance (1987) dan UNESCO Music Prize (1995), serta merekam lebih dari 125 album Qawwali menurut Guinness."
