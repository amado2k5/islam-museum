summary:
  ar: "قوّال ومغنٍّ وملحن باكستاني (1948–1997) من غرانة قوال بچوں کا دہلی، قاد فرقة أسرته منذ 1971 وحمل القوالي إلى جمهور العالم عبر ريل ورلد وبيتر غابرييل، وأحيا حفلات في أكثر من أربعين بلدًا، ونال وسام حسن الأداء (1987) وجائزة اليونسكو للموسيقى (1995)، وسجّل أكثر من 125 ألبوم قوالي بحسب غينيس."
  en: "Pakistani qawwal, singer and composer (1948–1997) of the Qawwal Bachon ka Gharana of Delhi, who led his family's party from 1971 and carried qawwali to world audiences through Real World and Peter Gabriel, performed in over forty countries, received the Pride of Performance (1987) and the UNESCO Music Prize (1995), and recorded more than 125 qawwali albums by Guinness's count."
  ur: "پاکستانی قوال، گلوکار اور موسیقار ⁦(1948ء–1997ء)⁩ قوال بچوں کے دہلی گھرانے سے، جنھوں نے 1971ء سے اپنے خاندان کی پارٹی کی قیادت کی، ریئل ورلڈ اور پیٹر گیبریل کے ذریعے قوالی کو عالمی سامعین تک پہنچایا، چالیس سے زیادہ ملکوں میں گایا، تمغۂ حسنِ کارکردگی ⁦(1987ء)⁩ اور یونیسکو میوزک پرائز ⁦(1995ء)⁩ پایا، اور گینیز کے مطابق 125 سے زیادہ قوالی البم ریکارڈ کیے۔"
