summary:
  ar: "\u0642\u0648\u0651\u0627\u0644 \u0648\u0645\u063a\u0646\u064d\u0651 \u0648\u0645\u0644\u062d\u0646 \u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a (1948\u20131997) \u0645\u0646 \u063a\u0631\u0627\u0646\u0629 \u0642\u0648\u0627\u0644 \u0628\u0686\u0648\u06ba \u06a9\u0627 \u062f\u06c1\u0644\u06cc\u060c \u0642\u0627\u062f \u0641\u0631\u0642\u0629 \u0623\u0633\u0631\u062a\u0647 \u0645\u0646\u0630 1971 \u0648\u062d\u0645\u0644 \u0627\u0644\u0642\u0648\u0627\u0644\u064a \u0625\u0644\u0649 \u062c\u0645\u0647\u0648\u0631 \u0627\u0644\u0639\u0627\u0644\u0645 \u0639\u0628\u0631 \u0631\u064a\u0644 \u0648\u0631\u0644\u062f \u0648\u0628\u064a\u062a\u0631 \u063a\u0627\u0628\u0631\u064a\u064a\u0644\u060c \u0648\u0623\u062d\u064a\u0627 \u062d\u0641\u0644\u0627\u062a \u0641\u064a \u0623\u0643\u062b\u0631 \u0645\u0646 \u0623\u0631\u0628\u0639\u064a\u0646 \u0628\u0644\u062f\u064b\u0627\u060c \u0648\u0646\u0627\u0644 \u0648\u0633\u0627\u0645 \u062d\u0633\u0646 \u0627\u0644\u0623\u062f\u0627\u0621 (1987) \u0648\u062c\u0627\u0626\u0632\u0629 \u0627\u0644\u064a\u0648\u0646\u0633\u0643\u0648 \u0644\u0644\u0645\u0648\u0633\u064a\u0642\u0649 (1995)\u060c \u0648\u0633\u062c\u0651\u0644 \u0623\u0643\u062b\u0631 \u0645\u0646 125 \u0623\u0644\u0628\u0648\u0645 \u0642\u0648\u0627\u0644\u064a \u0628\u062d\u0633\u0628 \u063a\u064a\u0646\u064a\u0633."
  en: "Pakistani qawwal, singer and composer (1948\u20131997) of the Qawwal Bachon ka Gharana of Delhi, who led his family's party from 1971 and carried qawwali to world audiences through Real World and Peter Gabriel, performed in over forty countries, received the Pride of Performance (1987) and the UNESCO Music Prize (1995), and recorded more than 125 qawwali albums by Guinness's count."
  ur: "\u067e\u0627\u06a9\u0633\u062a\u0627\u0646\u06cc \u0642\u0648\u0627\u0644\u060c \u06af\u0644\u0648\u06a9\u0627\u0631 \u0627\u0648\u0631 \u0645\u0648\u0633\u06cc\u0642\u0627\u0631 (1948\u0621\u20131997\u0621) \u0642\u0648\u0627\u0644 \u0628\u0686\u0648\u06ba \u06a9\u06d2 \u062f\u06c1\u0644\u06cc \u06af\u06be\u0631\u0627\u0646\u06d2 \u0633\u06d2\u060c \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 1971\u0621 \u0633\u06d2 \u0627\u067e\u0646\u06d2 \u062e\u0627\u0646\u062f\u0627\u0646 \u06a9\u06cc \u067e\u0627\u0631\u0679\u06cc \u06a9\u06cc \u0642\u06cc\u0627\u062f\u062a \u06a9\u06cc\u060c \u0631\u06cc\u0626\u0644 \u0648\u0631\u0644\u0688 \u0627\u0648\u0631 \u067e\u06cc\u0679\u0631 \u06af\u06cc\u0628\u0631\u06cc\u0644 \u06a9\u06d2 \u0630\u0631\u06cc\u0639\u06d2 \u0642\u0648\u0627\u0644\u06cc \u06a9\u0648 \u0639\u0627\u0644\u0645\u06cc \u0633\u0627\u0645\u0639\u06cc\u0646 \u062a\u06a9 \u067e\u06c1\u0646\u0686\u0627\u06cc\u0627\u060c \u0686\u0627\u0644\u06cc\u0633 \u0633\u06d2 \u0632\u06cc\u0627\u062f\u06c1 \u0645\u0644\u06a9\u0648\u06ba \u0645\u06cc\u06ba \u06af\u0627\u06cc\u0627\u060c \u062a\u0645\u063a\u06c2 \u062d\u0633\u0646\u0650 \u06a9\u0627\u0631\u06a9\u0631\u062f\u06af\u06cc (1987\u0621) \u0627\u0648\u0631 \u06cc\u0648\u0646\u06cc\u0633\u06a9\u0648 \u0645\u06cc\u0648\u0632\u06a9 \u067e\u0631\u0627\u0626\u0632 (1995\u0621) \u067e\u0627\u06cc\u0627\u060c \u0627\u0648\u0631 \u06af\u06cc\u0646\u06cc\u0632 \u06a9\u06d2 \u0645\u0637\u0627\u0628\u0642 125 \u0633\u06d2 \u0632\u06cc\u0627\u062f\u06c1 \u0642\u0648\u0627\u0644\u06cc \u0627\u0644\u0628\u0645 \u0631\u06cc\u06a9\u0627\u0631\u0688 \u06a9\u06cc\u06d2\u06d4"
