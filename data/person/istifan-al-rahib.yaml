id: person/istifan-al-rahib
class: person
label: { ar: "اصطفن الراهب", en: "Istifan Al Rahib", es: "Istifan Al Rahib", fr: "Istifan Al Rahib", ur: "استفان الرحیب" }
summary:
  ar: "اصطفن الراهب كان بالموصل في عمر يقال له ميخابيل وكان يحكى عنه أنه عمل الكيمياء فلما مات ظهرت كتبه بالموصل فرأى ابن النديم منها كتاب الرشد وكتاب الباب الأعظم وكتاب الأدعية والقرابين التي تستعمل قبل صناعة الكيمياء وكتاب الاختيار النجومي للصناعة وكتاب التعليقات وكتاب الأوقات والأزمنة {cite:fihrist-ibn-al-nadim p. 505-506}."
  en: "Stephen the monk — the Mosul alchemist whose books surfaced after his death {cite:fihrist-ibn-al-nadim}"
  es: "Esteban el monje — el alquimista de Mosul cuyos libros salieron a la luz después de su muerte {cite:fihrist-ibn-al-nadim}"
  fr: "Étienne le moine — l'alchimiste de Mossoul dont les livres ont refait surface après sa mort {cite:fihrist-ibn-al-nadim}"
  ur: "اسٹیفن راہب - موصل کا کیمیا دان جس کی کتابیں اس کی موت کے بعد منظر عام پر آئیں۔"
  tr: "Rahip, küçük yaşta Musul'a Michael olarak atanmış ve kimya yaptığı söylenir. Öldüğünde kitapları Musul'da ortaya çıkmıştır. İbn el-Nadim, bunlar arasında Rehberlik Kitabı, Büyük Kapı Kitabı, simya üretiminden önce kullanılan Dualar ve Sunular Kitabı, Zanaat için Yıldızlı Seçim Kitabı, Yorumlar Kitabı ve Zaman ve Çağlar Kitabı {cite:fihrist-ibn-al-nadim s. 505-506} gördü."
  id: "Biarawan itu diangkat di Mosul pada usia muda bernama Michael, dan dikatakan bahwa ia mempraktikkan kimia. Ketika ia meninggal, buku-bukunya muncul di Mosul. Ibn al-Nadim melihat di antaranya Kitab Bimbingan, Kitab Gerbang Besar, Kitab Doa dan Persembahan yang digunakan sebelum pembuatan alkimia, buku Pilihan Bintang untuk Kerajinan, Buku Komentar, dan Kitab Zaman dan Era {cite:fihrist-ibn-al-nadim hlm. 505-506}."
