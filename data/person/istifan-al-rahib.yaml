summary:
  ar: "اصطفن الراهب كان بالموصل في عمر يقال له ميخابيل وكان يحكى عنه أنه عمل الكيمياء فلما مات ظهرت كتبه بالموصل فرأى ابن النديم منها كتاب الرشد وكتاب الباب الأعظم وكتاب الأدعية والقرابين التي تستعمل قبل صناعة الكيمياء وكتاب الاختيار النجومي للصناعة وكتاب التعليقات وكتاب الأوقات والأزمنة {cite:fihrist-ibn-al-nadim p. 505-506}."
  en: "Stephen the monk — the Mosul alchemist whose books surfaced after his death {cite:fihrist-ibn-al-nadim}"
