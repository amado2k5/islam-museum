summary:
  ar: "رجل من العرب في الجاهلية؛ يذكر النويري أنه تزوج دختنوس بعد أن كبر، ثم قيل له في مثل مشهور: الصيف ضيعت اللبن. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 13}"
  en: "A pre-Islamic Arab; al-Nuwayri says he married Dakhtanus when old, and the proverb 'You wasted the milk in summer' is attached to his story. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 13}"
  ur: "جاہلیت کے ایک عرب؛ نویری کے مطابق انہوں نے بڑھاپے میں دختنوس سے شادی کی، اور ان کے قصے سے 'گرمی میں دودھ ضائع کیا' کا مثل منسوب ہے۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 13}"
