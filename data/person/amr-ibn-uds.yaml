summary:
  ar: "رجل من العرب في الجاهلية؛ يذكر النويري أنه تزوج دختنوس بعد أن كبر، ثم قيل له في مثل مشهور: الصيف ضيعت اللبن. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 13}"
  en: "A pre-Islamic Arab; al-Nuwayri says he married Dakhtanus when old, and the proverb 'You wasted the milk in summer' is attached to his story. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 13}"
  ur: "جاہلیت کے ایک عرب؛ نویری کے مطابق انہوں نے بڑھاپے میں دختنوس سے شادی کی، اور ان کے قصے سے 'گرمی میں دودھ ضائع کیا' کا مثل منسوب ہے۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 13}"
  es: "Árabe preislámico; al-Nuwayri dice que se casó con Dakhtanus en su vejez, y el proverbio «Desperdiciaste la leche en verano» se asocia a su historia. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 13}"
  fr: "Arabe préislamique, al-Nuwayri raconte qu'il épousa Dakhtanus à un âge avancé, et le proverbe « Tu as gaspillé le lait en été » est associé à son histoire. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 13}"
  tr: "İslam öncesi dönemde Araplardan bir adam; El-Nuveyri büyüdükten sonra Dakhtanus ile evlendiğini belirtir, ardından ona ünlü bir atasözünde şöyle denir: 'Yazın süt israf ettin.' {alıntı:nihayat-al-arap-nuwayri-cilt-scan s. 13}"
  id: "Seorang pria dari Arab pada era pra-Islam; Al-Nuwayri menyebutkan bahwa dia menikah dengan Dakhtanus setelah dewasa, lalu dikatakan kepadanya dalam sebuah peribahasa terkenal: 'Di musim panas, kamu membuang-buang susu.' {cite:nihayat-al-arab-nuwayri-vol3-scan hlm. 13}"
