summary:
  ar: "أحمد بن عمير بن يوسف بن موسى بن جوصا، أبو الحسن الدمشقي الحافظ، مولى بني هاشم، يصفه ابن عساكر في «تاريخ دمشق» بشيخ الشام في وقته: رحل وصنّف وذاكر، وروى عنه الطبراني وابن المقرئ وأبو علي النيسابوري وابن عدي وغيرهم. أثنى عليه الطبراني وأبو علي النيسابوري وجعله أبو همام الكرخي بالشام كابن عقدة بالكوفة، وأنكر عليه الرحالة الغرباء زيادة «ابن ثوبان» في إسناد حديث، وقال الدارقطني: تفرد بأحاديث ولم يكن بالقوي، وترك حمزة الكناني الرواية عنه. توفي بدمشق لثلاث بقين من جمادى الأولى سنة 320هـ ودفن بمقابر باب الصغير {cite:tarikh-dimashq-amrawi-v5 p. 109-117}."
  en: "Ahmad ibn Umayr ibn Yusuf ibn Musa ibn Jawsa, Abu al-Hasan of Damascus, the hafiz, client of Banu Hashim, whom Ibn Asakir's Tarikh Dimashq calls the leading shaykh of Syria in his day: he travelled, wrote, held learned exchanges, and al-Tabarani, Ibn al-Muqri', Abu Ali al-Naysaburi, Ibn Adi and others narrated from him. Al-Tabarani and Abu Ali al-Naysaburi praised him and Abu Hammam al-Karkhi compared him in Syria to Ibn Uqda in Kufa, while visiting scholars objected to his adding 'Ibn Thawban' to a chain; al-Daraqutni said he transmitted some hadiths alone and was not strong, and Hamza al-Kinani stopped narrating from him. He died in Damascus on 27 Jumada I 320 AH and was buried in the Bab al-Saghir cemetery."
