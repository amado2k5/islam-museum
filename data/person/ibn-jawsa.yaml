  - tradition: sunni
    id: sunni-layyin
    standing: secondary
    stance: { ar: "تفرد بأحاديث ولم يكن بالقوي", en: "Alone in some hadiths, not strong" }
    summary:
      ar: "أنكر عليه الرحالة بزعامة الزبير بن عبد الواحد الأسداباذي إلحاقه «ابن ثوبان» بخطه في أصل كتابه في حديث «إذا أقيمت الصلاة فلا صلاة إلا المكتوبة»؛ وقال الدارقطني: تفرد بأحاديث ولم يكن بالقوي؛ وقال حمزة الكناني: عندي عنه مائتا جزء ليتها كانت بياضاً، وترك الرواية عنه؛ وامتنع دعلج من التحديث عنه لما رأى في داره جرو كلب صيني."
      en: "The visiting scholars, led by al-Zubayr ibn Abd al-Wahid al-Asadabadhi, objected that he added 'Ibn Thawban' in his own hand to his original copy in the hadith 'when the prayer is called there is no prayer but the prescribed one'; al-Daraqutni said he was alone in some hadiths and not strong; Hamza al-Kinani said he had two hundred fascicles from him and wished they were blank, and stopped narrating from him; Da'laj refused to narrate from him after seeing a Chinese puppy in his house."
