    stance: { ar: "إمام من أركان الحديث", en: "An imam, a pillar of hadith" }
    summary:
      ar: "قال أبو علي النيسابوري: كان من أركان الحديث، وقال للرحالة: هذا إمام من أئمة المسلمين وقد جاز القنطرة؛ وقال الطبراني: كان من ثقات المسلمين وأجلتهم؛ وقال الحاكم: إمام أهل الحديث ورئيس الشام؛ وأثنى عليه أبو مسلم البغدادي، وحسّن فيه أبو أحمد النيسابوري الرأي."
      en: "Abu Ali al-Naysaburi called him a pillar of hadith and told the visiting scholars: this is one of the imams of the Muslims and has crossed the bridge; al-Tabarani called him among the trustworthy and most eminent Muslims; al-Hakim called him imam of the hadith scholars and head of Syria; Abu Muslim al-Baghdadi praised him and Abu Ahmad al-Naysaburi thought well of him."
    holders: [person/al-tabarani]
