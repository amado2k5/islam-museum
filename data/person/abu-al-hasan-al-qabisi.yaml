id: person/abu-al-hasan-al-qabisi
class: person
gender: male
label:
  ar: أبو الحسن القابسي
  en: Abu al-Hasan al-Qabisi (Maliki jurist, hadith scholar and usuli)
  fr: "Abu al-Hasan al-Qabisi (juriste malikite, traditionniste et spécialiste des fondements du droit)"
  es: "Abu al-Hasan al-Qabisi (Maliki jurist, hadith scholar and usuli)"
  ur: "ابو الحسن القبیسی ⁦(مالکی فقیہ، عالم حدیث اور اصولی)⁩"
summary:
  ar: فقيه مالكي وحافظ ومحدث وأصولي من معافر فاس؛ سمع من أبي زيد المروزي وأبي محمد الأصيلي وغيرهما، وروى عنه أبو محمد بن الوليد وأبو عمرو الداني، وتفقه عليه أبو عمران الفاسي. من تصانيفه الممهد في الفقه وأحكام الديانة، وكتاب المناسك، وملخص الموطأ، والرسالة المفصلة لأحوال المعلمين والمتعلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7833}
  en: A Maliki jurist, memorizer, hadith scholar and usuli from the Mu'afir of Fez; he heard from Abu Zayd al-Marwazi and Abu Muhammad al-Asili; Abu Imran al-Fasi studied fiqh under him. Works include al-Mumahhid fi al-Fiqh, a book of rites, an epitome of the Muwatta' and a treatise on teachers and pupils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7833}
  ur: مالکی فقیہ، حافظ، محدث اور اصولی، فاس کے معافری؛ ابو زید المروزی اور ابو محمد الأصیلی سے سماع کیا؛ ابو عمران الفاسی نے ان سے فقہ پڑھی؛ تصانیف میں الممہد فی الفقہ، کتاب المناسک اور ملخص الموطأ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7833}
  fr: "Juriste malikite, mémorisateur, traditionniste et spécialiste des fondements du droit, des Mu'afir de Fès ; il entendit Abu Zayd al-Marwazi et Abu Muhammad al-Asili ; Abu Imran al-Fasi étudia le fiqh auprès de lui. Ses œuvres comprennent al-Mumahhid fi al-Fiqh, un livre sur les rites, un abrégé du Muwatta' et un traité sur les maîtres et les élèves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7833}"
  es: "Jurista malikí, memorizador, erudito de hadices y usuli del Mu'afir de Fez; recibió enseñanzas de Abu Zayd al-Marwazi y Abu Muhammad al-Asili; Abu Imran al-Fasi estudió fiqh con él. Entre sus obras se incluyen al-Mumahhid fi al-Fiqh, un libro de ritos, un compendio del Muwatta' y un tratado sobre maestros y alumnos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7833}"
  tr: "Fez'in Ma'afir bölgesinden bir Maliki fıkıhçısı, hadis ezbercisi, hadis alimi ve hukuk teorisyeni; Ebu Zeyd el-Mervezi, Ebu Muhammed el-Asili ve diğerlerinin yanında eğitim gördü. Ebu Muhammed ibn el-Velid ve Ebu Amr el-Dani ondan hadis rivayet etmiş, Ebu İmran el-Fasi ise ondan fıkıh eğitimi almıştır. Eserleri arasında şunlar bulunmaktadır: El-Mumahhid fi el-Fıkıh ve Ahkam el-Diyana (Fıkıh ve Dini Hükümlere Giriş), Kitab el-Manasik (Adetler Kitabı), Mulakhkhas el-Muvatta' (Muvatta'nın Özeti) ve El-Risalah el-Mufassalah li-Ahwal el-Mu'allimin ve el-Muta'allimin (Öğretmen ve Öğrencilerin Şartları Üzerine Detaylı Risale). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7833}"
  id: "Seorang ahli hukum Maliki, penghafal hadits, sarjana hadits, dan ahli teori hukum dari Ma'afir, Fez; beliau belajar di bawah bimbingan Abu Zayd al-Marwazi, Abu Muhammad al-Asili, dan lainnya. Abu Muhammad ibn al-Walid dan Abu Amr al-Dani meriwayatkan hadits darinya, dan Abu Imran al-Fasi belajar fiqh di bawah bimbingannya. Di antara karya-karyanya adalah: Al-Mumahhid fi al-Fiqh wa Ahkam al-Diyanah (Pengantar Fiqh dan Hukum Agama), Kitab al-Manasik (Kitab Tata Cara), Mulakhkhas al-Muwatta' (Ringkasan Muwatta'), dan Al-Risalah al-Mufassalah li-Ahwal al-Mu'allimin wa-al-Muta'allimin (Risalah Terperinci tentang Syarat-syarat Guru dan Murid). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7833}"
