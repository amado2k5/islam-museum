label:
  ar: أبو الحسن القابسي
  en: Abu al-Hasan al-Qabisi (Maliki jurist, hadith scholar and usuli)
summary:
  ar: فقيه مالكي وحافظ ومحدث وأصولي من معافر فاس؛ سمع من أبي زيد المروزي وأبي محمد الأصيلي وغيرهما، وروى عنه أبو محمد بن الوليد وأبو عمرو الداني، وتفقه عليه أبو عمران الفاسي. من تصانيفه الممهد في الفقه وأحكام الديانة، وكتاب المناسك، وملخص الموطأ، والرسالة المفصلة لأحوال المعلمين والمتعلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7833}
  en: A Maliki jurist, memorizer, hadith scholar and usuli from the Mu'afir of Fez; he heard from Abu Zayd al-Marwazi and Abu Muhammad al-Asili; Abu Imran al-Fasi studied fiqh under him. Works include al-Mumahhid fi al-Fiqh, a book of rites, an epitome of the Muwatta' and a treatise on teachers and pupils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7833}
  ur: مالکی فقیہ، حافظ، محدث اور اصولی، فاس کے معافری؛ ابو زید المروزی اور ابو محمد الأصیلی سے سماع کیا؛ ابو عمران الفاسی نے ان سے فقہ پڑھی؛ تصانیف میں الممہد فی الفقہ، کتاب المناسک اور ملخص الموطأ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7833}
