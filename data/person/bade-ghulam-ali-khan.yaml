summary:
  ar: "مغنٍّ كلاسيكي هندي (1902–1968) من غرانة قصور–بتيالا، وُلد في قصور وتدرّب على يد عمّه وأبيه، وذاع صيته بصوت امتد ثلاث طبقات وبأسلوب جمع بين الدروباد وجيبور وغواليور. غنّى أغنيتين لفيلم «مغول الأعظم» (1960) بأجر قياسي، ونال بادما بوشان سنة 1962."
  en: "Indian Hindustani classical vocalist (1902–1968) of the Kasur Patiala Gharana, born at Kasur and trained by his uncle and his father. Famous for a voice spanning three octaves and a style fusing Dhrupad, Jaipur and Gwalior elements, he sang two songs for the film Mughal-e-Azam (1960) at a record fee and received the Padma Bhushan in 1962."
  ur: "ہندوستانی کلاسیکی گلوکار (1902ء–1968ء) جن کا تعلق قصور پٹیالہ گھرانے سے تھا؛ قصور میں پیدا ہوئے، چچا اور والد سے تربیت پائی۔ تین اوکٹیو پر پھیلی آواز اور دھرپد، جے پور اور گوالیار کے امتزاج سے مشہور ہوئے، فلم «مغلِ اعظم» (1960ء) کے لیے دو گانے ریکارڈ کیے اور 1962ء میں پدم بھوشن پایا۔"
