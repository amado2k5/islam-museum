label: { ar: "هارون بن خمارويه", en: "Harun ibn Khumarawayh" }
summary:
  ar: "أخو جيش بن خمارويه، نصب مكانه على مصر لما قبض عليه سنة ثلاث وثمانين ومائتين إثر الشغب الذي قتل فيه علي بن أحمد المارداني، وكانوا قد نقموا على جيش تقدمه لغلامه نجح المعروف بالطولوني {cite:muruj-al-dhahab p. 620}. وعند ابن الجوزي أجلسوه بعد قتل أخيه جيش سنة 282هـ وتقرر أن يحمل إلى خزانة المعتضد في كل سنة ألف ألف دينار وخمسمائة ألف دينار فلما ولي المكتفي عزله وولى أحمد بن سليمان الواثقي فأخذ أموال آل طولون وكان هذا آخر أمرهم {cite:muntazam-ibn-al-jawzi p. 155}"
  en: "Set up in place of his deposed brother Jaysh over Egypt in 283 {cite:muruj-al-dhahab p. 620}."
