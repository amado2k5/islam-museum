label: { ar: "هارون بن خمارويه", en: "Harun ibn Khumarawayh", es: "Harun ibn Khumarawayh", fr: "Harun ibn Khumarawayh", ur: "ہارون بن خمارویہ" }
summary:
  ar: "أخو جيش بن خمارويه، نصب مكانه على مصر لما قبض عليه سنة ثلاث وثمانين ومائتين إثر الشغب الذي قتل فيه علي بن أحمد المارداني، وكانوا قد نقموا على جيش تقدمه لغلامه نجح المعروف بالطولوني {cite:muruj-al-dhahab p. 620}. وعند ابن الجوزي أجلسوه بعد قتل أخيه جيش سنة 282هـ وتقرر أن يحمل إلى خزانة المعتضد في كل سنة ألف ألف دينار وخمسمائة ألف دينار فلما ولي المكتفي عزله وولى أحمد بن سليمان الواثقي فأخذ أموال آل طولون وكان هذا آخر أمرهم {cite:muntazam-ibn-al-jawzi p. 155} وعند ابن الجوزي زحف لقتال محمد بن سليمان لما خرج إلى مصر سنة اثنتين وتسعين فدخل محمد الفسطاط وأخذ آل طولون فكان ذلك آخر أمرهم {cite:muntazam-ibn-al-jawzi p. 342}."
  en: "Set up in place of his deposed brother Jaysh over Egypt in 283 {cite:muruj-al-dhahab p. 620}."
  es: "Establecido en lugar de su hermano depuesto Jaysh sobre Egipto en 283 {cite:muruj-al-dhahab p. 620}."
  fr: "Installé à la place de son frère déchu Jaysh sur l'Égypte en 283 {cite:muruj-al-dhahab p. 620}."
  ur: "283 میں اپنے معزول بھائی جیش کی جگہ مصر پر مقرر کیا گیا {حوالہ: مروج الذہب ص۔ 620}۔"
  tr: "O, 283 Hicri yılında Ali ibn Ahmed el-Mardani'nin öldürüldüğü isyandan sonra esir alınan İbn Humarawayh'in ordusunun kardeşiydi. Hizmetkârı Najah'a, el-Tuluni olarak bilinen naminle bilinen bir orduya karşı ilerlemesine kızmışlardı {atıf:muruj-al-dhahab, s. 620}. İbn el-Cewzi'ye göre, kardeşi Ceyş 282 Hicri yılında öldürüldükten sonra, her yıl bin beş yüz bin dinar ile el-Mu'tadid'in hazinesine getirilmesine karar verildi. El-Muktafi göreve geldiğinde, görevden alındı ve Ahmad ibn Süleyman el-Vathiqi olarak atandı; böylece Tulun ailesinin serveti onların son çaresi oldu {atıf:Muntazam-ibn-al-Jawzi s. 155} İbn el-Cevzi, 92 Hicri yılında Mısır'a giderken Muhammed bin Süleyman ile savaşmak için yürüdü. Muhammed Fustat'a girdi ve Tulun ailesini esir aldı; bu onların son ilişkisi oldu {atıf:Muntazam-ibn-al-jawzi s. 342}."
  id: "Ia adalah saudara dari pasukan Ibn Khumarawayh, yang ditugaskan ke Mesir ketika ia ditangkap pada tahun 283 H setelah kerusuhan di mana Ali ibn Ahmad al-Mardani tewas. Mereka merasa kesal terhadap pasukan yang maju melawan hambanya, Najah, yang dikenal sebagai al-Tuluni {cite:muruj-al-dhahab, hlm. 620}. Menurut Ibn al-Jawzi, setelah saudaranya Jaish dibunuh pada tahun 282 H, diputuskan bahwa ia akan dibawa ke kas al-Mu'tady setiap tahun dengan seribu lima ratus ribu dinar. Ketika al-Muktafi menjabat, ia digulingkan dan diangkat menjadi Ahmad ibn Sulayman al-Wathiqi, mengambil harta keluarga Tulun, yang merupakan upaya terakhir mereka {cite:muntazam-ibn-al-jawzi hlm. 155} Ibn al-Jawzi berangkat melawan Muhammad ibn Sulayman ketika ia berangkat ke Mesir pada tahun 92 H. Muhammad masuk ke Fustat dan merebut keluarga Tulun, dan itu adalah urusan terakhir mereka {cite:Muntazam-ibn-al-jawzi hlm. 342}."
