summary:
  ar: "عند البلاذري: محمد بن إسحاق صاحب السيرة حفيد يسار الذي كان من سبي كنيسة عين التمر زمن خالد بن الوليد وهو مولى قيس بن مخرمة بن المطلب بن عبد مناف. وعند المسعودي مات سنة خمسين ومائة ويقال سنة إحدى ويقال سنة اثنتين وخمسين ومائة {cite:muruj-al-dhahab p. 293}. ويترجم له الذهبي في «ميزان الاعتدال» بأنه أحد الأئمة الأعلام، ويجمع فيه أقوال الموثقين والطاعنين، ثم يحكم بأنه حسن الحديث صالح الحال صدوق، وأن ما انفرد به فيه نكارة، وأن ذنبه عنده ما حشا به السيرة من الأشياء المنكرة المنقطعة والأشعار المكذوبة {cite:mizan-itidal-bijawi-v3 p. 468-475}."
  en: "In al-Baladhuri: Muhammad ibn Ishaq author of the sira, grandson of the Yasar taken in Ayn al-Tamr's church captives under Khalid ibn al-Walid — a mawla of Qays ibn Makhrama ibn al-Muttalib ibn Abd Manaf. Al-Dhahabi's Mizan al-I'tidal calls him one of the eminent imams, gathers the sayings of those who declared him trustworthy and of those who attacked him, and judges him fair in hadith, upright and truthful, with something objectionable in what he alone reports; his one fault, for al-Dhahabi, is the objectionable, broken reports and forged verses he packed into the Sira."
