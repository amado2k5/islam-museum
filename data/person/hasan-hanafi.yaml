summary:
  ar: "حسن حنفي ⁦(1935–2021)⁩ فيلسوف مصري وأستاذ الفلسفة بجامعة القاهرة، مؤسس مشروع «اليسار الإسلامي» وصاحب نظرية «الاستغراب» مرآةً للاستشراق. من أعماله «التراث والتجديد» و«من العقيدة إلى الثورة» و«مقدمة في علم الاستغراب»."
  en: "Hasan Hanafi (1935–2021) was an Egyptian philosopher and Cairo University professor, founder of the 'Islamic Left' project and author of the theory of 'Occidentalism' as a mirror to Orientalism. His works include Al-Turath wa al-Tajdid (Heritage and Renewal), Min al-'Aqida ila al-Thawra (From Doctrine to Revolution) and Muqaddima fi 'Ilm al-Istighrab (Introduction to Occidentalism)."
  ur: "حسن حنفی ⁦(1935–2021)⁩ مصری فلسفی اور جامعہ قاہرہ کے پروفیسر تھے، «اسلامی بائیں بازو» منصوبے کے بانی اور «استغراب» کے نظریے کے قائل جو استشراق کا آئینہ ہے۔ تصانیف میں «التراث والتجديد»، «من العقيدة إلى الثورة» اور «مقدمة في علم الاستغراب» شامل ہیں۔"
  es: "Hasan Hanafi (1935-2021) fue un filósofo egipcio y profesor de la Universidad de El Cairo, fundador del proyecto «Izquierda Islámica» y autor de la teoría del «Occidentalismo» como reflejo del orientalismo. Entre sus obras destacan Al-Turath wa al-Tajdid (Patrimonio y Renovación), Min al-'Aqida ila al-Thawra (De la Doctrina a la Revolución) y Muqaddima fi 'Ilm al-Istighrab (Introducción al Occidentalismo)."
  fr: "Hassan Hanafi (1935-2021) était un philosophe égyptien et professeur à l'Université du Caire, fondateur du projet « Gauche islamique » et auteur de la théorie de l'« occidentalisme » comme miroir de l'orientalisme. Parmi ses œuvres figurent Al-Turath wa al-Tajdid (Héritage et Renouveau), Min al-'Aqida ila al-Thawra (De la doctrine à la révolution) et Muqaddima fi 'Ilm al-Istighrab (Introduction à l'occidentalisme)."
  tr: "Hasan Hanafi (1935–2021), Mısırlı filozof ve Kahire Üniversitesi'nde felsefe profesörü, \"İslami Sol\" projesinin kurucusu ve \"Batıcılığım: Oryantalizmin Aynası\" teorisinin yazarıydı. Eserleri arasında \"Miras ve Yenilenme\", \"İnançtan Devrime\" ve \"Batıcılık Bilimine Giriş\" yer almaktadır."
  id: "Hassan Hanafi (1935–2021) adalah seorang filsuf Mesir dan profesor filsafat di Universitas Kairo, pendiri proyek \"Islamic Left\", serta penulis teori \"Occidentalism: A Mirror of Orientalism.\" Karya-karyanya meliputi \"Heritage and Renewal,\" \"From Creed to Revolution,\" dan \"Introduction to the Science of Occidentalism.\""
