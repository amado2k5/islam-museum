summary:
  ar: "أبو الحسين أسيد بن عاصم بن محمد، هو وأخوه محمد بن علي ممن سلكوا مسلك أصحاب سفيان الثوري في العلم والعبادة ومكارم الأخلاق. كان الناس يفزعون إلى دعائهم عند نزول الهم والعلل فيجدون الإجابة في الوقت، ويقصدونهم من الديار البعيدة."
  en: "Abu al-Husayn Usayd ibn Asim ibn Muhammad; he and his brother Muhammad ibn Ali followed the path of the companions of Sufyan al-Thawri in knowledge, worship and noble conduct. When care and sickness fell, people turned to their prayers and found the answer at once, and came to them from distant lands. He narrated reports from Husayn ibn Hafs and others."
  ur: "ابو الحسین اسید بن عاصم بن محمد، جو اپنے بھائی محمد بن علی کے ساتھ سفیان ثوری کے ساتھیوں کے راستے پر چلے، علم، عبادت اور اعلیٰ اخلاق میں۔ جب غم اور بیماری آتی تو لوگ ان کی دعا کی طرف رجوع کرتے اور اسی وقت قبولیت پاتے، اور دور دراز علاقوں سے ان کے پاس آتے۔ انہوں نے حسین بن حفص وغیرہ سے روایات بیان کیں۔"
