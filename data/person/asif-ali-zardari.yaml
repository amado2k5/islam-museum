summary:
  ar: "سياسي باكستاني (وُلد 1955)، الرئيس الرابع عشر لباكستان منذ مارس 2024 وسابقا رئيسها الحادي عشر (2008–2013)، وأول رئيس دولة باكستاني وُلد بعد استقلال البلاد. وهو أرمل رئيسة الوزراء بينظير بوتو، وقد قاد حزب الشعب الباكستاني بعد اغتيالها سنة 2007؛ ولازمته تهم فساد من التسعينيات سجلت المقالات براءته من عدد منها وإسقاط بقيتها."
  en: "Pakistani politician (born 1955), the fourteenth president of Pakistan since March 2024 and previously its eleventh president (2008–2013), the first Pakistani head of state born after the country's independence. Widower of Prime Minister Benazir Bhutto, he led the Pakistan People's Party after her assassination in 2007; his career has been shadowed by corruption charges of the 1990s, of which the articles record acquittals and dropped charges."
  ur: "پاکستانی سیاست دان (پیدائش 1955ء)، مارچ 2024ء سے پاکستان کے چودہویں صدر اور اس سے قبل گیارہویں صدر (2008ء–2013ء)، آزادی کے بعد پیدا ہونے والے پاکستان کے پہلے سربراہِ مملکت۔ وزیرِ اعظم بے نظیر بھٹو کے شوہر، ان کے قتل (2007ء) کے بعد پاکستان پیپلز پارٹی کی قیادت سنبھالی؛ ان کے کیریئر پر 1990ء کی دہائی کے بدعنوانی کے الزامات سایہ فگن رہے، جن میں مضامین ان کی بریت اور کئی مقدمات کے خاتمے کو درج کرتے ہیں۔"
