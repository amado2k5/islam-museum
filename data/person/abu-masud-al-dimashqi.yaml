  ar: "إبراهيم بن محمد بن عبيد أبو مسعود الدمشقي الحافظ، طاف البلاد وسمع الحديث وكتب ببغداد والكوفة والبصرة وواسط والأهواز وأصبهان وبلاد خراسان، وكان ذا عناية فائقة بالصحيحين فصنّف كتاب أطراف الصحيحين وهو من أوائل من عمل الأطراف. كان ثقة ديناً ورعاً فهماً، توفي ببغداد سنة إحدى وأربعمائة وأوصى إلى الشيخ أبي حامد الاسفراييني فصلى عليه ودُفن في مقبرة جامع المنصور {cite:muntazam-ibn-al-jawzi j.7 p.252}."
