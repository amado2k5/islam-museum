id: person/abu-masud-al-dimashqi
class: person
label: { ar: "أبو مسعود الدمشقي إبراهيم بن محمد الحافظ", en: "Abu Mas'ud al-Dimashqi Ibrahim ibn Muhammad al-Hafiz" }
summary:
  ar: "إبراهيم بن محمد بن عبيد أبو مسعود الدمشقي الحافظ، طاف البلاد وسمع الحديث وكتب ببغداد والكوفة والبصرة وواسط والأهواز وأصبهان وبلاد خراسان، وكان ذا عناية فائقة بالصحيحين فصنّف كتاب أطراف الصحيحين وهو من أوائل من عمل الأطراف. كان ثقة ديناً ورعاً فهماً، توفي ببغداد سنة إحدى وأربعمائة وأوصى إلى الشيخ أبي حامد الاسفراييني فصلى عليه ودُفن في مقبرة جامع المنصور {cite:muntazam-ibn-al-jawzi j.7 p.252}."
  en: "Ibrahim ibn Muhammad ibn Ubayd, Abu Mas'ud al-Dimashqi the hafiz, travelled widely and heard and wrote down hadith at Baghdad, Kufa, Basra, Wasit, al-Ahwaz, Isfahan and the lands of Khurasan; he took special care with the two Sahihs and composed Atraf al-Sahihayn, being among the first to compile atraf works. He was trustworthy (thiqa), devout, scrupulous and perceptive. He died in Baghdad in 401, having entrusted his affairs to Shaykh Abu Hamid al-Isfara'ini, who led the funeral prayer over him, and he was buried in the cemetery of the Mansur Mosque {cite:muntazam-ibn-al-jawzi j.7 p.252}."
