summary:
  ar: "مغنٍّ باكستاني (وُلد سنة 1966) في الغناء شبه الكلاسيكي والبوب والروك، وشاعر وممثل ومخرج ومنتج سينمائي؛ تدرّب على الموسيقى الكلاسيكية على يد عمّه تصدق حسين، واشتهر بألبوم «بابيا» (1993) وبأغنيات مثل «تشيف صاب» و«سوهني لغدي»، وغنى «دن پریشان ہے» في فيلم «بول» (2011)، ونال وسام ستارة الامتياز."
  en: "Pakistani semi-classical, pop and rock singer, poet, actor, and film director and producer, born in 1966. Trained in classical music by his uncle Tassaduq Hussain, he rose to fame with the album Babia (1993) and songs such as 'Chief Saab' and 'Sohni Lagdi', sang 'Din Pareshan Hai' for the film Bol (2011), and received the Sitara-e-Imtiaz."
  ur: "پاکستانی نیم کلاسیکی، پاپ اور راک گلوکار، شاعر، اداکار اور فلم ہدایت کار و پروڈیوسر (پیدائش 1966)۔ انہوں نے اپنے چچا تصدق حسین سے کلاسیکی موسیقی کی تربیت حاصل کی، البم «بابیا» (1993) اور «چیف صاحب» اور «سوہنی لگدی» جیسے گانوں سے شہرت پائی، فلم «بول» (2011) کے لیے «دن پریشان ہے» گایا، اور ستارہ امتیاز سے نوازے گئے۔"
