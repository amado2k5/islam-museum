label:
  ar: زيادة الله الأول الأغلبي
  en: Ziyadat Allah I of Ifriqiya
  es: "Ziyadat Allah I of Ifriqiya"
  fr: "Ziyadat Allah I of Ifriqiya"
  ur: "افریقیہ کی زیادت اللہ اول"
roles:
- ruler
gender: male
summary:
  ar: زيادة الله بن إبراهيم بن الأغلب، أبو محمد، رابع الأغالبة أصحاب إفريقية، ولي سنة 201 هـ بعد أخيه عبد الله، وفي أيامه جهز سنة 212 هـ أسطولا إلى صقلية فاستولى على معظم حصونها، وبنى سور سوسة، وتوفي بالقيروان سنة 223 هـ الموافقة 838 م.
  en: Ziyadat Allah ibn Ibrahim ibn al-Aghlab, Abu Muhammad, fourth of the Aghlabid lords of Ifriqiya; took power in 201 AH after his brother Abd Allah; in 212 AH sent a fleet that took most of the fortresses of Sicily; built the wall of Sousse; died in Qayrawan in 223 AH (838 CE).
  es: "Ziyadat Allah ibn Ibrahim ibn al-Aghlab, Abu Muhammad, cuarto de los señores aglabíes de Ifriqiya; tomó el poder en el año 201 AH después de su hermano Abd Allah; en el año 212 AH envió una flota que tomó la mayoría de las fortalezas de Sicilia; construyó la muralla de Sousse; murió en Qayrawan en el año 223 AH (838 d. C.)."
  fr: "Ziyadat Allah ibn Ibrahim ibn al-Aghlab, Abu Muhammad, quatrième seigneur aghlabide d'Ifriqiya; prit le pouvoir en 201 AH après son frère Abd Allah; en 212 AH, il envoya une flotte qui prit la plupart des forteresses de Sicile; construisit le mur de Sousse; mourut à Qayrawan en 223 AH (838 CE)."
  ur: "زیادت اللہ ابن ابراہیم ابن الثلاب، ابو محمد، افریقیہ کے اغلبی سرداروں میں سے چوتھے؛ 201 ہجری میں اپنے بھائی عبداللہ کے بعد اقتدار سنبھالا۔ 212 ہجری میں ایک بحری بیڑا بھیجا جس نے سسلی کے بیشتر قلعوں کو اپنے قبضے میں لے لیا۔ سوس کی دیوار تعمیر کی؛ 223ھ ⁦(838ء)⁩ میں قیروان میں وفات پائی۔"
  tr: "Ziyadat Allah ibn İbrahim bin el-Aglab, Ebu Muhammed, İfrikiye'nin dördüncü hükümdarı, 201 Hicri'de kardeşi Abdullah'ın yerine geçti. Saltanatı sırasında, 212 Hicri'de, Sicilya'ya bir filo hazırladı, kalelerinin çoğunu ele geçirdi, Sousse surlarını inşa etti ve 223 H.S.'de, yani 838 M.S. Kairuan'da öldü."
  id: "Ziyadat Allah ibn Ibrahim ibn al-Aghlab, Abu Muhammad, Aghlabid keempat, penguasa Ifriqiya, menggantikan saudaranya Abdullah pada tahun 201 H. Selama pemerintahannya, pada tahun 212 H, ia menyiapkan armada ke Sisilia, merebut sebagian besar bentengnya, membangun tembok Sousse, dan meninggal di Kairouan pada tahun 223 H, yang setara dengan tahun 838 M."
