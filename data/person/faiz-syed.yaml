  ar: "داعية ومحاضر هندي من أورنغ آباد، مؤسس «مركز البحوث الإسلامية للتعليم والرعاية» (IRC) سنة 2001 ومدير قناة IRC TV؛ بلغت قناته على يوتيوب 4.17 مليون مشترك في نوفمبر 2026 بحسب vidIQ، وقد ألقى — بحسب موقعه الرسمي — أكثر من 2,000 محاضرة بالأردية والهندية في أكثر من 200 مدينة هندية."
  en: "Indian preacher and lecturer from Aurangabad, founder of the Islamic Research Centre Education & Welfare Trust (IRC) in 2001 and director of IRC TV; his YouTube channel counted 4.17 million subscribers in November 2026 per vidIQ, and his official website credits him with more than 2,000 lectures in Urdu and Hindi in more than 200 Indian cities."
