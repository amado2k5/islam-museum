label: { ar: "نوفل بن عبد مناف", en: "Nawfal ibn ʿAbd Manāf", es: "Nawfal ibn ʿAbd Manāf", fr: "Nawfal ibn ʿAbd Manāf", ur: "نوفل بن عبد مناف" }
summary: { ar: "عم عبد المطلب الذي وثب على أركاحه بعد موت المطلب فغصبه إياها، حتى ردّها بتدخل أخواله من بني النجار وتحالف بني هاشم وخزاعة.", en: "ʿAbd al-Muṭṭalib’s uncle who seized his offices after al-Muṭṭalib’s death, forced to restore them under pressure of the Najjār and the new pact.", es: "El tío de ʿAbd al-Muṭṭalib, que se apoderó de sus cargos tras la muerte de al-Muṭṭalib, se vio obligado a restituirlos bajo la presión del Najjār y el nuevo pacto.", fr: "L'oncle d'ʿAbd al-Muṭṭalib, qui s'était emparé de ses fonctions après la mort d'al-Muṭṭalib, fut contraint de les restituer sous la pression des Najjār et du nouveau pacte.", ur: "عبدالمطلب کے چچا جنہوں نے المطلب کی موت کے بعد ان کے دفاتر پر قبضہ کر لیا تھا، نجار اور نئے معاہدے کے دباؤ میں انہیں بحال کرنے پر مجبور ہوئے۔", tr: "Abdul Muttalib'in amcası, Muttalib'in ölümünden sonra tahtına atlayıp tahtı gasp etti; ta ki annesinin Banu Najjar'dan gelen amcaları ve Banu Haşim ile Huza'ah'ın ittifakı sayesinde tahtı geri alana kadar.", id: "Paman Abdul Muttalib, yang naik takhtanya setelah kematian Muttalib dan merebut tahta, hingga ia mengembalikannya dengan campur tangan paman dari pihak ibu dari Banu Najjar dan aliansi Banu Hashim dan Khuza'ah." }
