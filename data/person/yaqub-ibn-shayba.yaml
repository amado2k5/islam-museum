summary:
  ar: "أبو يوسف السدوسي، بصري مولى شداد بن هميان السدوسي، سكن بغداد وسر من رأى وحدّث بها؛ سمع علي بن عاصم ويزيد بن هارون وروح بن عبادة وعفان بن مسلم ومعلى بن منصور ومحمد بن عبد الله الأنصاري وأبا النضر هاشم بن القاسم وأسود بن عامر وأبا نعيم وقبيصة بن عقبة ويحيى بن أبي بكير وحسيناً المروزي ومسلم بن إبراهيم وأبا الوليد الطيالسي ومحمد بن كثير وأبا سلمة التبوذكي وأبا أحمد الزبيري وخلقاً كثيراً، وروى عنه ابن ابنه محمد بن أحمد بن يعقوب ويوسف بن يعقوب بن إسحاق بن البهلول وكان ثقة. صنّف مسنداً معللاً لم يتممه — وقيل لو كان كتابه مسطوراً على همام لوجب أن يُكتب — وكان في منزله أربعون لحافاً أعدّها لمن يبيت من الوراقين لتبييض المسند، وذهب فيه نحو عشرة آلاف دينار. وكان من فقهاء البغداديين على مذهب مالك من كبار أصحاب أحمد بن المعذل والحارث بن مسكين، وكان يقف في القرآن؛ ولما سأل المتوكل أحمد بن حنبل عمن يتقلد القضاء وسُئل عن يعقوب بن شيبة قال مبتدع صاحب هوى — قيل لأنه كان يذهب إلى الوقف في القرآن {cite:tarikh-baghdad-khatib j.11 p.281-283}."
  en: "Abu Yusuf al-Sadusi of Basra, settled at Baghdad and Samarra; his Musnad ma'lul remained unfinished despite a staff of forty warraqun lodging in his house and some ten thousand dinars spent — 'had his book been written on doves it would deserve copying'; a Maliki faqih of Baghdad among the senior companions of Ahmad b. al-Mu'adhdhal and al-Harith b. Miskin; when al-Mutawakkil asked Ahmad b. Hanbal who should hold the judgeship and asked about Ya'qub, Ahmad called him an innovator — it was said, because he held the waqf position on the Qur'an {cite:tarikh-baghdad-khatib j.11 p.281-283}."
