summary:
  ar: "أبو يوسف السدوسي، بصري مولى شداد بن هميان السدوسي، سكن بغداد وسر من رأى وحدّث بها؛ سمع علي بن عاصم ويزيد بن هارون وروح بن عبادة وعفان بن مسلم ومعلى بن منصور ومحمد بن عبد الله الأنصاري وأبا النضر هاشم بن القاسم وأسود بن عامر وأبا نعيم وقبيصة بن عقبة ويحيى بن أبي بكير وحسيناً المروزي ومسلم بن إبراهيم وأبا الوليد الطيالسي ومحمد بن كثير وأبا سلمة التبوذكي وأبا أحمد الزبيري وخلقاً كثيراً، وروى عنه ابن ابنه محمد بن أحمد بن يعقوب ويوسف بن يعقوب بن إسحاق بن البهلول وكان ثقة. صنّف مسنداً معللاً لم يتممه — وقيل لو كان كتابه مسطوراً على همام لوجب أن يُكتب — وكان في منزله أربعون لحافاً أعدّها لمن يبيت من الوراقين لتبييض المسند، وذهب فيه نحو عشرة آلاف دينار. وكان من فقهاء البغداديين على مذهب مالك من كبار أصحاب أحمد بن المعذل والحارث بن مسكين، وكان يقف في القرآن؛ ولما سأل المتوكل أحمد بن حنبل عمن يتقلد القضاء وسُئل عن يعقوب بن شيبة قال مبتدع صاحب هوى — قيل لأنه كان يذهب إلى الوقف في القرآن {cite:tarikh-baghdad-khatib j.11 p.281-283}."
  en: "Abu Yusuf al-Sadusi of Basra, settled at Baghdad and Samarra; his Musnad ma'lul remained unfinished despite a staff of forty warraqun lodging in his house and some ten thousand dinars spent — 'had his book been written on doves it would deserve copying'; a Maliki faqih of Baghdad among the senior companions of Ahmad b. al-Mu'adhdhal and al-Harith b. Miskin; when al-Mutawakkil asked Ahmad b. Hanbal who should hold the judgeship and asked about Ya'qub, Ahmad called him an innovator — it was said, because he held the waqf position on the Qur'an {cite:tarikh-baghdad-khatib j.11 p.281-283}."
  es: "Abu Yusuf al-Sadusi de Basora, establecido en Bagdad y Samarra; su Musnad ma'lul quedó inconcluso a pesar de que un personal de cuarenta warraqun se alojaba en su casa y se gastaron unos diez mil dinares: «si su libro hubiera sido escrito en palomas, merecería ser copiado»; un faqih malikí de Bagdad entre los compañeros más importantes de Ahmad b. al-Mu'adhdhal y al-Harith b. Miskin; cuando al-Mutawakkil preguntó a Ahmad b. Hanbal quién debía ocupar el cargo de juez y preguntó por Ya'qub, Ahmad lo llamó innovador; se decía que porque sostenía la posición waqf sobre el Corán {cite:tarikh-baghdad-khatib j.11 p.281-283}."
  fr: "Abu Yusuf al-Sadusi de Bassora, établi à Bagdad et Samarra, laissa son Musnad ma'lul inachevé malgré une équipe de quarante warraqun logés chez lui et quelque dix mille dinars dépensés — « si son livre avait été écrit sur des colombes, il aurait mérité d'être copié »; un faqih malikite de Bagdad parmi les compagnons les plus éminents d'Ahmad b. al-Mu'adhdhal et d'al-Harith b. Miskin; lorsqu'al-Mutawakkil demanda à Ahmad b. Hanbal qui devait occuper la fonction de juge et s'enquit de Ya'qub, Ahmad le qualifia d'innovateur — cela était dû, disait-on, à sa position sur le waqf concernant le Coran {cite:tarikh-baghdad-khatib j.11 p.281-283}."
  ur: "بصرہ کے ابو یوسف السدوسی، بغداد اور سامرہ میں آباد ہوئے؛ ان کے گھر میں چالیس واراقون کے عملے کے قیام اور دس ہزار دینار خرچ ہونے کے باوجود اس کی مسند معلول نامکمل رہی - 'اگر اس کی کتاب کبوتروں پر لکھی جاتی تو یہ کاپی کرنے کے لائق ہوتی'۔ بغداد کے ایک مالکی فقیہ احمد بن کے بزرگ صحابہ میں سے۔ المعدل و الحارث ب۔ مسکین; جب متوکل نے احمد سے پوچھا۔ حنبل کو جو جج کا عہدہ سنبھالے اور یعقوب کے بارے میں پوچھا، احمد نے اسے بدعتی کہا - کہا جاتا ہے، کیونکہ وہ قرآن پر وقف کا عہدہ رکھتے تھے۔"
  tr: "Shaddad ibn Humayyan el-Sudusi'nin Basri özgürlüğü sahibi Ebu Yusuf el-Sudusi, Bağdat'ta yaşamış ve orada gördüğü ve rivayet ettiği kişilere güvenmiştir; Ali bin Asim, Yezid ibn Harun, Ruh ibn Ubadah, Affan ibn Muslim, Mu'alla ibn Mansur, Muhammed ibn Abdullah el-Ensari, Ebu el-Nadir Haşim ibn el-Kasım, Asvad ibn Amir, Ebu Numir'den haber almıştır 'aym, Qabisa ibn Uqbah, Yahya ibn Abi Bukayr, Husayna al-Marwazi, Muslim ibn İbrahim, Abu al-Walid al-Tayalisi, Muhammed ibn Kathir, Abu Salamah al-Tabudhki, Abu Ahmad al-Zubeyri ve daha birçokları. Oğlu Muhammed ibn Ahmed ibn Ya'qub, Yusuf ibn Ya'qub ibn İshaq ibn al-Bahlul güvenilirdi. Bir mu'allah musnad yazdı ancak tamamlamadı — ve kitabı Hamam üzerine yazılmış olsaydı gerekli olurdu denir — evinde geceyi yazıcılar arasında geçirenler için Musnad'ı beyazlatmak için kırk yorgan hazırlattı ve yaklaşık on bin dinar harcadı. Maliki okulunu takip eden Bağdatlı hukukçular arasındaydı ve Ahmed ibn Mu'adhil ile al-Haris ibn Miskin'in önde gelen bir yoldaşıydı ve Kur'an'a odaklandı; el-Mutavakkil, Ahmed bin Hanbal'a yargıyı kimin tutacağını ve Ya'qub ibn Şeybe'yi sorduğunda, tutkulu bir yenilikçi olduğunu söyledi — bunun sebebinin Kur'an'a gidip durakladığı söylenir {cite:history-baghdad-khatib j.11 s.281-283}."
  id: "Abu Yusuf al-Sudusi, seorang mantan Basri dari Shaddad ibn Humayyan al-Sudusi, tinggal di Baghdad dan curhat kepada mereka yang dilihatnya serta diceritakan di sana; ia mendengar dari Ali ibn Asim, Yazid ibn Harun, Ruh ibn Ubadah, Affan ibn Muslim, Mu'alla ibn Mansur, Muhammad ibn Abdullah al-Ansari, Abu al-Nadr Hashim ibn al-Qasim, Aswad ibn Amir, Abu Nu'aym, Qabisa ibn Uqbah, Yahya ibn Abi Bukayr, Husayna al-Marwazi, Muslim ibn Ibrahim, Abu al-Walid al-Tayalisi, Muhammad ibn Kathir, Abu Salamah al-Tabudhki, Abu Ahmad al-Zubayri, dan banyak lainnya. Putranya Muhammad ibn Ahmad ibn Ya'qub, Yusuf ibn Ya'qub ibn Ishaq ibn al-Bahlul, dapat dipercaya. Ia menulis mu'allah musnad yang tidak ia selesaikan — dan dikatakan bahwa jika bukunya ditulis tentang Hammam, maka itu akan diperlukan — dan ia menyiapkan empat puluh selimut di rumahnya untuk mereka yang menginap di antara para ahli kitab untuk memutihkan Musnad, dan ia menghabiskan sekitar sepuluh ribu dinar untuk itu. Ia termasuk di antara para ahli hukum Baghdad yang mengikuti mazhab Maliki dan sahabat terkemuka Ahmad ibn al-Mu'adhil dan al-Harith ibn Miskin, dan ia akan fokus pada Al-Qur'an; ketika al-Mutawakkil bertanya kepada Ahmad ibn Hanbal tentang siapa yang akan memegang kehakiman dan tentang Ya'qub ibn Shaybah, ia berkata: seorang inovator dengan semangat — dikatakan karena ia biasa pergi ke Al-Qur'an untuk berhenti {cite:history-baghdad-khatib j.11 hlm.281-283}."
