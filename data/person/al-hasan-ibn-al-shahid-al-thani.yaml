  ur: "جبل عامل کے سترہویں صدی کے فقیہ الحسن بن زین الدین صاحب المعلم کے لیے ڈرافٹ کارڈ 1602; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Ma'alim'in yazarı ve on yedinci yüzyılda Cebel Amel'in hukukçusu olan Hasan bin Zain al-Din'in ön kartı; kendisi önemli kişilerin sözlükleriyle anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Hassan bin Zain al-Din, penulis Ma'alim dan ahli hukum Jabal Amel pada abad ketujuh belas, yang meninggal pada tahun 1602 M; ia dikenang oleh kamus tokoh-tokoh terkemuka, dan biografinya belum pernah diulas di halaman tersebut."
