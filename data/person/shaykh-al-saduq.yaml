summary:
  ar: "بطاقة أولية لمحمد بن علي بن بابويه القمي المعروف بالشيخ الصدوق، من أئمة حديث الإمامية وصاحب «من لا يحضره الفقيه»، توفي سنة ٩٩١م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Muhammad ibn Ali ibn Babawayh al-Qummi, known as al-Shaykh al-Saduq, the Twelver hadith authority and author of Man La Yahduruh al-Faqih, d. 991; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Muhammad ibn Ali ibn Babawayh al-Qummi, conocido como al-Shaykh al-Saduq, autoridad de hadices duodecimana y autor de Man La Yahduruh al-Faqih, fallecido en 991; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de projet pour Muhammad ibn Ali ibn Babawayh al-Qummi, connu sous le nom d'al-Shaykh al-Saduq, autorité duodécimaine en matière de hadiths et auteur de Man La Yahduruh al-Faqih, mort en 991; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "محمد بن علی ابن بابویہ القمی کے لیے ڈرافٹ کارڈ، جسے الشیخ الصدوق کے نام سے جانا جاتا ہے، بارہویں حدیث کے مصنف اور من لا یھدورۃ الفقیہ کے مصنف، ڈی۔ 991; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "İmam hadislerinin önde gelen alimlerinden ve 'Man La Yahduruhu al-Faqih'in yazarı olan Muhammed bin Ali ibn Babaveyh el-Qummi'nin ön kartı ve 991 yılında ölen Şeyh al-Saduq'un ön kartı; biyografik kitaplarda kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Muhammad ibn Ali ibn Babawayh al-Qummi, yang dikenal sebagai Sheikh al-Saduq, salah satu ulama hadis Imami terkemuka dan penulis 'Man La Yahduruhu al-Faqih', yang meninggal pada tahun 991 M; buku biografi menyebutkannya, dan biografinya belum pernah diulas di halaman tersebut."
