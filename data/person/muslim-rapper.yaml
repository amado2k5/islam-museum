  ar: "مغني راب مغربي من طنجة، وُلد سنة 1981، يُعد من رواد الراب المغربي والمغاربي؛ أسس فرقة «الزنقة فلو» سنة 1998، وأصدر أول ألبوماته الفردية «التمرد» سنة 2010، وفاز بجائزة أفضل مغني راب في المغرب سنة 2014، ووُشّح سنة 2015 بوسام المكافأة الوطنية من درجة فارس."
  en: "Moroccan rapper from Tangier, born in 1981, regarded as a pioneer of Moroccan and Maghreb rap. He founded the group Zanka Flow in 1998, released his first solo album 'Al-Tamarrud' (Rebellion) in 2010, won the Morocco Music Award for best rapper in 2014, and was decorated in 2015 with the Order of the National Reward, knight grade."
