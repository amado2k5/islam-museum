id: person/uqba-ibn-al-hajjaj-al-saluli
class: person
label: { ar: "عقبة بن الحجاج السلولي" }
gender: male
summary:
  ar: "أمير الأندلس من قبل عبيد الله بن الحبحاب؛ أقام خمس سنين محمود السيرة مجاهداً مظفراً حتى بلغ سكنى المسلمين أربونة وصار ربالهم على نهر رودنة، ثم وثب عليه عبد الملك بن قطن الفهري سنة إحدى وعشرين ومائة فقتله، وقال الرازي: ثار أهل الأندلس بأميرهم عقبة في صفر سنة ثلاث وعشرين في خلافة هشام بن عبد الملك وتوفي بقرقشونة {cite:nafh-tib-maqqari p. 272}. ويذكر الكتاب أن عبيد الله بن الحبحاب أرسله إلى الأندلس بعد عزل عبد الملك بن قطن، فملكها واستقر في سبتمانية، وفتح بعض أراضي جليقية، ثم خلعه أهل الأندلس وتوفي بقرطبة. {cite:salabi-umayyad-state-2020 p.485-486}"
  en: "Governor of al-Andalus for five years of praised conduct and victorious jihad; under him Muslim settlement reached Narbonne and their ribats stood on the Rhone, until Abd al-Malik b. Qatan rose against him in 121 (or he died at Carcassonne in 123 by al-Razi's count) {cite:nafh-tib-maqqari p. 272}."
