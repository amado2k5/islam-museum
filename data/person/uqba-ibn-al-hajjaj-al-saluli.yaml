id: person/uqba-ibn-al-hajjaj-al-saluli
class: person
label: { ar: "عقبة بن الحجاج السلولي" }
gender: male
summary:
  ar: "أمير الأندلس من قبل عبيد الله بن الحبحاب؛ أقام خمس سنين محمود السيرة مجاهداً مظفراً حتى بلغ سكنى المسلمين أربونة وصار ربالهم على نهر رودنة، ثم وثب عليه عبد الملك بن قطن الفهري سنة إحدى وعشرين ومائة فقتله، وقال الرازي: ثار أهل الأندلس بأميرهم عقبة في صفر سنة ثلاث وعشرين في خلافة هشام بن عبد الملك وتوفي بقرقشونة {cite:nafh-tib-maqqari p. 272}. ويذكر الكتاب أن عبيد الله بن الحبحاب أرسله إلى الأندلس بعد عزل عبد الملك بن قطن، فملكها واستقر في سبتمانية، وفتح بعض أراضي جليقية، ثم خلعه أهل الأندلس وتوفي بقرطبة. {cite:salabi-umayyad-state-2020 p.485-486}"
  en: "Governor of al-Andalus for five years of praised conduct and victorious jihad; under him Muslim settlement reached Narbonne and their ribats stood on the Rhone, until Abd al-Malik b. Qatan rose against him in 121 (or he died at Carcassonne in 123 by al-Razi's count) {cite:nafh-tib-maqqari p. 272}."
  es: "Gobernador de al-Ándalus durante cinco años de elogio y victorioso yihad; bajo su mandato, los asentamientos musulmanes llegaron a Narbona y sus ribats se asentaron en el Ródano, hasta que Abd al-Malik b. Qatan se alzó contra él en 121 (o murió en Carcasona en 123 según el recuento de al-Razi) {cite:nafh-tib-maqqari p. 272}."
  fr: "Gouverneur d'al-Andalus pendant cinq ans, chef loué et jihadiste victorieux; sous son règne, l'établissement musulman atteignit Narbonne et leurs ribats se dressèrent sur le Rhône, jusqu'à ce qu'Abd al-Malik b. Qatan se soulève contre lui en 121 (ou qu'il meure à Carcassonne en 123 selon le décompte d'al-Razi) {cite:nafh-tib-maqqari p. 272}."
  ur: "الاندلس کا گورنر پانچ سال تک قابل تعریف طرز عمل اور فاتحانہ جہاد؛ اس کے تحت مسلم بستی نربون پہنچی اور ان کی رباطیں رون پر کھڑی رہیں یہاں تک کہ عبد الملک بن۔ قطان 121 میں اس کے خلاف اٹھ کھڑا ہوا ⁦(یا رازی کے شمار کے مطابق 123 میں کارکاسون میں فوت ہوا)⁩ 272}۔"
