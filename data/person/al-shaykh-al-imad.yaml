id: person/al-shaykh-al-imad
class: person
label: { ar: "الشيخ العماد", en: "al-Shaykh al-Imad", fr: "al-Shaykh al-Imad", es: "al-Shaykh al-Imad", ur: "الشیخ العماد" }
summary:
  ar: "الشيخ العماد أبو إسحاق إبراهيم بن عبد الواحد المقدسي الحنبلي أخو الحافظ عبد الغني؛ ولد بجماعيل سنة ثلاث وأربعين وخمسمائة وهاجر سنة إحدى وخمسين مع أقاربه وسمع ببغداد من شهدة وصالح بن الرحلة وبالموصل من خطيبها وحفظ الخرقي وغريب العزيزي وألقى الدروس وناظر وقرأ القراءات على أبي الحسن البطايحي وكان متصدياً لإقراء القرآن والفقه، ورعاً تقياً متواضعاً سمحاً مفضالاً صواماً قواماً صاحب أحوال وكرامات موصوفاً بطول الصلاة؛ قال الشيخ الموفق ما فارقته إلا أن يسافر فما عرفته أنه عصى الله معصية، وقال الضياء كان عالماً بالقرآن والنحو والفرائض وصنف «كتاب الفروق في المسائل الفقهية»؛ وكان يشغل بالجبل إذا كان الشيخ موفق الدين في المدينة فإذا صعد الموفق نزل هو فأشغل بالمدينة، وكان يشغل بجامع دمشق من الفجر إلى العشاء لا يخرج إلا لما لا بد له منه، وكان كثير الأمر بالمعروف والنهي عن المنكر خرج مرة إلى قوم من الفساق فكسّر ما معهم فضربوه ونالوا منه حتى غشي عليه فأراد الوالي ضرب الذين نالوا منه فقال إن تابوا ولزموا الصلاة فلا تؤذوهم وهم في حل من قبلي فتابوا؛ توفي ليلة الخميس سابع عشر ذي القعدة سنة أربع عشرة وستمائة فجأة، وأخرجت جنازته إلى جامع دمشق فما وسع الناس الجامع وصلى عليه الموفق بحلقة الحنابلة بعد جهد جهيد وكان يوماً لم يُر في الإسلام مثله فيما وصف سبط ابن الجوزي {cite:shadharat-dhahab p. 57-60}."
  en: "Al-Shaykh al-Imad Abu Ishaq Ibrahim ibn Abd al-Wahid al-Maqdisi al-Hanbali, brother of the hafiz Abd al-Ghani. Born at Jama'il in 543, he emigrated with his relatives in 551. At Baghdad he heard from Shuhda and Salih ibn al-Rahla, and at Mosul from its preacher; he memorised al-Khiraqi and Gharib al-Azizi, gave lessons, took part in disputations, read the readings under Abu al-Hasan al-Bataihi, and devoted himself to teaching the Qur'an and fiqh. Pious, humble, generous and bountiful, he fasted often and prayed through the night, a man of spiritual states and marvels, known for long prayer. Al-Shaykh al-Muwaffaq said: 'I never parted from him except when he travelled, and I never knew him to disobey God in any act.' Al-Diya' said he was learned in the Qur'an, grammar and inheritance, and wrote Kitab al-Furuq fi al-masa'il al-fiqhiyya. He taught on the mountain while Shaykh Muwaffaq al-Din was in the town, and when Shaykh Muwaffaq al-Din went up to the mountain he came down and taught in the town. He taught at the Mosque of Damascus from dawn until night prayer, leaving only for what he could not avoid. He often enjoined good and forbade wrong; once he went out to a group of wrongdoers and smashed what they had, and they beat and abused him until he fainted. When the governor wanted to punish those who had abused him, he said: 'If they repent and keep up the prayer, do not harm them; they are absolved by me.' They repented. He died suddenly on the night of Thursday 17 Dhu al-Qa'da 614. His bier was carried to the Mosque of Damascus; the mosque could not hold the people, and Shaykh Muwaffaq al-Din led the prayer over him at the Hanbali circle after great effort. It was, as Sibt Ibn al-Jawzi described it, a day the like of which had not been seen in Islam {cite:shadharat-dhahab p. 57-60}."
  fr: "Al-Shaykh al-Imad Abou Ishaq Ibrahim ibn Abd al-Wahid al-Maqdisi al-Hanbali était le frère du hafiz Abd al-Ghani. Né à Jama‘il en 543, il émigra avec ses proches en 551. Il suivit les enseignements de Shuhda et de Salih ibn al-Rahla à Bagdad, et ceux du prédicateur de Mossoul dans cette ville. Il apprit par cœur l’ouvrage d’al-Khiraqi et le Gharib al-Azizi, donna des leçons, prit part à des disputes savantes et étudia les lectures coraniques auprès d’Abou al-Hasan al-Bataihi. Il se consacra à l’enseignement du Coran et du droit musulman. Pieux, humble, généreux et prodigue, il jeûnait souvent et priait toute la nuit. On lui attribuait des états spirituels et des prodiges, et il était connu pour la longueur de ses prières. Al-Shaykh al-Muwaffaq disait : « Je ne me suis jamais séparé de lui, sauf quand il voyageait, et je ne l’ai jamais vu désobéir à Dieu en quoi que ce soit. » Selon al-Diya’, il était versé dans le Coran, la grammaire et le droit successoral, et écrivit le Kitab al-Furuq fi al-masa’il al-fiqhiyya. Il enseignait sur la montagne lorsque Shaykh Muwaffaq al-Din était en ville ; lorsque celui-ci montait sur la montagne, il redescendait enseigner en ville. Il enseignait à la mosquée de Damas de l’aube à la prière de la nuit, ne s’absentant qu’en cas de nécessité. Il enjoignait souvent de faire le bien et de s’abstenir du mal. Un jour, il alla trouver des hommes dont il réprouvait la conduite et brisa ce qu’ils avaient avec eux. Ils le frappèrent et le maltraitèrent jusqu’à ce qu’il perde connaissance. Lorsque le gouverneur voulut les punir, al-Imad dit : « S’ils se repentent et observent la prière, ne leur faites pas de mal : je leur pardonne. » Ils se repentirent. Il mourut soudainement dans la nuit du jeudi 17 dhou al-qi‘da 614. On porta son cercueil à la mosquée de Damas, trop petite pour la foule. Shaykh Muwaffaq al-Din parvint avec grand-peine à diriger la prière funèbre au cercle des hanbalites. Selon Sibt Ibn al-Jawzi, on n’avait jamais vu de jour pareil en terre d’islam {cite:shadharat-dhahab p. 57-60}."
  es: "Al-Shaykh al-Imad Abu Ishaq Ibrahim ibn Abd al-Wahid al-Maqdisi al-Hanbali, hermano del hafiz Abd al-Ghani. Nacido en Jama'il en 543, emigró con sus parientes en 551. En Bagdad escuchó a Shuhda y Salih ibn al-Rahla, y en Mosul a su predicador; memorizó a al-Khiraqi y Gharib al-Azizi, impartió lecciones, participó en disputas, leyó las lecturas bajo la dirección de Abu al-Hasan al-Bataihi y se dedicó a la enseñanza del Corán y el fiqh. Piadoso, humilde, generoso y bondadoso, ayunaba con frecuencia y oraba durante toda la noche; un hombre de estados y maravillas espirituales, conocido por sus largas oraciones. Al-Shaykh al-Muwaffaq dijo: 'Nunca me separé de él excepto cuando viajaba, y nunca lo vi desobedecer a Dios en ningún acto'. Al-Diya' dijo que era versado en el Corán, gramática y herencia, y escribió Kitab al-Furuq fi al-masa'il al-fiqhiyya. Enseñaba en la montaña mientras Shaykh Muwaffaq al-Din estaba en la ciudad, y cuando Shaykh Muwaffaq al-Din subía a la montaña, él bajaba y enseñaba en la ciudad. Enseñaba en la Mezquita de Damasco desde el amanecer hasta la oración de la noche, saliendo solo para lo que no podía evitar. A menudo ordenaba el bien y prohibía el mal; una vez salió a un grupo de malhechores y destrozó lo que tenían, y ellos lo golpearon e insultaron hasta que se desmayó. Cuando el gobernador quiso castigar a quienes lo habían insultado, dijo: 'Si se arrepienten y mantienen la oración, no les hagan daño; «Me perdono». Se arrepintieron. Murió repentinamente la noche del jueves 17 de Dhu al-Qa'da de 614. Su féretro fue llevado a la Mezquita de Damasco; la mezquita no pudo albergar a la multitud, y el jeque Muwaffaq al-Din dirigió la oración en su honor en el círculo hanbalí tras un gran esfuerzo. Fue, como lo describió Sibt Ibn al-Jawzi, un día como nunca antes se había visto en el Islam {cita: shadharat-dhahab págs. 57-60}."
  ur: "الشیخ العماد ابو اسحاق ابراہیم بن عبد الواحد المقدسی الحنبلی، حافظ عبد الغنی کے بھائی۔ 543 میں جمائل میں پیدا ہوئے، انہوں نے 551 میں اپنے رشتہ داروں کے ساتھ ہجرت کی۔ بغداد میں اس نے شھدہ اور صالح بن الرحلہ سے اور موصل میں اس کے مبلغ سے سنا۔ اس نے الخراقی اور غریب العزیزی کو حفظ کیا، اسباق دیے، تنازعات میں حصہ لیا، ابو الحسن البطیحی کے ماتحت قراء ات پڑھیں، اور خود کو قرآن اور فقہ کی تعلیم کے لیے وقف کر دیا۔ متقی، عاجز، فیاض اور فیاض، وہ اکثر روزہ رکھتے اور رات بھر دعائیں کرتے، روحانی کیفیتوں اور عجائبات کا حامل شخص، لمبی دعاؤں کے لیے جانا جاتا ہے۔ الشیخ الموفق نے کہا: 'میں اس سے کبھی جدا نہیں ہوا سوائے اس کے کہ جب وہ سفر کرتا ہو، اور میں اسے کبھی نہیں جانتا تھا کہ وہ کسی کام میں خدا کی نافرمانی کرتا ہے۔' الدیاء نے کہا کہ وہ قرآن، گرامر اور وراثت میں سیکھا تھا، اور کتاب الفروق فی المسائل الفقہیہ لکھی۔ جب شیخ موفق الدین بستی میں تھے تو پہاڑ پر پڑھاتے تھے اور جب شیخ موفق الدین پہاڑ پر جاتے تھے تو نیچے اتر کر بستی میں پڑھاتے تھے۔ اس نے دمشق کی مسجد میں فجر سے لے کر رات کی نماز تک پڑھایا، صرف اس چیز کو چھوڑا جس سے وہ بچ نہیں سکتا تھا۔ وہ اکثر نیکی کا حکم دیتا اور برائی سے منع کرتا۔ ایک دفعہ وہ ظالموں کے ایک گروہ کے پاس گیا اور ان کے پاس جو کچھ تھا اسے توڑ ڈالا، اور انہوں نے اسے مارا پیٹا یہاں تک کہ وہ بے ہوش ہوگیا۔ جب گورنر نے ان لوگوں کو سزا دینا چاہی جنہوں نے اس کے ساتھ زیادتی کی تھی تو اس نے کہا: 'اگر وہ توبہ کر لیں اور نماز قائم کریں تو انہیں نقصان نہ پہنچاؤ۔ وہ میری طرف سے بری ہو گئے ہیں۔' انہوں نے توبہ کی۔ جمعرات 17 ذی القعدہ 614 کی رات اچانک ان کا انتقال ہوگیا۔ مسجد لوگوں کو نہ روک سکی اور شیخ موفق الدین نے بڑی کوشش کے بعد حنبلی حلقہ میں ان پر نماز پڑھائی۔ جیسا کہ سبط ابن الجوزی نے بیان کیا ہے، یہ وہ دن تھا جس کی مثال اسلام میں نہیں دیکھی گئی تھی۔ 57-60}۔"
  tr: "Şeyh El-İmad Ebu İshaq İbrahim ibn Abdul Vahid El-Makdisi El-Hanbali, Hafız Abdülgani'nin kardeşi; 543 Hicri yılında Cemail'de doğmuş, 1951'de akrabalarıyla birlikte göç etmiş, Bağdat'ta Şahda ve Salih bin El-Rilaha'dan, Musul'da ise vaizinden el-Khurqi ve Harib El-Azizi'yi ezberlemiştir. Ebu Hasan El-Batayihi yanında ders vermiş, Kur'an okumalarını çalışmış ve okudu. Kur'an ve fıkıh okumaya kendini adamış, takvaz, alçakgönüllü, cömert, oruç tutan, dik, dik duran, durumu ve mucizeleriyle karakterize edilmiş ve uzun dua lideri olarak tanımlanmıştır. Şeyh El-Muvaffaq, onu sadece seyahat etmek için terk ettiğini söylemiştir Bilmediğim şey, Allah'a itaatsizlik ettiğini günah olarak görmesiydi. El-Diya', Kur'an, dilbilgisi ve miras kanunları hakkında bilgi sahibi olduğunu ve 'Fıkıh Konularındaki Farklılıklar Kitabı'nı yazdığını söyledi. Şeyh Muvaffaq Din Medine'deyken dağlarda meşguldü. Muwaffaq yükseldiğinde Medine'de kalır ve meşgul olurdu. Şafaktan akşama kadar Şam Camii'nde meşgul olur, sadece kesinlikle gerekli olan şeyler için dışarı çıkardı. İyiliği sık sık öğütler ve kötülüğü yasaklardı. Bir keresinde, ellerinde olanı kıran ahlaksız bir grup insana çıktı, onlar da onu dövüp zarar verdiler, ta ki bayılana kadar. Vali, kendisinden faydalananları vurmak istedi, 'Eğer tövbe edip namaza uyarlarsa, benim önümde bir yerde oldukları sürece onlara zarar verme.' dedi. Böylece tövbe ettiler. Zulü Kı'dah'ın on yedinci günü, altı yüz on dört Hâm Perşembe gecesi aniden öldü. Cenazesi Şam Camii'ne götürüldü, ancak kalabalık camiyi ağırlayamadı. El-Muvaffaq büyük çabayla Hanbali çemberinde onun için namaz kıldı. İbn el-Cevzi'nin torunu tarafından anlatıldığı gibi İslam'da böyle bir gün yoktu {kaynak: şadharat-dhahab, s. 57-60}."
  id: "Sheikh Al-Imad Abu Ishaq Ibrahim ibn Abdul Wahid Al-Maqdisi Al-Hanbali, saudara Hafiz Abdul Ghani; lahir di Jama'il pada tahun 543 H, bermigrasi pada tahun 1951 bersama kerabatnya, dan mendengar di Baghdad dari Shahdah dan Saleh ibn Al-Rilaha, serta di Mosul dari pengkhotbahnya, menghafal Al-Khurqi dan Gharib Al-Azizi. Ia memberikan pelajaran, belajar, dan membaca bacaan Al-Qur'an di bawah bimbingan Abu Al-Hasan Al-Batayihi. Ia berdedikasi untuk membaca Al-Qur'an dan fiqh, taat, rendah hati, murah hati, berpuasa, tegak, lurus, ditandai dengan keadaannya dan mukjizat, dan digambarkan sebagai pemimpin solat yang panjang. Sheikh Al-Muwaffaq berkata bahwa ia tidak pernah meninggalkannya kecuali untuk bepergian Yang tidak saya ketahui adalah bahwa dia membangkang Tuhan sebagai dosa. Al-Diya mengatakan dia menguasai Al-Quran, tata bahasa, dan hukum warisan, serta menulis buku 'Kitab Perbedaan dalam Isu Firisprudensi.' Dia dulu sibuk di pegunungan ketika Sheikh Muwaffaq al-Din berada di Madinah. Ketika Muwaffaq naik ke sana, dia akan tinggal dan sibuk di Madinah. Dia sibuk di Masjid Damaskus dari fajar hingga malam, keluar hanya untuk hal-hal yang benar-benar diperlukan. Dia sering memerintahkan kebaikan dan melarang kejahatan. Suatu kali, dia pergi ke sekelompok orang yang tidak bermoral yang merusak apa yang mereka miliki, sehingga mereka memukulnya dan menyakitinya sampai pingsan. Gubernur ingin memukul mereka yang telah memanfaatkannya, dengan berkata, 'Jika mereka bertobat dan mematuhi shalat, jangan sakiti mereka saat mereka berada di tempat di hadapan-Ku.' Maka mereka bertobat. Ia meninggal secara mendadak pada malam Kamis, tanggal tujuh belas Dhu al-Qi'dah, enam ratus empat belas H. Pemakamannya dibawa ke Masjid Damaskus, tetapi kerumunan tidak dapat menampung masjid tersebut. Al-Muwaffaq memimpin shalat untuknya di lingkaran Hanbali setelah usaha keras. Tidak ada hari seperti ini dalam Islam, seperti yang digambarkan oleh cucu Ibn al-Jawzi {cite:shadharat-dhahab, hlm. 57-60}."
