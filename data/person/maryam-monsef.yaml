summary:
  ar: "سياسية كندية من أصل أفغاني وُلدت في مشهد بإيران، مثّلت دائرة بيتربورو—كاوارثا في مجلس العموم الكندي من 2015 إلى 2021، وتولّت حقائب المؤسسات الديمقراطية والمرأة والمساواة بين الجنسين والتنمية الدولية والتنمية الاقتصادية الريفية."
  en: "Afghan-Canadian politician born in Mashhad, Iran, who represented Peterborough—Kawartha in Canada's House of Commons from 2015 to 2021 and held the federal portfolios of democratic institutions, women and gender equality, international development and rural economic development."
  ur: "افغان نژاد کینیڈین سیاست دان جو مشہد، ایران میں پیدا ہوئیں، 2015 سے 2021 تک ایوانِ زیریں میں پیٹربورو—کاوارتھا کی نمائندگی کی اور جمہوری اداروں، خواتین و صنفی مساوات، بین الاقوامی ترقی اور دیہی اقتصادی ترقی کی وفاقی وزارتیں سنبھالیں۔"
