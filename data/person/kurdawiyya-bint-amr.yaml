gender: female
roles: [mystic]
summary:
  ar: "عابدة من البصرة كانت تخدم شعوانة؛ يروي ابن الجوزي في «صفة الصفوة» ما قالت إنها نالته من بركة خدمتها: ما أحبت الدنيا منذ خدمتها، ولا اهتمت لرزقها، ولا استصغرت أحداً من المسلمين."
  en: "A devout woman of Basra who served Sha'wana; Ibn al-Jawzi's Sifat al-Safwa records what she said she gained from that service: she had not loved the world since, nor worried over her provision, nor looked down on any Muslim."
  ur: "بصرہ کی ایک عابدہ جو شعوانہ کی خدمت کرتی تھیں؛ ابن الجوزی کی «صفۃ الصفوہ» ان کا یہ قول نقل کرتی ہے کہ اس خدمت کی برکت سے انہوں نے پھر کبھی دنیا سے محبت نہ کی، نہ رزق کی فکر کی، نہ کسی مسلمان کو حقیر جانا۔"
  es: "Una mujer devota de Basora que servía a Sha'wana; en su Sifat al-Safwa de Ibn al-Jawzi se recoge lo que ella dijo haber obtenido de ese servicio: desde entonces no había amado el mundo, ni se había preocupado por su sustento, ni había menospreciado a ningún musulmán."
  fr: "Une femme pieuse de Bassora qui servait Sha'wana; le Sifat al-Safwa d'Ibn al-Jawzi rapporte ce qu'elle disait avoir retiré de ce service: depuis lors, elle n'aimait plus le monde, ne s'inquiétait plus de ses besoins et ne méprisait plus aucun musulman."
  tr: "Basra'dan bir ibadet eden Şawana'ya hizmet ederdi; İbn al-Jawzi, 'Sifat al-Safwa'da hizmetinin bereketinden aldığı şeyleri anlatır: hizmetinden sonra dünyayı hiç sevmedi, geçimini umursamadı ve hiçbir Müslümanı küçümsemedi."
  id: "Seorang jamaah dari Basra dulu melayani Shawana; Ibn al-Jawzi menceritakan dalam 'Sifat al-Safwa' apa yang dia katakan diterima dari berkat pengabdiannya: dia tidak pernah mencintai dunia sejak pengabdiannya, tidak peduli pada mata pencahariannya, dan tidak merendahkan Muslim manapun."
