summary:
  ar: "عابدة من البصرة كانت تخدم شعوانة؛ يروي ابن الجوزي في «صفة الصفوة» ما قالت إنها نالته من بركة خدمتها: ما أحبت الدنيا منذ خدمتها، ولا اهتمت لرزقها، ولا استصغرت أحداً من المسلمين."
  en: "A devout woman of Basra who served Sha'wana; Ibn al-Jawzi's Sifat al-Safwa records what she said she gained from that service: she had not loved the world since, nor worried over her provision, nor looked down on any Muslim."
  ur: "بصرہ کی ایک عابدہ جو شعوانہ کی خدمت کرتی تھیں؛ ابن الجوزی کی «صفۃ الصفوہ» ان کا یہ قول نقل کرتی ہے کہ اس خدمت کی برکت سے انہوں نے پھر کبھی دنیا سے محبت نہ کی، نہ رزق کی فکر کی، نہ کسی مسلمان کو حقیر جانا۔"
