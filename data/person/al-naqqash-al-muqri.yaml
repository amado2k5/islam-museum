died: { edtf: "0962", hijri: "0351", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم الثلاثاء ودفن يوم الأربعاء لثلاث خلون من شوال سنة إحدى وخمسين وثلاثمائة، وقيل سنة خمسين وقيل اثنتين وخمسين {cite:wafayat-ayan}." }
summary:
  ar: "أبو بكر محمد بن الحسن بن محمد بن زياد المقرئ المعروف بالنقاش، الموصلي الأصل البغدادي المولد والمنشأ؛ كان عالماً بالقراءة والتفسير واللغة، صنّف كتباً منها «شفاء الصدور» في التفسير و«الإشارة» في غريب القرآن و«الموضّح» في القرآن ومعانيه والمعاجم الثلاثة الكبير والأوسط والأصغر في أسماء القراء وقراءاتهم و«السبعة بعللها» و«أخبار القصاص» و«دلائل النبوة»؛ وقال البرقاني: كل حديث النقاش مناكير وليس في تفسيره حديث صحيح {cite:wafayat-ayan}."
  en: "al-Naqqash (265/266–351) — the Baghdadi qari' and exegete of Mosuli origin; author of Shifa' al-Sudur and three mu'jams on the readers and their readings; al-Barqani dismissed his hadith as munkar {cite:wafayat-ayan}."
