id: person/jafar-ibn-uthman-al-mushafi
class: person
label: { ar: "جعفر بن عثمان المصحفي" }
gender: male
summary:
  ar: "حاجب الحكم المستنصر؛ مالأ ابن أبي عامر على قتل المغيرة ليلة بيعة هشام المؤيد، ثم حمله ابن أبي عامر على نكبة الصقالبة الخدام بالقصر فأخرجهم وكانوا ثمانمائة أو يزيدون، ثم نكبه ابن أبي عامر مستعيناً بغالب فمحا أثره من الدولة {cite:nafh-tib-maqqari p. 433}."
  en: "Al-Hakam's hajib who aided Ibn Abi Amir's first coup, purged the palace's eight hundred Slav guards for him, and was then himself destroyed by Ghalib in the hajib's sequence of eliminations {cite:nafh-tib-maqqari p. 433}."
  es: "El hajib de Al-Hakam que ayudó al primer golpe de estado de Ibn Abi Amir, purgó a los ochocientos guardias eslavos del palacio para él, y luego fue él mismo destruido por Ghalib en la secuencia de eliminaciones del hajib {cite:nafh-tib-maqqari p. 433}."
  fr: "Le hajib d'Al-Hakam qui a aidé Ibn Abi Amir lors de son premier coup d'État, a purgé pour lui les huit cents gardes slaves du palais, puis a été lui-même détruit par Ghalib dans la séquence d'éliminations du hajib {cite:nafh-tib-maqqari p. 433}."
  ur: "الحکم کے حاجی جس نے ابن ابی عامر کی پہلی بغاوت میں مدد کی تھی، اس کے لیے محل کے آٹھ سو غلام محافظوں کو صاف کر دیا تھا، اور پھر خود غالب کے ہاتھوں ہزیب کے خاتمے کے سلسلے میں تباہ ہو گیا تھا۔ 433}۔"
