summary:
  ar: "يستاسف الملك أخرج الأصنام من البيت المعظم على رأس جبل بأصبهان المسمى مارس حين تمجس وجعله بيست ناره، وهذا البيت على ثلاثة فراسخ من أصبهان معظم عند المجوس إلى زمان المسعودي {cite:muruj-al-dhahab p. 538-539}."
  en: "King Yastasif who emptied the Isfahan hill-temple Maris of its idols on his conversion to Magianism and made it his fire-temple — still revered by the Magians in al-Mas'udi's day {cite:muruj-al-dhahab p. 538-539}."
