  fr: "Le roi Yastasif qui vida le temple Maris de la colline d'Ispahan de ses idoles lors de sa conversion au magianisme et en fit son temple du feu — toujours vénéré par les Mages à l'époque d'al-Mas'udi {cite:muruj-al-dhahab p. 538-539}."
  ur: "بادشاہ یستصف جس نے جادوگری میں تبدیل ہونے پر اصفہان کے پہاڑی مندر ماریس کو اس کے بتوں سے خالی کر دیا اور اسے اپنا آتش گاہ بنا لیا - المسعودی کے زمانے میں مجوسیوں کی طرف سے اب بھی تعظیم کی جاتی ہے {حوالہ: مروج الذہاب صفحہ 538-539}۔"
