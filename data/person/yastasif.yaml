summary:
  ar: "يستاسف الملك أخرج الأصنام من البيت المعظم على رأس جبل بأصبهان المسمى مارس حين تمجس وجعله بيست ناره، وهذا البيت على ثلاثة فراسخ من أصبهان معظم عند المجوس إلى زمان المسعودي {cite:muruj-al-dhahab p. 538-539}."
  en: "King Yastasif who emptied the Isfahan hill-temple Maris of its idols on his conversion to Magianism and made it his fire-temple — still revered by the Magians in al-Mas'udi's day {cite:muruj-al-dhahab p. 538-539}."
  es: "El rey Yastasif, quien vació el templo-colina de Maris en Isfahán de sus ídolos al convertirse al magianismo y lo convirtió en su templo de fuego, todavía venerado por los magos en la época de al-Mas'udi {cite:muruj-al-dhahab p. 538-539}."
  fr: "Le roi Yastasif qui vida le temple Maris de la colline d'Ispahan de ses idoles lors de sa conversion au magianisme et en fit son temple du feu — toujours vénéré par les Mages à l'époque d'al-Mas'udi {cite:muruj-al-dhahab p. 538-539}."
  ur: "بادشاہ یستصف جس نے جادوگری میں تبدیل ہونے پر اصفہان کے پہاڑی مندر ماریس کو اس کے بتوں سے خالی کر دیا اور اسے اپنا آتش گاہ بنا لیا - المسعودی کے زمانے میں مجوسیوں کی طرف سے اب بھی تعظیم کی جاتی ہے {حوالہ: مروج الذہاب صفحہ 538-539}۔"
  tr: "Kral, dokunulduğunda İsfahan'daki Mars adlı dağın zirvesindeki Büyük Ev'den putları kaldırdığı için pişmanlık duyar ve ateşinden en iyi şekilde yararlanmıştır. Bu ev, İsfahan'dan üç farsakh uzaklıktadır ve Magi'ler tarafından el-Mas'udi zamanına kadar kabul edilmiştir {atıf:muruj-al-dhahab, s. 538-539}."
  id: "Raja menyesal telah memindahkan patung-patung itu dari Rumah Agung di puncak gunung di Isfahan yang disebut Mars ketika ia disentuh dan memanfaatkan apinya sebaik mungkin. Rumah ini adalah tiga farsakh dari Isfahan, yang dianggap oleh orang Majus hingga masa al-Mas'udi {cite:muruj-al-dhahab, hlm. 538-539}."
