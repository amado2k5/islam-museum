summary:
  ar: تيسير رجب التميمي ⁦(1952–)⁩ قاضي قضاة فلسطين الأسبق، رأس المحاكم الشرعية الفلسطينية منذ 1994، ويرأس المركز الفلسطيني لحوار الأديان والحضارات، وهو من أشهر المتحدثين باسم قضية القدس.
  en: Tayseer Rajab al-Tamimi (born 1952) was the long-serving Chief Islamic Justice (qadi al-qudat) of Palestine, heading the sharia court system from 1994, and chairs the Palestinian Centre for Religion
    and Civilization Dialogue; he is one of the best-known Palestinian voices on Jerusalem.
  ur: تیسیر رجب التمیمی ⁦(1952–)⁩ فلسطین کے قاضی القضاة رہے اور 1994 سے شرعی عدالتی نظام کے سربراہ رہے؛ وہ پیلسطینین سینٹر فار ریلیجن اینڈ سولائزیشن ڈائیلاگ کے چیئر مین بھی ہیں اور بیت المقدس کے معروف ترجمان
    شمار ہوتے ہیں۔
  es: "Tayseer Rajab al-Tamimi (nacido en 1952) fue el juez principal islámico (qadi al-qudat) de Palestina durante muchos años, dirigiendo el sistema judicial de la sharia desde 1994, y preside el Centro Palestino para el Diálogo sobre Religión y Civilización; es una de las voces palestinas más conocidas sobre Jerusalén."
  fr: "Tayseer Rajab al-Tamimi (né en 1952) a été le juge en chef islamique (qadi al-qudat) de Palestine pendant de nombreuses années, dirigeant le système des tribunaux de la charia à partir de 1994, et préside le Centre palestinien pour le dialogue entre religion et civilisation; il est l'une des voix palestiniennes les plus connues sur Jérusalem."
  tr: "Tayseer Rajab Al-Tamimi (1952–), Filistin'in eski Baş Yargıcı, 1994'ten beri Filistin Şeriat mahkemelerinin başında, Filistin Dinler ve Medeniyetler Arası Diyalog Merkezi'nin başında ve Kudüs davasının en ünlü sözcülerinden biridir."
  id: "Tayseer Rajab Al-Tamimi (1952–), mantan Ketua Mahkamah Agung Palestina, telah memimpin pengadilan Syariah Palestina sejak 1994, memimpin Pusat Dialog Palestina antara Agama dan Peradaban, dan merupakan salah satu juru bicara paling terkenal untuk perjuangan Yerusalem."
