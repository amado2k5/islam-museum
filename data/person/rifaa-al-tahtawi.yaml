summary:
  ar: "رفاعة بن بدوي الطهطاوي ⁦(١٨٠١–١٨٧٣م)⁩، يتصل نسبه بالحسين السبط؛ عالم مصري من أركان نهضة مصر في العصر الحديث. ولد في طهطا وقصد القاهرة سنة ١٢٢٣هـ فتعلم في الأزهر، وأرسلته الحكومة المصرية إماماً للصلاة والوعظ مع بعثة الشبان الموفدين إلى أوروبا، فدرس الفرنسية ونقل في الجغرافية والتاريخ. ولما عاد إلى مصر ولي رئاسة الترجمة في المدرسة الطبية وأنشأ جريدة «الوقائع المصرية»، وألف وترجم عن الفرنسية كتباً كثيرة منها «قلائد المفاخر في غريب عوائد الأوائل والأواخر» مترجماً، و«المرشد الأمين في تربية البنات والبنين»، و«غاية الإيجاز» في السيرة النبوية، و«أنوار توفيق الجليل» في تاريخ مصر، وتعريب القانون المدني الفرنسي، و«تاريخ قدماء المصريين» و«نهاية الإيجاز» في تراجم رجال الجغرافية {cite:al-aalam tarjama}."
  en: "Rifa'a al-Tahtawi (1801–1873 CE) — 'one of the pillars of Egypt's modern renaissance'; al-Azhar scholar sent as imam with the student mission to France, then head of translation and founder of al-Waqa'i' al-Misriyya {cite:al-aalam tarjama}."
  es: "Rifa'a al-Tahtawi (1801–1873 d. C.) — 'uno de los pilares del renacimiento moderno de Egipto'; erudito de al-Azhar enviado como imán con la misión estudiantil a Francia, luego jefe de traducción y fundador de al-Waqa'i' al-Misriyya {cite:al-aalam tarjama}."
  fr: "Rifa'a al-Tahtawi (1801–1873 CE) — « l'un des piliers de la renaissance moderne de l'Égypte »; érudit d'al-Azhar envoyé comme imam avec la mission étudiante en France, puis chef de la traduction et fondateur d'al-Waqa'i' al-Misriyya {cite:al-aalam tarjama}."
  ur: "رفاع الطحطاوی ⁦(1801–1873 عیسوی)⁩ - 'مصر کی جدید نشاۃ ثانیہ کے ستونوں میں سے ایک'؛ الازہر کے اسکالر کو طالب علم کے مشن کے ساتھ امام کے طور پر فرانس بھیجا گیا، پھر ترجمہ کے سربراہ اور الواقعی المصریہ کے بانی {حوالہ: العالم ترجمہ}۔"
  tr: "Rifa'a ibn Badawi al-Tahtawi (1801–1873 MS), soyundan modern çağda Mısır'ın rönesansının temel taşlarından biri olan Mısırlı alim el-Hüseyin el-Sibt'e kadar uzanır. Tahta'da doğdu ve 1223 Hicri yılında Kahire'ye giderek El-Ezher'de eğitim gördü. Mısır hükümeti, Avrupa'ya gönderilen gençlik heyetiyle birlikte namaz ve vaaz için onu imam olarak gönderdi. Fransızca çalıştı, coğrafya ve tarih okudu. Mısır'a döndüğünde tıp fakültesinde çeviri başkanlığını üstlendi ve 'Al-Waqa'i al-Misriyya' gazetesini kurdu. Fransızcadan birçok kitap yazdı ve çevirdi; bunlar arasında çevirmen olarak 'Qala'id al-Mafakhir fi Gharib Awa'id al-Awa'id al-Awwal wa al-Akhir', 'Al-Murshid al-Amin fi Rabi' al-Banat wal-Banin, peygamber biyografisi üzerine 'Ghayat al-Ijazi', Mısır tarihine dair 'Anwar Tawfiq al-Jalil', Fransız medeni hukukunun Araplaştırılması, 'Antik Mısırlıların Tarihi' ve coğrafyacıların biyografilerinde 'Nihayat al-Ijas' yer alıyor."
  id: "Rifa'a ibn Badawi al-Tahtawi (1801–1873 M), yang garis keturunannya berasal dari al-Husayn al-Sibt, seorang ulama Mesir yang menjadi pilar kebangkitan Mesir di era modern. Ia lahir di Tahta dan pergi ke Kairo pada tahun 1223 H, di mana ia belajar di Al-Azhar. Pemerintah Mesir mengirimnya sebagai imam untuk shalat dan berkhotbah bersama delegasi pemuda yang dikirim ke Eropa. Ia belajar bahasa Prancis serta geografi dan sejarah. Setelah kembali ke Mesir, ia menjabat sebagai kepala penerjemahan di sekolah kedokteran dan mendirikan surat kabar 'Al-Waqa'i al-Misriyya'. Ia menulis dan menerjemahkan banyak buku dari bahasa Prancis, termasuk 'Qala'id al-Mafakhir fi Gharib Awa'id al-Awwal wa al-Akhir' sebagai penerjemah, 'Al-Murshid al-Amin fi Rabi' al-Banat wal-Banin, 'Ghayat al-Ijazi' tentang biografi Nabi, 'Anwar Tawfiq al-Jalil' tentang sejarah Mesir, Arabisasi hukum sipil Prancis, 'Sejarah Orang Mesir Kuno', dan 'Nihayat al-Ijas' dalam biografi para ahli geografi {cite:al-aalam tarjama}."
