summary:
  ar: "رفاعة بن بدوي الطهطاوي (١٨٠١–١٨٧٣م)، يتصل نسبه بالحسين السبط؛ عالم مصري من أركان نهضة مصر في العصر الحديث. ولد في طهطا وقصد القاهرة سنة ١٢٢٣هـ فتعلم في الأزهر، وأرسلته الحكومة المصرية إماماً للصلاة والوعظ مع بعثة الشبان الموفدين إلى أوروبا، فدرس الفرنسية ونقل في الجغرافية والتاريخ. ولما عاد إلى مصر ولي رئاسة الترجمة في المدرسة الطبية وأنشأ جريدة «الوقائع المصرية»، وألف وترجم عن الفرنسية كتباً كثيرة منها «قلائد المفاخر في غريب عوائد الأوائل والأواخر» مترجماً، و«المرشد الأمين في تربية البنات والبنين»، و«غاية الإيجاز» في السيرة النبوية، و«أنوار توفيق الجليل» في تاريخ مصر، وتعريب القانون المدني الفرنسي، و«تاريخ قدماء المصريين» و«نهاية الإيجاز» في تراجم رجال الجغرافية {cite:al-aalam tarjama}."
  en: "Rifa'a al-Tahtawi (1801–1873 CE) — 'one of the pillars of Egypt's modern renaissance'; al-Azhar scholar sent as imam with the student mission to France, then head of translation and founder of al-Waqa'i' al-Misriyya {cite:al-aalam tarjama}."
