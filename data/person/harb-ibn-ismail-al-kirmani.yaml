summary:
  ar: "حرب بن إسماعيل بن خلف، أبو محمد، وقيل أبو عبد الله، الحنظلي الكرماني، صاحب الإمام أحمد، فقيه حافظ نقل عن أحمد فقها كثيرا، وحفظ أربعة آلاف مسألة عن أحمد وإسحاق بن راهويه قبل أن يستمع إليها، وسمع الخلال منه مسائل كثيرة، وكان السلطان قد جعله على الحكم وغيره في البلد. توفي سنة 280هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2058} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  en: "Harb ibn Ismail ibn Khalaf, Abu Muhammad (or Abu Abd Allah), al-Hanzali al-Kirmani, companion of Imam Ahmad. A jurist and memoriser, he transmitted much law from Ahmad, and al-Khallal says he had memorised four thousand questions from Ahmad and Ishaq ibn Rahawayh before hearing them. The ruler appointed him over judgeship and other affairs in the city. He died in 280 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2058} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
