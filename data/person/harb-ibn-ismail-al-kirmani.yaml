summary:
  ar: "حرب بن إسماعيل بن خلف، أبو محمد، وقيل أبو عبد الله، الحنظلي الكرماني، صاحب الإمام أحمد، فقيه حافظ نقل عن أحمد فقها كثيرا، وحفظ أربعة آلاف مسألة عن أحمد وإسحاق بن راهويه قبل أن يستمع إليها، وسمع الخلال منه مسائل كثيرة، وكان السلطان قد جعله على الحكم وغيره في البلد. توفي سنة 280هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2058} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  en: "Harb ibn Ismail ibn Khalaf, Abu Muhammad (or Abu Abd Allah), al-Hanzali al-Kirmani, companion of Imam Ahmad. A jurist and memoriser, he transmitted much law from Ahmad, and al-Khallal says he had memorised four thousand questions from Ahmad and Ishaq ibn Rahawayh before hearing them. The ruler appointed him over judgeship and other affairs in the city. He died in 280 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2058} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  es: "Harb ibn Ismail ibn Khalaf, Abu Muhammad (o Abu Abd Allah), al-Hanzali al-Kirmani, compañero del Imam Ahmad. Jurista y memorizador, transmitió gran parte de la ley de Ahmad, y al-Khallal afirma que memorizó cuatro mil preguntas de Ahmad e Ishaq ibn Rahawayh antes de escucharlas. El gobernante lo designó para el ejercicio de la judicatura y otros asuntos en la ciudad. Falleció en el año 280 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2058} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2059}"
  fr: "Harb ibn Ismail ibn Khalaf, Abu Muhammad (ou Abu Abd Allah), al-Hanzali al-Kirmani, compagnon de l'imam Ahmad. Juriste et mémorisateur, il transmit une grande partie du droit d'Ahmad. Al-Khallal rapporte qu'il avait mémorisé quatre mille questions d'Ahmad et d'Ishaq ibn Rahawayh avant même de les entendre. Le souverain le nomma juge et responsable d'autres affaires de la ville. Il mourut en 280 AH."
  ur: "حرب بن اسماعیل بن خلف، ابو محمد ⁦(یا ابو عبد اللہ)⁩، الحنظلی الکرمانی، امام احمد کے ساتھی۔ ایک فقیہ اور حافظ، اس نے احمد سے بہت زیادہ قانون نقل کیے، اور الخلال کہتے ہیں کہ اس نے احمد اور اسحاق بن راہویہ سے چار ہزار سوالات سننے سے پہلے حفظ کر لیے تھے۔ حاکم نے اسے شہر میں قاضی اور دیگر امور پر مقرر کیا۔ ان کی وفات 280ھ میں ہوئی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 2058}"
