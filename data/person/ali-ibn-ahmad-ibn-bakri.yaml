summary:
  ar: "علي بن أحمد بن بكري، أبو الحسن، خازن دار الكتب بالنظامية، له معرفة جيدة بالأدب وقرأ النحو على ابن الشجري والجواليقي، وكتب من كتب الأدب كثيراً، توفي سنة 575 هـ بحسب الصفدي."
  en: "Ali ibn Ahmad ibn Bakri, Abu al-Hasan, keeper of the book collection at the Nizamiyya, learned in literature, a pupil of Ibn al-Shajari and al-Jawaliqi in grammar, copyist of many literary books; died 575 AH (about 1179-80) per al-Safadi."
  fr: "Ali ibn Ahmad ibn Bakri, Abu al-Hasan, gardien de la collection de livres de la Nizamiyya, versé dans les lettres, élève d’Ibn al-Shajari et d’al-Jawaliqi en grammaire, copiste de nombreux ouvrages littéraires ; mort en 575 H (vers 1179–1180) selon al-Safadi."
