id: person/al-rafi-i
class: person
label: { ar: "الإمام الرافعي عبد الكريم القزويني" }
summary:
  ar: "الإمام العلامة إمام الدين أبو القاسم عبد الكريم بن محمد بن عبد الكريم بن الفضل الرافعي القزويني الشافعي؛ صاحب الشرح المشهور الكبير على المحرر وصاحب الوجيز، انتهت إليه معرفة المذهب ودقائقه وكان مع براعته في العلم صالحاً زاهداً ذا أحوال وكرامات ونسك وتواضع؛ قال ابن قاضي شهبة إليه يرجع عامة الفقهاء من أصحابنا في هذه الأعصار في غالب الأقاليم والأمصار ولقد برز فيه على كثير ممن تقدمه وحاز قصب السبق، وقال ابن الصلاح أظن أني لم أر في بلاد العجم مثله؛ صنف «العزيز» شرح الوجيز في بضعة عشر مجلداً قال النووي لم يصنف في مذهب الشافعي ما يحصل لك مجموع ما ذكره أكمل منه، وصنف شرحاً لمسند الشافعي وأسمعه؛ وقيل إنه لم يجد زيتاً للمطالعة في قرية بات بها فتألم فأضاء له عرق كرمة فجلس يطالع ويكتب عليه؛ توفي سنة ثلاث وعشرين وستمائة بقزوين وعمره نحو ست وستين سنة {cite:shadharat-dhahab p. 108-109}."
  en: "Imam al-Din Abd al-Karim al-Rafi'i of Qazvin — the Shafi'i whose al-Aziz commentary on al-Wajiz in a dozen-odd volumes drew al-Nawawi's verdict that nothing in the school surpassed it; Ibn al-Salah thought he had seen his like nowhere in the Persian lands; a saintly man of karamat who, finding no lamp-oil in a village, studied by the light of a vine-branch; died at Qazvin in 623 at about sixty-six {cite:shadharat-dhahab p. 108-109}."
