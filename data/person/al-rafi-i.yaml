class: person
label: { ar: "الإمام الرافعي عبد الكريم القزويني", en: "Imam al-Rafi'i Abd al-Karim al-Qazwini", fr: "Imam al-Rafi'i Abd al-Karim al-Qazwini", es: "Imam al-Rafi'i Abd al-Karim al-Qazwini", ur: "امام رافع عبد الکریم القزوینی" }
summary:
  ar: "الإمام العلامة إمام الدين أبو القاسم عبد الكريم بن محمد بن عبد الكريم بن الفضل الرافعي القزويني الشافعي؛ صاحب الشرح المشهور الكبير على المحرر وصاحب الوجيز، انتهت إليه معرفة المذهب ودقائقه وكان مع براعته في العلم صالحاً زاهداً ذا أحوال وكرامات ونسك وتواضع؛ قال ابن قاضي شهبة إليه يرجع عامة الفقهاء من أصحابنا في هذه الأعصار في غالب الأقاليم والأمصار ولقد برز فيه على كثير ممن تقدمه وحاز قصب السبق، وقال ابن الصلاح أظن أني لم أر في بلاد العجم مثله؛ صنف «العزيز» شرح الوجيز في بضعة عشر مجلداً قال النووي لم يصنف في مذهب الشافعي ما يحصل لك مجموع ما ذكره أكمل منه، وصنف شرحاً لمسند الشافعي وأسمعه؛ وقيل إنه لم يجد زيتاً للمطالعة في قرية بات بها فتألم فأضاء له عرق كرمة فجلس يطالع ويكتب عليه؛ توفي سنة ثلاث وعشرين وستمائة بقزوين وعمره نحو ست وستين سنة {cite:shadharat-dhahab p. 108-109}."
  en: "Imam al-Din Abd al-Karim al-Rafi'i of Qazvin — the Shafi'i whose al-Aziz commentary on al-Wajiz in a dozen-odd volumes drew al-Nawawi's verdict that nothing in the school surpassed it; Ibn al-Salah thought he had seen his like nowhere in the Persian lands; a saintly man of karamat who, finding no lamp-oil in a village, studied by the light of a vine-branch; died at Qazvin in 623 at about sixty-six {cite:shadharat-dhahab p. 108-109}."
  fr: "L'Imam al-Din Abd al-Karim al-Rafi'i de Qazvin - le Shafi'i dont le commentaire d'al-Aziz sur al-Wajiz dans une douzaine de volumes a attiré le verdict d'al-Nawawi selon lequel rien dans l'école ne l'a dépassé ; Ibn al-Salah pensait qu'il n'avait vu nulle part le sien dans les terres perses ; un saint homme de karamat qui, ne trouvant pas d'huile de lampe dans un village, étudiait à la lumière d'une branche de vigne ; est mort à Qazvin en 623 à environ soixante-six ans {cite:shadharat-dhahab p. 108-109}."
  es: "Imam al-Din Abd al-Karim al-Rafi'i de Qazvin — el shafi'í cuyo comentario al-Aziz sobre al-Wajiz en una docena de volúmenes provocó el veredicto de al-Nawawi de que nada en la escuela lo superaba; Ibn al-Salah pensó que no había visto a nadie igual en ninguna parte de las tierras persas; un hombre santo de karamat que, al no encontrar aceite para lámparas en un pueblo, estudió a la luz de una rama de vid; murió en Qazvin en 623 a la edad de unos sesenta y seis años {cite:shadharat-dhahab p. 108-109}."
  ur: "قزوین کے امام الدین عبد الکریم الرفاعی - وہ شافعی جن کی العزیز تفسیر الواجیز پر درجن بھر مختلف جلدوں میں لکھ کر النووی کے فیصلے کو متوجہ کرتی ہے کہ مکتب کی کوئی چیز اس سے آگے نہیں ہے۔ ابن الصلاح کا خیال تھا کہ اس نے فارس کی سرزمین میں کہیں بھی ایسا نہیں دیکھا۔ ایک صاحبِ کرامت جس کو گائوں میں چراغ کا تیل نہ ملا، انگور کی شاخ کی روشنی سے مطالعہ کیا۔ قزوین میں 623 میں تقریباً چھیاسٹھ میں وفات پائی۔ 108-109}۔"
