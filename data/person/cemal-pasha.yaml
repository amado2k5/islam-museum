summary:
  ar: "قائد عسكري وسياسي عثماني، أحد «الباشوات الثلاثة» في جمعية الاتحاد والترقي. كان واليًا على بغداد، ثم ناظرًا للبحرية من 1914 إلى 1918 وقائدًا للجيش الرابع في سوريا وفلسطين، وعُرف في سوريا بألقاب قاسية لشنقه القوميين العرب في دمشق وبيروت. حُكم عليه غيابيًا بالإعدام، واغتاله أعضاء الاتحاد الثوري الأرمني في تبليسي سنة 1922، ودُفن في أرضروم."
  en: "Ottoman military commander and politician, one of the 'Three Pashas' of the Committee of Union and Progress. He was governor of Baghdad, then Minister of the Navy from 1914 to 1918 and commander of the Fourth Army in Syria and Palestine, where he became known by harsh bynames for the hangings of Arab nationalists at Damascus and Beirut. Sentenced to death in absentia, he was assassinated by Armenian Revolutionary Federation members at Tbilisi in 1922 and buried at Erzurum."
  ur: "عثمانی فوجی کمانڈر اور سیاست دان، جمعیتِ اتحاد و ترقی کے «تین پاشاؤں» میں سے ایک۔ وہ بغداد کے گورنر رہے، پھر 1914 سے 1918 تک وزیرِ بحریہ اور شام و فلسطین میں چوتھی فوج کے کمانڈر، جہاں دمشق و بیروت میں عرب قوم پرستوں کی پھانسیوں کی وجہ سے سخت القاب سے مشہور ہوئے۔ غیر حاضری میں سزائے موت پانے کے بعد 1922 میں تبلیسی میں آرمینی انقلابی فیڈریشن کے ارکان کے ہاتھوں قتل ہوئے اور ارض روم میں دفن ہوئے۔"
