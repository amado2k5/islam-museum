summary:
  ar: "حمدان بن حمدون بن الحارث بن منصور بن لقمان جد أبي محمد الحسن بن عبد الله الملقب بناصر الدولة، تحصن في القلعة المعروفة بالصوارة نحو عين الزعفران وقد كان أنفق عليها أموالاً جليلة فنزل عليها المعتضد وأخربها، واستأمن ولده الحسين بن حمدان ومن كان معه إلى المعتضد {cite:muruj-al-dhahab p. 609-610}."
  en: "Progenitor of the Hamdanids, besieged by al-Mu'tadid in his costly fortress al-Sawwara near 'Ayn al-Za'faran {cite:muruj-al-dhahab p. 609-610}. In 281 al-Mu'tadid marched on him for leaning toward the Kharijite Harun al-Shari; he fortified in his castles while the caliph took Mardin's castle himself and had it demolished {cite:muntazam-ibn-al-jawzi p. 147}."
  es: "Progenitor de los Hamdánidas, asediado por al-Mu'tadid en su costosa fortaleza al-Sawwara cerca de 'Ayn al-Za'faran {cite:muruj-al-dhahab p. 609-610}. En 281, al-Mu'tadid marchó contra él por inclinarse hacia el jariyí Harun al-Shari; se fortificó en sus castillos mientras el califa tomó personalmente el castillo de Mardin y lo mandó demoler {cite:muntazam-ibn-al-jawzi p. 147}."
  fr: "Ancêtre des Hamdanides, il fut assiégé par al-Mu'tadid dans sa coûteuse forteresse d'al-Sawwara, près d'Ayn al-Za'faran (voir Muruj al-Dhahab, p. 609-610). En 281, al-Mu'tadid marcha contre lui pour son soutien au Kharijite Harun al-Shari; il se retrancha dans ses châteaux tandis que le calife s'empara lui-même du château de Mardin et le fit démolir (voir Muntazam ibn al-Jawzi, p. 147)."
  ur: "ہمدانیوں کے پیشوا، عین الظفران کے قریب اپنے مہنگے قلعے السوارہ میں المتدید نے محاصرہ کر لیا۔ 609-610}۔ 281 میں المتدید نے خارجی ہارون الشریع کی طرف جھکاؤ کی وجہ سے اس پر حملہ کیا۔ اس نے اپنے قلعوں میں قلعہ بندی کی جب کہ خلیفہ نے ماردین کا قلعہ خود لے لیا اور اسے منہدم کر دیا۔ 147}۔"
