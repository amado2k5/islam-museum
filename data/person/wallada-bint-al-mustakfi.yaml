label: { ar: "ولادة بنت المستكفي" }
summary:
  ar: "ولادة بنت المستكفي بالله محمد بن عبد الرحمن بن عبيد الله بن الناصر؛ كانت واحدة زمانها المشار إليها في أوانها حسنة المحاضرة مشكورة المذاكرة، كتبت بالذهب على طرازها الأيمن «أنا والله أصلح للمعالي وأمشي مشيني وأتيه تيها» وعلى الأيسر «وأمكن عاشقي من صحن خدي وأعطي قبلتي من يشتهيها»، وكانت مع ذلك مشهورة بالصيانة والعفاف، وفيها خلع ابن زيدون عذاره، ولما ظهر لها أن ابن زيدون مال إلى جاريتها السوداء بديعة المغنى كتبت إليه «لو كنت تنصف في الهوى ما بيننا لم تهو جاريتي ولم تتخير» ولقبته بالمسدس {cite:nafh-tib-maqqari p. 209-210}."
  en: "Wallada bint al-Mustakfi, Umayyad princess and famed salon poetess who had her bold couplets embroidered in gold on her sleeve hems; Ibn Zaydun's beloved until she lampooned him as al-Musaddas for courting her black songstress {cite:nafh-tib-maqqari p. 209-210}."
