id: person/wallada-bint-al-mustakfi
class: person
label: { ar: "ولادة بنت المستكفي" }
summary:
  ar: "ولادة بنت المستكفي بالله محمد بن عبد الرحمن بن عبيد الله بن الناصر؛ كانت واحدة زمانها المشار إليها في أوانها حسنة المحاضرة مشكورة المذاكرة، كتبت بالذهب على طرازها الأيمن «أنا والله أصلح للمعالي وأمشي مشيني وأتيه تيها» وعلى الأيسر «وأمكن عاشقي من صحن خدي وأعطي قبلتي من يشتهيها»، وكانت مع ذلك مشهورة بالصيانة والعفاف، وفيها خلع ابن زيدون عذاره، ولما ظهر لها أن ابن زيدون مال إلى جاريتها السوداء بديعة المغنى كتبت إليه «لو كنت تنصف في الهوى ما بيننا لم تهو جاريتي ولم تتخير» ولقبته بالمسدس {cite:nafh-tib-maqqari p. 209-210}."
  en: "Wallada bint al-Mustakfi, Umayyad princess and famed salon poetess who had her bold couplets embroidered in gold on her sleeve hems; Ibn Zaydun's beloved until she lampooned him as al-Musaddas for courting her black songstress {cite:nafh-tib-maqqari p. 209-210}."
  es: "Wallada bint al-Mustakfi, princesa omeya y famosa poetisa de salón que hacía bordar en oro sus audaces coplas en los dobladillos de sus mangas; amada de Ibn Zaydun hasta que ella lo satirizó llamándolo al-Musaddas por cortejar a su cantora negra {cite:nafh-tib-maqqari p. 209-210}."
  fr: "Wallada bint al-Mustakfi, princesse omeyyade et célèbre poétesse de salon qui faisait broder ses couplets audacieux en or sur les ourlets de ses manches; la bien-aimée d'Ibn Zaydun jusqu'à ce qu'elle le ridiculise en l'appelant al-Musaddas pour avoir courtisé sa chanteuse noire {cite:nafh-tib-maqqari p. 209-210}."
  ur: "والدہ بنت المستقفی، اموی شہزادی اور مشہور سیلون شاعرہ جس نے اپنی آستین کے ہیمز پر اپنے دلیرانہ دوہے سونے کی کڑھائی کی تھی۔ ابن زیدون کی محبوبہ جب تک کہ اس نے اسے اپنی سیاہ فام گلوکارہ سے شادی کرنے پر المصدّس کے نام سے موسوم نہ کیا۔ 209-210}۔"
  tr: "El-Mustakfi Billah Muhammed bin Abdülrahman ibn Übeyd Allah ibn el-Nasir'in kızının doğumu; döneminin kadınlarından biriydi, iyi dersleriyle tanınan ve çalışmalarıyla takdir edilen bir kızdı. Altın yazısıyla doğru üslubuna şöyle yazdı: 'Tanrı aşkına, soyluya layıkım, yolumu yürü ve vahşi bir yerde ona gel,', ve solda, 'Sevgilimi yanağımın tabağından al, kibilimi isteyen kişiye ver.' Yine de bakımıyla ve iffetiyle ünlüydü ve İbn Zeydun bu evlilikte bakireliğini aldı. İbn Zeydun'un siyah köle kızı Badi'ah al-Mughna'ya yatkın olduğunu öğrendiğinde, ona şöyle yazdı: 'Eğer bizim aşkımızda olsaydın, kölem sinirlenmez ya da seçmezdi,' ve ona tabanca lakabını taktı {atıf:nafh-tib-maqqari, s. 209-210}."
  id: "Kelahiran putri al-Mustakfi Billah Muhammad ibn Abd al-Rahman ibn Ubayd Allah ibn al-Nasir; dia adalah salah satu wanita pada zamannya, dikenal karena ceramah yang baik dan dihargai karena kepelajarinya. Dia menulis dengan emas di gaya kanannya: 'Demi Tuhan, aku layak untuk yang mulia, berjalanlah jalanku, dan datanglah kepadanya di tempat liar,' dan di sebelah kiri, 'Dan bebaskan kekasihku dari pipiku, dan berikan qibla milikku kepada siapa pun yang menginginkannya.' Namun demikian, dia terkenal karena kehati-hatiannya dan kesuciannya, dan dalam itu Ibn Zaydun menghilangkan keperawanannya. Ketika dia mengetahui bahwa Ibn Zaydun condong pada budak perempuannya yang berkulit hitam, Badi'ah al-Mughna, dia menulis kepadanya, 'Jika kamu adil dalam cinta kami, hambaku tidak akan kehilangan kesabaran atau memilih,' dan dia menamainya pistol {cite:nafh-tib-maqqari, hlm. 209-210}."
