label: { ar: "سعيد بن عثمان بن عفان", en: "Sa'id ibn Uthman ibn Affan", es: "Sa'id ibn Uthman ibn Affan", fr: "Sa'id ibn Uthman ibn Affan", ur: "سعید بن عثمان بن عفان" }
summary:
  ar: "سعيد بن عثمان بن عفان؛ ولاه معاوية خراسان فقطع النهر بجنده أول من قطعه به ومعه رفيع أبو العالية فنكثت خاتون وأقبل أهل السغد والترك وكش ونسف في مائة ألف وعشرين ألفاً فانكسروا ببخارا فأعطته الرهن ودخل مدينتها ثم غزا سمرقند فحلف أن لا يبرح أو يفتحها ويرمي قهندزها فقاتل أهلها ثلاثة أيام ففقئت عينه فصالحهم على سبعمائة ألف درهم ورهن من أبناء عظمائهم وأقام على الترمذ حتى فتحها صلحاً."
  en: "Sa'id ibn Uthman ibn Affan; Mu'awiya's governor of Khurasan — first to cross the river with his whole army. At Bukhara the Khatun's hundred-twenty-thousand broke and she renewed peace on hostages; at Samarqand he swore not to stir till it opened, lost an eye in three days' fighting, and truced at seven hundred thousand plus noble hostages, entering and leaving by its gates; he sat on Tirmidh till it truced too."
  es: "Sa'id ibn Uthman ibn Affan, gobernador de Jorasán bajo el mando de Mu'awiya, fue el primero en cruzar el río con todo su ejército. En Bujará, los ciento veinte mil hombres de la Khatun se rindieron y ella renovó la paz a cambio de rehenes; en Samarcanda juró no moverse hasta que se abriera la tregua, perdió un ojo en tres días de combates y firmó una tregua con más de setecientos mil rehenes nobles, entrando y saliendo por sus puertas; permaneció en Tirmidhi hasta que también firmó una tregua."
  fr: "Sa'id ibn Uthman ibn Affan, gouverneur du Khorasan sous Mu'awiya, fut le premier à traverser le Nil avec toute son armée. À Boukhara, les 120 000 hommes de la Khatoun cédèrent et elle renouvela la paix contre des otages. À Samarcande, il jura de ne pas bouger tant que la ville ne serait pas ouverte, perdit un œil en trois jours de combats et conclut une trêve contre plus de 700 000 nobles otages, entrant et sortant par ses portes. Il occupa Tirmidh jusqu'à ce que cette ville signe également une trêve."
  ur: "سعید بن عثمان بن عفان؛ معاویہ کا خراسان کا گورنر - سب سے پہلے اپنی پوری فوج کے ساتھ دریا پار کرنے کے لیے۔ بخارا میں خاتون کا ایک لاکھ بیس ہزار ٹوٹ گیا اور اس نے یرغمالیوں پر امن بحال کیا۔ سمرقند میں اس نے قسم کھائی کہ اس کے کھلنے تک نہ ہلائیں گے، تین دن کی لڑائی میں ایک آنکھ ضائع ہوئی، اور اس کے دروازوں سے داخل ہوتے اور نکلتے ہوئے سات لاکھ سے زیادہ عظیم یرغمالیوں کو شکست دی۔ وہ ترمذ پر بیٹھ گیا یہاں تک کہ وہ بھی ٹھہر گیا۔"
  tr: "Sa'id ibn Osman bin Affan; Muaviye onu Horasan'ın valisi olarak atadı. Nehri ilk geçen askeri Rafi' Abu al-'Aliyah ile birlikte geçti. Hatun sözünü bozdu, Sogd ve Türk halkı geldi, o da Buhara'da ezildi ve yok edildi. Ona yemin etti ve o da şehrine girdi. Sonra Semerkant'ı işgal etti, ne gitmeyeceğine, ne de fethetmeyeceğine ve Kadendez'ini devireceğine yemin etti. Üç gün boyunca halkıyla savaştı ve gözü oyuldu. Onlarla yedi yüz bin dirhem için barıştı, soylularının oğullarına rehin verdi ve barışana kadar Tirmidh'te kaldı."
  id: "Sa'id ibn Uthman ibn Affan; Muawiya mengangkatnya sebagai gubernur Khorasan. Ia menyeberangi sungai bersama prajuritnya, yang pertama menyeberangi bersamanya, Rafi' Abu al-'Aliyah. Khatun melanggar janjinya, dan rakyat Sogd serta Turki datang, dan ia dihancurkan serta dihancurkan di Bukhara. Ia memberikan janji kepada Khatun kepadanya, dan ia memasuki kotanya. Kemudian ia menyerbu Samarkand, bersumpah untuk tidak pergi atau menaklukkannya dan membuang Qahandaz-nya. Ia berperang melawan rakyatnya selama tiga hari, dan matanya tercabut. Ia berdamai dengan mereka dengan tujuh ratus ribu dirham, menggadaikan kepada putra-putra bangsawan mereka, dan tinggal di Tirmidh sampai kota itu berdamai."
