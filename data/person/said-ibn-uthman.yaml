label: { ar: "سعيد بن عثمان بن عفان", en: "Sa'id ibn Uthman ibn Affan" }
summary:
  ar: "سعيد بن عثمان بن عفان؛ ولاه معاوية خراسان فقطع النهر بجنده أول من قطعه به ومعه رفيع أبو العالية فنكثت خاتون وأقبل أهل السغد والترك وكش ونسف في مائة ألف وعشرين ألفاً فانكسروا ببخارا فأعطته الرهن ودخل مدينتها ثم غزا سمرقند فحلف أن لا يبرح أو يفتحها ويرمي قهندزها فقاتل أهلها ثلاثة أيام ففقئت عينه فصالحهم على سبعمائة ألف درهم ورهن من أبناء عظمائهم وأقام على الترمذ حتى فتحها صلحاً."
  en: "Sa'id ibn Uthman ibn Affan; Mu'awiya's governor of Khurasan — first to cross the river with his whole army. At Bukhara the Khatun's hundred-twenty-thousand broke and she renewed peace on hostages; at Samarqand he swore not to stir till it opened, lost an eye in three days' fighting, and truced at seven hundred thousand plus noble hostages, entering and leaving by its gates; he sat on Tirmidh till it truced too."
