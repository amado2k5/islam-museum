summary:
  ar: "أبو بكر أيوب بن أبي تميمة السختياني، واسم أبي تميمة كيسان، من سبي كابل، مولى لعنزة وقيل غير ذلك، كان يبيع الجلود بالبصرة فقيل له السختياني؛ أحد أئمة الجماعة في الحديث والأمانة، ومن شيوخ مالك، مات سنة إحدى وثلاثين ومائة {cite:tamhid-furqan-2017-v1 p. 597} {cite:tamhid-furqan-2017-v1 p. 600} {cite:tabaqat-fuqaha-abbas-1981 p. 47}. قال الحسن: أيوب سيد شباب أهل البصرة، وقال شعبة: أيوب سيد الفقهاء، وأخذ عنه مالك وسفيان الثوري وغيرهما {cite:tabaqat-fuqaha-abbas-1981 p. 47}."
  en: "Abu Bakr Ayyub b. Abi Tamima al-Sakhtiyani — Abu Tamima's name was Kaysan, taken captive at Kabul — a client of 'Anaza (or of others, by other reports) who sold leather in Basra, hence the name al-Sakhtiyani; one of the imams of the community in hadith and trustworthiness and a teacher of Malik, he died in 131 AH {cite:tamhid-furqan-2017-v1 p. 597} {cite:tamhid-furqan-2017-v1 p. 600} {cite:tabaqat-fuqaha-abbas-1981 p. 47}. Al-Hasan called him the master of Basra's young men, Shu'ba the master of the jurists; Malik and Sufyan al-Thawri took from him {cite:tabaqat-fuqaha-abbas-1981 p. 47}."
  ur: "ابو بکر ایوب بن ابی تمیمہ سختیانی — ابو تمیمہ کا نام کیسان تھا، کابل کے قیدیوں میں سے — عنزہ کے مولیٰ (اور دوسری روایات میں کسی اور کے)، بصرہ میں چمڑا بیچتے تھے اس لیے سختیانی کہلائے؛ حدیث اور امانت میں جماعت کے ائمہ میں سے اور امام مالک کے شیخ، 131ھ میں فوت ہوئے {cite:tamhid-furqan-2017-v1 p. 597} {cite:tamhid-furqan-2017-v1 p. 600} {cite:tabaqat-fuqaha-abbas-1981 p. 47}۔ حسن نے انہیں بصرہ کے نوجوانوں کا سردار اور شعبہ نے فقہاء کا سردار کہا؛ مالک اور سفیان ثوری نے ان سے علم لیا {cite:tabaqat-fuqaha-abbas-1981 p. 47}۔"
