id: person/abdallah-ibn-al-hasan
class: person
label: { ar: "عبد الله بن الحسن", en: "Abdallah ibn al-Hasan", fr: "Abdallah ibn al-Hasan", es: "Abdallah ibn al-Hasan", ur: "عبداللہ بن الحسن" }
summary:
  ar: "عبد الله بن حسن بن حسن بن علي بن أبي طالب أبو محمد النفس الزكية وإبراهيم؛ عند البلاذري حبسه المنصور بالمدينة الهاشمية بالكوفة بسبب ابنيه وبها قبره. وعند المسعودي قبل كتاب أبي سلمة يدعوه إلى الدعوة وابتهج به وركب حماراً إلى جعفر الصادق فلما نازعه وقال إنما يريد القوم ابني محمداً لأنه مهدي هذه الأمة قال له جعفر ما هو مهديها ولئن شهر سيفه ليقتلن، فانصرف مغضباً {cite:muruj-al-dhahab p. 240-241}، وقبض عليه المنصور سنة أربع وأربعين ومائة في منصرفه من الحج فحمل من المدينة إلى الربذة ثم الكوفة مع أهل بيته فحبسوا في سرداب تحت الأرض لا يفرقون بين ضياء النهار وسواد الليل وكانوا يجزئون القرآن خمسة أجزاء يصلون على فراغ كل واحد من حزبه، وماتوا به حتى أتى برأس ابنه إبراهيم فوضعه في حجره وقال للربيع قل لصاحبك قد مضى من بؤسنا أيام ومن نعيمك أيام والملتقى يوم القيامة، فما رأى المنصور قط أشد انكساراً منه حين بلغته {cite:muruj-al-dhahab p. 287-288}"
  en: "Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, father of Muhammad al-Nafs al-Zakiyya and Ibrahim; in al-Baladhuri al-Mansur imprisoned him at the Kufa Hashimiyya over his sons — his grave is there."
  fr: "Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, père de Muhammad al-Nafs al-Zakiyya et d'Ibrahim ; chez al-Baladhuri, al-Mansur l'emprisonna à la Hashimiyya de Koufa à cause de ses fils — sa tombe s'y trouve."
  es: "Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, padre de Muhammad al-Nafs al-Zakiyya e Ibrahim; en al-Baladhuri al-Mansur lo encarceló en Kufa Hashimiyya por sus hijos; su tumba está allí."
  ur: "عبداللہ بن الحسن بن الحسن ابن علی ابن ابی طالب، محمد النفس الزکیہ اور ابراہیم کے والد؛ البلادوری میں المنصور نے اسے کوفہ ہاشمیہ میں اس کے بیٹوں پر قید کر دیا- اس کی قبر وہیں ہے۔"
  tr: "Abdullah ibn Hasan ibn Hasan ibn Ali ibn Abi Talib, Ebu Muhammed el-Nefs el-Zakiyye ve İbrahim; el-Baladhuri'ye göre, el-Mansur onu iki oğlu yüzünden Haşimi şehri Kufe'de hapsetti ve mezarı oradadır. El-Mas'udi'ye göre, Ebu Salama'nın onu davet eden mektubundan önce sevinmiş ve bir eşeğe binerek Cafer el-Sadık'ın yanına gitmiştir. Onunla tartışıp, \"İnsanlar sadece oğlum Muhammed'i istiyor çünkü o bu ümmetin Mehdisidir\" dediğinde, Cafer ona, \"O onların Mehdisi değildir ve kılıcını çekerse öldürülecektir\" demiştir. Bunun üzerine öfkeyle oradan ayrılmıştır. 240-241} ve el-Mansur onu 144 yılında Hac dönüşünde tutuklamıştır. Ailesiyle birlikte Medine'den El-Rabadha'ya, oradan da Kufe'ye götürülmüştür. Yeraltı bir mahzende hapsedilmişlerdi, gündüzü ve geceyi birbirinden ayırt edemiyorlardı. Kur'an'ı beş parçaya bölüyor ve her bir bölümü bitirdikten sonra dua ediyorlardı. Oğlu İbrahim'in başı kendisine getirilene kadar bu halde öldüler. İbrahim, İbrahim'in başını kucağına koydu ve Rabi'ye şöyle dedi: \"Arkadaşına söyle ki, bizim çektiğimiz sıkıntılı günler geçti, senin mutluluk günlerin geçti ve kıyamet gününde buluşacağız.\" Mansur, onu bu sözleri duyduğunda hiç bu kadar yıkılmış görmemişti. {Kaynak: Muruj-al-Dhahab s. 287-288}"
  id: "Abdullah ibn Hasan ibn Hasan ibn Ali ibn Abi Talib, Abu Muhammad al-Nafs al-Zakiyya dan Ibrahim; menurut al-Baladhuri, al-Mansur memenjarakannya di kota Hashemite Kufa karena kedua putranya, dan makamnya ada di sana. Menurut al-Mas'udi, sebelum surat Abu Salama mengundangnya untuk ikut dalam seruan tersebut, ia bergembira dan menunggang keledai menuju Ja'far al-Sadiq. Ketika ia berdebat dengannya dan berkata, \"Orang-orang hanya menginginkan putraku Muhammad karena dia adalah Mahdi umat ini,\" Ja'far berkata kepadanya, \"Dia bukan Mahdi, dan jika dia menghunus pedangnya, dia akan dibunuh.\" Maka ia pergi dengan marah. 240-241}, dan Al-Mansur menangkapnya pada tahun seratus empat puluh empat ketika ia kembali dari Haji. Ia dibawa dari Madinah ke Al-Rabadha, kemudian ke Kufa bersama keluarganya. Mereka dipenjara di ruang bawah tanah, tidak dapat membedakan antara terang siang dan gelap malam. Mereka membagi Al-Qur'an menjadi lima bagian dan berdoa setelah menyelesaikan setiap bagian mereka. Mereka meninggal dalam keadaan ini sampai kepala putranya, Ibrahim, dibawa kepadanya. Dia meletakkannya di pangkuannya dan berkata kepada Al-Rabi': \"Katakan kepada temanmu bahwa hari-hari penderitaan kami telah berlalu, dan hari-hari kebahagiaanmu telah berlalu, dan kita akan bertemu pada Hari Kiamat.\" Al-Mansur tidak pernah melihatnya lebih hancur daripada ketika dia mendengar {cite:muruj-al-dhahab p. 287-288}"
