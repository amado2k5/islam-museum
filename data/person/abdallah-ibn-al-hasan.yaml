label: { ar: "عبد الله بن الحسن", en: "Abdallah ibn al-Hasan" }
summary:
  ar: "عبد الله بن حسن بن حسن بن علي بن أبي طالب أبو محمد النفس الزكية وإبراهيم؛ عند البلاذري حبسه المنصور بالمدينة الهاشمية بالكوفة بسبب ابنيه وبها قبره.، وعند المسعودي قبل كتاب أبي سلمة يدعوه إلى الدعوة وابتهج به وركب حماراً إلى جعفر الصادق فلما نازعه وقال إنما يريد القوم ابني محمداً لأنه مهدي هذه الأمة قال له جعفر ما هو مهديها ولئن شهر سيفه ليقتلن، فانصرف مغضباً {cite:muruj-al-dhahab p. 240-241}"
  en: "Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, father of Muhammad al-Nafs al-Zakiyya and Ibrahim; in al-Baladhuri al-Mansur imprisoned him at the Kufa Hashimiyya over his sons — his grave is there."
