id: person/abdallah-ibn-al-hasan
class: person
label: { ar: "عبد الله بن الحسن", en: "Abdallah ibn al-Hasan" }
summary:
  ar: "عبد الله بن حسن بن حسن بن علي بن أبي طالب أبو محمد النفس الزكية وإبراهيم؛ عند البلاذري حبسه المنصور بالمدينة الهاشمية بالكوفة بسبب ابنيه وبها قبره. وعند المسعودي قبل كتاب أبي سلمة يدعوه إلى الدعوة وابتهج به وركب حماراً إلى جعفر الصادق فلما نازعه وقال إنما يريد القوم ابني محمداً لأنه مهدي هذه الأمة قال له جعفر ما هو مهديها ولئن شهر سيفه ليقتلن، فانصرف مغضباً {cite:muruj-al-dhahab p. 240-241}، وقبض عليه المنصور سنة أربع وأربعين ومائة في منصرفه من الحج فحمل من المدينة إلى الربذة ثم الكوفة مع أهل بيته فحبسوا في سرداب تحت الأرض لا يفرقون بين ضياء النهار وسواد الليل وكانوا يجزئون القرآن خمسة أجزاء يصلون على فراغ كل واحد من حزبه، وماتوا به حتى أتى برأس ابنه إبراهيم فوضعه في حجره وقال للربيع قل لصاحبك قد مضى من بؤسنا أيام ومن نعيمك أيام والملتقى يوم القيامة، فما رأى المنصور قط أشد انكساراً منه حين بلغته {cite:muruj-al-dhahab p. 287-288}"
  en: "Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, father of Muhammad al-Nafs al-Zakiyya and Ibrahim; in al-Baladhuri al-Mansur imprisoned him at the Kufa Hashimiyya over his sons — his grave is there."
