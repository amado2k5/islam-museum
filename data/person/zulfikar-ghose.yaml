summary:
  ar: "ذو الفقار غوش (1935–2022) شاعر وروائي وكاتب مقالات باكستاني المولد. وُلد في سيالكوت ونشأ في بومباي، وهاجر مع أسرته إلى إنجلترا بعد تقسيم الهند، وتخرج في جامعة كيل سنة 1959، ودرّس في لندن قبل أن ينتقل سنة 1969 إلى جامعة تكساس في أوستن، حيث درّس الأدب الإنجليزي والكتابة الإبداعية حتى تقاعده أستاذًا فخريًا سنة 2007. من كتبه سيرته الذاتية «Confessions of a Native-Alien» (1965) و«The Murder of Aziz Khan» (1967) وثلاثية «The Incredible Brazilian» (1972–1978) و«The Triple Mirror of the Self» (1992)."
  en: "Zulfikar Ghose (1935–2022) was a Pakistani-born poet, novelist and essayist. Born in Sialkot and raised in Bombay, he emigrated with his family to England after Partition, graduated from Keele University in 1959, and taught in London before moving in 1969 to the University of Texas at Austin, where he taught English literature and creative writing until his retirement as professor emeritus in 2007. His books include the autobiography Confessions of a Native-Alien (1965), The Murder of Aziz Khan (1967), The Incredible Brazilian trilogy (1972–1978) and The Triple Mirror of the Self (1992)."
  ur: "ذوالفقار گھوش (1935–2022) پاکستانی نژاد شاعر، ناول نگار اور مضمون نگار تھے۔ سیالکوٹ میں پیدا ہوئے، بمبئی میں پلے بڑھے، تقسیمِ ہند کے بعد خاندان کے ساتھ انگلستان ہجرت کی، 1959 میں کیل یونیورسٹی سے فارغ التحصیل ہوئے، اور 1969 میں یونیورسٹی آف ٹیکساس، آسٹن منتقل ہو گئے جہاں 2007 میں پروفیسر ایمریٹس کی حیثیت سے سبکدوشی تک انگریزی ادب اور تخلیقی تحریر پڑھاتے رہے۔ ان کی کتابوں میں خودنوشت «Confessions of a Native-Alien» (1965)، «The Murder of Aziz Khan» (1967)، «The Incredible Brazilian» سہ جلدی سلسلہ (1972–1978) اور «The Triple Mirror of the Self» (1992) شامل ہیں۔"

