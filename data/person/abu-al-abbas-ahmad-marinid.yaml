id: person/abu-al-abbas-ahmad-marinid
class: person
label:
  ar: السلطان أبو العباس أحمد المريني المستعين
  en: Sultan Abu al-Abbas Ahmad al-Musta'in al-Marini
summary:
  ar: "أبو العباس أحمد بن أبي سالم المريني الملقب بالمستعين؛ اجتمع بابن عمه الأمير عبد الرحمن بوادي النجا وحلفا على اتصال اليد، فنهض بمعسكره إلى البلد الجديد وحاصره من كدية العرائس حتى دخله سابع المحرم سنة 776هـ، وارتحل عبد الرحمن إلى مراكش فاستقل بها، وعقدت بينهما السلم وجعل التخم بينهما أزمور، فاستوزر محمد بن عثمان واستحكمت المداخلة بينه وبين سلطان الأندلس ابن الأحمر، ووقع في أيامه مقتل ابن الخطيب بفاس."
  en: "Abu al-Abbas Ahmad ibn Abi Salim al-Marini, called al-Musta'in; meeting his cousin the amir Abd al-Rahman at Wadi al-Naja they swore to join hands — he marched on the New City and besieged it from Kadiyat al-Ara'is until he entered it on 7 Muharram 776 AH, while Abd al-Rahman held Marrakesh, the truce between them fixing Azmour as the boundary; Muhammad ibn Uthman served as vizier, his ties with Granada's Ibn al-Ahmar tightened, and in his days Ibn al-Khatib was killed at Fez."
