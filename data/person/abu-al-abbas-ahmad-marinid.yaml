id: person/abu-al-abbas-ahmad-marinid
class: person
label:
  ar: السلطان أبو العباس أحمد المريني المستعين
  en: Sultan Abu al-Abbas Ahmad al-Musta'in al-Marini
  fr: "Le sultan Abu al-Abbas Ahmad al-Musta'in al-Marini"
  es: "Sultan Abu al-Abbas Ahmad al-Musta'in al-Marini"
  ur: "سلطان ابو العباس احمد المستعین المرینی۔"
summary:
  ar: "أبو العباس أحمد بن أبي سالم المريني الملقب بالمستعين؛ اجتمع بابن عمه الأمير عبد الرحمن بوادي النجا وحلفا على اتصال اليد، فنهض بمعسكره إلى البلد الجديد وحاصره من كدية العرائس حتى دخله سابع المحرم سنة 776هـ، وارتحل عبد الرحمن إلى مراكش فاستقل بها، وعقدت بينهما السلم وجعل التخم بينهما أزمور، فاستوزر محمد بن عثمان واستحكمت المداخلة بينه وبين سلطان الأندلس ابن الأحمر، ووقع في أيامه مقتل ابن الخطيب بفاس."
  en: "Abu al-Abbas Ahmad ibn Abi Salim al-Marini, called al-Musta'in; meeting his cousin the amir Abd al-Rahman at Wadi al-Naja they swore to join hands — he marched on the New City and besieged it from Kadiyat al-Ara'is until he entered it on 7 Muharram 776 AH, while Abd al-Rahman held Marrakesh, the truce between them fixing Azmour as the boundary; Muhammad ibn Uthman served as vizier, his ties with Granada's Ibn al-Ahmar tightened, and in his days Ibn al-Khatib was killed at Fez."
  fr: "Abu al-Abbas Ahmad ibn Abi Salim al-Marini, dit al-Musta'in ; rencontrant son cousin l'émir Abd al-Rahman à Wadi al-Naja, ils jurèrent d'unir leurs forces — il marcha sur la Ville neuve et l'assiégea depuis Kadiyat al-Ara'is jusqu'à y entrer le 7 Muharram 776 H, tandis qu'Abd al-Rahman tenait Marrakech, la trêve entre eux fixant Azemmour comme frontière ; Muhammad ibn Uthman fut son vizir, ses liens avec Ibn al-Ahmar de Grenade se resserrèrent, et sous son règne Ibn al-Khatib fut tué à Fès."
  es: "Abu al-Abbas Ahmad ibn Abi Salim al-Marini, llamado al-Musta'in, se reunió con su primo, el emir Abd al-Rahman, en Wadi al-Naja, y juraron unirse. Él marchó sobre la Ciudad Nueva y la asedió desde Kadiyat al-Ara'is hasta que entró en ella el 7 de Muharram del año 776 de la Hégira, mientras que Abd al-Rahman controlaba Marrakech. La tregua entre ellos fijó Azmour como frontera. Muhammad ibn Uthman fue visir, sus lazos con Ibn al-Ahmar de Granada se estrecharon y, en su época, Ibn al-Khatib fue asesinado en Fez."
  ur: "ابو العباس احمد بن ابی سالم المرینی المستعین کہلاتا ہے۔ وادی النجاء میں اپنے چچا زاد بھائی امیر عبدالرحمٰن سے ملاقات کرتے ہوئے انہوں نے ہاتھ ملانے کی قسم کھائی - اس نے نئے شہر پر چڑھائی کی اور کدیات العرایس سے اس کا محاصرہ کیا یہاں تک کہ وہ 7 محرم 776 ہجری کو اس میں داخل ہوا، جب کہ عبدالرحمٰن نے مراکش پر قبضہ کیا، جو کہ ان کے درمیان طے پانے والی جنگ بندی کے طور پر تھا۔ محمد بن عثمان نے وزیر کے طور پر خدمات انجام دیں، غرناطہ کے ابن الاحمر کے ساتھ اس کے تعلقات سخت ہو گئے، اور ان کے دنوں میں ابن الخطیب کو فیز میں قتل کر دیا گیا۔"
