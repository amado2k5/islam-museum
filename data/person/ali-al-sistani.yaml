summary:
  ar: "علي الحسيني السيستاني ⁦(ولد 1930)⁩ مرجع ديني شيعي إثنا عشري وأعلى مراجع النجف، وُلد في مشهد بإيران واستقر في النجف حيث صار بعد وفاة أستاذه أبي القاسم الخوئي سنة 1992 المرجع الأبرز لمقلدي الشيعة في العراق والعالم. اشتهر بفتاويه التي رسمت مسار العراق بعد 2003، منها فتوى الانتخابات والدستور وفتوى الجهاد الكفائي سنة 2014، وله كتب في الفقه الاستدلالي منها «منهاج الصالحين» و«الفتاوى الميسرة»."
  en: "Ali al-Husseini al-Sistani (born 1930) is an Iranian-born Iraqi Twelver Shia Grand Ayatollah and the senior marja' of Najaf. Settled in the hawza of Najaf, he rose after the death of his teacher Abu al-Qasim al-Khoei in 1992 to become the foremost spiritual authority followed by Shia Muslims in Iraq and beyond. His legal rulings shaped post-2003 Iraq — from elections and the constitution to the 2014 'sufficient jihad' call — and his works include the jurisprudential manuals Minhaj al-Salihin and Al-Fatawa al-Muyassara."
  fr: "Ali al-Husseini al-Sistani (né en 1930) est un chiite irakien d'origine iranienne, grand ayatollah et marja' de Najaf. Installé dans la hawza de Nadjaf, il s’est levé après la mort de son maître Abu al-Qasim al-Khoei en 1992 pour devenir la première autorité spirituelle suivie par les musulmans chiites en Irak et au-delà. Ses décisions juridiques ont façonné l’Irak post-2003 – des élections et de la constitution à l’appel au « djihad suffisant  » de 2014 – et ses travaux comprennent les manuels de jurisprudence Minhaj al-Salihin et Al-Fatawa al-Muyassara."
  ur: "علی الحسینی سیستانی ⁦(پیدائش 1930)⁩ ایرانی مول عراقی شیعہ اثنا عشری Grand Ayatollah اور نجف کے بلند ترین مرجع ہیں۔ نجف کے حوزۂ علمیہ میں مقیم رہے اور اپنے استاد ابوالقاسم الخوئی کی وفات ⁦(1992)⁩ کے بعد عراق اور دنیا بھر کے شیعہ مسلمانوں کے سب سے بڑے روحانی مرجع بن گئے۔ ان کے فتویٰ جاتی فیصلوں نے 2003 کے بعد کے عراق کی سمت متعین کی — انتخابات اور آئین سے لے کر 2014 کی «جهاد کفائی» کی کال تک — اور ان کی تصانیف میں «منہاج الصالحین» اور «الفتاویٰ المیسّرہ» شامل ہیں۔"
