summary:
  ar: "سائق سباقات إماراتي، وُلد في دبي سنة 1985. بطل الإمارات للكارتينغ مرتين؛ شارك في بطولة FIA GT وفورمولا رينو كامبوس الفرنسية قبل أن ينافس في سلسلة سبيدكار في 2008–2009، وحلّ سابعًا سنة 2009 مع صعود منصة التتويج في الجولة الختامية."
  en: "Emirati racing driver, born in Dubai in 1985. A two-time UAE karting champion, he raced in the FIA GT Championship and French Formula Renault Campus before contesting the Speedcar Series in 2008–2009, finishing seventh in 2009 with a podium at the season finale."
  ur: "اماراتی ریسنگ ڈرائیور، جو 1985 میں دبئی میں پیدا ہوئے۔ دو مرتبہ متحدہ عرب امارات کے کارٹنگ چیمپئن؛ انہوں نے FIA GT چیمپئن شپ اور فرانسیسی فارمولا رینو کیمپس میں ریس کی، پھر 2008–2009 میں اسپیڈ کار سیریز میں حصہ لیا اور 2009 میں آخری راؤنڈ میں پوڈیم کے ساتھ ساتویں نمبر پر رہے۔"
  es: "Piloto de carreras emiratí, nacido en Dubái en 1985. Dos veces campeón de karting de los Emiratos Árabes Unidos, compitió en el Campeonato FIA GT y en la Fórmula Renault Campus francesa antes de participar en la Speedcar Series en 2008-2009, terminando séptimo en 2009 con un podio en la última carrera de la temporada."
  fr: "Pilote automobile émirati, né à Dubaï en 1985. Double champion de karting des Émirats arabes unis, il a participé au championnat FIA GT et à la Formule Renault Campus française avant de concourir dans la Speedcar Series en 2008-2009, terminant septième en 2009 avec un podium lors de la finale de la saison."
  tr: "1985 yılında Dubai doğumlu bir Emirlikli yarış pilotu. İki kez BAE karting şampiyonu; FIA GT Şampiyonası ve Fransız Formula Renault Campos'ta yer aldıktan sonra 2008–2009 sezonunda Skidcar serisinde yarıştı ve 2009'da final turunda podyuma çıkarak yedinci oldu."
  id: "Seorang pembalap Emirat, lahir di Dubai pada tahun 1985. Juara karting UAE dua kali; berpartisipasi di FIA GT Championship dan French Formula Renault Campos sebelum berkompetisi di seri Skidcar pada 2008–2009, finis ketujuh pada 2009 saat ia naik podium di putaran final."
