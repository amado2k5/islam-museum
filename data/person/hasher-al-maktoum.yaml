summary:
  ar: "سائق سباقات إماراتي، وُلد في دبي سنة 1985. بطل الإمارات للكارتينغ مرتين؛ شارك في بطولة FIA GT وفورمولا رينو كامبوس الفرنسية قبل أن ينافس في سلسلة سبيدكار في 2008–2009، وحلّ سابعًا سنة 2009 مع صعود منصة التتويج في الجولة الختامية."
  en: "Emirati racing driver, born in Dubai in 1985. A two-time UAE karting champion, he raced in the FIA GT Championship and French Formula Renault Campus before contesting the Speedcar Series in 2008–2009, finishing seventh in 2009 with a podium at the season finale."
