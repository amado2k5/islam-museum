summary:
  ar: صحفية ومذيعة أخبار جزائرية وُلدت سنة 1965؛ من الفريق المؤسس لقناة الجزيرة سنة 1996 ومذيعتها الأولى التي أطلقت البث، وعملت مذيعة أخبار أولى ومقدمة برامج، ونالت جوائز في الإعلام العربي.
  en: Algerian journalist and news anchor born in 1965; a member of Al Jazeera's founding team in 1996 and the presenter who launched its first broadcast, she serves as senior news anchor and has won Arab
    media awards.
  ur: الجزائری صحافہ اور نیوز اینکر جو 1965 میں پیدا ہوئی؛ 1996 میں الجزیرہ کی بانی ٹیم کی رکن اور اس کے پہلے نشریات شروع کرنے والی پیش کنندہ، سینئر نیوز اینکر اور عرب میڈیا انعامات یافتہ۔
  es: "Periodista y presentadora de noticias argelina nacida en 1965; miembro del equipo fundador de Al Jazeera en 1996 y presentadora que realizó su primera emisión, actualmente es presentadora principal de noticias y ha ganado premios de los medios de comunicación árabes."
  fr: "Journaliste et présentatrice algérienne née en 1965; membre de l'équipe fondatrice d'Al Jazeera en 1996 et présentatrice de la première émission, elle est présentatrice vedette et a remporté des prix des médias arabes."
  tr: "1965 doğumlu Cezayirli gazeteci ve haber sunucusu; 1996'da Al Jazeera kanalının kurucu ekibinden ve yayıncılığı başlatan ilk yayıncıydı. Kıdemli haber sunucusu ve program sunucusu olarak çalıştı ve Arap medyasında ödüller aldı."
  id: "Seorang jurnalis dan pembawa berita asal Aljazair yang lahir pada tahun 1965; dari tim pendiri saluran Al Jazeera pada tahun 1996, dan penyiar pertamanya yang meluncurkan dunia penyiaran. Ia bekerja sebagai pembawa berita senior dan presenter program, serta menerima penghargaan di media Arab."
