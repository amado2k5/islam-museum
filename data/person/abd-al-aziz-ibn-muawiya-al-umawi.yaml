summary:
  ar: "أبو خالد القرشي الأموي البصري من ذرية أسيد، قدم بغداد وحدّث بها عن أزهر السمان وأبي عاصم النبيل، روى عنه أبو عمر وابن السماك؛ توفي في ربيع الآخر {cite:muntazam-ibn-al-jawzi p. 185}."
  en: "Abu Khalid the Umayyad Qurashi of Basra, of Usayd's line; he came to Baghdad and transmitted from Azhar al-Samman and Abu 'Asim al-Nabil. He died in Rabi' II {cite:muntazam-ibn-al-jawzi p. 185}."
  fr: "Abu Khalid, qurashite omeyyade de Bassora, de la lignée d'Usayd ; il vint à Bagdad et transmit d'Azhar al-Samman et d'Abu 'Asim al-Nabil. Il mourut en rabi' II {cite:muntazam-ibn-al-jawzi p. 185}."
  es: "Abu Khalid, el Qurashi omeya de Basora, descendiente de Usayd, llegó a Bagdad y transmitió enseñanzas de Azhar al-Samman y Abu 'Asim al-Nabil. Murió en Rabi' II {cite:muntazam-ibn-al-jawzi p. 185}."
  ur: "ابو خالد اموی قریشی بصرہ، اسید کے سلسلے میں سے؛ وہ بغداد آیا اور اظہر السمان اور ابو عاصم النبیل سے نقل کیا۔ آپ کی وفات ربیع الثانی میں ہوئی۔ 185}۔"
  tr: "Asid soyundan gelen Ebu Halid el-Kureşi el-Umavi el-Basri, Bağdat'a gelmiş ve orada Ezher el-Samman ve Ebu Asim el-Nabil'den rivayetle hadisler nakletmiştir. Ebu Ömer ve İbn el-Sammak da ondan rivayet etmişlerdir. Rabi' el-Ahir ayında vefat etmiştir. {cite:muntazam-ibn-al-jawzi s. 185}"
  id: "Abu Khalid al-Qurashi al-Umawi al-Basri, dari keturunan Asid, datang ke Baghdad dan meriwayatkan hadits di sana atas otoritas Azhar al-Samman dan Abu Asim al-Nabil. Abu Omar dan Ibn al-Sammak meriwayatkan darinya. Beliau wafat pada bulan Rabi’ al-Akhir. {cite:muntazam-ibn-al-jawzi p. 185}."
