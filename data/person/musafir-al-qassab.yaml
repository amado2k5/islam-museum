label: { ar: "مسافر القصّاب", en: "Musafir al-Qassab" }
summary:
  ar: "مسافر القصّاب ممن مكّنه الضحّاك الخارجي بالباب فولّاه أرمينية وأذربيجان فأتى أردبيل مستخفياً وخرج معه قوم من الشراة والتفّت عليه الجموع حتى نزل يونان وتحصّن في قلعة الكلاب بالسيسجان وقاتله إسحاق بن مسلم؛ ولما جاءت الدولة العباسية بعث أبو جعفر المنصور — وهو على الجزيرة وأرمينية في خلافة السفّاح — قائداً من أهل خراسان فقاتله حتى ظفر به وقتله."
  en: "Musafir al-Qassab, one al-Dahhak al-Khariji had empowered at al-Bab, who gave him Armenia and Adharbayjan; he came to Ardabil in disguise, a body of Sharat went out with him, crowds rallied till he camped at Yunan, and he held Qal'at al-Kilab in Sisajan against Ishaq ibn Muslim; when the Abbasid Dawla came, Abu Ja'far al-Mansur — then governing Jazira and Armenia under al-Saffah — sent a Khurasani commander who fought him till he overcame and killed him."
