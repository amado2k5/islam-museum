class: person
label: { ar: "مسافر القصّاب", en: "Musafir al-Qassab", es: "Musafir al-Qassab", fr: "Musafir al-Qassab", ur: "مسافر القصاب" }
summary:
  ar: "مسافر القصّاب ممن مكّنه الضحّاك الخارجي بالباب فولّاه أرمينية وأذربيجان فأتى أردبيل مستخفياً وخرج معه قوم من الشراة والتفّت عليه الجموع حتى نزل يونان وتحصّن في قلعة الكلاب بالسيسجان وقاتله إسحاق بن مسلم؛ ولما جاءت الدولة العباسية بعث أبو جعفر المنصور — وهو على الجزيرة وأرمينية في خلافة السفّاح — قائداً من أهل خراسان فقاتله حتى ظفر به وقتله."
  en: "Musafir al-Qassab, one al-Dahhak al-Khariji had empowered at al-Bab, who gave him Armenia and Adharbayjan; he came to Ardabil in disguise, a body of Sharat went out with him, crowds rallied till he camped at Yunan, and he held Qal'at al-Kilab in Sisajan against Ishaq ibn Muslim; when the Abbasid Dawla came, Abu Ja'far al-Mansur — then governing Jazira and Armenia under al-Saffah — sent a Khurasani commander who fought him till he overcame and killed him."
  es: "Musafir al-Qassab, un al-Dahhak al-Khariji al que había empoderado en al-Bab, le dio Armenia y Adharbayjan; llegó a Ardabil disfrazado, un cuerpo de Sharat salió con él, las multitudes se congregaron hasta que acampó en Yunan, y mantuvo Qal'at al-Kilab en Sisajan contra Ishaq ibn Muslim; cuando llegó el Dawla abasí, Abu Ja'far al-Mansur —que entonces gobernaba Jazira y Armenia bajo al-Saffah— envió a un comandante de Jorasán que luchó contra él hasta que lo venció y lo mató."
  fr: "Musafir al-Qassab, un homme qu'al-Dahhak al-Khariji avait investi de pouvoir à al-Bab, qui lui avait donné l'Arménie et l'Adharbayjan, arriva à Ardabil déguisé, accompagné d'un corps de Sharat. Les foules se rassemblèrent jusqu'à ce qu'il campe à Yunan, et il tint Qal'at al-Kilab à Sisajan contre Ishaq ibn Muslim. Lorsque le Dawla abbasside arriva, Abu Ja'far al-Mansur, qui gouvernait alors la Jazira et l'Arménie sous al-Saffah, envoya un commandant khurasani qui le combattit jusqu'à ce qu'il le vainque et le tue."
  ur: "مسافیر القصاب، ایک الضحاک الخارجی نے الباب میں بااختیار بنایا تھا، جس نے اسے آرمینیا اور ادربائجان دیا۔ وہ بھیس میں اردبیل آیا، شرات کا ایک جسم اس کے ساتھ نکلا، ہجوم جمع ہو گیا یہاں تک کہ اس نے یونان میں پڑاؤ ڈالا، اور اس نے سیسجان میں قلات الکلاب کو اسحاق بن مسلم کے خلاف پکڑ لیا۔ جب عباسی الدولہ آیا تو ابو جعفر المنصور نے جو الصفح کے تحت جزیرہ اور آرمینیا پر حکومت کر رہا تھا، نے ایک خراسانی کمانڈر کو بھیجا جس نے اس سے لڑا یہاں تک کہ اس نے فتح حاصل کر کے اسے قتل کر دیا۔"
  tr: "Kapıda el-Dahhak el-Hariji'nin tuttuğu kasap gezgini, Ermenistan ve Azerbaycan'ı ona atadı. Gizlice Erdebil'e gitti ve bir grup alıcı onunla birlikte çıktı. Kalabalık etrafında toplandı, Yunan karaya çıktı, Siscan'daki köpek kalesinde tahkim oldu ve İshaq bin Müslim ile savaştı. Abbasi devleti geldiğinde, el-Safah halifeliği sırasında Cazire ve Ermenistan'da bulunan Ebu Ca'fer el-Mansur, Horasan'dan bir komutan gönderdi ve Yunan onu yakalayıp öldürene kadar savaştı."
  id: "Pengembara tukang daging, yang ditempatkan al-Dahhak al-Khariji di gerbang, menunjuk Armenia dan Azerbaijan kepadanya. Ia pergi ke Ardabil secara diam-diam, dan sekelompok pembeli ikut keluar bersamanya. Kerumunan orang berkumpul di sekelilingnya hingga Yunan mendarat, memperkuat dirinya di kastil anjing-anjing di Sisjan, dan melawannya melawan Ishaq ibn Muslim. Ketika negara Abbasiyah datang, Abu Ja'far al-Mansur—yang berada di Jazira dan Armenia selama kekhalifahan al-Saffah—mengirim seorang komandan dari Khorasan dan melawannya hingga ia menangkap dan membunuhnya."
