summary:
  ar: "هيثم بن طارق آل سعيد (وُلد 11 أكتوبر 1955) سلطان عُمان منذ 11 يناير 2020، خلفًا لابن عمه قابوس بن سعيد الذي حكم نصف قرن. تدرّج في وزارة الخارجية من وكيل للشؤون السياسية إلى أمين عام، ثم تولّى وزارة التراث والثقافة من 2002 إلى 2020، ويرأس لجنة رؤية عُمان 2040. تعهّد في خطابه الأول بمواصلة سياسة سلفه الخارجية القائمة على صنع السلام، وبالتنمية الاقتصادية."
  en: "Haitham bin Tariq Al Said (born 11 October 1955) is the Sultan of Oman since 11 January 2020, succeeding his cousin Qaboos bin Said after a reign of half a century. He rose through the Foreign Ministry from undersecretary for political affairs to secretary general, then held the Ministry of Heritage and Culture from 2002 to 2020, and chairs the Oman Vision 2040 committee. His first speech promised continuity of his predecessor's peacemaking foreign policy and economic development."
  ur: "ہیثم بن طارق آل سعید (پیدائش 11 اکتوبر 1955ء) 11 جنوری 2020ء سے عمان کے سلطان ہیں اور اپنے چچا زاد قابوس بن سعید کے جانشین ہیں۔ وزارتِ خارجہ میں سیاسی امور کے نائب وزیر اور سیکرٹری جنرل رہے، پھر 2002ء تا 2020ء وزیرِ ثقافتی ورثہ رہے، اور عمان وژن 2040 کمیٹی کے سربراہ ہیں۔"
