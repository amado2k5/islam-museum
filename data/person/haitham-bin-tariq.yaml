summary:
  ar: "هيثم بن طارق آل سعيد ⁦(وُلد 11 أكتوبر 1955)⁩ سلطان عُمان منذ 11 يناير 2020، خلفًا لابن عمه قابوس بن سعيد الذي حكم نصف قرن. تدرّج في وزارة الخارجية من وكيل للشؤون السياسية إلى أمين عام، ثم تولّى وزارة التراث والثقافة من 2002 إلى 2020، ويرأس لجنة رؤية عُمان 2040. تعهّد في خطابه الأول بمواصلة سياسة سلفه الخارجية القائمة على صنع السلام، وبالتنمية الاقتصادية."
  en: "Haitham bin Tariq Al Said (born 11 October 1955) is the Sultan of Oman since 11 January 2020, succeeding his cousin Qaboos bin Said after a reign of half a century. He rose through the Foreign Ministry from undersecretary for political affairs to secretary general, then held the Ministry of Heritage and Culture from 2002 to 2020, and chairs the Oman Vision 2040 committee. His first speech promised continuity of his predecessor's peacemaking foreign policy and economic development."
  ur: "ہیثم بن طارق آل سعید ⁦(پیدائش 11 اکتوبر 1955ء)⁩ 11 جنوری 2020ء سے عمان کے سلطان ہیں اور اپنے چچا زاد قابوس بن سعید کے جانشین ہیں۔ وزارتِ خارجہ میں سیاسی امور کے نائب وزیر اور سیکرٹری جنرل رہے، پھر 2002ء تا 2020ء وزیرِ ثقافتی ورثہ رہے، اور عمان وژن 2040 کمیٹی کے سربراہ ہیں۔"
  es: "Haitham bin Tariq Al Said (nacido el 11 de octubre de 1955) es el sultán de Omán desde el 11 de enero de 2020, sucediendo a su primo Qaboos bin Said tras un reinado de medio siglo. Ascendió en el Ministerio de Asuntos Exteriores desde subsecretario de Asuntos Políticos hasta secretario general, luego ocupó el Ministerio de Patrimonio y Cultura de 2002 a 2020 y preside el comité Visión Omán 2040. En su primer discurso prometió dar continuidad a la política exterior de paz y al desarrollo económico de su predecesor."
  fr: "Haitham bin Tariq Al Said (né le 11 octobre 1955) est le sultan d'Oman depuis le 11 janvier 2020, succédant à son cousin Qabous bin Said après un demi-siècle de règne. Il a gravi les échelons du ministère des Affaires étrangères, passant de sous-secrétaire aux affaires politiques à secrétaire général, puis a occupé le poste de ministre du Patrimoine et de la Culture de 2002 à 2020. Il préside actuellement le comité Oman Vision 2040. Dans son premier discours, il a promis la continuité de la politique étrangère de son prédécesseur, axée sur la paix et le développement économique."
  tr: "Haitham bin Tariq Al Said (d. 11 Ekim 1955), 11 Ocak 2020'den beri Umman Sultanıdır ve yarım yüzyıl boyunca hüküm süren kuzeni Kabus bin Said'in yerine geçti. Dışişleri Bakanlığı'nda Siyasi İşler Müsteşarlığından Genel Sekreterliğe yükseldi, ardından 2002-2020 yılları arasında Kültür ve Miras Bakanı olarak görev yaptı ve Umman Vizyon 2040 Komitesi'ne başkanlık ediyor. İlk konuşmasında, selefinin barış inşası ve ekonomik kalkınmaya dayalı dış politikasını sürdüreceğine söz verdi."
  id: "Haitham bin Tariq Al Said (lahir 11 Oktober 1955) telah menjabat sebagai Sultan Oman sejak 11 Januari 2020, menggantikan sepupunya Qaboos bin Said, yang memerintah selama setengah abad. Ia naik melalui Kementerian Luar Negeri dari Wakil Menteri Urusan Politik menjadi Sekretaris Jenderal, kemudian menjabat sebagai Menteri Warisan dan Kebudayaan dari 2002 hingga 2020, dan memimpin Komite Oman Vision 2040. Dalam pidato pertamanya, ia berjanji untuk melanjutkan kebijakan luar negeri pendahulunya yang didasarkan pada pembangunan perdamaian dan pembangunan ekonomi."
