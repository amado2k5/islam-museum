summary:
  ar: "كوستا خيتاغوروف (1859–1906)، وُلد قسطنطين ليفانوفيتش خيتاغوروف، شاعر أوسيتي يُعد مؤسس الأدب الأوسيتي، وكان رسامًا وشخصية عامة؛ نُفي مرتين لانتقاده الحكومة القيصرية، وتوفي في لابا سنة 1906 ودُفن في مقبرة الكنيسة الأوسيتية في فلاديقوقاز."
  en: "Kosta Khetagurov (1859–1906), born Konstantin Levanovich Khetagurov, was an Ossetian poet regarded as the founder of Ossetian literature, and also a painter and public figure. Twice exiled for his criticism of the tsarist government, he died at Laba in 1906 and was buried in the necropolis of the Ossetian Church in Vladikavkaz."
  ur: "کوسٹا خیتاگوروف (1859–1906)، اصل نام قسطنطین لیوانووچ خیتاگوروف، آسیتی شاعر تھے جنہیں آسیتی ادب کا بانی سمجھا جاتا ہے؛ وہ مصور اور عوامی شخصیت بھی تھے۔ زار حکومت پر تنقید کی وجہ سے دو بار جلاوطن ہوئے، 1906 میں لابا میں وفات پائی اور ولادیقفقاز کی آسیتی کلیسا کے قبرستان میں دفن ہوئے۔"
