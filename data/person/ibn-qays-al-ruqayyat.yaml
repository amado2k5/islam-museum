summary:
  ar: "الشاعر، قال في يزيد بن عبد الملك لقد فتن الدنيا وسلامة القسا فلم يتركا للقس عقلاً ولا نفساً، وفي مصعب بن الزبير إنما مصعب شهباب من الله تجلت عن وجهه الظلماء {cite:muruj-al-dhahab p. 185} {cite:muruj-al-dhahab p. 101}."
  en: "The poet on Yazid — 'the world and Salama the priest's girl have seduced him leaving no wit or soul' — and on Mus'ab's radiant beauty {cite:muruj-al-dhahab p. 185, 101}."
  es: "El poeta sobre Yazid — 'el mundo y Salama, la hija del sacerdote, lo han seducido sin dejarle ni ingenio ni alma' — y sobre la radiante belleza de Mus'ab {cite:muruj-al-dhahab p. 185, 101}."
  fr: "Le poète à propos de Yazid — « le monde et Salama, la fille du prêtre, l’ont séduit sans lui laisser ni esprit ni âme » — et de la beauté rayonnante de Mus’ab {cite:muruj-al-dhahab p. 185, 101}."
  ur: "یزید کے بارے میں شاعر - 'دنیا اور سلامہ نے پادری کی لڑکی کو بہکا دیا ہے اور نہ کوئی عقل اور نہ روح چھوڑی ہے' - اور مصعب کے چمکدار حسن پر {حوالہ: مروج الذہب صفحہ 185، 101}۔"
  tr: "Şair, Yezid bin Abdülmelik hakkında şöyle demiştir: O, dünyayı ve rahibin güvenliğini sınar, rahibe ne aklı ne ruh bırakmamıştır. Mus'ab ibn al-Zubayr'de Mus'ab, Tanrı'nın sadece parlak bir parçasıdır; karanlık yüzü ortaya çıkmıştır {atıf:muruj-al-dhahab s. 185} {cite:muruj-al-dhahab, s. 101}."
  id: "Penyair berkata tentang Yazid ibn Abd al-Malik: Ia menggoda dunia dan keselamatan para imam, tanpa meninggalkan pikiran maupun jiwa bagi pendeta. Dalam Mus'ab ibn al-Zubayr, Mus'ab hanyalah bagian yang bersinar dari Tuhan, yang wajah gelapnya terungkap {cite:muruj-al-dhahab hlm. 185} {cite:muruj-al-dhahab, hlm. 101}."
