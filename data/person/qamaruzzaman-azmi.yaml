summary:
  ar: "عالم هندي-بريطاني من مدرسة بريلوي، وُلد في 23 مارس 1946 في أعظم كره بولاية أوتار براديش، ورئيس منظمة «البعثة الإسلامية العالمية» ⁦(World Islamic Mission)⁩. درّس في الفقه والحديث والتفسير وأسس مؤسسات ومساجد في بلدان عدة على مدى عقود، وأُدرج في قائمة المسلمون الخمسمئة الأكثر تأثيرًا سنوات متتالية."
  en: "Indian-British scholar of the Barelvi school, born on 23 March 1946 in Azamgarh, Uttar Pradesh, and president of the World Islamic Mission. He has taught fiqh, hadith and tafsir and founded institutions and mosques in several countries over five decades, and was listed in The Muslim 500 for successive years for his institution-building."
  ur: "بریلوی مکتب کے ہندوستانی-برطانوی عالم، 23 مارچ 1946 کو اتر پردیش کے اعظم گڑھ میں پیدا ہوئے اور عالمی اسلامی مشن ⁦(World Islamic Mission)⁩ کے صدر۔ انہوں نے پانچ دہائیوں تک فقہ، حدیث اور تفسیر پڑھائی اور کئی ممالک میں ادارے اور مساجد قائم کیں، اور ادارہ سازی کے باعث مسلسل برسوں مسلم 500 میں شمار ہوئے۔"
  es: "Erudito indio-británico de la escuela Barelvi, nacido el 23 de marzo de 1946 en Azamgarh, Uttar Pradesh, y presidente de la Misión Islámica Mundial. Ha impartido clases de fiqh, hadiz y tafsir, y ha fundado instituciones y mezquitas en varios países a lo largo de cinco décadas. Fue incluido en la lista The Muslim 500 durante varios años consecutivos por su labor en la creación de instituciones."
  fr: "Érudit indo-britannique de l'école Barelvi, né le 23 mars 1946 à Azamgarh (Uttar Pradesh), et président de la Mission islamique mondiale, il a enseigné le fiqh, le hadith et le tafsir. Fondateur d'institutions et de mosquées dans plusieurs pays pendant plus de cinquante ans, il a figuré pendant plusieurs années consécutives dans le classement des 500 personnalités musulmanes les plus influentes pour son action en faveur de ces institutions."
