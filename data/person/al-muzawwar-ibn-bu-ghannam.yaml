summary:
  ar: "قائد قبائل مجاورة لتلمسان وقفت ضد النفوذ العثماني؛ كان يرغب في مساندة زوج ابنته الأمير مولاي أحمد حليف الأسبان {cite:dawlat-uthmaniyya-salabi p. 230}. ثم كلفه المولى محمد الشيخ السعدي بالوساطة مع الأسبان، فبعث رسالته الأولى إلى حاكم وهران الكونت دي الكوديت مطلع ربيع الأول ٩٦٣هـ/يناير ١٥٥٥م مخبراً بوصول رسائله وسرور الشريف وابنه عبد الله بقدوم الوفد الأسباني للتفاوض على حملة مشتركة ضد العثمانيين {cite:dawlat-uthmaniyya-salabi p. 241}."
  en: "Leader of the tribes around Tlemcen against Ottoman influence, who wished to back his son-in-law the prince Mulay Ahmad, Spain's ally {cite:dawlat-uthmaniyya-salabi p. 230}. The Sa'di Muhammad al-Shaykh then charged him with mediation to Spain: his first letter to the Count of Alcaudete, governor of Oran, went out early Rabi' I 963/January 1555, announcing receipt of the count's letters and the sharif's and his son Abdallah's pleasure at a Spanish embassy to arrange a joint campaign against the Ottomans {cite:dawlat-uthmaniyya-salabi p. 241}."
