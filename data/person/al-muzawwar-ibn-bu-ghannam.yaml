summary:
  ar: "قائد قبائل مجاورة لتلمسان وقفت ضد النفوذ العثماني؛ كان يرغب في مساندة زوج ابنته الأمير مولاي أحمد حليف الأسبان {cite:dawlat-uthmaniyya-salabi p. 230}. ثم كلفه المولى محمد الشيخ السعدي بالوساطة مع الأسبان، فبعث رسالته الأولى إلى حاكم وهران الكونت دي الكوديت مطلع ربيع الأول ٩٦٣هـ/يناير ١٥٥٥م مخبراً بوصول رسائله وسرور الشريف وابنه عبد الله بقدوم الوفد الأسباني للتفاوض على حملة مشتركة ضد العثمانيين {cite:dawlat-uthmaniyya-salabi p. 241}."
  en: "Leader of the tribes around Tlemcen against Ottoman influence, who wished to back his son-in-law the prince Mulay Ahmad, Spain's ally {cite:dawlat-uthmaniyya-salabi p. 230}. The Sa'di Muhammad al-Shaykh then charged him with mediation to Spain: his first letter to the Count of Alcaudete, governor of Oran, went out early Rabi' I 963/January 1555, announcing receipt of the count's letters and the sharif's and his son Abdallah's pleasure at a Spanish embassy to arrange a joint campaign against the Ottomans {cite:dawlat-uthmaniyya-salabi p. 241}."
  fr: "Chef des tribus autour de Tlemcen contre l'influence ottomane, qui souhaitait soutenir son gendre le prince Moulay Ahmad, allié de l'Espagne {cite:dawlat-uthmaniyya-salabi p. 230}. Le Sa'di Muhammad al-Shaykh l'accusa alors de médiation en Espagne  : sa première lettre au comte d'Alcaudete, gouverneur d'Oran, sortit tôt Rabi' I 963/Janvier 1555, annonçant la réception des lettres du comte et le plaisir du sharif et de son fils Abdallah à une ambassade espagnole pour organiser une campagne conjointe contre les Ottomans {cite:dawlat-uthmaniyya-salabi p. 241}."
  es: "Líder de las tribus alrededor de Tlemcen contra la influencia otomana, que deseaba apoyar a su yerno, el príncipe Mulay Ahmad, aliado de España {cite:dawlat-uthmaniyya-salabi p. 230}. El Sa'di Muhammad al-Shaykh le encargó entonces que mediara ante España: su primera carta al conde de Alcaudete, gobernador de Orán, salió a principios de Rabi' I de 963/enero de 1555, anunciando la recepción de las cartas del conde y el agrado del sharif y su hijo Abdallah en una embajada española para organizar una campaña conjunta contra los otomanos {cite:dawlat-uthmaniyya-salabi p. 241}."
  ur: "عثمانی اثر و رسوخ کے خلاف Tlemcen کے آس پاس کے قبائل کے رہنما، جو اپنے داماد شہزادہ مولے احمد کی حمایت کرنا چاہتے تھے، اسپین کے اتحادی 230}۔ سعدی محمد الشیخ نے اس کے بعد اس پر اسپین میں ثالثی کا الزام عائد کیا: اوران کے گورنر، کاؤنٹ آف الکاؤڈیٹ کے نام ان کا پہلا خط ربیع اول 963/جنوری 1555 کے اوائل میں نکلا، جس میں گنتی کے خطوط کی وصولی کا اعلان کیا گیا اور شریف اور اس کے بیٹے عبداللہ کے سفارت خانے کے خلاف مشترکہ مہم چلانے کا اعلان کیا۔ عثمانی {حوالہ:دولت عثمانیہ صلابی ص۔ 241}۔"
  tr: "Tlemcen'e komşu kabilelerin lideriydi ve Osmanlı etkisine karşı duruyordu; kızının eşi Prens Moulay Ahmed'i desteklemek istiyordu; kendisi İspanyolların müttefiki {cite:dawlat-uthmaniyya-salabi s. 230}. Daha sonra Moulay Muhammed el-Şeyh Saadi, onu İspanyollarla arabuluculuk yapması için görevlendirdi ve ilk mektubunu Oran valisi Kont de Coudette'e, Rabi' al-Awwal'ın başında 963 Hicri / Ocak 1555 M.S. göndererek, mektuplarının, Surur al-Sharif'in ve oğlu Abdullah'ın, İspanyol heyetinin Osmanlılara karşı ortak bir sefer müzakere etmek üzere gelişini bildirdiğini bildirdi {cite:dawlat-uthmaniyya-salabi s. 241}."
  id: "Ia adalah pemimpin suku-suku tetangga Tlemcen yang menentang pengaruh Ottoman; ia ingin mendukung suami putrinya, Pangeran Moulay Ahmed, sekutu Spanyol {cite:dawlat-uthmaniyya-salabi hlm. 230}. Kemudian Moulay Muhammad al-Sheikh al-Saadi menugaskannya untuk menjadi mediator dengan Spanyol, mengirimkan surat pertamanya kepada gubernur Oran, Count de Coudette, pada awal Rabi' al-Awwal 963 AH / Januari 1555 M, memberitahukan kedatangan surat-suratnya, Surur al-Sharif, dan putranya Abdullah tentang kedatangan delegasi Spanyol untuk merundingkan kampanye bersama melawan Ottoman {cite:dawlat-uthmaniyya-salabi hlm. 241}."
