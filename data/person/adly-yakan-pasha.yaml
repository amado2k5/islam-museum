summary:
  ar: "سياسي مصري من أسرة محمد علي — كان ابن أخت مؤسس الأسرة، ومنه لقبه «يكن» أي ابن الأخت بالتركية — تولى رئاسة الوزراء ثلاث مرات بين 1921 و1930، ووزارات الخارجية والمعارف والداخلية، وأسس حزب الأحرار الدستوريين وكان أول رئيس له، وتفاوض مع اللورد كورزون سنة 1921."
  en: "Egyptian politician of the Muhammad Ali family — he was a sister's son of the dynasty's founder, whence his name 'Yakan', Turkish for a sister's son — prime minister three times between 1921 and 1930, minister of foreign affairs, education and the interior, founder and first president of the Liberal Constitutional Party, and negotiator with Lord Curzon in 1921."
  ur: "محمد علی خاندان کے مصری سیاست دان — وہ خاندان کے بانی کے بھانجے تھے، اسی سے ان کا نام «يکن» یعنی ترکی میں بہن کا بیٹا — 1921 اور 1930 کے درمیان تین بار وزیرِ اعظم، وزیرِ خارجہ، تعلیم اور داخلہ رہے، لبرل کانسٹیٹیوشنل پارٹی کے بانی اور پہلے صدر تھے، اور 1921 میں لارڈ کرزن سے مذاکرات کیے۔"
