label: { ar: "المستعين بالله العباس بن المتوكل", en: "al-Musta'in bi'llah al-Abbas ibn al-Mutawakkil", fr: "al-Musta'in bi'llah al-Abbas ibn al-Mutawakkil", es: "al-Musta'in bi'llah al-Abbas ibn al-Mutawakkil", ur: "المستعین باللہ العباس ابن المتوکل" }
summary:
  ar: "خليفة القاهرة [٨٠٨–٨١٥هـ] وسلطانها أشهراً، أبو الفضل العباس بن المتوكل أمه أم ولد تركية باي خاتون، بويع بالخلافة بعهد من أبيه في رجب سنة ثمان وثمان مئة، فلما قتل السلطان فرج بويع بالسلطنة مضافة للخلافة في المحرم سنة خمس عشرة وضربت السكة باسمه وتصرف بالولاية والعزل وعمل فيه ابن حجر قصيدته المشهورة، ثم تغلب عليه شيخ المؤيد وصرح بخلعه وبايع أخاه داود فاستفتى نوروز نائب الشام القضاة والعلماء فأفتوا بعدم جواز خلعه ونقل إلى دار من دور القلعة ثم سير إلى الإسكندرية فاعتقل بها إلى أن تولى ططر فأطلقه فاختار سكنى الإسكندرية لأنه استطابها وحصل له مال كثير من التجارة فاستمر إلى أن مات بها شهيداً بالطاعون في جمادى الآخرة سنة ثلاث وثلاثين وثمان مئة، وفي أيامه أرسل غياث الدين أعظم شاه بن إسكندر شاه ملك الهند يطلب التقليد من الخليفة سنة أربع عشرة {cite:tarikh-khulafa-minhaj-1434 p. 765-768}."
  en: "Cairo caliph [808–815] and for months sultan too — hailed after Faraj's death, coining in his own name, hymned by Ibn Hajar; deposed by Shaykh al-Mu'ayyad whose deposition Syria's jurists voided, imprisoned then freed to Alexandria where he traded happily till the plague took him in 833. India's king A'zam Shah sought his investiture in 814 {cite:tarikh-khulafa-minhaj-1434 p. 765-768}."
  fr: "Calife du Caire [808-815] et pendant des mois sultan aussi – salué après la mort de Faraj, inventant en son propre nom, chanté par Ibn Hajar ; Déposé par Cheikh al-Mu'ayyad dont la déposition a été annulée, emprisonné puis libéré à Alexandrie où il a échangé avec bonheur jusqu'à ce que la peste le prenne en 833. Le roi d'Inde A'zam Shah a demandé son investiture en 814 {cite:tarikh-khulafa-minhaj-1434 p. 765-768}."
  es: "Califa de El Cairo [808–815] y durante meses también sultán —aclamado tras la muerte de Faraj, acuñó monedas con su propio nombre, elogiado por Ibn Hajar; depuesto por Shaykh al-Mu'ayyad, cuya deposición fue anulada por los juristas de Siria, encarcelado y luego liberado a Alejandría, donde comerció felizmente hasta que la peste lo alcanzó en 833. El rey de la India, A'zam Shah, solicitó su investidura en 814 {cite:tarikh-khulafa-minhaj-1434 p. 765-768}."
  ur: "قاہرہ کا خلیفہ [808-815] اور کئی مہینوں تک سلطان بھی - فراج کی موت کے بعد اس کے اپنے نام پر سکہ جاری کیا گیا، جسے ابن حجر نے مدعو کیا؛ شیخ المعیاد کے ذریعہ معزول کیا گیا جس کی معزولی شام کے فقہاء نے کالعدم قرار دی، پھر جیل میں ڈال دیا گیا پھر اسکندریہ چلا گیا جہاں اس نے خوشی خوشی تجارت کی یہاں تک کہ 833 میں طاعون نے اسے اپنی لپیٹ میں لے لیا۔ 765-768}۔"
  tr: "Kahire Halifesi [808–815 H) ve en ünlü sultanı Ebu el-Fadl el-Abbas bin el-Mutawakkil, annesi Türk Bey Hatun'un oğlu olarak, 800 Hicri yılında babası tarafından Rajab'da halifeliğe bağlılık yemini etti. Sultan Faraj öldürüldüğünde, Muharrem 15 H.'de halifeliğe ek olarak sultanlığa bağlılık yemini etti. Paralar onun adına basıldı ve yetki ve görevden alma hakkını kullandı. İbn Hajar bu konuda ünlü şiirini yazdı. Sonra Şeyh al-Mueyyad galip geldi, tahttan indirildiğini ilan etti ve kardeşi Davud'a itaat etti. El-Şam'ın vekili Nowruz, hakimlerden ve alimlerden fetva istedi ve görevden alınmasını yasaklayan fetvalar çıkardı, onu Dor kalesinde kaldı, ardından İskenderiye'ye gitti ve orada tutuldu; ta ki Tatar'ı ele geçirene kadar; Tatar onu serbest bıraktı. İskenderiye'yi sevdiği ve ticaretten çok servet kazandığı için yerleşmeyi seçti, bu yüzden 833 Hicri yılında Cumedül-Ahira'da veba hastalığından ölene kadar orada kaldı. Saltanatı sırasında, Ghiyath al-Din, 1434 yılında Hindistan Kralı Azam Şah ibn İskandar Şah'ı halifeden taklit etmek için gönderdi {atıf:Tarikh-khulafa-minhaj-1434, s. 765-768}."
  id: "Khalifah Kairo [808–815 H] dan sultan terkenalnya, Abu al-Fadl al-Abbas ibn al-Mutawakkil, yang ibunya adalah putra Turkiya Bey Khatun, mengikrarkan kesetiaan kepada kekhalifahan oleh ayahnya di Rajab pada tahun 800 H. Ketika Sultan Faraj dibunuh, ia disumpah setia kepada kesultanan sebagai tambahan kekhalifahan pada Muharram 15 H. Koin tersebut dicetak atas namanya, dan ia menjalankan otoritas serta pemecatannya. Ibn Hajar menulis puisi terkenalnya tentang hal itu. Kemudian Sheikh al-Mu'ayyad menang, menyatakan pencopotannya, dan bersumpah setia kepada saudaranya Dawood. Nowruz, wakil al-Sham, meminta fatwa dari hakim dan ulama serta mengeluarkan fatwa yang melarang pencopotannya, memindahkannya ke Ia tinggal di kastil Dor, lalu pergi ke Alexandria dan ditahan di sana hingga mengambil alih Tatar, yang kemudian membebaskannya. Ia memilih menetap di Alexandria karena menyukainya dan memperoleh banyak kekayaan dari perdagangan, sehingga ia tinggal di sana hingga meninggal karena wabah di Jumada al-Akhirah pada tahun 833 H. Selama masa pemerintahannya, Ghiyath al-Din mengirim Azam Shah ibn Iskandar Shah, Raja India, untuk meniru khalifah pada tahun 1434 {cite:Tarikh-khulafa-minhaj-1434, hlm. 765-768}."
