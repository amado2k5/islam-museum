id: person/al-mustain-billah
class: person
label: { ar: "المستعين بالله العباس بن المتوكل" }
summary:
  ar: "خليفة القاهرة [٨٠٨–٨١٥هـ] وسلطانها أشهراً، أبو الفضل العباس بن المتوكل أمه أم ولد تركية باي خاتون، بويع بالخلافة بعهد من أبيه في رجب سنة ثمان وثمان مئة، فلما قتل السلطان فرج بويع بالسلطنة مضافة للخلافة في المحرم سنة خمس عشرة وضربت السكة باسمه وتصرف بالولاية والعزل وعمل فيه ابن حجر قصيدته المشهورة، ثم تغلب عليه شيخ المؤيد وصرح بخلعه وبايع أخاه داود فاستفتى نوروز نائب الشام القضاة والعلماء فأفتوا بعدم جواز خلعه ونقل إلى دار من دور القلعة ثم سير إلى الإسكندرية فاعتقل بها إلى أن تولى ططر فأطلقه فاختار سكنى الإسكندرية لأنه استطابها وحصل له مال كثير من التجارة فاستمر إلى أن مات بها شهيداً بالطاعون في جمادى الآخرة سنة ثلاث وثلاثين وثمان مئة، وفي أيامه أرسل غياث الدين أعظم شاه بن إسكندر شاه ملك الهند يطلب التقليد من الخليفة سنة أربع عشرة {cite:tarikh-khulafa-minhaj-1434 p. 765-768}."
  en: "Cairo caliph [808–815] and for months sultan too — hailed after Faraj's death, coining in his own name, hymned by Ibn Hajar; deposed by Shaykh al-Mu'ayyad whose deposition Syria's jurists voided, imprisoned then freed to Alexandria where he traded happily till the plague took him in 833. India's king A'zam Shah sought his investiture in 814 {cite:tarikh-khulafa-minhaj-1434 p. 765-768}."
