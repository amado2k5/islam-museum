summary:
  ar: "رياضي ومسير رياضي وسياسي سنغالي (1933–2021) من داكار، رئيس الاتحاد الدولي لألعاب القوى من 1999 إلى 2015 بعد مسيرة في ألعاب القوى وكرة القدم، وشغل قبلها رئاسة بلدية داكار وعضوية البرلمان؛ أُدين في باريس سنة 2020 في قضية فساد التستر على تعاطي المنشطات الروسية، وتوفي في داكار في 3 ديسمبر 2021."
  en: "Senegalese athlete, sports administrator and politician (1933–2021) from Dakar; president of the IAAF from 1999 to 2015 after a career in athletics and football, and earlier mayor of Dakar and a member of parliament; he was convicted in Paris in 2020 in the corruption case over the cover-up of Russian doping, and died in Dakar on 3 December 2021."
  ur: "سینیگال کے کھلاڑی، کھیلوں کے منتظم اور سیاست دان (1933ء–2021ء) جن کا تعلق ڈاکار سے تھا؛ ایتھلیٹکس اور فٹ بال کے کیریئر کے بعد 1999ء سے 2015ء تک عالمی ایتھلیٹکس فیڈریشن (IAAF) کے صدر رہے، اس سے پہلے ڈاکار کے میئر اور رکن پارلیمان بھی رہے؛ 2020ء میں پیرس میں روسی ڈوپنگ چھپانے کے بدعنوانی مقدمے میں سزا پائی اور 3 دسمبر 2021ء کو ڈاکار میں وفات ہوئی۔"
