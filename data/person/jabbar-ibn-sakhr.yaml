gender: male
roles: [companion]
summary:
  ar: "أنصاري بعثه النبي مع عمرو بن أمية الضمري إلى مكة لقتل أبي سفيان بن حرب؛ هو الذي اقترح الطواف بالبيت والصلاة ليلاً، وكان لا رجلة له فأمره عمرو أن ينجو إلى بعيره حين طاردتهم قريش."
  en: "An Ansari whom the Prophet sent with Amr ibn Umayya al-Damri to Mecca to kill Abu Sufyan ibn Harb; it was he who proposed circling the Ka'ba and praying at night, and being no walker, Amr told him to flee to his camel when Quraysh pursued them."
  ur: "انصاری جسے نبی نے عمرو بن امیہ الضمری کے ساتھ مکہ ابو سفیان بن حرب کو مارنے بھیجا؛ کعبہ کا طواف کرنے کی تجویز اسی نے دی۔"
  es: "Un Ansari a quien el Profeta envió con Amr ibn Umayya al-Damri a La Meca para matar a Abu Sufyan ibn Harb; fue él quien propuso rodear la Kaaba y rezar por la noche, y como no era un caminante, Amr le dijo que huyera a su camello cuando los Quraysh los persiguieron."
  fr: "Un Ansari que le Prophète envoya avec Amr ibn Umayya al-Damri à La Mecque pour tuer Abu Sufyan ibn Harb; c'est lui qui proposa de faire le tour de la Kaaba et de prier la nuit, et comme il ne marchait pas, Amr lui dit de s'enfuir sur son chameau lorsque les Quraysh les poursuivirent."
  tr: "Ansari, Peygamber tarafından Amr ibn Umeyye el-Damri ile birlikte Ebu Sufyan bin Harb'ı öldürmek için Mekke'ye gönderildi; evin etrafında dolaşıp gece namaz kılmayı öneren oydu. Bacakları yoktu, bu yüzden Amr, Kureyş onları takip ettiğinde devesine kaçmasını emretti."
  id: "Ansari dikirim oleh Nabi bersama Amr ibn Umayyah al-Damri ke Mekah untuk membunuh Abu Sufyan ibn Harb; dialah yang mengusulkan untuk mengelilingi Rumah dan berdoa di malam hari. Ia tidak memiliki kaki, sehingga Amr memerintahkannya untuk melarikan diri ke unta ketika Quraisy mengejar mereka."
