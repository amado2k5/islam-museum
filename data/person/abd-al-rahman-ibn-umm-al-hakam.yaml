  ar: "ولاه معاوية الكوفة في سنة ثمان وخمسين، وهو عبد الرحمن بن عبد الله بن عثمان بن ربيعة الثقفي ابن أم الحكم أخت معاوية؛ فأساء السيرة في أهل الكوفة فأخرجوه من بينهم طريداً، فرجع إلى خاله معاوية، ثم ولاه معاوية مصر، فتلقاه معاوية بن خديج على مرحلتين منها ومنعه من دخولها فرجع إلى معاوية {cite:bakr-umayyad-state-1134715 p. 149-150}."
