summary:
  ar: "عالم مصلح هندي (1779–1831)، حفيد الشاه ولي الله الدهلوي وابن أخ الشاه عبد العزيز، وشريك سيد أحمد بريلوي في تأسيس حركة «الطريقة المحمدية» الإصلاحية وقيادتها؛ ألّف «تقوية الإيمان» و«الصراط المستقيم»، وقاد مع سيد أحمد الجهاد ضد إمبراطورية السيخ حتى قُتل معه في بالاكوت في 6 مايو 1831، ويُعدّ سلفًا مؤثرًا في حركتي أهل الحديث وديوبند."
  en: "Indian revivalist scholar (1779–1831), grandson of Shah Waliullah Dehlvi and nephew of Shah Abdul Aziz, and Syed Ahmad Barelvi's partner in founding and leading the reform movement Tariqah-i-Muhammadiyah. He wrote Taqwiyat al-Iman and Sirat al-Mustaqim, campaigned with Syed Ahmad in the jihad against the Sikh Empire, and was killed beside him at Balakot on 6 May 1831; he is regarded as a formative influence on the Ahl-i Hadith and Deobandi movements."
  ur: "ہندوستانی مصلح عالم (1779ء–1831ء)، شاہ ولی اللہ دہلوی کے پوتے اور شاہ عبدالعزیز کے بھتیجے؛ سید احمد بریلوی کے ساتھ اصلاحی تحریک «طریقۂ محمدیہ» کے بانی و قائد۔ «تقویۃ الایمان» اور «صراطِ مستقیم» کے مصنف؛ سکھ سلطنت کے خلاف جہاد میں سید احمد کے ساتھ شریک رہے اور 6 مئی 1831ء کو بالاکوٹ میں ان کے ساتھ مارے گئے۔ اہلِ حدیث اور دیوبندی تحریکوں پر ان کے گہرے اثرات مانے جاتے ہیں۔"
