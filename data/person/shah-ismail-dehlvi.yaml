faith:
  - value: sunni-hanafi
    basis: documented
    note: "The English article's lead calls him a 'Hanafi jurist', citing Mukhtar Ahmad Ali (2000: Shah Ismail 'strictly remained within the Hanafi School'), and its infobox quotes M. Reza Pirbhai (2023) that, operating amid British and Sikh ascendancy, he narrowed the field of legal opinion to acknowledge only Abu Hanifa's rulings when primary textual sources were not specific; the article's infobox jurisprudence field gives Hanafi referenced to those two works, alongside a second value, 'Independent', referenced to Julia Stephens (2018). The counter-reading is preserved here, not suppressed: the article's Jurisprudence section states that he has been identified varyingly as a Hanafi or as a ghayr muqallid, that it has been argued he repudiated taqlid (adherence to a school), and that Ashraf Ali Thanwi cited him as performing raf' al-yadayn, a practice alien to the Hanafi school. The Arabic and Urdu articles name no madhhab in their texts (both file him in Hanafi categories, which are filings and do not count), and Wikidata gives only Islam. The value is recorded on the scholarly attestations stated in the English article's text, with the debate carried in this note; this is the same text-plus-referenced-infobox configuration as syed-ahmad-barelvi's Hanafi segment."
    sources: [source/wikipedia-shah-ismail-dehlvi-en]
  - value: sufi
    basis: documented
    note: "Independent article texts attest his personal Sufi affiliation. The English article's lead calls him a 'Naqshbandi Sufi reformer', citing Reifeld and Jafri (2006), for whom Syed Ahmad and his chief associate Shah Ismail 'belonged to the Chishti and Naqshbandi orders, respectively'; its infobox tariqa field (Naqshbandi) is also referenced to the Oxford Encyclopedia of the Modern Islamic World (1995: 'affiliated to a branch of the activist Naqshbandi Sufi order'), and Pirbhai (2023) calls him 'a Naqshbandi Sufi'. The Urdu article independently records that, after completing his studies, he kept the company of Syed Ahmad Barelvi and completed the path of suluk (the Sufi path) under him, calling Barelvi his pir and murshid. On those texts his personal Sufi affiliation — Naqshbandi — is documented; it is attested as discipleship, not inferred from his leadership of the movement."
    sources: [source/wikipedia-shah-ismail-dehlvi-en, source/wikipedia-shah-ismail-dehlvi-ur]
