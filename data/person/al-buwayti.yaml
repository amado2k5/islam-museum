summary:
  ar: "صاحب الشافعي وواسطة عقد جماعته وأظهرهم نجابة، اختص به في حياته وقام مقامه في الدرس والفتوى بعد وفاته؛ حمل في أيام الواثق بالله من مصر إلى بغداد في مدة المحنة فأريد على القول بخلق القرآن فامتنع فحبس ولم يزل في السجن والقيد حتى مات؛ قال الربيع بن سليمان رأيته على بغل في عنقه غل وفي رجليه قيد وبينهما سلسلة فيها طوبة وزنها أربعون رطلاً وهو يقول فوالله لأموتن في حديدي حتى يأتي من بعدي قوم يعلمون أنه مات في هذا الشأن قوم في حديدهم، وكان أبو إسحاق الشيرازي يحكي أنه كان إذا سمع المؤذن يوم الجمعة اغتسل ولبس ثيابه ومشى إلى باب السجن فيقول السجان أين تريد فيقول أجيب داعي الله {cite:wafayat-ayan p. 61-64}."
  en: "Al-Shafi'i's chosen disciple who filled his place in lesson and fatwa; carried to Baghdad in al-Wathiq's days of the mihna and refusing the created-Qur'an he died in chains — al-Rabi' saw him on a mule, collared and fettered with a forty-ratl iron, vowing to die in his iron so that later folk would know men had died in this cause; each Friday he washed, dressed and walked to the prison gate to answer God's caller {cite:wafayat-ayan p. 61-64}."
