summary:
  ar: "صاحب الشافعي وواسطة عقد جماعته وأظهرهم نجابة، اختص به في حياته وقام مقامه في الدرس والفتوى بعد وفاته؛ حمل في أيام الواثق بالله من مصر إلى بغداد في مدة المحنة فأريد على القول بخلق القرآن فامتنع فحبس ولم يزل في السجن والقيد حتى مات؛ قال الربيع بن سليمان رأيته على بغل في عنقه غل وفي رجليه قيد وبينهما سلسلة فيها طوبة وزنها أربعون رطلاً وهو يقول فوالله لأموتن في حديدي حتى يأتي من بعدي قوم يعلمون أنه مات في هذا الشأن قوم في حديدهم، وكان أبو إسحاق الشيرازي يحكي أنه كان إذا سمع المؤذن يوم الجمعة اغتسل ولبس ثيابه ومشى إلى باب السجن فيقول السجان أين تريد فيقول أجيب داعي الله {cite:wafayat-ayan p. 61-64}. وفي تاريخ بغداد ⁦(ترجمة 7613)⁩: سمع عبد الله بن وهب ومحمد بن إدريس الشافعي، وروى عنه أبو إسماعيل الترمذي وإبراهيم بن إسحاق الحربي وأحمد بن منصور الرمادي والقاسم بن هاشم السمسار، وحُمل إلى بغداد أيام المحنة فامتنع من القول بخلق القرآن فحُبس حتى مات؛ وفيه منازعة ابن عبد الحكم لمجلس الشافعي في مرضه وقول الشافعي ليس أحد أحق بمجلسي من يوسف بن يحيى وليس أحد من أصحابي أعلم منه، وقوله للبويطي أنت تموت في الحديد {cite:tarikh-baghdad-khatib j.11 p.300-302}."
  en: "Al-Shafi'i's chosen disciple who filled his place in lesson and fatwa; carried to Baghdad in al-Wathiq's days of the mihna and refusing the created-Qur'an he died in chains — al-Rabi' saw him on a mule, collared and fettered with a forty-ratl iron, vowing to die in his iron so that later folk would know men had died in this cause; each Friday he washed, dressed and walked to the prison gate to answer God's caller {cite:wafayat-ayan p. 61-64}. Tarikh Baghdad (#7613) adds that he heard Ibn Wahb and al-Shafi'i himself and was transmitted from by al-Tirmidhi, Ibrahim b. Ishaq al-Harbi, Ahmad b. Mansur al-Ramadi and Qasim b. Hashim al-Simsar; it preserves the contest with Ibn 'Abd al-Hakam for al-Shafi'i's sickbed majlis — 'no one has more right to my circle than Yusuf b. Yahya, and no pupil of mine knows more' — and al-Shafi'i's thrice-told prophecy 'you will die in your iron' {cite:tarikh-baghdad-khatib j.11 p.300-302}."
  fr: "Disciple choisi d’al-Shafi’i auquel il succéda pour les leçons et les fatwas ; conduit à Bagdad sous al-Wathiq pendant la mihna, il refusa le Coran créé et mourut dans les chaînes — al-Rabi’ le vit sur une mule, le cou pris dans un collier et les pieds entravés par un fer de quarante ratl, jurant de mourir dans son fer afin que les générations suivantes sachent que des hommes étaient morts pour cette cause ; chaque vendredi, il se lavait, s’habillait et marchait jusqu’à la porte de la prison pour répondre à l’appel de Dieu {cite:wafayat-ayan p. 61-64}. Tarikh Baghdad (nº 7613) ajoute qu’il entendit Ibn Wahb et al-Shafi’i lui-même et qu’al-Tirmidhi, Ibrahim ibn Ishaq al-Harbi, Ahmad ibn Mansur al-Ramadi et Qasim ibn Hashim al-Simsar transmirent de lui ; il conserve la rivalité avec Ibn Abd al-Hakam pour le cercle d’al-Shafi’i malade — « nul n’a plus droit à mon cercle que Yusuf ibn Yahya, et nul de mes élèves n’en sait davantage » — ainsi que la prédiction trois fois répétée d’al-Shafi’i : « Tu mourras dans ton fer » {cite:tarikh-baghdad-khatib j.11 p.300-302}."
  es: "Discípulo elegido de Al-Shafi'i que ocupó su lugar en la lección y la fatwa; llevado a Bagdad en los días de al-Wathiq de la mihna y rechazando el Corán creado, murió encadenado: al-Rabi' lo vio en una mula, con collar y encadenado con un hierro de cuarenta ratl, jurando morir en su hierro para que la gente posterior supiera que los hombres habían muerto por esta causa; cada viernes se lavaba, se vestía y caminaba hasta la puerta de la prisión para responder al llamado de Dios {cite:wafayat-ayan p. 61-64}. Tarikh Baghdad (#7613) agrega que escuchó a Ibn Wahb y al propio al-Shafi'i y fue transmitido por al-Tirmidhi, Ibrahim b. Ishaq al-Harbi, Ahmad b. Mansur al-Ramadi y Qasim b. Hashim al-Simsar; conserva la disputa con Ibn 'Abd al-Hakam por el majlis de al-Shafi'i en su lecho de enfermo — 'nadie tiene más derecho a mi círculo que Yusuf b. Yahya, y ningún discípulo mío sabe más' — y la profecía de al-Shafi'i repetida tres veces 'morirás en tu hierro' {cite:tarikh-baghdad-khatib j.11 p.300-302}."
  ur: "شافعی کے منتخب شاگرد جنہوں نے سبق اور فتویٰ میں ان کی جگہ بھر دی؛ الوثیق کے مہینہ کے دنوں میں بغداد لے جایا گیا اور قرآن کا انکار کرتے ہوئے زنجیروں میں جکڑا ہوا مر گیا - الربیع نے اسے خچر پر دیکھا، چالیس رتل لوہے سے جکڑا ہوا تھا، اس کے لوہے میں مرنے کی قسم کھاتا تھا تاکہ بعد میں لوگوں کو پتہ چلے کہ مرد اسی وجہ سے مرے ہیں۔ ہر جمعہ کو وہ نہلاتا، کپڑے پہنتا اور خدا کے پکارنے والے کو جواب دینے کے لیے جیل کے دروازے پر چلا جاتا۔ 61-64}۔ تاریخ بغداد (#7613) مزید کہتے ہیں کہ اس نے ابن وہب اور الشافعی کو خود سنا ہے اور اسے ترمذی، ابراہیم بن محمد سے نقل کیا ہے۔ اسحاق الحربی، احمد بی۔ منصور الرمادی اور قاسم بی۔ ہاشم السمسر; اس نے ابن عبد الحکم کے ساتھ الشافعی کی بیمار مجلس کے مقابلہ کو محفوظ رکھا ہے - 'میرے حلقہ میں یوسف بن سے زیادہ کسی کا حق نہیں ہے۔ یحییٰ، اور میرا کوئی شاگرد اس سے زیادہ نہیں جانتا' - اور الشافعی کی تین بار کہی گئی پیشین گوئی 'تم اپنے لوہے پر مرو گے'"
  tr: "Şafiî'nin sahabesi, grubunun merkez figürü ve en seçkinlerinden biriydi. Şafiî'nin yaşamı boyunca onu özellikle seçmiş ve ölümünden sonra da onun yerini alarak fetvalar vermiş ve öğretim yapmıştır. Vatikü'l-Billah döneminde Mısır'dan Bağdat'a getirilmiş ve Kur'an'ın yaratıldığını söylemesi istenmiş, ancak reddetmiş ve hapsedilerek zincire vurulmuş ve ölene kadar hapiste kalmıştır. Rabi bin Süleyman şöyle demiştir: Onu bir katır üzerinde, boynunda pranga, ayaklarında zincir ve aralarında kırk kiloluk bir tuğla bağlı zincirle gördüm ve şöyle diyordu: Allah'a yemin ederim ki, zincirlerimle öleceğim ki, benden sonra gelenler bu konuda zincirler içinde ölenleri bilsinler. Ebu İshak Şirazi şöyle anlatırdı: Cuma günü müezzini dinlediğinde yıkanır, elbiselerini giyer ve hapishane kapısına yürürdü. Gardiyan ona, \"Nereye gidiyorsun?\" diye sorardı. Şöyle derdi: \"Ben Allah'ın çağırıcısına cevap veriyorum.\" {Kaynak: Vefayat-i Ayan, s. 61-64}. Bağdat Tarihi'nde (7613 numaralı çeviri): Abdullah bin Vahb ve Muhammed bin İdris el-Şafii ondan işittiler ve Ebu İsmail el-Tirmizi, İbrahim bin İshak el-Harbi, Ahmed bin Mansur el-Ramadi ve el-Kâsım bin Haşim el-Samsar ondan rivayet ettiler. Sıkıntı zamanında Bağdat'a getirildi ve Kur'an'ın yaratıldığını söylemeyi reddettiği için ölene kadar hapsedildi. İbn Abd el-Hakam'ın hastalığı sırasında el-Şafii'nin tavsiyesiyle olan tartışmasını ve el-Şafii'nin şu sözünü içerir: \"Yusuf bin Yahya'dan daha çok tavsiyemi hak eden kimse yoktur ve arkadaşlarım arasında ondan daha bilgili kimse yoktur.\" Ve el-Buveyti'ye söylediği şu sözü: \"Zincirlenmiş olarak öleceksin.\" {cite:tarikh-baghdad-khatib j.11 s.300-302}."
  id: "Sahabat Al-Shafi'i dan tokoh sentral kelompoknya serta yang paling terkemuka di antara mereka, beliau dipilih oleh Al-Shafi'i semasa hidupnya dan menggantikan posisinya dalam mengajar dan mengeluarkan fatwa setelah kematiannya. Beliau dibawa dari Mesir ke Baghdad pada masa Al-Wathiq Billah selama masa pencobaan dan diminta untuk mengatakan bahwa Al-Qur'an diciptakan, tetapi beliau menolak dan dipenjara serta tetap berada di penjara dan dirantai sampai beliau meninggal. Al-Rabi' bin Sulayman berkata: Aku melihatnya di atas seekor keledai dengan belenggu di lehernya dan rantai di kakinya dan di antara keduanya sebuah rantai dengan batu bata seberat empat puluh pon, dan beliau berkata: Demi Allah, aku akan mati dalam rantai ini agar orang-orang yang datang setelahku mengetahui bahwa orang-orang telah mati dalam perkara ini dalam rantai mereka. Abu Ishaq Al-Shirazi biasa meriwayatkan bahwa ketika ia mendengar muazin pada hari Jumat, ia akan mandi dan mengenakan pakaiannya lalu berjalan ke gerbang penjara, dan sipir penjara akan bertanya: Ke mana kamu pergi? Dia akan berkata: Aku menjawab seruan Allah. {kutip:wafayat-ayan hlm. 61-64}. Dalam Sejarah Baghdad (terjemahan 7613): Abdullah bin Wahb dan Muhammad bin Idris al-Shafi’i mendengar darinya, dan Abu Ismail al-Tirmidhi, Ibrahim bin Ishaq al-Harbi, Ahmad bin Mansur al-Ramadi, dan al-Qasim bin Hashim al-Samsar meriwayatkan darinya. Dia dibawa ke Baghdad pada masa cobaan, dan dia menolak untuk mengatakan bahwa Al-Qur'an diciptakan, sehingga dia dipenjara sampai meninggal. Kitab ini memuat perselisihan Ibnu Abd al-Hakam dengan dewan al-Shafi’i selama sakitnya, dan pernyataan al-Shafi’i: “Tidak ada seorang pun yang lebih berhak menerima nasihatku selain Yusuf bin Yahya, dan tidak ada seorang pun di antara sahabatku yang lebih berilmu darinya.” Dan pernyataannya kepada al-Buwayti: “Kamu akan mati dalam belenggu.” {kutip:tarikh-baghdad-khatib j.11 hal.300-302}."
