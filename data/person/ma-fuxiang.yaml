summary:
  ar: "عالِم وجنرال وسياسي مسلم من الهوي (1876–1932)، ابن ما تشيانلينغ وشقيق ما فولو وأبو ما هونغكوي، حكم نينغشيا (1912–1920) وسويوان (1921–1925) ورأس لجنة الشؤون المنغولية والتبتية، وأسّس جمعية الصين الإسلامية وموّل المدارس الإسلامية واتخذ موقفًا علنيًا ضد نظام المنحوان والطائفية."
  en: "A Hui Muslim scholar, general and politician (1876–1932), son of Ma Qianling, brother of Ma Fulu and father of Ma Hongkui, who governed Ningxia (1912–1920) and Suiyuan (1921–1925) and chaired the Mongolian and Tibetan Affairs Commission. He founded the China Islamic Association, financed Muslim schools, and took a public stance against the menhuan system and religious sectarianism."
  ur: "ایک ہوئی مسلمان عالم، جنرل اور سیاست دان (1876ء–1932ء)، ما چیان لنگ کے بیٹے، ما فولو کے بھائی اور ما ہونگ کوئ کے والد، جنہوں نے ننگ شیا (1912ء–1920ء) اور سوئی یوان (1921ء–1925ء) پر حکومت کی اور منگول و تبتی امور کمیشن کی صدارت کی۔ انہوں نے چین اسلامی انجمن قائم کی، مسلمان اسکولوں کی مالی مدد کی، اور منحوان نظام اور فرقہ واریت کے خلاف عوامی موقف اختیار کیا۔"
