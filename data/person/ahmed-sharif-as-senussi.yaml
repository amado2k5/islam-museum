summary:
  ar: "زعيم ليبي (1873–1933)؛ تولى زعامة الحركة السنوسية سنة 1902 خلفًا لعمه محمد المهدي، وقاد المقاومة ضد الفرنسيين في تشاد والإيطاليين في ليبيا والبريطانيين في مصر، ثم تنازل عن الزعامة الفعلية لابن عمه محمد إدريس سنة 1916، وقضى سنواته الأخيرة متنقلًا بين تركيا والشام والحجاز حتى توفي بالمدينة المنورة ودُفن بالبقيع."
  en: "Libyan leader (1873–1933). He took over the leadership of the Senussi movement in 1902, succeeding his uncle Muhammad al-Mahdi, and led the resistance against the French in Chad, the Italians in Libya and the British in Egypt; he ceded effective leadership to his cousin Muhammad Idris in 1916 and spent his last years between Turkey, Syria and the Hejaz, dying in Medina and being buried in Al-Baqi."
  ur: "لیبیائی رہنما (1873–1933)؛ 1902 میں اپنے چچا محمد المہدی کے بعد سنوسی تحریک کی قیادت سنبھالی، چاڈ میں فرانسیسیوں، لیبیا میں اطالویوں اور مصر میں انگریزوں کے خلاف مزاحمت کی قیادت کی، 1916 میں قیادت اپنے چچا زاد محمد ادریس کے حوالے کی، اور آخری سال ترکی، شام اور حجاز میں گزار کر مدینہ منورہ میں وفات پائی اور جنت البقیع میں دفن ہوئے۔"
