summary:
  ar: "محمود بن علي بن محمود بن مقبل بن سليمان بن داود الدقوقي ثم البغدادي، تقي الدين، أبو الثناء، فقيه حنبلي ومحدث حافظ، انتهى إليه علم الحديث والوعظ ببغداد، ولم يكن في وقته أحسن قراءة للحديث منه ومعرفة بلغاته وضبطه، وله مشاركة في الفقه. أجاز له جماعة من أهل الشام والعراق، وتخرج به جماعة في علم الحديث، وسمع منه خلق. من تصانيفه مطالع الأنوار، والكواكب الدرية في المناقب العلوية. توفي سنة 733 هـ، وولد سنة 663 هـ على ما يذكره العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15822}"
  en: "Mahmud ibn Ali ibn Mahmud ibn Muqbil ibn Sulayman ibn Dawud al-Daqqauqi, then al-Baghdadi, Taqi al-Din, Abu al-Thana, a Hanbali jurist and memorising hadith scholar. The knowledge of hadith and preaching in Baghdad ended with him; in his time no one read hadith better or knew its languages and vocalisation more closely, and he had some share in fiqh. Several scholars of Syria and Iraq licensed him, a circle trained in hadith through him, and many heard from him. His works include Matali al-Anwar and al-Kawakib al-Durriyya fi al-Manaqib al-Alawiyya. The header gives his death as 733 AH and his birth as 663 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15822}"
  es: "Mahmud ibn Ali ibn Mahmud ibn Muqbil ibn Sulayman ibn Dawud al-Daqqauqi, luego al-Baghdadi, Taqi al-Din, Abu al-Thana, un jurista hanbalí y erudito memorizador de hadices. El conocimiento de los hadices y la predicación en Bagdad culminaron con él; en su época, nadie leía mejor los hadices ni conocía sus idiomas y vocalización con tanta precisión, y tuvo cierta influencia en el fiqh. Varios eruditos de Siria e Irak lo reconocieron como maestro, un círculo se formó en hadices a través de él, y muchos escucharon sus enseñanzas. Entre sus obras se encuentran Matali al-Anwar y al-Kawakib al-Durriyya fi al-Manaqib al-Alawiyya. El encabezado indica que falleció en el año 733 de la Hégira y nació en el año 663 de la Hégira. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15821} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15822}"
  fr: "Mahmud ibn Ali ibn Mahmud ibn Muqbil ibn Sulayman ibn Dawud al-Daqqauqi, dit al-Baghdadi, Taqi al-Din, Abu al-Thana, juriste hanbalite et érudit en hadiths par mémorisation, marqua l'apogée de la connaissance et de la diffusion du hadith à Bagdad. À son époque, nul ne lisait le hadith avec autant de précision ni ne maîtrisait aussi bien ses langues et sa prononciation. Il possédait également une expertise en fiqh. Plusieurs savants de Syrie et d'Irak lui accordèrent leur agrément, un cercle d'érudits se forma au hadith grâce à lui, et nombreux furent ceux qui écoutèrent son enseignement. Parmi ses œuvres figurent Matali al-Anwar et al-Kawakib al-Durriyya fi al-Manaqib al-Alawiyya. La notice biographique indique sa mort en 733 AH et sa naissance en 663 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15822}"
  ur: "محمود ابن علی ابن محمود ابن مقبل ابن سلیمان ابن داؤد الدقوقی، پھر البغدادی، تقی الدین، ابو الثنا، حنبلی فقیہ اور حفظ حدیث کا عالم۔ بغداد میں حدیث اور تبلیغ کا علم ان پر ختم ہوا۔ ان کے زمانے میں کسی نے حدیث کو بہتر طور پر نہیں پڑھا اور نہ ہی اس کی زبانوں اور آوازوں کو زیادہ قریب سے جانا اور فقہ میں ان کا کچھ حصہ تھا۔ شام اور عراق کے متعدد علماء نے اسے لائسنس دیا، ایک حلقہ نے ان کے ذریعے حدیث کی تربیت حاصل کی، اور بہت سے لوگوں نے ان سے سنا۔ ان کی تصانیف میں متلی الانوار اور الکوکیب الدوریہ فی المناقب العلویہ شامل ہیں۔ ہیڈر ان کی وفات 733ھ اور ولادت 663ھ بتاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 15821}"
  tr: "Mahmud ibn Ali ibn Mahmud ibn Muqbil ibn Süleyman ibn Davud el-Daquqi, o zamanlar el-Bağdadi, Taqi al-Din, Hanbali fili ve hadis alimi, ezberci olan Ebu al-Thana. Hadis ve vaaz bilgisini Bağdat'ta tamamladı. Onun zamanında, daha iyi bir hadis okuma veya dilleri ve doğruluğu bilgisi yoktu. Fıhhiha katıldı. Levant ve Irak halkından bir grup tarafından yetkilendirildi, birçok kişi hadis biliminden mezun oldu ve birçoğu ondan dinledi. Eserleri arasında Matali' al-Anwar, Al-Kawakib al-Durriya fi al-Manaqib al-'Alawiyyah bulunmaktadır. 733 Hicri'de öldü ve başlıkta belirtildiği gibi 663 Hile doğdu. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.15821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15822}"
  id: "Mahmoud ibn Ali ibn Mahmoud ibn Muqbil ibn Sulayman ibn Dawud al-Daqouqi, kemudian al-Baghdadi, Taqi al-Din, Abu al-Thana, seorang ahli hukum Hanbali dan ulama hadis, penghafal. Ia menyelesaikan pengetahuan hadis dan dakwahnya di Baghdad. Pada masanya, tidak ada pembacaan hadis yang lebih baik atau pengetahuan tentang bahasa dan keakuratannya. Ia berpartisipasi dalam bidang fiqh. Ia mendapat otorisasi dari sekelompok orang dari Levant dan Irak, dan banyak yang lulus darinya dalam ilmu hadis, dan banyak yang mendengar kabarnya. Di antara karyanya adalah Matali' al-Anwar, Al-Kawakib al-Durriya fi al-Manaqib al-'Alawiyyah. Ia meninggal pada tahun 733 H dan lahir pada 663 H, seperti yang disebutkan dalam judul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15822}"
