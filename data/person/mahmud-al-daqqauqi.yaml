id: person/mahmud-al-daqqauqi
class: person
gender: male
label:
  ar: "صاحب المطالع (محمود بن علي الدقوقي)"
  en: "Author of al-Matali (Mahmud ibn Ali al-Daqqauqi)"
summary:
  ar: "محمود بن علي بن محمود بن مقبل بن سليمان بن داود الدقوقي ثم البغدادي، تقي الدين، أبو الثناء، فقيه حنبلي ومحدث حافظ، انتهى إليه علم الحديث والوعظ ببغداد، ولم يكن في وقته أحسن قراءة للحديث منه ومعرفة بلغاته وضبطه، وله مشاركة في الفقه. أجاز له جماعة من أهل الشام والعراق، وتخرج به جماعة في علم الحديث، وسمع منه خلق. من تصانيفه مطالع الأنوار، والكواكب الدرية في المناقب العلوية. توفي سنة 733 هـ، وولد سنة 663 هـ على ما يذكره العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15822}"
  en: "Mahmud ibn Ali ibn Mahmud ibn Muqbil ibn Sulayman ibn Dawud al-Daqqauqi, then al-Baghdadi, Taqi al-Din, Abu al-Thana, a Hanbali jurist and memorising hadith scholar. The knowledge of hadith and preaching in Baghdad ended with him; in his time no one read hadith better or knew its languages and vocalisation more closely, and he had some share in fiqh. Several scholars of Syria and Iraq licensed him, a circle trained in hadith through him, and many heard from him. His works include Matali al-Anwar and al-Kawakib al-Durriyya fi al-Manaqib al-Alawiyya. The header gives his death as 733 AH and his birth as 663 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15822}"
