summary:
  ar: "حاكم إمبراطورية التوكولور (1836-1897) ونجل الحاج عمر تال الأكبر وخليفته. فتح سيغو سنة 1861 وتولّى الإمبراطورية بعد وفاة أبيه سنة 1864، وصمد نحو ثلاثة عقود أمام الزحف الفرنسي بقيادة أرشينار حتى سقطت سيغو سنة 1890 وباندياغارا سنة 1893، فآثر المنفى شرقا على عرض فرنسا بالتقاعد المريح وتوفي قرب سوكوتو سنة 1897."
  en: "Ruler of the Toucouleur Empire (1836–1897), eldest son and successor of al-Hajj Umar Tall. He conquered Ségou in 1861 and took over the empire on his father's death in 1864, holding out for some three decades against Archinard's French offensive until Ségou fell in 1890 and Bandiagara in 1893; he refused France's offer of a comfortable retirement, went into exile eastward, and died near Sokoto in 1897."
  ur: "توکولور سلطنت کے حکمران (1836ء–1897ء)، الحاج عمر تال کے سب سے بڑے صاحبزادے اور جانشین۔ انھوں نے 1861ء میں سیگو فتح کی اور 1864ء میں والد کی وفات پر سلطنت سنبھالی، اور آرشینار کی فرانسیسی مہم کے سامنے تقریباً تین دہائیاں ڈٹے رہے یہاں تک کہ 1890ء میں سیگو اور 1893ء میں باندیاگارا گر گئے؛ فرانس کی پُرآسائش سبکدوشی کی پیشکش ٹھکرا کر وہ مشرق کی طرف جلاوطن ہوئے اور 1897ء میں سوکوٹو کے قریب وفات پائی۔"

