class: person
label: { ar: "منكلي صاحب بلاد الجبل", en: "Mangli", es: "Mangli", fr: "Mangli", ur: "منگلی" }
summary:
  ar: "منكلي صاحب همذان وأصفهان والري وما بينها من بلاد الجبل؛ ملكها بعد قتله سيده أيتغمش، فناصبه الديوان الخلفي وجهز الخليفة الناصر عليه ائتلافاً من أوزبك بن البهلوان وجلال الدين الإسماعيلي وعسكر مقدمه مظفر الدين كوكبري صاحب إربل، فانهزم منكلي وقتل هارباً في جمادى الأولى سنة اثنتي عشرة وستمائة، وولي مملوكه أغلمش ممالكه {cite:kamil-ibn-al-athir p. 364-365}."
  en: "Master of Hamadan, Isfahan and Rayy — he took the Jibal by killing his own master Ayatghamish; al-Nasir's coalition of Uzbek, the Ismaili castles' lord and Kukburi's grand army beat him down from the mountains and he died fleeing, Jumada I 612 {cite:kamil-ibn-al-athir p. 364-365}."
  es: "Señor de Hamadán, Isfahán y Rayy, tomó el Jibal matando a su propio señor Ayatghamish; la coalición de al-Nasir, formada por uzbekos, el señor de los castillos ismaelitas y el gran ejército de Kukburi, lo derribó de las montañas y murió huyendo, Jumada I 612 {cita:kamil-ibn-al-athir págs. 364-365}."
  fr: "Maître d'Hamadan, d'Ispahan et de Rayy, il prit le Jibal en tuant son propre maître Ayatghamish; la coalition d'al-Nasir, composée d'Ouzbeks, du seigneur des châteaux ismaéliens et de la grande armée de Kukburi, le fit tomber des montagnes et il mourut en fuyant, Jumada I 612 {cite:kamil-ibn-al-athir p. 364-365}."
  ur: "ہمدان، اصفہان اور رے کے آقا - اس نے جبل کو اپنے ہی آقا آیت غامش کو قتل کر کے لے لیا۔ الناصر کے ازبک اتحاد، اسماعیلی قلعوں کے مالک اور کوکبوری کی عظیم فوج نے اسے پہاڑوں سے مارا پیٹا اور وہ بھاگتے ہوئے مر گیا، جمعہ اول 612 {حوالہ: کامل ابن الاثیر ص۔ 364-365}۔"
  tr: "Hamadan, İsfahan, Rayı ve aradaki dağlık toprakların hükümdarı Mankali; onu öldürdükten sonra ustası Aythmiş onu halefi olarak atadı. Halife Diwanı onu atadı ve Özbek ibn al-Bahlwan, Celaleddin el-İsmaili ve komutanı Erbil hükümdarı Muzaffar al-Din Kokbari'nin ordusunu hazırladı. Mankali, 600 Hicri yılında Cumada'd-Avval'da yenildi ve öldürüldü, Memlükleri Aglemiş krallıklarını ele geçirdi {cite:kamil-ibn-al-athir s. 364-365}."
  id: "Mankali, penguasa Hamadan, Isfahan, Rayy, dan wilayah pegunungan di antaranya; setelah membunuhnya, tuannya Aytghmish mengangkatnya sebagai penerusnya. Khalifa Diwan mengangkatnya dan menyiapkan koalisi Uzbek ibn al-Bahlwan, Jalal al-Din al-Ismaili, dan pasukan komandannya Muzaffar al-Din Kokbari, penguasa Erbil. Mankali dikalahkan dan dibunuh di Jumada al-Awwal pada tahun 600 H, dan Mamluknya mengambil alih kerajaan Aghlamish {cite:kamil-ibn-al-athir hlm. 364-365}."
