summary:
  ar: "منكلي صاحب همذان وأصفهان والري وما بينها من بلاد الجبل؛ ملكها بعد قتله سيده أيتغمش، فناصبه الديوان الخلفي وجهز الخليفة الناصر عليه ائتلافاً من أوزبك بن البهلوان وجلال الدين الإسماعيلي وعسكر مقدمه مظفر الدين كوكبري صاحب إربل، فانهزم منكلي وقتل هارباً في جمادى الأولى سنة اثنتي عشرة وستمائة، وولي مملوكه أغلمش ممالكه {cite:kamil-ibn-al-athir p. 364-365}."
  en: "Master of Hamadan, Isfahan and Rayy — he took the Jibal by killing his own master Ayatghamish; al-Nasir's coalition of Uzbek, the Ismaili castles' lord and Kukburi's grand army beat him down from the mountains and he died fleeing, Jumada I 612 {cite:kamil-ibn-al-athir p. 364-365}."
