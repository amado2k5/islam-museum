summary:
  ar: "نواف الأحمد الجابر الصباح ⁦(25 يونيو 1937 – 16 ديسمبر 2023)⁩ أمير الكويت من 29 سبتمبر 2020 حتى وفاته، خلفًا لأخيه غير الشقيق صباح الأحمد. قضى مسيرته في المناصب الأمنية: محافظ حولي (1962–1978)، وزير الداخلية ⁦(1978–1988 ثم 2003–2006)⁩، وزير الدفاع (1988–1991)، ونائب رئيس الحرس الوطني، ثم ولي العهد من 2006. اتسم عهده القصير بمواجهة نزاعات سياسية داخلية متكررة مع مجلس الأمة."
  en: "Nawaf Al-Ahmad Al-Jaber Al-Sabah (25 June 1937 – 16 December 2023) was Emir of Kuwait from 29 September 2020 until his death, succeeding his half-brother Sabah Al-Ahmad. His career was spent in the security posts: governor of Hawalli (1962–1978), minister of interior (1978–1988, then 2003–2006), minister of defence (1988–1991) and deputy chief of the National Guard, then crown prince from 2006. His short reign grappled with repeated internal political disputes with the National Assembly."
  ur: "نواف الاحمد الجابر الصباح ⁦(25 جون 1937ء – 16 دسمبر 2023ء)⁩ 29 ستمبر 2020ء سے اپنی وفات تک کویت کے امیر رہے اور اپنے سوتیلے بھائی صباح الاحمد کے جانشین بنے۔ عمر بھر سکیورٹی عہدوں پر رہے: گورنرِ حولی، وزیرِ داخلہ، وزیرِ دفاع اور نیشنل گارڈ کے نائب سربراہ، پھر 2006ء سے ولی عہد رہے۔"
  es: "Nawaf Al-Ahmad Al-Jaber Al-Sabah (25 de junio de 1937 - 16 de diciembre de 2023) fue emir de Kuwait desde el 29 de septiembre de 2020 hasta su fallecimiento, sucediendo a su hermanastro Sabah Al-Ahmad. Su carrera transcurrió en puestos de seguridad: gobernador de Hawalli (1962-1978), ministro del Interior (1978-1988, y luego 2003-2006), ministro de Defensa (1988-1991) y subcomandante de la Guardia Nacional, y posteriormente príncipe heredero desde 2006. Su breve reinado estuvo marcado por reiteradas disputas políticas internas con la Asamblea Nacional."
  fr: "Nawaf Al-Ahmad Al-Jaber Al-Sabah (25 juin 1937 – 16 décembre 2023) fut émir du Koweït du 29 septembre 2020 jusqu'à sa mort, succédant à son demi-frère Sabah Al-Ahmad. Il consacra sa carrière aux fonctions sécuritaires: gouverneur de Hawalli (1962-1978), ministre de l'Intérieur (1978-1988, puis 2003-2006), ministre de la Défense (1988-1991) et chef adjoint de la Garde nationale, puis prince héritier à partir de 2006. Son court règne fut marqué par de fréquents conflits politiques internes avec l'Assemblée nationale."
  tr: "Nawaf Al-Ahmad Al-Jaber Al-Sabah (25 Haziran 1937 – 16 Aralık 2023), 29 Eylül 2020'den ölümüne kadar Kuveyt Emiri olarak görev yaptı ve üvey kardeşi Sabah Al-Ahmad'ın yerine geçti. Güvenlik görevlerinde bulundu: Hawalli Valisi (1962–1978), İçişleri Bakanı (1978–1988 ve ardından 2003–2006), Savunma Bakanı (1988–1991), Ulusal Muhafız Başkan Yardımcısı ve ardından 2006'dan itibaren Veliaht Prens. Kısa dönemi, Ulusal Meclis ile tekrar eden iç siyasi anlaşmazlıklarla geçti."
  id: "Nawaf Al-Ahmad Al-Jaber Al-Sabah (25 Juni 1937 – 16 Desember 2023) adalah Emir Kuwait dari 29 September 2020 hingga wafatnya, menggantikan saudara tirinya Sabah Al-Ahmad. Ia menjabat di posisi keamanan termasuk: Gubernur Hawalli (1962–1978), Menteri Dalam Negeri (1978–1988 dan kemudian 2003–2006), Menteri Pertahanan (1988–1991), Wakil Kepala Garda Nasional, dan kemudian Putra Mahkota sejak 2006. Masa pemerintahannya yang singkat ditandai dengan perselisihan politik internal yang berulang dengan Majelis Nasional."
