summary:
  ar: "نواف الأحمد الجابر الصباح (25 يونيو 1937 – 16 ديسمبر 2023) أمير الكويت من 29 سبتمبر 2020 حتى وفاته، خلفًا لأخيه غير الشقيق صباح الأحمد. قضى مسيرته في المناصب الأمنية: محافظ حولي (1962–1978)، وزير الداخلية (1978–1988 ثم 2003–2006)، وزير الدفاع (1988–1991)، ونائب رئيس الحرس الوطني، ثم ولي العهد من 2006. اتسم عهده القصير بمواجهة نزاعات سياسية داخلية متكررة مع مجلس الأمة."
  en: "Nawaf Al-Ahmad Al-Jaber Al-Sabah (25 June 1937 – 16 December 2023) was Emir of Kuwait from 29 September 2020 until his death, succeeding his half-brother Sabah Al-Ahmad. His career was spent in the security posts: governor of Hawalli (1962–1978), minister of interior (1978–1988, then 2003–2006), minister of defence (1988–1991) and deputy chief of the National Guard, then crown prince from 2006. His short reign grappled with repeated internal political disputes with the National Assembly."
  ur: "نواف الاحمد الجابر الصباح (25 جون 1937ء – 16 دسمبر 2023ء) 29 ستمبر 2020ء سے اپنی وفات تک کویت کے امیر رہے اور اپنے سوتیلے بھائی صباح الاحمد کے جانشین بنے۔ عمر بھر سکیورٹی عہدوں پر رہے: گورنرِ حولی، وزیرِ داخلہ، وزیرِ دفاع اور نیشنل گارڈ کے نائب سربراہ، پھر 2006ء سے ولی عہد رہے۔"
