summary:
  ar: "حذيفة بن اليمن العبسي؛ عند البلاذري: ولّاه عثمان بن عفان ثغر أرمينية بعد حبيب بن مسلمة فشخّص إلى برذعة ووجّه عمّاله على ما بينها وبين قاليقلا وإلى خيزان فورد عليه كتاب عثمان يأمره بالانصراف وتخليف صلة بن زفر العبسي فخلّفه."
  en: "Hudhayfa ibn al-Yaman al-Absi; in al-Baladhuri: Uthman ibn Affan gave him Armenia's march after Habib ibn Maslama, and he repaired to Bardha'a posting his agents over what lay between it and Qaliqala and to Khizan, until Uthman's writ came ordering his return and the leaving of Sila ibn Zufar al-Absi in his place, whom he left."
