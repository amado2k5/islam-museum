  ur: "ملائیشیائی متاثر کنندہ، داعیہ اور کاروباری خاتون، «ہیجانہ» کے باوقار فیشن اور کتب کے ادارے کی بانی اور ڈائریکٹر، جس نے 2016ء میں ایمان اور طرزِ زندگی پر پوسٹ کرنا شروع کیا اور جوہر بہرو میں مقیم ہے۔ 15 نومبر 2026ء کی براہِ راست خوانی میں اس کے انسٹاگرام اکاؤنٹ کے 1,317,417 فالوور تھے، اور اپریل 2026ء کی ایک مؤرخہ لقطہ بھی اسی حجم کی تائید کرتی ہے۔"
