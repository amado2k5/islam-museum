  ar: "مؤثّرة وداعية ورائدة أعمال ماليزية، مؤسِّسة ومديرة علامة «هيجانة» للأزياء المحتشمة وكتبها، بدأت النشر عن الإيمان ونمط الحياة سنة 2016 من جوهور بهرو. بلغ حسابها على إنستغرام 1,317,417 متابعًا في قراءة مباشرة في 15 نوفمبر 2026، وتؤيد لقطة مؤرخة في أبريل 2026 الحجم نفسه."
  en: "Malaysian influencer, dawah figure and entrepreneur, founder and director of the Hijanah modest-fashion and books venture, who began posting on faith and lifestyle in 2016 and is based in Johor Bahru. Her Instagram account counted 1,317,417 followers in a direct read on 15 November 2026, with a dated April 2026 snapshot corroborating the scale."
