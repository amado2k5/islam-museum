summary:
  ar: "مفسر صاحب «كتاب التسهيل لعلوم التنزيل»، يسميه غلاف الطبعة الأولى ⁦(1355هـ)⁩ «الشيخ الإمام العلامة الحافظ المفسر خادم القرآن العظيم محمد بن أحمد بن جزي الكلبي»، ويذكر في تفسيره شيخه الأستاذ أبا جعفر بن الزبير صاحب «ملاك التأويل»."
  en: "Exegete, author of Kitab al-Tashil li-Ulum al-Tanzil; the cover of its first printing (1355 AH) calls him 'the shaykh, the imam, the learned hafiz and exegete, servant of the mighty Qur'an, Muhammad ibn Ahmad ibn Juzayy al-Kalbi', and in his commentary he names his teacher, the master Abu Ja'far ibn al-Zubayr, author of Milak al-Ta'wil."
  ur: "مفسر، «کتاب التسہیل لعلوم التنزیل» کے مصنف؛ اس کی پہلی طباعت ⁦(1355ھ)⁩ کا سرورق انہیں «شیخ، امام، علامہ، حافظ، مفسر، خادمِ قرآنِ عظیم محمد بن احمد بن جزی الکلبی» کہتا ہے، اور اپنی تفسیر میں وہ اپنے استاد، استاذ ابو جعفر بن الزبیر، صاحبِ «ملاک التاویل» کا ذکر کرتے ہیں۔"
  es: "Exegeta, autor de Kitab al-Tashil li-Ulum al-Tanzil; la portada de su primera edición (1355 AH) lo llama 'el shaykh, el imán, el erudito hafiz y exegeta, siervo del poderoso Corán, Muhammad ibn Ahmad ibn Juzayy al-Kalbi', y en su comentario nombra a su maestro, el maestro Abu Ja'far ibn al-Zubayr, autor de Milak al-Ta'wil."
  fr: "Exégète, auteur du Kitab al-Tashil li-Ulum al-Tanzil; la couverture de sa première impression (1355 AH) le nomme « le cheikh, l'imam, le hafiz et exégète savant, serviteur du puissant Coran, Muhammad ibn Ahmad ibn Juzayy al-Kalbi », et dans son commentaire, il nomme son maître, le maître Abu Ja'far ibn al-Zubayr, auteur du Milak al-Ta'wil."
  tr: "Tefsirci, 'Kitab al-Tashil li Uloom al-Tanzil'in ilk baskısının (1355 H) kapağında onu 'şeyh, imam, alim, ezberci, tefsirci, büyük Kur'an Muhammed bin Ahmed ibn Juzay al-Kalbi'nin hizmetkârı' olarak adlandırır. Tafsirinde, öğretmeni, 'Malak al-Ta'wil'in yazarı Profesör Ebu Ca'fer bin Zubeyr'den bahseder."
  id: "Penafsir, penulis 'Kitab al-Tashil li Uloom al-Tanzil,' sampul edisi pertama (1355 H) menyebutnya 'sheikh, imam, cendekiawan, penghafal, penafsir, hamba Al-Qur'an agung, Muhammad ibn Ahmad ibn Juzay al-Kalbi.' Dalam tafsirnya, ia menyebut gurunya, Profesor Abu Ja'far ibn al-Zubayr, penulis 'Malak al-Ta'wil'."
