summary:
  ar: "مفسر صاحب «كتاب التسهيل لعلوم التنزيل»، يسميه غلاف الطبعة الأولى ⁦(1355هـ)⁩ «الشيخ الإمام العلامة الحافظ المفسر خادم القرآن العظيم محمد بن أحمد بن جزي الكلبي»، ويذكر في تفسيره شيخه الأستاذ أبا جعفر بن الزبير صاحب «ملاك التأويل»."
  en: "Exegete, author of Kitab al-Tashil li-Ulum al-Tanzil; the cover of its first printing (1355 AH) calls him 'the shaykh, the imam, the learned hafiz and exegete, servant of the mighty Qur'an, Muhammad ibn Ahmad ibn Juzayy al-Kalbi', and in his commentary he names his teacher, the master Abu Ja'far ibn al-Zubayr, author of Milak al-Ta'wil."
  ur: "مفسر، «کتاب التسہیل لعلوم التنزیل» کے مصنف؛ اس کی پہلی طباعت ⁦(1355ھ)⁩ کا سرورق انہیں «شیخ، امام، علامہ، حافظ، مفسر، خادمِ قرآنِ عظیم محمد بن احمد بن جزی الکلبی» کہتا ہے، اور اپنی تفسیر میں وہ اپنے استاد، استاذ ابو جعفر بن الزبیر، صاحبِ «ملاک التاویل» کا ذکر کرتے ہیں۔"
