label:
  ar: إبراهيم الطرابلسي (برهان الدين)
  en: Ibrahim al-Tarabulusi (Burhan al-Din, Hanafi jurist)
  ur: ابراہیم طرابلسی (برہان الدین، حنفی فقیہ)
summary:
  ar: 'إبراهيم بن موسى بن أبي بكر، برهان الدين الطرابلسي، فقيه حنفي، ولد في طرابلس
    الشام وأخذ بدمشق عن جماعة، ثم انتقل إلى القاهرة وتوفي بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7508} من تصانيفه: الإسعاف في أحكام الأوقاف، ومواهب الرحمن في مذهب النعمان، وشرحه
    المسمى البرهان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7508} '
  en: 'Ibrahim ibn Musa ibn Abi Bakr, Burhan al-Din al-Tarabulusi, a Hanafi jurist.
    Born in Tripoli of the Levant, he studied at Damascus with several masters, then
    moved to Cairo and died there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7508} His
    works include al-Isʿaf on the rules of endowments, Mawahib al-Rahman in the school
    of al-Nu''man, and its commentary called al-Burhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7508} '
  ur: 'ابراہیم بن موسیٰ بن ابی بکر، برہان الدین طرابلسی، حنفی فقیہ۔ طرابلس شام میں
    پیدا ہوئے، دمشق میں کئی علماء سے پڑھا، پھر قاہرہ منتقل ہوئے اور وہیں وفات پائی۔
    {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7508} ان کی تصانیف میں «الإسعاف في أحكام
    الأوقاف»، «مواہب الرحمن في مذهب النعمان» اور اس کی شرح «البرہان» شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7508} '
