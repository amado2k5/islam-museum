class: person
label: { ar: "الجرّاح بن عبد الله الحكمي", en: "al-Jarrah ibn Abdallah al-Hakami" }
summary:
  ar: "الجرّاح بن عبد الله الحكمي من مذحج؛ عند البلاذري: ولّى أرمينية فنزل برذعة فرفع إليه اختلاف مكاييلها وموازينها فأقامها على العدل والوفاء واتخذ مكيالاً يدعى الجرّاحي فأهلها يتعاملون به إلى اليوم، وأنفذ أمان حبيب بن مسلمة وصلحه لأهل تفليس بكتاب قضى لهم فيه على أرحائهم وكرومهم بمائة درهم في السنة، ثم عبر الكُرّ وقطع نهر السمور وصار إلى الخزر فقتل منهم مقتلة عظيمة وقاتل أهل بلاد حمزين فصالحهم على نقلهم إلى رستاق. ويذكر الكتاب أن عمر كتب إليه ألا يغزو، وأن يتمسك بما في يده، وأنه أمره أن يدعو أهل الذمة إلى الإسلام ويسقط عنهم الجزية إذا أسلموا، فأسلم في خراسان نحو أربعة آلاف ذمي على يده. {cite:salabi-umayyad-state-2020 p.333-343} ويذكر الكتاب أنه ولي خراسان وسجستان لعمر بن عبد العزيز، وأنه قُتل سنة 112هـ في خلافة هشام في حرب الخزر بأذربيجان. {cite:salabi-umayyad-state-2020 p.386} ويذكر الكتاب أنه استُعمل على أرمينية وأذربيجان سنة 104هـ لصد الخزر، فسار إليهم وعبر نهر الكُر، ثم دارت معركة الران سنة 104هـ انتصر فيها على الخزر، وفتح بلنجر وأعاد صاحبها إلى حصنه، وطلب المدد من يزيد فمات قبل وصوله. {cite:salabi-umayyad-state-2020 p.440-443}"
  en: "al-Jarrah ibn Abdallah al-Hakami of Mudhhij; in al-Baladhuri: governing Armenia he settled at Bardha'a, where its conflicting measures and weights were laid before him and he set them on justice and fulness, making a measure called al-Jarrahi its people deal by to this day; he executed Habib ibn Maslama's aman and treaty for Tiflis's people with a writ fixing a hundred dirhams yearly on their mills and vineyards; then he crossed the Kurr, passed the river al-Samur, reached the Khazars and killed them in a great slaughter, and fought the people of Bilad Hamzin compounding to transfer them to a rustaq."
