id: person/al-jarrah-ibn-abdallah-al-hakami
class: person
label: { ar: "الجرّاح بن عبد الله الحكمي", en: "al-Jarrah ibn Abdallah al-Hakami", es: "al-Jarrah ibn Abdallah al-Hakami", fr: "al-Jarrah ibn Abdallah al-Hakami", ur: "الجراح بن عبداللہ الحکمی" }
summary:
  ar: "الجرّاح بن عبد الله الحكمي من مذحج؛ عند البلاذري: ولّى أرمينية فنزل برذعة فرفع إليه اختلاف مكاييلها وموازينها فأقامها على العدل والوفاء واتخذ مكيالاً يدعى الجرّاحي فأهلها يتعاملون به إلى اليوم، وأنفذ أمان حبيب بن مسلمة وصلحه لأهل تفليس بكتاب قضى لهم فيه على أرحائهم وكرومهم بمائة درهم في السنة، ثم عبر الكُرّ وقطع نهر السمور وصار إلى الخزر فقتل منهم مقتلة عظيمة وقاتل أهل بلاد حمزين فصالحهم على نقلهم إلى رستاق. ويذكر الكتاب أن عمر كتب إليه ألا يغزو، وأن يتمسك بما في يده، وأنه أمره أن يدعو أهل الذمة إلى الإسلام ويسقط عنهم الجزية إذا أسلموا، فأسلم في خراسان نحو أربعة آلاف ذمي على يده. {cite:salabi-umayyad-state-2020 p.333-343} ويذكر الكتاب أنه ولي خراسان وسجستان لعمر بن عبد العزيز، وأنه قُتل سنة 112هـ في خلافة هشام في حرب الخزر بأذربيجان. {cite:salabi-umayyad-state-2020 p.386} ويذكر الكتاب أنه استُعمل على أرمينية وأذربيجان سنة 104هـ لصد الخزر، فسار إليهم وعبر نهر الكُر، ثم دارت معركة الران سنة 104هـ انتصر فيها على الخزر، وفتح بلنجر وأعاد صاحبها إلى حصنه، وطلب المدد من يزيد فمات قبل وصوله. {cite:salabi-umayyad-state-2020 p.440-443}"
  en: "al-Jarrah ibn Abdallah al-Hakami of Mudhhij; in al-Baladhuri: governing Armenia he settled at Bardha'a, where its conflicting measures and weights were laid before him and he set them on justice and fulness, making a measure called al-Jarrahi its people deal by to this day; he executed Habib ibn Maslama's aman and treaty for Tiflis's people with a writ fixing a hundred dirhams yearly on their mills and vineyards; then he crossed the Kurr, passed the river al-Samur, reached the Khazars and killed them in a great slaughter, and fought the people of Bilad Hamzin compounding to transfer them to a rustaq."
  es: "al-Jarrah ibn Abdallah al-Hakami de Mudhhij; en al-Baladhuri: gobernando Armenia se estableció en Bardha'a, donde sus medidas y pesos conflictivos fueron puestos ante él y los estableció en justicia y plenitud, haciendo una medida llamada al-Jarrahi por la que su gente se rige hasta el día de hoy; ejecutó el aman y tratado de Habib ibn Maslama para la gente de Tiflis con un edicto que fijaba cien dirhams anuales sobre sus molinos y viñedos; luego cruzó el Kurr, pasó el río al-Samur, llegó a los jázaros y los mató en una gran matanza, y luchó contra la gente de Bilad Hamzin, comprometiéndose a transferirlos a un rustaq."
  fr: "al-Jarrah ibn Abdallah al-Hakami de Mudhhij; à al-Baladhuri: gouvernant l'Arménie, il s'établit à Bardha'a, où les mesures et les poids contradictoires de la région lui furent présentés et il les établit sur la justice et la plénitude, créant une mesure appelée al-Jarrahi, utilisée encore aujourd'hui par la population; il fit exécuter l'aman et le traité de Habib ibn Maslama pour les habitants de Tiflis, avec un acte fixant à cent dirhams par an le coût de leurs moulins et vignobles; puis il traversa le Kurr, franchit le fleuve al-Samur, atteignit les Khazars et les massacra, et combattit les habitants de Bilad Hamzin, s'alliant pour les transférer dans un rustaq."
  ur: "الجراح بن عبداللہ الحکمی المذیح؛ البلادوری میں: آرمینیا پر حکومت کرتے ہوئے اس نے بردعا میں قیام کیا، جہاں اس کے متضاد پیمانوں اور وزنوں کو اس کے سامنے رکھا گیا اور اس نے ان کو عدل و انصاف پر قائم کیا، اس نے ایک پیمانہ بنایا جسے الجراحی کہا جاتا ہے اس کے لوگ آج تک اس پر عمل کرتے ہیں۔ اس نے حبیب بن مسلمہ کی امان اور طفلس کے لوگوں کے لیے معاہدہ پر عمل درآمد کیا جس میں ان کی چکیوں اور انگور کے باغوں پر سالانہ سو درہم مقرر کیے گئے تھے۔ اس کے بعد اس نے کُر کو عبور کیا، دریائے سامور سے گزر کر خزر کے پاس پہنچے اور انہیں ایک عظیم قتل عام میں قتل کیا، اور بلاد حمزین کے لوگوں سے جنگ کی تاکہ انہیں رستاق میں منتقل کیا جا سکے۔"
  tr: "Mezhic'ten Al-Jarrah ibn Abdullah al-Hakami; el-Baladhuri'ye göre: Ermeni oldu, Bardha'a'ya yerleşti ve ona farklı ölçü ve terazileri yükseltti, adalet ve sadakat üzerine kurdu. Bugün hâlâ onu kullanan el-Cerrahi adlı bir önlem aldı. Habib ibn Maslama'nın güvenliğini sağladı ve Tifli halkıyla barıştı ve hayvanları ile bağları için yüz dirhemden hükmettiğini belirten bir mektupla barıştı Yılda bir s. Sonra Kur'u geçti, Samur Nehri'ni geçti, Hazarlara ulaştı, burada çok sayıda Hazar öldürdü ve Hamzin halkıyla savaşarak onları Rustaq'a nakletmek için uzlaştırdı. Mektupta, Ömer'in ona saldırmaması, sahip olduklarına sıkı sıkıya tutunması ve zimmileri İslam'a çağırmasını ve eğer dönerlerse cizye'den feragat etmesini emrettiği belirtilir. Yaklaşık dört bin zimmi onun elinden Horasan'a geçti. {cite:Salabi-Umayyad-state-2020 s.333-343} Kitapta, onun Umar ibn Abd al-Aziz döneminde Horasan ve Sijistan valisi olduğu ve 112 Hicri'de Azerbaycan'daki Hazar savaşında Hisham'ın halifeliği sırasında öldürüldüğü belirtilir. {cite:Salabi-Umayyad-state-2020 s.386} Kitap, 104 Hicri'de Ermenistan ve Azerbaycan'a karşı Hazar Ordusunu püskürtmek için kullanıldığını belirtir. Onlara yürüdü ve Kar Nehri'ni geçti. Sonra 104 Hicri'de Rann Muharebesi gerçekleşti; burada Hazarları yendi, Balanger'i ele geçirdi, sahibini kalesine geri götürdü ve Yezid'den takviye istedi, ancak varmadan önce öldü. {cite:Selabi-Umayyad-devleti-2020 s.440-443}"
  id: "Al-Jarrah ibn Abdullah al-Hakami dari Madhhij; menurut al-Baladhuri: Ia menjadi orang Armenia, menetap di Bardha'a, dan mengangkat berbagai ukuran dan timbangan, mendirikannya berdasarkan keadilan dan kesetiaan. Ia mengambil ukuran yang disebut al-Jarrahi, yang rakyatnya masih menggunakannya hingga hari ini. Ia memenuhi keselamatan Habib ibn Maslama dan berdamai dengan rakyat Tiflis melalui surat yang memerintah ternak dan kebun anggur mereka dengan biaya seratus dirham per tahun. Ia kemudian menyeberangi Sungai Kur, menyeberangi Sungai Samur, mencapai Khazar, di mana ia membunuh banyak dari mereka dan melawan rakyat Hamzin, mendamaikan mereka untuk memindahkan mereka ke Rustaq. Surat itu menyebutkan bahwa Umar menulis kepadanya untuk tidak menyerang, memegang teguh apa yang dimilikinya, dan memerintahkannya untuk memanggil dhimmi ke Islam dan melepaskan jizya jika mereka memeluk agama Islam. Sekitar empat ribu dhimmi berpindah ke Khorasan oleh tangannya. {cite:salabi-umayyad-state-2020 hlm.333-343} Buku tersebut menyebutkan bahwa ia pernah menjadi gubernur Khorasan dan Sijistan di bawah Umar ibn Abd al-Aziz, dan bahwa ia tewas pada tahun 112 H selama kekhalifahan Hisham dalam perang Khazar di Azerbaijan. {cite:salabi-umayyad-state-2020 hlm.386} Buku tersebut menyebutkan bahwa ia digunakan melawan Armenia dan Azerbaijan pada tahun 104 H untuk mengusir Khazar. Ia berjalan menuju mereka dan menyeberangi Sungai Kar. Kemudian Pertempuran Rann terjadi pada tahun 104 H, di mana ia mengalahkan Khazar, merebut Balanger, mengembalikan pemiliknya ke bentengnya, dan meminta bala bantuan dari Yazid, tetapi meninggal sebelum tiba. {cite:salabi-umayyad-state-2020 hlm.440-443}"
