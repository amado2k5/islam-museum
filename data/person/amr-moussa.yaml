summary:
  ar: "عمرو موسى (وُلد 3 أكتوبر 1936)، دبلوماسي وسياسي مصري، كان سفير مصر لدى الأمم المتحدة ثم وزير خارجيتها عشر سنوات (1991–2001)، فالأمين العام السادس لجامعة الدول العربية (2001–2011). وبعد ثورة 2011 ترشح لانتخابات الرئاسة سنة 2012، وترأس لجنة الخمسين التي عدّلت الدستور سنة 2013، وما يزال يعمل من مكتبه في القاهرة."
  en: "Amr Moussa (born 3 October 1936) is an Egyptian diplomat and politician who served as Egypt's ambassador to the United Nations and then as its foreign minister for ten years (1991–2001), and as the sixth Secretary-General of the Arab League (2001–2011). After the 2011 revolution he stood in the 2012 presidential election and chaired the Committee of Fifty that amended the constitution in 2013; he still works from his office in Cairo."
  ur: "عمرو موسیٰ (پیدائش 3 اکتوبر 1936ء) مصری سفارت کار اور سیاست دان ہیں۔ وہ اقوام متحدہ میں مصر کے سفیر اور پھر دس سال وزیرِ خارجہ (1991ء–2001ء) رہے، اس کے بعد عرب لیگ کے چھٹے سیکرٹری جنرل (2001ء–2011ء) بنے۔ 2011ء کے انقلاب کے بعد وہ 2012ء کے صدارتی انتخاب میں امیدوار بنے اور 2013ء میں آئین میں ترمیم کرنے والی پچاس رکنی کمیٹی کی صدارت کی؛ وہ اب بھی قاہرہ میں اپنے دفتر سے کام کرتے ہیں۔"
