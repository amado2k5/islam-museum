  ar: "صانعة محتوى بريطانية ومؤسِّسة «الحياة الموثّقة» (The Documented Life)، وهي علامة ومنصة مجتمعية للعافية تتمحور حول العيش القصدي ومنتجها الرئيس دفتر يوميات للتأمل والقصد. فازت في أكتوبر 2026 بجائزة «صانعة المحتوى» في حفل جوائز المسلمين السود بلندن، وتنشر على يوتيوب وإنستغرام باسم @zainabhassanxo."
