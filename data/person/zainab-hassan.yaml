summary:
  ar: "صانعة محتوى بريطانية ومؤسِّسة «الحياة الموثّقة» (The Documented Life)، وهي علامة ومنصة مجتمعية للعافية تتمحور حول العيش القصدي ومنتجها الرئيس دفتر يوميات للتأمل والقصد. فازت في أكتوبر 2026 بجائزة «صانعة المحتوى» في حفل جوائز المسلمين السود بلندن، وتنشر على يوتيوب وإنستغرام باسم @zainabhassanxo."
  en: "British content creator and founder of The Documented Life, a wellness brand and community platform centred on intentional living whose signature product is a journal for reflection and intention. In October 2026 she won the Content Creator award at the Black Muslim Awards in London, and she publishes on YouTube and Instagram as @zainabhassanxo."
  ur: "برطانوی کانٹینٹ کریئیٹر اور «دی ڈاکیومینٹڈ لائف» (The Documented Life) کی بانی، جو ارادی زندگی پر مرکوز ایک ویلنیس برانڈ اور کمیونٹی پلیٹ فارم ہے جس کی نمایاں پروڈکٹ غور و فکر اور ارادے کی ڈائری ہے۔ اکتوبر 2026 میں انہوں نے لندن میں بلیک مسلم ایوارڈز میں «کانٹینٹ کریئیٹر» کا ایوارڈ جیتا، اور وہ یوٹیوب اور انسٹاگرام پر @zainabhassanxo کے نام سے شائع کرتی ہیں۔"
  es: "Creadora de contenido británica y fundadora de The Documented Life, una marca de bienestar y plataforma comunitaria centrada en un estilo de vida consciente, cuyo producto estrella es un diario para la reflexión y la planificación. En octubre de 2026, ganó el premio a la Creadora de Contenido en los Black Muslim Awards de Londres, y publica en YouTube e Instagram como @zainabhassanxo."
  fr: "Créatrice de contenu britannique et fondatrice de The Documented Life, une marque de bien-être et une plateforme communautaire axée sur un mode de vie intentionnel, dont le produit phare est un journal de réflexion et d'intention. En octobre 2026, elle a remporté le prix de la créatrice de contenu aux Black Muslim Awards à Londres. Elle publie sur YouTube et Instagram sous le nom de @zainabhassanxo."
  tr: "Britanyalı bir içerik üreticisi ve 'The Documented Life' adlı, amaçlı yaşam odaklı bir wellness markası ve topluluk platformunun kurucusudur; ana ürünü meditasyon ve niyet için bir günlüktür. Ekim 2026'da Londra'daki Black Muslim Awards töreninde 'İçerik Yaratıcısı' ödülünü kazandı ve YouTube ile Instagram'da @zainabhassanxo adıyla yayın yapıyor."
  id: "Seorang kreator konten asal Inggris dan pendiri 'The Documented Life,' sebuah merek dan platform komunitas untuk kesehatan yang berpusat pada hidup yang penuh tujuan, dan produk utamanya adalah jurnal untuk meditasi dan niat. Pada Oktober 2026, ia memenangkan penghargaan 'Content Creator' di acara Black Muslim Awards di London dan mempublikasikan di YouTube dan Instagram dengan nama @zainabhassanxo."
