summary:
  ar: "ناشط أمريكي إسماعيلي من أصل غوجاراتي هندي، وُلد سنة 1975 في مومباي بالهند ونشأ في غلين إلين بإلينوي. نال الدكتوراه في علم اجتماع الدين من جامعة أكسفورد بمنحة رودس، وأسس سنة 2002 «أكور الشباب بين الأديان» التي صارت «إنترفيث أمريكا»، المنظمة المعنية بالتعاون بين الأديان، ويرأسها إلى اليوم. من كتبه «أعمال الإيمان» (2007) و«أرض مقدسة» (2012) و«نحتاج أن نبني» (2022)، وكان عضوًا في المجلس الاستشاري الافتتاحي للرئيس أوباما لشراكات الأديان والأحياء."
  en: "American Ismaili activist of Gujarati Indian heritage, born in 1975 in Mumbai, India, and raised in Glen Ellyn, Illinois. He took a doctorate in the sociology of religion at Oxford University on a Rhodes Scholarship and founded in 2002 the Interfaith Youth Core, now Interfaith America, the organisation for interfaith cooperation, of which he is president. His books include Acts of Faith (2007), Sacred Ground (2012) and We Need to Build (2022), and he served on President Obama's inaugural Advisory Council on Faith-Based and Neighborhood Partnerships."
  ur: "گجراتی ہندی نژاد امریکی اسماعیلی کارکن، 1975 میں ممبئی، بھارت میں پیدا ہوئے اور الینوائے کے گلین ایلن میں پلے بڑھے۔ انھوں نے روڈس اسکالرشپ پر آکسفورڈ یونیورسٹی سے مذہب کے سماجیات میں ڈاکٹریٹ کی اور 2002 میں «انٹرفیتھ یوتھ کور» قائم کی، جو اب «انٹرفیتھ امریکا» ہے، اور وہ اس کے صدر ہیں۔ ان کی کتابوں میں «اعمالِ ایمان» (2007)، «مقدس زمین» (2012) اور «ہمیں تعمیر کرنا ہے» (2022) شامل ہیں، اور وہ صدر اوباما کی افتتاحی مشاورتی کونسل کے رکن رہے۔"
