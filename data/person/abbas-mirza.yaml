summary:
  ar: "عباس ميرزا ⁦(26 أغسطس 1789 – 25 أكتوبر 1833)⁩ ولي عهد إيران القاجارية في عهد أبيه فتح علي شاه. صار وليًّا للعهد سنة 1799 وحاكمًا على أذربيجان، فقاد جيوش إيران في الحربين مع روسيا ⁦(1804–1813 و1826–1828)⁩ والحرب مع العثمانيين (1821–1823)، وقاد أول تحديث عسكري في إيران، «النظام الجديد»، بمدربين أوروبيين وبعثات طلابية ومطبعة في تبريز. مات بالمرض في مشهد سنة 1833 قبل أبيه بسنة، فانتقل العرش إلى ابنه محمد شاه."
  en: "Abbas Mirza (26 August 1789 – 25 October 1833) was the Qajar crown prince of Iran under his father Fath-Ali Shah. Made crown prince in 1799 and governor of Azerbaijan, he commanded Iran's armies in the Russo-Persian wars of 1804–1813 and 1826–1828 and the Ottoman war of 1821–1823, and led Iran's first military modernization, the Nezam-e Jadid, with European instructors, student missions to Britain and a printing press at Tabriz. He died of illness at Mashhad in 1833, a year before his father, and the throne passed to his son Mohammad Shah."
  fr: "Abbas Mirza (26 août 1789 – 25 octobre 1833) fut le prince héritier qadjar d'Iran sous son père Fath-Ali Chah. Fait prince héritier en 1799 et gouverneur de l'Azerbaïdjan, il commanda les armées iraniennes dans les guerres russo-persanes de 1804–1813 et 1826–1828 et dans la guerre ottomane de 1821–1823, et mena la première modernisation militaire de l'Iran, le Nezam-e Jadid, avec des instructeurs européens, des missions d'étudiants en Grande-Bretagne et une imprimerie à Tabriz. Il mourut de maladie à Mashhad en 1833, un an avant son père, et le trône passa à son fils Mohammad Chah."
  ur: "عباس مرزا ⁦(26 اگست 1789ء – 25 اکتوبر 1833ء)⁩ والد فتح علی شاہ کے عہد میں ایران کے قاجار ولی عہد تھے۔ 1799ء میں ولی عہد اور آذربائیجان کے گورنر مقرر ہوئے؛ روس کے خلاف 1804ء–1813ء اور 1826ء–1828ء کی جنگوں اور 1821ء–1823ء کی عثمانی جنگ میں ایرانی فوج کی قیادت کی، اور یورپی اساتذہ، طلبہ کی بعثات اور تبریز کے چھاپہ خانے کے ساتھ ایران کی پہلی عسکری جدید کاری «نظام جدید» کی رہنمائی کی۔ 1833ء میں مشہد میں بیماری سے وفات پائی، والد سے ایک سال پہلے، اور تخت ان کے بیٹے محمد شاہ کو ملا۔"
  es: "Abbas Mirza (26 de agosto de 1789 - 25 de octubre de 1833) fue príncipe heredero Qajar de Irán bajo el reinado de su padre, Fath-Ali Shah. Nombrado príncipe heredero en 1799 y gobernador de Azerbaiyán, comandó los ejércitos iraníes en las guerras ruso-persas de 1804-1813 y 1826-1828, así como en la guerra otomana de 1821-1823. Además, lideró la primera modernización militar de Irán, el Nezam-e Jadid, con instructores europeos, misiones estudiantiles a Gran Bretaña y una imprenta en Tabriz. Falleció de una enfermedad en Mashhad en 1833, un año antes que su padre, y el trono pasó a su hijo Mohammad Shah."
  tr: "Abbas Mirza (26 Ağustos 1789 – 25 Ekim 1833), babası Feth-Ali Şah'ın hükümdarlığı döneminde Kaçar İran'ının veliaht prensiydi. 1799'da veliaht prens oldu ve Azerbaycan valisi olarak görev yaptı. İran ordularını Rusya ile (1804–1813 ve 1826–1828) ve Osmanlılarla (1821–1823) savaşlarda yönetti. Ayrıca, Avrupa'dan gelen eğitmenler, öğrenci misyonları ve Tebriz'deki bir matbaa ile İran'daki ilk askeri modernizasyon olan \"Yeni Düzen\"e öncülük etti. Babasından bir yıl önce, 1833'te Meşhed'de hastalıktan öldü ve taht oğlu Muhammed Şah'a geçti."
  id: "Abbas Mirza (26 Agustus 1789 – 25 Oktober 1833) adalah Putra Mahkota Iran Qajar selama pemerintahan ayahnya, Fath-Ali Shah. Ia menjadi Putra Mahkota pada tahun 1799 dan gubernur Azerbaijan. Ia memimpin pasukan Iran dalam perang melawan Rusia (1804–1813 dan 1826–1828) dan perang melawan Ottoman (1821–1823). Ia juga mempelopori modernisasi militer pertama di Iran, \"Orde Baru,\" dengan pelatih Eropa, misi mahasiswa, dan percetakan di Tabriz. Ia meninggal karena sakit di Mashhad pada tahun 1833, setahun sebelum ayahnya, dan takhta diwariskan kepada putranya, Mohammad Shah."

