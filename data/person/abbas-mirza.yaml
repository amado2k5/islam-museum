summary:
  ar: "عباس ميرزا (26 أغسطس 1789 – 25 أكتوبر 1833) ولي عهد إيران القاجارية في عهد أبيه فتح علي شاه. صار وليًّا للعهد سنة 1799 وحاكمًا على أذربيجان، فقاد جيوش إيران في الحربين مع روسيا (1804–1813 و1826–1828) والحرب مع العثمانيين (1821–1823)، وقاد أول تحديث عسكري في إيران، «النظام الجديد»، بمدربين أوروبيين وبعثات طلابية ومطبعة في تبريز. مات بالمرض في مشهد سنة 1833 قبل أبيه بسنة، فانتقل العرش إلى ابنه محمد شاه."
  en: "Abbas Mirza (26 August 1789 – 25 October 1833) was the Qajar crown prince of Iran under his father Fath-Ali Shah. Made crown prince in 1799 and governor of Azerbaijan, he commanded Iran's armies in the Russo-Persian wars of 1804–1813 and 1826–1828 and the Ottoman war of 1821–1823, and led Iran's first military modernization, the Nezam-e Jadid, with European instructors, student missions to Britain and a printing press at Tabriz. He died of illness at Mashhad in 1833, a year before his father, and the throne passed to his son Mohammad Shah."
  ur: "عباس مرزا (26 اگست 1789ء – 25 اکتوبر 1833ء) والد فتح علی شاہ کے عہد میں ایران کے قاجار ولی عہد تھے۔ 1799ء میں ولی عہد اور آذربائیجان کے گورنر مقرر ہوئے؛ روس کے خلاف 1804ء–1813ء اور 1826ء–1828ء کی جنگوں اور 1821ء–1823ء کی عثمانی جنگ میں ایرانی فوج کی قیادت کی، اور یورپی اساتذہ، طلبہ کی بعثات اور تبریز کے چھاپہ خانے کے ساتھ ایران کی پہلی عسکری جدید کاری «نظام جدید» کی رہنمائی کی۔ 1833ء میں مشہد میں بیماری سے وفات پائی، والد سے ایک سال پہلے، اور تخت ان کے بیٹے محمد شاہ کو ملا۔"

