  es: "Académico y profesor indonesio, nacido en 1958 en Bandung. Presidente de Muhammadiyah, la segunda organización islámica más grande de Indonesia, desde 2015; Ex profesor de sociología en la Universidad Muhammadiyah de Malang."
  fr: "Universitaire et professeur indonésien, né en 1958 à Bandung. Président de Muhammadiyah, la deuxième plus grande organisation islamique d'Indonésie, depuis 2015; ancien professeur de sociologie à l'Université Muhammadiyah de Malang."
  tr: "1958 yılında Bandung'da doğmuş Endonezyalı bir akademisyen ve profesör. 2015'ten beri Endonezya'nın ikinci en büyük İslami örgütü olan Mohammadiyah Derneği başkanı ve Malang Muhammadiyah Üniversitesi'nde eski sosyoloji profesörü."
  id: "Seorang cendekiawan dan profesor Indonesia, lahir pada tahun 1958 di Bandung. Presiden Asosiasi Mohammadiyah, organisasi Islam terbesar kedua di Indonesia, sejak 2015, dan mantan profesor sosiologi di Universitas Muhammadiyah Malang."
