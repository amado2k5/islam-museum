summary:
  ar: "عالم وأستاذ إندونيسي، وُلد سنة 1958 في باندونغ. رئيس جمعية محمدية، ثاني أكبر منظمة إسلامية في إندونيسيا، منذ 2015، وأستاذ علم الاجتماع بجامعة محمدية مالانغ سابقًا."
  en: "Indonesian scholar and professor, born 1958 in Bandung. Chairman of Muhammadiyah, Indonesia's second-largest Islamic organisation, since 2015; formerly a professor of sociology at the Muhammadiyah University of Malang."
