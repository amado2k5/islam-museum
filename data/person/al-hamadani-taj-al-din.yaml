summary:
  ar: "تاج الدين إبراهيم بن عبد الله الهمداني الحنفي؛ قال في العقد المنظوم: اشتغل بالعلوم وأفنى عنفوان شبابه في ذلك وتلقى من الأفاضل كالمولى صارم كوز وصار منه ملازماً، ثم تنقل في المدارس وكتب حاشية على صدر الشريعة ردّ فيها على المولى ابن كمال باشا في مواضع كثيرة، ثم كتب رسالة جمع فيها من مواضع رده عليه ستة عشر موضعاً وقال في أول ديباجتها: «اعلموا معاشر طلاب اليقين سلام عليكم لا بالتقي الجاهلين أن المختصر الذي سوده الحبر الفاضل والبحر الكامل الشهير بابن كمال باشا شرحه اعته وعمله بالإصلاح والإيضاح مع خروجه عن سنن الفلاح والصلاح باشتماله على تصرفات فاسدة واعتراضات غير واردة من السهو والزلل والخبط والخلل لإتيانه بما لا ينبغي وتحرزه عما ينبغي»، ثم كتب منها نسختين دفع إحداهما إلى الوزير محمد باشا الصوقي وكان ينتسب إليه والثانية إلى الوزير الكبير رستم باشا فلما أخذها طلب قراءتها فلما وصل إلى تشنيعه على المولى المزبور تغيّر غاية التغير بسبب أنه كان قرأ على المولى المزبور وكان ذلك سبباً لخوله، ثم تنبه له الدهر فولي المدارس إلى أن صار مفتياً بأماسية وكان بحر المعارف ولجة العلوم بارعاً في العلوم العقلية والنقلية خصوصاً الفقه، وأخذ عنه الأجلاء وكثر الازدحام عليه، وكتب حاشية على بعض المواضع من شرح المفتاح للسيد يرد فيها على ابن كمال باشا في المواضع التي يدعي التفرد فيها، وله شرح على متن المراح؛ وتوفي في أول الربيعين {cite:shadharat-dhahab p. 369-370}."
  en: "Taj al-Din al-Hamadani — the Hanafi who compiled his sixteen-point refutation of Ibn Kamal Pasha's Sadr al-Shari'a sharh into a risala and delivered copies to vizier Muhammad Pasha and the grand vizier Rustam Pasha, who 'changed utterly' when he read the denunciation; later teacher then mufti of Amasya, 'sea of knowledge, fathom of the sciences'; also a Miftah gloss refuting Ibn Kamal's claimed unique points and a sharh of the Mir'ah {cite:shadharat-dhahab p. 369-370}."
  fr: "Taj al-Din al-Hamadani, hanafite qui réunit en une risala sa réfutation en seize points du commentaire de Sadr al-Shari’a par Ibn Kamal Pacha, et en remit des exemplaires au vizir Muhammad Pacha et au grand vizir Rustam Pacha, qui fut « tout changé » à la lecture de cette dénonciation ; plus tard enseignant puis mufti d’Amasya, « mer de savoir, profondeur des sciences » ; il écrivit aussi une glose du Miftah réfutant les points qu’Ibn Kamal prétendait uniques et un commentaire de la Mir’ah {cite:shadharat-dhahab p. 369-370}."
  es: "Taj al-Din al-Hamadani — el hanafí que compiló su refutación de dieciséis puntos del sharh Sadr al-Shari'a de Ibn Kamal Pasha en una risala y entregó copias al visir Muhammad Pasha y al gran visir Rustam Pasha, quien 'cambió por completo' cuando leyó la denuncia; más tarde maestro y luego muftí de Amasya, 'mar del conocimiento, profundidad de las ciencias'; también un glosario Miftah que refuta los supuestos puntos únicos de Ibn Kamal y un sharh del Mir'ah {cite:shadharat-dhahab p. 369-370}."
  ur: "تاج الدین الحمدانی - وہ حنفی جس نے ابن کمال پاشا کی صدر الشریعہ کی اپنی سولہ نکاتی تردید کو ایک رسالہ میں مرتب کیا اور اس کی کاپیاں وزیر محمد پاشا اور عظیم الشان وزیر رستم پاشا کو فراہم کیں، جنہوں نے تردید پڑھتے ہی 'بالکل بدل دیا'؛ بعد ازاں استاد پھر اماسیہ کے مفتی، 'علم کا سمندر، علوم کی فہم'۔ ابن کمال کے دعویٰ کردہ منفرد نکات کی تردید کرنے والا مفتاح تالیف اور میرہ کی ایک شرح بھی۔ 369-370}۔"
  tr: "Taceddin İbrahim bin Abdullah el-Hemdani el-Hanefi; 'Al-'Iqd al-Muţṣmām'da şöyle demiştir: Bilimlere kendini adadı ve gençliğinin en güzel dönemini ona adadı, Mevle Sarim el-S'u gibi erdemli figürlerden aldı ve onun takipçisi oldu. Sonra okullar arasında dolaştı ve Sadr al-Şeriat üzerine bir kenar not yazdı; burada Mevle İbn Kemal Paşa'yı birçok yerde çürüttü. Daha sonra bir risale yazdı; burada çürütme için on altı kaynağı derledi ve önsözün başında şöyle dedi: \"Ey kesinlik öğrencileri, bilin ki, aleyküm size olsun, dindar cahiller değil, erdemli alim ve ünlü tam ölçü olarak bilinen İbn Kemal Paşa tarafından yazılmış kısaltma, onun ustalığı ve reform ve açıklıkla çalışmasıyla açıklanmıştır; başarı ve doğruluk geleneklerinden saparak, ona uygun olmayanları getirmek ve doğru olanı elde etmek için unutkanlık, kayma, karmaşa ve kusur gibi kabul edilemez itirazlar içererek yapılmıştır.\" Sonra iki kopya yazdı; biri kendisine ait olduğu din adamı Muhammed Paşa El-Suki'ye, diğeri ise büyük bakan Rüstem Paşa'ya verildi. Onları aldığında istedi Dindar ustayı eleştirmeye başladığında, mezmur eğitimi aldığı için değişim büyük ölçüde değişti ve bu onun yeterlilik kazanmasının bir nedeniydi. Daha sonra zaman okulların bir âlimi oldu ve Amasiya'da müftü oldu. Bilgi ustası ve özellikle fıkıh olmak üzere akılcı ve aktarılan bilimlerde ustaydı. Seçkin alimler onun altında eğitim aldı ve sık sık kalabalıktı. El-Seyyid'in El-Miftah üzerine yazdığı tefsirin bazı bölümlerine kenar notları yazdı, İbn Kemal Paşa'yı benzersiz olduğunu iddia ettiği alanlarda çürüttü. Ayrıca El-Marah metnine bir yorum yazdı; iki pınarın başında öldü {atıf:shadharat-dhahab, s. 369-370}."
  id: "Taj al-Din Ibrahim ibn Abdullah al-Hamdani al-Hanafi; ia berkata dalam 'Al-'Iqd al-Muṣṣmām': Ia mendedikasikan dirinya pada ilmu pengetahuan dan mendedikasikan masa mudanya pada ilmu pengetahuan itu, menerima dari tokoh-tokoh berbudi luhur seperti Mawla Sarim al-because dan menjadi pengikutnya. Kemudian ia berpindah ke sekolah-sekolah dan menulis catatan pinggir tentang Sadr al-Shari'ah di mana ia membantah Mawla Ibn Kamal Pasha di banyak tempat. Ia kemudian menulis sebuah risalah di mana ia mengumpulkan enam belas sumber penolakannya dan berkata di awal kata pengantarnya: \"Ketahuilah, wahai murid yang pasti, damai bagi kalian, bukan orang bodoh yang saleh, bahwa ringkasan yang ditulis oleh ulama berbudi luhur dan meter lengkap terkenal yang dikenal sebagai Ibn Kamal Pasha dijelaskan oleh penguasaannya dan karyanya dengan reformasi dan penjelasan, sambil menyimpang dari tradisi kesuksesan dan kebenaran dengan memuat tindakan korup dan keberatan yang tidak dapat diterima seperti pelupa, kesalahan, kebingungan, dan cacat untuk memberinya apa yang tidak pantas dan mencapai yang benar.\" Kemudian ia menulis dua salinan, satu dibayarkan kepada menteri Muhammad Pasha Al-Suqi, yang menjadi miliknya, dan satu lagi kepada menteri agung Rustam Pasha. Ketika menerimanya, ia meminta Ketika ia sampai pada titik mengkritik sang guru yang saleh, perubahan itu berubah drastis karena ia belajar di bawah mazmur, yang menjadi alasan kualifikasinya. Kemudian, waktu menjadi cendekiawan sekolah hingga ia menjadi mufti di Amasiya. Ia adalah ahli ilmu pengetahuan dan ahli ilmu dalam ilmu rasional dan transmisi, terutama hukum. Para ulama terkemuka belajar di bawah bimbingannya, dan ia sering kewalahan. Ia menulis catatan pinggir pada beberapa bagian komentar tentang Al-Miftah oleh Al-Sayyid, membantah Ibn Kamal Pasha di bidang yang ia klaim unik. Ia juga menulis komentar atas teks Al-Marah; ia meninggal pada awal dua mata air {cite:shadharat-dhahab, hlm. 369-370}."
