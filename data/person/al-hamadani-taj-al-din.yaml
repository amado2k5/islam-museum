summary:
  ar: "تاج الدين إبراهيم بن عبد الله الهمداني الحنفي؛ قال في العقد المنظوم: اشتغل بالعلوم وأفنى عنفوان شبابه في ذلك وتلقى من الأفاضل كالمولى صارم كوز وصار منه ملازماً، ثم تنقل في المدارس وكتب حاشية على صدر الشريعة ردّ فيها على المولى ابن كمال باشا في مواضع كثيرة، ثم كتب رسالة جمع فيها من مواضع رده عليه ستة عشر موضعاً وقال في أول ديباجتها: «اعلموا معاشر طلاب اليقين سلام عليكم لا بالتقي الجاهلين أن المختصر الذي سوده الحبر الفاضل والبحر الكامل الشهير بابن كمال باشا شرحه اعته وعمله بالإصلاح والإيضاح مع خروجه عن سنن الفلاح والصلاح باشتماله على تصرفات فاسدة واعتراضات غير واردة من السهو والزلل والخبط والخلل لإتيانه بما لا ينبغي وتحرزه عما ينبغي»، ثم كتب منها نسختين دفع إحداهما إلى الوزير محمد باشا الصوقي وكان ينتسب إليه والثانية إلى الوزير الكبير رستم باشا فلما أخذها طلب قراءتها فلما وصل إلى تشنيعه على المولى المزبور تغيّر غاية التغير بسبب أنه كان قرأ على المولى المزبور وكان ذلك سبباً لخوله، ثم تنبه له الدهر فولي المدارس إلى أن صار مفتياً بأماسية وكان بحر المعارف ولجة العلوم بارعاً في العلوم العقلية والنقلية خصوصاً الفقه، وأخذ عنه الأجلاء وكثر الازدحام عليه، وكتب حاشية على بعض المواضع من شرح المفتاح للسيد يرد فيها على ابن كمال باشا في المواضع التي يدعي التفرد فيها، وله شرح على متن المراح؛ وتوفي في أول الربيعين {cite:shadharat-dhahab p. 369-370}."
  en: "Taj al-Din al-Hamadani — the Hanafi who compiled his sixteen-point refutation of Ibn Kamal Pasha's Sadr al-Shari'a sharh into a risala and delivered copies to vizier Muhammad Pasha and the grand vizier Rustam Pasha, who 'changed utterly' when he read the denunciation; later teacher then mufti of Amasya, 'sea of knowledge, fathom of the sciences'; also a Miftah gloss refuting Ibn Kamal's claimed unique points and a sharh of the Mir'ah {cite:shadharat-dhahab p. 369-370}."
died: { edtf: "1565-10~", hijri: "0973-03~", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في أول الربيعين {cite:shadharat-dhahab p. 370}؛ التحويل مشتق", sources: [source/shadharat-dhahab] }
