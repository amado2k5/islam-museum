label:
  ar: أنيال خان صاحب أطرار
  en: Inal Khan, lord of Utrar
summary:
  ar: "أنيال خان، ابن خال السلطان محمد خوارزم شاه وصاحب أطرار؛ وصل إليه بعض التجار من بلاد جنكزخان فعثر على أموالهم ورفع إلى السلطان أنهم عيون على البلاد وليسوا بتجار فأمره بالاحتياط عليهم فأخذ أموالهم وقتلهم خفية، فطالبه جنكزخان بتسليمه فأنزعج السلطان وقتل الرسل، فكان ذلك سبب مسير التتر إلى مملكته."
  en: "Inal Khan, maternal uncle's son of Sultan Muhammad Khwarazmshah and lord of Utrar; when merchants from Genghis Khan's lands arrived he seized their goods and reported them as spies rather than traders, was ordered to hold them and secretly killed them — Genghis Khan demanded his extradition, the sultan recoiled and killed the envoys, and this became the cause of the Tatar march on his realm."
