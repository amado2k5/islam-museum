id: person/inal-khan-utrari
class: person
label:
  ar: أنيال خان صاحب أطرار
  en: Inal Khan, lord of Utrar
  es: "Inal Khan, lord of Utrar"
  fr: "Inal Khan, lord of Utrar"
  ur: "انال خان، اترار کا لارڈ"
summary:
  ar: "أنيال خان، ابن خال السلطان محمد خوارزم شاه وصاحب أطرار؛ وصل إليه بعض التجار من بلاد جنكزخان فعثر على أموالهم ورفع إلى السلطان أنهم عيون على البلاد وليسوا بتجار فأمره بالاحتياط عليهم فأخذ أموالهم وقتلهم خفية، فطالبه جنكزخان بتسليمه فأنزعج السلطان وقتل الرسل، فكان ذلك سبب مسير التتر إلى مملكته."
  en: "Inal Khan, maternal uncle's son of Sultan Muhammad Khwarazmshah and lord of Utrar; when merchants from Genghis Khan's lands arrived he seized their goods and reported them as spies rather than traders, was ordered to hold them and secretly killed them — Genghis Khan demanded his extradition, the sultan recoiled and killed the envoys, and this became the cause of the Tatar march on his realm."
  es: "Inal Khan, hijo del tío materno del sultán Muhammad Khwarazmshah y señor de Utrar, cuando llegaron mercaderes de las tierras de Genghis Khan, confiscó sus mercancías y los denunció como espías en lugar de comerciantes, recibió la orden de retenerlos y los asesinó en secreto. Genghis Khan exigió su extradición, el sultán reaccionó con indignación y mató a los enviados, lo que provocó la marcha tártara sobre su reino."
  fr: "Inal Khan, fils de l'oncle maternel du sultan Muhammad Khwarezmshah et seigneur d'Utrar, s'empara des marchandises de marchands venus des terres de Gengis Khan et les dénonça comme des espions plutôt que comme des commerçants. On lui ordonna de les retenir et il les tua secrètement. Gengis Khan exigea son extradition, le sultan, furieux, fit tuer les envoyés, ce qui déclencha la marche des Tatars sur son royaume."
  ur: "انال خان، سلطان محمد خوارزم شاہ کے ماموں کے بیٹے اور اترار کے آقا؛ جب چنگیز خان کی سرزمین کے سوداگر پہنچے تو اس نے ان کا سامان قبضے میں لے لیا اور انہیں تاجروں کے بجائے جاسوس بتایا، انہیں پکڑنے اور خفیہ طور پر قتل کرنے کا حکم دیا گیا- چنگیز خان نے اس کی حوالگی کا مطالبہ کیا، سلطان نے پیچھے ہٹ کر سفیروں کو قتل کر دیا، اور یہ تاتاریوں کی سلطنت پر چڑھائی کا سبب بنا۔"
