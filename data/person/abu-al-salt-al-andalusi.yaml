summary:
  ar: "أبو الصلت أمية بن عبد العزيز بن أبي الصلت الأندلسي الداني؛ ولد بدانية نحو سنة ثمانين وأربعمائة وأخذ العلم عن جماعة من أهل الأندلس كأبي الوليد الباجي، وقدم الإسكندرية سنة تسع وثمانين وأربعمائة، فنزهه الأفضل شاهنشاه أمير الجيوش عن مصر سنة خمس وخمسمائة، وصنَّف وهو في اعتقاله رسالة العمل بالأسطرلاب وكتاب الوجيز في علم الهيئة وكتاب الأدوية المفردة وكتاباً في المنطق سمَّاه متعة الذهن وكتاباً سمَّاه الانتصار في الرد على علي بن رضوان، ثم انتقل إلى المهدية فتوفي بها يوم الاثنين مستهل سنة تسع وعشرين وخمسمائة {cite:wafayat-ayan}."
  en: "Abu al-Salt Umayya al-Dani — Andalusi physician, astronomer and poet; reached Alexandria in 489, was exiled by al-Afdal Shahanshah in 505, and wrote his astrolabe treatise, the Wajiz on astronomy, the book of simple drugs and a book of logic in captivity; died at Mahdia at the start of 529 {cite:wafayat-ayan}."
