label: { ar: "خليل بن أيبك الصفدي", en: "Khalil ibn Aybak al-Safadi" }
summary:
  ar: "صلاح الدين خليل بن أيبك الصفدي الشافعي المؤرخ والمنشئ؛ أنشأ جواب الملك الصالح إسماعيل بن الناصر محمد على كتاب السلطان أبي الحسن المريني، وأجاز رواية الرسالتين بخطه بعد أن أسمعهما عز الدين أبو يعلى حمزة ابن القاضي قطب الدين موسى بن أحمد الأحمدي في مجلس واحد في ذي القعدة سنة ٧٥٦ بالجامع الأموي بدمشق، واصفاً قراءتهما بأنها أطريت السمع لفصاحتها وأمالت العطف لرجاحتها {cite:nafh-tib-maqqari p. 403}."
  en: "Salah al-Din Khalil ibn Aybak al-Safadi — historian and chancery writer who composed al-Salih Isma'il's reply to the Marinid sultan's letter, and granted ijaza for both after Izz al-Din Abu Ya'la read them in a single session in the Umayyad Mosque of Damascus, Dhu al-Qa'da 756, a reading that 'graced the ear with eloquence' {cite:nafh-tib-maqqari p. 403}."
