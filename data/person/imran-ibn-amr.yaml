  ar: "سيد الأزد وكبيرهم الذي كانت هجرتهم من اليمن على رأيه في سياق الرحيق المختوم؛ تنقلوا في اليمن وأرسلوا الروّاد ثم ساروا نحو الشمال، ونزل هو وبنوه عُمان فهم أزد عُمان."
  en: "Chief and elder of al-Azd on whose counsel the tribe left Yemen in al-Raheeq al-Makhtum's account; they wandered in Yemen sending scouts, then moved north, and he and his sons settled Oman as the Azd of Oman."
  es: "Jefe y anciano de al-Azd, siguiendo el consejo de la tribu que abandonó Yemen según el relato de al-Raheeq al-Makhtum; vagaron por Yemen enviando exploradores, luego se trasladaron al norte, y él y sus hijos se establecieron en Omán como los Azd de Omán."
  fr: "Chef et ancien d'al-Azd sur les conseils duquel la tribu quitta le Yémen selon le récit d'al-Raheeq al-Makhtum; ils errèrent au Yémen en envoyant des éclaireurs, puis se déplacèrent vers le nord, et lui et ses fils s'établirent à Oman en tant qu'Azd d'Oman."
