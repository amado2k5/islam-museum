class: person
label: { ar: "المغيرة بن عبد الرحمن", en: "al-Mughira ibn 'Abd al-Rahman", fr: "al-Mughira ibn 'Abd al-Rahman", es: "al-Mughira ibn 'Abd al-Rahman", ur: "المغیرہ بن عبدالرحمٰن" }
summary:
  ar: "المغيرة بن عبد الرحمن بن الحارث بن هشام بن المغيرة، أبو هاشم، المدني. روى عن أبيه وهشام بن عروة وعبد الله بن سعيد وغيرهم، وروى عنه ابنه عياش ومحرز بن سلمة المدني ويعقوب بن محمد الزهري وغيرهم. قال يعقوب بن شيبة إنه أحد فقهاء المدينة وكان يفتي فيهم، وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10362}"
  en: "al-Mughira ibn 'Abd al-Rahman ibn al-Harith ibn Hisham ibn al-Mughira, Abu Hashim, of Madina. He narrated from his father, Hisham ibn 'Urwa, 'Abd Allah ibn Sa'id and others; his son 'Ayyash, Mahraz ibn Salama of Madina and Ya'qub ibn Muhammad al-Zuhri narrated from him. Ya'qub ibn Shayba called him one of the jurists of Madina who gave fatwas there, and Ibn Hibban listed him among the trustworthy. The heading gives his death as 105 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10362}"
  fr: "Al-Mughira ibn 'Abd al-Rahman ibn al-Harith ibn Hisham ibn al-Mughira, Abu Hashim, de Médine. Il a raconté de son père, Hisham ibn 'Urwa, 'Abd Allah ibn Sa'id et d'autres ; son fils Ayyash, Mahraz ibn Salama de Médine et Ya'qub ibn Muhammad al-Zuhri raconté de lui. Ya'qub ibn Shayba l'a appelé l'un des juristes de Médine qui y a donné des fatwas, et Ibn Hibban l'a classé parmi les dignes de confiance. Le titre donne sa mort en 105 de l’hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10362}"
  es: "Al-Mughira ibn 'Abd al-Rahman ibn al-Harith ibn Hisham ibn al-Mughira, Abu Hashim, de Medina. Narró de su padre, Hisham ibn 'Urwa, 'Abd Allah ibn Sa'id y otros; su hijo 'Ayyash, Mahraz ibn Salama de Medina y Ya'qub ibn Muhammad al-Zuhri narraron de él. Ya'qub ibn Shayba lo llamó uno de los juristas de Medina que emitieron fatuas allí, e Ibn Hibban lo incluyó entre los dignos de confianza. El encabezado indica que murió en el año 105 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10362}"
  ur: "المغیرہ بن عبدالرحمٰن بن الحارث بن ہشام ابن المغیرہ، ابو ہاشم، مدینہ۔ انہوں نے اپنے والد ہشام بن عروہ، عبداللہ بن سعید اور دیگر سے روایت کی ہے۔ ان کے بیٹے عیاش، مہراز بن سلمہ مدینہ اور یعقوب بن محمد الزہری نے ان سے روایت کی ہے۔ یعقوب بن شیبہ نے انہیں مدینہ کے فقہاء میں سے ایک کہا جنہوں نے وہاں فتویٰ دیا اور ابن حبان نے انہیں ثقہ لوگوں میں شمار کیا۔ سرخی ان کی وفات 105ھ بتاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص10362}"
  tr: "El-Muhira ibn Abdülrehman ibn el-Haris bin Hişam ibn el-Muhira, Ebu Haşim, el-Medeni. Babası Hişam ibn Urve, Abdullah ibn Said ve diğerlerinden rivayet etti; oğlu Eyyash, Muharriz ibn Salamah al-Madani, Ya'qub bin Muhammed el-Zuhri ve diğerlerinden rivayet etti. Ya'qub ibn Şeybe, kendisinin Medine'nin hukukçularından biri olduğunu ve onlara fetva verdiğini, İbn Hibban'ın da onu güvenilir kişiler arasında saydığını söyledi. {Alıntı:fiqh-mawsua-Kuwaitiyya-Noor-v3 s.10362}"
  id: "Al-Mughira ibn Abd al-Rahman ibn al-Harith ibn Hisham ibn al-Mughira, Abu Hashim, al-Madani. Ia menceritakan dari ayahnya, Hisham ibn Urwah, Abdullah ibn Sa'id, dan lainnya, serta putranya Ayyash, Muharriz ibn Salamah al-Madani, Ya'qub ibn Muhammad al-Zuhri, dan lainnya menceritakan darinya. Ya'qub ibn Shaybah mengatakan bahwa ia adalah salah satu ahli hukum Madinah dan biasa mengeluarkan fatwa tentang mereka, dan Ibn Hibban menyebutnya sebagai salah satu individu terpercaya. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 hlm.10362}"
