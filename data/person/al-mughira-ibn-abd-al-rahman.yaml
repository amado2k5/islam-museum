summary:
  ar: "المغيرة بن عبد الرحمن بن الحارث بن هشام بن المغيرة، أبو هاشم، المدني. روى عن أبيه وهشام بن عروة وعبد الله بن سعيد وغيرهم، وروى عنه ابنه عياش ومحرز بن سلمة المدني ويعقوب بن محمد الزهري وغيرهم. قال يعقوب بن شيبة إنه أحد فقهاء المدينة وكان يفتي فيهم، وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10362}"
  en: "al-Mughira ibn 'Abd al-Rahman ibn al-Harith ibn Hisham ibn al-Mughira, Abu Hashim, of Madina. He narrated from his father, Hisham ibn 'Urwa, 'Abd Allah ibn Sa'id and others; his son 'Ayyash, Mahraz ibn Salama of Madina and Ya'qub ibn Muhammad al-Zuhri narrated from him. Ya'qub ibn Shayba called him one of the jurists of Madina who gave fatwas there, and Ibn Hibban listed him among the trustworthy. The heading gives his death as 105 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10362}"
