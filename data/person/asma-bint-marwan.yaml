summary:
  ar: "امرأة من بني أمية بن زيد كانت تحت يزيد بن زيد الخطمي ولها خمسة بنين رجال؛ يقول ابن إسحاق إنها نافقت بعد قتل أبي عفك وقالت شعراً تعيب الإسلام وأهله وتحرّض على النبي، فأجابها حسان، وقتلها عمير بن عدي الخطمي ليلاً في بيتها بعد قول النبي: ألا آخذ لي من ابنة مروان؟"
  en: "A woman of Banu Umayya ibn Zayd married to Yazid ibn Zayd of Banu Khatma, with five grown sons; Ibn Ishaq says she showed hypocrisy after Abu Afak's killing and composed verses reviling Islam and its people and inciting against the Prophet, which Hassan answered; Umayr ibn Adi al-Khatmi killed her at night in her house after the Prophet said 'is there no one to deal with the daughter of Marwan for me?'"
