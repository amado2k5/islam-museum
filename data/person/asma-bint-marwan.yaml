roles: [poet]
summary:
  ar: "امرأة من بني أمية بن زيد كانت تحت يزيد بن زيد الخطمي ولها خمسة بنين رجال؛ يقول ابن إسحاق إنها نافقت بعد قتل أبي عفك وقالت شعراً تعيب الإسلام وأهله وتحرّض على النبي، فأجابها حسان، وقتلها عمير بن عدي الخطمي ليلاً في بيتها بعد قول النبي: ألا آخذ لي من ابنة مروان؟"
  en: "A woman of Banu Umayya ibn Zayd married to Yazid ibn Zayd of Banu Khatma, with five grown sons; Ibn Ishaq says she showed hypocrisy after Abu Afak's killing and composed verses reviling Islam and its people and inciting against the Prophet, which Hassan answered; Umayr ibn Adi al-Khatmi killed her at night in her house after the Prophet said 'is there no one to deal with the daughter of Marwan for me?'"
  es: "Una mujer de Banu Umayya ibn Zayd se casó con Yazid ibn Zayd de Banu Khatma y tuvo cinco hijos adultos; Ibn Ishaq dice que mostró hipocresía después del asesinato de Abu Afak y compuso versos que denigraban al Islam y a su gente e incitaban contra el Profeta, a lo que Hassan respondió; Umayr ibn Adi al-Khatmi la mató por la noche en su casa después de que el Profeta dijera: \"¿No hay nadie que se encargue de la hija de Marwan por mí?\"."
  fr: "Une femme de la tribu des Banu Umayya ibn Zayd, mariée à Yazid ibn Zayd de la tribu des Banu Khatma, et mère de cinq fils adultes; selon Ibn Ishaq, elle fit preuve d’hypocrisie après le meurtre d’Abu Afak et composa des versets injurieux envers l’islam et ses fidèles, incitant à la haine contre le Prophète, ce à quoi Hassan répondit; Umayr ibn Adi al-Khatmi la fit assassiner de nuit dans sa maison après que le Prophète eut dit: « N’y a-t-il personne pour s’occuper de la fille de Marwan ? »"
  ur: "بنو امیہ بن زید کی ایک عورت نے بنو خطمہ کے یزید بن زید سے شادی کی جس کے پانچ بڑے بیٹے تھے۔ ابن اسحاق کا کہنا ہے کہ اس نے ابو آفاق کے قتل کے بعد منافقت کا مظاہرہ کیا اور اسلام اور اس کے لوگوں کو گالیاں دینے اور پیغمبر کے خلاف اکسانے والی آیات لکھیں، جس کا حسن نے جواب دیا۔ عمیر بن عدی الخاتمی نے اسے رات کے وقت اس کے گھر میں قتل کر دیا جب نبی نے فرمایا کہ کیا میرے لیے مروان کی بیٹی کا کوئی سودا نہیں ہے؟"
  tr: "Banu Umayyah ibn Zayd ibn Zayd'den bir kadın, Yezid bin Zayd al-Khatmi'nin emrindeydi ve beş oğlu vardı; İbn İshaq, Ebu Afak'ın öldürülmesinden sonra ikiyüzlü olduğunu ve İslam'ı ve halkını eleştiren, Peygamber'e karşı kışkırtıcı şiirler okuduğunu söyler. Hasan ona karşılık verdi ve Umair ibn Adi al-Khatmi, Peygamber'in 'Mervan'ın kızını kendime almamalı mıyım?' demesinden sonra gece evinde onu öldürdü."
  id: "Seorang wanita dari Banu Umayyah ibn Zayd yang berada di bawah Yazid ibn Zayd al-Khatmi dan memiliki lima putra; Ibn Ishaq mengatakan bahwa setelah pembunuhan Abu Afak, dia menjadi munafik dan membacakan puisi yang mengkritik Islam dan umatnya serta menghasut melawan Nabi. Hassan menanggapinya, dan Umair ibn Adi al-Khatmi membunuhnya pada malam hari di rumahnya setelah Nabi berkata: Bukankah aku harus mengambil putri Marwan untuk diriku sendiri?"
