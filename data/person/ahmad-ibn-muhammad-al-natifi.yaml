summary:
  ar: "أحمد بن محمد بن عمر، أبو العباس الناطفي الطبري، فقيه حنفي من أهل الري، نسبته إلى عمل الناطف أو بيعه. قال أمير كاتب: هو من كبار علمائنا العراقيين، تلميذ أبي عبد الله الجرجاني. من تصانيفه «الواقعات»، و«الأجناس والفروق»، و«الهداية»، و«الأحكام»، وكلها في فروع الفقه الحنفي. توفي سنة 446هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  en: "Ahmad ibn Muhammad ibn Umar, Abu al-Abbas al-Natifi al-Tabari, a Hanafi jurist from Rayy, named for making or selling natif (a sweet). Amir Katib called him one of the great scholars of Iraq and a pupil of Abu Abd Allah al-Jurjani. His works, all on Hanafi fiqh, include al-Waqi'at, al-Ajnas wa al-furuq, al-Hidaya and al-Ahkam; he died in 446 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  es: "Ahmad ibn Muhammad ibn Umar, Abu al-Abbas al-Natifi al-Tabari, jurista hanafí de Rayy, conocido por elaborar o vender natif (un dulce). Amir Katib lo consideró uno de los grandes eruditos de Irak y discípulo de Abu Abd Allah al-Jurjani. Sus obras, todas sobre fiqh hanafí, incluyen al-Waqi'at, al-Ajnas wa al-furuq, al-Hidaya y al-Ahkam; falleció en el año 446 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  fr: "Ahmad ibn Muhammad ibn Umar, dit Abu al-Abbas al-Natifi al-Tabari, juriste hanafite originaire de Rayy, doit son nom à la fabrication ou à la vente de natif (une confiserie). Amir Katib le considérait comme l'un des plus grands savants d'Irak et un disciple d'Abu Abd Allah al-Jurjani. Ses ouvrages, tous consacrés au fiqh hanafite, comprennent al-Waqi'at, al-Ajnas wa al-furuq, al-Hidaya et al-Ahkam; il mourut en 446 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  ur: "احمد بن محمد بن عمر، ابو العباس النطفی الطبری، رے سے تعلق رکھنے والے ایک حنفی فقیہ، جس کا نام نطف ⁦(ایک میٹھا)⁩ بنانے یا بیچنے کے لیے رکھا گیا ہے۔ امیر کاتب نے انہیں عراق کے عظیم علماء میں سے ایک اور ابو عبد اللہ الجرجانی کا شاگرد کہا۔ ان کی تصانیف، تمام حنفی فقہ پر ہیں، ان میں الواقعات، الاجناس و الفروق، الہدایہ اور الاحکام شامل ہیں۔ ان کی وفات 446ھ میں ہوئی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3495}"
  tr: "Ahmed ibn Muhammed ibn Ömer, Ebu el-Abbas el-Natif el-Taberi, Rayy'lı bir Hanefi fıkıhçısıydı; adı \"nātif\" (bir tür tatlı) veya onun satışı anlamına gelen kelimeden türemiştir. Amir Katib şöyle demiştir: O, büyük Iraklı âlimlerimizden biriydi, Ebu Abdullah el-Curcani'nin öğrencisiydi. Eserleri arasında \"el-Vakât\" (Olaylar), \"el-Ajnâs ve el-Furuk\" (Kategoriler ve Ayrımlar), \"el-Hidâye\" (Hidayet) ve \"el-Ahkâm\" (Hükümler) bulunmaktadır; bunların hepsi Hanefi fıkıhının dallarıyla ilgilidir. 446 Hicri yılında vefat etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3495}"
  id: "Ahmad ibn Muhammad ibn Umar, Abu al-Abbas al-Natif al-Tabari, seorang ahli hukum Hanafi dari Rayy, namanya berasal dari kata \"nātif\" (sejenis makanan manis) atau penjualannya. Amir Katib berkata: Beliau adalah salah satu ulama besar Irak kita, murid Abu Abdullah al-Jurjani. Di antara karyanya adalah \"al-Waqā'at\" (Peristiwa-peristiwa), \"al-Ajnās wa al-Furuq\" (Kategori dan Perbedaan), \"al-Hidāyah\" (Petunjuk), dan \"al-Ahkām\" (Hukum-hukum), yang semuanya membahas cabang-cabang yurisprudensi Hanafi. Beliau wafat pada tahun 446 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
