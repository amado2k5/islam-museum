summary:
  ar: "أحمد بن محمد بن عمر، أبو العباس الناطفي الطبري، فقيه حنفي من أهل الري، نسبته إلى عمل الناطف أو بيعه. قال أمير كاتب: هو من كبار علمائنا العراقيين، تلميذ أبي عبد الله الجرجاني. من تصانيفه «الواقعات»، و«الأجناس والفروق»، و«الهداية»، و«الأحكام»، وكلها في فروع الفقه الحنفي. توفي سنة 446هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  en: "Ahmad ibn Muhammad ibn Umar, Abu al-Abbas al-Natifi al-Tabari, a Hanafi jurist from Rayy, named for making or selling natif (a sweet). Amir Katib called him one of the great scholars of Iraq and a pupil of Abu Abd Allah al-Jurjani. His works, all on Hanafi fiqh, include al-Waqi'at, al-Ajnas wa al-furuq, al-Hidaya and al-Ahkam; he died in 446 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
