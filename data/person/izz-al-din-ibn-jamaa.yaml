label:
  ar: "عز الدين بن جماعة"
  en: "Izz al-Din ibn Jama'a"
  es: "Izz al-Din ibn Jama'a"
  fr: "Izz al-Din ibn Jama'a"
  ur: "عزالدین ابن جماعۃ"
roles: [muhaddith, qadi]
gender: male
summary:
  ar: "عبد العزيز بن محمد بن إبراهيم ابن جماعة الكناني، عز الدين، حموي الأصل دمشقي المولد ثم مصري، حافظ وقاضي القضاة، ولي قضاء الديار المصرية سنة 739 هـ وجاور بالحجاز ومات بمكة سنة 767 هـ، من كتبه هداية السالك إلى المذاهب الأربعة في المناسك وأنس المحاضرة."
  en: "Abd al-Aziz ibn Muhammad ibn Ibrahim ibn Jama'a al-Kinani, Izz al-Din, of Hama origin, born in Damascus and later of Egypt; a hafiz of hadith and chief judge, he took the judgeship of the Egyptian lands in 739 AH, lived beside the Holy Places in the Hijaz and died in Mecca in 767 AH (1366); his books include Hidayat al-Salik on the rites of the four schools and Uns al-Muhadara."
  es: "Abd al-Aziz ibn Muhammad ibn Ibrahim ibn Jama'a al-Kinani, Izz al-Din, de origen Hama, nacido en Damasco y posteriormente en Egipto; hafiz de hadices y juez principal, asumió el cargo de juez de las tierras egipcias en el año 739 AH, vivió junto a los Lugares Santos en el Hiyaz y murió en La Meca en el año 767 AH (1366); entre sus libros se incluyen Hidayat al-Salik sobre los ritos de las cuatro escuelas y Uns al-Muhadara."
  fr: "Abd al-Aziz ibn Muhammad ibn Ibrahim ibn Jama'a al-Kinani, Izz al-Din, originaire de Hama, né à Damas et plus tard en Égypte; hafiz de hadith et juge en chef, il prit la charge de juge des terres égyptiennes en 739 AH, vécut près des Lieux Saints dans le Hedjaz et mourut à La Mecque en 767 AH (1366); ses livres comprennent Hidayat al-Salik sur les rites des quatre écoles et Uns al-Muhadara."
  ur: "عبد العزیز بن محمد بن ابراہیم ابن جماعۃ الکنانی، عزالدین، حماۃ نژاد، دمشق اور بعد میں مصر میں پیدا ہوئے۔ حدیث کے حافظ اور چیف منصف تھے، انہوں نے 739 ہجری میں مصر کی سرزمین پر قاضی کا عہدہ سنبھالا، حجاز میں مقامات مقدسہ کے پاس مقیم رہے اور 767 ہجری (1366) میں مکہ میں وفات پائی۔ ان کی کتابوں میں چار مکاتب کے عبادات پر ہدایت السلک اور اُنس المحدرہ شامل ہیں۔"
