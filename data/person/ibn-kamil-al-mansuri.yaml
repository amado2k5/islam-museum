summary:
  ar: "شمس الدين ابن كميل المنصوري الشافعي؛ اشتغل كثيراً وحفظ الحاوي ونظم الشعر الفقاق، عرفه ابن حجر سنة أربع وعشرين وحجا جميعاً وكنا نجتمع في السير ونتذاكر في الفتون، وكان يتناوب نيابة الحكم بالمنصورة هو وابن عمه شمس الدين محمد بن خلف بن كميل ويتعاهد السفر للقاهرة في كل سنة مرة أو مرتين وله مدائح نبوية مفلقة وقصائد في جماعة من الأعيان ثم استقل بقضاء المنصورة وضم إليه شلمون ثم زيدة منية سلسيل فباشر ذلك كله وكان مشكور السيرة، مات في ذي القعدة سنة ثمان وأربعين وثمانمائة فجأة وذلك أنه توجه إلى شلمون فنزل في المسجد وله فيه خلوة فوقها طبقة وللطبقة سطح مجاور للمأذنة فاتفق هبوب ريح عاصف في تلك الليلة فصلى الصبح ودخل خلوته فقصف الريح نصف المأذنة فوقع على سطح الطبقة فنزل به إلى سطح الخلوة فنزل الجميع على الخلوة وهو لم يشعر بذلك حتى نزل الجميع عليه ووجد الخشب مصلياً عليه ولم يخدش شيء من جسمه بل تبين أنه مات لعجزه عن التخلص {cite:shadharat-dhahab p. 262-263}."
  en: "Ibn Kamil — Mansura's independent qadi, Ibn Hajar's own hajj companion of 824 ('we talked fiqh on the road'); killed suddenly in Dhu al-Qa'da 848 when a storm snapped the Shalmun mosque's minaret onto his cell — the wood was found propped over him, his body unscratched, dead for want of escape {cite:shadharat-dhahab p. 262-263}."
