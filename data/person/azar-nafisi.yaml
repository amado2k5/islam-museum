summary:
  ar: "كاتبة وأستاذة أدب إنجليزي إيرانية أمريكية، وُلدت في طهران. فُصلت من جامعة طهران سنة 1981 لرفضها الحجاب الإلزامي، وهاجرت إلى الولايات المتحدة سنة 1997، وكتبت «قراءة لوليتا في طهران» (2003) الذي بقي في قائمة نيويورك تايمز للكتب الأكثر مبيعًا 117 أسبوعًا."
  en: "Iranian-American writer and professor of English literature, born in Tehran. Expelled from the University of Tehran in 1981 for refusing the mandatory veil, she emigrated to the United States in 1997 and wrote Reading Lolita in Tehran (2003), which stayed on the New York Times bestseller list for 117 weeks."
  ur: "ایرانی نژاد امریکی مصنفہ اور انگریزی ادب کی پروفیسر، تہران میں پیدا ہوئیں۔ 1981 میں لازمی حجاب سے انکار پر انہیں تہران یونیورسٹی سے برطرف کیا گیا؛ 1997 میں وہ امریکہ منتقل ہوئیں اور «ریڈنگ لولیتا ان تہران» (2003) لکھی، جو نیویارک ٹائمز کی سب سے زیادہ فروخت ہونے والی کتابوں کی فہرست میں 117 ہفتے رہی۔"
  es: "Escritora y profesora de literatura inglesa iraní-estadounidense, nacida en Teherán. Expulsada de la Universidad de Teherán en 1981 por negarse a usar el velo obligatorio, emigró a Estados Unidos en 1997 y escribió Leyendo Lolita en Teherán (2003), que permaneció en la lista de los libros más vendidos del New York Times durante 117 semanas."
  fr: "Écrivaine et professeure de littérature anglaise irano-américaine, née à Téhéran. Expulsée de l'Université de Téhéran en 1981 pour avoir refusé de porter le voile obligatoire, elle a émigré aux États-Unis en 1997 et a écrit Reading Lolita in Tehran (2003), qui est resté sur la liste des best-sellers du New York Times pendant 117 semaines."
  tr: "İran asıllı Amerikalı İngiliz edebiyatı yazarı ve profesörü, Tahran doğumlu. 1981'de zorunlu başörtüsünü reddettiği için Tahran Üniversitesi'nden atıldı, 1997'de Amerika Birleşik Devletleri'ne göç etti ve \"Reading Lolita in Tehran\" (2003) adlı kitabı yazdı; bu kitap New York Times çok satanlar listesinde 117 hafta kaldı."
  id: "Seorang penulis dan profesor sastra Inggris Iran-Amerika, lahir di Teheran. Ia dikeluarkan dari Universitas Teheran pada tahun 1981 karena menolak hijab wajib, berimigrasi ke Amerika Serikat pada tahun 1997, dan menulis \"Reading Lolita in Tehran\" (2003), yang tetap masuk daftar bestseller New York Times selama 117 minggu."
