  ar: "كاتبة وأستاذة أدب إنجليزي إيرانية أمريكية، وُلدت في طهران. فُصلت من جامعة طهران سنة 1981 لرفضها الحجاب الإلزامي، وهاجرت إلى الولايات المتحدة سنة 1997، وكتبت «قراءة لوليتا في طهران» (2003) الذي بقي في قائمة نيويورك تايمز للكتب الأكثر مبيعًا 117 أسبوعًا."
  en: "Iranian-American writer and professor of English literature, born in Tehran. Expelled from the University of Tehran in 1981 for refusing the mandatory veil, she emigrated to the United States in 1997 and wrote Reading Lolita in Tehran (2003), which stayed on the New York Times bestseller list for 117 weeks."
