summary:
  ar: ابن الدعام الذي وجّهه أبوه مع الهادي إلى صعدة في ستة وعشرين فارساً بعد صلح مذاب في جمادى الآخرة 286هـ.
  en: Son of al-Da'am whom his father sent with al-Hadi to Sa'da with twenty-six horsemen after the peace of Madhab in Jumada II 286 AH.
  ur: دعام کا بیٹا جسے اس کے والد نے جمادی الآخرہ 286ھ میں مذاب کی صلح کے بعد چھبیس سواروں کے ساتھ ہادی کے ہمراہ صعدہ بھیجا۔
  es: "Hijo de al-Da'am, a quien su padre envió con al-Hadi a Sa'da con veintiséis caballos después de la paz de Madhab en Jumada II 286 AH."
  fr: "Fils d'al-Da'am que son père envoya avec al-Hadi à Sa'da avec vingt-six chevaux après la paix de Madhab en Jumada II 286 AH."
  tr: "İbn al-Da'm, babasının Mudhab Antlaşması'ndan sonra 286 Hicri Cumedül-Ahhirah'da yirmi altı süvarıyla birlikte Sa'da'ya gönderdiği İbn al-Da'm."
  id: "Ibn al-Da'm, yang dikirim ayahnya bersama al-Hadi ke Sa'dah bersama dua puluh enam penunggang kuda setelah Perjanjian Mudhab di Jumada al-Akhirah tahun 286 H."
