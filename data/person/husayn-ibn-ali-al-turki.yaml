summary:
  ar: "الحسين بن علي التركي، حسين باي الأول (1675–1740)، مؤسس العرش الحسيني بتونس {cite:wikipedia-husayn-ibn-ali-al-turki-ar}. كولوغلي وُلد بالكاف، ابن الضابط الإنكشاري الكريتي الأصل علي تركي وأم تونسية من قبيلة شارن، وترقّى في خدمة أواخر البايات المراديين ثم إبراهيم الشريف، فلما أسر داي الجزائر إبراهيمَ تولّى قيادة الجند التركي وبويع بايًا في 12 تموز 1705 وتسلّم الحكم في 15 تموز {cite:wikipedia-husayn-ibn-ali-al-turki-fr}. وحّد البلاد وبنى المدارس وجامع الجديد ورتّب الخلافة لأبنائه؛ فثار عليه ابن أخيه علي باشا بدعم الجزائر وهزمه في سمنجة في 4 أيلول 1735، وبعد خمس سنوات من الصمود بالقيروان أُسر وقُطع رأسه فيها سنة 1740 — الفرنسية والإيطالية والإسبانية تجعلها 13 أيار والإنجليزية 13 أيلول {cite:wikipedia-husayn-ibn-ali-al-turki-it}."
  en: "Al-Husayn I ibn Ali (1675–1740), Husayn ibn Ali al-Turki, was the founder of the Husainid dynasty of Tunis {cite:wikipedia-husayn-ibn-ali-al-turki-en}. A Kouloughli born at Le Kef, son of the Cretan-born janissary officer Ali Turki and a Tunisian mother of the Charni tribe, he rose through the last Muradid beys' service and Ibrahim Sharif's, and on Ibrahim's capture by the Dey of Algiers took command of the Turkish army and was proclaimed bey on 12 July 1705, taking office on 15 July {cite:wikipedia-husayn-ibn-ali-al-turki-fr}. He unified the country, built madrasas and the El Jedid Mosque, and settled the succession on his sons; his nephew Ali Pasha's revolt, backed by Algiers, defeated him at Smindja on 4 September 1735, and after five years holding out at Kairouan he was captured and beheaded there in 1740 — the French, Italian and Spanish articles give 13 May, the English 13 September {cite:wikipedia-husayn-ibn-ali-al-turki-it}."
  ur: "حسین بن علی الترکی، حسین بای اول ⁦(1675ء–1740ء)⁩، تونس کے حسینی خاندان کے بانی تھے {cite:wikipedia-husayn-ibn-ali-al-turki-ur}۔ کولوغلی، الکاف میں پیدا ہوئے؛ والد کریت نژاد انکشاری افسر علی ترکی اور والدہ شارن قبیلے کی تونسی خاتون تھیں۔ آخری مرادی بایوں اور پھر ابراہیم الشریف کی خدمت میں ترقی کی؛ ابراہیم کو دایِ الجزائر نے قید کیا تو ترک فوج کی کمان سنبھالی اور 12 جولائی 1705ء کو بای قرار پائے، 15 جولائی کو عہدہ سنبھالا {cite:wikipedia-husayn-ibn-ali-al-turki-fr}۔ ملک متحد کیا، مدارس اور جامع الجدید بنوایا اور جانشینی بیٹوں کے لیے طے کی؛ بھتیجے علی پاشا کی الجزائر کی پشت پناہی والی بغاوت نے 4 ستمبر 1735ء کو سمنجہ میں انہیں شکست دی، اور قیروان میں پانچ سال مزاحمت کے بعد 1740ء میں گرفتار ہو کر وہیں سر قلم ہوئے — فرانسیسی، اطالوی و ہسپانوی مضامین 13 مئی اور انگریزی 13 ستمبر بتاتے ہیں {cite:wikipedia-husayn-ibn-ali-al-turki-it}۔"
  es: "Al-Husayn I ibn Ali (1675–1740), Husayn ibn Ali al-Turki, fue el fundador de la dinastía Husainid de Túnez {cite:wikipedia-husayn-ibn-ali-al-turki-en}. Nacido en Le Kef, un Kouloughli, hijo del oficial jenízaro de origen cretense Ali Turki y de una madre tunecina de la tribu Charni, ascendió al servicio de los últimos beys Muradid y de Ibrahim Sharif, y tras la captura de Ibrahim por el Dey de Argel, tomó el mando del ejército turco y fue proclamado bey el 12 de julio de 1705, asumiendo el cargo el 15 de julio {cite:wikipedia-husayn-ibn-ali-al-turki-fr}. Unificó el país, construyó madrasas y la Mezquita El Jedid, y estableció la sucesión en sus hijos; La revuelta de su sobrino Ali Pasha, respaldada por Argel, lo derrotó en Smindja el 4 de septiembre de 1735, y después de cinco años resistiendo en Kairouan fue capturado y decapitado allí en 1740; los artículos en francés, italiano y español dan el 13 de mayo, el inglés el 13 de septiembre {cite:wikipedia-husayn-ibn-ali-al-turki-it}."
  fr: "Al-Husayn Ier ibn Ali (1675-1740), également connu sous le nom de Husayn ibn Ali al-Turki, fut le fondateur de la dynastie husaïde de Tunis. Né à Le Kef, ce Kouloughli était le fils d'Ali Turki, officier janissaire d'origine crétoise, et d'une mère tunisienne de la tribu des Charni. Il gravit les échelons au service des derniers beys muradides et d'Ibrahim Sharif. Après la capture de ce dernier par le dey d'Alger, il prit le commandement de l'armée turque et fut proclamé bey le 12 juillet 1705, entrant en fonction le 15 juillet. Il unifia le pays, fit construire des madrasas et la mosquée El Jedid, et désigna ses fils comme successeurs. La révolte de son neveu Ali Pacha, soutenue par Alger, le vainquit à Smindja le 4 septembre 1735, et après avoir résisté pendant cinq ans à Kairouan, il y fut capturé et décapité en 1740 — les articles français, italiens et espagnols donnent le 13 mai, l'article anglais le 13 septembre {cite:wikipedia-husayn-ibn-ali-al-turki-it}."
  tr: "El-Hüseyin bin Ali el-Turki, Hüseyin Bey I (1675–1740), Tunus'taki Huseyni tahtının kurucusu {kaynak:wikipedia-husayn-ibn-ali-al-turki-ar}. Kologli, Kaf'ta doğdu; Girit kökenli Yeniçeri subayı Ali Turki ve Şarn kabilesinden Tunuslu bir annenin oğluydu. Merhum Muradian beylerine ve ardından İbrahim el-Şerif'e hizmet etmek üzere terfi etti. İbrahim, Cezayir Dey'ini ele geçirdiğinde Türk ordusunun komutasını üstlendi ve 12 Temmuz 1705'te Beya'ya bağlılık yemini etti, 15 Temmuz'da iktidara geldi {cite:wikipedia-husayn-ibn-ali-al-turki-fr}. Ülkeyi birleştirdi, okullar ve yeni bir cami inşa etti, oğulları için halifeliği ayarladı; yeğeni Ali Paşa, Cezayir'in desteğiyle ona karşı isyan etti ve 4 Eylül 1735'te Semanja'da onu yendi. Kairouan'da beş yıl süren direnişten sonra, 1740'ta yakalanıp orada idam edildi — Fransız, İtalyan ve İspanyolca 13 Mayıs, İngilizce ise 13 Eylül {cite:wikipedia-husayn-ibn-ali-al-turki-it}."
  id: "Al-Husayn ibn Ali al-Turki, Husayn Bey I (1675–1740), pendiri takhta Husayni di Tunisia {cite:wikipedia-husayn-ibn-ali-al-turki-ar}. Kologli lahir di Kaf, putra perwira Janissari asal Kreta, Ali Turki, dan ibu Tunisia dari suku Sharn. Ia dipromosikan untuk melayani para bey Muradian yang telah meninggal dan kemudian Ibrahim al-Sharif. Ketika Ibrahim merebut Dey Aljir, ia mengambil alih komando tentara Turki dan bersumpah setia kepada Beya pada 12 Juli 1705, mengambil alih kekuasaan pada 15 Juli {cite:wikipedia-husayn-ibn-ali-al-turki-fr}. Ia menyatukan negara, membangun sekolah dan masjid baru, serta mengatur kekhalifahan untuk putra-putranya; keponakannya Ali Pasha memberontak dengan dukungan Aljazair dan mengalahkannya di Semanja pada 4 September 1735. Setelah lima tahun perlawanan di Kairouan, ia ditangkap dan dipenggal di sana pada tahun 1740 — Prancis, Italia, dan Spanyol menjadikannya 13 Mei, dan Inggris 13 September {cite:wikipedia-husayn-ibn-ali-al-turki-it}."

