summary:
  ar: "الحسين بن علي التركي، حسين باي الأول (1675–1740)، مؤسس العرش الحسيني بتونس {cite:wikipedia-husayn-ibn-ali-al-turki-ar}. كولوغلي وُلد بالكاف، ابن الضابط الإنكشاري الكريتي الأصل علي تركي وأم تونسية من قبيلة شارن، وترقّى في خدمة أواخر البايات المراديين ثم إبراهيم الشريف، فلما أسر داي الجزائر إبراهيمَ تولّى قيادة الجند التركي وبويع بايًا في 12 تموز 1705 وتسلّم الحكم في 15 تموز {cite:wikipedia-husayn-ibn-ali-al-turki-fr}. وحّد البلاد وبنى المدارس وجامع الجديد ورتّب الخلافة لأبنائه؛ فثار عليه ابن أخيه علي باشا بدعم الجزائر وهزمه في سمنجة في 4 أيلول 1735، وبعد خمس سنوات من الصمود بالقيروان أُسر وقُطع رأسه فيها سنة 1740 — الفرنسية والإيطالية والإسبانية تجعلها 13 أيار والإنجليزية 13 أيلول {cite:wikipedia-husayn-ibn-ali-al-turki-it}."
  en: "Al-Husayn I ibn Ali (1675–1740), Husayn ibn Ali al-Turki, was the founder of the Husainid dynasty of Tunis {cite:wikipedia-husayn-ibn-ali-al-turki-en}. A Kouloughli born at Le Kef, son of the Cretan-born janissary officer Ali Turki and a Tunisian mother of the Charni tribe, he rose through the last Muradid beys' service and Ibrahim Sharif's, and on Ibrahim's capture by the Dey of Algiers took command of the Turkish army and was proclaimed bey on 12 July 1705, taking office on 15 July {cite:wikipedia-husayn-ibn-ali-al-turki-fr}. He unified the country, built madrasas and the El Jedid Mosque, and settled the succession on his sons; his nephew Ali Pasha's revolt, backed by Algiers, defeated him at Smindja on 4 September 1735, and after five years holding out at Kairouan he was captured and beheaded there in 1740 — the French, Italian and Spanish articles give 13 May, the English 13 September {cite:wikipedia-husayn-ibn-ali-al-turki-it}."
  ur: "حسین بن علی الترکی، حسین بای اول (1675ء–1740ء)، تونس کے حسینی خاندان کے بانی تھے {cite:wikipedia-husayn-ibn-ali-al-turki-ur}۔ کولوغلی، الکاف میں پیدا ہوئے؛ والد کریت نژاد انکشاری افسر علی ترکی اور والدہ شارن قبیلے کی تونسی خاتون تھیں۔ آخری مرادی بایوں اور پھر ابراہیم الشریف کی خدمت میں ترقی کی؛ ابراہیم کو دایِ الجزائر نے قید کیا تو ترک فوج کی کمان سنبھالی اور 12 جولائی 1705ء کو بای قرار پائے، 15 جولائی کو عہدہ سنبھالا {cite:wikipedia-husayn-ibn-ali-al-turki-fr}۔ ملک متحد کیا، مدارس اور جامع الجدید بنوایا اور جانشینی بیٹوں کے لیے طے کی؛ بھتیجے علی پاشا کی الجزائر کی پشت پناہی والی بغاوت نے 4 ستمبر 1735ء کو سمنجہ میں انہیں شکست دی، اور قیروان میں پانچ سال مزاحمت کے بعد 1740ء میں گرفتار ہو کر وہیں سر قلم ہوئے — فرانسیسی، اطالوی و ہسپانوی مضامین 13 مئی اور انگریزی 13 ستمبر بتاتے ہیں {cite:wikipedia-husayn-ibn-ali-al-turki-it}۔"

