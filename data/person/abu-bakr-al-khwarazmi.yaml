summary:
  ar: "أبو بكر محمد بن العباس الخوارزمي الشاعر المشهور، ويقال له الطبرخزي لأن أباه من خوارزم وأمه من طبرستان فرُكّب له من الاسمين نسبة؛ وهو ابن أخت أبي جعفر محمد بن جرير الطبري صاحب التاريخ؛ أحد الشعراء المجيدين الكبار المشاهير، كان إماماً في اللغة والأنساب؛ أقام بالشام مدة وسكن بنواحي حلب وكان مشاراً إليه في عصره؛ له ديوان رسائل وديوان شعر؛ اشتهرت حكايته مع الصاحب ابن عباد الذي جعل دخول الأدباء عليه موقوفاً على حفظ عشرين ألف بيت من شعر العرب فقال له أبو بكر: هذا القدر من شعر الرجال أم من شعر النساء؟ ثم فارقه غير راض وهجاه فلما بلغ ابن عباد خبر موته أنشد عارضاً بالندم {cite:wafayat-ayan}."
  en: "Abu Bakr al-Khwarazmi (d. 383) — nephew of the historian al-Tabari; master of letters and genealogy, author of a famous diwan of rasa'il and verse; the celebrated anecdote of his riddle to al-Sahib Ibn Abbad ('men's poetry or women's?') and their bitter parting {cite:wafayat-ayan}."
  fr: "Abu Bakr al-Khwarazmi (mort en 383) — neveu de l'historien al-Tabari ; maître des lettres et de la généalogie, auteur d'un célèbre recueil d'épîtres et de vers ; l'anecdote fameuse de sa devinette à al-Sahib Ibn Abbad (« des vers d'hommes ou de femmes ? ») et leur séparation amère {cite:wafayat-ayan}."
  es: "Abu Bakr al-Khwarazmi (m. 383) — sobrino del historiador al-Tabari; maestro de letras y genealogía, autor de un famoso diwan de rasa'il y poesía; la célebre anécdota de su acertijo a al-Sahib Ibn Abbad ('¿poesía de hombres o de mujeres?') y su amarga despedida {cite:wafayat-ayan}."
  ur: "ابو بکر الخوارزمی ⁦(متوفی 383)⁩ - مورخ الطبری کا بھتیجا؛ خطوط و نسب کے ماہر، رسائل اور آیت کے مشہور دیوان کے مصنف؛ الصاحب ابن عباد ⁦('مردوں کی شاعری یا خواتین کی؟')⁩ کے لیے ان کی پہیلی کا مشہور واقعہ اور ان کی تلخ جدائی {حوالہ: وفایت-عیان}۔"
  tr: "Ünlü şair Ebu Bekir Muhammed ibn Abbas el-Harezmi, babası Harezm'den, annesi Taberistan'dan olduğu için bu iki ismin birleştirilmesiyle elde edilen \"el-Tabarkızî\" olarak da anılırdı. Tarihçi Ebu Cafer Muhammed ibn Cerir el-Taberi'nin yeğeniydi. Büyük ve ünlü şairlerden biriydi, dil ve soyağacı konusunda bir imamdı. Bir süre Levant'ta yaşadı ve Halep civarında ikamet etti. Zamanının önde gelen şahsiyetlerinden biriydi. Mektup ve şiir koleksiyonu vardı. Edebiyatçıların girişini yirmi bin Arapça şiir dizesini ezberlemeye bağlayan el-Sahib ibn Abbad ile olan hikayesi meşhurdur. Ebu Bekir ona, \"Bu kadar şiir erkek şiiri mi yoksa kadın şiiri mi?\" diye sormuş, sonra da onu memnuniyetsiz bırakıp alaycı bir şekilde eleştirmiştir. İbn Abbad, ölüm haberini duyunca pişmanlığını dile getiren bir şiir okumuştur."
  id: "Abu Bakr Muhammad ibn al-Abbas al-Khwarizmi, penyair terkenal, juga disebut al-Tabarkhazi karena ayahnya berasal dari Khwarazm dan ibunya dari Tabaristan, sehingga namanya merupakan gabungan dari kedua nama tersebut. Ia adalah keponakan dari Abu Ja'far Muhammad ibn Jarir al-Tabari, seorang sejarawan. Ia adalah salah satu penyair besar dan terkenal, seorang ahli bahasa dan silsilah. Ia tinggal di Levant untuk sementara waktu dan menetap di sekitar Aleppo. Ia adalah tokoh terkemuka pada zamannya. Ia memiliki koleksi surat dan koleksi puisi. Kisahnya dengan al-Sahib ibn Abbad menjadi terkenal, yang menjadikan masuknya tokoh sastra bergantung pada hafalan dua puluh ribu bait puisi Arab. Abu Bakr berkata kepadanya: Apakah jumlah ini puisi laki-laki atau puisi perempuan? Kemudian ia meninggalkannya dengan tidak puas dan menyindirnya. Ketika Ibn Abbad mendengar kabar kematiannya, ia membacakan sebuah puisi yang mengungkapkan penyesalan."
