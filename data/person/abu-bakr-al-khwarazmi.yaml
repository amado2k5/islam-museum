summary:
  ar: "أبو بكر محمد بن العباس الخوارزمي الشاعر المشهور، ويقال له الطبرخزي لأن أباه من خوارزم وأمه من طبرستان فرُكّب له من الاسمين نسبة؛ وهو ابن أخت أبي جعفر محمد بن جرير الطبري صاحب التاريخ؛ أحد الشعراء المجيدين الكبار المشاهير، كان إماماً في اللغة والأنساب؛ أقام بالشام مدة وسكن بنواحي حلب وكان مشاراً إليه في عصره؛ له ديوان رسائل وديوان شعر؛ اشتهرت حكايته مع الصاحب ابن عباد الذي جعل دخول الأدباء عليه موقوفاً على حفظ عشرين ألف بيت من شعر العرب فقال له أبو بكر: هذا القدر من شعر الرجال أم من شعر النساء؟ ثم فارقه غير راض وهجاه فلما بلغ ابن عباد خبر موته أنشد عارضاً بالندم {cite:wafayat-ayan}."
  en: "Abu Bakr al-Khwarazmi (d. 383) — nephew of the historian al-Tabari; master of letters and genealogy, author of a famous diwan of rasa'il and verse; the celebrated anecdote of his riddle to al-Sahib Ibn Abbad ('men's poetry or women's?') and their bitter parting {cite:wafayat-ayan}."
