summary:
  ar: "سياسي تايلندي من يالا، وُلد سنة 1944. كان معلما ومحاضرا جامعيا، فدخل البرلمان سنة 1979 نائبا عن يالا وقاد مجموعة «الوحدة» من نواب الملايو المسلمين عبر سلسلة من الأحزاب؛ وتولى رئاسة مجلس النواب في 1996–2000 ثم في 2023–2025 — أول مسلم تايلندي يتولى رئاسة المجلس — كما تولى نيابة رئاسة الوزراء ووزارات الداخلية والنقل والزراعة."
  en: "Thai politician from Yala, born in 1944. A former teacher and university lecturer, he entered parliament in 1979 for Yala and led the Wahdah group of Malay-Muslim MPs through a succession of parties; he was Speaker of the House of Representatives in 1996–2000 and again in 2023–2025 — the first Thai Muslim to hold the speakership — and also served as deputy prime minister and as interior, transport and agriculture minister."
  ur: "یالا سے تعلق رکھنے والے تھائی سیاست دان، 1944ء میں پیدا ہوئے۔ وہ سابق استاد اور جامعاتی لیکچرار تھے؛ 1979ء میں یالا سے پارلیمنٹ میں داخل ہوئے اور ملائی مسلم ارکان کی «وحدہ» جماعت کی قیادت مختلف جماعتوں میں کرتے رہے؛ وہ 1996ء–2000ء اور پھر 2023ء–2025ء میں ایوانِ نمائندگان کے اسپیکر رہے — اس منصب پر فائز ہونے والے پہلے تھائی مسلمان — اور نائب وزیرِ اعظم اور داخلہ، نقل و حمل اور زراعت کے وزیر بھی رہے۔"
