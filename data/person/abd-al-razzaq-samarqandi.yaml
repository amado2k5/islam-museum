summary:
  ar: "بطاقة أولية لعبد الرزاق السمرقندي، مؤرخ الدولة التيمورية وصاحب مطلع السعدين وسفيرها إلى الهند، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في معجم الأعلام على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Abd al-Razzaq Samarqandi, historian of the Timurids, author of Matla' al-Sa'dayn and envoy to India, named from an open reference description (Wikidata); his al-A'lam entry is not yet checked on the page, so no dates are given."
  fr: "Fiche provisoire d'Abd al-Razzaq Samarqandi, historien des Timourides, auteur du Matla' al-Sa'dayn et envoyé en Inde, nommé d'après une description de référence ouverte (Wikidata) ; sa notice d'al-A'lam n'a pas encore été vérifiée sur la page, si bien qu'aucune date n'est donnée."
  es: "Ficha preliminar de Abd al-Razzaq Samarqandi, historiador de los timúridas, autor de Matla' al-Sa'dayn y enviado a la India, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en al-A'lam aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  ur: "عبدالرزاق سمرقندی، تیموریوں کے مورخ، متلّہ السعدین کے مصنف اور ہندوستان کے سفیر کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے؛ اس کے العالم اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Timurlu devlet tarihçisi, Matla' al-Sa'dayn'ın yazarı ve Hindistan büyükelçisi Abd al-Razzaq al-Samarqandi'nin ön profili, açık bir referans açıklamasında (Wikidata) yer almaktadır. Bu sayfadaki biyografik sözlükteki biyografisi henüz incelenmediğinden, burada tarih verilmemiştir."
  id: "Profil awal Abd al-Razzaq al-Samarqandi, sejarawan negara Timurid, penulis Matla' al-Sa'dayn, dan duta besarnya untuk India, disertakan dalam deskripsi referensi terbuka (Wikidata). Biografinya dalam kamus biografi di halaman ini belum ditinjau, oleh karena itu tidak ada tanggal yang diberikan di sini."
