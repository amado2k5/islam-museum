summary:
  ar: "كونتا حاجي كيشييف (سنة مولده متنازع عليها، بين 1800 و1830 في الأدبيات المرجعية — توفي في 19/31 مايو 1867)، شيخ صوفي شيشاني أسس «الحاجي مريدية»، الفرع الشيشاني للطريقة القادرية، وبشّر باللاعنف أثناء حرب القوقاز؛ اعتُقل في يناير 1864 إثر مصادمة «الخناجر» بين أتباعه في شالي، ومات في منفاه في أوستيوجنا."
  en: "Kunta-Haji Kishiev (birth year contested — the reference literature gives only the range 1800–1830 — died 19/31 May 1867) was a Chechen Sufi sheikh who founded Haji-Muridiyya, the Chechen branch of the Qadiriyya order, and preached non-violence during the Caucasian War. He was arrested in January 1864 after the 'Dagger' clash of his followers at Shali and died in exile at Ustyuzhna."
  ur: "کونتا حاجی کیشیف (سالِ ولادت متنازع — حوالہ جاتی ادب میں صرف 1800 تا 1830 کی حد ملتی ہے — وفات 19/31 مئی 1867) چیچن صوفی شیخ تھے جنہوں نے قادریہ سلسلے کی چیچن شاخ «حاجی مریدیہ» کی بنیاد رکھی اور قفقازی جنگ کے دوران عدم تشدد کی تبلیغ کی۔ جنوری 1864 میں شالی میں اپنے پیروکاروں کی «خنجر» جھڑپ کے بعد گرفتار ہوئے اور اوستیوژنا میں جلاوطنی کے دوران وفات پائی۔"
