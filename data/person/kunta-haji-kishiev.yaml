    note: "Two independent texts attest Kunta-Haji's Qadiriyya affiliation personally. The English article's lead calls him 'a follower of the Qadiriyya Sufi order', and its text records that on his hajj he visited the tomb of Abd al-Qadir al-Jilani in Baghdad and 'became a devoted follower of Qadiriyyah'. The Russian article's lead independently names him a Sufi sheikh and founder of Haji-Muridiyya, 'a variety of the Sufi order Qadiriyya', and its text records that he presumably joined the Qadiriyya order at the time of that hajj. Adherence and order-founding attested in two texts settle the segment as sufi, documented, and the member_of relation to group/qadiriyya is written. The 'Sunni' of the English article's infobox denomination field rests on that infobox alone — Wikidata's religion value is Islam in general — so no Sunni segment is recorded. His own formation was under Naqshbandi teachers (Gezi-Haji of Zandak, per both articles): a teacher's order is not the pupil's affiliation and is not recorded as one."
    sources: [source/wikipedia-kunta-haji-kishiev-en, source/wikipedia-kunta-haji-kishiev-ru, source/wikidata-kunta-haji-kishiev]
