  note: "The birth year is genuinely unsettled, and the Great Russian Encyclopedia's range — between 1800 and 1830 — is the value carried. The Encyclopaedia of Islam (Kemper & Shikhaliev, 2020), followed by the English article's lead and by Wikidata, gives about 1800; Roshchin gives about 1830; the official Chechen tradition, stated in the Chechen article and noted in the Russian article, celebrates 11 July 1812 as his birthday — the queue's 1812 comes from that tradition, not from the scholarship; the English article's infobox year 1821 is supported by no text. He was born at Isti-Su (Melcha-Khi) in Chechnya, by one tradition at Inkho in Dagestan; no entity exists for either village, so no born_in edge is written. No Hijri pairing is possible across this range, so no hijri key is carried."
