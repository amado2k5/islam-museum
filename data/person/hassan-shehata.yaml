summary:
  ar: "لاعب كرة قدم ومدرب مصري، وُلد في كفر الدوار بمحافظة البحيرة سنة 1947. مهاجم لعب للزمالك وكاظمة الكويتي وخاض 52 مباراة دولية مع منتخب مصر، ويُعد من أفضل مهاجمي أفريقيا. اشتهر مدربًا بقيادة منتخب مصر إلى ثلاثة ألقاب متتالية في كأس الأمم الأفريقية (2006 و2008 و2010)، وهو أول مدرب يحقق ثلاثة ألقاب متتالية في البطولة."
  en: "Egyptian footballer and manager, born in Kafr El Dawwar, Beheira in 1947. A forward who played for Zamalek and Kuwait's Kazma and won 52 caps for Egypt, he is regarded as one of Africa's finest forwards. As a manager he led Egypt to three consecutive Africa Cup of Nations titles (2006, 2008, 2010), the first coach to win three AFCON titles in a row."
  ur: "مصری فٹبالر اور مینیجر، 1947 میں کفر الدوار، بحیرہ میں پیدا ہوئے۔ فارورڈ کے طور پر زمالک اور کویت کے کاظمہ کے لیے کھیلے اور مصر کے لیے 52 بین الاقوامی میچ کھیلے۔ بطور مینیجر انہوں نے مصر کو لگاتار تین افریقہ کپ آف نیشنز (2006، 2008، 2010) جتوائے، اور وہ لگاتار تین خطاب جیتنے والے پہلے کوچ بنے۔"
