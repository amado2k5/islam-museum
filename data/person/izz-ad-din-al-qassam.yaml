    note: "FLAG — founder ruling invited. Two families name the school for him personally. (1) A scholarly text tradition: the English article's text, citing Schleifer in Burke (ed.) 1993, p. 166, states that al-Qassam followed the Hanafi school of Sunni Islam {cite:wikipedia-izz-ad-din-al-qassam-en}. The Urdu article's identical sentence carries the same Schleifer citation and is a translation of the same passage, so it is the same source family, not a second attestation {cite:wikipedia-izz-ad-din-al-qassam-ur}. (2) The infobox family: the English infobox gives Sunni Islam and Hanafi, and the Arabic infobox describes him as a Sunni Muslim {cite:wikipedia-izz-ad-din-al-qassam-ar}; Wikidata's religion field likewise gives Sunni Islam, a structured value of the same family {cite:wikidata-izz-ad-din-al-qassam}. Recorded documented on the Sattar Khan and Ali Daei configuration (text tradition plus infobox family); under the stricter doubt-rule reading the infobox family does not count and the value would be unknown — both readings are preserved here. No sufi segment is recorded: the Qadiriyya evidence is his father's local leadership of the order, his own teaching post at a Qadiriyya madrasa where he taught its mystical practices (Schleifer, p. 167), and the infobox tariqa field — family background, teaching activity and one infobox field, which do not attest his personal membership by two sources."
