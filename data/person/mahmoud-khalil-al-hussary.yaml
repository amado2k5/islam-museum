summary:
  ar: "قارئ قرآن مصري وعالم بالقراءات (1917–1980) وُلد في قرية شبرا النملة قرب طنطا. كان أول من سجّل المصحف كاملا بالترتيل ⁦(رواية حفص، 1961)⁩، وسجّل أيضا روايات ورش وقالون والدوري، وتولى مشيخة عموم المقارئ المصرية، ودرّس في الأزهر وألّف اثني عشر كتابا في علوم القرآن."
  en: "Egyptian Qur'an reciter and scholar of the recitations (1917–1980), born at Shubra al-Namla near Tanta. The first reciter to record the complete Qur'an in the murattal style (Hafs, 1961), he also recorded the Warsh, Qalun and Duri recitations, served as Shaykh al-Maqari' of Egypt, taught at al-Azhar and wrote twelve books on Qur'anic sciences."
  ur: "مصری قاری قرآن اور قراءات کے عالم ⁦(1917ء–1980ء)⁩، طنطا کے قریب گاؤں شبرا النملہ میں پیدا ہوئے۔ وہ پہلے قاری تھے جنھوں نے مکمل قرآن ترتیل کے انداز میں ریکارڈ کیا ⁦(روایت حفص، 1961ء)⁩؛ انھوں نے ورش، قالون اور دوری کی روایات بھی ریکارڈ کیں، مصر کے شیخ المقاری رہے، الازہر میں تدریس کی اور علوم قرآن پر بارہ کتابیں لکھیں۔"
  es: "Recitador egipcio del Corán y erudito en sus recitaciones (1917-1980), nacido en Shubra al-Namla, cerca de Tanta. Fue el primer recitador en grabar el Corán completo en el estilo murattal (Hafs, 1961). También grabó las recitaciones Warsh, Qalun y Duri, fue Shaykh al-Maqari' de Egipto, enseñó en al-Azhar y escribió doce libros sobre ciencias coránicas."
  fr: "Récitation du Coran et érudit des récitations (1917-1980), né à Shubra al-Namla, près de Tanta. Premier récitateur à enregistrer l'intégralité du Coran selon le style murattal (Hafs, 1961), il enregistra également les récitations de Warsh, Qalun et Duri, fut cheikh al-Maqari' d'Égypte, enseigna à al-Azhar et écrivit douze ouvrages sur les sciences coraniques."
  tr: "Mısırlı bir Kur'an okuyucusu ve Kur'an okumaları âlimi (1917–1980), Tanta yakınlarındaki Şubra el-Namla köyünde doğdu. Kur'an'ın tamamını okunarak kaydeden ilk kişi oldu (Hafs Rivayeti, 1961) ve ayrıca Warsh, Qalun ve Al-Duri'nin rivayetlerini de kaydetti. Tüm Mısır okuma merkezlerinin şeyhi olarak görev yaptı, El-Ezher'de eğitim aldı ve Kur'an bilimleri üzerine on iki kitap yazdı."
  id: "Seorang pembaca Al-Qur'an Mesir dan ulama bacaan Al-Qur'an (1917–1980), lahir di desa Shubra Al-Namla dekat Tanta. Ia adalah yang pertama merekam seluruh Al-Qur'an dalam pembacaan (Narasi Hafs, 1961), dan juga mencatat riwayat Warsh, Qalun, dan Al-Duri. Ia menjabat sebagai sheikh di semua pusat pembacaan Al-Qur'an Mesir, belajar di Al-Azhar, dan menulis dua belas buku dalam ilmu Al-Qur'an."
