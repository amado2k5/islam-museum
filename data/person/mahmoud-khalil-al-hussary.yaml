summary:
  ar: "قارئ قرآن مصري وعالم بالقراءات (1917–1980) وُلد في قرية شبرا النملة قرب طنطا. كان أول من سجّل المصحف كاملا بالترتيل (رواية حفص، 1961)، وسجّل أيضا روايات ورش وقالون والدوري، وتولى مشيخة عموم المقارئ المصرية، ودرّس في الأزهر وألّف اثني عشر كتابا في علوم القرآن."
  en: "Egyptian Qur'an reciter and scholar of the recitations (1917–1980), born at Shubra al-Namla near Tanta. The first reciter to record the complete Qur'an in the murattal style (Hafs, 1961), he also recorded the Warsh, Qalun and Duri recitations, served as Shaykh al-Maqari' of Egypt, taught at al-Azhar and wrote twelve books on Qur'anic sciences."
  ur: "مصری قاری قرآن اور قراءات کے عالم (1917ء–1980ء)، طنطا کے قریب گاؤں شبرا النملہ میں پیدا ہوئے۔ وہ پہلے قاری تھے جنھوں نے مکمل قرآن ترتیل کے انداز میں ریکارڈ کیا (روایت حفص، 1961ء)؛ انھوں نے ورش، قالون اور دوری کی روایات بھی ریکارڈ کیں، مصر کے شیخ المقاری رہے، الازہر میں تدریس کی اور علوم قرآن پر بارہ کتابیں لکھیں۔"
