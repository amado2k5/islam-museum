label: { ar: "السلطان مسعود بن محمد بن ملكشاه" , ur: "مسعود بن محمد سلجوقی", en: "Mas'ud ibn Muhammad the Seljuk"}
summary:
  ar: "سلطان سلجوقي عراقي، خرج على ابن أخيه داوود بن محمود لما أقيم مكان أبيه سنة خمس وعشرين فاصطلحا على الاشتراك وخطب لمسعود بالسلطنة ببغداد، ثم وقعت بينه وبين الخليفة المسترشد وحشة فظفر به وأسره فأرسل إليه عمه سنجر يأمره بإعادته فقبل الأرض بين يدي الخليفة وأطلقه {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  en: "Iraqi Seljuk sultan; he fought his nephew Dawud to a shared sultanate with khutba at Baghdad, then warred on al-Mustarshid and captured him — till Sanjar's letter made him kiss the ground before the caliph and release him {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  ur: "سلجوقی سلطان جس کا عہد سنجر سے مقابلے اور عباسی خلفاء المسترشد اور الراشد کے ساتھ اقتدار کی کشمکش سے وابستہ تھا۔ {cite:tarikh-khulafa-minhaj-1434}"
