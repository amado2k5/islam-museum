summary:
  ar: "بطاقة أولية لمحمود باشا الأنكلوفيتش، صدر محمد الفاتح الأعظم وقائد الفتح، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Mahmud Pasha Angelović, Mehmed the Conqueror's grand vizier, named from an open reference description (Wikidata); his entry in al-Salabi's history of the Ottoman state is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Mahmud Pasha Angelović, gran visir de Mehmed el Conquistador, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de candidature de Mahmud Pacha Angelović, grand vizir de Mehmed le Conquérant, nommé d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "محمود پاشا اینجلوویچ کے لیے ڈرافٹ کارڈ، فاتح کے عظیم وزیر محمود، جس کا نام ایک کھلے حوالہ سے بیان کیا گیا ہے ⁦(وکی ڈیٹا)⁩؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Mahmud Paşa Ankleviç tarafından hazırlanmış, Büyük Muhammed ve Fetih Komutanı tarafından yayımlanan ön kart ve açık bir referans tanımında (Wikidata) yer almaktadır. Al-Sallabi'nin Osmanlı İmparatorluğu Tarihi adlı eserinin çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan oleh Mahmud Pasha Anklević, dikeluarkan oleh Muhammad yang Agung dan Panglima Penaklukan, dan muncul dalam deskripsi referensi terbuka (Wikidata). Terjemahannya atas Sejarah Kekaisaran Ottoman karya Al-Sallabi belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
