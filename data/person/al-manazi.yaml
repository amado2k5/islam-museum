summary:
  ar: "أبو نصر أحمد بن يوسف السليكي المنازي الكاتب؛ كان من أعيان الفضلاء وأماثل الشعراء، وزر لأبي نصر أحمد بن مروان الكردي صاحب ميافارقين وديار بكر، وترسل إلى القسطنطينية مراراً، وجمع كتباً كثيرة ثم وقفها على جامع ميافارقين وجامع آمد فبقيت بخزائن الجامعين معروفة بكتب المنازي، واجتمع بأبي العلاء المعري بمعرة النعمان {cite:wafayat-ayan}."
  en: "Abu Nasr al-Manazi — poet-katib of Diyarbakir under Ibn Marwan of Mayyafariqin; envoy to Constantinople; endowed his large book collection to the congregational mosques of Mayyafariqin and Amid, where it was still kept as 'the Manazi books'; met al-Ma'arri at Ma'arrat al-Nu'man {cite:wafayat-ayan}."
  fr: "Abu Nasr al-Manazi – poète-katib de Diyarbakir sous Ibn Marwan de Mayyafariqin  ; envoyé à Constantinople  ; a doté sa grande collection de livres aux mosquées congrégationnelles de Mayyafariqin et Amid, où il était encore conservé comme « les livres Manazi » ; a rencontré al-Ma'arri à Ma'arrat al-Nu'man {cite:wafayat-ayan}."
  es: "Abu Nasr al-Manazi — poeta-katib de Diyarbakir bajo Ibn Marwan de Mayyafariqin; enviado a Constantinopla; donó su gran colección de libros a las mezquitas congregacionales de Mayyafariqin y Amid, donde todavía se conservaba como 'los libros de Manazi'; conoció a al-Ma'arri en Ma'arrat al-Nu'man {cite:wafayat-ayan}."
