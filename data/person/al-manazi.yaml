summary:
  ar: "أبو نصر أحمد بن يوسف السليكي المنازي الكاتب؛ كان من أعيان الفضلاء وأماثل الشعراء، وزر لأبي نصر أحمد بن مروان الكردي صاحب ميافارقين وديار بكر، وترسل إلى القسطنطينية مراراً، وجمع كتباً كثيرة ثم وقفها على جامع ميافارقين وجامع آمد فبقيت بخزائن الجامعين معروفة بكتب المنازي، واجتمع بأبي العلاء المعري بمعرة النعمان {cite:wafayat-ayan}."
  en: "Abu Nasr al-Manazi — poet-katib of Diyarbakir under Ibn Marwan of Mayyafariqin; envoy to Constantinople; endowed his large book collection to the congregational mosques of Mayyafariqin and Amid, where it was still kept as 'the Manazi books'; met al-Ma'arri at Ma'arrat al-Nu'man {cite:wafayat-ayan}."
