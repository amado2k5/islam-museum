summary:
  ar: "سيد إنشاء الله خان، المعروف بإنشاء (نحو 1752 – 1817)، شاعر وكاتب هندي بالأردية والفارسية والهندية، من بلاطي دلهي ولكهنؤ. وُلد في مرشد آباد حيث كان أبوه الطبيب مير ماشا الله خان في خدمة نواب البنغال، ولمع في بلاط شاه عالم الثاني ثم في لكهنؤ عند سعادت علي خان. ألّف «درياي لطافت» (1807) أول نحو للغة الأردية، و«راني كيتكي كي كهاني» من أقدم آثار النثر الهندي، وديواناً فيه غزليات وريختي بعدة لغات. توفي في لكهنؤ سنة 1817."
  en: "Syed Insha Allah Khan, known as Insha (c. 1752–1817), was an Indian poet and writer in Urdu, Persian and Hindi at the courts of Delhi and Lucknow. Born at Murshidabad, where his father the physician Mir Masha Allah Khan served the Nawab of Bengal, he shone at the court of Shah Alam II and then at Lucknow under Saadat Ali Khan. His Darya-e-Latafat (1807) is the first grammar of the Urdu language, his Rani Ketki Ki Kahani among the earliest Hindi prose, and his diwan holds ghazals and rekhti in several languages. He died at Lucknow in 1817."
  ur: "سید انشاء اللہ خان انشاء (تقریباً 1752ء – 1817ء) ہندوستانی شاعر اور مصنف تھے جو اردو، فارسی اور ہندی میں لکھتے تھے اور دہلی و لکھنؤ کے درباروں سے وابستہ رہے۔ مرشد آباد میں پیدا ہوئے جہاں ان کے والد طبیب میر ماشا اللہ خان نواب بنگال کی خدمت میں تھے؛ شاہ عالم ثانی کے دربار کے بعد لکھنؤ میں سعادت علی خان کے ہاں مقام پایا۔ ان کی ”دریائے لطافت“ (1807ء) اردو زبان کی پہلی گرامر ہے، ”رانی کیتکی کی کہانی“ ہندی نثر کے اولین نمونوں میں سے ہے، اور ان کے دیوان میں کئی زبانوں میں غزلیں اور ریختی شامل ہے۔ 1817ء میں لکھنؤ میں انتقال ہوا۔"

