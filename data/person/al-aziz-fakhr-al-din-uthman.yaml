label: { ar: "الملك العزيز فخر الدين عثمان", en: "al-Malik al-Aziz Fakhr al-Din Uthman", fr: "Al-Malik al-Aziz Fakhr al-Din Uthman", es: "al-Malik al-Aziz Fakhr al-Din Uthman", ur: "الملک العزیز فخر الدین عثمان" }
summary:
  ar: "الملك العزيز فخر الدين عثمان بن الملك المغيث الأيوبي؛ كان صغير السن فأمره الملك الظاهر بيبرس ولم يزل في خدمته أميراً إلى أن فتح أنطاكية في شهر رمضان سنة ست وستين وستمائة وتوجه من الشام بعد ذلك إلى مصر فلما دخل إليها قبض عليه واعتقله وهو الآن معتقل بقلعة الجبل المذكورة {cite:wafayat-ayan}."
  en: "Al-Malik al-Aziz Fakhr al-Din Uthman — the boy-prince of the Karak line, raised at Baybars' court, then seized on reaching Egypt after the Antioch campaign (666) and held at Qal'at al-Jabal {cite:wafayat-ayan}."
  fr: "Al-Malik al-Aziz Fakhr al-Din Uthman — jeune prince de la branche de Karak, élevé à la cour de Baybars, puis arrêté à son arrivée en Égypte après la campagne d’Antioche (666 H) et détenu à Qal’at al-Jabal {cite:wafayat-ayan}."
  es: "Al-Malik al-Aziz Fakhr al-Din Uthman — el príncipe niño de la línea Karak, criado en la corte de Baybars, luego aprovechó para llegar a Egipto después de la campaña de Antioquía (666) y fue mantenido en Qal'at al-Jabal {cite:wafayat-ayan}."
  ur: "المالک العزیز فخر الدین عثمان - کرک لائن کا لڑکا شہزادہ، جس کی پرورش بیبرس کے دربار میں ہوئی، پھر انطاکیہ مہم (666) کے بعد مصر پہنچنے پر پکڑا گیا اور قلات الجبل میں رکھا گیا۔"
  tr: "Kral Aziz Fahr Din Osman bin Kral Muğit Eyyubi; genç olduğu için Kral Zahir Beybars onu görevlendirdi ve 6666 yılında Ramazan ayında Antakya'yı fethedene kadar prens olarak onun hizmetinde kaldı. Ondan sonra Levant'tan Mısır'a gitti. Mısır'a girdiğinde tutuklandı ve hapsedildi ve şu anda yukarıda adı geçen Dağ Kalesi'nde hapsedilmiştir."
  id: "Raja Al-Aziz Fakhr Al-Din Othman bin Raja Al-Mughith Al-Ayyubi; ia masih muda, sehingga Raja Al-Zahir Baybars memerintahkannya, dan ia tetap mengabdi sebagai pangeran hingga ia menaklukkan Antiokhia pada bulan Ramadan tahun enam ratus enam puluh enam, dan setelah itu ia berangkat dari Levant ke Mesir. Ketika memasuki Mesir, ia ditangkap dan dipenjara, dan sekarang ia dipenjara di Benteng Gunung yang disebutkan di atas {cite:wafayat-ayan}."
