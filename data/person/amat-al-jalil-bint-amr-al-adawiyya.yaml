summary:
  ar: "عابدة من بني عدي بالبصرة؛ يروي ابن الجوزي في «صفة الصفوة» أن عبّاد البصرة اختلفوا في معنى الولاية فاحتكموا إليها، فقالت: ساعات الولي ساعات شغل عن الدنيا، ليس للولي في الدنيا حاجة."
  en: "A devout woman of Banu Adi in Basra; Ibn al-Jawzi's Sifat al-Safwa relates that the ascetics of Basra, disagreeing over what sainthood (wilaya) means, went to her for a ruling, and she said: 'The friend of God's hours are hours busy away from the world; he has no need in the world.'"
  ur: "بصرہ کے بنو عدی کی ایک عابدہ؛ ابن الجوزی کی «صفۃ الصفوہ» کہتی ہے کہ بصرہ کے عابدوں میں ولایت کے مفہوم پر اختلاف ہوا تو وہ ان کے پاس گئے، اور انہوں نے کہا: «ولی کی گھڑیاں دنیا سے بے نیاز مشغولیت کی گھڑیاں ہیں، ولی کو دنیا میں کوئی حاجت نہیں»۔"
