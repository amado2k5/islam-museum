roles: [mystic]
summary:
  ar: "عابدة من بني عدي بالبصرة؛ يروي ابن الجوزي في «صفة الصفوة» أن عبّاد البصرة اختلفوا في معنى الولاية فاحتكموا إليها، فقالت: ساعات الولي ساعات شغل عن الدنيا، ليس للولي في الدنيا حاجة."
  en: "A devout woman of Banu Adi in Basra; Ibn al-Jawzi's Sifat al-Safwa relates that the ascetics of Basra, disagreeing over what sainthood (wilaya) means, went to her for a ruling, and she said: 'The friend of God's hours are hours busy away from the world; he has no need in the world.'"
  ur: "بصرہ کے بنو عدی کی ایک عابدہ؛ ابن الجوزی کی «صفۃ الصفوہ» کہتی ہے کہ بصرہ کے عابدوں میں ولایت کے مفہوم پر اختلاف ہوا تو وہ ان کے پاس گئے، اور انہوں نے کہا: «ولی کی گھڑیاں دنیا سے بے نیاز مشغولیت کی گھڑیاں ہیں، ولی کو دنیا میں کوئی حاجت نہیں»۔"
  es: "Una mujer devota de Banu Adi en Basora; el Sifat al-Safwa de Ibn al-Jawzi relata que los ascetas de Basora, que no se ponían de acuerdo sobre el significado de la santidad (wilaya), acudieron a ella en busca de una resolución, y ella dijo: «Las horas del amigo de Dios son horas ocupadas lejos del mundo; no tiene necesidad del mundo»."
  fr: "Une femme pieuse de Banu Adi à Bassora; le Sifat al-Safwa d'Ibn al-Jawzi rapporte que les ascètes de Bassora, en désaccord sur la signification de la sainteté (wilaya), sont allés la consulter pour obtenir un avis, et elle a dit: « L'ami des heures de Dieu est celui qui est occupé loin du monde; il n'a aucun besoin dans le monde. »"
  tr: "Basra'daki Banu Adi'den bir ibadet eden; İbn al-Jawzi, 'Sifat al-Safwa'da Basra'nın hizmetkarlarının vesayetin anlamı konusunda farklı görüşler yaşadıklarını ve ona başvurduklarını anlatır ve şöyle der: Koruyucunun saatleri, dünyevi işlerden uzaklaşma saatleridir; koruyucunun bu dünyada ihtiyacı yoktur."
  id: "Seorang pemuja dari Banu Adi di Basra; Ibn al-Jawzi menceritakan dalam 'Sifat al-Safwa' bahwa para pelayan Basra berbeda pendapat mengenai arti perwalian dan menggunakannya, dengan mengatakan: Jam-jam penjaga adalah jam-jam pengalihan dari urusan duniawi; penjaga tidak membutuhkan di dunia ini."
