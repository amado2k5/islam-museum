summary:
  ar: "أبو نعيم عبد الملك بن محمد بن عدي الاستراباذي، صاحب الربيع بن سليمان، وروى حديث ابن مسعود «لا تسبوا قريشاً فإن عالمها يملأ الأرض علماً» {cite:tabaqat-fuqaha-abbas-1981 p. 55}. وقال إن المراد بالحديث رجل من علماء هذه الأمة من قريش هو الشافعي {cite:tabaqat-fuqaha-abbas-1981 p. 55}، وهذا قوله هو، لا حكم للمحقق أو للكتاب فيه."
  en: "Abu Nu'aym Abd al-Malik ibn Muhammad ibn Adi al-Istarabadhi, a companion of al-Rabi' ibn Sulayman. He transmitted the hadith of Ibn Mas'ud, 'Do not revile Quraysh, for its learned man fills the earth with knowledge' {cite:tabaqat-fuqaha-abbas-1981 p. 55}. He said that the man meant by the hadith is one of the learned men of this community from Quraysh, namely al-Shafi'i {cite:tabaqat-fuqaha-abbas-1981 p. 55}. This is his own view; neither the editor nor the book passes a ruling on it."
