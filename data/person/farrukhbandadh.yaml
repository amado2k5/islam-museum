  ar: "عند البلاذري: أمير خيل الأعاجم التي لقيت بشير بن سعد الأنصاري على بانقيا فرشق أصحابه بالسهام فحمل عليهم بشير فهزمهم وقتله — ويقال لقيه خالد بنفسه."
  en: "In al-Baladhuri: commander of the Persian cavalry that met Bashir ibn Sa'd al-Ansari at Baniqya; he shot Bashir's men with arrows, Bashir charged and routed them and killed him — though it is said Khalid himself met him."
  es: "En al-Baladhuri: comandante de la caballería persa que se enfrentó a Bashir ibn Sa'd al-Ansari en Baniqya; disparó flechas a los hombres de Bashir, Bashir cargó y los puso en fuga y lo mató, aunque se dice que el propio Khalid se enfrentó a él."
  fr: "Selon al-Baladhuri: commandant de la cavalerie perse qui rencontra Bashir ibn Sa'd al-Ansari à Baniqya; il tira des flèches sur les hommes de Bashir, Bashir chargea, les mit en déroute et le tua — bien que l'on dise que Khalid lui-même l'eut rencontré."
