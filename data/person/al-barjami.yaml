id: person/al-barjami
class: person
label: { ar: "البرجمي كبير العيارين", en: "al-Barjami" }
summary:
  ar: "كبير عيارين بغداد في سنوتي انحلال الدولة البويهية؛ غزا دور أبي الربيع ونهب مخازنها، واتخذ له حصنًا في الأجمة (غيضة خمسة فراسخ) يسكن التل، وكاد يُخطب له في جامع الرصافة «إن خطبت للبرجمي وإلا فلا تخطب لخليفة ولا ملك» فتلقته الأمراء بالهدايا، وضمن عسكر الموصل الأعلى وله سميريتان وعهد، ونهب خان القوارير بباب الطاق؛ حتى أغرقه أصحاب معتمد الدولة بفم الدجيل في السادس عشر من رمضان سنة ٤٢٥ لما أبى أن يخليه بمال، فقُتل أخوه ثأرًا {cite:muntazam-ibn-al-jawzi j.8 p.414-422}."
  en: "Chief of the ayyarun of Baghdad in the two years of the Buyid state's decline; he raided the houses of Abu al-Rabi' and plundered their stores, and made himself a stronghold in the thicket (a reed-bed five farsakhs across), where he lived on al-Tall. He almost had the khutba read for him in the Rusafa mosque, with the words 'preach for al-Barjami, or else preach for no caliph or king', and the amirs met him with gifts. He held the contract for the army of Upper Mosul, owned two boats and a commission, and plundered the Khan al-Qawarir at Bab al-Taq. In the end the followers of Mu'tamid al-Dawla drowned him at the mouth of the Dujayl on 16 Ramadan 425, when he refused to release him for money, and his brother was killed in revenge {cite:muntazam-ibn-al-jawzi j.8 p.414-422}."
