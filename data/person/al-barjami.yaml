id: person/al-barjami
class: person
label: { ar: "البرجمي كبير العيارين", en: "al-Barjami", fr: "Al-Barjami", es: "al-Barjami" }
summary:
  ar: "كبير عيارين بغداد في سنوتي انحلال الدولة البويهية؛ غزا دور أبي الربيع ونهب مخازنها، واتخذ له حصنًا في الأجمة ⁦(غيضة خمسة فراسخ)⁩ يسكن التل، وكاد يُخطب له في جامع الرصافة «إن خطبت للبرجمي وإلا فلا تخطب لخليفة ولا ملك» فتلقته الأمراء بالهدايا، وضمن عسكر الموصل الأعلى وله سميريتان وعهد، ونهب خان القوارير بباب الطاق؛ حتى أغرقه أصحاب معتمد الدولة بفم الدجيل في السادس عشر من رمضان سنة ٤٢٥ لما أبى أن يخليه بمال، فقُتل أخوه ثأرًا {cite:muntazam-ibn-al-jawzi j.8 p.414-422}."
  en: "Chief of the ayyarun of Baghdad in the two years of the Buyid state's decline; he raided the houses of Abu al-Rabi' and plundered their stores, and made himself a stronghold in the thicket (a reed-bed five farsakhs across), where he lived on al-Tall. He almost had the khutba read for him in the Rusafa mosque, with the words 'preach for al-Barjami, or else preach for no caliph or king', and the amirs met him with gifts. He held the contract for the army of Upper Mosul, owned two boats and a commission, and plundered the Khan al-Qawarir at Bab al-Taq. In the end the followers of Mu'tamid al-Dawla drowned him at the mouth of the Dujayl on 16 Ramadan 425, when he refused to release him for money, and his brother was killed in revenge {cite:muntazam-ibn-al-jawzi j.8 p.414-422}."
  fr: "Chef des ayyarun de Bagdad pendant les deux années du déclin de l’État bouyide ; il attaqua les maisons d’Abu al-Rabi’ et pilla leurs réserves, puis s’établit dans un fourré de roseaux large de cinq farsakhs, où il vivait à al-Tall. Il faillit faire prononcer la khutba en son nom à la mosquée de Rusafa : « Prêchez pour al-Barjami, sinon ne prêchez pour aucun calife ni roi », et les émirs le reçurent avec des présents. Il détenait le contrat de l’armée du Haut-Mossoul, possédait deux bateaux et une commission, et pilla le Khan al-Qawarir à Bab al-Taq. Finalement, les partisans de Mu’tamid al-Dawla le noyèrent à l’embouchure du Dujayl le 16 ramadan 425 H, lorsqu’il refusa de le libérer contre de l’argent, et son frère fut tué par vengeance {cite:muntazam-ibn-al-jawzi j.8 p.414-422}."
  es: "Jefe de los ayyarun de Bagdad durante los dos años de decadencia del estado buyí; asaltó las casas de Abu al-Rabi' y saqueó sus almacenes, y se estableció como fortaleza en la espesura (un cañaveral de cinco farsakhs de ancho), donde vivió en al-Tall. Casi logró que se leyera en su honor el sermón en la mezquita de Rusafa, con las palabras «predicad por al-Barjami, o no prediquéis por ningún califa ni rey», y los emires lo recibieron con regalos. Tenía el contrato para el ejército del Alto Mosul, poseía dos barcos y una comisión, y saqueó el Khan al-Qawarir en Bab al-Taq. Finalmente, los seguidores de Mu'tamid al-Dawla lo ahogaron en la desembocadura del Dujayl el 16 de Ramadán de 425, cuando se negó a liberarlo a cambio de dinero, y su hermano fue asesinado en venganza {cite:muntazam-ibn-al-jawzi j.8 p.414-422}."
