summary:
  ar: "كبير عيارين بغداد في سنوتي انحلال الدولة البويهية؛ غزا دور أبي الربيع ونهب مخازنها، واتخذ له حصنًا في الأجمة (غيضة خمسة فراسخ) يسكن التل، وكاد يُخطب له في جامع الرصافة «إن خطبت للبرجمي وإلا فلا تخطب لخليفة ولا ملك» فتلقته الأمراء بالهدايا، وضمن عسكر الموصل الأعلى وله سميريتان وعهد، ونهب خان القوارير بباب الطاق؛ حتى أغرقه أصحاب معتمد الدولة بفم الدجيل في السادس عشر من رمضان سنة ٤٢٥ لما أبى أن يخليه بمال، فقُتل أخوه ثأرًا {cite:muntazam-ibn-al-jawzi j.8 p.414-422}."
