died: { edtf: "1265~", hijri: "0663", calendar: julian, precision: year, status: tradition, derived: true, note: "وفاته في أموات سنة ثلاث وستين وستمائة {cite:shadharat-dhahab vol. 7 p. 544}. Ibn al-Imad says he died in his town at the end of the year, and funeral prayer in absentia was offered for him at Jerusalem on the Feast of Sacrifice and at Damascus on 19 Dhu al-Hijja {cite:shadharat-dhahab vol. 7 p. 545}; the Gregorian year is the museum's conversion.", sources: [source/shadharat-dhahab] }
summary:
  ar: "الزاهد المشهور الحنبلي، صاحب الزاوية بحواري، كان له أتباع ومريدون في كثير من قرى حوران، توفي ببلده في آخر سنة 663 هـ وصلي عليه صلاة الغائب ببيت المقدس ودمشق، وخلفه ولده عبد الله {cite:shadharat-dhahab vol. 7 pp. 544-545}."
  en: "The famous Hanbali ascetic, head of the zawiya at Hawwari, with followers and disciples in many villages of Hawran; died in his town at the end of 663 AH (1265 CE), with funeral prayer in absentia at Jerusalem and Damascus, and was succeeded by his son Abd Allah {cite:shadharat-dhahab vol. 7 pp. 544-545}."
  fr: "Le célèbre ascète hanbalite, chef de la zawiya de Hawwari, avec des partisans et des disciples dans de nombreux villages du Hawran ; mort dans sa ville à la fin de 663 H (1265 ap. J.-C.), avec une prière funéraire en absence à Jérusalem et à Damas, il eut pour successeur son fils Abd Allah {cite:shadharat-dhahab vol. 7 pp. 544-545}."
  es: "El famoso asceta hanbalí, director de la zawiya de Hawwari, con seguidores y discípulos en muchos pueblos de Hawran; murió en su ciudad a finales del año 663 AH (1265 d. C.), con oraciones fúnebres en ausencia en Jerusalén y Damasco, y fue sucedido por su hijo Abd Allah {cite:shadharat-dhahab vol. 7 pp. 544-545}."
  ur: "مشہور حنبلی سنی، حواری میں زاویہ کا سربراہ، حوران کے کئی دیہات میں پیروکاروں اور شاگردوں کے ساتھ؛ 663 ہجری ⁦(1265 عیسوی)⁩ کے آخر میں اپنے قصبے میں وفات پائی، یروشلم اور دمشق میں غائبانہ نماز جنازہ کے ساتھ، اور اس کے بیٹے عبداللہ نے جانشین بنایا۔ 7 صفحہ 544-545}۔"
  tr: "Haveri'deki Zaviye'nin sahibi olan ünlü Hanbeli zahit, Hauran'ın birçok köyünde takipçileri ve müritleri vardı. Hicri 663 yılının sonunda memleketinde vefat etti ve cenaze namazı Kudüs ve Şam'da gıyaben kılındı. Yerine oğlu Abdullah geçti. {Kaynak: Şadharat-dahab cilt 7, s. 544-545}"
  id: "Pertapa Hanbali yang terkenal, pemilik Zawiya di Hawari, memiliki pengikut dan murid di banyak desa di Hauran. Ia meninggal di kampung halamannya pada akhir tahun 663 H, dan salat jenazah secara gaib dilakukan untuknya di Yerusalem dan Damaskus. Ia digantikan oleh putranya Abdullah {cite:shadharat-dhahab vol. 7 pp. 544-545}."
