label: { ar: "عاد بن عوص", en: "Ad ibn Aws", fr: "Ad ibn Aws", es: "Ad ibn Aws", ur: "عد ابن اوس" }
summary:
  ar: "قيل إن أول من ملك عاداً من الملوك عاد بن عوص ثلاثمائة سنة ثم ملك ابن عاد بن عوص، وكان الآخر من ملوكهم الخلجان {cite:muruj-al-dhahab p. 457}. وسار بولده ومن تبعه إلى الأحقاف وأداني الرمل بين عمان وحضرموت واليمن وهو يقول إني أنا عاد الطويل البادي وسام جدي ابن نوح الهادي {cite:muruj-al-dhahab p. 449}"
  en: "Reputed first king of 'Ad — 'Ad ibn 'Aws, three hundred years, succeeded by his son; the last of their kings was al-Khuljan {cite:muruj-al-dhahab p. 457}."
  fr: "Réputé premier roi d'Ad : 'Ad ibn 'Aws, qui régna trois cents ans et eut son fils pour successeur ; le dernier de leurs rois fut al-Khuljan {cite:muruj-al-dhahab p. 457}."
  es: "El supuesto primer rey de 'Ad fue 'Ad ibn 'Aws, quien reinó durante trescientos años, sucedido por su hijo; el último de sus reyes fue al-Khuljan {cite:muruj-al-dhahab p. 457}."
  ur: "عاد کا مشہور پہلا بادشاہ - عاد بن اوس، تین سو سال، اس کا بیٹا جانشین ہوا۔ ان کے آخری بادشاہ الخلجان تھے۔ 457}۔"
  tr: "Rivayete göre, Ad krallarının ilki, üç yüz yıl hüküm süren Ad ibn Aws'tı. Sonra oğlu Ad ibn Aws hüküm sürdü ve son kralları ise el-Halican'dı. {Kaynak: Muruj-al-Dhahab s. 457}. Oğlu ve onu takip edenlerle birlikte el-Ahkaf'a ve Umman, Hadhramaut ile Yemen arasındaki kum tepelerine doğru ilerleyerek, \"Ben Ad'ım, uzun boylu, görünür olanım; Sam ise dedem, Nuh'un oğlu, yol göstericimdir\" dedi. {Kaynak: Muruj-al-Dhahab s. 449}"
  id: "Dikatakan bahwa raja pertama dari dinasti Ad adalah Ad bin Aws, yang memerintah selama tiga ratus tahun. Kemudian putranya, Ad bin Aws, memerintah, dan raja terakhir mereka adalah al-Khalijan {kutip:muruj-al-dhahab hlm. 457}. Ia berbaris bersama putranya dan para pengikutnya ke al-Ahqaf dan bukit pasir di antara Oman, Hadhramaut, dan Yaman, seraya berkata, “Aku adalah Ad, yang tinggi, yang terlihat, dan Sam adalah kakekku, putra Nuh, sang penunjuk jalan” {kutip:muruj-al-dhahab hlm. 449}"
