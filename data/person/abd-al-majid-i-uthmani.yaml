summary:
  ar: "السلطان عبد المجيد الأول؛ تولى الحكم بعد وفاة والده محمود الثاني، وكان ضعيف البنية شديد الذكاء واقعياً رحيماً وهو من أجلّ سلاطين آل عثمان قدراً. وكان خاضعاً لتأثير وزيره رشيد باشا الذي وجد في الغرب مثله، وهو الذي أعد الجيل التالي من الوزراء ورجال الدولة فأسهموا بمساعدته في دفع عجلة التغريب التي بدأها. وفي عهده دارت حركة الإصلاح حول ثلاث نقاط: الاقتباس من الغرب في تنظيم الجيش ونظم الحكم والإدارة، والاتجاه بالمجتمع نحو التشكيل العلماني، والاتجاه نحو مركزية السلطة في استانبول والولايات {cite:dawlat-uthmaniyya-salabi p. 548}."
  en: "Abdülmecid I — Mahmud II's son, 'of slight build, sharp mind, realistic and merciful'; under Mustafa Rashid Pasha's hand the Tanzimat ran on three tracks: Western military and administrative models, secularising the social order, and centralising Istanbul's power over the provinces {cite:dawlat-uthmaniyya-salabi p. 548}."
  fr: "Abdülmecid Ier — fils de Mahmud II, « de constitution frêle, d'esprit vif, réaliste et miséricordieux » ; sous la main de Mustafa Rachid Pacha, les Tanzimat suivirent trois voies : modèles militaires et administratifs occidentaux, sécularisation de l'ordre social, et centralisation du pouvoir d'Istanbul sur les provinces {cite:dawlat-uthmaniyya-salabi p. 548}."
  es: "Abdülmecid I — hijo de Mahmud II, 'de complexión delgada, mente aguda, realista y misericordioso'; bajo la dirección de Mustafa Rashid Pasha, el Tanzimat funcionó en tres líneas: modelos militares y administrativos occidentales, secularización del orden social y centralización del poder de Estambul sobre las provincias {cite:dawlat-uthmaniyya-salabi p. 548}."
  ur: "عبدالمصد اول - محمود دوم کا بیٹا، 'معمولی ساخت، تیز دماغ، حقیقت پسندانہ اور رحمدل'؛ مصطفی راشد پاشا کے ہاتھ میں نظامت تین راستوں پر چلی: مغربی فوجی اور انتظامی ماڈل، سماجی نظام کو سیکولر بنانا، اور صوبوں پر استنبول کے اقتدار کو مرکزی بنانا۔ 548}۔"
  tr: "Sultan Abdülmecid I, babası Mahmud II'nin ölümünden sonra tahta çıktı. Fiziksel olarak zayıf olmasına rağmen son derece zeki, pragmatik ve merhametliydi ve Osmanlı sultanları arasında en saygın olanlardan biriydi. Batı'da muadilini bulan veziri Reşit Paşa'dan büyük ölçüde etkilendi. Reşit Paşa, daha sonra başlattığı Batılılaşma hareketini ilerletmesine yardımcı olacak yeni nesil vezirleri ve devlet adamlarını yetiştirdi. Saltanatı boyunca reform hareketi üç ana noktada yoğunlaştı: ordunun örgütlenmesi ve yönetim ve idari sistemler için Batı modellerinin benimsenmesi; toplumun laik bir yapıya doğru yönlendirilmesi; ve gücün İstanbul ve illerde merkezileştirilmesi."
  id: "Sultan Abdulmejid I naik tahta setelah kematian ayahnya, Mahmud II. Ia lemah secara fisik, tetapi sangat cerdas, pragmatis, dan penyayang, dan termasuk di antara sultan Ottoman yang paling dihormati. Ia sangat dipengaruhi oleh menterinya, Reşit Pasha, yang telah menemukan padanannya di Barat. Reşit Pasha mempersiapkan generasi menteri dan negarawan berikutnya, yang kemudian membantunya dalam memajukan westernisasi yang telah ia mulai. Selama pemerintahannya, gerakan reformasi berpusat pada tiga poin utama: mengadopsi model Barat untuk mengatur tentara dan sistem pemerintahan dan administrasi; mengarahkan masyarakat menuju struktur sekuler; dan memusatkan kekuasaan di Istanbul dan provinsi-provinsi."
