summary:
  ar: "السلطان عبد المجيد الأول؛ تولى الحكم بعد وفاة والده محمود الثاني، وكان ضعيف البنية شديد الذكاء واقعياً رحيماً وهو من أجلّ سلاطين آل عثمان قدراً. وكان خاضعاً لتأثير وزيره رشيد باشا الذي وجد في الغرب مثله، وهو الذي أعد الجيل التالي من الوزراء ورجال الدولة فأسهموا بمساعدته في دفع عجلة التغريب التي بدأها. وفي عهده دارت حركة الإصلاح حول ثلاث نقاط: الاقتباس من الغرب في تنظيم الجيش ونظم الحكم والإدارة، والاتجاه بالمجتمع نحو التشكيل العلماني، والاتجاه نحو مركزية السلطة في استانبول والولايات {cite:dawlat-uthmaniyya-salabi p. 548}."
  en: "Abdülmecid I — Mahmud II's son, 'of slight build, sharp mind, realistic and merciful'; under Mustafa Rashid Pasha's hand the Tanzimat ran on three tracks: Western military and administrative models, secularising the social order, and centralising Istanbul's power over the provinces {cite:dawlat-uthmaniyya-salabi p. 548}."
