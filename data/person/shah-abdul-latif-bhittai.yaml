  fr: "Fiche de conscription de Shah Abdul Latif Bhittai, le plus grand poète soufi sindhi, auteur du Shah Jo Risalo, décédé en 1751; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "شاہ جو رسالو کے سب سے بڑے سندھی صوفی شاعر مصنف شاہ عبداللطیف بھٹائی کے لیے ڈرافٹ کارڈ۔ 1751; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Sindhi Sufi şairinin büyük şairi ve 'Mesaj'ın yazarı Shah Abdul Latif Bahtai'nin ön kartı; kendisi 1751 yılında ölmüştür; önemli şahsiyetlerin sözlükleriyle anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Shah Abdul Latif Bahtai, penyair besar penyair Sufi Sindhi dan penulis 'Pesan' Shah Jo Rasalu, yang meninggal pada tahun 1751 M; ia dikenang oleh kamus tokoh-tokoh terkenal, dan biografinya belum pernah diulas di halaman tersebut."
