  ar: "بطاقة أولية لشاه عبد اللطيف بهتائي، شاعر الصوفية السندي الأكبر صاحب «الرسالة» الشاه جو رسالو، توفي سنة ١٧٥١م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
