  ar: "علي قلي خان زمان (ت. 1567)، نبيل أوزبكي في خدمة المغول، صاحب إقطاع جونبور في عهد أكبر؛ قاتل أفغان الشرق، ثم انضم إلى تمرد النبلاء الأوزبك على أكبر وقُتل في معركة كارا سنة 1567."
  en: "Ali Quli Khan Zaman (d. 1567), an Uzbek noble in Mughal service who held the jagir of Jaunpur under Akbar; he campaigned against the Afghans of the east, then joined the Uzbek nobles' rebellion against Akbar and was killed at the Battle of Kara in 1567."
