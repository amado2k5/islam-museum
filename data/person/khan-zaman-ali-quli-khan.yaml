summary:
  ar: "علي قلي خان زمان ⁦(ت. 1567)⁩، نبيل أوزبكي في خدمة المغول، صاحب إقطاع جونبور في عهد أكبر؛ قاتل أفغان الشرق، ثم انضم إلى تمرد النبلاء الأوزبك على أكبر وقُتل في معركة كارا سنة 1567."
  en: "Ali Quli Khan Zaman (d. 1567), an Uzbek noble in Mughal service who held the jagir of Jaunpur under Akbar; he campaigned against the Afghans of the east, then joined the Uzbek nobles' rebellion against Akbar and was killed at the Battle of Kara in 1567."
  ur: "علی قلی خان زمان ⁦(وفات 1567ء)⁩، مغل خدمت میں ازبک امیر، اکبر کے دور میں جونپور کے جاگیردار؛ مشرق کے افغانوں سے لڑے، پھر اکبر کے خلاف ازبک امراء کی بغاوت میں شامل ہوئے اور 1567ء میں کرا کی جنگ میں قتل ہوئے۔"
  es: "Ali Quli Khan Zaman (fallecido en 1567), un noble uzbeko al servicio de los mogoles que poseía el jagir de Jaunpur bajo el reinado de Akbar; hizo campaña contra los afganos del este, luego se unió a la rebelión de los nobles uzbekos contra Akbar y murió en la batalla de Kara en 1567."
  fr: "Ali Quli Khan Zaman (décédé en 1567), un noble ouzbek au service des Moghols qui détenait le jagir de Jaunpur sous Akbar; il a fait campagne contre les Afghans de l'est, puis a rejoint la rébellion des nobles ouzbeks contre Akbar et a été tué à la bataille de Kara en 1567."
  tr: "Moğollara hizmet eden Özbek soylusu Ali Quli Khan Zaman (ö. 1567), Akbar'ın saltanatı sırasında Jaunpur feodal mülkünü elinde tuttu; Doğu'daki Afganlarla savaştı, ardından Özbek soylularının Ekber'e karşı isyanına katıldı ve 1567'de Kara Muharebesi'nde öldürüldü."
  id: "Ali Quli Khan Zaman (wafat 1567), seorang bangsawan Uzbek yang melayani Mongol, memegang wilayah Jaunpur selama masa pemerintahan Akbar; bertempur melawan orang Afghanistan di Timur, kemudian bergabung dalam pemberontakan bangsawan Uzbek melawan Akbar dan tewas dalam Pertempuran Kara pada tahun 1567."
