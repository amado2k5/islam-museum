    note: "No two independent sources name a school or order for him with the certainty the lane requires, so he is left unclassified (doubt rule). What the sources give, in full: the English article's lead calls him a 'Tijani marabout', without a citation at that point, and the Fula article repeats the phrase in translation from the English, so it is not a second attestation. Behind it stands one source family: Fisher's 1970 study of his early life, which also reports an oral tradition that at Bakel in 1886 he preached an eleven-bead reform of the Tijani dhikr — a report later scholarship on Tijani history calls almost certainly an anachronism, which is doubt on the face of the evidence. The French article, resting on the French archives (Nyambarza 1969), calls him a Muslim scholar and military leader and names no order at all, and his youthful service with El Hadj Omar — whose movement was Tijani — is association and milieu, not an attestation of Lamine personally; he later fought Omar's son's empire as much as the French. The Tijani claim is therefore recorded here as a single-source-family tradition, not as a value."
