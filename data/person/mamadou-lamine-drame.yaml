summary:
  ar: "الحاج ممدو لامين درامي (محمد الأمين، وُلد بين 1835 و1840 – توفي 9 ديسمبر 1887)، مرابط وعالم مسلم سوننكي من غونديورو قرب كايس بمالي الحالية، قاد بين 1885 و1887 سلسلة انتفاضات ضد الحكم الاستعماري الفرنسي وحاول تأسيس دولة سوننكية في أعالي نهر السنغال. تعلم على أبيه القاضي ومعلم القرآن ثم في كازامانس وباكل، وحج بين 1864 و1874، وسجنه عند عودته أحمدو تال ابن الحاج عمر حتى أطلقه ابنه مدني سنة 1885، فحاصر حصن باكل في أبريل 1886 وأخذ بوليباني وسينوديبو، ثم هُزم عند ديانا وتوباكوتا، فقبض عليه موسى مولو ملك فولاده ومات متأثرا بجراحه في الطريق."
  en: "Al-Hajj Mamadou Lamine Drame (Mahmadu Lamine, Muhammad al-Amin; born between 1835 and 1840, died 9 December 1887), a Soninke marabout and Muslim scholar from Goundiourou near Kayes in present-day Mali, who between 1885 and 1887 led a series of revolts against French colonial rule and tried to found a Soninke state on the Upper Senegal. Taught first by his father, a qadi and Qur'an teacher, then in Casamance and at Bakel, he made the hajj between 1864 and 1874; on his return Ahmadu Tall, son of al-Hajj Umar, imprisoned him until Tall's son Madani freed him in 1885. He besieged the French fort at Bakel in April 1886 and took Boulibani and Sénoudébou, was defeated at Diana and Toubakouta, was captured by Musa Molo, king of Fuladu, and died of his wounds on the way back."
  ur: "الحاج ممدو لامین درامے (محمد الامین؛ ولادت 1835ء اور 1840ء کے درمیان – وفات 9 دسمبر 1887ء)، موجودہ مالی کے کایس کے قریب گونڈیورو سے تعلق رکھنے والے سوننکے مرابط اور مسلمان عالم، جنہوں نے 1885ء تا 1887ء فرانسیسی استعماری حکومت کے خلاف بغاوتوں کی قیادت کی اور بالائی سینیگال پر سوننکے ریاست بنانے کی کوشش کی۔ پہلے اپنے والد — قاضی اور قرآن کے استاد — سے، پھر کازامانس اور باکیل میں تعلیم پائی، 1864ء اور 1874ء کے درمیان حج کیا؛ واپسی پر الحاج عمر کے بیٹے احمدو تال نے انہیں قید کر دیا یہاں تک کہ 1885ء میں تال کے بیٹے مدنی نے رہا کیا۔ اپریل 1886ء میں باکیل کے فرانسیسی قلعے کا محاصرہ کیا اور بولیبانی اور سینودےبو لیے، پھر دیانا اور توباکوتا میں شکست کھائی، فولاڈو کے بادشاہ موسیٰ مولو کے ہاتھوں گرفتار ہوئے اور واپسی کے راستے میں زخموں سے جانبر نہ ہو سکے۔"
