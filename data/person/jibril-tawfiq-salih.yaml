  fr: "L'un des poètes notables du Soudan, dont les vers étaient liés à la lutte politique; il figurait parmi les militants du mouvement unioniste qui a mené le soulèvement de 1924 contre le pouvoir colonial; mort en 1386 AH (1966 CE)."
  ur: "سوڈان کے قابل ذکر شاعروں میں سے ایک، جن کی نظم سیاسی جدوجہد سے جڑی ہوئی تھی۔ وہ یونینسٹ تحریک کے ان عسکریت پسندوں میں سے تھے جنہوں نے نوآبادیاتی حکمرانی کے خلاف 1924 کی بغاوت کی قیادت کی تھی۔ وفات 1386ھ ⁦(1966ء)⁩۔"
