  ar: "من شعراء السودان المرموقين، ارتبط شعره بحركة النضال السياسي، وكان من مناضلي حركة الاتحاد الوطنية التي قادت انتفاضة عام 1924 ضد الاستعمار، وتوفي سنة 1386هـ ⁦(1966م)⁩."
  en: "One of the notable poets of Sudan, whose verse was tied to the political struggle; he was among the militants of the Unionist movement that led the 1924 uprising against colonial rule; died 1386 AH (1966 CE)."
