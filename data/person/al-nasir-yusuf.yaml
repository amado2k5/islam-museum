id: person/al-nasir-yusuf
class: person
label: { ar: "الناصر صاحب دمشق" }
summary:
  ar: "صاحب دمشق، أرسل إليه هولاكو بعد أخذ بغداد ثلاثة كتب مهددة فيها أجب ملك البسيطة ولا تقولن قلاعي المانعات ورجالي المقاتلات ونحن إليكم صائرون ولكم الهرب وعلينا الطلب {cite:tarikh-khulafa-minhaj-1434 p. 718-719}."
  en: "Damascus's lord, to whom Hulagu sent the three dread letters after Baghdad's fall {cite:tarikh-khulafa-minhaj-1434 p. 718-719}. Salah al-Din Yusuf b. al-Aziz Muhammad b. al-Zahir Ghazi b. Salah al-Din — born 627, raised to Aleppo's throne at seven (634) while Shams al-Din Lu'lu' and his grandmother Safiyya bint al-Adil governed; he took Damascus without battle in 648 and held it ten years. When Aleppo fell he fled toward Gaza, was taken under aman into Hulagu's service for months, then killed with his brother al-Zahir Ghazi before the khan — his obituary falling under year 660 {cite:shadharat-dhahab p. 298-299, 307-308}."
born: { edtf: "1230", hijri: "0627", calendar: julian, precision: year, status: tradition, derived: true, note: "ولد سنة سبع وعشرين وستمائة {cite:shadharat-dhahab p. 307}." }
died: { edtf: "1261~", hijri: "0659~", calendar: julian, precision: year, status: debated, derived: true, note: "قتل مع أخيه الملك الظاهر غازي بين يدي هلاكو بعد أخذه بالأمان؛ ترجمته في أموات سنة ستين وستمائة {cite:shadharat-dhahab p. 298-299, 306-307}." }
