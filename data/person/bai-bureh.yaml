summary:
  ar: "باي بوريه (15 فبراير 1840 – 24 أغسطس 1908)، حاكم سيراليوني واستراتيجي عسكري ورجل دين مسلم، قاد انتفاضة التمني واللوكو ضد الحكم البريطاني سنة 1898 في شمال سيراليون. وُلد في كاسيه قرب بورت لوكو ابنًا لرجل دين مسلم وزعيم لوكو وأم تاجر تمنية، وتدرب على الحرب في گبندمبو فلُقّب كبَالاي «من لا تتعبه الحرب»، وصار في ستينيات القرن التاسع عشر وسبعينياته أقوى محاربي الشمال يعمل على إقامة الممارسات الإسلامية الصحيحة، وصدّ غزو السوسو سنة 1882، وتُوّج سنة 1886. رفض ضريبة الأكواخ البريطانية وقاد حربها سنة 1898 فصمد بأسلوب حرب العصابات أشهرًا، واستسلم في 11 نوفمبر 1898 فنفي إلى ساحل الذهب، ثم أُعيد سنة 1905 إلى زعامة كاسيه وبقي حتى وفاته؛ وهو اليوم بطل سيراليون الأكبر، وتمثاله في وسط فريتاون وصورته على ورقة الليون الواحد."
  en: "Bai Bureh (15 February 1840 – 24 August 1908), a Sierra Leonean ruler, military strategist and Muslim cleric who led the Temne and Loko uprising against British rule in 1898 in northern Sierra Leone. Born at Kasseh near Port Loko, son of a Muslim cleric and Loko chief and a Temne trader mother, he was trained as a warrior at Gbendembu and nicknamed Kebalai, 'one who doesn't tire of war'; in the 1860s and 1870s he became the north's foremost war leader, fighting to establish correct Islamic practices, defeating the Susu invasion of 1882, and was crowned in 1886. He refused the British hut tax and led the Hut Tax War of 1898, holding off the colonial forces with guerrilla tactics for months; he surrendered on 11 November 1898, was exiled to the Gold Coast, was brought back in 1905 and reinstated as chief of Kasseh until his death. He is remembered as Sierra Leone's greatest hero, with a statue in central Freetown and his portrait on the one-leone banknote."
  ur: "بائی بورے (15 فروری 1840ء – 24 اگست 1908ء)، سیرا لیون کے حکمران، عسکری ماہر اور مسلمان عالم، جنہوں نے 1898ء میں شمالی سیرا لیون میں برطانوی راج کے خلاف تمنے اور لوکو بغاوت کی قیادت کی۔ وہ پورٹ لوکو کے قریب کاسے میں ایک مسلمان عالم اور لوکو سردار کے ہاں پیدا ہوئے، گبندمبو میں جنگی تربیت پائی اور «کبالائی» یعنی «جو جنگ سے نہیں تھکتا» کا لقب پایا؛ 1860ء اور 1870ء کی دہائیوں میں وہ درست اسلامی رسوم کے قیام کے لیے لڑتے ہوئے شمال کے سب سے بڑے جنگجو بنے، 1882ء میں سوسو حملہ پسپا کیا اور 1886ء میں تاج پوشی ہوئی۔ انہوں نے برطانوی جھونپڑی ٹیکس ماننے سے انکار کر کے 1898ء کی جنگ کی قیادت کی اور مہینوں گوریلا حربوں سے مزاحمت کی؛ 11 نومبر 1898ء کو ہتھیار ڈالے، گولڈ کوسٹ جلاوطن ہوئے، 1905ء میں واپس آ کر کاسے کے سردار بحال ہوئے اور وفات تک رہے۔ آج وہ سیرا لیون کے سب سے بڑے ہیرو ہیں؛ فری ٹاؤن کے وسط میں ان کا مجسمہ ہے اور ایک لیون کے نوٹ پر ان کی تصویر ہے۔"
