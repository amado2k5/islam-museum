summary:
  ar: "باي بوريه ⁦(15 فبراير 1840 – 24 أغسطس 1908)⁩، حاكم سيراليوني واستراتيجي عسكري ورجل دين مسلم، قاد انتفاضة التمني واللوكو ضد الحكم البريطاني سنة 1898 في شمال سيراليون. وُلد في كاسيه قرب بورت لوكو ابنًا لرجل دين مسلم وزعيم لوكو وأم تاجر تمنية، وتدرب على الحرب في گبندمبو فلُقّب كبَالاي «من لا تتعبه الحرب»، وصار في ستينيات القرن التاسع عشر وسبعينياته أقوى محاربي الشمال يعمل على إقامة الممارسات الإسلامية الصحيحة، وصدّ غزو السوسو سنة 1882، وتُوّج سنة 1886. رفض ضريبة الأكواخ البريطانية وقاد حربها سنة 1898 فصمد بأسلوب حرب العصابات أشهرًا، واستسلم في 11 نوفمبر 1898 فنفي إلى ساحل الذهب، ثم أُعيد سنة 1905 إلى زعامة كاسيه وبقي حتى وفاته؛ وهو اليوم بطل سيراليون الأكبر، وتمثاله في وسط فريتاون وصورته على ورقة الليون الواحد."
  en: "Bai Bureh (15 February 1840 – 24 August 1908), a Sierra Leonean ruler, military strategist and Muslim cleric who led the Temne and Loko uprising against British rule in 1898 in northern Sierra Leone. Born at Kasseh near Port Loko, son of a Muslim cleric and Loko chief and a Temne trader mother, he was trained as a warrior at Gbendembu and nicknamed Kebalai, 'one who doesn't tire of war'; in the 1860s and 1870s he became the north's foremost war leader, fighting to establish correct Islamic practices, defeating the Susu invasion of 1882, and was crowned in 1886. He refused the British hut tax and led the Hut Tax War of 1898, holding off the colonial forces with guerrilla tactics for months; he surrendered on 11 November 1898, was exiled to the Gold Coast, was brought back in 1905 and reinstated as chief of Kasseh until his death. He is remembered as Sierra Leone's greatest hero, with a statue in central Freetown and his portrait on the one-leone banknote."
  ur: "بائی بورے ⁦(15 فروری 1840ء – 24 اگست 1908ء)⁩، سیرا لیون کے حکمران، عسکری ماہر اور مسلمان عالم، جنہوں نے 1898ء میں شمالی سیرا لیون میں برطانوی راج کے خلاف تمنے اور لوکو بغاوت کی قیادت کی۔ وہ پورٹ لوکو کے قریب کاسے میں ایک مسلمان عالم اور لوکو سردار کے ہاں پیدا ہوئے، گبندمبو میں جنگی تربیت پائی اور «کبالائی» یعنی «جو جنگ سے نہیں تھکتا» کا لقب پایا؛ 1860ء اور 1870ء کی دہائیوں میں وہ درست اسلامی رسوم کے قیام کے لیے لڑتے ہوئے شمال کے سب سے بڑے جنگجو بنے، 1882ء میں سوسو حملہ پسپا کیا اور 1886ء میں تاج پوشی ہوئی۔ انہوں نے برطانوی جھونپڑی ٹیکس ماننے سے انکار کر کے 1898ء کی جنگ کی قیادت کی اور مہینوں گوریلا حربوں سے مزاحمت کی؛ 11 نومبر 1898ء کو ہتھیار ڈالے، گولڈ کوسٹ جلاوطن ہوئے، 1905ء میں واپس آ کر کاسے کے سردار بحال ہوئے اور وفات تک رہے۔ آج وہ سیرا لیون کے سب سے بڑے ہیرو ہیں؛ فری ٹاؤن کے وسط میں ان کا مجسمہ ہے اور ایک لیون کے نوٹ پر ان کی تصویر ہے۔"
  es: "Bai Bureh (15 de febrero de 1840 - 24 de agosto de 1908), gobernante sierraleonés, estratega militar y clérigo musulmán que lideró el levantamiento temne y loko contra el dominio británico en 1898 en el norte de Sierra Leona. Nacido en Kasseh, cerca de Port Loko, hijo de un clérigo musulmán y jefe loko y una madre comerciante temne, fue entrenado como guerrero en Gbendembu y apodado Kebalai, 'el que no se cansa de la guerra'; en las décadas de 1860 y 1870 se convirtió en el principal líder militar del norte, luchando para establecer prácticas islámicas correctas, derrotando la invasión susu de 1882, y fue coronado en 1886. Rechazó el impuesto británico sobre las chozas y lideró la Guerra del Impuesto sobre las Chozas de 1898, conteniendo a las fuerzas coloniales con tácticas de guerrilla durante meses; Se rindió el 11 de noviembre de 1898, fue exiliado a la Costa de Oro, regresó en 1905 y fue restituido como jefe de Kasseh hasta su muerte. Se le recuerda como el mayor héroe de Sierra Leona, con una estatua en el centro de Freetown y su retrato en el billete de un leone."
  fr: "Bai Bureh (15 février 1840 – 24 août 1908) était un souverain sierra-léonais, stratège militaire et religieux musulman qui mena le soulèvement des Temne et des Loko contre la domination britannique en 1898 dans le nord de la Sierra Leone. Né à Kasseh, près de Port Loko, fils d'un religieux musulman et chef Loko et d'une mère commerçante Temne, il fut formé comme guerrier à Gbendembu et surnommé Kebalai, « celui qui ne se lasse jamais de la guerre ». Dans les années 1860 et 1870, il devint le principal chef de guerre du nord, luttant pour établir des pratiques islamiques correctes, repoussant l'invasion Susu de 1882, et fut couronné en 1886. Il refusa la taxe britannique sur les huttes et mena la guerre de la taxe sur les huttes de 1898, tenant tête aux forces coloniales grâce à des tactiques de guérilla pendant des mois. Il se rendit le 11 novembre 1898, fut exilé sur la Côte-de-l'Or, puis ramené en 1905 et rétabli dans ses fonctions de chef du Kasseh, poste qu'il occupa jusqu'à sa mort. Il est considéré comme le plus grand héros de Sierra Leone; une statue se dresse à son effigie au centre de Freetown et son portrait figure sur le billet d'un leon."
  tr: "Bai Bureh (15 Şubat 1840 – 24 Ağustos 1908), Sierra Leone'li bir hükümdar, askeri stratejist ve Müslüman dini figürdü. 1898'de kuzey Sierra Leone'de Britanya yönetimine karşı Tamni ve Loko ayaklanmasına liderlik etti. Port Loko yakınlarındaki Kasse'de, Müslüman bir din adamı, Loko lideri ve Temania'lı bir tüccarın annesi olarak doğdu. Gbandembbo'da savaşta eğitim aldı ve Kabalai lakabını kazandı 'savaştan asla yorulmayan'. 1860'lar ve 1870'lerde kuzeyin en güçlü savaşçılarından biri oldu, uygun İslami uygulamaları kurmak için çalıştı, 1882'de Soso istilasını püskürttü ve 1886'da taç giydi. İngiliz ev vergisini reddetti ve 1898'de savaşa liderlik etti, aylarca gerilla savaşına katlandı. 11 Kasım 1898'de teslim oldu, Gold Coast'a sürgün edildi, ardından 1905'te Cassie'nin liderliğine döndü ve ölümüne kadar kaldı; bugün Sierra Leone'nin büyük kahramanıdır; heykeli Freetown'un merkezinde ve tek bir Leon banknotunda duran görüntüsüyle Sierra Leone'nin büyük kahramanıdır."
  id: "Bai Bureh (15 Februari 1840 – 24 Agustus 1908) adalah seorang penguasa Sierra Leone, ahli strategi militer, dan tokoh agama Muslim. Ia memimpin pemberontakan Tamni dan Loko melawan pemerintahan Inggris pada tahun 1898 di Sierra Leone utara. Ia lahir di Kasse dekat Port Loko, putra seorang ulama Muslim, pemimpin Loko, dan ibu dari seorang pedagang Temania. Ia berlatih perang di Gbandembbo, sehingga mendapat julukan Kabalai 'yang tidak pernah lelah dalam perang.' Pada tahun 1860-an dan 1870-an, ia menjadi salah satu pejuang terkuat di utara, bekerja untuk mendirikan praktik Islam yang benar, menangkis invasi Soso pada tahun 1882, dan dinobatkan pada tahun 1886. Ia menolak pajak pondok Inggris dan memimpin perang tersebut pada tahun 1898, bertahan dalam perang gerilya selama berbulan-bulan. Ia menyerah pada 11 November 1898, diasingkan ke Gold Coast, lalu kembali pada tahun 1905 ke kepemimpinan Cassie dan tetap di sana hingga kematiannya; hari ini ia adalah pahlawan besar Sierra Leone, dengan patungnya di pusat Freetown dan gambarnya di atas satu lembaran Leon."
