  ar: "بسطام بن قيس بن مسعود بن خالد بن عبد الله ذي الجدين الشيباني، أبو الصهباء، سيد بني شيبان؛ غزا بني ضبة فأصاب إبل مالك بن المنتفق، وقُتل يوم الشقيقة وكان من أخريات الناس يحمي أصحابه على فرسه الأدهم الزعفران، وكثر فيه الشعر وقال العوام «يوم الأفاقة أسلموا بسطاما» {cite:kamil-ibn-al-athir p. 461-462}."
