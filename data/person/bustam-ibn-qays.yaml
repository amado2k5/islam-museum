summary:
  ar: "بسطام بن قيس بن مسعود بن خالد بن عبد الله ذي الجدين الشيباني، أبو الصهباء، سيد بني شيبان؛ غزا بني ضبة فأصاب إبل مالك بن المنتفق، وقُتل يوم الشقيقة وكان من أخريات الناس يحمي أصحابه على فرسه الأدهم الزعفران، وكثر فيه الشعر وقال العوام «يوم الأفاقة أسلموا بسطاما» {cite:kamil-ibn-al-athir p. 461-462}."
  en: "Bustam ibn Qays 'dhu al-jadayn', Abu al-Sahba', sayyid of Banu Shayban: killed at the day of al-Shaqiqa covering his men's retreat on the dark stallion al-Za'faran — the most elegised of Shayban's dead {cite:kamil-ibn-al-athir p. 461-462}."
  es: "Bustam ibn Qays 'dhu al-jadayn', Abu al-Sahba', sayyid de Banu Shayban: asesinado el día en que al-Shaqiqa cubría la retirada de sus hombres en el oscuro semental al-Za'faran, el más elegido de los muertos de Shayban {citar:kamil-ibn-al-athir p. 461-462}."
  fr: "Bustam ibn Qays 'dhu al-jadayn', Abu al-Sahba', sayyid de Banu Shayban: tué le jour d'al-Shaqiqa couvrant la retraite de ses hommes sur l'étalon sombre al-Za'faran — le plus élégié des morts de Shayban {cite: kamil-ibn-al-athir p. 461-462}."
