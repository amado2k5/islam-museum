summary:
  ar: "جغرافي تركي من طرابزون، ولد حوالي سنة 964هـ ⁦(1555م)⁩، وشارك في حملات عثمان باشا في القوقاز وجنوب روسيا ⁦(989-992هـ)⁩، وحملة قودجه سنان باشا على المجر ⁦(1002-1003هـ)⁩، واستقر في دمشق سنة 1005هـ، وأتم «مناظر العوالم» في رمضان 1006هـ ⁦(أبريل-مايو 1598م)⁩، وتجهل وفاته {cite:encyclopaedia-of-islam-2 vol. 1 p. 746-747}."
  en: "Turkish cosmographer born about 964 AH (1555) at Trabzon. He took part in 'Uthman Pasha's campaign in the Caucasus and southern Russia (989-992 AH), and in Kodja Sinan Pasha's Hungarian campaign (1002-1003 AH); he settled in Damascus in 1005 AH and completed his cosmography, Manazir al-awalim, in Ramadan 1006 AH (April-May 1598). His death date is not known {cite:encyclopaedia-of-islam-2 vol. 1 p. 746-747}."
  es: "Cosmógrafo turco nacido alrededor del año 964 de la Hégira (1555) en Trabzon. Participó en la campaña de Uthman Pasha en el Cáucaso y el sur de Rusia (989-992 de la Hégira), y en la campaña húngara de Kodja Sinan Pasha (1002-1003 de la Hégira); se estableció en Damasco en el año 1005 de la Hégira y completó su cosmografía, Manazir al-awalim, en Ramadán del año 1006 de la Hégira (abril-mayo de 1598). Se desconoce la fecha de su muerte {cite:encyclopaedia-of-islam-2 vol. 1 p. 746-747}."
  fr: "Cosmographe turc né vers 964 AH (1555) à Trabzon. Il participa à la campagne d'Uthman Pacha dans le Caucase et le sud de la Russie (989-992 AH), puis à celle de Kodja Sinan Pacha en Hongrie (1002-1003 AH). Il s'installa à Damas en 1005 AH et acheva sa cosmographie, Manazir al-awalim, durant le Ramadan 1006 AH (avril-mai 1598). La date de son décès est inconnue. (Source: Encyclopaedia of Islam, vol. 1, p. 746-747)"
  ur: "ترک کاسموگرافر تقریباً 964ھ (1555) میں ترابزون میں پیدا ہوئے۔ اس نے قفقاز اور جنوبی روس میں عثمان پاشا کی مہم ⁦(989-992 ہجری)⁩ اور کوڈجا سنان پاشا کی ہنگری کی مہم ⁦(1002-1003 ہجری)⁩ میں حصہ لیا۔ آپ نے 1005 ہجری میں دمشق میں سکونت اختیار کی اور رمضان 1006 ہجری ⁦(اپریل-مئی 1598)⁩ میں اپنی کاسموگرافی، مناظر العالیم مکمل کی۔ ان کی تاریخ وفات معلوم نہیں ہے {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 746-747}۔"
  tr: "Trabzonlu Türk coğrafyacı olan Trabzon'dan olan Dz, yaklaşık 964 Hicri (1555 M.S.) doğumlu olan Dz'Paşa, Osman Paşa'nın Kafkasya ve güney Rusya'daki seferlerine (989-992 H) ve Macaristan'daki Gödce Sinan Paşa'nın seferine (1002-1003 H) katıldı. 1005 Hicri'de Şam'a yerleşti, Ramazan ayında 'Manzaré al-Al-Alam'ı tamamladı (Nisan-Mayıs 1598) ve ölümü bilinmemektedir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 746-747}."
  id: "Seorang geografer Turki dari Trabzon, lahir sekitar tahun 964 H (1555 M), ia berpartisipasi dalam kampanye Osman Pasha di Kaukasus dan Rusia selatan (989-992 H), serta kampanye Gödce Sinan Pasha di Hungaria (1002-1003 H). Ia menetap di Damaskus pada tahun 1005 H, menyelesaikan 'Manzaré al-Al-Alam' pada Ramadan 1006 H (April-Mei 1598 M), dan kematiannya tidak diketahui {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 746-747}."
