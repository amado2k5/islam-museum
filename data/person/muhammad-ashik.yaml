summary:
  ar: "جغرافي تركي من طرابزون، ولد حوالي سنة 964هـ (1555م)، وشارك في حملات عثمان باشا في القوقاز وجنوب روسيا (989-992هـ)، وحملة قودجه سنان باشا على المجر (1002-1003هـ)، واستقر في دمشق سنة 1005هـ، وأتم «مناظر العوالم» في رمضان 1006هـ (أبريل-مايو 1598م)، وتجهل وفاته {cite:encyclopaedia-of-islam-2 vol. 1 p. 746-747}."
  en: "Turkish cosmographer born about 964 AH (1555) at Trabzon. He took part in 'Uthman Pasha's campaign in the Caucasus and southern Russia (989-992 AH), and in Kodja Sinan Pasha's Hungarian campaign (1002-1003 AH); he settled in Damascus in 1005 AH and completed his cosmography, Manazir al-awalim, in Ramadan 1006 AH (April-May 1598). His death date is not known {cite:encyclopaedia-of-islam-2 vol. 1 p. 746-747}."
