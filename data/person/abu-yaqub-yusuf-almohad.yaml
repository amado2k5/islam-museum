    en: "Abu Ya'qub Yusuf ibn Abd al-Mu'min, the Almohad Commander of the Faithful, deposed his brother and heir Abu Abd Allah in Sha'ban of 558 AH and held the rule alone."
    ur: "ابویعقوب یوسف بن عبدالمومن، موحدی امیر المومنین، نے 558ھ شعبان میں اپنے بھائی ولی عہد ابوعبداللہ کو معزول کر کے حکومت تنہا سنبھالی۔"
