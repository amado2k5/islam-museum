label: { ar: "أبو يعقوب يوسف بن عبد المؤمن", en: "Abu Ya'qub Yusuf ibn Abd al-Mu'min", fr: "Abu Ya'qub Yusuf ibn Abd al-Mu'min", es: "Abu Ya'qub Yusuf ibn Abd al-Mu'min", ur: "ابو یعقوب یوسف بن عبد المومن" }
summary:
  ar: "أبو يعقوب يوسف بن عبد المؤمن أمير المؤمنين الموحدي؛ خلع أخاه أبا عبد الله محمد بن عبد المؤمن — الذي كان ولي العهد قبله ونقش على الدنانير اسمه — في شعبان سنة ثمان وخمسين واستبد بالأمر، وولى أخاه الآخر أبا حفص عمر جزيرة الأندلس؛ وكان فقيهاً حافظاً متقناً إذ قرنه أبوه وإخوته بأكمل رجال الحرب والمعارف فنشأوا بين أبطال الفرسان وأفاضل العلماء، وميله إلى الحكمة والفلسفة أكثر من ميله إلى الأدب، وكان جماّعاً مناعاً عارفاً بسياسة رعيته، والدنانير اليوسفية المغربية منسوبة إليه {cite:wafayat-ayan p. 130-132}. ودخل جزيرة الأندلس سنة ست وستين وخمسمائة وفي صحبته مائة ألف فارس من العرب والموحدين فنزل بإشبيلية، فخافه ابن مردنيش صاحب شرق الأندلس فمرض مرضاً شديداً ومات في التاسع والعشرين من رجب سنة سبع وستين — وقيل إن أمه سقته السم — وجاء أولاده إلى الأمير يوسف فسلموا إليه جميع بلاد شرق الأندلس فأحسن إليهم وتزوج أختهم {cite:wafayat-ayan p. 131}. وشرع في استرجاع بلاد المسلمين من أيدي الفرنج فاتسعت مملكته بالأندلس وصارت سراياه تغير إلى باب طليطلة ثم حاصرها فاجتمع الفرنج كافة عليه واشتد الغلاء في عسكره فرجع عنها، وقصد بلاد إفريقية سنة خمس وسبعين ففتح قفصة {cite:wafayat-ayan p. 131, nafh-tib-maqqari p. 383}. ثم جاز البحر إلى الأندلس سنة ثمانين وخمسمائة ومعه جمع كثيف فقصد غربي بلادها وحاصر مدينة شنترين شهراً فأصابه المرض فمات في شهر ربيع الأول سنة ثمانين وحمل في تابوت إلى إشبيلية، وقيل أصابه سهم من قبتل الإفرنج؛ وذكر ابن الأثير أنه مات من غير وصية بالملك لأحد من أولاده فاتفق رأي قواد الموحدين وأولاد عبد المؤمن على تمليك ولده يعقوب في الوقت الذي مات فيه أبوه لقربهم من بلاد العدو {cite:wafayat-ayan p. 132}."
  en: "Abu Ya'qub Yusuf ibn Abd al-Mu'min, second Almohad caliph — deposed the designated heir, his brother Muhammad, in Sha'ban 558, posted his brother Abu Hafs 'Umar over al-Andalus, and grew up between the cavalry and the scholars: a firm jurist whose bent ran to wisdom and philosophy, his dinars the 'Yusufis' of the Maghreb {cite:wafayat-ayan p. 130-132}. He crossed in 566 with a hundred thousand horse, and at Seville the death of Ibn Mardanish (Rajab 567 — his mother was said to have poisoned him) brought the sons to surrender all the east of al-Andalus; Yusuf raided to the gates of Toledo, took Gafsa in 575, and died of illness (some said a Frankish arrow) at the month-long siege of Santarém in Rabi' I 580, carried home in a coffin while the Almohad commanders settled the succession on his son Ya'qub without a written will {cite:wafayat-ayan p. 131-132, nafh-tib-maqqari p. 383}."
  fr: "Abu Ya'qub Yusuf ibn Abd al-Mu'min, deuxième calife almohade, déposa son frère Muhammad, héritier désigné, en cha'ban 558, nomma son frère Abu Hafs 'Umar à la tête d'al-Andalus et grandit parmi les cavaliers et les savants : juriste solide porté vers la sagesse et la philosophie, il donna son nom aux dinars « yusufis » du Maghreb {cite:wafayat-ayan p. 130-132}. Il traversa en 566 avec cent mille cavaliers ; à Séville, la mort d'Ibn Mardanish (rajab 567 — sa mère l'aurait empoisonné) amena ses fils à livrer tout l'est d'al-Andalus. Yusuf fit des raids jusqu'aux portes de Tolède, prit Gafsa en 575 et mourut de maladie (certains disent d'une flèche franque) pendant le siège d'un mois de Santarém, en rabi' I 580. Il fut ramené dans un cercueil, tandis que les commandants almohades fixaient la succession sur son fils Ya'qub sans testament écrit {cite:wafayat-ayan p. 131-132, nafh-tib-maqqari p. 383}."
  es: "Abu Ya'qub Yusuf ibn Abd al-Mu'min, segundo califa almohade, depuso al heredero designado, su hermano Muhammad, en Sha'ban 558, nombró a su hermano Abu Hafs 'Umar al frente de al-Ándalus, y creció entre la caballería y los eruditos: un jurista firme cuya inclinación se inclinaba hacia la sabiduría y la filosofía, sus dinares los 'Yusufis' del Magreb {cite:wafayat-ayan p. 130-132}. Cruzó en 566 con cien mil caballos, y en Sevilla la muerte de Ibn Mardanish (Rajab 567 —se dice que su madre lo envenenó) hizo que los hijos rindieran todo el este de al-Ándalus; Yusuf realizó incursiones hasta las puertas de Toledo, tomó Gafsa en 575 y murió de una enfermedad (algunos dicen que por una flecha franca) durante el asedio de Santarém, que duró un mes, en Rabi' I de 580. Fue llevado a casa en un ataúd mientras los comandantes almohades establecían la sucesión en su hijo Ya'qub sin un testamento escrito {cite:wafayat-ayan p. 131-132, nafh-tib-maqqari p. 383}."
  ur: "ابو یعقوب یوسف بن عبد المومن، دوسرے الموحد خلیفہ - نے معزول وارث، اپنے بھائی محمد نے، شعبان 558 میں، اپنے بھائی ابو حفص عمر کو اندلس پر تعینات کیا، اور گھڑسواروں اور علماء کے درمیان پلے بڑھے: ایک مضبوط فقیہ جس کا جھکاؤ اس کی حکمت اور حکمت کی طرف بھاگا۔ مغرب {حوالہ: وفائیت آیان ص۔ 130-132}۔ اس نے 566 میں ایک لاکھ گھوڑے کے ساتھ پار کیا، اور سیویل میں ابن مردانیش کی موت ⁦(رجب 567 - کہا جاتا ہے کہ اس کی ماں نے اسے زہر دیا تھا)⁩ بیٹوں کو اندلس کے تمام مشرق میں ہتھیار ڈالنے کے لیے لے آیا۔ یوسف نے ٹولیڈو کے دروازوں پر چڑھائی کی، 575 میں گفسہ پر قبضہ کیا، اور ربیع اول 580 میں سانتاریم کے مہینے بھر کے محاصرے میں بیماری کی وجہ سے ⁦(کچھ نے ایک فرینکش تیر کہا)⁩ کی موت ہو گئی، ایک تابوت میں گھر لے گئے جب کہ الموحد کمانڈروں نے بغیر کسی تحریری وصیت کے اس کے بیٹے یعقوب کی جانشینی طے کی۔ 131-132، نفح تبع مقری ص۔ 383}۔"
  tr: "Müminlerin Almohad Komutanı Ebu Yakub Yusuf ibn Abdülmümin, kendisinden önce veliaht prens olan ve adı dinarlara kazınmış olan kardeşi Ebu Abdullah Muhammed ibn Abdülmümin'i 58. yılın Şaban ayında tahttan indirerek iktidarı ele geçirdi. Diğer kardeşi Ebu Hafs Ömer'i Endülüs adasının valisi olarak atadı. Babası ve kardeşleri onu en yetenekli savaş ve ilim adamlarıyla eşleştirdikleri için, o bir hukukçu, ezberci ve üstat idi; böylece şövalye kahramanları ve en seçkin alimler arasında büyüdü. Edebiyattan çok bilgelik ve felsefeye yönelmişti. Bir koleksiyoncu, koruyucu ve tebaasının siyaseti konusunda bilgiliydi. Fas Yusufi dinarları ona atfedilir. {cite:wafayat-ayan s. 130-132} Hicri 566 yılında, Arap ve Almohadlardan oluşan yüz bin süvariyle birlikte Endülüs adasına girdi. Sevilla'ya çıktı ve Doğu Endülüs hükümdarı İbn Mardaniş ondan korktu. Ağır bir hastalığa yakalandı ve Hicri 567 yılının Receb ayının 29. gününde öldü; rivayete göre annesi onu zehirledi. Oğulları Prens Yusuf'a gelip Doğu Endülüs'ün tüm topraklarını ona teslim ettiler ve o da onlara iyi davrandı ve kız kardeşleriyle evlendi. Daha sonra Müslümanların topraklarını Frankların elinden geri almaya başladı ve Endülüs'teki krallığı genişledi. Akıncı birlikleri Toledo'nun kapılarına kadar ulaştı ve şehri kuşattı. Tüm Franklar ona karşı toplandı ve ordusu şiddetli bir kıtlık çekti, bu yüzden geri çekildi. Hicri 575 yılında İfrikiye topraklarına doğru yöneldi ve Gafsa'yı fethetti. Sonra 580 Hicri yılında büyük bir orduyla denizi geçerek Endülüs'e gitti. Topraklarının batı kısmına yöneldi ve bir ay boyunca Santarém şehrini kuşattı. Hastalandı ve 580 Hicri yılının Rebiü'l-Evvel ayında öldü. Tabutla Sevilla'ya götürüldü. Frank ordusundan bir okla vurulduğu söylenir. İbn el-Athir, krallıkla ilgili oğullarından hiçbirine vasiyet bırakmadan öldüğünü belirtmiştir. Almohadların önderleri ve Abdülmümin'in oğulları, düşman topraklarına yakınlıkları nedeniyle babasının öldüğü sırada oğlu Yakub'u kral yapmayı kabul ettiler. {kaynak: Vefayat-ı Ayan, s. 132}"
  id: "Abu Yaqub Yusuf ibn Abd al-Mu’min, Panglima Kaum Mukmin Al-Mu’min, menggulingkan saudaranya Abu Abdullah Muhammad ibn Abd al-Mu’min—yang sebelumnya menjabat sebagai putra mahkota dan namanya tertera pada dinar—pada bulan Sya’ban tahun 58 dan merebut kekuasaan. Ia menunjuk saudaranya yang lain, Abu Hafs Umar, sebagai gubernur pulau Andalusia. Ia adalah seorang ahli hukum, penghafal, dan guru, karena ayah dan saudara-saudaranya telah memasangkannya dengan orang-orang yang paling mahir dalam perang dan ilmu pengetahuan, sehingga mereka tumbuh di antara para pahlawan ksatria dan para cendekiawan terkemuka. Kecenderungannya lebih condong pada kebijaksanaan dan filsafat daripada pada sastra. Ia adalah seorang kolektor, pelindung, dan berpengetahuan luas tentang politik rakyatnya. Dinar Yusufi Maroko dikaitkan dengannya. {cite:wafayat-ayan p. 130-132} Ia memasuki pulau Andalusia pada tahun 566 H, ditem ditemani oleh seratus ribu penunggang kuda dari bangsa Arab dan Almohad. Ia mendarat di Sevilla, dan Ibn Mardanish, penguasa Andalusia timur, takut kepadanya. Ia jatuh sakit parah dan meninggal pada tanggal 29 Rajab tahun 567 H—konon ibunya meracuninya. Putra-putranya datang kepada Pangeran Yusuf dan menyerahkan semua tanah Andalusia timur kepadanya, dan ia memperlakukan mereka dengan baik dan menikahi saudara perempuan mereka. Kemudian ia mulai merebut kembali tanah-tanah kaum Muslim dari tangan bangsa Frank, dan kerajaannya di Andalusia meluas. Pasukan penyerangnya mencapai gerbang Toledo, dan ia mengepungnya. Semua bangsa Frank berkumpul melawannya, dan pasukannya menderita kelaparan hebat, sehingga ia mundur. Ia menuju ke tanah Ifriqiya pada tahun 575 H dan menaklukkan Gafsa. Kemudian ia menyeberangi laut ke Andalusia pada tahun 580 H, dengan pasukan yang besar. Ia menuju ke bagian barat wilayah tersebut dan mengepung kota Santarém selama sebulan. Ia jatuh sakit dan meninggal pada bulan Rabi' al-Awwal tahun 580 H. Jenazahnya dibawa dalam peti mati ke Sevilla. Dikatakan bahwa ia terkena panah dari pasukan Frank. Ibn al-Athir menyebutkan bahwa ia meninggal tanpa meninggalkan wasiat kepada putra-putranya mengenai kerajaan. Para pemimpin Almohad dan putra-putra Abd al-Mu'min sepakat untuk menjadikan putranya, Ya'qub, sebagai raja pada saat ayahnya meninggal, karena kedekatan mereka dengan wilayah musuh. {cite:wafayat-ayan hlm. 132}"
