label: { ar: "أبو يعقوب يوسف بن عبد المؤمن", en: "Abu Ya'qub Yusuf ibn Abd al-Mu'min" }
summary:
  ar: "أبو يعقوب يوسف بن عبد المؤمن أمير المؤمنين الموحدي؛ خلع أخاه أبا عبد الله محمد بن عبد المؤمن — الذي كان ولي العهد قبله ونقش على الدنانير اسمه — في شعبان سنة ثمان وخمسين واستبد بالأمر، وولى أخاه الآخر أبا حفص عمر جزيرة الأندلس؛ وكان فقيهاً حافظاً متقناً إذ قرنه أبوه وإخوته بأكمل رجال الحرب والمعارف فنشأوا بين أبطال الفرسان وأفاضل العلماء، وميله إلى الحكمة والفلسفة أكثر من ميله إلى الأدب، وكان جماّعاً مناعاً عارفاً بسياسة رعيته، والدنانير اليوسفية المغربية منسوبة إليه {cite:wafayat-ayan p. 130-132}. ودخل جزيرة الأندلس سنة ست وستين وخمسمائة وفي صحبته مائة ألف فارس من العرب والموحدين فنزل بإشبيلية، فخافه ابن مردنيش صاحب شرق الأندلس فمرض مرضاً شديداً ومات في التاسع والعشرين من رجب سنة سبع وستين — وقيل إن أمه سقته السم — وجاء أولاده إلى الأمير يوسف فسلموا إليه جميع بلاد شرق الأندلس فأحسن إليهم وتزوج أختهم {cite:wafayat-ayan p. 131}. وشرع في استرجاع بلاد المسلمين من أيدي الفرنج فاتسعت مملكته بالأندلس وصارت سراياه تغير إلى باب طليطلة ثم حاصرها فاجتمع الفرنج كافة عليه واشتد الغلاء في عسكره فرجع عنها، وقصد بلاد إفريقية سنة خمس وسبعين ففتح قفصة {cite:wafayat-ayan p. 131, nafh-tib-maqqari p. 383}. ثم جاز البحر إلى الأندلس سنة ثمانين وخمسمائة ومعه جمع كثيف فقصد غربي بلادها وحاصر مدينة شنترين شهراً فأصابه المرض فمات في شهر ربيع الأول سنة ثمانين وحمل في تابوت إلى إشبيلية، وقيل أصابه سهم من قبتل الإفرنج؛ وذكر ابن الأثير أنه مات من غير وصية بالملك لأحد من أولاده فاتفق رأي قواد الموحدين وأولاد عبد المؤمن على تمليك ولده يعقوب في الوقت الذي مات فيه أبوه لقربهم من بلاد العدو {cite:wafayat-ayan p. 132}."
  en: "Abu Ya'qub Yusuf ibn Abd al-Mu'min, second Almohad caliph — deposed the designated heir, his brother Muhammad, in Sha'ban 558, posted his brother Abu Hafs 'Umar over al-Andalus, and grew up between the cavalry and the scholars: a firm jurist whose bent ran to wisdom and philosophy, his dinars the 'Yusufis' of the Maghreb {cite:wafayat-ayan p. 130-132}. He crossed in 566 with a hundred thousand horse, and at Seville the death of Ibn Mardanish (Rajab 567 — his mother was said to have poisoned him) brought the sons to surrender all the east of al-Andalus; Yusuf raided to the gates of Toledo, took Gafsa in 575, and died of illness (some said a Frankish arrow) at the month-long siege of Santarém in Rabi' I 580, carried home in a coffin while the Almohad commanders settled the succession on his son Ya'qub without a written will {cite:wafayat-ayan p. 131-132, nafh-tib-maqqari p. 383}."
