summary:
  ar: "أبو يعقوب يوسف بن عبد المؤمن أمير المؤمنين الموحدي؛ بويع بعد أبيه وشرع في استرجاع البلاد التي استولى عليها الإفرنج فاتسعت مملكته بالأندلس وصارت سراياه تغير إلى باب طليطلة، ثم جاز البحر إلى الأندلس سنة ثمانين وخمسمائة ومعه جمع كثيف فقصد غربي بلادها وحاصر مدينة شنترين وهي من أعظم بلاد العدو وبقي محاصراً لها شهراً فأصابه المرض فمات وحمل في تابوت إلى إشبيلية، وقيل أصابه سهم من قبتل الإفرنج {cite:nafh-tib-maqqari p. 383}."
  en: "Abu Ya'qub Yusuf ibn Abd al-Mu'min, Almohad caliph — he crossed to al-Andalus in 580, besieged Santarem, one of the enemy's greatest cities, for a month until illness (or, as some said, a Frankish arrow) killed him; he was carried in a coffin to Seville {cite:nafh-tib-maqqari p. 383}."
