summary:
  ar: "المسند المقدسي؛ انتفع بإفادة أبيه من الكبار كالحجار والمِزّي ورحل به إلى القاهرة فأسمعه من أبي حيان وعدة من أصحاب النجيب، وسكن بيت المقدس إلى أن صار من أعيانه، وكانت الرحلة في سماع الحديث بالقدس إليه؛ قال ابن حجر: ظهر له في أواخر عمره سماع ابن ماجه على الحجار فرحلت إليه من القاهرة بسببه في هذه السنة فبلغني وفاته وأنا بالرملة فعدلت عن القدس إلى الشام، وقد أجاز لي غير مرة {cite:shadharat-dhahab p. 23}."
  en: "Jerusalem's musnid — the man scholars journeyed to for the capital's audition-list; Ibn Hajar set out from Cairo for his Ibn Majah samā' and learned on the road at Ramla that he had died {cite:shadharat-dhahab p. 23}."
  fr: "Le musnid de Jérusalem — l'homme vers qui les savants voyageaient pour la liste d'audition de la ville ; Ibn Hajar partit du Caire pour son audition d'Ibn Majah et apprit en chemin, à Ramla, qu'il était mort {cite:shadharat-dhahab p. 23}."
  es: "El musnid de Jerusalén, el hombre al que los eruditos viajaban para la lista de audiciones de la capital; Ibn Hajar partió de El Cairo para su Ibn Majah samā' y se enteró en el camino en Ramla de que había muerto {cite:shadharat-dhahab p. 23}."
  ur: "یروشلم کا مسنید - وہ آدمی جو اسکالرز نے دارالحکومت کی آڈیشن لسٹ کے لیے سفر کیا۔ ابن حجر قاہرہ سے اپنے ابن ماجہ سماع کے لیے روانہ ہوئے اور راستے میں رملہ کے مقام پر معلوم ہوا کہ ان کا انتقال ہو گیا ہے۔ 23}۔"
  tr: "El-Musnad el-Makdisi, babasının el-Haccar ve el-Mizzi gibi büyük alimler hakkındaki bilgilerinden faydalandı ve onunla birlikte Kahire'ye gitti; orada Ebu Hayyan'dan ve el-Necib'in birkaç arkadaşından hadis dinledi. Kudüs'te yaşadı ve şehrin önde gelenlerinden biri oldu. Kudüs'te hadis dinlemek için yaptığı yolculuk onun için bir gelenekti. İbn Hacer şöyle dedi: Hayatının sonlarında İbn Majah'ı el-Haccar'dan dinlediğini anladı, bu yüzden bu yıl onun için Kahire'den ona gittim. Ramla'dayken ölüm haberini aldım, bu yüzden Kudüs'ten Levant'a geçtim. Bana birden fazla kez izin vermişti. {kaynak: Şadharat-dahab s. 23}"
  id: "Al-Musnad al-Maqdisi mendapat manfaat dari pengetahuan ayahnya tentang ulama-ulama besar seperti al-Hajjar dan al-Mizzi, dan ia melakukan perjalanan bersamanya ke Kairo, di mana ia mendengar dari Abu Hayyan dan beberapa sahabat al-Najib. Ia tinggal di Yerusalem hingga menjadi salah satu tokoh terkemuka di sana. Perjalanan untuk mendengar hadits di Yerusalem adalah untuknya. Ibn Hajar berkata: Pada akhir hayatnya, ia menyadari bahwa ia mendengar Ibn Majah dari al-Hajjar, jadi saya melakukan perjalanan kepadanya dari Kairo karena dia pada tahun ini. Saya mendengar tentang kematiannya ketika saya berada di Ramla, jadi saya pindah dari Yerusalem ke Levant. Dia telah mengizinkan saya lebih dari sekali. {kutipan:shadharat-dhahab hlm. 23}"
