  ar: "المسند المقدسي؛ انتفع بإفادة أبيه من الكبار كالحجار والمِزّي ورحل به إلى القاهرة فأسمعه من أبي حيان وعدة من أصحاب النجيب، وسكن بيت المقدس إلى أن صار من أعيانه، وكانت الرحلة في سماع الحديث بالقدس إليه؛ قال ابن حجر: ظهر له في أواخر عمره سماع ابن ماجه على الحجار فرحلت إليه من القاهرة بسببه في هذه السنة فبلغني وفاته وأنا بالرملة فعدلت عن القدس إلى الشام، وقد أجاز لي غير مرة {cite:shadharat-dhahab p. 23}."
  en: "Jerusalem's musnid — the man scholars journeyed to for the capital's audition-list; Ibn Hajar set out from Cairo for his Ibn Majah samā' and learned on the road at Ramla that he had died {cite:shadharat-dhahab p. 23}."
