summary:
  ar: "مقاتل بن حيان، أبو بسطام النبطي البلخي الخراساني الخراز، أحد الأعلام، وثقه يحيى بن معين وأبو داود وغيرهما، روى عن الضحاك ومجاهد وعكرمة والشعبي، وروى عنه أخوه مصعب وعلقمة بن مرثد وعبد الله بن المبارك. هرب أيام أبي مسلم إلى كابل ودعا خلقا إلى الإسلام فأسلموا، ومات بكابل قبل سنة 150هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2071}"
  en: "Muqatil ibn Hayyan, Abu Bistam al-Nabati al-Balkhi al-Khurasani, a leading scholar whom Yahya ibn Ma'in and Abu Dawud and others counted as trustworthy. He transmitted from al-Dahhak, Mujahid, Ikrima and al-Sha'bi, and from him transmitted his brother Mus'ab, Alqama ibn Martad and Abd Allah ibn al-Mubarak. He fled to Kabul in the days of Abu Muslim, called many to Islam who embraced it, and died in Kabul before 150 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2071}"
  es: "Muqatil ibn Hayyan, Abu Bistam al-Nabati al-Balkhi al-Khurasani, un destacado erudito a quien Yahya ibn Ma'in, Abu Dawud y otros consideraban digno de confianza. Transmitió de al-Dahhak, Mujahid, Ikrima y al-Sha'bi, y de este transmitió a su hermano Mus'ab, Alqama ibn Martad y Abd Allah ibn al-Mubarak. Huyó a Kabul en tiempos de Abu Muslim, llamó al Islam a muchos que lo abrazaron y murió en Kabul antes del año 150 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2071}"
  fr: "Muqatil ibn Hayyan, Abu Bistam al-Nabati al-Balkhi al-Khurasani, éminent savant que Yahya ibn Ma'in, Abu Dawud et d'autres considéraient comme digne de confiance, transmit l'enseignement d'al-Dahhak, Mujahid, Ikrima et al-Sha'bi. De ce dernier, il transmit à son frère Mus'ab, Alqama ibn Martad et Abd Allah ibn al-Mubarak. Il se réfugia à Kaboul à l'époque d'Abu Muslim, convertit de nombreuses personnes à l'islam et mourut à Kaboul avant l'an 150 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2071}"
  ur: "مقاتل بن حیان، ابو بسطام النبطی المعروف بلخی الخراسانی، ایک معروف عالم جن کو یحییٰ بن معین اور ابوداؤد وغیرہ نے ثقہ شمار کیا ہے۔ اس نے الضحاک، مجاہد، عکرمہ اور الشعبی سے روایت کی اور ان سے اپنے بھائی مصعب، علقمہ بن مرتد اور عبد اللہ بن المبارک سے روایت کی۔ وہ ابو مسلم کے زمانے میں بھاگ کر کابل چلا گیا، بہت سے لوگوں کو اسلام کی طرف بلایا جنہوں نے اسے قبول کیا، اور 150 ہجری سے پہلے کابل میں انتقال کر گئے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص2071}"
