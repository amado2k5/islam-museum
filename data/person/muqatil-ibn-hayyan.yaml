summary:
  ar: "مقاتل بن حيان، أبو بسطام النبطي البلخي الخراساني الخراز، أحد الأعلام، وثقه يحيى بن معين وأبو داود وغيرهما، روى عن الضحاك ومجاهد وعكرمة والشعبي، وروى عنه أخوه مصعب وعلقمة بن مرثد وعبد الله بن المبارك. هرب أيام أبي مسلم إلى كابل ودعا خلقا إلى الإسلام فأسلموا، ومات بكابل قبل سنة 150هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2071}"
  en: "Muqatil ibn Hayyan, Abu Bistam al-Nabati al-Balkhi al-Khurasani, a leading scholar whom Yahya ibn Ma'in and Abu Dawud and others counted as trustworthy. He transmitted from al-Dahhak, Mujahid, Ikrima and al-Sha'bi, and from him transmitted his brother Mus'ab, Alqama ibn Martad and Abd Allah ibn al-Mubarak. He fled to Kabul in the days of Abu Muslim, called many to Islam who embraced it, and died in Kabul before 150 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2071}"
