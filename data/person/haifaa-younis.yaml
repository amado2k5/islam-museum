summary:
  ar: "طبيبة أمريكية معتمدة في طب النساء والتوليد من أصول عراقية، ومؤسسة معهد جنة التعليمي في إيرفاين بكاليفورنيا ورئيسته؛ تخرجت في معهد مكة للدراسات الإسلامية ومدرسة الهدى لتحفيظ القرآن في جدة وحفظت القرآن، وتدرّس القرآن والتفسير والتزكية، وهي باحثة مقيمة في المركز الإسلامي في إيرفاين."
  en: "American board-certified obstetrician-gynaecologist of Iraqi roots, founder and chairman of the Jannah Institute educational nonprofit in Irvine, California; a graduate of the Mecca Institute of Islamic Studies and the Al-Huda Qur'an Memorization School in Jeddah who memorised the Qur'an, teaches Qur'an, tafsir and tazkiyah, and is a resident scholar at the Islamic Center of Irvine."
  ur: "امریکی بورڈ سے سند یافتہ ماہرِ امراضِ نسواں و زچگی، عراقی نژاد؛ کیلیفورنیا کے شہر اروائن میں جنّہ انسٹیٹیوٹ کی بانی و صدر، جدہ کے معہدِ مکہ برائے اسلامی مطالعات اور مدرسہ الہدیٰ لتحفیظ القرآن کی فارغ التحصیل اور حافظہ قرآن، قرآن، تفسیر اور تزکیہ کی مدرّسہ اور اسلامک سینٹر آف اروائن کی مقیم عالمہ ہیں۔"
  es: "Obstetra-ginecólogo estadounidense certificado, de origen iraquí, fundador y presidente de la organización educativa sin fines de lucro Jannah Institute en Irvine, California; graduado del Instituto de Estudios Islámicos de La Meca y de la Escuela de Memorización del Corán Al-Huda en Jeddah, donde memorizó el Corán, enseña Corán, tafsir y tazkiyah, y es un erudito residente en el Centro Islámico de Irvine."
  fr: "Obstétricien-gynécologue américain certifié, d'origine irakienne, fondateur et président de l'institut éducatif à but non lucratif Jannah Institute à Irvine, en Californie; diplômé de l'Institut d'études islamiques de La Mecque et de l'école de mémorisation du Coran Al-Huda à Djeddah, il a mémorisé le Coran, enseigne le Coran, le tafsir et la tazkiyah, et est chercheur résident au Centre islamique d'Irvine."
  tr: "Irak kökenli kadın doğum ve jinekoloji sertifikalı Amerikalı bir hekim, Kaliforniya, Irvine'deki Jannah Eğitim Enstitüsü'nün kurucusu ve başkanıdır; Cidde'deki Mekke İslam Araştırmaları Enstitüsü ve Al-Huda Kuran Ezber Okulu'ndan mezun oldu, Kur'an'ı ezberledi, Kur'an, tefsir ve arınma dersleri veriyor. Irvine'deki İslam Merkezi'nde yerleşik araştırmacı olarak görev yapmaktadır."
  id: "Seorang dokter Amerika bersertifikat dalam bidang obstetri dan ginekologi asal Irak, pendiri dan presiden Jannah Educational Institute di Irvine, California; ia lulus dari Mecca Institute for Islamic Studies dan Al-Huda School for Quran Memorization di Jeddah, menghafal Al-Quran, mengajar Al-Qur'an, tafsir, dan pemurnian. Ia adalah peneliti tetap di Islamic Center di Irvine."
