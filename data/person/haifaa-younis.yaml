summary:
  ar: "طبيبة أمريكية معتمدة في طب النساء والتوليد من أصول عراقية، ومؤسسة معهد جنة التعليمي في إيرفاين بكاليفورنيا ورئيسته؛ تخرجت في معهد مكة للدراسات الإسلامية ومدرسة الهدى لتحفيظ القرآن في جدة وحفظت القرآن، وتدرّس القرآن والتفسير والتزكية، وهي باحثة مقيمة في المركز الإسلامي في إيرفاين."
  en: "American board-certified obstetrician-gynaecologist of Iraqi roots, founder and chairman of the Jannah Institute educational nonprofit in Irvine, California; a graduate of the Mecca Institute of Islamic Studies and the Al-Huda Qur'an Memorization School in Jeddah who memorised the Qur'an, teaches Qur'an, tafsir and tazkiyah, and is a resident scholar at the Islamic Center of Irvine."
  ur: "امریکی بورڈ سے سند یافتہ ماہرِ امراضِ نسواں و زچگی، عراقی نژاد؛ کیلیفورنیا کے شہر اروائن میں جنّہ انسٹیٹیوٹ کی بانی و صدر، جدہ کے معہدِ مکہ برائے اسلامی مطالعات اور مدرسہ الہدیٰ لتحفیظ القرآن کی فارغ التحصیل اور حافظہ قرآن، قرآن، تفسیر اور تزکیہ کی مدرّسہ اور اسلامک سینٹر آف اروائن کی مقیم عالمہ ہیں۔"
