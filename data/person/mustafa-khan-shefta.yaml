summary:
  ar: "شاعر وناقد أردي من دلهي (1809–1869)، من أسرة بانغاش من ملّاك الأراضي. كان صديق ميرزا غالب وراعيه، ومن أركان الحلقة الأدبية في دلهي، وألّف «گلشن بی خار»، وهو من أوائل تواريخ الشعر الأردي. سُجن سبع سنوات بعد ثورة 1857 وصودرت أملاكه، ثم أُعيد إليه نصفها."
  en: "Delhi Urdu poet and critic (1809–1869) of a Bangash Pathan landowning family. He was Mirza Ghalib's friend and patron and a pillar of Delhi's literary circle, and wrote Gulshan-e-be-khaar, an early history of Urdu poetry. Imprisoned for seven years after the 1857 rebellion, he had his estates seized and half restored on appeal."
  ur: "دہلی کے اردو شاعر و نقاد (1809ء–1869ء)، بنگش پٹھان جاگیردار خاندان سے۔ مرزا غالب کے دوست اور سرپرست، دہلی کے ادبی حلقے کے رکن، اور «گلشنِ بے خار» کے مصنف جو اردو شاعری کی اولین تواریخ میں سے ہے۔ 1857ء کے بعد سات سال قید رہے اور جاگیر ضبط ہوئی، جس کا نصف حصہ اپیل پر بحال ہوا۔"
