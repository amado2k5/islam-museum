id: person/sayf-al-dawla
class: person
label: { ar: "علي بن عبد الله بن حمدان سيف الدولة" , ur: "سیف الدولہ", en: "Sayf al-Dawla", es: "Sayf al-Dawla", fr: "Sayf al-Dawla"}
summary:
  ar: "أبو الحسن علي بن عبد الله بن حمدان، لقبه الخليفة سيف الدولة سنة ثلاثين لما وجده وأخاه ناصر الدولة بتكريت، وقاتل البريدي في وقعة هائلة بقرب المدائن فهزمه فعاد بالويل إلى واسط فساق إليها فانهزم البريدي إلى البصرة، وهاج عليه الأمراء بواسط فهرب في البرية يريد بغداد {cite:tarikh-khulafa-minhaj-1434 p. 609-610}. وعند المسعودي كاتبه المتقي وأخوه ناصر الدولة أن ينجداه ويستنقذاه مما هو فيه {cite:muruj-al-dhahab p. 692}، وعند ابن الأثير وفي سنة 351هـ كبس الروم مدينة حلب ولم يعلم بها حتى بلغها فخرج إليهم فقُتل أكثر أصحابه وجميع أولاد داود بن حمدان وانتزم في نفر يسير وظفر الدمستق بداره المعروفة بالدارين فوجد فيها ثلاثمائة بدرة من الدراهم وألفاً وأربعمائة بغل {cite:kamil-ibn-al-athir p. 400}، وعند ابن الجوزي وفي سنة 343هـ ظفر بالدمستق بطريق الروم ظفراً عظيماً وقتل خلقاً من أصحابه ورؤساء بطارقته {cite:muntazam-ibn-al-jawzi p. 668} توفي في صفر سنة ست وخمسين وثلاث مئة وله بضع وخمسون سنة مات بالفالج وقيل بعسر البول وكان قد جمع من الضِّبار الذي أصابه في الغزوات ما جاء منه لبنة بقدر الكف وأوصى أن يوضع خده إذا دفن عليها، قال الثعالبي في اليتيمة كان بنو حمدان ملوكاً أرجلهم للصباحة وألسنتهم للفصاحة وأيديهم للسماحة وعقولهم للرجاحة وسيف الدولة شهم سادتهم وواسطة قلائدتهم لم يجتمع بباب أحد من الملوك بعد الخلفاء ما اجتمع ببابه من شيوخ الشعراء وغيرهم وكان شاعراً، وتملك بعده ابنه سعد الدولة خمساً وعشرين سنة وبعده ولده أبو الفضل وبموته انقرض ملك بني سيف الدولة {cite:shadharat-dhahab p. 28-29}. وعند ابن الجوزي غزا سنة تسع وثلاثين فأوغل وفتح حصونًا ثم أخذوا عليه درب الخروج فتلف من كان معه أسرًا وقتلًا وأُخذت خزانته وكراعه وسلاحه وأفلت في عدد يسير وكان معه ألف رجل، وفي سنة اثنتين وأربعين أسَر قسطنطين بن الدمستق، وفي سنة ثلاث وأربعين وقع وقعة عظيمة مع الدمستق قُتل فيها خلق ورؤساء بطارقته {cite:muntazam-ibn-al-jawzi p. 661, 664, 666}."
  en: "Abu'l-Hasan Ali ibn Hamdan, titled Sayf al-Dawla by the caliph at Takrit in 330; he crushed al-Baridi in a dreadful battle near Mada'in and drove him to Basra, then his own amirs rose at Wasit and he fled through the desert {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
  ur: "حلب کا حمدانی حکمران، متنبی کا سرپرست اور بازنطینی سرحد کی جنگوں سے وابستہ امیر؛ اس کے عہد میں حلب کو حملے اور تباہی کا سامنا ہوا۔ {cite:shadharat-dhahab}"
  es: "Abu'l-Hasan Ali ibn Hamdan, titulado Sayf al-Dawla por el califa en Takrit en 330; aplastó a al-Baridi en una terrible batalla cerca de Mada'in y lo obligó a huir a Basora, luego sus propios emires se alzaron en Wasit y huyó a través del desierto {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
  fr: "Abu'l-Hasan Ali ibn Hamdan, titré Sayf al-Dawla par le calife à Takrit en 330; il écrasa al-Baridi dans une terrible bataille près de Mada'in et le chassa à Basra, puis ses propres émirs se soulevèrent à Wasit et il s'enfuit à travers le désert {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
  tr: "Ebu el-Hasan Ali ibn Abdullah ibn Hamdan, 30 Hicri yılında Halife Seyf al-Devle lakabını andı; kendisi ve kardeşi Nasir el-Devla onu Tikrit'te buldular. El-Medeyn yakınlarında al-Buraidi ile şiddetli bir savaşta onu yendi ve sıkıntılı halde Vasit'e döndü. El-Buraidi oraya sürdü ve el-Buraidi Basra prensleri tarafından yenildi. Vasit'teki prensler ona saldırdı, bu yüzden Bağdat'ı aramak için çöle kaçtı {atıf:Tarikh-khulafa-minhaj-1434, s. 609-610}. El-Mes'udi'ye göre, kâtipi el-Muttaqi ve kardeşi Nasir el-Devla, onu kurtarmak ve durumundan kurtarmak için {atıf:muruj-al-dhahab, s. 692}. İbn el-Athir'e göre, 351 Hicri yılında Romalılar Halep şehrini kuşattı, ancak oraya ulaşana kadar bundan habersizdiler. Onlara gitti, yoldaşlarının çoğunu ve Davud bin Hamdan'ın tüm oğullarını öldürdü ve küçük bir grupla toplandı. El-Damastiq, el-Dəreyn olarak bilinen evini ele geçirdi; burada üç yüz dirhem ve bin dört yüz katır buldu. {alıntı: Kamil-ibn-al-Athir s. 400} ve İbn al-Jawzi'ye göre, 343 Hicri yılında, Romalılara giden yolda Şam'da büyük bir zafer kazandı ve bazı yoldaşlarını ve reislerini öldürdü {atıf:Muntazam-ibn-al-jawzi s. 668}. Üç yüz elli altı yaşında Safar'da öldü. Felçten, bazılarına göre idrardan öldü. Savaşlar sırasında çektiği dhapbardan palmiye büyüklüğünde bir tuğla toplamış ve gömülürken yanağının üzerine konmasını tavsiye etmiştir. Al-Yatima'da Banu Hamdan'ın sabah ayaklarının kralları olduğunu söylemiştir Dilleri etkileyici, elleri cömert, zihinleri bilgeydi ve Seyf-dövle efendilerinin soylu efendisi ve kolyelerinin aracısıydı. Halifelerden sonra hiçbir kral kapıda toplanmadı; o bir şairdi. O bir şairdi ve yirmi beş yıl hüküm sürdü, ardından oğlu Ebu el-Fadl hüküm sürdü. Ölümünden sonra Banu Seyf el-Devle'nin yönetimi sona erdi {cite:shadharat-dhahab, s. 28-29}. İbn el-Cewzi'ye göre, otuz dokuzuncu yılda bir baskın düzenledi, derin ilerledi ve kaleleri ele geçirdi. Sonra onu dışarı çıkardılar, yanındakiler yakalandı ve öldürüldü, hazinesi, deve ve silahları alındı, az sayıda kişi bin adamla birlikte serbest bırakıldı. Kırk iki yılda Konstantin bin el-Damastiq esir alındı. Kırk üçüncü yılda, el-Damastiq ile büyük bir savaş gerçekleşti; bu savaşta patriklerinin halkı ve liderleri öldürüldü {atıf:Muntazam-ibn-al-jawzi s. 661, 664, 666}."
  id: "Abu al-Hasan Ali ibn Abdullah ibn Hamdan, dijuluki Khalifah Sayf al-Dawla pada tahun 30 H, ketika ia dan saudaranya Nasir al-Dawla menemukannya di Tikrit. Ia bertempur sengit melawan al-Buraidi di dekat al-Mada'in, mengalahkannya, dan kembali ke Wasit dalam kesusahan. Al-Buraidi menyerbu ke sana, dan al-Buraidi dikalahkan oleh para pangeran Basra. Para pangeran di Wasit menyerangnya, sehingga ia melarikan diri ke padang gurun mencari Baghdad {cite:Tarikh-khulafa-minhaj-1434, hlm. 609-610}. Menurut al-Mas'udi, juru tulisnya al-Muttaqi dan saudaranya Nasir al-Dawla, untuk menyelamatkannya dan menyelamatkannya dari keadaannya {cite:muruj-al-dhahab, hlm. 692}. Menurut Ibn al-Athir, pada tahun 351 H, orang Romawi mengepung kota Aleppo tanpa menyadarinya sampai mereka sampai di sana. Dia pergi ke arah mereka, membunuh sebagian besar sahabatnya dan semua putra Dawud ibn Hamdan, dan berkumpul dengan sekelompok kecil. Al-Damastiq merebut rumahnya yang dikenal sebagai al-Darayn, di mana dia menemukan tiga ratus dirham dan seribu empat ratus keledai. {cite: kamil-ibn-al-athir hlm. 400}, dan menurut Ibn al-Jawzi, pada tahun 343 H, ia meraih kemenangan besar di Damaskus dalam perjalanan menuju bangsa Romawi dan membunuh beberapa sahabat serta kepala sukunya {cite:Muntazam-ibn-al-jawzi hlm. 668}. Ia meninggal di Safar pada tahun tiga ratus lima puluh enam tahun. Ia meninggal karena kelumpuhan, atau ada yang mengatakan karena kencing kecil. Ia telah mengumpulkan dari dhabbar yang ia alami selama pertempuran sebuah batu bata sebesar palem dan merekomendasikan agar pipinya diletakkan di atas batu bata itu saat dimakamkan di atasnya. Al-Tha'alibi mengatakan dalam Al-Yatimah bahwa Banu Hamdan adalah raja kaki mereka di pagi hari Bahasa mereka fasih, tangan mereka murah hati, pikiran mereka bijaksana, dan Sayf al-Dawla adalah guru mulia bagi para guru mereka dan menjadi penengah kalung mereka. Tidak ada raja setelah khalifah yang bertemu di gerbang; ia adalah seorang penyair. Ia adalah penyair dan memerintah selama dua puluh lima tahun, diikuti oleh putranya Abu al-Fadl. Setelah kematiannya, pemerintahan Banu Sayf al-Dawla berakhir {cite:shadharat-dhahab, hlm. 28-29}. Menurut Ibn al-Jawzi, ia melancarkan serangan pada tahun tiga puluh sembilan, maju jauh, dan merebut benteng-benteng. Kemudian mereka membawanya ke jalan keluar, dan mereka yang bersamanya ditangkap dan dibunuh, harta karun, unta, dan senjatanya diambil, dan sejumlah kecil dibebaskan, ditemani seribu orang. Pada tahun empat puluh dua, Konstantinus ibn al-Damastiq ditangkap. Pada tahun empat puluh tiga, terjadi pertempuran besar dengan al-Damastiq, di mana rakyat dan pemimpin para patriarknya tewas {cite:Muntazam-ibn-al-jawzi hlm. 661, 664, 666}."
