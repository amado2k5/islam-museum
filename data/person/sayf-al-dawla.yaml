id: person/sayf-al-dawla
class: person
label: { ar: "علي بن عبد الله بن حمدان سيف الدولة" }
summary:
  ar: "أبو الحسن علي بن عبد الله بن حمدان، لقبه الخليفة سيف الدولة سنة ثلاثين لما وجده وأخاه ناصر الدولة بتكريت، وقاتل البريدي في وقعة هائلة بقرب المدائن فهزمه فعاد بالويل إلى واسط فساق إليها فانهزم البريدي إلى البصرة، وهاج عليه الأمراء بواسط فهرب في البرية يريد بغداد {cite:tarikh-khulafa-minhaj-1434 p. 609-610}.، وعند المسعودي كاتبه المتقي وأخوه ناصر الدولة أن ينجداه ويستنقذاه مما هو فيه {cite:muruj-al-dhahab p. 692}، وعند ابن الأثير وفي سنة 351هـ كبس الروم مدينة حلب ولم يعلم بها حتى بلغها فخرج إليهم فقُتل أكثر أصحابه وجميع أولاد داود بن حمدان وانتزم في نفر يسير وظفر الدمستق بداره المعروفة بالدارين فوجد فيها ثلاثمائة بدرة من الدراهم وألفاً وأربعمائة بغل {cite:kamil-ibn-al-athir p. 400}، وعند ابن الجوزي وفي سنة 343هـ ظفر بالدمستق بطريق الروم ظفراً عظيماً وقتل خلقاً من أصحابه ورؤساء بطارقته {cite:muntazam-ibn-al-jawzi p. 668}"
  en: "Abu'l-Hasan Ali ibn Hamdan, titled Sayf al-Dawla by the caliph at Takrit in 330; he crushed al-Baridi in a dreadful battle near Mada'in and drove him to Basra, then his own amirs rose at Wasit and he fled through the desert {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
