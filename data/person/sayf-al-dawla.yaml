label: { ar: "علي بن عبد الله بن حمدان سيف الدولة" }
summary:
  ar: "أبو الحسن علي بن عبد الله بن حمدان، لقبه الخليفة سيف الدولة سنة ثلاثين لما وجده وأخاه ناصر الدولة بتكريت، وقاتل البريدي في وقعة هائلة بقرب المدائن فهزمه فعاد بالويل إلى واسط فساق إليها فانهزم البريدي إلى البصرة، وهاج عليه الأمراء بواسط فهرب في البرية يريد بغداد {cite:tarikh-khulafa-minhaj-1434 p. 609-610}.، وعند المسعودي كاتبه المتقي وأخوه ناصر الدولة أن ينجداه ويستنقذاه مما هو فيه {cite:muruj-al-dhahab p. 692}"
  en: "Abu'l-Hasan Ali ibn Hamdan, titled Sayf al-Dawla by the caliph at Takrit in 330; he crushed al-Baridi in a dreadful battle near Mada'in and drove him to Basra, then his own amirs rose at Wasit and he fled through the desert {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
