  ar: "إبراهيم بن عبد الله بن إبراهيم بن سيف الوائلي النجدي، عالم فقيه حنبلي، أصله من نجد وسكن الحجاز، وانتهت إليه رئاسة المذهب فيه، ولد بالمدينة وتوفي بها. من تصانيفه «العذب الفائض شرح عمدة كل فارض» المعروفة بألفية الفرائض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2046}"
