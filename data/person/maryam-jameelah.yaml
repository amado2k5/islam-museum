summary:
  ar: "كاتبة أمريكية المولد باكستانية الإقامة، وُلدت باسم مارغريت ماركوس سنة 1934 في نيو روشيل بولاية نيويورك لأسرة يهودية، واعتنقت الإسلام في 24 مايو 1961 بعد قراءة القرآن وكتب محمد أسد، ثم راسلت أبا الأعلى المودودي وانتقلت إلى لاهور سنة 1962 وتزوجت وأقامت فيها حتى وفاتها سنة 2012. كتبت ما يزيد على ثلاثين كتابًا ومقالًا في الدفاع عن فهم محافظ للإسلام ونقد الحداثة والغرب."
  en: "American-born writer who lived in Pakistan. Born Margaret Marcus at New Rochelle, New York, in 1934 to a Jewish family, she embraced Islam on 24 May 1961 after reading the Qur'an and the work of Muhammad Asad, corresponded with Abul Ala Mawdudi, moved to Lahore in 1962, married there and lived in the city until her death in 2012. She wrote more than thirty books and essays defending a conservative reading of Islam and criticising modernism and the West."
  ur: "امریکہ میں پیدا ہونے والی مصنفہ جو پاکستان میں مقیم رہیں۔ وہ 1934 میں نیو روشیل، نیویارک میں ایک یہودی خاندان میں مارگریٹ مارکس کے نام سے پیدا ہوئیں، قرآن اور محمد اسد کی تحریریں پڑھ کر 24 مئی 1961 کو مسلمان ہوئیں، ابو الاعلیٰ مودودی سے خط و کتابت کی، 1962 میں لاہور منتقل ہوئیں، وہیں شادی کی اور 2012 میں وفات تک وہیں رہیں۔ انھوں نے اسلام کی ایک قدامت پسند تعبیر کے دفاع اور جدیدیت و مغرب پر تنقید میں تیس سے زیادہ کتابیں اور مضامین لکھے۔"
  fr: "Écrivaine née aux États-Unis qui vécut au Pakistan. Née Margaret Marcus à New Rochelle (New York) en 1934 dans une famille juive, elle embrassa l'islam le 24 mai 1961 après avoir lu le Coran et l'œuvre de Muhammad Asad, correspondit avec Abul Ala Mawdudi, s'installa à Lahore en 1962, s'y maria et y vécut jusqu'à sa mort en 2012. Elle écrivit plus de trente livres et essais défendant une lecture conservatrice de l'islam et critiquant la modernité et l'Occident."
  es: "Escritora nacida en Estados Unidos que vivió en Pakistán. Nacida como Margaret Marcus en New Rochelle (Nueva York) en 1934 en una familia judía, abrazó el islam el 24 de mayo de 1961 tras leer el Corán y la obra de Muhammad Asad, mantuvo correspondencia con Abul Ala Mawdudi, se trasladó a Lahore en 1962, se casó allí y vivió en la ciudad hasta su muerte en 2012. Escribió más de treinta libros y ensayos que defienden una lectura conservadora del islam y critican la modernidad y Occidente."
