summary:
  ar: "الشيخ شمس الدين محمد الشامي نزيل التربة البرقوقية؛ قال الشعراني في ذيله على طبقاته: كان عالماً صالحاً متفنناً في العلوم وألف السيرة النبوية المشهورة التي جمعها من ألف كتاب وأقبل الناس على كتابتها ومشى فيها على أنموذج لم يسبق إليه أحد؛ كان عزباً لم يتزوج قط، إذا قدم عليه الضيف علّق القدر وطبخ له، حلو المنطق مهيب النظر كثير الصيام والقيام، وكان إذا مات أحد من طلبة العلم وخلف أولاداً قاصرين وله وظائف يذهب إلى القاضي ويتقرر فيها ويباشرها ويعطي معلومها للأيتام حتى يصلحوا للمباشرة، وكان لا يقبل من مال الولاة وأعوانهم شيئاً ولا يأكل من طعامهم. ومن مؤلفاته: عقود الجمان في مناقب أبي حنيفة، الجامع الوجيز الخادم للغات القرآن، مرشد السالك إلى ألفية ابن مالك ونكت عليها من نكت شيخه السيوطي، الآيات العظيمة الباهرة في معراج سيد أهل الدنيا والآخرة ومختصره، كشف اللبس في رد الشمس، شرح الآجرومية، الفتح الرحماني شرح أدب الجرجاني، إتحاف الراغب الواعي في ترجمة أبي عمرو الأوزاعي، الفوائد المجموعة في الأحاديث الموضوعة، عين الإصابة في معرفة الصحابة؛ توفي يوم الاثنين رابع عشر شعبان {cite:shadharat-dhahab p. 666-667}."
  en: "The celibate of the Barquqiyya turba — compiler of the famous Sira 'gathered from a thousand books' that readers rushed to copy on a pattern no one had preceded; he cooked for his own guests, advanced the stipends of dead students' orphans before the qadi, took nothing from rulers' money; his works include 'Uqud al-Juman on Abu Hanifa's virtues, the two Mi'raj compilations, 'Ayn al-Isaba fi ma'rifat al-Sahaba, and his teacher al-Suyuti's Nukat; died Monday 14 Sha'ban [942] {cite:shadharat-dhahab p. 666-667}."
  es: "El célibe del turba Barquqiyya — compilador de la famosa Sira 'reunida de mil libros' que los lectores se apresuraron a copiar siguiendo un patrón que nadie había precedido; cocinaba para sus propios invitados, adelantaba los estipendios de los huérfanos de los estudiantes fallecidos ante el cadí, no tomaba nada del dinero de los gobernantes; sus obras incluyen 'Uqud al-Juman sobre las virtudes de Abu Hanifa, las dos compilaciones Mi'raj, 'Ayn al-Isaba fi ma'rifat al-Sahaba y el Nukat de su maestro al-Suyuti; murió el lunes 14 de Sha'ban [942] {cite:shadharat-dhahab p. 666-667}."
  fr: "Le célibataire du Barquqiyya turba — compilateur de la célèbre Sira « rassemblée à partir de mille livres » que les lecteurs se sont empressés de copier selon un modèle inédit; il cuisinait pour ses propres invités, avançait les allocations des orphelins d'étudiants décédés devant le cadi, ne prenait rien de l'argent des dirigeants; ses œuvres comprennent 'Uqud al-Juman sur les vertus d'Abu Hanifa, les deux compilations Mi'raj, 'Ayn al-Isaba fi ma'rifat al-Sahaba, et le Nukat de son maître al-Suyuti; décédé le lundi 14 Sha'ban [942] {cite:shadharat-dhahab p. 666-667}."
  ur: "برقوی تربہ کا برہمن - مشہور سیرت کے مرتب 'ہزار کتابوں سے جمع' جسے قارئین اس طرز پر نقل کرنے کے لیے دوڑ پڑے جس سے پہلے کوئی نہیں تھا۔ اس نے اپنے مہمانوں کے لیے کھانا پکایا، مردہ طالب علموں کے یتیموں کا وظیفہ قاضی کے سامنے پیش کیا، حکمرانوں کے پیسے سے کچھ نہیں لیا۔ ان کی تصانیف میں ابوحنیفہ کے فضائل پر عقد الجمان، معراج کی دو تالیفات، عین الاصابہ فی معرفۃ الصحابہ، اور ان کے استاد السیوطی کی نکات شامل ہیں۔ وفات سوموار 14 شعبان [942] 666-667}۔"
  tr: "Barquqi topraklarından sakin Şeyh Şemseddin Muhammed el-Şami; El-Şa'rani, Tabakat'ının ekinde şöyle demiştir: Doğru bir alim ve bilimlerde yetenekliydi, binlerce kitaptan topladığı ünlü peygamberlik biyografisini yazdı ve insanlar eşi benzeri görülmemiş bir örnekle onu hevesle takip etti; evlenmedi ve hiç evlenmedi. Bir misafir ona geldiğinde, tencereyi asar, onun için yemek yapardı. Mantık başında olan, etkileyici bir görüşe sahipti ve sık sık oruç tutar, namaz kılardı. Bir bilgi öğrencisi küçük çocuklar bırakıp öldüğünde, yargıca gider, görevlendirilir, onları üstlenir ve yetimlere doğrudan izin vermeye uygun olana kadar bilgilerini verirdi. Valilerin ve yardımcılarının servetinden hiçbir şey kabul etmezdi, yemeklerinden yemez de yemezdi. Eserleri arasında: 'Uqud al-Juman fi Manaqib Abi Hanifa', 'Al-Jami' al-Wajiz al-Khadim li Lughat al-Qur'an', 'Murshid al-Salik ila Alfiyyah Ibn Malik and Nutgets from His His Points of His Sheikh al-Suyuti', 'The Greats of the Nations of the World of the Nation'ın Yükselişinde Büyük ve Parlak Ayetler' ve 'Mukhtasarhu', 'Kashf al-Bulbas fi Radd al-Shams', 'Sharh al-Ajurrumiyya', 'Al-Fath al-Rahmani', 'Sharh Adab al-Jurjani', 'Ithaf al-Raghib al-Wa'i fi Bijli Abu al-Awza'i', 'Al-Fawa'id fi al-Hadis al-Mawdu'ah', 'Ayn al-Isab fi Ma'rifat al-Sahaba'; Şa'ban ayının on dördü Pazartesi günü vefat etti {alıntı:Shadharat-Dhahab s. 666-667}."
  id: "Sheikh Shams al-Din Muhammad al-Shami, penduduk tanah Barquqi; Al-Sha'rani berkata dalam suplemen Tabaqat-nya: Dia adalah seorang ulama yang benar dan ahli dalam ilmu pengetahuan, menulis biografi nubuat terkenal yang dikumpulkannya dari seribu buku, dan orang-orang dengan antusias mengikutinya sesuai dengan contoh yang belum pernah terjadi sebelumnya; dia belum menikah dan tidak pernah menikah. Setiap kali tamu datang kepadanya, dia akan menggantung panci dan memasak untuknya. Dia memiliki logika yang baik, visi yang megah, dan sering berpuasa serta berdoa. Ketika seorang pelajar ilmu meninggal dunia, meninggalkan anak-anak di bawah umur, dia akan pergi ke hakim, ditunjuk di sana, mengambil mereka, dan memberikan informasi mereka kepada anak yatim sampai mereka layak untuk mengambil cuti langsung. Dia tidak menerima apa pun dari kekayaan para gubernur dan para asisten mereka, juga tidak makan dari makanan mereka. Di antara karya-karyanya: 'Uqud al-Juman fi Manaqib Abi Hanifa', 'Al-Jami' al-Wajiz al-Khadim li Lughat al-Qur'an', 'Murshid al-Salik ila Alfiyyah Ibn Malik dan Nutgets dari Titik Sheikh al-Suyuti', 'Ayat-ayat Agung dan Cemerlang dalam Kenaikan Penguasa Bangsa Dunia' dan 'Mukhtasarhu', 'Kashf al-Bulbas fi Radd al-Suyuti', -Shams', 'Sharh al-Ajurrumiyya', 'Al-Fath al-Rahmani' 'Sharh Adab al-Jurjani', 'Ithaf al-Raghib al-Wa'i fi Bijli Abu al-Awza'i', 'Al-Fawa'id fi al-Ahadith al-Mawdu'ah', 'Ayn al-Isab fi Ma'rifat al-Sahaba'; ia meninggal pada hari Senin, tanggal empat belas Sha'ban {cite:Shadharat-Dhahab hlm. 666-667}."
