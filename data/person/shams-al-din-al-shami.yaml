summary:
  ar: "الشيخ شمس الدين محمد الشامي نزيل التربة البرقوقية؛ قال الشعراني في ذيله على طبقاته: كان عالماً صالحاً متفنناً في العلوم وألف السيرة النبوية المشهورة التي جمعها من ألف كتاب وأقبل الناس على كتابتها ومشى فيها على أنموذج لم يسبق إليه أحد؛ كان عزباً لم يتزوج قط، إذا قدم عليه الضيف علّق القدر وطبخ له، حلو المنطق مهيب النظر كثير الصيام والقيام، وكان إذا مات أحد من طلبة العلم وخلف أولاداً قاصرين وله وظائف يذهب إلى القاضي ويتقرر فيها ويباشرها ويعطي معلومها للأيتام حتى يصلحوا للمباشرة، وكان لا يقبل من مال الولاة وأعوانهم شيئاً ولا يأكل من طعامهم. ومن مؤلفاته: عقود الجمان في مناقب أبي حنيفة، الجامع الوجيز الخادم للغات القرآن، مرشد السالك إلى ألفية ابن مالك ونكت عليها من نكت شيخه السيوطي، الآيات العظيمة الباهرة في معراج سيد أهل الدنيا والآخرة ومختصره، كشف اللبس في رد الشمس، شرح الآجرومية، الفتح الرحماني شرح أدب الجرجاني، إتحاف الراغب الواعي في ترجمة أبي عمرو الأوزاعي، الفوائد المجموعة في الأحاديث الموضوعة، عين الإصابة في معرفة الصحابة؛ توفي يوم الاثنين رابع عشر شعبان {cite:shadharat-dhahab p. 666-667}."
  en: "The celibate of the Barquqiyya turba — compiler of the famous Sira 'gathered from a thousand books' that readers rushed to copy on a pattern no one had preceded; he cooked for his own guests, advanced the stipends of dead students' orphans before the qadi, took nothing from rulers' money; his works include 'Uqud al-Juman on Abu Hanifa's virtues, the two Mi'raj compilations, 'Ayn al-Isaba fi ma'rifat al-Sahaba, and his teacher al-Suyuti's Nukat; died Monday 14 Sha'ban [942] {cite:shadharat-dhahab p. 666-667}."
