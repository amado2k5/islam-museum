summary:
  ar: "حيّان بن شريح؛ عامل عمر بن عبد العزيز على مصر، قرأ الصلت بن أبي عاصم كاتبه كتاب عمر إليه أن مصر فتحت عنوة بغير عهد ولا عقد. ويذكر الكتاب أن عمر بن عبد العزيز كتب إليه بأن يضع الجزية عمن أسلم من أهل الذمة، مستدلاً بآيات من سورة التوبة. {cite:salabi-umayyad-state-2020 p.203}"
  en: "Hayyan ibn Shurayh; Umar ibn Abd al-Aziz's governor over Egypt — his scribe al-Salt ibn Abi Asim read him Umar's letter stating that Egypt was conquered by force with neither covenant nor contract."
