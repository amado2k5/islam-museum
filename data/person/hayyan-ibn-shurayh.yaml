id: person/hayyan-ibn-shurayh
class: person
label: { ar: "حيّان بن شريح", en: "Hayyan ibn Shurayh", es: "Hayyan ibn Shurayh", fr: "Hayyan ibn Shurayh", ur: "حیان بن شریح" }
summary:
  ar: "حيّان بن شريح؛ عامل عمر بن عبد العزيز على مصر، قرأ الصلت بن أبي عاصم كاتبه كتاب عمر إليه أن مصر فتحت عنوة بغير عهد ولا عقد. ويذكر الكتاب أن عمر بن عبد العزيز كتب إليه بأن يضع الجزية عمن أسلم من أهل الذمة، مستدلاً بآيات من سورة التوبة. {cite:salabi-umayyad-state-2020 p.203}"
  en: "Hayyan ibn Shurayh; Umar ibn Abd al-Aziz's governor over Egypt — his scribe al-Salt ibn Abi Asim read him Umar's letter stating that Egypt was conquered by force with neither covenant nor contract."
  es: "Hayyan ibn Shurayh, gobernador de Egipto bajo el mandato de Umar ibn Abd al-Aziz, recibió como lectura de su escriba al-Salt ibn Abi Asim la carta de Umar en la que afirmaba que Egipto había sido conquistado por la fuerza, sin pacto ni contrato alguno."
  fr: "Hayyan ibn Shurayh; gouverneur d'Umar ibn Abd al-Aziz en Égypte — son scribe al-Salt ibn Abi Asim lui lut la lettre d'Umar déclarant que l'Égypte avait été conquise par la force sans alliance ni contrat."
  ur: "حیان بن شریح؛ عمر بن عبدالعزیز کا مصر کا گورنر - اس کے کاتب السلط ابن ابی عاصم نے اسے عمر کا خط پڑھ کر سنایا جس میں کہا گیا تھا کہ مصر کو طاقت کے ذریعے فتح کیا گیا تھا نہ کسی عہد اور نہ ہی معاہدے کے۔"
  tr: "Ömer bin Abdülaziz'in Mısır valisi Hayyan bin Şurayh, Mısır'ın herhangi bir antlaşma veya sözleşme olmadan zorla fethedildiğini belirten Ömer bin Şuray'ın mektubunu okudu. Mektupta, Ömer bin Abdülaziz'in zimmiler arasından İslam'ı benimseyenlere cizye dayatmak için yazdığı ve Tevbe Suresi'nden ayetler alıntılandığı belirtilir. {kaynak:Selabi-Umayyad-devlet-2020 s.203}"
  id: "Hayyan ibn Shurayh, gubernur Umar ibn Abd al-Aziz atas Mesir, membacakan surat Umar kepadanya yang menyatakan bahwa Mesir ditaklukkan secara paksa tanpa perjanjian atau kontrak. Surat tersebut menyebutkan bahwa Umar ibn Abd al-Aziz menulis kepadanya untuk memaksakan jizya kepada mereka yang memeluk Islam dari kalangan dhimmi, dengan mengutip ayat-ayat dari Surah At-Tawbah. {sitasi: Salabi-Umayyad-State-2020 hlm.203}"
