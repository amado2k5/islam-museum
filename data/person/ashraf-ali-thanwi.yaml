summary:
  ar: "عالم وفقيه حنفي ديوبندي ومتصوّف جشتي (1863-1943) من تهانه بهون بالهند، لُقّب بحكيم الأمة. تخرج من دار العلوم ديوبند، ودرّس في كانبور أربع عشرة سنة، ثم أحيا خانقاه أستاذه إمداد الله مهاجر مكي في بلدته وأسس المدرسة الأشرفية، فقصده المريدون من أنحاء الهند. بلغت مؤلفاته نحو ثمانمائة، أشهرها تفسير «بيان القرآن» و«بهشتي زيور»."
  en: "Indian Hanafi scholar of the Deobandi school and Chishti Sufi guide (1863–1943) of Thana Bhawan, known as Hakimul Ummat ('physician of the umma'). A graduate of Darul Uloom Deoband, he taught fourteen years at Kanpur, then revived his master Imdadullah Muhajir Makki's khanqah in his home town and founded the Madrasa Ashrafiya, drawing disciples from across India. His works number some eight hundred, the best known being the tafsir Bayan-ul-Qur'an and Behishti Zewar."
  ur: "ہندوستانی حنفی عالم، دیوبندی بزرگ اور چشتی صوفی (1863ء–1943ء) جن کا تعلق تھانہ بھون سے تھا اور جو حکیم الامت کے لقب سے مشہور ہیں۔ دار العلوم دیوبند سے فارغ ہو کر انھوں نے کانپور میں چودہ برس پڑھایا، پھر اپنے مرشد امداد اللہ مہاجر مکی کی خانقاہ اپنے قصبے میں آباد کی اور مدرسہ اشرفیہ قائم کیا۔ ان کی تصانیف تقریباً آٹھ سو ہیں، جن میں «بیان القرآن» اور «بہشتی زیور» سب سے مشہور ہیں۔"
