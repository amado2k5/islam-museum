  note: "Died at Thana Bhawan on 20 July 1943: the English and Urdu articles and Wikidata agree, and the Urdu article pairs the day with 16 Rajab 1362 AH; his funeral prayer was led by his disciple Zafar Ahmad Usmani and he was buried in the town's cemetery. VARIANTS: the TDV encyclopedia gives 6 Rajab 1362, converted there to 9 July 1943; the Arabic article's infobox prints 4 July 1943, against its own lead's 1362 AH. The majority date is followed. The Hijri year (1362) is agreed; it is marked derived because its day-pairing differs between the sources. Thana Bhawan has no place entity in the museum yet, so no died_in relation is written."
