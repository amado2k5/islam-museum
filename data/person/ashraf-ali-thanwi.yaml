    note: "His Sufi affiliation is attested personally, not inferred from the movement. The Urdu article's infobox gives his Sufi order as Chishti and its lead calls him a Chishti murshid (guide); it records his bay'ah to Imdadullah Muhajir Makki at Mecca and the khilafa (authorisation) Imdadullah granted him after a six-month stay in 1310 AH. TDV independently records his discipleship (intisab) to Imdadullah, 'among the shaykhs of the Chishtiyya order', and styles the subject himself a Sufi (mutasavvif); the Arabic article's apparatus files him among the Chishtis; the English article names Imdadullah as his master and records his direction of the Khanqah-i-Imdadiyah at Thana Bhawan, with about a thousand trainees authorised by him for bay'ah. The member_of relation to group/chishtiyya records the order."
