summary:
  ar: "جابر بن يزيد بن الحارث الجعفي، أبو عبد الله، تابعي من فقهاء الشيعة، من أهل الكوفة، أثنى عليه بعض رجال الحديث واتهمه آخرون بالقول بالرجعة؛ مات بالكوفة سنة 128 هـ الموافقة 745م."
  en: "Jabir ibn Yazid ibn al-Harith al-Ju'fi, Abu Abd Allah, a tabi'i and one of the Shi'i jurists, of Kufa; some hadith men praised him and others accused him of holding the raj'a; he died in Kufa in 128 AH (745 CE)."
  es: "Jabir ibn Yazid ibn al-Harith al-Ju'fi, Abu Abd Allah, un tabi'i y uno de los juristas chiítas, de Kufa; algunos hombres de hadices lo elogiaron y otros lo acusaron de ostentar el raj'a; murió en Kufa en el año 128 AH (745 d. C.)."
  fr: "Jabir ibn Yazid ibn al-Harith al-Ju'fi, Abu Abd Allah, un tabi'i et l'un des juristes chiites, de Kufa; certains hommes de hadith l'ont loué et d'autres l'ont accusé de détenir le raj'a; il est mort à Kufa en 128 AH (745 CE)."
  ur: "جابر بن یزید بن الحارث الجوفی، ابو عبد اللہ، تابعی اور شیعہ فقہاء میں سے ایک، کوفہ کے؛ بعض محدثین نے اس کی تعریف کی اور بعض نے ان پر رجعت کا الزام لگایا۔ آپ کی وفات 128ھ ⁦(745ء)⁩ میں کوفہ میں ہوئی۔"
