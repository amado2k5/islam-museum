  status: debated
  derived: false
  note: "The traditional death date, 284 AH (897 CE) in Egypt, comes from Yaqut citing the lost work of the Egyptian historian Abu Umar al-Kindi, and the Arabic and Urdu articles still carry it (the Arabic article adds a variant report of 298 AH, and Wikidata gives 905). Sean Anthony's biographical sketch in the Brill edition of his works (2018) shows that the 284 date is an erroneous conflation with a contemporary Egyptian hadith scholar, Abu Ja'far Ahmad ibn Ishaq ibn Wadih al-Assal, who died in Safar 284 AH: al-Ya'qubi's own verses on the fall of the Tulunids in 292 AH (905 CE) and on the death of the caliph al-Muktafi in 295 AH (908 CE) prove he outlived both, and he is believed to have died in Egypt shortly after 908. The year is therefore recorded as an approximation under debate, and no Hijri year is recorded: the traditional pairing of 284 AH belongs to the conflated date, and a death shortly after 295 AH fixes no single Hijri year."
  sources: [source/wikipedia-al-yaqubi-en, source/wikipedia-al-yaqubi-ar, source/wikipedia-al-yaqubi-ur, source/wikidata-al-yaqubi]

