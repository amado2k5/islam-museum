summary:
  ar: أحمد بن أبي يعقوب بن جعفر بن وهب بن واضح الكاتب العباسي، المعروف باليعقوبي، كما يسمّيه عنوان كتابه، صاحب التاريخ المعروف باسمه، الذي ينتهي الموجود منه بحوادث سنة 258هـ. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 3} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}
  en: Ahmad ibn Abi Ya'qub ibn Ja'far ibn Wahb ibn Wadih al-Katib al-Abbasi, known as al-Ya'qubi, as the title of his book names him; author of the history known by his name, whose surviving text ends with the events of 258 AH. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 3} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}
  ur: احمد بن ابی یعقوب بن جعفر بن وہب بن واضح الکاتب العباسی، جو الیعقوبی کے نام سے معروف ہیں، جیسا کہ ان کی کتاب کا عنوان انہیں پکارتا ہے؛ اپنے نام سے معروف تاریخ کے مصنف، جس کا موجود متن 258ھ کے واقعات پر ختم ہوتا ہے۔ {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. scan 3} {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}
