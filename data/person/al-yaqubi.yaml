  source: "The English, Arabic and Urdu Wikipedia articles on al-Ya'qubi and Wikidata Q293689, all read in full at the revisions recorded in their source files, fetched live from the MediaWiki API on 1 November 2026, the Wikidata revision re-asserted against a second live query and the QID grounded from the English article's own page property. The founder commissioned this build in the century queue's section I (826-925 additions), where the row gives his years as 812-897. Two queue points are corrected on the evidence: the birth year 812 is attested in no source read — no source records a birth year at all, and the modern scholarly estimate the English article reports is 230-240 AH (844-854 CE) — so no birth block is recorded and the estimate is carried in the summary and prose; and the death year 897, though still the lead date of the English article and the date of the Arabic and Urdu articles, is shown in the English article's own Death section, after Anthony's Brill biographical sketch (2018), to be a conflation with Ahmad ibn Ishaq al-Assal, so the death is built as shortly after 908, under debate. His name is likewise given in two traditions: the Brill sketch and the English and Urdu articles read Ahmad ibn Abi Ya'qub ibn Ja'far ibn Wahb ibn Wadih, while the Arabic biographical tradition (the Arabic article; al-Zirikli's al-A'lam) reads Ahmad ibn Ishaq; both forms stand in the names. He died in Egypt, but the museum has no place entity for Egypt, so the death place is prose-only; his Baghdad birth is written as an edge on the biographical tradition the English article reports (Zaman's Encyclopaedia of Islam entry) and the Arabic article states outright."
