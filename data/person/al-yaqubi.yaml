summary:
  ar: "أبو العباس أحمد بن أبي يعقوب اليعقوبي ⁦(ت. بعد 908 بقليل)⁩، المعروف بابن واضح، مؤرخ وجغرافي من العصر العباسي: كاتب بغدادي المولد خدم في أرمينية وعند الطاهريين بخراسان ثم عند الطولونيين بمصر، وألّف «تاريخ اليعقوبي» — تاريخًا عامًّا حتى سنة 873 — و«كتاب البلدان» (891) وهو من أقدم كتب الجغرافيا العربية الباقية. سنة مولده غير مدونة، ويقدّرها المؤرخون المحدثون بين 844 و854، وما يزال مذهبه موضع جدل علمي."
  en: "Abu l-Abbas Ahmad ibn Abi Ya'qub al-Ya'qubi (died shortly after 908), known as Ibn Wadih, was an Abbasid historian and geographer: a Baghdad-born chancery secretary who served in Armenia, under the Tahirids in Khurasan and under the Tulunids in Egypt, and wrote the Ta'rikh — a universal history down to 873 — and the Kitab al-Buldan (891), among the earliest surviving works of Arabic geography. His birth year is unrecorded; modern historians estimate 844-854. Whether he was a Shi'i, and of what kind, remains a live scholarly debate."
  ur: "ابو العباس احمد بن ابی یعقوب الیعقوبی ⁦(وفات 908ء کے کچھ بعد)⁩، جو ابن واضح کے نام سے مشهور ہیں، عباسی دور کے مورخ و جغرافیہ دان تھے: بغداد میں پیدا ہونے والے اس منشی نے آرمینیا، خراسان میں طاہریوں اور مصر میں طولونیوں کی خدمت کی، اور «تاریخ یعقوبی» — 873ء تک کی عالمی تاریخ — اور «کتاب البلدان» ⁦(891ء)⁩ لکھی جو عربی جغرافیے کی قدیم ترین باقی ماندہ کتابوں میں سے ہے۔ ان کی پیدائش کا سال درج نہیں؛ جدید مورخین اس کا تخمینہ 844–854ء لگاتے ہیں، اور ان کا مذہبی رجحان آج بھی علمی بحث کا موضوع ہے۔"

