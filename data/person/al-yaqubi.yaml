    note: >-
      Al-Ya'qubi's sectarian identity is one of the genuinely open questions of Abbasid
      historiography, and no settlement is recorded. The Shi'i reading: de Goeje (1876)
      called him a 'full-blooded Shi'ite' and Houtsma (1883) agreed; Millward and Marquet
      in the 1970s found his outlook broadly pro-Shi'ite though not insular, drawing on
      diverse non-sectarian sources; Sean Anthony (2016) concluded that his narrative of
      the early caliphate expresses a distinctively rejectionist (Rafidi) Shi'ite stance;
      recent Arabic scholarship (al-Ghannay, 2025) characterises him as fundamentally
      Imami; and the Arabic biographical tradition claims him for Shi'ism in Muhsin
      al-Amin's A'yan al-Shia and Aqa Buzurg al-Tihrani's al-Dhari'a. The specific-branch
      hypothesis: Houtsma, Brockelmann and Marquet proposed that he belonged to the
      Waqifa, who held the imamate to have ended with the seventh imam, Musa al-Kazim —
      a hypothesis incompatible with the Imami reading. The dissent: Elton Daniel (2004)
      argued that the textual signs of Shi'i bias are scribal artefacts of Safavid-era
      manuscripts and that his reverence for the Ahl al-Bayt reflects the Hashimi loyalty
      of an Abbasid client family; the Arabic article likewise records scholars who
      affirm he was a Sunni. The branch-specific attestations thus conflict (Waqifa
      against Imami), the general Shi'i attestation is itself disputed, and under the
      museum's rules a general attestation of 'Shi'a' settles nothing in any case.
      Wikidata's religion value is Islam in general — structured data only.
    sources: [source/wikipedia-al-yaqubi-en, source/wikipedia-al-yaqubi-ar, source/wikidata-al-yaqubi]

