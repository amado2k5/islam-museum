summary:
  ar: "شايسته خان (22 نوفمبر 1600 – نحو 1694)، المولود ميرزا أبو طالب، قائد مغولي وصوبه دار البنغال، وخال الإمبراطور أورنكزيب. حكم الدكن حيث هاجمه شيفاجي في بونه سنة 1663، ثم حكم البنغال قرابة أربعة وعشرين عامًا (1664–1688) ففتح تشيتاغونغ سنة 1666 ووسّع دكا وبنى مساجدها وقصورها، وكان أطول صوبه دارات البنغال بقاءً في المنصب."
  en: "Shaista Khan (22 November 1600 – c. 1694), born Mirza Abu Talib, was a Mughal general and subahdar of Bengal and the maternal uncle of Emperor Aurangzeb. He governed the Deccan, where Shivaji attacked him at Pune in 1663, then ruled Bengal for some twenty-four years (1664–1688), conquering Chittagong in 1666, expanding Dhaka and raising its mosques and palaces; his was the longest tenure of any subahdar of Bengal."
  ur: "شائستہ خان (22 نومبر 1600ء – تقریباً 1694ء)، اصل نام مرزا ابو طالب، مغل جرنیل اور بنگال کے صوبیدار اور شہنشاہ اورنگزیب کے ماموں تھے۔ انھوں نے دکن کی حکومت کی، جہاں 1663ء میں پونے میں شیواجی نے ان پر حملہ کیا، پھر تقریباً چوبیس سال (1664ء–1688ء) بنگال کے حاکم رہے، 1666ء میں چٹاگانگ فتح کیا، ڈھاکہ کو وسعت دی اور اس کی مساجد و محلات بنوائے؛ بنگال کے صوبیداروں میں ان کی مدت سب سے لمبی تھی۔"

