summary:
  ar: "عالم ومعلّم للتصوف (مواليد 1971)، وُلد في نوفاتو بكاليفورنيا؛ ابن ولاية عنايت خان وحفيد عنايت خان مؤسس الطريقة في الغرب، أُكّد خليفةً روحيًا لوالده سنة 2001 فصار رئيس الطريقة العنايتية، وأسّس أكاديمية سلوك للدراسات التأملية، وله كتب في التصوف منها «فرسان سراسان» و«قافلة الأرواح» و«مياه مختلطة»."
  en: "Scholar and teacher of Sufism (born 1971) in Novato, California. A son of Vilayat Inayat Khan and grandson of Inayat Khan, founder of the order in the West, he was confirmed as his father's spiritual successor in 2001 and heads the Inayatiyya; he founded Suluk Academy, a school of contemplative study, and his Sufi books include Saracen Chivalry, Caravan of Souls and Mingled Waters."
  ur: "تصوف کے عالم اور استاد (پیدائش 1971)، نوواٹو، کیلیفورنیا میں پیدا ہوئے؛ ولایت عنایت خان کے بیٹے اور عنایت خان کے پوتے، 2001 میں اپنے والد کے روحانی جانشین مقرر ہوئے اور عنایتی سلسلے کے سربراہ ہیں، انھوں نے سلک اکیڈمی قائم کی اور ان کی صوفی کتب میں «کاروانِ ارواح» شامل ہے۔"
