summary:
  ar: "أبو منصور ابن الرزاز سعيد بن محمد البغدادي شيخ الشافعية ومدرس النظامية؛ تفقه على الغزالي وأسعد الميهني والكيا الهراسي وأبي بكر الشاشي وأبي سعد المتولي، وروى عن رزق الله التميمي، وبرع وساد وصارت إليه رياسة المذهب وكان ذا سمت ووقار وجلالة؛ مولده سنة اثنتين وستين وأربعمائة وتوفي في ذي الحجة سنة تسع وثلاثين وخمسمائة ودفن بتربة الشيخ أبي إسحاق الشيرازي {cite:shadharat-dhahab p. 601-602}."
  en: "Abu Mansur Ibn al-Razzaz Sa'id ibn Muhammad, shaykh of the Shafi'is and mudarris of the Nizamiyya; he read fiqh under al-Ghazali, As'ad al-Mayhani, al-Kiya al-Harasi, Abu Bakr al-Shashi and Abu Sa'd al-Mutawalli, excelled and led till the madhhab's headship fell to him — a man of bearing, gravity and majesty; b. 462, d. Dhu al-Hijja 539, buried in Shaykh Abu Ishaq al-Shirazi's turbah {cite:shadharat-dhahab p. 601-602}."
