id: person/ibn-al-razzaz-said
class: person
label: { ar: "أبو منصور بن الرزاز" }
names:
  - { value: "أبو منصور سعيد بن محمد بن عمر بن الرزاز البغدادي", kind: full }
summary:
  ar: "أبو منصور ابن الرزاز سعيد بن محمد البغدادي شيخ الشافعية ومدرس النظامية؛ تفقه على الغزالي وأسعد الميهني والكيا الهراسي وأبي بكر الشاشي وأبي سعد المتولي، وروى عن رزق الله التميمي، وبرع وساد وصارت إليه رياسة المذهب وكان ذا سمت ووقار وجلالة؛ مولده سنة اثنتين وستين وأربعمائة وتوفي في ذي الحجة سنة تسع وثلاثين وخمسمائة ودفن بتربة الشيخ أبي إسحاق الشيرازي {cite:shadharat-dhahab p. 601-602}."
  en: "Abu Mansur Ibn al-Razzaz Sa'id ibn Muhammad, shaykh of the Shafi'is and mudarris of the Nizamiyya; he read fiqh under al-Ghazali, As'ad al-Mayhani, al-Kiya al-Harasi, Abu Bakr al-Shashi and Abu Sa'd al-Mutawalli, excelled and led till the madhhab's headship fell to him — a man of bearing, gravity and majesty; b. 462, d. Dhu al-Hijja 539, buried in Shaykh Abu Ishaq al-Shirazi's turbah {cite:shadharat-dhahab p. 601-602}."
  es: "Abu Mansur Ibn al-Razzaz Sa'id ibn Muhammad, shaykh de los Shafi'is y mudarris de Nizamiyya; leyó fiqh bajo al-Ghazali, As'ad al-Mayhani, al-Kiya al-Harasi, Abu Bakr al-Shashi y Abu Sa'd al-Mutawalli, sobresalió y dirigió hasta que la jefatura de la madhab recayó en él: un hombre de porte, gravedad y majestad; b. 462, d. Dhu al-Hijja 539, enterrado en la turbah de Shaykh Abu Ishaq al-Shirazi {cita: shadharat-dhahab p. 601-602}."
  fr: "Abu Mansur Ibn al-Razzaz Sa'id ibn Muhammad, cheikh des Shafi'is et mudarris des Nizamiyya; il a lu le fiqh sous al-Ghazali, As'ad al-Mayhani, al-Kiya al-Harasi, Abu Bakr al-Shashi et Abu Sa'd al-Mutawalli, a excellé et a dirigé jusqu'à ce que la direction du madhhab lui revienne - un homme d'allure, de gravité et de majesté; b. 462, d. Dhu al-Hijja 539, enterré dans la tourbah de Shaykh Abu Ishaq al-Shirazi {cite: shadharat-dhahab p. 601-602}."
  ur: "ابو منصور ابن الرزاز سعید بن محمد، شافعیوں کے شیخ اور نظامیہ کے مدارس؛ اس نے الغزالی، اسد المہانی، الکیا الحراسی، ابوبکر الشاشی اور ابو سعد المطولی کے تحت فقہ پڑھی، اس وقت تک فقہ کا مطالعہ کیا جب تک کہ مذہب کی سربراہی اس کے ہاتھ میں نہ آئی۔ ب 462، ڈی. ذی الحجہ 539، شیخ ابو اسحاق الشیرازی کے مرقد میں مدفون۔ 601-602}۔"
  tr: "Ebu Mansur bin Razzaz Saeed bin Muhammed el-Bağdadi, Şafii şeyhi ve Nizamiyye'nin öğretmeni; el-Gazali, As'ad al-Mihani, al-Kiya al-Harasi, Abu Bekir al-Shashi ve Abu Sa'd al-Mutawali'den fıkıh aldı. Rizq Allah el-Temimi'den rivayet etti, başarılı oldu ve okulun başı oldu. Yüksek saygın, onurlu ve yüce bir insandı; 462 Hicri yılında doğdu, 539 Hicri yılında Zhu'dhicce'de öldü ve Şeyh Ebu İshaq el-Şirazi'nin mezarına defnedildi {atıf: şadharat-zehab, s. 601-602}."
  id: "Abu Mansur ibn al-Razzaz Saeed ibn Muhammad al-Baghdadi, sheikh Shafi'i dan guru Nizamiyyah; ia mempelajari hukum di bawah bimbingan al-Ghazali, As'ad al-Mihani, al-Kiya al-Harasi, Abu Bakr al-Shashi, dan Abu Sa'd al-Mutawali. Ia menceritakan dari Rizq Allah al-Tamimi, unggul, dan menjadi kepala sekolah. Ia sangat dihormati, bermartabat, dan mulia; lahir pada tahun 462 H, meninggal di Dhu al-Hijjah pada tahun 539 H, dan dimakamkan di makam Sheikh Abu Ishaq al-Shirazi {cite:shadharat-dhahab, hlm. 601-602}."
