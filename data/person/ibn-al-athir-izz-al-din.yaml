summary:
  ar: "المؤرخ والمحدث عز الدين أبو الحسن علي بن محمد الجزري الشيباني؛ صاحب «الكامل في التاريخ» الجامع لأخبار الأمة من البدء إلى أيامه، و«أسد الغابة في معرفة الصحابة» و«اللباب في تهذيب الأنساب»، وعاش منقطعاً إلى العلم بالموصل. وفي شذرات الذهب كان إماماً نسابة مؤرخاً أخبارياً أديباً نبيلاً محتشماً وصنف التاريخ المشهور بالكامل على الحوادث والسنين في عشر مجلدات وهو من خيار التواريخ ابتدأ فيه من أول الزمان إلى سنة تسع وعشرين وست مئة واختصر الأنساب لأبي سعد السمعاني وهذبه وأفاد فيه أشياء وهو في مقدار نصف أصله وأقل وصنف كتاباً حافلاً في معرفة الصحابة جمع فيه بين كتاب ابن مندة وكتاب أبي نعيم وكتاب ابن عبد البر وكتاب أبي موسى وزاد وأفاد وسماه أسد الغابة في معرفة الصحابة وشرع في تاريخ الموصل قال ابن خلكان كان بيته بالموصل مجمع الفضلاء اجتمعت به بحلب فوجدته مكمل الفضائل والتواضع وكرم الأخلاق فترددت إليه وتوفي في الخامس والعشرين من شعبان عن خمس وسبعين سنة {cite:shadharat-dhahab p. 137-138}."
  en: "The historian and hadith scholar Izz al-Din Abu al-Hasan Ali ibn Muhammad al-Jazari al-Shaybani; author of 'al-Kamil fi al-Tarikh', the annalistic chronicle from the creation to his own day, 'Asad al-Ghaba fi Ma'rifat al-Sahaba' and 'al-Lubab fi Tahdhib al-Ansab', living retired for scholarship at Mosul."
  es: "El historiador y erudito en hadices Izz al-Din Abu al-Hasan Ali ibn Muhammad al-Jazari al-Shaybani; autor de 'al-Kamil fi al-Tarikh', la crónica analística desde la creación hasta sus días, 'Asad al-Ghaba fi Ma'rifat al-Sahaba' y 'al-Lubab fi Tahdhib al-Ansab', vive retirado por motivos académicos en Mosul."
  fr: "L'historien et spécialiste des hadiths Izz al-Din Abu al-Hasan Ali ibn Muhammad al-Jazari al-Shaybani; auteur de « al-Kamil fi al-Tarikh », la chronique annalistique de la création jusqu'à ses jours, « Asad al-Ghaba fi Ma'rifat al-Sahaba » et « al-Lubab fi Tahdhib al-Ansab », vivant à la retraite pour une bourse d'études à Mossoul."
  ur: "مؤرخ اور عالم حدیث عزالدین ابو الحسن علی ابن محمد الجزاری الشیبانی؛ 'الکامل فی التاریخ' کے مصنف، تخلیق سے لے کر اپنے زمانے تک کی تجزیاتی تاریخ، 'اسد الغابہ فی معرفۃ الصحابہ' اور 'اللباب فی تحذیب الانساب'، موصل میں اسکالرشپ کے لیے ریٹائر ہوئے۔"
  tr: "Tarihçi ve hadis alimi İzzeddin Ebu el-Hasan Ali ibn Muhammed el-Cezeri el-Şeybani; 'El-Kamil el-Tarikh' adlı ulusun haberlerini kuruluşundan kendi zamanına kadar kapsamlı bir derlemenin ve 'Esad el-Kabah fi Ma'rifat el-Sahabe' ile 'El-Lubab fi Tahdhib el-Enseb'in yazarıdır. Musul'da bilgiden kopuk yaşadı. Şadharat al-Dhahab'da imam, soybilimci, tarihçi, haber tarihçisi, soylu ve mütevazı bir yazardı. Olayların ve yılların tam ünlü tarihini on ciltte derledi. Tarih, zamanın başlangıcından altı yüz yirmi dokuzuncu yıla kadar en iyi tarihler arasındadır. Ebu Saad el-Sam'ani'nin soy ağaçlarını kısaltıp geliştirdi, detaylandırdı ve orijinalin yaklaşık yarısı kadar olan bazı bilgiler sağladı. Ayrıca, İbn Manda'nın kitaplarını, Ebu Nu'eym'in kitabını, İbn Abdülbarr'ın kitabını ve Ebu Musa'nın kitabını birleştiren Sahabelerin bilgisi üzerine zengin bir kitap yazdı ve ekleyip faydalandı. Ona 'Asad al-Ghabah fi Ma'rifat al-Sahabah' dedi ve Musul tarihine başladı. İbn Hallikan şöyle dedi: Musul'daki evi erdemlilerin toplanma yeriydi. Halep'te onunla buluştum ve erdem, alçakgönüllülük ve asil karakterde mükemmel buldum. Onu ziyaret ettim ve Şaban ayının yirmi beşinde, yetmiş beş yaşında vefat etti {atı: shadharat-dhahab, s. 137-138}."
  id: "Sejarawan dan ulama hadis Izz al-Din Abu al-Hasan Ali ibn Muhammad al-Jazari al-Shaybani; penulis 'Al-Kamil fi al-Tarikh,' kumpulan lengkap berita bangsa dari awal hingga zamannya, serta 'Asad al-Ghabah fi Ma'rifat al-Sahabah' dan 'Al-Lubab fi Tahdhib al-Ansab.' Ia hidup terpisah dari pengetahuan di Mosul. Dalam Shadharat al-Dhahab, ia adalah imam, ahli silsilah, sejarawan, sejarawan berita, bangsawan, dan penulis yang rendah hati. Ia menyusun sejarah peristiwa dan tahun yang sangat terkenal dalam sepuluh jilid. Ini termasuk sejarah terbaik, dimulai dari awal zaman hingga tahun enam ratus dua puluh sembilan. Ia merangkum dan menyempurnakan silsilah Abu Saad al-Sam'ani, menyempurnakannya, dan memberikan beberapa informasi, yang sekitar setengah dari aslinya dan lebih sedikit. Ia juga menulis buku kaya tentang pengetahuan para sahabat, menggabungkan kitab-kitab Ibn Manda, kitab Abu Nu'aym, kitab Ibn Abd al-Barr, dan kitab Abu Musa, dan ia menambah serta mendapat manfaat. Ia menyebutnya 'Asad al-Ghabah fi Ma'rifat al-Sahabah' dan memulai sejarah Mosul. Ibn Khallikan berkata: Rumahnya di Mosul adalah tempat berkumpul bagi orang-orang berbudi luhur. Saya berkumpul bersamanya di Aleppo dan mendapati ia sempurna dalam kebajikan, kerendahan hati, dan karakter mulia. Saya mengunjunginya, dan ia meninggal pada tanggal dua puluh lima Sha'ban pada usia tujuh puluh lima {cite:shadharat-dhahab, hlm. 137-138}."
