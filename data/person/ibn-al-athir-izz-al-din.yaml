summary:
  ar: "المؤرخ والمحدث عز الدين أبو الحسن علي بن محمد الجزري الشيباني؛ صاحب «الكامل في التاريخ» الجامع لأخبار الأمة من البدء إلى أيامه، و«أسد الغابة في معرفة الصحابة» و«اللباب في تهذيب الأنساب»، وعاش منقطعاً إلى العلم بالموصل. وفي شذرات الذهب كان إماماً نسابة مؤرخاً أخبارياً أديباً نبيلاً محتشماً وصنف التاريخ المشهور بالكامل على الحوادث والسنين في عشر مجلدات وهو من خيار التواريخ ابتدأ فيه من أول الزمان إلى سنة تسع وعشرين وست مئة واختصر الأنساب لأبي سعد السمعاني وهذبه وأفاد فيه أشياء وهو في مقدار نصف أصله وأقل وصنف كتاباً حافلاً في معرفة الصحابة جمع فيه بين كتاب ابن مندة وكتاب أبي نعيم وكتاب ابن عبد البر وكتاب أبي موسى وزاد وأفاد وسماه أسد الغابة في معرفة الصحابة وشرع في تاريخ الموصل قال ابن خلكان كان بيته بالموصل مجمع الفضلاء اجتمعت به بحلب فوجدته مكمل الفضائل والتواضع وكرم الأخلاق فترددت إليه وتوفي في الخامس والعشرين من شعبان عن خمس وسبعين سنة {cite:shadharat-dhahab p. 137-138}."
  en: "The historian and hadith scholar Izz al-Din Abu al-Hasan Ali ibn Muhammad al-Jazari al-Shaybani; author of 'al-Kamil fi al-Tarikh', the annalistic chronicle from the creation to his own day, 'Asad al-Ghaba fi Ma'rifat al-Sahaba' and 'al-Lubab fi Tahdhib al-Ansab', living retired for scholarship at Mosul."
