summary:
  ar: "حافظ بعلبك الكبير؛ لبس الخرقة من الشيخ عبد الله البطائحي عن الشيخ عبد القادر ورباه الشيخ عبد الله اليونيني وتفقه على الشيخ الموفق، وكان يكرر على الجمع بين الصحيحين وعلى أكثر مسند أحمد ونال من الحرمة والتقدم ما لم ينله أحد وكانت الملوك تقبل يده وتقدم مداسه؛ قال ولده موسى قطب الدين صاحب التاريخ حفظ والدي الجمع بين الصحيحين وأكثر مسند الإمام أحمد وحفظ صحيح مسلم في أربعة أشهر وحفظ سورة الأنعام في يوم واحد وحفظ ثلث مقامات الحريري في بعض يوم، وكان يحفظ في الجلسة الواحدة ما يزيد على سبعين حديثاً؛ وقال عمر بن الحاجب الحافظ لم ير زمانه مثل نفسه في كماله وبراعته جمع بين الشريعة والحقيقة؛ وكان لا يرى إظهار الكرامات ويقول كما أوجب الله على الأنبياء إظهار المعجزات أوجب على الأولياء إخفاء الكرامات؛ وتزوج ابنة الشيخ عبد الله اليونيني وهي أول زوجاته {cite:shadharat-dhahab p. 302}."
  en: "The great Hanbali hafiz of Baalbek (b. 572, d. night of 19 Ramadan 657) — raised by Abdallah 'Lion of Syria', whose daughter he wed; kings kissed his hand; per his son the historian Qutb al-Din Musa he held the Jam' bayn al-Sahihayn and most of Ahmad's Musnad, Sahih Muslim in four months, a sura in a day — seventy-plus hadith from a single sitting; 'as God bound the prophets to show miracles, He bound the saints to hide karamat' {cite:shadharat-dhahab p. 302}."
  es: "El gran hafiz hanbalí de Baalbek (n. 572, m. la noche del 19 de Ramadán de 657), criado por Abdallah, el \"León de Siria\", con cuya hija se casó; los reyes le besaban la mano; según su hijo, el historiador Qutb al-Din Musa, poseía el Jam' bayn al-Sahihayn y la mayor parte del Musnad de Ahmad, Sahih Muslim en cuatro meses, una sura en un día, más de setenta hadices de una sola sesión; \"así como Dios obligó a los profetas a mostrar milagros, obligó a los santos a ocultar karamat\" {cita: shadharat-dhahab p. 302}."
  fr: "Le grand hafiz hanbalite de Baalbek (né en 572, mort la nuit du 19 Ramadan 657) – élevé par Abdallah « Lion de Syrie », dont il épousa la fille; les rois lui baisaient la main; selon son fils, l'historien Qutb al-Din Musa, il maîtrisait le Jam'bayn al-Sahihayn et la majeure partie du Musnad d'Ahmad, le Sahih Muslim, en quatre mois, une sourate par jour – plus de soixante-dix hadiths en une seule séance; « comme Dieu a enjoint aux prophètes de montrer des miracles, Il a enjoint aux saints de cacher leurs karamat » {cite: shadharat-dhahab p. 302}."
  ur: "بعلبیک کے عظیم حنبلی حافظ ⁦(پیدائش 572، وفات 19 رمضان 657 کی رات)⁩ - عبداللہ 'شام کے شیر' کی پرورش، جس کی بیٹی سے اس نے شادی کی۔ بادشاہوں نے اس کا ہاتھ چوما۔ اپنے بیٹے مؤرخ قطب الدین موسی کے مطابق اس نے جام بین الصحیحین اور احمد کی زیادہ تر مسند، صحیح مسلم کو چار مہینوں میں، ایک دن میں ایک سورہ - ایک ہی نشست سے ستر سے زائد حدیثیں؛ ''جس طرح خدا نے پیغمبروں کو معجزات دکھانے کا پابند کیا اسی طرح اس نے اولیاء کو کرامت چھپانے کا پابند کیا''۔ 302}۔"
  tr: "Baalbek'in büyük Hafızı; Şeyh Abdullah Al-Bata'ihi'nin Şeyh Abdul Kadir'den aldığı pelerini giymiş, Şeyh Abdullah Al-Younini tarafından büyütülmüş ve Şeyh Muwaffaq'ın yanında fıkıh okudu. İki Sahih'i ve Ahmed'in Musnad'ının çoğunu defalarca birleştirerek kimsenin sahip olmadığı bir kutsallık ve ilerleme elde etti. Krallar elini öper ve adımlarını ilerletti; tarih yazarı oğlu Musa Qutb al-Din şöyle dedi: Babam iki Sahih'in birleşimini ve İmam Ahmed'in Musnadi'nin çoğunu ezberledi, Sahih Müslüman'ı dört ayda ezberledi ve An'Suresi'ni bir günde ezberledi. Birkaç gün içinde el-Hariri'nin makametinin üçte birini ezberledi ve tek bir oturumda yetmişten fazla hadisi ezberledi. Ezberci Ömer bin el-Hacib, zamanında kendisi gibi birinin şeriat ve gerçeği birleştiren mükemmelliği ve becerisi içinde hiç görmediğini söyledi. Mucizelerin ortaya çıktığını görmedi ve şöyle dedi: Tanrı'nın peygamberlere mucizeleri vazgeçirmelerini emrettiği gibi, Azizlerin mucizeleri gizlemesini de zorunlu kılındı. İlk eşi olan Şeyh Abdullah el-Younini'nin kızıyla evlendi {cite:shadharat-dhahab, s. 302}."
  id: "Hafiz agung Baalbek; ia mengenakan jubah dari Sheikh Abdullah Al-Bata'ihi dari Sheikh Abdul Qadir, dan dibesarkan oleh Sheikh Abdullah Al-Younini, serta mempelajari hukum di bawah Sheikh Al-Muwaffaq. Ia berulang kali menggabungkan dua Shahih dan sebagian besar Musnad Ahmad, memperoleh kesucian dan kemajuan yang tidak dimiliki orang lain. Para raja akan mencium tangannya dan melangkah maju; putranya Musa Qutb al-Din, penulis sejarah, berkata: Ayahku menghafal gabungan dua Shahih dan sebagian besar Musnad Imam Ahmad, menghafal Sahih Muslim dalam empat bulan, dan menghafal Surah Al-An'am dalam satu hari. Ia menghafal sepertiga maqamat al-Hariri dalam beberapa hari, dan menghafal lebih dari tujuh puluh hadits dalam satu sesi. Umar ibn al-Hajib, sang penghafal, mengatakan bahwa pada masanya belum pernah melihat seseorang seperti dirinya dalam kesempurnaan dan keahliannya, menggabungkan Syariah dan kebenaran. Ia tidak melihat mukjizat terwujud dan berkata, seperti Tuhan mewajibkan para nabi untuk mewahyukan mukjizat, Ia mewajibkan para wali untuk menyembunyikan mukjizat. Ia menikahi putri Sheikh Abdullah al-Younini, yang merupakan istri pertamanya {cite:shadharat-dhahab, hlm. 302}."
