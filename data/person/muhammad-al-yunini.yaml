summary:
  ar: "حافظ بعلبك الكبير؛ لبس الخرقة من الشيخ عبد الله البطائحي عن الشيخ عبد القادر ورباه الشيخ عبد الله اليونيني وتفقه على الشيخ الموفق، وكان يكرر على الجمع بين الصحيحين وعلى أكثر مسند أحمد ونال من الحرمة والتقدم ما لم ينله أحد وكانت الملوك تقبل يده وتقدم مداسه؛ قال ولده موسى قطب الدين صاحب التاريخ حفظ والدي الجمع بين الصحيحين وأكثر مسند الإمام أحمد وحفظ صحيح مسلم في أربعة أشهر وحفظ سورة الأنعام في يوم واحد وحفظ ثلث مقامات الحريري في بعض يوم، وكان يحفظ في الجلسة الواحدة ما يزيد على سبعين حديثاً؛ وقال عمر بن الحاجب الحافظ لم ير زمانه مثل نفسه في كماله وبراعته جمع بين الشريعة والحقيقة؛ وكان لا يرى إظهار الكرامات ويقول كما أوجب الله على الأنبياء إظهار المعجزات أوجب على الأولياء إخفاء الكرامات؛ وتزوج ابنة الشيخ عبد الله اليونيني وهي أول زوجاته {cite:shadharat-dhahab p. 302}."
  en: "The great Hanbali hafiz of Baalbek (b. 572, d. night of 19 Ramadan 657) — raised by Abdallah 'Lion of Syria', whose daughter he wed; kings kissed his hand; per his son the historian Qutb al-Din Musa he held the Jam' bayn al-Sahihayn and most of Ahmad's Musnad, Sahih Muslim in four months, a sura in a day — seventy-plus hadith from a single sitting; 'as God bound the prophets to show miracles, He bound the saints to hide karamat' {cite:shadharat-dhahab p. 302}."
