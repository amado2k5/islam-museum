summary:
  ar: سيدة أعمال سعودية، وُلدت سنة 1955؛ مديرة تنفيذية سابقة لشركة العليان للتمويل وأول امرأة ترأس بنكًا سعوديًا مدرجًا ⁦(بنك أول)⁩، ومن رائدات دخول المرأة مجالس الشركات السعودية.
  en: Saudi businesswoman, born 1955; former CEO of Olayan Financing Company and the first woman to chair a publicly listed Saudi bank (Saudi British Bank / Bank Alawwal), a pioneer of women on Saudi corporate
    boards.
  ur: سعودی کاروباری خاتون، پیدائش 1955؛ العلیان فنانسنگ کمپنی کی سابقہ سی ای او اور سعودی عرب کے کسی مندرج بینک ⁦(سعودی برٹش بینک/بنک اول)⁩ کی صدارت کرنے والی پہلی خاتون، سعودی کارپوریٹ بورڈوں میں خواتین
    کی پیش رفت۔
  es: "Empresaria saudí, nacida en 1955; exdirectora ejecutiva de Olayan Financing Company y la primera mujer en presidir un banco saudí que cotiza en bolsa (Saudi British Bank / Bank Alawwal), pionera de la presencia de mujeres en los consejos de administración de las empresas saudíes."
  fr: "Femme d'affaires saoudienne, née en 1955; ancienne PDG d'Olayan Financing Company et première femme à présider une banque saoudienne cotée en bourse (Saudi British Bank / Bank Alawwal), pionnière de la présence des femmes dans les conseils d'administration des entreprises saoudiennes."
  tr: "1955 doğumlu Suudi iş kadını; Al-Olayan Finans Şirketi'nin eski CEO'su ve halka açık bir Suudi bankası (Awwal Bank) yöneten ilk kadın. Ayrıca kadınların Suudi kurumsal yönetim kurullarına girmesinde öncüydü."
  id: "Seorang pengusaha wanita Saudi, lahir tahun 1955; mantan CEO Al-Olayan Finance Company dan wanita pertama yang memimpin bank Saudi yang terdaftar (Awwal Bank). Dia juga pelopor wanita yang masuk ke dewan korporasi Saudi."
