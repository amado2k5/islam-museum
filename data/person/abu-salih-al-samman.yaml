summary:
  ar: "ذكوان بن عبد الله، أبو صالح السمان، مولى أم المؤمنين جويرية الغطفانية، كان من كبار علماء المدينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} سمع من سعد بن أبي وقاص وعائشة وأبي هريرة وابن عباس وعبد الله بن عمر وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} وحدّث عنه ابنه سهيل والأعمش وسُمَيّ وزيد بن أسلم وعبد الله بن دينار والزهري وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} وقال عنه أحمد بن حنبل: ثقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950}"
  en: "Dhakwan ibn Abd Allah, Abu Salih al-Samman, freedman of the Mother of the Believers Juwayriya al-Ghatafaniyya, one of the leading scholars of Medina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} He heard from Sa'd ibn Abi Waqqas, Aisha, Abu Hurayra, Ibn Abbas and Abd Allah ibn Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} Among those who narrated from him were his son Suhayl, al-A'mash, Sumayy, Zayd ibn Aslam, Abd Allah ibn Dinar and al-Zuhri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} Ahmad ibn Hanbal described him as trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950}"
