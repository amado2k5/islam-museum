summary:
  en: "A refined young Qurayshi of wealth who embraced Islam early and was sent to Medina before the Hijra as the community's first emissary and teacher; killed bearing the standard at Uhud."
  ar: "شاب قرشي مرفه أسلم مبكرًا فبعثه النبي إلى المدينة قبل الهجرة أول داعية ومعلم؛ قُتل حاملًا الراية يوم أُحد. وفي وفاء الوفا: أُرسل مع أصحاب العقبة الأولى ليفقههم في الدين ويقرئهم القرآن فسُمي «المقرئ» وهو أول من سمي به، ونزل على أسعد بن زرارة في بني غنم بن مالك بن النجار، فلما اشتدت بنو النجار على أسعد انتقل إلى سعد بن معاذ فلم يزل يدعو حتى أسلم في كل دار من دور الأنصار ناس {cite:samhudi-wafa-al-wafa p. 236-238}. ويعدّه البخاري في باب من قتل من المسلمين يوم أحد فيمنهم حمزة واليمان وأنس بن النضر {cite:sahih-al-bukhari 4078}."
