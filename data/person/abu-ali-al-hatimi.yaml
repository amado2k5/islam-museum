summary:
  ar: "اللغوي الكاتب أحد الأعلام المشاهير المكثرين، أخذ الأدب عن أبي عمر الزاهد غلام ثعلب وأملى أخباره في مجالس الأدب وأخذ عنه جماعة من النبلاء منهم القاضي التنوخي، وله الرسالة الحاتمية التي شرح فيها ما جرى بينه وبين أبي الطيب المتنبي من إظهار سرقاته وإبانة عيوب شعره ولقد دلت على غزارة مادته وتوافر اطلاعه، وذكر أنه اعتل فتأخر عن مجلس شيخه أبي عمر الزاهد فسأل عنه فقيل إنه مريض فجاء يعوده فوجده قد خرج إلى الحمام فكتب على بابه بالأسفيداج وأعجب شيء سمعنا به عليل يزار فلا يوجد، توفي سنة تسعين وثلاث مئة {cite:shadharat-dhahab p. 137}."
  en: "The Baghdadi philologist-secretary al-Hatimi, pupil of Abu 'Umar al-Zahid and teacher of al-Tanukhi; his Risala Hatimiyya exposes al-Mutanabbi's plagiarisms, and when his shaykh visited him sick and found him gone to the bathhouse he chalked on his door 'strangest of things — an invalid visited who cannot be found' {cite:shadharat-dhahab p. 137}."
  fr: "Le philologue et secrétaire bagdadien al-Hatimi, élève d'Abu 'Umar al-Zahid et maître d'al-Tanukhi ; sa Risala Hatimiyya expose les plagiats d'al-Mutanabbi, et lorsque son shaykh vint le visiter malade et le trouva parti au bain, il écrivit à la craie sur sa porte « la plus étrange des choses — un malade qu'on visite et qu'on ne trouve pas » {cite:shadharat-dhahab p. 137}."
  es: "El filólogo y secretario de Bagdad, al-Hatimi, discípulo de Abu 'Umar al-Zahid y maestro de al-Tanukhi; su Risala Hatimiyya expone los plagios de al-Mutanabbi, y cuando su shaykh lo visitó enfermo y lo encontró en los baños, escribió con tiza en su puerta: \"la cosa más extraña: un inválido que nos visita y al que no podemos encontrar\" {cita: shadharat-dhahab p. 137}."
  ur: "بغدادی ماہر فلکیات سکریٹری الحاتمی، ابو عمر الزاہد کے شاگرد اور التنخی کے استاد؛ اس کا رسالہ حاتمیہ المتنبی کے سرقہ کا پردہ فاش کرتا ہے، اور جب اس کے شیخ نے اس کی عیادت کی اور اسے حمام میں جاتے ہوئے پایا تو اس نے اس کے دروازے پر 'عجیب ترین چیز' چاک کی - ایک غلط دورہ جس کا پتہ نہیں چل سکا'۔ 137}۔"
  tr: "Dilbilimci ve yazar, ünlü ve üretken şahsiyetlerden biriydi. Tha'lab'ın hizmetkarı Ebu Ömer el-Zahid'den edebiyat öğrendi ve hikâyelerini edebi toplantılarda dikte ettirdi. Aralarında Kadı el-Tanukhi'nin de bulunduğu bir grup soylu ondan ders aldı. Ebu el-Tayyib el-Mutanabbi ile arasında, intihallerini ortaya çıkarmak ve şiirlerindeki kusurları ifşa etmek konusunda yaşananları anlattığı Hatimiye Mektubu'na sahiptir. Bu, materyalinin zenginliğini ve bilgisinin genişliğini gösterir. Hastalandığını ve şeyhi Ebu Ömer el-Zahid'in toplantısına geç kaldığını anlatır. Şeyhi hakkında bilgi aldığında hasta olduğunu öğrenince onu ziyaret etmeye gider ve hamama gittiğini görür. Kapısına kurşun kalemle yazılar yazmıştır ve duyduğumuz en garip şey, hasta birinin ziyarete gelmesi ama bulunamamasıdır. Hicri 390 yılında vefat etmiştir. {Kaynak: Shadharat-dhahab s. 137}."
  id: "Ahli bahasa dan penulis ini adalah salah satu tokoh terkenal dan produktif. Ia belajar sastra dari Abu Omar al-Zahid, pelayan Tha'lab, dan mendiktekan cerita-ceritanya dalam pertemuan sastra. Sekelompok bangsawan belajar darinya, termasuk Hakim al-Tanukhi. Ia memiliki Surat Hatimiyah, di mana ia menjelaskan apa yang terjadi antara dirinya dan Abu al-Tayyib al-Mutanabbi mengenai pengungkapan plagiarisme dan penyingkapan kekurangan dalam puisinya. Hal itu menunjukkan banyaknya materi yang dimilikinya dan luasnya pengetahuannya. Ia menyebutkan bahwa ia jatuh sakit dan terlambat menghadiri pertemuan dengan syekhnya, Abu Omar al-Zahid. Ia menanyakan keadaannya dan diberitahu bahwa ia sakit, jadi ia datang mengunjunginya dan mendapati bahwa ia telah pergi ke pemandian umum. Ia menulis di pintunya dengan timah putih, dan hal teraneh yang pernah kita dengar adalah bahwa orang sakit dikunjungi tetapi tidak ditemukan. Ia meninggal pada tahun 390 H {cite:shadharat-dhahab p. 137}."
