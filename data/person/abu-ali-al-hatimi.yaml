summary:
  ar: "اللغوي الكاتب أحد الأعلام المشاهير المكثرين، أخذ الأدب عن أبي عمر الزاهد غلام ثعلب وأملى أخباره في مجالس الأدب وأخذ عنه جماعة من النبلاء منهم القاضي التنوخي، وله الرسالة الحاتمية التي شرح فيها ما جرى بينه وبين أبي الطيب المتنبي من إظهار سرقاته وإبانة عيوب شعره ولقد دلت على غزارة مادته وتوافر اطلاعه، وذكر أنه اعتل فتأخر عن مجلس شيخه أبي عمر الزاهد فسأل عنه فقيل إنه مريض فجاء يعوده فوجده قد خرج إلى الحمام فكتب على بابه بالأسفيداج وأعجب شيء سمعنا به عليل يزار فلا يوجد، توفي سنة تسعين وثلاث مئة {cite:shadharat-dhahab p. 137}."
  en: "The Baghdadi philologist-secretary al-Hatimi, pupil of Abu 'Umar al-Zahid and teacher of al-Tanukhi; his Risala Hatimiyya exposes al-Mutanabbi's plagiarisms, and when his shaykh visited him sick and found him gone to the bathhouse he chalked on his door 'strangest of things — an invalid visited who cannot be found' {cite:shadharat-dhahab p. 137}."
