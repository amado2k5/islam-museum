summary:
  ar: "الملك الظافر المشهور بالمشمر، مظفر الدين، ابن السلطان صلاح الدين يوسف بن أيوب وشقيق الملك الأفضل؛ وإنما قيل له المشمر لأن أباه لما قسم البلاد بين أولاده الكبار قال: وأنا مشمر، فغلب عليه هذا اللقب {cite:wafayat-ayan}."
  en: "al-Malik al-Zafir, known as al-Mushammar, Muzaffar al-Din, son of Sultan Salah al-Din Yusuf ibn Ayyub and brother of al-Malik al-Afdal. He was called al-Mushammar because when his father divided the lands among his elder sons, he said, 'I too am girded (mushammir),' and the title stuck to him {cite:wafayat-ayan}."
  es: "al-Malik al-Zafir, conocido como al-Mushammar, Muzaffar al-Din, hijo del sultán Salah al-Din Yusuf ibn Ayyub y hermano de al-Malik al-Afdal. Se le llamó al-Mushammar porque cuando su padre dividió las tierras entre sus hijos mayores, dijo: «Yo también estoy ceñido (mushammir)», y el título se le quedó {cite:wafayat-ayan}."
  fr: "al-Malik al-Zafir, dit al-Mushammar, Muzaffar al-Din, fils du sultan Salah al-Din Yusuf ibn Ayyub et frère d'al-Malik al-Afdal. Il fut surnommé al-Mushammar car, lors du partage des terres entre ses fils aînés par son père, il déclara: « Moi aussi, je suis ceint (mushammir) », et ce titre lui resta."
  ur: "المالک الظفیر، المشامر کے نام سے جانا جاتا ہے، مظفرالدین، سلطان صلاح الدین یوسف ابن ایوب کا بیٹا اور المالک الافدل کا بھائی۔ انہیں المشامر اس لیے کہا جاتا تھا کہ جب ان کے والد نے زمینیں اپنے بڑے بیٹوں میں تقسیم کیں تو انہوں نے کہا کہ میں بھی کمر بستہ ہوں، اور یہ لقب ان پر چپکا ہوا تھا۔"
