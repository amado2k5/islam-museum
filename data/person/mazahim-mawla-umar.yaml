summary:
  ar: "خادم عمر بن عبد العزيز ومولاه، وذكر الكتاب أنه حين حبس عمر رجلاً بالمدينة وأطال حبسه، كلّمه مزاحم في إطلاقه ووعظه بيوم القيامة، فكان أول من أيقظه لهذا الشأن، ورافقه حين خرج من المدينة يبكي {cite:salabi-umayyad-state-2020 p.175-177}. ويذكر الكتاب أن عمر أمر مزاحماً بردّ المال الذي كان يأتيه من البحرين كل عام إلى بيت المال، وأنه كان يقرأ عليه سجلات المظالم المردودة. {cite:salabi-umayyad-state-2020 p.194-195}"
  tr: "Ömer bin Abdülaziz'in hizmetkarı ve özgür bırakılmıştır. Mektupta, Ömer Medine'de bir adamı hapsettiğinde ve tutukluluğunu uzattığında, Muzahim'in ona serbest bırakılması hakkında konuştuğu ve Kıyamet Günü'nde onu uyardığı belirtilir. Muzahim, onu bu konuya ilk uyandıran kişi oldu ve Medine'den ayrılırken ona eşlik ederek ağladı {cite:salabi-umayyad-state-2020, s.175-177}. Kitapta, Umar'ın Muzahimi'ye her yıl Bahreyn'den aldığı parayı kamu hazinesine geri vermesini ve geri dönen şikayetlerin kayıtlarını okuyacağını belirtir. {cite:salabi-umayyad-state-2020 s.194-195}"
  id: "Umar ibn Abd al-Aziz, pelayan dan mantan izin. Surat tersebut menyebutkan bahwa ketika Umar memenjarakan seorang pria di Madinah dan memperpanjang penahanannya, Muzahim berbicara kepadanya tentang pembebasannya dan menegurnya pada Hari Pengadilan. Muzahim adalah orang pertama yang menyadarkannya tentang hal ini dan menemaninya saat meninggalkan Madinah, menangis {cite:salabi-umayyad-state-2020, hlm.175-177}. Buku tersebut menyebutkan bahwa Umar memerintahkan Muzahimi untuk mengembalikan uang yang biasa ia terima dari Bahrain setiap tahun ke kas negara, dan bahwa ia akan membacakan catatan keluhan yang diterima kembali. {cite:salabi-umayyad-state-2020 hlm.194-195}"
