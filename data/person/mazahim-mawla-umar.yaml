summary:
  ar: "خادم عمر بن عبد العزيز ومولاه، وذكر الكتاب أنه حين حبس عمر رجلاً بالمدينة وأطال حبسه، كلّمه مزاحم في إطلاقه ووعظه بيوم القيامة، فكان أول من أيقظه لهذا الشأن، ورافقه حين خرج من المدينة يبكي {cite:salabi-umayyad-state-2020 p.175-177}. ويذكر الكتاب أن عمر أمر مزاحماً بردّ المال الذي كان يأتيه من البحرين كل عام إلى بيت المال، وأنه كان يقرأ عليه سجلات المظالم المردودة. {cite:salabi-umayyad-state-2020 p.194-195}"
