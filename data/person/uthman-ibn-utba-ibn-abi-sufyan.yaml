id: person/uthman-ibn-utba-ibn-abi-sufyan
class: person
label: { ar: "عثمان بن عتبة بن أبي سفيان", en: "'Uthman ibn 'Utba ibn Abi Sufyan", es: "'Uthman ibn 'Utba ibn Abi Sufyan", fr: "'Uthman ibn 'Utba ibn Abi Sufyan", ur: "عثمان بن عتبہ ابن ابی سفیان" }
summary:
  ar: "دعي إلى البيعة بعد قتل أخيه الوليد يوم صلاة معاوية بن يزيد فاشترط ألا يحارب ولا يباشر قتالاً فأبوا عليه فصار إلى مكة ودخل في جملة ابن الزبير، وزال الأمر عن آل حرب {cite:muruj-al-dhahab p. 70}."
  en: "Offered the bay'a at the funeral when his brother fell — he stipulated no war and no fighting; refused, he joined Ibn al-Zubayr at Mecca, and the Harb line's claim ended {cite:muruj-al-dhahab p. 70}."
  es: "Ofreció el bay'a en el funeral cuando su hermano cayó; estipuló que no habría guerra ni combates; se negó, se unió a Ibn al-Zubayr en La Meca, y la pretensión de la línea Harb terminó {cite:muruj-al-dhahab p. 70}."
  fr: "Il lui offrit la bay'a lors des funérailles de son frère tombé au combat — il stipula qu'il n'y aurait ni guerre ni combat; il refusa, rejoignit Ibn al-Zubayr à La Mecque, et la revendication de la ligne Harb prit fin {cite:muruj-al-dhahab p. 70}."
  ur: "جنازے پر بیعت کی جب اس کا بھائی گر گیا - اس نے نہ جنگ اور نہ لڑائی کی شرط رکھی۔ انکار کر دیا، وہ مکہ میں ابن الزبیر کے ساتھ شامل ہو گیا، اور حرب لائن کا دعویٰ ختم ہو گیا۔ 70}۔"
  tr: "Kardeşi el-Velid, Muaviye ibn Yezid'in namaz günü öldürüldükten sonra bağlılık yemini etmeye çağrıldı ve savaşmayacağını veya savaşmaya girmeyeceğini şart koştu, ancak onlar bunu reddetti, bu yüzden Mekke'ye giderek İbn el-Zubeyr saflarına katıldı. Konu savaş ailesinden çıkarıldı {atıf:muruj-al-dhahab, s. 70}."
  id: "Ia dipanggil untuk bersumpah setia setelah saudaranya al-Walid tewas pada hari shalat Muawiyah ibn Yazid, dan ia menetapkan bahwa ia tidak akan bertempur atau bertempur, tetapi mereka menolak, sehingga ia pergi ke Mekah dan bergabung dengan barisan Ibn al-Zubayr. Masalah ini dihapus dari keluarga perang {cite:muruj-al-dhahab, hlm. 70}."
