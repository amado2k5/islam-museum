summary:
  ar: "بطاقة أولية لمحمد بن تغلق، سلطان دلهي الثامن عشر وثاني سلاطين التغلقيين، عُرف بمشاريعه العجيبة كنقل العاصمة إلى ديوكير وإصدار نقد النحاس؛ توفي سنة ١٣٥١م ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Muhammad ibn Tughluq, the eighteenth sultan of Delhi and second of the Tughluq house, famed for his capricious projects like moving the capital to Daulatabad and the copper currency; he died in 1351 and his entry is not yet checked on the page."
  es: "Ficha de borrador para Muhammad ibn Tughluq, el decimoctavo sultán de Delhi y segundo de la casa Tughluq, famoso por sus proyectos caprichosos como el traslado de la capital a Daulatabad y la moneda de cobre; murió en 1351 y su entrada aún no ha sido verificada en la página."
  fr: "Fiche de candidature de Muhammad ibn Tughluq, dix-huitième sultan de Delhi et deuxième de la dynastie Tughluq, célèbre pour ses projets capricieux comme le transfert de la capitale à Daulatabad et la monnaie de cuivre; il mourut en 1351 et son entrée n'est pas encore vérifiée sur la page."
  ur: "دہلی کے اٹھارویں سلطان اور تغلق گھر کے دوسرے سلطان محمد ابن تغلق کے لیے ڈرافٹ کارڈ، جو دارالحکومت کو دولت آباد منتقل کرنے اور تانبے کی کرنسی جیسے دلچسپ منصوبوں کے لیے مشہور تھا۔ اس کا انتقال 1351 میں ہوا اور اس کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Başkenti Deuker'e taşımak ve bakır madeni paralar basmak gibi olağanüstü projeleriyle tanınan, Delhi'nin on sekizinci sultanı ve ikinci Tughlaq sultanı Muhammed bin Tughlaq'ın ilk kartı; 1351 yılında öldü ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Muhammad bin Tughlaq, Sultan Delhi kedelapan belas dan sultan Tughlaq kedua, yang dikenal atas proyek-proyek luar biasa seperti memindahkan ibu kota ke Deuker dan menerbitkan koin tembaga; ia meninggal pada tahun 1351 M, dan biografinya belum pernah diulas di halaman tersebut."
