summary:
  ar: "عالم وراثة ونبات هندي وإداري، يُعد المهندس الرئيسي للثورة الخضراء في الهند: قاد المعهد الهندي للبحوث الزراعية والمجلس الهندي للبحوث الزراعية، وأدار المعهد الدولي لبحوث الأرز (1982–1988)، ونال أول جائزة غذاء عالمية (1987)، وعضوية مجلس الشيوخ (2007–2013)، ومُنح بهارات راتنا سنة 2024 بعد وفاته."
  en: "Indian geneticist, plant breeder and administrator, regarded as the main architect of India's Green Revolution: he led the Indian Agricultural Research Institute and the Indian Council of Agricultural Research, directed the International Rice Research Institute (1982–1988), received the first World Food Prize (1987), sat in the Rajya Sabha (2007–2013), and was awarded the Bharat Ratna in 2024, after his death."
  ur: "ہندوستانی ماہرِ جینیات، نباتی پالنے والے اور منتظم، جنھیں بھارت کے گرین انقلاب کا مرکزی معمار سمجھا جاتا ہے: انھوں نے انڈین ایگریکلچرل ریسرچ انسٹی ٹیوٹ اور انڈین کونسل آف ایگریکلچرل ریسرچ کی قیادت کی، بین الاقوامی چاول ریسرچ انسٹی ٹیوٹ کے ڈائریکٹر رہے (1982ء–1988ء)، پہلا ورلڈ فوڈ پرائز پایا (1987ء)، راجیہ سبھا کے رکن رہے (2007ء–2013ء)، اور 2024ء میں، وفات کے بعد، بھارت رتن سے نوازے گئے۔"
