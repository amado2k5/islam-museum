class: person
label: { ar: "عروة بن أذينة التميمي", en: "'Urwa ibn Udhayna al-Tamimi", es: "'Urwa ibn Udhayna al-Tamimi", fr: "'Urwa ibn Udhayna al-Tamimi", ur: "عروہ ابن عدینہ التمیمی۔" }
summary:
  ar: "أخو بلال الخارجي، مر به الأشعث بالصحيفة يقرؤها على بني تميم فرحاً فقال عروة أتحكمون في دين الله وأمره ونهيه الرجال لا حكم إلا لله فكان أول من قالها وحكم بها، وشد بسيفه على الأشعث فوقعت الضربة في عجز فرسه ونجا {cite:muruj-al-dhahab p. 683-684}. وعند المسعودي قيل إنه أول من حكم بصفين، وقيل يزيد بن عاصم المحاربي، وقيل رجل من بني سعد بن زيد مناة {cite:muruj-al-dhahab p. 129}"
  en: "Bilal al-Khariji's brother — the first to cry 'no judgement but God's' when al-Ash'ath proudly read the arbitration sheet to the Tamimis, striking at him with a sword the horse's haunch took {cite:muruj-al-dhahab p. 683-684}."
  es: "El hermano de Bilal al-Khariji fue el primero en gritar \"no hay juicio sino el de Dios\" cuando al-Ash'ath leyó con orgullo la hoja de arbitraje a los Tamimis, golpeándolo con una espada que el cuarto trasero del caballo tomó {cite:muruj-al-dhahab p. 683-684}."
  fr: "Le frère de Bilal al-Khariji — le premier à crier « pas de jugement sauf celui de Dieu » lorsque al-Ash'ath lut fièrement la feuille d'arbitrage aux Tamimis, le frappant avec une épée que la hanche du cheval prit {cite:muruj-al-dhahab p. 683-684}."
  ur: "بلال الخارجی کے بھائی - 'فیصلہ نہیں لیکن خدا کا' رونے والا پہلا شخص جب اشعث نے تمیمیوں کے سامنے ثالثی کا پرچہ فخر سے پڑھا اور اس پر تلوار سے وار کرتے ہوئے گھوڑے کے ڈنڈے کو لے لیا {حوالہ: مروج الذہب صفحہ 683-684}۔"
  tr: "Bilal al-Khariji'nin kardeşi Al-Ash'ath, Banu Tamim'e sevinçle okuduğu parşömenle yanından geçti. Urwah şöyle dedi: 'Allah'ın dinine, emirlerine ve yasaklarına hükmediyor musun? İnsanların yargısı Allah'tan başka değildir.' Bunu ilk söyleyen ve ona göre yargılayan oydu, kılıcını Al-Ash'ath'a çekti, darbe atının zayıflığına isabet etti ve o hayatta kaldı. {cite:muruj-al-dhahab s. 683-684}. al-Mas'udi'ye göre, Siffin'de ilk hüküm süren kişi olduğu söylenir, Yazid ibn Asim al-Muharibi ve Banu Sa'd bin Zayd Manat'tan bir adam olduğu söylenir {cite:muruj-al-dhahab s. 129}"
  id: "Saudara Bilal al-Khariji, Al-Ash'ath melewatinya dengan gulungan yang dibacakannya kepada Banu Tamim dengan sukacita. Urwah berkata, 'Apakah engkau memerintah agama Allah, perintah-Nya, dan larangan-Nya? Manusia tidak memiliki penilaian kecuali kepada Allah.' Dia adalah yang pertama mengucapkannya dan diadili berdasarkan itu, dan dia menghunus pedangnya ke Al-Ash'ath, dan pukulan itu mengenai kelemahan kudanya dan dia selamat. {cite:muruj-al-dhahab hlm. 683-684}. Menurut al-Mas'udi dikatakan dia adalah yang pertama memerintah di Siffin, dan dikatakan Yazid ibn Asim al-Muharibi, dan dikatakan seorang pria dari Banu Sa'd ibn Zayd Manat {cite:muruj-al-dhahab hlm. 129}"
