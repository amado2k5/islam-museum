  ar: "أخو بلال الخارجي، مر به الأشعث بالصحيفة يقرؤها على بني تميم فرحاً فقال عروة أتحكمون في دين الله وأمره ونهيه الرجال لا حكم إلا لله فكان أول من قالها وحكم بها، وشد بسيفه على الأشعث فوقعت الضربة في عجز فرسه ونجا {cite:muruj-al-dhahab p. 683-684}. وعند المسعودي قيل إنه أول من حكم بصفين، وقيل يزيد بن عاصم المحاربي، وقيل رجل من بني سعد بن زيد مناة {cite:muruj-al-dhahab p. 129}"
