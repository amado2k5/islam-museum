faith:
  - value: sunni-maliki
    basis: documented
    note: "Two independent attestations name the Maliki school for the man himself. The Arabic biography states that he had a long reach and a firm footing in Islamic jurisprudence, 'especially Maliki fiqh and comparative fiqh', and that his juristic opinions are cited by the scholars of Morocco, Algeria and Tunisia. The English biography and the scholarship it rests on record that the reform plan he led demanded the unification of the legal system under Maliki law, that his own work in the law of worship claimed to uphold Maliki law (Bargach), and that the Mudawana personal-status code he helped codify was based on Maliki law (Salih). Preserved with it: al-Fassi was a leading figure of the Salafiyya reform current, a sharp critic of Maliki taqlid whose programme diverged from Maliki norms at points, and Benjamin Bruce (2018) describes him as having shown himself hostile to Morocco's Maliki school as an obstacle to reason; none of that places him in another school, and the Salafiyya is a current of thought, never recorded here as a value. His Ash'ari creed, attested by Henri Lauzière (2015), has no enum value and is recorded in this note only. Wikidata's religion value gives Islam in general."
    sources: [source/wikipedia-allal-al-fassi-ar, source/wikipedia-allal-al-fassi-en, source/wikidata-allal-al-fassi]
summary:
  ar: "عالم وفقيه وسياسي مغربي (1910–1974)، وُلد بفاس وتخرّج في جامعة القرويين، وكان من مؤسسي الحركة الوطنية المغربية: شارك في تأسيس كتلة العمل الوطني سنة 1934 وحزب الاستقلال، ونفته فرنسا إلى الغابون تسع سنوات (1937–1946)، ثم قاد حزب الاستقلال من 1960 حتى وفاته وتولى وزارة الشؤون الإسلامية (1961–1963). اشتهر في الفقه بباعه الطويل في الفقه المالكي والمقارن، ومن كتبه «النقد الذاتي» (1952) و«مقاصد الشريعة الإسلامية ومكارمها»، وشارك في تقنين مدونة الأحوال الشخصية على أساس الفقه المالكي."
  en: "Moroccan scholar, jurist and politician (1910–1974), born at Fez and formed at the Qarawiyyin. A founder of the Moroccan national movement, he helped create the Moroccan Action Committee in 1934 and the Istiqlal Party, was exiled by France to Gabon for nine years (1937–1946), led the Istiqlal from 1960 until his death and served as minister of Islamic affairs (1961–1963). As a jurist he was known for his mastery of Maliki and comparative fiqh; his books include Self-Criticism (1952) and The Purposes of the Islamic Sharia and its Noble Qualities, and he helped codify the Mudawana personal-status code on a Maliki basis."
  ur: "مغربی عالم، فقیہ اور سیاست دان (1910–1974)، فاس میں پیدا ہوئے اور جامعہ قرویین سے تعلیم پाई۔ مغربی قومی تحریک کے بانیوں میں سے تھے: 1934ء میں کتلہ عملِ وطنی اور پھر حزبِ استقلال کے قیام میں شریک ہوئے، فرانس نے انہیں نو سال (1937–1946ء) گیبون جلاوطن رکھا، 1960ء سے وفات تک حزبِ استقلال کی قیادت کی اور 1961–1963ء میں وزیرِ امورِ اسلامیہ رہے۔ فقہ میں وہ فقہ مالکی اور فقہ مقارن پر اپنی گرفت کے لیے مشہور تھے؛ ان کی کتابوں میں «النقد الذاتی» (1952ء) اور «مقاصد الشریعۃ الاسلامیۃ و مکارمہا» شامل ہیں، اور مدونہ احوالِ شخصیہ کی مالکی بنیادوں پر تدوین میں شریک رہے۔"
