summary:
  ar: "خليفة موحدي ولي في ربيع الآخر قبل دخول الواثق أبي دبوس مراكش سنة خمس وستين وست مئة، فهرب إلى آزمور فقبض عليه عاملها وأمره الواثق بقتله فقتل في العشر الأخير من ربيع الآخر من تلك السنة بموضع يقال له كتامة على ثلاثة أيام من مراكش {cite:wafayat-ayan p. 15-16}."
  en: "The Almohad caliph al-Murtada, who fled Marrakesh for Azemmour when Abu Dabus entered in 665, was seized by his own governor and killed at Kutama in the last ten days of Rabi' II {cite:wafayat-ayan p. 15-16}."
  fr: "Le calife almohade al-Murtada, qui a fui Marrakech pour Azemmour quand Abu Dabus est entré en 665, a été saisi par son propre gouverneur et tué à Kutama dans les dix derniers jours de Rabi' II {cite:wafayat-ayan p. 15-16}."
  es: "El califa almohade al-Murtada, que huyó de Marrakech a Azemburgo cuando Abu Dabus entró en 665, fue apresado por su propio gobernador y asesinado en Kutama en los últimos diez días de Rabi' II {cite:wafayat-ayan p. 15-16}."
  ur: "الموحد خلیفہ المرتضیٰ، جو 665 میں ابو دابس کے داخل ہونے پر مراکش سے عزیمور کے لیے فرار ہو گیا تھا، کو اس کے اپنے گورنر نے پکڑ لیا اور ربیع الثانی کے آخری دس دنوں میں کوٹامہ میں قتل کر دیا۔ 15-16}۔"
  tr: "665 Hicri yılında el-Vetik Ebu Dabbous Marakeş'e girmeden önce Rabi' al-Thani'de bir Müslüfler halifesiydi. Azemmour'a kaçtı, burada valisi onu tutukladı ve el-Vathiq onun idamını emretti. O yılın Rabi' al-Thani'nin son on gecesinde, Kutama adlı bir yerde, Marakeş'ten üç gün sonra öldürüldü {atıf:wafayat-ayan s. 15-16}."
  id: "Ia adalah khalifah Mowhid di Rabi' al-Thani sebelum al-Wathiq Abu Dabbous memasuki Marrakesh pada tahun 665 H. Ia melarikan diri ke Azemmour, di mana gubernurnya menangkapnya, dan al-Wathiq memerintahkan eksekusinya. Ia dibunuh dalam sepuluh malam terakhir Rabi' al-Thani tahun itu di sebuah tempat bernama Kutama, tiga hari setelah Marrakech {cite:wafayat-ayan hlm. 15-16}."
