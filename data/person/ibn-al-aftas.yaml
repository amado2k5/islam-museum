id: person/ibn-al-aftas
class: person
label: { ar: "ابن الأفطس صاحب بطليوس" }
summary:
  ar: "أبو محمد عبد الله بن مسلمة التجيبي المعروف بابن الأفطس؛ ملك بطليوس من غرب الأندلس عند الفتنة واهتياجها واستبد بها سنة 461هـ فهلك وولي من بعده ابنه المظفر أبو بكر واستفحل ملكه وكان من أعاظم ملوك الطوائف، وبينه وبين ابن ذي النون حروب مذكورة وكذا مع ابن عباد بسبب ابن يحيى صاحب مليلة {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  en: "Abu Muhammad Abdallah b. Maslama al-Tajibi, Ibn al-Aftas, who seized Badajoz in the fitna of 461; his son al-Muzaffar Abu Bakr was among the greatest taifa kings until Yusuf b. Tashfin killed the last of them in 489 {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  es: "Abu Muhammad Abdallah b. Maslama al-Tajibi, Ibn al-Aftas, quien se apoderó de Badajoz en la fitna de 461; su hijo al-Muzaffar Abu Bakr estuvo entre los más grandes reyes taifa hasta que Yusuf b. Tashfin mató al último de ellos en 489 {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  fr: "Abu Muhammad Abdallah b. Maslama al-Tajibi, Ibn al-Aftas, qui s'empara de Badajoz lors de la fitna de 461; son fils al-Muzaffar Abu Bakr fut parmi les plus grands rois taïfa jusqu'à ce que Yusuf b. Tashfin tue le dernier d'entre eux en 489 {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  ur: "ابو محمد عبداللہ بی۔ مسلمہ التاجیبی، ابن الافطاس، جس نے 461 کے فتنے میں بادجوز پر قبضہ کیا؛ اس کا بیٹا المظفر ابوبکر یوسف بن تک طائفہ کے عظیم ترین بادشاہوں میں سے تھا۔ تاشفین نے ان میں سے آخری کو 489 میں قتل کر دیا۔ 1001}۔"
  tr: "Ebu Muhammed Abdullah ibn Maslama el-Tucibi, İbn el-Aftaş olarak bilinir, kargaşa ve kargaşa sırasında batı el-Endülüs'ten Badaj kralıydı ve 461 Hicri'nde hüküm sürdü. Öldü ve yerine oğlu el-Muzaffar Ebu Bekir geçti, hükümdarlığı uzadı. O, en büyük Taifa krallarından biriydi ve Malila hükümdarı İbn Yahya nedeniyle İbn Abbad ile İbn Abbad arasında savaşlar yaşandığı belirtilmiştir {alıntı:Tarikh-ibn-khaldun-ibar s. 1001}."
  id: "Abu Muhammad Abdullah ibn Maslama al-Tujibi, yang dikenal sebagai Ibn al-Aftas, adalah raja Badaj dari barat al-Andalus selama kekacauan dan kekacauan, dan ia memerintah pada tahun 461 H. Ia meninggal dan digantikan oleh putranya al-Muzaffar Abu Bakr, dan pemerintahannya berkembang. Ia adalah salah satu raja Taifa terbesar, dan ada perang yang disebutkan antara dirinya dan Ibn Dhi al-Nun, serta dengan Ibn 'Abbad karena Ibn Yahya, penguasa Malila {cite:Tarikh-ibn-khaldun-ibar hlm. 1001}."
