summary:
  ar: "صحابي خزرجي يعرف بابن فسحم؛ ذكره ابن إسحاق في البدريين وقال ابن حبان إنه استشهد ببدر فألقى تمرات كانت في يده وقاتل حتى قتل، وقيل إن النبي آخى بينه وبين ذي الشمالين."
  en: "A Khazraji Companion known as Ibn Fasham; Ibn Ishaq names him among the Badriyya, and Ibn Hibban says he was martyred there — he threw away the dates in his hand and fought until killed. The Prophet is said to have paired him with Dhu al-Shamalayn."
  ur: "خزرجی صحابی، ابن فشم کہلاتا؛ ابن اسحاق اسے بدریوں میں گنتا ہے اور ابن حبان کہتا ہے وہ وہیں شہید ہوا۔"
