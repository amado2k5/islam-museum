class: person
label: { ar: "أمية بن عبد الله بن خالد بن أسيد", en: "Umayya ibn Abdallah ibn Khalid ibn Asid", es: "Umayya ibn Abdallah ibn Khalid ibn Asid", fr: "Umayya ibn Abdallah ibn Khalid ibn Asid", ur: "امیہ بن عبداللہ بن خالد بن اسید" }
summary:
  ar: "أمية بن عبد الله بن خالد بن أسيد بن أبي العاص؛ استعمله عبد الملك بن مروان على خراسان فوجه ابنه عبد الله بن أمية على سجستان وعقد له عليها وهو بكرمان ثم ولاه عبد الملك خراسان بعد قتل ابن خازم إذ كتب وجوهها أنها لا تصلح إلا برجل من قريش فولى بكير بن وشاح طخارستان فخالفه وحبس ابنه فقاتله ثم صالحه فأمر بحبسه فقتله بجير بن ورقاء وافتتح الختل بعد نقضها."
  en: "Umayya ibn Abdallah ibn Khalid ibn Asid ibn Abi al-As; Abd al-Malik's governor of Khurasan — he sent his son Abdullah to Sijistan with covenant while himself at Kirman. Abd al-Malik later gave him Khurasan — the notables' plea for 'a Qurashi' after the fitna — where Bukayr's coup ended with Bujayr killing him in prison, and Umayya took the broken Khattl."
  es: "Umayya ibn Abdallah ibn Khalid ibn Asid ibn Abi al-As, gobernador de Jorasán por Abd al-Malik, envió a su hijo Abdullah a Sijistan con un pacto mientras él mismo se encontraba en Kirman. Posteriormente, Abd al-Malik le cedió Jorasán, la petición de los notables de un \"Qurashi\" tras la fitna, donde el golpe de estado de Bujayr terminó con su asesinato en prisión, y Umayya tomó el Khattl roto."
  fr: "Umayya ibn Abdallah ibn Khalid ibn Asid ibn Abi al-As, gouverneur du Khorasan sous Abd al-Malik, envoya son fils Abdullah au Sijistan avec un pacte, tandis que lui-même se trouvait à Kirman. Plus tard, Abd al-Malik lui confia le Khorasan, suite à la demande des notables de nommer un Qurashi après la fitna. Le coup d'État de Bukayr s'acheva par l'assassinat d'Umayya en prison par ce dernier, et Umayya prit alors le contrôle du Khattl dévasté."
  ur: "امیہ بن عبداللہ بن خالد بن اسید ابن ابی العاص؛ خراسان کا گورنر عبد الملک - اس نے کرمان میں رہتے ہوئے اپنے بیٹے عبداللہ کو عہد کے ساتھ سجستان بھیجا۔ بعد میں عبد الملک نے اسے خراسان دیا - فتنے کے بعد 'قریش' کے لئے قابل ذکر لوگوں کی درخواست - جہاں بقیر کی بغاوت کا خاتمہ بوجیر کے جیل میں قتل کے ساتھ ہوا، اور امیہ نے ٹوٹا ہوا خطل لے لیا۔"
