summary:
  ar: "أمية بن عبد الله بن خالد بن أسيد بن أبي العاص؛ استعمله عبد الملك بن مروان على خراسان فوجه ابنه عبد الله بن أمية على سجستان وعقد له عليها وهو بكرمان ثم ولاه عبد الملك خراسان بعد قتل ابن خازم إذ كتب وجوهها أنها لا تصلح إلا برجل من قريش فولى بكير بن وشاح طخارستان فخالفه وحبس ابنه فقاتله ثم صالحه فأمر بحبسه فقتله بجير بن ورقاء وافتتح الختل بعد نقضها."
  en: "Umayya ibn Abdallah ibn Khalid ibn Asid ibn Abi al-As; Abd al-Malik's governor of Khurasan — he sent his son Abdullah to Sijistan with covenant while himself at Kirman. Abd al-Malik later gave him Khurasan — the notables' plea for 'a Qurashi' after the fitna — where Bukayr's coup ended with Bujayr killing him in prison, and Umayya took the broken Khattl."
