id: person/sulayman-ibn-addu
class: person
label:
  ar: سليمان بن عدو
  en: Sulayman ibn Addu
  es: "Sulayman ibn Addu"
  fr: "Sulayman ibn Addu"
  ur: "سلیمان بن عدو"
summary:
  ar: خلف عبد الله بن ياسين في قيادة المرابطين بعد استشهاده سنة 450هـ في حرب برغواطة، فاستأصل شأفتهم ومحا أثر دعوتهم من المغرب، ثم هلك في جهادهم سنة 451هـ.
  en: Successor of Abd Allah ibn Yasin at the head of the Almoravids after his martyrdom in 450 AH in the Barghawata war; he extirpated their sect from the Maghreb before falling in that jihad in 451 AH.
  es: "Sucesor de Abd Allah ibn Yasin al frente de los almorávides tras su martirio en el año 450 de la Hégira en la guerra de Barghawata; extirpó a su secta del Magreb antes de caer en esa yihad en el año 451 de la Hégira."
  fr: "Successeur d'Abd Allah ibn Yasin à la tête des Almoravides après son martyre en 450 AH lors de la guerre de Barghawata; il extirpa leur secte du Maghreb avant de tomber dans ce jihad en 451 AH."
  ur: "450 ہجری میں برغوطہ جنگ میں شہادت کے بعد الموراوید کے سربراہ عبداللہ بن یاسین کا جانشین؛ اس نے 451 ہجری میں اس جہاد میں گرنے سے پہلے مغرب سے ان کے فرقے کو ختم کر دیا۔"
  tr: "Abdullah ibn Yassin'in yerine Almoravidlerin lideri oldu; 450 Hicri yılında Barghawata Savaşı'nda şehit olduktan sonra, onların kalıntılarını yok etti ve Mağrip'ten gelen çağrılarının izlerini sildi; ardından 451 Hicri'de cihadlarında hayatını kaybetti."
  id: "Ia menggantikan Abdullah ibn Yassin sebagai pemimpin Almoravid setelah syahidnya pada tahun 450 H dalam Pertempuran Barghawata, memusnahkan sisa-sisa mereka dan menghapus jejak panggilan mereka dari Maghreb, lalu gugur dalam jihad mereka pada tahun 451 H."
