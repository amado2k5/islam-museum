label: { ar: "أبو يحيى ابن عاصم الغرناطي" }
summary:
  ar: "الرئيس القاضي العلامة الكاتب الوزير أبو يحيى ابن عاصم؛ صاحب كتاب جنة الرضى في التسليم لما قدر الله وقضى الذي صور فيه نهاية الأندلس وعلة سقوطها بتمكين النصارى لأسباب الخلاف وتضريبهم بالمكر والحديعة بين ملوك الجزيرة {cite:nafh-tib-maqqari p. 511-512}."
  en: "Abu Yahya ibn Asim — Granadan ra'is, qadi, scholar, secretary and vizier, author of Jannat al-Rida fi'l-taslim li-ma qaddara Allah wa-qada, which reads al-Andalus's fall as the harvest of division the Christians sowed among its kings {cite:nafh-tib-maqqari p. 511-512}."
  es: "Abu Yahya ibn Asim: ra'is, cadí, erudito, secretario y visir granadino, autor de Jannat al-Rida fi'l-taslim li-ma qaddara Allah wa-qada, que lee la caída de al-Andalus como la cosecha de la división que los cristianos sembraron entre sus reyes {citar:nafh-tib-maqqari p. 511-512}."
  fr: "Abu Yahya ibn Asim — Granadan ra'is, cadi, érudit, secrétaire et vizir, auteur de Jannat al-Rida fi'l-taslim li-ma qaddara Allah wa-qada, qui lit la chute d'al-Andalus comme la récolte de la division que les chrétiens ont semée parmi ses rois {cite:nafh-tib-maqqari p. 511-512}."
