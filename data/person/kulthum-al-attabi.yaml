label: { ar: "كلثوم العتابي", en: "Kulthum al-'Attabi" }
summary:
  ar: "من أرض جند قنسرين والعواصم سكن الرقة، من العلم والأدب والفصاحة وبراعة المكاتبة على ما لم يكن كثير من أهل عصره، أقنع يحيى بن أكثم أن يعلم المأمون بمكانه حين قال لست بحاجب فقال ذو الفضل معوان ولكل شيء زكاة وزكاة الجاه بذله للمستعين، فلما أغراه المأمون بإسحاق الموصلي وقال اسمي كل بصل أجابه أما النسبة فقد عرفت وأما الاسم فمنكر ما كل بصل من الأسماء فقال إسحاق وما كلثوم والبصل أطيب من الثوم، ومن كلامه كاتب الرجل لسانه وحاجبه وجهه وجليسه كله {cite:muruj-al-dhahab p. 408-410}."
  en: "The Raqqa litterateur whose 'zakat of rank is spending it on the needy' won him al-Ma'mun's majlis — and whose 'what is Kul-Basl? well, what is Kulthum?' bested Ishaq al-Mawsili {cite:muruj-al-dhahab p. 408-410}."
