class: person
label: { ar: "كلثوم العتابي", en: "Kulthum al-'Attabi", es: "Kulthum al-'Attabi", fr: "Kulthum al-'Attabi", ur: "کلثوم العطبی" }
summary:
  ar: "من أرض جند قنسرين والعواصم سكن الرقة، من العلم والأدب والفصاحة وبراعة المكاتبة على ما لم يكن كثير من أهل عصره، أقنع يحيى بن أكثم أن يعلم المأمون بمكانه حين قال لست بحاجب فقال ذو الفضل معوان ولكل شيء زكاة وزكاة الجاه بذله للمستعين، فلما أغراه المأمون بإسحاق الموصلي وقال اسمي كل بصل أجابه أما النسبة فقد عرفت وأما الاسم فمنكر ما كل بصل من الأسماء فقال إسحاق وما كلثوم والبصل أطيب من الثوم، ومن كلامه كاتب الرجل لسانه وحاجبه وجهه وجليسه كله {cite:muruj-al-dhahab p. 408-410}."
  en: "The Raqqa litterateur whose 'zakat of rank is spending it on the needy' won him al-Ma'mun's majlis — and whose 'what is Kul-Basl? well, what is Kulthum?' bested Ishaq al-Mawsili {cite:muruj-al-dhahab p. 408-410}."
  es: "El literato de Raqqa cuyo «zakat de rango es gastarlo en los necesitados» le valió el majlis de al-Ma'mun, y cuyo «¿qué es Kul-Basl? bueno, ¿qué es Kulthum?» superó a Ishaq al-Mawsili {cite:muruj-al-dhahab p. 408-410}."
  fr: "Le lettré de Raqqa dont « la zakat de rang consiste à la dépenser pour les nécessiteux » lui a valu le majlis d'al-Ma'mun — et dont le « qu'est-ce que Kul-Basl ? eh bien, qu'est-ce que Kulthum ? » a surpassé Ishaq al-Mawsili {cite:muruj-al-dhahab p. 408-410}."
  ur: "رقہ کا وہ ادیب جس کی 'درجہ کی زکوٰۃ ضرورت مندوں پر خرچ ہوتی ہے' نے اسے المامون کی مجلس جیتی اور جس کی 'کل بسل کیا ہے؟ ٹھیک ہے، کلثوم کیا ہے؟' بہترین اسحاق الموصلی {حوالہ: مروج الذہب ص۔ 408-410}۔"
  tr: "Jund Qinnasrin topraklarından ve başkentlerden Rakka'ya yerleşti. Çağdaşlarının çoğunun sahip olmadığı bilgi, edebiyat, hitabet ve yazı ustalığına sahipti. Yahya ibn Aktham'ı, 'Ben bir kadeh taşıyıcı değilim' diyerek el-Me'mun'a yerini bildirmesi için ikna etti. Dhu al-Fadl şöyle dedi: 'Yardımcının her şeyinde zekat vardır ve prestij zekatı yardım isteyenlere verilir.' El-Memun onu İshaq el-Mevsili ile ayarttığında, 'Adım her soğandır,' dedi, 'Adı bilinir. Adı reddedilmiştir.' dedi. Dedi ki, 'İshaq ve Ma Kulthum, soğan sarımsaktan iyidir.' Sözleri arasında 'adam dilini, kaşını, yüzünü ve tüm yoldaşını yazdı.' idi."
  id: "Dari tanah Jund Qinnasrin dan ibu kota, ia menetap di Raqqa. Ia memiliki pengetahuan, sastra, kefasihan, dan penguasaan menulis yang banyak sezamannya tidak miliki. Ia meyakinkan Yahya ibn Aktham untuk memberitahu al-Ma'mun tentang posisinya ketika ia berkata, 'Aku bukan pembawa cawan.' Dhu al-Fadl berkata, 'Pembantu dan segala sesuatu memiliki zakat, dan zakat prestise diberikan kepada mereka yang mencari bantuan.' Ketika al-Ma'mun menggoda dia dengan Ishaq al-Mawsili, ia berkata, 'Namaku adalah setiap bawang,' ia menjawab, 'Adapun sebutan, itu sudah diketahui. Adapun namanya, ditolak.' Ia berkata, 'Ishaq dan Ma Kulthum, dan bawang lebih baik daripada bawang putih.' Di antara kata-katanya adalah 'orang itu menulis lidahnya, alisnya, wajahnya, dan seluruh temannya.' {cite:muruj-al-dhahab, hlm. 408-410}."
