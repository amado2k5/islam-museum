id: person/faraj-ibn-sulaym
class: person
label: { ar: "فرج بن سليم الخادم", en: "Faraj ibn Sulaym", es: "Faraj ibn Sulaym", fr: "Faraj ibn Sulaym", ur: "فرج بن سلیم" }
summary:
  ar: "فرج بن سليم الخادم، من كبار خدم الدولة العباسية وعمّالها؛ عند البلاذري: وكّله الرشيد ببناء طرسوس فقدجه أبو سليم إلى مدينة السلام فأشخص الندبتين ومسح ما بين النهر إلى النهر أربعة آلاف خطة عشرين ذراعاً في مثلها وأقطع أهل طرسوس الخطط."
  en: "Faraj ibn Sulaym the eunuch, among the great court servants and administrators of the Abbasid state; in al-Baladhuri: al-Rashid charged him with building Tarsus — Abu Sulaym conducted him to Madinat al-Salam, whence he mustered the two levies — and he surveyed from river to river four thousand lots of twenty cubits square, granting the people of Tarsus their plots."
  es: "Faraj ibn Sulaym, el eunuco, uno de los grandes funcionarios y administradores de la corte del estado abasí; en al-Baladhuri: al-Rashid le encargó la construcción de Tarso — Abu Sulaym lo condujo a Madinat al-Salam, desde donde reunió a los dos contingentes — y trazó de río a río cuatro mil lotes de veinte codos cuadrados, otorgando a la gente de Tarso sus parcelas."
  fr: "Faraj ibn Sulaym l'eunuque, parmi les grands serviteurs et administrateurs de la cour de l'État abbasside; dans al-Baladhuri: al-Rashid le chargea de construire Tarse — Abu Sulaym le conduisit à Madinat al-Salam, d'où il rassembla les deux levées — et il arpenta d'une rivière à l'autre quatre mille lots de vingt coudées carrées, accordant aux habitants de Tarse leurs parcelles."
  ur: "فراج ابن سلیم خواجہ سرا، عباسی ریاست کے عظیم درباری خادموں اور منتظمین میں سے؛ البلادوری میں: الرشید نے اس پر ترسوس کی تعمیر کا الزام لگایا - ابو سلیم نے اسے مدینۃ السلام لے جایا، جہاں اس نے دو لیویز کو اکٹھا کیا - اور اس نے دریا سے دریا تک چار ہزار لاٹ بیس ہاتھ مربع کا سروے کیا، اور ترسوس کے لوگوں کو ان کے پلاٹ دیئے۔"
  tr: "Abbasi devletinin kıdemli hizmetkarlarından ve yetkililerinden biri olan Farac bin Sulaym al-Khadim; el-Baladhuri'ye göre: el-Reşid ona Tarsus'un inşasını emanet etti. Ebu Süleym onu barış şehrine gönderdi, böylece iki yarayı işaretledi ve yirmi arşın dört bin tahtayı nehirden nehre aynı şekilde ölçtü, Tarsus halkı planları kesti."
  id: "Faraj ibn Sulaym al-Khadim, salah satu pelayan dan pejabat senior negara Abbasiyah; menurut al-Baladhuri: al-Rashid mempercayakan pembangunan Tarsus kepadanya. Abu Sulaym mengirimnya ke kota damai, sehingga ia menandai dua bekas luka itu dan mengamati empat ribu papan dengan dua puluh hasta dengan cara yang sama dari sungai ke sungai, dan penduduk Tarsus memotong rencana tersebut."
