summary:
  ar: "فرج بن سليم الخادم، من كبار خدم الدولة العباسية وعمّالها؛ عند البلاذري: وكّله الرشيد ببناء طرسوس فقدجه أبو سليم إلى مدينة السلام فأشخص الندبتين ومسح ما بين النهر إلى النهر أربعة آلاف خطة عشرين ذراعاً في مثلها وأقطع أهل طرسوس الخطط."
  en: "Faraj ibn Sulaym the eunuch, among the great court servants and administrators of the Abbasid state; in al-Baladhuri: al-Rashid charged him with building Tarsus — Abu Sulaym conducted him to Madinat al-Salam, whence he mustered the two levies — and he surveyed from river to river four thousand lots of twenty cubits square, granting the people of Tarsus their plots."
