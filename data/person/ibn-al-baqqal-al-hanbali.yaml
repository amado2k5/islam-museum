id: person/ibn-al-baqqal-al-hanbali
class: person
label: { ar: "أبو طالب ابن البقال الحنبلي" }
summary:
  ar: "أبو طالب أحمد بن عبد الله بن سهل المعروف بابن البقال، الحنبلي صاحب الفتيا والنظر والمعرفة والبيان والإفصاح واللسان؛ درس الفقه على أبي عبد الله بن حامد وكانت له حلقة بجامع المنصور وله المقامات المشهودة بدار الخلافة، ومن ذلك قوله بالديوان والوزير يأتذن حاجب النعمان: «الخلافة بيضة والحنبليون حضانتها، ولئن انفقأت البيضة عن فاسد — الخلافة خيمة والحنبليون طنّابها، ولئن سقطت الطنّاب لهَوَت الخيمة»؛ توفي في شهر ربيع الأول ودفن بمقبرة أئمتنا {cite:shadharat-dhahab p. 264-265}."
  en: "Abu Talib Ahmad b. Abdallah, 'Ibn al-Baqqal' — the eloquent Hanbali mufti of Baghdad whose circle sat at the Mansur mosque, famed for his sayings at the caliph's court, among them the epigram 'the caliphate is an egg and the Hanbalis its brood-hen ... a tent whose ridge-pole they are'. Died Rabi' I 440 {cite:shadharat-dhahab p. 264-265}."
