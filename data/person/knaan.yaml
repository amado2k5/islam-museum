summary:
  ar: "مغنّي راب ومغنٍّ وكاتب أغانٍ ومخرج صومالي-كندي، وُلد في مقديشو سنة 1978، وفرّ مع أسرته من الحرب الأهلية إلى تورونتو في الثالثة عشرة من عمره. حقق شهرة عالمية بأغنيته «راية متموّجة» التي اختيرت نشيدًا ترويجيًا لكأس العالم 2010، ونال جائزة غرامي سنة 2024 عن أغنية «لاجئ»، وأخرج فيلم «أمّ أُمّ» (2024)."
  en: "Somali-Canadian rapper, singer-songwriter and filmmaker, born in Mogadishu in 1978, who fled the civil war with his family to Toronto at thirteen. He rose to international fame with 'Wavin' Flag', chosen as Coca-Cola's promotional anthem for the 2010 FIFA World Cup, won a Grammy Award in 2024 for the song 'Refugee', and directed the film Mother Mother (2024)."
  ur: "صومالی-کینیڈائی ریپر، گلوکار، نغمہ نگار و فلم ساز، 1978 میں موغادیشو میں پیدا ہوئے اور تیرہ برس کی عمر میں خانہ جنگی سے بچ کر خاندان کے ساتھ ٹورنٹو چلے گئے۔ ان کے گیت «ویون فلیگ» کو 2010 کے فیفا ورلڈ کپ کا تشہیری ترانہ چنا گیا، 2024 میں انھیں گیت «ریفیوجی» پر گریمی ایوارڈ ملا، اور انھوں نے فلم «مدر مدر» (2024ء) کی ہدایت کاری کی۔"
