label: { ar: "رذمير ملك الجلالقة", en: "Rudhmir king of the Jalaliqa", es: "Rudhmir king of the Jalaliqa", fr: "Rudhmir king of the Jalaliqa", ur: "جلالی کا بادشاہ ردمیر" }
summary:
  ar: "ملك الجلالقة إلى سنة اثنتين وثلاثين وثلاثمائة، قبله على الملك أردون وقبله أذبوشن؛ استوزر أمية بن إسحاق أخا وزير عبد الرحمن الناصر المقتول فدله على عورات المسلمين، وكانت الواقعة بينه وبين عبد الرحمن صاحب الأندلس بسمورة في شوال سنة سبع وعشرين وثلاثمائة قتل فيها من المسلمين نحو خمسين ألفاً بعد عبورهم الخندق {cite:muruj-al-dhahab p. 359-360}."
  en: "King of the Jalaliqa (Galicians) in 332 — the battle of Samura in Shawwal 327 cost the Muslims of al-Nasir's host some fifty thousand dead after they had crossed the ditch; he took the exiled Umayya ibn Ishaq into his council until the man returned to al-Andalus {cite:muruj-al-dhahab p. 359-360}."
  es: "Rey de los Jalaliqa (Galicios) en 332: la batalla de Samura en Shawwal 327 costó a los musulmanes del ejército de al-Nasir unos cincuenta mil muertos después de que cruzaron el foso; tomó al exiliado Umayya ibn Ishaq en su consejo hasta que el hombre regresó a al-Andalus {cite:muruj-al-dhahab p. 359-360}."
  fr: "Roi des Jalaliqa (Galiciens) en 332 — la bataille de Samura en Shawwal 327 coûta aux musulmans de l'armée d'al-Nasir environ cinquante mille morts après qu'ils eurent traversé le fossé; il prit l'exilé Umayya ibn Ishaq dans son conseil jusqu'à ce que celui-ci retourne en al-Andalus {cite:muruj-al-dhahab p. 359-360}."
  ur: "332 میں جلالی کا بادشاہ ⁦(گیلیشین)⁩ - شوال 327 میں سامورا کی لڑائی میں النصیر کے میزبان کے مسلمانوں کو کھائی عبور کرنے کے بعد تقریباً پچاس ہزار مارے گئے۔ اس نے جلاوطن امیہ بن اسحاق کو اپنی مجلس میں لے لیا یہاں تک کہ وہ شخص اندلس واپس آیا۔ 359-360}۔"
