summary:
  ar: "ملك الجلالقة إلى سنة اثنتين وثلاثين وثلاثمائة، قبله على الملك أردون وقبله أذبوشن؛ استوزر أمية بن إسحاق أخا وزير عبد الرحمن الناصر المقتول فدله على عورات المسلمين، وكانت الواقعة بينه وبين عبد الرحمن صاحب الأندلس بسمورة في شوال سنة سبع وعشرين وثلاثمائة قتل فيها من المسلمين نحو خمسين ألفاً بعد عبورهم الخندق {cite:muruj-al-dhahab p. 359-360}."
  en: "King of the Jalaliqa (Galicians) in 332 — the battle of Samura in Shawwal 327 cost the Muslims of al-Nasir's host some fifty thousand dead after they had crossed the ditch; he took the exiled Umayya ibn Ishaq into his council until the man returned to al-Andalus {cite:muruj-al-dhahab p. 359-360}."
