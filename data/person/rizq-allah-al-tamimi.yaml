id: person/rizq-allah-al-tamimi
class: person
label: { ar: "أبو محمد التميمي شيخ حنابلة بغداد" }
summary:
  ar: "رزق الله بن عبد الوهاب بن عبد العزيز بن الحارث الإمام أبو محمد التميمي البغدادي الفقيه الواعظ شيخ الحنابلة؛ قرأ القرآن على أبي الحسن الحامد وتقدم في الفقه والأصول والتفسير والعربية واللغة وحدث عن ابن المتيم وأبي عمر بن مهدي والكبار؛ قال ابن عقيل كان من كبار مشايخه سيد الجماعة من أصحاب أحمد بيتاً ورياسة وحشمة، أحلى الناس عبارة في النظر وأجرأهم قلماً في الفتيا وأحسنهم وعظاً؛ توفي في نصف جمادى الأولى سنة ثمان وثمانين وأربعمائة عن ثمان وثمانين سنة {cite:shadharat-dhahab p. 385}."
  en: "Rizq Allah b. Abd al-Wahhab al-Tamimi, Abu Muhammad — shaykh of Baghdad's Hanbalis, master of fiqh, usul, tafsir, arabiyya and lugha; Ibn Aqil counted him among his greatest shaykhs, head of Ahmad's companions in house and rank; died mid-Jumada I 488 aged eighty-eight {cite:shadharat-dhahab p. 385}."
