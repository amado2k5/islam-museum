summary:
  ar: بحّار وخرّاط ومؤلف عثماني ⁦(وُلد على الأرجح بجاليبولي، ت 961/1553-4 بالقاهرة)⁩؛
    نشأ قرصاناً مع عمه كمال ريس ثم خدم الأسطول العثماني، ورسم سنة 919/1513 خريطة العالم
    الشهيرة وألف «كتاب بحريه» للملاحة ⁦(1521، 1526)⁩ {cite:encyclopaedia-of-islam-2}.
  en: Ottoman mariner, cartographer and author (b. probably Gallipoli, date unknown;
    d. Cairo 961/1553-4); raised a corsair at his uncle Kemal Reis's side then served
    the Ottoman fleet, drew the celebrated world map of 919/1513 and wrote the maritime
    manual Kitab-i Bahriye (1521, 1526) {cite:encyclopaedia-of-islam-2}.
  ur: عثمانی ملاح، نقشہ نگار اور مصنف ⁦(غالباً گیلی بولی میں پیدا، وفات قاہرہ 961/1553-4ء)⁩؛
    چچا کمال رئیس کے ساتھ قزاقی سے پلا پھر عثمانی بحریہ کی خدمت کی، 919/1513ء میں
    مشہور عالمی نقشہ بنایا اور ملاحی رہنما کتاب بحریہ لکھی ⁦(1521، 1526)⁩ {cite:encyclopaedia-of-islam-2}.
  es: "Marino, cartógrafo y autor otomano (n. probablemente Gallipoli, fecha desconocida; m. El Cairo 961/1553-4); se convirtió en corsario al lado de su tío Kemal Reis y luego sirvió en la flota otomana, dibujó el célebre mapa del mundo de 919/1513 y escribió el manual marítimo Kitab-i Bahriye (1521, 1526) {cite:encyclopaedia-of-islam-2}."
