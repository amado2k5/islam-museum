summary:
  ar: "جلال الدين فيروز الخلجي ⁦(نحو 1220 – 19 يوليو 1296)⁩ ضابط في دولة المماليك بدهلي صار وصيًا ثم خلع آخر سلاطينها وأسس الدولة الخلجية وحكم من 1290 إلى اغتياله سنة 1296 بيد ابن أخيه علاء الدين الخلجي؛ عُرف بلينه وصدّ غزوًا مغوليًا في عهده."
  en: "Jalal al-Din Firuz Khalji (c. 1220 - 19 July 1296) was a Mamluk-dynasty officer at Delhi who became regent, deposed the last Mamluk sultan and founded the Khalji dynasty, ruling from 1290 until his assassination in 1296 by his nephew Alauddin Khalji; he was known for his mild temper and repelled a Mongol invasion."
  ur: "جلال الدین فیروز خلجی ⁦(تقریباً 1220ء – 19 جولائی 1296ء)⁩ دہلی کے مملوک افسر تھے جو وصی بنے، آخری مملوک سلطان کو ہٹا کر خلجی خاندان کی بنیاد رکھی اور 1290ء سے 1296ء میں اپنے بھتیجے علاؤ الدین خلجی کے ہاتھوں قتل تک حکومت کی۔"
