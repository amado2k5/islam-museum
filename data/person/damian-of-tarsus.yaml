summary:
  ar: "دميانة الطرسوسي، أمير طرسوس زمن المعتضد؛ خلفه فيها ابن طوغان سنة 283هـ فقوي، وغلبه راغب مولى الموفق فحمل إلى بغداد، وكان بإشارته أحرقت مراكب طرسوس الخمسون فضعف المسلمون في البحر."
  en: "Damiana of Tarsus, governor of Tarsus under al-Mu'tadid; left in charge by Ibn Tughan in 283 AH, defeated by Raghib mawla of al-Muwaffaq and carried to Baghdad; at his instigation Tarsus's fifty raiding ships were burned, weakening the Muslims at sea."
  es: "Damiana de Tarso, gobernador de Tarso bajo el mandato de al-Mu'tadid; Ibn Tughan lo dejó al mando en el año 283 de la Hégira, fue derrotado por Raghib mawla de al-Muwaffaq y llevado a Bagdad; por instigación suya, los cincuenta barcos de asalto de Tarso fueron incendiados, debilitando a los musulmanes en el mar."
  fr: "Damiana de Tarse, gouverneure de Tarse sous al-Mu'tadid; laissée en charge par Ibn Tughan en 283 AH, vaincue par Raghib mawla d'al-Muwaffaq et emmenée à Bagdad; à son instigation, les cinquante navires de pillage de Tarse furent incendiés, affaiblissant les musulmans en mer."
