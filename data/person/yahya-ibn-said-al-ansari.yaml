summary:
  ar: "من فقهاء المدينة في الطبقة الثالثة، وكان قاضياً لأبي جعفر المنصور؛ قال حماد بن زيد إن أيوب قال له لم يترك أفقه من يحيى بن سعيد."
  en: "A Medinan jurist of the third generation who served as qadi for al-Mansur; Hammad ibn Zayd reports Ayyub saying he left no jurist more learned than Yahya ibn Sa'id."
  es: "Un jurista medinense de tercera generación que sirvió como cadí para al-Mansur; Hammad ibn Zayd relata que Ayyub dijo que no dejó ningún jurista más erudito que Yahya ibn Sa'id."
  fr: "Un juriste médinois de la troisième génération qui a servi comme cadi pour al-Mansur; Hammad ibn Zayd rapporte qu'Ayyub a dit qu'il n'a laissé aucun juriste plus savant que Yahya ibn Sa'id."
  ur: "تیسری نسل کا ایک مدنی فقیہ جس نے المنصور کے لیے بطور قاضی خدمات انجام دیں۔ حماد بن زید ایوب سے روایت کرتے ہیں کہ انہوں نے یحییٰ بن سعید سے زیادہ عالم کوئی فقیہ نہیں چھوڑا۔"
  tr: "Medine'nin üçüncü sınıf hukukçuları arasındaydı ve Ebu Ca'fer el-Mansur için yargıçtı; Hammad ibn Zayd, Eyyub'un ona Yahya ibn Sa'id'den daha bilgili bir figür bırakmadığını söylediğini söyledi."
  id: "Ia termasuk di antara ahli hukum Madinah kelas tiga, dan ia adalah hakim untuk Abu Ja'far al-Mansur; Hammad ibn Zayd mengatakan bahwa Ayyub mengatakan kepadanya bahwa ia tidak meninggalkan tokoh yang lebih berpengetahuan daripada Yahya ibn Sa'id."
