summary:
  en: "A prominent Thaqafi physician-nobleman and son of the famed physician al-Harith ibn Kalada; allied to Banu Abd al-Dar, he embraced Islam and was granted one hundred camels by the Prophet at al-Ji'rana among al-Mu'allafa Qulubuhum."
  fr: "Un éminent médecin-nobleman Thaqafi et fils du célèbre médecin al-Harith ibn Kalada ; allié à Banu Abd al-Dar, il a embrassé l'Islam et a reçu cent chameaux par le Prophète à al-Ji'rana parmi al-Mu'allafa Qulubuhum."
  ar: "شريف ثقفي من بني علاج وابن طبيب العرب الحارث بن كلدة، حليف بني عبد الدار؛ أسلم وأعطاه النبي مئة بعير بالجعرانة في سهم المؤلفة قلوبهم."
  ur: "ثقیفی ممتاز حکیم-سردار اور مشہور حکیم حارث بن کَلدہ کے فرزند؛ بنو عبد الدار کے حلیف، مسلمان ہوئے اور جعرانہ میں انعام پائے۔"
  es: "Un destacado médico y noble Thaqafi, hijo del célebre médico al-Harith ibn Kalada; aliado de Banu Abd al-Dar, abrazó el Islam y el Profeta le concedió cien camellos en al-Ji'rana entre al-Mu'allafa Qulubuhum."
