summary:
  ar: "محمد بن عاصم بن يحيى، أبو عبد الله الأصبهاني، كاتب القاضي، رحل وأخذ عن أصحاب الشافعي وابن وهب، وسمع من علي بن حرب وسلمة بن شبيب، وروى عنه أحمد بن بندار والطبراني وغيرهما. قال أبو الشيخ: صنّف كتبًا كثيرة. توفي سنة 299 {cite:tabaqat-shafiiyya-subki j.2 p.19}."
  en: "Muhammad ibn Asim ibn Yahya, Abu 'Abd Allah al-Asbahani (d. 299) — 'the judge's secretary'; he journeyed and studied under al-Shafi'i's companions and Ibn Wahb, heard 'Ali b. Harb and Salama b. Shabib, transmitted to Ahmad b. Bandar and al-Tabarani, and 'composed many books' per Abu'l-Shaykh {cite:tabaqat-shafiiyya-subki j.2 p.19}."
  ur: "محمد بن عاصم بن یحییٰ، ابو عبد اللہ اصبہانی (مت 299ھ) — قاضی کے کاتب؛ امام شافعی کے اصحاب اور ابن وہب سے سیکھا، احمد بن بندار اور طبرانی ان سے روایت کرتے ہیں؛ ابو الشیخ کے مطابق انھوں نے بہت سی کتابیں تصنیف کیں {cite:tabaqat-shafiiyya-subki j.2 p.19}."
