summary:
  ar: "محمد بن عاصم بن يحيى، أبو عبد الله الأصبهاني، كاتب القاضي، رحل وأخذ عن أصحاب الشافعي وابن وهب، وسمع من علي بن حرب وسلمة بن شبيب، وروى عنه أحمد بن بندار والطبراني وغيرهما. قال أبو الشيخ: صنّف كتبًا كثيرة. توفي سنة 299 {cite:tabaqat-shafiiyya-subki j.2 p.19}."
  en: "Muhammad ibn Asim ibn Yahya, Abu 'Abd Allah al-Asbahani (d. 299) — 'the judge's secretary'; he journeyed and studied under al-Shafi'i's companions and Ibn Wahb, heard 'Ali b. Harb and Salama b. Shabib, transmitted to Ahmad b. Bandar and al-Tabarani, and 'composed many books' per Abu'l-Shaykh {cite:tabaqat-shafiiyya-subki j.2 p.19}."
  ur: "محمد بن عاصم بن یحییٰ، ابو عبد اللہ اصبہانی ⁦(مت 299ھ)⁩ — قاضی کے کاتب؛ امام شافعی کے اصحاب اور ابن وہب سے سیکھا، احمد بن بندار اور طبرانی ان سے روایت کرتے ہیں؛ ابو الشیخ کے مطابق انھوں نے بہت سی کتابیں تصنیف کیں {cite:tabaqat-shafiiyya-subki j.2 p.19}."
  es: "Muhammad ibn Asim ibn Yahya, Abu 'Abd Allah al-Asbahani (m. 299) - 'el secretario del juez'; viajó y estudió con los compañeros de al-Shafi'i y con Ibn Wahb, escuchó a 'Ali b. Harb y Salamá b. Shabib, transmitido a Ahmad b. Bandar y al-Tabarani, y 'compusieron muchos libros' según Abu'l-Shaykh {cita:tabaqat-shafiiyya-subki j.2 p.19}."
  fr: "Muhammad ibn Asim ibn Yahya, Abu 'Abd Allah al-Asbahani (mort en 299) — « le secrétaire du juge »; il voyagea et étudia auprès des compagnons d'al-Shafi'i et d'Ibn Wahb, entendit 'Ali b. Harb et Salama b. Shabib, transmis à Ahmad b. Bandar et al-Tabarani, et « composé de nombreux livres » selon Abu'l-Shaykh {cite:tabaqat-shafiiyya-subki j.2 p.19}."
  tr: "Muhammed bin Asim ibn Yahya, hakim katibi Ebu Abdullah el-Esbahani, el-Şafii ve İbn Vahb'ın yoldaşlarının yanında seyahat etti ve eğitim aldı, Ali ibn Harb ve Selma ibn Şabib'den dinledi; Ahmed ibn Bandar ise ondan, el-Tebarani'den ve diğerlerinden rivayet etti. Ebu el-Şeyh şöyle dedi: Birçok kitap yazdı. 299 yılında vefat etti {atıf:tabaqat-şafiiyya-subki j.2 s.19}."
  id: "Muhammad ibn Asim ibn Yahya, Abu Abdullah al-Asbahani, juru tulis hakim, bepergian dan belajar di bawah sahabat al-Shafi'i dan Ibn Wahb, dan mendengar dari Ali ibn Harb dan Salma ibn Shabib, serta Ahmad ibn Bandar yang menceritakan dari dirinya, al-Tabarani, dan lainnya. Abu al-Sheikh berkata: Ia menulis banyak buku. Ia wafat pada tahun 299 {cite:tabaqat-shafiiyya-subki j.2 hlm.19}."
