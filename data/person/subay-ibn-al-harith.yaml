summary:
  en: "Leader of Banu Malik of Thaqif alongside his brother Ahmar at the Battle of Hunayn; his clan bore the brunt of the Muslim counterattack and suffered heavy casualties around their banner before falling back to Ta'if."
  ar: "سيد بني مالك من ثقيف وقائد لواء بني مالك مع أخيه أحمر يوم حنين؛ اشتد القتال حول لوائهم فقُتل منهم نحو سبعين رجلاً ثم انحازوا إلى الطائف."
  es: "Líder de Banu Malik de Thaqif junto a su hermano Ahmar en la batalla de Hunayn; su clan soportó el grueso del contraataque musulmán y sufrió numerosas bajas alrededor de su estandarte antes de replegarse a Ta'if."
  fr: "Chef des Banu Malik de Thaqif aux côtés de son frère Ahmar lors de la bataille de Hunayn; son clan a subi le plus gros de la contre-attaque musulmane et a subi de lourdes pertes autour de sa bannière avant de se replier sur Ta'if."
  ur: "جنگ حنین میں اپنے بھائی احمر کے ساتھ ثقیف کے بنو مالک کا سردار؛ اس کے قبیلے کو مسلمانوں کے جوابی حملے کا سامنا کرنا پڑا اور طائف واپس گرنے سے پہلے ان کے جھنڈے کے گرد بھاری جانی نقصان ہوا۔"
  tr: "Banu Malik'in Thaqif'ten ustası ve Banu Malik tugayı komutanı, kardeşi Ahmar ile birlikte Hunayn günü; sancakları etrafında çatışmalar şiddetlendi, yaklaşık yetmiş kişi öldü, ardından Taif ile ittifak kurdular."
  id: "Penguasa Banu Malik dari Thaqif dan komandan brigade Banu Malik bersama saudaranya Ahmar pada hari Hunayn; pertempuran di sekitar panji mereka semakin sengit, membunuh sekitar tujuh puluh orang, lalu mereka bersekutu dengan Taif."
