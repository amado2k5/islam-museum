summary:
  ar: "المطلب بن عبد الله بن حنطب بن الحارث، القرشي المخزومي المدني، روى عن عمر وأبي موسى الأشعري وزيد بن ثابت وأبي هريرة وعائشة وابن عباس وابن عمر وأنس وغيرهم، وروى عنه ابناه عبد العزيز والحكم والأوزاعي وابن جريج وغيرهم. قال أبو زرعة والدارقطني: ثقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8207}"
  en: "al-Muttalib ibn Abd Allah ibn Hantab ibn al-Harith, of Quraysh and Banu Makhzum, from Medina. He transmitted from Umar, Abu Musa al-Ashari, Zayd ibn Thabit, Abu Hurayra, Aisha, Ibn Abbas, Ibn Umar and Anas, among others; his sons Abd al-Aziz and al-Hakam, al-Awzai and Ibn Jurayj heard from him. Abu Zurʿa and al-Daraqutni called him trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8207}"
