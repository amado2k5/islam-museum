summary:
  ar: "إمام ومنتج وكاتب أمريكي من أصل باكستاني يقيم في شيكاغو، وهو الرئيس المؤسس لمؤسسة «ساوند فيجن» الإعلامية منذ 1988، ومنتج برنامج «راديو إسلام» اليومي، ورئيس مجلس برلمان أديان العالم 2010–2015، وتقف مؤسسته خلف قناة «مسلم نتورك تي في»."
  en: "American imam, producer, author and non-profit executive of Pakistani origin, based in Chicago. He is the founding president of the Sound Vision media foundation (established 1988), executive producer of the daily Radio Islam programme, a former Chair of the Board of the Parliament of the World's Religions (2010–2015), and his foundation runs the Muslim Network TV channel."
  ur: "شکاگو میں مقیم پاکستانی نژاد امریکی امام، پروڈیوسر، مصنف اور غیر منافع بخش اداروں کے منتظم۔ وہ میڈیا فاؤنڈیشن «ساؤنڈ وژن» کے بانی صدر ہیں (قیام 1988)، روزانہ کے پروگرام «ریڈیو اسلام» کے منتجِ اعلیٰ، اور عالمی بین المذاہب پارلیمنٹ کے بورڈ کے سابق چیئرمین (2010–2015) ہیں؛ مسلم نیٹ ورک ٹی وی چینل انہی کی فاؤنڈیشن چلاتی ہے۔"
