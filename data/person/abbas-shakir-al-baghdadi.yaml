summary:
  ar: عباس شاكر البغدادي ⁦(1951–2023)⁩ خطاط عراقي من أهل بغداد، من كبار خطاطي المدرسة الكلاسيكية، اشتهر بتوازن لوحاته ووضوحها وجلالها؛ توفي في 2 مايو 2023.
  en: Abbas Shakir al-Baghdadi ⁦(1951–2023)⁩ was a Baghdad-born master of classical Islamic calligraphy, renowned for the balance, clarity and majesty of his works; he died on 2 May 2023. He bears no relation
    to any political or militant figure of the same nisba.
  fr: "Abbas Shakir al-Baghdadi (1951–2023) était un maître de la calligraphie islamique classique né à Bagdad, renommé pour l'équilibre, la clarté et la majesté de ses œuvres ; il mourut le 2 mai 2023. Il n'a aucun lien avec quelque figure politique ou militante portant la même nisba."
  ur: عباس شاکر البغدادی ⁦(1951–2023)⁩ بغداد کے ممتاز کلاسیکی اسلامی خطاط تھے جو اپنے کام کے توازن، صفائی اور جلال کے لیے معروف ہوئے؛ 2 مئی 2023 کو وفات پائی۔ ان کا کسی سیاسی یا مسلح شخصیت سے کوئی تعلق
    نہیں۔
  es: "Abbas Shakir al-Baghdadi (1951–2023) fue un maestro de la caligrafía islámica clásica, nacido en Bagdad, reconocido por el equilibrio, la claridad y la majestuosidad de sus obras; falleció el 2 de mayo de 2023. No guarda relación con ninguna figura política o militante de la misma nisba."
  tr: "Abbas Şaker El-Bağdadi (1951–2023), Bağdatlı Iraklı bir hattat olup, klasik okulun büyük hattatlarından biriydi ve resimlerindeki denge, açıklık ve ihtişamla tanınıyordu; 2 Mayıs 2023'te vefat etti."
  id: "Abbas Shaker Al-Baghdadi (1951–2023) adalah seorang kaligrafer Irak dari Baghdad, salah satu kaligrafer hebat dari aliran klasik, yang dikenal karena keseimbangan, kejelasan, dan keagungan lukisannya; ia meninggal pada 2 Mei 2023."
