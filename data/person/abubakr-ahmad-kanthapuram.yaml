summary:
  ar: "عالم هندي من كيرالا، وُلد سنة 1939 في كانثابورام بكاليكوت. مفتي الهند الكبير منذ 2019، والأمين العام لجماعة علماء أهل السنة بعموم الهند، ومؤسس مؤسسة مركز ⁦(مركذ)⁩ التعليمية."
  en: "Indian scholar from Kerala, born 1939 at Kanthapuram, Kozhikode. Grand Mufti of India since 2019, general secretary of the All India Sunni Jamiyyathul Ulama, and founder of the Markaz educational movement."
  fr: "Savant indien du Kerala, né en 1939 à Kanthapuram, Kozhikode. Grand mufti de l'Inde depuis 2019, secrétaire général de l'All India Sunni Jamiyyathul Ulama et fondateur du mouvement éducatif Markaz."
  ur: "کیرالہ کے ہندوستانی عالم، 1939 میں کانٹھاپورم، کوژیکوڈ میں پیدا ہوئے۔ 2019 سے مفتی اعظم ہند، آل انڈیا سنی جمیعت العلماء کے جنرل سیکریٹری، اور تعلیمی تحریک مرکز کے بانی۔"
  es: "Erudito indio originario de Kerala, nacido en 1939 en Kanthapuram, Kozhikode. Gran Muftí de la India desde 2019, secretario general de la All India Sunni Jamiyyathul Ulama y fundador del movimiento educativo Markaz."
  tr: "1939'da Calicut, Kanthapuram'da doğmuş, Kerala'lı bir Hint alim. 2019'dan beri Hindistan Büyük Müftüsü, Tüm Hindistan Sünni Alimler Birliği Genel Sekreteri ve Markaz Eğitim Vakfı'nın kurucusu."
  id: "Seorang cendekiawan India dari Kerala, lahir pada tahun 1939 di Kanthapuram, Calicut. Mufti Agung India sejak 2019, Sekretaris Jenderal Asosiasi Cendekiawan Sunni Seluruh India, dan pendiri Yayasan Pendidikan Markaz."
