  es: "Muhammad ibn Nasr ibn Bassam"
  fr: "Muhammad ibn Nasr ibn Bassam"
  ur: "محمد بن نصر بن بسام"
summary:
  ar: أبو جعفر بن بسام، كان في غاية السرو والمروءة مترفاً حسن الزي مشغوفاً بالبناء، وصف القمي مجلسه في قبة طليت بالطين الأرمني وسطها كانون زرافين في عشرة أذرع مليء جمر الغضى يدفع جام ماء الورد بالكافور، ومائدته الجزع الملوّن بالذهب وفيها ستبوسق يفور وجامات لوزينج وإجانة صينية بألف تفاحة شامي، وهو أبو الهجاء علي بن محمد {cite:muruj-al-dhahab p. 658-660}.
  en: Abu Ja'far the munificent — his Armenian-plastered dome, giraffe-necked brazier and thousand-apple ewers; even his splendor was lampooned by his own son {cite:muruj-al-dhahab p. 658-660}.
  es: "Abu Ja'far el magnánimo: su cúpula enlucida al estilo armenio, su brasero con cuello de jirafa y sus cántaros de mil manzanas; incluso su esplendor fue objeto de burla por parte de su propio hijo {cite:muruj-al-dhahab p. 658-660}."
  fr: "Abou Ja'far le munificent — son dôme recouvert de plâtre arménien, son brasero à col de girafe et ses aiguières à mille pommes; même sa splendeur fut ridiculisée par son propre fils {cite:muruj-al-dhahab p. 658-660}."
  ur: "ابو جعفر مہربان - اس کا آرمینیائی پلستر والا گنبد، زرافے کی گردن والا بریزیر اور ہزار سیب والے جھنکار؛ حتیٰ کہ اس کی شان و شوکت کو اس کے اپنے بیٹے نے چراغاں کر دیا۔ 658-660}۔"
  tr: "Ebu Ca'far ibn Bassam son derece soylu ve soylu, şık giyimli ve inşaata tutkuluydu. Al-Qummi, oturduğu yerini Ermeni kiliyle boyanmış bir kubbede, ortasında zürafa örtüsü olan, on arşın kömürle doldurulmuş ve bir kafur gül suyu dolduran bir kadeh kafur suyu olarak tarif etmiştir. Masası, oturma tenceresi, kaybeden fincanlar ve binlerce Levant elması bulunan bir Çin devesi olan altın renkli onikstir. Ali ibn Muhammed'in hicvin babasıdır {atıf:muruj-al-dhahab, s. 658-660}."
  id: "Abu Ja'far ibn Bassam sangat mulia dan mulia, berpakaian rapi, dan bersemangat membangun. Al-Qummi menggambarkan tempat duduknya di kubah yang dicat dengan tanah liat Armenia, dengan kanopi jerapah di tengahnya, sepuluh hasta diisi dengan batu barus, menuangkan secangkir air mawar dengan kamper. Mejanya adalah oniks berwarna emas dengan panci duduk, cangkir yang dihilangkan, dan unta Tionghoa dengan seribu apel Levant. Ia adalah bapak satir Ali ibn Muhammad {cite:muruj-al-dhahab, hlm. 658-660}."
