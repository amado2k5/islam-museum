summary:
  ar: "خيار بن سلمة، أبو زياد، يعد في الشاميين، روى عن عائشة، وروى عنه خالد بن معدان، ذكره ابن حبان في الثقات، وروى له أبو داود والنسائي حديثاً واحداً عن أنه سأل عائشة عن البصل. (؟؟). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
  en: "Khayyar ibn Salama, Abu Ziyad, counted among the Syrians; he narrated from Aisha and was narrated from by Khalid ibn Ma'dan. Ibn Hibban lists him among the reliable narrators. Abu Dawud and al-Nasa'i record one report from him, on onions. Dates not given in the book. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
