summary:
  en: "The commander of the seventy-thousand Abyssinian force which, armed with a Roman fleet, occupied Yemen in 525 CE; he governed for the Negus until Abraha, one of his own generals, assassinated him and ruled in his place."
  ar: "قائد الجيش الحبشي السبعين ألفاً الذي احتل اليمن سنة 525م بأسطول هيأه الرومان؛ ظل حاكماً من قبل ملك الحبشة حتى اغتاله أبرهة أحد قواده وحكم مكانه."
  es: "Fue el comandante de la fuerza abisinia de setenta mil hombres que, armada con una flota romana, ocupó Yemen en el año 525 d. C.; gobernó en nombre del Negus hasta que Abraha, uno de sus propios generales, lo asesinó y gobernó en su lugar."
  fr: "Commandant des soixante-dix mille Abyssins qui, armés d'une flotte romaine, occupèrent le Yémen en 525 après J.-C., il gouverna pour le Négus jusqu'à ce qu'Abraha, l'un de ses généraux, l'assassine et prenne sa place."
  ur: "ستر ہزار حبشی فوج کا کمانڈر جس نے رومی بحری بیڑے سے لیس ہو کر 525 عیسوی میں یمن پر قبضہ کیا تھا۔ اس نے نجاشی کے لیے حکومت کی یہاں تک کہ ابرہہ، جو کہ اس کے اپنے جرنیلوں میں سے ایک تھا، نے اسے قتل کر دیا اور اس کی جگہ حکومت کی۔"
  tr: "525 yılında Romalıların hazırladığı bir filoyla Yemen'i işgal eden yetmiş bin Etiyopya ordusunun komutanı; Habeşistan Kralı'nın hükümdarı olarak kaldı, ta ki onun yerine hüküm süren komutanlarından biri olan Abraha tarafından suikaste uğrayana kadar."
  id: "Komandan tujuh puluh ribu tentara Ethiopia yang menduduki Yaman pada tahun 525 M dengan armada yang disiapkan oleh Romawi; ia tetap menjadi penguasa di bawah Raja Abyssinia hingga ia dibunuh oleh salah satu komandannya, Abraha, yang memerintah menggantikannya."
