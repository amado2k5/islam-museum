summary:
  ar: "محمد باقر بن محمد أكمل البهبهاني المعروف بالوحيد البهبهاني، فاضل إمامي ولد في أصفهان وأقام في بهبهان ثم استقر في كربلاء وتوفي بالحائر سنة 1206 هـ الموافقة 1791 م؛ له تعليقات على منهج المقال وحاشية على مفاتيح الأحكام."
  en: "Muhammad Baqir ibn Muhammad Akmal al-Bihbahani, known as al-Wahid al-Bihbahani, an Imami (Twelver Shia) scholar born in Isfahan who lived in Behbahan and settled in Karbala, dying at al-Ha'ir in 1206 AH (1791); author of glosses on Minhaj al-maqal and on Mafatih al-ahkam."
  es: "Muhammad Baqir ibn Muhammad Akmal al-Bihbahani, conocido como al-Wahid al-Bihbahani, un erudito Imami (doce chiíta) nacido en Isfahan que vivió en Behbahan y se estableció en Karbala, muriendo en al-Ha'ir en 1206 AH (1791); autor de glosas sobre Minhaj al-maqal y sobre Mafatih al-ahkam."
  fr: "Muhammad Baqir ibn Muhammad Akmal al-Bihbahani, connu sous le nom d'al-Wahid al-Bihbahani, un érudit Imami (chiite duodécimain) né à Ispahan qui vivait à Behbahan et s'est installé à Karbala, mourant à al-Ha'ir en 1206 AH (1791); auteur de gloses sur Minhaj al-maqal et sur Mafatih al-ahkam."
  ur: "محمد باقر بن محمد اکمل البہبہانی المعروف الواحد البیبہانی، ایک امامی ⁦(بارہ شیعہ)⁩ عالم جو اصفہان میں پیدا ہوئے جو بہبہان میں مقیم تھے اور کربلا میں آباد ہوئے، 1206 ہجری (1791) میں الحائر میں وفات پائی؛ منہاج المقال اور مفاتیح الاحکام پر گلوز کے مصنف۔"
  tr: "Muhammed Bakir bin Muhammed Ekmel el-Bahbahani, Al-Wahid al-Bahbahani olarak bilinir, İsfahan'da doğmuş, Bahbahan'da ikamet etmiş, ardından Kerbel'de yerleşmiş ve 1206 Hicri yılında (M.S. 1791'e denk gelir) el-Hair'de ölmüştür. Makalenin metodolojisi üzerine yorumlar ve Mahatih al-Ahkam üzerine marjinal bir yorum yazmıştır."
  id: "Muhammad Baqir ibn Muhammad Akmal al-Bahbahani, yang dikenal sebagai Al-Wahid al-Bahbahani, adalah seorang Imami yang berbudi luhur yang lahir di Isfahan, tinggal di Bahbahan, kemudian menetap di Karbala, dan meninggal di al-Ha'ir pada tahun 1206 H (setara dengan tahun 1791 M). Ia menulis komentar tentang metodologi artikel tersebut dan komentar pinggiran tentang Mafatih al-Ahkam."
