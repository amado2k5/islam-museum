label:
  ar: "محمد باقر البهبهاني ⁦(الوحيد البهبهاني)⁩"
  en: "Muhammad Baqir al-Bihbahani"
  es: "Muhammad Baqir al-Bihbahani"
  fr: "Muhammad Baqir al-Bihbahani"
  ur: "محمد باقر البہبہانی"
roles: [jurist, marja]
