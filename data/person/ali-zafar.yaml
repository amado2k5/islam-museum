summary:
  ar: "مغنٍّ وكاتب أغانٍ وممثل باكستاني (وُلد 18 مايو 1980 في لاهور)، ابن أستاذَين في جامعة البنجاب، اشتهر بأغنية «چھنو» من ألبومه الأول «حقہ پاني» (2003) الذي بيع منه أكثر من خمسة ملايين نسخة، ثم بنى مسيرة تمثيلية في بوليوود بدءاً بـ«تیرے بن لادن» (2010) وفي السينما الباكستانية، ونال وسام حسن الأداء (2021)."
  en: "Pakistani singer-songwriter and actor (born 18 May 1980 at Lahore), son of two University of Punjab professors, who rose to fame with Channo from his debut album Huqa Pani (2003), which sold over five million copies, then built a film career in Bollywood from Tere Bin Laden (2010) and in Pakistani cinema, and received the Pride of Performance (2021)."
  ur: "پاکستانی گلوکار، نغمہ نگار اور اداکار (پیدائش 18 مئی 1980ء، لاہور)، جامعہ پنجاب کے دو پروفیسروں کے بیٹے؛ پہلی البم «حقہ پانی» (2003ء) کی «چھنو» سے شہرت پائی جس کی پچاس لاکھ سے زائد کاپیاں فروخت ہوئیں، پھر «تیرے بن لادن» (2010ء) سے بالی ووڈ اور پاکستانی سنیما میں اداکاری کی اور پرائڈ آف پرفارمنس (2021ء) حاصل کیا۔"
