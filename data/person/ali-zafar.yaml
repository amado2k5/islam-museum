summary:
  ar: "مغنٍّ وكاتب أغانٍ وممثل باكستاني ⁦(وُلد 18 مايو 1980 في لاهور)⁩، ابن أستاذَين في جامعة البنجاب، اشتهر بأغنية «چھنو» من ألبومه الأول «حقہ پاني» (2003) الذي بيع منه أكثر من خمسة ملايين نسخة، ثم بنى مسيرة تمثيلية في بوليوود بدءاً بـ«تیرے بن لادن» (2010) وفي السينما الباكستانية، ونال وسام حسن الأداء (2021)."
  en: "Pakistani singer-songwriter and actor (born 18 May 1980 at Lahore), son of two University of Punjab professors, who rose to fame with Channo from his debut album Huqa Pani (2003), which sold over five million copies, then built a film career in Bollywood from Tere Bin Laden (2010) and in Pakistani cinema, and received the Pride of Performance (2021)."
  ur: "پاکستانی گلوکار، نغمہ نگار اور اداکار ⁦(پیدائش 18 مئی 1980ء، لاہور)⁩، جامعہ پنجاب کے دو پروفیسروں کے بیٹے؛ پہلی البم «حقہ پانی» ⁦(2003ء)⁩ کی «چھنو» سے شہرت پائی جس کی پچاس لاکھ سے زائد کاپیاں فروخت ہوئیں، پھر «تیرے بن لادن» ⁦(2010ء)⁩ سے بالی ووڈ اور پاکستانی سنیما میں اداکاری کی اور پرائڈ آف پرفارمنس ⁦(2021ء)⁩ حاصل کیا۔"
  es: "Cantante, compositor y actor pakistaní (nacido el 18 de mayo de 1980 en Lahore), hijo de dos profesores de la Universidad de Punjab, que saltó a la fama con Channo de su álbum debut Huqa Pani (2003), que vendió más de cinco millones de copias, luego construyó una carrera cinematográfica en Bollywood con Tere Bin Laden (2010) y en el cine pakistaní, y recibió el premio Pride of Performance (2021)."
  fr: "Chanteur-compositeur et acteur pakistanais (né le 18 mai 1980 à Lahore), fils de deux professeurs de l'Université du Pendjab, qui a accédé à la célébrité avec Channo à partir de son premier album Huqa Pani (2003), qui s'est vendu à plus de cinq millions d'exemplaires, puis a construit une carrière cinématographique à Bollywood à partir de Tere Bin Laden (2010) et dans le cinéma pakistanais, et a reçu le Pride of Performance (2021)."
  tr: "Pakistanlı şarkıcı, söz yazarı ve oyuncu (18 Mayıs 1980, Lahor) doğumlu, Pencap Üniversitesi'nde iki profesörün oğlu olan Sher, ilk albümü \"Haqqa Pani\" (2003)'den \"Chhanu\" şarkısıyla ünlendi; albüm beş milyondan fazla sattı. Daha sonra Bollywood'da \"Terry bin Laden\" (2010) ile başlayan ve Pakistan sinemasıyla oyunculuk kariyeri yaptı; 2021'de İyi Performans Madalyası aldı."
  id: "Seorang penyanyi, penulis lagu, dan aktor asal Pakistan (lahir 18 Mei 1980 di Lahore), putra dari dua profesor di Universitas Punjab, ia menjadi terkenal lewat lagu \"Chhanu\" dari album pertamanya \"Haqqa Pani\" (2003), yang terjual lebih dari lima juta kopi. Ia kemudian membangun karier akting di Bollywood dimulai dengan \"Terry bin Laden\" (2010) dan di perfilman Pakistan, serta menerima Medal of Good Performance (2021)."
