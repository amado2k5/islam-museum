summary:
  ar: "شمس الدين محمد بن إسماعيل بن محمد بن أحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} اشتغل بالعلم، وأخذ عن الشيخ شمس الدين البرماوي وطبقته، واشتهر بالفضل، وصحب جماعة من الأعيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} ونزل في المدارس طالباً ثم مدرساً، وولي تدريس الشيخونية، ثم ولي قضاء الشام مرتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} ثم رجع بعد أن استعفى من القضاء فأُعفي، وذلك سنة سبع وأربعين، فسعى في تدريس الصلاحية بجوار الشافعي، فباشرها نحو سنة ونيف، ثم ضعف نحو شهرين إلى أن توفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} وفي رأس الترجمة تاريخان مكتوبان «٨٤٩» و«٧٨٨» هجرية، ولم يُبيَّن أيهما الوفاة، فلا يُذكر تاريخ هنا. ولم يذكر الكتاب مصدراً لهذه الترجمة."
  en: "Shams al-Din Muhammad ibn Ismail ibn Muhammad ibn Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} He took up learning, studied under Shaykh Shams al-Din al-Barmawi and his generation, became known for his merit, and kept company with a number of notables. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} He lodged in the colleges first as a student and then as a teacher, held the teaching of the Shaykhuniyya, and twice held the judgeship of al-Sham (Syria). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} He then went back after asking to be relieved of the judgeship and was relieved, in the year 847, and sought the teaching of the Salihiyya beside the tomb of al-Shafi'i, held it for a year and more, and then declined for about two months until he died. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} The heading gives two dates, 849 and 788 AH, without saying which is the death date, so none is stated. The book gives no source for this entry."
