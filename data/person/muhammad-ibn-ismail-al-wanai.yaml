summary:
  ar: "شمس الدين محمد بن إسماعيل بن محمد بن أحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} اشتغل بالعلم، وأخذ عن الشيخ شمس الدين البرماوي وطبقته، واشتهر بالفضل، وصحب جماعة من الأعيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} ونزل في المدارس طالباً ثم مدرساً، وولي تدريس الشيخونية، ثم ولي قضاء الشام مرتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} ثم رجع بعد أن استعفى من القضاء فأُعفي، وذلك سنة سبع وأربعين، فسعى في تدريس الصلاحية بجوار الشافعي، فباشرها نحو سنة ونيف، ثم ضعف نحو شهرين إلى أن توفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} وفي رأس الترجمة تاريخان مكتوبان «٨٤٩» و«٧٨٨» هجرية، ولم يُبيَّن أيهما الوفاة، فلا يُذكر تاريخ هنا. ولم يذكر الكتاب مصدراً لهذه الترجمة."
  en: "Shams al-Din Muhammad ibn Ismail ibn Muhammad ibn Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} He took up learning, studied under Shaykh Shams al-Din al-Barmawi and his generation, became known for his merit, and kept company with a number of notables. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} He lodged in the colleges first as a student and then as a teacher, held the teaching of the Shaykhuniyya, and twice held the judgeship of al-Sham (Syria). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} He then went back after asking to be relieved of the judgeship and was relieved, in the year 847, and sought the teaching of the Salihiyya beside the tomb of al-Shafi'i, held it for a year and more, and then declined for about two months until he died. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} The heading gives two dates, 849 and 788 AH, without saying which is the death date, so none is stated. The book gives no source for this entry."
  es: "Shams al-Din Muhammad ibn Ismail ibn Muhammad ibn Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} Se dedicó al estudio, estudió con Shaykh Shams al-Din al-Barmawi y su generación, se hizo conocido por su mérito y se relacionó con varias personalidades notables. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} Se hospedó en los colegios primero como estudiante y luego como maestro, impartió la enseñanza de la Shaykhuniyya y ocupó dos veces el cargo de juez en al-Sham (Siria). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} Luego regresó tras solicitar ser relevado del cargo de juez y fue relevado en el año 847, y buscó la enseñanza de la Salihiyya junto a la tumba de al-Shafi'i, la mantuvo durante un año y más, y luego se retiró durante unos dos meses hasta su muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} El encabezado da dos fechas, 849 y 788 AH, sin decir cuál es la fecha de la muerte, por lo que no se indica ninguna. El libro no da ninguna fuente para esta entrada."
  fr: "Shams al-Din Muhammad ibn Ismail ibn Muhammad ibn Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} Il entreprit des études, étudia auprès du cheikh Shams al-Din al-Barmawī et de sa génération, acquit une grande renommée pour son mérite et fréquenta de nombreuses personnalités. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} Il logea dans les collèges, d'abord comme étudiant, puis comme enseignant, exerça l'enseignement de la Shaykhuniyya et fut deux fois juge du Sham (Syrie). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} Il retourna ensuite, après avoir demandé à être relevé de ses fonctions de juge, ce qu'il obtint en 847. Il se rendit alors à l'école Salihiyya près du tombeau d'al-Shafi'i, qu'il suivit pendant plus d'un an, puis s'en désista pendant environ deux mois jusqu'à sa mort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17713} L'intitulé mentionne deux dates, 849 et 788 AH, sans préciser laquelle est la date du décès; aucune n'est donc établie. L'ouvrage ne cite aucune source pour cette information."
  ur: "شمس الدین محمد ابن اسماعیل ابن محمد ابن احمد۔ {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 17713} اس نے علم حاصل کیا، شیخ شمس الدین البرماوی اور ان کی نسل سے تعلیم حاصل کی، اپنی قابلیت کی وجہ سے مشہور ہوئے، اور متعدد نامور لوگوں سے صحبت کی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17713} پہلے طالب علم اور پھر استاد کی حیثیت سے کالجوں میں داخلہ لیا، شیخونیہ کی تعلیم پر فائز ہوئے اور دو مرتبہ الشام ⁦(شام)⁩ کے قاضی کے عہدے پر فائز ہوئے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17713} پھر وہ قضائے الٰہی سے فارغ ہونے کا کہہ کر واپس چلے گئے اور 847ء میں فارغ ہوئے، اور مقبرہ الشافعی کے پاس صالحیہ کی تعلیم حاصل کرنے کی کوشش کی، پھر ایک سال اور اس سے زیادہ عرصہ تک اس کی وفات ہوئی اور اس کے بعد تقریباً دو ماہ تک ان کی وفات ہوئی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17713} عنوان میں دو تاریخیں ہیں، 849 اور 788 ہجری، بغیر یہ کہے کہ تاریخ وفات کون سی ہے، اس لیے کوئی بھی نہیں بتایا گیا ہے۔ کتاب اس اندراج کا کوئی ذریعہ نہیں دیتی۔"
  tr: "Şemseddin Muhammed bin İsmail bin Muhammed ibn Ahmed. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17713} Bilgiye kendini adadı, Şeyh Şemseddin el-Barmawi'nin yanında eğitim aldı, erdemiyle tanındı ve bir grup önemli şahsiyetle birlikte çalıştı. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17713} Okullara öğrenci olarak girdi, sonra öğretmen olarak başladı, Sheikhuniyya öğretimi üstlendi ve ardından iki kez al-Sham yargıcı olarak görev yaptı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17713} Sonra yargıdan istifa ettikten sonra geri döndü ve 1947 yılında görevden alındı. Al-Shafi'i ile birlikte otoriteyi öğretmeye devam etti, yaklaşık bir yıl kadar devam etti, ardından yaklaşık iki ay zayıfladı ve sonunda vefat etti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17713} Çevirinin başında iki tarih yazılmıştır: \"849\" ve \"788\" Hicri, ancak hiçbiri ölüm tarihini belirtmediği için burada tarih belirtilmemiştir. Kitapta bu çeviri için bir kaynak belirtilmemiştir."
  id: "Shams al-Din Muhammad ibn Ismail ibn Muhammad ibn Ahmad. {sitasi:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17713} Ia mendedikasikan dirinya pada ilmu, belajar di bawah Sheikh Shams al-Din al-Barmawi, terkenal karena kebajikannya, dan mendampingi sekelompok tokoh terkemuka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17713} Ia masuk sekolah sebagai murid lalu sebagai guru, mengajar Sheikhuniyya, dan kemudian menjabat sebagai hakim al-Sham dua kali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17713} Kemudian ia kembali setelah mengundurkan diri dari pengadilan dan diberhentikan pada tahun 1947. Ia melanjutkan pendidikan bersama al-Shafi'i, melanjutkan selama sekitar satu tahun lebih, kemudian melemah selama sekitar dua bulan hingga meninggal dunia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17713} Di awal terjemahan, tertulis dua tanggal: \"849\" dan \"788\" Hijriah, tetapi keduanya tidak menunjukkan tanggal kematian, sehingga tidak ada tanggal yang disebutkan di sini. Buku ini tidak menyebutkan sumber terjemahan ini."
