summary:
  ar: "داعية ومدرّس ماليزي، وُلد في باسير ماس بكلنتن في 29 ديسمبر 1976، اشتهر بمحاضراته في علم آخر الزمان والأخرويات منذ سنة 2004، ويدرّس في مدرسة حكومية في بينانغ. بلغت صفحته الرسمية على فيسبوك 159,948 متابعًا وملفه المهني 358,122 متابعًا في 15 نوفمبر 2026؛ وليس له قناة رسمية على يوتيوب، فالقناة التي تحمل محاضراته مجمّع تابع لجهة أخرى."
  en: "Malaysian preacher and schoolteacher, born in Pasir Mas, Kelantan, on 29 December 1976, known for his lectures on Islamic eschatology since 2004 and for teaching at a government school in Penang. His official Facebook page counted 159,948 followers and his professional profile 358,122 followers on 15 November 2026; he has no official YouTube channel, and the channel carrying his lectures is a third-party aggregator."
  ur: "ملائیشیائی مبلغ اور اسکول استاد، جو 29 دسمبر 1976ء کو کلنتن کے پاسیر ماس میں پیدا ہوا، 2004ء سے علمِ آخر الزمان پر اپنے دروس کے لیے مشہور ہے اور پینانگ کے ایک سرکاری اسکول میں پڑھاتا ہے۔ 15 نومبر 2026ء کو اس کے سرکاری فیس بک صفحے کے 159,948 اور پیشہ ورانہ پروفائل کے 358,122 فالوور تھے؛ اس کا کوئی سرکاری یوٹیوب چینل نہیں، اس کے دروس اٹھانے والا چینل کسی اور کا مجمّع ہے۔"
  es: "Predicador y maestro malasio, nacido en Pasir Mas, Kelantan, el 29 de diciembre de 1976, conocido por sus conferencias sobre escatología islámica desde 2004 y por impartir clases en una escuela pública de Penang. Su página oficial de Facebook contaba con 159.948 seguidores y su perfil profesional con 358.122 seguidores el 15 de noviembre de 2026; no tiene canal oficial de YouTube, y el canal que transmite sus conferencias es un agregador externo."
  fr: "Prédicateur et enseignant malaisien, né à Pasir Mas, dans l'État de Kelantan, le 29 décembre 1976, il est connu pour ses conférences sur l'eschatologie islamique depuis 2004 et pour son enseignement dans une école publique de Penang. Sa page Facebook officielle comptait 159 948 abonnés et son profil professionnel 358 122 au 15 novembre 2026. Il ne possède pas de chaîne YouTube officielle; ses conférences sont diffusées par un agrégateur tiers."
  tr: "Malezyalı bir vaiz ve öğretmen, 29 Aralık 1976'da Basir Mas, Clinton'da doğdu; 2004'ten beri ahiret bilimi ve eskatoloji üzerine verdiği derslerle ünlendi ve Penang'da bir devlet okulunda ders veriyor. Resmi Facebook sayfası 159.948 takipçiye ulaştı ve profesyonel profili 15 Kasım 2026 itibarıyla 358.122 takipçiye sahipti; resmi bir YouTube kanalı yok, çünkü konferanslarını barındıran kanal başka bir kuruluşla bağlantılı."
  id: "Seorang pengkhotbah dan guru asal Malaysia, lahir di Basir Mas, Clinton pada 29 Desember 1976, ia menjadi terkenal karena kuliahnya tentang ilmu kehidupan setelah mati dan eskatologi sejak 2004, dan ia mengajar di sekolah negeri di Penang. Halaman Facebook resminya mencapai 159.948 pengikut, dan profil profesionalnya memiliki 358.122 pengikut per 15 November 2026; ia tidak memiliki saluran YouTube resmi, karena saluran yang menjadi tuan rumah kuliahnya berafiliasi dengan organisasi lain."
