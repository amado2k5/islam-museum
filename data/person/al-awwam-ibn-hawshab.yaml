summary:
  ar: "العوام بن حوشب بن يزيد بن الحارث، أبو عيسى الشيباني الربعي الواسطي، كان ثقة صاحب سنة ثبتاً صالحاً، روى عن إبراهيم بن عبد الرحمن السكسكي وإبراهيم النخعي ومجاهد وغيرهم، وروى عنه ابنه سلمة وشعبة ويزيد بن هارون ومحمد بن يزيد وغيرهم. قال أحمد: ثقة ثقة، وقال ابن معين وأبو زرعة والعجلي: ثقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13760}. وتاريخ وفاته في الكتاب (؟-147 ه)."
  en: "Al-Awwam ibn Hawshab ibn Yazid ibn al-Harith, Abu Isa al-Shaybani al-Rab'i al-Wasiti, a trustworthy man of the Sunna, firm and righteous. He narrated from Ibrahim ibn Abd al-Rahman al-Sakasiki, Ibrahim al-Nakha'i, Mujahid and others; his son Salama, Shu'ba, Yazid ibn Harun and Muhammad ibn Yazid narrated from him. Ahmad said he is trustworthy, twice; Ibn Ma'in, Abu Zur'a and al-Ijli also called him trustworthy {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13760}. The book gives his death as 147 AH."
  ur: "عوام بن حوشب بن یزید بن حارث، ابو عیسیٰ شیبانی ربعی واسطی، ثقہ، سنت کے پابند، پختہ اور نیک۔ انہوں نے ابراہیم بن عبدالرحمن سکسکی، ابراہیم نخعی، مجاہد وغیرہم سے روایت کی، اور ان سے ان کے بیٹے سلمہ، شعبہ، یزید بن ہارون اور محمد بن یزید نے روایت کی۔ احمد نے انہیں ثقہ ثقہ کہا، اور ابن معین، ابو زرعہ اور عجلی نے ثقہ کہا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13760}۔ کتاب ان کی وفات 147 ہجری بتاتی ہے۔"
