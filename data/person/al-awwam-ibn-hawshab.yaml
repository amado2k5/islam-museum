summary:
  ar: "العوام بن حوشب بن يزيد بن الحارث، أبو عيسى الشيباني الربعي الواسطي، كان ثقة صاحب سنة ثبتاً صالحاً، روى عن إبراهيم بن عبد الرحمن السكسكي وإبراهيم النخعي ومجاهد وغيرهم، وروى عنه ابنه سلمة وشعبة ويزيد بن هارون ومحمد بن يزيد وغيرهم. قال أحمد: ثقة ثقة، وقال ابن معين وأبو زرعة والعجلي: ثقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13760}. وتاريخ وفاته في الكتاب ⁦(؟-147 ه)⁩."
  en: "Al-Awwam ibn Hawshab ibn Yazid ibn al-Harith, Abu Isa al-Shaybani al-Rab'i al-Wasiti, a trustworthy man of the Sunna, firm and righteous. He narrated from Ibrahim ibn Abd al-Rahman al-Sakasiki, Ibrahim al-Nakha'i, Mujahid and others; his son Salama, Shu'ba, Yazid ibn Harun and Muhammad ibn Yazid narrated from him. Ahmad said he is trustworthy, twice; Ibn Ma'in, Abu Zur'a and al-Ijli also called him trustworthy {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13760}. The book gives his death as 147 AH."
  fr: "Al-Awwam ibn Hawshab ibn Yazid ibn al-Harith, Abu Isa al-Shaybani al-Rab’i al-Wasiti, homme de la sunna digne de confiance, ferme et vertueux. Il rapporta d’Ibrahim ibn Abd al-Rahman al-Sakasiki, d’Ibrahim al-Nakha’i, de Mujahid et d’autres ; son fils Salama, Shu’ba, Yazid ibn Harun et Muhammad ibn Yazid rapportèrent d’après lui. Ahmad le déclara digne de confiance à deux reprises ; Ibn Ma’in, Abu Zur’a et al-Ijli le jugèrent aussi digne de confiance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13760}. Le livre situe sa mort en 147 H."
  ur: "عوام بن حوشب بن یزید بن حارث، ابو عیسیٰ شیبانی ربعی واسطی، ثقہ، سنت کے پابند، پختہ اور نیک۔ انہوں نے ابراہیم بن عبدالرحمن سکسکی، ابراہیم نخعی، مجاہد وغیرہم سے روایت کی، اور ان سے ان کے بیٹے سلمہ، شعبہ، یزید بن ہارون اور محمد بن یزید نے روایت کی۔ احمد نے انہیں ثقہ ثقہ کہا، اور ابن معین، ابو زرعہ اور عجلی نے ثقہ کہا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13760}۔ کتاب ان کی وفات 147 ہجری بتاتی ہے۔"
  es: "Al-Awwam ibn Hawshab ibn Yazid ibn al-Harith, Abu Isa al-Shaybani al-Rab'i al-Wasiti, fue un hombre de confianza, firme y justo, seguidor de la Sunnah. Narró de Ibrahim ibn Abd al-Rahman al-Sakasiki, Ibrahim al-Nakha'i, Mujahid y otros; su hijo Salama, Shu'ba, Yazid ibn Harun y Muhammad ibn Yazid narraron de él. Ahmad lo consideró digno de confianza en dos ocasiones; Ibn Ma'in, Abu Zur'a y al-Ijli también lo calificaron de digno de confianza. El libro indica que falleció en el año 147 de la Hégira."
  tr: "El-Awwam ibn Hawshab ibn Yazid ibn al-Harith, Ebu İsa el-Şeybani el-Rabi’i el-Vasiti, Sünnetin güvenilir, dürüst ve salih bir takipçisiydi. İbrahim ibn Abd al-Rahman al-Saksaki, İbrahim al-Nakha’i, Mücahid ve diğerlerinden rivayet etmiştir. Oğlu Seleme, Şube, Yazid ibn Harun, Muhammed ibn Yazid ve diğerleri ondan rivayet etmişlerdir. Ahmed şöyle demiştir: “Güvenilir, güvenilir.” İbn Ma’in, Ebu Zur’a ve el-İcli de “Güvenilir” demişlerdir. Ölüm tarihi kitapta (?-147 Hicri) belirtilmiştir."
  id: "Al-Awwam ibn Hawshab ibn Yazid ibn al-Harith, Abu Isa al-Shaybani al-Rabi’i al-Wasiti, adalah seorang pengikut Sunnah yang terpercaya, dapat diandalkan, dan saleh. Beliau meriwayatkan dari Ibrahim ibn Abd al-Rahman al-Saksaki, Ibrahim al-Nakha’i, Mujahid, dan lainnya. Putranya Salamah, Shu’bah, Yazid ibn Harun, Muhammad ibn Yazid, dan lainnya juga meriwayatkan darinya. Ahmad berkata: “Terpercaya, terpercaya.” Ibn Ma’in, Abu Zur’ah, dan al-‘Ijli juga berkata: “Terpercaya.” Tanggal kematiannya disebutkan dalam kitab (?-147 H)."
