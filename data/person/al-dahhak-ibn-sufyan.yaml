roles: [companion]
summary:
  en: "A companion of Banu Kilab appointed sadaqa collector over his people in 9 AH; when a clan of them refused the call to Islam and fought, he led the expedition that routed them in Rabi' al-Awwal of that year."
  fr: "Compagnon des Banu Kilab nommé collecteur de la sadaqa auprès des siens en 9 H ; lorsqu’un de leurs clans refusa l’appel à l’islam et combattit, il dirigea l’expédition qui les mit en déroute en rabi’ al-awwal de cette année."
  ar: "صحابي من بني كلاب؛ ولّاه النبي الصدقة على قومه سنة 9هـ، ولما أبوا الإجابة للإسلام وقاتلوا أمره على سرية إليهم في ربيع الأول سنة 9هـ فهزمهم."
  ur: "بنو کلاب کے صحابی جنہیں 9 ہجری میں اپنے قوم پر صدقہ جمع کرنے والا بنایا گیا؛ جب ایک قبیلے نے اسلام سے انکار کیا اور لڑا، انہوں نے مہم کی قیادت کی۔"
  es: "Un compañero de Banu Kilab fue nombrado recaudador de sadaqa sobre su pueblo en el año 9 de la Hégira; cuando un clan de ellos rechazó el llamado al Islam y luchó, él dirigió la expedición que los derrotó en Rabi' al-Awwal de ese año."
  tr: "Beni Kilab kabilesinden bir sahabe; Peygamberimiz onu Hicri 9. yılda halkından zekât toplamakla görevlendirdi. Onlar İslam'ı kabul etmeyi reddedip savaşmaya başlayınca, Peygamberimiz ona Hicri 9. yılın Rebiü'l-Evvel ayında onlara karşı bir baskın düzenlemesini emretti ve onları yenilgiye uğrattı."
  id: "Seorang sahabat dari suku Banu Kilab; Nabi menunjuknya untuk mengumpulkan sedekah dari kaumnya pada tahun 9 Hijriah. Ketika mereka menolak untuk memeluk Islam dan berperang, beliau memerintahkannya untuk memimpin penyerangan terhadap mereka pada bulan Rabi' al-Awwal tahun 9 Hijriah, dan dia mengalahkan mereka."
