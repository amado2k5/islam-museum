summary:
  ar: "معمارية عراقية بريطانية، وُلدت في بغداد سنة 1950 وتوفيت سنة 2016، أسست مكتب «زها حديد للعمارة» في لندن وصممت مباني في أنحاء العالم بخطوطها المنحنية المميزة، وكانت أول امرأة تنال جائزة بريتزكر للعمارة سنة 2004، ولُقّبت «ملكة المنحنيات»."
  en: "Iraqi-British architect, born in Baghdad in 1950 and died in 2016, who founded Zaha Hadid Architects in London and designed buildings around the world in her signature curving forms. She was the first woman to receive the Pritzker Architecture Prize, in 2004, and was known as the 'Queen of Curves'."
  ur: "عراقی نژاد برطانوی معمار، جو 1950 میں بغداد میں پیدا ہوئیں اور 2016 میں وفات پائیں، جنہوں نے لندن میں «زہا حدید آرکیٹیکٹس» قائم کیا اور اپنی مخصوص خمیدہ صورتوں میں دنیا بھر میں عمارتیں ڈیزائن کیں۔ وہ 2004 میں پرٹزکر آرکیٹیکچر پرائز پانے والی پہلی خاتون تھیں اور «خموں کی ملکہ» کہلائیں۔"
