summary:
  ar: "أبو السعادات هبة الله بن علي المتوفى سنة ٥٧٢هـ؛ أماليه في خمسة فنون من الأدب في ثماني مجلدات {cite:kashf-zunun-furqan p. 597}."
  en: "Abu al-Sa'adat Hibatullah ibn Ali Ibn al-Shajari, d. AH 572 — his Amali spans eight volumes in five branches of adab {cite:kashf-zunun-furqan p. 597}."
  es: "Abu al-Sa'adat Hibatullah ibn Ali Ibn al-Shajari, m. 572 H.H.: su Amali abarca ocho volúmenes en cinco ramas del adab {citar:kashf-zunun-furqan p. 597}."
  fr: "Abu al-Sa'adat Hibatullah ibn Ali Ibn al-Shajari, d. AH 572 — son Amali s'étend sur huit volumes répartis en cinq branches d'adab {cite:kashf-zunun-furqan p. 597}."
  ur: "ابو السعادت ہیبت اللہ ابن علی ابن الشجری، د. 572ھ - ان کی امالی ادب کی پانچ شاخوں میں آٹھ جلدوں پر محیط ہے۔ 597}۔"
  tr: "572 Hicri'de vefat eden Ebu el-Seyat Hibat Allah ibn Ali; beş edebi sanat üzerine sekiz ciltlik eserleri {kaynak:kaşf-zunun-furqan, s. 597}."
  id: "Abu al-Sa'adat Hibat Allah ibn Ali, yang wafat pada tahun 572 H; karyanya tentang lima seni sastra dalam delapan jilid {cite:kashf-zunun-furqan, hlm. 597}."
