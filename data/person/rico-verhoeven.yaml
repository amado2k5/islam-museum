summary:
  ar: "كيك بوكسر هولندي وملاكم محترف وُلد في بيرغن أوب زوم سنة 1989. كان أطول أبطال غلوري للوزن الثقيل بقاءً على العرش، إذ احتفظ باللقب 4220 يومًا ودافع عنه 13 مرة، وهو رقم قياسي. وفي سنة 2026 نازل أولكسندر أوسيك على لقب المجلس العالمي للملاكمة للوزن الثقيل في مصر فخسر بالضربة الفنية القاضية."
  en: "Dutch kickboxer, professional boxer and mixed martial artist born in Bergen op Zoom in 1989. He was Glory's longest-reigning heavyweight champion, holding the title for 4,220 days with a record thirteen defences. In 2026 he challenged Oleksandr Usyk for the WBC heavyweight boxing title in Egypt and lost by technical knockout."
  ur: "ڈچ کک باکسر، پیشہ ور باکسر اور مکسڈ مارشل آرٹسٹ، 1989 میں بیرگن اوپ زوم میں پیدا ہوئے۔ وہ گلوری کے سب سے طویل عرصے تک حکمران رہنے والے ہیوی ویٹ چیمپئن تھے، جنہوں نے 4220 دن ٹائٹل برقرار رکھا اور ریکارڈ تیرہ بار اس کا دفاع کیا۔ 2026 میں انہوں نے مصر میں اولیکسینڈر اوسیک سے ڈبلیو بی سی ہیوی ویٹ باکسنگ ٹائٹل کے لیے مقابلہ کیا اور ٹیکنیکل ناک آؤٹ سے ہار گئے۔"
