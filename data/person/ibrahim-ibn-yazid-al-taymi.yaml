summary:
  ar: "إبراهيم بن يزيد بن شريك التيمي، أبو أسماء، الكوفي، تابعي. روى عن أنس بن مالك والحارث بن سويد وعبد الرحمن بن أبي ليلى وأبيه يزيد بن شريك. روى عنه أبو بشر الأحمسي والحسن بن عبيد الله النخعي والحكم بن عتيبة وغيرهم، وروى له الجماعة. قال أبو داود إنه مات ولم يبلغ الأربعين، وقال غيره إنه مات سنة اثنتين وتسعين للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17452}"
  en: "Ibrahim ibn Yazid ibn Sharik al-Taymi, Abu Asma, of Kufa, a Successor. He transmitted from Anas ibn Malik, al-Harith ibn Suwayd, Abd al-Rahman ibn Abi Layla and his father Yazid ibn Sharik. Abu Bishr al-Ahmasi, al-Hasan ibn Ubayd Allah al-Nakha'i and al-Hakam ibn Utayba, among others, transmitted from him, and the compilers of the canonical books (al-jama'a) included his reports. Abu Dawud says he died before forty; another authority says he died in the year 92 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17452}"
