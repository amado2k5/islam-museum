summary:
  ar: "إبراهيم بن يزيد بن شريك التيمي، أبو أسماء، الكوفي، تابعي. روى عن أنس بن مالك والحارث بن سويد وعبد الرحمن بن أبي ليلى وأبيه يزيد بن شريك. روى عنه أبو بشر الأحمسي والحسن بن عبيد الله النخعي والحكم بن عتيبة وغيرهم، وروى له الجماعة. قال أبو داود إنه مات ولم يبلغ الأربعين، وقال غيره إنه مات سنة اثنتين وتسعين للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17452}"
  en: "Ibrahim ibn Yazid ibn Sharik al-Taymi, Abu Asma, of Kufa, a Successor. He transmitted from Anas ibn Malik, al-Harith ibn Suwayd, Abd al-Rahman ibn Abi Layla and his father Yazid ibn Sharik. Abu Bishr al-Ahmasi, al-Hasan ibn Ubayd Allah al-Nakha'i and al-Hakam ibn Utayba, among others, transmitted from him, and the compilers of the canonical books (al-jama'a) included his reports. Abu Dawud says he died before forty; another authority says he died in the year 92 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17452}"
  es: "Ibrahim ibn Yazid ibn Sharik al-Taymi, Abu Asma, de Kufa, fue un Sucesor. Transmitió de Anas ibn Malik, al-Harith ibn Suwayd, Abd al-Rahman ibn Abi Layla y su padre Yazid ibn Sharik. Abu Bishr al-Ahmasi, al-Hasan ibn Ubayd Allah al-Nakha'i y al-Hakam ibn Utayba, entre otros, transmitieron de él, y los compiladores de los libros canónicos (al-jama'a) incluyeron sus relatos. Abu Dawud afirma que murió antes de los cuarenta años; otra autoridad dice que murió en el año 92 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17452}"
  fr: "Ibrahim ibn Yazid ibn Sharik al-Taymi, dit Abu Asma, de Koufa, était un successeur. Il a transmis le savoir d'Anas ibn Malik, d'al-Harith ibn Suwayd, d'Abd al-Rahman ibn Abi Layla et de son père, Yazid ibn Sharik. Abu Bishr al-Ahmasi, al-Hasan ibn Ubayd Allah al-Nakha'i et al-Hakam ibn Utayba, entre autres, ont également transmis ses enseignements, et les compilateurs des recueils canoniques (al-jama'a) ont inclus ses hadiths. Abu Dawud rapporte qu'il est mort avant l'âge de quarante ans; une autre source situe sa mort en l'an 92 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17452}"
  ur: "ابراہیم بن یزید بن شریک التیمی، ابو اسماء، کوفہ، ایک جانشین۔ انہوں نے انس بن مالک، حارث بن سوید، عبدالرحمٰن بن ابی لیلیٰ اور اپنے والد یزید بن شریک سے روایت کی ہے۔ ابو بشر الاحماسی، الحسن بن عبید اللہ النخعی اور الحکم بن عتیبہ وغیرہ نے ان سے نقل کیا ہے، اور ثقہ کتب ⁦(الجماعۃ)⁩ کے مرتب کرنے والوں نے ان کی رپورٹیں شامل کی ہیں۔ ابوداؤد کہتے ہیں کہ وہ چالیس سال سے پہلے فوت ہو گئے۔ ایک اور سند کا کہنا ہے کہ ان کی وفات سنہ 92 ہجری میں ہوئی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص17452}"
