  ar: "محاضر ومعلّق إيراني من طهران، مؤسس مؤسسة مصاف سنة 2011 ورئيسها، اشتهر بمحاضراته الجامعية في المهدوية وآخر الزمان والأديان والفرق ونظريات المؤامرة، وهو الأمين العام لجبهة صباح إيران؛ بلغت صفحته الرسمية على إنستغرام 1,002,269 متابعًا في نوفمبر 2026 بحسب قراءة على المنصة نفسها."
  en: "Iranian lecturer and commentator from Tehran, founder and head of the Masaf Institute since 2011, known for university lectures on Mahdism, the end of time, religions and sects and conspiracy theories, and secretary-general of the Sobh-e Iran (Morning of Iran) Front; his official Instagram page counted 1,002,269 followers in November 2026 per an on-platform profile read."
  ur: "تہران سے تعلق رکھنے والے ایرانی خطیب و مبصر، 2011ء سے مؤسسہ مصاف کے بانی و سربراہ، مہدویت، آخر زمان، ادیان و فرقوں اور سازشی نظریات پر جامعات میں لیکچروں کے لیے مشہور، اور جبہہ صبح ایران کے سیکرٹری جنرل؛ نومبر 2026ء میں پلیٹ فارم پر پڑھے گئے اعداد کے مطابق ان کے سرکاری انسٹاگرام صفحے کے فالوور 1,002,269 تھے۔"
