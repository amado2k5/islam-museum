roles: [scholar]
gender: male
summary:
  ar: "عبد الله بن أبي طلحة زيد بن سهل الأنصاري، أخو أنس بن مالك لأمه، ولد بعد غزوة حنين وحنكه النبي بتمرة، وأقام بالمدينة وكان قليل الحديث يروي عن أبيه وأخيه أنس، واختلف في موته فقيل استشهد بفارس وقيل مات بالمدينة سنة 84 هـ {cite:isaba-bajawi-jil-1992 vol. 5 p. 15}."
  en: "Abd Allah ibn Abi Talha Zayd ibn Sahl al-Ansari, maternal brother of Anas ibn Malik, born after the battle of Hunayn and given the first taste of a date by the Prophet; he lived in Medina, transmitted little hadith from his father and from Anas, and his death is reported both as martyrdom in Fars and as a death in Medina in 84 AH {cite:isaba-bajawi-jil-1992 vol. 5 p. 15}."
  fr: "Abd Allah ibn Abi Talha Zayd ibn Sahl al-Ansari, frère utérin d'Anas ibn Malik, né après la bataille de Hunayn et à qui le Prophète donna le premier goût d'une datte ; il vécut à Médine, transmit peu de hadiths de son père et d'Anas, et sa mort est rapportée à la fois comme un martyre au Fars et comme une mort à Médine en 84 H {cite:isaba-bajawi-jil-1992 vol. 5 p. 15}."
  es: "Abd Allah ibn Abi Talha Zayd ibn Sahl al-Ansari, hermano materno de Anas ibn Malik, nació después de la batalla de Hunayn y el Profeta le dio a probar un dátil por primera vez; vivió en Medina, transmitió pocos hadices de su padre y de Anas, y su muerte se reporta tanto como martirio en Fars como muerte en Medina en el año 84 AH {cite:isaba-bajawi-jil-1992 vol. 5 p. 15}."
  ur: "عبد اللہ بن ابی طلحہ زید بن سہل الانصاری، انس بن مالک کے ماموں بھائی، جنگ حنین کے بعد پیدا ہوئے اور نبی کو پہلی کھجور کا ذائقہ چکھایا۔ وہ مدینہ میں رہتے تھے، انہوں نے اپنے والد اور انس سے بہت کم حدیثیں نقل کی ہیں، اور ان کی وفات فارس میں شہادت اور 84 ہجری میں مدینہ میں وفات کے طور پر منقول ہے۔ 5ص 15}۔"
  tr: "Enes ibn Malik'in anne tarafından kardeşi Abdullah ibn Abi Talha Zayd ibn Sahl al-Ansari, Huneyn Savaşı'ndan sonra doğmuştur ve Peygamberimiz onun için hurma ile tahnik yapmıştır. Medine'de yaşamış ve babası ile kardeşi Enes'ten rivayet ettiği az sayıda hadisi bulunmaktadır. Ölümü hakkında ihtilaf vardır; İran'da şehit edildiği söylenirken, Hicri 84 yılında Medine'de öldüğü de söylenmektedir. {cite:isaba-bajawi-jil-1992 vol. 5 p. 15}"
  id: "Abdullah ibn Abi Talha Zayd ibn Sahl al-Ansari, saudara laki-laki dari pihak ibu Anas ibn Malik, lahir setelah Perang Hunayn dan Nabi Muhammad SAW melakukan tahnik untuknya dengan kurma. Ia tinggal di Madinah dan memiliki sedikit hadits, yang diriwayatkan dari ayahnya dan saudaranya Anas. Terdapat perbedaan pendapat tentang kematiannya; ada yang mengatakan bahwa ia syahid di Persia, dan ada pula yang mengatakan bahwa ia meninggal di Madinah pada tahun 84 Hijriah. {cite:isaba-bajawi-jil-1992 vol. 5 p. 15}."
