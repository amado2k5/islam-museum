summary:
  ar: "أبو علي ابن خيران، مات سنة عشرين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 58}. عُرض عليه القضاء فلم يتقلده، وكان بعض وزراء المقتدر، والشيرازي يظن أنه أبو الحسن علي بن عيسى الوزير، وكّل بداره ليتقلد القضاء فلم يتقلد {cite:tabaqat-fuqaha-abbas-1981 p. 58}. وكان أبو الطيب الطبري يروي أنه عاتب القاضي أبا العباس بن سريج على ولاية القضاء، وقال إن هذا الأمر لم يكن في أصحابنا {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
