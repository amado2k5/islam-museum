summary:
  ar: "أبو علي ابن خيران، مات سنة عشرين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 58}. عُرض عليه القضاء فلم يتقلده، وكان بعض وزراء المقتدر، والشيرازي يظن أنه أبو الحسن علي بن عيسى الوزير، وكّل بداره ليتقلد القضاء فلم يتقلد {cite:tabaqat-fuqaha-abbas-1981 p. 58}. وكان أبو الطيب الطبري يروي أنه عاتب القاضي أبا العباس بن سريج على ولاية القضاء، وقال إن هذا الأمر لم يكن في أصحابنا {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
  en: "Abu Ali Ibn Khayran died in 320 {cite:tabaqat-fuqaha-abbas-1981 p. 58}. The qadi-ship was offered to him and he did not accept it. One of the viziers of al-Muqtadir, whom al-Shirazi supposes to be Abu al-Hasan Ali ibn Isa the vizier, posted men at his house to make him take up the office, but he did not take it up {cite:tabaqat-fuqaha-abbas-1981 p. 58}. Abu al-Tayyib al-Tabari used to relate that he reproached the qadi Abu al-Abbas Ibn Surayj for accepting the qadi-ship, and said that this matter had not been among our companions {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
  fr: "Abu Ali Ibn Khayran mourut en 320 {cite:tabaqat-fuqaha-abbas-1981 p. 58}. La charge de cadi lui fut offerte et il ne l'accepta pas. L'un des vizirs d'al-Muqtadir, qu'al-Shirazi suppose être le vizir Abu al-Hasan Ali ibn Isa, posta des hommes à sa maison pour lui faire prendre la charge, mais il ne la prit pas {cite:tabaqat-fuqaha-abbas-1981 p. 58}. Abu al-Tayyib al-Tabari rapportait qu'il reprocha au cadi Abu al-Abbas Ibn Surayj d'avoir accepté la charge de cadi, et dit que cette affaire n'avait pas cours parmi nos compagnons {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
  es: "Abu Ali Ibn Khayran murió en el año 320 {cite:tabaqat-fuqaha-abbas-1981 p. 58}. Se le ofreció el cargo de cadí, pero no lo aceptó. Uno de los visires de al-Muqtadir, a quien al-Shirazi supone que era Abu al-Hasan Ali ibn Isa, el visir, envió hombres a su casa para que aceptara el cargo, pero no lo hizo {cite:tabaqat-fuqaha-abbas-1981 p. 58}. Abu al-Tayyib al-Tabari solía contar que reprochó al cadí Abu al-Abbas Ibn Surayj por aceptar el cargo, y dijo que este asunto no había sido tratado entre nuestros compañeros {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
  ur: "ابو علی ابن خیران کی وفات 320ھ میں ہوئی۔ 58}۔ اسے قادیانی جہاز پیش کیا گیا اور اس نے قبول نہیں کیا۔ المقتدیر کے وزیروں میں سے ایک، جسے الشیرازی ابو الحسن علی ابن عیسیٰ وزیر سمجھتا ہے، نے اپنے گھر پر آدمیوں کو تعینات کیا تاکہ وہ اسے دفتر سنبھالیں، لیکن اس نے اسے نہیں اٹھایا۔ 58}۔ ابو الطیب الطبری بیان کرتے تھے کہ انہوں نے قاضی ابو العباس ابن سریج کو قادیانی قبول کرنے پر ملامت کی اور کہا کہ یہ معاملہ ہمارے اصحاب میں نہیں تھا۔ 58}۔"
  tr: "Ebu Ali ibn Hayran, Hicri 320 yılında vefat etti (1981, s. 58). Kendisine kadılık görevi teklif edildi ancak reddetti. El-Muktadir'in bazı bakanları, aralarında El-Şirazi'nin de bulunduğu kişiler, onu bakan Ebu el-Hasan Ali ibn İsa sandılar ve kadılık görevini üstlenmesi için onu kendi ikametgahına gönderdiler, ancak o bunu reddetti. Ebu el-Tayyib el-Taberi, onun kadı Ebu el-Abbas ibn Surayj'ı kadılığı kabul ettiği için eleştirdiğini ve bu uygulamanın alimleri arasında yaygın olmadığını söylediğini rivayet etmiştir."
  id: "Abu Ali ibn Khayran wafat pada tahun 320 H (1981 hlm. 58). Ia ditawari jabatan hakim tetapi menolaknya. Beberapa menteri al-Muqtadir, termasuk al-Shirazi, mengira ia adalah Abu al-Hasan Ali ibn Isa, sang menteri, dan menunjuknya ke kediamannya untuk mengambil alih jabatan hakim, tetapi ia menolak. Abu al-Tayyib al-Tabari meriwayatkan bahwa ia mengkritik Hakim Abu al-Abbas ibn Surayj karena menerima jabatan hakim, dengan mengatakan bahwa praktik ini tidak umum di kalangan ulama mereka."
