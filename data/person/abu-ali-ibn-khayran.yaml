summary:
  ar: "أبو علي ابن خيران، مات سنة عشرين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 58}. عُرض عليه القضاء فلم يتقلده، وكان بعض وزراء المقتدر، والشيرازي يظن أنه أبو الحسن علي بن عيسى الوزير، وكّل بداره ليتقلد القضاء فلم يتقلد {cite:tabaqat-fuqaha-abbas-1981 p. 58}. وكان أبو الطيب الطبري يروي أنه عاتب القاضي أبا العباس بن سريج على ولاية القضاء، وقال إن هذا الأمر لم يكن في أصحابنا {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
  en: "Abu Ali Ibn Khayran died in 320 {cite:tabaqat-fuqaha-abbas-1981 p. 58}. The qadi-ship was offered to him and he did not accept it. One of the viziers of al-Muqtadir, whom al-Shirazi supposes to be Abu al-Hasan Ali ibn Isa the vizier, posted men at his house to make him take up the office, but he did not take it up {cite:tabaqat-fuqaha-abbas-1981 p. 58}. Abu al-Tayyib al-Tabari used to relate that he reproached the qadi Abu al-Abbas Ibn Surayj for accepting the qadi-ship, and said that this matter had not been among our companions {cite:tabaqat-fuqaha-abbas-1981 p. 58}."
