summary:
  ar: "سياسي هولندي من أصل مغربي، وُلد سنة 1961 بإقليم الناظور. عُيّن عمدة لروتردام سنة 2009 فكان أوّل مسلم يتولّى عمودية مدينة أوروبية كبرى، وشغل قبلها منصب وكيل وزارة الشؤون الاجتماعية والتشغيل، وفاز بجائزة عمدة العالم سنة 2021."
  en: "Dutch politician of Moroccan origin, born in 1961 in the Nador region. Appointed mayor of Rotterdam in 2009 — the first Muslim to lead a major European city — he earlier served as State Secretary for Social Affairs and Employment and won the 2021 World Mayor Prize."
  ur: "مراکشی نژاد ڈچ سیاست دان، 1961ء میں علاقۂ ناظور میں پیدا ہوئے۔ 2009ء میں راٹرڈیم کے میئر مقرر ہوئے تو وہ کسی بڑی یورپی شہر کے سربراہ بننے والے پہلے مسلمان قرار پائے؛ اس سے قبل وزارتِ سماجی امور و ملازمت میں وزیرِ مملکت رہے اور 2021ء میں ورلڈ میئر پرائز جیتا۔"
  es: "Político neerlandés de origen marroquí, nacido en 1961 en la región de Nador. Nombrado alcalde de Rotterdam en 2009 —el primer musulmán en dirigir una gran ciudad europea—, anteriormente fue Secretario de Estado de Asuntos Sociales y Empleo y ganó el Premio Mundial al Alcalde en 2021."
  fr: "Homme politique néerlandais d'origine marocaine, né en 1961 dans la région de Nador. Nommé maire de Rotterdam en 2009 – le premier musulman à diriger une grande ville européenne –, il a auparavant occupé le poste de secrétaire d'État aux Affaires sociales et à l'Emploi et a remporté le prix mondial des maires en 2021."
  tr: "Fas kökenli Hollandalı bir siyasetçi olan John S. Rotterdam, 1961 yılında Nador bölgesinde doğdu. 2009 yılında Rotterdam belediye başkanı olarak atandı ve büyük bir Avrupa şehrinin belediye başkanlığını üstlenen ilk Müslüman oldu. Bundan önce Sosyal İşler ve İstihdam Bakanlığı'nda Devlet Sekreteri olarak görev yaptı ve 2021 yılında Dünya Belediye Başkanı Ödülü'nü kazandı."
  id: "Seorang politikus Belanda keturunan Maroko, lahir pada tahun 1961 di wilayah Nador. Ia diangkat sebagai walikota Rotterdam pada tahun 2009, menjadi Muslim pertama yang menjabat sebagai walikota kota besar Eropa. Sebelumnya, ia menjabat sebagai Sekretaris Negara di Kementerian Urusan Sosial dan Ketenagakerjaan, dan memenangkan Penghargaan Walikota Dunia pada tahun 2021."
