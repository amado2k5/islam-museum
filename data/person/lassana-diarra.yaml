summary:
  ar: "لاعب كرة قدم فرنسي معتزل من أصل مالي، وُلد في باريس سنة 1985. لاعب وسط مدافع لعب للوهافر وتشيلسي وأرسنال وبورتسموث وريال مدريد وأنجي ماخاتشكالا ولوكوموتيف موسكو وأولمبيك مرسيليا وباريس سان جيرمان، وخاض 34 مباراة دولية مع منتخب فرنسا بين 2007 و2016 قبل اعتزاله سنة 2019."
  en: "French retired footballer of Malian descent, born in Paris in 1985. A defensive midfielder who played for Le Havre, Chelsea, Arsenal, Portsmouth, Real Madrid, Anzhi Makhachkala, Lokomotiv Moscow, Olympique de Marseille and Paris Saint-Germain, he won 34 caps for France between 2007 and 2016 before retiring in 2019."
  ur: "مالی نژاد فرانسیسی ریٹائرڈ فٹبالر، 1985 میں پیرس میں پیدا ہوئے۔ دفاعی مڈفیلڈر جنہوں نے لوہاور، چیلسی، آرسنل، پورٹسماؤت، ریال میڈرڈ، انژی، لوکوموتیو ماسکو، مارسیل اور پیرس سینٹ جرمین کے لیے کھیلا؛ 2007 سے 2016 کے درمیان فرانس کے لیے 34 میچ کھیلے اور 2019 میں ریٹائر ہوئے۔"
