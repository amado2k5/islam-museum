summary:
  ar: "بلال بن أبي بردة؛ فتق نهر معقل في فيض البصرة وكان قبل ذلك مكسوراً يفيض إلى القبة التي كان زياد يعرض فيها الجند واحتفر نهر بلال وجعل عن جنبتيه حوانيت ونقل إليها السوق وجعل ذلك ليزيد بن خالد القسري."
  en: "Bilal ibn Abi Burda; he cut Nahr Ma'qil into Basra's Fayd where it had stood broken, dug the canal named for him, lined both banks with shops, moved the market there — all done for Yazid ibn Khalid al-Qasri."
