summary:
  ar: "عابدة من البصرة، امرأة الزاهد حبيب أبي محمد العجمي؛ يروي ابن الجوزي في «صفة الصفوة» أنها كانت توقظ زوجها في السحر، وقولها حين اشتكت عينها: وجع قلبي أشد من وجع عيني."
  en: "A devout woman of Basra, wife of the ascetic Habib Abu Muhammad al-Ajami; Ibn al-Jawzi's Sifat al-Safwa relates that she woke her husband before dawn, and that when her eye was ailing she said, 'The pain of my heart is worse than the pain of my eye.'"
  ur: "بصرہ کی ایک عابدہ، زاہد حبیب ابو محمد عجمی کی اہلیہ؛ ابن الجوزی کی «صفۃ الصفوہ» کہتی ہے کہ وہ سحر کے وقت شوہر کو جگاتیں، اور آنکھ کی تکلیف میں کہا: «میرے دل کا درد آنکھ کے درد سے زیادہ سخت ہے»۔"
