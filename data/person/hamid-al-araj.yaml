summary:
  ar: "حميد بن قيس الأعرج، أبو صفوان، مولى بني أسد بن عبد العزى، قارئ أهل مكة، تابعي من الثقات المشهورين، روى عن طاووس وعطاء ومجاهد وعمر بن عبد العزيز والزهري وغيرهم، وروى عنه جعفر الصادق ومالك والسفيانان، وروى له الجماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16643} قال سفيان بن عيينة إنه كان أفرض أهل مكة وأحسبهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16643}"
  en: "Hamid ibn Qays al-A'raj, Abu Safwan, a client of the Banu Asad ibn Abd al-Uzza, reader of the people of Mecca, and a well-known trustworthy Successor. He transmitted from Tawus, Ata, Mujahid, Umar ibn Abd al-Aziz and al-Zuhri, and from him Ja'far al-Sadiq, Malik and the two Sufyans. Sufyan ibn Uyayna said he was the most learned in the laws of inheritance and the reckoning among the people of Mecca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16643}"
