summary:
  ar: "بطاقة أولية للفتح بن علي البنداري الأصبهاني، مؤرخ القرن الثالث عشر مترجم ومختصر كتاب ابن القلانسي، توفي سنة ١٢٤٥م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for al-Fath ibn Ali al-Bundari al-Isfahani, the thirteenth-century historian who translated and abridged Ibn al-Qalanisi's chronicle, d. 1245; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar de al-Fath ibn Ali al-Bundari al-Isfahani, el historiador del siglo XIII que tradujo y abrevió la crónica de Ibn al-Qalanisi, fallecido en 1245; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche provisoire d'al-Fath ibn Ali al-Bundari al-Isfahani, l'historien du XIIIe siècle qui a traduit et abrégé la chronique d'Ibn al-Qalanisi, mort en 1245; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "الفتح ابن علی البندری الاصفہانی کے لیے ڈرافٹ کارڈ، تیرہویں صدی کے مورخ جس نے ابن القلانیسی کی تاریخ کا ترجمہ اور اختصار کیا، ڈی۔ 1245; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "13. yüzyıl tarihçisi, İbn Al-Qalanisi'nin kitabının çevirmeni ve özetleyicisi olan ve 1245 yılında vefat eden Al-Fath bin Ali Al-Bandari Al-Isfahani için hazırlanmış ön tanıtım kartı; biyografik sözlüklerde adı geçmektedir ve biyografisi henüz bu sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Al-Fath bin Ali Al-Bandari Al-Isfahani, seorang sejarawan, penerjemah, dan penyusun ringkasan buku Ibn Al-Qalanisi abad ke-13, yang meninggal pada tahun 1245 M; ia disebutkan dalam kamus biografi, dan biografinya belum ditinjau di halaman ini."
