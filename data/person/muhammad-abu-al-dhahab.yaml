summary:
  ar: "محمد بيك أبو الذهب، أمير مملوكي من جماعة القازدغلية، دخل بيت علي بيك الكبير وصار خازنداره وأميراً سنة 1178هـ/1764-5م، ولقب بأبي الذهب لنثره دنانير ذهب عند تعيينه. كان أول أمره قائد علي بيك، ثم خرج عليه سنة 1186هـ/1772م وحكم مصر شيخ بلد، وتوفي في عكا في 8 ربيع الثاني 1189هـ/8 يونيو 1775م خلال حملته على الشيخ ظاهر العمر {cite:encyclopaedia-of-islam-2 vol. 7 p. 472}."
  en: "Muhammad Bey Abu'l-Dhahab was a Mamluk bey of the Kazdughliyya group who entered the household of Ali Bey al-Kabir, became his treasurer, and was raised to the beylicate in 1178/1764-5, taking his nickname from scattering gold coins on his appointment. First Ali Bey's chief lieutenant, he turned on him in 1186/1772, ruled Egypt as shaykh al-balad, and died at Acre on 8 Rabi II 1189/8 June 1775 during his campaign against Shaykh Zahir al-Umar {cite:encyclopaedia-of-islam-2 vol. 7 p. 472}."
  ur: "محمد بیگ ابوالذہب قازدغلیہ گروہ کے مملوک بیگ تھے جو علی بیگ الکبیر کے گھر میں داخل ہوئے، ان کے خازندار بنے اور 1178ھ/1764-5ء میں بیگ کے منصب پر پہنچے، اور تقرری کے وقت سونے کے سکے لٹانے سے ان کا لقب پڑا۔ پہلے علی بیگ کے اصل نائب تھے، پھر 1186ھ/1772ء میں ان کے خلاف اٹھے، مصر میں شیخ البلد بن کر حکومت کی، اور شیخ ظاہر العمر کے خلاف مہم کے دوران 8 ربیع الثانی 1189ھ/8 جون 1775ء کو عکا میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 472}."
  es: "Muhammad Bey Abu'l-Dhahab fue un bey mameluco del grupo Kazdughliyya que entró en la casa de Ali Bey al-Kabir, se convirtió en su tesorero y fue elevado al beylicato en 1178/1764-5, tomando su apodo por esparcir monedas de oro al ser nombrado. Primero lugarteniente principal de Ali Bey, se rebeló contra él en 1186/1772, gobernó Egipto como shaykh al-balad y murió en Acre el 8 de Rabi II de 1189/8 de junio de 1775 durante su campaña contra Shaykh Zahir al-Umar {cite:encyclopaedia-of-islam-2 vol. 7 p. 472}."
  fr: "Muhammad Bey Abu'l-Dhahab était un bey mamelouk de la dynastie Kazdughliyya qui entra au service d'Ali Bey al-Kabir, devint son trésorier et fut élevé au rang de beylicate en 1178/1764-1765. Il reçut son surnom pour avoir répandu des pièces d'or lors de sa nomination. D'abord principal lieutenant d'Ali Bey, il se retourna contre lui en 1186/1772, gouverna l'Égypte sous le nom de cheikh al-balad et mourut à Acre le 8 Rabi II 1189/8 juin 1775 lors de sa campagne contre le cheikh Zahir al-Umar (encyclopédie de l'islam, vol. 7, p. 472)."
  tr: "Muhammed Bey Ebu el-Dahab, Kazdahliya cemaatinden bir Memlük prensiydi; Ali Bey Büyük'ün evine girmiş ve 1178 Hicri / 1764-5 yılında onun hazinedarı ve emiri olmuştur. Atandığında altın dinar saçtığı için Ebu el-Dahab lakabını almıştır. İlk komutanı Kaide Ali Bey'di, ardından 1186 Hicri / 1772 yılında ona karşı isyan etti ve Mısır'ı bir kasabanın şeyhi olarak yönetti. 8 Rabi'al-Thani 1189 Hicri / 8 Haziran 1775'te Şeyh Zahir el-Ömer'e karşı yürüttüğü sefer sırasında Akka'da öldü {atıf:İslam Ansiklopedisi-2 cilt 7 s. 472}."
  id: "Muhammad Bey Abu al-Dhahab adalah seorang pangeran Mamluk dari komunitas Qazdaghliya, yang masuk ke rumah Ali Bey yang Agung dan menjadi bendahara serta emirnya pada tahun 1178 H / 1764-5 M. Ia dijuluki Abu al-Dhahab karena menyebarkan dinar emas saat diangkat. Komandan pertamanya adalah Qaida Ali Bey, kemudian ia memberontak melawannya pada tahun 1186 H / 1772 M dan memerintah Mesir sebagai sheikh sebuah kota. Ia meninggal di Acre pada 8 Rabi' al-Thani 1189 H / 8 Juni 1775 M selama kampanyenya melawan Sheikh Zahir al-Umar {cite:encyclopaedia-of-Islam-2 vol. 7 hlm. 472}."
