summary:
  ar: "محمد بيك أبو الذهب، أمير مملوكي من جماعة القازدغلية، دخل بيت علي بيك الكبير وصار خازنداره وأميراً سنة 1178هـ/1764-5م، ولقب بأبي الذهب لنثره دنانير ذهب عند تعيينه. كان أول أمره قائد علي بيك، ثم خرج عليه سنة 1186هـ/1772م وحكم مصر شيخ بلد، وتوفي في عكا في 8 ربيع الثاني 1189هـ/8 يونيو 1775م خلال حملته على الشيخ ظاهر العمر {cite:encyclopaedia-of-islam-2 vol. 7 p. 472}."
  en: "Muhammad Bey Abu'l-Dhahab was a Mamluk bey of the Kazdughliyya group who entered the household of Ali Bey al-Kabir, became his treasurer, and was raised to the beylicate in 1178/1764-5, taking his nickname from scattering gold coins on his appointment. First Ali Bey's chief lieutenant, he turned on him in 1186/1772, ruled Egypt as shaykh al-balad, and died at Acre on 8 Rabi II 1189/8 June 1775 during his campaign against Shaykh Zahir al-Umar {cite:encyclopaedia-of-islam-2 vol. 7 p. 472}."
  ur: "محمد بیگ ابوالذہب قازدغلیہ گروہ کے مملوک بیگ تھے جو علی بیگ الکبیر کے گھر میں داخل ہوئے، ان کے خازندار بنے اور 1178ھ/1764-5ء میں بیگ کے منصب پر پہنچے، اور تقرری کے وقت سونے کے سکے لٹانے سے ان کا لقب پڑا۔ پہلے علی بیگ کے اصل نائب تھے، پھر 1186ھ/1772ء میں ان کے خلاف اٹھے، مصر میں شیخ البلد بن کر حکومت کی، اور شیخ ظاہر العمر کے خلاف مہم کے دوران 8 ربیع الثانی 1189ھ/8 جون 1775ء کو عکا میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 472}."
