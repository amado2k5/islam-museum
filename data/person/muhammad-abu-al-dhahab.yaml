kids:
  ar: "أبو الذهب أمير مملوكي حكم مصر في القرن الثامن عشر، وسُمّي بهذا الاسم لأنه نثر الذهب يوم صار أميراً."
  en: "Abu'l-Dhahab was a Mamluk leader who ruled Egypt in the 1700s and got his name, which means father of gold, from scattering gold coins when he became a bey."
