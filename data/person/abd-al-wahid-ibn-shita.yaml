summary:
  ar: "أبو الفتح ابن شيطة عبد الواحد بن الحسين بن أحمد، مقرئ العراق ومصنف «التذكار في القراءات العشر»؛ أخذ عن الحمامي وطائفة وحدث عن محمد بن إسماعيل البزاز وجماعة؛ توفي في صفر سنة خمسين وأربعمائة وله ثمانون سنة {cite:shadharat-dhahab p. 293}."
  en: "Abu al-Fath 'Ibn Shita' Abd al-Wahid b. al-Husayn b. Ahmad — muqri' of Iraq and author of *al-Tadhkara fi al-qira'at al-ashr*; died Safar 450 aged eighty {cite:shadharat-dhahab p. 293}."
  fr: "Abu al-Fath « Ibn Shita » Abd al-Wahid b. al-Husayn b. Ahmad — maître de lecture d'Irak et auteur d'*al-Tadhkara fi al-qira'at al-ashr* ; mort en safar 450 à quatre-vingts ans {cite:shadharat-dhahab p. 293}."
  es: "Abu al-Fath 'Ibn Shita' Abd al-Wahid n. al-Husayn b. Ahmad — muqri' de Irak y autor de *al-Tadhkara fi al-qira'at al-ashr*; murió Safar 450 años ochenta años {cita: shadharat-dhahab p. 293}."
  ur: "ابو الفتح ابن شیطہ عبد الواحد ب۔ الحسین بی احمد - عراق کے مقری اور *التذکرہ فی القرعۃ العشر* کے مصنف؛ صفر 450 سال کی عمر میں وفات پائی۔ 293}۔"
  tr: "Irak'ın Kur'an okuyucusu ve \"el-Tadhkar fi al-Qira'at al-'Ashr\" adlı eserin yazarı Ebu el-Fath İbn Şita Abd el-Vahid İbn el-Hüseyn İbn Ahmed; el-Hamami ve bir grup insandan öğrenmiş, Muhammed İbn İsmail el-Bazzaz ve bir grup insandan rivayet etmiştir; Hicri 450 yılının Safer ayında seksen yaşında vefat etmiştir. {Kaynak: Shadharat-dhahab s. 293}"
  id: "Abu al-Fath Ibn Shita Abd al-Wahid Ibn al-Husayn Ibn Ahmad, qari Irak dan penulis “al-Tadhkar fi al-Qira’at al-‘Ashr”; beliau belajar dari al-Hamami dan sekelompoknya, dan meriwayatkan dari Muhammad Ibn Ismail al-Bazzaz dan sekelompoknya; beliau wafat pada bulan Safar tahun 450 H, dan beliau berusia delapan puluh tahun {cite:shadharat-dhahab p. 293}."
