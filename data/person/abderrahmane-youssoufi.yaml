summary:
  ar: "سياسي ومحام وناشط حقوقي مغربي، رئيس حكومة المغرب من 4 فبراير 1998 إلى 9 أكتوبر 2002 في حكومة التناوب التوافقي في عهدي الحسن الثاني ومحمد السادس، وقائد الاتحاد الاشتراكي للقوات الشعبية من 1992 إلى 2003. وُلد في طنجة سنة 1924، وشارك في الحركة الوطنية وجيش التحرير، وعاش منفيا في باريس خمسة عشر عاما، وشارك في تأسيس المنظمة العربية لحقوق الإنسان سنة 1983، وتوفي في الدار البيضاء سنة 2020."
  en: "Moroccan politician, lawyer and human-rights activist, prime minister of Morocco from 4 February 1998 to 9 October 2002, leading the alternance government under Hassan II and Mohammed VI, and leader of the Socialist Union of Popular Forces from 1992 to 2003. Born at Tangier in 1924, he took part in the national movement and the Army of Liberation, lived fifteen years in exile in Paris, co-founded the Arab Organization for Human Rights in 1983, and died at Casablanca in 2020."
  fr: "Homme politique, avocat et militant des droits humains marocain, Premier ministre du Maroc du 4 février 1998 au 9 octobre 2002, à la tête du gouvernement d'alternance sous Hassan II et Mohammed VI, et dirigeant de l'Union socialiste des forces populaires de 1992 à 2003. Né à Tanger en 1924, il participa au mouvement national et à l'Armée de libération, vécut quinze ans en exil à Paris, cofonda l'Organisation arabe des droits de l'homme en 1983 et mourut à Casablanca en 2020."
  ur: "مراکش کے سیاست دان، وکیل اور انسانی حقوق کے کارکن، 4 فروری 1998 سے 9 اکتوبر 2002 تک مراکش کے وزیر اعظم رہے اور حسن ثانی و محمد سادس کے عہد میں باری باری حکومت کی قیادت کی، اور 1992 سے 2003 تک سوشلسٹ یونین آف پاپولر فورسز کے رہنما رہے۔ وہ 1924 میں طنجہ میں پیدا ہوئے، 2020 میں دارالبیضاء میں وفات پائی۔"
  es: "Político, abogado y activista de derechos humanos marroquí, primer ministro de Marruecos del 4 de febrero de 1998 al 9 de octubre de 2002, al frente del gobierno de alternancia bajo los mandatos de Hassan II y Mohammed VI, y líder de la Unión Socialista de Fuerzas Populares de 1992 a 2003. Nacido en Tánger en 1924, participó en el movimiento nacional y en el Ejército de Liberación, vivió quince años exiliado en París, cofundó la Organización Árabe para los Derechos Humanos en 1983 y falleció en Casablanca en 2020."
  tr: "Faslı bir siyasetçi, avukat ve insan hakları aktivisti olan bu kişi, II. Hasan ve VI. Muhammed dönemlerindeki koalisyon hükümetinde 4 Şubat 1998'den 9 Ekim 2002'ye kadar Fas Başbakanı olarak görev yapmış ve 1992'den 2003'e kadar Sosyalist Halk Güçleri Birliği'nin liderliğini yürütmüştür. 1924 yılında Tanca'da doğmuş, ulusal harekete ve Kurtuluş Ordusu'na katılmış, on beş yıl Paris'te sürgünde yaşamış, 1983 yılında Arap İnsan Hakları Örgütü'nün kuruluşuna katılmış ve 2020 yılında Kazablanka'da vefat etmiştir."
  id: "Seorang politikus, pengacara, dan aktivis hak asasi manusia Maroko, ia menjabat sebagai Perdana Menteri Maroko dari 4 Februari 1998 hingga 9 Oktober 2002 dalam pemerintahan koalisi selama masa pemerintahan Hassan II dan Mohammed VI, dan pemimpin Persatuan Sosialis Kekuatan Rakyat dari tahun 1992 hingga 2003. Ia lahir di Tangier pada tahun 1924, berpartisipasi dalam gerakan nasional dan Tentara Pembebasan, hidup dalam pengasingan di Paris selama lima belas tahun, berpartisipasi dalam pendirian Organisasi Arab untuk Hak Asasi Manusia pada tahun 1983, dan meninggal di Casablanca pada tahun 2020."
