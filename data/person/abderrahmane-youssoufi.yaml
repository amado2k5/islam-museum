summary:
  ar: "سياسي ومحام وناشط حقوقي مغربي، رئيس حكومة المغرب من 4 فبراير 1998 إلى 9 أكتوبر 2002 في حكومة التناوب التوافقي في عهدي الحسن الثاني ومحمد السادس، وقائد الاتحاد الاشتراكي للقوات الشعبية من 1992 إلى 2003. وُلد في طنجة سنة 1924، وشارك في الحركة الوطنية وجيش التحرير، وعاش منفيا في باريس خمسة عشر عاما، وشارك في تأسيس المنظمة العربية لحقوق الإنسان سنة 1983، وتوفي في الدار البيضاء سنة 2020."
  en: "Moroccan politician, lawyer and human-rights activist, prime minister of Morocco from 4 February 1998 to 9 October 2002, leading the alternance government under Hassan II and Mohammed VI, and leader of the Socialist Union of Popular Forces from 1992 to 2003. Born at Tangier in 1924, he took part in the national movement and the Army of Liberation, lived fifteen years in exile in Paris, co-founded the Arab Organization for Human Rights in 1983, and died at Casablanca in 2020."
  ur: "مراکش کے سیاست دان، وکیل اور انسانی حقوق کے کارکن، 4 فروری 1998 سے 9 اکتوبر 2002 تک مراکش کے وزیر اعظم رہے اور حسن ثانی و محمد سادس کے عہد میں باری باری حکومت کی قیادت کی، اور 1992 سے 2003 تک سوشلسٹ یونین آف پاپولر فورسز کے رہنما رہے۔ وہ 1924 میں طنجہ میں پیدا ہوئے، 2020 میں دارالبیضاء میں وفات پائی۔"
