summary:
  ar: "قائد عسكري مسلم من الهوي (1864–1924) من يونان، خدم في شبابه في قوات «شجعان قانسو»، ثم عيّنه يانغ زنغشين في سنجان فصار تيتاي كاشغر (1916–1924) واشتهر بقسوته حتى استبدّ بها، فلما اشتبه يانغ في مراسلاته أرسل ما شاوو فقتله سنة 1924 وعُرض جسده على صليب."
  en: "A Hui Muslim military commander (1864–1924) from Yunnan who served in his youth among the Kansu Braves, then was posted by Yang Zengxin to Xinjiang and became Titai of Kashgar (1916–1924). His rule there was notorious for its brutality; when Yang grew suspicious of his correspondence, he sent Ma Shaowu, who shot him in 1924 and displayed his body on a cross."
  ur: "یوننان سے تعلق رکھنے والے ایک ہوئی مسلمان فوجی کمانڈر (1864ء–1924ء) جو جوانی میں «کانسو بہادر» فوج میں رہے، پھر یانگ زینگ شن نے انہیں سنکیانگ بھیجا اور وہ کاشغر کے تیتائی بنے (1916ء–1924ء)۔ وہاں ان کی حکمرانی اپنی سختی کے لیے بدنام تھی؛ جب یانگ کو ان کی خط کتابت پر شبہ ہوا تو اس نے ما شاوو کو بھیجا، جس نے 1924ء میں انہیں گولی مار دی اور ان کی لاش صلیب پر لٹکا دی۔"
