summary:
  ar: "الحارث بن أبي شمر الغساني، كان ملكه على الشام حين بعث النبي محمد بن عبد الله فدعاه إلى الإسلام، وزار حسان بن ثابت الأنصاري الحارث بالشام وكان النعمان بن المنذر اللخمي ملك الحيرة يساميه فقال له حسان يا بن الفريعة لقد نبئت أنك تفضل النعمان عليّ فقال وكيف أفضله عليك فوالله لقفاك أحسن من وجهه وأنشد الخبر مشهور {cite:muruj-al-dhahab p. 426-427}."
  en: "The Ghassanid king ruling Syria when the Prophet's mission began and the recipient of his call to Islam — famed too for Hassan ibn Thabit's visit and the 'your nape is finer than his face' riposte to al-Nu'man {cite:muruj-al-dhahab p. 426-427}."
