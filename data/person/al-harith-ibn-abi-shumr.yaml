id: person/al-harith-ibn-abi-shumr
class: person
label: { ar: "الحارث بن أبي شمر الغساني", en: "al-Harith ibn Abi Shumr", fr: "Al-Harith ibn Abi Shumr", es: "al-Harith ibn Abi Shumr", ur: "حارث بن ابی شمر" }
summary:
  ar: "الحارث بن أبي شمر الغساني، كان ملكه على الشام حين بعث النبي محمد بن عبد الله فدعاه إلى الإسلام، وزار حسان بن ثابت الأنصاري الحارث بالشام وكان النعمان بن المنذر اللخمي ملك الحيرة يساميه فقال له حسان يا بن الفريعة لقد نبئت أنك تفضل النعمان عليّ فقال وكيف أفضله عليك فوالله لقفاك أحسن من وجهه وأنشد الخبر مشهور {cite:muruj-al-dhahab p. 426-427}."
  en: "The Ghassanid king ruling Syria when the Prophet's mission began and the recipient of his call to Islam — famed too for Hassan ibn Thabit's visit and the 'your nape is finer than his face' riposte to al-Nu'man {cite:muruj-al-dhahab p. 426-427}."
  fr: "Roi ghassanide gouvernant la Syrie au début de la mission du Prophète et destinataire de son appel à l’islam ; connu aussi pour la visite de Hassan ibn Thabit et la réplique à propos d’al-Nu’man : « Ta nuque est plus belle que son visage » {cite:muruj-al-dhahab p. 426-427}."
  es: "El rey gasánida que gobernaba Siria cuando comenzó la misión del Profeta y receptor de su llamado al Islam, famoso también por la visita de Hassan ibn Thabit y la réplica a al-Nu'man de \"tu nuca es más hermosa que su rostro\" {cite:muruj-al-dhahab p. 426-427}."
  ur: "غسانی بادشاہ شام پر حکومت کر رہا تھا جب رسول اللہ کا مشن شروع ہوا اور اسلام کی دعوت دینے والا - حسن بن ثابت کے دورے اور 'تمہاری گھٹن اس کے چہرے سے زیادہ باریک ہے' کی وجہ سے بھی مشہور تھا، النعمان کے جواب میں 426-427}۔"
  tr: "El-Haris bin Ebi Şemmer el-Ghassani, Peygamber Muhammed bin Abdullah onu İslam'a gönderdiğinde Suriye'deki hükümdarıydı. Hasan ibn Tabit el-Ensari Suriye'de el-Haris'i ziyaret etti. El-Hirah kralı el-Nu'man bin Mundhir el-Lakhmi ona isim verirdi. Hasan ona dedi ki, 'Ey el-Feri'ah'ın oğlu, duydum ki el-Nu'man'ı benden daha çok tercih ediyorsun.' Dedi ki, 'Onu senden nasıl daha iyi tercih edebilirim? Tanrı aşkına, yanağın onun yüzünden daha güzel.' Ünlü haberi okudu {cite:muruj-al-dhahab, s. 426-427}."
  id: "Al-Harith ibn Abi Shammar al-Ghassani adalah penguasanya atas Suriah ketika Nabi Muhammad ibn Abdullah mengirimnya ke Islam. Hassan ibn Thabit al-Ansari mengunjungi al-Harith di Suriah. Al-Nu'man ibn al-Mundhir al-Lakhmi, raja al-Hirah, biasa menyebutnya. Hassan berkata kepadanya, 'Wahai putra al-Fari'ah, aku mendengar bahwa engkau lebih memilih al-Nu'man daripada aku.' Dia berkata, 'Bagaimana aku bisa lebih memilih dia daripada kamu? Demi Tuhan, pipimu lebih baik daripada wajahnya.' Dia membacakan laporan terkenal {cite:muruj-al-dhahab, hlm. 426-427}."
