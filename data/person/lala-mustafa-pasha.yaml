  ur: "قبرص پر قبضہ کرنے والے عثمانی کمانڈر لالہ مصطفی پاشا کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Kıbrıs'ı fetheden Osmanlı komutanı Lalla Mustafa Paşa'nın ön kartı, açık bir referans açıklamasında (Wikidata) bahsedilmiştir. Al-Sallabi'nin Osmanlı İmparatorluğu Tarihi adlı eserinin çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan oleh Lalla Mustafa Pasha, komandan Ottoman yang menaklukkan Siprus, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya atas Sejarah Kekaisaran Ottoman karya Al-Sallabi belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
