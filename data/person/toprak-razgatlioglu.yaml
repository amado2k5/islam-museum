summary:
  ar: "متسابق دراجات نارية تركي، وُلد في ألانيا سنة 1996. فاز بثلاثة ألقاب في بطولة العالم للسوبربايك — 2021 مع ياماها و2024 و2025 مع بي إم دبليو — بوصفه أول بطل تركي في هذه الفئة، وانتقل إلى موتو جي بي مع بريما براماك ياماها في موسم 2026."
  en: "Turkish motorcycle racer, born in Alanya in 1996. He won three Superbike World Championship titles — 2021 with Yamaha and 2024 and 2025 with BMW — as the first Turkish champion in the class, and moved to MotoGP with Prima Pramac Yamaha for 2026."
  ur: "ترک موٹر سائیکل ریسر، جو 1996 میں الانیا میں پیدا ہوئے۔ انہوں نے سپر بائیک عالمی چیمپئن شپ کے تین خطابات جیتے — 2021 میں یاماہا اور 2024 و2025 میں بی ایم ڈبلیو کے ساتھ — اس درجے کے پہلے ترک چیمپئن کے طور پر، اور 2026 میں پریما پراماک یاماہا کے ساتھ موٹو جی پی میں منتقل ہوئے۔"
  es: "Piloto turco de motociclismo, nacido en Alanya en 1996. Ganó tres títulos del Campeonato Mundial de Superbikes —2021 con Yamaha y 2024 y 2025 con BMW— siendo el primer campeón turco en la categoría, y pasó a MotoGP con Prima Pramac Yamaha para 2026."
  fr: "Pilote de moto turc, né à Alanya en 1996. Il a remporté trois titres de champion du monde Superbike — en 2021 avec Yamaha et en 2024 et 2025 avec BMW — en tant que premier champion turc de la catégorie, et est passé en MotoGP avec Prima Pramac Yamaha pour 2026."
  tr: "1996 yılında Alanya'da doğmuş Türk motosiklet yarışçısı. Bu kategoride ilk Türk şampiyonu olarak üç Superbike Dünya Şampiyonluğu kazandı — 2021'de Yamaha ile, 2024 ve 2025'te BMW ile, ve 2026 sezonunda Prima Pramac Yamaha ile MotoGP'ye geçti."
  id: "Pembalap motor asal Turki, lahir di Alanya pada tahun 1996. Ia memenangkan tiga gelar Kejuaraan Dunia Superbike — 2021 bersama Yamaha dan 2024 serta 2025 bersama BMW — sebagai juara Turki pertama di kategori ini, dan pindah ke MotoGP bersama Prima Pramac Yamaha pada musim 2026."
