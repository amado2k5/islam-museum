summary:
  ar: "متسابق دراجات نارية تركي، وُلد في ألانيا سنة 1996. فاز بثلاثة ألقاب في بطولة العالم للسوبربايك — 2021 مع ياماها و2024 و2025 مع بي إم دبليو — بوصفه أول بطل تركي في هذه الفئة، وانتقل إلى موتو جي بي مع بريما براماك ياماها في موسم 2026."
