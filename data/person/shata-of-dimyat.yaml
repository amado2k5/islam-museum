id: person/shata-of-dimyat
class: person
label: { ar: "شطا بن البامرك صاحب دمياط", en: "Shata son of al-Bamrak, of Damietta", ur: "شطا بن البامرک، دمیاط والا", es: "Shata son of al-Bamrak, of Damietta", fr: "Shata son of al-Bamrak, of Damietta" }
summary:
  ar: "شطا ابن البامرك صاحب دمياط وخال المقوقس، كما يسميه «فتوح الشام» المنسوب إلى الواقدي: يروي الكتاب أنه أسلم لما دخل الصحابة دمياط ورأى فيهم رؤيا، فتبعه ألف من رجاله ثم أبوه، ثم ذهب رسولاً إلى أبي ثوب صاحب تنيس، وقُتل في قتاله ليلة النصف من شعبان سنة 20هـ، فدُفن في موضع قتله، وجُعلت تلك الليلة موسماً يزور الناس فيه قبره {cite:futuh-al-sham-ilmiyya-1997-v2 p. 80-81} {cite:futuh-al-sham-ilmiyya-1997-v2 p. 85-87}."
  en: "Shata, son of al-Bamrak, lord of Damietta and uncle of the Muqawqis, as the Futuh al-Sham ascribed to al-Waqidi names him. The book relates that he embraced Islam when the Companions entered Damietta, after a vision, followed by a thousand of his men and then by his father; that he went as envoy to Abu Thawb, lord of Tinnis, and was killed fighting him on the night of mid-Sha'ban 20 AH; and that he was buried where he fell, the night becoming a yearly season for visiting his grave {cite:futuh-al-sham-ilmiyya-1997-v2 p. 80-81} {cite:futuh-al-sham-ilmiyya-1997-v2 p. 85-87}."
  es: "Shata, hijo de al-Bamrak, señor de Damietta y tío de los Muqawqis, como lo nombra el Futuh al-Sham atribuido a al-Waqidi. El libro relata que abrazó el Islam cuando los Compañeros entraron en Damietta, después de una visión, seguido por mil de sus hombres y luego por su padre; que fue como enviado a Abu Thawb, señor de Tinnis, y murió luchando contra él la noche de mediados de Sha'ban del año 20 AH; y que fue enterrado donde cayó, convirtiéndose esa noche en una época anual para visitar su tumba {cite:futuh-al-sham-ilmiyya-1997-v2 p. 80-81} {cite:futuh-al-sham-ilmiyya-1997-v2 p. 85-87}."
  fr: "Shata, fils d'al-Bamrak, seigneur de Damiette et oncle des Muqawqis, tel que le nomme le Futuh al-Sham attribué à al-Waqidi. L'ouvrage relate qu'il embrassa l'islam lors de l'entrée des Compagnons à Damiette, après une vision, suivi de mille de ses hommes puis de son père; qu'il se rendit comme émissaire auprès d'Abu Thawb, seigneur de Tinnis, et fut tué au combat contre lui dans la nuit de la mi-Sha'ban de l'an 20 de l'Hégire; et qu'il fut enterré sur le lieu de sa mort, la nuit étant devenue chaque année un moment de pèlerinage sur sa tombe {cite:futuh-al-sham-ilmiyya-1997-v2 p. 80-81} {cite:futuh-al-sham-ilmiyya-1997-v2 p. 85-87}."
  ur: "شاتا، البمرک کا بیٹا، دمیتا کا رب اور مقوقس کا چچا، جیسا کہ فتوح الشام نے الواقدی سے منسوب کیا ہے۔ کتاب بتاتی ہے کہ اس نے اسلام قبول کیا جب صحابہ کرام دمیتا میں داخل ہوئے، ایک خواب کے بعد، اس کے بعد اس کے ایک ہزار آدمی اور پھر اس کے والد نے۔ کہ وہ طنیس کے مالک ابو ثوب کے پاس ایلچی کے طور پر گیا اور 20 ہجری کی نصف شعبان کی رات ان سے لڑتے ہوئے مارا گیا۔ اور یہ کہ وہ وہیں دفن ہوا جہاں وہ گرا، رات ان کی قبر کی زیارت کا سالانہ سیزن بن جاتی ہے۔ 80-81} {حوالہ: فتوح الشام علمیہ-1997-v2 صفحہ۔ 85-87}۔"
