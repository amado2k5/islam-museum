id: person/shata-of-dimyat
class: person
label: { ar: "شطا بن البامرك صاحب دمياط", en: "Shata son of al-Bamrak, of Damietta", ur: "شطا بن البامرک، دمیاط والا" }
summary:
  ar: "شطا ابن البامرك صاحب دمياط وخال المقوقس، كما يسميه «فتوح الشام» المنسوب إلى الواقدي: يروي الكتاب أنه أسلم لما دخل الصحابة دمياط ورأى فيهم رؤيا، فتبعه ألف من رجاله ثم أبوه، ثم ذهب رسولاً إلى أبي ثوب صاحب تنيس، وقُتل في قتاله ليلة النصف من شعبان سنة 20هـ، فدُفن في موضع قتله، وجُعلت تلك الليلة موسماً يزور الناس فيه قبره {cite:futuh-al-sham-ilmiyya-1997-v2 p. 80-81} {cite:futuh-al-sham-ilmiyya-1997-v2 p. 85-87}."
  en: "Shata, son of al-Bamrak, lord of Damietta and uncle of the Muqawqis, as the Futuh al-Sham ascribed to al-Waqidi names him. The book relates that he embraced Islam when the Companions entered Damietta, after a vision, followed by a thousand of his men and then by his father; that he went as envoy to Abu Thawb, lord of Tinnis, and was killed fighting him on the night of mid-Sha'ban 20 AH; and that he was buried where he fell, the night becoming a yearly season for visiting his grave {cite:futuh-al-sham-ilmiyya-1997-v2 p. 80-81} {cite:futuh-al-sham-ilmiyya-1997-v2 p. 85-87}."
