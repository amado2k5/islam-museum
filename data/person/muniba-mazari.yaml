summary:
  ar: فنانة ومحاضرة تحفيزية وسفيرة نوايا حسنة باكستانية، وُلدت سنة 1987. تُلقَّب «المرأة الحديدية في باكستان»؛ أصيبت بشلل جزئي بعد حادث سيارة سنة 2007 فأصبحت أول عارضة ومذيعة على كرسي متحرك في البلاد، وعُيِّنت
    سفيرة للنوايا الحسنة لهيئة الأمم المتحدة للمرأة سنة 2015.
  en: Pakistani artist, motivational speaker and television anchor, born 1987. Known as the 'Iron Lady of Pakistan', she was left partially paralysed after a 2007 car crash and became the country's first
    wheelchair-using model and anchor; she was appointed a UN Women Goodwill Ambassador in 2015.
  ur: پاکستانی فنکارہ، تحریکی مقررہ اور ٹی وی اینکر، پیدائش 1987۔ «پاکستان کی آئرن لیڈی» کے نام سے مشہور؛ 2007 کے کار حادثے میں جزوی فالج کا شکار ہوئیں اور ملک کی پہلی وہیل چیئر پر ماڈل و اینکر بنیں؛ 2015
    میں اقوام متحدہ کی تنظیم برائے خواتین کی سفیر برائے نیک خواہشات مقرر ہوئیں۔
  es: "Artista, oradora motivacional y presentadora de televisión pakistaní, nacida en 1987. Conocida como la \"Dama de Hierro de Pakistán\", quedó parcialmente paralizada tras un accidente automovilístico en 2007 y se convirtió en la primera modelo y presentadora en silla de ruedas del país; fue nombrada Embajadora de Buena Voluntad de ONU Mujeres en 2015."
  fr: "Artiste, conférencière et présentatrice de télévision pakistanaise, née en 1987. Surnommée la « Dame de fer du Pakistan », elle est restée partiellement paralysée suite à un accident de voiture en 2007 et est devenue la première mannequin et présentatrice en fauteuil roulant du pays; elle a été nommée ambassadrice de bonne volonté d'ONU Femmes en 2015."
  tr: "1987 doğumlu Pakistanlı bir sanatçı, motivasyon konuşmacısı ve iyi niyet elçisi. 'Pakistan'daki Demir Kadın' lakabıyla anılır; 2007'de bir trafik kazasından sonra kısmi felç yaşadı, ülkenin ilk tekerlekli sandalye modeli ve sunucusu oldu ve 2015'te BM Kadınları için İyi Niyet Elçisi olarak atandı."
  id: "Seorang seniman Pakistan, dosen motivasi, dan duta niat baik, lahir pada tahun 1987. Dijuluki 'Wanita Besi di Pakistan'; dia mengalami kelumpuhan sebagian setelah kecelakaan mobil pada tahun 2007, menjadi model kursi roda dan presenter pertama di negara itu, dan diangkat sebagai Duta Besar Goodwill untuk UN Women pada tahun 2015."
