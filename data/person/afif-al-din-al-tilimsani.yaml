summary:
  ar: "الأديب الشاعر، من عظماء الطائفة القائلين بالوحدة المطلقة — كما يقدمه المصدر السني الذي يصفه بأنه من زنادقة الصوفية وينقل عنه اتهامات عظيمة ثم يقر أنه لم يثبت عنهم شيء من ذلك بطريق معتبر؛ أثنى عليه ابن سبعين وفضله على شيخه القونوي، وله شرح أسماء الله الحسنى وشرح مواقف النفاري وشرح النصوص وديوان شعر؛ قال ابن الفاشوشة الكتبي إنه دخل عليه يوم مات فقال: من عرف الله كيف يخاف، والله مذ عرفته ما خفته وأنا فرحان بلقائه {cite:shadharat-dhahab p. 720-722}."
  en: "The Sufi poet of the 'absolute unity' circle — the Sunni source brands him among the 'zinadiqa of the Sufis' yet concedes none of the charges was verified; Ibn Sab'in praised him above his own master al-Qunawi; author of Sharh Asma' Allah al-Husna, Sharh Mawaqif al-Niffari and a diwan; on his deathbed: 'he who knows God cannot fear Him' {cite:shadharat-dhahab p. 720-722}."
