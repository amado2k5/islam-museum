summary:
  ar: "الأديب الشاعر، من عظماء الطائفة القائلين بالوحدة المطلقة — كما يقدمه المصدر السني الذي يصفه بأنه من زنادقة الصوفية وينقل عنه اتهامات عظيمة ثم يقر أنه لم يثبت عنهم شيء من ذلك بطريق معتبر؛ أثنى عليه ابن سبعين وفضله على شيخه القونوي، وله شرح أسماء الله الحسنى وشرح مواقف النفاري وشرح النصوص وديوان شعر؛ قال ابن الفاشوشة الكتبي إنه دخل عليه يوم مات فقال: من عرف الله كيف يخاف، والله مذ عرفته ما خفته وأنا فرحان بلقائه {cite:shadharat-dhahab p. 720-722}."
  en: "The Sufi poet of the 'absolute unity' circle — the Sunni source brands him among the 'zinadiqa of the Sufis' yet concedes none of the charges was verified; Ibn Sab'in praised him above his own master al-Qunawi; author of Sharh Asma' Allah al-Husna, Sharh Mawaqif al-Niffari and a diwan; on his deathbed: 'he who knows God cannot fear Him' {cite:shadharat-dhahab p. 720-722}."
  fr: "Poète soufi du cercle de l'« unité absolue » : la source sunnite le qualifie de l'un des « zanadiqa des soufis », tout en admettant qu'aucune accusation n'a été vérifiée. Ibn Sab'in le louait au-dessus de son propre maître al-Qunawi. Auteur du Sharh Asma' Allah al-Husna, du Sharh Mawaqif al-Niffari et d'un divan ; sur son lit de mort, il affirmait que celui qui connaît Dieu ne peut Le craindre {cite:shadharat-dhahab p. 720-722}."
  es: "El poeta sufí del círculo de la \"unidad absoluta\" (la fuente sunita lo cataloga entre los \"zinadiqa de los sufíes\") pero admite que ninguna de las acusaciones fue verificada; Ibn Sab'in lo elogió por encima de su propio maestro al-Qunawi; autor de Sharh Asma' Allah al-Husna, Sharh Mawaqif al-Niffari y un diwan; en su lecho de muerte: 'quien conoce a Dios no puede temerle' {cita: shadharat-dhahab p. 720-722}."
  ur: "'مکمل وحدت' کے دائرے کے صوفی شاعر - سنی ماخذ اسے 'صوفیوں کی زنادقہ' میں شمار کرتے ہیں لیکن اس کے باوجود کسی بھی الزام کی تصدیق نہیں کی گئی۔ ابن سبین نے اس کی تعریف اپنے مالک القنوی سے بھی کی ہے۔ شرح اسماء اللہ الحسنہ، شرح مواقف النفاری اور دیوان کے مصنف؛ بستر مرگ پر: 'جو خدا کو جانتا ہے وہ اس سے نہیں ڈر سکتا'۔ 720-722}۔"
  tr: "Mutlak birliğe inanan mezhebin büyük şahsiyetlerinden biri olan edebiyatçı şair; Sünni kaynaklar tarafından Sufi sapkınlarından biri olarak nitelendirilip aleyhinde büyük suçlamalar yöneltilmiş, ancak bunların hiçbirinin güvenilir bir şekilde kanıtlanmadığı kabul edilmiştir. İbn Sabin onu övmüş ve şeyhi el-Kunevi'ye tercih etmiştir. Ayrıca Allah'ın güzel isimlerinin açıklaması, el-Naffari'nin görüşlerinin açıklaması, metinlerin açıklaması ve şiir derlemesi bulunmaktadır. İbn el-Faşuşah el-Kutubi, vefat ettiği gün onun yanına girdiğini ve şöyle dediğini aktarmıştır: \"Allah'ı tanıyan kimse O'ndan nasıl korkabilir? Allah'a yemin ederim ki, O'nu tanıdığımdan beri O'ndan korkmadım ve O'na kavuşmaktan mutluyum.\" {Şedharat-Dhaba, s. 720-722}"
  id: "Penyair sastrawan, salah satu tokoh besar sekte yang meyakini kesatuan absolut — sebagaimana disajikan oleh sumber Sunni yang menggambarkannya sebagai salah satu kaum Sufi sesat dan mengutip tuduhan-tuduhan besar terhadapnya, kemudian mengakui bahwa tidak ada satu pun dari hal itu yang terbukti secara dapat diandalkan; Ibn Sab’in memujinya dan lebih menyukainya daripada syekhnya al-Qunawi, dan ia memiliki penjelasan tentang nama-nama indah Tuhan, penjelasan tentang posisi al-Naffari, penjelasan tentang teks-teks, dan kumpulan puisi; Ibn al-Fashushah al-Kutubi berkata bahwa ia menemuinya pada hari kematiannya dan ia berkata: Bagaimana mungkin orang yang mengenal Tuhan takut kepada-Nya? Demi Allah, sejak aku mengenal-Nya, aku tidak pernah takut kepada-Nya dan aku bahagia bertemu dengan-Nya {kutip:shadharat-dhahab hlm. 720-722}."
