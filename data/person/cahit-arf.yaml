summary:
  ar: "رياضياتي تركي (1910–1997)، وُلد في سالونيك وتعلم في باريس وغوتنغن حيث نال الدكتوراه بإشراف هلموت هاسه سنة 1938. سُمي باسمه ثابت عارف ونظرية هاسه–عارف وحلقات عارف وأشباه زمره، وكان المدير المؤسس لمجلس البحث العلمي والتقني التركي (توبيتاك) سنة 1963، ودرّس في جامعة إسطنبول وجامعة الشرق الأوسط التقنية، وتظهر صورته على ورقة العشر ليرات التركية لسنة 2009."
  en: "Turkish mathematician (1910–1997), born in Thessaloniki and educated in Paris and Göttingen, where he took his PhD under Helmut Hasse in 1938. The Arf invariant, the Hasse–Arf theorem and Arf rings and semigroups bear his name; he was the founding director of TÜBİTAK in 1963, taught at Istanbul University and the Middle East Technical University, and appears on the Turkish ten-lira note of 2009."
  ur: "ترکی ریاضی دان (1910ء–1997ء)، جو تھیسالونیکی میں پیدا ہوئے اور پیرس اور گوٹنگن سے تعلیم حاصل کی، جہاں انہوں نے 1938ء میں ہیلموٹ ہاسے کی نگرانی میں پی ایچ ڈی کی۔ عارف انہیرینٹ، ہاسے–عارف قضیہ اور عارف رنگز و سیمی گروپس ان کے نام سے منسوب ہیں؛ وہ 1963ء میں TÜBİTAK کے بانی ڈائریکٹر تھے، جامعہ استنبول اور مڈل ایسٹ ٹیکنیکل یونیورسٹی میں پڑھایا، اور 2009ء کے ترکی دس لیرا کے نوٹ پر ان کی تصویر ہے۔"
