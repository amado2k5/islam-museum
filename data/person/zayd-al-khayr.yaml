summary:
  ar: "زيد الخير شخصية يرويها الشيخ عمر عبد الكافي في درسه: سأله النبي عما يشعر به فقال إنه يحب الخير وأهل الخير. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:24:30} ويرى الشيخ في ذلك علامة على أن الله يريد بالعبد خيرا في الآخرة. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:25:00}"
  en: "Zayd al-Khayr is a figure related by Sheikh Omar Abdelkafy in his lesson: the Prophet asked him what he felt and he said that he loves good and the people of good. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:24:30} The Sheikh sees in this a sign that God wills good for the servant in the hereafter. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:25:00}"
  ur: "زید الخیر وہ شخصیت ہیں جن کا ذکر شیخ عمر عبد الکافی اپنے درس میں کرتے ہیں: نبی نے ان سے پوچھا کہ وہ کیا محسوس کرتے ہیں تو انہوں نے کہا کہ وہ خیر اور اہلِ خیر سے محبت کرتے ہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:24:30} شیخ اس میں اس بات کی علامت دیکھتے ہیں کہ اللہ بندے کے لیے آخرت میں بھلائی چاہتا ہے۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:25:00}"
