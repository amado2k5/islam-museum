summary:
  ar: "خوارزمشاه أفريغي من القرن الثامن، تذكره قائمة البيروني على أنه أسلم، وعلى دراهمه ظهرت أول كتابة عربية في خوارزم بأسماء نواب الخلافة {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 36} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 38}."
  en: "Afrighid Khwarazmshah of the eighth century whom al-Biruni's list names as having accepted Islam; his drachms carry the first Arabic writing in Khwarazm, the names of caliphal governors {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 36} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 38}."
  ur: "آٹھویں صدی کے آفریغی خوارزم شاہ جنہیں بیرونی کی فہرست اسلام قبول کرنے والا بتاتی ہے؛ ان کے درہموں پر خوارزم کی پہلی عربی تحریر، یعنی خلافتی نائبوں کے نام، ملتی ہے {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 36} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 38}۔"
