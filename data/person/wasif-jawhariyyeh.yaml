summary:
  ar: "موسيقي وشاعر وكاتب مذكرات مقدسي (1897–1972)، عُرف بمذكراته التي دوّنها من 1904 إلى 1968 وصدرت مختارات منها بعنوان «حكواتي القدس»، فغدت من أشهر الشهادات الشخصية على الحياة الاجتماعية في القدس في العهدين العثماني والانتدابي."
  en: "Jerusalem musician, poet and diarist (1897–1972). His diaries, kept from 1904 to 1968 and published in edited selections as The Storyteller of Jerusalem, are among the most celebrated first-hand records of the city's social life under Ottoman and Mandate rule."
  ur: "قدس کے موسیقار، شاعر اور روزنامچہ نگار (1897–1972)۔ ان کی یادداشتیں، جو 1904ء سے 1968ء تک لکھی گئیں اور منتخب صورت میں «حکایات گوئے قدس» کے عنوان سے شائع ہوئیں، عثمانی اور انتدابی دور میں شہر کی سماجی زندگی کی مشہور ترین چشم دید شہادتوں میں شمار ہوتی ہیں۔"
