label: { ar: "السلطان ملكشاه جلال الدولة بن ألب أرسلان" }
summary:
  ar: "ثالث سلاطين السلاجقة، قام في الملك بعد أبيه ألب أرسلان سنة خمس وستين ورد تدبير المملكة إلى نظام الملك ولقبه الأتابك وهو أول من لقب به ومعناه الأمير الوالد، ودخل بغداد سنة تسع وسبعين فنزل بدار المملكة ولعب بالكرة، وعاد سنة خمس وثمانين عازماً على الشر فأرسل إلى الخليفة لا بد أن تترك لي بغداد فاتفق مرضه وموته وعد كرامة للخليفة {cite:tarikh-khulafa-minhaj-1434 p. 647,652-653}."
  en: "Third Seljuk sultan, succeeding Alp Arslan in 465; Nizam al-Mulk governed as 'atabeg' — the first to bear the title, 'the father amir'. He entered Baghdad in 479, and returning in 485 with the demand that the caliph quit the city, fell ill and died — counted a karama for al-Muqtadi {cite:tarikh-khulafa-minhaj-1434 p. 647,652-653}."
