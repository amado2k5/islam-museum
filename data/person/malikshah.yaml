label: { ar: "السلطان ملكشاه جلال الدولة بن ألب أرسلان" }
summary:
  ar: "ثالث سلاطين السلاجقة، قام في الملك بعد أبيه ألب أرسلان سنة خمس وستين ورد تدبير المملكة إلى نظام الملك ولقبه الأتابك وهو أول من لقب به ومعناه الأمير الوالد، ودخل بغداد سنة تسع وسبعين فنزل بدار المملكة ولعب بالكرة، وعاد سنة خمس وثمانين عازماً على الشر فأرسل إلى الخليفة لا بد أن تترك لي بغداد فاتفق مرضه وموته وعد كرامة للخليفة {cite:tarikh-khulafa-minhaj-1434 p. 647,652-653}. ملك من مدينة كاشغر الترك إلى بيت المقدس طولاً ومن القسطنطينية وبلاد الخزر إلى نهر الهند عرضاً وكان حسن السيرة محسناً إلى الرعية يلقبونه بالسلطان العادل وكان ذا غرام بالعمائر والصيد مات في شوال وقيل إنه سم في خلال ونقل في تابوت فدفن بأصبهان في مدرسة كبيرة له ولم يحضر جنازته أحد ظاهراً ولم تقطع أذيال الخيل لأجله، وكان مغرماً بالصيد حتى قيل إنه صاد نحو عشرة آلاف حتى بنى من حوافر الحمر وقرون الظباء منارة على طريق الحاج تعرف بمنارة القرون وتصدق عن كل نسمة صادها بدينار وقال إني أخاف الله من إزهاق النفوس بغير فائدة ولا مأكلة، وكان قد عاد إلى بغداد سنة خمس وثمانين عازماً على الشر وأرسل إلى الخليفة يقول لا بد أن تترك لي بغداد وتذهب إلى أي بلد شئت فأنزعج الخليفة وقال أمهلني ولو شهراً قال ولا ساعة واحدة فاتفق مرض السلطان وموته وعُد ذلك كرامة للخليفة وقيل إن الخليفة جعل يصوم فإذا أفطر جلس على الرماد ودعا على ملكشاه فاستجاب الله دعاءه، ولما مات كتمت زوجته تركان موته وأرسلت إلى الأمراء سراً فاستحلفتهم لولدها محمود وهو ابن خمس سنين فخُلِّعوا له ولقبه المقتدي ناصر الدنيا والدين ثم خرج عليه أخوه بركياروق فقلده الخليفة ولقبه ركن الدين وذلك في محرم سنة سبع وثمانين ثم مات الخليفة من الغد فجأة {cite:shadharat-dhahab p. 384-385}."
  en: "Third Seljuk sultan, succeeding Alp Arslan in 465; Nizam al-Mulk governed as 'atabeg' — the first to bear the title, 'the father amir'. He entered Baghdad in 479, and returning in 485 with the demand that the caliph quit the city, fell ill and died — counted a karama for al-Muqtadi {cite:tarikh-khulafa-minhaj-1434 p. 647,652-653}."
