label: { ar: "السلطان ملكشاه جلال الدولة بن ألب أرسلان" , ur: "ملک شاہ", en: "Malikshah", es: "Malikshah", fr: "Malikshah"}
summary:
  ar: "ثالث سلاطين السلاجقة، قام في الملك بعد أبيه ألب أرسلان سنة خمس وستين ورد تدبير المملكة إلى نظام الملك ولقبه الأتابك وهو أول من لقب به ومعناه الأمير الوالد، ودخل بغداد سنة تسع وسبعين فنزل بدار المملكة ولعب بالكرة، وعاد سنة خمس وثمانين عازماً على الشر فأرسل إلى الخليفة لا بد أن تترك لي بغداد فاتفق مرضه وموته وعد كرامة للخليفة {cite:tarikh-khulafa-minhaj-1434 p. 647,652-653}. ملك من مدينة كاشغر الترك إلى بيت المقدس طولاً ومن القسطنطينية وبلاد الخزر إلى نهر الهند عرضاً وكان حسن السيرة محسناً إلى الرعية يلقبونه بالسلطان العادل وكان ذا غرام بالعمائر والصيد مات في شوال وقيل إنه سم في خلال ونقل في تابوت فدفن بأصبهان في مدرسة كبيرة له ولم يحضر جنازته أحد ظاهراً ولم تقطع أذيال الخيل لأجله، وكان مغرماً بالصيد حتى قيل إنه صاد نحو عشرة آلاف حتى بنى من حوافر الحمر وقرون الظباء منارة على طريق الحاج تعرف بمنارة القرون وتصدق عن كل نسمة صادها بدينار وقال إني أخاف الله من إزهاق النفوس بغير فائدة ولا مأكلة، ولما توفي ولده داود بأصبهان في ذي الحجة سنة 474هـ لحقه عليه ما زاد على المعهود ورام قتل نفسه دفعات وجز الأتراك والتركان شعورهم وأقام أهل البلد المآتم سبعة أيام، وكتب بخطه رقعة يخاطب ولده الميت «واخبر أنت بعدي ما لك وحالك وما فعل الدود بجسمك والتراب بوجهك وعينك» فحملت إلى نظام الملك فقرأها وبكى بكاء شديداً وقرأها على القبر {cite:muntazam-ibn-al-jawzi j.8 p.330-331}، وكان قد عاد إلى بغداد سنة خمس وثمانين عازماً على الشر وأرسل إلى الخليفة يقول لا بد أن تترك لي بغداد وتذهب إلى أي بلد شئت فأنزعج الخليفة وقال أمهلني ولو شهراً قال ولا ساعة واحدة فاتفق مرض السلطان وموته وعُد ذلك كرامة للخليفة وقيل إن الخليفة جعل يصوم فإذا أفطر جلس على الرماد ودعا على ملكشاه فاستجاب الله دعاءه، ولما مات كتمت زوجته تركان موته وأرسلت إلى الأمراء سراً فاستحلفتهم لولدها محمود وهو ابن خمس سنين فخُلِّعوا له ولقبه المقتدي ناصر الدنيا والدين ثم خرج عليه أخوه بركياروق فقلده الخليفة ولقبه ركن الدين وذلك في محرم سنة سبع وثمانين ثم مات الخليفة من الغد فجأة {cite:shadharat-dhahab p. 384-385}."
  en: "Third Seljuk sultan, succeeding Alp Arslan in 465; Nizam al-Mulk governed as 'atabeg' — the first to bear the title, 'the father amir'. He entered Baghdad in 479, and returning in 485 with the demand that the caliph quit the city, fell ill and died — counted a karama for al-Muqtadi {cite:tarikh-khulafa-minhaj-1434 p. 647,652-653}."
  ur: "الپ ارسلان کا بیٹا اور سلجوقی سلطان؛ اس کے عہد میں سلطنت کا اقتدار وسیع ہوا، جبکہ آخری برس بغداد کے عباسی دربار سے کشیدگی رہی۔ {cite:shadharat-dhahab}"
  es: "Nizam al-Mulk, tercer sultán selyúcida, sucedió a Alp Arslan en 465 y gobernó como 'atabeg', siendo el primero en ostentar el título de 'emir padre'. Entró en Bagdad en 479 y, al regresar en 485 con la exigencia de que el califa abandonara la ciudad, enfermó y murió, lo que se consideró un karama para al-Muqtadi {cite:tarikh-khulafa-minhaj-1434 p. 647, 652-653}."
  fr: "Troisième sultan seldjoukide, succédant à Alp Arslan en 465, Nizam al-Mulk gouverna en tant qu'atabeg, le premier à porter le titre d'émir père. Il entra à Bagdad en 479 et, de retour en 485 avec la demande que le calife quitte la ville, tomba malade et mourut, ce qui fut considéré comme un karma pour al-Muqtadi (voir: Tarikh-Khulafa-Minhaj-1434, p. 647, 652-653)."
  tr: "Üçüncü Selçuklu sultanıydı ve altmış beşinci yılda babası Alp Arslan'ın yerine geçti. Krallığın yönetimi Nizam al-Mulk'e geri verildi ve ona 'babanın prensi' olarak anılan ilk Atabeg unvanı verildi. 1979'da Bağdat'a girdi, krallığın başkentine yerleşti ve futbol oynadı. 1985'te kötülük yapmaya kararlı olarak döndü ve halifeye 'Bağdat'ı bana bırakmalısın' diyerek yazdı. Hastalığı ve ölümü aynı zamana denk geldi ve halifeye onur sözü verdi {kaynak:Tarikh-khulafa-minhaj-1434, s. 647, 652-653}. Uzun süre Kaşgar şehrinden Türklere kadar, Konstantinopolis ve Hazarlardan Hint Nehri'ne kadar hüküm sürdü. Saygılı ve iyi niyetliydi, halkın ona Adil Sultan lakabı takıldı. Mimarlık ve avcılığa tutkuluydu. Şavval'da öldü ve alay sırasında zehirlenip tabuta götürüldüğü söylenir. İsfahan'da büyük bir okulda defnedildi. Cenazesine halka açık şekilde kimse katılmadı, at kuyruğu kesilmedi. Avcılığa tutkuluydu; yaklaşık on bin kişi avladığı söylenir, hatta eşek toynakları ve antilop boynuzlarından inşa ettiği söylenir. Hacı yolunda Yüzyıllar Feneri olarak bilinen bir deniz feneri, yakaladığı her ruh için bir dinar ile sadaka yaptı. Dedi ki, 'Yardım ve yiyecek olmadan can almaktan korkarım.' Oğlu Davud, İsfahan'da Dhu al-Hijjah 474 H.'de öldüğünde, olağanüstü bir şeyle sarsıldı, kendini grup halinde öldürmeye çalıştı ve Türkler ile Türkler saçlarını kesti. Kasaba halkı yedi gün boyunca yas törenleri düzenledi ve o kendi el yazısıyla ölen oğluna hitaben bir mektup yazdı: 'Ve benden sonra halini söyle, solucanların bedenine ne yaptığını, yüzüne ve gözüne toz bulaştığını söyle.' Böylece o taşındı Nizam al-Mulk onu okudu, acı bir şekilde ağladı ve mezar üzerinde okudu {atıf:Muntazam-ibn-al-Jawzi j.8 s.330-331}. Seksen beşinci yılda Bağdat'a dönmüş, kötülük yapmaya kararlıydı ve halifeye 'Benim için Bağdat'tan ayrılmalı ve istediğin ülkeye gitmelisin' diye bir mesaj gönderdi. Halife üzülüp 'Bana bir ay ver' dedi, ama bir saat bile değil. Sultan hastalandı ve öldü, bunu halife için bir onur olarak gördü. Halifenin oruç tuttuğu, orucunu bozduğunda küllerin üzerine oturup Malikşah'a dua ettiği söylenir, fakat Allah duasını kabul etti. Ne zaman Eşi Turkan ölümünü gizledi ve gizlice prenslere gönderdi; prensler de beş yaşındaki oğlu Mahmud adına yemin ettirdiler. Onu tahttan indirdiler ve ona El-Muktada Nasir el-Dunya ve el-Din unvanlarını verdiler. Sonra kardeşi Barkiyaruq ona karşı isyan etti, halife de onu taklit ederek seksen yedinci yılın Muharrem'inde Rukn al-Din unvanını verdi. Halife ertesi gün aniden öldü {atıf:Shadharat-Dhahab, s. 384-385}."
  id: "Ia adalah sultan Seljuk ketiga, menggantikan ayahnya Alp Arslan pada tahun enam puluh lima. Administrasi kerajaan dikembalikan kepada Nizam al-Mulk, yang diberi gelar Atabeg, yang pertama disebut 'pangeran ayah.' Ia masuk Baghdad pada tahun 1979, menetap di ibu kota kerajaan, dan bermain sepak bola. Ia kembali pada tahun 1985 dengan tekad untuk berbuat jahat dan mengirim surat kepada khalifah dengan berkata, 'Kau harus menyerahkan Baghdad padaku.' Sakit dan kematiannya bertepatan, dan ia berjanji akan menghormati khalifah {cite:Tarikh-khulafa-minhaj-1434, hlm. 647, 652-653}. Ia memerintah dari kota Kashgar, Turki hingga Yerusalem untuk waktu yang lama, dan dari Konstantinopel serta bangsa Khazar hingga Sungai India, secara tidak langsung. Ia sopan dan baik hati kepada rakyat, yang menjulukinya Sultan yang Adil. Ia sangat menyukai arsitektur dan berburu. Ia meninggal di Shawwal, dan dikatakan ia diracun selama prosesi dan diangkut dalam peti mati. Ia dimakamkan di Isfahan di sebuah sekolah besar. Tidak ada yang menghadiri pemakamannya di tempat umum, juga tidak ada ekor kuda yang dipotong untuknya. Ia sangat bersemangat berburu, sampai-sampai dikatakan ia berburu sekitar sepuluh ribu dan bahkan membangun dari kuku keledai dan tanduk antelop. Sebuah mercusuar di jalan peziarah, dikenal sebagai Mercusuar Berabad-abad, dan ia memberi amal kepada setiap jiwa yang ia tangkap dengan seekor dinar. Ia berkata, 'Aku takut akan Tuhan mengambil nyawa tanpa manfaat atau makanan.' Ketika putranya Dawood meninggal di Isfahan pada Dhu al-Hijjah 474 H, ia sangat terharu oleh apa yang tidak biasa, ia mencoba bunuh diri secara bergedong-gelang, dan orang Turki serta Turki dipotong rambutnya. Penduduk kota mengadakan upacara berkabung selama tujuh hari, dan ia menulis surat dengan tulisan tangannya sendiri yang ditujukan kepada putranya yang telah meninggal: 'Dan ceritakan setelah aku apa kondisimu dan apa yang cacing-cacing lakukan pada tubuhmu serta debu di wajah dan matamu.' Maka ia dibawa ke Nizam al-Mulk membacanya, menangis dengan sedih, dan membacanya di atas makam {cite:muntazam-ibn-al-jawzi j.8 hlm.330-331}. Ia kembali ke Baghdad pada tahun delapan puluh lima, bertekad untuk berbuat jahat, dan mengirim pesan kepada khalifah mengatakan, 'Kau harus meninggalkan Baghdad untukku dan pergi ke negara mana pun yang kau inginkan.' Khalifah menjadi sedih dan berkata, 'Berikan aku sebulan,' tetapi bahkan tidak selama satu jam. Sultan jatuh sakit dan meninggal, dan ia menganggap ini sebagai kehormatan bagi khalifah. Konon khalifah biasa berpuasa, dan ketika ia beristirahat, ia duduk di atas abu dan berdoa melawan Malikshah, tetapi Allah menjawab doanya. Ketika Istrinya, Turkan, menyembunyikan kematiannya dan diam-diam mengirim surat kepada para pangeran, yang membuat mereka bersumpah atas nama putranya Mahmoud yang berusia lima tahun. Mereka mencopotnya dan memberinya gelar Al-Muqtada Nasir al-Dunya dan al-Din. Kemudian saudaranya Barkiyaruq memberontak melawannya, dan khalifah menirunya serta memberinya gelar Rukn al-Din, pada Muharram tahun delapan puluh tujuh. Kemudian khalifah meninggal secara tiba-tiba keesokan harinya {cite:shadharat-dhahab, hlm. 384-385}."
