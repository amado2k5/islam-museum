summary:
  ar: "أبسانا بيجوم (وُلدت في 25 أيار 1990 في شادويل بلندن لأبوين بنغلاديشيين)، سياسية بريطانية في حزب العمال، نائبة عن بوبلر ولايمهاوس منذ 2019، وهي أول نائبة في البرلمان البريطاني ترتدي الحجاب. درست في جامعة كوين ماري وكلية الدراسات الشرقية والأفريقية (SOAS)."
  en: "Apsana Begum (born 25 May 1990 in Shadwell, London, to Bangladeshi parents) is a British Labour politician, MP for Poplar and Limehouse since 2019 and the first Member of Parliament in Britain to wear a hijab. She studied at Queen Mary University of London and SOAS."
  ur: "افسانہ بیگم (پیدائش 25 مئی 1990، شیڈویل، لندن، بنگلہ دیشی والدین کے گھر) برطانوی لیبر سیاست دان ہیں، 2019 سے پوپلر و لائم ہاؤس کی رکنِ پارلیمان، اور برطانوی پارلیمان میں حجاب پہننے والی پہلی رکن ہیں۔ انہوں نے کوئین میری یونیورسٹی آف لندن اور سواس (SOAS) سے تعلیم حاصل کی۔"

