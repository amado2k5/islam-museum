summary:
  ar: "خطاط مغولي، ابن كفايت خان، تعلم الشكسته من أبيه ثم ابتكر طريقة خاصة سميت «درايت خاني»، واتفق أهل الفن على أنه فاق أباه {cite:salim-tarikh-khatt-o-khattatin-2001 p. 153}."
  en: "Mughal calligrapher, son of Kifayat Khan, who learned shikasta from his father and then devised a manner of his own called 'Darayat Khani'; masters of the art agree that he surpassed his father {cite:salim-tarikh-khatt-o-khattatin-2001 p. 153}."
  ur: "مغل خطاط، کفایت خان کے بیٹے، جنہوں نے شکستہ اپنے والد سے سیکھا اور پھر ایک خاص طرز ایجاد کی جسے «درایت خانی» کہتے ہیں؛ اساتذۂ فن متفق ہیں کہ وہ اپنے والد سے بڑھ گئے {cite:salim-tarikh-khatt-o-khattatin-2001 p. 153}۔"
  es: "Calígrafo mogol, hijo de Kifayat Khan, que aprendió shikasta de su padre y luego ideó un estilo propio llamado 'Darayat Khani'; los maestros del arte coinciden en que superó a su padre {cite:salim-tarikh-khatt-o-khattatin-2001 p. 153}."
  fr: "Calligraphe moghol, fils de Kifayat Khan, qui apprit le shikasta de son père puis conçut un style qui lui était propre, appelé « Darayat Khani »; les maîtres de l'art s'accordent à dire qu'il surpassa son père {cite:salim-tarikh-khatt-o-khattatin-2001 p. 153}."
  tr: "Kafayat Han'ın oğlu bir Moğol hattat, Shakshata'yı babasından öğrenmiş ve ardından 'Darayat Khani' adlı özel bir yöntem icat etmiştir. Sanatçılar, onun babasını geçtiği konusunda hemfikirdir {cite:salim-tarikh-khatt-o-khattatin-2001 s. 153}."
  id: "Seorang kaligrafer Mongol, putra Kafayat Khan, belajar Shakshata dari ayahnya dan kemudian menciptakan metode khusus yang disebut 'Darayat Khani.' Para seniman sepakat bahwa ia melampaui ayahnya {cite:salim-tarikh-khatt-o-khattatin-2001 hlm. 153}."
