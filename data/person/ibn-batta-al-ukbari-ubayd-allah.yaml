summary:
  ar: "أبو عبد الله عبيد الله بن محمد بن بطة العكبري (304–387هـ)، محدث وفقيه حنبلي من عكبرا على دجلة فوق بغداد، رحل إلى البصرة والشام ومكة والثغور ثم لزم بيته يدرّس ويؤلف، وصنف «الإبانة الكبرى» و«الشرح والإبانة» في عقيدة أهل الحديث، وأخذ عن أبي بكر النجاد والخرقي والآجري وغيرهم."
  en: "Abu Abd Allah Ubayd Allah ibn Muhammad Ibn Batta al-Ukbari (304–387 AH), a Hanbali hadith scholar and jurist from Ukbara on the Tigris above Baghdad, who travelled to Basra, Syria, Mecca and the frontier posts and then kept to his house teaching and writing; author of al-Ibana al-Kubra and al-Sharh wa-al-Ibana on the creed of the hadith scholars, and a student of Abu Bakr al-Najjad, al-Khiraqi, al-Ajurri and others."
