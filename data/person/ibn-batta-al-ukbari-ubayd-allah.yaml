summary:
  ar: "أبو عبد الله عبيد الله بن محمد بن بطة العكبري ⁦(304–387هـ)⁩، محدث وفقيه حنبلي من عكبرا على دجلة فوق بغداد، رحل إلى البصرة والشام ومكة والثغور ثم لزم بيته يدرّس ويؤلف، وصنف «الإبانة الكبرى» و«الشرح والإبانة» في عقيدة أهل الحديث، وأخذ عن أبي بكر النجاد والخرقي والآجري وغيرهم."
  en: "Abu Abd Allah Ubayd Allah ibn Muhammad Ibn Batta al-Ukbari (304–387 AH), a Hanbali hadith scholar and jurist from Ukbara on the Tigris above Baghdad, who travelled to Basra, Syria, Mecca and the frontier posts and then kept to his house teaching and writing; author of al-Ibana al-Kubra and al-Sharh wa-al-Ibana on the creed of the hadith scholars, and a student of Abu Bakr al-Najjad, al-Khiraqi, al-Ajurri and others."
  es: "Abu Abd Allah Ubayd Allah ibn Muhammad Ibn Batta al-Ukbari (304–387 AH), un erudito y jurista hanbalí de Ukbara, en el Tigris, cerca de Bagdad, que viajó a Basora, Siria, La Meca y los puestos fronterizos y luego se quedó en su casa enseñando y escribiendo; autor de al-Ibana al-Kubra y al-Sharh wa-al-Ibana sobre el credo de los eruditos del hadiz, y discípulo de Abu Bakr al-Najjad, al-Khiraqi, al-Ajurri y otros."
  fr: "Abu Abd Allah Ubayd Allah ibn Muhammad Ibn Batta al-Ukbari (304–387 AH), un érudit du hadith hanbalite et juriste d'Ukbara sur le Tigre au-dessus de Bagdad, qui voyagea à Bassora, en Syrie, à La Mecque et aux postes frontières, puis resta chez lui à enseigner et à écrire; auteur d'al-Ibana al-Kubra et d'al-Sharh wa-al-Ibana sur la croyance des érudits du hadith, et un élève d'Abu Bakr al-Najjad, d'al-Khiraqi, d'al-Ajurri et d'autres."
  ur: "ابو عبد اللہ عبید اللہ ابن محمد ابن بطہ العکبری ⁦(304-387ھ)⁩، بغداد کے اوپر دجلہ کے عقبرہ سے تعلق رکھنے والے ایک حنبلی حدیث کے عالم اور فقیہ تھے، جنہوں نے بصرہ، شام، مکہ اور سرحدی چوکیوں کا سفر کیا اور پھر اپنے گھر پر درس و تحریر کرتے رہے۔ علمائے حدیث کے عقیدہ پر الابانہ الکبری اور الشرح و العبنا کے مصنف اور ابوبکر النجاد، الخیراقی، الاجوری اور دیگر کے شاگرد ہیں۔"
  tr: "Ebu Abdullah Ubeydullah ibn Muhammed bin Batta el-Ekbari (304–387 H) Bağdat üzerindeki Dicle kıyısındaki Ekbara bölgesinden bir Hanbali hadis âlimi ve fihihiydi. Basra, Şam, Mekke ve sınır bölgelerine seyahat etti, ardından evde kalıp eğitim aldı ve yazarlık yaptı. Hadis halkının inancı üzerine \"El-İbanah el-Kubra\" ve \"El-Şerh ve el-İbanah\" adlı eserleri yazdı ve Ebu Bekir el-Neced, el-Hurçi, el-Ecri ve diğerlerinin yanında eğitim aldı."
  id: "Abu Abdullah Ubaydullah ibn Muhammad ibn Batta al-Akbari (304–387 H) adalah seorang ulama hadis Hanbali dan ahli hukum dari Akbara di Sungai Tigris di atas Baghdad. Ia melakukan perjalanan ke Basra, Levant, Mekah, dan perbatasan, lalu tinggal di rumah untuk belajar dan menulis. Ia menulis \"Al-Ibanah al-Kubra\" dan \"Al-Sharh wa al-Ibanah\" tentang ajaran para ahli hadis, serta belajar di bawah bimbingan Abu Bakr al-Najad, al-Khurqi, al-Ajri, dan lainnya."
