summary:
  ar: "شاعر مصري ⁦(1872–1932)⁩ لُقّب بشاعر النيل، من أعمدة الشعر العربي الكلاسيكي الحديث مع أحمد شوقي. جمع شعره في «ديوان حافظ»، وتناول هموم الشعب المصري وقضايا العدل الاجتماعي والمرأة، وترجم عن الفرنسية كتاب «البؤساء» لفيكتور هيغو."
  en: "Egyptian poet (1872–1932), surnamed 'Poet of the Nile', a pillar of modern neoclassical Arabic verse alongside Ahmad Shawqi. His poetry is collected in the Diwan Hafez; he treated the cares of the Egyptian people, social justice and women's questions, and translated Victor Hugo's Les Miserables from French."
  ur: "مصری شاعر ⁦(1872–1932)⁩ جن کا لقب «شاعرِ نیل» ہے اور جو احمد شوقی کے ساتھ جدید نوکلاسیکی عربی شاعری کے ستون ہیں۔ ان کی شاعری «دیوانِ حافظ» میں جمع ہے؛ انہوں نے مصری عوام کے دکھ، سماجی انصاف اور مسئلۂ خواتین کو موضوع بنایا اور وکٹر ہیوگو کا «بینوا» ⁦(Les Miserables)⁩ فرانسیسی سے ترجمہ کیا۔"
