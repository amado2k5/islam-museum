gender: female
roles: [poet]
summary:
  ar: "شاعرة فصيحة من همدان قالت شعراً في نصرة علي يوم صفين، ثم وفدت على معاوية تشكو عامله بسر بن أرطاة، وحدثته بخبرها مع علي حين شكت إليه عامل الصدقة، فكتب لها ولقومها بحاجتها؛ يروي خبرها كحالة عن بلاغات النساء."
  en: "An eloquent poet of Hamdan who composed verses for Ali at Siffin and later came before Mu'awiya to complain of his governor Busr ibn Abi Artat, telling him how Ali had once dismissed a tax collector she complained of; Mu'awiya had her request granted for her and her people. Kahhala tells her story from Balaghat al-Nisa'."
  ur: "ہمدان کی ایک فصیح شاعرہ جنہوں نے صفین میں علی کی حمایت میں اشعار کہے، پھر معاویہ کے پاس ان کے عامل بسر بن ابی ارطاۃ کی شکایت لے کر آئیں اور بتایا کہ علی نے کس طرح زکوٰۃ کے ایک عامل کو ان کی شکایت پر معزول کیا تھا؛ معاویہ نے ان کے اور ان کی قوم کے لیے ان کی حاجت لکھوا دی۔ کحالہ بلاغات النساء سے نقل کرتے ہیں۔"
