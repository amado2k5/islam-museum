label: { ar: "أحمد بن محمد خوارزمشاه", en: "Ahmad ibn Muhammad, Khwarazmshah", ur: "احمد بن محمد، خوارزم شاہ" }
summary:
  ar: "خوارزمشاه أفريغي في القرن العاشر، حفيد عراق بن منصور، ضرب سنة 348هـ/959م أول درهم إسلامي الطراز لخوارزمشاه، وأول نقد يكتب فيه لقب خوارزمشاه بالعربية {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 48}."
  en: "Afrighid Khwarazmshah of the tenth century, grandson of Iraq ibn Mansur, who in 348/959 struck the first Islamic-type dirham of a Khwarazmshah, the first coin to write the title Khwarazmshah in Arabic {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 48}."
  ur: "دسویں صدی کے آفریغی خوارزم شاہ، عراق بن منصور کے پوتے، جنہوں نے 348ھ/959ء میں کسی خوارزم شاہ کا پہلا اسلامی طرز کا درہم ڈھالا، جو عربی میں خوارزم شاہ کا لقب لکھنے والا پہلا سکہ ہے {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 48}۔"
