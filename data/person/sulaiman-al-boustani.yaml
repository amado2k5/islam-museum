summary:
  ar: "أديب وشاعر ورجل دولة لبناني (1856–1925)، ابن أخي بطرس البستاني؛ علّم وكتب في «الجنان» و«دائرة المعارف»، وأتقن أكثر من عشر لغات، واشتهر بترجمته «الإلياذة» لهوميروس شعرًا إلى العربية (القاهرة، 1904)، وكان وزيرًا للمالية في آخر حكومة عثمانية."
  en: "Lebanese writer, poet and statesman (1856–1925), a nephew of Butrus al-Bustani. He taught, wrote for al-Jinan and the Dairat al-Ma'arif encyclopaedia, mastered more than ten languages, and is best known for his verse translation of Homer's Iliad into Arabic (Cairo, 1904); he served as finance minister in the last Ottoman government."
  ur: "لبنانی ادیب، شاعر اور سیاست دان (1856–1925)، بطرس البستانی کے بھتیجے؛ انہوں نے تدریس کی، «الجنان» اور «دائرة المعارف» میں لکھا، دس سے زائد زبانیں سیکھیں، اور ہومر کی «ایلیاڈ» کے عربی منظوم ترجمے (قاہرہ، 1904) سے شہرت پائی؛ وہ آخری عثمانی حکومت میں وزیرِ خزانہ رہے۔"
