summary:
  ar: "محمد بن محمد الشهير بعرب زاده، فقيه حنفي رومي، درس في بروسة ثم إستانبول، ونفي إلى بروسة سنتين ثم أعيد إلى التدريس، وعين قاضيا في القاهرة فغرق قرب رودس سنة 969 هـ الموافقة 1562 م؛ له حاشية على الهداية وحاشية على أنوار التنزيل."
  en: "Muhammad ibn Muhammad, known as Arabzade, a Hanafi jurist of Rum who taught in Bursa and Istanbul, was banished to Bursa for two years and restored to teaching, then appointed judge of Cairo and drowned near Rhodes in 969 AH (1562); author of glosses on al-Hidaya and Anwar al-tanzil."
  es: "Muhammad ibn Muhammad, conocido como Arabzade, jurista hanafí de Rum que enseñó en Bursa y Estambul, fue desterrado a Bursa durante dos años y posteriormente readmitido en la enseñanza, luego nombrado juez de El Cairo y se ahogó cerca de Rodas en el año 969 de la Hégira (1562); autor de glosas sobre al-Hidaya y Anwar al-tanzil."
