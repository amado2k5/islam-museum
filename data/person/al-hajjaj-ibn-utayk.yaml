id: person/al-hajjaj-ibn-utayk
class: person
label: { ar: "الحجاج بن عتيك الثقفي", en: "al-Hajjaj ibn Utayk al-Thaqafi", fr: "Al-Hajjaj ibn Utayk al-Thaqafi", es: "al-Hajjaj ibn Utayk al-Thaqafi", ur: "الحجاج ابن عتیق ثقفی" }
summary:
  ar: "الحجاج بن عتيك رجل من ثقيف؛ زوج أم جميل بنت يحجن التي رصد الشهود المغيرة بن شعبة يدخل عليها؛ وكان على الفرات وهو الحجاج الذي ذكره أبو المختار في قصيدته على عمال الأهواز."
  en: "Al-Hajjaj ibn Utayk of Thaqif; husband of Umm Jamil bint Yahjan, on whom the watchers saw al-Mughira call; he held the Euphrates charge — the Hajjaj of Abu al-Mukhtar's satire on the Ahwaz officials."
  fr: "Al-Hajjaj ibn Utayk des Thaqif, époux d’Umm Jamil bint Yahjan, chez qui les observateurs virent entrer al-Mughira ; il avait la charge de l’Euphrate et c’est le Hajjaj de la satire d’Abu al-Mukhtar sur les agents d’Ahwaz."
  es: "Al-Hajjaj ibn Utayk de Thaqif; esposo de Umm Jamil bint Yahjan, a quien los vigilantes vieron llamar a al-Mughira; él ostentaba el cargo del Éufrates, el Hajjaj de la sátira de Abu al-Mukhtar sobre los funcionarios de Ahwaz."
  ur: "الحجاج بن عتیق ثقیف؛ ام جمیل بنت یحجان کے شوہر، جن پر ناظرین نے المغیرہ کو پکارتے دیکھا۔ اس نے فرات کا چارج سنبھالا - اہواز کے حکام پر ابو المختار کے طنز کا حجاج۔"
  tr: "Haccac bin Atik, Sakif'ten bir adamdı; şahitlerin Muğira bin Şuba'nın onun üzerine bindiğini gördükleri Ümmü Cemil bint Yahjin'in kocasıydı; Fırat Nehri kıyısındaydı ve Ebu el-Muhtar'ın Ahvaz işçileri hakkındaki şiirinde bahsettiği Haccac odur."
  id: "Hajjaj bin Atik adalah seorang pria dari Thaqif; suami dari Umm Jamil bint Yahjin, yang disaksikan oleh para saksi mata bahwa Mughira bin Shu’ba memasuki tempat tersebut; dan dia berada di Sungai Eufrat, dan dialah Hajjaj yang disebutkan oleh Abu al-Mukhtar dalam puisinya tentang para pekerja Ahwaz."
