id: person/zayd-ibn-ali
class: person
label: { ar: "زيد بن علي بن الحسين" }
summary:
  ar: "ظهر في سنة إحدى وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.161}، وكان قبل ذلك يخاصم بني الحسن أمام هشام بن عبد الملك {cite:tabari-tarikh-abu-al-fadl j.7 p.161}، وقُتل في سنة اثنتين وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.180}.، وعند المسعودي شاور أخاه أبا جعفر فأشار عليه ألا يركن إلى أهل الكوفة وقال بها قتل جدك علي وبها طعن عمك الحسن وبها قتل أبوك الحسين فأبى إلا المطالبة بالحق فقال له إني أخاف عليك يا أخي أن تكون غداً المصلوب بكناسة الكوفة، ودخل على هشام فقال له اسكت لا أم لك أنت ابن أمة فقال إن الأمهات لا يقعدن بالرجال عن الغايات وقد كانت أم إسماعيل أمة فلم يمنعه ذلك أن بعثه الله نبياً وجعله للعرب أباً وأنا ابن فاطمة وابن علي، فخرج بالكوفة فحاربه يوسف بن عمر الثقفي فأصابه سهم في جبهته فاستخرجه حجام فمات من ساعته فدفنوه في ساقية ماء وكان ذلك سنة إحدى وعشرين ومائة وقيل اثنتين وعشرين {cite:muruj-al-dhahab p. 193-195}"
