id: person/zayd-ibn-ali
class: person
label: { ar: "زيد بن علي بن الحسين" }
summary:
  ar: "ظهر في سنة إحدى وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.161}، وكان قبل ذلك يخاصم بني الحسن أمام هشام بن عبد الملك {cite:tabari-tarikh-abu-al-fadl j.7 p.161}، وقُتل في سنة اثنتين وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.180}. وعند المسعودي شاور أخاه أبا جعفر فأشار عليه ألا يركن إلى أهل الكوفة وقال بها قتل جدك علي وبها طعن عمك الحسن وبها قتل أبوك الحسين فأبى إلا المطالبة بالحق فقال له إني أخاف عليك يا أخي أن تكون غداً المصلوب بكناسة الكوفة، ودخل على هشام فقال له اسكت لا أم لك أنت ابن أمة فقال إن الأمهات لا يقعدن بالرجال عن الغايات وقد كانت أم إسماعيل أمة فلم يمنعه ذلك أن بعثه الله نبياً وجعله للعرب أباً وأنا ابن فاطمة وابن علي، فخرج بالكوفة فحاربه يوسف بن عمر الثقفي فأصابه سهم في جبهته فاستخرجه حجام فمات من ساعته فدفنوه في ساقية ماء وكان ذلك سنة إحدى وعشرين ومائة وقيل اثنتين وعشرين {cite:muruj-al-dhahab p. 193-195} ويذكر الكتاب أن زيداً خرج على هشام بن عبد الملك بالكوفة سنة 121هـ، وأن نفراً من أهل الكوفة نقضوا بيعته حين طعنت طائفة من أتباعه في أبي بكر وعمر فرفضهم، وأن ابن هبيرة وولاة الأمويين استفزوه للخروج، وأن يوسف بن عمر استخرج جثته بعد قتله وصلبها عرياناً بأمر هشام. ويذكر الكتاب أن ابنه يحيى هرب إلى خراسان وأعلن الثورة فيها، وأن مقتل زيد أوقع في نفس هشام أمراً شديداً. {cite:salabi-umayyad-state-2020 p.510-516}. وعند الشهرستاني وغيره تتلمذ زيد لواصل بن عطاء رأس المعتزلة — ويبني أحمد أمين على ذلك أن الشيعة هم الذين أخذوا عن المعتزلة تعاليمهم في أصول الدين لا العكس، مع ملاحظة أن بعض الشيعة يزعم أن واصلاً تتلمذ لجعفر الصادق، ويروي أبو الفرج الأصفهاني في «مقاتل الطالبين» أن جعفر بن محمد كان يمسك لزيد بن علي بالركاب ويسوي ثيابه على السرج {cite:duha-islam p. 892-893}"
  tr: "Yüz yirmi birinci yılında ortaya çıktı {cite:tabari-tarikh-abu-al-fadl j.7 s.161} ve ondan önce Hisham ibn Abd al-Malik önünde Banu al-Hasan ile tartışıyordu {cite:tabari-tarikh-abu-al-fadl j.7 s.161} ve yüz yirmi iki yılında öldürüldü {cite:tabari-tarikh-abu-al-fadl j.7 s.180}. El-Mes'udi'de, kardeşi Ebu Ca'fer'e danıştı; o da ona Kufe halkına dönmemesini tavsiye etti. Dedi ki, \"Deden Ali bu yüzünden öldürüldü, amcan El-Hasan bıçaklandı ve baban Hüseyin de öldürüldü.\" Adalet talep etmeyi reddetti, sadece gerçeği istedi. Ona dedi ki, \"Senin için korkuyorum kardeşim, yarın Kufe çöpünde çarmıha gerileceksin.\" Hisham'a girdi ve ona, \"Sus, annen yok; sen bir ulusun oğlusun.\" dedi. O da \"Anneler amaçlarının ötesinde insanlarla oturmaz, ve um İsmail köleydi, ama bu onu peygamber olarak göndermesine engel olmadı,\" dedi. Onu Araplara baba yaptı ve ben Fatimah ile İbn Ali'nin oğluyum. Kufa'ya gitti, burada Yusuf bin Ömer el-Tekafi onunla savaştı ve bir ok alnına saplandı. Bir berber onu çıkardı ve anında öldü. 121 Hicri yılında bir çeşmeye gömdüler ve 22 olduğu söylenir. {atıf:Muruj-al-Dhahab s. 193-195} Kitapta, Zayd'in 121 Hicri yılında Kufa'da Hişam bin Abdülmelik'e karşı isyan ettiğini ve Kufa'dan bir grubun, takipçilerinden bir grup Ebu Bekir ve Ömer'e saldırdığında bağlılığını bozduğunu ve onların reddettiği belirtilir. İbn Hubayrah ve Emevi valileri onu isyana kışkırttılar, Yusuf bin Ömer ise onu öldürdükten sonra cesedini çıkarıp Hişam'ın emriyle çıplak çarmıha gerdi. Kitapta oğlu Yahya'nın Horasan'a kaçtığı ve orada isyan ilan ettiği ve Zayd'ın öldürülmesinin Hisham'ı derinden etkilediği belirtilir. {alıntı:Salabi-Umayyad-State-2020 s.510-516}. al-Shahrastani ve diğerlerine göre, Zayd, Mu'tazillerin lideri Wasil ibn Ata'nın yanında eğitim almıştır—Ahmed Amin buna dayanarak, Şiilerin dini temelleri öğretilerini Mu'tazillerden aldığını, tam tersi olmadığını belirtir. Bazı Şiilerin Wasil'in Ja'far al-Sadiq'in öğrencisi olduğunu iddia ettiği belirtilir. Abu al-Faraj al-Isfahani, 'Maqatil al-Talibin'de Ja'far ibn Muhammed'in Zayd ibn Ali'nin atlarını tuttuğunu ve kıyafetlerini eyerlere bağladığını anlatır {cite:Duha-Islam, s. 892-893}"
  id: "Ia muncul pada tahun seratus dua puluh satu {cite:tabari-tarikh-abu-al-fadl j.7 hlm.161}, dan sebelum itu, ia bertengkar dengan Banu al-Hasan di hadapan Hisham ibn Abd al-Malik {cite:tabari-tarikh-abu-al-fadl j.7 hlm.161}, dan dibunuh pada tahun seratus dua puluh dua {cite:tabari-tarikh-abu-al-fadl j.7 hlm.180}. Di Al-Mas'udi, ia berkonsultasi dengan saudaranya Abu Ja'far, yang menasihatinya agar tidak berpaling kepada rakyat Kufa. Ia berkata, \"Kakekmu Ali dibunuh oleh makhluk itu, pamanmu Al-Hasan ditusuk, dan ayahmu Husayn juga dibunuh oleh makhluk itu.\" Ia menolak menuntut keadilan kecuali untuk meminta kebenaran. Ia berkata kepadanya, \"Aku takut untukmu, saudaraku, bahwa besok kau akan disalibkan di sampah Kufa.\" Ia mendekati Hisham dan berkata kepadanya, \"Diamlah, kau tidak punya ibu; kau adalah anak sebuah bangsa.\" Ia menjawab, \"Ibu tidak duduk bersama manusia di luar tujuan mereka, dan um Ismail adalah budak, tetapi itu tidak menghalanginya untuk mengirimnya sebagai nabi.\" Ia menjadikannya ayah bagi orang Arab, dan aku adalah putra Fatimah dan Ibn Ali. Ia pergi ke Kufa, di mana Yusuf ibn Umar al-Thaqafi melawannya, dan sebuah panah menusuk dahinya. Seorang tukang cukur membawanya keluar dan meninggal seketika. Mereka menguburnya di sebuah air mancur pada tahun 121 H, dan dikatakan 22. {cite:muruj-al-dhahab hlm. 193-195} Kitab tersebut menyebutkan bahwa Zayd memberontak melawan Hisham ibn Abd al-Malik di Kufa pada tahun 121 H, dan bahwa sekelompok dari Kufa memutuskan kesetiaannya ketika sekelompok pengikutnya menyerang Abu Bakr dan Umar, yang menolak mereka. Ibn Hubayrah dan para gubernur Umayyah memprovokasi dia untuk memberontak, dan bahwa Yusuf ibn Umar menggali kembali jasadnya setelah membunuhnya dan menyalibnya telanjang atas perintah Hisham. Buku tersebut menyebutkan bahwa putranya Yahya melarikan diri ke Khorasan dan menyatakan pemberontakan di sana, dan pembunuhan Zayd sangat memengaruhi Hisham. {cite:salabi-umayyad-state-2020 hlm.510-516}. Menurut al-Shahrastani dan lainnya, Zayd belajar di bawah bimbingan Wasil ibn Ata, kepala Mu'tazilite—Ahmad Amin membangun bahwa Syiah adalah mereka yang mengambil ajaran dasar agama dari Mu'tazilite, bukan sebaliknya. Dicatat bahwa beberapa Syiah mengklaim bahwa Wasil adalah murid Ja'far al-Sadiq. Abu al-Faraj al-Isfahani menceritakan dalam 'Maqatil al-Talibin' bahwa Ja'far ibn Muhammad biasa memegang tunggangan Zayd ibn Ali dan mengikat pakaiannya pada pelana {cite:Duha-Islam, hlm. 892-893}"
