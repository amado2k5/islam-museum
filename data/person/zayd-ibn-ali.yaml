label: { ar: "زيد بن علي بن الحسين" }
summary:
  ar: "ظهر في سنة إحدى وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.161}، وكان قبل ذلك يخاصم بني الحسن أمام هشام بن عبد الملك {cite:tabari-tarikh-abu-al-fadl j.7 p.161}، وقُتل في سنة اثنتين وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.180}. وعند المسعودي شاور أخاه أبا جعفر فأشار عليه ألا يركن إلى أهل الكوفة وقال بها قتل جدك علي وبها طعن عمك الحسن وبها قتل أبوك الحسين فأبى إلا المطالبة بالحق فقال له إني أخاف عليك يا أخي أن تكون غداً المصلوب بكناسة الكوفة، ودخل على هشام فقال له اسكت لا أم لك أنت ابن أمة فقال إن الأمهات لا يقعدن بالرجال عن الغايات وقد كانت أم إسماعيل أمة فلم يمنعه ذلك أن بعثه الله نبياً وجعله للعرب أباً وأنا ابن فاطمة وابن علي، فخرج بالكوفة فحاربه يوسف بن عمر الثقفي فأصابه سهم في جبهته فاستخرجه حجام فمات من ساعته فدفنوه في ساقية ماء وكان ذلك سنة إحدى وعشرين ومائة وقيل اثنتين وعشرين {cite:muruj-al-dhahab p. 193-195} ويذكر الكتاب أن زيداً خرج على هشام بن عبد الملك بالكوفة سنة 121هـ، وأن نفراً من أهل الكوفة نقضوا بيعته حين طعنت طائفة من أتباعه في أبي بكر وعمر فرفضهم، وأن ابن هبيرة وولاة الأمويين استفزوه للخروج، وأن يوسف بن عمر استخرج جثته بعد قتله وصلبها عرياناً بأمر هشام. ويذكر الكتاب أن ابنه يحيى هرب إلى خراسان وأعلن الثورة فيها، وأن مقتل زيد أوقع في نفس هشام أمراً شديداً. {cite:salabi-umayyad-state-2020 p.510-516}. وعند الشهرستاني وغيره تتلمذ زيد لواصل بن عطاء رأس المعتزلة — ويبني أحمد أمين على ذلك أن الشيعة هم الذين أخذوا عن المعتزلة تعاليمهم في أصول الدين لا العكس، مع ملاحظة أن بعض الشيعة يزعم أن واصلاً تتلمذ لجعفر الصادق، ويروي أبو الفرج الأصفهاني في «مقاتل الطالبين» أن جعفر بن محمد كان يمسك لزيد بن علي بالركاب ويسوي ثيابه على السرج {cite:duha-islam p. 892-893}"
