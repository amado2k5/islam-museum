summary:
  ar: "أكاديمي قانوني وسياسي مصري (1925–2008)، وُلد بمركز طامية في محافظة الفيوم، وتخرج في كلية الحقوق بجامعة القاهرة سنة 1946 ثم نال الدكتوراه من جامعة باريس سنة 1957 عن رسالة فازت بجائزة الجامعة، ودرّس تاريخ القانون والقانون الروماني بجامعة القاهرة حتى ترأسها (1975–1978)، وانتُخب عضوا بمجلس الشعب سنة 1976 فتولى رئاسة المجلس (1978–1983) ورئاسة لجنة تقنين أحكام الشريعة الإسلامية فيه، وعقب اغتيال الرئيس أنور السادات في 6 أكتوبر 1981 تولى مهام رئيس الجمهورية بالنيابة بحكم الدستور لثمانية أيام (6–14 أكتوبر 1981) حتى انتُخب حسني مبارك، وله مؤلفات في القانون الروماني والشريعة الإسلامية منها «تطبيق الشريعة الإسلامية في البلاد العربية» (1974)، وتوفي في كوالالمبور بماليزيا في 21 فبراير 2008 أثناء مشاركته في ملتقى لرابطة خريجي الأزهر. «صوفي» اسمه الأول، وليس نسبة إلى التصوف."
  en: "Egyptian legal scholar and politician (1925–2008), born at Tamiya in Faiyum Governorate. He graduated from Cairo University's Faculty of Law in 1946 and took his doctorate at the University of Paris in 1957 with a thesis that won the university prize, taught the history of law and Roman law at Cairo University and served as its president (1975–1978), was elected to the People's Assembly in 1976 and became its Speaker (1978–1983) and chairman of its committee for the codification of Islamic Sharia rulings. After President Anwar Sadat's assassination on 6 October 1981 he assumed the duties of acting head of state under the constitution for eight days (6–14 October 1981), stepping aside for Hosni Mubarak. His books on Roman law and Islamic law include 'Appliance of the Islamic Law in Arabic Countries' (1974). He died in Kuala Lumpur, Malaysia, on 21 February 2008 while attending an al-Azhar alumni gathering. 'Sufi' is his given name, not a Sufi affiliation."
  ur: "مصری قانونی عالم اور سیاست دان (1925ء–2008ء)، جو محافظہ فیوم کے مرکز طامیہ میں پیدا ہوئے۔ انھوں نے 1946ء میں جامعہ قاہرہ کی کلیہ حقوق سے گریجویشن کیا اور 1957ء میں جامعہ پیرس سے ڈاکٹریٹ حاصل کی، قاہرہ یونیورسٹی میں تاریخِ قانون اور رومی قانون پڑھایا اور اس کے صدر رہے (1975ء–1978ء)، 1976ء میں مجلسِ شعب کے رکن منتخب ہوئے اور اس کے اسپیکر بنے (1978ء–1983ء) اور شریعت کے احکام کی تدوین کی کمیٹی کی صدارت کی۔ صدر انور سادات کے قتل (6 اکتوبر 1981ء) کے بعد انھوں نے آئین کے تحت آٹھ دن (6–14 اکتوبر 1981ء) قائم مقام سربراہِ مملکت کے فرائض سنبھالے، پھر حسنی مبارک کے لیے عہدہ چھوڑ دیا۔ ان کی کتابوں میں «عرب ممالک میں اسلامی شریعت کا نفاذ» (1974ء) شامل ہے۔ وہ 21 فروری 2008ء کو ملائیشیا کے کوالالمپور میں وفات پا گئے۔ «صوفی» ان کا ذاتی نام ہے، تصوف سے نسبت نہیں۔"
