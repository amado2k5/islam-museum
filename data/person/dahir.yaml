label: { ar: "داهر ملك السند", en: "Dahir, King of Sind", es: "Dahir, King of Sind", fr: "Dahir, King of Sind", ur: "داہر، سندھ کا بادشاہ" }
summary:
  ar: "داهر ملك السند؛ امتنع عن تخليص النسوة اللاتي أخذهن قراصنة الديبل وقال إنما أخذهن لصوص لا أقدر عليهم فأغزى عليه الحجاج محمد بن القاسم فلقيه على فيل وحوله الفيلة والكاكرة فاقتتلوا قتالاً شديداً لم يسمع بمثله وترجل وقاتل فقتل عند المساء وقال المدائني قاتله رجل من بني كلاب. ذكر الكتاب أنه كان على فيل في معركة نهر مهران، ثم ترجّل وقاتل حتى قُتل عند المساء، وأن أصحابه انهزموا. {cite:salabi-umayyad-state-2020 p.104}"
  en: "Dahir, king of Sind; refusing to free the pirated women — 'pirates beyond my power' — he met Muhammad ibn al-Qasim elephant-backed amid elephants and the Kakira, dismounted, fought, and fell at evening; al-Mada'ini names a Kilabi his killer."
  es: "Dahir, rey de Sind, se negó a liberar a las mujeres secuestradas —«piratas fuera de mi alcance»—, se encontró con Muhammad ibn al-Qasim a lomos de un elefante, entre elefantes y los Kakira, desmontó, luchó y cayó al anochecer; al-Mada'ini nombra a un Kilabi como su asesino."
  fr: "Dahir, roi du Sind; refusant de libérer les femmes pirates — « pirates hors de mon pouvoir » —, il rencontra Muhammad ibn al-Qasim à dos d'éléphant au milieu des éléphants et des Kakira, mit pied à terre, combattit et tomba le soir; al-Mada'ini nomme un Kilabi son meurtrier."
  ur: "داہر، سندھ کا بادشاہ؛ بحری قزاقوں کو آزاد کرنے سے انکار کرتے ہوئے - 'میری طاقت سے باہر بحری قزاق' - اس نے ہاتھیوں اور کاکیرا کے درمیان ہاتھی کی حمایت یافتہ محمد بن القاسم سے ملاقات کی، شام کو اتری، لڑی اور گر گئی۔ المدائنی نے ایک کلبی کو اپنے قاتل کا نام دیا۔"
