label: { ar: "داهر ملك السند", en: "Dahir, King of Sind" }
summary:
  ar: "داهر ملك السند؛ امتنع عن تخليص النسوة اللاتي أخذهن قراصنة الديبل وقال إنما أخذهن لصوص لا أقدر عليهم فأغزى عليه الحجاج محمد بن القاسم فلقيه على فيل وحوله الفيلة والكاكرة فاقتتلوا قتالاً شديداً لم يسمع بمثله وترجل وقاتل فقتل عند المساء وقال المدائني قاتله رجل من بني كلاب. ذكر الكتاب أنه كان على فيل في معركة نهر مهران، ثم ترجّل وقاتل حتى قُتل عند المساء، وأن أصحابه انهزموا. {cite:salabi-umayyad-state-2020 p.104}"
  en: "Dahir, king of Sind; refusing to free the pirated women — 'pirates beyond my power' — he met Muhammad ibn al-Qasim elephant-backed amid elephants and the Kakira, dismounted, fought, and fell at evening; al-Mada'ini names a Kilabi his killer."
