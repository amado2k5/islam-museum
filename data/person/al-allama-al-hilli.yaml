  ar: "جمال الدين ابن المطهر الحلي، فقيه ومتكلم إمامي، صاحب «منهاج الكرامة في معرفة الإمامة» الذي صنفه للملك أولجايتو خدابنده، وعليه رد ابن تيمية في «منهاج السنة النبوية» واصفاً إياه بأنه من شيوخ الإمامية في عصره؛ ويذكر له أيضاً «خلاصة الأقوال» و«تذكرة الفقهاء»."
  en: "Jamal al-Din Ibn al-Mutahhar al-Hilli, Imami jurist and theologian, author of Minhaj al-Karama fi Ma'rifat al-Imama, which he wrote for the king Öljeitü Khudabanda and which Ibn Taymiyya answered in Minhaj al-Sunna al-Nabawiyya, calling him one of the Imami shaykhs of his own time; also credited with Khulasat al-Aqwal and Tadhkirat al-Fuqaha."
