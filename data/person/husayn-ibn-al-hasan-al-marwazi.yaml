  ar: "الحسين بن الحسن بن حرب السلمي المروزي نزيل مكة، راوي كتاب الزهد عن ابن المبارك؛ روى عنه الترمذي وابن ماجه وابن صاعد، وقال أبو حاتم صدوق، وذكر ابن حبان أنه مات سنة 246 {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 99}."
  en: "al-Husayn ibn al-Hasan ibn Harb al-Sulami al-Marwazi, resident of Mecca, transmitter of Ibn al-Mubarak's Kitab al-Zuhd; al-Tirmidhi, Ibn Majah and Ibn Sa'id transmitted from him, Abu Hatim called him truthful, and Ibn Hibban gave his death as 246 {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 99}."
  ur: "حسین بن حسن بن حرب سلمی مروزی، مکہ کے باشندے، ابن المبارک سے کتاب الزہد کے راوی؛ ان سے ترمذی، ابن ماجہ اور ابن صاعد نے روایت کی، ابو حاتم نے انہیں صدوق کہا، اور ابن حبان کے مطابق ان کی وفات 246 میں ہوئی {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 99}۔"
