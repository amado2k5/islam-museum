id: person/abu-jaafar-ibn-shirzad
class: person
label: { ar: "أبو جعفر بن شيرزاد" }
summary:
  ar: "كاتب توزون، أرسله من واسط إلى بغداد فحكم عليها وأمر ونهى، وضمن حمدي اللص اللصوصية ببغداد بخمسة وعشرين ألف دينار في الشهر فكان يكبس بيوت الناس بالمشعل والشمع، ومات توزون في أيام المستكفي فطمع ابن شيرزاد في المملكة وحلف العساكر لنفسه فخلع عليه الخليفة ثم دخل ابن بويه بغداد فاختفى {cite:tarikh-khulafa-minhaj-1434 p. 610-613}.، وعند ابن الأثير استتر مع المستكفي لما اضطربت بغداد بمسير معز الدولة وكانت إمارته ثلاثة أشهر وعشرين يوماً، ثم ظهر فولاه معز الدولة الخراج وجباية الأموال {cite:kamil-ibn-al-athir p. 336}"
  en: "Tuzun's secretary, who ruled Baghdad for him; he franchised Hamdi the thief's house-raids at twenty-five thousand dinars a month, aspired to the kingdom on Tuzun's death with the soldiers sworn to him, then vanished when Ibn Buya entered Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 610-613}."
