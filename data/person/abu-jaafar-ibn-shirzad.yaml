id: person/abu-jaafar-ibn-shirzad
class: person
label: { ar: "أبو جعفر بن شيرزاد", en: "Abu Ja'far ibn Shirzad", ur: "ابو جعفر ابن شیرزاد" }
summary:
  ar: "كاتب توزون، أرسله من واسط إلى بغداد فحكم عليها وأمر ونهى، وضمن حمدي اللص اللصوصية ببغداد بخمسة وعشرين ألف دينار في الشهر فكان يكبس بيوت الناس بالمشعل والشمع، ومات توزون في أيام المستكفي فطمع ابن شيرزاد في المملكة وحلف العساكر لنفسه فخلع عليه الخليفة ثم دخل ابن بويه بغداد فاختفى {cite:tarikh-khulafa-minhaj-1434 p. 610-613}. وعند ابن الأثير استتر مع المستكفي لما اضطربت بغداد بمسير معز الدولة وكانت إمارته ثلاثة أشهر وعشرين يوماً، ثم ظهر فولاه معز الدولة الخراج وجباية الأموال {cite:kamil-ibn-al-athir p. 336}. وعند مسكويه عُقدت له الرياسة يوم الجمعة 2 صفر 334هـ، ثم كتب لمعز الدولة وقام للمطيع بمقام الوزراء، ثم استتر في شعبان وصار مع ناصر الدولة يدبر له بغداد في حربه لمعز الدولة {cite:tajarib-al-umam-surush-v6 p. 111-125}."
  en: "Tuzun's secretary, who ruled Baghdad for him; he franchised Hamdi the thief's house-raids at twenty-five thousand dinars a month, aspired to the kingdom on Tuzun's death with the soldiers sworn to him, then vanished when Ibn Buya entered Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 610-613}. Miskawayh dates his election by the army to Friday 2 Safar 334 and follows him as Mu'izz al-Dawla's secretary, al-Muti's vizier in all but name, and then Nasir al-Dawla's manager of Baghdad in the war of 334 {cite:tajarib-al-umam-surush-v6 p. 111-125}."
