id: person/abu-jaafar-ibn-shirzad
class: person
label: { ar: "أبو جعفر بن شيرزاد", en: "Abu Ja'far ibn Shirzad", ur: "ابو جعفر ابن شیرزاد", fr: "Abu Ja'far ibn Shirzad", es: "Abu Ja'far ibn Shirzad" }
summary:
  ar: "كاتب توزون، أرسله من واسط إلى بغداد فحكم عليها وأمر ونهى، وضمن حمدي اللص اللصوصية ببغداد بخمسة وعشرين ألف دينار في الشهر فكان يكبس بيوت الناس بالمشعل والشمع، ومات توزون في أيام المستكفي فطمع ابن شيرزاد في المملكة وحلف العساكر لنفسه فخلع عليه الخليفة ثم دخل ابن بويه بغداد فاختفى {cite:tarikh-khulafa-minhaj-1434 p. 610-613}. وعند ابن الأثير استتر مع المستكفي لما اضطربت بغداد بمسير معز الدولة وكانت إمارته ثلاثة أشهر وعشرين يوماً، ثم ظهر فولاه معز الدولة الخراج وجباية الأموال {cite:kamil-ibn-al-athir p. 336}. وعند مسكويه عُقدت له الرياسة يوم الجمعة 2 صفر 334هـ، ثم كتب لمعز الدولة وقام للمطيع بمقام الوزراء، ثم استتر في شعبان وصار مع ناصر الدولة يدبر له بغداد في حربه لمعز الدولة {cite:tajarib-al-umam-surush-v6 p. 111-125}."
  en: "Tuzun's secretary, who ruled Baghdad for him; he franchised Hamdi the thief's house-raids at twenty-five thousand dinars a month, aspired to the kingdom on Tuzun's death with the soldiers sworn to him, then vanished when Ibn Buya entered Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 610-613}. Miskawayh dates his election by the army to Friday 2 Safar 334 and follows him as Mu'izz al-Dawla's secretary, al-Muti's vizier in all but name, and then Nasir al-Dawla's manager of Baghdad in the war of 334 {cite:tajarib-al-umam-surush-v6 p. 111-125}."
  fr: "Secrétaire de Tuzun, qui gouverna Bagdad pour lui ; il afferma au voleur Hamdi les cambriolages de maisons pour vingt-cinq mille dinars par mois, aspira au royaume à la mort de Tuzun avec les soldats qui lui avaient prêté serment, puis disparut quand Ibn Buya entra à Bagdad {cite:tarikh-khulafa-minhaj-1434 p. 610-613}. Miskawayh date son élection par l'armée au vendredi 2 safar 334 et le suit comme secrétaire de Mu'izz al-Dawla, vizir d'al-Muti' sauf le nom, puis administrateur de Bagdad pour Nasir al-Dawla dans la guerre de 334 {cite:tajarib-al-umam-surush-v6 p. 111-125}."
  es: "El secretario de Tuzun, que gobernó Bagdad en su nombre, autorizó los saqueos de casas del ladrón Hamdi a cambio de veinticinco mil dinares al mes, aspiró al reino tras la muerte de Tuzun con los soldados que le habían jurado lealtad, y luego desapareció cuando Ibn Buya entró en Bagdad {cite:tarikh-khulafa-minhaj-1434 p. 610-613}. Miskawayh fecha su elección por el ejército el viernes 2 de Safar de 334 y le sigue como secretario de Mu'izz al-Dawla, visir de al-Muti en la práctica, y luego administrador de Bagdad por Nasir al-Dawla en la guerra de 334 {cite:tajarib-al-umam-surush-v6 p. 111-125}."
  ur: "تزون کا سیکرٹری، جو اس کے لیے بغداد پر حکومت کرتا تھا۔ اس نے حمدی کو چور کے گھر پر چھاپہ ماہانہ پچیس ہزار دینار پر فرنچائز کیا، تزون کی موت پر بادشاہی کی تمنا میں سپاہیوں کے ساتھ حلف لیا، پھر ابن بویا کے بغداد میں داخل ہونے پر غائب ہو گیا۔ 610-613}۔ مسکاویہ نے جمعہ 2 صفر 334 کو فوج کے ذریعہ اپنا انتخاب کیا اور اس کی پیروی کرتے ہوئے معز الدولہ کے سکریٹری، نام کے علاوہ المطی کا وزیر اور پھر 334 کی جنگ میں ناصر الدولہ کا بغداد کا منیجر بنا۔ 111-125}۔"
  tr: "Tuzun'un kâtibi Wasit'ten Bağdat'a gönderildi ve orada hüküm sürdü, emirler verdi ve yasaklar getirdi. Hırsız Hamdi, Bağdat'taki hırsızlığı ayda yirmi beş bin dinar karşılığında garanti altına aldı, bu yüzden meşaleler ve mumlarla insanların evlerine girerdi. Tuzun, Mustakfi'nin hükümdarlığı sırasında öldü, bu yüzden İbn Şirzad krallığı ele geçirmek istedi ve kendisi için askerlere biat etti, bunun üzerine halife ona şeref cübbesi verdi. Sonra İbn Buya Bağdat'a girdi ve saklandı {kaynak:tarikh-khulafa-minhaj-1434 s. 610-613}. İbn el-Athir'e göre, Bağdat, üç ay yirmi gün süren hükümdarlığıyla Mu'izz el-Dawla'nın yürüyüşüyle karışıklığa düştüğünde Mustakfi ile birlikte saklandı. Sonra ortaya çıktı ve Mu'izz el-Davla onu toprak vergisi ve diğer gelirleri toplamakla görevlendirdi {kaynak: Kamil İbn el-Atir s. 336}. Ve Miskawayh'da, Hicri 334 yılının 2 Safer Cuma günü onun için liderlik kuruldu. Sonra Mu'izz el-Davla'ya yazdı ve el-Muti' adına bakanlık görevini üstlendi. Daha sonra Şaban'da saklandı ve Mu'izz el-Davla'ya karşı savaşında Bağdat'ı yönetmek için Nasır el-Davla ile birlikte gitti {kaynak: Tajarib el-Umam Surush 6. cilt s. 111-125}."
  id: "Juru tulis Tuzun dikirim dari Wasit ke Baghdad, tempat ia memerintah, memberi perintah, dan melarang. Hamdi si pencuri menjamin pencurian di Baghdad dengan imbalan dua puluh lima ribu dinar sebulan, sehingga ia membobol rumah-rumah orang dengan obor dan lilin. Tuzun meninggal selama pemerintahan al-Mustakfi, sehingga Ibn Shirzad menginginkan kerajaan dan bersumpah setia kepada para tentara untuk dirinya sendiri, sehingga khalifah menganugerahkan jubah kehormatan kepadanya. Kemudian Ibn Buya memasuki Baghdad dan bersembunyi {cite:tarikh-khulafa-minhaj-1434 hlm. 610-613}. Menurut Ibn al-Athir, ia bersembunyi bersama al-Mustakfi ketika Baghdad dilanda kekacauan akibat kedatangan Mu'izz al-Dawla, yang pemerintahannya berlangsung selama tiga bulan dan dua puluh hari. Kemudian ia muncul, dan Mu'izz al-Dawla menunjuknya untuk memungut pajak tanah dan pendapatan lainnya {cite:kamil-ibn-al-athir hlm. 336}. Dan di Miskawayh, kepemimpinan ditetapkan untuknya pada hari Jumat, 2 Safar 334 H. Kemudian dia menulis surat kepada Mu’izz al-Dawla dan mendukung al-Muti’ dalam posisi menteri. Kemudian dia bersembunyi di bulan Sya’ban dan pergi bersama Nasir al-Dawla untuk mengelola Baghdad untuknya dalam perangnya melawan Mu’izz al-Dawla {cite:tajarib-al-umam-surush-v6 p. 111-125}."
