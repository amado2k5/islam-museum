  note: "Born in 1861 at Khig, a village a few miles south-west of Maiwand in Kandahar province, as the tradition recorded in the English and Arabic articles gives; she is described as a shepherd's daughter of the Ishaqzai tribe. The English article itself reports that many scholars question her historicity: no contemporary British account mentions her, local records are missing, and her name first appears in print only in the 1920s–1940s; the date is therefore carried with legend status. No place entity exists for Khig, Maiwand or Kandahar, so no born_in relation is written. No source gives a Hijri pairing, so none is recorded."
