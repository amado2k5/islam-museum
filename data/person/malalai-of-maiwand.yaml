summary:
  ar: "بطلة شعبية وطنية أفغانية، يُروى أنها حثّت المقاتلين الأفغان في معركة مايواند في 27 يوليو 1880 وقُتلت هناك في الثامنة عشرة أو التاسعة عشرة من عمرها. قصتها — ابنة راعٍ رفعت الراية الساقطة وأنشدت أبيات اللانداي التي قلبت مسار المعركة — من التراث الوطني الأفغاني؛ ويشكك باحثون معاصرون في كونها شخصية تاريخية أصلا، ولذلك تُحمل تواريخها في هذا السجل بصفة الأسطورة."
  en: "National folk heroine of Afghanistan, said to have rallied Afghan fighters at the Battle of Maiwand on 27 July 1880 and to have been killed there, aged eighteen or nineteen. Her story — a shepherd's daughter who raised the fallen standard and sang the landai couplets that turned the battle — is Afghan national tradition; modern scholarship questions whether she was a historical person at all, and this record carries her dates as legend."
  ur: "افغانستان کی قومی لوک ہیروئن، جن کے بارے میں روایت ہے کہ انہوں نے 27 جولائی 1880ء کو میوند کی جنگ میں افغان جنگجوؤں کو جوش دلایا اور وہیں اٹھارہ یا انیس برس کی عمر میں شہید ہوئیں۔ ان کی کہانی — ایک چرواہے کی بیٹی جس نے گرا ہوا علم اٹھایا اور لانڈائی کے اشعار پڑھ کر جنگ کا رخ موڑ دیا — افغان قومی روایت ہے؛ جدید تحقیق ان کے تاریخی وجود ہی پر سوال اٹھاتی ہے، اس لیے اس ریکارڈ میں ان کی تواریخ اسطوری درجے کے ساتھ درج ہیں۔"
