id: person/husam-al-din-lulu
class: person
label: { ar: "حسام الدين لؤلؤ الحاجب" }
summary:
  ar: "حاجب ومتولي الأسطول بديار مصر في عهد صلاح الدين، وصفه ابن الأثير بأنه كان مظفراً شجاعاً كريماً؛ سنة ثمان وسبعين قاد الأسطول الذي أرسله الملك العادل من مصر فأدرك مراكب الفرنج التي أغارت على ساحل الحجاز عند ساحل الجوزاء، فنزل إليهم وقاتلهم وأخذ خيلاً من الأعراب فقاتلهم فرسانه ورجاله حتى ظفر بهم وقتل أكثرهم وأسر الباقين {cite:kamil-ibn-al-athir p. 117-118}."
  tr: "Salah al-Din döneminde Mısır topraklarındaki filo valisi ve komutanı İbn al-Athir onu zaferli, cesur ve soylu olarak tanımladı; yetmiş sekizinci yılda, Kral el-Adil tarafından Mısır'dan gönderilen filoya liderlik etti ve İkizler kıyısına yakın Hicaz kıyısında baskın yapan Frank gemilerini yakaladı. Onlara indi, onlarla savaştı ve bir grup bedeviyi esir aldı. Atlıları ve adamları onlarla savaştı, ta ki onları yakalayıp çoğunu öldürene ve kalanını esir alana kadar (atıf:kamil-ibn-al-athir s. 117-118}."
  id: "Gubernur dan komandan armada di tanah Mesir pada masa pemerintahan Salah al-Din, Ibn al-Athir menggambarkannya sebagai pemenang, pemberani, dan mulia; pada tahun tujuh puluh delapan, ia memimpin armada yang dikirim oleh Raja al-Adil dari Mesir dan menangkap kapal-kapal Franka yang menyerang pantai Hijaz dekat pantai Gemini. Ia turun ke arah mereka, melawan mereka, dan menangkap sekelompok Badui. Para penunggang kuda dan pasukannya bertempur hingga ia berhasil mengejar mereka, membunuh sebagian besar dari mereka, dan menangkap sisanya {cite:kamil-ibn-al-athir hlm. 117-118}."
