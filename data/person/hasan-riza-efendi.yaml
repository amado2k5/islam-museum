summary:
  ar: "خطاط عثماني (1849–1920) اشتُهر بمصحفه «آية بركنار»؛ كتب تسعة عشر مصحفًا انتشرت طبعاتها في العالم الإسلامي، ونسخ صحيح البخاري في ثمانية مجلدات للسلطان محمد الخامس، وأخذ التعليق عن سامي أفندي والخط عن محمد شفيق بك، ودرّس في مدرسة الخطاطين من سنة 1914."
  en: "Ottoman calligrapher (1849–1920) famed for his Ayet Berkenar mushaf. He wrote nineteen mushafs whose printed editions spread across the Muslim world, copied Sahih al-Bukhari in eight volumes for Sultan Mehmed V, took ta'liq from Sami Efendi and calligraphy from Mehmed Şefik Bey, and taught at the School of Calligraphers from 1914."
  ur: "عثمانی خطاط (1849–1920) جو اپنے «آیت برکنار» مصحف کے لیے مشہور ہیں۔ انہوں نے انیس مصاحف لکھے جن کے مطبوعہ نسخے عالم اسلام میں پھیلے، سلطان محمد خامس کے لیے صحیح بخاری آٹھ جلدوں میں نقل کی، سامي آفندی سے تعلیق اور محمد شفیق بے سے خط سیکھا، اور 1914 سے مدرسۂ خطاطین میں پڑھایا۔"
