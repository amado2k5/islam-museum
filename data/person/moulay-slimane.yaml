summary:
  ar: "مولاي سليمان بن محمد (28 يونيو 1766 – 28 نوفمبر 1822) سلطان المغرب من الأسرة العلوية بين 1792 و1822، وابن السلطان محمد الثالث. كان سلطانًا عالمًا تربّى على أيدي علماء فاس، فانتصر في حرب أهلية دامت سبع سنوات ضد إخوته، وأنهى القرصنة على سواحل المغرب، وعكس سياسة أبيه التجارية المنفتحة فأغلق المملكة في وجه أوروبا مع إبقاء العلاقات وثيقة بالولايات المتحدة التي أهداها سنة 1821 مبنى المفوضية الأمريكية بطنجة. وتأثر بالدعوة الوهابية بعد سنة 1811 فحارب الغلو في تقديس الأولياء ومظاهر التصوف المنحرفة. وبعد هزيمته وأسره المؤقت على يد آيت أومالو سنة 1819 ضعفت سلطته، فتوفي بمراكش وقد عيّن ابن أخيه عبد الرحمن خلفًا له."
  en: "Mawlay Sulayman bin Mohammed (28 June 1766 – 28 November 1822) was the Alawite sultan of Morocco from 1792 to 1822, a son of Sultan Muhammad III. A scholar-sultan formed by the ulama of Fez, he prevailed in a seven-year civil war against his brothers, ended the corsairing that had long operated from Morocco's coast, and reversed his father's open commercial policy, closing the kingdom to Europe while keeping close relations with the United States, to which he gave the Tangier Legation building in 1821. Sympathetic to the Wahhabi call after 1811, he campaigned against excess in the veneration of saints and against Sufi practices he held to be innovations. Defeated and briefly captured by the Ait Umalu in 1819, he died at Marrakesh having designated his nephew Abd al-Rahman as his successor."
  ur: "مولای سلیمان بن محمد (28 جون 1766ء – 28 نومبر 1822ء) 1792ء سے 1822ء تک المغرب کے علوی سلطان اور سلطان محمد سوم کے بیٹے تھے۔ فاس کے علما کی تربیت یافتہ عالم سلطان تھے؛ بھائیوں کے خلاف سات سالہ خانہ جنگی میں کامیاب ہوئے، المغرب کے ساحلوں سے بحری قزاقی ختم کی، اور والد کی کھلی تجارتی پالیسی الٹ کر مملکت کو یورپ کے لیے بند کر دیا، البتہ امریکہ سے قریبی تعلقات رکھے اور 1821ء میں اسے طنجہ میں لیگی شن کی عمارت عطا کی۔ 1811ء کے بعد وہابی دعوت سے متاثر ہو کر اولیا کی تعظیم میں غلو اور صوفیانہ بدعات کے خلاف مہم چلائی۔ 1819ء میں آیت اومالو کے ہاتھوں شکست اور مختصر قید کے بعد ان کی گرفت کمزور پڑ گئی؛ مراکش میں وفات پائی اور بھتیجے عبد الرحمن کو جانشین نامزد کر گئے۔"

