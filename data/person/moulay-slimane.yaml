    note: >-
      No source read names a legal school for the man himself, and
      Wikidata carries only the generic value Islam. The English
      article's text calls him a follower of Wahhabism, citing an
      1857 bulletin, and its infobox files him as Sunni Islam
      (Wahhabism); a movement sympathy named in a single text is not
      the naming of a school in two independent sources. His
      documented practice is stated in full — a sultan of deep
      learning in fiqh who had memorised the Qur'an and wrote on
      hadith and tafsir, he received the letter in which Saud ibn
      Abdulaziz explained the Saudi call in 1811, consulted his
      ulama and sent a scholarly delegation with his son Ibrahim to
      inspect the call on the Hajj, and, persuaded that its essence
      agreed with the teachings of the religion, wrote his
      celebrated letter against excess in venerating the dead,
      condemned music and dance in religious ceremonies, banned
      pilgrimages to saints' shrines and religious festivals, had
      the dome over his father's grave removed in 1812, wrote a
      treatise criticising Sufi practices in 1806 together with a
      sermon on the oneness of God that he ordered distributed to
      the Friday mosques, and closed the Sufi prayer corners. The
      school of his Alawite court was Maliki; that is dynastic
      context, not a naming of the man's own school, so his faith
      is recorded as unknown.
