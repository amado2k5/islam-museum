summary:
  ar: "كوميدية وممثلة وكاتبة بريطانية وُلدت في برمنغهام لأبوين باكستانيين بنجابيين. عملت معلمة علوم قبل الكوميديا، وبرزت بعد 2001 بعروض عن حياة المرأة المسلمة في بريطانيا، وكتبت أعمدة في «الغارديان» و«نيو ستيتسمان» و«ديلي تلغراف» و«فايننشال تايمز» و«دون»، واختارتها بي بي سي ضمن «100 امرأة» سنة 2013، ومن عروضها الجوالة «ذا كارداشيانز ميد مي دو إت» و«كوكونت»."
  en: "British stand-up comedian, actor and columnist, born in Birmingham to Punjabi Pakistani parents. A science teacher before comedy, she came to prominence after 2001 with routines about being a Muslim woman in Britain, has written columns for The Guardian, the New Statesman, The Daily Telegraph, the Financial Times and Dawn, was one of the BBC's 100 Women of 2013, and has toured shows including The Kardashians Made Me Do It and Coconut."
  ur: "برطانوی اسٹینڈ اپ کامیڈین، اداکارہ اور کالم نگار، جو برمنگھم میں پنجابی پاکستانی والدین کے ہاں پیدا ہوئیں۔ کامیڈی سے پہلے سائنس کی استانی رہیں؛ 2001 کے بعد برطانیہ میں ایک مسلمان خاتون کی زندگی پر اپنی پرفارمنس سے شہرت پائی۔ «دی گارڈین»، «نیو سٹیٹس مین»، «ڈیلی ٹیلی گراف»، «فنانشل ٹائمز» اور «ڈان» میں کالم لکھتی رہی ہیں، 2013 میں بی بی سی کی «100 خواتین» میں شامل ہوئیں، اور ان کے معروف شوز میں «دی کارڈیشینز میڈ می ڈو اٹ» اور «کوکونٹ» شامل ہیں۔"
  es: "Humorista, actriz y columnista británica, nacida en Birmingham de padres pakistaníes punjabíes. Profesora de ciencias antes de dedicarse a la comedia, saltó a la fama después de 2001 con rutinas sobre ser una mujer musulmana en Gran Bretaña. Ha escrito columnas para The Guardian, New Statesman, The Daily Telegraph, Financial Times y Dawn, fue una de las 100 mujeres más influyentes de la BBC en 2013 y ha realizado giras con espectáculos como The Kardashians Made Me Do It y Coconut."
  fr: "Humoriste, actrice et chroniqueuse britannique, née à Birmingham de parents pakistanais du Pendjab. Professeure de sciences avant de se lancer dans l'humour, elle s'est fait connaître après 2001 grâce à ses sketches sur le fait d'être une femme musulmane en Grande-Bretagne. Elle a écrit des chroniques pour The Guardian, le New Statesman, le Daily Telegraph, le Financial Times et Dawn, figurait parmi les 100 femmes de l'année 2013 de la BBC et a participé à des tournées avec des spectacles tels que The Kardashians Made Me Do It et Coconut."
  tr: "Birmingham'da doğmuş bir İngiliz komedyen, oyuncu ve yazar, Pencaplı Pakistanlı ebeveynlerden doğmuştur. Komediden önce fen öğretmeni olarak çalıştı ve 2001'den sonra Britanya'daki Müslüman kadınların yaşamlarını konu alan programlarıyla öne çıktı. The Guardian, New Statesman, Daily Telegraph, Financial Times ve Dawn için köşe yazıları yazdı. 2013 yılında BBC tarafından 100 Kadın arasında seçildi. Mobil programları arasında \"The Kardashians Made Me Do\" ve \"Coconut\" bulunuyor."
  id: "Seorang komedian, aktris, dan penulis asal Inggris yang lahir di Birmingham dari orang tua Pakistan berbahasa Punjabi. Dia bekerja sebagai guru sains sebelum komedi, dan setelah tahun 2001 mulai dikenal lewat acara tentang kehidupan perempuan Muslim di Inggris. Dia menulis kolom untuk The Guardian, New Statesman, Daily Telegraph, Financial Times, dan Dawn. Dia terpilih oleh BBC di antara 100 Wanita pada tahun 2013. Acara mobile-nya antara lain \"The Kardashians Made Me Do\" dan \"Coconut.\""

