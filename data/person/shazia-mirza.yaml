summary:
  ar: "كوميدية وممثلة وكاتبة بريطانية وُلدت في برمنغهام لأبوين باكستانيين بنجابيين. عملت معلمة علوم قبل الكوميديا، وبرزت بعد 2001 بعروض عن حياة المرأة المسلمة في بريطانيا، وكتبت أعمدة في «الغارديان» و«نيو ستيتسمان» و«ديلي تلغراف» و«فايننشال تايمز» و«دون»، واختارتها بي بي سي ضمن «100 امرأة» سنة 2013، ومن عروضها الجوالة «ذا كارداشيانز ميد مي دو إت» و«كوكونت»."
  en: "British stand-up comedian, actor and columnist, born in Birmingham to Punjabi Pakistani parents. A science teacher before comedy, she came to prominence after 2001 with routines about being a Muslim woman in Britain, has written columns for The Guardian, the New Statesman, The Daily Telegraph, the Financial Times and Dawn, was one of the BBC's 100 Women of 2013, and has toured shows including The Kardashians Made Me Do It and Coconut."
  ur: "برطانوی اسٹینڈ اپ کامیڈین، اداکارہ اور کالم نگار، جو برمنگھم میں پنجابی پاکستانی والدین کے ہاں پیدا ہوئیں۔ کامیڈی سے پہلے سائنس کی استانی رہیں؛ 2001 کے بعد برطانیہ میں ایک مسلمان خاتون کی زندگی پر اپنی پرفارمنس سے شہرت پائی۔ «دی گارڈین»، «نیو سٹیٹس مین»، «ڈیلی ٹیلی گراف»، «فنانشل ٹائمز» اور «ڈان» میں کالم لکھتی رہی ہیں، 2013 میں بی بی سی کی «100 خواتین» میں شامل ہوئیں، اور ان کے معروف شوز میں «دی کارڈیشینز میڈ می ڈو اٹ» اور «کوکونٹ» شامل ہیں۔"

