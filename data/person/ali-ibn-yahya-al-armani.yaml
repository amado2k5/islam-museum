summary:
  ar: "علي بن يحيى الأرمني، قائد عباسي في عهد المتوكل؛ قاد غزوات الصائفة وأُمر بمحاربة الثائرين، ونقل عنه غنائم سبي كثيرة، وله في الكامل باب مقتله سنة 249هـ."
  en: "Ali ibn Yahya al-Armani, Abbasid commander under al-Mutawakkil; he led the summer raids, was ordered against rebel lands, took many captives, and Ibn al-Athir devotes a heading to his killing in 249 AH."
  es: "Ali ibn Yahya al-Armani, comandante abasí bajo el mando de al-Mutawakkil; dirigió las incursiones de verano, recibió órdenes de atacar tierras rebeldes, tomó muchos cautivos, e Ibn al-Athir dedica un apartado a su muerte en el año 249 de la Hégira."
  fr: "Ali ibn Yahya al-Armani, commandant abbasside sous al-Mutawakkil; il a mené les raids d'été, a reçu l'ordre de combattre les terres rebelles, a fait de nombreux captifs, et Ibn al-Athir consacre un chapitre à sa mort en 249 AH."
  ur: "علی بن یحییٰ الارمانی، المتوکل کے ماتحت عباسی کمانڈر؛ اس نے موسم گرما کے چھاپوں کی قیادت کی، اسے باغیوں کی سرزمینوں کے خلاف حکم دیا گیا، بہت سے قیدی بنائے گئے، اور ابن الثیر نے 249 ہجری میں اس کے قتل کی طرف اشارہ کیا۔"
