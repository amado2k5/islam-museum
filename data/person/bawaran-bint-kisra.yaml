summary:
  ar: "ابنة كسرى، طلب منها رستم والفيرزان أن تكتب لهما أسماء نساء كسرى وسراريه وآل كسرى، ففعلت {cite:tabari-tarikh-abu-al-fadl j.3 p.477}. وعند البلاذري: ملكت بعد هلاك شيرويه إلى أن يبلغ يزدجرد بن شهريار فبعثت إلى المسلمين مهران بن مهربنداذ الهمذاني في اثني عشر ألفاً {cite: futuh-buldan-maarif-1407 ص 354}."
