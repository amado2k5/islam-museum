id: person/bawaran-bint-kisra
class: person
label: { ar: "بوران بنت كسرى" }
summary:
  ar: "ابنة كسرى، طلب منها رستم والفيرزان أن تكتب لهما أسماء نساء كسرى وسراريه وآل كسرى، ففعلت {cite:tabari-tarikh-abu-al-fadl j.3 p.477}. وعند البلاذري: ملكت بعد هلاك شيرويه إلى أن يبلغ يزدجرد بن شهريار فبعثت إلى المسلمين مهران بن مهربنداذ الهمذاني في اثني عشر ألفاً {cite: futuh-buldan-maarif-1407 ص 354}."
  tr: "Khosrow'un kızı Rustam ve al-Farzan, ondan Khosrow'un kadınlarının isimlerini, sırlarını ve Khosrow ailesini yazmasını istedi; o da bunu yaptı {atıf:tabari-tarikh-abu-al-fadl j.3 s.477}. al-Baladhuri'ye göre: Şiruyah'ın ölümünden sonra Yazdegerd bin Shahryar Yezdegherd yaşına gelene kadar hüküm sürdü, bu yüzden Müslümanlara Mehran ibn Mehrbandh al-Hamadhani'yi on iki bin (atıf: futuh-buldan-maarif-1407, s. 354} gönderdi."
  id: "Putri Khosrow, Rustam dan al-Farzan memintanya menulis nama-nama wanita Khosrow, rahasianya, dan keluarga Khosrow, yang ia lakukan {cite:tabari-tarikh-abu-al-fadl j.3 hlm.477}. Menurut al-Baladhuri: Ia memerintah setelah kematian Shiruyah hingga Yazdegerd ibn Shahryar mencapai usia Yazdegerd, sehingga ia mengirimkan kepada umat Muslim Mehran ibn Mehrbandh al-Hamadhani dalam dua belas ribu {cite: futuh-buldan-maarif-1407, hlm. 354}."
