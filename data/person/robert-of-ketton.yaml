summary:
  ar: "روبرت الكيتوني، الراهب الإنجليزي الذي نقل معاني القرآن إلى اللاتينية لأول مرة سنة 1143م، ويسميه نالينو «روبرت الرتيني أو الشستري»، ويذكر أنه كان حيًا سنتي 1141 و1143م ومات في بنبلونة، وأنه ترجم زيج البتاني إلى اللاتينية ووضع على جداوله قوانين لحركات الأجرام على نصف نهار لندن {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 43}."
  en: "Robert of Ketton, the English monk who first rendered the Qur'an into Latin in 1143; Nallino, calling him 'Robertus Retinensis or Cestrensis', says he was alive in 1141 and 1143, died at Pamplona, translated al-Battani's Zij into Latin, and drew up canons for the meridian of London from its tables {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 43}."
  ur: "رابرٹ کیٹونی، انگریز راہب جنہوں نے 1143ء میں پہلی بار قرآن کے معانی لاطینی میں منتقل کیے؛ نالینو انہیں «رابرٹ رتینی یا شستری» کہتے ہیں اور بتاتے ہیں کہ وہ 1141 اور 1143ء میں زندہ تھے، پامپلونا میں فوت ہوئے، البتانی کی زیج کا لاطینی ترجمہ کیا اور اس کی جدولوں پر لندن کے نصف النہار کے قوانین بنائے {cite:nallino-albatenii-opus-astronomicum p. 59}."
  es: "Roberto de Ketton, el monje inglés que tradujo por primera vez el Corán al latín en 1143; Nallino, llamándolo 'Robertus Retinensis o Cestrensis', dice que vivió en 1141 y 1143, murió en Pamplona, tradujo el Zij de al-Battani al latín y elaboró cánones para el meridiano de Londres a partir de sus tablas {citar:nallino-albatenii-opus-astronomicum p. 59} {citar: nallino-albatenii-opus-astronomicum p. 43}."
  fr: "Robert de Ketton, le moine anglais qui fut le premier à traduire le Coran en latin en 1143; Nallino, l'appelant « Robertus Retinensis ou Cestrensis », dit qu'il était vivant en 1141 et 1143, qu'il mourut à Pampelune, qu'il traduisit le Zij d'al-Battani en latin et qu'il rédigea des canons pour le méridien de Londres à partir de ses tables {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 43}."
  tr: "1143 yılında Kur'an'ın anlamlarını ilk kez Latinceye çeviren İngiliz keşiş Robert of the Chitoni'ye Nalino 'Robert the Rattini veya Chester' denmiştir. 1141 ve 1143 yıllarında yaşadığı ve Penblona'da öldüğü belirtilir. Zig al-Bettani'yi Latinceye çevirmiş ve Londra'da öğle vakti bedenlerin hareketi için yasalar eklemiştir {cite:nallino-albatenii-opus-astronomicum s. 59} {cite:nallino-albatenii-opus-astronomicum s. 43}."
  id: "Robert dari Chitoni, biarawan Inggris yang pertama kali menerjemahkan makna Al-Qur'an ke dalam bahasa Latin pada tahun 1143 M, disebut Nalino 'Robert si Rattini atau si Chester.' Disebutkan bahwa ia hidup pada tahun 1141 dan 1143 M dan meninggal di Penblona. Ia menerjemahkan Zig al-Bettani ke dalam bahasa Latin dan memasukkan hukum untuk pergerakan tubuh pada tengah hari di London {cite:nallino-albatenii-opus-astronomicum hlm. 59} {cite:nallino-albatenii-opus-astronomicum hlm. 43}."
