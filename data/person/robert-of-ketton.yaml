summary:
  ar: "روبرت الكيتوني، الراهب الإنجليزي الذي نقل معاني القرآن إلى اللاتينية لأول مرة سنة 1143م، ويسميه نالينو «روبرت الرتيني أو الشستري»، ويذكر أنه كان حيًا سنتي 1141 و1143م ومات في بنبلونة، وأنه ترجم زيج البتاني إلى اللاتينية ووضع على جداوله قوانين لحركات الأجرام على نصف نهار لندن {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 43}."
  en: "Robert of Ketton, the English monk who first rendered the Qur'an into Latin in 1143; Nallino, calling him 'Robertus Retinensis or Cestrensis', says he was alive in 1141 and 1143, died at Pamplona, translated al-Battani's Zij into Latin, and drew up canons for the meridian of London from its tables {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 43}."
  ur: "رابرٹ کیٹونی، انگریز راہب جنہوں نے 1143ء میں پہلی بار قرآن کے معانی لاطینی میں منتقل کیے؛ نالینو انہیں «رابرٹ رتینی یا شستری» کہتے ہیں اور بتاتے ہیں کہ وہ 1141 اور 1143ء میں زندہ تھے، پامپلونا میں فوت ہوئے، البتانی کی زیج کا لاطینی ترجمہ کیا اور اس کی جدولوں پر لندن کے نصف النہار کے قوانین بنائے {cite:nallino-albatenii-opus-astronomicum p. 59}."
