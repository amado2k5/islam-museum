summary:
  ar: هارونا نكوندويغا زعيم الجالية المسلمة في بوروندي ⁦(Comibu)⁩، عمل مع قادة الأديان الآخرين على نشر الوعي الصحي، لا سيما في مكافحة وباء الإيدز، وعلى المصالحة الوطنية.
  en: Haruna Nkunduwiga is a leader of the Muslim Community of Burundi (Comibu), who worked with other faith leaders on public-health awareness — notably against the HIV/AIDS pandemic — and on national
    reconciliation.
  ur: ہارونا نکونڈویگا برونڈی کی مسلم برادری ⁦(Comibu)⁩ کے قائد ہیں جنہوں نے دوسرے مذہبی قائدین کے ساتھ مل کر صحت کی آگاہی — بالخصوص ایچ آئی وی/ایڈز کے خلاف — اور قومی مصالحت پر کام کیا۔
  es: "Haruna Nkunduwiga es un líder de la Comunidad Musulmana de Burundi (Comibu), que trabajó con otros líderes religiosos en la concienciación sobre la salud pública —en particular contra la pandemia del VIH/SIDA— y en la reconciliación nacional."
  fr: "Haruna Nkunduwiga est un dirigeant de la Communauté musulmane du Burundi (Comibu), qui a travaillé avec d'autres chefs religieux sur la sensibilisation à la santé publique — notamment contre la pandémie de VIH/SIDA — et sur la réconciliation nationale."
  tr: "Burundi'deki Müslüman topluluğun (Comibu) lideri Haruna Nkonduiga, özellikle AIDS salgınıyla mücadelede ve ulusal uzlaşma konusunda sağlık farkındalığını artırmak için diğer dini liderlerle birlikte çalıştı."
  id: "Haruna Nkonduiga, pemimpin komunitas Muslim di Burundi (Comibu), bekerja sama dengan pemimpin agama lain untuk meningkatkan kesadaran kesehatan, terutama dalam memerangi epidemi AIDS, dan dalam rekonsiliasi nasional."
