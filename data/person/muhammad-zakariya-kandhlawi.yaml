    note: "Two independent texts state his personal bay'ah and khilafa, which is the lane's test for a sufi segment. The English text states that in 1333 AH (1915) he gave bay'ah at the hand of Khalil Ahmad Saharanpuri, taking him as his spiritual guide, and that his shaykh later conferred khilafah on him in four silsilas — Chishtiyya, Suhrawardiyya, Qadiriyya and Naqshbandiyya — on the Encyclopaedia of Islam's authority as cited there. The Arabic text, independently written, states that he kept to his shaykh Khalil Ahmad, who granted him a general ijaza and made him his khalifa. A Sunni-Hanafi reading is preserved but not recorded as a segment: the English lead calls him a Sunni Hanafi hadith scholar of the Deobandi school, and his student rule of testing hadith against Hanafi fiqh appears in the same article, but no second independent text names Sunni or Hanafi for him — the Urdu and Arabic texts name neither — so the naming rests on one text and stands one attestation short. His tariqa affiliation and his school are kept separate, neither inferred from the other."
