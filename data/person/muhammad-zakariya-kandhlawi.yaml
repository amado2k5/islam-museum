summary:
  ar: "عالم ومحدّث هندي (1898–1982) من كاندهلة، شيخ الحديث في مظاهر علوم سهارانبور وابن أخي محمد إلياس الكاندهلوي مؤسس جماعة التبليغ. بايع خليل أحمد السهارنبوري ونال منه الخلافة، وألّف «أوجز المسالك» و«فضائل أعمال» التي صارت نصاب جماعة التبليغ، وجاور في أواخر حياته المدينة المنورة ودُفن في البقيع."
  en: "Indian scholar and hadith master (1898–1982) of Kandhla, Shaykh al-Hadith of Mazahir Uloom Saharanpur and the nephew of Muhammad Ilyas Kandhlawi, founder of the Tablighi Jamaat. He gave bay'ah to Khalil Ahmad Saharanpuri and received khilafah from him, wrote Awjaz al-Masalik and the Fada'il-e-A'mal that became the Tablighi Jamaat's curriculum, and spent his last years in Medina, where he was buried in al-Baqi."
  ur: "بھارتی عالم اور محدث (1898ء–1982ء) جن کا تعلق کاندھلہ سے تھا، مظاہر علوم سہارنپور کے شیخ الحدیث اور تبلیغی جماعت کے بانی محمد الیاس کاندھلوی کے بھتیجے۔ خلیل احمد سہارنپوری سے بیعت کی اور ان سے خلافت حاصل کی، «اوجز المسالک» اور «فضائل اعمال» تصنیف کیں جو تبلیغی جماعت کا نصاب بنی، اور آخری عمر مدینہ منورہ میں گزاری اور جنت البقیع میں دفن ہوئے۔"
