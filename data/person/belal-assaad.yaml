summary:
  ar: "إمام وداعية أسترالي مقيم في ملبورن، وُلد فيها ودرّس في مدارسها الثانوية مستشارًا أكثر من عقدين. حصل على شهادة في الشريعة والدعوة من معهد الدعوة والإرشاد بطرابلس في لبنان سنة 1995، وهو إمام مسجَّل ومأذون زواج لدى المجلس الإسلامي الأسترالي الاتحادي. يلقي الخطب والمحاضرات منذ أكثر من سبعة وعشرين عامًا، وقناته على يوتيوب (@belal.assaad) بنحو 493 ألف مشترك في أكتوبر 2026."
  en: "An Australian imam and preacher based in Melbourne, where he was born and worked for over two decades as a secondary school teacher and counsellor. He holds a 1995 degree in Shari'ah and Da'wah from the Ad-Da'wah Wal-Irshad University Institute in Tripoli, Lebanon, and is a registered imam and marriage celebrant with the Australian Federation of Islamic Councils. He has delivered sermons and lectures for over twenty-seven years; his YouTube channel (@belal.assaad) had about 493,000 subscribers in October 2026."
  ur: "میلبرن میں مقیم آسٹریلوی امام اور مبلغ؛ وہیں پیدا ہوئے اور دو عشروں سے زائد عرصہ ثانوی اسکولوں میں استاد و مشیر رہے۔ انہوں نے 1995 میں طرابلس، لبنان کے معہد الدعوہ والارشاد سے شریعہ و دعوہ میں ڈگری حاصل کی اور وہ آسٹریلوی فیڈریشن آف اسلامک کونسلوں کے رجسٹرڈ امام اور نکاح خواں ہیں۔ وہ ستائیس برس سے زائد عرصے سے خطبات و محاضرات دے رہے ہیں؛ ان کے یوٹیوب چینل (@belal.assaad) کے سبسکرائبرز اکتوبر 2026 میں تقریباً 493 ہزار تھے۔"
