id: person/bishr-ibn-al-walid-al-kindi
class: person
label: { ar: "بشر بن الوليد الكندي" }
summary:
  ar: "من امتحنهم إسحاق بن إبراهيم في المحنة فأبى أن يقول في القرآن إلا كلام الله، وكتب المأمون في جوابه فادع به فإن تاب فأشهر أمره وإن أصر على شركه ودفع أن يكون القرآن مخلوقاً بكفره وإلحاده فاضرب عنقه {cite:tarikh-khulafa-minhaj-1434 p. 491}. وهو أبو الوليد بشر بن الوليد الكندي من كبار أصحاب الرأي وكان مسنا صليب النسب عفيفا وولي القضاء للمأمون وروى أمالي أبي يوسف المحتوية على ستة وثلاثين كتابا {cite:fihrist-ibn-al-nadim p. 287}"
  en: "One of those examined by Ishaq ibn Ibrahim; he would say only 'God's speech'. Al-Ma'mun's reply: summon him — if he repents, publicize it; if he persists in his shirk and denial that the Quran is created out of kufr and ilhad, strike his neck {cite:tarikh-khulafa-minhaj-1434 p. 491}."
  es: "Uno de los examinados por Ishaq ibn Ibrahim, solo decía: «Es la palabra de Dios». La respuesta de Al-Ma'mun: convócalo; si se arrepiente, hazlo público; si persiste en su politeísmo y en negar que el Corán sea creado a partir de la incredulidad y la idolatría, golpéalo en el cuello {cita: tarikh-khulafa-minhaj-1434 p. 491}."
  fr: "L'un de ceux interrogés par Ishaq ibn Ibrahim ne disait que « parole de Dieu ». Réponse d'Al-Ma'mun: convoquez-le; s'il se repent, annoncez-le publiquement; s'il persiste dans son polythéisme et son déni que le Coran soit issu de la mécréance et de l'ilhad, frappez-le à la nuque {cite: tarikh-khulafa-minhaj-1434 p. 491}."
  ur: "اسحاق بن ابراہیم کے ذریعہ جانچنے والوں میں سے ایک؛ وہ صرف 'خدا کا کلام' کہے گا۔ مامون کا جواب: اسے بلاؤ - اگر وہ توبہ کرے تو اس کی تشہیر کرو۔ اگر وہ اپنے شرک پر اڑے رہے اور اس بات کا انکار کرے کہ قرآن کفر اور الہاد سے پیدا ہوا ہے تو اس کی گردن مارو۔ 491}۔"
  tr: "İshaq bin İbrahim onları sınav sırasında sınadı ve Kur'an'da sadece Allah'ın sözünü söylemeyi reddetti. El-Memun cevabında şöyle yazdı: 'Bunun için dua edin; tövbe ederse, işi ortaya çıkar; ama eğer çürktelikte ısrar eder ve inkar ve ateizmiyle yaratılan Kur'an'ı reddederse, boynunu vurur {atıf:Tarikh-khulafa-minhaj-1434, s. 491}. O, önde gelen görüş alimlerinden biri olan Ebu el-Velid Bişr bin el-Velid el-Kindi'dir; görüş alanının önde gelen alimlerinden biri, yaşlı, farklı soylardan gelen, iffetli ve el-Me'mun için yargıç olarak atanmıştır. Ebu Yusuf'un otuz altı kitaptan oluşan eylemlerini anlatmıştır {atıf:fihrist-ibn-al-nadim s. 287}"
  id: "Ishaq ibn Ibrahim menguji mereka selama persidangan dan menolak mengatakan apa pun dalam Al-Qur'an kecuali firman Tuhan. Al-Ma'mun menulis dalam jawabannya, 'Berdoalahlah; jika dia bertobat, itu akan menjadi publik; tetapi jika dia bersikeras pada politeisme dan menolak Al-Qur'an yang diciptakan oleh ketidakpercayaan dan ateismenya, maka pukul lehernya {cite:Tarikh-khulafa-minhaj-1434, hlm. 491}. Dia adalah Abu al-Walid Bishr ibn al-Walid al-Kindi, salah satu ulama terkemuka dalam pendapat, tua, berdarah lintas garis keturunan, suci, dan hakim yang ditunjuk untuk al-Ma'mun. Dia menceritakan perbuatan Abu Yusuf, yang memuat tiga puluh enam kitab {cite:fihrist-ibn-al-nadim hlm. 287}"
