id: person/bishr-ibn-al-walid-al-kindi
class: person
label: { ar: "بشر بن الوليد الكندي" }
summary:
  ar: "من امتحنهم إسحاق بن إبراهيم في المحنة فأبى أن يقول في القرآن إلا كلام الله، وكتب المأمون في جوابه فادع به فإن تاب فأشهر أمره وإن أصر على شركه ودفع أن يكون القرآن مخلوقاً بكفره وإلحاده فاضرب عنقه {cite:tarikh-khulafa-minhaj-1434 p. 491}. وهو أبو الوليد بشر بن الوليد الكندي من كبار أصحاب الرأي وكان مسنا صليب النسب عفيفا وولي القضاء للمأمون وروى أمالي أبي يوسف المحتوية على ستة وثلاثين كتابا {cite:fihrist-ibn-al-nadim p. 287}"
  en: "One of those examined by Ishaq ibn Ibrahim; he would say only 'God's speech'. Al-Ma'mun's reply: summon him — if he repents, publicize it; if he persists in his shirk and denial that the Quran is created out of kufr and ilhad, strike his neck {cite:tarikh-khulafa-minhaj-1434 p. 491}."
