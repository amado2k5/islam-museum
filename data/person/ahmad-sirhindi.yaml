summary:
  ar: "الشيخ أحمد السرهندي، المعروف بمجدد الألف الثاني، من علماء الصوفية الهنود، وُلد في سرهند سنة 971هـ/1564م، وأخذ الطريقة النقشبندية سنة 1008هـ عن الخواجة باقي بالله، وعارض التشيع والبدع في بلاط جهانكير، وصاحب «المكتوبات» الفارسية، ودعا إلى وحدة الشهود بدلًا من وحدة الوجود، وتوفي ودُفن في سرهند سنة 1034هـ/1624م {cite:encyclopaedia-of-islam-2 vol. 1 p. 319}."
  en: "Shaykh Ahmad Sirhindi, known as Mujaddid-i Alf-i Thani, was a leading Indian divine and Naqshbandi mystic, born at Sirhind in 971/1564. He was initiated into the Naqshbandi order in 1008 by Khwaja Baqi bi'llah, opposed Shi'ism and innovation at the court of Jahangir, and was confined at Gwalior for a time. His Persian Maktubat, letters to disciples, are a classic of orthodox Muslim India; he taught wahdat al-shuhud in place of pantheistic wahdat al-wujud. He died in 1034/1624 and was buried at Sirhind {cite:encyclopaedia-of-islam-2 vol. 1 p. 319}."
  es: "Shaykh Ahmad Sirhindi, conocido como Mujaddid-i Alf-i Thani, fue un destacado teólogo indio y místico naqshbandi, nacido en Sirhind en 971/1564. Fue iniciado en la orden naqshbandi en 1008 por Khwaja Baqi bi'llah, se opuso al chiismo y a la innovación en la corte de Jahangir y estuvo confinado en Gwalior durante un tiempo. Sus Maktubat persas, cartas a sus discípulos, son un clásico de la India musulmana ortodoxa; enseñó wahdat al-shuhud en lugar del panteísta wahdat al-wujud. Murió en 1034/1624 y fue enterrado en Sirhind {cite:encyclopaedia-of-islam-2 vol. 1 p. 319}."
  fr: "Cheikh Ahmad Sirhindi, connu sous le nom de Mujaddid-i Alf-i Thani, était un éminent théologien et mystique naqshbandi indien, né à Sirhind en 971/1564. Initié à l'ordre naqshbandi en 1008 par Khwaja Baqi bi'llah, il s'opposa au chiisme et à l'innovation à la cour de Jahangir et fut un temps exilé à Gwalior. Ses Maktubat persans, lettres à ses disciples, sont un classique de l'Inde musulmane orthodoxe; il enseignait le wahdat al-shuhud en lieu et place du wahdat al-wujud panthéiste. Il mourut en 1034/1624 et fut inhumé à Sirhind (voir: Encyclopaedia of Islam, vol. 1, p. 319)."
  ur: "شیخ احمد سرہندی، جسے مجدد الف ثانی کے نام سے جانا جاتا ہے، ایک معروف ہندوستانی الہی اور نقشبندی صوفی تھے، جو 971/1564 میں سرہند میں پیدا ہوئے۔ اسے 1008 میں نقشبندی حکم میں خواجہ باقی باللہ نے شروع کیا، جہانگیر کے دربار میں شیعہ مذہب اور بدعت کی مخالفت کی، اور کچھ وقت کے لیے گوالیار میں قید رہے۔ ان کے فارسی مکتوبات، شاگردوں کے لیے خطوط، آرتھوڈوکس مسلم انڈیا کی کلاسک ہیں۔ اس نے بت پرستانہ وحدت الوجود کی جگہ وحدت الشہود کی تعلیم دی۔ ان کی وفات 1034/1624 میں ہوئی اور انہیں سرہند میں دفن کیا گیا۔ 1 ص۔ 319}۔"
