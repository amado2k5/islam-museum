summary:
  ar: "الشيخ أحمد السرهندي، المعروف بمجدد الألف الثاني، من علماء الصوفية الهنود، وُلد في سرهند سنة 971هـ/1564م، وأخذ الطريقة النقشبندية سنة 1008هـ عن الخواجة باقي بالله، وعارض التشيع والبدع في بلاط جهانكير، وصاحب «المكتوبات» الفارسية، ودعا إلى وحدة الشهود بدلًا من وحدة الوجود، وتوفي ودُفن في سرهند سنة 1034هـ/1624م {cite:encyclopaedia-of-islam-2 vol. 1 p. 319}."
  en: "Shaykh Ahmad Sirhindi, known as Mujaddid-i Alf-i Thani, was a leading Indian divine and Naqshbandi mystic, born at Sirhind in 971/1564. He was initiated into the Naqshbandi order in 1008 by Khwaja Baqi bi'llah, opposed Shi'ism and innovation at the court of Jahangir, and was confined at Gwalior for a time. His Persian Maktubat, letters to disciples, are a classic of orthodox Muslim India; he taught wahdat al-shuhud in place of pantheistic wahdat al-wujud. He died in 1034/1624 and was buried at Sirhind {cite:encyclopaedia-of-islam-2 vol. 1 p. 319}."
