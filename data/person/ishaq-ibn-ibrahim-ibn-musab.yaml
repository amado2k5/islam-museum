id: person/ishaq-ibn-ibrahim-ibn-musab
class: person
label: { ar: "إسحاق بن إبراهيم بن مصعب", en: "Ishaq ibn Ibrahim ibn Mus'ab", es: "Ishaq ibn Ibrahim ibn Mus'ab", fr: "Ishaq ibn Ibrahim ibn Mus'ab", ur: "اسحاق بن ابراہیم بن مصعب" }
summary:
  ar: "عامل السواد للمتوكل؛ عند البلاذري لما وليه ضم عيون الطف إلى ما في يده فتولى عمالة عشرها وصيرها سوادية وهي على ذلك إلى يوم البلاذري واستخرج عيوناً إسلامية مجرى ما سقت عيونها من الأرضين مجرى عيون الطف."
  en: "al-Mutawakkil's Sawad agent; in al-Baladhuri he annexed the Taff springs to his charge, farmed their tithe, made them Sawadi — as they remained in al-Baladhuri's day — and dug 'Islamic springs' on the same dispensation."
  es: "Agente de Sawad de al-Mutawakkil; en al-Baladhuri anexó los manantiales de Taff a su cargo, cobró el diezmo por ellos, los convirtió en Sawadi —como permanecieron en la época de al-Baladhuri— y excavó 'manantiales islámicos' bajo la misma dispensa."
  fr: "Agent Sawad d'al-Mutawakkil; à al-Baladhuri, il annexa les sources de Taff à sa charge, en exploita la dîme, les rendit Sawadi — comme elles l'étaient encore à l'époque d'al-Baladhuri — et creusa des « sources islamiques » sous la même dispensation."
  ur: "المتوکل کا سواد ایجنٹ؛ البلادھوری میں اس نے ٹاف اسپرنگس کو اپنے چارج میں شامل کیا، ان کا دسواں حصہ لگایا، انہیں سوادی بنایا - جیسا کہ وہ البلادھوری کے زمانے میں رہے - اور اسی نظام پر 'اسلامی چشمے' کھودے۔"
  tr: "Siyah köle Al-Mutawakkil'e atfedildi; Al-Baladhuri'ye göre, onu atadığında, 'Uyoon al-Taff' elindekilere eklendi, böylece onuncusunun yönetimini devraldı ve siyah yaptı; bu da El-Baladhuri gününe kadar böyle kaldı; iki toprak tarafından sulanan toprak kaynakları gibi, el-Taf pınarları gibi İslami kaynaklar çıkardı."
  id: "Budak hitam dikaitkan dengan Al-Mutawakkil; menurut Al-Baladhuri, ketika ia mengangkatnya, 'Uyoon al-Taff' ditambahkan ke apa yang dimilikinya, sehingga ia mengambil alih administrasi kesepuluh dan menjadikannya hitam, dan tetap demikian hingga hari Al-Baladhuri, dan ia mengekstrak mata air Islam seperti mata air bumi yang disiram oleh kedua tanah, seperti mata air al-Taf."
