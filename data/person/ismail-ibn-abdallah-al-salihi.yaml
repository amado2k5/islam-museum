summary:
  ar: "إسماعيل بن عبد الله الصالحي الشيخ الصالح المولَّه؛ جُفّ دماغه بسبب كثرة التلاوة للقرآن في مدرسة الشيخ أبي عمر فزال عقله — وقيل عُشق فعُشق — وكان في جذبه كثير التلاوة ويتكلم بكلمات حسنة، وللناس جميعاً فيه اعتقاد زائد، وكان يلازم الجامع الجديد وجامع الأفرم بالصالحية؛ قال ابن طولون أنشدني: «إذا المرءُ عُوفي في جسمه ومُلِّكَه ... ألقى المطامعَ عن نفسه فذاك الغنيّ وإن مات جوعاً»؛ توفي تاسع عشر رمضان سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 420}."
  en: "The God-intoxicated saint of the Salihiyya — 'his brain dried up from overmuch recitation of the Qur'an in the Abu 'Umar madrasa and his reason departed, or, it was said, he loved and was consumed'; in his rapture he recited constantly and spoke fine words, and all people held him in deep regard, keeping to the New Mosque and the Afram mosque; Ibn Tulun heard him declaim the verse 'he who casts off worldly hopes is rich though he die of hunger'; d. 19 Ramadan 901 {cite:shadharat-dhahab p. 420}."
