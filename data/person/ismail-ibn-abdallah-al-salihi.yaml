summary:
  ar: "إسماعيل بن عبد الله الصالحي الشيخ الصالح المولَّه؛ جُفّ دماغه بسبب كثرة التلاوة للقرآن في مدرسة الشيخ أبي عمر فزال عقله — وقيل عُشق فعُشق — وكان في جذبه كثير التلاوة ويتكلم بكلمات حسنة، وللناس جميعاً فيه اعتقاد زائد، وكان يلازم الجامع الجديد وجامع الأفرم بالصالحية؛ قال ابن طولون أنشدني: «إذا المرءُ عُوفي في جسمه ومُلِّكَه ... ألقى المطامعَ عن نفسه فذاك الغنيّ وإن مات جوعاً»؛ توفي تاسع عشر رمضان سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 420}."
  en: "The God-intoxicated saint of the Salihiyya — 'his brain dried up from overmuch recitation of the Qur'an in the Abu 'Umar madrasa and his reason departed, or, it was said, he loved and was consumed'; in his rapture he recited constantly and spoke fine words, and all people held him in deep regard, keeping to the New Mosque and the Afram mosque; Ibn Tulun heard him declaim the verse 'he who casts off worldly hopes is rich though he die of hunger'; d. 19 Ramadan 901 {cite:shadharat-dhahab p. 420}."
  es: "El santo de la Salihiyya, embriagado por Dios, «su cerebro se secó por la excesiva recitación del Corán en la madrasa de Abu Umar y perdió la razón, o, según se decía, amó y se consumió»; en su éxtasis recitaba constantemente y pronunciaba bellas palabras, y todos lo tenían en profunda estima, permaneciendo en la Mezquita Nueva y la Mezquita Afram; Ibn Tulun lo oyó declamar el versículo «quien abandona las esperanzas mundanas es rico aunque muera de hambre»; murió el 19 de Ramadán de 901 {cita: shadharat-dhahab p. 420}."
  fr: "Le saint de la Salihiyya, ivre de dévotion, aurait vu son esprit s'assécher à force de réciter le Coran à la madrasa d'Abu 'Umar, et sa raison l'abandonner; ou, disait-on, il était consumé par l'amour. Dans son extase, il récitait sans cesse et prononçait des paroles sublimes, et tous le tenaient en haute estime. Il fréquentait assidûment la Mosquée Nouvelle et la mosquée Afram. Ibn Tulun l'entendit déclamer le verset « Celui qui se détourne des espoirs terrestres est riche, même s'il meurt de faim ». Décédé le 19 Ramadan 901 (cf. Hadharat-Dhahab, p. 420)."
  ur: "صالحیہ کے خدا کے نشے میں دھت ولی - 'ابو عمر کے مدرسہ میں قرآن کی کثرت سے تلاوت کرنے سے اس کا دماغ سوکھ گیا اور اس کی وجہ رخصت ہوگئی، یا کہا جاتا ہے کہ وہ محبت کرتا تھا اور کھا جاتا تھا'؛ اپنی بے خودی میں اس نے مسلسل تلاوت کی اور عمدہ الفاظ کہے، اور تمام لوگ اسے نئی مسجد اور افرم مسجد کو مدنظر رکھتے ہوئے گہرا احترام کرتے تھے۔ ابن طولون نے اسے آیت کا اعلان کرتے ہوئے سنا کہ 'جو دنیا کی امیدوں کو ترک کرتا ہے وہ امیر ہے اگرچہ وہ بھوک سے مر جائے'۔ d 19 رمضان 901 {حوالہ: شدّرت ذہب ص۔ 420}۔"
  tr: "Doğru şeyh el-Mawla İsmail ibn Abdullah al-Salhi, Şeyh Ebu Ömer okulunda sık sık Kur'an okuması nedeniyle beyin yıkandı; bu da aklını kaybetmesine yol açtı—bazıları onun tutkulu olduğunu, sonra tutkusuna kapıldığını söyler—ve okumaya çok dikkat eder, iyi sözlerle konuşurdu. Herkes ona aşırı derecede inanırdı. El-Salihiye'deki yeni ve Afram camilerine giderdi. İbn Tulun bana şöyle dedi: \"Bir adam bedeninde ve mülkünde kalırsa...\" Arzularını bir kenara atar, o zengin olan budur, açlıktan ölse bile.\"; Ramazan ayının on dokuzunda 9101 yılında vefat etti {atıf: şadharat-dhahab, s. 420}."
  id: "Ismail ibn Abdullah al-Salhi, sheikh al-Mawla yang berhak itu, dicuci otak karena sering membaca Al-Qur'an di sekolah Sheikh Abu Umar, yang menyebabkan kehilangan akalnya—dan beberapa mengatakan dia bersemangat, lalu jatuh ke dalam gairah—dan dia sangat memperhatikan pembacaan dan berbicara dengan kata-kata baik. Semua orang memiliki kepercayaan berlebihan kepadanya. Dia biasa menghadiri masjid baru dan masjid Al-Afram di al-Salihiyah. Ibn Tulun membacakan kepada saya: \"Jika seseorang tersisa dalam tubuh dan miliknya...\" Dia meninggalkan keinginannya, maka itulah yang kaya, meskipun dia meninggal karena kelaparan.\"; Dia meninggal pada tanggal kesembilan belas Ramadan tahun 9101 {cite:shadharat-dhahab, hlm. 420}."
