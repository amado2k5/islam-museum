id: person/ibn-al-sammak-al-waiz
class: person
label: { ar: "ابن السماك الواعظ البغدادي", en: "Ibn al-Sammak the preacher", es: "Ibn al-Sammak the preacher", fr: "Ibn al-Sammak the preacher", ur: "ابن الصمق مبلغ" }
summary:
  ar: "أحمد بن الحسين بن أحمد أبو الحسين الواعظ، ولد سنة ثلاثين وثلاثمائة؛ وعظ في جامع المنصور وجامع المهدي على طريق المتصوفة، ومن نوادره أنه سُئل عن الأبابيل فقال «ألف سخط الأترى». وذُكر فيمن اتُّهم بالكذب في الحديث مع أبي الفتح المصري. مات في ذي الحجة سنة ٤٢٤ ودُفن بباب حرب {cite:muntazam-ibn-al-jawzi j.8 p.418}."
  tr: "Ahmed ibn al-Husayn ibn Ahmad Abu al-Husayn al-Wa'iz, 330 Hile yılında doğmuş, Sufilerin yolunu takip ederek Al-Mansur Camii ve El-Mehdi Camii'nde vaaz vermiştir. Nadir hikayelerinden biri, Ebiliye hakkında sorulduğunda 'Atariya'nın gazabının bin katı olduğunu söylemesidir. Ebu el-Feth el-Misri ile hadis yatmak suçlananlardan biri olarak da belirtilmiştir. 424 yılında Zhu'l-Hicce'de öldü ve Bab Harb'a defnedildi {atıf:muntazam-ibn-al-jawzi j.8 s.418}."
  id: "Ahmad ibn al-Husayn ibn Ahmad Abu al-Husayn al-Wa'iz, lahir pada tahun 330 H, berkhotbah di Masjid Al-Mansur dan Masjid Al-Mahdi mengikuti jejak para Sufi. Di antara kisah langkanya adalah bahwa ia ditanya tentang Ababil dan berkata, 'Seribu kali murka Atariya.' Ia menyebutkan di antara mereka yang dituduh berbohong dalam hadis bersama Abu al-Fath al-Misri. Ia meninggal di Dhu al-Hijjah pada tahun 424 dan dimakamkan di Bab Harb {cite:muntazam-ibn-al-jawzi j.8 hlm.418}."
