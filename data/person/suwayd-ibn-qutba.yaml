id: person/suwayd-ibn-qutba
class: person
label: { ar: "سويد بن قطب ة الذهلي" }
summary:
  ar: "عند البلاذري: من بكر بن وائل كان بالبصرة ومعه جماعة من قومه يريد أن يفعل بها مثل فعل المثنى بالكوفة فاحتمى فيه خالد عند قتال الأبلة ثم خلّفه على ناحيته قائلاً قد عركنا هذه الأعاجم بناحيتك عركة أذلتهم لك — وقال غير أبي مخنف كان بها قطب ة بن قتادة الذهلي."
  en: "In al-Baladhuri: of Bakr ibn Wa'il, at Basra with a band of his people meaning to do to it what al-Muthanna did to Kufa; Khalid sheltered in his camp at the Ubulla fight, then left him over the district saying 'we have mauled these Persians in your district a mauling that humbles them for you' — per other-than-Abu Mikhnaf, Qutba ibn Qatada al-Dhuhli was there."
  es: "En al-Baladhuri: de Bakr ibn Wa'il, en Basora con un grupo de su gente con la intención de hacerle lo que al-Muthanna le hizo a Kufa; Khalid se refugió en su campamento en la batalla de Ubulla, luego lo dejó al mando del distrito diciendo 'hemos derrotado a estos persas en tu distrito, una derrota que los humilla ante ti' — según otro que no es Abu Mikhnaf, Qutba ibn Qatada al-Dhuhli estaba allí."
  fr: "Dans al-Baladhuri: de Bakr ibn Wa'il, à Bassora avec une bande de ses hommes, avec l'intention de lui faire subir le même sort qu'al-Muthanna à Kufa; Khalid s'abrita dans son camp lors du combat d'Ubulla, puis le laissa sur le district en disant: « Nous avons infligé une défaite cuisante à ces Perses dans votre district, une défaite qui les humilie devant vous » — selon un autre qu'Abu Mikhnaf, Qutba ibn Qatada al-Dhuhli était présent."
