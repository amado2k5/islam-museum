  en: "In al-Baladhuri: of Bakr ibn Wa'il, at Basra with a band of his people meaning to do to it what al-Muthanna did to Kufa; Khalid sheltered in his camp at the Ubulla fight, then left him over the district saying 'we have mauled these Persians in your district a mauling that humbles them for you' — per other-than-Abu Mikhnaf, Qutba ibn Qatada al-Dhuhli was there."
