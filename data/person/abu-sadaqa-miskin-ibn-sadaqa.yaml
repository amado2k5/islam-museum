summary:
  ar: "مغنٍّ مدني ظريف وطفيلي، كان الرشيد يستطرف مزاحه، وتروى عنه نوادر في مجالس الشراب وتقليده للمغني الأعمى أبي زكار. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 48-50}"
  en: "A witty, greedy singer from Medina whom Harun al-Rashid enjoyed teasing; anecdotes include his mimicry of the blind singer Abu Zakkar at drinking parties. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 48-50}"
  ur: "مدینہ کا ایک ظریف اور لالچی گلوکار، جس سے ہارون الرشید لطف اٹھاتے تھے؛ شراب کی محفلوں میں اندھے گلوکار ابو زکار کی نقل اتارنے کے قصے مشہور ہیں۔ {cite:nihayat-al-arab-nuwayri-vol4-scan p. 48-50}"
  es: "Un cantante ingenioso y codicioso de Medina, a quien Harun al-Rashid disfrutaba molestando; entre las anécdotas se incluye su imitación del cantante ciego Abu Zakkar en fiestas. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 48-50}"
  fr: "Un chanteur spirituel et avide de Médine que Harun al-Rashid aimait taquiner; on raconte notamment qu'il imitait le chanteur aveugle Abu Zakkar lors de soirées arrosées. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 48-50}"
  tr: "Esprili ve asalak bir şehir şarkıcısı olan Nuwayri'nin şakaları Raşid tarafından beğenilirdi ve onunla ilgili içki partilerinde anlatılan anekdotlar ve kör şarkıcı Ebu Zakar'ı taklit etmesiyle ilgili bilgiler mevcuttur. {cite:nihayat-al-arab-nuwayri-vol4-scan s. 48-50}"
  id: "Seorang penyanyi kota yang cerdas dan parasit, yang leluconnya dinikmati oleh Al-Rashid, dan anekdot tentangnya diceritakan dalam pesta minum dan peniruannya terhadap penyanyi buta Abu Zakar. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 48-50}"
