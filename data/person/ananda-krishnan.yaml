summary:
  ar: "أناندا كريشنان (1 نيسان 1938 – 28 تشرين الثاني 2024) رجل أعمال ماليزي من أبوين تاميليين، مؤسس مجموعة أوساها تيغاس؛ درس في جامعة ملبورن وكلية هارفارد للأعمال، وبدأ بمشاريع استشارية ونفطية قبل أن يبني إمبراطورية اتصالات وإعلام تضم ماكسيس وأسترو وأقمار ميسات، وكان عند وفاته ثالث أغنى ماليزي بثروة قُدرت بـ5.1 مليار دولار، وعُرف بتحفظه الشديد عن الأضواء وبعطائه التعليمي عبر مؤسسة يو كاي."
  en: "Ananda Krishnan (1 April 1938 – 28 November 2024) was a Malaysian entrepreneur born to Tamil parents, founder of the Usaha Tegas group; educated at the University of Melbourne and Harvard Business School, he moved from consultancy and oil ventures to build a telecommunications and media empire spanning Maxis, Astro and the MEASAT satellites, was at his death Malaysia's third-richest man with an estimated US$5.1 billion, and was known for shunning publicity and for educational giving through the Yu Cai Foundation."
  ur: "آنندا کرشنن (1 اپریل 1938 – 28 نومبر 2024) تامل والدین کے ہاں پیدا ہونے والے ملائیشیائی کاروباری تھے، اوساہا تیگاس گروپ کے بانی؛ انھوں نے یونیورسٹی آف میلبورن اور ہارورڈ بزنس اسکول سے تعلیم پائی، مشاورت و تیل کے کاروبار سے آگے بڑھ کر میکسس، ایسٹرو اور میسات سیٹلائٹس پر مشتمل ٹیلی کمیونیکیشن و میڈیا سلطنت بنائی، وفات کے وقت 5.1 ارب ڈالر کے تخمینے کے ساتھ ملائیشیا کے تیسرے امیر ترین فرد تھے، اور شہرت سے گریز اور یو کائی فاؤنڈیشن کے ذریعے تعلیمی عطیات کے لیے معروف تھے۔"
