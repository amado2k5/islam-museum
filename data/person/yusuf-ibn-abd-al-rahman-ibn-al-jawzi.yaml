summary:
  ar: "يوسف بن عبد الرحمن بن علي ابن الجوزي، محيي الدين أبو المحاسن، ابن العلامة أبي الفرج، أستاذ دار الخلافة المستعصمية وسفيرها من أهل بغداد، تفقه على أبيه، وأنشأ المدرسة الجوزية بدمشق، وقتله التتار مع أولاده الثلاثة يوم دخول هولاكو بغداد، ٥٨٠ إلى ٦٥٦هـ الموافقة ١١٨٥ إلى ١٢٥٨م."
  en: "Yusuf ibn Abd al-Rahman ibn Ali Ibn al-Jawzi, Muhyi al-Din Abu al-Mahasin, son of the scholar Abu al-Faraj, a Baghdadi who was ustadh al-dar and envoy of the caliphate of al-Musta'sim; he studied jurisprudence under his father, founded the Jawziyya school in Damascus and was killed by the Mongols with his three sons when Hulagu entered Baghdad; 580 to 656 AH, 1185 to 1258 CE."
