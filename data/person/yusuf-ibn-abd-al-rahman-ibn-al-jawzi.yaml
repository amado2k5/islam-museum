summary:
  ar: "يوسف بن عبد الرحمن بن علي ابن الجوزي، محيي الدين أبو المحاسن، ابن العلامة أبي الفرج، أستاذ دار الخلافة المستعصمية وسفيرها من أهل بغداد، تفقه على أبيه، وأنشأ المدرسة الجوزية بدمشق، وقتله التتار مع أولاده الثلاثة يوم دخول هولاكو بغداد، ٥٨٠ إلى ٦٥٦هـ الموافقة ١١٨٥ إلى ١٢٥٨م."
  en: "Yusuf ibn Abd al-Rahman ibn Ali Ibn al-Jawzi, Muhyi al-Din Abu al-Mahasin, son of the scholar Abu al-Faraj, a Baghdadi who was ustadh al-dar and envoy of the caliphate of al-Musta'sim; he studied jurisprudence under his father, founded the Jawziyya school in Damascus and was killed by the Mongols with his three sons when Hulagu entered Baghdad; 580 to 656 AH, 1185 to 1258 CE."
  es: "Yusuf ibn Abd al-Rahman ibn Ali Ibn al-Jawzi, Muhyi al-Din Abu al-Mahasin, hijo del erudito Abu al-Faraj, un bagdadí que fue ustadh al-dar y enviado del califato de al-Musta'sim; estudió jurisprudencia con su padre, fundó la escuela Jawziyya en Damasco y fue asesinado por los mongoles junto con sus tres hijos cuando Hulagu entró en Bagdad; 580 a 656 AH, 1185 a 1258 CE."
  fr: "Yusuf ibn Abd al-Rahman ibn Ali Ibn al-Jawzi, Muhyi al-Din Abu al-Mahasin, fils du savant Abu al-Faraj, un Bagdadi qui fut ustadh al-dar et envoyé du califat d'al-Musta'sim; il étudia la jurisprudence auprès de son père, fonda l'école Jawziyya à Damas et fut tué par les Mongols avec ses trois fils lorsque Hulagu entra à Bagdad; 580 à 656 AH, 1185 à 1258 CE."
  ur: "یوسف بن عبدالرحمن بن علی ابن الجوزی، محی الدین ابو المحسین، عالم ابو الفراج کا بیٹا، ایک بغدادی جو استاذ الدار اور خلافت المستسم کا ایلچی تھا؛ اس نے اپنے والد کے ماتحت فقہ کی تعلیم حاصل کی، دمشق میں جوزیہ اسکول کی بنیاد رکھی اور جب ہلاگو بغداد میں داخل ہوا تو اپنے تین بیٹوں کے ساتھ منگولوں کے ہاتھوں مارا گیا۔ 580 تا 656 ہجری، 1185 تا 1258 عیسوی۔"
