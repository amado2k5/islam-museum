summary:
  ar: "داعية إندونيسي، وُلد في كودوس في 14 مايو 1979، وتخرّج في معهد دار الشهادة ثم درس في كلية الشريعة بمعهد العلوم الإسلامية والعربية ⁦(ليبيا)⁩. أسّس منصة شاميلا للدروس، وعُرف بسلاسله الموضوعية ولا سيما في أشراط الساعة، وله عدة كتب. بلغت قناته على يوتيوب 655,000 مشترك و55,122,917 مشاهدة و1,223 مقطعًا بحسب vidIQ كما في 14 نوفمبر 2026."
  en: "Indonesian preacher, born in Kudus on 14 May 1979; he graduated from the Darusy Syahadah pesantren and then studied at the Faculty of Sharia of LIPIA. He founded the Syameela study platform and is known for his thematic lecture series, in particular on eschatology, and has written several books. His YouTube channel counted 655,000 subscribers, 55,122,917 views and 1,223 videos as read by vidIQ on 14 November 2026."
  ur: "انڈونیشی مبلغ، جو 14 مئی 1979ء کو کودوس میں پیدا ہوئے؛ انہوں نے دار الشہادہ مدرسے سے فراغت کے بعد LIPIA کی کلیۂ شریعت میں تعلیم حاصل کی۔ انہوں نے شامیلا مطالعاتی پلیٹ فارم قائم کیا اور وہ اپنے موضوعاتی دروس، خصوصاً اشراطِ ساعت کے سلسلے، کے لیے جانے جاتے ہیں اور کئی کتابیں لکھ چکے ہیں۔ 14 نومبر 2026ء کی vidIQ قرأت کے مطابق ان کے یوٹیوب چینل کے سبسکرائبر 655,000، ویوز 55,122,917 اور ویڈیوز 1,223 تھیں۔"
