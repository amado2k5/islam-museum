summary:
  ar: "الملك الناصر أبو السعادات محمد بن السلطان قايتباي؛ بويع بالسلطنة قبل موت أبيه بيوم وهو في سن البلوغ سنة إحدى وتسعمائة فأقام ستة أشهر ويومين ثم خُلع، فتولى الملك الأشرف قانصوه الغوري نحو أحد عشر يوماً ثم تحرك عليه العسكر فهرب إلى غزة وفُقد في وقعة خان يونس، فعاد الملك الناصر بعد ثبوت رشده فأقام سنة وستة أشهر ونصف شهر ثم قُتل شر قتلة قبل غروب شمس يوم الأربعاء خامس عشر ربيع الأول سنة أربع وتسعمائة، ويحكى عنه في مصادر المؤرخ أمور قبيحة {cite:shadharat-dhahab p. 425, 439}."
  en: "Qaytbay's son, acclaimed a day before his father's death in 901 while just of age; deposed after six months and two days, restored after al-Ghuri's eleven days and disappearance at Khan Yunus, reigned a year and a half more, then killed before sunset on Wednesday 15 Rabi' I 904 — the chronicles relate ugly things of him {cite:shadharat-dhahab p. 425, 439}."
