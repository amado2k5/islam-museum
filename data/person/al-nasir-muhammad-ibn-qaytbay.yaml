summary:
  ar: "الملك الناصر أبو السعادات محمد بن السلطان قايتباي؛ بويع بالسلطنة قبل موت أبيه بيوم وهو في سن البلوغ سنة إحدى وتسعمائة فأقام ستة أشهر ويومين ثم خُلع، فتولى الملك الأشرف قانصوه الغوري نحو أحد عشر يوماً ثم تحرك عليه العسكر فهرب إلى غزة وفُقد في وقعة خان يونس، فعاد الملك الناصر بعد ثبوت رشده فأقام سنة وستة أشهر ونصف شهر ثم قُتل شر قتلة قبل غروب شمس يوم الأربعاء خامس عشر ربيع الأول سنة أربع وتسعمائة، ويحكى عنه في مصادر المؤرخ أمور قبيحة {cite:shadharat-dhahab p. 425, 439}."
  en: "Qaytbay's son, acclaimed a day before his father's death in 901 while just of age; deposed after six months and two days, restored after al-Ghuri's eleven days and disappearance at Khan Yunus, reigned a year and a half more, then killed before sunset on Wednesday 15 Rabi' I 904 — the chronicles relate ugly things of him {cite:shadharat-dhahab p. 425, 439}."
  fr: "Le fils de Qaytbay, acclamé un jour avant la mort de son père en 901 alors qu'il était tout jeune ; déposé après six mois et deux jours, restauré après les onze jours d'al-Ghuri et sa disparition à Khan Yunus, a régné un an et demi plus, puis tué avant le coucher du soleil le mercredi 15 Rabi 'I 904 - les chroniques racontent des choses laides de lui {cite:shadharat-dhahab p. 425, 439}."
  es: "El hijo de Qaytbay, aclamado un día antes de la muerte de su padre en 901, cuando apenas había alcanzado la mayoría de edad; depuesto después de seis meses y dos días, restaurado después de los once días de al-Ghuri y su desaparición en Khan Yunus, reinó un año y medio más, y luego asesinado antes de la puesta del sol del miércoles 15 Rabi' I de 904; las crónicas relatan cosas feas sobre él {cite:shadharat-dhahab p. 425, 439}."
  ur: "قیتبے کا بیٹا، 901 میں اپنے والد کی موت سے ایک دن قبل، صرف اس کی عمر میں؛ چھ ماہ اور دو دن کے بعد معزول کیا گیا، الغوری کے گیارہ دنوں کے بعد بحال ہوا اور خان یونس کی گمشدگی کے بعد ڈیڑھ سال حکومت کی، پھر بدھ 15 ربیع الثانی 904 کو غروب آفتاب سے پہلے قتل کر دیا گیا۔ 425، 439}۔"
  tr: "Kral El-Nasir Ebu el-Sedat Muhammed bin Sultan Kaitbey; babasının ölümünden bir gün önce bin dokuz yüz yirmi bir yaşında sultanlığa bağlılık yemini etti, altı ay iki gün kaldı ve ardından tahttan indirildi. Kral el-Eşref Qansuh el-Guri yaklaşık on bir gün el-Ghuri valiliğini elinde tuttu, ardından ordu ona karşı harekete geçti, Gazze'ye kaçtı ve Han Yunis Savaşı'nda ortadan kayboldu. Kral el-Nasir kutsallığını onayladıktan sonra geri döndü, bir yıl, altı ay buçuk ay kaldı, ardından katillerini gün batımından önce öldürdü; bu, dokuz yüz kırk dört yılın Rebi'l-Avval'ının on beşinci günü. Tarihçiler onun hakkında çirkin olaylar anlatır {atıf:shadharat-dhahab, s. 425, 439}."
  id: "Raja Al-Nasir Abu al-Sa'adat Muhammad ibn Sultan Qaitbay; ia disumpah setia kepada kesultanan sehari sebelum kematian ayahnya pada usia seribu dua puluh satu tahun, tinggal selama enam bulan dua hari, lalu digulingkan. Raja al-Ashraf Qansuh al-Ghuri memegang jabatan gubernur al-Ghuri selama sekitar sebelas hari, kemudian pasukan bergerak melawannya, melarikan diri ke Gaza, dan menghilang dalam Pertempuran Khan Yunis. Raja al-Nasir kembali setelah memastikan kesuciannya, tinggal selama satu tahun, enam bulan, setengah bulan, lalu membunuh pembunuhnya sebelum matahari terbenam pada hari Rabu, tanggal lima belas Rabi' al-Awwal tahun sembilan ratus empat puluh empat. Para sejarawan menceritakan hal-hal buruk tentang dirinya {cite:shadharat-dhahab, hlm. 425, 439}."
