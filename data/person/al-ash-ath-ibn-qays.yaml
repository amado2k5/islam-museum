summary:
  ar: "سيد من كندة كنيته أبو محمد ولقبه عرف النار؛ ارتد في خلافة أبي بكر فتحصن هو وعظماء كندة بالنجير فحاصره زياد بن لبيد والمهاجر بن أبي أمية حتى جُهدوا، فطلب الأمان لعدّة منهم وأخرج نفسه من العدّة فأتي به أبو بكر فقال «إنا قاتلوك لأنه لا أمان لك إذ أخرجت نفسك من العدة» فقال «بل تمن عليّ يا خليفة رسول الله وتزوجني» فمنّ عليه وزوجه أخته أم فروة بنت أبي قحافة (وقيل قريبة) فولدت له محمداً وإسحاق وقريبة وحبابة وجعدة، وأقام بالمدينة ثم سار إلى الشام والعراق غازياً، ومات بالكوفة وصلى عليه الحسن بن علي بن أبي طالب بعد صلحه معاوية؛ وكان أبو بكر نادماً على إبقائه إذ قال «وددت أني يوم أُتيت بالأشعث بن قيس ضربت عنقه فإنه تخيل إليّ أنه لا يرى شراً إلا سعى فيه وأعان عليه»؛ واستسلف من تجار المدينة فداء سبايا النجير — أربعمائة درهم للرأس — ففداهم ثم ردّه لهم؛ ولما تزوجها أتى السوق فلما يربحها جزوراً إلا كشف عرقوبيها وأعطى ثمنها وأطعمها الناس."
  en: "A lord of Kinda, kunya Abu Muhammad, nicknamed 'Urf al-Nar; he apostatized under Abu Bakr and fortified himself with the chiefs of Kinda in al-Nujayr, which Ziyad ibn Labid and al-Muhajir ibn Abi Umayya besieged until they were exhausted, whereupon he asked safety for a number of them leaving himself out of the count; brought to Abu Bakr, who told him 'we fight you, for there is no safety for you having excluded yourself', he answered 'rather favour me, O caliph of God's messenger, and marry me' — so he spared him and married him to his sister Umm Farwa bint Abi Quhafa (some say Qurayba), who bore him Muhammad, Ishaq, Qurayba, Hubaba and Ja'da; he stayed in Medina then went to Syria and Iraq as a campaigner, died at Kufa, and al-Hasan ibn Ali prayed over him after his peace with Mu'awiya; Abu Bakr later regretted sparing him — 'I wish that the day al-Ash'ath was brought to me I had struck his neck, for it came to me that he sees no evil but hastens to it and aids it'; he borrowed from Medina's merchants the ransom of al-Nujayr's captives — four hundred dirhams a head — redeemed them and repaid it; and when he married her he went to the market and finding no camel to profit her uncovered her shanks, paid its price and fed the people."
