summary:
  ar: "سيد من كندة كنيته أبو محمد ولقبه عرف النار؛ ارتد في خلافة أبي بكر فتحصن هو وعظماء كندة بالنجير فحاصره زياد بن لبيد والمهاجر بن أبي أمية حتى جُهدوا، فطلب الأمان لعدّة منهم وأخرج نفسه من العدّة فأتي به أبو بكر فقال «إنا قاتلوك لأنه لا أمان لك إذ أخرجت نفسك من العدة» فقال «بل تمن عليّ يا خليفة رسول الله وتزوجني» فمنّ عليه وزوجه أخته أم فروة بنت أبي قحافة ⁦(وقيل قريبة)⁩ فولدت له محمداً وإسحاق وقريبة وحبابة وجعدة، وأقام بالمدينة ثم سار إلى الشام والعراق غازياً، ومات بالكوفة وصلى عليه الحسن بن علي بن أبي طالب بعد صلحه معاوية؛ وكان أبو بكر نادماً على إبقائه إذ قال «وددت أني يوم أُتيت بالأشعث بن قيس ضربت عنقه فإنه تخيل إليّ أنه لا يرى شراً إلا سعى فيه وأعان عليه»؛ واستسلف من تجار المدينة فداء سبايا النجير — أربعمائة درهم للرأس — ففداهم ثم ردّه لهم؛ ولما تزوجها أتى السوق فلما يربحها جزوراً إلا كشف عرقوبيها وأعطى ثمنها وأطعمها الناس."
  en: "A lord of Kinda, kunya Abu Muhammad, nicknamed 'Urf al-Nar; he apostatized under Abu Bakr and fortified himself with the chiefs of Kinda in al-Nujayr, which Ziyad ibn Labid and al-Muhajir ibn Abi Umayya besieged until they were exhausted, whereupon he asked safety for a number of them leaving himself out of the count; brought to Abu Bakr, who told him 'we fight you, for there is no safety for you having excluded yourself', he answered 'rather favour me, O caliph of God's messenger, and marry me' — so he spared him and married him to his sister Umm Farwa bint Abi Quhafa (some say Qurayba), who bore him Muhammad, Ishaq, Qurayba, Hubaba and Ja'da; he stayed in Medina then went to Syria and Iraq as a campaigner, died at Kufa, and al-Hasan ibn Ali prayed over him after his peace with Mu'awiya; Abu Bakr later regretted sparing him — 'I wish that the day al-Ash'ath was brought to me I had struck his neck, for it came to me that he sees no evil but hastens to it and aids it'; he borrowed from Medina's merchants the ransom of al-Nujayr's captives — four hundred dirhams a head — redeemed them and repaid it; and when he married her he went to the market and finding no camel to profit her uncovered her shanks, paid its price and fed the people."
  fr: "Seigneur de Kinda, portant la kunya Abu Muhammad, surnommé ‘Urf al-Nar ; il apostasia sous Abu Bakr et se retrancha avec les chefs de Kinda à al-Nujayr, où Ziyad ibn Labid et al-Muhajir ibn Abi Umayya les assiégèrent jusqu’à épuisement. Il demanda alors la sécurité pour un certain nombre d’entre eux, sans se compter lui-même ; conduit à Abu Bakr, qui lui dit : « Nous te combattons, car tu n’as aucune garantie de sécurité, t’étant exclu toi-même », il répondit : « Fais-moi plutôt grâce, ô calife du Messager de Dieu, et marie-moi. » Il l’épargna donc et lui donna sa sœur Umm Farwa bint Abi Quhafa (certains disent Qurayba), qui lui donna Muhammad, Ishaq, Qurayba, Hubaba et Ja’da. Il resta à Médine, puis partit combattre en Syrie et en Irak, mourut à Kufa et al-Hasan ibn Ali pria sur lui après sa paix avec Mu’awiya. Abu Bakr regretta plus tard de l’avoir épargné : « J’aurais voulu, le jour où al-Ash’ath me fut amené, lui avoir tranché le cou, car il m’est parvenu qu’il ne voit aucun mal sans s’y précipiter et l’aider. » Il emprunta aux marchands de Médine la rançon des captifs d’al-Nujayr — quatre cents dirhams par personne —, les racheta et remboursa ; lors de son mariage, il alla au marché et, ne trouvant pas de chameau dont la faire profiter, lui découvrit les jarrets, en paya le prix et nourrit les gens."
  es: "Un señor de Kinda, kunya Abu Muhammad, apodado 'Urf al-Nar; apostató bajo Abu Bakr y se fortificó con los jefes de Kinda en al-Nujayr, que Ziyad ibn Labid y al-Muhajir ibn Abi Umayya sitiaron hasta que se agotaron, entonces pidió protección para varios de ellos, excluyéndose a sí mismo; llevado ante Abu Bakr, quien le dijo 'luchamos contra ti, pues no hay seguridad para ti al haberte excluido', él respondió 'más bien favoréceme, oh califa del mensajero de Dios, y cásate conmigo', así que lo perdonó y lo casó con su hermana Umm Farwa bint Abi Quhafa (algunos dicen Qurayba), quien le dio a luz a Muhammad, Ishaq, Qurayba, Hubaba y Ja'da; se quedó en Medina y luego fue a Siria e Irak como combatiente, murió en Kufa, y al-Hasan ibn Ali oró por él después de su paz con Mu'awiya; Más tarde, Abu Bakr lamentó haberle perdonado la vida: «Ojalá el día que me trajeron a al-Ash'ath le hubiera cortado el cuello, pues me di cuenta de que no ve el mal, sino que se apresura a cometerlo y lo fomenta». Pidió prestado a los mercaderes de Medina el rescate de los cautivos de al-Nujayr —cuatrocientos dirhams por cabeza—, los rescató y lo devolvió; y cuando se casó con ella, fue al mercado y, al no encontrar ningún camello que le reportara beneficios, le descubrió las piernas, pagó su precio y alimentó al pueblo."
  ur: "کندہ کا ایک رب، کنیا ابو محمد، عرف النار؛ اس نے ابوبکر کے ماتحت مرتد کیا اور النجیر میں کندہ کے سرداروں کے ساتھ مل کر اپنے آپ کو مضبوط کر لیا، جنہیں زیاد بن لبید اور المہاجر ابن ابی امیہ نے محاصرہ کیا یہاں تک کہ وہ تھک گئے، اس کے بعد اس نے ان میں سے بہت سے لوگوں کی حفاظت کی درخواست کی اور اپنے آپ کو گنتی سے باہر کر دیا۔ ابوبکر کے پاس لائے، انہوں نے ان سے کہا کہ 'ہم آپ سے لڑتے ہیں، کیونکہ آپ کو خارج کرنے سے آپ کے لیے کوئی سلامتی نہیں ہے'، انھوں نے جواب دیا 'اے خلیفہ خدا کے رسول، مجھ پر احسان کریں اور مجھ سے شادی کر لیں'، تو آپ نے اسے بچا لیا اور اپنی بہن ام فروہ بنت ابی قحافہ ⁦(کچھ لوگ کہتے ہیں کہ قریبہ)⁩ سے اس کا نکاح کر دیا، جس سے آپ کو محمد، قطب جبہ، اسحاق، ابن عباس ما پیدا ہوئے۔ وہ مدینہ میں رہے پھر شام اور عراق میں ایک مہم جو کے طور پر گئے، کوفہ میں وفات پائی، اور حسن بن علی نے معاویہ کے ساتھ صلح کے بعد ان پر نماز پڑھی۔ ابوبکر نے بعد میں اسے چھوڑنے پر افسوس کیا - 'کاش جس دن اشعث میرے پاس لایا جاتا میں اس کی گردن مارتا، کیونکہ مجھے یہ بات پہنچی کہ وہ کوئی برائی نہیں دیکھتا لیکن اس کی طرف جلدی کرتا ہے اور اس کی مدد کرتا ہے'؛ اس نے مدینہ کے تاجروں سے النجیر کے اسیروں کا فدیہ لیا - چار سو درہم ایک سر - انہیں چھڑایا اور اسے ادا کیا۔ اور جب اس نے اس سے شادی کر لی تو بازار گیا اور کوئی اونٹ نہ پایا کہ اس کی پنڈلی کھول دی، اس کی قیمت ادا کی اور لوگوں کو کھانا کھلایا۔"
  tr: "Kinda'dan, lakabı Ebu Muhammed ve unvanı Araf el-Nar olan bir lider, Ebu Bekir'in halifeliği döneminde dinden döndü. Kendisi ve Kinda'nın ileri gelenleri Necir'de tahkim oldular ve Ziyad ibn Labid ile el-Muhacir ibn Ebu Umeyye onu kuşattılar, ta ki yorulana kadar. Birkaçının güvenli geçişini istedi ve kendisini gruptan ayırdı. Ebu Bekir onu getirdi ve \"Seni öldüreceğiz çünkü kendini gruptan ayırdığın için güvenli geçişin yok\" dedi. O da, \"Bunun yerine, bana bir iyilik yap, ey Allah'ın Resulü'nün halifesi, benimle evlen\" dedi. Bunun üzerine Ebu Bekir ona bir iyilik yaptı ve onu kız kardeşi Ümmü Farva bint Ebu Kuhafa (ve rivayete göre Kariba) ile evlendirdi. Ümmü Farva ona Muhammed, İshak, Kariba, Hababa ve Ca'da'yı doğurdu. Medine'de kaldı, sonra Suriye ve Irak'a savaşçı olarak gitti ve Kufa'da öldü. Hasan ibn Ali ibn Abi Talib, Muaviye ile barıştıktan sonra onun için dua etti. Ebu Bekir onu yanında tuttuğuna pişman oldu ve şöyle dedi: \"Keşke Eşat ibn Kays bana getirildiği gün onun kafasını kesseydim, çünkü bana öyle geldi ki, kötülük görmediği sürece kötülük aradı ve ona yardım etti.\" Necir esirlerinin fidyesi için şehrin tüccarlarından kişi başı dört yüz dirhem borç aldı, onları kurtardı ve sonra parayı onlara geri verdi; ve onunla evlendiğinde pazara gitti ve bir deve satın almadan önce ayaklarını açtı, fiyatını verdi ve halka yedirdi."
  id: "Seorang pemimpin dari Kinda, yang dijuluki Abu Muhammad dan bergelar Araf al-Nar, murtad selama kekhalifahan Abu Bakr. Ia dan para tokoh besar Kinda membentengi diri di al-Najir, dan Ziyad ibn Labid serta al-Muhajir ibn Abi Umayya mengepungnya hingga mereka kelelahan. Ia meminta jalan aman bagi beberapa dari mereka dan memisahkan diri dari kelompok tersebut. Abu Bakr membawanya dan berkata, “Kami akan membunuhmu karena kau tidak mendapat jalan aman sejak kau memisahkan diri dari kelompok.” Ia berkata, “Sebaliknya, berikanlah aku suatu kebaikan, wahai Khalifah Rasulullah, dan nikahkanlah aku.” Maka Abu Bakr mengabulkannya dan menikahkan dia dengan saudara perempuannya, Umm Farwa bint Abi Quhafa (dan ada juga yang mengatakan, Qariba). Ia melahirkan Muhammad, Ishaq, Qariba, Hababa, dan Ja’da. Ia tinggal di Madinah, kemudian pergi ke Suriah dan Irak sebagai seorang pejuang, dan meninggal di Kufa. Al-Hasan ibn Ali ibn Abi Talib mendoakannya setelah berdamai dengan Muawiya. Abu Bakr menyesal telah menahannya, dan berkata, “Seandainya pada hari al-Ash’ath ibn Qays dibawa kepadaku, aku telah memenggal kepalanya, karena bagiku dia tidak melihat kejahatan kecuali dia mencarinya dan membantu di dalamnya.” Dia meminjam uang tebusan dari para pedagang kota untuk tawanan Najir — empat ratus dirham per orang — lalu dia menebus mereka dan kemudian mengembalikannya; dan ketika dia menikahinya, dia datang ke pasar dan tidak membeli seekor unta pun kecuali dia membuka kaki belakangnya dan memberikan harganya lalu memberi makan unta itu kepada orang-orang."
