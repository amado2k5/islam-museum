summary:
  ar: "محدث إندونيسي ⁦(1868–1920)⁩ من جزيرة جاوة، استقر في مكة المكرمة ودرّس في مسجدها الحرام. من أعلام الإسناد في جنوب شرق آسيا، ومن مؤلفاته «منهج ذوي النظر في شرح منظومة علم الأثر» على متن الترمذي، و«كفاية المستفيد» و«موهبة ذي الفضل» في الحديث وعلومه."
  en: "Indonesian hadith scholar (1868–1920) from Java, settled in Mecca where he taught in the Sacred Mosque. A leading authority of isnad in Southeast Asia; his works include Manhaj Dhawi al-Nazar, a commentary on Tirmidhi's versified hadith text, Kifayat al-Mustafid and Mawhibat Dhi al-Fadl."
  ur: "جاوا کے انڈونیشیائی محدث ⁦(1868–1920)⁩ جو مکہ مکرمہ میں مستقر ہوئے اور مسجد الحرام میں تدریس کی۔ جنوب مشرقی ایشیا میں علمِ اسناد کے ممتاز ماہرین میں؛ ان کی تصانیف میں ترمذی کی منظومہ متن کی شرح «منہج ذوی النظر»، «کفایۃ المستفید» اور «موہبۃ ذی الفضل» شامل ہیں۔"
