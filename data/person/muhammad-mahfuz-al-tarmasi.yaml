summary:
  ar: "محدث إندونيسي ⁦(1868–1920)⁩ من جزيرة جاوة، استقر في مكة المكرمة ودرّس في مسجدها الحرام. من أعلام الإسناد في جنوب شرق آسيا، ومن مؤلفاته «منهج ذوي النظر في شرح منظومة علم الأثر» على متن الترمذي، و«كفاية المستفيد» و«موهبة ذي الفضل» في الحديث وعلومه."
  en: "Indonesian hadith scholar (1868–1920) from Java, settled in Mecca where he taught in the Sacred Mosque. A leading authority of isnad in Southeast Asia; his works include Manhaj Dhawi al-Nazar, a commentary on Tirmidhi's versified hadith text, Kifayat al-Mustafid and Mawhibat Dhi al-Fadl."
  ur: "جاوا کے انڈونیشیائی محدث ⁦(1868–1920)⁩ جو مکہ مکرمہ میں مستقر ہوئے اور مسجد الحرام میں تدریس کی۔ جنوب مشرقی ایشیا میں علمِ اسناد کے ممتاز ماہرین میں؛ ان کی تصانیف میں ترمذی کی منظومہ متن کی شرح «منہج ذوی النظر»، «کفایۃ المستفید» اور «موہبۃ ذی الفضل» شامل ہیں۔"
  es: "Erudito indonesio de hadices (1868-1920) originario de Java, se estableció en La Meca, donde impartió clases en la Mezquita Sagrada. Fue una autoridad destacada en isnad (cadena de transmisión) en el sudeste asiático; entre sus obras se incluyen Manhaj Dhawi al-Nazar, un comentario sobre el texto de hadices en verso de Tirmidhi, Kifayat al-Mustafid y Mawhibat Dhi al-Fadl."
  fr: "Érudit indonésien du hadith (1868-1920), originaire de Java, il s'installa à La Mecque où il enseigna à la Mosquée sacrée. Autorité majeure de l'isnad en Asie du Sud-Est, ses œuvres comprennent le Manhaj Dhawi al-Nazar, un commentaire du texte de hadiths versifié de Tirmidhi, le Kifayat al-Mustafid et le Mawhibat Dhi al-Fadl."
  tr: "Endonezyalı bir hadis âlimi (1868–1920), Mekke'ye yerleşmiş ve Büyük Camii'nde eğitim görmüştür. Güneydoğu Asya'daki yayım zincirinin önde gelen alimleri arasında, eserleri arasında Athirmidhi metni üzerine \"Manhaj Dhawi al-Nazar fi Sharh Manzumat 'Ilm al-Athar\" ile hadis ve fenlerinde \"Kifayat al-Mustafid\" ve \"Mawhibat Dhi al-Fadl\" bulunmaktadır."
  id: "Seorang ulama hadis Indonesia (1868–1920) dari pulau Jawa, menetap di Mekah dan belajar di Masjid Agungnya. Di antara ulama terkemuka dalam rantai transmisi di Asia Tenggara, di antara karyanya adalah \"Manhaj Dhawi al-Nazar fi Sharh Manzumat 'Ilm al-Athar\" tentang teks Athirmidhi, serta \"Kifayat al-Mustafid\" dan \"Mawhibat Dhi al-Fadl\" dalam hadits dan ilmunya."
