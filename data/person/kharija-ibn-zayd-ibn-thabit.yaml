  ar: "من فقهاء المدينة السبعة في الطبقة الثانية، كان هو وطلحة بن عبد الله بن عوف يُستفتيان في زمانهما، وينتهي الناس إلى قولهما في المواريث والوثائق، بحسب الشيرازي. ويذكر الكتاب أنه كان من الفقهاء العشرة الذين دعاهم عمر بن عبد العزيز إلى مجلس الشورى بالمدينة. {cite:salabi-umayyad-state-2020 p.173}"
