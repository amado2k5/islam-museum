summary:
  ar: "من فقهاء المدينة السبعة في الطبقة الثانية، كان هو وطلحة بن عبد الله بن عوف يُستفتيان في زمانهما، وينتهي الناس إلى قولهما في المواريث والوثائق، بحسب الشيرازي. ويذكر الكتاب أنه كان من الفقهاء العشرة الذين دعاهم عمر بن عبد العزيز إلى مجلس الشورى بالمدينة. {cite:salabi-umayyad-state-2020 p.173}"
  en: "Among the jurists of Medina in the second generation; with Talha ibn Abd Allah ibn Awf he was consulted in his time for inheritance and documents, as Shirazi reports."
  es: "Entre los juristas de Medina de la segunda generación, junto con Talha ibn Abd Allah ibn Awf, era consultado en su época sobre herencias y documentos, como relata Shirazi."
  fr: "Parmi les juristes de Médine de la deuxième génération; avec Talha ibn Abd Allah ibn Awf, il était consulté à son époque pour les questions d'héritage et de documents, comme le rapporte Shirazi."
  ur: "دوسری نسل میں مدینہ کے فقہاء میں سے؛ طلحہ بن عبد اللہ بن عوف کے ساتھ ان کے زمانے میں وراثت اور دستاویزات کے لیے مشورہ کیا گیا جیسا کہ شیرازی کی رپورٹ ہے۔"
  tr: "Medine'nin ikinci sınıf yedi hukukçusu arasında, o ve Talha ibn Abdullah ibn Awf, zamanlarında dini kararlara danışıyor ve insanlar miras ve belgeler konusunda kendi görüşlerini ortaya koyuyordu, Şirazi'ye göre. Kitapta, Ömer bin Abdülaziz'in Medine Şura Konseyi'ne davet ettiği on hukukçudan biri olduğu belirtiliyor. {kaynak:Selabi-Umayyad-devlet-2020 s.173}"
  id: "Di antara tujuh ahli hukum Madinah kelas dua, ia dan Talha ibn Abdullah ibn Awf biasa berkonsultasi dengan putusan agama pada masa mereka, dan orang-orang akhirnya mendapatkan pendapat tentang warisan dan dokumen, menurut Shirazi. Buku tersebut menyebutkan bahwa ia termasuk di antara sepuluh ahli hukum yang diundang Umar ibn Abd al-Aziz ke Dewan Syura Madinah. {cite:salabi-umayyad-state-2020 hlm.173}"
