summary:
  ar: قاضٍ ومحكّم دولي سريلانكي مسلم؛ خدم قاضيًا في المحكمة العليا لسريلانكا وقائمًا بأعمال رئيس القضاة، وترأس لجنة إصلاح قانون الأحوال الشخصية الإسلامي، ويمارس التحكيم الدولي والتدريس.
  en: Sri Lankan Muslim jurist and international arbitrator; he served as a Judge of the Supreme Court of Sri Lanka and as Acting Chief Justice, chaired the committee on reform of Muslim personal law, and
    practises international arbitration and teaching.
  ur: سری لنکی مسلم فقیہ و بین الاقوامی ثالث؛ سری لنکا کی سپریم کورٹ کے جج اور قائم مقام چیف جسٹس رہے، مسلم ذاتی قانون کی اصلاح کی کمیٹی کے سربراہ رہے، اور بین الاقوامی ثالثی و تدریس کرتے ہیں۔
  es: "Jurista musulmán de Sri Lanka y árbitro internacional; fue juez del Tribunal Supremo de Sri Lanka y presidente interino del mismo, presidió el comité de reforma del derecho personal musulmán y ejerce el arbitraje internacional y la docencia."
  fr: "Juriste musulman sri-lankais et arbitre international; il a été juge à la Cour suprême du Sri Lanka et juge en chef par intérim, a présidé le comité sur la réforme du droit personnel musulman et pratique l'arbitrage international et l'enseignement."
