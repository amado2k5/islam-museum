summary:
  ar: "أبو المكارم الأسعد زكريا بن أبي قدامة بن أبي مليح مماتي المصري الكاتب الشاعر؛ كان ناظر الدواوين بالديار المصرية وله فضائل ومصنفات عديدة؛ نظم «سيرة السلطان صلاح الدين» ونظم كتاب «كليلة ودمنة» وله ديوان شعر رآه ابن خلكان بخط ولده ونقل منه؛ ذكره العماد الأصبهاني في «الخريدة» وأورد له مقاطيع؛ والأسرة نصارى فأسلموا في ابتداء الملك الصلاحي {cite:wafayat-ayan}."
  en: "Al-Qadi al-As'ad Ibn Mammati (d. 606, aged 62) — head of Salah al-Din's Egyptian chanceries; versified the sultan's sira and Kalila wa-Dimna; from a Christian family converted at the start of Ayyubid rule {cite:wafayat-ayan}."
