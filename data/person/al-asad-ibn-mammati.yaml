died: { edtf: "1209", hijri: "0606", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في سلخ جمادى الأولى سنة ست وستمائة يوم الأحد وعمره اثنتان وستون سنة {cite:wafayat-ayan}." }
summary:
  ar: "أبو المكارم الأسعد زكريا بن أبي قدامة بن أبي مليح مماتي المصري الكاتب الشاعر؛ كان ناظر الدواوين بالديار المصرية وله فضائل ومصنفات عديدة؛ نظم «سيرة السلطان صلاح الدين» ونظم كتاب «كليلة ودمنة» وله ديوان شعر رآه ابن خلكان بخط ولده ونقل منه؛ ذكره العماد الأصبهاني في «الخريدة» وأورد له مقاطيع؛ والأسرة نصارى فأسلموا في ابتداء الملك الصلاحي {cite:wafayat-ayan}."
  en: "Al-Qadi al-As'ad Ibn Mammati (d. 606, aged 62) — head of Salah al-Din's Egyptian chanceries; versified the sultan's sira and Kalila wa-Dimna; from a Christian family converted at the start of Ayyubid rule {cite:wafayat-ayan}."
  fr: "Al-Qadi al-As’ad Ibn Mammati (mort en 606 H à 62 ans) — chef des chancelleries égyptiennes de Salah al-Din ; il mit en vers la sira du sultan et Kalila wa-Dimna ; issu d’une famille chrétienne convertie au début du pouvoir ayyoubide {cite:wafayat-ayan}."
  es: "Al-Qadi al-As'ad ibn Mammati (fallecido en 606, a los 62 años) — jefe de las cancillerías egipcias de Saladino; versificó el Camino del Sultán y el Juramento de Dimna; provenía de una familia cristiana convertida al comienzo del gobierno ayubí."
  ur: "القادی الاسد بن ممتی ⁦(متوفی 606، عمر 62)⁩ - صلاح الدین کے مصری صدرات کے سربراہ؛ سلطان کی سڑک اور دیمنہ کے حلف کی تصدیق کی۔ ایوبی حکومت کے آغاز میں ایک عیسائی خاندان سے۔"
  tr: "Yazar ve şair Ebu el-Makerem el-Es'ad Zekeriya ibn Ebi Kudama ibn Ebi Malih Mamati el-Mişri; Mısır topraklarındaki Divanların sorumlusuydu ve birçok fazileti ve eseri vardı; “Sultan Selahaddin’in Biyografisi”ni ve “Kalila ve Dimna” adlı kitabı yazdı; İbn Hallikan’ın oğlunun el yazısıyla gördüğü ve ondan alıntılar yaptığı bir şiir Divanı vardı; el-İmad el-İsfahani onu “el-Haride”de zikretti ve bazı parçalarını alıntıladı; ailesi Hristiyandı ve Selahaddin’in saltanatının başında İslam’a geçtiler."
  id: "Abu al-Makarem al-As’ad Zakariya ibn Abi Qudama ibn Abi Malih Mamati al-Misri, seorang penulis dan penyair; beliau adalah pengawas Diwan di wilayah Mesir dan memiliki banyak kebajikan dan karya; beliau menyusun “Biografi Sultan Salah al-Din” dan menyusun buku “Kalila wa Dimna” dan beliau memiliki sebuah Diwan puisi yang dilihat Ibn Khallikan dalam tulisan tangan putranya dan dikutip darinya; al-Imad al-Isfahani menyebutkannya dalam “al-Kharida” dan mengutip beberapa fragmennya; dan keluarganya beragama Kristen dan masuk Islam pada awal pemerintahan Salah al-Din {cite:wafayat-ayan}."
