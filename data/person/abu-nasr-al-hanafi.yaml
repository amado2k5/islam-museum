summary:
  ar: "أحمد بن محمد بن محمد بن نصر، أبو نصر الأقطع الحنفي، فقيه، درس الفقه على القدوري وبرع فيه وأتقن الحساب، وخرج من بغداد سنة ثلاثين وأربعمائة إلى الأهواز فأقام بها ودرس وشرح المختصر إلى أن توفي. (؟ - ٤٧٤ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13348}"
  en: "Ahmad ibn Muhammad ibn Muhammad ibn Nasr, Abu Nasr al-Aqta' al-Hanafi, a jurist who studied fiqh with al-Quduri and excelled in it, and was expert in arithmetic. He left Baghdad in 430 H for Ahwaz, where he taught until his death and wrote a commentary on al-Quduri's Mukhtasar. Death 474 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13348}"
