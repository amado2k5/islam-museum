summary:
  ar: "الطيب صالح ⁦(1929–2009)⁩ روائي وصحفي سوداني، أشهر أدباء العرب في القرن العشرين، صاحب رواية «موسم الهجرة إلى الشمال» ⁦(1966)⁩ التي تُرجمت إلى أكثر من عشرين لغة. من أعماله أيضاً «عرس الزين» و«ضو البيت» و«بندر شاه»."
  en: "Tayeb Salih (1929–2009) was a Sudanese novelist and journalist, among the most famous Arab writers of the twentieth century, author of Season of Migration to the North (1966), translated into more than twenty languages. His other works include The Wedding of Zein, Dou al-Beit and Bandarshah."
  ur: "طیب صالح ⁦(1929–2009)⁩ سوڈانی ناول نگار اور صحافی تھے، بیسویں صدی کے مشہور ترین عرب ادیبوں میں، «موسم الهجرة إلى الشمال» ⁦(1966)⁩ کے مصنف جو بیس سے زائد زبانوں میں ترجمہ ہوئی۔ دیگر آثار میں «عرس الزين»، «ضو البيت» اور «بندر شاه» شامل ہیں۔"
  es: "Tayeb Salih (1929-2009) fue un novelista y periodista sudanés, uno de los escritores árabes más famosos del siglo XX, autor de *Temporada de migración al norte* (1966), traducida a más de veinte idiomas. Entre sus otras obras destacan *La boda de Zein*, *Dou al-Beit* y *Bandarshah*."
