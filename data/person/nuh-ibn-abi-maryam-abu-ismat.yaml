summary:
  ar: "نوح بن أبي مريم يزيد بن أبي جعونة، لقب بالجامع، قيل لأنه أول من جمع فقه أبي حنيفة، وقيل لأنه كان جامعاً بين العلوم. أخذ الفقه عن أبي حنيفة وابن أبي ليلى، وروى الحديث عن الزهري وغيره، وولي قضاء مرو. ووصفه أحمد بالشدة على الجهمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1611}"
  en: "Nuh ibn Abi Maryam Yazid ibn Abi Ju'una, called al-Jami', either because he was the first to gather the fiqh of Abu Hanifa or because he combined several sciences. He studied law with Abu Hanifa and Ibn Abi Layla, transmitted hadith from al-Zuhri and others, and was appointed judge of Merv. Ahmad described him as severe against the Jahmiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1611}"
