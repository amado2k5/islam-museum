summary:
  ar: "نوح بن أبي مريم يزيد بن أبي جعونة، لقب بالجامع، قيل لأنه أول من جمع فقه أبي حنيفة، وقيل لأنه كان جامعاً بين العلوم. أخذ الفقه عن أبي حنيفة وابن أبي ليلى، وروى الحديث عن الزهري وغيره، وولي قضاء مرو. ووصفه أحمد بالشدة على الجهمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1611}"
  en: "Nuh ibn Abi Maryam Yazid ibn Abi Ju'una, called al-Jami', either because he was the first to gather the fiqh of Abu Hanifa or because he combined several sciences. He studied law with Abu Hanifa and Ibn Abi Layla, transmitted hadith from al-Zuhri and others, and was appointed judge of Merv. Ahmad described him as severe against the Jahmiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1611}"
  es: "Nuh ibn Abi Maryam Yazid ibn Abi Ju'una, llamado al-Jami', bien por haber recopilado primero el fiqh de Abu Hanifa, bien por haber combinado varias ciencias. Estudió derecho con Abu Hanifa e Ibn Abi Layla, transmitió hadices de al-Zuhri y otros, y fue nombrado juez de Merv. Ahmad lo describió como severo con los Jahmiyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1611}"
  fr: "Nuh ibn Abi Maryam Yazid ibn Abi Ju'una, dit al-Jami', soit parce qu'il fut le premier à rassembler le fiqh d'Abu Hanifa, soit parce qu'il combinait plusieurs sciences. Il étudia le droit auprès d'Abu Hanifa et d'Ibn Abi Layla, transmit des hadiths d'al-Zuhri et d'autres, et fut nommé juge de Merv. Ahmad le décrit comme sévère envers les Jahmites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1611}"
  ur: "نوح ابن ابی مریم یزید ابن ابی جونہ جنہیں الجامع کہا جاتا ہے، یا تو اس لیے کہ وہ ابو حنیفہ کے فقہ کو جمع کرنے والے پہلے شخص تھے یا اس لیے کہ انھوں نے متعدد علوم کو جمع کیا تھا۔ اس نے ابو حنیفہ اور ابن ابی لیلیٰ سے قانون کی تعلیم حاصل کی، الزہری اور دیگر سے حدیثیں نقل کیں اور مرو کے قاضی مقرر ہوئے۔ احمد نے اسے جہمیہ کے خلاف سخت قرار دیا۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 1611}"
