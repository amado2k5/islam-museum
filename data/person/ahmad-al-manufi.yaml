summary:
  ar: "شهاب الدين أحمد المنوفي المالكي؛ كان من أئمة الصلاح على ما ترجمه به المناوي في نفائسه، وتولى قضاء مدينة منوف ثلاثاً وثلاثين سنة فما أصابت جوراً وقُتل أحداً ولا ارتفعت بثكلها فاطمة، وولي قضاء القاهرة قبل وفاته وما قدر فيها لشيء وعدته المنية؛ توفي ليلة الجمعة سلخ ذي الحجة سنة إحدى وعشرين وتسعمائة {cite:shadharat-dhahab p. 540}."
  en: "The model qadi of Minuf — per al-Manawi's Nafa'is, an imam of piety; jurist of Minuf for thirty-three years in which no injustice struck it and 'no widow rose bereaved'; appointed Cairo's qadi but death took him before he could sit; died Friday eve, end of Dhu'l-Hijja 921 {cite:shadharat-dhahab p. 540}."
