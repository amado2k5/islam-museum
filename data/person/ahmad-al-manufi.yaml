summary:
  ar: "شهاب الدين أحمد المنوفي المالكي؛ كان من أئمة الصلاح على ما ترجمه به المناوي في نفائسه، وتولى قضاء مدينة منوف ثلاثاً وثلاثين سنة فما أصابت جوراً وقُتل أحداً ولا ارتفعت بثكلها فاطمة، وولي قضاء القاهرة قبل وفاته وما قدر فيها لشيء وعدته المنية؛ توفي ليلة الجمعة سلخ ذي الحجة سنة إحدى وعشرين وتسعمائة {cite:shadharat-dhahab p. 540}."
  en: "The model qadi of Minuf — per al-Manawi's Nafa'is, an imam of piety; jurist of Minuf for thirty-three years in which no injustice struck it and 'no widow rose bereaved'; appointed Cairo's qadi but death took him before he could sit; died Friday eve, end of Dhu'l-Hijja 921 {cite:shadharat-dhahab p. 540}."
  fr: "Cadi modèle de Minuf, imam de piété selon les Nafa'is d'al-Manawi ; juriste de Minuf pendant trente-trois ans sans injustice et sans qu'« aucune veuve ne se levât endeuillée ». Nommé cadi du Caire, il mourut avant de pouvoir siéger, la veille du vendredi à la fin de dhou al-hijja 921 H {cite:shadharat-dhahab p. 540}."
  es: "El cadí modelo de Minuf — según Nafa'is de al-Manawi, un imán de piedad; jurista de Minuf durante treinta y tres años en los que no se cometió ninguna injusticia y \"ninguna viuda se levantó desconsolada\"; fue nombrado cadí de El Cairo, pero la muerte lo sorprendió antes de que pudiera asumir el cargo; murió la víspera del viernes, al final de Dhu'l-Hijja 921 {cita: shadharat-dhahab p. 540}."
  ur: "منوف کا نمونہ قضا - فی المناوی نافع، تقویٰ کا امام؛ منوف کا فقیہ تینتیس سال تک جس میں اس پر کوئی ظلم نہیں ہوا اور 'کوئی بیوہ سوگوار نہیں ہوئی'؛ قاہرہ کا قاضی مقرر کیا لیکن بیٹھنے سے پہلے ہی موت اسے لے گئی۔ وفات جمعہ کی شام، ذی الحجہ 921 کے آخر میں 540}۔"
  tr: "Şihab el-Din Ahmed el-Manufi el-Maliki; el-Manawi'nin Nafa'is adlı eserinde tercüme ettiği gibi, salih imamlardan biriydi. Otuz üç yıl boyunca Manuf şehrinin yargısını üstlendi ve orada hiçbir haksızlık yapılmadı, kimse öldürülmedi ve Fatıma kederden ayaklanmadı. Ölümünden önce Kahire'nin yargısını da üstlendi, ancak orada kendisine hiçbir şey nasip olmadı ve ölüm onu vaat etti. Dokuz yüz yirmi bir yılında, Zilhicce ayının son Cuma gecesi vefat etti. {kaynak: Şadharat-dhahab s. 540}"
  id: "Shihab al-Din Ahmad al-Manufi al-Maliki; beliau adalah salah satu imam kebenaran, sebagaimana diterjemahkan oleh al-Manawi dalam kitab Nafa’i-nya. Beliau memimpin peradilan kota Manuf selama tiga puluh tiga tahun, dan tidak ada ketidakadilan yang terjadi di sana, tidak ada yang terbunuh, dan Fatimah tidak bangkit dalam kesedihan. Beliau memimpin peradilan Kairo sebelum kematiannya, tetapi tidak ada takdir yang menantinya di sana, dan kematian telah menantinya. Beliau wafat pada malam Jumat, tanggal terakhir Dzul Hijjah, tahun 921. {cite:shadharat-dhahab p. 540}."
