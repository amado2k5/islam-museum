label: { ar: "المسيب بن زهير الضبي", en: "al-Musayyab ibn Zuhayr al-Dabbi", fr: "al-Musayyab ibn Zuhayr al-Dabbi", es: "al-Musayyab ibn Zuhayr al-Dabbi", ur: "المصیب ابن زہیر الدبی" }
summary:
  ar: "من قواد المنصور أخرج بالأقوات يوم خروج محمد بن عبد الله، ولما قال المنصور ما رأيت أنصح من الحجاج لبني مروان قام فقال ما سبقنا الحجاج بأمر تخلفنا عنه وقد أمرتنا بقتل أولاد نبينا فأطعناك فهل نصحناك أم لا فقال له اجلس لا جلست {cite:muruj-al-dhahab p. 286-287}."
  en: "Al-Mansur's commander whose 'we obeyed you against our Prophet's sons — was that not loyalty?' silenced the caliph praising al-Hajjaj {cite:muruj-al-dhahab p. 286-287}."
  fr: "Le commandant d’Al-Mansour, dont « nous vous avons obéi contre les fils de notre Prophète, n’était-ce pas la loyauté  ?  » fit taire le calife louant al-Hajjaj {cite:muruj-al-dhahab p. 286-287}."
  es: "El comandante de Al-Mansur, cuyo \"¿Te obedecimos en contra de los hijos de nuestro Profeta? ¿Acaso eso no fue lealtad?\", hizo callar al califa que elogiaba a Al-Hajjaj {cite:muruj-al-dhahab p. 286-287}."
  ur: "المنصور کا کمانڈر جس کی 'ہم نے اپنے نبی کے بیٹوں کے خلاف تمہاری بات مانی - کیا یہ وفاداری نہیں تھی؟' الحجاج کی تعریف کرتے ہوئے خلیفہ کو خاموش کر دیا {حوالہ: مروج الذہب ص۔ 286-287}۔"
  tr: "El-Mansur'un komutanlarından biri, Muhammed bin Abdullah ayrıldığı gün erzak gönderdi. El-Mansur, 'Banu Mervan için El-Hacac'tan daha uygun birini görmedim.' dedi. O ayağa kalktı ve dedi ki, 'El-Hacc'tan önce uymadığımız bir emir vermedik, siz de Peygamberimizin oğullarını öldürmemizi emretdiniz, bu yüzden size itaat ettik. Size öğüt verdik mi, etmedik mi?' O da 'Oturun, oturmayın.' diye cevap verdi. {atıf:Muruj-al-Dhahab, s. 286-287}."
  id: "Salah satu komandan Al-Mansur mengirimkan bekal pada hari Muhammad ibn Abdullah pergi. Ketika Al-Mansur berkata, 'Saya belum melihat orang yang lebih bijaksana daripada Al-Hajjaj untuk Banu Marwan.' Dia berdiri dan berkata, 'Kami tidak mendahului Al-Hajjaj dengan perintah yang kami tidak ikuti, dan Anda memerintahkan kami membunuh anak-anak Nabi kami, maka kami mematuhi Anda. Apakah kami menasihati Anda atau tidak?' Dia menjawab, 'Duduklah, bukan duduk.' {cite:muruj-al-dhahab, hlm. 286-287}."
