  ar: نجلاء العوضي إعلامية وسياسية إماراتية، من أوائل النساء في المجلس الوطني الاتحادي وأصغر برلمانية إماراتية، وأول امرأة عربية تتولى منصب الرئيس التنفيذي للقنوات التلفزيونية في مؤسسة دبي للإعلام.
  en: Najla al-Awadhi is an Emirati media executive and former parliamentarian — one of the first women in the UAE Federal National Council and its youngest member — and the first Arab woman to serve as
    CEO of TV channels at Dubai Media Incorporated.
  ur: نجلاء العوضی اماراتی میڈیا ایگزیکٹو اور سابق رکنِ پارلیمان ہیں — UAE فیڈرل نیشنل کونسل کی پہلی خواتین ارکان میں اور اس کی کم عمر ترین رکن — اور دبئی میڈیا انکارپوریٹڈ میں ٹی وی چینلوں کی سی ای او
    بننے والی پہلی عرب خاتون۔
  es: "Najla al-Awadhi es una ejecutiva de medios emiratí y exparlamentaria, una de las primeras mujeres en el Consejo Nacional Federal de los EAU y su miembro más joven, y la primera mujer árabe en ocupar el cargo de directora ejecutiva de canales de televisión en Dubai Media Incorporated."
