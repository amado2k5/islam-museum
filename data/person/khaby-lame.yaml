  id: "Seorang kreator konten Senegal-Italia yang lahir pada tahun 2000 di Senegal dan dibesarkan di Italia; ia menjadi pemilik akun TikTok terbesar di dunia dengan klip-klip bisu yang mengejek 'trik hidup' yang kompleks, dan ia memiliki ratusan juta pengikut."
