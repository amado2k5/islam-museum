  es: "Creador de contenido senegalés-italiano nacido en Senegal en el año 2000 y criado en Italia; se convirtió en la cuenta más seguida de TikTok a nivel mundial con vídeos silenciosos que se burlaban de complicados \"trucos para la vida\", llegando a acumular cientos de millones de seguidores."
