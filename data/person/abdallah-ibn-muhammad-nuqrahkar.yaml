summary:
  ar: "عبد الله بن محمد بن أحمد الحسيني النيسابوري، جمال الدين، عالم بالعربية وأصول الفقه حنفي، ولي التدريس بحلب وأقام بدمشق والقاهرة، وله شروح على المنار والتسهيل والشافية؛ ٧٠٦ إلى ٧٧٦هـ الموافقة ١٣٠٦ إلى ١٣٧٤م."
  en: "Abd Allah ibn Muhammad ibn Ahmad al-Husayni al-Naysaburi, Jamal al-Din, a Hanafi scholar of Arabic and of the principles of jurisprudence, who taught at Aleppo and stayed for a time in Damascus and Cairo, author of commentaries on al-Manar, al-Tashil and al-Shafiya; 706 to 776 AH, equal to 1306 to 1374 CE."
