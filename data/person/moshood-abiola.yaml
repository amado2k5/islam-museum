summary:
  ar: "رجل أعمال وناشر وسياسي نيجيري (1937–1998) من أبيوكوتا، بنى إمبراطورية أعمال وصحف «كونكورد» وترشح لرئاسة نيجيريا عن الحزب الاجتماعي الديمقراطي، ففاز ظاهريا بانتخابات 12 يونيو 1993 التي ألغاها الحاكم العسكري إبراهيم بابانغيدا. أعلن نفسه رئيسا سنة 1994 فاعتُقل، واغتيلت زوجته قديرت سنة 1996، ومات في الاحتجاز بأبوجا في 7 يوليو 1998، ثم كرّمته نيجيريا بعد وفاته بأعلى وسام وجعلت 12 يونيو يوم الديمقراطية."
  en: "Nigerian businessman, publisher and politician (1937–1998) from Abeokuta who built a business empire and the Concord newspaper group and stood for the presidency on the Social Democratic Party ticket, apparently winning the election of 12 June 1993, which the military ruler Ibrahim Babangida annulled. He declared himself president in 1994 and was detained; his wife Kudirat was assassinated in 1996; he died in custody in Abuja on 7 July 1998. Nigeria later honoured him posthumously with its highest award and made 12 June Democracy Day."
  ur: "نائجریائی تاجر، ناشر اور سیاست دان (1937ء–1998ء)، ابیوکوتا سے تعلق؛ کاروباری سلطنت اور ’کانکورڈ‘ اخبارات کا سلسلہ قائم کیا اور سوشل ڈیموکریٹک پارٹی کے امیدوار کے طور پر صدارت کے لیے کھڑے ہوئے؛ 12 جون 1993 کے انتخابات میں بظاہر کامیاب ہوئے مگر فوجی حکمران ابراہیم بابانگیدا نے نتیجہ منسوخ کر دیا۔ 1994 میں خود کو صدر اعلان کرنے پر گرفتار ہوئے، ان کی اہلیہ قدیرت 1996 میں قتل ہوئیں، اور وہ 7 جولائی 1998 کو ابوجا میں حراست کے دوران وفات پا گئے؛ بعد از مرگ نائجریا نے انھیں اعلیٰ ترین اعزاز دیا اور 12 جون کو یومِ جمہوریت قرار دیا۔"
