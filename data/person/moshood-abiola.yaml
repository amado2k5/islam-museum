summary:
  ar: "رجل أعمال وناشر وسياسي نيجيري (1937–1998) من أبيوكوتا، بنى إمبراطورية أعمال وصحف «كونكورد» وترشح لرئاسة نيجيريا عن الحزب الاجتماعي الديمقراطي، ففاز ظاهريا بانتخابات 12 يونيو 1993 التي ألغاها الحاكم العسكري إبراهيم بابانغيدا. أعلن نفسه رئيسا سنة 1994 فاعتُقل، واغتيلت زوجته قديرت سنة 1996، ومات في الاحتجاز بأبوجا في 7 يوليو 1998، ثم كرّمته نيجيريا بعد وفاته بأعلى وسام وجعلت 12 يونيو يوم الديمقراطية."
  en: "Nigerian businessman, publisher and politician (1937–1998) from Abeokuta who built a business empire and the Concord newspaper group and stood for the presidency on the Social Democratic Party ticket, apparently winning the election of 12 June 1993, which the military ruler Ibrahim Babangida annulled. He declared himself president in 1994 and was detained; his wife Kudirat was assassinated in 1996; he died in custody in Abuja on 7 July 1998. Nigeria later honoured him posthumously with its highest award and made 12 June Democracy Day."
  ur: "نائجریائی تاجر، ناشر اور سیاست دان ⁦(1937ء–1998ء)⁩، ابیوکوتا سے تعلق؛ کاروباری سلطنت اور ’کانکورڈ‘ اخبارات کا سلسلہ قائم کیا اور سوشل ڈیموکریٹک پارٹی کے امیدوار کے طور پر صدارت کے لیے کھڑے ہوئے؛ 12 جون 1993 کے انتخابات میں بظاہر کامیاب ہوئے مگر فوجی حکمران ابراہیم بابانگیدا نے نتیجہ منسوخ کر دیا۔ 1994 میں خود کو صدر اعلان کرنے پر گرفتار ہوئے، ان کی اہلیہ قدیرت 1996 میں قتل ہوئیں، اور وہ 7 جولائی 1998 کو ابوجا میں حراست کے دوران وفات پا گئے؛ بعد از مرگ نائجریا نے انھیں اعلیٰ ترین اعزاز دیا اور 12 جون کو یومِ جمہوریت قرار دیا۔"
  es: "Empresario, editor y político nigeriano (1937-1998) originario de Abeokuta, construyó un imperio empresarial y el grupo periodístico Concord, y se postuló a la presidencia por el Partido Socialdemócrata, ganando aparentemente las elecciones del 12 de junio de 1993, que el gobernante militar Ibrahim Babangida anuló. Se autoproclamó presidente en 1994 y fue detenido; su esposa, Kudirat, fue asesinada en 1996; murió bajo custodia en Abuja el 7 de julio de 1998. Posteriormente, Nigeria lo honró póstumamente con su máxima condecoración y declaró el 12 de junio Día de la Democracia."
  fr: "Homme d'affaires, éditeur et homme politique nigérian (1937-1998), originaire d'Abeokuta, il bâtit un empire commercial et le groupe de presse Concord. Candidat à la présidence sous l'étiquette du Parti social-démocrate, il remporta apparemment l'élection du 12 juin 1993, dont le résultat fut annulé par le dirigeant militaire Ibrahim Babangida. Il se proclama président en 1994 et fut arrêté. Son épouse, Kudirat, fut assassinée en 1996. Il mourut en détention à Abuja le 7 juillet 1998. Le Nigeria lui décerna à titre posthume sa plus haute distinction et institua le 12 juin Journée de la démocratie."
  tr: "Abeokuta'dan Nijeryalı iş insanı, yayıncı ve politikacı (1937–1998) olan Nijeryalı bir iş insanı, \"Concord\" adlı bir iş imparatorluğu ve gazeteler kurdu ve Sosyal Demokrat Parti adına Nijerya cumhurbaşkanlığına aday oldu; görünüşe göre 12 Haziran 1993 seçimlerini kazandı; seçimler askeri yönetici İbrahim Babangida tarafından iptal edildi. 1994'te kendini cumhurbaşkanı ilan etti ancak tutuklandı, eşi Qadiret 1996'da suikaste uğradı ve 7 Temmuz 1998'de Abuja'da gözaltında hayatını kaybetti. Nijerya, ölümünden sonra en yüksek nişanı onurlandırdı ve 12 Haziran'ı Demokrasi Günü ilan etti."
  id: "Seorang pengusaha, penerbit, dan politisi Nigeria (1937–1998) dari Abeokuta, ia membangun kerajaan bisnis dan surat kabar bernama \"Concord\" dan mencalonkan diri sebagai presiden Nigeria atas nama Partai Sosial Demokrat, tampaknya memenangkan pemilihan 12 Juni 1993 yang dibatalkan oleh penguasa militer Ibrahim Babangida. Ia menyatakan dirinya sebagai presiden pada tahun 1994 namun ditangkap, istrinya Qadiret dibunuh pada tahun 1996, dan ia meninggal dalam tahanan di Abuja pada 7 Juli 1998. Nigeria menghormatinya secara anumerta dengan penghargaan tertinggi dan menetapkan 12 Juni sebagai Hari Demokrasi."
