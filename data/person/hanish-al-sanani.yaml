id: person/hanish-al-sanani
class: person
label: { ar: "حنش بن عبد الله الصنعاني" }
gender: male
summary:
  ar: "تابعي جليل كان مع علي بالكوفة وقدم مصر بعد قتله فصار عداده في المصريين وكان فيمن قام مع ابن الزبير على عبد الملك بن مروان فعفا عنه؛ قيل إنه ثالث التابعين الذين دخلوا الأندلس وأهل سرقسطة يزعمون أنه مات عندهم ولم يقفل للمشرق وقبره لديهم مشهور يتبركون به {cite:nafh-tib-maqqari p. 314}."
  en: "The great tabi'i of Kufa and Egypt whose tomb at Zaragoza the locals bless as that of one who entered al-Andalus and never returned east {cite:nafh-tib-maqqari p. 314}."
  es: "El gran tabi'i de Kufa y Egipto, cuya tumba en Zaragoza los lugareños bendicen como la de alguien que entró en al-Ándalus y nunca regresó al este {cite:nafh-tib-maqqari p. 314}."
  fr: "Le grand tabi'i de Kufa et d'Égypte dont le tombeau à Saragosse est béni par les locaux comme celui de celui qui est entré en al-Andalus et n'est jamais retourné à l'est {cite:nafh-tib-maqqari p. 314}."
  ur: "کوفہ اور مصر کے عظیم تابعی جن کی قبر زرغوزہ میں مقامی لوگ اس شخص کے مقبرے کو مبارک دیتے ہیں جو اندلس میں داخل ہوا اور کبھی مشرق سے واپس نہیں آیا۔ 314}۔"
  tr: "Ali ile birlikte Kufa'da olan ve ölümünden sonra Mısır'a gelen soylu bir Tabi'i, böylece Mısırlılardan biri oldu. İbn el-Zubeyr ile birlikte Abdülmelik ibn Mervan'a karşı duranlar arasında yer aldı ve onu affetti; Endülüs'e giren üçüncü Tabi'un olduğu söylenir ve Zaragoza halkı, onun orada öldüğünü, doğuya mühürlenmediğini iddia eder ve mezarının orada kutsama dilemek için ünlü olduğu {cite:nafh-tib-maqqari, s. 314}"
  id: "Seorang Tabi'i bangsawan yang bersama Ali di Kufa dan datang ke Mesir setelah kematiannya, sehingga ia menjadi salah satu orang Mesir. Ia termasuk di antara mereka yang berdiri bersama Ibn al-Zubayr melawan Abd al-Malik ibn Marwan dan mengampuninya; dikatakan bahwa ia adalah Tabi'un ketiga yang masuk ke al-Andalusia, dan masyarakat Zaragoza mengklaim bahwa ia meninggal di sana dan tidak disegel ke Timur, dan makamnya terkenal di sana untuk orang-orang yang meminta berkah {cite:nafh-tib-maqqari, hlm. 314}."
