summary:
  ar: "خفاف بن إيماء بن رحضة بن خربة بن خلاف بن حارثة، إمام بني غفار وسيدهم، له ولأبيه صحبة، شهد الحديبية مع النبي وبايع بيعة الرضوان، وكان قد أسلم فقال أبو سفيان إن سيد بني كنانة صبأ. قال البغوي إنه مات في زمن عمر. (؟ - في زمن عمر). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13354}"
  en: "Khafaf ibn Ima', son of Rahdah, of the Banu Ghifar, their chief. He and his father were Companions; he was at al-Hudaybiya with the Prophet and gave the pledge of al-Ridwan. Ibn Ishaq reports Abu Sufyan saying the chief of Kinana had changed religion when Khafaf embraced Islam. Al-Baghawi says he died in Umar's time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13354}"
