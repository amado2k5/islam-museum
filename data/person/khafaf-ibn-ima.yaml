summary:
  ar: "خفاف بن إيماء بن رحضة بن خربة بن خلاف بن حارثة، إمام بني غفار وسيدهم، له ولأبيه صحبة، شهد الحديبية مع النبي وبايع بيعة الرضوان، وكان قد أسلم فقال أبو سفيان إن سيد بني كنانة صبأ. قال البغوي إنه مات في زمن عمر. ⁦(؟ - في زمن عمر)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13354}"
  en: "Khafaf ibn Ima', son of Rahdah, of the Banu Ghifar, their chief. He and his father were Companions; he was at al-Hudaybiya with the Prophet and gave the pledge of al-Ridwan. Ibn Ishaq reports Abu Sufyan saying the chief of Kinana had changed religion when Khafaf embraced Islam. Al-Baghawi says he died in Umar's time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13354}"
  es: "Khafaf ibn Ima', hijo de Rahdah, de los Banu Ghifar, era su jefe. Él y su padre fueron Compañeros; estuvo en al-Hudaybiya con el Profeta y prestó el juramento de al-Ridwan. Ibn Ishaq relata que Abu Sufyan dijo que el jefe de Kinana cambió de religión cuando Khafaf abrazó el Islam. Al-Baghawi afirma que murió en tiempos de Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13354}"
  fr: "Khafaf ibn Ima', fils de Rahdah, chef de la tribu des Banu Ghifar, était, comme son père, un Compagnon. Il se trouvait à al-Hudaybiya avec le Prophète et prêta serment d'al-Ridwan. Ibn Ishaq rapporte qu'Abu Sufyan a dit que le chef de Kinana s'était converti à l'islam lorsque Khafaf embrassa cette religion. Al-Baghawi indique qu'il mourut sous le règne d'Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13354}"
  ur: "خفاف بن امامہ بن رہدہ بنو غفار کے ان کے سردار تھے۔ وہ اور ان کے والد صحابہ تھے۔ آپ کے ساتھ حدیبیہ میں تھے اور رضوان کی بیعت کی۔ ابن اسحاق ابو سفیان سے روایت کرتے ہیں کہ کنانہ کے سردار نے جب خفاف کے اسلام قبول کیا تو اس نے مذہب تبدیل کر دیا۔ البغوی کہتے ہیں کہ ان کی وفات عمر کے زمانے میں ہوئی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص13354}"
