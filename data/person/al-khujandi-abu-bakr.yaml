id: person/al-khujandi-abu-bakr
class: person
label: { ar: "أبو بكر الخجندي مدرس نظامية أصبهان", en: "Abu Bakr al-Khujandi, lecturer at the Nizamiyya of Isfahan", es: "Abu Bakr al-Khujandi, lecturer at the Nizamiyya of Isfahan", fr: "Abu Bakr al-Khujandi, lecturer at the Nizamiyya of Isfahan", ur: "ابوبکر الخجندی، نظامیہ اصفہان کے لیکچرر" }
summary:
  ar: "العلامة أبو بكر الخجندي — نسبة إلى خجندة مدينة بطرف سيحون — محمد بن ثابت بن الحسن الشافعي الواعظ نزيل أصبهان ومدرس نظاميتها وشيخ الشافعية بها ورئيسها؛ كان إليه المنتهى في الوعظ وله يد باطشة في النظر والأصول انتشر علمه في الآفاق وتخرج به وبكلامه جماعة وتفقه على أبي سهل الأبيوردي؛ توفي في ذي القعدة سنة ثلاث وثمانين وأربعمائة {cite:shadharat-dhahab p. 369}."
  en: "The alim Abu Bakr al-Khujandi — of Khujanda on the Jaxartes — Muhammad b. Thabit b. al-Hasan, the Shafi'i preacher settled at Isfahan, mudarris of its Nizamiyya and head of its Shafi'is; the ultimate in preaching with a firm hand in disputation and usul, his learning spread through the lands; died Dhu al-Qa'da 483 {cite:shadharat-dhahab p. 369}."
  es: "El erudito Abu Bakr al-Khujandi — de Khujanda en el Jaxartes — Muhammad b. Thabit b. al-Hasan, el predicador shafi'í establecido en Isfahán, mudarris de su Nizamiyya y jefe de sus shafi'ís; el máximo exponente de la predicación con mano firme en la disputa y el usul, su saber se extendió por todas las tierras; murió en Dhu al-Qa'da 483 {cita: shadharat-dhahab p. 369}."
  fr: "L'alim Abu Bakr al-Khujandi — de Khujanda sur les Jaxartes — Muhammad b. Thabit b. al-Hasan, le prédicateur Shafi'i établi à Ispahan, mudarris de sa Nizamiyya et chef de ses Shafi'is; le summum de la prédication avec une main ferme dans la dispute et l'usul, son savoir s'est répandu à travers les terres; mort Dhu al-Qa'da 483 {cite:shadharat-dhahab p. 369}."
  ur: "علیم ابوبکر الخجندی - خجنڈا آن دی جیکسارٹس - محمد بن۔ ثابت ب۔ الحسن، شافعی مبلغ اصفہان میں آباد ہوئے، اس کے نظامیہ کے مدثر اور اس کے شافعیوں کے سربراہ؛ تنازعات اور اصول میں مضبوطی کے ساتھ تبلیغ کرنے میں حتمی، اس کی تعلیم زمینوں میں پھیل گئی۔ ذوالقعدہ متوفی 483۔ 369}۔"
  tr: "Âlim Ebu Bekir el-Hucandi — Seyhun'un kenarındaki Hucandah şehrine atfedilen — İsfahan'da yaşayan bir vaiz, sistemin öğretmeni, Şafi'lerin şeyhi ve lideri Muhammed ibn Tebit ibn el-Hasan el-Şafii'i; vaazda en üstün ustaydı ve teori ile prensiplerde yetenekli bir ele sahipti. Bilgisi çok geniş bir alana yayıldı ve teolojisiyle bir grup tarafından geniş çapta incelendi. Ebu Sahl el-Abyurdi'nin yanında fıkıh eğitimi aldı; dört yüz seksen üçüncü yılda Dhu al-Qi'dah'ta öldü {cite:shadharat-dhahab, s. 369}."
  id: "Ulama Abu Bakr al-Khujandi — yang dikaitkan dengan Khujandah, sebuah kota dekat tepi Seyhun — Muhammad ibn Thabit ibn al-Hasan al-Shafi'i, seorang pengkhotbah yang tinggal di Isfahan, guru sistemnya, sheikh dan pemimpin Shafi'i di sana; ia adalah yang paling unggul dalam berkhotbah dan memiliki tangan terampil dalam teori dan prinsip. Pengetahuannya menyebar luas, dan ia banyak dipelajari dan dipelajari oleh kelompok teologinya. Ia mempelajari hukum di bawah bimbingan Abu Sahl al-Abyurdi; ia meninggal di Dhu al-Qi'dah pada tahun empat ratus delapan puluh tiga {cite:shadharat-dhahab, hlm. 369}."
