label: { ar: "أبو بكر الخجندي مدرس نظامية أصبهان" }
summary:
  ar: "العلامة أبو بكر الخجندي — نسبة إلى خجندة مدينة بطرف سيحون — محمد بن ثابت بن الحسن الشافعي الواعظ نزيل أصبهان ومدرس نظاميتها وشيخ الشافعية بها ورئيسها؛ كان إليه المنتهى في الوعظ وله يد باطشة في النظر والأصول انتشر علمه في الآفاق وتخرج به وبكلامه جماعة وتفقه على أبي سهل الأبيوردي؛ توفي في ذي القعدة سنة ثلاث وثمانين وأربعمائة {cite:shadharat-dhahab p. 369}."
  en: "The alim Abu Bakr al-Khujandi — of Khujanda on the Jaxartes — Muhammad b. Thabit b. al-Hasan, the Shafi'i preacher settled at Isfahan, mudarris of its Nizamiyya and head of its Shafi'is; the ultimate in preaching with a firm hand in disputation and usul, his learning spread through the lands; died Dhu al-Qa'da 483 {cite:shadharat-dhahab p. 369}."
