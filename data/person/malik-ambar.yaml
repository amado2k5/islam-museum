summary:
  ar: "رجل دولة أحمدنگر وقائدها (ت 1626م)، عبد أفريقي سابق بيع صغيرًا في بغداد، أقام سلاطين نظام شاهية صوريين وقاوم المغول بحرب العصابات نحو ربع قرن، وأسس مدينة كركي (أورنگآباد لاحقًا) {cite:zebrowski-deccani-painting-1983 p. 35}."
  en: "Statesman and commander of Ahmadnagar (d. 1626), a former African slave sold as a child in Baghdad, who set up Nizam Shahi puppet kings, resisted the Mughals with guerrilla warfare for a quarter century and founded Kirki (later Aurangabad) {cite:zebrowski-deccani-painting-1983 p. 35}."
  ur: "احمد نگر کے مدبر اور سپہ سالار (م 1626ء)، سابق افریقی غلام جو بچپن میں بغداد میں بیچے گئے، جنہوں نے نظام شاہی کٹھ پتلی بادشاہ بٹھائے، تقریباً ربع صدی چھاپہ مار جنگ سے مغلوں کا مقابلہ کیا اور کرکی (بعد میں اورنگ آباد) بسایا {cite:zebrowski-deccani-painting-1983 p. 35}۔"
