label: { ar: "ملك عنبر", en: "Malik Ambar", ur: "ملک عنبر", es: "Malik Ambar", fr: "Malik Ambar" }
summary:
  ar: "رجل دولة أحمدنگر وقائدها ⁦(ت 1626م)⁩، عبد أفريقي سابق بيع صغيرًا في بغداد، أقام سلاطين نظام شاهية صوريين وقاوم المغول بحرب العصابات نحو ربع قرن، وأسس مدينة كركي ⁦(أورنگآباد لاحقًا)⁩ {cite:zebrowski-deccani-painting-1983 p. 35}."
  en: "Statesman and commander of Ahmadnagar (d. 1626), a former African slave sold as a child in Baghdad, who set up Nizam Shahi puppet kings, resisted the Mughals with guerrilla warfare for a quarter century and founded Kirki (later Aurangabad) {cite:zebrowski-deccani-painting-1983 p. 35}."
  ur: "احمد نگر کے مدبر اور سپہ سالار ⁦(م 1626ء)⁩، سابق افریقی غلام جو بچپن میں بغداد میں بیچے گئے، جنہوں نے نظام شاہی کٹھ پتلی بادشاہ بٹھائے، تقریباً ربع صدی چھاپہ مار جنگ سے مغلوں کا مقابلہ کیا اور کرکی ⁦(بعد میں اورنگ آباد)⁩ بسایا {cite:zebrowski-deccani-painting-1983 p. 35}۔"
  es: "Estadista y comandante de Ahmadnagar (m. 1626), un antiguo esclavo africano vendido de niño en Bagdad, que estableció reyes títeres Nizam Shahi, resistió a los mogoles con guerra de guerrillas durante un cuarto de siglo y fundó Kirki (más tarde Aurangabad) {cite:zebrowski-deccani-painting-1983 p. 35}."
  fr: "Homme d'État et commandant d'Ahmadnagar (décédé en 1626), ancien esclave africain vendu enfant à Bagdad, qui a établi des rois fantoches Nizam Shahi, a résisté aux Moghols par la guérilla pendant un quart de siècle et a fondé Kirki (plus tard Aurangabad) {cite:zebrowski-deccani-painting-1983 p. 35}."
  tr: "Ahmadnagar'ın devlet adamı ve lideri (ö. 1626), çocukken Bağdat'ta satılan eski bir Afrikalı köle, Sur Şah sisteminin sultanlarını kurdu ve yaklaşık çeyrek yüzyıl boyunca Moğollara gerilla savaşıyla direnerek Karaki şehrini (daha sonra Aurangabad) kurdu. {cite:zebrowski-deccani-painting-1983, s. 35}."
  id: "Seorang negarawan dan pemimpin Ahmadnagar (wafat 1626 M), mantan budak Afrika yang dijual saat kecil di Baghdad, mendirikan para sultan sistem Tyre Shah dan melawan Mongol melalui perang gerilya selama sekitar seperempat abad, mendirikan kota Karaki (kemudian Aurangabad) {cite:zebrowski-deccani-painting-1983, hlm. 35}."
