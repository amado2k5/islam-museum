summary:
  ar: "قاضي القضاة شمس الدين محمد بن عبد الأول السيد الشريف الحسيني الجعفري التبريزي الشافعي ثم الحنفي، صدر تبريز وأحد موالي الرومية المعروف بشيشلي أمير؛ اشتغل على والده وعلى مولانا محمد البرلسي الشافعي ودرس في حياة أبيه الدرس العام سنة ست عشرة، ثم دخل الروم وترقى في مدارسها إلى أن وصل إلى إحدى الثمان، ثم ولي قضاء حلب في أواخر سنة تسع وأربعين ثم قضاء دمشق فدخلها في ربيع الثاني سنة اثنتين وخمسين، ووافق القطب بن سلطان والشيخ يونس العيثاوي في القول بتحريم القهوة ونادى بإبطالها ثم عرض بإبطالها إلى السلطان سليمان فورد أمره بإبطالها في شوال سنة ثلاث وخمسين وأشهر النداء بذلك؛ وكان عالماً فصيحاً حسن الخط، وكان له ذؤابتان يخضبهما ولحيته بالسواد، وكان محمود السيرة له حرمة زائدة؛ وتوفي بالقسطنطينية {cite:shadharat-dhahab p. 338}."
  en: "Qadi al-qudat Shams al-Din al-Ja'fari — sadr of Tabriz who rose through the Ottoman madrasas to the Eight; qadi of Aleppo in 949 then of Damascus in 952, where with Qutb b. Sultan and Yunus al-'Uthawi he proclaimed coffee abolished and obtained Sulayman's sultanic order of Shawwal 953 — the first coffee ban at Damascus; he dyed his two locks and beard black; died at Constantinople {cite:shadharat-dhahab p. 338}."
