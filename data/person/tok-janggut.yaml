summary:
  ar: "زعيم انتفاضة كلنتن سنة 1915 ضد الإدارة البريطانية (1853–1915)، اسمه حسن بن مات مونس ويُعرف بتوك جانغوت. تلقى تعليمه الديني في كلنتن ومكة، وقاد أهالي باسير بوتيه في رفض الضرائب البريطانية الجديدة، وأعلن مع زملائه استقلال باسير بوتيه أيامًا، وقُتل في مواجهة القوات البريطانية والهندية سنة 1915."
  en: "Leader of the 1915 Kelantan rebellion against the British administration (1853–1915), born Hassan bin Mat Munas and known as Tok Janggut. He received his religious education in Kelantan and Mecca, led the people of Pasir Puteh in refusing the new British taxes, briefly proclaimed Pasir Puteh independent with his companions, and was killed fighting British and Indian troops in 1915."
  ur: "کیلنتن کی 1915ء کی بغاوت کے رہنما (1853ء–1915ء)، اصل نام حسن بن مات مونس، جو ٹوک جانگوت کے نام سے مشہور ہیں۔ انہوں نے کیلنتن اور مکہ میں دینی تعلیم حاصل کی، پاسیر پوتیہ کے لوگوں کی قیادت کرتے ہوئے نئے برطانوی ٹیکسوں سے انکار کیا، ساتھیوں کے ساتھ چند دن پاسیر پوتیہ کی آزادی کا اعلان کیا، اور 1915ء میں برطانوی اور ہندوستانی فوج سے لڑتے ہوئے مارے گئے۔"
