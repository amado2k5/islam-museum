summary:
  ar: "داعية مصري وإمام وخطيب بوزارة الأوقاف المصرية في مسجد السيدة نفيسة بالقاهرة، وُلد في القاهرة سنة 1984. حصل على ليسانس الدعوة الإسلامية وليسانس الشريعة والقانون من جامعة الأزهر ثم ماجستير في الأديان والمذاهب، واشتهر بمناظراته التلفزيونية وبقناته الرسمية على يوتيوب التي تجاوز مشتركوها 2.4 مليون مشترك. مُنع من الخطابة سنة 2017 ثم أعاده القضاء إلى عمله سنة 2019، وله كتب في الرد على الشبهات والإلحاد."
  en: "Egyptian preacher, and imam and preacher at the Sayyida Nafisa Mosque in Cairo for the Egyptian Ministry of Awqaf, born in Cairo in 1984. He holds Azhar bachelor's degrees in Islamic dawah and in sharia and law and a master's in religions and schools; he became known for his televised debates and for his official YouTube channel, whose subscribers have passed 2.4 million. He was barred from preaching in 2017 and restored to his post by a court ruling in 2019, and he has written books answering doubts and atheism."
  ur: "مصری مبلغ، اور قاہرہ کی مسجد سیدہ نفیسہ میں مصری وزارتِ اوقاف کے امام و خطیب، جو 1984 میں قاہرہ میں پیدا ہوئے۔ انہوں نے الازہر سے دعوتِ اسلامی اور شریعت و قانون میں بیچلر اور ادیان و مذاہب میں ماسٹر کیا؛ وہ اپنے ٹیلی ویژن مباحثوں اور رسمی یوٹیوب چینل کے لیے مشہور ہوئے جس کے سبسکرائبرز چوبیس لاکھ سے تجاوز کر گئے۔ 2017 میں انہیں خطابت سے روکا گیا اور 2019 میں عدالت کے حکم سے وہ اپنے منصب پر واپس آئے، اور شبہات و الحاد کے رد میں ان کی کتابیں ہیں۔"
