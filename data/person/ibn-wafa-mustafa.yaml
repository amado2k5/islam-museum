summary:
  ar: "الملا مصلح الدين مصطفى الشهير بابن وفاء الحنفي العارف بالله؛ أخذ التصوف أولاً عن الشيخ مصلح الدين المشتهر بإمام الدباغين ثم اتصل بأمر منه إلى خدمة الشيخ عبد اللطيف القدسي وأكمل عنده الطريق وأجازه بالإرشاد وكان صاحب الترجمة إماماً عالماً محققاً جامعاً بين علم الظاهر والباطن له شأن عظيم من التصرفات الفائقة عارفاً بعلم الوفق بليغاً في الشعر والإنشاء خطيباً مفصحاً منقطعاً عن الناس لا يخرج إلا في أوقات معينة وإذا خرج ازدحم الأكابر وغيرهم عليه للتبرك لا يلتفت إلى أرباب الدنيا ويؤثر صحبة الفقراء عليهم، قصد السلطان محمد وبعده السلطان أبو يزيد الاجتماع به فلم يرض بذلك، توطن القسطنطينية وله بها زاوية وجامع ولما توفي حضر السلطان أبو يزيد في جنازته وأمر بكشف وجهه لينظر إليه اشتياقاً إليه وتبركاً به، توفي في حدود سنة ست وتسعين وثمانمائة {cite:shadharat-dhahab p. 359}."
  en: "Ibn Wafa — the reclusive Constantinople Sufi, master of 'ilm al-wafq, eloquent preacher who 'preferred the fuqara's company'; Mehmed II and Bayezid both sought his company and were refused, and Bayezid attended his funeral and had his face uncovered to look on him; died ~896 {cite:shadharat-dhahab p. 359}."
  es: "Ibn Wafa — el sufí ermitaño de Constantinopla, maestro de 'ilm al-wafq, elocuente predicador que 'prefería la compañía de los fuqara'; Mehmed II y Bayezid buscaron su compañía y fueron rechazados, y Bayezid asistió a su funeral y se descubrió el rostro para mirarlo; murió alrededor del año 896 {cita: shadharat-dhahab p. 359}."
  fr: "Ibn Wafa — le soufi reclus de Constantinople, maître de 'ilm al-wafq, prédicateur éloquent qui « préférait la compagnie des fuqara »; Mehmed II et Bayezid ont tous deux recherché sa compagnie et se sont vu refuser, et Bayezid a assisté à ses funérailles et a eu le visage découvert pour le regarder; mort vers 896 {cite: shadharat-dhahab p. 359}."
  ur: "ابن وفا - قسطنطنیہ کا صوفی، علم الوفاق کا ماہر، فصیح مبلغ جس نے 'فقراء کی صحبت کو ترجیح دی'؛ محمد ثانی اور بایزید دونوں نے اس کی صحبت کی کوشش کی اور انکار کر دیا گیا، اور بایزید نے اس کے جنازے میں شرکت کی اور اسے دیکھنے کے لیے اپنا چہرہ ننگا کر دیا۔ وفات ~ 896 {حوالہ: شدھارت ذہاب صفحہ۔ 359}۔"
  tr: "Mela Muslih-Din Mustafa, İbn Vafa el-Hanafi olarak bilinir, Allah'ın mistiği, önce Şeyh Muslih al-Din, İmam el-Dabbaghin'den tasavvuf öğrendi, sonra onun emriyle Şeyh Abdul Latif el-Kudüs'ün hizmetine katıldı, burada yoluna devam etti ve ona rehberlik sertifikası verdi. Bu biyografinin konusu, hem görünür hem de gizli bilgiyi birleştiren, üstün bir davranış statüsünü birleştiren, başarı biliminde bilgili, şiir ve kompozisyonda etkili bir hatip, etkileyici bir hatip ve sadece belirli zamanlarda dışarı çıkan insanlardan uzak bir alanda bir imam, bir alim, bir araştırmacı ve kapsamlı bir alimdi. O dışarı çıktığında, yaşlılar ve diğerleri toplanırdı. Dünyevi insanlara dikkat etmemek ve yoksulların yanında olmayı tercih etmek zorundaydı. Sultan Muhammed ve ardından Sultan Ebu Yezid onunla görüşmeyi planladı, ancak kabul etmedi. Konstantinopolis'e yerleşti ve orada bir zaviye ve bir cami kurdu. Öldüğünde, Sultan Ebu Yazid cenazesine katıldı ve yüzünün açılmasını emretti, böylece özlemle ve bereket aradı. Yaklaşık 896 Hicri yılında vefat etti {atıf:shadharat-dhahab, s. 359}."
  id: "Mulla Muslih al-Din Mustafa, yang dikenal sebagai Ibn Wafa al-Hanafi, mistikus Tuhan, pertama kali mempelajari Sufisme dari Sheikh Muslih al-Din, yang dikenal sebagai Imam al-Dabbaghin, kemudian atas perintahnya, bergabung dengan pelayanan Sheikh Abdul Latif al-Qudsi, di mana ia melanjutkan jalannya dan memberinya sertifikasi bimbingan. Subjek biografi ini adalah seorang imam, seorang cendekiawan, peneliti, dan ulama komprehensif yang menggabungkan pengetahuan tentang yang tampak dan yang tersembunyi, dengan sosok yang luar biasa dan berperilaku luar biasa, berpengetahuan dalam ilmu kesuksesan, fasih dalam puisi dan komposisi, orator yang fasih, dan terpisah dari orang-orang yang hanya keluar pada waktu-waktu tertentu. Ketika ia keluar, para tetua dan lainnya berkumpul. Ia diwajibkan untuk mencari berkat, tidak memperhatikan orang-orang duniawi dan lebih memilih kebersamaan dengan orang miskin daripada mereka. Sultan Muhammad, diikuti oleh Sultan Abu Yazid, berniat bertemu dengannya, tetapi ia tidak setuju. Ia menetap di Konstantinopel dan memiliki zawiya serta masjid di sana. Ketika ia meninggal, Sultan Abu Yazid menghadiri pemakamannya dan memerintahkan agar wajahnya dibuka untuk memandangnya dengan kerinduan dan memohon berkat. Ia meninggal sekitar tahun 896 H {cite:shadharat-dhahab, hlm. 359}."
