summary:
  ar: "الملا مصلح الدين مصطفى الشهير بابن وفاء الحنفي العارف بالله؛ أخذ التصوف أولاً عن الشيخ مصلح الدين المشتهر بإمام الدباغين ثم اتصل بأمر منه إلى خدمة الشيخ عبد اللطيف القدسي وأكمل عنده الطريق وأجازه بالإرشاد وكان صاحب الترجمة إماماً عالماً محققاً جامعاً بين علم الظاهر والباطن له شأن عظيم من التصرفات الفائقة عارفاً بعلم الوفق بليغاً في الشعر والإنشاء خطيباً مفصحاً منقطعاً عن الناس لا يخرج إلا في أوقات معينة وإذا خرج ازدحم الأكابر وغيرهم عليه للتبرك لا يلتفت إلى أرباب الدنيا ويؤثر صحبة الفقراء عليهم، قصد السلطان محمد وبعده السلطان أبو يزيد الاجتماع به فلم يرض بذلك، توطن القسطنطينية وله بها زاوية وجامع ولما توفي حضر السلطان أبو يزيد في جنازته وأمر بكشف وجهه لينظر إليه اشتياقاً إليه وتبركاً به، توفي في حدود سنة ست وتسعين وثمانمائة {cite:shadharat-dhahab p. 359}."
  en: "Ibn Wafa — the reclusive Constantinople Sufi, master of 'ilm al-wafq, eloquent preacher who 'preferred the fuqara's company'; Mehmed II and Bayezid both sought his company and were refused, and Bayezid attended his funeral and had his face uncovered to look on him; died ~896 {cite:shadharat-dhahab p. 359}."
