summary:
  ar: "مغنٍّ كلاسيكي هندي (1872–1937)، وُلد في كيرانا وتوفي أثناء عودته من جولة في الجنوب. أسّس مع ابن عمه عبد الواحد خان غرانة كيرانا التي عُرفت بإتقان النغمة والتطويل البطيء للراغا، وأسّس في بونا سنة 1913 مدرسة لتعليم الموسيقى، وكان من أوائل المغنين الهنود دراسةً للموسيقى الكرناتية."
  en: "Indian classical singer (1872–1937), born at Kairana and died returning from a concert tour of the South. With his cousin Abdul Wahid Khan he founded the Kirana gharana, known for exact intonation and slow melodic development of the raga; in 1913 he founded a music school at Poona, and he was among the first Hindustani musicians to study the Carnatic system seriously."
  ur: "ہندوستانی کلاسیکی گلوکار (1872ء–1937ء)، کیرانہ میں پیدا ہوئے اور جنوبی ہندوستان کے دورے سے واپسی پر وفات پائی۔ انھوں نے اپنے چچا زاد بھائی عبد الواحد خان کے ساتھ کیرانہ گھرانہ قائم کیا جو سر کی درستگی اور راگ کی سست رفتار بڑھت کے لیے مشہور ہوا؛ 1913ء میں پونا میں موسیقی کا مدرسہ قائم کیا اور کرناٹک موسیقی کا سنجیدگی سے مطالعہ کرنے والے پہلے ہندوستانی گلوکاروں میں سے تھے۔"
