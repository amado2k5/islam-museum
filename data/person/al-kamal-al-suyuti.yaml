id: person/al-kamal-al-suyuti
class: person
label: { ar: "الكمال محمد بن أبي بكر والد السيوطي", en: "al-Kamal Muhammad ibn Abi Bakr, father of al-Suyuti", es: "al-Kamal Muhammad ibn Abi Bakr, father of al-Suyuti", fr: "al-Kamal Muhammad ibn Abi Bakr, father of al-Suyuti", ur: "الکمال محمد ابن ابی بکر، السیوطی کے والد" }
summary:
  ar: "والد المؤلف جلال الدين السيوطي، كان إماماً للخليفة المستكفي الثاني عنده بمكان رفيع خصيصاً به محترماً عنده جداً وكتب له نسخة عهد الخلافة، وقال ابنه لم ننشأ إلا في بيته وفضله، ولم يعش بعد المستكفي إلا أربعين يوماً {cite:tarikh-khulafa-minhaj-1434 p. 773-775}."
  en: "The author's father, imam to caliph al-Mustakfi II — held in highest honour, writer of his deed of appointment — who outlived his caliph by only forty days {cite:tarikh-khulafa-minhaj-1434 p. 773-775}."
  es: "El padre del autor, imán del califa al-Mustakfi II —considerado con el más alto honor, redactor de su acta de nombramiento— que sobrevivió a su califa por tan solo cuarenta días {cite:tarikh-khulafa-minhaj-1434 p. 773-775}."
  fr: "Le père de l'auteur, imam du calife al-Mustakfi II — tenu en très haute estime, auteur de son acte de nomination — qui a survécu à son calife de seulement quarante jours {cite:tarikh-khulafa-minhaj-1434 p. 773-775}."
  ur: "مصنف کے والد، خلیفہ المستقفی دوم کے امام - اعلیٰ ترین اعزاز میں، ان کی تقرری کے مصنف - جو اپنے خلیفہ سے صرف چالیس دن زندہ رہے۔ 773-775}۔"
  tr: "Yazarın babası Celaleddin el-Suyuti, Halife el-Mustafa II için özellikle seçkin bir yerde, onun tarafından büyük saygı gören bir imamdı, onun için büyük saygı duyuyordu ve onun için Halifelik Dönemi'nin bir kopyasını yazdı. Oğlu şöyle dedi: Biz sadece onun evinde ve erdeminde büyüdük, el-Mustakfi ise sadece kırk gün yaşadı {atıf:Tarikh-khulafa-minhaj-1434, s. 773-775}."
  id: "Ayah penulisnya, Jalal al-Din al-Suyuti, adalah imam untuk Khalifah al-Mustakfi II di tempat yang sangat terhormat menurutnya, sangat dihormati olehnya, dan menulis salinan Era Khilafah untuknya. Putranya berkata: Kami hanya tumbuh di rumah dan kebajikannya, dan setelah al-Mustakfi hanya hidup empat puluh hari {cite:Tarikh-khulafa-minhaj-1434, hlm. 773-775}."
