summary:
  ar: "ضابط توكولوري في فيلق الرماة السنغاليين (توفي في 24 فبراير 1902)، وأول أفريقي أسود يبلغ رتبة نقيب في الجيش الفرنسي، بمرسوم استثنائي في 19 أكتوبر 1883. وُلد في سويما قرب بودور، وتلقى تكوينًا قرآنيًا في صباه وعلّم الدراسات القرآنية، ثم تطوّع سنة 1860 خلافًا لرغبة أبيه، وحارب ضد سيكو أمادو وساموري توري، وصار قائدًا لمركزي نيامينا وغومبو، وسُمّي «فاما» بامبوك سنة 1899، وتوفي في كيتا أثناء مهمة تجنيد لسكك الحديد."
  en: "Toucouleur officer of the Senegalese tirailleurs (died 24 February 1902), the first Black African to reach the rank of captain in the French army, by an exceptional decree of 19 October 1883. Born at Souïma near Podor, he was given a Quranic formation as a child and taught Quranic studies, then enlisted in 1860 against his father's wish, campaigned against Seku Amadu and Samori Ture, commanded the posts of Nyamina and Goumbo, was named fama of Bambouck in 1899, and died at Kita on a railway recruitment mission."
  ur: "سینیگالی تیرایوں کی فوج کے توکولور افسر (وفات 24 فروری 1902ء)، فرانسیسی فوج میں نقيب (کپتان) کے عہدے تک پہنچنے والے پہلے سیاہ فام افریقی، جنہیں 19 اکتوبر 1883ء کو ایک استثنائی فرمان سے یہ رتبہ ملا۔ سويما، بودور کے قریب پیدا ہوئے؛ بچپن میں قرآنی تعلیم پائی اور قرآنی درس دیا، پھر 1860ء میں والد کی خواہش کے خلاف بھرتی ہوئے، سیکو امادو اور ساموری تورے کے خلاف مہموں میں شریک رہے، نیامینا اور گومبو کی چوکیوں کی کمان سنبھالی، 1899ء میں بامبوک کے «فاما» نامزد ہوئے، اور ریلوے بھرتی کی مہم پر کیتا میں وفات پائی۔"
