summary:
  ar: "الوليد بن الوليد بن المغيرة أخو خالد بن الوليد، يذكره الشيخ عمر عبد الكافي في درسه ويقول إن شهرة أخيه غطّت عليه. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:53:30} ويصفه بأنه تلميذ رسول الله. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:54:30}"
