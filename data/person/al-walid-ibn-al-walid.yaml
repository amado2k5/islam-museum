label:
  ar: "الوليد بن الوليد بن المغيرة"
  en: "Al-Walid ibn al-Walid ibn al-Mughira"
  fr: "Al-Walid ibn al-Walid ibn al-Mughira"
  ur: "ولید بن ولید بن مغیرہ"
  es: "Al-Walid ibn al-Walid ibn al-Mughira"
gender: male
summary:
  ar: "الوليد بن الوليد بن المغيرة أخو خالد بن الوليد، يذكره الشيخ عمر عبد الكافي في درسه ويقول إن شهرة أخيه غطّت عليه. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:53:30} ويصفه بأنه تلميذ رسول الله. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:54:30}"
  en: "Al-Walid ibn al-Walid ibn al-Mughira was the brother of Khalid ibn al-Walid; Sheikh Omar Abdelkafy mentions him in his lesson and says that his brother's fame has overshadowed him. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:53:30} The Sheikh calls him a student of the Messenger of God. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:54:30}"
  fr: "Al-Walid ibn al-Walid ibn Al-Mughira était le frère de Khalid ibn Al-Walid ; Cheikh Omar Abdelkafy le mentionne dans sa leçon et dit que la renommée de son frère l'a éclipsé. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:53:30} Le cheikh l'appelle un élève du Messager de Dieu. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:54:30}"
  ur: "ولید بن ولید بن مغیرہ خالد بن ولید کے بھائی تھے؛ شیخ عمر عبد الکافی اپنے درس میں ان کا ذکر کرتے ہیں اور کہتے ہیں کہ ان کے بھائی کی شہرت نے انہیں ڈھانپ لیا۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:53:30} شیخ انہیں رسول اللہ کا شاگرد قرار دیتے ہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:54:30}"
  es: "Al-Walid ibn al-Walid ibn al-Mughira era hermano de Khalid ibn al-Walid; El jeque Omar Abdelkafy lo menciona en su lección y dice que la fama de su hermano lo ha eclipsado. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:53:30} El jeque lo llama alumno del Mensajero de Dios. {cita:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:54:30}"
  tr: "Halid bin el-Velid'in kardeşi El-Velid bin Velid bin Velid'in kardeşi, Şeyh Ömer Abdülkafi tarafından derslerinde anılır; Şeyh, kardeşinin ününün kendisini gölgede bıraktığını söyler. {cite:assabile-omar-abdelkafy tafsir-al-Quran-al-Kareem/ep10 00:53:30} ve onu Allah'ın Elçi'nin öğrencisi olarak tanımlar. {cite:assabile-omar-abdelkafy tafsir-al-Quran-al-Kareem/ep10 00:54:30}"
  id: "Al-Walid ibn al-Walid ibn al-Mughira, saudara Khalid ibn al-Walid, disebutkan oleh Sheikh Umar Abd al-Kafi dalam pelajarannya, yang mengatakan bahwa ketenaran saudaranya menutupi dirinya. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:53:30} dan menggambarkannya sebagai murid Rasulullah. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:54:30}"
