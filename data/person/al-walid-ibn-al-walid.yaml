  ur: "ولید بن ولید بن مغیرہ خالد بن ولید کے بھائی تھے؛ شیخ عمر عبد الکافی اپنے درس میں ان کا ذکر کرتے ہیں اور کہتے ہیں کہ ان کے بھائی کی شہرت نے انہیں ڈھانپ لیا۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:53:30} شیخ انہیں رسول اللہ کا شاگرد قرار دیتے ہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep10 00:54:30}"
