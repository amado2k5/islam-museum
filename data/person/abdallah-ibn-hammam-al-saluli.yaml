label: { ar: "عبد الله بن همام السلولي", en: "'Abd Allah ibn Hammam al-Saluli", fr: "'Abd Allah ibn Hammam al-Saluli", es: "'Abd Allah ibn Hammam al-Saluli", ur: "عبداللہ بن ہمام السلوی" }
summary:
  ar: "شاعر عصر بني أمية، قال في أخذ يزيد البيعة لابنه معاوية قبل موته للقفها يزيد عن أبيه فخذها يا معاوي عن يزيداً ولا ترموا بها الغرضة البعيداً {cite:muruj-al-dhahab p. 52}."
  en: "The Umayyad-era poet on Yazid's pre-death bay'a for his son: 'catch it from your father, Mu'awiya — pass it from Yazid and hurl it at the distant mark' {cite:muruj-al-dhahab p. 52}."
  fr: "Le poète de l'époque omeyyade sur la bay'a que Yazid fit prêter à son fils avant sa mort : « saisis-la de ton père, Mu'awiya — reçois-la de Yazid et lance-la vers le but lointain » {cite:muruj-al-dhahab p. 52}."
  es: "El poeta de la era omeya sobre el bay'a de Yazid antes de morir por su hijo: 'tómalo de tu padre, Mu'awiya, pásalo de Yazid y lánzalo a la meta lejana' {cita:muruj-al-dhahab p. 52}."
  ur: "اموی دور کا شاعر اپنے بیٹے کے لیے یزید کی موت سے پہلے کی بیعت پر کہتا ہے: 'اسے اپنے باپ معاویہ سے پکڑو، اسے یزید سے دو اور دور کے نشان پر پھینک دو'۔ 52}۔"
  tr: "Emevi döneminin bir şairi, Yezid'in ölümünden önce oğlu Muaviye için biat etmesiyle ilgili olarak şöyle demiştir: \"Yezid bunu babasından aldı, öyleyse Muaviye, sen de Yezid'den al ve uzak hedefe atma.\" {cite:muruj-al-dhahab s. 52}"
  id: "Seorang penyair dari era Umayyah berkata, mengenai Yazid yang mengucapkan sumpah setia kepada putranya Muawiyah sebelum kematiannya: “Yazid menerimanya dari ayahnya, maka terimalah, Muawiyah, dari Yazid, dan janganlah kau sia-siakan.” {cite:muruj-al-dhahab p. 52}"
