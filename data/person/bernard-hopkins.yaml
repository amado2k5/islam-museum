summary:
  ar: "ملاكم أمريكي محترف سابق (وُلد سنة 1965 في فيلادلفيا). حمل لقب الاتحاد الدولي للملاكمة للوزن المتوسط من سنة 1995 ودافع عنه عشرين مرة، ووحّد ألقاب الوزن المتوسط سنة 2001 وصار بطلاً بلا منازع سنة 2004، ثم فاز بألقاب عالمية في خفيف الثقيل فصار أكبر بطل عالم في تاريخ الملاكمة حين فاز بلقب في السادسة والأربعين سنة 2011. امتدت مسيرته من 1988 إلى 2016 بسجل 55 فوزاً (32 بالضربة القاضية) و8 هزائم وتعادلين."
  en: "American former professional boxer (born 1965 in Philadelphia). He held the IBF middleweight title from 1995 and defended it 20 times, unified the middleweight division in 2001 and became undisputed champion in 2004, and later won light-heavyweight world titles, becoming the oldest world champion in boxing history when he won a title at 46 in 2011. He competed from 1988 to 2016 with a record of 55 wins (32 by knockout), 8 losses and 2 draws."
  ur: "امریکی سابق پیشہ ور باکسر (پیدائش 1965، فلاڈیلفیا)۔ انہوں نے 1995 سے آئی بی ایف مڈل ویٹ ٹائٹل رکھا اور اس کا بیس بار دفاع کیا، 2001 میں مڈل ویٹ ڈویژن کو متحد کیا اور 2004 میں بلا مقابلہ چیمپئن بنے، اور بعد میں لائٹ ہیوی ویٹ عالمی ٹائٹل جیتے اور 2011 میں 46 سال کی عمر میں ٹائٹل جیت کر باکسنگ کی تاریخ کے سب سے عمر رسیدہ عالمی چیمپئن بن گئے۔ ان کا کیریئر 1988 سے 2016 تک رہا، ریکارڈ 55 فتوحات (32 ناک آؤٹ)، 8 شکستیں اور 2 ڈرا۔"
