summary:
  ar: "ملاكم أمريكي محترف سابق ⁦(وُلد سنة 1965 في فيلادلفيا)⁩. حمل لقب الاتحاد الدولي للملاكمة للوزن المتوسط من سنة 1995 ودافع عنه عشرين مرة، ووحّد ألقاب الوزن المتوسط سنة 2001 وصار بطلاً بلا منازع سنة 2004، ثم فاز بألقاب عالمية في خفيف الثقيل فصار أكبر بطل عالم في تاريخ الملاكمة حين فاز بلقب في السادسة والأربعين سنة 2011. امتدت مسيرته من 1988 إلى 2016 بسجل 55 فوزاً ⁦(32 بالضربة القاضية)⁩ و8 هزائم وتعادلين."
  en: "American former professional boxer (born 1965 in Philadelphia). He held the IBF middleweight title from 1995 and defended it 20 times, unified the middleweight division in 2001 and became undisputed champion in 2004, and later won light-heavyweight world titles, becoming the oldest world champion in boxing history when he won a title at 46 in 2011. He competed from 1988 to 2016 with a record of 55 wins (32 by knockout), 8 losses and 2 draws."
  ur: "امریکی سابق پیشہ ور باکسر ⁦(پیدائش 1965، فلاڈیلفیا)⁩۔ انہوں نے 1995 سے آئی بی ایف مڈل ویٹ ٹائٹل رکھا اور اس کا بیس بار دفاع کیا، 2001 میں مڈل ویٹ ڈویژن کو متحد کیا اور 2004 میں بلا مقابلہ چیمپئن بنے، اور بعد میں لائٹ ہیوی ویٹ عالمی ٹائٹل جیتے اور 2011 میں 46 سال کی عمر میں ٹائٹل جیت کر باکسنگ کی تاریخ کے سب سے عمر رسیدہ عالمی چیمپئن بن گئے۔ ان کا کیریئر 1988 سے 2016 تک رہا، ریکارڈ 55 فتوحات ⁦(32 ناک آؤٹ)⁩، 8 شکستیں اور 2 ڈرا۔"
  es: "Exboxeador profesional estadounidense (nacido en 1965 en Filadelfia). Ostentó el título de peso mediano de la FIB desde 1995 y lo defendió 20 veces, unificó la división de peso mediano en 2001 y se convirtió en campeón indiscutible en 2004, y posteriormente ganó títulos mundiales de peso semipesado, convirtiéndose en el campeón mundial de mayor edad en la historia del boxeo al ganar un título a los 46 años en 2011. Compitió desde 1988 hasta 2016 con un récord de 55 victorias (32 por nocaut), 8 derrotas y 2 empates."
  fr: "Ancien boxeur professionnel américain (né en 1965 à Philadelphie). Il a détenu le titre IBF des poids moyens de 1995 à 20 ans, l'a défendu avec succès, a unifié la catégorie en 2001 et est devenu champion incontesté en 2004. Il a ensuite remporté des titres mondiaux chez les mi-lourds, devenant le champion du monde le plus âgé de l'histoire de la boxe à 46 ans en 2011. Il a boxé de 1988 à 2016, avec un palmarès de 55 victoires (dont 32 par KO), 8 défaites et 2 nuls."
  tr: "Eski profesyonel Amerikalı boksör (1965 doğumlu, Philadelphia). 1995'te Uluslararası Boks Federasyonu orta sıklet unvanını elinde tuttu ve yirmi kez korudu, birleşti, 2001'de orta sıklet unvanlarını kazandı, 2004'te tartışmasız şampiyon oldu, ardından hafif ağır sıklet kategorisinde dünya şampiyonlukları kazandı ve 2011'de 46. siklette şampiyonluk kazanarak boks tarihinin en yaşlı dünya şampiyonu oldu. Kariyeri 1988'den 2016'ya kadar sürdü; 55 galibiyet (32'si nakavtla), 8 mağlubiyet ve 2 beraberlikti."
  id: "Mantan petinju profesional Amerika (lahir tahun 1965 di Philadelphia). Ia memegang gelar kelas menengah International Boxing Federation pada tahun 1995 dan mempertahankannya sebanyak dua puluh kali, bersatu, memenangkan gelar kelas menengah pada tahun 2001, menjadi juara tak terbantahkan pada tahun 2004, lalu memenangkan gelar dunia di divisi kelas berat ringan, menjadi juara dunia tertua dalam sejarah tinju ketika ia memenangkan gelar tersebut pada ronde ke-46 pada tahun 2011. Kariernya berlangsung dari tahun 1988 hingga 2016, dengan rekor 55 kemenangan (32 dengan knockout), 8 kekalahan, dan 2 kali seri."
