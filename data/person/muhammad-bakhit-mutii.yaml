label:
  ar: محمد بخيت المطيعي
  en: Muhammad Bakhit Mutii
  es: "Muhammad Bakhit Mutii"
  fr: "Muhammad Bakhit Mutii"
  ur: "محمد بخت مطیع"
roles:
- mufti
- scholar
gender: male
summary:
  ar: محمد بخيت بن حسين المطيعي الحنفي، مفتي الديار المصرية من 1333 إلى 1339هـ ومن كبار فقهائها، ولد في المطيعة من أعمال أسيوط ودرس في الأزهر، 1271 إلى 1354هـ.
  en: Muhammad Bakhit ibn Husayn al-Mutii al-Hanafi, mufti of the Egyptian lands from 1333 to 1339 AH and one of its great jurists, born in al-Mutia in the district of Asyut and taught at al-Azhar, 1271 to 1354 AH.
  es: "Muhammad Bakhit ibn Husayn al-Mutii al-Hanafi, muftí de las tierras egipcias desde 1333 hasta 1339 AH y uno de sus grandes juristas, nació en al-Mutia, en el distrito de Asyut, y enseñó en al-Azhar, desde 1271 hasta 1354 AH."
  fr: "Muhammad Bakhit ibn Husayn al-Mutii al-Hanafi, mufti des terres égyptiennes de 1333 à 1339 AH et l'un de ses grands juristes, né à al-Mutia dans le district d'Assiout et ayant enseigné à al-Azhar, de 1271 à 1354 AH."
  ur: "محمد بخیت ابن حسین المطیع الحنفی، 1333 سے 1339 ہجری تک مصری سرزمین کے مفتی اور اس کے عظیم فقہاء میں سے ایک، ضلع اسیوط کے المطیعہ میں پیدا ہوئے اور الازہر میں 1271 سے 1354 ہجری تک پڑھاتے رہے۔"
  tr: "1333-1339 H. arasında Mısır Müftüsü ve önde gelen hukukçulardan biri olan Muhammed Bakhit bin Hüseyin El-Mutai'i El-Hanafi, Asyut eserlerinde Al-Muti'a'da doğmuş ve 1271-1354 H. arasında Ezher'de eğitim görmüştür."
  id: "Muhammad Bakhit bin Hussein Al-Mutai'i Al-Hanafi, Mufti Mesir dari tahun 1333 hingga 1339 H dan salah satu ahli hukum terkemuka di sana, lahir di Al-Muti'a dalam karya Asyut dan belajar di Al-Azhar dari tahun 1271 hingga 1354 H."
