summary:
  ar: "الحسين بن زكرويه القرمطي المعروف بصاحب الشامة، قام على أخيه يحيى بن زكرويه بعد قتله؛ في سنة إحدى وتسعين ومائتين هزمه أصحاب السلطان وأُسر بموضع يقال له التقرمطي وحُمل إلى الرقة وعليه برنس، ثم جعل له المكتفي كرسيًا ارتفاعه ذراعان ونصف على ظهر فيل ودخل به بغداد والأسرى بين يديه وقد جُعل في فيه خشبة مخروطة شدّت إلى تفاه كهيئة اللجام، وأمر ببناء دكة في المصلى العتيق من الجانب الشرقي ارتفاعها عشر أذرع، فلما كان يوم الاثنين لسبع بقين من ربيع الأول قُدِّم له أربعة وثلاثون من الأسارى فقُطعت أيديهم وأرجلهم وضُربت أعناقهم واحدًا بعد واحد، ثم قُدِّم فضُرب مائتي سوط وقُطعت يداه ورجلاه وكُوي ثم أُحرق ورُفع رأسه على خشبة وصُلب بدنه في طرف الجسر الأعلى {cite:muntazam-ibn-al-jawzi p. 335-336}."
  en: "The Qarmatian 'Sahib al-Shama', who led the Syrian revolt after his brother Yahya's death; defeated and captured in 291, he was paraded into Baghdad on an elephant with a peg in his mouth like a bit, then on Monday 7 Rabi' I executed on a ten-cubit scaffold at al-Musalla al-'Atiq — thirty-four captives dismembered and beheaded before him, then two hundred lashes, severed limbs, cauterizing, burning, his head on a stake and his body crucified at the upper bridge {cite:muntazam-ibn-al-jawzi p. 335-336}."
