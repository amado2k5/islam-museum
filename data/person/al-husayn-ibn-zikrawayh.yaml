summary:
  ar: "الحسين بن زكرويه القرمطي المعروف بصاحب الشامة، قام على أخيه يحيى بن زكرويه بعد قتله؛ في سنة إحدى وتسعين ومائتين هزمه أصحاب السلطان وأُسر بموضع يقال له التقرمطي وحُمل إلى الرقة وعليه برنس، ثم جعل له المكتفي كرسيًا ارتفاعه ذراعان ونصف على ظهر فيل ودخل به بغداد والأسرى بين يديه وقد جُعل في فيه خشبة مخروطة شدّت إلى تفاه كهيئة اللجام، وأمر ببناء دكة في المصلى العتيق من الجانب الشرقي ارتفاعها عشر أذرع، فلما كان يوم الاثنين لسبع بقين من ربيع الأول قُدِّم له أربعة وثلاثون من الأسارى فقُطعت أيديهم وأرجلهم وضُربت أعناقهم واحدًا بعد واحد، ثم قُدِّم فضُرب مائتي سوط وقُطعت يداه ورجلاه وكُوي ثم أُحرق ورُفع رأسه على خشبة وصُلب بدنه في طرف الجسر الأعلى {cite:muntazam-ibn-al-jawzi p. 335-336}."
  en: "The Qarmatian 'Sahib al-Shama', who led the Syrian revolt after his brother Yahya's death; defeated and captured in 291, he was paraded into Baghdad on an elephant with a peg in his mouth like a bit, then on Monday 7 Rabi' I executed on a ten-cubit scaffold at al-Musalla al-'Atiq — thirty-four captives dismembered and beheaded before him, then two hundred lashes, severed limbs, cauterizing, burning, his head on a stake and his body crucified at the upper bridge {cite:muntazam-ibn-al-jawzi p. 335-336}."
  es: "El cármata 'Sahib al-Shama', quien lideró la revuelta siria después de la muerte de su hermano Yahya; derrotado y capturado en 291, fue llevado a Bagdad en un elefante con una estaca en la boca como un bocado, luego el lunes 7 de Rabi' I fue ejecutado en un cadalso de diez codos en al-Musalla al-'Atiq: treinta y cuatro cautivos desmembrados y decapitados ante él, luego doscientos latigazos, miembros amputados, cauterización, quemaduras, su cabeza en una estaca y su cuerpo crucificado en el puente superior {cite:muntazam-ibn-al-jawzi p. 335-336}."
  fr: "Le 'Sahib al-Shama' qarmate, qui mena la révolte syrienne après la mort de son frère Yahya, fut vaincu et capturé en 291. Il fut exhibé à Bagdad sur un éléphant avec un pieu dans la bouche comme un mors, puis, le lundi 7 Rabi' I, exécuté sur un échafaud de dix coudées à al-Musalla al-'Atiq — trente-quatre captifs démembrés et décapités devant lui, puis deux cents coups de fouet, des membres coupés, cautérisés, brûlés, sa tête sur un pieu et son corps crucifié au pont supérieur {cite:muntazam-ibn-al-jawzi p. 335-336}."
  ur: "قرمتی 'صاحب الشاما'، جس نے اپنے بھائی یحییٰ کی موت کے بعد شام کی بغاوت کی قیادت کی۔ 291 میں شکست کھا کر پکڑا گیا، اسے ایک ہاتھی پر بیٹھ کر بغداد پہنچایا گیا جس کے منہ میں ایک کھونٹی تھی، پھر پیر 7 ربیع کو میں نے المصلہ العتیق کے مقام پر دس ہاتھ کے سہاروں پر پھانسی دی، چونتیس اسیروں کو ٹکڑے ٹکڑے کر کے اس کے آگے سر قلم کیا گیا، پھر دو سو کوڑے مارے گئے۔ جل رہا تھا، اس کا سر داؤ پر لگا ہوا تھا اور اس کا جسم اوپری پل پر مصلوب کیا گیا تھا۔ 335-336}۔"
  tr: "Sahte evin sahibi olarak bilinen El-Hüseyin bin Zekeriye el-Karmati, 291 Hicri yılında kardeşi Yahya ibn Zekarawayh'e karşı direnmiştir. Hükümdarlar onu yenmiş ve El-Taqramati adlı bir yerde yakalayıp esir almıştır. Bir cübbe içinde Rakka'ya götürülmüştür. Sonra el-Muqtafi ona filin sırtında iki buçuk arşin yüksekliğinde bir sandalye yaparak, önünde esirlerle birlikte Bağdat'a girmiştir. Konik bir tahta tahta bir dizgin gibi sıkıca bağlanmıştır. Doğu tarafındaki eski namaz salonunda on arşin yüksekliğinde bir bank inşa edilmesini emretmişti. Ne zaman Pazartesi, Rabi'al-Awwal'ın yedinci günü, otuz dört mahkum ona getirildi, elleri ve bacakları kesildi, boyunları teker teker vuruldu. Sonra geldi ve iki yüz kırbaç vurdu, elleri ve bacakları kesildi, ütülendi, sonra yakıldı, başı bir tahtaya kaldırıldı ve cesedi üst köprünün kenarında çarmıha gerildi {cite:muntazam-ibn-al-jawzi s. 335-336}."
  id: "Al-Husayn ibn Zakariyah al-Qarmati, yang dikenal sebagai pemilik sandiwara, bangkit melawan saudaranya Yahya ibn Zakarawayh setelah pembunuhan pada tahun 291 H. Para penguasa mengalahkannya dan menangkapnya di tempat bernama Al-Taqramati. Ia dibawa ke Raqqa mengenakan jubah. Kemudian al-Muqtafi membuatkan kursi setinggi dua setengah hasta di punggung seekor gajah dan masuk ke Baghdad bersama para tawanan di depannya. Ia memasang papan kayu berbentuk kerucut yang diikat erat pada tali kekang seperti tali kekang. Ia memerintahkan pembangunan bangku di aula doa tua di sisi timur, setinggi sepuluh hasta. Ketika Pada hari Senin, tanggal tujuh Rabi' al-Awwal, tiga puluh empat tawanan dibawa kepadanya, tangan dan kaki mereka dipotong, dan leher mereka dipukul satu per satu. Kemudian dia datang dan memukul dua ratus cambukan, tangan dan kakinya dipotong, dia disetrika, kemudian dibakar, kepalanya diangkat ke atas papan, dan jenazahnya disalibkan di tepi jembatan atas {cite:muntazam-ibn-al-jawzi hlm. 335-336}."
