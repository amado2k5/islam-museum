summary:
  ar: "ثالث أئمة إمامة القوقاز وقائد المقاومة الشيشانية والداغستانية ضد الإمبراطورية الروسية نحو ربع قرن (1834–1859)، وشيخ في الطريقة النقشبدية؛ وُلد في غيمري بداغستان سنة 1797، وحّد قبائل شمال القوقاز تحت دولة شرعية منظمة، ثم استسلم سنة 1859 وعاش منفيًا في روسيا قبل أن يحجّ ويموت في المدينة سنة 1871."
  en: "Third Imam of the Caucasian Imamate and leader of the Chechen and Dagestani resistance to the Russian Empire for about a quarter of a century (1834–1859), and a sheikh of the Naqshbandi Sufi order. Born at Gimry in Dagestan in 1797, he united the tribes of the North Caucasus in an organised Sharia-governed state, surrendered in 1859, lived in exile in Russia, then performed the Hajj and died at Medina in 1871."
  ur: "قفقازی امامت کے تیسرے امام اور روسی سلطنت کے خلاف چيچن اور داغستانی مزاحمت کے تقریباً پچیس برس (1834–1859) قائد، اور نقشبندی طریقت کے شیخ؛ 1797 میں داغستان کے گمری میں پیدا ہوئے، شمالی قفقاز کے قبائل کو ایک منظم شرعی ریاست میں متحد کیا، 1859 میں ہتھیار ڈالے، روس میں جلاوطنی گزاری، پھر حج کیا اور 1871 میں مدینہ میں وفات پائی۔"
