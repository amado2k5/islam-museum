  ar: "شاعرة وروائية وأستاذة أدب مقارن سورية أمريكية، وُلدت سنة 1967. تستكشف أعمالها هويات المرأة المسلمة وتجارب المهجر العربي الأمريكي، ومن مؤلفاتها رواية «الفتاة ذات الوشاح القرمزي» وديوانا «رسائل شهرزاد» و«قصائد هاجر»."
  en: "Syrian-American poet, novelist and professor of comparative literature, born in 1967. Her work explores Muslim women’s identities and the Arab-American diaspora, including the novel The Girl in the Tangerine Scarf and the poetry collections E-mails from Scheherazad and Hagar Poems."
  ur: "شام نژاد امریکی شاعرہ، ناول نگار اور تقابلِ ادب کی پروفیسر، 1967 میں پیدا ہوئیں۔ ان کا ادب مسلم خواتین کی شناخت اور عرب-امریکی مہاجری تجربات کا جائزہ لیتا ہے؛ تصانیف میں ناول The Girl in the Tangerine Scarf اور مجموعۂ کلام E-mails from Scheherazad و Hagar Poems شامل ہیں۔"
  es: "Poeta, novelista y profesora de literatura comparada sirio-estadounidense, nacida en 1967. Su obra explora las identidades de las mujeres musulmanas y la diáspora árabe-estadounidense, incluyendo la novela The Girl in the Tangerine Scarf y las colecciones de poesía E-mails from Scheherazad y Hagar Poems."
