  ar: "الكاتب الأندلسي غرناطي الأصل؛ كتب عن سلطان المغرب أبي عنان بعد أن كتب للسلطان أبي الحجاج يوسف، وهو الذي كتب رحلة ابن بطوطة ورتبها، ومن بديعه قوله لما تنازع الكتاب والرؤساء في تشبيه العذار فقال كل فريق لا نشبهه إلا بما يناسب صنعتنا فأجمع بين المذهبين باللام {cite:nafh-tib-maqqari p. 173}."
