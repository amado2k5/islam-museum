summary:
  ar: "ملك بنت حفني ناصف ⁦(١٨٨٦–١٩١٨م)⁩، المعروفة بـ«باحثة البادية»؛ كاتبة شاعرة، كانت سيدة فضليات المسلمات في عصرها. مولدها ووفاتها في القاهرة. تعلمت في المدارس المصرية وأحرزت الشهادة العالية سنة ١٣٣١هـ واشتغلت بالتعليم في مدارس البنات الأميرية، ثم تزوجت بعبد الستار الباسل. لها كثير من المقالات في «الجريدة» جمعتها في كتاب سمته «النسائيات» في جزأين، وبدأت بتأليف كتاب سمته «حقوق النساء» فتوفات دون إتمامه {cite:al-aalam tarjama}."
  en: "Malak Hifni Nasif, 'Bahithat al-Badiya' (1886–1918 CE) — 'the foremost accomplished Muslim woman of her age', whose al-Nisa'iyyat essays argued women's education; she died with Huquq al-Nisa' unfinished {cite:al-aalam tarjama}."
  es: "Malak Hifni Nasif, 'Bahithat al-Badiya' (1886-1918 d. C.), 'la mujer musulmana más destacada de su época', cuyos ensayos de al-Nisa'iyyat defendían la educación de las mujeres; ella murió con Huquq al-Nisa 'inacabado {cita:al-aalam tarjama}."
  fr: "Malak Hifni Nasif, « Bahithat al-Badiya » (1886-1918 CE) — « la femme musulmane la plus accomplie de son âge », dont les essais al-Nisa'iyyat défendaient l'éducation des femmes; elle est morte avec Huquq al-Nisa' inachevé {cite: al-aalam tarjama}."
  ur: "ملک حفنی ناصف، 'بحیثیت البدیہ' ⁦(1886-1918 عیسوی)⁩ - 'اپنے دور کی سب سے باکمال مسلمان خاتون'، جن کے النسائی مضامین خواتین کی تعلیم پر دلائل دیتے ہیں۔ ان کا انتقال حق النساء نامکمل {حوالہ: العالم ترجمہ} کے ساتھ ہوا۔"
  tr: "Malik bint Hafni Nasif (1886–1918), 'Bedevilerin Bahajitası' olarak bilinen, döneminin Müslüman kadınları arasında önde gelen bir yazar ve şairdi. Kahire'de doğdu ve orada vefat etti. Mısır okullarında eğitim aldı ve 1331 Hicri'de yüksek bir sertifika aldı. Prenslik kız okullarında öğretmenlik yaptı, ardından Abdel Sattar al-Basel ile evlendi. 'Al-Jarida' dergisinde birçok makale yazdı, bunları iki ciltlik 'Kadın Hakları' adlı bir kitapta derledi ve 'Kadın Hakları' adlı bir kitap yazmaya başladı, ardından tamamladıktan sonra {cite:al-aalam tarjama}"
  id: "Malik bint Hafni Nasif (1886–1918 M), dikenal sebagai 'Bahajita Badui,' adalah seorang penulis dan penyair yang merupakan tokoh utama di antara perempuan Muslim pada zamannya. Ia lahir dan meninggal di Kairo. Ia belajar di sekolah-sekolah Mesir dan memperoleh sertifikat tinggi pada tahun 1331 H. Ia bekerja sebagai guru di sekolah putri bangsawan, kemudian menikah dengan Abdel Sattar al-Basel. Ia menulis banyak artikel di 'Al-Jarida,' yang ia susun menjadi sebuah buku berjudul 'Hak-hak Perempuan' dalam dua jilid, dan mulai menulis buku berjudul 'Hak-hak Perempuan' sebelum menyelesaikannya {cite:al-aalam tarjama}."
