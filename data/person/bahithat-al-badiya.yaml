summary:
  ar: "ملك بنت حفني ناصف (١٨٨٦–١٩١٨م)، المعروفة بـ«باحثة البادية»؛ كاتبة شاعرة، كانت سيدة فضليات المسلمات في عصرها. مولدها ووفاتها في القاهرة. تعلمت في المدارس المصرية وأحرزت الشهادة العالية سنة ١٣٣١هـ واشتغلت بالتعليم في مدارس البنات الأميرية، ثم تزوجت بعبد الستار الباسل. لها كثير من المقالات في «الجريدة» جمعتها في كتاب سمته «النسائيات» في جزأين، وبدأت بتأليف كتاب سمته «حقوق النساء» فتوفات دون إتمامه {cite:al-aalam tarjama}."
  en: "Malak Hifni Nasif, 'Bahithat al-Badiya' (1886–1918 CE) — 'the foremost accomplished Muslim woman of her age', whose al-Nisa'iyyat essays argued women's education; she died with Huquq al-Nisa' unfinished {cite:al-aalam tarjama}."
