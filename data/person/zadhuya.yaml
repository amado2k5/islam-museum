summary:
  ar: "زاذويه مرزبان سرخس؛ طلب الصلح من عبد الله بن خازم على إيمان مائة رجل وأن يدفع إليه النساء فصارت ابنته في سهم ابن خازم فاتخذها وسماها ميشاء ويقال إن ابن خازم سمى له المائة فلم يسم نفسه فقتله ودخل سرخس عنوة."
  en: "Zadhuya, marzban of Sarakhs; he sued for peace on aman for a hundred men and the handing over of its women — his daughter fell to Ibn Khazim, named Maysha' — or, in the other telling, the named hundred excluded himself and he was killed, the town entered by force."
