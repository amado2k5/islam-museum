id: person/zadhuya
class: person
label: { ar: "زاذويه مرزبان سرخس", en: "Zadhuya, Marzban of Sarakhs", es: "Zadhuya, Marzban of Sarakhs", fr: "Zadhuya, Marzban of Sarakhs", ur: "زدھویا، مرزبان آف سرخ" }
summary:
  ar: "زاذويه مرزبان سرخس؛ طلب الصلح من عبد الله بن خازم على إيمان مائة رجل وأن يدفع إليه النساء فصارت ابنته في سهم ابن خازم فاتخذها وسماها ميشاء ويقال إن ابن خازم سمى له المائة فلم يسم نفسه فقتله ودخل سرخس عنوة."
  en: "Zadhuya, marzban of Sarakhs; he sued for peace on aman for a hundred men and the handing over of its women — his daughter fell to Ibn Khazim, named Maysha' — or, in the other telling, the named hundred excluded himself and he was killed, the town entered by force."
  es: "Zadhuya, marzban de Sarakhs, pidió la paz en Aman a cambio de cien hombres y la entrega de sus mujeres; su hija quedó en manos de Ibn Khazim, llamado Maysha'. O, según otra versión, los cien hombres mencionados se excluyeron a sí mismos y fueron asesinados, y la ciudad fue tomada por la fuerza."
  fr: "Zadhuya, marzban de Sarakhs; il a demandé la paix en échange d'un aman pour cent hommes et de la remise de ses femmes — sa fille est tombée entre les mains d'Ibn Khazim, nommée Maysha' — ou, selon une autre version, les cent hommes nommés se sont exclus et il a été tué, la ville est entrée par la force."
  ur: "زدھویا، مرزبان آف سرخ؛ اس نے سو مردوں کے لیے امان پر صلح اور اس کی عورتوں کے حوالے کرنے کے لیے مقدمہ دائر کیا - اس کی بیٹی ابن خزیم کے پاس گئی، جس کا نام میشا تھا - یا دوسری بات میں، سو نامی شخص نے خود کو چھوڑ دیا اور اسے قتل کردیا گیا، شہر میں زبردستی داخل ہوا۔"
  tr: "Sarakhs valisi Zadhawayh; Abdullah ibn Khazim'den yüz erkeğin inancı karşılığında barış istedi ve kadınlara ödeme yapmasını istedi. Kızı İbn Hazim'in payı oldu, bu yüzden onu aldı ve Mişa adını verdi. İbn Hazim'in ona yüz isim verdiği ama kendisini vermediği söylenir, bu yüzden onu öldürdü ve zorla Sarakhs'a girdi."
  id: "Zadhawayh, gubernur Sarakhs; ia meminta perdamaian kepada Abdullah ibn Khazim sebagai imbalan atas iman seratus pria dan membayar para wanita. Putrinya menjadi bagian dari Ibn Khazim, sehingga ia membawanya dan menamainya Misha. Konon Ibn Khazim menamainya seratus tetapi tidak menyebutkan namanya, sehingga ia membunuhnya, dan ia masuk ke Sarakhs dengan paksa."
