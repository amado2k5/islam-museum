label: { ar: "خرشة بن مسعود", en: "Kharisha ibn Mas'ud", es: "Kharisha ibn Mas'ud", fr: "Kharisha ibn Mas'ud", ur: "خریشہ ابن مسعود" }
summary:
  ar: "خرشة بن مسعود من بني تميم ثم من بني شقرة؛ كان مع ابن الأشعث فتحصن بقلعة بفسا تعرف به ثم آوى فمات بواسط وله عقب بفسا."
  en: "Kharisha ibn Mas'ud of Tamim then Shaqira; with Ibn al-Ash'ath he fortified in the Fasa castle that bears his name, then fled and died at Wasit — his progeny remain at Fasa."
  es: "Kharisha ibn Mas'ud de Tamim y luego de Shaqira; junto con Ibn al-Ash'ath se fortificó en el castillo de Fasa que lleva su nombre, luego huyó y murió en Wasit; su descendencia permanece en Fasa."
  fr: "Kharisha ibn Mas'ud de Tamim puis Shaqira; avec Ibn al-Ash'ath, il fortifia le château de Fasa qui porte son nom, puis s'enfuit et mourut à Wasit — sa progéniture reste à Fasa."
  ur: "تمیم کے خریشہ بن مسعود پھر شقیرہ۔ ابن اشعث کے ساتھ اس نے قلعہ فاسہ میں قلعہ بندی کی جو اس کا نام رکھتا ہے، پھر فرار ہو کر واسط میں مر گیا - اس کی اولاد فاسہ میں ہی رہ گئی۔"
  tr: "Harsha bin Mas'ud, önce Banu Tamim'den, sonra Banu Shaqra'dandı; İbn al-Ash'ath ile birlikteydi ve Fasa'da Fasa'da bir kalede, Fasa'da tahkim etti, ardından sığındı ve Wasit'te öldü. Fasa'da bir soyundan gelmişti."
  id: "Kharsha ibn Mas'ud berasal dari Banu Tamim dan kemudian dari Banu Shaqra; ia bersama Ibn al-Ash'ath dan memperkuat diri di sebuah benteng di Fasa, yang dikenal sebagai Fasa, lalu berlindung dan meninggal di Wasit. Ia memiliki keturunan di Fasa."
