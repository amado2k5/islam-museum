summary:
  ar: أمير من الأجواد الممدوحين، حاجب المنصور، وولي السند والبصرة والكوفة وفلسطين ثم القيروان، وتوفي سنة 174 هـ الموافقة 791 م؛ وورد في قصة أبي دلامة حين أُكره على الخروج معه ضد الخوارج. {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 p. 34} {cite:nihayat-al-arab-nuwayri-vol4-scan p. 41-42}
  en: An amir counted among the praised generous, chamberlain of al-Mansur and governor of Sind, Basra, Kufa, Palestine and then Qayrawan, who died in 174 AH (791 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 p. 34}; also named in an anecdote of Abu Dulama, who was pressed into a campaign under him against the Kharijites. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 41-42}
  ur: ایک امیر، مشہور سخیوں میں سے، منصور کے حاجب اور سندھ، بصرہ، کوفہ، فلسطین اور پھر قیروان کے والی، جن کی وفات 174ھ بمطابق 791ء میں ہوئی {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 p. 34}؛ ابو دلامہ کے قصے میں ان کے ساتھ خارجیوں کے خلاف مہم میں جانے پر مجبور ہونے کا ذکر ہے۔ {cite:nihayat-al-arab-nuwayri-vol4-scan p. 41-42}
