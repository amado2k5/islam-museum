summary:
  ar: أمير من الأجواد الممدوحين، حاجب المنصور، وولي السند والبصرة والكوفة وفلسطين ثم القيروان، وتوفي سنة 174 هـ الموافقة 791 م؛ وورد في قصة أبي دلامة حين أُكره على الخروج معه ضد الخوارج. {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 p. 34} {cite:nihayat-al-arab-nuwayri-vol4-scan p. 41-42}
  en: An amir counted among the praised generous, chamberlain of al-Mansur and governor of Sind, Basra, Kufa, Palestine and then Qayrawan, who died in 174 AH (791 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 p. 34}; also named in an anecdote of Abu Dulama, who was pressed into a campaign under him against the Kharijites. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 41-42}
  ur: ایک امیر، مشہور سخیوں میں سے، منصور کے حاجب اور سندھ، بصرہ، کوفہ، فلسطین اور پھر قیروان کے والی، جن کی وفات 174ھ بمطابق 791ء میں ہوئی {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 p. 34}؛ ابو دلامہ کے قصے میں ان کے ساتھ خارجیوں کے خلاف مہم میں جانے پر مجبور ہونے کا ذکر ہے۔ {cite:nihayat-al-arab-nuwayri-vol4-scan p. 41-42}
  es: "Un emir considerado generoso y elogiado, chambelán de al-Mansur y gobernador de Sind, Basora, Kufa, Palestina y luego Qayrawan, que murió en 174 AH (791 d. C.) {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 p. 34}; también mencionado en una anécdota de Abu Dulama, quien fue reclutado para una campaña bajo su mando contra los jariyíes. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 41-42}"
  fr: "Un émir réputé pour sa générosité, chambellan d'al-Mansur et gouverneur du Sind, de Bassora, de Koufa, de Palestine puis de Qayrawan, décédé en 174 AH (791 ap. J.-C.) {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 p. 34}; il est également mentionné dans une anecdote concernant Abou Dulama, qui fut contraint de mener une campagne sous ses ordres contre les Kharijites. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 41-42}"
  tr: "Asil ve övgü alan bir prens, El-Mansur'un kadeh taşıyıcısı olarak Sind, Basra, Kufe, Filistin ve ardından Kairuan'ı yönetti. 174 Hicri (791 M.S.) yılında öldü. Ebu Dallamah hikayesinde, Haricilere karşı isyan etmek zorunda kaldığı belirtilir. {cite:alam-zirikli-dar-al-ilm-2002 cilt 3 s. 34} {cite:nihayat-al-arab-nuwayri-vol4-scan s. 41-42}"
  id: "Seorang pangeran bangsawan dan dipuji, pembawa cawan Al-Mansur, ia memerintah Sindh, Basra, Kufa, Palestina, dan kemudian Kairouan. Ia meninggal pada tahun 174 H (791 M). Disebutkan dalam kisah Abu Dallamah bahwa ia terpaksa memberontak melawan Kharijites. {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 hlm. 34} {cite:nihayat-al-arab-nuwayri-vol4-scan hlm. 41-42}"
