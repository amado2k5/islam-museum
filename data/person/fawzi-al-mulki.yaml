summary:
  ar: "سياسي ودبلوماسي أردني (1910–1962)، أول رئيس وزراء في عهد الملك حسين ⁦(أيار 1953 – أيار 1954)⁩؛ وُلد في إربد وتخرج في الجامعة الأمريكية في بيروت وجامعة كامبردج، وعمل وزيرًا مفوضًا في مصر ووزيرًا في باريس وسفيرًا في لندن قبل رئاسته الحكومة، وختم مسيرته مندوبًا دائمًا للأردن لدى الأمم المتحدة، وهو والد رئيس الوزراء اللاحق هاني الملقي."
  en: "Jordanian politician and diplomat (1910–1962), the first prime minister of King Hussein's reign (May 1953 – May 1954). Born at Irbid and educated at the American University of Beirut and Cambridge, he served as minister to Egypt, minister in Paris and ambassador in London before his premiership, and ended his career as Jordan's permanent representative to the United Nations; he was the father of the later prime minister Hani al-Mulki."
  ur: "اردنی سیاست دان اور سفارت کار (1910–1962)، شاہ حسین کے عہد کے پہلے وزیر اعظم ⁦(مئی 1953 – مئی 1954)⁩؛ اربد میں پیدا ہوئے، امریکن یونیورسٹی آف بیروت اور کیمبرج سے تعلیم پائی، وزارت عظمیٰ سے پہلے مصر میں وزیر مفوض، پیرس میں وزیر اور لندن میں سفیر رہے، اور اپنے آخری برس اقوام متحدہ میں اردن کے مستقل نمائندے رہے؛ وہ بعد کے وزیر اعظم ہانی الملقی کے والد تھے۔"
  es: "Político y diplomático jordano (1910-1962), primer ministro del reinado del rey Hussein (mayo de 1953 - mayo de 1954). Nacido en Irbid y educado en la Universidad Americana de Beirut y en Cambridge, fue ministro en Egipto, ministro en París y embajador en Londres antes de convertirse en primer ministro, y finalizó su carrera como representante permanente de Jordania ante las Naciones Unidas; fue padre del posterior primer ministro Hani al-Mulki."
  fr: "Homme politique et diplomate jordanien (1910-1962), premier Premier ministre du règne du roi Hussein (mai 1953 – mai 1954). Né à Irbid et formé à l'Université américaine de Beyrouth et à Cambridge, il fut ministre en Égypte, ministre à Paris et ambassadeur à Londres avant d'accéder à la fonction de Premier ministre, et termina sa carrière comme représentant permanent de la Jordanie auprès des Nations Unies; il était le père du futur Premier ministre Hani al-Mulki."
  tr: "Ürdünlü siyasetçi ve diplomat (1910–1962), Kral Hüseyin'in saltanatı sırasında (Mayıs 1953 – Mayıs 1954) ilk Başbakan oldu; İrbid doğumlu, Beyrut Amerikan Üniversitesi ve Cambridge Üniversitesi'nden mezun oldu, Mısır'da Tam Yetkili Bakan, Paris'te Tam Yetkili Bakan ve Londra'da Büyükelçi olarak görev yaptıktan sonra Başbakan oldu. Kariyerini Ürdün'ün Birleşmiş Milletler Daimi Temsilcisi olarak tamamladı ve daha sonra Başbakan olan Hani Al-Mulki'nin babasıdır."
  id: "Politikus dan diplomat Yordania (1910–1962), Perdana Menteri pertama pada masa pemerintahan Raja Hussein (Mei 1953 – Mei 1954); lahir di Irbid, lulus dari American University of Beirut dan Cambridge University, pernah menjabat sebagai Menteri Berkuasa Penuh di Mesir, Menteri Berkuasa Penuh di Paris, dan Duta Besar di London sebelum menjadi Perdana Menteri. Ia mengakhiri kariernya sebagai Perwakilan Tetap Yordania untuk Perserikatan Bangsa-Bangsa dan merupakan ayah dari Perdana Menteri Hani Al-Mulki yang kemudian menjadi."
