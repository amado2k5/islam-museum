summary:
  ar: "سياسي ودبلوماسي أردني (1910–1962)، أول رئيس وزراء في عهد الملك حسين (أيار 1953 – أيار 1954)؛ وُلد في إربد وتخرج في الجامعة الأمريكية في بيروت وجامعة كامبردج، وعمل وزيرًا مفوضًا في مصر ووزيرًا في باريس وسفيرًا في لندن قبل رئاسته الحكومة، وختم مسيرته مندوبًا دائمًا للأردن لدى الأمم المتحدة، وهو والد رئيس الوزراء اللاحق هاني الملقي."
  en: "Jordanian politician and diplomat (1910–1962), the first prime minister of King Hussein's reign (May 1953 – May 1954). Born at Irbid and educated at the American University of Beirut and Cambridge, he served as minister to Egypt, minister in Paris and ambassador in London before his premiership, and ended his career as Jordan's permanent representative to the United Nations; he was the father of the later prime minister Hani al-Mulki."
  ur: "اردنی سیاست دان اور سفارت کار (1910–1962)، شاہ حسین کے عہد کے پہلے وزیر اعظم (مئی 1953 – مئی 1954)؛ اربد میں پیدا ہوئے، امریکن یونیورسٹی آف بیروت اور کیمبرج سے تعلیم پائی، وزارت عظمیٰ سے پہلے مصر میں وزیر مفوض، پیرس میں وزیر اور لندن میں سفیر رہے، اور اپنے آخری برس اقوام متحدہ میں اردن کے مستقل نمائندے رہے؛ وہ بعد کے وزیر اعظم ہانی الملقی کے والد تھے۔"
