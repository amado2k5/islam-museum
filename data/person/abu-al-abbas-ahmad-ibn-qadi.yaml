summary:
  ar: "الفقيه العالم الذي تزعم سفارة أهل الجزائر إلى السلطان سليم الأول، حاملاً رسالة مؤرخة بأوائل ذي القعدة ٩٢٥هـ (٢٦ أكتوبر – ٣ نوفمبر ١٥١٩م) كُتبت بأمر خير الدين بربروسة باسم القضاة والخطباء والفقهاء والأئمة والتجار والأعيان وسكان مدينة الجزائر، لطلب ربط الجزائر بالدولة العثمانية. يصفه الصلابي بأنه كان من أكبر علماء الجزائر وقائداً عسكرياً وزعيماً سياسياً. الوثيقة محفوظة في دار المحفوظات بطوب قابي سيراي تحت رقم ٤٦٥٦ وترجمها عبد الجليل التميمي {cite:dawlat-uthmaniyya-salabi p. 211-212}."
  en: "The jurist who led the embassy of Algiers to Sultan Selim I, bearing a letter of early Dhu'l-Qa'da 925/October–November 1519 — written at Khayr al-Din's order in the name of the city's qadis, khatibs, ulema, merchants and notables — asking to bind Algiers to the Ottoman state. Al-Salabi calls him one of Algiers' greatest scholars and a military and political leader; the document is Topkapı archival no. 4656, translated by Abd al-Jalil al-Tamimi {cite:dawlat-uthmaniyya-salabi p. 211-212}."
