summary:
  ar: "الفقيه العالم الذي تزعم سفارة أهل الجزائر إلى السلطان سليم الأول، حاملاً رسالة مؤرخة بأوائل ذي القعدة ٩٢٥هـ ⁦(٢٦ أكتوبر – ٣ نوفمبر ١٥١٩م)⁩ كُتبت بأمر خير الدين بربروسة باسم القضاة والخطباء والفقهاء والأئمة والتجار والأعيان وسكان مدينة الجزائر، لطلب ربط الجزائر بالدولة العثمانية. يصفه الصلابي بأنه كان من أكبر علماء الجزائر وقائداً عسكرياً وزعيماً سياسياً. الوثيقة محفوظة في دار المحفوظات بطوب قابي سيراي تحت رقم ٤٦٥٦ وترجمها عبد الجليل التميمي {cite:dawlat-uthmaniyya-salabi p. 211-212}."
  en: "The jurist who led the embassy of Algiers to Sultan Selim I, bearing a letter of early Dhu'l-Qa'da 925/October–November 1519 — written at Khayr al-Din's order in the name of the city's qadis, khatibs, ulema, merchants and notables — asking to bind Algiers to the Ottoman state. Al-Salabi calls him one of Algiers' greatest scholars and a military and political leader; the document is Topkapı archival no. 4656, translated by Abd al-Jalil al-Tamimi {cite:dawlat-uthmaniyya-salabi p. 211-212}."
  fr: "Le juriste qui conduisit l'ambassade d'Alger auprès du sultan Selim Ier, porteur d'une lettre du début de Dhu'l-Qa'da 925/octobre–novembre 1519 — écrite sur ordre de Khayr al-Din au nom des cadis, khatibs, oulémas, marchands et notables de la ville — demandant à rattacher Alger à l'État ottoman. Al-Salabi le dit l'un des plus grands savants d'Alger et un chef militaire et politique ; le document est le n° 4656 des archives de Topkapı, traduit par Abd al-Jalil al-Tamimi {cite:dawlat-uthmaniyya-salabi p. 211-212}."
  es: "El jurista que dirigió la embajada de Argel ante el sultán Selim I, portando una carta de principios de Dhu'l-Qa'da 925/octubre-noviembre de 1519 —escrita por orden de Khayr al-Din en nombre de los cadíes, khatibs, ulemas, comerciantes y notables de la ciudad— solicitando la incorporación de Argel al estado otomano. Al-Salabi lo describe como uno de los más grandes eruditos de Argel y un líder militar y político; el documento es el número de archivo Topkapı 4656, traducido por Abd al-Jalil al-Tamimi {cite:dawlat-uthmaniyya-salabi p. 211-212}."
