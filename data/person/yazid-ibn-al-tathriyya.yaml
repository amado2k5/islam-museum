summary:
  ar: "أبو المهلب يزيد بن المنتشر بن سلمة الخير بن قشير بن كعب بن ربيعة بن عامر بن صعصعة المعروف بابن الطثرية الشاعر المشهور؛ كان ابن الطثرية شاعراً مطبوعاً كامل الأدب وافر المروءة لا يُعاب ولا يُطعن عليه وكان شجاعاً أصيلاً ومحلاً في قومه من قشير وكان من شعراء بني أمية مقدماً عندهم، وسُمِّي مُوَدِّقاً لحسن وجهه وحلاوة شعره فكانوا يقولون إنه إذا جلس بين النساء مُوَدِّقاً؛ وهو من أعيان الشعراء ذكره أبو تمام الطائي في كتاب الحماسة في عدة مواضع، وجمع أبو الفرج الأصبهاني صاحب كتاب الأغاني شعره في ديوان {cite:wafayat-ayan}."
  en: "Yazid b. al-Tathriyya al-Qushayri — the Khariji poet of Banu Amir, nicknamed al-Muwaddiq for his beauty and sweet verse; anthologised by Abu Tammam in the Hamasa and collected into a diwan by Abu al-Faraj al-Isfahani {cite:wafayat-ayan}."
  es: "Yazid b. al-Tathriyya al-Qushayri, el poeta jarijita de Banu Amir, apodado al-Muwaddiq por su belleza y sus dulces versos; antologado por Abu Tammam en Hamasa y recopilado en un diván por Abu al-Faraj al-Isfahani."
  fr: "Yazid b. al-Tathriyya al-Qushayri — le poète kharijite de Banu Amir, surnommé al-Muwaddiq pour sa beauté et ses vers doux; anthologisé par Abu Tammam dans le Hamasa et rassemblé dans un diwan par Abu al-Faraj al-Isfahani."
  ur: "یزید بی۔ الطہریہ القشیری - بنو عامر کا خارجی شاعر، جسے اس کی خوبصورتی اور پیاری نظم کی وجہ سے المحدث کا لقب دیا جاتا ہے۔ ابو تمام نے حماسہ میں تحریر کیا ہے اور ابو الفراج اصفہانی کے دیوان میں جمع کیا ہے۔"
  tr: "Ebu el-Muhallab Yezid ibn el-Muntaşir ibn Salamah el-Hayr ibn Kuşayr ibn Ka'b ibn Rabi'ah ibn Amir ibn Sa'sa'a, ünlü şair olarak bilinen İbn al-Tathriyya; İbn al-Tathriyya, asla eleştirilmeyen, bol şövalyelik gösteren terbiyeli bir şairdi. Cesur, samimi ve Qushayr'dan gelen halkı arasında saygı gören biriydi. Emevi şairleri arasındaydı ve aralarında önde gelen şair olarak kabul edilirdi. Güzel görünüşü ve şiirlerinin tatlılığı nedeniyle 'Muwaddaq' olarak adlandırılmıştır, bu yüzden kadınların arasında oturduğunda 'Muwaddaq' olarak kabul edilirdi; kendisi önde gelen şairlerden biriydi. Ebu Temmam el-Ta'i, El-Hamasah adlı kitabında onu birkaç yerde anmıştır ve Kitab el-Ağani'nin yazarı Ebu el-Faraj el-İsfahani, divanda şiirlerini toplamıştır. Wafayat-ayan}."
  id: "Abu al-Muhallab Yazid ibn al-Muntashir ibn Salamah al-Khayr ibn Qushayr ibn Ka'b ibn Rabi'ah ibn Amir ibn Sa'sa'a, dikenal sebagai Ibn al-Tathriyya, penyair terkenal; Ibn al-Tathriyya adalah penyair yang sopan santun dengan kesatria yang melimpah, tidak pernah dikritik atau dikritik. Ia berani, tulus, dan dihormati di antara bangsanya sejak Qushayr. Ia termasuk di antara Penyair Umayyah dan dianggap sebagai penyair terkemuka di antara mereka. Ia disebut 'Muwaddaq' karena penampilannya yang indah dan manisnya puisinya, sehingga dikatakan bahwa ketika ia duduk di antara wanita, ia dianggap 'Muwaddaq'; ia adalah salah satu penyair terkemuka. Abu Tammam al-Ta'i menyebutnya di beberapa tempat dalam bukunya Al-Hamasah, dan Abu al-Faraj al-Isfahani, penulis Kitab al-Aghani, mengumpulkan puisinya dalam diwan {cite:Wafayat-Ayan}."
