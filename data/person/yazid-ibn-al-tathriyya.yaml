summary:
  ar: "أبو المهلب يزيد بن المنتشر بن سلمة الخير بن قشير بن كعب بن ربيعة بن عامر بن صعصعة المعروف بابن الطثرية الشاعر المشهور؛ كان ابن الطثرية شاعراً مطبوعاً كامل الأدب وافر المروءة لا يُعاب ولا يُطعن عليه وكان شجاعاً أصيلاً ومحلاً في قومه من قشير وكان من شعراء بني أمية مقدماً عندهم، وسُمِّي مُوَدِّقاً لحسن وجهه وحلاوة شعره فكانوا يقولون إنه إذا جلس بين النساء مُوَدِّقاً؛ وهو من أعيان الشعراء ذكره أبو تمام الطائي في كتاب الحماسة في عدة مواضع، وجمع أبو الفرج الأصبهاني صاحب كتاب الأغاني شعره في ديوان {cite:wafayat-ayan}."
  en: "Yazid b. al-Tathriyya al-Qushayri — the Khariji poet of Banu Amir, nicknamed al-Muwaddiq for his beauty and sweet verse; anthologised by Abu Tammam in the Hamasa and collected into a diwan by Abu al-Faraj al-Isfahani {cite:wafayat-ayan}."
