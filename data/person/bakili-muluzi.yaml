summary:
  ar: "سياسي مالاوي (مواليد 1943) عمل وزيرا وأمينا عاما لحزب المؤتمر في حكومة هاستينغز باندا ثم قاد المعارضة في الجبهة الديمقراطية للوحدة، ففاز بأول انتخابات تعددية سنة 1994 منهيًا حكم باندا الذي دام ثلاثة عقود، وأعيد انتخابه سنة 1999، وسلّم السلطة سنة 2004 بعد فشل مسعى الولاية الثالثة. لاحقته فضيحة بيع احتياطي الذرة واعتقالات وتهم فساد، ومُنع من الترشح سنة 2009، واعتزل السياسة النشطة في ديسمبر 2009. وهو أول رئيس مسلم لمالاوي ووالد أتوبيلي مولوزي."
  en: "Malawian politician (born 1943) who served as a minister and as secretary general of the Malawi Congress Party in Hastings Banda's government, then led the opposition United Democratic Front and won the first multiparty election of 1994, ending Banda's three decades of rule; he was re-elected in 1999 and handed over power in 2004 after the third-term bid failed. His later years brought the maize-reserve scandal, arrests and corruption charges, a court bar on his 2009 candidacy, and retirement from active politics in December 2009. He was Malawi's first Muslim president and the father of Atupele Muluzi."
  ur: "ملاوی کے سیاست دان (پیدائش 1943ء) جو ہیسٹنگز بانڈا کی حکومت میں وزیر اور ملاوی کانگریس پارٹی کے سیکرٹری جنرل رہے، پھر یونائیٹڈ ڈیموکریٹک فرنٹ کی قیادت میں اپوزیشن کے رہنما بنے اور 1994ء کے پہلے کثیر الجماعتی انتخابات جیت کر بانڈا کی تین دہائیوں کی حکمرانی ختم کی؛ 1999ء میں دوبارہ منتخب ہوئے اور تیسری مدت کی کوشش ناکام ہونے کے بعد 2004ء میں اقتدار منتقل کیا۔ بعد کے برسوں میں مکئی کے ذخیرے کا اسکینڈل، گرفتاریاں اور بدعنوانی کے الزامات آئے، 2009ء میں عدالت نے ان کی امیدواری روک دی اور دسمبر 2009ء میں وہ فعال سیاست سے ریٹائر ہو گئے۔ وہ ملاوی کے پہلے مسلم صدر اور اٹوپیلے مولوزی کے والد تھے۔"
