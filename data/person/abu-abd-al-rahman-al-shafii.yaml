summary:
  ar: "أحمد بن محمد بن عبد الله بن محمد بن العباس بن عثمان، أبو عبد الرحمن الشافعي، قال أبو الحسن الرازي إنه كان واسع العلم جليلاً فاضلاً، وكان أبوه من فقهاء أصحاب الشافعي، وله مناظرات مع المزني، وتزوج بابنة الشافعي زينب فأولدها أحمد، وتفقه بأبيه، وروى الكثير عنه عن الشافعي. ⁦(؟ - ٢٩٥ه)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  en: "Ahmad ibn Muhammad ibn Abd Allah, Abu Abd al-Rahman al-Shafi'i. Abu al-Hasan al-Razi called him learned and excellent. He had debates with al-Muzani, married Zaynab, daughter of al-Shafi'i, and studied with his father and transmitted much from al-Shafi'i. Death 295 H as printed. The son born of that marriage is a separate entry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  fr: "Ahmad ibn Muhammad ibn Abd Allah, Abu Abd al-Rahman al-Shafi'i. Abu al-Hasan al-Razi le dit savant et excellent. Il eut des débats avec al-Muzani, épousa Zaynab, fille d'al-Shafi'i, étudia auprès de son père et transmit beaucoup d'al-Shafi'i. Mort en 295 H selon l'imprimé. Le fils né de ce mariage fait l'objet d'une notice distincte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  es: "Ahmad ibn Muhammad ibn Abd Allah, Abu Abd al-Rahman al-Shafi'i. Abu al-Hasan al-Razi lo describió como un hombre erudito y excelente. Debatió con al-Muzani, se casó con Zaynab, hija de al-Shafi'i, estudió con su padre y transmitió gran parte de sus enseñanzas. Falleció en el año 295 de la Hégira (según consta en la edición impresa). El hijo nacido de ese matrimonio se menciona en una entrada aparte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  ur: "احمد بن محمد بن عبد اللہ، ابو عبدالرحمٰن الشافعی۔ ابو الحسن الرازی نے انہیں عالم اور بہترین کہا۔ اس نے المزانی کے ساتھ بحثیں کیں، الشافعی کی بیٹی زینب سے شادی کی، اور اپنے والد کے ساتھ تعلیم حاصل کی اور الشافعی سے بہت کچھ نقل کیا۔ وفات 295ھ بطور مطبوعہ۔ اس شادی سے پیدا ہونے والا بیٹا الگ اندراج ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص13346}"
  tr: "Ahmed ibn Muhammed ibn Abdullah ibn Muhammed ibn el-Abbas ibn Osman, Ebu Abdülrahman el-Şafii. Ebu el-Hasan el-Razi, onun engin bilgiye sahip, seçkin ve erdemli bir kişi olduğunu söylemiştir. Babası Şafiî mezhebinin fıkıhçılarından biriydi ve el-Muzani ile tartışmalar yapmıştır. Şafiî'nin kızı Zeynep ile evlenmiş ve ondan Ahmed doğmuştur. Babasından fıkıh eğitimi almış ve Şafiî'den rivayetle birçok hadis nakletmiştir. (? - 295 Hicri). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13346}"
  id: "Ahmad ibn Muhammad ibn Abdullah ibn Muhammad ibn al-Abbas ibn Uthman, Abu Abd al-Rahman al-Shafi'i. Abu al-Hasan al-Razi mengatakan bahwa beliau adalah seorang yang berilmu luas, terkemuka, dan berbudi luhur. Ayahnya adalah salah satu ahli fiqih mazhab Syafi'i, dan beliau berdebat dengan al-Muzani. Beliau menikahi Zaynab, putri al-Shafi'i, dan darinya lahirlah Ahmad. Beliau mempelajari fiqih di bawah bimbingan ayahnya dan meriwayatkan banyak hadits darinya berdasarkan riwayat al-Shafi'i. (? - 295 H). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
