summary:
  ar: "أحمد بن محمد بن عبد الله بن محمد بن العباس بن عثمان، أبو عبد الرحمن الشافعي، قال أبو الحسن الرازي إنه كان واسع العلم جليلاً فاضلاً، وكان أبوه من فقهاء أصحاب الشافعي، وله مناظرات مع المزني، وتزوج بابنة الشافعي زينب فأولدها أحمد، وتفقه بأبيه، وروى الكثير عنه عن الشافعي. (؟ - ٢٩٥ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  en: "Ahmad ibn Muhammad ibn Abd Allah, Abu Abd al-Rahman al-Shafi'i. Abu al-Hasan al-Razi called him learned and excellent. He had debates with al-Muzani, married Zaynab, daughter of al-Shafi'i, and studied with his father and transmitted much from al-Shafi'i. Death 295 H as printed. The son born of that marriage is a separate entry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
