summary:
  ar: "محمد بن عبد الكريم بن محمد المغيلي التلمساني، مفسر فقيه مالكي من أهل تلمسان، اشتهر في توات بمناوأته لليهود، ورحل إلى السودان وبلاد التكرور لنشر أحكام الشرع، وله البدر المنير وتاج الدين فيما يجب على الملوك وأحكام أهل الذمة وشرح مختصر خليل؛ توفي في توات."
  en: "Muhammad ibn Abd al-Karim ibn Muhammad al-Maghili al-Tilimsani, an exegete and Maliki jurist of Tlemcen, known in Tuwat for his opposition to the Jews; he travelled to the Sudan and Takrur to spread the rulings of the shari'a and wrote al-Badr al-munir, a treatise on the duties of kings, a work on the dhimma and a commentary on Khalil's Mukhtasar; he died in Tuwat."
  es: "Muhammad ibn Abd al-Karim ibn Muhammad al-Maghili al-Tilimsani, exegeta y jurista malikí de Tlemcen, conocido en Tuwat por su oposición a los judíos; viajó a Sudán y Takrur para difundir las normas de la sharia y escribió al-Badr al-munir, un tratado sobre los deberes de los reyes, una obra sobre la dhimma y un comentario sobre el Mukhtasar de Khalil; murió en Tuwat."
  fr: "Muhammad ibn Abd al-Karim ibn Muhammad al-Maghili al-Tilimsani, exégète et juriste malikite de Tlemcen, connu à Tuwat pour son opposition aux Juifs; il voyagea au Soudan et à Takrur pour diffuser les préceptes de la charia et écrivit al-Badr al-munir, un traité sur les devoirs des rois, un ouvrage sur la dhimma et un commentaire du Mukhtasar de Khalil; il mourut à Tuwat."
