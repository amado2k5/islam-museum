label: { ar: "ابن النحوي", en: "Ibn al-Nahwi", es: "Ibn al-Nahwi", fr: "Ibn al-Nahwi", ur: "ابن النحوی" }
summary:
  ar: "يوسف بن محمد الأنصاري المعروف بابن النحوي، شاعر أندلسي من فقهاء الأدب. نقل ابن خلدون عن أبي القاسم بن رضوان كاتب العلمة بالدولة المرينية أنه أنشد أبا العباس بن شعيب كاتب السلطان أبي الحسن المريني مطلع قصيدته لم أدر حيني وقيفتي بالأطلال ما الفرق بين جديدهما والبالي فقال ابن شعيب على البديهة هذا شعر فقيه لأن عبارة ما الفرق من اصطلاح الفقهاء لا من أساليب كلام العرب، ضربها ابن خلدون مثلاً على أن الملكة اللغوية تفضحها مادة المحفوظ السابق إلى الفكر {cite:muqaddima-ibn-khaldun p. 615-616}."
  en: "Andalusi poet whose verse-opening Abu al-Abbas b. Shu'ayb instantly diagnosed as a faqih's work {cite:muqaddima-ibn-khaldun p. 615-616}."
  es: "Poeta andaluz cuyo verso inaugural Abu al-Abbas b. Shu'ayb fue diagnosticado instantáneamente como obra de un faqih {cita:muqaddima-ibn-khaldun p. 615-616}."
  fr: "Poète andalou dont l'ouverture du vers Abu al-Abbas b. Shu'ayb a été immédiatement diagnostiqué comme étant l'œuvre d'un faqih {cite:muqaddima-ibn-khaldun p. 615-616}."
  ur: "اندلس کے شاعر جس کی آیت کھولنے والے ابو العباس بن۔ شعیب نے فوری طور پر فقیہ کے کام کی تشخیص کی 615-616}۔"
  tr: "Yusuf ibn Muhammed el-Ensari, İbn el-Nehvi olarak bilinen, Endülüslü bir şair ve edebi hukukçuydu. İbn Haldun, Marinid devletindeki alimin katibi Ebu el-Kasım bin Ridvan'dan alıntı yapmıştır; Ridvan, şiirinin başında Sultan Ebu el-Hasan el-Marini'nin katibi Ebu Abbas bin Şuayb'a şöyle okumuştur: 'Harabelerin yanında durduğumda bilmiyordum—yeni ile yıpranmış arasındaki fark nedir?' İbn Şuayb sezgisel olarak şöyle demiştir: Bu bir hukukçunun şiiridir çünkü 'fark Arapça konuşma tarzlarından değil, hukukçuların terminolojisinden kaynaklanır.' İbn Haldun bunu örnek olarak vererek, dilsel ustalığın daha önce bahsedilen materyalle ortaya çıktığını öne sürmüştür {alıntı::] Muqaddima-ibn-Haldun, s. 615-616}."
  id: "Yusuf ibn Muhammad al-Ansari, yang dikenal sebagai Ibn al-Nahwi, adalah seorang penyair Andalusia dan ahli hukum sastra. Ibn Khaldun mengutip Abu al-Qasim ibn Ridwan, juru tulis dari seorang ulama di negara Marinid, yang membacakan kepada Abu al-Abbas ibn Shu'ayb, juru tulis Sultan Abu al-Hasan al-Marini, di awal puisinya: 'Saya tidak tahu ketika saya berdiri di dekat reruntuhan—apa bedanya antara yang baru dan yang usang? Ibn Shu'ayb secara intuitif berkata: Ini adalah puisi seorang ahli hukum karena frasa 'apa bedanya berasal dari terminologi para ahli hukum, bukan dari gaya bahasa Arab.' Ibn Khaldun memberikannya sebagai contoh, menyatakan bahwa penguasaan linguistik terungkap oleh materi yang telah disebutkan sebelumnya {cite:muqaddima-ibn-khaldun, hlm. 615-616}."
