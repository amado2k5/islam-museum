id: person/ibn-al-nahwi
class: person
label: { ar: "ابن النحوي", en: "Ibn al-Nahwi" }
summary:
  ar: "يوسف بن محمد الأنصاري المعروف بابن النحوي، شاعر أندلسي من فقهاء الأدب. نقل ابن خلدون عن أبي القاسم بن رضوان كاتب العلمة بالدولة المرينية أنه أنشد أبا العباس بن شعيب كاتب السلطان أبي الحسن المريني مطلع قصيدته لم أدر حيني وقيفتي بالأطلال ما الفرق بين جديدهما والبالي فقال ابن شعيب على البديهة هذا شعر فقيه لأن عبارة ما الفرق من اصطلاح الفقهاء لا من أساليب كلام العرب، ضربها ابن خلدون مثلاً على أن الملكة اللغوية تفضحها مادة المحفوظ السابق إلى الفكر {cite:muqaddima-ibn-khaldun p. 615-616}."
  en: "Andalusi poet whose verse-opening Abu al-Abbas b. Shu'ayb instantly diagnosed as a faqih's work {cite:muqaddima-ibn-khaldun p. 615-616}."
