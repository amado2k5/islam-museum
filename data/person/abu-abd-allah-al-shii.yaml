id: person/abu-abd-allah-al-shii
class: person
label: { ar: "أبو عبد الله الشيعي", en: "Abu Abd Allah al-Shi'i", fr: "Abu Abd Allah al-Shi'i", es: "Abu Abd Allah al-Shi'i", ur: "ابو عبد اللہ الشیعی" }
summary:
  ar: "الداعي، ظهر بالمغرب سنة ثمان وثمانين فدعا قبيلة كتامة إلى الإمام المهدي فاستجابوا فهذا أول ظهور العبيدية الذين صاروا ملوك ديار مصر {cite:tarikh-khulafa-minhaj-1434 p. 576}. وعند المسعودي أخرج زيادة الله بن عبد الله آخر آل الأغلب من إفريقية سنة ست وتسعين ومائتين وقيل خمس وتسعين وكان يدعو إلى عبيد الله صاحب المغرب {cite:muruj-al-dhahab p. 647-648}، وعند ابن خلدون وسار بنفسه يفتح بلاد إفريقية قصراً قصراً ففتح بلزمة عنوة وطبنة على الأمان وباغاية ومرماجنة وتيفاش ومسلبابة وتبسة ومجانة والقصرين وهزم عساكر زيادة الله وإبراهيم بن أبي الأغلب ثم دخل رقادة في رجب سنة 296هـ ونزل قصورها وفرق دورها على كتامة ثم سار إلى سجلماسة فأخرج المهدي وابنه أبا القاسم من الحبس وأركبهما ومشى بين يديهما {cite:tarikh-ibn-khaldun-ibar p. 803}"
  en: "The da'i who appeared in the Maghreb in 288 calling Kutama to al-Mahdi — first emergence of the Ubaydids {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  fr: "Le da'i apparu au Maghreb en 288, appelant les Kutama au Mahdi — première apparition des Ubaydides {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  es: "El da'i que apareció en el Magreb en 288 llamando a Kutama a al-Mahdi — primera aparición de los Ubaydids {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  ur: "وہ داعی جو 288 میں مغرب میں کتامہ کو المہدی کی طرف بلانے کے لیے نمودار ہوا - عبیدیوں کا پہلا ظہور 576}۔"
  tr: "Da'i, Hicri 88 yılında Fas'ta ortaya çıktı ve Kutama kabilesini İmam Mehdi'ye çağırdı ve onlar da karşılık verdi. Bu, Mısır'ın hükümdarları olan Fatimilerin ilk ortaya çıkışıydı. {kaynak:tarikh-khulafa-minhaj-1434 s. 576}. El-Mas'udi'ye göre, Ağlabidlerin sonuncusu Ziyadet Allah ibn Abd Allah, Hicri 296 yılında veya 295 yılında İfrikiye'den kovuldu ve Fas hükümdarı Ubeyd Allah'a biat çağrısında bulunuyordu. {kaynak:muruj-al-dhahab s. 647-648} ve İbn Haldun'a göre, kendisi İfrikiye topraklarını saray saray fethetmek için yürüdü. Balzma'yı zorla, Tubna'yı ise güvenli geçiş yoluyla ele geçirdi; Baghaia, Marmajana, Tifash, Maslababa, Tebessa, Majana ve iki sarayı da aldı. Ziyadat Allah ve İbrahim ibn Abi al-Aghlab'ın ordularını mağlup etti. Sonra Hicri 296 yılının Receb ayında Rakkada'ya girdi, saraylarında kamp kurdu ve evlerini Kutama halkına dağıttı. Ardından Sijilmasa'ya yürüdü, Mehdi ve oğlu Ebu el-Kasım'ı hapisten kurtardı, onlara bindi ve önlerinde yürüdü. {cite:tarikh-ibn-khaldun-ibar s. 803}"
  id: "Da’i muncul di Maroko pada tahun 88 H dan menyeru suku Kutama kepada Imam Mahdi, dan mereka menanggapi seruan tersebut. Ini adalah kemunculan pertama Dinasti Fatimiyah, yang kemudian menjadi penguasa Mesir. {cite:tarikh-khulafa-minhaj-1434 hlm. 576}. Menurut al-Mas’udi, Ziyadat Allah ibn Abd Allah, penguasa terakhir Dinasti Aghlabid, diusir dari Ifriqiya pada tahun 296 H, atau dikatakan juga tahun 295 H, dan ia menyerukan kesetiaan kepada Ubayd Allah, penguasa Maroko. {cite:muruj-al-dhahab hlm. 647-648}, dan menurut Ibn Khaldun, ia sendiri berbaris untuk menaklukkan wilayah Ifriqiya, istana demi istana. Ia menaklukkan Balzma dengan kekerasan, dan Tubna dengan jaminan keselamatan, serta Baghaia, Marmajana, Tifash, Maslababa, Tebessa, Majana, dan kedua istana. Ia mengalahkan pasukan Ziyadat Allah dan Ibrahim ibn Abi al-Aghlab. Kemudian ia memasuki Raqqada pada bulan Rajab tahun 296 H dan berkemah di istana-istananya serta membagikan rumah-rumahnya kepada kaum Kutama. Kemudian ia berbaris ke Sijilmasa dan membebaskan al-Mahdi dan putranya Abu al-Qasim dari penjara, lalu menunggangi mereka dan berjalan di depan mereka. {cite:tarikh-ibn-khaldun-ibar p. 803}"
