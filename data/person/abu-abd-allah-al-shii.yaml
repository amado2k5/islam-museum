label: { ar: "أبو عبد الله الشيعي", en: "Abu Abd Allah al-Shi'i" }
summary:
  ar: "الداعي، ظهر بالمغرب سنة ثمان وثمانين فدعا قبيلة كتامة إلى الإمام المهدي فاستجابوا فهذا أول ظهور العبيدية الذين صاروا ملوك ديار مصر {cite:tarikh-khulafa-minhaj-1434 p. 576}. وعند المسعودي أخرج زيادة الله بن عبد الله آخر آل الأغلب من إفريقية سنة ست وتسعين ومائتين وقيل خمس وتسعين وكان يدعو إلى عبيد الله صاحب المغرب {cite:muruj-al-dhahab p. 647-648}، وعند ابن خلدون وسار بنفسه يفتح بلاد إفريقية قصراً قصراً ففتح بلزمة عنوة وطبنة على الأمان وباغاية ومرماجنة وتيفاش ومسلبابة وتبسة ومجانة والقصرين وهزم عساكر زيادة الله وإبراهيم بن أبي الأغلب ثم دخل رقادة في رجب سنة 296هـ ونزل قصورها وفرق دورها على كتامة ثم سار إلى سجلماسة فأخرج المهدي وابنه أبا القاسم من الحبس وأركبهما ومشى بين يديهما {cite:tarikh-ibn-khaldun-ibar p. 803}"
  en: "The da'i who appeared in the Maghreb in 288 calling Kutama to al-Mahdi — first emergence of the Ubaydids {cite:tarikh-khulafa-minhaj-1434 p. 576}."
