summary:
  ar: "أحمد بن عبد الرحيم بن الحسين، أبو زرعة ولي الدين المعروف بابن العراقي، كردي الأصل، ولد بالقاهرة وتوفي بها، من أئمة الشافعية بمصر في عصره، صاحب تصانيف في الأصول والفروع، ناب في القضاء نحو عشرين سنة، ثم ولي قضاء الديار المصرية. من تصانيفه «البيان والتوضيح لمن أخرج له في الصحيح» و«أخبار المدلسين». توفي سنة 826هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2050}"
  en: "Ahmad ibn Abd al-Rahim ibn al-Husayn, Abu Zur'a Wali al-Din, known as Ibn al-Iraqi, of Kurdish origin, born and died in Cairo. A leading Shafi'i of Egypt in his time and an author on the principles and branches of law, he deputised as judge for about twenty years and then held the judgeship of Egypt. His works include 'al-Bayan wa-al-tawdih' on those whom the Sahih includes but who have been touched by some criticism, and 'Akhbar al-mudallisin'. He died in 826 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2050}"
