summary:
  ar: "خلف عبد العزيز بن عباس في قلعة بني عباس فامتلك نواحي بلاد كوكو واعترف به حسن بن خير الدين؛ قاد ألف فارس صباحي في جيش حسن لحصار وهران سنة ٩٧١هـ/١٥٦٣م {cite:dawlat-uthmaniyya-salabi p. 249-250}."
  en: "Abd al-Aziz b. Abbas's successor at Qal'at Bani Abbas; he held the Kuku country with Hasan b. Khayr al-Din's recognition, and led the thousand Sipahi horse in Hasan's army at the siege of Oran in 971/1563 {cite:dawlat-uthmaniyya-salabi p. 249-250}."
  es: "Abd al-Aziz b. el sucesor de Abbas en Qal'at Bani Abbas; ocupó el país Kuku con Hasan b. El reconocimiento de Khayr al-Din y dirigió los mil caballos Sipahi en el ejército de Hasan en el asedio de Orán en 971/1563 {cita:dawlat-uthmaniyya-salabi p. 249-250}."
  fr: "Abd al-Aziz b. le successeur d'Abbas à Qal'at Bani Abbas; il détenait le pays Kuku avec Hasan b. Khayr al-Din, et dirigea les mille chevaux Sipahi dans l'armée de Hasan au siège d'Oran en 971/1563 {cite:dawlat-uthmaniyya-salabi p. 249-250}."
  ur: "عبد العزیز بی۔ قلات بنی عباس میں عباس کا جانشین؛ اس نے کوکو ملک حسن بن کے ساتھ رکھا۔ خیرالدین کی پہچان، اور 971/1563 میں اوران کے محاصرے میں حسن کی فوج میں ہزار سپاہی گھوڑے کی قیادت کی۔ 249-250}۔"
  tr: "Abdul Aziz bin Abbas, Beni Abbas kalesinde başarılı oldu ve böylece Koko topraklarının kontrolünü ele geçirdi. Hasan bin Hayr el-Din onu tanıdı ve 971 Hicri/1563 Miladi yılında Hasan'ın ordusunda bin süvariyle Oran'ı kuşattı. {cite:dawlat-uthmaniyya-salabi s. 249-250}."
  id: "Abdul Aziz bin Abbas berhasil merebut benteng Bani Abbas, sehingga ia menguasai wilayah Koko, dan Hassan bin Khair al-Din mengakuinya; ia memimpin seribu pasukan berkuda pagi dalam pasukan Hassan untuk mengepung Oran pada tahun 971 H/1563 M {cite:dawlat-uthmaniyya-salabi p. 249-250}."
