  ar: "شهاب الدين أحمد بن هلال الحلبي؛ اشتغل قديماً على الشيخ شمس الدين بن الخراط وغيره وكان مفرط الذكاء، وأخذ التصوف عن شمس الدين البلالي ثم توغل في مذهب أهل الوحدة ودعا إليه وضار كثيراً من الشطح وجرت له وقائع وكان أتباعه يبالغون في إطرائه ويقولون هو نقطة الدائرة وغير ذلك من مقالاتهم المستشعة، توفي سنة أربع وعشرين وثمانمائة {cite:shadharat-dhahab p. 172}."
  en: "Shihab al-Din Ahmad b. Hilal of Aleppo — pupil of Ibn al-Kharrat and the Sufi Shams al-Din al-Bilali who then plunged into wahdat al-wujud preaching and ecstatic utterance; his followers called him 'the point of the circle'; died 824 {cite:shadharat-dhahab p. 172}."
