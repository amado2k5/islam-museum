summary:
  ar: "شهاب الدين أحمد بن هلال الحلبي؛ اشتغل قديماً على الشيخ شمس الدين بن الخراط وغيره وكان مفرط الذكاء، وأخذ التصوف عن شمس الدين البلالي ثم توغل في مذهب أهل الوحدة ودعا إليه وضار كثيراً من الشطح وجرت له وقائع وكان أتباعه يبالغون في إطرائه ويقولون هو نقطة الدائرة وغير ذلك من مقالاتهم المستشعة، توفي سنة أربع وعشرين وثمانمائة {cite:shadharat-dhahab p. 172}."
  en: "Shihab al-Din Ahmad b. Hilal of Aleppo — pupil of Ibn al-Kharrat and the Sufi Shams al-Din al-Bilali who then plunged into wahdat al-wujud preaching and ecstatic utterance; his followers called him 'the point of the circle'; died 824 {cite:shadharat-dhahab p. 172}."
  es: "Shihab al-Din Ahmad b. Hilal de Alepo — discípulo de Ibn al-Kharrat y del sufí Shams al-Din al-Bilali, quien luego se sumergió en la predicación de wahdat al-wujud y en la expresión extática; sus seguidores lo llamaban 'el punto del círculo'; murió en 824 {cita: shadharat-dhahab p. 172}."
  fr: "Shihab al-Din Ahmad b. Hilal d'Alep — élève d'Ibn al-Kharrat et du soufi Shams al-Din al-Bilali qui s'est ensuite plongé dans la prédication wahdat al-wujud et les paroles extatiques; ses disciples l'appelaient « le point du cercle »; mort en 824 {cite: shadharat-dhahab p. 172}."
  ur: "شہاب الدین احمد بی۔ حلب کا ہلال - ابن الخرات کا شاگرد اور صوفی شمس الدین البلالی جو پھر وحدت الوجود کی تبلیغ اور پرجوش کلام میں ڈوب گیا؛ اس کے پیروکار اسے 'دائرے کا نقطہ' کہتے تھے۔ وفات 824۔ 172}۔"
  tr: "Şihabeddin Ahmed bin Hilal al-Halabi; daha önce Şeyh Şemseddin ibn al-Kharrat ve diğerlerinin yanında eğitim aldı. Son derece zekiydi. Şemseddin el-Bilali'den tasavvuf öğrendi, ardından Ehl-i Vehde mezhametine daldı ve ona karşı büyük zarar verdi. Takipçileri onu abartarak onu övdü, çevrenin ve tartışmalı diğer maddelerin amacı olduğunu söylediler. 824 Hicri yılında vefat etti {atıf:şadharat-dhahab, s. 172}."
  id: "Shihab al-Din Ahmad ibn Hilal al-Halabi; ia sebelumnya belajar di bawah Sheikh Shams al-Din ibn al-Kharrat dan lainnya. Ia sangat cerdas. Ia mempelajari Sufisme dari Shams al-Din al-Bilali, lalu mendalami aliran Ahl al-Wahda dan menyerukannya, menyebabkan banyak kerugian akibat kelakuan berlebihan dan kejadian yang dialaminya. Para pengikutnya melebih-lebihkan dengan memujinya, mengatakan bahwa ia adalah pusat lingkaran dan artikel kontroversial lainnya. Ia meninggal pada tahun 824 H {cite:shadharat-dhahab, hlm. 172}."
