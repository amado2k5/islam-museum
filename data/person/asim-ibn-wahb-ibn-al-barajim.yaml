summary:
  ar: "شاعر بصري مولده الكوفة، قدم سامراء في عهد المتوكل فأعطي ثلاثين ألف درهم على مدح، ومدح مالك بن طوق فأرسل إليه مائة دينار. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 61}"
  en: "A Basran poet born in Kufa who came to Samarra under al-Mutawakkil and received 30,000 dirhams for a praise poem; he also praised Malik ibn Tawq, who sent him 100 dinars. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 61}"
  ur: "بصری شاعر، کوفہ میں پیدا ہوئے؛ متوکل کے دور میں سامراء آئے اور ایک مدحیہ قصیدے پر 30000 درہم پائے، اور مالک بن طوق کی مدح پر انہیں 100 دینار ملے۔ {cite:nihayat-al-arab-nuwayri-vol4-scan p. 61}"
