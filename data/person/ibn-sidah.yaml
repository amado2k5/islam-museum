label: { ar: "ابن سيده المرسي علي بن إسماعيل" }
summary:
  ar: "أبو الحسن ابن سيده علي بن إسماعيل المرسي، العلامة صاحب المحكم في اللغة؛ كان أعمى ابن أعمى، رأساً في العربية حجة في نقلها، جمع من المصنفات كتاب المحكم في اللغة وهو كتاب كبير جامع مشتمل على أنواع اللغة وكتاب المخصص وكتاب الأنيق في شرح الحماسة في ست مجلدات؛ اشتغل أولاً على أبيه الضرير القيم بعلم اللغة ثم على أبي العلا صاعد البغدادي وقرأ على أبي عمر الطلمنكي؛ توفي بحضرة دانية عشية يوم الأحد سادس عشري جمادى الآخرة سنة ثمان وخمسين وأربعمائة وعمره نحو ستون سنة؛ وروي أنه كان يوم الجمعة قبله صحيحاً فدخل المتوضأ فأخرج منه وقد سقط لسانه وانقطع كلامه فبقي على تلك الحال إلى عصر الأحد ثم توفي {cite:shadharat-dhahab p. 313-314}."
  en: "Abu al-Hasan Ibn Sidah Ali b. Isma'il of Murcia — the blind son of a blind father and the era's foremost authority in Arabic; author of the comprehensive *al-Muhkam fi al-lugha*, *al-Mukhassas* and the six-volume *al-Aniq* commentary on the Hamasa; died at Hadra Daniya on Sunday eve, 16 Jumada II 458, aged about sixty — having lost his speech two days earlier in the ablution room {cite:shadharat-dhahab p. 313-314}."
gender: male
