summary:
  ar: "علاء الدين بن عثمان؛ أخو السلطان أورخان وصاحب فكرة تشكيل الجيش الجديد ⁦(الينيچري)⁩. يذكر الصلابي أنه كان عالماً في الشريعة والآداب الإسلامية، وأنه اقترح على أخيه إنشاء جيش نظامي من الأسرى والمسبيين يتلقون التربية الإسلامية ويُدرَّبون على الحرب، فمال أورخان إلى الفكرة ونفّذها {cite:dawlat-uthmaniyya-salabi p. 54-55}. وينسب الكتاب إلى نظام أورخان وأخيه علاء الدين ومهارتهما في تدبير الدولة الجديدة وإدارة القضاء جانباً من عوامل بعث الدولة العثمانية بعد كارثة أنقرة {cite:dawlat-uthmaniyya-salabi p. 72}."
  en: "Alaeddin son of Osman, brother and counsellor of Sultan Orhan — in al-Sallabi's account a scholar of the shari'a and Islamic letters who proposed the standing 'new army' (yeni çeri) raised from captives reared on Islamic training, an idea Orhan adopted {cite:dawlat-uthmaniyya-salabi p. 54-55}; the book credits the brothers' joint administration among the factors that let the state rise again after Ankara {cite:dawlat-uthmaniyya-salabi p. 72}."
  fr: "Alaeddin, fils d'Osman, frère et conseiller du sultan Orhan - selon al-Sallabi, un savant de la charia et des lettres islamiques qui a proposé la « nouvelle armée » debout (yeni çeri) élevée à partir de captifs élevés sur la formation islamique, une idée adoptée par Orhan {cite:dawlat-uthmaniyya-salabi p. 54-55}; le livre attribue l'administration conjointe des frères parmi les facteurs qui ont permis à l'État de remonter après Ankara {cite:dawlat-uthmaniyya-salabi p. 72}."
  es: "Alaeddin, hijo de Osman, hermano y consejero del sultán Orhan, según el relato de al-Sallabi, era un erudito de la sharia y las letras islámicas que propuso el 'nuevo ejército' permanente (yeni çeri) formado por cautivos criados en la instrucción islámica, una idea que Orhan adoptó {cite:dawlat-uthmaniyya-salabi p. 54-55}; el libro atribuye a la administración conjunta de los hermanos uno de los factores que permitieron que el estado resurgiera después de Ankara {cite:dawlat-uthmaniyya-salabi p. 72}."
  ur: "علاء الدین ولد عثمان، سلطان اورحان کے بھائی اور مشیر - السلبی کے کھاتے میں شریعت اور اسلامی خطوط کے ایک عالم تھے جنہوں نے اسلامی تربیت پر پالے ہوئے قیدیوں سے اٹھائے جانے والے کھڑے 'نئی فوج' ⁦(ینی کیری)⁩ کی تجویز پیش کی، اورحان نے اپنایا {حوالہ: دولت عثمانیہ صلابی صلابی۔ 54-55}; کتاب ان عوامل میں سے برادران کی مشترکہ انتظامیہ کو سراہتی ہے جنہوں نے انقرہ کے بعد ریاست کو دوبارہ سر اٹھانے دیا۔ 72}۔"
  tr: "Aladdin bin Osman; Sultan Orhan'ın kardeşi ve yeni ordu (Yingri) kurma fikrinin öncüsüdür. El-Sallabi, onun İslam hukuku ve ahlakı konusunda bir âlim olduğunu ve kardeşine, İslami eğitim alacak ve savaş için eğitilecek düzenli bir esirler ve esirler ordusu kurulmasını önerdiğini belirtir. Orhan bu fikre daha yakın durdu ve uyguladı {cite:dawlat-uthmaniyya-salabi s. 54-55}. Kitap, Ankara felaketinden sonra Osmanlı devletinin yeniden canlanmasına yol açan faktörlerin bir parçası olarak Nizam Orhan ve kardeşi Aladdin'e ve onların yeni devlet ve yargıyı yönetmedeki ustalığına atfeder {cite:dawlat-uthmaniyya-salabi s. 72}."
  id: "Aladdin ibn Osman; saudara Sultan Orhan dan pencetus gagasan pembentukan tentara baru (Yingri). Al-Sallabi menyebutkan bahwa ia adalah seorang ulama hukum dan etika Islam, dan bahwa ia mengusulkan kepada saudaranya pembentukan tentara reguler yang terdiri dari tawanan dan tawanan yang akan menerima pendidikan Islam dan dilatih untuk perang. Orhan condong pada gagasan tersebut dan melaksanakannya {cite:dawlat-uthmaniyya-salabi hlm. 54-55}. Buku ini mengaitkan kepada Nizam Orhan dan saudaranya Aladdin serta keterampilan mereka dalam mengelola negara dan peradilan baru sebagai salah satu faktor yang menyebabkan kebangkitan negara Ottoman setelah bencana Ankara {cite:dawlat-uthmaniyya-salabi hlm. 72}."
