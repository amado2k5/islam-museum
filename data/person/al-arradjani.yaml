summary:
  ar: "شاعر عربي من أرّجان، ولد سنة 460هـ (1067م) وتوفي سنة 544هـ (1149-1150م) بتستر أو عسكر مكرم؛ درس العلوم الدينية في النظامية بأصبهان وصار قاضيًا على تستر، ثم اتخذ الشعر مهنة، ومدح الخليفة العباسي المسترشد {cite:encyclopaedia-of-islam-2 vol. 1 p. 708}."
  en: "Arab poet from Arradjan, born in 460 AH (1067) and died in 544 AH (1149-1150) at Tustar or Askar Mukram; he studied religion at the Nizamiyya in Isfahan, was nominated judge of Tustar, but took poetry as his livelihood and wrote panegyric qasidas to the caliph al-Mustazhir {cite:encyclopaedia-of-islam-2 vol. 1 p. 708}."
