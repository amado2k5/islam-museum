id: person/al-arradjani
class: person
label:
  ar: "ناصح الدين أبو بكر أحمد الأرجاني"
  en: "Nasih al-Din Abu Bakr Ahmad al-Arradjani"
  fr: "Nasih al-Din Abu Bakr Ahmad al-Arradjani"
  es: "Nasih al-Din Abu Bakr Ahmad al-Arradjani"
  ur: "ناصح الدین ابو بکر احمد الاردجانی"
summary:
  ar: "شاعر عربي من أرّجان، ولد سنة 460هـ ⁦(1067م)⁩ وتوفي سنة 544هـ ⁦(1149-1150م)⁩ بتستر أو عسكر مكرم؛ درس العلوم الدينية في النظامية بأصبهان وصار قاضيًا على تستر، ثم اتخذ الشعر مهنة، ومدح الخليفة العباسي المسترشد {cite:encyclopaedia-of-islam-2 vol. 1 p. 708}."
  en: "Arab poet from Arradjan, born in 460 AH (1067) and died in 544 AH (1149-1150) at Tustar or Askar Mukram; he studied religion at the Nizamiyya in Isfahan, was nominated judge of Tustar, but took poetry as his livelihood and wrote panegyric qasidas to the caliph al-Mustazhir {cite:encyclopaedia-of-islam-2 vol. 1 p. 708}."
  fr: "Poète arabe d’Arradjan, né en 460 H (1067) et mort en 544 H (1149–1150) à Tustar ou à Askar Mukram ; il étudia la religion à la Nizamiyya d’Ispahan, fut nommé juge de Tustar, mais fit de la poésie son gagne-pain et écrivit des qasidas panégyriques au calife al-Mustazhir {cite:encyclopaedia-of-islam-2 vol. 1 p. 708}."
  es: "Poeta árabe de Arradjan, nacido en 460 AH (1067) y fallecido en 544 AH (1149-1150) en Tustar o Askar Mukram; estudió religión en la Nizamiyya de Isfahán, fue nombrado juez de Tustar, pero tomó la poesía como medio de vida y escribió qasidas panegíricas al califa al-Mustazhir {cite:encyclopaedia-of-islam-2 vol. 1 p. 708}."
  ur: "اردجان سے تعلق رکھنے والا عرب شاعر، 460 ہجری (1067) میں پیدا ہوا اور 544 ہجری (1149-1150) میں تستار یا عسکر مکرم میں فوت ہوا۔ اس نے اصفہان میں نظامیہ میں مذہب کی تعلیم حاصل کی، تسطار کا جج نامزد کیا گیا، لیکن شاعری کو اپنا ذریعہ معاش بنایا اور خلیفہ المستظیر کو قصیدے لکھے۔ 1ص 708}۔"
  tr: "Arrajanlı bir Arap şair, Hicri 460 yılında (Miladi 1067) doğmuş ve Hicri 544 yılında (Miladi 1149-1150) Tustar veya Askar Mukram'da ölmüştür; İsfahan'daki Nizamiyye'de din bilimleri okumuş ve Tustar'da kadı olmuştur, daha sonra şairliği meslek edinmiş ve Abbasi Halifesi El-Mustarşid'i övmüştür. {cite:encyclopaedia-of-islam-2 vol. 1 p. 708}"
  id: "Seorang penyair Arab dari Arrajan, lahir pada tahun 460 H (1067 M) dan meninggal pada tahun 544 H (1149-1150 M) di Tustar atau Askar Mukram; ia belajar ilmu agama di Nizamiyya di Isfahan dan menjadi hakim di Tustar, kemudian ia menekuni puisi sebagai profesi, dan memuji Khalifah Abbasiyah Al-Mustarshid {cite:encyclopaedia-of-islam-2 vol. 1 p. 708}."
