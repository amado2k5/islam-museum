id: person/said-ibn-hakam-menorca
class: person
label: { ar: "سعيد بن حكم القرشي أمير منورقة" }
summary:
  ar: "أبو عثمان سعيد بن حكم القرشي الجواد العادل العالم؛ لما استولى النصارى على ميورقة ثار بجزيرة منورقة القريبة منها وكان وليها من قبل الوالي أبي يحيى المقتول، وتصالح مع النصارى على ضريبة معلومة واشترط أن لا يدخل جزيرته أحد من النصارى وضبطها أحسن ضبط، وأصله من مدينة طبيرة من غرب الأندلس، وقد ألفت باسمه التآليف المشهورة بالمغرب ككتاب روح الشحر وروح الشعر وغيره، وأخذ العدو منورقة بعد مدة {cite:nafh-tib-maqqari p. 475-476}."
  en: "Abu Uthman Sa'id ibn Hakam al-Qurashi — 'the generous, the just, the learned'; after Majorca's fall he rose in neighbouring Menorca, made peace with the Christians on a fixed tribute on condition no Christian set foot on his island, and governed it admirably; a native of Tavira and author of the celebrated Rawh al-Shajr wa-Rawh al-Shi'r {cite:nafh-tib-maqqari p. 475-476}."
  es: "Abu Uthman Sa'id ibn Hakam al-Qurashi — 'el generoso, el justo, el sabio'; tras la caída de Mallorca, ascendió a la vecina Menorca, hizo las paces con los cristianos a cambio de un tributo fijo con la condición de que ningún cristiano pusiera un pie en su isla, y la gobernó admirablemente; natural de Tavira y autor del célebre Rawh al-Shajr wa-Rawh al-Shi'r {cite:nafh-tib-maqqari p. 475-476}."
  fr: "Abu Uthman Sa'id ibn Hakam al-Qurashi — « le généreux, le juste, le savant »; après la chute de Majorque, il s'éleva dans l'île voisine de Minorque, fit la paix avec les chrétiens sur un tribut fixe à condition qu'aucun chrétien ne mette les pieds sur son île, et la gouverna admirablement; originaire de Tavira et auteur du célèbre Rawh al-Shajr wa-Rawh al-Shi'r {cite:nafh-tib-maqqari p. 475-476}."
