summary:
  ar: "عالم إسلامي سوري، وُلد في دمشق في 7 مايو 1963. تتلمذ على والده إبراهيم اليعقوبي، إمام الجامع الأموي الكبير، وصار خطيب جمعة في الثامنة عشرة، ثم مفتي السويد سنة 1999. وهو شيخ في الطريقة الشاذلية وعالم في الحديث والفقه؛ غادر سوريا سنة 2011 بعد انتقاده رد الحكومة على الاحتجاجات، ويقيم في المغرب حيث يقود مبادرة «المعرفة المقدسة»؛ وكتابه «دحض داعش» منشور بعشر لغات، ويدير قناة يوتيوب باسمه منذ سنة 2019."
  en: "Syrian Islamic scholar, born in Damascus on 7 May 1963. Trained by his father Ibrahim al-Yaqoubi, an imam of the Grand Umayyad Mosque, he was a Friday speaker at eighteen and later mufti of Sweden (1999). A Shadhili Sufi master and a scholar of hadith and jurisprudence, he left Syria in 2011 after criticising the government's response to the protests and is based in Morocco, where he leads the Sacred Knowledge initiative; his book Refuting ISIS is published in ten languages, and he has run a YouTube channel under his own name since 2019."
  ur: "شامی عالمِ دین، 7 مئی 1963 کو دمشق میں پیدا ہوئے۔ انہوں نے اپنے والد ابراہیم الیعقوبی سے تعلیم حاصل کی، جو جامع اموی کبیر کے امام تھے؛ وہ اٹھارہ برس کی عمر میں خطیبِ جمعہ بنے اور بعد میں 1999 میں سویڈن کے مفتی رہے۔ وہ سلسلہ شاذلیہ کے صوفی شیخ اور حدیث و فقہ کے عالم ہیں؛ 2011 میں حکومت کے احتجاجات سے نمٹنے کے انداز پر تنقید کے بعد وہ شام سے چلے گئے اور اب مراکش میں مقیم ہیں، جہاں وہ «سیکرڈ نالج» اقدام کی قیادت کرتے ہیں؛ ان کی کتاب «داعش کی تردید» دس زبانوں میں شائع ہو چکی ہے، اور 2019 سے وہ اپنے نام سے یوٹیوب چینل چلا رہے ہیں۔"
  es: "Erudito islámico sirio, nacido en Damasco el 7 de mayo de 1963. Formado por su padre, Ibrahim al-Yaqoubi, imán de la Gran Mezquita Omeya, fue orador de los viernes a los dieciocho años y posteriormente muftí de Suecia (1999). Maestro sufí shadhili y erudito en hadices y jurisprudencia, abandonó Siria en 2011 tras criticar la respuesta del gobierno a las protestas y reside en Marruecos, donde dirige la iniciativa Conocimiento Sagrado. Su libro Refutando al ISIS se ha publicado en diez idiomas y desde 2019 tiene un canal de YouTube con su propio nombre."
  fr: "Érudit islamique syrien, né à Damas le 7 mai 1963. Formé par son père Ibrahim al-Yaqoubi, imam de la Grande Mosquée des Omeyyades, il devint prédicateur du vendredi à l'âge de dix-huit ans et fut plus tard nommé mufti de Suède (1999). Maître soufi shadhili et spécialiste du hadith et de la jurisprudence, il a quitté la Syrie en 2011 après avoir critiqué la réponse du gouvernement aux manifestations et vit désormais au Maroc, où il dirige l'initiative « Savoir sacré ». Son livre « Réfuter Daech » est publié en dix langues, et il anime une chaîne YouTube à son nom depuis 2019."
  tr: "Suriyeli bir İslam alimi, 7 Mayıs 1963'te Şam'da doğdu. Babası İbrahim el-Ya'qubi'nin öğrencisi, Büyük Emevi Camii'nin imamı oldu, on sekiz yaşında cuma namazı vaizi oldu ve ardından 1999'da İsveç Büyük Müftüsü oldu. Şadhili tarikatında bir şeyh ve hadis ile fıkıh âlimi; hükümetin protestolara verdiği yanıtı eleştirdikten sonra 2011'de Suriye'den ayrıldı. Fas'ta ikamet etmekte olup, 'Kutsal Bilgi' girişimini yürütmektedir; 'IŞİD'i Reddetmek' adlı kitabı on dilde yayımlanmış ve 2019'dan beri kendi adıyla bir YouTube kanalı işletmektedir."
  id: "Seorang ulama Islam Suriah, lahir di Damaskus pada 7 Mei 1963. Ia belajar di bawah bimbingan ayahnya, Ibrahim al-Ya'qubi, imam Masjid Umayyah Agung, menjadi pengkhotbah salat Jumat pada usia delapan belas tahun, dan kemudian menjadi Mufti Agung Swedia pada tahun 1999. Ia adalah seorang sheikh dalam ordo Shadhili dan ulama hadits serta yurisprudensi; ia meninggalkan Suriah pada tahun 2011 setelah mengkritik respons pemerintah terhadap protes tersebut. Ia tinggal di Maroko, di mana ia memimpin inisiatif 'Pengetahuan Suci'; bukunya 'Refuting ISIS' diterbitkan dalam sepuluh bahasa, dan ia telah menjalankan saluran YouTube atas namanya sendiri sejak 2019."
