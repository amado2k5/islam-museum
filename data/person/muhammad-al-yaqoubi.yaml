summary:
  ar: "عالم إسلامي سوري، وُلد في دمشق في 7 مايو 1963. تتلمذ على والده إبراهيم اليعقوبي، إمام الجامع الأموي الكبير، وصار خطيب جمعة في الثامنة عشرة، ثم مفتي السويد سنة 1999. وهو شيخ في الطريقة الشاذلية وعالم في الحديث والفقه؛ غادر سوريا سنة 2011 بعد انتقاده رد الحكومة على الاحتجاجات، ويقيم في المغرب حيث يقود مبادرة «المعرفة المقدسة»؛ وكتابه «دحض داعش» منشور بعشر لغات، ويدير قناة يوتيوب باسمه منذ سنة 2019."
  en: "Syrian Islamic scholar, born in Damascus on 7 May 1963. Trained by his father Ibrahim al-Yaqoubi, an imam of the Grand Umayyad Mosque, he was a Friday speaker at eighteen and later mufti of Sweden (1999). A Shadhili Sufi master and a scholar of hadith and jurisprudence, he left Syria in 2011 after criticising the government's response to the protests and is based in Morocco, where he leads the Sacred Knowledge initiative; his book Refuting ISIS is published in ten languages, and he has run a YouTube channel under his own name since 2019."
  ur: "شامی عالمِ دین، 7 مئی 1963 کو دمشق میں پیدا ہوئے۔ انہوں نے اپنے والد ابراہیم الیعقوبی سے تعلیم حاصل کی، جو جامع اموی کبیر کے امام تھے؛ وہ اٹھارہ برس کی عمر میں خطیبِ جمعہ بنے اور بعد میں 1999 میں سویڈن کے مفتی رہے۔ وہ سلسلہ شاذلیہ کے صوفی شیخ اور حدیث و فقہ کے عالم ہیں؛ 2011 میں حکومت کے احتجاجات سے نمٹنے کے انداز پر تنقید کے بعد وہ شام سے چلے گئے اور اب مراکش میں مقیم ہیں، جہاں وہ «سیکرڈ نالج» اقدام کی قیادت کرتے ہیں؛ ان کی کتاب «داعش کی تردید» دس زبانوں میں شائع ہو چکی ہے، اور 2019 سے وہ اپنے نام سے یوٹیوب چینل چلا رہے ہیں۔"
