id: person/ahmad-ibn-sad-al-zuhri
class: person
label: { ar: "أحمد بن سعد الزهري", en: "Ahmad ibn Sa'd al-Zuhri", es: "Ahmad ibn Sa'd al-Zuhri", fr: "Ahmad ibn Sa'd al-Zuhri", ur: "احمد بن سعد الزہری" }
summary:
  ar: "أحمد بن سعد بن إبراهيم بن عبد الرحمن بن عوف الزهري أبو إبراهيم، سمع علي بن الجعد وعلي بن يحيى وغيرهما، وروى عنه البغوي وابن صاعد والمحاملي وابن المنادي وغيرهم، وكان مذكورًا بالعلم والفضل موصوفًا بالصلاح والزهد، وكان أهل بيته كلهم علماء محدثون. وروى ابن أخيه أن عمه أبا إبراهيم مضى إلى أحمد بن حنبل يسلم عليه فلما رآه قام إليه قائمًا وأكرمه، فلما مضى قال له ابنه عبد الله: يا أبتِ، أبو إبراهيم شابٌّ وتعمل به هذا العمل وتقوم إليه؟ فقال: يا بني لا تعارضني في مثل هذا، ألا أقوم إلى ابن عبد الرحمن بن عوف؟ توفي سنة ثلاث وسبعين ومائتين {cite:muntazam-ibn-al-jawzi p. 88-89}."
  en: "Ahmad ibn Sa'd al-Zuhri Abu Ibrahim — the Qurashi hadith scholar of a house of scholars, praised for learning and asceticism; the man for whom Ahmad ibn Hanbal rose to his feet, telling his protesting son 'shall I not rise for the grandson of Abd al-Rahman ibn Awf?' {cite:muntazam-ibn-al-jawzi p. 88-89}."
  es: "Ahmad ibn Sa'd al-Zuhri Abu Ibrahim — el erudito de hadices Qurashi de una casa de eruditos, elogiado por su erudición y ascetismo; el hombre por quien Ahmad ibn Hanbal se puso de pie, diciéndole a su hijo que protestaba: \"¿No me levantaré por el nieto de Abd al-Rahman ibn Awf?\" {cita:muntazam-ibn-al-jawzi págs. 88-89}."
  fr: "Ahmad ibn Sa'd al-Zuhri Abu Ibrahim — le savant du hadith qurashi d'une maison de savants, loué pour son érudition et son ascétisme; l'homme pour lequel Ahmad ibn Hanbal se leva, disant à son fils protestataire: « Ne me lèverai-je pas pour le petit-fils d'Abd al-Rahman ibn Awf ? » {cite: muntazam-ibn-al-jawzi p. 88-89}."
  ur: "احمد بن سعد الزہری ابو ابراہیم - علماء کے ایک گھر کے قریشی حدیث اسکالر، سیکھنے اور سنیاسی کی تعریف کی؛ وہ شخص جس کے لیے احمد بن حنبل اپنے قدموں پر کھڑے ہوئے اور اپنے احتجاجی بیٹے سے کہا کیا میں عبدالرحمٰن بن عوف کے پوتے کے لیے نہ اٹھوں؟ {حوالہ:منتظم ابن الجوزی ص۔ 88-89}۔"
  tr: "Ahmed ibn Sa'd ibn İbrahim ibn Abdülrahman ibn Avf el-Zuhri, Ebu İbrahim, Ali ibn el-Câd, Ali ibn Yahya ve diğerlerinden hadisler işitti. Bağavi, İbn Sa'id, el-Mahamili, İbn el-Munadi ve diğerleri ondan rivayet etmişlerdir. Bilgisi ve fazileti ile tanınan Ebu İbrahim, dindar ve zümreden biri olarak tanımlanmıştır. Ailesinin tüm üyeleri âlim ve hadis râvisiydi. Yeğeni, amcası Ebu İbrahim'in Ahmed ibn Hanbel'i selamlamaya gittiğini rivayet etmiştir. Ahmed onu görünce ayağa kalkmış ve ona büyük saygı göstermiştir. Ayrıldıktan sonra oğlu Abdullah ona, \"Baba, Ebu İbrahim genç bir adam ve sen ona böyle davranıp onu savunuyorsun?\" demiştir. Ebu İbrahim, \"Oğlum, böyle bir konuda bana karşı çıkma. İbn Abdülrahman ibn Avf'ı savunmamalı mıyım?\" diye cevap vermiştir. 273 Hicri yılında vefat etmiştir."
  id: "Ahmad ibn Sa'd ibn Ibrahim ibn Abd al-Rahman ibn Awf al-Zuhri, Abu Ibrahim, mendengar hadits dari Ali ibn al-Ja'd, Ali ibn Yahya, dan lainnya. Al-Baghawi, Ibn Sa'id, al-Mahamili, Ibn al-Munadi, dan lainnya meriwayatkan hadits darinya. Ia terkenal karena ilmunya dan kebajikannya, dan digambarkan sebagai orang yang saleh dan asketis. Semua anggota keluarganya adalah ulama dan perawi hadits. Keponakannya meriwayatkan bahwa pamannya, Abu Ibrahim, pergi menemui Ahmad ibn Hanbal untuk menyapanya. Ketika Ahmad melihatnya, ia berdiri dan menunjukkan rasa hormat yang besar kepadanya. Setelah ia pergi, putranya Abdullah berkata kepadanya, \"Ayah, Abu Ibrahim masih muda, dan Ayah memperlakukannya seperti ini dan membelanya?\" Ia menjawab, \"Anakku, jangan membantahku dalam hal seperti itu. Bukankah seharusnya aku membela Ibn Abd al-Rahman ibn Awf?\" Ia wafat pada tahun 273 H."
