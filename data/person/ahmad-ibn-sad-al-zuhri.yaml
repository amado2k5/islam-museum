label: { ar: "أحمد بن سعد الزهري", en: "Ahmad ibn Sa'd al-Zuhri" }
summary:
  ar: "أحمد بن سعد بن إبراهيم بن عبد الرحمن بن عوف الزهري أبو إبراهيم، سمع علي بن الجعد وعلي بن يحيى وغيرهما، وروى عنه البغوي وابن صاعد والمحاملي وابن المنادي وغيرهم، وكان مذكورًا بالعلم والفضل موصوفًا بالصلاح والزهد، وكان أهل بيته كلهم علماء محدثون. وروى ابن أخيه أن عمه أبا إبراهيم مضى إلى أحمد بن حنبل يسلم عليه فلما رآه قام إليه قائمًا وأكرمه، فلما مضى قال له ابنه عبد الله: يا أبتِ، أبو إبراهيم شابٌّ وتعمل به هذا العمل وتقوم إليه؟ فقال: يا بني لا تعارضني في مثل هذا، ألا أقوم إلى ابن عبد الرحمن بن عوف؟ توفي سنة ثلاث وسبعين ومائتين {cite:muntazam-ibn-al-jawzi p. 88-89}."
  en: "Ahmad ibn Sa'd al-Zuhri Abu Ibrahim — the Qurashi hadith scholar of a house of scholars, praised for learning and asceticism; the man for whom Ahmad ibn Hanbal rose to his feet, telling his protesting son 'shall I not rise for the grandson of Abd al-Rahman ibn Awf?' {cite:muntazam-ibn-al-jawzi p. 88-89}."
