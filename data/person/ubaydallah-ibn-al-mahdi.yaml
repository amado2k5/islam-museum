summary:
  ar: "عبيد الله بن المهدي العباسي؛ أقطعه الرشيد مزارعة أرض الأهواز فدخل فيها شبهة فرفع في ذلك قوم إلى المأمون فأمر بالنظر فيها والوقوف عليها فما لم تكن فيه شبهة أنفذ وما شك فيه سمي المشكوك فيه وذلك معروف بالأهواز."
  en: "Ubaydallah ibn al-Mahdi al-Abbasi; al-Rashid's grantee of the Ahwaz musarra'a lands — a doubt arose, men raised it to al-Ma'mun, who ordered them reviewed: what held no doubt was executed, what was doubtful was named 'the doubted' — a practice still known in al-Ahwaz."
