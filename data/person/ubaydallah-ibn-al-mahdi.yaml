label: { ar: "عبيد الله بن المهدي", en: "Ubaydallah ibn al-Mahdi", es: "Ubaydallah ibn al-Mahdi", fr: "Ubaydallah ibn al-Mahdi", ur: "عبیداللہ ابن المہدی" }
summary:
  ar: "عبيد الله بن المهدي العباسي؛ أقطعه الرشيد مزارعة أرض الأهواز فدخل فيها شبهة فرفع في ذلك قوم إلى المأمون فأمر بالنظر فيها والوقوف عليها فما لم تكن فيه شبهة أنفذ وما شك فيه سمي المشكوك فيه وذلك معروف بالأهواز."
  en: "Ubaydallah ibn al-Mahdi al-Abbasi; al-Rashid's grantee of the Ahwaz musarra'a lands — a doubt arose, men raised it to al-Ma'mun, who ordered them reviewed: what held no doubt was executed, what was doubtful was named 'the doubted' — a practice still known in al-Ahwaz."
  es: "Ubaydallah ibn al-Mahdi al-Abbasi, beneficiario de al-Rashid de las tierras de musarra'a de Ahwaz, surgió una duda, los hombres la plantearon a al-Ma'mun, quien ordenó que se revisaran: lo que no generaba dudas se ejecutaba, lo que era dudoso se denominaba 'lo dudoso', una práctica que aún se conoce en al-Ahwaz."
  fr: "Ubaydallah ibn al-Mahdi al-Abbasi; bénéficiaire des terres musarra'a d'Ahwaz d'al-Rashid — un doute surgit, des hommes le soulevèrent auprès d'al-Ma'mun, qui ordonna de les examiner: ce qui ne faisait aucun doute fut exécuté, ce qui était douteux fut nommé « le douté » — une pratique encore connue à al-Ahwaz."
  ur: "عبیداللہ ابن المہدی العباسی؛ الرشید کو اہواز مضارعہ کی زمینوں کا گرانٹی - ایک شبہ پیدا ہوا، لوگوں نے اسے المامون کے پاس اٹھایا، جس نے انہیں حکم دیا کہ وہ جائزہ لیں: جس چیز میں کوئی شک نہیں اسے سزائے موت دی گئی، جس چیز کو شک تھا اسے 'مشکوک' کا نام دیا گیا۔"
