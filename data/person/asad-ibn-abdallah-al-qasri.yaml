id: person/asad-ibn-abdallah-al-qasri
class: person
label: { ar: "أسد بن عبد الله القسري", en: "Asad ibn Abdallah al-Qasri", es: "Asad ibn Abdallah al-Qasri", fr: "Asad ibn Abdallah al-Qasri", ur: "اسد بن عبداللہ القصری" }
summary:
  ar: "أخو خالد بن عبد الله القسري؛ عند البلاذري اتخذ القرية التي تعرف بسوق أسد وسوقها ونقل الناس إليها وكان معسكره حين شخص إلى خراسان والياً عليها عند سوقه هذا. ويذكر الكتاب أن خالد بن عبد الله القسري عيّن أخاه أسد بن عبد الله على خراسان سنة 106هـ، ثم تدخل هشام فعيّن أشرس بن عبد الله السلمي، واستمر أسد والياً على خراسان إلى أن توفي في ربيع الأول سنة 120هـ. {cite:salabi-umayyad-state-2020 p.483}"
  en: "Brother of Khalid ibn Abdallah al-Qasri; in al-Baladhuri he founded the village called Suq Asad with its market and moved people into it — his camp, when he marched to Khurasan as governor, was by that market."
  es: "Hermano de Khalid ibn Abdallah al-Qasri; en al-Baladhuri fundó la aldea llamada Suq Asad con su mercado y asentó gente en ella; su campamento, cuando marchó a Jorasán como gobernador, estaba junto a ese mercado."
  fr: "Frère de Khalid ibn Abdallah al-Qasri; à al-Baladhuri, il fonda le village appelé Suq Asad avec son marché et y installa des gens — son camp, lorsqu'il marcha vers le Khorasan en tant que gouverneur, se trouvait près de ce marché."
  ur: "خالد بن عبداللہ القصری کے بھائی؛ البلادھوری میں اس نے سق اسد نامی گاؤں کی بنیاد رکھی جس کا بازار تھا اور لوگوں کو اس میں منتقل کیا - اس کا کیمپ، جب اس نے خراسان کے گورنر کے طور پر مارچ کیا، اس بازار کے پاس تھا۔"
  tr: "Halid bin Abdullah el-Kasri'nin kardeşi; el-Baladhuri'ye göre, Asad Pazarı olarak bilinen köyü ve pazarını ele geçirip insanları oraya taşıdı. Kampı, bu pazarda Horasan valisi olarak atandığı zamandı. Kitap, Halid bin Abdullah el-Kasri'nin 106 Hicri yılında kardeşi Esad bin Abdullah'ı Horasan'ın başına atadığını belirtir. Bunun üzerine Hişam müdahale etti ve Aşra ibn Abdullah el-Sulami'yi atadı. Asad, 120 Hicri yılında Rebi'l-Avval'de ölene kadar Horasan'ın valisi olarak kaldı. {kaynak:Selabi-Umayyad-devlet-2020 s.483}"
  id: "Saudara Khalid ibn Abdullah al-Qasri; menurut al-Baladhuri, ia mengambil desa yang dikenal sebagai Pasar Asad, pasarnya, dan mengangkut orang-orang ke sana. Kampnya adalah ketika ia diangkat sebagai gubernur Khorasan di pasar tersebut. Buku tersebut menyebutkan bahwa Khalid ibn Abdullah mengangkat saudaranya Asad ibn Abdullah sebagai Raja Khurasan pada tahun 106 H. Kemudian Hisham turun tangan dan menunjuk Ashras ibn Abdullah al-Sulami. Asad tetap menjadi gubernur Khorasan hingga ia wafat di Rabi' al-Awwal tahun 120 H. {cite:salabi-umayyad-state-2020 hlm.483}"
