label: { ar: "أسد بن عبد الله القسري", en: "Asad ibn Abdallah al-Qasri" }
summary:
  ar: "أخو خالد بن عبد الله القسري؛ عند البلاذري اتخذ القرية التي تعرف بسوق أسد وسوقها ونقل الناس إليها وكان معسكره حين شخص إلى خراسان والياً عليها عند سوقه هذا. ويذكر الكتاب أن خالد بن عبد الله القسري عيّن أخاه أسد بن عبد الله على خراسان سنة 106هـ، ثم تدخل هشام فعيّن أشرس بن عبد الله السلمي، واستمر أسد والياً على خراسان إلى أن توفي في ربيع الأول سنة 120هـ. {cite:salabi-umayyad-state-2020 p.483}"
  en: "Brother of Khalid ibn Abdallah al-Qasri; in al-Baladhuri he founded the village called Suq Asad with its market and moved people into it — his camp, when he marched to Khurasan as governor, was by that market."
