label: { ar: "يوسف بن محمد بن يوسف المروزي", en: "Yusuf ibn Muhammad ibn Yusuf al-Marwazi" }
summary:
  ar: "يوسف بن محمد بن يوسف المروزي؛ ولّاه المتوكل أرمينية لسنتين من خلافته فأخذ بخلاط بطريقها بقراط بن أشوط فحمله إلى سر من رأى، وانتهك عامله الملاء بن أحمد دير الأقداح بالسيسجان فتكاتبت البطارقة ودسّوا إلى الخويثية — الأزطان — فوثبوا به بطرون وقد فرّق أصحابه في القرى فقتلوه واحتووا على ما كان في عسكره."
  en: "Yusuf ibn Muhammad ibn Yusuf al-Marwazi; al-Mutawakkil gave him Armenia for two years of his caliphate — he seized Buqrat ibn Ashut, patrikios of Khilat, and carried him to Samarra, and his agent al-Mala' ibn Ahmad violated Dayr al-Aqdah in Sisajan, whereupon the patrikioses conspired and sent to the Khwaythiyya (the Aztan), who ambushed him at Batrun while his men were dispersed among the villages, killed him and seized all in his camp."
