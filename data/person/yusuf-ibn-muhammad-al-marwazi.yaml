id: person/yusuf-ibn-muhammad-al-marwazi
class: person
label: { ar: "يوسف بن محمد بن يوسف المروزي", en: "Yusuf ibn Muhammad ibn Yusuf al-Marwazi", es: "Yusuf ibn Muhammad ibn Yusuf al-Marwazi", fr: "Yusuf ibn Muhammad ibn Yusuf al-Marwazi", ur: "یوسف بن محمد بن یوسف المروازی" }
summary:
  ar: "يوسف بن محمد بن يوسف المروزي؛ ولّاه المتوكل أرمينية لسنتين من خلافته فأخذ بخلاط بطريقها بقراط بن أشوط فحمله إلى سر من رأى، وانتهك عامله الملاء بن أحمد دير الأقداح بالسيسجان فتكاتبت البطارقة ودسّوا إلى الخويثية — الأزطان — فوثبوا به بطرون وقد فرّق أصحابه في القرى فقتلوه واحتووا على ما كان في عسكره."
  en: "Yusuf ibn Muhammad ibn Yusuf al-Marwazi; al-Mutawakkil gave him Armenia for two years of his caliphate — he seized Buqrat ibn Ashut, patrikios of Khilat, and carried him to Samarra, and his agent al-Mala' ibn Ahmad violated Dayr al-Aqdah in Sisajan, whereupon the patrikioses conspired and sent to the Khwaythiyya (the Aztan), who ambushed him at Batrun while his men were dispersed among the villages, killed him and seized all in his camp."
  es: "Yusuf ibn Muhammad ibn Yusuf al-Marwazi; al-Mutawakkil le dio Armenia por dos años de su califato; él capturó a Buqrat ibn Ashut, patricio de Khilat, y lo llevó a Samarra, y su agente al-Mala' ibn Ahmad violó Dayr al-Aqdah en Sisajan, tras lo cual los patricios conspiraron y enviaron a Khwaythiyya (el Aztan), quienes le tendieron una emboscada en Batrun mientras sus hombres estaban dispersos entre las aldeas, lo mataron y capturaron a todos en su campamento."
  fr: "Yusuf ibn Muhammad ibn Yusuf al-Marwazi; al-Mutawakkil lui donna l'Arménie pour deux ans de son califat — il s'empara de Buqrat ibn Ashut, patrikios du Califat, et l'emmena à Samarra, et son agent al-Mala' ibn Ahmad viola Dayr al-Aqdah à Sisajan, sur quoi les patrikios conspirèrent et envoyèrent des messagers aux Khwaythiyya (les Aztan), qui lui tendirent une embuscade à Batrun alors que ses hommes étaient dispersés dans les villages, le tuèrent et s'emparèrent de tous ceux qui se trouvaient dans son camp."
  ur: "یوسف بن محمد بن یوسف المروازی؛ المتوکل نے اسے اپنی خلافت کے دو سال کے لیے آرمینیا دیا - اس نے بقراط ابن اشوت، خلعت کے سرپرستوں کو پکڑ لیا اور اسے سامرا لے گئے، اور اس کے ایجنٹ الملا ابن احمد نے سیسجان میں دیرالعقد کی خلاف ورزی کی، جس پر محب وطن لوگوں نے سازش کی اور اسے بطحطان ⁦(بعثت)⁩ کے پاس بھیج دیا۔ اس کے آدمی دیہاتوں میں منتشر ہو گئے، اسے قتل کر دیا اور اس کے کیمپ میں موجود سب کو پکڑ لیا۔"
  tr: "Yusuf ibn Muhammed ibn Yusuf el-Mervazi; el-Mutevakkil onu halifeliğinin iki yılı için Ermeni olarak atadı. Hipokrat ibn Ashut'a giderken bir karıştırıcı yaptı ve Hipokrat onu gördüğü kişilerin sırrına götürdü. Ajanı el-Mulla bin Ahmed, Sican'daki el-Aqdah manastırını ihlal etti, bu yüzden patrikler komplo kurup Khuwaithiyya — el-Aztan'a gizlice girdi ve Batroun'da ona saldırdı. Yoldaşları köylere dağıldı, onu öldürdü ve ordusundaki şeyleri ele geçirdiler."
  id: "Yusuf ibn Muhammad ibn Yusuf al-Marwazi; al-Mutawakkil mengangkatnya sebagai orang Armenia selama dua tahun masa khalifahnya. Ia membawa sebuah kapal campuran dalam perjalanan ke Hippocrates ibn Ashut, yang membawanya ke rahasia orang-orang yang dilihatnya. Agennya, al-Mulla ibn Ahmad, melanggar biara al-Aqdah di Sisjan, sehingga para patriark bersekongkol dan menyelinap ke Khuwaithiyya — al-Aztan — lalu melompat ke arahnya di Batroun. Rekan-rekannya tersebar di desa-desa, membunuhnya, dan mengambil alih apa yang ada di pasukannya."
