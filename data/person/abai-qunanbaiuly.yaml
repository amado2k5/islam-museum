summary:
  ar: "شاعر وملحن وفيلسوف ومترجم كازاخي (10 أغسطس 1845 – 6 يوليو 1904)، مؤسس الأدب الكازاخي المكتوب؛ حمل «كتاب الكلمات» وترجماته لبوشكين وليرمونتوف وغوته وبايرون وكريلوف الآداب الروسية والأوروبية إلى الكازاخية."
  en: "Kazakh poet, composer, philosopher and translator (10 August 1845 – 6 July 1904), the founder of written Kazakh literature; his Book of Words and his translations of Pushkin, Lermontov, Goethe, Byron and Krylov carried Russian and European letters into Kazakh."
  ur: "قازق شاعر، نغمہ ساز، فلسفی اور مترجم (10 اگست 1845ء – 6 جولائی 1904ء)، تحریری قازق ادب کے بانی؛ ان کی «کتابِ کلمات» اور پشکن، لیرمونتوف، گوئٹے، بائرن اور کریلوف کے ترجموں نے روسی و یورپی ادب کو قازق زبان تک پہنچایا۔"
