summary:
  ar: "شهاب الدين أحمد بن أبي بكر الأسدي العبشي الشهير جده بالطواشي؛ ولد بعد الستين وسبعمائة وأحضر في الثالثة على ابن جماعة وأسمع على العنباء الهندي وغيره وأجاز له الكمال بن حبيب ومحمد بن جابر وأبو جعفر الرعيني وأبو الفضل النويري والزرندي والأميوطي وغيرهم، وكان خيراً ديناً منقطعاً عن الناس، توفي بمكة يوم الجمعة سابع عشر شعبان {cite:shadharat-dhahab p. 192}."
  en: "Shihab al-Din al-Tawashi al-Ash'ashi — brought to Ibn Jama'a at age three, ijaza-holder from Ibn Habib, al-Ra'ini, al-Nuwayri, al-Zarandi and al-Umyuti; 'good, devout, cut off from people'; died at Mecca, Friday 17 Sha'ban 828 {cite:shadharat-dhahab p. 192}."
  fr: "Shihab al-Din al-Tawashi al-Ash'ashi – apporté à Ibn Jama'a à l'âge de trois ans, détenteur d'ijaza d'Ibn Habib, al-Ra'ini, al-Nuwayri, al-Zarandi et al-Umyuti ; « bon, dévot, coupé des gens » ; décédé à La Mecque, vendredi 17 chaabane 828 {cite:shadharat-dhahab p. 192}."
  es: "Shihab al-Din al-Tawashi al-Ash'ashi — traído a Ibn Jama'a a los tres años, poseedor de ijaza de Ibn Habib, al-Ra'ini, al-Nuwayri, al-Zarandi y al-Umyuti; 'bueno, devoto, apartado de la gente'; murió en La Meca el viernes 17 de Sha'ban 828 {cita: shadharat-dhahab p. 192}."
  ur: "شہاب الدین التواشی العاشی - تین سال کی عمر میں ابن جماعہ کے پاس لایا گیا، ابن حبیب، الرعینی، النویری، الزرندی اور العمیوتی سے اعجاز ہولڈر؛ 'اچھا، متقی، لوگوں سے کٹا ہوا'؛ 17 شعبان 828 بروز جمعہ مکہ میں وفات پائی۔ 192}۔"
  tr: "Şihabeddin Ahmed ibn Abi Bekir el-Esadi el-Abşi, namıdiğer el-Tavaşı, 760 Hicri'den sonra doğdu ve İbn Cemaah döneminde 1760 hicri yaşına getirildi; el-Enba' el-Hindi ve diğerlerinden dinledi. El-Kemal bin Habib, Muhammed ibn Cabir, Ebu Cafar el-Ru'ini, Ebu el-Fadl el-Nuveyri, el-Zarandi, el-Amayuti ve diğerlerinden izin aldı. Dindar ve dindar bir insandı ve insanlardan kopuktu. Şa'ban'ın on yedinci günü Mekke'de vefat etti {atıf: shadharat-dhahab, s. 192}."
  id: "Shihab al-Din Ahmad ibn Abi Bakr al-Asadi al-Abshi, yang dikenal sebagai al-Tawashi, lahir setelah tahun 760 H dan dibawa ke usia 1760 H di bawah Ibn Jama'ah, dan ia mendengar dari al-Anba' al-Hindi dan lainnya. Ia mendapat izin dari al-Kamal ibn Habib, Muhammad ibn Jabir, Abu Ja'far al-Ru'ini, Abu al-Fadl al-Nuwayri, al-Zarandi, al-Amayuti, dan lainnya. Ia adalah orang yang taat dan taat serta terpisah dari rakyat. Ia meninggal di Mekah pada hari Jumat, tanggal tujuh belas Sha'ban {cite:shadharat-dhahab, hlm. 192}."
