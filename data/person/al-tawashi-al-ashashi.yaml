summary:
  ar: "شهاب الدين أحمد بن أبي بكر الأسدي العبشي الشهير جده بالطواشي؛ ولد بعد الستين وسبعمائة وأحضر في الثالثة على ابن جماعة وأسمع على العنباء الهندي وغيره وأجاز له الكمال بن حبيب ومحمد بن جابر وأبو جعفر الرعيني وأبو الفضل النويري والزرندي والأميوطي وغيرهم، وكان خيراً ديناً منقطعاً عن الناس، توفي بمكة يوم الجمعة سابع عشر شعبان {cite:shadharat-dhahab p. 192}."
  en: "Shihab al-Din al-Tawashi al-Ash'ashi — brought to Ibn Jama'a at age three, ijaza-holder from Ibn Habib, al-Ra'ini, al-Nuwayri, al-Zarandi and al-Umyuti; 'good, devout, cut off from people'; died at Mecca, Friday 17 Sha'ban 828 {cite:shadharat-dhahab p. 192}."
