summary:
  ar: "حجة الإسلام الإمام الشافعي، صاحب إحياء علوم الدين الذي قال فيه النووي لو ذهبت كتب الإسلام وبقي الإحياء لأغنى عما ذهب؛ توفي بطوس سنة خمس وخمس مئة {cite:kashf-zunun-furqan p. 221}. ولد بطوس سنة خمسين وأربع مئة وكان والده يغزل الصوف ويبيعه في حانوته فلما احتضر أوصى به وبأخيه أحمد إلى صديق له صوفي صالح فقام بما ترك وأدبهما ثم نفد ما خلفه فقال لهما أن تلجأا إلى المدرسة فقال الغزالي أصرنا إلى المدرسة نطلب الفقه لتحصيل القوت، ثم تحول إلى نيسابور فلازم إمام الحرمين حتى صار أنظر أهل زمانه ونُدب للتدريس بنظامية بغداد سنة أربع وثمانين فقدمها في تجمل كبير حتى غلبت حشمته على حشمة الأمراء والوزراء ثم شرفت نفسه عن رذائل الدنيا فرفضها وأقبل على العبادة والسياحة فخرج إلى الحجاز سنة ثمان وثمانين واستوطن دمشق عشر سنين بمنارة الجامع وصنف فيها كتباً يقال إن الإحياء منها ثم القدس والإسكندرية وعاد إلى وطنه بطوس ثم أجاب الوزير فخر الدين بن نظام الملك إلى نظامية نيسابور، توفي في رابع عشر جمادى الآخرة سنة خمس وخمس مئة بالطابران قصبة بلاد طوس {cite:shadharat-dhahab p. 491-492}."
  en: "Hujjat al-Islam al-Ghazali the Shafi'i, author of the Ihya' — of which al-Nawawi said that were all Islam's books lost and the Ihya' alone remained it would suffice; he died at Tus in 505 {cite:kashf-zunun-furqan p. 221}."
