summary:
  ar: "حجة الإسلام الإمام الشافعي، صاحب إحياء علوم الدين الذي قال فيه النووي لو ذهبت كتب الإسلام وبقي الإحياء لأغنى عما ذهب؛ توفي بطوس سنة خمس وخمس مئة {cite:kashf-zunun-furqan p. 221}. ولد بطوس سنة خمسين وأربع مئة وكان والده يغزل الصوف ويبيعه في حانوته فلما احتضر أوصى به وبأخيه أحمد إلى صديق له صوفي صالح فقام بما ترك وأدبهما ثم نفد ما خلفه فقال لهما أن تلجأا إلى المدرسة فقال الغزالي أصرنا إلى المدرسة نطلب الفقه لتحصيل القوت، ثم تحول إلى نيسابور فلازم إمام الحرمين حتى صار أنظر أهل زمانه ونُدب للتدريس بنظامية بغداد سنة أربع وثمانين فقدمها في تجمل كبير حتى غلبت حشمته على حشمة الأمراء والوزراء ثم شرفت نفسه عن رذائل الدنيا فرفضها وأقبل على العبادة والسياحة فخرج إلى الحجاز سنة ثمان وثمانين واستوطن دمشق عشر سنين بمنارة الجامع وصنف فيها كتباً يقال إن الإحياء منها ثم القدس والإسكندرية وعاد إلى وطنه بطوس ثم أجاب الوزير فخر الدين بن نظام الملك إلى نظامية نيسابور، توفي في رابع عشر جمادى الآخرة سنة خمس وخمس مئة بالطابران قصبة بلاد طوس {cite:shadharat-dhahab p. 491-492}. وتصفه دائرة المعارف الإسلامية بأنه لاهوتي وفقيه ومفكر ومتصوف ومصلح ديني بارز، وتقدّر بقاءه في الشام بنحو سنتين لا عشر، وتعدّ الإحياء أعظم كتبه، وتجعل خانقاهه في طوس مكان تدريب مريديه في آخر حياته."
  en: "Hujjat al-Islam al-Ghazali the Shafi'i, author of the Ihya' — of which al-Nawawi said that were all Islam's books lost and the Ihya' alone remained it would suffice; he died at Tus in 505 {cite:kashf-zunun-furqan p. 221}. The Encyclopaedia of Islam, second edition, calls him an outstanding theologian, jurist, original thinker, mystic and religious reformer; he left his Baghdad chair in 488 AH/1095 CE, spent about two years in Syria and the Hijaz by its estimate, wrote the Ihya' in those years of retirement, returned briefly to teaching at Nishapur in 499 AH/1106 CE, and withdrew again to his khanqah at Tus before his death in Jumada II 505 AH."
  ur: "ابو حامد محمد بن محمد الغزالی طوسی، 450ھ/1058ء سے 505ھ/1111ء، جنھیں انسائیکلوپیڈیا آف اسلام ممتاز متکلم، فقیہ، مفکر، صوفی اور دینی مصلح کہتا ہے۔ انھوں نے 484ھ/1091ء میں بغداد کی نظامیہ میں تدریس شروع کی اور 488ھ/1095ء میں اسے چھوڑ کر تقریباً دو سال شام اور حجاز میں گزارے، اس گوشہ نشینی میں احیاء علوم الدین لکھی، 499ھ/1106ء میں نیشاپور میں مختصر مدت کے لیے تدریس کی طرف لوٹے، اور طوس کی خانقاہ میں انتقال سے پہلے دوبارہ گوشہ نشین ہو گئے۔"
