summary:
  ar: "حجة الإسلام الإمام الشافعي، صاحب إحياء علوم الدين الذي قال فيه النووي لو ذهبت كتب الإسلام وبقي الإحياء لأغنى عما ذهب؛ توفي بطوس سنة خمس وخمس مئة {cite:kashf-zunun-furqan p. 221}. ولد بطوس سنة خمسين وأربع مئة وكان والده يغزل الصوف ويبيعه في حانوته فلما احتضر أوصى به وبأخيه أحمد إلى صديق له صوفي صالح فقام بما ترك وأدبهما ثم نفد ما خلفه فقال لهما أن تلجأا إلى المدرسة فقال الغزالي أصرنا إلى المدرسة نطلب الفقه لتحصيل القوت، ثم تحول إلى نيسابور فلازم إمام الحرمين حتى صار أنظر أهل زمانه ونُدب للتدريس بنظامية بغداد سنة أربع وثمانين فقدمها في تجمل كبير حتى غلبت حشمته على حشمة الأمراء والوزراء ثم شرفت نفسه عن رذائل الدنيا فرفضها وأقبل على العبادة والسياحة فخرج إلى الحجاز سنة ثمان وثمانين واستوطن دمشق عشر سنين بمنارة الجامع وصنف فيها كتباً يقال إن الإحياء منها ثم القدس والإسكندرية وعاد إلى وطنه بطوس ثم أجاب الوزير فخر الدين بن نظام الملك إلى نظامية نيسابور، توفي في رابع عشر جمادى الآخرة سنة خمس وخمس مئة بالطابران قصبة بلاد طوس {cite:shadharat-dhahab p. 491-492}. وتصفه دائرة المعارف الإسلامية بأنه لاهوتي وفقيه ومفكر ومتصوف ومصلح ديني بارز، وتقدّر بقاءه في الشام بنحو سنتين لا عشر، وتعدّ الإحياء أعظم كتبه، وتجعل خانقاهه في طوس مكان تدريب مريديه في آخر حياته."
  en: "Hujjat al-Islam al-Ghazali the Shafi'i, author of the Ihya' — of which al-Nawawi said that were all Islam's books lost and the Ihya' alone remained it would suffice; he died at Tus in 505 {cite:kashf-zunun-furqan p. 221}. The Encyclopaedia of Islam, second edition, calls him an outstanding theologian, jurist, original thinker, mystic and religious reformer; he left his Baghdad chair in 488 AH/1095 CE, spent about two years in Syria and the Hijaz by its estimate, wrote the Ihya' in those years of retirement, returned briefly to teaching at Nishapur in 499 AH/1106 CE, and withdrew again to his khanqah at Tus before his death in Jumada II 505 AH."
  fr: "Hujjat al-Islam al-Ghazali le chaféite, auteur de l’Ihya’, dont al-Nawawi disait que, si tous les livres de l’islam disparaissaient et que lui seul restait, il suffirait ; il mourut à Tus en 505 H {cite:kashf-zunun-furqan p. 221}. L’Encyclopédie de l’Islam, deuxième édition, le qualifie de théologien, juriste, penseur original, mystique et réformateur religieux éminent ; il quitta sa chaire de Bagdad en 488 H/1095 ap. J.-C., passa environ deux ans en Syrie et au Hedjaz selon son estimation, écrivit l’Ihya’ pendant ces années de retraite, revint brièvement enseigner à Nishapur en 499 H/1106 ap. J.-C., puis se retira à nouveau dans sa khanqah de Tus avant sa mort en jumada II 505 H."
  ur: "ابو حامد محمد بن محمد الغزالی طوسی، 450ھ/1058ء سے 505ھ/1111ء، جنھیں انسائیکلوپیڈیا آف اسلام ممتاز متکلم، فقیہ، مفکر، صوفی اور دینی مصلح کہتا ہے۔ انھوں نے 484ھ/1091ء میں بغداد کی نظامیہ میں تدریس شروع کی اور 488ھ/1095ء میں اسے چھوڑ کر تقریباً دو سال شام اور حجاز میں گزارے، اس گوشہ نشینی میں احیاء علوم الدین لکھی، 499ھ/1106ء میں نیشاپور میں مختصر مدت کے لیے تدریس کی طرف لوٹے، اور طوس کی خانقاہ میں انتقال سے پہلے دوبارہ گوشہ نشین ہو گئے۔"
  es: "Hujjat al-Islam al-Ghazali el Shafi'i, autor del Ihya' —del cual al-Nawawi dijo que si todos los libros del Islam se perdieran y solo quedara el Ihya', sería suficiente; murió en Tus en 505 {cite:kashf-zunun-furqan p. 221}. La Enciclopedia del Islam, segunda edición, lo llama un teólogo, jurista, pensador original, místico y reformador religioso sobresaliente; dejó su cátedra en Bagdad en 488 AH/1095 CE, pasó unos dos años en Siria y el Hiyaz según su estimación, escribió el Ihya' en esos años de retiro, regresó brevemente a la enseñanza en Nishapur en 499 AH/1106 CE, y se retiró nuevamente a su khanqah en Tus antes de su muerte en Jumada II 505 AH."
  tr: "İslam'ın delili, İhya' Ulum el-Din'in yazarı İmam Şafiî, el-Nevevi'nin \"İslam kitapları yok olsa ve İhya kalsa, yok olanın yerini tutar\" dediği eserle tanınır. Hicri 505 yılında Tus'ta vefat etmiştir. {kaynak:kashf-zunun-furqan s. 221}. Hicri 450 yılında Tus'ta doğmuştur. Babası yün eğirir ve dükkanında satardı. Ölüm döşeğindeyken, onu ve kardeşi Ahmed'i dindar bir Sufi dostuna emanet etmiş, o da onlara bakmış ve onları eğitmiştir. Babasının mirası tükenince, onlara okula gitmelerini söylemiştir. Gazali, \"Biz okula gidip fıkıh okuyup geçimimizi sağlayacağız\" diye cevap vermiştir. Daha sonra Nişapur'a taşınmış ve zamanının en bilgili insanı olana kadar İmam Haramayn'ın yakın öğrencisi olmuştur. Hicri 484 yılında Bağdat'taki Nizamiye Medresesi'nde öğretmen olarak görevlendirildi. Büyük bir ihtişam ve törenle geldi; öyle ki, saygınlığı prenslerin ve bakanlarınkini bile aştı. Sonra, ruhu dünyevi kötülüklere fazla asil geldi, bu yüzden onları reddetti ve kendini ibadete ve seyahate adadı. Hicri 488 yılında Hicaz'a gitti ve on yıl boyunca Şam'daki caminin minaresinde yerleşti; burada kitaplar yazdı, bunlardan biri de \"İhya' Ulum el-Din\" (Dinî İlimlerin Yeniden Canlandırılması) olarak bilinir. Daha sonra Kudüs ve İskenderiye'ye gitti ve memleketi Tus'a döndü. Daha sonra, vezir Fahreddin ibn Nizam el-Mulk'un Nişapur'daki Nizamiye Medresesi'ne davetini kabul etti. Hicri 505 yılında Cemâdî el-Ahirî'nin on dördüncü gününde Tus bölgesinin başkenti Taberan'da vefat etti. {cite:shadharat-dhahab s. 491-492}. İslam Ansiklopedisi onu önde gelen bir ilahiyatçı, hukukçu, düşünür, mistik ve dini reformcu olarak tanımlar. Levant'taki kalış süresini on yıl değil, yaklaşık iki yıl olarak tahmin eder. El-İhya'yı en büyük eseri olarak kabul eder ve Tus'taki Hanka'sını, hayatının sonlarında takipçilerinin eğitildiği yer olarak gösterir."
  id: "Bukti kebenaran Islam, Imam Al-Shafi’i, penulis kitab Ihya’ Ulum al-Din, yang tentangnya Al-Nawawi berkata: “Jika kitab-kitab Islam lenyap dan Ihya’ tetap ada, maka itu sudah cukup untuk menggantikan apa yang telah lenyap.” Beliau wafat di Tus pada tahun 505 H. {kutip:kashf-zunun-furqan hlm. 221}. Beliau lahir di Tus pada tahun 450 H. Ayahnya memintal wol dan menjualnya di tokonya. Ketika menjelang ajalnya, beliau menitipkan dirinya dan saudaranya Ahmad kepada seorang sahabat Sufi yang saleh, yang merawat dan mendidik mereka. Setelah ayahnya menghabiskan warisannya, beliau menyuruh mereka pergi ke sekolah. Al-Ghazali menjawab, \"Kami akan pergi ke sekolah untuk mempelajari fiqih dan mencari nafkah.\" Kemudian beliau pindah ke Nishapur dan menjadi murid dekat Imam al-Haramayn hingga menjadi orang yang paling berilmu pada zamannya. Beliau diangkat untuk mengajar di Madrasah Nizamiyya di Baghdad pada tahun 484 H. Kedatangannya disambut dengan kemegahan dan upacara yang luar biasa, sedemikian rupa sehingga martabatnya melebihi para pangeran dan menteri. Kemudian, jiwanya menjadi terlalu mulia untuk terjerumus ke dalam keburukan duniawi, sehingga beliau menolaknya dan mengabdikan diri pada ibadah dan perjalanan. Beliau pergi ke Hijaz pada tahun 488 H dan menetap di Damaskus selama sepuluh tahun di menara masjid, di mana beliau menulis buku-buku, di antaranya dikatakan bahwa Ihya' Ulum al-Din (Kebangkitan Ilmu-ilmu Agama) adalah salah satunya. Kemudian beliau pergi ke Yerusalem dan Alexandria dan kembali ke tanah kelahirannya di Tus. Kemudian, beliau menerima undangan wazir Fakhr al-Din ibn Nizam al-Mulk ke Madrasah Nizamiyya di Nishapur. Beliau wafat pada tanggal empat belas Jumada al-Akhira tahun 505 H di Tabaran, ibu kota wilayah Tus. {cite:shadharat-dhahab hlm. 491-492}. Ensiklopedia Islam menggambarkannya sebagai seorang teolog, ahli hukum, pemikir, mistikus, dan reformator agama yang terkemuka. Ensiklopedia tersebut memperkirakan masa tinggalnya di Levant sekitar dua tahun, bukan sepuluh tahun. Ensiklopedia tersebut menganggap Al-Ihya’ sebagai buku terbesarnya, dan menjadikan Khanqah-nya di Tus sebagai tempat para pengikutnya dilatih di akhir hayatnya."
