summary:
  ar: "سياسي أفغاني قاد أفغانستان من ديسمبر 2001 إلى سبتمبر 2014: رئيساً للإدارة المؤقتة ثم رئيساً انتقالياً ثم أول رئيس منتخب ديمقراطياً للبلاد (2004، وأعيد انتخابه 2009). من بشتون بوبلزاي الدرانيين، جمع التبرعات للمجاهدين في باكستان في الثمانينيات وكان نائب وزير الخارجية سنة 1992. واجهت رئاسته انتقادات دولية بشأن الفساد وانتخابات 2009 المتنازع عليها، وهي اتهامات تسجل المقالة الإنجليزية رده عليها جزئياً؛ وبقي في كابل بعد سيطرة طالبان سنة 2021."
  en: "Afghan politician who led Afghanistan from December 2001 to September 2014 — chairman of the interim administration, then interim president, then the country's first democratically elected president (2004, re-elected 2009). A Popalzai Durrani Pashtun, he had been a mujahideen fundraiser in Pakistan in the 1980s and deputy foreign minister in 1992. His presidency drew international criticism over governmental corruption and the disputed 2009 election, criticism the English article records him as answering; he was also accused of corruption. He remained in Kabul after the Taliban takeover of 2021."
  ur: "افغان سیاست دان جنھوں نے دسمبر 2001ء سے ستمبر 2014ء تک افغانستان کی قیادت کی: عبوری انتظامیہ کے سربراہ، پھر عبوری صدر، پھر ملک کے پہلے جمہوری طور پر منتخب صدر (2004ء، 2009ء میں دوبارہ منتخب)۔ پوپلزئی درانی پشتون، وہ 1980ء کی دہائی میں پاکستان میں مجاہدین کے لیے چندہ اکٹھا کرتے رہے اور 1992ء میں نائب وزیر خارجہ رہے۔ ان کی صدارت کو بدعنوانی اور 2009ء کے متنازع انتخابات پر بین الاقوامی تنقید کا سامنا رہا، جن الزامات کا جواب انھوں نے دیا جیسا کہ انگریزی مضمون درج کرتا ہے؛ ان پر بدعنوانی کا الزام بھی لگا۔ 2021ء میں طالبان کے قبضے کے بعد وہ کابل ہی میں رہے۔"
