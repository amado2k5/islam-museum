summary:
  ar: "سياسي أفغاني قاد أفغانستان من ديسمبر 2001 إلى سبتمبر 2014: رئيساً للإدارة المؤقتة ثم رئيساً انتقالياً ثم أول رئيس منتخب ديمقراطياً للبلاد ⁦(2004، وأعيد انتخابه 2009)⁩. من بشتون بوبلزاي الدرانيين، جمع التبرعات للمجاهدين في باكستان في الثمانينيات وكان نائب وزير الخارجية سنة 1992. واجهت رئاسته انتقادات دولية بشأن الفساد وانتخابات 2009 المتنازع عليها، وهي اتهامات تسجل المقالة الإنجليزية رده عليها جزئياً؛ وبقي في كابل بعد سيطرة طالبان سنة 2021."
  en: "Afghan politician who led Afghanistan from December 2001 to September 2014 — chairman of the interim administration, then interim president, then the country's first democratically elected president (2004, re-elected 2009). A Popalzai Durrani Pashtun, he had been a mujahideen fundraiser in Pakistan in the 1980s and deputy foreign minister in 1992. His presidency drew international criticism over governmental corruption and the disputed 2009 election, criticism the English article records him as answering; he was also accused of corruption. He remained in Kabul after the Taliban takeover of 2021."
  ur: "افغان سیاست دان جنھوں نے دسمبر 2001ء سے ستمبر 2014ء تک افغانستان کی قیادت کی: عبوری انتظامیہ کے سربراہ، پھر عبوری صدر، پھر ملک کے پہلے جمہوری طور پر منتخب صدر ⁦(2004ء، 2009ء میں دوبارہ منتخب)⁩۔ پوپلزئی درانی پشتون، وہ 1980ء کی دہائی میں پاکستان میں مجاہدین کے لیے چندہ اکٹھا کرتے رہے اور 1992ء میں نائب وزیر خارجہ رہے۔ ان کی صدارت کو بدعنوانی اور 2009ء کے متنازع انتخابات پر بین الاقوامی تنقید کا سامنا رہا، جن الزامات کا جواب انھوں نے دیا جیسا کہ انگریزی مضمون درج کرتا ہے؛ ان پر بدعنوانی کا الزام بھی لگا۔ 2021ء میں طالبان کے قبضے کے بعد وہ کابل ہی میں رہے۔"
  es: "Político afgano que dirigió Afganistán desde diciembre de 2001 hasta septiembre de 2014: fue presidente del gobierno interino, luego presidente interino y, finalmente, el primer presidente elegido democráticamente del país (2004, reelegido en 2009). De etnia Popalzai Durrani Pashtun, había sido recaudador de fondos para los muyahidines en Pakistán en la década de 1980 y viceministro de Asuntos Exteriores en 1992. Su presidencia generó críticas internacionales por la corrupción gubernamental y las controvertidas elecciones de 2009, críticas a las que, según el artículo en inglés, respondió; también fue acusado de corrupción. Permaneció en Kabul tras la toma del poder por los talibanes en 2021."
  fr: "Homme politique afghan ayant dirigé l'Afghanistan de décembre 2001 à septembre 2014 – président de l'administration intérimaire, puis président par intérim, et enfin premier président démocratiquement élu du pays (2004, réélu en 2009). Pachtoune Popalzai Durrani, il avait collecté des fonds pour les moudjahidines au Pakistan dans les années 1980 et avait été vice-ministre des Affaires étrangères en 1992. Sa présidence a suscité des critiques internationales en raison de la corruption gouvernementale et de l'élection contestée de 2009, critiques auxquelles, selon l'article en anglais, il aurait répondu; il a lui-même été accusé de corruption. Il est resté à Kaboul après la prise de pouvoir des talibans en 2021."
  tr: "Aralık 2001'den Eylül 2014'e kadar Afganistan'ı yöneten Afgan siyasetçi: geçici yönetimin başı, ardından geçici cumhurbaşkanı ve ardından ülkenin ilk demokratik olarak seçilmiş cumhurbaşkanı (2004, 2009'da yeniden seçildi). Peştun Peştun Bobalzai Darrani'den, 1980'lerde Pakistan'daki mücahitler için fon topladı ve 1992'de dışişleri bakan yardımcısı oldu. Başkanlığı, yolsuzluk ve tartışmalı 2009 seçimleri nedeniyle uluslararası eleştirilere maruz kaldı; İngilizce makale bu suçlamalara kısmen yanıt veriyor; Taliban 2021'de kontrolü ele aldıktan sonra Kabil'de kaldı."
  id: "Seorang politisi Afghanistan yang memimpin Afghanistan dari Desember 2001 hingga September 2014: kepala pemerintahan sementara, kemudian presiden sementara, dan kemudian presiden pertama negara yang terpilih secara demokratis (2004, terpilih kembali pada 2009). Dari Pashtun Pashtun Bobalzai Darrani, ia menggalang dana untuk mujahidin di Pakistan pada 1980-an dan menjadi wakil menteri luar negeri pada 1992. Kepresidenannya menghadapi kritik internasional terkait korupsi dan pemilihan 2009 yang dipersengketakan, tuduhan yang sebagian ditanggapi oleh artikel bahasa Inggris; ia tetap berada di Kabul setelah Taliban mengambil alih pada 2021."
