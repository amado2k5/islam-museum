label: { ar: "أبو نصر الترياقي راوي الترمذي", en: "Abu Nasr al-Tiryaqi, transmitter of al-Tirmidhi", fr: "Abou Nasr al-Tiryaqi, transmetteur d’al-Tirmidhi", es: "Abu Nasr al-Tiryaqi, transmitter of al-Tirmidhi", ur: "ابو نصر الطریقی، الترمذی کے ٹرانسمیٹر" }
summary:
  ar: "أبو نصر الترياقي عبد العزيز بن محمد الهروي — راوي الترمذي سوى آخر جزء منه عن الجراحي؛ كان ثقة أديباً عاش أربعاً وتسعين سنة، وترياق من قرى هراة؛ توفي سنة ثلاث وثمانين وأربعمائة {cite:shadharat-dhahab p. 368}."
  en: "Abu Nasr al-Tiryaqi Abd al-Aziz b. Muhammad al-Harawi — rawi of (all but a last fragment of) the Tirmidhi from al-Jarrahi; a trustworthy adab scholar who lived ninety-four years — Tiryaq is a village of Herat; died 483 {cite:shadharat-dhahab p. 368}."
  fr: "Abu Nasr al-Tiryaqi Abd al-Aziz b. Muhammad al-Harawi – rudimentaire du Tirmidhi d’al-Jarrahi ; un érudit adab digne de confiance qui a vécu quatre-vingt-quatorze ans – Tiryaq est un village d’Hérat ; décédé 483 {cite:shadharat-dhahab p. 368}."
  es: "Abu Nasr al-Tiryaqi Abd al-Aziz b. Muhammad al-Harawi — autor de (casi todo excepto un último fragmento de) el Tirmidhi de al-Jarrahi; un erudito de adab confiable que vivió noventa y cuatro años — Tiryaq es una aldea de Herat; murió en 483 {cita:shadharat-dhahab p. 368}."
  ur: "ابو نصر الطریقی عبد العزیز ب۔ محمد الحروی - ترمذی کے راوی ⁦(سب کے سوا ایک آخری ٹکڑا)⁩ الجراحی سے؛ ایک ثقہ ادیب عالم جو کہ چورانوے سال زندہ رہے — طیریاق ہرات کا ایک گاؤں ہے۔ متوفی 483۔ 368}۔"
  tr: "Ebu Nasr el-Tariyaqi Abdulaziz ibn Muhammed el-Haravi — el-Tirmidi'nin anlatıcısı, el-Cerahi'den son kısmı hariç; doksan dört yıl yaşamış güvenilir ve edebi bir figürdü ve Herat köylerinden bir tılsımdı; dört yüz seksen üçüncü yılında vefat etti {atıf:Shadharat-Dhahab, s. 368}."
  id: "Abu Nasr al-Tariyaqi Abdul Aziz ibn Muhammad al-Harawi — narator al-Tirmidhi, kecuali bagian terakhir dari al-Jarahi; ia adalah sosok yang dapat dipercaya dan sastra yang hidup sembilan puluh empat tahun dan menjadi jimat dari desa-desa Herat; ia meninggal pada tahun empat ratus delapan puluh tiga {cite:shadharat-dhahab, hlm. 368}."
