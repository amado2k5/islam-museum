summary:
  ar: "أبو نصر الترياقي عبد العزيز بن محمد الهروي — راوي الترمذي سوى آخر جزء منه عن الجراحي؛ كان ثقة أديباً عاش أربعاً وتسعين سنة، وترياق من قرى هراة؛ توفي سنة ثلاث وثمانين وأربعمائة {cite:shadharat-dhahab p. 368}."
  en: "Abu Nasr al-Tiryaqi Abd al-Aziz b. Muhammad al-Harawi — rawi of (all but a last fragment of) the Tirmidhi from al-Jarrahi; a trustworthy adab scholar who lived ninety-four years — Tiryaq is a village of Herat; died 483 {cite:shadharat-dhahab p. 368}."
  fr: "Abu Nasr al-Tiryaqi Abd al-Aziz b. Muhammad al-Harawi – rudimentaire du Tirmidhi d’al-Jarrahi ; un érudit adab digne de confiance qui a vécu quatre-vingt-quatorze ans – Tiryaq est un village d’Hérat ; décédé 483 {cite:shadharat-dhahab p. 368}."
  es: "Abu Nasr al-Tiryaqi Abd al-Aziz b. Muhammad al-Harawi — autor de (casi todo excepto un último fragmento de) el Tirmidhi de al-Jarrahi; un erudito de adab confiable que vivió noventa y cuatro años — Tiryaq es una aldea de Herat; murió en 483 {cita:shadharat-dhahab p. 368}."
