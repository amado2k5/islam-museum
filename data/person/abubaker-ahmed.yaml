  ur: "ایتھوپیا کے مبلغ جو امہری زبان میں دعوت دیتے ہیں؛ ان کے ٹک ٹاک اکاؤنٹ (@ustaz.abubekerahmed) کی امہری سوانح میں لکھا ہے کہ یہ ان کا سرکاری اکاؤنٹ ہے، اور 7 نومبر 2026ء کو پڑھنے پر اس کے فالوور 240,300، ویڈیوز 509 اور لائکس 1.9 ملین تھے؛ مئی 2021ء میں ایتھوپیا کی خبر ایجنسی نے انھیں ممتاز اسلامی مبلغ قرار دے کر عید الفطر کی تقریبات میں سدِ نہضہ پر ان کے بیانات نقل کیے تھے۔"
