  ar: "داعية إثيوبي يعمل بالأمهرية؛ حسابه على تيك توك (@ustaz.abubekerahmed) — الذي تنصّ سيرته الأمهرية على أنه حسابه الرسمي — بلغ 240,300 متابع عند قراءته في 7 نوفمبر 2026، مع 509 مقاطع و1.9 مليون إعجاب، وكانت وكالة الأنباء الإثيوبية قد وصفته في مايو 2021 بأنه داعية إسلامي بارز ونقلت تصريحاته في احتفالات عيد الفطر عن سد النهضة."
