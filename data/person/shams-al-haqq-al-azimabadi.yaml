summary:
  ar: "أبو الطيب محمد المدعو بشمس الحق بن أمير بن علي بن حيدر الصديقي العظيم آبادي، محدث هندي، صاحب «التعليق المغني على الدارقطني»؛ قرأ بعض سنن الدارقطني على السيد محمد نذير حسين الدهلوي وأجازه بالكتاب، وأجازه أيضاً القاضي حسين بن محسن الأنصاري اليماني {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 10-11}."
  en: "Abu al-Tayyib Muhammad, called Shams al-Haqq, b. Amir b. 'Ali b. Haydar al-Siddiqi al-'Azimabadi, an Indian hadith scholar, author of al-Ta'liq al-Mughni 'ala al-Daraqutni; he read part of al-Daraqutni's Sunan with Sayyid Muhammad Nadhir Husayn al-Dihlawi, who licensed him for the whole book, and was also licensed by the judge Husayn b. Muhsin al-Ansari al-Yamani {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 10-11}."
  ur: "ابو الطیب محمد، المعروف بشمس الحق بن امیر بن علی بن حیدر صدیقی عظیم آبادی، ہندوستانی محدث، «التعلیق المغنی علی الدارقطنی» کے مصنف؛ انہوں نے سنن دارقطنی کا کچھ حصہ سید محمد نذیر حسین دہلوی پر پڑھا جنہوں نے انہیں پوری کتاب کی اجازت دی، اور قاضی حسین بن محسن انصاری یمانی نے بھی اجازت دی {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 10-11}۔"
  es: "Abu al-Tayyib Muhammad, llamado Shams al-Haqq, n. Amir b. 'Alí b. Haydar al-Siddiqi al-'Azimabadi, erudito indio en hadices, autor de al-Ta'liq al-Mughni 'ala al-Daraqutni; leyó parte del Sunan de al-Daraqutni con Sayyid Muhammad Nadhir Husayn al-Dihlawi, quien le autorizó para todo el libro, y también obtuvo la licencia del juez Husayn b. Muhsin al-Ansari al-Yamani {cita: sunan-daraqutni-ibn-hazm-2011 p. 5} {cita: sunan-daraqutni-ibn-hazm-2011 p. 10-11}."
  fr: "Abu al-Tayyib Muhammad, appelé Shams al-Haqq, b. Émir b. 'Ali b. Haydar al-Siddiqi al-'Azimabadi, spécialiste indien des hadiths, auteur d'al-Ta'liq al-Mughni 'ala al-Daraqutni; il a lu une partie du Sunan d'al-Daraqutni avec Sayyid Muhammad Nadhir Husayn al-Dihlawi, qui lui a accordé une licence pour l'intégralité du livre, et a également été autorisé par le juge Husayn b. Muhsin al-Ansari al-Yamani {cite: sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 10-11}."
  tr: "Ebu el-Tayyib Muhammed, Şems el-Hak ibn Emir ibn Ali ibn Haydar el-Siddiqi el-Azimabadi olarak bilinir, Hintli bir hadis âlimidir, 'Al-Ta'liq al-Mughni 'ala al-Daraqutni' adlı eserin yazarıdır; Seyyid Muhammed Nadhir Hüseyin el-Dihlawi yanında el-Daraqutni'nin bazı sünenlerini incelemiş ve ona kitapla yetki vermiştir; ayrıca Yargıç Hüseyin bin Mohsen al-Ansari al-Yamani tarafından da yetki verilmiştir {cite:sunan-daraqutni-ibn-hazm-2011 s. 5} {cite:sunan-daraqutni-ibn-hazm-2011, s. 10-11}."
  id: "Abu al-Tayyib Muhammad, dikenal sebagai Shams al-Haq ibn Amir ibn Ali ibn Haidar al-Siddiqi al-Azimabadi, seorang ulama hadis India, penulis 'Al-Ta'liq al-Mughni 'ala al-Daraqutni'; ia mempelajari beberapa karya Sunan al-Daraqutni di bawah bimbingan Sayyid Muhammad Nadhir Hussein al-Dihlawi dan memberinya otorisasi melalui kitab tersebut, serta memberikan otorisasi dari Hakim Husayn ibn Mohsen al-Ansari al-Yamani {cite:sunan-daraqutni-ibn-hazm-2011 hlm. 5} {cite:sunan-daraqutni-ibn-hazm-2011, hlm. 10-11}."
