summary:
  ar: "أبو الطيب محمد المدعو بشمس الحق بن أمير بن علي بن حيدر الصديقي العظيم آبادي، محدث هندي، صاحب «التعليق المغني على الدارقطني»؛ قرأ بعض سنن الدارقطني على السيد محمد نذير حسين الدهلوي وأجازه بالكتاب، وأجازه أيضاً القاضي حسين بن محسن الأنصاري اليماني {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 10-11}."
  en: "Abu al-Tayyib Muhammad, called Shams al-Haqq, b. Amir b. 'Ali b. Haydar al-Siddiqi al-'Azimabadi, an Indian hadith scholar, author of al-Ta'liq al-Mughni 'ala al-Daraqutni; he read part of al-Daraqutni's Sunan with Sayyid Muhammad Nadhir Husayn al-Dihlawi, who licensed him for the whole book, and was also licensed by the judge Husayn b. Muhsin al-Ansari al-Yamani {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 10-11}."
  ur: "ابو الطیب محمد، المعروف بشمس الحق بن امیر بن علی بن حیدر صدیقی عظیم آبادی، ہندوستانی محدث، «التعلیق المغنی علی الدارقطنی» کے مصنف؛ انہوں نے سنن دارقطنی کا کچھ حصہ سید محمد نذیر حسین دہلوی پر پڑھا جنہوں نے انہیں پوری کتاب کی اجازت دی، اور قاضی حسین بن محسن انصاری یمانی نے بھی اجازت دی {cite:sunan-daraqutni-ibn-hazm-2011 p. 5} {cite:sunan-daraqutni-ibn-hazm-2011 p. 10-11}۔"
