id: person/muhammad-ibn-nuh-al-ujli
class: person
label: { ar: "محمد بن نوح العجلي" }
summary:
  ar: "من أهل الحديث، امتنع مع أحمد بن حنبل وسجادة والقواريري عن الإقرار بخلق القرآن في سنة ثمان عشرة فقيدوا، ثم أجاب سجادة ثم القواريري فوجه بأحمد ومحمد بن نوح إلى الروم فبلغهم خبر وفاة المأمون قبل وصولهم {cite:tarikh-khulafa-minhaj-1434 p. 490,493}."
  en: "One of the hadith men who refused, with Ahmad ibn Hanbal, Sajjada and al-Qawariri, to affirm the Quran created in 218 — shackled; when Sajjada then al-Qawariri relented, he and Ahmad were forwarded toward the Byzantines until news of al-Ma'mun's death overtook them on the road {cite:tarikh-khulafa-minhaj-1434 p. 490,493}."
  es: "Uno de los hombres de hadices que se negó, junto con Ahmad ibn Hanbal, Sajjada y al-Qawariri, a afirmar el Corán creado en 218, fue encadenado; cuando Sajjada y luego al-Qawariri cedieron, él y Ahmad fueron enviados hacia los bizantinos hasta que la noticia de la muerte de al-Ma'mun los alcanzó en el camino {cite:tarikh-khulafa-minhaj-1434 p. 490,493}."
  fr: "L'un des hommes de hadith qui refusa, avec Ahmad ibn Hanbal, Sajjada et al-Qawariri, d'affirmer le Coran créé en 218 — enchaîné; lorsque Sajjada puis al-Qawariri cédèrent, lui et Ahmad furent envoyés vers les Byzantins jusqu'à ce que la nouvelle de la mort d'al-Ma'mun les rattrape sur la route {cite:tarikh-khulafa-minhaj-1434 p. 490,493}."
  ur: "احادیث میں سے ایک آدمی جس نے احمد بن حنبل، سجادہ اور القواریری کے ساتھ 218 میں بنائے گئے قرآن کی تصدیق کرنے سے انکار کر دیا تھا۔ جب سجادہ پھر القواریری نے پسپائی اختیار کی تو اسے اور احمد کو بازنطینیوں کی طرف روانہ کر دیا گیا یہاں تک کہ المامون کی موت کی خبر انہیں سڑک پر آ گئی۔ 490,493}۔"
  tr: "Hadisler arasında, Ahmed ibn Hanbal, Saccada ve El-Qawariri ile birlikte on sekizinci yılda Kur'an'ın yaratılmasını kabul etmeyi reddetti ve tutuklandı. Sonra Sacjada, ardından Al-Qawariri, Ahmed ve Muhammed ibn Nuh'u Romalılara gönderdi ve orada el-Me'mun'un ölümünü onların gelişinden önce bildirdi {atıf:Tarikh-khulafa-minhaj-1434, s. 490,493}."
  id: "Di antara para ulama hadis, ia menolak, bersama Ahmad ibn Hanbal, Sajjada, dan Al-Qawariri, mengakui penciptaan Al-Qur'an pada tahun kedelapan belas dan mereka ditangkap. Kemudian Sajjada, kemudian Al-Qawariri, mengirim Ahmad dan Muhammad ibn Nuh ke Romawi, di mana ia memberitahu mereka tentang kematian al-Ma'mun sebelum mereka tiba {cite:Tarikh-khulafa-minhaj-1434, hlm. 490,493}."
