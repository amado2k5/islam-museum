summary:
  ar: "من أهل الحديث، امتنع مع أحمد بن حنبل وسجادة والقواريري عن الإقرار بخلق القرآن في سنة ثمان عشرة فقيدوا، ثم أجاب سجادة ثم القواريري فوجه بأحمد ومحمد بن نوح إلى الروم فبلغهم خبر وفاة المأمون قبل وصولهم {cite:tarikh-khulafa-minhaj-1434 p. 490,493}."
  en: "One of the hadith men who refused, with Ahmad ibn Hanbal, Sajjada and al-Qawariri, to affirm the Quran created in 218 — shackled; when Sajjada then al-Qawariri relented, he and Ahmad were forwarded toward the Byzantines until news of al-Ma'mun's death overtook them on the road {cite:tarikh-khulafa-minhaj-1434 p. 490,493}."
