summary:
  ar: "أنصاري ذكره الصلابي في قائمة ولاة علي واليا على «الجند» {cite:sallabi-ali-vol1 p. 358}. ولم يحدد الكتاب في هذا الموضع أي جند يعني، ولا تاريخ ولايته."
  en: "An Ansari whom the book lists as Ali's governor of al-Jund {cite:sallabi-ali-vol1 p. 358}. The passage does not say which jund is meant, nor give the dates of his office."
  es: "Un Ansari a quien el libro menciona como gobernador de Alí en al-Jund {cite:sallabi-ali-vol1 p. 358}. El pasaje no especifica a qué jund se refiere ni da las fechas de su mandato."
  fr: "Un Ansari que le livre mentionne comme gouverneur d'al-Jund sous Ali {cite:sallabi-ali-vol1 p. 358}. Le passage ne précise ni de quel jund il s'agit, ni les dates de son mandat."
  ur: "ایک انصاری جسے کتاب میں علی کے گورنر الجند کے طور پر درج کیا گیا ہے۔ 358}۔ حوالہ یہ نہیں بتاتا کہ کون سا جند ہے اور نہ ہی اس کے دفتر کی تاریخیں بتائی ہیں۔"
  tr: "Al-Sallabi tarafından Ali'nin valileri listesinde 'Al-Jund' üzerinde vali olarak anılan Ansari {cite:sallabi-ali-cilt, s. 358}. Kitapta 'Jund'un burada hangi 'Jund' anıldığı veya valilik tarihi belirtilmemiştir."
  id: "Ansari yang disebutkan oleh Al-Sallabi dalam daftar gubernur Ali sebagai gubernur atas 'Al-Jund' {cite:sallabi-ali-vol1, hlm. 358}. Buku tersebut tidak menyebutkan 'Jund' mana yang dimaksud di sini, maupun tanggal masa jabatannya."
