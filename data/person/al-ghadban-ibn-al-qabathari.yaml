label: { ar: "الغضبان بن القبعثري الشيباني", en: "al-Ghadban ibn al-Qab'athari", fr: "Al-Ghadban ibn al-Qab’athari", es: "al-Ghadban ibn al-Qab'athari", ur: "الغدبان ابن القبطاری" }
summary:
  ar: "وجيه من بني شيبان من أهل الكوفة، وقف خطيباً بالجامع حين ولي الحجاج فقال اعترضوا هذا الخبيث في الطريق فاقتلوه فإن ذلك لا يعد منكم خلعاً، وقيل إنه هو القائل لعبد الرحمن بن الأشعث تغدّ بالحجاج قبل أن يتعشى بك، فحبسه الحجاج ثلاث سنين حتى احتاج إلى بذاءته لكتاب عبد الملك في صفات الجواري، ثم أطلقه بعدما جرى بينهما خبر القبة الخضراء بواسط حين قال بنيت في غير بلدك لغير ولدك لا تتمتع به ولا تنعم {cite:muruj-al-dhahab p. 137-141}."
  en: "The Shaybani wit who preached Kufa to kill al-Hajjaj on the road before it counted as insurrection — jailed three years, freed when only his bedouin-raider-drinker's vocabulary could parse Abd al-Malik's letter, and released again after judging the Green Dome 'built not in your land nor for your son' {cite:muruj-al-dhahab p. 137-141}."
  fr: "Homme d’esprit shaybanite qui exhorta Koufa à tuer al-Hajjaj en chemin avant que cela ne compte comme une insurrection ; emprisonné trois ans, il fut libéré lorsque seul son vocabulaire de Bédouin, de pillard et de buveur permit de déchiffrer la lettre d’Abd al-Malik, puis relâché à nouveau après avoir jugé la Coupole verte « bâtie ni sur ta terre ni pour ton fils » {cite:muruj-al-dhahab p. 137-141}."
  es: "El ingenioso Shaybani que instó a Kufa a matar a al-Hajjaj en el camino antes de que se considerara una insurrección, fue encarcelado tres años, liberado cuando solo su vocabulario de asaltante beduino y bebedor pudo descifrar la carta de Abd al-Malik, y liberado nuevamente después de juzgar que la Cúpula Verde \"no fue construida en tu tierra ni para tu hijo\" {cite:muruj-al-dhahab p. 137-141}."
  ur: "وہ شیبانی عقل جس نے کوفہ کو بغاوت میں شمار ہونے سے پہلے الحجاج کو سڑک پر قتل کرنے کی تبلیغ کی تھی - تین سال قید کاٹی، اس وقت رہا ہوا جب صرف اس کے بدو حملہ آور شراب پینے والے کی لغت عبد الملک کے خط کو پارس کر سکتی تھی، اور سبز گنبد کا فیصلہ کرنے کے بعد دوبارہ رہا ہوا 'آپ کے بیٹے کے لیے نہیں بنایا گیا'۔ 137-141}۔"
  tr: "Kufa'nın Beni Şeyban kabilesinden Vacih, Haccac vali olarak atandığında camide vaiz olarak dururken, \"Bu alçak adamı yolda durdurun ve öldürün, çünkü bu sizin tarafınızdan bir görevden alma olarak kabul edilmeyecektir\" dedi. Ayrıca, Abdülrahman ibn Eş'at'a, \"Haccac seninle akşam yemeği yemeden önce sen onunla öğle yemeği ye\" dediği de rivayet edilir. Bunun üzerine Haccac, Abdülmalik'in cariyelerin nitelikleri hakkındaki kitabında onun müstehcen sözlerine ihtiyaç duyana kadar onu üç yıl hapse attı. Daha sonra, aralarında Wasit'teki Yeşil Kubbe hikayesi geçtikten sonra, \"Bu, senin ülkesinden başka bir yerde, senin oğlundan başka biri için inşa edildi. Sen bundan zevk almayacaksın, bundan bereket görmeyeceksin\" dediğinde onu serbest bıraktı. {kaynak: Muruj-al-dhahab s. 137-141}"
  id: "Wajih, dari suku Banu Shayban di Kufa, berdiri sebagai seorang penceramah di masjid ketika al-Hajjaj diangkat menjadi gubernur dan berkata, “Cegah orang jahat ini di jalan dan bunuh dia, karena itu tidak akan dianggap sebagai pemecatan di pihakmu.” Dikatakan bahwa dialah yang berkata kepada Abd al-Rahman ibn al-Ash’ath, “Makan sianglah dengan al-Hajjaj sebelum dia makan malam denganmu.” Maka al-Hajjaj memenjarakannya selama tiga tahun sampai ia membutuhkan kecabulannya untuk buku Abd al-Malik tentang kualitas budak perempuan. Kemudian ia membebaskannya setelah kisah Kubah Hijau di Wasit terjadi di antara mereka ketika ia berkata, “Itu dibangun di negara selain negaramu untuk orang lain selain putramu. Kau tidak akan menikmatinya atau diberkati olehnya.” {cite:muruj-al-dhahab hlm. 137-141}"
