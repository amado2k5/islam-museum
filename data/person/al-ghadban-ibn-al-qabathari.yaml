label: { ar: "الغضبان بن القبعثري الشيباني", en: "al-Ghadban ibn al-Qab'athari" }
summary:
  ar: "وجيه من بني شيبان من أهل الكوفة، وقف خطيباً بالجامع حين ولي الحجاج فقال اعترضوا هذا الخبيث في الطريق فاقتلوه فإن ذلك لا يعد منكم خلعاً، وقيل إنه هو القائل لعبد الرحمن بن الأشعث تغدّ بالحجاج قبل أن يتعشى بك، فحبسه الحجاج ثلاث سنين حتى احتاج إلى بذاءته لكتاب عبد الملك في صفات الجواري، ثم أطلقه بعدما جرى بينهما خبر القبة الخضراء بواسط حين قال بنيت في غير بلدك لغير ولدك لا تتمتع به ولا تنعم {cite:muruj-al-dhahab p. 137-141}."
  en: "The Shaybani wit who preached Kufa to kill al-Hajjaj on the road before it counted as insurrection — jailed three years, freed when only his bedouin-raider-drinker's vocabulary could parse Abd al-Malik's letter, and released again after judging the Green Dome 'built not in your land nor for your son' {cite:muruj-al-dhahab p. 137-141}."
