  tr: "Muhammed bin Ali'nin özgür adamı; al-Baladhuri'ye göre, bu yol al-Mansur tarafından kesilmiştir; Munira Yolu ve doğu tarafındaki Khan Munira'ya atfedilir."
  id: "Bekas Raja Muhammad ibn Ali; menurut al-Baladhuri, wilayah ini dipisahkan oleh al-Mansur, yang dikaitkan dengan Jalan Munira dan Khan Munira di sisi timur."
