  en: Abu al-Qasim ibn Ahmad ibn Muhammad al-Balawi al-Qayrawani, known as al-Burzuli, one of the Maliki imams of the Maghrib; he made the pilgrimage, passed through Cairo in 800 AH, settled in Tunis where the giving of fatwas came to rest with him, and wrote 'Jami' Masa'il al-Ahkam'.
