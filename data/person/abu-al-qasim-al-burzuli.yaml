summary:
  ar: أبو القاسم بن أحمد بن محمد البلوي القيرواني المعروف بالبرزلي، من أئمة المالكية في المغرب، حج ومر بالقاهرة سنة 800 هـ وسكن تونس وانتهت إليه الفتوى فيها، وله «جامع مسائل الأحكام».
  en: Abu al-Qasim ibn Ahmad ibn Muhammad al-Balawi al-Qayrawani, known as al-Burzuli, one of the Maliki imams of the Maghrib; he made the pilgrimage, passed through Cairo in 800 AH, settled in Tunis where the giving of fatwas came to rest with him, and wrote 'Jami' Masa'il al-Ahkam'.
  fr: "Abu al-Qasim ibn Ahmad ibn Muhammad al-Balawi al-Qayrawani, connu sous le nom d'al-Burzuli, l'un des imams malikites du Maghreb ; il fit le pèlerinage, passa par Le Caire en 800 H, s'établit à Tunis où l'autorité de la fatwa finit par lui revenir, et écrivit le « Jami' Masa'il al-Ahkam »."
  es: "Abu al-Qasim ibn Ahmad ibn Muhammad al-Balawi al-Qayrawani, conocido como al-Burzuli, uno de los imanes malikíes del Magreb; realizó la peregrinación, pasó por El Cairo en el año 800 AH, se estableció en Túnez donde la emisión de fatuas quedó en sus manos y escribió 'Jami' Masa'il al-Ahkam'."
  ur: "ابو القاسم بن احمد بن محمد البلاوی القیروانی المعروف البرزولی، مغرب کے مالکی اماموں میں سے ایک؛ آپ نے حج کیا، 800 ہجری میں قاہرہ سے گزر کر تیونس میں سکونت اختیار کی جہاں فتویٰ دینے سے آپ کو سکون ملا، اور 'جامع المسائل الاحکام' لکھا۔"
  tr: "Ebu el-Kâsım ibn Ahmed ibn Muhammed el-Balavi el-Kayravani, el-Barzali olarak da bilinen, Fas'ın önde gelen Maliki alimlerinden biriydi. Hicri 800 yılında Hac ibadetini yerine getirmiş ve Kahire'den geçmiştir. Tunus'a yerleşmiş ve orada fetva verme yetkisi onunla birlikte sona ermiştir. \"Cami' Masa'il el-Ahkam\" (Hukuki Hükümler Derlemesi) adlı eserin yazarıdır."
  id: "Abu al-Qasim ibn Ahmad ibn Muhammad al-Balawi al-Qayrawani, yang dikenal sebagai al-Barzali, adalah salah satu ulama Maliki terkemuka di Maroko. Beliau menunaikan ibadah haji dan melewati Kairo pada tahun 800 Hijriah. Beliau menetap di Tunisia, dan wewenang untuk mengeluarkan fatwa di sana berakhir padanya. Beliau menulis kitab “Jami’ Masa’il al-Ahkam” (Kumpulan Putusan Hukum)."
