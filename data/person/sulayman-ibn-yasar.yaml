class: person
label: { ar: "سليمان بن يسار", en: "Sulayman ibn Yasar", es: "Sulayman ibn Yasar", fr: "Sulayman ibn Yasar", ur: "سلیمان بن یسار" }
summary:
  ar: "مولى ميمونة زوج النبي وأخو عطاء بن يسار ويكنى أبا أيوب، توفي بالمدينة سنة سبع ومائة وقيل ثمان ومائة وهو ابن ثلاث وسبعين سنة {cite:muruj-al-dhahab p. 191-192}. ويذكر الكتاب أنه كان من أعضاء مجلس الشورى الذي أنشأه عمر بن عبد العزيز بالمدينة حين ولي إمارتها. {cite:salabi-umayyad-state-2020 p.173}"
  en: "Maymuna's mawla and 'Ata' ibn Yasar's brother — died at Medina in 107 or 108, aged seventy-three {cite:muruj-al-dhahab p. 191-192}."
  es: "El mawla de Maymuna y hermano de 'Ata' ibn Yasar murió en Medina en 107 o 108, a la edad de setenta y tres años {cite:muruj-al-dhahab p. 191-192}."
  fr: "Le mawla de Maymuna et le frère d''Ata' ibn Yasar — est mort à Médine en 107 ou 108, à l'âge de soixante-treize ans {cite:muruj-al-dhahab p. 191-192}."
  ur: "میمونہ کے مولا اور عطاء بن یسار کے بھائی - 107 یا 108 میں مدینہ میں وفات پا گئے، ان کی عمر تہتر سال تھی۔ 191-192}۔"
  tr: "Ma'muna, Peygamber'in eşi ve Ata ibn Yasar'ın kardeşi olan Ebu Eyyub'un kardeşiydi. 107 Hicri yılında, ya da bazıları 800 yılında, yetmiş üç yaşında Medine'de öldü {atıf:muruj-al-dhahab, s. 191-192}. Kitapta, Ömer bin Abdülaziz tarafından Medine'de kurulan Şura Konseyi'nin bir üyesi olduğu belirtilir. {alıntı:Selabi-Umayyad-devlet-2020 s.173}"
  id: "Ma'muna adalah mantan Maymunah, istri Nabi dan saudara Ata ibn Yasar, yang dikenal sebagai Abu Ayyub. Ia meninggal di Madinah pada tahun 107 H, atau beberapa orang mengatakan 800, pada usia tujuh puluh tiga {cite:muruj-al-dhahab, hlm. 191-192}. Buku tersebut menyebutkan bahwa ia adalah anggota Dewan Syurat yang didirikan oleh Umar ibn Abd al-Aziz di Madinah ketika ia menjadi gubernurnya. {cite:salabi-umayyad-state-2020 hlm.173}"
