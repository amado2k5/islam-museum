id: person/hisham-ibn-al-hakam
class: person
label: { ar: "هشام بن الحكم", en: "Hisham ibn al-Hakam" }
summary:
  ar: "كان مقدماً في القول بالجسم والقول بالإمامة على مذهب القطعية يختلف إليه أصحابه من الرافضة، وشاركه عبد الله بن يزيد الإباضي في حانوت خرز لا يجري بينهما مسابة على ضد مذهبيهما، ولما سأله الإباضي ابنته فاطمة قال إنها مؤمنة فلم يعاوده {cite:muruj-al-dhahab p. 183-184}.، وقال في مجلس يحيى إن العشق حبالة نصبها الدهر فلا يصيد بها إلا أهل التخالص في النوائب يعقد اللسان الفصيح ويترك المالك مملوكاً حتى يخضع لعبد عبده {cite:muruj-al-dhahab p. 358}، قال ابن النديم هشام بن الحكم البغدادي الكندي مولى بني شيبان كنيته أبو محمد وقيل أبو الحكم أصله من الكوفة وانتقل إلى بغداد، من جلة أصحاب جعفر الصادق وهو من متكلمي الشيعة الإمامية وبطانتهم وممن دعا له الصادق فقال لا تزال مؤيدا بروح القدس ما نصرتنا بلسانك، وهو الذي فتق الكلام في الإمامة وهذب المذهب وسهل طريق الحجاج فيه وكان حاذقا بصناعة الكلام حاضر الجواب، وكان أولا من أصحاب الجهم بن صفوان ثم انتقل إلى القول بالإمامة بالدلائل والنظر، وكان منقطعا إلى البرامكة ملازما ليحيى بن خالد ثم تبع الصادق فانقطع إليه، وتوفي بعد نكبة البرامكة بمدة يسيرة وقيل في خلافة المأمون، وكان هشام يقول ما رأيت مثل مخالفينا عمدوا إلى من ولاه الله من سمائه فعزلوه وإلى من عزله من سمائه فولوه {cite:fihrist-ibn-al-nadim p. 531}، وسئل هشام عن معاوية أشهد بدرا فقال نعم من ذاك الجانب، وكان منقطعا إلى يحيى بن خالد البرمكي وكان القيم بمجالس كلامه ونظره وكان ينزل الكرخ من مدينة السلام، وله كتب منها كتاب الإمامة وكتاب الرد على الزنادقة وكتاب الرد على أصحاب الاثنين وكتاب التوحيد وكتاب الرد على هشام الجواليقي وكتاب الشيخ والغلام وكتاب الميزان وكتاب الرد على شيطان الطاق وكتاب على أرستاليس في التوحيد {cite:fihrist-ibn-al-nadim p. 249-250}"
  en: "The leading Rafidi mutakallim of corporealism and imamate doctrine — his Ibadi shop-partner sued for his daughter and was answered 'she is a believer' {cite:muruj-al-dhahab p. 183-184}."
