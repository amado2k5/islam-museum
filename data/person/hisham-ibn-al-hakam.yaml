summary:
  ar: "كان مقدماً في القول بالجسم والقول بالإمامة على مذهب القطعية يختلف إليه أصحابه من الرافضة، وشاركه عبد الله بن يزيد الإباضي في حانوت خرز لا يجري بينهما مسابة على ضد مذهبيهما، ولما سأله الإباضي ابنته فاطمة قال إنها مؤمنة فلم يعاوده {cite:muruj-al-dhahab p. 183-184}. وقال في مجلس يحيى إن العشق حبالة نصبها الدهر فلا يصيد بها إلا أهل التخالص في النوائب يعقد اللسان الفصيح ويترك المالك مملوكاً حتى يخضع لعبد عبده {cite:muruj-al-dhahab p. 358}، قال ابن النديم هشام بن الحكم البغدادي الكندي مولى بني شيبان كنيته أبو محمد وقيل أبو الحكم أصله من الكوفة وانتقل إلى بغداد، من جلة أصحاب جعفر الصادق وهو من متكلمي الشيعة الإمامية وبطانتهم وممن دعا له الصادق فقال لا تزال مؤيدا بروح القدس ما نصرتنا بلسانك، وهو الذي فتق الكلام في الإمامة وهذب المذهب وسهل طريق الحجاج فيه وكان حاذقا بصناعة الكلام حاضر الجواب، وكان أولا من أصحاب الجهم بن صفوان ثم انتقل إلى القول بالإمامة بالدلائل والنظر، وكان منقطعا إلى البرامكة ملازما ليحيى بن خالد ثم تبع الصادق فانقطع إليه، وتوفي بعد نكبة البرامكة بمدة يسيرة وقيل في خلافة المأمون، وكان هشام يقول ما رأيت مثل مخالفينا عمدوا إلى من ولاه الله من سمائه فعزلوه وإلى من عزله من سمائه فولوه {cite:fihrist-ibn-al-nadim p. 531}، وسئل هشام عن معاوية أشهد بدرا فقال نعم من ذاك الجانب، وكان منقطعا إلى يحيى بن خالد البرمكي وكان القيم بمجالس كلامه ونظره وكان ينزل الكرخ من مدينة السلام، وله كتب منها كتاب الإمامة وكتاب الرد على الزنادقة وكتاب الرد على أصحاب الاثنين وكتاب التوحيد وكتاب الرد على هشام الجواليقي وكتاب الشيخ والغلام وكتاب الميزان وكتاب الرد على شيطان الطاق وكتاب على أرستاليس في التوحيد {cite:fihrist-ibn-al-nadim p. 249-250}"
  en: "The leading Rafidi mutakallim of corporealism and imamate doctrine — his Ibadi shop-partner sued for his daughter and was answered 'she is a believer' {cite:muruj-al-dhahab p. 183-184}."
  es: "El principal mutakallim rafidí del corporeismo y la doctrina del imamato —su socio comercial ibadí demandó por su hija y se le respondió que \"ella es creyente\" {cite:muruj-al-dhahab p. 183-184}."
  fr: "Le principal mutakallim rafidien du corporalisme et de la doctrine de l'imamat — son associé ibadite a intenté un procès pour sa fille et s'est vu répondre « elle est croyante » {cite: muruj-al-dhahab p. 183-184}."
  ur: "جسمانیت اور امامت کے عقیدہ کے سرکردہ رافدی متکلم - اس کے عبادی دکاندار نے اپنی بیٹی کے خلاف مقدمہ دائر کیا اور اسے جواب دیا گیا کہ 'وہ مومن ہے'۔ 183-184}۔"
  tr: "Nihai imalık (el-Kıtiyyah) doktrininin önde gelen otoritelerinden biriydi; ancak Rafidah'tan takipçileri buna katılmadı. Abdullah ibn Yezid el-İbadi, aralarında iki okula karşı hiçbir hakaret yapılmayacağı bir boncuk dükkanına katıldı. El-İbadi ona kızı Fatimah hakkında sorduğunda, onun müminler olduğunu söyledi, ancak tekrarlamadı {atıf:Muruj-al-Dhahab, s. 183-184}. Yahya'nın sarayında şöyle dedi: Aşk zamanla bağlanan bir iptir, bu yüzden sadece felaket zamanlarında samimi olanlar onu avlayabilir. Güzel dili tutar ve sahibini köle olarak bırakır, ta ki kuluna boyun eğene kadar {atıf:muruj-al-dhahab s. 358}. İbn el-Nadim Hişam ibn el-Hakam el-Bağdadi el-Kindi, Banu Şeyban'ın özgür kölesi, kunya'sı Ebu Muhammed'dir ve Ebu al-Hakam'ın aslen Kufa'dan olup Bağdat'a taşındığı söylenir. O, Cafer el-Sadık'ın önde gelen yoldaşlarından biriydi ve İmam Şii teologları ile onların yakın çevresi arasındaydı; onu çağıranlar arasında el-Sadiq, 'Ruhla desteklenmeye devam et.' dedi. El-Kuds, dilinizle desteklediğiniz şey, İmamatlık hakkındaki tartışmaları kıran, doktrini geliştiren ve tartışma yolunu kolaylaştıran kişiydi. İlahiyat zanaatında yetenekliydi ve hızlı cevap verirdi. Başlangıçta Al-Jahm ibn Safwan'ın yoldaşları arasındaydı, sonra kanıt ve anlayışla İmalık öğretisine geçti. Barmakilerden ayrıldı, Yahya ibn Halid'i takip etti, sonra el-Sadık'ı takip etti ve ondan koptu. Barmakıların felaketinden kısa bir süre sonra öldü ve bu halifelik sırasında söylenir. Hisham şöyle derdi: 'Rakiplerimiz gibi birini hiç görmedim; onlar Tanrı'nın göklerinden atadıklarına döndüler, onu kovdular ve Onu göklerinden kim indirirse, onu takip etsin {atıf:Fihrist-ibn-al-Nadim s. 531}. Hiham'a Badr'da tanıklık eden Muaviye hakkında soruldu ve o taraftan evet dedi. Yahya ibn Halid el-Barmaki'den kopmuştu; Yahya onun tartışmalarında ve tekabkürlerinde liderdi. Eskiden Karkh'taki barış şehrinden geliyordu. İmamat Kitabı, Sapkınları Reddetme Kitabı, İki Sahabeyi Reddetme Kitabı, Tek Tanrıcılık Kitabı, Hisham al-Jawaliqi'yi Reddetme Kitabı, Şeyh ve Çocuk Kitabı, Denge Kitabı, Kemer Şeytanını Reddetme Kitabı ve Aristylis'in Tek Tanrıcılık Kitabı gibi kitaplar yazdı {atıf:fihrist-ibn-al-nadim s. 249-250}"
  id: "Ia adalah otoritas terkemuka dalam doktrin imamate definitif (al-Qatiyyah), yang tidak disetujui oleh para pengikutnya dari Rafidah. Abdullah ibn Yazid al-Ibadi bergabung dengannya di sebuah toko manik-manik di mana tidak ada penghinaan antara mereka terhadap dua aliran mereka. Ketika al-Ibadi menanyakan tentang putrinya Fatimah, ia mengatakan bahwa putrinya adalah seorang penganut, tetapi ia tidak mengulanginya {cite:muruj-al-dhahab, hlm. 183-184}. Ia berkata di istana Yahya bahwa cinta adalah tali yang diikat oleh waktu, sehingga hanya orang yang tulus di saat malapetaka yang dapat memburunya. Ia bercakap dengan fasih dan meninggalkan pemilik sebagai budak sampai ia tunduk kepada hambanya {cite:muruj-al-dhahab hlm. 358}. Ibn al-Nadim Hisham ibn al-Hakam al-Baghdadi al-Kindi, seorang budak yang telah dibebaskan dari Banu Shayban, kunya miliknya adalah Abu Muhammad, dan dikatakan Abu al-Hakam berasal dari Kufa dan pindah ke Baghdad. Ia termasuk di antara sahabat terkemuka Ja'far al-Sadiq dan termasuk teolog Syiah Imami serta lingkaran dalamnya, dan di antara mereka yang memanggilnya al-Sadiq berkata, 'Kamu tetap didukung oleh roh.' Al-Quds, yang telah Anda dukung dengan lidahmu, adalah orang yang mematahkan argumen tentang Imamat, menyempurnakan doktrin, dan memfasilitasi jalan argumentasi di dalamnya. Ia mahir dalam seni teologi dan cepat menjawab. Awalnya ia termasuk sahabat Al-Jahm ibn Safwan, kemudian beralih ke doktrin Imamate melalui bukti dan wawasan. Ia terpisah dari Barmakid, mengikuti Yahya ibn Khalid, kemudian mengikuti al-Sadiq dan terputus hubungan dengannya. Ia meninggal tak lama setelah bencana Barmakid, dan dikatakan selama kekhalifahan al-Ma'mun. Hisham biasa berkata, 'Saya belum pernah melihat siapa pun seperti lawan kami; mereka berpaling kepada mereka yang ditunjuk Tuhan dari surga-Nya, memecatnya, dan kepada Siapa pun yang mengusirnya dari surga-Nya, ikutilah dia {cite:fihrist-ibn-al-nadim hlm. 531}. Hisham ditanya tentang Muawiyah yang bersaksi di Badr, dan dia menjawab ya dari sisi itu. Dia terputus dari Yahya ibn Khalid al-Barmaki, yang menjadi pemimpin dalam diskusi dan kontemplasinya. Dia biasa turun dari kota damai di Karkh. Dia menulis buku-buku termasuk Kitab Imamat, Kitab Menolak Para Bidah, Kitab Menolak Dua Sahabat, Kitab Monoteisme, Kitab Menolak Hisham Al-Jawaliqi, Kitab Sheikh dan Anak Muda, Kitab Keseimbangan, Buku Menolak Iblis Lengkungan, dan Kitab Aristylis tentang Monoteisme {cite:fihrist-ibn-al-nadim hlm. 249-250}"
