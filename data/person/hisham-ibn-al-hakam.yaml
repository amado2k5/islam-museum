label: { ar: "هشام بن الحكم", en: "Hisham ibn al-Hakam" }
summary:
  ar: "كان مقدماً في القول بالجسم والقول بالإمامة على مذهب القطعية يختلف إليه أصحابه من الرافضة، وشاركه عبد الله بن يزيد الإباضي في حانوت خرز لا يجري بينهما مسابة على ضد مذهبيهما، ولما سأله الإباضي ابنته فاطمة قال إنها مؤمنة فلم يعاوده {cite:muruj-al-dhahab p. 183-184}.، وقال في مجلس يحيى إن العشق حبالة نصبها الدهر فلا يصيد بها إلا أهل التخالص في النوائب يعقد اللسان الفصيح ويترك المالك مملوكاً حتى يخضع لعبد عبده {cite:muruj-al-dhahab p. 358}"
  en: "The leading Rafidi mutakallim of corporealism and imamate doctrine — his Ibadi shop-partner sued for his daughter and was answered 'she is a believer' {cite:muruj-al-dhahab p. 183-184}."
