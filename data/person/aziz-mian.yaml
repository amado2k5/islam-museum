summary:
  ar: "قوّال باكستاني (1942–2000) لُقّب بشاهنشاه القوالي، من القلائل الذين كتبوا كلمات قوالياتهم، بدأ في ضريح داتا كنج بخش بلاهور، وأنشد للجيش حتى لُقّب بالقوال العسكري، ويحمل رقم أطول قوالي تجارية ⁦(نحو 115 دقيقة)⁩، ونال وسام حسن الأداء في 1989، وتوفي في إيران في جولة غنائية."
  en: "Pakistani qawwal (1942–2000) called the emperor of qawwali, one of the few who wrote their own lyrics; he began at the shrine of Data Ganj Bakhsh in Lahore, sang so often for the army that he was dubbed the 'military qawwal', holds the record for the longest commercially released qawwali (about 115 minutes), received the Pride of Performance in 1989 and died on a concert tour of Iran."
  ur: "پاکستانی قوال ⁦(1942ء–2000ء)⁩، جنھیں شہنشاہِ قوالی کہا گیا، ان چند میں سے جو اپنا کلام خود لکھتے تھے؛ لاہور میں داتا گنج بخش کے مزار سے آغاز کیا، فوج کے لیے اتنا گایا کہ «فوجی قوال» کہلائے، سب سے طویل تجارتی قوالی ⁦(تقریباً 115 منٹ)⁩ کا ریکارڈ رکھتے ہیں، 1989ء میں تمغۂ حسنِ کارکردگی پایا، اور ایران کے ایک دورے میں فوت ہوئے۔"
