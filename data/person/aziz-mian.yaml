summary:
  ar: "\u0642\u0648\u0651\u0627\u0644 \u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a (1942\u20132000) \u0644\u064f\u0642\u0651\u0628 \u0628\u0634\u0627\u0647\u0646\u0634\u0627\u0647 \u0627\u0644\u0642\u0648\u0627\u0644\u064a\u060c \u0645\u0646 \u0627\u0644\u0642\u0644\u0627\u0626\u0644 \u0627\u0644\u0630\u064a\u0646 \u0643\u062a\u0628\u0648\u0627 \u0643\u0644\u0645\u0627\u062a \u0642\u0648\u0627\u0644\u064a\u0627\u062a\u0647\u0645\u060c \u0628\u062f\u0623 \u0641\u064a \u0636\u0631\u064a\u062d \u062f\u0627\u062a\u0627 \u0643\u0646\u062c \u0628\u062e\u0634 \u0628\u0644\u0627\u0647\u0648\u0631\u060c \u0648\u0623\u0646\u0634\u062f \u0644\u0644\u062c\u064a\u0634 \u062d\u062a\u0649 \u0644\u064f\u0642\u0651\u0628 \u0628\u0627\u0644\u0642\u0648\u0627\u0644 \u0627\u0644\u0639\u0633\u0643\u0631\u064a\u060c \u0648\u064a\u062d\u0645\u0644 \u0631\u0642\u0645 \u0623\u0637\u0648\u0644 \u0642\u0648\u0627\u0644\u064a \u062a\u062c\u0627\u0631\u064a\u0629 \u2066(\u0646\u062d\u0648 115 \u062f\u0642\u064a\u0642\u0629)\u2069\u060c \u0648\u0646\u0627\u0644 \u0648\u0633\u0627\u0645 \u062d\u0633\u0646 \u0627\u0644\u0623\u062f\u0627\u0621 \u0641\u064a 1989\u060c \u0648\u062a\u0648\u0641\u064a \u0641\u064a \u0625\u064a\u0631\u0627\u0646 \u0641\u064a \u062c\u0648\u0644\u0629 \u063a\u0646\u0627\u0626\u064a\u0629."
  en: "Pakistani qawwal (1942\u20132000) called the emperor of qawwali, one of the few who wrote their own lyrics; he began at the shrine of Data Ganj Bakhsh in Lahore, sang so often for the army that he was dubbed the 'military qawwal', holds the record for the longest commercially released qawwali (about 115 minutes), received the Pride of Performance in 1989 and died on a concert tour of Iran."
