summary:
  ar: "قوّال باكستاني (1942–2000) لُقّب بشاهنشاه القوالي، من القلائل الذين كتبوا كلمات قوالياتهم، بدأ في ضريح داتا كنج بخش بلاهور، وأنشد للجيش حتى لُقّب بالقوال العسكري، ويحمل رقم أطول قوالي تجارية ⁦(نحو 115 دقيقة)⁩، ونال وسام حسن الأداء في 1989، وتوفي في إيران في جولة غنائية."
  en: "Pakistani qawwal (1942–2000) called the emperor of qawwali, one of the few who wrote their own lyrics; he began at the shrine of Data Ganj Bakhsh in Lahore, sang so often for the army that he was dubbed the 'military qawwal', holds the record for the longest commercially released qawwali (about 115 minutes), received the Pride of Performance in 1989 and died on a concert tour of Iran."
  ur: "پاکستانی قوال ⁦(1942ء–2000ء)⁩، جنھیں شہنشاہِ قوالی کہا گیا، ان چند میں سے جو اپنا کلام خود لکھتے تھے؛ لاہور میں داتا گنج بخش کے مزار سے آغاز کیا، فوج کے لیے اتنا گایا کہ «فوجی قوال» کہلائے، سب سے طویل تجارتی قوالی ⁦(تقریباً 115 منٹ)⁩ کا ریکارڈ رکھتے ہیں، 1989ء میں تمغۂ حسنِ کارکردگی پایا، اور ایران کے ایک دورے میں فوت ہوئے۔"
  es: "El qawwal pakistaní (1942-2000), considerado el emperador del qawwali, fue uno de los pocos que escribían sus propias letras. Comenzó su carrera en el santuario de Data Ganj Bakhsh en Lahore, cantaba con tanta frecuencia para el ejército que fue apodado el \"qawwal militar\", ostenta el récord del qawwali de mayor duración publicado comercialmente (unos 115 minutos), recibió el premio Pride of Performance en 1989 y falleció durante una gira de conciertos por Irán."
  fr: "Le qawwal pakistanais (1942-2000), surnommé l'empereur du qawwali, l'un des rares à écrire ses propres paroles; il a commencé au sanctuaire de Data Ganj Bakhsh à Lahore, a chanté si souvent pour l'armée qu'il a été surnommé le « qawwal militaire », détient le record du qawwali commercialisé le plus long (environ 115 minutes), a reçu le Pride of Performance en 1989 et est décédé lors d'une tournée de concerts en Iran."
  tr: "Pakistanlı bir kavvali (1942–2000), Shahanshah Qawwali lakaplı, qawvalilerinin sözlerini yazan az sayıdaki kişiden biriydi. Lahor'daki Data King Bakhsh'ın türbesinde başladı, ordu için şarkı söyledi ve hatta askeri qawwal lakabını aldı. En uzun ticari kavvali rekorunu elinde bulunduruyor (yaklaşık 115 dakika), 1989'da İyi Performans Madalyası aldı ve bir müzik turu sırasında İran'da vefat etti."
  id: "Seorang qawwali Pakistan (1942–2000), yang dijuluki Shahanshah Qawwali, adalah salah satu dari sedikit orang yang menulis lirik qawwali miliknya. Ia memulai karier di makam Data King Bakhsh di Lahore, bernyanyi untuk militer, dan bahkan dijuluki qawwali militer. Ia memegang rekor qawwali komersial terpanjang (sekitar 115 menit), menerima Medal of Good Performance pada tahun 1989, dan meninggal dunia di Iran saat tur musik."
