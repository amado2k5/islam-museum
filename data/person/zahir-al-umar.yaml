summary:
  ar: ظاهر بن عمر بن أبي زيدان، حاكم عكة وصفد في القرن الثاني عشر الهجري، يصفه الزركلي بأنه «داهية شجاع»؛ وُلد في صفد وخلف أباه عليها، وتحصن في طبرية حين قاتله سليمان باشا العظم والي دمشق سنة 1150هـ، ثم استقر في عكة وأحاطها بسور، وبسط حكمه على صيداء وحيفا ويافا والرملة وجبل نابلس وشرقي الأردن، إلى أن قُتل غدراً حين جهزت الدولة أسطولاً لاحتلال عكة {cite:alam-zirikli-1927-v2 p. 54} {cite:alam-zirikli-1927-v2 p. 55}.
  en: Zahir ibn Umar ibn Abi Zaydan, ruler of Acre and Safad in the twelfth Islamic century, whom al-Zirikli calls "a shrewd and brave man"; born in Safad, he succeeded his father there, withstood Sulayman Pasha al-Azm, governor of Damascus, at Tiberias in 1150 AH, then settled in Acre and walled it, extending his rule over Sidon, Haifa, Jaffa, Ramla, Jabal Nablus and Transjordan, until he was killed by treachery when the Ottoman state fitted out a fleet to take Acre.
  ur: ظاہر بن عمر بن ابی زیدان، بارہویں صدی ہجری میں عکہ اور صفد کے حاکم، جنہیں زرکلی «چالاک اور بہادر» کہتے ہیں؛ صفد میں پیدا ہوئے، والد کے جانشین بنے، 1150ھ میں دمشق کے والی سلیمان پاشا العظم کے مقابلے میں طبریہ میں قلعہ بند ہوئے، پھر عکہ میں جم گئے اور اس کی فصیل بنائی، اور صیدا، حیفا، یافا، رملہ، جبلِ نابلس اور شرقِ اردن تک حکومت پھیلائی، یہاں تک کہ جب حکومت نے عکہ پر قبضے کے لیے بیڑا تیار کیا تو دھوکے سے قتل کیے گئے۔
