summary:
  ar: "أبو محمد عبد السلام بن رغبانة بن عبد السلام بن حبيب الملقب ديك الجن، الشاعر المشهور؛ مولى لطيء أصله من أهل سلمية ومولده بحمص وتمّ أول من أسلم من أجداده؛ من شعراء الدولة العباسية لم يفارق الشام ولم يرحل إلى العراق ولا متصدياً لأحد؛ كان يتشيع تشيعاً حسناً وله مراث في الحسين؛ كان ماجناً خليعاً وشعره في غاية الجودة وله أخبار في مصارع العشاق {cite:wafayat-ayan}."
  en: "Dik al-Jinn (Abd al-Salam b. Raghaban, d. c. 235) — the celebrated Abbasid poet of Homs, a mawla of Tayyi' who never left Syria; author of Masari' al-Ushshaq; a tale of Abu Nuwas hunting him out in Homs survives {cite:wafayat-ayan}."
  es: "Dik al-Jinn (Abd al-Salam b. Raghaban, dc 235): el célebre poeta abasí de Homs, un mawla de Tayyi' que nunca abandonó Siria; autor de Masari' al-Ushshaq; sobrevive una historia de Abu Nuwa persiguiéndolo en Homs {cita:wafayat-ayan}."
  fr: "Dik al-Jinn (Abd al-Salam b. Raghaban, DC 235) — le célèbre poète abbasside de Homs, un mawla de Tayyi' qui n'a jamais quitté la Syrie; auteur de Masari' al-Ushshaq; une histoire selon laquelle Abu Nuwas le traquait à Homs survit {cite: wafayat-ayan}."
  ur: "دِک الجِن ⁦(عبدالسلام بن راغبان، ڈی سی 235)⁩ - حمص کا مشہور عباسی شاعر، طائی کا ایک مولا جس نے کبھی شام نہیں چھوڑا؛ مسری العشق کے مصنف؛ ابو نواس کی حمص میں اس کا شکار کرنے کی ایک کہانی زندہ ہے۔"
  tr: "Ebu Muhammed Abdül-Selam ibn Raghbana ibn Abd al-Salam ibn Habib, lakaplı Dik al-Jinn, ünlü şair; Lati kökenli, aslen Salamiye'den, Homs doğumlu bir özgür adamdı. Ataları arasında İslam'ı benimseyen ilk kişiydi; Abbasi devletinin şairlerinden biriydi, Levant'tan hiç ayrılmadı, Irak'a hiç gitmedi ve kimseye karşı çıkmadı. Dindar bir Şiiydi ve Hüseyin hakkında ağıtlar yazdı; dahiydi, ahlaksızdı ve şiirleri en yüksek kalitedeydi; âşıkların mücadeleleri hakkında hikayeleri vardır {atıf:wafayat-ayan}."
  id: "Abu Muhammad Abd al-Salam ibn Raghbana ibn Abd al-Salam ibn Habib, dijuluki Dik al-Jinn, penyair terkenal; seorang mantan Lati, berasal dari Salamiyah, lahir di Homs. Ia adalah yang pertama di antara leluhurnya yang memeluk Islam; ia adalah salah satu penyair negara Abbasiyah, tidak pernah meninggalkan Levant, tidak pernah pergi ke Irak, dan tidak pernah menentang siapa pun. Ia adalah seorang Syiah yang taat dan menulis elegi tentang Husayn; ia adalah jenius, tidak sopan, dan puisinya sangat berkualitas, serta memiliki kisah tentang perjuangan para kekasih {cite:wafayat-ayan}."
