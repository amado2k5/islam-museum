summary:
  ar: "أبو محمد عبد السلام بن رغبانة بن عبد السلام بن حبيب الملقب ديك الجن، الشاعر المشهور؛ مولى لطيء أصله من أهل سلمية ومولده بحمص وتمّ أول من أسلم من أجداده؛ من شعراء الدولة العباسية لم يفارق الشام ولم يرحل إلى العراق ولا متصدياً لأحد؛ كان يتشيع تشيعاً حسناً وله مراث في الحسين؛ كان ماجناً خليعاً وشعره في غاية الجودة وله أخبار في مصارع العشاق {cite:wafayat-ayan}."
  en: "Dik al-Jinn (Abd al-Salam b. Raghaban, d. c. 235) — the celebrated Abbasid poet of Homs, a mawla of Tayyi' who never left Syria; author of Masari' al-Ushshaq; a tale of Abu Nuwas hunting him out in Homs survives {cite:wafayat-ayan}."
