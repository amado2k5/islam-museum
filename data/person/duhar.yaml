label: { ar: "دوهر بن داهر", en: "Duhar ibn Dahir", es: "Duhar ibn Dahir", fr: "Duhar ibn Dahir", ur: "دہر ابن دہر" }
summary:
  ar: "دوهر بن داهر؛ خرج إلى محمد بن القاسم بالكيرج فقاتله فانهزم العدو وهرب ويقال قتل ونزل أهل المدينة على حكم محمد فقتل وسبى."
  en: "Duhar ibn Dahir; he sallied against Muhammad ibn al-Qasim at al-Kiraj, was routed, fled — some say was killed — and the city yielded on terms."
  es: "Duhar ibn Dahir; salió en salida contra Muhammad ibn al-Qasim en al-Kiraj, fue derrotado, huyó —algunos dicen que fue asesinado— y la ciudad se rindió bajo ciertas condiciones."
  fr: "Duhar ibn Dahir; il lança une attaque contre Muhammad ibn al-Qasim à al-Kiraj, fut mis en déroute, s'enfuit — certains disent qu'il fut tué — et la ville se rendit à ses conditions."
  ur: "دہر ابن دہر؛ اس نے الکراج میں محمد بن القاسم کے خلاف حملہ کیا، مارا گیا، بھاگ گیا - کچھ کہتے ہیں کہ مارا گیا - اور شہر نے شرائط پر نتیجہ اخذ کیا۔"
  tr: "Duhar bin Dahir; el-Kiraj'da Muhammed bin el-Kasım'a gitti, onunla savaştı ve düşman yenildi ve kaçtı. Söylenir ki öldürüldü ve Medine halkı Muhammed'in yönetimi altına girdi, burada öldürüldü ve esir alındı."
  id: "Duhar ibn Dahir; ia pergi menemui Muhammad ibn al-Qasim di al-Kiraj, melawannya, dan musuh dikalahkan serta melarikan diri. Dikatakan ia dibunuh, dan rakyat Madinah berada di bawah pemerintahan Muhammad, di mana ia dibunuh dan ditangkap."
