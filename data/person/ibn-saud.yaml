summary:
  ar: "عبد العزيز بن عبد الرحمن بن فيصل آل سعود، المعروف بابن سعود وكنيته أبو تركي (وُلد في الرياض في 15 يناير 1876 – توفي في الطائف في 9 نوفمبر 1953)، مؤسس المملكة العربية السعودية وأول ملوكها. عاش مع أسرته منفيًا في الكويت نحو عقد بعد سقوط الدولة السعودية الثانية، ثم انطلق منها فاسترد الرياض سنة 1902 ووحّد نجدًا وحائل والأحساء، وأسس حركة الإخوان، ثم غزا الحجاز فأسقط مملكة الهاشميين سنة 1925، وأُعلن ملكًا على الحجاز ونجد، حتى صدر المرسوم بتوحيد البلاد باسم المملكة العربية السعودية في 23 سبتمبر 1932. وفي عهده اكتُشف النفط سنة 1938 وبدأ إنتاجه الكبير بعد الحرب العالمية الثانية، والتقى الرئيس روزفلت سنة 1945، وخلّف أبناء كثيرين منهم جميع ملوك السعودية اللاحقين."
  en: "Abdulaziz bin Abdul Rahman bin Faisal Al Saud, known as Ibn Saud and by his kunya Abu Turki (born at Riyadh on 15 January 1876 – died at Taif on 9 November 1953), was the founder and first King of Saudi Arabia. Exiled with his family to Kuwait for nearly a decade after the fall of the second Saudi state, he set out from there and recaptured Riyadh in 1902, unified Nejd, Ha'il and al-Ahsa, founded the Ikhwan movement, then conquered the Hejaz and ended the Hashemite kingdom in 1925 and was proclaimed King of the Hejaz and of Nejd, until the decree of 23 September 1932 united the realm as the Kingdom of Saudi Arabia. In his reign oil was discovered in 1938 and large-scale production began after the Second World War; he met President Roosevelt in 1945; and his many sons include all the subsequent kings of Saudi Arabia."
  ur: "عبد العزیز بن عبد الرحمن آل سعود، المعروف ابن سعود، کنیت ابو ترکی (ولادت: ریاض، 15 جنوری 1876ء – وفات: طائف، 9 نومبر 1953ء)، مملکتِ سعودی عرب کے بانی اور پہلے بادشاہ تھے۔ خاندان کے ساتھ کویت میں جلاوطنی کے بعد انہوں نے 1902ء میں ریاض واپس لیا، نجد و حجاز کو متحد کیا، اور 23 ستمبر 1932ء کو مملکت کا اعلان ہوا۔ ان کے عہد میں 1938ء میں تیل دریافت ہوا۔"
