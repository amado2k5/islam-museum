summary:
  ar: "عبد العزيز بن عبد الرحمن بن فيصل آل سعود، المعروف بابن سعود وكنيته أبو تركي ⁦(وُلد في الرياض في 15 يناير 1876 – توفي في الطائف في 9 نوفمبر 1953)⁩، مؤسس المملكة العربية السعودية وأول ملوكها. عاش مع أسرته منفيًا في الكويت نحو عقد بعد سقوط الدولة السعودية الثانية، ثم انطلق منها فاسترد الرياض سنة 1902 ووحّد نجدًا وحائل والأحساء، وأسس حركة الإخوان، ثم غزا الحجاز فأسقط مملكة الهاشميين سنة 1925، وأُعلن ملكًا على الحجاز ونجد، حتى صدر المرسوم بتوحيد البلاد باسم المملكة العربية السعودية في 23 سبتمبر 1932. وفي عهده اكتُشف النفط سنة 1938 وبدأ إنتاجه الكبير بعد الحرب العالمية الثانية، والتقى الرئيس روزفلت سنة 1945، وخلّف أبناء كثيرين منهم جميع ملوك السعودية اللاحقين."
  en: "Abdulaziz bin Abdul Rahman bin Faisal Al Saud, known as Ibn Saud and by his kunya Abu Turki (born at Riyadh on 15 January 1876 – died at Taif on 9 November 1953), was the founder and first King of Saudi Arabia. Exiled with his family to Kuwait for nearly a decade after the fall of the second Saudi state, he set out from there and recaptured Riyadh in 1902, unified Nejd, Ha'il and al-Ahsa, founded the Ikhwan movement, then conquered the Hejaz and ended the Hashemite kingdom in 1925 and was proclaimed King of the Hejaz and of Nejd, until the decree of 23 September 1932 united the realm as the Kingdom of Saudi Arabia. In his reign oil was discovered in 1938 and large-scale production began after the Second World War; he met President Roosevelt in 1945; and his many sons include all the subsequent kings of Saudi Arabia."
  ur: "عبد العزیز بن عبد الرحمن آل سعود، المعروف ابن سعود، کنیت ابو ترکی ⁦(ولادت: ریاض، 15 جنوری 1876ء – وفات: طائف، 9 نومبر 1953ء)⁩، مملکتِ سعودی عرب کے بانی اور پہلے بادشاہ تھے۔ خاندان کے ساتھ کویت میں جلاوطنی کے بعد انہوں نے 1902ء میں ریاض واپس لیا، نجد و حجاز کو متحد کیا، اور 23 ستمبر 1932ء کو مملکت کا اعلان ہوا۔ ان کے عہد میں 1938ء میں تیل دریافت ہوا۔"
  es: "Abdulaziz bin Abdul Rahman bin Faisal Al Saud, conocido como Ibn Saud y por su kunya Abu Turki (nacido en Riad el 15 de enero de 1876 y fallecido en Taif el 9 de noviembre de 1953), fue el fundador y primer rey de Arabia Saudí. Exiliado con su familia en Kuwait durante casi una década tras la caída del segundo estado saudí, partió desde allí y reconquistó Riad en 1902, unificó Nejd, Ha'il y Al-Ahsa, fundó el movimiento Ikhwan, conquistó el Hiyaz y puso fin al reino hachemita en 1925, siendo proclamado rey del Hiyaz y de Nejd, hasta que el decreto del 23 de septiembre de 1932 unificó el reino como el Reino de Arabia Saudí. Durante su reinado se descubrió petróleo en 1938 y la producción a gran escala comenzó después de la Segunda Guerra Mundial; se reunió con el presidente Roosevelt en 1945; y entre sus numerosos hijos se encuentran todos los reyes posteriores de Arabia Saudí."
  fr: "Abdulaziz bin Abdul Rahman bin Faisal Al Saud, connu sous le nom d'Ibn Saud et sous son nom de naissance Abu Turki (né à Riyad le 15 janvier 1876 – décédé à Taïf le 9 novembre 1953), fut le fondateur et le premier roi d'Arabie saoudite. Exilé avec sa famille au Koweït pendant près de dix ans après la chute du second État saoudien, il partit de là et reconquit Riyad en 1902, unifia le Nejd, Haïl et al-Ahsa, fonda le mouvement des Frères musulmans, puis conquit le Hedjaz et mit fin au royaume hachémite en 1925. Il fut alors proclamé roi du Hedjaz et du Nejd, titre qu'il conserva jusqu'au 23 septembre 1932, date à laquelle le décret unifia le territoire en un seul royaume d'Arabie saoudite. Sous son règne, le pétrole fut découvert en 1938 et sa production à grande échelle commença après la Seconde Guerre mondiale. Il rencontra le président Roosevelt en 1945 et compte parmi ses nombreux fils tous les rois d'Arabie saoudite qui lui ont succédé."
  tr: "Abdulaziz bin Abdulrahman bin Faysal Al Saud, İbn Saud ve kunyası Abu Turki olarak bilinir (15 Ocak 1876'da Riyad'da doğdu – 9 Kasım 1953'te Taif'te öldü), Suudi Arabistan Krallığı'nın kurucusu ve ilk kralıydı. İkinci Suudi Devleti'nin çöküşünden sonra yaklaşık on yıl boyunca ailesiyle birlikte sürgünde Kuveyt'te yaşadı, ardından oradan ayrıldı, 1902'de Riyad'ı geri aldı, Necd, Hail ve El-Ahsa'yı birleştirdi, Müslüman Kardeşler'i kurdu, ardından Hicaz'ı işgal edip 1925'te Haşimi Krallığı'nı devirdi, kendisini Hicaz ve Necd kralı ilan etti; ta ki 23 Eylül 1932'de ülkeyi birleştiren kararname Suudi Arabistan Krallığı adı altında çıkarılana kadar. Onun saltanatı sırasında, 1938'de petrol keşfedildi ve II. Dünya Savaşı'ndan sonra büyük ölçekli üretime başlandı. 1945'te Başkan Roosevelt ile tanıştı ve geride Suudi Arabistan'ın sonraki tüm kralları da dahil olmak üzere birçok oğlu bıraktı."
  id: "Abdulaziz bin Abdulrahman bin Faisal Al Saud, yang dikenal sebagai Ibn Saud dan kunya-nya Abu Turki (lahir di Riyadh pada 15 Januari 1876 – meninggal di Taif pada 9 November 1953), adalah pendiri Kerajaan Arab Saudi dan raja pertamanya. Ia tinggal bersama keluarganya dalam pengasingan di Kuwait selama sekitar satu dekade setelah jatuhnya Negara Saudi Kedua, lalu meninggalkan sana, merebut kembali Riyadh pada tahun 1902, menyatukan Najd, Hail, dan Al-Ahsa, mendirikan Ikhwanul Muslimin, kemudian menyerbu Hejaz dan menggulingkan Kerajaan Hasyemit pada tahun 1925, menyatakan dirinya raja Hejaz dan Najd, hingga dekret penyatuan negara dikeluarkan dengan nama Kerajaan Arab Saudi pada 23 September 1932. Selama masa pemerintahannya, minyak ditemukan pada tahun 1938 dan mulai diproduksi secara besar-besaran setelah Perang Dunia II. Ia bertemu Presiden Roosevelt pada tahun 1945 dan meninggalkan banyak putra, termasuk semua raja Arab Saudi yang kemudian hadir."
