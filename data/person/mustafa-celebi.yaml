summary:
  ar: "بطاقة أولية لمصطفى جلبي المعروف بدزمجه مصطفى ⁦(مصطفى الكاذب)⁩، من ادعى أنه شهزاد عثماني في زمن محمد الأول ونازع على العرش فأُعدم سنة ١٤٢٢م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Mustafa Celebi, 'Duzmece Mustafa' ('False Mustafa'), the pretender claiming to be an Ottoman prince who contested Mehmed I and was executed in 1422; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Mustafa Celebi, 'Duzmece Mustafa' ('Falso Mustafa'), el pretendiente que afirmaba ser un príncipe otomano que disputó el trono a Mehmed I y fue ejecutado en 1422; la entrada de origen aún no ha sido verificada en la página."
  fr: "Fiche de conscription de Mustafa Celebi, « Duzmece Mustafa » (« Faux Mustafa »), le prétendant se disant prince ottoman qui a contesté le trône de Mehmed Ier et a été exécuté en 1422; la source n'est pas encore vérifiée sur la page."
  ur: "مصطفیٰ سیلبی کے لیے ڈرافٹ کارڈ، 'دزمیس مصطفی' ⁦('جھوٹا مصطفیٰ')⁩، ایک عثمانی شہزادہ ہونے کا دعویٰ کرنے والا جس نے محمود اول کا مقابلہ کیا اور اسے 1422 میں پھانسی دے دی گئی۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Mustafa Çelebi, Yalancı Mustafa (Yalancı Mustafa) olarak bilinir; kendisini Mehmed I döneminde Osmanlı prensi ve taht için rakip olarak iddia eden ve 1422 yılında idam edilmişti; Osmanlı tarih kitaplarında kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Mustafa Çelebi, yang dikenal sebagai Mustafa si Pembohong (Mustafa si Pembohong), yang mengaku sebagai pangeran Ottoman pada masa Mehmed I dan pesaing takhta serta dieksekusi pada tahun 1422 M; Buku sejarah Ottoman menyebutkannya dan biografinya belum diulas di halaman."
