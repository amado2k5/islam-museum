summary:
  ar: "مهاجم عراقي وُلد سنة 1983 في الدبس بمحافظة كركوك، قاد منتخب العراق إلى لقبه الوحيد في كأس آسيا سنة 2007 مسجلاً هدف الفوز في النهائي ونال جائزة أفضل لاعب في البطولة، ولعب لأندية في العراق والإمارات وقطر أطولها الغرافة، واعتزل سنة 2016."
  en: "Iraqi striker, born in 1983 in Dibis, Kirkuk Governorate, who captained Iraq to its only AFC Asian Cup title in 2007, scoring the winning goal in the final and winning the tournament's most valuable player award. He played club football in Iraq, the Emirates and Qatar — longest with Al-Gharafa — and retired in 2016."
  ur: "عراقی اسٹرائیکر، 1983 میں محافظہ کرکوک کے الدبس میں پیدا ہوئے، جنہوں نے 2007 میں عراق کی قیادت کرتے ہوئے اسے اس کا واحد اے ایف سی ایشیائی کپ خطاب دلایا، فائنل میں جیت کا گول کیا اور ٹورنامنٹ کے بہترین کھلاڑی کا اعزاز حاصل کیا۔ انہوں نے عراق، امارات اور قطر کے کلبوں کے لیے کھیلا — سب سے طویل عرصہ الغرافہ کے ساتھ — اور 2016 میں ریٹائر ہوئے۔"
