summary:
  ar: "علوي خلف أخاه يوسف بن إسماعيل على مكة بعد موته سنة اثنتين وخمسين ومائتين وهو أسن منه بعشرين سنة، فنال الناس بسببه جهد شديد، فبعث المعتز أبا الساج الأشروسي إلى الحجاز فهرب محمد بن يوسف وقتل خلق من أصحابه {cite:muruj-al-dhahab p. 551}."
  en: "The Alid who ruled Mecca after his brother until Abu l-Saj al-Ashrusi drove him out {cite:muruj-al-dhahab p. 551}."
  es: "El Alid que gobernó La Meca después de su hermano hasta que Abu l-Saj al-Ashrusi lo expulsó {cite:muruj-al-dhahab p. 551}."
  fr: "L'Alide qui gouverna La Mecque après son frère jusqu'à ce qu'Abu l-Saj al-Ashrusi le chasse {cite:muruj-al-dhahab p. 551}."
  ur: "علید جس نے اپنے بھائی کے بعد مکہ پر حکمرانی کی یہاں تک کہ ابو السج العشروسی نے اسے نکال باہر کیا۔ 551}۔"
  tr: "Alavi, kardeşi Yusuf bin İsmail'in ölümünden sonra, 252 H. yılında, yirmi yaş büyükken Mekke'nin hükümdarı oldu. Halk onun yüzünden büyük acılar çekti. El-Mu'tazz, Ebu el-Sâj el-Aşhurusi'yi Hicaz'a gönderdi; Muhammed bin Yusuf oradan kaçtı ve bazı yoldaşları öldürüldü. {Kaynak:Muruj-al-Dhahab, s. 551}."
  id: "Alawi menggantikan saudaranya Yusuf ibn Ismail sebagai penguasa Mekah setelah kematiannya pada tahun 252 H, ketika ia berusia dua puluh tahun lebih tua. Orang-orang sangat menderita karena dirinya. Al-Mu'tazz mengirim Abu al-Saj al-Ashurusi ke Hijaz, di mana Muhammad ibn Yusuf melarikan diri dan beberapa sahabatnya terbunuh. {cite:Muruj-al-Dhahab, hlm. 551}."
