summary:
  ar: "داعية وصانع محتوى مصري، عُرف بمقاطع قصيرة أسبوعية في موضوعات دينية واجتماعية موجّهة إلى الشباب، وبمشاركته في بودكاست «إيه المشكلة؟» مع أمير منير ومحمد الغليظ، وأسّس منصة «أوتاد» لتعليم صناعة المحتوى الرقمي."
  en: "Egyptian preacher and content creator, known for short weekly videos on religious and social topics addressed to young people, for his part in the Eh El-Moshkla? podcast with Amir Mounir and Mohamed Elghaleez, and for founding Awtad, a platform teaching digital content creation."
  ur: "مصری مبلغ اور مواد ساز، جو نوجوانوں کے لیے دینی و سماجی موضوعات پر مختصر ہفتہ وار ویڈیوز، امیر منیر اور محمد الغلیظ کے ساتھ پوڈکاسٹ «ایہ المشکلہ؟» میں شرکت، اور ڈیجیٹل مواد سازی سکھانے والے پلیٹ فارم «اوتاد» کی بنیاد کے لیے جانے جاتے ہیں۔"
  es: "Predicador y creador de contenido egipcio, conocido por sus breves vídeos semanales sobre temas religiosos y sociales dirigidos a los jóvenes, por su participación en el podcast Eh El-Moshkla? con Amir Mounir y Mohamed Elghaleez, y por fundar Awtad, una plataforma para la enseñanza de la creación de contenido digital."
  fr: "Prédicateur et créateur de contenu égyptien, connu pour ses courtes vidéos hebdomadaires sur des sujets religieux et sociaux destinées aux jeunes, pour sa participation au podcast Eh El-Moshkla? avec Amir Mounir et Mohamed Elghaleez, et pour avoir fondé Awtad, une plateforme d'enseignement de la création de contenu numérique."
  tr: "Mısırlı bir vaiz ve içerik üreticisi, gençlere yönelik dini ve sosyal konularda haftalık kısa kliplerle, Amir Mounir ve Mohamed Al-Ghaliz ile \"What's the Trouble?\" podcast'ine katılmasıyla ve dijital içerik üretimini öğretmek için \"Awtad\" platformunu kurmasıyla tanınır."
  id: "Seorang pengkhotbah dan pembuat konten asal Mesir, dikenal lewat klip mingguan singkat tentang topik keagamaan dan sosial yang ditujukan untuk pemuda, serta berpartisipasi dalam podcast \"What's the Problem?\" bersama Amir Mounir dan Mohamed Al-Ghaliz, serta mendirikan platform \"Awtad\" untuk pengajaran pembuatan konten digital."
