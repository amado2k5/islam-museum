summary:
  ar: "عابدة من أهل الكوفة يذكرها ابن الجوزي في «صفة الصفوة» تحت «عقلاء المجانين المتعبدات الكوفيات»، ويروي عن عبد الواحد بن زيد أنه رأى في منامه أن رفيقه في الجنة ميمونة السوداء، فوجدها بالكوفة ترعى غنيمات يعدّها الناس مجنونة، والذئاب مع الغنم لا تعدو عليها."
  en: "A devout woman of Kufa whom Ibn al-Jawzi places in Sifat al-Safwa among 'the wise fools, devout women of Kufa'. He relates from Abd al-Wahid ibn Zayd that he saw in a dream that his companion in Paradise would be Maymuna al-Sawda', and found her in Kufa, thought mad by the people, herding a few sheep among which wolves grazed without harming them."
