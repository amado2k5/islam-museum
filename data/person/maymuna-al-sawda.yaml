gender: female
roles: [mystic]
summary:
  ar: "عابدة من أهل الكوفة يذكرها ابن الجوزي في «صفة الصفوة» تحت «عقلاء المجانين المتعبدات الكوفيات»، ويروي عن عبد الواحد بن زيد أنه رأى في منامه أن رفيقه في الجنة ميمونة السوداء، فوجدها بالكوفة ترعى غنيمات يعدّها الناس مجنونة، والذئاب مع الغنم لا تعدو عليها."
  en: "A devout woman of Kufa whom Ibn al-Jawzi places in Sifat al-Safwa among 'the wise fools, devout women of Kufa'. He relates from Abd al-Wahid ibn Zayd that he saw in a dream that his companion in Paradise would be Maymuna al-Sawda', and found her in Kufa, thought mad by the people, herding a few sheep among which wolves grazed without harming them."
  es: "Una mujer devota de Kufa a quien Ibn al-Jawzi incluye en Sifat al-Safwa entre \"las sabias locas, mujeres devotas de Kufa\". Relata de Abd al-Wahid ibn Zayd que vio en un sueño que su compañera en el Paraíso sería Maymuna al-Sawda', y la encontró en Kufa, considerada loca por la gente, pastoreando unas pocas ovejas entre las que pastaban los lobos sin hacerles daño."
  fr: "Une femme pieuse de Koufa, qu'Ibn al-Jawzi place dans le Sifat al-Safwa parmi les « sages folles, femmes pieuses de Koufa ». Il rapporte d'après Abd al-Wahid ibn Zayd que celui-ci vit en rêve que sa compagne au Paradis serait Maymuna al-Sawda', et la trouva à Koufa, que les gens croyaient folle, gardant quelques moutons parmi lesquels paissaient des loups sans leur faire de mal."
  ur: "کوفہ کی ایک متقی عورت جسے ابن الجوزی نے صفات الصفوی میں 'عقلمند احمقوں، کوفہ کی متقی خواتین' میں شمار کیا ہے۔ وہ عبد الواحد بن زید سے روایت کرتے ہیں کہ انہوں نے خواب میں دیکھا کہ جنت میں ان کی ساتھی میمونہ السودہ ہوں گی، اور انہیں کوفہ میں پایا، لوگوں کو دیوانہ بنا، چند بھیڑیں چرا رہے تھے جن کے درمیان بھیڑیے انہیں کوئی نقصان نہیں پہنچاتے تھے۔"
  tr: "Kufe halkından bir tapınan, İbn al-Jawzi tarafından 'Sifat al-Safwa' adlı eserde 'Kufe'nin Bilge Deli Tapınanları' bölümünde bahsedilmiştir. Abd al-Wahid ibn Zayd'den, bir rüyada cennetteki yoldaşının Mimoona al-Sauda olduğunu gördüğünü ve onu Kufe'de insanların deli saydığı ganimetleri otarken, kurtlar ve koyunların ona saldırmadığını anlatır."
  id: "Seorang penyembah dari masyarakat Kufa, disebutkan oleh Ibn al-Jawzi dalam 'Sifat al-Safwa' di bawah 'Para Penyembah Gila Bijaksana Kufa'. Ia menceritakan dari Abd al-Wahid ibn Zayd bahwa ia melihat dalam mimpi bahwa temannya di Surga adalah Mimoona al-Sauda, dan menemukannya di Kufa menggembalakan rampasan yang dianggap gila, dan serigala serta domba tidak menyerangnya."
