label:
  ar: "محمد الفقيه اليونيني"
  en: "Muhammad al-Faqih al-Yunini"
  es: "Muhammad al-Faqih al-Yunini"
  fr: "Muhammad al-Faqih al-Yunini"
  ur: "محمد الفقہاء الینینی"
roles: [scholar, muhaddith]
gender: male
summary:
  ar: "محمد بن أحمد بن عبد الله، أبو عبد الله، تقي الدين اليونيني، حافظ للحديث حنبلي، ولد في يونين وتوفي في بعلبك، وكان مقربا من الأشرف والكامل، وهو أبو المؤرخ قطب الدين موسى {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 322}."
  en: "Muhammad ibn Ahmad ibn Abd Allah, Abu Abd Allah, Taqi al-Din al-Yunini, a Hanbali hadith hafiz born at Yunin who died in Baalbek; he was close to al-Ashraf and al-Kamil and was the father of the historian Qutb al-Din Musa {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 322}."
  es: "Muhammad ibn Ahmad ibn Abd Allah, Abu Abd Allah, Taqi al-Din al-Yunini, un hafiz de hadices hanbalí nacido en Yunin que murió en Baalbek; fue cercano a al-Ashraf y al-Kamil y fue el padre del historiador Qutb al-Din Musa {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 322}."
  fr: "Muhammad ibn Ahmad ibn Abd Allah, Abu Abd Allah, Taqi al-Din al-Yunini, un hafiz de hadith hanbalite né à Yunin et mort à Baalbek; il était proche d'al-Ashraf et d'al-Kamil et était le père de l'historien Qutb al-Din Musa {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 322}."
  ur: "محمد بن احمد بن عبد اللہ، ابو عبد اللہ، تقی الدین الیوینی، حنبلی حدیث کے حافظ یونین میں پیدا ہوئے جو بعلبیک میں فوت ہوئے۔ وہ اشرف اور الکامل کے قریب تھے اور مورخ قطب الدین موسیٰ کے والد تھے۔ 5ص 322}۔"
  tr: "Muhammed ibn Ahmed ibn Abdullah, Ebu Abdullah, Taqi al-Din al-Yunini, bir Hanbali hadis ezbercisi, Yunine'de doğmuş ve Baalbek'te ölmüştür. El-Eşref ve el-Kamil ile yakındı ve tarihçi Kutb el-Din Musa'nın babasıdır {cite:alam-zirikli-dar-al-ilm-2002 cilt 5, s. 322}."
  id: "Muhammad ibn Ahmad ibn Abdullah, Abu Abdullah, Taqi al-Din al-Yunini, seorang penghafal hadis Hanbali, lahir di Yunine dan meninggal di Baalbek. Ia dekat dengan al-Ashraf dan al-Kamil, dan ia adalah ayah dari sejarawan Qutb al-Din Musa {cite:alam-zirikli-dar-al-ilm-2002 vol. 5, hlm. 322}."
