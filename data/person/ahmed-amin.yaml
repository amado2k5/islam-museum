summary:
  ar: "مفكر ومؤرخ وأديب مصري ⁦(1886–1954)⁩، من روّاد التأليف الحديث في تاريخ الحضارة الإسلامية. صاحب سلسلة «فجر الإسلام» و«ضحى الإسلام» و«ظهر الإسلام» و«يوم الإسلام»، ومذكراته «حياتي»، ورأس تحرير مجلة الثقافة وعمل في القضاء الشرعي والجامعة."
  en: "Egyptian thinker, historian and man of letters (1886–1954), a pioneer of modern authorship on Islamic civilisation. Author of the series Fajr al-Islam, Duha al-Islam, Zuhr al-Islam and Yawm al-Islam, and the memoir Hayati (My Life); he edited the journal Al-Thaqafa and worked in the sharia judiciary and the university."
  ur: "مصری مفکر، مورخ اور ادیب ⁦(1886–1954)⁩ جو اسلامی تہذیب کی تاریخ پر جدید تصنیف کے بانیوں میں ہیں۔ ان کی سلسلہ میں «فجر الاسلام»، «ضحی الاسلام»، «ظہر الاسلام» اور «یوم الاسلام» اور سوانح «حیاتی» شامل ہیں؛ وہ مجلہ الثقافہ کے مدیر رہے اور شرعی قضاء اور جامعہ میں کام کیا۔"
