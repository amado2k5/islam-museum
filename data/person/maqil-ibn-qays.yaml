id: person/maqil-ibn-qays
class: person
label: { ar: "معقل بن قيس الرياحي", en: "Ma'qil ibn Qays al-Riyahi", es: "Ma'qil ibn Qays al-Riyahi", fr: "Ma'qil ibn Qays al-Riyahi", ur: "معقل بن قیس الریحی" }
summary:
  ar: "معقل بن قيس من أمراء علي بن أبي طالب؛ لما كتب زياد بن خصفة إلى علي بخبر الخرّيت قام معقل فقال: يا أمير المؤمنين كان ينبغي أن يكون مع من يطلب هؤلاء مكان كل واحد منهم عشرة، فإن العدة تصبر للعدة، فندبه علي مع ألفين من أهل الكوفة وأمّره على جيش ضم ألفين من أهل البصرة {cite:kamil-ibn-al-athir p. 716}."
  en: "Ali's commander who demanded ten-for-one odds against the Khirit rebels — 'an equal number will surely stand firm for them' — and led the four-thousand-man Kufa–Basra expedition into Ahwaz {cite:kamil-ibn-al-athir p. 716}."
  es: "El comandante de Ali, que exigió una ventaja de diez a uno contra los rebeldes Khirit —«un número igual seguramente se mantendrá firme a su favor»— y dirigió la expedición de cuatro mil hombres de Kufa a Basora, en Ahwaz {cite:kamil-ibn-al-athir p. 716}."
  fr: "Le commandant d'Ali qui exigea un rapport de force de dix contre un contre les rebelles khirits — « un nombre égal se tiendra sûrement à leurs côtés » — et mena l'expédition de quatre mille hommes de Kufa à Bassora dans Ahwaz {cite:kamil-ibn-al-athir p. 716}."
  ur: "علی کے کمانڈر نے جس نے خریت باغیوں کے خلاف ایک کے بدلے دس مشکلات کا مطالبہ کیا تھا - 'ایک برابر تعداد یقینا ان کے لئے ثابت قدم رہے گی' - اور اہواز میں چار ہزار افراد پر مشتمل کوفہ-بصرہ مہم کی قیادت کی۔ 716}۔"
  tr: "Ali ibn Ebi Talib'in komutanlarından biri olan Ma'qil ibn Qays; Ziyad bin Haşfa Ali'ye Al-Kharit haberini yazdığında, Ma'qil ayağa kalktı ve şöyle dedi: Ey Müminlerin Komutanı, bu arayanlarla birlikte on kişi yerine olmalıydı, çünkü bekleme süresi bekleme süresi için yeterlidir. Ali, onu Kufa'dan iki bin kişiyle görevlendirdi ve Basra'dan iki bin kişiden oluşan bir orduya komuta etmesini emretti {cite:kamil-ibn-al-athir s. 716}."
  id: "Ma'qil ibn Qays, salah satu komandan Ali ibn Abi Talib; ketika Ziyad ibn Khasfa menulis kepada Ali dengan kabar Al-Kharit, Ma'qil berdiri dan berkata: Wahai Panglima Orang Beriman, seharusnya mereka yang mencari ini menggantikan sepuluh orang masing-masing, karena waktu tunggu sudah cukup untuk masa tunggu. Ali menugaskannya dengan dua ribu orang dari Kufa dan memerintahkannya memimpin pasukan yang terdiri dari dua ribu orang dari Basra {cite:kamil-ibn-al-athir hlm. 716}."
