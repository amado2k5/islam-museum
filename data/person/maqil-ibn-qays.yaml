summary:
  ar: "معقل بن قيس من أمراء علي بن أبي طالب؛ لما كتب زياد بن خصفة إلى علي بخبر الخرّيت قام معقل فقال: يا أمير المؤمنين كان ينبغي أن يكون مع من يطلب هؤلاء مكان كل واحد منهم عشرة، فإن العدة تصبر للعدة، فندبه علي مع ألفين من أهل الكوفة وأمّره على جيش ضم ألفين من أهل البصرة {cite:kamil-ibn-al-athir p. 716}."
  en: "Ali's commander who demanded ten-for-one odds against the Khirit rebels — 'an equal number will surely stand firm for them' — and led the four-thousand-man Kufa–Basra expedition into Ahwaz {cite:kamil-ibn-al-athir p. 716}."
