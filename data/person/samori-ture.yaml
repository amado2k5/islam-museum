    note: "No two independent sources name a school for him, so he is left unclassified (doubt rule). What each source gives: the English article's lead describes him as 'a deeply religious Muslim of the Maliki school of fiqh of Sunni Islam' — the sentence is uncited at that point, and it is the only edition that names a school in its own words. The Arabic article repeats the same sentence in translation from the English, so it is not an independent attestation. The French article — the longest of the four, resting on the French Africanist scholarship — gives his religion in its infobox as Islam, generically, and narrates his Islamising statecraft at length without ever naming a madhhab. The German article attributes his state to the ideology of Islam and names no school. Wikidata records Islam (Q432) only. His personal practice as the sources give it — conversion to Islam in his youth in the service of the Cissé, study under the Mauritanian teacher Sidiki Cherif, the Almamy title, and his enforcement of Islam as state religion from 1884 — is public practice and state policy, which by the lane rule never counts as a school attestation. The Maliki affiliation named by the English lead is therefore recorded here as a single-source claim, not as a value."
