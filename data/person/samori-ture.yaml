summary:
  ar: "مؤسس إمبراطورية واسولو في غرب أفريقيا (ح. 1830-1900) وحاكمها بلقب الإمام الأعلى (ألمامي). اعتنق الإسلام في شبابه، وبنى دولة امتدت عبر أجزاء من غينيا ومالي وسيراليون وساحل العاج الحالية، وأعلن الإسلام دينها الرسمي سنة 1884 وفرض تطبيقه، وقاوم التوسع الاستعماري الفرنسي ست عشرة سنة حتى أُسر سنة 1898 ونُفي إلى الغابون حيث توفي سنة 1900."
  en: "Founder of the Wassoulou Empire in West Africa (c. 1830–1900) and its ruler with the title Almamy (imam). He embraced Islam as a young man, built a state spanning parts of present-day Guinea, Mali, Sierra Leone and Côte d'Ivoire, proclaimed Islam its state religion in 1884 and enforced its practice, and resisted French colonial expansion for sixteen years until his capture in 1898; he died in exile in Gabon in 1900."
  ur: "مغربی افریقا میں سلطنتِ واسولو کے بانی (تقریباً 1830-1900) اور «المامی» (امام) کے لقب سے اس کے حکمران۔ انہوں نے جوانی میں اسلام قبول کیا، موجودہ گنی، مالی، سیرالیون اور آئیوری کوسٹ کے علاقوں پر مشتمل ریاست بنائی، 1884 میں اسلام کو اس کا سرکاری دین قرار دیا اور اس کے نفاذ کی نگرانی کی، اور فرانسیسی استعمار کے خلاف سولہ برس مزاحمت کی حتیٰ کہ 1898 میں گرفتار ہوئے؛ 1900 میں گبون میں جلاوطنی کے دوران وفات پائی۔"
