label:
  ar: صعصعة بن جعفر الهمداني
  en: Sa'sa'a ibn Ja'far of Hamdan
  ur: صعصعہ بن جعفر ہمدانی
summary:
  ar: رجل من همدان حالف على الهادي قرب بيت ذخار، ثم قاتله بريدة ومعه أهل قدم وغيرهم فهزمهم الهادي سنة 288هـ.
  en: A man of Hamdan who allied against al-Hadi near Bayt Dhukhar and then fought him at Raydah with the people of Qudum and others, whom al-Hadi routed in 288 AH.
  ur: ہمدان کا ایک شخص جس نے بیت ذخار کے قریب ہادی کے خلاف عہد باندھا اور پھر قدم کے لوگوں اور دوسروں کے ساتھ ریدہ میں ان سے جنگ کی، اور ہادی نے 288ھ میں انہیں شکست دی۔
