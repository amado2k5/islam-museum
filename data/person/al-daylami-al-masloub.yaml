summary:
  ar: "الديلمي المأسور المصلوب، لقب لشخص لم يُذكر اسمه في الخبر. أسرته الروم في غزوة وصلبوه على الدقل، فلما نزل به المسلمون من الدقل طلب الماء، وأخبر عن رؤيا رآها وهو مصلوب، وروى الخبر الوليد بن مسلم."
  en: "al-Daylami, the captive crucified, a laqab for a person whose name the report does not give. Captured by the Romans in a raid and crucified on a mast, he was brought down by the Muslims when they took the ship; he asked for water to pour over him, and described a vision he had while on the mast; al-Walid ibn Muslim relates the report."
  ur: "دیلمی مأسور مصلوب، ایک ایسے شخص کا لقب جس کا نام روایت میں نہیں دیا گیا۔ ایک غزوہ میں رومیوں نے انہیں قید کر کے مستول پر سولی دی، پھر مسلمانوں نے کشتی پر قبضہ کیا تو انہیں مستول سے اتارا گیا؛ انہوں نے پانی مانگا، اور اس رؤیا کا ذکر کیا جو سولی پر انہیں نظر آئی۔ یہ روایت ولید بن مسلم نے نقل کی۔"
