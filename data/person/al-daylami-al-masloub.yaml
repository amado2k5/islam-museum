summary:
  ar: "الديلمي المأسور المصلوب، لقب لشخص لم يُذكر اسمه في الخبر. أسرته الروم في غزوة وصلبوه على الدقل، فلما نزل به المسلمون من الدقل طلب الماء، وأخبر عن رؤيا رآها وهو مصلوب، وروى الخبر الوليد بن مسلم."
  en: "al-Daylami, the captive crucified, a laqab for a person whose name the report does not give. Captured by the Romans in a raid and crucified on a mast, he was brought down by the Muslims when they took the ship; he asked for water to pour over him, and described a vision he had while on the mast; al-Walid ibn Muslim relates the report."
  fr: "Al-Daylami, le captif crucifié, laqab d’une personne dont le récit ne donne pas le nom. Capturé par les Romains lors d’un raid et crucifié sur un mât, il fut descendu par les musulmans lorsqu’ils prirent le navire ; il demanda de l’eau à verser sur lui et décrivit une vision eue sur le mât ; al-Walid ibn Muslim rapporte le récit."
  ur: "دیلمی مأسور مصلوب، ایک ایسے شخص کا لقب جس کا نام روایت میں نہیں دیا گیا۔ ایک غزوہ میں رومیوں نے انہیں قید کر کے مستول پر سولی دی، پھر مسلمانوں نے کشتی پر قبضہ کیا تو انہیں مستول سے اتارا گیا؛ انہوں نے پانی مانگا، اور اس رؤیا کا ذکر کیا جو سولی پر انہیں نظر آئی۔ یہ روایت ولید بن مسلم نے نقل کی۔"
  es: "Al-Daylami, el cautivo crucificado, un laqab para una persona cuyo nombre no se menciona en el relato. Capturado por los romanos en una incursión y crucificado en un mástil, fue bajado por los musulmanes cuando tomaron el barco; pidió que le echaran agua encima y describió una visión que tuvo mientras estaba en el mástil; Al-Walid ibn Muslim relata este suceso."
  tr: "Esir alınan ve çarmıha gerilen Deylami, rivayette adı geçmeyen bir kişiye verilen bir unvandır. Romalıların bir baskını sırasında yakalanmış ve tepede çarmıha gerilmiştir. Müslümanlar onu tepeden indirdiklerinde su istemiş ve çarmıha geriliyken gördüğü bir rüyayı anlatmıştır. Bu rivayet, El-Velid ibn Müslim tarafından nakledilmiştir."
  id: "Daylami yang ditawan dan disalibkan adalah gelar yang diberikan kepada seseorang yang namanya tidak disebutkan dalam kisah tersebut. Ia ditangkap oleh bangsa Romawi saat penyerbuan dan disalibkan di atas bukit. Ketika kaum Muslim membawanya turun dari bukit, ia meminta air dan menceritakan tentang penglihatan yang ia lihat saat disalibkan. Kisah ini diriwayatkan oleh Al-Walid ibn Muslim."
