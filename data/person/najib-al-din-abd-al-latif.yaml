died: { edtf: "1268~", hijri: "0667", calendar: julian, precision: year, status: tradition, derived: true, note: "وفاته في أموات سنة سبع وستين وستمائة {cite:shadharat-dhahab p. 565}." }
summary:
  ar: "الحنبلي، فقيه أهله وإمامهم وأعزهم، صاحب القدر الجليل عند السلطان؛ كان شديد النكير في المنكر وله دروس وفوائد يحسن الإفتاء فيها، وكاتب بالإنشاء له محاسن من قصص الملوك، منها كتاب «النور» وشرحها في الكافي وسماها «الكافية» وقد أوغل فيها، وكان آخر من أخذ عنه في الفقه أبو بكر بن صباح؛ وحج من كان كبيراً من الشيوخ {cite:shadharat-dhahab p. 565}."
  en: "The Hanbali of mighty standing at the sultan's court — 'fierce in denouncing the wrong', teacher and insha'-writer (al-Nur, the Kafiya commentary); Abu Bakr b. Sabah his last pupil {cite:shadharat-dhahab p. 565}."
  es: "El hanbalí de gran prestigio en la corte del sultán — 'feroz al denunciar la injusticia', maestro y escritor insha' (al-Nur, el comentario de Kafiya); Abu Bakr b. Sabah fue su último discípulo {citar: shadharat-dhahab p. 565}."
  fr: "Le Hanbalite de haute stature à la cour du sultan — « féroce dans la dénonciation du mal », enseignant et auteur d'insha' (al-Nur, le commentaire de Kafiya); Abu Bakr b. Sabah son dernier élève {cite: shadharat-dhahab p. 565}."
  ur: "سلطان کے دربار میں کھڑے ہونے والے زبردست حنبلی - 'غلط کی مذمت میں سخت'، استاد اور انشا' مصنف ⁦(النور، قافیہ تفسیر)⁩؛ ابوبکر ب۔ صباح ان کا آخری شاگرد 565}۔"
  tr: "Halkının hukukçusu, imamı ve saygın lideri olan El-Hanbali, hükümdar tarafından büyük saygı görüyordu; kötülüklere çok kızgındı, ustaca fetvalar verdiği dersler ve yardımlar aldı ve kralların hikâyelerinde \"En-Nur\" kitabı ve onun \"El-Kafi\" adını verdiği tefsiri dahil olmak üzere kralların hikâyelerinde değerli eserler yazdı; bu esere derinlemesine baktı. Ondan fıkıh öğrenen son kişi Ebu Bekir bin Sabah oldu; büyük şeyhler arasında hac yaptı {kaynak:Shadharat-Dhahab, s. 565}."
  id: "Al-Hanbali, seorang ahli hukum bangsanya, imam mereka, dan pemimpin mereka yang dihormati, sangat dihormati oleh penguasa; ia sangat menegur kesalahan, mendapat pelajaran dan manfaat yang ia berikan fatwa dengan terampil, dan merupakan penulis karya komposisi yang bernilai dalam kisah raja, termasuk buku \"An-Nur\" dan komentarnya dalam Al-Kafi, yang ia sebut \"Al-Kafiya,\" yang ia telusuri lebih dalam. Yang terakhir belajar hukum darinya adalah Abu Bakr ibn Sabbah; ia melakukan ziarah di antara para sheikh besar {cite:shadharat-dhahab, hlm. 565}."
