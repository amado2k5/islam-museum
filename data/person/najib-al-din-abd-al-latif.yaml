  ar: "الحنبلي، فقيه أهله وإمامهم وأعزهم، صاحب القدر الجليل عند السلطان؛ كان شديد النكير في المنكر وله دروس وفوائد يحسن الإفتاء فيها، وكاتب بالإنشاء له محاسن من قصص الملوك، منها كتاب «النور» وشرحها في الكافي وسماها «الكافية» وقد أوغل فيها، وكان آخر من أخذ عنه في الفقه أبو بكر بن صباح؛ وحج من كان كبيراً من الشيوخ {cite:shadharat-dhahab p. 565}."
  en: "The Hanbali of mighty standing at the sultan's court — 'fierce in denouncing the wrong', teacher and insha'-writer (al-Nur, the Kafiya commentary); Abu Bakr b. Sabah his last pupil {cite:shadharat-dhahab p. 565}."
