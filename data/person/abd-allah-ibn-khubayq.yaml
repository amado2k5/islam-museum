summary:
  ar: "عبد الله بن خبيق، روى عن يوسف بن أسباط وحذيفة المرعشي والفضل، وأسند كثيرًا فتفرد بأشياء. من أقواله: الصدق مستغنٍ عن الأحوال كلها، وطول الاستماع إلى الباطل يطفئ حلاوة الطاعة، وأنفع الخوف ما حجزك عن المعاصي."
  en: "Abd Allah ibn Khubayq, a transmitter who reports from Yusuf ibn Asbat, Hudhayfa al-Mar'ashi and al-Fadl, and who narrated much and had some reports to himself; among his sayings: truthfulness needs none of the states, long listening to falsehood puts out the sweetness of obedience, and the most useful fear is what holds you back from disobedience."
  ur: "عبد اللہ بن خبیق، جنہوں نے یوسف بن اسباط، حذیفہ مرعشی اور فضل سے روایت کی، بہت روایات بیان کیں اور کچھ باتیں ان سے ہی منقول ہیں۔ ان کے اقوال میں: سچائی تمام احوال سے بے نیاز ہے، باطل کو دیر تک سننا طاعت کی مٹھاس بجھا دیتا ہے، اور سب سے نافع خوف وہ ہے جو تمہیں گناہوں سے روک دے۔"
