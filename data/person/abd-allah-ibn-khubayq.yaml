roles: [mystic, transmitter]
summary:
  ar: "عبد الله بن خبيق، روى عن يوسف بن أسباط وحذيفة المرعشي والفضل، وأسند كثيرًا فتفرد بأشياء. من أقواله: الصدق مستغنٍ عن الأحوال كلها، وطول الاستماع إلى الباطل يطفئ حلاوة الطاعة، وأنفع الخوف ما حجزك عن المعاصي."
  en: "Abd Allah ibn Khubayq, a transmitter who reports from Yusuf ibn Asbat, Hudhayfa al-Mar'ashi and al-Fadl, and who narrated much and had some reports to himself; among his sayings: truthfulness needs none of the states, long listening to falsehood puts out the sweetness of obedience, and the most useful fear is what holds you back from disobedience."
  fr: "Abd Allah ibn Khubayq, transmetteur qui rapporte de Yusuf ibn Asbat, de Hudhayfa al-Mar'ashi et d'al-Fadl, qui transmit beaucoup et eut quelques récits propres ; parmi ses paroles : la véracité n'a besoin d'aucun des états, écouter longtemps le faux éteint la douceur de l'obéissance, et la crainte la plus utile est celle qui te retient de la désobéissance."
  ur: "عبد اللہ بن خبیق، جنہوں نے یوسف بن اسباط، حذیفہ مرعشی اور فضل سے روایت کی، بہت روایات بیان کیں اور کچھ باتیں ان سے ہی منقول ہیں۔ ان کے اقوال میں: سچائی تمام احوال سے بے نیاز ہے، باطل کو دیر تک سننا طاعت کی مٹھاس بجھا دیتا ہے، اور سب سے نافع خوف وہ ہے جو تمہیں گناہوں سے روک دے۔"
  es: "Abd Allah ibn Khubayq, un transmisor que relata de Yusuf ibn Asbat, Hudhayfa al-Mar'ashi y al-Fadl, y que narró mucho y tuvo algunos relatos para sí mismo; entre sus dichos: la veracidad no necesita de ningún estado, escuchar mucho tiempo la falsedad apaga la dulzura de la obediencia, y el temor más útil es lo que te frena de la desobediencia."
  tr: "Abdullah ibn Hubeyk, Yusuf ibn Asbat, Huzeyfe el-Maraş ve el-Fadl'dan rivayet etmiş ve birçok hadisi isnad zinciriyle aktarmıştır; bunlardan bazıları eşsizdir. Sözleri arasında şunlar yer almaktadır: Doğruluk her koşuldan bağımsızdır; yalanı uzun süre dinlemek itaatin tatlılığını söndürür; ve en faydalı korku, insanı günahlardan alıkoyan korkudur."
  id: "Abdullah ibn Khubayq meriwayatkan dari Yusuf ibn Asbat, Hudhayfah al-Mar'ashi, dan al-Fadl, dan beliau menyampaikan banyak hadits dengan sanad yang unik. Di antara ucapannya adalah: Kejujuran tidak bergantung pada keadaan apa pun; mendengarkan kebohongan yang berkepanjangan akan memadamkan manisnya ketaatan; dan rasa takut yang paling bermanfaat adalah rasa takut yang menahanmu dari dosa."
