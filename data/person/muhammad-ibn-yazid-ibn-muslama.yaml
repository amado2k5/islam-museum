id: person/muhammad-ibn-yazid-ibn-muslama
class: person
label:
  ar: محمد بن يزيد بن مسلمة بن عبد الملك
  en: Muhammad ibn Yazid ibn Muslama
  es: "Muhammad ibn Yazid ibn Muslama"
  fr: "Muhammad ibn Yazid ibn Muslama"
  ur: "محمد بن یزید بن مسلمہ"
summary:
  ar: ابن الخليفة الأموي، كان بالجزيرة بحصن مسلمة من إقليم بلخ من كورة الرقة من ديار مضر، قال كلاب بن حمزة العقيلي لم نعلم أحداً من العرب في الجاهلية والإسلام وصف خيل الحلبة العشرة بأسمائها وصفاتها ومراتبها غيره في قصيدته شهدنا الرهان غداة الرهان بمجمعة ضمها الموسم {cite:muruj-al-dhahab p. 698-699}.
  en: The Umayyad prince of Hisn Muslama, sole Arab said to have described the ten race-course ranks in verse {cite:muruj-al-dhahab p. 698-699}.
  es: "El príncipe omeya de Hisn Muslama, único árabe del que se dice que describió los diez rangos del hipódromo en verso {cite:muruj-al-dhahab p. 698-699}."
  fr: "Le prince omeyyade de Hisn Muslama, seul Arabe à avoir décrit les dix rangs de l'hippodrome en vers {cite:muruj-al-dhahab p. 698-699}."
  ur: "حسن مسلم کے اموی شہزادے، واحد عرب نے کہا کہ دس ریس کورس کے درجات کو آیت {حوالہ: مروج الذہب صفحہ 18 میں بیان کیا گیا ہے۔ 698-699}۔"
  tr: "Emevi Halifesi'nin oğlu, Mudar topraklarının bir parçası olan Rakka bölgesindeki Balkh bölgesindeki Maslamah kalesinde Cazire'deydi. Kilab bin Hamza el-Aqili şöyle demiştir: İslam öncesi dönemde veya İslam'da yüzüğün on atını isimleri, özellikleri ve rütbeleriyle tanımlayan hiçbir Arap tanımıyorduk. Şiirinde diğerleri ise mevsimin dahil olduğu bir toplantıda gün be gün bahis oynandığını görmüştür {atıf:muruj-al-dhahab, s. 698-699}."
  id: "Putra Khalifah Umayyah berada di Jazira di benteng Maslamah di wilayah Balkh, wilayah Raqqa, bagian dari tanah Mudar. Kilab ibn Hamza al-'Aqili berkata: Kami tidak mengenal ada Arab di era pra-Islam atau Islam yang menggambarkan sepuluh kuda cincin berdasarkan nama, karakteristik, dan pangkat mereka. Orang lain dalam puisinya menyaksikan taruhan hari demi hari dalam sebuah pertemuan yang musim itu termasuk {cite:muruj-al-dhahab, hlm. 698-699}."
