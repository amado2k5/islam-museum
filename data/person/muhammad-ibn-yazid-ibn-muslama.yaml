summary:
  ar: ابن الخليفة الأموي، كان بالجزيرة بحصن مسلمة من إقليم بلخ من كورة الرقة من ديار مضر، قال كلاب بن حمزة العقيلي لم نعلم أحداً من العرب في الجاهلية والإسلام وصف خيل الحلبة العشرة بأسمائها وصفاتها ومراتبها غيره في قصيدته شهدنا الرهان غداة الرهان بمجمعة ضمها الموسم {cite:muruj-al-dhahab p. 698-699}.
  en: The Umayyad prince of Hisn Muslama, sole Arab said to have described the ten race-course ranks in verse {cite:muruj-al-dhahab p. 698-699}.
  es: "El príncipe omeya de Hisn Muslama, único árabe del que se dice que describió los diez rangos del hipódromo en verso {cite:muruj-al-dhahab p. 698-699}."
  fr: "Le prince omeyyade de Hisn Muslama, seul Arabe à avoir décrit les dix rangs de l'hippodrome en vers {cite:muruj-al-dhahab p. 698-699}."
