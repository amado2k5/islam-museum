id: person/al-misri-al-zahid
class: person
label: { ar: "أبو الحسن المصرى الزاهد", en: "Al Misri Al Zahid", fr: "Al Misri Al Zahid", es: "Al Misri Al Zahid", ur: "المصری الزاہد" }
summary:
  ar: "أبو الحسن علي بن محمد بن أحمد وأصله من سر من رأى انتقل إلى مصر ثم عاد إلى بغداد ومولده بسر من رأى سنة سبع وخمسين ومائتين وكان ورعا زاهدا فقيها عارفا بالحديث وتوفي سنة مائة وثلاثين وثلاثمائة وله في الزهد الكتاب الكبير ويحتوي على أربعين كتابا منها كتاب قيام الليل وكتاب المتحابين وكتاب المراقبة وكتاب الصمت وكتاب الخوف وكتاب التوبة وكتاب الصبر وكتاب الإناث والمجانين وكتاب الجامع الصغير في الآداب وكتاب الإخلاص وله في الفقه كتاب المناسك وكتاب الطهارة وكتاب الصلاة وكتاب الفرائض وكتاب النية وكتاب الزكاة وكتاب الصيام وكتاب فضل الفقر على الغنى {cite:fihrist-ibn-al-nadim p. 263}."
  en: "Al-Misri — the Samarra-born ascetic whose great book ran to forty treatises {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Misri – l'ascète né à Samarra dont le grand livre a couru à quarante traités {cite:fihrist-ibn-al-nadim}"
  es: "Al-Misri — el asceta nacido en Samarra cuyo gran libro constaba de cuarenta tratados {cite:fihrist-ibn-al-nadim}"
  ur: "المصری - سامرہ میں پیدا ہونے والا سنیاسی جس کی عظیم کتاب چالیس مقالوں پر مشتمل ہے"
  tr: "Aslen Sir Man Ra'a'dan olan Ebu el-Hasan Ali bin Muhammed ibn Ahmed, Mısır'a taşındı, ardından Bağdat'a döndü ve 257 Hicri yılında Sirr Man Ra'a'da doğdu. Dindar, münzevi, hukukçu ve hadis konusunda bilgiliydi. 1330 Hicri yılında öldü. Gece Duaları Kitabı, Sevenler Kitabı, Gözetler Kitabı dahil olmak üzere kırk kitaptan oluşan Büyük Asketizm Kitabı'nı yazdı İlanıklık, Sessizlik Kitabı, Korku Kitabı, Tövbe Kitabı, Sabır Kitabı, Kadınlar ve Deliler Kitabı, Küçük Görgü Kitabı, Samimiyet Kitabı. Hukuk alanında ise Ritüeller Kitabı, Arınma Kitabı, Dua Kitabı, Yükümlülükler Kitabı, Niyet Kitabı (Zekat Kitabı), Oruç Kitabı ve Yoksulluğun Servet Üzerindeki Erdemi Kitabı {atıf: Fihrist-ibn-al-Nadim s. 263}."
  id: "Abu al-Hasan Ali ibn Muhammad ibn Ahmad, yang berasal dari Sir Man Ra'a, pindah ke Mesir, kemudian kembali ke Baghdad, dan lahir di Sirr Man Ra'a pada tahun 257 H. Ia seorang yang saleh, asketis, ahli hukum, dan berpengetahuan dalam hadis. Ia meninggal pada tahun 1330 H. Ia menulis Kitab Agung Asketisme, yang berisi empat puluh kitab, termasuk Kitab Doa Malam, Kitab Orang yang Penuh Kasih, Buku Pengawasan, Buku Keheningan, Buku Ketakutan, Buku Pertobatan, Buku Kesabaran, Buku Wanita dan Orang Gila, Buku Koleksi Kecil tentang Etiket, Buku Ketulusan. Dalam bidang hukum, ia menulis Buku Ritual, Buku Pemurnian, Buku Doa, Buku Kewajiban, Buku Niat (Kitab Zakat), Buku Puasa, dan Buku Kebajikan Kemiskinan atas Kekayaan {cite::Fihrist-ibn-al-Nadim hlm. 263}."
