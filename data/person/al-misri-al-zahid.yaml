id: person/al-misri-al-zahid
class: person
label: { ar: "أبو الحسن المصرى الزاهد", en: "Al Misri Al Zahid" }
summary:
  ar: "أبو الحسن علي بن محمد بن أحمد وأصله من سر من رأى انتقل إلى مصر ثم عاد إلى بغداد ومولده بسر من رأى سنة سبع وخمسين ومائتين وكان ورعا زاهدا فقيها عارفا بالحديث وتوفي سنة مائة وثلاثين وثلاثمائة وله في الزهد الكتاب الكبير ويحتوي على أربعين كتابا منها كتاب قيام الليل وكتاب المتحابين وكتاب المراقبة وكتاب الصمت وكتاب الخوف وكتاب التوبة وكتاب الصبر وكتاب الإناث والمجانين وكتاب الجامع الصغير في الآداب وكتاب الإخلاص وله في الفقه كتاب المناسك وكتاب الطهارة وكتاب الصلاة وكتاب الفرائض وكتاب النية وكتاب الزكاة وكتاب الصيام وكتاب فضل الفقر على الغنى {cite:fihrist-ibn-al-nadim p. 263}."
  en: "Al-Misri — the Samarra-born ascetic whose great book ran to forty treatises {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
