label:
  ar: جياش بن نجاح
  en: Jayyash ibn Najah
summary:
  ar: "جياش بن نجاح، كنيته ابن القطاي؛ لحق بجزيرة دهلك هو وأخوه سعيد يتعلمان القرآن والآداب، ثم خالفا العسكر وسارا في اتباع علي الصليحي فبيتاه في اللجم وهو متوجه إلى مكة فانتقض عسكره وتولى قتله جياش بيده سنة 473هـ، وهرب إلى عدن متنكراً ثم إلى الهند حتى رجع واستولى على زبيد وبقي ملكاً عليها يخطب للعباسيين والصليحيون يخطبون للعبيديين، وكان موصوفاً بالعدل وهلك على رأس المائة الخامسة فولي ابنه الفاتك."
  en: "Jayyash ibn Najah, kunya Ibn al-Qattay; he fled with his brother Sa'id to Dahlak island to study Qur'an and letters, then shadowed Ali al-Sulayhi's army, ambushed him in the saddle-lines on the Mecca road and killed him with his own hand in 473 — fleeing disguised through Aden to India, returning to take Zabid where he ruled under the Abbasid khutba against the Sulayhids' Fatimid one, famed for justice, dying at the turn of the fifth century and succeeded by his son al-Fatik."
