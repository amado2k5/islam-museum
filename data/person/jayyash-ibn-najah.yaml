label:
  ar: جياش بن نجاح
  en: Jayyash ibn Najah
  es: "Jayyash ibn Najah"
  fr: "Jayyash ibn Najah"
summary:
  ar: "جياش بن نجاح، كنيته ابن القطاي؛ لحق بجزيرة دهلك هو وأخوه سعيد يتعلمان القرآن والآداب، ثم خالفا العسكر وسارا في اتباع علي الصليحي فبيتاه في اللجم وهو متوجه إلى مكة فانتقض عسكره وتولى قتله جياش بيده سنة 473هـ، وهرب إلى عدن متنكراً ثم إلى الهند حتى رجع واستولى على زبيد وبقي ملكاً عليها يخطب للعباسيين والصليحيون يخطبون للعبيديين، وكان موصوفاً بالعدل وهلك على رأس المائة الخامسة فولي ابنه الفاتك."
  en: "Jayyash ibn Najah, kunya Ibn al-Qattay; he fled with his brother Sa'id to Dahlak island to study Qur'an and letters, then shadowed Ali al-Sulayhi's army, ambushed him in the saddle-lines on the Mecca road and killed him with his own hand in 473 — fleeing disguised through Aden to India, returning to take Zabid where he ruled under the Abbasid khutba against the Sulayhids' Fatimid one, famed for justice, dying at the turn of the fifth century and succeeded by his son al-Fatik."
  es: "Jayyash ibn Najah, kunya Ibn al-Qattay; huyó con su hermano Sa'id a la isla de Dahlak para estudiar el Corán y las letras, luego siguió al ejército de Ali al-Sulayhi, le tendió una emboscada en las líneas de cabalgatas en el camino a La Meca y lo mató con su propia mano en 473, huyendo disfrazado a través de Adén a la India, regresando para tomar Zabid donde gobernó bajo la jutba abasí contra la fatimí de los Sulayhid, famoso por su justicia, murió a principios del siglo V y fue sucedido por su hijo al-Fatik."
  fr: "Jayyash ibn Najah, kunya Ibn al-Qattay; il s'enfuit avec son frère Sa'id sur l'île de Dahlak pour étudier le Coran et les lettres, puis suivit l'armée d'Ali al-Sulayhi, lui tendit une embuscade sur la route de La Mecque et le tua de sa propre main en 473 — s'enfuyant déguisé à travers Aden vers l'Inde, retournant pour prendre Zabid où il gouverna sous le khutba abbasside contre le khutba fatimide des Sulayhides, célèbre pour sa justice, mourut au tournant du 5e siècle et son fils al-Fatik lui succéda."
