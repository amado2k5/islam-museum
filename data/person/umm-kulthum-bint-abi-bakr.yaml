summary:
  ar: "أم كلثوم بنت أبي بكر الصديق؛ أمها زيدة بنت خارجة رجل من الأنصار؛ تزوجها طلحة بن عبيد الله فولدت له زكريا وعائشة ثم قُتل عنها فتزوجها عبد الرحمن بن عبد الله بن أبي ربيعة المخزومي {cite:wafayat-ayan}."
  en: "Umm Kulthum bint Abi Bakr al-Siddiq — her mother was the Ansari woman Zayda bint Kharija; married Talha b. Ubaydallah (mother of his Zakariyya and A'isha), and after his death married Abd al-Rahman b. Abdallah b. Abi Rabi'a al-Makhzumi {cite:wafayat-ayan}."
  es: "Umm Kulthum bint Abi Bakr al-Siddiq: su madre era la mujer ansari Zayda bint Kharija; casado con Talha b. Ubaydallah (madre de su Zakariyya y A'isha), y después de su muerte se casó con Abd al-Rahman b. Abdalá b. Abi Rabi'a al-Makhzumi {cita:wafayat-ayan}."
  fr: "Umm Kulthum bint Abi Bakr al-Siddiq — sa mère était la femme Ansari Zayda bint Kharija; marié à Talha b. Ubaydallah (mère de sa Zakariyya et A'isha), et après sa mort épousa Abd al-Rahman b. Abdallah b. Abi Rabi'a al-Makhzumi {cite: wafayat-ayan}."
