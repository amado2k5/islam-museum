id: person/umm-kulthum-bint-abi-bakr
class: person
label: { ar: "أم كلثوم بنت أبي بكر", en: "Umm Kulthum bint Abi Bakr", es: "Umm Kulthum bint Abi Bakr", fr: "Umm Kulthum bint Abi Bakr", ur: "ام کلثوم بنت ابی بکر" }
summary:
  ar: "أم كلثوم بنت أبي بكر الصديق؛ أمها زيدة بنت خارجة رجل من الأنصار؛ تزوجها طلحة بن عبيد الله فولدت له زكريا وعائشة ثم قُتل عنها فتزوجها عبد الرحمن بن عبد الله بن أبي ربيعة المخزومي {cite:wafayat-ayan}."
  en: "Umm Kulthum bint Abi Bakr al-Siddiq — her mother was the Ansari woman Zayda bint Kharija; married Talha b. Ubaydallah (mother of his Zakariyya and A'isha), and after his death married Abd al-Rahman b. Abdallah b. Abi Rabi'a al-Makhzumi {cite:wafayat-ayan}."
  es: "Umm Kulthum bint Abi Bakr al-Siddiq: su madre era la mujer ansari Zayda bint Kharija; casado con Talha b. Ubaydallah (madre de su Zakariyya y A'isha), y después de su muerte se casó con Abd al-Rahman b. Abdalá b. Abi Rabi'a al-Makhzumi {cita:wafayat-ayan}."
  fr: "Umm Kulthum bint Abi Bakr al-Siddiq — sa mère était la femme Ansari Zayda bint Kharija; marié à Talha b. Ubaydallah (mère de sa Zakariyya et A'isha), et après sa mort épousa Abd al-Rahman b. Abdallah b. Abi Rabi'a al-Makhzumi {cite: wafayat-ayan}."
  ur: "ام کلثوم بنت ابی بکر الصدیق - ان کی والدہ انصاری خاتون زیدہ بنت خارجہ تھیں۔ طلحہ بی سے شادی کی۔ عبیداللہ ⁦(ان کی والدہ زکریا اور عائشہ ا)⁩ اور ان کی وفات کے بعد عبد الرحمن بن سے شادی کی۔ عبداللہ بی ابی ربیعہ المخزومی {حوالہ: وفایت-عیان}۔"
  tr: "Ümmü Kultum bint Abi Bekir el-Siddiq; annesi Ensar'dan Zeyda bint Harijah'tı; Talhah ibn Ubeyd Allah ile evlendi ve ona Zekeriye ile Aişa'yı doğurdu, sonra ondan sonra öldürüldü. Abd al-Rahman ibn Abdullah ibn Abi Rabi'ah al-Makhzumi onunla evlendi {alıntı:wafayat-ayan}."
  id: "um Kulthum bint Abi Bakr al-Siddiq; ibunya adalah Zayda bint Kharijah, seorang pria dari Ansar; ia menikah dengan Talhah ibn Ubayd Allah dan melahirkan Zakariya dan Aisha, lalu dibunuh setelahnya. Abd al-Rahman ibn Abdullah ibn Abi Rabi'ah al-Makhzumi menikahinya {cite:wafayat-ayan}."
