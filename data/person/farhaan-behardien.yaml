summary:
  ar: "لاعب كريكت جنوب أفريقي دولي سابق، وُلد في جوهانسبرغ سنة 1983. لاعب شامل أيمن الضرب لعب 59 مباراة في اليوم الواحد و38 مباراة في العشرينيات الدولية لجنوب أفريقيا بين 2012 و2018، وعُيّن قائدا لفريق العشرينيات في يناير 2017، وقضى معظم مسيرته المحلية في فريق التيتانز بين 2006 و2020، وأعلن اعتزاله الكريكت الدولية في ديسمبر 2022."
  en: "South African former international cricketer, born in Johannesburg in 1983. A right-handed all-rounder, he played 59 One Day Internationals and 38 Twenty20 Internationals for South Africa between 2012 and 2018, was appointed T20I captain in January 2017, spent most of his domestic career with the Titans between 2006 and 2020, and announced his retirement from international cricket in December 2022."
  ur: "جنوبی افریقہ کے سابق بین الاقوامی کرکٹ کھلاڑی، جو 1983 میں جوہانسبرگ میں پیدا ہوئے۔ دائیں ہاتھ کے آل راؤنڈر کی حیثیت سے انھوں نے 2012ء سے 2018ء کے درمیان جنوبی افریقہ کے لیے 59 ایک روزہ اور 38 ٹی ٹوئنٹی بین الاقوامی میچ کھیلے، جنوری 2017 میں ٹی ٹوئنٹی ٹیم کے کپتان مقرر ہوئے، اپنا بیشتر ملکی کیریئر ٹائٹنز کے ساتھ گزارا، اور دسمبر 2022 میں بین الاقوامی کرکٹ سے ریٹائرمنٹ کا اعلان کیا۔"
