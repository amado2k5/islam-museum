summary:
  ar: "أبو زكريا ابن الأمير أحمد بن إسماعيل الساماني؛ حبسه أخوه نصر بن أحمد في القهندز ببخارا مع أخويه أبي صالح منصور وأبي إسحاق إبراهيم فأخرجهم أبو بكر الخباز الإصبهاني وخرجوا على أخيهم السعيد سنة 318هـ {cite:kamil-ibn-al-athir p. 155}."
  en: "Abu Zakariya, son of the Samanid amir Ahmad ibn Isma'il; his brother Nasr imprisoned him with his brothers Mansur and Ibrahim in Bukhara's citadel until the baker Abu Bakr freed them and they rose against al-Sa'id in 318 {cite:kamil-ibn-al-athir p. 155}."
