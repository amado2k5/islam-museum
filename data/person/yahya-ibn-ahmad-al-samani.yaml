id: person/yahya-ibn-ahmad-al-samani
class: person
label: { ar: "يحيى بن أحمد بن إسماعيل الساماني" }
summary:
  ar: "أبو زكريا ابن الأمير أحمد بن إسماعيل الساماني؛ حبسه أخوه نصر بن أحمد في القهندز ببخارا مع أخويه أبي صالح منصور وأبي إسحاق إبراهيم فأخرجهم أبو بكر الخباز الإصبهاني وخرجوا على أخيهم السعيد سنة 318هـ {cite:kamil-ibn-al-athir p. 155}."
  en: "Abu Zakariya, son of the Samanid amir Ahmad ibn Isma'il; his brother Nasr imprisoned him with his brothers Mansur and Ibrahim in Bukhara's citadel until the baker Abu Bakr freed them and they rose against al-Sa'id in 318 {cite:kamil-ibn-al-athir p. 155}."
  es: "Abu Zakariya, hijo del emir samaní Ahmad ibn Isma'il; su hermano Nasr lo encarceló junto con sus hermanos Mansur e Ibrahim en la ciudadela de Bujará hasta que el panadero Abu Bakr los liberó y se rebelaron contra al-Sa'id en 318 {cite:kamil-ibn-al-athir p. 155}."
  fr: "Abou Zakariya, fils de l'émir samanide Ahmad ibn Isma'il; son frère Nasr l'emprisonna avec ses frères Mansur et Ibrahim dans la citadelle de Boukhara jusqu'à ce que le boulanger Abou Bakr les libère et qu'ils se soulèvent contre al-Sa'id en 318 {cite:kamil-ibn-al-athir p. 155}."
  ur: "ابو زکریا، سامانی امیر احمد بن اسماعیل کے بیٹے؛ اس کے بھائی نصر نے اسے اپنے بھائیوں منصور اور ابراہیم کے ساتھ بخارا کے قلعہ میں قید کر دیا یہاں تک کہ نانبائی ابوبکر نے انہیں آزاد کر دیا اور وہ 318 میں سعید کے خلاف اٹھ کھڑے ہوئے۔ 155}۔"
