id: person/labid-ibn-al-asam
class: person
gender: male
label:
  ar: لبيد بن الأعصم
  en: Labid ibn al-Asam
  ur: لبید بن الاعصم
summary:
  ar: "يهودي من أهل المدينة، سحّر النبي حتى اشتد به الأمر، فلما نزلت المعوذتان استُخْرِج السحر من بئر تحت فراشه، فاعترفوا له به وأُخرج من المدينة {cite:sahih-al-bukhari} {cite:sahih-muslim}، وروى ابن إسحاق القصة في سيرته {cite:sira-ibn-ishaq-zakkar}."
  en: "A Jew of Medina who bewitched the Prophet until his condition grew severe; when the two Suras of Refuge were revealed the magic was drawn out of a well beneath his bedding, and he confessed and was expelled from Medina {cite:sahih-al-bukhari} {cite:sahih-muslim}; Ibn Ishaq relates the story in his sira {cite:sira-ibn-ishaq-zakkar}."
  ur: "مدینہ کا یہودی جس نے نبی پر جادو کیا یہاں تک کہ ان کی حالت بگڑی؛ جب معوذتین نازل ہوئیں تو جادو ان کے بستر کے نیچے ایک کنوئیں سے نکالا گیا، اس نے اعتراف کیا اور مدینہ سے نکال دیا گیا {cite:sahih-al-bukhari} {cite:sahih-muslim}؛ ابن اسحاق نے یہ قصہ اپنی سیرت میں بیان کیا {cite:sira-ibn-ishaq-zakkar}۔"
