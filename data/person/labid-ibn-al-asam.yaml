summary:
  ar: "رجل يهودي من بني قينقاع، سحر النبي بمكة أو قرب المدينة مع ابن أخته وامرأة، فنزلت في البقرة آيتان أن لا السحر يضر من لم يؤمن؛ فأمر النبي بتعويذٍ من أوراق النبق فأُذيع سحره."
  en: "A Jewish man of the Banu Qaynuqa' said to have bewitched the Prophet along with his nephew and a woman; the Prophet was healed by ruqyah with lote-tree leaves while the sorcerer's hair fell out — reported in the hadith collections and the sira literature."
  ur: "بنی قینقاع کا ایک یہودی شخص جس نے — روایت کے مطابق — اپنے بھتیجے اور ایک عورت کے ساتھ نبی پر جادو کیا؛ نبک کے پتوں سے رقیہ کے ذریعے نبی شفا پائے اور جادوگر کے بال گر گئے — یہ روایت حدیث کی کتابوں اور سیرت میں آتی ہے۔"
