  ar: "روائي وطبيب أسنان وناشط سياسي مصري، وُلد في القاهرة في 26 مايو 1957. عضو مؤسس في حركة كفاية، وهو مؤلف «عمارة يعقوبيان» (2002) و«شيكاجو» (2007) و«نادي السيارات» (2013)؛ ويعيش منذ 2019 في المنفى بين باريس ونيويورك."
