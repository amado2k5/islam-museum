summary:
  ar: نائب الشام للملك الناصر محمد بن قلاوون من ربيع الآخر سنة 712 إلى أن قُبض عليه في ذي الحجة سنة 740، فتح الله على يديه ملطية سنة 715، ومات في سجن الإسكندرية أوائل سنة 741، فيما يترجم له ابن حجر {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526}.
  en: Viceroy of Syria for al-Nasir Muhammad ibn Qalawun from Rabi' al-Akhir 712 until his arrest in Dhu al-Hijja 740; Malatya was taken under him in 715, and he died in prison at Alexandria early in 741, according to Ibn Hajar's entry {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526}.
  ur: ناصر محمد بن قلاوون کی طرف سے ربیع الآخر 712 سے ذی الحجہ 740 میں گرفتاری تک شام کے نائب؛ ان کے ہاتھوں 715 میں ملطیہ فتح ہوا، اور وہ 741 کے شروع میں اسکندریہ کے قید خانے میں فوت ہوئے، ابن حجر کے ترجمے کے مطابق {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526}۔
