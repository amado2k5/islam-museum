label:
  ar: تنكز نائب الشام
  en: Tankiz, viceroy of Syria
  ur: تنکز، نائبِ شام
  es: "Tankiz, viceroy of Syria"
  fr: "Tankiz, viceroy of Syria"
gender: male
roles:
