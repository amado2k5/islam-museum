summary:
  ar: نائب الشام للملك الناصر محمد بن قلاوون من ربيع الآخر سنة 712 إلى أن قُبض عليه في ذي الحجة سنة 740، فتح الله على يديه ملطية سنة 715، ومات في سجن الإسكندرية أوائل سنة 741، فيما يترجم له ابن حجر {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526}.
  en: Viceroy of Syria for al-Nasir Muhammad ibn Qalawun from Rabi' al-Akhir 712 until his arrest in Dhu al-Hijja 740; Malatya was taken under him in 715, and he died in prison at Alexandria early in 741, according to Ibn Hajar's entry {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526}.
  ur: ناصر محمد بن قلاوون کی طرف سے ربیع الآخر 712 سے ذی الحجہ 740 میں گرفتاری تک شام کے نائب؛ ان کے ہاتھوں 715 میں ملطیہ فتح ہوا، اور وہ 741 کے شروع میں اسکندریہ کے قید خانے میں فوت ہوئے، ابن حجر کے ترجمے کے مطابق {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526}۔
  es: "Virrey de Siria para al-Nasir Muhammad ibn Qalawun desde Rabi' al-Akhir 712 hasta su arresto en Dhu al-Hijja 740; Malatya fue tomada bajo su mando en 715, y murió en prisión en Alejandría a principios de 741, según la entrada de Ibn Hajar {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526}."
  fr: "Muhammad ibn Qalawun, vice-roi de Syrie pour al-Nasir, de Rabi' al-Akhir 712 jusqu'à son arrestation en Dhu al-Hijja 740; Malatya fut placée sous son autorité en 715, et il mourut en prison à Alexandrie au début de 741, selon l'entrée d'Ibn Hajar {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526}."
  tr: "712'de Rabi'al-Thani'den Kral el-Nasir Muhammed ibn Kalawun'un vekiliydi ve 740'ta Dhu al-Hijjah'da yakalanana kadar el-Şam'ın vekiliydi. Allah, 715 Hicri'de Malatya'yı onun tarafından fethetti ve 741 başlarında İskenderiye hapishanesinde öldü. İbn Hajar ayrıca onu {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526} şeklinde çevirmiştir."
  id: "Ia adalah wakil al-Sham untuk Raja al-Nasir Muhammad ibn Qalawun dari Rabi' al-Thani pada tahun 712 hingga ia ditangkap dalam Dhu al-Hijjah tahun 740. Allah menaklukkan Malatya olehnya pada tahun 715 H dan wafat di penjara Alexandria pada awal 741. Ibn Hajar juga menerjemahkannya {cite:durar-kamina-jil-1993 1/520} {cite:durar-kamina-jil-1993 1/521} {cite:durar-kamina-jil-1993 1/525} {cite:durar-kamina-jil-1993 1/526}."
