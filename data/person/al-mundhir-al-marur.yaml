summary:
  ar: "آخر ملوك آل لخم على الحيرة: في سنة 632م عاد الملك إلى آل لخم فولي منهم المنذر الملقب بالمعرور، ولم تزد ولايته على ثمانية أشهر حتى قدم عليه خالد بن الوليد بعساكر المسلمين، في رواية الرحيق المختوم عن الخضري."
  en: "The last Lakhmid king of al-Hira: in 632 the kingship returned to the house of Lakhm in al-Mundhir called al-Ma'rur, whose rule lasted no more than eight months before Khalid ibn al-Walid arrived with the Muslim armies, in al-Raheeq al-Makhtum's account after al-Khudari."
  fr: "Le dernier roi Lakhmide d'al-Hira : en 632, la royauté retourna à la maison de Lakhm à al-Mundhir appelée al-Ma'rur, dont le règne ne dura pas plus de huit mois avant que Khalid ibn al-Walid n'arrive avec les armées musulmanes, dans le récit d'al-Raheeq al-Makhtum après al-Khudari."
  es: "El último rey Lakhmid de al-Hira: en 632, la realeza regresó a la casa de Lakhm en al-Mundhir, llamada al-Ma'rur, cuyo gobierno no duró más de ocho meses antes de que Khalid ibn al-Walid llegara con los ejércitos musulmanes, según el relato de al-Raheeq al-Makhtum después de al-Khudari."
  ur: "الحیرہ کا آخری لخمید بادشاہ: 632 میں بادشاہی المنذر میں لخم کے گھر میں واپس آئی جسے المرور کہا جاتا ہے، جس کی حکمرانی خالد بن الولید کے مسلم فوجوں کے ساتھ پہنچنے سے پہلے آٹھ ماہ سے زیادہ نہیں تھی، الرحیق المختم کے کھاتے میں الخدری کے بعد۔"
