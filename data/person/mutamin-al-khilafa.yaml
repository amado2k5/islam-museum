id: person/mutamin-al-khilafa
class: person
label: { ar: "مؤتمن الخلافة", en: "Mu'tamin al-Khilafa" }
summary:
  ar: "مؤتمن الخلافة، خصي كان بقصر العاضد آخر الخلفاء الفاطميين إليه الحكم فيه والتقادم على جميع من يحويه؛ اتفق وجماعة من المصريين على مكاتبة الفرنج واستدعائهم إلى البلاد للتقوي بهم على صلاح الدين ومن معه، ودبّر أن يثور بمن معه على متخلفي العساكر إذا خرج صلاح الدين إلى لقاء الفرنج فيأتونه من وراء ظهره؛ فافتضحت المكاتبة حين لقي القاصد رجل تركماني بالبئر البيضاء فارتاب بنعليه الجديدين ففتقهما ووجد الكتاب، ودلّ كاتبه — وكان يهودياً فأسلم تحت التعذيب — على الأمر؛ فلازم مؤتمن الخلافة القصر خوفاً ثم خرج إلى قريته الخرقانية فأرسل صلاح الدين من أخذه وقتله وأتى برأسه في أوائل ذي القعدة سنة أربع وستين وخمسمائة، وكان قتله سبب وقعة السودان {cite:kamil-ibn-al-athir p. 18-19}."
  en: "The eunuch who ruled al-Adid's palace — his letters inviting the Franks into Egypt were found sewn into a messenger's new sandals at al-Bir al-Bayda'; kept close to the palace in fear, then killed at his village of al-Kharqaniyya on Saladin's order, Dhu al-Qa'da 564 — the killing that triggered the Sudanese uprising {cite:kamil-ibn-al-athir p. 18-19}."
