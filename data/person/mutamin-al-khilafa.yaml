id: person/mutamin-al-khilafa
class: person
label: { ar: "مؤتمن الخلافة", en: "Mu'tamin al-Khilafa", es: "Mu'tamin al-Khilafa", fr: "Mu'tamin al-Khilafa", ur: "معتمین الخلافہ" }
summary:
  ar: "مؤتمن الخلافة، خصي كان بقصر العاضد آخر الخلفاء الفاطميين إليه الحكم فيه والتقادم على جميع من يحويه؛ اتفق وجماعة من المصريين على مكاتبة الفرنج واستدعائهم إلى البلاد للتقوي بهم على صلاح الدين ومن معه، ودبّر أن يثور بمن معه على متخلفي العساكر إذا خرج صلاح الدين إلى لقاء الفرنج فيأتونه من وراء ظهره؛ فافتضحت المكاتبة حين لقي القاصد رجل تركماني بالبئر البيضاء فارتاب بنعليه الجديدين ففتقهما ووجد الكتاب، ودلّ كاتبه — وكان يهودياً فأسلم تحت التعذيب — على الأمر؛ فلازم مؤتمن الخلافة القصر خوفاً ثم خرج إلى قريته الخرقانية فأرسل صلاح الدين من أخذه وقتله وأتى برأسه في أوائل ذي القعدة سنة أربع وستين وخمسمائة، وكان قتله سبب وقعة السودان {cite:kamil-ibn-al-athir p. 18-19}."
  en: "The eunuch who ruled al-Adid's palace — his letters inviting the Franks into Egypt were found sewn into a messenger's new sandals at al-Bir al-Bayda'; kept close to the palace in fear, then killed at his village of al-Kharqaniyya on Saladin's order, Dhu al-Qa'da 564 — the killing that triggered the Sudanese uprising {cite:kamil-ibn-al-athir p. 18-19}."
  es: "El eunuco que gobernaba el palacio de al-Adid —sus cartas invitando a los francos a Egipto fueron encontradas cosidas en las sandalias nuevas de un mensajero en al-Bir al-Bayda'; mantenido cerca del palacio por temor, luego asesinado en su aldea de al-Kharqaniyya por orden de Saladino, Dhu al-Qa'da 564 — el asesinato que desencadenó el levantamiento sudanés {cite:kamil-ibn-al-athir p. 18-19}."
  fr: "L'eunuque qui régnait sur le palais d'al-Adid — ses lettres invitant les Francs en Égypte furent retrouvées cousues dans les sandales neuves d'un messager à al-Bir al-Bayda'; gardé près du palais par crainte, puis tué dans son village d'al-Kharqaniyya sur ordre de Saladin, Dhu al-Qa'da 564 — le meurtre qui déclencha le soulèvement soudanais {cite:kamil-ibn-al-athir p. 18-19}."
  ur: "العدید کے محل پر حکمرانی کرنے والا خواجہ سرا - اس کے خطوط جن میں فرینکوں کو مصر میں مدعو کیا گیا تھا وہ البیر البیضاء میں ایک قاصد کے نئے سینڈل میں سلے ہوئے پائے گئے تھے۔ خوف کے مارے محل کے قریب رہے، پھر صلاح الدین کے حکم پر ان کے گاؤں الخرقانیہ میں قتل کر دیا گیا، ذوالقعدہ 564 - وہ قتل جس نے سوڈانی بغاوت کو جنم دیا۔ 18-19}۔"
  tr: "Mu'tem'in al-Halife, Kasr al-'Adid'de, son Fatımi halifesi olan bir hadımdı ve çevresindekilerin zamanaşımı süresine kadar hüküm sürdü. O ve bir grup Mısırlı, Franklarla yazışmayı ve onları Salah al-Din ve yoldaşlarına karşı güçlerini güçlendirmek üzere ülkeye çağırmayı kabul etti. Salah al-Din Franklarla görüşmeye çıkarsa ve arkasından gelirse, adamlarının askerlerin haleflerine karşı isyan etmelerini ayarladı. Yazışmalar, al-Din al-Din ile birlikte ortaya çıktığında netleşti -Kasi, Bir el-Bayda'da bir Türkmen adamla karşılaştı, yeni sandaletlerinden şüphelendi, onları yırttı ve mektubu buldu. Katibi—Yahudi olan ve işkence altında dönüştürülmüş—halifeliğe bildirdi. Mu'temin korkudan sarayda kaldı, sonra köyü el-Harkaniyye'ye gitti, onu yakalayıp öldürmesi için birini gönderdi ve başını erken Zulü Kı'da, 564 Hicri yılında, getirdi. Onun öldürülmesi Sudan Savaşı'nın sebebiydi {alıntı:Kamil-ibn-al-Athir, s. 18-19}."
  id: "Mu'tam'in al-Khalifa adalah seorang kasim yang berada di Qasr al-'Adid, khalifah Fatimiyah terakhir, yang memerintah dan menetapkan batas waktu bagi semua orang di sekitarnya. Ia dan sekelompok orang Mesir sepakat untuk berkorespondensi dengan bangsa Frank dan memanggil mereka ke negara itu untuk memperkuat pasukan melawan Salah al-Din dan para sahabatnya. Ia mengatur agar pasukannya memberontak melawan penerus tentara jika Salah al-Din pergi menemui orang Frank dan datang dari belakangnya. Korespondensi itu menjadi jelas ketika al-Qasid bertemu seorang pria Turkmen di Bir al-Bayda, ia mulai curiga dengan sandal barunya, sehingga ia merobeknya dan menemukan surat itu. Juru tulisnya—yang beragama Yahudi dan telah memeluk agama di bawah siksaan—memberitahu kekhalifahan. Mu'tamin tinggal di istana karena ketakutan, lalu pergi ke desanya al-Kharqaniyya, mengirim seseorang untuk menangkap dan membunuhnya, membawa kepalanya di awal Dhu al-Qi'dah tahun 564 H. Pembunuhannya menjadi penyebab Pertempuran Sudan {cite:Kamil-ibn-al-Athir, hlm. 18-19}."
