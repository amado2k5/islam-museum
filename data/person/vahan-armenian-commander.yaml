summary:
  ar: "قائد بيزنطي أرمني قاد مع ثيودور تريثوريوس الجيش الذي جاء من حمص إلى اليرموك سنة 15هـ الموافقة 636م، وترجّح دائرة المعارف الإسلامية أنه كان قائد الجند في المشرق. وتذكر أن أسرة هرقل الحاكمة بدت وكأنها ألقت مسؤولية الكارثة على ثورة فاشلة مزعومة منه، وتنبه إلى أن الأرمن والروم والعرب النصارى في الجيش البيزنطي كان بينهم ريبة واحتكاك {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  en: "Armenian Byzantine general who, with Theodore Trithurios, led the army that came from Hims to the Yarmuk in 15 AH, 636. The Encyclopaedia of Islam thinks he was probably the master of soldiers for the East. It says the Heraclian dynasty seems to have placed the blame for the disaster on an alleged abortive rebellion by him, and notes mistrust and friction among the Greeks, Armenians and Christian Arabs in the Byzantine force {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  ur: "ارمنی نژاد بازنطینی سپہ سالار جس نے تھیوڈور ٹرائتھوریوس کے ساتھ اس فوج کی قیادت کی جو 15ھ، یعنی 636ء، میں حمص سے یرموک آئی۔ اسلامی دائرۃ المعارف کا خیال ہے کہ وہ غالباً مشرق کا سالارِ لشکر تھا۔ وہ کہتا ہے کہ ہرقلی خاندان نے بظاہر تباہی کا الزام اس کی مبینہ ناکام بغاوت پر ڈال دیا، اور بازنطینی فوج میں یونانیوں، ارمنیوں اور عیسائی عربوں کے درمیان بداعتمادی اور رگڑ کا ذکر کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}۔"
