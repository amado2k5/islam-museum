names:
  - { value: "إبراهيم بن موسى بن محمد اللخمي الغرناطي الشاطبي", kind: full }
summary:
  ar: "أبو إسحاق إبراهيم بن موسى بن محمد اللخمي الغرناطي، الشهير بالشاطبي ⁦(ت 790هـ)⁩، أصولي حافظ من أهل غرناطة ومن أئمة المالكية، صاحب «الموافقات في أصول الشريعة» و«الاعتصام» و«المقاصد الشافية في شرح خلاصة الكافية» و«الإفادات والإنشادات» {cite:muwafaqat-draz-ilmiyya p. 1} {cite:muwafaqat-draz-ilmiyya p. 4}."
  en: "Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi of Granada, known as al-Shatibi (d. 790 AH), a legal theorist and hadith memoriser of Granada and one of the Maliki imams, author of al-Muwafaqat fi Usul al-Shari'a, al-I'tisam, al-Maqasid al-Shafiya (a commentary on Ibn Malik's Alfiyya) and al-Ifadat wa-l-Inshadat."
  ur: "ابو اسحاق ابراہیم بن موسیٰ بن محمد لخمی غرناطی، المعروف بہ شاطبی ⁦(م 790ھ)⁩، غرناطہ کے اصولی اور حافظ، مالکیہ کے ائمہ میں سے، «الموافقات فی اصول الشریعہ»، «الاعتصام»، «المقاصد الشافیہ» ⁦(ابن مالک کی الفیہ کی شرح)⁩ اور «الافادات والانشادات» کے مصنف۔"
  fr: "Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi de Grenade, dit al-Shatibi (mort en 790 H), théoricien du droit et mémorisateur du hadith de Grenade et l'un des imams malikites, auteur d'al-Muwafaqat fi Usul al-Shari'a, d'al-I'tisam, d'al-Maqasid al-Shafiya (commentaire de l'Alfiyya d'Ibn Malik) et d'al-Ifadat wa-l-Inshadat."
  es: "Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi de Granada, conocido como al-Shatibi (m. 790 AH), fue un teórico jurídico y memorizador de hadices de Granada y uno de los imanes Maliki (Alfiyya de Malik) y al-Ifadat wa-l-Inshadat."
  tr: "Ebu İshak İbrahim ibn Musa ibn Muhammed el-Lakhmi el-Garnati, el-Şatıbi (ö. 790 H.) olarak bilinen, Granadalı fıkıh âlimi ve hadis ezbercisi ve Maliki mezhebinin imamlarından biri, “El-Muwafaqat fi Usul al-Shari’ah” (İslam Hukuku Esaslarında Anlaşmalar), “Al-İ’tisam” (Bağlılık), “El-Makâsıdü’ş-Şafiyâ fi Şerhu Hulasâtü’l-Kafiyâ” (El-Kâfiyâ’nın Özetini Açıklamada Yeterli Amaçlar) ve “El-İfâdet ve’l-İnşâdât” (Faydalar ve Kıraatler)."
  id: "Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi al-Garnati, dikenal sebagai al-Shatibi (w. 790 H), seorang ulama fiqih dan penghafal hadis dari Granada dan salah satu imam mazhab Maliki, penulis “Al-Muwafaqat fi Usul al-Shari’ah” (Perjanjian Pokok-pokok Hukum Islam), “Al-I’tisam” (Ketaatan), “Al-Maqasid al-Shafiya fi Sharh Khulasat al-Kafiya” (Tujuan Cukup Menjelaskan Rangkuman al-Kafiya), dan “Al-Ifadat wa al-Inshadat” (Manfaat dan Zikirnya)."
