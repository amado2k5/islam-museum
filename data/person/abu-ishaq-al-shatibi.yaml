summary:
  ar: "أبو إسحاق إبراهيم بن موسى بن محمد اللخمي الغرناطي، الشهير بالشاطبي ⁦(ت 790هـ)⁩، أصولي حافظ من أهل غرناطة ومن أئمة المالكية، صاحب «الموافقات في أصول الشريعة» و«الاعتصام» و«المقاصد الشافية في شرح خلاصة الكافية» و«الإفادات والإنشادات» {cite:muwafaqat-draz-ilmiyya p. 1} {cite:muwafaqat-draz-ilmiyya p. 4}."
  en: "Abu Ishaq Ibrahim ibn Musa ibn Muhammad al-Lakhmi of Granada, known as al-Shatibi (d. 790 AH), a legal theorist and hadith memoriser of Granada and one of the Maliki imams, author of al-Muwafaqat fi Usul al-Shari'a, al-I'tisam, al-Maqasid al-Shafiya (a commentary on Ibn Malik's Alfiyya) and al-Ifadat wa-l-Inshadat."
  ur: "ابو اسحاق ابراہیم بن موسیٰ بن محمد لخمی غرناطی، المعروف بہ شاطبی ⁦(م 790ھ)⁩، غرناطہ کے اصولی اور حافظ، مالکیہ کے ائمہ میں سے، «الموافقات فی اصول الشریعہ»، «الاعتصام»، «المقاصد الشافیہ» ⁦(ابن مالک کی الفیہ کی شرح)⁩ اور «الافادات والانشادات» کے مصنف۔"
