id: person/husayn-ibn-fakhr-al-din-al-mani
class: person
label:
  ar: "حسين بن فخر الدين المعني"
  en: "Husayn ibn Fakhr al-Din al-Ma'ni"
  es: "Husayn ibn Fakhr al-Din al-Ma'ni"
  fr: "Husayn ibn Fakhr al-Din al-Ma'ni"
  ur: "حسین بن فخر الدین المعنی"
roles: [amir, diplomat, writer]
gender: male
summary:
  ar: "حسين بن فخر الدين بن قرقماس المعني، ابن معن، أديب من أمراء الدروز في لبنان، أُسر صغيرا مع أبيه إلى إسطنبول ونشأ في سراي غلطة، له كتاب التمييز، وقام بسفارة في الهند، وتوفي في إسطنبول."
  en: "Husayn ibn Fakhr al-Din ibn Qarqmas al-Ma'ni, known as Ibn Ma'n, a man of letters among the Druze emirs of Lebanon, taken to Istanbul as a child with his father and raised in the Galata palace; author of al-Tamyiz, he carried out an embassy to India and died in Istanbul."
  es: "Husayn ibn Fakhr al-Din ibn Qarqmas al-Ma'ni, conocido como Ibn Ma'n, fue un hombre de letras entre los emires drusos del Líbano. De niño, fue llevado a Estambul con su padre y criado en el palacio de Galata; autor de al-Tamyiz, realizó una embajada a la India y murió en Estambul."
  fr: "Husayn ibn Fakhr al-Din ibn Qarqmas al-Ma'ni, connu sous le nom d'Ibn Ma'n, homme de lettres parmi les émirs druzes du Liban, emmené à Istanbul enfant avec son père et élevé au palais de Galata; auteur d'al-Tamyiz, il effectua une ambassade en Inde et mourut à Istanbul."
  ur: "حسین بن فخرالدین ابن قرقماس المعنی، جو ابن معن کے نام سے جانا جاتا ہے، لبنان کے دروز امیروں میں سے ایک خطاطی آدمی، بچپن میں اپنے والد کے ساتھ استنبول لے جایا گیا اور گلتا محل میں پرورش پائی؛ التمیز کے مصنف، اس نے ہندوستان میں سفارت خانہ کیا اور استنبول میں انتقال کر گئے۔"
  tr: "Ma'n'ın oğlu Hüseyin bin Fakhr al-Din bin Qarqmas al-Ma'ni, Lübnan'daki Dürzî prensleri arasında edebi bir figürdü. Genç yaşta babasıyla birlikte İstanbul'a götürüldü ve Galata Saray'da büyüdü. 'Tamayiz' (Ayrıcalık) adlı kitabı yazdı, Hindistan'da büyükelçi olarak görev yaptı ve İstanbul'da hayatını kaybetti."
  id: "Hussein bin Fakhr al-Din bin Qarqmas al-Ma'ni, putra Ma'n, adalah tokoh sastra di antara para pangeran Druze di Lebanon. Ia dibawa muda bersama ayahnya ke Istanbul dan tumbuh besar di Galata Saray. Ia menulis buku 'Tamayiz' (Keistimewaan), menjabat sebagai duta besar di India, dan meninggal di Istanbul."
