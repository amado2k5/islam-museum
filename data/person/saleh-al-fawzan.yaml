summary:
  ar: "عالم وفقيه سعودي، وُلد في الشماسية بمنطقة القصيم سنة 1935، وهو المفتي العام للمملكة العربية السعودية ورئيس هيئة كبار العلماء منذ 22 أكتوبر 2025، رابع من تولى المنصب. تتلمذ على عبد العزيز بن باز، ودرّس في جامعة الإمام محمد بن سعود الإسلامية وكان أول حاصل على الدكتوراه منها، وله مؤلفات وفتاوى كثيرة."
  en: "Saudi scholar and jurist, born at Al-Shamasiyah in Al-Qassim Province in 1935; he has been Grand Mufti of Saudi Arabia and head of the Council of Senior Scholars since 22 October 2025, the fourth holder of the office. He studied under Abd al-Aziz ibn Baz, taught at Imam Muhammad ibn Saud Islamic University, whose first doctorate he earned, and has written many books and fatwas."
  ur: "سعودی عالم اور فقیہ، جو 1935 میں علاقہ قصیم کے قصبے الشماسیہ میں پیدا ہوئے؛ 22 اکتوبر 2025 سے سعودی عرب کے مفتی اعظم اور ہیئت کبار العلماء کے سربراہ ہیں، اس منصب کے چوتھے حامل۔ انہوں نے عبد العزیز بن باز سے تعلیم پائی، امام محمد بن سعود اسلامی یونیورسٹی میں تدریس کی اور اس کی پہلی ڈاکٹریٹ حاصل کی، اور ان کی کئی کتابیں اور فتوے ہیں۔"
