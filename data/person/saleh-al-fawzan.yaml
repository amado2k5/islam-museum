summary:
  ar: "عالم وفقيه سعودي، وُلد في الشماسية بمنطقة القصيم سنة 1935، وهو المفتي العام للمملكة العربية السعودية ورئيس هيئة كبار العلماء منذ 22 أكتوبر 2025، رابع من تولى المنصب. تتلمذ على عبد العزيز بن باز، ودرّس في جامعة الإمام محمد بن سعود الإسلامية وكان أول حاصل على الدكتوراه منها، وله مؤلفات وفتاوى كثيرة."
  en: "Saudi scholar and jurist, born at Al-Shamasiyah in Al-Qassim Province in 1935; he has been Grand Mufti of Saudi Arabia and head of the Council of Senior Scholars since 22 October 2025, the fourth holder of the office. He studied under Abd al-Aziz ibn Baz, taught at Imam Muhammad ibn Saud Islamic University, whose first doctorate he earned, and has written many books and fatwas."
  ur: "سعودی عالم اور فقیہ، جو 1935 میں علاقہ قصیم کے قصبے الشماسیہ میں پیدا ہوئے؛ 22 اکتوبر 2025 سے سعودی عرب کے مفتی اعظم اور ہیئت کبار العلماء کے سربراہ ہیں، اس منصب کے چوتھے حامل۔ انہوں نے عبد العزیز بن باز سے تعلیم پائی، امام محمد بن سعود اسلامی یونیورسٹی میں تدریس کی اور اس کی پہلی ڈاکٹریٹ حاصل کی، اور ان کی کئی کتابیں اور فتوے ہیں۔"
  es: "Erudito y jurista saudí, nacido en Al-Shamasiyah, provincia de Al-Qassim, en 1935. Desde el 22 de octubre de 2025, ostenta el cargo de Gran Muftí de Arabia Saudí y preside el Consejo de Altos Eruditos, siendo el cuarto titular del mismo. Estudió con Abd al-Aziz ibn Baz, impartió clases en la Universidad Islámica Imam Muhammad ibn Saud, donde obtuvo su primer doctorado, y es autor de numerosos libros y fatuas."
  fr: "Érudit et juriste saoudien, né à Al-Shamasiyah, dans la province d'Al-Qassim, en 1935, il est Grand Mufti d'Arabie saoudite et président du Conseil des grands oulémas depuis le 22 octobre 2025, le quatrième titulaire de cette fonction. Il a étudié auprès d'Abd al-Aziz ibn Baz, enseigné à l'Université islamique Imam Muhammad ibn Saud, où il a obtenu le premier doctorat, et est l'auteur de nombreux ouvrages et fatwas."
  tr: "1935 yılında Kasım bölgesindeki Al-Shamsiyah'ta doğan Suudi alim ve hukukçu olan Sher, 22 Ekim 2025'ten beri Suudi Arabistan Krallığı'nın Büyük Müftüsü ve Kıdemli Alimler Konseyi Başkanıdır; bu görevi yürüten dördüncü kişidir. Abdulaziz bin Baz'ın öğrencisi, İmam Muhammed bin Suud İslam Üniversitesi'nde eğitim aldı ve oradan doktora alan ilk kişi oldu. Birçok eser ve fetva yazdı."
  id: "Seorang ulama dan ahli hukum Saudi, lahir di Al-Shamsiyah di wilayah Qassim pada tahun 1935, ia adalah Mufti Agung Kerajaan Arab Saudi dan Ketua Dewan Ulama Senior sejak 22 Oktober 2025, menjadi yang keempat memegang posisi tersebut. Ia belajar di bawah bimbingan Abdulaziz bin Baz, belajar di Universitas Islam Imam Muhammad bin Saud, dan menjadi yang pertama meraih gelar doktor dari sana. Ia menulis banyak karya dan fatwa."
