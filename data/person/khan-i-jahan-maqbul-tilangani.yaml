summary:
  ar: "وزير فيروز شاه تغلق، كان ينوب عنه في العاصمة إذا خرج إلى الحروب، وتوفي سنة 770هـ/1368، وتنسب إليه سيما خان ابتكار مسقط المسجد ذي الأفنية الأربعة {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 53} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 71} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 72}."
  en: "Vizier of Firuz Shah Tughluq, who governed the capital when the sultan went on campaign and died in AH 770/1368; Seema Khan credits him with devising the four-court mosque plan {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 53} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 71} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 72}."
  ur: "فیروز شاہ تغلق کے وزیر، جو سلطان کی مہمات کے دوران دارالحکومت سنبھالتے تھے اور 770ھ/1368ء میں فوت ہوئے؛ سیما خان چار صحنوں والے مسجد کے نقشے کو ان کی ایجاد مانتی ہیں {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 53} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 71} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 72}۔"
  es: "Visir de Firuz Shah Tughluq, quien gobernó la capital cuando el sultán se fue de campaña y murió en AH 770/1368; Seema Khan le atribuye haber ideado el plano de la mezquita de cuatro patios {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 53} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 71} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 72}."
  fr: "Vizir de Firuz Shah Tughluq, qui gouverna la capitale lorsque le sultan partit en campagne et mourut en AH 770/1368; Seema Khan lui attribue la conception du plan de la mosquée à quatre cours {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 53} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 71} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 72}."
  tr: "Vezir Firuz Şah Tughlaq, savaşlara gittiğinde başkentteki yardımcısıydı ve 770 Hicri/1368 yılında öldü. Sima Khan, dört avlusuyla Maskat camii'nin icadı olarak kabul edilir {cite:seema-khan-camii-architecture-firuzshah-tughlaq-2011 s. 53} {cite:seema-khan-camii-architecture-firuzshah-tughlaq-2011 s. 72}."
  id: "Wazir Firuz Shah Tughlaq adalah wakilnya di ibu kota saat ia berperang, dan ia meninggal pada tahun 770 H/1368 M. Sima Khan diakui sebagai penemu masjid Muscat dengan empat halaman {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 53} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 72}."
