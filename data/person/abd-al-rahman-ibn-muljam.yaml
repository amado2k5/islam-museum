id: person/abd-al-rahman-ibn-muljam
class: person
label: { ar: "عبد الرحمن بن ملجم المرادي" }
aliases: [person/abd-al-rahman-ibn-muljim]
summary:
  ar: "من الخوارج، دبّر مع البرك بن عبد الله قتل علي بن أبي طالب ومعاوية {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. وعند السيوطي تعاهد الثلاثة بمكة على قتل الأمراء ليلة سبع عشرة من رمضان فتوجه ابن ملجم إلى الكوفة وضرب عليًا بالسيف على جبهته حين خرج ينادي بالصلاة فمات ليلة الأحد، وقطعت أطراف ابن ملجم وجعل في قوصرة وأحرق بالنار؛ وعشق امرأة من الخوارج اسمها قطام فأصدقها ثلاثة آلاف درهم وعبدًا وقينة وضرب علي بالسيف {cite:tarikh-khulafa-minhaj-1434 p. 295-296}. وعند المسعودي كان من تُجيب وكان عدادهم في مُراد، واختار هو علياً في المواعدة على الأمراء الثلاثة، وخطبه بمهر ابنة عمه قطام، فضربه على قرنه وهو يوقظ الناس للصلاة، فلما قطعوا يديه ورجليه وأحمى له عبد الله بن جعفر مسماراً فكحله به قال إنك لتكحل عمك بملمول الرصاص ثم أحرقوه {cite:muruj-al-dhahab p. 701-704}"
gender: male
