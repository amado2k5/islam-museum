id: person/abd-al-rahman-ibn-muljam
class: person
label: { ar: "عبد الرحمن بن ملجم المرادي", en: "Abd al-Rahman ibn Muljam al-Muradi", fr: "Abd al-Rahman ibn Muljam al-Muradi", es: "Abd al-Rahman ibn Muljam al-Muradi", ur: "عبدالرحمٰن بن ملجم المرادی" }
aliases: [person/abd-al-rahman-ibn-muljim]
summary:
  ar: "من الخوارج، دبّر مع البرك بن عبد الله قتل علي بن أبي طالب ومعاوية {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. وعند السيوطي تعاهد الثلاثة بمكة على قتل الأمراء ليلة سبع عشرة من رمضان فتوجه ابن ملجم إلى الكوفة وضرب عليًا بالسيف على جبهته حين خرج ينادي بالصلاة فمات ليلة الأحد، وقطعت أطراف ابن ملجم وجعل في قوصرة وأحرق بالنار؛ وعشق امرأة من الخوارج اسمها قطام فأصدقها ثلاثة آلاف درهم وعبدًا وقينة وضرب علي بالسيف {cite:tarikh-khulafa-minhaj-1434 p. 295-296}. وعند المسعودي كان من تُجيب وكان عدادهم في مُراد، واختار هو علياً في المواعدة على الأمراء الثلاثة، وخطبه بمهر ابنة عمه قطام، فضربه على قرنه وهو يوقظ الناس للصلاة، فلما قطعوا يديه ورجليه وأحمى له عبد الله بن جعفر مسماراً فكحله به قال إنك لتكحل عمك بملمول الرصاص ثم أحرقوه {cite:muruj-al-dhahab p. 701-704}"
  en: "One of the Kharijites, who plotted with al-Barak ibn Abd Allah to kill Ali ibn Abi Talib and Mu'awiya {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. According to al-Suyuti, the three agreed in Mecca to kill the leaders on the night of 17 Ramadan. Ibn Muljam went to Kufa and struck Ali on the forehead with a sword as he came out calling people to prayer, and Ali died on Sunday night. Ibn Muljam's extremities were cut off; he was put in a basket and burned with fire. He had fallen in love with a Kharijite woman named Qatam, and he gave her a dowry of three thousand dirhams, a slave and a singing-girl, and then struck Ali with the sword {cite:tarikh-khulafa-minhaj-1434 p. 295-296}. According to al-Mas'udi, he was of the Tujib, but his reckoning was among Murad; he chose Ali as one of the targets of the pact against the three leaders, and sought in marriage Qatam, his paternal cousin, for her dowry, then struck Ali on the head as he was waking people for the prayer. When they had cut off his hands and feet, Abd Allah ibn Ja'far heated a nail and applied it to his eyes as kohl, and Ibn Muljam said: 'You are applying molten lead to your uncle's eye.' Then they burned him {cite:muruj-al-dhahab p. 701-704}."
  fr: "L'un des kharijites, qui complota avec al-Barak ibn Abd Allah de tuer Ali ibn Abi Talib et Mu'awiya {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. Selon al-Suyuti, les trois convinrent à La Mecque de tuer les chefs la nuit du 17 ramadan. Ibn Muljam se rendit à Koufa et frappa Ali au front d'un coup d'épée alors qu'il sortait appeler les gens à la prière, et Ali mourut dans la nuit du dimanche. On coupa les extrémités d'Ibn Muljam ; on le mit dans un panier et on le brûla. Il s'était épris d'une kharijite nommée Qatam, à qui il donna pour dot trois mille dirhams, un esclave et une chanteuse, puis il frappa Ali de l'épée {cite:tarikh-khulafa-minhaj-1434 p. 295-296}. Selon al-Mas'udi, il était des Tujib, mais compté parmi les Murad ; il choisit Ali comme l'une des cibles du pacte contre les trois chefs, et demanda en mariage Qatam, sa cousine paternelle, pour sa dot, puis frappa Ali à la tête alors qu'il réveillait les gens pour la prière. Lorsqu'on lui eut coupé les mains et les pieds, Abd Allah ibn Ja'far chauffa un clou et le lui appliqua sur les yeux comme du khôl, et Ibn Muljam dit : « Tu appliques du plomb fondu sur l'œil de ton oncle. » Puis on le brûla {cite:muruj-al-dhahab p. 701-704}."
  es: "Uno de los jariyitas, que conspiró con al-Barak ibn Abd Allah para matar a Ali ibn Abi Talib y Mu'awiya {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. Según al-Suyuti, los tres acordaron en La Meca matar a los líderes la noche del 17 de Ramadán. Ibn Muljam fue a Kufa y golpeó a Ali en la frente con una espada cuando salía llamando a la gente a la oración, y Ali murió la noche del domingo. A Ibn Muljam le cortaron las extremidades; lo pusieron en una cesta y lo quemaron con fuego. Se había enamorado de una mujer jariyí llamada Qatam, y le dio una dote de tres mil dirhams, una esclava y una cantante, y luego golpeó a Ali con la espada {cite:tarikh-khulafa-minhaj-1434 p. 295-296}. Según al-Mas'udi, era de los Tujib, pero su cuenta estaba entre los Murad; eligió a Ali como uno de los objetivos del pacto contra los tres líderes, y pidió en matrimonio a Qatam, su prima paterna, por su dote, luego golpeó a Ali en la cabeza mientras despertaba a la gente para la oración. Cuando le cortaron las manos y los pies, Abd Allah ibn Ja'far calentó un clavo y se lo aplicó en los ojos como kohl, e Ibn Muljam dijo: 'Estás aplicando plomo fundido en el ojo de tu tío'. Luego lo quemaron {cite:muruj-al-dhahab p. 701-704}."
  ur: "خارجیوں میں سے ایک، جس نے البرک ابن عبد اللہ کے ساتھ مل کر علی ابن ابی طالب اور معاویہ کو قتل کرنے کی سازش کی تھی۔ السیوطی کے مطابق، تینوں نے مکہ میں 17 رمضان کی رات رہنماؤں کو قتل کرنے پر اتفاق کیا۔ ابن ملجم کوفہ گئے اور علی کے ماتھے پر تلوار ماری جب وہ لوگوں کو نماز کے لیے پکارتے ہوئے نکلے اور اتوار کی رات علی کا انتقال ہوگیا۔ ابن ملجم کے ہاتھ کاٹ دیے گئے۔ اسے ایک ٹوکری میں ڈال کر آگ سے جلا دیا گیا۔ اسے قطم نامی ایک خارجی عورت سے محبت ہو گئی تھی اور اس نے اسے تین ہزار درہم کا جہیز، ایک لونڈی اور ایک گانے والی لڑکی دی اور پھر علی کو تلوار سے مارا۔ 295-296}۔ المسعودی کے مطابق، وہ تزیب میں سے تھے، لیکن ان کا شمار مراد میں سے تھا۔ اس نے تینوں رہنماؤں کے خلاف معاہدے کے ہدف میں سے ایک کے طور پر علی کو منتخب کیا، اور اپنے پھوپھی زاد بھائی قطم سے اس کے جہیز کے لیے شادی کی کوشش کی، پھر علی کے سر پر اس وقت مارا جب وہ لوگوں کو نماز کے لیے جگا رہا تھا۔ جب وہ اس کے ہاتھ پاؤں کاٹ چکے تو عبداللہ بن جعفر نے ایک کیل گرم کر کے اس کی آنکھوں میں سرمہ لگایا اور ابن ملجم نے کہا: تم اپنے چچا کی آنکھ میں پگھلا ہوا سیسہ لگا رہے ہو۔ پھر انہوں نے اسے جلادیا 701-704}۔"
  tr: "O, Haricilerden biriydi ve Ali ibn Abi Talib ve Muaviye'yi öldürmek için el-Barak ibn Abdullah ile komplo kurdu. {Kaynak:tabari-tarikh-abu-al-fadl c.5 s.143} {Kaynak:tabari-tarikh-abu-al-fadl c.5 s.144}. El-Suyuti'ye göre, üçü de Ramazan'ın on yedinci gecesi yöneticileri öldürmek için Mekke'de bir anlaşma yaptılar. İbn Mulcem Kufa'ya gitti ve ezan okumaya çıkan Ali'yi alnından kılıçla vurdu ve Ali Pazar gecesi öldü. İbn Mulcem'in uzuvları kesildi, bir sepete konuldu ve ateşte yakıldı. Katam adında bir Harici kadına aşık oldu ve ona üç bin dirhem mehir, bir köle ve bir cariye verdi. Sonra Ali'yi kılıçla vurdu. {cite:tarikh-khulafa-minhaj-1434 s. 295-296}. Ve El-Mas'udi'ye göre, o da karşılık verenlerden biriydi ve sayıları Murad'daydı. Üç prens arasından Ali'yi seçti ve kuzeni Katam'ın mehiriyle ona evlenme teklif etti. Bunun üzerine, insanları namaza uyandırırken başına vurdu. Ellerini ve ayaklarını kestiklerinde, Abdullah bin Cafer ona bir çivi ısıtıp gözlerine sürdü. \"Amcanızın gözlerine kurşun sürüyorsunuz\" dedi. Sonra onu yaktılar. {cite:muruj-al-dhahab s. 701-704}"
  id: "Dia adalah salah satu dari kaum Kharijites, dan dia bersekongkol dengan al-Barak ibn Abdullah untuk membunuh Ali ibn Abi Talib dan Muawiyah. {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. Menurut al-Suyuti, mereka bertiga membuat perjanjian di Mekah untuk membunuh para penguasa pada malam tanggal tujuh belas Ramadan. Ibn Muljam pergi ke Kufa dan menebas Ali dengan pedang di dahinya ketika ia keluar untuk mengumandangkan azan, dan ia meninggal pada Minggu malam. Anggota tubuh Ibn Muljam dipotong, dan ia ditempatkan dalam keranjang dan dibakar dengan api. Dia jatuh cinta dengan seorang wanita Kharijites bernama Qatam, dan memberinya mahar tiga ribu dirham, seorang budak, dan seorang budak perempuan. Kemudian dia menebas Ali dengan pedang. {cite:tarikh-khulafa-minhaj-1434 hlm. 295-296}. Dan menurut Al-Mas’udi, dia adalah salah satu dari mereka yang menanggapi dan jumlah mereka ada di Murad, dan dia memilih Ali dalam penunjukan tersebut daripada tiga pangeran, dan melamarnya dengan mahar sepupunya Qatam, lalu dia memukul kepalanya ketika dia sedang membangunkan orang-orang untuk salat, sehingga ketika mereka memotong tangan dan kakinya dan Abdullah bin Ja’far memanaskan paku untuknya dan menempelkannya ke matanya, dia berkata, “Kalian menempelkan timah ke mata pamanmu,” lalu mereka membakarnya. {cite:muruj-al-dhahab hlm. 701-704}"
