label: { ar: "عبد الرحمن بن ملجم المرادي", en: "Abd al-Rahman ibn Muljam al-Muradi" }
aliases: [person/abd-al-rahman-ibn-muljim]
summary:
  ar: "من الخوارج، دبّر مع البرك بن عبد الله قتل علي بن أبي طالب ومعاوية {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. وعند السيوطي تعاهد الثلاثة بمكة على قتل الأمراء ليلة سبع عشرة من رمضان فتوجه ابن ملجم إلى الكوفة وضرب عليًا بالسيف على جبهته حين خرج ينادي بالصلاة فمات ليلة الأحد، وقطعت أطراف ابن ملجم وجعل في قوصرة وأحرق بالنار؛ وعشق امرأة من الخوارج اسمها قطام فأصدقها ثلاثة آلاف درهم وعبدًا وقينة وضرب علي بالسيف {cite:tarikh-khulafa-minhaj-1434 p. 295-296}. وعند المسعودي كان من تُجيب وكان عدادهم في مُراد، واختار هو علياً في المواعدة على الأمراء الثلاثة، وخطبه بمهر ابنة عمه قطام، فضربه على قرنه وهو يوقظ الناس للصلاة، فلما قطعوا يديه ورجليه وأحمى له عبد الله بن جعفر مسماراً فكحله به قال إنك لتكحل عمك بملمول الرصاص ثم أحرقوه {cite:muruj-al-dhahab p. 701-704}"
  en: "One of the Kharijites, who plotted with al-Barak ibn Abd Allah to kill Ali ibn Abi Talib and Mu'awiya {cite:tabari-tarikh-abu-al-fadl j.5 p.143} {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. According to al-Suyuti, the three agreed in Mecca to kill the leaders on the night of 17 Ramadan. Ibn Muljam went to Kufa and struck Ali on the forehead with a sword as he came out calling people to prayer, and Ali died on Sunday night. Ibn Muljam's extremities were cut off; he was put in a basket and burned with fire. He had fallen in love with a Kharijite woman named Qatam, and he gave her a dowry of three thousand dirhams, a slave and a singing-girl, and then struck Ali with the sword {cite:tarikh-khulafa-minhaj-1434 p. 295-296}. According to al-Mas'udi, he was of the Tujib, but his reckoning was among Murad; he chose Ali as one of the targets of the pact against the three leaders, and sought in marriage Qatam, his paternal cousin, for her dowry, then struck Ali on the head as he was waking people for the prayer. When they had cut off his hands and feet, Abd Allah ibn Ja'far heated a nail and applied it to his eyes as kohl, and Ibn Muljam said: 'You are applying molten lead to your uncle's eye.' Then they burned him {cite:muruj-al-dhahab p. 701-704}."
