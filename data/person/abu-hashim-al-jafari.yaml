class: person
label: { ar: "أبو هاشم الجعفري", en: "Abu Hashim al-Ja'fari" }
summary:
  ar: "داود بن القاسم بن إسحاق بن عبد الله بن جعفر بن أبي طالب بينه وبين جعفر الطيار ثلاثة آباء، لم يكن يعرف أقعد نسباً في آل أبي طالب وسائر بني هاشم وقريش منه، وكان ذا زهد وورع وعلم صحيح العقل وقبره مشهور، دخل على محمد بن عبد الله بن طاهر في المهنئين بقتل يحيى بن عمر فقال إنك لتهنأ بقتل رجل لو كان رسول الله حياً لعزي به وخرج وهو يقول يا بني طاهر كلوه وبياً إن لحم النبي غير مريء إن وتراً يكون طالبه الله لوتر بالفوت غير حري {cite:muruj-al-dhahab p. 530-531}."
  en: "The senior-most Ja'farid of his day — who told Ibn Tahir at the congratulations 'you are feted for killing a man the Prophet would have been condoled for' {cite:muruj-al-dhahab p. 530-531}."
