label: { ar: "أبو هاشم الجعفري", en: "Abu Hashim al-Ja'fari", fr: "Abu Hashim al-Ja'fari", es: "Abu Hashim al-Ja'fari", ur: "ابو ہاشم الجعفری" }
summary:
  ar: "داود بن القاسم بن إسحاق بن عبد الله بن جعفر بن أبي طالب بينه وبين جعفر الطيار ثلاثة آباء، لم يكن يعرف أقعد نسباً في آل أبي طالب وسائر بني هاشم وقريش منه، وكان ذا زهد وورع وعلم صحيح العقل وقبره مشهور، دخل على محمد بن عبد الله بن طاهر في المهنئين بقتل يحيى بن عمر فقال إنك لتهنأ بقتل رجل لو كان رسول الله حياً لعزي به وخرج وهو يقول يا بني طاهر كلوه وبياً إن لحم النبي غير مريء إن وتراً يكون طالبه الله لوتر بالفوت غير حري {cite:muruj-al-dhahab p. 530-531}."
  en: "The senior-most Ja'farid of his day — who told Ibn Tahir at the congratulations 'you are feted for killing a man the Prophet would have been condoled for' {cite:muruj-al-dhahab p. 530-531}."
  fr: "Le plus éminent des Ja'farides de son temps — qui dit à Ibn Tahir, lors des félicitations, « on te fête pour avoir tué un homme pour lequel on aurait présenté des condoléances au Prophète » {cite:muruj-al-dhahab p. 530-531}."
  es: "El Ja'farid de mayor rango de su época, quien le dijo a Ibn Tahir en las felicitaciones: \"Se le celebra por matar a un hombre por el que el Profeta habría recibido condolencias\" {cite:muruj-al-dhahab p. 530-531}."
  ur: "اپنے دور کا سب سے سینئر جعفری - جس نے ابن طاہر کو مبارکباد کے موقع پر کہا تھا کہ 'تمہیں ایک شخص کے قتل کرنے کا اعزاز حاصل ہے' ⁦(حوالہ: مروج الذہب ص)⁩ 530-531}۔"
