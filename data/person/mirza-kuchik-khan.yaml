summary:
  ar: "ثوري إيراني (1880–1921) من رشت في گيلان، درس في الحوزة في شبابه، أسس نهضة جنگل في غابات گيلان سنة 1914-15، وقاتل القوات الروسية والبريطانية والحكومية، وصار سنة 1920 رئيس جمهورية گيلان السوفيتية قصيرة العمر، ثم مات هاربًا في جبال طالش في ديسمبر 1921."
  en: "Iranian revolutionary (1880–1921) from Rasht in Gilan, seminary-trained in youth, who founded the Jangal (Jungle) movement in the forests of Gilan in 1914-15, fought Russian, British and government forces, and in 1920 became president of the short-lived Soviet Republic of Gilan before dying in flight in the Talesh mountains."
  ur: "رشت، گیلان کے ایرانی انقلابی (1880–1921)؛ جوانی میں حوزوی تعلیم پائی، 1914-15 میں گیلان کے جنگلوں میں نہضتِ جنگل کی بنیاد رکھی، روسی، برطانوی اور سرکاری افواج سے لڑے، 1920 میں گیلان کی قلیل مدتی سوویت جمہوریہ کے صدر بنے، اور فرار کے دوران طالش کے پہاڑوں میں وفات پائی۔"
