summary:
  ar: "كاتب وداعية إندونيسي، وُلد في 21 مارس 1984. اشتهر بكتابه Nikmatnya Pacaran Setelah Pernikahan ⁦(2003)⁩، وهو أول كتاب نشرته دار برو-يو ميديا للنشر والدعوة التي أسّسها. وهو ناشط في مسجد جوغوكاريان بيوجياكارتا حيث يشرف على مجلس جيجاك نبي لدراسة السيرة، وتختصّ دعوته بالتاريخ الإسلامي الذي تدرسه الكتابة الأكاديمية الحديثة على يوتيوب. بلغ حسابه في إكس 582,000 متابع في زحف مرآة Instalker نحو 10 نوفمبر 2026."
  en: "Indonesian author and preacher, born on 21 March 1984. He became known with his book Nikmatnya Pacaran Setelah Pernikahan (2003), the first book published by Pro-U Media, the publishing and dawah house he founded. He is an activist of Masjid Jogokariyan in Yogyakarta, where he leads the Majelis Jejak Nabi study circle on the Prophet's biography, and his dawah specialises in Islamic history, which recent academic writing studies on YouTube. His X account counted 582,000 followers in an Instalker mirror crawl of about 10 November 2026."
  ur: "انڈونیشیائی مصنف اور مبلغ، جو 21 مارچ 1984ء کو پیدا ہوا۔ وہ اپنی کتاب ⁦(2003ء)⁩ سے مشہور ہوا، جو اس کے قائم کردہ اشاعتی و دعوتی ادارے پرو-یو میڈیا کی پہلی کتاب تھی۔ وہ یوگیاکارتا کی مسجد جوگوکاریان کا فعال رکن ہے جہاں وہ سیرت کے مطالعہ حلقے مجلس جیجاک نبی کا نگران ہے، اور اس کی دعوت کا خاص موضوع اسلامی تاریخ ہے جس کا جدید علمی تحریریں یوٹیوب پر مطالعہ کرتی ہیں۔ اس کے ایکس اکاؤنٹ کے فالوور Instalker کی مرآة خوانی ⁦(تقریباً 10 نومبر 2026ء)⁩ میں 582,000 تھے۔"
  es: "Autor y predicador indonesio, nacido el 21 de marzo de 1984. Se dio a conocer con su libro Nikmatnya Pacaran Setelah Pernikahan (2003), el primer libro publicado por Pro-U Media, la editorial y casa de prédica islámica que fundó. Es activista de la Mezquita Jogokariyan en Yogyakarta, donde dirige el círculo de estudio Majelis Jejak Nabi sobre la biografía del Profeta, y su prédica islámica se especializa en historia islámica, sobre la cual ha publicado estudios académicos recientes en YouTube. Su cuenta X contaba con 582.000 seguidores en un rastreo de Instalker realizado alrededor del 10 de noviembre de 2026."
  fr: "Auteur et prédicateur indonésien, né le 21 mars 1984, il s'est fait connaître grâce à son livre « Nikmatnya Pacaran Setelah Pernikahan » (2003), premier ouvrage publié par Pro-U Media, maison d'édition et de prédication qu'il a fondée. Militant à la mosquée Jogokariyan de Yogyakarta, il y anime le cercle d'étude « Majelis Jejak Nabi » consacré à la biographie du Prophète. Sa prédication est axée sur l'histoire islamique, sujet qu'il aborde notamment à travers des études universitaires récentes diffusées sur YouTube. Son compte X comptait 582 000 abonnés lors d'une recherche effectuée par Instalker aux alentours du 10 novembre 2026."
