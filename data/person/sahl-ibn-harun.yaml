summary:
  ar: "سهل بن هارون، صاحب بيت الحكمة وكاتب على خزائن الحكمة؛ يذكر ابن نباتة أن المأمون جعله خازناً لخزانة كتب اليونان التي حُملت من قبرص، وكانت كتب الفلاسفة التي نُقلت للمأمون من جزيرة قبرص لما هادن صاحبها وطلب منه تلك الخزانة المجموعة في بيت لا يظهر عليه أحد {cite:duha-islam p. 427}. وكان من شعراء العربية المحدثين ومن المتهمين بالشعوبية {cite:duha-islam p. 435}."
  en: "Sahl ibn Harun — keeper of the Bayt al-Hikma under al-Ma'mun, charged with the hoard of Greek philosophical books fetched from Cyprus {cite:duha-islam p. 427}."
  es: "Sahl ibn Harun — guardián de la Bayt al-Hikma bajo al-Ma'mun, encargado del tesoro de libros filosóficos griegos traídos de Chipre {cite:duha-islam p. 427}."
  fr: "Sahl ibn Harun — gardien du Bayt al-Hikma sous al-Ma'mun, chargé du trésor de livres philosophiques grecs rapportés de Chypre {cite:duha-islam p. 427}."
  ur: "سہل بن ہارون - المامون کے ماتحت بیت الحکمہ کے محافظ، قبرص سے لائی گئی یونانی فلسفیانہ کتابوں کے ذخیرے کا الزام۔ 427}۔"
  tr: "Beyt al-Hikma'nın sahibi ve hikmet hazinesinin kâtipi Sahl bin Harun, el-Memun'un onu Kıbrıs'tan getirilen Yunan kitaplarının hazinesinin koruyucusu yaptığını belirtir. Filozofların kitapları, sahipleri Kıbrıs adasından el-Memun'a nakledildi; bu hazine, kimsenin göremeyeceği bir evde toplandı {atıf:Duha-İslam, s. 427}. Modern Arap şairleri arasındaydı ve şuubiyye ile suçlanıyordu {atıf:Duha-İslam, s. 435}."
  id: "Sahl ibn Harun, pemilik Bayt al-Hikma dan juru tulis di harta kebijaksanaan, menyebutkan bahwa al-Ma'mun menjadikannya penjaga harta karun buku-buku Yunani yang dibawa dari Siprus. Buku-buku filsuf dipindahkan kepada al-Ma'mun dari pulau Siprus ketika pemiliknya menenangkan dan meminta harta karun itu, yang dikumpulkan di sebuah rumah yang tidak dapat dilihat siapa pun {cite:Duha-Islam, hlm. 427}. Ia termasuk di antara penyair Arab modern dan dituduh melakukan shu'ubiyyah {cite:Duha-Islam, hlm. 435}."
