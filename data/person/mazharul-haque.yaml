summary:
  ar: "محامٍ ومربٍّ وناشط استقلال هندي (1866–1930) من بهبورة قرب باتنا. درس القانون في لندن، وكان من مهندسي معاهدة الكونغرس والرابطة سنة 1916، وشارك في ستياغراها تشامباران وحركة الخلافة، وأسس «صداقت آشرم» في باتنا ومجلة «الوطن الأم»، وعُرف طوال حياته بدعوته إلى الوحدة الهندوسية الإسلامية."
  en: "Indian lawyer, educator and independence activist (1866–1930) from Bahpura near Patna. He studied law in London, helped make the 1916 Congress–League pact, took part in the Champaran Satyagraha and the Khilafat movement, founded the Sadaqat Ashram at Patna and the Motherland magazine, and argued all his life for Hindu–Muslim unity."
  ur: "پٹنہ کے قریب بہ پورہ سے تعلق رکھنے والے ہندوستانی وکیل، ماہرِ تعلیم اور کارکنِ آزادی ⁦(1866ء–1930ء)⁩۔ انھوں نے لندن میں قانون پڑھا، 1916ء کے کانگریس لیگ معاہدے میں کردار ادا کیا، چمپارن ستیہ گرہ اور تحریکِ خلافت میں حصہ لیا، پٹنہ میں «صداقت آشرم» اور رسالہ «مدر لینڈ» قائم کیا، اور ساری زندگی ہندو مسلم اتحاد کی وکالت کی۔"
