label:
  ar: الداعي بن أبي السعود بن الزريع
  en: al-Da'i ibn Abi al-Su'ud ibn al-Zuray'
summary:
  ar: "الداعي بن أبي السعود بن الزريع بن العباس بن المكرم الهمداني؛ أول مذكور من بني الزريع وأول من اجتمع له الملك بعد بني الصليحي، استولى على عدن من يد صاحب الزعازع بعد مقاساة ونفقات في الأعراب، ومات بعد فتحها بسبعة أشهر سنة ثلاث وثلاثين وخمسمائة، فولي ابنه الأغر."
  en: "Al-Da'i ibn Abi al-Su'ud ibn al-Zuray' ibn al-Abbas ibn al-Mukarram al-Hamdani; the first named of Banu al-Zuray' and the first to gather the kingship after Banu al-Sulayhi — he took Aden from the lord of al-Za'azi' after hard campaigning and Arab subsidies, then died seven months after the conquest in 533, succeeded by his son al-Agharr."
