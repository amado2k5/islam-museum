id: person/al-dai-ibn-zuray
class: person
label:
  ar: الداعي بن أبي السعود بن الزريع
  en: al-Da'i ibn Abi al-Su'ud ibn al-Zuray'
  fr: "Al-Da’i ibn Abi al-Su’ud ibn al-Zuray’"
  es: "al-Da'i ibn Abi al-Su'ud ibn al-Zuray'"
  ur: "الدعی ابن ابی السعود ابن الزرعی"
summary:
  ar: "الداعي بن أبي السعود بن الزريع بن العباس بن المكرم الهمداني؛ أول مذكور من بني الزريع وأول من اجتمع له الملك بعد بني الصليحي، استولى على عدن من يد صاحب الزعازع بعد مقاساة ونفقات في الأعراب، ومات بعد فتحها بسبعة أشهر سنة ثلاث وثلاثين وخمسمائة، فولي ابنه الأغر."
  en: "Al-Da'i ibn Abi al-Su'ud ibn al-Zuray' ibn al-Abbas ibn al-Mukarram al-Hamdani; the first named of Banu al-Zuray' and the first to gather the kingship after Banu al-Sulayhi — he took Aden from the lord of al-Za'azi' after hard campaigning and Arab subsidies, then died seven months after the conquest in 533, succeeded by his son al-Agharr."
  fr: "Al-Da’i ibn Abi al-Su’ud ibn al-Zuray’ ibn al-Abbas ibn al-Mukarram al-Hamdani ; premier nommé des Banu al-Zuray’ et premier à réunir la royauté après les Banu al-Sulayhi — il prit Aden au seigneur d’al-Za’azi’ après de dures campagnes et des subsides aux Arabes, puis mourut sept mois après la conquête, en 533 H ; son fils al-Agharr lui succéda."
  es: "Al-Da'i ibn Abi al-Su'ud ibn al-Zuray' ibn al-Abbas ibn al-Mukarram al-Hamdani; el primero de Banu al-Zuray' y el primero en reunir el trono después de Banu al-Sulayhi: tomó Adén del señor de al-Za'azi' después de una dura campaña y subsidios árabes, luego murió siete meses después de la conquista en 533, siendo sucedido por su hijo al-Agharr."
  ur: "الدعی ابن ابی السعود ابن الزرعی ابن العباس ابن المکرم الحمدانی؛ بنو الزرعی کا پہلا نام اور بنو الصالحی کے بعد سب سے پہلے بادشاہی جمع کرنے والا - اس نے سخت مہم اور عرب سبسڈی کے بعد عدن کو الزعزی کے مالک سے لیا، پھر فتح کے سات ماہ بعد 533 میں انتقال کر گیا، اس کے بعد اس کا بیٹا الاثر اس کا جانشین بنا۔"
