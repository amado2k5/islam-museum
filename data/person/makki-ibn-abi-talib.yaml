born: { edtf: "0966", hijri: "0355", calendar: julian, precision: month, status: tradition, derived: true, note: "ولد بالقيروان عند طلوع الشمس أو قبل طلوعها بقليل من شعبان سنة خمس وخمسين وثلاثمائة، وقال أبو عمرو الداني: ولد سنة أربع وخمسين {cite:wafayat-ayan}." }
died: { edtf: "1045", hijri: "0437", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم السبت عند صلاة الفجر ودفن يوم الأحد ضحوة لليلتين خلتا من المحرم سنة سبع وثلاثين وأربعمائة بقرطبة ودفن بالربض، وصلى عليه ولده أبو الطيب محمد {cite:wafayat-ayan}." }
summary:
  ar: "أبو محمد مكي بن أبي طالب بن حموش القيسي المقرئ؛ أصله من القيروان وانتقل إلى الأندلس وسكن قرطبة، من أهل التبحر في علوم القرآن والعربية، حسن الفهم والخلق، كثير التصانيف في علم القرآن محكماً لذلك وجوداً، عالماً بالقراءات السبع ومعانيها؛ هاجر إلى مصر وهو ابن ثلاث عشرة سنة واختلف إلى المؤدبين، واستكمل القرآن بالقيروان سنة أربع وسبعين وثلاثمائة، ثم عاد إلى مصر ثانية سنة سبع وسبعين {cite:wafayat-ayan}."
  en: "Makki b. Abi Talib (355–437) — the Qayrawani-Cordoban master qari'; went to Egypt at thirteen, completed the Qur'an at Qayrawan in 374, and authored many works on Qur'anic science and the seven readings {cite:wafayat-ayan}."
