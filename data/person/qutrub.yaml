  ar: "أبو علي محمد بن المستنير بن أحمد البصري اللغوي المشتهر بقطرب؛ أخذ الأدب عن سيبويه وجماعة من العلماء البصريين وكان يبكّر إلى سيبويه قبل حضور التلامذة فقال له يوماً ما أنت إلا قطرب ليل فبقي عليه هذا اللقب، وكان مع أولاد أبي عكيف العجلي؛ من تصانيفه كتاب معاني القرآن والاشتقاق والقوافي والنوادر والأزمنة والفرق والأصوات والصفات والعلل والأضداد وخلق الفرس وخلق الإنسان وغريب الحديث والهمز وفعل وأفعل والرد على الملحدين في تشابه القرآن؛ وهو أول من وضع المثلث في اللغة {cite:wafayat-ayan}."
