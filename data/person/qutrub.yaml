summary:
  ar: "أبو علي محمد بن المستنير بن أحمد البصري اللغوي المشتهر بقطرب؛ أخذ الأدب عن سيبويه وجماعة من العلماء البصريين وكان يبكّر إلى سيبويه قبل حضور التلامذة فقال له يوماً ما أنت إلا قطرب ليل فبقي عليه هذا اللقب، وكان مع أولاد أبي عكيف العجلي؛ من تصانيفه كتاب معاني القرآن والاشتقاق والقوافي والنوادر والأزمنة والفرق والأصوات والصفات والعلل والأضداد وخلق الفرس وخلق الإنسان وغريب الحديث والهمز وفعل وأفعل والرد على الملحدين في تشابه القرآن؛ وهو أول من وضع المثلث في اللغة {cite:wafayat-ayan}."
  tr: "Ebu Ali Muhammed bin Mustanir ibn Ahmad al-Basri, Kutrib olarak bilinen dilbilimci, Sibawayh ve bir grup Basran aliminden edebiyat öğrenmiştir. Öğrenciler gelmeden önce Sibawayh'i erken ziyaret eder ve bir gün ona, 'Sen gece Qutrab'sın.' dedi. Bu unvan onunla kaldı. Ebu 'Akif al-'Acli'nin çocuklarıyla birlikteydi; eserleri arasında 'Kur'an'ın Anlamları' adlı kitap da vardır: 'Türeme', 'Kafiyeler', 'Nadir', 'El-Zamanah', 'Mezhepler', 'Nitelikler', 'Nedenler', 'Zıttı', 'Halef el-Faras', 'Halef el-Man', 'Gharib al-Hadis', 'Hamzah', 'Fa'al' ve 'Kur'an'ın Benzerliği Üzerine Ateistlerin Çürütülmesi.' Üçgeni {atıf:wafayat-ayan} dilinde ilk kuran oydu."
  id: "Abu Ali Muhammad ibn al-Mustanir ibn Ahmad al-Basri, ahli bahasa yang dikenal sebagai Qutrib, mempelajari sastra dari Sibawayh dan sekelompok ulama Basran. Ia biasa mengunjungi Sibawayh lebih awal sebelum para murid tiba, dan suatu hari ia berkata kepadanya, 'Kamu tidak lebih dari Qutrab di malam hari.' Gelar ini tetap melekat padanya. Ia bersama anak-anak Abu 'Akif al-'Ajli; di antara karyanya adalah buku 'Makna Al-Qur'an,' 'Derivasi,' 'Rima,' 'Nadir,' 'Al-Zamanah,' 'Sekte,' 'Atribut,' 'Sebab,' 'Antitesis,' 'Khalef al-Faras,' 'Khalef al-Man,' 'Gharib al-Hadith,' 'Hamzah,' 'Fa'al,' dan 'Refutasi Ateis tentang Kesamaan Al-Qur'an.' Ia adalah yang pertama menetapkan segitiga dalam bahasa {cite:wafayat-ayan}."
