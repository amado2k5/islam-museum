gender: female
roles: [poet, musician]
summary:
  ar: "علية بنت المهدي العباسية ⁦(160–210هـ)⁩، أخت هارون الرشيد، شاعرة مجيدة تصوغ الألحان، وصفها الحصري بأنها تعدل كثيراً من أفاضل الرجال في العقل وحسن المقال؛ ويروي إبراهيم بن إسماعيل الكاتب أنها كانت لا تغني إلا في أيام عذرها عن الصلاة، ولها ديوان شعر، وصلى عليها المأمون."
  en: "Ulayya bint al-Mahdi (160–210 AH), Abbasid princess and sister of Harun al-Rashid, a fine poet who set her verses to music; al-Husri said she equalled many distinguished men in intelligence and speech, and Ibrahim ibn Isma'il the secretary reports that she sang only when excused from prayer. She left a diwan, and al-Ma'mun led her funeral prayer."
  es: "Ulayya bint al-Mahdi (160-210 AH), princesa abasí y hermana de Harun al-Rashid, fue una excelente poetisa que musicalizó sus versos. Al-Husri afirmó que igualaba en inteligencia y oratoria a muchos hombres distinguidos, e Ibrahim ibn Isma'il, el secretario, relata que solo cantaba cuando estaba exenta de la oración. Dejó un diván, y al-Ma'mun dirigió su oración fúnebre."
  fr: "Ulayya bint al-Mahdi (160-210 AH), princesse abbasside et sœur de Harun al-Rashid, était une poétesse de talent qui mit ses vers en musique. Al-Husri affirmait qu'elle égalait en intelligence et en éloquence nombre d'hommes illustres, et Ibrahim ibn Isma'il, son secrétaire, rapporte qu'elle ne chantait que lorsqu'elle était dispensée de la prière. Elle laissa un diwan, et al-Ma'mun dirigea la prière funéraire."
  ur: "الیہ بنت المہدی ⁦(160-210 ہجری)⁩، عباسی شہزادی اور ہارون الرشید کی بہن، ایک عمدہ شاعر جس نے اپنی آیات کو موسیقی پر ترتیب دیا؛ الحسری نے کہا کہ وہ ذہانت اور تقریر میں بہت سے ممتاز آدمیوں کے برابر ہے، اور ابراہیم بن اسماعیل سکریٹری بتاتے ہیں کہ وہ صرف نماز سے عذر کے وقت گاتی تھیں۔ اس نے ایک دیوان چھوڑا، اور المامون نے اس کی نماز جنازہ پڑھائی۔"
