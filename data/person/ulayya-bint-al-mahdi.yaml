summary:
  ar: "علية بنت المهدي العباسية ⁦(160–210هـ)⁩، أخت هارون الرشيد، شاعرة مجيدة تصوغ الألحان، وصفها الحصري بأنها تعدل كثيراً من أفاضل الرجال في العقل وحسن المقال؛ ويروي إبراهيم بن إسماعيل الكاتب أنها كانت لا تغني إلا في أيام عذرها عن الصلاة، ولها ديوان شعر، وصلى عليها المأمون."
  en: "Ulayya bint al-Mahdi (160–210 AH), Abbasid princess and sister of Harun al-Rashid, a fine poet who set her verses to music; al-Husri said she equalled many distinguished men in intelligence and speech, and Ibrahim ibn Isma'il the secretary reports that she sang only when excused from prayer. She left a diwan, and al-Ma'mun led her funeral prayer."
