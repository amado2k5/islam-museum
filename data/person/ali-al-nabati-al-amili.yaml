  fr: "Fiche de candidature pour Ali al-Nabati al-Amili, connu sous le nom d'Ibn Yunus, philosophe et juriste amili du XVe siècle, mort en 1472; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "علی النباتی العملی کے لیے مسودہ کارڈ جسے ابن یونس کے نام سے جانا جاتا ہے، پندرہویں صدی کے عاملی فلسفی اور فقیہ، ڈی۔ 1472; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1472'de ölen, on beşinci yüzyıl filozofu ve Amili hareketinin hukukçusu İbn Yunus olarak bilinen Ali al-Nabati al-Amili için ön kart; Ma'jam al-A'mal tarafından hatırlanmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Ali al-Nabati al-Amili, yang dikenal sebagai Ibn Yunus, seorang filsuf dan ahli hukum abad kelima belas dari gerakan Amili, yang meninggal pada tahun 1472 M; ia dikenang oleh Ma'jam al-A'mal, dan biografinya belum pernah diulas di halaman tersebut."
