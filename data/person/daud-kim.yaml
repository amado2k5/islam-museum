summary:
  ar: "مغنٍّ ومدوّن فيديو كوري جنوبي، وُلد باسم كيم جاي هان في سيول سنة 1992. بدأ مغنيا باسم جاي كيم وبنى قاعدة جماهيرية في جنوب شرق آسيا عبر البث المباشر ولقاءات المعجبين، ثم اعتنق الإسلام في سبتمبر 2019 وأصبح أشهر صانع محتوى مسلم في كوريا، إذ بلغ عدد مشتركي قناته على يوتيوب 8.45 مليون مشترك بحسب إحصاء vidIQ المحدّث في نوفمبر 2026. وأثارت حملته لبناء مسجد في إنتشون سنة 2024 اهتماما وطنيا حين ألغى اعتراض الأهالي صفقة الأرض."
  en: "South Korean singer and YouTuber, born Kim Jae-han in Seoul in 1992. He began as the singer Jay Kim, built a Southeast Asian fan base through live streaming and fan meetings, embraced Islam in September 2019 and became South Korea's best-known Muslim content creator, with 8.45 million YouTube subscribers by vidIQ's count updated in November 2026. His 2024 campaign to build a mosque in Incheon drew national attention when local opposition ended the land purchase."
  ur: "جنوبی کوریائی گلوکار اور یوٹیوبر، 1992 میں سیول میں کم جے ہان کے نام سے پیدا ہوئے۔ جے کم کے نام سے گلوکاری شروع کی، لائیو اسٹریمنگ اور مداحوں سے ملاقاتوں کے ذریعے جنوب مشرقی ایشیا میں مداح بنائے، ستمبر 2019 میں اسلام قبول کیا اور کوریا کے سب سے معروف مسلم کانٹینٹ ساز بن گئے؛ نومبر 2026 کے vidIQ شمار کے مطابق ان کے یوٹیوب سبسکرائبرز 8.45 ملین تھے۔ 2024 میں انچیون میں مسجد بنانے کی ان کی مہم اس وقت قومی توجہ کا مرکز بنی جب مقامی مخالفت نے زمین کا سودا ختم کر دیا۔"
