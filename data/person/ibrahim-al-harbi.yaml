summary:
  ar: "صاحب «غريب الحديث» و«دلائل النبوة»، وأحد الناقلين لمذهب الإمام أحمد عنه، وعند المسعودي توفي يوم الاثنين لسبع بقين من ذي الحجة سنة خمس وثمانين ومائتين وله خمس وثمانون سنة ودفن مما يلي باب الأنبار، وكان صدوقاً عالماً فصيحاً جواداً عفيفاً زاهداً عابداً ومع ذلك ضاحك السن ظريف الطبع سلس القياد، وكان شيخ البغداديين في وقته وناسكهم ومسندهم ويتفقه لأهل العراق وله مجلس يوم الجمعة في الجامع الغربي {cite:muruj-al-dhahab p. 622}. وعند ابن النديم أبو إسحاق إبراهيم بن إسحاق بن إبراهيم بن بشير بن عبد الله من جلة المحدثين العارفين بالحديث وكان عالما ورعا عارفا باللغة وكان من الحفاظ وتوفي سنة خمسين وثمانين ومائتين وله كتاب غريب الحديث والذي خرج منه مسند أبي بكر ومسند عمر ومسند عثمان ومسند علي ومسند الزبير ومسند طلحة ومسند سعد بن أبي وقاص ومسند عبد الرحمن بن عوف ومسند العباس ومسند خالد بن الوليد ومسند أبي عبيدة بن الجراح ومسند معاوية وغيره ومسند عبد الله بن عباس ومسند عبد الله بن عمر بن الخطاب ومسند الموالی وهو آخر ما عمل، وله بعد ذلك كتاب الأدب وكتاب المنازل وكتاب التيمم {cite:fihrist-ibn-al-nadim p. 323}"
  en: "Author of Gharib al-Hadith and Dala'il al-Nubuwwa, and one of those who transmitted Imam Ahmad's school from him. Ibn al-Jawzi places his death in 285 and preserves his famed austerity: born 198 at Marw, he wore a clean shirt and a soiled izar without ever thinking them equal, walked all Baghdad with one sandal-strap broken for ten years telling no one of his ailments, and lived thirty years on a loaf or two a day — when asked how he had gathered his books he answered 'with my flesh and blood' {cite:muntazam-ibn-al-jawzi p. 296-297}."
  es: "Autor de Gharib al-Hadith y Dala'il al-Nubuwwa, y uno de los que transmitieron la escuela del Imam Ahmad a partir de él. Ibn al-Jawzi sitúa su muerte en el año 285 y conserva su famosa austeridad: nacido en el año 198 en Marw, vestía una camisa limpia y un izar sucio sin considerarlos jamás iguales, caminó por todo Bagdad con una correa de sandalia rota durante diez años sin contarle a nadie sus dolencias, y vivió treinta años con uno o dos panes al día; cuando se le preguntó cómo había reunido sus libros, respondió \"con mi carne y mi sangre\" {cite:muntazam-ibn-al-jawzi p. 296-297}."
  fr: "Auteur de Gharib al-Hadith et de Dala'il al-Nubuwwa, et l'un de ceux qui ont transmis l'école de l'imam Ahmad, Ibn al-Jawzi situe sa mort en 285 et relate sa célèbre austérité: né en 198 à Marw, il portait une chemise propre et un izar souillé sans jamais les considérer comme égaux, parcourut Bagdad pendant dix ans avec une lanière de sandale cassée sans jamais parler de ses maux, et vécut trente ans avec un ou deux pains par jour. Lorsqu'on lui demanda comment il avait rassemblé ses livres, il répondit: « Avec ma chair et mon sang » (Muntazam Ibn al-Jawzi, p. 296-297)."
  ur: "غریب الحدیث اور دلائل النبوۃ کے مصنف، اور ان میں سے ایک جنہوں نے ان سے امام احمد کا مکتب نقل کیا۔ ابن الجوزی نے اپنی موت 285 میں بتائی اور اپنی مشہور کفایت شعاری کو برقرار رکھا: مروہ میں 198 میں پیدا ہوا، اس نے صاف ستھری قمیض اور ایک گندا ازار پہنا اور کبھی بھی ان کو برابر نہ سمجھا، دس سال تک پورے بغداد میں ایک سینڈل کے پٹے کے ساتھ چہل قدمی کی۔ جواب دیا 'میرے گوشت اور خون سے'۔ 296-297}۔"
  tr: "'Gharib al-Hadis' ve 'Dala'il al-Nubuwwah'ın yazarı ve İmam Ahmad'ın düşünce okulunun kendisinden aktarıcılarından biridir. al-Mas'udi'ye göre, 285 H. Dhu al-Hicjah'ın yedinci günü Pazartesi günü, seksen beş yaşında vefat etti ve Bab al-Anbar yakınlarında defnedildi. Dürüst biriydi, konuşur, etkileyici konuşur, cömert, iffetli ve dindardı. Yine de neşeli, çekici ve liderlikte ustaydı. Kendi döneminde Bağdatlıların önde gelen âlimi, onların münzevi ve musnadı, Irak halkına fıkıh öğretti. Cuma günleri Batı Camii'nde toplantılar düzenlerdi {cite:muruj-al-dhahab, s. 622}. İbn el-Nadim'e göre, seçkin hadis âlimlerinden ve hadis konusunda bilgili olan Ebu İshaq ibn İshaq ibn İbrahim ibn Beşîr ibn Abdullah, dindar, dilbilimci ve ezberleyiciydi. 280 H yılında vefat etti. Nadir bir hadis kitabı yazdı; bu kitaptan Ebu Bekir Musnadı, Ömer, Osman, Ali, Musnad al-Zubeyr, Musnad Talha, Musnad Sa'd ibn Ebi Vaqqas, Musnad Abd al-Rahman ibn Awf, Musnad al-Abbas, Musnad Khalid ibn al-Walid, Musnad Abu Ubeyde ibn al-Jarrah, Musnad Muawiyah ve diğerleri, Musnad Abdullah ibn Abbas, Musnad Abdullah ibn Umar ibn al-Khattab ve Musnad al-Mawali, ki bu onun son çalışmasıydı. Bundan sonra Edebiyat Kitabı, Kitab al-Manazil ve Teyemmum Kitabı'nı yazdı. {atıf: Fihrist-ibn-al-Nadim s. 323}"
  id: "Penulis 'Gharib al-Hadith' dan 'Dala'il al-Nubuwwah,' serta salah satu penyalur aliran pemikiran Imam Ahmad darinya. Menurut al-Mas'udi, ia meninggal pada hari Senin, tanggal tujuh Dhu al-Hijjah, 285 H, pada usia delapan puluh lima tahun dan dimakamkan di dekat Bab al-Anbar. Ia adalah sosok yang jujur, fasih, fasih, dermawan, suci, dan taat. Namun demikian, ia ceria, menawan, dan mulus dalam kepemimpinan. Ia adalah ulama terkemuka masyarakat Baghdad pada zamannya, pertapa mereka, dan Musnad mereka, serta mengajarkan hukum kepada rakyat Irak. Ia mengadakan pertemuan Jumat di Masjid Barat {cite:muruj-al-dhahab, hlm. 622}. Menurut Ibn al-Nadim, Abu Ishaq ibn Ishaq ibn Ibrahim ibn Bashir ibn Abdullah, salah satu ulama hadis terkemuka dan ahli hadis, adalah seorang ulama linguistik yang saleh dan seorang penghafal. Ia meninggal pada tahun 280 H. Ia menulis sebuah kitab hadis langka yang memuat Musnad Abu Bakr, Umar, Uthman, Ali, Musnad al-Zubayr, Musnad Talha, Musnad Sa'd ibn Abi Waqqas, Musnad d Abd al-Rahman ibn Awf, Musnad al-Abbas, Musnad Khalid ibn al-Walid, Musnad Abu Ubaidah ibn al-Jarrah, Musnad Muawiyah, dan lainnya, Musnad Abdullah ibn Abbas, Musnad Abdullah ibn Umar ibn al-Khattab, dan Musnad al-Mawali, yang merupakan karya terakhir yang ia buat. Setelah itu, ia menulis Kitab Sastra, Kitab al-Manazil, dan Kitab Tayammum {cite:Fihrist-ibn-al-Nadim p. 323}"
