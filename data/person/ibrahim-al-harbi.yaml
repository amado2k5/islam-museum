summary:
  ar: "صاحب «غريب الحديث» و«دلائل النبوة»، وأحد الناقلين لمذهب الإمام أحمد عنه، وعند المسعودي توفي يوم الاثنين لسبع بقين من ذي الحجة سنة خمس وثمانين ومائتين وله خمس وثمانون سنة ودفن مما يلي باب الأنبار، وكان صدوقاً عالماً فصيحاً جواداً عفيفاً زاهداً عابداً ومع ذلك ضاحك السن ظريف الطبع سلس القياد، وكان شيخ البغداديين في وقته وناسكهم ومسندهم ويتفقه لأهل العراق وله مجلس يوم الجمعة في الجامع الغربي {cite:muruj-al-dhahab p. 622}. وعند ابن النديم أبو إسحاق إبراهيم بن إسحاق بن إبراهيم بن بشير بن عبد الله من جلة المحدثين العارفين بالحديث وكان عالما ورعا عارفا باللغة وكان من الحفاظ وتوفي سنة خمسين وثمانين ومائتين وله كتاب غريب الحديث والذي خرج منه مسند أبي بكر ومسند عمر ومسند عثمان ومسند علي ومسند الزبير ومسند طلحة ومسند سعد بن أبي وقاص ومسند عبد الرحمن بن عوف ومسند العباس ومسند خالد بن الوليد ومسند أبي عبيدة بن الجراح ومسند معاوية وغيره ومسند عبد الله بن عباس ومسند عبد الله بن عمر بن الخطاب ومسند الموالی وهو آخر ما عمل، وله بعد ذلك كتاب الأدب وكتاب المنازل وكتاب التيمم {cite:fihrist-ibn-al-nadim p. 323}"
  en: "Author of Gharib al-Hadith and Dala'il al-Nubuwwa, and one of those who transmitted Imam Ahmad's school from him."
