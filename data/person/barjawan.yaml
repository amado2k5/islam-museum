summary:
  ar: "الأستاذ أبو الفتوح برجوان الذي تُنسب إليه حارة برجوان بالقاهرة؛ كان من خدام العزيز صاحب مصر ومدبّري دولته وكان نافذ الأمر مطاعاً؛ نظر في أمور المملكة في شهر رمضان سنة سبع وثمانين وثلاثمائة واستقر على أيام الحاكم في ديار مصر والحجاز والشام والمغرب وأعمال المشرق؛ وكان أسود؛ ولما قُتل خلّف ألف سراويل دبيقي بألف طقة حرير ومن الملابس والفرش والآلات والكتب ما لا يُحصى كثرة {cite:wafayat-ayan}."
  en: "Barjawan (d. 390) — al-Aziz's black eunuch who ruled Egypt, Syria and the Hijaz as al-Hakim's regent; murdered in the palace on al-Hakim's order, leaving a thousand satin trousers and a library beyond count; Cairo's Barjuwan quarter bears his name {cite:wafayat-ayan}."
