summary:
  ar: "الأستاذ أبو الفتوح برجوان الذي تُنسب إليه حارة برجوان بالقاهرة؛ كان من خدام العزيز صاحب مصر ومدبّري دولته وكان نافذ الأمر مطاعاً؛ نظر في أمور المملكة في شهر رمضان سنة سبع وثمانين وثلاثمائة واستقر على أيام الحاكم في ديار مصر والحجاز والشام والمغرب وأعمال المشرق؛ وكان أسود؛ ولما قُتل خلّف ألف سراويل دبيقي بألف طقة حرير ومن الملابس والفرش والآلات والكتب ما لا يُحصى كثرة {cite:wafayat-ayan}."
  en: "Barjawan (d. 390) — al-Aziz's black eunuch who ruled Egypt, Syria and the Hijaz as al-Hakim's regent; murdered in the palace on al-Hakim's order, leaving a thousand satin trousers and a library beyond count; Cairo's Barjuwan quarter bears his name {cite:wafayat-ayan}."
  es: "Barjawan (m. 390) — eunuco negro de al-Aziz que gobernó Egipto, Siria y el Hiyaz como regente de al-Hakim; asesinado en el palacio por orden de al-Hakim, dejando mil pantalones de satén y una biblioteca incontable; el barrio de Barjuwan de El Cairo lleva su nombre {cite:wafayat-ayan}."
  fr: "Barjawan (mort en 390) — eunuque noir d'al-Aziz qui gouverna l'Égypte, la Syrie et le Hedjaz en tant que régent d'al-Hakim; assassiné au palais sur ordre d'al-Hakim, laissant derrière lui un millier de pantalons en satin et une bibliothèque innombrable; le quartier Barjuwan du Caire porte son nom {cite:wafayat-ayan}."
  ur: "برجاوان ⁦(متوفی 390)⁩ — العزیز کا سیاہ فام خواجہ سرا جس نے مصر، شام اور حجاز پر الحکیم کے ریجنٹ کے طور پر حکومت کی۔ الحکیم کے حکم پر محل میں قتل کیا گیا، ایک ہزار ساٹن کی پتلون اور ایک لائبریری گنتی سے باہر رہ گئی۔ قاہرہ کے برجوان کوارٹر میں اس کا نام {حوالہ: وفایت-عیان} ہے۔"
  tr: "Kahire'deki Barjwan mahallesinin atfedildiği Profesör Ebu Al-Fotouh Barjwan, Mısır'ın sevgili hükümdarının hizmetkarlarından biri ve devletlerin yöneticilerinden biriydi; sorumlu ve itaatkârdı. 387 Hicri Ramazan ayında Krallığın işlerini denetledi ve hükümdarın döneminde Mısır, Hicaz, Şam, Mağrip ve Doğu topraklarında yerleşti. Siyahtı; ve öldürüldüğünde, binlerce Dubaycı pantolonu ve binlerce ipek parça ile sayısız kıyafet, mobilya, alet ve kitap arkasında, {atıf:wafayat-ayan}."
  id: "Profesor Abu Al-Fotouh Barjwan, yang menjadi atribusi lingkungan Barjwan di Kairo, adalah salah satu pelayan penguasa Mesir yang tercinta dan salah satu administrator negara, serta ia bertanggung jawab dan taat. Ia mengawasi urusan kerajaan selama Ramadan tahun 387 H dan menetap selama masa penguasa di tanah Mesir, Hijaz, Levant, Maghreb, dan negeri-negeri Timur. Ia berkulit hitam; dan ketika ia dibunuh, di balik seribu celana Dubayqi dengan seribu potong sutra, serta pakaian, perabotan, alat, dan buku, {cite:wafayat-ayan}."
