label: { ar: "عبد الوهاب بن إبراهيم الإمام", en: "Abd al-Wahhab ibn Ibrahim al-Imam", fr: "Abd al-Wahhab ibn Ibrahim al-Imam", es: "Abd al-Wahhab ibn Ibrahim al-Imam", ur: "عبد الوہاب ابن ابراہیم الامام" }
summary:
  ar: "عبد الوهاب بن إبراهيم الإمام ابن إمام الدعوة إبراهيم بن محمد بن علي؛ عند البلاذري: وجّهه المنصور في سنة 140 والياً على الجزيرة وثغورها ومعه الحسن بن قحطبة في جنود أهل خراسان فقطع البعوث على أهل الشام والجزيرة فتوافى معه سبعون ألفاً فعسكر على ملطية يبنيها وقد جمع الفعلة من كل بلد، فماظّه إطعام الحسن بن قحطبة الناس من ماله فكتب إلى أبي جعفر يعاظمه فرد عليه «يا صبيّ يطعم الحسن من ماله وتطعم من مالي ما أتيت إلا من صغر خطرك وقلة همتك وسفه رأيك»."
  en: "Abd al-Wahhab ibn Ibrahim al-Imam, son of the da'wa's imam Ibrahim ibn Muhammad ibn Ali; in al-Baladhuri: al-Mansur sent him in year 140 as governor of the Jazira and its frontier with al-Hasan ibn Qahtaba among the Khurasani armies, proclaiming a levy on Syria and the Jazira until seventy thousand converged, and he camped on Malatya building it with labourers gathered from every land — when al-Hasan ibn Qahtaba's feeding of the people from his own purse nettled him he wrote to Abu Ja'far accusing him, and the answer came: 'O boy! al-Hasan feeds from his own money, and you feed from mine — nothing comes of you but smallness of worth, littleness of ambition and foolishness of opinion.'"
  fr: "Abd al-Wahhab ibn Ibrahim al-Imam, fils de l'imam de la da'wa Ibrahim ibn Muhammad ibn Ali ; chez al-Baladhuri : al-Mansur l'envoya en l'an 140 comme gouverneur de la Jazira et de sa frontière avec al-Hasan ibn Qahtaba parmi les armées du Khorassan, proclamant une levée en Syrie et en Jazira jusqu'à ce que soixante-dix mille hommes convergent, et il campa à Malatya qu'il bâtit avec des ouvriers rassemblés de tous les pays — lorsque al-Hasan ibn Qahtaba, en nourrissant les gens de sa propre bourse, l'agaça, il écrivit à Abu Ja'far pour l'accuser, et la réponse vint : « Ô garçon ! al-Hasan nourrit de son propre argent, et toi tu nourris du mien — il ne vient de toi que petitesse de valeur, faiblesse d'ambition et sottise d'opinion. »"
  es: "Abd al-Wahhab ibn Ibrahim al-Imam, hijo del imán de la da'wa, Ibrahim ibn Muhammad ibn Ali; en al-Baladhuri: al-Mansur lo envió en el año 140 como gobernador de Jazira y su frontera con al-Hasan ibn Qahtaba entre los ejércitos de Jorasán, proclamando un reclutamiento en Siria y Jazira hasta que convergieron setenta mil hombres, y acampó en Malatya construyéndola con trabajadores reunidos de todas partes. Cuando al-Hasan ibn Qahtaba le molestó que alimentara al pueblo con su propio dinero, escribió a Abu Ja'far acusándolo, y la respuesta fue: «¡Oh, muchacho! Al-Hasan se alimenta de su propio dinero, y tú te alimentas del mío; de ti no sale más que mezquindad, poca ambición y necedad de opinión»."
  ur: "عبد الوہاب ابن ابراہیم الامام، دعوۃ کے امام ابراہیم بن محمد ابن علی کے بیٹے؛ البلادوری میں ہے: المنصور نے سنہ 140 میں اسے جزیرہ اور اس کی سرحد کا گورنر بنا کر حسن بن قحطبہ کے ساتھ خراسانی فوجوں میں بھیجا، شام اور جزیرہ پر محاصرہ کرنے کا اعلان کیا یہاں تک کہ ستر ہزار اکٹھے ہو گئے، اور اس نے مالتیا پر خیمہ زن کیا جس کی تعمیر کے لیے ہر ایک قبطہ سے مزدور جمع ہوتے تھے۔ اس کے اپنے بٹوے سے لوگوں نے اسے گھیر لیا اس نے ابو جعفر کو اس پر الزام لگاتے ہوئے لکھا اور جواب آیا: اے لڑکے! الحسن اپنے پیسے سے کھانا کھلاتا ہے، اور تم میرے پیسے سے کھانا کھلاتے ہو - تمھارے پاس قدر کی کمی، خواہش کی کمی اور رائے کی بے وقوفی کے سوا کچھ نہیں آتا۔'"
