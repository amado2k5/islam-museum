id: person/abd-al-wahhab-ibn-ibrahim
class: person
label: { ar: "عبد الوهاب بن إبراهيم الإمام", en: "Abd al-Wahhab ibn Ibrahim al-Imam" }
summary:
  ar: "عبد الوهاب بن إبراهيم الإمام ابن إمام الدعوة إبراهيم بن محمد بن علي؛ عند البلاذري: وجّهه المنصور في سنة 140 والياً على الجزيرة وثغورها ومعه الحسن بن قحطبة في جنود أهل خراسان فقطع البعوث على أهل الشام والجزيرة فتوافى معه سبعون ألفاً فعسكر على ملطية يبنيها وقد جمع الفعلة من كل بلد، فماظّه إطعام الحسن بن قحطبة الناس من ماله فكتب إلى أبي جعفر يعاظمه فرد عليه «يا صبيّ يطعم الحسن من ماله وتطعم من مالي ما أتيت إلا من صغر خطرك وقلة همتك وسفه رأيك»."
  en: "Abd al-Wahhab ibn Ibrahim al-Imam, son of the da'wa's imam Ibrahim ibn Muhammad ibn Ali; in al-Baladhuri: al-Mansur sent him in year 140 as governor of the Jazira and its frontier with al-Hasan ibn Qahtaba among the Khurasani armies, proclaiming a levy on Syria and the Jazira until seventy thousand converged, and he camped on Malatya building it with labourers gathered from every land — when al-Hasan ibn Qahtaba's feeding of the people from his own purse nettled him he wrote to Abu Ja'far accusing him, and the answer came: 'O boy! al-Hasan feeds from his own money, and you feed from mine — nothing comes of you but smallness of worth, littleness of ambition and foolishness of opinion.'"
