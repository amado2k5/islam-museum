summary:
  ar: "قومي سراواكي من سيبو، وُلد سنة 1932، وكان من قادة حركة «روكون 13» المناهضة لضم سراواك إلى التاج البريطاني، واغتال حاكم سراواك الاستعماري الثاني دنكان جورج ستيوارت في ديسمبر 1949، فأُعدم شنقًا في كوتشينغ في 2 مارس 1950 وهو في السابعة عشرة."
  en: "Sarawakian nationalist from Sibu, born in 1932. A leading member of Rukun 13, the anti-cession movement's secret organisation, he assassinated Duncan George Stewart, the second governor of colonial Sarawak, in December 1949 and was hanged at Kuching on 2 March 1950, aged seventeen."
  ur: "سیبو سے تعلق رکھنے والے سراواکی قوم پرست، جو 1932 میں پیدا ہوئے۔ وہ برطانوی ولی عہد نوآبادی سے الحاق مخالف تحریک کی خفیہ تنظیم روکن 13 کے سرکردہ رکن تھے؛ انھوں نے دسمبر 1949 میں سراواک کے دوسرے نوآبادیاتی گورنر ڈنکن جورج سٹیورٹ کو قتل کیا اور 2 مارچ 1950 کو کوچنگ میں سترہ سال کی عمر میں پھانسی پائی۔"
