summary:
  ar: "محامٍ ومعلم وسياسي فلبيني مسلم من لاناو (1914–2002)، نائب (1953) وعضو مجلس الشيوخ (1955–1961)، أسس جامعة مينداناو الإسلامية (1954) وصاغ قوانين جامعة ولاية مينداناو ولجنة التكامل الوطني، ودعا إلى التعايش السلمي بين المسلمين والمسيحيين وإلى حكم ذاتي لمسلمي مينداناو، ونال جائزة الملك فيصل لخدمة الإسلام (1988)."
  en: "Filipino Muslim lawyer, educator and politician from Lanao (1914–2002), congressman (1953) and senator (1955–1961), founder of the Mindanao Islamic University (1954) and author of the laws creating Mindanao State University and the Commission on National Integration; an advocate of peaceful coexistence between Muslims and Christians and of autonomy for Muslim Mindanao; King Faisal Prize for Service to Islam (1988)."
  ur: "لاناؤ کے فلپائنی مسلمان وکیل، معلم اور سیاست دان ⁦(1914ء–2002ء)⁩، رکنِ ایوانِ نمائندگان ⁦(1953ء)⁩ اور سینیٹر ⁦(1955ء–1961ء)⁩، مینڈاناؤ اسلامی یونیورسٹی ⁦(1954ء)⁩ کے بانی اور مینڈاناؤ اسٹیٹ یونیورسٹی و قومی انضمام کمیشن کے قوانین کے مصنف؛ مسلمانوں اور مسیحیوں کے پُرامن بقائے باہمی اور مسلم مینڈاناؤ کی خود مختاری کے داعی؛ شاہ فیصل انعام برائے خدمتِ اسلام ⁦(1988ء)⁩۔"
