summary:
  ar: "العلامة مجد الدين أسعد بن أبي النصر الميهني — نسبة إلى ميهنة قرية قرب طوس بين سرخس وأبيورد — صاحب التعليقة؛ تفقه بمرو وشاع فصله وبعد صيته وولي نظامية بغداد مرتين وخرج له عدة تلامذة وكان متوقد الذكاء، تفقه على أبي المظفر السمعاني والموفق الهروي، وكان يرجع إلى دين وخوف؛ ولد بميهنة سنة إحدى وستين وأربعمائة ورحل إلى غزنة واشتهر بتلك النواحي ثم ورد بغداد فانتفع الناس به وبطريقته الخلافية، ثم توجه من بغداد رسولاً إلى همدان فتوفي بها سنة سبع وعشرين وخمسمائة {cite:shadharat-dhahab p. 560}."
  en: "The scholar Majd al-Din As'ad ibn Abi al-Nasr al-Mayhani — of Mihna near Tus between Sarakhs and Abiward — author of the Ta'liqa; he read fiqh at Marw, twice headed Baghdad's Nizamiyya, formed many students, a fiery intelligence trained under Abu al-Muzaffar al-Sam'ani and al-Muwaffaq al-Harawi, and pious; b. 461 at Mihna, famed at Ghazna, then Baghdad profited from his khilaf method until he was sent as envoy to Hamadan and died there in 527 {cite:shadharat-dhahab p. 560}."
