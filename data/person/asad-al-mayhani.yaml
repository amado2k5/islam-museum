id: person/asad-al-mayhani
class: person
label: { ar: "مجد الدين أسعد الميهني" }
names:
  - { value: "مجد الدين أبو الفتح وأبو سعيد أسعد بن أبي النصر بن الفضل الميهني", kind: full }
summary:
  ar: "العلامة مجد الدين أسعد بن أبي النصر الميهني — نسبة إلى ميهنة قرية قرب طوس بين سرخس وأبيورد — صاحب التعليقة؛ تفقه بمرو وشاع فصله وبعد صيته وولي نظامية بغداد مرتين وخرج له عدة تلامذة وكان متوقد الذكاء، تفقه على أبي المظفر السمعاني والموفق الهروي، وكان يرجع إلى دين وخوف؛ ولد بميهنة سنة إحدى وستين وأربعمائة ورحل إلى غزنة واشتهر بتلك النواحي ثم ورد بغداد فانتفع الناس به وبطريقته الخلافية، ثم توجه من بغداد رسولاً إلى همدان فتوفي بها سنة سبع وعشرين وخمسمائة {cite:shadharat-dhahab p. 560}."
  en: "The scholar Majd al-Din As'ad ibn Abi al-Nasr al-Mayhani — of Mihna near Tus between Sarakhs and Abiward — author of the Ta'liqa; he read fiqh at Marw, twice headed Baghdad's Nizamiyya, formed many students, a fiery intelligence trained under Abu al-Muzaffar al-Sam'ani and al-Muwaffaq al-Harawi, and pious; b. 461 at Mihna, famed at Ghazna, then Baghdad profited from his khilaf method until he was sent as envoy to Hamadan and died there in 527 {cite:shadharat-dhahab p. 560}."
  es: "El erudito Majd al-Din As'ad ibn Abi al-Nasr al-Mayhani - de Mihna cerca de Tus entre Sarakhs y Abiward - autor de la Ta'liqa; leyó fiqh en Marw, encabezó dos veces la Nizamiyya de Bagdad, formó muchos estudiantes, una inteligencia ardiente entrenada bajo Abu al-Muzaffar al-Sam'ani y al-Muwaffaq al-Harawi, y piadoso; b. 461 en Mihna, famoso en Ghazna, luego Bagdad se benefició de su método khilaf hasta que fue enviado como enviado a Hamadan y murió allí en 527 {cita: shadharat-dhahab p. 560}."
  fr: "Le savant Majd al-Din As'ad ibn Abi al-Nasr al-Mayhani — de Mihna près de Tus entre Sarakhs et Abiward — auteur de la Ta'liqa; il lisait le fiqh à Marw, dirigea à deux reprises la Nizamiyya de Bagdad, forma de nombreux étudiants, une intelligence fougueuse formée sous Abu al-Muzaffar al-Sam'ani et al-Muwaffaq al-Harawi, et pieux; b. 461 à Mihna, célèbre à Ghazna, puis Bagdad profita de sa méthode du khilaf jusqu'à ce qu'il soit envoyé comme envoyé à Hamadan et y mourut en 527 {cite: shadharat-dhahab p. 560}."
  ur: "عالم مجد الدین اسعد ابن ابی النصر المیحانی - سرخ اور ابیوارد کے درمیان طوس کے قریب میہنا کے - طالب علم کے مصنف؛ اس نے مرو میں فقہ پڑھا، دو بار بغداد کے نظامیہ کی سربراہی کی، بہت سے طلبہ بنائے، ابو المظفر السمانی اور الموفق الحروی کے زیر تربیت ایک شعلہ بیان ذہانت، اور متقی۔ ب 461 میں میہنا میں، غزنہ میں مشہور، پھر بغداد نے اس کے خلافت کے طریقے سے فائدہ اٹھایا یہاں تک کہ اسے ہمدان میں ایلچی بنا کر بھیجا گیا اور وہیں 527 میں وفات پائی۔ 560}۔"
