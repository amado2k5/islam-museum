id: person/ibn-shahid-al-andalusi
class: person
label: { ar: "أبو عامر ابن شهيد الأشجعي القرطبي" }
summary:
  ar: "أبو عامر أحمد بن عبد الملك بن مروان بن ذي الوزارتين أحمد بن عبد الملك بن عمر بن شهيد الأشجعي القرطبي، الشاعر حامل لواء البلاغة والشعر بالأندلس؛ قال ابن حزم توفي في جمادى الأولى وصلّى عليه أبو الحسن جمهور ولم يُخلَف له نظير في الشعر والبلاغة، وكان سمحاً جواداً عاش بضعاً وأربعين سنة {cite:shadharat-dhahab p. 230}."
  en: "Abu Amir Ahmad b. Abd al-Malik b. Shahid al-Ashja'i al-Qurtubi — standard-bearer of eloquence and poetry in al-Andalus; Ibn Hazm said no peer was left after him in poetry, and Abu al-Hasan Jamhur prayed over him in Jumada I 426, after some forty-five years {cite:shadharat-dhahab p. 230}."
  es: "Abu Amir Ahmad b. Abd al-Malik b. Shahid al-Ashja'i al-Qurtubi — abanderado de la elocuencia y la poesía en al-Ándalus; Ibn Hazm dijo que no quedaba ningún igual después de él en poesía, y Abu al-Hasan Jamhur oró por él en Jumada I 426, después de unos cuarenta y cinco años {cite:shadharat-dhahab p. 230}."
  fr: "Abu Amir Ahmad b. Abd al-Malik b. Shahid al-Ashja'i al-Qurtubi — porte-étendard de l'éloquence et de la poésie en al-Andalus; Ibn Hazm a dit qu'aucun pair n'était resté après lui en poésie, et Abu al-Hasan Jamhur a prié sur lui en Jumada I 426, après quelque quarante-cinq ans {cite:shadharat-dhahab p. 230}."
