  fr: "Combattant lors des conquêtes irakiennes; à al-Baladhuri, il a combattu le jour de Mihran jusqu'à ce que son épée se plie, et il était parmi ceux qui ont atteint Rustam à al-Qadisiyya, dont le meurtrier est resté inconnu."
