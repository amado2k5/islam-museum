summary:
  ar: "سليمان بن سعد؛ عند البلاذري: أمره عبد الملك بن مروان سنة 81 بنقل ديوان الشام عن الرومية فسأله أن يعينه بخراج الأردن سنة ففعل وولّاه الأردن فلم تنقضِ السنة حتى فرغ من نقله وأتى به عبد الملك — وكانت وظيفة الأردن تلك السنة مائة وثمانين ألف دينار."
  en: "Sulayman ibn Sa'd; in al-Baladhuri: Abd al-Malik ibn Marwan ordered him in year 81 to transfer Syria's diwan from Greek; he asked to be helped by a year's kharaj of al-Urdunn, was granted it and made its governor, and before the year ended had finished the transfer and brought it to Abd al-Malik — al-Urdunn's levy that year being a hundred and eighty thousand dinars."
