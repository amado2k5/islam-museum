summary:
  ar: "كاتبة وأستاذة للأدب العربي مصرية (1913–1998) كتبت باسم «بنت الشاطئ»، أستاذة الأدب العربي في جامعة عين شمس، صاحبة «التفسير البياني للقرآن الكريم» (1966–1969) وسير نساء بيت النبوة، وأكثر من أربعين كتابًا، ونالت جائزة الدولة (1987) وجائزة الملك فيصل للأدب العربي (1994)."
  en: "Egyptian writer and professor of Arabic literature (1913–1998) who wrote as 'Bint al-Shati', professor at Ain Shams University, author of 'al-Tafsir al-Bayani lil-Qur'an al-Karim' (1966–1969), biographies of the women of the Prophet's household and more than forty books; State Award 1987, King Faisal Prize for Arabic Literature 1994."
  ur: "مصری ادیبہ اور عربی ادب کی استاد ⁦(1913ء–1998ء)⁩، جنھوں نے «بنت الشاطی» کے نام سے لکھا، جامعہ عین شمس میں عربی ادب کی پروفیسر، «التفسیر البیانی للقرآن الکریم» ⁦(1966ء–1969ء)⁩، خانوادۂ نبوت کی خواتین کی سیرتوں اور چالیس سے زیادہ کتب کی مصنفہ؛ ریاستی انعام 1987ء اور عربی ادب کا شاہ فیصل انعام 1994ء۔"
