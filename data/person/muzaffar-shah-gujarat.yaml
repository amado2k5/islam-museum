summary:
  ar: "السلطان مظفر شاه أحمد بن محمود شاه صاحب كجرات؛ كان عادلاً فاضلاً محباً لأهل العلم حسن الخط وكتب بيده جملة مصاحف أرسل منها مصحفاً إلى المدينة الشريفة، وخرجت روحه وهو ساجد؛ والظاهر أنه هو الذي وفد عليه العلامة باحرق فصنّف بسببه السيرة النبوية ولم يزل عنده مبجلاً مكرماً إلى أن مات {cite:shadharat-dhahab p. 577}."
  en: "Gujarat's sultan — 'just, learned, a lover of scholars', a fine calligrapher who copied mushafs with his own hand and sent one to Medina; his soul left him while he was prostrating. The historian notes he was apparently the sultan at whose court Ba Haruq stayed and for whom the Sira was composed {cite:shadharat-dhahab p. 577}."
