summary:
  ar: محامية وحقوقية روهينغية وُلدت سنة 1973 في مونغدو بميانمار. وثّقت العنف الجنسي المنهجي ضد النساء الروهينغيات في تقارير دولية، وأول روهينغية تخاطب مجلس الأمن، وحائزة جائزة المرأة الشجاعة الدولية ⁦(IWOC)⁩
    سنة 2019.
  en: Rohingya lawyer and human-rights defender, born 1973 in Maungdaw, Myanmar. She documented systematic sexual violence against Rohingya women in international reports, became the first Rohingya to address
    the UN Security Council, and received the 2019 International Women of Courage Award.
  ur: روہنگیا وکیل اور انسانی حقوق کی مدافع، 1973 میں میانمار کے مونگڈو میں پیدا ہوئیں۔ انہوں نے بین الاقوامی رپورٹوں میں روہنگیا خواتین کے خلاف منظم جنسی تشدد موثق کیا، سلامتی کونسل سے خطاب کرنے والی پہلی
    روہنگیا بنیں اور 2019 کا انٹرنیشنل ویمن آف کریج ایوارڈ جیتا۔
  es: "Abogada rohingya y defensora de los derechos humanos, nacida en 1973 en Maungdaw, Myanmar. Documentó la violencia sexual sistemática contra las mujeres rohingya en informes internacionales, se convirtió en la primera rohingya en dirigirse al Consejo de Seguridad de la ONU y recibió el Premio Internacional Mujeres de Coraje 2019."
  fr: "Avocate et défenseure des droits humains rohingya, née en 1973 à Maungdaw, au Myanmar. Elle a documenté les violences sexuelles systématiques perpétrées contre les femmes rohingyas dans des rapports internationaux, est devenue la première Rohingya à prendre la parole devant le Conseil de sécurité de l'ONU et a reçu le Prix international du courage féminin en 2019."
