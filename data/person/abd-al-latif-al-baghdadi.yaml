id: person/abd-al-latif-al-baghdadi
class: person
label: { ar: "موفق الدين عبد اللطيف البغدادي", en: "Muwaffaq al-Din Abd al-Latif al-Baghdadi", fr: "Muwaffaq al-Din Abd al-Latif al-Baghdadi", es: "Muwaffaq al-Din Abd al-Latif al-Baghdadi", ur: "موفق الدین عبد اللطیف البغدادی" }
summary:
  ar: "الموفق أبو محمد عبد اللطيف بن يوسف العلامة ذو الفنون البغدادي الشافعي النحوي اللغوي الطبيب الفيلسوف صاحب التصانيف الكثيرة؛ ولد سنة سبع وخمسين وخمسمائة وسمع من جماعة كثيرين منهم ابن البطي وأبو زرعة وتفقه على أبي القاسم بن فضلان وأقام بحلب وحفظ كتباً كثيرة؛ من تصانيفه شرح مقدمة ابن بابشاذ في النحو وشرح المقامات وشرح بانت سعاد والجامع الكبير في المنطق والطبيعي والإلهي في عشر مجلدات والرد على اليهود والنصارى وغريب الحديث في ثلاث مجلدات واختصره وشرح أحاديث ابن ماجه المتعلقة بالطب؛ قال الذهبي كان أحد الأذكياء البارعين في اللغة والآداب والطب وعلم الأوائل لكن كثرة دعاويه أزرت به، ومن كلامه من لم يحتمل ألم التعلم لم يذق لذة العلم ومن لم يكدح لم يفلح؛ سافر من حلب ليحج على العراق فأدركه الموت ببغداد في ثاني عشر المحرم سنة تسع وعشرين وستمائة {cite:shadharat-dhahab p. 132}."
  en: "Muwaffaq al-Din Abd al-Latif al-Baghdadi — the polymath physician, grammarian and philosopher, pupil of Ibn Fadlan, resident of Aleppo, author of sharhs on Ibn Babshad, the Maqamat and Bint Su'ad, a ten-volume Jami' on logic and the sciences, a refutation of Jews and Christians, and a Gharib al-Hadith; al-Dhahabi counted him among the age's brilliant minds though his many claims diminished him — 'whoever cannot bear the pain of learning never tastes its sweetness'; died at Baghdad on the Hajj road, 12 Muharram 629 {cite:shadharat-dhahab p. 132}."
  fr: "Muwaffaq al-Din Abd al-Latif al-Baghdadi — médecin, grammairien et philosophe polymathe, élève d'Ibn Fadlan, résident d'Alep, auteur de commentaires sur Ibn Babshad, les Maqamat et Bint Su'ad, d'un Jami' en dix volumes sur la logique et les sciences, d'une réfutation des juifs et des chrétiens, et d'un Gharib al-Hadith ; al-Dhahabi le compta parmi les esprits brillants de son temps, bien que ses nombreuses prétentions l'aient diminué — « qui ne supporte pas la peine de l'étude ne goûte jamais sa douceur » ; mort à Bagdad sur la route du hajj, le 12 muharram 629 {cite:shadharat-dhahab p. 132}."
  es: "Muwaffaq al-Din Abd al-Latif al-Baghdadi — el polímata médico, gramático y filósofo, discípulo de Ibn Fadlan, residente de Alepo, autor de sharhs sobre Ibn Babshad, el Maqamat y Bint Su'ad, un Jami' de diez volúmenes sobre lógica y ciencias, una refutación de judíos y cristianos, y un Gharib al-Hadith; al-Dhahabi lo contó entre las mentes brillantes de la época, aunque sus numerosas pretensiones lo menospreciaban — 'quien no puede soportar el dolor del aprendizaje nunca saborea su dulzura'; murió en Bagdad en el camino del Hajj, el 12 de Muharram de 629 {cite:shadharat-dhahab p. 132}."
  ur: "موفق الدین عبد اللطیف البغدادی - پولی میتھ طبیب، گرامر اور فلسفی، ابن فدلان کے شاگرد، حلب کے رہنے والے، ابن بابشاد پر شارح کے مصنف، مقامت اور بنت سعد، دس جلدوں پر مشتمل ایک اور عیسائی، جمیعت اور سائنس کی تردید۔ ایک غریب الحدیث؛ الذہبی نے اسے زمانے کے ذہین دماغوں میں شمار کیا حالانکہ اس کے بہت سے دعووں نے اسے کم کر دیا تھا - 'جو سیکھنے کا درد برداشت نہیں کر سکتا وہ کبھی اس کی مٹھاس نہیں چکھتا'۔ 12 محرم 629 کو حج روڈ پر بغداد میں وفات پائی۔ 132}۔"
  tr: "Pek çok alanda bilgili âlim, Bağdatlı Şafiî dilbilimcisi, dilbilimci, hekim, filozof ve birçok eserin yazarı olan El-Muveffak Ebu Muhammed Abdül Latif ibn Yusuf, Hicri 557 yılında doğmuş, İbn el-Batti ve Ebu Zur'a da dahil olmak üzere birçok kişiden ilim öğrenmiş ve Ebu el-Kâsım ibn Fadlan'dan fıkıh eğitimi almıştır. Halep'te yaşamış ve birçok kitabı ezberlemiştir. Eserleri arasında İbn Babaşad'ın dilbilgisine girişine tefsir, Makamet tefsiri, Banat Su'ad tefsiri, on ciltlik mantık, doğa bilimleri ve teoloji üzerine büyük derleme, Yahudiler ve Hristiyanlar hakkında reddiye ve üç ciltlik, kısaltılmış nadir hadisler tefsiri bulunmaktadır. Ayrıca İbn Majah'ın tıp ile ilgili hadislerine de tefsir yazmıştır. El-Dhahabi şöyle demiştir: \"O, eski zamanların en zeki ve dil, edebiyat, tıp ve ilim alanlarında en yetenekli kişilerinden biriydi, fakat çok iddialı olması onu küçülttü. Sözlerinden biri şudur: 'Öğrenmenin acısını çekmeyen, bilginin tadını da tatmaz; çaba göstermeyen, başarıya ulaşamaz.' Hac ibadetini yerine getirmek için Halep'ten Irak'a gitti, ancak 629 Hicri yılının Muharrem ayının on ikinci gününde Bağdat'ta vefat etti.\" {Kaynak: Şadharat-Dhahab, s. 132}"
  id: "Al-Muwaffaq Abu Muhammad Abd al-Latif ibn Yusuf, seorang ulama yang menguasai banyak disiplin ilmu, ahli tata bahasa mazhab Syafi'i Baghdadi, ahli bahasa, dokter, filsuf, dan penulis banyak karya; beliau lahir pada tahun 557 H dan belajar dari banyak orang, termasuk Ibn al-Batti dan Abu Zur'ah, serta mempelajari fiqih di bawah bimbingan Abu al-Qasim ibn Fadlan. Beliau tinggal di Aleppo dan menghafal banyak buku. Di antara karya-karyanya adalah tafsir atas pengantar tata bahasa Ibn Babashadh, tafsir atas Maqamat, tafsir atas Banat Su'ad, Kumpulan Besar tentang logika, ilmu pengetahuan alam, dan teologi dalam sepuluh jilid, bantahan terhadap orang Yahudi dan Kristen, dan tafsir atas hadits-hadits langka dalam tiga jilid, yang telah diringkasnya. Beliau juga menulis tafsir atas hadits-hadits Ibn Majah yang berkaitan dengan kedokteran. Al-Dhahabi berkata: Beliau adalah salah satu orang yang paling cerdas dan terampil dalam bahasa, sastra, kedokteran, dan ilmu pengetahuan di zaman dahulu, tetapi banyak klaimnya justru mengurangi kebesarannya. Di antara ucapannya: Barangsiapa tidak menanggung penderitaan belajar, ia tidak akan merasakan kenikmatan ilmu, dan barangsiapa tidak berusaha, ia tidak akan berhasil. Beliau melakukan perjalanan dari Aleppo untuk menunaikan ibadah haji ke Irak, tetapi kematian menjemputnya di Baghdad pada tanggal 12 Muharram tahun 629 Hijriah. {kutipan:shadharat-dhahab hlm. 132}."
