label: { ar: "الضيزن بن معاوية التنوخي", en: "al-Dayzan ibn Mu'awiya", fr: "Al-Dayzan ibn Mu’awiya", es: "al-Dayzan ibn Mu'awiya", ur: "دیزان بن معاویہ" }
summary:
  ar: "الضيزن بن جبهلة وجبهلة أمه وهو الضيزن بن معاوية ملك تنوخ، تملك ديار الحضر بعد ملوك السريانيين، كان كثير الجنود مهادناً للروم متحيزاً إليهم يغير رجاله على العراق والسواد، فتحصن بالحضر حين نزل عليه سابور الجنود فدلته ابنته النضيرة على فتحه فقتله سابور ومن معه وهدم الحصن {cite:muruj-al-dhahab p. 552-553}."
  en: "King of Tanukh holding Hatra — 'al-Dayzan ibn Jabhala' named for his mother — a Roman-aligned warlord whose daughter al-Nadira betrayed the fortress to Shapur; he was killed and Hadra razed {cite:muruj-al-dhahab p. 552-553}."
  fr: "Roi des Tanukh tenant Hatra — « al-Dayzan ibn Jabhala », nommé d’après sa mère —, chef de guerre allié aux Romains dont la fille al-Nadira livra la forteresse à Shapur ; il fut tué et Hadra rasée {cite:muruj-al-dhahab p. 552-553}."
  es: "Rey de Tanukh que controlaba Hatra — 'al-Dayzan ibn Jabhala' llamado así por su madre — un caudillo aliado de los romanos cuya hija al-Nadira traicionó la fortaleza a Shapur; fue asesinado y Hadra arrasada {cite:muruj-al-dhahab p. 552-553}."
  ur: "تنوخ کے بادشاہ نے حاترہ کو پکڑ رکھا تھا - 'الدیزان ابن جبالہ' کا نام اپنی ماں کے نام پر رکھا گیا تھا - ایک رومی جنگجو سردار جس کی بیٹی الندیرہ نے قلعہ کو شاپور کے حوالے کر دیا تھا۔ وہ مارا گیا اور حدرہ نے مسمار کر دیا 552-553}۔"
  tr: "Al-Dhayzan ibn Jabhala (annesi Jabhala idi) ve kendisi Tanukh kralı Al-Dhayzan ibn Muawiya idi. Süryani krallarından sonra Al-Hadar topraklarını yönetti. Çok sayıda askeri vardı, Romalılara karşı hoşgörülüydü ve onlara karşı taraflıydı. Adamları Irak ve Sawad'a baskınlar düzenledi. Şapur'un askerleri üzerine geldiğinde Al-Hadar'da kendini tahkim etti ve kızı Al-Nadhira ona şehri nasıl fethedeceğini gösterdi. Bunun üzerine Şapur onu ve yanındakileri öldürdü ve kaleyi yıktı. {cite:muruj-al-dhahab s. 552-553}"
  id: "Al-Dhayzan ibn Jabhala, dan Jabhala adalah ibunya, dan dia adalah Al-Dhayzan ibn Muawiya, raja Tanukh. Dia memerintah wilayah Al-Hadar setelah raja-raja Siria. Dia memiliki banyak tentara, bersikap lunak terhadap Romawi, dan berpihak kepada mereka. Pasukannya menyerbu Irak dan Sawad. Dia membentengi dirinya di Al-Hadar ketika tentara Shapur menyerangnya, dan putrinya Al-Nadhira menunjukkan kepadanya cara menaklukkannya. Maka Shapur membunuhnya dan orang-orang yang bersamanya dan menghancurkan benteng tersebut. {cite:muruj-al-dhahab hlm. 552-553}."
