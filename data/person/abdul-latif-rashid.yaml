summary:
  ar: "عبد اللطيف جمال رشيد (وُلد 10 آب 1944)، سياسي كردي عراقي، رئيس جمهورية العراق من تشرين الأول 2022 إلى نيسان 2026 خلفًا لبرهم صالح. مهندس مدني درس في مانشستر وليفربول، كان الناطق باسم الاتحاد الوطني الكردستاني في بريطانيا، وتولى وزارة الموارد المائية من 2003 إلى 2010 ثم عمل مستشارًا أقدم للرئيس قبل انتخابه رئيسًا."
  en: "Abdul Latif Jamal Rashid (born 10 August 1944) is an Iraqi Kurdish politician who was president of Iraq from October 2022 to April 2026, in succession to Barham Salih. A civil engineer educated at Manchester and Liverpool, he was the Patriotic Union of Kurdistan's spokesman in the United Kingdom, Minister of Water Resources from 2003 to 2010, and a senior presidential adviser before his election as president."
  ur: "عبد اللطیف جمال رشید (پیدائش 10 اگست 1944ء) ایک عراقی کرد سیاست دان ہیں جو اکتوبر 2022ء سے اپریل 2026ء تک برہم صالح کے جانشین کے طور پر جمہوریۂ عراق کے صدر رہے۔ وہ مانچسٹر اور لیورپول سے تعلیم یافتہ سول انجینئر ہیں، برطانیہ میں پٹریاٹک یونین آف کردستان کے ترجمان رہے، 2003ء سے 2010ء تک وزیرِ آبی وسائل اور پھر صدارتی مشیرِ اعلیٰ رہے۔"
