summary:
  ar: "سياسي شيوعي وكاتب وصحفي أفغاني، وُلد سنة 1917 في ناوا بولاية غزني لأسرة فلاحية بشتونية. أسس حزب الشعب الديمقراطي الأفغاني سنة 1965 وكان أمينه العام، وقاد الدولة بعد انقلاب ثور في أبريل 1978 حتى أطاح به حفيظ الله أمين في سبتمبر 1979 وقُتل في كابل في أكتوبر من السنة نفسها."
  en: "Afghan communist politician, writer and journalist, born in 1917 at Nawa in Ghazni Province to a Pashtun peasant family. He founded the People's Democratic Party of Afghanistan in 1965 and was its general secretary, and headed the state after the April 1978 Saur Revolution until Hafizullah Amin overthrew him in September 1979; he was murdered at Kabul that October."
  ur: "افغان کمیونسٹ سیاست دان، ادیب اور صحافی، جو 1917ء میں صوبہ غزنی کے ناوا میں ایک پشتون کسان گھرانے میں پیدا ہوئے۔ انھوں نے 1965ء میں پیپلز ڈیموکریٹک پارٹی آف افغانستان کی بنیاد رکھی اور اس کے جنرل سیکرٹری رہے، اور اپریل 1978ء کے ثور انقلاب کے بعد سربراہِ مملکت بنے حتیٰ کہ ستمبر 1979ء میں حفیظ اللہ امین نے انھیں معزول کیا اور اسی اکتوبر میں کابل میں قتل کر دیا گیا۔"
