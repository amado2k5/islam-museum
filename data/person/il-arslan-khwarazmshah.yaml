id: person/il-arslan-khwarazmshah
class: person
label: { ar: "إيل أرسلان بن أتسز خوارزمشاه", en: "Il-Arslan ibn Atsiz, Khwarazmshah", ur: "ایل ارسلان بن اتسز، خوارزم شاہ" }
summary:
  ar: "خوارزمشاه أنوشتكيني (551–567هـ/1157–1172م)، ولاه أبوه أتسز جند سنة 547هـ، ثم ضرب نقودًا مستقلة، واتخذ لقب «السلطان الأعظم» بعد إخضاع نسا ودهستان ونيسابور {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 99} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 100} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 101}."
  en: "Anushtegin Khwarazmshah (551–567/1157–1172) whom his father Atsiz made governor of Jand in 547 AH; he later struck coins independently and took the title 'the greatest sultan' after subduing Nasa, Dihistan and Nishapur {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 99} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 100} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 101}."
  ur: "انوشتگینی خوارزم شاہ (551–567ھ/1157–1172ء) جنہیں ان کے والد اتسز نے 547ھ میں جند کا والی بنایا؛ بعد میں انہوں نے خودمختار سکے ڈھالے اور نسا، دہستان اور نیشاپور کو زیر کرنے کے بعد «السلطان الاعظم» کا لقب لیا {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 99} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 100} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 101}۔"
