summary:
  en: "A daughter of Abu Sufyan ibn Harb and a wife of the Prophet — one of the Mothers of the Believers. When her father came to Medina to renew the truce she folded away the Prophet's bedding rather than let him sit on it."
  ar: "بنت أبي سفيان بن حرب وإحدى أمهات المؤمنين؛ هاجرت إلى الحبشة مع زوجها عبيد الله بن جحش وابنتها حبيبة، وكان اسمها رملة، ثم تنصّر زوجها بالحبشة بحسب ابن إسحاق وتزوجها النبي بعده. ولما جاء أبوها المدينة يستأنف العقد طوت فراش النبي دونه، فقال: أبالفراش بي رغبت أم بي؟ فقالت: هو فراش رسول الله وأنت رجل مشرك نجس، فلم أحب أن تجلس عليه."
