summary:
  ar: "أبو الحرم مكي بن ريان بن شبة بن صالح الماسرجسي، أصلاً موصلي الدار، المقرئ النحوي الضرير، الملقب صائم الدين؛ كان والده يصنع الأنطاع بماسرجس ومات فقيراً، وأضر وهو ابن ثمان أو تسع سنين فسلك مسلكه في النظم؛ اشتغل بالموصل بعلم القرآن والأدب ثم رحل إلى بغداد واجتمع بأئمة الأدب وقرأ على أبي محمد ابن الخشاب وابن العصار وابن الأنباري وأبي محمد سعيد بن الدهان، ثم عاد إلى الموصل فتصدر بها للإفادة وأخذ الناس عنه؛ قال ابن المستوفي: كان جامع فنون الأدب وحجة كلام العرب، المجمع على دينه وعقله والمتفق على علمه وفضله، وكان واسع الرواية قد نصب نفسه للانتفاع عليه بالقرآن العزيز {cite:wafayat-ayan}."
  en: "Makki al-Masirjisi (d. 603) — Mosul's blind qari' and grammarian, praised by Ibn al-Mustawfi as 'the proof of Arabic speech'; read under Ibn al-Khashshab and Ibn al-Assar in Baghdad {cite:wafayat-ayan}."
  es: "Makki al-Masirjisi (m. 603): qari' y gramático ciego de Mosul, elogiado por Ibn al-Mustawfi como \"la prueba del habla árabe\"; leer bajo Ibn al-Khashshab e Ibn al-Assar en Bagdad {cita:wafayat-ayan}."
  fr: "Makki al-Masirjisi (mort en 603) — le qari' et grammairien aveugle de Mossoul, salué par Ibn al-Mustawfi comme « la preuve de la parole arabe »; lu sous Ibn al-Khashshab et Ibn al-Assar à Bagdad {cite: wafayat-ayan}."
  ur: "مکی المسرجیسی ⁦(متوفی 603)⁩ - موصل کا نابینا قاری اور گرامر، ابن المصطفی نے 'عربی تقریر کا ثبوت' کے طور پر تعریف کی ہے۔ بغداد میں ابن الخشاب اور ابن العصر کے ذیل میں پڑھیں۔"
  tr: "Ebu el-Haram Makki ibn Reyan ibn Şabbe ibn Salih el-Mesarcisi, aslen Musul'lu, kör bir okucucu, dilbilgicisi ve oruç tutan olarak bilinirdi; babası Masrajis'te usta bir zanaatkârdı ve fakir öldü. Sekiz ya da dokuz yaşındayken zarar gördü, bu yüzden şiir yolunu izledi; Musul'da Kur'an bilimi ve edebiyatla uğraştı, ardından Bağdat'a giderek edebiyat imamlarıyla görüştü ve Ebu Muhammed bin el-Ebu Muhammed ile çalıştı Khashab, İbn el-Assar, İbn el-Anbari ve Ebu Muhammed Sa'id ibn al-Dahan. Sonra Musul'a döndü ve burada öğretme ve halka fayda sağlamada lider oldu. İbn el-Mustufi şöyle dedi: Edebi sanatlarda ustaydı ve Arapların konuşmasının argümanını savundu, dinine ve aklına oy birliğiyle bağlıydı ve bilgisi ile erdemi konusunda hemfikirdi. Soylu Kur'an'dan faydalanmak için geniş bir rivayet anlatımına kendini adadı {cite::Wafayat-ayan}."
  id: "Abu al-Haram Makki ibn Rayan ibn Shabbah ibn Salih al-Masarjisi, yang berasal dari Mosul, adalah seorang pembaca buta, ahli tata bahasa, dan dikenal sebagai yang berpuasa; ayahnya adalah seorang pengrajin terampil dalam Masraji dan meninggal dalam keadaan miskin. Ia terluka saat berusia delapan atau sembilan tahun, sehingga ia menempuh jalan puisi; ia terlibat dalam ilmu Al-Qur'an dan sastra di Mosul, kemudian pergi ke Baghdad, bertemu dengan para imam sastra, dan belajar di bawah bimbingan Abu Muhammad ibn al-Khashab, Ibn al-Assar, Ibn al-Anbari, dan Abu Muhammad Sa'id ibn al-Dahan. Kemudian ia kembali ke Mosul, di mana ia menjadi pemimpin dalam pengajaran dan pemberian manfaat kepada masyarakat. Ibn al-Mustufi berkata: Ia adalah ahli seni sastra dan argumen untuk pidato orang Arab, secara bulat berpegang pada agama dan akalnya, serta sepakat pada pengetahuan dan kebajikannya. Ia mendedikasikan dirinya pada keluasan narasi demi mendapatkan manfaat dari Al-Qur'an yang mulia {sitasi:\" Wafayat-Ayan}."
