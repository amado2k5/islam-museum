summary:
  ar: "أبو الحرم مكي بن ريان بن شبة بن صالح الماسرجسي، أصلاً موصلي الدار، المقرئ النحوي الضرير، الملقب صائم الدين؛ كان والده يصنع الأنطاع بماسرجس ومات فقيراً، وأضر وهو ابن ثمان أو تسع سنين فسلك مسلكه في النظم؛ اشتغل بالموصل بعلم القرآن والأدب ثم رحل إلى بغداد واجتمع بأئمة الأدب وقرأ على أبي محمد ابن الخشاب وابن العصار وابن الأنباري وأبي محمد سعيد بن الدهان، ثم عاد إلى الموصل فتصدر بها للإفادة وأخذ الناس عنه؛ قال ابن المستوفي: كان جامع فنون الأدب وحجة كلام العرب، المجمع على دينه وعقله والمتفق على علمه وفضله، وكان واسع الرواية قد نصب نفسه للانتفاع عليه بالقرآن العزيز {cite:wafayat-ayan}."
  en: "Makki al-Masirjisi (d. 603) — Mosul's blind qari' and grammarian, praised by Ibn al-Mustawfi as 'the proof of Arabic speech'; read under Ibn al-Khashshab and Ibn al-Assar in Baghdad {cite:wafayat-ayan}."
