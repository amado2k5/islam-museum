summary:
  ar: "شريح بن عامر رجل من بني سعد بن بكر بن هوازن؛ خلفه خالد بن الوليد بالخريبة حين فتحها وهي مسلحة للأعاجم فقتل وسبى ثم أتى نهر المرأة ففتح قصرها صلحاً عن النوشجان بن جسنسما."
  en: "Shurayh ibn Amir of Sa'd ibn Bakr ibn Hawazin; Khalid left him over conquered al-Khurayba — a Persian strongpoint where he killed and captured — then he reached Nahr al-Mar'a and took its palace by treaty from al-Nushajan."
  es: "Shurayh ibn Amir de Sa'd ibn Bakr ibn Hawazin; Khalid le dejó al mando de al-Khurayba, un punto fuerte persa donde mató y capturó, luego llegó a Nahr al-Mar'a y tomó su palacio por tratado de al-Nushajano."
  fr: "Shurayh ibn Amir de Sa'd ibn Bakr ibn Hawazin; Khalid le laissa après avoir conquis al-Khurayba — un point fort perse où il tua et captura — puis il atteignit Nahr al-Mar'a et prit son palais par traité à al-Nushajan."
  ur: "سعد بن بکر بن حوازن کا شوریح بن عامر؛ خالد نے اسے فتح الخرائبہ پر چھوڑ دیا - ایک فارسی مضبوط مقام جہاں اس نے مارا اور قبضہ کرلیا - پھر وہ نہر المرعہ پہنچا اور النشاجان سے معاہدہ کرکے اس کا محل لے لیا۔"
