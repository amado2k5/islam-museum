summary:
  ar: "جعفر بن محمد بن جعفر الثقفي، سمع أباه وعباد بن العوام وأبا بكر بن عياش وهشيمًا وغيرهم، ونزل الموصل فحدث بها، وتوفى سنة تسع وخمسين ومائتين {cite:muntazam-ibn-al-jawzi p. 106}."
  en: "Ja'far ibn Muhammad al-Thaqafi, who transmitted from his father, 'Abbad ibn al-'Awwam, Ibn 'Uyayna and Hushaym, and settled and taught at Mosul; he died in 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  es: "Ja'far ibn Muhammad al-Thaqafi, quien transmitió de su padre, 'Abbad ibn al-'Awwam, Ibn 'Uyayna y Hushaym, y se estableció y enseñó en Mosul; murió en 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  fr: "Ja'far ibn Muhammad al-Thaqafi, qui a transmis de son père, 'Abbad ibn al-'Awwam, Ibn 'Uyayna et Hushaym, et s'est installé et a enseigné à Mossoul; il est mort en 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  ur: "جعفر بن محمد الثقفی، جنہوں نے اپنے والد عباد بن العوام، ابن عیینہ اور ہشیم سے نقل کیا اور موصل میں سکونت اختیار کی اور تعلیم دی۔ ان کی وفات 259ھ میں ہوئی۔ 106}۔"
  tr: "Ja'far ibn Muhammed bin Ca'far al-Thaqafi, babası 'Abbad ibn al-Awwam, Ebu Bekir bin Ayyash, Haşima ve diğerlerinden haber aldı. Musul'a yerleşti, orada rivayet etti ve iki yüz elli dokuzuncu yılda öldü {atıf:Muntazam-ibn-al-Jawzi s. 106}."
  id: "Ja'far ibn Muhammad ibn Ja'far al-Thaqafi mendengar dari ayahnya, 'Abbad ibn al-Awwam, Abu Bakr ibn Ayyash, Hashima, dan lainnya. Ia menetap di Mosul dan bercerita di sana, dan meninggal pada tahun dua ratus lima puluh sembilan {cite:muntazam-ibn-al-jawzi hlm. 106}."
