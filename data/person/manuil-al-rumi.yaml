id: person/manuil-al-rumi
class: person
label: { ar: "منويل الرومي", en: "Manuel the Roman", es: "Manuel the Roman", fr: "Manuel the Roman", ur: "مینوئل رومن" }
summary:
  ar: "منويل الرومي الخصي؛ بعثه قسطنطين بن هرقل في ثلاثمائة مركب مشحونة بالمقاتلة فدخل الإسكندرية سنة خمس وعشرين — وقيل ثلاث وعشرين — وقتل من بها من روابط المسلمين إلا من لطف للهرب، فسار إليه عمرو بن العاص في خمسة عشر ألفاً فهزمهم إلى الإسكندرية فتحصّنوا بها ونصبوا العرّادات فنصب عمرو المجانيق حتى أخذت جدرها فدخلها بالسيف وقُتل منويل."
  en: "Manuel the Roman, the eunuch; Constantine son of Heraclius sent him with three hundred ships laden with fighters — he entered Alexandria in year 25, or 23 by another report, slaying the Muslim ribat there save those who escaped; Amr ibn al-As marched on him with fifteen thousand, routed them back into the city where they set up the arrada-engines, then planted mangonels till they took the walls and entered by the sword — and Manuel was killed."
  es: "Manuel el Romano, el eunuco; Constantino hijo de Heraclio lo envió con trescientos barcos cargados de guerreros; entró en Alejandría en el año 25, o 23 según otro relato, matando allí a los ribat musulmanes salvo a los que escaparon; Amr ibn al-As marchó contra él con quince mil, los hizo retroceder hasta la ciudad donde instalaron las máquinas de arrada, luego plantaron mangoneles hasta que tomaron las murallas y entraron por la espada, y Manuel fue asesinado."
  fr: "Manuel le Romain, l'eunuque; Constantin, fils d'Héraclius, l'envoya avec trois cents navires chargés de combattants — il entra à Alexandrie en l'an 25, ou 23 selon un autre récit, massacrant le ribat musulman qui s'y trouvait, à l'exception de ceux qui s'échappèrent; Amr ibn al-As marcha sur lui avec quinze mille hommes, les repoussa dans la ville où ils installèrent les engins arrada, puis placèrent des mangonneaux jusqu'à ce qu'ils prennent les murs et entrent par l'épée — et Manuel fut tué."
  ur: "مینوئل رومن، خواجہ سرا؛ ہرقل کے بیٹے قسطنطین نے اسے جنگجوؤں سے لدے تین سو بحری جہاز بھیجے - وہ 25 یا 23 میں ایک اور رپورٹ کے مطابق اسکندریہ میں داخل ہوا، وہاں مسلمانوں کے رباط کو مار ڈالا اور جو بچ گئے تھے؛ عمرو بن العاص نے پندرہ ہزار کے ساتھ اس پر چڑھائی کی، انہیں واپس شہر کی طرف لے گیا جہاں انہوں نے ارادہ کے انجن لگائے، پھر مینگونیل لگائے یہاں تک کہ وہ دیواروں کو لے کر تلوار سے اندر داخل ہوئے اور مینوئل مارا گیا۔"
