id: person/manuil-al-rumi
class: person
label: { ar: "منويل الرومي", en: "Manuel the Roman" }
summary:
  ar: "منويل الرومي الخصي؛ بعثه قسطنطين بن هرقل في ثلاثمائة مركب مشحونة بالمقاتلة فدخل الإسكندرية سنة خمس وعشرين — وقيل ثلاث وعشرين — وقتل من بها من روابط المسلمين إلا من لطف للهرب، فسار إليه عمرو بن العاص في خمسة عشر ألفاً فهزمهم إلى الإسكندرية فتحصّنوا بها ونصبوا العرّادات فنصب عمرو المجانيق حتى أخذت جدرها فدخلها بالسيف وقُتل منويل."
  en: "Manuel the Roman, the eunuch; Constantine son of Heraclius sent him with three hundred ships laden with fighters — he entered Alexandria in year 25, or 23 by another report, slaying the Muslim ribat there save those who escaped; Amr ibn al-As marched on him with fifteen thousand, routed them back into the city where they set up the arrada-engines, then planted mangonels till they took the walls and entered by the sword — and Manuel was killed."
