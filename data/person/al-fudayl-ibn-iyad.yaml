summary:
  ar: "أبو علي، مولده بخراسان قدم الكوفة وسمع من المنصور بن المعتمر ثم تعبد وانتقل إلى مكة فأقام بها حتى مات سنة سبع وثمانين ومائة، دخل على الرشيد مقنعاً رأسه فقال له أنت يا حسن الوجه الذي أمر هذه الأمة في يدك وعنقك لقد تقلدت أمراً عظيماً فبكى الرشيد، واستعفى من البدرة فلما عذله سفيان بن عيينة قال لو طابت لأولئك لطابت لي {cite:muruj-al-dhahab p. 341-342}."
  en: "The Kufan-born ascetic of Mecca who told al-Rashid to his face 'a mighty charge' — and refused the gift-bag lest it be impure {cite:muruj-al-dhahab p. 341-342}."
