label: { ar: "الفضيل بن عياض", en: "al-Fudayl ibn 'Iyad", fr: "Al-Fudayl ibn Iyad", es: "al-Fudayl ibn 'Iyad", ur: "الفضیل بن عیاض" }
summary:
  ar: "أبو علي، مولده بخراسان قدم الكوفة وسمع من المنصور بن المعتمر ثم تعبد وانتقل إلى مكة فأقام بها حتى مات سنة سبع وثمانين ومائة، دخل على الرشيد مقنعاً رأسه فقال له أنت يا حسن الوجه الذي أمر هذه الأمة في يدك وعنقك لقد تقلدت أمراً عظيماً فبكى الرشيد، واستعفى من البدرة فلما عذله سفيان بن عيينة قال لو طابت لأولئك لطابت لي {cite:muruj-al-dhahab p. 341-342}."
  en: "The Kufan-born ascetic of Mecca who told al-Rashid to his face 'a mighty charge' — and refused the gift-bag lest it be impure {cite:muruj-al-dhahab p. 341-342}."
  fr: "Ascète de La Mecque né au Khorassan qui dit en face à al-Rashid « une lourde charge » et refusa la bourse de dons de peur qu’elle ne soit impure {cite:muruj-al-dhahab p. 341-342}."
  es: "El asceta de La Meca, nacido en Kufa, que le dijo a al-Rashid a la cara \"una acusación muy grave\" y rechazó la bolsa de regalos por temor a que fuera impura {cite:muruj-al-dhahab p. 341-342}."
  ur: "مکہ کا کوفان میں پیدا ہونے والا سنیاسی جس نے الرشید کو اپنے چہرے پر 'ایک زبردست الزام' بتایا - اور تحفے کے تھیلے سے انکار کر دیا کہ کہیں یہ ناپاک نہ ہو {حوالہ: مروج الذہب صفحہ 341-342}۔"
  tr: "Horasan'da doğan Ebu Ali, Kufe'ye geldi ve orada el-Mansur İbn el-Mu'tamir'den vaaz dinledi. Daha sonra kendini ibadete adadı ve Mekke'ye yerleşti. 187 yılında vefat edene kadar orada kaldı. Başını örtmüş halde el-Raşid'in yanına girdi ve ona, \"Ey yakışıklı, bu ümmetin işleri senin elinde ve boynunda olan, büyük bir sorumluluk üstlendin\" dedi. El-Raşid ağladı ve keseden muaf tutulmasını istedi. Sufyan İbn Uyayna onu azarlayınca, \"Eğer bu onlar için hayırlıysa, benim için de hayırlıdır\" dedi. {kaynak: Muruj-al-Dhahab s. 341-342}"
  id: "Abu Ali, lahir di Khorasan, datang ke Kufa dan mendengar dari Al-Mansur Ibn Al-Mu’tamir, kemudian ia mengabdikan dirinya untuk beribadah dan pindah ke Mekah, di mana ia tinggal sampai wafat pada tahun 187. Ia menemui Al-Rashid dengan kepala tertutup, dan ia berkata kepadanya, “Wahai engkau yang tampan, yang di tangan dan lehermu terletak urusan umat ini, engkau telah memikul tanggung jawab yang besar.” Al-Rashid menangis dan meminta untuk dibebaskan dari tugas tersebut. Ketika Sufyan Ibn Uyaynah menegurnya, ia berkata, “Jika itu baik bagi mereka, maka itu juga baik bagiku.” {kutipan:muruj-al-dhahab hlm. 341-342}"
