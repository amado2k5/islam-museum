summary:
  ar: "سياسي ورجل دولة ألباني (1844-1919)، مؤسس ألبانيا الحديثة ولقبه «أبو الأمة». بدأ موظفا عثمانيا رفيعا ومتعاونا مع مدحت باشا، ثم عاش ثماني سنوات في المنفى وقاد معارضة دستورية، حتى أعلن استقلال ألبانيا في فلوره في 28 نوفمبر 1912 وصار أول رئيس وزراء ووزير خارجية لها (1912-1914)، ومات في منفاه بإيطاليا."
  en: "Albanian politician and statesman (1844–1919), founder of modern Albania, remembered as 'Father of the Nation'. He rose as a high Ottoman civil servant and collaborator of Midhat Pasha, spent eight years in exile leading constitutional opposition, then proclaimed Albania's independence at Vlorë on 28 November 1912 and became its first prime minister and foreign minister (1912–1914); he died in exile in Italy."
  ur: "البانوی سیاست دان اور مدبر (1844-1919)، جدید البانیہ کے بانی، ’’قوم کا باپ‘‘ کہلاتے ہیں۔ عثمانی ملازمت میں مدحت پاشا کے معتمد ساتھی رہے، آٹھ سال جلاوطنی میں آئینی اپوزیشن کی قیادت کی، پھر 28 نومبر 1912 کو ولورہ میں البانیہ کی آزادی کا اعلان کیا اور اس کے پہلے وزیرِ اعظم و وزیرِ خارجہ بنے (1912-1914)؛ وفات اٹلی میں جلاوطنی کے دوران ہوئی۔"
