  ur: "حسین العشری (1737–1781)، بغدادی کے اصولی فقیہ، شاعر اور عمدہ نقل نگار چھوٹے شافعی کہلاتے ہیں۔"
  tr: "Hüseyin bin Ali El-Aşari, Bağdatlı bir hukukçu, Usuli hukukçusu, şair ve hattattı; Al-Shafi'i Al-Saghir olarak bilinir. Basra'da eğitim gördü; 1195 Hicri (1781 M.S.) yılında vefat etti."
  id: "Hussein bin Ali Al-Ashari adalah seorang ahli hukum, ahli hukum Usuli, penyair, dan kaligrafer dari Baghdad yang dikenal sebagai Al-Shafi'i Al-Saghir. Ia belajar di Basra; ia meninggal pada tahun 1195 AH (1781 M)."
