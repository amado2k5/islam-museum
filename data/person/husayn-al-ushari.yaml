summary:
  ar: "حسين بن علي العشاري، فقيه أصولي وشاعر وخطاط بغدادي لُقّب بالشافعي الصغير، درّس بالبصرة؛ توفي سنة 1195هـ ⁦(1781م)⁩."
  en: "Husayn al-'Ushari (1737–1781), Baghdadi usuli jurist, poet and fine copyist called the little Shafi'i."
  es: "Husayn al-'Ushari (1737–1781), jurista usuli, poeta y excelente copista de Bagdad, conocido como el pequeño shafi'í."
