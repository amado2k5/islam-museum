summary:
  ar: أنصارية من بني حارثة؛ ذكرها أبو عمر وقال إن حديثها لا يصح لانفراد حرام بن عثمان به وهو ضعيف عندهم جميعاً؛ ويذكر ابن سعد أنها أسلمت وبايعت وأن زوجها الضحاك بن خليفة.
  en: An Ansari woman of Banu Haritha; Abu Umar mentions her and says her hadith is not sound because Haram ibn Uthman, who is weak in everyone's view, is alone in narrating it; Ibn Sa'd says she embraced Islam and pledged and that her husband
    was al-Dahhak ibn Khalifa.
  ur: "بنو حارثہ کی انصاری خاتون؛ ابو عمر ان کا ذکر کرتے ہیں اور کہتے ہیں کہ ان کی حدیث صحیح نہیں کیونکہ حرام بن عثمان سب کی نظر میں کمزور ہے۔"
