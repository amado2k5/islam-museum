label: { ar: "أبو الحسن الشباش البصري", en: "Abu al-Hasan al-Shabash al-Basri", fr: "Abu al-Hasan al-Shabash al-Basri", es: "Abu al-Hasan al-Shabash al-Basri", ur: "ابو الحسن الشباش البصری" }
summary:
  ar: "علي بن الحسين بن محمود البغدادي المعروف بالشباش، مستقر بالبصرة هو وأبوه وعمه، مستوعبون بها وكانت الظنون تختلف في مذهبهم إلا أن الأول في أنهم من الشيعة الإمامية والغلاة الباطنية أغلب، وكانت لهم نعم واسعة وأموال كثيرة وشيعة من سواد البصرة والقرامطة والبطون المتفرقة يخفون طاعتهم ويحملون إليهم ما يجرونه مجرى الزكوات. وتظاهر أبو الحسن بمخالطة الأجناد ومداخلة العمال والأكل والشرب وسماع الغناء يعتذر أنه يقصد نفي الظنة عنه. ويحكي ابن الجوزي من خط ابن عقيل أنه كان له طيور سوابق وأصدقاء في البلاد تسريح بالحمام برقاع إلى القرى فيخبر أهلها بأحوالهم حديث من هو عندهم ثم يقول «قد تجدد الساعة كذا وكذا» فيدهشون، وكان يأخذ عصفوراً يشد في رجله بلفة فيها كتاب لطيف ويقول «يا بارش» يوهم أنه يخاطب شيطاناً ثم يطلق العصفور فترتفع الورقة نحو السماء بعيونهم والغلام على سطح الدار يجذبها ويفيد بها {cite:muntazam-ibn-al-jawzi j.8 p.152-153}."
  en: "Ali ibn al-Husayn ibn Mahmud al-Baghdadi, known as al-Shabash, who settled at Basra with his father and uncle and came to hold sway there. Accounts of their creed differ, though the view that they were Imami Shi'a and extreme Batinis is the more prevalent. They had ample wealth and many funds, and Shi'a from the Basra countryside, the Qaramita and scattered clans would secretly obey them and bring them what they treated as zakat. Abu al-Hasan made a show of mixing with soldiers and officials, eating, drinking and listening to music, and explained that he meant to clear suspicion from himself. Ibn al-Jawzi relays from the hand of Ibn Aqil that he kept racing pigeons and friends in the lands: he sent doves with notes to villages, informing their people of their circumstances and the news of those among them, then said 'it has just now happened, such and such', and they were astonished. He would take a sparrow, tie to its leg a packet holding a small letter, and say 'O Barish' as though addressing a demon; then he released the sparrow, and the paper rose toward the sky before their eyes while the boy on the rooftop drew it down and made use of it {cite:muntazam-ibn-al-jawzi j.8 p.152-153}."
  fr: "Ali ibn al-Husayn ibn Mahmud al-Baghdadi, connu sous le nom d'al-Shabash, qui s'est installé à Bassorah avec son père et son oncle et est venu y régner. Les récits de leurs croyances diffèrent, bien que l'opinion selon laquelle ils étaient des imami chiites et des batinis extrêmes soit la plus répandue. Ils avaient de grandes richesses et beaucoup de fonds, et les chiites de la campagne de Bassora, les Qaramita et les clans dispersés leur obéissaient secrètement et leur apportaient ce qu'ils traitaient de zakat. Abu al-Hasan a fait un spectacle de mixage avec des soldats et des fonctionnaires, mangeant, buvant et écoutant de la musique, et a expliqué qu’il avait l’intention de se débarrasser de ses soupçons. Ibn al-Jawzi rapporte de la main d'Ibn Aqil qu'il gardait des pigeons voyageurs et des amis dans les terres : il a envoyé des colombes avec des notes aux villages, informant leurs habitants de leurs circonstances et des nouvelles de ceux d'entre eux, puis a dit \"il vient de se passer, tel et tel\" et ils furent étonnés. Il prenait un moineau, liait à sa patte un paquet contenant une petite lettre et disait « O Barish  » comme s’il s’adressait à un démon. Puis il relâcha le moineau, et le papier s’éleva vers le ciel sous leurs yeux pendant que le garçon sur le toit l’attirait vers le bas et l’utilisait {cite:muntazam-ibn-al-jawzi j.8 p.152-153}."
  es: "Ali ibn al-Husayn ibn Mahmud al-Baghdadi, conocido como al-Shabash, se estableció en Basora con su padre y su tío y llegó a ejercer un gran poder allí. Los relatos sobre su credo difieren, aunque la opinión más extendida es que eran chiíes imamíes y batinis extremistas. Poseían una gran riqueza y muchos fondos, y los chiíes de la campiña de Basora, los qaramitas y los clanes dispersos les obedecían en secreto y les traían lo que ellos consideraban zakat. Abu al-Hasan hacía alarde de mezclarse con soldados y funcionarios, comiendo, bebiendo y escuchando música, y explicaba que pretendía disipar cualquier sospecha sobre sí mismo. Ibn al-Jawzi relata, de Ibn Aqil, que mantenía palomas mensajeras y amigos en la región: enviaba palomas con notas a las aldeas, informando a sus habitantes de su situación y de las noticias de quienes se encontraban entre ellos, y luego decía: «Acaba de suceder esto», y se quedaban asombrados. Él tomaba un gorrión, le ataba a la pata un paquete que contenía una pequeña carta y decía \"Oh Barish\" como si se dirigiera a un demonio; luego soltaba al gorrión, y el papel se elevaba hacia el cielo ante sus ojos mientras el niño en el tejado lo bajaba y lo utilizaba {cite:muntazam-ibn-al-jawzi j.8 p.152-153}."
  ur: "علی بن الحسین ابن محمود البغدادی، جسے الشبش کہا جاتا ہے، جو اپنے والد اور چچا کے ساتھ بصرہ میں آباد ہوا اور وہاں حکومت کرنے آیا۔ ان کے عقیدے میں فرق ہے، حالانکہ یہ نظریہ زیادہ مروجہ ہے کہ وہ امامی شیعہ اور انتہا پسند بطینی تھے۔ ان کے پاس کافی دولت اور بہت سے فنڈز تھے، اور بصرہ کے دیہی علاقوں کے شیعہ، قرامطہ اور بکھرے ہوئے قبیلے خفیہ طور پر ان کی اطاعت کرتے اور ان کے پاس وہ چیزیں لاتے جو وہ زکوٰۃ کے طور پر لیتے تھے۔ ابو الحسن نے سپاہیوں اور اہلکاروں کے ساتھ گھل مل جانے، کھانے پینے اور موسیقی سننے کا ایک شو بنایا اور وضاحت کی کہ اس کا مقصد اپنے آپ سے شکوک کو دور کرنا ہے۔ ابن الجوزی نے ابن عقیل کے حوالے سے نقل کیا ہے کہ وہ زمینوں میں کبوتر اور دوستوں کی دوڑ لگاتا رہا: اس نے کبوتر دیہاتوں میں نوٹوں کے ساتھ بھیجے، وہاں کے لوگوں کو ان کے حالات اور ان میں سے لوگوں کی خبریں بتائیں، پھر کہا کہ یہ ابھی ہوا ہے، فلاں فلاں، اور وہ حیران رہ گئے۔ وہ ایک چڑیا لیتا، اس کی ٹانگ پر ایک پیکٹ باندھتا جس میں ایک چھوٹا سا خط تھا، اور 'اے باریش' ایسے کہتا جیسے کسی شیطان کو مخاطب کر رہا ہو۔ پھر اس نے چڑیا کو چھوڑ دیا، اور کاغذ ان کی آنکھوں کے سامنے آسمان کی طرف اٹھ گیا جب کہ چھت پر بیٹھے لڑکے نے اسے نیچے کھینچ کر اس سے استفادہ کیا۔"
  tr: "Ali bin el-Hüseyin bin Mahmud el-Bağdadi, namıdiğer el-Şebbeş, babası ve amcasıyla birlikte Basra'ya yerleşti. Orada iyi bilgiliydiler ve mezhepleri hakkında farklı görüşler vardı, ancak ilki, çoğunlukla İmam Şiilerden ve en uç Batini gruplarından geliyorlardı; bu grupların büyük nimetleri ve bol serveti vardı; Basra'nın kara bölgesinden Şiiler, Karmatlılar ve çeşitli aşiretlerden gelen Şiiler itaatlerini gizleyip zekattan aldıkları şeyleri onlara taşıdılar. Ebu el-Hasan, askerlerle karışıyormuş gibi yaptı, işçilere müdahale ediyor, yiyip içiyor ve şarkı dinliyormuş gibi yaptı, kendisi hakkındaki şüpheyi reddetmek istediği için özür diledi. İbn al-Jawzi, İbn Aqil'in sözünden anlatır; ülkede selefleri ve dostları olan kuşları vardı; bu kuşlar Raka'daki güvercinlerle köylere bırakılır, orada halkına durumlarını anlatır ve sonra 'Şu saat yenilendi,' derdi ve onları şaşırtır. Bir kuşu bacağına sarar, içinde güzel bir kitap olan bir kuş alır ve 'Ey Barş' derdi, şeytana hitap ettiğini sanırdı, sonra kuşu serbest bırakırdı, yaprağı gözleriyle gökyüzüne kaldırırdı ve evin çatısındaki çocuk onu çekip fayda sağlardı {cite:muntazam-ibn-al-jawzi J.8 s.152-153}."
  id: "Ali ibn al-Husayn ibn Mahmoud al-Baghdadi, yang dikenal sebagai al-Shabbash, menetap di Basra bersama ayah dan pamannya. Mereka sangat paham di sana, dan ada perbedaan pendapat tentang sekte mereka, tetapi yang pertama adalah bahwa mereka sebagian besar berasal dari Syiah Imami dan kelompok Batini yang paling ekstrem, yang memiliki berkah luas dan kekayaan melimpah, sementara Syiah dari kulit hitam Basra, Qarmatian, dan berbagai klan menyembunyikan ketaatan mereka dan membawa apa yang mereka terima dari zakat. Abu al-Hasan berpura-pura bercampur dengan tentara, mengganggu pekerja, makan dan minum, serta mendengarkan nyanyian, meminta maaf karena bermaksud menyangkal kecurigaan terhadapnya. Ibn al-Jawzi menceritakan dari kutipan Ibn Aqil bahwa ia memiliki burung dengan leluhur dan teman di negeri itu, yang akan dilepaskan oleh burung merpati di Raqa' ke desa-desa, di mana ia akan memberitahu orang-orang mereka tentang kondisi mereka, lalu berkata, 'Jam ini telah diperbarui,' membuat mereka terkejut. Ia akan mengambil seekor burung yang melilitkannya di kakinya dengan bungkus berisi buku indah dan berkata, 'O Barsh,' mengira burung itu sedang berbicara kepada iblis, lalu melepaskan burung itu, membuat daun itu terangkat ke langit dengan mata mereka, dan anak laki-laki di atap rumah akan menariknya dan memberi manfaat {cite:muntazam-ibn-al-jawzi J.8 hlm.152-153}."
