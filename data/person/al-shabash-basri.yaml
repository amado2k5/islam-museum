id: person/al-shabash-basri
class: person
label: { ar: "أبو الحسن الشباش البصري", en: "Abu al-Hasan al-Shabash al-Basri" }
summary:
  ar: "علي بن الحسين بن محمود البغدادي المعروف بالشباش، مستقر بالبصرة هو وأبوه وعمه، مستوعبون بها وكانت الظنون تختلف في مذهبهم إلا أن الأول في أنهم من الشيعة الإمامية والغلاة الباطنية أغلب، وكانت لهم نعم واسعة وأموال كثيرة وشيعة من سواد البصرة والقرامطة والبطون المتفرقة يخفون طاعتهم ويحملون إليهم ما يجرونه مجرى الزكوات. وتظاهر أبو الحسن بمخالطة الأجناد ومداخلة العمال والأكل والشرب وسماع الغناء يعتذر أنه يقصد نفي الظنة عنه. ويحكي ابن الجوزي من خط ابن عقيل أنه كان له طيور سوابق وأصدقاء في البلاد تسريح بالحمام برقاع إلى القرى فيخبر أهلها بأحوالهم حديث من هو عندهم ثم يقول «قد تجدد الساعة كذا وكذا» فيدهشون، وكان يأخذ عصفوراً يشد في رجله بلفة فيها كتاب لطيف ويقول «يا بارش» يوهم أنه يخاطب شيطاناً ثم يطلق العصفور فترتفع الورقة نحو السماء بعيونهم والغلام على سطح الدار يجذبها ويفيد بها {cite:muntazam-ibn-al-jawzi j.8 p.152-153}."
  en: "Ali ibn al-Husayn ibn Mahmud al-Baghdadi, known as al-Shabash, who settled at Basra with his father and uncle and came to hold sway there. Accounts of their creed differ, though the view that they were Imami Shi'a and extreme Batinis is the more prevalent. They had ample wealth and many funds, and Shi'a from the Basra countryside, the Qaramita and scattered clans would secretly obey them and bring them what they treated as zakat. Abu al-Hasan made a show of mixing with soldiers and officials, eating, drinking and listening to music, and explained that he meant to clear suspicion from himself. Ibn al-Jawzi relays from the hand of Ibn Aqil that he kept racing pigeons and friends in the lands: he sent doves with notes to villages, informing their people of their circumstances and the news of those among them, then said 'it has just now happened, such and such', and they were astonished. He would take a sparrow, tie to its leg a packet holding a small letter, and say 'O Barish' as though addressing a demon; then he released the sparrow, and the paper rose toward the sky before their eyes while the boy on the rooftop drew it down and made use of it {cite:muntazam-ibn-al-jawzi j.8 p.152-153}."
