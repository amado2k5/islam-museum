summary:
  ar: "المؤرخ أحمد بن محمد الكوفي المعروف بابن أعثم، صاحب كتاب «الفتوح»، رتّب فيه أخبار التاريخ الإسلامي من وفاة النبي وسقيفة بني ساعدة، وذكر رجاله."
  en: "The historian Ahmad ibn Muhammad al-Kufi, known as Ibn A'tham, author of 'al-Futuh', which arranges Islamic history from the Prophet's death and the Saqifa of Banu Sa'ida onward and records its personalities."
  es: "El historiador Ahmad ibn Muhammad al-Kufi, conocido como Ibn A'tham, autor de 'al-Futuh', obra que organiza la historia islámica desde la muerte del Profeta y la Saqifa de Banu Sa'ida en adelante, y que registra a sus personalidades."
  fr: "L'historien Ahmad ibn Muhammad al-Kufi, connu sous le nom d'Ibn A'tham, est l'auteur d'« al-Futuh », un ouvrage qui retrace l'histoire islamique depuis la mort du Prophète et la Saqifa des Banu Sa'ida jusqu'à nos jours, et qui recense les personnalités qui y ont participé."
  ur: "مؤرخ احمد بن محمد الکوفی، جسے ابن اعثم کے نام سے جانا جاتا ہے، 'الفتوح' کا مصنف، جو پیغمبر اسلام کی وفات سے لے کر بنو ساعدہ کے سقیفہ کے بعد کی اسلامی تاریخ کو ترتیب دیتا ہے اور اس کی شخصیات کو قلمبند کرتا ہے۔"
  tr: "Tarihçi Ahmed ibn Muhammed el-Kufi, İbn A'tham olarak bilinir ve 'El-Futuh' kitabının yazarı, Peygamber'in ölümünden Saqifah Banu Sa'idah'a kadar İslami tarihsel olayları düzenlemiş ve adamlarından bahsetmiştir."
  id: "Sejarawan Ahmad ibn Muhammad al-Kufi, yang dikenal sebagai Ibn A'tham, penulis buku 'Al-Futuh', mengatur peristiwa sejarah Islam sejak wafatnya Nabi dan Saqifah Banu Sa'idah, serta menyebutkan para tokohnya."
