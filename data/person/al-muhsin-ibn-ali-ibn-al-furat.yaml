id: person/al-muhsin-ibn-ali-ibn-al-furat
class: person
label: { ar: "المحسن بن علي بن الفرات" }
summary:
  ar: "ابن الوزير ابن الفرات؛ اختفى عند عمته وأخته الفضل بن جعفر بن الفرات وكانت تأخذه كل يوم إلى المقبرة في زي امرأة، فلما دخلت به دار امرأة صالحة رأته جارية سوداء فأخبرت مولاتها فركبت في سفينة وصاحت معي نصيحة لأمير المؤمنين فأخبرت نصر الحاجب بخبره فأمر نازوكاً صاحب الشرطة بإحضاره فعُذّب ليُجيب إلى مصادرة فلم يُجبهم إلى دينار واحد وقال لا أجمع لكم بين نفسي ومالي، ثم قُتل مع أبيه سنة 312هـ ذبحاً كما تُذبح الغنم وكان عمره ثلاثاً وثلاثين سنة {cite:kamil-ibn-al-athir p. 112-113}."
  en: "Son of the vizier Ibn al-Furat; hidden in women's dress by his aunt until a maid betrayed him, tortured without yielding a dinar — I will not join for you my self and my wealth — then slaughtered with his father in 312, aged thirty-three {cite:kamil-ibn-al-athir p. 112-113}."
