id: person/al-muhsin-ibn-ali-ibn-al-furat
class: person
label: { ar: "المحسن بن علي بن الفرات", en: "al-Muhsin ibn Ali ibn al-Furat", fr: "al-Muhsin ibn Ali ibn al-Furat", es: "al-Muhsin ibn Ali ibn al-Furat", ur: "المحسن ابن علی ابن الفرات" }
summary:
  ar: "ابن الوزير ابن الفرات؛ اختفى عند عمته وأخته الفضل بن جعفر بن الفرات وكانت تأخذه كل يوم إلى المقبرة في زي امرأة، فلما دخلت به دار امرأة صالحة رأته جارية سوداء فأخبرت مولاتها فركبت في سفينة وصاحت معي نصيحة لأمير المؤمنين فأخبرت نصر الحاجب بخبره فأمر نازوكاً صاحب الشرطة بإحضاره فعُذّب ليُجيب إلى مصادرة فلم يُجبهم إلى دينار واحد وقال لا أجمع لكم بين نفسي ومالي، ثم قُتل مع أبيه سنة 312هـ ذبحاً كما تُذبح الغنم وكان عمره ثلاثاً وثلاثين سنة {cite:kamil-ibn-al-athir p. 112-113}. وعند ابن الجوزي وأخذ علي بن عيسى حين ولي أبوه الوزارة سنة 304هـ فألبسه المحسن جبة صوف وأهانه وناله بالأذى الفاحش حتى استخرج منه اليسير {cite:muntazam-ibn-al-jawzi p. 466}"
  en: "Son of the vizier Ibn al-Furat; hidden in women's dress by his aunt until a maid betrayed him, tortured without yielding a dinar — I will not join for you my self and my wealth — then slaughtered with his father in 312, aged thirty-three {cite:kamil-ibn-al-athir p. 112-113}."
  fr: "Fils du vizir Ibn al-Furat  ; caché dans la robe des femmes par sa tante jusqu'à ce qu'une servante le trahisse, torturé sans céder un dinar - je ne rejoindrai pas pour vous mon moi et ma richesse - puis abattu avec son père en 312, âgé de trente-trois ans {cite:kamil-ibn-al-athir p. 112-113}."
  es: "Hijo del visir Ibn al-Furat; escondido con ropa de mujer por su tía hasta que una criada lo delató, torturado sin entregar un dinar —no uniré por ti mi ser ni mis riquezas—, luego asesinado junto con su padre en 312, a la edad de treinta y tres años {cite:kamil-ibn-al-athir p. 112-113}."
  ur: "وزیر ابن الفرات کا بیٹا؛ اس کی خالہ نے عورتوں کے لباس میں چھپایا یہاں تک کہ ایک نوکرانی نے اس کے ساتھ خیانت کی، ایک دینار دیئے بغیر تشدد کا نشانہ بنایا - میں آپ کے لیے اپنی جان اور اپنے مال میں شامل نہیں ہوں گا - پھر 312 میں اپنے والد کے ساتھ تینتیس سال کی عمر میں ذبح کیا گیا۔ 112-113}۔"
  tr: "İbn al-Wazir ibn al-Furat; teyzesi ve kız kardeşi el-Fadl ibn Cafer ibn al-Furat'tan kayboldu; her gün onu kadın kılığına girerek mezarlığa götürürdü. Doğru bir kadın evine girdiğinde, onu siyah bir köle kız olarak gördü. Hanımefendisine haber verdi, bir gemiye bindi ve benimle birlikte Müminler Komutanına öğüt vermemi istedi. Nasr al-Hacib'e haberini verdi, o da polis memuruna onu getirmesini emretti, işkence görerek el konuldu, ama tek bir dinara bile cevap vermedi. Sonra dedi ki, 'Hayatımı ve servetimi senin için birleştirmeyeceğim.' Sonra 312 Hicri'de, otuz üç yaşında babasıyla birlikte koyunların yaptığı gibi katledildi {atıf:kamil-ibn-al-athir s. 112-113}. İbn al-Jawzi'ye göre, Ali ibn İsa babası 304 Hicri yılında bakan olarak atadığında onu aldı. El-Muhsin onu yün bir pelerin giydirdi, küçük düşürdü ve ağır şekilde yaraladı, ta ki ondan az da olsa bir miktar koparana kadar {atıf:Muntazam-ibn-al-Jawzi s. 466}"
  id: "Ibn al-Wazir ibn al-Furat; ia menghilang dari bibi dan saudara perempuannya, al-Fadl ibn Ja'far ibn al-Furat, yang biasa membawanya setiap hari ke pemakaman dengan mengenakan pakaian wanita. Ketika seorang wanita benar masuk ke rumahnya, ia melihatnya sebagai budak perempuan kulit hitam. Ia memberitahu selirnya, naik kapal, dan berteriak bersama saya untuk memberi tahu Panglima Orang Beriman. Ia memberitahu Nasr al-Hajib tentang kabarnya, sehingga Nasr al-Hajib memerintahkan polisi untuk membawanya, dan ia disiksa untuk disita, tetapi ia tidak membalas satu pun dinar. Ia berkata, 'Saya tidak akan menggabungkan hidup dan harta saya untukmu.' Kemudian ia dibunuh bersama ayahnya pada tahun 312 H, disembelih seperti domba, pada usia tiga puluh tiga {cite:kamil-ibn-al-athir hlm. 112-113}. Menurut Ibn al-Jawzi, Ali ibn Isa mengambilnya ketika ayahnya diangkat menjadi menteri pada tahun 304 H. Al-Muhsin memakaikan dia dengan jubah wol, mempermalukannya, dan melukainya parah sampai dia mengambil sedikit saja dari Jawzi {cite:muntazam-ibn-al-jawzi hlm. 466}"
