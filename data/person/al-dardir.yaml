summary:
  ar: "أحمد بن محمد بن أحمد العدوي، أبو البركات، الشهير بالدردير، من فقهاء المالكية، ولد في بني عدي بمصر وتعلم في الأزهر وتوفي بالقاهرة، 1127 إلى 1201هـ؛ من كتبه «أقرب المسالك لمذهب الإمام مالك»."
  en: "Ahmad ibn Muhammad ibn Ahmad al-Adawi, Abu al-Barakat, known as al-Dardir, a Maliki jurist born at Bani Adi in Egypt, educated at al-Azhar, died in Cairo, 1127 to 1201 AH; author of «Aqrab al-masalik li-madhhab al-Imam Malik»."
  fr: "Ahmad ibn Muhammad ibn Ahmad al-Adawi, Abu al-Barakat, connu comme al-Dardir, juriste malikite né à Bani Adi en Égypte, formé à al-Azhar, mort au Caire, 1127 à 1201 H ; auteur d’« Aqrab al-masalik li-madhhab al-Imam Malik »."
  es: "Ahmad ibn Muhammad ibn Ahmad al-Adawi, Abu al-Barakat, conocido como al-Dardir, un jurista maliki nacido en Bani Adi en Egipto, educado en al-Azhar, murió en El Cairo entre 1127 y 1201 d. H.; autor de “Aqrab al-masalik li-madhhab al-Imam Malik”."
  ur: "احمد بن محمد بن احمد العدوی، ابو البرکات، الدردیر کے نام سے مشہور، ایک مالکی فقیہ مصر میں بنی عدی میں پیدا ہوئے، الازہر میں تعلیم پائی، قاہرہ میں وفات پائی، 1127 تا 1201 ہجری؛ \"عقرب المسالک لذہب الامام مالک\" کے مصنف۔"
