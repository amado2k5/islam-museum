summary:
  ar: "بديل بن طهفة البجلي؛ كان بعمان فكتب إليه الحجاج أن يسير إلى الديبل فلما لقيهم نفر به فرسه فأطاف به العدو فقتلوه وقال بعضهم قتله زط البذة."
  en: "Budayl ibn Tahfa al-Bajali; sent from Uman against Daybul, his horse shied, the enemy ringed and killed him — some say the Zutt of al-Budha did it."
  es: "Budayl ibn Tahfa al-Bajali; enviado desde Uman contra Daybul, su caballo se asustó, el enemigo lo rodeó y lo mató; algunos dicen que fue el Zutt de al-Budha quien lo hizo."
  fr: "Budayl ibn Tahfa al-Bajali; envoyé d'Uman contre Daybul, son cheval s'est cabré, l'ennemi l'a encerclé et tué — certains disent que c'est le Zutt d'al-Budha qui l'a fait."
  ur: "بدیل ابن طحفہ البجلی؛ عمان کی طرف سے دیبل کے خلاف بھیجا گیا، اس کا گھوڑا شرما گیا، دشمن نے گھنٹی بجائی اور اسے مار ڈالا - بعض کہتے ہیں کہ یہ سب بڈھا کے ذوت نے کیا۔"
  tr: "Badeel bin Tahfa el-Bajali; Umman'daydı, bu yüzden al-Hajjaj ona Dibal'e yürümesini yazdı. Onlarla karşılaştığında atı indi, düşman onu kuşattı ve öldürdü. Bazıları, 'Onu gülümseyerek öldürdü.' dedi."
  id: "Badeel ibn Tahfa al-Bajali; ia berada di Oman, jadi al-Hajjaj menulis kepadanya untuk berbaris ke Dibal. Ketika ia bertemu mereka, kudanya turun dari kuda, dan musuh mengepungnya serta membunuhnya. Beberapa berkata, 'Ia membunuhnya dengan senyum.'"
