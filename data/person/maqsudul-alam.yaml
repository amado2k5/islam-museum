summary:
  ar: "عالم أحياء بنغلاديشي، وُلد في ماداريبور سنة 1954 وتوفي في هونولولو سنة 2014. أستاذ في جامعة هاواي في مانوا، قاد مشاريع تسلسل جينومات البابايا والمطاط والجوت والفطر المهاجم للجوت، وهي أعمال جعلت بنغلاديش حاضرة في علم الجينومات، ونال بعد وفاته جائزة يوم الاستقلال سنة 2016."
  en: "Bangladeshi life scientist, born in Madaripur in 1954 and died in Honolulu in 2014. A professor at the University of Hawaiʻi at Mānoa, he led the genome-sequencing projects for papaya, rubber, jute and a jute-attacking fungus that put Bangladesh on the genomics map, and received the Independence Day Award posthumously in 2016."
  ur: "بنگلہ دیشی ماہر حیاتیات، جو 1954ء میں مداری پور میں پیدا ہوئے اور 2014ء میں ہونولولو میں وفات پائے۔ وہ یونیورسٹی آف ہوائی ایٹ مانوا میں پروفیسر تھے؛ انہوں نے پپیتے، ربڑ، جوٹ اور جوٹ پر حملہ کرنے والی فنگس کے جینوم سیکوئنسنگ منصوبوں کی قیادت کی، اور 2016ء میں بعد از مرگ یوم آزادی ایوارڈ ملا۔"
