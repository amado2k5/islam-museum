summary:
  ar: "حاكم طرابلس وجربة؛ ضايقه الثوار في الداخل فأقنع بيالي باشا سنة ٩٦٧هـ/١٥٦٠م بالتوجه إلى طرابلس لمساعدته في القضاء على التمرد قرب تاجوراء. وأمره السلطان سليمان بالمشاركة مع بيالي باشا وحسن بن خير الدين في حملة مالطة ٩٧٣هـ/١٥٦٥م {cite:dawlat-uthmaniyya-salabi p. 249-252}."
  en: "Governor of Tripoli and Djerba; pressed by rebels at home, he persuaded Piyale Pasha in 967/1560 to turn aside to Tripoli and crush the rising near Tajura. Süleyman ordered him to join Piyale and Hasan b. Khayr al-Din in the Malta campaign of 973/1565 {cite:dawlat-uthmaniyya-salabi p. 249-252}."
  es: "Gobernador de Trípoli y Djerba; presionado por los rebeldes en su tierra, persuadió a Piyale Pasha en 967/1560 para que se desviara hacia Trípoli y sofocara la sublevación cerca de Tajura. Süleyman le ordenó unirse a Piyale y Hasan b. Khayr al-Din en la campaña de Malta de 973/1565 {cite:dawlat-uthmaniyya-salabi p. 249-252}."
  fr: "Gouverneur de Tripoli et de Djerba, il persuada Piyale Pacha en 967/1560 de se tourner vers Tripoli et de réprimer le soulèvement près de Tajura, sous la pression des rebelles. Soliman lui ordonna ensuite de rejoindre Piyale et Hasan ben Khayr al-Din lors de la campagne de Malte en 973/1565 (voir: Dawlat-Uthmaniyya-Salabi, p. 249-252)."
