  ar: "إبراهيم بن عبد الوهاب بن أبي المعالي، عز الدين الزنجاني، فقيه شافعي صوفي، كان حيا سنة 655هـ. من تصانيفه «نقاوة العزيز في فروع الشافعية»، وهو مختصر من شرح الرافعي على الوجيز، و«العزى في التصريف». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9963}"
  en: "Ibrahim ibn Abd al-Wahhab ibn Abi al-Ma'ali, Izz al-Din al-Zanjani, a Shafi'i jurist and Sufi, alive in 655 AH according to the source. His works include 'The Essence of al-Aziz in the Branches of the Shafi'is', an abridgement of al-Rafi'i's commentary on al-Ghazali's Wajiz, and 'al-Izzi on Morphology'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9963}"
