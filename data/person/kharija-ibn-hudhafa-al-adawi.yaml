summary:
  ar: "خارجة بن حذافة العدوي؛ كان في جيش الزبير بن العوام المعزّز إلى مصر ووجّهه عمرو بن العاص بعد فتح الفسطاط إلى الفيوم والأشمونين وإخميم والبشرودات وقرى الصعيد فصالح أهلها على مثل حكم الفسطاط."
  en: "Kharija ibn Hudhafa al-Adawi; he rode in al-Zubayr ibn al-Awwam's reinforcement to Egypt, and after al-Fustat's fall Amr ibn al-As sent him to al-Fayyum, al-Ashmunayn, Ikhmim, al-Bashrudat and the Sa'id's villages, whose people compounded on Fustat's terms."
  es: "Kharija ibn Hudhafa al-Adawi; viajó con los refuerzos de al-Zubayr ibn al-Awwam a Egipto, y después de la caída de al-Fustat, Amr ibn al-As lo envió a al-Fayyum, al-Ashmunayn, Ikhmim, al-Bashrudat y las aldeas de los Sa'id, cuya gente se unió bajo las condiciones de Fustat."
  fr: "Kharija ibn Hudhafa al-Adawi; il chevaucha dans le renfort d'al-Zubayr ibn al-Awwam en Égypte, et après la chute d'al-Fustat, Amr ibn al-As l'envoya à al-Fayyum, al-Ashmunayn, Ikhmim, al-Bashrudat et dans les villages des Sa'id, dont les habitants s'allièrent selon les conditions de Fustat."
  ur: "خارجہ بن حذافہ العدوی؛ وہ زبیر بن العوام کی کمک میں سوار ہو کر مصر گیا، اور الفستات کے زوال کے بعد عمرو بن العاص نے اسے الفیوم، الشمونین، اخیم، البشرودات اور سعید کے دیہاتوں میں بھیجا، جن کے لوگ فوستات کی اصطلاحوں پر اکٹھے ہوئے تھے۔"
