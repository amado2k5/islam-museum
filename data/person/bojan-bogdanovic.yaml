summary:
  ar: "لاعب كرة سلة كرواتي سابق (وُلد سنة 1989) من موستار، لعب في NBA بين 2014 و2025 لفرق بروكلين وواشنطن وإنديانا ويوتا وديترويت ونيويورك، وقاد كرواتيا في أولمبياد ريو 2016 متصدراً هدافي البطولة، وأعلن اعتزاله في يونيو 2025 بعد إصابات متكررة في القدم."
  en: "Croatian former basketball player (born 1989) from Mostar, who played in the NBA from 2014 to 2025 for Brooklyn, Washington, Indiana, Utah, Detroit and New York, led all scorers at the 2016 Rio Olympics for Croatia, and announced his retirement in June 2025 after recurring foot injuries."
