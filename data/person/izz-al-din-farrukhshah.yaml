summary:
  ar: "عز الدين فرخشاه ابن أخي صلاح الدين؛ كان أكثر العمل في يوم مخاضة الأحزان سنة خمس وسبعين وخمسمائة، وحكى عن نفسه أنه ذكر في تلك الحال بيتي المتنبي «ولمن يرد الموت الزؤام تؤول» و«وللبيض في هام الكماة صليل» فهان الموت في عينه وألقى نفسه إليه وكان ذلك سبب الظفر {cite:kamil-ibn-al-athir p. 95-96}."
  en: "Saladin's nephew — the day's hero at the Ford of Sorrows in 575: he recited al-Mutanabbi's two verses on death, flung himself upon it, and in his telling that was the cause of the victory {cite:kamil-ibn-al-athir p. 95-96}."
