summary:
  ar: "تربوي أمريكي من أصل بنغالي، وُلد سنة 1976 في ميتايري بلويزيانا. بدأ سنة 2004 بتدريس ابنة عمه الرياضيات عبر الإنترنت، فنما ذلك إلى أكاديمية خان، المنصة التعليمية المجانية غير الربحية التي أنشأها ونشر عبرها آلاف الدروس المصوّرة، وأسس أيضًا مدرسة خان لاب سنة 2014. عمل قبل ذلك محللًا لصناديق التحوط، واختارته مجلة تايم سنة 2012 ضمن أكثر مئة شخصية تأثيرًا في العالم."
  en: "American educator of Bengali origin, born in 1976 in Metairie, Louisiana. He began in 2004 by tutoring his cousin in mathematics over the internet; that grew into Khan Academy, the free non-profit educational platform he founded, through which he has published thousands of video lessons, and he also founded Khan Lab School in 2014. He had worked as a hedge-fund analyst, and Time named him in its Time 100 in 2012."
  ur: "بنگالی نژاد امریکی معلم، 1976 میں لوئیزیانا کے میٹیری میں پیدا ہوئے۔ انھوں نے 2004 میں اپنی کزن کو انٹرنیٹ پر ریاضی پڑھانا شروع کیا؛ یہی کام خان اکیڈمی بنا، مفت غیر منافع بخش تعلیمی پلیٹ فارم جو انھوں نے قائم کیا اور جس پر ہزاروں ویڈیو اسباق شائع کیے، اور 2014 میں خان لیب اسکول بھی قائم کیا۔ اس سے قبل وہ ہیج فنڈ تجزیہ کار تھے، اور ٹائم نے 2012 میں انھیں سو بااثر ترین شخصیات میں شامل کیا۔"
