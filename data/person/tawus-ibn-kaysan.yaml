class: person
label: { ar: "طاوس بن كيسان", en: "Tawus ibn Kaysan", es: "Tawus ibn Kaysan", fr: "Tawus ibn Kaysan", ur: "طاؤس بن کیسان" }
summary:
  ar: "فقيه اليمن، كتب إلى عمر بن عبد العزيز حين استخلف إن أردت أن يكون عملك خيراً كله فاستعمل أهل الخير فقال عمر كفى بها موعظة {cite:muruj-al-dhahab p. 173}. وتوفي سنة أربع ومائة وقيل مات بمكة سنة ست ومائة وصلى عليه هشام بن عبد الملك {cite:muruj-al-dhahab p. 191}"
  en: "Yemen's jurist — his one-line counsel to the new caliph: 'if you want all your work to be good, employ the people of good' {cite:muruj-al-dhahab p. 173}."
  es: "El jurista de Yemen — su consejo de una sola línea al nuevo califa: 'si quieres que todo tu trabajo sea bueno, emplea a gente buena' {cite:muruj-al-dhahab p. 173}."
  fr: "Le juriste du Yémen — son conseil en une ligne au nouveau calife: « si vous voulez que tout votre travail soit bon, employez les gens de bien » {cite: muruj-al-dhahab p. 173}."
  ur: "یمن کے فقیہ - نئے خلیفہ کو ان کی ایک سطری نصیحت: 'اگر آپ چاہتے ہیں کہ آپ کے تمام کام اچھے ہوں تو اچھے لوگوں کو کام میں لاؤ'۔ 173}۔"
  tr: "Yemenli hukukçu, Ömer bin Abdülaziz'e vekil olarak atadığında şöyle yazdı: Tüm yaptıklarının iyi olmasını istiyorsan, iyilik adamlarını tut. Ömer dedi ki, 'Bu öğüt yeter.' {atıf:Muruj-al-Dhahab s. 173}. 104 Hicri yılında öldü ve 106 Hicri yılında Mekke'de öldüğü söylenir; Hisham ibn Abdül-Malik onun üzerine cenaze namazını yönetti. {alıntı:Muruj-al-Dhahab, s. 191}"
  id: "Ahli hukum Yaman menulis kepada Umar ibn Abd al-Aziz ketika ia mengangkatnya sebagai wakilnya: Jika kau ingin semua perbuatanmu baik, maka pekerjalah orang-orang yang baik. Umar berkata, 'Cukup dengan peringatan ini.' {cite:muruj-al-dhahab hlm. 173}. Ia meninggal pada tahun 104 H, dan dikatakan ia meninggal di Mekah pada tahun 106 H, dan Hisham ibn Abd al-Malik memimpin doa pemakaman untuknya. {cite:muruj-al-dhahab, hlm. 191}"
