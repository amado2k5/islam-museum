summary:
  ar: "زيب النساء (15 فبراير 1638 – 26 مايو 1702) أميرة مغولية، أكبر أبناء الإمبراطور أورنكزيب ودلرس بانو بيغوم، وشاعرة فارسية كتبت باسم «مخفي». حفظت القرآن في طفولتها وأتقنت الفارسية والعربية والأردية، ورعت العلماء والمترجمين وجمعت مكتبة كبيرة. سجنها أبوها في حصن سليم قره بدلهي في سنواتها العشرين الأخيرة، وجُمع شعرها بعد موتها في «ديوان مخفي»."
  en: "Zeb-un-Nissa (15 February 1638 – 26 May 1702) was a Mughal princess, the eldest child of Emperor Aurangzeb and Dilras Banu Begum, and a Persian poet who wrote under the pen name Makhfi. She memorised the Quran as a child, mastered Persian, Arabic and Urdu, patronised scholars and translators and built a great library. Her father imprisoned her at Salimgarh Fort, Delhi, for the last twenty years of her life, and her poems were collected after her death as the Diwan-i-Makhfi."
  ur: "زیب النساء (15 فروری 1638ء – 26 مئی 1702ء) مغل شہزادی تھیں، شہنشاہ اورنگزیب اور دلراس بانو بیگم کی سب سے بڑی اولاد، اور فارسی شاعرہ جو «مخفی» تخلص سے لکھتی تھیں۔ انھوں نے بچپن میں قرآن حفظ کیا، فارسی، عربی اور اردو پر عبور حاصل کیا، علما اور مترجمین کی سرپرستی کی اور ایک بڑی لائبریری بنائی۔ والد نے انھیں زندگی کے آخری بیس سال دہلی کے سلیم گڑھ قلعے میں قید رکھا، اور ان کا کلام وفات کے بعد «دیوانِ مخفی» میں جمع ہوا۔"

