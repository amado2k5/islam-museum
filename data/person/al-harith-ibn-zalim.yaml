id: person/al-harith-ibn-zalim
class: person
label: { ar: "الحارث بن ظالم المري", en: "al-Harith ibn Zalim al-Murri", es: "al-Harith ibn Zalim al-Murri", fr: "al-Harith ibn Zalim al-Murri", ur: "الحارث بن ظالم المری" }
summary:
  ar: "من بني مرة بن عوف، أشهر أهل الغدر في أيام العرب؛ ضمن لغطفان أن يفتك بخالد بن جعفر بدم زهير بن جذيمة فقدم على النعمان فحياه وواكله ثم دخل على خالد فقتله، فكان سبب يوم رحرحان حين خرج الأحوص بن جعفر ببني عامر يطلب حارثاً بدم أخيه {cite:ansab-al-ashraf p. 40}."
  en: "Harith ibn Zalim al-Murri, the byword for treachery in the ayyam; he broke bread with al-Nu'man then went in on Khalid ibn Ja'far and killed him — sparking the day of Rahrahan {cite:ansab-al-ashraf p. 40}."
  es: "Harith ibn Zalim al-Murri, sinónimo de traición en el ayyam; compartió el pan con al-Nu'man y luego atacó a Khalid ibn Ja'far y lo mató, desencadenando así el día de Rahrahan {cite:ansab-al-ashraf p. 40}."
  fr: "Harith ibn Zalim al-Murri, le nom de la trahison dans l'ayyam; il a partagé le pain avec al-Nu'man puis s'est attaqué à Khalid ibn Ja'far et l'a tué — déclenchant le jour de Rahrahan {cite:ansab-al-ashraf p. 40}."
  ur: "حارث بن ظالم المری، ایام میں خیانت کا لفظ اس نے النعمان کے ساتھ روٹی توڑی پھر خالد بن جعفر کے پاس گیا اور اسے قتل کر دیا - رہرہان کے دن کو جنم دیا۔ 40}۔"
  tr: "Arap döneminin en hain insanları olan Banu Murrah ibn Awf'tan; Latfan, Zuhayr ibn Judhimah'ın kanıyla Halid ibn Ca'far'ı öldüreceğine söz verdi. Nu'man'a gidip onu selamladı ve öldürdü. Sonra Halid'e girdi ve onu öldürdü. Bu, Rahran günü El-Ahvas ibn Ca'fer'in kardeşinin kanı için Banu Amir'e gitmesinin sebebiydi {atıf:ansab-al-ashraf, s. 40}."
  id: "Dari Banu Murrah ibn Awf, orang paling terkenal pengkhianat di era Arab; Latfan berjanji akan membunuh Khalid ibn Ja'far dengan darah Zuhayr ibn Judhimah. Ia pergi kepada Nu'man, menyambutnya, dan membunuhnya. Kemudian ia menyerang Khalid dan membunuhnya. Inilah alasan hari Rahran ketika Al-Ahwas ibn Ja'far pergi ke Banu Amir mencari darah saudaranya kepada Harith {cite:ansab-al-ashraf, hlm. 40}."
