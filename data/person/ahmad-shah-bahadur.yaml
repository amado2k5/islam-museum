summary:
  ar: "أحمد شاه بهادر (23 ديسمبر 1725 – 1 يناير 1775)، إمبراطور المغول الرابع عشر، ابن محمد شاه، حكم من 1748 إلى 1754. هزم وهو أميرٌ أحمد شاه الأبدالي عند مانوبور سنة 1748، ثم ترك شؤون الدولة للفصائل المتناحرة حتى خلعه الوزير عماد الملك وسمل عينيه، فقضى بقية عمره سجيناً في دلهي."
  en: "Ahmad Shah Bahadur (23 December 1725 – 1 January 1775) was the fourteenth Mughal emperor, a son of Muhammad Shah, reigning from 1748 to 1754. As a prince he defeated Ahmad Shah Abdali at Manupur in 1748, but as emperor he left the state to rival factions until the vizier Imad-ul-Mulk deposed and blinded him; he spent the rest of his life a prisoner at Delhi."
  ur: "احمد شاہ بہادر (23 دسمبر 1725ء – 1 جنوری 1775ء) چودھویں مغل بادشاہ، محمد شاہ کے فرزند، 1748ء سے 1754ء تک تخت نشین رہے۔ شہزادے کی حیثیت سے آپ نے 1748ء میں مانوپور کے مقام پر احمد شاہ ابدالی کو شکست دی، مگر بادشاہ بن کر حکومت کی باگ ڈور باہم متحارب گروہوں کے ہاتھ میں چھوڑ دی، یہاں تک کہ وزیر عماد الملک نے آپ کو معزول کر کے اندھا کر دیا؛ آپ نے بقیہ عمر دہلی میں قید میں گزاری۔"

