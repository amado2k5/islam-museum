names:
  - { value: "القاضي أبو بكر بن محمد بن عبد الله اليافعي", kind: full }
summary:
  ar: "القاضي أبو بكر بن محمد بن عبد الله اليافعي؛ حضر موته صاحب البيان وقال «ماتت المروءة»، أخذ الفقه عن زيد البقاعي وكان عالماً شاعراً وولي قضاء اليمن، وكان له جاه عظيم عند الملوك وخلَّص فقهاء اليمن من الخراج والمظالم، ولما قدم القاضي الرشيد من مصر إلى اليمن أكرمه كرامة عظيمة؛ ترجمته في أخبار سنة اثنتين وخمسين وخمسمائة {cite:shadharat-dhahab p. 641}."
  en: "Qadi Abu Bakr ibn Muhammad al-Yafa'i; the Sahib al-Bayan attended his death and said 'chivalry has died'; he took fiqh from Zayd al-Baqa'i, was a scholar and poet, held the qadi-ship of Yemen, enjoyed great standing with the kings, freed Yemen's jurists from kharaj and injustice, and honoured qadi al-Rashid on his arrival from Egypt; his notice falls in year 552 {cite:shadharat-dhahab p. 641}."
  fr: "Le cadi Abu Bakr ibn Muhammad al-Yafa'i ; l'auteur d'al-Bayan assista à sa mort et dit « la noblesse est morte » ; il prit le fiqh de Zayd al-Baqa'i, fut savant et poète, exerça la judicature du Yémen, jouit d'un grand crédit auprès des rois, libéra les juristes du Yémen du kharaj et de l'injustice, et honora le cadi al-Rashid à son arrivée d'Égypte ; sa notice se trouve à l'année 552 {cite:shadharat-dhahab p. 641}."
  es: "Qadi Abu Bakr ibn Muhammad al-Yafa'i; el Sahib al-Bayan asistió a su muerte y dijo: \"La caballerosidad ha muerto\"; recibió fiqh de Zayd al-Baqa'i, fue un erudito y poeta, ostentó el cadí de Yemen, gozó de gran prestigio entre los reyes, liberó a los juristas de Yemen de la opresión y la injusticia, y honró al cadí al-Rashid a su llegada de Egipto; su mención se remonta al año 552 {cita: shadharat-dhahab p. 641}."
  ur: "قادی ابوبکر بن محمد ال یافعی؛ صاحب البیان نے ان کی وفات پر حاضری دی اور کہا کہ 'شہادت مر گئی'۔ اس نے زید البقعی سے فقہ حاصل کیا، ایک عالم اور شاعر تھے، یمن کی قاضی شپ پر فائز تھے، بادشاہوں کے ساتھ بڑا مقام رکھتے تھے، یمن کے فقہاء کو خوارج اور ناانصافی سے نجات دلائی تھی، اور قادی الرشید کی مصر سے آمد پر ان کی عزت افزائی کی تھی۔ اس کا نوٹس 552 میں آتا ہے۔ 641}۔"
