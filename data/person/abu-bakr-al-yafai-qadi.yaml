summary:
  ar: "القاضي أبو بكر بن محمد بن عبد الله اليافعي؛ حضر موته صاحب البيان وقال «ماتت المروءة»، أخذ الفقه عن زيد البقاعي وكان عالماً شاعراً وولي قضاء اليمن، وكان له جاه عظيم عند الملوك وخلَّص فقهاء اليمن من الخراج والمظالم، ولما قدم القاضي الرشيد من مصر إلى اليمن أكرمه كرامة عظيمة؛ ترجمته في أخبار سنة اثنتين وخمسين وخمسمائة {cite:shadharat-dhahab p. 641}."
  en: "Qadi Abu Bakr ibn Muhammad al-Yafa'i; the Sahib al-Bayan attended his death and said 'chivalry has died'; he took fiqh from Zayd al-Baqa'i, was a scholar and poet, held the qadi-ship of Yemen, enjoyed great standing with the kings, freed Yemen's jurists from kharaj and injustice, and honoured qadi al-Rashid on his arrival from Egypt; his notice falls in year 552 {cite:shadharat-dhahab p. 641}."
