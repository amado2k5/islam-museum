summary:
  ar: "المتحدث باسم مجلس العلاقات الأمريكية الإسلامية (كير) ومدير اتصالاته الوطني منذ تأسيس المجلس سنة 1994. وُلد باسم دوغلاس هوبر، وهو حاصل على بكالوريوس في التاريخ وماجستير في الصحافة والاتصال الجماهيري، ويظهر باستمرار في وسائل الإعلام الوطنية والدولية متحدثًا باسم المجلس ومقدّمًا وجهة نظر إسلامية في القضايا الراهنة، وهو من أكثر وجوه المنظمات المسلمة الأمريكية حضورًا في الإعلام منذ ثلاثة عقود."
  en: "Spokesman of the Council on American-Islamic Relations (CAIR) and its National Communications Director since CAIR's founding in 1994. He was born Douglas Hooper, holds a bachelor's degree in history and a master's degree in journalism and mass communication, and appears frequently on national and international media as CAIR's spokesman offering an Islamic perspective on current events — for three decades one of the most visible media faces of an American Muslim organisation."
  ur: "کونسل آن امریکن اسلامک ریلیشنز (CAIR) کے ترجمان اور 1994 میں اس کے قیام سے اس کے نیشنل کمیونیکیشنز ڈائریکٹر۔ وہ ڈگلس ہوپر کے نام سے پیدا ہوئے، تاریخ میں بیچلر اور صحافت و ابلاغ عامہ میں ماسٹرز رکھتے ہیں، اور تین دہائیوں سے قومی و بین الاقوامی میڈیا میں CAIR کے ترجمان کے طور پر نمودار ہوتے ہیں۔"
