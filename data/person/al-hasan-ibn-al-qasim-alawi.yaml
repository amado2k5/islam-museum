roles: [missionary]
summary:
  ar: "داعٍ علوي من ولد الحسن بن علي، قتله أسفار في طبرستان {cite:muruj-mari-2005 juz' 4 p. 125}. وعند ابن الأثير استولى على الري وأخرج منها أصحاب السعيد نصر بن أحمد واستولى على قزوين وزنجان وأبهر وقم وكان معه ماكان بن كاكي الديلمي، فالتقى هو وأسفار بن شيرويه عند سارية فانهزم فلحق فقُتل سنة 316هـ، وكان يأمر أصحابه الديلم بالاستقامة ويمنعهم من ظلم الرعية وشرب الخمور فكانوا يبغضونه لذلك واتفقوا على استقدام هروسندان أحد رؤساء الجيل لتسليمه إليه ونصب أبي الحسين بن الأطروش والخطبة له فكشف مكيدتهم أحمد الطويل بالدامغان وكتب إلى الداعي يعلمه فأخذ حذره {cite:kamil-ibn-al-athir p. 139-140}"
  en: "An Alid missionary (da'i) descended from al-Hasan ibn Ali, killed in Tabaristan by Asfar {cite:muruj-mari-2005 juz' 4 p. 125}."
  es: "Un misionero alid (da'i) descendiente de al-Hasan ibn Ali, asesinado en Tabaristán por Asfar {cite:muruj-mari-2005 juz' 4 p. 125}."
  fr: "Un missionnaire alide (da'i) descendant d'al-Hasan ibn Ali, tué au Tabaristan par Asfar {cite:muruj-mari-2005 juz' 4 p. 125}."
  ur: "ایک الید مشنری ⁦(داعی)⁩ الحسن ابن علی کی نسل سے تھا، جسے طبرستان میں اسفار کے ذریعہ قتل کیا گیا تھا۔ 125}۔"
  tr: "Tabaristan'da Asfar'ın öldürdüğü el-Hasan bin Ali'nin soyundan gelen bir Alevi çağrısı {alıntı:Muric-Mari-2005 Juz' 4 s. 125}. İbn al-Athir ile birlikte Rayy'i ele geçirdi, el-Said Nasr bin Ahmad'ın yoldaşlarını oradan kovdu ve Kazvin, Zancan, Abhar ve Kum'un kontrolünü ele geçirdi. Yanında Makan ibn Kaki al-Daylami vardı. Sariyah'da Asfar ibn Shirwayh ile karşılaştı, yenildi ve 316 Hicri'de öldürüldü. Daylamlı yoldaşlarına kararlı kalmalarını ve tebaaları ezmelerini ve alkol içmelerini engellemelerini emretti, bu yüzden ondan nefret ettiler ve kabile liderlerinden Harusandan'ı getirmeyi, onu teslim etmesini, Abu al-Husayn ibn al-Atrush'u atama ve vaazı ona vermesini kabul ettiler. Damghan'daki Ahmed al-Tawil komplolarını ortaya çıkardı ve çağırana mektup yazdı, bu yüzden dikkatli davrandı {cite::Kamil-ibn-al-Athir s. 139-140}"
  id: "Seorang pemanggil Alawi dari keturunan al-Hasan ibn Ali, yang dibunuh Asfar di Tabaristan {cite:Muruj-Mari-2005 Juz' 4 hlm. 125}. Bersama Ibn al-Athir, ia menangkap Rayy dan mengusir para sahabat al-Sa'id Nasr ibn Ahmad dari sana, serta menguasai Qazvin, Zanjan, Abhar, dan Qom. Ia ditemani oleh Makan ibn Kaki al-Daylami. Ia bertemu Asfar ibn Shirwayh di Sariyah, dikalahkan, dan dibunuh pada tahun 316 H. Ia memerintahkan para sahabat Daylamite-nya untuk tetap teguh dan mencegah mereka menindas rakyat dan minum alkohol, sehingga mereka membencinya dan sepakat membawa Harusandan, salah satu pemimpin suku, untuk menyerahkannya, menunjuk Abu al-Husayn ibn al-Atrush dan menyampaikan khotbah kepadanya. Ahmad al-Tawil di Damghan mengungkap rencana mereka dan menulis kepada penelepon untuk memberitahukan kepadanya, sehingga ia berhati-hati {cite:Kamil-ibn-al-Athir hlm. 139-140}"
