summary:
  ar: "داعٍ علوي من ولد الحسن بن علي، قتله أسفار في طبرستان {cite:muruj-mari-2005 juz' 4 p. 125}. وعند ابن الأثير استولى على الري وأخرج منها أصحاب السعيد نصر بن أحمد واستولى على قزوين وزنجان وأبهر وقم وكان معه ماكان بن كاكي الديلمي، فالتقى هو وأسفار بن شيرويه عند سارية فانهزم فلحق فقُتل سنة 316هـ، وكان يأمر أصحابه الديلم بالاستقامة ويمنعهم من ظلم الرعية وشرب الخمور فكانوا يبغضونه لذلك واتفقوا على استقدام هروسندان أحد رؤساء الجيل لتسليمه إليه ونصب أبي الحسين بن الأطروش والخطبة له فكشف مكيدتهم أحمد الطويل بالدامغان وكتب إلى الداعي يعلمه فأخذ حذره {cite:kamil-ibn-al-athir p. 139-140}"
  en: "An Alid missionary (da'i) descended from al-Hasan ibn Ali, killed in Tabaristan by Asfar {cite:muruj-mari-2005 juz' 4 p. 125}."
