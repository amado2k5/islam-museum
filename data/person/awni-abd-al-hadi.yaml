summary:
  ar: "سياسي فلسطيني من نابلس (1889–1970)، من مؤسسي جمعية العربية الفتاة وحزب الاستقلال وأول رئيس له؛ أول رئيس للديوان الأميري في إمارة شرق الأردن، وأمين عام اللجنة العربية العليا، ثم وزير وسفير أردني في القاهرة، وهو زوج الناشطة النسوية طرب عبد الهادي."
  en: "Palestinian politician from Nablus (1889–1970), a founder of the al-Fatat society and of the Istiqlal Party, whose first president he was. He was the first chief of the Amiri Diwan in Transjordan, general secretary of the Arab Higher Committee, and later a Jordanian minister and ambassador to Cairo; he was the husband of the feminist activist Tarab Abdul Hadi."
  ur: "نابلس سے تعلق رکھنے والے فلسطینی سیاست دان (1889–1970)، الجمعیۃ العربیہ الفتاۃ اور استقلال پارٹی کے بانیوں میں سے، جن کے وہ پہلے صدر تھے؛ شرق اردن میں امیری دیوان کے پہلے رئیس، عرب اعلیٰ کمیٹی کے سیکرٹری جنرل، اور بعد میں اردنی وزیر اور قاہرہ میں سفیر رہے؛ وہ حقوق نسواں کی کارکن طرب عبد الہادی کے شوہر تھے۔"
