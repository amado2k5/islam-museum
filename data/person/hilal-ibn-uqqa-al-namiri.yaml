id: person/hilal-ibn-uqqa-al-namiri
class: person
label: { ar: "هلال بن عقة النمري" }
summary:
  ar: "عند البلاذري: هلال بن عقة بن قيس بن البشر النمري كان على النمر بن ساقط بعين التمر فجمع لخالد وقاتله فظفر به فقتله وصلبه وقال ابن الكلبي كان عليهم يومئذ عقة بن قيس بن البشر بنفسه."
  en: "In al-Baladhuri: Hilal ibn Uqqa ibn Qays ibn al-Bushr al-Namiri, over al-Namar ibn Saqit at Ayn al-Tamr; he gathered against Khalid and fought him, was overcome, killed and crucified — al-Kalbi: it was Uqqa ibn Qays himself over them that day."
  es: "En al-Baladhuri: Hilal ibn Uqqa ibn Qays ibn al-Bushr al-Namiri, sobre al-Namar ibn Saqit en Ayn al-Tamr; se reunió contra Khalid y luchó contra él, fue vencido, asesinado y crucificado. — al-Kalbi: fue el propio Uqqa ibn Qays quien estuvo sobre ellos ese día."
  fr: "Dans al-Baladhuri: Hilal ibn Uqqa ibn Qays ibn al-Bushr al-Namiri, sur al-Namar ibn Saqit à Ayn al-Tamr; il s'est rassemblé contre Khalid et l'a combattu, a été vaincu, tué et crucifié — al-Kalbi: c'était Uqqa ibn Qays lui-même sur eux ce jour-là."
  ur: "البلادوری میں ہے: ہلال بن اقا بن قیس بن البشر النمیری، النمر ابن ساقط پر عین التمر؛ وہ خالد کے خلاف جمع ہوا اور اس سے لڑا، مغلوب ہوا، مارا گیا اور سولی پر چڑھایا گیا - الکلبی: اس دن خود عقیق بن قیس ان پر تھا۔"
  tr: "el-Baladhuri'ye göre: Hilal bin 'Uqqa ibn Kays ibn al-Bishr al-Namri, Ayn al-Tamr'da el-Nimr ibn Kait'e karşıydı, Halid için toplandı, onunla savaştı, yakaladı, öldürdü ve çarmıha gerdi. İbn el-Kalbi şöyle dedi: O zamanlar, 'Uqah ibn Qays ibn al-Bishr bizzat onlara karşıydı."
  id: "Menurut al-Baladhuri: Hilal ibn 'Uqqa ibn Qays ibn al-Bishr al-Namri melawan al-Nimr ibn Qait di Ain al-Tamr, berkumpul untuk Khalid, melawannya, menangkapnya, membunuhnya, dan menyalibnya. Ibn al-Kalbi berkata: Pada waktu itu, 'Uqah ibn Qays ibn al-Bishr sendiri melawan mereka."
