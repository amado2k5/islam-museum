summary:
  ar: رجل أعمال إعلامي أفغاني أسترالي وُلد سنة 1966 في كابل؛ أسس مع أشقائه مجموعة موبي ⁦(Moby)⁩ سنة 2003، أكبر شركة إعلامية أفغانية بقنوات طلوع وطلوع نيوز وليمار وإذاعة أرمان، ووسّعها إقليميًا.
  en: Afghan-Australian media businessman born in Kabul in 1966; with his brothers he founded the Moby Group in 2003, Afghanistan's largest media company — TOLO, TOLOnews, Lemar TV and Arman FM — and expanded
    it regionally.
  ur: 'افغان آسٹریلوی میڈیا کاروباری جو 1966 میں کابل میں پیدا ہوا؛ اس نے بھائیوں کے ساتھ 2003 میں Moby Group قائم کیا — افغانستان کی سب سے بڑی میڈیا کمپنی: TOLO، TOLOnews، Lemar TV اور ارمان FM — اور علاقائی
    وسعت دی۔'
  es: "Empresario afgano-australiano del sector de los medios de comunicación, nacido en Kabul en 1966; junto con sus hermanos fundó el Grupo Moby en 2003, la mayor empresa de medios de comunicación de Afganistán —TOLO, TOLOnews, Lemar TV y Arman FM— y la expandió a nivel regional."
  fr: "Homme d'affaires afghano-australien du secteur des médias, né à Kaboul en 1966, il a fondé avec ses frères le groupe Moby en 2003, la plus grande entreprise médiatique d'Afghanistan — TOLO, TOLOnews, Lemar TV et Arman FM — qu'il a ensuite développée à l'échelle régionale."
  tr: "1966 yılında Kabil'de doğan Afgan-Avustralyalı bir medya iş insanı olan Scully, 2003 yılında kardeşleriyle birlikte Tolo News, Limar ve Arman Radio kanallarıyla en büyük Afgan medya şirketi Moby Group'u kurdu ve bölgesel olarak genişletti."
  id: "Seorang pengusaha media Afghanistan-Australia yang lahir pada tahun 1966 di Kabul; ia mendirikan Moby Group bersama saudara-saudaranya pada tahun 2003, perusahaan media terbesar Afghanistan dengan saluran Tolo News, Limar, dan Arman Radio, dan memperluasnya secara regional."
