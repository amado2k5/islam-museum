summary:
  ar: "وجهه المتوكل إلى المدينة لإشخاص علي بن محمد العلوي فضج أهلها وعجوا فأحلف لهم أنه لم يؤمر فيه بمكروه وفتش بيته فلم يجد إلا مصحفاً ودعاء، فأشخصه وتولى خدمته، ورأى عليه ممطراً فعقد ذنب دابته فجاءت سحابة فأمطرت فقال نشأت بالبادية فأعرف الرياح التي في عقبها المطر {cite:muruj-al-dhahab p. 550}."
  en: "The officer sent to fetch 'Ali al-Hadi from Medina — 'I found nothing but a mushaf and a prayer-book' {cite:muruj-al-dhahab p. 550}."
  es: "El oficial enviado a buscar a 'Ali al-Hadi desde Medina dijo: 'No encontré nada más que un mushaf y un libro de oraciones' {cite:muruj-al-dhahab p. 550}."
  fr: "L'officier envoyé chercher 'Ali al-Hadi à Médine — 'Je n'ai trouvé qu'un mushaf et un livre de prières' {cite:muruj-al-dhahab p. 550}."
  ur: "مدینہ سے علی الہادی کو لانے کے لیے افسر نے بھیجا - 'مجھے ایک مصحف اور دعائیہ کتاب کے سوا کچھ نہیں ملا'۔ 550}۔"
  tr: "Al-Mutawakkil onu Ali ibn Muhammed el-Alavi'nin halkına Medine'ye yönlendirdi, halk huzursuzluk içindeydi ve orada hiçbir yanlış yapmaması için emir verilmediğine yemin ettirdi. Evini aradı ama sadece bir Kur'an ve bir namaz buldu. Onu atadı ve hizmetini devraldı. Yağmur yağdığını görünce bineğinin kuyruğunu bağladı ve bir bulut geldi, yağmur yağdı. Dedi ki, 'Çölden doğdum, bu yüzden yağmurun geldiği rüzgarları biliyorum.' {atı:Muruj-al-Dhahab, s. 550}."
  id: "Al-Mutawakkil mengarahkannya ke Madinah kepada umat Ali ibn Muhammad al-Alawi, dan orang-orang itu dalam keadaan gelisah dan membuatnya bersumpah bahwa dia tidak diperintahkan melakukan kesalahan di sana. Dia menggeledah rumahnya tetapi tidak menemukan apa-apa selain sebuah Al-Qur'an dan sebuah doa. Dia menunjuknya dan mengambil alih pelayanannya. Dia melihat hujan, lalu dia mengikat ekor tunggangannya dan sebuah awan datang dan hujan turun. Dia berkata, 'Aku berasal dari padang pasir, jadi aku tahu angin di mana hujan datang.' {cite:muruj-al-dhahab, hlm. 550}."
