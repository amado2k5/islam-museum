summary:
  ar: "محمد المنصف المرزوقي (وُلد سنة 1945)، طبيب وناشط حقوقي وسياسي تونسي، ترأس الرابطة التونسية للدفاع عن حقوق الإنسان، وأسس حزب المؤتمر من أجل الجمهورية، وانتخبه المجلس التأسيسي رئيسا مؤقتا لتونس في ديسمبر 2011، فشهدت رئاسته صدور دستور 2014، وغادر المنصب في نهاية 2014 بعد خسارته الانتخابات أمام الباجي قائد السبسي."
  en: "Mohamed Moncef Marzouki (born 1945) is a Tunisian physician, human-rights activist and politician who headed the Tunisian Human Rights League and founded the Congress for the Republic. The Constituent Assembly elected him interim president of Tunisia in December 2011; the 2014 constitution was promulgated under his presidency, and he left office at the end of 2014 after losing the presidential election to Beji Caid Essebsi."
  ur: "محمد منصف مرزوقی (پیدائش 1945ء) تیونس کے طبیب، انسانی حقوق کے کارکن اور سیاست دان ہیں۔ وہ تیونسی لیگ برائے انسانی حقوق کے صدر رہے اور کانگریس فار دی ریپبلک کی بنیاد رکھی۔ آئین ساز اسمبلی نے دسمبر 2011ء میں انہیں تیونس کا عبوری صدر منتخب کیا؛ ان کے دور میں 2014ء کا آئین جاری ہوا، اور 2014ء کے آخر میں وہ انتخاب ہار کر عہدے سے رخصت ہوئے۔"
