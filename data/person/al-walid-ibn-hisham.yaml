label: { ar: "الوليد بن هشام بن المغيرة", en: "al-Walid ibn Hisham ibn al-Mughira", fr: "al-Walid ibn Hisham ibn al-Mughira", es: "al-Walid ibn Hisham ibn al-Mughira", ur: "الولید بن ہشام بن مغیرہ" }
summary:
  ar: "الوليد بن هشام بن المغيرة؛ أشار على عمر حين استشار في الديوان فقال قد جئت الشام فرأيت ملوكها قد دونوا ديواناً وجندوا جنداً فدون ديواناً وجند جنداً فأخذ بقوله."
  en: "al-Walid ibn Hisham ibn al-Mughira; his advice Umar took for the diwan — 'Syria's kings have a diwan and an army: write a diwan, raise an army'."
  fr: "al-Walid ibn Hisham ibn al-Mughira  ; son conseil Umar pris pour le diwan – « les rois de la Syrie ont un diwan et une armée  : écrivez un diwan, élevez une armée  »."
  es: "al-Walid ibn Hisham ibn al-Mughira; su consejo para el diwan fue: \"Los reyes de Siria tienen un diwan y un ejército: escribe un diwan, reúne un ejército\"."
  ur: "الولید بن ہشام ابن المغیرہ؛ اس کا مشورہ عمر نے دیوان کے لیے لیا - 'شام کے بادشاہوں کا ایک دیوان اور ایک فوج ہے: دیوان لکھیں، فوج بنائیں'۔"
  tr: "El-Velid bin Hişam ibn el-Muhira; Diwan'da kendisiyle danıştığında Ömer'i işaret ederek şöyle dedi: Levant'a geldim ve krallarının bir Diwan kurup asker topladığını gördüm, bu yüzden bir Diwan ve Engnad Jad yazdı, böylece sözlerine inandı."
  id: "Al-Walid ibn Hisham ibn al-Mughira; ia menunjuk kepada Umar ketika berkonsultasi dengannya dalam Diwan, berkata: Aku datang ke Levant dan melihat raja-rajanya menyusun Diwan dan merekrut tentara, jadi ia menulis Diwan dan Engnad Jad, maka ia mengambil kata-katanya."
