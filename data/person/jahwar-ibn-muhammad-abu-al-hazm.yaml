id: person/jahwar-ibn-muhammad-abu-al-hazm
class: person
label: { ar: "جهور بن محمد بن جهور أبو الحزم" }
gender: male
died: { edtf: "1043~", hijri: "0435-01", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في المحرم سنة خمس وثلاثين وأربعمائة عن إحدى وسبعين سنة وولي بعده ابنه أبو الوليد {cite:shadharat-dhahab p. 255}." }
summary:
  ar: "وزير قرطبة وصاحب دولة بني جهور؛ وزر في الدولة العامرية فشرفت بجلاله، فلما انقرضت وعاقت الفتن واعترضت تحيز عن التدبير مدتها وجعل يقبل مع الوزراء ويدبر غير مظهر للانفراد إلى أن انجلى به نور جلالة قرطبة واستبد بها من غير أن يتعدى اسم الوزارة، وكان له أدب ووقار وحلم سارت بها الأمثال، وتوفي سنة خمس وثلاثين وأربعمائة فانتقل الأمر إلى ابنه أبي الوليد {cite:nafh-tib-maqqari p. 338-339}. توفي سنة خمس وثلاثين وأربع مئة في المحرم عن إحدى وسبعين سنة؛ ساس قرطبة أحسن سياسة وكان من رجال الدهر حزماً وعزماً ودهاءً ورأياً ولم يتسم بالملك وقال أنا أدبر الناس إلى أن يقوم لهم من يصلح فجعل ارتفاع الأموال بأيدي الأكابر وديعة وصير العوام جنداً وأعطاهم أموالاً مضاربة وقرر عليهم السلاح والعدة وكان يشهد الجنائز ويعود المرضى وهو بزي الصالحين لم يتحول من داره إلى دار السلطنة {cite:shadharat-dhahab p. 263}."
  en: "The Jahwarid vizier who had served under the Amirids and then held Cordoba without exceeding the title of wazir, ruling until his death in 435 when power passed to his son Abu'l-Walid; famed for letters, gravity and patience {cite:nafh-tib-maqqari p. 338-339}."
  es: "El visir Jahwarid que había servido bajo los Amiridas y luego gobernó Córdoba sin exceder el título de visir, gobernando hasta su muerte en 435 cuando el poder pasó a su hijo Abu'l-Walid; famoso por sus letras, gravedad y paciencia {cite:nafh-tib-maqqari p. 338-339}."
  fr: "Le vizir jahwaride qui avait servi sous les Amirides puis détenu Cordoue sans dépasser le titre de vizir, régnant jusqu'à sa mort en 435, date à laquelle le pouvoir passa à son fils Abu'l-Walid; célèbre pour ses lettres, sa gravité et sa patience {cite:nafh-tib-maqqari p. 338-339}."
  ur: "جوہرید وزیر جس نے امیروں کے ماتحت خدمات انجام دیں اور پھر قرطبہ پر وزیر کے لقب سے تجاوز کیے بغیر 435 میں اس کی موت تک حکومت کی جب اقتدار اس کے بیٹے ابو الولید کو منتقل ہوا۔ حروف، کشش ثقل اور صبر کے لیے مشہور 338-339}۔"
  tr: "Cordoba bakanı ve Banu Jahur devletinin yöneticisi; Amirid devletinde bakan ve majesteleri tarafından onurlandırıldı. Devlet sona erdiğinde, isyanlar bastırıldığında ve uzun süre işleri yönetmeye karşı çıktığında, bakanları kabul etmeye ve işleri hiçbir dışlama göstermeden yönetmeye başladı; ta ki Cordoba Majestelerinin ışığı ortaya çıkana kadar ve bakanlık unvanını bile aşmadan hüküm sürdü. Adabe, onur ve atasözü haline gelen bir hayali vardı. 435 Hicri yılında öldü, ardından mesele oğlu Abu al-Walid'e geçti {atıf:nafh-tib-maqqari s. 338-339}. Dört yüz otuz beş yaşında Muharrem'de yetmiş bir yaşında öldü. Cordoba'yı en iyi siyasetle kurdu ve döneminin kararlılık, kararlılık, kurnazlık ve muhakeme adamlarından biriydi. Krallıkla tanımlanmadı ve 'İnsanları doğru biri onlar için yükselene kadar yönlendireceğim' dedi. Seçkinlerin elindeki servetin yükselişini bir güven haline getirdi, sıradan halkı asker yaptı, onlara spekülatif para verdi ve onlar için silah ve teçhizat verdi. Cenazelere katıldı ve hastalara doğru kıyaslı kıyafetlerle döndü. Evinden sultanlığın ikametgahına dönüşmedi {cite:shadharat-dhahab, s. 263}."
  id: "Menteri Cordoba dan penguasa negara Banu Jahur; seorang menteri di negara Amird, dihormati oleh Yang Mulia. Ketika negara itu punah, dan pemberontakan ditumpaskan, dan ia lama menolak mengatur urusan, ia mulai menerima menteri dan mengelola urusan tanpa menunjukkan pengecualian sampai cahaya Yang Mulia Cordoba terungkap dan ia menguasainya tanpa bahkan melebihi gelar menteri. Ia memiliki tata krama, martabat, dan mimpi yang menjadi pepatah. Ia meninggal pada tahun 435 H, setelah itu urusan itu diserahkan kepada putranya Abu al-Walid {cite:nafh-tib-maqqari hlm. 338-339}. Ia meninggal pada tahun empat ratus tiga puluh lima di Muharram pada usia tujuh puluh satu tahun. Ia mendirikan Cordoba dengan politik terbaik dan termasuk di antara orang-orang pada zamannya yang teguh, bertekad, licik, dan bijaksana. Ia tidak dikenal sebagai raja dan berkata, 'Aku akan membimbing orang sampai seseorang yang benar bangkit untuk mereka.' Ia menjadikan kekayaan di tangan elit sebagai kepercayaan, menjadikan rakyat biasa sebagai tentara, memberi mereka uang spekulatif, dan menunjuk senjata serta perlengkapan untuk mereka. Ia menghadiri pemakaman dan kembali ke orang sakit dengan mengenakan pakaian orang benar. Ia tidak berubah dari rumahnya ke kediaman kesultanan {cite:shadharat-dhahab, hlm. 263}."
