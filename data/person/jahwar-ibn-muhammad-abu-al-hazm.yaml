summary:
  ar: "وزير قرطبة وصاحب دولة بني جهور؛ وزر في الدولة العامرية فشرفت بجلاله، فلما انقرضت وعاقت الفتن واعترضت تحيز عن التدبير مدتها وجعل يقبل مع الوزراء ويدبر غير مظهر للانفراد إلى أن انجلى به نور جلالة قرطبة واستبد بها من غير أن يتعدى اسم الوزارة، وكان له أدب ووقار وحلم سارت بها الأمثال، وتوفي سنة خمس وثلاثين وأربعمائة فانتقل الأمر إلى ابنه أبي الوليد {cite:nafh-tib-maqqari p. 338-339}."
  en: "The Jahwarid vizier who had served under the Amirids and then held Cordoba without exceeding the title of wazir, ruling until his death in 435 when power passed to his son Abu'l-Walid; famed for letters, gravity and patience {cite:nafh-tib-maqqari p. 338-339}."
