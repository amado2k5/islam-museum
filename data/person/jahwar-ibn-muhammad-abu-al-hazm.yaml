summary:
  ar: "وزير قرطبة وصاحب دولة بني جهور؛ وزر في الدولة العامرية فشرفت بجلاله، فلما انقرضت وعاقت الفتن واعترضت تحيز عن التدبير مدتها وجعل يقبل مع الوزراء ويدبر غير مظهر للانفراد إلى أن انجلى به نور جلالة قرطبة واستبد بها من غير أن يتعدى اسم الوزارة، وكان له أدب ووقار وحلم سارت بها الأمثال، وتوفي سنة خمس وثلاثين وأربعمائة فانتقل الأمر إلى ابنه أبي الوليد {cite:nafh-tib-maqqari p. 338-339}. توفي سنة خمس وثلاثين وأربع مئة في المحرم عن إحدى وسبعين سنة؛ ساس قرطبة أحسن سياسة وكان من رجال الدهر حزماً وعزماً ودهاءً ورأياً ولم يتسم بالملك وقال أنا أدبر الناس إلى أن يقوم لهم من يصلح فجعل ارتفاع الأموال بأيدي الأكابر وديعة وصير العوام جنداً وأعطاهم أموالاً مضاربة وقرر عليهم السلاح والعدة وكان يشهد الجنائز ويعود المرضى وهو بزي الصالحين لم يتحول من داره إلى دار السلطنة {cite:shadharat-dhahab p. 263}."
  en: "The Jahwarid vizier who had served under the Amirids and then held Cordoba without exceeding the title of wazir, ruling until his death in 435 when power passed to his son Abu'l-Walid; famed for letters, gravity and patience {cite:nafh-tib-maqqari p. 338-339}."
