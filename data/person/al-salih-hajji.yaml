summary:
  ar: "بطاقة أولية للسلطان المملوكي الصالح صلاح الدين حاجي، نجل شعبان بن حسين الذي بويع طفلاً سنة ١٣٨٢م مرتين ثم زال، توفي سنة ١٤١٢م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for the Mamluk sultan al-Salih Salah al-Din Hajji, son of Sha'ban, enthroned as a child in 1382 and again before his deposition, d. 1412; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de nombramiento del sultán mameluco al-Salih Salah al-Din Hajji, hijo de Sha'ban, entronizado de niño en 1382 y de nuevo antes de su deposición, fallecido en 1412; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature du sultan mamelouk al-Salih Salah al-Din Hajji, fils de Sha'ban, intronisé enfant en 1382 et de nouveau avant sa déposition, mort en 1412; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "مملوک سلطان الصالح صلاح الدین حججی، شعبان کا بیٹا، 1382 میں بچپن میں تخت نشین ہوا اور اس کی معزولی سے پہلے، ڈی۔ 1412; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Memlük Sultanı Salih al-Din Haji'nin, Şaban bin Hüseyin'in oğlu olan ön kart; 1382 yılında çocukken iki kez bağlılık yemini etmiş ve ardından vefat etmiştir. 1412 yılında ölmüştür; İslam devletleri sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Sultan Mamluk Salih al-Din Haji, putra Sha'ban ibn Hussein, yang telah bersumpah setia sejak kecil pada tahun 1382 M dua kali dan kemudian meninggal dunia. Ia meninggal pada tahun 1412 M; ia disebutkan dalam kamus negara-negara Islam dan biografinya belum pernah ditinjau di halaman tersebut."
