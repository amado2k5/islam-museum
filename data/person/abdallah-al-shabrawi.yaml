summary:
  ar: "عبد الله بن محمد بن عامر الشبراوي، فقيه مصري ناظم تولى مشيخة الأزهر، من كتبه شرح الصدر في غزوة بدر ومنائح الألطاف في مدائح الأشراف؛ وُلد سنة 1091 هـ ووفاته سنة 1171 هـ."
  en: "Abdallah ibn Muhammad ibn Amir al-Shabrawi, an Egyptian jurist and verse-writer who headed al-Azhar, author of Sharh al-Sadr fi Ghazwat Badr and Manaih al-Altaf fi Madaih al-Ashraf; 1091 to 1171 AH (1680 to 1758)."
  fr: "Abdallah ibn Muhammad ibn Amir al-Shabrawi, juriste et versificateur égyptien qui dirigea al-Azhar, auteur de Sharh al-Sadr fi Ghazwat Badr et de Manaih al-Altaf fi Madaih al-Ashraf ; 1091 à 1171 H (1680 à 1758)."
  es: "Abdallah ibn Muhammad ibn Amir al-Shabrawi, jurista y verso egipcio que dirigió al-Azhar, autor de Sharh al-Sadr fi Ghazwat Badr y Manaih al-Altaf fi Madaih al-Ashraf; 1091 a 1171 d. H. (1680 a 1758)."
  ur: "عبداللہ بن محمد بن عامر الشبروی، مصری فقیہ اور آیت لکھنے والے جو الازہر کے سربراہ تھے، شرح الصدر فی غزوات بدر اور مناہ الطاف فی مدائح الاشرف کے مصنف؛ 1091 تا 1171 ہجری ⁦(1680 تا 1758)⁩۔"
  tr: "Abdullah bin Muhammed bin Amer el-Şebrevi, Mısırlı bir hukukçu ve şair olup El-Ezher Şeyhi görevini üstlenmiştir. Eserleri arasında Şerh el-Sadr fi Gazvet Bedir ve Mana’ih el-Altaf fi Mada’ih el-Eşref bulunmaktadır. 1091 Hicri yılında doğmuş ve 1171 Hicri yılında vefat etmiştir."
  id: "Abdullah bin Muhammad bin Amer Al-Shabrawi, seorang ahli hukum dan penyair Mesir yang menjabat sebagai Syekh Al-Azhar. Di antara buku-bukunya adalah Sharh Al-Sadr fi Ghazwat Badr dan Mana’ih Al-Altaf fi Mada’ih Al-Ashraf. Beliau lahir pada tahun 1091 H dan wafat pada tahun 1171 H."
