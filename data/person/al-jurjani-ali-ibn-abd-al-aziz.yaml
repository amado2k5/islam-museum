  ar: "ولد بجرجان ونشأ فيها، وتلقى علوم عصره فيها، وصنّف في النقد الأدبي كتاب «الوساطة بين المتنبي وخصومه». وذكره الشيرازي قاضياً فقيهاً أديباً شاعراً وله ديوان، ولم يذكر سنة وفاته {cite:tabaqat-fuqaha-abbas-1981 p. 64}. الاسم وحده يطابق هذه الترجمة، والهوية تحتاج تأكيداً."
  en: "Born and raised in Jurjan, where he studied the learning of his time. He wrote on literary criticism, including al-Wasata between al-Mutanabbi and his opponents."
