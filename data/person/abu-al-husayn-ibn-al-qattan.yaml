summary:
  ar: "أبو الحسين أحمد بن محمد المعروف بابن القطان البغدادي، وهو آخر من عرفه الشيرازي من أصحاب أبي العباس ابن سريج. درّس ببغداد وأخذ عنه العلماء، ومات سنة تسع وخمسين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  en: "Abu al-Husayn Ahmad ibn Muhammad, known as Ibn al-Qattan al-Baghdadi, was the last of Abu al-Abbas Ibn Surayj's companions whom al-Shirazi knew. He taught at Baghdad, scholars took from him, and he died in 359 {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  fr: "Abu al-Husayn Ahmad ibn Muhammad, connu sous le nom d'Ibn al-Qattan al-Baghdadi, fut le dernier des compagnons d'Abu al-Abbas Ibn Surayj qu'al-Shirazi connut. Il enseigna à Bagdad, des savants reçurent de lui, et il mourut en 359 {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  es: "Abu al-Husayn Ahmad ibn Muhammad, conocido como Ibn al-Qattan al-Baghdadi, fue el último de los compañeros de Abu al-Abbas Ibn Surayj que conoció al-Shirazi. Enseñó en Bagdad, los eruditos aprendieron de él y murió en el año 359 {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  ur: "ابو الحسین احمد بن محمد، جسے ابن القطان البغدادی کے نام سے جانا جاتا ہے، ابو العباس ابن سریج کے آخری اصحاب میں سے تھے جنہیں الشیرازی جانتے تھے۔ آپ نے بغداد میں پڑھایا، علماء نے آپ سے علم لیا، اور آپ کا انتقال 359 میں ہوا۔ 59}۔"
