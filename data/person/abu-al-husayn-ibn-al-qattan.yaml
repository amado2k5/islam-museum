  ar: "أبو الحسين أحمد بن محمد المعروف بابن القطان البغدادي، وهو آخر من عرفه الشيرازي من أصحاب أبي العباس ابن سريج. درّس ببغداد وأخذ عنه العلماء، ومات سنة تسع وخمسين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  en: "Abu al-Husayn Ahmad ibn Muhammad, known as Ibn al-Qattan al-Baghdadi, was the last of Abu al-Abbas Ibn Surayj's companions whom al-Shirazi knew. He taught at Baghdad, scholars took from him, and he died in 359 {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
