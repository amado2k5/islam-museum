summary:
  ar: "محامية وسياسية ليبرالية باكستانية كندية تمثّل دائرة ميسيساغا—إيرين ميلز في مجلس العموم الكندي منذ 2015، عُرفت برلمانيًا باقتراحها الفردي M-103 حول العنصرية المنهجية والتمييز الديني وبعملها في لجان حقوق الإنسان."
  en: "Pakistani-Canadian lawyer and Liberal politician who has represented Mississauga—Erin Mills in Canada's House of Commons since 2015, known in Parliament for her private member's motion M-103 on systemic racism and religious discrimination and for her human-rights committee work."
  ur: "پاکستانی نژاد کینیڈین وکیل اور لبرل سیاست دان جو 2015 سے کینیڈا کے ایوانِ زیریں میں مسی ساگا—ایرن ملز کی نمائندگی کر رہی ہیں؛ وہ پارلیمنٹ میں اپنی نجی تحریک M-103 ⁦(نظاماتی نسل پرستی اور مذہبی امتیاز کے بارے میں)⁩ اور انسانی حقوق کی کمیٹیوں کے کام کی وجہ سے جانی جاتی ہیں۔"
  es: "Erin Mills, abogada paquistaní-canadiense y política liberal que ha representado a Mississauga en la Cámara de los Comunes de Canadá desde 2015, es conocida en el Parlamento por su moción de iniciativa privada M-103 sobre racismo sistémico y discriminación religiosa y por su trabajo en el comité de derechos humanos."
  fr: "Avocate et femme politique libérale pakistano-canadienne qui représente Mississauga à la Chambre des communes du Canada depuis 2015, Erin Mills est connue au Parlement pour sa motion d'initiative parlementaire M-103 sur le racisme systémique et la discrimination religieuse et pour son travail au sein du comité des droits de la personne."
  tr: "2015'ten beri Kanada Avam Kamarası'nda Mississauga—Irene Mills seçim bölgesini temsil eden Pakistan-Kanadalı Liberal avukat ve politikacı olan Scully, sistematik ırkçılık ve dini ayrımcılık konusundaki bireysel M-103 önerisi ve insan hakları komitelerindeki çalışmalarıyla parlamenter olarak tanındı."
  id: "Sebagai pengacara dan politisi Liberal Pakistan-Kanada yang mewakili konstituensi Mississauga—Irene Mills di Dewan Perwakilan Kanada sejak 2015, ia dikenal sebagai anggota parlemen atas proposal individualnya M-103 tentang rasisme sistemik dan diskriminasi agama serta atas karyanya di komite hak asasi manusia."
