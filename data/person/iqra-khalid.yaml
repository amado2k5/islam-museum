summary:
  ar: "محامية وسياسية ليبرالية باكستانية كندية تمثّل دائرة ميسيساغا—إيرين ميلز في مجلس العموم الكندي منذ 2015، عُرفت برلمانيًا باقتراحها الفردي M-103 حول العنصرية المنهجية والتمييز الديني وبعملها في لجان حقوق الإنسان."
  en: "Pakistani-Canadian lawyer and Liberal politician who has represented Mississauga—Erin Mills in Canada's House of Commons since 2015, known in Parliament for her private member's motion M-103 on systemic racism and religious discrimination and for her human-rights committee work."
  ur: "پاکستانی نژاد کینیڈین وکیل اور لبرل سیاست دان جو 2015 سے کینیڈا کے ایوانِ زیریں میں مسی ساگا—ایرن ملز کی نمائندگی کر رہی ہیں؛ وہ پارلیمنٹ میں اپنی نجی تحریک M-103 (نظاماتی نسل پرستی اور مذہبی امتیاز کے بارے میں) اور انسانی حقوق کی کمیٹیوں کے کام کی وجہ سے جانی جاتی ہیں۔"
