summary:
  ar: "طبيب وداعية إندونيسي ومستشار وممارس للطب النبوي، وُلد في 30 نوفمبر 1977 في جمبي. تخرّج في كلية الطب بجامعة ديبونيغورو سنة 2003، وابتكر منهج صحة الرسول المعروف اختصارًا باسم JSR، وشارك في تأسيس جمعية الحجامة الإندونيسية وترأّسها ثلاث دورات، وألّف كتابًا بالعنوان نفسه. بلغ حسابه في إنستغرام 4,300,000 متابع بحسب تصنيف أوربتفايب المحدّث في 15 نوفمبر 2026."
  en: "Indonesian physician, Islamic preacher, consultant and practitioner of prophetic medicine, born on 30 November 1977 in Jambi. He graduated from the Faculty of Medicine of Universitas Diponegoro in 2003, founded the Jurus Sehat Rasulullah method (JSR), co-founded the Indonesian Cupping Association and chaired it for three terms, and wrote a book of the same name. His Instagram account counted 4,300,000 followers by Orbitvibe's ranking, last updated 15 November 2026."
  ur: "انڈونیشیا کے طبیب، اسلامی مبلغ، مشیر اور طبِ نبوی کے ماہر، جو 30 نومبر 1977ء کو جامبی میں پیدا ہوئے۔ انہوں نے 2003ء میں یونیورسٹی دِپونیگورو کے شعبۂ طب سے گریجویشن کیا، ”جوروس صحت رسول اللہ“ کا طریقہ وضع کیا، انڈونیشیائی حجامہ ایسوسی ایشن کی بنیاد میں شریک رہے اور تین ادوار اس کے صدر رہے، اور اسی نام کی کتاب لکھی۔ اوربٹ وائب کی درجہ بندی کے مطابق، جس کی آخری تجدید 15 نومبر 2026ء کو ہوئی، ان کے انسٹاگرام فالوور 4,300,000 تھے۔"
  es: "Médico indonesio, predicador islámico, consultor y practicante de medicina profética, nacido el 30 de noviembre de 1977 en Jambi. Se graduó de la Facultad de Medicina de la Universidad Diponegoro en 2003, fundó el método Jurus Sehat Rasulullah (JSR), cofundó la Asociación Indonesia de Ventosaterapia y la presidió durante tres mandatos, y escribió un libro del mismo nombre. Su cuenta de Instagram contaba con 4.300.000 seguidores según el ranking de Orbitvibe, actualizado por última vez el 15 de noviembre de 2026."
  fr: "Médecin, prédicateur islamique, consultant et praticien de médecine prophétique indonésien, né le 30 novembre 1977 à Jambi. Diplômé de la faculté de médecine de l'Université Diponegoro en 2003, il a fondé la méthode Jurus Sehat Rasulullah (JSR), cofondé l'Association indonésienne de ventouses et l'a présidée pendant trois mandats, et est l'auteur d'un ouvrage éponyme. Son compte Instagram comptait 4,3 millions d'abonnés selon le classement d'Orbitvibe (dernière mise à jour: 15 novembre 2026)."
