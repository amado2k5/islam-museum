summary:
  ar: "صحابي ثقفي طائفي كان عاملاً لعمر بن الخطاب على الطائف، يروي عنه حديث «قل آمنت بالله ثم استقم» وهو الحديث الحادي والعشرون من الأربعين النووية، أخرجه مسلم في صحيحه من رواية هشام بن عروة عن أبيه عنه، وفي رواية الزهري عن محمد بن عبد الرحمن بن ماعز عنه زيادة سؤاله «ما أخوف ما تخاف علي؟» فأخذ النبي بلسان نفسه وقال «هذا»، وروى عنه ابنه عبد الله بن سفيان عند أحمد والنسائي."
  en: "A Thaqafi Companion of al-Ta'if who served as Umar ibn al-Khattab's governor over the city; he transmits 'say: I believe in God, then stand firm', the twenty-first hadith of al-Nawawi's Forty, included by Muslim in his Sahih through Hisham ibn Urwa from his father from him, the al-Zuhri route from Muhammad ibn Abd al-Rahman ibn Ma'iz adding his question 'what do you most fear for me?' answered by the Prophet taking hold of his own tongue and saying 'this'; his son Abdullah ibn Sufyan also narrates from him in Ahmad and al-Nasa'i."
