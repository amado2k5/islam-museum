summary:
  ar: "صحابي ثقفي طائفي كان عاملاً لعمر بن الخطاب على الطائف، يروي عنه حديث «قل آمنت بالله ثم استقم» وهو الحديث الحادي والعشرون من الأربعين النووية، أخرجه مسلم في صحيحه من رواية هشام بن عروة عن أبيه عنه، وفي رواية الزهري عن محمد بن عبد الرحمن بن ماعز عنه زيادة سؤاله «ما أخوف ما تخاف علي؟» فأخذ النبي بلسان نفسه وقال «هذا»، وروى عنه ابنه عبد الله بن سفيان عند أحمد والنسائي."
  en: "A Thaqafi Companion of al-Ta'if who served as Umar ibn al-Khattab's governor over the city; he transmits 'say: I believe in God, then stand firm', the twenty-first hadith of al-Nawawi's Forty, included by Muslim in his Sahih through Hisham ibn Urwa from his father from him, the al-Zuhri route from Muhammad ibn Abd al-Rahman ibn Ma'iz adding his question 'what do you most fear for me?' answered by the Prophet taking hold of his own tongue and saying 'this'; his son Abdullah ibn Sufyan also narrates from him in Ahmad and al-Nasa'i."
  ur: "طائف کا ثقفی صحابی جو عمر بن خطاب کا شہر پر عامل رہا؛ اس سے «کہو: میں اللہ پر ایمان لایا، پھر ثابت قدم رہو» کی حدیث منقول ہے۔"
  es: "Un compañero Thaqafi de al-Ta'if que sirvió como gobernador de la ciudad bajo el mando de Umar ibn al-Khattab; transmite 'di: Creo en Dios, entonces mantente firme', el vigésimo primer hadiz de los Cuarenta de al-Nawawi, incluido por Muslim en su Sahih a través de Hisham ibn Urwa de su padre de él, la ruta al-Zuhri de Muhammad ibn Abd al-Rahman ibn Ma'iz agregando su pregunta '¿qué es lo que más temes por mí?' respondida por el Profeta tomando su propia lengua y diciendo 'esto'; su hijo Abdullah ibn Sufyan también narra de él en Ahmad y al-Nasa'i."
  fr: "Un compagnon Thaqafi d'al-Ta'if, qui fut gouverneur de la ville sous l'autorité d'Umar ibn al-Khattab, transmet le vingt-et-unième hadith des quarante d'al-Nawawi, « Dis: Je crois en Dieu, puis tiens bon », inclus par Muslim dans son Sahih par l'intermédiaire de Hisham ibn Urwa, qui le tient de son père, puis de lui, par la voie al-Zuhri, d'après Muhammad ibn Abd al-Rahman ibn Ma'iz, ajoutant sa question: « Qu'est-ce que tu crains le plus pour moi ? », à laquelle le Prophète répondit en retenant sa langue et en disant « ceci ». Son fils Abdullah ibn Sufyan le rapporte également dans Ahmad et al-Nasa'i."
