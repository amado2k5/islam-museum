summary:
  ar: "محمد بن محمد بن عبد الرحمن الرُّعيني، المعروف بالحطاب، فقيه مالكي من علماء المتصوفة، أصله من المغرب، ولد واشتهر بمكة، ومات في طرابلس الغرب. من تصانيفه «مواهب الجليل في شرح مختصر خليل» في ستة مجلدات، و«شرح نظم نظائر رسالة القيرواني» لابن غازي، ورسالة في استخراج أوقات الصلاة بالأعمال الفلكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1620}"
  en: "Muhammad ibn Muhammad ibn Abd al-Rahman al-Ru'ayni, known as al-Hattab, a Maliki jurist among the Sufi scholars. Of Moroccan origin, he became known in Mecca and died in Tripoli of the West. His works include Mawahib al-jalil fi sharh Mukhtasar Khalil in six volumes, a commentary on Ibn Ghazi's verse on the Qayrawani risala, and a treatise on finding prayer times by astronomical methods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1620}"
  es: "Muhammad ibn Muhammad ibn Abd al-Rahman al-Ru'ayni, conocido como al-Hattab, fue un jurista malikí entre los eruditos sufíes. De origen marroquí, se dio a conocer en La Meca y falleció en Trípoli, en Occidente. Entre sus obras destacan Mawahib al-jalil fi sharh Mukhtasar Khalil en seis volúmenes, un comentario sobre el verso de Ibn Ghazi acerca de la risala Qayrawani y un tratado sobre la determinación de los horarios de oración mediante métodos astronómicos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1620}"
  fr: "Muhammad ibn Muhammad ibn Abd al-Rahman al-Ru'ayni, dit al-Hattab, était un juriste malikite soufi d'origine marocaine. Il acquit une certaine renommée à La Mecque et mourut à Tripoli. Parmi ses œuvres figurent le Mawahib al-jalil fi sharh Mukhtasar Khalil en six volumes, un commentaire du verset d'Ibn Ghazi sur la risala qayrawanite, et un traité sur la détermination des heures de prière par des méthodes astronomiques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1620}"
  ur: "محمد بن محمد بن عبدالرحمٰن الروعینی، جسے الحطب کے نام سے جانا جاتا ہے، صوفی علماء میں سے ایک مالکی فقیہ۔ مراکشی نژاد، وہ مکہ میں مشہور ہوئے اور مغرب کے طرابلس میں انتقال کر گئے۔ ان کی تصانیف میں چھ جلدوں میں مواحب الجلیل فی شرح مختار خلیل، قاروانی رسالہ پر ابن غازی کی آیت کی تفسیر، اور فلکیاتی طریقوں سے نماز کے اوقات معلوم کرنے کا ایک مقالہ شامل ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 1620}"
