summary:
  ar: "محمد بن محمد بن عبد الرحمن الرُّعيني، المعروف بالحطاب، فقيه مالكي من علماء المتصوفة، أصله من المغرب، ولد واشتهر بمكة، ومات في طرابلس الغرب. من تصانيفه «مواهب الجليل في شرح مختصر خليل» في ستة مجلدات، و«شرح نظم نظائر رسالة القيرواني» لابن غازي، ورسالة في استخراج أوقات الصلاة بالأعمال الفلكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1620}"
  en: "Muhammad ibn Muhammad ibn Abd al-Rahman al-Ru'ayni, known as al-Hattab, a Maliki jurist among the Sufi scholars. Of Moroccan origin, he became known in Mecca and died in Tripoli of the West. His works include Mawahib al-jalil fi sharh Mukhtasar Khalil in six volumes, a commentary on Ibn Ghazi's verse on the Qayrawani risala, and a treatise on finding prayer times by astronomical methods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1620}"
