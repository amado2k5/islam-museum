summary:
  ar: "قدم في وفد من الأزد على النبي فأسلم وحسن إسلامه، فأمّره النبي على من أسلم من قومه وأمره أن يجاهد بهم من يليه من أهل الشرك من قبائل اليمن؛ فحاصر جرش نحو شهر ثم انصرف، فلما ظنوا أنه منهزم وطلبوه عطف عليهم عند جبل شكر فقتلهم قتلاً شديداً."
  en: "He came in an Azd delegation to the Prophet and became a good Muslim; the Prophet set him over the Muslims of his people and ordered him to fight the neighbouring polytheist tribes of Yemen. He besieged Jurash for about a month, withdrew, and when its people pursued him thinking him routed he turned on them at the mountain of Shakar and slaughtered them."
  ur: "ازد کے وفد میں نبی کے پاس آیا اور نیک مسلمان ہوا؛ نبی نے اسے اپنے قوم کے مسلمانوں پر مقرر کیا۔"
  es: "Llegó al Profeta en una delegación de Azd y se convirtió en un buen musulmán. El Profeta lo puso al frente de los musulmanes de su pueblo y le ordenó combatir a las tribus politeístas vecinas de Yemen. Sitió Jurash durante aproximadamente un mes, se retiró y, cuando sus habitantes lo persiguieron creyendo que había sido derrotado, los atacó en el monte Shakar y los masacró."
  fr: "Il se présenta auprès du Prophète au sein d'une délégation Azd et se convertit à l'islam. Le Prophète le nomma chef des musulmans de son peuple et lui ordonna de combattre les tribus polythéistes voisines du Yémen. Il assiégea Jurash pendant environ un mois, puis se retira. Lorsque ses habitants le poursuivirent, le croyant vaincu, il se retourna contre eux sur le mont Shakar et les massacra."
  tr: "El-Ezd'den bir heyetle Peygamber'e geldi, Peygamber İslam'a geçti ve kabul etti. Peygamber, kendisine kendi halkı arasında İslam'ı benimseyenlere liderlik etmesi ve Yemen'in müşrik kabilelerinden kendisini takip edenlerle savaşması emredildi. Yaklaşık bir ay boyunca Cerash'ı kuşattı ve sonra geri çekildi. Onlar onun yenildiğini düşünüp onu aradıklarında, Şükr Dağı'nda onlara döndü ve onları ağır şekilde öldürdü."
  id: "Ia datang bersama delegasi dari Al-Azd kepada Nabi, yang memeluk Islam dan menerimanya. Nabi memerintahkannya untuk memimpin mereka di antara kaumnya yang telah memeluk Islam dan melawan mereka yang mengikutinya dari suku-suku musyrik di Yaman. Ia mengepung Jerash selama sekitar sebulan lalu mundur. Ketika mereka mengira ia telah dikalahkan dan mencarinya, ia berbalik kepada mereka di Gunung Shukr dan membunuh mereka dengan brutal."
