summary:
  ar: "قدم في وفد من الأزد على النبي فأسلم وحسن إسلامه، فأمّره النبي على من أسلم من قومه وأمره أن يجاهد بهم من يليه من أهل الشرك من قبائل اليمن؛ فحاصر جرش نحو شهر ثم انصرف، فلما ظنوا أنه منهزم وطلبوه عطف عليهم عند جبل شكر فقتلهم قتلاً شديداً."
  en: "He came in an Azd delegation to the Prophet and became a good Muslim; the Prophet set him over the Muslims of his people and ordered him to fight the neighbouring polytheist tribes of Yemen. He besieged Jurash for about a month, withdrew, and when its people pursued him thinking him routed he turned on them at the mountain of Shakar and slaughtered them."
