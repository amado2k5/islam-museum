summary:
  ar: "سياسي نيجيري (1910–1966) من رابا، سليل عثمان دان فوديو وحامل لقب سردوانة صكتو منذ 1938، قاد مؤتمر الشعب الشمالي وكان أول رئيس لحكومة المنطقة الشمالية ووحيدها (1954–1966)، فهيمن على سياسة نيجيريا حتى اغتياله في كادونا في انقلاب 15 يناير 1966. أسهم في تأسيس جامعة أهل الشمال المسلمين ورابطة العالم الإسلامي، وتُنسَب إليه جامعة أحمدو بلو في زاريا التي تحمل اسمه."
  en: "Nigerian politician (1910–1966) from Rabah, a descendant of Uthman dan Fodio who held the Sardauna of Sokoto title from 1938. He led the Northern People's Congress and was the first and only Premier of the Northern Region (1954–1966), dominating Nigerian politics until his assassination in Kaduna in the coup of 15 January 1966. He helped found the Jama'atu Nasril Islam and the Muslim World League, and Ahmadu Bello University in Zaria bears his name."
  ur: "نائجریائی سیاست دان ⁦(1910ء–1966ء)⁩، رابا سے تعلق؛ عثمان دان فودیو کی اولاد اور 1938 سے ’سردوانۂ صوکوتو‘ کے لقب کے حامل۔ ناردرن پیپلز کانگریس کی قیادت کی اور شمالی خطے کے پہلے اور واحد وزیرِ اعظم رہے ⁦(1954ء–1966ء)⁩؛ 15 جنوری 1966 کی بغاوت میں کادونا میں قتل ہوئے۔ جماعتِ نصر الاسلام اور رابطہ عالم اسلامی کی تاسیس میں شریک رہے، اور زاریا کی احمدو بلیو یونیورسٹی ان کے نام پر ہے۔"
  es: "Político nigeriano (1910-1966) originario de Rabah, descendiente de Uthman dan Fodio, quien ostentó el título de Sardauna de Sokoto desde 1938. Lideró el Congreso del Pueblo del Norte y fue el primer y único Primer Ministro de la Región Norte (1954-1966), dominando la política nigeriana hasta su asesinato en Kaduna durante el golpe de Estado del 15 de enero de 1966. Contribuyó a la fundación de Jama'atu Nasril Islam y la Liga Mundial Musulmana, y la Universidad Ahmadu Bello en Zaria lleva su nombre."
  fr: "Homme politique nigérian (1910-1966) originaire de Rabah, descendant d'Uthman dan Fodio qui détenait le titre de Sardauna de Sokoto depuis 1938. Il dirigea le Congrès du peuple du Nord et fut le premier et unique Premier ministre de la Région du Nord (1954-1966), dominant la vie politique nigériane jusqu'à son assassinat à Kaduna lors du coup d'État du 15 janvier 1966. Il contribua à la fondation de la Jama'atu Nasril Islam et de la Ligue islamique mondiale, et l'université Ahmadu Bello de Zaria porte son nom."
  tr: "Rabah'lı Nijeryalı bir siyasetçi (1910–1966), Usman Dan Fodio'nun soyundan geliyordu ve 1938'den beri Sardawana Sokoto unvanını taşıyordu. Kuzey Halk Kongresi'ne liderlik etti ve Kuzey Bölgesi hükümetinin ilk ve tek başkanıydı (1954–1966). 15 Ocak 1966'daki Kaduna darbesinde suikasta uğrayana kadar Nijerya siyasetine hakim oldu. Kuzey Halk Üniversitesi ve Müslüman Dünya Birliği'nin kuruluşuna katkıda bulundu ve adını taşıyan Zaria'daki Ahmadu Bello Üniversitesi'nin de ona atfedildiği düşünülmektedir."
  id: "Seorang politikus Nigeria (1910–1966) dari Rabah, keturunan Usman Dan Fodio dan pemegang gelar Sardawana Sokoto sejak 1938, ia memimpin Kongres Rakyat Utara dan merupakan presiden pertama dan satu-satunya pemerintahan Wilayah Utara (1954–1966), mendominasi politik Nigeria hingga pembunuhannya di Kaduna dalam kudeta 15 Januari 1966. Ia berkontribusi pada pendirian Universitas Rakyat Utara dan Liga Dunia Muslim, dan Universitas Ahmadu Bello di Zaria, yang menyandang namanya, dikaitkan dengannya."
