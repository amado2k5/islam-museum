summary:
  ar: "سياسي نيجيري (1910–1966) من رابا، سليل عثمان دان فوديو وحامل لقب سردوانة صكتو منذ 1938، قاد مؤتمر الشعب الشمالي وكان أول رئيس لحكومة المنطقة الشمالية ووحيدها (1954–1966)، فهيمن على سياسة نيجيريا حتى اغتياله في كادونا في انقلاب 15 يناير 1966. أسهم في تأسيس جامعة أهل الشمال المسلمين ورابطة العالم الإسلامي، وتُنسَب إليه جامعة أحمدو بلو في زاريا التي تحمل اسمه."
  en: "Nigerian politician (1910–1966) from Rabah, a descendant of Uthman dan Fodio who held the Sardauna of Sokoto title from 1938. He led the Northern People's Congress and was the first and only Premier of the Northern Region (1954–1966), dominating Nigerian politics until his assassination in Kaduna in the coup of 15 January 1966. He helped found the Jama'atu Nasril Islam and the Muslim World League, and Ahmadu Bello University in Zaria bears his name."
  ur: "نائجریائی سیاست دان (1910ء–1966ء)، رابا سے تعلق؛ عثمان دان فودیو کی اولاد اور 1938 سے ’سردوانۂ صوکوتو‘ کے لقب کے حامل۔ ناردرن پیپلز کانگریس کی قیادت کی اور شمالی خطے کے پہلے اور واحد وزیرِ اعظم رہے (1954ء–1966ء)؛ 15 جنوری 1966 کی بغاوت میں کادونا میں قتل ہوئے۔ جماعتِ نصر الاسلام اور رابطہ عالم اسلامی کی تاسیس میں شریک رہے، اور زاریا کی احمدو بلیو یونیورسٹی ان کے نام پر ہے۔"
