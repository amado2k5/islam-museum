summary:
  ar: "الإمام الحافظ أبو علي الحسن بن الحسين الزركاني المعروف بألب أرسلان؛ كان إماماً حافظاً مؤتمناً، انتخب عليه السلفي مائة جزء، عاش مائة وتسعاً وثلاثين سنة ومولده سنة ثلاث وثمانين وأربعمائة؛ توفي سنة تسع عشرة وخمسمائة {cite:shadharat-dhahab p. 539}."
  en: "The imam-hafiz Abu Ali al-Hasan al-Zarakani, called Alp Arslan — a trusted imam from whom al-Silafi gathered a hundred ajza'; born 383, he lived a hundred and thirty-nine years, dying in 519 {cite:shadharat-dhahab p. 539}."
  fr: "L'imam-hafiz Abu Ali al-Hasan al-Zarakani, appelé Alp Arslan - un imam de confiance dont al-Silafi recueilli cent ajza ' ; né en 383, il vécut cent trente-neuf ans, mourant en 519 {cite:shadharat-dhahab p. 539}."
  es: "El imam-hafiz Abu Ali al-Hasan al-Zarakani, llamado Alp Arslan, un imam de confianza del que al-Silafi reunió cien ajza'; nació en 383, vivió ciento treinta y nueve años y murió en 519 {cite:shadharat-dhahab p. 539}."
  ur: "امام-حافظ ابو علی الحسن الزرقانی، الپ ارسلان کہلاتے ہیں - ایک قابل اعتماد امام جس سے السلفی نے سو اجزا جمع کیے؛ 383 میں پیدا ہوئے، ایک سو انتیس سال زندہ رہے، 519 میں وفات پائی۔ 539}۔"
