id: person/al-rabi-ibn-yunus
class: person
label: { ar: "الربيع بن يونس", en: "al-Rabi' ibn Yunus", fr: "al-Rabi' ibn Yunus", es: "al-Rabi' ibn Yunus", ur: "ربیع ابن یونس" }
summary:
  ar: "عند البلاذري: الربيع صاحب المنصور وهو الربيع بن يونس بن محمد بن أبي فروة عبد الرحمن بن الأسود الذي كان من السبي وابتاعه عثمان لحفر القبور. وعند المسعودي أتاه بالخريطة بخروج محمد بن عبد الله في وقت الهاجرة والمنصور نائم فأمر حماداً التركي أن يفتح فسمع المنصور ونهض يفتح بيده، وأرسله برأس إبراهيم إلى أبيه عبد الله في الحبس {cite:muruj-al-dhahab p. 286-288}"
  en: "In al-Baladhuri: al-Mansur's chamberlain, being al-Rabi' ibn Yunus ibn Muhammad ibn Abi Farwa — the Abd al-Rahman ibn al-Aswad taken captive whom Uthman bought for grave-digging."
  fr: "Dans al-Baladhuri : le chambellan d'al-Mansur, étant al-Rabi' ibn Yunus ibn Muhammad ibn Abi Farwa - l'Abd al-Rahman ibn al-Aswad capturé que Uthman a acheté pour creuser des tombes."
  es: "En al-Baladhuri: el chambelán de al-Mansur, siendo al-Rabi' ibn Yunus ibn Muhammad ibn Abi Farwa — el Abd al-Rahman ibn al-Aswad hecho prisionero a quien Uthman compró para cavar tumbas."
  ur: "البلادوری میں ہے: المنصور کا حجرہ، الربیع بن یونس بن محمد ابن ابی فروہ ہونے کے ناطے عبدالرحمٰن بن اسود نے اسیر کر لیا جسے عثمان نے قبر کھودنے کے لیے خریدا۔"
  tr: "El-Baladhuri'ye göre: El-Rabi', el-Mansur'un sahabesi, el-Rabi' ibn Yunus ibn Muhammed ibn Ebi Furva Abdülrahman ibn el-Esvad'dır; esirdi ve Osman mezar kazmak için satın almıştır. El-Mes'udhi'ye göre, Ushman, Hicre sırasında el-Mansur uyurken ayrılan Muhammed ibn Abdullah'ın haritasını ona getirmiştir. Haritayı açmasını emretti ve el-Mansur haritanın eliyle açıldığını duydu, İbrahim'in başıyla birlikte babası Abdullah'a hapiste gönderdi {atıf:Muruj-al-Dhahab s. 286-288}"
  id: "Menurut al-Baladhuri: Al-Rabi', sahabat al-Mansur, ia adalah al-Rabi' ibn Yunus ibn Muhammad ibn Abi Furwah Abd al-Rahman ibn al-Aswad, yang merupakan tawanan dan yang dibeli Uthman untuk menggali makam. Menurut al-Mas'udhi, ia membawakan peta Muhammad ibn Abdullah yang pergi selama Hijrah saat al-Mansur tertidur. Ia memerintahkan Hammad al-Turki untuk membukanya, dan al-Mansur mendengar peta itu dibuka dengan tangannya, lalu mengirimkannya bersama kepala Ibrahim kepada ayahnya Abdullah di penjara {cite:muruj-al-dhahab hlm. 286-288}"
