summary:
  ar: "عند البلاذري: الربيع صاحب المنصور وهو الربيع بن يونس بن محمد بن أبي فروة عبد الرحمن بن الأسود الذي كان من السبي وابتاعه عثمان لحفر القبور. وعند المسعودي أتاه بالخريطة بخروج محمد بن عبد الله في وقت الهاجرة والمنصور نائم فأمر حماداً التركي أن يفتح فسمع المنصور ونهض يفتح بيده، وأرسله برأس إبراهيم إلى أبيه عبد الله في الحبس {cite:muruj-al-dhahab p. 286-288}"
  en: "In al-Baladhuri: al-Mansur's chamberlain, being al-Rabi' ibn Yunus ibn Muhammad ibn Abi Farwa — the Abd al-Rahman ibn al-Aswad taken captive whom Uthman bought for grave-digging."
