summary:
  ar: "طبيب وكاتب مصري، تخرج في كلية الطب بالقصر العيني في ديسمبر 1953 وتخصص في أمراض الصدر، وبدأ نشر القصص القصيرة في مجلة الرسالة سنة 1947؛ كتب في القصة والرواية والمسرح والفكر، وروى في «رحلتي من الشك إلى الإيمان» انتقاله من الشك والنظرة المادية ووحدة الوجود إلى الإيمان {cite:mm-allah-wal-insan-1957 p. 5} {cite:mm-rihla-min-al-shakk-maarif p. 5} {cite:mm-rihla-min-al-shakk-maarif p. 14}."
  en: "Egyptian physician and writer who graduated from the Qasr al-Aini Faculty of Medicine in December 1953, specialising in chest diseases, and began publishing short stories in al-Risala in 1947; he wrote stories, novels, plays and essays of ideas, and in Rihlati min al-Shakk ila al-Iman narrated his passage from doubt, materialism and pantheism to faith {cite:mm-allah-wal-insan-1957 p. 5} {cite:mm-rihla-min-al-shakk-maarif p. 5} {cite:mm-rihla-min-al-shakk-maarif p. 14}."
  ur: "مصری طبیب اور ادیب، جنہوں نے دسمبر 1953 میں قصر العینی کی کلیۂ طب سے فراغت پائی اور سینے کے امراض میں تخصص کیا، اور 1947 میں رسالہ میں افسانے شائع کرنا شروع کیے؛ انہوں نے افسانہ، ناول، ڈرامہ اور فکری مضامین لکھے، اور «رحلتی من الشک الی الایمان» میں شک، مادیت اور وحدت الوجود سے ایمان تک اپنا سفر بیان کیا {cite:mm-allah-wal-insan-1957 p. 5} {cite:mm-rihla-min-al-shakk-maarif p. 5} {cite:mm-rihla-min-al-shakk-maarif p. 14}۔"
