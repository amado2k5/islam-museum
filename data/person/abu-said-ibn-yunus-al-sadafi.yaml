summary:
  ar: "أبو سعيد عبد الرحمن بن أبي الحسن أحمد بن أبي موسى يونس بن عبد الأعلى الصدفي، المحدث المؤرخ المصري؛ حفيد يونس بن عبد الأعلى صاحب الإمام الشافعي الناقل لأقواله الجديدة؛ جمع لمصر تاريخين: أحدهما وهو الأكبر يختص بالمصريين، والآخر وهو صغير يشتمل على ذكر الغرباء الواردين على مصر؛ ذيّل عليهما أبو القاسم يحيى بن علي الحضرمي وبنى عليهما {cite:wafayat-ayan}."
  en: "Abu Sa'id Abd al-Rahman b. Yunus al-Sadafi (281–347) — the Egyptian historian, grandson of Yunus b. Abd al-A'la; author of two histories of Egypt, the great one on Egyptians and a smaller one on foreigners who settled there {cite:wafayat-ayan}."
  fr: "Abu Sa'id Abd al-Rahman b. Yunus al-Sadafi (281–347), historien égyptien, petit-fils de Yunus b. Abd al-A'la ; auteur de deux histoires de l'Égypte, la grande consacrée aux Égyptiens et une plus courte aux étrangers qui s'y installèrent {cite:wafayat-ayan}."
  es: "Abu Sa'id Abd al-Rahman b. Yunus al-Sadafi (281–347) — el historiador egipcio, nieto de Yunus b. Abd al-A'la; autor de dos historias de Egipto, la importante sobre los egipcios y una más breve sobre los extranjeros que se establecieron allí {cite:wafayat-ayan}."
  ur: "ابو سعید عبد الرحمن بن۔ یونس الصدفی (281–347) - مصری مورخ، یونس بن کا پوتا۔ عبد العلا; مصر کی دو تاریخوں کے مصنف، مصریوں پر ایک عظیم اور وہاں پر آباد غیر ملکیوں پر چھوٹی۔"
  tr: "Mısırlı tarihçi ve hadis âlimi Ebu Said Abdülrahman bin Ebu el-Hasan Ahmed bin Ebu Musa Yunus bin Abdül Âla el-Sadafi; İmam Şafiî'nin sahabesi ve onun yeni sözlerini rivayet eden Yunus bin Abdül Âla'nın torunudur; Mısır'ın iki tarihini derlemiştir: daha büyük olanı Mısırlılarla ilgilidir, daha küçük olanı ise Mısır'a gelen yabancılardan bahsetmektedir; Ebu el-Kâsim Yahya bin Ali el-Hadrami bunlara eklemeler yapmış ve bunları geliştirmiştir. {Kaynak: Vefayyat-ı Ayan}"
  id: "Abu Saeed Abdul Rahman bin Abi Al-Hassan Ahmad bin Abi Musa Yunus bin Abdul A’la Al-Sadafi, sejarawan dan ahli hadits Mesir; cucu dari Yunus bin Abdul A’la, sahabat Imam Al-Shafi’i, yang meriwayatkan hadits-hadits barunya; beliau menyusun dua sejarah Mesir: salah satunya, yang lebih besar, berkaitan dengan orang Mesir, dan yang lainnya, yang lebih kecil, mencakup penyebutan orang asing yang datang ke Mesir; Abu Al-Qasim Yahya bin Ali Al-Hadrami menambahkan dan mengembangkan karya-karya tersebut {cite:wafayat-ayan}."
