  ar: "أبو سعيد عبد الرحمن بن أبي الحسن أحمد بن أبي موسى يونس بن عبد الأعلى الصدفي، المحدث المؤرخ المصري؛ حفيد يونس بن عبد الأعلى صاحب الإمام الشافعي الناقل لأقواله الجديدة؛ جمع لمصر تاريخين: أحدهما وهو الأكبر يختص بالمصريين، والآخر وهو صغير يشتمل على ذكر الغرباء الواردين على مصر؛ ذيّل عليهما أبو القاسم يحيى بن علي الحضرمي وبنى عليهما {cite:wafayat-ayan}."
  en: "Abu Sa'id Abd al-Rahman b. Yunus al-Sadafi (281–347) — the Egyptian historian, grandson of Yunus b. Abd al-A'la; author of two histories of Egypt, the great one on Egyptians and a smaller one on foreigners who settled there {cite:wafayat-ayan}."
