summary:
  ar: "ناشطة هندية مسنّة اشتهرت بلقب «دادي» ⁦(الجدة)⁩، من سكان هابور في أوتار براديش. صارت رمزًا لاعتصام شاهين باغ في دلهي الذي دام نحو مئة يوم ضد قانون تعديل المواطنة، وأدرجتها مجلة تايم ضمن أكثر مئة شخص تأثيرًا سنة 2020."
  en: "Elderly Indian activist popularly known as Bilkis Dadi ('grandmother'), from Hapur in Uttar Pradesh. She became a symbol of the hundred-day Shaheen Bagh sit-in in Delhi against the Citizenship Amendment Act, and Time magazine named her among its hundred most influential people of 2020."
  ur: "بزرگ بھارتی کارکن جو «بلقیس دادی» ⁦(دادی امّاں)⁩ کے نام سے مشہور ہیں، اتر پردیش کے ہاپور کی رہائشی۔ وہ دہلی میں شہریت ترمیمی ایکٹ کے خلاف سو دن جاری رہنے والے شاہین باغ دھرنے کی علامت بن گئیں، اور ٹائم میگزین نے انہیں 2020ء کی سو مؤثر ترین شخصیات میں شامل کیا۔"
  es: "Activista india de edad avanzada, popularmente conocida como Bilkis Dadi (\"abuela\"), originaria de Hapur, en Uttar Pradesh. Se convirtió en un símbolo de la sentada de cien días en Shaheen Bagh, Delhi, contra la Ley de Enmienda de la Ciudadanía, y la revista Time la incluyó entre las cien personas más influyentes de 2020."
