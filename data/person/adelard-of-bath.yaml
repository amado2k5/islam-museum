summary:
  ar: "أديلارد الباثي مترجم لاتيني من القرن الثاني عشر للميلاد، نقل عن العربية جداول الخوارزمي الفلكية بصيغتها التي هذّبها مسلمة المجريطي لقرطبة، وتؤرخ الموسوعة ترجمته بسنة 1126م. وتنسب إليه الأدبيات أيضاً نسخة لاتينية من أصول إقليدس مبنية على أصول عربية. ولا تذكر المراجع التي قُرئت سنة ميلاده ولا وفاته {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  en: "Adelard of Bath was a twelfth-century Latin translator who rendered into Latin al-Khwarizmi's astronomical tables in the recension Maslama al-Majriti adapted for Cordoba, a translation the Encyclopaedia of Islam dates to 1126. Scholarship also ascribes to him a Latin version of Euclid's Elements built on Arabic texts. The sources read give neither his birth nor his death {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  ur: "ایڈلرڈ آف باتھ بارہویں صدی عیسوی کے لاطینی مترجم تھے جنہوں نے خوارزمی کے فلکیاتی جدول اس صورت میں لاطینی میں منتقل کیے جو مسلمہ مجریطی نے قرطبہ کے لیے مرتب کی تھی؛ دائرۃ المعارف اس ترجمے کی تاریخ 1126ء بتاتا ہے۔ تحقیق میں ان سے اقلیدس کے اصول کا ایک لاطینی نسخہ بھی منسوب ہے جو عربی متن پر مبنی ہے۔ پڑھے گئے مآخذ میں ان کی ولادت اور وفات کا ذکر نہیں {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
