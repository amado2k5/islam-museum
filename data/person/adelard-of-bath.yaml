id: person/adelard-of-bath
class: person
label: { ar: "أديلارد الباثي", en: "Adelard of Bath", fr: "Adélard de Bath", ur: "ایڈلرڈ آف باتھ", es: "Adelard of Bath" }
names:
  - { kind: latinized, lang: la, value: "Adelardus Bathoniensis" }
summary:
  ar: "أديلارد الباثي مترجم لاتيني من القرن الثاني عشر للميلاد، نقل عن العربية جداول الخوارزمي الفلكية بصيغتها التي هذّبها مسلمة المجريطي لقرطبة، وتؤرخ الموسوعة ترجمته بسنة 1126م. وتنسب إليه الأدبيات أيضاً نسخة لاتينية من أصول إقليدس مبنية على أصول عربية. ولا تذكر المراجع التي قُرئت سنة ميلاده ولا وفاته {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  en: "Adelard of Bath was a twelfth-century Latin translator who rendered into Latin al-Khwarizmi's astronomical tables in the recension Maslama al-Majriti adapted for Cordoba, a translation the Encyclopaedia of Islam dates to 1126. Scholarship also ascribes to him a Latin version of Euclid's Elements built on Arabic texts. The sources read give neither his birth nor his death {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  fr: "Traducteur latin du XIIe siècle, Adélard de Bath traduisit les tables astronomiques d'al-Khwarizmi dans la recension adaptée par Maslama al-Majriti pour Cordoue, traduction datée de 1126 par l'Encyclopédie de l'Islam. Les chercheurs lui attribuent aussi une version latine des Éléments d'Euclide fondée sur des textes arabes. Les sources lues ne donnent ni sa naissance ni sa mort {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  ur: "ایڈلرڈ آف باتھ بارہویں صدی عیسوی کے لاطینی مترجم تھے جنہوں نے خوارزمی کے فلکیاتی جدول اس صورت میں لاطینی میں منتقل کیے جو مسلمہ مجریطی نے قرطبہ کے لیے مرتب کی تھی؛ دائرۃ المعارف اس ترجمے کی تاریخ 1126ء بتاتا ہے۔ تحقیق میں ان سے اقلیدس کے اصول کا ایک لاطینی نسخہ بھی منسوب ہے جو عربی متن پر مبنی ہے۔ پڑھے گئے مآخذ میں ان کی ولادت اور وفات کا ذکر نہیں {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  es: "Adelardo de Bath fue un traductor latino del siglo XII que tradujo al latín las tablas astronómicas de al-Juarismi en la recensión Maslama al-Majriti, adaptada para Córdoba, traducción que la Enciclopedia del Islam fecha en 1126. Los estudiosos también le atribuyen una versión latina de los Elementos de Euclides, basada en textos árabes. Las fuentes consultadas no indican ni su nacimiento ni su muerte {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  tr: "12. yüzyıl Latin çevirmeni Adelard of Pathé, El-Harezmi'nin astronomik tablolarını, Maslama el-Mecirti tarafından Kurtuba için kısaltılmış biçimde Arapçadan çevirmiştir. Ansiklopedi, çevirisini 1126 yılına tarihlendirmektedir. Literatür ayrıca, Arapça kaynaklara dayanan Öklid'in Elemanları'nın Latince bir versiyonunu da ona atfetmektedir. Danışılan kaynaklarda doğum veya ölüm tarihleri belirtilmemektedir. {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  id: "Adelard dari Pathé, seorang penerjemah Latin abad ke-12, menerjemahkan tabel astronomi al-Khwarizmi dari bahasa Arab dalam bentuk ringkasan oleh Maslama al-Majriti untuk Cordoba. Ensiklopedia tersebut mencatat terjemahannya pada tahun 1126 M. Literatur juga mengaitkan kepadanya versi Latin dari Elemen Euklides berdasarkan sumber-sumber Arab. Referensi yang dikonsultasikan tidak menyebutkan tanggal lahir atau kematiannya. {cite:encyclopaedia-of-islam-2 vol. 3 p. 1170} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
