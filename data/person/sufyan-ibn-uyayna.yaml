id: person/sufyan-ibn-uyayna
class: person
label: { ar: "سفيان بن عيينة", en: "Sufyan ibn Uyayna" }
summary:
  ar: "سفيان بن عيينة المكي، فقيه الحجاز ومحدثها في القرن الثاني؛ عند البلاذري: كتب إليه عبد الملك بن صالح يستفتيه في أمر أهل قبرس فأجاب «أنا لا نعلم أن الله عاهد قوماً فنقضوا العهد إلا استحل قتلهم، غير أهل مكة فإنه منّ عليهم» — وذلك أن نقضهم كان نصرتهم حلفاءهم على حلفاء رسول الله للعم من خزاعة — وكان من أمر أهل تجران أن أخذ عليهم أن لا يأكلوا الربا فحكم فيهم عمر حين أكلوه بإجلائهم، فإجماع القوم أن من نقض عهداً فلا ذمة له.، وروى عن نفسه خبر الفضيل بن عياض مع الرشيد واستعفائه من البدرة وقوله لو طابت لأولئك لطابت لي {cite:muruj-al-dhahab p. 341-342}، وعند ابن النديم سفيان بن عيينة الهلالي توفي سنة ثمان وتسعين ومائة وكان فقيها فحولا ولا كتاب له يعرف وإنما كان يسمع منه وله تفسير معروف {cite:fihrist-ibn-al-nadim p. 316}"
  en: "Sufyan ibn Uyayna of Mecca, jurist and hadith-master of second-century Hijaz; in al-Baladhuri: Abd al-Malik ibn Salih wrote consulting him on the people of Cyprus, and he answered 'we know of no people God covenanted with who broke the covenant without their blood becoming lawful, save the people of Mecca whom He pardoned' — their breach having been aiding their allies against the Messenger's own allies of Khuza'a — adding the case of Tajran's people, bound not to consume usury, whom Umar ruled to exile when they did; the consensus being that whoever breaks a covenant has no dhimma."
