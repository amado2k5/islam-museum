label: { ar: "سفيان بن عيينة", en: "Sufyan ibn Uyayna", es: "Sufyan ibn Uyayna", fr: "Sufyan ibn Uyayna", ur: "سفیان بن عیینہ" }
summary:
  ar: "سفيان بن عيينة المكي، فقيه الحجاز ومحدثها في القرن الثاني؛ عند البلاذري: كتب إليه عبد الملك بن صالح يستفتيه في أمر أهل قبرس فأجاب «أنا لا نعلم أن الله عاهد قوماً فنقضوا العهد إلا استحل قتلهم، غير أهل مكة فإنه منّ عليهم» — وذلك أن نقضهم كان نصرتهم حلفاءهم على حلفاء رسول الله للعم من خزاعة — وكان من أمر أهل تجران أن أخذ عليهم أن لا يأكلوا الربا فحكم فيهم عمر حين أكلوه بإجلائهم، فإجماع القوم أن من نقض عهداً فلا ذمة له. وروى عن نفسه خبر الفضيل بن عياض مع الرشيد واستعفائه من البدرة وقوله لو طابت لأولئك لطابت لي {cite:muruj-al-dhahab p. 341-342}، وعند ابن النديم سفيان بن عيينة الهلالي توفي سنة ثمان وتسعين ومائة وكان فقيها فحولا ولا كتاب له يعرف وإنما كان يسمع منه وله تفسير معروف {cite:fihrist-ibn-al-nadim p. 316}"
  en: "Sufyan ibn Uyayna of Mecca, jurist and hadith-master of second-century Hijaz; in al-Baladhuri: Abd al-Malik ibn Salih wrote consulting him on the people of Cyprus, and he answered 'we know of no people God covenanted with who broke the covenant without their blood becoming lawful, save the people of Mecca whom He pardoned' — their breach having been aiding their allies against the Messenger's own allies of Khuza'a — adding the case of Tajran's people, bound not to consume usury, whom Umar ruled to exile when they did; the consensus being that whoever breaks a covenant has no dhimma."
  es: "Sufyan ibn Uyayna de La Meca, jurista y maestro de hadices del Hiyaz del siglo II; en al-Baladhuri: Abd al-Malik ibn Salih le escribió consultándole sobre el pueblo de Chipre, y él respondió: \"No conocemos a ningún pueblo con el que Dios haya hecho un pacto que haya roto el pacto sin que su sangre se volviera lícita, salvo el pueblo de La Meca, a quien Él perdonó\" —su transgresión había sido ayudar a sus aliados contra los propios aliados del Mensajero de Khuza'a— añadiendo el caso del pueblo de Tajran, obligado a no consumir usura, a quienes Umar mandó exiliar cuando lo hicieron; el consenso es que quien rompe un pacto no tiene dhimma."
  fr: "Sufyan ibn Uyayna de La Mecque, juriste et maître du hadith du IIe siècle dans le Hedjaz, rapporte dans al-Baladhuri: Abd al-Malik ibn Salih lui écrivit pour le consulter au sujet des habitants de Chypre, et il répondit: « Nous ne connaissons aucun peuple avec lequel Dieu a conclu une alliance et qui l'ait rompue sans que son sang ne devienne licite, à l'exception des habitants de La Mecque qu'Il a pardonnés » — leur rupture ayant consisté à aider leurs alliés contre les propres alliés du Messager, les Khuza'a — ajoutant le cas des habitants de Tajran, tenus de ne pas pratiquer l'usure, qu'Umar condamna à l'exil lorsqu'ils s'y adonnèrent; le consensus étant que quiconque rompt une alliance n'a pas de dhimma."
  ur: "مکہ کے سفیان بن عیینہ، دوسری صدی کے حجاز کے فقیہ اور حدیث کے ماہر؛ البلادوری میں ہے: عبد الملک بن صالح نے قبرص کے لوگوں کے بارے میں اس سے مشورہ کرتے ہوئے لکھا، اور اس نے جواب دیا کہ 'ہم کسی ایسے لوگوں کے بارے میں نہیں جانتے جس سے خدا نے عہد کیا ہو جس نے ان کا خون حلال کیے بغیر عہد کو توڑا ہو، سوائے مکہ کے وہ لوگ جنہیں اس نے معاف کر دیا تھا' - ان کی خلاف ورزی رسول کے خلاف اپنے اتحادیوں کی مدد کر رہی تھی، اور اس نے کجران کے اپنے حلیفوں کے کیس میں اضافہ کیا۔ سود نہ کھائیں، جنہیں عمر نے جلاوطن کرنے کا حکم دیا تھا جب انہوں نے ایسا کیا تھا۔ اس بات پر اجماع ہے کہ جو کوئی عہد توڑتا ہے اس کا کوئی ذم نہیں ہے۔"
