summary:
  ar: "المولى الرشيد بن الشريف (1631 – 9 نيسان 1672)، أول سلاطين المغرب العلويين، ابن مؤسس السلالة المولى الشريف. ثار على أخيه الأكبر مولاي محمد وقتله في وقعة أنجاد سنة 1664 فخلفه على تافيلالت، ثم استولى على فاس سنة 1667 وأُعلن سلطانًا، فأخضع مراكش والسوس ودمّر زاوية الدلاء فصار عند مؤرخين كثر المؤسس الحقيقي للسلطة العلوية. بنى الجسور والمدارس وأصلح العملة، ومات بمراكش إثر سقوطه عن فرسه فخلفه أخوه مولاي إسماعيل."
  en: "Moulay al-Rashid ibn al-Sharif (1631 – 9 April 1672) was the first Alawite sultan of Morocco, son of the dynasty's founder Moulay Sharif. He rebelled against his elder brother Sidi Mohammed, who was killed at the battle of Angad in 1664, and succeeded him in Tafilalt; in 1667 he took Fez and was proclaimed sultan, then subdued Marrakesh and the Sous and destroyed the Dila zawiya, and many historians count him the true founder of Alawite power. He built bridges and madrasas and reformed the currency, and died at Marrakesh after a fall from his horse, succeeded by his brother Moulay Ismail."
  ur: "مولای رشید بن الشریف (1631ء – 9 اپریل 1672ء) مغرب کے پہلے علوی سلطان تھے، سلسلے کے بانی مولای شریف کے بیٹے۔ اپنے بڑے بھائی مولای محمد کے خلاف اٹھے، جو 1664ء میں انگاد کی لڑائی میں مارے گئے، اور تافیلالت میں ان کے جانشین بنے؛ 1667ء میں فاس فتح کر کے سلطان قرار پائے، پھر مراكش اور سوس کو مطیع کیا اور دلاء زاویہ کو ختم کر دیا، اس لیے بہت سے مؤرخین انہیں علوی اقتدار کا اصل بانی مانتے ہیں۔ پُل اور مدرسے بنائے اور سکہ درست کیا؛ مراكش میں گھوڑے سے گر کر وفات پائی اور ان کے بھائی مولای اسماعیل جانشین ہوئے۔"

