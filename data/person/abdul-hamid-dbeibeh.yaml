summary:
  ar: "سياسي ورجل أعمال ليبي من مصراتة، رئيس وزراء حكومة الوحدة الوطنية منذ 15 مارس 2021. أدار شركة ليبيا للاستثمار والتنمية في عهد القذافي، وأسّس حراك ليبيا المستقبل سنة 2020، واختاره ملتقى الحوار السياسي الليبي لقيادة الحكومة الموحدة في فبراير 2021."
  en: "Libyan politician and businessman from Misrata, prime minister of the Government of National Unity since 15 March 2021. He headed the Libyan Investment and Development Company under Gaddafi, founded the Libya Future movement in 2020, and was chosen by the Libyan Political Dialogue Forum in February 2021 to lead the unified government."
  ur: "مصراتہ سے تعلق رکھنے والے لیبیائی سیاست دان اور تاجر، جو 15 مارچ 2021 سے قومی اتحاد کی حکومت کے وزیرِ اعظم ہیں۔ انہوں نے قذافی کے دور میں لیبیا سرمایہ کاری و ترقی کمپنی کی قیادت کی، 2020 میں لیبیا المستقبل تحریک قائم کی، اور فروری 2021 میں لیبیا کے سیاسی ڈائیلاگ فورم نے انہیں متحدہ حکومت کی قیادت کے لیے منتخب کیا۔"
