summary:
  ar: "ورد اسمه في أخبار خراسان، وذكر الطبري أن الكرماني قتله بها سنة ثمان وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.330} {cite:tabari-tarikh-abu-al-fadl j.7 p.368}."
  en: "His name occurs in the reports on Khurasan, and al-Tabari mentions that al-Kirmani killed him there in 128 {cite:tabari-tarikh-abu-al-fadl j.7 p.330} {cite:tabari-tarikh-abu-al-fadl j.7 p.368}."
  es: "Su nombre aparece en los informes sobre Jorasán, y al-Tabari menciona que al-Kirmani lo mató allí en 128 {cite:tabari-tarikh-abu-al-fadl j.7 p.330} {cite:tabari-tarikh-abu-al-fadl j.7 p.368}."
  fr: "Son nom apparaît dans les rapports sur le Khorasan, et al-Tabari mentionne qu'al-Kirmani l'y a tué en 128 {cite:tabari-tarikh-abu-al-fadl j.7 p.330} {cite:tabari-tarikh-abu-al-fadl j.7 p.368}."
  ur: "خراسان کی رپورٹوں میں اس کا نام آتا ہے، اور الطبری نے ذکر کیا ہے کہ الکرمانی نے اسے وہاں 128 میں قتل کیا تھا۔"
