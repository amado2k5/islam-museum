summary:
  ar: "أبو علي الحسن بن رشيق المعروف بالقيرواني؛ صاحب الخطب المشهورة والرسائل المحيرة، كان من فرسان النثر وقال القاضي الفاضل إن جل اعتماده كان على حفظ كلامه، وذكره عماد الدين الأصبهاني في الخريدة وابن بسام في الذخيرة، وله كتاب الشذوذ في اللغة وغيره من التصانيف {cite:wafayat-ayan}. وله التصانيف الحسنة منها كتاب العمدة في صناعة الشعر ونقده وكتاب الأنموذج والسائل الفاتك والنظم الجميل؛ كان أبوه مملوكاً رومياً صائغاً بالمحمدية، وقرأ الأدب بها وقال الشعر ثم ارتحل إلى القيروان واشتهر بها ومدح صاحبها واتصل بخدمته، ولم يزل بها حتى هجم العرب القيروان وقتلوا أهلها وأخربوها فانتقل إلى جزيرة صقلية وأقام بها إلى أن مات {cite:shadharat-dhahab p. 305-306}."
  en: "Ibn Rashiq al-Qayrawani — master of ornate prose and author of al-Umda on the virtues of poetry; al-Qadi al-Fadil prized his speech, and he is quoted by al-Imad in the Kharida and Ibn Bassam in the Dhakhira {cite:wafayat-ayan}."
