summary:
  ar: "أبو علي الحسن بن رشيق المعروف بالقيرواني؛ صاحب الخطب المشهورة والرسائل المحيرة، كان من فرسان النثر وقال القاضي الفاضل إن جل اعتماده كان على حفظ كلامه، وذكره عماد الدين الأصبهاني في الخريدة وابن بسام في الذخيرة، وله كتاب الشذوذ في اللغة وغيره من التصانيف {cite:wafayat-ayan}. وله التصانيف الحسنة منها كتاب العمدة في صناعة الشعر ونقده وكتاب الأنموذج والسائل الفاتك والنظم الجميل؛ كان أبوه مملوكاً رومياً صائغاً بالمحمدية، وقرأ الأدب بها وقال الشعر ثم ارتحل إلى القيروان واشتهر بها ومدح صاحبها واتصل بخدمته، ولم يزل بها حتى هجم العرب القيروان وقتلوا أهلها وأخربوها فانتقل إلى جزيرة صقلية وأقام بها إلى أن مات {cite:shadharat-dhahab p. 305-306}."
  en: "Ibn Rashiq al-Qayrawani — master of ornate prose and author of al-Umda on the virtues of poetry; al-Qadi al-Fadil prized his speech, and he is quoted by al-Imad in the Kharida and Ibn Bassam in the Dhakhira {cite:wafayat-ayan}."
  es: "Ibn Rashiq al-Qayrawani, maestro de la prosa ornamentada y autor de al-Umda sobre las virtudes de la poesía; al-Qadi al-Fadil valoró su discurso y es citado por al-Imad en Kharida e Ibn Bassam en Dhakhira {citar:wafayat-ayan}."
  fr: "Ibn Rashiq al-Qayrawani — maître de la prose ornée et auteur d'al-Umda sur les vertus de la poésie; al-Qadi al-Fadil appréciait son discours, et il est cité par al-Imad dans le Kharida et par Ibn Bassam dans le Dhakhira {cite: wafayat-ayan}."
  ur: "ابن رشیق القیروانی - آرائشی نثر کے ماہر اور شاعری کے فضائل پر العمدہ کے مصنف؛ القدی الفاضل نے اپنی تقریر کو قدر کی نگاہ سے دیکھا، اور اسے العماد نے خردہ میں اور ابن بسام نے ذخیرہ میں نقل کیا ہے۔"
  tr: "Ebu Ali Hasan bin Raşik, namıdiğer el-Kayrawani, ünlü vaazların ve kafa karıştırıcı mektupların yazarı, bir düzyazı şövalyesiydi. Erdemli hakim, onun en çok sözlerini ezberlemeye dayandığını söylerdi. İmadeddin el-İsfahani onu el-Hurida'da, İbn Bassam ise el-Daxire'de anmıştır. Ayrıca 'Dilde Düzensizlik' adlı kitabı ve diğer eserleri de yazmıştır {atıf: wafayat-ayan}. Ayrıca 'Al-'Umdah fi Sina'at al-Shir wa Naqdihuh' (Yapı ve Eleştiri), 'Model ve Şiirsel Şair' (Muhammadiyah'da) gibi iyi eserler de yazdı. Babası bir Roma Memlük'ü ve Muhammadiyah'da kuyumcuydu. Orada edebiyat okudu ve şiir yazdı, sonra Kairouan'a seyahat etti, orada ünlü oldu, sahibini övdü ve hizmetinde kaldı. Araplar Kairuan'a saldırıp halkını öldürüp yok edene kadar orada kaldı. Sicilya adasına taşındı ve ölümüne kadar orada kaldı {atıf:shadharat-dhahab, s. 305-306}."
  id: "Abu Ali al-Hasan ibn Rashiq, yang dikenal sebagai al-Qayrawani, penulis khotbah terkenal dan surat-surat membingungkan, adalah seorang ksatria prosa. Hakim yang berbudi luhur mengatakan bahwa ketergantungannya utama adalah menghafal kata-katanya. Imad al-Din al-Isfahani menyebutnya dalam al-Khuridah dan Ibn Bassam dalam al-Dhakhira. Ia juga menulis buku 'Ketidakteraturan dalam Bahasa' dan karya-karya lainnya {cite:Wafayat-Ayan}. Ia juga menulis karya-karya baik, termasuk 'Al-'Umdah fi Sina'at al-Shir wa Naqdihuh' (Struktur dan Kritik), 'Model dan Penyair Puisi' dalam Muhammadiyah. Ayahnya adalah seorang Mamluk Romawi dan tukang emas di Muhammadiyah. Ia belajar sastra di sana dan menulis puisi, kemudian pergi ke Kairouan, menjadi terkenal di sana, memuji pemiliknya, dan tetap melayani Kairouan. Ia tetap di sana hingga bangsa Arab menyerang Kairouan, membunuh rakyatnya, dan menghancurkannya. Ia pindah ke pulau Sisilia dan tinggal di sana hingga wafat {cite:shadharat-dhahab, hlm. 305-306}."
