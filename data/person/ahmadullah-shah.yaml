summary:
  ar: "عالم وزعيم هندي (1787–1858)، عُرف بمولوي فيض آباد، وكان من أبرز قادة ثورة الهند سنة 1857 في منطقة أوده. طاف بمدن الهند يحرّض على الثورة قبل اندلاعها، وقاد المقاومة في لكناو وما حولها، ولم يتمكن البريطانيون من أسره حيًّا حتى قُتل عند شاه جهان بور سنة 1858."
  en: "Indian scholar and rebel leader (1787–1858), known as the Maulvi of Faizabad and a leading figure of the Indian Rebellion of 1857 in Awadh. He travelled between Indian cities preparing the rising before it broke out, led the resistance around Lucknow, and was never taken alive; he was killed at Shahjahanpur in 1858."
  ur: "ہندوستانی عالم اور رہنما (1787ء–1858ء)، جو مولوی فیض آباد کے نام سے مشہور ہوئے اور 1857ء کی جنگ آزادی میں اودھ کے مرکزی رہنما تھے۔ بغاوت سے پہلے وہ ہندوستان کے شہروں میں گھوم کر لوگوں کو تیار کرتے رہے، لکھنؤ کے اطراف میں مزاحمت کی قیادت کی، انگریز انھیں زندہ کبھی نہ پکڑ سکے، اور وہ 1858ء میں شاہجہان پور کے قریب مارے گئے۔"
