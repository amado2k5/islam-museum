summary:
  ar: "عالم إسلامي ماليزي، وُلد في 16 يناير 1969 في كمبونغ غونغ باوه بكيمان في ترنغانو. درس الشريعة في الجامعة الإسلامية بالمدينة المنورة ثم في دمشق ونال الدكتوراه من جامعة العلوم الماليزية. شغل منصب مفتي الأقاليم الاتحادية السابع من يونيو 2014 إلى مارس 2020، ثم وزيرًا في ديوان رئيس الوزراء للشؤون الدينية من مارس 2020 إلى أغسطس 2021، وعضوًا في مجلس الشيوخ حتى مارس 2023. بلغ حسابه الموثّق في إنستغرام 1,234,707 متابعين بحسب قراءة المنصة في 15 نوفمبر 2026."
  en: "Malaysian Islamic scholar, born on 16 January 1969 at Kampung Gong Pauh, Kemaman, Terengganu. He studied sharia at the Islamic University of Madinah and in Damascus and took his PhD at Universiti Sains Malaysia. He served as 7th Mufti of the Federal Territories from June 2014 to March 2020, then as Minister in the Prime Minister's Department for Religious Affairs from March 2020 to August 2021, and as Senator until March 2023. His verified Instagram counted 1,234,707 followers when the platform was read on 15 November 2026."
  ur: "ملائیشیا کے اسلامی عالم، جو 16 جنوری 1969ء کو ترنگانو کے کیمامان کے کامپونگ گونگ پاؤ میں پیدا ہوئے۔ انہوں نے جامعہ اسلامیہ مدینہ منورہ اور دمشق میں شریعت کی تعلیم حاصل کی اور یونیورسٹی سائنس ملائیشیا سے پی ایچ ڈی کیا۔ وہ جون 2014ء سے مارچ 2020ء تک وفاقی علاقوں کے ساتویں مفتی رہے، پھر مارچ 2020ء سے اگست 2021ء تک وزیرِ اعظم کے محکمے میں وزیرِ مذہبی امور رہے، اور مارچ 2023ء تک سینیٹر رہے۔ 15 نومبر 2026ء کی قرأت کے مطابق ان کے مصدقہ انسٹاگرام فالوور 1,234,707 تھے۔"
