summary:
  ar: "عالم إسلامي ماليزي، وُلد في 16 يناير 1969 في كمبونغ غونغ باوه بكيمان في ترنغانو. درس الشريعة في الجامعة الإسلامية بالمدينة المنورة ثم في دمشق ونال الدكتوراه من جامعة العلوم الماليزية. شغل منصب مفتي الأقاليم الاتحادية السابع من يونيو 2014 إلى مارس 2020، ثم وزيرًا في ديوان رئيس الوزراء للشؤون الدينية من مارس 2020 إلى أغسطس 2021، وعضوًا في مجلس الشيوخ حتى مارس 2023. بلغ حسابه الموثّق في إنستغرام 1,234,707 متابعين بحسب قراءة المنصة في 15 نوفمبر 2026."
  en: "Malaysian Islamic scholar, born on 16 January 1969 at Kampung Gong Pauh, Kemaman, Terengganu. He studied sharia at the Islamic University of Madinah and in Damascus and took his PhD at Universiti Sains Malaysia. He served as 7th Mufti of the Federal Territories from June 2014 to March 2020, then as Minister in the Prime Minister's Department for Religious Affairs from March 2020 to August 2021, and as Senator until March 2023. His verified Instagram counted 1,234,707 followers when the platform was read on 15 November 2026."
  ur: "ملائیشیا کے اسلامی عالم، جو 16 جنوری 1969ء کو ترنگانو کے کیمامان کے کامپونگ گونگ پاؤ میں پیدا ہوئے۔ انہوں نے جامعہ اسلامیہ مدینہ منورہ اور دمشق میں شریعت کی تعلیم حاصل کی اور یونیورسٹی سائنس ملائیشیا سے پی ایچ ڈی کیا۔ وہ جون 2014ء سے مارچ 2020ء تک وفاقی علاقوں کے ساتویں مفتی رہے، پھر مارچ 2020ء سے اگست 2021ء تک وزیرِ اعظم کے محکمے میں وزیرِ مذہبی امور رہے، اور مارچ 2023ء تک سینیٹر رہے۔ 15 نومبر 2026ء کی قرأت کے مطابق ان کے مصدقہ انسٹاگرام فالوور 1,234,707 تھے۔"
  es: "Erudito islámico malasio, nacido el 16 de enero de 1969 en Kampung Gong Pauh, Kemaman, Terengganu. Estudió sharia en la Universidad Islámica de Medina y en Damasco, y obtuvo su doctorado en la Universiti Sains Malaysia. Fue el séptimo Muftí de los Territorios Federales desde junio de 2014 hasta marzo de 2020, luego Ministro de Asuntos Religiosos en el Departamento del Primer Ministro desde marzo de 2020 hasta agosto de 2021, y Senador hasta marzo de 2023. Su cuenta verificada de Instagram contaba con 1.234.707 seguidores el 15 de noviembre de 2026."
  fr: "Érudit islamique malaisien, né le 16 janvier 1969 à Kampung Gong Pauh, Kemaman, Terengganu. Il a étudié la charia à l'Université islamique de Médine et à Damas, et obtenu son doctorat à l'Universiti Sains Malaysia. Il a été le 7e mufti des Territoires fédéraux de juin 2014 à mars 2020, puis ministre au sein du Département des affaires religieuses du Premier ministre de mars 2020 à août 2021, et enfin sénateur jusqu'en mars 2023. Son compte Instagram certifié comptait 1 234 707 abonnés lors de sa consultation le 15 novembre 2026."
  tr: "Malezyalı bir İslam alimi, 16 Ocak 1969'da Kampong Gong Bao, Keiman, Terengganu'da doğdu. Medine'deki İslam Üniversitesi'nde, ardından Şam'da Şeriat okudu ve doktorasını Malezya Bilim Üniversitesi'nden aldı. Haziran 2014'ten Mart 2020'ye kadar Federal Bölgeler'in yedinci müftüsü olarak görev yaptı, ardından Mart 2020'den Ağustos 2021'e kadar Başbakanlık Dini İşler Ofisi'nde Bakan ve Mart 2023'e kadar Senato üyesi olarak görev yaptı. Doğrulanmış Instagram hesabı, platformun 15 Kasım 2026 tarihli okumasına göre 1.234.707 takipçiye sahipti."
  id: "Seorang ulama Islam Malaysia, lahir pada 16 Januari 1969 di Kampong Gong Bao, Keiman, Terengganu. Ia belajar Syariah di Universitas Islam di Madinah, kemudian di Damaskus, dan meraih gelar PhD dari Universitas Sains Malaysia. Ia menjabat sebagai Mufti ketujuh Wilayah Federal dari Juni 2014 hingga Maret 2020, kemudian sebagai Menteri di Kantor Perdana Menteri untuk Urusan Agama dari Maret 2020 hingga Agustus 2021, dan sebagai anggota Senat hingga Maret 2023. Akun Instagram terverifikasinya memiliki 1.234.707 pengikut menurut pembacaan platform tersebut pada 15 November 2026."
