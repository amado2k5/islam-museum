summary:
  ar: "جغرافي ومؤلف معجمي، صاحب «معجم البلدان» و«معجم الأدباء» ⁦(إرشاد الأريب)⁩. أخذ من بلاد الروم صغيراً وابتاعه ببغداد رجل تاجر يعرف بعسكر الحموي وجعله في الكتاب لينتفع به في ضبط تجارته، ثم جرت بينهما نبوة أوجبت عتقه سنة ٥٩٦هـ فاشتغل بالنسخ بالأجرة ثم اتجر وكانت بعض تجارته كتباً؛ وتوجه إلى دمشق سنة ٦١٣هـ وناظر فيها فكادت العامة تقتله فهرب، فإلى الموصل فإربل فخراسان فصادف خروج التتار فانهزم من خوارزم «كبعثة يوم الحشر من رمسه» وقاسى ما يكل اللسان عن شرحه حتى استقر بظاهر حلب في كنف القفطي؛ وصنف «إرشاد الأريب إلى معرفة الأديب» و«معجم البلدان» و«معجم الشعراء» و«المشترك وضعاً والمختلف صقعاً» و«المبدأ والمعاد» و«المقتضب في النسب»؛ وأوقف كتبه على مسجد الزيدي بدرب دينار بغداد وسلمها إلى عز الدين بن الأثير، ولما تميز واشتهر سمى نفسه يعقوباً؛ توفي في الخان بظاهر حلب يوم الأحد ٢٠ رمضان ٦٢٦هـ/١٢ أغسطس ١٢٢٩م {cite:shadharat-dhahab p. 121-122} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264-266}."
  en: "A geographer and lexicographer, author of the Mujam al-Buldan and the Mujam al-Udaba' (Irshad al-Arib). Carried off young from Byzantine lands and sold in Baghdad to the merchant Askar al-Hamawi, who schooled him for his trade; a quarrel brought his manumission in 596, and he earned his living as a copyist before trading in books. In 613 a debate in Damascus nearly cost him his life; he fled to Mosul, Irbil and Khurasan, met the Mongol outbreak at Khwarazm and fled 'like one risen from his grave on Judgement Day', settling at last in a khan outside Aleppo under al-Qifti's patronage. His works include the Irshad al-Arib, the Mujam al-Buldan, the Mujam al-Shu'ara', al-Mushtarik, al-Mubda' wa-l-Ma'ad and al-Muqtadab fi-l-Nasab. He endowed his books to the Zaydi mosque at Darb Dinar in Baghdad, delivered through Izz al-Din ibn al-Athir, and once famous took the name Ya'qub. He died in the khan outside Aleppo on Sunday 20 Ramadan 626/12 August 1229 {cite:shadharat-dhahab p. 121-122} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264-266}."
  ur: "جغرافیہ دان اور معجمی، صاحب «معجم البلدان» اور «معجم الادباء» ⁦(ارشاد الاریب)⁩۔ بلاد روم سے بچپن میں پکڑا گیا اور بغداد میں تاجر عسکر حموی کو بکا جس نے تجارت کے لیے اسے تعلیم دلوائی؛ 596ھ میں جھگڑے پر آزاد ہوا اور نقل نویسی سے روزی کما کر کتابوں کی تجارت کرنے لگا۔ 613ھ میں دمشق کے مناظرے نے جان لینے پر ماری تو موصل، اربل اور خراسان بھاگا، خوارزم میں تاتاروں کا سامنا ہوا اور «قیامت کے دن اپنے قبرستان سے اٹھے شخص کی مانند» بچ نکلا، آخر میں حلب کے باہر خان میں قفطی کی سرپرستی میں ٹھہرا۔ تصانیف: ارشاد الاریب، معجم البلدان، معجم الشعراء، المشترک، المبدأ والمعاد اور المقتضب فی النسب۔ اپنی کتابیں بغداد کے درب دینار کے زیدی مسجد پر وقف کیں اور عز الدین ابن اثیر کے ذریعے پہنچوائیں؛ شہرت پر اپنا نام یعقوب رکھا۔ حلب کے باہر خان میں اتوار 20 رمضان 626ھ/12 اگست 1229ء کو فوت ہوا {cite:shadharat-dhahab p. 121-122} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264-266}۔"
  es: "Geógrafo y lexicógrafo, autor del Mujam al-Buldan y del Mujam al-Udaba' (Irshad al-Arib). Fue raptado de joven de tierras bizantinas y vendido en Bagdad al mercader Askar al-Hamawi, quien lo formó en su oficio. Una disputa le valió la manumisión en 596, y se ganó la vida como copista antes de dedicarse al comercio de libros. En 613, un debate en Damasco casi le costó la vida; huyó a Mosul, Erbil y Jorasán, se enfrentó al levantamiento mongol en Corasmia y huyó «como quien resucita de su tumba en el Día del Juicio Final», estableciéndose finalmente en un kan a las afueras de Alepo bajo el patrocinio de al-Qifti. Entre sus obras se incluyen el Irshad al-Arib, el Mujam al-Buldan, el Mujam al-Shu'ara', al-Mushtarik, al-Mubda' wa-l-Ma'ad y al-Muqtadab fi-l-Nasab. Donó sus libros a la mezquita zaidí de Darb Dinar en Bagdad, entregados a través de Izz al-Din ibn al-Athir, y en su momento adoptó el nombre de Ya'qub. Falleció en el khan a las afueras de Alepo el domingo 20 de Ramadán de 626/12 de agosto de 1229 {cite:shadharat-dhahab p. 121-122} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264-266}."
  fr: "Géographe et lexicographe, auteur du Mujam al-Buldan et du Mujam al-Udaba' (Irshad al-Arib), il fut enlevé très jeune des terres byzantines et vendu à Bagdad au marchand Askar al-Hamawi, qui l'initia au métier. Une querelle lui valut son affranchissement en 596, et il gagna sa vie comme copiste avant de se lancer dans le commerce de livres. En 613, une dispute à Damas faillit lui coûter la vie; il s'enfuit à Mossoul, Erbil et Khorasan, affronta l'invasion mongole à Khwarezm et s'enfuit « tel un ressuscité le jour du jugement », pour finalement s'installer dans un khan près d'Alep, sous la protection d'al-Qifti. Parmi ses œuvres figurent l'Irshad al-Arib, le Mujam al-Buldan, le Mujam al-Shu'ara', al-Mushtarik, al-Mubda' wa-l-Ma'ad et al-Muqtadab fi-l-Nasab. Il légua ses livres à la mosquée Zaydite de Darb Dinar à Bagdad, par l'intermédiaire d'Izz al-Din ibn al-Athir, et prit alors le nom de Ya'qub. Il mourut dans le khan près d'Alep le dimanche 20 Ramadan 626 (12 août 1229)."
  tr: "Coğrafyacı ve sözlükçü, 'Mu'jam al-Buldan' ve 'Mu'jam al-Udaba' (Irshad al-Areeb) kitaplarının yazarı. Onu çocukken Bizans topraklarından aldı ve Bağdat'ta Askar al-Hamawi adlı bir tüccar tarafından satın aldı; tüccar ticaretini kontrol etmekten faydalanmak için bunu bir kitapta sakladı. Sonra aralarındaki peygamberlik 596 Hicri'de özgürleşmesine yol açtı. Ücret karşılığında kopyacılık yaptı, sonra ticaret yaptı ve ticaretinin bir kısmı kitaptı. 613 Hicri'de Şam'a gitti ve orada savaştı; halk neredeyse onu öldürüyordu, bu yüzden kaçtı. Musul'a, sonra Erbil'e, ardından Horasan'a kaçtı; burada Tatarların yükselişiyle aynı zamana denk geldi ve \"Diriliş Günü görevi gibi\" Harezmi tarafından yenildi ve o kadar sertti ki, açıklamaktan yorulmadı ta ki Halep'in eteklerinde koruma altında yerleşene kadar kelimeler yorulmadı El-Kıfti; \"İrşad el-Eribila Ma'rifat el-Adib,\" \"Mücem el-Buldan,\" \"Mücem el-Şu'ara\", \"El-Müşadat ve Muhtalaf Saka'a\", \"El-Mebda' ve el-Medye' ve el-Muktâlâr el-Nesab\" adlı eserlerin yazarıdır. Kitaplarını Bağdat'taki Derb Dinar'daki Zeydi Camii'nde bağışladı ve onları İzzeddin bin el-Athir'e teslim etti. Ünlü ve seçkin olduğunda kendine Ya'qub adını verdi; 20 Ramazan 626 Hicri Pazar günü / 12 Ağustos 1229 yılında Halep yakınlarındaki Han'da öldü {alıntı: Shadharat-Dhahab s. 121-122} {Cite:Encyclopaedia-of-Islam-2 cilt 11 s. 264-266}."
  id: "Ahli geografi dan leksikografer, penulis 'Mu'jam al-Buldan' dan 'Mu'jam al-Udaba' (Irshad al-Areeb). Ia membawanya dari tanah Bizantium saat masih kecil dan membelinya di Baghdad oleh seorang pedagang bernama Askar al-Hamawi, yang menyimpannya dalam buku untuk mendapatkan keuntungan dari pengendalian perdagangannya. Kemudian pertukaran ramalan antara mereka membawanya pada pembebasannya pada tahun 596 H. Ia bekerja dalam penyalinan dengan bayaran, lalu berdagang, dan sebagian pekerjaannya adalah buku. Ia pergi ke Damaskus pada tahun 613 H dan bertempur di sana, di mana rakyat biasa hampir membunuhnya, sehingga ia melarikan diri. Ia melarikan diri ke Mosul, lalu Erbil, lalu Khurasan, di mana ia bertepatan dengan kebangkitan Tatar dan dikalahkan oleh Khwarezmi, \"seperti misi Hari Kebangkitan dari keberobatannya,\" dan ia begitu keras hingga kata-kata tidak bosan menjelaskan sampai ia menetap di pinggiran Aleppo di bawah perlindungan Al-Qifti; penulis \"Irshad al-Arib ila Ma'rifat al-Adib,\" \"Mu'jam al-Buldan,\" \"Mu'jam al-Shu'ara,\" \"Al-Musha'dat wa al-Mukhtalaf Saqa'a,\" \"Al-Mabda' wa al-Ma'ad,\" dan \"Al-Muqtadhab fi al-Nasab.\" Ia mengendasaikan buku-bukunya di Masjid Zaydi di Darb Dinar, Baghdad, dan menyerahkannya kepada Izz al-Din ibn al-Athir. Ketika ia menjadi terkenal dan terkenal, ia menamai dirinya Ya'qub; ia meninggal di Khan dekat Aleppo pada hari Minggu, 20 Ramadan 626 H / 12 Agustus 1229 M {cite: Shadharat-Dhahab hlm. 121-122} {Sitasi: Ensiklopedia-Dari-Islam-2 Vol. 11 hlm. 264-266}."
