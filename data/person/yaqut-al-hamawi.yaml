summary:
  ar: "جغرافي ومؤلف معجمي، صاحب «معجم البلدان» و«معجم الأدباء» ⁦(إرشاد الأريب)⁩. أخذ من بلاد الروم صغيراً وابتاعه ببغداد رجل تاجر يعرف بعسكر الحموي وجعله في الكتاب لينتفع به في ضبط تجارته، ثم جرت بينهما نبوة أوجبت عتقه سنة ٥٩٦هـ فاشتغل بالنسخ بالأجرة ثم اتجر وكانت بعض تجارته كتباً؛ وتوجه إلى دمشق سنة ٦١٣هـ وناظر فيها فكادت العامة تقتله فهرب، فإلى الموصل فإربل فخراسان فصادف خروج التتار فانهزم من خوارزم «كبعثة يوم الحشر من رمسه» وقاسى ما يكل اللسان عن شرحه حتى استقر بظاهر حلب في كنف القفطي؛ وصنف «إرشاد الأريب إلى معرفة الأديب» و«معجم البلدان» و«معجم الشعراء» و«المشترك وضعاً والمختلف صقعاً» و«المبدأ والمعاد» و«المقتضب في النسب»؛ وأوقف كتبه على مسجد الزيدي بدرب دينار بغداد وسلمها إلى عز الدين بن الأثير، ولما تميز واشتهر سمى نفسه يعقوباً؛ توفي في الخان بظاهر حلب يوم الأحد ٢٠ رمضان ٦٢٦هـ/١٢ أغسطس ١٢٢٩م {cite:shadharat-dhahab p. 121-122} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264-266}."
  en: "A geographer and lexicographer, author of the Mujam al-Buldan and the Mujam al-Udaba' (Irshad al-Arib). Carried off young from Byzantine lands and sold in Baghdad to the merchant Askar al-Hamawi, who schooled him for his trade; a quarrel brought his manumission in 596, and he earned his living as a copyist before trading in books. In 613 a debate in Damascus nearly cost him his life; he fled to Mosul, Irbil and Khurasan, met the Mongol outbreak at Khwarazm and fled 'like one risen from his grave on Judgement Day', settling at last in a khan outside Aleppo under al-Qifti's patronage. His works include the Irshad al-Arib, the Mujam al-Buldan, the Mujam al-Shu'ara', al-Mushtarik, al-Mubda' wa-l-Ma'ad and al-Muqtadab fi-l-Nasab. He endowed his books to the Zaydi mosque at Darb Dinar in Baghdad, delivered through Izz al-Din ibn al-Athir, and once famous took the name Ya'qub. He died in the khan outside Aleppo on Sunday 20 Ramadan 626/12 August 1229 {cite:shadharat-dhahab p. 121-122} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264-266}."
  ur: "جغرافیہ دان اور معجمی، صاحب «معجم البلدان» اور «معجم الادباء» ⁦(ارشاد الاریب)⁩۔ بلاد روم سے بچپن میں پکڑا گیا اور بغداد میں تاجر عسکر حموی کو بکا جس نے تجارت کے لیے اسے تعلیم دلوائی؛ 596ھ میں جھگڑے پر آزاد ہوا اور نقل نویسی سے روزی کما کر کتابوں کی تجارت کرنے لگا۔ 613ھ میں دمشق کے مناظرے نے جان لینے پر ماری تو موصل، اربل اور خراسان بھاگا، خوارزم میں تاتاروں کا سامنا ہوا اور «قیامت کے دن اپنے قبرستان سے اٹھے شخص کی مانند» بچ نکلا، آخر میں حلب کے باہر خان میں قفطی کی سرپرستی میں ٹھہرا۔ تصانیف: ارشاد الاریب، معجم البلدان، معجم الشعراء، المشترک، المبدأ والمعاد اور المقتضب فی النسب۔ اپنی کتابیں بغداد کے درب دینار کے زیدی مسجد پر وقف کیں اور عز الدین ابن اثیر کے ذریعے پہنچوائیں؛ شہرت پر اپنا نام یعقوب رکھا۔ حلب کے باہر خان میں اتوار 20 رمضان 626ھ/12 اگست 1229ء کو فوت ہوا {cite:shadharat-dhahab p. 121-122} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264-266}۔"
