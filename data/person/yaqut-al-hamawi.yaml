summary:
  ar: "جغرافي ومؤلف معجمي، صاحب «معجم البلدان» و«معجم الأدباء». أخذ من بلاد الروم صغيراً وابتاعه ببغداد رجل تاجر يعرف بعسكر الحموي وجعله في الكتاب لينتفع به في ضبط تجارته، ثم جرت بينهما نبوة أوجبت عتقه فاشتغل بالنسخ بالأجرة ثم اتجر وكانت بعض تجارته كتباً؛ وتوجه إلى دمشق سنة ثلاث عشرة وناظر بعض المتعصبين لعلي حتى ذكره بما لا يسوغ فثار عليه الناس ثورة كادوا يقتلونه فهرب، فإلى الموصل فإربل فخراسان فصادف خروج التتار فانهزم من خوارزم «كبعثة يوم الحشر من رمسه» وقاسى ما يكل اللسان عن شرحه حتى استقر بظاهر حلب؛ وصنف «إرشاد الأريب إلى معرفة الأديب» في أربع مجلدات و«معجم البلدان» و«معجم الأدباء» و«معجم الشعراء» و«المشترك وضعاً والمختلف صقعاً» و«المبدأ والمعاد» و«المقتضب في النسب»؛ وكان قد أوقف كتبه على مسجد الزيدي بدرب دينار بغداد وسلمها إلى عز الدين بن الأثير، ولما تميز واشتهر سمى نفسه يعقوباً {cite:shadharat-dhahab p. 121-122}."
  en: "A geographer and lexicographer, author of Mu'jam al-Buldan and Mu'jam al-Udaba'. Sold young from Byzantine lands to a Baghdad merchant who freed him; he copied books for hire, traded in them, fled Damascus in 613 when a defence of Ali nearly cost his life, then fled the Tatars at Khwarazm 'like one risen from his grave on Judgement Day', settling outside Aleppo. His books he endowed to the Zaydi mosque at Darb Dinar, Baghdad, delivered to Ibn al-Athir himself; late in life he took the name Ya'qub {cite:shadharat-dhahab p. 121-122}."
