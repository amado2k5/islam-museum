summary:
  ar: "إمام وقائد مجتمعي أسترالي، وُلد في سيدني سنة 1978 لأسرة فلسطينية هاجرت إلى أستراليا في أواخر الستينيات. مؤسس «مسلمي أستراليا المتحدين» وكلية سيدني الإسلامية، ورئيس المجلس الوطني للأئمة في أستراليا منذ 2016 بعد أن كان أمينه العام، ومُدرج في قائمة «المسلمون 500». أتم حفظ القرآن بإجازة بالسند في السند بباكستان، ودرس ست سنوات في دمشق متخصصًا في العربية والفقه المقارن."
  en: "An Australian imam and community leader, born in Sydney in 1978 to a Palestinian family that had migrated to Australia in the late 1960s. He is the founder of the United Muslims of Australia and Sydney Islamic College, and has been president of the Australian National Imams Council since 2016 after serving as its secretary; he is listed in The Muslim 500. He received an ijazah with sanad in complete memorisation of the Qur'an in Sindh, Pakistan, and spent six years studying in Damascus, specialising in Arabic and comparative fiqh."
  ur: "آسٹریلوی امام اور سماجی رہنما، 1978 میں سڈنی میں ایک فلسطینی خاندان میں پیدا ہوئے جو 1960 کی دہائی کے آخر میں آسٹریلیا ہجرت کر گیا تھا۔ یونائیٹڈ مسلمز آف آسٹریلیا اور سڈنی اسلامک کالج کے بانی، اور آسٹریلین نیشنل امامز کونسل کے سیکرٹری رہنے کے بعد 2016 سے اس کے صدر؛ «دی مسلم 500» میں شامل۔ انہوں نے سندھ، پاکستان میں سند کے ساتھ قرآن حفظ کی اجازت حاصل کی اور دمشق میں چھ سال عربی اور فقہِ مقارن کی تخصصی تعلیم حاصل کی۔"
