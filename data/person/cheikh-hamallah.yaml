summary:
  ar: "شيخ صوفي مالي (ح. 1883–1943)، تلميذ الشيخ التيجاني سيدي محمد الأخضر وخليفته على رأس طريقة «الأحد عشر حبة»، ومؤسس الفرع المعروف بالحماوية أو الحمالية من الطريقة التيجانية في مالي وموريتانيا. تمركز في نيورو بالساحل، فلاحقته الإدارة الاستعمارية الفرنسية بالنفي المتكرر — إلى موريتانيا ثم ساحل العاج ثم فرنسا — وتوفي في منفاه بمونلوسون سنة 1943، وأخفت السلطات خبر وفاته عن أتباعه حتى نهاية الحرب."
  en: "Malian Sufi shaykh (c. 1883–1943), disciple of the Tijani shaykh Sidi Mohamed Lakhdar and his successor at the head of the “eleven grains” branch, and founder of the branch of the Tijaniyyah known as the Hamawiyya or Hamallayya in Mali and Mauritania. Based at Nioro in the Sahel, he was repeatedly exiled by the French colonial administration — to Mauritania, then Côte d'Ivoire, then France — and died in exile at Montluçon in 1943; the authorities kept his death secret from his followers until the end of the war."
  ur: "مالی کے صوفی شیخ (تقریباً 1883–1943)، تیجانی شیخ سیدی محمد الاخضر کے شاگرد اور «گیارہ دانوں» والی شاخ کے سربراہ کے طور پر ان کے جانشین، اور مالی و موریطانیہ میں تیجانیہ کی اس شاخ کے بانی جو حماویہ یا حمالیہ کے نام سے مشہور ہوئی۔ نیورو کو مرکز بنا کر وہ فرانسیسی نوآبادیاتی انتظامیہ کے بار بار جلاوطنی کے احکام کا نشانہ بنے — پہلے موریطانیہ، پھر آئیوری کوسٹ، پھر فرانس — اور 1943 میں مونلوسون میں جلاوطنی ہی میں وفات پائی؛ انتظامیہ نے ان کی وفات کی خبر جنگ کے اختتام تک ان کے پیروکاروں سے چھپائے رکھی۔"
