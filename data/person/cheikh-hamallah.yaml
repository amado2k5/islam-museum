    note: "Two independent article texts attest his personal Tijani affiliation, in discipleship and not in headship alone. The English article calls him 'the first disciple of a Tijaniyyah reformer and mystic Shaykh Sidi Mohamed Lakhdar' and 'the spiritual leader of a militant reform movement of the powerful Tijaniyyah sufi tariqah, which has popularly taken his name, as Hamallayya'. The French article calls him the founder of a branch of the Tijani Sufi brotherhood (the Hamawiyya) and narrates his succession to Sidi Mohammed Lakhdar — who had himself been charged by a companion of Ahmad Tijani with extending the tariqa in West Africa — at the head of its 'eleven grains' practice. On those two texts his personal membership of the Tijaniyyah is documented, and the value sufi is recorded. No source read names a madhhab for him, and neither Wikidata item records any religion value at all, so no second segment is recorded."
