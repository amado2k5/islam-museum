  - { value: "تاج الدين أبو منصور عبد العزيز بن ثابت بن طاهر البغدادي المأموني السمعي الخياط المقرئ الفقيه الحنبلي الزاهد", kind: full }
summary:
  ar: "تاج الدين أبو منصور عبد العزيز بن ثابت البغدادي المأموني السمعي — نسبة إلى السمع بن مالك بطن من الأنصار — الخياط المقرئ الفقيه الحنبلي الزاهد؛ قال أبو الفرج بن الحنبلي كان رفيقنا في سماع درس ابن المنى، وبلغ من الزهد والعبادة إلى حد يقال به تمسك بغداد، وكان لطيفاً في صحبته؛ توفي يوم الأربعاء تاسع عشري شعبان سنة ست وتسعين ودفن بباب حرب {cite:shadharat-dhahab p. 807}."
  en: "Taj al-Din Abu Mansur Abd al-Aziz b. Thabit al-Baghdadi al-Sam'i — of al-Sam' b. Malik's clan of the Ansar — the tailor, muqri', Hanbali jurist and ascetic; Abu al-Faraj Ibn al-Hanbali, his companion in Ibn al-Mani's lessons, said his zuhd and worship reached the height at which it is said 'by him Baghdad holds fast', and he was gentle in company; he died Wednesday 19 Sha'ban 596 and was buried at Bab Harb {cite:shadharat-dhahab p. 807}."
