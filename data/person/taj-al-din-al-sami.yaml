names:
  - { value: "تاج الدين أبو منصور عبد العزيز بن ثابت بن طاهر البغدادي المأموني السمعي الخياط المقرئ الفقيه الحنبلي الزاهد", kind: full }
summary:
  ar: "تاج الدين أبو منصور عبد العزيز بن ثابت البغدادي المأموني السمعي — نسبة إلى السمع بن مالك بطن من الأنصار — الخياط المقرئ الفقيه الحنبلي الزاهد؛ قال أبو الفرج بن الحنبلي كان رفيقنا في سماع درس ابن المنى، وبلغ من الزهد والعبادة إلى حد يقال به تمسك بغداد، وكان لطيفاً في صحبته؛ توفي يوم الأربعاء تاسع عشري شعبان سنة ست وتسعين ودفن بباب حرب {cite:shadharat-dhahab p. 807}."
  en: "Taj al-Din Abu Mansur Abd al-Aziz b. Thabit al-Baghdadi al-Sam'i — of al-Sam' b. Malik's clan of the Ansar — the tailor, muqri', Hanbali jurist and ascetic; Abu al-Faraj Ibn al-Hanbali, his companion in Ibn al-Mani's lessons, said his zuhd and worship reached the height at which it is said 'by him Baghdad holds fast', and he was gentle in company; he died Wednesday 19 Sha'ban 596 and was buried at Bab Harb {cite:shadharat-dhahab p. 807}."
  es: "Taj al-Din Abu Mansur Abd al-Aziz b. Thabit al-Baghdadi al-Sam'i — del clan de al-Sam' b. Malik de los Ansar — el sastre, muqri', jurista hanbalí y asceta; Abu al-Faraj Ibn al-Hanbali, su compañero en las lecciones de Ibn al-Mani, dijo que su zuhd y adoración alcanzaron el nivel en el que se dice 'por él Bagdad se mantiene firme', y era gentil en compañía; murió el miércoles 19 de Sha'ban de 596 y fue enterrado en Bab Harb {cite:shadharat-dhahab p. 807}."
  fr: "Taj al-Din Abu Mansur Abd al-Aziz b. Thabit al-Baghdadi al-Sam'i — du clan d'al-Sam' b. Malik des Ansar — le tailleur, muqri', juriste hanbalite et ascète; Abu al-Faraj Ibn al-Hanbali, son compagnon dans les leçons d'Ibn al-Mani, a dit que son zuhd et son culte atteignirent le sommet auquel on dit « par lui Bagdad tient bon », et il était doux en compagnie; il mourut le mercredi 19 Sha'ban 596 et fut enterré à Bab Harb {cite:shadharat-dhahab p. 807}."
  ur: "تاج الدین ابو منصور عبد العزیز ثابت البغدادی السمعی - السام ب کا۔ مالک کا قبیلہ انصار - درزی، مقری، حنبلی فقیہ اور سنیاسی؛ ابو الفراج ابن الحنبلی، ابن المنی کے اسباق میں ان کے ساتھی، کہتے ہیں کہ ان کی زہد اور عبادت اس بلندی پر پہنچ گئی جس پر کہا جاتا ہے کہ 'ان کے نزدیک بغداد مضبوط ہے'، اور وہ صحبت میں نرم مزاج تھے۔ ان کا انتقال بدھ 19 شعبان 596 کو ہوا اور انہیں باب حرب میں دفن کیا گیا۔ 807}۔"
  tr: "Taceddin Ebu Mensur Abdülaziz ibn Tebit el-Bağdadi el-Ma'muni el-Sam'i — terzi, şiyetçi, hukukçu, Hanbali ve münzevi olan el-Sam ibn Malik'in adını taşır; Ebu el-Faraj ibn el-Hanbali şöyle demiştir: Ebu el-Faraj bin el-Hanbali, İbn el-Mina'nın derslerini dinlemede bizim yoldaşımızdı, Bağdat'a bağlı olduğu söylenir. Yanında nazikti; doksan altıncı H yılında, Şaban'ın on dokuzuncusu Çarşamba günü vefat etti ve Bab Harb'a defnedildi {atıf:shadharat-dhahab, s. 807}."
  id: "Taj al-Din Abu Mansur Abdul Aziz ibn Thabit al-Baghdadi al-Ma'muni al-Sam'i — dinamai menurut al-Sam' ibn Malik, cabang Ansar — penjahit, pembaca, ahli hukum, Hanbali, dan pertapa yang berbicara; Abu al-Faraj ibn al-Hanbali berkata: Abu al-Faraj ibn al-Hanbali adalah teman kita mendengarkan pelajaran Ibn al-Mina, mencapai tingkat pertapa dan pemujaan hingga dikatakan ia setia kepada Baghdad. Ia lembut dalam kebersamaannya; ia meninggal pada hari Rabu, tanggal 19 Sha'ban, tahun sembilan puluh enam H, dan dimakamkan di Bab Harb {cite:shadharat-dhahab, hlm. 807}."
