summary:
  ar: "عباد بن زياد؛ غزا ثغر الهند من سجستان فأتى سناروذ وكش وقطع المفازة وفتح القندهار بعد أن أصيب رجال من المسلمين ورأى قلانس أهلها طوالاً فعمل على مثالها فسميت العبادية."
  en: "Abbad ibn Ziyad; from Sijistan he crossed the mafaza and stormed Qandahar — and the tall caps of its folk became the 'Abbadiyya."
  fr: "Abbad ibn Ziyad ; depuis le Sijistan il traversa la mafaza et prit d'assaut Qandahar — et les hauts bonnets de ses habitants devinrent les « Abbadiyya »."
  es: "Abbad ibn Ziyad; desde Sijistan cruzó el mafaza y asaltó Qandahar, y los altos gorros de su gente se convirtieron en los 'Abbadiyya."
  ur: "عباد بن زیاد؛ سجستان سے اس نے مفازہ کو عبور کیا اور قندھار پر حملہ کیا - اور اس کے لوگوں کی لمبی ٹوپیاں 'عبادیہ' بن گئیں۔"
