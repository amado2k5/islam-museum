summary:
  ar: "عبد الله بن عبد الملك بن مروان الأموي؛ عند البلاذري: غزا على الصائفة سنة 84 فدخل من درب أنطاكية وأتى المصيصة فبنى حصنها على أساسه القديم ووضع بها سكاناً من الجند فيهم ثلاثمائة رجل منتخب من ذوي البأس وبنى مسجداً فوق تل الحصن، ثم سار في جيشه حتى غزا حصن سنان ففتحه ووجّه يزيد بن حنين الطائي الأنطاكي فأغار."
  en: "Abdullah ibn Abd al-Malik ibn Marwan the Umayyad; in al-Baladhuri: he led the summer raid of year 84, entering by the Antioch pass and coming to Masisa where he built the fortress on its ancient foundation, settling garrison troops among them three hundred picked men of known valour and building a mosque on the fortress hill, then marched on to take the fortress of Sinan and sent Yazid ibn Hunayn al-Ta'i al-Antaki raiding before returning."
