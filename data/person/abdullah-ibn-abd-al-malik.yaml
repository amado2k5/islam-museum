id: person/abdullah-ibn-abd-al-malik
class: person
label: { ar: "عبد الله بن عبد الملك", en: "Abdullah ibn Abd al-Malik", fr: "Abdullah ibn Abd al-Malik", es: "Abdullah ibn Abd al-Malik", ur: "عبداللہ بن عبد الملک" }
summary:
  ar: "عبد الله بن عبد الملك بن مروان الأموي؛ عند البلاذري: غزا على الصائفة سنة 84 فدخل من درب أنطاكية وأتى المصيصة فبنى حصنها على أساسه القديم ووضع بها سكاناً من الجند فيهم ثلاثمائة رجل منتخب من ذوي البأس وبنى مسجداً فوق تل الحصن، ثم سار في جيشه حتى غزا حصن سنان ففتحه ووجّه يزيد بن حنين الطائي الأنطاكي فأغار."
  en: "Abdullah ibn Abd al-Malik ibn Marwan the Umayyad; in al-Baladhuri: he led the summer raid of year 84, entering by the Antioch pass and coming to Masisa where he built the fortress on its ancient foundation, settling garrison troops among them three hundred picked men of known valour and building a mosque on the fortress hill, then marched on to take the fortress of Sinan and sent Yazid ibn Hunayn al-Ta'i al-Antaki raiding before returning."
  fr: "Abdullah ibn Abd al-Malik ibn Marwan l'Omeyyade ; chez al-Baladhuri : il mena l'expédition d'été de l'an 84, entra par le défilé d'Antioche et vint à Massisa, où il bâtit la forteresse sur ses anciennes fondations, y installant une garnison dont trois cents hommes choisis pour leur bravoure reconnue et bâtissant une mosquée sur la colline de la forteresse, puis poursuivit sa marche pour prendre la forteresse de Sinan et envoya Yazid ibn Hunayn al-Ta'i al-Antaki en expédition avant de rentrer."
  es: "Abdullah ibn Abd al-Malik ibn Marwan el Omeya; en al-Baladhuri: dirigió la incursión de verano del año 84, entrando por el paso de Antioquía y llegando a Masisa donde construyó la fortaleza sobre sus cimientos antiguos, estableciendo tropas de guarnición entre ellas trescientos hombres escogidos de conocido valor y construyendo una mezquita en la colina de la fortaleza, luego marchó para tomar la fortaleza de Sinan y envió a Yazid ibn Hunayn al-Ta'i al-Antaki a realizar incursiones antes de regresar."
  ur: "عبداللہ بن عبد الملک بن مروان اموی؛ البلادوری میں: اس نے سن 84 کے موسم گرما کے چھاپے کی قیادت کی، انطاکیہ کے راستے سے داخل ہوا اور مسیسا آیا جہاں اس نے اس کی قدیم بنیاد پر قلعہ تعمیر کیا، ان کے درمیان تین سو چنے ہوئے بہادر فوجیوں کو آباد کیا اور قلعہ کی پہاڑی پر ایک مسجد تعمیر کی، پھر سنان کے قلعے پر قبضہ کرنے کے لیے روانہ کیا اور الطنین ینصیقین کو بھیجا۔ واپسی سے پہلے چھاپہ مارنا۔"
  tr: "Abdullah bin Abdul Malik bin Mervan el-Umavi; El-Baladhuri'ye göre: 84 yılının yazında bir baskın düzenledi, Antakya yolundan girerek Mesise'ye geldi, eski temeli üzerine bir kale inşa etti ve oraya askerlerden oluşan, aralarında cesurlar arasından seçilmiş üç yüz kişi de bulunan bir birlik yerleştirdi. Kalenin tepesinin üzerine bir cami inşa etti, sonra ordusuyla Sinan kalesine baskın düzenleyene kadar yürüdü, kaleyi açtı ve Yazid bin Huneyn el-Ta'i el-Antaki'yi gönderdi, o da baskın düzenledi."
  id: "Abdullah bin Abdul Malik bin Marwan Al-Umawi; menurut Al-Baladhuri: Dia menyerang pada musim panas tahun 84, lalu dia masuk dari jalan Antiokhia dan sampai ke Al-Masisa, lalu dia membangun bentengnya di atas fondasi lamanya dan menempatkan penduduk di sana dari kalangan tentara, di antaranya tiga ratus orang yang dipilih dari antara orang-orang pemberani, dan dia membangun sebuah masjid di atas bukit benteng, kemudian dia berbaris dengan pasukannya sampai dia menyerang benteng Sinan, lalu dia membukanya, dan dia mengirim Yazid bin Hunain Al-Ta’i Al-Antaki, lalu dia menyerang."
