summary:
  ar: "الملك الأوحد أيوب بن الملك العادل أبي بكر بن أيوب؛ تملك مدينة خلاط سنة أربع وستمائة بعد حرب جرت بينه وبين صاحبها بليان ثم قتل بليان بعد ذلك، وملكها نحو خمس سنين وكان ظلوماً سفاكاً لدماء الأمراء؛ مات في ربيع الأول سنة تسع وستمائة {cite:shadharat-dhahab p. 20, 45}."
  en: "Al-Malik al-Awhad Ayyub, son of al-Malik al-Adil Abu Bakr b. Ayyub; he took the city of Akhlat in 604 after a war with its lord Bilyan, whom he then had killed, and ruled it about five years — a wrongdoer who shed the amirs' blood; he died in Rabi' I 609 {cite:shadharat-dhahab p. 20, 45}."
  es: "Al-Malik al-Awhad Ayyub, hijo de al-Malik al-Adil Abu Bakr b. Ayyub; tomó la ciudad de Akhlat en 604 después de una guerra con su señor Bilyan, a quien luego mandó matar, y la gobernó durante unos cinco años; un malhechor que derramó la sangre de los emires; murió en Rabi' I 609 {cita:shadharat-dhahab p. 20, 45}."
  fr: "Al-Malik al-Awhad Ayyub, fils d'al-Malik al-Adil Abu Bakr b. Ayyub; il prit la ville d'Akhlat en 604 après une guerre contre son seigneur Bilyan, qu'il avait ensuite tué, et la gouverna pendant environ cinq ans — un malfaiteur qui versa le sang des émirs; il mourut en Rabi' I 609 {cite:shadharat-dhahab p. 20, 45}."
  ur: "الملک العواد ایوب ولد الملک العادل ابوبکر بن۔ ایوب; اس نے 604 میں اخلت شہر کو اپنے آقا بلیان کے ساتھ جنگ کے بعد لے لیا، جسے اس نے پھر قتل کر دیا تھا، اور اس پر تقریباً پانچ سال حکومت کی - ایک ظالم جس نے امیروں کا خون بہایا۔ آپ کی وفات ربیع الثانی 609 میں ہوئی۔ 20، 45}۔"
