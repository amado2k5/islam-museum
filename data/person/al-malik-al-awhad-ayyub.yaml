summary:
  ar: "الملك الأوحد أيوب بن الملك العادل أبي بكر بن أيوب؛ تملك مدينة خلاط سنة أربع وستمائة بعد حرب جرت بينه وبين صاحبها بليان ثم قتل بليان بعد ذلك، وملكها نحو خمس سنين وكان ظلوماً سفاكاً لدماء الأمراء؛ مات في ربيع الأول سنة تسع وستمائة {cite:shadharat-dhahab p. 20, 45}."
  en: "Al-Malik al-Awhad Ayyub, son of al-Malik al-Adil Abu Bakr b. Ayyub; he took the city of Akhlat in 604 after a war with its lord Bilyan, whom he then had killed, and ruled it about five years — a wrongdoer who shed the amirs' blood; he died in Rabi' I 609 {cite:shadharat-dhahab p. 20, 45}."
