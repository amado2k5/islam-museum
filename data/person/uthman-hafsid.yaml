summary:
  ar: عثمان بن محمد بن عزوز الهنتاتي الحفصي، أبو عمرو، من ملوك الدولة الحفصية بتونس، بويع سنة 839 هـ بعد أخيه المنتصر وتلقب بالمتوكل على الله، وهو آخر من انتظم له الملك من بني حفص، وحكم أربعا وخمسين سنة ونصف سنة، وتوفي بتونس سنة 893 هـ الموافقة 1488 م.
  en: Uthman ibn Muhammad ibn Azzuz al-Hintati al-Hafsi, Abu Amr, king of the Hafsid state at Tunis; acknowledged in 839 AH after his brother al-Muntasir, taking the title al-Mutawakkil ala Allah; the last of the Banu Hafs to hold the kingship in unbroken order, ruling fifty-four and a half years; died in Tunis in 893 AH (1488 CE).
