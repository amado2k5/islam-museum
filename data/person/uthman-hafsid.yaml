label:
  ar: أبو عمرو عثمان بن محمد المنصور الحفصي
  en: Uthman, Hafsid caliph
  es: "Uthman, Hafsid caliph"
  fr: "Uthman, Hafsid caliph"
  ur: "عثمان، حفصید خلیفہ"
roles:
- ruler
gender: male
summary:
  ar: عثمان بن محمد بن عزوز الهنتاتي الحفصي، أبو عمرو، من ملوك الدولة الحفصية بتونس، بويع سنة 839 هـ بعد أخيه المنتصر وتلقب بالمتوكل على الله، وهو آخر من انتظم له الملك من بني حفص، وحكم أربعا وخمسين سنة ونصف سنة، وتوفي بتونس سنة 893 هـ الموافقة 1488 م.
  en: Uthman ibn Muhammad ibn Azzuz al-Hintati al-Hafsi, Abu Amr, king of the Hafsid state at Tunis; acknowledged in 839 AH after his brother al-Muntasir, taking the title al-Mutawakkil ala Allah; the last of the Banu Hafs to hold the kingship in unbroken order, ruling fifty-four and a half years; died in Tunis in 893 AH (1488 CE).
  es: "Uthman ibn Muhammad ibn Azzuz al-Hintati al-Hafsi, Abu Amr, rey del estado Hafsid en Túnez; reconocido en 839 AH después de su hermano al-Muntasir, tomando el título de al-Mutawakkil ala Allah; el último de los Banu Hafs en mantener el trono de forma ininterrumpida, gobernando cincuenta y cuatro años y medio; murió en Túnez en 893 AH (1488 d. C.)."
  fr: "Uthman ibn Muhammad ibn Azzuz al-Hintati al-Hafsi, Abu Amr, roi de l'État hafside à Tunis; reconnu en 839 AH après son frère al-Muntasir, prenant le titre d'al-Mutawakkil ala Allah; le dernier des Banu Hafs à détenir la royauté sans interruption, régnant pendant cinquante-quatre ans et demi; mort à Tunis en 893 AH (1488 CE)."
  ur: "عثمان بن محمد بن عزوز الحنطی الحفصی، ابو عمرو، تیونس میں حفصی ریاست کا بادشاہ؛ 839ھ میں اپنے بھائی المنتصر کے بعد المتوکل الا اللہ کا لقب اختیار کیا۔ بنو حفص میں سے آخری جس نے اٹوٹ ترتیب سے بادشاہی سنبھالی، ساڑھے 54 سال حکومت کی۔ تیونس میں 893ھ ⁦(1488ء)⁩ میں وفات پائی۔"
