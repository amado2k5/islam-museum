summary:
  ar: "أبو الفتح محمد بن عبيد الله بن عبد الله الكاتب، المعروف بابن التعاويذي؛ الشاعر المشهور؛ كان أبوه مولى لابن المظفر واسمه نشتكين وهو سبط أبي محمد المبارك بن المبارك بن علي بن نصر السراج الجوهري الزاهد المعروف بابن التعاويذي وإنما نُسب إلى جده لأنه فُقد صغيراً ونشأ في حجره؛ قال ابن خلكان: كان شاعر وقته لم يكن فيه مثله، جمع شعره بين جزالة الألفاظ وعذوبتها ورقة المعاني ودقتها وهو في غاية الحسن والحلاوة، وفي اعتقادي لم يكن قبله بمائتي سنة من يضاهيه؛ كان كاتباً في ديوان المقاطعات ببغداد وعمي في آخر عمره سنة تسع وسبعين وخمسمائة وكان قد جمع ديوانه بنفسه قبل العمى وعمل له خطبة طريفة ورتبه أربعة فصول؛ ولما عمي التمس من الإمام الناصر لدين الله راتباً فأنعم عليه به {cite:wafayat-ayan}."
  en: "Abu al-Fath Ibn al-Ta'awidhi (d. 553) — the Baghdadi katib-poet whom Ibn Khallikan judged unrivalled for two hundred years; katib of the diwan al-Muqata'at, went blind in 579 after compiling his own four-part diwan; grandfather of Sibt Ibn al-Ta'awidhi {cite:wafayat-ayan}."
