summary:
  ar: "وردان مولى عمرو بن العاص صاحب سوق وردان بمصر؛ يُقال هو الموجّه إلى قرى أسفل الأرض مكان عتبة بن عامر، وكتب إليه معاوية أن زد على كل امرئ من القبط قيراطاً فكتب إليه كيف أزيد عليهم وفي عهدهم أن لا يزاد عليهم."
  en: "Wardan, Amr ibn al-As's mawla and lord of Egypt's Suq Wardan; some say it was he — not Utba ibn Amir — who was sent to lower Egypt's villages; Mu'awiya wrote to him 'add a qirat on every Copt', and he wrote back 'how can I add upon them when their covenant says nothing shall be added upon them?'."
