id: person/wardan-mawla-amr
class: person
label: { ar: "وردان مولى عمرو", en: "Wardan, Amr's Mawla", es: "Wardan, Amr's Mawla", fr: "Wardan, Amr's Mawla", ur: "وردان، عمرو کا مولا" }
summary:
  ar: "وردان مولى عمرو بن العاص صاحب سوق وردان بمصر؛ يُقال هو الموجّه إلى قرى أسفل الأرض مكان عتبة بن عامر، وكتب إليه معاوية أن زد على كل امرئ من القبط قيراطاً فكتب إليه كيف أزيد عليهم وفي عهدهم أن لا يزاد عليهم. وهو غلام عمرو بن العاص الذي احترز به معاوية في خدعة الطعام المشهورة: أمر بأن يشبع موالي عمرو فيقوموا فيقعد مكانهم مواليه حتى إذا أغلق الباب خير عمرو بين بيعته وبين قتله، فطلب عمرو أن يشاور وردان فأبى معاوية أن يراه إلا قتيلاً، فقال عمرو فالوفاء إذن بطعمة مصر قال هي لك ما عشت {cite:muruj-al-dhahab p. 691-692}"
  en: "Wardan, Amr ibn al-As's mawla and lord of Egypt's Suq Wardan; some say it was he — not Utba ibn Amir — who was sent to lower Egypt's villages; Mu'awiya wrote to him 'add a qirat on every Copt', and he wrote back 'how can I add upon them when their covenant says nothing shall be added upon them?'."
  es: "Wardan, mawla de Amr ibn al-As y señor del zoco Wardan de Egipto; algunos dicen que fue él —y no Utba ibn Amir— quien fue enviado a las aldeas del Bajo Egipto; Mu'awiya le escribió: «Añade un qirat a cada copto», y él respondió: «¿Cómo puedo añadirles algo cuando su pacto dice que no se les añadirá nada?»."
  fr: "Wardan, le mawla d'Amr ibn al-As et seigneur du souk de Wardan en Égypte; certains disent que c'est lui — et non Utba ibn Amir — qui fut envoyé dans les villages de Basse-Égypte; Mu'awiya lui écrivit: « ajoute une qirat à chaque Copte », et il répondit: « comment puis-je leur en ajouter alors que leur alliance dit qu'aucune somme ne doit leur être ajoutée ? »."
  ur: "وردان، عمرو بن العاص کا مولا اور مصر کے سق وردان کا آقا؛ بعض کہتے ہیں کہ یہ وہ تھا - عتبہ بن عامر نہیں - جسے مصر کے دیہاتوں میں بھیجا گیا تھا۔ معاویہ نے اسے لکھا کہ 'ہر قبطی پر ایک قیراط کا اضافہ کرو'، اور اس نے واپس لکھا کہ 'میں ان پر کیسے اضافہ کروں جب کہ ان کا عہد یہ ہے کہ ان پر کوئی اضافہ نہیں کیا جائے گا؟'۔"
  tr: "Amr ibn al-As'ın özgür adamı, Mısır'daki Wardan pazarının sahibi; Utbah ibn Amir'in yerinde yeraltı köylerine gönderilen kişinin kendisi olduğu söylenir. Muawiya ona her Kıpti erkeğine bir qirat ekleyeceğini yazdı ve Muawiya ona hükümdarlıkları sırasında nasıl artırılacağını yazdı. O, Muawiya'nın ünlü yiyecek aldatmacasında kullandığı Amr ibn al-As'ın hizmetkarıydı: Amr'in özgür bırakılanlarının memnun edilmesini emretti, böylece onlar kalkacak, kendi özgür adamları yerlerine geçecekti. Kapı kapandığında, Amr bağlılık yemini etmekle onu öldürmek arasında seçim yaptı. Amr Wardan'a danışmak istedi, ancak Muawiya onu sadece ölü olarak görmeyi reddetti. Amr, 'Sadakat Mısır'ın tadıdır.' dedi. 'Yaşadığın sürece senin içindir.' dedi. {alıntı:Muruj-al-Dhahab, s. 691-692}"
  id: "Wardan, mantan Amr ibn al-As, pemilik pasar Wardan di Mesir; konon dialah yang dikirim ke desa-desa di bawah tanah di tempat Utbah ibn Amir. Muawiya menulis kepadanya bahwa ia akan menambah qirat kepada setiap orang Koptik, dan ia menulis bagaimana cara menambah mereka selama masa pemerintahan mereka agar tidak bertambah. Ia adalah pelayan Amr ibn al-As, yang telah dimanfaatkan Muawiya dalam penipuan makanan terkenal: ia memerintahkan agar para mantan Amr dipuaskan agar mereka bangkit dan para merdeka miliknya mengambil tempat. Ketika pintu tertutup, Amr memilih antara bersumpah setia atau membunuhnya. Amr meminta untuk berkonsultasi dengan Wardan, tetapi Muawiya menolak melihatnya kecuali sebagai orang mati. Amr berkata, 'Kesetiaan adalah selera Mesir.' Ia berkata, 'Itu untukmu selama kau hidup.' {cite:muruj-al-dhahab, hlm. 691-692}"
