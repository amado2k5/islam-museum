label: { ar: "المكتفي بالله" }
summary:
  ar: "خليفة عباسي كانت خلافته ست سنين وتسعة عشر يوماً، وتوفي في سنة خمس وتسعين ومائتين، ودُفن في دار محمد بن عبد الله بن طاهر {cite:tabari-tarikh-abu-al-fadl j.11 p.27}، وعند السيوطي ولد في غرة ربيع الآخر سنة أربع وستين وأمه تركية اسمها جيجك وكان يضرب بحسنه المثل، وعهد له أبوه فبويع يوم الجمعة لإحدى عشرة بقيت من ربيع الآخر سنة تسع وثمانين وكان بالرقة فنهض بأعباء البيعة الوزير القاسم بن عبيد الله ووافى بغداد في سابع جمادى الأولى، وهدم المطامير التي اتخذها أبوه وصيرها مساجد ورد البساتين والحوانيت التي أخذها أبوه إلى أهلها وسار سيرة جميلة فأحبه الناس، وقال في علته ما آسى إلا على سبع مئة ألف دينار صرفتها من مال المسلمين في أبنية ما احتجت إليها ومات شاباً ليلة الأحد لاثنتي عشرة خلت من ذي القعدة سنة خمس وتسعين {cite:tarikh-khulafa-minhaj-1434 p. 581-583}. وعند المسعودي مات وقد خلف في بيوت الأموال ثمانية آلاف ألف دينار وخمسة وعشرين ألف ألف درهم وتسعة آلاف رأس من الدواب وكان مع ذلك بخيلاً ضيقاً، وكانت وظيفته عشرة ألوان في كل يوم وجدي في كل جمعة، ووكل على مائدته من يحصي ما فضل من الخبز فالصحاح ترد من الغد والمكسر للثريد، وأمر باتخاذ قصر بالشماسية بازاء قطربل فأخذ ضياعاً ومزارع بغير ثمن فكثر الداعي عليه فلم يستتم البناء حتى توفي {cite:muruj-al-dhahab p. 638-639}، وعند المسعودي اشتدت علته بالذرب فأحضر محمد بن يوسف القاضي وعبد الله بن علي بن أبي الشوارب فأشهدهما على وصيته بالعهد إلى أخيه جعفر، وكان يحفظ قول ابن الرومي في اللوزينج اذا بدا أعجب أو عجبا وينشدها، ومن شعره إنما العيش ساعة أنت فيها وما انقضت {cite:muruj-al-dhahab p. 645-648}، وذكر ابن النديم أن ملكة الفرنجة كتبت إليه كتاباً في حرير أبيض تخطب صداقته وتطلب التزويج به وأنفذته مع خادم وقع إلى بلدها من جهة المغرب اسمه علي من خدم ابن الأغلب {cite:fihrist-ibn-al-nadim p. 45}، وعند ابن الجوزي ولما استخلف سنة 295هـ نزل القصر وأمر بهدم المطامير وأن يجعل موضعها مسجداً جامعاً فاستقرت الصلاة في الجوامع الثلاثة وفي يوم دخوله القصر الحسني كني بلسانه القاسم بن عبيد الله وخلع عليه ست خلع وقلده سيفاً وحمل على فرس لجامه وسرجه من ذهب {cite:muntazam-ibn-al-jawzi p. 341}"
