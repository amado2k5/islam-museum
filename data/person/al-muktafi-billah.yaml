label: { ar: "المكتفي بالله", en: "al-Muktafi bi-Allah" }
summary:
  ar: "خليفة عباسي كانت خلافته ست سنين وتسعة عشر يوماً، وتوفي في سنة خمس وتسعين ومائتين، ودُفن في دار محمد بن عبد الله بن طاهر {cite:tabari-tarikh-abu-al-fadl j.11 p.27}، وعند السيوطي ولد في غرة ربيع الآخر سنة أربع وستين وأمه تركية اسمها جيجك وكان يضرب بحسنه المثل، وعهد له أبوه فبويع يوم الجمعة لإحدى عشرة بقيت من ربيع الآخر سنة تسع وثمانين وكان بالرقة فنهض بأعباء البيعة الوزير القاسم بن عبيد الله ووافى بغداد في سابع جمادى الأولى، وهدم المطامير التي اتخذها أبوه وصيرها مساجد ورد البساتين والحوانيت التي أخذها أبوه إلى أهلها وسار سيرة جميلة فأحبه الناس، وقال في علته ما آسى إلا على سبع مئة ألف دينار صرفتها من مال المسلمين في أبنية ما احتجت إليها ومات شاباً ليلة الأحد لاثنتي عشرة خلت من ذي القعدة سنة خمس وتسعين {cite:tarikh-khulafa-minhaj-1434 p. 581-583}. وعند المسعودي مات وقد خلف في بيوت الأموال ثمانية آلاف ألف دينار وخمسة وعشرين ألف ألف درهم وتسعة آلاف رأس من الدواب وكان مع ذلك بخيلاً ضيقاً، وكانت وظيفته عشرة ألوان في كل يوم وجدي في كل جمعة، ووكل على مائدته من يحصي ما فضل من الخبز فالصحاح ترد من الغد والمكسر للثريد، وأمر باتخاذ قصر بالشماسية بازاء قطربل فأخذ ضياعاً ومزارع بغير ثمن فكثر الداعي عليه فلم يستتم البناء حتى توفي {cite:muruj-al-dhahab p. 638-639}، وعند المسعودي اشتدت علته بالذرب فأحضر محمد بن يوسف القاضي وعبد الله بن علي بن أبي الشوارب فأشهدهما على وصيته بالعهد إلى أخيه جعفر، وكان يحفظ قول ابن الرومي في اللوزينج اذا بدا أعجب أو عجبا وينشدها، ومن شعره إنما العيش ساعة أنت فيها وما انقضت {cite:muruj-al-dhahab p. 645-648}، وذكر ابن النديم أن ملكة الفرنجة كتبت إليه كتاباً في حرير أبيض تخطب صداقته وتطلب التزويج به وأنفذته مع خادم وقع إلى بلدها من جهة المغرب اسمه علي من خدم ابن الأغلب {cite:fihrist-ibn-al-nadim p. 45}، وعند ابن الجوزي ولما استخلف سنة 295هـ نزل القصر وأمر بهدم المطامير وأن يجعل موضعها مسجداً جامعاً فاستقرت الصلاة في الجوامع الثلاثة وفي يوم دخوله القصر الحسني كني بلسانه القاسم بن عبيد الله وخلع عليه ست خلع وقلده سيفاً وحمل على فرس لجامه وسرجه من ذهب {cite:muntazam-ibn-al-jawzi p. 341} وعند ابن الجوزي أخذت البيعة له بالخلافة من بعد أبيه على الناس ببغداد عشية يوم الجمعة لإحدى عشرة ليلة بقيت من ربيع الآخر سنة تسع وثمانين قبل موت المعتضد بأربعة أيام، وكان بالرقة فأخذ البيعة على من عنده ثم انحدر إلى بغداد فوافاها يوم الاثنين لثمان خلون من جمادى الأولى، ووضع القاسم بن عبيد الله في الجند العطاء وأخذ عليهم البيعة وكان في بيت المال عشرة آلاف ألف دينار وجوهر قيمته عشرة آلاف ألف دينار غير الآلات والخيل، وكان يوم بُويع ابن خمس وعشرين سنة وستة أشهر وعشرين يومًا {cite:muntazam-ibn-al-jawzi p. 323-324}."
  en: "Abbasid caliph whose caliphate lasted six years and nineteen days; he died in 295 and was buried in the house of Muhammad ibn Abd Allah ibn Tahir {cite:tabari-tarikh-abu-al-fadl j.11 p.27}. According to al-Suyuti, he was born on 1 Rabi' II 264; his mother was a Turkish woman called Jijak, and his beauty was proverbial. His father named him heir, and he was pledged allegiance on the Friday eleven days before the end of Rabi' II 289, while he was at Raqqa. The vizier al-Qasim ibn Ubayd Allah took up the burden of the oath, and he reached Baghdad on 7 Jumada I. He demolished the dungeons his father had built and turned them into mosques, returned the gardens and shops his father had seized to their owners, and governed well, so the people loved him. In his last illness he said: 'I regret nothing but the seven hundred thousand dinars I spent of the Muslims' money on buildings I did not need.' He died young, on the night of Sunday, twelve days into Dhu al-Qa'da 295 {cite:tarikh-khulafa-minhaj-1434 p. 581-583}. According to al-Mas'udi, he left eight million dinars and twenty-five million dirhams in the treasuries, and nine thousand head of livestock, yet he was stingy and close-fisted. His daily table had ten dishes, and a kid every Friday; someone was set to count the leftover bread, sound loaves were returned the next day and broken pieces went into crumbled bread. He ordered a palace built at al-Shammasiyya opposite Qatrabbul and took estates and farms without payment, so many prayed against him, and he died before the building was finished {cite:muruj-al-dhahab p. 638-639}. According to al-Mas'udi, when his illness grew severe with dysentery he summoned the judge Muhammad ibn Yusuf and Abd Allah ibn Ali ibn Abi al-Shawarib and had them witness his bequest of the succession to his brother Ja'far. He used to recite Ibn al-Rumi's line on the lauzinaj sweet, 'when it appears, you are amazed or wonder', and among his own verses is 'Life is only the hour you are in, and what has passed' {cite:muruj-al-dhahab p. 645-648}. Ibn al-Nadim reports that the queen of the Franks wrote to him on white silk, seeking his friendship and asking to marry him, and sent the letter with a servant named Ali, one of Ibn al-Aghlab's servants, who had reached her land from the Maghrib {cite:fihrist-ibn-al-nadim p. 45}. According to Ibn al-Jawzi, when he came to the caliphate (dated 295 in this account) he went down to the palace and ordered the dungeons demolished and the site made a congregational mosque, so that prayer was established in the three great mosques. On the day he entered the Hasani palace, al-Qasim ibn Ubayd Allah was given a kunya by word of mouth, put into six robes of honour, given a sword, and mounted on a horse whose bridle and saddle were gold {cite:muntazam-ibn-al-jawzi p. 341}. Also according to Ibn al-Jawzi, the oath of allegiance to him after his father was taken from the people of Baghdad on the Friday evening eleven nights before the end of Rabi' II 289, four days before al-Mu'tadid died; he was at Raqqa, took the oath from those there, then came down to Baghdad, arriving on Monday, eight days into Jumada I. He put al-Qasim ibn Ubayd Allah in charge of the soldiers' stipends and took the oath from them. The treasury held ten million dinars and jewels worth ten million dinars, apart from equipment and horses. He was twenty-five years, six months and twenty days old when he was pledged allegiance {cite:muntazam-ibn-al-jawzi p. 323-324}."
