label: { ar: "المكتفي بالله" }
summary:
  ar: "خليفة عباسي كانت خلافته ست سنين وتسعة عشر يوماً، وتوفي في سنة خمس وتسعين ومائتين، ودُفن في دار محمد بن عبد الله بن طاهر {cite:tabari-tarikh-abu-al-fadl j.11 p.27}، وعند السيوطي ولد في غرة ربيع الآخر سنة أربع وستين وأمه تركية اسمها جيجك وكان يضرب بحسنه المثل، وعهد له أبوه فبويع يوم الجمعة لإحدى عشرة بقيت من ربيع الآخر سنة تسع وثمانين وكان بالرقة فنهض بأعباء البيعة الوزير القاسم بن عبيد الله ووافى بغداد في سابع جمادى الأولى، وهدم المطامير التي اتخذها أبوه وصيرها مساجد ورد البساتين والحوانيت التي أخذها أبوه إلى أهلها وسار سيرة جميلة فأحبه الناس، وقال في علته ما آسى إلا على سبع مئة ألف دينار صرفتها من مال المسلمين في أبنية ما احتجت إليها ومات شاباً ليلة الأحد لاثنتي عشرة خلت من ذي القعدة سنة خمس وتسعين {cite:tarikh-khulafa-minhaj-1434 p. 581-583}."
