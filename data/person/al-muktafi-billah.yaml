id: person/al-muktafi-billah
education:
  did_you_know:
    ar: "المكتفي بالله خليفة عباسي دامت خلافته ست سنين وتسعة عشر يوماً وتوفي سنة ٢٩٥هـ ودُفن في دار محمد بن عبد الله بن طاهر."
    en: "Al-Muktafi bi'llah, the Abbasid caliph whose reign lasted six years and nineteen days, died in 295 AH and was buried in the house of Muhammad ibn Abd Allah ibn Tahir."
    ur: "مکتفی باللہ، عباسی خلیفہ جس کی خلافت چھ برس اور انیس دن رہی، 295ھ میں فوت ہوا اور محمد بن عبداللہ بن طاہر کے گھر میں دفن ہوا۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/tarikh-khulafa-minhaj-1434]
class: person
label: { ar: "المكتفي بالله", en: "al-Muktafi bi-Allah", fr: "al-Muktafi bi-Allah", es: "al-Muktafi bi-Allah", ur: "المکتفی باللہ" }
summary:
  ar: "خليفة عباسي كانت خلافته ست سنين وتسعة عشر يوماً، وتوفي في سنة خمس وتسعين ومائتين، ودُفن في دار محمد بن عبد الله بن طاهر {cite:tabari-tarikh-abu-al-fadl j.11 p.27}، وعند السيوطي ولد في غرة ربيع الآخر سنة أربع وستين وأمه تركية اسمها جيجك وكان يضرب بحسنه المثل، وعهد له أبوه فبويع يوم الجمعة لإحدى عشرة بقيت من ربيع الآخر سنة تسع وثمانين وكان بالرقة فنهض بأعباء البيعة الوزير القاسم بن عبيد الله ووافى بغداد في سابع جمادى الأولى، وهدم المطامير التي اتخذها أبوه وصيرها مساجد ورد البساتين والحوانيت التي أخذها أبوه إلى أهلها وسار سيرة جميلة فأحبه الناس، وقال في علته ما آسى إلا على سبع مئة ألف دينار صرفتها من مال المسلمين في أبنية ما احتجت إليها ومات شاباً ليلة الأحد لاثنتي عشرة خلت من ذي القعدة سنة خمس وتسعين {cite:tarikh-khulafa-minhaj-1434 p. 581-583}. وعند المسعودي مات وقد خلف في بيوت الأموال ثمانية آلاف ألف دينار وخمسة وعشرين ألف ألف درهم وتسعة آلاف رأس من الدواب وكان مع ذلك بخيلاً ضيقاً، وكانت وظيفته عشرة ألوان في كل يوم وجدي في كل جمعة، ووكل على مائدته من يحصي ما فضل من الخبز فالصحاح ترد من الغد والمكسر للثريد، وأمر باتخاذ قصر بالشماسية بازاء قطربل فأخذ ضياعاً ومزارع بغير ثمن فكثر الداعي عليه فلم يستتم البناء حتى توفي {cite:muruj-al-dhahab p. 638-639}، وعند المسعودي اشتدت علته بالذرب فأحضر محمد بن يوسف القاضي وعبد الله بن علي بن أبي الشوارب فأشهدهما على وصيته بالعهد إلى أخيه جعفر، وكان يحفظ قول ابن الرومي في اللوزينج اذا بدا أعجب أو عجبا وينشدها، ومن شعره إنما العيش ساعة أنت فيها وما انقضت {cite:muruj-al-dhahab p. 645-648}، وذكر ابن النديم أن ملكة الفرنجة كتبت إليه كتاباً في حرير أبيض تخطب صداقته وتطلب التزويج به وأنفذته مع خادم وقع إلى بلدها من جهة المغرب اسمه علي من خدم ابن الأغلب {cite:fihrist-ibn-al-nadim p. 45}، وعند ابن الجوزي ولما استخلف سنة 295هـ نزل القصر وأمر بهدم المطامير وأن يجعل موضعها مسجداً جامعاً فاستقرت الصلاة في الجوامع الثلاثة وفي يوم دخوله القصر الحسني كني بلسانه القاسم بن عبيد الله وخلع عليه ست خلع وقلده سيفاً وحمل على فرس لجامه وسرجه من ذهب {cite:muntazam-ibn-al-jawzi p. 341} وعند ابن الجوزي أخذت البيعة له بالخلافة من بعد أبيه على الناس ببغداد عشية يوم الجمعة لإحدى عشرة ليلة بقيت من ربيع الآخر سنة تسع وثمانين قبل موت المعتضد بأربعة أيام، وكان بالرقة فأخذ البيعة على من عنده ثم انحدر إلى بغداد فوافاها يوم الاثنين لثمان خلون من جمادى الأولى، ووضع القاسم بن عبيد الله في الجند العطاء وأخذ عليهم البيعة وكان في بيت المال عشرة آلاف ألف دينار وجوهر قيمته عشرة آلاف ألف دينار غير الآلات والخيل، وكان يوم بُويع ابن خمس وعشرين سنة وستة أشهر وعشرين يومًا {cite:muntazam-ibn-al-jawzi p. 323-324}."
  en: "Abbasid caliph whose caliphate lasted six years and nineteen days; he died in 295 and was buried in the house of Muhammad ibn Abd Allah ibn Tahir {cite:tabari-tarikh-abu-al-fadl j.11 p.27}. According to al-Suyuti, he was born on 1 Rabi' II 264; his mother was a Turkish woman called Jijak, and his beauty was proverbial. His father named him heir, and he was pledged allegiance on the Friday eleven days before the end of Rabi' II 289, while he was at Raqqa. The vizier al-Qasim ibn Ubayd Allah took up the burden of the oath, and he reached Baghdad on 7 Jumada I. He demolished the dungeons his father had built and turned them into mosques, returned the gardens and shops his father had seized to their owners, and governed well, so the people loved him. In his last illness he said: 'I regret nothing but the seven hundred thousand dinars I spent of the Muslims' money on buildings I did not need.' He died young, on the night of Sunday, twelve days into Dhu al-Qa'da 295 {cite:tarikh-khulafa-minhaj-1434 p. 581-583}. According to al-Mas'udi, he left eight million dinars and twenty-five million dirhams in the treasuries, and nine thousand head of livestock, yet he was stingy and close-fisted. His daily table had ten dishes, and a kid every Friday; someone was set to count the leftover bread, sound loaves were returned the next day and broken pieces went into crumbled bread. He ordered a palace built at al-Shammasiyya opposite Qatrabbul and took estates and farms without payment, so many prayed against him, and he died before the building was finished {cite:muruj-al-dhahab p. 638-639}. According to al-Mas'udi, when his illness grew severe with dysentery he summoned the judge Muhammad ibn Yusuf and Abd Allah ibn Ali ibn Abi al-Shawarib and had them witness his bequest of the succession to his brother Ja'far. He used to recite Ibn al-Rumi's line on the lauzinaj sweet, 'when it appears, you are amazed or wonder', and among his own verses is 'Life is only the hour you are in, and what has passed' {cite:muruj-al-dhahab p. 645-648}. Ibn al-Nadim reports that the queen of the Franks wrote to him on white silk, seeking his friendship and asking to marry him, and sent the letter with a servant named Ali, one of Ibn al-Aghlab's servants, who had reached her land from the Maghrib {cite:fihrist-ibn-al-nadim p. 45}. According to Ibn al-Jawzi, when he came to the caliphate (dated 295 in this account) he went down to the palace and ordered the dungeons demolished and the site made a congregational mosque, so that prayer was established in the three great mosques. On the day he entered the Hasani palace, al-Qasim ibn Ubayd Allah was given a kunya by word of mouth, put into six robes of honour, given a sword, and mounted on a horse whose bridle and saddle were gold {cite:muntazam-ibn-al-jawzi p. 341}. Also according to Ibn al-Jawzi, the oath of allegiance to him after his father was taken from the people of Baghdad on the Friday evening eleven nights before the end of Rabi' II 289, four days before al-Mu'tadid died; he was at Raqqa, took the oath from those there, then came down to Baghdad, arriving on Monday, eight days into Jumada I. He put al-Qasim ibn Ubayd Allah in charge of the soldiers' stipends and took the oath from them. The treasury held ten million dinars and jewels worth ten million dinars, apart from equipment and horses. He was twenty-five years, six months and twenty days old when he was pledged allegiance {cite:muntazam-ibn-al-jawzi p. 323-324}."
  fr: "Le calife abbasside dont le califat a duré six ans et dix-neuf jours ; il est mort en 295 et a été enterré dans la maison de Muhammad ibn Abd Allah ibn Tahir {cite:tabari-tarikh-abu-al-fadl j.11 p.27}. Selon al-Suyuti, il est né le 1 Rabi II 264 ; sa mère était une femme turque appelée Jijak, et sa beauté était proverbiale. Son père l'a nommé héritier, et il a été prêté allégeance le vendredi onze jours avant la fin de Rabi II 289, alors qu'il était à Raqqa. Le vizir al-Qasim ibn Ubayd Allah prit le fardeau du serment, et il atteignit Bagdad le 7 Jumada I. Il démolit les donjons que son père avait construits et les transforma en mosquées, rendit les jardins et les magasins que son père avait saisis à leurs propriétaires, et bien gouverné, de sorte que les gens l'aimaient. Durant sa dernière maladie, il dit  : « Je ne regrette que les sept cent mille dinars que j’ai pris sur l’argent des musulmans pour des bâtiments dont je n’avais pas besoin.  » Il mourut jeune, dans la nuit du dimanche, le 12 dhou al-qa‘da 295 {cite:tarikh-khulafa-minhaj-1434 p. 581-583}. Selon al-Mas'udi, il a laissé huit millions de dinars et vingt-cinq millions de dirhams dans les trésors, et neuf mille têtes de bétail, mais il était avare et serré. Sa table quotidienne avait dix plats, et un enfant chaque vendredi ; quelqu'un était prêt à compter les restes de pain, des pains sains étaient retournés le lendemain et des morceaux cassés allaient dans du pain émietté. Il a ordonné un palais construit à al-Shammasiyya en face de Qatrabbul et a pris des domaines et des fermes sans paiement, tant prié contre lui, et il est mort avant que le bâtiment a été terminé {cite:muruj-al-dhahab p. 638-639}. Selon al-Mas'udi, lorsque sa maladie s'est aggravée avec la dysenterie, il a convoqué le juge Muhammad ibn Yusuf et Abd Allah ibn Ali ibn Abi al-Shawarib et leur a fait témoigner son legs de la succession à son frère Ja'far. Il avait l'habitude de réciter la ligne d'Ibn al-Rumi sur le doux lauzinaj, « quand il apparaît, vous êtes étonné ou étonné », et parmi ses propres versets est « la vie est seulement l'heure où vous êtes, et ce qui est passé » {cite:muruj-al-dhahab p. 645-648}. Ibn al-Nadim rapporte que la reine des Francs lui a écrit sur de la soie blanche, cherchant son amitié et demandant à l'épouser, et a envoyé la lettre à un serviteur nommé Ali, l'un des serviteurs d'Ibn al-Aghlab, qui avait atteint son pays depuis le Maghreb {cite:fihrist-ibn-al-nadim p. 45}. Selon Ibn al-Jawzi, quand il est venu au califat (daté de 295 dans ce récit), il est descendu au palais et a ordonné que les donjons soient démolis et que le site fasse une mosquée congrégationnelle, de sorte que la prière a été établie dans les trois grandes mosquées. Le jour où il est entré dans le palais Hasani, al-Qasim ibn Ubayd Allah a reçu une kunya de bouche à oreille, mis dans six robes d'honneur, donné une épée, et monté sur un cheval dont la bride et la selle étaient en or {cite:muntazam-ibn-al-jawzi p. 341}. Toujours selon Ibn al-Jawzi, le serment d'allégeance à lui après que son père a été pris du peuple de Bagdad le vendredi soir onze nuits avant la fin de Rabi 'II 289, quatre jours avant al-Mu'tadid est mort ; Il était à Raqqa, a prêté serment auprès de ceux qui étaient là, puis est descendu à Bagdad, arrivant lundi, huit jours après Jumada I. Il a mis al-Qasim ibn Ubayd Allah en charge des allocations des soldats et leur a prêté serment. Le trésor contenait dix millions de dinars et des bijoux d'une valeur de dix millions de dinars, en dehors de l'équipement et des chevaux. Il avait vingt-cinq ans, six mois et vingt jours quand on lui a prêté allégeance {cite:muntazam-ibn-al-jawzi p. 323-324}."
  es: "Califa abasí cuyo califato duró seis años y diecinueve días; murió en 295 y fue enterrado en la casa de Muhammad ibn Abd Allah ibn Tahir {cite:tabari-tarikh-abu-al-fadl j.11 p.27}. Según al-Suyuti, nació el 1 de Rabi' II de 264; su madre era una mujer turca llamada Jijak, y su belleza era proverbial. Su padre lo nombró heredero, y juró lealtad el viernes once días antes del final de Rabi' II de 289, mientras se encontraba en Raqqa. El visir al-Qasim ibn Ubayd Allah asumió la carga del juramento, y llegó a Bagdad el 7 de Jumada I. Demolió las mazmorras que su padre había construido y las convirtió en mezquitas, devolvió los jardines y tiendas que su padre había confiscado a sus dueños, y gobernó bien, por lo que el pueblo lo amaba. En su última enfermedad dijo: 'No me arrepiento de nada excepto de los setecientos mil dinares que gasté del dinero de los musulmanes en edificios que no necesitaba'. Murió joven, la noche del domingo, doce días después del inicio de Dhu al-Qa'da 295 {cite:tarikh-khulafa-minhaj-1434 p. 581-583}. Según al-Mas'udi, dejó ocho millones de dinares y veinticinco millones de dirhams en los tesoros, y nueve mil cabezas de ganado, sin embargo, era tacaño y avaro. Su mesa diaria tenía diez platos, y un cabrito cada viernes; alguien se encargaba de contar el pan sobrante, los panes en buen estado se devolvían al día siguiente y los trozos rotos se convertían en pan desmenuzado. Ordenó construir un palacio en al-Shammasiyya frente a Qatrabbul y tomó propiedades y granjas sin pago, por lo que muchos oraron contra él, y murió antes de que se terminara el edificio {cite:muruj-al-dhahab p. 638-639}. Según al-Mas'udi, cuando su enfermedad se agravó con disentería, convocó al juez Muhammad ibn Yusuf y a Abd Allah ibn Ali ibn Abi al-Shawarib y les pidió que fueran testigos de su legado de sucesión a su hermano Ja'far. Solía recitar el verso de Ibn al-Rumi sobre el dulce lauzinaj, 'cuando aparece, te asombras o te maravillas', y entre sus propios versos está 'La vida es solo la hora en la que estás, y lo que ha pasado' {cite:muruj-al-dhahab p. 645-648}. Ibn al-Nadim relata que la reina de los francos le escribió en seda blanca, buscando su amistad y pidiéndole matrimonio, y envió la carta con un sirviente llamado Ali, uno de los sirvientes de Ibn al-Aghlab, que había llegado a su tierra desde el Magreb {cite:fihrist-ibn-al-nadim p. 45}. Según Ibn al-Jawzi, cuando llegó al califato (fechado en 295 en este relato) bajó al palacio y ordenó demoler las mazmorras y convertir el sitio en una mezquita congregacional, de modo que se estableció la oración en las tres grandes mezquitas. El día que entró en el palacio Hasani, a al-Qasim ibn Ubayd Allah se le dio una kunya de palabra, se le vistió con seis túnicas de honor, se le dio una espada y se le montó en un caballo cuya brida y silla eran de oro {cite:muntazam-ibn-al-jawzi p. 341}. También según Ibn al-Jawzi, el juramento de lealtad a él después de su padre fue tomado por la gente de Bagdad la noche del viernes once noches antes del final de Rabi' II 289, cuatro días antes de la muerte de al-Mu'tadid; Estuvo en Raqqa, tomó juramento a los presentes y luego se dirigió a Bagdad, llegando el lunes, ocho días después del inicio del Jumada I. Puso a al-Qasim ibn Ubayd Allah a cargo de las asignaciones de los soldados y les tomó juramento. El tesoro contenía diez millones de dinares y joyas por valor de diez millones de dinares, además de equipo y caballos. Tenía veinticinco años, seis meses y veinte días cuando juró lealtad {cite:muntazam-ibn-al-jawzi p. 323-324}."
  ur: "عباسی خلیفہ جس کی خلافت چھ سال اور انیس دن رہی۔ آپ کی وفات 295 میں ہوئی اور آپ کو محمد بن عبد اللہ ابن طاہر کے گھر میں دفن کیا گیا۔ سیوطی کے مطابق آپ کی ولادت یکم ربیع الثانی 264ء کو ہوئی۔ اس کی والدہ ایک ترک خاتون تھیں جن کا نام جیجک تھا، اور اس کی خوبصورتی ضرب المثل تھی۔ ان کے والد نے انہیں وارث نامزد کیا، اور ربیع الثانی 289 کے اختتام سے گیارہ دن قبل جمعہ کو ان سے بیعت کی گئی، جب وہ رقہ میں تھے۔ وزیر القاسم بن عبید اللہ نے بیعت کا بوجھ اٹھایا اور وہ 7 جمادی الثانی کو بغداد پہنچے، اس نے اپنے والد کے بنائے ہوئے عقوبت خانوں کو مسمار کر کے انہیں مساجد میں تبدیل کر دیا، ان کے والد نے جو باغات اور دکانیں غصب کی تھیں انہیں واپس کر دیا، اور اچھی طرح حکومت کی، اس لیے لوگوں نے ان سے محبت کی۔ اپنی آخری بیماری میں اس نے کہا: 'مجھے ان سات لاکھ دینار کے علاوہ کسی چیز کا افسوس نہیں ہے جو میں نے مسلمانوں کے پیسے میں سے ان عمارتوں پر خرچ کیے جن کی مجھے ضرورت نہیں تھی۔' آپ کا انتقال جوانی میں ہوا، اتوار کی رات، بارہ دن ذی القعدہ 295۔ 581-583}۔ المسعودی کے مطابق اس نے خزانوں میں آٹھ ملین دینار اور پچیس ملین درہم اور نو ہزار مویشی چھوڑے، پھر بھی وہ کنجوس اور بند مٹھی والا تھا۔ اس کی روزانہ کی میز پر دس برتن ہوتے تھے، اور ہر جمعہ کو ایک بچہ۔ کسی کو بچ جانے والی روٹیوں کو گننے کے لیے مقرر کیا گیا، دوسرے دن آواز والی روٹیاں واپس کر دی گئیں اور ٹوٹے ہوئے ٹکڑے ٹوٹی ہوئی روٹی میں چلے گئے۔ اس نے قطربل کے بالمقابل الشمسیہ میں ایک محل تعمیر کرنے کا حکم دیا اور بغیر معاوضے کے جائدادیں اور کھیتی باڑی لے لی، بہت سے لوگوں نے اس کے خلاف دعائیں کیں اور عمارت کے مکمل ہونے سے پہلے ہی اس کی موت ہوگئی۔ 638-639}۔ المسعودی کے مطابق جب اس کی بیماری پیچش کے ساتھ شدید ہوگئی تو اس نے قاضی محمد بن یوسف اور عبد اللہ ابن علی ابن ابی الشواریب کو بلایا اور ان سے اپنے بھائی جعفر کی جانشینی کی وصیت کی گواہی دی۔ وہ لوزیناج میٹھی پر ابن رومی کی سطر پڑھا کرتے تھے، 'جب یہ ظاہر ہوتا ہے تو آپ حیران ہوتے ہیں'، اور ان کی اپنی آیات میں 'زندگی صرف وہ گھڑی ہے جس میں آپ ہیں، اور جو گزر چکا ہے'۔ 645-648}۔ ابن الندیم بیان کرتے ہیں کہ فرانکس کی ملکہ نے سفید ریشم پر اسے لکھا، اس سے دوستی کی درخواست کی اور اس سے شادی کی درخواست کی، اور یہ خط ابن الغلب کے خادموں میں سے ایک علی نامی نوکر کے پاس بھیجا، جو مغرب سے اس کی سرزمین پر پہنچا تھا۔ 45}۔ ابن الجوزی کے مطابق، جب وہ خلافت میں آیا ⁦(اس کی تاریخ 295)⁩ تو وہ محل میں گیا اور عقوبت خانوں کو گرانے کا حکم دیا اور اس جگہ پر ایک با جماعت مسجد بنائی، اس طرح تین بڑی مساجد میں نماز قائم ہوئی۔ جس دن وہ حسنی محل میں داخل ہوا، قاسم بن عبید اللہ کو منہ بولا کنیہ دیا گیا، عزت کے چھ لباس پہنائے گئے، ایک تلوار دی گئی اور گھوڑے پر سوار کیا گیا جس کی لگام اور زین سونے کی تھی۔ 341}۔ نیز ابن الجوزی کے مطابق، ان کے والد کے بعد ان سے بیعت لی گئی تھی، جمعہ کی شام گیارہ رات ربیع الثانی 289 کے اختتام سے قبل، المتدید کی وفات سے چار دن پہلے، بغداد کے لوگوں سے۔ وہ رقہ میں تھے، وہاں کے لوگوں سے حلف لیا، پھر بغداد آئے، پیر کے دن آٹھ دن جمادی الاول میں پہنچے۔ اس نے القاسم بن عبید اللہ کو سپاہیوں کے وظیفے کا انچارج بنایا اور ان سے بیعت لی۔ خزانے میں سامان اور گھوڑوں کے علاوہ دس ملین دینار اور دس ملین دینار کے زیورات تھے۔ ان کی عمر پچیس سال چھ ماہ اور بیس دن تھی جب ان سے بیعت کی گئی۔ 323-324}۔"
