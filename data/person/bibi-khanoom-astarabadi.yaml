summary:
  ar: "كاتبة وساخرة إيرانية (نحو 1858/1859–1921)، مؤلفة الهجائية «معايب الرجال» ردًّا على «تأديب النسوان»، ومؤسِّسة مدرسة للبنات في طهران سنة 1907، من أوائل مدارس البنات في إيران."
  en: "Iranian writer and satirist (c. 1858/59-1921), author of the satire Ma'ayib al-Rijal (The Failings of Men), written in reply to the anonymous Ta'dib al-Nisvan, and founder in 1907 of the School for Girls in Tehran, one of Iran's first schools for girls."
