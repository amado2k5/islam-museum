summary:
  ar: أنصارية بنت البراء بن معرور؛ روى عنها جابر بن عبد الله حديثاً في أن أصحاب الشجرة لا يدخلون النار، وذُكر حديثها في مرض النبي حين قالت إنها لا تتهم بابنها بشر إلا الشاة المسمومة التي أكل معه.
  en: An Ansari woman, daughter of al-Bara' ibn Ma'rur; Jabir ibn Abdullah narrated from her the hadith that none of the people of the tree will enter the Fire, and her words are recorded at the Prophet's last illness, where she said she blamed
    her son Bishr's death only on the poisoned sheep he had eaten with the Prophet.
