label:
  ar: أحمد بن الفرج البغدادي (القاضي أبو العباس)
  en: Ahmad ibn al-Faraj al-Baghdadi (Abu al-Abbas, Hanbali judge)
summary:
  ar: فقيه حنبلي، أبو العباس، المدني الوراق البغدادي؛ ولي القضاء بدجيل مدة، وتفقه على عبد الواحد بن سيف، وقرأ القرآن بالروايات على مكي بن أحمد الحنبلي، وسمع من أبي منصور الخازن وأبي غالب القزاز وغيرهما، وروى عنه ابن السمعاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}
  en: A Hanbali jurist and judge, Abu al-Abbas, of Baghdad; he held the judgeship of Dujayl for a time, studied fiqh under Abd al-Wahid ibn Sayf, read the Qur'an in its transmissions, heard from Abu Mansur al-Khazin and Abu Ghalib al-Qazzaz, and was transmitted by Ibn al-Sam'ani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}
  ur: حنبلی فقیہ اور قاضی، ابو العباس، بغداد کے رہنے والے؛ دجیل میں کچھ عرصہ قاضی رہے، عبد الواحد بن سیف سے فقہ پڑھی، اور ابو منصور الخازن اور ابو غالب القزاز سے سماع کیا؛ ابن السمعانی نے ان سے روایت کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}
