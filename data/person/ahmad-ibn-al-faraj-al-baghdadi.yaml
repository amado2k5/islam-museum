id: person/ahmad-ibn-al-faraj-al-baghdadi
class: person
gender: male
label:
  ar: أحمد بن الفرج البغدادي ⁦(القاضي أبو العباس)⁩
  en: Ahmad ibn al-Faraj al-Baghdadi (Abu al-Abbas, Hanbali judge)
  fr: "Ahmad ibn al-Faraj al-Baghdadi (Abu al-Abbas, juge hanbalite)"
  es: "Ahmad ibn al-Faraj al-Baghdadi (Abu al-Abbas, Hanbali judge)"
  ur: "احمد بن الفراج البغدادی ⁦(ابو العباس، حنبلی جج)⁩"
summary:
  ar: فقيه حنبلي، أبو العباس، المدني الوراق البغدادي؛ ولي القضاء بدجيل مدة، وتفقه على عبد الواحد بن سيف، وقرأ القرآن بالروايات على مكي بن أحمد الحنبلي، وسمع من أبي منصور الخازن وأبي غالب القزاز وغيرهما، وروى عنه ابن السمعاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}
  en: A Hanbali jurist and judge, Abu al-Abbas, of Baghdad; he held the judgeship of Dujayl for a time, studied fiqh under Abd al-Wahid ibn Sayf, read the Qur'an in its transmissions, heard from Abu Mansur al-Khazin and Abu Ghalib al-Qazzaz, and was transmitted by Ibn al-Sam'ani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}
  fr: "Juriste et juge hanbalite, Abu al-Abbas, de Bagdad ; il occupa un temps la judicature de Dujayl, étudia le fiqh auprès d'Abd al-Wahid ibn Sayf, lut le Coran selon ses transmissions et entendit Abu Mansur al-Khazin et Abu Ghalib al-Qazzaz ; Ibn al-Sam'ani transmit d'après lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}"
  ur: حنبلی فقیہ اور قاضی، ابو العباس، بغداد کے رہنے والے؛ دجیل میں کچھ عرصہ قاضی رہے، عبد الواحد بن سیف سے فقہ پڑھی، اور ابو منصور الخازن اور ابو غالب القزاز سے سماع کیا؛ ابن السمعانی نے ان سے روایت کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}
  es: "Abu al-Abbas, jurista y juez hanbalí de Bagdad, ocupó el cargo de juez de Dujayl durante un tiempo, estudió fiqh con Abd al-Wahid ibn Sayf, leyó el Corán en sus transmisiones, escuchó a Abu Mansur al-Khazin y Abu Ghalib al-Qazzaz, y recibió enseñanzas de Ibn al-Sam'ani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}"
  tr: "Hanbeli hukukçusu Ebu el-Abbas, el-Medeni el-Varrak el-Bağdadi; Bir süre Duceyl'de kadılık yaptı, Abdülvahid ibn Sayf'ın yanında fıkıh okudu ve Mekki ibn Ahmed el-Hanbeli'nin yanında Kur'an'ı çeşitli kıraatlarına göre okudu. Ebu Mansur el-Hazin, Ebu Galib el-Kazzaz ve diğerlerinden hadis duymuş, İbnü's-Sem'ani de ondan rivayet etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7831}"
  id: "Seorang ahli hukum Hanbali, Abu al-Abbas, al-Madani al-Warraq al-Baghdadi; ia menjabat sebagai hakim di Dujayl selama beberapa waktu, belajar yurisprudensi di bawah bimbingan Abd al-Wahid ibn Sayf, dan membacakan Al-Qur'an menurut berbagai bacaan di bawah bimbingan Makki ibn Ahmad al-Hanbali. Ia mendengar hadits dari Abu Mansur al-Khazin, Abu Ghalib al-Qazzaz, dan lain-lain, dan Ibnu al-Sam'ani meriwayatkan darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.7831}"
