summary:
  ar: "أحمد مختار باشا الغازي، رياضي تركي وقائد عثماني تعلم باسطنبول وخدم في الحجاز واليمن وكريت وألبانيا ومصر، وصار صدرا أعظم سنة 1913 وتوفي بالأستانة سنة 1337 هـ، وصنف كتبه الفلكية بالتركية. يذكر الزركلي 1253؟-1337 هـ."
  en: "Ahmad Mukhtar Pasha al-Ghazi, a Turkish mathematician and Ottoman commander who studied in Istanbul and served in the Hijaz, Yemen, Crete, Albania and Egypt; grand vizier in 1913; died in Istanbul in 1337 AH; wrote his astronomical works in Turkish. Al-Zirikli prints 1253? - 1337 AH (1837-1919)."
  es: "Ahmad Mukhtar Pasha al-Ghazi, matemático turco y comandante otomano que estudió en Estambul y sirvió en el Hiyaz, Yemen, Creta, Albania y Egipto; gran visir en 1913; murió en Estambul en 1337 AH; escribió sus obras astronómicas en turco. Grabados de Al-Zirikli 1253? - 1337 AH (1837-1919)."
  fr: "Ahmad Mukhtar Pacha al-Ghazi, mathématicien turc et commandant ottoman ayant étudié à Istanbul et servi dans le Hedjaz, au Yémen, en Crète, en Albanie et en Égypte; grand vizir en 1913; mort à Istanbul en 1337 AH; a écrit ses ouvrages d'astronomie en turc. Al-Zirikli a imprimé entre 1253 ? et 1337 AH (1837-1919)."
