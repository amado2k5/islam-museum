label:
  ar: "أحمد مختار باشا"
  en: "Ahmed Muhtar Pasha"
  es: "Ahmed Muhtar Pasha"
  fr: "Ahmed Muhtar Pasha"
  ur: "احمد مختار پاشا"
roles: [grand vizier, astronomer]
gender: male
summary:
  ar: "أحمد مختار باشا الغازي، رياضي تركي وقائد عثماني تعلم باسطنبول وخدم في الحجاز واليمن وكريت وألبانيا ومصر، وصار صدرا أعظم سنة 1913 وتوفي بالأستانة سنة 1337 هـ، وصنف كتبه الفلكية بالتركية. يذكر الزركلي 1253؟-1337 هـ."
  en: "Ahmad Mukhtar Pasha al-Ghazi, a Turkish mathematician and Ottoman commander who studied in Istanbul and served in the Hijaz, Yemen, Crete, Albania and Egypt; grand vizier in 1913; died in Istanbul in 1337 AH; wrote his astronomical works in Turkish. Al-Zirikli prints 1253? - 1337 AH (1837-1919)."
  es: "Ahmad Mukhtar Pasha al-Ghazi, matemático turco y comandante otomano que estudió en Estambul y sirvió en el Hiyaz, Yemen, Creta, Albania y Egipto; gran visir en 1913; murió en Estambul en 1337 AH; escribió sus obras astronómicas en turco. Grabados de Al-Zirikli 1253? - 1337 AH (1837-1919)."
  fr: "Ahmad Mukhtar Pacha al-Ghazi, mathématicien turc et commandant ottoman ayant étudié à Istanbul et servi dans le Hedjaz, au Yémen, en Crète, en Albanie et en Égypte; grand vizir en 1913; mort à Istanbul en 1337 AH; a écrit ses ouvrages d'astronomie en turc. Al-Zirikli a imprimé entre 1253 ? et 1337 AH (1837-1919)."
  ur: "احمد مختار پاشا الغازی، ایک ترک ریاضی دان اور عثمانی کمانڈر جنہوں نے استنبول میں تعلیم حاصل کی اور حجاز، یمن، کریٹ، البانیہ اور مصر میں خدمات انجام دیں۔ 1913 میں عظیم وزیر؛ 1337ھ میں استنبول میں وفات پائی۔ ترکی میں اپنے فلکیاتی کام لکھے۔ الزرکلی نے 1253 چھاپ? - 1337ھ (1837-1919)۔"
  tr: "Ahmed Mukhtar Paşa el-Gazi, İstanbul'da eğitim görmüş ve Hicaz, Yemen, Girit, Arnavutluk ve Mısır'da görev yapmış bir Türk matematikçi ve Osmanlı komutanıydı. 1913'te sadrazam oldu ve 1337 Hicri yılında İstanbul'da vefat etti. Astronomi kitaplarını Türkçe yazdı. El-Zarkali, onun 1253 Hicri ile 1337 Hicri yılları arasında yaşadığını belirtir."
  id: "Ahmed Mukhtar Pasha al-Ghazi adalah seorang matematikawan Turki dan komandan Ottoman yang belajar di Istanbul dan bertugas di Hejaz, Yaman, Kreta, Albania, dan Mesir. Ia menjadi Wazir Agung pada tahun 1913 dan meninggal di Istanbul pada tahun 1337 H. Ia menulis buku-buku astronominya dalam bahasa Turki. Al-Zarkali menyebutkan bahwa ia hidup antara tahun 1253 H dan 1337 H."
