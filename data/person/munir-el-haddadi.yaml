summary:
  ar: "لاعب كرة قدم مغربي دولي (وُلد سنة 1995 في إل إسكوريال بإسبانيا لأب مغربي وأم من مليلية)، مهاجم تدرّج في أكاديمية برشلونة وسجّل في أول مباراة له مع الفريق الأول سنة 2014، وفاز مع برشلونة بالثلاثية سنة 2015 وبالدوري الأوروبي مع إشبيلية سنة 2020، ومثّل إسبانيا مرة واحدة قبل أن يختار المغرب سنة 2021."
  en: "Morocco international footballer (born 1995 in El Escorial, Spain, to a Moroccan father and a mother from Melilla). A forward who came through Barcelona's academy and scored on his first-team debut in 2014, he won the treble with Barcelona in 2015 and the Europa League with Sevilla in 2020; capped once by Spain in 2014, he switched to Morocco in 2021."
  ur: "مراکشی بین الاقوامی فٹبالر (پیدائش 1995، ایل اسکوریال، اسپین، مراکشی والد اور ملیلیہ سے تعلق رکھنے والی والدہ کے ہاں)۔ فارورڈ جو بارسلونا کی اکیڈمی سے آئے اور 2014 میں پہلی ٹیم کے لیے اپنے پہلے میچ میں گول کیا؛ انہوں نے 2015 میں بارسلونا کے ساتھ ٹریبل اور 2020 میں سیویلا کے ساتھ یوروپا لیگ جیتی۔ 2014 میں ایک بار اسپین کی نمائندگی کے بعد 2021 میں مراکش کو منتخب کیا۔"
