summary:
  ar: مؤرخة وحقوقية بنغلاديشية وُلدت سنة 1936 في حيدر أباد بالسند. شاركت في تأسيس مجلة «فورم» السياسية سنة 1969، ومركز «عين أو ساليش كيندرا» للمساعدة القانونية، ومن أعمدة الحركة الحقوقية والنسوية في بنغلاديش.
  en: Bangladeshi historian and human-rights academic, born 1936 in Hyderabad, Sindh. Co-founder of the political magazine Forum in 1969 and of the Ain o Salish Kendra legal-aid centre; a pillar of Bangladesh's
    human-rights and women's movements.
  ur: بنگلہ دیشی مؤرخہ اور انسانی حقوق کی ماہرہ، 1936 میں سندھ کے حیدرآباد میں پیدا ہوئیں۔ 1969 میں سیاسی میگزین «فورم» اور عین و سالیش کیندرا لیگل ایڈ سینٹر کی شریک بانی؛ بنگلہ دیش کی انسانی حقوق اور نسوانی
    تحریکوں کے ستونوں میں۔
  es: "Historiadora y académica de derechos humanos bangladesí, nacida en 1936 en Hyderabad, Sindh. Cofundadora de la revista política Forum en 1969 y del centro de asistencia jurídica Ain o Salish Kendra; un pilar de los movimientos de derechos humanos y de mujeres de Bangladesh."
  fr: "Historienne et spécialiste des droits de l'homme bangladaise, née en 1936 à Hyderabad, dans le Sindh. Cofondatrice du magazine politique Forum en 1969 et du centre d'aide juridique Ain o Salish Kendra; figure emblématique des mouvements de défense des droits de l'homme et des droits des femmes au Bangladesh."
  tr: "1936 yılında Haydarabad, Sindh'te doğmuş Bangladeşli tarihçi ve insan hakları aktivistidir. 1969'da siyasi dergi 'Forum'un, 'Ain O Salish Kendra' Hukuki Yardım Merkezi'nin kurulmasına katıldı ve Bangladeş'teki insan hakları ve feminist hareketin temel taşlarından biri oldu."
  id: "Seorang sejarawan dan aktivis hak asasi manusia Bangladesh yang lahir pada tahun 1936 di Hyderabad, Sindh. Ia berpartisipasi dalam pendirian majalah politik 'Forum' pada tahun 1969, 'Ain O Salish Kendra' Center for Legal Aid, dan menjadi pilar gerakan hak asasi manusia dan feminis di Bangladesh."
