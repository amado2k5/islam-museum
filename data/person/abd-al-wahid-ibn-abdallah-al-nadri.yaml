label: { ar: "عبد الواحد بن عبد الله النضري", en: "Abd al-Wahid ibn Abd Allah al-Nadri", fr: "Abd al-Wahid ibn Abd Allah al-Nadri", es: "Abd al-Wahid ibn Abd Allah al-Nadri", ur: "عبد الواحد بن عبد اللہ الندری" }
gender: male
roles: [emir]
summary:
  ar: "ولاه يزيد بن عبد الملك إمرة المدينة ومكة والطائف مجتمعة، ويذكر الكتاب أن يزيد جمع له هذه الولايات في سياقه لضم الولايات إلى بعضها {cite:salabi-umayyad-state-2020 p.435}. وكان الواليَ الذي أرسله يزيد إلى المدينة فضرب عبد الرحمن بن الضحاك وأخذ منه المال، حين شكت فاطمة بنت الحسين، على ما ذكر الكتاب {cite:salabi-umayyad-state-2020 p.428}."
  en: "Yazid ibn Abd al-Malik appointed him governor of Medina, Mecca and al-Ta'if together; the book mentions that Yazid combined these governorships for him in the course of merging provinces into one another {cite:salabi-umayyad-state-2020 p.435}. He was also the governor whom Yazid sent to Medina, where, according to the book, he struck Abd al-Rahman ibn al-Dahhak and took money from him when Fatima bint al-Husayn complained {cite:salabi-umayyad-state-2020 p.428}."
  fr: "Yazid ibn Abd al-Malik le nomma gouverneur de Médine, de La Mecque et de Ta'if à la fois ; le livre mentionne que Yazid réunit pour lui ces gouvernements dans le cadre de la fusion de provinces entre elles {cite:salabi-umayyad-state-2020 p.435}. Il fut aussi le gouverneur que Yazid envoya à Médine, où, selon le livre, il fit frapper Abd al-Rahman ibn al-Dahhak et lui prit de l'argent lorsque Fatima bint al-Husayn se plaignit {cite:salabi-umayyad-state-2020 p.428}."
  es: "Yazid ibn Abd al-Malik lo nombró gobernador de Medina, La Meca y al-Ta'if conjuntamente; el libro menciona que Yazid combinó estos cargos para él durante la fusión de provincias {cite:salabi-umayyad-state-2020 p.435}. También fue el gobernador que Yazid envió a Medina, donde, según el libro, golpeó a Abd al-Rahman ibn al-Dahhak y le quitó dinero cuando Fátima bint al-Husayn se quejó {cite:salabi-umayyad-state-2020 p.428}."
  ur: "یزید بن عبد الملک نے انہیں مدینہ، مکہ اور الطائف کا ایک ساتھ گورنر مقرر کیا۔ کتاب میں ذکر کیا گیا ہے کہ یزید نے صوبوں کو ایک دوسرے میں ضم کرنے کے دوران ان گورنری کو اپنے لیے جوڑ دیا تھا وہ وہ گورنر بھی تھا جسے یزید نے مدینہ بھیجا تھا، جہاں کتاب کے مطابق، اس نے عبدالرحمٰن بن الضحاک کو مارا اور اس سے پیسے لے لیے جب فاطمہ بنت الحسین نے شکایت کی {حوالہ: سلبی امیاد ریاست-2020 صفحہ 428}۔"
