summary:
  ar: "شعيب الأرناؤوط ⁦(1928–2016)⁩ محدّث ومحقق مخطوطات سوري-أردني من أصل ألباني، أشرف على تحقيقات مرجعية لكتب الحديث والسيرة والتراجم، منها تحقيق «مسند أحمد» و«صحيح ابن حبان» و«سير أعلام النبلاء»."
  en: "Shu'ayb al-Arna'ut (1928–2016) was a Syrian-Jordanian hadith scholar and manuscript editor of Albanian descent, who supervised landmark critical editions of hadith, sira and biographical collections, including Musnad Ahmad, Sahih Ibn Hibban and Siyar A'lam al-Nubala'."
  ur: "شعیب الارناوط ⁦(1928–2016)⁩ شامی-اردنی محدث اور مخطوطات کے محقق تھے، البانی نسل سے، جنہوں نے حدیث، سیرت اور تراجم کی کلیدی تنقیدی تصحیحات کی نگرانی کی، جن میں مسند احمد، صحیح ابن حبان اور سیر اعلام النبلاء شامل ہیں۔"
  es: "Shu'ayb al-Arna'ut (1928-2016) fue un erudito en hadices sirio-jordano y editor de manuscritos de ascendencia albanesa, que supervisó ediciones críticas históricas de hadices, sira y colecciones biográficas, incluidas Musnad Ahmad, Sahih Ibn Hibban y Siyar A'lam al-Nubala'."
  fr: "Shu'ayb al-Arna'ut (1928-2016) était un érudit syro-jordanien de hadiths et éditeur de manuscrits d'origine albanaise, qui a supervisé des éditions critiques historiques de recueils de hadiths, de sira et de biographies, notamment Musnad Ahmad, Sahih Ibn Hibban et Siyar A'lam al-Nubala'."
  tr: "Shu'ayb Al-Arna'ut (1928–2016), Suriye-Ürdünlü bir hadis alimi ve Arnavut kökenli el yazmalarının editörlüğünü yapmıştır. 'Musnad Ahmad', 'Sahih İbn Hibban' ve 'Siyar A'lam al-Nubala' gibi hadis kitapları, biyografi ve biyografilerin yetkili araştırmalarını denetlemiştir."
  id: "Shu'ayb Al-Arna'ut (1928–2016) adalah seorang cendekiawan hadis Suriah-Yordania dan editor manuskrip asal Albania. Ia mengawasi penyelidikan otoritatif atas buku-buku hadis, biografi, dan biografi, termasuk penyuntingan 'Musnad Ahmad', 'Sahih Ibn Hibban', dan 'Siyar A'lam al-Nubala'."
