summary:
  ar: "رضوى عاشور ⁦(1946–2014)⁩ روائية وناقدة وأستاذة جامعية مصرية، من أبرز كتّاب الرواية التاريخية العربية الحديثة. من أعمالها ثلاثية «غرناطة» و«الطنطورية» و«أطياف»، وهي زوجة الشاعر الفلسطيني مريد البرغوثي."
  en: "Radwa Ashour (1946–2014) was an Egyptian novelist, critic and academic, among the foremost modern Arabic historical novelists. Her works include the Granada Trilogy, Al-Tanturiyya (Tanturia) and Atyaf (Specters); she was married to the Palestinian poet Mourid Barghouti."
  ur: "رضویٰ عاشور ⁦(1946–2014)⁩ مصری ناول نگار، ناقد اور جامعہ پروفیسر تھیں، جدید عربی تاریخی ناول کی نمایاں ترین ادیبوں میں۔ آثار میں «غرناطہ» تریلوژی، «الطنطوریہ» اور «اطیاف» شامل ہیں؛ وہ فلسطینی شاعر مرید البرغوثی کی زوجہ تھیں۔"
  es: "Radwa Ashour (1946-2014) fue una novelista, crítica y académica egipcia, considerada una de las principales novelistas históricas árabes modernas. Entre sus obras destacan la Trilogía de Granada, Al-Tanturiyya (Tanturia) y Atyaf (Espectros); estuvo casada con el poeta palestino Mourid Barghouti."
  fr: "Radwa Ashour (1946-2014) était une romancière, critique et universitaire égyptienne, l'une des plus importantes romancières historiques arabes modernes. Parmi ses œuvres figurent la Trilogie de Grenade, Al-Tanturiyya (Tanturie) et Atyaf (Spectres); elle était mariée au poète palestinien Mourid Barghouti."
