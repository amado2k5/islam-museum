  en: "Ibn Razin al-Hanbali (Abd al-Rahman ibn Razin)"
summary:
  ar: "عبد الرحمن بن رزين بن عبد العزيز، أبو الفرج، سيف الدين، فقيه حنبلي من أهل حوران ثم دمشق. سمع بدمشق وبغداد، وله تصانيف منها التهذيب في اختصار المغني في مجلدين، والنهاية مختصر الهداية، وتعليقة مختصرة في الخلاف. توفي سنة 656 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15808}"
  en: "Abd al-Rahman ibn Razin ibn Abd al-Aziz, Abu al-Faraj, Sayf al-Din, a Hanbali jurist from Hawran and later Damascus. He heard hadith in Damascus and Baghdad, and wrote al-Tahdhib, an abridgment of al-Mughni in two volumes, al-Nihaya, an abridgment of al-Hidaya, and a short gloss on the disputed questions. He died in 656 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15808}"
