label:
  ar: "ابن رزين الحنبلي ⁦(عبد الرحمن بن رزين)⁩"
  en: "Ibn Razin al-Hanbali (Abd al-Rahman ibn Razin)"
  fr: "Ibn Razin al-Hanbali (Abd al-Rahman ibn Razin)"
  es: "Ibn Razin al-Hanbali (Abd al-Rahman ibn Razin)"
summary:
  ar: "عبد الرحمن بن رزين بن عبد العزيز، أبو الفرج، سيف الدين، فقيه حنبلي من أهل حوران ثم دمشق. سمع بدمشق وبغداد، وله تصانيف منها التهذيب في اختصار المغني في مجلدين، والنهاية مختصر الهداية، وتعليقة مختصرة في الخلاف. توفي سنة 656 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15808}"
  en: "Abd al-Rahman ibn Razin ibn Abd al-Aziz, Abu al-Faraj, Sayf al-Din, a Hanbali jurist from Hawran and later Damascus. He heard hadith in Damascus and Baghdad, and wrote al-Tahdhib, an abridgment of al-Mughni in two volumes, al-Nihaya, an abridgment of al-Hidaya, and a short gloss on the disputed questions. He died in 656 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15808}"
  fr: "Abd al-Rahman ibn Razin ibn Abd al-Aziz, Abu al-Faraj, Sayf al-Din, juriste hanbalite du Hawran puis de Damas. Il entendit le hadith à Damas et à Bagdad, et écrivit al-Tahdhib, abrégé d'al-Mughni en deux volumes, al-Nihaya, abrégé d'al-Hidaya, et une courte glose sur les questions disputées. Il mourut en 656 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15808}"
  es: "Abd al-Rahman ibn Razin ibn Abd al-Aziz, Abu al-Faraj, Sayf al-Din, un jurista hanbali de Hawran y más tarde Damasco. Escuchó hadices en Damasco y Bagdad, y escribió al-Tahdhib, un compendio de al-Mughni en dos volúmenes, al-Nihaya, un compendio de al-Hidaya y una breve glosa sobre las cuestiones en disputa. Murió en el año 656 d. H. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15808}"
