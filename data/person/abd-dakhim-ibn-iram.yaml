  ar: "عبد ضخم بن إرم بن نوح سار بولده ومن تبعه فنزلوا الطائف فهلكوا ببعض غوائل الدهر فدثروا وذكرتهم الشعراء ومنهم الأزدي بقوله وعبد ضخم إذا نسبتهم ابيض أهل الحي بالنسب، وذكروا أنهم أول من كتب بالعربية ووضع حروف المعجم التسعة والعشرين وقيل غير ذلك {cite:muruj-al-dhahab p. 457}."
