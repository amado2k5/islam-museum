  es: "Descendiente de Aram, quien se estableció en al-Ta'if y desapareció con su pueblo; sin embargo, según un informe, se le atribuye la invención de la escritura árabe y las veintinueve letras del alfabeto {cite:muruj-al-dhahab p. 457}."
