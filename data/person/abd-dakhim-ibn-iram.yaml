id: person/abd-dakhim-ibn-iram
class: person
label: { ar: "عبد ضخم بن إرم", en: "Abd Dakhim ibn Iram", fr: "Abd Dakhim ibn Iram", es: "Abd Dakhim ibn Iram", ur: "عبد الدخیم بن ارم" }
summary:
  ar: "عبد ضخم بن إرم بن نوح سار بولده ومن تبعه فنزلوا الطائف فهلكوا ببعض غوائل الدهر فدثروا وذكرتهم الشعراء ومنهم الأزدي بقوله وعبد ضخم إذا نسبتهم ابيض أهل الحي بالنسب، وذكروا أنهم أول من كتب بالعربية ووضع حروف المعجم التسعة والعشرين وقيل غير ذلك {cite:muruj-al-dhahab p. 457}."
  en: "Descendant of Aram who settled al-Ta'if and vanished with his people — yet credited by one report with inventing Arabic writing and the twenty-nine letters of the alphabet {cite:muruj-al-dhahab p. 457}."
  fr: "Descendant d'Aram qui s'établit à al-Ta'if et disparut avec son peuple — à qui un récit attribue pourtant l'invention de l'écriture arabe et des vingt-neuf lettres de l'alphabet {cite:muruj-al-dhahab p. 457}."
  es: "Descendiente de Aram, quien se estableció en al-Ta'if y desapareció con su pueblo; sin embargo, según un informe, se le atribuye la invención de la escritura árabe y las veintinueve letras del alfabeto {cite:muruj-al-dhahab p. 457}."
  ur: "ارم کی اولاد جس نے الطائف کو آباد کیا اور اپنے لوگوں کے ساتھ غائب ہو گیا - پھر بھی ایک رپورٹ کے ذریعہ عربی تحریر اور حروف تہجی کے انتیس حروف ایجاد کرنے کا سہرا دیا گیا ہے۔ 457}۔"
  tr: "Abd Dakhim ibn Iram ibn Noah, oğlu ve onu takip edenlerle birlikte Taif'e yerleşmiş, ancak zamanın bazı musibetleri yüzünden helak olmuş ve gömülmüşlerdir. Şairler onlardan bahsetmiş, bunlardan biri de El-Azdi'dir. El-Azdi şöyle demiştir: \"Abd Dakhim'in soyunu izlerseniz, kabilenin halkı soy bakımından bembeyaz olur.\" Arapça yazıyı ilk yazanlar ve alfabenin yirmi dokuz harfini ilk oluşturanlar oldukları ve başka şeyler de söylenmiştir. {cite:muruj-al-dhahab s. 457}"
  id: "Abd Dakhim ibn Iram ibn Noah melakukan perjalanan bersama putranya dan para pengikutnya, lalu menetap di Taif. Namun mereka binasa akibat beberapa musibah zaman dan dimakamkan. Para penyair menyebut mereka, termasuk Al-Azdi, yang berkata: “Dan Abd Dakhim, jika kau menelusuri garis keturunan mereka, maka keturunan suku itu akan berwarna putih.” Mereka menyebutkan bahwa merekalah yang pertama kali menulis dalam bahasa Arab dan menetapkan dua puluh sembilan huruf alfabet, dan hal-hal lain pun disebutkan. {cite:muruj-al-dhahab p. 457}"
