summary:
  ar: "أبو حامد البروي الطوسي محمد بن محمد الفقيه الشافعي تلميذ محمد بن يحيى وصاحب التعليقة المشهورة في الخلاف؛ كان إليه المنتهى في معرفة الكلام والنظر والبلاغة والجدل بارعاً في معرفة مذهب الأشعري، قدم بغداد وشغب على الحنابلة وأثار الفتنة ووعظ بالنظامية وبعد صيته فأصبح ميتاً — يقال إن الحنابلة أهدوا له مع امرأة صحن حلوى مسمومة وقيل إن البروي قال لو كان لي أمر لوضعت على الحنابلة الجزية؛ ترجمته في أخبار سنة سبع وستين وخمسمائة {cite:shadharat-dhahab p. 704}."
  en: "Abu Hamid al-Barawi of Tus, Shafi'i jurist, pupil of Muhammad ibn Yahya and author of the famed Ta'liqa on khilaf; unmatched in kalam, dialectic and the Ash'ari madhhab — he came to Baghdad, stirred the fitna against the Hanbalis and preached at the Nizamiyya, then was found dead one morning; some said the Hanbalis sent him a dish of poisoned halwa, and it is told he said 'were it in my power I would lay jizya on the Hanbalis'; his notice falls in year 567 {cite:shadharat-dhahab p. 704}."
