names:
  - { value: "أبو حامد البروي الطوسي محمد بن محمد الفقيه الشافعي", kind: full }
summary:
  ar: "أبو حامد البروي الطوسي محمد بن محمد الفقيه الشافعي تلميذ محمد بن يحيى وصاحب التعليقة المشهورة في الخلاف؛ كان إليه المنتهى في معرفة الكلام والنظر والبلاغة والجدل بارعاً في معرفة مذهب الأشعري، قدم بغداد وشغب على الحنابلة وأثار الفتنة ووعظ بالنظامية وبعد صيته فأصبح ميتاً — يقال إن الحنابلة أهدوا له مع امرأة صحن حلوى مسمومة وقيل إن البروي قال لو كان لي أمر لوضعت على الحنابلة الجزية؛ ترجمته في أخبار سنة سبع وستين وخمسمائة {cite:shadharat-dhahab p. 704}."
  en: "Abu Hamid al-Barawi of Tus, Shafi'i jurist, pupil of Muhammad ibn Yahya and author of the famed Ta'liqa on khilaf; unmatched in kalam, dialectic and the Ash'ari madhhab — he came to Baghdad, stirred the fitna against the Hanbalis and preached at the Nizamiyya, then was found dead one morning; some said the Hanbalis sent him a dish of poisoned halwa, and it is told he said 'were it in my power I would lay jizya on the Hanbalis'; his notice falls in year 567 {cite:shadharat-dhahab p. 704}."
  fr: "Abu Hamid al-Barawi de Tus, juriste shafiite, élève de Muhammad ibn Yahya et auteur de la célèbre Ta'liqa sur le khilaf ; sans égal en kalam, en dialectique et dans la doctrine ash'arite — il vint à Bagdad, attisa la fitna contre les hanbalites et prêcha à la Nizamiyya, puis fut trouvé mort un matin ; certains dirent que les hanbalites lui avaient envoyé un plat de halwa empoisonné, et l'on raconte qu'il avait dit « s'il était en mon pouvoir, j'imposerais la jizya aux hanbalites » ; sa notice figure à l'année 567 {cite:shadharat-dhahab p. 704}."
  es: "Abu Hamid al-Barawi de Tus, jurista shafi'í, discípulo de Muhammad ibn Yahya y autor de la célebre Ta'liqa sobre el califato; inigualable en kalam, dialéctica y la escuela de pensamiento ash'ari, llegó a Bagdad, instigó la fitna contra los hanbalíes y predicó en la Nizamiyya, para luego ser hallado muerto una mañana; algunos dicen que los hanbalíes le enviaron un plato de halwa envenenada, y se cuenta que dijo: \"Si estuviera en mi poder, impondría la jizya a los hanbalíes\"; su mención data del año 567 {cite: shadharat-dhahab p. 704}."
  ur: "طوس کے ابو حامد البراوی، شافعی فقیہ، محمد بن یحییٰ کے شاگرد اور خلافت پر مشہور طلاق کے مصنف؛ کلام، جدلیاتی اور اشعری مذھب میں بے مثال - وہ بغداد آیا، حنبلیوں کے خلاف فتنہ بھڑکا اور نظامیہ میں تبلیغ کی، پھر ایک صبح مردہ پایا۔ بعض کہتے ہیں کہ حنبلیوں نے اسے زہر آلود حلوہ کا پکوان بھیجا، اور کہا جاتا ہے کہ اس نے کہا کہ اگر میرے اختیار میں ہوتا تو میں حنبلیوں پر جزیہ لگاتا۔ اس کا نوٹس 567 میں آتا ہے۔ 704}۔"
  tr: "Şafiî fıkıhçısı, Muhammed ibn Yahya'nın öğrencisi ve ünlü tefsir eserinin yazarı Ebu Hamid el-Beravî el-Tusi, Muhammed ibn Muhammed; konuşma, akıl yürütme, retorik ve diyalektik bilgisinde en üst otoriteydi ve Eş'ari mezhebine dair bilgide de uzmandı. Bağdat'a gelerek Hanbelilere karşı karışıklık çıkardı, fitne kışkırttı ve Nizamiye'de vaaz verdi. Şöhreti yayıldı ve öldü. Hanbelilerin bir kadın aracılığıyla ona zehirli tatlılar sundukları rivayet edilir. Ayrıca el-Beravî'nin, \"Eğer yetkim olsaydı, Hanbelilere cizye uygulardım\" dediği de rivayet edilir. Biyografisi Hicri 567 yılının haberlerinde yer almaktadır. {kaynak: Şadharat-dhahab s. 704}"
  id: "Abu Hamid al-Barawi al-Tusi, Muhammad ibn Muhammad, seorang ahli hukum mazhab Syafi'i, murid Muhammad ibn Yahya dan penulis tafsir terkenal tentang perselisihan tersebut; beliau adalah otoritas tertinggi dalam pengetahuan tentang ucapan, penalaran, retorika, dan dialektika, serta mahir dalam pengetahuan tentang mazhab Asy'ari. Beliau datang ke Baghdad dan menimbulkan masalah terhadap kaum Hanbali, menghasut pemberontakan, dan berdakwah di Nizamiyyah. Ketenarannya menyebar, dan beliau meninggal dunia. Dikatakan bahwa kaum Hanbali memberinya sepiring manisan beracun melalui seorang wanita. Dikatakan juga bahwa al-Barawi berkata, \"Jika saya memiliki wewenang, saya akan mengenakan jizya kepada kaum Hanbali.\" Biografinya menjadi berita pada tahun 567 H. {cite:shadharat-dhahab hlm. 704}."
