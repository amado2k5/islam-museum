summary:
  ar: "حكيم محمد سعيد (9 يناير 1920 – 17 أكتوبر 1998) طبيب وباحث وباني مؤسسات باكستاني، وُلد في دلهي لأسرة أردية متعلمة متدينة، فأعاد تأسيس مختبرات همدرد في كراتشي بعد تقسيم الهند سنة 1948 وبنى مؤسسة همدرد وجامعة همدرد ومدينة الحكمة، وألّف وحرّر نحو 200 كتاب في الطب والفلسفة والدين والتعليم، وتولى منصب حاكم السند في 1993–1994، واغتيل في كراتشي سنة 1998."
  en: "Hakim Muhammad Said (9 January 1920 – 17 October 1998) was a Pakistani physician, researcher and institution-builder, born at Delhi into an educated, religious Urdu-speaking family, who re-established the Hamdard Laboratories at Karachi after Partition in 1948 and built the Hamdard Foundation, Hamdard University and the Madinat-al-Hikmah campus, authored or edited some 200 books on medicine, philosophy, religion and education, served as governor of Sindh in 1993–1994, and was assassinated at Karachi in 1998. 'Hakim' in his name is the professional title of a Unani physician, not a name element."
  ur: "حکیم محمد سعید (9 جنوری 1920ء – 17 اکتوبر 1998ء) پاکستانی طبیب، محقق اور ادارہ ساز تھے، دہلی میں ایک تعلیم یافتہ مذہبی اردو بولنے والے خاندان میں پیدا ہوئے، تقسیم کے بعد 1948ء میں کراچی میں ہمدرد لیبارٹریز دوبارہ قائم کیں، ہمدرد فاؤنڈیشن، ہمدرد یونیورسٹی اور مدینۃ الحکمہ بنائے، طب، فلسفے، مذہب اور تعلیم پر تقریباً 200 کتب لکھیں و مرتب کیں، 1993ء تا 1994ء گورنر سندھ رہے، اور 1998ء میں کراچی میں شہید کر دیے گئے۔"
