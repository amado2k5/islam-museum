summary:
  ar: "فنان ومنتج صوتي مقيم في لندن، مؤسس مشروع «حلال بيتس» (Halal Beats) منذ 2020، ينتج أغاني ومقاطع صوتية تصويرية بالصوت البشري والدف فقط لتكون خلفية مناسبة لصانعي المحتوى الذين يتجنبون الآلات الموسيقية، وانتشرت أصواته على منصات العالم حتى صارت من أكثر الأصوات إعادة استخدام في مقاطع التواصل."
  en: "London-based artist and sound producer, creator of Halal Beats (since 2020), who makes songs and soundtracks using only the human voice and the daf, for content creators who avoid musical instruments; his sounds have spread across the world's platforms and become among the most reused in social-media videos."
  ur: "لندن میں مقیم فنکار اور ساؤنڈ پروڈیوسر، «حلال بیٹس» (Halal Beats) کے خالق، جو 2020 سے صرف انسانی آواز اور دف پر مبنی گیت اور ساؤنڈ ٹریک بناتے ہیں تاکہ آلاتِ موسیقی سے گریز کرنے والے کانٹینٹ کریئیٹرز انہیں استعمال کر سکیں؛ ان کی آوازیں دنیا بھر کے پلیٹ فارموں پر پھیل چکی ہیں۔"
