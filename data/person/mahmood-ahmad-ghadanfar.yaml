summary:
  ar: "محمود أحمد غضنفر، مؤلف كتاب في الصحابيات المبشرات بالجنة صدر بالإنجليزية بعنوان «Great Women of Islam» عن دار السلام بالرياض بترجمة جميلة محمد قوي."
  en: "Mahmood Ahmad Ghadanfar, author of a book on the women Companions given the good news of Paradise, published in English as Great Women of Islam by Darussalam, Riyadh, in Jamila Muhammad Qawi's translation."
  es: "Mahmood Ahmad Ghadanfar, autor de un libro sobre las mujeres Compañeras a quienes se les anunció la buena noticia del Paraíso, publicado en inglés como Great Women of Islam por Darussalam, Riyadh, en la traducción de Jamila Muhammad Qawi."
  fr: "Mahmood Ahmad Ghadanfar, auteur d'un livre sur les femmes Compagnes ayant reçu la bonne nouvelle du Paradis, publié en anglais sous le titre Great Women of Islam par Darussalam, Riyad, dans la traduction de Jamila Muhammad Qawi."
  ur: "جنت کی بشارت دی گئی خواتین صحابہ پر ایک کتاب کے مصنف محمود احمد غضنفر جو جمیلہ محمد قوی کے ترجمہ میں دارالسلام، ریاض کی طرف سے انگریزی میں Great Women of Islam کے نام سے شائع ہوئی ہے۔"
  tr: "Mahmoud Ahmed Ghadanfar, cennet vaat eden kadın sahabeler üzerine İngilizce yayımlanan ve Riyad'da Dar Al-Salam tarafından yayımlanan \"İslam'ın Büyük Kadınları\" başlığıyla Jamila Muhammad Qawi tarafından çevrilen bir kitabın yazarıdır."
  id: "Mahmoud Ahmed Ghadanfar, penulis buku tentang para wanita pendamping yang menjanjikan Surga, diterbitkan dalam bahasa Inggris berjudul \"Great Women of Islam\" oleh Dar Al-Salam di Riyadh, diterjemahkan oleh Jamila Muhammad Qawi."
