summary:
  ar: "الأديب والكاتب ضياء الدين أبو الفتح نصر الله بن محمد الجزري الشيباني؛ ثالث أخوة ابن الأثير، صاحب «المثل السائر في أدب الكاتب والشاعر» في علم البيان، عمل بدواوين الأتابكة بالموصل. وفي الشذرات: انتهت إليه كتابة الإنشاء والترسل، وزر بدمشق للملك الأفضل فأساء وظلم فاستقل بالوزارة ثم همّ أهلها بقتله فأخرجه الحاجب محاسن بن عجم في صندوق، فكان مع الأفضل بسميساط سنين ثم خدم الظاهر صاحب حلب فتحول إلى الموصل فكتب الإنشاء لصاحبها ولأتابكه لؤلؤ، وذهب رسولاً إلى الخليفة فمات ببغداد في ربيع الآخر، وكان بينه وبين أخيه عز الدين مقاطعة كلية، وقال ابن خلكان ترددت إلى الموصل من أربل أكثر من عشر مرات وهو مقيم بها وكنت أود الاجتماع به لما كان بينه وبين الوالد من المودة الوثيقة فلم يتفق ذلك {cite:shadharat-dhahab p. 188-189}."
  en: "The man of letters Diya' al-Din Abu al-Fath Nasr Allah ibn Muhammad al-Jazari al-Shaybani, third of the Ibn al-Athir brothers; author of 'al-Mathal al-Sa'ir fi Adab al-Katib wa-l-Sha'ir' on the craft of the pen, and served the Atabeg chanceries of Mosul."
  es: "El hombre de letras Diya' al-Din Abu al-Fath Nasr Allah ibn Muhammad al-Jazari al-Shaybani, tercero de los hermanos Ibn al-Athir; autor de 'al-Mathal al-Sa'ir fi Adab al-Katib wa-l-Sha'ir' sobre el arte de la pluma, y sirvió en las cancillerías Atabeg de Mosul."
  fr: "L'homme de lettres Diya' al-Din Abu al-Fath Nasr Allah ibn Muhammad al-Jazari al-Shaybani, troisième des frères Ibn al-Athir; auteur de 'al-Mathal al-Sa'ir fi Adab al-Katib wa-l-Sha'ir' sur l'art de la plume, et a servi les chancelleries Atabeg de Mossoul."
  ur: "حروف کا آدمی دیا الدین ابو الفتح نصر اللہ ابن محمد الجزاری الشیبانی، ابن اثیر بھائیوں میں تیسرا؛ قلم کے ہنر پر 'المثل السعیر فی ادب الکاتب والشعر' کے مصنف، اور موصل کے عتبیگ درباریوں کی خدمت کی۔"
  tr: "Yazar ve yazıcı Diya'ddin Ebu el-Feth Nasrallah ibn Muhammed el-Cezeri el-Şeybani; İbn el-Athir'in üçüncü kardeşi, 'El-Methal el-Seyir fi Adab el-Katib ve el-Şair' adlı eserin yazarıdır ve Musul'daki Atabeglerin koleksiyonlarında çalışmıştır. Al-Shadhrat'ta: Yazı ve yazışmaları tamamladı, gönderdi. Şam'ı Kral Al-Afdal'a ziyaret etti, fakat haksızlığa uğradı, bu yüzden vezirlikte bağımsız oldu, ardından şehir halkı onun tarafından öldürüldü. Başkâr onu bir sandıkta gönderdi ve yıllarca Al-Afsal ile Sumaysat'ta kaldı. Sonra Halep hükümdarı Al-Zahir'e hizmet etti, sonra Musul'a taşındı ve sahibine ve atabika Lulu'ya El-İşa'yı yazdı. Halifeye elçi olarak gitti ve Bağdat'ta Rabi'al-Thani'de öldü. O ve kardeşi İzzddin genel bir bölgeye sahipti. İbn Hallikan şöyle dedi: Musul'u Erbil'de yaşarken ondan fazla kez ziyaret ettim ve babamla aralarındaki yakın sevgi nedeniyle onunla görüşmek istedim {alıntı::) Shadharat-Dhahab s. 188-189}."
  id: "Penulis dan juru tulis Diya' al-Din Abu al-Fath Nasrallah ibn Muhammad al-Jazari al-Shaybani; saudara ketiga Ibn al-Athir, penulis 'Al-Mathal al-Sa'ir fi Adab al-Katib wa al-Sha'ir' dalam retorika, dan bekerja dalam koleksi Atabeg di Mosul. Dalam Al-Shadhrat: Ia menyelesaikan penulisan dan pengiriman komposisi serta surat-menyurat. Ia mengunjungi Damaskus kepada Raja Al-Afdal, tetapi ia dirugikan dan dirugikan dan dirugikan sehingga ia menjadi mandiri sebagai wazir, lalu penduduk kota dibunuh olehnya. Chamberlain mengirimnya keluar dalam peti, dan ia bersama Al-Afsal di Sumaysat selama bertahun-tahun. Ia kemudian melayani Al-Zahir, penguasa Aleppo, lalu pindah ke Mosul dan menulis Al-Isha kepada pemiliknya dan kepada atabika Lulu'. Ia pergi sebagai utusan kepada khalifah dan meninggal di Baghdad di Rabi' al-Thani. Ia dan saudaranya Izz al-Din memiliki distrik umum. Ibn Khallikan berkata: Saya mengunjungi Mosul dari Erbil lebih dari sepuluh kali saat ia tinggal di sana, dan saya ingin bertemu dengannya karena kedekatan antara dia dan ayah saya, tetapi itu tidak sejalan {cite:shadharat-dhahab hlm. 188-189}."
