id: person/khalifa-ibn-ruqasa
class: person
label:
  ar: خليفة بن رقاصة
  en: Khalifa ibn Ruqasa
  es: "Khalifa ibn Ruqasa"
  fr: "Khalifa ibn Ruqasa"
  ur: "خلیفہ ابن رقصہ"
summary:
  ar: "خليفة بن رقاصة من يهود فاس المعاهدين؛ كان قهرماناً لدار الأمير يوسف بن يعقوب في صباه فاستعمله في اعتصار خمره والقيام على شؤونها، وكان يزدلف إليه بوجوه الخدم فأوجبت له خلوة الأمير الحظ عنده، فلما استقل يوسف بالملك واتصلت خلواته في معاقرة الندمان انفرد ابن رقاصة بخلوته فعظمت رياسته وعلا كعبه في الدولة وتلقى الخاصة الأوامر منه، وكان له أخ إبراهيم وابن عم خليفة لقبوه بالصغير وصهر بنو السبتي كبيرهم موسى رديفه في قهرمته، حتى استتبعوا العلية من القبيل والوزراء والشرفاء والعلماء فأهمّ ذلك السلطان فسعى عنده فيهم خالصته عبد الله بن أبي مدين، فسطا بهم سطوة واحدة واعتقلوا في شعبان سنة إحدى وسبعمائة بمعسكره من حصار تلمسان وقتل خليفة الكبير وأخوه إبراهيم وموسى بن السبتي وذويهم فلم يبق منهم باقية."
  en: "Khalifa ibn Ruqasa of Fes's covenant Jews; steward of Prince Yusuf ibn Ya'qub's household who rose by pressing his wine and courting his leisure, then — when Yusuf took the throne and the drinking-circle became the privy chamber — monopolised his closet until his ri'asa towered in the state and the great men took their orders from him; his brother Ibrahim, cousin Khalifa the Younger and in-law Musa ibn al-Sabti rose with him until notables, viziers, sharifs and scholars all paid them court — whereupon the sultan, primed by his confidant Abdallah ibn Abi Madyan, swept them up in a single stroke at the Tlemcen siege camp in Sha'ban 701 and killed Khalifa, Ibrahim, Musa and their kin."
  es: "Khalifa ibn Ruqasa, de los judíos del pacto de Fez, administrador de la casa del príncipe Yusuf ibn Ya'qub, ascendió a base de prensar vino y disfrutar de su tiempo libre. Luego, cuando Yusuf tomó el trono y el círculo de bebedores se convirtió en la cámara privada, monopolizó su aposento hasta que su ri'asa se alzó en el estado y los grandes hombres recibían órdenes de él. Su hermano Ibrahim, su primo Khalifa el Joven y su cuñado Musa ibn al-Sabti ascendieron con él hasta que notables, visires, sharifs y eruditos les rindieron homenaje. Entonces, el sultán, instigado por su confidente Abdallah ibn Abi Madyan, los eliminó de un solo golpe en el campamento de asedio de Tlemcen en Sha'ban 701 y mató a Khalifa, Ibrahim, Musa y sus parientes."
  fr: "Khalifa ibn Ruqasa, des Juifs de l'alliance de Fès; intendant de la maison du prince Yusuf ibn Ya'qub, il s'éleva en pressant son vin et en s'adonnant à ses loisirs, puis — lorsque Yusuf monta sur le trône et que le cercle de boisson devint la chambre privée — il monopolisa son cabinet jusqu'à ce que son influence domine l'État et que les grands hommes reçoivent leurs ordres de lui; son frère Ibrahim, son cousin Khalifa le Jeune et son beau-frère Musa ibn al-Sabti s'élevèrent avec lui jusqu'à ce que notables, vizirs, chérifs et érudits leur rendent tous visite — après quoi le sultan, préparé par son confident Abdallah ibn Abi Madyan, les fit tous éliminer d'un seul coup au camp de siège de Tlemcen en Sha'ban 701 et tua Khalifa, Ibrahim, Musa et leurs proches."
  ur: "خلیفہ ابن رقاصہ فیس کے عہد یہودیوں کا۔ شہزادہ یوسف بن یعقوب کے گھر کا وظیفہ جو اپنی شراب کو دبا کر اور اپنی فرصت کو پیش کرتے ہوئے اٹھتا تھا، پھر - جب یوسف نے تخت سنبھالا اور شراب نوشی کا حلقہ پرائیو چیمبر بن گیا - اس کی کوٹھری پر اجارہ داری قائم کی یہاں تک کہ اس کا ریاض ریاست میں بلند ہو گیا اور بڑے آدمی اس سے اپنے حکم لے لیتے۔ اس کا بھائی ابراہیم، کزن خلیفہ چھوٹا اور سسر موسیٰ ابن سبطی اس کے ساتھ اٹھے یہاں تک کہ معززین، وزیروں، شریفوں اور علماء نے ان کو عدالت میں ادائیگی کی - اس کے بعد سلطان نے، جس کی قیادت اس کے معتمد عبداللہ ابن ابی مدیان نے کی، نے ان کو یکے بعد دیگرے یکے بعد دیگرے شعبان میں ایک ہی وار میں مار ڈالا۔ خلیفہ، ابراہیم، موسیٰ اور ان کے رشتہ دار۔"
  tr: "Halife ibn Raqasa, Fes'in Yahudilerinden biri olarak antlaşmalar yapıyordu; gençliğinde Prens Yusuf bin Ya'qub'un evinin kahramanıydı, bu yüzden onu şarabını damıtmak ve işlerini yönetmek için kullandı. Onu hizmetçi yüzleriyle ziyaret ederdi, bu da prensin onunla inzivasını kazandı. Yusuf bağımsız olduğunda ve inzivaları pişmanlık anlaşmazlığıyla bağlantılı olduğunda, İbn Raqasa sadece onun inzivasına katıldı, bu da onun devletteki liderliğini ve yüksek statüsünü büyük ölçüde artırdı ve ondan özel emirler aldı. Bir kardeşi İbrahim ve Halife'nin kuzeni vardı, ona 'küçük' lakabını taktı ve Banu al-Sabti'nin damadı olan en büyüğü Musa, kavgasında onun yoldaşı oldu Soyluları, bakanlar, soylular ve alimleri aradılar; en önemlisi sultandı. Abdullah ibn Ebi Madyan onları yenmeye çalıştı, üzerlerinde tek bir güç kurdu ve 701 Hicri yılında Tlemcen kuşatması sırasında kampında Şaban'da tutuklandı. Büyük halife, kardeşi İbrahim, Musa ibn al-Sabti ve akrabaları öldürüldü, geride hiçbir iz bırakmadılar."
  id: "Khalifa ibn Raqasa adalah salah satu orang Yahudi Fez yang membuat perjanjian; ia adalah pahlawan rumah tangga Pangeran Yusuf ibn Ya'qub saat muda, sehingga ia menggunakannya untuk menyuling anggur dan mengelola urusannya. Ia sering mengunjunginya dengan wajah pelayan, yang membuatnya mengasingkan diri dari pangeran. Ketika Yusuf merdeka dan pemisahannya terkait dengan perselisihan penyesalan, Ibn Raqasa menjadi eksklusif dalam pengasingannya, yang sangat meningkatkan kepemimpinan dan status tingginya di negara, dan ia menerima perintah khusus darinya. Ia memiliki seorang saudara bernama Ibrahim dan sepupu Khalifa, yang ia juluki 'yang muda,' dan menantu Banu al-Sabti, anak sulung mereka, Musa, menjadi teman dalam perselisihan mereka hingga Mereka mencari bangsawan, termasuk menteri, bangsawan, dan cendekiawan, yang paling penting adalah sultan. Abdullah ibn Abi Madyan berusaha mengalahkan mereka, mendirikan satu kekuasaan atas mereka, dan ditangkap di Sha'ban pada tahun 701 H di kampnya selama pengepungan Tlemcen. Khalifah agung, saudaranya Ibrahim, Musa ibn al-Sabti, dan kerabat mereka dibunuh, sehingga tidak meninggalkan jenazah."
