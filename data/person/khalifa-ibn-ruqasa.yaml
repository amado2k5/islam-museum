id: person/khalifa-ibn-ruqasa
class: person
label:
  ar: خليفة بن رقاصة
  en: Khalifa ibn Ruqasa
summary:
  ar: "خليفة بن رقاصة من يهود فاس المعاهدين؛ كان قهرماناً لدار الأمير يوسف بن يعقوب في صباه فاستعمله في اعتصار خمره والقيام على شؤونها، وكان يزدلف إليه بوجوه الخدم فأوجبت له خلوة الأمير الحظ عنده، فلما استقل يوسف بالملك واتصلت خلواته في معاقرة الندمان انفرد ابن رقاصة بخلوته فعظمت رياسته وعلا كعبه في الدولة وتلقى الخاصة الأوامر منه، وكان له أخ إبراهيم وابن عم خليفة لقبوه بالصغير وصهر بنو السبتي كبيرهم موسى رديفه في قهرمته، حتى استتبعوا العلية من القبيل والوزراء والشرفاء والعلماء فأهمّ ذلك السلطان فسعى عنده فيهم خالصته عبد الله بن أبي مدين، فسطا بهم سطوة واحدة واعتقلوا في شعبان سنة إحدى وسبعمائة بمعسكره من حصار تلمسان وقتل خليفة الكبير وأخوه إبراهيم وموسى بن السبتي وذويهم فلم يبق منهم باقية."
  en: "Khalifa ibn Ruqasa of Fes's covenant Jews; steward of Prince Yusuf ibn Ya'qub's household who rose by pressing his wine and courting his leisure, then — when Yusuf took the throne and the drinking-circle became the privy chamber — monopolised his closet until his ri'asa towered in the state and the great men took their orders from him; his brother Ibrahim, cousin Khalifa the Younger and in-law Musa ibn al-Sabti rose with him until notables, viziers, sharifs and scholars all paid them court — whereupon the sultan, primed by his confidant Abdallah ibn Abi Madyan, swept them up in a single stroke at the Tlemcen siege camp in Sha'ban 701 and killed Khalifa, Ibrahim, Musa and their kin."
