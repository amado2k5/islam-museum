summary:
  ar: "شاعر بوسني مسلم من مودريتشا نشر باسم «س. أفدو كارابكوفيتش» — والس. تعني «صربي» — فهو من أنصار الصرب بين مسلمي البوسنة؛ جنّدته النمسا قسراً فأصابه السل، وعلّم أطفال المسلمين في صربيا، ومات في لوزنيتسا سنة 1908 ودُفن في بلغراد."
  en: "Bosnian Muslim poet from Modriča who published as S. Avdo Karabegović — the initial stood for Srbin, 'Serb' — a leading Serbophile among Bosnia's Muslims: forcibly inducted by Austria-Hungary, he contracted tuberculosis, taught Muslim schoolchildren in Serbia, and died at Loznica in 1908, buried at Belgrade."
  ur: "مودریچا سے تعلق رکھنے والے بوسنیائی مسلم شاعر، جو «س۔ اودو کارابیگووچ» کے نام سے شائع ہوتے تھے — «س» سے مراد «سربین» یعنی سرب تھا — وہ بوسنیا کے مسلمانوں میں سرب نوازی کے نمایاں حامی تھے؛ آسٹریا ہنگری نے انھیں زبردستی فوج میں بھرتی کیا تو تپِ دق لاحق ہوئی، سربیا میں مسلم بچوں کو پڑھایا، اور 1908ء میں لوزنیتسا میں وفات پاکر بلغراد میں دفن ہوئے۔"
