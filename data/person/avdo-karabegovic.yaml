  note: "Died of tuberculosis at Loznica on 18 December 1908 (Gregorian; 5 December Julian). The English biography's body, the Croatian biography and Wikidata agree on this day; the English article's infobox instead carries 22 December, which its own body gives as the date of his burial at Belgrade's New Cemetery — the infobox reading is preserved here as an error, not a rival attestation. The Hijri year 1326 is derived by tabular conversion and is marked derived. Loznica has no place entity on main, so the place is carried here."
