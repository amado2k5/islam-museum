  note: "Born on 25 August 1878 at Modriča into a prominent but impoverished Muslim landowning family, the son of Halid-beg (the English biography gives 'Halim-beg') and Fatima (née Mustajbegović). The byname Halidbegov, from his father, distinguishes him from his cousin Avdo Karabegović Hasanbegov; the 'S.' of his pen name stood for Srbin, 'Serb', marking his Serbophile self-identification. The English and Croatian biographies and Wikidata agree on the day. The Hijri year 1295 is derived by tabular conversion and is marked derived. Modriča has no place entity on main, so the place is carried here."
