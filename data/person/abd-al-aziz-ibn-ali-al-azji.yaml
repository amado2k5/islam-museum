summary:
  ar: "أبو القاسم عبد العزيز بن علي بن أحمد بن الفضل البغدادي الأزجي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} سمع من عبد العزيز الخرقي، وابن المظفر، والدارقطني، وخلق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} وروى عنه الخطيب البغدادي، والقاضي أبو يعلى، وخلق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} قال الخطيب: كان صدوقاً كثير الكتاب، وقال الذهبي: الشيخ الإمام المحدث المفيد، وله مصنف في الصفات لم يهذّبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} والمصادر المذكورة: تاريخ بغداد، وسير أعلام النبلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} وفي رأس الترجمة تاريخان مكتوبان «٤٤٤» و«٣٥٦» ولم يُبيّن أيهما الوفاة، فلا يُذكر تاريخ هنا."
  en: "Abu al-Qasim Abd al-Aziz ibn Ali ibn Ahmad ibn al-Fadl al-Baghdadi al-Azji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} He heard from Abd al-Aziz al-Kharaqi, Ibn al-Muzaffar, al-Daraqutni and many others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Al-Khatib al-Baghdadi, the judge Abu Ya'la and many others transmitted from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Al-Khatib said he was truthful and had many books; al-Dhahabi called him a learned, instructive hadith scholar, who wrote an unrefined work on the divine attributes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} The sources cited are Tarikh Baghdad and Siyar a'lam al-nubala'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} The heading gives two figures, 444 and 356, without saying which is the date of death, so no date is stated here."
