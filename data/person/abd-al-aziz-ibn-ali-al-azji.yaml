summary:
  ar: "أبو القاسم عبد العزيز بن علي بن أحمد بن الفضل البغدادي الأزجي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} سمع من عبد العزيز الخرقي، وابن المظفر، والدارقطني، وخلق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} وروى عنه الخطيب البغدادي، والقاضي أبو يعلى، وخلق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} قال الخطيب: كان صدوقاً كثير الكتاب، وقال الذهبي: الشيخ الإمام المحدث المفيد، وله مصنف في الصفات لم يهذّبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} والمصادر المذكورة: تاريخ بغداد، وسير أعلام النبلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} وفي رأس الترجمة تاريخان مكتوبان «٤٤٤» و«٣٥٦» ولم يُبيّن أيهما الوفاة، فلا يُذكر تاريخ هنا."
  en: "Abu al-Qasim Abd al-Aziz ibn Ali ibn Ahmad ibn al-Fadl al-Baghdadi al-Azji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} He heard from Abd al-Aziz al-Kharaqi, Ibn al-Muzaffar, al-Daraqutni and many others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Al-Khatib al-Baghdadi, the judge Abu Ya'la and many others transmitted from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Al-Khatib said he was truthful and had many books; al-Dhahabi called him a learned, instructive hadith scholar, who wrote an unrefined work on the divine attributes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} The sources cited are Tarikh Baghdad and Siyar a'lam al-nubala'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} The heading gives two figures, 444 and 356, without saying which is the date of death, so no date is stated here."
  fr: "Abu al-Qasim Abd al-Aziz ibn Ali ibn Ahmad ibn al-Fadl al-Baghdadi al-Azji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Il entendit Abd al-Aziz al-Kharaqi, Ibn al-Muzaffar, al-Daraqutni et bien d'autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Al-Khatib al-Baghdadi, le cadi Abu Ya'la et bien d'autres transmirent de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Al-Khatib dit qu'il était véridique et possédait beaucoup de livres ; al-Dhahabi le qualifia de traditionniste savant et instructif, auteur d'un ouvrage peu soigné sur les attributs divins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Les sources citées sont le Tarikh Baghdad et le Siyar a'lam al-nubala'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} L'en-tête donne deux chiffres, 444 et 356, sans dire lequel est la date de sa mort ; aucune date n'est donc indiquée ici."
  es: "Abu al-Qasim Abd al-Aziz ibn Ali ibn Ahmad ibn al-Fadl al-Baghdadi al-Azji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Escuchó de 'Abd al-Aziz al-Kharaqi, Ibn al-Muzaffar, al-Daraqutni y muchos otros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Al-Khatib al-Baghdadi, el juez Abu Ya'la y muchos otros transmitieron de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Al-Khatib dijo que era veraz y que tenía muchos libros; al-Dhahabi lo llamó un erudito e instructivo hadiz, que escribió una obra poco refinada sobre los atributos divinos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Las fuentes citadas son Tarikh Baghdad y Siyar a'lam al-nubala' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} El encabezado da dos cifras, 444 y 356, sin decir cuál es la fecha de muerte, por lo que no se indica ninguna fecha aquí."
  ur: "ابو القاسم عبد العزیز ابن علی ابن احمد بن الفضل البغدادی العزجی۔ انہوں نے عبدالعزیز الخراقی، ابن المظفر، الدارقطنی اور بہت سے دوسرے لوگوں سے سنا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17701} الخطیب البغدادی، جج ابو یعلٰی اور بہت سے دوسرے ان سے نقل ہوئے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17701} الخطیب نے کہا کہ وہ سچے تھے اور ان کے پاس بہت سی کتابیں تھیں۔ الذہبی نے انہیں ایک متعلم، نصیحت آمیز حدیث کا عالم کہا، جس نے صفات الٰہی پر ایک غیر مصدقہ کام لکھا۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17701} تاریخ بغداد اور سیار اعلام النبلاء کا حوالہ دیا گیا ہے {حوالہ: فقہ موسوعۃ کویتیہ نور v3 صفحہ 17701} سرخی دو اعداد بتاتی ہے جس میں تاریخ 4 اور 4 کے بغیر کہا گیا ہے کہ نمبر 5 ہے، چنانچہ تاریخ 4 ہے، تاریخ یہاں بیان کی گئی ہے۔"
  tr: "Ebu el-Kasım Abd el-Aziz ibn Ali ibn Ahmed ibn el-Fadl el-Bağdadi el-Azji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17701} Abdülaziz el-Kharki, İbn el-Muzaffar, el-Darakutni ve daha birçok kişiden hadis duydu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17701} El-Hatib el-Bağdadi, Kadı Ebu Ya'la ve daha pek çok kişi ondan rivayette bulunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17701} El-Hatib şöyle dedi: Doğru söylüyordu ve kapsamlı bir şekilde yazıyordu. Zehebi şöyle dedi: O, ilim sahibi, seçkin ve faydalı bir hadis alimiydi. Allah'ın sıfatları üzerine kısaltma yapmadığı bir eser yazmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17701} Bahsedilen kaynaklar şunlardır: Tarikh Baghdad (Bağdat Tarihi) ve Siyar A'lam al-Nubala' (Soylu Şahsiyetlerin Biyografileri). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17701} Çevirinin başında \"444\" ve \"356\" olmak üzere iki tarih yazılıdır ve hangisinin ölüm tarihi olduğu belirtilmemiştir, bu nedenle burada tarih belirtilmemiştir."
  id: "Abu al-Qasim Abd al-Aziz ibn Ali ibn Ahmad ibn al-Fadl al-Baghdadi al-Azji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.17701} Ia mendengar hadits dari Abd al-Aziz al-Kharqi, Ibn al-Muzaffar, al-Daraqutni, dan banyak lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.17701} Al-Khatib al-Baghdadi, Qadi Abu Ya'la, dan banyak lainnya meriwayatkan darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.17701} Al-Khatib berkata: Dia jujur dan banyak menulis. Al-Dhahabi berkata: Beliau adalah seorang ulama hadis yang terpelajar, terkemuka dan bermanfaat. Ia menulis sebuah karya tentang sifat-sifat Tuhan, yang tidak ia persingkat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Sumber-sumber yang disebutkan adalah: Tarikh Baghdad (Sejarah Baghdad) dan Siyar A'lam al-Nubala' (Biografi Tokoh-Tokoh Mulia). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17701} Di bagian atas terjemahan terdapat dua tanggal tertulis, “444” dan “356,” dan tidak disebutkan tanggal mana yang merupakan tanggal kematian, sehingga tidak ada tanggal yang disebutkan di sini."
