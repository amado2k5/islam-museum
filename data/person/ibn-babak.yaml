id: person/ibn-babak
class: person
label: { ar: "أبو القاسم عبد الصمد بن بابك الشاعر" }
summary:
  ar: "عبد الصمد بن بابك أبو القاسم الشاعر، من فحول شعراء عصره، وشعره مستحسن متداول في كتب الأدب والتواريخ، قصد الصاحب بن عباد بالري ومدحه فقال له الصاحب: أنت ابن بابك؟ فقال: أنا ابن بابك. توفي في شوال سنة عشر وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.295}."
  tr: "Abd al-Samad ibn Babik Ebu al-Kasim şair, döneminin büyük şairlerinden biriydi ve şiirleri övgüye değerdir ve edebiyat ile tarih kitaplarında geniş çapta dolaşmıştır. Rayy'ye gidip onu övdü ve yoldaş ona: \"Kapının oğlu musun?\" dedi. Dedi ki: Ben senin kapının oğluyum. Dört yüz on yılında Şevval'de öldü {atıf:muntazam-ibn-al-jawzi j.7 s.295}."
  id: "Abd al-Samad ibn Babik Abu al-Qasim sang penyair adalah salah satu penyair besar pada zamannya, dan puisinya terpuji serta banyak beredar dalam buku-buku sastra dan sejarah. Dia pergi kepada Rayy dan memujinya, dan sahabatnya berkata kepadanya: Apakah kamu anak dari gerbangmu? Dia berkata: Aku adalah putra gerbangmu. Dia meninggal di Shawwal pada tahun empat ratus sepuluh {cite:muntazam-ibn-al-jawzi j.7 hlm.295}."
