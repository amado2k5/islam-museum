id: person/anbasa-ibn-ishaq-al-dabbi
class: person
label: { ar: "عنبسة بن إسحاق الضبي" }
summary:
  ar: "عند البلاذري في رواية المقريزي: أمير مصر كتب إليه المتوكل بإعانة محمد القمي في حرب البجة فقام بما يحتاج إليه. وقبل ذلك كان عامل المعتصم على السند فهدم أعلى منارة بد الديبل وجعل فيها سجناً وابتدأ في مرمة المدينة بما نقض من حجارتها فعزل قبل استتمام ذلك."
  en: "In al-Baladhuri via al-Maqrizi's version: Egypt's amir, to whom al-Mutawakkil wrote ordering aid for Muhammad al-Qummi in the Buja war — he supplied what he needed. Earlier, as al-Mu'tasim's Sind governor, he razed Daybul's temple-tower for a prison and began the city's repair with its stones before dismissal."
  es: "Según la versión de al-Baladhuri, a través de al-Maqrizi: el emir de Egipto, a quien al-Mutawakkil escribió solicitando ayuda para Muhammad al-Qummi en la guerra de Buja, le proporcionó lo que necesitaba. Anteriormente, como gobernador de Sind bajo el mandato de al-Mu'tasim, arrasó la torre-templo de Daybul para construir una prisión y comenzó la reconstrucción de la ciudad con sus piedras antes de ser destituido."
  fr: "D'après al-Baladhuri, rapporté par al-Maqrizi: l'émir d'Égypte, à qui al-Mutawakkil avait écrit pour demander de l'aide à Muhammad al-Qummi lors de la guerre de Buja, lui fournit ce dont il avait besoin. Auparavant, en tant que gouverneur du Sind sous al-Mu'tasim, il avait rasé le kiosque du temple de Daybul pour y construire une prison et avait entrepris la reconstruction de la ville avec ses pierres avant d'être destitué."
  ur: "البلادھوری میں المقریزی کے نسخے کے ذریعے: مصر کے امیر، جن کو المتوکل نے بوجہ جنگ میں محمد القمی کے لیے امداد کا حکم لکھا تھا - اس نے اپنی ضرورت کی فراہمی کی۔ اس سے پہلے، المعتصم کے سندھ کے گورنر کی حیثیت سے، اس نے دیبل کے مندر کے مینار کو ایک جیل کے لیے ڈھا دیا اور برطرفی سے پہلے اس کے پتھروں سے شہر کی مرمت کا کام شروع کیا۔"
  tr: "Al-Baladhuri'ye göre, Al-Maqrizi'nin rivayetinde: Mısır Emiri Al-Mutawakkil, Muhammed el-Qummi'nin yardımıyla Al-Baja Savaşı'nda ona yazdı ve Al-Mu'tasim ihtiyacı olanı yaptı. Bundan önce, Al-Mu'tasim aktarım zincirinin valisiydi, bu yüzden Bad al-Daybal'ın en yüksek minaresini yıktı, oraya bir hapishane inşa etti ve Marmat al-Madine'de taşlarını kırarak başladı, ancak tamamlanmadan görevden alındı."
  id: "Menurut Al-Baladhuri, dalam riwayat Al-Maqrizi: Emir Mesir, Al-Mutawakkil, menulis kepadanya dengan bantuan Muhammad al-Qummi dalam Pertempuran Al-Baja, dan dia melakukan apa yang dibutuhkan. Sebelumnya, Al-Mu'tasim adalah penguasa rantai transmisi, sehingga dia menghancurkan menara tertinggi Bad al-Daybal, membangun penjara di sana, dan memulai di Marmat al-Madina dengan memecahkan batu-batunya di Marmat, tetapi dia dipecat sebelum selesai dibangun."
