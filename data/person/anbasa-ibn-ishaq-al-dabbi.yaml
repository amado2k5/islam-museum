summary:
  ar: "عند البلاذري في رواية المقريزي: أمير مصر كتب إليه المتوكل بإعانة محمد القمي في حرب البجة فقام بما يحتاج إليه. وقبل ذلك كان عامل المعتصم على السند فهدم أعلى منارة بد الديبل وجعل فيها سجناً وابتدأ في مرمة المدينة بما نقض من حجارتها فعزل قبل استتمام ذلك."
  en: "In al-Baladhuri via al-Maqrizi's version: Egypt's amir, to whom al-Mutawakkil wrote ordering aid for Muhammad al-Qummi in the Buja war — he supplied what he needed. Earlier, as al-Mu'tasim's Sind governor, he razed Daybul's temple-tower for a prison and began the city's repair with its stones before dismissal."
