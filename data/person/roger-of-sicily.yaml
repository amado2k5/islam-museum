summary:
  ar: "صاحب صقلية أيام دولة المعز بن باديس وولده؛ نزلت أساطيله إلى المهدية في ثلاثمائة مركب وعليها جرجي بن ميخائيل الأنطاكي سنة 543هـ فاستولى على بلاد الساحل كلها ووضع على أهلها الجري حتى استنقذهم عبد المؤمن شيخ الموحدين {cite:tarikh-ibn-khaldun-ibar p. 1635-1636}."
  en: "Lord of Sicily (Roger II); his fleets took Mahdiyya in 543 under George of Antioch and he imposed the jarī tax on the coastal towns until Abd al-Mu'min the Almohad recovered them {cite:tarikh-ibn-khaldun-ibar p. 1635-1636}."
  ur: "صقلیہ کے حکمران جن کے بیڑوں نے جرجی بن میخائیل انطاکی کی قیادت میں 543 ہجری میں مہدیہ پر قبضہ کیا اور ساحلی شہروں پر محصول عائد کیا؛ بعد میں عبد المؤمن نے یہ علاقے واپس لیے، جیسا کہ ابن خلدون بیان کرتے ہیں۔ {cite:tarikh-ibn-khaldun-ibar}"
