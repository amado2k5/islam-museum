label: { ar: "زيد بن الحسن بن علي" }
gender: male
roles: [scholar]
summary:
  ar: "ذكر الكتاب أنه كتب من المدينة إلى الوليد بن عبد الملك موافقته على خلع سليمان خوفاً من الوليد، فلما استُخلف سليمان أمر واليه بالمدينة أن يسأله عن الكتاب، فلما اعترف به أمر سليمان بضربه مئة سوط وإمشائه حافياً، فحبس عمر بن عبد العزيز الرسول وقال إنه لا يخرج حتى يكلّم الخليفة، فمرض سليمان، وأفضى الأمر إلى عمر فمزّق الكتاب {cite:salabi-umayyad-state-2020 p.182-183}."
  tr: "Mektupta, Medine'den Al-Walid bin Abd al-Malik'e yazdığı ve Süleyman'ı el-Velid'den korktuğu için tahttan indirmeyi kabul ettiği belirtiliyordu. Süleyman yerine geçince, Medine'deki valisine mektubu sormasını emretti. Mektubu kabul ettiğinde, Süleyman onu yüz kez kırbaçlanarak çıplak ayakla durdurulmasını emretti. Ömer bin Abdülaziz elçiyi hapse attı ve halifeyle konuşmadan ayrılmayacağını söyledi. Süleyman hastalandı ve olay Ömer'e yol açtı, mektup yırtıldı {cite:Salabi-Umayyad-state-2020, s.182-183}."
  id: "Surat itu menyebutkan bahwa ia menulis dari Madinah kepada Al-Walid ibn Abd al-Malik setuju untuk menggulingkan Sulayman karena takut pada al-Walid. Ketika Sulayman menggantikannya, ia memerintahkan gubernurnya di Madinah untuk menanyakan tentang surat itu. Ketika ia mengakuinya, Sulayman memerintahkan agar ia dicambuk seratus kali dan dipaksa bertelanjang kaki. Umar ibn Abd al-Aziz memenjarakan utusan itu dan mengatakan ia tidak akan pergi sampai berbicara dengan khalifah. Sulayman jatuh sakit, dan masalah itu membawa kepada Umar dan surat itu robek {cite:salabi-umayyad-state-2020, hlm.182-183}."
