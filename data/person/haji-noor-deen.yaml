  ar: خطاط صيني مسلم من قومية هوي وُلد سنة 1963 في شاندونغ؛ أستاذ الخط الصيني الإسلامي ⁦(الصيني)⁩، يدمج القواعد العربية بروح الخط الصيني، ودُرّب في مصر وأُقيمت له معارض في العالم ويُلقّب بأستاذ الخط الصيني
