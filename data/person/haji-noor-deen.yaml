  fr: "Maître calligraphe musulman chinois (Hui) né dans le Shandong en 1963; principal praticien du Sini, la calligraphie islamique de style chinois qui fusionne les règles de l'écriture arabe avec l'esthétique du pinceau chinois, il s'est formé en Égypte et expose dans le monde entier."
