summary:
  ar: "المولى حميد أفندي مفتي التخت السلطاني بعد مولانا أبي السعود؛ قال في الكواكب: وكان من جملة الفضلاء الأدباء، وكان كثير الصدقة شديد النصرة للحق، وكان عليلاً إلى أن مات في بداية شعبان {cite:shadharat-dhahab p. 408}."
  en: "Molla Hamid Afandi — Abu al-Su'ud's successor as mufti of the Sultanic seat; 'among the excellent men of letters, lavish in alms, fierce for the right,' chronically ill until he died at the start of Sha'ban 985 {cite:shadharat-dhahab p. 408}."
  es: "Molla Hamid Afandi, sucesor de Abu al-Su'ud como muftí de la sede del sultán; 'entre los excelentes hombres de letras, pródigo en limosnas, feroz por lo correcto', enfermo crónico hasta que murió al comienzo de Sha'ban 985 {cita: shadharat-dhahab p. 408}."
  fr: "Molla Hamid Afandi — successeur d'Abu al-Su'ud comme mufti du siège sultanique; 'parmi les excellents hommes de lettres, prodigués en aumônes, farouches pour le droit', malade chronique jusqu'à sa mort au début de Sha'ban 985 {cite: shadharat-dhahab p. 408}."
