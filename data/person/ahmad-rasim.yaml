summary:
  ar: "أحمد راسم، كاتب تركي وصحفي ومؤرخ، ولد في سارغوزل بالفاتح في إسطنبول سنة 1864م، وتوفي في جزيرة هيبيلي أدا سنة 1932م. كتب نحو مئة وأربعين عملًا في الرواية والقصة والتاريخ والمقالات، ومنها «ضياء الحياة»، و«تاريخ عثماني»، و«رسائل المدينة» عن حياة إسطنبول القديمة، وكان نائبًا عن إسطنبول من 1927م {cite:encyclopaedia-of-islam-2 vol. 1 p. 315}."
  en: "Ahmad Rasim, Turkish writer, journalist and historian, born at Sarigüzel in Fatih, Istanbul, in 1864, and died on Heybeliada on 21 September 1932. He wrote about 140 works, including novels, historical compilations, the 'City Letters' describing old Istanbul, and a deputy's seat for Istanbul from 1927 {cite:encyclopaedia-of-islam-2 vol. 1 p. 315}."
  es: "Ahmad Rasim, escritor, periodista e historiador turco, nació en Sarigüzel, en Fatih, Estambul, en 1864 y falleció en Heybeliada el 21 de septiembre de 1932. Escribió alrededor de 140 obras, entre ellas novelas, compilaciones históricas, las \"Cartas de la Ciudad\" que describen el antiguo Estambul, y fue diputado por Estambul desde 1927 {cite:encyclopaedia-of-islam-2 vol. 1 p. 315}."
  fr: "Ahmad Rasim, écrivain, journaliste et historien turc, né à Sarigüzel dans le quartier de Fatih à Istanbul en 1864, et mort à Heybeliada le 21 septembre 1932. Il a écrit environ 140 œuvres, dont des romans, des compilations historiques, les « Lettres de la ville » décrivant le vieux Istanbul, et a été député d'Istanbul à partir de 1927 {cite:encyclopaedia-of-islam-2 vol. 1 p. 315}."
  ur: "احمد راسیم، ترک مصنف، صحافی اور تاریخ دان، 1864 میں فتح، استنبول کے سرگوزیل میں پیدا ہوئے، اور 21 ستمبر 1932 کو ہیبیلیدا میں انتقال کر گئے۔ انہوں نے تقریباً 140 کام لکھے، جن میں ناول، تاریخی تالیفات، 'سٹی لیٹرز' شامل ہیں جو استنبول اور استنبول کی ایک قدیم نشست کو بیان کرتے ہیں۔ {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 315}۔"
