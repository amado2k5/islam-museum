summary:
  ar: "أحمد راسم، كاتب تركي وصحفي ومؤرخ، ولد في سارغوزل بالفاتح في إسطنبول سنة 1864م، وتوفي في جزيرة هيبيلي أدا سنة 1932م. كتب نحو مئة وأربعين عملًا في الرواية والقصة والتاريخ والمقالات، ومنها «ضياء الحياة»، و«تاريخ عثماني»، و«رسائل المدينة» عن حياة إسطنبول القديمة، وكان نائبًا عن إسطنبول من 1927م {cite:encyclopaedia-of-islam-2 vol. 1 p. 315}."
  en: "Ahmad Rasim, Turkish writer, journalist and historian, born at Sarigüzel in Fatih, Istanbul, in 1864, and died on Heybeliada on 21 September 1932. He wrote about 140 works, including novels, historical compilations, the 'City Letters' describing old Istanbul, and a deputy's seat for Istanbul from 1927 {cite:encyclopaedia-of-islam-2 vol. 1 p. 315}."
