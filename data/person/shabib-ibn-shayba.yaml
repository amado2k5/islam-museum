summary:
  ar: "أبو معمر شبيب بن شيبة الخطيب المنقري البصري؛ حدث عن الحسن ومعاوية بن قرة وعطاء بن أبي رباح وروى عنه عيسى بن يونس وأبو بدر شجاع بن الوليد؛ كان له لسان وفصاحة؛ قدم بغداد في أيام المنصور فاتصل به وبالمهدي من بعده وكان كريماً عليهما أثيراً عندهما؛ وكانت بينه وبين خالد بن صفوان منافسة في الخطابة {cite:wafayat-ayan}."
  en: "Abu Ma'mar Shabib b. Shayba of Basra — celebrated preacher and orator with famous eloquence; attached to al-Mansur and al-Mahdi at Baghdad; rival of the orator Khalid b. Safwan {cite:wafayat-ayan}."
  es: "Abu Ma'mar Shabib b. Shayba de Basora — célebre predicador y orador de famosa elocuencia; vinculado a al-Mansur y al-Mahdi en Bagdad; rival del orador Khalid b. Safwan {cite:wafayat-ayan}."
  fr: "Abu Ma'mar Shabib b. Shayba de Bassora — célèbre prédicateur et orateur à l'éloquence renommée; attaché à al-Mansur et al-Mahdi à Bagdad; rival de l'orateur Khalid b. Safwan {cite:wafayat-ayan}."
  ur: "ابو معمر شبیب ب۔ بصرہ کی شیبہ - مشہور فصاحت کے ساتھ مشہور مبلغ اور خطیب؛ بغداد میں المنصور اور المہدی سے منسلک؛ مقرر کے حریف خالد بی۔ صفوان {حوالہ: وفایت-عیان}۔"
  tr: "Ebu Mu'ammar Şabib bin Şeybah el-Hatib el-Münkari el-Basri'den; el-Hasan, Muaviye bin Kurra, Ata ibn Ebi Rabah'tan ve ondan İsa ibn Yunus ile Ebu Bedr Şuca' ibn al-Walid'den rivayet etti; etkileyici ve etkileyici bir hitabetti; el-Mansur döneminde Bağdat'a geldi, onunla ve ondan sonra el-Mehdi ile bağlantı kurdu, onlara cömert ve saygı duyulandı. Kendisi ile Halid bin Safvan arasında hitabette rekabet vardı."
  id: "Abu Mu'ammar Shabib ibn Shaybah al-Khatib al-Munqari al-Basri; diceritakan dari al-Hasan, Muawiyah ibn Qurra, Ata ibn Abi Rabah, dan dari beliau Isa ibn Yunus dan Abu Badr Shuja' ibn al-Walid; ia fasih dan fasih; ia datang ke Baghdad pada masa al-Mansur dan berhubungan dengannya serta al-Mahdi setelahnya, serta bersikap murah hati dan dihormati oleh mereka. Ada persaingan antara ia dan Khalid ibn Safwan dalam pidato."
