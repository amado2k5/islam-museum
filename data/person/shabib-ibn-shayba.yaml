  ar: "أبو معمر شبيب بن شيبة الخطيب المنقري البصري؛ حدث عن الحسن ومعاوية بن قرة وعطاء بن أبي رباح وروى عنه عيسى بن يونس وأبو بدر شجاع بن الوليد؛ كان له لسان وفصاحة؛ قدم بغداد في أيام المنصور فاتصل به وبالمهدي من بعده وكان كريماً عليهما أثيراً عندهما؛ وكانت بينه وبين خالد بن صفوان منافسة في الخطابة {cite:wafayat-ayan}."
