summary:
  ar: "تميم بن حمد آل ثاني (وُلد 3 يونيو 1980) أمير قطر منذ 25 يونيو 2013، وثامن أمرائها وأحد أصغر الملوك سنًا في العالم عند تولّيه. تعلّم في بريطانيا وتخرّج في ساندهيرست سنة 1998، وصار وليًا للعهد سنة 2003 بعد تنازل أخيه الأكبر جاسم عن الولاية، ثم تسلّم الحكم بتنازل والده حمد بن خليفة في خطوة غير مسبوقة في الخليج. شهد عهده كأس العالم 2022، والأزمة الدبلوماسية مع جيرانه (2017–2021)، وأول انتخابات لمجلس الشورى سنة 2021، ووساطات قطرية متكررة في نزاعات المنطقة."
  en: "Tamim bin Hamad Al Thani (born 3 June 1980) is the Emir of Qatar since 25 June 2013, its eighth emir and one of the world's youngest monarchs at his accession. Educated in Britain, he graduated from Sandhurst in 1998, became heir apparent in 2003 after his elder brother Jassim renounced the claim, and received power by his father Hamad bin Khalifa's abdication, a step without Gulf precedent. His reign has seen the 2022 FIFA World Cup, the diplomatic crisis with Qatar's neighbours (2017–2021), the first Shura Council elections in 2021, and repeated Qatari mediation in the region's conflicts."
  ur: "تمیم بن حمد آل ثانی (پیدائش 3 جون 1980ء) 25 جون 2013ء سے قطر کے امیر ہیں، مملکت کے آٹھویں امیر اور تخت نشینی کے وقت دنیا کے کم عمر ترین بادشاہوں میں سے ایک۔ برطانیہ میں تعلیم پائی اور 1998ء میں سینڈہرسٹ سے فارغ ہوئے، 2003ء میں اپنے بڑے بھائی جاسم کے دستبردار ہونے پر ولی عہد بنے، پھر والد کی دستبرداری سے امیر ہوئے۔ ان کے دور میں 2022ء فیفا عالمی کپ، 2017ء تا 2021ء سفارتی بحران اور 2021ء میں مجلسِ شوریٰ کے پہلے انتخابات ہوئے۔"
