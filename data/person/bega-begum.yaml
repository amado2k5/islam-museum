summary:
  ar: "بطاقة أولية لحاجة بيگة بيگم، زوجة همام الكبرى التي بنت ضريحه في دلهي وعمرتها، توفيت سنة ١٥٨٢م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Haji Bega Begum, Humayun's senior wife who built and endowed his tomb in Delhi, d. 1582; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Haji Bega Begum, la esposa principal de Humayun, quien construyó y financió su tumba en Delhi, fallecida en 1582; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature pour Haji Bega Begum, épouse principale d'Humayun qui fit construire et dota son tombeau à Delhi, décédée en 1582; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "ہمایوں کی سینئر اہلیہ حاجی بیگا بیگم کے لیے ڈرافٹ کارڈ جس نے دہلی میں اس کا مقبرہ بنایا اور اسے عطا کیا۔ 1582; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Delhi'de türbesini inşa eden ve gerçekleştiren Hammam'ın eşi Hacı Bega Begüm'ün ön kartı 1582 yılında ölmüştür; önemli kişilerin sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Hajja Bega Begum, istri Hammam yang Agung, yang membangun dan melaksanakan makamnya di Delhi, meninggal pada tahun 1582 M; ia disebutkan dalam kamus tokoh-tokoh terkenal dan biografinya belum pernah ditinjau di halaman tersebut."
