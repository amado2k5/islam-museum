summary:
  ar: "أحد الأولياء التسعة في جاوة، ابن سونن أمبل وتلميذه وأخو سونن بونانغ الأصغر. اشتهر بفلسفته الاجتماعية في محاربة الفقر قبل الدعوة: العمل الجاد والكرم والرعاية بالأيتام والفقراء، حتى لخّص مذهبه في الحكم المنقوشة على درجات مقامه في لامونغان، ومركزها الصلوات الخمس وإطعام الجائع وكسوة العاري وإيواء المشرّد. لحّن التمبانغ الموتشابات «بنكور» ونشر الإسلام بالغاملان، وأقام مدرسة داخلية (بيسانترين) في درجات، ومنحه رادين فاتح لقب سونن مايانغ مادو سنة 1520."
  en: "One of the nine Wali Songo of Java, son and student of Sunan Ampel and younger brother of Sunan Bonang. He is remembered for a social philosophy that put fighting poverty before preaching — hard work, generosity and care for orphans and the poor — summed up in the maxims carved on the steps of his tomb complex at Lamongan, centred on the five daily prayers and on feeding the hungry, clothing the naked and sheltering the exposed. He composed the macapat tembang Pangkur, spread Islam through the gamelan, founded a pesantren at Drajat, and received the title Sunan Mayang Madu from Raden Patah in 1520."
  ur: "جاوا کے نو اولیا (ولی سونگو) میں سے ایک، سونن امپل کے بیٹے اور شاگرد اور سونن بونانگ کے چھوٹے بھائی۔ وہ اپنی سماجی فلسفے کے لیے مشہور ہیں جس میں تبلیغ سے پہلے غربت کا خاتمہ تھا: سخت محنت، سخاوت اور یتیموں و فقیروں کی دیکھ بھال، جو لامونگان میں ان کے مزار کی سیڑھیوں پر کندہ حکمتوں میں خلاصہ ہے اور جس کا مرکز پانچ وقت کی نماز اور بھوکے کو کھانا، ننگے کو لباس اور بے سہارا کو پناہ دینا ہے۔ انھوں نے مچاپت تمبانگ ”پنکور“ ترتیب دیا، گاملان کے ذریعے اسلام پھیلایا، درجات میں ایک پیسانترین قائم کیا اور 1520ء میں رادین پاتاہ سے سونن مایانگ مادو کا لقب پایا۔"

