summary:
  ar: "كيميائي عضوي باكستاني وُلد في دلهي سنة 1942، أستاذ فخري في المركز الدولي للعلوم الكيميائية والبيولوجية بجامعة كراتشي. شغل منصب وزير العلوم والتكنولوجيا الاتحادي (2000–2002) ثم وزير التعليم (2002)، ورأس هيئة التعليم العالي (2002–2008). زميل الجمعية الملكية، ونال نشان الامتياز وجائزة اليونسكو للعلوم سنة 1999، ويُعرف بأبحاثه في كيمياء المنتجات الطبيعية."
  en: "Pakistani organic chemist born in Delhi in 1942, professor emeritus at the International Center for Chemical and Biological Sciences at the University of Karachi. He served as federal minister of science and technology (2000–2002) and of education (2002), and chaired the Higher Education Commission (2002–2008). A Fellow of the Royal Society, he received the Nishan-e-Imtiaz and the UNESCO Science Prize (1999), and is known for natural-product chemistry."
  ur: "پاکستانی نامیاتی کیمیا دان جو 1942ء میں دہلی میں پیدا ہوئے، کراچی یونیورسٹی کے بین الاقوامی مرکز برائے کیمیائی و حیاتیاتی علوم میں پروفیسر ایمریٹس ہیں۔ وہ وفاقی وزیر برائے سائنس و ٹیکنالوجی (2000ء–2002ء) اور وزیر تعلیم (2002ء) رہے اور ہائر ایجوکیشن کمیشن کے چیئرمین (2002ء–2008ء) بھی رہے۔ رائل سوسائٹی کے فیلو، نشان امتیاز اور 1999ء میں یونیسکو سائنس پرائز کے حامل، وہ قدرتی مصنوعات کی کیمسٹری کے لیے جانے جاتے ہیں۔"
