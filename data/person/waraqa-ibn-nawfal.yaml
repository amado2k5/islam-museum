summary:
  en: "Khadija's cousin, an elderly Meccan Christian who had studied the scriptures; the man who first told the shaken Prophet that what had come to him in the cave was prophecy."
  ar: "ابن عم خديجة، شيخ مكي نصراني كان يكتب الكتاب العبراني فيكتب من الإنجيل بالعبرانية، وقد عمي وكبر؛ هو أول من قال للنبي المرتجف إن ما جاءه في الغار هو النبوة: «هذا الناموس الذي نزّل الله على موسى»، وقال «يا ليتني فيها جذعاً، ليتني أكون حياً إذ يخرجك قومك» فقال «أو مخرجيّ هم؟» قال «نعم، لم يأتِ رجل قط بمثل ما جئت به إلا عُودي، وإن يدركني يومك أنصرك نصراً مؤزراً» ثم لم ينشب أن توفي وفتر الوحي {cite:sahih-al-bukhari 3}."
  es: "El primo de Khadija, un anciano cristiano de La Meca que había estudiado las escrituras; el hombre que primero le dijo al profeta, visiblemente conmocionado, que lo que le había llegado en la cueva era una profecía."
  fr: "Le cousin de Khadija, un chrétien mecquois âgé qui avait étudié les Écritures; l'homme qui, le premier, annonça au Prophète ébranlé que ce qui lui était apparu dans la grotte était une prophétie."
  ur: "خدیجہ کا کزن، ایک بزرگ مکی عیسائی جس نے صحیفوں کا مطالعہ کیا تھا۔ وہ شخص جس نے سب سے پہلے ہلائے ہوئے نبی کو بتایا کہ جو کچھ اس کے پاس غار میں آیا ہے وہ نبوت ہے۔"
  tr: "Hadijah'ın kuzeni, İbranice kutsal metinleri İbranice yazan Mekkeli Hristiyan şeyhi, kör oldu ve yaşlandı; titreyen peygambere mağarada kendisine gelenin kehanet olduğunu ilk söyleyen oydu: \"Bu, Allah'ın Musa'ya vahyettiği yasadır,\" ve dedi ki, \"Keşke içinde bir sandık olsaydım, keşke halkın seni çıkardığında hayatta olsaydım.\" dedi. Dedi ki, \"Yoksa seni çıkaranlar onlar mı?\" Dedi ki: \"Evet, kimse benim getirdiğim sopa dışında aynı şeyi getirmedi, eğer gününüz beni yakalarsa, kesin bir zaferle destekleyeceğim.\" Sonra o öldüğünde ve vahiy kesildiğinde bu yasa patlamadı. {cite:sahih-al-bukhari 3}."
  id: "Sepupu Khadijah, seorang sheikh Kristen Mekah yang biasa menulis kitab suci Ibrani, menulis dari Alkitab dalam bahasa Ibrani, dan dia menjadi buta dan menua; dia adalah yang pertama memberitahu nabi yang gemetar bahwa apa yang datang kepadanya di gua itu adalah nubuat: \"Inilah hukum yang Allah wahyukan kepada Musa,\" dan dia berkata, \"Aku berharap aku menjadi peti di dalamnya, aku berharap aku hidup saat umatmu membawamu keluar.\" Dia berkata, \"Atau apakah mereka yang membawamu keluar?\" Dia berkata: \"Ya, tidak ada seorang pun yang pernah datang dengan yang sama seperti yang aku bawa kecuali tongkatku, dan jika harimu menangkapku, aku akan mendukungmu dengan kemenangan yang tegas.\" Kemudian itu tidak pecah ketika dia meninggal dan wahyu itu terhenti. {cite:sahih-al-bukhari 3}."
