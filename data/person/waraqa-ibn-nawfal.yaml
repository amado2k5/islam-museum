  en: "Khadija's cousin, an elderly Meccan Christian who had studied the scriptures; the man who first told the shaken Prophet that what had come to him in the cave was prophecy."
  ar: "ابن عم خديجة، شيخ مكي نصراني كان يكتب الكتاب العبراني فيكتب من الإنجيل بالعبرانية، وقد عمي وكبر؛ هو أول من قال للنبي المرتجف إن ما جاءه في الغار هو النبوة: «هذا الناموس الذي نزّل الله على موسى»، وقال «يا ليتني فيها جذعاً، ليتني أكون حياً إذ يخرجك قومك» فقال «أو مخرجيّ هم؟» قال «نعم، لم يأتِ رجل قط بمثل ما جئت به إلا عُودي، وإن يدركني يومك أنصرك نصراً مؤزراً» ثم لم ينشب أن توفي وفتر الوحي {cite:sahih-al-bukhari 3}."
