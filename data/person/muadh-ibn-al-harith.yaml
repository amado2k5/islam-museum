  ar: "صحابي خزرجي من بني النجار يعرف بأبي حليمة وكان يقال له القارئ؛ شهد الخندق ولم يدرك من حياة النبي إلا ست سنين، وشهد الجسر مع أبي عبيدة، وقُتل يوم الحرة."
