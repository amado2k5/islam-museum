gender: male
summary:
  ar: "صحابي خزرجي من بني النجار يعرف بأبي حليمة وكان يقال له القارئ؛ شهد الخندق ولم يدرك من حياة النبي إلا ست سنين، وشهد الجسر مع أبي عبيدة، وقُتل يوم الحرة."
  en: "A Khazraji Companion of Banu al-Najjar known as Abu Halima and called al-Qari; he witnessed the Trench and caught only six years of the Prophet's lifetime, was at al-Jisr with Abu Ubayda, and was killed at al-Harra."
  ur: "بنو نجار کا خزرجی صحابی، ابو حلیمہ کہلاتا اور القاری بھی کہا جاتا؛ خندق میں شریک اور نبی کے ساتھ صرف چھ برس پایا۔"
  es: "Un compañero Khazraji de Banu al-Najjar conocido como Abu Halima y llamado al-Qari; presenció la Batalla de la Trinchera y solo capturó seis años de la vida del Profeta, estuvo en al-Jisr con Abu Ubayda y fue asesinado en al-Harra."
  fr: "Un compagnon khazraji des Banu al-Najjar connu sous le nom d'Abu Halima et appelé al-Qari; il a été témoin du Fossé et n'a vécu que six ans de la vie du Prophète, était à al-Jisr avec Abu Ubayda, et a été tué à al-Harra."
  tr: "Banu el-Necer'den bir hazraci sahabe, Ebu Halima olarak biliniyordu ve Qari olarak anılırdı; hendeğe tanık oldu ve Peygamber'in yaşamından altı yıl sonra oraya ulaştı, Ebu Ubeyde ile köprüyü gördü ve Harrah günü öldürüldü."
  id: "Seorang sahabat Khazraji dari Banu al-Najjar yang dikenal sebagai Abu Halima dan disebut Qari; ia menyaksikan parit itu dan baru sampai enam tahun setelah Nabi hidup, menyaksikan jembatan dengan Abu Ubaidah, dan tewas pada hari Al-Harrah."
