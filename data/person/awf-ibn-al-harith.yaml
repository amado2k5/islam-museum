summary:
  ar: 'هو عوف بن عفراء، أخو معاذ ومعوذ، من بني النجار؛ شهد بدراً وسأل النبي يومها: ما يضحك الرب من عبده؟ فقال: «أن يراه قد غمس يده في القتال حاسراً»، فنزع درعه وتقدم فقاتل حتى قُتل شهيداً.'
  en: He is Awf ibn Afra', brother of Mu'adh and Mu'awwidh, of Banu al-Najjar; he was at Badr and asked the Prophet that day what makes the Lord laugh at His servant, and he answered that it is to see him plunge his hand into the fight without
    armour, so he took off his armour, went forward and fought until he was killed as a martyr.
