summary:
  ar: "مترجم إيطالي من تيفولي ازدهر في برشلونة في النصف الأول من القرن الثاني عشر للميلاد، نقل من العربية إلى اللاتينية زيج البتاني وكرات ثاوذوسيوس ورسائل في التنجيم والأسطرلاب، ومن العبرية كتاب المساحة لأبراهام بر حيا {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 65}."
  en: "A translator from Tivoli who flourished at Barcelona in the first half of the twelfth century, rendering into Latin from Arabic al-Battani's Zij, Theodosius' Spherics and works on astrology and the astrolabe, and from Hebrew Savasorda's Liber embadorum {cite:nallino-albatenii-opus-astronomicum p. 59} {cite:nallino-albatenii-opus-astronomicum p. 65}."
  ur: "تیفولی کے ایک مترجم جو بارہویں صدی عیسوی کے نصفِ اول میں برشلونہ میں سرگرم رہے؛ انہوں نے عربی سے لاطینی میں البتانی کی زیج، ثاوذوسیوس کی کریات اور نجوم و اسطرلاب کے رسائل، اور عبرانی سے ابراہام بر حیا کی کتاب المساحت ترجمہ کی {cite:nallino-albatenii-opus-astronomicum p. 65}."
