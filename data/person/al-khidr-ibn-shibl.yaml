names:
  - { value: "خطيب دمشق أبو البركات الخضر بن شبل بن عبد الله الحارثي الدمشقي", kind: full }
summary:
  ar: "خطيب دمشق أبو البركات الخضر بن شبل الحارثي الدمشقي الفقيه الشافعي؛ درّس بالغزالية والمجاهدية وبنى له نور الدين مدرسته التي عند باب الفرج فدرّس بها وتعرف الآن بالعمادية لأن العماد الكاتب درّس بها بعده فاشتهرت به؛ كان واسع الحفظ ثبتاً في الرواية ذا ثروة ظاهرة وعالماً بالمذهب يتكلم في الأصول والخلاف، مولده سنة ست وثمانين وأربعمائة وتوفي في ذي القعدة سنة اثنتين وستين ودفن بباب الفراديس {cite:shadharat-dhahab p. 685-686}."
  en: "Abu al-Barakat al-Khidr ibn Shibl, khatib of Damascus, Shafi'i jurist; he lectured at the Ghazaliyya and Mujahidiyya, and Nur al-Din built him the madrasa by Bab al-Faraj — now called the Imadiyya after al-Imad the Katib who lectured after him; wide in memory, firm in transmission, master of the madhhab and the khilaf; b. 486, d. Dhu al-Qa'da 562, buried at Bab al-Faradis {cite:shadharat-dhahab p. 685-686}."
  es: "Abu al-Barakat al-Khidr ibn Shibl, khatib de Damasco, jurista shafi'i; dio conferencias en Ghazaliyya y Mujahidiyya, y Nur al-Din construyó para él la madrasa de Bab al-Faraj, ahora llamada Imadiyya en honor a al-Imad el Katib, quien dio conferencias después de él; amplio en memoria, firme en transmisión, maestro del madhab y del khilaf; b. 486, d. Dhu al-Qa'da 562, enterrado en Bab al-Faradis {citado: shadharat-dhahab p. 685-686}."
  fr: "Abu al-Barakat al-Khidr ibn Shibl, khatib de Damas, juriste shafi'ite; il a enseigné à la Ghazaliyya et à la Mujahidiyya, et Nur al-Din a construit pour lui la madrasa de Bab al-Faraj – maintenant appelée l'Imadiyya en l'honneur d'al-Imad le Katib qui a enseigné après lui; large en mémoire, ferme dans la transmission, maître du madhhab et du khilaf; b. 486, d. Dhu al-Qa'da 562, enterré à Bab al-Faradis {cité: shadharat-dhahab p. 685-686}."
  ur: "ابو البرکات الخضر بن شبل، دمشق کے خطیب، شافعی فقیہ؛ اس نے غزالیہ اور مجاھدیہ میں لیکچر دیا، اور نورالدین نے اسے باب الفراج کے ذریعے مدرسہ بنایا - اب عمادیہ کو العماد کاتب کے بعد کہا جاتا ہے جو اس کے بعد لیکچر دیتے تھے۔ حافظہ میں وسیع، نشر و اشاعت میں پختہ، مکتب اور خلافت کا مالک؛ ب 486، ڈی. ذوالقعدہ 562، باب الفرادیس میں مدفون 685-686}۔"
  tr: "Şam'ın vaizi Ebu el-Barakat el-Hidr bin Şibl el-Harti el-Dimashqi, Şafii hukukçu, Gazeliye ve Mücahitler arasında eğitim aldı ve Nur al-Din Bab al-Faraj yakınlarında okulunu kurdu, burada ders verdi ve şimdi el-İmadiyye olarak bilinir çünkü el-İmad el-Katib ondan sonra orada eğitim görmüş ve bu nedenle ünlü olmuştur. Geniş bir hafızasına, kanıtlanmış bir rivayete ve düşünce okulunun açık bir âlimiydi; hem ilkelerde hem de anlaşmazlıklarda ilkeleri ve anlaşmazlıkları tartışırdı. 486 Hicri yılında doğdu, 62 yılında Zhu'd-Kı'dah'ta öldü ve Bab al-Faradis'te defnedildi {atıf: shadharat-dhahab, s. 685-686}."
  id: "Pengkhotbah Damaskus, Abu al-Barakat al-Khidr ibn Shibl al-Harthi al-Dimashqi, ahli hukum Shafi'i, belajar di Ghazaliyya dan Mujahidin, dan Nur al-Din membangun sekolahnya dekat Bab al-Faraj, tempat ia mengajar, dan kini dikenal sebagai al-Imadiyya karena al-Imad al-Katib belajar di sana setelahnya, sehingga terkenal karenanya. Ia memiliki ingatan yang luas, narasi yang terbukti, dan seorang ulama yang jelas dalam aliran pemikiran tersebut, membahas prinsip dan perbedaan pendapat baik dalam prinsip maupun perbedaan pendapat. Ia lahir pada tahun 486 H, meninggal di Dhu al-Qi'dah pada tahun 62, dan dimakamkan di Bab al-Faradis {cite:shadharat-dhahab, hlm. 685-686}."
