summary:
  ar: "خطيب دمشق أبو البركات الخضر بن شبل الحارثي الدمشقي الفقيه الشافعي؛ درّس بالغزالية والمجاهدية وبنى له نور الدين مدرسته التي عند باب الفرج فدرّس بها وتعرف الآن بالعمادية لأن العماد الكاتب درّس بها بعده فاشتهرت به؛ كان واسع الحفظ ثبتاً في الرواية ذا ثروة ظاهرة وعالماً بالمذهب يتكلم في الأصول والخلاف، مولده سنة ست وثمانين وأربعمائة وتوفي في ذي القعدة سنة اثنتين وستين ودفن بباب الفراديس {cite:shadharat-dhahab p. 685-686}."
  en: "Abu al-Barakat al-Khidr ibn Shibl, khatib of Damascus, Shafi'i jurist; he lectured at the Ghazaliyya and Mujahidiyya, and Nur al-Din built him the madrasa by Bab al-Faraj — now called the Imadiyya after al-Imad the Katib who lectured after him; wide in memory, firm in transmission, master of the madhhab and the khilaf; b. 486, d. Dhu al-Qa'da 562, buried at Bab al-Faradis {cite:shadharat-dhahab p. 685-686}."
