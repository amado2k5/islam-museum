summary:
  ar: "قيادية أمريكية في «أمة الإسلام» (1899–1972)، زوجة زعيمها إلايجا محمد، عرّفته بتعاليم مؤسس الحركة دبليو. دي. فارد، وقادت المنظمة أثناء غياب زوجها بين 1935 و1946، وساعدت في إنشاء مدارس «جامعة الإسلام» التي سُمّيت لاحقًا باسمها."
  en: "American leader in the Nation of Islam (1899–1972), wife of its leader Elijah Muhammad. She introduced her husband to the teachings of the movement's founder W. D. Fard, guided the organisation during her husband's absence from 1935 to 1946, and helped establish the University of Islam schools, later renamed in her honour."
  ur: "نیشن آف اسلام کی امریکی رہنما (1899–1972)، اس کے رہنما ایلیاہ محمد کی اہلیہ۔ انہوں نے اپنے شوہر کو تحریک کے بانی ڈبلیو ڈی فارڈ کی تعلیمات سے متعارف کرایا، 1935 سے 1946 تک اپنے شوہر کی غیر موجودگی میں تنظیم کی رہنمائی کی، اور یونیورسٹی آف اسلام اسکولوں کے قیام میں مدد کی، جن کا نام بعد میں ان کے اعزاز میں رکھا گیا۔"
