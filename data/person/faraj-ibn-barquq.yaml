id: person/faraj-ibn-barquq
class: person
label: { ar: "الملك الناصر فرج بن برقوق" }
summary:
  ar: "سلطان مملوكي جركسي ابن برقوق، أقيم مكان أبيه في السلطنة لما مات في شوال سنة إحدى وثمان مئة ولقب الناصر فاستمر إلى سادس ربيع الأول سنة ثمان وثمان مئة فخلع وأقيم أخوه عبد العزيز ولقب المنصور ثم خلع في رابع جمادى الآخرة وأعيد الناصر فرج {cite:tarikh-khulafa-minhaj-1434 p. 761}، وخرج لقتال الأمير شيخ فهزم وقتل فبويع الخليفة المستعين بالسلطنة مضافة للخلافة {cite:tarikh-khulafa-minhaj-1434 p. 765}."
  en: "Barquq's son and heir (801), deposed in 808 for his brother Abd al-Aziz then restored the same year {cite:tarikh-khulafa-minhaj-1434 p. 761}."
  es: "El hijo y heredero de Barquq (801), depuesto en 808 por su hermano Abd al-Aziz, fue restaurado ese mismo año {cite:tarikh-khulafa-minhaj-1434 p. 761}."
  fr: "Le fils et héritier de Barquq (801), déposé en 808 pour son frère Abd al-Aziz puis rétabli la même année {cite:tarikh-khulafa-minhaj-1434 p. 761}."
  ur: "برقوق کے بیٹے اور وارث (801) نے اپنے بھائی عبد العزیز کے لیے 808 میں معزول کیا اور پھر اسی سال بحال کیا۔ 761}۔"
  tr: "Bir Çerkes Memlük sultanı İbn Barquq, babası 8101 Hicri yılında Şavval'da öldüğünde sultanlığı miras aldı ve El-Nasir unvanını aldı. 8800 yılında Rabi'al-Awwal'ın 6'sına kadar görev yaptı, ardından tahttan indirildi ve kardeşi Abdulaziz Al-Mansur unvanıyla atandı. 4 Cuma el-Ahirah'ta tahttan indirildi ve El-Nasir Faraj yeniden göreve getirildi {cite:History-Khulafa-minhaj-1434 s. 761}. Prens Şeyh ile savaşmaya çıktı, yenildi ve öldürüldü, Halife El-Musta'in ise halifeliğe ek olarak Sultanlığa bağlılık yemini etti {atıf:Tarikh-Khulafa-minhaj-1434, s. 765}."
  id: "Seorang sultan Mamluk Circassian Ibn Barquq, yang menggantikan ayahnya sebagai sultanat ketika ia meninggal di Shawwal pada tahun 8101 H, dan diberi gelar Al-Nasir. Ia menjabat hingga tanggal 6 Rabi' al-Awwal pada tahun 8800, ketika ia digulingkan, dan saudaranya Abdul Aziz diangkat dengan gelar Al-Mansur. Ia digulingkan pada tanggal 4 Jumada al-Akhirah dan diangkat kembali sebagai Al-Nasir Faraj {cite:History-Khulafa-minhaj-1434 hlm. 761}. Ia pergi melawan pangeran Sheikh, dikalahkan dan dibunuh, dan Khalifah Al-Musta'in bersumpah setia kepada Kesultanan sebagai tambahan untuk kekhalifahan {cite:Tarikh-Khulafa-minhaj-1434, hlm. 765}."
