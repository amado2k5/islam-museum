summary:
  ar: "أبو النصر عبد القهار، المعروف بسلطان حاجي (توفي 1687)، سلطان بانتن في جاوة — تعدّه المقالة الإنجليزية من 1682 والإندونيسية من 1683 — أزاح والده أغينغ تيرتايازا في حرب أهلية بدعم شركة الهند الشرقية الهولندية، وقبل سنة 1682 شروطًا أخضعت سياسة بانتن الخارجية وتجارتها للشركة، وخُتمت بمعاهدة 17 نيسان 1684. وتذكر المقالة الأوكرانية، استنادًا إلى موسوعة سوفيتية، أن اسمه «حاجي» جاء من حجّ أدّاه تحقيقًا لمسعى والده في التحالف مع العثمانيين."
  en: "Abu an-Nasr Abd al-Qahhar, known as Sultan Haji (died 1687), was sultan of Banten in Java — counted from 1682 in the English article and from 1683 in the Indonesian — who displaced his father Ageng Tirtayasa in a civil war fought with Dutch East India Company support and accepted the conditions of 1682 that subordinated Banten's foreign policy and trade to the Company, sealed by the treaty of 17 April 1684. The Ukrainian article relates, on a Soviet encyclopedia's authority, that his name Haji came from a pilgrimage to Mecca undertaken for his father's design of an Ottoman alliance."
  ur: "ابو النصر عبد القہار، جو سلطان حاجی کے نام سے معروف ہیں (وفات 1687ء)، جاوا میں بانتن کے سلطان تھے — انگریزی مقالہ ان کا دور 1682ء سے اور انڈونیشیائی 1683ء سے گنتا ہے — جنہوں نے ولندیزی ایسٹ انڈیا کمپنی کی مدد سے خانہ جنگی میں اپنے والد آگینغ تیرتایازا کو ہٹایا اور 1682ء کی وہ شرائط قبول کیں جن سے بانتن کی خارجہ پالیسی اور تجارت کمپنی کے تابع ہو گئی، اور 17 اپریل 1684ء کے معاہدے پر مہر لگی۔ یوکرینی مقالہ ایک سوویت انسائیکلوپیڈیا کے حوالے سے بتاتا ہے کہ ان کا نام «حاجی» مکہ کے اس حج سے پڑا جو انہوں نے اپنے والد کے عثمانی اتحاد کے منصوبے کے لیے کیا تھا۔"

