summary:
  ar: "سياسي ماليزي وأمير من قدح، وُلد في ألور ستر سنة 1903. قاد بصفته رئيس حزب أمنو ائتلاف الاستقلال إلى النصر سنة 1955، وتفاوض على استقلال مالايا عن بريطانيا فأعلنه سنة 1957 أولَ رئيس وزراء للاتحاد، وأشرف على تشكيل ماليزيا سنة 1963 وقادها حتى سنة 1970، وتوفي في كوالالمبور سنة 1990."
  en: "Malaysian statesman and a prince of Kedah, born at Alor Setar in 1903. As president of UMNO he led the Alliance to victory in 1955, negotiated Malaya's independence from Britain and proclaimed it in 1957 as the federation's first prime minister, oversaw the formation of Malaysia in 1963, and led the country until 1970; he died at Kuala Lumpur in 1990."
  ur: "ملائیشیائی سیاست دان اور قدح کے شہزادے، جو 1903ء میں الور سٹار میں پیدا ہوئے۔ امنو کے صدر کی حیثیت سے 1955ء میں اتحاد کو فتح دلائی، برطانیہ سے ملایا کی آزادی کی گفت و شنید کی اور 1957ء میں وفاق کے پہلے وزیرِ اعظم کی حیثیت سے اس کا اعلان کیا، 1963ء میں ملائیشیا کی تشکیل کی نگرانی کی اور 1970ء تک ملک کی قیادت کی؛ 1990ء میں کوالالمپور میں وفات پائی۔"
