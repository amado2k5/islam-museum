summary:
  ar: "شيخ الشافعية؛ ولي التدريس بالنظامية ببغداد وتفقه على أبي إسحاق الشيرازي وابن الصباغ، وانتهت إليه رياسة الشافعية بعد انقراض مشائخه؛ كان يلقب بين الطلبة بالجنيد لشدة ورعه، وصنف «الحلية» للخليفة المستظهر بالله فلقب بالمستظهري، ومن تصانيفه الشافي في شرح الشامل في عشرين مجلداً؛ توفي في شوال سنة سبع وخمسمائة ودفن عند الشيخ أبي إسحاق {cite:shadharat-dhahab p. 496-497}."
  en: "Shaykh of the Shafi'is and Nizamiyya teacher, pupil of Abu Ishaq al-Shirazi and Ibn al-Sabbagh; nicknamed 'the Junayd' by students for his scrupulosity and 'al-Mustazhiri' for the Hilya he composed for caliph al-Mustazhir; d. Shawwal 507, buried beside Abu Ishaq {cite:shadharat-dhahab p. 496-497}."
