summary:
  ar: "عالم هندي (1885–1944) من كاندهلة، من علماء الحركة الديوبندية ومؤسس جماعة التبليغ. درس عند رشيد أحمد الكنكوهي وفي دار العلوم ديوبند عند محمود حسن الديوبندي، وفي أوائل عشرينيات القرن العشرين أعدّ خريجين من ديوبند وسهارانبور وأرسلهم إلى ميوات لتأسيس شبكة من المساجد والمدارس، فنشأت منها جماعة التبليغ التي صارت من أوسع حركات الدعوة في العالم."
  en: "Indian scholar (1885–1944) of Kandhla, a scholar of the Deobandi movement and the founder of the Tablighi Jamaat. He studied under Rashid Ahmad Gangohi and, at Darul Uloom Deoband, under Mahmud Hasan Deobandi, and in the early 1920s he prepared graduates of Deoband and Saharanpur and sent them to Mewat to build a network of mosques and schools, from which the Tablighi Jamaat grew into one of the world's most widespread preaching movements."
  ur: "بھارتی عالم (1885ء–1944ء) جن کا تعلق کاندھلہ سے تھا، دیوبندی تحریک کے عالم اور تبلیغی جماعت کے بانی۔ رشید احمد گنگوہی سے اور دار العلوم دیوبند میں محمود حسن دیوبندی سے تعلیم حاصل کی، اور 1920ء کی دہائی کے اوائل میں دیوبند و سہارنپور کے فارغین کو تیار کر کے میوات بھیجا تاکہ مساجد و مدارس کا جال قائم ہو، جس سے تبلیغی جماعت وجود میں آئی جو دنیا کی وسیع ترین دعوتی تحریکوں میں سے ایک بن گئی۔"
