summary:
  ar: "معلمة وناشرة ومناضلة استقلال هندية (1909–1996)، وُلدت باسم أرونا غانغولي في أسرة بنغالية براهمية، وتزوجت آصف علي سنة 1928. اشتهرت برفعها علم المؤتمر الوطني في ميدان غواليا تانك ببومباي في آب 1942 إذ ترأست بقية دورة «اتركوا الهند»، ثم عملت زمنًا في العمل السري، وأصبحت أول عمدة لدلهي سنة 1958، ونالت بهارات راتنا بعد وفاتها."
  en: "Indian educator, publisher and independence activist (1909–1996), born Aruna Ganguly into a Bengali Brahmin family; she married Asaf Ali in 1928. She is remembered for hoisting the Congress flag at Gowalia Tank Maidan in Bombay in August 1942 as she presided over the remainder of the Quit India session, then worked underground, became Delhi's first mayor in 1958, and received the Bharat Ratna posthumously."
  ur: "ہندوستانی معلمہ، پبلشر اور مجاہد آزادی ⁦(1909ء–1996ء)⁩، پیدائشی نام ارونا گنگولی، ایک بنگالی براہمن خاندان میں پیدا ہوئیں؛ 1928ء میں آصف علی سے شادی کی۔ وہ اگست 1942ء میں بمبئی کے گووالیا ٹینک میدان میں کانگریس کا پرچم لہرانے کے لیے مشہور ہیں، جب انھوں نے ’ہندوستان چھوڑ دو‘ اجلاس کی بقیہ کارروائی کی صدارت کی؛ بعد میں وہ روپوش رہیں، 1958ء میں دہلی کی پہلی میئر بنیں اور بعد از مرگ بھارت رتن سے نوازی گئیں۔"
  es: "Educadora, editora y activista por la independencia de la India (1909-1996), nacida Aruna Ganguly en una familia brahmán bengalí; se casó con Asaf Ali en 1928. Se la recuerda por izar la bandera del Congreso en Gowalia Tank Maidan en Bombay en agosto de 1942 mientras presidía el resto de la sesión de Quit India, luego trabajó en la clandestinidad, se convirtió en la primera alcaldesa de Delhi en 1958 y recibió el Bharat Ratna a título póstumo."
  fr: "Éducatrice, éditrice et militante pour l'indépendance indienne (1909-1996), née Aruna Ganguly dans une famille de brahmanes bengalis; elle a épousé Asaf Ali en 1928. On se souvient d'elle pour avoir hissé le drapeau du Congrès à Gowalia Tank Maidan à Bombay en août 1942 alors qu'elle présidait le reste de la session Quit India, puis a travaillé dans la clandestinité, est devenue la première maire de Delhi en 1958 et a reçu le Bharat Ratna à titre posthume."
  tr: "Hintli bir öğretmen, yayıncı ve bağımsızlık aktivisti (1909–1996), Bengal Brahmi ailesinde doğan Aruna Ganguly 1928'de Asif Ali ile evlendi. Ağustos 1942'de Mumbai'deki Ghwalia Tank Maidan'da Ulusal Kongre bayrağını çekerek 'Hindistan'dan Çık' oturumunun geri kalanına başkanlık etmesiyle ünlendi, ardından bir süre gizli çalışmalarda çalıştı, 1958'de Delhi'nin ilk belediye başkanı oldu ve ölümünden sonra Bharat Ratna madalyasını aldı."
  id: "Seorang guru, penerbit, dan aktivis kemerdekaan India (1909–1996), lahir sebagai Aruna Ganguly dari keluarga Brahmi Bengali, menikah dengan Asif Ali pada tahun 1928. Ia menjadi terkenal karena mengibarkan bendera Kongres Nasional di Ghwalia Tank Maidan di Mumbai pada Agustus 1942, memimpin sisa sesi 'Quit India', kemudian sempat bekerja di bidang rahasia, menjadi walikota pertama Delhi pada tahun 1958, dan menerima Bharat Ratna secara anumerta."
