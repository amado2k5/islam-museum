summary:
  ar: "معلمة وناشرة ومناضلة استقلال هندية (1909–1996)، وُلدت باسم أرونا غانغولي في أسرة بنغالية براهمية، وتزوجت آصف علي سنة 1928. اشتهرت برفعها علم المؤتمر الوطني في ميدان غواليا تانك ببومباي في آب 1942 إذ ترأست بقية دورة «اتركوا الهند»، ثم عملت زمنًا في العمل السري، وأصبحت أول عمدة لدلهي سنة 1958، ونالت بهارات راتنا بعد وفاتها."
  en: "Indian educator, publisher and independence activist (1909–1996), born Aruna Ganguly into a Bengali Brahmin family; she married Asaf Ali in 1928. She is remembered for hoisting the Congress flag at Gowalia Tank Maidan in Bombay in August 1942 as she presided over the remainder of the Quit India session, then worked underground, became Delhi's first mayor in 1958, and received the Bharat Ratna posthumously."
  ur: "ہندوستانی معلمہ، پبلشر اور مجاہد آزادی (1909ء–1996ء)، پیدائشی نام ارونا گنگولی، ایک بنگالی براہمن خاندان میں پیدا ہوئیں؛ 1928ء میں آصف علی سے شادی کی۔ وہ اگست 1942ء میں بمبئی کے گووالیا ٹینک میدان میں کانگریس کا پرچم لہرانے کے لیے مشہور ہیں، جب انھوں نے ’ہندوستان چھوڑ دو‘ اجلاس کی بقیہ کارروائی کی صدارت کی؛ بعد میں وہ روپوش رہیں، 1958ء میں دہلی کی پہلی میئر بنیں اور بعد از مرگ بھارت رتن سے نوازی گئیں۔"
