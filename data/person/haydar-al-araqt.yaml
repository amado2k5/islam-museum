summary:
  ur: "عربی شاعر حیدر الأرقط بخل کے قصوں میں مہمانوں کی ہجو کرنے کے لیے مشہور ہیں۔ ابشیہی بیان کرتے ہیں کہ مہمان ان کے ہاں ٹھہرے تو انہوں نے کھجوریں کھلائیں، اور روایت ہے کہ مہمانوں نے ان کی گٹھلیاں بھی کھا لیں {cite:al-mustatraf-abshihi-scan-vol1 p. 205}۔"
  ar: "شاعر عربي اشتهر في أخبار البخل بأنه كان يهجو الأضياف. يذكر الأبشيهي في باب البخل أن أضيافاً نزلوا به فأطعمهم تمراً، ويحكي أنهم أكلوا نواه، وينسب إليه في ذم الضيف أبيات من قصيدة {cite:al-mustatraf-abshihi-scan-vol1 p. 205}."
  en: "An Arab poet remembered in anecdotes of miserliness for satirising his guests. Al-Abshihi reports that when guests visited him he fed them dates, and that they ate the stones; he is cited for verses in dispraise of the guest {cite:al-mustatraf-abshihi-scan-vol1 p. 205}."
  es: "Un poeta árabe, recordado por anécdotas de tacañería, satirizaba a sus invitados. Al-Abshihi relata que, cuando recibía visitas, les ofrecía dátiles y estos se comían los huesos; se le atribuyen versos que criticaban al invitado {cite:al-mustatraf-abshihi-scan-vol1 p. 205}."
  fr: "Un poète arabe resté célèbre pour son avarice et ses satires envers ses hôtes. Al-Abshihi raconte que, lors de visites, il offrit des dattes à ses invités, qui en mangèrent les noyaux; il est cité pour des vers désobligeants à l'égard de ces derniers {cite:al-mustatraf-abshihi-scan-vol1 p. 205}."
  tr: "Misafirleri hicvettiği cimrilik hikayeleriyle ünlü bir Arap şair. Al-Abshihi, cimrilik bölümünde misafirlerin yanında kaldığını ve onlara hurma verdiğini belirtir; tohumlarını yediklerini anlatır ve {cite:al-mustatraf-abshihi-scan-cilt 1 s. 205} şiirinden misafiri eleştirirken ona atfedilen dizeler vardır."
  id: "Seorang penyair Arab yang terkenal dengan cerita kepelitannya yang menyindir tamu. Al-Abshihi menyebutkan dalam bab tentang pelit bahwa tamu-tamu menginap bersamanya dan ia memberi mereka kurma, dan ia menceritakan bahwa mereka memakan bijinya, dan bait-bait dari puisi {cite:al-mustatraf-abshihi-scan-vol1 hlm. 205} dikaitkan dengannya sebagai kritik terhadap tamu tersebut."
