  ar: "شاعر عربي اشتهر في أخبار البخل بأنه كان يهجو الأضياف. يذكر الأبشيهي في باب البخل أن أضيافاً نزلوا به فأطعمهم تمراً، ويحكي أنهم أكلوا نواه، وينسب إليه في ذم الضيف أبيات من قصيدة {cite:al-mustatraf-abshihi-scan-vol1 p. 205}."
  en: "An Arab poet remembered in anecdotes of miserliness for satirising his guests. Al-Abshihi reports that when guests visited him he fed them dates, and that they ate the stones; he is cited for verses in dispraise of the guest {cite:al-mustatraf-abshihi-scan-vol1 p. 205}."
