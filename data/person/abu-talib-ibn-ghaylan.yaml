summary:
  ar: "محدث بغداد، آخر من حدّث عن أبي بكر الشافعي؛ ولد سنة ست وأربعين وثلاثمائة، وروى عنه جماعة وكان صدوقًا ديّنًا صالحًا قوي النفس على كبر السن. طلب منه أبو عبد الله الرشيدي مائة دينار حمراء ليقرئه الكتاب فلم يقدر إلا على عشرين فأبى؛ وقال له ابن حيدر إنه ابن مائة وخمس سنين، وإن له ألف دينار حمراء جعفرية تُجاء بها كل يوم فتُصب في حجره فيقلبها ويتقوى بذلك. خرج له الدارقطني أجزاء تسمى الغيلانيات وحدّثه عن المزني. توفي يوم الاثنين السادس من شوال سنة أربعين وأربعمائة ودُفن من الغد في داره بدرب عبدة بقطيعة الربيع بباب مسجد ابن المبارك، وكان الإمام في الصلاة أبو الحسين بن المهتدي {cite:muntazam-ibn-al-jawzi j.8 p.481-482}."
  en: "Baghdad's last living transmitter of Abu Bakr al-Shafi'i — born 346, truth-telling and strong-minded into great age; al-Daraqutni drew out for him the ajza' called al-Ghaylaniyyat which he transmitted from al-Mazni. He demanded a hundred gold dinars to read to a student who could only offer twenty, and, past a hundred, reportedly kept his strength on a daily basin of a thousand red Ja'fari dinars poured into his lap. Died Monday 6 Shawwal 440, buried at his house in Darb 'Abda with Ibn al-Muhtadi leading the prayer {cite:muntazam-ibn-al-jawzi j.8 p.481-482}."
