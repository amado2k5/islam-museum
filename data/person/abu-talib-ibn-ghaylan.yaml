summary:
  ar: "محدث بغداد، آخر من حدّث عن أبي بكر الشافعي؛ ولد سنة ست وأربعين وثلاثمائة، وروى عنه جماعة وكان صدوقًا ديّنًا صالحًا قوي النفس على كبر السن. طلب منه أبو عبد الله الرشيدي مائة دينار حمراء ليقرئه الكتاب فلم يقدر إلا على عشرين فأبى؛ وقال له ابن حيدر إنه ابن مائة وخمس سنين، وإن له ألف دينار حمراء جعفرية تُجاء بها كل يوم فتُصب في حجره فيقلبها ويتقوى بذلك. خرج له الدارقطني أجزاء تسمى الغيلانيات وحدّثه عن المزني. توفي يوم الاثنين السادس من شوال سنة أربعين وأربعمائة ودُفن من الغد في داره بدرب عبدة بقطيعة الربيع بباب مسجد ابن المبارك، وكان الإمام في الصلاة أبو الحسين بن المهتدي {cite:muntazam-ibn-al-jawzi j.8 p.481-482}."
  en: "Baghdad's last living transmitter of Abu Bakr al-Shafi'i — born 346, truth-telling and strong-minded into great age; al-Daraqutni drew out for him the ajza' called al-Ghaylaniyyat which he transmitted from al-Mazni. He demanded a hundred gold dinars to read to a student who could only offer twenty, and, past a hundred, reportedly kept his strength on a daily basin of a thousand red Ja'fari dinars poured into his lap. Died Monday 6 Shawwal 440, buried at his house in Darb 'Abda with Ibn al-Muhtadi leading the prayer {cite:muntazam-ibn-al-jawzi j.8 p.481-482}."
  fr: "Dernier transmetteur encore vivant d'Abu Bakr al-Shafi'i à Bagdad ; né en 346, véridique et fort d'esprit jusqu'à un grand âge. Al-Daraqutni prépara pour lui les fascicules appelés al-Ghaylaniyyat qu'il transmettait d'al-Mazni. Il exigea cent dinars d'or pour lire à un élève qui ne pouvait en offrir que vingt ; passé cent ans, il aurait puisé sa force dans un bassin quotidien de mille dinars rouges ja'farites versés sur ses genoux. Mort le lundi 6 chawwal 440, il fut enterré chez lui à Darb 'Abda ; Ibn al-Muhtadi dirigea la prière {cite:muntazam-ibn-al-jawzi j.8 p.481-482}."
  es: "El último transmisor vivo de Abu Bakr al-Shafi'i en Bagdad —nacido en 346, veraz y de carácter firme hasta una edad avanzada; al-Daraqutni le extrajo el ajza' llamado al-Ghaylaniyyat, que él transmitió de al-Mazni. Exigió cien dinares de oro para leerle a un estudiante que solo podía ofrecer veinte, y, superado los cien, según se cuenta, mantenía su fuerza con una fuente diaria de mil dinares Ja'fari rojos vertidos en su regazo. Murió el lunes 6 de Shawwal de 440, enterrado en su casa en Darb 'Abda con Ibn al-Muhtadi dirigiendo la oración {cite:muntazam-ibn-al-jawzi j.8 p.481-482}."
  ur: "ابو بکر الشافعی کا بغداد کا آخری زندہ ٹرانسمیٹر — پیدا ہوا 346، سچ بولنے والا اور بڑی عمر میں مضبوط دماغ؛ الدارقطنی نے ان کے لیے اجزہ نکالا جسے الغیلانیات کہتے ہیں جو اس نے المزنی سے نقل کیا ہے۔ اس نے ایک طالب علم کو پڑھنے کے لیے سو سونے کے دینار کا مطالبہ کیا جو صرف بیس پیش کر سکتا تھا، اور ایک سو کے بعد، مبینہ طور پر ایک ہزار سرخ جعفری دینار اس کی گود میں ڈالے جانے والے روزانہ بیسن پر اپنی طاقت رکھتا تھا۔ پیر 6 شوال 440 میں وفات پائی، ابن المحتدی کے ساتھ داربعدہ میں ان کے گھر میں دفن کیا گیا، جس کی نماز امامت کر رہے تھے۔"
  tr: "Bağdatlı hadis âlimi, Ebu Bekir es-Şafiî'den rivayet eden son kişi, Hicri 346 yılında doğmuştur. Birçok âlim ondan rivayet etmiştir. İleri yaşına rağmen doğru sözlü, dindar, salih ve güçlü iradeli bir kişiydi. Ebu Abdullah es-Raşidi, ona hadis kitabını öğretmesi için yüz kırmızı dinar istemiş, ancak o sadece yirmi dinar verebilmiş ve bunu reddetmiştir. İbn Haydar ona, yüz beş yaşında olduğunu ve her gün kendisine bin kırmızı Caferi dinar getirildiğini, bunların kucağına döküldüğünü ve onları çevirerek onlardan güç aldığını söylemiştir. El-Daraqutni, onun için el-Gaylanîyye adlı bölümleri derlemiş ve el-Muzani'den rivayet etmiştir. Hicri 440 yılının Şevval ayının altıncı Pazartesi günü vefat etmiş ve ertesi gün İbn Mübarek Camii'nin kapısının yakınındaki Kati'at el-Rabi'deki Darb Abda'daki evinde defnedilmiştir. Namazı kıldıran imam Ebu el-Hüseyn ibn el-Muhtadi idi."
  id: "Ulama hadits Baghdad, yang terakhir meriwayatkan dari Abu Bakr al-Shafi'i, lahir pada tahun 346 H. Sekelompok ulama meriwayatkan hadits darinya. Beliau adalah orang yang jujur, taat, saleh, dan berkemauan keras meskipun usianya sudah lanjut. Abu Abdullah al-Rashidi meminta seratus dinar merah kepadanya untuk mengajarinya kitab tersebut, tetapi beliau hanya dapat memberikan dua puluh, yang kemudian ditolaknya. Ibn Haydar mengatakan kepadanya bahwa beliau berusia seratus lima tahun dan bahwa setiap hari beliau menerima seribu dinar merah Ja'fari yang ditumpahkan ke pangkuannya, dan beliau akan membolak-baliknya dan mengambil kekuatan darinya. Al-Daraqutni menyusun bagian-bagian yang disebut al-Ghaylaniyyat untuknya dan meriwayatkan darinya atas otoritas al-Muzani. Beliau wafat pada hari Senin, tanggal 6 Syawal, 440 H, dan dimakamkan keesokan harinya di rumahnya di Darb 'Abda di Qati'at al-Rabi', dekat gerbang Masjid Ibn al-Mubarak. Imam yang memimpin salat tersebut adalah Abu al-Husayn ibn al-Muhtadi."
