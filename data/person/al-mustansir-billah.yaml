summary:
  ar: "خليفة عباسي [٦٢٣–٦٤٠هـ]، أبو جعفر منصور بن الظاهر، ولد في صفر سنة ثمان وثمانين وخمس مئة وأمه جارية تركية، بويع في رجب سنة ثلاث وعشرين فنشر العدل وقرب أهل العلم وبنى المساجد والربط والمدارس والمارستانات، وكان جده الناصر يقربه ويسميه القاضي لهديه وعقله وإنكار ما يجده من المنكر، وأنشأ المدرسة المستنصرية التي ما بني أحسن منها ولا أكثر وقوفاً، وقصدت التتار البلاد فلقيهم عسكره فهزموهم هزيمة عظيمة، وأمر بضرب الدراهم الفضة سنة اثنتين وثلاثين ليتعامل الناس بها بدلاً عن قراضة الذهب إنقاذاً لهم من التعامل بالحرام من الصرف الربوي {cite:tarikh-khulafa-minhaj-1434 p. 702-704}، وتوفي يوم الجمعة عاشر جمادى الآخرة سنة أربعين وست مئة {cite:tarikh-khulafa-minhaj-1434 p. 705-706}."
  en: "Abbasid caliph [623–640], hailed Rajab 623; builder of the Mustansiriyya — four madhhab chairs, bimaristan, kitchen, hammam, 70,000-mithqal waqf. His host once routed the Tatars; in 632 he struck silver dirhams to spare people usurious gold-cutting. His fierce brother al-Khafaji was passed over for his mild son Ahmad {cite:tarikh-khulafa-minhaj-1434 p. 702-704}."
