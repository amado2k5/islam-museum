label: { ar: "فخر الدولة بن جهير" }
summary:
  ar: "وزير الخليفتين القائم والمقتدي؛ لما احتضر القائم استدعاه وقال له «يا بني قد استخدمت في أيامي ابن أيوب وابن المسلمة وابن دارسة وابن جهير فما رأيت أصلح للدولة من ابن جهير وولده فلا تبدل عنهما»، فكان من المشهودين على ولاية عهد المقتدي ليلة الأحد تاسع شعبان 467هـ {cite:muntazam-ibn-al-jawzi j.8 p.290-291}. وهو الذي استدعى الشريف أبا جعفر لمصالحة الأشعرية في فتنة 469هـ {cite:muntazam-ibn-al-jawzi j.8 p.306}."
