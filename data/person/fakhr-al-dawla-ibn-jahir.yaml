id: person/fakhr-al-dawla-ibn-jahir
class: person
label: { ar: "فخر الدولة بن جهير" }
summary:
  ar: "وزير الخليفتين القائم والمقتدي؛ لما احتضر القائم استدعاه وقال له «يا بني قد استخدمت في أيامي ابن أيوب وابن المسلمة وابن دارسة وابن جهير فما رأيت أصلح للدولة من ابن جهير وولده فلا تبدل عنهما»، فكان من المشهودين على ولاية عهد المقتدي ليلة الأحد تاسع شعبان 467هـ {cite:muntazam-ibn-al-jawzi j.8 p.290-291}. وهو الذي استدعى الشريف أبا جعفر لمصالحة الأشعرية في فتنة 469هـ {cite:muntazam-ibn-al-jawzi j.8 p.306}."
  tr: "İki halife el-Kaim ve el-Muqtadi'nin bakanı; el-Kaim ölürken onu çağırdı ve şöyle dedi: 'Ey oğlum, hayatımda İbn Eyyub, İbn Meslemeh, İbn Darisah ve İbn Cühayr'ı kullandım, bu yüzden devlet için İbn Cuhayr ve oğullarından daha uygun birini görmedim, onları da yerine koymayın.' O, Muqtadi döneminin valisi olarak atamasını, Şaban 467 Ahriri'nin dokuzuncusu Pazar gecesi atanmasıyla tanınanlar arasındaydı {alıntı:Muntazam-ibn-al-jawzi J.8 s.290-291}. 469 Hicri isyanı sırasında Şerif Ebu Ca'far'ı Aş'aritlerle barışmaya çağıran kişiydi {atıf:Muntazam-ibn-al-jawzi J.8 s.306}."
  id: "Menteri dari dua khalifah al-Qa'im dan al-Muqtadi; ketika al-Qa'im sekarat, ia memanggilnya dan berkata, 'Wahai anakku, di hari-hariku aku telah menggunakan Ibn Ayyub, Ibn al-Maslamah, Ibn Darisah, dan Ibn Juhayr, jadi aku tidak melihat siapa pun yang lebih layak untuk negara selain Ibn Juhayr dan putra-putranya, jadi jangan gantikan mereka.' Ia termasuk di antara mereka yang dikenal karena pengangkatannya sebagai gubernur era al-Muqdi pada malam Minggu, tanggal sembilan Sha'ban 467 AH {cite:Muntazam-ibn-al-jawzi J.8 hlm.290-291}. Dialah yang memanggil Sharif Abu Ja'far untuk berdamai dengan kaum Ash'arite selama pemberontakan tahun 469 AH {cite:Muntazam-ibn-al-jawzi J.8 hlm.306}."
