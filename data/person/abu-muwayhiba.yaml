summary:
  ar: "مولى النبي؛ أيقظه النبي من جوف الليل ليرافقه إلى البقيع، فاستغفر لأهله، ثم أخبره أنه أُوتي مفاتيح خزائن الدنيا والخلد ثم الجنة فخُيّر فاختار لقاء ربه؛ ويروي خبره ابن إسحاق عن عبد الله بن عمرو بن العاص."
  en: "A client of the Prophet, whom he woke in the middle of the night to accompany him to al-Baqi'; the Prophet asked forgiveness for its people, then told him he had been given the keys of the treasures of this world and eternity and the Garden, but had chosen to meet his Lord; Ibn Ishaq narrates it through Abdullah ibn Amr ibn al-As."
  ur: "نبی کے مولیٰ جنہیں آدھی رات بقیع جانے کے لیے جگایا؛ نبی نے وہاں کے اہل کے لیے مغفرت مانگی پھر انہیں خبر دی۔"
  fr: "Client du Prophète, que celui-ci réveilla au milieu de la nuit pour l'accompagner à al-Baqi' ; le Prophète demanda pardon pour ses gens, puis lui dit qu'il avait reçu les clés des trésors de ce monde et l'éternité, puis le Paradis, mais qu'il avait choisi de rencontrer son Seigneur ; Ibn Ishaq le rapporte par Abdullah ibn Amr ibn al-As."
  es: "Un cliente del Profeta, a quien despertó en medio de la noche para que lo acompañara a al-Baqi'; el Profeta pidió perdón por su gente, luego le dijo que se le habían dado las llaves de los tesoros de este mundo y la eternidad y el Jardín, pero que había elegido encontrarse con su Señor; Ibn Ishaq lo narra a través de Abdullah ibn Amr ibn al-As."
  tr: "Peygamberin azat ettiği köle; Peygamber onu gece yarısı uyandırıp kendisiyle birlikte Bakî'ye götürmesini istedi. Köle ailesi için af diledi, sonra Peygamber ona bu dünyanın, âlemin ve cennetin hazinelerinin anahtarlarının verildiğini söyledi. Ona bir seçim hakkı verildi ve o da Rabbine kavuşmayı seçti. İbn İshak bu hikayeyi Abdullah bin Amr bin Al-Aas'tan rivayet etmiştir."
  id: "Budak Nabi yang telah dibebaskan; Nabi membangunkannya di tengah malam untuk menemaninya ke Al-Baqi', lalu ia memohon ampunan untuk keluarganya, kemudian Nabi memberitahunya bahwa ia telah diberi kunci menuju harta dunia dan akhirat serta surga, sehingga ia diberi pilihan dan ia memilih untuk bertemu dengan Tuhannya; dan Ibnu Ishaq meriwayatkan kisahnya dari Abdullah bin Amr bin Al-Aas."
