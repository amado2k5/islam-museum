summary:
  ar: "مولى النبي؛ أيقظه النبي من جوف الليل ليرافقه إلى البقيع، فاستغفر لأهله، ثم أخبره أنه أُوتي مفاتيح خزائن الدنيا والخلد ثم الجنة فخُيّر فاختار لقاء ربه؛ ويروي خبره ابن إسحاق عن عبد الله بن عمرو بن العاص."
  en: "A client of the Prophet, whom he woke in the middle of the night to accompany him to al-Baqi'; the Prophet asked forgiveness for its people, then told him he had been given the keys of the treasures of this world and eternity and the Garden, but had chosen to meet his Lord; Ibn Ishaq narrates it through Abdullah ibn Amr ibn al-As."
