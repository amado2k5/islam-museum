roles: [companion]
summary:
  en: "A companion of Banu Ujlan of the Ansar who accused his wife before the Prophet after the return from Tabuk; the Prophet administered the mutual oath of condemnation (li'an) between them and separated them."
  ar: "صحابي من بني عجلان من الأنصار؛ رمى امرأته بعد قدوم النبي من تبوك فتلاعنا عند النبي وفرّق بينهما، وكانت واقعة اللعان المشهورة سنة 9هـ."
  ur: "انصار کے بنو عجلان کا صحابی جس نے تبوک سے واپسی کے بعد نبی کے سامنے اپنی بیوی پر الزام لگایا؛ نبی نے لعان کا طریقہ نافذ کیا۔"
  es: "Un compañero de Banu Ujlan de los Ansar acusó a su esposa ante el Profeta después del regreso de Tabuk; el Profeta les administró el juramento mutuo de condena (li'an) y los separó."
  fr: "Un compagnon des Banu Ujlan des Ansar qui accusa sa femme devant le Prophète après le retour de Tabuk; le Prophète fit prêter serment mutuel de condamnation (li'an) entre eux et les sépara."
  tr: "Banu Ajlan'dan bir yoldaş, Peygamber Tabuk'tan geldikten sonra karısını attı, bu yüzden Peygamber ile tartıştılar ve aralarını ayırdılar. Li'an'ın ünlü olayı 9 H yılında gerçekleşti."
  id: "Seorang sahabat dari Banu Ajlan dari Ansar; ia membuang istrinya setelah Nabi datang dari Tabuk, sehingga mereka bertengkar dengan Nabi dan memisahkan mereka. Peristiwa terkenal Li'an terjadi pada tahun 9 H."
