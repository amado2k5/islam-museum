summary:
  ar: "جنرال ورجل دولة تركي، قائد الجبهة الشرقية في حرب الاستقلال التركية الذي استعاد سارقاميش وقارص ووقّع معاهدتي ألكسندروبول (1920) وقارص (1921)، واشتهر أيضًا بعنايته بآلاف أيتام الحرب في الشرق. أسس سنة 1924 أول حزب معارضة في الجمهورية، فحُلّ حزبه وحُوكم وبُرّئ، ثم عاد رئيسًا للبرلمان من 1946 حتى وفاته في المنصب."
  en: "Turkish general and politician, commander of the Eastern Front in the Turkish War of Independence, who retook Sarıkamış and Kars and signed the Treaties of Alexandropol (1920) and Kars (1921); he is also remembered for his care for thousands of war orphans in the east. In 1924 he founded the Republic's first opposition party; the party was closed and he was tried and acquitted. He returned as Speaker of the Grand National Assembly from 1946 until his death in office."
  ur: "ترک جنرل اور سیاست دان، جنگِ آزادی میں مشرقی محاذ کے کمانڈر جنہوں نے سارقامش اور قارص واپس لیے اور معاہدۂ الیگزینڈروپول (1920) اور معاہدۂ قارص (1921) پر دستخط کیے؛ وہ مشرق میں ہزاروں جنگی یتیموں کی کفالت کے لیے بھی مشہور ہیں۔ 1924 میں انہوں نے جمہوریہ کی پہلی حزبِ اختلاف کی بنیاد رکھی؛ جماعت بند کر دی گئی، ان پر مقدمہ چلا اور وہ بری ہوئے، پھر 1946 سے وفات تک قومی مجلس کے صدر رہے۔"
