summary:
  ar: "روائي مصري، وُلد في القاهرة سنة 1911 وتوفي فيها سنة 2006، عمل موظفا حكوميا بالتوازي مع الكتابة، وألّف أكثر من ثلاثين رواية ومئات القصص القصيرة جعلت من الحارة القاهرية صورة مصغرة للعالم، ونال جائزة نوبل في الأدب سنة 1988 فكان المصري الوحيد والعربي الوحيد حتى اليوم الذي نالها في الأدب، ونجا من محاولة اغتيال سنة 1994 على خلفية الجدل حول روايته «أولاد حارتنا»."
  en: "Egyptian novelist, born in Cairo in 1911 and died there in 2006. He worked as a civil servant alongside his writing and produced more than thirty novels and hundreds of short stories that made the Cairo lane a microcosm of the world. He received the 1988 Nobel Prize in Literature — still the only Egyptian and the only Arab to win it in literature — and survived a 1994 assassination attempt driven by the controversy over his novel Children of Gebelawi."
  ur: "مصری ناول نگار، جو 1911 میں قاہرہ میں پیدا ہوئے اور 2006 میں وہیں وفات پائی۔ انہوں نے ملازمت کے ساتھ ساتھ لکھا اور تیس سے زائد ناول اور سینکڑوں افسانے تخلیق کیے جن میں قاہرہ کی گلی دنیا کی تصویر بن گئی۔ انہیں 1988 میں ادب کا نوبل انعام ملا — وہ یہ انعام پانے والے واحد مصری اور واحد عرب ادیب ہیں — اور 1994 میں اپنے ناول «اولاد حارتنا» کے تنازعے سے جڑے قاتلانہ حملے میں بچ گئے۔"
