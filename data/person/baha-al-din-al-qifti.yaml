summary:
  ar: "القاضي القفطي؛ تفقه على المجد القشيري وقرأ الأصول على الشمس الأصفهاني بقوص واجتمع بالقاهرة بعز الدين بن عبد السلام والزكي المنذري، وولي قضاء أسنا وتدريس المعزية بها — وكانت أسنا مشحونة بالرافضة بحسب المصدر فقام في نصرة السنة وهمّ الرافضة بقتله فحماه الله منهم، وكان ممن انتفع به تقي الدين ابن دقيق العيد، وصنّف كتباً كثيرة وكانت أوقاته موزعة بين إقراء وتدريس وتصنيف {cite:shadharat-dhahab p. 768-769}."
  en: "Isna's qadi — Ibn Daqiq al-Id among his pupils; the Sunni source says he 'stood for the Sunna' in a town 'stuffed with rawafid' who plotted to kill him {cite:shadharat-dhahab p. 768-769}."
  es: "El cadí de Isna — Ibn Daqiq al-Id entre sus discípulos; la fuente sunita dice que \"defendió la Sunna\" en una ciudad \"llena de rawafid\" que conspiraron para matarlo {cita: shadharat-dhahab págs. 768-769}."
  fr: "Le cadi d'Isna — Ibn Daqiq al-Id parmi ses élèves; la source sunnite dit qu'il « défendait la Sunna » dans une ville « remplie de rawafid » qui complotaient pour le tuer {cite: shadharat-dhahab p. 768-769}."
  ur: "اسنا کی قضا - ابن دقیق العد ان کے شاگردوں میں؛ سنی ماخذ کا کہنا ہے کہ وہ ایک قصبے میں 'سنت کے لیے کھڑا تھا' 'روافد سے بھرا ہوا' تھا جس نے اسے قتل کرنے کی سازش کی تھی۔ 768-769}۔"
  tr: "Kadi el-Kıfti; Al-Majd el-Kuşayri'nin yanında fıkıh okudu, Kus'ta 'al-Shams al-Isfahani'nin prensiplerini inceledi ve Kahire'de İzzeddin ibn Abdülselam ve el-Zaki el-Mundhiri ile buluştu. Asna'nın hakimi olarak atandı ve orada Mu'ziya öğretti—kaynağa göre Asna, Rafidah'tan büyük ölçüde etkilenmişti, bu yüzden Rafide onu öldürürken Sünnet'i destekledi ve Allah onu onlardan korudu. Onun sayesinde faydalananlar arasında Taqi al-Din bin Daqiq al-'Id de vardı. Birçok kitap yazdı ve zamanı okuma, öğretme ve yazma arasında bölündü {atıf: shadharat-dhahab, s. 768-769}."
  id: "Qadi al-Qifti; ia mempelajari hukum di bawah Al-Majd al-Qushayri, mempelajari prinsip-prinsip 'al-Shams al-Isfahani di Qus, dan bertemu di Kairo dengan Izz al-Din ibn Abd al-Salam dan al-Zaki al-Mundhiri. Ia diangkat sebagai hakim Asna dan mengajarkan Mu'ziyah di sana—Asna sangat dipengaruhi oleh Rafidah menurut sumbernya, sehingga ia mendukung Sunnah sementara Rafidah membunuhnya, dan Tuhan melindunginya dari mereka. Di antara mereka yang mendapat manfaat darinya adalah Taqi al-Din ibn Daqiq al-'Id. Ia menulis banyak buku, dan waktunya terbagi antara membaca, mengajar, dan menulis {cite:shadharat-dhahab, hlm. 768-769}."
