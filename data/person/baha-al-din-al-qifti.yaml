  ar: "القاضي القفطي؛ تفقه على المجد القشيري وقرأ الأصول على الشمس الأصفهاني بقوص واجتمع بالقاهرة بعز الدين بن عبد السلام والزكي المنذري، وولي قضاء أسنا وتدريس المعزية بها — وكانت أسنا مشحونة بالرافضة بحسب المصدر فقام في نصرة السنة وهمّ الرافضة بقتله فحماه الله منهم، وكان ممن انتفع به تقي الدين ابن دقيق العيد، وصنّف كتباً كثيرة وكانت أوقاته موزعة بين إقراء وتدريس وتصنيف {cite:shadharat-dhahab p. 768-769}."
  en: "Isna's qadi — Ibn Daqiq al-Id among his pupils; the Sunni source says he 'stood for the Sunna' in a town 'stuffed with rawafid' who plotted to kill him {cite:shadharat-dhahab p. 768-769}."
