id: person/sulayman-al-halabi
class: person
label: { ar: "سليمان الحلبي", en: "Sulayman al-Halabi", ur: "سلیمان حلبی" }
summary:
  ar: "شاب من أهل حلب، كاتب عربي، كان يأوي إلى الجامع الأزهر، قتل كليبر صاري عسكر الفرنساوية بالقاهرة يوم السبت 21 المحرم سنة 1215هـ، فحكمت عليه محكمة الفرنسيس بحرق يده اليمنى والتخزيق؛ ويسميه الجبرتي في «عجائب الآثار» «رجلاً آفاقياً أهوج»، ويسميه في «مظهر التقديس» «الشهيد سليمان» فيما ينقله المحقق {cite:ajaib-al-athar-moreh-v3 p. 170-172} {cite:ajaib-al-athar-moreh-v3 p. 191}."
  en: "A young man from Aleppo, an Arabic scribe who lodged at al-Azhar, who killed General Kléber, commander of the French, in Cairo on Saturday 21 Muharram 1215 AH; a French court sentenced him to have his right hand burned and to be impaled. In Aja'ib al-athar al-Jabarti calls him 'a reckless vagrant'; in Mazhar al-taqdis, as the editor reports, he calls him 'the martyr Sulayman' {cite:ajaib-al-athar-moreh-v3 p. 170-172} {cite:ajaib-al-athar-moreh-v3 p. 191}."
