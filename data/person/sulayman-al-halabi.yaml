id: person/sulayman-al-halabi
class: person
label: { ar: "سليمان الحلبي", en: "Sulayman al-Halabi", ur: "سلیمان حلبی", es: "Sulayman al-Halabi", fr: "Sulayman al-Halabi" }
summary:
  ar: "شاب من أهل حلب، كاتب عربي، كان يأوي إلى الجامع الأزهر، قتل كليبر صاري عسكر الفرنساوية بالقاهرة يوم السبت 21 المحرم سنة 1215هـ، فحكمت عليه محكمة الفرنسيس بحرق يده اليمنى والتخزيق؛ ويسميه الجبرتي في «عجائب الآثار» «رجلاً آفاقياً أهوج»، ويسميه في «مظهر التقديس» «الشهيد سليمان» فيما ينقله المحقق {cite:ajaib-al-athar-moreh-v3 p. 170-172} {cite:ajaib-al-athar-moreh-v3 p. 191}."
  en: "A young man from Aleppo, an Arabic scribe who lodged at al-Azhar, who killed General Kléber, commander of the French, in Cairo on Saturday 21 Muharram 1215 AH; a French court sentenced him to have his right hand burned and to be impaled. In Aja'ib al-athar al-Jabarti calls him 'a reckless vagrant'; in Mazhar al-taqdis, as the editor reports, he calls him 'the martyr Sulayman' {cite:ajaib-al-athar-moreh-v3 p. 170-172} {cite:ajaib-al-athar-moreh-v3 p. 191}."
  es: "Un joven de Alepo, escriba árabe alojado en al-Azhar, asesinó al general Kléber, comandante de los franceses, en El Cairo el sábado 21 de Muharram de 1215 AH; un tribunal francés lo condenó a que le quemaran la mano derecha y a ser empalado. En Aja'ib al-athar, al-Jabarti lo llama \"un vagabundo temerario\"; en Mazhar al-taqdis, como informa el editor, lo llama \"el mártir Sulayman\" {cite:ajaib-al-athar-moreh-v3 p. 170-172} {cite:ajaib-al-athar-moreh-v3 p. 191}."
  fr: "Un jeune homme d'Alep, scribe arabe logeant à al-Azhar, assassina le général Kléber, commandant des Français, au Caire le samedi 21 Muharram 1215 AH. Un tribunal français le condamna à avoir la main droite brûlée et à être empalé. Dans Aja'ib al-athar, al-Jabarti le qualifie de « vagabond imprudent »; dans Mazhar al-taqdis, comme le rapporte l'éditeur, il le surnomme « le martyr Sulayman » (Aja'ib al-athar-moreh, vol. 3, p. 170-172; Aja'ib al-athar-moreh, vol. 3, p. 191)."
  ur: "حلب کا ایک نوجوان، ایک عربی کاتب جو الازہر میں مقیم تھا، جس نے 21 محرم 1215 ہجری کو ہفتہ کو قاہرہ میں فرانسیسی کمانڈر جنرل کلبر کو قتل کر دیا۔ فرانس کی ایک عدالت نے اسے دائیں ہاتھ جلانے اور پھانسی چڑھانے کی سزا سنائی۔ عجائب الاطہر الجبرتی نے اسے 'ایک لاپرواہ آوارہ گرد' کہا ہے۔ مظہر التقدیس میں، جیسا کہ ایڈیٹر نے رپورٹ کیا ہے، وہ اسے 'شہید سلیمان' کہتا ہے۔ 170-172} {حوالہ: عجائب الاطہر موریح صفحہ 3۔ 191}۔"
  tr: "Halepli genç bir adam, El-Ezher Camii'nde sığınan Arap yazar, 21 Muharrem 1215 Hicri Cumartesi günü Kahire'de Fransız askeri Kleber'i öldürdü. Fransız mahkemesi ona sağ elini yakıp delme cezası verdi; El-Cebarti \"Antikaların Harikaları\"nda ona \"pervasız bir Afaqian adam\" derken, \"Kutsallaşmanın Tezahürü\" bölümünde ise \"şehit Süleyman\" olarak adlandırıyor; bu durum araştırmacı tarafından bildirildi {cite:ajaib-al-athar-moreh-v3 s. 170-172} {cite:ajaib-al-athar-moreh-v3 s. 191}."
  id: "Seorang pemuda dari Aleppo, seorang penulis Arab yang berlindung di Masjid Al-Azhar, membunuh Kleber, seorang tentara Prancis, di Kairo pada hari Sabtu, 21 Muharram 1215 H. Pengadilan Prancis menjatuhkan hukuman membakar tangan kanannya dan menusuknya; Al-Jabarti menyebutnya dalam \"Keajaiban Purbakala\" sebagai \"pria Afaqian yang sembrono,\" dan dalam \"Manifestasi Pengudusan,\" ia menyebutnya \"martir Suleiman,\" seperti yang dilaporkan oleh penyelidik {cite:ajaib-al-athar-moreh-v3 hlm. 170-172} {cite:ajaib-al-athar-moreh-v3 hlm. 191}."
