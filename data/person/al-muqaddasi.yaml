names:
  - { kind: full, lang: ar, value: "شمس الدين أبو عبد الله محمد بن أحمد بن أبي بكر البنّاء الشامي المقدسي البشاري" }
roles: [geographer, scholar]
summary:
  ar: "الشيخ شمس الدين أبو عبد الله محمد بن أحمد المقدسي الحنفي (ت نحو 380هـ)؛ صاحب أحسن التقاسيم في معرفة الأقاليم. جال الأقاليم وفطّن مساحاتها بالفراسخ وأنفق في أسفاره فوق عشرة آلاف درهم، وجاور وغزا ورابط في الثغور، ووصف نفسه بأنه لم يصنّف كتابه جزافاً ولا على السماع بل خرج من الطريق فارق القوافل ليرى كل بلدة {cite:kashf-zunun-furqan p. 206} {cite:ahsan-al-taqasim pp. 40-41}. وحياته لا تُعرف إلا من كتابه نفسه: حجّتان 356 و367هـ، ورحلة إلى حلب، وزيارة خراسان 374هـ، ثم قرار التصنيف بشيراز 375هـ وقد جاز الأربعين {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
  en: "Shams al-Din Muhammad ibn Ahmad al-Muqaddasi (al-Bishshari, d. c. 380 AH) — the geographer who compiled Ahsan al-Taqasim after travelling through the climes and pacing them in farsakhs. He spent over ten thousand dirhams on his journeys, fought and kept ribat on the frontier, and left the caravan routes to inspect every town, boasting that he did not compile his book at ease or on hearsay {cite:kashf-zunun-furqan p. 206} {cite:ahsan-al-taqasim pp. 40-41}. His life is known only through his own work: two pilgrimages in 356 and 367, a journey to Aleppo, a visit to Khurasan in 374, then the decision to compose the book at Shiraz in 375, past the age of forty {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
  ur: "شمس الدین ابو عبد اللہ محمد بن احمد مقدسی بشاری (وفات تقریباً 380ھ) — احسن التقاسیم فی معرفۃ الاقالیم کے مصنف، جنھوں نے اقالیم کا سفر کیا اور ان کے فرسخ ناپے، سفر میں دس ہزار سے زائد درہم خرچ کیے اور قوافل کے راستے چھوڑ کر ہر بستی خود دیکھی {cite:kashf-zunun-furqan p. 206} {cite:ahsan-al-taqasim pp. 40-41}۔ ان کی زندگی صرف ان کی کتاب سے معلوم ہوتی ہے: 356 اور 367ھ میں دو حج، حلب کا سفر، 374ھ میں خراسان کی زیارت، پھر 375ھ میں شیراز میں تصنیف کا فیصلہ جب وہ چالیس سے زیادہ عمر کے تھے {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}۔"
