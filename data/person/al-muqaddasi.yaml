label: { ar: "المقدسي البشاري" }
summary:
  ar: "الشيخ شمس الدين أبو عبد الله محمد بن أحمد المقدسي الحنفي (ت نحو 380هـ)؛ صاحب أحسن التقاسيم في معرفة الأقاليم. جال الأقاليم وفطّن مساحاتها بالفراسخ وأنفق في أسفاره فوق عشرة آلاف درهم، وجاور وغزا ورابط في الثغور، ووصف نفسه بأنه لم يصنّف كتابه جزافاً ولا على السماع بل خرج من الطريق فارق القوافل ليرى كل بلدة {cite:kashf-zunun-furqan p. 206} {cite:ahsan-al-taqasim pp. 40-41}."
  en: "Shams al-Din Muhammad ibn Ahmad al-Muqaddasi (al-Bishshari, d. c. 380 AH) — the geographer who compiled Ahsan al-Taqasim after travelling through the climes and pacing them in farsakhs. He spent over ten thousand dirhams on his journeys, fought and kept ribat on the frontier, and left the caravan routes to inspect every town, boasting that he did not compile his book at ease or on hearsay {cite:kashf-zunun-furqan p. 206} {cite:ahsan-al-taqasim pp. 40-41}."
