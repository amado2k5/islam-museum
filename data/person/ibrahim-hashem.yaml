summary:
  ar: "سياسي وقاضٍ أردني من نابلس (1886–1958)، تولى رئاسة الوزراء خمس مرات بين 1933 و1957 وترأس مجلس الأعيان بين 1951 و1955؛ خريج حقوق إسطنبول ومدرّس القانون الجزائي في دمشق، وعضو مجلس الوصاية على العرش إبان قصور الملك حسين، واغتيل في بغداد في انقلاب 14 تموز 1958 وهو نائب رئيس وزراء الاتحاد العربي الهاشمي."
  en: "Jordanian politician and judge from Nablus (1886–1958), five times prime minister of Jordan between 1933 and 1957 and president of the Senate from 1951 to 1955. An Istanbul law graduate who taught penal law at Damascus, he sat on the Throne Council during King Hussein's minority and was assassinated at Baghdad in the Iraqi coup of 14 July 1958 while deputy head of the Arab Federation."
  ur: "نابلس سے تعلق رکھنے والے اردنی سیاست دان اور قاضی (1886–1958)، 1933 سے 1957 کے درمیان پانچ بار اردن کے وزیر اعظم اور 1951 سے 1955 تک مجلس اعیان کے صدر رہے؛ استنبول سے قانون کی تعلیم پائی اور دمشق میں قانون جزا پڑھایا، شاہ حسین کی کم سنی کے دور میں مجلس وصایت کے رکن رہے، اور 1958 میں عرب وفاق کے نائب سربراہ کی حیثیت سے بغداد میں 14 جولائی کی بغاوت کے دوران قتل کر دیے گئے۔"
