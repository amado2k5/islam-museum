summary:
  ar: "سياسي وقاضٍ أردني من نابلس (1886–1958)، تولى رئاسة الوزراء خمس مرات بين 1933 و1957 وترأس مجلس الأعيان بين 1951 و1955؛ خريج حقوق إسطنبول ومدرّس القانون الجزائي في دمشق، وعضو مجلس الوصاية على العرش إبان قصور الملك حسين، واغتيل في بغداد في انقلاب 14 تموز 1958 وهو نائب رئيس وزراء الاتحاد العربي الهاشمي."
  en: "Jordanian politician and judge from Nablus (1886–1958), five times prime minister of Jordan between 1933 and 1957 and president of the Senate from 1951 to 1955. An Istanbul law graduate who taught penal law at Damascus, he sat on the Throne Council during King Hussein's minority and was assassinated at Baghdad in the Iraqi coup of 14 July 1958 while deputy head of the Arab Federation."
  ur: "نابلس سے تعلق رکھنے والے اردنی سیاست دان اور قاضی (1886–1958)، 1933 سے 1957 کے درمیان پانچ بار اردن کے وزیر اعظم اور 1951 سے 1955 تک مجلس اعیان کے صدر رہے؛ استنبول سے قانون کی تعلیم پائی اور دمشق میں قانون جزا پڑھایا، شاہ حسین کی کم سنی کے دور میں مجلس وصایت کے رکن رہے، اور 1958 میں عرب وفاق کے نائب سربراہ کی حیثیت سے بغداد میں 14 جولائی کی بغاوت کے دوران قتل کر دیے گئے۔"
  es: "Político y juez jordano de Nablus (1886-1958), cinco veces primer ministro de Jordania entre 1933 y 1957 y presidente del Senado de 1951 a 1955. Licenciado en Derecho por Estambul, impartió clases de derecho penal en Damasco, formó parte del Consejo del Trono durante la minoría de edad del rey Hussein y fue asesinado en Bagdad durante el golpe de Estado iraquí del 14 de julio de 1958, cuando era vicepresidente de la Federación Árabe."
  fr: "Homme politique et juge jordanien originaire de Naplouse (1886-1958), cinq fois Premier ministre de Jordanie entre 1933 et 1957 et président du Sénat de 1951 à 1955. Diplômé en droit d'Istanbul, il enseigna le droit pénal à Damas, siégea au Conseil du Trône pendant la minorité du roi Hussein et fut assassiné à Bagdad lors du coup d'État irakien du 14 juillet 1958 alors qu'il était vice-président de la Fédération arabe."
  tr: "Nablus'tan Ürdünlü bir siyasetçi ve yargıç (1886–1958) olan Sher, 1933 ile 1957 yılları arasında beş kez başbakanlık yaptı ve 1951-1955 yılları arasında Senato başkanlığını yaptı; İstanbul hukuk mezunu ve Şam'da ceza hukuku öğretim görevlisi oldu, Kral Hüseyin'in saraylarında Naiplik Konseyi üyesiydi ve 14 Temmuz 1958 darbesi sırasında Bağdat'ta suikaste uğradı. Haşimi Arap Birliği'nin Başbakan Yardımcısıydı."
  id: "Seorang politikus dan hakim Yordania dari Nablus (1886–1958), ia menjabat sebagai Perdana Menteri lima kali antara 1933 dan 1957 dan memimpin Senat antara 1951 dan 1955; lulusan hukum Istanbul dan dosen hukum pidana di Damaskus, anggota Dewan Regency selama istana Raja Hussein, dan dibunuh di Baghdad selama kudeta 14 Juli 1958. Ia adalah Wakil Perdana Menteri Uni Arab Hashemite."
