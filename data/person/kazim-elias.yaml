summary:
  ar: "داعية ماليزي مستقل وكاتب ومحاضر، وُلد في 28 نوفمبر 1972 في مقيم سلاما بولاية فيراك. أسّس مركز البركة التعليمي في إيبوه ويرأسه، وهو مركز لتحفيظ القرآن والدراسات الدينية قاعدةً لدعوته. عُرف بأسلوب مرح ميسّر في المحاضرة وبموضوعات الأسرة والتحفيز، وبحضور واسع في التلفزيون والإذاعة الماليزيين ووسائل التواصل؛ بلغ حسابه في إنستغرام 1,009,954 متابعًا بحسب إحصاءات SPEAKRJ المؤرخة في 3 نوفمبر 2026."
  en: "Malaysian independent preacher, writer and lecturer, born on 28 November 1972 in Mukim Selama, Perak. He founded and heads the Al Barakah Education Centre in Ipoh, a tahfiz and religious-studies centre that is the base of his preaching. He is known for a relaxed, humorous lecture style and for family and motivation themes, with a wide presence on Malaysian television and radio and on social media; his Instagram account counted 1,009,954 followers by SPEAKRJ statistics dated 3 November 2026."
  ur: "ملائیشیا کے آزاد مبلغ، مصنف اور مدرس، جو 28 نومبر 1972ء کو پیراک کے موکیم سلاما میں پیدا ہوا۔ اس نے ایپوہ میں البرکہ تعلیمی مرکز قائم کیا اور اس کا سربراہ ہے، جو تحفیظ و دینی تعلیم کا مرکز اور اس کی دعوت کی بنیاد ہے۔ وہ اپنے سہل اور پُرمزاح اندازِ خطابت اور خاندانی و تحریکی موضوعات کے لیے جانا جاتا ہے، اور ملائیشیائی ٹیلی ویژن، ریڈیو اور سوشل میڈیا پر اس کی وسیع موجودگی ہے؛ اس کے انسٹاگرام اکاؤنٹ کے فالوور SPEAKRJ کے 3 نومبر 2026ء کے اعداد و شمار کے مطابق 1,009,954 تھے۔"
  es: "Predicador, escritor y conferenciante independiente malasio, nacido el 28 de noviembre de 1972 en Mukim Selama, Perak. Fundó y dirige el Centro Educativo Al Barakah en Ipoh, un centro de estudios religiosos y de interpretación de textos islámicos que constituye la base de su labor de predicación. Es conocido por su estilo de conferencia relajado y humorístico, así como por sus temas familiares y de motivación, y cuenta con una amplia presencia en la televisión y la radio malasias, además de en las redes sociales. Su cuenta de Instagram alcanzó 1.009.954 seguidores según las estadísticas de SPEAKRJ del 3 de noviembre de 2026."
