summary:
  ar: "رحل مع صالح بن علي وعامر بن إسماعيل المذحجي في طلب مروان بن محمد فلحقوه بمصر نازلاً ببوصير فبايتوه وهجموا على عسكره ونادوا يا لثارات إبراهيم فقتل مروان ليلة الأحد لثلاث بقين من ذي الحجة سنة اثنتين وثلاثين ومائة {cite:muruj-al-dhahab p. 233}."
  en: "Salih ibn 'Ali's partner in the pursuit to Busir — the night assault crying 'revenge for Ibrahim' in which Marwan fell {cite:muruj-al-dhahab p. 233}."
  fr: "Le compagnon de Salih ibn 'Ali dans la poursuite jusqu'à Busir — l'assaut nocturne au cri de « vengeance pour Ibrahim » où tomba Marwan {cite:muruj-al-dhahab p. 233}."
  es: "El compañero de Salih ibn 'Ali en la persecución a Busir: el asalto nocturno en el que se clamaba \"venganza por Ibrahim\" y en el que cayó Marwan {cite:muruj-al-dhahab p. 233}."
  ur: "بصیر کے تعاقب میں صالح بن علی کا ساتھی - رات کا حملہ 'ابراہیم کا بدلہ' کا نعرہ لگاتا ہوا جس میں مروان گر گیا {حوالہ: مروج الذہب ص۔ 233}۔"
  tr: "Mervan bin Muhammed'i aramak için Salih bin Ali ve Amer bin İsmail el-Madhaji ile birlikte yolculuk etti. Onu Mısır'da, Busir'de kaldığı sırada yakaladılar. Geceleyin ona saldırdılar ve kampını yağmalayarak, \"İbrahim'in intikamı!\" diye bağırdılar. Mervan, Hicri 132 yılının Zilhicce ayının bitimine üç gün kala, Pazar gecesi öldürüldü. {cite:muruj-al-dhahab s. 233}"
  id: "Ia melakukan perjalanan bersama Salih bin Ali dan Amer bin Ismail Al-Madhaji untuk mencari Marwan bin Muhammad. Mereka berhasil menemukannya di Mesir, tempat ia tinggal di Busir. Mereka menyerangnya pada malam hari dan menyerbu perkemahannya sambil berteriak, \"Balas dendam untuk Ibrahim!\" Marwan terbunuh pada Minggu malam, tiga hari sebelum berakhirnya Dzul Hijjah pada tahun 132 Hijriah. {cite:muruj-al-dhahab hlm. 233}."
