summary:
  ar: "تغري بردي الظاهري نائب الشام؛ اشتراه الملك الظاهر برقوق في أوائل سلطنته فأعتقه وجعله نافذاً ثم ساقياً فرأس نوبة الهدارية وتدرج حتى ولى نيابة دمشق غير مرة ونيابة حلب وأنشأ بها جامعاً، وكان حليماً عاقلاً مشاراً إليه بالتعظيم في الدول جميل الصورة، استقر في نيابة دمشق ثالث مرة سنة ثلاث عشرة وثمانمائة وتوفي والياً بها يوم الخميس سادس عشر المحرم وصلى عليه الملك الناصر فرج لأنه كان يومئذ بدمشق وشهد دفنه بتربة الأمير تتم بميدان الحصا ثم قتل الناصر بعد أيام في صفر {cite:shadharat-dhahab p. 118}."
  en: "Barquq's manumitted mamluk Tughri Birdi — thrice viceroy of Damascus and once of Aleppo, where he built a mosque; 'grave, judicious, pointed to for veneration'; prayed over by al-Nasir Faraj at his funeral at Midan al-Hasa days before Faraj himself was killed, 16 Muharram 815 {cite:shadharat-dhahab p. 118}."
