summary:
  ar: "تغري بردي الظاهري نائب الشام؛ اشتراه الملك الظاهر برقوق في أوائل سلطنته فأعتقه وجعله نافذاً ثم ساقياً فرأس نوبة الهدارية وتدرج حتى ولى نيابة دمشق غير مرة ونيابة حلب وأنشأ بها جامعاً، وكان حليماً عاقلاً مشاراً إليه بالتعظيم في الدول جميل الصورة، استقر في نيابة دمشق ثالث مرة سنة ثلاث عشرة وثمانمائة وتوفي والياً بها يوم الخميس سادس عشر المحرم وصلى عليه الملك الناصر فرج لأنه كان يومئذ بدمشق وشهد دفنه بتربة الأمير تتم بميدان الحصا ثم قتل الناصر بعد أيام في صفر {cite:shadharat-dhahab p. 118}."
  en: "Barquq's manumitted mamluk Tughri Birdi — thrice viceroy of Damascus and once of Aleppo, where he built a mosque; 'grave, judicious, pointed to for veneration'; prayed over by al-Nasir Faraj at his funeral at Midan al-Hasa days before Faraj himself was killed, 16 Muharram 815 {cite:shadharat-dhahab p. 118}."
  es: "Tughri Birdi, mameluco manumitido de Barquq, fue tres veces virrey de Damasco y una vez de Alepo, donde construyó una mezquita; \"serio, juicioso, objeto de veneración\"; al-Nasir Faraj rezó por él en su funeral en Midan al-Hasa días antes de que el propio Faraj fuera asesinado, el 16 de Muharram de 815 {cita: shadharat-dhahab p. 118}."
  fr: "Le mamelouk affranchi de Barquq, Tughri Birdi — trois fois vice-roi de Damas et une fois d'Alep, où il fit construire une mosquée; « grave, judicieux, désigné pour la vénération »; sur lequel a prié al-Nasir Faraj lors de ses funérailles à Midan al-Hasa quelques jours avant que Faraj lui-même ne soit tué, le 16 Muharram 815 {cite: shadharat-dhahab p. 118}."
  ur: "برقوق نے مملوک طغری بردی کو تیار کیا - تین بار دمشق کا وائسرائے اور ایک بار حلب کا، جہاں اس نے ایک مسجد بنائی؛ 'قبر، انصاف پسند، تعظیم کے لیے اشارہ کیا گیا'؛ 16 محرم 815 ہجری کو فراج کے خود قتل ہونے سے چند دن قبل مدان الحصا میں ان کے جنازے میں ناصر فراج نے نماز پڑھی۔ 118}۔"
  tr: "El-Şam'ın vekili Bardi el-Zahiri'yi ayarttı; Kral el-Zahir, saltanatının başında ona bir erik aldı, onu özgür bıraktı, etkili yaptı, ardından kadeh dağıtıcı yaptı ve Hadari dönemini yönetti; Şam ve Halep'te birkaç kez vali yardımcısı olarak görev yaptı, orada bir cami kurdu. Hoşgörülü, bilge ve güzel görünüşünün bulunduğu ülkelerde saygı görüyordu. 800 Hicri yılında üçüncü kez Şam vekilliğine yerleşti ve Muharrem ayının on altısı Perşembe günü orada vali olarak öldü. Kral el-Nasir onun için dua etti çünkü o sırada Şam'daydı. Hüsa tarlasında prensin mezarına gömülmesine tanık oldu, ardından birkaç gün sonra Sefer'de öldürüldü {atıf:shadharat-dhahab, s. 118}."
  id: "Ia menggoda Bardi al-Zahiri, wakil al-Sham; Raja al-Zahir membelikannya buah plum di awal pemerintahannya, membebaskannya, menjadikannya efektif, lalu menjadi pembawa cawan, dan memimpin masa Hadari serta berkembang hingga beberapa kali menjabat sebagai wakil gubernur Damaskus dan Aleppo, mendirikan sebuah masjid di sana. Ia bersikap sabar dan bijaksana, dan sangat dihormati di negara-negara dengan penampilannya yang indah. Ia menetap di jabatan wakil Damaskus untuk ketiga kalinya pada tahun 800 H dan meninggal sebagai gubernur di sana pada hari Kamis, tanggal enam belas Muharram. Raja al-Nasir berdoa untuknya karena ia saat itu berada di Damaskus. Ia menyaksikan pemakamannya di makam pangeran di ladang al-Husa, kemudian al-Nasir dibunuh beberapa hari kemudian di Safar {cite:shadharat-dhahab, hlm. 118}."
