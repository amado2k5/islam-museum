summary:
  ar: "بطاقة أولية لنصوح باشا، الصدر الأعظم العثماني في عهد أحمد الأول الذي طوّع الأناضول الجلالية وأُعدم سنة ١٦١٤م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Nasuh Pasha, the Ottoman grand vizier under Ahmed I who subdued the Anatolian Celali revolts and was executed in 1614; the source entry is not yet checked on the page."
  es: "Ficha de nombramiento de Nasuh Pasha, el gran visir otomano bajo el reinado de Ahmed I, quien sofocó las revueltas de los Celali en Anatolia y fue ejecutado en 1614; la fuente aún no ha sido verificada en la página."
  fr: "Fiche de conscription de Nasuh Pacha, grand vizir ottoman sous Ahmed Ier, qui réprima les révoltes anatoliennes de Celali et fut exécuté en 1614; la source n'est pas encore vérifiée sur la page."
  ur: "ناشوح پاشا کے لیے کارڈ کا مسودہ، احمد اول کے ماتحت عثمانی وزیر اعظم جس نے اناطولیہ سیلالی کی بغاوتوں کو زیر کیا اور اسے 1614 میں پھانسی دے دی گئی۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Ahmed I döneminde Osmanlı Sadrazami olan Nasuh Paşa'nın ön kartı; Celaliye Anadolu'yu boyun eğdirip 1614'te idam edilmiştir; Osmanlı tarih kitaplarında kendisi geçer ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Nasuh Pasha, Wazir Agung Ottoman pada masa pemerintahan Ahmed I, yang menaklukkan Anatolia Jalaliya dan dieksekusi pada tahun 1614 M; Buku sejarah Ottoman menyebutkannya dan biografinya belum pernah ditinjau di halaman tersebut."
