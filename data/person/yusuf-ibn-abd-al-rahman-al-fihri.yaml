summary:
  ar: "آخر ولاة الأندلس قديماً؛ لما اتفق جند الأندلس على إدالة الإمارة بين المضرية واليمانية سنة لكل دولة قدمته المضرية على أنفسهم سنة تسع وعشرين ومائة واستقام له سنة بقرطبة دار الإمارة، ثم لما وافته اليمانية لميعاد إدالتهم واثقين بعهدهم بيتهم بمكان نزولهم بشقندة من قرى قرطبة بممالأة الصميل بن حاتم والقيسية فاستلحمهم واستبد بالأندلس إلى أن جاء عبد الرحمن الداخل {cite:nafh-tib-maqqari p. 274}."
  en: "Last of the old governors of al-Andalus; when the jund agreed to alternate the amirate yearly between Qays and Yaman he broke the pact, massacring the Yamani leaders by night at Shaqunda, and ruled alone until Abd al-Rahman al-Dakhil came {cite:nafh-tib-maqqari p. 274}."
