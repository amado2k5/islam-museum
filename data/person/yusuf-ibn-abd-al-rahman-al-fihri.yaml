id: person/yusuf-ibn-abd-al-rahman-al-fihri
class: person
label: { ar: "يوسف بن عبد الرحمن الفهري" }
gender: male
summary:
  ar: "آخر ولاة الأندلس قديماً؛ لما اتفق جند الأندلس على إدالة الإمارة بين المضرية واليمانية سنة لكل دولة قدمته المضرية على أنفسهم سنة تسع وعشرين ومائة واستقام له سنة بقرطبة دار الإمارة، ثم لما وافته اليمانية لميعاد إدالتهم واثقين بعهدهم بيتهم بمكان نزولهم بشقندة من قرى قرطبة بممالأة الصميل بن حاتم والقيسية فاستلحمهم واستبد بالأندلس إلى أن جاء عبد الرحمن الداخل {cite:nafh-tib-maqqari p. 274}."
  en: "Last of the old governors of al-Andalus; when the jund agreed to alternate the amirate yearly between Qays and Yaman he broke the pact, massacring the Yamani leaders by night at Shaqunda, and ruled alone until Abd al-Rahman al-Dakhil came {cite:nafh-tib-maqqari p. 274}."
  es: "Último de los antiguos gobernadores de al-Ándalus; cuando el jund acordó alternar el emirato anualmente entre Qays y Yaman, rompió el pacto, masacrando a los líderes yamani por la noche en Shaqunda, y gobernó solo hasta que llegó Abd al-Rahman al-Dakhil {cite:nafh-tib-maqqari p. 274}."
  fr: "Dernier des anciens gouverneurs d'al-Andalus; lorsque le jund accepta d'alterner l'émirat chaque année entre Qays et Yaman, il rompit le pacte, massacrant les chefs yéménites de nuit à Shaqunda, et gouverna seul jusqu'à l'arrivée d'Abd al-Rahman al-Dakhil {cite:nafh-tib-maqqari p. 274}."
  ur: "اندلس کے پرانے گورنروں میں سے آخری؛ جب جند نے قیس اور یمن کے درمیان ہر سال امیریت کے متبادل پر اتفاق کیا تو اس نے معاہدہ توڑ دیا، شبوندہ میں یمنی لیڈروں کا قتل عام کیا اور عبدالرحمٰن الدخیل کے آنے تک تنہا حکومت کی۔ 274}۔"
  tr: "Eski zamanlarda el-Endülüs'ün son valisi; Endülüs askerleri Mudariyye ile Yemenliler arasındaki emirliği her devlet için bir yıl vermeyi kabul ettiklerinde, Mudarîler 129 Hicri yılında kendilerine verdiler ve emirliğin merkezi olan Kordoba'da bir yıl kurdu. Daha sonra, Yemenliler teslim tarihinde ona ulaştıklarında, Kordoba'nın köylerinden biri olan Şaqanda'daki evleriyle yaptıklarına güvenerek, el-Samil ibn Hatim ve el-Kaysiya'nın desteğiyle, onların korumasını aldı ve Abdülrahman el-Dakhil gelene kadar Endülüs'ü yönetti {cite:nafh-tib-maqqari, s. 274}."
  id: "Gubernur terakhir al-Andalus pada zaman dahulu; ketika tentara Andalusia setuju memberikan emirat antara Mudariyya dan Yaman satu tahun untuk setiap negara, Mudarites akan memberikannya kepada diri mereka sendiri pada tahun 129 H, dan ia mendirikan satu tahun di Cordoba, pusat emirat tersebut. Kemudian, ketika orang Yaman tiba di hari penyerahan mereka, yakin akan perjanjian mereka dengan rumah mereka di Shaqanda, salah satu desa di Cordoba, dengan dukungan al-Samil ibn Hatim dan al-Qaysiya, ia mengambil perlindungan mereka dan memerintah al-Andalus hingga Abd al-Rahman al-Dakhil datang {cite:nafh-tib-maqqari, hlm. 274}."
