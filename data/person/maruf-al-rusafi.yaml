summary:
  ar: "شاعر ومربّ عراقي ⁦(1875–1945)⁩ من أعلام الشعر العربي الحديث. درس في بغداد على محمود شكري الألوسي، وعمل مدرّسًا وعضوًا في مجلس المبعوثان العثماني، وعُرف بشعره الاجتماعي في الدفاع عن الفقراء وحقوق النساء والتعليم، وله ديوان «الرصافي» ومحاضرات في الأدب العربي."
  en: "Iraqi poet and educationist (1875–1945), a luminary of modern Arabic poetry. He studied in Baghdad under Mahmud Shukri al-Alusi, worked as a teacher and member of the Ottoman Chamber of Deputies, and was known for socially committed verse defending the poor, women's rights and education; he left the Diwan al-Rusafi and lectures on Arabic literature."
  ur: "عراقی شاعر اور ماہرِ تعلیم ⁦(1875–1945)⁩ جو جدید عربی شاعری کے ستونوں میں شمار ہوتے ہیں۔ انہوں نے بغداد میں محمود شکری آلوسی سے درس کیا، مدرس اور عثمانی مجلسِ مبعوثان کے رکن رہے اور غریبوں، خواتین کے حقوق اور تعلیم کے دفاع میں سماجی شاعری کے لیے مشہور ہوئے؛ ان میں دیوانِ رصافی اور عربی ادب کے خطبات ہیں۔"
