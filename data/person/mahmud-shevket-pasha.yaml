summary:
  ar: "مشير ورجل دولة عثماني، والرجل القوي في السنوات التي تلت انقلاب 1909 المضاد، والصدر الأعظم من يناير 1913 حتى اغتياله في يونيو من العام نفسه. وُلد في بغداد، وقاد جيش الحركة الذي قمع حادثة 31 مارس وخلع عبد الحميد الثاني، وتولى وزارة الحربية، ثم أُطلق عليه النار في سيارته بميدان بايزيد من خصوم جمعية الاتحاد والترقي."
  en: "Ottoman field marshal and statesman, the strongman of the years after the 1909 counter-coup, and Grand Vizier from January 1913 until his assassination that June. Born in Baghdad, he commanded the Action Army that suppressed the 31 March Incident and deposed Abdul Hamid II, served as Minister of War, and was shot in his car at Beyazıt Square by opponents of the Committee of Union and Progress."
  ur: "عثمانی مشیر اور مدبر، 1909 کی جوابی بغاوت کے بعد کے برسوں کے طاقتور شخص، اور جنوری 1913 سے اسی سال جون میں اپنے قتل تک صدرِ اعظم۔ بغداد میں پیدا ہوئے، 31 مارچ واقعے کو کچلنے اور عبدالحمید ثانی کو معزول کرنے والی حرکت فوج کی قیادت کی، وزیرِ جنگ رہے، اور بایزید چوک میں اپنی گاڑی میں جمعیتِ اتحاد و ترقی کے مخالفوں کے ہاتھوں گولی مار کر ہلاک ہوئے۔"
  es: "Mariscal de campo y estadista otomano, hombre fuerte de los años posteriores al contragolpe de 1909, y Gran Visir desde enero de 1913 hasta su asesinato en junio de ese mismo año. Nacido en Bagdad, comandó el Ejército de Acción que sofocó el Incidente del 31 de marzo y depuso a Abdul Hamid II, fue Ministro de Guerra y fue asesinado a tiros en su coche en la plaza Beyazıt por opositores del Comité de Unión y Progreso."
  fr: "Maréchal et homme d'État ottoman, figure emblématique des années qui suivirent le contre-coup d'État de 1909, il fut Grand Vizir de janvier 1913 jusqu'à son assassinat en juin de la même année. Né à Bagdad, il commanda l'Armée d'action qui réprima l'incident du 31 mars et destitua Abdul Hamid II, occupa le poste de ministre de la Guerre et fut abattu dans sa voiture sur la place Beyazıt par des opposants au Comité Union et Progrès."
  tr: "Osmanlı mareşali ve devlet adamı, 1909 karşı darbesinden sonraki yıllarda güçlü bir adam ve Ocak 1913'ten aynı yılın Haziran ayında suikasta uğramasına kadar Sadrazam olarak görev yaptı. Bağdat'ta doğdu, 31 Mart olayını bastıran hareketin ordusuna liderlik etti, II. Abdulhamid'i devirdi, Savaş Bakanlığı'nı devraldı ve Birlik ve İlerleme Derneği'nin muhalif olan Bayazid Meydanı'nda arabasında vuruldu."
  id: "Seorang marsekal dan negarawan Ottoman, seorang tokoh kuat setelah kudeta balasan 1909, dan Grand Vizier dari Januari 1913 hingga pembunuhannya pada Juni tahun yang sama. Ia lahir di Baghdad, memimpin tentara gerakan yang menumpas insiden 31 Maret, menggulingkan Abdul Hamid II, mengambil alih Kementerian Perang, dan ditembak di mobilnya di Bayazid Square, seorang penentang Union and Progress Association."
