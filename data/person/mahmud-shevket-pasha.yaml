summary:
  ar: "مشير ورجل دولة عثماني، والرجل القوي في السنوات التي تلت انقلاب 1909 المضاد، والصدر الأعظم من يناير 1913 حتى اغتياله في يونيو من العام نفسه. وُلد في بغداد، وقاد جيش الحركة الذي قمع حادثة 31 مارس وخلع عبد الحميد الثاني، وتولى وزارة الحربية، ثم أُطلق عليه النار في سيارته بميدان بايزيد من خصوم جمعية الاتحاد والترقي."
  en: "Ottoman field marshal and statesman, the strongman of the years after the 1909 counter-coup, and Grand Vizier from January 1913 until his assassination that June. Born in Baghdad, he commanded the Action Army that suppressed the 31 March Incident and deposed Abdul Hamid II, served as Minister of War, and was shot in his car at Beyazıt Square by opponents of the Committee of Union and Progress."
  ur: "عثمانی مشیر اور مدبر، 1909 کی جوابی بغاوت کے بعد کے برسوں کے طاقتور شخص، اور جنوری 1913 سے اسی سال جون میں اپنے قتل تک صدرِ اعظم۔ بغداد میں پیدا ہوئے، 31 مارچ واقعے کو کچلنے اور عبدالحمید ثانی کو معزول کرنے والی حرکت فوج کی قیادت کی، وزیرِ جنگ رہے، اور بایزید چوک میں اپنی گاڑی میں جمعیتِ اتحاد و ترقی کے مخالفوں کے ہاتھوں گولی مار کر ہلاک ہوئے۔"
