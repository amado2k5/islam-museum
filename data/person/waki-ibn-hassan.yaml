label: { ar: "وكيع بن حسان التميمي", en: "Waki' ibn Hassan al-Tamimi" }
summary:
  ar: "وكيع بن حسان بن قيس بن أبي سود بن كلب بن عوف بن مالك بن غدانة بن يربوع بن حنظلة التميمي؛ أشار به الحضين بن المنذر على أهل خراسان لمحاربة قتيبة وقال لا يقوى على هذا الأمر غيره لأنه أعرابي جاف تطيعه عشيرته وقد قتل قتيبة بني الأهثم فهم يطلبونه بدمائهم فأعطاهم يده فبايعوه وكان السفير بينه وبينهم حيان مولى مصطل."
  en: "Waki' ibn Hassan ibn Qays ibn Abi Sud of Tamim; al-Hudayn's choice to lead Khurasan against Qutayba — 'a rough Arab his clan obeys, and the Banu al-Ahtham Qutayba slew seek him for their blood' — he gave his hand and took their bay'a, Hayyan mawla Maslama their go-between."
