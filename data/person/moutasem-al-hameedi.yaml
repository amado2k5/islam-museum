summary:
  ar: "محاضر إسلامي ومؤلف. درس على تلامذة الألباني البارزين، وعمل إماما ومحاضرا في مسجد ابن تيمية بلندن ومركز الدعوة إلى الإسلام في لوتون، وحاضر في جامعات ومدارس بريطانيا، وقدّم برامج وسلاسل محاضرات على قناة هدى التلفزيونية. من كتبه «Reach the Sweetness of Prayer» (2019)، وتجمع منصة مسلم سنترال محاضراته المسجلة في سلسلة بودكاست باسمه منذ 2015."
  en: "Islamic lecturer and author. He studied under prominent students of al-Albani, served as imam and lecturer at the Ibn Taymiyyah Mosque in London and the Call to Islam Islamic Center in Luton, lectured at British universities and schools, and hosted television shows and lecture series on Huda TV. His book Reach the Sweetness of Prayer was published in 2019, and Muslim Central's podcast series under his name has carried his recorded lectures since 2015."
  ur: "اسلامی مبلغ اور مصنف۔ انہوں نے البانی کے ممتاز شاگردوں سے تعلیم حاصل کی، لندن کی ابن تیمیہ مسجد اور لوٹن کے «کال ٹو اسلام» مرکز میں امام و مدرس رہے، برطانوی جامعات و مدارس میں خطاب کیا، اور ہدیٰ ٹی وی پر پروگرام اور خطبات کی سلسلے پیش کیے۔ ان کی کتاب Reach the Sweetness of Prayer 2019 میں شائع ہوئی، اور مسلم سنٹرل کی پوڈکاسٹ سلسلہ 2015 سے ان کے ریکارڈ شدہ خطبات ان کے نام سے شائع کر رہی ہے۔"
