id: person/ahmad-al-siddiq-al-ghumari
class: person
label:
  ar: "أحمد بن الصديق الغماري"
  en: "Ahmad al-Ghumari"
  fr: "Ahmad al-Ghumari"
  es: "Ahmad al-Ghumari"
  ur: "احمد الغماری"
roles: [muhaddith]
gender: male
summary:
  ar: "أحمد بن محمد بن الصديق بن أحمد، أبو الفيض الغماري الحسني الأزهري، متفقه شافعي مغربي من نزلاء طنجة، تعلم في الأزهر واستقر وتوفي بالقاهرة، من كتبه رياض التنزيه ومطالع البدور وإبراز الوهم المكنون. يذكر الزركلي وفاته سنة 1380 هـ."
  en: "Ahmad ibn Muhammad ibn al-Siddiq ibn Ahmad, Abu al-Fayd al-Ghumari al-Hasani al-Azhari, a Moroccan Shafi'i jurist who lived at Tangier, studied at al-Azhar and settled and died in Cairo; author of Riyad al-Tanzih, Matali' al-Budur and Ibraz al-Wahm al-Maknun. Al-Zirikli prints his death as 1380 AH (1960)."
  fr: "Ahmad ibn Muhammad ibn al-Siddiq ibn Ahmad, Abu al-Fayd al-Ghumari al-Hasani al-Azhari, juriste marocain chaféite ayant vécu à Tanger, étudié à al-Azhar, puis s'étant établi et étant mort au Caire ; auteur de Riyad al-Tanzih, Matali' al-Budur et Ibraz al-Wahm al-Maknun. Al-Zirikli donne sa mort en 1380 H (1960 ap. J.-C.)."
  es: "Ahmad ibn Muhammad ibn al-Siddiq ibn Ahmad, Abu al-Fayd al-Ghumari al-Hasani al-Azhari, un jurista shafi'i marroquí que vivió en Tánger, estudió en al-Azhar y se estableció y murió en El Cairo; autor de Riyad al-Tanzih, Matali' al-Budur e Ibraz al-Wahm al-Maknun. Al-Zirikli publica su muerte como 1380 AH (1960)."
  ur: "احمد بن محمد بن الصدیق ابن احمد، ابو الفائد الغماری الحسنی الازہری، ایک مراکشی شافعی فقیہ جو تانگیر میں رہتے تھے، الازہر میں تعلیم حاصل کی اور قاہرہ میں مقیم ہوئے اور وفات پائی۔ ریاض التنزیہ، متلی البدور اور ابراز الوہم المکنون کے مصنف۔ الزرکلی نے ان کی وفات 1380ھ (1960) کو چھاپا۔"
  tr: "Ahmed ibn Muhammed ibn el-Sıddık ibn Ahmad, Ebu el-Fayd el-Ghumari el-Hasani el-Ezheri, Tanca'da ikamet eden, el-Ezher'de eğitim gören, Kahire'ye yerleşen ve orada ölen Faslı Şafii hukukçu. Eserleri arasında Riyad al-Tanzih, Matali' al-Budur ve Ibraz al-Wahm al-Meknun bulunmaktadır. El-Zerkali onun H. 1380 yılındaki ölümünden bahseder."
  id: "Ahmad ibn Muhammad ibn al-Siddiq ibn Ahmad, Abu al-Fayd al-Ghumari al-Hasani al-Azhari, seorang ahli hukum Syafi'i Maroko yang berdomisili di Tangier, belajar di al-Azhar, menetap di Kairo, dan meninggal di sana. Karya-karyanya antara lain Riyad al-Tanzih, Matali' al-Budur, dan Ibraz al-Wahm al-Maknun. Al-Zarkali menyebutkan kematiannya pada tahun 1380 H."
