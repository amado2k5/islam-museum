summary:
  ar: "أحمد بن محمد بن الصديق بن أحمد، أبو الفيض الغماري الحسني الأزهري، متفقه شافعي مغربي من نزلاء طنجة، تعلم في الأزهر واستقر وتوفي بالقاهرة، من كتبه رياض التنزيه ومطالع البدور وإبراز الوهم المكنون. يذكر الزركلي وفاته سنة 1380 هـ."
  en: "Ahmad ibn Muhammad ibn al-Siddiq ibn Ahmad, Abu al-Fayd al-Ghumari al-Hasani al-Azhari, a Moroccan Shafi'i jurist who lived at Tangier, studied at al-Azhar and settled and died in Cairo; author of Riyad al-Tanzih, Matali' al-Budur and Ibraz al-Wahm al-Maknun. Al-Zirikli prints his death as 1380 AH (1960)."
