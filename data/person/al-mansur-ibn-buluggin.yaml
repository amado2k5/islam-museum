id: person/al-mansur-ibn-buluggin
class: person
label:
  ar: المنصور بلكيز بن بلكين الزيري
  en: al-Mansur Buluggin (Bulukkin) ibn Buluggin
  fr: "al-Mansur Buluggin (Bulukkin) ibn Buluggin"
  es: "al-Mansur Buluggin (Bulukkin) ibn Buluggin"
  ur: "المنصور بلوگن ⁦(بلوکین)⁩ ابن بلوگین"
summary:
  ar: "المنصور بن بلكين بن زيري الصنهاجي، ثاني ملوك آل زيري بإفريقية؛ خلف أباه في ولاية العبيديين وقاد حرباً ضارية على أبي يزيد مخلد بن كيداد النكاري الملقب صاحب الحمار حين ثار على الدولة الفاطمية وحاصرها في عقر دارها حتى كاد يستأصلها، فكانت له عليه العاقبة وقتله وقمع فتنته، وعقد لأخيه حماد على أشير والمسيلة فكان ذلك أصل دولة آل حماد بالمغرب الأوسط."
  en: "al-Mansur Buluggin ibn Buluggin (Bulukkin) al-Sanhaji, second Zirid king of Ifriqiya; succeeding his father in the Fatimid governorship, he waged the desperate war on Abu Yazid Mukhallad ibn Kaydad the Kharijite 'Man of the Donkey', who rose on the dynasty and besieged it in its own seat until he nearly uprooted it — al-Mansur prevailed, killed him and quenched his fitna, and it was he who invested his brother Hammad with Ashir and Msila, the seed of the Hammadid state."
  fr: "al-Mansur Buluggin ibn Buluggin (Bulukkin) al-Sanhaji, deuxième roi ziride d'Ifriqiya ; succédant à son père dans le gouvernement fatimide, il mena la guerre désespérée contre Abu Yazid Mukhallad ibn Kaydad, l'homme de l'âne kharijite, qui s'éleva sur la dynastie et l'assiégea dans son propre siège jusqu'à ce qu'il le déracine presque - al-Mansur l'emporta, le tua et éteignit sa fitna, et c'est lui qui a investi son frère Hammad avec Ashir et Msila, la graine de l'état Hammadide."
  es: "al-Mansur Buluggin ibn Buluggin (Bulukkin) al-Sanhaji, segundo rey zirí de Ifriqiya; sucediendo a su padre en el gobierno fatimí, libró una guerra desesperada contra Abu Yazid Mukhallad ibn Kaydad el jariyí 'Hombre del Asno', quien se alzó contra la dinastía y la asedió en su propia sede hasta casi desarraigarla. Al-Mansur prevaleció, lo mató y sofocó su fitna, y fue él quien invistió a su hermano Hammad con Ashir y Msila, la semilla del estado hammadí."
  ur: "المنصور بلوگین ابن بلوگن ⁦(بلوکین)⁩ السنہجی، عفریقیہ کا دوسرا زرد بادشاہ؛ فاطمی گورنری میں اپنے والد کی جگہ لے کر، اس نے ابو یزید مخلّد بن کیداد، خوارجی 'گدھے کے آدمی' کے خلاف مایوس کن جنگ چھیڑ دی، جو خاندان پر چڑھا اور اس نے اس کا محاصرہ کر لیا یہاں تک کہ اس نے اسے جڑ سے اکھاڑ پھینکا - المنصور غالب آ گیا، اور اس کے بھائی حماد کو قتل کر دیا اور اس کے ساتھ سرمایہ کاری کر لی۔ آشیر اور مسیلہ، حمادی ریاست کا بیج۔"
  tr: "Ziri hanedanının İfrikiye'deki ikinci kralı el-Mansur bin Balkin ibn Ziri el-Sanhaci, babasının yerine Ubeydiyyin eyaletinde geçti ve Fatımi devletine karşı isyan eden ve kalbinde kuşatan Ebu Yazid Mukhlad ibn Kidad el-Nehari'ye karşı şiddetli bir savaş yürüttü; Fıskiye devletine karşı isyan etti ve neredeyse kökünden söküp geçti. Bu durum sonunda onun idamı ve isyanının bastırılmasına yol açtı. Kardeşi Hammad'a Aşir ve El-M'sila topraklarını verdi ve böylece Hammad hanedanının kökenini Orta Mağrip'te belirledi."
  id: "Al-Mansur ibn Balkin ibn Ziri al-Sanhaji, raja kedua dinasti Ziri di Ifriqiya, menggantikan ayahnya di provinsi Ubaydiyyin dan memimpin perang sengit melawan Abu Yazid Mukhlad ibn Kidad al-Nakari, yang dijuluki Sahib al-Hamkari, ketika ia memberontak melawan negara Fatimiyah dan mengepungnya di jantungnya hingga hampir menghancurkannya. Hal ini akhirnya menyebabkan eksekusi dan penindasan hasutannya. Ia memberikan tanah Ashir dan Al-M'sila, kepada saudaranya Hammad, sehingga menetapkan asal mula dinasti Hammad di Maghreb tengah."
