label:
  ar: المنصور بلكيز بن بلكين الزيري
  en: al-Mansur Buluggin (Bulukkin) ibn Buluggin
summary:
  ar: "المنصور بن بلكين بن زيري الصنهاجي، ثاني ملوك آل زيري بإفريقية؛ خلف أباه في ولاية العبيديين وقاد حرباً ضارية على أبي يزيد مخلد بن كيداد النكاري الملقب صاحب الحمار حين ثار على الدولة الفاطمية وحاصرها في عقر دارها حتى كاد يستأصلها، فكانت له عليه العاقبة وقتله وقمع فتنته، وعقد لأخيه حماد على أشير والمسيلة فكان ذلك أصل دولة آل حماد بالمغرب الأوسط."
  en: "al-Mansur Buluggin ibn Buluggin (Bulukkin) al-Sanhaji, second Zirid king of Ifriqiya; succeeding his father in the Fatimid governorship, he waged the desperate war on Abu Yazid Mukhallad ibn Kaydad the Kharijite 'Man of the Donkey', who rose on the dynasty and besieged it in its own seat until he nearly uprooted it — al-Mansur prevailed, killed him and quenched his fitna, and it was he who invested his brother Hammad with Ashir and Msila, the seed of the Hammadid state."
