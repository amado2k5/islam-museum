label:
  ar: السلطان أبو سعيد عثمان المريني
  en: Sultan Abu Sa'id Uthman II al-Marini
  fr: "Sultan Abu Sa'id Uthman II al-Marini"
  es: "Sultan Abu Sa'id Uthman II al-Marini"
  ur: "سلطان ابو سعید عثمان ثانی المرینی۔"
summary:
  ar: "أبو سعيد عثمان بن يعقوب بن عبد الحق المريني ⁦(710-731هـ)⁩؛ خرجت أخته عريبة على العمل في بيعته حتى قام بالأمر، فرفع الظلامات وحط المغارم والمكوس وسرح أهل السجون، وغزا تلمسان سنة 714هـ فنازلها بالملعب، ونازله ابنه أبو علي في فتنة أشعلها حتى قتل، وكانت دولته زهرة ملك بني مرين رخاء وعمراناً، وخطب له بالأندلس، وهلك سنة 731هـ وبويع ابنه أبو الحسن."
  en: "Abu Sa'id Uthman ibn Ya'qub ibn Abd al-Haqq al-Marini (710-731 AH); his sister Urayba worked for his bay'a until he stood in command, lifted the grievances, cut the unlawful taxes and freed the prisoners, besieged Tlemcen in 714 AH at the playground field, fought his son Abu Ali's revolt until the son was killed — his reign the flower of Marinid prosperity, preached in al-Andalus, dying in 731 AH when his son Abu al-Hasan was acclaimed."
  fr: "Abu Sa'id Uthman ibn Ya'qub ibn Abd al-Haqq al-Marini (710-731 H) ; sa sœur Urayba œuvra pour son allégeance jusqu'à sa prise de pouvoir. Il répara les injustices, supprima les impôts illégaux et libéra les prisonniers, assiégea Tlemcen en 714 H au terrain de jeu et combattit la révolte de son fils Abu Ali jusqu'à la mort de celui-ci. Son règne fut l'apogée de la prospérité mérinide, et le sermon fut prononcé en son nom en al-Andalus ; il mourut en 731 H, lorsque son fils Abu al-Hasan fut acclamé."
  es: "Abu Sa'id Uthman ibn Ya'qub ibn Abd al-Haqq al-Marini (710-731 AH); su hermana Urayba trabajó para su bay'a hasta que él tomó el mando, levantó las quejas, redujo los impuestos ilegales y liberó a los prisioneros, sitió Tlemcen en 714 AH en el campo de juego, luchó contra la revuelta de su hijo Abu Ali hasta que este murió; su reinado fue la flor de la prosperidad mariní, predicó en al-Ándalus, murió en 731 AH cuando su hijo Abu al-Hasan fue aclamado."
  ur: "ابو سعید عثمان بن یعقوب بن عبد الحق المرینی ⁦(710-731ھ)⁩؛ اس کی بہن عریبہ نے اس کی بیع کے لیے کام کیا یہاں تک کہ اس نے حکم دیا، شکایات ختم کیں، غیر قانونی ٹیکسوں میں کمی کی اور قیدیوں کو آزاد کیا، 714 ہجری میں کھیل کے میدان میں تلمسن کا محاصرہ کیا، اپنے بیٹے ابو علی کی بغاوت کا مقابلہ کیا یہاں تک کہ بیٹا مارا گیا۔ ہجری کو جب ان کے بیٹے ابو الحسن نے مدح سرائی کی۔"
  tr: "Ebu Said Osman bin Yakub bin Abdül Hak el-Marini (710-731 Hicri); kız kardeşi Ariba, onun biatında çalışmasına karşı isyan etti, ancak o meseleyi ele geçirdi. Bunun üzerine haksızlıkları ortadan kaldırdı, vergileri ve harçları azalttı, hapishanelerdeki insanları serbest bıraktı ve 714 Hicri yılında Tlemcen'i işgal edip meydanda kuşattı. Oğlu Ebu Ali, onun kışkırttığı bir fitneye girişti ve bu fitne öldürülene kadar devam etti. Onun dönemi, Beni Marin krallığının refah ve gelişme açısından en parlak dönemiydi. Endülüs'te onun için bir hutbe okundu. 731 Hicri yılında vefat etti ve yerine oğlu Ebu el-Hasan biat etti."
  id: "Abu Saeed Uthman bin Yaqoub bin Abdul Haq Al-Marini (710-731 H); saudara perempuannya, Ariba, memberontak dan menolak untuk berbaiat kepadanya hingga ia mengambil alih masalah tersebut, sehingga ia menghapus ketidakadilan, mengurangi pajak dan bea, serta membebaskan orang-orang dari penjara, dan ia menyerbu Tlemcen pada tahun 714 H dan mengepungnya di stadion, dan putranya, Abu Ali, menentangnya dalam pemberontakan yang ia kobarkan hingga ia terbunuh, dan kerajaannya menjadi primadona kerajaan Bani Marin dalam kemakmuran dan perkembangan, dan khutbah disampaikan untuknya di Andalusia, dan ia meninggal pada tahun 731 H dan putranya, Abu Al-Hassan, menerima baiat."
