id: person/abu-said-uthman-marinid
class: person
label:
  ar: السلطان أبو سعيد عثمان المريني
  en: Sultan Abu Sa'id Uthman II al-Marini
summary:
  ar: "أبو سعيد عثمان بن يعقوب بن عبد الحق المريني (710-731هـ)؛ خرجت أخته عريبة على العمل في بيعته حتى قام بالأمر، فرفع الظلامات وحط المغارم والمكوس وسرح أهل السجون، وغزا تلمسان سنة 714هـ فنازلها بالملعب، ونازله ابنه أبو علي في فتنة أشعلها حتى قتل، وكانت دولته زهرة ملك بني مرين رخاء وعمراناً، وخطب له بالأندلس، وهلك سنة 731هـ وبويع ابنه أبو الحسن."
  en: "Abu Sa'id Uthman ibn Ya'qub ibn Abd al-Haqq al-Marini (710-731 AH); his sister Urayba worked for his bay'a until he stood in command, lifted the grievances, cut the unlawful taxes and freed the prisoners, besieged Tlemcen in 714 AH at the playground field, fought his son Abu Ali's revolt until the son was killed — his reign the flower of Marinid prosperity, preached in al-Andalus, dying in 731 AH when his son Abu al-Hasan was acclaimed."
