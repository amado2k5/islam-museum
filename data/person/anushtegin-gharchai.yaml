summary:
  ar: "بطاقة أولية لأنوشتكين غرجه، مولى السلاجقة الذي وُلّي خوارزم ومن نسله قامت دولة الخوارزمشاهية في أوائل القرن الثاني عشر، توفي سنة ١٠٩٧م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Anushtegin Gharchai, the Seljuk mamluk governor of Khwarazm from whose line the later Khwarazmshah dynasty sprang in the early twelfth century, d. 1097; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Anushtegin Gharchai, el gobernador mameluco selyúcida de Corasmia, de cuya estirpe surgió la posterior dinastía de los shah de Corasmia a principios del siglo XII, fallecido en 1097; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche d'Anushtegin Gharchai, gouverneur mamelouk seldjoukide du Khwarezm, dont la lignée a donné naissance à la dynastie des Khwarezmshah au début du XIIe siècle, mort en 1097; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "خوارزم کے سلجوق مملوک گورنر انوشتیگین گھرچائی کے لیے ڈرافٹ کارڈ جس کے بعد خوارزمشاہ خاندان بارہویں صدی کے اوائل میں شروع ہوا، ڈی۔ 1097; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
