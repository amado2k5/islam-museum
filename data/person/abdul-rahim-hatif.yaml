summary:
  ar: "سياسي أفغاني (1926–2013)، مولود في قندهار في أسرة بشتونية. كان من نواب رئيس جمهورية أفغانستان الديمقراطية في سنواتها الأخيرة — نائبًا منذ انتخابات 1988 ونائبًا أول للرئيس من يوليو 1991 إلى أبريل 1992 — فصار رئيسًا بالوكالة لأسبوعين، من 16 إلى 28 أبريل 1992، بعد إزاحة الرئيس نجيب الله وقبل استيلاء المجاهدين على كابل، وناشد بنقل سلمي للسلطة. أُقصي عن الحكم سنة 1992 فنفي إلى هولندا، حيث توفي في ألفن آن دن راين سنة 2013."
  en: "Afghan politician (1926–2013), born at Kandahar into a Pashtun family. He was one of the vice presidents of the Democratic Republic of Afghanistan in its last years — a vice president from the 1988 elections and first vice president from July 1991 to April 1992 — and then acting President for two weeks, from 16 to 28 April 1992, after President Najibullah's removal and before the mujahideen takeover of Kabul, appealing for a peaceful transfer of power. Put out of power in 1992, he went into exile in the Netherlands, where he died at Alphen aan den Rijn in 2013."
  ur: "افغان سیاست دان (1926ء–2013ء)، قندھار میں ایک پشتون خاندان میں پیدا ہوئے۔ وہ جمہوری جمہوریہ افغانستان کے آخری برسوں میں نائب صدور میں سے تھے — 1988ء کے انتخابات سے نائب صدر اور جولائی 1991ء سے اپریل 1992ء تک اول نائب صدر — پھر صدر نجیب اللہ کی برطرفی کے بعد اور مجاہدین کے کابل پر قبضے سے پہلے، 16 تا 28 اپریل 1992ء دو ہفتے قائم مقام صدر رہے اور اقتدار کی پرامن منتقلی کی اپیل کی۔ 1992ء میں برطرفی کے بعد وہ ہالینڈ جلا وطن ہوئے، جہاں 2013ء میں الفن آن دن رائن میں ان کا انتقال ہوا۔"
