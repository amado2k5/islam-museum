summary:
  ar: "نبيل أيرلندي ومهندس مدني (1855-1935)، خامس بارون هيدلي، اعتنق الإسلام سنة 1913 بيد خواجة كمال الدين واتخذ اسم الشيخ رحمت الله الفاروق، فصار من قادة بعثة ووكينغ الإسلامية ورئيس الجمعية الإسلامية البريطانية، وحج مرتين، وعُرض عليه عرش ألبانيا سنة 1925 فرفضه."
  en: "Irish peer and civil engineer (1855-1935), 5th Baron Headley, who converted to Islam in 1913 at Khwaja Kamal-ud-Din's hand, taking the name Shaikh Rahmatullah al-Farooq; a leading figure of the Woking Muslim Mission and president of the British Muslim Society, he performed the Hajj twice and in 1925 refused an offer of the Albanian throne."
  ur: "آئرش نواب اور سول انجینئر (1855ء–1935ء)، پانچویں بیرن ہیڈلے، جنہوں نے 1913ء میں خواجہ کمال الدین کے ہاتھ پر اسلام قبول کیا اور شیخ رحمت اللہ الفاروق کا نام اختیار کیا؛ ووکنگ مسلم مشن کے سرکردہ رہنما اور برٹش مسلم سوسائٹی کے صدر رہے، دو بار حج کیا اور 1925ء میں البانیہ کے تخت کی پیشکش ٹھکرا دی۔"
