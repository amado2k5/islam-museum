summary:
  ar: "أبو زيد النميري، واسمه زيد وإنما لُقّب شبة لأن أمه كانت ترقصه وتقول: يا بابي وشبا، وعاش حتى دبّا؛ ولد سنة ثلاث وخمسين ومائة وحدّث عن غندر وابن مهدي ويزيد بن هارون وغيرهم، روى عنه ابن أبي الدنيا والبغوي وابن صاعد، وكان ثقة عالماً بالسير وأيام الناس وله تصانيف كثيرة؛ وذكر أنه رأى وكيع بن الجراح في النوم يتوضأ على شاطئ دجلة فسأله أن يحدّثه فحدّثه في المنام فحفظ الحديث؛ توفي بسر من رأى في جمادى الآخرة سنة اثنتين وستين ومائتين عن تسع وثمانين سنة إلا أربعة أيام {cite:muntazam-ibn-al-jawzi p. 130}."
  en: "Abu Zayd al-Numayri — 'Shabba' was his mother's lullaby-word, not his name (which was Zayd) — b. 173, a trustworthy master of the siyar and the Days of the Arabs with many books; he died at Samarra in Jumada II 262, just four days short of ninety {cite:muntazam-ibn-al-jawzi p. 130}."
  es: "Abu Zayd al-Numayri — 'Shabba' era la palabra de cuna de su madre, no su nombre (que era Zayd) — n. 173, un maestro confiable del siyar y de los Días de los Árabes con muchos libros; murió en Samarra en Jumada II 262, apenas cuatro días antes de cumplir noventa {cite:muntazam-ibn-al-jawzi p. 130}."
  fr: "Abu Zayd al-Numayri — « Shabba » était le mot de berceuse de sa mère, et non son nom (qui était Zayd) — né en 173, un maître digne de confiance du siyar et des Jours des Arabes avec de nombreux livres; il mourut à Samarra en Jumada II 262, quatre jours avant l'âge de quatre-vingt-dix ans {cite: muntazam-ibn-al-jawzi p. 130}."
  ur: "ابو زید النمیری - 'شبہ' ان کی والدہ کا لوری کا لفظ تھا، اس کا نام نہیں ⁦(جو زید تھا)⁩ - بی۔ 173، بہت سی کتابوں کے ساتھ سیار اور ایام عرب کا ایک قابل اعتماد استاد؛ ان کا انتقال سامرہ میں جمادی الثانی 262 میں ہوا، نوے سے صرف چار دن کم تھے۔ 130}۔"
  tr: "Ebu Zayd el-Nimeiri, adı Zayd idi, annesinin onunla dans eder ve 'Ey babam ve gençliği' dediği için Şaba lakabını aldı. Ayı olana kadar yaşadı; 153 Hicri yılında doğdu, Gandar, İbn Mehdi, Yezîd ibn Harun ve diğerlerinden rivayet etti. İbn Ebi Dunya, el-Baghawi ve İbn Said ondan rivayet etti. Güvenilirdi, biyografiler ve insanların zamanları hakkında bilgiliydi ve birçok eser yazdı. Dicle kıyısında abdest alırken Waki' ibn al-Jarrah'ı rüyasında gördüğünü ve ona anlatmasını istediğini, kendisinin de bunu rüyada anlattığını ve hadisi ezberlediğini anlattığını anlattı. 262 Hicri yılında, Cemade el-Ahira'da gördüklerinden gizlice, seksen dokuz yaşında öldü, sadece dört gün (alıntı:) Muntazam-ibn-al-Jawzi, s. 130}."
  id: "Abu Zayd al-Nimeiri, yang bernama Zayd, dijuluki Shabba karena ibunya sering menari bersamanya dan berkata: Wahai ayahku dan masa mudanya. Ia hidup hingga menjadi beruang; lahir tahun 153 H, ia menceritakan dari Ghandar, Ibn Mahdi, Yazid ibn Harun, dan lainnya. Ibn Abi Dunya, al-Baghawi, dan Ibn Sa'id menceritakan darinya. Ia dapat dipercaya, berpengetahuan tentang biografi dan zaman manusia, dan menulis banyak karya. Ia menyebutkan bahwa ia melihat Waki' ibn al-Jarrah dalam mimpi sedang berwudhu di tepi Sungai Tigris dan memintanya untuk menceritakan, dan ia menceritakannya dalam mimpi, dan menghafal haditsnya. Ia meninggal secara diam-diam karena apa yang ia lihat di Jumada al-Akhirah pada tahun 262 H, pada usia delapan puluh sembilan tahun, kecuali selama empat hari {cite:Muntazam-ibn-al-Jawzi, hlm. 130}."
