summary:
  ar: "أبو زيد النميري، واسمه زيد وإنما لُقّب شبة لأن أمه كانت ترقصه وتقول: يا بابي وشبا، وعاش حتى دبّا؛ ولد سنة ثلاث وخمسين ومائة وحدّث عن غندر وابن مهدي ويزيد بن هارون وغيرهم، روى عنه ابن أبي الدنيا والبغوي وابن صاعد، وكان ثقة عالماً بالسير وأيام الناس وله تصانيف كثيرة؛ وذكر أنه رأى وكيع بن الجراح في النوم يتوضأ على شاطئ دجلة فسأله أن يحدّثه فحدّثه في المنام فحفظ الحديث؛ توفي بسر من رأى في جمادى الآخرة سنة اثنتين وستين ومائتين عن تسع وثمانين سنة إلا أربعة أيام {cite:muntazam-ibn-al-jawzi p. 130}."
  en: "Abu Zayd al-Numayri — 'Shabba' was his mother's lullaby-word, not his name (which was Zayd) — b. 173, a trustworthy master of the siyar and the Days of the Arabs with many books; he died at Samarra in Jumada II 262, just four days short of ninety {cite:muntazam-ibn-al-jawzi p. 130}."
