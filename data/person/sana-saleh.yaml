  ar: "صانعة محتوى كندية في تورونتو تصنع مع زوجها ويل مقاطع كوميدية وتعريفية بالإسلام باسم «عائلة صالح»، وُلدت ونشأت في كولومبيا البريطانية وانتقلت إلى أونتاريو سنة 2019، وشاركت زوجها سنة 2020 في تأسيس شركة «لالا حجاب» للحجابات المصبوغة يدويًا بعبوات صديقة للبيئة."
