summary:
  ar: "عالم ومترجم أمريكي مسلم (مواليد 1954) يقيم في عمّان؛ وُلد لأسرة أمريكية من أصل ألماني في ولاية واشنطن، واعتنق الإسلام سنة 1977، وتتلمذ في سوريا على عبد الرحمن الشاغوري وأخذ عنه الطريقة الشاذلية وأُجيز شيخًا سنة 1996، وأسّس زاوية في عمّان، واشتهر بترجمته «عمدة السالك» إلى الإنجليزية وبترجمته للقرآن «القرآن منظورًا» (2022)."
  en: "American Muslim scholar and translator (born 1954) living in Amman. Born to a German American family in the state of Washington, he converted to Islam in 1977, studied in Syria as a disciple of Abd al-Rahman al-Shaghouri, from whom he took the Shadhili order and his authorization as a shaykh in 1996, and founded a zawiya in Amman; he is known for his English translation of Umdat al-Salik (Reliance of the Traveller) and his 2022 Quran translation, The Quran Beheld."
  ur: "امریکی مسلم عالم اور مترجم (پیدائش 1954)، عمان میں مقیم؛ ریاست واشنگٹن میں جرمن نژاد امریکی خاندان میں پیدا ہوئے، 1977 میں اسلام قبول کیا، شام میں عبد الرحمن الشاغوری کے شاگرد بن کر ان سے شاذلی سلسلہ لیا اور 1996 میں شیخ کی اجازت پائی، «عمدۃ السالک» کے انگریزی ترجمے اور 2022 کے ترجمۂ قرآن سے مشہور ہیں۔"
