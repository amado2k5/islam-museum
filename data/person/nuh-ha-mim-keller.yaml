summary:
  ar: "عالم ومترجم أمريكي مسلم ⁦(مواليد 1954)⁩ يقيم في عمّان؛ وُلد لأسرة أمريكية من أصل ألماني في ولاية واشنطن، واعتنق الإسلام سنة 1977، وتتلمذ في سوريا على عبد الرحمن الشاغوري وأخذ عنه الطريقة الشاذلية وأُجيز شيخًا سنة 1996، وأسّس زاوية في عمّان، واشتهر بترجمته «عمدة السالك» إلى الإنجليزية وبترجمته للقرآن «القرآن منظورًا» (2022)."
  en: "American Muslim scholar and translator (born 1954) living in Amman. Born to a German American family in the state of Washington, he converted to Islam in 1977, studied in Syria as a disciple of Abd al-Rahman al-Shaghouri, from whom he took the Shadhili order and his authorization as a shaykh in 1996, and founded a zawiya in Amman; he is known for his English translation of Umdat al-Salik (Reliance of the Traveller) and his 2022 Quran translation, The Quran Beheld."
  ur: "امریکی مسلم عالم اور مترجم ⁦(پیدائش 1954)⁩، عمان میں مقیم؛ ریاست واشنگٹن میں جرمن نژاد امریکی خاندان میں پیدا ہوئے، 1977 میں اسلام قبول کیا، شام میں عبد الرحمن الشاغوری کے شاگرد بن کر ان سے شاذلی سلسلہ لیا اور 1996 میں شیخ کی اجازت پائی، «عمدۃ السالک» کے انگریزی ترجمے اور 2022 کے ترجمۂ قرآن سے مشہور ہیں۔"
  es: "Erudito y traductor musulmán estadounidense (nacido en 1954) residente en Amán. Nacido en el estado de Washington en el seno de una familia germano-estadounidense, se convirtió al islam en 1977, estudió en Siria como discípulo de Abd al-Rahman al-Shaghouri, de quien recibió la orden Shadhili y su autorización como shaykh en 1996, y fundó una zawiya en Amán. Es conocido por su traducción al inglés de Umdat al-Salik (La confianza del viajero) y su traducción del Corán de 2022, El Corán contemplado."
  fr: "Érudit et traducteur musulman américain (né en 1954) résidant à Amman. Issu d'une famille germano-américaine de l'État de Washington, il s'est converti à l'islam en 1977, a étudié en Syrie comme disciple d'Abd al-Rahman al-Shaghouri, auprès duquel il a reçu l'ordre Shadhili et son autorisation de cheikh en 1996, et a fondé une zawiya à Amman; il est connu pour sa traduction anglaise d'Umdat al-Salik (La Confiance du Voyageur) et sa traduction du Coran de 2022, Le Coran Vu."
  tr: "Amman'da yaşayan Amerikalı Müslüman alim ve çevirmen (1954 doğumlu), Washington Eyaleti'nde Alman kökenli Amerikalı bir ailede doğdu; 1977'de İslam'a geçti, Suriye'de Abdul Rahman Al-Shaghuri'nin yanında eğitim aldı, ondan Şadhili tarikatını aldı ve 1996'da şeyh unvanı aldı. Amman'da bir zawiya kurdu ve \"Umdat al-Salik\"in İngilizceye çevirisi ile Kur'an'ın \"Kur'an Bir Bakış Açısından\" (2022) çevirisiyle ünlendi."
  id: "Seorang ulama dan penerjemah Muslim Amerika (lahir 1954) yang tinggal di Amman; lahir dari keluarga Amerika keturunan Jerman di Negara Bagian Washington, ia memeluk Islam pada tahun 1977, belajar di Suriah di bawah bimbingan Abdul Rahman Al-Shaghouri, mempelajari ordo Shadhili darinya, dan dianugerahi gelar sheikh pada tahun 1996. Ia mendirikan zawiya di Amman dan menjadi terkenal karena terjemahannya \"Umdat al-Salik\" ke dalam bahasa Inggris serta terjemahan Al-Qur'an \"The Quran from a Perspective\" (2022)."
