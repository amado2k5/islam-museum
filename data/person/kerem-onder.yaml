summary:
  ar: "واعظ تركي عُرف بدروسه ومحاضراته عالية الوتيرة على يوتيوب في الفقه والحديث والسيرة؛ يروي في سيرته الذاتية على موقعه الرسمي بدءه تعلّم القرآن والفقه في طفولته ومساره الروحي اللاحق وانطلاقه في الوعظ. بلغت قناته على يوتيوب 782,000 مشترك في جدول SPEAKRJ المؤرخ في 8 أكتوبر 2026، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish preacher known for his high-volume YouTube lessons and talks on fiqh, hadith and sira. In the autobiography on his official website he recounts beginning Qur'an and fiqh study in childhood, his later spiritual path, and his taking up preaching. His YouTube channel counted 782,000 subscribers in SPEAKRJ's table entry dated 8 October 2026 — a dated platform count, not a museum-verified fact."
  ur: "ترک واعظ جو فقہ، حدیث اور سیرت پر اپنی کثیر الاشاعت یوٹیوب دروس اور گفتگوؤں کے لیے جانے جاتے ہیں۔ اپنی سرکاری ویب سائٹ پر درج سوانح میں وہ بچپن میں قرآن و فقہ کی تعلیم کے آغاز، اپنے بعد کے روحانی سفر اور وعظ کے آغاز کا ذکر کرتے ہیں۔ SPEAKRJ کے 8 اکتوبر 2026ء کے مؤرخہ جدول کے مطابق ان کے یوٹیوب چینل کے سبسکرائبر 782,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Predicador turco conocido por sus numerosas lecciones y charlas en YouTube sobre fiqh, hadiz y sira. En su autobiografía, disponible en su sitio web oficial, relata sus inicios en el estudio del Corán y el fiqh durante su infancia, su posterior trayectoria espiritual y su decisión de dedicarse a la predicación. Su canal de YouTube contaba con 782 000 suscriptores, según la entrada de la tabla de SPEAKRJ del 8 de octubre de 2026 (dato de la plataforma, no verificado por un museo)."
  fr: "Prédicateur turc connu pour ses nombreuses leçons et conférences sur le fiqh, le hadith et la sira, diffusées sur YouTube. Dans son autobiographie disponible sur son site officiel, il relate ses débuts dans l'étude du Coran et du fiqh dès son enfance, son cheminement spirituel ultérieur et son engagement dans la prédication. Sa chaîne YouTube comptait 782 000 abonnés dans le tableau de SPEAKRJ daté du 8 octobre 2026 – un chiffre ancien, non vérifié par un musée."
  tr: "YouTube'da yüksek frekanslı dersleri ve fıkıh, hadis ve biyografi dersleriyle tanınan Türk vaiz; resmi web sitesindeki biyografisinde, Kur'an ve fıkıh öğrenmeye çocukluğunda, sonraki manevi yolunda ve vaaz vermeye başladığını anlatıyor. YouTube kanalı, 8 Ekim 2026 tarihli SPEAKRJ listesinde 782.000 aboneye ulaştı; bu, müze olarak doğrulanmamış bir tarihçi platform numarasıdır."
  id: "Seorang pengkhotbah Turki yang dikenal dengan pelajaran dan kuliah yang sering diterima di YouTube tentang yurisprudensi, hadis, dan biografi; ia menceritakan dalam biografinya di situs resmi bahwa ia mulai belajar Al-Qur'an dan fiksi sejak kecil, kemudian melalui jalur spiritualnya, dan awal kariernya dalam berkhotbah. Saluran YouTube-nya mencapai 782.000 pelanggan di tangga lagu SPEAKRJ tanggal 8 Oktober 2026, yang merupakan nomor platform sejarawan yang belum diverifikasi sebagai museum."
