summary:
  ar: "واعظ تركي عُرف بدروسه ومحاضراته عالية الوتيرة على يوتيوب في الفقه والحديث والسيرة؛ يروي في سيرته الذاتية على موقعه الرسمي بدءه تعلّم القرآن والفقه في طفولته ومساره الروحي اللاحق وانطلاقه في الوعظ. بلغت قناته على يوتيوب 782,000 مشترك في جدول SPEAKRJ المؤرخ في 8 أكتوبر 2026، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish preacher known for his high-volume YouTube lessons and talks on fiqh, hadith and sira. In the autobiography on his official website he recounts beginning Qur'an and fiqh study in childhood, his later spiritual path, and his taking up preaching. His YouTube channel counted 782,000 subscribers in SPEAKRJ's table entry dated 8 October 2026 — a dated platform count, not a museum-verified fact."
  ur: "ترک واعظ جو فقہ، حدیث اور سیرت پر اپنی کثیر الاشاعت یوٹیوب دروس اور گفتگوؤں کے لیے جانے جاتے ہیں۔ اپنی سرکاری ویب سائٹ پر درج سوانح میں وہ بچپن میں قرآن و فقہ کی تعلیم کے آغاز، اپنے بعد کے روحانی سفر اور وعظ کے آغاز کا ذکر کرتے ہیں۔ SPEAKRJ کے 8 اکتوبر 2026ء کے مؤرخہ جدول کے مطابق ان کے یوٹیوب چینل کے سبسکرائبر 782,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
