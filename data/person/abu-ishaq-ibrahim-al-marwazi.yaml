summary:
  ar: "أبو إسحاق إبراهيم بن أحمد المروزي، صاحب أبي العباس ابن سريج. انتهت إليه الرياسة في العلم ببغداد، وشرح «المختصر» {cite:tabaqat-fuqaha-abbas-1981 p. 59}، وصنّف الأصول، وأخذ عنه الأئمة، وانتشر الفقه عن أصحابه في البلاد، وخرج إلى مصر ومات بها سنة أربعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
  en: "Abu Ishaq Ibrahim ibn Ahmad al-Marwazi, companion of Abu l-Abbas Ibn Surayj. Leadership in learning at Baghdad came to him; he commented on the Mukhtasar {cite:tabaqat-fuqaha-abbas-1981 p. 59}, wrote on usul, and the imams took from him, while fiqh spread from his companions through the lands; he went to Egypt and died there in the year 340 {cite:tabaqat-fuqaha-abbas-1981 p. 59}."
