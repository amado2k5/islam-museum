id: person/tubba-afriqis
class: person
label: { ar: "أفريقيس بن قيس الحميري" }
summary:
  ar: "تبّع من التبابعة؛ غزا إفريقية فافتتحها فسميت به، وسمع كلام العماليق فقال «ما أكثر بربرتهم» فسُموا البرابرة به، وأقام معهم بنو صنهاجة وكتامة من حمير {cite:ansab-al-ashraf p. 7-8}."
  en: "The Tubba' Afriqis ibn Qays ibn Sayfi al-Himyari, who raided Ifriqiya and named it; hearing the Amaliq's tongue he said 'How much barbara they talk' — whence the Berbers got their name, while Sanhaja and Kutama of Himyar settled among them {cite:ansab-al-ashraf p. 7-8}."
  es: "Tubba' Afriqis ibn Qays ibn Sayfi al-Himyari, quien saqueó Ifriqiya y le dio nombre; al oír la lengua del Amaliq dijo: \"¡Cuánta barbarie hablan!\", de donde los bereberes obtuvieron su nombre, mientras que Sanhaja y Kutama de Himyar se establecieron entre ellos {cite:ansab-al-ashraf p. 7-8}."
  fr: "Tubba' Afriqis ibn Qays ibn Sayfi al-Himyari, qui a pillé Ifriqiya et l'a nommée; entendant la langue des Amaliq, il a dit 'Que de barbara ils parlent' — d'où les Berbères ont tiré leur nom, tandis que Sanhaja et Kutama de Himyar se sont installés parmi eux {cite:ansab-al-ashraf p. 7-8}."
  ur: "تبع افریقیس ابن قیس ابن سیفی الحمیری جس نے عفریقیہ پر چھاپہ مارا اور اس کا نام رکھا۔ عمالیق کی زبان سن کر اس نے کہا کہ 'وہ کتنی باربرا بولتے ہیں' - جہاں سے بربروں نے ان کا نام لیا، جب کہ ہمیار کے سنہاجا اور کوتما ان کے درمیان آباد ہوئے (حوالہ دیں: انساب الاشرف ص۔ 7-8}۔"
  tr: "Tababa'a'yı takip etti; İfrikiya'yı fethetti ve onun adını taşıyan şehri fethetti. Amaleklilerin 'Kaç tanesi Berberi' dediğini duydu, bu yüzden Berberilere onun adını verdiler. Onlarla birlikte Himyar'ın Banu Sanhaja ve Katama'sını yerleştirdi {atıf:ansab-al-ashraf s. 7-8}."
  id: "Ia mengikuti Tababa'a; ia menaklukkan Ifriqiya dan menaklukkannya, yang dinamai menurut namanya. Ia mendengar kata-kata orang Amalek, berkata, 'Berapa banyak dari mereka adalah Berber,' sehingga mereka menamai orang Berber dengan namanya. Ia menempati bersama mereka Banu Sanhaja dan Katama dari Himyar {cite:ansab-al-ashraf hlm. 7-8}."
