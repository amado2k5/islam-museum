  en: "The Tubba' Afriqis ibn Qays ibn Sayfi al-Himyari, who raided Ifriqiya and named it; hearing the Amaliq's tongue he said 'How much barbara they talk' — whence the Berbers got their name, while Sanhaja and Kutama of Himyar settled among them {cite:ansab-al-ashraf p. 7-8}."
