summary:
  ar: "عبد الواحد بن الحسين بن محمد، أبو القاسم الصيمري الشافعي، فقيه أصولي قاض، توفي سنة 386 هـ بحسب ما ذكره الكتاب. سكن البصرة، وحضر مجلس القاضي أبي حامد المروروذي، وتفقه بأبي الفياض البصري، وتفقه عليه القاضي الماوردي. من تصانيفه «الإيضاح» في فروع الفقه الشافعي، و«أدب المفتي والمستفتي»، و«الإرشاد في شرح الهداية»، و«القياس والعلل». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  en: "Abd al-Wahid ibn al-Husayn ibn Muhammad, Abu al-Qasim al-Saymari, a Shafi'i jurist, theorist and judge, who died in 386 AH as the book gives. He lived in Basra, attended the court of al-Qadi Abu Hamid al-Marwarudhi, studied under Abu al-Fayyad al-Basri, and al-Mawardi studied under him. His works include al-Idah on Shafi'i law, Adab al-mufti wa-al-mustafti, al-Irshad fi sharh al-hidaya, and al-Qiyas wa-al-'ilal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  fr: "Abd al-Wahid ibn al-Husayn ibn Muhammad, Abu al-Qasim al-Saymari, juriste, théoricien du droit et cadi shafi'ite, mort en 386 H selon le livre. Il vécut à Bassora, fréquenta le cercle du cadi Abu Hamid al-Marwarudhi, étudia auprès d'Abu al-Fayyad al-Basri, et al-Mawardi étudia auprès de lui. Ses œuvres comprennent al-Idah sur le droit shafi'ite, Adab al-mufti wa-al-mustafti, al-Irshad fi sharh al-hidaya et al-Qiyas wa-al-'ilal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  es: "Abd al-Wahid ibn al-Husayn ibn Muhammad, Abu al-Qasim al-Saymari, jurista, teórico y juez shafií, que murió en el año 386 d.H., como indica el libro. Vivió en Basora, asistió a la corte de al-Qadi Abu Hamid al-Marwarudhi, estudió con Abu al-Fayyad al-Basri y al-Mawardi estudió con él. Sus obras incluyen al-Idah sobre la ley Shafi'i, Adab al-mufti wa-al-mustafti, al-Irshad fi sharh al-hidaya y al-Qiyas wa-al-'ilal. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  ur: "عبد الواحد بن الحسین ابن محمد، ابو القاسم السمری، ایک شافعی فقیہ، نظریہ دان اور جج، جن کا انتقال 386 ہجری میں ہوا جیسا کہ کتاب بتاتی ہے۔ وہ بصرہ میں رہتے تھے، القادی ابو حامد المرودی کے دربار میں حاضر ہوئے، ابو الفیاد البصری سے تعلیم حاصل کی، اور الماوردی نے ان سے تعلیم حاصل کی۔ ان کی تصانیف میں شافعی قانون پر الاداح، ادب المفتی و المصطفی، الارشاد فی شرح الہدایہ، اور القیاس و العلال شامل ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 15411}"
  tr: "Kitaba göre, hukukçu, hukuk kuramcısı ve kadı Abdülvahid ibn el-Hüseyn ibn Muhammed, Ebu el-Kâsim el-Semari el-Şafiî, Hicri 386 yılında vefat etmiştir. Basra'da ikamet etmiş, Kadı Ebu Hamid el-Mervezi'nin derslerine katılmış ve Ebu el-Feyyad el-Basri'den fıkıh eğitimi almıştır. Kadı el-Mevdi de ondan fıkıh eğitimi almıştır. Eserleri arasında Şafiî fıkıhının dalları üzerine \"El-İdeh\", \"Müftü ve Fetva Arayanın Adabı\", \"Hidaye'nin Açıklanmasında Rehberlik\" ve \"Kıyas ve İlal\" bulunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15411}"
  id: "Abd al-Wahid ibn al-Husayn ibn Muhammad, Abu al-Qasim al-Saymari al-Shafi'i, seorang ahli hukum, pakar teori hukum, dan hakim, meninggal pada tahun 386 H, menurut buku tersebut. Beliau tinggal di Basra, mengikuti sidang Hakim Abu Hamid al-Marwazi, dan mempelajari ilmu hukum di bawah bimbingan Abu al-Fayyad al-Basri. Hakim al-Mawardi juga mempelajari ilmu hukum di bawah bimbingannya. Di antara karya-karyanya adalah \"Al-Idah\" tentang cabang-cabang yurisprudensi Syafi'i, \"Adab al-Mufti wa al-Mustafti\" (Tata Krama Mufti dan Pencari Fatwa), \"Al-Irshad fi Sharh al-Hidayah\" (Petunjuk dalam Menjelaskan al-Hidayah), dan \"Al-Qiyas wa al-'Ilal\" (Analogi dan Penalaran). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.15411}"
