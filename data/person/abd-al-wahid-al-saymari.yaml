summary:
  ar: "عبد الواحد بن الحسين بن محمد، أبو القاسم الصيمري الشافعي، فقيه أصولي قاض، توفي سنة 386 هـ بحسب ما ذكره الكتاب. سكن البصرة، وحضر مجلس القاضي أبي حامد المروروذي، وتفقه بأبي الفياض البصري، وتفقه عليه القاضي الماوردي. من تصانيفه «الإيضاح» في فروع الفقه الشافعي، و«أدب المفتي والمستفتي»، و«الإرشاد في شرح الهداية»، و«القياس والعلل». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
  en: "Abd al-Wahid ibn al-Husayn ibn Muhammad, Abu al-Qasim al-Saymari, a Shafi'i jurist, theorist and judge, who died in 386 AH as the book gives. He lived in Basra, attended the court of al-Qadi Abu Hamid al-Marwarudhi, studied under Abu al-Fayyad al-Basri, and al-Mawardi studied under him. His works include al-Idah on Shafi'i law, Adab al-mufti wa-al-mustafti, al-Irshad fi sharh al-hidaya, and al-Qiyas wa-al-'ilal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15411}"
