summary:
  ar: "أبو سعيد عبد الرحمن بن مهدي بن حسان العنبري، آخر من ذكره الشيرازي في فقهاء البصرة في هذا الموضع {cite:tabaqat-fuqaha-abbas-1981 p. 49}، ومات سنة ثمان وتسعين ومائة {cite:tabaqat-fuqaha-abbas-1981 p. 49}. وتذكر حاشية المحقق أن ابن سعد والقتيبي لم يرفعا نسبه، وأن ابن حجر يثبته «عبد الرحمن بن مهدي بن حسان بن عبد الرحمن العنبري»."
  en: "Abu Sa'id Abd al-Rahman ibn Mahdi ibn Hassan al-Anbari, the last whom al-Shirazi names among the jurists of Basra at this point {cite:tabaqat-fuqaha-abbas-1981 p. 49}. He died in 198 AH {cite:tabaqat-fuqaha-abbas-1981 p. 49}. The editor's footnote says that Ibn Sa'd and al-Qutayba did not trace his lineage this far, and that Ibn Hajar confirms it as 'Abd al-Rahman ibn Mahdi ibn Hassan ibn Abd al-Rahman al-Anbari'."
