summary:
  ar: "أبو سعيد عبد الرحمن بن مهدي بن حسان العنبري، آخر من ذكره الشيرازي في فقهاء البصرة في هذا الموضع {cite:tabaqat-fuqaha-abbas-1981 p. 49}، ومات سنة ثمان وتسعين ومائة {cite:tabaqat-fuqaha-abbas-1981 p. 49}. وتذكر حاشية المحقق أن ابن سعد والقتيبي لم يرفعا نسبه، وأن ابن حجر يثبته «عبد الرحمن بن مهدي بن حسان بن عبد الرحمن العنبري»."
  en: "Abu Sa'id Abd al-Rahman ibn Mahdi ibn Hassan al-Anbari, the last whom al-Shirazi names among the jurists of Basra at this point {cite:tabaqat-fuqaha-abbas-1981 p. 49}. He died in 198 AH {cite:tabaqat-fuqaha-abbas-1981 p. 49}. The editor's footnote says that Ibn Sa'd and al-Qutayba did not trace his lineage this far, and that Ibn Hajar confirms it as 'Abd al-Rahman ibn Mahdi ibn Hassan ibn Abd al-Rahman al-Anbari'."
  fr: "Abu Sa'id Abd al-Rahman ibn Mahdi ibn Hassan al-Anbari, le dernier qu'al-Shirazi nomme à cet endroit parmi les juristes de Bassora {cite:tabaqat-fuqaha-abbas-1981 p. 49}. Il mourut en 198 H {cite:tabaqat-fuqaha-abbas-1981 p. 49}. La note de l'éditeur dit qu'Ibn Sa'd et al-Qutayba ne remontèrent pas sa généalogie aussi loin, et qu'Ibn Hajar la confirme comme « Abd al-Rahman ibn Mahdi ibn Hassan ibn Abd al-Rahman al-Anbari »."
  es: "Abu Sa'id Abd al-Rahman ibn Mahdi ibn Hassan al-Anbari, el último a quien al-Shirazi nombra entre los juristas de Basora en este momento {cita:tabaqat-fuqaha-abbas-1981 p. 49}. Murió en 198 AH {cita:tabaqat-fuqaha-abbas-1981 p. 49}. La nota a pie de página del editor dice que Ibn Sa'd y al-Qutayba no rastrearon su linaje hasta aquí, y que Ibn Hajar lo confirma como 'Abd al-Rahman ibn Mahdi ibn Hassan ibn Abd al-Rahman al-Anbari'."
  ur: "ابو سعید عبدالرحمٰن بن مہدی بن حسن الانباری، جن میں سے آخری الشرازی نے اس مقام پر بصرہ کے فقہاء میں سے ایک کا نام لیا ہے۔ 49}۔ آپ کی وفات 198 ہجری میں ہوئی۔ 49}۔ ایڈیٹر کا حاشیہ کہتا ہے کہ ابن سعد اور القطیبہ نے اب تک ان کے نسب کا سراغ نہیں لگایا اور ابن حجر اس کی تصدیق 'عبدالرحمٰن بن مہدی بن حسن بن عبدالرحمٰن الانباری' سے کرتے ہیں۔"
  tr: "El-Şirazi'nin bu bölümde bahsettiği Basra'nın son hukukçularından Ebu Sa'id Abdülrahman ibn Mehdi ibn Hasan el-Enberi, Hicri 198 yılında vefat etmiştir. Editörün dipnotunda İbn Sa'd ve el-Kuteybi'nin onun soyunu takip etmediği belirtilirken, İbn Hacer bunu \"Abdülrahman ibn Mehdi ibn Hasan ibn Abdülrahman el-Enberi\" olarak doğrulamaktadır."
  id: "Abu Sa'id Abd al-Rahman ibn Mahdi ibn Hassan al-Anbari, ahli hukum terakhir dari Basra yang disebutkan oleh al-Shirazi dalam bagian ini {cite:tabaqat-fuqaha-abbas-1981 hlm. 49}, wafat pada tahun 198 H {cite:tabaqat-fuqaha-abbas-1981 hlm. 49}. Catatan kaki editor menyebutkan bahwa Ibn Sa'd dan al-Qutaybi tidak menelusuri garis keturunannya, sementara Ibn Hajar menegaskannya sebagai \"Abd al-Rahman ibn Mahdi ibn Hassan ibn Abd al-Rahman al-Anbari\"."
