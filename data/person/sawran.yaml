  en: "In al-Baladhuri: succeeded al-Mufarraj ibn Sallam in the Great Land and sent his envoy to al-Mutawakkil asking patent and letter of appointment; al-Mutawakkil died before the envoy reached him — one copy reads 'Sudan' — and the contract stayed until Wasif the caliph's mawla contracted and dispatched it in al-Musta'in's time."
