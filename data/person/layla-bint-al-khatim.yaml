summary:
  ar: من بني ظفر من الأوس، استدركها أبو علي الجياني على الاستيعاب؛ تذكر الروايات أنها عرضت نفسها على النبي فقبلها ثم استقالته فأقالها، ويعدّها ابن سعد أول امرأة بايعت النبي من الأنصار، وكان يقال لها «أكلة الأسد».
  en: From Banu Zafar of the Aws, added by Abu Ali al-Jayyani as a supplement to al-Isti'ab; reports say she offered herself to the Prophet who accepted and then she asked to be released and he released her; Ibn Sa'd counts her among the first
    women of the Ansar to pledge to the Prophet, and she was called 'the lion's meal'.
