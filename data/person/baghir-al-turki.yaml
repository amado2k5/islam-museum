id: person/baghir-al-turki
class: person
label: { ar: "باغر التركي" }
summary:
  ar: "من الأتراك الذين فتكوا بالمتوكل، قتله وصيف وبغا في سنة إحدى وخمسين فتنكر الأتراك للمستعين وخاف فانحدر من سامراء إلى بغداد {cite:tarikh-khulafa-minhaj-1434 p. 555}. وعند المسعودي اصطنعه بغا الصغير وامتحنه على قتل ابنه فارس فأبى العلامة ثم أخيه وصيف ثم المنتصر فقال يقتل الابن والأب باق نبدأ بالأب أولاً فدخل على المتوكل ومعه عشرة متلثمين فضربه بالسيف الذي كان دفعه إليه على جانبه الأيمن فقده إلى خاصرته ثم الأيسر {cite:muruj-al-dhahab p. 503-506}"
  en: "One of the Turks who did for al-Mutawakkil; Wasif and Bugha killed him in 251, whereupon the Turks turned on al-Musta'in and he fled from Samarra down to Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 555}."
  es: "Uno de los turcos que mató a al-Mutawakkil; Wasif y Bugha lo mataron en 251, tras lo cual los turcos se volvieron contra al-Musta'in y este huyó de Samarra a Bagdad {cite:tarikh-khulafa-minhaj-1434 p. 555}."
  fr: "L'un des Turcs qui a fait pour al-Mutawakkil; Wasif et Bugha l'ont tué en 251, après quoi les Turcs se sont retournés contre al-Musta'in et il s'est enfui de Samarra jusqu'à Bagdad {cite:tarikh-khulafa-minhaj-1434 p. 555}."
  ur: "ایک ترک جس نے متوکل کے لیے کام کیا۔ واصف اور بوغہ نے اسے 251 میں قتل کر دیا، جس کے بعد ترکوں نے المستعین کو شروع کر دیا اور وہ سامرا سے بغداد کی طرف فرار ہو گیا۔ 555}۔"
  tr: "El-Mutawakkil'i öldüren Türkler arasında, 51 yılında Waseef ve Bagha tarafından öldürüldü, bu yüzden Türkler yardımı reddetti ve korktu, bu yüzden Samarra'dan Bağdat'a indi {cite:History-Khulafa-minhaj-1434, s. 555}. al-Mas'udi'ye göre, Genç Bagha onu uydurdu ve oğlu Faris'i öldürdüğü için test etti, ancak âlim, sonra kardeşi Saif, sonra al-Muntasir, 'Oğul ve baba öldürülsün. Önce babadan başlayalım.' dedi. Sonra on maskeli adamla al-Mutawakkil'e girdi ve ona fırlattığı kılıcıyla sağ tarafına vurdu, bu da onun yanına ve soluna ulaşmasına neden oldu {cite:Muruj-al-dhahab, s. 503-506}"
  id: "Di antara orang Turki yang membunuh al-Mutawakkil, ia dibunuh oleh Waseef dan Bagha pada tahun 51, sehingga orang Turki menolak bantuan dan menjadi takut, sehingga ia turun dari Samarra ke Baghdad {cite:History-Khulafa-minhaj-1434, hlm. 555}. Menurut al-Mas'udi, Bagha yang Muda memalsukannya dan mengujinya karena membunuh putranya Faris, tetapi sang cendekiawan, lalu saudaranya Saif, lalu al-Muntasir, menolak dengan berkata, 'Biarlah anak dan ayah dibunuh. Mari kita mulai dengan ayahnya terlebih dahulu.' Kemudian ia masuk ke al-Mutawakkil dengan sepuluh orang bertopeng dan memukulnya dengan pedang yang dilemparkan ke arahnya di sisi kanan, menyebabkan ia mencapai sisi tubuhnya, lalu ke kiri {cite:Muruj-al-dhahab, hlm. 503-506}"
