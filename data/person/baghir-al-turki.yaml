label: { ar: "باغر التركي" }
summary:
  ar: "من الأتراك الذين فتكوا بالمتوكل، قتله وصيف وبغا في سنة إحدى وخمسين فتنكر الأتراك للمستعين وخاف فانحدر من سامراء إلى بغداد {cite:tarikh-khulafa-minhaj-1434 p. 555}.، وعند المسعودي اصطنعه بغا الصغير وامتحنه على قتل ابنه فارس فأبى العلامة ثم أخيه وصيف ثم المنتصر فقال يقتل الابن والأب باق نبدأ بالأب أولاً فدخل على المتوكل ومعه عشرة متلثمين فضربه بالسيف الذي كان دفعه إليه على جانبه الأيمن فقده إلى خاصرته ثم الأيسر {cite:muruj-al-dhahab p. 503-506}"
  en: "One of the Turks who did for al-Mutawakkil; Wasif and Bugha killed him in 251, whereupon the Turks turned on al-Musta'in and he fled from Samarra down to Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 555}."
