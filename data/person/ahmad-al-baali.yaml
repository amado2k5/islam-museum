roles: [scholar]
gender: male
summary:
  ar: "أحمد بن عبد الله بن أحمد الحلبي البعلي، رياضي عالم بالفرائض حنبلي، أصله من حلب ومولده ودراسته بدمشق، اشتهر في بعلبك، ولي إفتاء الحنابلة بدمشق سنة 1182 هـ، وحج ودرس بالمدينة، وتوفي بدمشق. يذكر الزركلي 1108-1189 هـ."
  en: "Ahmad ibn Abdallah ibn Ahmad al-Halabi al-Ba'li, a Hanbali mathematician and scholar of inheritance whose family came from Aleppo; born, raised and educated in Damascus, known in Baalbek, Hanbali mufti of Damascus from 1182 AH, taught in Medina after the pilgrimage and died in Damascus. Al-Zirikli prints 1108-1189 AH (1697-1775)."
  fr: "Ahmad ibn Abdallah ibn Ahmad al-Halabi al-Ba'li, mathématicien hanbalite et spécialiste des successions, de famille originaire d'Alep ; né, élevé et formé à Damas, connu à Baalbek, mufti hanbalite de Damas dès 1182 H. Il enseigna à Médine après le pèlerinage et mourut à Damas. Al-Zirikli donne 1108–1189 H (1697–1775 ap. J.-C.)."
  es: "Ahmad ibn Abdallah ibn Ahmad al-Halabi al-Ba'li, matemático y erudito hanbalí de herencia, cuya familia procedía de Alepo; nació, se crió y se educó en Damasco, conocido en Baalbek, fue muftí hanbalí de Damasco desde 1182 AH, enseñó en Medina tras la peregrinación y falleció en Damasco. Al-Zirikli publicó sus obras entre 1108 y 1189 AH (1697-1775)."
  ur: "احمد بن عبداللہ ابن احمد الحلبی البالی، ایک حنبلی ریاضی دان اور وراثت کے عالم جن کا خاندان حلب سے آیا تھا۔ دمشق میں پیدا ہوئے، پرورش پائی اور تعلیم حاصل کی، بعلبیک میں مشہور، دمشق کے حنبلی مفتی 1182 ہجری سے، حج کے بعد مدینہ میں پڑھایا اور دمشق میں وفات پائی۔ الزرکلی 1108-1189 ہجری (1697-1775) پرنٹ کرتا ہے۔"
  tr: "Hanbeli mezhebinden matematikçi ve miras hukuku alimi Ahmed ibn Abdullah ibn Ahmed el-Halabi el-Ba'li, aslen Halep'li olup Şam'da doğmuş ve eğitim görmüştür. Baalbek'te ün kazanmış ve 1182 Hicri yılında Şam'daki Hanbelilerin müftüsü olarak atanmıştır. Hac ibadetini yerine getirmiş, Medine'de ders vermiş ve Şam'da vefat etmiştir. El-Zarkali, onu 1108 ile 1189 Hicri yılları arasında anmaktadır."
  id: "Ahmad ibn Abdullah ibn Ahmad al-Halabi al-Ba’li, seorang ahli matematika dan pakar hukum warisan dari mazhab Hanbali, berasal dari Aleppo tetapi lahir dan dididik di Damaskus. Ia menjadi terkenal di Baalbek dan diangkat menjadi Mufti mazhab Hanbali di Damaskus pada tahun 1182 H. Ia menunaikan ibadah haji dan mengajar di Madinah, dan meninggal di Damaskus. Al-Zarkali menyebutkannya antara tahun 1108 dan 1189 H."
