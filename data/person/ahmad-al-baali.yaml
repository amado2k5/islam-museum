summary:
  ar: "أحمد بن عبد الله بن أحمد الحلبي البعلي، رياضي عالم بالفرائض حنبلي، أصله من حلب ومولده ودراسته بدمشق، اشتهر في بعلبك، ولي إفتاء الحنابلة بدمشق سنة 1182 هـ، وحج ودرس بالمدينة، وتوفي بدمشق. يذكر الزركلي 1108-1189 هـ."
  en: "Ahmad ibn Abdallah ibn Ahmad al-Halabi al-Ba'li, a Hanbali mathematician and scholar of inheritance whose family came from Aleppo; born, raised and educated in Damascus, known in Baalbek, Hanbali mufti of Damascus from 1182 AH, taught in Medina after the pilgrimage and died in Damascus. Al-Zirikli prints 1108-1189 AH (1697-1775)."
