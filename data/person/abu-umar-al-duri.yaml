summary:
  ar: "أبو عمر حفص بن عمر الدوري البغدادي الضرير، راوي قراءة أبي عمرو بن العلاء عن اليزيدي وراوي قراءة الكسائي كذلك؛ توفي في شوال سنة 246هـ، وكان إمام القراءة في عصره وشيخ الإقراء في وقته، وهو أول من جمع القراءات {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  en: "Abu 'Umar Hafs ibn 'Umar al-Duri of Baghdad, who was blind, transmitted the reading of Abu 'Amr ibn al-'Ala' through al-Yazidi and also the reading of al-Kisa'i; he died in Shawwal 246 AH, was the leading reader of his age and the first, in Ibn al-Jazari's words, to gather the readings into one work {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  ur: "ابو عمر حفص بن عمر دوری بغدادی، نابینا، یزیدی کے واسطے سے ابو عمرو بن العلاء کی قراءت کے راوی اور کسائی کی قراءت کے بھی راوی؛ شوال 246ھ میں فوت ہوئے؛ اپنے عہد کے امامِ قراءت اور سب سے پہلے قراءات کو جمع کرنے والے، جیسا کہ ابن الجزری لکھتے ہیں {cite:nashr-dahman-damascus-1345-v1 p. 144}."
