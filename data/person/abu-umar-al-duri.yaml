summary:
  ar: "أبو عمر حفص بن عمر الدوري البغدادي الضرير، راوي قراءة أبي عمرو بن العلاء عن اليزيدي وراوي قراءة الكسائي كذلك؛ توفي في شوال سنة 246هـ، وكان إمام القراءة في عصره وشيخ الإقراء في وقته، وهو أول من جمع القراءات {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  en: "Abu 'Umar Hafs ibn 'Umar al-Duri of Baghdad, who was blind, transmitted the reading of Abu 'Amr ibn al-'Ala' through al-Yazidi and also the reading of al-Kisa'i; he died in Shawwal 246 AH, was the leading reader of his age and the first, in Ibn al-Jazari's words, to gather the readings into one work {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  fr: "Abu 'Umar Hafs ibn 'Umar al-Duri de Bagdad, aveugle, transmit la lecture d'Abu 'Amr ibn al-'Ala' par al-Yazidi ainsi que celle d'al-Kisa'i ; mort en chawwal 246 H, il était le premier lecteur de son temps et le premier, selon Ibn al-Jazari, à réunir les lectures en un ouvrage {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  ur: "ابو عمر حفص بن عمر دوری بغدادی، نابینا، یزیدی کے واسطے سے ابو عمرو بن العلاء کی قراءت کے راوی اور کسائی کی قراءت کے بھی راوی؛ شوال 246ھ میں فوت ہوئے؛ اپنے عہد کے امامِ قراءت اور سب سے پہلے قراءات کو جمع کرنے والے، جیسا کہ ابن الجزری لکھتے ہیں {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  es: "Abu 'Umar Hafs ibn 'Umar al-Duri de Bagdad, que era ciego, transmitió la lectura de Abu 'Amr ibn al-'Ala' a través de al-Yazidi y también la lectura de al-Kisa'i; murió en Shawwal 246 AH, fue el lector más destacado de su época y el primero, en palabras de Ibn al-Jazari, en reunir las lecturas en una sola obra {cite:nashr-dahman-damascus-1345-v1 p. 144}."
  tr: "Ebu Ömer Hafs bin Ömer el-Duri el-Bağdadi el-Darir, Ebu Amr bin el-Ala’nın rivayetini El-Yazidi'den ve ayrıca El-Kisa’i’nin rivayetini de aktaran kişidir; Hicri 246 yılında Şevval ayında vefat etmiştir. Kendi zamanında Kur’an-ı Kerim'in imamı ve şeyhiydi ve rivayetleri ilk derleyen kişidir. {Kaynak: Nashr-dahman-damascus-1345-v1 s. 144}"
  id: "Abu Omar Hafs bin Omar Al-Duri Al-Baghdadi Al-Darir, perawi bacaan Abu Amr bin Al-Ala’ atas otoritas Al-Yazidi dan juga perawi bacaan Al-Kisa’i; beliau wafat pada bulan Syawal tahun 246 H, dan beliau adalah imam bacaan pada zamannya dan syekh pembacaan pada zamannya, dan beliau adalah orang pertama yang mengumpulkan bacaan-bacaan tersebut {cite:nashr-dahman-damascus-1345-v1 p. 144}."
