summary:
  ar: "زعيم ديني أفغاني من قسم أندر من قبيلة غلزاي (1790–نحو 1885)، واسمه الأصلي دين محمد ولقّبه معلّمه ملا عبد الحكيم بـ«مشك العالم». كان الزعيم الروحي لثورة 1879–1880 ضد البريطانيين في الحرب الإنجليزية الأفغانية الثانية وأبرز قادة «الحزب الوطني» الذين حاصروا معسكر شيرپور، فاعتُقل في عهد الأمير عبد الرحمن بتهمة التآمر لإعادة أيوب خان وقُتل في حبسه، فخلفه ابنه عبد الكريم بيرا وأصدر فتوى ضد الأمير سنة 1885."
  en: "Afghan religious leader of the Andar section of the Ghilzai tribe (1790–c. 1885), born Din Mohammad and given the laqab Mushk-i-'Alam ('perfume of the universe') by his teacher Mulla 'Abd al-Hakim. He was the spiritual leader of the 1879–80 rising against the British in the Second Anglo-Afghan War and the most influential of the 'National Party' leaders who besieged the Sherpur cantonment. Arrested under Amir 'Abd al-Rahman on a charge of plotting Ayub Khan's restoration, he was killed in custody; his son 'Abd al-Karim succeeded him as pir and issued a fatwa against the Amir in 1885."
  ur: "غلزئی قبیلے کے اندر طبقے کے افغان دینی رہنما (1790ء–تقریباً 1885ء)، اصل نام دین محمد، جنہیں ان کے استاد ملا عبدالحکیم نے «مشکِ عالم» کا لقب دیا۔ وہ دوسری اینگلو افغان جنگ میں 1879–80ء کی بغاوت کے روحانی رہنما اور شیرپور چھاؤنی کا محاصرہ کرنے والے «قومی جماعت» کے سب سے بااثر قائد تھے۔ امیر عبدالرحمٰن کے دور میں ایوب خان کی بحالی کی سازش کے الزام میں گرفتار ہو کر قید میں قتل ہوئے؛ ان کے بیٹے عبدالکریم ان کے جانشین پیر بنے۔"
