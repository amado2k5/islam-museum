id: person/ibn-al-mutazz
class: person
label: { ar: "عبد الله بن المعتز" }
summary:
  ar: "بويع له بالخلافة في سنة ست وتسعين ومائتين بعد خلع المقتدر، وكان لقبه المنتصف بالله، وهو لقب اختاره لنفسه {cite:tabari-tarikh-abu-al-fadl j.11 p.31}، وعند السيوطي أجاب الخلعاء بشرط ألا يكون فيها دم فجاء وحضر القواد والقضاة والأعيان فبايعوه بالخلافة ولقبوه الغالب بالله واستوزر محمد بن داوود بن الجراح واستقضى أبا المثنى أحمد بن يعقوب ثم ألقى الله في قلوبهم الرعب فانصرفوا منهزمين بلا قتال وهرب وحبس ثم أخرج ميتاً {cite:tarikh-khulafa-minhaj-1434 p. 585-586}. وقال المسعودي أجاد في وصف أصحاب الشراب على المعاقرة بقوله بين أقداحهم حديث قصير هو سحر وما عداه كلام {cite:muruj-al-dhahab p. 256}، وعند المسعودي كان أديباً بليغاً شاعراً مطبوعاً قريب المأخذ سهل اللفظ حسن الاختراع للمعاني، ومن شعره عجبا للزمان في حالتيه وبلاء دفعت منه إليه رب يوم بكيت فيه فلما صرت في غيره بكيت عليه، وقوله في أبي الحسن علي بن محمد بن الفرات الوزير أبا حسن ثبت في الأرض وطأتي وأدركتني في المعضلات الهزاهز والبستني درعاً عليَّ حصينة فناديت صرف الدهر هل من مبارز {cite:muruj-al-dhahab p. 650-651}. وعند ابن الجوزي وُلد في شعبان سنة سبع وأربعين ومائتين وكان غزير الأدب بارعًا في الفضل مليح الشعر سمع المبرد وثعلبًا وله كلام في الحكمة عجيب منه: أعناس الحي خطاه إلى أجله، ومن تجاوز الكفاف لم يغنه الإكثار، وأشقى الناس أقربهم من السلطان كما أن أقرب الأشياء إلى النار أسرعها احتراقًا، والفرصة سريعة الفوت بعيدة العود {cite:muntazam-ibn-al-jawzi p. 204}."
  tr: "El-Muktadir'in tahttan indirilmesinden sonra, 296 Hicri yılında halife olarak bağlılık yemini etti. Orta unvanı Allah'tı; kendisi için seçti {atıf:tabari-tarikh-abu-al-fadl j.11 s.31}. el-Suyuti'ye göre, kan dökülmemesi şartıyla hüla'ya cevap verdi. Geldi, komutanlar, hakimler ve ileri düzey kişiler oradaydı; onlar ona halife olarak bağlılık yemini ettiler ve ona 'El-Ghalib bi-Allah' dediler. Muhammed bin Davud ibn el-Carrah'tan koruma aradı ve Ebu el-Müthanna Ahmed bin Ya'qub'u atadı. Sonra Allah kalplerine korku saldı, bu yüzden savaşmadan yenilgiye uğradılar, hapsedildiler ve ardından ölü olarak çıkarıldılar {atıf:Tarikh-khulafa-minhaj-1434, s. 585-586}. El-Mes'udi, 'ma'akar' içenleri şöyle tanımlamada ustaca olduğunu söyledi: Kadehlerinde kısa bir hadis olan sihirli bir hadis vardır, geri kalan her şey ise sadece sohbettir {alıntı:Muruj-al-Dhahab, s. 256}. El-Mes'udi'ye göre, o etkileyici bir yazar, tanınmış bir şairdi, çabuk kavrayan, kolay ifade edilen ve anlam konusunda ustaydı. Şiirleri, iki haliyle zamanın bir mucizesi ve Tanrı'nın ona ağladığım gün getirdiği bir felaketti; ben başka bir yerdeyken onun için ağladım. Ve Ebu el-Hasan Ali ibn Muhammed ibn el-Furat, bakan Ebu Hasan hakkındaki sözleri, yeryüzünde sağlam bir yere bastırdı ve zor sıkıntılarda beni sarsarak ve bana karşı bir kalkan olarak korudu, bu yüzden zamanın sonuna seslendim: Herhangi bir düello var mı? {alıntı:Muruj-al-Dhahab, s. 650-651}. İbn al-Jawzi'ye göre, 247 Hicri yılında Şaban'da doğmuştur. Terbiyeli, erdemde yetenekli, şiirde güzel, el-Mübarrad tarafından duyulan bir tilkiydi. Olağanüstü bilgeliğe sahipti, bunlar arasında: 'Yaşayan armutlar, ayakları onun yolunda, geçimini aşan bollukla yetinmez. En zavallı insanlar, hükümdara en yakın olanlardır. Ateşe en yakın olanlar en hızlı yanar ve fırsat geçici, uzak {atıf:Muntazam-ibn-al-Jawzi, s. 204}."
  id: "Ia disumpah setia sebagai khalifah pada tahun 296 H setelah penggulingan al-Muqtadir. Gelar tengahnya adalah Allah, gelar yang ia pilih untuk dirinya sendiri {cite:tabari-tarikh-abu-al-fadl j.11 hlm.31}. Menurut al-Suyuti, ia menjawab khul'a dengan syarat tidak ada darah yang terlibat. Ia datang, dan para komandan, hakim, serta pejabat hadir, yang bersumpah setia kepadanya sebagai khalifah, dan memanggilnya 'Al-Ghalib bi-Allah.' Ia memohon perlindungan Muhammad ibn Dawud ibn al-Jarrah, dan mengangkat Abu al-Muthanna Ahmad ibn Ya'qub. Kemudian Tuhan menakutkan hati mereka, sehingga mereka melarikan diri tanpa pertempuran, melarikan diri, dipenjara, dan kemudian diselamatkan mati {cite:Tarikh-khulafa-minhaj-1434, hlm. 585-586}. Al-Mas'udi mengatakan ia unggul dalam menggambarkan mereka yang minum di atas 'ma'aqara' dengan mengatakan: Di antara cangkir mereka ada hadits singkat yang sihir, dan yang lain hanyalah omongan {cite:muruj-al-dhahab, hlm. 256}. Menurut al-Mas'udi, ia adalah penulis yang fasih, penyair terkenal, cepat memahami, mudah mengungkapkan, dan mahir dalam makna. Puisinya adalah keajaiban waktu dalam dua keadaan dan bencana yang dibawa Tuhan padanya pada hari aku menangis, dan ketika aku berada di tempat lain, aku menangis untuknya. Dan perkataannya tentang Abu al-Hasan Ali ibn Muhammad ibn al-Furat, menteri Abu Hasan, meneguhkan pijakanku di bumi dan mengalahkanku dalam kesulitan sulit, mengguncang dan melindungiku sebagai perisai dariku, sehingga aku berseru sampai akhir zaman: Apakah ada duel? {cite:muruj-al-dhahab, hlm. 650-651}. Menurut Ibn al-Jawzi, ia lahir di Sha'ban pada tahun 247 H. Ia sopan, terampil dalam kebajikan, indah dalam puisi, didengar oleh al-Mubarrad, dan seekor rubah. Ia memiliki kebijaksanaan luar biasa, termasuk: 'Buah pir hidup, kakinya berada di jalannya, dan siapa pun yang melebihi penghidupan tidak cukup dengan kelimpahan. Orang-orang yang paling sengsara adalah mereka yang paling dekat dengan penguasa. Yang paling dekat dengan api terbakar paling cepat, dan kesempatan itu singkat, jauh {cite:muntazam-ibn-al-jawzi, hlm. 204}."
