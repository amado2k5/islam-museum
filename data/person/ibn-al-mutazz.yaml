id: person/ibn-al-mutazz
class: person
label: { ar: "عبد الله بن المعتز" }
summary:
  ar: "بويع له بالخلافة في سنة ست وتسعين ومائتين بعد خلع المقتدر، وكان لقبه المنتصف بالله، وهو لقب اختاره لنفسه {cite:tabari-tarikh-abu-al-fadl j.11 p.31}، وعند السيوطي أجاب الخلعاء بشرط ألا يكون فيها دم فجاء وحضر القواد والقضاة والأعيان فبايعوه بالخلافة ولقبوه الغالب بالله واستوزر محمد بن داوود بن الجراح واستقضى أبا المثنى أحمد بن يعقوب ثم ألقى الله في قلوبهم الرعب فانصرفوا منهزمين بلا قتال وهرب وحبس ثم أخرج ميتاً {cite:tarikh-khulafa-minhaj-1434 p. 585-586}. وقال المسعودي أجاد في وصف أصحاب الشراب على المعاقرة بقوله بين أقداحهم حديث قصير هو سحر وما عداه كلام {cite:muruj-al-dhahab p. 256}، وعند المسعودي كان أديباً بليغاً شاعراً مطبوعاً قريب المأخذ سهل اللفظ حسن الاختراع للمعاني، ومن شعره عجبا للزمان في حالتيه وبلاء دفعت منه إليه رب يوم بكيت فيه فلما صرت في غيره بكيت عليه، وقوله في أبي الحسن علي بن محمد بن الفرات الوزير أبا حسن ثبت في الأرض وطأتي وأدركتني في المعضلات الهزاهز والبستني درعاً عليَّ حصينة فناديت صرف الدهر هل من مبارز {cite:muruj-al-dhahab p. 650-651}"
