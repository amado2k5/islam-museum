label: { ar: "عبد الله بن المعتز" }
summary:
  ar: "بويع له بالخلافة في سنة ست وتسعين ومائتين بعد خلع المقتدر، وكان لقبه المنتصف بالله، وهو لقب اختاره لنفسه {cite:tabari-tarikh-abu-al-fadl j.11 p.31}، وعند السيوطي أجاب الخلعاء بشرط ألا يكون فيها دم فجاء وحضر القواد والقضاة والأعيان فبايعوه بالخلافة ولقبوه الغالب بالله واستوزر محمد بن داوود بن الجراح واستقضى أبا المثنى أحمد بن يعقوب ثم ألقى الله في قلوبهم الرعب فانصرفوا منهزمين بلا قتال وهرب وحبس ثم أخرج ميتاً {cite:tarikh-khulafa-minhaj-1434 p. 585-586}."
