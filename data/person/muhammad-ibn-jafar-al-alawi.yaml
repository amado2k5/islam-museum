label: { ar: "محمد بن جعفر بن يحيى", en: "Muhammad ibn Ja'far ibn Yahya", es: "Muhammad ibn Ja'far ibn Yahya", fr: "Muhammad ibn Ja'far ibn Yahya", ur: "محمد بن جعفر بن یحییٰ" }
summary:
  ar: "محمد بن جعفر بن يحيى بن عبد الله بن الحسن، سار إلى مصر فطلب فدخل المغرب واتصل ببلاد تاهرت السفلى فاجتمع إليه خلق وظهر فيهم بعدل وحسن استقامة فمات هناك مسموماً {cite:muruj-al-dhahab p. 330}."
  en: "The Alid fugitive to lower Tahert — 'just and upright' among his followers, dead by poison in the Maghreb {cite:muruj-al-dhahab p. 330}."
  es: "El fugitivo Alid al sur de Tahert — 'justo y recto' entre sus seguidores, muerto envenenado en el Magreb {cite:muruj-al-dhahab p. 330}."
  fr: "Le fugitif alide à Tahert inférieur — « juste et droit » parmi ses partisans, mort par empoisonnement au Maghreb {cite:muruj-al-dhahab p. 330}."
  ur: "الد تہرٹ کو نیچا کرنے کے لیے فراری - اپنے پیروکاروں کے درمیان 'صرف اور سیدھا'، مغرب میں زہر سے مر گیا {حوالہ: مروج الذہب صفحہ 330}۔"
  tr: "Muhammed ibn Ca'fer ibn Yahya ibn Abdullah ibn al-Hasan, Mısır'a gidip oraya girdi, Mağrip'e girdi ve Aşağı Tahir topraklarıyla bağlantı kurdu. Birçok kişi ona toplandı, o da aralarında adalet ve dürüstlükle göründü ve orada zehirlenerek öldü {atıf:muruj-al-dhahab, s. 330}."
  id: "Muhammad ibn Ja'far ibn Yahya ibn Abdullah ibn al-Hasan, yang pergi ke Mesir, mencarinya, memasuki Maghreb, dan terhubung dengan tanah Tahert Bawah. Banyak orang berkumpul kepadanya, dan ia muncul di antara mereka dengan keadilan dan integritas yang baik, dan ia meninggal di sana dengan racun {cite:muruj-al-dhahab, hlm. 330}."
