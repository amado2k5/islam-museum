summary:
  ar: "من قتلى أهل الجمل وصفه علي بيعسوب قريش، وقال واقفاً عليه لهفي عليك يعسوب قريش قتلت الغطاريف من بني عبد مناف، فقال له الأشتر ما أشد جزعك عليهم فقال إنه قامت عني وعنهم نسوة لم يقمن عنك، وأصيبت كفه بمنى وقيل باليمامة ألقتها عقاب وفيها خاتم نقشه اسمه بعد الجمل بثلاثة أيام {cite:muruj-al-dhahab p. 663-664}."
  en: "The 'queen-bee of Quraysh' killed at the Camel — Ali's mourning over him drew al-Ashtar's rebuke and the famous answer 'women rose between me and them who never rose between me and you'; his severed hand was found days later at Mina, seal-ring intact, dropped by an eagle {cite:muruj-al-dhahab p. 663-664}."
  fr: "La « reine des abeilles de Quraysh », tué à la bataille du Chameau — le deuil d'Ali sur lui lui valut le reproche d'al-Ashtar et la célèbre réponse « des femmes se sont dressées entre eux et moi, qui ne se sont jamais dressées entre vous et moi » ; sa main tranchée fut retrouvée quelques jours plus tard à Mina, la bague-sceau intacte, lâchée par un aigle {cite:muruj-al-dhahab p. 663-664}."
  es: "La 'abeja reina de Quraysh', asesinada en Camello, provocó el luto de Ali por él, quien recibió la reprimenda de al-Ashtar y la famosa respuesta: 'Las mujeres se interpusieron entre mí y aquellos que nunca se interpusieron entre mí y tú'. Su mano cercenada fue encontrada días después en Mina, con el anillo intacto, caída por un águila {cite:muruj-al-dhahab p. 663-664}."
