summary:
  ar: "من قتلى أهل الجمل وصفه علي بيعسوب قريش، وقال واقفاً عليه لهفي عليك يعسوب قريش قتلت الغطاريف من بني عبد مناف، فقال له الأشتر ما أشد جزعك عليهم فقال إنه قامت عني وعنهم نسوة لم يقمن عنك، وأصيبت كفه بمنى وقيل باليمامة ألقتها عقاب وفيها خاتم نقشه اسمه بعد الجمل بثلاثة أيام {cite:muruj-al-dhahab p. 663-664}."
  en: "The 'queen-bee of Quraysh' killed at the Camel — Ali's mourning over him drew al-Ashtar's rebuke and the famous answer 'women rose between me and them who never rose between me and you'; his severed hand was found days later at Mina, seal-ring intact, dropped by an eagle {cite:muruj-al-dhahab p. 663-664}."
