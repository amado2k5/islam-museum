summary:
  ar: طنوس بن يوسف الشدياق الحدثي الماروني، مؤرخ، ولد في الحدث بلبنان وخدم الأمراء الشهابيين ثم صار قاضياً على نصارى لبنان، له «أخبار الأعيان في جبل لبنان» و«مختصر تاريخ البطريرك اسطفان الدويهي الإهدني»، بحسب الزركلي {cite:alam-zirikli-1927-v2 p. 52}.
  en: Tannus ibn Yusuf al-Shidyaq of al-Hadath, a Maronite historian born in al-Hadath in Lebanon, who served the Shihabi emirs and then became judge of the Christians of Lebanon; author of Akhbar al-A'yan fi Jabal Lubnan and an abridgement of the history of Patriarch Istifan al-Duwayhi, according to al-Zirikli.
  ur: طنوس بن یوسف الشدیاق حدثی مارونی، مؤرخ، جو لبنان کے حدث میں پیدا ہوئے، شہابی امرا کی خدمت کی پھر لبنان کے نصاریٰ کے قاضی بنے؛ «اخبار الاعیان فی جبل لبنان» اور بطریرک اسطفان دویہی کی تاریخ کے اختصار کے مصنف، زرکلی کے مطابق۔
