label:
  ar: سهيل زكار
  en: Suhayl Zakkar
  ur: سہیل زکار
  es: "Suhayl Zakkar"
  fr: "Suhayl Zakkar"
summary:
  ar: محقق في التاريخ الإسلامي، محقق «سيرة الهادي إلى الحق»، نال الدكتوراة في التاريخ الإسلامي ثم وجد المخطوط في مكتبة علي أميري بإسطنبول سنة 1969م ونشره في بيروت عن دار الفكر.
  en: 'Scholar of Islamic history, editor of Sirat al-Hadi ila al-Haqq: after his doctorate in Islamic history he found the manuscript in the Ali Amiri library in Istanbul in 1969 and published the edition in Beirut with Dar al-Fikr.'
  ur: اسلامی تاریخ کے محقق، «سیرت الہادی الی الحق» کے مرتب؛ اسلامی تاریخ میں ڈاکٹریٹ کے بعد انہوں نے 1969ء میں استنبول کے علی امیری کتب خانے میں مخطوطہ پایا اور بیروت میں دار الفکر سے شائع کیا۔
  es: "Erudito en historia islámica, editor de Sirat al-Hadi ila al-Haqq: tras obtener su doctorado en historia islámica, encontró el manuscrito en la biblioteca Ali Amiri de Estambul en 1969 y publicó la edición en Beirut con Dar al-Fikr."
  fr: "Spécialiste de l'histoire islamique, éditeur de Sirat al-Hadi ila al-Haqq: après son doctorat en histoire islamique, il a trouvé le manuscrit dans la bibliothèque Ali Amiri à Istanbul en 1969 et a publié l'édition à Beyrouth avec Dar al-Fikr."
  tr: "İslam tarihi editörlüğü yapan ve 'Sirat al-Hadi ila al-Haqq' dergisinin editörü, İslam tarihi alanında doktora derecesi aldı, ardından el yazmasını İstanbul'daki Ali Amiri Kütüphanesi'nde bulup Beyrut'ta Dar al-Fikr aracılığıyla yayımladı."
  id: "Seorang editor sejarah Islam, editor 'Sirat al-Hadi ila al-Haqq', meraih gelar doktor dalam sejarah Islam, kemudian menemukan naskah tersebut di Perpustakaan Ali Amiri di Istanbul pada tahun 1969 dan menerbitkannya di Beirut melalui Dar al-Fikr."
