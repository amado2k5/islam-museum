summary:
  ar: محقق في التاريخ الإسلامي، محقق «سيرة الهادي إلى الحق»، نال الدكتوراة في التاريخ الإسلامي ثم وجد المخطوط في مكتبة علي أميري بإسطنبول سنة 1969م ونشره في بيروت عن دار الفكر.
  en: 'Scholar of Islamic history, editor of Sirat al-Hadi ila al-Haqq: after his doctorate in Islamic history he found the manuscript in the Ali Amiri library in Istanbul in 1969 and published the edition in Beirut with Dar al-Fikr.'
  ur: اسلامی تاریخ کے محقق، «سیرت الہادی الی الحق» کے مرتب؛ اسلامی تاریخ میں ڈاکٹریٹ کے بعد انہوں نے 1969ء میں استنبول کے علی امیری کتب خانے میں مخطوطہ پایا اور بیروت میں دار الفکر سے شائع کیا۔
