names:
  - { value: "أبو الحسن علي بن ميمون المغربي الصوفي", kind: full }
summary:
  ar: "أبو الحسن علي بن ميمون المغربي الصوفي، خلف أبا مدين في طريقته وهو من أهل المغرب ونزل مراكش، وكان متورعاً؛ استُنكر أن تُنسب إليه رسالة لأنه كان متورعاً وأستاذاً، وإنما نسبت إليه لأنه انفرد بترتيبها وانتفع بها خلق كثير؛ توفي بأزمور من أعمال مراكش سنة سبع وستمائة {cite:shadharat-dhahab p. 34-35}."
  en: "Abu al-Hasan Ali b. Maymun, the Maghribi Sufi who succeeded Abu Madyan in his path, resident of Marrakesh, scrupulous; a treatise attributed to him was disowned as his only in that he alone arranged it — and many profited; he died at Azammur in the Marrakesh countryside in 607 {cite:shadharat-dhahab p. 34-35}."
  es: "Abu al-Hasan Ali b. Maymun, el sufí magrebí que sucedió a Abu Madyan en su camino, residente de Marrakech, escrupuloso; un tratado que se le atribuye fue rechazado como único suyo porque él solo lo organizó, y muchos se beneficiaron; murió en Azammur, en la campiña de Marrakech, en el año 607 {cite:shadharat-dhahab p. 34-35}."
  fr: "Abu al-Hasan Ali b. Maymun, le soufi maghrébin qui succéda à Abu Madyan sur sa voie, résident de Marrakech, scrupuleux; un traité qui lui est attribué fut désavoué comme étant le sien uniquement parce qu'il l'avait lui-même rédigé — et beaucoup en profitèrent; il mourut à Azammur dans la campagne de Marrakech en 607 {cite:shadharat-dhahab p. 34-35}."
  ur: "ابو الحسن علی بی۔ میمون، مغربی صوفی جو ابو مدیان کے بعد اس کی راہ میں کامیاب ہوا، مراکیش کا رہنے والا، متعصب؛ اس سے منسوب ایک مقالے کو ان کا واحد قرار دے کر مسترد کر دیا گیا تھا کہ اس نے اکیلے ہی اسے ترتیب دیا تھا - اور بہت سے لوگ فائدہ اٹھاتے تھے۔ اس کی وفات 607 میں مراکش کے دیہی علاقوں میں اعظمور میں ہوئی۔ 34-35}۔"
  tr: "Ebu el-Hasan Ali bin Maymun el-Mağribi el-Mağribi, Ebu Madyan'ın tarikatında onun yerine geçen bir Sufiydi. Mağripliydi ve Marakeş'te yerleşmişti, dindardı; kendisine bir risale atfedilmesine karşı çıktı çünkü dindar ve öğretmendi, ancak onun benzersiz düzenlemesi ve birçok insana fayda sağlaması nedeniyle ona atfedildi. 607 yılında Marakeş'in bir parçası olan Azemmur'da öldü {atıf:shadharat-dhahab, s. 34-35}."
  id: "Abu al-Hasan Ali ibn Maymun al-Maghribi al-Maghribi adalah seorang Sufi yang menggantikan Abu Madyan dalam ordonya. Ia berasal dari Maghreb dan menetap di Marrakesh, dan ia taat; ia menolak diberikan risalah kepadanya karena ia seorang taat dan guru, melainkan lebih karena ia unik dalam penataannya dan memberikan manfaat bagi banyak orang. Ia meninggal di Azemmour, bagian dari Marrakesh, pada tahun 607 {cite:shadharat-dhahab, hlm. 34-35}."
