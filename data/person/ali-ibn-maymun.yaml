summary:
  ar: "أبو الحسن علي بن ميمون المغربي الصوفي، خلف أبا مدين في طريقته وهو من أهل المغرب ونزل مراكش، وكان متورعاً؛ استُنكر أن تُنسب إليه رسالة لأنه كان متورعاً وأستاذاً، وإنما نسبت إليه لأنه انفرد بترتيبها وانتفع بها خلق كثير؛ توفي بأزمور من أعمال مراكش سنة سبع وستمائة {cite:shadharat-dhahab p. 34-35}."
  en: "Abu al-Hasan Ali b. Maymun, the Maghribi Sufi who succeeded Abu Madyan in his path, resident of Marrakesh, scrupulous; a treatise attributed to him was disowned as his only in that he alone arranged it — and many profited; he died at Azammur in the Marrakesh countryside in 607 {cite:shadharat-dhahab p. 34-35}."
