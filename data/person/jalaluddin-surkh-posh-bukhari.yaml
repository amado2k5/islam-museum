summary:
  ar: "سيد جلال الدين حسين النقوي البخاري (595–690 هـ / 1199–1291م)، المعروف بسرخ بوش، ولي صوفي وُلد في بخارى وهاجر أمام الغزو المغولي فأخذ الطريقة السهروردية في ملتان عن بهاء الدين زكريا، ثم استقر سنة 1244م في أوج بالسند فجعلها مركزًا للسهروردية وأسس فرعها الجلالي، وهو جد مخدوم جهانيان جهانكشت."
  en: "Sayyid Jalaluddin Husayn al-Naqvi al-Bukhari (595–690 AH / 1199–1291 CE), known as Surkh-Posh ('clad in red'), a Sufi saint born at Bukhara who fled the Mongol invasion, took the Suhrawardi order at Multan from Bahauddin Zakariya, and settled in 1244 at Uch in Sindh, which he made a Suhrawardi centre, founding the order's Jalali branch; he is the grandfather of Makhdum-i Jahaniyan Jahangasht."
  ur: "سید جلال الدین حسین نقوی بخاری (595ھ–690ھ / 1199ء–1291ء)، جو سرخ پوش کے نام سے مشہور ہیں، بخارا میں پیدا ہونے والے صوفی بزرگ تھے۔ منگول حملے کے سامنے ہجرت کر کے انھوں نے ملتان میں بہاء الدین زکریا سے سلسلۂ سہروردیہ اختیار کیا، پھر 1244ء میں سندھ کے شہر اوچ میں سکونت اختیار کر کے اسے سہروردی مرکز بنایا اور سلسلے کی جلالی شاخ کی بنیاد رکھی۔ مخدوم جہانیاں جہانگشت ان کے پوتے ہیں۔"
