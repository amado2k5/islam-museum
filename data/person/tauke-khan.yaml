  ur: "Zheti Zhargy کوڈ سے وابستہ سترہویں صدی کے آخر کے قازق خان، تاوکے خان کے لیے ڈرافٹ کارڈ، ڈی۔ 1718; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "17. yüzyılın sonlarında 'Jiti Jirga'nın yazarı Kazak Han'ın ilk kartı; kendisi 1718 yılında ölmüştür; İslam ülkelerinin sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Touqa Khan, Khan Kazakh pada akhir abad ketujuh belas, penulis 'Jiti Jirga', yang meninggal pada tahun 1718 M; ia disebutkan dalam kamus negara-negara Islam, dan biografinya belum diulas di halaman tersebut."
