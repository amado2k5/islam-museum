  ar: "بطاقة أولية لتوقة خان، خان القازاق في أواخر القرن السابع عشر صاحب «جيتي جرغى»، توفي سنة ١٧١٨م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
