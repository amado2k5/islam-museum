label: { ar: "سرجون بن منصور", en: "Sarjun ibn Mansur" }
summary:
  ar: "سرجون بن منصور كاتب عبد الملك بن مروان؛ عند البلاذري: لما فرغ سليمان بن سعد من نقل ديوان الشام عن الرومية وأتى به عبد الملك دعا بسرجون فعرّض ذلك عليه فعمّه وخرج من عنده كئيباً فلقيه قوم من كتّاب الروم فقال «اطلبوا المعيشة من غير هذه الصناعة فقد قطعها الله عنكم».، وكان يكتب على الديوان بالشام بالرومية لمعاوية بن أبي سفيان ثم منصور بن سرجون حتى نقل الديوان في زمن هشام بن عبد الملك نقله سليمان بن سعد مولى حسين {cite:fihrist-ibn-al-nadim p. 339}"
  en: "Sarjun ibn Mansur, scribe of Abd al-Malik ibn Marwan; in al-Baladhuri: when Sulayman ibn Sa'd finished transferring Syria's diwan from Greek and brought it to Abd al-Malik, he called Sarjun and displayed it to him — which grieved him, and he went out dejected; met by a group of the Roman scribes he told them 'seek your livelihood in a craft other than this — God has cut it off from you.'"
