id: person/sarjun-ibn-mansur
class: person
label: { ar: "سرجون بن منصور", en: "Sarjun ibn Mansur", es: "Sarjun ibn Mansur", fr: "Sarjun ibn Mansur", ur: "سرجن ابن منصور" }
summary:
  ar: "سرجون بن منصور كاتب عبد الملك بن مروان؛ عند البلاذري: لما فرغ سليمان بن سعد من نقل ديوان الشام عن الرومية وأتى به عبد الملك دعا بسرجون فعرّض ذلك عليه فعمّه وخرج من عنده كئيباً فلقيه قوم من كتّاب الروم فقال «اطلبوا المعيشة من غير هذه الصناعة فقد قطعها الله عنكم». وكان يكتب على الديوان بالشام بالرومية لمعاوية بن أبي سفيان ثم منصور بن سرجون حتى نقل الديوان في زمن هشام بن عبد الملك نقله سليمان بن سعد مولى حسين {cite:fihrist-ibn-al-nadim p. 339}"
  en: "Sarjun ibn Mansur, scribe of Abd al-Malik ibn Marwan; in al-Baladhuri: when Sulayman ibn Sa'd finished transferring Syria's diwan from Greek and brought it to Abd al-Malik, he called Sarjun and displayed it to him — which grieved him, and he went out dejected; met by a group of the Roman scribes he told them 'seek your livelihood in a craft other than this — God has cut it off from you.'"
  es: "Sarjun ibn Mansur, escriba de Abd al-Malik ibn Marwan; en al-Baladhuri: cuando Sulayman ibn Sa'd terminó de trasladar el diván de Siria desde Grecia y se lo llevó a Abd al-Malik, llamó a Sarjun y se lo mostró, lo cual lo entristeció y salió abatido; al encontrarse con un grupo de escribas romanos, les dijo: «Buscad vuestro sustento en otro oficio; Dios os lo ha arrebatado»."
  fr: "Sarjun ibn Mansur, scribe d'Abd al-Malik ibn Marwan; dans al-Baladhuri: lorsque Sulayman ibn Sa'd eut terminé de transférer le diwan de Syrie du grec et l'apporta à Abd al-Malik, il appela Sarjun et le lui montra — ce qui l'attrista, et il sortit abattu; rencontré par un groupe de scribes romains, il leur dit: « Cherchez votre gagne-pain dans un autre métier que celui-ci — Dieu vous l'a retiré. »"
  ur: "سرجن ابن منصور، عبد الملک ابن مروان کا کاتب؛ البلادوری میں ہے: جب سلیمان بن سعد شام کے دیوان کو یونانی سے منتقل کر کے عبد الملک کے پاس لے آیا تو اس نے سرجن کو بلایا اور اسے دکھایا - جس سے وہ غمگین ہوا اور وہ مایوس ہو کر باہر نکل گیا۔ رومی کاتبوں کے ایک گروہ سے ملاقات ہوئی اس نے ان سے کہا کہ 'اپنی روزی اس کے علاوہ کسی اور ہنر میں تلاش کرو - خدا نے اسے تم سے کاٹ دیا ہے۔'"
  tr: "Abd al-Malik ibn Marwan'ın kâtipi Sarjun bin Mansur; al-Baladhuri ile: Sulayman ibn Sa'd Diwan al-Sham'ı al-Rumiya'dan kopyalamayı bitirdiğinde ve Abd al-Malik onu getirdiğinde, Sarjun'u çağırdı, Sarjun bunu ona sundu, böylece onu amcası olarak terk etti ve üzüntü içinde ayrıldı. Bazı Roma katipleri onu karşıladı ve \"Bu meslekten geçim ara, çünkü Allah onu senden kopardı,\" dediler. Diwan, Rumiye'de Muaviye ibn Ebi Sufyan için, sonra Mansur ibn Sarjun için yazırdı, ta ki divan Hisham ibn Abd al-Malik zamanında taşınana kadar, Hüseyin'in özgür katili Süleyman ibn Sa'd tarafından taşınana kadar {atı: fihrist-ibn-al-nadim s. 339}"
  id: "Sarjun ibn Mansur, juru tulis Abd al-Malik ibn Marwan; bersama al-Baladhuri: Ketika Sulayman ibn Sa'd selesai menyalin Diwan al-Sham dari al-Rumiya dan Abd al-Malik membawanya, ia memanggil Sarjun, yang menyerahkan surat ini kepadanya, sehingga ia memandangnya dan pergi dalam keadaan sedih. Beberapa juru tulis Romawi menemuinya dan berkata, \"Carilah penghidupan dari profesi ini, karena Tuhan telah memisahkannya darimu.\" Ia biasa menulis di atas diwan di al-Sham di Rumiyah untuk Muawiyah ibn Abi Sufyan, kemudian Mansur ibn Sarjun, hingga diwan itu dipindahkan pada masa Hisham ibn Abd al-Malik, yang dibawa oleh Sulayman ibn Sa'd, mantan Husayn {cite:fihrist-ibn-al-nadim hlm. 339}"
