summary:
  ar: "إمام عصره في الحديث والأثر وما يتعلق بهما، قرطبي؛ روى عن خلف بن القاسم الحافظ وعبد الوارث بن سفيان وأبي الوليد الباجي وأبي الوليد ابن الفرضي، قال القاضي ابن سكرة سمعت الباجي يقول لم يكن بالأندلس مثل أبي عمر ابن عبد البر في الحديث وقال الباجي أيضاً أبو عمر أحفظ أهل المغرب، وألف في الموطأ كتباً مفيدة منها التمهيد مرتباً على أسماء شيوخ مالك في سبعين جزءاً قال ابن حزم لا أعلم في الكلام على فقه الحديث مثله {cite:wafayat-ayan p. 66-67}."
  en: "Abu 'Amr Ibn 'Abd al-Barr of Cordoba, imam of his age in hadith and athar — al-Baji said there was none like him in al-Andalus, 'the most memorising of the Maghreb's people'; his Tamhid on the Muwatta' in seventy parts drew Ibn Hazm's verdict that nothing on fiqh al-hadith equals it {cite:wafayat-ayan p. 66-67}."
  ur: "ابو عمر ابن عبد البر قرطبی، اپنے زمانے کے امام حدیث و اثر — باجی کے مطابق اندلس میں ان جیسا کوئی نہ تھا اور وہ «مغرب کے سب سے بڑے حافظ» تھے؛ ان کی موطا پر ستر حصوں کی «تمہید» ایسی تھی کہ ابن حزم کے نزدیک فقہ الحدیث پر اس کی برابر کوئی کتاب نہیں {cite:wafayat-ayan p. 66-67}."
