born: { edtf: "0978-11-29", hijri: "0368-04-25", calendar: julian, precision: day, status: tradition, derived: true, note: "ولدت يوم الجمعة والإمام يخطب لخمس بقين من ربيع الآخر سنة ثمان وستين وثلاثمائة، اليوم التاسع والعشرون من نونبر {cite:tarikh-islam-dhahabi p. 137}؛ التحويل مشتق؛ رواية الجذوة والبغية رجب ٣٦٢." }
