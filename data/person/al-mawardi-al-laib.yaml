id: person/al-mawardi-al-laib
class: person
label: { ar: "الماوردي اللاعب", en: "al-Mawardi the chess-player", fr: "al-Mawardi, le joueur d’échecs", es: "al-Mawardi the chess-player", ur: "الماوردی شطرنج کا کھلاڑی" }
summary:
  ar: "لاعب الشطرنج المقدم عند المكتفي المتمكن من قلبه، لعب معه أبو بكر الصولي بحضرة المكتفي لما ذكر له بجودة لعبه فحمل المكتفي حسن رأيه في الماوردي وتقدم الحرمة والألفة على نصرته حتى أدهش الصولي، فلما اتصل اللعب غلبه الصولي غلباً لا يكاد يرد عليه شيئاً فعدل المكتفي عن هواه وقال له صار ماء وردك بولاً {cite:muruj-al-dhahab p. 677}."
  en: "Al-Muktafi's favorite chess-master until al-Suli crushed him — 'your rose-water has turned to urine' {cite:muruj-al-dhahab p. 677}."
  fr: "Le maître d’échecs préféré d’Al-Muktafi jusqu’à ce qu’al-Suli l’écrase – « votre eau de rose s’est transformée en urine  » {cite:muruj-al-dhahab p. 677}."
  es: "El maestro de ajedrez favorito de Al-Muktafi hasta que Al-Suli lo aplastó: \"tu agua de rosas se ha convertido en orina\" {cita:muruj-al-dhahab p. 677}."
  ur: "المکتفی کا پسندیدہ شطرنج کا ماہر جب تک کہ السلی نے اسے کچل نہیں دیا - 'تمہارا گلاب کا پانی پیشاب میں بدل گیا ہے'۔ 677}۔"
  tr: "Al-Muktaffi tarafından sunulan ve kalpten yetenekli satranç oyuncusu, Ebu Bekir el-Sulli ile birlikte al-Muktafi ile oynandı; Muktafi ona oyunun kalitesini hatırlattı. Muttafi, el-Mevardi hakkındaki görüşünü ve kutsallık ile samimiyetin desteğinden üstünlüğünü savunarak el-Suli'yi şaşırttı. Oyun sona erdiğinde, el-Sulli onu o kadar yendi ki neredeyse cevap veremedi. Muttafi fikrini değiştirdi ve ona, 'Su oldu, idrarın idrar oldu' dedi {kaynak:muruj-al-dhahab, s. 677}."
  id: "Pemain catur yang diperkenalkan oleh al-Muktaffi, yang sangat terampil, dimainkan bersama Abu Bakr al-Sulli di hadapan al-Muktafi ketika ia mengingatkannya akan kualitas permainannya. Muttafi memegang pendapatnya tentang al-Mawardi, dan keutamaan kesucian serta keintiman daripada dukungannya, membuat al-Suli terkejut. Ketika permainan berakhir, al-Sulli mengalahkannya begitu keras sehingga ia hampir tidak mampu menjawab. Muttafi berubah pikiran dan berkata kepadanya, 'Air telah berubah dan urinmu telah menjadi urine' {cite:muruj-al-dhahab, hlm. 677}."
