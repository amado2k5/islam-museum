id: person/conrad-de-montferrat
class: person
label: { ar: "المركيس صاحب صور", en: "Conrad, Marquis of Montferrat", es: "Conrad, Marquis of Montferrat", fr: "Conrad, Marquis of Montferrat", ur: "کونراڈ، مارکوئس آف مونٹفراٹ" }
summary:
  ar: "المركيس الفرنجي صاحب صور، وصفه ابن الأثير بأنه أكبر شياطين الفرنج؛ قتله ثالث عشر ربيع الآخر سنة ثمان وثمانين وخمسمائة باطنيان في زي الرهبان أرسلهما مقدم الإسماعيلية سنان — وكانا قد لازما صاحب صيدا وابن بيرزان ستة أشهر حتى ائتمن بهما — فجرحاه بعد دعوة أسقف صور ثم أتم أحدهما قتله في الكنيسة التي لجأ إليها، ونسب الفرنج قتله إلى ملك إنكلتار لينفرد بملك الساحل {cite:kamil-ibn-al-athir p. 213-214}."
  en: "Conrad of Montferrat, lord of Tyre — 'the greatest of the Frankish devils' in Ibn al-Athir's phrase; killed in Rabi' II 588 by two monk-garbed Assassins of Sinan's who had lived six months among his own circle before striking him at a bishop's banquet and finishing him in the church; the Franks blamed King Richard {cite:kamil-ibn-al-athir p. 213-214}."
  es: "Conrado de Montferrato, señor de Tiro —'el mayor de los demonios francos' en palabras de Ibn al-Athir; asesinado en Rabi' II 588 por dos asesinos de Sinan vestidos de monjes que habían vivido seis meses entre su círculo antes de atacarlo en un banquete episcopal y acabar con él en la iglesia; los francos culparon al rey Ricardo {cite:kamil-ibn-al-athir p. 213-214}."
  fr: "Conrad de Montferrat, seigneur de Tyr — « le plus grand des démons francs » selon l'expression d'Ibn al-Athir; tué en Rabi' II 588 par deux assassins de Sinan vêtus en moines, qui avaient vécu six mois parmi son propre cercle avant de le frapper lors d'un banquet d'évêque et de l'achever dans l'église; les Francs blâmèrent le roi Richard {cite:kamil-ibn-al-athir p. 213-214}."
  ur: "کانراڈ آف مونٹفراٹ، لارڈ آف ٹائر - ابن الثیر کے فقرے میں 'فرانکیشی شیطانوں میں سب سے بڑا'؛ ربیع II 588 میں سنان کے دو راہبوں کے لباس میں ملبوس قاتلوں کے ذریعہ قتل کیا گیا جو ایک بشپ کی ضیافت میں اس پر حملہ کرنے اور اسے چرچ میں ختم کرنے سے پہلے اپنے ہی دائرے میں چھ ماہ رہ چکے تھے۔ فرانکس نے کنگ رچرڈ کو مورد الزام ٹھہرایا {حوالہ: کامل ابن الاثیر صفحہ 213-214}۔"
  tr: "İbn al-Athir tarafından Frank şeytanlarının en büyüğü olarak tanımlanan Sur Markisi; 588 Hicri yılında, İsmaili lideri Sinan tarafından altı ay boyunca Sidon hükümdarı ve İbn Birzan'a güvenene kadar ona eşlik eden keşiş kılığına girmiş iki rahip tarafından öldürüldü ve Sur Piskoposu'nun daveti üzerine onu yaraladı. Bunlardan biri daha sonra sığındığı kilisede öldürmeyi tamamladı. Franklar, onun öldürülmesini İngiltere Kralı'na atfetti ve onu sadece Sahil Kralı'na ait yaptı {cite:kamil-ibn-al-athir s. 213-214}."
  id: "Marquis Frank dari Tyre, yang digambarkan oleh Ibn al-Athir sebagai iblis terbesar Franka; ia dibunuh pada tanggal tiga belas Rabi' al-Thani tahun 588 AH oleh dua imam yang menyamar sebagai biarawan yang dikirim oleh pemimpin Ismailia, Sinan—yang telah menemani penguasa Sidon dan Ibn Birzan selama enam bulan hingga ia mempercayai mereka—melukainya setelah undangan Uskup Tyre. Salah satu dari mereka kemudian menyelesaikan pembunuhannya di gereja tempat ia berlindung. Orang Frank mengaitkan pembunuhannya dengan Raja Inggris, menjadikannya eksklusif untuk Raja Pantai {cite:kamil-ibn-al-athir hlm. 213-214}."
