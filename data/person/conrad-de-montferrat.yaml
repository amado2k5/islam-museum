summary:
  ar: "المركيس الفرنجي صاحب صور، وصفه ابن الأثير بأنه أكبر شياطين الفرنج؛ قتله ثالث عشر ربيع الآخر سنة ثمان وثمانين وخمسمائة باطنيان في زي الرهبان أرسلهما مقدم الإسماعيلية سنان — وكانا قد لازما صاحب صيدا وابن بيرزان ستة أشهر حتى ائتمن بهما — فجرحاه بعد دعوة أسقف صور ثم أتم أحدهما قتله في الكنيسة التي لجأ إليها، ونسب الفرنج قتله إلى ملك إنكلتار لينفرد بملك الساحل {cite:kamil-ibn-al-athir p. 213-214}."
  en: "Conrad of Montferrat, lord of Tyre — 'the greatest of the Frankish devils' in Ibn al-Athir's phrase; killed in Rabi' II 588 by two monk-garbed Assassins of Sinan's who had lived six months among his own circle before striking him at a bishop's banquet and finishing him in the church; the Franks blamed King Richard {cite:kamil-ibn-al-athir p. 213-214}."
