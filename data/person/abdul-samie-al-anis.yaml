summary:
  ar: "عالم حديث من بلاد الشام، وُلد سنة 1963، حصل على الدكتوراه في الحديث النبوي وعلومه من جامعة بغداد سنة 1995، وهو أستاذ في قسم أصول الدين بكلية الشريعة والدراسات الإسلامية بجامعة الشارقة، وله تحقيق «الفصل للوصل المدرج في النقل» للخطيب البغدادي وكتب في السنة النبوية، وتُبث محاضراته المصورة على منصات الفيديو."
  en: "Levantine hadith scholar, born in 1963. He took his doctorate in the Prophetic Hadith and its sciences from the University of Baghdad in 1995, is a professor in the Department of Usul al-Din at the University of Sharjah's College of Sharia and Islamic Studies, and is the editor of al-Khatib al-Baghdadi's al-Fasl lil-Wasl al-Mudraj fi al-Naql and the author of books on the Prophetic Sunna; his recorded lectures circulate on video platforms."
  ur: "بلادِ شام کے عالمِ حدیث، جو 1963 میں پیدا ہوئے۔ انہوں نے 1995 میں جامعہ بغداد سے حدیث نبوی اور اس کے علوم میں ڈاکٹریٹ کیا، جامعہ شارقہ کی کلیۃ الشریعہ میں شعبۂ اصول الدین کے استاد ہیں، خطیب بغدادی کی «الفصل للوصل المدرج في النقل» کے محقق ہیں اور سنتِ نبوی پر ان کی کتابیں ہیں؛ ان کے ریکارڈ شدہ محاضرات ویڈیو پلیٹ فارموں پر نشر ہوتے ہیں۔"
