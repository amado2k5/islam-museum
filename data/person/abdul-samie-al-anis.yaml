summary:
  ar: "عالم حديث من بلاد الشام، وُلد سنة 1963، حصل على الدكتوراه في الحديث النبوي وعلومه من جامعة بغداد سنة 1995، وهو أستاذ في قسم أصول الدين بكلية الشريعة والدراسات الإسلامية بجامعة الشارقة، وله تحقيق «الفصل للوصل المدرج في النقل» للخطيب البغدادي وكتب في السنة النبوية، وتُبث محاضراته المصورة على منصات الفيديو."
  en: "Levantine hadith scholar, born in 1963. He took his doctorate in the Prophetic Hadith and its sciences from the University of Baghdad in 1995, is a professor in the Department of Usul al-Din at the University of Sharjah's College of Sharia and Islamic Studies, and is the editor of al-Khatib al-Baghdadi's al-Fasl lil-Wasl al-Mudraj fi al-Naql and the author of books on the Prophetic Sunna; his recorded lectures circulate on video platforms."
  fr: "Savant levantin du hadith, né en 1963. Docteur en hadith prophétique et ses sciences de l'université de Bagdad en 1995, il est professeur au département d'Usul al-Din de la faculté de charia et d'études islamiques de l'université de Charjah, éditeur d'al-Fasl lil-Wasl al-Mudraj fi al-Naql d'al-Khatib al-Baghdadi et auteur de livres sur la Sunna prophétique ; ses conférences enregistrées circulent sur les plateformes vidéo."
  ur: "بلادِ شام کے عالمِ حدیث، جو 1963 میں پیدا ہوئے۔ انہوں نے 1995 میں جامعہ بغداد سے حدیث نبوی اور اس کے علوم میں ڈاکٹریٹ کیا، جامعہ شارقہ کی کلیۃ الشریعہ میں شعبۂ اصول الدین کے استاد ہیں، خطیب بغدادی کی «الفصل للوصل المدرج في النقل» کے محقق ہیں اور سنتِ نبوی پر ان کی کتابیں ہیں؛ ان کے ریکارڈ شدہ محاضرات ویڈیو پلیٹ فارموں پر نشر ہوتے ہیں۔"
  es: "Erudito levantino especializado en hadices, nacido en 1963. Se doctoró en Hadiz Profético y sus ciencias por la Universidad de Bagdad en 1995, es profesor en el Departamento de Usul al-Din de la Facultad de Sharia y Estudios Islámicos de la Universidad de Sharjah, editor de al-Khatib al-Baghdadi, al-Fasl lil-Wasl al-Mudraj fi al-Naql, y autor de libros sobre la Sunna Profética; sus conferencias grabadas circulan en plataformas de vídeo."
  tr: "1963 doğumlu, Levant bölgesinden modern bir âlim olan bu kişi, 1995 yılında Bağdat Üniversitesi'nden Peygamber Hadisleri ve ilimleri alanında doktora derecesi almıştır. Şarjah Üniversitesi Şeriat ve İslam Araştırmaları Fakültesi Din Temelleri Bölümü'nde profesördür. El-Hatib el-Bağdadi'nin \"El-Fasl li-el-Vasl el-Mudraj fi el-Naql\" adlı eseri üzerine bir araştırması bulunmaktadır ve Peygamber Sünneti üzerine yazılar kaleme almıştır. Kaydedilmiş dersleri video platformlarında yayınlanmaktadır."
  id: "Seorang cendekiawan modern dari Levant, lahir pada tahun 1963, ia memperoleh gelar doktor dalam bidang Hadits Nabi dan ilmu-ilmu terkait dari Universitas Baghdad pada tahun 1995. Ia adalah seorang profesor di Departemen Dasar-Dasar Agama di Fakultas Syariah dan Studi Islam di Universitas Sharjah. Ia telah melakukan kajian terhadap kitab “Al-Fasl li-al-Wasl al-Mudraj fi al-Naql” karya Al-Khatib Al-Baghdadi dan telah menulis tentang Sunnah Nabi. Ceramah-ceramahnya yang direkam disiarkan di platform video."
