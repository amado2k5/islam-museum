  es: "Hijo de Barakah (Umm Ayman, la nodriza del Profeta) y hermanastro de Usama ibn Zayd; un musulmán árabe etíope que permaneció firme junto al Profeta cuando las filas se rompieron en Hunayn y cayó luchando como mártir."
  fr: "Le fils de Barakah (Umm Ayman, la nourrice du Prophète) et demi-frère d'Usama ibn Zayd; un musulman arabo-éthiopien qui resta fidèle au Prophète lorsque les lignes se brisèrent à Hunayn et tomba au combat en martyr."
