id: person/abu-zakariya-bejaia
class: person
label:
  ar: الأمير أبو زكريا صاحب بجاية
  en: Amir Abu Zakariya, lord of Bejaia
  fr: "L'émir Abu Zakariya, seigneur de Béjaïa"
  es: "Amir Abu Zakariya, lord of Bejaia"
summary:
  ar: "أبو بكر زكريا بن السلطان المستنصر الحفصي، لقب نفسه «المنتخب لإحياء دين الله»؛ لحق بتلمسان بعد منجاته من مهلك أبيه ونزل على صهره عثمان بن يغمراسن، فلما بايع له العرب وبدت مخايل الملك اعتزم على شأنه فاستولى على قسطنطينة سنة 683هـ ثم دخل بجاية سنة 684هـ واستولى على الجزائر، واقتطع الناحية الغربية من أعمال الحضرة فانقسمت بذلك الدولة الحفصية إلى دولتين، وهو الذي اختط المدرسة للعلم بأزاء دار الأقوري بتونس."
  en: "Abu Bakr Zakariya ibn al-Mustansir al-Hafsi, who titled himself 'al-Muntakhab for the revival of God's religion'; he reached Tlemcen after escaping his father's death and lodged with his brother-in-law Uthman ibn Yaghmurasen, then, as the Arabs swore him and kingship's signs showed, he seized Constantine in 683 AH and Bejaia in 684 AH, took Algiers, and split the Hafsid state into the western emirate and the capital — he who founded the madrasa opposite the Aquri house in Tunis."
  fr: "Abu Bakr Zakariya ibn al-Mustansir al-Hafsi, qui prit le titre d'« al-Muntakhab pour la revivification de la religion de Dieu » ; échappant à la mort de son père, il gagna Tlemcen chez son beau-frère Uthman ibn Yaghmurasen. Les Arabes lui prêtèrent serment et les signes de la royauté apparurent ; il prit Constantine en 683 H, Béjaïa en 684 H et Alger, divisant l'État hafside entre l'émirat occidental et la capitale. Il fonda la madrasa face à la maison Aquri à Tunis."
  es: "Abu Bakr Zakariya ibn al-Mustansir al-Hafsi, quien se autodenominó \"al-Muntakhab para el renacimiento de la religión de Dios\", llegó a Tremecén tras escapar de la muerte de su padre y se alojó con su cuñado Uthman ibn Yaghmurasen. Luego, como le juraron los árabes y como indicaban los signos de la realeza, se apoderó de Constantina en el año 683 de la Hégira y de Bejaia en el año 684 de la Hégira, tomó Argel y dividió el estado hafsí en el emirato occidental y la capital. Fue él quien fundó la madrasa frente a la casa Aquri en Túnez."
