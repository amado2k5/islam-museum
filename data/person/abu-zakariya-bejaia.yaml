id: person/abu-zakariya-bejaia
class: person
label:
  ar: الأمير أبو زكريا صاحب بجاية
  en: Amir Abu Zakariya, lord of Bejaia
summary:
  ar: "أبو بكر زكريا بن السلطان المستنصر الحفصي، لقب نفسه «المنتخب لإحياء دين الله»؛ لحق بتلمسان بعد منجاته من مهلك أبيه ونزل على صهره عثمان بن يغمراسن، فلما بايع له العرب وبدت مخايل الملك اعتزم على شأنه فاستولى على قسطنطينة سنة 683هـ ثم دخل بجاية سنة 684هـ واستولى على الجزائر، واقتطع الناحية الغربية من أعمال الحضرة فانقسمت بذلك الدولة الحفصية إلى دولتين، وهو الذي اختط المدرسة للعلم بأزاء دار الأقوري بتونس."
  en: "Abu Bakr Zakariya ibn al-Mustansir al-Hafsi, who titled himself 'al-Muntakhab for the revival of God's religion'; he reached Tlemcen after escaping his father's death and lodged with his brother-in-law Uthman ibn Yaghmurasen, then, as the Arabs swore him and kingship's signs showed, he seized Constantine in 683 AH and Bejaia in 684 AH, took Algiers, and split the Hafsid state into the western emirate and the capital — he who founded the madrasa opposite the Aquri house in Tunis."
