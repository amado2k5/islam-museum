  ar: "كاتب وباحث دراسات دينية إيراني أمريكي، وُلد في طهران سنة 1972. من كتبه «لا إله إلا الله» و«زيالوت»، وهو أستاذ الكتابة الإبداعية في جامعة كاليفورنيا في ريفرسايد ومقدّم سلسلة «بليفر» على شبكة سي إن إن."
