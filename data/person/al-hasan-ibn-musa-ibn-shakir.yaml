summary:
  ar: "الحسن بن موسى بن شاكر (توفي في القرن التاسع)، أصغر بني موسى في بغداد وأعلمهم — في عبارة المقالة العربية — بالرياضيات والفلك. رسالته الوحيدة المنسوبة إليه «كتاب الشكل المدوّر المستطيل» في رسم القطع الناقص بدبوسين وخيط، وهي الطريقة المعروفة اليوم بطريقة البستاني، وقد فُقدت الرسالة. لا تثبت الدراسات التي تعتمدها المقالة الإنجليزية سنة ميلاد أو وفاة له؛ وسنوات المقالة العربية (810–873) محفوظة في ترجمته بوصفها رواية غير محققة."
  en: "Al-Hasan ibn Musa ibn Shakir (died in the 9th century), youngest of the Banu Musa brothers of Baghdad and, in the Arabic article's phrase, the most learned of them in mathematics and astronomy. His one attributed treatise, the Book of the Elongated Circular Figure — on drawing an ellipse with two pins and a length of string, the technique now known as the gardener's construction — is lost. No birth or death year is attested for him by the scholarship the English article rests on; the Arabic article's years (810-873) are preserved in his record as an unverified tradition."
  ur: "الحسن بن موسی بن شاکر (وفات نویں صدی)، بغداد کے بنو موسی کے سب سے چھوٹے بھائی اور — عربی مضمون کے لفظوں میں — ریاضی و فلکیات میں تینوں سے بڑھ کر عالم۔ ان سے منسوب واحد رسالہ «کتاب الشکل المدور المستطیل» تھا، جو دو کیلوں اور دھاگے سے بیضوی شکل (قطع ناقص) کھینچنے پر تھا — وہی طریقہ جو آج «باغبان کی ترکیب» کہلاتا ہے — اور یہ رسالہ اب مفقود ہے۔ انگریزی مضمون کی بنیاد بننے والی تحقیق کے مطابق ان کی پیدائش یا وفات کا کوئی سال ثابت نہیں؛ عربی مضمون کے سال (810–873ء) ان کے ریکارڈ میں غیر مصدقہ روایت کے طور پر محفوظ ہیں۔"

