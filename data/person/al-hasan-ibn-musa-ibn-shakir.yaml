  source: "The English, Arabic and Urdu Wikipedia articles on the Banu Musa brothers and the Wikidata items Q423210 (the brothers jointly) and Q37726928 (al-Hasan individually), together with Ibn al-Nadim's Fihrist in the museum's existing source file, read at the revisions recorded in their source files and fetched live from the MediaWiki API on 1 November 2026, the Wikidata revisions re-asserted against second live queries; the joint item was grounded from the English article's own page property and al-Hasan's individual item was resolved through its English sitelink page, which is a redirect to the combined article. The founder commissioned the Banu Musa as one row of the century queue's section I (826-925 additions) naming three persons; they are built as three records. Seniority follows the articles' assumed order — Muhammad, Ahmad, al-Hasan — and each sibling edge is written once, in the elder brother's record, so both of al-Hasan's sibling edges stand in his brothers' records and none here. Their father Musa ibn Shakir's museum record is a Devin-era draft card (run wikidata-import-0038); the child_of edge is written against it as the lane's precedents allow, and that card's unrelied-on death year is not used here. No birth or death block is recorded for al-Hasan: the English article dates him only 'd. 9th century' and its scholarly apparatus (Bir, 1990) states that of the three brothers only Muhammad's death year is known. The Arabic article prints 810-873 for him — its narrative repeats the 873 death year — and his Wikidata item carries the same two years, all unsourced and of one modern tradition; they are preserved in the summary and prose as an attested tradition, not built as dates."
