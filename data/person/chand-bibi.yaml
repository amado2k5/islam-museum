summary:
  ar: "بطاقة أولية لتشاند بيبي، وصية عرش أحمد نكر التي قادت الدفاع عنها ضد أكبر، وردت في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمتها في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Chand Bibi, regent of Ahmadnagar who led its defence against Akbar, named from an open reference description (Wikidata); her entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Chand Bibi, regente de Ahmadnagar que dirigió su defensa contra Akbar, nombrada a partir de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de convocation de Chand Bibi, régente d'Ahmadnagar qui a mené sa défense contre Akbar, nommée d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "احمد نگر کی ریجنٹ چاند بی بی کے لیے ڈرافٹ کارڈ جس نے اکبر کے خلاف اپنے دفاع کی قیادت کی، جس کا نام کھلے حوالہ سے بیان کیا گیا ⁦(وکی ڈیٹا)⁩؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Ahmed Naker'in Akbar'a karşı savunmasını başlatan Taht Vasiyeti Chand Bibi'nin ön kartı açık bir referans açıklamasında (Wikidata) yer almaktadır. Hassan İbrahim'in İslam Tarihi kitabındaki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal Chand Bibi, Wasiat Takhta Ahmed Naker yang memimpin pembelaannya melawan Akbar, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
