summary:
  ar: "قائد عسكري ورجل دولة تركي. خدم في الجيش العثماني في فلسطين، ثم كان من قادة حرب الاستقلال التركية، فتولى وزارة الداخلية مرتين ووزارة الدفاع الوطني في حكومة أنقرة، وجلس في البرلمان لأعوام طويلة عن إزمير ثم إسطنبول. توفي في إسطنبول سنة 1963 ودُفن في مقبرة زينجيرليكويو."
  en: "Turkish military commander and statesman. He served in the Ottoman army in Palestine, became one of the commanders of the Turkish War of Independence, held the Ankara government's Ministry of the Interior twice and its Ministry of National Defence, and sat in parliament for many years for İzmir and then Istanbul. He died at Istanbul in 1963 and was buried at Zincirlikuyu Cemetery."
  ur: "ترک فوجی کمانڈر اور مدبر۔ انہوں نے فلسطین میں عثمانی فوج میں خدمات انجام دیں، ترک جنگِ آزادی کے کمانڈروں میں سے ایک بنے، انقرہ حکومت کی وزارتِ داخلہ دو بار اور وزارتِ دفاعِ ملی سنبھالی، اور کئی برس ازمیر اور پھر اسطنبول سے پارلیمان کے رکن رہے۔ 1963 میں اسطنبول میں وفات پائی اور زینجیرلی کویو قبرستان میں دفن ہوئے۔"
