  ar: "إسحاق بن داود بن سيف أرعد الحشي صاحب الحبشة؛ توفي في ذي القعدة سنة ثلاث وثلاثين وثمانمائة وكانت ولايته إحدى وعشرين سنة، وأقيم بعده ولده أندراوس فملك أربعة أشهر وهلك فأقيم عمه خرنباي فملك سريعاً فأقيم بعده صبي صغير إلى أن هلك في طاعون سنة تسع وثلاثين {cite:shadharat-dhahab p. 201}."
