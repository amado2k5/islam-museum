summary:
  ar: "إسحاق بن داود بن سيف أرعد الحشي صاحب الحبشة؛ توفي في ذي القعدة سنة ثلاث وثلاثين وثمانمائة وكانت ولايته إحدى وعشرين سنة، وأقيم بعده ولده أندراوس فملك أربعة أشهر وهلك فأقيم عمه خرنباي فملك سريعاً فأقيم بعده صبي صغير إلى أن هلك في طاعون سنة تسع وثلاثين {cite:shadharat-dhahab p. 201}."
  en: "Ishaq b. Dawud b. Sayf Ar'ad, king of Abyssinia — twenty-one years on the throne, died Dhu al-Qa'da 833; his son Andras lasted four months, then his uncle Kharnabay briefly, then a boy who died in the 839 plague {cite:shadharat-dhahab p. 201}."
  es: "Ishaq b. Dawud b. Sayf Ar'ad, rey de Abisinia — veintiún años en el trono, murió en Dhu al-Qa'da 833; su hijo Andras duró cuatro meses, luego su tío Kharnabay brevemente, luego un niño que murió en la plaga de 839 {cita:shadharat-dhahab p. 201}."
  fr: "Ishaq b. Dawud b. Sayf Ar'ad, roi d'Abyssinie — vingt et un ans sur le trône, mourut Dhu al-Qa'da 833; son fils Andras dura quatre mois, puis son oncle Kharnabay brièvement, puis un garçon qui mourut de la peste de 839 {cite:shadharat-dhahab p. 201}."
  ur: "اسحاق بی۔ داؤد بی۔ سیف اعراد، حبشہ کا بادشاہ - اکیس سال تخت پر، ذوالقعدہ 833 میں فوت ہوا۔ اس کا بیٹا اندراس چار مہینے تک رہا، پھر اس کے چچا خرنابے مختصر طور پر، پھر ایک لڑکا جو 839 کے طاعون میں مر گیا 201}۔"
