summary:
  ar: "إمام أمريكي في مسجد غرين لين في برمنغهام بإنجلترا. وُلد في نيوجيرسي سنة 1964، واعتنق الإسلام سنة 1986، ودرس ثماني سنوات في الجامعة الإسلامية بالمدينة المنورة وتخرج في كلية الدعوة وأصول الدين، وتولى الإمامة في مدن أمريكية عدة ثم في بريطانيا. اشتهر عالميًا بعد برنامج «المسجد المتخفي» على القناة الرابعة سنة 2007. لا تنشر المصادر الموثوقة اسمًا مدنيًا له؛ فهو موثّق في كل مكان بهذا الاسم."
  en: "An American imam at Green Lane Masjid in Birmingham, England. Born in New Jersey in 1964, he embraced Islam in 1986 and studied for eight years at the Islamic University of Madinah, graduating from its College of Da'wah and Usul al-Din; he held imam posts in several American cities before posts in Britain. He became internationally known after Channel 4's 2007 'Undercover Mosque' programme. No trusted source publishes a civil name for him; he is documented everywhere under this name."
  fr: "Imam américain de Green Lane Masjid à Birmingham, en Angleterre. Né dans le New Jersey en 1964, il embrassa l'islam en 1986 et étudia huit ans à l'Université islamique de Médine, obtenant le diplôme de la faculté de Da'wa et des fondements de la religion ; il fut imam dans plusieurs villes américaines avant des postes en Grande-Bretagne. Il acquit une notoriété internationale après Undercover Mosque, programme de Channel 4 de 2007. Aucune source fiable ne publie son nom civil ; il est partout documenté sous ce nom."
  ur: "برمنگھم، انگلستان کی گرین لین مسجد کے امریکی امام۔ 1964 میں نیوجرسی میں پیدا ہوئے، 1986 میں اسلام قبول کیا، اور جامعہ اسلامیہ مدینہ منورہ میں آٹھ سال تعلیم حاصل کرکے کلیۃ الدعوہ و اصول الدین سے فارغ التحصیل ہوئے؛ امریکہ کے کئی شہروں کے بعد برطانیہ میں امام رہے۔ 2007 میں چینل 4 کے پروگرام «انڈرکور مسجد» کے بعد عالمی شہرت ملی۔ معتبر ذرائع ان کا کوئی مدنی نام شائع نہیں کرتے؛ ہر جگہ وہ اسی نام سے موثق ہیں۔"
  es: "Imán estadounidense de la mezquita Green Lane en Birmingham, Inglaterra. Nacido en Nueva Jersey en 1964, se convirtió al islam en 1986 y estudió durante ocho años en la Universidad Islámica de Medina, donde se graduó en la Facultad de Da'wah y Usul al-Din. Ocupó cargos de imán en varias ciudades estadounidenses antes de establecerse en Gran Bretaña. Alcanzó fama internacional tras el programa \"Undercover Mosque\" de Channel 4 en 2007. Ninguna fuente fiable publica su nombre civil; aparece documentado en todas partes con este nombre."
  tr: "İngiltere'nin Birmingham şehrindeki Green Lane Camii'nde görev yapan Amerikalı bir imam. 1964 yılında New Jersey'de doğdu ve 1986'da İslamiyet'i kabul etti. Medine İslam Üniversitesi'nde sekiz yıl eğitim gördü ve Davet ve Din Temelleri Fakültesi'nden mezun oldu. Birçok Amerikan şehrinde ve daha sonra İngiltere'de imamlık yaptı. 2007 yılında Channel 4'te yayınlanan \"Gizli Cami\" programına katıldıktan sonra uluslararası tanınırlık kazandı. Güvenilir kaynaklarda gerçek adı belirtilmemektedir; her yerde bu isimle anılmaktadır."
  id: "Seorang imam Amerika di Masjid Green Lane di Birmingham, Inggris. Lahir di New Jersey pada tahun 1964, ia masuk Islam pada tahun 1986. Ia belajar selama delapan tahun di Universitas Islam Madinah, lulus dari Fakultas Dakwah dan Dasar-Dasar Agama. Ia bertugas sebagai imam di beberapa kota di Amerika dan kemudian di Inggris. Ia mendapatkan pengakuan internasional setelah tampil di program Channel 4 \"The Hidden Mosque\" pada tahun 2007. Sumber yang dapat dipercaya tidak mencantumkan nama aslinya; ia tercatat di mana-mana dengan nama ini."
