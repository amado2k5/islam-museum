summary:
  ar: "إمام أمريكي في مسجد غرين لين في برمنغهام بإنجلترا. وُلد في نيوجيرسي سنة 1964، واعتنق الإسلام سنة 1986، ودرس ثماني سنوات في الجامعة الإسلامية بالمدينة المنورة وتخرج في كلية الدعوة وأصول الدين، وتولى الإمامة في مدن أمريكية عدة ثم في بريطانيا. اشتهر عالميًا بعد برنامج «المسجد المتخفي» على القناة الرابعة سنة 2007. لا تنشر المصادر الموثوقة اسمًا مدنيًا له؛ فهو موثّق في كل مكان بهذا الاسم."
  en: "An American imam at Green Lane Masjid in Birmingham, England. Born in New Jersey in 1964, he embraced Islam in 1986 and studied for eight years at the Islamic University of Madinah, graduating from its College of Da'wah and Usul al-Din; he held imam posts in several American cities before posts in Britain. He became internationally known after Channel 4's 2007 'Undercover Mosque' programme. No trusted source publishes a civil name for him; he is documented everywhere under this name."
  ur: "برمنگھم، انگلستان کی گرین لین مسجد کے امریکی امام۔ 1964 میں نیوجرسی میں پیدا ہوئے، 1986 میں اسلام قبول کیا، اور جامعہ اسلامیہ مدینہ منورہ میں آٹھ سال تعلیم حاصل کرکے کلیۃ الدعوہ و اصول الدین سے فارغ التحصیل ہوئے؛ امریکہ کے کئی شہروں کے بعد برطانیہ میں امام رہے۔ 2007 میں چینل 4 کے پروگرام «انڈرکور مسجد» کے بعد عالمی شہرت ملی۔ معتبر ذرائع ان کا کوئی مدنی نام شائع نہیں کرتے؛ ہر جگہ وہ اسی نام سے موثق ہیں۔"
