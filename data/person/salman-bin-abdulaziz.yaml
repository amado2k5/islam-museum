summary:
  ar: "سابع ملوك المملكة العربية السعودية والحاكم منذ 23 يناير 2015، ابن الملك عبد العزيز وحصة بنت أحمد السديري وأحد «السديريين السبعة»؛ أمير منطقة الرياض نحو 48 عامًا (1963–2011) ثم وزير الدفاع وولي العهد من 2012 حتى خلافة أخيه عبد الله؛ ووالد ولي العهد محمد بن سلمان."
  en: "Seventh King of Saudi Arabia, reigning since 23 January 2015; a son of King Abdulaziz and Hassa bint Ahmed Al Sudairi and one of the Sudairi Seven. He was governor of Riyadh for some 48 years (1963–2011), then Minister of Defense and Crown Prince from 2012 until he succeeded his half-brother Abdullah. He is the father of Crown Prince Mohammed bin Salman."
  ur: "سعودی عرب کے ساتویں بادشاہ، 23 جنوری 2015ء سے بر سر اقتدار؛ شاہ عبد العزیز اور حصہ بنت احمد السدیری کے صاحبزادے اور «سدیری سبعہ» میں سے ایک؛ تقریباً 48 برس (1963ء–2011ء) ریاض کے گورنر رہے، پھر 2012ء سے وزیر دفاع اور ولی عہد، اور اپنے سوتیلے بھائی عبداللہ کے جانشین بنے؛ ولی عہد محمد بن سلمان کے والد ہیں۔"
