id: person/yazdegerd-iii
class: person
label: { ar: "يزدجرد بن شهريار" }
summary:
  ar: "آخر ملوك الساسانيين. لما اشتد الأمر على الفرس بحث رستم والفيرزان عن أبناء كسرى، فقيل إنه بقي غلام يُدعى يزدجرد من ولد شهريار بن كسرى، وأمه من أهل بادوريا فأخذوها به {cite:tabari-tarikh-abu-al-fadl j.3 p.477}. هرب إلى خراسان في سنة ثلاثين {cite:tabari-tarikh-abu-al-fadl j.4 p.286}، وذكر الفهرس مقتله في سنة 31هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.581} وعند البلاذري هرب من المدائن إلى حلوان فأصبهان فإصطخر فكرمان فسجستان فخراسان فأهان مرزبان كرمان وأحفظ خطبة نيزك طرخان فتضافر عليه مع ماهويه مرزبان مرو فقتل ببيت طحان على الرغاب خنقاً بوتر فيما يروى وألقي في الماء."
  tr: "Sasanilerin son kralı. Persler için durum kötüleşince, Rustam ve Al-Furzan Khosrow'un oğullarını aramaya başladılar. Shahryar ibn Khosrow'un soyundan Yazdegerd adında bir çocuğun kaldığı ve annesinin Paduria'dan olduğu söylenirdi; bu yüzden onu da yanında götürdüler {cite:tabari-tarikh-abu-al-fadl j.3 s.477}. 30 yılında Horasan'a kaçtı {cite:tabari-tarikh-abu-al-fadl j.4 s.286} ve indeks 31 Hicri'de öldüğünü belirtir {cite:tabari-tarikh-abu-al-fadl j.4 s.581}. Al-Baladhuri'ye göre, Al-Madain'den Helwan'a kaçtı, burada Fakraman'a, ardından Sajistan'a asfaltlandı; burada Kirman Marzbanı'na hakaret etti, Nizak Tarhan'ın vaazını ezberledi ve Marw Marzbanı ile güçlerini birleştirdi; burada Beit Tahan on Al-Raghab'da öldürüldü, boğularak öldürüldü ve suya atıldı."
  id: "Raja terakhir Sassanid. Ketika situasi menjadi berat bagi orang Persia, Rustam dan Al-Furzan mencari putra-putra Khosrow. Dikatakan bahwa seorang anak laki-laki bernama Yazdegerd berasal dari keturunan Shahryar ibn Khosrow, dan ibunya berasal dari Paduria, sehingga mereka membawanya bersamanya {cite:tabari-tarikh-abu-al-fadl j.3 hlm.477}. Ia melarikan diri ke Khorasan pada tahun 30 {cite:tabari-tarikh-abu-al-fadl j.4 hlm.286}, dan indeks tersebut menyebutkan kematiannya pada tahun 31 H {cite:tabari-tarikh-abu-al-fadl j.4 hlm.581}. Menurut al-Baladhuri, ia melarikan diri dari Al-Madain ke Helwan, di mana ia kemudian diaspal ke Fakraman, kemudian Sajistan, Khorasan, di mana ia menghina Marzban Kerman dan menghafal khotbah Nizak Tarkhan serta bergabung dengan Marzban Marw, di mana ia dibunuh di Beit Tahan di Al-Raghab, dicekik dan dicekik menurut laporan, lalu dilempar ke air."
