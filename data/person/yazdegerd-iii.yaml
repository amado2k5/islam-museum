id: person/yazdegerd-iii
class: person
label: { ar: "يزدجرد بن شهريار" }
summary:
  ar: "آخر ملوك الساسانيين. لما اشتد الأمر على الفرس بحث رستم والفيرزان عن أبناء كسرى، فقيل إنه بقي غلام يُدعى يزدجرد من ولد شهريار بن كسرى، وأمه من أهل بادوريا فأخذوها به {cite:tabari-tarikh-abu-al-fadl j.3 p.477}. هرب إلى خراسان في سنة ثلاثين {cite:tabari-tarikh-abu-al-fadl j.4 p.286}، وذكر الفهرس مقتله في سنة 31هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.581} وعند البلاذري هرب من المدائن إلى حلوان فأصبهان فإصطخر فكرمان فسجستان فخراسان فأهان مرزبان كرمان وأحفظ خطبة نيزك طرخان فتضافر عليه مع ماهويه مرزبان مرو فقتل ببيت طحان على الرغاب خنقاً بوتر فيما يروى وألقي في الماء."
