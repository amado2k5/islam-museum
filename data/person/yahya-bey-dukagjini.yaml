summary:
  ar: "شاعر ديوان عثماني وجندي إنكشاري من أصل ألباني (ت. 1582)، من أسرة دوكاجين النبيلة، جُلب صغيرًا بالدوشيرمه فتعلّم في إسطنبول وبرز جنديًا وشاعرًا، وشارك في معارك جالديران وبغداد وسيكتوار. ألّف خمسة مثنويات أشهرها «يوسف وزليخا» و«شاه وكدا»، ورثى الشاهزاده مصطفى بمرثية اتهم فيها رستم باشا فُنفي إلى البلقان وقضى بقية عمره هناك. عدّه غيب أعظم شاعر تركي بين غير الأتراك، ويُروى أن شعر دينه الصافي «كل صدبرك» في معجزات النبي كتبه في شيخوخته."
  en: "Albanian-born Ottoman diwan poet and janissary soldier (d. 1582), of the noble Dukagjini family, taken as a boy by the devşirme and educated at Istanbul, who campaigned at Chaldiran, Baghdad and Szigetvár. He wrote a diwan and a khamsa of five mesnevis — Yusuf ve Züleyha and Şah u Geda the most famous — and his elegy for the executed Şehzade Mustafa, which blamed Rüstem Pasha, sent him into Balkan exile for the rest of his life. Gibb ranked him the foremost writer of Turkish poetry among non-Turks; his Gül-i Şadberk, a poem on the miracles of the Prophet in a purely religious tone, is said to be a work of his old age."
  ur: "البانوی نژاد عثمانی دیوان شاعر اور ینکیچری سپاہی (وفات 1582ء)، دوکاجینی کے امیر خاندان سے، بچپن میں دیوشیرمہ کے ذریعے لائے گئے اور استنبول میں تعلیم پائی، چالديران، بغداد اور سیگتوار کی مہموں میں شریک ہوئے۔ انھوں نے ایک دیوان اور پانچ مثنویوں کا خمسہ لکھا، جن میں یوسف و زلیخا اور شاہ و گدا سب سے مشہور ہیں، اور شاہزادہ مصطفیٰ کے مقتل پر ان کی مرثیہ نے، جس میں رستم پاشا کو موردِ الزام ٹھہرایا گیا تھا، انھیں بلقان کی جلاوطنی میں بھیج دیا جہاں انھوں نے بقیہ عمر گزاری۔"

