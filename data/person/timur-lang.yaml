id: person/timur-lang
class: person
label: { ar: "تمرلنك" }
summary:
  ar: "قائد تركي مغولي، كان ابتداء خروجه سنة ثلاث وسبعين وسبع مئة وأخرب البلاد وأباد العباد واستمر يعثو في الأرض بالفساد إلى أن هلك في ليلة الأربعاء سابع عشر شعبان سنة سبع وثمان مئة وكان أصله من أبناء الفلاحين ونشأ يسرق ويقطع الطريق ثم انضم إلى خدمة صاحب خيل السلطان ثم قرر مكانه بعد موته وما زال يترقى إلى أن وصل إلى ما وصل، وفيه قيل فعل التتار ولو رأوا فعال تمرلنك إذاً كان أعظما {cite:tarikh-khulafa-minhaj-1434 p. 758}. وفي شذرات الذهب سنة إحدى وثمانمائة غزا اللنك بلاد الهند واستولى على دلهي وسبى منها خلقاً كثيراً ولما رجع إلى سمرقند بيع السبي الهندي برخص عظيم لكثرته وكان حينئذ صاحب البلاد الشرقية تيمور كوركان المعروف باللنك {cite:shadharat-dhahab p. 3}. وفي شذرات الذهب نازل خوارزم فاتفق وفاة أميرها حسن المغلي واستقر أخوه يوسف فانتزعها اللنك ولم يزل إلى أن انتظم له ملك ما وراء النهر ثم سار إلى سمرقند فتملكها ثم زحف إلى خراسان فملكها ثم ملك هراة ثم ملك طبرستان وجرجان بعد حروب طويلة سنة أربع وثمانين ثم تبريز وأذربيجان ثم أصبهان سنة أربع وثمانين ثم فارس وفيها أعيان بني المظفر ثم رجع إلى بغداد سنة خمس وتسعين فنازلها إلى أن غلب عليها فهرب أحمد بن أويس صاحبها إلى الشام ثم نازل طوطمش خان صاحب سراي إلى أن غلبه على ملكه في سنة سبع وتسعين فهرب إلى بلغار وانضم عسكر المغل إلى اللنك ثم رجع إلى بغداد فنازلها إلى أن ملكها وهرب أحمد ثانياً ثم سيواس وحلب ودمشق {cite:shadharat-dhahab p. 71-72}."
  en: "The conqueror whose rise began in 773 — of peasant stock, a thief and road-cutter who rose through the sultan's horse-master — he 'ruined the lands and destroyed the people' till his death on Wednesday 17 Sha'ban 807 {cite:tarikh-khulafa-minhaj-1434 p. 758}."
  es: "El conquistador cuyo ascenso comenzó en 773 —de origen campesino, ladrón y saboteador de caminos que ascendió gracias al maestro de caballos del sultán— «arruinó las tierras y destruyó a la gente» hasta su muerte el miércoles 17 de Sha'ban de 807 {cite:tarikh-khulafa-minhaj-1434 p. 758}."
  fr: "Le conquérant dont l'ascension a commencé en 773 — issu d'une famille paysanne, voleur et coupeur de routes qui s'est élevé grâce au maître des chevaux du sultan — il « a ruiné les terres et détruit le peuple » jusqu'à sa mort le mercredi 17 Sha'ban 807 {cite:tarikh-khulafa-minhaj-1434 p. 758}."
  ur: "وہ فاتح جس کا عروج 773ء میں شروع ہوا — کسانوں کے ذخیرے سے، ایک چور اور سڑک کاٹنے والا جو سلطان کے گھوڑے کے مالک سے گزرا — اس نے بدھ 17 شعبان 807 کو اپنی موت تک 'زمینوں کو برباد کیا اور لوگوں کو تباہ کیا'۔ 758}۔"
  tr: "773 Hicri yılında ayrılmaya başlayan, ülkeyi harap eden, halkı yok eden ve 870 H.Y. yılının Şaban ayının on yedinci Çarşamba gecesi ölene kadar ölen Türk-Moğol bir komutandı. Aslen köylü ailesinden geliyordu. Büyürken hırsızlık yaparak ve yolları kapatır, sonra Sultan'ın süvarisinin hizmetine katılır, ölümünden sonra yerine yerleşir ve ulaştığı noktaya kadar yükselmeye devam eder. Tatarların bunu yaptığına inanılır, Tamerlank'ın hareketini görseler bile, eğer daha büyük olsaydı {cite:Tarikh-khulafa-minhaj-1434, s. 758}. 801 Hicri yılında Şadharat el-Dhahab'da Lincoln Hindistan'ı işgal etti, Delhi'yi ele geçirdi ve birçok kişiyi esir aldı. Semerkand'a döndüğünde, Hint esirleri bollukları nedeniyle yüksek fiyatlara satıldı. O dönemde doğu topraklarının hükümdarı Timur Kurkan'dı, Link olarak bilinir {cite:shadharat-dhahab, s. 3}. Şadharat al-Dhahab'da Harezm soyundan geldi ve prensi Hasan el-Mughli öldü, kardeşi Yusuf yerleşti. Bağlantı burayı ele geçirdi ve Transoksiana kralı olana kadar böyle kaldı. Daha sonra Semerkand'a yürüdü ve şehri ele geçirdi, ardından Horasan'a yürüyüp yönetti, ardından Herat'ı yönetti, ardından 1984'te uzun savaşların ardından Tabaristan ve Gorgan'ı, ardından Tebriz ve Azerbaycan'ı, ardından 1984'te İsfahan'ı, ardından Fars'ı (burada ünlü Banu el-Muzaffar hayatta kaldı), ardından 1995'te Bağdat'a döndü ve ardından Bağdat'ı ele geçirdi, ta ki onu yenene kadar. Hükümdarı Ahmed ibn Uways, ardından Saray hükümdarı Tutmiş Han Levant'a kaçtı, ardından 1997'de onu yenip Bulgaristan'a kaçtı ve Babür ordusu Link'e katıldı. Daha sonra Bağdat'a döndü ve Ahmad tekrar kaçana kadar şehri ele geçirdi, ardından Sivas, Halep ve Şam'a {cite:] Shadharat-dhahab, s. 71-72}."
  id: "Ia adalah seorang komandan Turki-Mongol yang memulai kepergiannya pada tahun 773 H, menghancurkan negara, memusnahkan rakyat, dan terus menyebarkan korupsi di bumi hingga ia meninggal pada malam Rabu, tanggal tujuh belas Sha'ban tahun 870 H. Ia berasal dari keluarga petani. Ia tumbuh dengan pencuri dan memblokir jalan, lalu bergabung dengan pelayanan penunggang kuda Sultan, kemudian menetap di tempatnya setelah kematiannya dan terus naik pangkat hingga mencapai apa yang telah dicapainya. Dikatakan bahwa Tatar melakukannya, meskipun mereka melihat aksi Tamerlank, jika itu lebih besar {cite:Tarikh-khulafa-minhaj-1434, hlm. 758}. Di Shadharat al-Dhahab pada tahun 801 H, Lincoln menyerbu India, merebut Delhi, dan menangkap banyak orang. Ketika ia kembali ke Samarkand, tawanan India dijual dengan harga tinggi karena kelimpahannya. Pada waktu itu, penguasa tanah timur adalah Timur Kurkan, yang dikenal sebagai Link {cite:shadharat-dhahab, hlm. 3}. Di Shadharat al-Dhahab, Khwarezm turun, dan pangerannya Hassan al-Mughli meninggal dan saudaranya Yusuf menetap. Link merebutnya dan tetap demikian hingga ia menjadi raja Transoxiana. Ia kemudian berbaris ke Samarkand dan mengambil alih wilayah itu, kemudian berbaris ke Khorasan dan memerintahnya, lalu memerintah Herat, kemudian memerintah Tabaristan dan Gorgan setelah perang panjang pada tahun 1984, kemudian Tabriz dan Azerbaijan, kemudian Isfahan pada tahun 1984, kemudian Fars (tempat Banu al-Muzaffar yang terkenal tinggal), kemudian kembali ke Baghdad pada tahun 1995 dan kemudian merebutnya hingga ia berhasil menaklukkannya. Ahmad ibn Uways, penguasanya, melarikan diri ke Levant, lalu Tutmish Khan, penguasa Saray, hingga ia mengalahkannya pada tahun 1997, melarikan diri ke Bulgaria, dan tentara Mughal bergabung dengan Link. Ia kemudian kembali ke Baghdad dan merebutnya hingga Ahmad melarikan diri lagi, lalu ke Sivas, Aleppo, dan Damaskus {cite:Shadharat-dhahab, hlm. 71-72}."
