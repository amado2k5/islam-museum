label: { ar: "تمرلنك" }
summary:
  ar: "قائد تركي مغولي، كان ابتداء خروجه سنة ثلاث وسبعين وسبع مئة وأخرب البلاد وأباد العباد واستمر يعثو في الأرض بالفساد إلى أن هلك في ليلة الأربعاء سابع عشر شعبان سنة سبع وثمان مئة وكان أصله من أبناء الفلاحين ونشأ يسرق ويقطع الطريق ثم انضم إلى خدمة صاحب خيل السلطان ثم قرر مكانه بعد موته وما زال يترقى إلى أن وصل إلى ما وصل، وفيه قيل فعل التتار ولو رأوا فعال تمرلنك إذاً كان أعظما {cite:tarikh-khulafa-minhaj-1434 p. 758}."
  en: "The conqueror whose rise began in 773 — of peasant stock, a thief and road-cutter who rose through the sultan's horse-master — he 'ruined the lands and destroyed the people' till his death on Wednesday 17 Sha'ban 807 {cite:tarikh-khulafa-minhaj-1434 p. 758}."
