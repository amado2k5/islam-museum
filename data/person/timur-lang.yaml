label: { ar: "تمرلنك" }
summary:
  ar: "قائد تركي مغولي، كان ابتداء خروجه سنة ثلاث وسبعين وسبع مئة وأخرب البلاد وأباد العباد واستمر يعثو في الأرض بالفساد إلى أن هلك في ليلة الأربعاء سابع عشر شعبان سنة سبع وثمان مئة وكان أصله من أبناء الفلاحين ونشأ يسرق ويقطع الطريق ثم انضم إلى خدمة صاحب خيل السلطان ثم قرر مكانه بعد موته وما زال يترقى إلى أن وصل إلى ما وصل، وفيه قيل فعل التتار ولو رأوا فعال تمرلنك إذاً كان أعظما {cite:tarikh-khulafa-minhaj-1434 p. 758}. وفي شذرات الذهب سنة إحدى وثمانمائة غزا اللنك بلاد الهند واستولى على دلهي وسبى منها خلقاً كثيراً ولما رجع إلى سمرقند بيع السبي الهندي برخص عظيم لكثرته وكان حينئذ صاحب البلاد الشرقية تيمور كوركان المعروف باللنك {cite:shadharat-dhahab p. 3}. وفي شذرات الذهب نازل خوارزم فاتفق وفاة أميرها حسن المغلي واستقر أخوه يوسف فانتزعها اللنك ولم يزل إلى أن انتظم له ملك ما وراء النهر ثم سار إلى سمرقند فتملكها ثم زحف إلى خراسان فملكها ثم ملك هراة ثم ملك طبرستان وجرجان بعد حروب طويلة سنة أربع وثمانين ثم تبريز وأذربيجان ثم أصبهان سنة أربع وثمانين ثم فارس وفيها أعيان بني المظفر ثم رجع إلى بغداد سنة خمس وتسعين فنازلها إلى أن غلب عليها فهرب أحمد بن أويس صاحبها إلى الشام ثم نازل طوطمش خان صاحب سراي إلى أن غلبه على ملكه في سنة سبع وتسعين فهرب إلى بلغار وانضم عسكر المغل إلى اللنك ثم رجع إلى بغداد فنازلها إلى أن ملكها وهرب أحمد ثانياً ثم سيواس وحلب ودمشق {cite:shadharat-dhahab p. 71-72}."
  en: "The conqueror whose rise began in 773 — of peasant stock, a thief and road-cutter who rose through the sultan's horse-master — he 'ruined the lands and destroyed the people' till his death on Wednesday 17 Sha'ban 807 {cite:tarikh-khulafa-minhaj-1434 p. 758}."
