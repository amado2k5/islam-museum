summary:
  ar: "عالم وقاضٍ سعودي، إمام وخطيب المسجد النبوي بالمدينة المنورة. من نسل محمد بن عبد الوهاب، درس الشريعة بالرياض ونال الماجستير والدكتوراه من المعهد العالي للقضاء، وتولى القضاء في نجران والرياض والمدينة، وعُيّن إماماً وخطيباً للمسجد النبوي بأمر سامٍ، وكان الخطيب التاسع لعرفة في العهد السعودي."
  en: "Saudi scholar and judge, imam and khatib of the Prophet's Mosque in Medina. A descendant of Muhammad ibn Abd al-Wahhab, he studied Sharia in Riyadh, took a master's and a doctorate at the Higher Institute of Judiciary, served as a judge in Najran, Riyadh and Medina, and was appointed imam and khatib of the Prophet's Mosque by royal decree; he was the ninth preacher of Arafat in the Saudi era."
  ur: "سعودی عالم اور قاضی، مدینہ منورہ میں مسجد نبوی کے امام و خطیب۔ وہ محمد بن عبد الوہاب کی نسل سے ہیں، ریاض میں شریعت کی تعلیم حاصل کی، المعہد العالی للقضاء سے ماسٹرز اور ڈاکٹریٹ کیا، نجران، ریاض اور مدینہ میں قاضی رہے، اور شاہی فرمان سے مسجد نبوی کے امام و خطیب مقرر ہوئے؛ وہ سعودی دور کے نویں خطیبِ عرفات شمار ہوتے ہیں۔"
