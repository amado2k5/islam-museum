summary:
  ar: "المستأنس بالحق، المستوحش من الخلق، لقب لشخص اسمه خفيّ في النص. روى عبيد البصري أنه سأله رجل عمّا أجلسه في ذلك الموضع، فأجاب بأن علمه بأن مجالسة الله تستغرق نعيم الجنان، وأنه ظن نفسه قد ظفرت فهرب من الخلق فإذا هو كذاب في مقامه، ثم مات، وصلّى عليه قوم قالوا إنهم السبعة الخصوصون من الأبدال."
  en: "al-Mustanis bil-Haqq al-Mustawhish min al-Khalq, a laqab for a man whose name is hidden in the text; Ubayd al-Basri relates that when asked what made him sit in that place, he said that his knowledge that sitting with God absorbs the bliss of Paradise was his reason; he had thought his soul had triumphed and fled from creation, and found himself a liar in his station; he died, and a group who prayed over him said they were the seven distinguished substitutes."
  ur: "مستانس بالحق مستوحش من الخلق، ایک ایسے شخص کا لقب جس کا نام متن میں پوشیدہ ہے۔ عبید بصری نقل کرتے ہیں کہ ایک شخص نے ان سے پوچھا کہ تمہیں اس جگہ کس چیز نے بٹھایا؛ انہوں نے کہا: میرا علم کہ اللہ کی مجالست جنت کی نعمتوں کو بھی ڈھانپ لیتی ہے۔ انہوں نے سمجھا کہ ان کا نفس کامیاب ہو گیا ہے تو وہ مخلوق سے بھاگے، پھر پایا کہ اپنے مقام میں جھوٹے ہیں؛ پھر ان کا انتقال ہوا اور جن لوگوں نے ان کی نماز پڑھی انہوں نے کہا کہ وہ سات خصوصی ابدال میں سے ہیں۔"
