summary:
  ar: "مدرك بن المهلب؛ ولاه أخوه يزيد بن المهلب سجستان لما ولي العراق لسليمان بن عبد الملك فلم يعطه رتبيل شيئاً."
  en: "Mudrik ibn al-Muhallab; his brother Yazid, given Iraq by Sulayman ibn Abd al-Malik, made him governor of Sijistan — and Rutbil gave him nothing."
  es: "Mudrik ibn al-Muhallab; su hermano Yazid, a quien Sulayman ibn Abd al-Malik le había dado Irak, lo nombró gobernador de Sijistan, y Rutbil no le dio nada."
  fr: "Mudrik ibn al-Muhallab; son frère Yazid, à qui Sulayman ibn Abd al-Malik avait donné l'Irak, le nomma gouverneur du Sijistan — et Rutbil ne lui donna rien."
  ur: "مدرک ابن المحلب؛ اس کے بھائی یزید نے، جسے سلیمان بن عبد الملک نے عراق دیا، اسے سجستان کا گورنر بنایا - اور رتبیل نے اسے کچھ نہیں دیا۔"
  tr: "Mudrak bin el-Muhallab; kardeşi Yezid bin el-Muhallab, Süleyman bin Abdülmelik için Irak'ı devraldığında onu Sijistan valisi olarak atadı, bu yüzden Ratbil ona hiçbir şey vermedi."
  id: "Mudrak ibn al-Muhallab; saudaranya Yazid ibn al-Muhallab mengangkatnya sebagai gubernur Sijistan ketika ia mengambil alih Irak untuk Sulayman ibn Abd al-Malik, sehingga Ratbil tidak memberinya apa pun."
