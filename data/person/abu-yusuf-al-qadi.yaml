label: { ar: "أبو يوسف القاضي", en: "Abu Yusuf Al Qadi", fr: "Abu Yusuf Al Qadi", es: "Abu Yusuf Al Qadi", ur: "ابو یوسف القادی" }
summary:
  ar: "أبو يوسف يعقوب بن إبراهيم الأنصاري صاحب أبي حنيفة وأكبر ناقلي مذهبه، ولى القضاء للرشيد، وله من الكتب في الأصول والأمالي كتاب الصلاة وكتاب الزكاة وكتاب الصيام وكتاب الفرائض وكتاب البيوع وكتاب الحدود وكتاب الوكالة وكتاب الوصايا وكتاب الصيد والذبائح وكتاب الغصب والاستبراء، وله أمالي رواها بشر بن الوليد القاضي يحتوي على ستة وثلاثين كتابا مما فرعه أبو يوسف كتاب اختلاف الأمصار وكتاب الرد على مالك بن أنس وكتاب رسالته في الخراج إلى الرشيد وكتاب الجوامع ألفه ليحيى بن خالد يحتوي على أربعين كتابا ذكر فيه اختلاف الناس والرأي المأخوذ به، وابنه أبو إسحاق بن أبي يوسف ولي القضاء في حياة أبيه وتوفي بعده سنة اثنتين وتسعين ومائة {cite:fihrist-ibn-al-nadim p. 286-287}. وفي تاريخ بغداد ⁦(ترجمة 7558)⁩: سمع أبا إسحاق الشيباني وسليمان التيمي ويحيى بن سعيد الأنصاري وسليمان الأعمش، وقال صحبت أبا حنيفة سبع عشرة سنة ثم قد انصبت على الدنيا سبع عشرة سنة، وقال عند موته يا ليتني مت على ما كنت عليه من الفقر وإني لم أدخل في القضاء على أني ما تعمدت بحمد الله جوراً ولا حاديت خصماً على خصم من سلطان ولا سوقة؛ وفيه هدية أم جعفر وردّه قول حديث «من أهديت له هدية فجلساؤه شركاؤه فيها» إلى زمن كانت هدايا الناس فيه الأقط والتمر والزبيب؛ ومات سنة اثنتين وثمانين ومائة {cite:tarikh-baghdad-khatib j.11 p.242-252}."
  en: "Abu Yusuf — the qadi whose corpus the Fihrist enumerates {cite:fihrist-ibn-al-nadim}. Tarikh Baghdad (#7558): seventeen years at Abu Hanifa's side, then seventeen given to the world; on his deathbed 'would that I had died in my former poverty — I never knowingly dealt unjustly in the judgeship'; Umm Ja'far's gift and his gloss that the gift-sharing hadith belonged to an age of cheese and dates; died 182 {cite:tarikh-baghdad-khatib j.11 p.242-252}."
  fr: "Abu Yusuf, cadi dont le Fihrist énumère les œuvres {cite:fihrist-ibn-al-nadim}. Tarikh Baghdad (no 7558) : dix-sept ans auprès d'Abu Hanifa, puis dix-sept consacrés au monde ; sur son lit de mort, il aurait souhaité mourir dans sa pauvreté passée, affirmant n'avoir jamais sciemment commis d'injustice comme juge. Le récit rapporte le don d'Umm Ja'far et son commentaire selon lequel le hadith sur le partage des dons appartenait à une époque de fromage et de dattes ; mort en 182 {cite:tarikh-baghdad-khatib j.11 p.242-252}."
  es: "Abu Yusuf — el cadí cuyo corpus enumera el Fihrist {cite:fihrist-ibn-al-nadim}. Tarikh Baghdad (#7558): diecisiete años al lado de Abu Hanifa, luego diecisiete dedicados al mundo; en su lecho de muerte «ojalá hubiera muerto en mi antigua pobreza; nunca traté injustamente a sabiendas en el ejercicio de la judicatura»; el regalo de Umm Ja'far y su glosa de que el hadiz sobre compartir regalos pertenecía a una época de queso y dátiles; murió en 182 {cite:tarikh-baghdad-khatib j.11 p.242-252}."
  ur: "ابو یوسف - وہ قادی جس کا شمار فہرست نے کیا ہے {حوالہ: فہرست ابن الندیم}۔ تاریخ بغداد (#7558): ابو حنیفہ کے پاس سترہ سال، پھر سترہ سال دنیا کو دیے گئے۔ بستر مرگ پر 'کاش میں اپنی سابقہ غربت میں مر جاتا - میں نے کبھی جان بوجھ کر جج شپ میں ناانصافی نہیں کی'۔ ام جعفر کا ہدیہ اور ان کی چمک کہ تحفہ دینے والی حدیث کا تعلق پنیر اور کھجور کے دور سے ہے۔ وفات 182 {حوالہ:تاریخ بغداد خطیب ج11 ص242-252}۔"
  tr: "Ebu Hanife'nin sahabesi ve onun düşünce ekolünün en büyük rivayetçisi olan Ebu Yusuf Yakub ibn İbrahim el-Ensari, Raşid tarafından kadı olarak atanmıştır. Namaz Kitabı, Zekat Kitabı, Oruç Kitabı, Miras Kitabı, Satış Kitabı, Cezalar Kitabı, Vekalet Kitabı, Vasiyet Kitabı, Av ve Kesim Kitabı ve Gasp ve Hamile Kalma Kitabı gibi ilkeler ve dikteler üzerine kitapları vardır. Ayrıca, Ebu Yusuf'un dallandığı, otuz altı kitaptan oluşan Bişr ibn el-Velid el-Kadı'nın rivayet ettiği dikteleri de vardır: Şehirler Arasındaki Görüş Ayrılıkları Kitabı, Malik ibn Enes'in Reddi Kitabı, Raşid'e Vergi Mektubu ve Yahya ibn Halid için yazdığı, insanların görüş ayrılıklarını ve kabul edilen görüşleri anlattığı kırk kitaptan oluşan Derlemeler Kitabı. Oğlu Ebu İshak ibn Ebu Yusuf, babasının hayatta olduğu dönemde kadı olarak atanmış ve ondan sonra Hicri 192 yılında vefat etmiştir. {Kaynak: Fıhrist ibn el-Nadim, s. 286-287}. Bağdat Tarihi'nde (7558. çeviri): Ebu İshak el-Şeybani, Süleyman el-Taymi, Yahya ibn Said el-Ensari ve Süleyman el-A'maş'ı dinledi. \"Ebu Hanife'ye on yedi yıl eşlik ettim, sonra on yedi yıl kendimi dünyaya adadım\" dedi. Ölümünde şöyle dedi: \"Keşke içinde bulunduğum yoksulluk içinde ölmüş olsaydım ve yargıya girmemiş olsaydım, yine de, Allah'a şükür, kasten haksızlık yapmadım, gerek yönetici gerekse halktan birine karşı muhalif olmadım.\" Bu eserde, Ümmü Cafer'in hediyesi ve \"Kime hediye verilirse, arkadaşları da ona ortak olur\" hadisinin reddi yer almaktadır; ta ki insanların hediyeleri kuru yoğurt, hurma ve kuru üzüm olana kadar. Ümmü Cafer 182 yılında vefat etmiştir. {cite:tarikh-baghdad-khatib j.11 p.242-252}"
  id: "Abu Yusuf Yaqub ibn Ibrahim al-Ansari, sahabat Abu Hanifa dan perawi terbesar mazhabnya, diangkat menjadi hakim oleh al-Rashid. Ia memiliki kitab-kitab tentang prinsip-prinsip dan dikte-dikte hukum, termasuk Kitab Shalat, Kitab Zakat, Kitab Puasa, Kitab Warisan, Kitab Jual Beli, Kitab Hukuman, Kitab Keagenan, Kitab Wasiat, Kitab Perburuan dan Penyembelihan, dan Kitab Perebutan dan Mencari Kehamilan. Ia juga memiliki dikte-dikte yang diriwayatkan oleh Bishr ibn al-Walid al-Qadi, yang berisi tiga puluh enam kitab, dari mana Abu Yusuf mengembangkan kitab-kitab berikut: Kitab Perbedaan Pendapat Antar Kota, Kitab Bantahan Malik ibn Anas, Suratnya tentang Pajak kepada al-Rashid, dan Kitab Ringkasan, yang ia tulis untuk Yahya ibn Khalid, yang berisi empat puluh kitab di mana ia menyebutkan perbedaan pendapat di antara orang-orang dan pendapat yang diadopsi. Putranya, Abu Ishaq ibn Abi Yusuf, diangkat menjadi hakim semasa hidup ayahnya dan meninggal setelahnya pada tahun 192 H. {kutipan:fihrist-ibn-al-nadim hlm. 286-287}. Dalam Sejarah Baghdad (terjemahan 7558): Ia mendengar Abu Ishaq al-Shaybani, Sulayman al-Taymi, Yahya ibn Saeed al-Ansari, dan Sulayman al-A’mash. Ia berkata, “Aku menemani Abu Hanifa selama tujuh belas tahun, kemudian aku mengabdikan diri pada dunia selama tujuh belas tahun.” Ia berkata saat kematiannya, “Aku berharap aku meninggal dalam kemiskinan yang kualami, dan aku tidak memasuki dunia peradilan, meskipun, alhamdulillah, aku tidak sengaja melakukan ketidakadilan, dan aku tidak memihak lawan melawan lawan, baik dari penguasa maupun rakyat biasa.” Di dalamnya terdapat hadiah dari Umm Ja’far dan penolakannya terhadap pernyataan hadits, “Barangsiapa diberi hadiah, maka teman-temannya adalah sekutunya dalam pemberian itu,” hingga suatu masa ketika hadiah orang-orang berupa yogurt kering, kurma, dan kismis. Beliau wafat pada tahun seratus delapan puluh dua. {cite:tarikh-baghdad-khatib j.11 p.242-252}."
