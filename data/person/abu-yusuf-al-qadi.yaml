label: { ar: "أبو يوسف القاضي", en: "Abu Yusuf Al Qadi" }
summary:
  ar: "أبو يوسف يعقوب بن إبراهيم الأنصاري صاحب أبي حنيفة وأكبر ناقلي مذهبه، ولى القضاء للرشيد، وله من الكتب في الأصول والأمالي كتاب الصلاة وكتاب الزكاة وكتاب الصيام وكتاب الفرائض وكتاب البيوع وكتاب الحدود وكتاب الوكالة وكتاب الوصايا وكتاب الصيد والذبائح وكتاب الغصب والاستبراء، وله أمالي رواها بشر بن الوليد القاضي يحتوي على ستة وثلاثين كتابا مما فرعه أبو يوسف كتاب اختلاف الأمصار وكتاب الرد على مالك بن أنس وكتاب رسالته في الخراج إلى الرشيد وكتاب الجوامع ألفه ليحيى بن خالد يحتوي على أربعين كتابا ذكر فيه اختلاف الناس والرأي المأخوذ به، وابنه أبو إسحاق بن أبي يوسف ولي القضاء في حياة أبيه وتوفي بعده سنة اثنتين وتسعين ومائة {cite:fihrist-ibn-al-nadim p. 286-287}. وفي تاريخ بغداد (ترجمة 7558): سمع أبا إسحاق الشيباني وسليمان التيمي ويحيى بن سعيد الأنصاري وسليمان الأعمش، وقال صحبت أبا حنيفة سبع عشرة سنة ثم قد انصبت على الدنيا سبع عشرة سنة، وقال عند موته يا ليتني مت على ما كنت عليه من الفقر وإني لم أدخل في القضاء على أني ما تعمدت بحمد الله جوراً ولا حاديت خصماً على خصم من سلطان ولا سوقة؛ وفيه هدية أم جعفر وردّه قول حديث «من أهديت له هدية فجلساؤه شركاؤه فيها» إلى زمن كانت هدايا الناس فيه الأقط والتمر والزبيب؛ ومات سنة اثنتين وثمانين ومائة {cite:tarikh-baghdad-khatib j.11 p.242-252}."
  en: "Abu Yusuf — the qadi whose corpus the Fihrist enumerates {cite:fihrist-ibn-al-nadim}. Tarikh Baghdad (#7558): seventeen years at Abu Hanifa's side, then seventeen given to the world; on his deathbed 'would that I had died in my former poverty — I never knowingly dealt unjustly in the judgeship'; Umm Ja'far's gift and his gloss that the gift-sharing hadith belonged to an age of cheese and dates; died 182 {cite:tarikh-baghdad-khatib j.11 p.242-252}."
