id: person/al-qasim-ibn-al-qadir
class: person
label: { ar: "أبو القاسم ابن القادر بالله", en: "Abu al-Qasim ibn al-Qadir", fr: "Abu al-Qasim ibn al-Qadir", es: "Abu al-Qasim ibn al-Qadir" }
summary:
  ar: "أبو القاسم ابن الخليفة القادر بالله؛ مات ليلة السبت ليلة بقيت من جمادى الآخرة سنة ٤١٨ فصلّى عليه أخوه أبو جعفر ⁦(القائم بعدُ)⁩ ومشى الناس مع جنازته من رأس الجسر إلى تربة الرصافة، وأعاد الصلاة عليه أبو الحسن بن عيسى بن المقتدر، وسكتت طبول الدولة عشرين يومًا {cite:muntazam-ibn-al-jawzi j.8 p.376}."
  en: "Abu al-Qasim, son of the caliph al-Qadir bi-llah, died on the night of Saturday, with one night of Jumada II 418 remaining. His brother Abu Ja'far (later al-Qa'im) led the prayer over him, and people walked with his bier from the head of the bridge to the cemetery of al-Rusafa; Abu al-Hasan ibn Isa ibn al-Muqtadir led the prayer over him again, and the drums of the state fell silent for twenty days {cite:muntazam-ibn-al-jawzi j.8 p.376}."
  fr: "Abu al-Qasim, fils du calife al-Qadir bi-llah, est mort dans la nuit de samedi, avec une nuit de Jumada II 418 restant. Son frère Abu Ja'far (plus tard al-Qa'im) a conduit la prière sur lui, et les gens marchaient avec sa bière de la tête du pont au cimetière d'al-Rusafa ; Abou al-Hasan ibn Isa ibn al-Muqtadir a conduit la prière sur lui à nouveau, et les tambours de l'État sont restés silencieux pendant vingt jours {cite:muntazam-ibn-al-jawzi j.8 p.376}."
  es: "Abu al-Qasim, hijo del califa al-Qadir bi-llah, murió la noche del sábado, cuando quedaba una noche de Jumada II 418. Su hermano Abu Ja'far (más tarde al-Qa'im) dirigió la oración por él, y la gente acompañó su féretro desde el inicio del puente hasta el cementerio de al-Rusafa; Abu al-Hasan ibn Isa ibn al-Muqtadir dirigió la oración por él nuevamente, y los tambores del estado enmudecieron durante veinte días {cite:muntazam-ibn-al-jawzi j.8 p.376}."
