summary:
  ar: "أبو القاسم ابن الخليفة القادر بالله؛ مات ليلة السبت ليلة بقيت من جمادى الآخرة سنة ٤١٨ فصلّى عليه أخوه أبو جعفر (القائم بعدُ) ومشى الناس مع جنازته من رأس الجسر إلى تربة الرصافة، وأعاد الصلاة عليه أبو الحسن بن عيسى بن المقتدر، وسكتت طبول الدولة عشرين يومًا {cite:muntazam-ibn-al-jawzi j.8 p.376}."
  en: "Abu al-Qasim, son of the caliph al-Qadir bi-llah, died on the night of Saturday, with one night of Jumada II 418 remaining. His brother Abu Ja'far (later al-Qa'im) led the prayer over him, and people walked with his bier from the head of the bridge to the cemetery of al-Rusafa; Abu al-Hasan ibn Isa ibn al-Muqtadir led the prayer over him again, and the drums of the state fell silent for twenty days {cite:muntazam-ibn-al-jawzi j.8 p.376}."
