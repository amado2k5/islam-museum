summary:
  ar: "الملا محمد بن قطب الدين الإزنيقي الحنفي الإمام العالم العامل؛ قرأ العلوم الشرعية والعقلية على الملا الفنري وتمهر وفاق أقرانه ثم سلك مسلك التصوف فجمع بين الشريعة والطريقة والحقيقة وصنف شرحاً لمفتاح الغيب للشيخ صدر الدين القونوي وهو في غاية الحسن وشرح أيضاً فصوص الصدر القونوي، توفي سنة ست وثمانين وثمانمائة {cite:shadharat-dhahab p. 343}."
  en: "Al-Izniki — al-Fanari's pupil who 'joined shari'a, tariqa and haqiqa'; author of a fine sharh of Sadr al-Din al-Qunawi's Miftah al-Ghayb and of his Fusus; died 886 {cite:shadharat-dhahab p. 343}."
  es: "al-Izniki, alumno de al-Fanari que \"se unió a la shari'a, la tariqa y la haqiqa\"; autor de un excelente sharh de Miftah al-Ghayb de Sadr al-Din al-Qunawi y de su Fusus; murió en 886 {citado: shadharat-dhahab p. 343}."
  fr: "al-Izniki — l'élève d'al-Fanari qui « a adhéré à la charia, à la tariqa et à la haqiqa »; auteur d'un beau texte du Miftah al-Ghayb de Sadr al-Din al-Qunawi et de son Fusus; décédé en 886 {cité: shadharat-dhahab p. 343}."
  ur: "العزنیکی - الفناری کا شاگرد جس نے 'شریعت، طریقہ اور حقہ میں شمولیت اختیار کی'؛ صدرالدین القنوی کی مفتاح الغیب اور اس کے فسوس کی عمدہ شرح کے مصنف؛ متوفی 886 {حوالہ: شدارت ذہاب صفحہ 343}۔"
  tr: "Mulla Muhammed bin Kutbeddin el-İzniqi el-Hanefi, imam, alim ve uygulayıcı; Müllğel-Fanari yanında din ve akıl bilimlerini okudu ve akranlarıyla aynı seviyede ustalaştı. Daha sonra şeriat, tasavvuf ve gerçekliği birleştirerek tasavvuf yolunu izledi. Şeyh Sadr al-Din el-Kunavi'nin Miftah el-Ghayb üzerine en büyük iyilik dolu bir tefsir yazdı ve Fusus al-Sadr al-Qunawi'yi de açıkladı. 886 Hicri yılında vefat etti {atıf:şadharat-dhahab, s. 343}."
  id: "Mulla Muhammad ibn Qutb al-Din al-Izniqi al-Hanafi, imam, cendekiawan, dan praktisi; ia mempelajari ilmu agama dan rasional di bawah bimbingan Mulla al-Fanari dan menguasai tingkat yang sama dengan teman-temannya. Ia kemudian mengikuti jalan Sufisme, menggabungkan Syariah, Sufisme, dan realitas. Ia menulis komentar tentang Miftah al-Ghayb oleh Sheikh Sadr al-Din al-Qunawi, yang sangat mulia, dan juga menjelaskan Fusus al-Sadr al-Qunawi. Ia wafat pada tahun 886 H {cite:shadharat-dhahab, hlm. 343}."
