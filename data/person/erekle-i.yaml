summary:
  ar: "إركلي الأول (1642–1709)، المعروف باسمه المسلم نظر علي خان وباسم نيكولاس دافيدوفيتش في البلاط الروسي، أمير باغراتيوني نشأ في موسكو وقبل الإسلام ثمنًا لدعم الشاه الصفوي، فحكم ملكًا على كارتلي (1688–1703) ثم على كاخيتي (1703–1709) تحت الحماية الصفوية. أمضى أربعة عشر عامًا في بلاط الشاه في إصفهان قبل تنصيبه، وخاض حربًا أهلية طويلة ضد جورج الحادي عشر المخلوع، ونظّم إدارة مدينة تبليسي ونقابات حرفييها، وتوفي في إصفهان سنة 1709 تاركًا كاخيتي لابنه داود الثاني (إمام قلي خان)."
  en: "Erekle I (1642-1709), known by his Muslim name Nazar Ali Khan and at the Russian court as Tsarevich Nicholas Davidovich, was a Bagrationi prince raised in Moscow who accepted Islam as the price of Safavid support and reigned as king of Kartli (1688-1703) and then of Kakheti (1703-1709) under Safavid protection. He spent fourteen years at the shah's court in Isfahan before his installation, fought a long civil war against the deposed George XI, ordered Tbilisi's city administration and craft guilds, and died at Isfahan in 1709, leaving Kakheti to his son David II (Imam Quli Khan)."
  ur: "ایرکلے اول (1642ء–1709ء)، جو اپنے مسلم نام نظر علی خان اور روسی دربار میں زارزادہ نکولس ڈیوڈووچ کے نام سے معروف تھے، ایک باگراتیونی شہزادے تھے جو ماسکو میں پروان چڑھے؛ انھوں نے صفوی حمایت کی قیمت کے طور پر اسلام قبول کیا اور صفوی سرپرستی میں کارتلی (1688ء–1703ء) پھر کاخیتی (1703ء–1709ء) کے بادشاہ رہے۔ تنصیب سے پہلے انھوں نے اصفہان میں شاہ کے دربار میں چودہ سال گزارے، معزول جارج یازدہم سے طویل خانہ جنگی لڑی، تبلیسی کی شہری انتظامیہ اور دستکار انجمنوں کو منظم کیا، اور 1709ء میں اصفہان میں وفات پائی؛ کاخیتی ان کے بیٹے ڈیوڈ ثانی (امام قلی خان) کو ملا۔"

