    note: >-
      Raised in the Orthodox faith at the Moscow court, he was required
      by Shah Suleiman to change his faith as the price of a crown. The
      English article records that in 1674 he at first refused to become
      a Muslim, citing the oath of allegiance his ancestor Alexander II
      of Kakheti had given to Feodor I of Russia, and it dates his
      conversion to Islam, under the name Nazar Ali Khan, to 1676. The
      Russian article says that after hesitation he accepted Islam and
      received the name Nazar Ali Khan before his fourteen years at
      Isfahan, and the Georgian article likewise says that after long
      hesitation he became a Muslim and took the name Nazar Ali Khan.
      His conversion to Islam is therefore documented in full; but no
      text read names a branch or a school of Islam for the king
      himself, and the Wikidata item's religion statement is Islam in
      generic form. Under the founder's rules — Safavid court context
      is not attestation for the person — his faith is recorded as
      unknown, with the conversion stated here.
    sources: [source/wikipedia-erekle-i-en, source/wikipedia-erekle-i-ru, source/wikipedia-erekle-i-ka, source/wikidata-erekle-i]

