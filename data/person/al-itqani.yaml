summary:
  ar: "أمير كاتب بن أمير عمر بن أمير غازي، قوام الدين أبو حنيفة الإتقاني الفارابي، رأس في الحنفية وبارع في الفقه واللغة العربية وغيرها من العلوم، ولي قضاء بغداد، ودرّس بدار الحديث بالظاهرية في دمشق، ثم صار من أعيان العلماء بالقاهرة. من تصانيفه «غاية البيان» شرح الهداية، و«التبيين في أصول المذهب» شرح أصول الأخسيكثي، و«شرح البزدوي». عاش بين 685 و758هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  en: "Amir Katib ibn Amir Umar ibn Amir Ghazi, Qawam al-Din Abu Hanifa al-Itqani al-Farabi, a leader of the Hanafi school, skilled in law, Arabic and other sciences. He held the judgeship of Baghdad, taught at the Zahiriyya house of hadith in Damascus, and later became a leading scholar in Cairo. His works include 'Ghayat al-bayan', a commentary on the Hidaya, 'al-Tabyin' on the principles of the school, a commentary on al-Akhsikathi, and a commentary on al-Bazdawi. He lived from 685 to 758 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
