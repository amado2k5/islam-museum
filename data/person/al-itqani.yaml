summary:
  ar: "أمير كاتب بن أمير عمر بن أمير غازي، قوام الدين أبو حنيفة الإتقاني الفارابي، رأس في الحنفية وبارع في الفقه واللغة العربية وغيرها من العلوم، ولي قضاء بغداد، ودرّس بدار الحديث بالظاهرية في دمشق، ثم صار من أعيان العلماء بالقاهرة. من تصانيفه «غاية البيان» شرح الهداية، و«التبيين في أصول المذهب» شرح أصول الأخسيكثي، و«شرح البزدوي». عاش بين 685 و758هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  en: "Amir Katib ibn Amir Umar ibn Amir Ghazi, Qawam al-Din Abu Hanifa al-Itqani al-Farabi, a leader of the Hanafi school, skilled in law, Arabic and other sciences. He held the judgeship of Baghdad, taught at the Zahiriyya house of hadith in Damascus, and later became a leading scholar in Cairo. His works include 'Ghayat al-bayan', a commentary on the Hidaya, 'al-Tabyin' on the principles of the school, a commentary on al-Akhsikathi, and a commentary on al-Bazdawi. He lived from 685 to 758 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  es: "Amir Katib ibn Amir Umar ibn Amir Ghazi, Qawam al-Din Abu Hanifa al-Itqani al-Farabi, líder de la escuela Hanafi, experto en derecho, árabe y otras ciencias. Ocupó el cargo de juez de Bagdad, enseñó en la casa de hadices Zahiriyya en Damasco y más tarde se convirtió en un destacado erudito en El Cairo. Sus obras incluyen 'Ghayat al-bayan', un comentario sobre Hidaya, 'al-Tabyin' sobre los principios de la escuela, un comentario sobre al-Akhsikathi y un comentario sobre al-Bazdawi. Vivió del 685 al 758 d. H. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  fr: "Amir Katib ibn Amir Umar ibn Amir Ghazi, Qawam al-Din Abu Hanifa al-Itqani al-Farabi, un leader de l'école Hanafi, compétent en droit, en arabe et dans d'autres sciences. Il a été juge à Bagdad, a enseigné à la maison de hadith Zahiriyya à Damas, puis est devenu un érudit de premier plan au Caire. Ses œuvres comprennent « Ghayat al-bayan », un commentaire sur la Hidaya, « al-Tabyin » sur les principes de l'école, un commentaire sur al-Akhsikathi et un commentaire sur al-Bazdawi. Il vécut de 685 à 758 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
