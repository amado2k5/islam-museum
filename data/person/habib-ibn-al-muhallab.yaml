summary:
  ar: "حبيب بن المهلب بن أبي صفرة؛ استعمله سليمان بن عبد الملك على حرب السند فنزل على شاطئ مهران فأعطاه أهلها الطاعة وحارب قوماً فظفر بهم. ولاه سليمان بن عبد الملك السند، فلم يمكّن ابن داهر من استرداد إمارة آبائه. {cite:salabi-umayyad-state-2020 p.108}"
  en: "Habib ibn al-Muhallab ibn Abi Sufra; Sulayman's Sind-war commander — received obedience on Mihran's shore and won his fights."
  es: "Habib ibn al-Muhallab ibn Abi Sufra, comandante de Sulayman en la guerra de Sind, recibió obediencia en la costa de Mihran y ganó sus batallas."
  fr: "Habib ibn al-Muhallab ibn Abi Sufra; commandant de Sulayman lors de la guerre du Sind — reçut l'obéissance sur la rive de Mihran et remporta ses combats."
  ur: "حبیب ابن المحلب ابن ابی صفرہ۔ سلیمان کے سندھ کے جنگی کمانڈر نے مہران کے ساحل پر اطاعت حاصل کی اور اپنی لڑائی جیت لی۔"
  tr: "Habib ibn al-Muhallab ibn Abi Safra; Süleyman ibn Abd al-Malik onu Sind savaşı için atadı, bu yüzden Mehran kıyısında kamp kurdu, halkı ona itaat etti, bir halkla savaştı ve onları yendi. Süleyman bin Abd al-Malik onu Sindh valisi olarak atadı, ancak İbn Dahir atalarının emirliğini geri alamadı. {cite:Salabi-Umayyad-state-2020 s.108}"
  id: "Habib ibn al-Muhallab ibn Abi Safra; Sulayman ibn Abd al-Malik mengangkatnya atas perang Sind, sehingga ia berkemah di tepi Mehran, di mana rakyatnya mematuhinya, melawan satu bangsa, dan ia mengalahkan mereka. Sulayman ibn Abd al-Malik mengangkatnya sebagai gubernur Sindh, tetapi Ibn Dahir tidak mampu merebut kembali emirat leluhurnya. {cite:Salabi-Umayyad-State-2020 hlm.108}"
