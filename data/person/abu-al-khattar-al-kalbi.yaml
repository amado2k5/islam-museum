summary:
  ar: "أمير الأندلس من قبل حنظلة بن صفوان عامل إفريقية؛ ركب إليها البحر من تونس سنة خمس وعشرين ومائة فدان له أهلها، وكان شجاعاً كريماً ذا رأي وحزم، وكثر أهل الشام عنده ولم تحملهم قرطبة ففرقهم في البلاد فأنزل أهل دمشق إلبيرة وسماها دمشق، وأهل حمص إشبيلية وسماها حمص، وأهل قنسرين جيان، وأهل الأردن رية ومالقة، وأهل فلسطين شذونة وهي شريش، وأهل مصر تدمير وسماها مصر؛ ثم أفرط في التعصب لقومه من اليمانية فألب عليه الصميل بن حاتم المضرية فخلع سنة ثمان وعشرين، وثار بعد ذلك على يوسف الفهري فقتله الصميل سنة تسع وعشرين {cite:nafh-tib-maqqari p. 273-274}."
  en: "Governor of al-Andalus sent by sea from Tunis in 125; he dispersed the crowded Syrian junds through the land, naming each district after its jund's home — Damascus at Ilbira, Hims at Seville, Qinnasrin at Jaen, Jordan at Rayya and Malaga, Palestine at Sidonia, Egypt at Tudmir — before his Yamani partisanship brought the Qaysi rising that deposed him and later killed him in 129 {cite:nafh-tib-maqqari p. 273-274}."
