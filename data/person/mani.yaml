label: { ar: "ماني", en: "Mani", es: "Mani", fr: "Mani", ur: "مانی" }
summary:
  ar: "ماني بن فتق بابك بن أبي برزام من الحسكانية وأمه ميس ويقال أوتاخيم ويقال مرمريم من ولد الأشغانية، وقيل إن أصل أبيه من همدان انتقل إلى بابل وكان ينزل المدائن في الموضع الذي يسمى طيسفون وبها بيت الأصنام، وكان فتق يحضر فهتف به هاتف من هيكل بيت الأصنام يا فتق لا تأكل لحما ولا تشرب خمرا ولا تنكح امرأة تكرر عليه ثلاثة أيام فلحق بقوم بنواحي دوميسان يعرفون بالمغتسلة وكانت امرأته حاملا بماني، وكان ماني أحنف الرجل ويتكلم على صغر سنه بكلام الحكمة، فلما تم له اثنتا عشرة سنة أتاه الوحي على قوله من ملك جنان النور وكان الملك الذي جاءه يسمى التوم وهو بالنبطية ومعناه القرين فقال له اعتزل هذه الملة وعليك بالنزاهة وترك الشهوات، فلما تم له أربع وعشرون سنة أتاه التوم فقال قد حان لك أن تخرج فتنادي بأمرك، قالت المانوية خرج يوم ملك سابور بن أردشير ووضع التاج على رأسه يوم الأحد أول نيسان والشمس في الحمل ومعه رجلان شمعون وزكو وأبوه، وظهر في السنة الثانية من ملك غالوس الرومي، وزعم أنه الفارقليط المبشر به عيسى واستخرج مذهبه من المجوسية والنصرانية والقلم الذي يكتب به من السرياني والفارسي، وجول البلاد قبل أن يلقى سابور نحو أربعين سنة ثم دعا فيروز أخا سابور فأوصله إليه فدخل إليه وعلى كتفيه مثل السراجين من نور فأعظمه وكبر في عينه وأجابه إلى حوائجه منها أن يأذن لأصحابه في سائر بلاد مملكته، وكان ماني دعا الهند والصين وأهل خراسان وخلف في كل ناحية صاحبا له {cite:fihrist-ibn-al-nadim p. 456-458}. وقتل ماني في مملكة بهرام بن سابور ولما قتله صلبه نصفين النصف الواحد على باب والآخر على باب آخر من مدينة جندي سابور ويسمى الموضعين المار الأعلى والمار الأسفل، وقيل إنه كان في محبس سابور فلما مات أخرجه بهرام وقيل مات في الحبس والصلب لا شك فيه، وحكى بعض الناس أنه كان أحذف الرجلين وقيل الرجل اليمنى، وكان ينتقص سائر الأنبياء في كتبه ويزعم أن الشياطين استحوذت عليهم، وله سبعة كتب أحدها فارسي وستة سوري: كتاب سفر الأسرار وسفر الجبابرة وفرائض السماعين والشابرقان وسفر الأحياء وفرغماطيا {cite:fihrist-ibn-al-nadim p. 468-470}"
  en: "Mani — the fullest Arabic account: the temple voice, the Mughtasila, the Twin, Shapur's coronation-day debut {cite:fihrist-ibn-al-nadim}"
  es: "Mani — el relato árabe más completo: la voz del templo, la Mughtasila, los Gemelos, el debut de Shapur el día de su coronación {cite:fihrist-ibn-al-nadim}"
  fr: "Mani — le récit arabe le plus complet: la voix du temple, la Mughtasila, les Jumeaux, les débuts de Shapur le jour du couronnement {cite:fihrist-ibn-al-nadim}"
  ur: "مانی - مکمل عربی اکاؤنٹ: دی ٹیمپل وائس، دی مُغتصیلہ، جڑواں، شاپور کی تاجپوشی کے دن کی پہلی فلم {حوالہ: فہرست ابن الندیم}"
  tr: "Mani ibn Fataq Babak ibn Abi Barzam Hasakanilerdendi, annesi Mais'ti, diğer adıyla Otachhim idi ve Marmariam'ın Ashghaniyya'nın soyundan geldiği söylenir. Babası Hamdan'dan kökenli olarak Babil'e taşınmış ve putlar evinin bulunduğu Tisifun adlı şehirlerde yerleşmiştir. Phtaq oradaydı ve putlar evinin tapınağından gelen bir telefon ona şöyle bağırdı: 'Ey Fataq, et yeme, şarap içme ve üç gün boyunca tekrar eden bir kadınla evlenme.' Dumisan yakınlarında çamaşırcı olarak bilinen bir gruba katıldı ve eşi Mani'ye hamileydi. Mani Adam inatçıydı ve genç yaşından bilgelik sözleri söyledi. On iki yaşına geldiğinde, \"Işık bahçelerinin kralından\" diyen bir vahiy geldi. Yanına gelen kralın adı Al-Tumm'du, bu Nebatice dilinde 'yoldaş' anlamına gelir. Maniheimler ona, 'Bu dini bırak, dürüst ol ve arzularını bırak.' dediler. Yirmi dört yaşındayken Al-Tum yanına geldi ve dedi ki, 'Artık çıkıp düzenini ilan etme zamanı.' Manihéciler, Sabor bin Ardaşir'in saltanat gününde dışarı çıktığını ve tacı başına taktığını, yani Nisan'ın ilk günü Pazar günü ve güneşin doğduğunu söylediler Hamal, Simon ve Zacchus adlı iki adamla birlikte, babası ile birlikte geldi. Gallus Romalıların saltanatının ikinci yılında ortaya çıktı. İsa'nın aldığı misyoner Feraklet olduğunu iddia etti ve doktrinini Magyanizm, Hristiyanlık ve Süryanice ile Farsçadan yazdığı kalemden aldı. Yaklaşık kırk yıl boyunca topraklarda dolaştı ve Sabor'la karşılaştı, o zamanlar Sabor'un kardeşi Fairuz'u çağırdı ve onu yanına getirdi. Omuzlarında ışık lambaları gibi ona girdi, onu büyüttü, yüceltti, yüceltti, ihtiyaçlarını karşıladı, krallığı genelindeki yoldaşlarına izin verdi. Mani, Hindistan, Çin ve Horasan halkını davet etti, her bölgede bir yoldaş bıraktı {atıf:fihrist-ibn-al-nadim s. 456-458}. Mani, Bahram ibn Sabour krallığında öldürüldü ve öldürüldüğünde, Sabour askerinin şehrinin bir kapısında, diğeri diğer kapıda olmak üzere iki ikiye bölünerek çarmıha gerildi. Bu iki yere üst geçit ve alt geçit denir. Söylenir ki, Sapur hapishanesindeydi ve öldüğünde Bahram onu dışarı çıkardı. Şüphesiz hapis ve çarmıha gerilme halinde öldüğü söylenir. Bazı kişiler, onun iki adamın en kopuk olanı olduğunu ve doğru adam olduğunu söyler. Kitaplarındaki diğer tüm peygamberleri küçümseyerek onları şeytanların ele geçirdiğini iddia etmiştir. Yedi kitabı vardır, biri Farsça, altı Süryanice: Sırlar Kitabı, Titanlar Kitabı, Dinleyicilerin Görevleri, Habarqan, Yaşayanlar Kitabı ve Farghamatia {atıf: Fihrist-ibn-al-nadim s. 468-470}"
  id: "Mani ibn Fataq Babak ibn Abi Barzam berasal dari suku Hasakanis, dan ibunya adalah Mais, juga disebut Otachhim, dan dikatakan Marmariam adalah keturunan Ashghaniyya. Konon asal-usul ayahnya berasal dari Hamdan, ia pindah ke Babilonia dan biasa menetap di kota-kota bernama Tisifun, yang merupakan rumah berhala. Phtaq hadir, dan sebuah telepon dari kuil rumah berhala berteriak kepadanya: 'Wahai Fataq, jangan makan daging, minum anggur, dan jangan menikahi wanita yang mengulanginya selama tiga hari.' Ia bergabung dengan kelompok di dekat Dumisan yang dikenal sebagai tukang cuci, dan istrinya sedang hamil Mani. Mani Pria itu keras kepala dan berbicara tentang usia mudanya dengan kata-kata bijak. Ketika berusia dua belas tahun, wahyu datang kepadanya yang berkata, \"Dari raja taman cahaya.\" Raja yang datang kepadanya disebut Al-Tumm, yang dalam bahasa Nabatean berarti 'teman.' Orang Manikhea berkata kepadanya, 'Tinggalkan agama ini, jujurlah, dan tinggalkan keinginan.' Ketika berusia dua puluh empat tahun, Al-Tum datang kepadanya dan berkata, 'Sudah waktunya kamu keluar dan memberitakan tatananmu.' Orang Manikhea berkata dia keluar pada hari pemerintahan Sabor ibn Ardashir dan meletakkan mahkota di kepalanya pada hari Minggu, tanggal pertama Nisan, dan matahari terbit Hamal ditemani oleh dua pria, Simon dan Zacchus, serta ayahnya. Ia muncul pada tahun kedua pemerintahan Gallus dari Romawi. Ia mengklaim dirinya sebagai Pharaclete, misionaris yang diambil Yesus dan mengambil doktrinnya dari Magianisme, Kekristenan, dan pena yang ia gunakan untuk menulis dari bahasa Siria dan Persia. Ia menjelajahi negeri-negeri sebelum bertemu Sabor selama sekitar empat puluh tahun, yang saat itu dipanggil Fairuz, saudara Sabor, dan membawanya kepadanya. Ia datang kepadanya dengan bahunya seperti lampu lampu, membesarkannya, dan memenuhi kebutuhannya, termasuk memberikan izin kepada teman-temannya di seluruh kerajaannya. Mani mengundang India, Tiongkok, dan rakyat Khorasan, meninggalkan seorang teman di setiap wilayah {cite:fihrist-ibn-al-nadim hlm. 456-458}. Mani dibunuh di kerajaan Bahram ibn Sabour, dan ketika ia dibunuh, ia disalibkan menjadi dua bagian, satu di satu gerbang dan satu lagi di gerbang lain kota prajurit Sabour. Kedua tempat itu disebut lorong atas dan lorong bawah. Konon ia berada di penjara Sapur, dan ketika ia meninggal, Bahram membawanya keluar. Dikatakan ia meninggal dalam penjara dan penyaliban, tanpa diragukan lagi. Beberapa orang melaporkan bahwa ia adalah yang paling terpisah dari kedua pria itu, dan dikatakan bahwa ia adalah orang yang tepat. Ia meremehkan semua nabi lain dalam bukunya dan mengklaim bahwa setan merasuki mereka. Ia memiliki tujuh kitab, satu dalam bahasa Persia dan enam dalam bahasa Siria: Kitab Rahasia, Kitab Para Titan, Tugas Para Pendengar, Shabarqan, Kitab Orang Hidup, dan Farghamatia {cite:fihrist-ibn-al-nadim hlm. 468-470}"
