label: { ar: "ماني", en: "Mani" }
summary:
  ar: "ماني بن فتق بابك بن أبي برزام من الحسكانية وأمه ميس ويقال أوتاخيم ويقال مرمريم من ولد الأشغانية، وقيل إن أصل أبيه من همدان انتقل إلى بابل وكان ينزل المدائن في الموضع الذي يسمى طيسفون وبها بيت الأصنام، وكان فتق يحضر فهتف به هاتف من هيكل بيت الأصنام يا فتق لا تأكل لحما ولا تشرب خمرا ولا تنكح امرأة تكرر عليه ثلاثة أيام فلحق بقوم بنواحي دوميسان يعرفون بالمغتسلة وكانت امرأته حاملا بماني، وكان ماني أحنف الرجل ويتكلم على صغر سنه بكلام الحكمة، فلما تم له اثنتا عشرة سنة أتاه الوحي على قوله من ملك جنان النور وكان الملك الذي جاءه يسمى التوم وهو بالنبطية ومعناه القرين فقال له اعتزل هذه الملة وعليك بالنزاهة وترك الشهوات، فلما تم له أربع وعشرون سنة أتاه التوم فقال قد حان لك أن تخرج فتنادي بأمرك، قالت المانوية خرج يوم ملك سابور بن أردشير ووضع التاج على رأسه يوم الأحد أول نيسان والشمس في الحمل ومعه رجلان شمعون وزكو وأبوه، وظهر في السنة الثانية من ملك غالوس الرومي، وزعم أنه الفارقليط المبشر به عيسى واستخرج مذهبه من المجوسية والنصرانية والقلم الذي يكتب به من السرياني والفارسي، وجول البلاد قبل أن يلقى سابور نحو أربعين سنة ثم دعا فيروز أخا سابور فأوصله إليه فدخل إليه وعلى كتفيه مثل السراجين من نور فأعظمه وكبر في عينه وأجابه إلى حوائجه منها أن يأذن لأصحابه في سائر بلاد مملكته، وكان ماني دعا الهند والصين وأهل خراسان وخلف في كل ناحية صاحبا له {cite:fihrist-ibn-al-nadim p. 456-458}. وقتل ماني في مملكة بهرام بن سابور ولما قتله صلبه نصفين النصف الواحد على باب والآخر على باب آخر من مدينة جندي سابور ويسمى الموضعين المار الأعلى والمار الأسفل، وقيل إنه كان في محبس سابور فلما مات أخرجه بهرام وقيل مات في الحبس والصلب لا شك فيه، وحكى بعض الناس أنه كان أحذف الرجلين وقيل الرجل اليمنى، وكان ينتقص سائر الأنبياء في كتبه ويزعم أن الشياطين استحوذت عليهم، وله سبعة كتب أحدها فارسي وستة سوري: كتاب سفر الأسرار وسفر الجبابرة وفرائض السماعين والشابرقان وسفر الأحياء وفرغماطيا {cite:fihrist-ibn-al-nadim p. 468-470}"
  en: "Mani — the fullest Arabic account: the temple voice, the Mughtasila, the Twin, Shapur's coronation-day debut {cite:fihrist-ibn-al-nadim}"
