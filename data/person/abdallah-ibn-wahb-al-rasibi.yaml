id: person/abdallah-ibn-wahb-al-rasibi
class: person
label: { ar: "عبد الله بن وهب الراسبي", en: "'Abd Allah ibn Wahb al-Rasibi", fr: "'Abd Allah ibn Wahb al-Rasibi", es: "'Abd Allah ibn Wahb al-Rasibi", ur: "عبد اللہ بن وھب الراسیبی" }
summary:
  ar: "أول إمام بايعته الخوارج لأنفسهم، اجتمعوا عليه في أربعة آلاف ولحقوا بالمدائن وقتلوا عبد الله بن خباب عامل علي عليها وذبحوه وبقروا بطن امرأته الحامل، ونزل بهم النهروان سنة ثمان وثلاثين فكان مصارعهم بالرميلة كما قال علي لأصحابه {cite:muruj-al-dhahab p. 695-696}."
  en: "The Kharijites' first elected imam — four thousand under his bay'a at Mada'in, where Ibn Khabbab and his pregnant wife were slaughtered, before their annihilation at the Rumayla by Nahrawan in 38 AH {cite:muruj-al-dhahab p. 695-696}."
  fr: "Le premier imam élu des kharijites — quatre mille hommes sous son allégeance à al-Mada'in, où Ibn Khabbab et son épouse enceinte furent massacrés, avant leur anéantissement à la Rumayla près de Nahrawan en 38 H {cite:muruj-al-dhahab p. 695-696}."
  es: "El primer imán electo de los jariyitas: cuatro mil bajo su bay'a en Mada'in, donde Ibn Khabbab y su esposa embarazada fueron masacrados, antes de su aniquilación en Rumayla por Nahrawan en el año 38 AH {cite:muruj-al-dhahab p. 695-696}."
  ur: "خارجیوں کے پہلے منتخب امام - مدین میں ان کی بیعت کے تحت چار ہزار، جہاں ابن خباب اور ان کی حاملہ بیوی کو 38 ہجری میں رومیلہ میں نہروان کے ہاتھوں ان کی ہلاکت سے پہلے ذبح کیا گیا تھا۔ 695-696}۔"
  tr: "Haricilerin biat ettikleri ilk İmam'ın etrafında dört bin kişi toplandılar ve Medine'ye giderek Ali'nin valisi Abdullah bin Habab'ı öldürdüler, katlettiler ve hamile karısının karnını yardılar. Otuz sekizinci yılda Nahravan'a indiler ve ölümleri Al-Rumaila'da oldu, Ali'nin arkadaşlarına anlattığı gibi. {Kaynak: Muruj-al-Dhahab s. 695-696}"
  id: "Imam pertama yang kepadanya kaum Kharijites berbaiat, mereka berkumpul di sekelilingnya dalam jumlah empat ribu orang dan pergi ke Madinah dan membunuh Abdullah bin Khabbab, gubernur Ali di sana, dan menyembelihnya serta merobek perut istrinya yang sedang hamil, dan mereka turun ke Nahrawan pada tahun tiga puluh delapan, dan kematian mereka terjadi di Al-Rumaila, sebagaimana yang dikatakan Ali kepada para sahabatnya {cite:muruj-al-dhahab p. 695-696}."
