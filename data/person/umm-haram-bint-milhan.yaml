summary:
  ar: خالة أنس بن مالك، كان النبي يزورها في قباء، وفي حديثها أنه رأى أناساً من أمته يركبون البحر؛ وتزوجها عبادة بن الصامت، وماتت في غزوة قبرس حين صُرعت عن دابتها.
  en: Maternal aunt of Anas ibn Malik, whom the Prophet used to visit at Quba; in her hadith he saw people of his community sailing the sea. She married Ubada ibn al-Samit and died on the Cyprus expedition when she fell from her mount.
  ur: "انس بن مالک کی خالہ، جن سے نبی قباء میں ملتے تھے؛ ان کی حدیث میں انہوں نے اپنی امت کو سمندر میں سوار دیکھا۔"
  es: "Tía materna de Anas ibn Malik, a quien el Profeta solía visitar en Quba; en un hadiz, él vio a miembros de su comunidad navegando por el mar. Se casó con Ubada ibn al-Samit y murió durante la expedición a Chipre al caerse de su montura."
  fr: "Tante maternelle d'Anas ibn Malik, que le Prophète avait coutume de visiter à Quba; selon un hadith la concernant, il vit des membres de sa communauté naviguer en mer. Elle épousa Ubada ibn al-Samit et mourut lors de l'expédition à Chypre après une chute de sa monture."
  tr: "Peygamber'in Quba'da ziyaret ettiği Anas ibn Malik'in teyzesi, rivayetinde kendi ulusundan insanları denize binerken gördüğünü anlatır; Ubadah ibn al-Samit ile evlendi ve Kıbrıs Seferi sırasında atını kaybederek hayatını kaybetti."
  id: "Bibi Anas ibn Malik, yang biasa dikunjungi Nabi di Quba, dan dalam riwayatnya, ia melihat orang-orang dari bangsanya menunggang laut; ia menikahi Ubadah ibn al-Samit, dan dia meninggal selama Ekspedisi Siprus ketika kehilangan kudanya."
