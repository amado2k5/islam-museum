summary:
  ar: خالة أنس بن مالك، كان النبي يزورها في قباء، وفي حديثها أنه رأى أناساً من أمته يركبون البحر؛ وتزوجها عبادة بن الصامت، وماتت في غزوة قبرس حين صُرعت عن دابتها.
  en: Maternal aunt of Anas ibn Malik, whom the Prophet used to visit at Quba; in her hadith he saw people of his community sailing the sea. She married Ubada ibn al-Samit and died on the Cyprus expedition when she fell from her mount.
  ur: "انس بن مالک کی خالہ، جن سے نبی قباء میں ملتے تھے؛ ان کی حدیث میں انہوں نے اپنی امت کو سمندر میں سوار دیکھا۔"
