summary:
  ar: "شيخ كبير من العرب في الجاهلية، تزوجته جندلة بنت الحارث وهي عذراء، والقصة مذكورة في مثل 'جرحه حيث لا يضع الراقي أنفه'. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 21}"
  en: "An old Arab man in pre-Islamic times; Jundala bint al-Harith was married to him while still a virgin, and the story belongs to the proverb 'he wounded him where the healer cannot put his nose'. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 21}"
  ur: "جاہلیت کے ایک بوڑھے عرب؛ جندلہ بنت حارث کی شادی ان سے کنواری حالت میں ہوئی، اور یہ قصہ 'اس نے وہاں زخم دیا جہاں معالج ناک نہیں ڈال سکتا' کے مثل سے جڑا ہے۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 21}"
