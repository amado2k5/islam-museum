  ar: "القرطلوسي أبو الفضل من نواحي عكبراء من فقهاء الشراة وله كتب كثيرة منها كتاب الجامع الكبير في الفقه وكتاب الجامع الصغير وعليه يمول أصحابه وكتاب الفرائض وكتاب الرد على أبي حنيفة في الرأي وكتاب الرد على الشافعي في القياس {cite:fihrist-ibn-al-nadim p. 330}."
