summary:
  en: "Abu Bakr's elder daughter, who carried provisions to the two fugitives in the cave of Thawr and split her girdle in two to tie the food bag — hence her byname Dhat al-Nitaqayn, 'she of the two girdles'."
  ar: "ابنة أبي بكر الكبرى وأخت عائشة؛ حملت سفرة النبي وأبيها إلى الغار، وإذ لم تجد للسفرة عصاماً شقّت نطاقها اثنين فربطت بأحدهما وانتطقت بالآخر، فسُميت ذات النطاقين. وعند المسعودي لما سئلها ابن الزبير عما رد به ابن عباس في المتعة قالت صدق، وروت هي عن حجة الوداع أنها لما أحلت لبست ثيابها وتطيبت وجثت حتى جلست إلى جنب الزبير فقال لها قومي عني أخاف أن أثب عليك {cite:muruj-al-dhahab p. 77-78}، وعند المسعودي قالت لابنها عبد الله لا تقبل خطة تخاف على نفسك منها مخافة القتل مت كريماً وإياك أن تؤسر أو تعطي بيديك، وقال أخاف أن يمثل بي بعد القتل فقالت وهل تتألم الشاة من ألم السلخ بعد الذبح {cite:muruj-al-dhahab p. 105}"
  ur: "ابو بکر کی بڑی بیٹی جو غار ثور میں دو فراریوں کو خوراک پہنچائی اور کھانے کی تھیلی باندھنے کے لیے اپنا کمر بند دو کر کے بانٹا — اسی سے ان کا لقب پڑا۔"
  es: "La hija mayor de Abu Bakr, que llevó provisiones a los dos fugitivos en la cueva de Thawr y partió su cinturón por la mitad para atar la bolsa de comida, de ahí su sobrenombre Dhat al-Nitaqayn, 'la de los dos cinturones'."
  fr: "La fille aînée d'Abu Bakr, qui apporta des provisions aux deux fugitifs dans la grotte de Thawr et déchira sa ceinture en deux pour attacher le sac de nourriture — d'où son surnom Dhat al-Nitaqayn, « celle aux deux ceintures »."
  tr: "Ebu Bekir'in en büyük kızı ve Aişe'nin kız kardeşi olan Ebu Bekir, Peygamber'in ve babasının sofrasını mağaraya taşıdı. Masa için yoldaş bulamayınca sınırlarını ikiye böldü, birine bağladı, diğerini bağladı ve iki sınırı olan kişi olarak adlandırıldı. El-Mes'udi'ye göre, İbn Sübeyr ona İbn Abbas'ın mut'ah hakkında ne cevap verdiğini sorduğunda, doğruyu söyledi. Veda tartışmasında, serbest bırakıldığında giysilerini giydiğini, parfüm sürdüğünü ve diz çökerek el-Zübeyr'in yanına oturduğunu anlattı. Zübeyr ona, 'Benden kalk; sana ödeyeceğimden korkuyorum.' dedi. {alıntı:muruj-al-dhahab s. 77-78} Ve el-Mes'udi ile oğlu Abdullah'a, 'Kendi korkusunla, ölümden korktuğun bir planı kabul etmiyor musun, yakalanma ya da kendi ellerinle verme.' dedi.: 'Öldürdükten sonra sakatlanacağından korkuyorum.' dedi. Kadın dedi ki, 'Koyunlar kesimden sonra derilerini yüzme acısını çekiyor mu?' {alıntı:Muruj-al-dhahab, s. 105}"
  id: "Putri sulung Abu Bakr dan saudari Aisha, ia membawa meja Nabi dan ayahnya ke gua. Ketika ia tidak menemukan teman untuk meja, ia membagi batas-batasnya menjadi dua, mengikatnya ke satu dan mengikat yang lain, dan disebut sebagai yang memiliki dua batas. Menurut al-Mas'udi, ketika Ibn al-Zubayr bertanya apa jawaban Ibn Abbas tentang mut'ah, ia berkata jujur. Ia menceritakan tentang pertengkaran perpisahan bahwa ketika dibebaskan, ia mengenakan pakaian, mengoleskan parfum, dan berlutut hingga duduk di samping al-Zubayr. Ia berkata kepadanya, 'Bangunlah dariku; aku takut akan membalasmu.' {cite:] muruj-al-dhahab hlm. 77-78} Dan bersama al-Mas'udi, dia berkata kepada putranya Abdullah, 'Apakah kamu tidak menerima rencana yang kamu takutkan untuk dirimu sendiri, takut mati, dan tidak ditangkap atau diberikan dengan tanganmu sendiri?' Dia berkata, 'Saya takut dia akan dimutilasi setelah pembunuhan itu.' Dia berkata, 'Apakah domba-domba itu menderita akibat dikuliti setelah disembelih?' {cite:Muruj-al-dhahab, hlm. 105}"
