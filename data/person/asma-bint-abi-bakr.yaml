summary:
  en: "Abu Bakr's elder daughter, who carried provisions to the two fugitives in the cave of Thawr and split her girdle in two to tie the food bag — hence her byname Dhat al-Nitaqayn, 'she of the two girdles'."
  ar: "ابنة أبي بكر الكبرى وأخت عائشة؛ حملت سفرة النبي وأبيها إلى الغار، وإذ لم تجد للسفرة عصاماً شقّت نطاقها اثنين فربطت بأحدهما وانتطقت بالآخر، فسُميت ذات النطاقين.، وعند المسعودي لما سئلها ابن الزبير عما رد به ابن عباس في المتعة قالت صدق، وروت هي عن حجة الوداع أنها لما أحلت لبست ثيابها وتطيبت وجثت حتى جلست إلى جنب الزبير فقال لها قومي عني أخاف أن أثب عليك {cite:muruj-al-dhahab p. 77-78}، وعند المسعودي قالت لابنها عبد الله لا تقبل خطة تخاف على نفسك منها مخافة القتل مت كريماً وإياك أن تؤسر أو تعطي بيديك، وقال أخاف أن يمثل بي بعد القتل فقالت وهل تتألم الشاة من ألم السلخ بعد الذبح {cite:muruj-al-dhahab p. 105}"
