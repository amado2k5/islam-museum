summary:
  ar: "أبو الحسن محمد بن عبد الله بن الحارث بن عبد الله بن الوليد بن الوليد بن المغيرة المخزومي السلامي، نسبة إلى دار السلام ببغداد؛ الشاعر المشهور وهو من ولد الوليد بن المغيرة أخي خالد بن الوليد؛ قال الثعالبي في حقه: هو من أشعر أهل العراق قولاً بالإطلاق؛ قال الشعر وهو ابن عشر سنين ونشأ ببغداد وخرج إلى الموصل صبياً فلقي مشايخ الشعراء منهم أبو عفان الخالدي وأبو الفرج السغاء وأبو الحسن التلعفري؛ قصد حضرة الصاحب ابن عباد بأصبهان ومدح عضد الدولة فلما توفي تراجع طبعه ورقت حاله حتى مات {cite:wafayat-ayan}."
  en: "Al-Salami (336–393) — the Makhzumi poet of Baghdad, descended from al-Walid b. al-Mughira; al-Tha'alibi calls him 'the most poetic of the Iraqis'; sang from age ten; praised Adud al-Dawla and faded after his death {cite:wafayat-ayan}."
