summary:
  ar: "أبو الحسن محمد بن عبد الله بن الحارث بن عبد الله بن الوليد بن الوليد بن المغيرة المخزومي السلامي، نسبة إلى دار السلام ببغداد؛ الشاعر المشهور وهو من ولد الوليد بن المغيرة أخي خالد بن الوليد؛ قال الثعالبي في حقه: هو من أشعر أهل العراق قولاً بالإطلاق؛ قال الشعر وهو ابن عشر سنين ونشأ ببغداد وخرج إلى الموصل صبياً فلقي مشايخ الشعراء منهم أبو عفان الخالدي وأبو الفرج السغاء وأبو الحسن التلعفري؛ قصد حضرة الصاحب ابن عباد بأصبهان ومدح عضد الدولة فلما توفي تراجع طبعه ورقت حاله حتى مات {cite:wafayat-ayan}."
  en: "Al-Salami (336–393) — the Makhzumi poet of Baghdad, descended from al-Walid b. al-Mughira; al-Tha'alibi calls him 'the most poetic of the Iraqis'; sang from age ten; praised Adud al-Dawla and faded after his death {cite:wafayat-ayan}."
  fr: "Al-Salami (336-393) – le poète Makhzumi de Bagdad, descendant d’al-Walid b. al-Mughira ; al-Tha’alibi l’appelle « le plus poétique des Irakiens » ; chantait dès l’âge de dix ans ; louait Adud al-Dawla et s’est éteint après sa mort {cite:wafayat-ayan}."
  es: "Al-Salami (336–393) — el poeta majzumi de Bagdad, descendiente de al-Walid b. al-Mughira; al-Tha'alibi lo llama 'el más poético de los iraquíes'; cantó desde los diez años; alabó a Adud al-Dawla y su fama se desvaneció tras su muerte {cite:wafayat-ayan}."
  ur: "السلمی (336-393) - بغداد کے مخزومی شاعر، الولید بن. المغیرہ؛ الثعلبی اسے 'عراقیوں کا سب سے زیادہ شاعر' کہتا ہے۔ دس سال کی عمر سے گایا؛ اس نے عود الدولہ کی تعریف کی اور اس کی موت کے بعد دھندلا گیا۔"
  tr: "Bağdat'ta Dar al-Salam'a atfedilen Ebu el-Hasan Muhammed bin Abdullah ibn Abdullah ibn el-Harith ibn el-Velid ibn el-Müğira el-Makhzumi el-Salami'ye atfedilir; ünlü şair ve Halid bin Velid'in kardeşi el-Velid bin Muğira'nın soyundan gelmektedir. El-Tealibi onun hakkında şöyle demiştir: Irak halkının mutlak dilinde en şiirsel olanlardandır; Poe'yi kaleme almıştır On yaşında Bağdat'ta büyüdü, çocukken Musul'a gitti ve Ebu Affan el-Halidi, Ebu el-Faraj el-Sagha ve Ebu el-Hasan el-Telaferi gibi şairlerin şeyhleriyle tanıştı. Yoldaş İbn Abbad'ın huzuruna İsfahan'a gitti ve 'Adud al-Dawla'yı övdü. Öldüğünde mizaç bozuldu ve durumu kötüleşti, ta ki ölene kadar."
  id: "Abu al-Hasan Muhammad ibn Abdullah ibn al-Harith ibn Abdullah ibn al-Walid ibn al-Walid ibn al-Mughira al-Makhzumi al-Salami, yang dikaitkan dengan Dar al-Salam di Baghdad; penyair terkenal yang merupakan keturunan al-Walid ibn al-Mughira, saudara Khalid ibn al-Walid. Al-Tha'alibi berkata tentangnya: Ia adalah salah satu yang paling puitis dalam bahasa mutlak rakyat Irak; ia menulis puisi pada usia sepuluh tahun, tumbuh besar di Baghdad, dan pergi ke Mosul saat kecil dan bertemu dengan para sheikh penyair termasuk Abu Affan al-Khalidi, Abu al-Faraj al-Sagha, dan Abu al-Hasan al-Tal'afari. Ia mendatangi sahabat Ibn Abbad di Isfahan dan memuji 'Adud al-Dawla. Ketika ia meninggal, temperamennya menurun dan kondisinya memburuk hingga ia meninggal."
