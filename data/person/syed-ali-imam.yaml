summary:
  ar: "محامٍ وسياسي هندي (1869–1932) من قرية قرب باتنا، الأخ الأكبر لسيد حسن إمام. درس القانون في لندن وصار العضو القانوني في حكومة الهند، ثم قاضيًا في محكمة باتنا العليا، ثم رئيس وزراء دولة حيدرآباد 1919–1922، وكان من بناة بيهار الحديثة ومثّل الهند في مؤتمر المائدة المستديرة سنة 1929."
  en: "Indian barrister and politician (1869–1932) from a village near Patna, elder brother of Syed Hasan Imam. He studied law in London, became law member of the Government of India, then a judge of the Patna High Court and Prime Minister of Hyderabad State from 1919 to 1922; he was among the makers of modern Bihar and represented India at the 1929 Round Table Conference."
  ur: "پٹنہ کے قریب ایک گاؤں سے تعلق رکھنے والے ہندوستانی بیرسٹر اور سیاست دان ⁦(1869ء–1932ء)⁩، سید حسن امام کے بڑے بھائی۔ انھوں نے لندن میں قانون پڑھا، حکومتِ ہند کے قانون رکن بنے، پھر پٹنہ ہائی کورٹ کے جج اور 1919ء سے 1922ء تک ریاستِ حیدرآباد کے وزیرِ اعظم رہے؛ وہ جدید بہار کے معماروں میں سے تھے اور 1929ء کی گول میز کانفرنس میں ہندوستان کی نمائندگی کی۔"
