summary:
  ar: "رافع أثقال تركي وُلد في بلغاريا سنة 1967 وتوفي في إسطنبول سنة 2017. فرّ إلى تركيا سنة 1986 هربًا من سياسة تغيير الأسماء القسرية، فأصبح بطلًا أولمبيًا ثلاث مرات وبطل عالم سبع مرات وصاحب 51 رقمًا قياسيًا عالميًا، ولُقّب «هرقل الجيب» لقصره وقوته الخارقة."
  en: "Turkish weightlifter born in Bulgaria in 1967, died in Istanbul in 2017. He defected to Turkey in 1986 to escape Bulgaria's forced name-changing campaign, and became a three-time Olympic champion and seven-time world champion who set 51 world records, nicknamed 'Pocket Hercules' for his short stature and extraordinary strength."
  ur: "ترک ویٹ لفٹر جو 1967 میں بلغاریہ میں پیدا ہوئے اور 2017 میں استنبول میں انتقال کر گئے۔ وہ 1986 میں ناموں کی جبری تبدیلی کی مہم سے بچ کر ترکی فرار ہوئے، اور تین بار اولمپک چیمپئن اور سات بار عالمی چیمپئن بنے، جنہوں نے 51 عالمی ریکارڈ قائم کیے۔"
  es: "El levantador de pesas turco, nacido en Bulgaria en 1967, falleció en Estambul en 2017. Desertó a Turquía en 1986 para escapar de la campaña de cambio de nombre forzoso de Bulgaria, y se convirtió en tres veces campeón olímpico y siete veces campeón mundial, estableciendo 51 récords mundiales. Fue apodado \"Hércules de bolsillo\" por su baja estatura y extraordinaria fuerza."
  fr: "Haltérophile turc né en Bulgarie en 1967, décédé à Istanbul en 2017. Il a fait défection en Turquie en 1986 pour échapper à la campagne de changement de nom forcé menée par la Bulgarie, et est devenu trois fois champion olympique et sept fois champion du monde, établissant 51 records du monde, surnommé « Hercule de poche » en raison de sa petite taille et de sa force extraordinaire."
  tr: "1967'de Bulgaristan'da doğan ve 2017'de İstanbul'da vefat eden Türk halterci. 1986'da zorunlu isim değişikliği politikasından kaçmak için Türkiye'ye kaçtı, üç kez Olimpiyat şampiyonu, yedi kez dünya şampiyonu oldu, 51 dünya rekoru tuttu ve kısa boyu ile olağanüstü gücü nedeniyle 'Herkül Cebi' lakabını aldı."
  id: "Seorang atlet angkat besi Turki yang lahir di Bulgaria pada tahun 1967 dan meninggal di Istanbul pada tahun 2017. Ia melarikan diri ke Turki pada tahun 1986 untuk menghindari kebijakan perubahan nama paksa, menjadi juara Olimpiade tiga kali, juara dunia tujuh kali, memegang 51 rekor dunia, dan dijuluki 'Hercules the Pocket' karena postur tubuhnya yang pendek dan kekuatan luar biasa."
