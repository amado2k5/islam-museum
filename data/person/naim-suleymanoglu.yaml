summary:
  ar: "رافع أثقال تركي وُلد في بلغاريا سنة 1967 وتوفي في إسطنبول سنة 2017. فرّ إلى تركيا سنة 1986 هربًا من سياسة تغيير الأسماء القسرية، فأصبح بطلًا أولمبيًا ثلاث مرات وبطل عالم سبع مرات وصاحب 51 رقمًا قياسيًا عالميًا، ولُقّب «هرقل الجيب» لقصره وقوته الخارقة."
  en: "Turkish weightlifter born in Bulgaria in 1967, died in Istanbul in 2017. He defected to Turkey in 1986 to escape Bulgaria's forced name-changing campaign, and became a three-time Olympic champion and seven-time world champion who set 51 world records, nicknamed 'Pocket Hercules' for his short stature and extraordinary strength."
  ur: "ترک ویٹ لفٹر جو 1967 میں بلغاریہ میں پیدا ہوئے اور 2017 میں استنبول میں انتقال کر گئے۔ وہ 1986 میں ناموں کی جبری تبدیلی کی مہم سے بچ کر ترکی فرار ہوئے، اور تین بار اولمپک چیمپئن اور سات بار عالمی چیمپئن بنے، جنہوں نے 51 عالمی ریکارڈ قائم کیے۔"
