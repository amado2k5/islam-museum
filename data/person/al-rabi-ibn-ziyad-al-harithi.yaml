summary:
  ar: "الربيع بن زياد الحارثي؛ في رواية أن أبا موسى الأشعري وجهه إلى الأساورة لما انحازوا إلى الكلبانية فقاتلهم ثم إنهم استأمنوا على أن يسلموا ويحاربوا المدوس ويحالفوا من شاءوا وينزلوا حيث أحبوا."
  en: "Al-Rabi' ibn Ziyad al-Harithi; in one telling Abu Musa sent him against the asawira at al-Kalbaniyya — he fought them till they sought aman on conversion, war against the Medes, free alliance and free settlement."
  fr: "Al-Rabi' ibn Ziyad al-Harithi ; dans l'un des récits Abu Moussa l'a envoyé contre l'asawira à al-Kalbaniyya - il les a combattus jusqu'à ce qu'ils cherchent un homme sur la conversion, la guerre contre les Mèdes, la libre alliance et la libre colonisation."
  es: "Al-Rabi' ibn Ziyad al-Harithi; en un relato, Abu Musa lo envió contra los asawira en al-Kalbaniyya; luchó contra ellos hasta que buscaron la paz en la conversión, la guerra contra los medos, la alianza libre y el asentamiento libre."
  ur: "الربیع ابن زیاد الحارثی؛ ایک یہ کہنے میں کہ ابو موسیٰ نے اسے الکلبانیہ میں عسویرہ کے خلاف بھیجا - وہ ان سے اس وقت تک لڑتا رہا جب تک کہ وہ مذہب کی تبدیلی، میڈیس کے خلاف جنگ، آزاد اتحاد اور آزاد آبادکاری پر امن کی تلاش میں نہ رہے۔"
  tr: "El-Rabi' bin Ziyad el-Harithi; bir rivayette, Ebu Musa el-Eş'ari, bilezikler Kalbanilerin yanında olduğunda dikkatini vermiş ve onlarla savaşmıştır. Sonra kendilerini teslim olmaya, ezilmişlerle savaşmaya, istediklerine ittifak kurmaya ve istedikleri yere yerleşmeye ikna etmeye ikna etmişlerdir."
  id: "Al-Rabi' ibn Ziyad al-Harithi; dalam sebuah riwayat, Abu Musa al-Ash'ari mengalihkan perhatiannya pada gelang ketika mereka berpihak pada Kalbani, sehingga ia melawan. Kemudian mereka meyakinkan diri untuk menyerah, melawan yang terinjak-injak, bersekutu dengan siapa pun yang mereka inginkan, dan menetap di mana pun mereka mau."
