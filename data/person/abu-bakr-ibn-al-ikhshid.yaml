id: person/abu-bakr-ibn-al-ikhshid
class: person
label: { ar: "أبو بكر بن الإخشيد", en: "Abu Bakr Ibn Al Ikhshid", fr: "Abu Bakr Ibn al-Ikhshid", es: "Abu Bakr Ibn Al Ikhshid", ur: "ابوبکر ابن الخشد" }
summary:
  ar: "أبو بكر بن الإخشيد، قال إن الاعتزال لحق بالمعتزلة في أيام الحسن على ما ذكره قوم ولم يصح عندنا، والمشهور عند علمائنا أن ذلك اسم حدث بعد الحسن وسببه أن عمرو بن عبيد لما مات الحسن وجلس قتادة مجلسه اعتزله عمرو ونفر معه فسماها قتادة المعتزلة {cite:fihrist-ibn-al-nadim p. 557}."
  en: "Mu'tazili authority — his account that the name postdates al-Hasan and began with Qatada naming Amr's secession {cite:fihrist-ibn-al-nadim}"
  fr: "Autorité mu'tazilite — son récit selon lequel le nom est postérieur à al-Hasan et vint de ce que Qatada désigna ainsi la sécession d'Amr {cite:fihrist-ibn-al-nadim}"
  es: "Autoridad Mu'tazili: su relato de que el nombre es posterior a al-Hasan y comenzó cuando Qatada nombró la secesión de Amr {cite:fihrist-ibn-al-nadim}"
  ur: "معتزلی اتھارٹی - اس کا اکاؤنٹ جس کا نام الحسن کے بعد ہے اور اس کا آغاز قتادہ نے عمرو کی علیحدگی کے نام سے کیا ہے۔"
  tr: "Ebu Bekr İbn el-İhşid, bazı kişilerin belirttiği gibi, “el-İ'tizal” teriminin Hasan döneminde Mu'tezile için kullanıldığını söylemiştir; ancak bize göre bu doğru değildir. Alimlerimiz arasında bilinen şudur ki, bu isim Hasan'dan sonra ortaya çıkmıştır ve bunun sebebi, Hasan öldüğünde yerine Katade geçtiğinde, Amr İbn Ubeyd ve onunla birlikte bir grup insan ondan ayrılmış, bu yüzden Katade onlara Mu'tezile demiştir. {Kaynak: Fıhrist İbn el-Nadim, s. 557}"
  id: "Abu Bakr Ibn al-Ikhshid mengatakan bahwa istilah “al-I’tizal” diterapkan pada Mu’tazila pada masa al-Hasan, sebagaimana disebutkan oleh sebagian orang, tetapi menurut kami hal itu tidak benar. Yang diketahui secara luas di kalangan ulama kami adalah bahwa nama ini muncul setelah al-Hasan, dan alasannya adalah ketika al-Hasan wafat dan Qatada menggantikannya, Amr Ibn Ubayd meninggalkannya bersama sekelompok orang, sehingga Qatada menyebut mereka Mu’tazila. {kutipan:fihrist-ibn-al-nadim hlm. 557}."
