label: { ar: "أبو بكر بن الإخشيد", en: "Abu Bakr Ibn Al Ikhshid" }
summary:
  ar: "أبو بكر بن الإخشيد، قال إن الاعتزال لحق بالمعتزلة في أيام الحسن على ما ذكره قوم ولم يصح عندنا، والمشهور عند علمائنا أن ذلك اسم حدث بعد الحسن وسببه أن عمرو بن عبيد لما مات الحسن وجلس قتادة مجلسه اعتزله عمرو ونفر معه فسماها قتادة المعتزلة {cite:fihrist-ibn-al-nadim p. 557}."
  en: "Mu'tazili authority — his account that the name postdates al-Hasan and began with Qatada naming Amr's secession {cite:fihrist-ibn-al-nadim}"
