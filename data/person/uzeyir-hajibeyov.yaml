summary:
  ar: "ملحن وعالم موسيقى أذربيجاني (1885–1948)، يُعدّ مؤسس الموسيقى الكلاسيكية الأذربيجانية؛ كتب «ليلى ومجنون» (1908)، أول أوبرا في العالم الإسلامي، ولحّن نشيد أذربيجان الوطني، وأسس معهد باكو للموسيقى سنة 1920، وله أوبرا «كوروغلو» (1937) وأوبريت «أرشين مال ألان» (1913)."
  en: "Azerbaijani composer and musicologist (1885–1948), the founder of Azerbaijani classical music. His Leyli and Majnun (1908) was the first opera in the Islamic world; he composed the music of Azerbaijan's national anthem, founded the Baku conservatoire in 1920, and wrote the opera Koroghlu (1937) and the operetta Arshin Mal Alan (1913)."
  ur: "آذربائیجانی موسیقار اور موسیقی شناس (1885–1948)، آذربائیجانی کلاسیکی موسیقی کے بانی۔ ان کی «لیلی و مجنون» (1908) عالم اسلام کی پہلی اوپیرا تھی؛ انہوں نے آذربائیجان کے قومی ترانے کی دھن بنائی، 1920 میں باکو کی موسیقی اکیڈمی کی بنیاد رکھی، اور اوپیرا «کوروغلو» (1937) اور اوپیریٹا «ارشین مال الان» (1913) لکھے۔"
