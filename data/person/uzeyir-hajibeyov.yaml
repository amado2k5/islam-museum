summary:
  ar: "ملحن وعالم موسيقى أذربيجاني (1885–1948)، يُعدّ مؤسس الموسيقى الكلاسيكية الأذربيجانية؛ كتب «ليلى ومجنون» (1908)، أول أوبرا في العالم الإسلامي، ولحّن نشيد أذربيجان الوطني، وأسس معهد باكو للموسيقى سنة 1920، وله أوبرا «كوروغلو» (1937) وأوبريت «أرشين مال ألان» (1913)."
  en: "Azerbaijani composer and musicologist (1885–1948), the founder of Azerbaijani classical music. His Leyli and Majnun (1908) was the first opera in the Islamic world; he composed the music of Azerbaijan's national anthem, founded the Baku conservatoire in 1920, and wrote the opera Koroghlu (1937) and the operetta Arshin Mal Alan (1913)."
  ur: "آذربائیجانی موسیقار اور موسیقی شناس (1885–1948)، آذربائیجانی کلاسیکی موسیقی کے بانی۔ ان کی «لیلی و مجنون» (1908) عالم اسلام کی پہلی اوپیرا تھی؛ انہوں نے آذربائیجان کے قومی ترانے کی دھن بنائی، 1920 میں باکو کی موسیقی اکیڈمی کی بنیاد رکھی، اور اوپیرا «کوروغلو» (1937) اور اوپیریٹا «ارشین مال الان» (1913) لکھے۔"
  es: "Compositor y musicólogo azerbaiyano (1885-1948), fundador de la música clásica azerbaiyana. Su obra Leyli y Majnun (1908) fue la primera ópera del mundo islámico; compuso la música del himno nacional de Azerbaiyán, fundó el conservatorio de Bakú en 1920 y escribió la ópera Koroghlu (1937) y la opereta Arshin Mal Alan (1913)."
  fr: "Compositeur et musicologue azerbaïdjanais (1885-1948), fondateur de la musique classique azerbaïdjanaise. Son opéra Leyli et Majnun (1908) fut le premier opéra du monde islamique; il composa la musique de l'hymne national de l'Azerbaïdjan, fonda le conservatoire de Bakou en 1920 et écrivit l'opéra Koroghlu (1937) et l'opérette Arshin Mal Alan (1913)."
  tr: "Azerbaycanlı besteci ve müzikolog (1885–1948), Azerbaycan klasik müziğinin kurucusu olarak kabul edilir; İslam dünyasının ilk operası olan 'Leyla ve Mecnun'u (1908) yazdı, Azerbaycan'ın milli marşını besteledi, 1920'de Bakü Müzik Enstitüsü'nü kurdu ve 'Kuroğlu' operası (1937) ile 'Arshin Mal Alan' (1913) operetini besteledi."
  id: "Seorang komponis dan musikolog Azerbaijan (1885–1948), yang dianggap sebagai pendiri musik klasik Azerbaijan; ia menulis 'Layla and Majnun' (1908), opera pertama di dunia Islam, menggubah lagu kebangsaan Azerbaijan, mendirikan Institut Musik Baku pada tahun 1920, dan menggubah opera 'Kuroglu' (1937) serta operet 'Arshin Mal Alan' (1913)."
