  note: "Born at Aghjabadi, near Shusha. The English and Arabic articles give 18 September 1885 and the Azerbaijani article's lead agrees, printing it as 5 (18) September; but the Azerbaijani article also reports that the Great Soviet Encyclopedia gives 17 September, and that his metrical certificate, issued by the Transcaucasian Muslim Spiritual Administration, records the birth as 7 Dhu al-Hijja 1302, which is 5 September Old Style, 17 September New Style. Wikidata carries both 17 and 18 September values. The record follows 18 September, with the 17 September reading disclosed. The Hijri year 1302 is the certificate's own year, not a conversion. The museum has no place entity for Aghjabadi or Shusha, so no born_in edge is written."
