summary:
  ar: "عبد الكريم قاسم (21 نوفمبر 1914 – 9 فبراير 1963)، ضابط عراقي قاد ثورة 14 يوليو 1958 التي أطاحت بالملكية الهاشمية، ثم تولى رئاسة الوزراء وقيادة القوات المسلحة في الجمهورية العراقية حتى أطاح به انقلاب البعث في فبراير 1963 فأُعدم بعد محاكمة قصيرة. اتسم حكمه بإصلاحات اجتماعية وأرضية واسعة وبصراع مع التيار القومي العربي ومع الشيوعيين على السواء."
  en: "Abdul-Karim Qasim (21 November 1914 – 9 February 1963) was an Iraqi army officer who led the revolution of 14 July 1958 that overthrew the Hashemite monarchy, then served as prime minister and commander-in-chief of the Iraqi Republic until the Ba'ath coup of February 1963, after which he was executed following a short trial. His rule brought sweeping social and agrarian reforms and a balancing contest with both the pan-Arab nationalists and the communists."
  ur: "عبد الکریم قاسم (21 نومبر 1914ء – 9 فروری 1963ء) ایک عراقی فوجی افسر تھے جنہوں نے 14 جولائی 1958ء کے انقلاب کی قیادت کی جس نے ہاشمی بادشاہت کا خاتمہ کیا، پھر جمہوریۂ عراق کے وزیرِ اعظم اور مسلح افواج کے سربراہ رہے یہاں تک کہ فروری 1963ء میں بعث بغاوت نے انہیں ہٹا دیا اور مختصر مقدمے کے بعد انہیں پھانسی دی گئی۔ ان کے دور میں وسیع سماجی و زمینی اصلاحات ہوئیں اور وہ عرب قوم پرستوں اور کمیونسٹوں دونوں کے مقابل توازن برقرار رکھنے کی کوشش کرتے رہے۔"
