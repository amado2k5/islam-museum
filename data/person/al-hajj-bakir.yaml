summary:
  ar: "الرجل الذي أجمع عليه أهل الديوان في الجزائر حاكماً مكان حسن آغا الطوشي عند وفاته سنة ٩٥١هـ/١٥٤٤م، ريثما عيّن الباب العالي في استانبول الحاكم الجديد — فكان حسن بن خير الدين بربروسة، قادماً في السنة نفسها {cite:dawlat-uthmaniyya-salabi p. 229}."
  en: "The man Algiers' diwan chose unanimously as governor on Hasan Agha al-Tushi's death in 951/1544, holding office until the Sublime Porte's appointee — Hasan b. Khayr al-Din — arrived that same year {cite:dawlat-uthmaniyya-salabi p. 229}."
  fr: "Homme choisi unanimement comme gouverneur par le diwan d’Alger à la mort de Hasan Agha al-Tushi en 951 H/1544, en fonction jusqu’à l’arrivée la même année du titulaire nommé par la Sublime Porte, Hasan ibn Khayr al-Din {cite:dawlat-uthmaniyya-salabi p. 229}."
  es: "El hombre que el diwan de Argel eligió por unanimidad como gobernador tras la muerte de Hasan Agha al-Tushi en 951/1544, y que ocupó el cargo hasta la llegada del designado por la Sublime Puerta, Hasan b. Khayr al-Din, ese mismo año {cite:dawlat-uthmaniyya-salabi p. 229}."
  ur: "الجزائر کے دیوان نے 951/1544 میں حسن آغا الطوسی کی وفات پر متفقہ طور پر گورنر کے طور پر انتخاب کیا، جو سبلائم پورٹے کے مقرر ہونے تک اس عہدے پر فائز رہا۔ خیرالدین اسی سال آیا۔ 229}۔"
  tr: "Cezayir Divanı halkının, 951 Hicri/1544 Miladi yılında vefat eden Hasan Ağa el-Tuşi'nin yerine, İstanbul'daki Osmanlı Devleti yeni hükümdarı atayana kadar, onun yerine yönetici olarak kabul ettiği kişi; aynı yıl gelen Hasan bin Hayr ed-Din Barbarossa idi. {cite:dawlat-uthmaniyya-salabi s. 229}"
  id: "Orang yang dipilih oleh masyarakat Diwan di Aljazair sebagai penguasa pengganti Hassan Agha Al-Tushi setelah kematiannya pada tahun 951 H/1544 M, hingga Gerbang Agung di Istanbul menunjuk penguasa baru — dan dia adalah Hassan bin Khayr ad-Din Barbarossa, yang datang pada tahun yang sama {cite:dawlat-uthmaniyya-salabi p. 229}."
