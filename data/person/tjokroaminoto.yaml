summary:
  ar: "قومي إندونيسي (1882–1934)، من موظفي الخدمة المدنية في جزر الهند الهولندية ثم شريك مؤسس لشريكة الإسلام ورئيسها الطويل، حوّلها إلى أول حركة جماهيرية في البلاد، وكان بيته في سورابايا مدرسة لقادة الاستقلال ومنهم سوكارنو، ولقّبه الهولنديون «ملك جاوة بلا تاج»، وتوفي في يوجياكارتا سنة 1934."
  en: "Indonesian nationalist (1882–1934) who left the Dutch East Indies civil service to co-found and long chair Sarekat Islam, turning it into the country's first mass movement; his Surabaya household schooled a generation of independence leaders, among them Sukarno, and the Dutch called him the 'Crownless King of Java'. He died at Yogyakarta in 1934."
  ur: "انڈونیشی قوم پرست رہنما (1882ء–1934ء)، ولندیزی مشرقی ہند کی سول سروس چھوڑ کر شریکۃ اسلام کے شریک بانی اور طویل عرصے اس کے صدر رہے اور اسے ملک کی پہلی عوامی تحریک بنایا؛ سورابایا میں ان کے گھر نے آزادی کے رہنماؤں کی ایک نسل کو تربیت دی جن میں سوکارنو بھی تھے، ولندیزی انہیں «جاوا کا بے تاج بادشاہ» کہتے تھے؛ 1934ء میں یوگیاکارتا میں وفات پائی۔"
