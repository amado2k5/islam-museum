summary:
  ar: "ضابط وسياسي باكستاني (1907–1974)، أول قائد عام باكستاني المولد للجيش (1951–1958)، تولى رئاسة باكستان من أكتوبر 1958 حتى استقالته تحت ضغط الاحتجاجات في مارس 1969 في أطول رئاسة في تاريخ البلاد، وارتبط عهده بالنمو الصناعي وبدستور 1962 وبحرب 1965 مع الهند. توفي قرب إسلام آباد في 19 أبريل 1974 ودُفن في قريته ريهانا بمقاطعة هاريبور."
  en: "Pakistani officer and politician (1907–1974), the first native-born commander-in-chief of the Pakistan Army (1951–1958), who held the presidency of Pakistan from October 1958 until his resignation amid mass protests in March 1969 — the country's longest presidency — in a tenure marked by industrial growth, the 1962 constitution and the 1965 war with India. He died near Islamabad on 19 April 1974 and was buried in his village of Rehana, Haripur District."
  ur: "پاکستانی فوجی افسر اور سیاست دان (1907ء–1974ء)، پاک فوج کے پہلے مقامی کمانڈر انچیف (1951ء–1958ء)، اکتوبر 1958ء سے مارچ 1969ء میں عوامی احتجاج کے سامنے استعفے تک پاکستان کے صدر رہے — ملک کی طویل ترین صدارت — جن کا عہد صنعتی ترقی، 1962ء کے آئین اور بھارت سے 1965ء کی جنگ سے جڑا ہے۔ 19 اپریل 1974ء کو اسلام آباد کے قریب وفات پائی اور ضلع ہری پور کے اپنے گاؤں ریحانہ میں دفن ہوئے۔"
