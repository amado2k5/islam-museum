summary:
  ar: "عثمان بن أرطغرل ⁦(٦٥٦هـ/١٢٥٨م – نحو ٧٢٦هـ/١٣٢٦م)⁩؛ مؤسس الدولة العثمانية، ولد عام سقوط بغداد بيد المغول. لما تنادى أمراء النصارى في بورصة ومادانوس وأدره نوس لمحاربته سنة ٧٠٠هـ/١٣٠١م تقدم بجنوده وشتت الجيوش المتحالفة حتى صارت بسالته مضرب المثل عند العثمانيين. نال رتبة الإمارة من سلطان سلاجقة الروم علاء الدين فسُكت له العملة باسمه ودُعي له في خطبة الجمعة. فتح في سنة ٧٠٧هـ حصون كته ولفكه وآق حصار وقوج حصار، وتوج فتوحاته بفتح مدينة بروسة سنة ٧١٧هـ/١٣١٧م بعد حصار شديد دام سنين، واعتنق قائد حاميتها إقرينوس الإسلام فأعطاه لقب «بك» وصار من قادة الدولة. وانخرطت تحت لوائه جماعات المرابطة على الثغور: غزاة الروم والإخوان وحجاج أرض الروم {cite:dawlat-uthmaniyya-salabi p. 45-52}."
  en: "Osman I (1258–c. 1326 CE) — born the year Baghdad fell, raised to the emirate by the Rum Seljuk Ala al-Din, victor over the Byzantine coalition of 1301, and conqueror of Bursa in 1317 after years of siege {cite:dawlat-uthmaniyya-salabi p. 45-52}."
  es: "Osman I (1258–c. 1326 d. C.) — nació el año en que cayó Bagdad, fue elevado al emirato por el Rum Seljuk Ala al-Din, vencedor de la coalición bizantina de 1301 y conquistador de Bursa en 1317 después de años de asedio {cite:dawlat-uthmaniyya-salabi p. 45-52}."
  fr: "Osman Ier (1258–c. 1326 CE) — né l'année de la chute de Bagdad, élevé à l'émirat par le Seldjoukide de Roum Ala al-Din, vainqueur de la coalition byzantine de 1301 et conquérant de Bursa en 1317 après des années de siège {cite:dawlat-uthmaniyya-salabi p. 45-52}."
  ur: "عثمان اول ⁦(1258-c. 1326 عیسوی)⁩ - بغداد کے گرنے کے سال پیدا ہوا، 1301 کے بازنطینی اتحاد پر فاتح، روم سلجوق علاء الدین کی امارت میں پرورش پائی، اور برسوں کے محاصرے کے بعد 1317 میں برسا کا فاتح ہوا۔ 45-52}۔"
  tr: "Osman ibn Ertuğrul (656 Hicri / 1258 M.S. – yaklaşık 726 Hicri / 1326 M.S.), Osmanlı devletinin kurucusuydu ve Bağdat'ın Moğolların eline geçtiği yıl doğdu. 700 Hicri / 1301 yılında Bursa ve Madanos'taki Hristiyan prensler ona savaş çağrısı yaptığında, askerleriyle birlikte ilerledi ve müttefik orduları dağıttı; cesareti Osmanlılar arasında bir örnek haline geldi. Emirlik rütbesini, Rum Selçuklu Sultanı Ala al-Din'den aldı; Rum Sultanı onun adına susturuldu ve Cuma vaazına davet edildi. 707 Hicri'de Kate, Lafka, Ak Hisar ve Kuj Hisar kalelerini fethetti ve yıllarca süren şiddetli bir kuşatmanın ardından 717 Hicri/1317 M.S.'de Brosa şehrini ele geçirerek fetihlerini tamamladı. Garnizon komutanı İkrinos İslam'a geçti, ona 'Bey' unvanını verdi ve devletin liderlerinden biri oldu. Onun bayrağı altında sınırda konuşlanmış gruplara katıldı: Roma istilacıları, İhvan ve Romalıların topraklarından gelen hacılar {cite:dawlat-uthmaniyya-salabi, s. 45-52}."
  id: "Osman ibn Ertugrul (656 H / 1258 M – sekitar 726 H / 1326 M) adalah pendiri negara Ottoman, lahir pada tahun Baghdad jatuh ke tangan Mongol. Ketika para pangeran Kristen di Bursa dan Madanos menyerukan perang melawannya pada 700 H / 1301 M, ia maju bersama tentaranya dan membubar-berai pasukan sekutu hingga keberaniannya menjadi contoh di kalangan Ottoman. Ia memperoleh pangkat emirat dari Sultan Seljuk Rum, Ala al-Din, yang dibungkam atas namanya dan diundang ke khotbah Jumat. Pada tahun 707 H, ia menaklukkan benteng Kate, Lafka, Ak Hisar, dan Kuj Hisar, yang berpuncak pada penaklukannya dengan merebut kota Brosa pada tahun 717 H/1317 M setelah pengepungan berat yang berlangsung bertahun-tahun. Komandan garnisunnya, Iqrinos, yang memeluk Islam, memberinya gelar 'Bey,' dan menjadi salah satu pemimpin negara. Di bawah panjinya bergabung dengan kelompok-kelompok yang ditempatkan di perbatasan: penjajah Romawi, Ikhwan, dan peziarah dari tanah Romawi {cite:dawlat-uthmaniyya-salabi, hlm. 45-52}."
