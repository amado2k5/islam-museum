summary:
  ar: "عثمان بن أرطغرل (٦٥٦هـ/١٢٥٨م – نحو ٧٢٦هـ/١٣٢٦م)؛ مؤسس الدولة العثمانية، ولد عام سقوط بغداد بيد المغول. لما تنادى أمراء النصارى في بورصة ومادانوس وأدره نوس لمحاربته سنة ٧٠٠هـ/١٣٠١م تقدم بجنوده وشتت الجيوش المتحالفة حتى صارت بسالته مضرب المثل عند العثمانيين. نال رتبة الإمارة من سلطان سلاجقة الروم علاء الدين فسُكت له العملة باسمه ودُعي له في خطبة الجمعة. فتح في سنة ٧٠٧هـ حصون كته ولفكه وآق حصار وقوج حصار، وتوج فتوحاته بفتح مدينة بروسة سنة ٧١٧هـ/١٣١٧م بعد حصار شديد دام سنين، واعتنق قائد حاميتها إقرينوس الإسلام فأعطاه لقب «بك» وصار من قادة الدولة. وانخرطت تحت لوائه جماعات المرابطة على الثغور: غزاة الروم والإخوان وحجاج أرض الروم {cite:dawlat-uthmaniyya-salabi p. 45-52}."
  en: "Osman I (1258–c. 1326 CE) — born the year Baghdad fell, raised to the emirate by the Rum Seljuk Ala al-Din, victor over the Byzantine coalition of 1301, and conqueror of Bursa in 1317 after years of siege {cite:dawlat-uthmaniyya-salabi p. 45-52}."
