summary:
  ar: "الحبيب بورقيبة (1903–2000)، سياسي تونسي قاد حركة الاستقلال عن فرنسا، فكان رئيس وزراء المملكة سنة 1956، ثم أعلن الجمهورية في 25 يوليو 1957 فصار أول رئيس لتونس وحكم ثلاثين عاما، أقرّ فيها مجلة الأحوال الشخصية وبنى دولة الحزب الواحد، حتى عزله رئيس وزرائه زين العابدين بن علي سنة 1987، فأقام تحت الإقامة الجبرية في المنستير حتى وفاته."
  en: "Habib Bourguiba (1903–2000) was the Tunisian politician who led the independence movement against France, became prime minister of the kingdom in 1956, then proclaimed the republic on 25 July 1957 and served as Tunisia's first president for thirty years, enacting the Code of Personal Status and building a one-party state, until his prime minister Zine El Abidine Ben Ali removed him in 1987; he lived under house arrest at Monastir until his death."
  ur: "حبیب بورقیبہ (1903ء–2000ء) تیونس کے سیاست دان تھے جنہوں نے فرانس سے آزادی کی تحریک کی قیادت کی، 1956ء میں مملکت کے وزیر اعظم بنے، پھر 25 جولائی 1957ء کو جمہوریہ کا اعلان کر کے تیونس کے پہلے صدر بنے اور تیس برس حکومت کی۔ 1987ء میں ان کے وزیر اعظم زین العابدین بن علی نے انہیں ہٹا دیا، اور وہ وفات تک منستر میں نظر بند رہے۔"
