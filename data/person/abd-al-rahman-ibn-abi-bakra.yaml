summary:
  ar: "عبد الرحمن بن أبي بكرة؛ أول مولود ولد بالبصرة حين نزل عتبة بن غزوان الخريبة فنحر أبوه جزوراً أشبع منها أهل البصرة."
  en: "Abd al-Rahman ibn Abi Bakra; the first child born at Basra when Utba lodged at al-Khurayba — his father slaughtered a camel that fed the town."
  fr: "Abd al-Rahman ibn Abi Bakra ; le premier enfant né à Bassora lorsqu'Utba s'établit à al-Khurayba — son père égorgea un chameau qui nourrit la ville."
  es: "Abd al-Rahman ibn Abi Bakra; el primer niño nacido en Basora cuando Utba se alojó en al-Khurayba; su padre sacrificó un camello que alimentaba a la ciudad."
  ur: "عبدالرحمٰن بن ابی بکرہ؛ بصرہ میں پیدا ہونے والا پہلا بچہ جب عتبہ نے الخرائبہ میں قیام کیا - اس کے والد نے ایک اونٹ کو ذبح کیا جس سے شہر کو کھانا کھلایا جاتا تھا۔"
  tr: "Abdülrahman ibn Abi Bakra; Utbah ibn Gazvan'ın el-Khuraybah'a yerleştiği zaman Basra'da doğan ilk çocuktur; babası bir deve kesip Basra halkını doyurmuştur."
  id: "Abd al-Rahman ibn Abi Bakra; anak pertama yang lahir di Basra ketika Utbah ibn Ghazwan menetap di al-Khuraybah, dan ayahnya menyembelih seekor unta dan memberi makan penduduk Basra."
