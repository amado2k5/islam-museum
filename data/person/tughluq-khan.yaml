summary:
  ar: "بطاقة أولية لتغلق خان ⁦(غياث الدين)⁩، سلطان دلهي الرابع من بني تغلق الذي خلف فيروز شاه في أواخر القرن الرابع عشر، توفي سنة ١٣٨٩م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Tughluq Khan (Ghiyath al-Din), fourth Tughlaq sultan of Delhi succeeding Firuz Shah in the late fourteenth century, d. 1389; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Tughluq Khan (Ghiyath al-Din), cuarto sultán Tughlaq de Delhi que sucedió a Firuz Shah a finales del siglo XIV, fallecido en 1389; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature pour Tughluq Khan (Ghiyath al-Din), quatrième sultan Tughlaq de Delhi succédant à Firuz Shah à la fin du XIVe siècle, mort en 1389; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "دہلی کے چوتھے تغلق سلطان تغلق خان ⁦(غیث الدین)⁩ کے لیے ڈرافٹ کارڈ جو چودھویں صدی کے اواخر میں فیروز شاہ کے بعد آنے والا تھا۔ 1389; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
