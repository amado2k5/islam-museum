summary:
  ar: "أبو عبد الله محمد بن أبي القاسم الخضر بن محمد بن الخضر بن علي بن عبد الله، المعروف بابن شيمبة الحراني، الملقب فخر الدين ابن تيمية؛ الخطيب الواعظ الفقيه الحنبلي والد شيخ الإسلام تقي الدين ابن تيمية؛ كان فاضلاً تفرد في بلده بالعلم والمشار إليه في الدين؛ تفقه ببغداد على أبي الفتح ابن المني وسمع الحديث من شهدة بنت الإبري وابن المقرب وابن البطي؛ صنف في مذهب الإمام أحمد مختصراً أحسن فيه، وله ديوان خطب مشهور في غاية الجودة وتفسير القرآن ونظم حسن؛ كانت إليه الخطابة بحران ولأهله من بعده {cite:wafayat-ayan}."
  en: "Fakhr al-Din Ibn Taymiyya (552–621) — Hanbali khatib and preacher of Harran, father of Taqi al-Din Ibn Taymiyya; trained in Baghdad under Ibn al-Manni; author of a fiqh compendium, a celebrated diwan of sermons and a Quran commentary {cite:wafayat-ayan}."
