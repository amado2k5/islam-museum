summary:
  ar: "أبو عبد الله محمد بن أبي القاسم الخضر بن محمد بن الخضر بن علي بن عبد الله، المعروف بابن شيمبة الحراني، الملقب فخر الدين ابن تيمية؛ الخطيب الواعظ الفقيه الحنبلي والد شيخ الإسلام تقي الدين ابن تيمية؛ كان فاضلاً تفرد في بلده بالعلم والمشار إليه في الدين؛ تفقه ببغداد على أبي الفتح ابن المني وسمع الحديث من شهدة بنت الإبري وابن المقرب وابن البطي؛ صنف في مذهب الإمام أحمد مختصراً أحسن فيه، وله ديوان خطب مشهور في غاية الجودة وتفسير القرآن ونظم حسن؛ كانت إليه الخطابة بحران ولأهله من بعده {cite:wafayat-ayan}. وفي الشذرات شيخ حران وخطيبها ولد في أواخر شعبان سنة اثنتين وأربعين وخمسمائة وقرأ القرآن على والده وله نحو عشر سنين، وأخذ في التدريس والوعظ والتصنيف وإلقاء التفسير بكرة كل يوم بجامع حران حتى فسر القرآن العظيم خمس مرات، وله التفسير الكبير في أكثر من ثلاثين مجلداً وثلاث مصنفات في المذهب والموضح في الفرائض، وبينه وبين الموفق ابن قدامة كلام ورسائل في مسألة خلود أهل البدع المحكوم بكفرهم في النار كان يقول بخلودهم والموفق لا يطلق عليهم الخلود؛ توفي يوم الخميس عاشر صفر بحران وقال ولده عبد الغني مات في الصلاة فأخذه إلى صدره فكبر وجعل يحرك حاجبه وشفتيه بالصلاة حتى شخص بصره {cite:shadharat-dhahab p. 102-103}."
  en: "Fakhr al-Din Ibn Taymiyya (552–621) — Hanbali khatib and preacher of Harran, father of Taqi al-Din Ibn Taymiyya; trained in Baghdad under Ibn al-Manni; author of a fiqh compendium, a celebrated diwan of sermons and a Quran commentary {cite:wafayat-ayan}."
