summary:
  ar: "أبو عبد الله محمد بن أبي القاسم الخضر بن محمد بن الخضر بن علي بن عبد الله، المعروف بابن شيمبة الحراني، الملقب فخر الدين ابن تيمية؛ الخطيب الواعظ الفقيه الحنبلي والد شيخ الإسلام تقي الدين ابن تيمية؛ كان فاضلاً تفرد في بلده بالعلم والمشار إليه في الدين؛ تفقه ببغداد على أبي الفتح ابن المني وسمع الحديث من شهدة بنت الإبري وابن المقرب وابن البطي؛ صنف في مذهب الإمام أحمد مختصراً أحسن فيه، وله ديوان خطب مشهور في غاية الجودة وتفسير القرآن ونظم حسن؛ كانت إليه الخطابة بحران ولأهله من بعده {cite:wafayat-ayan}. وفي الشذرات شيخ حران وخطيبها ولد في أواخر شعبان سنة اثنتين وأربعين وخمسمائة وقرأ القرآن على والده وله نحو عشر سنين، وأخذ في التدريس والوعظ والتصنيف وإلقاء التفسير بكرة كل يوم بجامع حران حتى فسر القرآن العظيم خمس مرات، وله التفسير الكبير في أكثر من ثلاثين مجلداً وثلاث مصنفات في المذهب والموضح في الفرائض، وبينه وبين الموفق ابن قدامة كلام ورسائل في مسألة خلود أهل البدع المحكوم بكفرهم في النار كان يقول بخلودهم والموفق لا يطلق عليهم الخلود؛ توفي يوم الخميس عاشر صفر بحران وقال ولده عبد الغني مات في الصلاة فأخذه إلى صدره فكبر وجعل يحرك حاجبه وشفتيه بالصلاة حتى شخص بصره {cite:shadharat-dhahab p. 102-103}."
  en: "Fakhr al-Din Ibn Taymiyya (552–621) — Hanbali khatib and preacher of Harran, father of Taqi al-Din Ibn Taymiyya; trained in Baghdad under Ibn al-Manni; author of a fiqh compendium, a celebrated diwan of sermons and a Quran commentary {cite:wafayat-ayan}."
  es: "Fakhr al-Din Ibn Taymiyya (552–621): Hanbali khatib y predicador de Harran, padre de Taqi al-Din Ibn Taymiyya; entrenado en Bagdad bajo Ibn al-Manni; autor de un compendio de fiqh, un célebre diwan de sermones y un comentario del Corán {cita:wafayat-ayan}."
  fr: "Fakhr al-Din Ibn Taymiyya (552-621) — Hanbali khatib et prédicateur de Harran, père de Taqi al-Din Ibn Taymiyya; formé à Bagdad sous Ibn al-Manni; auteur d'un recueil de fiqh, d'un célèbre diwan de sermons et d'un commentaire du Coran {cite: wafayat-ayan}."
  ur: "فخر الدین ابن تیمیہ (552-621) - حنبلی خطیب اور حران کے مبلغ، تقی الدین ابن تیمیہ کے والد؛ بغداد میں ابن المنی کے تحت تربیت حاصل کی۔ فقہ کے مجموعے کے مصنف، خطبات کا ایک مشہور دیوان اور تفسیر قرآن {حوالہ: وفائیت آیان}۔"
  tr: "Ebu Abdullah Muhammed bin Ebi el-Kasım el-Hidr ibn Muhammed ibn el-Hidr ibn Ali ibn Abdullah, İbn Şeymbah el-Harrani olarak bilinir, Fakhr al-Din İbn Teymiyye lakabıyla bilinir; vaiz, vaiz, hukukçu Hanbali, Şeyh el-İslam Taqi el-Din İbn Teymiyye'nin babası, memleketinde seçkin bir alimdi ve dini inançlarıyla tanınırdı öğretiler; Bağdat'ta Ebu el-Feth İbn el-Münni'nin yanında fıkıh okudu ve Şehadet bint İbri, İbn el-Mukarrab ve İbn el-Batti'den hadis dinledi; İmam Ahmed okulu üzerine özlü ve mükemmel bir eser yazdı, yüksek kalitede ünlü vaazlar, Kur'an tefsiri ve iyi bir kompozisyon koleksiyonuna sahipti; Bahran'da ve onun ardından ailesinde vaazlar verdi {atıf: Wafayat-ayan}. Harran'ın şeyhi ve vaizi Al-Shadharat'ta, 542 Hicri yılının geç Şa'ban'ında doğdu. Babasıyla yaklaşık on yıl boyunca Kur'an çalıştı. Her sabah Harran camii'nde öğretmeye, vaaz vermeye, yazmaya ve tefsir okumaya başladı, ta ki büyük Kur'an'ı beş kez terce edene kadar. Büyük tefsiri otuzdan fazla cilt ve okul üzerine üç eserde yazdı ve miras yoluyla anlattı. Kendisi ile al-Muwaffaq ibn Qudamah arasında, inançsızlığı cehennemde olan yenilikçilerin ölümsüzlüğü meselesi üzerine tartışmalar ve mektuplar oldu. Onların ölümsüz olduğunu söyledi ve el-Muwaffaq onlara ölümsüzlük demedi. Perşembe günü, Sefer el-Bahran'ın onuncusunda vefat etti ve oğlu Abdülgani'nin namazda öldüğünü söyledi, bu yüzden onu göğsüne aldı, tekbir olarak büyüdü ve kaşlarını ve dudaklarını oynatmaya başladı, ta ki {alıntı::) görene kadar Shadharat-Dhahab s. 102-103}."
  id: "Abu Abdullah Muhammad ibn Abi al-Qasim al-Khidr ibn Muhammad ibn al-Khidr ibn Ali ibn Abdullah, dikenal sebagai Ibn Shaymbah al-Harrani, dijuluki Fakhr al-Din Ibn Taymiyyah; pendakwah, pengkhotbah, ahli hukum, Hanbali, ayah dari Sheikh al-Islam Taqi al-Din Ibn Taymiyyah, adalah seorang ulama terkemuka di tanah kelahirannya dan dikenal atas ajaran agamanya; ia mempelajari fiksi di Baghdad di bawah bimbingan Abu al-Fath ibn al-Munni dan mendengar hadis dari Shahdah bint al-Ibri, Ibn al-Muqarrab, dan Ibn al-Batti; menulis karya yang ringkas dan sangat baik tentang mazhab Imam Ahmad, dan ia memiliki kumpulan khotbah terkenal berkualitas tinggi, tafsiran Al-Qur'an, dan komposisi yang baik; ia menyampaikan khotbah dalam bahasa Bahran dan keluarganya setelahnya {cite:Wafayat-Ayan}. Di Al-Shadharat, syekh dan pengkhotbah Harran, ia lahir pada akhir Sha'ban tahun 542 H. Ia belajar Al-Qur'an bersama ayahnya selama sekitar sepuluh tahun. Ia mulai mengajar, berkhotbah, menulis, dan menyampaikan tafsir setiap pagi di masjid Harran hingga ia menafsirkan Al-Qur'an sebanyak lima kali. Ia menulis tafsir utama dalam lebih dari tiga puluh jilid dan tiga karya tentang sekolah tersebut serta menjelaskan dalam warisan. Antara dia dan al-Muwaffaq ibn Qudamah terjadi diskusi dan surat-surat mengenai isu keabadian orang-orang inovasi yang ketidakpercayaannya berada di Neraka. Ia mengatakan mereka abadi, dan al-Muwaffaq tidak menyebutnya keabadian. Ia meninggal pada hari Kamis, tanggal sepuluh Safar al-Bahran dan mengatakan putranya Abd al-Ghani meninggal dalam shalat, sehingga ia menggendongnya ke dadanya, tumbuh sebagai takbir, dan mulai menggerakkan alis serta bibirnya dalam doa hingga bisa melihat {cite::Shadharat-Dhahab hlm. 102-103}."
