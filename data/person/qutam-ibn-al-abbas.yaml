summary:
  ar: "قثم بن العباس بن عبد المطلب؛ كان مع سعيد بن عثمان بخراسان فتوفى بسمرقند ويقال استشهد بها وكان قد أبى خمسة أسهم من المغنم ورضي بسهم له وسهم لفرسه وقال ابن عباس حين بلغته وفاته شتان ما بين مولده ومقبره."
  en: "Qutham ibn al-Abbas ibn Abd al-Muttalib; with Sa'id ibn Uthman in Khurasan he died at Samarqand — some say martyred — having declined five booty-shares for one his own and one his horse's; Ibn Abbas mourned 'what a distance between his birthplace and his grave'."
