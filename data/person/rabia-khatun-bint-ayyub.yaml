summary:
  ar: "ربيعة خاتون بنت أيوب؛ أخت السلطان صلاح الدين يوسف بن أيوب وزوجة الملك المعظم مظفر الدين كوكبوري صاحب إربل؛ توفيت بدمشق ودفنت في مدرستها الموقوفة على الحنابلة بسفح قاسيون؛ قال ابن خلكان: أدركت من محارمها من الملوك من إخوتها وأولادهم أكثر من خمسين رجلاً غير محارمها من غير الملوك، فإن إربل كانت لزوجها والموصل لأولاد بنتها وخلاط لتلميذ أخيها الملك الأوحد نجم الدين أيوب وبلاد الجزيرة للأشرف ابن أخيها وبلاد الشام لأولاد إخوتها والديار المصرية والحجازية واليمن لإخوتها وأولادهم {cite:wafayat-ayan}."
  en: "Rabi'a Khatun bint Ayyub (d. 643) — sister of Salah al-Din and widow of Muzaffar al-Din Kokburi of Irbil; founded the madrasa for Hanbalis at the foot of Qasyun where she was buried; Ibn Khallikan notes she lived to see more than fifty royal kinsmen {cite:wafayat-ayan}."
