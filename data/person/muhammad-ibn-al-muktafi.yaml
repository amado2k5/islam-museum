label: { ar: "محمد بن المكتفي" }
summary:
  ar: "ابن المكتفي، سئل أن يتولى الخلافة لما قتل المقتدر فقال لا حاجة لي في ذلك وعمي هذا أحق به فكلم القاهر فأجاب، ثم اتفق مؤنس وابن مقلة وآخرون على خلع القاهر به فتحيل القاهر عليهم حتى أمسكهم وذبحهم وطين على ابن المكتفي بين حيطين {cite:tarikh-khulafa-minhaj-1434 p. 597}."
  en: "Al-Muktafi's son; asked to take the caliphate when al-Muqtadir was killed, he declined — 'my uncle is worthier' — so it went to al-Qahir. When Mu'nis, Ibn Muqla and others later agreed to depose al-Qahir for him, al-Qahir outmanoeuvred them, slaughtered them, and walled Ibn al-Muktafi between two walls {cite:tarikh-khulafa-minhaj-1434 p. 597}."
