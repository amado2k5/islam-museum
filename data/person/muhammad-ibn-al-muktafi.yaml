id: person/muhammad-ibn-al-muktafi
class: person
label: { ar: "محمد بن المكتفي" }
summary:
  ar: "ابن المكتفي، سئل أن يتولى الخلافة لما قتل المقتدر فقال لا حاجة لي في ذلك وعمي هذا أحق به فكلم القاهر فأجاب، ثم اتفق مؤنس وابن مقلة وآخرون على خلع القاهر به فتحيل القاهر عليهم حتى أمسكهم وذبحهم وطين على ابن المكتفي بين حيطين {cite:tarikh-khulafa-minhaj-1434 p. 597}."
  en: "Al-Muktafi's son; asked to take the caliphate when al-Muqtadir was killed, he declined — 'my uncle is worthier' — so it went to al-Qahir. When Mu'nis, Ibn Muqla and others later agreed to depose al-Qahir for him, al-Qahir outmanoeuvred them, slaughtered them, and walled Ibn al-Muktafi between two walls {cite:tarikh-khulafa-minhaj-1434 p. 597}."
  es: "El hijo de Al-Muktafi, al serle pedido que asumiera el califato tras la muerte de Al-Muqtadir, se negó —«mi tío es más digno»—, por lo que este recayó en Al-Qahir. Cuando Mu'nis, Ibn Muqla y otros accedieron posteriormente a deponer a Al-Qahir en su favor, Al-Qahir los superó en astucia, los masacró y emparedó a Ibn Al-Muktafi entre dos muros {cite:tarikh-khulafa-minhaj-1434 p. 597}."
  fr: "Le fils d'al-Muktafi, sollicité pour accéder au califat après la mort d'al-Muqtadir, refusa, déclarant: « Mon oncle est plus digne ». Le califat revint donc à al-Qahir. Plus tard, lorsque Mu'nis, Ibn Muqla et d'autres s'allièrent pour déposer al-Qahir en sa faveur, al-Qahir les manœuvra, les massacra et fit emmurer Ibn al-Muktafi entre deux murs (voir: Tarikh-Khulafa-Minhaj-1434, p. 597)."
