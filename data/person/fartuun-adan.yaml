summary:
  ar: "ناشطة اجتماعية صومالية، وُلدت سنة 1969؛ وهي المديرة التنفيذية لمركز علمان للسلام وحقوق الإنسان في مقديشو، الذي أحيته تكريمًا لزوجها الراحل علمان علي أحمد، وشاركت في تأسيس «الأخت الصومال» أول برنامج في البلاد لدعم ضحايا العنف الجنسي، وحصلت على جائزة المرأة الشجاعة الدولية سنة 2013 وعلى جائزة رايت ليفليهود مع ابنتها إلواد علمان سنة 2022."
  en: "Somali social activist, born in 1969. She is executive director of the Elman Peace and Human Rights Centre in Mogadishu, which she revived in honour of her late husband Elman Ali Ahmed, and co-founder of Sister Somalia, the country's first support programme for survivors of sexual violence. She received the International Women of Courage Award in 2013 and, with her daughter Ilwad Elman, the Right Livelihood Award in 2022."
  ur: "صومالی سماجی کارکن، 1969 میں پیدا ہوئیں؛ وہ موغادیشو کے علمان امن و انسانی حقوق مرکز کی ایگزیکٹو ڈائریکٹر ہیں، جسے انھوں نے اپنے مرحوم شوہر علمان علی احمد کی یاد میں دوبارہ قائم کیا، اور «سسٹر صومالیہ» کی شریک بانی ہیں، جو جنسی تشدد کے متاثرین کے لیے ملک کا پہلا امدادی پروگرام ہے۔ انھیں 2013 میں بین الاقوامی خواتینِ شجاعت ایوارڈ اور 2022 میں اپنی بیٹی الواد علمان کے ساتھ رائٹ لائیولی ہڈ ایوارڈ ملا۔"
