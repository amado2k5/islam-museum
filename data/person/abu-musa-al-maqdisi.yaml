label: { ar: "الحافظ أبو موسى المقدسي", en: "al-Hafiz Abu Musa al-Maqdisi", fr: "al-Hafiz Abu Musa al-Maqdisi", es: "al-Hafiz Abu Musa al-Maqdisi", ur: "حافظ ابو موسیٰ المقدسی" }
summary:
  ar: "الحافظ جمال الدين عبد الله بن عبد الغني بن عبد الواحد بن علي بن سرور المقدسي الحنبلي الحافظ ابن الحافظ أبو موسى؛ ولد في شوال سنة إحدى وثمانين وخمسمائة وسمع من عبد الرحمن بن الخرقي بدمشق ومن ابن كليب ببغداد ومن خليل الرازاني بأصبهان ومن الأرياحي بمصر ومن منصور الفراوي بنيسابور وكتب الكثير وعني بهذا الشأن وجمع وأفاد وتفقه وتأدب؛ قال الضياء اشتغل بالفقه والحديث وصار علماً من الأعلام حافظاً متقناً ثقة، وقال عمر بن الحاجب لم يكن في عصره مثله في الحفظ والمعرفة والأمانة، وغمزه الناصح بن الحنبلي وسبط ابن الجوزي بالميل إلى السلاطين فرد ابن رجب أنهما كانا أكثر الناس ميلاً إليهم وأن أبا موسى كان أتقى وأورع وأعلم منهما؛ وبنى له الملك الأشرف دار الحديث بالسفح على اسمه وجعله شيخها وقرر له معلوماً فمات قبل كمالها؛ توفي يوم الجمعة خامس رمضان سنة تسع وعشرين وستمائة ودفن بسفح قاسيون {cite:shadharat-dhahab p. 131}."
  en: "Abu Musa al-Maqdisi — 'the hafiz son of the hafiz', born 581, a scholar of such standing that al-Ashraf built the Dar al-Hadith at the foot of Qasyun in his name and made him its shaykh; he died before its completion, 5 Ramadan 629, buried on the slope {cite:shadharat-dhahab p. 131}. Ibn Rajab defended him against the 'courtier' charge levelled by al-Nasih and Sibt — themselves, he noted, far closer to the sultans."
  fr: "Abu Musa al-Maqdisi — « le hafiz fils du hafiz », né en 581, savant d'un tel rang qu'al-Ashraf bâtit en son nom la Dar al-Hadith au pied du Qasyun et l'en fit le shaykh ; il mourut avant son achèvement, le 5 ramadan 629, enterré sur le versant {cite:shadharat-dhahab p. 131}. Ibn Rajab le défendit contre l'accusation de « courtisan » portée par al-Nasih et Sibt — eux-mêmes, nota-t-il, bien plus proches des sultans."
  es: "Abu Musa al-Maqdisi — 'el hijo del hafiz', nacido en 581, un erudito de tal renombre que al-Ashraf construyó el Dar al-Hadith al pie de Qasyun en su nombre y lo nombró su shaykh; murió antes de su finalización, el 5 de Ramadán de 629, y fue enterrado en la ladera {cite:shadharat-dhahab p. 131}. Ibn Rajab lo defendió de la acusación de \"cortesano\" formulada por al-Nasih y Sibt, quienes, según señaló, estaban mucho más cerca de los sultanes."
  ur: "ابو موسیٰ المقدسی - 'حافظ کا بیٹا حافظ'، 581 میں پیدا ہوا، ایک ایسے عالم دین کہ الاشرف نے ان کے نام پر قصیون کے دامن میں دار الحدیث بنایا اور اسے اس کا شیخ بنایا؛ ان کی وفات اس کی تکمیل سے پہلے، 5 رمضان 629، ڈھلوان پر دفن ہوئی۔ 131}۔ ابن رجب نے النصیح اور سبط کی طرف سے لگائے گئے 'درباری' الزام کے خلاف اس کا دفاع کیا - خود، اس نے نوٹ کیا، سلطانوں کے بہت قریب تھے۔"
