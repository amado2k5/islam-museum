summary:
  ar: "بطاقة أولية لأبي الحسن قطب شاه «تانا شاه»، آخر سلاطين غلكندة الذي استسلم لأورنكزب سنة ١٦٨٧م ومات أسيراً سنة ١٦٩٩م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abul Hasan Qutb Shah, 'Tana Shah', the last Qutb Shahi sultan of Golconda who surrendered to Aurangzeb in 1687 and died a prisoner in 1699; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Abul Hasan Qutb Shah, 'Tana Shah', el último sultán Qutb Shahi de Golconda que se rindió a Aurangzeb en 1687 y murió prisionero en 1699; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche d'engagement d'Abul Hasan Qutb Shah, « Tana Shah », le dernier sultan Qutb Shahi de Golconde qui s'est rendu à Aurangzeb en 1687 et est mort prisonnier en 1699; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "گولکنڈہ کے آخری قطب شاہی سلطان ابوالحسن قطب شاہ، 'تانا شاہ' کے لیے ڈرافٹ کارڈ جس نے 1687 میں اورنگ زیب کے سامنے ہتھیار ڈال دیے اور 1699 میں قیدی کی حالت میں انتقال کر گئے۔ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
