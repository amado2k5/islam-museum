id: person/tashfin-ibn-ali
class: person
label:
  ar: تاشفين بن علي
  en: Tashfin ibn Ali
  es: "Tashfin ibn Ali"
  fr: "Tashfin ibn Ali"
  ur: "تاشفین ابن علی"
summary:
  ar: تاشفين بن علي بن يوسف بن تاشفين، آخر أمراء المرابطين قوة؛ قاتل عبد المؤمن والموحدين قتالاً شديداً حتى نازله بتلمسان، وفر إلى وهران فاتبعه الموحدون واقتحموا البلد فهلك سنة 541هـ.
  en: Tashfin ibn Ali ibn Yusuf ibn Tashfin, the last vigorous Almoravid amir; he fought Abd al-Mu'min and the Almohads stubbornly until besieged at Tlemcen, fled to Oran where the Almohads stormed the town and he perished in 541 AH.
  es: "Tashfin ibn Ali ibn Yusuf ibn Tashfin, el último y enérgico emir almorávide, luchó tenazmente contra Abd al-Mu'min y los almohades hasta que, sitiados en Tlemcen, huyeron a Orán, donde los almohades asaltaron la ciudad y pereció en el año 541 de la Hégira."
  fr: "Tashfin ibn Ali ibn Yusuf ibn Tashfin, le dernier émir almoravide vigoureux; il combattit Abd al-Mu'min et les Almohades avec acharnement jusqu'à ce qu'il soit assiégé à Tlemcen, s'enfuit à Oran où les Almohades prirent d'assaut la ville et il périt en 541 AH."
  ur: "تاشفین ابن علی ابن یوسف ابن تاشفین، آخری جوش والا الموراوید امیر؛ اس نے عبد المومن اور الموحد سے سختی سے لڑا یہاں تک کہ تلمسن کا محاصرہ کر لیا، اوران کی طرف بھاگا جہاں الموحدوں نے اس شہر پر دھاوا بول دیا اور وہ 541 ہجری میں مارا گیا۔"
