summary:
  ar: تاشفين بن علي بن يوسف بن تاشفين، آخر أمراء المرابطين قوة؛ قاتل عبد المؤمن والموحدين قتالاً شديداً حتى نازله بتلمسان، وفر إلى وهران فاتبعه الموحدون واقتحموا البلد فهلك سنة 541هـ.
  en: Tashfin ibn Ali ibn Yusuf ibn Tashfin, the last vigorous Almoravid amir; he fought Abd al-Mu'min and the Almohads stubbornly until besieged at Tlemcen, fled to Oran where the Almohads stormed the town and he perished in 541 AH.
