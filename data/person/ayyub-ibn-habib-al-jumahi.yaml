summary:
  ar: "أيوب بن حبيب الجمحي القرشي المدني، ينسبه مالك وغيره مولى لسعد بن أبي وقاص، ويسوق مصعب الزبيري نسبه في بني جمح؛ من ثقات أهل المدينة كما يقول ابن عبد البر، مات سنة إحدى وثلاثين ومئة، وروى عنه مالك وفليح وعباد بن إسحاق، ولمالك عنه في الموطأ حديث واحد مسند في النهي عن النفخ في الشراب {cite:tamhid-furqan-2017-v1 p. 667}."
  en: "Ayyub b. Habib al-Jumahi al-Qurashi of Medina, called by Malik and others a client of Sa'd b. Abi Waqqas, whose descent in Banu Jumah Mus'ab al-Zubayri sets out; one of the trustworthy men of Medina, as Ibn 'Abd al-Barr says, who died in 131 AH; Malik, Fulayh and 'Abbad b. Ishaq transmitted from him, and Malik has one musnad report from him in the Muwatta', forbidding blowing into a drink {cite:tamhid-furqan-2017-v1 p. 667}."
  ur: "ایوب بن حبیب جمحی قرشی مدنی، جنہیں امام مالک وغیرہ سعد بن ابی وقاص کا مولیٰ کہتے ہیں اور مصعب زبیری بنو جمح میں ان کا نسب بیان کرتے ہیں؛ ابن عبد البر کے بقول اہلِ مدینہ کے ثقات میں سے، 131ھ میں فوت ہوئے؛ ان سے مالک، فلیح اور عباد بن اسحاق نے روایت کی، اور موطأ میں مالک کی ان سے ایک مسند روایت ہے جس میں مشروب میں پھونکنے کی ممانعت ہے {cite:tamhid-furqan-2017-v1 p. 667}۔"
  es: "Ayyub b. Habib al-Jumahi al-Qurashi de Medina, llamado por Malik y otros un cliente de Sa'd b. Abi Waqqas, cuya descendencia en Banu Jumah Mus'ab al-Zubayri establece; uno de los hombres de confianza de Medina, como dice Ibn 'Abd al-Barr, que murió en 131 AH; Malik, Fulayh y 'Abbad b. Ishaq transmitieron de él, y Malik tiene un informe musnad de él en el Muwatta', que prohíbe soplar en una bebida {cite:tamhid-furqan-2017-v1 p. 667}."
  fr: "Ayyub b. Habib al-Jumahi al-Qurashi de Médine, considéré par Malik et d'autres comme un client de Sa'd b. Abi Waqqas, dont la descendance est relatée par Banu Jumah Mus'ab al-Zubayri; un homme digne de confiance de Médine, comme le dit Ibn 'Abd al-Barr, décédé en 131 AH; Malik, Fulayh et 'Abbad b. Ishaq ont transmis de lui, et Malik a un rapport musnad de lui dans le Muwatta', interdisant de souffler dans une boisson {cite:tamhid-furqan-2017-v1 p. 667}."
  tr: "Eyyüb bin Habib el-Cumahi el-Kurashi el-Medeni, Malik ve diğerlerine Sa'd ibn Abi Vaqqas'ın özgür kasabası olarak atfedilir. Mus'ab al-Zubeyri soyunu Banu Cuma arasında izler; İbn Abd al-Barr'ın dediği gibi, Medine halkı arasında güvenilir bir figürdü. 131 Hicri yılında öldü. Malik, Falih ve 'Abbad ibn İshaq ondan rivayet etti. Malik'in Muwatta'da içkiye üflemeyi yasaklayan bir hadisi vardır {atıf:tamhid-furqan-2017-v1, s. 667}."
  id: "Ayyub ibn Habib al-Jumahi al-Qurashi al-Madani, yang dikaitkan dengan Malik dan lainnya sebagai mantan Sa'd ibn Abi Waqqas. Mus'ab al-Zubayri menelusuri garis keturunannya di antara Banu Jumah; ia adalah sosok yang dapat dipercaya di antara masyarakat Madinah seperti yang dikatakan Ibn Abd al-Barr. Ia meninggal pada tahun 131 H. Malik, Falih, dan 'Abbad ibn Ishaq menceritakan darinya. Malik memiliki satu hadits dalam Muwatta' yang melarang meniup minuman {cite:tamhid-furqan-2017-v1, hlm. 667}."
