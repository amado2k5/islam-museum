summary:
  ar: "أيوب بن حبيب الجمحي القرشي المدني، ينسبه مالك وغيره مولى لسعد بن أبي وقاص، ويسوق مصعب الزبيري نسبه في بني جمح؛ من ثقات أهل المدينة كما يقول ابن عبد البر، مات سنة إحدى وثلاثين ومئة، وروى عنه مالك وفليح وعباد بن إسحاق، ولمالك عنه في الموطأ حديث واحد مسند في النهي عن النفخ في الشراب {cite:tamhid-furqan-2017-v1 p. 667}."
  en: "Ayyub b. Habib al-Jumahi al-Qurashi of Medina, called by Malik and others a client of Sa'd b. Abi Waqqas, whose descent in Banu Jumah Mus'ab al-Zubayri sets out; one of the trustworthy men of Medina, as Ibn 'Abd al-Barr says, who died in 131 AH; Malik, Fulayh and 'Abbad b. Ishaq transmitted from him, and Malik has one musnad report from him in the Muwatta', forbidding blowing into a drink {cite:tamhid-furqan-2017-v1 p. 667}."
  ur: "ایوب بن حبیب جمحی قرشی مدنی، جنہیں امام مالک وغیرہ سعد بن ابی وقاص کا مولیٰ کہتے ہیں اور مصعب زبیری بنو جمح میں ان کا نسب بیان کرتے ہیں؛ ابن عبد البر کے بقول اہلِ مدینہ کے ثقات میں سے، 131ھ میں فوت ہوئے؛ ان سے مالک، فلیح اور عباد بن اسحاق نے روایت کی، اور موطأ میں مالک کی ان سے ایک مسند روایت ہے جس میں مشروب میں پھونکنے کی ممانعت ہے {cite:tamhid-furqan-2017-v1 p. 667}۔"
