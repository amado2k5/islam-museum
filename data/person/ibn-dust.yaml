summary:
  ar: "أحمد بن محمد بن يوسف بن دوست أبو عبد الله البزاز، ولد في صفر سنة ثلاث وعشرين وثلاثمائة، وحدث عن إسماعيل الصفار والمطيري وغيرهما، وكان مكثراً من الحديث حافظاً له، مكث سبع عشرة سنة يملي الحديث من حفظه عارفاً بالفقه على مذهب مالك، ولما قيل له أراك تملي المجالس من حفظك فلم لا تملي من كتابك قال انظر فيما أمليت فإن كان فيه خطأ لم أمل من حفظي وإن كان جميعه صواباً فما الحاجة إلى الكتاب. توفي في رمضان سنة سبع وأربعمائة ودُفن حذاء منارة جامع المنصور {cite:muntazam-ibn-al-jawzi j.7 p.284-285}."
