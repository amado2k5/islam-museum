summary:
  ar: "روائي وقاص مصري (1937–2025)، من أبرز وجوه «جيل الستينيات» في الأدب العربي. سُجن بين 1959 و1964 لانتمائه إلى الحركة الديمقراطية للتحرر الوطني الماركسية، وجعل من سجنه مادة روايته الأولى «تلك الرائحة»؛ ومن أعماله «اللجنة» و«ذات» و«شرف» و«وردة». رفض سنة 2003 تسلُّم جائزة ملتقى القاهرة للإبداع الروائي اعتراضًا على سياسات الحكومة المصرية."
  en: "Egyptian novelist and short-story writer (1937–2025), a leading figure of the 'Sixties Generation' in Arabic literature. Imprisoned from 1959 to 1964 for his membership in the Marxist Democratic Movement for National Liberation, he drew on his imprisonment in his first book, That Smell; his novels include The Committee, Zaat, Honor and Warda. In 2003 he refused a major state literary prize in protest at the Egyptian government's policies."
  ur: "مصری ناول نگار اور افسانہ نگار (1937–2025)، عربی ادب کی «ساٹھ کی دہائی کی نسل» کی نمایاں شخصیت۔ مارکسی جمہوری تحریک برائے قومی آزادی سے وابستگی پر 1959 سے 1964 تک قید رہے اور اپنی قید کو اپنی پہلی کتاب «تلک الرائحة» کا موضوع بنایا؛ ان کے ناولوں میں «اللجنة»، «ذات»، «شرف» اور «وردة» شامل ہیں۔ 2003 میں انہوں نے مصری حکومت کی پالیسیوں پر احتجاجاً ایک بڑا سرکاری ادبی ایوارڈ قبول کرنے سے انکار کر دیا۔"
