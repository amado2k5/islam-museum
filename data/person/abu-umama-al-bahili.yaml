summary:
  ar: "صُديّ بن عجلان بن وهب، أبو أمامة الباهلي، غلبت عليه كنيته ولم يُختلف في اسمه؛ من المكثرين في الرواية وأكثر حديثه عند الشاميين، سكن مصر ثم حمص ومات بها سنة 81هـ ابن إحدى وتسعين، وقيل سنة 86، وهو عند ابن عيينة آخر من بقي بالشام من الصحابة {cite:istiab-alam-2002 p. 348, 772}؛ وكان من أمراء السرايا في فتوح الشام، وجهه يزيد بن أبي سفيان إلى العربة فهزم الروم {cite:futuh-buldan-maarif-1407 p.151-152}."
  en: "Sudayy ibn 'Ajlan ibn Wahb, Abu Umama al-Bahili, known by his kunya, with no disagreement on his name; a prolific narrator whose hadith is mostly with the Syrians, he lived in Egypt, then Hims, and died there in 81 AH aged ninety-one, or in 86; for Ibn 'Uyayna he was the last Companion left in Syria {cite:istiab-alam-2002 p. 348, 772}; he led raiding parties in the conquest of Syria, and Yazid ibn Abi Sufyan sent him to al-'Araba, where he routed the Byzantines {cite:futuh-buldan-maarif-1407 p.151-152}."
  ur: "صُدی بن عجلان بن وہب، ابو امامہ باہلی، جن کی کنیت غالب آ گئی اور ان کے نام میں کوئی اختلاف نہیں؛ کثیر الروایہ صحابی جن کی اکثر حدیث اہلِ شام کے پاس ہے؛ وہ مصر پھر حمص میں رہے اور وہیں 81ھ میں اکانوے برس کی عمر میں، یا 86ھ میں فوت ہوئے؛ ابن عیینہ کے نزدیک وہ شام میں باقی رہنے والے آخری صحابی تھے {cite:istiab-alam-2002 p. 348, 772}؛ فتوحِ شام میں سرایا کے امیر رہے، اور یزید بن ابی سفیان نے انہیں عربہ بھیجا جہاں انہوں نے رومیوں کو شکست دی {cite:futuh-buldan-maarif-1407 p.151-152}۔"
