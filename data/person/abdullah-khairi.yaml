summary:
  ar: "داعية ماليزي مستقل وكاتب، وُلد في 15 سبتمبر 1968 في سيدام كانان بولاية قدح. عمل مهندسًا تسع سنوات ومدرّسًا ست عشرة سنة، وأسّس معهد التحفيظ الشافعي سنة 2015، ويمتلك مقهى أواك في شاه عالم القائم على فكرة الأكل مع التبرع، وله كتب منها إنسان رباني وسماء أبيك. بلغ حسابه الموثّق في إنستغرام 1,132,440 متابعًا وحسابه في تيك توك 1,700,000 متابع بحسب قراءة المنصتين في 15 نوفمبر 2026."
  en: "Malaysian independent preacher and writer, born on 15 September 1968 at Sidam Kanan, Kedah. He worked nine years as an engineer and sixteen years as a teacher, founded Maahad Tahfiz As-Syafie in 2015, and owns Kafe UAK in Shah Alam, run on an eat-and-donate concept; his books include Insan Rabbani Pelajar Cemerlang and Syurga Pak Hang. His verified Instagram counted 1,132,440 followers and his TikTok 1,700,000 followers when the platforms were read on 15 November 2026."
  ur: "ملائیشیا کے آزاد مبلغ اور مصنف، جو 15 ستمبر 1968ء کو قدح کے سیدام کانان میں پیدا ہوئے۔ وہ نو سال انجینئر اور سولہ سال استاد رہے، 2015ء میں معہد تحفیظ الشافعی قائم کیا، اور شاہ عالم میں کیفے UAK کے مالک ہیں جو کھانے کے ساتھ صدقے کے تصور پر چلتا ہے؛ ان کی کتابوں میں ”انسان ربانی“ اور ”سورگا پاک ہانگ“ شامل ہیں۔ 15 نومبر 2026ء کی قرأت کے مطابق ان کے مصدقہ انسٹاگرام فالوور 1,132,440 اور ٹک ٹاک فالوور 1,700,000 تھے۔"
