summary:
  ar: "سياسية كشميرية وزوجة الشيخ عبد الله، مثلت سريناغار وأننتناغ في مجلس لوك سبها (1977–1979 و1984–1989)، وكانت أول رئيسة لجمعية الصليب الأحمر في جامو وكشمير، وعُرفت بلقب «مادر مهربان» أي الأم الحنون."
  en: "Kashmiri politician and wife of Sheikh Abdullah, who represented Srinagar and Anantnag in the Lok Sabha (1977–1979 and 1984–1989), was the first president of the Jammu and Kashmir Red Cross Society, and was known as Madr-e-Meharban, 'the kind mother'."
  ur: "کشمیری سیاست دان و شیخ عبد اللہ کی اہلیہ، جنھوں نے لوک سبھا میں سری نگر اور اننت ناگ کی نمائندگی کی (1977–1979ء اور 1984–1989ء)، جموں و کشمیر ریڈ کراس سوسائٹی کی پہلی صدر رہیں اور «مادر مہربان» کہلائیں۔"
