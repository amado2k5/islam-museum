summary:
  ar: "عالم سوري حنفي ومحدّث وباحث محقّق، وُلد في حلب سنة 1917 وتوفي في الرياض سنة 1997. درّس في جامعة دمشق وجامعات سعودية، وحقّق طائفة من أهم كتب الحديث والفقه الحنفي حتى صارت طبعاته معتمدة في المعاهد والجامعات، وله أكثر من سبعين مؤلفا وتحقيقا."
  en: "Syrian Hanafi scholar, hadith specialist and critical editor, born in Aleppo in 1917 and died in Riyadh in 1997. He taught at Damascus University and at Saudi universities, and his critical editions of major works of hadith and Hanafi jurisprudence became standard editions in seminaries and universities; he published more than seventy authored and edited works."
  ur: "شامی حنفی عالم، محدث اور محقق، جو 1917 میں حلب میں پیدا ہوئے اور 1997 میں ریاض میں وفات پائی۔ انہوں نے جامعہ دمشق اور سعودی جامعات میں تدریس کی، اور حدیث و فقہ حنفی کی اہم کتابوں کی ان کی تنقیدی اشاعتیں مدارس و جامعات میں معیاری نسخے بن گئیں؛ ان کی تصنیف و تحقیق کردہ کتابیں ستر سے زیادہ ہیں۔"
