summary:
  ar: "عالم سوري حنفي ومحدّث وباحث محقّق، وُلد في حلب سنة 1917 وتوفي في الرياض سنة 1997. درّس في جامعة دمشق وجامعات سعودية، وحقّق طائفة من أهم كتب الحديث والفقه الحنفي حتى صارت طبعاته معتمدة في المعاهد والجامعات، وله أكثر من سبعين مؤلفا وتحقيقا."
  en: "Syrian Hanafi scholar, hadith specialist and critical editor, born in Aleppo in 1917 and died in Riyadh in 1997. He taught at Damascus University and at Saudi universities, and his critical editions of major works of hadith and Hanafi jurisprudence became standard editions in seminaries and universities; he published more than seventy authored and edited works."
  fr: "Savant hanafite syrien, spécialiste du hadith et éditeur critique, né à Alep en 1917 et mort à Riyad en 1997. Il enseigna à l'université de Damas et dans des universités saoudiennes, et ses éditions critiques d'œuvres majeures du hadith et de la jurisprudence hanafite devinrent des éditions de référence dans les séminaires et les universités ; il publia plus de soixante-dix ouvrages, écrits ou édités."
  ur: "شامی حنفی عالم، محدث اور محقق، جو 1917 میں حلب میں پیدا ہوئے اور 1997 میں ریاض میں وفات پائی۔ انہوں نے جامعہ دمشق اور سعودی جامعات میں تدریس کی، اور حدیث و فقہ حنفی کی اہم کتابوں کی ان کی تنقیدی اشاعتیں مدارس و جامعات میں معیاری نسخے بن گئیں؛ ان کی تصنیف و تحقیق کردہ کتابیں ستر سے زیادہ ہیں۔"
  es: "Erudito sirio de la escuela Hanafi, especialista en hadices y editor crítico, nació en Alepo en 1917 y falleció en Riad en 1997. Impartió clases en la Universidad de Damasco y en universidades saudíes, y sus ediciones críticas de importantes obras de hadices y jurisprudencia Hanafi se convirtieron en ediciones de referencia en seminarios y universidades; publicó más de setenta obras, tanto de su autoría como editadas."
  tr: "Suriyeli bir Hanefi alim, hadis uzmanı ve araştırmacı olan bu kişi, 1917'de Halep'te doğmuş ve 1997'de Riyad'da vefat etmiştir. Şam Üniversitesi ve Suudi üniversitelerinde ders vermiş, hadis ve Hanefi fıkıhının en önemli kitaplarından birçoğunu derlemiş ve bu derlemeler enstitü ve üniversitelerde onaylanmıştır. Yetmişten fazla kitabı ve derlenmiş eseri bulunmaktadır."
  id: "Seorang ulama Hanafi Suriah, ahli hadits, dan peneliti, ia lahir di Aleppo pada tahun 1917 dan meninggal di Riyadh pada tahun 1997. Ia mengajar di Universitas Damaskus dan universitas-universitas Saudi, serta menyunting sejumlah buku hadits dan fiqih Hanafi terpenting hingga edisinya diakui di berbagai lembaga dan universitas. Ia memiliki lebih dari tujuh puluh buku dan karya suntingan."
