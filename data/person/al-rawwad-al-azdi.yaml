label: { ar: "الرواد الأزدي", en: "al-Rawwad al-Azdi", fr: "al-Rawwad al-Azdi", es: "al-Rawwad al-Azdi", ur: "الرواد العزدی" }
summary:
  ar: "الرواد الأزدي؛ نزل تبريز ثم ابنه الوجناء بن الرواد وبنى بها وإخوته بناءً وحصنها بسور فغزاها الناس معه وكان الوجناء وصدقة بن علي مولى الأزد عاثا وأفسدا بأذربيجان."
  en: "Al-Rawwad al-Azdi; he settled Tabriz, then his son al-Wajna' ibn al-Rawwad, who built and walled it so the people rallied to him — al-Wajna' and the Azd mawla Sadaqa ibn Ali later ravaged Azerbaijan."
  fr: "Al-Rawwad al-Azdi ; il s'est installé à Tabriz, puis son fils al-Wajna' ibn al-Rawwad, qui l'a construit et muré afin que le peuple se rallie à lui - al-Wajna' et l'Azd mawla Sadaqa ibn Ali a plus tard ravagé l'Azerbaïdjan."
  es: "Al-Rawwad al-Azdi; se instaló en Tabriz, luego su hijo al-Wajna' ibn al-Rawwad, quien la construyó y amuralló para que la gente se uniera a él; al-Wajna' y Azd mawla Sadaqa ibn Ali devastaron Azerbaiyán más tarde."
  ur: "الرواد العزدی؛ اس نے تبریز کو آباد کیا، پھر اس کے بیٹے الوجنا ابن الرود نے، جس نے اسے تعمیر کیا اور دیواریں کھڑی کیں تو لوگ اس کے پاس جمع ہوئے - الوجنا اور ازد مولا صدقہ ابن علی نے بعد میں آذربائیجان کو تباہ کیا۔"
  tr: "El-Rüvad El-Ezdi; Tebriz'e yerleşti, ardından oğlu El-Vecna bin el-Ruwad kardeşleriyle birlikte orada bir bina inşa etti, duvarla güçlendirdi ve halk onunla birlikte yağmaladı. El-Vadāna ve Sadaq bin Ali, El-Azd'ın özgür kedileri Azerbaycan'da yozlaşmış ve yozlaşmıştı."
  id: "Al-Ruwad Al-Azdi; ia menetap di Tabriz, lalu putranya Al-Wajna' ibn Al-Ruwad, membangun sebuah bangunan di sana bersama saudara-saudaranya, memperkuatnya dengan tembok, dan rakyat menyerbu bersama dengannya. Al-Wajana dan Sadaq ibn Ali, para mantan Al-Azd, korup dan korup di Azerbaijan."
