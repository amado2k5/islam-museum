label: { ar: "صاحب الزنج" , ur: "صاحب الزنج", en: "Leader of the Zanj rebellion"}
summary:
  ar: "قائد الزنج، ظهر على فرات البصرة في شوال سنة خمس وخمسين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.410}، ودخل الأبلة في رجب سنة ست وخمسين {cite:tabari-tarikh-abu-al-fadl j.9 p.471}، واستولى على عبادان {cite:tabari-tarikh-abu-al-fadl j.9 p.472}. وعند المسعودي كان يزعم أنه علي بن محمد بن أحمد بن عيسى بن زيد بن علي بن الحسين وأكثر الناس يقول إنه دعي وآل أبي طالب ينكرونه، وكان من أهل ورزنين من أعمال الري، ودلت أفعاله في قتل النساء والأطفال والشيخ الفاني على رأي الأزارقة من الخوارج، وكان يخطب أولها الله أكبر لا إله إلا الله والله أكبر ألا لا حكم إلا لله ويرى الذنوب كلها شركاً، وأول من صنف أخباره محمد بن الحسن بن سهل ابن أخي ذي الرياستين {cite:muruj-al-dhahab p. 568}، وعند المسعودي كانت مدة أيامه أربع عشرة سنة وأربعة أشهر وكان قد أتى بالبصرة في وقعة واحدة على قتل ثلثمائة ألف من الناس، وقتل ليلة السبت لليلتين خلتا من صفر سنة سبعين ومائتين ، وعند ابن الجوزي بعث إليه أبو أحمد الموفق في حصاره كتابًا يدعوه فيه إلى التوبة والدخول في جماعة المسلمين فلم يزده ذلك إلا نفورًا وإصرارًا ولم يجب عنه {cite:muntazam-ibn-al-jawzi p. 58-59}"
  ur: "جنوبی عراق میں زنج بغاوت کا قائد؛ اس کی افواج نے بصرہ اور واسط سمیت کئی شہروں پر قبضہ کیا، اور موفق کی مہم نے اس کے اقتدار کا خاتمہ کیا۔ {cite:tabari-tarikh-abu-al-fadl}"
  en: "Leader of the Zanj rebellion in southern Iraq, whose forces held towns including Basra and Wasit before al-Muwaffaq's campaign ended his rule. {cite:tabari-tarikh-abu-al-fadl}"
