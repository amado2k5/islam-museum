id: person/sahib-al-zanj
class: person
label: { ar: "صاحب الزنج" , ur: "صاحب الزنج", en: "Leader of the Zanj rebellion", es: "Leader of the Zanj rebellion", fr: "Leader of the Zanj rebellion"}
summary:
  ar: "قائد الزنج، ظهر على فرات البصرة في شوال سنة خمس وخمسين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.410}، ودخل الأبلة في رجب سنة ست وخمسين {cite:tabari-tarikh-abu-al-fadl j.9 p.471}، واستولى على عبادان {cite:tabari-tarikh-abu-al-fadl j.9 p.472}. وعند المسعودي كان يزعم أنه علي بن محمد بن أحمد بن عيسى بن زيد بن علي بن الحسين وأكثر الناس يقول إنه دعي وآل أبي طالب ينكرونه، وكان من أهل ورزنين من أعمال الري، ودلت أفعاله في قتل النساء والأطفال والشيخ الفاني على رأي الأزارقة من الخوارج، وكان يخطب أولها الله أكبر لا إله إلا الله والله أكبر ألا لا حكم إلا لله ويرى الذنوب كلها شركاً، وأول من صنف أخباره محمد بن الحسن بن سهل ابن أخي ذي الرياستين {cite:muruj-al-dhahab p. 568}، وعند المسعودي كانت مدة أيامه أربع عشرة سنة وأربعة أشهر وكان قد أتى بالبصرة في وقعة واحدة على قتل ثلثمائة ألف من الناس، وقتل ليلة السبت لليلتين خلتا من صفر سنة سبعين ومائتين ، وعند ابن الجوزي بعث إليه أبو أحمد الموفق في حصاره كتابًا يدعوه فيه إلى التوبة والدخول في جماعة المسلمين فلم يزده ذلك إلا نفورًا وإصرارًا ولم يجب عنه {cite:muntazam-ibn-al-jawzi p. 58-59}"
  ur: "جنوبی عراق میں زنج بغاوت کا قائد؛ اس کی افواج نے بصرہ اور واسط سمیت کئی شہروں پر قبضہ کیا، اور موفق کی مہم نے اس کے اقتدار کا خاتمہ کیا۔ {cite:tabari-tarikh-abu-al-fadl}"
  en: "Leader of the Zanj rebellion in southern Iraq, whose forces held towns including Basra and Wasit before al-Muwaffaq's campaign ended his rule. {cite:tabari-tarikh-abu-al-fadl}"
  es: "Líder de la rebelión Zanj en el sur de Irak, cuyas fuerzas controlaban ciudades como Basora y Wasit antes de que la campaña de al-Muwaffaq pusiera fin a su gobierno. {cite:tabari-tarikh-abu-al-fadl}"
  fr: "Chef de la rébellion Zanj dans le sud de l'Irak, dont les forces contrôlaient des villes comme Bassora et Wasit avant que la campagne d'al-Muwaffaq ne mette fin à son règne. {cite:tabari-tarikh-abu-al-fadl}"
  tr: "Zanj lideri, 255 Hicri yılında Şevval'de Basra Fıratı'nda göründü {cite:tabari-tarikh-abu-al-fadl j.9 s.410}, 56 yılının Rajab'ında Al-Abla'ya girdi {cite:tabari-tarikh-abu-al-fadl j.9 s.471} ve Abadan'ı ele geçirdi {cite:tabari-tarikh-abu-al-fadl j.9 s.472}. al-Mas'udi'ye göre, kendisini Ali ibn Muhammed ibn Ahmed ibn İsa ibn Zayd ibn Ali ibn al-al-Husayn olarak tanıtmış ve çoğu kişi davet edildiğini söylerken, Ebu Talib'in ailesi onu reddetmektedir. İki ve iki ağır sulama işlerinden bir aileden geliyordu. Kadınları ve çocukları öldürme eylemleri ile Şeyh al-Fani el-Fani Hariciler arasındaki Azerika'nın görüşünü yansıtıyordu. 'Allahu Ekber, La ilaha illa Allah, Allahu Ekber, gerçekten Allah'tan başka yargı yoktur' vaazıyla başlardı ve tüm günahları tektekilliktir sayardı. İlk raporunu derleyen kişi Muhammed ibn el-Hasan ibn idi Sahl, Dhu al-Riyatayn'ın yeğeni {atıf:muruj-al-dhahab s. 568} ve al-Mas'udi'ye göre günleri on dört yıl dört aydı. Basra'yı üç yüz bin kişinin öldürülmesi için tek bir savaşta Basra'ya getirmiş ve 270 H yılında Sefer'den iki gece önce Cumartesi gecesi öldürülmüştür. İbn al-Jawzi'ye göre, Ebu Ahmed el-Muwaffaq kuşatma sırasında ona tövbe etmesi ve Müslüman topluluğuna katılması için bir mektup göndermiş, bu da isteksizliğini ve ısrarını artırmış ve ona cevap vermemiştir {atıf:Muntazam-ibn-al-jawzi s. 58-59}"
  id: "Pemimpin Zanj muncul di Sungai Efrat Basra di Shawwal pada tahun 255 H {cite:tabari-tarikh-abu-al-fadl j.9 hlm.410}, memasuki Al-Abla di Rajab tahun 56 {cite:tabari-tarikh-abu-al-fadl j.9 hlm.471}, dan merebut Abadan {cite:tabari-tarikh-abu-al-fadl j.9 hlm.472}. Menurut al-Mas'udi, ia mengaku sebagai Ali ibn Muhammad ibn Ahmad ibn Isa ibn Zayd ibn Ali ibn al-Husayn, dan kebanyakan orang mengatakan ia diundang, sementara keluarga Abu Talib menolaknya. Ia berasal dari kelompok dua dan dua pekerjaan irigasi berat. Tindakannya membunuh wanita dan anak-anak, serta Sheikh al-Fani al-Fani mencerminkan pendapat Azariqa di kalangan Kharijit. Ia biasa memulai dengan khotbah 'Allahu Akbar, La ilaha illa Allah, Allahu Akbar, memang, tidak ada hukuman kecuali Allah,' dan ia menganggap semua dosa sebagai politeisme. Yang pertama menyusun laporannya adalah Muhammad ibn al-Hasan ibn Sahl, keponakan Dhu al-Riyatayn {cite:muruj-al-dhahab hlm. 568}, dan menurut al-Mas'udi, hari-harinya adalah empat belas tahun empat bulan. Ia membawa Basra ke Basra dalam satu pertempuran untuk membunuh tiga ratus ribu orang, dan ia tewas pada malam Sabtu dua malam sebelum Safar tahun 270 H. Menurut Ibn al-Jawzi, Abu Ahmad al-Muwaffaq mengirimkan surat kepadanya selama pengepungan yang memanggilnya untuk bertobat dan bergabung dengan komunitas Muslim, yang justru menambah keengganan dan ketekunannya, dan ia tidak membalas {cite:Muntazam-ibn-al-jawzi hlm. 58-59}"
