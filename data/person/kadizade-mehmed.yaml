summary:
  ar: "بطاقة أولية لقاضي زاده محمد، واعظ إسطنبول العثماني في القرن السابع عشر صاحب حركة القاضي زادلية، توفي سنة ١٦٣٥م؛ تذكره كتب التاريخ ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Kadizade Mehmed, the seventeenth-century Ottoman preacher of Istanbul and eponym of the Kadizadeli movement, d. 1635; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Kadizade Mehmed, predicador otomano del siglo XVII de Estambul y epónimo del movimiento Kadizadeli, fallecido en 1635; la entrada de la fuente aún no se ha comprobado en la página."
  fr: "Fiche de candidature pour Kadizade Mehmed, prédicateur ottoman du XVIIe siècle à Istanbul et éponyme du mouvement Kadizadeli, décédé en 1635; la source n'est pas encore vérifiée sur la page."
  ur: "استنبول کے سترہویں صدی کے عثمانی مبلغ اور کدی زادلی تحریک کے تخلص کادی زادے محمد کے لیے ڈرافٹ کارڈ، ڈی۔ 1635; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "On yedinci yüzyılda Osmanlı İstanbul'un vaizi ve Kadi Zadliye hareketinin kurucusu Azizadeh Muhammed'in ilk kartı 1635 yılında öldü; tarih kitaplarında anılmaktadır, ancak biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Qazizadeh Muhammad, seorang pengkhotbah Istanbul Ottoman pada abad ketujuh belas dan pendiri gerakan Qadi Zadliye, meninggal pada tahun 1635 M; ia dikenang dalam buku sejarah, tetapi biografinya belum pernah diulas di halaman."
