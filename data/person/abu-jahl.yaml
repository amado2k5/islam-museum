summary:
  en: "The most implacable leader of Meccan opposition to Muhammad: organizer of the boycott of Banu Hashim, persecutor of the weak converts, and the Quraysh commander killed at Badr."
  ar: "أعنف زعماء معارضة مكة لمحمد: صاحب مقاطعة بني هاشم، ومعذّب المستضعفين من المسلمين، وقائد قريش الذي قُتل ببدر. وعند البلاذري ابتاع من رجل من أراش بعيراً له بمكة فمطله بثمنه وحبسه حتى شق عليه فوقف الرجل على نادي قريش يستنجد فقالوا مستهزئين أترى الرجل الجالس انطلق إليه يأخذ لك بحقك فقام به النبي حتى ضرب باب أبي جهل فقال أخرج إلى الرجل من حقه قال نعم، فقال «لن أبرح أو تعطيه حقه» فدخل فخرج إليه بحقه، فلما سألوه قال دعوني فوالله ما هو إلا أن ضرب بابي حتى ذهب فؤادي فخرجت إليه وإن على رأسه لفحلاً ما رأيت مثل هامته وأنيابه قط فاتحاً فاه والله لو أبيت لأكلني فأعطيت الرجل حقه فقال القوم ما هو إلا بعض سحره {cite:ansab-al-ashraf p. 129-130}، وقال يوم بدر «اللهم أقطعنا للرحم وأتانا بما لا يعرف فأحنه الغداة» فنزل «إن تستفتحوا فقد جاءكم الفتح» واستفتاحه قوله هذا {cite:ansab-al-ashraf p. 130}"
