summary:
  ar: "أبو عبد الله محمد بن عبد الله بن عبد الحكم المصري، سمع من ابن وهب وأشهب من أصحاب مالك، وصحب الشافعي وتفقه به {cite:tabaqat-fuqaha-abbas-1981 p. 52}. حُمل في المحنة ⁦(مسألة خلق القرآن)⁩ إلى بغداد إلى ابن أبي دؤاد فلم يجب إلى ما طُلب منه ورُدّ إلى مصر، وانتهت إليه الرياسة بمصر {cite:tabaqat-fuqaha-abbas-1981 p. 52}."
  tr: "Ebu Abdullah Muhammed bin Abdullah ibn Abdül-Hakam el-Masri, Malik'in yoldaşları İbn Vahb ve Aşhab'dan haber aldı, el-Şafii'ye eşlik etti ve onun yanında fıkıh eğitimi aldı {atıf:Tabaqat-Fuqaha-Abbas-1981, s. 52}. Sınavı sırasında (Kur'an'ın Yaratılışı Meselesi) İbn Ebi Duad'ın yanına Bağdat'a götürüldü, ancak istenen sorulara cevap vermedi, Mısır'a döndü ve Mısır'daki liderlik onunla sona erdi {cite:Tabaqat-fuqaha-abbas-1981, s. 52}."
  id: "Abu Abdullah Muhammad ibn Abdullah ibn Abd al-Hakam al-Masri mendengar dari Ibn Wahb dan Ashhab, sahabat Malik, dan menemani al-Shafi'i serta mempelajari fiksi di bawah bimbingan {cite:tabaqat-fuqaha-abbas-1981, hlm. 52}. Ia dibawa selama masa ujian (The Issue of the Creation of the Qur'an) ke Baghdad kepada Ibn Abi Du'ad, tetapi ia tidak menjawab permintaan, kembali ke Mesir, dan kepemimpinan di Mesir berakhir dengannya {cite:Tabaqat-fuqaha-abbas-1981, hlm. 52}."
