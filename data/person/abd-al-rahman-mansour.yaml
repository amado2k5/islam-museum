summary:
  ar: "داعية يحفظ أرشيف أسابيل برنامجه التلفزيوني «أهالينا» عن الأسرة والتربية ⁦(ثلاث عشرة حلقة)⁩، ويذكره في متحدثي مصر؛ يقول في تسجيلاته إنه عمل مدرّسًا في معاهد أزهرية خاصة، ويخاطب فيها العاملين في قناة الندى. لا مقالة له في ويكيبيديا ولا مدخل في ويكيداتا؛ ما في هذه الصفحة من تسجيلاته ومنسوب إليه."
  en: "A preacher whose television programme on family life and upbringing, 'Ahalina' (thirteen episodes), is kept by the Assabile archive, which lists him among the speakers of Egypt; in the recordings he says he worked as a teacher in private Azhari institutes, and addresses the crew of al-Nada channel. No Wikipedia article or Wikidata item about him was found; what this page holds comes from his recordings and is attributed to him."
  ur: "ایک داعی جن کا خاندانی زندگی اور تربیت پر ٹیلی وژن پروگرام «اہالینا» (تیرہ اقساط) اسابیل آرکائیو میں محفوظ ہے، جو انہیں مصر کے مقررین میں شمار کرتا ہے؛ ریکارڈنگز میں وہ بتاتے ہیں کہ انہوں نے نجی ازہری اداروں میں تدریس کی، اور الندیٰ چینل کے عملے سے مخاطب ہوتے ہیں۔ ان کے بارے میں ویکیپیڈیا کا کوئی مضمون یا ویکی ڈیٹا کا کوئی اندراج نہیں ملا؛ اس صفحے کی معلومات ان کی ریکارڈنگز سے ہیں اور انہی سے منسوب ہیں۔"
