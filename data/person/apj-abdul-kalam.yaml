summary:
  ar: "عالم فضاء هندي ورئيس الهند الحادي عشر (2002–2007)، وُلد سنة 1931 في راميشورام لأسرة تاميلية مسلمة فقيرة، كان والدها صاحب قارب وإمام مسجد محلي، فعمل موزعا للصحف في صباه، ثم قاد في منظمة أبحاث الفضاء الهندية مشروع أول مركبة إطلاق أقمار صناعية هندية، وقاد برنامج الصواريخ الموجهة المتكامل فعُرف بـ«رجل الصواريخ»، ولعب دورا محوريا في تجارب بوخران النووية سنة 1998، ونال بهارات راتنا أعلى وسام مدني هندي سنة 1997، وتوفي سنة 2015 أثناء إلقائه محاضرة في شيلونغ."
  en: "Indian aerospace scientist and the eleventh President of India (2002–2007), born in 1931 in Rameswaram into a poor Tamil Muslim family — his father a boat owner and imam of a local mosque — who delivered newspapers as a boy, then led ISRO's first satellite launch vehicle project, headed the Integrated Guided Missile Development Programme that made him the 'Missile Man of India', played a pivotal role in the 1998 Pokhran-II nuclear tests, received the Bharat Ratna, India's highest civilian honour, in 1997, and died in 2015 while delivering a lecture in Shillong."
  ur: "بھارتی ایرو اسپیس سائنس دان اور بھارت کے گیارہویں صدر (2002–2007)، جو 1931 میں رامیشورم میں ایک غریب تمل مسلم خاندان میں پیدا ہوئے — ان کے والد کشتی کے مالک اور مقامی مسجد کے امام تھے — بچپن میں اخبار تقسیم کیے، پھر اسرو کے پہلے سیٹلائٹ لانچ وہیکل منصوبے کی قیادت کی، انٹیگریٹڈ گائیڈڈ میزائل پروگرام کی سربراہی پر «میزائل مین» کہلائے، 1998 کے پوکھران-II جوہری تجربات میں مرکزی کردار ادا کیا، 1997 میں بھارت رتن پایا، اور 2015 میں شیلانگ میں لیکچر دیتے ہوئے وفات پائی۔"
