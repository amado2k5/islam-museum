  en: "Nur al-Din Arslan Shah (d. 607) — Zangid ruler of Mosul, the only Shafi'i in his house and builder of its great Shafi'i madrasa where he was buried; succeeded by al-Qahir Izz al-Din Mas'ud {cite:wafayat-ayan}."
