summary:
  ar: "أبو الحارث أرسلان شاه بن عز الدين مسعود بن قطب الدين مودود بن عماد الدين زنكي؛ صاحب الموصل الملقب الملك العادل نور الدين؛ ملك الموصل بعد وفاة أبيه وكان ملكاً نبيهاً عارفاً بالأمور؛ انتقل إلى مذهب الشافعي ولم يكن في بيته شافعي سواه وبنى مدرسة للشافعية بالموصل قل أن توجد مدرسة في حسنها؛ وخلف ولدين هما الملك القاهر عز الدين مسعود والملك المنصور عماد الدين زنكي {cite:wafayat-ayan}."
  en: "Nur al-Din Arslan Shah (d. 607) — Zangid ruler of Mosul, the only Shafi'i in his house and builder of its great Shafi'i madrasa where he was buried; succeeded by al-Qahir Izz al-Din Mas'ud {cite:wafayat-ayan}."
  es: "Nur al-Din Arslan Shah (m. 607) — Gobernante zangid de Mosul, el único shafi'i en su casa y constructor de su gran madrasa shafi'i donde fue enterrado; sucedido por al-Qahir Izz al-Din Mas'ud {cite:wafayat-ayan}."
  fr: "Nur al-Din Arslan Shah (mort en 607) — Souverain zangide de Mossoul, le seul Shafi'i de sa maison et constructeur de sa grande madrasa Shafi'i où il fut enterré; remplacé par al-Qahir Izz al-Din Mas'ud {cite:wafayat-ayan}."
  ur: "نورالدین ارسلان شاہ ⁦(متوفی 607)⁩ - موصل کا زنگید حکمران، اپنے گھر میں واحد شافعی اور اس کے عظیم الشافعی مدرسے کا معمار جہاں اسے دفن کیا گیا تھا۔ القاہر عزالدین مسعود کی طرف سے کامیاب"
  tr: "Ebu el-Haris Arslan Şah ibn İzzeddin Mes'ud bin Kutb al-Din Mewdud ibn İmadeddin Zengi; Musul'un hükümdarı, lakabı Al-Malik al-Adil Nur al-Din; babasının ölümünden sonra Musul kralı oldu ve konularda bilgili peygamberlik yapan bir kraldı. Şafii okuluna geçti ve evinde kendisi dışında Şafii yoktu. Musul'da nadir güzellikte bir okul kurdu. Geride iki oğlu bıraktı: Kral El-Kahir İzzeddin Mes'ud ve Kral El-Mansur İmad el-Din Zengi {kaynak: wafayat-ayan}."
  id: "Abu al-Harith Arslan Shah ibn Izz al-Din Mas'ud ibn Qutb al-Din Mawdud ibn Imad al-Din Zangi; penguasa Mosul, dijuluki Al-Malik al-Adil Nur al-Din; ia menjadi raja Mosul setelah kematian ayahnya dan merupakan raja nabi yang berpengetahuan dalam berbagai hal. Ia berpindah agama ke mazhab Syafi'i dan tidak ada Syafi'i di rumahnya kecuali dirinya. Ia membangun sekolah Syafi'i di Mosul, sebuah sekolah yang sangat indah. Ia meninggalkan dua putra: Raja Al-Qahir Izz al-Din Mas'ud dan Raja Al-Mansur Imad al-Din Zengi {cite:wafayat-ayan}."
