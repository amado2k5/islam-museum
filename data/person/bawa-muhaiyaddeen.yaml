summary:
  ar: "معلّم ناطق بالتاميلية ومتصوّف من سريلانكا (نحو 1900 – 8 ديسمبر 1986)، ظهر في أوائل الأربعينيات قرب كاتاراغاما ونشأت حوله جماعات في جافنا وكولومبو، ثم جاء إلى الولايات المتحدة سنة 1971 فأسّس «زمالة باوا محيي الدين» في فيلادلفيا، وألّف أكثر من خمسة وعشرين كتابًا من أحاديثه، ويقع ضريحه في مزرعة الزمالة قرب كواتسفيل."
  en: "Tamil-speaking teacher and Sufi mystic from Sri Lanka (c. 1900 – 8 December 1986). He emerged in the early 1940s near Kataragama and gathered followings in Jaffna and Colombo, came to the United States in 1971 and founded the Bawa Muhaiyaddeen Fellowship in Philadelphia, authored over twenty-five books from his recorded discourses, and is buried at the Fellowship Farm near Coatesville."
  ur: "سری لنکا کے تامل بولنے والے استاد اور صوفی (تقریباً 1900 – 8 دسمبر 1986)؛ 1940 کی دہائی میں کٹارگاما کے قریب نمودار ہوئے، جافنا اور کولمبو میں پیروکار بنے، 1971 میں امریکا آ کر فلاڈیلفیا میں «باوا محی الدین فیلوشپ» قائم کی، اور ان کا مزار کؤٹسویل کے قریب فیلوشپ فارم میں ہے۔"
