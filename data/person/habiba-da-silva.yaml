  ar: "صانعة محتوى بريطانية في الجمال والموضة المحتشمة مقيمة في برمنغهام، عُرفت على الإنترنت باسم «لايف لونغ بيركشن» (LifeLongPercussion) من مدونتها الأولى قبل انتقالها إلى يوتيوب. يصفها موقعها بأنها مؤثرة دولية مقيمة في المملكة المتحدة بأكثر من مليون ونصف متابع عبر المنصات، وأنها أطلقت مشروعًا تجاريًا يحتفي بالتنوع والشمول — خط حجابها بألوان البشرة."
  en: "British beauty and modest-fashion creator based in Birmingham, known online as LifeLongPercussion from her first blog before her move to YouTube. Her own site describes her as an international influencer based in the United Kingdom with over 1.5 million followers across platforms, who launched a business venture celebrating diversity and inclusivity — her skin-tone hijab line."
  ur: "برمنگھم میں مقیم برطانوی بیوٹی اور مودسٹ فیشن کریئیٹر، جو آن لائن اپنے پہلے بلاگ کے نام «لائف لونگ پرکشن» (LifeLongPercussion) سے معروف ہوئیں قبل اس کے کہ یوٹیوب پر آئیں۔ ان کی ویب سائٹ انہیں برطانیہ میں مقیم بین الاقوامی انفلوئنسر بتاتی ہے جن کے تمام پلیٹ فارمز پر پندرہ لاکھ سے زائد فالوورز ہیں، اور جنہوں نے تنوع و شمولیت کا جشن منانے والا کاروبار شروع کیا — ان کی سکن ٹون حجاب لائن۔"
