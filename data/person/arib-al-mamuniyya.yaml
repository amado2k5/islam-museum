label: { ar: "عريب المأمونية", en: "Arib al-Ma'muniyya", ur: "عریب المامونیہ" }
gender: female
roles: [musician, poet]
summary:
  ar: "مغنية وشاعرة وكاتبة من أشهر قيان العصر العباسي ⁦(181–277هـ بحسب كحالة)⁩، نشأت بالبصرة وصارت إلى الأمين ثم اشتراها المأمون ثم المعتصم فأعتقها؛ نُسب إليها ألف صوت، وكانت بينها وبين شارية منافسة قسمت أهل الظرف إلى عريبية وشروية."
  en: "A singer, poet and letter-writer, one of the most celebrated singing women of the Abbasid age (181–277 AH according to Kahhala); raised at Basra, she passed to al-Amin, was bought by al-Ma'mun and then by al-Mu'tasim, who freed her. A thousand songs were credited to her, and her rivalry with Shariya split the connoisseurs into 'Aribis' and 'Sharawis'."
  ur: "عباسی دور کی مشہور ترین مغنیات میں سے ایک گلوکارہ، شاعرہ اور انشا پرداز ⁦(کحالہ کے مطابق 181–277ھ)⁩؛ بصرہ میں پلیں، امین کے پاس گئیں، پھر مامون اور پھر معتصم نے خریدا جنہوں نے آزاد کیا۔ ان سے ایک ہزار دھنیں منسوب تھیں، اور شاریہ سے ان کی رقابت نے اہلِ ذوق کو «عریبی» اور «شروی» گروہوں میں بانٹ دیا۔"
