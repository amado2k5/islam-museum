summary:
  ar: "بيدرو الأول ملك قشتالة، ابن ألفونسو الحادي عشر الذي مات بالطاعون سنة 1350م، وهو الذي أُرسل إليه ابن خلدون من غرناطة إلى إشبيلية في صلح سنة 765هـ. كان محمد الخامس صاحب غرناطة حليفه ودافع الجزية إليه، وقتل بيدرو في طبلادة قرب إشبيلية منافس محمد المخلوع، ثم فرّ من قشتالة سنة 1366م أمام أخيه غير الشقيق إنريكي دي طرسطمارة، وعاد سنة 1367م بمعونة الأمير الأسود، وبحسب دائرة المعارف الإسلامية قتله إنريكي قبل نهاية مارس 1369م {cite:encyclopaedia-of-islam-2 vol. 7 p. 1078} {cite:encyclopaedia-of-islam-2 vol. 3 p. 858}."
  en: "Pedro I of Castile was the son of Alfonso XI, who died of the plague in 1350. Ibn Khaldun was sent to him at Seville on a delicate peace mission from Granada at the end of 765/1364. Muhammad V of Granada was his ally and tributary; Pedro had the deposed Muhammad VI killed at Tablada near Seville, was driven out of Castile in 1366 by his half-brother Enrique of Trastamara, returned in 1367 with the help of the Black Prince, and by the end of March 1369 was dead, killed by Enrique according to the Encyclopaedia of Islam {cite:encyclopaedia-of-islam-2 vol. 7 p. 1078} {cite:encyclopaedia-of-islam-2 vol. 3 p. 858}."
  ur: "پیدرو اول، شاہِ قشتالہ، الفونسو یازدہم کے بیٹے تھے جو 1350ء میں طاعون سے مرے۔ ابن خلدون کو غرناطہ سے 765ھ/1364ء کے آخر میں ایک نازک صلح کی مہم پر اشبیلیہ میں ان کے پاس بھیجا گیا۔ غرناطہ کے محمد پنجم ان کے حلیف اور خراج گزار تھے؛ پیدرو نے معزول محمد ششم کو اشبیلیہ کے قریب طبلادہ میں قتل کروایا، 1366ء میں اپنے سوتیلے بھائی انریکے دی طرسطمارہ کے آگے قشتالہ سے بھاگے، 1367ء میں سیاہ شہزادے کی مدد سے لوٹے، اور مارچ 1369ء کے آخر تک مر چکے تھے، دائرۃ المعارف الاسلامیہ کے مطابق انریکے کے ہاتھوں {cite:encyclopaedia-of-islam-2 vol. 7 p. 1078} {cite:encyclopaedia-of-islam-2 vol. 3 p. 858}."
