kids:
  ar: "بيدرو الأول ملك قشتالة في القرن الرابع عشر الميلادي، تحالف مع ملوك غرناطة وأُرسل إليه ابن خلدون سفيراً."
  en: "Pedro I was a king of Castile in the 1300s who allied with the rulers of Granada and received the famous scholar Ibn Khaldun as an envoy."
  ur: "پیدرو اول چودہویں صدی میں قشتالہ کے بادشاہ تھے جنہوں نے غرناطہ کے حکمرانوں سے اتحاد کیا اور مشہور عالم ابن خلدون کو سفیر کے طور پر قبول کیا۔"
