summary:
  ar: "حسين الكردي، قائد الأسطول المملوكي الذي أرسله السلطان قانصوه الغوري لرد العدوان البرتغالي على بحر العرب والمحيط الهندي؛ قاد ثلاث عشرة سفينة عليها ألف وخمسمائة رجل فوصل إلى جزيرة ديو ثم شاول، والتقى بالأسطول البرتغالي بقيادة ألونزو دي ألميدا عام ٩١٤هـ/١٥٠٨م فكان النصر حليفه، لكن البرتغاليين عززوا قواتهم وأعادوا الكرة فهُزم الأسطول المملوكي في معركة ديو الشهيرة سنة ٩١٥هـ/١٥٠٩م {cite:dawlat-uthmaniyya-salabi p. 195}."
  en: "Husayn al-Kurdi — commander of the Mamluk fleet sent by Qansuh al-Ghawri against the Portuguese: victor at Chaul in 1508, defeated at the famous battle of Diu in 1509 {cite:dawlat-uthmaniyya-salabi p. 195}."
  es: "Husayn al-Kurdi: comandante de la flota mameluca enviada por Qansuh al-Ghawri contra los portugueses: vencedor en Chaul en 1508, derrotado en la famosa batalla de Diu en 1509 {citar:dawlat-uthmaniyya-salabi p. 195}."
  fr: "Husayn al-Kurdi — commandant de la flotte mamelouke envoyée par Qansuh al-Ghawri contre les Portugais: vainqueur à Chaul en 1508, vaincu à la célèbre bataille de Diu en 1509 {cite: dawlat-uthmaniyya-salabi p. 195}."
  ur: "حسین الکردی - مملوک بحری بیڑے کا کمانڈر جو پرتگالیوں کے خلاف قنسوح الغاوری کی طرف سے بھیجا گیا: 1508 میں چول میں فاتح، 1509 میں دیو کی مشہور جنگ میں شکست دی گئی۔ 195}"
  tr: "Sultan Qansuh al-Ghuri tarafından Arap Denizi ve Hint Okyanusu'ndaki Portekiz saldırısını püskürtmek için gönderilen Memlük filosunun komutanı Hüseyin el-Kurdi; 1.500 adamı taşıyan on üç gemiye liderlik ederek Diu Adası'na, ardından Saul'a ulaştı. 914 Hicri/1508 yılında Alonzo de Almeida komutasındaki Portekiz filosuyla karşılaştı ve zaferle sonuçlandı. Ancak Portekizliler kuvvetlerini güçlendirdi ve kontrolü yeniden ele geçirdi; 915 Hicri/1509 yılında ünlü Diu Muharebesi'nde Memlük filosunu mağlup etti {atıf:dawlat-uthmaniyya-salabi, s. 195}."
  id: "Hussein al-Kurdi, komandan armada Mamluk yang dikirim oleh Sultan Qansuh al-Ghuri untuk menangkis agresi Portugis di Laut Arab dan Samudra Hindia; ia memimpin tiga belas kapal yang membawa 1.500 orang dan mencapai Pulau Diu, kemudian Saul. Ia bertemu armada Portugis yang dipimpin oleh Alonzo de Almeida pada tahun 914 H/1508 M, yang berakhir dengan kemenangan. Namun, Portugis memperkuat pasukan mereka dan merebut kembali kendali, mengalahkan armada Mamluk dalam Pertempuran Diu yang terkenal pada tahun 915 H/1509 M {cite:dawlat-uthmaniyya-salabi, hlm. 195}."
