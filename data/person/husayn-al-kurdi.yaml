  ar: "حسين الكردي، قائد الأسطول المملوكي الذي أرسله السلطان قانصوه الغوري لرد العدوان البرتغالي على بحر العرب والمحيط الهندي؛ قاد ثلاث عشرة سفينة عليها ألف وخمسمائة رجل فوصل إلى جزيرة ديو ثم شاول، والتقى بالأسطول البرتغالي بقيادة ألونزو دي ألميدا عام ٩١٤هـ/١٥٠٨م فكان النصر حليفه، لكن البرتغاليين عززوا قواتهم وأعادوا الكرة فهُزم الأسطول المملوكي في معركة ديو الشهيرة سنة ٩١٥هـ/١٥٠٩م {cite:dawlat-uthmaniyya-salabi p. 195}."
  en: "Husayn al-Kurdi — commander of the Mamluk fleet sent by Qansuh al-Ghawri against the Portuguese: victor at Chaul in 1508, defeated at the famous battle of Diu in 1509 {cite:dawlat-uthmaniyya-salabi p. 195}."
