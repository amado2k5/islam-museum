id: person/husayn-al-kurdi
class: person
label: { ar: "الأمير حسين الكردي", en: "Amir Husayn al-Kurdi" }
summary:
  ar: "أمير جركسي وآمر الأسطول المملوكي، في شذرات الذهب أنه لما ظهرت الفرنج البرتقال في حدود العشرين وتسع مئة فعاثوا في أرض الهند ووصل أذاهم إلى جزيرة العرب وبنادر اليمن وجدة جهز إليهم السلطان قانصوه الغوري خمسين غراباً مع الأمير حسين الكردي وأرسل معه عسكراً عظيماً من الترك والمغاربة واللوند وجعل له جدة إقطاعاً وأمره بتحصينها فشرع في بناء سورها وإحكام أبراجها فبني السور جميعه في دون عام ثم توجه بعساكره إلى الهند في حدود سنة إحدى وعشرين فاجتمع بسلطان كجرات فأكرمه وهرب الفرنج عن البنادر لما سمعوا بوصوله ثم عاد على اليمن فافتتحها من بني طاهر ملوكها وقتل سلاطينها وترك بها نائباً بزبيد اسمه برسباي الجركسي وقدم مكة فبلغه زوال دولة الغوري وورد أمر السلطان سليم بقتله فأخذه شريف مكة بغتة وشمت به وأرسله لبحر جدة فغرقه فيه {cite:shadharat-dhahab p. 531}."
  en: "Mamluk admiral and governor of Jeddah — sent with fifty ghurab ships and Turkish, Maghrebi and Frankish troops to fortify Jeddah against the Portuguese, raised its wall within a year, relieved Gujarat, conquered Yemen from the Tahirids, then was seized by the sharif of Mecca and drowned off Jeddah on Selim's order {cite:shadharat-dhahab p. 531}."
