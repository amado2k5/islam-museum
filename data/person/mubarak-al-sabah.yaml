summary:
  ar: "مبارك بن صباح الصباح، الملقب بمبارك الكبير وبأسد الجزيرة (سنة ولادته متنازع عليها: نحو 1837 أو 1844 – توفي في الكويت في 28 نوفمبر 1915)، حاكم الكويت السابع من أسرة آل صباح، وابن حاكمها الرابع صباح الثاني. قضى شبابه قائدًا عسكريًا في البادية وفي حملات عثمانية إلى الأحساء وقطر وجنوب العراق، ثم قتل أخويه غير الشقيقين الحاكم محمدًا وجراحًا سنة 1896 وتولى الحكم، فقاوم سنواتٍ خصمه يوسف الإبراهيم وسعى لنيل اعتراف السلطنة حتى عُيّن قائمقامًا سنة 1897، ووقّع الاتفاق السري مع بريطانيا في يناير 1899، وخاض حملة الصريف الفاشلة سنة 1901، ودعم عبد العزيز آل سعود في بداياته، وأيّد بريطانيا في مطلع الحرب العالمية الأولى فاعترفت له باستقلال الكويت تحت الحماية. وهو أبو الحاكمين جابر وسالم، وجدّ فرعي آل جابر وآل سالم، وتنصّ المادة الدستورية الكويتية على أن يكون الأمير من ذريته."
  en: "Mubarak bin Sabah Al-Sabah, called Mubarak the Great and the Lion of the Peninsula (his birth year is disputed: c. 1837 or 1844 – died at Kuwait on 28 November 1915), was the seventh ruler of Kuwait of the Al-Sabah family and a son of its fourth ruler, Sabah II. He spent his youth as a cavalry commander in the desert and in Ottoman campaigns into al-Ahsa, Qatar and southern Iraq, then killed his half-brothers the ruler Muhammad and Jarrah in 1896 and took the throne; he withstood his rival Yusuf al-Ibrahim for years, sought the Sultan's recognition until he was made kaymakam in 1897, signed the secret agreement with Britain in January 1899, mounted the failed Sarif campaign of 1901, supported Abdulaziz Al Saud in his early years, and sided with Britain at the opening of the First World War, which recognised Kuwait as independent under British protection. He was the father of the rulers Jaber and Salim, ancestor of the Al-Jaber and Al-Salim branches, and Kuwait's constitution requires the Emir to be among his descendants."
  ur: "مبارک بن صباح الصباح، مبارک الکبیر (پیدائش متنازع: تقریباً 1837ء یا 1844ء – وفات: کویت، 28 نومبر 1915ء)، کویت کے ساتویں حکمران تھے۔ انہوں نے 1896ء میں اپنے سوتیلے بھائیوں محمد و جراح کو قتل کر کے حکومت سنبھالی، 1899ء میں برطانیہ سے معاہدہ کیا، اور جدید کویت کے بانی سمجھے جاتے ہیں۔ ان کے بیٹے جابر و سالم بھی کویت کے حکمران بنے۔"
