id: person/salih-ibn-mansur
class: person
label:
  ar: صالح بن منصور الحميري
  en: Salih ibn Mansur al-Himyari
  es: "Salih ibn Mansur al-Himyari"
  fr: "Salih ibn Mansur al-Himyari"
  ur: "صالح بن منصور الحمیری"
summary:
  ar: "صالح بن منصور الحميري، جد ملوك نكور؛ جرى على يده إسلام غمارة في دولة بني أمية، وكان إماماً على مذهب مالك مستقيماً على الاقتداء والشرائع، وله حكم منظومة سماها الرندية، وولاه الخلفاء على جهاد البرير وأمدّه بالبعوث؛ وارتد قومه مرة فأخرجوه وولّوا رجلاً من نفزة يعرف بالرندي ثم تابوا وراجعوا الإسلام وراجعوه فأقام فيهم إلى أن هلك بتمساسان سنة 182هـ."
  en: "Salih ibn Mansur al-Himyari, ancestor of the kings of Nekour; through him the Ghumara embraced Islam under the Umayyad state — a Maliki imam of steadfast observance who received caliphal expeditions for the jihad of the Berbers, and composer of the verse rulings called al-Randiyya; when his people apostatised once and expelled him for a Nafza man called al-Randi, they repented, returned to Islam and recalled him, and he dwelt among them until his death at Tamsasan in 182 AH."
  es: "Salih ibn Mansur al-Himyari, antepasado de los reyes de Nekour; a través de él, los Ghumara abrazaron el Islam bajo el estado omeya; un imán malikí de observancia firme que recibió expediciones califales para la yihad de los bereberes, y autor de las normas en verso llamadas al-Randiyya; cuando su pueblo apostató una vez y lo expulsó por un hombre de Nafza llamado al-Randi, se arrepintieron, volvieron al Islam y lo llamaron de regreso, y él habitó entre ellos hasta su muerte en Tamsasan en el año 182 AH."
  fr: "Salih ibn Mansur al-Himyari, ancêtre des rois de Nekour; c'est par lui que les Ghumara embrassèrent l'islam sous l'État omeyyade — un imam malikite d'une observance inébranlable qui reçut des expéditions califales pour le jihad des Berbères, et compositeur des versets dictant les décisions appelés al-Randiyya; lorsque son peuple apostasia une fois et l'expulsa pour un homme nafza appelé al-Randi, ils se repentirent, revinrent à l'islam et le rappelèrent, et il demeura parmi eux jusqu'à sa mort à Tamsasan en 182 AH."
  ur: "صالح بن منصور الحمیری، نیکور کے بادشاہوں کے اجداد؛ اس کے ذریعے غمارہ نے اموی ریاست کے تحت اسلام قبول کیا - ثابت قدمی کے مالکی امام جنہوں نے بربروں کے جہاد کے لیے خلیفہ کی مہمات حاصل کیں، اور آیت کے احکام الراندیہ کہلانے والے؛ جب اس کی قوم نے ایک بار مرتد ہو کر اسے الرندی نامی ایک نفضہ شخص کی وجہ سے ملک بدر کر دیا تو انہوں نے توبہ کی، اسلام کی طرف لوٹ آئے اور اسے واپس بلا لیا اور وہ 182 ہجری میں تمسان میں اپنی وفات تک ان کے درمیان رہے۔"
