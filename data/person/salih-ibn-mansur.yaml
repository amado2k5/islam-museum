label:
  ar: صالح بن منصور الحميري
  en: Salih ibn Mansur al-Himyari
summary:
  ar: "صالح بن منصور الحميري، جد ملوك نكور؛ جرى على يده إسلام غمارة في دولة بني أمية، وكان إماماً على مذهب مالك مستقيماً على الاقتداء والشرائع، وله حكم منظومة سماها الرندية، وولاه الخلفاء على جهاد البرير وأمدّه بالبعوث؛ وارتد قومه مرة فأخرجوه وولّوا رجلاً من نفزة يعرف بالرندي ثم تابوا وراجعوا الإسلام وراجعوه فأقام فيهم إلى أن هلك بتمساسان سنة 182هـ."
  en: "Salih ibn Mansur al-Himyari, ancestor of the kings of Nekour; through him the Ghumara embraced Islam under the Umayyad state — a Maliki imam of steadfast observance who received caliphal expeditions for the jihad of the Berbers, and composer of the verse rulings called al-Randiyya; when his people apostatised once and expelled him for a Nafza man called al-Randi, they repented, returned to Islam and recalled him, and he dwelt among them until his death at Tamsasan in 182 AH."
