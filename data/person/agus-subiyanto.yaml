  ar: "أغوس سوبيانتو ⁦(وُلد في ٥ آب ١٩٦٧ في تشيماهي بجاوة الغربية)⁩ جنرال إندونيسي يشغل منصب قائد القوات المسلحة الوطنية الإندونيسية منذ تشرين الثاني ٢٠٢٣؛ خدم في القوات الخاصة ⁦(كوباسوس)⁩ وفي تيمور الشرقية، وتولى قيادة المنطقة العسكرية الثالثة ورئاسة أركان الجيش قبل تعيينه قائدًا عامًا."
  en: "Agus Subiyanto (born 5 August 1967 in Cimahi, West Java) is an Indonesian general serving as Commander of the Indonesian National Armed Forces since November 2023; a Kopassus special-forces officer who served in East Timor, he commanded Kodam III/Siliwangi and was Chief of Staff of the Army before his appointment as armed forces commander."
  ur: "آگس سوبیانتو ⁦(پیدائش 5 اگست 1967، چیماہی، مغربی جاوا)⁩ انڈونیشی جنرل ہیں جو نومبر 2023 سے انڈونیشیا کی قومی مسلح افواج کے کمانڈر ہیں؛ وہ کوپاسس خصوصی فورسز کے افسر رہے، مشرقی تیمور میں خدمات انجام دیں، اور کمانڈر بننے سے پہلے فوج کے چیف آف اسٹاف رہے۔"
