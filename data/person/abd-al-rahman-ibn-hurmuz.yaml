  tr: "Abdülrahman ibn Hurmuz el-Araj, İbn Lahi'ah, Ebu el-Nadr'dan rivayetle, Arapçayı ilk kuran kişinin o olduğunu ve Kureyş'in soy ağacı ve tarihi konusunda en bilgili kişilerden biri olduğunu ve Kureyş Kur'an okuyucularından biri olduğunu nakletmiştir. {Kaynak: Fihrist ibn el-Nadim, s. 104}"
  id: "Abd al-Rahman ibn Hurmuz al-Araj, Ibn Lahi’ah meriwayatkan dari Abu al-Nadr bahwa dialah orang pertama yang mengembangkan bahasa Arab dan merupakan orang yang paling berpengetahuan tentang silsilah dan sejarah Quraisy serta salah satu pembaca Al-Qur'an {cite:fihrist-ibn-al-nadim p. 104}."
