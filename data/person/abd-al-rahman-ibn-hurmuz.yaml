  ar: "عبد الرحمن بن هرمز الأعرج، روى ابن لهيعة عن أبي النضر أنه كان أول من وضع العربية وكان أعلم الناس بأنساب قريش وأخبارها وأحد القراء {cite:fihrist-ibn-al-nadim p. 104}."
