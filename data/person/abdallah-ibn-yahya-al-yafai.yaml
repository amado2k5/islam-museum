summary:
  ar: "الإمام العلامة عبد الله بن يحيى اليافعي؛ مات مدرس سبتة وقد رُوّع عليه خافق باليمن وذاك صاحب البيان يحبه، وحضر منازعته يوم مات؛ روى أن أناساً وقعوا عليه في طريق فضربوه بالسيوف فلم تقطع سيوفهم فسئل عن ذلك فقال كنت أقرأ سورة يس، وصنف كتاب التعريف في الفقه وكان يقوم بكفايته وما يحتاج إليه رجل من مشايخ بني يحيى من يافع؛ ترجمته في أخبار سنة ثلاث وخمسين وخمسمائة {cite:shadharat-dhahab p. 646-647}."
  en: "The imam Abdallah ibn Yahya al-Yafa'i of Yemen; he died lecturer of his town — one account has men falling on him with swords that cut nothing, and when asked he said 'I was reciting Surat Ya-Sin'; author of the Ta'rif in fiqh, supported by one of the shaykhs of the Banu Yahya of Yafi'; his notice falls in year 553 {cite:shadharat-dhahab p. 646-647}."
