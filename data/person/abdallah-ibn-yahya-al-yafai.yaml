names:
  - { value: "الإمام العلامة عبد الله بن يحيى اليافعي اليمني", kind: full }
summary:
  ar: "الإمام العلامة عبد الله بن يحيى اليافعي؛ مات مدرس سبتة وقد رُوّع عليه خافق باليمن وذاك صاحب البيان يحبه، وحضر منازعته يوم مات؛ روى أن أناساً وقعوا عليه في طريق فضربوه بالسيوف فلم تقطع سيوفهم فسئل عن ذلك فقال كنت أقرأ سورة يس، وصنف كتاب التعريف في الفقه وكان يقوم بكفايته وما يحتاج إليه رجل من مشايخ بني يحيى من يافع؛ ترجمته في أخبار سنة ثلاث وخمسين وخمسمائة {cite:shadharat-dhahab p. 646-647}."
  en: "The imam Abdallah ibn Yahya al-Yafa'i of Yemen; he died lecturer of his town — one account has men falling on him with swords that cut nothing, and when asked he said 'I was reciting Surat Ya-Sin'; author of the Ta'rif in fiqh, supported by one of the shaykhs of the Banu Yahya of Yafi'; his notice falls in year 553 {cite:shadharat-dhahab p. 646-647}."
  fr: "L'imam Abdallah ibn Yahya al-Yafa'i du Yémen ; il mourut maître d'enseignement de sa ville — un récit rapporte que des hommes l'attaquèrent avec des épées qui ne tranchaient rien, et qu'interrogé il dit « je récitais la sourate Ya-Sin » ; auteur du Ta'rif en fiqh, soutenu par l'un des cheikhs des Banu Yahya de Yafi' ; sa notice se trouve à l'année 553 {cite:shadharat-dhahab p. 646-647}."
  es: "El imán Abdallah ibn Yahya al-Yafa'i de Yemen; murió siendo conferenciante en su ciudad; según un relato, unos hombres lo atacaron con espadas que no cortaban nada, y cuando le preguntaron, dijo: \"Estaba recitando la Sura Ya-Sin\"; autor del Ta'rif en fiqh, apoyado por uno de los shaykhs de los Banu Yahya de Yafi'; su mención data del año 553 {cita: shadharat-dhahab págs. 646-647}."
  ur: "یمن کے امام عبداللہ بن یحییٰ ال یافعی؛ وہ اپنے شہر کے لیکچرر کا انتقال ہو گیا - ایک بیان میں ہے کہ لوگ اس پر تلواریں لے کر گر رہے ہیں جو کچھ نہیں کاٹتے تھے، اور جب اس سے پوچھا گیا تو اس نے کہا 'میں سورت یٰسین کی تلاوت کر رہا تھا'۔ فقہ میں طریف کے مصنف، جس کی تائید بنو یحییٰ کے یافی کے شیخوں میں سے ایک نے کی ہے۔ اس کا نوٹس 553 میں آتا ہے۔ 646-647}۔"
  tr: "Bilgin İmam Abdullah bin Yahya el-Yafiî; Ceuta'nın hocası vefat etti ve Yemen'in kalbi onun için korkuya kapıldı. O belagatli adam onu çok severdi ve vefat ettiği gün onun tartışmasına şahit oldu. Rivayet edildiğine göre, yolda ona saldırdılar ve kılıçlarla vurdular, ancak kılıçları onu kesmedi. Bunun sebebi sorulduğunda, \"Yasin Suresi okuyordum\" dedi. Fıkıh alanında El-Tarif adlı kitabı yazdı ve Yafiî'den Beni Yahya şeyhlerinden birinin ihtiyaç duyduğu her şeyi kendi ihtiyaçlarını karşılayabildi. Biyografisi 553 yılındaki haberlerde yer almaktadır. {Kaynak: Şadharat-Dhaba s. 646-647}"
  id: "Imam Abdullah bin Yahya Al-Yafi’i yang terpelajar; guru dari Ceuta wafat, dan hati Yaman berduka atas kepergiannya, dan orang yang fasih berbicara itu sangat menyayanginya, dan ia hadir dalam perdebatannya pada hari wafatnya; diriwayatkan bahwa orang-orang menyerangnya di jalan dan memukulnya dengan pedang, tetapi pedang mereka tidak melukainya, lalu ia ditanya tentang hal itu, dan ia berkata, “Saya sedang membaca Surat Yasin.” Ia menulis kitab Al-Ta’rif dalam ilmu fiqih, dan ia mampu memenuhi kebutuhannya dan apa yang dibutuhkan oleh seorang syekh dari Bani Yahya dari Yafi’i; biografinya menjadi berita pada tahun 553 {cite:shadharat-dhahab p. 646-647}."
