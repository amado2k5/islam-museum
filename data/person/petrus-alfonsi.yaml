floruit: { edtf: "1106/1130", calendar: julian, precision: year, status: historical, note: "The article gives his floruit as 1106 to about 1130, with conversion in 1106 {cite:encyclopaedia-of-islam-2 vol. 8 p. 323}; the article on orientalists instead gives Moses Sefardi's years as 1062-1110 {cite:encyclopaedia-of-islam-2 vol. 7 p. 791}. The two statements do not agree and are both kept." }
