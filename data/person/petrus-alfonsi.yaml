summary:
  ar: "بطرس ألفونسي مناظر ومترجم أندلسي، اعتنق المسيحية سنة 1106م وكان يسمى قبلها موسى سفردي بحسب مقالة المستشرقين في دائرة المعارف الإسلامية. ألّف حوارات ضد اليهود حوالي سنة 1108 أو 1110م، وفي فصلها الخامس يهاجم الإسلام معتمداً في الأغلب على نص عربي ينسب إلى عبد المسيح بن إسحاق الكندي، وكتب مجموعة أمثال وحكايات هي تعليم الكهنة، وصاغ سنة 1116م تعديلاً لاتينياً لزيج السند هند للخوارزمي، وتقول المقالة إن مولده ووفاته غير معروفين وإن أخباره قليلة {cite:encyclopaedia-of-islam-2 vol. 8 p. 323} {cite:encyclopaedia-of-islam-2 vol. 7 p. 791}."
  en: "Petrus Alfonsi was an Andalusian polemicist and translator, a convert to Christianity in 1106, who according to the Encyclopaedia of Islam's article on orientalists was called Moses Sefardi before his baptism. He wrote the Dialogi against the Jews around 1108 or 1110, whose fifth chapter attacks Islam following largely an Arabic text ascribed to 'Abd al-Masih ibn Ishaq al-Kindi; he compiled the proverb-and-fable collection Disciplina clericalis; and in 1116 he made a Latin adaptation of al-Khwarizmi's Sindhind tables. The articles read give neither a birth nor a death date and say little is known of the man {cite:encyclopaedia-of-islam-2 vol. 8 p. 323} {cite:encyclopaedia-of-islam-2 vol. 7 p. 791}."
  ur: "پیٹرس الفونسی اندلسی مناظر اور مترجم تھے جنہوں نے 1106ء میں عیسائیت اختیار کی، اور دائرۃ المعارف الاسلامیہ کے مستشرقین والے مقالے کے مطابق بپتسمہ سے پہلے ان کا نام موسیٰ سفردی تھا۔ انہوں نے یہودیوں کے خلاف مکالمات تقریباً 1108 یا 1110ء میں لکھے، جن کے پانچویں باب میں وہ اسلام پر تنقید کرتے ہیں اور زیادہ تر ایک عربی متن کی پیروی کرتے ہیں جو عبد المسیح بن اسحاق کندی سے منسوب ہے؛ انہوں نے کہاوتوں اور حکایتوں کا مجموعہ ڈسپلینا کلیریکالس مرتب کیا؛ اور 1116ء میں خوارزمی کے زیجِ سندھ ہند کا لاطینی تلخیصی ترجمہ کیا۔ پڑھے گئے مقالات میں نہ ان کی ولادت کی تاریخ ہے نہ وفات کی، اور وہ بتاتے ہیں کہ ان کے بارے میں کم معلوم ہے {cite:encyclopaedia-of-islam-2 vol. 8 p. 323} {cite:encyclopaedia-of-islam-2 vol. 7 p. 791}."
  es: "Petrus Alfonsi fue un polemista y traductor andalusí, convertido al cristianismo en 1106, quien, según el artículo de la Enciclopedia del Islam sobre orientalistas, se llamaba Moisés Sefardí antes de su bautismo. Escribió los Diálogos contra los judíos alrededor de 1108 o 1110, cuyo quinto capítulo ataca al Islam basándose en gran medida en un texto árabe atribuido a 'Abd al-Masih ibn Ishaq al-Kindi; compiló la colección de proverbios y fábulas Disciplina clericalis; y en 1116 realizó una adaptación latina de las tablas Sindhind de al-Juarismi. Los artículos leídos no dan ni fecha de nacimiento ni de muerte y dicen que se sabe poco de él {cite:encyclopaedia-of-islam-2 vol. 8 p. 323} {cite:encyclopaedia-of-islam-2 vol. 7 p. 791}."
  fr: "Petrus Alfonsi était un polémiste et traducteur andalou, converti au christianisme en 1106. Selon l'article de l'Encyclopédie de l'Islam consacré aux orientalistes, il s'appelait Moïse Séfarade avant son baptême. Il écrivit les Dialogues contre les Juifs vers 1108 ou 1110, dont le cinquième chapitre attaque l'islam en s'appuyant en grande partie sur un texte arabe attribué à 'Abd al-Masih ibn Ishaq al-Kindi. Il compila également le recueil de proverbes et de fables Disciplina clericalis et, en 1116, il réalisa une adaptation latine des Tables du Sind d'al-Khwarizmi. Les articles consultés ne précisent ni sa date de naissance ni sa date de décès et indiquent que l'on sait peu de choses sur lui."
  tr: "Peter Alfonse, 1106 yılında Hristiyanlığa geçen ve daha önce İslam Ansiklopedisi'ndeki oryantalistler makalesine göre Musa Safardi olarak anılan Endülüslü bir tartışmacı ve çevirmendi. 1108 veya 1110 civarında Yahudilere karşı diyaloglar yazdı ve beşinci bölümde İslam'a saldırıyor; çoğunlukla Abd al-Masih ibn Ishaq al-Kindi'ye atfedilen Arapça bir metne dayanıyor. Rahiplere öğreten atasözleri ve hikayelerden oluşan bir derleme yazdı ve 1116 yılında Al-Khwarizmi'nin Sind Hind'in Zij'inin Latince bir uyarlamasını taslak olarak hazırladı. Makalede doğumunun ve ölümünün bilinmediği ve haberlerinin az olduğu belirtilir {atıf: İslam ansiklopedisi-2 cilt 8, s. 323} {atıf:İslam Ansiklopedisi-2 cilt 7, s. 791}."
  id: "Peter Alfonse adalah seorang debater dan penerjemah Andalusia yang memeluk Kristen pada tahun 1106 M dan sebelumnya disebut Musa Safardi menurut artikel tentang orientalis dalam Ensiklopedia Islam. Ia menulis dialog menentang orang Yahudi sekitar tahun 1108 atau 1110 M, dan pada bab kelima ia menyerang Islam, sebagian besar mengandalkan teks Arab yang dikaitkan dengan Abd al-Masih ibn Ishaq al-Kindi. Ia menulis kumpulan peribahasa dan kisah yang mengajarkan para imam, dan pada tahun 1116 M ia menyusun modifikasi Latin dari Zij of the Sind Hind oleh Al-Khwarizmi. Artikel tersebut menyatakan bahwa kelahiran dan kematiannya tidak diketahui dan kabarnya sangat sedikit {cite:encyclopaedia-of-Islam-2 vol. 8, hlm. 323} {cite:Encyclopaedia-of-Islam-2 vol. 7, hlm. 791}."
