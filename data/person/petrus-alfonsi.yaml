summary:
  ar: "بطرس ألفونسي مناظر ومترجم أندلسي، اعتنق المسيحية سنة 1106م وكان يسمى قبلها موسى سفردي بحسب مقالة المستشرقين في دائرة المعارف الإسلامية. ألّف حوارات ضد اليهود حوالي سنة 1108 أو 1110م، وفي فصلها الخامس يهاجم الإسلام معتمداً في الأغلب على نص عربي ينسب إلى عبد المسيح بن إسحاق الكندي، وكتب مجموعة أمثال وحكايات هي تعليم الكهنة، وصاغ سنة 1116م تعديلاً لاتينياً لزيج السند هند للخوارزمي، وتقول المقالة إن مولده ووفاته غير معروفين وإن أخباره قليلة {cite:encyclopaedia-of-islam-2 vol. 8 p. 323} {cite:encyclopaedia-of-islam-2 vol. 7 p. 791}."
  en: "Petrus Alfonsi was an Andalusian polemicist and translator, a convert to Christianity in 1106, who according to the Encyclopaedia of Islam's article on orientalists was called Moses Sefardi before his baptism. He wrote the Dialogi against the Jews around 1108 or 1110, whose fifth chapter attacks Islam following largely an Arabic text ascribed to 'Abd al-Masih ibn Ishaq al-Kindi; he compiled the proverb-and-fable collection Disciplina clericalis; and in 1116 he made a Latin adaptation of al-Khwarizmi's Sindhind tables. The articles read give neither a birth nor a death date and say little is known of the man {cite:encyclopaedia-of-islam-2 vol. 8 p. 323} {cite:encyclopaedia-of-islam-2 vol. 7 p. 791}."
  ur: "پیٹرس الفونسی اندلسی مناظر اور مترجم تھے جنہوں نے 1106ء میں عیسائیت اختیار کی، اور دائرۃ المعارف الاسلامیہ کے مستشرقین والے مقالے کے مطابق بپتسمہ سے پہلے ان کا نام موسیٰ سفردی تھا۔ انہوں نے یہودیوں کے خلاف مکالمات تقریباً 1108 یا 1110ء میں لکھے، جن کے پانچویں باب میں وہ اسلام پر تنقید کرتے ہیں اور زیادہ تر ایک عربی متن کی پیروی کرتے ہیں جو عبد المسیح بن اسحاق کندی سے منسوب ہے؛ انہوں نے کہاوتوں اور حکایتوں کا مجموعہ ڈسپلینا کلیریکالس مرتب کیا؛ اور 1116ء میں خوارزمی کے زیجِ سندھ ہند کا لاطینی تلخیصی ترجمہ کیا۔ پڑھے گئے مقالات میں نہ ان کی ولادت کی تاریخ ہے نہ وفات کی، اور وہ بتاتے ہیں کہ ان کے بارے میں کم معلوم ہے {cite:encyclopaedia-of-islam-2 vol. 8 p. 323} {cite:encyclopaedia-of-islam-2 vol. 7 p. 791}."
