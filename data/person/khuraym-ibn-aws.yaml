id: person/khuraym-ibn-aws
class: person
label: { ar: "خريم بن أوس الطائي" }
summary:
  ar: "عند البلاذري: خريم بن أوس بن حارثة بن لام الطائي قال للنبي إن فتح الله عليك الحيرة فأعطني ابنة بقيلة فلما صالح خالد أهل الحيرة ذكّره وشهد له بشير بن سعد ومحمد بن مسلمة الأنصاريان فاستثناها خالد من الصلح ودفعها إليه فاشتراها أهلها منه بألف درهم وكانت عجوزاً فقيل له قد أرخصتها كان أهلها يدفعون أضعاف ما سألت فقال ما كنت أظن أن عدداً يكون أكثر من عشر مائة — وفي رواية أن السائل رجل من ربيعة والأول أثبت."
  en: "In al-Baladhuri: Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i, who told the Prophet 'if God opens al-Hira for you, give me Buqayla's daughter'; at the peace he reminded Khalid, Bashir ibn Sa'd and Muhammad ibn Maslama al-Ansari testified, Khalid excepted her from the treaty and delivered her to him — her people bought her back for a thousand dirhams though old, telling him he sold cheap, and he answered 'I did not think a number could exceed a thousand' — a variant makes the asker a Rabi'a man, the first account firmer."
  es: "En al-Baladhuri: Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i, quien le dijo al Profeta 'si Dios te abre al-Hira, dame a la hija de Buqayla'; en la paz le recordó a Khalid, Bashir ibn Sa'd y Muhammad ibn Maslama al-Ansari testificaron, Khalid la excluyó del tratado y se la entregó; su gente la compró de vuelta por mil dirhams a pesar de ser vieja, diciéndole que la había vendido barata, y él respondió 'No pensé que un número pudiera exceder los mil'; una variante hace que el que pregunta sea un hombre Rabi'a, la primera versión es más firme."
  fr: "Dans al-Baladhuri: Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i, qui dit au Prophète: « Si Dieu t'ouvre al-Hira, donne-moi la fille de Buqayla »; lors de la paix qu'il rappela à Khalid, Bashir ibn Sa'd et Muhammad ibn Maslama al-Ansari témoignèrent que Khalid l'avait exclue du traité et la lui avait livrée — son peuple la racheta pour mille dirhams malgré son âge avancé, lui disant qu'il la vendait à bas prix, et il répondit: « Je ne pensais pas qu'un nombre puisse dépasser mille » — une variante fait de celui qui posait la question un homme de Rabi'a, le premier récit étant plus fiable."
  ur: "البلادوری میں ہے: خریم بن اوس بن حارثہ بن لام الطائی، جس نے رسول اللہ سے کہا کہ اگر اللہ آپ کے لیے حیرہ کھول دے تو مجھے بوکیلہ کی بیٹی دے دو۔ اس نے خالد، بشیر بن سعد اور محمد بن مسلمہ الانصاری کی گواہی یاد دلائی، خالد نے اسے معاہدہ سے خارج کر دیا اور اسے اس کے حوالے کر دیا - اس کے لوگوں نے اسے ایک ہزار درہم میں واپس خرید لیا، حالانکہ وہ پرانی تھی، اور اس نے اسے کہا کہ اس نے سستا فروخت کیا، اور اس نے جواب دیا 'مجھے نہیں لگتا تھا کہ ایک ہزار سے زیادہ ہو سکتا ہے' - ایک شخص کے حساب سے ایک قسم کا حساب ہوتا ہے۔"
  tr: "El-Baladhuri'ye göre: Huram ibn Av ibn Haritha ibn Lam el-Tai Peygamber'e şöyle dedi: Eğer Allah sana El-Hire'de merhamet ederse, bana Baqaila'nın bir kızını ver. Halid El-Hirah halkıyla barıştığında, onu ve Beşîr ibn Sa'd'ı andı; Muhammed ibn Maslamah el-Ensariyyan onun lehine tanıklık etti. Halid onu uzlaşmadan dışladı ve kendisine ödeme yaptı, böylece ailesi onu bin dirheme satın aldı. Kadın yaşlıydı. Ona şöyle denir: 'Onu indirime indirmişti ve ailesi istediğinin çok katını ödemiştir.' Şöyle dedi: Sayının on yüzü aşacağını düşünmemiştim—başka bir rivayette, sorgulayan kişi Rabiah'tan bir adamdı ve ilk kişi doğrulandı."
  id: "Menurut Al-Baladhuri: Khuraym ibn Aws ibn Haritha ibn Lam al-berkata kepada Nabi: Jika Allah memberi rahmat kepadamu di Al-Hirah, maka berikanlah aku seorang putri Baqaila. Ketika Khalid berdamai dengan umat Al-Hirah, ia menyebutkan dirinya dan Bashir ibn Sa'd serta Muhammad ibn Maslamah al-Ansariyyan menjadi saksi untuknya. Khalid mengecualikannya dari pemukiman dan membayarnya kepadanya, sehingga keluarganya membelinya darinya seharga seribu dirham. Dia sudah tua. Dikatakan kepadanya, 'Dia telah menurunkan harga tubuhnya, dan keluarganya membayar berkali-kali lipat dari yang diminta.' Dia berkata: Saya tidak menyangka jumlahnya akan melebihi sepuluh ratus—dan dalam riwayat lain, penanya adalah seorang pria dari Rabi'ah, dan yang pertama terverifikasi."
