id: person/khuraym-ibn-aws
class: person
label: { ar: "خريم بن أوس الطائي" }
summary:
  ar: "عند البلاذري: خريم بن أوس بن حارثة بن لام الطائي قال للنبي إن فتح الله عليك الحيرة فأعطني ابنة بقيلة فلما صالح خالد أهل الحيرة ذكّره وشهد له بشير بن سعد ومحمد بن مسلمة الأنصاريان فاستثناها خالد من الصلح ودفعها إليه فاشتراها أهلها منه بألف درهم وكانت عجوزاً فقيل له قد أرخصتها كان أهلها يدفعون أضعاف ما سألت فقال ما كنت أظن أن عدداً يكون أكثر من عشر مائة — وفي رواية أن السائل رجل من ربيعة والأول أثبت."
  en: "In al-Baladhuri: Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i, who told the Prophet 'if God opens al-Hira for you, give me Buqayla's daughter'; at the peace he reminded Khalid, Bashir ibn Sa'd and Muhammad ibn Maslama al-Ansari testified, Khalid excepted her from the treaty and delivered her to him — her people bought her back for a thousand dirhams though old, telling him he sold cheap, and he answered 'I did not think a number could exceed a thousand' — a variant makes the asker a Rabi'a man, the first account firmer."
