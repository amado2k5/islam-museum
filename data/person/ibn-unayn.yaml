summary:
  ar: "أبو الحسن محمد بن نصر بن الحسين بن عنين الأنصاري، الملقب شرف الدين، الكوفي الأصل الدمشقي المولد؛ شاعر عصره، لم يكن في أواخر أيامه من يقاس به، غزير المادة من الأدب حتى قيل كان يستحضر كتاب «الجمهرة» لابن دريد، وكان مولعاً بالهجاء حتى سمى إحدى قصائده «مقراض الأعراض» فنفاه السلطان صلاح الدين من دمشق، فطاف الشام والعراق والجزيرة وأذربيجان وخراسان وغزنة واليمن، ولما مات صلاح الدين استأذن الملك العادل في العودة بقصيدته الرائية «ماذا على طيف الأحبة لو سرى»، وتولى الوزارة بدمشق في آخر دولة الملك المعظم ومدة الملك الناصر، ثم انفصل فأقام في بيته حتى مات ودفن في مسجد أنشأه بأرض المزة {cite:wafayat-ayan}."
  en: "Ibn Unayn (549–630) — Damascus's unrivalled satirist ('the foremost poet of his age'), exiled by Salah al-Din for 'Maqraḍ al-A'raḍ', restored by al-Adil, briefly vizier under al-Nasir Dawud; buried in his own mosque at al-Mizza {cite:wafayat-ayan}."
