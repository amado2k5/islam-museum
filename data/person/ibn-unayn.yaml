summary:
  ar: "أبو الحسن محمد بن نصر بن الحسين بن عنين الأنصاري، الملقب شرف الدين، الكوفي الأصل الدمشقي المولد؛ شاعر عصره، لم يكن في أواخر أيامه من يقاس به، غزير المادة من الأدب حتى قيل كان يستحضر كتاب «الجمهرة» لابن دريد، وكان مولعاً بالهجاء حتى سمى إحدى قصائده «مقراض الأعراض» فنفاه السلطان صلاح الدين من دمشق، فطاف الشام والعراق والجزيرة وأذربيجان وخراسان وغزنة واليمن، ولما مات صلاح الدين استأذن الملك العادل في العودة بقصيدته الرائية «ماذا على طيف الأحبة لو سرى»، وتولى الوزارة بدمشق في آخر دولة الملك المعظم ومدة الملك الناصر، ثم انفصل فأقام في بيته حتى مات ودفن في مسجد أنشأه بأرض المزة {cite:wafayat-ayan}."
  en: "Ibn Unayn (549–630) — Damascus's unrivalled satirist ('the foremost poet of his age'), exiled by Salah al-Din for 'Maqraḍ al-A'raḍ', restored by al-Adil, briefly vizier under al-Nasir Dawud; buried in his own mosque at al-Mizza {cite:wafayat-ayan}."
  es: "Ibn Unayn (549–630) — Satírico sin igual de Damasco («el poeta más importante de su época»), exiliado por Saladino por el «Maqraḍ al-A'raḍ», restituido por al-Adil, brevemente visir bajo al-Nasir Dawud; enterrado en su propia mezquita en al-Mizza {cite:wafayat-ayan}."
  fr: "Ibn Unayn (549–630) — Satiriste sans égal de Damas (« le plus grand poète de son temps »), exilé par Salah al-Din pour 'Maqraḍ al-A'raḍ', rétabli par al-Adil, brièvement vizir sous al-Nasir Dawud; enterré dans sa propre mosquée à al-Mizza {cite:wafayat-ayan}."
  ur: "ابن عنین (549-630) - دمشق کا بے مثال طنز نگار ⁦('اپنی عمر کا سب سے بڑا شاعر')⁩، صلاح الدین نے 'مقرع الاعراد' کے لیے جلاوطن کیا، جسے العادل نے بحال کیا، الناصر داؤد کے تحت مختصر طور پر وزیر؛ المیزہ میں اپنی ہی مسجد میں دفن ہوئے۔"
  tr: "Ebu el-Hasan Muhammed bin Nasr bin el-Hüseyin ibn 'Anin al-Ansari, lakabı Şeraf el-Din, aslen Kufe'den ve Şam doğumlu, zamanının şairlerinden biriydi. İlerleyen dönemlerinde kimse onunla kıyaslanamazdı. Edebiyatta o kadar üretkendi ki, İbn Düraid'in 'El-Cemhara' kitabını hatırladığı söylenirdi. Hiciv konusunda tutkuluydu, ta ki şiirlerinden birine 'Onur Borç' adını verene kadar, ancak Sultan Salaheddin onu Şam'dan sürgün etti. Levant, Irak, Arap Yarımadası, Azerbaycan, Horasan, Gazni ve Yemen'e seyahat etti. Salaheddin öldüğünde, Kral El-Adil 'Eğer Giderse Sevdiklerinin Hayaleti Nedir?' adlı şiiriyle geri dönmek için izin istedi: Kral Al-Mu'azzam ve Kral Al-Nasir döneminde Şam'da vezirliği devraldı. Daha sonra ayrıldı ve evinde kaldı, ölene kadar evinde kaldı; Mezzeh topraklarında kurduğu bir camide defnedildi {kaynak:wafayat-ayan}."
  id: "Abu al-Hasan Muhammad ibn Nasr ibn al-Husayn ibn 'Anin al-Ansari, dijuluki Sharaf al-Din, berasal dari Kufa dan lahir di Damaskus, adalah seorang penyair pada zamannya. Di masa tuanya, tidak ada yang bisa menandinginya. Ia sangat produktif dalam sastra, sampai-sampai dikatakan ia mengingat buku Ibn Duraid 'Al-Jamhara.' Ia sangat menyukai satir hingga ia menamai salah satu puisinya 'The Loan of Honor,' namun Sultan Salah al-Din mengasingkannya dari Damaskus. Ia melakukan perjalanan ke Levant, Irak, Semenanjung Arab, Azerbaijan, Khorasan, Ghazni, dan Yaman. Ketika Salah al-Din wafat, Raja Al-Adil meminta izin untuk kembali dengan puisinya 'Apa Arti Bayangan Orang yang Dicintai Jika Ia Pergi?' Ia mengambil alih jabatan wazir di Damaskus pada masa pemerintahan Raja Al-Mu'azzam dan Raja Al-Nasir. Ia kemudian berpisah dan tinggal di rumahnya hingga wafat dan dimakamkan di sebuah masjid yang ia dirikan di tanah Mezzeh {cite:Wafayat-Ayan}."
