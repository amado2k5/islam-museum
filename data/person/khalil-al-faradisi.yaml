summary:
  ar: "غرس الدين أبو القاسم خليل بن خليل الفراديسي الصالحي الحنبلي؛ قال ابن طولون حفظ القرآن ثم قرأ المحرر للمجد بن تيمية وأخذ عن النظام بن مفلح والشرف بزيد والشيخ صفي الدين، ولازم القاضي ناصر الدين بن زريق وأكثر من الأخذ عنه، ثم أقبل على الشهادة والمباشرة لأوقاف مدرسة أبي عمر وغيرها، وأجاز لابن طولون وكتبوا عنه؛ وتوفي في محبس قرتباي الأحمر أمير الأمراء بدمشق سنة أربع وتسعمائة {cite:shadharat-dhahab p. 439}."
  en: "The Hanbali of Bab al-Faradis — after Qur'an he read the Muharrar to Majd al-Din Ibn Taymiyya and attached himself to qadi Nasir al-Din Ibn Zurayq, then turned to witness-work and administering the Abu 'Umar madrasa's endowments; Ibn Tulun held his ijaza. He died in the prison of Qurtubay the Red, commander-in-chief at Damascus, in 904 {cite:shadharat-dhahab p. 439}."
  es: "El hanbalí de Bab al-Faradis —después del Corán leyó el Muharrar a Majd al-Din Ibn Taymiyya y se unió al cadí Nasir al-Din Ibn Zurayq, luego se dedicó al trabajo de testigo y a administrar las dotaciones de la madrasa de Abu 'Umar; Ibn Tulun tenía su ijaza. Murió en la prisión de Qurtubay el Rojo, comandante en jefe en Damasco, en 904 {cite:shadharat-dhahab p. 439}."
  fr: "L'école hanbalite de Bab al-Faradis – après avoir récité le Coran, il lut le Muharrar à Majd al-Din Ibn Taymiyya et se rapprocha du cadi Nasir al-Din Ibn Zurayq, puis se consacra au témoignage et à l'administration des biens de la madrasa Abu 'Umar; Ibn Tulun détenait son ijaza. Il mourut dans la prison de Qurtubay le Rouge, commandant en chef à Damas, en 904 (cf. shadharat-dhahab, p. 439)."
  ur: "باب الفرادیس کے حنبلی - قرآن کے بعد اس نے مجد الدین ابن تیمیہ کو محرر پڑھا اور اپنے آپ کو قاضی ناصر الدین ابن زریق سے منسلک کیا، پھر گواہی کے کام اور ابو عمر مدرسہ کے اوقاف کا انتظام کرنے لگے۔ ابن طولون نے اس کا اعجاز رکھا۔ اس کی موت 904 میں دمشق کے کمانڈر انچیف قرطبی سرخ کی جیل میں ہوئی۔ 439}۔"
  tr: "Ghars al-Din Ebu el-Kasım Halil ibn Halil el-Faradisi el-Salihi el-Hanbali; İbn Tulun Kur'an'ı ezberlediğini, ardından el-Majd ibn Teymiyye'nin el-Muharrar'ını okuduğunu, el-Nizam bin Muflih, el-Şeref ibn Zeyd ve Şeyh Safi el-Din'in yanında eğitim aldığını söyledi. Yargıç Nasir al-Din ibn Zurayq'ın yanında çalıştı ve onun yanında kapsamlı bir şekilde eğitim aldı. Daha sonra şehitliğe kendini adadı, Ebu Ömer okulunun ve diğerlerinin bağışları üzerinde çalışmaya başladı, İbn Tulun'a izin verdi ve onun hakkında yazdı. 939 Hicri yılında, Şam'daki prensler prensi Kurtbay el-Ahmar'ın hapishanesinde öldü {atıf: şadharat-dhahab, s. 439}."
  id: "Ghars al-Din Abu al-Qasim Khalil ibn Khalil al-Faradisi al-Salihi al-Hanbali; Ibn Tulun mengatakan ia menghafal Al-Qur'an, lalu membaca al-Muharrar karya al-Majd ibn Taymiyyah, dan belajar di bawah bimbingan al-Nizam ibn Muflih, al-Sharaf ibn Zayd, dan Sheikh Safi al-Din. Ia belajar di bawah Hakim Nasir al-Din ibn Zurayq dan belajar secara intensif di bawahnya. Ia kemudian mendedikasikan dirinya untuk syahid dan mulai bekerja pada wakaf sekolah Abu Umar dan lainnya, memberikan izin kepada Ibn Tulun dan menulis tentangnya. Ia meninggal di penjara Qurtbay al-Ahmar, pangeran para pangeran di Damaskus, pada tahun 939 H {cite:shadharat-dhahab, hlm. 439}."
