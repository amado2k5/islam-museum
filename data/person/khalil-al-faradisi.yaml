summary:
  ar: "غرس الدين أبو القاسم خليل بن خليل الفراديسي الصالحي الحنبلي؛ قال ابن طولون حفظ القرآن ثم قرأ المحرر للمجد بن تيمية وأخذ عن النظام بن مفلح والشرف بزيد والشيخ صفي الدين، ولازم القاضي ناصر الدين بن زريق وأكثر من الأخذ عنه، ثم أقبل على الشهادة والمباشرة لأوقاف مدرسة أبي عمر وغيرها، وأجاز لابن طولون وكتبوا عنه؛ وتوفي في محبس قرتباي الأحمر أمير الأمراء بدمشق سنة أربع وتسعمائة {cite:shadharat-dhahab p. 439}."
  en: "The Hanbali of Bab al-Faradis — after Qur'an he read the Muharrar to Majd al-Din Ibn Taymiyya and attached himself to qadi Nasir al-Din Ibn Zurayq, then turned to witness-work and administering the Abu 'Umar madrasa's endowments; Ibn Tulun held his ijaza. He died in the prison of Qurtubay the Red, commander-in-chief at Damascus, in 904 {cite:shadharat-dhahab p. 439}."
