summary:
  ar: "المؤرخ الحنبلي؛ سمع من أبيه ومن أبي الوقت صحيح البخاري وهو آخر من حدث عنه به، ولازم ابن الجوزي مدة وأخذ عنه وقرأ عليه كثيراً من تصانيفه ومروياته؛ جمع تاريخاً في نحو خمسة أسفار ذيل به على تاريخ ابن السمعاني سماه «درة الإكليل في تتمة التذييل» وفيه فوائد جمة مع أوهام، بالغ ابن النجار في الحط عليه مع أنه أخذ عنه ونقل منه؛ وصفه غير واحد من الحفاظ بالحفظ {cite:shadharat-dhahab p. 162-163}."
  en: "al-Qati'i al-Azji (d. 634) — Hanbali historian of Baghdad, last to transmit Sahih al-Bukhari from Abu al-Waqt, and Ibn al-Jawzi's long companion; his five-volume Durrat al-Iklil continued Ibn al-Sam'ani's history — rich in benefits, said its critics, even while plagiarized by them {cite:shadharat-dhahab p. 162-163}."
  fr: "al-Qati'i al-Azji (mort en 634) – Historien hanbalite de Bagdad, dernier à transmettre Sahih al-Bukhari d'Abou al-Waqt, et long compagnon d'Ibn al-Jawzi ; son Durrat al-Iklil en cinq volumes a continué l'histoire d'Ibn al-Sam'ani - riche en avantages, ont déclaré ses critiques, même si plagiés par eux {cite:shadharat-dhahab p. 162-163}."
  es: "al-Qati'i al-Azji (m. 634) — Historiador hanbalí de Bagdad, último en transmitir Sahih al-Bukhari de Abu al-Waqt, y compañero de Ibn al-Jawzi durante muchos años; su Durrat al-Iklil de cinco volúmenes continuó la historia de Ibn al-Sam'ani — rica en beneficios, dijeron sus críticos, incluso cuando fue plagiada por ellos {cite:shadharat-dhahab p. 162-163}."
  ur: "القطی العزجی ⁦(متوفی 634)⁩ - بغداد کے حنبلی مؤرخ، ابو الوقت سے صحیح البخاری کو منتقل کرنے والے آخری، اور ابن الجوزی کے طویل ساتھی؛ اس کی پانچ جلدوں پر مشتمل دُرّت العقل نے ابن سمعانی کی تاریخ کو جاری رکھا - فوائد سے مالا مال، اس کے ناقدین نے کہا، یہاں تک کہ ان کی طرف سے سرقہ بھی کیا گیا ہے۔ 162-163}۔"
  tr: "Hanbali tarihçisi, babasından ve ondan son rivayet eden Ebu el-Waqt-Vak Sahih el-Buhari'den haber aldı. Bir süre İbn el-Cevzi'nin yanında çalıştı, ondan ders aldı ve birçok eser ve rivayetini ondan okudu. İbn al-Sam'ani'nin tarihine eklenen yaklaşık beş ciltlik bir tarih derledi ve buna \"Durrat al-Iklil fi Tammat al-Tadhyil\" adını verdi. Tarih, bazı yanlış anlamalarla birlikte birçok fayda içerir. İbn el-Necer, ondan öğrenip aktarmasına rağmen onu küçümsemek için büyük çaba harcadı; birçok hadis alimi bunu ezberlemek olarak tanımladı {atı:şadharat-zehab, s. 162-163}."
  id: "Sejarawan Hanbali mendengar dari ayahnya dan Abu al-Waqt Sahih al-Bukhari, yang terakhir menceritakan darinya. Ia belajar di bawah bimbingan Ibn al-Jawzi untuk sementara waktu, belajar di bawah bimbingan beliau, dan membaca banyak karya serta narasi darinya. Ia menyusun sejarah dalam sekitar lima jilid yang dilampirkan pada sejarah Ibn al-Sam'ani, yang ia sebut \"Durrat al-Iklil fi Tammat al-Tadhyil.\" Sejarah itu mengandung banyak manfaat dengan beberapa kesalahpahaman. Ibn al-Najjar berusaha keras merendahkannya, meskipun ia belajar dan mewariskan darinya; beberapa ulama hadits menggambarkannya sebagai menghafal {cite:shadharat-dhahab, hlm. 162-163}."
