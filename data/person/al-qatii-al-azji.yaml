summary:
  ar: "المؤرخ الحنبلي؛ سمع من أبيه ومن أبي الوقت صحيح البخاري وهو آخر من حدث عنه به، ولازم ابن الجوزي مدة وأخذ عنه وقرأ عليه كثيراً من تصانيفه ومروياته؛ جمع تاريخاً في نحو خمسة أسفار ذيل به على تاريخ ابن السمعاني سماه «درة الإكليل في تتمة التذييل» وفيه فوائد جمة مع أوهام، بالغ ابن النجار في الحط عليه مع أنه أخذ عنه ونقل منه؛ وصفه غير واحد من الحفاظ بالحفظ {cite:shadharat-dhahab p. 162-163}."
  en: "al-Qati'i al-Azji (d. 634) — Hanbali historian of Baghdad, last to transmit Sahih al-Bukhari from Abu al-Waqt, and Ibn al-Jawzi's long companion; his five-volume Durrat al-Iklil continued Ibn al-Sam'ani's history — rich in benefits, said its critics, even while plagiarized by them {cite:shadharat-dhahab p. 162-163}."
