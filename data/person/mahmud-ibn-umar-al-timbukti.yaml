gender: male
summary:
  ar: محمود بن عمر أقيت الصنهاجي التنبكتي، أبو الثناء، قاضي تنبكتو من فقهاء المالكية، صاحب «تاريخ الفتاش» و«تقييد على مختصر خليل»، 865 إلى 955هـ.
  en: Mahmud ibn Umar Aqit al-Sanhaji al-Timbukti, Abu al-Thana, qadi of Timbuktu and Maliki jurist, author of Tarikh al-Fattash and a Taqyid on the Mukhtasar of Khalil, 865 to 955 AH.
  es: "Mahmud ibn Umar Aqit al-Sanhaji al-Timbukti, Abu al-Thana, cadí de Tombuctú y jurista Maliki, autor de Tarikh al-Fattash y taqyid en el Mukhtasar de Khalil, 865 a 955 d.H."
  fr: "Mahmud ibn Umar Aqit al-Sanhaji al-Timbukti, Abu al-Thana, cadi de Tombouctou et juriste malékite, auteur de Tarikh al-Fattash et d'un Taqyid sur le Mukhtasar de Khalil, 865 à 955 AH."
  ur: "محمود بن عمر عقیط السنہجی التمبقتی، ابو الثنا، ٹمبکٹو کے قاضی اور مالکی فقیہ، تاریخ الفتاش کے مصنف اور خلیل کے مختار پر تقیید، 865 تا 955 ہجری۔"
