summary:
  ar: "من خواص علي، دخل على معاوية وافداً فألح عليه أن يصف له علياً فقال كان والله بعيد المدى شديد القوى يقول فصلاً ويحكم عدلاً يتفجر العلم من جوانبه وتنطق الحكمة من نواحيه، يعظم أهل الدين ويرحم المساكين ويستوحش من الدنيا وزهرتها ويأنس بالليل وظلمته، وذكر محرابه وبكاءه وقوله يا دنيا غري غيري هيهات قد أبنتك ثلاثاً {cite:muruj-al-dhahab p. 710-711}."
  en: "One of Ali's inner circle — compelled by Mu'awiya to describe him, he delivered the celebrated portrait: 'far-reaching, mighty, decisive in word, just in rule, knowledge streaming from his sides, who took comfort in night's darkness' and the mihrab weeping over 'deceive another, world' {cite:muruj-al-dhahab p. 710-711}."
