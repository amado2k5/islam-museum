summary:
  ar: "سياسي ومحامٍ أذربيجاني (1862–1934)، قاد كتلة المسلمين في دوما الدولة الروسية الأولى سنة 1906، وترأس المؤتمرين الأول والثاني لمسلمي روسيا، ثم صار وزير خارجية جمهورية أذربيجان الديمقراطية فرئيس برلمانها (1918–1920)، وقاد وفدها إلى مؤتمر باريس للسلام."
  en: "Azerbaijani politician and lawyer (1862–1934). He led the Muslim faction in Russia's First State Duma (1906) and chaired the early All-Russian Muslim congresses, then served as foreign minister of the Azerbaijan Democratic Republic and as speaker of its parliament (1918–1920), heading its delegation to the Paris Peace Conference."
  ur: "آذربائیجانی سیاست دان اور وکیل (1862–1934)۔ 1906 کی روس کی پہلی ریاستی دوما میں مسلم دھڑے کی قیادت کی، آل روسی مسلم کانفرنسوں کی صدارت کی، پھر آذربائیجان جمہوری جمہوریہ کے وزیر خارجہ اور پارلیمنٹ کے اسپیکر رہے (1918–1920)، اور پیرس امن کانفرنس میں اس کے وفد کی سربراہی کی۔"
