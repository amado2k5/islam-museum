summary:
  ar: "محمد بن أحمد بن عبد العزيز الأموي القرطبي الأندلسي، أبو عبد الله، فقيه مالكي نسبته إلى عتبة بن أبي سفيان بالولاء، صاحب المستخرجة العتبية على الموطأ، توفي بالأندلس سنة ٢٥٥هـ."
  en: "Muhammad ibn Ahmad ibn Abd al-Aziz al-Umawi al-Qurtubi al-Andalusi, Abu Abdallah, a Maliki jurist whose name points by clientage to Utba ibn Abi Sufyan, author of al-Mustakhraja al-Utbiyya ala al-Muwatta; he died in al-Andalus in 255 AH (869)."
  es: "Muhammad ibn Ahmad ibn Abd al-Aziz al-Umawi al-Qurtubi al-Andalusi, Abu Abdallah, un jurista Maliki cuyo nombre apunta por clientela a Utba ibn Abi Sufyan, autor de al-Mustakhraja al-Utbiyya ala al-Muwatta; Murió en al-Andalus en 255 AH (869)."
  fr: "Muhammad ibn Ahmad ibn Abd al-Aziz al-Umawi al-Qurtubi al-Andalusi, Abu Abdallah, un juriste malékite dont le nom désigne par sa clientèle Utba ibn Abi Sufyan, auteur d'al-Mustakhraja al-Utbiyya ala al-Muwatta; il mourut en al-Andalus en 255 AH (869)."
  ur: "محمد بن احمد بن عبد العزیز العموی القرطبی الاندلسی، ابو عبد اللہ، ایک مالکی فقیہ جن کا نام مؤکل عتبہ ابن ابی سفیان کی طرف اشارہ کرتا ہے، المستخرجہ التبیہ الموطہ کے مصنف؛ ان کی وفات 255ھ (869) میں اندلس میں ہوئی۔"
