summary:
  ar: "فيلسوف إيراني وباحث في الدراسات الإسلامية، وُلد في طهران سنة 1933. درس الفيزياء في معهد ماساتشوستس للتكنولوجيا ونال الدكتوراه في تاريخ العلم من هارفارد سنة 1958، ودرّس في جامعة طهران وأسس الأكاديمية الإمبراطورية الإيرانية للفلسفة، وبعد ثورة 1979 استقر في الولايات المتحدة أستاذًا للدراسات الإسلامية في جامعة جورج واشنطن. ألّف أكثر من خمسين كتابًا في الفلسفة الإسلامية والصوفية وفلسفة العلم والبيئة، وهو من أبرز ممثلي المدرسة الدائمة (الحكمة الخالدة)."
  en: "Iranian philosopher and scholar of Islamic studies, born in Tehran in 1933. He studied physics at MIT and took his doctorate in the history of science at Harvard in 1958, taught at Tehran University and founded the Imperial Iranian Academy of Philosophy; after the 1979 revolution he settled in the United States as University Professor of Islamic Studies at George Washington University. He has written more than fifty books on Islamic philosophy, Sufism, the philosophy of science and the environment, and is a leading representative of the perennialist (Traditionalist) school."
  ur: "ایرانی فلسفی اور ماہرِ اسلامیات، 1933 میں تہران میں پیدا ہوئے۔ انھوں نے MIT میں طبیعیات پڑھی اور 1958 میں ہارورڈ سے تاریخِ سائنس میں ڈاکٹریٹ کی، تہران یونیورسٹی میں تدریس کی اور شاہی ایرانی اکیڈمی برائے فلسفہ قائم کی؛ 1979 کے انقلاب کے بعد امریکہ میں جارج واشنگٹن یونیورسٹی میں اسلامی مطالعات کے پروفیسر رہے۔ انھوں نے اسلامی فلسفے، تصوف، فلسفۂ سائنس اور ماحول پر پچاس سے زائد کتابیں لکھیں۔"
