summary:
  ar: "قارئ وإمام سعودي من الدمام (وُلد 1967)، أتمّ حفظ القرآن سنة 1990 ونال إجازة الإسناد برواية حفص سنة 1417 هـ، وعمل مدرسا ومشرفا تربويا ثم مشرفا عاما على مدارس محمد الفاتح الأهلية، وهو إمام جامع يوسف بن أحمد كانو بالدمام، وشارك إماما ضيفا في تراويح المسجد النبوي رمضان 1430 هـ، وله مصحف مرتل وإصدارات في الأذكار والرقية."
  en: "Saudi reciter and imam from Dammam (born 1967). He completed his memorisation of the Qur'an in 1990 and received an ijaza with isnad in the Hafs recitation in 1417 AH, worked as a teacher and educational supervisor and then as general supervisor of the Muhammad Al-Fatih private schools, is imam of the Yousef bin Ahmed Kanoo Mosque in Dammam, led Tarawih as a guest imam at the Prophet's Mosque in Ramadan 1430 AH, and has issued a recorded murattal Qur'an and works on adhkar and ruqya."
  ur: "دمام سے تعلق رکھنے والے سعودی قارئ اور امام (پیدائش 1967)۔ انہوں نے 1990 میں حفظِ قرآن مکمل کیا اور 1417ھ میں روایتِ حفص میں سند کے ساتھ اجازہ حاصل کیا، استاد اور تعلیمی سپروائزر رہے، پھر محمد الفاتح پرائیویٹ اسکولز کے جنرل سپروائزر بنے؛ وہ دمام کی جامع یوسف بن احمد کانو کے امام ہیں، رمضان 1430ھ میں مسجد نبوی کی تراویح میں مہمان امام رہے، اور ان کا مرتل مصحف اور اذکار و رقیہ پر اصدارات موجود ہیں۔"
