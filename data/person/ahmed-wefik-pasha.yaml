summary:
  ar: "أحمد وفيق باشا، رجل دولة عثماني ودبلوماسي ولغوي تركي، ولد في إسطنبول سنة 1238هـ/1823م، وكان سفيرًا في باريس سنة 1860م، ورئيسًا لأول برلمان عثماني سنة 1876م، وصدرًا أعظم مرتين، وألّف «لهجة عثمانية»، أول معجم تركي بالتركية، وترجم مسرحيات موليير، وتوفي في إسطنبول سنة 1308هـ/1891م {cite:encyclopaedia-of-islam-2 vol. 1 p. 320}."
  en: "Ahmed Wefik Pasha, Ottoman statesman, diplomat and Turkish scholar, born in Istanbul in 1238/1823 into a family of interpreters. He was ambassador in Paris in 1860, president of the first Ottoman parliament in 1876, and grand vizier twice. His Lehce-i Osmani was the first Turkish dictionary in Turkish, and his adaptation of sixteen comedies of Moliere is a masterpiece. He died in Istanbul on 22 Sha'ban 1308/2 April 1891 {cite:encyclopaedia-of-islam-2 vol. 1 p. 320}."
