id: person/yusuf-ibn-muhammad-al-hasani
class: person
label:
  ar: يوسف بن محمد الحسني
  en: Yusuf ibn Muhammad al-Hasani
  ur: یوسف بن محمد حسنی
  es: "Yusuf ibn Muhammad al-Hasani"
  fr: "Yusuf ibn Muhammad al-Hasani"
summary:
  ar: من القلائل الذين رافقوا الهادي في خروجه إلى اليمن، وحين كثر القوم عند زبيد نبهه إلى أن يخفف صلاته فلم يلتفت.
  en: One of the few who accompanied al-Hadi on his journey to Yemen; when the crowd gathered at Zubayd he told him to shorten his prayer, and al-Hadi paid no heed.
  ur: ان چند لوگوں میں سے جو یمن کے سفر میں ہادی کے ساتھ تھے؛ جب زبید میں ہجوم بڑھا تو انہوں نے ہادی سے نماز مختصر کرنے کو کہا اور ہادی نے توجہ نہ دی۔
  es: "Fue uno de los pocos que acompañaron a al-Hadi en su viaje a Yemen; cuando la multitud se reunió en Zubayd, le dijo que acortara su oración, pero al-Hadi no le hizo caso."
  fr: "L'un des rares à avoir accompagné al-Hadi lors de son voyage au Yémen; lorsque la foule s'est rassemblée à Zubayd, il lui a dit de raccourcir sa prière, mais al-Hadi n'en a pas tenu compte."
  tr: "El-Hadi'nin Yemen'e ayrılışında ona eşlik eden az sayıdaki kişiden biriydi. Kalabalık Zabid'e yaklaştığında, ona duasını azaltmasını söyledi ama o dikkat etmedi."
  id: "Ia adalah salah satu dari sedikit orang yang menemani al-Hadi saat berangkat ke Yaman. Ketika kerumunan semakin dekat dengan Zabid, ia memperingatkan agar Zabid mengurangi doanya, namun ia tidak memperhatikan."
