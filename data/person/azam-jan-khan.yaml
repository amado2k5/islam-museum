summary:
  ar: "خان قلات (نحو 1870 – 10 سبتمبر 1933): ابن خداداد خان الذي رفض العرش حين خُلع والده سنة 1893 وشاركه منفاه، وحكم مكران نيابة عن أخيه محمود خان الثاني، وأدار قلات أثناء مرض أخيه، ثم حكم من ديسمبر 1931 حتى وفاته، فألغى السخرة ونُصّب رسميا في دربار بكويته في 26 أبريل 1932."
  en: "Khan of Kalat (about 1870 – 10 September 1933): a son of Khudadad Khan who refused the throne when his father was deposed in 1893 and shared his exile, governed Makran for his brother Mahmud Khan II, administered Kalat during Mahmud's illness, and then reigned from December 1931 until his death — abolishing forced labour and being formally installed by the Viceroy at a durbar at Quetta on 26 April 1932."
  ur: "خانِ قلات (تقریباً 1870ء – 10 ستمبر 1933ء): خداداد خان کے بیٹے، جنھوں نے 1893ء میں والد کی معزولی پر پیش کردہ تخت ٹھکرا دیا اور ان کی جلاوطنی میں شریک رہے، اپنے بھائی محمود خان دوم کی طرف سے مکران کے حاکم رہے، بھائی کی بیماری میں قلات کا انتظام سنبھالا، پھر دسمبر 1931ء سے وفات تک حکمران رہے — بیگار ختم کی اور 26 اپریل 1932ء کو کوئٹہ کے دربار میں وائسرائے کے ہاتھوں باقاعدہ تخت نشین ہوئے۔"
