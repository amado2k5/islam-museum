    note: "CONFLICT: the Arabic article gives his birth by an exact Hijri date — Tuesday 27 Sha'ban 1246 AH — which converts exactly to 10 February 1831; the French article gives 'about 1831' near Oualata, and Wikidata carries a day-precision claim of 1831-02-10 alongside a year-precision claim of 1830. The English and Spanish articles give 1830 (the English lead: 'c. 10 February 1830'), and the Urdu article gives the range 1830–31. The record follows 10 February 1831, on the Arabic article's exact date, and records every variant here. The Hijri year is NOT derived: it is the Arabic article's own date. The founder's queue lists 1830; the record follows the evidence as set out here."
