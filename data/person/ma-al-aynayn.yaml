summary:
  ar: "شيخ صوفي قادري موريتاني (1831-1910) خلف أباه محمد فاضل، مؤسس الطريقة الفاضلية، على رأس أخويته، فاجتمع حوله أكثر من عشرة آلاف مريد. بنى الرباط والمدينة في سمارة بالساقية الحمراء، وقاد من سنة 1904 الجهاد ضد الاستعمار الفرنسي والإسباني في الصحراء والمغرب، وهُزم في مسيرته شمالا سنة 1910 وتوفي في تزنيت في أكتوبر من تلك السنة."
  en: "Mauritanian Qadiri Sufi sheikh (1831–1910) who succeeded his father Muhammad Fadil, founder of the Fadiliyya brotherhood, at the head of the order, gathering more than ten thousand murids. He built the ribat and town of Smara in the Saqiyat al-Hamra, and from 1904 led the jihad against French and Spanish colonisation in the Sahara and Morocco; defeated on his march north in 1910, he died at Tiznit that October."
  ur: "موریطانیہ کے قادری صوفی شیخ (1831ء–1910ء) جو اپنے والد محمد فاضل، سلسلۂ فاضلیہ کے بانی، کے بعد اس سلسلے کے سربراہ بنے اور ان کے گرد دس ہزار سے زائد مرید جمع ہوئے۔ انھوں نے ساقیت الحمراء میں سمارا کا رباط اور شہر آباد کیا، اور 1904ء سے صحارا اور مغرب میں فرانسیسی و ہسپانوی استعمار کے خلاف جہاد کی قیادت کی؛ 1910ء میں شمال کی طرف پیش قدمی میں شکست کھا کر اسی سال اکتوبر میں تیزنیت میں وفات پائی۔"

