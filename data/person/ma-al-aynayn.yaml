faith:
  - value: sufi
    status: documented
    basis_sources: [source/wikipedia-ma-al-aynayn-en, source/wikipedia-ma-al-aynayn-ar, source/wikipedia-ma-al-aynayn-fr]
    note: "His headship of the Fadiliyya — the Qadiriyya branch his father Muhammad Fadil founded — is attested as his own office and practice by three independent articles: the English article records that on his return from the Hajj in 1861 'his father gave him a turban and the title of Shaykh', and speaks of the members of his own brotherhood and of his murids at his zawiya; the Arabic article records his Sufi formation under his father ('he was influenced by him in the aspect of tasawwuf'), his more than ten thousand murids, the tariqas he himself taught them (al-Qadiriyya and al-Tijaniyya among them, as they chose), and that his sons inherited 'his jihadist and Sufi call'; the French article describes the father as founder of 'the Sufi congregation Fadiliyya' and Ma al-'Aynayn himself as a sheikh and marabout with numerous disciples of the Fadiliyya-Ma'ayniyya line. The segment is recorded as sufi on this headship — the investiture and leadership of the order itself, following the precedent of person/ali-al-mirghani (Khatmiyya headship attested in three articles) — and expressly not on descent from the order's founder alone. No source names a school of law for him; Wikidata's religion statement is Islam generically. The German article's remark that he was influenced by Wahhabi and Sanusi teachings is carried in the prose as that article's attributed statement only. The French newspaper Es-Saada's campaign rumour that his followers were Shia was a hostile colonial press smear and is recorded in the prose as such; it is not evidence of anything."

