id: person/ibn-abi-bara
class: person
label: { ar: "ابن أبي بعرة", en: "Ibn Abi Bara", es: "Ibn Abi Bara", fr: "Ibn Abi Bara", ur: "ابن ابی براء" }
summary:
  ar: "محمد بن الحسين المعروف بابن أبي بعرة بمدينة الحديثة، جماعة للكتب له خزانة قال ابن النديم لم أر لأحد مثلها كثرة تحتوي على قطعة من الكتب الغريبة في النحو واللغة والأدب والكتب القديمة، وكان نفورا ضنينا بما عنده خائفا من بني حمدان، وأخرج إلى ابن النديم قمطرا كبيرا فيه نحو ثلاث مائة رطل جلود فلجان وصكال وقرطاس {cite:fihrist-ibn-al-nadim p. 106}."
  en: "Haditha book-collector whose unmatched khizana held rare grammar codices {cite:fihrist-ibn-al-nadim}"
  es: "Coleccionista de libros de hadices cuya inigualable khizana albergaba raros códices gramaticales {cite:fihrist-ibn-al-nadim}"
  fr: "Collectionneur de livres Haditha dont la khizana inégalée contenait de rares codex de grammaire {cite:fihrist-ibn-al-nadim}"
  ur: "حدیثہ کتاب جمع کرنے والا جس کا بے مثال خزانہ نایاب گرامر ضابطے رکھتا تھا {حوالہ: فہرست ابن الندیم}"
  tr: "Muhammed bin el-Hüseyin, El-Haditha şehrinde İbn Abi Ba'ra olarak bilinir, bir kitap koleksiyonu ve bir kütüphanesi vardı. İbn el-Nadim şöyle dedi: Böyle büyük bir miktarda, dilbilgisi, dil, edebiyat ve eski kitaplarda garip kitaplar içeren birini hiç görmedim. Sahip olduklarından tiksindi ve rahatsız oldu, Banu Hamdan'dan korkuyordu. İbn el-Nadim'e yaklaşık üç yüz pound deri, el ilanları, artıklar ve kağıt içeren büyük bir kap getirdi {atıf:fihrist-ibn-al-nadim s. 106}."
  id: "Muhammad ibn al-Husayn, yang dikenal sebagai Ibn Abi Ba'ra di kota Al-Haditha, memiliki koleksi buku dengan perpustakaan. Ibn al-Nadim berkata: Saya belum pernah melihat seseorang seperti itu dalam jumlah sebanyak ini yang berisi kumpulan buku-buku aneh dalam tata bahasa, bahasa, sastra, dan buku-buku kuno. Ia merasa jijik dan gelisah dengan apa yang dimilikinya, takut pada Banu Hamdan. Ia membawa Ibn al-Nadim sebuah wadah besar berisi sekitar tiga ratus pon kulit, selebaran, sisa, dan kertas {cite:fihrist-ibn-al-nadim hlm. 106}."
