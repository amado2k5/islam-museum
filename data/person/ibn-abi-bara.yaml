id: person/ibn-abi-bara
class: person
label: { ar: "ابن أبي بعرة", en: "Ibn Abi Bara" }
summary:
  ar: "محمد بن الحسين المعروف بابن أبي بعرة بمدينة الحديثة، جماعة للكتب له خزانة قال ابن النديم لم أر لأحد مثلها كثرة تحتوي على قطعة من الكتب الغريبة في النحو واللغة والأدب والكتب القديمة، وكان نفورا ضنينا بما عنده خائفا من بني حمدان، وأخرج إلى ابن النديم قمطرا كبيرا فيه نحو ثلاث مائة رطل جلود فلجان وصكال وقرطاس {cite:fihrist-ibn-al-nadim p. 106}."
  en: "Haditha book-collector whose unmatched khizana held rare grammar codices {cite:fihrist-ibn-al-nadim}"
