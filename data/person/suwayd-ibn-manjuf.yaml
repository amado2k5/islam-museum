  en: "Suwayd ibn Manjuf al-Sadusi; visiting sick, he told Ubaydallah ibn Abi Bakra 'give me what you gave Ibn Ma'mar and all will be well' — the four-hundred-jarib Suwaydan qati'a was his, and took his name."
