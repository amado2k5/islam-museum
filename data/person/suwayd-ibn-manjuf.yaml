id: person/suwayd-ibn-manjuf
class: person
label:
  ar: سويد بن منجوف السدوسي
  en: Suwayd ibn Manjuf al-Sadusi
  es: "Suwayd ibn Manjuf al-Sadusi"
  fr: "Suwayd ibn Manjuf al-Sadusi"
  ur: "سوید بن منجوف السدوسی"
summary:
  ar: سويد بن منجوف السدوسي؛ كانت سويدان قطيعة لعبيد الله بن أبي بكرة مبلغها أربعمائة جريب فوهبها له إذ عاده في مرضه فقال سويد إن أعطيتني مثل الذي أعطيت ابن معمر فليس علي بأس فأعطاه سويدان فنسبت إليه.
  en: Suwayd ibn Manjuf al-Sadusi; visiting sick, he told Ubaydallah ibn Abi Bakra 'give me what you gave Ibn Ma'mar and all will be well' — the four-hundred-jarib Suwaydan qati'a was his, and took his name.
  es: "Suwayd ibn Manjuf al-Sadusi, al visitar a un enfermo, le dijo a Ubaydallah ibn Abi Bakra: \"Dame lo que le diste a Ibn Ma'mar y todo irá bien\". El qati'a de cuatrocientos jarib Suwaydan era suyo y tomó su nombre."
  fr: "Suwayd ibn Manjuf al-Sadusi; en visite chez un malade, il dit à Ubaydallah ibn Abi Bakra: « Donne-moi ce que tu as donné à Ibn Ma'mar et tout ira bien » — le qati'a de quatre cents jarib de Suwaydan était le sien, et prit son nom."
  ur: "سوید بن منجوف السدوسی؛ بیمار کی عیادت کرتے ہوئے اس نے عبیداللہ ابن ابی بکرہ سے کہا کہ جو کچھ تم نے ابن معمر کو دیا ہے وہ مجھے دے دو سب ٹھیک ہو جائے گا - چار سو جریب سویدان قتیعہ ان کا تھا اور اس کا نام لیا۔"
