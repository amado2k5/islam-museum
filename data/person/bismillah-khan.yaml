summary:
  ar: "عازف شهناي هندي (1916–2006)، وُلد باسم قمر الدين خان في دومراون بولاية بيهار لأسرة من عازفي البلاط، ورفع الشهناي من آلة احتفالية إلى منصة الحفلات، وعزف عند رفع علم الهند عند الحصن الأحمر في دلهي يوم الاستقلال (1947)، ونال بهارات راتنا (2001)، أعلى وسام مدني هندي."
  en: "Indian shehnai maestro (1916–2006), born Qamaruddin Khan at Dumraon in Bihar into a family of court musicians, who raised the shehnai from a ceremonial instrument to the concert stage, played at Delhi's Red Fort as India's flag was raised at independence in 1947, and received the Bharat Ratna (2001), India's highest civilian honour."
  ur: "بھارتی شہنائی نواز (1916–2006)، جو قمر الدین خان کے نام سے بیہار کے ڈومراؤں میں درباری موسیقاروں کے گھرانے میں پیدا ہوئے؛ انھوں نے شہنائی کو رسمی آلے سے کنسرٹ کے اسٹیج تک پہنچایا، 1947 میں یومِ آزادی پر دہلی کے لال قلعے میں عزف کیا اور بھارت رتن (2001) سے نوازے گئے۔"
