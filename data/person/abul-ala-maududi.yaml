summary:
  ar: "عالم ومفكر باكستاني (1903–1979)، وُلد في أورنج آباد بالهند، وأسس جماعة الإسلامية سنة 1941 وقادها في باكستان حتى 1972، ودعا إلى دولة إسلامية تقوم على سيادة الشريعة، وسُجن مرات وحُكم عليه بالإعدام سنة 1953 ثم أُطلق سراحه بضغط شعبي، وألّف عشرات الكتب في مقدمتها تفسيره «تفہیم القرآن»، وتوفي في الولايات المتحدة ودُفن في لاهور."
  en: "Pakistani scholar and thinker (1903–1979), born in Aurangabad, India. He founded Jamaat-e-Islami in 1941 and led its Pakistani party until 1972, arguing for an Islamic state ordered by God's sovereignty and the sharia; he was repeatedly jailed, sentenced to death in 1953 and released under public pressure. He wrote dozens of books, headed by his Qur'an commentary Tafhim-ul-Quran, died in the United States and was buried in Lahore."
  ur: "پاکستانی عالم و مفکر (1903–1979)، جو ہندوستان کے شہر اورنگ آباد میں پیدا ہوا۔ اس نے 1941 میں جماعتِ اسلامی کی بنیاد رکھی اور 1972 تک اس کی پاکستانی جماعت کی قیادت کی، حاکمیتِ الٰہی اور شریعت پر قائم اسلامی ریاست کی دعوت دی؛ بار بار قید ہوا، 1953 میں سزائے موت سنائی گئی مگر عوامی دباؤ پر رہا ہو گیا۔ اس نے درجنوں کتابیں لکھیں جن میں سرِ فہرست اس کی تفسیر «تفہیم القرآن» ہے؛ امریکا میں وفات پائی اور لاہور میں دفن ہوا۔"
