    note: "No source consulted names a legal school (madhhab) as Maududi's own. Wikidata gives his religion as Islam generically. The English article records a formation that crossed several circles — a clerical family of Chishti descent, study of Sufism (tasawwuf) at a Deobandi seminary in Delhi's Fatehpuri Mosque with an ijaza in 1926, and the acknowledged impress of Ibn Taymiyya and Muhammad ibn Abd al-Wahhab on his thought — and the Arabic article describes the milieu of his upbringing as one in which hadith scholarship, the Hanafi school and the Sufi orders stood side by side. Teachers, ancestors, influences and milieu are not an attestation of his own school; his founding and leadership of Jamaat-e-Islami is a political fact, not one either. His argued positions — censure of folk Sufism, later praise of sharia-bound tasawwuf — are carried in the prose as his positions. The value therefore stays unknown."
    sources: [source/wikipedia-abul-ala-maududi-en, source/wikipedia-abul-ala-maududi-ar, source/wikidata-abul-ala-maududi]
