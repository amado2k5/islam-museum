    ar: "أبو الأعلى المودودي المفكر الباكستاني (١٩٠٣–١٩٧٩) وُلد بأورنج آباد بالهند، أسس الجماعة الإسلامية سنة ١٩٤١، ودعا إلى دولة تقوم على سيادة الشريعة، وسُجن وحُكم عليه بالإعدام."
    en: "Abu al-A'la Maududi (1903–1979), the Pakistani thinker born in Aurangabad, founded the Jamaat-e-Islami in 1941, called for a state on the sovereignty of the sharia — and was jailed, even sentenced to death."
    ur: "ابوالاعلیٰ مودودی (1903–1979)، پاکستانی مفکر اورنگ آباد میں پیدا ہوئے، 1941ء میں جماعتِ اسلامی کی بنیاد رکھی، شریعت کی بالادستی پر قائم ریاست کی دعوت دی — اور قید برداشت کی، یہاں تک کہ سزائے موت بھی سنائی گئی۔"
