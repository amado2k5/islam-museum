class: person
label: { ar: "شيطان الطاق", en: "Mumin Al Taq", es: "Mumin Al Taq", fr: "Mumin Al Taq", ur: "مومن الطاق" }
summary:
  ar: "أبو جعفر محمد بن النعمان الأحول نزل طاق المحامل بالكوفة وتلقبه العامة بشيطان الطاق والخاصة تعرفه بمؤمن الطاق وشيعته تسميه شاه الطاق، وهو من أصحاب جعفر الصادق وقد لقي زيد بن زين العابدين وناظره على إمامة أبي عبد الله ولقي علي بن الحسين زين العابدين، وقيل إنما سمي شيطان الطاق لأنه كان يتصرف ويشهد الدنانير فلاحاه قوم في دينار جوبوه وبهرجه هو فأصاب وأخطأ وألزمهم الحجة فقال أنا شيطان الطاق، وكان حسن الاعتقاد والهدي حاذقا في صناعة الكلام سريع الحاضر والجواب، وله مع أبي حنيفة مناظرات: لما مات جعفر الصادق قال أبو حنيفة قد مات إمامك قال لكن إمامك لا يموت إلا يوم القيامة يعني إبليس {cite:fihrist-ibn-al-nadim p. 532}. وله من الكتب كتاب الإمامة وكتاب المعرفة وكتاب الرد على المعتزلة في إمامة المفضول وكتاب في أمر طلحة والزبير وعائشة {cite:fihrist-ibn-al-nadim p. 250}"
  en: "Mu'min al-Taq — Ja'far al-Sadiq's debater and Abu Hanifa's famous antagonist {cite:fihrist-ibn-al-nadim}"
  es: "Mu'min al-Taq: polemista de Ja'far al-Sadiq y famoso antagonista de Abu Hanifa {cita:fihrist-ibn-al-nadim}"
  fr: "Mu'min al-Taq - le débatteur de Ja'far al-Sadiq et le célèbre antagoniste d'Abu Hanifa {cite: fihrist-ibn-al-nadim}"
  ur: "مؤمن الطاق - جعفر الصادق کا مناظرہ کرنے والا اور ابو حنیفہ کا مشہور مخالف {حوالہ: فہرست ابن الندیم}"
  tr: "Ebu Ca'far Muhammed bin Nu'man el-Ahval, Kufe'deki Taq al-Mahamal'e yerleşti ve halk ona el-Taq'ın şeytanı derken, seçkinler onu Mu'min al-Taq olarak tanıdı, Şiileri ise Şah al-Taq derdi. Ca'far el-Sadiq'in yoldaşlarından biriydi, Zayd bin Zeyn el-Eddin ile tanıştı ve onunla Ebu Abdullah ile Ali bin Hüseyin Zeyn el-Eddin imamı üzerine tartıştı. Söylenir ki, kendisine al-Taq'ın şeytanı çünkü dinarları yönetir ve ona tanıklık ederdi. Bazı insanlar ona bir dinar için para verirdi, bu yüzden haklı çıktı ve hata yaptı, onları 'Ben al-Taq'ın şeytanıyım' demeye zorladı. İyi niyet ve rehberlikte yetenekliydi, hızlı cevap verir ve çabuk cevap verirdi. Ebu Hanife ile tartıştı: Cafer el-Sadiq öldüğünde, Ebu Hanifa dedi ki: İmamınız öldü. Dedi ki, 'Ama imamınız ancak Diriliş Günü'nde ölecek,' yani İblis kastediliyor. {alıntı:Fihrist-ibn-al-Nadim s. 532}. Kitapları arasında İmamat Kitabı, Bilgi Kitabı, Erdemli İmamat'ta Mu'tazila Reddi Kitabı ve Talha, Al-Zubair ve Aisha meselesi üzerine bir kitap bulunmaktadır {cite:fihrist-ibn-al-nadim s. 250}"
  id: "Abu Ja'far Muhammad ibn al-Nu'man al-Ahwal menetap di Taq al-Mahamal di Kufa, dan masyarakat menyebutnya iblis al-Taq, sementara kaum elit mengenalnya sebagai Mu'min al-Taq, dan Syiah menyebutnya Shah al-Taq. Ia adalah salah satu sahabat Ja'far al-Sadiq, bertemu Zayd ibn Zayn al-Abidin, dan berdebat dengannya tentang imamat Abu Abdullah dan Ali ibn al-Husayn Zayn al-Abidin. Dikatakan bahwa ia adalah disebut iblis al-Taq karena dia biasa mengelola dan menyaksikan dinar. Beberapa orang membayarnya untuk dinar, jadi dia benar dan salah, lalu memaksa mereka berdebat dan berkata, 'Aku iblis al-Taq.' Dia mahir dalam itikad baik dan bimbingan, cepat merespons dan merespons dengan cepat. Dia berdebat dengan Abu Hanifa: Ketika Ja'far al-Sadiq meninggal, Abu Hanifa berkata: Imammu telah wafat. Dia berkata, 'Tetapi Imammu hanya akan mati pada Hari Kebangkitan,' artinya Iblis. {cite:Fihrist-ibn-al-Nadim hlm. 532}. Di antara buku-bukunya adalah Kitab Imamat, Kitab Pengetahuan, Kitab Penolakan Mu'tazila dalam Imamate Orang Berbudi Luhur, dan sebuah buku tentang Talha, Al-Zubair, dan Aisha {cite:fihrist-ibn-al-nadim hlm. 250}"
