id: person/mumin-al-taq
class: person
label: { ar: "شيطان الطاق", en: "Mumin Al Taq" }
summary:
  ar: "أبو جعفر محمد بن النعمان الأحول نزل طاق المحامل بالكوفة وتلقبه العامة بشيطان الطاق والخاصة تعرفه بمؤمن الطاق وشيعته تسميه شاه الطاق، وهو من أصحاب جعفر الصادق وقد لقي زيد بن زين العابدين وناظره على إمامة أبي عبد الله ولقي علي بن الحسين زين العابدين، وقيل إنما سمي شيطان الطاق لأنه كان يتصرف ويشهد الدنانير فلاحاه قوم في دينار جوبوه وبهرجه هو فأصاب وأخطأ وألزمهم الحجة فقال أنا شيطان الطاق، وكان حسن الاعتقاد والهدي حاذقا في صناعة الكلام سريع الحاضر والجواب، وله مع أبي حنيفة مناظرات: لما مات جعفر الصادق قال أبو حنيفة قد مات إمامك قال لكن إمامك لا يموت إلا يوم القيامة يعني إبليس {cite:fihrist-ibn-al-nadim p. 532}. وله من الكتب كتاب الإمامة وكتاب المعرفة وكتاب الرد على المعتزلة في إمامة المفضول وكتاب في أمر طلحة والزبير وعائشة {cite:fihrist-ibn-al-nadim p. 250}"
  en: "Mu'min al-Taq — Ja'far al-Sadiq's debater and Abu Hanifa's famous antagonist {cite:fihrist-ibn-al-nadim}"
