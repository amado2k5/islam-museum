gender: male
roles: [companion]
summary:
  ar: "صحابي يذكره أبو إسحاق الحويني شاهدًا على أن الولي لا يُشترط فيه جمال الصورة: زوّجه النبي بعد أن قالت الفتاة ادفعوني إليه فلن يضيعني، ووُجد بعد غزوة مقتولًا إلى جانب سبعة قتلهم، فقال النبي إنه منه وهو منه، بحسب روايته عن صحيح مسلم ومسند أحمد."
  en: "A Companion whom Abu Ishaq al-Heweny cites as evidence that a friend of God need not be handsome: the Prophet arranged his marriage after the young woman said 'give me to him, he will not let me be lost', and after a campaign he was found killed beside seven men he had killed, and the Prophet said Julaybib was of him and he of Julaybib, as al-Heweny tells it from Sahih Muslim and the Musnad of Ahmad."
  ur: "ایک صحابی جن کا ذکر ابو اسحاق حوینی اس بات کی دلیل کے طور پر کرتے ہیں کہ ولی کے لیے ظاہری حسن شرط نہیں: لڑکی کے یہ کہنے کے بعد کہ مجھے ان کے حوالے کر دو، وہ مجھے ضائع نہیں ہونے دیں گے، نبی نے ان کا نکاح کرایا، اور ایک غزوے کے بعد وہ سات آدمیوں کے پہلو میں مقتول پائے گئے جنہیں انہوں نے قتل کیا تھا، اور نبی نے فرمایا کہ جلیبیب ان سے ہیں اور وہ جلیبیب سے؛ یہ حوینی کا بیان ہے صحیح مسلم اور مسند احمد کے حوالے سے۔"
