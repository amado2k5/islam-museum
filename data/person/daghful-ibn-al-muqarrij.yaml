label: { ar: "دغفل بن المقرج الجراحي" }
summary:
  ar: "دغفل بن المقرج بن الجراح الطائي، استولى على الرملة وما تصل بها وأظهر طاعة العزيز من غير أن يتصرف بأحكامه؛ سار إلى أحياء عقيل المقيمة بالشام ليخرجها منها فاجتمعت عقيل إلى أبي تغلب تسأل نصرتها، فلما سار أبو تغلب إلى الرملة سنة 369هـ جمع دغفل والفضل العساكر فانهزمت عقيل وأُخذ أبو تغلب أسيراً فأسره دغفل وكتفه فلما أراد الفضل أخذه وحمله إلى العزيز بمصر خاف دغفل أن يصطنعه العزيز كما فعل بسبكتكين فقتله على غفلة من الفضل وأرسل رأسه إلى مصر {cite:kamil-ibn-al-athir p. 513-514}."
  en: "The Jarrahid Tayyi emir who held Ramla under nominal Fatimid allegiance; fearing al-Aziz would adopt the captive Abu Taghlib as he had done Sabuktagin, he killed him in 369 and sent the head to Egypt {cite:kamil-ibn-al-athir p. 513-514}."
