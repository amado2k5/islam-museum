id: person/daghful-ibn-al-muqarrij
class: person
label: { ar: "دغفل بن المقرج الجراحي" }
summary:
  ar: "دغفل بن المقرج بن الجراح الطائي، استولى على الرملة وما تصل بها وأظهر طاعة العزيز من غير أن يتصرف بأحكامه؛ سار إلى أحياء عقيل المقيمة بالشام ليخرجها منها فاجتمعت عقيل إلى أبي تغلب تسأل نصرتها، فلما سار أبو تغلب إلى الرملة سنة 369هـ جمع دغفل والفضل العساكر فانهزمت عقيل وأُخذ أبو تغلب أسيراً فأسره دغفل وكتفه فلما أراد الفضل أخذه وحمله إلى العزيز بمصر خاف دغفل أن يصطنعه العزيز كما فعل بسبكتكين فقتله على غفلة من الفضل وأرسل رأسه إلى مصر {cite:kamil-ibn-al-athir p. 513-514}."
  en: "The Jarrahid Tayyi emir who held Ramla under nominal Fatimid allegiance; fearing al-Aziz would adopt the captive Abu Taghlib as he had done Sabuktagin, he killed him in 369 and sent the head to Egypt {cite:kamil-ibn-al-athir p. 513-514}."
  es: "El emir Jarrahid Tayyi, que mantenía Ramla bajo lealtad nominal fatimí, temiendo que al-Aziz adoptara al cautivo Abu Taghlib como había hecho con Sabuktagin, lo mató en 369 y envió su cabeza a Egipto {cite:kamil-ibn-al-athir p. 513-514}."
  fr: "L'émir Jarrahid Tayyi qui tenait Ramla sous une allégeance fatimide nominale; craignant qu'al-Aziz n'adopte le captif Abu Taghlib comme il l'avait fait Sabuktagin, il le tua en 369 et envoya sa tête en Égypte {cite:kamil-ibn-al-athir p. 513-514}."
  ur: "جراحد طائی امیر جنہوں نے برائے نام فاطمی بیعت کے تحت رملہ منعقد کیا؛ اس خوف سے کہ العزیز اسیر ابو تغلب کو گود لے لے گا جیسا کہ اس نے سبوکتگین کو کیا تھا، اس نے اسے 369 میں قتل کر دیا اور سر مصر بھیج دیا۔ 513-514}۔"
  tr: "Daghfal ibn al-Muqraj ibn al-Jarrah al-Ta'i, Ramla ve çevresini ele geçirdi ve el-Aziz'e itaat etti, ancak onun hükümlerine uymadı. Levant'ta yaşayan Aqil mahallelerine yürüyerek onları kovdu. Aqil, Abu Taghlib'i destek almak için topladı. Abu Taghlib 369 Hicri'de Ramla'ya yürüdüğünde Daghfal ve al-Fadl ordularını topladı, ancak Aqil yenildi. Ebu Taghlib esir alındı, Dağıfal tarafından esir alındı ve bağlandı. Al-Fadl onu yakalayıp Mısır'daki el-Aziz'e götürmek istediğinde, Sabuktakin'de yaptığı gibi al-Aziz'in onu uydurabileceğinden korktu, bu yüzden onu aniden öldürdü ve başını Mısır'a geri gönderdi {cite:kamil-ibn-al-athir s. 513-514}."
  id: "Daghfal ibn al-Muqraj ibn al-Jarrah al-Ta'i merebut Ramla dan sekitarnya serta menunjukkan ketaatan kepada al-Aziz tanpa bertindak sesuai dengan keputusannya. Ia berbaris ke lingkungan Aqil yang tinggal di Levant untuk mengusir mereka. Aqil mengumpulkan Abu Taghlib untuk mencari dukungan mereka. Ketika Abu Taghlib berbaris ke Ramla pada tahun 369 H, ia mengumpulkan pasukan Daghfal dan al-Fadl, tetapi Aqil dikalahkan. Abu Taghlib ditangkap, ditangkap dan diikat oleh Daghfal. Ketika al-Fadl ingin menangkapnya dan membawanya ke al-Aziz di Mesir, ia takut al-Aziz mungkin memalsukannya seperti yang ia lakukan di Sabuktakin, sehingga ia membunuhnya secara tak terduga dan mengirim kepalanya kembali ke Mesir {cite:kamil-ibn-al-athir hlm. 513-514}."
