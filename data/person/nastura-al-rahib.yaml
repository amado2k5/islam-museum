summary:
  ar: "راهب نظر إلى النبي وهو في تجارة خديجة إلى الشام مع غلامها ميسرة وهو في صومعته وقد أظلته غمامة فقال هذا نبي وهذا آخر الأنبياء، وكان ذلك بين مشاهدة النبي الفجار الرابع وبنيان الكعبة على ما ذكر المسعودي {cite:muruj-al-dhahab p. 569-570}."
  en: "The monk who from his cell saw the cloud shade the Prophet on Khadija's Syria venture with Maysara and declared 'this is a prophet — the last of prophets' {cite:muruj-al-dhahab p. 569-570}."
  es: "El monje que desde su celda vio la nube cubrir al Profeta en la aventura de Khadija en Siria con Maysara y declaró 'este es un profeta, el último de los profetas' {cite:muruj-al-dhahab p. 569-570}."
  fr: "Le moine qui, depuis sa cellule, vit le nuage ombrager le Prophète lors de l'aventure de Khadija en Syrie avec Maysara et déclara: « c'est un prophète — le dernier des prophètes » {cite: muruj-al-dhahab p. 569-570}."
  ur: "وہ راہب جس نے اپنے سیل سے خدیجہ کے شام میں میسرہ کے ساتھ پیش قدمی پر بادل کو نبی پر سایہ کرتے ہوئے دیکھا اور اعلان کیا کہ 'یہ ایک نبی ہے - انبیاء میں سے آخری'۔ 569-570}۔"
  tr: "Bir keşiş, Hatije hizmetkârı Maysara ile ticaret yaparken Peygamber'e baktı; Khadice minaresinde, bir bulutun gölgesinde kalmıştı. Peygamber, \"Bu bir peygamberdir ve bu peygamberlerin sonuncusudur,\" dedi. Bu, dördüncü kötü peygambere tanıklık etmek ile Kabe'nin inşası arasında gerçekleşti; bu, al-Mas'udi'nin de belirttiği gibi {cite:muruj-al-dhahab, s. 569-570} tarafından belirtilmiştir."
  id: "Seorang biksu menatap Nabi saat Khadijah berdagang dengan pelayannya Maysara ketika ia berada di menara, tertutup oleh awan. Ia berkata, \"Ini adalah nabi, dan ini adalah nabi terakhir.\" Ini terjadi antara menyaksikan Nabi keempat yang jahat dan pembangunan Ka'bah, seperti yang disebutkan oleh al-Mas'udi {cite:muruj-al-dhahab, hlm. 569-570}."
