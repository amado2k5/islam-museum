summary:
  ar: "غلام رومي أخذ صغيراً هو وأخوه من بلاد الروم من موضع قرب حصن ذي الكلاع وتعلم الخط بفلسطين ثم بيع من سيدة كرماً بالرملة فأعتقه صاحبه وكان معهم حراً في عدة المماليك، كريم النفس بعيد الهمة شجاعاً كثير الإقدام ولذلك قيل له الميمون، وكان شريف الأستاذ كافور في خدمة الإخشيد فلما مات مخدومهما وتولى كافور خدمة ابن الإخشيد أبغض فاتك الإقامة بمصر كيلا يحتاج أن يركب في خدمة كافور فاتخذ الفيوم وأعمالها إقطاعاً له فكان يجيء إليها ويأتيها، توفي بمصر عشية الأحد لإحدى عشرة ليلة خلت من شوال سنة خمس وخمسين وثلاث مئة ورثاه المتنبي بقصيدة فائقة {cite:shadharat-dhahab p. 14-15}."
  en: "The Byzantine-born commander Fatik 'al-Maimun', freed for his generosity and courage, Kafur's fellow in al-Ikhshid's service; unwilling to ride in Kafur's service he withdrew to his Fayyum iqta' — al-Mutanabbi praised him for the thousand-dinar gift and mourned him at his death in Shawwal 355 {cite:shadharat-dhahab p. 14-15}."
