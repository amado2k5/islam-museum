names:
  - { value: "أبو شجاع فاتك المكنى الميمون الرومي الإخشيدي", kind: full }
gender: male
summary:
  ar: "غلام رومي أخذ صغيراً هو وأخوه من بلاد الروم من موضع قرب حصن ذي الكلاع وتعلم الخط بفلسطين ثم بيع من سيدة كرماً بالرملة فأعتقه صاحبه وكان معهم حراً في عدة المماليك، كريم النفس بعيد الهمة شجاعاً كثير الإقدام ولذلك قيل له الميمون، وكان شريف الأستاذ كافور في خدمة الإخشيد فلما مات مخدومهما وتولى كافور خدمة ابن الإخشيد أبغض فاتك الإقامة بمصر كيلا يحتاج أن يركب في خدمة كافور فاتخذ الفيوم وأعمالها إقطاعاً له فكان يجيء إليها ويأتيها، توفي بمصر عشية الأحد لإحدى عشرة ليلة خلت من شوال سنة خمس وخمسين وثلاث مئة ورثاه المتنبي بقصيدة فائقة {cite:shadharat-dhahab p. 14-15}."
  en: "The Byzantine-born commander Fatik 'al-Maimun', freed for his generosity and courage, Kafur's fellow in al-Ikhshid's service; unwilling to ride in Kafur's service he withdrew to his Fayyum iqta' — al-Mutanabbi praised him for the thousand-dinar gift and mourned him at his death in Shawwal 355 {cite:shadharat-dhahab p. 14-15}."
  es: "El comandante de origen bizantino Fatik 'al-Maimun', liberado por su generosidad y valentía, compañero de Kafur al servicio de al-Ikhshid; no quiso cabalgar al servicio de Kafur y se retiró a su iqta' de Fayyum. Al-Mutanabbi lo elogió por el regalo de mil dinares y lo lloró por su muerte en Shawwal 355 {cite:shadharat-dhahab p. 14-15}."
  fr: "Le commandant Fatik 'al-Maimun', né à Byzance, libéré pour sa générosité et son courage, compagnon de Kafur au service d'al-Ikhshid; ne voulant pas servir Kafur, il se retira dans son iqta' du Fayyum — al-Mutanabbi le félicita pour le don de mille dinars et le pleura à sa mort en Shawwal 355 {cite:shadharat-dhahab p. 14-15}."
  ur: "بازنطینی نژاد کمانڈر فاتک 'المیمون'، اپنی سخاوت اور ہمت کی بنا پر رہا ہوا، الخشد کی خدمت میں کافور کا ساتھی؛ کافور کی خدمت میں سوار ہونے کی خواہش کے ساتھ وہ اپنے فیوم اقطاع کی طرف واپس چلا گیا - المتنبی نے ہزار دینار کے تحفے پر اس کی تعریف کی اور شوال 355 میں ان کی وفات پر ان کا ماتم کیا۔ 14-15}۔"
  tr: "Bir Romalı köle, çocukken kardeşiyle birlikte Romalıların topraklarından Dhi al-Kalla kalesi yakınından alındı, Filistin'de hat öğrendi, sonra Ramla'da bir hanımefendi tarafından satıldı ve sahibi tarafından serbest bırakıldı. Onlarla birlikte birkaç Memlükte özgürdü, ruhu cömert, cesur ve çok cesurdu, bu yüzden Al-Ma'mun olarak anıldı. Sharif Ustad Kafur El-İhşid'e hizmet etti. Hizmetkarları öldüğünde ve Kafur İbn İhşid'in hizmetini devraldığında, Kafur'a hizmet etmek zorunda kalmamak için Mısır'da kalmaktan nefret etti. Fayoum'u ve işlerini mülkü yaptı, sık sık Mısır'a geldi ve oraya geldi. 355 Hicri yılında, Şevval'den on bir gece önce, Pazar akşamı Mısır'da öldü. El-Mutanabbi onu olağanüstü bir şiirle yas tuttu {atı:shadharat-dhahab, s. 14-15}."
  id: "Seorang budak Romawi diambil saat kecil bersama saudaranya dari tanah Romawi dekat benteng Dhi al-Kalla, belajar kaligrafi di Palestina, lalu dijual oleh seorang wanita di Ramla yang dibebaskan oleh pemiliknya. Dia bebas bersama mereka di beberapa Mamluk, murah hati, berani, dan sangat berani, sehingga dia disebut Al-Ma'mun. Sharif Ustad Kafur melayani Al-Ikhshid. Ketika pelayan mereka meninggal dan Kafur mengambil alih pelayanan Ibn Al-Ikhshid, dia benci tinggal di Mesir agar tidak perlu melayani Kafur. Dia menjadikan Fayoum dan urusannya sebagai wilayahnya, sering datang dan datang ke Mesir. Dia meninggal di Mesir pada Minggu malam, sebelas malam sebelum Shawwal pada tahun 355 H. Al-Mutanabbi meratapi kehadirannya dengan puisi luar biasa {cite:shadharat-dhahab, hlm. 14-15}."
