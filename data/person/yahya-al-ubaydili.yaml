summary:
  ar: "يحيى بن الحسن بن جعفر الحجة بن عبيد الله الأعرج بن الحسين الأصغر بن زين العابدين، أبو الحسين العبيدلي العقيقي، نسابة مؤرخ من أهل المدينة ولد بها وتوفي بمكة، ويقال إنه أول من صنف أنساب الطالبيين، من كتبه «أخبار المدينة» و«أنساب آل أبي طالب»، 214 إلى 277 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 pp. 140-141}."
  en: "Yahya ibn al-Hasan ibn Ja'far al-Hujja ibn Ubayd Allah al-A'raj ibn al-Husayn al-Asghar ibn Zayn al-Abidin, Abu al-Husayn al-Ubaydili al-Aqiqi, a genealogist and historian of Medina, born there and died at Mecca, said to be the first to compose genealogies of the Talibids; his books include Akhbar al-Madina and Ansab Al Abi Talib; 214 to 277 AH (829 to 890 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 pp. 140-141}."
