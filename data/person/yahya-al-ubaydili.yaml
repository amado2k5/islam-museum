names:
  - { kind: full, lang: ar, value: "يحيى بن الحسن بن جعفر الحجة بن عبيد الله الأعرج، أبو الحسين العبيدلي العقيقي" }
roles: [historian, writer]
gender: male
summary:
  ar: "يحيى بن الحسن بن جعفر الحجة بن عبيد الله الأعرج بن الحسين الأصغر بن زين العابدين، أبو الحسين العبيدلي العقيقي، نسابة مؤرخ من أهل المدينة ولد بها وتوفي بمكة، ويقال إنه أول من صنف أنساب الطالبيين، من كتبه «أخبار المدينة» و«أنساب آل أبي طالب»، 214 إلى 277 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 pp. 140-141}."
  en: "Yahya ibn al-Hasan ibn Ja'far al-Hujja ibn Ubayd Allah al-A'raj ibn al-Husayn al-Asghar ibn Zayn al-Abidin, Abu al-Husayn al-Ubaydili al-Aqiqi, a genealogist and historian of Medina, born there and died at Mecca, said to be the first to compose genealogies of the Talibids; his books include Akhbar al-Madina and Ansab Al Abi Talib; 214 to 277 AH (829 to 890 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 pp. 140-141}."
  es: "Yahya ibn al-Hasan ibn Ja'far al-Hujja ibn Ubayd Allah al-A'raj ibn al-Husayn al-Asghar ibn Zayn al-Abidin, Abu al-Husayn al-Ubaydili al-Aqiqi, genealogista e historiador de Medina, nacido allí y fallecido en La Meca, considerado el primero en componer genealogías de los talíbidas; entre sus libros se incluyen Akhbar al-Madina y Ansab Al Abi Talib; 214 a 277 AH (829 a 890 d. C.) {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 pp. 140-141}."
  fr: "Yahya ibn al-Hasan ibn Ja'far al-Hujja ibn Ubayd Allah al-A'raj ibn al-Husayn al-Asghar ibn Zayn al-Abidin, Abu al-Husayn al-Ubaydili al-Aqiqi, généalogiste et historien de Médine, né à Médine et mort à La Mecque, est considéré comme le premier à avoir composé des généalogies des Talibides; ses ouvrages comprennent Akhbar al-Madina et Ansab Al Abi Talib; 214 à 277 AH (829 à 890 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 pp. 140-141}."
  ur: "یحییٰ بن الحسن بن جعفر الحجا بن عبید اللہ العراج ابن الحسین اصغر بن زین العابدین، ابو الحسین العبیدلی العقیقی، ایک ماہر نسب اور مؤرخ نے کہا کہ مدینہ منورہ میں سب سے پہلے وفات پائی۔ Talibids کے نسب نامے؛ ان کی کتابوں میں اخبار المدینہ اور انساب آل ابی طالب شامل ہیں۔ 214 تا 277 ہجری ⁦(829 تا 890 عیسوی)⁩ {حوالہ دیں: الام زرکلی دار العلم 2002 جلد۔ 8 صفحہ 140-141}۔"
