  ar: "أحمد بن إدريس بن عبد الرحمن، أبو العباس، شهاب الدين الصنهاجي القرافي، من علماء المالكية، مصري المولد والمنشأ والوفاة، صاحب أنوار البروق في أنواء الفروق والذخيرة، وكان بارعا في الآلات المتحركة، توفي سنة 684 هـ."
