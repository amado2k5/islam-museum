roles: [scholar]
gender: male
summary:
  ar: "أحمد بن إدريس بن عبد الرحمن، أبو العباس، شهاب الدين الصنهاجي القرافي، من علماء المالكية، مصري المولد والمنشأ والوفاة، صاحب أنوار البروق في أنواء الفروق والذخيرة، وكان بارعا في الآلات المتحركة، توفي سنة 684 هـ."
  en: "Ahmad ibn Idris ibn Abd al-Rahman, Abu al-Abbas, Shihab al-Din al-Sanhaji al-Qarafi, a Maliki scholar, Egyptian by birth, upbringing and death; author of Anwar al-Buruq fi Anwa' al-Furuq and al-Dhakhira, and a skilled maker of mechanical figures; died 684 AH (1285)."
  fr: "Ahmad ibn Idris ibn Abd al-Rahman, Abu al-Abbas, Shihab al-Din al-Sanhaji al-Qarafi, un savant malikite, égyptien de naissance, d’éducation et de mort  ; Auteur d'Anwar al-Buruq fi Anwa' al-Furuq et al-Dhakira, et un fabricant habile de figures mécaniques ; décédé en 684 de l’hégire (1285)."
  es: "Ahmad ibn Idris ibn Abd al-Rahman, Abu al-Abbas, Shihab al-Din al-Sanhaji al-Qarafi, un erudito Maliki, egipcio de nacimiento, crianza y muerte; autor de Anwar al-Buruq fi Anwa' al-Furuq y al-Dhakhira, y experto fabricante de figuras mecánicas; murió en 684 d. H. (1285)."
  ur: "احمد بن ادریس بن عبدالرحمن، ابو العباس، شہاب الدین السنہجی القرافی، ایک مالکی عالم، مصری بلحاظ پیدائش، پرورش اور وفات؛ انوار البروق فی انواع الفروق اور الذخیرہ کے مصنف، اور مشینی اعداد و شمار کے ماہر بنانے والے؛ وفات 684ھ (1285)۔"
  tr: "Ahmed ibn İdris ibn Abd al-Rahman, Ebu al-Abbas, Şihabeddin el-Sanhaji el-Karafi, Maliki alim, doğum, köken ve ölüm olarak Mısırlı, Enve' el-Furuq ve el-Dhakira'nın yazarı ve hareket ettirme aletlerinde yeteneklidir. 684 Hicri'de vefat etti."
  id: "Ahmad ibn Idris ibn Abd al-Rahman, Abu al-Abbas, Shihab al-Din al-Sanhaji al-Qarafi, seorang ulama Maliki, berasal dari Mesir berdasarkan kelahiran, asal, dan kematian, penulis Anwar al-Buruq fi Anwa' al-Furuq wa al-Dhakira, dan ahli dalam menggerakkan alat musik. Ia wafat pada tahun 684 H."
