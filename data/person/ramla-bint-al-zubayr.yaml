summary:
  en: "Daughter of al-Zubayr ibn al-Awwam, remembered for the story of Khalid ibn Yazid ibn Mu'awiya falling in love with her at the Kaaba during the Hajj; she refused Abd al-Malik's suit unless he divorced his wives, and after Ibn al-Zubayr's killing she would not trust herself to the Umayyad caliph."
  ar: "ابنة الزبير بن العوام؛ اشتهر خبر عشق خالد بن يزيد بن معاوية لها حين رآها تطوف بالبيت في الحج، فخطبها عبد الملك بن مروان فاشترطت عليه طلاق امرأتيه، ولما قُتل أخوها ابن الزبير أبَت أن تأمن نفسها على من قتل أخاها."
  es: "Hija de al-Zubayr ibn al-Awwam, recordada por la historia de cómo Khalid ibn Yazid ibn Mu'awiya se enamoró de ella en la Kaaba durante el Hajj; rechazó la petición de Abd al-Malik a menos que se divorciara de sus esposas, y después del asesinato de Ibn al-Zubayr no quiso confiar en el califa omeya."
  fr: "Fille d'al-Zubayr ibn al-Awwam, connue pour l'histoire de Khalid ibn Yazid ibn Mu'awiya tombant amoureux d'elle à la Kaaba pendant le Hajj; elle refusa la demande en mariage d'Abd al-Malik à moins qu'il ne divorce de ses épouses, et après le meurtre d'Ibn al-Zubayr, elle ne voulut plus faire confiance au calife omeyyade."
  ur: "الزبیر بن العوام کی بیٹی، خالد بن یزید بن معاویہ کے حج کے دوران کعبہ میں اس سے محبت کرنے کی کہانی کے لیے یاد ہے۔ اس نے عبد الملک کے مقدمے سے انکار کر دیا جب تک کہ وہ اپنی بیویوں کو طلاق نہ دے دے، اور ابن الزبیر کے قتل کے بعد وہ خود کو اموی خلیفہ پر اعتماد نہیں کرے گی۔"
