summary:
  en: "Daughter of al-Zubayr ibn al-Awwam, remembered for the story of Khalid ibn Yazid ibn Mu'awiya falling in love with her at the Kaaba during the Hajj; she refused Abd al-Malik's suit unless he divorced his wives, and after Ibn al-Zubayr's killing she would not trust herself to the Umayyad caliph."
  ar: "ابنة الزبير بن العوام؛ اشتهر خبر عشق خالد بن يزيد بن معاوية لها حين رآها تطوف بالبيت في الحج، فخطبها عبد الملك بن مروان فاشترطت عليه طلاق امرأتيه، ولما قُتل أخوها ابن الزبير أبَت أن تأمن نفسها على من قتل أخاها."
