summary:
  ar: "من أئمة الشافعية بالدينور، صحب ابن القطان وحضر مجلس الداركي وجمع بين رياسة العلم والدنيا وارتحل الناس إليه من الآفاق؛ قال له أبو علي السنجي لما رأى علمه يا أستاذ الاسم لأبي حامد والعلم لك فقال ذاك رفعته بغداد وحطتني الدينور، وقتله العيارون بالدينور ليلة السابع والعشرين من رمضان سنة خمس وأربع مئة {cite:wafayat-ayan p. 64-65}."
  en: "Ibn Kajj the Shafi'i of Dinawar, combining scholarly and worldly eminence; when Sanji told him 'the name is Abu Hamid's but the knowledge yours' he answered 'Baghdad lifted him and Dinawar dropped me' — killed by the 'ayyarun at Dinawar on 27 Ramadan 405 {cite:wafayat-ayan p. 64-65}."
