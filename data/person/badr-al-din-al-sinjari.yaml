died: { edtf: "1265-04~", hijri: "0663-07", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في رجب سنة ثلاث وستين وستمائة {cite:shadharat-dhahab p. 544}." }
summary:
  ar: "قاضي القضاة؛ كان صدراً معظماً وجواداً ممدحاً؛ ولي قضاء بعلبك وغيرها قبل الثلاثين ثم عاد إلى سنجار فنفق على الصالح نجم الدين، فلما ملك الديار المصرية وفد عليه فولاه مصر والوجه القبلي ثم ولي قضاء القضاة بعد شرف الدين بن عين الدولة وباشر الوزارة، وكان له من الخيل والمماليك ما ليس لوزير مثله، ولم يزل في ارتقاء إلى أوائل الدولة الظاهرية فعزل ولزم بيته؛ توفي في رجب، وقيل: كان يرتشي ويظلم قاله في العبر {cite:shadharat-dhahab p. 544}."
  en: "Egypt's qadi al-qudat — a Baalbek judgeship before thirty, then al-Salih's purse at Sinjar and the Egyptian qadiate plus the vizierate, with a stable and mamluk retinue beyond any minister; dismissed under al-Zahir's late reign he kept to his house; 'some said he took bribes and oppressed' — d. Rajab 663 {cite:shadharat-dhahab p. 544}."
