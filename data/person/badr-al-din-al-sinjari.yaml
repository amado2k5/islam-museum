summary:
  ar: "قاضي القضاة؛ كان صدراً معظماً وجواداً ممدحاً؛ ولي قضاء بعلبك وغيرها قبل الثلاثين ثم عاد إلى سنجار فنفق على الصالح نجم الدين، فلما ملك الديار المصرية وفد عليه فولاه مصر والوجه القبلي ثم ولي قضاء القضاة بعد شرف الدين بن عين الدولة وباشر الوزارة، وكان له من الخيل والمماليك ما ليس لوزير مثله، ولم يزل في ارتقاء إلى أوائل الدولة الظاهرية فعزل ولزم بيته؛ توفي في رجب، وقيل: كان يرتشي ويظلم قاله في العبر {cite:shadharat-dhahab p. 544}."
  en: "Egypt's qadi al-qudat — a Baalbek judgeship before thirty, then al-Salih's purse at Sinjar and the Egyptian qadiate plus the vizierate, with a stable and mamluk retinue beyond any minister; dismissed under al-Zahir's late reign he kept to his house; 'some said he took bribes and oppressed' — d. Rajab 663 {cite:shadharat-dhahab p. 544}."
  es: "El cadí al-qudat de Egipto —un juez baalbek antes de los treinta, luego la tesorería de al-Salih en Sinjar y el cadí egipcio más el visirato, con un séquito estable y mameluco más que el de cualquier ministro; destituido durante el último reinado de al-Zahir, se mantuvo en su casa; \"algunos decían que aceptaba sobornos y oprimía\"— murió en Rajab 663 {cita: shadharat-dhahab p. 544}."
  fr: "Le cadi al-qudat d'Égypte — juge à Baalbek avant trente, puis trésorier d'al-Salih à Sinjar et cadiat égyptien plus vizirat, avec une écurie et une suite mamelouke au-delà de tout ministre; destitué sous le règne tardif d'al-Zahir, il resta dans sa maison; « certains disaient qu'il prenait des pots-de-vin et opprimait » — mort en Rajab 663 {cite: shadharat-dhahab p. 544}."
  ur: "مصر کی قضاء القدات - تیس سال سے پہلے بعلبیک جج شپ، پھر سنجار میں الصالح کا پرس اور مصری قادیات کے علاوہ وزیریٹ، کسی بھی وزیر سے آگے ایک مستحکم اور مملوک ریٹینیو کے ساتھ؛ الظاہر کے آخری دور حکومت میں برطرف کر کے اس نے اپنے گھر رکھا۔ 'کچھ نے کہا کہ اس نے رشوت لی اور ظلم کیا' - ڈی۔ رجب 663 {حوالہ: شدّرت ذہب ص 544}۔"
  tr: "Baş Yargıç; saygın, cömert ve övgü alan bir şefti; Otuz Yıl'dan önceki otuz yıl öncesinde Baalbek ve başka yerlerde yargıç olarak görev yaptı, sonra Sincar'a döndü ve Salih Najm al-Din'de vakit geçirdi. Mısır kralı olduğunda, bir heyet yanına geldi ve onu Mısır ile Yukarı Mısır'a atadı, ardından Şeraf al-Din ibn Ayn al-Dawla'dan sonra yargıç oldu ve vezirliğe başladı. Bir vezir tarafından eşi olmayan atları ve Memlükleri vardı. Erken Zahiri devletine yükselmeye devam etti, görevden alındı ve evine hapsedildi; Recep'te öldü ve rüşvet alıp zulme uğrattığı söylenir, Al-'Ibar'da belirttiği gibi {atı: shadharat-dhahab, s. 544}."
  id: "Hakim Ketua; ia adalah kepala yang dihormati, murah hati dan dipuji; ia menjabat sebagai hakim Baalbek dan tempat lain sebelum tiga puluh tahun sebelum Tiga Puluh Tahun, lalu kembali ke Sinjar dan menghabiskan waktu di Salih Najm al-Din. Ketika ia menjadi raja Mesir, sebuah delegasi datang kepadanya dan menunjuknya ke Mesir dan Mesir Hulu, kemudian menjadi hakim setelah Sharaf al-Din ibn Ayn al-Dawla dan memulai kepemimpinan wazir. Ia memiliki kuda dan Mamluk yang tiada tandingannya oleh wazir. Ia terus naik ke negara Zahiri awal, diberhentikan, dan dikurung di rumah tangganya; ia meninggal di Rajab, dan dikatakan ia biasa menerima suap dan menindas, seperti yang ia tulis dalam Al-'Ibar {cite:shadharat-dhahab, hlm. 544}."
