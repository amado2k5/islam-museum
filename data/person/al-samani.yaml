summary:
  ar: "الإمام أبو سعد تاج الإسلام عبد الكريم بن محمد بن منصور التميمي المروزي الشافعي، محدث المشرق وصاحب التصانيف؛ ولد بمرو الاثنين ٢١ شعبان ٥٠٦هـ، وطاف في طلب الحديث ثلاث رحلات كبرى بين خراسان والعراق والحجاز والشام وما وراء النهر حتى رُوي أن شيوخه بلغوا سبعة آلاف، ثم استقر بمرو مدرساً بالمدرسة العميدية، ومن كتبه [[work/al-ansab-samani|الأنساب]] في ثلاثمائة وخمسين طاقة لخصه ابن الأثير باسم اللباب ثم السيوطي باسم لب اللباب، و[[work/al-tahbir|التحبير في المعجم الكبير]]، والذيل على تاريخ بغداد، وتاريخ مرو، ومعجم البلدان؛ توفي بمرو الاثنين غرة ربيع الأول ٥٦٢هـ {cite:tarikh-islam-dhahabi pp. 118-123} {cite:encyclopaedia-of-islam-2 vol. 8 pp. 1024-1025} {cite:kashf-zunun-furqan p. 653}."
  en: "The imam Abu Sa'd Taj al-Islam 'Abd al-Karim ibn Muhammad al-Sam'ani al-Tamimi al-Marwazi al-Shafi'i, traditionist of the East; born at Marw on Monday 21 Sha'ban 506/10 February 1113, he made three great hadith journeys across Khurasan, Iraq, the Hijaz, al-Sham and Transoxiana — his teachers were said to number seven thousand — then settled at Marw teaching at the Amidiyya madrasa; author of [[work/al-ansab-samani|al-Ansab]] in 350 folios, epitomised by Ibn al-Athir as al-Lubab and by al-Suyuti as Lubb al-Lubab, of [[work/al-tahbir|al-Tahbir fi al-Mujam al-Kabir]], of a Dhayl to the Tarikh Baghdad and of Tarikh Marw and Mujam al-Buldan; he died at Marw on Monday 1 Rabi' I 562/26 December 1166 {cite:tarikh-islam-dhahabi pp. 118-123} {cite:encyclopaedia-of-islam-2 vol. 8 pp. 1024-1025} {cite:kashf-zunun-furqan p. 653}."
  ur: "امام ابو سعد تاج الاسلام عبدالکریم بن محمد سمعانی تمیمی مروزی شافعی، محدثِ مشرق اور صاحبِ تصانیف؛ مرو میں پیر کے روز 21 شعبان 506ھ/10 فروری 1113ء کو پیدا ہوئے، خراسان، عراق، حجاز، شام اور ماوراء النہر میں حدیث کی تین بڑی مسافرتیں کیں یہاں تک کہ ان کے مشائخ سات ہزار بتائے گئے، پھر مرو میں مدرسہ عمیدیہ میں تدریس پر مقیم ہوئے؛ ان کی تصانیف میں [[work/al-ansab-samani|الانساب]] ⁦(350 طاقہ)⁩ ہے جسے ابن الاثیر نے اللباب اور سیوطی نے لب اللباب کے نام سے مختصر کیا، [[work/al-tahbir|التحبیر فی المعجم الکبیر]]، تاریخ بغداد پر ذیل، تاریخ مرو اور معجم البلدان؛ مرو میں پیر کے روز غرۂ ربيع الاول 562ھ/26 دسمبر 1166ء کو وفات پائی {cite:tarikh-islam-dhahabi pp. 118-123} {cite:encyclopaedia-of-islam-2 vol. 8 pp. 1024-1025} {cite:kashf-zunun-furqan p. 653}۔"
