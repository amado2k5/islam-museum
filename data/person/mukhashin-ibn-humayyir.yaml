summary:
  ar: "من أشجع حليف لبني سلمة؛ كان في رهط من سخروا من جيش تبوك ثم اعتذروا، ويذكر ابن إسحاق أنه تسمى عبد الرحمن وسأل الله أن يقتل شهيداً لا يُعلم مكانه، فقُتل يوم اليمامة ولم يوجد له أثر."
  en: "Of Ashja', an ally of Banu Salama; he was in the party that mocked the Tabuk army then made their excuses. Ibn Ishaq records that he took the name Abd al-Rahman and asked God to let him die a martyr whose place is unknown — he was killed on the day of al-Yamama and no trace of him was found."
  es: "De Ashja', aliado de Banu Salama; formó parte del grupo que se burló del ejército de Tabuk y luego presentó sus excusas. Ibn Ishaq relata que adoptó el nombre de Abd al-Rahman y pidió a Dios que le permitiera morir como mártir, aunque se desconoce su paradero: fue asesinado el día de al-Yamama y no se encontró rastro de él."
  fr: "Ashja', allié des Banu Salama, faisait partie du groupe qui railla l'armée de Tabuk avant de se justifier. Ibn Ishaq rapporte qu'il prit le nom d'Abd al-Rahman et implora Dieu de lui accorder le martyre. Le lieu de sa mort demeure inconnu; il fut tué le jour d'al-Yamama et on ne retrouva aucune trace de lui."
