summary:
  ar: "تابعي من كندة، روى عن أبي الدرداء وعبادة بن الصامت وأبي سعيد الخدري وأبي عبد الله الصنابحي، وروى عنه إسماعيل بن عبيد الله بن أبي المهاجر وعمر بن عبد العزيز ويحيى بن يحيى الغساني وغيرهم؛ قال العجلي: شامي تابعي ثقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5157}."
  en: "A Successor from Kinda, who transmitted from Abu al-Darda, Ubada ibn al-Samit, Abu Said al-Khudri and Abu Abd Allah al-Sunabihi; al-Ijli called him a Syrian Successor and trustworthy {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5157}."
  es: "Un sucesor de Kinda, que transmitió de Abu al-Darda, Ubada ibn al-Samit, Abu Said al-Khudri y Abu Abd Allah al-Sunabihi; al-Ijli lo llamó un sucesor sirio y digno de confianza {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5157}."
  fr: "Un successeur de Kinda, qui a transmis d'Abu al-Darda, Ubada ibn al-Samit, Abu Said al-Khudri et Abu Abd Allah al-Sunabihi; al-Ijli l'a appelé un successeur syrien et digne de confiance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5157}."
  ur: "کندہ سے ایک جانشین، جس نے ابو الدرداء، عبادہ بن الصامت، ابو سعید الخدری اور ابو عبد اللہ السنابیحی سے نقل کیا؛ الاجلی نے اسے شامی جانشین اور قابل اعتماد کہا {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5157}۔"
