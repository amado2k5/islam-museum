summary:
  ar: "صاحب كتابي المغرب في حلى المغرب والمشرق في حلى المشرق؛ ولد يوم الثلاثاء الثاني والعشرين من شهر رمضان عام عشرة وستمائة من بيت علم وأدب ووزارة بقلعة عبد السلام، ورحل إلى المشرق وأجاز كتابه المغرب للقاضي أبي الفضل أحمد بن التيفاشي ولجمال الدين محمد بن أبي بكر ابن خطلخ الفارسي الأرموي {cite:nafh-tib-maqqari p. 333-335}."
  en: "Author of al-Mughrib fi hula al-Maghrib and its eastern companion; born Tuesday 22 Ramadan 610 into the scholarly wazir house of Alcala, he journeyed east and issued reading licences for the Mughrib to al-Tifashi and Ibn Khatlakh {cite:nafh-tib-maqqari p. 333-335}."
  es: "Autor de al-Mughrib fi hula al-Maghrib y su compañero oriental; nació el martes 22 de Ramadán de 610 en la casa erudita del visir de Alcalá, viajó hacia el este y otorgó licencias de lectura para el Mughrib a al-Tifashi e Ibn Khatlakh {cite:nafh-tib-maqqari p. 333-335}."
  fr: "Auteur d'al-Mughrib fi hula al-Maghrib et de son compagnon oriental; né le mardi 22 Ramadan 610 dans la maison du vizir savant d'Alcala, il voyagea vers l'est et délivra des licences de lecture pour le Mughrib à al-Tifashi et Ibn Khatlakh {cite:nafh-tib-maqqari p. 333-335}."
  ur: "المغرب فی حلا المغرب کے مصنف اور اس کے مشرقی ساتھی؛ منگل 22 رمضان 610 کو الکالہ کے علمی وزیر کے گھر میں پیدا ہوئے، اس نے مشرق کا سفر کیا اور الطائفشی اور ابن خطلخ کو مغرب کے لیے پڑھنے کا لائسنس جاری کیا۔ 333-335}۔"
