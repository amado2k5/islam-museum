summary:
  ar: "سحامة بن عبد الرحمن الأصم الغدني مؤذن الحجاج؛ ممن قاتل مع يزيد وكانت دار أبي يعقوب الخطابي بالبصرة له."
  en: "Sahama ibn Abd al-Rahman al-Asamm al-Ghudani, al-Hajjaj's muezzin, who fought with Yazid; the Basra house later known as Abu Ya'qub al-Khattabi's was his."
  es: "Sahama ibn Abd al-Rahman al-Asamm al-Ghudani, muecín de al-Hajjaj, que luchó con Yazid; la casa de Basora, más tarde conocida como la de Abu Ya'qub al-Khattabi, era suya."
  fr: "Sahama ibn Abd al-Rahman al-Asamm al-Ghudani, le muezzin d'al-Hajjaj, qui a combattu aux côtés de Yazid; la maison de Basra, connue plus tard sous le nom d'Abu Ya'qub al-Khattabi, était la sienne."
  ur: "سہامہ بن عبدالرحمن العصام الغدانی، الحجاج کا مؤذن، جو یزید سے لڑا؛ بصرہ کا گھر جو بعد میں ابو یعقوب الخطابی کے نام سے جانا جاتا تھا ان کا تھا۔"
  tr: "Sahama ibn Abd al-Rahman al-Asam al-Ghadni, el-Haccac'ın müezzini; Yezid'in yanında savaşanlar arasındaydı ve Ebu Ya'qub el-Hattabi'nin hanedanı onun için Basra'daydı."
  id: "Sahama ibn Abd al-Rahman al-Asam al-Ghadni, muezzin al-Hajjaj; ia termasuk di antara mereka yang bertempur bersama Yazid, dan rumah Abu Ya'qub al-Khattabi berada di Basra untuknya."
