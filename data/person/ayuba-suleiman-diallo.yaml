summary:
  ar: "أيوبا سليمان ديالو ⁦(نحو 1701–1773)⁩، المعروف عند الإنجليز باسم جوب بن سولومون، عالم فولاني من بوندو في السنغال، ابن كبير كهنتها؛ أُسر سنة 1730 وهو يبيع عبيدًا على نهر غامبيا، وبِيع إلى مزرعة تبغ في ماريلاند، فاكتُشف خطّه العربي، ووصلت رسالته إلى لندن فافتداه جيمس أوغلثورب، وقضى في لندن أربعة عشر شهرًا رُسمت فيها صورته وكتب فيها القرآن من حفظه، ثم عاد إلى بلاده سنة 1734. سيرته التي أملاها على توماس بلوت (1734) من أقدم سِيَر العبيد المطبوعة."
  en: "Ayuba Suleiman Diallo (c. 1701–1773), known in England as Job ben Solomon, was a Fulani scholar of Bundu in Senegal, son of its high priest. Captured in 1730 while selling slaves on the Gambia River, he was sold to a Maryland tobacco plantation; his Arabic writing was noticed, his letter reached London, and James Oglethorpe had him bought and freed. In fourteen months in London his portrait was painted and he copied the Qur'an from memory, before returning home in 1734. The life he dictated to Thomas Bluett (1734) is one of the earliest printed slave narratives."
  ur: "ایوبا سلیمان دیالو ⁦(تقریباً 1701ء–1773ء)⁩، جو انگلستان میں جاب بن سلیمان کے نام سے جانے گئے، سینیگال کے بوندو کے فولانی عالم اور وہاں کے بڑے پادری کے بیٹے تھے؛ 1730ء میں دریائے گیمبیا پر غلام بیچتے ہوئے خود پکڑے گئے اور میری لینڈ کے تمباکو کے باغ میں بیچے گئے؛ ان کی عربی تحریر دیکھی گئی، ان کا خط لندن پہنچا، اور جیمس اوگلتھورپ نے انھیں خرید کر آزاد کرایا۔ لندن کے چودہ مہینوں میں ان کی تصویر بنی اور انھوں نے یاداشت سے قرآن لکھا، پھر 1734ء میں وطن لوٹ گئے۔ تھامس بلوٹ کو املا کرائی گئی ان کی سوانح ⁦(1734ء)⁩ سب سے پہلی چھپی ہوئی غلام روایات میں سے ایک ہے۔"
