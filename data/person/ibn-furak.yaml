summary:
  ar: "الأستاذ أبو بكر محمد بن الحسن بن فورك الأصولي الأديب النحوي الواعظ الأصبهاني؛ أقام بالعراق يدرس ثم استوطن نيسابور فبُنيت له مدرسة ودار، وبلغت مصنفاته في أصول الفقه وأصول الدين ومعاني القرآن قريباً من مائة مصنف، ودُعي إلى غزنة فجرت له بها مناظرات كثيرة؛ وكان شديد الرد على أصحاب ابن كرام؛ ثم عاد إلى نيسابور فسُمّ في الطريق فمات ونُقل إليها ودُفن بالحنيرة، ويُستسقى بمشهده بظاهر بزار {cite:wafayat-ayan}."
  tr: "Profesör Ebu Bekir Muhammed bin el-Hasan ibn Furak, usuli âlimi, edebiyat dilbilgini, vaiz ve el-İsfahani; Irak'ta eğitim almak için yaşadı, ardından Nişapur'a yerleşti; burada kendisi için bir okul ve ev inşa edildi. Fıkıh ilkeleri, dinin temelleri ve Kur'an'ın anlamları üzerine yaptığı eserler neredeyse yüz esere ulaştı. Gazni'ye davet edildi, burada birçok tartışma çıktı; İbn Kerem'in sahabelerine karşı çok eleştireldi. Sonra Nişapur'a döndü, yolda öldü, öldü, oraya nakledildi ve El-Hunaira'ya defnedildi. Zahir Bazar'daki türbesinde yağmur isterdi {alıntı:wafayat-ayan}."
  id: "Profesor Abu Bakr Muhammad ibn al-Hasan ibn Furak, seorang ulama, ahli tata bahasa sastra, pengkhotbah, dan al-Isfahani; ia tinggal di Irak untuk belajar, lalu menetap di Nishapur, di mana sebuah sekolah dan rumah dibangun untuknya. Karya-karyanya tentang prinsip hukum, dasar-dasar agama, dan makna Al-Qur'an mencapai hampir seratus karya. Ia diundang ke Ghazni, di mana banyak perdebatan meletus terhadapnya; ia sangat kritis terhadap sahabat Ibn Karam. Ia kemudian kembali ke Nishapur, meninggal di jalan, meninggal, dipindahkan ke sana, dan dimakamkan di Al-Hunaira. Ia biasa mencari hujan di makamnya di Zahir Bazar {cite:wafayat-ayan}."
