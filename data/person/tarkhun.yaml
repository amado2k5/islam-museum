label: { ar: "طرخون ملك سمرقند", en: "Tarkhun, King of Samarqand", es: "Tarkhun, King of Samarqand", fr: "Tarkhun, King of Samarqand", ur: "ترخون، سمرقند کا بادشاہ" }
summary:
  ar: "طرخون ملك سمرقند؛ أكرم موسى بن عبد الله بن خازم لما أتاه فوثب رجل من أصحابه على رجل من السغد فقتله فأخرجه ومن معه."
  en: "Tarkhun, king of Samarqand; he honored Musa ibn Abdallah ibn Khazim until one of Musa's men killed a Sughdian, then expelled him and his company."
  es: "Tarkhun, rey de Samarcanda, honró a Musa ibn Abdallah ibn Khazim hasta que uno de los hombres de Musa mató a un sudiano, tras lo cual lo expulsó a él y a su compañía."
  fr: "Tarkhun, roi de Samarcande; il honora Musa ibn Abdallah ibn Khazim jusqu'à ce que l'un des hommes de Musa tue un Sughdien, puis l'expulsa avec sa compagnie."
  ur: "ترخون، سمرقند کا بادشاہ؛ اس نے موسیٰ بن عبداللہ ابن خزیم کی عزت کی یہاں تک کہ موسیٰ کے آدمیوں میں سے ایک نے ایک صغدی کو قتل کر دیا، پھر اسے اور اس کے ساتھی کو نکال دیا۔"
  tr: "Semerkant kralı Tarkhun; Musa ibn Abdullah ibn Hazım'a geldiğinde onu onurlandırdı ve yoldaşlarından biri Sogd'dan diğerine atladı, onu öldürdü ve ardından onu ve yanındakileri kovdu."
  id: "Tarkhun, raja Samarkand; ia menghormati Musa ibn Abdullah ibn Khazim ketika ia datang kepadanya, dan salah satu sahabatnya melompat ke atas raja lain dari Sogd, membunuhnya, lalu mengusirnya beserta yang bersamanya."
