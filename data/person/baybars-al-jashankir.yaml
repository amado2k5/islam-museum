id: person/baybars-al-jashankir
class: person
label: { ar: "الملك المظفر بيبرس الجاشنكير" }
summary:
  ar: "سلطان مملوكي، بويع بالسلطنة في الثالث والعشرين من شوال سنة ثمان وسبع مئة بعد كتاب الملك الناصر بعزل نفسه من الكرك وقلده الخليفة وألبسه الخلعة السوداء والعمامة المدورة ونفذ التقليد إلى الشام في كيس أطلس أسود فقرئ هناك وأوله إنه من سليمان وإنه بسم الله الرحمن الرحيم، ثم عاد الملك الناصر في رجب سنة تسع يطلب عوده إلى الملك ففر بيبرس في جماعة من أصحابه ثم أمسك وقتل من عامه {cite:tarikh-khulafa-minhaj-1434 p. 734}."
  en: "Mamluk sultan as al-Muzaffar, hailed on al-Nasir's self-deposition in 708 with the caliph's black robe and a deed borne to Syria in black satin — opening 'It is from Sulayman'. On al-Nasir's return he fled, was caught and killed {cite:tarikh-khulafa-minhaj-1434 p. 734}."
  es: "El sultán mameluco al-Muzaffar fue aclamado tras la abdicación de al-Nasir en 708 con la túnica negra del califa y un documento enviado a Siria en satén negro, que comenzaba con la inscripción \"Es de Sulayman\". A su regreso, al-Nasir huyó, fue capturado y asesinado {cite:tarikh-khulafa-minhaj-1434 p. 734}."
  fr: "Le sultan mamelouk al-Muzaffar fut salué lors de la déposition d'al-Nasir en 708 avec la robe noire du calife et un acte de donation à la Syrie en satin noir, portant l'inscription « Il vient de Sulayman ». À son retour, al-Nasir s'enfuit, fut capturé et tué (voir: Tarikh-Khulafa-Minhaj-1434, p. 734)."
  ur: "مملوک سلطان بحیثیت المظفر، 708 میں خلیفہ کے سیاہ لباس اور سیاہ ساٹن میں شام کے لیے ایک عمل کے ساتھ الناصر کی خود کشی کی تعریف کرتا تھا - جس کا آغاز 'یہ سلیمان کی طرف سے ہے'۔ النصیر کی واپسی پر وہ فرار ہو گیا، پکڑا گیا اور قتل کر دیا گیا۔ 734}۔"
