label: { ar: "الملك المظفر بيبرس الجاشنكير" }
summary:
  ar: "سلطان مملوكي، بويع بالسلطنة في الثالث والعشرين من شوال سنة ثمان وسبع مئة بعد كتاب الملك الناصر بعزل نفسه من الكرك وقلده الخليفة وألبسه الخلعة السوداء والعمامة المدورة ونفذ التقليد إلى الشام في كيس أطلس أسود فقرئ هناك وأوله إنه من سليمان وإنه بسم الله الرحمن الرحيم، ثم عاد الملك الناصر في رجب سنة تسع يطلب عوده إلى الملك ففر بيبرس في جماعة من أصحابه ثم أمسك وقتل من عامه {cite:tarikh-khulafa-minhaj-1434 p. 734}."
  en: "Mamluk sultan as al-Muzaffar, hailed on al-Nasir's self-deposition in 708 with the caliph's black robe and a deed borne to Syria in black satin — opening 'It is from Sulayman'. On al-Nasir's return he fled, was caught and killed {cite:tarikh-khulafa-minhaj-1434 p. 734}."
