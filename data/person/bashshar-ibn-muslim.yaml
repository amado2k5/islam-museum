summary:
  ar: "بشار بن مسلم بن عمرو الباهلي أخو قتيبة؛ أهدى إلى الحجاج فرساً فسبق عليه فأقطعه سبعمائة جريب ويقال أربعمائة جريب فحفر لها النهر الذي يعرف بنهر بشار."
  en: "Bashshar ibn Muslim ibn Amr al-Bahili, Qutayba's brother; he gifted al-Hajjaj a horse that won him the race — the grant was seven hundred jarib (some say four hundred) for which he dug the canal named Nahr Bashshar."
  es: "Bashshar ibn Muslim ibn Amr al-Bahili, hermano de Qutayba, le regaló a al-Hajjaj un caballo con el que ganó la carrera. La donación fue de setecientos jarib (algunos dicen cuatrocientos), por lo que excavó el canal llamado Nahr Bashshar."
  fr: "Bashshar ibn Muslim ibn Amr al-Bahili, le frère de Qutayba; il offrit à al-Hajjaj un cheval qui lui permit de gagner la course — la donation était de sept cents jaribs (certains disent quatre cents) pour lesquels il creusa le canal nommé Nahr Bashshar."
  ur: "بشر بن مسلم بن عمرو الباہلی، قتیبہ کے بھائی؛ اس نے الحجاج کو ایک گھوڑا تحفہ میں دیا جس نے اس کی ریس جیتی - یہ گرانٹ سات سو جریب تھی ⁦(کچھ کہتے ہیں چار سو)⁩ جس کے لیے اس نے نہر بشار نامی نہر کھودی۔"
  tr: "Beytar bin Müslim bin Amr el-Bahili, Qutaybah'ın kardeşi; el-Hacac'a bir at hediye etti, fakat o ondan önce geldi, bu yüzden onu yedi yüz ceribe kesti ve denir ki dört yüz cerib, bunun için Beşar Nehri olarak bilinen nehri kazdı."
  id: "Bashar ibn Muslim ibn Amr al-Bahili, saudara Qutaybah; ia menghadiahkan seekor kuda kepada al-Hajjaj, tetapi ia mendahuluinya, sehingga ia memotongnya menjadi tujuh ratus jerib, dan dikatakan empat ratus jerib, sehingga ia menggali sungai yang dikenal sebagai Sungai Bashar untuk itu."
