label: { ar: "ابن رشد الجد" }
names:
  - { value: "أبو الوليد محمد بن أحمد بن رشد المالكي القرطبي", kind: full }
summary:
  ar: "قاضي الجماعة بقرطبة وإمام المالكية في وقته؛ كان عالي الإسناد بالأندلس أوعية العلم له تصانيف مشهورة، عاش سبعين سنة وتوفي نحو سنة عشرين وخمسمائة، وهو جد الفقيه ابن رشد الحفيد {cite:shadharat-dhahab p. 540}."
  en: "Abu al-Walid Ibn Rushd 'al-Jadd' — Cordoba's chief Maliki qadi, high-chained hadith vessel and author; lived seventy years and died around 520; grandfather of Ibn Rushd the grandson {cite:shadharat-dhahab p. 540}."
  es: "Abu al-Walid Ibn Rushd 'al-Jadd' — cadí malikí principal de Córdoba, transmisor de hadices de alta cadena y autor; vivió setenta años y murió alrededor del 520; abuelo de Ibn Rushd, su nieto {cita: shadharat-dhahab p. 540}."
  fr: "Abu al-Walid Ibn Rushd 'al-Jadd' — cadi malikite en chef de Cordoue, haut dignitaire du hadith et auteur; vécut soixante-dix ans et mourut vers 520; grand-père d'Ibn Rushd le petit-fils {cite:shadharat-dhahab p. 540}."
  ur: "ابو الولید ابن رشد 'الجد' - قرطبہ کے سربراہ مالکی قاضی، اونچی زنجیروں والا حدیث کا برتن اور مصنف؛ ستر سال زندہ رہے اور 520 کے لگ بھگ فوت ہوئے۔ ابن رشد کے دادا پوتا 540}۔"
  tr: "Kendi döneminde Cordoba'daki cemaatin yargıcı ve Malikis imamı idi; Endülüs'te çok saygı gören ve bilgi kaynağıydı. Ünlü eserleri vardı. Yetmiş yıl yaşadı ve yaklaşık 520 yılında öldü. Hukukçu İbn Rüşd'ün torunu büyükbabasıydı {atıf:shadharat-dhahab, s. 540}."
  id: "Ia adalah hakim komunitas di Cordoba dan Imam Malikis pada masanya; ia sangat dihormati di al-Andalus dan sumber pengetahuan. Ia memiliki karya-karya terkenal. Ia hidup tujuh puluh tahun dan meninggal sekitar tahun 520. Ia adalah kakek dari ahli hukum Ibn Rushd, cucu {cite:shadharat-dhahab, hlm. 540}."
