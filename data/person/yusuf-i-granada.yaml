  ur: "1333 سے لے کر 1354 میں اس کے قتل تک غرناطہ کے ساتویں نصری سلطان ابو الحجاج یوسف اول کے لیے ڈرافٹ کارڈ، یہ دور تعمیر اور سیکھنے کے لیے مشہور ہے۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "1333 yılından 1354'te suikasta uğramasına kadar Granada'da yedinci Nasr sultanı olan Abu al-Hajcaj Yusuf I'in ön kartı; saltanatı inşa ve bilgi olarak tanınır; Endülüs tarihine dair kaynaklarda adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Abu al-Hajjaj Yusuf I, sultan Nasr ketujuh di Granada dari tahun 1333 M hingga pembunuhannya pada tahun 1354 M, dikenal karena pemerintahannya sebagai bangunan dan pengetahuan; ia disebutkan dalam sumber sejarah Andalusia dan biografinya belum pernah ditinjau di halaman tersebut."
