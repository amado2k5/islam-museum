  ar: "بطاقة أولية لأبي الحجاج يوسف الأول، سابع سلاطين بني نصر في غرناطة من ١٣٣٣م حتى اغتياله سنة ١٣٥٤م وعرف عهده بالبناء والعلم؛ تذكره مصادر تاريخ الأندلس ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu'l-Hajjaj Yusuf I, seventh Nasrid sultan of Granada from 1333 until his assassination in 1354, a reign noted for building and learning; the source entry is not yet checked on the page."
