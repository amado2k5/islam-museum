summary:
  ar: "من أصحاب أبي مسلم، لما سرح إليه المنصور جريراً البجلي يسترده نهاه مالك عن الرجوع فقال له أبو مسلم ويلك لقد بليت بإبليس وما بليت بمثل هذا قط يعني الجريري {cite:muruj-al-dhahab p. 280}."
  en: "Abu Muslim's man who saw through Jarir's mission — 'do not go back' — overridden by the caliph's envoy {cite:muruj-al-dhahab p. 280}."
  es: "El hombre de Abu Muslim que comprendió la misión de Jarir —'no regresen'— fue desautorizado por el enviado del califa {cite:muruj-al-dhahab p. 280}."
  fr: "L'homme d'Abu Muslim qui a percé à jour la mission de Jarir — « ne retournez pas » — a été annulé par l'envoyé du calife {cite:muruj-al-dhahab p. 280}."
  ur: "ابو مسلم کا آدمی جس نے جریر کے مشن کے ذریعے دیکھا تھا - 'واپس مت جاؤ' - خلیفہ کے ایلچی کے ذریعہ زیر کر دیا گیا {حوالہ: مروج الذہاب ص۔ 280}۔"
  tr: "Ebu Müslim'in yoldaşlarından al-Mansur Jarira al-Bajali ona döndüğünde, Malik onun dönmesini yasakladı, bunun üzerine Ebu Müslim ona, 'Vay haline! İblis ile uğraştın ve hiç böyle bir şeyle uğramadın.' dedi. Yani, el-Ceriri {atıf:muruj-al-dhahab, s. 280}."
  id: "Dari para sahabat Abu Muslim, ketika al-Mansur Jarira al-Bajali kembali kepadanya, Malik melarangnya kembali, sehingga Abu Muslim berkata kepadanya, 'Celakalah kamu! Engkau telah menderita Iblis, dan tidak pernah menderita sesuatu seperti ini.' Maksudnya, al-Jariri {cite:muruj-al-dhahab, hlm. 280}."
