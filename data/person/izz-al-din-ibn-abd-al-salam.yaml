id: person/izz-al-din-ibn-abd-al-salam
class: person
label: { ar: "الشيخ عز الدين بن عبد السلام" }
summary:
  ar: "سلطان العلماء، ولى خطابة دمشق سنة سبع وثلاثين فخطب خطبة عرية من البدع وأزال الأعلام المذهبة وأقام عوضها سوداً بأبيض ولم يؤذن قدامه سوى مؤذن واحد، ولما نزل التتار على آمد وجمع قطز الأمراء قال إذا طرق العدو البلاد وجب على العالم كلهم قتالهم وجاز أن يؤخذ من الرعية ما يستعان به بشرط ألا يبقى في بيت المال شيء وأن تبيعوا ما لكم من الحوائص والآلات ويقتصر كل منكم على فرسه وسلاحه وأما أخذ أموال العامة مع بقاء ما في أيدي الجند فلا {cite:tarikh-khulafa-minhaj-1434 p. 705,719-720}."
  en: "The sultan of scholars; Damascus's khatib who stripped the gilded banners for plain black-on-white and cut the muezzins to one. When the Tatars neared he ruled: all the world must fight them, the people's wealth may be taken for their arming only if the amirs first sell their own luxuries — 'taking the commons' money while the soldiers' finery remains: no' {cite:tarikh-khulafa-minhaj-1434 p. 705,719-720}."
  es: "El sultán de los eruditos; el khatib de Damasco que despojó los estandartes dorados por simples estandartes blancos y negros y redujo el número de muecines a uno solo. Cuando los tártaros se acercaban, dictaminó: todo el mundo debe luchar contra ellos, la riqueza del pueblo solo podrá ser tomada para su armamento si los emires primero venden sus propios lujos: «tomar el dinero del pueblo mientras se conservan los lujos de los soldados: no» {cite:tarikh-khulafa-minhaj-1434 p. 705,719-720}."
  fr: "Le sultan des érudits; le khatib de Damas qui remplaça les bannières dorées par des bannières noires sur fond blanc et réduisit le nombre de muezzins à un seul. À l'approche des Tatars, il décréta: le monde entier devait les combattre; les richesses du peuple ne pouvaient être réquisitionnées pour leur armement que si les émirs vendaient d'abord leurs propres biens de luxe – « prendre l'argent du peuple » alors que les parures des soldats restaient intactes: non ! {cite:tarikh-khulafa-minhaj-1434 p. 705,719-720}."
