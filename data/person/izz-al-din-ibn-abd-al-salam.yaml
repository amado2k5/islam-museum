label: { ar: "الشيخ عز الدين بن عبد السلام" }
summary:
  ar: "سلطان العلماء، ولى خطابة دمشق سنة سبع وثلاثين فخطب خطبة عرية من البدع وأزال الأعلام المذهبة وأقام عوضها سوداً بأبيض ولم يؤذن قدامه سوى مؤذن واحد، ولما نزل التتار على آمد وجمع قطز الأمراء قال إذا طرق العدو البلاد وجب على العالم كلهم قتالهم وجاز أن يؤخذ من الرعية ما يستعان به بشرط ألا يبقى في بيت المال شيء وأن تبيعوا ما لكم من الحوائص والآلات ويقتصر كل منكم على فرسه وسلاحه وأما أخذ أموال العامة مع بقاء ما في أيدي الجند فلا {cite:tarikh-khulafa-minhaj-1434 p. 705,719-720}."
  en: "The sultan of scholars; Damascus's khatib who stripped the gilded banners for plain black-on-white and cut the muezzins to one. When the Tatars neared he ruled: all the world must fight them, the people's wealth may be taken for their arming only if the amirs first sell their own luxuries — 'taking the commons' money while the soldiers' finery remains: no' {cite:tarikh-khulafa-minhaj-1434 p. 705,719-720}."
