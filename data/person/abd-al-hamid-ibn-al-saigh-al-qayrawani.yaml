summary:
  ar: "فقيه مالكي من القيروان، تفقه بأبي حفص العطار وابن محرز وأبي إسحاق التونسي وأبي الطيب الكندي وغيرهم، وتفقه به المازري المهدوي وأبو علي حسان البربري وأبو الحسن الحوفي وأبو بكر ابن عطية وغيرهم، وله تعليق معروف على المدونة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5138}"
  en: "A Maliki jurist of Qayrawan who studied with Abu Hafs al-Attar, Ibn Mahriz, Abu Ishaq al-Tunisi and Abu al-Tayyib al-Kindi and others. Among those who studied with him were al-Mazari al-Mahdawi, Abu Ali Hassan al-Barbari, Abu al-Hasan al-Huwfi and Abu Bakr Ibn Atiyya. He wrote a known commentary on the Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5138}"
  fr: "Juriste malikite de Kairouan qui étudia auprès d'Abu Hafs al-Attar, d'Ibn Mahriz, d'Abu Ishaq al-Tunisi, d'Abu al-Tayyib al-Kindi et d'autres. Parmi ceux qui étudièrent auprès de lui figurent al-Mazari al-Mahdawi, Abu Ali Hassan al-Barbari, Abu al-Hasan al-Huwfi et Abu Bakr Ibn Atiyya. Il écrivit un commentaire connu de la Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5138}"
  es: "Un jurista Maliki de Qayrawan que estudió con Abu Hafs al-Attar, Ibn Mahriz, Abu Ishaq al-Tunisi y Abu al-Tayyib al-Kindi y otros. Entre los que estudiaron con él se encontraban al-Mazari al-Mahdawi, Abu Ali Hassan al-Barbari, Abu al-Hasan al-Huwfi y Abu Bakr Ibn Atiyya. Escribió un conocido comentario sobre el Mudawwana. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5138}"
  ur: "قیروان کا ایک مالکی فقیہ جس نے ابو حفص العطار، ابن محریز، ابو اسحاق التونسی اور ابو الطیب الکندی اور دیگر سے تعلیم حاصل کی۔ ان کے ساتھ تعلیم حاصل کرنے والوں میں المزاری المہدوی، ابو علی حسن البرباری، ابو الحسن الحوفی اور ابوبکر ابن عطیہ شامل تھے۔ اس نے مدوانہ کی ایک معروف تفسیر لکھی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 5138}"
  tr: "Kairouan'dan bir Maliki hukukçusu olan kendisi, Ebu Hafs el-Attar, İbn Muhriz, Ebu İshak el-Tunisi, Ebu el-Tayyib el-Kindi ve diğerlerinden eğitim aldı. Öğrencileri arasında el-Mezari el-Mahdavi, Ebu Ali Hasan el-Barbari, Ebu el-Hasan el-Hawfi, Ebu Bekir İbn Atiyya ve diğerleri vardı. Müdevvene şerhleriyle tanınır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5138}"
  id: "Seorang ahli hukum Maliki dari Kairouan, ia belajar di bawah bimbingan Abu Hafs al-Attar, Ibnu Muhriz, Abu Ishaq al-Tunisi, Abu al-Tayyib al-Kindi, dan lain-lain. Murid-muridnya antara lain al-Mazari al-Mahdawi, Abu Ali Hassan al-Barbari, Abu al-Hassan al-Hawfi, Abu Bakar Ibnu Atiyya, dan lain-lain. Ia dikenal karena komentarnya tentang Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.5138}"
