summary:
  ar: "فقيه مالكي من القيروان، تفقه بأبي حفص العطار وابن محرز وأبي إسحاق التونسي وأبي الطيب الكندي وغيرهم، وتفقه به المازري المهدوي وأبو علي حسان البربري وأبو الحسن الحوفي وأبو بكر ابن عطية وغيرهم، وله تعليق معروف على المدونة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5138}"
  en: "A Maliki jurist of Qayrawan who studied with Abu Hafs al-Attar, Ibn Mahriz, Abu Ishaq al-Tunisi and Abu al-Tayyib al-Kindi and others. Among those who studied with him were al-Mazari al-Mahdawi, Abu Ali Hassan al-Barbari, Abu al-Hasan al-Huwfi and Abu Bakr Ibn Atiyya. He wrote a known commentary on the Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5138}"
