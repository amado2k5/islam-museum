summary:
  ar: "لو تاك كوانغ (وُلد في 17 نيسان 1948 في سنغافورة) رجل أعمال إندونيسي، مؤسس ورئيس مجلس إدارة بايان ريسورسز، إحدى أكبر شركات تعدين الفحم في إندونيسيا؛ عمل مراهقًا في شركة بناء أبيه في سنغافورة، وانتقل إلى إندونيسيا سنة 1972 وأسس شركة إنشاءات سنة 1973، ونال الجنسية الإندونيسية سنة 1992، واشترى أول منجم فحم سنة 1997، وصنفته فوربس ثالث أغنى شخص في إندونيسيا."
  en: "Low Tuck Kwong (born 17 April 1948 in Singapore) is an Indonesian businessman, founder and president director of Bayan Resources, one of Indonesia's largest coal-mining companies; he worked as a teenager at his father's Singapore construction company, moved to Indonesia in 1972 and founded a construction firm in 1973, took Indonesian citizenship in 1992, bought his first coal mine in 1997, and is ranked by Forbes as Indonesia's third-richest person."
  ur: "لو ٹک کوانگ (پیدائش 17 اپریل 1948، سنگاپور) انڈونیشیائی کاروباری ہیں، بیان ریسورسز کے بانی و صدر ڈائریکٹر، جو انڈونیشیا کی سب سے بڑی کوئلہ کان کنی کمپنیوں میں سے ایک ہے؛ نوعمری میں انھوں نے سنگاپور میں اپنے والد کی تعمیراتی کمپنی میں کام کیا، 1972 میں انڈونیشیا منتقل ہوئے، 1992 میں انڈونیشیائی شہریت لی، 1997 میں پہلی کوئلے کی کان خریدی، اور فوربز نے انھیں انڈونیشیا کا تیسرا امیر ترین شخص قرار دیا۔"
