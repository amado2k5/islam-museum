summary:
  ar: "صاحب الرسالة القشيرية؛ ممن أضافهم عميد الملك الكندري إلى الرافضة في اللعن على منابر خراسان ففارق خراسان مع أئمتها ثم أكرمه نظام الملك لما جاءت دولته {cite:shadharat-dhahab p. 310}. وعند ابن الجوزي ولد سنة ست وسبعين وثلثمائة وتوفي أبوه وهو طفل، ولزم أبا علي الدقاق فجذبه عن مخالطة أهل الدنيا، وأخذ الكلام عن ابن فورك فصار رأس الأشاعرة، وصنّف التفسير الكبير، وخرج إلى الحج في رفقة فيها الجويني والبيهقي؛ وتوفي في رجب سنة خمس وستين وأربعمائة بنيسابور ودُفن إلى جانب شيخه أبي علي الدقاق، ولم يدخل أحد من أولاده بيته ولا مس ثيابه ولا كتبه إلا بعد سنين احتراماً له وتعظيماً، ومن عجيب ما وقع أن الفرس التي كان يركبها ركبها عشرين سنة فلم تُعلف بعد وفاته وتلفت بعد أسبوع {cite:muntazam-ibn-al-jawzi j.8 p.646-647}."
  en: "The Qushayri of the Risala — among the imams al-Kunduri drove from Khurasan by lumping the Ash'aris with the Rafida on the minbars, and whom Nizam al-Mulk's reign restored {cite:shadharat-dhahab p. 310}."
