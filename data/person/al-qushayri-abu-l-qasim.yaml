summary:
  ar: "الإمام أبو القاسم عبد الكريم بن هوازن القشيري النيسابوري، شيخ خراسان ومقدّم الطائفة وصاحب «الرسالة القشيرية» أشهر متون التصوف؛ من أستوا، تربى على الأدب والفروسية، فلما دخل نيسابور لشأن ضيعته وقع في مجلس أبي علي الدقاق فلزمه وتزوج ابنته، وأخذ الفقه عن أبي بكر الطوسي والكلام عن ابن فورك وأبي إسحاق الإسفرائيني حتى صار رأس الأشاعرة؛ صنّف «التفسير الكبير» قبل سنة ٤١٠هـ وكتب «شكاية أهل السنة» في محنة لعن الأشاعرة على المنابر، فنُفي وسجن وحجّ مع أهل العلم، ثم عاد إلى نيسابور في دولة نظام الملك وتوفي بها سنة ٤٦٥هـ ودُفن في مدرسته إلى جانب أبي علي الدقاق {cite:encyclopaedia-of-islam-2 vol. 5 pp. 564-565} {cite:tarikh-islam-dhahabi pp. 170-176}."
  en: "Abu al-Qasim Abd al-Karim ibn Hawazin al-Qushayri of Nishapur — shaykh of Khurasan, head of the Sufi community and author of the Risala, the most famous manual of Sufism; raised at Ustuwa on letters and horsemanship, he entered Nishapur on a tax errand and fell into Abu Ali al-Daqqaq's circle, married his daughter, and took law from Abu Bakr al-Tusi and kalam from Ibn Furak and Abu Ishaq al-Isfarayini until he stood at the head of the Ash'aris; he wrote his great tafsir before 410/1019, penned the 'Complaint of the people of the Sunna' through the pulpit-cursing ordeal, was imprisoned, exiled and made the Pilgrimage with the scholars, then returned to Nishapur under Nizam al-Mulk and died there in 465/1072, buried in his own madrasa beside Abu Ali al-Daqqaq {cite:encyclopaedia-of-islam-2 vol. 5 pp. 564-565} {cite:tarikh-islam-dhahabi pp. 170-176}."
  ur: "نیشاپور کے امام ابو القاسم عبد الکریم بن ہوازن قشیری — شیخِ خراسان، طائفۂ صوفیہ کے پیشوا اور «رسالہ قشیریہ» کے مصنف جو تصوف کی مشہور ترین متون میں ہے؛ استوا میں ادب اور فروسیت کی تربیت پائی، ایک مالیاتی معاملے پر نیشاپور آئے تو ابو علی دقاق کے مجلس سے جُڑ گئے، ان کی بیٹی سے شادی کی، ابو بکر طوسی سے فقہ اور ابن فورک و ابو اسحاق اسفرائینی سے علمِ کلام پڑھا یہاں تک کہ اشاعرہ کے سرکردہ ہو گئے؛ انھوں نے 410ھ/1019ء سے پہلا اپنا بڑا تفسیری کارنامہ لکھا، منبروں پر لعن کی محنت میں «شکایت اہلِ سنت» تصنیف کی، قید و جلاوطنی سہی اور علماء کے ساتھ حج کیا، پھر نظام الملک کے دور میں نیشاپور لوٹے اور 465ھ/1072ء میں وہیں فوت ہوئے اور اپنی مدرسہ میں ابو علی دقاق کے پہلو میں دفن ہوئے {cite:encyclopaedia-of-islam-2 vol. 5 pp. 564-565} {cite:tarikh-islam-dhahabi pp. 170-176}۔"
