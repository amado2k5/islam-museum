summary:
  ar: "الإمام أبو القاسم عبد الكريم بن هوازن القشيري النيسابوري، شيخ خراسان ومقدّم الطائفة وصاحب «الرسالة القشيرية» أشهر متون التصوف؛ من أستوا، تربى على الأدب والفروسية، فلما دخل نيسابور لشأن ضيعته وقع في مجلس أبي علي الدقاق فلزمه وتزوج ابنته، وأخذ الفقه عن أبي بكر الطوسي والكلام عن ابن فورك وأبي إسحاق الإسفرائيني حتى صار رأس الأشاعرة؛ صنّف «التفسير الكبير» قبل سنة ٤١٠هـ وكتب «شكاية أهل السنة» في محنة لعن الأشاعرة على المنابر، فنُفي وسجن وحجّ مع أهل العلم، ثم عاد إلى نيسابور في دولة نظام الملك وتوفي بها سنة ٤٦٥هـ ودُفن في مدرسته إلى جانب أبي علي الدقاق {cite:encyclopaedia-of-islam-2 vol. 5 pp. 564-565} {cite:tarikh-islam-dhahabi pp. 170-176}."
  en: "Abu al-Qasim Abd al-Karim ibn Hawazin al-Qushayri of Nishapur — shaykh of Khurasan, head of the Sufi community and author of the Risala, the most famous manual of Sufism; raised at Ustuwa on letters and horsemanship, he entered Nishapur on a tax errand and fell into Abu Ali al-Daqqaq's circle, married his daughter, and took law from Abu Bakr al-Tusi and kalam from Ibn Furak and Abu Ishaq al-Isfarayini until he stood at the head of the Ash'aris; he wrote his great tafsir before 410/1019, penned the 'Complaint of the people of the Sunna' through the pulpit-cursing ordeal, was imprisoned, exiled and made the Pilgrimage with the scholars, then returned to Nishapur under Nizam al-Mulk and died there in 465/1072, buried in his own madrasa beside Abu Ali al-Daqqaq {cite:encyclopaedia-of-islam-2 vol. 5 pp. 564-565} {cite:tarikh-islam-dhahabi pp. 170-176}."
  fr: "Abu al-Qasim Abd al-Karim ibn Hawazin al-Qushayri de Nichapour – cheikh du Khurasan, chef de la communauté soufie et auteur du Risala, le manuel le plus célèbre du soufisme ; Élevé à Ustuwa sur lettres et chevalerie, il entra à Nichapour pour une course d'impôts et tomba dans le cercle d'Abou Ali al-Daqqaq, épousa sa fille, et prit la loi d'Abou Bakr al-Tusi et le kalam d'Ibn Furak et d'Abou Ishaq al-Isfarayini jusqu'à ce qu'il se tienne à la tête des Ash'aris ; Il a écrit son grand tafsir avant 410/1019, écrit la « plainte du peuple de la Sunna » à travers l'épreuve de la malédiction en chaire, a été emprisonné, exilé et a fait le pèlerinage avec les savants, puis est retourné à Nichapour sous Nizam al-Mulk et y est mort en 465/1072, enterré dans sa propre madrasa à côté d'Abu Ali al-Daqqaq {cite:encyclopaedia-of-islam-2 vol. 5 pp. 564-565} {cite:tarikh-islam-dhahabi pp. 170-176}."
  ur: "نیشاپور کے امام ابو القاسم عبد الکریم بن ہوازن قشیری — شیخِ خراسان، طائفۂ صوفیہ کے پیشوا اور «رسالہ قشیریہ» کے مصنف جو تصوف کی مشہور ترین متون میں ہے؛ استوا میں ادب اور فروسیت کی تربیت پائی، ایک مالیاتی معاملے پر نیشاپور آئے تو ابو علی دقاق کے مجلس سے جُڑ گئے، ان کی بیٹی سے شادی کی، ابو بکر طوسی سے فقہ اور ابن فورک و ابو اسحاق اسفرائینی سے علمِ کلام پڑھا یہاں تک کہ اشاعرہ کے سرکردہ ہو گئے؛ انھوں نے 410ھ/1019ء سے پہلا اپنا بڑا تفسیری کارنامہ لکھا، منبروں پر لعن کی محنت میں «شکایت اہلِ سنت» تصنیف کی، قید و جلاوطنی سہی اور علماء کے ساتھ حج کیا، پھر نظام الملک کے دور میں نیشاپور لوٹے اور 465ھ/1072ء میں وہیں فوت ہوئے اور اپنی مدرسہ میں ابو علی دقاق کے پہلو میں دفن ہوئے {cite:encyclopaedia-of-islam-2 vol. 5 pp. 564-565} {cite:tarikh-islam-dhahabi pp. 170-176}۔"
  es: "Abu al-Qasim Abd al-Karim ibn Hawazin al-Qushayri de Nishapur, shaykh de Jorasán, líder de la comunidad sufí y autor de la Risala, el manual más famoso del sufismo; criado en Ustuwa en letras y equitación, entró en Nishapur para realizar un encargo tributario y se unió al círculo de Abu Ali al-Daqqaq, se casó con su hija y estudió derecho con Abu Bakr al-Tusi y kalam con Ibn Furak y Abu Ishaq al-Isfarayini hasta que se situó a la cabeza de los Ash'aris; Escribió su gran tafsir antes de 410/1019, redactó la 'Queja de la gente de la Sunna' a través de la prueba de maldiciones desde el púlpito, fue encarcelado, exiliado y realizó la peregrinación con los eruditos, luego regresó a Nishapur bajo Nizam al-Mulk y murió allí en 465/1072, enterrado en su propia madrasa junto a Abu Ali al-Daqqaq {cite:encyclopaedia-of-islam-2 vol. 5 pp. 564-565} {cite:tarikh-islam-dhahabi pp. 170-176}."
  tr: "İmam Ebu el-Kasım Abdülkerim bin Hawazin el-Kuşayri el-Naysaburi, mezhebin Şeyhi, mezhebin lideri ve 'El-Risala el-Kuşayriyya'nın yazarıdır., en ünlü Sufi metinlerinden biridir; edebiyat ve şövalyelik alanında eğitim almış ve yetiştirilmiştir. Mülkünün işleri nedeniyle Nişapur'a girdiğinde, kendisine katılan Ebu Ali el-Daqqak'ın sarayına girdi; Ebu Ali el-Daqqak ona katıldı, kızını evlendirdi ve Ebu Bekir el-Tusi'nin yanında ayrıca İbn Furak ve Ebu İshaq el-İsfarayni'den fıkıh aldı, ta ki Aş'arilerin başı olana kadar. 410 Hicri öncesinde 'El-Tafsir' el-Kabir'i yazdı ve Aş'arileri kürsüden lanetleme sıkıntısı sırasında sürgün, hapis ve hac yolculuğuna yol açan sıkıntılar sırasında 'Şikayet Ahl al-Sunnah'ı yazdı. alimlerle birlikte, ardından Nizam al-Mulk'un saltanatı sırasında Nişapur'a döndü, burada 465 Hicri'de öldü ve okulunda Ebu Ali el-Daqqak ile birlikte defnedildi {cite:Encyclopaedia-of-Islam-2 cilt 5 s. 564-565} {cite:Tarikh-Islam-dhahabi s. 170-176}."
  id: "Imam Abu al-Qasim Abd al-Karim ibn Hawazin al-Qushayri al-Naysaburi, Sheikh Khorasan, pemimpin sekte dan penulis 'Al-Risala al-Qushayriyya,' salah satu teks Sufi paling terkenal; ia dididik dan dibesarkan dalam sastra dan kesatria. Ketika ia masuk Nishapur karena urusan hartanya, ia jatuh ke istana Abu Ali al-Daqqaq, yang bergabung dengannya, menikahi putrinya, dan belajar hukum di bawah Abu Bakr al-Tusi, serta dari Ibn Furak dan Abu Ishaq al-Isfarayni, hingga ia menjadi kepala Ash'ari. Ia menulis 'Al-Tafsir al-Kabir' sebelum tahun 410 H dan menulis 'Shikayat Ahl al-Sunnah' selama masa kesulitan mengutuk Ash'ari dari mimbar, yang mengakibatkan pengasingan, penahanan, dan ziarah. bersama para cendekiawan, kemudian kembali ke Nishapur selama masa pemerintahan Nizam al-Mulk, di mana ia wafat pada tahun 465 H dan dimakamkan di sekolahnya bersama Abu Ali al-Daqqaq {cite:Encyclopaedia-of-Islam-2 vol. 5 hlm. 564-565} {cite:Tarikh-Islam-dhahabi hlm. 170-176}."
