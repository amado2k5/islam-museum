summary:
  ar: "جلال الدين الحلي التفتازاني البغدادي الإمام الأوحد صاحب الماس النظار وصاحب العلوم الأظهر والمتبحر في كل فن الذي لم يزل يتفنن بالتمام؛ ولد سنة إحدى وثمانمائة تقريباً بأرض الحلة وقرأ بها القرآن وحفظ كتباً في الفقه والنحو والأصول وأخذ عن الشيخ جلال الدين الحلي والشيخ أبي المجد كمال الدين بن نصرت ثم ارتحل إلى خراسان فأخذ عن الشيخ شمس الدين ابن الرازي السمعاني وتبع أصول الدين بن القوشجي وسعد الدين التفتازاني ثم عاد إلى بغداد فباشر التدريس بها في عدة مدارس وولي مشيخة بغداد في مدرسة المنصورية وأقرأ فيها الكثير وإليه انتهت الرياسة بالعراق بعد الاستوثاقات وأخذ عنه العلامة جلال الدين بن أبي الوقار والعلامة ابن الهايم نفسه وكان يثبت ببغداد في مذهب الحنابلة وأوصلت خدمة به أهل الفنون، وكان متبحراً في كل فن ولم يكن في زمانه أثقب منه نظراً ولا أسد رأياً وكان مميزاً في المعقول والمنطوق متقدماً في كل فن ولم يرض لنفسه بحفظ كتب كثيرة، وصنف تصانيف مفيدة منها كتاب الكشف الشافي وحاشية على المطالع وعلى شرح القاضي والتبصر والنظرة وكتاب العقد الجلالي وكتاب النهاية في الأصول وغيرها، وقام في وجه الطغاة بالإنكار المرة بعد المرة وربما أخذ بنظرهم وحبس، وولي قضاء قضاة بغداد وبقي منزوياً في إحدى مدارسها، توفي في اليوم الأول من سنة أربع وستين وثمانمائة ودفن بمقابر الباب الغربي من بغداد {cite:shadharat-dhahab p. 303-304}."
  en: "Jalal al-Din al-Hilli (b. ~801 at Hilla) — 'the diamond-boring critic,' Baghdad's shaykh al-Islam at the Mansuriyya and the last academic link of Iraq; pupil of al-Razi al-Sam'ani and al-Taftazani's circle at Khurasan; author of al-Kashf al-Shafi and the Umda glosses; 'none in his age more piercing of insight' — he denounced tyrants to their faces and was jailed for it; died the first day of 864, buried Bab al-Gharbi cemetery {cite:shadharat-dhahab p. 303-304}."
