summary:
  ar: "جلال الدين الحلي التفتازاني البغدادي الإمام الأوحد صاحب الماس النظار وصاحب العلوم الأظهر والمتبحر في كل فن الذي لم يزل يتفنن بالتمام؛ ولد سنة إحدى وثمانمائة تقريباً بأرض الحلة وقرأ بها القرآن وحفظ كتباً في الفقه والنحو والأصول وأخذ عن الشيخ جلال الدين الحلي والشيخ أبي المجد كمال الدين بن نصرت ثم ارتحل إلى خراسان فأخذ عن الشيخ شمس الدين ابن الرازي السمعاني وتبع أصول الدين بن القوشجي وسعد الدين التفتازاني ثم عاد إلى بغداد فباشر التدريس بها في عدة مدارس وولي مشيخة بغداد في مدرسة المنصورية وأقرأ فيها الكثير وإليه انتهت الرياسة بالعراق بعد الاستوثاقات وأخذ عنه العلامة جلال الدين بن أبي الوقار والعلامة ابن الهايم نفسه وكان يثبت ببغداد في مذهب الحنابلة وأوصلت خدمة به أهل الفنون، وكان متبحراً في كل فن ولم يكن في زمانه أثقب منه نظراً ولا أسد رأياً وكان مميزاً في المعقول والمنطوق متقدماً في كل فن ولم يرض لنفسه بحفظ كتب كثيرة، وصنف تصانيف مفيدة منها كتاب الكشف الشافي وحاشية على المطالع وعلى شرح القاضي والتبصر والنظرة وكتاب العقد الجلالي وكتاب النهاية في الأصول وغيرها، وقام في وجه الطغاة بالإنكار المرة بعد المرة وربما أخذ بنظرهم وحبس، وولي قضاء قضاة بغداد وبقي منزوياً في إحدى مدارسها، توفي في اليوم الأول من سنة أربع وستين وثمانمائة ودفن بمقابر الباب الغربي من بغداد {cite:shadharat-dhahab p. 303-304}."
  en: "Jalal al-Din al-Hilli (b. ~801 at Hilla) — 'the diamond-boring critic,' Baghdad's shaykh al-Islam at the Mansuriyya and the last academic link of Iraq; pupil of al-Razi al-Sam'ani and al-Taftazani's circle at Khurasan; author of al-Kashf al-Shafi and the Umda glosses; 'none in his age more piercing of insight' — he denounced tyrants to their faces and was jailed for it; died the first day of 864, buried Bab al-Gharbi cemetery {cite:shadharat-dhahab p. 303-304}."
  es: "Jalal al-Din al-Hilli (n. ~801 en Hilla) — 'el crítico perforador de diamantes', shaykh al-Islam de Bagdad en Mansuriyya y el último vínculo académico de Irak; discípulo de al-Razi al-Sam'ani y del círculo de al-Taftazani en Jorasán; autor de al-Kashf al-Shafi y las glosas de Umda; 'nadie en su época con una visión más penetrante': denunció a los tiranos cara a cara y fue encarcelado por ello; murió el primer día de 864, enterrado en el cementerio de Bab al-Gharbi {cite:shadharat-dhahab p. 303-304}."
  fr: "Jalal al-Din al-Hilli (né vers 801 à Hilla) — « le critique perçant le diamant », cheikh al-Islam de Bagdad à la Mansuriyya et dernier lien académique d'Irak; élève d'al-Razi al-Sam'ani et du cercle d'al-Taftazani au Khorasan; auteur d'al-Kashf al-Shafi et des gloses d'Umda; « nul à son époque n'avait une perspicacité plus pénétrante » — il dénonça les tyrans en face et fut emprisonné pour cela; mourut le premier jour de 864, enterré au cimetière de Bab al-Gharbi {cite:shadharat-dhahab p. 303-304}."
  ur: "جلال الدین الہلی ⁦(پیدائش ~ 801 ہللا)⁩ - 'ہیروں سے بھرے نقاد،' منصوریہ میں بغداد کے شیخ الاسلام اور عراق کا آخری علمی ربط؛ خراسان میں الرازی السمعانی اور تفتازانی حلقہ کے شاگرد؛ الکشف الشافعی اور عمدہ گلوسس کے مصنف؛ 'اس کی عمر میں اس سے زیادہ بصیرت کو چھیدنے والا کوئی نہیں' - اس نے ظالموں کو ان کے چہروں پر ملامت کی اور اس کے لیے جیل بھیج دیا گیا۔ 864ء کے پہلے دن وفات پائی، باب الغربی قبرستان میں دفن کیا گیا۔ 303-304}۔"
  tr: "Celal-Din el-Hilli el-Taftazani el-Bağdadi, tek imam, 'El-Mas el-Nuzar'ın yazarı ve her alanda en belirgin ve yetkin bilimlerin yazarı, her zaman mükemmel bir başarı göstermiştir; yaklaşık 801 Hicri Yılı'nda Hillah diyarında doğmuş, orada Kur'an çalışmış, fıkıh, dilbilgisi ve ilkeler üzerine kitaplar ezberlemiş, Şeyh Celaleddin el-Hilli ve Şeyh Ebu el-Majd Kamaldin ibn Nusrat'tan eğitim almış, ardından Horasan'a giderek Şeyh Şemseddin İbn el-Razi el-Sam'ani'nin yanında eğitim görmüş, el-Din ibn el-Kuşji ve Saad al-Din el-Teftazani'nin ilkelerini takip etmiş, ardından Bağdat'a dönmüştür. Burada çeşitli okullarda öğretmenlik yapmaya başladı ve Mansuriya Okulu'nda Bağdat şeyhi oldu; burada kapsamlı eğitim aldı. Belgelerden sonra sonunda Irak halkının başı oldu. Âlim Celaleddin bin Ebi el-Vaqar ve bizzat alim İbn al-Hayyim'in yanında eğitim aldı. Bağdat'ta Hanbali okulunda sağlam bir şekilde yerleşmişti ve sanat âlimleri tarafından yetiştirildi. Her alanda yetkindi ve kendi döneminde ondan daha keskin ne içgörü ne de görüş vardı. Hem akılcı hem de sözlü dilde üstün başarılıydı ve kendisi için çok fazla kitap ezberlemekle yetinmedi. Faydalı eserleri arasında El-Kaşf Şafi, Haşiye 'ala El-Matali', Şerh El-Kadi, El-Tabir, El-Nazar, El-İkd El-Celali ve El-Nihaya fi El-Usul gibi eserler yer alır. Zorbaları defalarca reddetti, bazen onlar tarafından hapsedildi, Bağdat'ta yargıç olarak görev yaptı ve okullardan birinde izole kaldı. 864 Hicri yılının ilk gününde öldü ve Bağdat'taki Batı Kapısı Mezarlığı'na defnedildi {kaynak:shadharat-dhahab, s. 303-304}."
  id: "Jalal al-Din al-Hilli al-Taftazani al-Baghdadi, satu-satunya Imam, penulis 'Al-Mas al-Nuzar' dan penulis ilmu pengetahuan paling jelas dan mahir di setiap bidang, yang selalu unggul dengan sempurna; lahir sekitar tahun 801 H di tanah Hillah, ia mempelajari Al-Qur'an di sana, menghafal buku-buku tentang fiqh, tata bahasa, dan prinsip, belajar di bawah bimbingan Sheikh Jalal al-Din al-Hilli dan Sheikh Abu al-Majd Kamal al-Din ibn Nusrat, kemudian pergi ke Khorasan, di mana ia belajar di bawah Sheikh Shams al-Din Ibn al-Razi al-Sam'ani, mengikuti prinsip al-Din ibn al-Qushji dan Saad al-Din al-Taftazani, lalu kembali ke Baghdad. Ia mulai mengajar di beberapa sekolah dan menjadi sheikh Baghdad di Sekolah Mansuriya, tempat ia belajar secara intensif. Akhirnya ia menjadi kepala rakyat Irak setelah dokumentasi. Ia belajar di bawah ulama Jalal al-Din ibn Abi al-Waqar dan ulama Ibn al-Hayyim sendiri. Ia mapan di Baghdad dalam aliran Hanbali, dan dibimbing oleh para cendekiawan seni. Ia menguasai segala bidang, dan pada masanya, tidak ada wawasan maupun pendapat yang lebih tajam darinya. Ia dikenal baik dalam bahasa rasional maupun lisan, unggul di setiap bidang, dan ia tidak puas hanya menghafal banyak buku sendiri. Ia menulis Karya-karya berguna termasuk buku Al-Kashf Al-Shafi, Hashiya 'ala Al-Matali', Sharh Al-Qadi, Al-Tabir, Al-Nazar, Al-'Iqd Al-Jalali, dan buku Al-Nihaya fi Al-Usul, di antara lainnya. Ia berulang kali menyangkal para tiran, kadang-kadang bahkan dipenjara oleh mereka, dan menjabat sebagai hakim Baghdad serta tetap terisolasi di salah satu sekolahnya. Ia meninggal pada hari pertama tahun 864 H dan dimakamkan di Pemakaman Gerbang Barat di Baghdad {cite:shadharat-dhahab, hlm. 303-304}."
