id: person/shihab-al-din-al-kuni
class: person
label: { ar: "شهاب الدين الكوني", en: "Shihab al-Din al-Kuni" }
summary:
  ar: "أبو المحاسن يوسف بن إسماعيل بن علي بن أحمد بن الحسين بن إبراهيم، الملقب شهاب الدين، الكوني الأصل الحلبي المولد والمنشأ والوفاة؛ كان أديباً فاضلاً متقناً لعلم العروض والقوافي شاعراً يقع له في النظم معانٍ بديعة في البيتين والثلاثة، وله ديوان شعر كبير يدخل في أربع مجلدات، قال ابن الشاعر إنه يحتوي على عشرين ألف بيت؛ وكان زيه على زي الحلبيين الأوائل في اللباس والعمامة المشقوقة، وكثير الملازمة لحلقة الشيخ تاج الدين ابن الخير النحوي، وقصد الملك الناصر صلاح الدين مادحاً ولم يكن ممن يرتزق بشعره بل يقوله تولعاً؛ وكان بينه وبين ابن خلكان صحبة وموانسة منذ أواخر سنة ثلاث وثلاثين وستمائة إلى حين وفاته {cite:wafayat-ayan}."
  en: "Yusuf b. Isma'il al-Kuni al-Halabi — the Aleppine poet Ibn Khallikan knew personally from 633 till his death; a twenty-thousand-verse diwan, composing for love not pay {cite:wafayat-ayan}."
