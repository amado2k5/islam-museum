label: { ar: "شهاب الدين الكوني", en: "Shihab al-Din al-Kuni", es: "Shihab al-Din al-Kuni", fr: "Shihab al-Din al-Kuni", ur: "شہاب الدین الکونی" }
summary:
  ar: "أبو المحاسن يوسف بن إسماعيل بن علي بن أحمد بن الحسين بن إبراهيم، الملقب شهاب الدين، الكوني الأصل الحلبي المولد والمنشأ والوفاة؛ كان أديباً فاضلاً متقناً لعلم العروض والقوافي شاعراً يقع له في النظم معانٍ بديعة في البيتين والثلاثة، وله ديوان شعر كبير يدخل في أربع مجلدات، قال ابن الشاعر إنه يحتوي على عشرين ألف بيت؛ وكان زيه على زي الحلبيين الأوائل في اللباس والعمامة المشقوقة، وكثير الملازمة لحلقة الشيخ تاج الدين ابن الخير النحوي، وقصد الملك الناصر صلاح الدين مادحاً ولم يكن ممن يرتزق بشعره بل يقوله تولعاً؛ وكان بينه وبين ابن خلكان صحبة وموانسة منذ أواخر سنة ثلاث وثلاثين وستمائة إلى حين وفاته {cite:wafayat-ayan}."
  en: "Yusuf b. Isma'il al-Kuni al-Halabi — the Aleppine poet Ibn Khallikan knew personally from 633 till his death; a twenty-thousand-verse diwan, composing for love not pay {cite:wafayat-ayan}."
  es: "Yusuf b. Isma'il al-Kuni al-Halabi, el poeta alepino que Ibn Khallikan conoció personalmente desde el año 633 hasta su muerte; un poema de veinte mil versos, compuesto por amor aún no {cita:wafayat-ayan}."
  fr: "Yusuf b. Isma'il al-Kuni al-Halabi — le poète aleppin qu'Ibn Khallikan a connu personnellement de 633 jusqu'à sa mort; un poème de vingt mille vers, composé pour un amour pas encore {cite: wafayat-ayan}."
  ur: "یوسف بی۔ اسماعیل الکونی الحلبی - حلب کے شاعر ابن خلیقان کو 633 سے اپنی موت تک ذاتی طور پر جانتے تھے۔ بیس ہزار آیتوں پر مشتمل نظم جو کہ ابھی تک محبت کے لیے نہیں لکھی گئی"
  tr: "Ebu el-Muhasin Yusuf bin İsmail ibn Ali ibn Ahmed ibn el-Hüseyin ibn İbrahim, lakaplı adı Şihab al-Din, Aleppin kökenliydi, Halep'te doğup büyümüştü; erdemli bir edebi figürdü, prosodi ve kafiyelerde ustaydı, iki ve üç dizeli şiirde güzel anlamlar taşıyan bir şairdi. Dört ciltlik büyük bir şiir koleksiyonu vardı. Şairin oğlu, bunun yirmi bin olduğunu söyledi dizeler; kıyafetleri erken Haleplilere benziyordu ve yarık sarıklar giyiyordu ve sık sık Şeyh Taceddin ibn al-Hayr al-Nahawi'nin çevresine eşlik etti. Kral el-Nasir Salah al-Din'den övgü aradı ve şiirlerine güvenmeyip, onu tutkuyla okuyan biriydi. 633 Hâri yılının sonlarından ölümüne kadar İbn Hallikan ile dostluk ve dostluk sürdürdü {alıntı: Wafayat-ayan}."
  id: "Abu al-Muhasin Yusuf ibn Ismail ibn Ali ibn Ahmad ibn al-Husayn ibn Ibrahim, dijuluki Shihab al-Din, berasal dari Aleppine, lahir dan besar di Aleppo; ia adalah sosok sastra yang berbudi luhur, mahir dalam prosodi dan rima, penyair dengan makna indah dalam puisi dalam dua dan tiga bait. Ia memiliki koleksi puisi besar dalam empat jilid. Putra penyair mengatakan kumpulan itu berisi dua puluh ribu bait; pakaiannya mirip dengan suku Aleppine awal dalam pakaian dan sorban belah, dan ia sering menemani lingkaran Sheikh Taj al-Din ibn al-Khayr al-Nahawi. Ia mencari pujian dari Raja al-Nasir Salah al-Din dan bukan tipe yang mengandalkan puisinya tetapi membacakannya karena hasrat. Ia menjaga persahabatan dan persahabatan dengan Ibn Khallikan sejak akhir tahun 633 H hingga kematiannya {cite:wafayat-ayan}."
