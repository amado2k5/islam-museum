  ur: "کویوکو مراد پاشا کے لیے مسودہ کارڈ، عثمانی وزیر اعظم جس نے سترہویں صدی کے آغاز میں اناطولیہ میں سیلالی بغاوتوں کو دبایا، ڈی۔ 1611; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
