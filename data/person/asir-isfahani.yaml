summary:
  ar: "شاعر فارسي من أصفهان، تلميذ فيضي هروي، وتخلص باسم «أسير»؛ لم يهاجر إلى البلاط المغولي كغيره من معاصريه، بل صار نديم الشاه عباس الأول وقريبه (وذكر بعض المصادر أنه صهره). نظم أكثر شعره تحت تأثير الخمر، وتوفي من الإفراط فيها. طُبع ديوانه بالحجر في لكنؤ سنة 1880م {cite:encyclopaedia-of-islam-2 vol. 1 p. 756}."
  en: "Persian poet of Isfahan, pupil of Fasihi Harawi and writing under the takhallus Asir. Unlike many contemporaries he did not migrate to the Mughal court; he became a boon companion and close relative (according to one account the son-in-law) of Shah Abbas I. He composed most of his poetry under the influence of alcohol, from an excess of which he died. His divan of qasidas, mathnawis, tarji'-bands and ghazals was lithographed at Lucknow in 1880 {cite:encyclopaedia-of-islam-2 vol. 1 p. 756}."
