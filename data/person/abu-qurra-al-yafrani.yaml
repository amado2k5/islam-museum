label:
  ar: أبو قرة اليفرني
  en: Abu Qurra al-Yafrani
summary:
  ar: "أبو قرة اليفرني الزناتي، من رؤساء بني يفرن المنتزين بنواحي تلمسان لأول الدولة العباسية؛ ملك قومه بتلك الناحية وحاصر عمر بن حفص عامل الأمويين بطبنة حتى ألجأه إلى المصير إلى إفريقية، وكان من أعيان زناتة المتقدمين في المغرب الأوسط قبل أن تستقر الدعوة لبني يفرن من بعده تحت محمد بن صالح وابنه يعلى."
  en: "Abu Qurra al-Yafrani al-Zanati, one of the Yafranid chiefs holding the Tlemcen marches at the dawn of the Abbasid state; king of his people there, he besieged the Umayyad governor Umar ibn Hafs at Tubna until he forced him back to Ifriqiya — among the earliest great men of Zanata in the Middle Maghreb before the da'wa settled on the later Yafranids Muhammad ibn Salih and his son Ya'la."
