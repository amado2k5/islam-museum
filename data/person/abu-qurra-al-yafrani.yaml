id: person/abu-qurra-al-yafrani
class: person
label:
  ar: أبو قرة اليفرني
  en: Abu Qurra al-Yafrani
  fr: "Abu Qurra al-Yafrani"
  es: "Abu Qurra al-Yafrani"
  ur: "ابو قرہ الیفرانی"
summary:
  ar: "أبو قرة اليفرني الزناتي، من رؤساء بني يفرن المنتزين بنواحي تلمسان لأول الدولة العباسية؛ ملك قومه بتلك الناحية وحاصر عمر بن حفص عامل الأمويين بطبنة حتى ألجأه إلى المصير إلى إفريقية، وكان من أعيان زناتة المتقدمين في المغرب الأوسط قبل أن تستقر الدعوة لبني يفرن من بعده تحت محمد بن صالح وابنه يعلى."
  en: "Abu Qurra al-Yafrani al-Zanati, one of the Yafranid chiefs holding the Tlemcen marches at the dawn of the Abbasid state; king of his people there, he besieged the Umayyad governor Umar ibn Hafs at Tubna until he forced him back to Ifriqiya — among the earliest great men of Zanata in the Middle Maghreb before the da'wa settled on the later Yafranids Muhammad ibn Salih and his son Ya'la."
  fr: "Abu Qurra al-Yafrani al-Zanati, l'un des chefs yafranides qui tenaient les marches de Tlemcen à l'aube de l'État abbasside ; roi des siens dans cette région, il assiégea le gouverneur Umar ibn Hafs à Tubna jusqu'à le contraindre à regagner l'Ifriqiya — parmi les premiers grands hommes des Zanata au Maghreb central, avant que l'appel ne se fixe sur les Yafranides plus tardifs Muhammad ibn Salih et son fils Ya'la."
  es: "Abu Qurra al-Yafrani al-Zanati, uno de los jefes yafraníes que controlaban las marcas de Tlemcen en los albores del estado abasí; rey de su pueblo allí, sitió al gobernador omeya Umar ibn Hafs en Tubna hasta que lo obligó a regresar a Ifriqiya, entre los primeros grandes hombres de Zanata en el Magreb Medio antes de que la da'wa se asentara en los posteriores yafraníes Muhammad ibn Salih y su hijo Ya'la."
  ur: "ابو قرہ ال یفرانی الزناتی، یافرانی سرداروں میں سے ایک جو عباسی ریاست کے آغاز میں تلمسن مارچ کر رہے تھے۔ وہاں اپنی قوم کے بادشاہ، اس نے اموی گورنر عمر بن حفص کا تبنا میں محاصرہ کر لیا یہاں تک کہ اس نے اسے افریقیہ واپس جانے پر مجبور کر دیا - جو بعد میں یافرانیوں محمد ابن صالح اور اس کے بیٹے یعلٰی پر دعوت کے قیام سے قبل مشرق مغرب میں زنتا کے ابتدائی عظیم آدمیوں میں سے تھا۔"
  tr: "Abbasî devletinin başlangıcında Tlemcen civarında konuşlanmış olan Beni İfran kabilesinin liderlerinden Ebu Kura el-Yifrani el-Zanati, o bölgede halkını yönetti ve Tabna'nın Emevi valisi Ömer bin Hafs'ı kuşatarak onu İfrikiye'ye kaçmaya zorladı. O, Muhammed bin Salih ve oğlu Ya'la önderliğinde Beni İfran kabilesinin kurulmasından önce, Orta Mağrip'te ilerleyen Zenata kabilesinin önde gelen isimlerinden biriydi."
  id: "Abu Qura al-Yifrani al-Zanati, salah satu pemimpin Bani Ifran yang ditempatkan di sekitar Tlemcen pada awal berdirinya negara Abbasiyah, memerintah rakyatnya di wilayah tersebut dan mengepung Umar bin Hafs, gubernur Umayyah di Tabna, hingga ia memaksanya melarikan diri ke Ifriqiya. Ia adalah salah satu tokoh terkemuka dari Zenata yang maju di Maghreb tengah sebelum seruan untuk Bani Ifran ditegakkan setelahnya di bawah Muhammad bin Saleh dan putranya Ya'la."
