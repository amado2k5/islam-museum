class: person
label: { ar: "يزيد بن هزيل كل العزي", en: "Yazid ibn Huzayl Kal al-Azzi", es: "Yazid ibn Huzayl Kal al-Azzi", fr: "Yazid ibn Huzayl Kal al-Azzi", ur: "یزید بن حزیل کل العزی" }
summary:
  ar: "يزيد بن هزيل كل العزي؛ وجهه موسى بن عبد الله بن خازم لزياد القصير الخزاعي فأصيب فطلب الغرة فضرب على رأسه فعاش سبعة أيام ثم مات وألقى يزيد نفسه في نهر الصغانيان فنجا."
  en: "Yazid ibn Huzayl Kal al-Azzi; sent by Musa against Ziyad al-Qasir — wounded, he asked quarter yet took a head-blow that killed him in seven days — while Yazid escaped by throwing himself into the Saghaniyan river."
  es: "Yazid ibn Huzayl Kal al-Azzi, enviado por Musa contra Ziyad al-Qasir, resultó herido, pidió clemencia pero recibió un golpe en la cabeza que lo mató en siete días, mientras que Yazid escapó arrojándose al río Saghaniyan."
  fr: "Yazid ibn Huzayl Kal al-Azzi; envoyé par Musa contre Ziyad al-Qasir — blessé, il demanda grâce mais reçut un coup à la tête qui le tua en sept jours — tandis que Yazid s'échappa en se jetant dans la rivière Saghaniyan."
  ur: "یزید بن حزیل کل العزی؛ موسیٰ کی طرف سے زیاد القصیر کے خلاف بھیجا گیا - زخمی ہو کر، اس نے چوتھائی سے پوچھا لیکن ایک چوتھائی سر پر لگا جس نے اسے سات دنوں میں ہلاک کر دیا - جبکہ یزید خود کو دریائے صغانیاں میں پھینک کر فرار ہو گیا۔"
  tr: "Yezid bin Huzayl, tüm el-Uzza; Musa ibn Abdullah ibn Khazim, yaralanan Ziyad el-Kasir el-Huza'i'ye hitap etti; Ziyad el-Kâsir el-Huza'i'ye seslendi; Ziyad yaralandı, el-Xerra'yı aradı ve başına vuruldu, yedi gün yaşadı, sonra öldü. Yezid kendini El-Saghaniyan Nehri'ne attı ve hayatta kaldı."
  id: "Yazid ibn Huzayl, semua al-'Uzza; Musa ibn Abdullah ibn Khazim berbicara kepada Ziyad al-Qasir al-Khuza'i, yang terluka, mencari al-gharra dan terkena pukulan di kepala, hidup selama tujuh hari, lalu meninggal. Yazid melemparkan dirinya ke Sungai Al-Saghaniyan dan selamat."
