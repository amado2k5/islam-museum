class: person
label: { ar: "عمران بن الفصيل البرجمي", en: "Imran ibn al-Fasil al-Burjumi", es: "Imran ibn al-Fasil al-Burjumi", fr: "Imran ibn al-Fasil al-Burjumi", ur: "عمران ابن الفصل البرجمی" }
summary:
  ar: "عمران بن الفصيل البرجمي؛ خرج مع حسكة بن عتاب الحبطي في صماليك من العرب إلى سجستان بعد وقعة الجمل فدخلوا زرنج وقال الراجز بشر سجستان يجوج وحرب بابن الفصيل وصماليك العرب لا فضة يفنيهم ولا ذهب."
  en: "Imran ibn al-Fasil al-Burjumi; rode with Hasaka ibn Utab's desperadoes into Sijistan after the Camel — the rajaz: 'tell Sijistan: famine and war are come, with Ibn al-Fasil and the Arabs' desperadoes — no silver will destroy them, no gold'."
  es: "Imran ibn al-Fasil al-Burjumi; cabalgó con los forajidos de Hasaka ibn Utab hacia Sijistan después del Camello; el rajaz dijo: 'Díganle a Sijistan: la hambruna y la guerra han llegado, con Ibn al-Fasil y los forajidos árabes; ni la plata ni el oro los destruirán'."
  fr: "Imran ibn al-Fasil al-Burjumi; chevaucha avec les desperados de Hasaka ibn Utab au Sijistan après le Chameau — le rajaz: « Dites au Sijistan: la famine et la guerre sont arrivées, avec Ibn al-Fasil et les desperados arabes — ni l'argent ni l'or ne les détruiront »."
  ur: "عمران ابن الفصل البرجمی؛ اونٹ کے بعد حسکا ابن عتاب کے مایوسوں کے ساتھ سجستان میں سوار ہوا - راجاز: 'سجستان سے کہو: قحط اور جنگ آ گئی ہے، ابن الفصل اور عربوں کے مایوسیوں کے ساتھ - انہیں کوئی چاندی تباہ نہیں کرے گا، کوئی سونا'۔"
  tr: "İmran ibn el-Fasayl el-Barjami; Deve Savaşı'ndan sonra Arapların Samalik'inde Hasakah ibn Atab al-Hubti ile birlikte Sijistan'a gitti. Zaranj'a girdiler ve şöyle dediler: Rajaz şöyle dedi: Sijistan'ın müjdesi Yacuj'dur ve İbn el-Fasail ile Samalik Araplarıyla yapılan savaş onları ne gümüş ne de altın yok edemez."
  id: "Imran ibn al-Fasayl al-Barjami; ia pergi bersama Hasakah ibn Atab al-Hubti di Samalik Arab ke Sijistan setelah Pertempuran Unta. Mereka masuk ke Zaranj dan berkata: Rajaz berkata: Kabar baik Sijistan adalah Yajuj, dan perang dengan Ibn al-Fasail dan Arab Samalik tidak dapat menghancurkan mereka."
