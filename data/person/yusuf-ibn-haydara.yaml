summary:
  ar: "أبو الحجاج يوسف بن حيدرة الرخي نسبة إلى الرخ ناحية بنيسابور، شيخ الطب بالشام وأحد من انتهت إليه معرفة الفن؛ قدم دمشق مع أبيه حيدرة الكحال سنة خمس وخمسين وخمسمائة ولازم الاشتغال على المهذب ابن النقاش فنوّه باسمه وصار من أطباء صلاح الدين وامتدت أيامه وصارت أطباء البلد تلامذته حتى كان من جملة أصحابه المهذب الدخوار {cite:shadharat-dhahab p. 147}."
  en: "Yusuf b. Haydara al-Rakhi (d. Ashura 631, aged 97) — dean of medicine in Syria, one of Salah al-Din's physicians; his pupils — among them al-Dakhwar — ran the country's medicine; he died with hearing and sight intact {cite:shadharat-dhahab p. 147}."
  es: "Yusuf b. Haydara al-Rakhi (m. Ashura 631, a los 97 años) — decano de la medicina en Siria, uno de los médicos de Salah al-Din; sus discípulos —entre ellos al-Dakhwar — dirigieron la medicina del país; murió con el oído y la vista intactos {cite:shadharat-dhahab p. 147}."
  fr: "Yusuf b. Haydara al-Rakhi (d. Ashura 631, à l'âge de 97 ans) — doyen de la médecine en Syrie, l'un des médecins de Salah al-Din; ses élèves — parmi lesquels al-Dakhwar — ont dirigé la médecine du pays; il est mort avec l'ouïe et la vue intactes {cite:shadharat-dhahab p. 147}."
  ur: "یوسف بی۔ حیدرہ الرخی ⁦(متوفی عاشورہ 631، عمر 97)⁩ — شام میں میڈیسن کی ڈین، صلاح الدین کے معالجین میں سے ایک؛ اس کے شاگرد - ان میں الدخور - ملک کی دوا چلاتے تھے۔ ان کا انتقال بصارت اور سماعت کے ساتھ ہوا 147}۔"
