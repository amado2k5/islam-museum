  en: "Yusuf b. Haydara al-Rakhi (d. Ashura 631, aged 97) — dean of medicine in Syria, one of Salah al-Din's physicians; his pupils — among them al-Dakhwar — ran the country's medicine; he died with hearing and sight intact {cite:shadharat-dhahab p. 147}."
