summary:
  ar: "جلال الدين حسن صاحب ألموت ودردكوه مقدم الإسماعيلية؛ كان قد أظهر شريعة الإسلام من الأذان وغيره فانصرفت الرعية إليه بعد ما كان آباؤه على غير ذلك؛ توفي سنة ثمان عشرة وستمائة وولي بعده ولده الأكبر {cite:shadharat-dhahab p. 84}."
  tr: "Alamut ve Dardkouh'un yazarı Celaleddin Hasan, İsmaililerin lideri; İslam hukukunu ezan ve diğer şeylerle vahyetmişti, bu yüzden ataları başka türlü hüküm sürdükten sonra tebaalar ona yöneldi; 1886 Hicri yılında öldü ve yerine en büyük oğlu geçti {atıf:shadharat-dhahab, s. 84}."
  id: "Jalal al-Din Hasan, penulis Alamut dan Dardkouh, pemimpin Ismaili; ia telah mewahyukan hukum Islam melalui seruan salat dan lainnya, sehingga para rakyat beralih kepadanya setelah leluhurnya memerintah lain; ia meninggal pada tahun 1886 H, dan digantikan oleh putra sulungnya {cite:shadharat-dhahab, hlm. 84}."
