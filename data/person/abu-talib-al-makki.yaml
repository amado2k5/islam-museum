summary:
  ar: "أبو طالب محمد بن علي بن عطية الحارثي الواعظ المكي صاحب كتاب «قوت القلوب»؛ لم يكن من أهل مكة وإنما كان من أهل الجبل فسكن مكة فنُسب إليها؛ كان رجلاً صالحاً مجتهداً في العبادة يستعمل الرياضة كثيراً حتى قيل إنه هجر الطعام زماناً فاخضرّ جلده؛ دخل البصرة بعد وفاة أبي الحسن ابن سالم فانتمى إلى مقالته، وقدم بغداد فوعظ الناس فخلط في كلامه فتُرك وهُجر وامتنع من الكلام بعد ذلك {cite:wafayat-ayan}."
  en: "Abu Talib Muhammad ibn Ali ibn Atiyya al-Harithi, the Meccan preacher and author of Qut al-qulub. He was not a native of Mecca but of the Jibal, and he settled in Mecca and was ascribed to it. He was a righteous man, diligent in worship, who practised austerity greatly, to the point that it was said he abstained from food for a time until his skin turned green. He entered Basra after the death of Abu al-Hasan ibn Salim and adhered to his doctrine; then he came to Baghdad and preached to people, but he confused his speech, so he was abandoned and shunned, and after that he refrained from speaking {cite:wafayat-ayan}."
