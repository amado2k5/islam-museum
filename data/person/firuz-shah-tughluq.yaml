summary:
  ar: "بطاقة أولية لفيروز شاه تغلق، سلطان دلهي صاحب العمران والقنوات ومنقولات الأعمدة الآشوكية، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Firuz Shah Tughluq, the Delhi sultan of canals, foundations and the transported Ashokan pillars, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Firuz Shah Tughluq, el sultán de Delhi de los canales, los cimientos y los pilares de Ashoka transportados, nombrado a partir de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de projet pour Firuz Shah Tughluq, le sultan de Delhi des canaux, des fondations et des piliers d'Ashoka transportés, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "دہلی کے سلطان فیروز شاہ تغلق کے لیے ڈرافٹ کارڈ، نہروں، بنیادوں اور اشوکن ستونوں کے نقل و حمل، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا ہے۔ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Firuz Şah'ın ön kartı, kentsel gelişim, kanallar ve Aşoka sütun kaldırma işlerinin sahibi olarak kapanıyor; açık referans açıklamasında (Wikidata) bahsediliyor. Hasan İbrahim'in İslam Tarihi adlı eserindeki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal Firuz Shah ditutup, Sultan Delhi, pemilik pengembangan kota, kanal, dan penghapusan kolom Ashoka, yang disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam karya Hasan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggal tidak disebutkan di sini."
