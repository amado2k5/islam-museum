  ur: "ابن ذکوان قرشی فہری دمشقی، عبد اللہ بن عامر یحصبی کی قراءت کے راوی؛ عاشورا 173ھ کو پیدا ہوئے اور درست قول کے مطابق شوال 202ھ میں فوت ہوئے؛ شام میں اقراء کے شیخ اور جامع اموی کے امام تھے {cite:nashr-dahman-damascus-1345-v1 p. 155}."
