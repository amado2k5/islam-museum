summary:
  ar: "محمد بن صالح التيمي، ذو القلب الحاضر واللب الوافر. روى أن بعض العلماء كان إذا تلا آية آية الدلالة على اليقين في الأرض قال: الأرض والسماوات وما فيهما آيات تدل عليك، وإن حظ المتفكر فيك الاعتراف بك والتوحيد لك."
  en: "Muhammad ibn Salih al-Taymi, with a present heart and a full mind; he relates that a learned man, when he recited the verse on the signs for those who have certainty in the earth, would say: the heavens and the earth and all in them are signs that point to You, and the share of the one who reflects on You is acknowledgement of You and the affirmation of Your oneness."
  ur: "محمد بن صالح تیمی حاضر دل اور کامل عقل والے تھے۔ وہ بیان کرتے ہیں کہ کوئی عالم جب یقین رکھنے والوں کے لیے زمین کی نشانیوں والی آیت پڑھتے تو کہتے: آسمان، زمین اور جو کچھ ان میں ہے سب تیری طرف رہنمائی کرنے والی نشانیاں ہیں، اور تجھ پر غور کرنے والے کا حصہ تیری معرفت اور توحید کا اقرار ہے۔"
