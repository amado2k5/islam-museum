summary:
  ar: "بطاقة أولية لناصر الدين بغرا خان، والي البنغال ثم سلطانها المستقل ابن غياث الدين بلبن في القرن الثالث عشر؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Nasiruddin Bughra Khan, governor then independent sultan of Bengal, son of Ghiyath al-Din Balban in the thirteenth century; the dynastic handbook entry is not yet checked on the page."
