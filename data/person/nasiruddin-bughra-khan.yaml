  ur: "تیرھویں صدی میں غیاث الدین بلبن کے بیٹے ناصرالدین بغرا خان، بنگال کے اس وقت کے آزاد سلطان گورنر کے لیے ڈرافٹ کارڈ؛ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Bengal valisi ve ardından bağımsız sultan İbn Giyasuddin Balban'ın on üçüncü yüzyılda kullandığı Nasiruddin Baghra Han'ın ilk kartı; İslam Devletleri Sözlükleri'nde bahsedilir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Nasiruddin Baghra Khan, gubernur Bengal dan kemudian Sultan merdeka Ibn Ghiyasuddin Balban pada abad ketiga belas; kartu ini disebutkan dalam Kamus Negara-negara Islam dan terjemahannya belum ditinjau di halaman tersebut."
