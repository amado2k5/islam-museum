summary:
  ar: "بطاقة أولية لتيبو سلطان، سلطان ميسور الذي حارب الإنجليز حتى استشهد في سرنجاباتم، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Tipu Sultan, sultan of Mysore who fought the British until his death at Srirangapatna, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Tipu Sultan, sultán de Mysore que luchó contra los británicos hasta su muerte en Srirangapatna, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de conscription de Tipu Sultan, sultan de Mysore qui a combattu les Britanniques jusqu'à sa mort à Srirangapatna, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "ٹیپو سلطان کے لیے ڈرافٹ کارڈ، میسور کے سلطان جنہوں نے سری رنگا پٹنہ میں اپنی موت تک انگریزوں سے لڑا، جس کا نام ایک کھلے حوالہ سے بیان کیا گیا ⁦(وکی ڈیٹا)⁩؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
