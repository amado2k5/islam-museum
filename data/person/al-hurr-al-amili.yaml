  ar: "محمد بن الحسن بن علي العاملي، الملقب بالحر، فقيه إمامي مؤرخ، ولد في مشغر من جبل عامل وانتهى إلى طوس بخراسان فتوفي فيها، ١٠٣٣ إلى ١١٠٤هـ؛ صاحب وسائل الشيعة وأمل الآمل وديوان شعر."
