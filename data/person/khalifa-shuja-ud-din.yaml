summary:
  ar: "محامٍ وسياسي من لاهور (1887-1955): أمين الرابطة الإسلامية في البنجاب من 1919 إلى 1936، وأول رئيس للمجلس التشريعي البنجابي بعد إعادة تأسيسه سنة 1951، ورئيس لجنة قوانين الزواج والأسرة سنة 1955؛ توفي فجأة في اليوم التالي لترؤسه أول اجتماعاتها."
  en: "Lahore lawyer and politician (1887-1955): secretary of the Punjab Muslim League from 1919 to 1936, first Speaker of the re-established Provincial Assembly of Punjab from 1951, and president of the Commission on Marriage and Family Laws in 1955; he died suddenly the day after chairing its first meeting."
  ur: "لاہور کے وکیل اور سیاست دان (1887ء–1955ء): 1919ء تا 1936ء پنجاب مسلم لیگ کے سیکرٹری، 1951ء میں بحال شدہ پنجاب اسمبلی کے پہلے اسپیکر، اور 1955ء میں شادی و عائلی قوانین کمیشن کے صدر؛ کمیشن کے پہلے اجلاس کی صدارت کے اگلے ہی دن ان کا اچانک انتقال ہو گیا۔"
