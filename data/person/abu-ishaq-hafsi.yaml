id: person/abu-ishaq-hafsi
class: person
label:
  ar: السلطان أبو إسحاق الحفصي
  en: Sultan Abu Ishaq al-Hafsi
  fr: "Le sultan Abu Ishaq al-Hafsi"
  es: "Sultan Abu Ishaq al-Hafsi"
  ur: "سلطان ابو اسحاق الحفصی۔"
summary:
  ar: "أبو إسحاق إبراهيم بن أبي زكريا، أخو المستنصر؛ كان نازحاً إلى الأندلس أيام دولة أخيه، فلما هلك وبويع ابنه الواثق أجاز من الأندلس إلى تلمسان فدخل بجاية آخر ذي القعدة سنة 677هـ وبايعه الموحدون والملأ، ودخل الحضرة منتصف الحجة آخر سنة 678هـ بعد انخلاع ابن أخيه، واستعمل في خطة الأشغال أبا بكر بن أبي الحسن بن خلدون الذي كان وفد مع أبيه الحسن على الأمير أبي زكريا من إشبيلية."
  en: "Abu Ishaq Ibrahim ibn Abi Zakariya, brother of al-Mustansir; settled in al-Andalus during his brother's reign, he crossed to Tlemcen when al-Mustansir died and the son al-Wathiq was acclaimed, entered Bejaia at the end of Dhu al-Qa'da 677 where the Almohads and notables swore him, and took the capital in mid-Dhu al-Hijja 678 after his nephew's abdication — appointing to the Ashghal office Abu Bakr ibn Abi al-Hasan ibn Khaldun, whose father al-Hasan had come from Seville under Abu Zakariya's protection."
  fr: "Abu Ishaq Ibrahim ibn Abi Zakariya, frère d'al-Mustansir ; établi en al-Andalus sous le règne de son frère, il passa à Tlemcen à la mort d'al-Mustansir quand son fils al-Wathiq fut acclamé, entra à Béjaïa à la fin de dhu al-qa'da 677 où les Almohades et les notables lui prêtèrent serment, et prit la capitale à la mi-dhu al-hijja 678 après l'abdication de son neveu — nommant à l'office des Ashghal Abu Bakr ibn Abi al-Hasan ibn Khaldun, dont le père al-Hasan était venu de Séville sous la protection d'Abu Zakariya."
  es: "Abu Ishaq Ibrahim ibn Abi Zakariya, hermano de al-Mustansir, se estableció en al-Andalus durante el reinado de su hermano. Tras la muerte de al-Mustansir y la proclamación de su hijo al-Wathiq, pasó a Tlemcen. Entró en Bejaia a finales de Dhu al-Qa'da 677, donde los almohades y notables le juramentaron, y tomó la capital a mediados de Dhu al-Hijja 678, tras la abdicación de su sobrino, nombrando para el cargo de Ashghal a Abu Bakr ibn Abi al-Hasan ibn Khaldun, cuyo padre, al-Hasan, había llegado de Sevilla bajo la protección de Abu Zakariya."
  ur: "ابو اسحاق ابراہیم ابن ابی زکریا، المستنصر کے بھائی؛ اپنے بھائی کے دور حکومت میں اندلس میں آباد ہوئے، جب المستنصر کی وفات ہوئی اور ولد الوثیق کی تعریف کی گئی تو اس نے تلمسن کو عبور کیا، ذوالقعدہ 677 کے آخر میں بیجائیہ میں داخل ہوا جہاں المحدثین اور معززین نے اس سے قسم کھائی، اور ذوالحجہ کے وسط میں اس کا دارالخلافہ لے لیا۔ اشغل کے دفتر میں ابوبکر ابن ابی الحسن ابن خلدون کو مقرر کرنا، جن کے والد الحسن ابو زکریا کی حفاظت میں سیویل سے آئے تھے۔"
