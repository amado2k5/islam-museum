id: person/abu-ishaq-hafsi
class: person
label:
  ar: السلطان أبو إسحاق الحفصي
  en: Sultan Abu Ishaq al-Hafsi
summary:
  ar: "أبو إسحاق إبراهيم بن أبي زكريا، أخو المستنصر؛ كان نازحاً إلى الأندلس أيام دولة أخيه، فلما هلك وبويع ابنه الواثق أجاز من الأندلس إلى تلمسان فدخل بجاية آخر ذي القعدة سنة 677هـ وبايعه الموحدون والملأ، ودخل الحضرة منتصف الحجة آخر سنة 678هـ بعد انخلاع ابن أخيه، واستعمل في خطة الأشغال أبا بكر بن أبي الحسن بن خلدون الذي كان وفد مع أبيه الحسن على الأمير أبي زكريا من إشبيلية."
  en: "Abu Ishaq Ibrahim ibn Abi Zakariya, brother of al-Mustansir; settled in al-Andalus during his brother's reign, he crossed to Tlemcen when al-Mustansir died and the son al-Wathiq was acclaimed, entered Bejaia at the end of Dhu al-Qa'da 677 where the Almohads and notables swore him, and took the capital in mid-Dhu al-Hijja 678 after his nephew's abdication — appointing to the Ashghal office Abu Bakr ibn Abi al-Hasan ibn Khaldun, whose father al-Hasan had come from Seville under Abu Zakariya's protection."
