  ar: "لاله شاهين؛ القائد العثماني في عهد مراد الأول. يذكر الصلابي أنه كان على رأس الجيش العثماني في معركة نهر الماريتسا ⁦(صيرمن)⁩ ضد الحلف البلقاني، فهاجم معسكر النصارى ليلاً قبل طلوع الفجر وأبادهم عن آخرهم {cite:dawlat-uthmaniyya-salabi p. 58-59}."
  en: "Lala Şahin Pasha, Murad I's field commander — in al-Sallabi's telling he led the Ottoman force at the Maritsa (Sırpsındığı) night attack that annihilated the Balkan coalition's camp before dawn {cite:dawlat-uthmaniyya-salabi p. 58-59}."
