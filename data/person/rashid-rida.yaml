summary:
  ar: "محمد رشيد رضا، من مواليد القلمون قرب طرابلس الشام عام 1865م وتوفي عام 1935م، من أغزر مؤلفي الإصلاح الإسلامي والجامعة الإسلامية تأليفاً وأكثرهم تأثيراً، وارتبط اسمه بمجلة المنار التي حررها منذ 1898م. تتلمذ على محمد عبده في القاهرة، وأسس عام 1911م دار الدعوة والإرشاد، وشارك في السياسة العربية والجدل حول الخلافة. ويبين المقال أن رأيه في الوهابية تبدل مع الزمن وأنه انتقد الطرق الصوفية، ويشير إلى ثناء شكيب أرسلان عليه وهو ثناء معاصر وصديق."
  en: "Muhammad Rashid Rida, born in Qalamun near Tripoli in 1865 and died in 1935, was one of the most productive and influential authors of Islamic reform and Pan-Islamism, and is tied above all to the journal al-Manar, which he edited from 1898. He studied under Muhammad Abduh in Cairo, founded Dar al-Da'wa wa'l-Irshad in 1911, and took part in Arab politics and in the debate on the caliphate. The Encyclopaedia of Islam reports that his view of the Wahhabiyya changed over time and that he criticised the Sufi orders; Shakib Arslan, a contemporary and friend, praised him."
  ur: "محمد رشید رضا 1865ء میں طرابلس کے قریب قلمون میں پیدا ہوئے اور 1935ء میں وفات پائی۔ وہ اسلامی اصلاح اور پان اسلام ازم کے سب سے زیادہ لکھنے والے اور اثر ڈالنے والے مصنفین میں سے تھے اور رسالہ المنار سے، جس کے مدیر وہ 1898ء سے رہے، خاص طور پر وابستہ ہیں۔ انہوں نے قاہرہ میں محمد عبدہ سے پڑھا، 1911ء میں دار الدعوۃ والارشاد قائم کیا اور عرب سیاست اور خلافت کی بحث میں حصہ لیا۔ دائرہ معارف اسلامیہ کے مطابق وہابیہ کے بارے میں ان کی رائے وقت کے ساتھ بدلی اور انہوں نے صوفی سلسلوں پر تنقید کی، جبکہ ہمعصر دوست شکیب ارسلان نے ان کی تعریف کی۔"
