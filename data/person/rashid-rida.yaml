summary:
  ar: "عالم وصحفي من رواد الإصلاح الإسلامي، تلميذ الشيخ محمد عبده، وصاحب تاريخ الإمام محمد عبده في مجلدين. يصفه شكيب أرسلان في تعليقه على حاضر العالم الإسلامي بالأستاذ الأكبر، ويثني على سعة علمه ورجاحة عقله وقدرته على ربط الشريعة بالنوازل المعاصرة، ويذكر كتاباً له في حكمة الشرع الإسلامي وفي التسري الشرعي، يرد فيه على المعترضين."
  en: "Scholar and journalist of the Islamic reform movement, a disciple of Muhammad Abduh and author of a two-volume biography of him. Arslan calls him 'the great master', praises his command of Arabic, his jurisprudence on modern questions and his reply to critics of Islamic law, and cites his treatment of concubinage in Islamic law {cite:stoddard-arslan-hadir-1923 vol. 1, scan pp. 301–303}."
