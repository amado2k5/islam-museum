summary:
  ar: "خطاط عمل في رعاية السلطان أحمد الجلائري، وتنسب إليه نورا تيتلي إتقان خط النستعليق، وكتب به مخطوطة قصائد خواجو كرماني سنة 1396م {cite:titley-persian-miniature-painting-1983 p. 27} {cite:titley-persian-miniature-painting-1983 p. 224}."
  en: "Calligrapher under the patronage of Sultan Ahmad Jalayir, credited by Norah Titley with perfecting the nasta'liq script, in which he wrote the 1396 manuscript of Khvaju Kirmani's poems {cite:titley-persian-miniature-painting-1983 p. 27} {cite:titley-persian-miniature-painting-1983 p. 224}."
  ur: "سلطان احمد جلائری کی سرپرستی میں خطاط، جنہیں نورا ٹٹلی نستعلیق کو کمال دینے کا اعتراف کرتی ہیں؛ انہوں نے اسی خط میں 1396ء کا خواجو کرمانی کا مخطوطہ لکھا {cite:titley-persian-miniature-painting-1983 p. 27} {cite:titley-persian-miniature-painting-1983 p. 224}."
