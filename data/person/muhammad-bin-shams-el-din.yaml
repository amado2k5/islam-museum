  ur: "شامی مبلغ، جو جرمنی میں مقیم ہیں؛ یوٹیوب پر ان کا چینل وسیع پیمانے پر دیکھا جاتا ہے، اور وہ «طالب العلم» پلیٹ فارم اور آن لائن «شمس الدین» مدرسہ برائے علومِ شرعیہ کے بانی ہیں؛ وہ عقیدہ، حدیث اور فقہ میں دروس اور مخالفین سے براہِ راست مباحثے پیش کرتے ہیں، اور ان کے ناقدین انہیں اس رجحان کی نمایاں شخصیت قرار دیتے ہیں جسے وہ «نئی حدادیہ» کہتے ہیں۔"
