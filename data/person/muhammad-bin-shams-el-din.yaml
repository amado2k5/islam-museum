  ar: "داعية سوري مقيم في ألمانيا، صاحب قناة واسعة الانتشار على يوتيوب ومؤسس منصة «طالب العلم» ومدرسة «شمس الدين» للعلوم الشرعية على الإنترنت، يقدّم دروسا في العقيدة والحديث والفقه وبثوثا ومناظرات مع المخالفين، ويصفه نقاده بأنه من أبرز وجوه ما يسمونه «الحدادية الجديدة»."
