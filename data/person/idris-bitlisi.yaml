roles: [writer, scholar]
gender: male
summary:
  ar: "المولى إدريس بن حسام الدين البدليسي، العجمي ثم الرومي الحنفي، كان موقعا في ديوان أمراء العجم، وارتحل بعد فتنة ابن أردويل إلى بلاد الروم فأكرمه السلطان أبو يزيد، وأمره أن ينشئ «تواريخ آل عثمان» بالفارسية؛ ذكره ابن العماد في وفيات سنة 925 هـ تقريبا {cite:shadharat-dhahab vol. 10 p. 184}."
  en: "The mawla Idris ibn Husam al-Din al-Bidlisi, an Ajami Hanafi scholar who became one of the Rumis; secretary-attestor in the chancery of the emirs of the Ajam, he moved to Rum after the strife of Ibn Ardawil, was honoured by Sultan Abu Yazid and was commissioned to write the histories of the House of Osman in Persian; Ibn al-Imad lists him among those who died in about 925 AH {cite:shadharat-dhahab vol. 10 p. 184}."
  es: "El mawla Idris ibn Husam al-Din al-Bidlisi, un erudito hanafi de Ajam que se convirtió en uno de los Rumis; secretario-testador en la cancillería de los emires de Ajam, se trasladó a Rum después de la contienda de Ibn Ardawil, fue honrado por el sultán Abu Yazid y se le encargó escribir las historias de la Casa de Osman en persa; Ibn al-Imad lo incluye entre los que murieron alrededor del año 925 AH {cite:shadharat-dhahab vol. 10 p. 184}."
  fr: "Le mawla Idris ibn Husam al-Din al-Bidlisi, un érudit hanafite ajami devenu l'un des Rumi; secrétaire-témoin à la chancellerie des émirs de l'Ajam, il s'installa à Rum après la lutte d'Ibn Ardawil, fut honoré par le sultan Abu Yazid et chargé d'écrire les histoires de la maison d'Osman en persan; Ibn al-Imad le mentionne parmi ceux qui sont morts vers 925 AH {cite: shadharat-dhahab vol. 10 p. 184}."
  ur: "مولا ادریس بن حسام الدین البدلسی، ایک اجمی حنفی عالم جو رومیوں میں سے ایک بنے۔ عجم کے امیروں کے دفتر میں سکریٹری اٹسٹر، وہ ابن اردویل کے جھگڑے کے بعد روم چلا گیا، سلطان ابو یزید نے اسے اعزاز سے نوازا اور اسے فارسی میں عثمان کے گھر کی تاریخیں لکھنے کا حکم دیا گیا۔ ابن عماد نے انہیں ان لوگوں میں شامل کیا ہے جو تقریباً 925 ہجری میں فوت ہوئے تھے۔ 10ص۔ 184}۔"
  tr: "Arap olmayan bir dönemde el-Rumi el-Hanefi olan Mewla İdris bin Hüsam el-Din el-Badlisi, Pers prenslerinin Diwanı'nın imzacılarındandı. İbn Ardavil'in karmaşasından sonra, Roma topraklarına gitti; burada Sultan Ebu Yezid onu onurlandırdı ve Farsça olarak 'Osmanlıların Tarihleri'ni derlemesini emretti; İbn el-İmad bunu yaklaşık 925 Hicri ölümünde anmıştır {atıf:shadharat-dhahab cilt 10, s. 184}."
  id: "Mawla Idris ibn Hussam al-Din al-Badlisi, seorang non-Arab yang saat itu al-Rumi al-Hanafi, adalah penandatangan Diwan para pangeran Persia. Setelah kekacauan Ibn Ardawil, ia melakukan perjalanan ke tanah Romawi, di mana Sultan Abu Yazid menghormatinya dan memerintahkannya untuk menyusun 'Sejarah Ottoman' dalam bahasa Persia; Ibn al-Imad menyebutkannya dalam kematian sekitar tahun 925 H {cite:shadharat-dhahab vol. 10, hlm. 184}."
