summary:
  ar: "منشد مصري من الصعيد ⁦(وُلد 1948 أو 1949)⁩ من الحواتكة بأسيوط، درس في المعاهد الأزهرية حتى 1970، ويُعدّ من أعلام الإنشاد في مصر، وملأ دار الأوبرا في حفله في مارس 2024."
  en: "Egyptian munshid from Upper Egypt (born 1948 or 1949) at al-Hawatka in Asyut, who studied at the Azhari institutes until 1970 and is one of Egypt's best-known religious singers; his March 2024 concert at the Cairo Opera House sold out."
  ur: "بالائی مصر کے منشد ⁦(پیدائش 1948ء یا 1949ء)⁩ اسیوط کے الحواتکہ سے، جنھوں نے 1970ء تک ازہری اداروں میں پڑھا اور مصر کے معروف ترین منشدین میں شمار ہوتے ہیں؛ مارچ 2024ء میں قاہرہ اوپرا ہاؤس میں ان کی محفل کے سب ٹکٹ فروخت ہوئے۔"
  es: "Cantor religioso egipcio originario del Alto Egipto (nacido en 1948 o 1949) en al-Hawatka, Asyut, que estudió en los institutos de Azhari hasta 1970 y es uno de los cantantes religiosos más conocidos de Egipto; su concierto de marzo de 2024 en la Ópera de El Cairo agotó todas las entradas."
  fr: "Chanteur religieux égyptien originaire de Haute-Égypte (né en 1948 ou 1949) à al-Hawatka à Assiout, qui a étudié dans les instituts Azhari jusqu'en 1970 et est l'un des chanteurs religieux les plus connus d'Égypte; son concert de mars 2024 à l'Opéra du Caire a affiché complet."
  tr: "Yukarı Mısır'dan (1948 veya 1949 doğumlu) Assiut'taki Al-Hawatika'dan Mısırlı bir ilahi olan Sher, 1970'e kadar El-Ezher enstitülerinde eğitim gördü. Mısır'da ilahilerin önde gelen isimlerinden biri olarak kabul edilir ve Mart 2024'teki konseriyle opera binasını doldurdu."
  id: "Seorang penyanyi Mesir dari Mesir Hulu (lahir 1948 atau 1949) dari Al-Hawatika di Assiut, ia belajar di institut Al-Azhar hingga tahun 1970. Ia dianggap sebagai salah satu tokoh terkemuka nyanyian di Mesir, dan memenuhi gedung opera dengan konsernya pada Maret 2024."
