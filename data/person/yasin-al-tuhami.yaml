  ar: "\u0645\u0646\u0634\u062f \u0645\u0635\u0631\u064a \u0645\u0646 \u0627\u0644\u0635\u0639\u064a\u062f \u2066(\u0648\u064f\u0644\u062f 1948 \u0623\u0648 1949)\u2069 \u0645\u0646 \u0627\u0644\u062d\u0648\u0627\u062a\u0643\u0629 \u0628\u0623\u0633\u064a\u0648\u0637\u060c \u062f\u0631\u0633 \u0641\u064a \u0627\u0644\u0645\u0639\u0627\u0647\u062f \u0627\u0644\u0623\u0632\u0647\u0631\u064a\u0629 \u062d\u062a\u0649 1970\u060c \u0648\u064a\u064f\u0639\u062f\u0651 \u0645\u0646 \u0623\u0639\u0644\u0627\u0645 \u0627\u0644\u0625\u0646\u0634\u0627\u062f \u0641\u064a \u0645\u0635\u0631\u060c \u0648\u0645\u0644\u0623 \u062f\u0627\u0631 \u0627\u0644\u0623\u0648\u0628\u0631\u0627 \u0641\u064a \u062d\u0641\u0644\u0647 \u0641\u064a \u0645\u0627\u0631\u0633 2024."
  en: "Egyptian munshid from Upper Egypt (born 1948 or 1949) at al-Hawatka in Asyut, who studied at the Azhari institutes until 1970 and is one of Egypt's best-known religious singers; his March 2024 concert at the Cairo Opera House sold out."
  ur: "\u0628\u0627\u0644\u0627\u0626\u06cc \u0645\u0635\u0631 \u06a9\u06d2 \u0645\u0646\u0634\u062f \u2066(\u067e\u06cc\u062f\u0627\u0626\u0634 1948\u0621 \u06cc\u0627 1949\u0621)\u2069 \u0627\u0633\u06cc\u0648\u0637 \u06a9\u06d2 \u0627\u0644\u062d\u0648\u0627\u062a\u06a9\u06c1 \u0633\u06d2\u060c \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 1970\u0621 \u062a\u06a9 \u0627\u0632\u06c1\u0631\u06cc \u0627\u062f\u0627\u0631\u0648\u06ba \u0645\u06cc\u06ba \u067e\u0691\u06be\u0627 \u0627\u0648\u0631 \u0645\u0635\u0631 \u06a9\u06d2 \u0645\u0639\u0631\u0648\u0641 \u062a\u0631\u06cc\u0646 \u0645\u0646\u0634\u062f\u06cc\u0646 \u0645\u06cc\u06ba \u0634\u0645\u0627\u0631 \u06c1\u0648\u062a\u06d2 \u06c1\u06cc\u06ba\u061b \u0645\u0627\u0631\u0686 2024\u0621 \u0645\u06cc\u06ba \u0642\u0627\u06c1\u0631\u06c1 \u0627\u0648\u067e\u0631\u0627 \u06c1\u0627\u0624\u0633 \u0645\u06cc\u06ba \u0627\u0646 \u06a9\u06cc \u0645\u062d\u0641\u0644 \u06a9\u06d2 \u0633\u0628 \u0679\u06a9\u0679 \u0641\u0631\u0648\u062e\u062a \u06c1\u0648\u0626\u06d2\u06d4"
