    ar: "عبد الله بن عمرو بن حرام سيد بني سلمة ووالد جابر؛ شهد بيعة العقبة الثانية وبدراً واستشهد بأحد فكان أول قتيل من المسلمين فيها."
    en: "Abd Allah ibn Amr ibn Haram, lord of Banu Salama and Jabir's father, witnessed the second pledge of Aqaba and Badr, and fell at Uhud — the first Muslim killed there."
