summary:
  en: "A prominent chief of Banu Salima of the Khazraj, father of Jabir ibn Abdullah; he embraced Islam and took the Second Pledge of Aqaba where he was appointed a naqib; he fought at Badr and was the first Muslim martyred at the battle of Uhud, where the Prophet spoke of God speaking to him without a veil."
  ar: "سيد بني سلمة ووالد الصحابي جابر بن عبد الله؛ أسلم وشهد بيعة العقبة الثانية وكان أحد النقباء، وشهد بدراً واستشهد بأحد فكان أول قتيل من المسلمين فيها، وكلمه الله كفاحاً بلا حجاب. وفي الصحيح دعا جابراً من الليل قبل أحد فقال «ما أراني إلا مقتولاً في أول من يقتل من أصحاب رسول الله» فأصبح فكان أول قتيل، فاستخرجه ابنه بعد ستة أشهر فإذا هو كيوم وضع إلا أذنه {cite:sahih-al-bukhari 1351}، وقال النبي لجابر حين رفع «ما زالت الملائكة تظله بأجنحتها» {cite:sahih-al-bukhari 4080}."
