summary:
  ar: "أمير عربي عقيلي صاحب حديثة عانة على الفرات، آوى الخليفة العباسي القائم بأمر الله سنة كاملة لما نفاه البساسيري وقريش بن بدران من بغداد سنة 450هـ، وكان «حسن الطريقة» يتولى خدمته بنفسه حتى عاد مكرماً بعد قتل البساسيري {cite:muntazam-ibn-al-jawzi j.8 p.113} {cite:shadharat-dhahab p.296}. وعنده قال القائم شعره المشهور في الحديثة «خابت ظنوني فيمن كنت آمله» {cite:muntazam-ibn-al-jawzi j.8 p.114}."
