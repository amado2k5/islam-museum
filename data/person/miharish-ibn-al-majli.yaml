id: person/miharish-ibn-al-majli
class: person
label: { ar: "مهارش بن المجلي العقيلي" }
summary:
  ar: "أمير عربي عقيلي صاحب حديثة عانة على الفرات، آوى الخليفة العباسي القائم بأمر الله سنة كاملة لما نفاه البساسيري وقريش بن بدران من بغداد سنة 450هـ، وكان «حسن الطريقة» يتولى خدمته بنفسه حتى عاد مكرماً بعد قتل البساسيري {cite:muntazam-ibn-al-jawzi j.8 p.113} {cite:shadharat-dhahab p.296}. وعنده قال القائم شعره المشهور في الحديثة «خابت ظنوني فيمن كنت آمله» {cite:muntazam-ibn-al-jawzi j.8 p.114}."
  tr: "Fırat üzerindeki Ana Hadisası'na sahip bir Arap Akilisi prensi olarak, 450 H yılında el-Basasiri ve Qureyş bin Badran'ın onu Bağdat'tan sürgün etmesinden sonra Abbasi Halifesi el-Kaim bi-Amr Allah'ı bir yıl boyunca barındırdı. 'Hasan el-Tarika' ona bizzat hizmet etti, ta ki el-Basasiri'nin öldürülmesinden sonra onurlandırılarak dönene kadar {atıf:Muntazam-ibn-al-jawzi J.8 s.113} {atıf:shadharat-dhahab s.296}. O dönemde el-Kaim ünlü şiirini hadislerde yazdı: 'Şüphelerim umut ettiğim kişiye karşı boşa çıktı' {cite:Muntazam-ibn-al-jawzi J.8 s.114}."
  id: "Seorang pangeran Arab Aqili yang memiliki Hadits Ana di Sungai Efrat, ia melindungi Khalifah Abbasiyah al-Qa'im bi-Amr Allah selama setahun penuh setelah al-Basasiri dan Quraish ibn Badran mengusirnya dari Baghdad pada tahun 450 H. 'Hasan al-Tariqa' melayani dirinya sendiri hingga ia kembali dengan kehormatan setelah pembunuhan al-Basasiri {cite:Muntazam-ibn-al-jawzi J.8 hlm.113} {cite:shadharat-dhahab hlm.296}. Pada saat itu, al-Qa'im menulis puisi terkenalnya dalam hadits: 'Keraguanku kecewa pada siapa yang kuharapkan' {cite:Muntazam-ibn-al-jawzi J.8 hlm.114}."
