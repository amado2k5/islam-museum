  ar: عبد الله عبدي بن محمد الرومي البوسنوي البيرامي، المعروف بشارح الفصوص، فاضل متصوف من أهل البوسنة، شرح فصوص الحكم بالتركية ثم بالعربية، وتوفي بقونية عائداً من الحج سنة 1054 هـ.
