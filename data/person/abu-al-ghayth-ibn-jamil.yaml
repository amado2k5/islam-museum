summary:
  ar: "شيخ شيوخ اليمن؛ كان في ابتداء أمره قناً قاطعاً للطريق، فبينما هو كامن لأخذ قافلة إذ سمع هاتفاً يقول «يا صاحب العين عليك عينا» فوقع منه موقعاً أزعجه وأقبل على الله وظهر عليه صدق الإرادة، وصحب أولاً الشيخ علي بن أفلح الزبيدي ثم الشيخ علي الأهدل؛ وكان أمياً وله كلام في الحقائق وأحوال باهرة وكرامات ظاهرة ووضع عليه كتاب في التصوف {cite:shadharat-dhahab p. 264-265}."
  en: "Shaykh of Yemen's shaykhs (d. ~652) — a highwayman in his beginnings, turned by a voice heard while lying in wait for a caravan; disciple of Ali b. Aflah al-Zabidi then Ali al-Ahdal; unlettered, yet with speech on the realities and a treatise on tasawwuf written for him {cite:shadharat-dhahab p. 264-265}."
  fr: "Shaykh des shaykhs du Yémen (mort vers 652) — coupeur de routes à ses débuts, retourné par une voix entendue alors qu'il guettait une caravane ; disciple d'Ali b. Aflah al-Zabidi puis d'Ali al-Ahdal ; illettré, il avait pourtant une parole sur les réalités, et un traité de soufisme fut écrit pour lui {cite:shadharat-dhahab p. 264-265}."
  es: "Shaykh de los shaykhs de Yemen (m. ~652) — un bandolero en sus comienzos, convertido por una voz que escuchó mientras esperaba una caravana; discípulo de Ali b. Aflah al-Zabidi y luego de Ali al-Ahdal; analfabeto, pero con discursos sobre las realidades y un tratado sobre el tasawwuf escrito para él {cite:shadharat-dhahab p. 264-265}."
