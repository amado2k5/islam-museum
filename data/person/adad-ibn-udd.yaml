summary:
  ar: "حلقة في القسم المختلف فيه من النسب النبوي بين عدنان وإسماعيل؛ يذكره ابن إسحاق والطبري وابن سعد في سلسلة تبدأ بعدنان بن أُدّ بن أدد بن الحميسع وتصعد إلى قيدار بن إسماعيل {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad}، وهو القسم الذي جمعه المنصورفوري عن الكلبي وابن سعد مع كثرة الاختلاف بين الروايات {cite:mubarakpuri-raheeq p.48-49}."
  en: "A link in the disputed part of the Prophet's lineage between Adnan and Ismail, in the chain beginning with Adnan ibn Udd ibn Adad ibn al-Humaysa and continuing up to Qaydar ibn Ismail, as transmitted by Ibn Ishaq, al-Tabari and Ibn Sa'd {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad} — the part al-Mansurfuri compiled from al-Kalbi and Ibn Sa'd amid wide disagreement among the versions {cite:mubarakpuri-raheeq p.48-49}."
  fr: "Maillon de la partie disputée de la généalogie du Prophète entre Adnan et Ismail, dans la chaîne commençant par Adnan ibn Udd ibn Adad ibn al-Humaysa et remontant à Qaydar ibn Ismail, telle que la transmettent Ibn Ishaq, al-Tabari et Ibn Sa'd {cite:ibn-hisham-sira 1/1-4} {cite:tarikh-al-tabari} {cite:tabaqat-ibn-sad}. Il s'agit de la partie compilée par al-Mansurfuri d'après al-Kalbi et Ibn Sa'd, marquée par de grandes divergences entre les versions {cite:mubarakpuri-raheeq p.48-49}."
