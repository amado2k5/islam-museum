summary:
  ar: "كاتب وناقد مصري (1889–1973) لُقّب «عميد الأدب العربي»، فقد بصره طفلًا، ودرس في الأزهر والجامعة المصرية وفرنسا، وأثار كتابه «في الشعر الجاهلي» (1926) معركة فكرية كبرى، وصار أول عميد مصري لكلية الآداب ومديرًا لجامعة الإسكندرية ووزيرًا للمعارف (1950–1952) فجعل التعليم مجانيًا، وخلّف أكثر من ستين كتابًا في مقدمتها سيرته «الأيام»."
  en: "Egyptian writer and critic (1889–1973) known as the Dean of Arabic Literature. Blinded in childhood, he studied at al-Azhar, the Egyptian University and in France; his On Pre-Islamic Poetry (1926) set off one of the great intellectual battles of the Arab world. He became the first Egyptian dean of the Faculty of Arts, founding rector of Alexandria University and Minister of Education (1950–1952), where he made schooling free, and left more than sixty books, headed by his autobiography The Days."
  ur: "مصری ادیب و ناقد (1889–1973) جو «عمید الأدب العربی» کے لقب سے مشہور ہوا۔ بچپن میں بینائی سے محروم ہوا، ازہر، مصری یونیورسٹی اور فرانس میں تعلیم پائی؛ اس کی کتاب «فی الشعر الجاہلی» (1926) نے عرب دنیا میں بڑی فکری بحث چھیڑ دی۔ وہ کلیۂ آداب کا پہلا مصری عمید، جامعہ اسکندریہ کا بانی مدیر اور وزیرِ معارف (1950–1952) بنا، جہاں اس نے تعلیم مفت کر دی، اور ساٹھ سے زیادہ کتابیں چھوڑیں جن میں سرِ فہرست اس کی خودنوشت «الایام» ہے۔"
