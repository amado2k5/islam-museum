summary:
  ar: "عبيد بن حصين النميري، المعروف بالراعي لكثرة وصفه الإبل في شعره؛ من كبار شعراء عصره، امتدح عبد الملك بن مروان، وانضم إلى الفرزدق في هجاء جرير {cite:salabi-umayyad-state-2020 p.42}. يرى الكتاب أنه كان أموياً لأجل قومه، وأنه أراد من عبد الملك أن يرفع عن قومه ظلم الجباة {cite:salabi-umayyad-state-2020 p.43}."
  tr: "Ubayd bin Hüseyin el-Nimeiri, şiirlerinde sık sık develeri tarif ettiği için el-Ra'i olarak bilinir, zamanının büyük şairlerinden biriydi. Abdülmelik bin Mervan'ı övdü ve Cerir'in hicvinde el-Farazdaq ile birlikte yer aldı {cite:salabi-umayyad-state-2020 s.42}. Kitapta onun halkı için Emevi olduğunu ve Abd al-Malik'in halkından tahsilatçıların baskısını kaldırmasını istediğini belirtir {cite:salabi-umayyad-state-2020 s.43}."
  id: "Ubayd ibn Husayn al-Nimeiri, yang dikenal sebagai al-Ra'i karena sering menggambarkan unta dalam puisinya, adalah salah satu penyair besar pada zamannya. Ia memuji Abd al-Malik ibn Marwan dan bergabung dengan al-Farazdaq dalam satir Jarir {cite:salabi-umayyad-state-2020 hlm.42}. Buku ini menganggapnya sebagai Umayyah demi rakyatnya, dan bahwa ia ingin Abd al-Malik mengangkat penindasan para pemungut dari rakyatnya {cite:salabi-umayyad-state-2020 hlm.43}."
