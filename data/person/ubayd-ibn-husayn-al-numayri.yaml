summary:
  ar: "عبيد بن حصين النميري، المعروف بالراعي لكثرة وصفه الإبل في شعره؛ من كبار شعراء عصره، امتدح عبد الملك بن مروان، وانضم إلى الفرزدق في هجاء جرير {cite:salabi-umayyad-state-2020 p.42}. يرى الكتاب أنه كان أموياً لأجل قومه، وأنه أراد من عبد الملك أن يرفع عن قومه ظلم الجباة {cite:salabi-umayyad-state-2020 p.43}."
