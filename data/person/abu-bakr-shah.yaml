summary:
  ar: "بطاقة أولية لأبي بكر شاه بن ظفر خان، سلطان دلهي التغلقي الذي خلف فيروز شاه قبل أن يعزله ناصر الدين محمد شاه، توفي سنة ١٣٩٠م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu Bakr Shah ibn Zafar Khan, the Tughlaq sultan of Delhi who briefly succeeded Firuz Shah before Nasir al-Din Muhammad Shah deposed him, d. 1390; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Abu Bakr Shah ibn Zafar Khan, el sultán Tughlaq de Delhi que sucedió brevemente a Firuz Shah antes de que Nasir al-Din Muhammad Shah lo depusiera, fallecido en 1390; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche d'engagement d'Abu Bakr Shah ibn Zafar Khan, sultan Tughlaq de Delhi qui succéda brièvement à Firuz Shah avant d'être déposé par Nasir al-Din Muhammad Shah, mort en 1390; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "دہلی کے تغلق سلطان ابوبکر شاہ ابن ظفر خان کے لیے ڈرافٹ کارڈ جو ناصر الدین محمد شاہ کے معزول ہونے سے پہلے فیروز شاہ کا مختصر طور پر جانشین بنا، ڈی۔ 1390; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Firuz Şah'ın yerine geçen ve daha sonra Nasır el-Din Muhammed Şah tarafından tahttan indirilen Delhi'nin Tuğluk Sultanı Ebu Bekir Şah bin Zefar Han'a ait ön bir kart. 1390 yılında vefat etti; İslam ülkelerinin sözlüklerinde adı geçmektedir ve biyografisi henüz bu sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Abu Bakr Shah bin Zafar Khan, Sultan Tughluqi Delhi yang menggantikan Firuz Shah sebelum ia digulingkan oleh Nasir al-Din Muhammad Shah. Ia meninggal pada tahun 1390 M; ia disebutkan dalam kamus negara-negara Islam, dan biografinya belum ditinjau di halaman ini."
