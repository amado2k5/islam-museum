summary:
  ar: "ممثل ومخرج ومنتج هندي، وُلد في بومباي سنة 1965؛ من أبرز نجوم السينما الهندية منذ أواخر الثمانينيات، إذ قاد أفلامًا قياسية الإيرادات مثل «لغان» (2001) و«3 بلهاء» (2009) و«دانغال» (2016)، وفتح السوق الصينية أمام السينما الهندية، وقدّم البرنامج التلفزيوني الاجتماعي «ساتياميف جاياتي» وأسّس مؤسسة باني لمكافحة الجفاف. يُعرف بـ«السيد الكمالي»."
  en: "Indian actor, director and producer, born in Bombay in 1965 and known as 'Mr. Perfectionist'. He has been among the leading stars of Indian cinema since the late 1980s, heading record-breaking films such as Lagaan (2001), 3 Idiots (2009) and Dangal (2016), opened the Chinese market to Indian films, hosted the social-issues talk show Satyamev Jayate, and co-founded the Paani Foundation's drought work in Maharashtra."
  ur: "بھارتی اداکار، ہدایت کار و فلم ساز، 1965 میں بمبئی میں پیدا ہوئے؛ اسی کی دہائی کے اواخر سے ہندوستانی سنیما کے صفِ اول کے ستاروں میں سے ایک، «لگان» (2001)، «تھری ایڈیٹس» (2009) اور «دنگل» (2016) جیسی ریکارڈ توڑ فلموں کے مرکزی اداکار، جنہوں نے چینی منڈی ہندوستانی فلموں کے لیے کھولی، سماجی مسائل پر ٹیلی ویژن پروگرام «ستیمے وجتے» پیش کیا اور مہاراشٹر میں خشک سالی کے خلاف پانی فاؤنڈیشن کی بنیاد رکھی۔"
