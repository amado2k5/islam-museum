summary:
  ar: "الجلندى بن مسعود، إمام إباضي عمان؛ ما استقر السفاح في خلافته حتى تحرك خوارج عُمان وعلى رأسهم الجلندى وأصحابه من الخوارج الإباضية، فأرسل إليهم السفاح جيشاً على رأسه خازم بن خزيمة سار في البحر حتى أرسى على ساحل عمان؛ وتقاتلوا قتالاً شديداً كانت الحرب فيه سجالاً حتى أشار أصحاب خازم بإشعال المشاقة المغموسة بالنفط وضربها في بيوت أصحاب الجلندى الخشبية، فلما اشتغلوا ببيوتهم المحترقة وأهاليهم حمل عليهم فوضعوا فيهم السيف وقُتل الجلندى فيمن قتل، وبلغت عدة القتلى نحو عشرة آلاف وبعثوا رءوسهم إلى البصرة سنة ١٣٤ {cite:duha-islam p. 950}."
  en: "al-Julanda ibn Mas'ud — the Ibadi imam of Oman whose rising against al-Saffah was drowned in fire and sword by Khazim ibn Khuzayma, 134 AH {cite:duha-islam p. 950}."
  es: "al-Julanda ibn Mas'ud — el imán ibadí de Omán cuyo levantamiento contra al-Saffah fue ahogado en fuego y espada por Khazim ibn Khuzayma, 134 d. H. {cita: duha-islam p. 950}."
  fr: "al-Julanda ibn Mas'ud — l'imam ibadite d'Oman dont le soulèvement contre al-Saffah a été noyé dans le feu et l'épée par Khazim ibn Khuzayma, 134 AH {cite:duha-islam p. 950}."
  ur: "الجلندۃ ابن مسعود - عمان کا عبادی امام جس کا الصفح کے خلاف اٹھنا خزیم ابن خزیمہ، 134ھ نے آگ اور تلوار میں غرق کر دیا تھا۔ 950}۔"
  tr: "Umman'ın İbadi imamı El-Celandi bin Mesud; El-Safah halifeliğine yerleşmedi; ta ki Umman'daki Hariciler ve onun İbadi Haricileri önderliğinde hareket edene kadar halifeliğine yerleşmemişti. El-Safah, Hazım bin Huzım'ın komutasındaki bir ordu göndererek deniz yoluyla Umman kıyılarına ulaştılar. Şiddetli, şiddetli savaştılar, ta ki Hazim'in yoldaşları yağa batırılmış bir kelepçeyi yakıp El-Celandi'nin halkının ahşap evlerine vurmalarını emredene kadar. Yanan evlerini ve ailelerini işgal ettiklerinde onlara saldırdılar, kılıç dayadılar ve El-Celandi öldürülenleri öldürdü. Ölü sayısı yaklaşık on bine ulaştı ve 134 Hicri yılında başlarını Basra'ya gönderdiler {kaynak: Duha-İslam, s. 950}."
  id: "Al-Jalandi ibn Mas'ud, Imam Ibadi Oman; Al-Saffah baru menetap di kekhalifahannya sampai Kharijit Oman, dipimpin oleh Al-Jalandi dan Kharijit Ibadi-nya, bergerak. Al-Saffah mengirim pasukan yang dipimpin Khazim ibn Khuzaymah, yang berlayar melalui laut hingga mereka mendarat di pantai Oman. Mereka bertempur dengan sengit, dengan pertempuran sengit, hingga para rekan Khazim memerintahkan untuk menyalakan belenggu yang dicelup minyak dan menyerang rumah kayu milik rakyat Al-Jalandi. Ketika mereka menduduki rumah dan keluarga yang terbakar, mereka menyerang, menusuk pedang, dan Al-Jalandi membunuh yang tewas. Jumlah korban tewas mencapai sekitar sepuluh ribu, dan mereka mengirim kepala mereka ke Basra pada tahun 134 H {cite:Duha-Islam, hlm. 950}."
