summary:
  ar: "الجلندى بن مسعود، إمام إباضي عمان؛ ما استقر السفاح في خلافته حتى تحرك خوارج عُمان وعلى رأسهم الجلندى وأصحابه من الخوارج الإباضية، فأرسل إليهم السفاح جيشاً على رأسه خازم بن خزيمة سار في البحر حتى أرسى على ساحل عمان؛ وتقاتلوا قتالاً شديداً كانت الحرب فيه سجالاً حتى أشار أصحاب خازم بإشعال المشاقة المغموسة بالنفط وضربها في بيوت أصحاب الجلندى الخشبية، فلما اشتغلوا ببيوتهم المحترقة وأهاليهم حمل عليهم فوضعوا فيهم السيف وقُتل الجلندى فيمن قتل، وبلغت عدة القتلى نحو عشرة آلاف وبعثوا رءوسهم إلى البصرة سنة ١٣٤ {cite:duha-islam p. 950}."
  en: "al-Julanda ibn Mas'ud — the Ibadi imam of Oman whose rising against al-Saffah was drowned in fire and sword by Khazim ibn Khuzayma, 134 AH {cite:duha-islam p. 950}."
