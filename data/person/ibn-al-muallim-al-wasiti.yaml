summary:
  ar: "محمد بن علي المعروف بابن المعلم الواسطي الرثي، الملقب نجم الدين؛ الشاعر المشهور، كان شاعراً رقيق الشعر لطيف المحاسن حاذق الطبع يكاد شعره يذوب من رقته، وطال في نظم القريض عمره وساعده على قوله زمانه، وأكثر القول في الغزل والمدح وفنون المقاصد، وكان سهل الألفاظ صحيح المعاني يغلب على شعره وصف الشوق والحب وذكر الصبابة والغرام فعلق القلوب، وكان إذا نظم قصيدة حفظها الفقراء المنتسبون إلى الشيخ أحمد بن الرفاعي وغنوا بها في سماعاتهم {cite:wafayat-ayan}."
  en: "Ibn al-Mu'allim al-Wasiti — the tender Wasiti lyric poet 'Najm al-Din' whose ghazal and praise verse the Rifa'i dervishes memorised and sang in their sama' gatherings {cite:wafayat-ayan}."
