class: person
label: { ar: "ابن المعلم الواسطي", en: "Ibn al-Mu'allim al-Wasiti", es: "Ibn al-Mu'allim al-Wasiti", fr: "Ibn al-Mu'allim al-Wasiti", ur: "ابن المعلم الوصطی۔" }
summary:
  ar: "محمد بن علي المعروف بابن المعلم الواسطي الرثي، الملقب نجم الدين؛ الشاعر المشهور، كان شاعراً رقيق الشعر لطيف المحاسن حاذق الطبع يكاد شعره يذوب من رقته، وطال في نظم القريض عمره وساعده على قوله زمانه، وأكثر القول في الغزل والمدح وفنون المقاصد، وكان سهل الألفاظ صحيح المعاني يغلب على شعره وصف الشوق والحب وذكر الصبابة والغرام فعلق القلوب، وكان إذا نظم قصيدة حفظها الفقراء المنتسبون إلى الشيخ أحمد بن الرفاعي وغنوا بها في سماعاتهم {cite:wafayat-ayan}."
  en: "Ibn al-Mu'allim al-Wasiti — the tender Wasiti lyric poet 'Najm al-Din' whose ghazal and praise verse the Rifa'i dervishes memorised and sang in their sama' gatherings {cite:wafayat-ayan}."
  es: "Ibn al-Mu'allim al-Wasiti: el tierno poeta lírico wasiti 'Najm al-Din' cuyo ghazal y verso de alabanza los derviches rifai memorizaron y cantaron en sus reuniones de sama' {cita:wafayat-ayan}."
  fr: "Ibn al-Mu'allim al-Wasiti — le tendre poète lyrique Wasiti 'Najm al-Din' dont les derviches Rifa'i ont mémorisé et chanté le ghazal et les vers de louange lors de leurs rassemblements sama' {cite: wafayat-ayan}."
  ur: "ابن المعلم الوصیطی - ایک نرم وساطی گیت والا شاعر 'نجم الدین' جس کی غزل اور حمد کو رفاعی درویشوں نے حفظ کیا اور اپنی محفلوں میں گایا۔"
  tr: "Muhammed bin Ali, İbn el-Mu'allim el-Vasiti el-Rathi olarak bilinen, lakaplı adı Necmeddin; ünlü şair, zarif şiir, güzelliği narin ve ustaca mizaca sahip bir şairdi; şiirleri neredeyse inceliğinden eriyip giderdi. Uzun süre şiir yazmaya çalıştı ve zamanında şiir yazmasına yardımcı oldu. Aşk şiiri, övgü ve hedef sanatları üzerine geniş çapta konuştu. Sözlerinde sadeydi ve net anlamlara sahipti; şiirleri özlem ve aşkı anlatır, özlem ve tutkudan bahseder, kalpleri birleştirirdi. Bir şiir yazdığında, Şeyh Ahmed bin el-Rifa'i'ye bağlı yoksullar onu kulaklarına okarlardı {atıf:wafayat-ayan}."
  id: "Muhammad ibn Ali, yang dikenal sebagai Ibn al-Mu'allim al-Wasiti al-Rathi, dijuluki Najm al-Din; penyair terkenal, adalah penyair puisi yang lembut, halus dalam keindahan, dan temperamen terampil, yang puisinya hampir meleleh karena kelembutannya. Ia menghabiskan waktu lama menulis puisi dan membantunya menulis puisi pada zamannya. Ia banyak berbicara tentang puisi cinta, pujian, dan seni tujuan. Ia sederhana dalam kata-kata dan memiliki makna yang jelas, dengan puisi menggambarkan kerinduan dan cinta, menyebutkan kerinduan dan gairah, serta menghubungkan hati. Ketika ia menulis puisi, orang miskin yang berafiliasi dengan Sheikh Ahmad ibn al-Rifa'i akan membacakannya di telinga mereka {cite:wafayat-ayan}."
