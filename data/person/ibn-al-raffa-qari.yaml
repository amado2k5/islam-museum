id: person/ibn-al-raffa-qari
class: person
label: { ar: "أبو الحسين ابن الرفاء القارئ" }
summary:
  ar: "أبو الحسين ابن الرفاء القارئ، تلميذ أبي الحسن بن الخشاب مليح الصوت حسن التلاوة، كان من أحسن الناس قراءة مع أبي عبد الله ابن الدجاجي، واعترض الأسيفر المنتفقي الحاج سنة أربع وتسعين فدخلا إليه فوهب لهما الحاج وأموالهم وذلك يزيد على ألف ألف دينار، ولما ورد أبو الحسين بن بويه بغداد أخذهما ورتبهما لصلاة التراويح فكانا يتناوبان الصلاة ورغب الناس لأجلهما في صلاة التراويح {cite:muntazam-ibn-al-jawzi j.7 p.227-228}."
  tr: "Ebu el-Hüseyin bin el-Rifa, Ebu el-Hasan ibn el-Khashab'ın öğrencisi, hoş bir sesi ve güzel bir okumasıyla Ebu Abdullah ibn al-Dajaji ile birlikte en iyi okunucular arasındaydı. Doksan dördüncü yılda, el-Seyfir el-Muntafiqi hacıyla karşılaştı, bu yüzden hacılar binin üzerinde servetlerini hediye etti. Ebu el-Hüseyin bin Buyah Bağdat'a geldiğinde onları aldı ve teraviye namazları için ayarladı, böylece sırayla namaz kıldılar ve insanlar onların sayesindeyken teravih namazlarına katılmaya teşvik edildi {cite:muntazam-ibn-al-jawzi J.7, s.227-228}."
  id: "Abu al-Husayn ibn al-Rifa, sang pembaca, seorang murid Abu al-Hasan ibn al-Khashab, dengan suara yang menyenangkan dan bacaan yang indah, adalah salah satu pembaca terbaik bersama Abu Abdullah ibn al-Dajaji. Pada tahun sembilan puluh empat, al-Sayfir al-Muntafiqi menghadapi para peziarah, sehingga mereka masuk dan memberikan kekayaan yang melebihi seribu dinar. Ketika Abu al-Husayn ibn Buyah tiba di Baghdad, ia membawa mereka dan mengatur salat Taraweeh, sehingga mereka bergantian berdoa, dan orang-orang mendorong mereka untuk menghadiri shalat Taraweeh karena mereka {cite:muntazam-ibn-al-jawzi J.7, hlm.227-228}."
