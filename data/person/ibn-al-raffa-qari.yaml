summary:
  ar: "أبو الحسين ابن الرفاء القارئ، تلميذ أبي الحسن بن الخشاب مليح الصوت حسن التلاوة، كان من أحسن الناس قراءة مع أبي عبد الله ابن الدجاجي، واعترض الأسيفر المنتفقي الحاج سنة أربع وتسعين فدخلا إليه فوهب لهما الحاج وأموالهم وذلك يزيد على ألف ألف دينار، ولما ورد أبو الحسين بن بويه بغداد أخذهما ورتبهما لصلاة التراويح فكانا يتناوبان الصلاة ورغب الناس لأجلهما في صلاة التراويح {cite:muntazam-ibn-al-jawzi j.7 p.227-228}."
