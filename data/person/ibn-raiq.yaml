summary:
  ar: "أبو بكر محمد بن رائق؛ أمير الأمراء؛ استولى على الخلافة وخرج على طاعتها فأنفِذ إليه تدبير المملكة وجُعل أمير الأمراء وردت إليه أعمال الخراج والقضاء وحسم النواضح وأُمر أن يُخطب له على جميع المنابر فقوي أمره وعظم شأنه وتصرف على حسب اختياره؛ واحتاط على أملاك ابن مقلة وضباعه وأملاك ولده أبي الحسين؛ ثم سعى به ابن مقلة لدى الراضي بالله حتى اتفق معه على إمساكه فأظهر الراضي ابن مقلة من الاعتقال وحضر حاجب ابن رائق وجماعة من القواد وتقابلوا وكان ابن رائق قد ألزم قطع يد ابن مقلة اليمنى التي كتب بها تلك المكاتبات فلما انتهى الكلام قُطعت يده اليمنى ورد إلى محبسه؛ ثم آل أمر ابن رائق إلى أن قُتل بالموصل {cite:wafayat-ayan}."
  en: "Abu Bakr Muhammad Ibn Ra'iq — the first amir al-umara'; took de facto control of the caliphate under al-Radi, had himself prayed for on all minbars, seized Ibn Muqla's estates and had the vizier's writing hand cut off; ended assassinated at Mosul by Nasir al-Dawla Ibn Hamdan {cite:wafayat-ayan}."
  es: "Abu Bakr Muhammad Ibn Ra'iq — el primer amir al-umara'; tomó el control de facto del califato bajo al-Radi, hizo que se rezara por él en todos los minbares, se apoderó de las propiedades de Ibn Muqla e hizo que le cortaran la mano con la que escribía al visir; terminó asesinado en Mosul por Nasir al-Dawla Ibn Hamdan {cite:wafayat-ayan}."
  fr: "Abou Bakr Muhammad Ibn Ra'iq — le premier amir al-umara'; prit le contrôle de facto du califat sous al-Radi, se fit prier sur tous les minbars, s'empara des biens d'Ibn Muqla et fit couper la main du vizir; finit assassiné à Mossoul par Nasir al-Dawla Ibn Hamdan {cite:wafayat-ayan}."
  ur: "ابوبکر محمد ابن رقیق - پہلے امیر العمرہ؛ اس نے الرادی کے تحت خلافت کا حقیقی کنٹرول سنبھال لیا، خود تمام منبروں پر دعا مانگی، ابن مقلہ کی جاگیروں پر قبضہ کر لیا اور وزیر کا تحریری ہاتھ کاٹ دیا۔ ناصر الدولہ ابن حمدان کے ذریعہ موصل میں قتل کیا گیا۔"
  tr: "Prensler Emiri Ebu Bekir Muhammed bin Ra'iq halife ele geçirdi, ona karşı isyan etti ve krallığın yönetimini ona emanet etti, Prensler Emiri olarak atadı ve vergiler, yargı ve yerleşimlerin çözümüyle ilgili görevlerde ona atandı. Tüm kürsülerde vaaz vermesini emretti, konumunu güçlendirdi, statüsünü yükseltti ve kendi seçimine göre hareket etti. İbn Muqla'nın malları, sırtlanları ve oğlunun mallarıyla ilgilendi Ebu el-Hüseyin. Sonra İbn Muqla, onu Al-Radi Billah'tan aradı, ta ki tutuklamayı kabul edene kadar. El-Radi, İbn Muqla'yı tutuklamadan serbest bıraktı ve İbn Ra'iq'in başrahip ile bir grup komutan, İbn Ra'iq'in sağ eliyle buluştu; bu el mektupları yazmak için kullanıldı. Konuşma sona erdiğinde sağ eli kesildi ve hapishanesine geri gönderildi. İbn Ra'iq'in işleri Musul'da öldürülene kadar devam etti {alıntı:) Wafayat-ayan}."
  id: "Abu Bakr Muhammad ibn Ra'iq, Emir para Pangeran, merebut kekhalifahan, memberontak terhadapnya, dan mempercayakan kepadanya untuk mengelola kerajaan, mengangkat Emir para Pangeran, dan ditugaskan kepadanya dalam urusan pajak, peradilan, dan penyelesaian pemukiman. Ia memerintahkan agar Ibn Muqla menyampaikan khotbah di semua mimbar, memperkuat posisinya, meningkatkan statusnya, dan bertindak sesuai keinginannya. Ia mengurus properti Ibn Muqla, hyena, dan properti putranya Abu al-Husayn. Kemudian Ibn Muqla mencarinya dari Al-Radi Billah sampai dia setuju untuk menangkapnya. Al-Radi membebaskan Ibn Muqla dari penahanan, dan kamarawan Ibn Ra'iq beserta sekelompok komandan bertemu dan bertemu dengan tangan kanan Ibn Ra'iq, yang digunakan untuk menulis surat-surat itu. Ketika percakapan berakhir, tangan kanannya dipotong dan dia dikembalikan ke penjaranya. Urusan Ibn Ra'iq berlanjut sampai dia dibunuh di Mosul {cite:Wafayat-Ayan}."
