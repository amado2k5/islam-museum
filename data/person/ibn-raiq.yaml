summary:
  ar: "أبو بكر محمد بن رائق؛ أمير الأمراء؛ استولى على الخلافة وخرج على طاعتها فأنفِذ إليه تدبير المملكة وجُعل أمير الأمراء وردت إليه أعمال الخراج والقضاء وحسم النواضح وأُمر أن يُخطب له على جميع المنابر فقوي أمره وعظم شأنه وتصرف على حسب اختياره؛ واحتاط على أملاك ابن مقلة وضباعه وأملاك ولده أبي الحسين؛ ثم سعى به ابن مقلة لدى الراضي بالله حتى اتفق معه على إمساكه فأظهر الراضي ابن مقلة من الاعتقال وحضر حاجب ابن رائق وجماعة من القواد وتقابلوا وكان ابن رائق قد ألزم قطع يد ابن مقلة اليمنى التي كتب بها تلك المكاتبات فلما انتهى الكلام قُطعت يده اليمنى ورد إلى محبسه؛ ثم آل أمر ابن رائق إلى أن قُتل بالموصل {cite:wafayat-ayan}."
  en: "Abu Bakr Muhammad Ibn Ra'iq — the first amir al-umara'; took de facto control of the caliphate under al-Radi, had himself prayed for on all minbars, seized Ibn Muqla's estates and had the vizier's writing hand cut off; ended assassinated at Mosul by Nasir al-Dawla Ibn Hamdan {cite:wafayat-ayan}."
