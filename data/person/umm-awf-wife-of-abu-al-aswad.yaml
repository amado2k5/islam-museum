gender: female
roles: [poet]
summary:
  ar: "امرأة فصيحة خاصمت زوجها أبا الأسود الدؤلي بعد طلاقها في مجلس معاوية على حضانة ابنهما، فقضى لها؛ يروي خبرها كحالة في «أعلام النساء» مثالاً على البلاغة."
  en: "An eloquent woman who, after her divorce, disputed with her husband Abu al-Aswad al-Du'ali before Mu'awiya over the custody of their son and won; Kahhala's A'lam al-Nisa' gives the story as an example of eloquence."
  ur: "ایک فصیح خاتون جنہوں نے طلاق کے بعد اپنے شوہر ابو الاسود دؤلی سے معاویہ کی مجلس میں اپنے بیٹے کی پرورش پر مقدمہ لڑا اور جیت گئیں؛ کحالہ کی «اعلام النساء» یہ واقعہ بلاغت کی مثال کے طور پر نقل کرتی ہے۔"
  es: "Una mujer elocuente que, tras su divorcio, disputó con su marido Abu al-Aswad al-Du'ali ante Mu'awiya la custodia de su hijo y ganó; el A'lam al-Nisa' de Kahhala presenta esta historia como un ejemplo de elocuencia."
  fr: "Une femme éloquente qui, après son divorce, s'est disputée avec son mari Abu al-Aswad al-Du'ali devant Mu'awiya au sujet de la garde de leur fils et a gagné; A'lam al-Nisa' de Kahhala donne l'histoire comme exemple d'éloquence."
  tr: "Boşandıktan sonra kocası Ebu el-Esvad el-Du'ali'yi oğullarının velayeti konusunda Muaviye mahkemesinde itiraz eden etkileyici bir kadın, bu karar aleyhine karar verdi; hikayesi \"A'lam al-Nisa\"da bir vaka olarak anlatılır ve bu bir ifade örneğidir."
  id: "Seorang wanita yang fasih memperdebatkan suaminya Abu al-Aswad al-Du'ali setelah perceraiannya di pengadilan Muawiya mengenai hak asuh putra mereka, yang memutuskan melawannya; kisahnya diceritakan sebagai kasus dalam \"A'lam al-Nisa\" sebagai contoh kefasihan."
