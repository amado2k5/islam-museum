    ar: "الفرزدق همام بن غالب الشاعر؛ مدح عند البلاذري نهر المبارك الذي حفره القسري بقوله «إن المبارك كاسمه يسقى به نهراً»."
    en: "Al-Farazdaq, Hammam ibn Ghalib the poet — per al-Baladhuri he praised the Mubarak canal dug by al-Qasri in the line 'al-Mubarak, like its name, waters river upon river'."
    ur: "فرزدق، ہمام بن غالب شاعر — بلاذری کے مطابق انہوں نے قسری کی کھدائی ہوئی نہرِ مبارک کی مدح میں کہا «مبارک اپنے نام کی طرح نہروں کو سیراب کرتا ہے»۔"
    sources: [source/futuh-buldan-maarif-1407, source/tarikh-khulafa-minhaj-1434]
