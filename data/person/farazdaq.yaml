summary:
  ar: "همام بن غالب الشاعر؛ عند البلاذري مدح نهر المبارك الذي حفره خالد بن عبد الله القسري بشعر منه «إن المبارك كاسمه يسقى به نهراً يفيض له على الأنهاد». وكتب الأخرم ملك الروم إلى الوليد حين هدم البيعة إن هذه البيعة قد أقرها من كان قبلك فإن يكونوا أصابوا فقد أخطأت وإن تكن أصبت فقد أخطأوا فأجابه الفرزدق بالآية ففهمناها سليمان وكلاً آتينا حكماً وعلماً {cite:muruj-al-dhahab p. 157}، ورثى عمر بن عبد العزيز فقال أقول لما نعى الناعون لي عمراً لقد نعيتم قوام الحق والدين بدير سمعان قسطاس الموازين {cite:muruj-al-dhahab p. 184}"
  en: "Hammam ibn Ghalib the poet; in al-Baladhuri he praised al-Mubarak canal which Khalid ibn Abdallah al-Qasri dug."
