summary:
  ar: "عالم سنغالي (1914–1989)، ابن الشيخ أحمدو بمبا والخليفة العام الثالث للمريدية من سنة 1968 حتى وفاته. في عهده عرفت طوبى توسعًا عمرانيًا سريعًا: مستشفى ومخفر ومواقف وأسواق، وتوسيع الجامع الكبير وتزيينه على الطراز المغربي، وبناء مكتبة ضمّت 170 ألف كتاب."
  en: "Senegalese scholar (1914-1989), son of Sheikh Ahmadou Bamba and third caliph-general of the Mourides from 1968 until his death. Under him Touba expanded rapidly: a hospital, a gendarmerie, bus stations and markets, the enlargement and Moroccan-style decoration of the Great Mosque, and a library holding 170,000 volumes."
  ur: "سینیگال کے عالم (1914ء–1989ء)، شیخ احمد بمبا کے فرزند اور مریدیہ کے تیسرے خلیفہ عام، 1968ء سے اپنی وفات تک۔ ان کے عہد میں طوبیٰ نے تیز عمرانی وسعت دیکھی: ہسپتال، ژاندارمری، بس اڈے اور بازار، جامع مسجد کی توسیع اور مراکشی طرز کی تزئین، اور ایک لائبریری جس میں ایک لاکھ ستر ہزار کتابیں تھیں۔"
