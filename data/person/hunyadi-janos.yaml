summary:
  ar: "يوحنا هنيادي؛ القائد المجري الذي تولى قيادة قوات الحلف الصليبي ضد العثمانيين في عهد مراد الثاني، زحف جنوباً واجتاز الدانوب وأوقع بالعثمانيين هزيمتين فادحتين عام ٨٤٦هـ/١٤٤٢م فاضطروا إلى طلب الصلح، وأبرمت معاهدة سيزجادن لعشر سنين سنة ٨٤٨هـ/١٤٤٤م {cite:dawlat-uthmaniyya-salabi p. 80}."
  en: "John Hunyadi — the Hungarian commander of the crusader host against Murad II; he crossed the Danube and inflicted two sharp defeats on the Ottomans in 846/1442, forcing them to sue for the ten-year peace concluded at Szeged in 848/1444 {cite:dawlat-uthmaniyya-salabi p. 80}."
  es: "Juan Hunyadi, comandante húngaro del ejército cruzado contra Murad II, cruzó el Danubio e infligió dos duras derrotas a los otomanos en 846/1442, obligándolos a solicitar la paz de diez años concluida en Szeged en 848/1444 {cite:dawlat-uthmaniyya-salabi p. 80}."
  fr: "Jean Hunyadi — le commandant hongrois de l'armée croisée contre Murad II; il traversa le Danube et infligea deux défaites cuisantes aux Ottomans en 846/1442, les forçant à demander la paix de dix ans conclue à Szeged en 848/1444 {cite:dawlat-uthmaniyya-salabi p. 80}."
  ur: "جان ہنیادی — مراد II کے خلاف صلیبی میزبان کا ہنگری کا کمانڈر؛ اس نے ڈینیوب کو عبور کیا اور 846/1442 میں عثمانیوں کو دو شدید شکستیں دیں، جس سے وہ 848/1444 میں شیزڈ میں ختم ہونے والے دس سالہ امن کے لیے مقدمہ کرنے پر مجبور ہو گئے۔ 80}۔"
  tr: "Murad II döneminde Haçlı kuvvetlerini Osmanlılara karşı yöneten Macar komutan John Henyadi, güneye doğru ilerledi, Tuna'yı geçti ve 846 Hicri/1442 M.S. Osmanlılara iki ağır yenilgi yaşattırdı, onları barış aramaya zorladı. On Yıllık Sizgaden Antlaşması 848 Hicri/1444 yılında imzalandı {cite:dawlat-uthmaniyya-salabi s. 80}."
  id: "John Henyadi, komandan Hungaria yang memimpin pasukan Tentara Salib melawan Ottoman pada masa pemerintahan Murad II, maju ke selatan, menyeberangi Danube, dan memberikan dua kekalahan telak pada Ottoman pada 846 H/1442 M, memaksa mereka mencari perdamaian. Perjanjian Sepuluh Tahun Sizgaden disepakati pada 848 H/1444 M {cite:dawlat-uthmaniyya-salabi hlm. 80}."
