summary:
  ar: "الحافظ شيخ الإسلام أحمد بن علي بن حجر العسقلاني، صاحب إنباء الغمر وغيرها، عمل قصيدته المشهورة في مدح الخليفة المستعين لما بويع بالسلطنة الملك أصبح ثابت الأساس، واعتمد عليه المؤلف في الحوادث إلى سنة خمسين وثمان مئة، ومات في أيام المستكفي الثاني {cite:tarikh-khulafa-minhaj-1434 p. 765,774,781}."
  en: "Shaykh al-Islam Ibn Hajar al-Asqalani, author of Inba' al-Ghumr — Suyuti's source for events to 850 — who hymned the caliph-sultan al-Musta'in and died under al-Mustakfi II {cite:tarikh-khulafa-minhaj-1434 p. 765,774,781}."
