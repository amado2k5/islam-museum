summary:
  ar: "محدث ومؤرخ وقاضي قضاة مصري، وُلد بالقاهرة سنة 773هـ/1372م وتوفي سنة 852هـ/1449م. درس الحديث على العراقي، وتولى التدريس في الخانقاه البيبرسية والإفتاء ومكتبة المحمودية، وشغل قضاء القضاة نحو واحد وعشرين عاماً مع عزل وإعادة متكررين. اشتهر بفتح الباري شرح صحيح البخاري، وبالإصابة وتهذيب التهذيب ولسان الميزان والدرر الكامنة وإنباء الغمر. {cite:tarikh-khulafa-minhaj-1434 p. 765,774,781} {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}"
  en: "Egyptian hadith scholar, historian and chief judge, born in Cairo in 773/1372 and died in 852/1449. He studied hadith under al-Iraqi, taught at the Baybarsiyya khanqah, served as mufti and librarian of the Mahmudiyya, and held the chief judgeship for about twenty-one years in all, with repeated dismissals and reinstatements. He is known for Fath al-Bari on al-Bukhari's Sahih, and for al-Isaba, Tahdhib al-Tahdhib, Lisan al-Mizan, al-Durar al-Kamina and Inba' al-Ghumr. {cite:tarikh-khulafa-minhaj-1434 p. 765,774,781} {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}"
  ur: "مصری محدث، مؤرخ اور قاضی القضاۃ، جو 773ھ/1372ء میں قاہرہ میں پیدا ہوئے اور 852ھ/1449ء میں فوت ہوئے۔ انہوں نے عراقی سے حدیث پڑھی، خانقاہ بیبرسیہ میں پڑھایا، مفتی اور کتب خانہ محمودیہ کے منتظم رہے، اور بار بار معزولی اور بحالی کے ساتھ کل تقریباً اکیس سال قاضی القضاۃ رہے۔ وہ صحیح بخاری کی شرح فتح الباری، اور الاصابہ، تہذیب التہذیب، لسان المیزان، الدرر الکامنہ اور انباء الغمر کے لیے مشہور ہیں۔ {cite:tarikh-khulafa-minhaj-1434 p. 765,774,781} {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}"
  es: "Erudito egipcio de hadices, historiador y juez principal, nacido en El Cairo en 773/1372 y fallecido en 852/1449. Estudió hadices con al-Iraqi, enseñó en la khanqah Baybarsiyya, fue muftí y bibliotecario de la Mahmudiyya, y ocupó el cargo de juez principal durante aproximadamente veintiún años, con repetidos despidos y reincorporaciones. Es conocido por Fath al-Bari sobre el Sahih de al-Bujari, y por al-Isaba, Tahdhib al-Tahdhib, Lisan al-Mizan, al-Durar al-Kamina e Inba' al-Ghumr. {cite:tarikh-khulafa-minhaj-1434 p. 765,774,781} {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}"
  fr: "Érudit égyptien du hadith, historien et grand juge, né au Caire en 773/1372 et mort en 852/1449. Il étudia le hadith auprès d'al-Iraqi, enseigna à la khanqah de Baybarsiyya, fut mufti et bibliothécaire de la Mahmudiyya, et occupa la fonction de grand juge pendant environ vingt et un ans, malgré plusieurs destitutions et réintégrations. Il est connu pour son commentaire de Fath al-Bari sur le Sahih d'al-Bukhari, ainsi que pour ses ouvrages al-Isaba, Tahdhib al-Tahdhib, Lisan al-Mizan, al-Durar al-Kamina et Inba' al-Ghumr."
  tr: "Mısırlı bir hadis âlimi, tarihçi ve yargıç, 773 H/1372 yılında Kahire'de doğmuş ve 852 Hicri/1449 yılında ölmüştür. El-Irak'ın yanında hadis eğitimi aldı, Baybarsiya Hanka, Fetva Enstitüsü ve Mahmudiye Kütüphanesi'nde ders verdi ve yaklaşık yirmi bir yıl boyunca yargıçlık yaptı; defalarca görevden alındı ve yeniden atandı. Sahih al-Buhari üzerine fıshi olan Fath al-Bari, Al-Isabah, Tahdhib al-Tahdhib, Lisan al-Mizan, al-Durar al-Kamina ve Inba'al-Ghamr için yaptığı tefsir eserleriyle ünlendi. {citasyon:] Tarikh-Khulafa-Minhaj-1434 s. 765,774,781} {kaynak: İslam Ansiklopedisi-2 cilt 3 s. 808}"
  id: "Seorang cendekiawan hadis Mesir, sejarawan, dan hakim, lahir di Kairo pada tahun 773 H/1372 M dan meninggal pada tahun 852 H/1449 M. Ia mempelajari hadis di bawah bimbingan al-Iraqi, mengajar di Baybarsiya Khanqah, Institut Fatwa, dan Perpustakaan Mahmoudiya, serta menjabat sebagai hakim selama sekitar dua puluh satu tahun dengan beberapa kali pemecatan dan pengangkatan ulang. Ia menjadi terkenal karena Fath al-Bari, komentar atas Sahih al-Bukhari, serta Al-Isabah, Tahdhib al-Tahdhib, Lisan al-Mizan, al-Durar al-Kamina, dan Inba' al-Ghamr. {cite:Tarikh-Khulafa-Minhaj-1434 hlm. 765,774,781} {cite:Encyclopaedia-of-Islam-2 vol. 3 hlm. 808}"
