id: person/ibn-hajar-al-asqalani
class: person
tags: [madhahib-browser, mh-shafii]
label: { ar: "شيخ الإسلام ابن حجر العسقلاني" }
summary:
  ar: "محدث ومؤرخ وقاضي قضاة مصري، وُلد بالقاهرة سنة 773هـ/1372م وتوفي سنة 852هـ/1449م. درس الحديث على العراقي، وتولى التدريس في الخانقاه البيبرسية والإفتاء ومكتبة المحمودية، وشغل قضاء القضاة نحو واحد وعشرين عاماً مع عزل وإعادة متكررين. اشتهر بفتح الباري شرح صحيح البخاري، وبالإصابة وتهذيب التهذيب ولسان الميزان والدرر الكامنة وإنباء الغمر. {cite:tarikh-khulafa-minhaj-1434 p. 765,774,781} {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}"
  en: "Egyptian hadith scholar, historian and chief judge, born in Cairo in 773/1372 and died in 852/1449. He studied hadith under al-Iraqi, taught at the Baybarsiyya khanqah, served as mufti and librarian of the Mahmudiyya, and held the chief judgeship for about twenty-one years in all, with repeated dismissals and reinstatements. He is known for Fath al-Bari on al-Bukhari's Sahih, and for al-Isaba, Tahdhib al-Tahdhib, Lisan al-Mizan, al-Durar al-Kamina and Inba' al-Ghumr. {cite:tarikh-khulafa-minhaj-1434 p. 765,774,781} {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}"
  ur: "مصری محدث، مؤرخ اور قاضی القضاۃ، جو 773ھ/1372ء میں قاہرہ میں پیدا ہوئے اور 852ھ/1449ء میں فوت ہوئے۔ انہوں نے عراقی سے حدیث پڑھی، خانقاہ بیبرسیہ میں پڑھایا، مفتی اور کتب خانہ محمودیہ کے منتظم رہے، اور بار بار معزولی اور بحالی کے ساتھ کل تقریباً اکیس سال قاضی القضاۃ رہے۔ وہ صحیح بخاری کی شرح فتح الباری، اور الاصابہ، تہذیب التہذیب، لسان المیزان، الدرر الکامنہ اور انباء الغمر کے لیے مشہور ہیں۔ {cite:tarikh-khulafa-minhaj-1434 p. 765,774,781} {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}"
