id: person/husayn-ibn-yahya-al-ansari
class: person
label: { ar: "حسين بن يحيى الأنصاري" }
gender: male
roles: [governor]
summary:
  ar: "حسين بن يحيى الأنصاري، والي سرقسطة؛ تآمر سنة ١٥٧هـ مع سليمان بن يقظان الأعرابي والي برشلونة وجيرندة وعبد الرحمن بن حبيب الصقلبي على خلع عبد الرحمن الداخل بتشجيع من الخليفة المهدي، ووافق على مخطط الاتصال بشارلمان؛ لكنه لما اجتمعت الجيوش الكارولنجية أمام سرقسطة استعاد المتآمرون صوابهم وأدركوا فداحة الخطأ، فرفض المضي في تنفيذ المؤامرة وأغلق أبواب المدينة في وجه القوات الكارولنجية {cite:tarikh-dawla-abbasiyya-taqqush p. 80-81}."
  en: "Husayn ibn Yahya al-Ansari — governor of Saragossa who joined the Paderborn conspiracy then repented and shut his city's gates in Charlemagne's face {cite:tarikh-dawla-abbasiyya-taqqush p. 80-81}."
  es: "Husayn ibn Yahya al-Ansari — gobernador de Zaragoza que se unió a la conspiración de Paderborn, luego se arrepintió y cerró las puertas de su ciudad en la cara de Carlomagno {cite:tarikh-dawla-abbasiyya-taqqush p. 80-81}."
  fr: "Husayn ibn Yahya al-Ansari — gouverneur de Saragosse qui a rejoint la conspiration de Paderborn puis s'est repenti et a fermé les portes de sa ville au nez de Charlemagne {cite:tarikh-dawla-abbasiyya-taqqush p. 80-81}."
  ur: "حسین بن یحییٰ الانصاری - ساراگوسا کا گورنر جو پیڈربورن سازش میں شامل ہوا پھر توبہ کی اور اپنے شہر کے دروازے شارلمین کے چہرے پر بند کر لیے۔ 80-81}۔"
  tr: "Zaragoza valisi Hüseyin bin Yahya el-Ensari, 157 Hicri yılında Barselona ve Gironda valisi Süleyman bin Yaqzan el-A'rabi ile Abd al-Rahman ibn Habib al-Saqlabi ile birlikte Halife al-Mahdi'nin teşvikiyle Abd al-Rahman al-Dakhil'i tahttan indirmek için komplo kurdu. Charlemagne ile temas kurma planını kabul etti; ancak Karolenj orduları Zaragoza önünde toplandığında, komplocular kendilerini toparladı ve hatanın ciddiyetini anladı. Komployu sürdürmeyi reddetti ve şehir kapılarını Karolenj kuvvetlerine kapattı {cite:history-dawla-abbasiyya-taqqush, s. 80-81}."
  id: "Hussein ibn Yahya al-Ansari, gubernur Zaragoza, bersekongkol pada tahun 157 H bersama Suleiman ibn Yaqzan al-A'rabi, gubernur Barcelona dan Gironda, serta Abd al-Rahman ibn Habib al-Saqlabi, untuk menggulingkan Abd al-Rahman al-Dakhil dengan dorongan dari Khalifah al-Mahdi. Ia menyetujui rencana untuk menghubungi Charlemagne; namun, ketika pasukan Carolingian berkumpul di depan Zaragoza, para konspirator kembali tenang dan menyadari betapa seriusnya kesalahan tersebut. Ia menolak melanjutkan rencana tersebut dan menutup gerbang kota bagi pasukan Carolingian {cite:history-dawla-abbasiyya-taqqush, hlm. 80-81}."
