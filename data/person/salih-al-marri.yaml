summary:
  ar: "أبو بشير صالح بن بشير القارئ المعروف بالمري؛ من أهل البصرة؛ زاهد واعظ بصري؛ كان مولىً لامرأة من بني مرة بن الحارث بن عبد القيس؛ دخل على المهدي بالرصافة فلما مثُل بين يديه قال: يا أمير المؤمنين...؛ قال عفان بن مسلم: كنا نأتي مجلس صالح المري نحضره وهو يقصّ وكان كأنه تكلى؛ ضعّفه ابن معين والدارقطني وقال البخاري: منكر الحديث {cite:wafayat-ayan}."
  en: "Abu Bishr Salih b. Bashir, 'al-Marri' (d. 186) — Basran ascetic preacher (qass) who admonished al-Mahdi at al-Rusafa; graded weak by Ibn Ma'in, al-Daraqutni and al-Bukhari {cite:wafayat-ayan}."
