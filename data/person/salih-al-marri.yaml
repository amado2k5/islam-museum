died: { edtf: "0802~", hijri: "0186", calendar: julian, precision: year, status: tradition, derived: true, note: "مات سنة ست وثمانين ومائة {cite:wafayat-ayan}." }
summary:
  ar: "أبو بشير صالح بن بشير القارئ المعروف بالمري؛ من أهل البصرة؛ زاهد واعظ بصري؛ كان مولىً لامرأة من بني مرة بن الحارث بن عبد القيس؛ دخل على المهدي بالرصافة فلما مثُل بين يديه قال: يا أمير المؤمنين...؛ قال عفان بن مسلم: كنا نأتي مجلس صالح المري نحضره وهو يقصّ وكان كأنه تكلى؛ ضعّفه ابن معين والدارقطني وقال البخاري: منكر الحديث {cite:wafayat-ayan}."
  en: "Abu Bishr Salih b. Bashir, 'al-Marri' (d. 186) — Basran ascetic preacher (qass) who admonished al-Mahdi at al-Rusafa; graded weak by Ibn Ma'in, al-Daraqutni and al-Bukhari {cite:wafayat-ayan}."
  es: "Abu Bishr Salih b. Bashir, 'al-Marri' (m. 186): predicador asceta de Basrán (qass) que amonestó a al-Mahdi en al-Rusafa; calificado como débil por Ibn Ma'in, al-Daraqutni y al-Bukhari {citar:wafayat-ayan}."
  fr: "Abou Bishr Salih b. Bashir, 'al-Marri' (mort en 186) — Prédicateur ascétique basran (qass) qui a réprimandé al-Mahdi à al-Rusafa; noté faible par Ibn Ma'in, al-Daraqutni et al-Bukhari {cite: wafayat-ayan}."
  ur: "ابو بشر صالح بن بشیر، 'المری' ⁦(متوفی 186)⁩ - بصران کے متعصب مبلغ ⁦(قاس)⁩ جس نے الرصافہ میں المہدی کو نصیحت کی۔ اسے ابن معین، الدارقطنی اور البخاری نے ضعیف قرار دیا ہے۔"
  tr: "Ebu Beşir Salih bin Beşîr, ünlü okunan El-Mürri; Basra'dan; münzevi, vaiz ve Basra; Banu Murra bin El-Haris bin Abdül-Kais'ten bir kadının özgür adamıydı; El-Rusefa Mahdi'sine girdi ve karşısına çıktığında dedi ki: Ey Müminlerin Komutanı...; Affan bin Müslim şöyle dedi: Salih el-Merri'nin hikayeler anlatırken ona katılmak için toplantısına gelirdik ve sanki okuyormuş gibiydi; İbn Ma'in ve El-Daraqutni onu zayıflattı, El-Buhari dedi ki: Hadis reddedildi {atıf:vafayat-ayan}."
  id: "Abu Bashir Salih bin Bashir, pembaca terkenal bernama Al-Murri; dari Basra; pertapa dan pengkhotbah, dan Basra; dia adalah mantan dari seorang wanita dari Banu Murrah bin Al-Harith bin Abd al-Qais; dia memasuki Mahdi di Al-Rusafa, dan ketika dia muncul di hadapannya, dia berkata: Wahai Panglima Orang Beriman...; Affan bin Muslim berkata: Kami biasa datang ke pertemuan Salih Al-Marri untuk menghadirinya saat dia bercerita, dan seolah-olah dia sedang membacakan cerita; Ibn Ma'in dan Al-Daraqutni melemahkannya, dan Al-Bukhari berkata: Hadis ditolak {cite:wafayat-ayan}."
