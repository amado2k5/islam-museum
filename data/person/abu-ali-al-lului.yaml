summary:
  ar: "أبو علي محمد بن أحمد بن عمر اللؤلؤي، تلميذ أبي داود السجستاني وأحد الراويين اللذين تروى عنهما سنن أبي داود ⁦(مع ابن داسة)⁩؛ غير الحسن بن زياد اللؤلؤي صاحب أبي حنيفة {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  en: "Abu 'Ali Muhammad ibn Ahmad ibn 'Umar al-Lu'lu'i, a student of Abu Dawud al-Sijistani and, with Ibn Dasa, one of the two transmitters through whom Abu Dawud's Sunan is handed down; not to be confused with al-Hasan ibn Ziyad al-Lu'lu'i, the companion of Abu Hanifa {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  ur: "ابو علی محمد بن احمد بن عمر لؤلؤی، ابو داؤد سجستانی کے شاگرد اور ابن داسہ کے ساتھ ان دو راویوں میں سے ایک جن کے ذریعے سنن ابی داؤد روایت ہوتی ہے؛ یہ ابو حنیفہ کے شاگرد حسن بن زیاد لؤلؤی سے الگ ہیں {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}۔"
  fr: "Abu 'Ali Muhammad ibn Ahmad ibn 'Umar al-Lu'lu'i, élève d'Abu Dawud al-Sijistani et, avec Ibn Dasa, l'un des deux transmetteurs par qui les Sunan d'Abu Dawud nous sont parvenus ; à ne pas confondre avec al-Hasan ibn Ziyad al-Lu'lu'i, compagnon d'Abu Hanifa {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  es: "Abu 'Ali Muhammad ibn Ahmad ibn 'Umar al-Lu'lu'i, alumno de Abu Dawud al-Sijistani y, junto con Ibn Dasa, uno de los dos transmisores a través de los cuales se transmite el Sunan de Abu Dawud; no confundir con al-Hasan ibn Ziyad al-Lu'lu'i, el compañero de Abu Hanifa {cita: sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  tr: "Ebu Davud el-Sicistani'nin öğrencisi ve Sünen Ebu Davud'un kendisinden rivayet edildiği iki raviden biri olan (İbn Dasa ile birlikte) Ebu Ali Muhammed ibn Ahmed ibn Ömer el-Lu'lu'i; Ebu Hanife'nin sahabesi el-Hasan ibn Ziyad el-Lu'lu'i dışında {cite:sunan-abi-dawud-ibn-hazm-1997-v1 s. 10}."
  id: "Abu Ali Muhammad ibn Ahmad ibn Umar al-Lu'lu'i, murid Abu Dawud al-Sijistani dan salah satu dari dua perawi yang menjadi sumber naratif Sunan Abi Dawud (bersama dengan Ibn Dasa); selain al-Hasan ibn Ziyad al-Lu’lu’i sahabat Abu Hanifah {cite:sunan-abi-dawud-ibn-hazm-1997-v1 hal. 10}."
