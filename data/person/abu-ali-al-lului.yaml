  ar: "أبو علي محمد بن أحمد بن عمر اللؤلؤي، تلميذ أبي داود السجستاني وأحد الراويين اللذين تروى عنهما سنن أبي داود ⁦(مع ابن داسة)⁩؛ غير الحسن بن زياد اللؤلؤي صاحب أبي حنيفة {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  en: "Abu 'Ali Muhammad ibn Ahmad ibn 'Umar al-Lu'lu'i, a student of Abu Dawud al-Sijistani and, with Ibn Dasa, one of the two transmitters through whom Abu Dawud's Sunan is handed down; not to be confused with al-Hasan ibn Ziyad al-Lu'lu'i, the companion of Abu Hanifa {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  ur: "ابو علی محمد بن احمد بن عمر لؤلؤی، ابو داؤد سجستانی کے شاگرد اور ابن داسہ کے ساتھ ان دو راویوں میں سے ایک جن کے ذریعے سنن ابی داؤد روایت ہوتی ہے؛ یہ ابو حنیفہ کے شاگرد حسن بن زیاد لؤلؤی سے الگ ہیں {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}۔"
