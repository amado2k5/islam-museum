summary:
  ar: "إمام ومحاضر كندي مقيم في كالغاري. نشأ في مونتريال ودرس في الجامعة الإسلامية بالمدينة المنورة حتى بكالوريوس الشريعة، ودرّس في معهد المغرب وأصبح مدير علاقاته العامة، وانتقل سنة 2012 إلى كالغاري مديرًا للخدمات الدينية والاجتماعية في الجمعية الإسلامية الإعلامية، وأصبح سنة 2015 أول قسيس مسلم لدى شرطة كالغاري، وعمل في برامج مكافحة التطرّف لدى الشباب وحاضر في أكثر من عشرين بلدًا."
  en: "A Canadian imam and lecturer based in Calgary. Raised in Montreal, he studied at the Islamic University of Madinah through a bachelor's in Islamic Law, taught at AlMaghrib Institute and became its Director of Public Relations, moved to Calgary in 2012 as Director of Religious and Social Services for the Islamic Information Society of Calgary, became the Calgary Police Service's first Muslim chaplain in 2015, has worked in programmes countering youth radicalisation, and has lectured in over twenty countries."
  ur: "کیلگری میں مقیم کینیڈیائی امام اور مقرر۔ مونٹریال میں پرورش پائی، جامعہ اسلامیہ مدینہ منورہ سے شریعت میں بیچلر کیا، المعرب انسٹی ٹیوٹ میں تدریس کی اور اس کے ڈائریکٹر آف پبلک ریلیشنز بنے، 2012 میں کیلگری منتقل ہو کر اسلامک انفارمیشن سوسائٹی کے ڈائریکٹر آف ریلیجس اینڈ سوشل سروسز بنے، 2015 میں کیلگری پولیس کے پہلے مسلم چیپلن بنے، نوجوانوں کی انتہا پسندی کی روک تھام کے پروگراموں میں کام کیا اور بیس سے زائد ممالک میں لیکچر دیے۔"
