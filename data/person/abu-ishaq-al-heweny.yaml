summary:
  ar: "عالم حديث وداعية مصري، وُلد في قرية حُوين بمحافظة كفر الشيخ سنة 1956 وتوفي في الدوحة سنة 2025. تخرج في كلية الألسن بجامعة عين شمس، وتتلمذ على محمد ناصر الدين الألباني وتأثر بكتبه، وله مؤلفات وتحقيقات في علم الحديث، وبرامج على قنوات فضائية إسلامية."
  en: "Egyptian hadith scholar and preacher, born in the village of Huwayn in Kafr el-Sheikh Governorate in 1956 and died in Doha in 2025. A graduate of Ain Shams University's Faculty of Al-Alsun, he studied with Muhammad Nasir al-Din al-Albani and was shaped by his books; he wrote and edited works on hadith science and presented programmes on Islamic satellite channels."
  ur: "مصری عالمِ حدیث اور مبلغ، جو 1956 میں محافظہ کفر الشیخ کے گاؤں حوین میں پیدا ہوئے اور 2025 میں دوحہ میں وفات پائی۔ عین شمس یونیورسٹی کے شعبہ السن سے فارغ التحصیل، انہوں نے محمد ناصر الدین البانی سے تعلیم پائی اور ان کی کتابوں سے متاثر ہوئے؛ علمِ حدیث پر ان کی تصانیف و تحقیقات ہیں اور اسلامی سیٹلائٹ چینلوں پر ان کے پروگرام نشر ہوئے۔"
