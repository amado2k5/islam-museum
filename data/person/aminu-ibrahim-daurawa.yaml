summary:
  ar: "عالم نيجيري معاصر من كانو، وُلد فيها سنة 1969 لأبيه الشيخ إبراهيم محمد صاحب التفسير. أسس هيئة الحسبة في ولاية كانو وقادها من 2015 إلى 2019 ثم عاد إلى قيادتها سنة 2023، ويُعرف ببرنامجه الإذاعي التعليمي «سؤال مفتاح العلم» وبمواقفه العلنية في قضايا الأسرة والأخلاق العامة في شمال نيجيريا."
  en: "Living Nigerian scholar from Kano, born there in 1969 to Sheikh Ibrahim Muhammad Mai Tafsiri. He founded the Kano State Hisbah Corps and commanded it from 2015 to 2019, returning to its command in 2023; he is known for his radio teaching programme 'Tambaya Mabudin Ilimi' and for public interventions on family and public-morality questions in northern Nigeria."
  ur: "کانو سے تعلق رکھنے والے زندہ نائیجیریائی عالم، 1969ء میں وہیں شیخ ابراہیم محمد مائی تفسیری کے ہاں پیدا ہوئے۔ انہوں نے ریاست کانو کی حسبہ کور کی بنیاد رکھی اور 2015ء سے 2019ء تک اس کی قیادت کی، پھر 2023ء میں دوبارہ اس کے کمانڈر بنے؛ وہ اپنے ریڈیو تعلیمی پروگرام «تمبایا مابودن علمی» اور شمالی نائیجیریا میں خاندانی و عوامی اخلاقیات کے مسائل پر عوامی مواقف کے لیے معروف ہیں۔"
