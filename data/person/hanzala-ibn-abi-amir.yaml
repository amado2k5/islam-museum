id: person/hanzala-ibn-abi-amir
class: person
label: { ar: "حنظلة بن أبي عامر الأنصاري الأوسي ⁦(غسيل الملائكة)⁩", en: "Hanzala ibn Abi Amir al-Ansari (the one washed by the angels)", es: "Hanzala ibn Abi Amir al-Ansari (the one washed by the angels)", fr: "Hanzala ibn Abi Amir al-Ansari (the one washed by the angels)", ur: "حنظلہ بن ابی عامر الانصاری ⁦(جن کو فرشتوں نے دھویا)⁩" }
summary:
  ar: "صحابي أنصاري أوسي، ابن أبي عامر الراهب الذي سمّاه النبي الفاسق. كان حديث عهد بعرسه يوم أحد فلما سمع نداء الحرب انخلع من أحضان زوجته وخرج إلى الجهاد دون أن يغتسل. بلغ أبا سفيان وكاد يقضي عليه لولا أن شداد بن الأسود ضربه فقتله. لما تُفقّد وُجد يقطر ماء، فأخبر النبي أصحابه بأن الملائكة تغسله فسُمي «غسيل الملائكة» {cite:mubarakpuri-raheeq p.262}."
  en: "An Ansari Companion of the Aws, son of Abu Amir the monk whom the Prophet called the reprobate. He was newly wed on the day of Uhud; when he heard the call to war he tore himself from his bride's arms and went out to battle without washing. He reached Abu Sufyan and nearly finished him off, had Shaddad ibn al-Aswad not struck and killed him. When they searched for him they found him dripping water, and the Prophet told his Companions the angels were washing him; he was called 'the angels' washed' {cite:mubarakpuri-raheeq p.262}."
  es: "Un compañero ansar de los Aws, hijo de Abu Amir, el monje al que el Profeta llamó el réprobo. Se había casado el día de Uhud; al oír el llamado a la guerra, se soltó de los brazos de su esposa y salió a la batalla sin lavarse. Llegó hasta Abu Sufyan y casi lo mató, de no ser porque Shaddad ibn al-Aswad lo golpeó y lo mató. Cuando lo buscaron, lo encontraron empapado, y el Profeta les dijo a sus compañeros que los ángeles lo estaban lavando; por eso lo llamaron «el lavado por los ángeles» {cite:mubarakpuri-raheeq p.262}."
  fr: "Un Compagnon Ansar de la tribu des Aws, fils d'Abu Amir, le moine que le Prophète qualifiait de réprouvé. Il venait de se marier le jour d'Uhud; lorsqu'il entendit l'appel à la guerre, il s'arracha aux bras de sa fiancée et partit au combat sans se laver. Il atteignit Abu Sufyan et faillit l'achever, si Shaddad ibn al-Aswad ne l'avait pas frappé et tué. Lorsqu'ils le cherchèrent, ils le trouvèrent ruisselant d'eau, et le Prophète dit à ses Compagnons que les anges le lavaient; on l'appela « celui que les anges ont lavé » (voir Mubarakpuri-Raheeq, p. 262)."
  ur: "اوس کا ایک انصاری صحابی، ابو عامر راہب کا بیٹا جسے رسول اللہ نے ملامت قرار دیا۔ احد کے دن ان کی نئی شادی ہوئی تھی۔ جب اس نے جنگ کی آواز سنی تو اس نے اپنی دلہن کے بازوؤں سے خود کو پھاڑ لیا اور دھوئے بغیر جنگ کے لیے نکل گیا۔ وہ ابو سفیان کے پاس پہنچا اور اسے تقریباً ختم کر دیا، اگر شداد بن اسود اسے مار کر قتل نہ کر دیتے۔ جب انہوں نے اسے تلاش کیا تو انہوں نے اسے پانی ٹپکتا ہوا پایا، اور نبی نے اپنے صحابہ سے فرمایا کہ فرشتے اسے غسل دے رہے ہیں۔ اسے 'فرشتوں کا دھویا ہوا' کہا جاتا تھا۔"
  tr: "Yoldaşım Ansari Awsi, Peygamber'in günahkar dediği keşiş Ebu Amir'in oğlu. Uhud günündeki düğününe yeni katılan biriydi. Savaş çağrısını duyunca karısının kollarından ayrıldı ve yıkanmadan savaşmaya çıktı. Ebu Sufyan o noktaya ulaştı ve neredeyse onu öldürdü, eğer Şeddad bin Esvad onu vurup öldürmeseydi. Kontrol ettiğinde su damladığını gördü, bu yüzden Peygamber sahabelerine meleklerin onu yıkadığını söyledi, bu yüzden ona \"meleklerin yıkanması\" denildi {atıf:mubarakpuri-raheeq s.262}."
  id: "Sahabatku Ansari Awsi, putra Abu Amir, biksu yang disebut Nabi sebagai pendosa. Dia adalah pendatang baru di pernikahannya pada hari Uhud. Ketika dia mendengar seruan perang, dia meninggalkan pelukan istrinya dan pergi bertempur tanpa mandi. Abu Sufyan sampai pada titik itu dan hampir membunuhnya, jika bukan karena Shaddad ibn al-Aswad memukulnya dan membunuhnya. Ketika dia memeriksa, dia menemukan air menetes, sehingga Nabi memberitahu para sahabatnya bahwa para malaikat sedang membasuhnya, sehingga dia disebut \"pencucian para malaikat\" {cite:mubarakpuri-raheeq hlm.262}."
