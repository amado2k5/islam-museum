label: { ar: "حنظلة بن أبي عامر الأنصاري الأوسي (غسيل الملائكة)", en: "Hanzala ibn Abi Amir al-Ansari (the one washed by the angels)" }
summary:
  ar: "صحابي أنصاري أوسي، ابن أبي عامر الراهب الذي سمّاه النبي الفاسق. كان حديث عهد بعرسه يوم أحد فلما سمع نداء الحرب انخلع من أحضان زوجته وخرج إلى الجهاد دون أن يغتسل. بلغ أبا سفيان وكاد يقضي عليه لولا أن شداد بن الأسود ضربه فقتله. لما تُفقّد وُجد يقطر ماء، فأخبر النبي أصحابه بأن الملائكة تغسله فسُمي «غسيل الملائكة» {cite:mubarakpuri-raheeq p.262}."
  en: "An Ansari Companion of the Aws, son of Abu Amir the monk whom the Prophet called the reprobate. He was newly wed on the day of Uhud; when he heard the call to war he tore himself from his bride's arms and went out to battle without washing. He reached Abu Sufyan and nearly finished him off, had Shaddad ibn al-Aswad not struck and killed him. When they searched for him they found him dripping water, and the Prophet told his Companions the angels were washing him; he was called 'the angels' washed' {cite:mubarakpuri-raheeq p.262}."
