id: person/al-mutadid
class: person
label: { ar: "المعتضد بالله", en: "al-Mu'tadid bi-llah" }
summary:
  ar: "خليفة عباسي؛ بُويع له بولاية العهد في صفر سنة ثمان وسبعين ومائتين، ويذكر الطبري في سنة تسع وسبعين خلع جعفر المفوّض وتوليته في المحرم منها {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. وفي سنة ثمانين قصد بني شيبان {cite:tabari-tarikh-abu-al-fadl j.10 p.32}، وفي سنة إحدى وثمانين وقعت بينه وبين الأكراد والأعراب وقعة {cite:tabari-tarikh-abu-al-fadl j.10 p.37}، وعند السيوطي لما مات ابن طولون سنة سبعين ولاه الموفق أباه أعماله وجهزه إلى مصر في جنود العراق فوقع بينه وبين خمارويه وقعة عظيمة بحيث جرت الأرض من الدماء وكان النصر للمصريين {cite:tarikh-khulafa-minhaj-1434 p. 568}، وعند السيوطي ولد في ذي القعدة سنة اثنتين وأربعين وأمه أم ولد اسمها صواب وقيل حرز، وكان ملكاً شجاعاً مهيباً ظاهر الجبروت يقدم على الأسد وحده وإذا غضب على قائد أمر به يلقى في حفيرة ويطم عليه، وكان يسمى السفاح الثاني لأنه جدد ملك بني العباس وكان قد خلق وضعف وكاد يزول وكان في اضطراب من وقت قتل المتوكل، وأسقط المكوس ونشر العدل وسكنت الفتن في أيامه لفرط هيبته وكانت أيامه طيبة كثيرة الأمن والرخاء، وقال للقاضي إسماعيل والله ما حللت سراويلي على حرام قط، وأمر بإحراق كتاب جمعت له فيه الرخص من زلل العلماء لما قال له من أخذ بكل زلل العلماء ذهب دينه {cite:tarikh-khulafa-minhaj-1434 p. 571-572}. وعند المسعودي هو أبو العباس أحمد بن طلحة الموفق وأمه أم ولد رومية يقال لها ضرار، بويع في اليوم الذي مات فيه عمه المعتمد يوم الثلاثاء لاثنتي عشرة ليلة بقيت من رجب سنة تسع وسبعين ومائتين، وخلع جعفر المفوض من ولاية العهد، ولما أفضت الخلافة إليه سكنت الفتن وصلحت البلدان وارتفعت الحروب ورخصت الأسعار وسالمه كل مخالف وظفر بهارون الشاري، وتوفي يوم الأحد لسبع بقين من ربيع الآخر سنة تسع وثمانين ومائتين فكانت خلافته تسع سنين وتسعة أشهر ويومين، وخلف في بيوت الأموال تسعة آلاف ألف دينار وأربعين ألف ألف درهم واثني عشر ألف رأس من الدواب وكان مع ذلك شحيحاً ينظر فيما لا ينظر فيه العوام {cite:muruj-al-dhahab p. 595-597}، وعند المسعودي ورد أهل البصرة عليه في مراكب بحرية بيض مشحمة بالشحم والنورة يشكون الجدب وجور العمال فجلس لهم من وراء حجاب وأذن لهم فخطبهم أبو خليفة الجمحي بسجعه فقال هذا شيطان قذف به البحر ومثله فليفد على الملوك فأجابهم إلى ما سألوا، ونزل على آمد سنة ست وثمانين فحاصرها وبث جيوشه حولها حتى نزل محمد بن أحمد على الأمان {cite:muruj-al-dhahab p. 602-605}، وروى المسعودي من حزمه خبر العشر البدر التي نقب بيت صاحب عطاء الجند فطلبها مؤنس العجلي بالتوابين وهم شيوخ أنواع اللصوص الذين كبروا وتابوا فدلوا على رجل نحيف فضربه حتى كاد يهلك فأنكر، فأمر المعتضد بعلاجه وإطعامه حتى برئ ثم حصره ثلاثون أسود يتناوبون لا يدعونه يتكئ ولا ينام حتى قارب التلف، فاستلقى فأمر بإيقاظه فقال حدثني كيف صنعت فاعترف أنه خبأ المال تحت كوم شوك بحمام مقابل الدار، فلما أحضر المال وجحد كشف له البساط عنه فأسقط في يده فأمر بنفخه بالمنفاخ حتى كاد ينشق ثم ضرب في عرقين فوق حاجبيه فخرجت الريح مع الدم حتى تلف {cite:muruj-al-dhahab p. 611-614}، وعند المسعودي كان لأهل بغداد ثورة مع السلطان لصياحهم بالخدم السودان يا عقيق صب ماء واطرح دقيق فأمر بجماعة من العامة فضربوا بالسياط فشغب العامة، وظهر له شخص في صور مختلفة في داره تارة راهب ذو لحية بيضاء وتارة شاب وتارة شيخ ببزة التجار وتارة بيده سيف مسلول ضرب بعض الخدم فقتله، فأكثر الناس القول منهم من قال شيطان مريد ومنهم من قال مؤمن الجن زاجر ومنهم من قال خادم هوى جارية فاحتال بعقاقير فلسفية لا تدرك بالبصر، فأحضر المعزمين وقتل وغرق جماعة من خدمه وجواريه {cite:muruj-al-dhahab p. 621-622}، وعند المسعودي ورد مال من محمد بن زيد من طبرستان ليفرق في آل أبي طالب سراً فغمز به إليه فأحضر الرجل فأنكر عليه إخفاءه وأمره بإظهاره وقرب آل أبي طالب وكان السبب قرب النسب، ورأى في سجن أبيه شيخاً جالساً على دجلة يمده إلى مائها فيصير في يده وتجف دجلة ثم يرده فقيل هذا علي بن أبي طالب فقال له يا أحمد إن هذا الأمر صائر إليك فلا تتعرض لولدي ولا تؤذهم {cite:muruj-al-dhahab p. 630} وعند ابن الجوزي غزاته على بني شيبان في صفر سنة ثمانين ومائتين مع قصيدة النوباذ وقوله ما سلم أحد من الحدثان، وأمره بتسهيل عقبة حلوان بعشرين ألف دينار، وزيادته في جامع المنصور ففُتح بينه وبين القصر سبعة عشر طاقًا وبلغت النفقة عشرين ألف دينار، وأمره بإباء القصر الحسني دارًا للخلافة وهو أول دار الخلافة بها، وغارة المعتضد هذه ورد كتاب دبيل بزلزلتها في سنته {cite:muntazam-ibn-al-jawzi p. 142-148}. وفي ربيع الآخر سنة ست وثمانين حاصر آمد ونصب عليها المنجنيقات حتى استأمنه رئيسها فأمّنه وخلع عليه ثم أمر بهدم سورها {cite:muntazam-ibn-al-jawzi p. 307-309}."
  en: "Abbasid caliph; he was given the designation as heir in Safar 278. Al-Tabari records that in 279 Ja'far al-Mufawwad was removed from the succession, and his investiture followed in Muharram of that year {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. In 280 he marched against the Banu Shayban {cite:tabari-tarikh-abu-al-fadl j.10 p.32}; in 281 a battle took place between him and the Kurds and the Bedouin {cite:tabari-tarikh-abu-al-fadl j.10 p.37}. According to al-Suyuti, when Ibn Tulun died in 270 al-Muwaffaq entrusted him with his father's offices and sent him to Egypt with Iraqi troops; a great battle took place between him and Khumarawayh, so that the ground ran with blood, and victory went to the Egyptians {cite:tarikh-khulafa-minhaj-1434 p. 568}. According to al-Suyuti he was born in Dhu al-Qa'da 242; his mother was a slave-mother named Sawab, or, some say, Hirz. He was a brave and awe-inspiring king, of open arrogance, who would face a lion alone; when he was angry with a commander he had him thrown into a pit and covered over. He was called al-Saffah the Second, because he renewed the rule of the Abbasids, which had grown old and weak and nearly vanished, and had been in turmoil since al-Mutawakkil was killed. He abolished the tolls and spread justice; unrest subsided in his days through the excess of his awe, and his days were good, full of security and plenty. He said to the judge Isma'il, 'By God, I have never untied my trousers over anything unlawful.' He ordered a book burned, compiled for him, which gathered the lenient rulings drawn from the lapses of scholars, when he was told that whoever follows every lapse of the scholars loses his religion {cite:tarikh-khulafa-minhaj-1434 p. 571-572}. According to al-Mas'udi he was Abu al-Abbas Ahmad ibn Talha, al-Muwaffaq; his mother was a Byzantine slave-mother called Dirar. He was given the oath on the day his uncle al-Mu'tamid died, on Tuesday, twelve nights before the end of Rajab 279, and Ja'far al-Mufawwad was removed from the heir-apparency. When the caliphate came to him, unrest subsided, the lands were set right, wars ceased and prices fell; every dissenter made peace with him, and he defeated Harun al-Shari. He died on Sunday, seven nights before the end of Rabi' II 289, after a caliphate of nine years, nine months and two days. He left in the treasuries nine thousand thousand dinars, forty thousand thousand dirhams and twelve thousand head of livestock; yet he was stingy, and scrutinised matters that ordinary people do not examine {cite:muruj-al-dhahab p. 595-597}. According to al-Mas'udi, people of Basra came to him in white naval boats greased with fat and lime, complaining of drought and the injustice of the agents. He sat for them behind a screen and admitted them, and Abu Khalifa al-Jumahi addressed them in rhymed prose: 'This is a devil the sea cast up, and his like should be sent as envoy to kings.' He granted what they asked. In 286 he came down upon Amid and besieged it, deploying his armies around it until Muhammad ibn Ahmad came down on terms of safe-conduct {cite:muruj-al-dhahab p. 602-605}. Al-Mas'udi also relates the affair of the 'ten budr' (al-'ashr al-budr), when a breach was made in the house of the officer responsible for the troops' stipends. Mu'nis al-'Ujali pursued it through the tawwabin, elders among the thieves who had grown old and repented, and they pointed to a slender man. Mu'nis beat him until he nearly died, but he denied it. Al-Mu'tadid ordered him treated and fed until he recovered, then had thirty black servants take turns guarding him, not letting him lean or sleep, until he nearly perished. He lay back, and the caliph ordered him woken and said, 'Tell me how you did it.' He confessed that he had hidden the money under a heap of thorns in a bath opposite the house. When the money was brought and he denied it, the cover was lifted from it before him and he was dismayed. The caliph ordered him inflated with a bellows until he nearly burst; then he was struck in two veins above his eyebrows, and the wind came out with the blood until he perished {cite:muruj-al-dhahab p. 611-614}. According to al-Mas'udi, the people of Baghdad rose up against the sultan because they shouted at the black servants, 'O 'Aqiq, pour water and scatter flour!'; he had a group of commoners whipped, and the commoners rioted. A figure appeared to him in his house in various forms: at times a bearded monk in white, at times a young man, at times an old man in merchant's dress, and at times with a drawn sword, with which he struck one of the servants and killed him. People said much about it. Some said it was a rebellious devil; some said it was a jinn believer who warns; and some said it was the servant of a slave-girl's passion, who contrived it with philosophical drugs that cannot be perceived by sight. He summoned the enchanters, and a group of his servants and slave-girls were killed and drowned {cite:muruj-al-dhahab p. 621-622}. According to al-Mas'udi, money came from Muhammad ibn Zayd of Tabaristan to be distributed secretly among the Family of Abu Talib; he was informed on, the man was brought, and he rebuked him for concealing it and ordered it made public. He drew close to the Family of Abu Talib, the reason being kinship. He saw in his father's prison an old man sitting by the Tigris, reaching his hand into its water; the water came into his hand and the Tigris dried up, and then he returned it. It was said, 'This is Ali ibn Abi Talib,' and he said to him, 'O Ahmad, this matter will come to you, so do not harm my sons or hurt them' {cite:muruj-al-dhahab p. 630}. According to Ibn al-Jawzi, his campaign against the Banu Shayban in Safar 280 was accompanied by the ode of al-Nawbadh and his verse that no one is spared the vicissitudes of time; he ordered the Hulwan pass made easy at a cost of twenty thousand dinars; he extended the mosque of al-Mansur, opening seventeen arches between it and the palace at a cost of twenty thousand dinars; and he ordered al-Qasr al-Hasani made a residence of the caliphate, the first caliphal residence there. A letter from Dabil about an earthquake there in that year came in connection with this campaign {cite:muntazam-ibn-al-jawzi p. 142-148}. In Rabi' II 286 he besieged Amid and set up catapults against it until its chief sought safe-conduct from him; he granted it, bestowed a robe of honour on him, and then ordered its walls demolished {cite:muntazam-ibn-al-jawzi p. 307-309}."
