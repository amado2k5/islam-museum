label: { ar: "المعتضد بالله" }
summary:
  ar: "خليفة عباسي؛ بُويع له بولاية العهد في صفر سنة ثمان وسبعين ومائتين، ويذكر الطبري في سنة تسع وسبعين خلع جعفر المفوّض وتوليته في المحرم منها {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. وفي سنة ثمانين قصد بني شيبان {cite:tabari-tarikh-abu-al-fadl j.10 p.32}، وفي سنة إحدى وثمانين وقعت بينه وبين الأكراد والأعراب وقعة {cite:tabari-tarikh-abu-al-fadl j.10 p.37}، وعند السيوطي لما مات ابن طولون سنة سبعين ولاه الموفق أباه أعماله وجهزه إلى مصر في جنود العراق فوقع بينه وبين خمارويه وقعة عظيمة بحيث جرت الأرض من الدماء وكان النصر للمصريين {cite:tarikh-khulafa-minhaj-1434 p. 568}."
gender: male
