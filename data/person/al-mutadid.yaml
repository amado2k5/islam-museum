id: person/al-mutadid
class: person
label: { ar: "المعتضد بالله", en: "al-Mu'tadid bi-llah", fr: "al-Mu'tadid bi-llah" , ur: "المعتضد باللہ", es: "al-Mu'tadid bi-llah"}
summary:
  ar: "خليفة عباسي؛ بُويع له بولاية العهد في صفر سنة ثمان وسبعين ومائتين، ويذكر الطبري في سنة تسع وسبعين خلع جعفر المفوّض وتوليته في المحرم منها {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. وفي سنة ثمانين قصد بني شيبان {cite:tabari-tarikh-abu-al-fadl j.10 p.32}، وفي سنة إحدى وثمانين وقعت بينه وبين الأكراد والأعراب وقعة {cite:tabari-tarikh-abu-al-fadl j.10 p.37}، وعند السيوطي لما مات ابن طولون سنة سبعين ولاه الموفق أباه أعماله وجهزه إلى مصر في جنود العراق فوقع بينه وبين خمارويه وقعة عظيمة بحيث جرت الأرض من الدماء وكان النصر للمصريين {cite:tarikh-khulafa-minhaj-1434 p. 568}، وعند السيوطي ولد في ذي القعدة سنة اثنتين وأربعين وأمه أم ولد اسمها صواب وقيل حرز، وكان ملكاً شجاعاً مهيباً ظاهر الجبروت يقدم على الأسد وحده وإذا غضب على قائد أمر به يلقى في حفيرة ويطم عليه، وكان يسمى السفاح الثاني لأنه جدد ملك بني العباس وكان قد خلق وضعف وكاد يزول وكان في اضطراب من وقت قتل المتوكل، وأسقط المكوس ونشر العدل وسكنت الفتن في أيامه لفرط هيبته وكانت أيامه طيبة كثيرة الأمن والرخاء، وقال للقاضي إسماعيل والله ما حللت سراويلي على حرام قط، وأمر بإحراق كتاب جمعت له فيه الرخص من زلل العلماء لما قال له من أخذ بكل زلل العلماء ذهب دينه {cite:tarikh-khulafa-minhaj-1434 p. 571-572}. وعند المسعودي هو أبو العباس أحمد بن طلحة الموفق وأمه أم ولد رومية يقال لها ضرار، بويع في اليوم الذي مات فيه عمه المعتمد يوم الثلاثاء لاثنتي عشرة ليلة بقيت من رجب سنة تسع وسبعين ومائتين، وخلع جعفر المفوض من ولاية العهد، ولما أفضت الخلافة إليه سكنت الفتن وصلحت البلدان وارتفعت الحروب ورخصت الأسعار وسالمه كل مخالف وظفر بهارون الشاري، وتوفي يوم الأحد لسبع بقين من ربيع الآخر سنة تسع وثمانين ومائتين فكانت خلافته تسع سنين وتسعة أشهر ويومين، وخلف في بيوت الأموال تسعة آلاف ألف دينار وأربعين ألف ألف درهم واثني عشر ألف رأس من الدواب وكان مع ذلك شحيحاً ينظر فيما لا ينظر فيه العوام {cite:muruj-al-dhahab p. 595-597}، وعند المسعودي ورد أهل البصرة عليه في مراكب بحرية بيض مشحمة بالشحم والنورة يشكون الجدب وجور العمال فجلس لهم من وراء حجاب وأذن لهم فخطبهم أبو خليفة الجمحي بسجعه فقال هذا شيطان قذف به البحر ومثله فليفد على الملوك فأجابهم إلى ما سألوا، ونزل على آمد سنة ست وثمانين فحاصرها وبث جيوشه حولها حتى نزل محمد بن أحمد على الأمان {cite:muruj-al-dhahab p. 602-605}، وروى المسعودي من حزمه خبر العشر البدر التي نقب بيت صاحب عطاء الجند فطلبها مؤنس العجلي بالتوابين وهم شيوخ أنواع اللصوص الذين كبروا وتابوا فدلوا على رجل نحيف فضربه حتى كاد يهلك فأنكر، فأمر المعتضد بعلاجه وإطعامه حتى برئ ثم حصره ثلاثون أسود يتناوبون لا يدعونه يتكئ ولا ينام حتى قارب التلف، فاستلقى فأمر بإيقاظه فقال حدثني كيف صنعت فاعترف أنه خبأ المال تحت كوم شوك بحمام مقابل الدار، فلما أحضر المال وجحد كشف له البساط عنه فأسقط في يده فأمر بنفخه بالمنفاخ حتى كاد ينشق ثم ضرب في عرقين فوق حاجبيه فخرجت الريح مع الدم حتى تلف {cite:muruj-al-dhahab p. 611-614}، وعند المسعودي كان لأهل بغداد ثورة مع السلطان لصياحهم بالخدم السودان يا عقيق صب ماء واطرح دقيق فأمر بجماعة من العامة فضربوا بالسياط فشغب العامة، وظهر له شخص في صور مختلفة في داره تارة راهب ذو لحية بيضاء وتارة شاب وتارة شيخ ببزة التجار وتارة بيده سيف مسلول ضرب بعض الخدم فقتله، فأكثر الناس القول منهم من قال شيطان مريد ومنهم من قال مؤمن الجن زاجر ومنهم من قال خادم هوى جارية فاحتال بعقاقير فلسفية لا تدرك بالبصر، فأحضر المعزمين وقتل وغرق جماعة من خدمه وجواريه {cite:muruj-al-dhahab p. 621-622}، وعند المسعودي ورد مال من محمد بن زيد من طبرستان ليفرق في آل أبي طالب سراً فغمز به إليه فأحضر الرجل فأنكر عليه إخفاءه وأمره بإظهاره وقرب آل أبي طالب وكان السبب قرب النسب، ورأى في سجن أبيه شيخاً جالساً على دجلة يمده إلى مائها فيصير في يده وتجف دجلة ثم يرده فقيل هذا علي بن أبي طالب فقال له يا أحمد إن هذا الأمر صائر إليك فلا تتعرض لولدي ولا تؤذهم {cite:muruj-al-dhahab p. 630} وعند ابن الجوزي غزاته على بني شيبان في صفر سنة ثمانين ومائتين مع قصيدة النوباذ وقوله ما سلم أحد من الحدثان، وأمره بتسهيل عقبة حلوان بعشرين ألف دينار، وزيادته في جامع المنصور ففُتح بينه وبين القصر سبعة عشر طاقًا وبلغت النفقة عشرين ألف دينار، وأمره بإباء القصر الحسني دارًا للخلافة وهو أول دار الخلافة بها، وغارة المعتضد هذه ورد كتاب دبيل بزلزلتها في سنته {cite:muntazam-ibn-al-jawzi p. 142-148}. وفي ربيع الآخر سنة ست وثمانين حاصر آمد ونصب عليها المنجنيقات حتى استأمنه رئيسها فأمّنه وخلع عليه ثم أمر بهدم سورها {cite:muntazam-ibn-al-jawzi p. 307-309}."
  en: "Abbasid caliph; he was given the designation as heir in Safar 278. Al-Tabari records that in 279 Ja'far al-Mufawwad was removed from the succession, and his investiture followed in Muharram of that year {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. In 280 he marched against the Banu Shayban {cite:tabari-tarikh-abu-al-fadl j.10 p.32}; in 281 a battle took place between him and the Kurds and the Bedouin {cite:tabari-tarikh-abu-al-fadl j.10 p.37}. According to al-Suyuti, when Ibn Tulun died in 270 al-Muwaffaq entrusted him with his father's offices and sent him to Egypt with Iraqi troops; a great battle took place between him and Khumarawayh, so that the ground ran with blood, and victory went to the Egyptians {cite:tarikh-khulafa-minhaj-1434 p. 568}. According to al-Suyuti he was born in Dhu al-Qa'da 242; his mother was a slave-mother named Sawab, or, some say, Hirz. He was a brave and awe-inspiring king, of open arrogance, who would face a lion alone; when he was angry with a commander he had him thrown into a pit and covered over. He was called al-Saffah the Second, because he renewed the rule of the Abbasids, which had grown old and weak and nearly vanished, and had been in turmoil since al-Mutawakkil was killed. He abolished the tolls and spread justice; unrest subsided in his days through the excess of his awe, and his days were good, full of security and plenty. He said to the judge Isma'il, 'By God, I have never untied my trousers over anything unlawful.' He ordered a book burned, compiled for him, which gathered the lenient rulings drawn from the lapses of scholars, when he was told that whoever follows every lapse of the scholars loses his religion {cite:tarikh-khulafa-minhaj-1434 p. 571-572}. According to al-Mas'udi he was Abu al-Abbas Ahmad ibn Talha, al-Muwaffaq; his mother was a Byzantine slave-mother called Dirar. He was given the oath on the day his uncle al-Mu'tamid died, on Tuesday, twelve nights before the end of Rajab 279, and Ja'far al-Mufawwad was removed from the heir-apparency. When the caliphate came to him, unrest subsided, the lands were set right, wars ceased and prices fell; every dissenter made peace with him, and he defeated Harun al-Shari. He died on Sunday, seven nights before the end of Rabi' II 289, after a caliphate of nine years, nine months and two days. He left in the treasuries nine thousand thousand dinars, forty thousand thousand dirhams and twelve thousand head of livestock; yet he was stingy, and scrutinised matters that ordinary people do not examine {cite:muruj-al-dhahab p. 595-597}. According to al-Mas'udi, people of Basra came to him in white naval boats greased with fat and lime, complaining of drought and the injustice of the agents. He sat for them behind a screen and admitted them, and Abu Khalifa al-Jumahi addressed them in rhymed prose: 'This is a devil the sea cast up, and his like should be sent as envoy to kings.' He granted what they asked. In 286 he came down upon Amid and besieged it, deploying his armies around it until Muhammad ibn Ahmad came down on terms of safe-conduct {cite:muruj-al-dhahab p. 602-605}. Al-Mas'udi also relates the affair of the 'ten budr' (al-'ashr al-budr), when a breach was made in the house of the officer responsible for the troops' stipends. Mu'nis al-'Ujali pursued it through the tawwabin, elders among the thieves who had grown old and repented, and they pointed to a slender man. Mu'nis beat him until he nearly died, but he denied it. Al-Mu'tadid ordered him treated and fed until he recovered, then had thirty black servants take turns guarding him, not letting him lean or sleep, until he nearly perished. He lay back, and the caliph ordered him woken and said, 'Tell me how you did it.' He confessed that he had hidden the money under a heap of thorns in a bath opposite the house. When the money was brought and he denied it, the cover was lifted from it before him and he was dismayed. The caliph ordered him inflated with a bellows until he nearly burst; then he was struck in two veins above his eyebrows, and the wind came out with the blood until he perished {cite:muruj-al-dhahab p. 611-614}. According to al-Mas'udi, the people of Baghdad rose up against the sultan because they shouted at the black servants, 'O 'Aqiq, pour water and scatter flour!'; he had a group of commoners whipped, and the commoners rioted. A figure appeared to him in his house in various forms: at times a bearded monk in white, at times a young man, at times an old man in merchant's dress, and at times with a drawn sword, with which he struck one of the servants and killed him. People said much about it. Some said it was a rebellious devil; some said it was a jinn believer who warns; and some said it was the servant of a slave-girl's passion, who contrived it with philosophical drugs that cannot be perceived by sight. He summoned the enchanters, and a group of his servants and slave-girls were killed and drowned {cite:muruj-al-dhahab p. 621-622}. According to al-Mas'udi, money came from Muhammad ibn Zayd of Tabaristan to be distributed secretly among the Family of Abu Talib; he was informed on, the man was brought, and he rebuked him for concealing it and ordered it made public. He drew close to the Family of Abu Talib, the reason being kinship. He saw in his father's prison an old man sitting by the Tigris, reaching his hand into its water; the water came into his hand and the Tigris dried up, and then he returned it. It was said, 'This is Ali ibn Abi Talib,' and he said to him, 'O Ahmad, this matter will come to you, so do not harm my sons or hurt them' {cite:muruj-al-dhahab p. 630}. According to Ibn al-Jawzi, his campaign against the Banu Shayban in Safar 280 was accompanied by the ode of al-Nawbadh and his verse that no one is spared the vicissitudes of time; he ordered the Hulwan pass made easy at a cost of twenty thousand dinars; he extended the mosque of al-Mansur, opening seventeen arches between it and the palace at a cost of twenty thousand dinars; and he ordered al-Qasr al-Hasani made a residence of the caliphate, the first caliphal residence there. A letter from Dabil about an earthquake there in that year came in connection with this campaign {cite:muntazam-ibn-al-jawzi p. 142-148}. In Rabi' II 286 he besieged Amid and set up catapults against it until its chief sought safe-conduct from him; he granted it, bestowed a robe of honour on him, and then ordered its walls demolished {cite:muntazam-ibn-al-jawzi p. 307-309}."
  fr: "calife abbasside ; il a reçu la désignation d'héritier en safar 278. Al-Tabari rapporte qu'en 279 Ja'far al-Mufawwad a été retiré de la succession, et son investiture a suivi dans Muharram de cette année {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. En 280, il marcha contre les Banu Shayban {cite:tabari-tarikh-abu-al-fadl j.10 p.32}; en 281 une bataille a eu lieu entre lui et les Kurdes et les Bédouins {cite:tabari-tarikh-abu-al-fadl j.10 p.37}. Selon al-Suyuti, quand Ibn Tulun est mort en 270 al-Muwaffaq lui a confié les bureaux de son père et l'a envoyé en Égypte avec des troupes irakiennes ; une grande bataille eut lieu entre lui et Khumarawayh, de sorte que la terre coulait de sang, et la victoire allait aux Égyptiens {cite:tarikh-khulafa-minhaj-1434 p. 568}. Selon al-Suyuti, il est né à dhou al-qi‘da 242 ; sa mère était une mère esclave nommée Sawab, ou, certains disent, Hirz. Il était un roi courageux et impressionnant, d'une arrogance ouverte, qui ferait face à un lion seul. quand il était en colère contre un commandant, il l'avait jeté dans une fosse et couvert. Il a été appelé al-Saffah le deuxième, parce qu'il a renouvelé la règle des Abbassides, qui était devenu vieux et faible et avait presque disparu, et avait été dans la tourmente depuis al-Mutawakkil a été tué. Il abolit les péages et répandit la justice  ; l’agitation s’apaisa en ses jours par l’excès de sa crainte, et ses jours furent bons, pleins de sécurité et d’abondance. Il dit au juge Ismaël  : « Par Dieu, je n’ai jamais délié mon pantalon pour quelque chose d’illégal.  » Il ordonna qu’un livre soit brûlé, compilé pour lui, qui rassemble les jugements cléments tirés des fautes des savants, quand on lui dit que quiconque suit chaque faute des savants perd sa religion {cite:tarikh-khulafa-minhaj-1434 p. 571-572}. Selon al-Mas'udi, il était Abu al-Abbas Ahmad ibn Talha, al-Muwaffaq ; sa mère était une esclave-mère byzantine appelée Dirar. Il a prêté serment le jour où son oncle al-Mu'tamid est mort, mardi, douze nuits avant la fin de Rajab 279, et Ja'far al-Mufawwad a été retiré de l'apparence d'héritier. Quand le califat vint à lui, l'agitation s'apaisa, les terres furent redressées, les guerres cessèrent et les prix baissaient. Tout dissident fit la paix avec lui, et il vainquit Harun al-Shari. Il est mort dimanche, sept nuits avant la fin de Rabi II 289, après un califat de neuf ans, neuf mois et deux jours. Il laissa dans les trésors neuf mille dinars, quarante mille dirhams et douze mille têtes de bétail  ; mais il était avare et scrutait des choses que les gens ordinaires n’examinent pas {cite:muruj-al-dhahab p. 595-597}. Selon al-Mas'udi, les habitants de Bassora sont venus à lui dans des bateaux de la marine blanche graissés de graisse et de chaux, se plaignant de la sécheresse et de l'injustice des agents. Il s'assit derrière un écran et les admit, et Abu Khalifa al-Jumahi leur dit en prose rimée  : « C'est un diable que la mer a jeté, et son semblable devrait être envoyé comme envoyé aux rois.  » En 286, il descendit sur Amid et l'assiégea, déployant ses armées autour d'elle jusqu'à ce que Muhammad ibn Ahmad ne se soumette à des conditions de sécurité {cite:muruj-al-dhahab p. 602-605}. Al-Mas'udi relate également l'affaire des « dix budr » (al-'ashr al-budr), quand une brèche a été faite dans la maison de l'officier responsable des allocations des troupes. Mu'nis al-'Ujali l'a poursuivi à travers le tawwabin, les anciens parmi les voleurs qui avaient vieilli et s'étaient repentis, et ils ont pointé vers un homme mince. Mu'nis l'a battu jusqu'à ce qu'il meure, mais il a nié. Al-Mu'tadid lui a ordonné de le traiter et de le nourrir jusqu'à ce qu'il se rétablisse, puis a fait en sorte que trente serviteurs noirs le gardent à tour de rôle, ne le laissant ni maigre ni endormi, jusqu'à ce qu'il périsse presque. Il se coucha, et le calife lui ordonna de se réveiller et lui dit  : « Dis-moi comment tu l’as fait.  » Il avoua qu’il avait caché l’argent sous un tas d’épines dans un bain en face de la maison. Quand l’argent a été apporté et qu’il l’a nié, la couverture a été retirée devant lui et il a été consterné. Le calife lui ordonna de se gonfler d'un soufflet jusqu'à ce qu'il éclatât presque ; puis il fut frappé dans deux veines au-dessus de ses sourcils, et le vent sortit avec le sang jusqu'à ce qu’il périsse {cite:muruj-al-dhahab p. 611-614}. Selon al-Mas'udi, le peuple de Bagdad s'est levé contre le sultan parce qu'ils ont crié aux serviteurs noirs : « O 'Aqiq, versez de l'eau et dispersez la farine ! Il fit fouetter un groupe de roturiers, et les roturiers se soulevèrent. Une figure lui apparut dans sa maison sous diverses formes  : tantôt un moine barbu en blanc, tantôt un jeune homme, tantôt un vieillard en habit de marchand, et tantôt avec une épée nue, avec laquelle il frappa l'un des domestiques et le tua. Les gens en ont beaucoup parlé. Certains ont dit que c'était un diable rebelle ; certains ont dit que c'était un croyant djinn qui avertissait ; et certains ont dit que c'était le serviteur de la passion d'une esclave-fille, qui l'a inventé avec des drogues philosophiques qui ne peuvent être perçues par la vue. Il appela les enchanteurs, et un groupe de ses serviteurs et de ses esclaves furent tués et noyés {cite:muruj-al-dhahab p. 621-622}. Selon al-Mas'udi, l'argent provenait de Muhammad ibn Zayd du Tabaristan pour être distribué secrètement parmi la famille d'Abou Talib ; Il a été informé, l'homme a été amené, et il l'a réprimandé pour l'avoir caché et a ordonné qu'il soit rendu public. Il se rapprocha de la famille d'Abu Talib, la raison étant la parenté. Il vit dans la prison de son père un vieillard assis près du Tigre, qui tendit sa main dans son eau. et l'eau entra dans sa main, et le Tigre se dessécha, et il la lui rendit. On lui dit : « C'est Ali ibn Abi Talib », et il lui dit : « O Ahmad, cette affaire viendra à vous, alors ne faites pas de mal à mes fils ou de les blesser.  » {cite:muruj-al-dhahab p. 630}. Selon Ibn al-Jawzi, sa campagne contre les Banu Shayban à Safar 280 était accompagnée de l'ode d'al-Nawbadh et de son verset selon lequel personne n'est épargné par les vicissitudes du temps ; Il a ordonné le passage Hulwan rendu facile au coût de vingt mille dinars ; il a prolongé la mosquée d'al-Mansour, ouvrant dix-sept arches entre elle et le palais au coût de vingt mille dinards ; et il ordonna à al-Qasr al-Hasani de faire une résidence du califat, la première résidence califale. Une lettre de Dabil à propos d'un tremblement de terre cette année-là est venue dans le cadre de cette campagne {cite:muntazam-ibn-al-jawzi p. 142-148}. Dans Rabi II 286 il assiège Amid et monte des catapultes contre lui jusqu'à ce que son chef cherche à le protéger ; il l'accorde, lui donne une robe d'honneur, puis ordonne que ses murs soient démolis {cite:muntazam-ibn-al-jawzi p. 307-309}."
  ur: "عباسی خلیفہ؛ طبری ان کی ولی عہدی، خلافت اور بنو شیبان کے خلاف مہم کا ذکر کرتے ہیں۔ {cite:tabari-tarikh-abu-al-fadl}"
  es: "Califa abasí; se le otorgó la designación de heredero en Safar 278. Al-Tabari registra que en 279 Ja'far al-Mufawwad fue excluido de la sucesión, y su investidura tuvo lugar en Muharram de ese año {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. En 280 marchó contra los Banu Shayban {cite:tabari-tarikh-abu-al-fadl j.10 p.32}; en 281 tuvo lugar una batalla entre él y los kurdos y los beduinos {cite:tabari-tarikh-abu-al-fadl j.10 p.37}. Según al-Suyuti, cuando Ibn Tulun murió en 270, al-Muwaffaq le confió los cargos de su padre y lo envió a Egipto con tropas iraquíes; tuvo lugar una gran batalla entre él y Khumarawayh, de tal manera que la tierra se tiñó de sangre, y la victoria fue para los egipcios {cite:tarikh-khulafa-minhaj-1434 p. 568}. Según al-Suyuti, nació en Dhu al-Qa'da 242; su madre era una esclava llamada Sawab, o, según algunos, Hirz. Fue un rey valiente e imponente, de abierta arrogancia, que se enfrentaría solo a un león; cuando se enfadaba con un comandante, lo hacía arrojar a un pozo y cubrirlo. Fue llamado al-Saffah el Segundo, porque renovó el gobierno de los abasíes, que se había debilitado y casi desaparecido, y había estado sumido en el caos desde la muerte de al-Mutawakkil. Abolió los peajes y extendió la justicia; la agitación disminuyó en sus días debido al exceso de su temor, y sus días fueron buenos, llenos de seguridad y abundancia. Le dijo al juez Isma'il: «Por Dios, nunca me he desatado los pantalones por nada ilegal». Mandó quemar un libro, compilado para él, que recogía las sentencias indulgentes extraídas de los errores de los eruditos, cuando le dijeron que quien sigue cada error de los eruditos pierde su religión {cite:tarikh-khulafa-minhaj-1434 p. 571-572}. Según al-Mas'udi, era Abu al-Abbas Ahmad ibn Talha, al-Muwaffaq; su madre era una esclava bizantina llamada Dirar. Prestó juramento el día en que murió su tío al-Mu'tamid, un martes, doce noches antes del final de Rajab 279, y Ja'far al-Mufawwad fue destituido de la sucesión. Cuando el califato llegó a sus manos, la inestabilidad disminuyó, las tierras se regularizaron, las guerras cesaron y los precios bajaron; todos los disidentes hicieron las paces con él, y derrotó a Harun al-Shari. Murió un domingo, siete noches antes del final de Rabi' II 289, tras un califato de nueve años, nueve meses y dos días. Dejó en los tesoros nueve mil dinares, cuarenta mil dirhams y doce mil cabezas de ganado; sin embargo, era tacaño y examinaba con lupa asuntos que la gente común no suele examinar {cite:muruj-al-dhahab p. 595-597}. Según al-Mas'udi, la gente de Basora llegó a él en barcos navales blancos engrasados con grasa y cal, quejándose de la sequía y la injusticia de los agentes. Él se sentó para ellos detrás de una pantalla y los recibió, y Abu Khalifa al-Jumahi se dirigió a ellos en prosa rimada: «Este es un demonio que el mar ha arrojado, y como él debería ser enviado como enviado a los reyes». Él concedió lo que pidieron. En 286 descendió sobre Amid y la sitió, desplegando sus ejércitos a su alrededor hasta que Muhammad ibn Ahmad bajó bajo condiciones de salvoconducto {cite:muruj-al-dhahab p. 602-605}. Al-Mas'udi también relata el asunto de los «ten budr» (al-'ashr al-budr), cuando se produjo una brecha en la casa del oficial responsable de los estipendios de las tropas. Mu'nis al-'Ujali lo persiguió a través de los tawwabin, ancianos entre los ladrones que habían envejecido y se habían arrepentido, y señalaron a un hombre delgado. Mu'nis lo golpeó hasta casi matarlo, pero él lo negó. Al-Mu'tadid ordenó que lo trataran y alimentaran hasta que se recuperara, luego hizo que treinta sirvientes negros se turnaran para vigilarlo, sin dejarlo apoyarse ni dormir, hasta que estuvo a punto de perecer. Se recostó, y el califa ordenó que lo despertaran y le dijo: «Dime cómo lo hiciste». Confesó que había escondido el dinero bajo un montón de espinas en un baño frente a la casa. Cuando trajeron el dinero y él lo negó, le quitaron la tapa delante de él y se sintió consternado. El califa ordenó que lo inflaran con un fuelle hasta que casi reventara; luego le golpearon en dos venas sobre las cejas, y el aire salió con la sangre hasta que pereció {cite:muruj-al-dhahab p. 611-614}. Según al-Mas'udi, el pueblo de Bagdad se sublevó contra el sultán porque gritaban a los sirvientes negros: «¡Oh, Aqiq, vierte agua y esparce harina!». Él mandó azotar a un grupo de plebeyos, y estos se amotinaron. Una figura se le apareció en su casa con diversas formas: a veces un monje barbudo vestido de blanco, a veces un joven, a veces un anciano con ropa de mercader, y a veces con una espada desenvainada, con la que golpeó a uno de los sirvientes y lo mató. La gente habló mucho al respecto. Algunos decían que era un demonio rebelde; otros, que era un creyente en genios que advertía; y otros, que era el sirviente de la pasión de una esclava, quien la había urdido con drogas filosóficas invisibles. Él llamó a los hechiceros, y un grupo de sus sirvientes y esclavas fueron asesinados y ahogados {cite:muruj-al-dhahab p. 621-622}. Según al-Mas'udi, Muhammad ibn Zayd de Tabaristán envió dinero para distribuirlo secretamente entre la familia de Abu Talib; al enterarse, trajeron al hombre, lo reprendió por ocultarlo y ordenó que se hiciera público. Se acercó a la familia de Abu Talib por parentesco. Vio en la prisión de su padre a un anciano sentado junto al Tigris, metiendo la mano en sus aguas; el agua llegó a su mano y el Tigris se secó, y luego la retiró. Se dijo: «Este es Ali ibn Abi Talib», y él le respondió: «Oh Ahmad, este asunto te llegará, así que no dañes a mis hijos ni les hagas daño» {cita:muruj-al-dhahab p. 630}. Según Ibn al-Jawzi, su campaña contra los Banu Shayban en Safar 280 estuvo acompañada por la oda de al-Nawbadh y su verso que dice que nadie se libra de las vicisitudes del tiempo; ordenó que se facilitara el paso de Hulwan a un costo de veinte mil dinares; extendió la mezquita de al-Mansur, abriendo diecisiete arcos entre esta y el palacio a un costo de veinte mil dinares; y ordenó que al-Qasr al-Hasani se convirtiera en residencia del califato, la primera residencia califal allí. Una carta de Dabil sobre un terremoto allí en ese año llegó en relación con esta campaña {cite:muntazam-ibn-al-jawzi p. 142-148}. En Rabi' II 286 sitió Amid y colocó catapultas contra ella hasta que su jefe le pidió salvoconducto; Él se lo concedió, le otorgó una túnica de honor y luego ordenó que se demolieran sus muros {cite:muntazam-ibn-al-jawzi p. 307-309}."
  tr: "Abbasi Halifesi; 278 Hicri yılında Sefer'de veliaht prens olarak bağlılık yemini etmiştir. El-Taberi, 79 Hicri yılında Ja'far'ın delegasyonunu ve Muharrem'deki atanmasını belirtir; {cite:tabari-tarikh-abu-al-fadl j.10 s.22} {cite:tabari-tarikh-abu-al-fadl j.10 s.28} yer alır. Seksen yılında, Banu Şeyban'a doğru yola çıktı {cite:tabari-tarikh-abu-al-fadl j.10 s.32} ve seksen birinci yılda kendisiyle Kürtler ve Bedeviler arasında bir savaş çıktı {cite:tabari-tarikh-abu-al-fadl j.10 s.37}. al-Suyuti'ye göre, İbn Tulun yetmişte öldüğünde, al-Muwaffaq babasını görevine atadı ve onu Irak askerleriyle birlikte Mısır'a hazırladı; kendisi ile Khumarawayh arasında büyük bir savaş çıktı, kan yere aktı ve zafer Mısırlıların oldu {atıf: Tarikh-Khulafa-minhaj-1434, s. 568}, Al-Suyuti'ye göre, kırk iki yılında Dhu al-Qi'dah'ta doğmuş, annesinin adı Sawab olan bir anne ve harz olduğu da söylenir. Cesur ve görkemli bir kraldı, sadece görkem ve güç gösterirdi. Bir lidere kızdığında, onu bir çukura atıp lanetlemesini emretti. Abbâsî yönetimini yenilediği için ikinci kasap olarak adlandırıldı. Yaratılmış, zayıflamış ve neredeyse yok olmuştu. Al-Mutawakkil'in öldürülmesinden beri karışıklık içindeydi. Büyük itibarı sayesinde vergileri kaldırdı, adaleti yaydı ve isyanlar günlerinde yatıştı. İyilik, güven ve refah açısından bol gelir. Hakim İsmail'e şöyle dedi: 'Tanrı aşkına, pantolonum hiçbir yasak için izin verilmedi.' Bilginlerin hatalarından tavizleri topladığı bir kitabın yakılmasını emretti, çünkü ona âlimlerin tüm hatalarını alan kişinin dinini kaybettiğini söyledi {atıf:Tarikh-khulafa-minhaj-1434, s. 571-572}. El-Mes'udi'ye göre, kendisi Ebu el-Abbas Ahmed bin Talha el-Muvaffaq'tı ve annesi River adında bir Rumiyya oğlunun annesiydi. Amcası el-Mu'tamid'in öldüğü gün, Salı günü, 279 Hicri yılında, Recep'ten on iki gece kala bağlılık yemini etti. Ca'far el-Müfevkkir veliaht prensten indirildi ve halife olunca çatışmalar yatıştı, topraklar sakinleşti, savaşlar yükseldi, fiyatlar düştü ve her ihlal edene barış verildi, Harun el-Şeri zafer kazandı. 289 Hicri yılında, Rabi'al-Thani'den yedi ay önce, Pazar günü öldü, yani halifeliği dokuzdu Yıllarca, dokuz ay ve iki gün boyunca zengin evlerde dokuz bin dinar, kırk bin dirhem ve on iki bin baş hayvan bıraktı. Buna rağmen, halkın görmediği şeylere bakarak nadirdi {atı:muruj-al-dhahab s. 595-597}. El-Mes'udi'ye göre, Basra halkı, yağ ve yıldırım yüklü beyaz deniz tekneleriyle ona karşılık vererek kuraklıktan ve işçilerin adaletsizliğinden şikayet etti. O onlar için bir örtü arkasında oturdu ve izin verdi, bunun üzerine Ebu Halife el-Cumahi onlara kafiyelerle seslenerek, 'Bu deniz tarafından atılan bir şeytandır ve onun için benzeri kurban edilmelidir.' dedi. Krallar isteklerine cevap verdi ve seksen altıncı yılın başında kamp kurdu, kuşattı ve ordularını etrafında dağıttı, ta ki Muhammed bin Ahmed güvenle ulaşana kadar {atıf:Muruj-al-Dhahab, s. 602-605}. El-Mes'udi, Hazm'ından on dolunayın hikayesini anlattı; bu ayı Ata al-Jund sahibinin evine kazdı ve Mu'nis al-Ajli'yi, yaşlanıp tövbe eden çeşitli hırsızların yaşlıları olan tövbe edenlere davet etti. Onlar, onu neredeyse öldürülene kadar döven zayıf bir adamı işaret etti ama o reddetti. Al-Mu'tadid tedavi edilmesini ve iyileşene kadar beslenmesini emretti. Sonra otuz aslan sırayla onu kuşattı, yatmasına izin vermediler Neredeyse zarar görecek kadar uyudu. Yattı ve onu uyandırmasını emretti, \"Bana nasıl yaptın, söyle.\" dedi. Parayı evin karşısındaki bir banyoda dikenli yığının altına sakladığını itiraf etti. Parayı getirip reddettiğinde, halıyı açtı ve eline bıraktı, ardından üfleyiciyle neredeyse çatlayana kadar üflemesini emretti. Sonra kaşlarının üzerindeki iki damara vurdu, rüzgar kanla birlikte eserek büküldü. {alıntı:Muruj-al-Dhahab, s. 611-614}. Al-Mas'udi'ye göre, Bağdat halkı, hizmetçilerle birlikte bağırdığı için padişaha isyan etti, \"Ey akat, su dök ve un dök.\" Bir grup Halk kırbaçlandı, bu da bir isyana yol açtı. Evinde çeşitli şekillerde bir adam belirdi—bazen beyaz sakallı bir keşiş, bazen genç bir adam, bazen tüccar kılığına girmiş yaşlı biri, bazen elinde çekilmiş kılıç. Bazı hizmetçileri vurdu ve onu öldürdü. Çoğu kişi şöyle dedi: bazıları onun asi bir şeytan olduğunu, bazıları cinlere inanan, bazıları ise köle arzusuyla bir hizmetçi olduğunu söyledi. Gözle görünmeyen felsefi ilaçlarla kandırdı. Davetlileri çağırdı, bir grup hizmetçisini ve hizmetçisini öldürüp boğdu. {alıntı: Muruj-al-Dhahab, s. 621-622} ve el-Mes'udi ile birlikte Muhammed bin Zayd'den Tabaristan'dan bir miktar para geri döndü ve gizlice Ebu Talib'in ailesine dağıtıldı, bu yüzden ona göz kırptı. Adam ona getirildi, ancak bunu gizlemeye onay vermedi ve açıklamasını emretti. Bunun nedeni, Abu Talib'in ailesinin yakınlığıydı, bu da akrabalıktan kaynaklanıyordu. Babası hapishanesinde yaşlı bir adamın Dicle nehrinin üzerinde oturduğunu gördü, onu suyuna götürür, Dicle kuruyup geri getirirdi. Şöyle denirdi: 'Bu Ali ibn Ebi Talib'dir.' Ona dedi ki, 'Ey Ahmed, bu iş sana oluyor, oğluma zarar verme ya da Zarar gördüler {atıf:muruj-al-dhahab s. 630} İbn al-Jawzi'ye göre, iki yüz seksen yıl boyunca Sefer'de Banu Şeyban'a yaptığı baskınlar ve Al-Nubadh şiiri ile iki olayın hiçbirinin esirgemediğini belirtmiş, ona Halwan Geçidi'ni yirmi bin dinar ile kolaylaştırmasını emretmiş, El-Mansur Camii'nde ise saray ile arasına on yedi kemer açmış ve masraflar yirmi bin dinar olmuştur. Ayrıca Hassani Sarayı'nı halifeliğin merkezi olarak inşa etmesini emretmiş, burası oradaki ilk ikametgahdır. El-Mu'tadid'in bu baskını, Dubail'in yılındaki kitabında anılmıştır {atıf:Muntazam-ibn-al-jawzi s. 142-148}. Seksen altı yılındaki Rabi'al-Thani'de Amed, onu kuşattı ve mancınıklar kurdu, ta ki şefi onu güvence altına alana kadar, böylece koruma sağlandı, tahttan indirildi ve ardından duvarının yıkılmasını emretti {atıf:muntazam-ibn-al-jawzi s. 307-309}."
  id: "Khalifah Abbasiyah; ia diikrarkan setia sebagai putra mahkota di Safar pada tahun 278 H. Al-Tabari menyebutkan pada tahun 79 H tentang penggulingan Ja'far sebagai delegasi dan pengangkatannya dalam Muharram, termasuk {cite:tabari-tarikh-abu-al-fadl j.10 hlm.22} {cite:tabari-tarikh-abu-al-fadl j.10 hlm.28}. Pada tahun delapan puluh, ia berangkat ke Banu Shayban {cite:tabari-tarikh-abu-al-fadl j.10 hlm.32}, dan pada tahun delapan puluh satu, terjadi pertempuran antara dirinya dan Kurdi serta Badui {cite:tabari-tarikh-abu-al-fadl j.10 hlm.37}. Menurut al-Suyuti, ketika Ibn Tulun meninggal pada tahun tujuh puluh, al-Muwaffaq menunjuk ayahnya untuk menjalankan tugasnya dan mempersiapkannya untuk Mesir bersama tentara Irak, dan terjadi pertempuran besar antara dirinya dan Khumarawayh, menyebabkan darah mengalir di tanah, dan kemenangan menjadi milik orang Mesir {cite: Tarikh-Khulafa-minhaj-1434, hlm. 568}, menurut Al-Suyuti, ia lahir di Dhu al-Qi'dah pada tahun empat puluh dua, dan ibunya adalah seorang ibu bernama Sawab, dan dikatakan juga bahwa ia adalah seorang harz. Ia adalah raja yang berani dan agung, menunjukkan keagungan dan kekuatan yang hanya keluar. Ketika ia marah kepada seorang pemimpin, ia memerintahkan agar pemimpin itu dilemparkan ke dalam lubang dan dikutuk. Ia disebut tukang daging kedua karena ia memperbarui pemerintahan Abbasiyah. Ia telah diciptakan, dilemahkan, dan hampir menghilang. Ia mengalami kekacauan sejak pembunuhan al-Mutawakkil. Ia menghapus pajak, menyebarkan keadilan, dan hasutan mereda selama hidupnya karena prestise besarnya. Kebaikan melimpah dalam keamanan dan kemakmuran. Dia berkata kepada Hakim Ismail, 'Demi Tuhan, celana saya tidak pernah diizinkan untuk sesuatu yang terlarang.' Dia memerintahkan pembakaran sebuah buku yang mengumpulkan konsesi dari kesalahan para sarjana, karena dia mengatakan bahwa siapa pun yang mengambil semua kesalahan para sarjana telah kehilangan agamanya {cite:Tarikh-khulafa-minhaj-1434, hlm. 571-572}. Menurut al-Mas'udi, ia adalah Abu al-Abbas Ahmad ibn Talha al-Muwaffaq, dan ibunya adalah ibu dari seorang putra Rumiyya bernama Dirar. Ia bersumpah setia pada hari kematian pamannya al-Mu'tamid, Selasa, dua belas malam tersisa dari Rajab pada tahun 279 H. Ja'far al-Mufawwakkir digulingkan dari putra mahkota, dan ketika ia menjadi khalifah, perselisihan mereda, tanah menjadi tenang, perang meningkat, harga harga turun, dan setiap pelanggar diberikan perdamaian, dan Harun al-Shari menang. Ia meninggal pada hari Minggu, tujuh bulan sebelum Rabi' al-Thani pada tahun 289 H, sehingga masa kerajaannya berusia sembilan tahun Selama bertahun-tahun, sembilan bulan, dan dua hari, ia meninggalkan di rumah-rumah kaya sembilan ribu dinar, empat puluh ribu dirham, dan dua belas ribu ternak. Meski begitu, ia jarang dilihat, melihat apa yang tidak dilihat rakyat biasa {cite:muruj-al-dhahab hlm. 595-597}. Menurut al-Mas'udi, masyarakat Basra meresponsnya dengan perahu laut putih yang penuh lemak dan petir, mengeluh tentang kekeringan dan ketidakadilan para pekerja. Ia duduk di balik kerudung dan memberi izin, sehingga Abu Khalifa al-Jumahi berbicara kepada mereka dengan rima, berkata, 'Ini adalah iblis yang dilempar oleh laut, dan serupa harus dikorbankan untuknya.' Para raja menjawab permintaan mereka, dan ia berkemah pada awal tahun delapan puluh enam, mengepungnya, dan menyebarkan pasukannya di sekitarnya hingga Muhammad ibn Ahmad tiba dengan selamat {cite:muruj-al-dhahab, hlm. 602-605}. Al-Mas'udi menceritakan dari Hazm-nya kisah sepuluh bulan purnama, yang ia gali ke rumah pemilik Ata al-Jund dan meminta Mu'nis al-Ajli kepada para penyesal, yaitu tetua dari berbagai jenis pencuri yang telah tua dan bertobat. Mereka menunjuk seorang pria kurus yang memukulnya hingga hampir mati, tetapi ia menolak. Al-Mu'tadi memerintahkan agar ia dirawat dan diberi makan hingga ia sembuh. Kemudian tiga puluh singa bergiliran mengepungnya, tidak membiarkannya berbaring atau bersandar Dia tidur sampai hampir rusak. Dia berbaring dan memerintahkan agar dia dibangunkan, berkata, \"Ceritakan bagaimana kamu melakukannya.\" Dia mengaku bahwa dia menyembunyikan uang itu di bawah tumpukan duri di kamar mandi di seberang rumah. Ketika dia membawa uang itu dan menolaknya, dia membuka karpet dan menjatuhkannya di tangannya, sehingga dia memerintahkan agar diledakkan bersama blower hingga hampir pecah. Kemudian dia memukul dua pembuluh darah di atas alisnya, menyebabkan angin bertiup bersama darah hingga terpelintir. {cite:muruj-al-dhahab, hlm. 611-614}. Menurut al-Mas'udi, rakyat Baghdad memberontak bersama sultan karena berteriak bersama para pelayan, \"Wahai agat, tuangkan air dan tuang tepung.\" Dia memerintahkan sekelompok Rakyat biasa dicambuk, menyebabkan kerusuhan. Seorang pria muncul di rumahnya dalam berbagai bentuk—kadang biksu berjanggut putih, kadang pemuda, kadang tetua berpakaian pedagang, dan kadang dengan pedang terhunus di tangannya. Dia memukul beberapa pelayan dan membunuhnya. Kebanyakan orang berkata: beberapa mengatakan dia iblis pemberontak, beberapa percaya jin, dan beberapa bilang pelayan dengan keinginan budak. Dia menipu dengan obat filosofis yang tak terlihat mata. Dia memanggil para tamu dan membunuh serta menenggelamkan sekelompok pelayan dan pelayannya. {kutip: Muruj-al-Dhahab, hlm. 621-622}, dan bersama al-Mas'udi sejumlah uang dikembalikan dari Muhammad ibn Zayd dari Tabaristan untuk didistribusikan secara diam-diam kepada keluarga Abu Talib, sehingga ia mengedipkan mata padanya. Pria itu dibawa kepadanya, tetapi ia tidak setuju menyembunyikannya dan memerintahkannya untuk mengungkapkannya. Alasannya adalah kedekatan keluarga Abu Talib, yang disebabkan oleh hubungan keluarga. Ia melihat di penjara ayahnya seorang pria tua duduk di atas Sungai Tigris, yang membawanya ke airnya, dan Tigris akan mengeringkan lalu mengembalikannya. Dikatakan demikian, 'Ini Ali ibn Abi Talib.' Ia berkata kepadanya, 'Wahai Ahmad, ini terjadi padamu, jadi jangan sakiti anakku atau Mereka dirugikan {cite:muruj-al-dhahab hlm. 630} Menurut Ibn al-Jawzi, serangannya terhadap Banu Shayban di Safar pada tahun dua ratus delapan puluh tahun dengan puisi Al-Nubadh dan pernyataannya bahwa tidak ada dari kedua peristiwa itu yang luput dari itu, dan ia memerintahkan Shayban untuk memfasilitasi Halwan Pass dengan dua puluh ribu dinar, serta peningkatan di Masjid Al-Mansur, membuka tujuh belas lengkungan antara dirinya dan istana, dan biayanya mencapai dua puluh ribu dinar. Ia juga memerintahkan Shayban membangun Istana Hassani sebagai pusat kekhalifahan, yang merupakan kediaman pertama di sana. Serangan oleh al-Mu'tadid ini disebutkan dalam buku Dubail pada tahun beliau {cite:Muntazam-ibn-al-jawzi hlm. 142-148}. Pada Rabi' al-Thani tahun delapan puluh enam, Amed mengepungnya dan mendirikan katapel sampai kepala kepalanya berhasil mengamankannya, sehingga ia mendapat perlindungan, menggulingkannya, dan kemudian memerintahkan pembongkaran temboknya {cite:muntazam-ibn-al-jawzi hlm. 307-309}."
