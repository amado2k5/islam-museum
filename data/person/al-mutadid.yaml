id: person/al-mutadid
class: person
label: { ar: "المعتضد بالله" }
summary:
  ar: "خليفة عباسي؛ بُويع له بولاية العهد في صفر سنة ثمان وسبعين ومائتين، ويذكر الطبري في سنة تسع وسبعين خلع جعفر المفوّض وتوليته في المحرم منها {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. وفي سنة ثمانين قصد بني شيبان {cite:tabari-tarikh-abu-al-fadl j.10 p.32}، وفي سنة إحدى وثمانين وقعت بينه وبين الأكراد والأعراب وقعة {cite:tabari-tarikh-abu-al-fadl j.10 p.37}، وعند السيوطي لما مات ابن طولون سنة سبعين ولاه الموفق أباه أعماله وجهزه إلى مصر في جنود العراق فوقع بينه وبين خمارويه وقعة عظيمة بحيث جرت الأرض من الدماء وكان النصر للمصريين {cite:tarikh-khulafa-minhaj-1434 p. 568}، وعند السيوطي ولد في ذي القعدة سنة اثنتين وأربعين وأمه أم ولد اسمها صواب وقيل حرز، وكان ملكاً شجاعاً مهيباً ظاهر الجبروت يقدم على الأسد وحده وإذا غضب على قائد أمر به يلقى في حفيرة ويطم عليه، وكان يسمى السفاح الثاني لأنه جدد ملك بني العباس وكان قد خلق وضعف وكاد يزول وكان في اضطراب من وقت قتل المتوكل، وأسقط المكوس ونشر العدل وسكنت الفتن في أيامه لفرط هيبته وكانت أيامه طيبة كثيرة الأمن والرخاء، وقال للقاضي إسماعيل والله ما حللت سراويلي على حرام قط، وأمر بإحراق كتاب جمعت له فيه الرخص من زلل العلماء لما قال له من أخذ بكل زلل العلماء ذهب دينه {cite:tarikh-khulafa-minhaj-1434 p. 571-572}.، وعند المسعودي هو أبو العباس أحمد بن طلحة الموفق وأمه أم ولد رومية يقال لها ضرار، بويع في اليوم الذي مات فيه عمه المعتمد يوم الثلاثاء لاثنتي عشرة ليلة بقيت من رجب سنة تسع وسبعين ومائتين، وخلع جعفر المفوض من ولاية العهد، ولما أفضت الخلافة إليه سكنت الفتن وصلحت البلدان وارتفعت الحروب ورخصت الأسعار وسالمه كل مخالف وظفر بهارون الشاري، وتوفي يوم الأحد لسبع بقين من ربيع الآخر سنة تسع وثمانين ومائتين فكانت خلافته تسع سنين وتسعة أشهر ويومين، وخلف في بيوت الأموال تسعة آلاف ألف دينار وأربعين ألف ألف درهم واثني عشر ألف رأس من الدواب وكان مع ذلك شحيحاً ينظر فيما لا ينظر فيه العوام {cite:muruj-al-dhahab p. 595-597}، وعند المسعودي ورد أهل البصرة عليه في مراكب بحرية بيض مشحمة بالشحم والنورة يشكون الجدب وجور العمال فجلس لهم من وراء حجاب وأذن لهم فخطبهم أبو خليفة الجمحي بسجعه فقال هذا شيطان قذف به البحر ومثله فليفد على الملوك فأجابهم إلى ما سألوا، ونزل على آمد سنة ست وثمانين فحاصرها وبث جيوشه حولها حتى نزل محمد بن أحمد على الأمان {cite:muruj-al-dhahab p. 602-605}، وروى المسعودي من حزمه خبر العشر البدر التي نقب بيت صاحب عطاء الجند فطلبها مؤنس العجلي بالتوابين وهم شيوخ أنواع اللصوص الذين كبروا وتابوا فدلوا على رجل نحيف فضربه حتى كاد يهلك فأنكر، فأمر المعتضد بعلاجه وإطعامه حتى برئ ثم حصره ثلاثون أسود يتناوبون لا يدعونه يتكئ ولا ينام حتى قارب التلف، فاستلقى فأمر بإيقاظه فقال حدثني كيف صنعت فاعترف أنه خبأ المال تحت كوم شوك بحمام مقابل الدار، فلما أحضر المال وجحد كشف له البساط عنه فأسقط في يده فأمر بنفخه بالمنفاخ حتى كاد ينشق ثم ضرب في عرقين فوق حاجبيه فخرجت الريح مع الدم حتى تلف {cite:muruj-al-dhahab p. 611-614}، وعند المسعودي كان لأهل بغداد ثورة مع السلطان لصياحهم بالخدم السودان يا عقيق صب ماء واطرح دقيق فأمر بجماعة من العامة فضربوا بالسياط فشغب العامة، وظهر له شخص في صور مختلفة في داره تارة راهب ذو لحية بيضاء وتارة شاب وتارة شيخ ببزة التجار وتارة بيده سيف مسلول ضرب بعض الخدم فقتله، فأكثر الناس القول منهم من قال شيطان مريد ومنهم من قال مؤمن الجن زاجر ومنهم من قال خادم هوى جارية فاحتال بعقاقير فلسفية لا تدرك بالبصر، فأحضر المعزمين وقتل وغرق جماعة من خدمه وجواريه {cite:muruj-al-dhahab p. 621-622}"
