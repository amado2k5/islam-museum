  ar: "خليفة عباسي؛ بُويع له بولاية العهد في صفر سنة ثمان وسبعين ومائتين، ويذكر الطبري في سنة تسع وسبعين خلع جعفر المفوّض وتوليته في المحرم منها {cite:tabari-tarikh-abu-al-fadl j.10 p.22} {cite:tabari-tarikh-abu-al-fadl j.10 p.28}. وفي سنة ثمانين قصد بني شيبان {cite:tabari-tarikh-abu-al-fadl j.10 p.32}، وفي سنة إحدى وثمانين وقعت بينه وبين الأكراد والأعراب وقعة {cite:tabari-tarikh-abu-al-fadl j.10 p.37}."
