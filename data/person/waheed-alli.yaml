summary:
  ar: "وحيد علي، بارون علي أوف نوربري ⁦(وُلد في 16 تشرين الثاني 1964)⁩ رائد أعمال إعلامي وسياسي عمالي بريطاني، وُلد في كرويدون بلندن. شارك في تأسيس شركة «بلانيت 24» وتولى مناصب تنفيذية في كارلتون وكوريون وسيلفرغيت ميديا، ومُنح لقب لورد مدى الحياة سنة 1998 وهو في الرابعة والثلاثين، فكان أصغر أعضاء مجلس اللوردات وأول لورد مثلي معلن، وقاد حملات إلغاء المادة 28 ومساواة سن الرشد."
  en: "Waheed Alli, Baron Alli of Norbury (born 16 November 1964) is a British media entrepreneur and Labour politician, born in Croydon, London. A co-founder of Planet 24, he held executive posts at Carlton, Chorion and Silvergate Media, and was made a life peer in 1998 at the age of 34, then the youngest member of the House of Lords and its first openly gay peer; he led the campaigns to repeal Section 28 and to equalise the age of consent."
  ur: "وحید علی، بیرن علی آف نوربری ⁦(پیدائش 16 نومبر 1964)⁩ برطانوی میڈیا کاروباری اور لیبر سیاست دان ہیں، جو لندن کے کروئڈن میں پیدا ہوئے۔ انہوں نے «پلینٹ 24» کی مشترکہ بنیاد رکھی اور کارلٹن، کوریون اور سلورگیٹ میڈیا میں انتظامی عہدوں پر رہے؛ 1998 میں 34 سال کی عمر میں انہیں تاحیات لارڈ بنایا گیا، اس وقت وہ ایوانِ بالا کے سب سے کم عمر اور پہلے کھلے عام ہم جنس پرست رکن تھے، اور انہوں نے دفعہ 28 کے خاتمے اور رضامندی کی عمر برابر کرنے کی مہمات کی قیادت کی۔"
  es: "Waheed Alli, barón Alli de Norbury (nacido el 16 de noviembre de 1964), es un empresario de medios británico y político laborista, nacido en Croydon, Londres. Cofundador de Planet 24, ocupó cargos ejecutivos en Carlton, Chorion y Silvergate Media, y fue nombrado par vitalicio en 1998 a la edad de 34 años, siendo entonces el miembro más joven de la Cámara de los Lores y su primer par abiertamente gay; lideró las campañas para derogar la Sección 28 y para igualar la edad de consentimiento."
  fr: "Waheed Alli, baron Alli de Norbury (né le 16 novembre 1964), est un entrepreneur des médias et homme politique travailliste britannique, né à Croydon, Londres. Cofondateur de Planet 24, il a occupé des postes de direction chez Carlton, Chorion et Silvergate Media. Nommé pair à vie en 1998 à l'âge de 34 ans, il était alors le plus jeune membre de la Chambre des lords et son premier pair ouvertement homosexuel. Il a mené les campagnes pour l'abrogation de l'article 28 et pour l'harmonisation de l'âge du consentement."
  tr: "Waheed Ali, Norbury Baronu Ali (d. 16 Kasım 1964), Croydon, Londra doğumlu Britanyalı bir medya girişimcisi ve İşçi Partisi politikacısıdır. Planet 24'ün kurucu ortaklarından oldu ve Carlton, Corion ve Selvergate Media'da yönetici pozisyonlarında bulundu. 1998'de otuz dört yaşında Yaşam Lordu unvanı verildi; böylece Lordlar Kamarası'nın en genç üyesi ve ilk açık eşcinsel Lord oldu. 28. Madde'nin yürürlükten kaldırılması ve reşit yaşın eşitlenmesi için kampanyalara liderlik etti."
  id: "Waheed Ali, Baron Ali dari Norbury (lahir 16 November 1964) adalah seorang pengusaha media Inggris dan politisi Buruh, lahir di Croydon, London. Ia ikut mendirikan Planet 24 dan memegang posisi eksekutif di Carlton, Corion, dan Selvergate Media. Ia dianugerahi gelar Life Lord pada tahun 1998 di usia tiga puluh empat tahun, menjadi anggota termuda House of Lords dan Lord pertama yang secara terbuka gay. Ia memimpin kampanye untuk mencabut Pasal 28 dan menyamakan usia dewasa."

