summary:
  ar: "وحيد علي، بارون علي أوف نوربري (وُلد في 16 تشرين الثاني 1964) رائد أعمال إعلامي وسياسي عمالي بريطاني، وُلد في كرويدون بلندن. شارك في تأسيس شركة «بلانيت 24» وتولى مناصب تنفيذية في كارلتون وكوريون وسيلفرغيت ميديا، ومُنح لقب لورد مدى الحياة سنة 1998 وهو في الرابعة والثلاثين، فكان أصغر أعضاء مجلس اللوردات وأول لورد مثلي معلن، وقاد حملات إلغاء المادة 28 ومساواة سن الرشد."
  en: "Waheed Alli, Baron Alli of Norbury (born 16 November 1964) is a British media entrepreneur and Labour politician, born in Croydon, London. A co-founder of Planet 24, he held executive posts at Carlton, Chorion and Silvergate Media, and was made a life peer in 1998 at the age of 34, then the youngest member of the House of Lords and its first openly gay peer; he led the campaigns to repeal Section 28 and to equalise the age of consent."
  ur: "وحید علی، بیرن علی آف نوربری (پیدائش 16 نومبر 1964) برطانوی میڈیا کاروباری اور لیبر سیاست دان ہیں، جو لندن کے کروئڈن میں پیدا ہوئے۔ انہوں نے «پلینٹ 24» کی مشترکہ بنیاد رکھی اور کارلٹن، کوریون اور سلورگیٹ میڈیا میں انتظامی عہدوں پر رہے؛ 1998 میں 34 سال کی عمر میں انہیں تاحیات لارڈ بنایا گیا، اس وقت وہ ایوانِ بالا کے سب سے کم عمر اور پہلے کھلے عام ہم جنس پرست رکن تھے، اور انہوں نے دفعہ 28 کے خاتمے اور رضامندی کی عمر برابر کرنے کی مہمات کی قیادت کی۔"

