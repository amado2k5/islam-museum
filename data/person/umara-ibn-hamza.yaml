class: person
label: { ar: "عمارة بن حمزة", en: "Umara Ibn Hamza", es: "Umara Ibn Hamza", fr: "Umara Ibn Hamza", ur: "عمرہ بن حمزہ" }
summary:
  ar: "عمارة بن حمزة كاتب أبي جعفر المنصور ومولاه وكان تأها معجبا كريما بليغا فصيحا أعور، وكان أبو جعفر والمهدي يقدمانه ويحتملان أخلاقه لفضله وبلاغته ووجوب حقه وولى لهما الأعمال الكبار، وله رسائل مجموعة من جماتها رسالة الجيش التي تقر لبني العباس {cite:fihrist-ibn-al-nadim p. 171}."
  en: "Umara ibn Hamza — Mansur's one-eyed secretary, author of the letter winning the army to the Abbasids {cite:fihrist-ibn-al-nadim}"
  es: "Umara ibn Hamza — Secretario tuerto de Mansur, autor de la carta que convenció al ejército para unirse a los abasíes {cite:fihrist-ibn-al-nadim}"
  fr: "Umara ibn Hamza — Secrétaire borgne de Mansur, auteur de la lettre qui a permis aux Abbassides de gagner l'armée {cite:fihrist-ibn-al-nadim}"
  ur: "عمرہ بن حمزہ - منصور کا ایک آنکھ والا سیکرٹری، عباسیوں کو فوج جیتنے والے خط کا مصنف۔"
  tr: "İmara bin Hamza, Ebu Ca'fer el-Mansur'un yazıcısı ve özgür adamıydı; soylu, etkileyici ve etkileyici bir hayrandı. Ebu Ca'far ve el-Mehdi, erdemliliği, hitabeti ve hakkının yükümlülüğü nedeniyle ona öncelik verir ve karakterini taşırdı. Onlara büyük görevler emanet etti. Abbâsîleri kabul eden Ordu İncesi de dahil olmak üzere birçok mektup yazdı {cite:fihrist-ibn-al-nadim s. 171}."
  id: "Imara ibn Hamza adalah juru tulis dan mantan budak Abu Ja'far al-Mansur, dan ia adalah seorang bangsawan, fasih, fasih, dan pengagum bermata satu. Abu Ja'far dan al-Mahdi biasa memberinya prioritas dan membawa karakternya karena kebajikan, kefasihannya, dan kewajiban atas haknya. Ia mempercayakan mereka jabatan besar. Ia menulis sejumlah surat, termasuk Risalah Tentara yang mengakui Abbasiyah {cite:fihrist-ibn-al-nadim hlm. 171}."
