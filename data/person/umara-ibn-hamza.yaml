summary:
  ar: "عمارة بن حمزة كاتب أبي جعفر المنصور ومولاه وكان تأها معجبا كريما بليغا فصيحا أعور، وكان أبو جعفر والمهدي يقدمانه ويحتملان أخلاقه لفضله وبلاغته ووجوب حقه وولى لهما الأعمال الكبار، وله رسائل مجموعة من جماتها رسالة الجيش التي تقر لبني العباس {cite:fihrist-ibn-al-nadim p. 171}."
  en: "Umara ibn Hamza — Mansur's one-eyed secretary, author of the letter winning the army to the Abbasids {cite:fihrist-ibn-al-nadim}"
