id: person/mahmud-al-himyari-mirbat
class: person
label: { ar: "محمد الحميري صاحب مرباط", en: "Mahmud al-Himyari of Mirbat", es: "Mahmud al-Himyari of Mirbat", fr: "Mahmud al-Himyari of Mirbat", ur: "میربٹ کے محمود الحمیری۔" }
summary:
  ar: "محمود بن محمد الحميري صاحب مرباط وظفار وساحل حضرموت؛ بدأ بمركب يكريه في البحر للتجار ثم وزر لصاحب مرباط وفيه كرم وشجاعة وحسن سيرة، فلما توفي صاحبها ملك المدينة وأطاعه الناس محبة له، فلما كان سنة تسع عشرة وستمائة خرب مرباط وظفار وبنى مدينة جديدة على ساحل البحر قرب مرباط عند عين عذبة كبيرة أجراها إليها وعمل عليها سوراً وخندقاً وسماها الأحمدية، وكان يحب الشعر ويكثر الجائزة عليه {cite:kamil-ibn-al-athir p. 297}."
  en: "From boat-hirer to lord of the Dhofar coast — Mahmud al-Himyari served as vizier to Mirbat's ruler, inherited the city by popular affection for his generosity, and in 619 rebuilt it as the walled al-Ahmadiyya beside a great freshwater spring; a lavish patron of poets {cite:kamil-ibn-al-athir p. 297}."
  es: "De arrendatario de barcos a señor de la costa de Dhofar: Mahmud al-Himyari sirvió como visir del gobernante de Mirbat, heredó la ciudad por el afecto popular debido a su generosidad, y en 619 la reconstruyó como la ciudad amurallada de al-Ahmadiyya junto a un gran manantial de agua dulce; un generoso mecenas de poetas {cite:kamil-ibn-al-athir p. 297}."
  fr: "De loueur de bateaux à seigneur de la côte du Dhofar — Mahmud al-Himyari a servi comme vizir du souverain de Mirbat, a hérité de la ville grâce à l'affection populaire pour sa générosité, et en 619, l'a reconstruite en tant que ville fortifiée d'al-Ahmadiyya à côté d'une grande source d'eau douce; un généreux mécène des poètes {cite:kamil-ibn-al-athir p. 297}."
  ur: "کشتی کے کرایہ دار سے لے کر دھوفر کے ساحل کے مالک تک - محمود الحمیری نے میربٹ کے حکمران کے وزیر کے طور پر خدمات انجام دیں، شہر کو اس کی سخاوت کے لیے وراثت میں ملا، اور 619 میں اسے ایک عظیم میٹھے پانی کے چشمے کے ساتھ دیوار الاحمدیہ کے طور پر دوبارہ تعمیر کیا۔ شاعروں کا ایک شاندار سرپرست {حوالہ: کامل ابن الثیر صفحہ 297}۔"
  tr: "Mirbat, Dhofar ve Hadramaut kıyısının hükümdarı Mahmud bin Muhammed El-Himyari; denizde tüccarlara kiraladığı bir tekneyle başladı, sonra cömert, cesur ve iyi davranışlı Mirbat sahibinin ziyaretçisi oldu. Sahibi öldüğünde Medine kralı oldu ve halk ona olan sevgisinden dolayı itaat etti. 1960 yılında Mirbat ve Dhofar'ı yıktı, Mirbat yakınlarında büyük bir 'Adhaba pınarının yanında sahilde yeni bir şehir inşa etti, üzerine bir duvar ve hendek inşa etti ve adını El-Ahmediye koydu. Şiiri çok severdi ve bunun için cömertçe ödüllendirildi {atıf:kamil-ibn-al-athir s. 297}."
  id: "Mahmoud bin Muhammad Al-Himyari, penguasa Mirbat, Dhofar, dan pesisir Hadramaut; ia memulai dengan sebuah perahu yang ia sewakan kepada pedagang di laut, lalu sebagai pengunjung pemilik Mirbat yang murah hati, berani, dan berperilaku baik. Ketika pemiliknya meninggal, ia menjadi raja Madinah dan rakyat menaatinya karena cinta kepadanya. Pada tahun 1960, ia menghancurkan Mirbat dan Dhofar serta membangun kota baru di tepi laut dekat Mirbat dekat mata air besar 'Adhaba yang ia bangun di sana, membangun tembok dan parit di atasnya, dan menamainya Al-Ahmadiyah. Ia mencintai puisi dan diberi penghargaan yang murah hati karenanya {cite:kamil-ibn-al-athir hlm. 297}."
