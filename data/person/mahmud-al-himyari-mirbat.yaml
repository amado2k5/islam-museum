label: { ar: "محمد الحميري صاحب مرباط", en: "Mahmud al-Himyari of Mirbat" }
summary:
  ar: "محمود بن محمد الحميري صاحب مرباط وظفار وساحل حضرموت؛ بدأ بمركب يكريه في البحر للتجار ثم وزر لصاحب مرباط وفيه كرم وشجاعة وحسن سيرة، فلما توفي صاحبها ملك المدينة وأطاعه الناس محبة له، فلما كان سنة تسع عشرة وستمائة خرب مرباط وظفار وبنى مدينة جديدة على ساحل البحر قرب مرباط عند عين عذبة كبيرة أجراها إليها وعمل عليها سوراً وخندقاً وسماها الأحمدية، وكان يحب الشعر ويكثر الجائزة عليه {cite:kamil-ibn-al-athir p. 297}."
  en: "From boat-hirer to lord of the Dhofar coast — Mahmud al-Himyari served as vizier to Mirbat's ruler, inherited the city by popular affection for his generosity, and in 619 rebuilt it as the walled al-Ahmadiyya beside a great freshwater spring; a lavish patron of poets {cite:kamil-ibn-al-athir p. 297}."
