summary:
  ar: "أنصاري من بني مبذول من بني النجار؛ بعثه النبي مع عبد الله بن وهب الأسلمي إلى مسيلمة فلم يعرض لعبد الله وقطع يدي حبيب ورجليه — وقال الواقدي إنما أُقبلا مع عمرو بن أمية الضمري من عمان فكفتهما مسيلمة فنجا عمرو ومن معه غير هذين — وأمه نسيبة بنت كعب التي قاتلت يوم اليمامة."
  en: "An Ansari of Banu Mabdhul of Banu al-Najjar; the Prophet sent him with Abdullah ibn Wahb al-Aslami to Musaylima, who left Abdullah unharmed but cut off Habib's hands and feet — al-Waqidi has them brought from Oman with Amr ibn Umayya al-Damri, Musaylima sparing Amr and those with him save these two — his mother being Nusayba bint Ka'b who fought at al-Yamama."
