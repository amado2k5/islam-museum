summary:
  ar: "أبو القاسم عبد الله — وقيل عبد الباقي — بن محمد بن الحسين بن داود بن ناقيا البغدادي، المعروف بابن ناقيا؛ الأديب الشاعر اللغوي المترسل من أهل الحريم الطاهري ببغداد؛ كان فاضلاً بارعاً وله مصنفات حسنة منها كتاب الجمان في تشبهات القرآن وملح الملاحة، وله مقامات أدبية مشهورة، واختصر الأغاني في مجلد واحد وشرح كتاب الفصيح، وله ديوان في ملوك الطوائف وديوان شعر ورسائل؛ أثنى عليه العماد الأصبهاني في الخريدة؛ وكان ينسب إلى التعطيل ومذهب الأوائل {cite:wafayat-ayan}."
  en: "Ibn Naqiya (d. 485) — Baghdad man of letters, poet, philologist and epistolographer of the Harim quarter; author of the famous Maqamat, al-Juman fi Tashbihat al-Qur'an, a one-volume abridgment of al-Aghani, and a diwan on the Taifa kings {cite:wafayat-ayan}."
  es: "Ibn Naqiya (m. 485): hombre de letras de Bagdad, poeta, filólogo y epistológrafo del barrio de Harim; autor del famoso Maqamat, al-Juman fi Tashbihat al-Qur'an, un resumen en un volumen de al-Aghani y un diwan sobre los reyes de Taifa {citar:wafayat-ayan}."
  fr: "Ibn Naqiya (mort en 485) — Homme de lettres de Bagdad, poète, philologue et épistolographe du quartier de Harim; auteur du célèbre Maqamat, al-Juman fi Tashbihat al-Qur'an, un abrégé en un volume d'al-Aghani et un diwan sur les rois Taifa {cite: wafayat-ayan}."
  ur: "ابن نقیہ ⁦(متوفی 485)⁩ — بغداد کا خطیب، شاعر، ماہر فلسفی اور حریم سہ ماہی کا خطاط؛ مشہور مقام کے مصنف، الجمان فی تسبیحات القرآن، الاغانی کی ایک جلد کا خلاصہ، اور طائفہ کے بادشاہوں پر ایک دیوان۔"
  tr: "Ebu el-Kasım Abdullah — ya da adıyla Abdülbazi — ibn Muhammed bin el-Hüseyin ibn Davud ibn Naqiya el-Bağdadi, İbn Nakıya olarak bilinir; Bağdat'taki el-Harim el-Tahiri halkından edebi figür, şair, dilbilimci ve dilbilimci; El-Cuman fi Taşbihat el-Kur'an ve Milh al-Malha gibi mükemmel eserleriyle erdemli ve yetkin bir âlimdi. Ayrıca ünlü edebi makamatlar yazdı, tek ciltte kısaltılmış şarkılar yazdı, klasik metne yorum yaptı ve Taifa krallarından oluşan bir koleksiyon ile şiir ve mektup koleksiyonuna sahipti; el-Kharida'da el-İmad el-İsfahani tarafından övüldü; erken alimlerin askıya alınması ve doktrinine atfedildi {atı:wafayat-ayan}."
  id: "Abu al-Qasim Abdullah — atau disebut Abd al-Baqi — ibn Muhammad ibn al-Husayn ibn Dawud ibn Naqiya al-Baghdadi, dikenal sebagai Ibn Naqiyya; tokoh sastra, penyair, bahasa, dan ahli bahasa dari masyarakat al-Harim al-Tahiri di Baghdad; ia adalah ulama yang berbudi luhur dan berprestasi dengan karya-karya luar biasa termasuk buku Al-Juman fi Tashbihat al-Qur'an dan Milh al-Malha. Ia juga menulis maqaat sastra terkenal, merangkum lagu dalam satu jilid, mengomentari teks klasik, dan memiliki kumpulan raja Taifa serta kumpulan puisi dan surat; ia dipuji oleh al-Imad al-Isfahani dalam al-Kharida; ia dikaitkan dengan penangguhan dan doktrin para ulama awal {cite:wafayat-ayan}."
