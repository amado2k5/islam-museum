summary:
  ar: "أبو القاسم عبد الله — وقيل عبد الباقي — بن محمد بن الحسين بن داود بن ناقيا البغدادي، المعروف بابن ناقيا؛ الأديب الشاعر اللغوي المترسل من أهل الحريم الطاهري ببغداد؛ كان فاضلاً بارعاً وله مصنفات حسنة منها كتاب الجمان في تشبهات القرآن وملح الملاحة، وله مقامات أدبية مشهورة، واختصر الأغاني في مجلد واحد وشرح كتاب الفصيح، وله ديوان في ملوك الطوائف وديوان شعر ورسائل؛ أثنى عليه العماد الأصبهاني في الخريدة؛ وكان ينسب إلى التعطيل ومذهب الأوائل {cite:wafayat-ayan}."
  en: "Ibn Naqiya (d. 485) — Baghdad man of letters, poet, philologist and epistolographer of the Harim quarter; author of the famous Maqamat, al-Juman fi Tashbihat al-Qur'an, a one-volume abridgment of al-Aghani, and a diwan on the Taifa kings {cite:wafayat-ayan}."
