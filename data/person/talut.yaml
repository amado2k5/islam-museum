id: person/talut
class: person
label: { ar: "طالوت", en: "Talut (Saul)", ur: "طالوت" }
gender: male
summary:
  ar: "الملك الذي بعثه الله لبني إسرائيل بعد موسى، كما يرويه الشعراوي في تفسير البقرة 247 والآيات التي تليها. يرى الشعراوي أن اختياره كان من الله لا باختيار الناس، وأن معيار الاختيار العلم وبسطة الجسم، لا النسب ولا المال {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1046} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1047}."
  en: "The king God sent to the Children of Israel after Musa, as Sha'rawi tells it in his commentary on al-Baqara 247 and the verses after it. He holds that God chose Talut, not the people, and that the criteria were knowledge and bodily stature, not lineage or wealth {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1046} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1047}."
  ur: "بنی اسرائیل کے لیے موسیٰ کے بعد اللہ کا بھیجا ہوا بادشاہ، جیسا کہ شعراوی سورہ البقرہ کی آیت 247 اور اس کے بعد کی آیات کی تفسیر میں بیان کرتے ہیں۔ ان کے نزدیک انتخاب لوگوں نے نہیں، اللہ نے کیا، اور معیار علم اور جسمانی وسعت تھا، نسب یا مال نہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1046} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1047}."
