id: person/shabib-al-kharijite
class: person
label: { ar: "شبيب الخارجي" }
summary:
  ar: "ذكر الطبري هلاكه في سنة سبع أو ثمان وسبعين {cite:tabari-tarikh-abu-al-fadl j.6 p.279}. وعند المسعودي في سنة سبع وسبعين كاذت للحجاج حروب مع شبيب حتى تحصن في دار الإمارة بالكوفة ودخل شبيب وأمه وزوجته غزالة الكوفة عند الصباح، فبعث عبد الملك سفيان بن الأبرد الكلبي فانهزم شبيب وقتلت غزالة وأمه، وولى حتى وصل جسر دجيل فنفر به فرسه وعليه الحديد الثقيل فألقاه في الماء فقال له بعض أصحابه أغرقاً يا أمير المؤمنين فقال ذلك تقدير العزيز العليم {cite:muruj-al-dhahab p. 130} ويذكر الكتاب أن شوذب الخارجي تجدّدت حركته في أول خلافة يزيد بن عبد الملك، وأن مسلمة قضى عليه وعلى أصحابه بعد أن أرسل إليه سعيد الحرشي بجيش، وقُتل شوذب سنة 101هـ. {cite:salabi-umayyad-state-2020 p.430}"
  tr: "El-Tabari, ölümünü yetmiş yedinci veya yetmiş sekizde belirtmiştir {atıf:tabari-tarikh-abu-al-fadl j.6 s.279}. 77 Hicri yılında, el-Haccac Şabib ile savaştı ve Kufa'daki vali sarayında tahkim oldu. Şabib, annesi ve eşi Gazela sabah Kufa'ya girdiler. Abdülmelik, Sufyan bin el-Abard el-Kalbi'yi gönderdi, ancak Şabîp yenildi ve Gazela ile annesi öldürüldü. Dijail köprüsüne ulaşana kadar kaçtı, ağır demir taşıyan atını alıp suya attı. Bazı yoldaşları ona, 'Boğul, ey Müminlerin Komutanı' dedi. O da şöyle cevap verdi: 'Bu, Yüce Olan, Her Şeyi Bilen'in hükmüdür.' {alıntı:Muruj-al-Dhahab, s. 130} Kitap, Shawdhab al-Kharaji'nin hareketinin Yezid bin Abdül-Malik'in halifeliğinin başında yeniden başladığını ve Maslama'nın Sa'id al-Harashi onu bir orduyla gönderdikten sonra onu ve yoldaşlarını ortadan kaldırdığını, Shawsa'nin ise 101 Hicri'de öldürüldüğünü belirtir. {cite:Salabi-Umayyad-state-2020 s.430}"
  id: "Al-Tabari menyebutkan kematiannya pada tahun tujuh puluh tujuh atau tujuh puluh delapan {cite:tabari-tarikh-abu-al-fadl j.6 hlm.279}. Pada tahun 77 H, al-Hajjaj bertempur melawan Shabib hingga ia menguatkan diri di istana gubernur di Kufa. Shabib, ibunya, dan istrinya Ghazala masuk ke Kufa pada pagi hari. Abd al-Malik mengirim Sufyan ibn al-Abard al-Kalbi, tetapi Shabib kalah, dan Ghazala serta ibunya tewas. Ia melarikan diri hingga mencapai jembatan Dijail, di mana ia membawa kudanya yang membawa besi berat, melemparkannya ke air. Beberapa sahabatnya berkata kepadanya, 'Tenggelamlah, wahai Panglima Orang Beriman.' Ia menjawab, 'Inilah hukuman Yang Maha Kuasa, Yang Maha Tahu.' {cite:muruj-al-dhahab, hlm. 130} Buku ini menyebutkan bahwa gerakan Shawdhab al-Kharaji kembali bangkit pada awal kekhalifahan Yazid ibn Abd al-Malik, dan bahwa Maslama menyingkirkan dia dan para sahabatnya setelah Sa'id al-Harashi mengirimnya dengan pasukan, dan Shawdhab tewas pada tahun 101 H. {sitasi: Salabi-Umayyad-State-2020 hlm.430}"
