label: { ar: "شبيب الخارجي" }
summary:
  ar: "ذكر الطبري هلاكه في سنة سبع أو ثمان وسبعين {cite:tabari-tarikh-abu-al-fadl j.6 p.279}. وعند المسعودي في سنة سبع وسبعين كاذت للحجاج حروب مع شبيب حتى تحصن في دار الإمارة بالكوفة ودخل شبيب وأمه وزوجته غزالة الكوفة عند الصباح، فبعث عبد الملك سفيان بن الأبرد الكلبي فانهزم شبيب وقتلت غزالة وأمه، وولى حتى وصل جسر دجيل فنفر به فرسه وعليه الحديد الثقيل فألقاه في الماء فقال له بعض أصحابه أغرقاً يا أمير المؤمنين فقال ذلك تقدير العزيز العليم {cite:muruj-al-dhahab p. 130} ويذكر الكتاب أن شوذب الخارجي تجدّدت حركته في أول خلافة يزيد بن عبد الملك، وأن مسلمة قضى عليه وعلى أصحابه بعد أن أرسل إليه سعيد الحرشي بجيش، وقُتل شوذب سنة 101هـ. {cite:salabi-umayyad-state-2020 p.430}"
wings: [people]
