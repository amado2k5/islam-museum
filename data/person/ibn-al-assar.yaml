summary:
  ar: "أبو الحسن علي بن عبد الرحيم بن الحسن بن عبد الملك المعروف بابن العصار؛ اللغوي؛ قرأ الأدب على الشريف أبي السعادات ابن الشجري وأبي منصور ابن الجواليقي وبرع في فنه وأقرأ الناس زماناً؛ رحل إلى مصر واجتمع بأبي محمد ابن بري والموفق بن الخلال كاتب الإنشاء؛ كان عارفاً بديوان أبي الطيب المتنبي عاماً ورواية؛ وادع طرائف خراسان والشام ومصر وكتب بخطه الكثير من كتب الأدب وشعر العرب وكانت طريقته في الخط حسنة والناس يتنافسون في خطه ويغالون به {cite:wafayat-ayan}."
  en: "Ibn al-Assar (508–576) — Baghdad philologist of Ibn al-Shajari and Ibn al-Jawaliqi's line; keeper of al-Mutanabbi's diwan whose beautiful hand collectors competed over {cite:wafayat-ayan}."
