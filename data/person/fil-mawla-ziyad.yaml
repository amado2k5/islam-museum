summary:
  ar: "فيل مولى زياد وحاجبه؛ صاحب ثاني حمام بالبصرة وركب معه أبو الأسود الدؤلي وأنس بن زنيم وهو على برذون هملاج وهما على فرسي سوء فأدركهما الحسد فألغز أنس أبا الأسود فقال على الثلثين من حمام فيل لعمر أبيك ما حمام كسرى وقال أبو الأسود وما أرقاصنا حول الموالي بسنتنا على عهد الرسول."
  en: "Fil, Ziyad's mawla and chamberlain, owner of Basra's second bathhouse; his hamlaaj-nag beside Abu al-Aswad's and Anas ibn Zunaym's poor mounts bred the riddle 'two-thirds of Fil's bath — by your father, Kisra's bath is naught' and Abu al-Aswad's answer that they would not flaunt among the mawali on the Prophet's sunnah."
