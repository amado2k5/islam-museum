id: person/fil-mawla-ziyad
class: person
label: { ar: "فيل مولى زياد", en: "Fil, Ziyad's Mawla", es: "Fil, Ziyad's Mawla", fr: "Fil, Ziyad's Mawla", ur: "فل، زیاد کا مولا" }
summary:
  ar: "فيل مولى زياد وحاجبه؛ صاحب ثاني حمام بالبصرة وركب معه أبو الأسود الدؤلي وأنس بن زنيم وهو على برذون هملاج وهما على فرسي سوء فأدركهما الحسد فألغز أنس أبا الأسود فقال على الثلثين من حمام فيل لعمر أبيك ما حمام كسرى وقال أبو الأسود وما أرقاصنا حول الموالي بسنتنا على عهد الرسول."
  en: "Fil, Ziyad's mawla and chamberlain, owner of Basra's second bathhouse; his hamlaaj-nag beside Abu al-Aswad's and Anas ibn Zunaym's poor mounts bred the riddle 'two-thirds of Fil's bath — by your father, Kisra's bath is naught' and Abu al-Aswad's answer that they would not flaunt among the mawali on the Prophet's sunnah."
  es: "Fil, mawla y chambelán de Ziyad, propietario del segundo baño público de Basora; su hamlaaj-nag junto a las pobres monturas de Abu al-Aswad y Anas ibn Zunaym engendró el acertijo \"dos tercios del baño de Fil, por tu padre, el baño de Kisra no es nada\" y la respuesta de Abu al-Aswad de que no harían alarde entre los mawali de la sunnah del Profeta."
  fr: "Fil, le mawla et chambellan de Ziyad, propriétaire du deuxième bain public de Bassora; son hamlaaj-nag, situé à côté des pauvres montures d'Abu al-Aswad et d'Anas ibn Zunaym, a donné naissance à l'énigme « les deux tiers du bain de Fil — par ton père, le bain de Kisra ne vaut rien » et à la réponse d'Abu al-Aswad qu'ils ne se vanteraient pas parmi les mawali de la sunna du Prophète."
  ur: "فل، زیاد کا مولا اور چیمبرلین، بصرہ کے دوسرے حمام کا مالک؛ ابو الاسود اور انس بن زنیم کے مسکین سواروں کے پاس ان کے حملاج ناگ نے یہ پہیلی پیدا کی کہ 'فل کے غسل کا دو تہائی حصہ - آپ کے والد کی قسم، کسریٰ کا غسل کچھ نہیں ہے' اور ابو الاسود کا یہ جواب کہ وہ رسول اللہ کی سنتوں کے درمیان خوشامد نہیں کریں گے۔"
