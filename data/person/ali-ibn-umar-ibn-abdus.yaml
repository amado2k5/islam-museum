  en: "Ibn Abdus al-Harrani (Ali ibn Umar)"
summary:
  ar: "علي بن عمر بن أحمد بن عبدوس الحراني، أبو الحسن، فقيه حنبلي، سمع ببغداد من ابن ناصر وطبقته، وبرع في الفقه والتفسير والوعظ. قرأ عليه نصر الله بن عبد العزيز، وخاله فخر الدين ابن تيمية، وعمر بن علي القرشي. من تصانيفه تفسير كبير، والمذهب في المذهب، ومجالس وعظية. توفي سنة 559 هـ، وولد سنة 510 هـ على ما يذكر العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15809}"
  en: "Ali ibn Umar ibn Ahmad ibn Abdus al-Harrani, Abu al-Hasan, a Hanbali jurist who heard hadith in Baghdad from Ibn Nasir and his circle and excelled in fiqh, exegesis and preaching. Nasr Allah ibn Abd al-Aziz, his maternal nephew Fakhr al-Din Ibn Taymiyya and Umar ibn Ali al-Qurashi studied with him. His works include a large exegesis, al-Mudhhab fi al-madhhab and sermons. The header gives his death as 559 AH and his birth as 510 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15809}"
