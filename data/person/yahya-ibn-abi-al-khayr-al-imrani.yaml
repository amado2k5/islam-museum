summary:
  ar: "يحيى بن سالم ⁦(أبي الخير)⁩ بن أسعد، أبو الحسين العمراني، فقيه كان شيخ الشافعية في اليمن، صاحب «البيان» في فروع الشافعية و«الانتصار» في الرد على القدرية و«مناقب الإمام الشافعي»، وتوفي بذي سفال باليمن سنة 558 هـ ⁦(1163 م)⁩."
  en: "Yahya ibn Salim (Abi al-Khayr) ibn Asad, Abu al-Husayn al-Imrani, a jurist and head of the Shafi'is in Yemen, author of al-Bayan on Shafi'i substantive law, al-Intisar against the Qadariyya and Manaqib al-Imam al-Shafi'i; died at Dhu Sufal in Yemen in 558 AH (1163 CE)."
