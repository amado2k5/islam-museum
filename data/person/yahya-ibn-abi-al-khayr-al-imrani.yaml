summary:
  ar: "يحيى بن سالم ⁦(أبي الخير)⁩ بن أسعد، أبو الحسين العمراني، فقيه كان شيخ الشافعية في اليمن، صاحب «البيان» في فروع الشافعية و«الانتصار» في الرد على القدرية و«مناقب الإمام الشافعي»، وتوفي بذي سفال باليمن سنة 558 هـ ⁦(1163 م)⁩."
  en: "Yahya ibn Salim (Abi al-Khayr) ibn Asad, Abu al-Husayn al-Imrani, a jurist and head of the Shafi'is in Yemen, author of al-Bayan on Shafi'i substantive law, al-Intisar against the Qadariyya and Manaqib al-Imam al-Shafi'i; died at Dhu Sufal in Yemen in 558 AH (1163 CE)."
  es: "Yahya ibn Salim (Abi al-Khayr) ibn Asad, Abu al-Husayn al-Imrani, jurista y jefe de los Shafi'is en Yemen, autor de al-Bayan sobre el derecho sustantivo Shafi'i, al-Intisar contra los Qadariyya y Manaqib al-Imam al-Shafi'i; Murió en Dhu Sufal en Yemen en 558 AH (1163 CE)."
  fr: "Yahya ibn Salim (Abi al-Khayr) ibn Asad, Abu al-Husayn al-Imrani, juriste et chef des Shafi'is au Yémen, auteur d'al-Bayan sur le droit positif Shafi'i, d'al-Intisar contre les Qadariyya et de Manaqib al-Imam al-Shafi'i; mort à Dhu Sufal au Yémen en 558 AH (1163 CE)."
  ur: "یحییٰ بن سلیم ⁦(ابی الخیر)⁩ ابن اسد، ابو الحسین آل عمرانی، ایک فقیہ اور یمن میں شافعیوں کے سربراہ، شافعی اصولی قانون پر البیان کے مصنف، قادریہ کے خلاف الانتصار اور مناقب الامام الشافعی؛ 558 ہجری ⁦(1163 عیسوی)⁩ میں یمن میں ذو سفل میں وفات پائی۔"
  tr: "Yahya ibn Salim (Ebu al-Khair) ibn As'ad, Ebu el-Hüseyin el-'Umrani, Yemen'deki Şafiilerin şeyhi olan bir hukukçuydu; Şafiilerin kolları üzerine 'Al-Bayan', Kadariye'yi çürüten 'Al-Intisar' ve 'Manaqib al-İmam al-Shafi'i' adlı eserlerin yazarıydı. 558 Hicri yılında (1163 M.S.) Yemen'deki Dhi Safal'da öldü."
  id: "Yahya ibn Salim (Abu al-Khair) ibn As'ad, Abu al-Husayn al-'Umrani, adalah seorang ahli hukum yang menjadi sheikh Syarah di Yaman, penulis 'Al-Bayan' tentang cabang-cabang Syhafi'i, 'Al-Intisar' dalam membantah Qadariyyah, dan 'Manaqib al-Imam al-Shafi'i'. Ia meninggal di Dhi Safal di Yaman pada tahun 558 H (1163 M)."
