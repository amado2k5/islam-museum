summary:
  ar: "كاتب السر بالديار المصرية؛ اشتغل ببلاده ثم ببغداد وقدم دمشق خاملاً ثم مصر فحصل له نوع يسر لقربه من الجيوباني، ولما تولى الجيوباني نيابة الشام قدم معه وولي تدريس الظاهرية ومشيخة الأسدية وتصدير الجامع الأموي، ثم لما سار السلطان إلى حلب ورد عليه من اللنك كتاب بالتركي فلم يجد من يقرؤه فاستدعاه فقرأه وكتب الجواب فأجاد فأمره أن يكون في صحبته إلى أن ولّاه كتابة السر — وكان يحكي أنه أصبح لا يملك درهماً فما أمسى إلا وعنده من الخيل والمال ما لا يوصف — وخلف أموالاً يقال إنها وجدت مدفونة في كراسي المستراح {cite:shadharat-dhahab p. 20-21}."
  en: "Egypt's katib al-sirr — the Turkic-literate secretary who alone could read Timur's letter on the Aleppo march, and rose in a day from penniless to boundless wealth; the tale of money found buried in the latrine chairs after his death {cite:shadharat-dhahab p. 20-21}."
  es: "El katib al-sirr de Egipto, el secretario alfabetizado en turco que fue el único que pudo leer la carta de Timur sobre la marcha de Alepo, y que en un día pasó de la pobreza a una riqueza ilimitada; la historia del dinero encontrado enterrado en las sillas de la letrina después de su muerte {cita: shadharat-dhahab págs. 20-21}."
  fr: "Le katib al-sirr d'Égypte — le secrétaire turcophone qui était le seul à pouvoir lire la lettre de Timour sur la marche d'Alep, et qui passa en un jour de la misère à une richesse sans bornes; l'histoire de l'argent trouvé enterré dans les chaises des latrines après sa mort {cite:shadharat-dhahab p. 20-21}."
  ur: "مصر کا کاتب السیر - ترکی کا پڑھا لکھا سکریٹری جو حلب کے مارچ میں تیمور کا خط اکیلے پڑھ سکتا تھا، اور ایک دن میں بے شمار دولت کی طرف بڑھ گیا۔ رقم کی کہانی ان کی موت کے بعد لیٹرین کی کرسیوں میں دفن پائی گئی 20-21}۔"
  tr: "Mısır'da gizli sekreter; önce kendi ülkesinde çalıştı, sonra Bağdat'ta, sonra Şam'a hareketsiz geldi, ardından Mısır'a geldi ve el-Ciyubani'ye yakınlığı sayesinde bir tür rahatlık kazandı. El-Ciyubani Suriye vali yardımcısı olduğunda ona katıldı ve el-Asadiyye şeyhi el-Zahiriye'yi eğitmeye başladı ve Emevi Camii'ni yönetti. Sonra sultan Halep'e gidip bağlantıdan Türkçe bir mektup aldığında, onu okuyacak kimse bulamadı, onu çağırdı, okudu, cevabını yazdı ve başarılı oldu. Onu gizli sekreter olarak atayana kadar yanında olmasını emretti—dirhemi olmadığını, bu yüzden geceyi tarif edilemez atlar ve servetler olmadan geçirmediğini anlattı—ve dinlenme sandalyelerinde gömülü olduğu söylenen parayı geride bıraktı {atıf: shadharat-dhahab s. 20-21}."
  id: "Sekretaris rahasia di Mesir; ia bekerja di negaranya sendiri, lalu di Baghdad, kemudian ke Damaskus secara diam-diam, lalu Mesir, di mana ia memperoleh ketenangan karena kedekatannya dengan al-Jiyubani. Ketika al-Jiyubani menjadi wakil gubernur Suriah, ia bergabung dengannya dan mengambil tugas mengajar al-Zahiriya, sheikhdom al-Asadiyya, serta memimpin Masjid Umayyah. Kemudian, ketika sultan pergi ke Aleppo dan menerima surat dalam bahasa Turki dari link, ia tidak menemukan siapa pun untuk membacanya, sehingga ia memanggilnya, membacanya, menulis jawabannya, dan ia berprestasi. Ia memerintahkan sultan untuk menemaninya sampai ia diangkat sebagai sekretaris rahasia—ia menceritakan bahwa ia tidak memiliki dirham, jadi ia tidak menginap tanpa kuda dan kekayaan yang tak terlukiskan—dan meninggalkan uang yang dikatakan ditemukan terkubur di kursi istirahat {cite:shadharat-dhahab hlm. 20-21}."
