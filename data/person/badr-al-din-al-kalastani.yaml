summary:
  ar: "كاتب السر بالديار المصرية؛ اشتغل ببلاده ثم ببغداد وقدم دمشق خاملاً ثم مصر فحصل له نوع يسر لقربه من الجيوباني، ولما تولى الجيوباني نيابة الشام قدم معه وولي تدريس الظاهرية ومشيخة الأسدية وتصدير الجامع الأموي، ثم لما سار السلطان إلى حلب ورد عليه من اللنك كتاب بالتركي فلم يجد من يقرؤه فاستدعاه فقرأه وكتب الجواب فأجاد فأمره أن يكون في صحبته إلى أن ولّاه كتابة السر — وكان يحكي أنه أصبح لا يملك درهماً فما أمسى إلا وعنده من الخيل والمال ما لا يوصف — وخلف أموالاً يقال إنها وجدت مدفونة في كراسي المستراح {cite:shadharat-dhahab p. 20-21}."
  en: "Egypt's katib al-sirr — the Turkic-literate secretary who alone could read Timur's letter on the Aleppo march, and rose in a day from penniless to boundless wealth; the tale of money found buried in the latrine chairs after his death {cite:shadharat-dhahab p. 20-21}."
