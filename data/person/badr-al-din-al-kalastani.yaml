summary:
  ar: "كاتب السر بالديار المصرية؛ اشتغل ببلاده ثم ببغداد وقدم دمشق خاملاً ثم مصر فحصل له نوع يسر لقربه من الجيوباني، ولما تولى الجيوباني نيابة الشام قدم معه وولي تدريس الظاهرية ومشيخة الأسدية وتصدير الجامع الأموي، ثم لما سار السلطان إلى حلب ورد عليه من اللنك كتاب بالتركي فلم يجد من يقرؤه فاستدعاه فقرأه وكتب الجواب فأجاد فأمره أن يكون في صحبته إلى أن ولّاه كتابة السر — وكان يحكي أنه أصبح لا يملك درهماً فما أمسى إلا وعنده من الخيل والمال ما لا يوصف — وخلف أموالاً يقال إنها وجدت مدفونة في كراسي المستراح {cite:shadharat-dhahab p. 20-21}."
  en: "Egypt's katib al-sirr — the Turkic-literate secretary who alone could read Timur's letter on the Aleppo march, and rose in a day from penniless to boundless wealth; the tale of money found buried in the latrine chairs after his death {cite:shadharat-dhahab p. 20-21}."
  es: "El katib al-sirr de Egipto, el secretario alfabetizado en turco que fue el único que pudo leer la carta de Timur sobre la marcha de Alepo, y que en un día pasó de la pobreza a una riqueza ilimitada; la historia del dinero encontrado enterrado en las sillas de la letrina después de su muerte {cita: shadharat-dhahab págs. 20-21}."
  fr: "Le katib al-sirr d'Égypte — le secrétaire turcophone qui était le seul à pouvoir lire la lettre de Timour sur la marche d'Alep, et qui passa en un jour de la misère à une richesse sans bornes; l'histoire de l'argent trouvé enterré dans les chaises des latrines après sa mort {cite:shadharat-dhahab p. 20-21}."
  ur: "مصر کا کاتب السیر - ترکی کا پڑھا لکھا سکریٹری جو حلب کے مارچ میں تیمور کا خط اکیلے پڑھ سکتا تھا، اور ایک دن میں بے شمار دولت کی طرف بڑھ گیا۔ رقم کی کہانی ان کی موت کے بعد لیٹرین کی کرسیوں میں دفن پائی گئی 20-21}۔"
