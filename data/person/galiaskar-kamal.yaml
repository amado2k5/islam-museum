summary:
  ar: "كاتب مسرحي تتاري (1879–1933)، يُعد مؤسس الدراما التترية الحديثة وأبا المسرح التتري. وُلد في قازان في أسرة حرفي فرّاء، وتشكّل في مدرستي غوسمانيا ومحمدية، وكتب أولى مسرحياته سنة 1900 وعمل في فرقة سيار ممثلا ومؤلفا، ونال لقب بطل العمل سنة 1923، ويحمل المسرح الأكاديمي التتري في قازان اسمه اليوم."
  en: "Tatar playwright (1879–1933), regarded as the founder of modern Tatar drama and the father of the Tatar theatre. Born at Kazan into a furrier craftsman's family and formed at the Ğosmaniyä and Möxämmädiyä madrasas, he wrote his first play in 1900, worked in the Säyyär troupe as actor and playwright, received the Hero of Labour title in 1923, and is commemorated today in the name of the Tatar Academic Theatre at Kazan."
  ur: "تاتاری ڈراما نگار (1879–1933)، جنہیں جدید تاتاری ڈرامے کا بانی اور تاتاری تھیٹر کا باپ سمجھا جاتا ہے۔ قازان میں فرّار (سمور فروش) کے گھرانے میں پیدا ہوئے، غثمانیہ اور محمدیہ مدارس میں تربیت پائی، 1900 میں پہلا ڈراما لکھا، سیار ٹولپ میں اداکار اور مصنف رہے، 1923 میں «بطلِ محنت» کا لقب پایا، اور آج قازان کا تاتاری اکیڈمک تھیٹر ان کے نام پر ہے۔"
