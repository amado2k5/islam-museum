summary:
  ar: "عالم ومفسّر هندي (1863–1930) من فريها في قضاء أعظم كره، صاحب نظرية «النظم» أو التماسك في القرآن ومؤسس ما عُرف بالمدرسة الفراهية. تعلّم العربية على ابن خاله شبلي النعماني، ودرّس في كراتشي وكلية عليكره وحيدر آباد، وأدار مدرسة الإصلاح في سراي مير منذ 1925 حيث تخرّج عليه أمين أحسن الإصلاحي، وترك تفسيره «نظام القرآن» غير مكتمل عند وفاته في مثورا."
  en: "Indian scholar and exegete (1863–1930) of Phariha in Azamgarh district, originator of the theory of nazm, or coherence, in the Qur'an and founder of what became known as the Farahi school. He learned Arabic from his cousin Shibli Nomani, taught at Karachi, the MAO College at Aligarh and Hyderabad, and from 1925 ran Madrasatul Islah at Sara-e-Mir, where Amin Ahsan Islahi trained under him; his commentary Nizam al-Qur'an was left unfinished at his death at Mathura."
  ur: "بھارتی عالم و مفسر (1863ء–1930ء) جن کا تعلق ضلع اعظم گڑھ کے پھریہا سے تھا، قرآن میں «نظم» یعنی ربط و تناسق کے نظریے کے بانی اور فراہی مکتبِ فکر کے مؤسس۔ اپنے پھوپھی زاد بھائی شبلی نعمانی سے عربی پڑھی، کراچی، علی گڑھ کالج اور حیدر آباد میں تدریس کی، اور 1925ء سے سرائے میر میں مدرسۃ الاصلاح کے منتظم رہے جہاں امین احسن اصلاحی نے ان سے تربیت پائی؛ ان کی تفسیر «نظام القرآن» متھرا میں وفات کے وقت نامکمل رہ گئی۔"
