  source: "English Wikipedia 'Hamid al-Din Farahi' (revision 1363263698; the title 'Hamiduddin Farahi' is a redirect to it), Urdu Wikipedia 'حمید الدین فراہی' (revision 12091265) and Arabic Wikipedia 'عبد الحميد الفراهي' (revision 66588688), each fetched by its recorded revision id with the returned id asserted equal before use, and Wikidata item Q5644718 (item revision 2544401439). The three articles are independently written; the Arabic rests on Ajmal Ayyub Islahi's edition of Mufradat al-Qur'an, the Urdu on Yadraftagan and al-Diya. Existence checks by name fragments (farahi, فراہی, الفراهي), by Arabic label across data/person, by biography and by QID found no prior record for this man; the existing Farahi-named records are other people (al-Khalil ibn Ahmad al-Farahidi among them). His birth name was Abd al-Hamid, given by his father; Hamiduddin was a laqab that became his common name, as the Arabic article's note and the Urdu article's naming section state, and he signed his Arabic books 'al-Mu'allim Abd al-Hamid al-Farahi'. The student_of edge follows all three texts: Farahi learned Arabic and read most of the Dars-e-Nizami books under his cousin Shibli Nomani from the age of fourteen. No outward teacher edge is written here for his students: the Arabic article lists Sulaiman Nadvi, Abdul Majid Daryabadi and Amin Ahsan Islahi among them, and the Islahi edge is written once in Islahi's own record in this run. The Farahi school of Qur'anic thought has no group entity, so no member_of or founder edge is written. Phariha and Mathura have no place entities. The lane queue gives 1863–1930, which the articles confirm."
