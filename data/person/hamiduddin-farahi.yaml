    note: "His school is not recorded. The only school naming anywhere is structured: the English infobox carries a Sunni denomination field, the Urdu and Arabic articles file him under Indian Sunni scholars, and Wikidata's single religion value is Islam — infobox fields, category filings and structured values never count as text attestations. The texts that discuss his position at all point the other way on the madhhab question: Taqi al-Din al-Hilali, who met him, is quoted in both the Urdu article (from the journal al-Diya) and the Arabic article (from Ajmal Ayyub Islahi's edition) saying that he was a mujtahid in creed and practice who did not belong to, and disliked attribution to, any fiqh school, but worshipped according to the Hanafi school because he was raised in it — one witness in two transmissions, and in any case an attestation of non-affiliation and of upbringing and practice, which never count. The Urdu article's description of him as 'mujtahid fi al-madhhab' is a single text's rank description set against al-Hilali's statement in the same article. His distinct Qur'anic method — the nazm theory and the Farahi school named after him — is scholarship, not a madhhab attestation. On the evidence the Sunni reading rests on the infobox alone and the Hanafi reading is affirmatively answered against affiliation; both are preserved here."
