summary:
  ar: "أخو الشريف المرتضى نقيب الطالبيين وشاعر البيت؛ ينسب إليه جمع نهج البلاغة من كلام علي بن أبي طالب وقد قيل إنه ليس من كلام علي وأنما الذي جمعه ونسبه إليه هو الذي وضعه والله أعلم، كذا أورد ابن خلكان وابن العماد الاختلاف فيه {cite:shadharat-dhahab p. 264-265}. نقيب العلويين والشاعر المفلق الذي يقال إنه أشعر قريش، ولد سنة تسع وخمسين وثلاث مئة وابتدأ بنظم الشعر وله عشر سنين وكان مفرط الذكاء له ديوان في أربع مجلدات، وحكى أنه حضر مجلس أبي سعيد السيرافي فسأله ما علامة النصب في عمرو فقال بغض علي فعجبوا من حدة ذهنه، وكان أبوه يتولى قديماً نقابة الطالبيين والحكم فيهم أجمعين والنظر في المظالم والحج بالناس ثم ردت هذه الأعمال كلها إلى ولده المذكور سنة ثلاث وثمانين وثلاث مئة وأبوه حي، قال الثعالبي في اليتيمة هو اليوم أبدع أبناء الزمان وأنجب سادات العراق يتحلى مع محتده الشريف ومفخره المنيف بأدب ظاهر وفضل باهر ثم هو أشعر الطالبيين من مضى منهم ومن غبر على كثرة شعرائهم المفلقين ولو قلت إنه أشعر قريش لم أبعد عن الصدق، ومن شعره كتابه إلى الإمام القادر بالله من جملة قصيدة عطفاً أمير المؤمنين فإننا في دوحة العلياء لا نتفرق إلا الخلافة بيننا فترى أني عاطل عنها وأنت مطوق {cite:shadharat-dhahab p. 190-191}. وفي سنة سبع وتسعين أظهر ورود كتاب من حضرة بهاء الدولة بتقليد أبي الحسن محمد بن الحسين بن موسى النقابة والحج وتلقيبه بالرضي ذي الحسبين {cite:muntazam-ibn-al-jawzi j.7 p.235}. وفي سنة ثلاث وأربعمائة قُلّد نقابة نقباء الطالبيين في سائر الممالك وخُلعت عليه الخلعة السوداء فكان أول طالبي خُلع عليه السواد، وشهد وكتب خطه في المحضر البغدادي في الطعن في نسب الفاطميين سنة اثنتين وأربعمائة، وتوفي في المحرم سنة ست وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.255,260,276}."
  en: "Al-Sharif al-Murtada's brother, the poet and Talibid naqib, conventionally the compiler of the Nahj al-balagha — though Ibn al-Imad relays the Sunni doubt that the book's compiler himself composed it {cite:shadharat-dhahab p. 264-265}."
  fr: "Le frère d’Al-Sharif al-Murtada, le poète et Talibid naqib, compilateur du Nahj al-balagha – bien qu’Ibn al-Imad transmette le doute sunnite que le compilateur du livre lui-même l’a composé {cite:shadharat-dhahab p. 264-265}."
  es: "El hermano de Al-Sharif al-Murtada, el poeta y naqib talibidí, convencionalmente considerado el compilador del Nahj al-balagha, aunque Ibn al-Imad transmite la duda sunita de que el compilador del libro lo compusiera él mismo {cite:shadharat-dhahab p. 264-265}."
  ur: "الشریف المرتضیٰ کے بھائی، شاعر اور طالب نقیب، روایتی طور پر نہج البلاغہ کے مرتب کرنے والے ہیں - حالانکہ ابن العماد سنیوں کے شک کو بیان کرتے ہیں کہ کتاب کے مرتب کرنے والے نے خود اسے مرتب کیا ہے۔ 264-265}۔"
  tr: "Talibiyyin lideri ve evin şairi El-Şerif el-Murtada'nın kardeşi olan Nahj al-Balagha'nın derlemesi Ali bin Abi Talib'in sözlerinden ona atfedilir. Söylendiği gibi, bu sözler Ali'nin sözlerinden değil, onu derleyip ona atfeden gelmiştir ve Allah en iyisini bilir. Benzer şekilde, İbn Hallikan ve İbn al-İmad bu konudaki anlaşmazlığı bildirmiştir {atıf:shadharat-dhahab, s. 264-265}. Alevilerin lideri ve en şiirci olduğu söylenen şair El-Muflaq, 359 Hicri yılında doğmuş, on yaşında şiir yazmaya başlamış ve son derece zekiydi. Dört ciltlik bir koleksiyonu vardı. Ebu Seyid el-Sirafi'nin toplantısına katıldığını ve Amr'daki suçlama işaretinin ne olduğunu sorduğunu anlattı. Ebu Seyid el-Sirafi'nin toplantısına katıldığını ve Amr'daki suçlama işaretinin ne olduğunu sorduğunu anlattı. Babası, 'Ali'den nefret etti,' diye cevap verdi ve keskin zekasına hayran kaldılar. Babası Talibiyin örgütüne liderlik eder, hepsini yönetir, dertleri denetler ve halka hac ziyaretleri yapardı. Tüm bu görevler 83 Hicri yılında bahsedilen oğluna geri verildi. Yüz yaşında ve babası hayatta. El-Talibi, 'Al-Yatima'da bugün dönemin en yaratıcısı ve Irak Seyyidlerinin oğlu olduğunu söylemiştir. Asil ve seçkin gururuyla birlikte açık bir nezaket ve olağanüstü erdemle öne çıkar. Aynı zamanda Talibilerin en şiirsel olanıdır; aralarında kopuk birçok şair olmuştur. Eğer onun en şiirsel Kureyş'i olduğunu söylesem, gerçeğe çok uzak olmazdım. Şiirleri arasında, 'İnananların Komutanı ile birlikte' şiirinden 'İmam el-Kadir Billah' adlı kitabı da vardır. En yüksek Doha'da aramızda sadece halifelik farklıdır, bu yüzden siz çevrelenirken ben işsiz kaldığımı görürsünüz {atıf:shadharat-dhahab, s. 190-191}. Doksan yedinci yılda, Baha' al-Dawla'dan bir mektup çıktı; bu mektup, Ebu el-Hasan Muhammed bin el-Hüseyin ibn Musa'yı sendikat ve hac ile suçladı ve onun 'el-Ridhi Dhi al-Hasbin' unvanını taşıdı {atıf:muntazam-ibn-al-jawzi j.7 s.235}. Dört yüz on dört yılında, tüm krallıklarda Talibiyyin'in başı olarak atandı ve siyah cübbe verildi; böylece siyah pelerini çıkaran ilk öğrenci oldu. Dört yüz iki yüz yılda Fatımi soyuna meydan okuyan Bağdat kayıtlarına el yazısını yazdı ve dört yüz altıncı yılda Muharrem'de öldü {cite:Muntazam-ibn-al-Jawzi j.7 s.255,260,276}."
  id: "Saudara Al-Sharif Al-Murtada, pemimpin Talibiyyin dan penyair rumah tersebut, penyusunan Nahj al-Balagha dari kata-kata Ali ibn Abi Talib dikaitkan dengannya. Dikatakan bahwa itu bukan dari kata-kata Ali melainkan dari orang yang menyusun dan mengaitkannya kepadanya, dan Allah yang paling tahu. Demikian pula, Ibn Khallikan dan Ibn al-Imad melaporkan perselisihan tentang hal itu {cite:shadharat-dhahab, hlm. 264-265}. Pemimpin Alawit dan penyair Al-Muflaq, yang dikatakan paling puitis dari Quraysh, lahir pada tahun 359 H dan mulai menulis puisi pada usia sepuluh tahun serta sangat cerdas. Ia memiliki koleksi dalam empat jilid. Ia menceritakan bahwa ia menghadiri pertemuan Abu Sa'id al-Sirafi dan bertanya apa tanda tuduhan dalam Amr. Ia menjawab, 'Ia membenci Ali,' dan mereka terpesona oleh kecerdasannya. Ayahnya memimpin sindikat Talibiyyin, memerintah semuanya, mengawasi keluhan, dan memimpin ziarah kepada rakyat. Semua tugas ini dialihkan kepada putranya pada tahun 83 H. Seratus tahun dan ayahnya masih hidup. Al-Thaalibi mengatakan dalam 'Al-Yatima' bahwa hari ini dia adalah yang paling kreatif di era itu dan putra Sayyid Irak. Dia menonjol bersama kebanggaan mulia dan terhormat dengan kesopanan yang jelas dan kebajikan luar biasa. Dia juga yang paling puitis di antara Talibis, di antara mereka banyak penyair yang terpecah-pecah. Jika saya mengatakan dia adalah yang paling puitis dari Quraisy, saya tidak akan jauh dari kebenaran. Di antara puisinya adalah bukunya 'Untuk Imam al-Qadir Billah' dari puisi 'Bersama dengan Panglima Orang Beriman.' Di doha tertinggi, kita hanya berbeda dalam kekhalifahan di antara kita, jadi Anda melihat bahwa saya menganggur di sana sementara Anda dikelilingi {cite:shadharat-dhahab, hlm. 190-191}. Pada tahun sembilan puluh tujuh, sebuah surat dari Baha' al-Dawla muncul menuduh Abu al-Hasan Muhammad ibn al-Husayn ibn Musa atas sindikat dan ziarah, serta gelarnya sebagai 'al-Ridhi Dhi al-Hasbin' {cite:muntazam-ibn-al-jawzi j.7 hlm.235}. Pada tahun empat ratus empat belas, ia diangkat sebagai kepala Talibiyyin di semua kerajaan dan diberikan jubah hitam, menjadi murid pertama yang melepas jubah hitam darinya. Ia menyaksikan dan menulis tulisan tangannya dalam catatan Baghdad yang menantang garis keturunan Fatimiyah pada tahun empat ratus dua ratus, dan meninggal pada Muharram pada tahun empat ratus enam {cite:muntazam-ibn-al-jawzi j.7 hlm.255,260,276}."
