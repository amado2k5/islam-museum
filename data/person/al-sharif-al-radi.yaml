id: person/al-sharif-al-radi
class: person
label: { ar: "الشريف الرضي" }
summary:
  ar: "العلوي الشاعر، أنشد بين يدي القادر يوم بيعته شرف الخلافة يا بني العباس اليوم جدده أبو العباس هذا الطود بقاه الزمان ذخيرة من ذلك الجبل العظيم الراسي، ورثى الطائع بقصيدة لما مات ليلة عيد الفطر سنة ثلاث وتسعين {cite:tarikh-khulafa-minhaj-1434 p. 632,634}.، وعند ابن الأثير أنه قال أبياتاً في إثبات نسب المهدي المصري منها مقول صارم وأنف حسام، فلما بلغت القادر بالله أحضر القاضي ابن الباقلاني فأرسله إلى أبيه أبي أحمد الموسوي يطلب إنكارها، فحلف الأب أنه ما علم بها وأحضر ولده فأنكر الشعر، ولما أُمر بكتابة الاعتذار أبى وقال أخاف من الديلم وأخاف من المصري من الدعاء في البلاد فقال أبوه أتخاف ممن هو بعيد عنك وتستخي ممن هو قريب وقادر عليك وعلى أهل بيتك {cite:kamil-ibn-al-athir p. 19-20}"
  en: "The Alid poet; he recited at al-Qadir's accession — 'the caliphate's glory, sons of Abbas, Abu'l-Abbas has renewed today' — and elegised al-Ta'i' on his death in 393 {cite:tarikh-khulafa-minhaj-1434 p. 632,634}."
