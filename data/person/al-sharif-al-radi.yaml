summary:
  ar: "أخو الشريف المرتضى نقيب الطالبيين وشاعر البيت؛ ينسب إليه جمع نهج البلاغة من كلام علي بن أبي طالب وقد قيل إنه ليس من كلام علي وأنما الذي جمعه ونسبه إليه هو الذي وضعه والله أعلم، كذا أورد ابن خلكان وابن العماد الاختلاف فيه {cite:shadharat-dhahab p. 264-265}. نقيب العلويين والشاعر المفلق الذي يقال إنه أشعر قريش، ولد سنة تسع وخمسين وثلاث مئة وابتدأ بنظم الشعر وله عشر سنين وكان مفرط الذكاء له ديوان في أربع مجلدات، وحكى أنه حضر مجلس أبي سعيد السيرافي فسأله ما علامة النصب في عمرو فقال بغض علي فعجبوا من حدة ذهنه، وكان أبوه يتولى قديماً نقابة الطالبيين والحكم فيهم أجمعين والنظر في المظالم والحج بالناس ثم ردت هذه الأعمال كلها إلى ولده المذكور سنة ثلاث وثمانين وثلاث مئة وأبوه حي، قال الثعالبي في اليتيمة هو اليوم أبدع أبناء الزمان وأنجب سادات العراق يتحلى مع محتده الشريف ومفخره المنيف بأدب ظاهر وفضل باهر ثم هو أشعر الطالبيين من مضى منهم ومن غبر على كثرة شعرائهم المفلقين ولو قلت إنه أشعر قريش لم أبعد عن الصدق، ومن شعره كتابه إلى الإمام القادر بالله من جملة قصيدة عطفاً أمير المؤمنين فإننا في دوحة العلياء لا نتفرق إلا الخلافة بيننا فترى أني عاطل عنها وأنت مطوق {cite:shadharat-dhahab p. 190-191}."
  en: "Al-Sharif al-Murtada's brother, the poet and Talibid naqib, conventionally the compiler of the Nahj al-balagha — though Ibn al-Imad relays the Sunni doubt that the book's compiler himself composed it {cite:shadharat-dhahab p. 264-265}."
