summary:
  ar: "الوليد بن زيدان بن أحمد السعدي، من ملوك دولة الأشراف السعديين بمراكش، بويع بها سنة 1040 هـ الموافقة 1631 م، وقتله بعض الأتراك من جنده في قصره بمراكش سنة 1045 هـ الموافقة 1636 م."
  en: "Al-Walid ibn Zidan ibn Ahmad al-Sa'di, one of the kings of the Sa'di Sharifian state at Marrakesh, who was pledged allegiance there in 1040 AH (1631 CE) and was killed in his palace in Marrakesh by some Turks of his soldiery in 1045 AH (1636 CE)."
  fr: "Al-Walid ibn Zidan ibn Ahmad al-Sa'di, l'un des rois de l'État sa'di Sharifian à Marrakech, qui y a prêté allégeance en 1040 après l'Hégire (1631 après JC) et a été tué dans son palais à Marrakech par certains Turcs de sa soldate en 1045 après l'Hégire (1636 après JC)."
  es: "Al-Walid ibn Zidan ibn Ahmad al-Sa'di, uno de los reyes del estado sharifa sadí de Marrakech, que juró lealtad allí en 1040 AH (1631 d. C.) y fue asesinado en su palacio de Marrakech por algunos turcos de su ejército en 1045 AH (1636 d. C.)."
