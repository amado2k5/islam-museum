summary:
  ar: "علي بن عبد العزيز بن محمد الدولابي من المتفقهين على مذهب الطبري، وله كتاب الرد على ابن المغلس وكتاب في بسم الله الرحمن الرحيم وكتاب القراءات وكتاب أصول الكلام وكتاب أفعال النبي وكتاب التبصير ورسالته إلى نصر القشوري ورسالته إلى علي بن عيسى وكتاب المسئلة في اقتراض الإماء وكتاب الأصول الأكبر والأصغر والأوسط وكتاب عبارة الرؤيا وكتاب إثبات الرسالة {cite:fihrist-ibn-al-nadim p. 327-328}."
  en: "Al-Dawlabi — jurisconsult of the Tabari school {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Dawlabi — jurisconsulte de l’école d’al-Tabari {cite:fihrist-ibn-al-nadim}"
  es: "Al-Dawlabi - jurisconsulto de la escuela Tabari {cita:fihrist-ibn-al-nadim}"
  ur: "الدولابی - طبری مکتب کے فقہی مشیر {حوالہ: فہرست ابن الندیم"
  tr: "Ali ibn Abdülaziz ibn Muhammed el-Dulabî, Taberi ekolünden bir hukukçu idi. İbn el-Muğalî'nin ret kitabı, Rahman ve Rahim olan Allah'ın adı üzerine bir kitap, okumalar üzerine bir kitap, konuşma esasları üzerine bir kitap, Peygamberin fiilleri üzerine bir kitap, basiret üzerine bir kitap, Nasr el-Kuşuri'ye yazdığı mektup, Ali ibn İsa'ya yazdığı mektup, cariye ödünç alma meselesi üzerine bir kitap, büyük, küçük ve orta prensipler üzerine bir kitap, rüyaların yorumlanması üzerine bir kitap ve mesajın ispatı üzerine bir kitap kaleme almıştır. {Kaynak: Fihrist ibn el-Nadim, s. 327-328}"
  id: "Ali ibn Abd al-Aziz ibn Muhammad al-Dulabi adalah seorang ahli hukum dari mazhab al-Tabari. Ia memiliki sebuah buku bantahan terhadap Ibn al-Mughallis, sebuah buku tentang nama Allah Yang Maha Pengasih, sebuah buku tentang bacaan, sebuah buku tentang prinsip-prinsip ucapan, sebuah buku tentang perbuatan Nabi, sebuah buku tentang wawasan, suratnya kepada Nasr al-Qushuri, suratnya kepada Ali ibn Isa, sebuah buku tentang masalah meminjam budak perempuan, sebuah buku tentang prinsip-prinsip besar, kecil, dan menengah, sebuah buku tentang penafsiran mimpi, dan sebuah buku tentang pembuktian risalah {cite:fihrist-ibn-al-nadim p. 327-328}."
