summary:
  ar: "أبو الحسن ابن المرزبان البغدادي، صاحب أبي الحسين ابن القطان. مات سنة ست وستين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 61}، وكان فقيهاً ورعاً، حُكي عنه أنه قال: «ما أعلم أن لأحد عليّ مظلمة»، وكان فقيهاً يعلم أن الغيبة من المظالم {cite:tabaqat-fuqaha-abbas-1981 p. 61}. ودرّس ببغداد، وعليه درس الشيخ أبو حامد الإسفراييني {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
