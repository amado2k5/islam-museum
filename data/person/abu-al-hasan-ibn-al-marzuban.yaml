summary:
  ar: "أبو الحسن ابن المرزبان البغدادي، صاحب أبي الحسين ابن القطان. مات سنة ست وستين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 61}، وكان فقيهاً ورعاً، حُكي عنه أنه قال: «ما أعلم أن لأحد عليّ مظلمة»، وكان فقيهاً يعلم أن الغيبة من المظالم {cite:tabaqat-fuqaha-abbas-1981 p. 61}. ودرّس ببغداد، وعليه درس الشيخ أبو حامد الإسفراييني {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  en: "Abu al-Hasan ibn al-Marzuban al-Baghdadi, a companion of Abu al-Husayn ibn al-Qattan. He died in 366 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. He was a jurist of notable piety (wara'), and it is related that he said: 'I am not aware of anyone who has a grievance against me.' He was a jurist who knew that backbiting is among wrongs {cite:tabaqat-fuqaha-abbas-1981 p. 61}. He taught in Baghdad, and Shaykh Abu Hamid al-Isfara'ini studied under him {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  fr: "Abu al-Hasan ibn al-Marzuban al-Baghdadi, compagnon d'Abu al-Husayn ibn al-Qattan. Il mourut en 366 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. C'était un juriste d'une piété scrupuleuse (wara') remarquable, et l'on rapporte qu'il dit : « Je ne connais personne qui ait un grief contre moi. » C'était un juriste qui savait que la médisance compte parmi les torts {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Il enseigna à Bagdad, et le shaykh Abu Hamid al-Isfara'ini étudia auprès de lui {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  es: "Abu al-Hasan ibn al-Marzuban al-Baghdadi, compañero de Abu al-Husayn ibn al-Qattan. Murió en 366 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Fue un jurista de notable piedad (wara'), y se cuenta que dijo: «No conozco a nadie que tenga queja alguna contra mí». Era un jurista que sabía que la calumnia es una falta grave {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Enseñó en Bagdad, y el jeque Abu Hamid al-Isfara'ini estudió con él {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  ur: "ابو الحسن بن المرزوبان البغدادی، ابو الحسین بن القطان کے ساتھی۔ آپ کی وفات 366ھ میں ہوئی۔ 61}۔ وہ قابل ذکر تقویٰ کے فقیہ تھے، اور روایت ہے کہ انہوں نے کہا: 'میں کسی ایسے شخص سے واقف نہیں ہوں جسے مجھ سے کوئی شکایت ہو۔' وہ ایک فقیہ تھے جو جانتے تھے کہ غیبت گناہوں میں سے ہے۔ 61}۔ آپ نے بغداد میں درس دیا اور شیخ ابو حامد الاصفرینی نے ان سے تعلیم حاصل کی۔ 61}۔"
  tr: "Ebu el-Hüseyn ibn el-Kattan'ın sahabesi Ebu el-Hasan ibn el-Merzuban el-Bağdadi, Hicri 366 yılında (Miladi 976) vefat etmiştir. Dindar bir hukukçu olan Bağdadi'nin, \"Bana haksızlık eden kimseyi tanımıyorum\" dediği rivayet edilir. Gıybetin bir haksızlık biçimi olduğunu bilen bir hukukçuydu. Bağdat'ta ders vermiş ve Şeyh Ebu Hamid el-İsfarayini onun öğrencisi olmuştur."
  id: "Abu al-Hasan ibn al-Marzuban al-Baghdadi, sahabat Abu al-Husayn ibn al-Qattan, wafat pada tahun 366 H (976 M). Beliau adalah seorang ahli hukum yang saleh, dan diriwayatkan bahwa beliau berkata, \"Aku tidak mengenal siapa pun yang telah berbuat zalim kepadaku.\" Beliau adalah seorang ahli hukum yang mengetahui bahwa meng诽谤 adalah suatu bentuk ketidakadilan. Beliau mengajar di Baghdad, dan Syekh Abu Hamid al-Isfarayini belajar di bawah bimbingannya."
