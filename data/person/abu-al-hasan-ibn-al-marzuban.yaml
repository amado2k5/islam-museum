summary:
  ar: "أبو الحسن ابن المرزبان البغدادي، صاحب أبي الحسين ابن القطان. مات سنة ست وستين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 61}، وكان فقيهاً ورعاً، حُكي عنه أنه قال: «ما أعلم أن لأحد عليّ مظلمة»، وكان فقيهاً يعلم أن الغيبة من المظالم {cite:tabaqat-fuqaha-abbas-1981 p. 61}. ودرّس ببغداد، وعليه درس الشيخ أبو حامد الإسفراييني {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  en: "Abu al-Hasan ibn al-Marzuban al-Baghdadi, a companion of Abu al-Husayn ibn al-Qattan. He died in 366 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. He was a jurist of notable piety (wara'), and it is related that he said: 'I am not aware of anyone who has a grievance against me.' He was a jurist who knew that backbiting is among wrongs {cite:tabaqat-fuqaha-abbas-1981 p. 61}. He taught in Baghdad, and Shaykh Abu Hamid al-Isfara'ini studied under him {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
