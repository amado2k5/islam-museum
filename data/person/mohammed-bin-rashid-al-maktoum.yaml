summary:
  ar: "حاكم دبي ونائب رئيس دولة الإمارات العربية المتحدة ورئيس مجلس وزرائها منذ 2006، ثالث أبناء راشد بن سعيد آل مكتوم. وُلد في دبي سنة 1949، وتدرب في كلية مونز العسكرية البريطانية، وعيّنه والده رئيسًا لشرطة دبي في العشرين من عمره، ثم صار أول وزير للدفاع في الاتحاد سنة 1971 وولي عهد دبي سنة 1995، وخلف أخاه مكتوم في 4 يناير 2006. في عهده صارت دبي مدينة عالمية: طيران الإمارات ودي بي ورلد ومجموعة جميرا، وجزر النخلة وبرج العرب وبرج خليفة أطول مبنى في العالم. وهو فارس معروف ومؤسس إسطبلات غودولفين العالمية لسباقات الخيل."
  en: "Ruler of Dubai and Vice President and Prime Minister of the United Arab Emirates since 2006, the third son of Rashid bin Saeed Al Maktoum. Born at Dubai in 1949, he trained at the Mons Officer Cadet School in Britain; his father appointed him head of the Dubai Police at twenty, he became the federation's first minister of defence in 1971 and crown prince of Dubai in 1995, and he succeeded his brother Maktoum on 4 January 2006. Under him Dubai became a global city: Emirates airline, DP World and the Jumeirah Group, the Palm Islands, the Burj Al Arab and the Burj Khalifa, the world's tallest building. He is an accomplished equestrian and the founder of the Godolphin thoroughbred racing stable."
  ur: "دبئی کے حکمران اور 2006ء سے متحدہ عرب امارات کے نائب صدر اور وزیرِ اعظم، راشد بن سعید آل مکتوم کے تیسرے صاحبزادے۔ 1949ء میں دبئی میں پیدا ہوئے، برطانیہ کی مونز آفیسر کیڈٹ اسکول میں تربیت حاصل کی؛ والد نے بیس برس کی عمر میں انہیں دبئی پولیس کا سربراہ مقرر کیا، 1971ء میں وہ وفاق کے پہلے وزیرِ دفاع بنے اور 1995ء میں دبئی کے ولی عہد، اور 4 جنوری 2006ء کو اپنے بھائی مکتوم کے جانشین بنے۔ ان کے دور میں دبئی عالمی شہر بنی: امارات ایئرلائن، ڈی پی ورلڈ اور جمیرہ گروپ، پام جزائر، برج العرب اور دنیا کی بلند ترین عمارت برج خلیفہ۔ وہ ماہر گھڑ سوار اور گھوڑ دوڑ کے عالمی اصطبل گوڈولفن کے بانی ہیں۔"
