summary:
  ar: "حاكم دبي ونائب رئيس دولة الإمارات العربية المتحدة ورئيس مجلس وزرائها منذ 2006، ثالث أبناء راشد بن سعيد آل مكتوم. وُلد في دبي سنة 1949، وتدرب في كلية مونز العسكرية البريطانية، وعيّنه والده رئيسًا لشرطة دبي في العشرين من عمره، ثم صار أول وزير للدفاع في الاتحاد سنة 1971 وولي عهد دبي سنة 1995، وخلف أخاه مكتوم في 4 يناير 2006. في عهده صارت دبي مدينة عالمية: طيران الإمارات ودي بي ورلد ومجموعة جميرا، وجزر النخلة وبرج العرب وبرج خليفة أطول مبنى في العالم. وهو فارس معروف ومؤسس إسطبلات غودولفين العالمية لسباقات الخيل."
  en: "Ruler of Dubai and Vice President and Prime Minister of the United Arab Emirates since 2006, the third son of Rashid bin Saeed Al Maktoum. Born at Dubai in 1949, he trained at the Mons Officer Cadet School in Britain; his father appointed him head of the Dubai Police at twenty, he became the federation's first minister of defence in 1971 and crown prince of Dubai in 1995, and he succeeded his brother Maktoum on 4 January 2006. Under him Dubai became a global city: Emirates airline, DP World and the Jumeirah Group, the Palm Islands, the Burj Al Arab and the Burj Khalifa, the world's tallest building. He is an accomplished equestrian and the founder of the Godolphin thoroughbred racing stable."
  ur: "دبئی کے حکمران اور 2006ء سے متحدہ عرب امارات کے نائب صدر اور وزیرِ اعظم، راشد بن سعید آل مکتوم کے تیسرے صاحبزادے۔ 1949ء میں دبئی میں پیدا ہوئے، برطانیہ کی مونز آفیسر کیڈٹ اسکول میں تربیت حاصل کی؛ والد نے بیس برس کی عمر میں انہیں دبئی پولیس کا سربراہ مقرر کیا، 1971ء میں وہ وفاق کے پہلے وزیرِ دفاع بنے اور 1995ء میں دبئی کے ولی عہد، اور 4 جنوری 2006ء کو اپنے بھائی مکتوم کے جانشین بنے۔ ان کے دور میں دبئی عالمی شہر بنی: امارات ایئرلائن، ڈی پی ورلڈ اور جمیرہ گروپ، پام جزائر، برج العرب اور دنیا کی بلند ترین عمارت برج خلیفہ۔ وہ ماہر گھڑ سوار اور گھوڑ دوڑ کے عالمی اصطبل گوڈولفن کے بانی ہیں۔"
  es: "Gobernante de Dubái y Vicepresidente y Primer Ministro de los Emiratos Árabes Unidos desde 2006, tercer hijo de Rashid bin Saeed Al Maktoum. Nacido en Dubái en 1949, se formó en la Escuela de Cadetes de Oficiales de Mons en Gran Bretaña; su padre lo nombró jefe de la Policía de Dubái a los veinte años, se convirtió en el primer ministro de Defensa de la federación en 1971 y en príncipe heredero de Dubái en 1995, y sucedió a su hermano Maktoum el 4 de enero de 2006. Bajo su mandato, Dubái se convirtió en una ciudad global: la aerolínea Emirates, DP World y el Grupo Jumeirah, las Islas Palm, el Burj Al Arab y el Burj Khalifa, el edificio más alto del mundo. Es un consumado jinete y fundador de la cuadra de caballos de carreras pura sangre Godolphin."
  fr: "Émir de Dubaï et vice-président et Premier ministre des Émirats arabes unis depuis 2006, il est le troisième fils de Rachid ben Saïd Al Maktoum. Né à Dubaï en 1949, il a suivi une formation à l'école d'officiers de Mons, en Grande-Bretagne. Nommé à vingt ans à la tête de la police de Dubaï par son père, il est devenu le premier ministre de la Défense de la fédération en 1971, puis prince héritier de Dubaï en 1995. Il a succédé à son frère Maktoum le 4 janvier 2006. Sous son mandat, Dubaï est devenue une métropole mondiale: la compagnie aérienne Emirates, DP World et le groupe Jumeirah, les îles Palm, le Burj Al Arab et le Burj Khalifa, le plus haut gratte-ciel du monde. Cavalier émérite, il est le fondateur de l'écurie de courses de pur-sang Godolphin."
  tr: "Dubai hükümdarı, Birleşik Arap Emirlikleri Başkan Yardımcısı ve 2006'dan beri Başbakan, Rashid bin Saeed Al Maktoum'un üçüncü oğlu. 1949'da Dubai'de doğdu, British Mons Askeri Koleji'nde eğitim aldı ve yirmi yaşında babası tarafından Dubai Polis Şefi olarak atandı. Daha sonra 1971'de Birlik'in ilk Savunma Bakanı ve 1995'te Dubai Veliaht Prensi oldu; 4 Ocak 2006'da kardeşi Maktoum'un yerine geçti. Saltanatı sırasında Dubai küresel bir şehir haline geldi: Emirates Airlines, DP World, Jumeirah Group, The Palm Islands, Burj Al Arab ve dünyanın en yüksek binası Burj Khalifa. Tanınmış bir jokey ve küresel Godolphin Yarış Ahırı'nın kurucusudur."
  id: "Penguasa Dubai, Wakil Presiden Uni Emirat Arab, dan Perdana Menteri sejak 2006, putra ketiga Rashid bin Saeed Al Maktoum. Ia lahir di Dubai pada tahun 1949, berlatih di British Mons Military College, dan diangkat sebagai Kepala Polisi Dubai oleh ayahnya pada usia dua puluh tahun. Ia kemudian menjadi Menteri Pertahanan pertama di Uni pada tahun 1971 dan Putra Mahkota Dubai pada tahun 1995, menggantikan saudaranya Maktoum pada 4 Januari 2006. Selama masa pemerintahannya, Dubai menjadi kota global: Emirates Airlines, DP World, Jumeirah Group, The Palm Islands, Burj Al Arab, dan Burj Khalifa, gedung tertinggi di dunia. Ia adalah joki terkenal dan pendiri Godolphin Racing Stables global."
