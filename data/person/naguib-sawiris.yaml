summary:
  ar: "نجيب ساويرس (وُلد في 15 حزيران 1954 في القاهرة)، رجل أعمال مصري، أكبر أبناء أنسي ساويرس الثلاثة. درس الهندسة في المعهد الفيدرالي للتكنولوجيا في زيورخ، وبنى أوراسكوم للاتصالات (موبينيل) ويرأس أوراسكوم للاستثمار القابضة، واستثمر في مناجم الذهب عبر لا مانشا، وأسس حزب المصريين الأحرار سنة 2011."
  en: "Naguib Sawiris (born 15 June 1954 in Cairo) is an Egyptian businessman, the eldest of Onsi Sawiris's three sons. He studied engineering at ETH Zurich, built Orascom Telecom (Mobinil) and chairs Orascom Investment Holding, invested in gold mining through La Mancha, and founded the Free Egyptians Party in 2011."
  ur: "نجیب ساویرس (پیدائش 15 جون 1954، قاہرہ) مصری تاجر اور انسی ساویرس کے تین بیٹوں میں سب سے بڑے ہیں۔ انہوں نے ای ٹی ایچ زیورخ سے انجینئرنگ پڑھی، اوراسکوم ٹیلی کام (موبینیل) قائم کیا اور اوراسکوم انویسٹمنٹ ہولڈنگ کے چیئرمین ہیں، لا مانچا کے ذریعے سونے کی کان کنی میں سرمایہ کاری کی اور 2011 میں فری ایجپشنز پارٹی کی بنیاد رکھی۔"

