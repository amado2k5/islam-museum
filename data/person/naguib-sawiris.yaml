summary:
  ar: "نجيب ساويرس ⁦(وُلد في 15 حزيران 1954 في القاهرة)⁩، رجل أعمال مصري، أكبر أبناء أنسي ساويرس الثلاثة. درس الهندسة في المعهد الفيدرالي للتكنولوجيا في زيورخ، وبنى أوراسكوم للاتصالات ⁦(موبينيل)⁩ ويرأس أوراسكوم للاستثمار القابضة، واستثمر في مناجم الذهب عبر لا مانشا، وأسس حزب المصريين الأحرار سنة 2011."
  en: "Naguib Sawiris (born 15 June 1954 in Cairo) is an Egyptian businessman, the eldest of Onsi Sawiris's three sons. He studied engineering at ETH Zurich, built Orascom Telecom (Mobinil) and chairs Orascom Investment Holding, invested in gold mining through La Mancha, and founded the Free Egyptians Party in 2011."
  ur: "نجیب ساویرس ⁦(پیدائش 15 جون 1954، قاہرہ)⁩ مصری تاجر اور انسی ساویرس کے تین بیٹوں میں سب سے بڑے ہیں۔ انہوں نے ای ٹی ایچ زیورخ سے انجینئرنگ پڑھی، اوراسکوم ٹیلی کام ⁦(موبینیل)⁩ قائم کیا اور اوراسکوم انویسٹمنٹ ہولڈنگ کے چیئرمین ہیں، لا مانچا کے ذریعے سونے کی کان کنی میں سرمایہ کاری کی اور 2011 میں فری ایجپشنز پارٹی کی بنیاد رکھی۔"
  es: "Naguib Sawiris (nacido el 15 de junio de 1954 en El Cairo) es un empresario egipcio, el mayor de los tres hijos de Onsi Sawiris. Estudió ingeniería en la ETH de Zúrich, fundó Orascom Telecom (Mobinil) y preside Orascom Investment Holding, invirtió en la minería de oro a través de La Mancha y fundó el Partido de los Egipcios Libres en 2011."
  fr: "Naguib Sawiris (né le 15 juin 1954 au Caire) est un homme d'affaires égyptien, l'aîné des trois fils d'Onsi Sawiris. Il a étudié l'ingénierie à l'ETH de Zurich, a fondé Orascom Telecom (Mobinil) et préside Orascom Investment Holding, a investi dans l'extraction d'or via La Mancha et a fondé le Parti des Égyptiens libres en 2011."
  tr: "Naguib Sawiris (15 Haziran 1954, Kahire doğumlu), Ansi Sawiris'in üç çocuğunun en büyüğü olan Mısırlı bir iş insanıdır. Zürih'teki Federal Teknoloji Enstitüsü'nde mühendislik eğitimi aldı, Orascom Telekomünikasyon'u (Mobinil) kurdu, Orascom Investment Holding'in başında, La Mancha aracılığıyla altın madenlerine yatırım yaptı ve 2011'de Özgür Mısırlılar Partisi'ni kurdu."
  id: "Naguib Sawiris (lahir 15 Juni 1954, di Kairo) adalah seorang pengusaha Mesir, anak sulung dari tiga bersaudara Ansi Sawiris. Ia belajar teknik di Institut Teknologi Federal di Zurich, membangun Orascom Telecommunications (Mobinil), memimpin Orascom Investment Holding, berinvestasi di tambang emas melalui La Mancha, dan mendirikan Partai Mesir Merdeka pada tahun 2011."

