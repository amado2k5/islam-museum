summary:
  ar: "إمام الأئمة أبو بكر محمد بن إسحاق بن خزيمة السلمي، محدّث نيسابور وصاحب «الصحيح» المعروف بصحيح ابن خزيمة، وُلد سنة 223هـ وتوفي سنة 311هـ {cite:mawsuat-a3lam-ulama-adaba}. يروي ابن الأثير أنه أنكر على من ترك الكتابة عن الطبري، وقال بعد مطالعة تفسيره: ما أعلم على أديم الأرض أعلم من أبي جعفر {cite:kamil-ibn-al-athir p. 100}. ويحكي ابن الجوزي خبر رحلته إلى مصر مع ثلاثة من أقرانه لسماع كتب الشافعي من الربيع بن سليمان، وما أصابهم من الجوع حتى وصلتهم صلة أحمد بن طولون {cite:muntazam-ibn-al-jawzi p. 172}."
  en: "Abu Bakr Muhammad ibn Ishaq ibn Khuzayma al-Sulami, called 'imam of the imams', the hadith master of Nishapur and compiler of the Sahih known by his name, born 223 AH and died 311 AH {cite:mawsuat-a3lam-ulama-adaba}. Ibn al-Athir reports his defence of al-Tabari against Hanbali pressure {cite:kamil-ibn-al-athir p. 100}; Ibn al-Jawzi tells of his hungry stay in Egypt hearing al-Shafi'i's books from al-Rabi' ibn Sulayman, ended by a gift from Ahmad ibn Tulun {cite:muntazam-ibn-al-jawzi p. 172}."
