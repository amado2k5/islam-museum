label: { ar: "محمد بن إسحاق بن خزيمة النيسابوري" }
summary:
  ar: "إمام نيسابور في الحديث؛ قال للحسين بن علي الرازي لما قال له لم تكتب عن محمد بن جرير الطبرى وقد كانت الحنابلة تمنع من الدخول عليه: ليتك لم تكتب عن كل من كتبت عنه وسمعت عن أبي جعفر، وقال حين طالع كتاب التفسير للطبرى ما أعلم على أديم الأرض أعلم من أبي جعفر ولقد ظلمته الحنابلة {cite:kamil-ibn-al-athir p. 100}."
  en: "The imam of Nishapur in hadith; he rebuked a student for writing from al-Tabari under Hanbali pressure, then judged after reading the Tafsir: no one on earth is more learned than Abu Ja'far, and the Hanbalis wronged him {cite:kamil-ibn-al-athir p. 100}."
