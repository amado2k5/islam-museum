summary:
  ar: "إمام الأئمة أبو بكر محمد بن إسحاق بن خزيمة السلمي، محدّث نيسابور وصاحب «الصحيح» المعروف بصحيح ابن خزيمة، وُلد سنة 223هـ وتوفي سنة 311هـ {cite:mawsuat-a3lam-ulama-adaba}. يروي ابن الأثير أنه أنكر على من ترك الكتابة عن الطبري، وقال بعد مطالعة تفسيره: ما أعلم على أديم الأرض أعلم من أبي جعفر {cite:kamil-ibn-al-athir p. 100}. ويحكي ابن الجوزي خبر رحلته إلى مصر مع ثلاثة من أقرانه لسماع كتب الشافعي من الربيع بن سليمان، وما أصابهم من الجوع حتى وصلتهم صلة أحمد بن طولون {cite:muntazam-ibn-al-jawzi p. 172}."
  en: "Abu Bakr Muhammad ibn Ishaq ibn Khuzayma al-Sulami, called 'imam of the imams', the hadith master of Nishapur and compiler of the Sahih known by his name, born 223 AH and died 311 AH {cite:mawsuat-a3lam-ulama-adaba}. Ibn al-Athir reports his defence of al-Tabari against Hanbali pressure {cite:kamil-ibn-al-athir p. 100}; Ibn al-Jawzi tells of his hungry stay in Egypt hearing al-Shafi'i's books from al-Rabi' ibn Sulayman, ended by a gift from Ahmad ibn Tulun {cite:muntazam-ibn-al-jawzi p. 172}."
  es: "Abu Bakr Muhammad ibn Ishaq ibn Khuzayma al-Sulami, llamado 'imán de los imanes', maestro de hadices de Nishapur y compilador del Sahih conocido por su nombre, nació en 223 AH y murió en 311 AH {cite:mawsuat-a3lam-ulama-adaba}. Ibn al-Athir informa de su defensa de al-Tabari contra la presión hanbalí {cite:kamil-ibn-al-athir p. 100}; Ibn al-Jawzi cuenta su estancia en Egipto, donde pasó hambre escuchando los libros de al-Shafi'i de al-Rabi' ibn Sulayman, y que terminó con un regalo de Ahmad ibn Tulun {cite:muntazam-ibn-al-jawzi p. 172}."
  fr: "Abou Bakr Muhammad ibn Ishaq ibn Khuzayma al-Sulami, surnommé « l'imam des imams », maître du hadith de Nishapur et compilateur du Sahih portant son nom, est né en 223 AH et mort en 311 AH (voir: mawsuat-a3lam-ulama-adaba). Ibn al-Athir rapporte sa défense d'al-Tabari contre les pressions hanbalites (voir: kamil-ibn-al-athir, p. 100). Ibn al-Jawzi raconte son séjour en Égypte, marqué par la faim, où il écouta les ouvrages d'al-Shafi'i grâce à al-Rabi' ibn Sulayman, séjour qui prit fin grâce à un don d'Ahmad ibn Tulun (voir: muntazam-ibn-al-jawzi, p. 172)."
  ur: "ابوبکر محمد بن اسحاق بن خزیمہ السلمی، جسے 'ائمہ کا امام' کہا جاتا ہے، نیشاپور کے حدیث کے ماسٹر اور اپنے نام سے مشہور صحاح کے مرتب، پیدائش 223 ہجری اور وفات 311 ہجری {حوالہ: موصوف العلماء ادباء}۔ ابن اثیر نے حنبلی دباؤ کے خلاف الطبری کے دفاع کو نقل کیا ہے {حوالہ: کامل ابن الاثیر ص۔ 100}; ابن الجوزی مصر میں اپنے بھوکے قیام کے بارے میں بتاتا ہے کہ اس نے الربیع بن سلیمان سے الشافعی کی کتابیں سنیں، جس کا اختتام احمد بن طولون کے تحفے سے ہوا۔ 172}۔"
  tr: "İmamların imamı Ebu Bekir Muhammed bin İshaq ibn Huzeymah el-Sulami, Nişapur'dan bir hadis âlimi ve Sahih İbn Hozeymah'ın yazarı, 223 Hicri yılında doğmuş ve 311 Hicri yılında vefat etmiştir {alıntı:) Mevsuat-a3lam-ulama-adaba}. İbn el-Athir, el-Tabari'den yazmayı bırakanları eleştirdiğini ve tafsirini okuduktan sonra şöyle dediğini anlatır: 'Yeryüzündeki hiçbir halk Ebu Ca'fer'den daha iyi bilmez' {atı:kamil-ibn-al-athir s. 100}. İbn el-Cevzi, üç akrataşıyla birlikte el-Rabi' bin Süleyman'dan el-Şafii kitaplarını dinlemek için Mısır'a yaptığı yolculuğu ve onları Ahmad ibn Tulun ile ilişkilendirene kadar çeken açlığını anlatır {atıf:muntazam-ibn-al-jawzi, s. 172}."
  id: "Imam Imam Abu Bakr Muhammad ibn Ishaq ibn Khuzaymah al-Sulami, seorang ulama hadis dari Nishapur dan penulis Sahih yang dikenal sebagai Sahih Ibn Khuzaymah, lahir pada tahun 223 H dan wafat pada tahun 311 H {cite:mawsuat-a3lam-ulama-adaba}. Ibn al-Athir menceritakan bahwa ia mengkritik mereka yang meninggalkan penulisan dari al-Tabari, dan setelah membaca tafsirnya, ia berkata: 'Tidak ada orang di bumi yang lebih tahu daripada Abu Ja'far' {cite:kamil-ibn-al-athir hlm. 100}. Ibn al-Jawzi menceritakan kisah perjalanannya ke Mesir bersama tiga rekannya untuk mendengar kitab-kitab al-Shafi'i dari al-Rabi' ibn Sulayman, dan kelaparan yang menimpa mereka hingga mereka terhubung dengan Ahmad ibn Tulun {cite:muntazam-ibn-al-jawzi, hlm. 172}."
