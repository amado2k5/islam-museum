id: person/ibn-khuzayma
class: person
label: { ar: "محمد بن إسحاق بن خزيمة النيسابوري" }
summary:
  ar: "إمام نيسابور في الحديث؛ قال للحسين بن علي الرازي لما قال له لم تكتب عن محمد بن جرير الطبرى وقد كانت الحنابلة تمنع من الدخول عليه: ليتك لم تكتب عن كل من كتبت عنه وسمعت عن أبي جعفر، وقال حين طالع كتاب التفسير للطبرى ما أعلم على أديم الأرض أعلم من أبي جعفر ولقد ظلمته الحنابلة {cite:kamil-ibn-al-athir p. 100}. وعند ابن الجوزي في خبر مشهور: كان هو ومحمد بن نصر المروزي ومحمد بن علويه الوزان ومحمد بن هارون الروياني على باب الربيع بن سليمان بمصر يسمعون منه كتب الشافعي فبقوا ثلاثة أيام لم يطعموا شيئًا وفنيت أزوادهم فاقترعوا من يسأل فوقعت القرعة على ابن خزيمة فقال دعوني أصلي ركعتين فسجد يدعو بدعاء الاستخارة إذ قُرع الباب فإذا خادم أحمد بن طولون أمير مصر وبين يديه شمعة وخلفه شمعة فسلّم وأخرج لكل واحد منهم صرة فيها خمسون دينارًا وقال إن الأمير يقرأ عليكم السلام ويقول استنفقوا هذا فإذا فني بعثنا إليكم بمثله، فسألوه عن القصة فقال إن أحمد بن طولون كان قائلًا نصف النهار إذ أتاه آتٍ في منامه فقال يا أحمد ما حجتك غدًا عند الله إذا سألك عن أربعة من أهل العلم طووا منذ ثلاثة أيام لم يطعموا شيئًا؟ فانتبه فزعًا مذعورًا وكتب أسماءهم وبعثه في طلبهم {cite:muntazam-ibn-al-jawzi p. 172}."
  en: "The imam of Nishapur in hadith; he rebuked a student for writing from al-Tabari under Hanbali pressure, then judged after reading the Tafsir: no one on earth is more learned than Abu Ja'far, and the Hanbalis wronged him {cite:kamil-ibn-al-athir p. 100}."
