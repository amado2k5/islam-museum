  ar: "رجل ذو اسم وشرف في بني جشم بن معاوية نزل بالغابة في بطن عظيم من قومه يريد أن يجمع قيساً على حرب النبي، فبعث إليه النبي عبد الله بن أبي حدرد في رجلين فرماه بسهم في فؤاده واحتزّ رأسه؛ يشك ابن إسحاق في اسمه: رفاعة بن قيس أو قيس بن رفاعة."
  en: "A man of name and rank in Banu Jusham ibn Mu'awiya who camped at al-Ghaba with a large clan of his people, meaning to gather Qays for war against the Prophet; the Prophet sent Abdullah ibn Abi Hadrad with two men, who shot him through the heart and cut off his head. Ibn Ishaq is unsure whether his name was Rifa'a ibn Qays or Qays ibn Rifa'a."
