summary:
  ar: "رجل ذو اسم وشرف في بني جشم بن معاوية نزل بالغابة في بطن عظيم من قومه يريد أن يجمع قيساً على حرب النبي، فبعث إليه النبي عبد الله بن أبي حدرد في رجلين فرماه بسهم في فؤاده واحتزّ رأسه؛ يشك ابن إسحاق في اسمه: رفاعة بن قيس أو قيس بن رفاعة."
  en: "A man of name and rank in Banu Jusham ibn Mu'awiya who camped at al-Ghaba with a large clan of his people, meaning to gather Qays for war against the Prophet; the Prophet sent Abdullah ibn Abi Hadrad with two men, who shot him through the heart and cut off his head. Ibn Ishaq is unsure whether his name was Rifa'a ibn Qays or Qays ibn Rifa'a."
  es: "Un hombre de renombre y rango en Banu Jusham ibn Mu'awiya acampó en al-Ghaba con un numeroso clan, con la intención de reunir a los Qays para la guerra contra el Profeta. El Profeta envió a Abdullah ibn Abi Hadrad con dos hombres, quienes le dispararon en el corazón y le cortaron la cabeza. Ibn Ishaq no está seguro de si su nombre era Rifa'a ibn Qays o Qays ibn Rifa'a."
  fr: "Un homme de renom et de haut rang parmi les Banu Jusham ibn Mu'awiya campa à al-Ghaba avec un clan important, dans l'intention de rassembler Qays pour une guerre contre le Prophète. Le Prophète envoya Abdullah ibn Abi Hadrad avec deux hommes, qui lui tirèrent une balle en plein cœur et lui tranchèrent la tête. Ibn Ishaq ignore si son nom était Rifa'a ibn Qays ou Qays ibn Rifa'a."
  ur: "بنو جشام بن معاویہ کا ایک نام اور رتبہ والا شخص جس نے اپنی قوم کے ایک بڑے قبیلے کے ساتھ الغابہ میں ڈیرہ ڈالا، یعنی قیس کو نبی کے خلاف جنگ کے لیے جمع کرنا؛ نبی نے عبداللہ بن ابی حدرد کو دو آدمیوں کے ساتھ بھیجا، جنہوں نے ان کے دل میں گولی مار کر اس کا سر کاٹ دیا۔ ابن اسحاق کو یقین نہیں ہے کہ اس کا نام رفاع بن قیس تھا یا قیس بن رفاع۔"
  tr: "Banu Cüş bin Muaviye arasında isim ve onurlu bir adam, Peygamber'e karşı Kays toplamak isteyen büyük bir grup arasında ormanda yerleşti. Peygamber, Abdullah ibn Abi Hudadd'ı iki adamla gönderdi, o da kalbine ok sapladı ve başını deldi; İbn İshaq onun adından şüphe eder: Rifa'ah ibn Qays ya da Kays ibn Rifa'ah."
  id: "Seorang pria ternama dan terhormat di antara Banu Jushm ibn Muawiyah menetap di hutan di antara sekelompok besar kaumnya yang ingin mengumpulkan Qays melawan Nabi. Nabi mengirim Abdullah ibn Abi Hudadd bersama dua orang, sehingga ia menembak jantungnya dengan panah dan menusuk kepalanya; Ibn Ishaq meragukan namanya: Rifa'ah ibn Qays atau Qays ibn Rifa'ah."
