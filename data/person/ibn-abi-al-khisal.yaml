  ar: "بطاقة أولية لأبي الحسن علي ابن أبي الخصال، وزير وأديب الأندلس في القرن الثاني عشر، توفي سنة ١١٤٦م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu'l-Hasan Ali ibn Abi al-Khisal, the twelfth-century Andalusi minister and writer, d. 1146; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Abu'l-Hasan Ali ibn Abi al-Khisal, ministro y escritor andalusí del siglo XII, fallecido en 1146; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche d'identité d'Abu'l-Hasan Ali ibn Abi al-Khisal, ministre et écrivain andalou du XIIe siècle, mort en 1146; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "بارہویں صدی کے اندلس کے وزیر اور مصنف ابو الحسن علی ابن ابی الخصال کے لیے ڈرافٹ کارڈ۔ 1146; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1146 yılında ölen, on ikinci yüzyılda el-Endülüs'ün bakanı ve edebi figürü olan Ebu el-Hasan Ali ibn Abi el-Xisal'ın ön kartı; önemli kişilerin sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Abu al-Hasan Ali ibn Abi al-Khisal, menteri dan tokoh sastra al-Andalus pada abad kedua belas, yang meninggal pada tahun 1146 M; ia disebutkan oleh kamus tokoh-tokoh terkenal dan biografinya belum pernah ditinjau di halaman tersebut."
