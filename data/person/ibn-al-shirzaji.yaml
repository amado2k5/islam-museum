id: person/ibn-al-shirzaji
class: person
label: { ar: "ابن الشيرزجي" }
summary:
  ar: "الشيخ أبو البركات عبد الله بن الحضرمي بن الحسين المعروف بابن الشيرزجي؛ كان مشهوراً بعلمي الحديث والفقه، ولي قضاء البصرة ودرّس بالمدرسة الأتابكية القديمة بالموصل، وسمع عليه ابن خلكان بعض تفسير الثعلبي وأجاز له أن يروي عنه جميع ما يرويه وكتب له بذلك في فهرست سماعه سنة سبع وستين وخمسمائة {cite:wafayat-ayan}."
  tr: "Şeyh Ebu el-Barakat Abdullah ibn el-Hadrami ibn el-Hüseyin, İbn el-Şirzaci olarak bilinir, hadis ve fıhyh bilgisiyle tanınırdı. Basra'nın hakimi olarak görev yaptı ve Musul'daki eski Atabeg okulunda ders verdi. İbn Hallikan, ondan bazı tefsirleri duydu ve ona anlattığı her şeyi anlatmasına izin verdi. Bunu 567 Hicri yılındaki dinlenme dizininde kaydetti."
  id: "Sheikh Abu al-Barakat Abdullah ibn al-Hadrami ibn al-Husayn, yang dikenal sebagai Ibn al-Shirzaji, terkenal karena pengetahuannya tentang hadis dan firisprudensi. Ia menjabat sebagai hakim Basra dan mengajar di sekolah Atabeg lama di Mosul. Ibn Khallikan mendengar beberapa tafsir al-Thalabi darinya dan mengizinkannya menceritakan segala sesuatu yang ia ceritakan darinya. Ia mencatat hal ini dalam indeks sidang pada tahun 567 H."
