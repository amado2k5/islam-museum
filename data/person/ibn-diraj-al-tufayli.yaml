summary:
  ar: "أشهر الطفيليين، وصفه المسعودي بأنه من أكمل الناس أدباً وأخفهم روحاً، تزيا في زي ندماء أحمد بن المدبر ودخل مجلسه، فلما افتضح تعقبه ابن المدبر بالشطرنج فغلب غلامه ثم بالنرد فغلب البواب ثم بالعود فغلب الشيخ الهاشمي ثم بالطنبور فغلب المحتكر، حتى انتهى إلى قوس بندق فرمى الحاجب بخمسين بندقة رصاص لم يخطئه بواحدة، وقال ما دام البرجاس استي فلا {cite:muruj-al-dhahab p. 561-563}."
  en: "The most famous gatecrasher: outplayed Ibn al-Mudabbir's household at chess, backgammon, lute and tanbur, then put fifty lead pellets into the chamberlain's backside without a miss {cite:muruj-al-dhahab p. 561-563}."
