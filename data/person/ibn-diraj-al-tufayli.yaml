label: { ar: "ابن دراج الطفيلي", en: "Ibn Diraj the Tufayli", es: "Ibn Diraj the Tufayli", fr: "Ibn Diraj the Tufayli", ur: "ابن دراز طفیلی۔" }
summary:
  ar: "أشهر الطفيليين، وصفه المسعودي بأنه من أكمل الناس أدباً وأخفهم روحاً، تزيا في زي ندماء أحمد بن المدبر ودخل مجلسه، فلما افتضح تعقبه ابن المدبر بالشطرنج فغلب غلامه ثم بالنرد فغلب البواب ثم بالعود فغلب الشيخ الهاشمي ثم بالطنبور فغلب المحتكر، حتى انتهى إلى قوس بندق فرمى الحاجب بخمسين بندقة رصاص لم يخطئه بواحدة، وقال ما دام البرجاس استي فلا {cite:muruj-al-dhahab p. 561-563}."
  en: "The most famous gatecrasher: outplayed Ibn al-Mudabbir's household at chess, backgammon, lute and tanbur, then put fifty lead pellets into the chamberlain's backside without a miss {cite:muruj-al-dhahab p. 561-563}."
  es: "El intruso más famoso: superó a la casa de Ibn al-Mudabbir en ajedrez, backgammon, laúd y tanbur, y luego le metió cincuenta perdigones de plomo en el trasero al chambelán sin fallar ni una sola vez {cite:muruj-al-dhahab p. 561-563}."
  fr: "Le plus célèbre intrus: a surpassé la maisonnée d'Ibn al-Mudabbir aux échecs, au backgammon, au luth et au tanbur, puis a mis cinquante balles de plomb dans le derrière du chambellan sans en manquer une {cite:muruj-al-dhahab p. 561-563}."
  ur: "سب سے مشہور گیٹ کریشر: شطرنج، بیکگیمن، لوٹے اور تنبر میں ابن المدبیر کے گھر والوں کو پیچھے چھوڑ دیا، پھر بغیر کسی کمی کے چیمبرلین کے پچھلے حصے میں سیسہ کے پچاس گولے ڈالے۔ 561-563}۔"
  tr: "En ünlü Tufeylin El-Mes'udi onu en zarif ve en nazik ruhlardan biri olarak tanımlamıştır. Ahmed bin el-Müdübber'in yoldaşları gibi giyinip toplantısına katılmıştır. Açığa çıktığında, İbn el-Mudabbir satrançla peşinden koşmuş, önce kapıcıya karşı zarla, sonra udla, sonra Şeyh al-Haşimile, sonra tefalı yenmiştir. Fındık yayına ulaşıp elli tüfekle kaşını fırlatmıştır, tek bir el bile atmamıştır ve şöyle demiştir: Barja güçlü olduğu sürece, {cite:muruj-al-dhahab s. 561-563} yoktur."
  id: "Tufaylin yang paling terkenal, Al-Mas'udi, menggambarkannya sebagai salah satu yang paling halus dan paling lembut dalam jiwa. Dia berpakaian seperti teman Ahmad ibn al-Mudabber dan masuk ke dalam kumpulannya. Ketika dia terbongkar, Ibn al-Mudabbir mengejarnya dengan catur, mengalahkan pelayannya, kemudian dengan dadu melawan penjaga pintu, kemudian dengan kecap, kemudian dengan oud, kemudian dengan Sheikh al-Hashimi, dan kemudian dengan tambour, dia mengalahkan monopolis itu. Dia mencapai busur kacang hazel dan melemparkan alis itu dengan lima puluh senapan, tidak satu pun tembakan, dan berkata: Selama barjas kuat, tidak ada {cite:muruj-al-dhahab hlm. 561-563}."
