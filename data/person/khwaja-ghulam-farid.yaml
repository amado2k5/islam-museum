summary:
  ar: "شاعر صوفي سرائكي من البنجاب (1845–1901)، وُلد في تشاتشران بولاية بهاولپور وتوفي فيها ودُفن في ميثانكوت. بايع أخاه الأكبر خواجة فخر جهان في السلسلة الجشتية النظامية وجلس بعده على سجادة الإرشاد، واعتزل ثمانية عشر عاماً في صحراء تشولستان، وخلّف «ديوان فريد» في الكافي السرائيكية وأعمالاً فارسية."
  en: "Saraiki Sufi poet of the Punjab (1845–1901), born at Chachran in Bahawalpur State, died there and buried at Mithankot. He took bay'ah with his elder brother Khwaja Fakhr Jahan in the Chishti Nizami silsila and succeeded him on the seat of guidance, spent eighteen years in retreat in the Cholistan desert, and left the Diwan-e-Farid of Saraiki kafis and Persian prose works."
  ur: "پنجاب کے سرائیکی صوفی شاعر (1845ء–1901ء)، چاچڑاں شریف (ریاست بہاولپور) میں پیدا ہوئے، وہیں وصال ہوا اور کوٹ مٹھن میں مدفون ہیں۔ سلسلہ چشتیہ نظامیہ میں اپنے بڑے بھائی خواجہ فخر جہاں سے بیعت ہوئے اور ان کے بعد سجادہ نشین بنے، اٹھارہ برس روہی (چولستان) میں رہے، اور سرائیکی کافیوں کا «دیوان فرید» اور فارسی نثری تصانیف چھوڑیں۔"
