summary:
  ar: "أبو سعيد بن المعلى الأنصاري المدني، له صحبة، ويقال اسمه رافع بن أوس، وقيل الحارث، روى عنه حفص بن عاصم وعبيد بن حنين، وروى له البخاري وأبو داود والنسائي وابن ماجه. ⁦(؟ - ٧٣ه)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
  en: "Abu Said ibn al-Mu'alla al-Ansari of Medina, a Companion. His name is given as Rafi ibn Aws, or al-Harith ibn Aws. Hafs ibn Asim and Ubayd ibn Hunayn narrated from him; al-Bukhari, Abu Dawud, al-Nasa'i and Ibn Majah record him. Death 73 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
  fr: "Abu Said ibn al-Mu'alla al-Ansari de Médine, Compagnon. Son nom est donné comme Rafi ibn Aws, ou al-Harith ibn Aws. Hafs ibn Asim et Ubayd ibn Hunayn transmirent de lui ; al-Bukhari, Abu Dawud, al-Nasa'i et Ibn Majah le mentionnent dans leurs recueils. Mort en 73 H selon le texte imprimé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
  es: "Abu Said ibn al-Mu'alla al-Ansari de Medina, un Compañero. Su nombre se da como Rafi ibn Aws o al-Harith ibn Aws. Hafs ibn Asim y Ubayd ibn Hunayn narraron de él; al-Bukhari, Abu Dawud, al-Nasa'i e Ibn Majah lo registran. Muerte 73 H impresa. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
  ur: "مدینہ کے ابو سعید بن المعلا الانصاری ایک صحابی تھے۔ اس کا نام رافع بن اوس یا الحارث بن اوس رکھا گیا ہے۔ حفص بن عاصم اور عبید بن حنین نے اس سے روایت کی ہے۔ البخاری، ابوداؤد، نسائی اور ابن ماجہ نے اسے درج کیا ہے۔ وفات 73ھ بطور مطبوعہ۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 13345}"
