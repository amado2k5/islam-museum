summary:
  ar: "أبو سعيد بن المعلى الأنصاري المدني، له صحبة، ويقال اسمه رافع بن أوس، وقيل الحارث، روى عنه حفص بن عاصم وعبيد بن حنين، وروى له البخاري وأبو داود والنسائي وابن ماجه. (؟ - ٧٣ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
  en: "Abu Said ibn al-Mu'alla al-Ansari of Medina, a Companion. His name is given as Rafi ibn Aws, or al-Harith ibn Aws. Hafs ibn Asim and Ubayd ibn Hunayn narrated from him; al-Bukhari, Abu Dawud, al-Nasa'i and Ibn Majah record him. Death 73 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13345}"
