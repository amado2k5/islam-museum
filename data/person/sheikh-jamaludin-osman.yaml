summary:
  ar: "داعية كيني وإمام الجامع الكبير ⁦(جامع جاميا)⁩ في نيروبي منذ مايو 2024، بعد أن كان نائب الإمام منذ أكتوبر 2019؛ وُلد في 20 يوليو 1986 ونشأ وتعلّم في مومباسا، ونال بكالوريوس الحديث من الجامعة الإسلامية بالمدينة المنورة سنة 2014. بلغ حسابه على إنستغرام (@sheikhjamaludinosman) 150,000 متابع بحسب قراءة حصاد الموجة 196 لبيانات منشوراته بتاريخ 8 نوفمبر 2026 — وهي قراءة الحصاد لا قراءة مباشرة من هذا الكاتب، إذ لم تُعطِ محاولة إعادة القراءة المباشرة رقمًا مؤرخًا بديلًا — ويجول بأنحاء كينيا في جولات دعوية، منها جولة وسط كينيا في مايو 2026."
  en: "Kenyan preacher and Imam of Jamia Mosque, Nairobi, since May 2024, after serving as deputy imam from October 2019; born on 20 July 1986 and raised and schooled in Mombasa, he earned a bachelor's degree in Hadith at the Islamic University of Madinah in 2014. His Instagram account (@sheikhjamaludinosman) counted 150,000 followers by the wave-196 harvest's read of his posts' metadata on 8 November 2026 — the harvest's read, not this writer's own direct read, this writer's fresh re-read attempt yielding no alternative dated figure — and he tours Kenya on da'wah tours, among them the Central Kenya tour of May 2026."
  ur: "کینیا کے مبلغ اور مئی 2024ء سے نیروبی کی جامع مسجد کے امام، اس سے قبل اکتوبر 2019ء سے نائب امام؛ وہ 20 جولائی 1986ء کو پیدا ہوئے، مومباسا میں پلے بڑھے اور تعلیم حاصل کی، اور 2014ء میں مدینہ کی اسلامی یونیورسٹی سے حدیث میں بیچلر ڈگری حاصل کی۔ ان کے انسٹاگرام اکاؤنٹ (@sheikhjamaludinosman) کے فالوور 150,000 تھے، جیسا کہ موج 196 کے حصول نے 8 نومبر 2026ء کو ان کی پوسٹوں کے میٹا ڈیٹا کو پڑھ کر درج کیا — یہ حصول کی خوانی ہے، اس مصنف کی براہِ راست خوانی نہیں، کیونکہ دوبارہ خوانی کی کوشش سے کوئی متبادل مؤرخ عدد حاصل نہیں ہوا — اور وہ کینیا بھر میں دعوتی دورے کرتے ہیں، جن میں مئی 2026ء کا وسطی کینیا دورہ شامل ہے۔"
