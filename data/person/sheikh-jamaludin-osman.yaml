summary:
  ar: "داعية كيني وإمام الجامع الكبير ⁦(جامع جاميا)⁩ في نيروبي منذ مايو 2024، بعد أن كان نائب الإمام منذ أكتوبر 2019؛ وُلد في 20 يوليو 1986 ونشأ وتعلّم في مومباسا، ونال بكالوريوس الحديث من الجامعة الإسلامية بالمدينة المنورة سنة 2014. بلغ حسابه على إنستغرام (@sheikhjamaludinosman) 150,000 متابع بحسب قراءة حصاد الموجة 196 لبيانات منشوراته بتاريخ 8 نوفمبر 2026 — وهي قراءة الحصاد لا قراءة مباشرة من هذا الكاتب، إذ لم تُعطِ محاولة إعادة القراءة المباشرة رقمًا مؤرخًا بديلًا — ويجول بأنحاء كينيا في جولات دعوية، منها جولة وسط كينيا في مايو 2026."
  en: "Kenyan preacher and Imam of Jamia Mosque, Nairobi, since May 2024, after serving as deputy imam from October 2019; born on 20 July 1986 and raised and schooled in Mombasa, he earned a bachelor's degree in Hadith at the Islamic University of Madinah in 2014. His Instagram account (@sheikhjamaludinosman) counted 150,000 followers by the wave-196 harvest's read of his posts' metadata on 8 November 2026 — the harvest's read, not this writer's own direct read, this writer's fresh re-read attempt yielding no alternative dated figure — and he tours Kenya on da'wah tours, among them the Central Kenya tour of May 2026."
  ur: "کینیا کے مبلغ اور مئی 2024ء سے نیروبی کی جامع مسجد کے امام، اس سے قبل اکتوبر 2019ء سے نائب امام؛ وہ 20 جولائی 1986ء کو پیدا ہوئے، مومباسا میں پلے بڑھے اور تعلیم حاصل کی، اور 2014ء میں مدینہ کی اسلامی یونیورسٹی سے حدیث میں بیچلر ڈگری حاصل کی۔ ان کے انسٹاگرام اکاؤنٹ (@sheikhjamaludinosman) کے فالوور 150,000 تھے، جیسا کہ موج 196 کے حصول نے 8 نومبر 2026ء کو ان کی پوسٹوں کے میٹا ڈیٹا کو پڑھ کر درج کیا — یہ حصول کی خوانی ہے، اس مصنف کی براہِ راست خوانی نہیں، کیونکہ دوبارہ خوانی کی کوشش سے کوئی متبادل مؤرخ عدد حاصل نہیں ہوا — اور وہ کینیا بھر میں دعوتی دورے کرتے ہیں، جن میں مئی 2026ء کا وسطی کینیا دورہ شامل ہے۔"
  es: "Predicador keniano e imán de la mezquita Jamia de Nairobi desde mayo de 2024, tras haber ejercido como imán adjunto desde octubre de 2019; nació el 20 de julio de 1986 y se crió y educó en Mombasa. Obtuvo una licenciatura en Hadith en la Universidad Islámica de Medina en 2014. Su cuenta de Instagram (@sheikhjamaludinosman) contaba con 150.000 seguidores según la lectura de los metadatos de sus publicaciones realizada por wave-196 harvest el 8 de noviembre de 2026 (la lectura de harvest, no la lectura directa de este autor, ya que su nuevo intento de lectura no arrojó ninguna cifra alternativa con fecha) y realiza giras de da'wah por Kenia, entre ellas la gira por el centro de Kenia en mayo de 2026."
  fr: "Prédicateur kényan et imam de la mosquée Jamia de Nairobi depuis mai 2024, après avoir été imam adjoint depuis octobre 2019; né le 20 juillet 1986, il a grandi et fait ses études à Mombasa, où il a obtenu une licence en hadith à l’Université islamique de Médine en 2014. Son compte Instagram (@sheikhjamaludinosman) comptait 150 000 abonnés selon les métadonnées de ses publications, consultées par wave-196 harvest le 8 novembre 2026 – données issues de la collecte de données, et non de la lecture directe de l’auteur de ces lignes, cette dernière n’ayant pas permis d’obtenir d’autre chiffre daté – et il effectue des tournées de da’wah au Kenya, dont une tournée dans le centre du pays en mai 2026."
  tr: "Mayıs 2024'ten beri Nairobi'deki Büyük Camii (Camii Camii) imamı ve Kenyalı bir vaizi olan Ekim 2019'dan beri yardımcı imam olarak görev yapmıştır; 20 Temmuz 1986 doğumlu, Mombasa'da büyüyüp eğitim gördü ve 2014'te Medine İslam Üniversitesi'nden hadis alanında lisans derecesi aldı. Instagram hesabı (@sheikhjamaludinosman), 8 Kasım 2026 tarihli yayın verilerinin Wave 196'nın Hasat kitabının okunmasına göre 150.000 takipçiye ulaştı — bu doğrudan okuma değil, hasat okuması değil, çünkü doğrudan yeniden okuma denemesi alternatif tarihli bir sayı sunmadı — ve Mayıs 2026'da merkezi Kenya'yı ziyaret etmek üzere vaaz turlarında seyahat ediyor."
  id: "Seorang pengkhotbah dan imam Kenya di Masjid Agung (Masjid Jamia) di Nairobi sejak Mei 2024, setelah menjabat sebagai wakil imam sejak Oktober 2019; lahir pada 20 Juli 1986, ia tumbuh dan belajar di Mombasa, serta meraih gelar sarjana Hadis dari Universitas Islam Madinah pada tahun 2014. Akun Instagram-nya (@sheikhjamaludinosman) telah mencapai 150.000 pengikut menurut pembacaan data publikasi Wave 196's Harvest tertanggal 8 November 2026 — sebuah pembacaan hasil panen, bukan pembacaan langsung oleh penulis ini, karena tidak ada upaya untuk membacanya ulang secara langsung yang memberikan nomor tanggal alternatif — dan ia melakukan perjalanan ke Kenya dalam tur khotbah, termasuk tur ke Kenya tengah pada Mei 2026."
