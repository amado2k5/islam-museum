summary:
  ar: عالم ودبلوماسي ليبي، وُلد في بنغازي سنة 1962. درس الهندسة وفلسفة العلوم والهرمنيوتيكا في كندا ثم اللاهوت في روما، وأسس مركز «كلام» للبحوث والإعلام ومعهد ليبيا للدراسات المتقدمة، وكان من موقّعي وثيقة
    «كلمة سواء»، وعمل سفيرًا لليبيا لدى الإمارات ويقود حركة «إحياء ليبيا».
  en: Libyan scholar and diplomat, born in Benghazi in 1962. Trained in engineering, philosophy of science and hermeneutics in Canada and theology in Rome, he founded Kalam Research & Media and the Libya
    Institute for Advanced Studies, was an original signatory of 'A Common Word', served as Libya's ambassador to the UAE, and leads the Ihya Libya (Reviving Libya) movement.
  ur: لیبی عالم اور سفارت کار، 1962 میں بنغازی میں پیدا ہوئے۔ کینیڈا میں انجینئری، فلسفۂ سائنس اور تاویلِ نصوص کی تعلیم پائی اور روم میں الٰہیات پڑھی؛ انہوں نے کلام ریسرچ اینڈ میڈیا اور لبیا انسٹیٹیوٹ فار
    ایڈوانسڈ اسٹڈیز قائم کیے، دستاویز «کلمة سواء» کے ابتدائی دستخط کنندگان میں تھے، متحدہ عرب امارات میں لیبیا کے سفیر رہے اور تحریکِ احیاء لیبیا کی قیادت کرتے ہیں۔
  es: "Académico y diplomático libio, nacido en Bengasi en 1962. Se formó en ingeniería, filosofía de la ciencia y hermenéutica en Canadá y en teología en Roma. Fundó Kalam Research & Media y el Instituto Libio de Estudios Avanzados, fue uno de los firmantes originales de \"Una Palabra Común\", se desempeñó como embajador de Libia en los Emiratos Árabes Unidos y lidera el movimiento Ihya Libya (Reviviendo Libia)."
  fr: "Érudit et diplomate libyen, né à Benghazi en 1962. Formé en ingénierie, philosophie des sciences et herméneutique au Canada et en théologie à Rome, il a fondé Kalam Research & Media et l'Institut libyen d'études avancées, a été l'un des signataires originaux de « Une parole commune », a été ambassadeur de Libye aux Émirats arabes unis et dirige le mouvement Ihya Libya (Renaissance de la Libye)."
