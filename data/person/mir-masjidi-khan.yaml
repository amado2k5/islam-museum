summary:
  ar: "زعيم مقاومة أفغاني من سهل شمالي شمال كابل (ت 1841)، من أسرة طاجيكية سيدية عُرفت بالعلم الشرعي والتقوى، أبوه صاحبزاده إسحاق جان خان. قاد مقاومة أهل كوهستان ضد تنصيب البريطانيين شجاع شاه الدراني في الحرب الإنجليزية الأفغانية الأولى، وحصّن وادي نجراب وأباد حملة أُرسلت إلى چاريكار وآوى الأمير المعزول دوست محمد خان، وظل شوكة في جنب حامية كابل حتى مات مسموما على الأرجح سنة 1841. ويُذكَر في أفغانستان غازيا وشهيدا، وباسمه أحد أعلى أوسمة الدولة المدنية."
  en: "Afghan resistance leader of the Shamali Plain north of Kabul (died 1841), of a Tajik Sayyid family respected for Islamic learning and piety, his father Sahibzada Ishaq Jan Khan. He led the Kohistan resistance to the British installation of Shuja Shah Durrani in the First Anglo-Afghan War, fortified the Nijrab valley, destroyed an expedition sent against Charikar and sheltered the deposed Emir Dost Mohammad Khan, and remained a thorn in the side of the Kabul garrison until his death, probably by poisoning, in 1841. He is remembered in Afghanistan as a Ghazi and a martyr, and one of the state's highest civil awards bears his name."
  ur: "کابل کے شمال میں شاملی میدان کے افغان مزاحمتی رہنما (وفات 1841ء)، ایک تاجک سید خاندان سے جو اسلامی علم اور تقویٰ کے لیے مشہور تھا، ان کے والد صاحبزادہ اسحاق جان خان تھے۔ انہوں نے پہلی اینگلو افغان جنگ میں انگریزوں کے شجاع شاہ درانی کو تخت پر بٹھانے کے خلاف کوہستان کی مزاحمت کی قیادت کی، نجراب کی وادی کو مضبوط کیا، چاریکار پر بھیجی گئی مہم کو تباہ کیا اور معزول امیر دوست محمد خان کو پناہ دی، اور 1841ء میں غالباً زہر سے وفات تک کابل کی گیریژن کے لیے دردِ سر بنے رہے۔ افغانستان میں وہ غازی اور شہید کے طور پر یاد کیے جاتے ہیں، اور ریاست کے اعلیٰ ترین سول اعزازات میں سے ایک ان کے نام پر ہے۔"
