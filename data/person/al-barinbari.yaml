summary:
  ar: "ناصر الدين البارنباري الشافعي النحوي نسبة إلى بارنبار قرية قرب دمياط؛ قال السيوطي ولد قبيل سبعين وسبعمائة وقدم القاهرة فاشتهر ومهر في الفقه والعربية والحساب والعروض وغير ذلك وتصدر بالجامع الأزهر تبرعاً ودرس وأفتى مدة وأقرأ وخطب وناب في الجمالية عن حفيد الشيخ ولي الدين العراقي ثم انتزعها منه الشيخ شمس الدين البرماوي وأصابه فالج أبطل نصفه واستمر موعكاً إلى أن مات ليلة الأحد حادي عشر ربيع الأول سنة اثنتين وثلاثين وثمانمائة {cite:shadharat-dhahab p. 200}."
  en: "Nasir al-Din al-Barinbari (b. ~770) — al-Suyuti's own teacher; taught gratis at the Azhar, lectured, gave fatwas and preached until a stroke paralysed half his body; died Sunday night 11 Rabi' I 832 {cite:shadharat-dhahab p. 200}."
