summary:
  ar: "ناصر الدين البارنباري الشافعي النحوي نسبة إلى بارنبار قرية قرب دمياط؛ قال السيوطي ولد قبيل سبعين وسبعمائة وقدم القاهرة فاشتهر ومهر في الفقه والعربية والحساب والعروض وغير ذلك وتصدر بالجامع الأزهر تبرعاً ودرس وأفتى مدة وأقرأ وخطب وناب في الجمالية عن حفيد الشيخ ولي الدين العراقي ثم انتزعها منه الشيخ شمس الدين البرماوي وأصابه فالج أبطل نصفه واستمر موعكاً إلى أن مات ليلة الأحد حادي عشر ربيع الأول سنة اثنتين وثلاثين وثمانمائة {cite:shadharat-dhahab p. 200}."
  en: "Nasir al-Din al-Barinbari (b. ~770) — al-Suyuti's own teacher; taught gratis at the Azhar, lectured, gave fatwas and preached until a stroke paralysed half his body; died Sunday night 11 Rabi' I 832 {cite:shadharat-dhahab p. 200}."
  fr: "Nasir al-Din al-Barinbari (né vers 770 H) — maître d’al-Suyuti lui-même ; il enseigna gratuitement à al-Azhar, donna des cours, rendit des fatwas et prêcha jusqu’à ce qu’une attaque paralyse la moitié de son corps ; mort dans la nuit du dimanche 11 rabi’ I 832 H {cite:shadharat-dhahab p. 200}."
  es: "Nasir al-Din al-Barinbari (n. ~770) — maestro del propio al-Suyuti; enseñó gratuitamente en Azhar, dio conferencias, emitió fatuas y predicó hasta que un derrame cerebral le paralizó la mitad del cuerpo; murió la noche del domingo 11 de Rabi' I de 832 {cita: shadharat-dhahab p. 200}."
  ur: "ناصر الدین البرینباری ⁦(پیدائش ~ 770)⁩ - السیوطی کے اپنے استاد؛ مفت میں اظہر کو پڑھایا گیا، لیکچر دیا، فتوے دیے اور تبلیغ کی یہاں تک کہ ایک فالج نے اس کا آدھا جسم مفلوج کر دیا۔ آپ کا انتقال اتوار کی رات 11 ربیع الثانی 832 ء کو ہوا 200}۔"
