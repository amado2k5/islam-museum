summary:
  ar: "علي بن عمر بن علي الكاتبي القزويني، نجم الدين، ويقال له دبيران، حكيم منطقي من تلاميذ نصير الدين الطوسي، صاحب الشمسية في المنطق وحكمة العين والمفصل في شرح المحصل؛ توفي سنة 675 هـ بحسب الزركلي."
  en: "Ali ibn Umar ibn Ali al-Katibi al-Qazwini, Najm al-Din, called Dabiran, a sage and logician, pupil of Nasir al-Din al-Tusi and author of al-Shamsiyya on logic, Hikmat al-ayn and al-Mufassal, a commentary on al-Muhassal; died 675 AH according to al-Zirikli (1276 or 1277)."
  es: "Ali ibn Umar ibn Ali al-Katibi al-Qazwini, Najm al-Din, llamado Dabiran, fue un sabio y lógico, discípulo de Nasir al-Din al-Tusi y autor de al-Shamsiyya sobre lógica, Hikmat al-ayn y al-Mufassal, un comentario sobre al-Muhassal; murió en el año 675 de la Hégira según al-Zirikli (1276 o 1277)."
  fr: "Ali ibn Umar ibn Ali al-Katibi al-Qazwini, Najm al-Din, dit Dabiran, sage et logicien, élève de Nasir al-Din al-Tusi et auteur d'al-Shamsiyya sur la logique, Hikmat al-ayn et al-Mufassal, un commentaire sur al-Muhassal; mort en 675 AH selon al-Zirikli (1276 ou 1277)."
  ur: "علی ابن عمر بن علی الکتیبی القزوینی، نجم الدین، دبیران، ایک حکیم اور منطق دان، ناصر الدین الطوسی کے شاگرد اور منطق پر الشمسیہ کے مصنف، حکمت العین اور المفصل، تفسیر المحتار؛ ان کی وفات الزرقلی ⁦(1276 یا 1277)⁩ کے مطابق 675 ہجری میں ہوئی۔"
