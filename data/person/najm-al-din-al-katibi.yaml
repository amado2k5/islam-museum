summary:
  ar: "علي بن عمر بن علي الكاتبي القزويني، نجم الدين، ويقال له دبيران، حكيم منطقي من تلاميذ نصير الدين الطوسي، صاحب الشمسية في المنطق وحكمة العين والمفصل في شرح المحصل؛ توفي سنة 675 هـ بحسب الزركلي."
  en: "Ali ibn Umar ibn Ali al-Katibi al-Qazwini, Najm al-Din, called Dabiran, a sage and logician, pupil of Nasir al-Din al-Tusi and author of al-Shamsiyya on logic, Hikmat al-ayn and al-Mufassal, a commentary on al-Muhassal; died 675 AH according to al-Zirikli (1276 or 1277)."
