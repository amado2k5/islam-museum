summary:
  ar: "متحدثة ومربية مجتمعية مسلمة أمريكية في جنوب كاليفورنيا. حصلت على البكالوريوس في الاقتصاد من جامعة كاليفورنيا في إيرفاين ودرست العلوم الإسلامية، وعملت مرشدة مسلمة في جامعة كاليفورنيا بلوس أنجلوس لدى معهد المعرفة، وقدّمت قناة «دبل شوت موكا» على يوتيوب وحاضرت لمعهد يقين."
  en: "American Muslim speaker and community educator in Southern California. She earned a bachelor's degree in Economics from the University of California, Irvine, pursued Islamic studies, served as a Muslim chaplain at UCLA with the Institute of Knowledge, hosted the YouTube channel Double Shot Mocha, and lectures for the Yaqeen Institute."
  ur: "جنوبی کیلیفورنیا میں مقیم امریکی مسلم مقررہ اور سماجی معلمہ۔ انہوں نے یونیورسٹی آف کیلیفورنیا، اروائن سے معاشیات میں بیچلر ڈگری حاصل کی اور اسلامی علوم کی تعلیم پائی، انسٹیٹیوٹ آف نالج کے تحت یو سی ایل اے میں مسلم چیپلن رہیں، یوٹیوب چینل «ڈبل شاٹ موکا» کی میزبانی کی اور یقین انسٹیٹیوٹ کے لیے لیکچر دیتی ہیں۔"
