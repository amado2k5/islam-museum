summary:
  ar: "متحدثة ومربية مجتمعية مسلمة أمريكية في جنوب كاليفورنيا. حصلت على البكالوريوس في الاقتصاد من جامعة كاليفورنيا في إيرفاين ودرست العلوم الإسلامية، وعملت مرشدة مسلمة في جامعة كاليفورنيا بلوس أنجلوس لدى معهد المعرفة، وقدّمت قناة «دبل شوت موكا» على يوتيوب وحاضرت لمعهد يقين."
  en: "American Muslim speaker and community educator in Southern California. She earned a bachelor's degree in Economics from the University of California, Irvine, pursued Islamic studies, served as a Muslim chaplain at UCLA with the Institute of Knowledge, hosted the YouTube channel Double Shot Mocha, and lectures for the Yaqeen Institute."
  ur: "جنوبی کیلیفورنیا میں مقیم امریکی مسلم مقررہ اور سماجی معلمہ۔ انہوں نے یونیورسٹی آف کیلیفورنیا، اروائن سے معاشیات میں بیچلر ڈگری حاصل کی اور اسلامی علوم کی تعلیم پائی، انسٹیٹیوٹ آف نالج کے تحت یو سی ایل اے میں مسلم چیپلن رہیں، یوٹیوب چینل «ڈبل شاٹ موکا» کی میزبانی کی اور یقین انسٹیٹیوٹ کے لیے لیکچر دیتی ہیں۔"
  es: "Oradora musulmana estadounidense y educadora comunitaria en el sur de California. Se licenció en Economía por la Universidad de California, Irvine, cursó estudios islámicos, fue capellana musulmana en la UCLA con el Instituto del Conocimiento, presentó el canal de YouTube Double Shot Mocha e impartió conferencias para el Instituto Yaqeen."
  fr: "Conférencière et animatrice communautaire musulmane américaine en Californie du Sud. Elle est titulaire d'une licence en économie de l'Université de Californie à Irvine, a poursuivi des études islamiques, a été aumônière musulmane à l'UCLA au sein de l'Institut du Savoir, a animé la chaîne YouTube Double Shot Mocha et donne des conférences pour l'Institut Yaqeen."
  tr: "Güney Kaliforniya'da Müslüman Amerikalı bir konuşmacı ve toplum eğitimcisidir. Kaliforniya Üniversitesi, Irvine'dan ekonomi alanında lisans derecesi aldı, İslam bilimleri okudu, Kaliforniya Üniversitesi, Los Angeles'ta Bilgi Enstitüsü'nde Müslüman danışmanı olarak çalıştı, YouTube'da 'Double Shot Mocha' kanalını sundu ve Yaqeen Enstitüsü'nde konferanslar verdi."
  id: "Ia adalah pembicara Muslim Amerika dan pendidik komunitas di California Selatan. Ia meraih gelar sarjana ekonomi dari University of California, Irvine, mempelajari ilmu Islam, bekerja sebagai konselor Muslim di University of California, Los Angeles, di Knowledge Institute, menjadi pembawa acara saluran 'Double Shot Mocha' di YouTube, dan memberikan kuliah di Yaqeen Institute."
