  note: "Born in November 1835 at the Kushmurun fort in the Aman-Karagai district (now Kostanay Province), son of the senior sultan Chingis (Shyngys) Walikhanov and a descendant of Ablai Khan; his given name was Muhammed-Qanafiya, and Shoqan, first his pen name, became his official name. The English and Arabic articles give November 1835, Wikidata carries the same month-precision value, and the Russian article's narrative agrees on 1835. No source read gives a day or a Hijri pairing, so no hijri key is carried; the date is carried in the Gregorian reckoning as the articles give it."
  sources: [source/wikipedia-walikhanov-en, source/wikipedia-walikhanov-ru, source/wikipedia-walikhanov-ar, source/wikidata-walikhanov]
died:
  edtf: "1865-04-10"
  calendar: gregorian
  precision: day
  status: historical
  derived: false
  note: "Died of tuberculosis on 10 April 1865, aged 29, in the village of Sultan Tezek, and was buried in the nearby cemetery of Kochen-Togan (now Almaty Province). The English article gives the day, the Arabic article agrees, and Wikidata carries the same day-precision value beside a stray month-precision October 1865 value that no article supports and that is not followed. No Hijri pairing is attested in the sources read, so no hijri key is carried."
  sources: [source/wikipedia-walikhanov-en, source/wikipedia-walikhanov-ar, source/wikidata-walikhanov]
