summary:
  ar: "عالم وإثنوغرافي ومؤرخ ورحالة كازاخي (نوفمبر 1835 – 10 أبريل 1865)، أول كازاخي يتكوّن في التقليد العلمي الروسي؛ أسّست رحلته إلى كاشغر (1858–1859) ودراساته عن السهوب الكازاخية علمَي التاريخ والإثنوغرافيا الكازاخيين الحديثين."
  en: "Kazakh scholar, ethnographer, historian and traveller (November 1835 – 10 April 1865), the first Kazakh trained in the Russian scholarly tradition; his 1858–59 journey to Kashgar and his studies of the Kazakh steppe founded modern Kazakh historiography and ethnography."
  ur: "قازق عالم، ماہرِ اثنوگرافی، مؤرخ اور سیاح (نومبر 1835ء – 10 اپریل 1865ء)؛ کاشغر کا سفر (1858–59ء) اور قازق میدانوں پر ان کی تحقیقات نے جدید قازق تاریخ نویسی اور اثنوگرافی کی بنیاد رکھی۔"
