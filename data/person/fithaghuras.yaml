  fr: "Célèbre dans l'étude d'al-Mas'udi comme celui qui connaissait des sciences cachées et des sortes de révélation par la pureté de son âme — alors que les premiers philosophes grecs ne niaient pas la divination de façon catégorique {cite:muruj-al-dhahab p. 483}."
