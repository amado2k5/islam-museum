  ar: "اشتهر عند المسعودي أن فيثاغورس كان يعلم علوماً من الغيب وضروباً من الوحي لصفاء نفسه وتجردها من أدران هذا العالم، وأن الأوائل من فلاسفة اليونانية لم يكونوا يدفعون الكهانات {cite:muruj-al-dhahab p. 483}."
