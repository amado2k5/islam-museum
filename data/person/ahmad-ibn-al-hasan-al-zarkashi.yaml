label: { ar: "شهاب الدين ابن الزركشي", en: "Shihab al-Din ibn al-Zarkashi (Ahmad ibn al-Hasan)", fr: "Shihab al-Din ibn al-Zarkashi (Ahmad ibn al-Hasan)", es: "Shihab al-Din ibn al-Zarkashi (Ahmad ibn al-Hasan)", ur: "شہاب الدین ابن الزرقاشی ⁦(احمد بن الحسن)⁩" }
summary:
  ar: "أحمد بن الحسن، المعروف بابن الزركشي، شهاب الدين، فقيه مشارك في بعض العلوم، درس بالمدرسة الحسامية، ومن تصانيفه شرح الهداية، وتوفي سنة 733هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10349}"
  en: "Ahmad ibn al-Hasan, known as Ibn al-Zarkashi, Shihab al-Din: a jurist with a share in several sciences, who taught at the Hasamiyya madrasa. His works include a commentary on al-Hidaya. He died in 733 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10349}"
  fr: "Ahmad ibn al-Hasan, connu comme Ibn al-Zarkashi, Shihab al-Din, juriste possédant une part de plusieurs sciences, enseigna à la madrasa Hasamiyya. Ses œuvres comprennent un commentaire d'al-Hidaya. Il mourut en 733 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10349}"
  es: "Ahmad ibn al-Hasan, conocido como Ibn al-Zarkashi, Shihab al-Din: jurista con conocimientos en diversas ciencias, que impartió clases en la madrasa Hasamiyya. Entre sus obras se incluye un comentario sobre al-Hidaya. Falleció en el año 733 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10349}"
  ur: "احمد بن الحسن، جسے ابن الزرقاشی، شہاب الدین کے نام سے جانا جاتا ہے: متعدد علوم میں حصہ لینے والے ایک فقیہ، جو مدرسہ حسامیہ میں پڑھاتے تھے۔ ان کی تصانیف میں الہدایہ کی تفسیر بھی شامل ہے۔ ان کی وفات 733ھ میں ہوئی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص10349}"
