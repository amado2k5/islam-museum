summary:
  ar: "إسحاق بن إبراهيم الفارابي، لغوي وأديب، خال الجوهري ومعلمه، نسبته إلى فاراب في تركستان، وصاحب «ديوان الأدب». يُخلط أحياناً بينه وبين الفيلسوف أبي نصر الفارابي، وما قيل عن ذهابه إلى اليمن غير صحيح. وتاريخ وفاته غير مؤكد، وقد ذكر السيوطي أنه توفي سنة ٣٥٠هـ، ٩٦١م."
  en: "Ishaq ibn Ibrahim al-Farabi, a philologist and man of letters, uncle and teacher of al-Jawhari, named after Farab in Turkestan, and author of Diwan al-adab. He is sometimes confused with the philosopher Abu Nasr al-Farabi, and the report that he went to Yemen is not correct. His date of death is not certain; al-Suyuti gives 350 AH (961)."
  es: "Ishaq ibn Ibrahim al-Farabi, filólogo y hombre de letras, tío y maestro de al-Jawhari, nombrado por Farab en Turquestán, y autor del Diwan al-adab. A veces se le confunde con el filósofo Abu Nasr al-Farabi, y el relato de que fue a Yemen no es correcto. Su fecha de muerte no es segura; al-Suyuti da 350 AH (961)."
  fr: "Ishaq ibn Ibrahim al-Farabi, philologue et lettré, oncle et maître d'al-Jawhari, nommé d'après Farab au Turkestan, et auteur du Diwan al-adab. On le confond parfois avec le philosophe Abu Nasr al-Farabi, et le récit selon lequel il serait allé au Yémen est inexact. Sa date de décès n'est pas certaine ; al-Suyuti donne 350 AH (961)."
  ur: "اسحاق بن ابراہیم الفارابی، ماہرِ لغت و ادیب، جوہری کے ماموں اور استاد، ترکستان کے فاراب کی نسبت سے مشہور، دیوان الادب کے مصنف۔ بعض اوقات انہیں فلسفی ابو نصر فارابی سے خلط کر دیا جاتا ہے، اور ان کے یمن جانے کی خبر درست نہیں۔ وفات کی تاریخ یقینی نہیں؛ سیوطی نے 350ھ ⁦(961ء)⁩ بتائی ہے۔"
  tr: "İshaq ibn İbrahim el-Farabi, dilbilimci ve edebi figür, Türkistan'da Farab'a atfedilen ve el-Cevaheri'nin annesinin kardeşi ve öğretmeni, ayrıca 'Diwan al-Adab'ın yazarıdır. Bazen filozof Ebu Nasr el-Farabi ile karıştırılır ve Yemen'e yaptığı yolculuk hakkında söylenenler doğru değildir. Ölüm tarihi kesin değildir ve el-Süyuti, onun 350 Hicri 961 yılında öldüğünü belirtmiştir."
  id: "Ishaq ibn Ibrahim al-Farabi, ahli bahasa dan tokoh sastra, paman dari pihak ibu dan guru al-Jawhari, yang dikaitkan dengan Farab di Turkestan, serta penulis 'Diwan al-Adab'. Ia kadang-kadang disalahartikan dengan filsuf Abu Nasr al-Farabi, dan apa yang dikatakan tentang perjalanannya ke Yaman tidak benar. Tanggal kematiannya tidak pasti, dan al-Suyuti menyebutkan bahwa ia meninggal pada tahun 350 H, 961 M."
