summary:
  ar: "مالك كافور ⁦(ت 1316)⁩ خصيّ من أصل هندوسي اشتراه خواجة في كمبهات وأُسر في غزو غوجارات سنة 1299 فأسلم، وصار قائد سلطان دهلي علاء الدين الخلجي الذي صدّ به المغول وفتح الدكن، ثم نائبه ⁦(الوكيل)⁩ بعد 1315، إلى أن اغتاله حراس السلطان القدامى في فبراير 1316."
  en: "Malik Kafur (died 1316) was a eunuch of Hindu descent, a slave of a Khwaja of Khambhat, who was captured in the 1299 invasion of Gujarat and converted to Islam; he became the general of the Delhi sultan Alauddin Khalji, defeating the Mongols and conquering in the Deccan, then his viceroy (na'ib) from 1315, until the sultan's former bodyguards assassinated him in February 1316."
  ur: "ملک کافور (وفات 1316ء) ہندو نژاد خواجہ سرا غلام تھے جو کھمبات کے ایک خواجہ کے پاس تھے، 1299ء میں گجرات کی مہم میں پکڑے گئے اور اسلام قبول کیا؛ وہ دہلی کے سلطان علاؤ الدین خلجی کے سپہ سالار بنے، منگولوں کو شکست دی اور دکن میں فتوحات کیں، پھر 1315ء سے نائب رہے، یہاں تک کہ فروری 1316ء میں سلطان کے پرانے محافظوں نے انہیں قتل کر دیا۔"
