label:
  ar: قبلاي بن طولي
  en: Qubilai Khan ibn Tolui
summary:
  ar: "قبلاي بن طولي بن جنكزخان؛ بعثه أخوه منكوفان مع أخيهم هلاكو لغزو بلاد الخطا، وولي الخانات بعد أخيه أربيكان، وفي أعقابه ملوك: دمرفاي وتربى كيزي وكيزقان وسندمرقان بن طرمالا بن جنكمر."
  en: "Qubilai ibn Tolui ibn Genghis Khan; his brother Monke sent him with their brother Hulagu against the land of Khita, and he held the khanate after their brother Ariq Boke — in his line followed Tarmashirin's house and the kings Darmfay, Tarba Kizi, Kizqan and Sandmarqan ibn Tarmala ibn Jankmar."
