summary:
  ar: بطاقة أولية لمحمد الأمين، سادس خلفاء بني العباس وخصم المأمون في الفتنة، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم
    تُراجع ترجمته في تاريخ الخلفاء والكامل لابن الأثير على الصفحة بعد، لذلك لا تُذكر هنا تواريخ.
  en: Draft card for Muhammad al-Amin, sixth Abbasid caliph and al-Ma'mun's rival in the civil war, named from an open reference
    description (Wikidata); his entries in Tarikh al-Khulafa and Ibn al-Athir's al-Kamil are not yet checked on the page,
    so no dates are given.
  fr: "Notice provisoire de Muhammad al-Amin, sixième calife abbasside et rival d’al-Ma’mun dans la guerre civile, identifié d’après une description de référence ouverte (Wikidata) ; ses notices dans Tarikh al-Khulafa et al-Kamil d’Ibn al-Athir n’ont pas encore été vérifiées sur la page, aussi aucune date n’est-elle donnée."
  es: "Ficha de borrador para Muhammad al-Amin, sexto califa abasí y rival de al-Ma'mun en la guerra civil, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); sus entradas en Tarikh al-Khulafa y al-Kamil de Ibn al-Athir aún no se han verificado en la página, por lo que no se proporcionan fechas."
  ur: "خانہ جنگی میں محمد الامین، چھٹے عباسی خلیفہ اور المامون کے حریف کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ سے بیان کیا گیا ہے ⁦(وکی ڈیٹا)⁩؛ تاریخ الخلفاء اور ابن اثیر کے الکامل میں ان کے اندراجات کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Altıncı Abbasi halifesi ve Fitne sırasında el-Ma'mun'un rakibi olan Muhammed el-Amin'in ön profili, açık bir referans açıklamasında (Wikidata) bulunmaktadır. Tarikh al-Khulafa' ve İbn al-Athir'in el-Kamil adlı eserlerindeki biyografisi bu sayfada henüz incelenmediğinden, burada tarih verilmemiştir."
  id: "Profil awal Muhammad al-Amin, khalifah Abbasiyah keenam dan lawan al-Ma'mun selama Fitnah, dapat ditemukan dalam deskripsi referensi terbuka (Wikidata). Biografinya dalam Tarikh al-Khulafa' dan al-Kamil karya Ibn al-Athir belum ditinjau di halaman ini, oleh karena itu tidak ada tanggal yang diberikan di sini."
