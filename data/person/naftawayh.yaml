summary:
  ar: "النحوي صاحب كتاب تاريخ الخلفاء في مجلدين انتهى إلى أيام القاهر. وعدّه المسعودي فيمن جمعوا ألفاظ النبي في كتبهم مع ابن دريد والزجاجي وجعفر بن محمد بن حمدان الموصلي {cite:muruj-al-dhahab p. 594}"
  en: "the grammarian, author of a two-volume caliph history ending in al-Qahir's days."
  es: "El gramático, autor de una historia de los califas en dos volúmenes que culmina en la época de al-Qahir."
  fr: "le grammairien, auteur d'une histoire du calife en deux volumes s'achevant à l'époque d'al-Qahir."
  ur: "گرامر، دو جلدوں پر مشتمل خلیفہ تاریخ کا مصنف جو القاہیر کے دنوں میں ختم ہوتا ہے۔"
  tr: "Dilbilgici, 'Tarikh al-Khulafa' adlı iki ciltlik kitabın yazarı ve bu kitap el-Kahir dönemine kadar uzandı. Al-Mas'udi, onu Peygamber'in sözlerini kitaplarında toplayanlar arasında saydı; İbn Duraid, al-Zajcaji ve Ja'far ibn Muhammed ibn Hamdan al-Mawsili {atı: muruj-al-dhahab, s. 594}"
  id: "Ahli tata bahasa, penulis buku 'Tarikh al-Khulafa' dalam dua jilid yang terbit pada masa al-Qahir. Al-Mas'udi menganggapnya sebagai salah satu yang mengumpulkan kata-kata Nabi dalam kitab-kitab mereka bersama Ibn Duraid, al-Zajjaji, dan Ja'far ibn Muhammad ibn Hamdan al-Mawsili {cite:muruj-al-dhahab, hlm. 594}"
