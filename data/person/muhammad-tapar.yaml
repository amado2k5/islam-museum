summary:
  ar: "السلطان السلجوقي غياث الدين أبو شجاع، كان فارساً شجاعاً فحلاً ذا برو معروف، استقل بالملك بعد موت أخيه بركياروق وقد تمت لهما حروب عديدة، توفي في ذي الحجة سنة إحدى عشرة وخمس مئة بأصبهان ودفن في مدرسة عظيمة للحنفية وقام بعده ابنه محمود ابن أربع عشرة سنة وخلف أربعة قد ونوا السلطنة محمود ومسعود وطغرلبك وسليمان شاه؛ ولما بلغ موته نرحلت العساكر عن حصار الباطنية بألموت {cite:shadharat-dhahab p. 505}."
  en: "The Saljuq sultan Ghiyath al-Din Abu Shuja' Muhammad Tapar — a famous brave champion who won the crown from his brother Barkiyaruq after long wars; he died at Isfahan in Dhu l-Hijja 511, buried in a great Hanafi madrasa, leaving four sons who became sultans; the Alamut siege was lifted at the news {cite:shadharat-dhahab p. 505}."
