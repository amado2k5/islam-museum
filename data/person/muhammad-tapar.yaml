names:
  - { value: "غياث الدين أبو شجاع محمد بن ملكشاه بن ألب أرسلان", kind: full }
gender: male
summary:
  ar: "السلطان السلجوقي غياث الدين أبو شجاع، كان فارساً شجاعاً فحلاً ذا برو معروف، استقل بالملك بعد موت أخيه بركياروق وقد تمت لهما حروب عديدة، توفي في ذي الحجة سنة إحدى عشرة وخمس مئة بأصبهان ودفن في مدرسة عظيمة للحنفية وقام بعده ابنه محمود ابن أربع عشرة سنة وخلف أربعة قد ونوا السلطنة محمود ومسعود وطغرلبك وسليمان شاه؛ ولما بلغ موته نرحلت العساكر عن حصار الباطنية بألموت {cite:shadharat-dhahab p. 505}."
  en: "The Saljuq sultan Ghiyath al-Din Abu Shuja' Muhammad Tapar — a famous brave champion who won the crown from his brother Barkiyaruq after long wars; he died at Isfahan in Dhu l-Hijja 511, buried in a great Hanafi madrasa, leaving four sons who became sultans; the Alamut siege was lifted at the news {cite:shadharat-dhahab p. 505}."
  es: "El sultán selyúcida Ghiyath al-Din Abu Shuja' Muhammad Tapar, un famoso y valiente campeón que ganó la corona a su hermano Barkiyaruq después de largas guerras; murió en Isfahán en Dhu l-Hijja 511, enterrado en una gran madrasa hanafi, dejando cuatro hijos que se convirtieron en sultanes; el asedio de Alamut fue levantado con la noticia {cite:shadharat-dhahab p. 505}."
  fr: "Le sultan seldjoukide Ghiyath al-Din Abu Shuja' Muhammad Tapar — un célèbre et courageux champion qui a remporté la couronne de son frère Barkiyaruq après de longues guerres; il est mort à Ispahan en Dhu l-Hijja 511, enterré dans une grande madrasa hanafite, laissant quatre fils qui sont devenus sultans; le siège d'Alamut a été levé à la nouvelle {cite:shadharat-dhahab p. 505}."
  ur: "سلجوق سلطان غیاث الدین ابو شجاع محمد ٹپر - ایک مشہور بہادر چیمپئن جس نے طویل جنگوں کے بعد اپنے بھائی برقیاروق سے تاج حاصل کیا۔ اس کا انتقال ذی الحجہ 511 میں اصفہان میں ہوا، ایک عظیم حنفی مدرسہ میں دفن ہوئے، ان کے چار بیٹے ہیں جو سلطان بنے؛ الموت کا محاصرہ اس خبر پر اٹھایا گیا تھا 505}۔"
  tr: "Selçuklu Sultanı Ghiyath al-Din Ebu Şuca', tanınmış bir üne sahip cesur bir şövalyeydi. Kardeşi Barkiyaruk'un ölümünden sonra bağımsızlığını kazandı. Birçok savaşta savaştılar. 510 Hicri yılında İsfahan'da Dhu al-Hijjah'da öldü ve büyük bir Hanefi okuluna defnedildi. Yerine on dört yaşındaki oğlu Mahmud geçti ve sultanlığı yöneten dört kişi geride bıraktı: Mahmud, Mesud, Tuğril Beg ve Süleyman Şah. O öldüğünde, askerler Alümüt'teki El-Batiniye kuşatmasından çekildi {cite:shadharat-dhahab, s. 505}."
  id: "Sultan Seljuk Ghiyath al-Din Abu Shuja' adalah seorang ksatria pemberani dengan reputasi terkenal. Ia merdeka setelah kematian saudaranya Barkiyaruk. Mereka berperang dalam banyak perang. Ia meninggal di Dhu al-Hijjah pada tahun 510 H di Isfahan dan dimakamkan di sebuah sekolah Hanafi yang besar. Ia digantikan oleh putranya Mahmud, yang berusia empat belas tahun, dan meninggalkan empat orang yang memerintah kesultanan: Mahmud, Mas'ud, Tughril Beg, dan Suleiman Shah. Ketika ia meninggal, para tentara mundur dari pengepungan Al-Batiniyah di Alamut {cite:shadharat-dhahab, hlm. 505}."
