summary:
  ar: "عبد الله بن عون ابن أمير مصر الهلالي البغدادي، أبو محمد الأدمي الخراز، روى عنه مسلم ووثقه ابن معين والدارقطني؛ توفي سنة 232 هـ كما يذكر الصفدي في الوافي."
  en: "Abdallah ibn Awn al-Kharraz al-Baghdadi, Abu Muhammad, a hadith narrator from whom Muslim narrated and whom Ibn Ma'in and al-Daraqutni held reliable; died 232 AH according to al-Safadi's al-Wafi."
  fr: "Abdallah ibn Awn al-Kharraz al-Baghdadi, Abu Muhammad, transmetteur de hadith dont Muslim transmit et qu'Ibn Ma'in et al-Daraqutni tenaient pour fiable ; mort en 232 H selon al-Wafi d'al-Safadi."
  es: "Abdallah ibn Awn al-Kharraz al-Baghdadi, Abu Muhammad, un narrador de hadices del que Muslim narró y a quien Ibn Ma'in y al-Daraqutni consideraron fiable; murió en el año 232 AH según al-Wafi de al-Safadi."
  ur: "عبداللہ بن عون الخرز البغدادی، ابو محمد، ایک حدیث کے راوی جن سے مسلم نے روایت کی ہے اور جسے ابن معین اور الدارقطنی نے معتبر قرار دیا ہے۔ سفادی کی الوفی کے مطابق 232ھ میں وفات پائی۔"
