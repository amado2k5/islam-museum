  id: "Abdul Aziz bin Ahmed Al-Halwani Al-Bukhari, “Shams Al-A’immah,” Imam para ulama di Bukhara pada masanya, wafat pada tahun 448 H (1056 M), penulis kitab “Al-Mabsut” dan “Al-Nawadir.”"
