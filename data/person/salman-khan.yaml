summary:
  ar: "ممثل ومنتج ومقدّم هندي (وُلد سنة 1965) في إندور، ابن كاتب السيناريو سليم خان، بدأ سنة 1988 وبرز مع «ميني بيار كيا» (1989) ليصير من أكبر نجوم السينما الهندية، وأسّس مؤسسة «بينغ هيومان» الخيرية، ويقدّم برنامج «بيغ بوس» منذ سنة 2010."
  en: "Indian actor, producer and television presenter (born 1965) at Indore, son of the screenwriter Salim Khan; he debuted in 1988, broke through with Maine Pyar Kiya (1989), became one of Hindi cinema's biggest stars, founded the Being Human charitable foundation and has hosted Bigg Boss since 2010."
  ur: "بھارتی اداکار، فلم ساز اور ٹیلی ویژن میزبان (پیدائش 1965) جو اندور میں پیدا ہوئے، منظر نویس سلیم خان کے بیٹے ہیں؛ 1988 میں آغاز کیا، «میں نے پیار کیا» (1989) سے شہرت پائی، ہندی سنیما کے بڑے ستاروں میں شمار ہوئے، فلاحی ادارہ «بینگ ہیومن» قائم کیا اور 2010 سے «بگ باس» کی میزبانی کر رہے ہیں۔"
