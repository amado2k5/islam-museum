summary:
  ar: "ممثل ومنتج ومقدّم هندي ⁦(وُلد سنة 1965)⁩ في إندور، ابن كاتب السيناريو سليم خان، بدأ سنة 1988 وبرز مع «ميني بيار كيا» (1989) ليصير من أكبر نجوم السينما الهندية، وأسّس مؤسسة «بينغ هيومان» الخيرية، ويقدّم برنامج «بيغ بوس» منذ سنة 2010."
  en: "Indian actor, producer and television presenter (born 1965) at Indore, son of the screenwriter Salim Khan; he debuted in 1988, broke through with Maine Pyar Kiya (1989), became one of Hindi cinema's biggest stars, founded the Being Human charitable foundation and has hosted Bigg Boss since 2010."
  ur: "بھارتی اداکار، فلم ساز اور ٹیلی ویژن میزبان ⁦(پیدائش 1965)⁩ جو اندور میں پیدا ہوئے، منظر نویس سلیم خان کے بیٹے ہیں؛ 1988 میں آغاز کیا، «میں نے پیار کیا» (1989) سے شہرت پائی، ہندی سنیما کے بڑے ستاروں میں شمار ہوئے، فلاحی ادارہ «بینگ ہیومن» قائم کیا اور 2010 سے «بگ باس» کی میزبانی کر رہے ہیں۔"
  es: "Actor, productor y presentador de televisión indio (nacido en 1965) en Indore, hijo del guionista Salim Khan; debutó en 1988, alcanzó la fama con Maine Pyar Kiya (1989), se convirtió en una de las mayores estrellas del cine hindi, fundó la fundación benéfica Being Human y ha presentado Bigg Boss desde 2010."
  fr: "Acteur, producteur et présentateur de télévision indien (né en 1965) à Indore, fils du scénariste Salim Khan; il a fait ses débuts en 1988, a percé avec Maine Pyar Kiya (1989), est devenu l'une des plus grandes stars du cinéma hindi, a fondé la fondation caritative Being Human et anime Bigg Boss depuis 2010."
  tr: "Hintli oyuncu, yapımcı ve sunucu (1965 doğumlu) olan Hintli, senarist Salim Khan'ın oğlu olan Khan, 1988'de başladı ve 'Mini Pier Kia' (1989) ile ün kazanarak Hint sinemasının en büyük yıldızlarından biri oldu. 'Bing Human' hayır kurumunu kurdu ve 2010'dan beri 'Big Boss' programını sunuyor."
  id: "Seorang aktor, produser, dan presenter India (lahir tahun 1965) di Indore, putra penulis skenario Salim Khan, ia memulai kariernya pada tahun 1988 dan naik ke puncak karier lewat 'Mini Pier Kia' (1989), menjadi salah satu bintang terbesar sinema India. Ia mendirikan badan amal 'Bing Human' dan telah menjadi pembawa acara acara 'Big Boss' sejak tahun 2010."
