summary:
  ar: "أستاذ قانون سوداني أمريكي بجامعة إيموري، وُلد سنة 1946، من أبرز منظّري حقوق الإنسان والإصلاح القانوني الإسلامي من الداخل. يدافع عن دولة علمانية بأساس دستوري، ومن كتبه «نحو إصلاح إسلامي» و«الإسلام والدولة العلمانية»."
  en: "Sudanese-American law professor at Emory University, born in 1946, a leading theorist of human rights and internal Islamic legal reform. He advocates a secular state on constitutional grounds, authoring Toward an Islamic Reformation and Islam and the Secular State."
  ur: "ایموری یونیورسٹی میں سودانی نژاد امریکی قانون کے پروفیسر، 1946 میں پیدا ہوئے اور انسانی حقوق و اندرونی اسلامی قانونی اصلاح کے ممتاز نظریہ ساز۔ وہ آئینی بنیادوں پر سیکولر ریاست کے وکیل ہیں؛ کتب میں Toward an Islamic Reformation اور Islam and the Secular State شامل ہیں۔"
  fr: "Professeur de droit soudano-américain à l'université Emory, né en 1946, l'un des principaux théoriciens des droits humains et de la réforme juridique islamique interne. Il défend un État séculier sur des bases constitutionnelles, et il est l'auteur de Toward an Islamic Reformation et d'Islam and the Secular State."
