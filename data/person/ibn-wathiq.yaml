summary:
  ar: "شيخ القراء المجوّد الحاذق؛ قرأ القراءات السبع بغزة وغيرها سنة خمس وتسعين على غير واحد من أصحاب أبي الحسن شريح، وأجاز له أبو عبد الله ابن زرقون فروى عنه التيسير بالإجازة، وأقرأ بالموصل والشام ومصر وكان عالي الإسناد {cite:shadharat-dhahab p. 272}."
  en: "Shaykh al-qurra' (b. 567, d. Alexandria Rabi' II 654) — read the seven qira'at at Ghaza on Shurayh's pupils, transmitted al-Taysir from Ibn Zarqun, and taught at Mosul, Syria and Egypt on a towering isnad {cite:shadharat-dhahab p. 272}."
  es: "Shaykh al-qurra' (n. 567, m. Alejandría Rabi' II 654) — leyó las siete qira'at en Ghaza sobre los discípulos de Shurayh, transmitió al-Taysir de Ibn Zarqun y enseñó en Mosul, Siria y Egipto sobre un isnad imponente {cite:shadharat-dhahab p. 272}."
  fr: "Cheikh al-qurra' (né en 567, mort à Alexandrie en Rabi' II 654) — a lu les sept qira'at à Ghaza sur les élèves de Shurayh, a transmis al-Taysir d'Ibn Zarqun et a enseigné à Mossoul, en Syrie et en Égypte sur un isnad imposant {cite:shadharat-dhahab p. 272}."
  ur: "شیخ القراء ⁦(متوفی 567، وفات اسکندریہ ربیع دوم 654)⁩ - شریح کے شاگردوں پر غزہ میں سات قیراط پڑھے، ابن زرقون سے الطیسر نقل کی، اور موصل، شام اور مصر میں ایک بلند اسناد پر پڑھایا۔ 272}۔"
  tr: "Usta ve yetenekli şiyacıların ustası; doksan beşinci yılda Gazze ve başka yerlerde Ebu el-Hasan Şurayh'ın birden fazla sahabesiyle birlikte yedi okumayı okudu. Ebu Abdullah ibn Zerqun ona yetki verdi ve el-Teysir ona icazah ile rivayet etti. Musul, Levant ve Mısır'da okudu ve yüksek bir aktarım zinciri vardı {cite:shadharat-dhahab, s. 272}."
  id: "Ahli para pembaca yang terampil dan terampil; ia membacakan tujuh bacaan di Gaza dan tempat lain pada tahun sembilan puluh lima bersama lebih dari satu sahabat Abu al-Hasan Shurayh. Abu Abdullah ibn Zarqun mengizinkannya, dan al-Taysir menceritakan darinya melalui Ijazah. Ia membacakan di Mosul, Levant, dan Mesir, dan ia memiliki rangkaian transmisi yang tinggi {cite:shadharat-dhahab, hlm. 272}."
