  es: "Periodista y presentador pakistaní nacido en Lahore en 1966; presentador del programa Capital Talk de Geo TV desde 2002, ha entrevistado a figuras mundiales como Osama bin Laden antes de 2001, Musharraf y Kerry, sobrevivió a un intento de asesinato en 2014 y ha ganado premios internacionales a la libertad de prensa."
  fr: "Journaliste et animateur pakistanais né à Lahore en 1966; présentateur de l'émission Capital Talk sur Geo TV depuis 2002, il a interviewé des personnalités mondiales, dont Oussama ben Laden avant 2001, Musharraf et Kerry, a survécu à une tentative d'assassinat en 2014 et a remporté des prix internationaux pour la liberté de la presse."
