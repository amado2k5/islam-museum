summary:
  ar: صحفي ومذيع باكستاني وُلد سنة 1966 في لاهور؛ مقدم برنامج «كابيتال توك» على قناة جيو منذ 2002، حاور قادة عالميين منهم بن لادن قبل 2001 ومشرف وكيري، ونجا من محاولة اغتيال سنة 2014، ونال جوائز دولية لحرية
