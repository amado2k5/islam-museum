  en: Pakistani journalist and host born in Lahore in 1966; presenter of Geo TV's Capital Talk since 2002, he has interviewed world figures including Osama bin Laden before 2001, Musharraf and Kerry, survived
    an assassination attempt in 2014, and won international press-freedom awards.
