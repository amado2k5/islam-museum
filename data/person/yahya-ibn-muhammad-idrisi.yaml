summary:
  ar: "يحيى بن محمد بن إدريس بن إدريس الحسني، ملك من الأدارسة وعاصمته فاس، ولي بعد وفاة أخيه علي سنة ٢٣٤هـ بعهد منه، وحسنت سيرته وأحب العمران، وفي أيامه بني جامع القرويين، وتوفي بفاس سنة ٢٥٠هـ الموافقة ٨٦٤م."
  en: "Yahya ibn Muhammad ibn Idris ibn Idris al-Hasani, an Idrisid king whose capital was Fez; he took power after the death of his brother Ali in 234 AH by Ali's designation, was of good conduct and fond of building, saw the Qarawiyyin mosque built in his days and died in Fez in 250 AH, 864 CE."
