summary:
  ar: "أبو جعفر محمد بن عمرو العقيلي، الحافظ، يذكره ابن العماد صاحب «الجرح والتعديل» ويعده في أهل الحجاز، روى عن إسحاق الدبري وأبي إسماعيل الترمذي، وتوفي بمكة في ربيع الأول سنة 322 هـ."
  en: "Abu Ja'far Muhammad ibn Amr al-Uqayli, the hadith master; Ibn al-Imad calls him the author of al-Jarh wa-l-Ta'dil and counts him among the people of the Hijaz; he transmitted from Ishaq al-Dabari and Abu Isma'il al-Tirmidhi and died in Mecca in Rabi' I 322 AH (934)."
  fr: "Abu Ja'far Muhammad ibn Amr al-Uqayli, le maître du hadith ; Ibn al-Imad le dit auteur d'al-Jarh wa-l-Ta'dil et le compte parmi les gens du Hijaz ; il transmit d'Ishaq al-Dabari et d'Abu Isma'il al-Tirmidhi et mourut à La Mecque en rabi' I 322 H (934)."
  es: "Abu Ja'far Muhammad ibn Amr al-Uqayli, el maestro de hadices; Ibn al-Imad lo llama el autor de al-Jarh wa-l-Ta'dil y lo cuenta entre la gente del Hiyaz; transmitió de Ishaq al-Dabari y Abu Isma'il al-Tirmidhi y murió en La Meca en Rabi' I 322 AH (934)."
  ur: "ابو جعفر محمد بن عمرو عقیلی، محدث حدیث؛ ابن عماد نے اسے الجرح والتعدیل کا مصنف کہا ہے اور اسے اہل حجاز میں شمار کیا ہے۔ اس نے اسحاق الطبری اور ابو اسماعیل ترمذی سے نقل کیا اور ربیع الثانی 322ھ (934) میں مکہ میں وفات پائی۔"
  tr: "Ezberci Ebu Cafer Muhammed ibn Amr el-Ukayli, “el-Cerh ve el-Tadil” adlı eserin yazarı İbn el-İmad tarafından anılmış ve Hicaz halkı arasında sayılmıştır. İshak el-Dabri ve Ebu İsmail el-Tirmizi'den rivayet etmiş olup, Hicri 322 yılında Rebiü'l-Evvel ayında Mekke'de vefat etmiştir."
  id: "Abu Ja'far Muhammad ibn Amr al-`Uqayli, seorang penghafal, disebutkan oleh Ibn al-`Imad, penulis kitab “al-Jarh wa al-Ta`dil,” dan beliau memasukkannya ke dalam golongan penduduk Hijaz. Beliau meriwayatkan dari Ishaq al-Dabri dan Abu Ismail al-Tirmidhi, dan beliau wafat di Mekah pada bulan Rabi' al-Awwal tahun 322 Hijriah."
