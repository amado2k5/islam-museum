label: { ar: "محمد حمزة إسماعيل الحداد", en: "Muhammad Hamza Isma'il al-Haddad", es: "Muhammad Hamza Isma'il al-Haddad", fr: "Muhammad Hamza Isma'il al-Haddad", ur: "محمد حمزہ اسماعیل الحداد" }
summary:
  ar: "أستاذ العمارة والآثار والحضارة الإسلامية بكلية الآثار في جامعة القاهرة، ومؤلف سلسلة «العمارة الإسلامية في الجزيرة العربية» ومنها كتاب الأسبلة بمكة والمدينة (2004) {cite:haddad-asbila-makka-madina-2004 title page}."
  en: "Professor of Islamic architecture, archaeology and civilisation at the Faculty of Archaeology, Cairo University, author of the series Islamic Architecture in the Arabian Peninsula, including its volume on the sabils of Mecca and Medina (2004) {cite:haddad-asbila-makka-madina-2004 title page}."
  es: "Profesor de arquitectura, arqueología y civilización islámicas en la Facultad de Arqueología de la Universidad de El Cairo, autor de la serie Arquitectura islámica en la península arábiga, incluido su volumen sobre los sabils de La Meca y Medina (2004) {cite:haddad-asbila-makka-madina-2004 title page}."
  fr: "Professeur d'architecture islamique, d'archéologie et de civilisation à la Faculté d'archéologie de l'Université du Caire, auteur de la série Architecture islamique dans la péninsule arabique, y compris son volume sur les sabils de La Mecque et de Médine (2004) {cite:haddad-asbila-makka-madina-2004 title page}."
  ur: "قاہرہ یونیورسٹی کی فیکلٹی آف آرکیالوجی میں اسلامی فن تعمیر، آثار قدیمہ اور تہذیب کے پروفیسر، جزیرہ نما عرب میں اسلامی فن تعمیر کے مصنف، مکہ اور مدینہ کے سبیلوں پر اس کے حجم سمیت (2004) {حوالہ:حداد-اصبیلہ-مکّہ-مدینہ-2004} عنوان صفحہ۔"
  tr: "Kahire Üniversitesi Arkeoloji Fakültesi'nde Mimarlık, Arkeoloji ve İslam Medeniyeti Profesörü ve \"Arap Yarımadasında İslami Mimari\" dizisinin yazarıdır; bu seri \"Mekke ve Medine'deki Abils\" (2004) {cite:haddad-asbila-makka-madina-2004 başlık sayfası} adlı kitabı içerir."
  id: "Profesor Arsitektur, Arkeologi, dan Peradaban Islam di Fakultas Arkeologi Universitas Kairo, serta penulis seri \"Arsitektur Islam di Semenanjung Arab,\" termasuk buku \"The Abils in Mecca and Medina (2004) {cite:haddad-asbila-makka-madina-2004 halaman judul}.\""
