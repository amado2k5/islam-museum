summary:
  en: "Daughter of the caliph Uthman, remembered for eloquence and rhetoric: when her father was killed and Ali was given allegiance she delivered a long rebuke of the killers, defending Uthman's right and denouncing the turn to Ali and then to Umar's line of rule."
  fr: "Fille du calife Uthman, connue pour son éloquence et sa rhétorique : après le meurtre de son père et l’allégeance prêtée à Ali, elle prononça une longue réprimande contre les meurtriers, défendant les droits d’Uthman et dénonçant le ralliement à Ali, puis au mode de gouvernement d’Umar."
  ar: "ابنة عثمان بن عفان؛ وُصفت بأنها من ربات الفصاحة والبلاغة، فلما قُتل أبوها وبويع عليّ ألقت خطبة طويلة أنكر فيها على القتلة سفك الحمى، وذكرت ما أعطى الله عثمان من حجة ومن نصرة المسلمة، ثم انتقدت التحول إلى علي ثم إلى ما جاء بعده من ولاية عمر وأبنائه."
  es: "Hija del califa Uthman, recordada por su elocuencia y retórica: cuando su padre fue asesinado y Ali recibió lealtad, pronunció una larga reprimenda contra los asesinos, defendiendo el derecho de Uthman y denunciando el giro hacia Ali y luego hacia la línea de gobierno de Umar."
  ur: "خلیفہ عثمان کی بیٹی، فصاحت و بلاغت کے لیے یاد کی جاتی ہے: جب اس کے والد کو قتل کر دیا گیا اور علی کی بیعت ہوئی تو اس نے قاتلوں کی ایک لمبی سرزنش کی، عثمان کے حق کا دفاع کیا اور علی کی طرف اور پھر عمر کی حکمرانی کی طرف رجوع کرنے کی مذمت کی۔"
  tr: "Osman ibn Affan'ın kızı; en güzel konuşan ve en etkili kadınlardan biri olarak tanımlanmıştır. Babası öldürüldüğünde ve Ali'ye biat edildiğinde, uzun bir konuşma yaparak kan döken katilleri kınamış ve Allah'ın Osman'a Müslüman kadın için verdiği delil ve desteği dile getirmiştir. Daha sonra Ali'ye ve ondan sonra gelen Ömer ve oğullarının yönetimine yönelik eleştirilerde bulunmuştur."
  id: "Putri Utsman bin Affan; ia digambarkan sebagai salah satu wanita yang paling fasih dan pandai berbicara. Ketika ayahnya terbunuh dan Ali diikrarkan sumpah setia, ia menyampaikan pidato panjang di mana ia mengecam para pembunuh karena menumpahkan darah, dan menyebutkan apa yang telah diberikan Tuhan kepada Utsman sebagai bukti dan dukungan bagi wanita Muslim. Kemudian ia mengkritik peralihan kekuasaan kepada Ali dan kemudian kepada pemerintahan Umar dan putra-putranya setelahnya."
