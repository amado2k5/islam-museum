summary:
  ar: "مفتي عام كوسوفو ورئيس مشيختها، وُلد في 7 يناير 1961 في قرية لسمير ببلدية فوشه كوسوفا. تخرّج في جامعة الأزهر سنة 1984، ودرّس في مدرسة علاء الدين في بريشتينا ثم ترأسها، وانتُخب رئيسًا للمجلس الإسلامي في كوسوفو سنة 1999، ثم مفتيًا عامًّا في 15 أكتوبر 2003 وأعيد انتخابه سنة 2008."
  en: "Grand Mufti of Kosovo and president of its Islamic Community, born on 7 January 1961 in the village of Lismir in the municipality of Fushe Kosova. A 1984 graduate of al-Azhar, he taught at and later directed the Alauddin Madrasa in Pristina, was elected president of the Islamic Community's assembly in 1999, then Grand Mufti on 15 October 2003, and was re-elected in 2008."
  ur: "کوسوو کے مفتیِ اعظم اور اسلامی کمیونٹی کے صدر، 7 جنوری 1961 کو فوشیز کوسوا کے گاؤں لسمیر میں پیدا ہوئے۔ 1984 میں الازہر سے فارغ التحصیل ہوئے، پریشتینہ کی مدرسہ علاؤالدین میں تدریس اور پھر اس کی انتظامیہ سنبھالی، 1999 میں اسمبلی کے صدر منتخب ہوئے، پھر 15 اکتوبر 2003 کو مفتیِ اعظم چنے گئے اور 2008 میں دوبارہ منتخب ہوئے۔"
  es: "Gran Muftí de Kosovo y presidente de su Comunidad Islámica, nació el 7 de enero de 1961 en la aldea de Lismir, en el municipio de Fushe Kosova. Graduado de al-Azhar en 1984, impartió clases y posteriormente dirigió la madrasa Alauddin en Pristina, fue elegido presidente de la asamblea de la Comunidad Islámica en 1999, luego Gran Muftí el 15 de octubre de 2003, y fue reelegido en 2008."
  fr: "Grand Mufti du Kosovo et président de sa Communauté islamique, né le 7 janvier 1961 dans le village de Lismir, dans la municipalité de Fushe Kosova. Diplômé d'Al-Azhar en 1984, il a enseigné puis dirigé la madrasa Alauddin de Pristina. Élu président de l'assemblée de la Communauté islamique en 1999, puis Grand Mufti le 15 octobre 2003, il a été réélu en 2008."
  tr: "Kosova Büyük Müftüsü ve şeyhliğinin başı olan Scully, 7 Ocak 1961'de Kosova'nın Foše belediyesine bağlı Lesmir köyünde doğdu. 1984 yılında El-Ezher Üniversitesi'nden mezun oldu, Priştine'deki Aladdin Okulu'nda eğitim gördü, ardından okulun başkanlığını yaptı, 1999'da Kosova İslam Konseyi başkanı seçildi, ardından 15 Ekim 2003'te Büyük Müftü oldu ve 2008'de yeniden seçildi."
  id: "Mufti Agung Kosovo dan kepala sheikhdom-nya, ia lahir pada 7 Januari 1961 di desa Lesmir di kotamadya Foše, Kosovo. Ia lulus dari Universitas Al-Azhar pada tahun 1984, belajar di Sekolah Aladdin di Pristina, kemudian memimpin sekolah tersebut, terpilih sebagai presiden Dewan Islam di Kosovo pada tahun 1999, kemudian menjadi Mufti Agung pada 15 Oktober 2003, dan terpilih kembali pada tahun 2008."
