summary:
  ar: "أبو بكر محمد بن عبد الباقي الأنصاري قاضي المرستان؛ جده عَمْرُ بني كعب بن مالك الأنصاري، سمع الكثير وعَرَض الحديث بالإسناف، وقال العلاف في تاريخه العمراني ما رأيت مثله غيوراً على الحق لا يتكلم إلا بالحق؛ وقال في كتابه الحساب والهندسة منه أربع نسخ عالجتهن، وكان فقيهاً شافعياً وكان شعره كثيراً، وجَرَت له حكاية اللآلئ حين رأى أمه تشتري عقداً من لؤلؤ بألفي دينار فقال ليس في هذا العقد لؤلؤتان في اللؤلؤة مثلها بمائة درهم ولو كانت كذلك لكانت مثلها مائة، فامتحن ذلك فكان كما قال، وقالت لهم أمي ولو كانت كما قلتم لكانت معتمة سائعة، وامتُحن بكتاب النظرية وكتاب مساور اللؤلؤ من أعمال المخترعين من علماء الهندسة والمجوهرين فكانوا يمدحون أبي به فكان أخي يخبر أبي ويكتب له حتى كان آخر ذلك أن كنت أمتأن بمجلس أمه وكان مرجع الناس في ذلك إليها؛ مولده عاشر صفر سنة اثنتين وأربعين وأربعمائة وتوفي يوم الجمعة ثاني رجب سنة خمس وثلاثين وخمسمائة وله ثلاث وتسعون سنة {cite:shadharat-dhahab p. 586-587}."
  en: "Abu Bakr Muhammad ibn Abd al-Baqi al-Ansari, qadi of the Maristan — a descendant of Ka'b ibn Malik's house; a vast transmitter who 'roasted the hadith' through the isnads; the al-Allaf said of him 'I never saw one so jealous for the truth'; a Shafi'i jurist and prolific poet whose arithmetic and geometry books ran to four drafts; when his mother paid two thousand dinars for a pearl necklace he proved its pearls matched market lots of a hundred dirhams — and was right, winning over the scholars of geometry and jewellers who had praised his father; b. 10 Safar 442, d. Friday 2 Rajab 535 aged ninety-three {cite:shadharat-dhahab p. 586-587}."
  fr: "Abu Bakr Muhammad ibn Abd al-Baqi al-Ansari, cadi du Maristan — descendant de la maison de Ka'b ibn Malik ; transmetteur considérable qui « passa le hadith au crible » par les isnads ; al-Allaf dit de lui « je n'ai jamais vu quelqu'un d'aussi jaloux de la vérité » ; juriste shafi'ite et poète prolifique dont les livres d'arithmétique et de géométrie atteignirent quatre versions ; quand sa mère paya deux mille dinars pour un collier de perles, il démontra que ses perles valaient des lots de marché à cent dirhams — et il avait raison, gagnant l'estime des savants en géométrie et des joailliers qui avaient loué son père ; né le 10 Safar 442, mort le vendredi 2 Rajab 535 à quatre-vingt-treize ans {cite:shadharat-dhahab p. 586-587}."
  es: "Abu Bakr Muhammad ibn Abd al-Baqi al-Ansari, cadí del Maristan, descendiente de la casa de Ka'b ibn Malik; un vasto transmisor que \"reveló\" los hadices a través de los isnads; al-Allaf dijo de él: \"Nunca vi a nadie tan celoso de la verdad\"; jurista shafi'í y prolífico poeta cuyos libros de aritmética y geometría llegaron a cuatro borradores; cuando su madre pagó dos mil dinares por un collar de perlas, demostró que sus perlas igualaban lotes de mercado de cien dirhams, y tenía razón, ganándose a los eruditos de geometría y joyeros que habían elogiado a su padre; n. 10 Safar 442, m. viernes 2 Rajab 535 a la edad de noventa y tres años {cite:shadharat-dhahab p. 586-587}."
  ur: "ابوبکر محمد بن عبد الباقی الانصاری، مرستان کے قاضی - کعب بن مالک کے گھر کی اولاد؛ ایک وسیع ٹرانسمیٹر جس نے اسناڈز کے ذریعے 'حدیث کو روسٹ کیا'۔ العلف نے اس کے بارے میں کہا کہ 'میں نے حق کے لیے اتنا غیرت مند کبھی نہیں دیکھا'۔ ایک شافعی فقیہ اور ممتاز شاعر جس کی ریاضی اور جیومیٹری کی کتابیں چار مسودوں تک پہنچیں۔ جب اس کی والدہ نے موتیوں کے ہار کے لیے دو ہزار دینار ادا کیے تو اس نے ثابت کیا کہ اس کے موتی سو درہم کے بازار سے مماثل ہیں - اور درست کہا، جیومیٹری کے علما اور جواہرات پر فتح حاصل کی جنہوں نے اپنے والد کی تعریف کی تھی۔ ب 10 صفر 442، د۔ جمعہ 2 رجب 535 عمر ترانوے 586-587}۔"
  tr: "Hastanenin kadısı Ebu Bekir Muhammed ibn Abdülbakî el-Ensari; dedesi Amr ibn Ka'b ibn Malik el-Ensari idi. Çok şey öğrendi ve hadisleri isnad zincirleriyle birlikte sundu. El-Allaf, Umran tarihi adlı eserinde, \"Onun gibisini görmedim, hakikate bu kadar düşkün, sadece hakikati söylüyor.\" demiştir. Aritmetik ve geometri üzerine yazdığı kitabında ise, \"Üzerinde çalıştığım dört nüshası var.\" demiştir. Şafiî mezhebine mensup bir fıkıhçıydı ve çok şiir yazmıştı. İnci hikayesi, annesinin iki bin dinara inci kolye aldığını gördüğünde başına geldi. \"Bu kolyede iki inci yok. Bir inci yüz dirhem değerinde, eğer öyle olsaydı yüz tane daha olurdu.\" dedi. Bunu denedi ve dediği gibi çıktı. Annesi onlara, \"Eğer dediğin gibi olsaydı, koyu renkli ve akan bir şey olurdu.\" dedi. Mühendislik ve kuyumculuk alanındaki bilginlerin mucitlerinin eserleri olan teori kitabı ve inci bilezik kitabı ile sınandı. Babamı bu kitapla övüyorlardı ve kardeşim babama haber verip ona mektuplar yazıyordu; ben de onun annesiyle oturup, insanların ondan bilgi aldığını öğreniyordum. Babam 442 yılının Safer ayının onuncu gününde doğdu ve 535 yılının Recep ayının ikinci Cuma günü, 93 yaşında vefat etti. {cite:shadharat-dhahab s. 586-587}"
  id: "Abu Bakr Muhammad ibn Abd al-Baqi al-Ansari, hakim rumah sakit; kakeknya adalah Amr ibn Ka’b ibn Malik al-Ansari. Beliau banyak mendengar dan menyajikan hadits dengan sanad yang lengkap. Al-Allaf berkata dalam sejarahnya tentang al-Umran, “Aku belum pernah melihat orang seperti dia, begitu bersemangat untuk kebenaran, dia hanya berbicara kebenaran.” Beliau berkata dalam bukunya tentang aritmatika dan geometri, “Aku memiliki empat salinannya, yang telah kukerjakan.” Beliau adalah seorang ahli hukum Syafi'i dan beliau memiliki banyak puisi. Kisah tentang mutiara terjadi padanya ketika beliau melihat ibunya membeli kalung mutiara seharga dua ribu dinar. Beliau berkata, “Tidak ada dua mutiara dalam kalung ini. Satu mutiara bernilai seratus dirham, dan jika demikian, pasti ada seratus mutiara seperti itu.” Beliau mengujinya, dan memang seperti yang dikatakannya. Ibuku berkata kepada mereka, “Jika memang seperti yang kalian katakan, mutiara itu akan berwarna gelap dan berkilauan.” Ia diuji dengan buku teori dan buku gelang mutiara, yang merupakan karya para penemu dari kalangan sarjana teknik dan perhiasan. Mereka biasa memuji ayah saya dengan buku itu, dan saudara laki-laki saya akan memberi tahu ayah saya dan menulis surat kepadanya sampai akhir, ketika saya biasa duduk bersama ibunya, dan orang-orang akan merujuk kepadanya untuk hal itu. Ia lahir pada tanggal sepuluh Safar tahun empat ratus empat puluh dua, dan meninggal pada hari Jumat, tanggal dua Rajab tahun lima ratus tiga puluh lima, pada usia sembilan puluh tiga tahun. {cite:shadharat-dhahab hlm. 586-587}."
