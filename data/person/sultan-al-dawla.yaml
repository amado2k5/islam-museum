id: person/sultan-al-dawla
class: person
label: { ar: "سلطان الدولة أبو شجاع بن بهاء الدولة" }
summary:
  ar: "أبو شجاع بن بهاء الدولة بن عضد الدولة بن ركن الدولة بن بويه الديلمي، بويع بعد موت أبيه سنة ثلاث وأربعمائة فبقي في الملك اثني عشر عاماً {cite:shadharat-dhahab p. 166}؛ وعند ابن الجوزي مات بشيراز سنة ٤١٥ وله اثنتان وثلاثون سنة وخمسة أشهر، فخُطب بعده لأخيه مشرف الدولة ببغداد {cite:muntazam-ibn-al-jawzi j.8 p.359}."
  en: "Abu Shuja' b. Baha' al-Dawla — the last Buyid amir of Iraq; succeeded his father in 403 and held the realm twelve years {cite:shadharat-dhahab p. 166}."
  es: "Abu Shuja' b. Baha' al-Dawla — el último emir buyí de Irak; sucedió a su padre en 403 y gobernó el reino durante doce años {cite:shadharat-dhahab p. 166}."
  fr: "Abu Shuja' b. Baha' al-Dawla — le dernier émir bouyide d'Irak; succéda à son père en 403 et détint le royaume pendant douze ans {cite: shadharat-dhahab p. 166}."
  ur: "ابو شجاع بن بہاء الدولہ - عراق کا آخری بوید امیر؛ 403 میں اپنے والد کی جانشینی کی اور بارہ سال سلطنت پر فائز رہے۔ 166}۔"
  tr: "Ebu Şuca' ibn Baha el-Devle ibn 'Adud el-Davla ibn Rukn al-Dawla ibn Buyah al-Daylami, babasının ölümünden sonra dört yüz yaşında bağlılık yemini etti ve on iki yıl iktidarda kaldı {atıf:shadharat-dhahab s. 166}; İbn el-Cewzi'ye göre, 415 Hicri yılında Şiraz'da otuz iki yıl beş aylıkken öldü ve ardından Bağdat'ta kardeşi Müşrif el-Devle'ye evlenme teklif etti {atıf:Muntazam-ibn-al-jawzi j.8 s.359}."
  id: "Abu Shuja' ibn Baha al-Dawla ibn 'Adud al-Dawla ibn Rukn al-Dawla ibn Buyah al-Daylami disumpah setia setelah kematian ayahnya pada tahun empat ratus dan tetap berkuasa selama dua belas tahun {cite:shadharat-dhahab hlm. 166}; menurut Ibn al-Jawzi, ia meninggal di Shiraz pada tahun 415 H pada usia tiga puluh dua tahun lima bulan, setelah itu ia melamar saudaranya Mushrif al-Dawla di Baghdad {cite:Muntazam-ibn-al-jawzi j.8 hlm.359}."
