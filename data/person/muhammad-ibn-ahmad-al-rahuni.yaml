  fr: "Muhammad ibn Ahmad al-Rahuni (Maliki jurist)"
roles: [scholar, jurist]
gender: male
summary:
  ar: "محمد بن أحمد بن محمد بن يوسف، أبو عبد الله الرهوني المغربي، فقيه مالكي ومتكلم، كان مرجع الفتوى في المغرب، أخذ الفقه عن التاودي ومحمد الورزازي ومحمد البناني ومحمد الجنوي، وروى عنه الهاشمي بن التهامي. من تصانيفه «حاشيته على شرح الزرقاني على مختصر خليل» و«أرجوزة في الحيض والنفاس» و«حاشية على شرح ميارة الكبير» و«نزهة الأكياس». توفي سنة 1230هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9962}"
  en: "Muhammad ibn Ahmad ibn Muhammad ibn Yusuf, Abu Abdallah al-Rahuni of Morocco, a Maliki jurist and theologian who was the reference for fatwas in Morocco; he studied with al-Tawudi, Muhammad al-Warzazi, Muhammad al-Bannani and Muhammad al-Janawi. His works include a gloss on al-Zurqani's commentary on Khalil's abridgement, a rajaz poem on menstruation and postpartum bleeding, and a gloss on Mayyara's commentary. He died in 1230 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9962}"
  es: "Muhammad ibn Ahmad ibn Muhammad ibn Yusuf, Abu Abdallah al-Rahuni de Marruecos, fue un jurista y teólogo malikí de referencia para las fatuas en Marruecos. Estudió con al-Tawudi, Muhammad al-Warzazi, Muhammad al-Bannani y Muhammad al-Janawi. Entre sus obras destacan una glosa sobre el comentario de al-Zurqani a la abreviación de Khalil, un poema rajaz sobre la menstruación y el sangrado posparto, y una glosa sobre el comentario de Mayyara. Falleció en el año 1230 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9962}"
  fr: "Muhammad ibn Ahmad ibn Muhammad ibn Yusuf, dit Abu Abdallah al-Rahuni du Maroc, était un juriste et théologien malikite qui faisait autorité en matière de fatwas au Maroc. Il étudia auprès d'al-Tawudi, Muhammad al-Warzazi, Muhammad al-Bannani et Muhammad al-Janawi. Parmi ses œuvres figurent une glose du commentaire d'al-Zurqani sur l'abrégé de Khalil, un poème rajaz sur les menstruations et les saignements post-partum, ainsi qu'une glose du commentaire de Mayyara. Il mourut en 1230 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9962}"
