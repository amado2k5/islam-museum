summary:
  ar: "محمد بن أحمد بن محمد بن يوسف، أبو عبد الله الرهوني المغربي، فقيه مالكي ومتكلم، كان مرجع الفتوى في المغرب، أخذ الفقه عن التاودي ومحمد الورزازي ومحمد البناني ومحمد الجنوي، وروى عنه الهاشمي بن التهامي. من تصانيفه «حاشيته على شرح الزرقاني على مختصر خليل» و«أرجوزة في الحيض والنفاس» و«حاشية على شرح ميارة الكبير» و«نزهة الأكياس». توفي سنة 1230هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9962}"
  en: "Muhammad ibn Ahmad ibn Muhammad ibn Yusuf, Abu Abdallah al-Rahuni of Morocco, a Maliki jurist and theologian who was the reference for fatwas in Morocco; he studied with al-Tawudi, Muhammad al-Warzazi, Muhammad al-Bannani and Muhammad al-Janawi. His works include a gloss on al-Zurqani's commentary on Khalil's abridgement, a rajaz poem on menstruation and postpartum bleeding, and a gloss on Mayyara's commentary. He died in 1230 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9962}"
