  ar: ابنة النبي وزوج عثمان بن عفان، هاجرت معه إلى الحبشة ثم إلى المدينة؛ مرضت عند خروج النبي إلى بدر فتخلف عثمان عليها، وتوفيت يوم وصل زيد بن حارثة بخبر النصر.
