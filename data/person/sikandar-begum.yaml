summary:
  ar: "بيغوم بوبال في وسط الهند: وصية على ابنتها شاه جهان بيكم من سنة 1844، واعتُرف بها نوابًا باسمها سنة 1860، وحكمت حتى وفاتها سنة 1868. ثبّتت بوبال في صف البريطانيين سنة 1857، وأدّت الحج سنة 1863 — أول حاكم هندي يؤديه بحسب مقالة ويكيبيديا الإنجليزية — وكتبت مذكرات عنه، وسدّدت دين الدولة، وأسست دار سكة وأمانة سر ومجلس شورى وقضاءً حديثًا."
  en: "Begum of Bhopal in central India: regent for her daughter Shah Jahan Begum from 1844, recognised as nawab in her own right in 1860, and ruler until her death in 1868. She held Bhopal for the British side in 1857, performed the Hajj in 1863 — the first Indian ruler to do so, per the English article — and wrote a memoir of it, repaid the state debt, and founded a mint, a secretariat, a council and a modern judiciary."
  ur: "وسط ہندوستان کی ریاست بھوپال کی بیگم: 1844 سے اپنی بیٹی شاہ جہاں بیگم کی نائب السلطنت رہیں اور 1860 میں باقاعدہ نواب تسلیم کی گئیں، 1868 میں وفات تک حکمران رہیں۔ انہوں نے 1857 میں بھوپال کو برطانوی صف میں رکھا، 1863 میں حج کیا — انگریزی مقالے کے مطابق یہ فریضہ ادا کرنے والی وہ پہلی ہندوستانی حکمران تھیں — اور اس کی یادداشتیں لکھیں، ریاست کا قرض ادا کیا، اور ٹکسال، سیکرٹریٹ، مجلس اور جدید عدلیہ قائم کیں۔"
