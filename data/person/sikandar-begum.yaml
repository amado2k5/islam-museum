summary:
  ar: "بيغوم بوبال في وسط الهند: وصية على ابنتها شاه جهان بيكم من سنة 1844، واعتُرف بها نوابًا باسمها سنة 1860، وحكمت حتى وفاتها سنة 1868. ثبّتت بوبال في صف البريطانيين سنة 1857، وأدّت الحج سنة 1863 — أول حاكم هندي يؤديه بحسب مقالة ويكيبيديا الإنجليزية — وكتبت مذكرات عنه، وسدّدت دين الدولة، وأسست دار سكة وأمانة سر ومجلس شورى وقضاءً حديثًا."
  en: "Begum of Bhopal in central India: regent for her daughter Shah Jahan Begum from 1844, recognised as nawab in her own right in 1860, and ruler until her death in 1868. She held Bhopal for the British side in 1857, performed the Hajj in 1863 — the first Indian ruler to do so, per the English article — and wrote a memoir of it, repaid the state debt, and founded a mint, a secretariat, a council and a modern judiciary."
  ur: "وسط ہندوستان کی ریاست بھوپال کی بیگم: 1844 سے اپنی بیٹی شاہ جہاں بیگم کی نائب السلطنت رہیں اور 1860 میں باقاعدہ نواب تسلیم کی گئیں، 1868 میں وفات تک حکمران رہیں۔ انہوں نے 1857 میں بھوپال کو برطانوی صف میں رکھا، 1863 میں حج کیا — انگریزی مقالے کے مطابق یہ فریضہ ادا کرنے والی وہ پہلی ہندوستانی حکمران تھیں — اور اس کی یادداشتیں لکھیں، ریاست کا قرض ادا کیا، اور ٹکسال، سیکرٹریٹ، مجلس اور جدید عدلیہ قائم کیں۔"
  es: "Begum de Bhopal, en el centro de la India: regente de su hija Shah Jahan Begum desde 1844, reconocida como nawab por derecho propio en 1860 y gobernante hasta su muerte en 1868. Mantuvo Bhopal en nombre de los británicos en 1857, realizó el Hajj en 1863 —la primera gobernante india en hacerlo, según el artículo en inglés— y escribió unas memorias sobre la experiencia, pagó la deuda estatal y fundó una casa de la moneda, una secretaría, un consejo y un sistema judicial moderno."
  fr: "La Bégum de Bhopal, en Inde centrale, fut régente pour sa fille Shah Jahan Begum à partir de 1844, reconnue comme nawab de plein droit en 1860 et souveraine jusqu'à sa mort en 1868. Elle tint Bhopal pour le compte des Britanniques en 1857, accomplit le Hajj en 1863 – devenant ainsi la première souveraine indienne à le faire, selon l'article anglais – et en écrivit un récit, remboursa la dette de l'État et fonda un atelier monétaire, un secrétariat, un conseil et un système judiciaire moderne."
  tr: "Orta Hindistan'da Begüm Bhopal: 1844'ten itibaren kızı Şah Cihan Begkum'un vasisi, 1860'ta adıyla vekil olarak tanındı ve 1868'deki ölümüne kadar hüküm sürdü. Bhopal 1857'de İngilizlere katıldı, 1863'te hac yolculuğunu gerçekleştirdi—İngilizce Wikipedia makalesine göre bunu gerçekleştiren ilk Hintli hükümdar—hakkında anılar yazdı, devletin borcunu ödedi ve modern bir demiryolu binası, sekreterya, danışma kurulu ve yargı sistemi kurdu."
  id: "Begum Bhopal di India tengah: wali putrinya Shah Jahan Begkum sejak 1844, diakui sebagai deputi dengan namanya pada tahun 1860, dan memerintah hingga kematiannya pada tahun 1868. Bhopal bergabung dengan Inggris pada tahun 1857, melakukan ziarah pada tahun 1863—penguasa India pertama yang melakukannya menurut artikel Wikipedia bahasa Inggris—menulis memoar tentangnya, melunasi utang negara, dan mendirikan rumah kereta api modern, sekretariat, dewan konsultatif, dan peradilan."
