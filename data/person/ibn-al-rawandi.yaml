label: { ar: "ابن الراوندي", en: "Ibn Al Rawandi" }
summary:
  ar: "أبو الحسين أحمد بن يحيى بن محمد بن إسحاق الراوندي من أهل مرو الروذ، قال أبو القاسم البلخي لم يكن في نظرائه في زمنه أحذق منه بالكلام ولا أعرف بدقيقه وجليله وكان في أول أمره حسن السيرة جميل المذهب كثير الحياء ثم انسلخ من ذلك كله لأسباب عرضت له ولأن علمه كان أكثر من عقله، وحكى عن جماعة أنه تاب عند موته مما كان منه وأظهر الندم واعترف أنه إنما صار إلى ما صار إليه خمية وأنفة من جفاء أصحابه وتنحيتهم إياه من مجالسهم، وأكثر كتبه الكفريات ألفها لأبي عيسى بن لاوي اليهودي الأهوازي وفي منزل هذا الرجل توفي: كتاب يحتج فيه على الرسل ويبطل الرسالة ونقضه على نفسه ونقضه الخياط، وكتاب نعت الحكمة في صفة القديم في تكليف خلقه، وكتاب يطعن فيه على نظم القرآن نقضه الخياط وأبو علي الجبائي ونقضه هو على نفسه، وكتاب القضيب الذهب يثبت فيه أن علم الله بالأشياء محدث وأنه كان غير عالم حتى خلق لنفسه علما، وكتاب الفرند في الطعن على النبي ونقضه الخياط، وكتاب المرجان في اختلاف أهل الإسلام ونقضه على نفسه، ومن كتب صلاحه كتاب الأسماء والأحكام وكتاب الابتداء والإعادة وكتاب الإمامة وكتاب خلق القرآن وكتاب البقاء والفناء {cite:fihrist-ibn-al-nadim p. 528-529}."
  en: "Ibn al-Rawandi — the Fihrist's full dossier on his books of unbelief and their refutations {cite:fihrist-ibn-al-nadim}"
