label: { ar: "ابن الراوندي", en: "Ibn Al Rawandi", es: "Ibn Al Rawandi", fr: "Ibn Al Rawandi", ur: "ابن الراوندی" }
summary:
  ar: "أبو الحسين أحمد بن يحيى بن محمد بن إسحاق الراوندي من أهل مرو الروذ، قال أبو القاسم البلخي لم يكن في نظرائه في زمنه أحذق منه بالكلام ولا أعرف بدقيقه وجليله وكان في أول أمره حسن السيرة جميل المذهب كثير الحياء ثم انسلخ من ذلك كله لأسباب عرضت له ولأن علمه كان أكثر من عقله، وحكى عن جماعة أنه تاب عند موته مما كان منه وأظهر الندم واعترف أنه إنما صار إلى ما صار إليه خمية وأنفة من جفاء أصحابه وتنحيتهم إياه من مجالسهم، وأكثر كتبه الكفريات ألفها لأبي عيسى بن لاوي اليهودي الأهوازي وفي منزل هذا الرجل توفي: كتاب يحتج فيه على الرسل ويبطل الرسالة ونقضه على نفسه ونقضه الخياط، وكتاب نعت الحكمة في صفة القديم في تكليف خلقه، وكتاب يطعن فيه على نظم القرآن نقضه الخياط وأبو علي الجبائي ونقضه هو على نفسه، وكتاب القضيب الذهب يثبت فيه أن علم الله بالأشياء محدث وأنه كان غير عالم حتى خلق لنفسه علما، وكتاب الفرند في الطعن على النبي ونقضه الخياط، وكتاب المرجان في اختلاف أهل الإسلام ونقضه على نفسه، ومن كتب صلاحه كتاب الأسماء والأحكام وكتاب الابتداء والإعادة وكتاب الإمامة وكتاب خلق القرآن وكتاب البقاء والفناء {cite:fihrist-ibn-al-nadim p. 528-529}."
  en: "Ibn al-Rawandi — the Fihrist's full dossier on his books of unbelief and their refutations {cite:fihrist-ibn-al-nadim}"
  es: "Ibn al-Rawandi: el expediente completo del Fihrist sobre sus libros de incredulidad y sus refutaciones {cite:fihrist-ibn-al-nadim}"
  fr: "Ibn al-Rawandi — le dossier complet du Fihrist sur ses livres d'incroyance et leurs réfutations {cite:fihrist-ibn-al-nadim}"
  ur: "ابن الراوندی - اپنی کفر کی کتابوں اور ان کی تردید پر فہرسٹ کا مکمل دستاویز"
  tr: "Ebu el-Hüseyin Ahmed ibn Yahya ibn Muhammed ibn İshaq el-Rawandi, Merw el-Rudh halkından. Ebu el-Kasım el-Balxi, zamanındaki akranlarının kendisinden daha yetenekli konuşma yeteneğine sahip olmadığını, onun kesinliğini ya da büyüklüğünü bilmiyorum. Başta iyi davranışlı, terbiyeli ve alçakgönüllüydü. Sonra, kendisine sunulan nedenlerle ve bilgisi aklını aştığı için tüm bunları terk etti. Bir gruptan rivayet edildiği gibi, ölümünde pişman oldu, pişmanlık gösterdi ve sadece başına gelene dönüştüğünü kabul etti. Yoldaşlarının soğukluğu ve toplantılarından dışlanmaları karşısında utanç ve gurur kaynağıydı. İnançsızlık üzerine yazdığı kitapların çoğu Ebu İsa bin Lavi el-Yahudi el-Ahwazi tarafından yazılmıştır. Bu adamın evinde öldü: elçilere karşı tartıştığı, mesajı geçersiz kıldığı ve kendisine karşı çürütüp reddettiği bir kitap, terzi tarafından çürütüldü; yaşlıların yaratılışa olan görevlerini anlatırken bilgeliği anlatan bir kitap; Kur'an'ın yazımını sorgulayan bir kitap, bu kitap el-Khayyat ve Ebu Ali el-Cübbey tarafından çürütüldü ve kendisi de çürüttü; ve 'Altın Asa' adlı kitapta, burada Allah'ın bilgisinin uydurma olduğunu ve kendisinin bir alim olmadığını onaylıyor Kendisi için bir bilim yarattı: 'El-Farand fi el-Ta'nabi' adlı Peygamber'e karşı ve el-Hayyat tarafından çürütülmesi, 'El-Marjan fi İhtilaf Ahl el-İslam ve kendini çürütmesi' adlı kitabı. Doğru kitapları arasında İsimler ve Hükümler Kitabı, İnisiyasyon ve Tekrar Kitabı, İmamat Kitabı, Kur'an'ın Yaratılışı Kitabı ve Sonsuzluk ve Yok Oluş Kitabı yer alır {atıf:fihrist-ibn-al-nadim s. 528-529}."
  id: "Abu al-Husayn Ahmad ibn Yahya ibn Muhammad ibn Ishaq al-Rawandi dari masyarakat Marw al-Rudh. Abu al-Qasim al-Balkhi berkata bahwa tidak ada rekan-rekannya pada zamannya yang lebih mahir berbicara darinya, dan saya juga tidak tahu ketelitian atau kehebatannya. Awalnya, ia berperilaku baik, sopan, dan rendah hati. Kemudian ia meninggalkan semua itu karena alasan yang diberikan kepadanya dan karena pengetahuannya melebihi kecerdasannya. Sebuah kelompok menceritakan bahwa ia bertobat saat meninggal, menunjukkan penyesalan, dan mengakui bahwa ia hanya menjadi apa yang menimpanya. Ia menjadi sumber aib dan kebanggaan atas dinginnya sahabat-sahabatnya dan mereka yang dikeluarkan dari pertemuan mereka. Sebagian besar bukunya tentang ketidakpercayaan ditulis oleh Abu Isa ibn Lawi al-Yahudi al-Ahwazi. Di rumah pria ini, ia meninggal: sebuah kitab di mana ia berdebat melawan para utusan, membatalkan pesan itu, dan membantahnya terhadap dirinya sendiri, yang dibantah oleh penjahit; sebuah kitab yang menggambarkan hikmat dalam menggambarkan yang lama dalam tugasnya terhadap penciptaan; sebuah kitab di mana ia menantang penyusunan Al-Qur'an, yang dibantah oleh al-Khayyat dan Abu Ali al-Jubbai serta membantah dirinya sendiri; dan kitab 'Tongkat Emas,' di mana ia menegaskan bahwa pengetahuan Allah tentang segala sesuatu adalah rekaan dan bahwa Ia bukanlah seorang ulama sampai batas Ia menciptakan ilmu untuk dirinya sendiri, yaitu kitab 'Al-Farand fi al-Ta'nabi' melawan Nabi dan penolakannya oleh al-Khayyat, buku 'Al-Marjan fi Ikhtilaf Ahl al-Islam dan penolakannya terhadap dirinya sendiri.' Di antara kitab-kitab sucinya adalah Kitab Nama dan Hukuman, Kitab Inisiasi dan Pengulangan, Kitab Imamat, Kitab Penciptaan Al-Qur'an, dan Kitab Keabadian dan Pemusnahan {cite:fihrist-ibn-al-nadim hlm. 528-529}."
