summary:
  ar: "أبو عمرو عثمان بن سليمان البتي، من أهل الكوفة، انتقل إلى البصرة، أخذ عن الحسن البصري {cite:tabaqat-fuqaha-abbas-1981 p. 49}، ومات سنة ثلاث وأربعين ومائة {cite:tabaqat-fuqaha-abbas-1981 p. 49}. وتذكر حاشية المحقق أن نسبته «البتي» إلى بيع «البتوت»، وهو كساء غليظ."
  tr: "Kufe'den Ebu Amr Osman bin Süleyman el-Batti, Basra'ya taşındı, el-Hasan el-Basri'nin yanında eğitim gördü {atıf:tabaqat-fuqaha-abbas-1981, s. 49} ve yüz kırk üçüncü yılında vefat etti {atıf:tabaqat-fuqaha-abbas-1981, s. 49}. Editörün kenar notlarında, 'al-Buti'ye atfedilmesinin 'al-batut' adlı kalın bir giysi olan satışına ait olduğu belirtilmektedir."
  id: "Abu Amr Uthman ibn Sulayman al-Batti, dari Kufa, pindah ke Basra, belajar di bawah bimbingan al-Hasan al-Basri {cite:tabaqat-fuqaha-abbas-1981, hlm. 49}, dan meninggal pada tahun seratus empat puluh tiga {cite:tabaqat-fuqaha-abbas-1981, hlm. 49}. Catatan pinggir editor menyebutkan bahwa atribusinya kepada 'al-Buti' adalah penjualan 'al-batut', yang merupakan pakaian tebal."
