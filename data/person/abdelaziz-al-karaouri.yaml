summary:
  ar: "إمام ومقرئ مغربي من الدار البيضاء ⁦(توفي 2025)⁩، أمّ في مساجد التوبة والتيسير ثم القاضي عياض بسيدي معروف الذي امتلأ بالمصلين في التراويح، وعمل إطارًا تربويًا منذ 1999، وخرّج كثيرًا من الحفاظ؛ ترك الغناء في الأفراح في أواخر التسعينيات وتفرّغ للقرآن."
  en: "Moroccan imam and reciter from Casablanca (died 2025) who led prayers at the al-Tawba and al-Taysir mosques and then at al-Qadi Iyad Mosque in Sidi Maarouf, packed for the tarawih; he worked in education from 1999 and taught many huffaz, having left singing at weddings in the late 1990s to devote himself to the Qur'an."
  ur: "دار البیضاء کے مراکشی امام اور قاری ⁦(وفات 2025ء)⁩، جنھوں نے مسجد التوبہ اور التیسیر اور پھر سیدی معروف کی مسجد القاضی عیاض میں امامت کی، جو تراویح میں بھر جاتی؛ 1999ء سے تعلیم کے شعبے میں رہے اور بہت سے حفاظ تیار کیے؛ نوے کی دہائی کے آخر میں شادیوں میں گانا چھوڑ کر قرآن کے لیے وقف ہو گئے۔"
