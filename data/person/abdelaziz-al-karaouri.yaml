  ar: "\u0625\u0645\u0627\u0645 \u0648\u0645\u0642\u0631\u0626 \u0645\u063a\u0631\u0628\u064a \u0645\u0646 \u0627\u0644\u062f\u0627\u0631 \u0627\u0644\u0628\u064a\u0636\u0627\u0621 (\u062a\u0648\u0641\u064a 2025)\u060c \u0623\u0645\u0651 \u0641\u064a \u0645\u0633\u0627\u062c\u062f \u0627\u0644\u062a\u0648\u0628\u0629 \u0648\u0627\u0644\u062a\u064a\u0633\u064a\u0631 \u062b\u0645 \u0627\u0644\u0642\u0627\u0636\u064a \u0639\u064a\u0627\u0636 \u0628\u0633\u064a\u062f\u064a \u0645\u0639\u0631\u0648\u0641 \u0627\u0644\u0630\u064a \u0627\u0645\u062a\u0644\u0623 \u0628\u0627\u0644\u0645\u0635\u0644\u064a\u0646 \u0641\u064a \u0627\u0644\u062a\u0631\u0627\u0648\u064a\u062d\u060c \u0648\u0639\u0645\u0644 \u0625\u0637\u0627\u0631\u064b\u0627 \u062a\u0631\u0628\u0648\u064a\u064b\u0627 \u0645\u0646\u0630 1999\u060c \u0648\u062e\u0631\u0651\u062c \u0643\u062b\u064a\u0631\u064b\u0627 \u0645\u0646 \u0627\u0644\u062d\u0641\u0627\u0638\u061b \u062a\u0631\u0643 \u0627\u0644\u063a\u0646\u0627\u0621 \u0641\u064a \u0627\u0644\u0623\u0641\u0631\u0627\u062d \u0641\u064a \u0623\u0648\u0627\u062e\u0631 \u0627\u0644\u062a\u0633\u0639\u064a\u0646\u064a\u0627\u062a \u0648\u062a\u0641\u0631\u0651\u063a \u0644\u0644\u0642\u0631\u0622\u0646."
  en: "Moroccan imam and reciter from Casablanca (died 2025) who led prayers at the al-Tawba and al-Taysir mosques and then at al-Qadi Iyad Mosque in Sidi Maarouf, packed for the tarawih; he worked in education from 1999 and taught many huffaz, having left singing at weddings in the late 1990s to devote himself to the Qur'an."
