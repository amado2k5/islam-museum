summary:
  ar: "إمام ومقرئ مغربي من الدار البيضاء ⁦(توفي 2025)⁩، أمّ في مساجد التوبة والتيسير ثم القاضي عياض بسيدي معروف الذي امتلأ بالمصلين في التراويح، وعمل إطارًا تربويًا منذ 1999، وخرّج كثيرًا من الحفاظ؛ ترك الغناء في الأفراح في أواخر التسعينيات وتفرّغ للقرآن."
  en: "Moroccan imam and reciter from Casablanca (died 2025) who led prayers at the al-Tawba and al-Taysir mosques and then at al-Qadi Iyad Mosque in Sidi Maarouf, packed for the tarawih; he worked in education from 1999 and taught many huffaz, having left singing at weddings in the late 1990s to devote himself to the Qur'an."
  fr: "Imam et récitant marocain de Casablanca (mort en 2025) qui dirigea la prière aux mosquées al-Tawba et al-Taysir puis à la mosquée al-Qadi Iyad de Sidi Maârouf, comble lors des tarawih ; il travailla dans l'enseignement à partir de 1999 et forma de nombreux huffaz, après avoir quitté le chant aux mariages à la fin des années 1990 pour se consacrer au Coran."
  ur: "دار البیضاء کے مراکشی امام اور قاری ⁦(وفات 2025ء)⁩، جنھوں نے مسجد التوبہ اور التیسیر اور پھر سیدی معروف کی مسجد القاضی عیاض میں امامت کی، جو تراویح میں بھر جاتی؛ 1999ء سے تعلیم کے شعبے میں رہے اور بہت سے حفاظ تیار کیے؛ نوے کی دہائی کے آخر میں شادیوں میں گانا چھوڑ کر قرآن کے لیے وقف ہو گئے۔"
  es: "Imán y recitador marroquí de Casablanca (fallecido en 2025) que dirigió las oraciones en las mezquitas de al-Tawba y al-Taysir y luego en la mezquita de al-Qadi Iyad en Sidi Maarouf, preparada para el tarawih; trabajó en la educación desde 1999 y enseñó a muchos huffaz, después de haber dejado de cantar en bodas a finales de la década de 1990 para dedicarse al Corán."
  tr: "Fas'ın Kazablanka şehrinden bir imam ve Kur'an okuyucusu (2025'te vefat etti), önce Al-Tawbah ve Al-Taysir camilerinde, daha sonra da teravih namazlarında cemaatle dolup taşan Sidi Maarouf'taki Kadı Ayad camisinde namaz kıldırdı. 1999'dan beri eğitim alanında çalıştı ve birçok Kur'an okuyucusu yetiştirdi. 90'lı yılların sonlarında düğünlerde şarkı söylemeyi bıraktı ve kendini Kur'an'a adadı."
  id: "Seorang imam dan qari dari Casablanca, Maroko (meninggal tahun 2025), beliau memimpin salat di masjid Al-Tawbah dan Al-Taysir, kemudian di Qadi Ayad di Sidi Maarouf, yang dipenuhi jamaah selama salat Tarawih. Beliau bekerja sebagai pendidik sejak tahun 1999, dan telah menghasilkan banyak penghafal Al-Quran. Beliau berhenti bernyanyi di pesta pernikahan pada akhir tahun sembilan puluhan dan mengabdikan diri pada Al-Quran."
