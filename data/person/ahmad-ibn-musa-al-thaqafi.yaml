summary:
  ar: "أحمد بن موسى الثقفي، كان شاعرًا أديبًا ثم صار صابرًا أريبًا، وعزف عن الدنيا بعد أن كان لها وامقًا، وأقبل على المعاد. له أبيات في ذم الدنيا والمغترين بها، رواها أبو بكر القرشي عنه."
  en: "Ahmad ibn Musa al-Thaqafi, a poet and man of letters who became patient and discerning, turned away from the world after having been devoted to it, and turned to the hereafter; he has verses against the world and those deceived by it, which Abu Bakr al-Qurashi transmits from him."
  ur: "احمد بن موسیٰ ثقفی شاعر اور ادیب تھے، پھر صابر اور دانا بن گئے۔ دنیا سے، جس سے وہ پہلے دل لگائے ہوئے تھے، منہ موڑ کر آخرت کی طرف متوجہ ہوئے۔ ان کے دنیا اور اس کے فریب خوردہ لوگوں کی مذمت میں اشعار ہیں، جو ابو بکر قرشی نے ان سے روایت کیے۔"
  es: "Ahmad ibn Musa al-Thaqafi, poeta y hombre de letras que se volvió paciente y perspicaz, se apartó del mundo tras haberse entregado a él y se volcó hacia la otra vida; tiene versos contra el mundo y aquellos que son engañados por él, que Abu Bakr al-Qurashi transmite de él."
  fr: "Ahmad ibn Musa al-Thaqafi, poète et homme de lettres devenu patient et perspicace, s'est détourné du monde après s'y être consacré et s'est tourné vers l'au-delà; il a des vers contre le monde et ceux qu'il trompe, qu'Abu Bakr al-Qurashi transmet de lui."
  tr: "Ahmed ibn Musa el-Sakkafi, şair ve edebiyatçıydı; ancak dünyevi hayata derinden bağlı kaldıktan sonra sabırlı ve bilge bir insan oldu, ondan uzaklaştı ve ahirete odaklandı. Ebu Bekir el-Kureşi'nin onun rivayetine dayanarak naklettiği, dünyayı ve onun aldanmalarına karşı kınayıcı şiirleri vardır."
  id: "Ahmad ibn Musa al-Thaqafi adalah seorang penyair dan sastrawan, tetapi ia menjadi sabar dan bijaksana, menjauhkan diri dari kehidupan duniawi setelah sebelumnya sangat terikat padanya, dan berfokus pada kehidupan akhirat. Ia memiliki syair-syair yang mengecam dunia dan orang-orang yang tertipu olehnya, yang diriwayatkan oleh Abu Bakr al-Qurashi atas otoritasnya."
