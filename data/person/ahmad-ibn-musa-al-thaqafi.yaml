summary:
  ar: "أحمد بن موسى الثقفي، كان شاعرًا أديبًا ثم صار صابرًا أريبًا، وعزف عن الدنيا بعد أن كان لها وامقًا، وأقبل على المعاد. له أبيات في ذم الدنيا والمغترين بها، رواها أبو بكر القرشي عنه."
  en: "Ahmad ibn Musa al-Thaqafi, a poet and man of letters who became patient and discerning, turned away from the world after having been devoted to it, and turned to the hereafter; he has verses against the world and those deceived by it, which Abu Bakr al-Qurashi transmits from him."
  ur: "احمد بن موسیٰ ثقفی شاعر اور ادیب تھے، پھر صابر اور دانا بن گئے۔ دنیا سے، جس سے وہ پہلے دل لگائے ہوئے تھے، منہ موڑ کر آخرت کی طرف متوجہ ہوئے۔ ان کے دنیا اور اس کے فریب خوردہ لوگوں کی مذمت میں اشعار ہیں، جو ابو بکر قرشی نے ان سے روایت کیے۔"
