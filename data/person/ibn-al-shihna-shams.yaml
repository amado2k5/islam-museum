summary:
  ar: "قاضي الحنفية بالديار المصرية شمس الدين ابن الشحنة الحلبي الإمام العالم الناظم النادر سليل العلماء الأجلاء ومن نظمه «قلت له لما وفى موعدي وما بقلبي لسواه نفاق وجاد بالوصل على وجهه حتى سما كل حبيب وفاق»، توفي في المحرم سنة تسعين وثمانمائة عن خمس وثمانين سنة {cite:shadharat-dhahab p. 349-350}."
  en: "Ibn al-Shihna — Egypt's Hanafi qadi, 'scion of the illustrious scholars' and a poet; died Muharram 890 at eighty-five {cite:shadharat-dhahab p. 349-350}."
  es: "Ibn al-Shihna, cadí hanafi de Egipto, \"vástago de los eruditos ilustres\" y poeta; murió Muharram en 890 a los ochenta y cinco años {cita: shadharat-dhahab p. 349-350}."
  fr: "Ibn al-Shihna — cadi Hanafi d'Égypte, « descendant d'illustres savants » et poète; est décédé Muharram 890 à quatre-vingt-cinq ans {cite: shadharat-dhahab p. 349-350}."
  ur: "ابن الشینا - مصر کا حنفی قاضی، 'ممتاز علماء کا خاندان' اور ایک شاعر؛ وفات محرم 890 کو پچاسی میں 349-350}۔"
  tr: "Mısır'daki Hanefi yargıcı Şemseddin İbn el-Şehnna-el-Halabi, imam, alim, nadir şair ve saygın alimlerin torunudur. Şiirleri arasında: \"Görevimi yerine getirdiğimde ona söyledim ve kalbimde bir ikiyüzlülük yoktu, yüzünde birlik tutmakta özen gösterdi ve tüm sevdiklerini uzlaşmaya ilan edene kadar gösterdi.\" Sekiz yüz doksan beş yaşında Muharrem'de vefat etti {atıf:shadharat-dhahab, s. 349-350}."
  id: "Hakim Hanafi di Mesir, Shams al-Din Ibn al-Shahna al-Halabi, sang imam, ulamawan, penyair langka, dan keturunan para ulama terhormat. Di antara puisinya: \"Saya berkata kepadanya ketika saya menyelesaikan tugas saya dan apa yang ada di hati saya bukanlah kemunafikan, dan dia tekun menjaga kesatuan di wajahnya sampai dia menunjuk setiap orang yang dikasihi untuk rekonsiliasi.\" Dia meninggal pada Muharram pada tahun delapan ratus sembilan puluh lima tahun {cite:shadharat-dhahab, hlm. 349-350}."
