summary:
  ar: "تيم كلارك (وُلد في 22 تشرين الثاني 1949 في أروبا) رجل أعمال بريطاني هو رئيس طيران الإمارات منذ كانون الثاني 2003، وكان عضوًا في فريقها المؤسس سنة 1985 قادمًا من طيران الخليج، وأدار الخطوط الجوية السريلانكية حتى 2008. نال وسام الإمبراطورية البريطانية برتبة قائد فارس سنة 2014، وحصل على الجنسية الإماراتية سنة 2021، ويرأس مؤسسة طيران الإمارات الخيرية."
  en: "Tim Clark (born 22 November 1949 in Aruba) is a British business executive who has been president of Emirates since January 2003, having joined its founding team in 1985 from Gulf Air, and who was managing director of SriLankan Airlines until 2008. He was appointed KBE in 2014, acquired Emirati citizenship in 2021, and chairs the Emirates Airline Foundation charity."
  ur: "ٹم کلارک (پیدائش 22 نومبر 1949، اروبا) برطانوی کاروباری ایگزیکٹو ہیں جو جنوری 2003 سے امارات ایئرلائن کے صدر ہیں؛ وہ 1985 میں گلف ایئر سے آ کر اس کی بانی ٹیم میں شامل ہوئے اور 2008 تک سری لنکن ایئرلائنز کے منیجنگ ڈائریکٹر رہے۔ انھیں 2014 میں کے بی ای ملا، 2021 میں اماراتی شہریت حاصل کی، اور وہ امارات ایئرلائن فاؤنڈیشن خیراتی ادارے کے چیئرمین ہیں۔"
