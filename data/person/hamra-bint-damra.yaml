summary:
  ar: "عجوز من بني تميم أسرها عمرو بن هند في قصة الانتقام، فقالت ما صار مثلاً: 'ألا فتى مكان عجوز'. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 17-18}"
  en: "An old woman of Tamim captured in Amr's revenge; her words 'Will no young man take an old woman's place?' became a proverb. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 17-18}"
  ur: "تمیم کی ایک بوڑھی عورت جو عمرو کے انتقام کے قصے میں گرفتار ہوئی؛ ان کا قول 'کیا کوئی جوان بوڑھی کی جگہ نہ لے گا' مثل بن گیا۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 17-18}"
