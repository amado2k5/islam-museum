  ar: "قائد وطني سوري (1891–1982) من زعماء جبل الدروز، قاد الثورة السورية الكبرى ضد الانتداب الفرنسي (1925–1927) وكان قائدها العام، ورفض كل منصب سياسي بعد استقلال سورية، واشتهر بشعاره «الدين لله والوطن للجميع»."
