label: { ar: "الملك الناصر محمد بن قلاوون", en: "al-Malik al-Nasir Muhammad ibn Qalawun" }
summary:
  ar: "سلطان مملوكي، سلطنوه بعد أخيه الأشرف وله تسع سنين سنة ثلاث وتسعين ثم خلع سنة أربع وتسعين فتسلطن كتبغا المنصوري ثم لاجين سنة ست وتسعين فلما قتل لاجين سنة ثمان وتسعين أعيد الملك الناصر من منفاه بالكرك فقلده الخليفة وسير العادل إلى حماة نائباً {cite:tarikh-khulafa-minhaj-1434 p. 730-731}، وفي سنة ثمان خرج قاصداً للحج فلما اجتاز بالكرك انكسر به الجسر فسلم هو ومات أربعة وأقام بالكرك وكتب بعزل نفسه عن المملكة فبويع بيبرس الجاشنكير ثم عاد في رجب سنة تسع ودخل مصر يوم عيد الفطر {cite:tarikh-khulafa-minhaj-1434 p. 734}."
  en: "Mamluk sultan thrice fated: raised at nine in 693, deposed for Kitbugha then Lajin, restored from Karak's exile in 698 with the caliph's investiture {cite:tarikh-khulafa-minhaj-1434 p. 730-731}."
