id: person/al-nasir-muhammad-ibn-qalawun
class: person
label: { ar: "الملك الناصر محمد بن قلاوون", en: "al-Malik al-Nasir Muhammad ibn Qalawun", fr: "al-Malik al-Nasir Muhammad ibn Qalawun" , ur: "الناصر محمد بن قلاوون", es: "al-Malik al-Nasir Muhammad ibn Qalawun"}
summary:
  ar: "سلطان مملوكي، سلطنوه بعد أخيه الأشرف وله تسع سنين سنة ثلاث وتسعين ثم خلع سنة أربع وتسعين فتسلطن كتبغا المنصوري ثم لاجين سنة ست وتسعين فلما قتل لاجين سنة ثمان وتسعين أعيد الملك الناصر من منفاه بالكرك فقلده الخليفة وسير العادل إلى حماة نائباً {cite:tarikh-khulafa-minhaj-1434 p. 730-731}، وفي سنة ثمان خرج قاصداً للحج فلما اجتاز بالكرك انكسر به الجسر فسلم هو ومات أربعة وأقام بالكرك وكتب بعزل نفسه عن المملكة فبويع بيبرس الجاشنكير ثم عاد في رجب سنة تسع ودخل مصر يوم عيد الفطر {cite:tarikh-khulafa-minhaj-1434 p. 734}."
  en: "Mamluk sultan thrice fated: raised at nine in 693, deposed for Kitbugha then Lajin, restored from Karak's exile in 698 with the caliph's investiture {cite:tarikh-khulafa-minhaj-1434 p. 730-731}."
  fr: "Le sultan mamelouk trois fois condamné  : élevé à neuf ans en 693, déposé pour Kitbugha puis Lajin, restauré de l'exil de Karak en 698 avec l'investiture du calife {cite:tarikh-khulafa-minhaj-1434 p. 730-731}."
  ur: "مملوک سلطان جو تین مرتبہ تخت نشین ہوئے؛ 693ھ میں نو سال کی عمر میں اقتدار ملا، پھر معزول ہوئے، اور 698ھ میں کرک سے واپس بلا کر دوبارہ سلطان بنایا گیا۔ {cite:tarikh-khulafa-minhaj-1434 p. 730-731}"
  es: "Sultán mameluco con un destino trágico: elevado al trono a los nueve años en 693, depuesto por Kitbugha y luego por Lajin, restaurado del exilio de Karak en 698 con la investidura del califa {cite:tarikh-khulafa-minhaj-1434 p. 730-731}."
  tr: "O, kardeşi el-Eşref'ten sonra yönetilen bir Memlük sultanıydı ve 1993'te dokuz yıl görev yaptı, ardından 1994'te tahttan indirildi. Önce Katbugha el-Mansuri ve ardından 1996'da Lajin için hükümdar olarak hüküm sürdü. Lajin 1998'de öldürüldüğünde, Kral el-Nasir Karak'taki sürgünden geri getirildi ve halife onu hapse attı. El-Adil, vekil olarak Hama'ya gönderildi {alıntı:) Tarih-Khulafa-minhaj-1434, s. 730-731}. Sekizinci yılında hac yolculuğuna çıktı, ancak Karak'ı geçerken köprü kırıldı, bu yüzden teslim oldu ve dört yaşında Karak'ta yaşamaya başladı. Krallıktan uzaklaşmak için yazdı, böylece Baybars al-Jashankir bağlılık yemini etti, ardından 9 Hicri Yılının Recep'inde döndü ve Kurban Bayramı'nda Mısır'a girdi {cite:History-Khulafa-minhaj-1434, s. 734}."
  id: "Ia adalah sultan Mamluk, yang diperintah setelah saudaranya al-Ashraf dan menjalani sembilan tahun pada tahun 1993, lalu digulingkan pada tahun 1994. Ia memerintah sebagai penguasa untuk Katbugha al-Mansuri dan kemudian Lajin pada tahun 1996. Ketika Lajin dibunuh pada tahun 1998, Raja al-Nasir dibawa kembali dari pengasingannya di Karak, sehingga khalifah memenjarakannya. Al-Adil dikirim ke Hama sebagai wakil {cite:Sejarah-Khulafa-minhaj-1434, hlm. 730-731}. Pada tahun kedelapan, ia berangkat untuk ziarah, tetapi ketika menyeberangi Karak, jembatan itu rusak, sehingga ia menyerah dan meninggal pada usia empat tahun, tinggal di Karak. Ia menulis untuk mengasingkan diri dari kerajaan, sehingga Baybars al-Jashankir diikrarkan kesetiaan, kemudian kembali di Rajab tahun 9 Hm dan masuk ke Mesir pada Idul Fitri {cite:History-Khulafa-minhaj-1434, hlm. 734}."
