  en: "An Azdi physician and traditional healer from Azd Shanu'a who arrived in Mecca and offered to treat the Prophet Muhammad after hearing claims that he was mad; upon hearing the Prophet's Khutbat al-Hajah, he declared Islam immediately and pledged his tribe's allegiance."
  ar: "طبيب راقٍ من أزد شنوءة باليمن؛ قدم مكة وسمع سفهاءها يزعمون أن محمداً مجنون فعرض أن يرقيه، فلما سمع منه خطبة الحاجة بهرته فأسلم وبايع على نفسه وعلى قومه."
  ur: "ازد شنوعہ کا ازدی طبیب اور روایتی معالج جو مکہ آیا اور دعوے سنتے ہی نبی کا علاج پیش کیا۔"
