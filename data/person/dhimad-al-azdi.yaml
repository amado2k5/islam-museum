summary:
  en: "An Azdi physician and traditional healer from Azd Shanu'a who arrived in Mecca and offered to treat the Prophet Muhammad after hearing claims that he was mad; upon hearing the Prophet's Khutbat al-Hajah, he declared Islam immediately and pledged his tribe's allegiance."
  ar: "طبيب راقٍ من أزد شنوءة باليمن؛ قدم مكة وسمع سفهاءها يزعمون أن محمداً مجنون فعرض أن يرقيه، فلما سمع منه خطبة الحاجة بهرته فأسلم وبايع على نفسه وعلى قومه."
  ur: "ازد شنوعہ کا ازدی طبیب اور روایتی معالج جو مکہ آیا اور دعوے سنتے ہی نبی کا علاج پیش کیا۔"
  es: "Un médico y curandero tradicional azdí de Azd Shanu'a llegó a La Meca y se ofreció a tratar al Profeta Mahoma tras oír rumores de que estaba loco; al escuchar el sermón del Profeta, se declaró musulmán inmediatamente y juró lealtad a su tribu."
  fr: "Un médecin et guérisseur traditionnel Azdi d'Azd Shanu'a, arrivé à La Mecque, proposa de soigner le prophète Mahomet après avoir entendu dire qu'il était fou; en entendant le Khutbat al-Hajah du Prophète, il se convertit immédiatement à l'islam et prêta allégeance à sa tribu."
  tr: "Yemen'in Azd Shnua'sından seçkin bir doktor; Mekke'ye geldi ve oradaki aptalların Muhammed'in akıl hastası olduğunu iddia ettiğini duydu, bu yüzden onun için namaz kılmayı teklif etti. İhtiyaç vaazını duyduğunda şaşırdı, bu yüzden İslam'a geçti ve kendine ve halkına bağlılık yemini etti."
  id: "Seorang dokter terkemuka dari Azd Shnua di Yaman; ia datang ke Mekah dan mendengar orang-orang bodohnya mengklaim Muhammad gila, sehingga ia menawarkan untuk melakukan shalat untuknya. Ketika mendengar khotbah kebutuhan, ia terkejut, lalu memeluk Islam dan bersumpah setia kepada dirinya dan rakyatnya."
