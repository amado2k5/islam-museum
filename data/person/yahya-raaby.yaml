summary:
  ar: "معلّم إسلامي مقيم في المملكة المتحدة، أصله من الدنمارك. حفظ القرآن في سن المراهقة في أكاديمية بدر بالمملكة المتحدة، حيث يعمل الآن مدرّسًا للعربية والعلوم الشرعية ومدير قسم ومشرفًا على شؤون الطلاب؛ وتذكر سير البودكاست أيضًا أنه مدير معهد التوحيد في ميدنهيد. تنتشر محاضراته عبر بودكاست «مسلم سنترال» وقنوات التواصل، وتخاطب خصوصًا الشباب المسلم في المملكة المتحدة."
  en: "A UK-based Islamic teacher originally from Denmark. He memorised the Qur'an as a teenager at Badr Academy in the United Kingdom, where he is now an instructor of Arabic and Islamic sciences, a department manager and a supervisor of student affairs; podcast biographies also name him principal of the Tawheed Institute in Maidenhead. His lectures circulate through his Muslim Central podcast feed and social channels, addressed particularly to young Muslims in the United Kingdom."
  ur: "برطانیہ میں مقیم اسلامی استاد، اصلًا ڈنمارک سے۔ انہوں نے نوجوانی میں برطانیہ کی بدر اکیڈمی میں قرآن حفظ کیا، جہاں اب وہ عربی اور اسلامی علوم کے استاد، شعبے کے مینیجر اور طلبہ کے امور کے نگران ہیں؛ پوڈکاسٹ سوانح میں میڈن ہیڈ کے توحید انسٹیٹیوٹ کے پرنسپل کے طور پر بھی ان کا ذکر ہے۔ ان کی محاضرات مسلم سنترال پوڈکاسٹ اور سوشل چینلز کے ذریعے خصوصًا برطانیہ کے مسلم نوجوانوں تک پہنچتی ہیں۔"
