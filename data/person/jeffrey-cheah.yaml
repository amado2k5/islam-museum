summary:
  ar: "جيفري تشياه (وُلد سنة 1945 في بوسينغ بولاية بيراك) رجل أعمال ماليزي من أصل صيني هاكا، مؤسس ورئيس مجموعة صنواي؛ بدأ محاسبًا ثم أسس سنة 1974 شركة صغيرة لتعدين القصدير برأسمال 100 ألف رينغيت، فبنى منها مدينة صنواي المتكاملة وجامعة صنواي وكامبس موناش ماليزيا، وأسس مؤسسة جيفري تشياه التي قدمت منذ 2018 نحو 39 مليون دولار منحًا وأعمالًا تعليمية، وحمل أوسمة ماليزية سامية ورتبة فارس قائد فخري في الإمبراطورية البريطانية."
  en: "Jeffrey Cheah (born 1945 at Pusing, Perak) is a Malaysian entrepreneur of Hakka Chinese descent, founder and chairman of the Sunway Group; he began as an accountant, founded a small tin-mining company in 1974 with RM100,000, and built from it the integrated township of Sunway City, Sunway University and the Monash University Malaysia campus, founded the Jeffrey Cheah Foundation, which has given almost US$39 million to scholarships and educational causes since 2018, and holds high Malaysian honours and an honorary British knighthood (KBE)."
  ur: "جیفری چیاہ (پیدائش 1945، پوسنگ، پیراک) ہاکا چینی نسل کے ملائیشیائی کاروباری ہیں، سن وے گروپ کے بانی و چیئرمین؛ انھوں نے اکاؤنٹنٹ کے طور پر آغاز کیا، 1974 میں ایک لاکھ رنگٹ سے قلعی کی کان کنی کی چھوٹی کمپنی بنائی، اور اسی سے سن وے سٹی کی مربوط بستی، سن وے یونیورسٹی اور موناش یونیورسٹی ملائیشیا کیمپس کھڑے کیے، جیفری چیاہ فاؤنڈیشن قائم کی جس نے 2018 سے تقریباً 39 ملین ڈالر وظائف و تعلیمی کاموں پر دیے، اور وہ ملائیشیا کے اعلیٰ اعزازات اور برطانوی اعزازی نائٹ ہڈ (KBE) کے حامل ہیں۔"
