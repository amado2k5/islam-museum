summary:
  ar: "عاشر بن محمد، أبو محمد، الأنصاري الأندلسي الفاسي المالكي، فقيه عالم مشارك في القراءات والنحو والتفسير والأصول وعلم الكلام. من تصانيفه «المرشد المعين على الضروري من علوم الدين»، ومنظومة في فقه المالكية، و«شرح مختصر خليل»، و«الكافي» في القراءات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7146}"
  en: "Ashir ibn Muhammad, Abu Muhammad al-Ansari al-Andalusi al-Fasi, a Maliki scholar with learning in the readings of the Qur'an, grammar, exegesis, legal theory and theology. His works include al-Murshid al-mu'in, a versified Maliki law, a commentary on Khalil's abridgement, and al-Kafi on the readings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7146}"
