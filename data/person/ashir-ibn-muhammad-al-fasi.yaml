id: person/ashir-ibn-muhammad-al-fasi
class: person
label: { ar: "عاشر بن محمد الفاسي", en: "Ashir ibn Muhammad al-Fasi", es: "Ashir ibn Muhammad al-Fasi", fr: "Ashir ibn Muhammad al-Fasi", ur: "اشعر بن محمد الفاسی" }
summary:
  ar: "عاشر بن محمد، أبو محمد، الأنصاري الأندلسي الفاسي المالكي، فقيه عالم مشارك في القراءات والنحو والتفسير والأصول وعلم الكلام. من تصانيفه «المرشد المعين على الضروري من علوم الدين»، ومنظومة في فقه المالكية، و«شرح مختصر خليل»، و«الكافي» في القراءات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7146}"
  en: "Ashir ibn Muhammad, Abu Muhammad al-Ansari al-Andalusi al-Fasi, a Maliki scholar with learning in the readings of the Qur'an, grammar, exegesis, legal theory and theology. His works include al-Murshid al-mu'in, a versified Maliki law, a commentary on Khalil's abridgement, and al-Kafi on the readings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7146}"
  es: "Ashir ibn Muhammad, Abu Muhammad al-Ansari al-Andalusi al-Fasi, un erudito Maliki con conocimientos en las lecturas del Corán, gramática, exégesis, teoría jurídica y teología. Sus obras incluyen al-Murshid al-mu'in, una ley de Maliki versificada, un comentario sobre el resumen de Khalil y al-Kafi sobre las lecturas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7146}"
  fr: "Ashir ibn Muhammad, Abu Muhammad al-Ansari al-Andalusi al-Fasi, un érudit malikite ayant appris la lecture du Coran, la grammaire, l'exégèse, la théorie juridique et la théologie. Ses œuvres comprennent al-Murshid al-mu'in, une loi Maliki versifiée, un commentaire sur l'abrégé de Khalil et al-Kafi sur les lectures. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7146}"
  ur: "اشعر بن محمد، ابو محمد الانصاری الاندلسی الفاسی، ایک مالکی عالم جو قرآن، گرامر، تفسیر، قانونی نظریہ اور دینیات کی تعلیم کے ساتھ سیکھتے ہیں۔ ان کی تصانیف میں المرشد الموین، ایک تصدیق شدہ مالکی قانون، خلیل کی اختصار پر ایک تفسیر، اور قارئین پر الکافی شامل ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7146}"
