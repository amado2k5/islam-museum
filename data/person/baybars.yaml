label: { ar: "السلطان الظاهر ركن الدين بيبرس البندقداري" }
summary:
  ar: "شاليش المظفر قطز عند عين جالوت، ساق وراء التتار إلى بلاد حلب وطردهم ووعده السلطان بحلب ثم رجع فتأثر وكان ذلك مبدأ الوحشة، فاتفق وجماعة من الأمراء على قتل المظفر فقتلوه في الطريق سنة ثمان وخمسين وتسلطن ولقب بالملك القاهر فأشار عليه ابن الزبير بتغييره لأنه ما لقب به أحد فأفلح فتلقب بالملك الظاهر، وأزال عن أهل مصر ما أحدثه عليهم المظفر من المظالم {cite:tarikh-khulafa-minhaj-1434 p. 720-721}، وأقام له في رجب سنة تسع وخمسين الخلافة بمصر فبويع المستنصر بن الظاهر أول من بايعه السلطان، وفي سنة ثلاث وستين سلطن ولده الملك السعيد وعمره أربع سنين وجدد بالديار المصرية القضاة الأربعة من كل مذهب قاضياً ثم فعل ذلك بدمشق، وفي رمضان منها حجب الخليفة ومنعه الناس لكون أصحابه كانوا يتكلمون في أمر الدولة، وفي سنة أربع وسبعين وجه جيشاً إلى النوبة فأسر ملكها ووضعت الجزية على أهل دنقلة وهو أول فتحها، ومات بدمشق في المحرم سنة ست وسبعين {cite:tarikh-khulafa-minhaj-1434 p. 723-728}. وكان هو ركن الدين البندقداري على مقدمة جيش الملك المظفر يوم عين جالوت فساق وراء التتار إلى حلب وخلت من القوم الشام، وطمع في أخذ حلب وكان وعده بها المظفر ثم رجع فتأثر وأضمر الشر {cite:shadharat-dhahab p. 299}."
  en: "Qutuz's shalish at Ayn Jalut, who chased the Tatars past Aleppo; refused the promised city, he joined the amirs' killing of al-Muzaffar, took the throne first as al-Malik al-Qahir — till warned of the laqab's luck — then al-Malik al-Zahir {cite:tarikh-khulafa-minhaj-1434 p. 720-721}."
