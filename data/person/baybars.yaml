label: { ar: "السلطان الظاهر ركن الدين بيبرس البندقداري" }
summary:
  ar: "شاليش المظفر قطز عند عين جالوت، ساق وراء التتار إلى بلاد حلب وطردهم ووعده السلطان بحلب ثم رجع فتأثر وكان ذلك مبدأ الوحشة، فاتفق وجماعة من الأمراء على قتل المظفر فقتلوه في الطريق سنة ثمان وخمسين وتسلطن ولقب بالملك القاهر فأشار عليه ابن الزبير بتغييره لأنه ما لقب به أحد فأفلح فتلقب بالملك الظاهر، وأزال عن أهل مصر ما أحدثه عليهم المظفر من المظالم {cite:tarikh-khulafa-minhaj-1434 p. 720-721}."
  en: "Qutuz's shalish at Ayn Jalut, who chased the Tatars past Aleppo; refused the promised city, he joined the amirs' killing of al-Muzaffar, took the throne first as al-Malik al-Qahir — till warned of the laqab's luck — then al-Malik al-Zahir {cite:tarikh-khulafa-minhaj-1434 p. 720-721}."
