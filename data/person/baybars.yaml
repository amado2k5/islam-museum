class: person
label: { ar: "السلطان الظاهر ركن الدين بيبرس البندقداري", ur: "سلطان الظاہر رکن الدین بیبرس", en: "al-Zahir Rukn al-Din Baybars" }
summary:
  ar: "شاليش المظفر قطز عند عين جالوت، ساق وراء التتار إلى بلاد حلب وطردهم ووعده السلطان بحلب ثم رجع فتأثر وكان ذلك مبدأ الوحشة، فاتفق وجماعة من الأمراء على قتل المظفر فقتلوه في الطريق سنة ثمان وخمسين وتسلطن ولقب بالملك القاهر فأشار عليه ابن الزبير بتغييره لأنه ما لقب به أحد فأفلح فتلقب بالملك الظاهر، وأزال عن أهل مصر ما أحدثه عليهم المظفر من المظالم {cite:tarikh-khulafa-minhaj-1434 p. 720-721}، وأقام له في رجب سنة تسع وخمسين الخلافة بمصر فبويع المستنصر بن الظاهر أول من بايعه السلطان، وفي سنة ثلاث وستين سلطن ولده الملك السعيد وعمره أربع سنين وجدد بالديار المصرية القضاة الأربعة من كل مذهب قاضياً ثم فعل ذلك بدمشق، وفي رمضان منها حجب الخليفة ومنعه الناس لكون أصحابه كانوا يتكلمون في أمر الدولة، وفي سنة أربع وسبعين وجه جيشاً إلى النوبة فأسر ملكها ووضعت الجزية على أهل دنقلة وهو أول فتحها، ومات بدمشق في المحرم سنة ست وسبعين {cite:tarikh-khulafa-minhaj-1434 p. 723-728}. وكان هو ركن الدين البندقداري على مقدمة جيش الملك المظفر يوم عين جالوت فساق وراء التتار إلى حلب وخلت من القوم الشام، وطمع في أخذ حلب وكان وعده بها المظفر ثم رجع فتأثر وأضمر الشر {cite:shadharat-dhahab p. 299}. وولد في حدود العشرين وست مئة واشتراه الأمير علاء الدين البندقداري الصالحي فقبض الملك الصالح على البندقداري وأخذ ركن الدين منه فكان من جملة مماليكه ثم طلع شجاعاً فارساً مقداماً إلى أن بهر أمره وشهد وقعة المنصورة بدمياط وصار من أعيان البحرية وولي السلطنة في سابع عشر ذي القعدة سنة ثمان وخمسين وست مئة وكان ملكاً سرياً غازياً مجاهداً مؤيداً عظيم الهيبة خليقاً للملك يضرب بشجاعته المثل له أيام بيض في الإسلام وفتوحات مشهورة ومواقف مشهودة ولولا ظلمه وجبروته في بعض الأحايين لعُدّ من الملوك العادلين، وتوفي بقصره الأبلق بمرجة دمشق جوار الميدان يوم الخميس الثامن والعشرين من المحرم سنة ست وسبعين وست مئة وغسلوه وصبروه وعلقوه في البحيرة إلى أن فرغ من الظاهرية فنقلوه إليها وكان قد أوصى أن يدفن على الطريق وتبنى عليه قبة فابتاع له ولده الملك السعيد دار العقيقي بسبعين ألف درهم وبناها مدرسة للشافعية والحنفية ونقله إليها وفتح بيبرس من البلاد أربعين حصناً كانت مع الفرنج افتتحها بالسيف عنوة وخلف من الأولاد الملك السعيد محمداً وعمره ثماني عشرة سنة والخضر وسلامش وسبع بنات {cite:shadharat-dhahab p. 358-359}."
  en: "Qutuz's shalish at Ayn Jalut, who chased the Tatars past Aleppo; refused the promised city, he joined the amirs' killing of al-Muzaffar, took the throne first as al-Malik al-Qahir — till warned of the laqab's luck — then al-Malik al-Zahir {cite:tarikh-khulafa-minhaj-1434 p. 720-721}."
