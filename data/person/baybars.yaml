class: person
label: { ar: "السلطان الظاهر ركن الدين بيبرس البندقداري", ur: "سلطان الظاہر رکن الدین بیبرس", en: "al-Zahir Rukn al-Din Baybars", es: "al-Zahir Rukn al-Din Baybars", fr: "al-Zahir Rukn al-Din Baybars" }
summary:
  ar: "السلطان الظاهر ركن الدين بيبرس البندقداري رابع سلاطين المماليك البحرية بحسب دائرة المعارف الإسلامية، وكان مملوكاً تركياً من القبچاق اشتراه الأيوبيون. قاد الطليعة في عين جالوت ثم تولى السلطنة سنة 658هـ إثر مقتل قطز، وأقام الخلافة العباسية في القاهرة، وافتتح من الفرنج حصوناً كثيرة منها أنطاكية، وحارب المغول، وتوفي بدمشق سنة 676هـ. وقد أنشأ بريداً منتظماً بين مصر والشام. وفي رواية السيوطي وابن العماد: شاليش المظفر قطز عند عين جالوت، ساق وراء التتار إلى بلاد حلب وطردهم ووعده السلطان بحلب ثم رجع فتأثر وكان ذلك مبدأ الوحشة، فاتفق وجماعة من الأمراء على قتل المظفر فقتلوه في الطريق سنة ثمان وخمسين وتسلطن ولقب بالملك القاهر فأشار عليه ابن الزبير بتغييره لأنه ما لقب به أحد فأفلح فتلقب بالملك الظاهر، وأزال عن أهل مصر ما أحدثه عليهم المظفر من المظالم {cite:tarikh-khulafa-minhaj-1434 p. 720-721}، وأقام له في رجب سنة تسع وخمسين الخلافة بمصر فبويع المستنصر بن الظاهر أول من بايعه السلطان، وفي سنة ثلاث وستين سلطن ولده الملك السعيد وعمره أربع سنين وجدد بالديار المصرية القضاة الأربعة من كل مذهب قاضياً ثم فعل ذلك بدمشق، وفي رمضان منها حجب الخليفة ومنعه الناس لكون أصحابه كانوا يتكلمون في أمر الدولة، وفي سنة أربع وسبعين وجه جيشاً إلى النوبة فأسر ملكها ووضعت الجزية على أهل دنقلة وهو أول فتحها، ومات بدمشق في المحرم سنة ست وسبعين {cite:tarikh-khulafa-minhaj-1434 p. 723-728}. وكان هو ركن الدين البندقداري على مقدمة جيش الملك المظفر يوم عين جالوت فساق وراء التتار إلى حلب وخلت من القوم الشام، وطمع في أخذ حلب وكان وعده بها المظفر ثم رجع فتأثر وأضمر الشر {cite:shadharat-dhahab p. 299}. وولد في حدود العشرين وست مئة واشتراه الأمير علاء الدين البندقداري الصالحي فقبض الملك الصالح على البندقداري وأخذ ركن الدين منه فكان من جملة مماليكه ثم طلع شجاعاً فارساً مقداماً إلى أن بهر أمره وشهد وقعة المنصورة بدمياط وصار من أعيان البحرية وولي السلطنة في سابع عشر ذي القعدة سنة ثمان وخمسين وست مئة وكان ملكاً سرياً غازياً مجاهداً مؤيداً عظيم الهيبة خليقاً للملك يضرب بشجاعته المثل له أيام بيض في الإسلام وفتوحات مشهورة ومواقف مشهودة ولولا ظلمه وجبروته في بعض الأحايين لعُدّ من الملوك العادلين، وتوفي بقصره الأبلق بمرجة دمشق جوار الميدان يوم الخميس الثامن والعشرين من المحرم سنة ست وسبعين وست مئة وغسلوه وصبروه وعلقوه في البحيرة إلى أن فرغ من الظاهرية فنقلوه إليها وكان قد أوصى أن يدفن على الطريق وتبنى عليه قبة فابتاع له ولده الملك السعيد دار العقيقي بسبعين ألف درهم وبناها مدرسة للشافعية والحنفية ونقله إليها وفتح بيبرس من البلاد أربعين حصناً كانت مع الفرنج افتتحها بالسيف عنوة وخلف من الأولاد الملك السعيد محمداً وعمره ثماني عشرة سنة والخضر وسلامش وسبع بنات {cite:shadharat-dhahab p. 358-359}."
  en: "Al-Zahir Rukn al-Din Baybars al-Bunduqdari was, in the Encyclopaedia of Islam's count, the fourth Bahri Mamluk sultan, a Kipchak Turkish slave soldier bought under the Ayyubids. He led the vanguard at Ayn Jalut, took the throne in 658 AH after Qutuz was killed, welcomed an Abbasid refugee as caliph in Cairo, fought the Mongols, took Antioch and many other Frankish strongholds, and died at Damascus in 676 AH. He also set up a regular postal service between Egypt and Syria. In the Suyuti and Ibn al-Imad accounts: Qutuz's shalish at Ayn Jalut, who chased the Tatars past Aleppo; refused the promised city, he joined the amirs' killing of al-Muzaffar, took the throne first as al-Malik al-Qahir — till warned of the laqab's luck — then al-Malik al-Zahir {cite:tarikh-khulafa-minhaj-1434 p. 720-721}."
  ur: "الظاہر رکن الدین بیبرس بندقداری دائرۃ المعارف اسلامیہ کی گنتی میں بحری مملوک سلاطین کے چوتھے سلطان تھے، قپچاق ترک غلام سپاہی جنہیں ایوبیوں کے دور میں خریدا گیا۔ انہوں نے عین جالوت میں ہراول کی قیادت کی، قطز کے قتل کے بعد سنہ 658ھ میں تخت سنبھالا، قاہرہ میں ایک عباسی پناہ گزین کو خلیفہ تسلیم کیا، منگولوں سے لڑے، انطاکیہ اور فرنگیوں کے کئی قلعے لیے، اور سنہ 676ھ میں دمشق میں وفات پائی۔ انہوں نے مصر اور شام کے درمیان باقاعدہ ڈاک کا نظام بھی بنایا۔"
  es: "Al-Zahir Rukn al-Din Baybars al-Bunduqdari fue, según la Enciclopedia del Islam, el cuarto sultán mameluco Bahri, un soldado esclavo turco kipchak comprado a los ayubíes. Dirigió la vanguardia en Ayn Jalut, tomó el trono en 658 AH después de la muerte de Qutuz, acogió a un refugiado abasí como califa en El Cairo, luchó contra los mongoles, tomó Antioquía y muchas otras fortalezas francas, y murió en Damasco en 676 AH. También estableció un servicio postal regular entre Egipto y Siria. En los relatos de Suyuti e Ibn al-Imad: el shalish de Qutuz en Ayn Jalut, que persiguió a los tártaros más allá de Alepo; Rechazó la ciudad prometida, se unió a los emires en el asesinato de al-Muzaffar, tomó el trono primero como al-Malik al-Qahir —hasta que fue advertido de la suerte del laqab— luego como al-Malik al-Zahir {cite:tarikh-khulafa-minhaj-1434 p. 720-721}."
  fr: "Al-Zahir Rukn al-Din Baybars al-Bunduqdari était, selon l'Encyclopédie de l'Islam, le quatrième sultan mamelouk bahrite, un soldat esclave turc kiptchak acheté sous les Ayyoubides. Il mena l'avant-garde à Ayn Jalut, monta sur le trône en 658 AH après la mort de Qutuz, accueillit un réfugié abbasside comme calife au Caire, combattit les Mongols, prit Antioche et de nombreuses autres places fortes franques, et mourut à Damas en 676 AH. Il établit également un service postal régulier entre l'Égypte et la Syrie. Selon les récits de Suyuti et d'Ibn al-Imad: le shalish de Qutuz à Ayn Jalut, qui poursuivit les Tatars au-delà d'Alep; ayant refusé la ville promise, il s'est joint aux émirs pour tuer al-Muzaffar, a pris le trône d'abord sous le nom d'al-Malik al-Qahir — jusqu'à ce qu'il soit averti de la chance du laqab — puis sous le nom d'al-Malik al-Zahir {cite:tarikh-khulafa-minhaj-1434 p. 720-721}."
  tr: "Sultan el-Zahir Rukn al-Din Baybars el-Bunduqdari, İslam Ansiklopedisi'ne göre Bahri Memlüklerinin dördüncü sultanıydı ve Eyyubiler tarafından satın alınan Örümcek Türkçesi'nden bir Memlüktü. Ein Celut'ta öncü birliğe liderlik etti, ardından 658 Hicri yılında Qutuz'un suikastının ardından sultanlığı devraldı. Kahire'de Abbasi Halifeliği'ni kurdu, Antakya dahil birçok Frank kalesini fethetti, Moğollarla savaştı ve 676 Hicri yılında Şam'da öldü. Mısır ile Levant arasında düzenli bir postane kurdu. El-Suyuti ve İbn El-İmad rivayetinde: Şeyiş el-Muzaffer Kutuz, Ayn Celut yakınlarında Tatarları Halep topraklarına kadar kovaladı, onları kovdu ve Sultan Halep'e söz verdi. Sonra geri döndü, ancak etkilendi ve bu Yalnızlığın başlangıcı oldu. O ve bir grup prens el-Muzaffar'ı öldürmeyi kabul etti, ancak 58 yılında yolda onu öldürdüler. İktidarı ele geçirdi ve 'El-Malik El-Kahir' unvanını aldı. İbn el-Zubeyr ona bu unvanı kimse vermediği için onu değiştirmesini tavsiye etti, bu yüzden o da başarılı oldu ve El-Melik el-Zahir olarak adlandırıldı. Mısır halkından El-Muzaffar'ın onlara yaptığı adaletsizlikleri kaldırdı {alıntı: Tarikh-Khulafa-minhaj-1434, s. 720-721} ve elli dokuzuncu yılın Recep'inde Mısır'da halifeliğini kurdu; bu dönemde Al-Mustansir ibn al-Zahir ona sultan olarak ilk bağlılık yemini etti. Altmış üçüncü yılda, dört yaşındaki oğlu Kral Al-Sa'id, her mezhebin dört yargıcını Mısır'da yeniden yargıç olarak göreve getirdi ve ardından Şam'da bunu yaptı. Ramazan ayında halife alıkonuldu ve halk onu engelledi çünkü yoldaşları devlet işlerini tartışıyordu. Yetmiş dördüncü yılda, Nubia'ya bir ordu gönderdi, kralını ele geçirdi ve Dongla halkına vergi koydu; Dongla Şehri ilk fetheden oydu ve yetmiş altıncı yılda Şam'da Muharrem'de öldü {cite:Tarikh-khulafa-minhaj-1434, s. 723-728}. Ayn Celut gününde Kral el-Muzaffar'ın ordusunun öncüsünde Rukn al-Din al-Banduqdari'ydi. Tatarları Levant'tan terk edilmiş Halep'e kadar takip etti ve el-Muzaffar'ın ona söz verdiği Halep'i ele geçirmeyi umuyordu. Sonra geri döndü, etkilendi ve kötülükleri barındırdı {atıf:shadharat-dhahab, s. 299}. Yaklaşık 260 Hicri yılında doğdu ve Prens Alaa al-Din el-Bundaqdari el-Salhi tarafından satın alındı. Kral el-Salih el-Bundqdari'yi ele geçirdi ve dini direği ondan aldı, onu memlüklerinden biri yaptı. Sonra cesur, yiğit ve yiğit bir şekilde ortaya çıktı; emrinden hayran kaldı, Damietta'daki Mansura Muharebesi'ne tanık oldu, deniz adamlarından biri oldu ve 1658 Hicri yılının on yedinci ayında sultanlığı devraldı. Gizli, istilacı ve savaşçı bir kraldı, büyük prestijin destekçisi, kralın cesaretiyle örnek alınan bir karakterdi. İslam'da iyi günleri, ünlü fetihleri ve duruşları vardır. Ünlü ve bazı durumlarda zulmü ve zorbalığı olmasaydı, adil krallardan biri olarak kabul edilirdi. 676 H. yılında, Muharrem ayının yirmi sekizinci Perşembe günü Şam Merce'sindeki sarayında öldü. Yıkandı, hastalandı ve Al-Zahiriyah'dan ayrılana kadar gölde asılı kaldı. Onu oraya götürdüler. Yola gömülmesini emretmişti ve üzerine bir kubbe inşa edildi. Oğlu Kral Al-Saeed, Dar Al-Akiqi'yi yetmiş bin dirhem karşılığında satın aldı, Şafiiler ve Hanefiler için bir okul yaptırdı, oraya taşıdı ve Baybars topraklardan kırk kaleyi fethetti Franklar burayı zorla kılıçla fethetti ve geride oğulları bıraktı: Kral Al-Saeed Muhammad, on sekiz yaşında, Al-Khidr ve Salamash ile yedi kızları {cite:shadharat-dhahab s. 358-359}."
  id: "Sultan al-Zahir Rukn al-Din Baybars al-Bunduqdari adalah sultan keempat Mamluk Bahri menurut Ensiklopedia Islam, dan merupakan Mamluk Turki dari Cobbag yang dibeli oleh Ayyubid. Ia memimpin barisan depan di Ain Jalut, kemudian mengambil alih kesultanan pada tahun 658 H setelah pembunuhan Qutuz. Ia mendirikan Kekhalifahan Abbasiyah di Kairo, menaklukkan banyak benteng Franka termasuk Antiokhia, melawan Mongol, dan meninggal di Damaskus pada tahun 676 H. Ia mendirikan kantor pos reguler antara Mesir dan Levant. Dalam riwayat Al-Suyuti dan Ibn Al-Imad: Shalish al-Muzaffar Qutuz dekat Ain Jalut mengejar Tatar ke tanah Aleppo, mengusir mereka, dan berjanji kepada Sultan Aleppo. Ia kemudian kembali, tetapi ia terpengaruh, yang menjadi awal dari kesepian. Ia dan sekelompok pangeran sepakat untuk membunuh al-Muzaffar, tetapi mereka membunuhnya dalam perjalanan pada tahun 58. Ia mengambil alih kekuasaan dan diberi gelar 'Al-Malik Al-Qahir.' Ibn al-Zubayr menyarankan agar ia mengubahnya karena tidak ada yang memberinya gelar itu, sehingga ia berhasil dan disebut Al-Malik al-Zahir. Ia menghapus ketidakadilan yang dilakukan Al-Muzaffar kepada mereka dari rakyat Mesir {cite: Tarikh-Khulafa-minhaj-1434, hlm. 720-721}, dan mendirikan kekhalifahan di Mesir pada tahun lima puluh sembilan, di mana Al-Mustansir ibn al-Zahir adalah yang pertama mengucapkan kesetiaan kepadanya sebagai sultan. Pada tahun enam puluh tiga, putranya Raja Al-Sa'id, yang berusia empat tahun, mengembalikan empat hakim dari setiap sekte sebagai hakim di Mesir, lalu melakukannya di Damaskus. Selama Ramadan, khalifah ditahan dan orang-orang menghalanginya karena para sahabatnya sedang membahas urusan negara. Pada tahun tujuh puluh empat, ia mengirim pasukan ke Nubia, menangkap rajanya, dan mengenakan upeti kepada rakyat Dongla, yang Ia adalah yang pertama menaklukkannya, dan meninggal di Damaskus pada tahun ke-76 {cite:Tarikh-khulafa-minhaj-1434, hlm. 723-728}. Ia adalah Rukn al-Din al-Banduqdari di barisan depan pasukan Raja al-Muzaffar pada hari Ain Jalut. Ia mengejar Tatar ke Aleppo, yang ditinggalkan dari Levant, dan berharap dapat merebut Aleppo, yang telah dijanjikan al-Muzaffar kepadanya. Kemudian ia kembali, terkena dampak, dan menyimpan kejahatan {cite:shadharat-dhahab, hlm. 299}. Ia lahir sekitar tahun 260 H dan dibeli oleh Pangeran Alaa al-Din al-Bundaqdari al-Salhi. Raja al-Salih merebut al-Bundqdari dan mengambil tiang agama darinya, menjadikannya salah satu mamluknya. Ia kemudian muncul sebagai pemberani, berani, dan berani hingga ia terpesona oleh komandonya, menyaksikan Pertempuran Mansoura di Damietta, menjadi salah satu pejabat angkatan laut, dan mengambil alih kesultanan pada tanggal ketujuh belas Dhu al-Qi'dah tahun 1658 H. Ia adalah raja rahasia, penyerbu, dan pejuang, pendukung prestise tinggi, karakter raja yang sering dijadikan contoh karena keberaniannya. Ia memiliki hari-hari yang baik dalam Islam, penaklukan terkenal, dan sikapnya. Terkenal dan jika bukan karena penindasan dan tirani dalam beberapa kasus, ia dianggap sebagai salah satu raja yang adil. Ia meninggal di istananya di Marjah Damaskus dekat ladang pada hari Kamis, tanggal dua puluh delapan Muharram tahun 676 H. Ia dimandikan, dipasihan, dan digantung di danau sampai selesai meninggalkan Al-Zahiriyah. Mereka memindahkannya ke sana. Ia telah memerintahkan untuk dimakamkan di jalan, dan sebuah kubah dibangun di atasnya. Putranya, Raja Al-Saeed, membeli Dar Al-Aqeeqi seharga tujuh puluh ribu dirham, membangunnya sebagai sekolah untuk Syafi'i dan Hanafi, memindahkannya ke sana, dan Baybars menaklukkan empat puluh benteng dari tanah yang ada Bangsa Franka menaklukkannya dengan pedang dan meninggalkan putra-putra: Raja Al-Saeed Muhammad, berusia delapan belas tahun, Al-Khidr dan Salamash, serta tujuh putri {cite:shadharat-dhahab hlm. 358-359}."
