summary:
  ar: "مؤسس الأسرة القاجارية في إيران، وُلد سنة 1155هـ/1742م، وأُخصي في صباه بأمر عادل شاه ابن أخي نادر شاه، وبعد مقتل أبيه سنة 1758 صار زعيم القاجاريين، ونقل عاصمته إلى طهران سنة 1785، ثم تُوّج شاهًا سنة 1796، واغتيل سنة 1797 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  en: "Founder of the Qajar dynasty of Persia, born 1155/1742. As a child he was castrated on the order of 'Adil Shah, Nadir Shah's nephew, and after his father's murder in 1758 he became chief of the Qajars. He made Tehran his capital in 1785, executed Luft 'Ali Khan in 1794, was crowned in 1796 and was assassinated in 1797 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  fr: "Fondateur de la dynastie qadjare de Perse, né en 1155 H/1742 ap. J.-C. Enfant, il fut castré sur l'ordre d'Adil Shah, neveu de Nadir Shah ; après le meurtre de son père en 1758, il devint chef des Qadjars. Il fit de Téhéran sa capitale en 1785, exécuta Luft 'Ali Khan en 1794, fut couronné en 1796 et assassiné en 1797 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  es: "Fundador de la dinastía Qajar de Persia, nacido en 1155/1742. De niño fue castrado por orden de 'Adil Shah, sobrino de Nadir Shah, y tras el asesinato de su padre en 1758 se convirtió en jefe de los Qajar. Estableció Teherán como su capital en 1785, ejecutó a Luft 'Ali Khan en 1794, fue coronado en 1796 y asesinado en 1797 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  ur: "قاجار خاندان فارس کا بانی، پیدائش 1155/1742۔ بچپن میں اسے نادر شاہ کے بھتیجے عادل شاہ کے حکم پر کاسٹ کیا گیا تھا اور 1758 میں اپنے والد کے قتل کے بعد وہ قاجاروں کا سردار بن گیا۔ اس نے 1785 میں تہران کو اپنا دارالحکومت بنایا، 1794 میں لطف علی خان کو پھانسی دی، 1796 میں تاج پوشی کی گئی اور 1797 میں اسے قتل کر دیا گیا۔ 1 ص۔ 268}۔"
  tr: "İran'daki Kaçar hanedanlığının kurucusu olan bu kişi, Hicri 1155/Miladi 1742 yılında doğmuş ve genç yaşta Nadir Şah'ın yeğeni Adil Şah'ın emriyle hadım edilmiştir. Babası 1758'de öldürüldükten sonra Kaçarların lideri olmuş ve 1785'te başkentini Tahran'a taşımıştır. 1796'da Şah olarak taç giymiş ve 1797'de suikaste uğramıştır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}"
  id: "Pendiri dinasti Qajar di Iran, ia lahir pada tahun 1155 H/1742 M, dan dikebiri pada masa mudanya atas perintah Adil Shah, keponakan Nader Shah. Setelah ayahnya terbunuh pada tahun 1758, ia menjadi pemimpin Qajar, dan memindahkan ibu kotanya ke Teheran pada tahun 1785. Ia kemudian dinobatkan sebagai Shah pada tahun 1796, dan dibunuh pada tahun 1797. {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
