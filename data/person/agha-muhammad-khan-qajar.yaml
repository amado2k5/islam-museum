summary:
  ar: "مؤسس الأسرة القاجارية في إيران، وُلد سنة 1155هـ/1742م، وأُخصي في صباه بأمر عادل شاه ابن أخي نادر شاه، وبعد مقتل أبيه سنة 1758 صار زعيم القاجاريين، ونقل عاصمته إلى طهران سنة 1785، ثم تُوّج شاهًا سنة 1796، واغتيل سنة 1797 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
  en: "Founder of the Qajar dynasty of Persia, born 1155/1742. As a child he was castrated on the order of 'Adil Shah, Nadir Shah's nephew, and after his father's murder in 1758 he became chief of the Qajars. He made Tehran his capital in 1785, executed Luft 'Ali Khan in 1794, was crowned in 1796 and was assassinated in 1797 {cite:encyclopaedia-of-islam-2 vol. 1 p. 268}."
