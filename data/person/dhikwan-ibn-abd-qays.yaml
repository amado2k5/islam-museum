summary:
  ar: "صحابي خزرجي من بني زريق، أبو السبع؛ هو وأسعد بن زرارة أول من قدم المدينة بالإسلام، وكان من أهل العقبة، واستشهد بأحد وقد أثنى عليه النبي يومها."
  en: "A Khazraji Companion of Banu Zurayq, known as Abu al-Sib'; he and As'ad ibn Zurara were the first to bring Islam to Medina. He was among the people of al-Aqaba and was martyred at Uhud, where the Prophet praised him."
  ur: "بنو زریق کا خزرجی صحابی، ابو السبع کہلاتا؛ وہ اور اسعد بن زرارہ سب سے پہلے مدینہ اسلام لائے اور وہ اہل عقبہ میں سے تھا۔"
  es: "Abu al-Sib', compañero de Banu Zurayq y miembro de la tribu Khazraji, fue uno de los primeros en llevar el Islam a Medina junto con As'ad ibn Zurara. Pertenecía a la gente de Aqaba y fue martirizado en Uhud, donde el Profeta lo elogió."
  fr: "Compagnon khazraji de la tribu des Banu Zurayq, connu sous le nom d'Abu al-Sib', il fut, avec As'ad ibn Zurara, l'un des premiers à introduire l'islam à Médine. Il vivait parmi les habitants d'al-Aqaba et fut martyrisé à Uhud, où le Prophète le loua."
  tr: "Banu Zurayq'tan Hazraj'ın bir yoldaşı olan Ebu el-Saba'; o, As'ad ibn Sürerah ile birlikte Medine'de İslam'a ilk geçen kişiydi. Akabe halkından gelmişti ve Uhud'da şehit edildi; Peygamber o gün onu övdü."
  id: "Seorang sahabat Khazraj dari Banu Zurayq, Abu al-Saba'; ia, bersama As'ad ibn Zurarah, adalah orang pertama yang memeluk Islam di Madinah. Ia berasal dari masyarakat Aqaba dan gugur di Uhud, dan Nabi memujinya pada hari itu."
