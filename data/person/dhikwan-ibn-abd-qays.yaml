summary:
  ar: "صحابي خزرجي من بني زريق، أبو السبع؛ هو وأسعد بن زرارة أول من قدم المدينة بالإسلام، وكان من أهل العقبة، واستشهد بأحد وقد أثنى عليه النبي يومها."
  en: "A Khazraji Companion of Banu Zurayq, known as Abu al-Sib'; he and As'ad ibn Zurara were the first to bring Islam to Medina. He was among the people of al-Aqaba and was martyred at Uhud, where the Prophet praised him."
  ur: "بنو زریق کا خزرجی صحابی، ابو السبع کہلاتا؛ وہ اور اسعد بن زرارہ سب سے پہلے مدینہ اسلام لائے اور وہ اہل عقبہ میں سے تھا۔"
