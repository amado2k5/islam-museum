summary:
  ar: "اقتصادي وسياسي غيني (وُلد 1952) من لابي، من شعب الفولا، تولّى مناصب وزارية متعاقبة في حكومة الرئيس لانسانا كونتي بين 1996 و2004، ثم رئاسة وزراء غينيا من 9 ديسمبر 2004 حتى إقالته في 5 أبريل 2006؛ ومنذ 2007 يرأس اتحاد القوى الديمقراطية الغيني المعارض، وفاز بالجولة الأولى من الانتخابات الرئاسية سنة 2010 قبل أن يخسر الجولة الثانية أمام ألفا كوندي، وترشّح مجدّدا في 2015 و2020."
  en: "Guinean economist and politician (born 1952) from Labé, a Fula who held a succession of ministerial posts in President Lansana Conté's government from 1996 to 2004 and served as Prime Minister of Guinea from 9 December 2004 until his dismissal on 5 April 2006; since 2007 he has led the opposition Union of Democratic Forces of Guinea (UFDG), won the first round of the 2010 presidential election before losing the runoff to Alpha Condé, and stood again in 2015 and 2020."
  ur: "گنی ماہرِ معاشیات و سیاست دان (پیدائش 1952ء)، لابے سے، فولا قوم سے تعلق؛ 1996ء تا 2004ء صدر لانسانا کونتے کی حکومت میں پے در پے وزارتی عہدوں پر رہے اور 9 دسمبر 2004ء تا 5 اپریل 2006ء گنی کے وزیرِ اعظم رہے؛ 2007ء سے حزبِ اختلاف اتحادِ قوتِ جمہوریہ گنی (UFDG) کے صدر ہیں، 2010ء کے صدارتی انتخاب کے پہلے مرحلے میں آگے رہے مگر دوسرے مرحلے میں الفا کوندے سے ہار گئے، اور 2015ء و 2020ء میں بھی امیدوار رہے۔"
