summary:
  ar: "باحث ومؤلف مسلم باكستاني كتب عن مسلمي العالم — منها «جيران باكستان المسلمون» (1950) — وعُيّن سنة 1952 لمساعدة هيكتور بوليثو في السيرة الرسمية لجناح، وتولّى سنة 1955 رئاسة قسم المنشورات في المؤتمر الإسلامي بالقاهرة."
  en: "Pakistani Muslim scholar and author of books on the Muslims of the world — among them The Muslim Neighbours of Pakistan (1950) — who was appointed in 1952 to assist Hector Bolitho's official biography of Jinnah and in 1955 headed the publications department of the Islamic Congress in Cairo."
  ur: "پاکستانی مسلم عالم اور مصنف، جنھوں نے دنیا کے مسلمانوں پر کتابیں لکھیں — ان میں «پاکستان کے مسلم ہمسائے» (1950) شامل ہے — 1952 میں جناح کی سرکاری سوانح پر ہیکٹر بولیتھو کی مدد کے لیے مقرر ہوئے اور 1955 میں قاہرہ میں اسلامی کانگریس کے شعبۂ اشاعت کے سربراہ تھے۔"
