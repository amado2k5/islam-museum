summary:
  ar: "محمد بن إبراهيم بن علي بن المرتضى الحسني القاسمي، أبو عبد الله، عز الدين، من آل الوزير: مجتهد باحث من أعيان اليمن، أخو الهادي بن إبراهيم، تعلم بصنعاء وصعدة ومكة، 775 إلى 840هـ؛ من كتبه «إيثار الحق على الخلق» و«العواصم والقواصم»."
  en: "Muhammad ibn Ibrahim ibn Ali ibn al-Murtada al-Hasani al-Qasimi, Abu Abdallah, Izz al-Din, of the house of al-Wazir: a mujtahid and researcher, one of the notables of Yemen and brother of al-Hadi ibn Ibrahim; educated at Sanaa, Sa'da and Mecca, 775 to 840 AH; author of «Ithar al-haqq ala al-khalq» and «al-Awasim wa-l-qawasim»."
  es: "Muhammad ibn Ibrahim ibn Ali ibn al-Murtada al-Hasani al-Qasimi, Abu Abdallah, Izz al-Din, de la casa de al-Wazir: mujtahid e investigador, uno de los notables de Yemen y hermano de al-Hadi ibn Ibrahim; educado en Sanaa, Sa'da y La Meca, 775 a 840 AH; autor de «Ithar al-haqq ala al-khalq» y «al-Awasim wa-l-qawasim»."
  fr: "Muhammad ibn Ibrahim ibn Ali ibn al-Murtada al-Hasani al-Qasimi, Abu Abdallah, Izz al-Din, de la maison d'al-Wazir: un mujtahid et chercheur, l'un des notables du Yémen et frère d'al-Hadi ibn Ibrahim; instruit à Sanaa, Sa'da et La Mecque, 775 à 840 AH; auteur de « Ithar al-haqq ala al-khalq » et « al-Awasim wa-l-qawasim »."
  ur: "محمد بن ابراہیم بن علی بن المرتضیٰ الحسنی القاسمی، ابو عبد اللہ، عزالدین، الوزیر کے گھر: ایک مجتہد اور محقق، یمن کے معززین میں سے ایک اور الہادی ابن ابراہیم کے بھائی؛ صنعاء، صعدہ اور مکہ میں تعلیم حاصل کی، 775 تا 840 ہجری؛ \"اطہر الحق علٰی الخلق\" اور \"الاعواسم و القواسم\" کے مصنف۔"
  tr: "Muhammed bin İbrahim ibn Ali ibn el-Murtada el-Hasani el-Kasimi, Ebu Abdullah, İzzdedin, el-Vezir ailesinden: Yemen'in önde gelen şahsiyetleri arasında müjtehid ve araştırmacı, el-Hadi ibn İbrahim'in kardeşi, 775-840 yılları arasında Sana'a, Saada'da ve Mekke'de eğitim görmüştür; kitapları arasında 'Yaratılışın Önüne Doğru Kayırmak' ve 'El-Awasim ve El-Ewasim el-Kəwasim' bulunmaktadır."
  id: "Muhammad ibn Ibrahim ibn Ali ibn al-Murtada al-Hasani al-Qasimi, Abu Abdullah, Izz al-Din, dari keluarga al-Wazir: seorang mujtahid dan peneliti di antara tokoh-tokoh terkemuka Yaman, saudara al-Hadi ibn Ibrahim, yang belajar di Sana'a, Saada, dan Mekah pada tahun 775 hingga 840 H; di antara bukunya adalah 'Favoring the Truth over Creation' dan 'Al-Awasim wa al-Qawasim'."
