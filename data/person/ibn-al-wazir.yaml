summary:
  ar: "محمد بن إبراهيم بن علي بن المرتضى الحسني القاسمي، أبو عبد الله، عز الدين، من آل الوزير: مجتهد باحث من أعيان اليمن، أخو الهادي بن إبراهيم، تعلم بصنعاء وصعدة ومكة، 775 إلى 840هـ؛ من كتبه «إيثار الحق على الخلق» و«العواصم والقواصم»."
  en: "Muhammad ibn Ibrahim ibn Ali ibn al-Murtada al-Hasani al-Qasimi, Abu Abdallah, Izz al-Din, of the house of al-Wazir: a mujtahid and researcher, one of the notables of Yemen and brother of al-Hadi ibn Ibrahim; educated at Sanaa, Sa'da and Mecca, 775 to 840 AH; author of «Ithar al-haqq ala al-khalq» and «al-Awasim wa-l-qawasim»."
