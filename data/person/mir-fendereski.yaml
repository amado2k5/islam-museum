  sources: [source/iranica-mir-fendereski, source/golha-mir-fendereski, source/wikipedia-fa-mir-fendereski]
  note: "Born probably in 970/1562-63: Iranica dates him 'probably born around 970/1562-63', since he died aged about eighty; the English article gives c. 1562 and the Persian 970 AH / 1563. The birthplace is disputed: the biographical tradition (the Persian article and Golha) names Findirisk in the Astarabad (Gorgan) region, the village his nisba preserves, while Iranica argues from his grandfather's flight into Khorasan and his father's eastern birth that he may have been born in the east of Persia, possibly Mashad, like his friend Mir Damad. No place entity for Findirisk exists in the museum, so no born_in edge is written."
died:
  edtf: "1640"
  hijri: "1050"
  precision: year
  status: debated
  sources: [source/iranica-mir-fendereski, source/golha-mir-fendereski]
  note: "Died in Isfahan in 1050/1640 and was buried in the Takht-e Fulad cemetery there, in the tomb known as Tikyih-yi Mir by the tomb of Baba Rukn al-Din; his tombstone is dated 1640, but a manuscript of the Ṣenāʿiya and a chronogram quatrain give 1639, and both readings are preserved — 1640 follows the tombstone and Iranica. Iranica corrects the story that he was buried in an iron casket as a misunderstanding of the Takht-e Fulad burial. He left his library to Shah Safi."
