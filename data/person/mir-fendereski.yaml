summary:
  ar: "مير فندرسكي ⁦(نحو ١٥٦٢/٦٣–١٦٤٠م)⁩ فيلسوف ومتصوّف وشاعر صفوي من مدرسة أصفهان، اشتهر بتدريس فلسفة ابن سينا وبأسفاره المتكررة إلى الهند المغولية حيث علّق على ترجمة «يوغا فاسيشتا» الفارسية ووضع معجماً لمصطلحاتها."
  en: "Mir Fendereski (c. 1562/63–1640) was a Safavid philosopher, mystic and poet of the School of Isfahan, famed as a teacher of Avicenna and for his repeated journeys to Mughal India, where he annotated the Persian Yoga Vāsiṣṭhā and compiled a glossary of its terms."
faith:
  - value: shia-twelver
    basis: documented
    note: "Two independent texts attest the affiliation for the man himself: the Golha biographical entry opens by calling him an 'Imami mystic, philosopher, and poet', and Encyclopaedia Iranica describes his treatise on badāʾ — a distinctively Imami doctrine — as arguing from narrations of the Imams against Ṭusi's rejection of it, and notes his inclusion in Aʿyān al-shiʿa, the biographical dictionary of Shi'a notables. 'Imami' names the Twelver branch itself, so the value is recorded as shia-twelver by that mapping. Structured data alone (the Persian article's infobox, madhhab: Shi'a) was not used."
