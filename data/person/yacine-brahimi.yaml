summary:
  ar: "لاعب كرة قدم جزائري محترف ⁦(وُلد سنة 1990 في باريس لأبوين جزائريين)⁩، لاعب وسط هجومي تدرّب في أكاديمية كليرفونتين ولعب لرين وغرناطة وبورتو ثم الريان والغرافة في قطر، وخاض أكثر من سبعين مباراة دولية مع الجزائر وفاز بكأس الأمم الأفريقية 2019 وكأس العرب 2021."
  en: "Algerian professional footballer (born 1990 in Paris to Algerian parents). An attacking midfielder trained at the Clairefontaine academy who played for Rennes, Granada and Porto before moving to Qatar with Al-Rayyan and Al-Gharafa, he has won over seventy caps for Algeria and won the 2019 Africa Cup of Nations and the 2021 FIFA Arab Cup with them."
  ur: "الجزائری پیشہ ور فٹبالر ⁦(پیدائش 1990، پیرس، الجزائری والدین کے ہاں)⁩۔ کلیئرفونٹین اکیڈمی سے تربیت یافتہ حملہ آور مڈفیلڈر جو رین، غرناطہ اور پورٹو کے لیے کھیلے، پھر قطر میں الریان اور الغرافہ منتقل ہوئے؛ انہوں نے الجزائر کے لیے ستر سے زائد بین الاقوامی میچ کھیلے اور 2019 افریقہ کپ آف نیشنز اور 2021 فیفا عرب کپ جیتا۔"
  es: "Futbolista profesional argelino (nacido en 1990 en París de padres argelinos). Centrocampista ofensivo formado en la academia Clairefontaine, jugó en el Rennes, el Granada y el Porto antes de trasladarse a Qatar para jugar en el Al-Rayyan y el Al-Gharafa. Ha sido internacional con Argelia en más de setenta ocasiones y ganó la Copa Africana de Naciones 2019 y la Copa Árabe de la FIFA 2021 con la selección."
  fr: "Footballeur professionnel algérien (né en 1990 à Paris de parents algériens). Milieu offensif formé à l'académie de Clairefontaine, il a évolué à Rennes, Grenade et Porto avant de rejoindre le Qatar et les clubs d'Al-Rayyan et d'Al-Gharafa. Il compte plus de soixante-dix sélections en équipe nationale d'Algérie et a remporté la Coupe d'Afrique des Nations 2019 et la Coupe arabe de la FIFA 2021."
  tr: "Cezayirli profesyonel futbolcu (1990 yılında Paris'te Cezayirli ebeveynlerin çocuğu olarak doğdu), Clairefontaine akademisinde eğitim almış ve Rennes, Granada, Porto, ardından Katar'da Al Rayyan ve Al-Gharafa takımlarında oynamış hücum orta saha oyuncusudur. Cezayir ile yetmişten fazla uluslararası maçta oynamış ve 2019 Afrika Uluslar Kupası ile 2021 Arap Kupası'nı kazanmıştır."
  id: "Seorang pesepakbola profesional asal Aljazair (lahir tahun 1990 di Paris dari orang tua Aljazair), gelandang serang yang berlatih di akademi Clairefontaine dan bermain untuk Rennes, Granada, Porto, lalu Al Rayyan, dan Al-Gharafa di Qatar. Ia telah bermain lebih dari tujuh puluh pertandingan internasional bersama Aljazair dan memenangkan Piala Afrika 2019 serta Piala Arab 2021."
