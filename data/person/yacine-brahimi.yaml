summary:
  ar: "لاعب كرة قدم جزائري محترف (وُلد سنة 1990 في باريس لأبوين جزائريين)، لاعب وسط هجومي تدرّب في أكاديمية كليرفونتين ولعب لرين وغرناطة وبورتو ثم الريان والغرافة في قطر، وخاض أكثر من سبعين مباراة دولية مع الجزائر وفاز بكأس الأمم الأفريقية 2019 وكأس العرب 2021."
  en: "Algerian professional footballer (born 1990 in Paris to Algerian parents). An attacking midfielder trained at the Clairefontaine academy who played for Rennes, Granada and Porto before moving to Qatar with Al-Rayyan and Al-Gharafa, he has won over seventy caps for Algeria and won the 2019 Africa Cup of Nations and the 2021 FIFA Arab Cup with them."
  ur: "الجزائری پیشہ ور فٹبالر (پیدائش 1990، پیرس، الجزائری والدین کے ہاں)۔ کلیئرفونٹین اکیڈمی سے تربیت یافتہ حملہ آور مڈفیلڈر جو رین، غرناطہ اور پورٹو کے لیے کھیلے، پھر قطر میں الریان اور الغرافہ منتقل ہوئے؛ انہوں نے الجزائر کے لیے ستر سے زائد بین الاقوامی میچ کھیلے اور 2019 افریقہ کپ آف نیشنز اور 2021 فیفا عرب کپ جیتا۔"
