summary:
  ar: "صاحب ماردين وليها بعد أخيه سقمان وكانا من أمراء تتش صاحب الشام، وكان إيلغازي قد استولى على حلب بعد موت أولاد تتش واستولى على ميافارقين وكان فارساً شجاعاً كثير الغزو كثير العطاء، توفي سنة ست عشرة وخمس مئة وولي بعده بماردين ابنه حسام الدين تمرتاش {cite:shadharat-dhahab p. 529}."
  en: "Najm al-Din Ilghazi the Artuqid, lord of Mardin then Aleppo — a brave raiding horseman of open hand; he died in 516 and his son Husam al-Din Timurtash succeeded at Mardin {cite:shadharat-dhahab p. 529}."
  es: "Najm al-Din Ilghazi el Artuqid, señor de Mardin y luego de Alepo, un valiente jinete asaltante de mano abierta; murió en 516 y su hijo Husam al-Din Timurtash le sucedió en Mardin {cite:shadharat-dhahab p. 529}."
  fr: "Najm al-Din Ilghazi l'Artuqid, seigneur de Mardin puis d'Alep — un courageux cavalier pillard à mains nues; il mourut en 516 et son fils Husam al-Din Timurtash lui succéda à Mardin {cite:shadharat-dhahab p. 529}."
  ur: "نجم الدین الغازی آرتوقید، ماردین کا آقا پھر حلب — ایک بہادر چھاپہ مار گھڑ سوار۔ اس کا انتقال 516 میں ہوا اور اس کا بیٹا حسام الدین تیمورتاش ماردین پر تخت نشین ہوا۔ 529}۔"
  tr: "Mardin'in hükümdarının yerine kardeşi Saqman geçti ve onlar Levant'ın hükümdarı Tatiş prensleri arasındaydılar. İlghazi, Tach'ın oğullarının ölümünden sonra Halep'i ele geçirmiş ve Miafariqin'i ele geçirmişti. Sık sık savaşan ve çok şey veren cesur bir şövalyeydi. 1650 Hicri yılında öldü ve Mardin'de yerine oğlu Husam al-Din Tamartaş geçti {cite:shadharat-dhahab, s. 529}."
  id: "Penguasa Mardin digantikan oleh saudaranya Saqman, dan mereka termasuk di antara para pangeran Tatish, penguasa Levant. Ilghazi telah merebut Aleppo setelah kematian putra-putra Tach, dan ia telah merebut Miafariqin. Ia adalah ksatria pemberani yang sering bertempur dan memberikan banyak kontribusi. Ia meninggal pada tahun 1650 H, dan digantikan di Mardin oleh putranya Husam al-Din Tamartash {cite:shadharat-dhahab, hlm. 529}."
