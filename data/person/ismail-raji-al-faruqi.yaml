summary:
  ar: "فيلسوف فلسطيني أمريكي متخصص في الأديان المقارنة والفكر الإسلامي ⁦(1921–1986)⁩. أسّس برنامج الدراسات الإسلامية بجامعة تيمبل وشارك في تأسيس المعهد العالمي للفكر الإسلامي ⁦(IIIT)⁩، ودعا إلى مشروع «أسلمة المعرفة»، ومن كتبه «التوحيد: مضامينه على الفكر والحياة» و«الأطلس الثقافي الإسلامي»."
  en: "Palestinian-American philosopher of comparative religion and Islamic thought (1921–1986). He founded the Islamic studies program at Temple University, co-founded the International Institute of Islamic Thought (IIIT) and championed the 'Islamization of Knowledge' project; his books include Al-Tawhid: Its Implications for Thought and Life and the Cultural Atlas of Islam."
  ur: "فلسطینی امریکی فلسفی اور تقابلِ ادیان و اسلامی فکر کے ماہر ⁦(1921–1986)⁩۔ انہوں نے ٹیمپل یونیورسٹی میں اسلامیات کا پروگرام قائم کیا، انٹرنیشنل انسٹیٹیوٹ آف اسلامک تھاٹ ⁦(IIIT)⁩ کے بانیوں میں تھے اور «اسلامائزیشن آف نالج» کے منصوبے کے حامی تھے؛ ان کی کتابوں میں «التوحید: مضامینہ علی الفکر والحیاۃ» اور «ثقافتی اطلسِ اسلام» شامل ہیں۔"
  es: "Filósofo palestino-estadounidense de religión comparada y pensamiento islámico (1921-1986). Fundó el programa de estudios islámicos en la Universidad de Temple, cofundó el Instituto Internacional de Pensamiento Islámico (IIIT) e impulsó el proyecto de «islamización del conocimiento». Entre sus libros destacan Al-Tawhid: Sus implicaciones para el pensamiento y la vida y El atlas cultural del Islam."
