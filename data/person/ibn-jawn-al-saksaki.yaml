summary:
  ar: "أحد الرجلين اللذين قتلا عمار بن ياسر بصفين مع أبي العادية العاملي، وتنازعا سلبه حتى أبعدهما عبد الله بن عمرو بن العاص بحديث النبي في عمار {cite:muruj-al-dhahab p. 673}."
  en: "'Ammar ibn Yasir's co-killer at Siffin with Abu'l-'Adiyya — dismissed from the spoils-claim by 'Abd Allah ibn 'Amr's citation of the Prophet's praise of 'Ammar {cite:muruj-al-dhahab p. 673}."
  es: "'Ammar ibn Yasir, coautor del asesinato en Siffin junto con Abu'l-'Adiyya, fue excluido de la reclamación de botín por la cita de 'Abd Allah ibn 'Amr de los elogios del Profeta a 'Ammar {cite:muruj-al-dhahab p. 673}."
  fr: "Le co-tueur d'Ammar ibn Yasir à Siffin avec Abu'l-'Adiyya — écarté de la revendication du butin par la citation par 'Abd Allah ibn 'Amr de l'éloge du Prophète à l'égard d'Ammar {cite:muruj-al-dhahab p. 673}."
  ur: "عمار بن یاسر کا ابو العدیہ کے ساتھ صفین میں شریک قاتل - عبد اللہ بن عمرو کی طرف سے عمار کی تعریف کے حوالے سے مال غنیمت کے دعوے سے خارج۔ 673}۔"
  tr: "Ebu el-Adiyah el-Amili ile birlikte Siffin'de Ammar ibn Yasir'i öldüren iki adamdan biri, esir alınmasına karşı çıktılar ve Abdullah ibn Amr ibn al-As, Peygamber'in Ammar hakkındaki hadislerine dayanarak onları kovdu {atı:muruj-al-dhahab s. 673}."
  id: "Salah satu dari dua orang yang membunuh Ammar ibn Yasir di Siffin bersama Abu al-'Adiyah al-Amili, dan mereka memperdebatkan penangkapannya hingga Abdullah ibn Amr ibn al-As mengusir mereka berdasarkan hadis Nabi tentang Ammar {cite:muruj-al-dhahab hlm. 673}."
