summary:
  ar: "أديب وشاعر وناقد مصري (1889-1964)، وُلد في أسوان وكان عصاميّ التعليم. شارك في تأسيس مدرسة الديوان الشعرية، وجلس في مجلس النواب، وألّف أكثر من مئة كتاب منها سلسلة «العبقريات»، وكان عضوًا في مجمع اللغة العربية بالقاهرة."
  en: "Egyptian writer, poet and literary critic (1889-1964), born at Aswan and self-educated. He co-founded the Diwan school of poetry, sat in the Egyptian parliament, wrote more than a hundred books including the Abqariyyat ('Geniuses') biographies, and was a member of the Academy of the Arabic Language in Cairo."
  fr: "Écrivain, poète et critique littéraire égyptien (1889-1964), né à Assouan et autodidacte. Il cofonda l'école poétique du Diwan, siégea au parlement égyptien, écrivit plus d'une centaine de livres, dont les biographies des Abqariyyat (« Génies »), et fut membre de l'Académie de langue arabe du Caire."
  ur: "مصری ادیب، شاعر اور نقاد (1889-1964)، اسوان میں پیدا ہوئے اور خود آموز تھے۔ انہوں نے دیوان شاعری مکتب کی بنیاد میں حصہ لیا، مصری پارلیمنٹ کے رکن رہے، سو سے زائد کتابیں لکھیں جن میں «العبقریات» سلسلہ بھی ہے، اور قاہرہ کی عربی زبان اکیڈمی کے رکن تھے۔"
  es: "Escritor, poeta y crítico literario egipcio (1889-1964), nacido en Asuán y autodidacta. Cofundó la escuela de poesía Diwan, fue miembro del parlamento egipcio, escribió más de cien libros, entre ellos las biografías de los Abqariyyat («Genios»), y fue miembro de la Academia de la Lengua Árabe en El Cairo."
  tr: "Mısırlı yazar, şair ve eleştirmen (1889-1964), Aswan'da doğdu ve kendi kendini yetiştirdi. Divan Şiir Okulu'nun kuruluşuna katıldı, Temsilciler Meclisi'nde görev yaptı, \"Dahiler\" serisi de dahil olmak üzere yüzden fazla kitap yazdı ve Kahire'deki Arap Dili Akademisi üyesiydi."
  id: "Seorang penulis, penyair, dan kritikus Mesir (1889-1964), ia lahir di Aswan dan belajar secara otodidak. Ia berpartisipasi dalam pendirian Sekolah Puisi Diwan, duduk di Dewan Perwakilan Rakyat, menulis lebih dari seratus buku, termasuk seri \"Para Jenius\", dan merupakan anggota Akademi Bahasa Arab di Kairo."
