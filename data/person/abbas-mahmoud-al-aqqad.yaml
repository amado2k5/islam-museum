summary:
  ar: "أديب وشاعر وناقد مصري (1889-1964)، وُلد في أسوان وكان عصاميّ التعليم. شارك في تأسيس مدرسة الديوان الشعرية، وجلس في مجلس النواب، وألّف أكثر من مئة كتاب منها سلسلة «العبقريات»، وكان عضوًا في مجمع اللغة العربية بالقاهرة."
  en: "Egyptian writer, poet and literary critic (1889-1964), born at Aswan and self-educated. He co-founded the Diwan school of poetry, sat in the Egyptian parliament, wrote more than a hundred books including the Abqariyyat ('Geniuses') biographies, and was a member of the Academy of the Arabic Language in Cairo."
  ur: "مصری ادیب، شاعر اور نقاد (1889-1964)، اسوان میں پیدا ہوئے اور خود آموز تھے۔ انہوں نے دیوان شاعری مکتب کی بنیاد میں حصہ لیا، مصری پارلیمنٹ کے رکن رہے، سو سے زائد کتابیں لکھیں جن میں «العبقریات» سلسلہ بھی ہے، اور قاہرہ کی عربی زبان اکیڈمی کے رکن تھے۔"
