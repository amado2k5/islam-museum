summary:
  ar: "بطاقة أولية لشاهرخ ميرزا الأفشاري، حفيد نادر شاه وآخر حكام الأفشاريين في خراسان، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Shahrukh Mirza Afshar, grandson of Nadir Shah and the last Afsharid ruler in Khurasan, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Shahrukh Mirza Afshar, nieto de Nadir Shah y último gobernante Afsharid en Jorasán, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de candidature de Shahrukh Mirza Afshar, petit-fils de Nadir Shah et dernier souverain Afsharide du Khorasan, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "نادر شاہ کے پوتے اور خراسان کے آخری افشاری حکمران شاہ رخ مرزا افشار کے لیے ڈرافٹ کارڈ، جس کا نام کھلے حوالہ سے بیان کیا گیا ⁦(وکی ڈیٹا)⁩؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Nadir Şah'ın torunu ve Horasan'daki son Afşari hükümdarı olan Shahrukh Mirza al-Afshar'ın ön kartı açık bir referans açıklamasında (Wikidata) geçmektedir. Hasan İbrahim'in Tarikh al-Islam çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal Shahrukh Mirza al-Afshar, cucu Nader Shah dan penguasa Afsharid terakhir di Khorasan, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam Tarikh al-Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
