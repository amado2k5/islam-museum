summary:
  ar: "عبد الله بن محمد بن عبد الله بن علي العجمي الشنشوري، فرضي من فقهاء الشافعية وخطيب الجامع الأزهر، نسبته إلى شنشور من قرى المنوفية، توفي سنة 999 هـ، من كتبه «فتح القريب المجيب» و«الفوائد الشنشورية»."
  en: "Abdallah ibn Muhammad ibn Abdallah ibn Ali al-Ajami al-Shinshawri, a specialist in the law of inheritance and one of the Shafi'i jurists, khatib of the mosque of al-Azhar, named for Shinshur, a village of al-Minufiyya; he died in 999 AH. His books include 'Fath al-Qarib al-Mujib' and 'al-Fawa'id al-Shinshuriyya'."
