summary:
  ar: "عالم وإمام بريطاني من برمنغهام. حفظ القرآن في الثالثة عشرة، وحصل على منحة للدراسة في الجامعة الإسلامية بالمدينة المنورة سنة 2000 وتخرّج في كلية الشريعة سنة 2006، ثم نال الدكتوراه في الفقه الإسلامي من جامعة برمنغهام. وهو إمام وخطيب في مسجد غرين لين، ويرأس قسم علوم القرآن والحديث في معهد المغرب."
  en: "British scholar and imam from Birmingham. He memorised the Qur'an at thirteen, won a scholarship to the Islamic University of Madinah in 2000 and graduated from its Faculty of Shari'ah in 2006, then completed a PhD in Islamic law at the University of Birmingham. He is an imam and khateeb at Green Lane Masjid and heads AlMaghrib Institute's department of Qur'an and Hadith sciences; Muslim Central carries some 600 of his lectures."
  ur: "برمنگھم سے تعلق رکھنے والے برطانوی عالم و امام۔ انہوں نے تیرہ برس کی عمر میں قرآن حفظ کیا، 2000 میں جامعہ اسلامیہ مدینہ منورہ کی اسکالرشپ حاصل کی اور 2006 میں کلیہ شریعہ سے فارغ ہوئے، پھر برمنگھم یونیورسٹی سے اسلامی قانون میں پی ایچ ڈی کی۔ وہ گرین لین مسجد کے امام و خطیب ہیں اور المغرب انسٹی ٹیوٹ کے شعبہ علوم قرآن و حدیث کے سربراہ ہیں۔"
