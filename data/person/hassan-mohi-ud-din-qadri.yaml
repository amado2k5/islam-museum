summary:
  ar: "عالم وباحث قانوني باكستاني، وهو الابن الأكبر لمحمد طاهر القادري ورئيس المجلس الأعلى لمنهاج القرآن الدولية، وعميد كلية الحقوق بجامعة منهاج لاهور. نال الدكتوراه من جامعة الدول العربية بالقاهرة سنة 2012 عن أطروحة في دستور المدينة والمبادئ الدستورية الحديثة، وله أكثر من عشرين كتابا. بلغت قناته على يوتيوب نحو 104 آلاف مشترك في نوفمبر 2026."
  en: "A Pakistani scholar and legal researcher, the elder son of Muhammad Tahir-ul-Qadri and chairman of the Supreme Council of Minhaj-ul-Quran International, and Dean of Law at Minhaj University Lahore. He took his PhD at Arab League University, Cairo, in 2012, with a thesis on the Constitution of Medina and modern constitutional principles, and has authored more than twenty books. His YouTube channel counted some 104,000 subscribers in November 2026."
  ur: "پاکستانی عالم اور قانونی محقق، محمد طاہر القادری کے بڑے صاحبزادے اور منہاج القرآن انٹرنیشنل کی سپریم کونسل کے چیئرمین، اور منہاج یونیورسٹی لاہور کے ڈینِ قانون۔ انہوں نے 2012 میں عرب لیگ یونیورسٹی، قاہرہ سے دستورِ مدینہ اور جدید آئینی اصولوں پر مقالے کے ساتھ پی ایچ ڈی کی، اور ان کی بیس سے زائد کتابیں ہیں۔ نومبر 2026 میں ان کے یوٹیوب چینل کے تقریباً 104 ہزار سبسکرائبر تھے۔"
