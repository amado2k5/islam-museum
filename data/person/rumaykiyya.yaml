id: person/rumaykiyya
class: person
label: { ar: "الرميكية اعتماد" }
summary:
  ar: "اعتماد المشتبه بالرميكية جارية المعتمد بن عباد وأم أولاده الملوك النجباء؛ في المسهب والمغرب أن المعتمد ركب في النهر ومعه ابن عمار وزيره وقد زردت الريح الماء فقال ابن عباد لابن عمار أجز صنع الريح من الماء زرد فأطال ابن عمار الفكرة فقالت امرأة من الغسالات أي درع لقتال لو جمد فتعجب ابن عباد من حسن ما أتت به مع عجز ابن عمار ونظر إليها فإذا هي صورة حسنة فسألها أذات زوج هي فقالت لا فتزوجها، وحكى البعض بسنده إلى بعض أدباء الأندلس أنه هو الذي أجاز الملك عجز البيت، ولما خُلع المعتمد وسُجن بأغمات قالت له يا سيدي لقد هنا هنا فأجابها بالبيت المشهور، وقالت له وقد مرض ما لنا قدرة على مرضاتك في مرضاتك، ولما قتل المعتمد ابن عمار وترك الطبرزين في رأسه قالت قد بقي ابن عمار مدهناً {cite:nafh-tib-maqqari p. 211-212}."
  en: "I'timad, known as al-Rumaykiyya — the washerwoman who capped al-Mu'tamid's verse on the wind-rippled river ('any mail-coat for battle, had it frozen'), became his wife and mother of his royal sons; in the Aghmat prison she told him 'we have grown low here', and when Ibn Ammar lay dead with the axe in his skull she said 'Ibn Ammar is still anointed' {cite:nafh-tib-maqqari p. 211-212}."
  es: "I'timad, conocida como al-Rumaykiyya —la lavandera que remató el verso de al-Mu'tamid sobre el río rizado por el viento ('cualquier cota de malla para la batalla, que se hubiera congelado')— se convirtió en su esposa y madre de sus hijos reales; en la prisión de Aghmat le dijo 'hemos caído en desgracia aquí', y cuando Ibn Ammar yacía muerto con el hacha clavada en el cráneo dijo 'Ibn Ammar sigue ungido' {cite:nafh-tib-maqqari p. 211-212}."
  fr: "I'timad, connue sous le nom d'al-Rumaykiyya — la lavandière qui conclut le vers d'al-Mu'tamid sur la rivière ridée par le vent (« toute cotte de mailles pour le combat, l'avait gelée »), devint son épouse et la mère de ses fils royaux; dans la prison d'Aghmat, elle lui dit « nous sommes tombés bas ici », et quand Ibn Ammar gisait mort avec la hache dans le crâne, elle dit « Ibn Ammar est toujours oint » {cite: nafh-tib-maqqari p. 211-212}."
  ur: "I'timad، جسے الرمیکیہ کے نام سے جانا جاتا ہے - وہ دھوبی جس نے ہوا سے چلنے والے دریا پر المتمید کی آیت کو ڈھانپ دیا تھا ⁦('جنگ کے لئے کوئی بھی میل کوٹ، اسے منجمد کر دیا گیا تھا')⁩، اس کی بیوی اور اس کے شاہی بیٹوں کی ماں بن گئی؛ اخمت جیل میں اس نے اس سے کہا کہ 'ہم یہاں پست ہو گئے ہیں'، اور جب ابن عمار نے اپنی کھوپڑی میں کلہاڑی مار کر مردہ رکھا تو اس نے کہا 'ابن عمار ابھی تک مسح شدہ ہیں'۔ 211-212}۔"
  tr: "Şüpheli Ramikiya, Al-Mu'tamid ibn Abbad'ın köle kızına ve soylu kraliyet çocuklarının annesine bağlıydı; Al-Mushab wa al-Maghrib'de, Al-Mu'tamid bakanı İbn Ammar ile birlikte nehirde gezdi ve rüzgar suyu üfledi. İbn Abbad, İbn Ammar'a, 'Rüzgarı sudan yapmak caiz mi?' dedi. İbn Ammar fikrini uzattı ve çamaşır makinesinden bir kadın, 'Donarsa ne tür bir zırhla savaşılır?' dedi. İbn Abbad, İbn Ammar'ın yetersizliğine rağmen getirdiği güzelliğe hayran kaldı, ona baktı ve bunun güzel bir görüntü olduğunu gördü, ona koca olup olmadığını sordu, o da hayır dedi. Onunla evlendi ve bazıları, bazı Endülüslü edebiyatçılara zincirle anlattılar ki, kralın evi etkisiz hale getirmesine izin veren kişi oydu. Al-Mu'tamid tahttan indirilip Aghmat'ta hapsedildiğinde, ona 'Efendim, o burada,' dedi, o da ünlü ayetle 'Hastalığında seni memnun edecek gücümüz yok.' dedi. Al-Mu'tamid İbn Ammar'ı öldürüp başına iki tebrazini bıraktığında, 'İbn Ammar meshedilmiş kaldı.' dedi. {atıf:nafh-tib-maqqari, s. 211-212}."
  id: "Ramikiya yang diduga bergantung pada budak perempuan Al-Mu'tamid ibn Abbad dan ibu dari anak-anak bangsawannya; di Al-Mushab wa al-Maghrib, Al-Mu'tamid menunggang sungai bersama Ibn Ammar, menterinya, dan angin meniup air. Ibn Abbad berkata kepada Ibn Ammar, 'Apakah diperbolehkan membuat angin dari air?' Ibn Ammar memperpanjang gagasan itu, dan seorang wanita dari mesin cuci berkata, 'Baju zirah apa yang harus dilawan jika membeku?' Ibn Abbad takjub dengan keindahan apa yang dibawanya meskipun Ibn Ammar tidak mampu, memandangnya, dan melihat itu adalah gambar yang baik lalu bertanya apakah dia suami, dan dia menjawab tidak. Ia menikahinya, dan beberapa menceritakan melalui rangkaian penularan kepada beberapa literati Andalusia bahwa dialah yang memberi wewenang kepada raja agar tidak mampu membuat rumah itu lumpuh. Ketika al-Mu'tamid digulingkan dan dipenjara di Aghmat, ia berkata kepadanya, 'Tuan, ia ada di sini,' dan ia menjawab dengan ayat terkenal itu, berkata, 'Dan kami tidak punya kuasa untuk menyenangkan Anda dalam sakitmu.' Ketika al-Mu'tamid membunuh Ibn Ammar dan meninggalkan dua tabrazin di kepalanya, ia berkata, 'Ibn Ammar tetap diurapi.' {cite:nafh-tib-maqqari, hlm. 211-212}."
