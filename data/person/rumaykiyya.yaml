label: { ar: "الرميكية اعتماد" }
summary:
  ar: "اعتماد المشتبه بالرميكية جارية المعتمد بن عباد وأم أولاده الملوك النجباء؛ في المسهب والمغرب أن المعتمد ركب في النهر ومعه ابن عمار وزيره وقد زردت الريح الماء فقال ابن عباد لابن عمار أجز صنع الريح من الماء زرد فأطال ابن عمار الفكرة فقالت امرأة من الغسالات أي درع لقتال لو جمد فتعجب ابن عباد من حسن ما أتت به مع عجز ابن عمار ونظر إليها فإذا هي صورة حسنة فسألها أذات زوج هي فقالت لا فتزوجها، وحكى البعض بسنده إلى بعض أدباء الأندلس أنه هو الذي أجاز الملك عجز البيت، ولما خُلع المعتمد وسُجن بأغمات قالت له يا سيدي لقد هنا هنا فأجابها بالبيت المشهور، وقالت له وقد مرض ما لنا قدرة على مرضاتك في مرضاتك، ولما قتل المعتمد ابن عمار وترك الطبرزين في رأسه قالت قد بقي ابن عمار مدهناً {cite:nafh-tib-maqqari p. 211-212}."
  en: "I'timad, known as al-Rumaykiyya — the washerwoman who capped al-Mu'tamid's verse on the wind-rippled river ('any mail-coat for battle, had it frozen'), became his wife and mother of his royal sons; in the Aghmat prison she told him 'we have grown low here', and when Ibn Ammar lay dead with the axe in his skull she said 'Ibn Ammar is still anointed' {cite:nafh-tib-maqqari p. 211-212}."
