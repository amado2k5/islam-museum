summary:
  ar: "عاصم علام (1 آب 1939 – 2 كانون الأول 2022)، رجل أعمال مصري بريطاني هاجر إلى بريطانيا سنة 1968 ودرس الاقتصاد في جامعة هال. بنى شركة علام مارين لصناعة المولدات الصناعية، ونال لقب رائد أعمال العام في المملكة المتحدة سنة 2006، وامتلك نادي هال سيتي لكرة القدم بين 2010 و2022."
  en: "Assem Allam (1 August 1939 – 2 December 2022) was an Egyptian-British businessman who moved to Britain in 1968 and studied economics at the University of Hull. He built Allam Marine, an industrial generator manufacturer, was named UK Entrepreneur of the Year in 2006, and owned Hull City A.F.C. from 2010 to 2022."
  ur: "عاصم علام (1 اگست 1939 – 2 دسمبر 2022) مصری برطانوی کاروباری شخصیت تھے جو 1968 میں برطانیہ منتقل ہوئے اور انہوں نے یونیورسٹی آف ہل سے معاشیات کی تعلیم حاصل کی۔ انہوں نے صنعتی جنریٹر بنانے والی کمپنی علام میرین قائم کی، 2006 میں برطانیہ کے سال کے بہترین کاروباری قرار پائے، اور 2010 سے 2022 تک ہل سٹی فٹ بال کلب کے مالک رہے۔"

