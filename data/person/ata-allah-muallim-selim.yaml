summary:
  ar: "المولى عطاء الله مدرساً بإزنيق ثم بأدرنة ثم بالدر الأربعين منه إلى الستين منه إلى الثمانين ثم قاضي العسكر، وصار أستاذاً للسلطان سليم بن سليمان الذي هو الآن جالس على التخت، وتوفي بداية صفر {cite:shadharat-dhahab p. 388}."
  en: "Molla 'Ata' Allah al-Konari — madrasa teacher at Iznik then Edirne, up the dar ladder to the eighty, then qadi 'askar, and teacher of Sultan Selim b. Sulayman while he reigned; died at the start of Safar 979 {cite:shadharat-dhahab p. 388}."
  es: "Molla 'Ata' Allah al-Konari — maestro de madrasa en Iznik y luego en Edirne, ascendió en la jerarquía hasta los ochenta, luego fue qadi 'askar y maestro del sultán Selim b. Sulayman durante su reinado; murió al comienzo de Safar 979 {cita: shadharat-dhahab p. 388}."
  fr: "Molla 'Ata' Allah al-Konari — professeur de madrasa à Iznik puis Edirne, gravissant les échelons jusqu'au niveau quatre-vingt, puis cadi 'askar, et professeur du sultan Selim b. Sulayman pendant son règne; décédé au début de Safar 979 {cite: shadharat-dhahab p. 388}."
