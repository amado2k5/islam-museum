summary:
  en: "The Khuzaʾi ruler of Mecca who gave his daughter Hubba in marriage to Qusayy ibn Kilab; on his death the contest between Quraysh and Khuzaʾa over the custody of the Kaaba began."
  ar: "والي مكة من خزاعة، زوّج ابنته حُبّى لقُصيّ بن كلاب؛ وبموته بدأ النزاع بين قريش وخزاعة على ولاية البيت وأمر مكة."
  es: "El gobernante Khuzaʾi de La Meca, que casó a su hija Hubba con Qusayy ibn Kilab; tras su muerte, comenzó la disputa entre Quraysh y Khuzaʾa por la custodia de la Kaaba."
  fr: "Le souverain khuzaʾi de La Mecque qui donna sa fille Hubba en mariage à Qusayy ibn Kilab; à sa mort commença la lutte entre les Quraysh et les Khuzaʾa pour la garde de la Kaaba."
  ur: "مکہ کا خزاعی حکمران جس نے اپنی بیٹی حبہ کو قصی ابن کلاب سے نکاح میں دے دیا۔ ان کی وفات پر قریش اور خزاعہ کے درمیان خانہ کعبہ کی حفاظت پر مقابلہ شروع ہوا۔"
  tr: "Mekke'nin Huza'ah'lı valisi, kızı Hibi'yi Qusay ibn Kilab ile evlendirdi; onun ölümüyle, Kureyş ile Huza'ah arasında evin vasiliği ve Mekke'nin yönetimi konusundaki anlaşmazlık başladı."
  id: "Gubernur Mekah dari Khuza'ah, yang menikahkan putrinya Hibi dengan Qusay ibn Kilab; dengan kematiannya, perselisihan antara Quraisy dan Khuza'ah mengenai wali Wangsa dan administrasi Mekah pun dimulai."
