summary:
  ar: "ابنة حاتم الطائي وأخت عدي؛ أصابتها خيل النبي في سبايا طيء بعد هرب عدي إلى الشام، فكلّمت النبي ثلاث مرات: هلك الوالد وغاب الوافد فامنن علي، فأطلقها وكساها وحملها وأعطاها نفقة؛ ولحقت بأخيها بالشام فلامته ثم أشارت عليه أن يلحق بالنبي سريعاً. لا تسمّيها السيرة، ويرجّح السهيلي، كما ينقل المحققون، أنها سفّانة إذ لا تُعرف لحاتم ابنة غيرها."
  en: "Hatim al-Ta'i's daughter and Adi's sister; the Prophet's cavalry took her among the captives of Tayy after Adi fled to Syria, and three times she addressed the Prophet, the father is dead and the envoy absent, be gracious to me, until he released her, clothed her, mounted her and gave her provision. She joined her brother in Syria, rebuked him, then advised him to hasten to the Prophet. The sira leaves her unnamed; al-Suhayli, as the editors report, identifies her as Saffana, Hatim's only known daughter."
