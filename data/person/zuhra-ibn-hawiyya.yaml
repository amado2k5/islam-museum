label: { ar: "زهرة بن حوية السعدي", en: "Zuhra ibn Hawiyya al-Sa'di", es: "Zuhra ibn Hawiyya al-Sa'di", fr: "Zuhra ibn Hawiyya al-Sa'di", ur: "زہرہ بن حویہ السعدی" }
summary:
  ar: "زهرة بن حوية بن عبد الله بن قتادة التميمي ثم السعدي؛ كان على علافة المسلمين يوم القادسية فلقيت خيلاً للأعاجم فكان ذلك سبب الوقعة وقال ابن الكلبي هو قاتل الجالينوس وذلك أثبت."
  en: "Zuhra ibn Hawiyya ibn Abdallah ibn Qatada al-Tamimi, then al-Sa'di; commanded the Muslims' foragers at al-Qadisiyya whose clash with Persian horse triggered the battle, and per Ibn al-Kalbi — the stronger account — he killed the Jalinus."
  es: "Zuhra ibn Hawiyya ibn Abdallah ibn Qatada al-Tamimi, entonces al-Sa'di, comandaba a los forrajeadores musulmanes en al-Qadisiyya, cuyo enfrentamiento con la caballería persa desencadenó la batalla, y según Ibn al-Kalbi —el relato más fidedigno—, él mató a Jalinu."
  fr: "Zuhra ibn Hawiyya ibn Abdallah ibn Qatada al-Tamimi, alors al-Sa'di; commandait les fourrageurs musulmans à al-Qadisiyya dont l'affrontement avec la cavalerie perse a déclenché la bataille, et selon Ibn al-Kalbi — le récit le plus solide — il a tué le Jalinus."
  ur: "زہرہ بن حویہ بن عبداللہ بن قتادہ التمیمی، پھر السعدی؛ القدسیہ میں مسلمانوں کے چارہ جوئی کا حکم دیا جن کی ایک فارسی گھوڑے کے ساتھ تصادم نے جنگ شروع کر دی، اور ابن الکلبی کے مطابق - اس سے زیادہ مضبوط بیان - اس نے جالینوس کو قتل کر دیا۔"
