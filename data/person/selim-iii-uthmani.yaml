summary:
  ar: "السلطان سليم الثالث ⁦(١٢٠٣–١٢٢٢هـ/١٧٨٨–١٨٠٧م)⁩؛ تولى السلطة بعد وفاة عمه عبد الحميد الأول، وألقى في مراسم توليه خطبة حماسية أمام قادة الدولة أشار فيها إلى انتصارات الجيوش العثمانية الماضية وبيّن أن سبب الهزائم المتأخرة ابتعادُهم عن دينهم، وحثّهم على الجهاد لاستعادة بلاد القرم. رفض مساعي الصلح التي قام بها سفراء إسبانيا وفرنسا وبروسيا وقرر التوجه بنفسه على رأس جيش نحو الدانوب، وزاد مرتبات الجند. ولما احتل الفرنسيون مصر أعلن الجهاد على الفرنسيين سنة ١٢١٣هـ/١٧٩٨م فاستجاب المسلمون في الحجاز والشام وشمال أفريقية {cite:dawlat-uthmaniyya-salabi p. 320-330}."
  en: "Selim III (r. 1203–1222/1788–1807) — refused the powers' peace overtures, blamed the late defeats on estrangement from religion, and when France took Egypt in 1798 proclaimed jihad, answered from the Hijaz to North Africa {cite:dawlat-uthmaniyya-salabi p. 320-330}."
  es: "Selim III (r. 1203–1222/1788–1807) — rechazó las propuestas de paz de las potencias, atribuyó las recientes derrotas al alejamiento de la religión y, cuando Francia tomó Egipto en 1798, proclamó la yihad y respondió desde el Hiyaz hasta el norte de África {cite:dawlat-uthmaniyya-salabi p. 320-330}."
  fr: "Selim III (r. 1203–1222/1788–1807) — a refusé les ouvertures de paix des puissances, a imputé les récentes défaites à l'éloignement de la religion et, lorsque la France a pris l'Égypte en 1798, a proclamé le jihad, répondant du Hedjaz à l'Afrique du Nord {cite:dawlat-uthmaniyya-salabi p. 320-330}."
  ur: "سیلم III (r. 1203–1222/1788–1807) - نے طاقتوں کے امن کی کوششوں سے انکار کیا، دیر سے ہونے والی شکستوں کا الزام مذہب سے دوری پر لگایا، اور جب فرانس نے 1798 میں مصر پر قبضہ کیا تو جہاد کا اعلان کیا، حجاز سے شمالی افریقہ تک جواب دیا۔ 320-330}۔"
  tr: "Sultan III. Selim (1203–1222 Hicri / 1788–1807), amcası I. Abdülhamid'in ölümünden sonra iktidara geldi. Tahta çıkış töreninde, devlet liderleri önünde coşkulu bir konuşma yaptı; geçmiş Osmanlı ordusu zaferlerine atıfta bulundu ve geç yenilgilerin sebebinin dinlerinden uzaklaşmaları olduğunu açıkladı; Kırım'ı geri almak için cihat yapmalarını teşvik etti. İspanya, Fransa ve Prusya elçilerinin yaptığı barış çabalarını reddetti ve askerlerin maaşlarını artırarak Tuna Nehri'ne doğru bir ordu komutası altında ilerlemeye karar verdi. Fransızlar Mısır'ı işgal ettiğinde, 1213 Hicri/1798 yılında Fransızlara karşı cihat ilan etti ve Hicaz, Levant ve Kuzey Afrika'daki Müslümanlar buna karşılık verdi {cite:dawlat-uthmaniyya-salabi s. 320-330}."
  id: "Sultan Selim III (1203–1222 H / 1788–1807 M) mengambil alih kekuasaan setelah kematian pamannya Abdul Hamid I. Dalam upacara kenaikan tahta, ia menyampaikan pidato antusias di hadapan para pemimpin negara yang menyoroti kemenangan tentara Ottoman di masa lalu dan menjelaskan bahwa alasan kekalahan terlambat tersebut adalah karena mereka menjauh dari agama mereka dan mendorong mereka untuk melakukan jihad demi merebut kembali Krimea. Ia menolak upaya perdamaian yang dilakukan oleh duta besar Spanyol, Prancis, dan Prusia dan memutuskan untuk memimpin pasukan menuju Sungai Danube, meningkatkan gaji para prajurit. Ketika Prancis menduduki Mesir, ia menyatakan jihad terhadap Prancis pada tahun 1213 H/1798 M, dan umat Muslim di Hijaz, Levant, dan Afrika Utara merespons {cite:dawlat-uthmaniyya-salabi hlm. 320-330}."
