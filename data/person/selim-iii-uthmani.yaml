summary:
  ar: "السلطان سليم الثالث (١٢٠٣–١٢٢٢هـ/١٧٨٨–١٨٠٧م)؛ تولى السلطة بعد وفاة عمه عبد الحميد الأول، وألقى في مراسم توليه خطبة حماسية أمام قادة الدولة أشار فيها إلى انتصارات الجيوش العثمانية الماضية وبيّن أن سبب الهزائم المتأخرة ابتعادُهم عن دينهم، وحثّهم على الجهاد لاستعادة بلاد القرم. رفض مساعي الصلح التي قام بها سفراء إسبانيا وفرنسا وبروسيا وقرر التوجه بنفسه على رأس جيش نحو الدانوب، وزاد مرتبات الجند. ولما احتل الفرنسيون مصر أعلن الجهاد على الفرنسيين سنة ١٢١٣هـ/١٧٩٨م فاستجاب المسلمون في الحجاز والشام وشمال أفريقية {cite:dawlat-uthmaniyya-salabi p. 320-330}."
  en: "Selim III (r. 1203–1222/1788–1807) — refused the powers' peace overtures, blamed the late defeats on estrangement from religion, and when France took Egypt in 1798 proclaimed jihad, answered from the Hijaz to North Africa {cite:dawlat-uthmaniyya-salabi p. 320-330}."
