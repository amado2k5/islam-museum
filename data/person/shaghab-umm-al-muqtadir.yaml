summary:
  ar: "أم المقتدر، رومية وقيل تركية اسمها غريب وقيل شغب، فتحت مارستاناً كان مبلغ النفقة فيه في العام سبعة آلاف دينار، وآل الأمر إلى حرمها فنهب لها ست مئة ألف دينار ليلة خلع ابنها {cite:tarikh-khulafa-minhaj-1434 p. 585,589,591}، وصادرها القاهر وضربها حتى ماتت في العذاب {cite:tarikh-khulafa-minhaj-1434 p. 597}."
  en: "Al-Muqtadir's mother — a Greek, or a Turk named Gharib or Shaghab; she founded a hospital endowed at seven thousand dinars a year, and six hundred thousand dinars were looted for her the night of her son's deposition {cite:tarikh-khulafa-minhaj-1434 p. 585,589,591}."
