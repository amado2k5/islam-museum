  ar: "ركانة رجل من بني المطلب، روى أهل الأخبار أنه صارع النبي في خبر المصارعة المشهور. أورده أبو نعيم في معرفة الصحابة، وذكر ابن حجر في الإصابة أن الحديث فيه اضطراب في السند، وأن الاحتمال الراجح عنده أن في السند سقطًا. {cite:marifat-sahaba-abu-nuaym} {cite:ibn-hajar-isaba p. 531}"
  en: "Rukana, a man of Banu al-Muttalib, is the companion named in the story of the wrestling bout with the Prophet. Abu Nu'aym records the report in his Ma'rifat al-Sahaba; Ibn Hajar, in al-Isaba, notes that the chain of narration is disputed and judges that a link is likely missing. {cite:marifat-sahaba-abu-nuaym} {cite:ibn-hajar-isaba p. 531}"
