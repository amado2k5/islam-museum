summary:
  ar: "ركانة بن عبد يزيد بن هاشم بن المطلب بن عبد مناف المطلبي، اشتهر بخبر مصارعته النبي؛ ينقل ابن حجر في الإصابة أنه أسلم يوم الفتح وقيل عقب المصارعة وأن ابن حبان قال في إسناد الخبر نظر، ويورد أبو نعيم في معرفة الصحابة الخبر برواياته مع خبر طلاقه امرأته {cite:ibn-hajar-isaba p. 481}{cite:marifat-sahaba-abu-nuaym p. 1113}."
  en: "Rukana ibn Abd Yazid ibn Hashim ibn al-Muttalib ibn Abd Manaf al-Muttalibi, known for the story of his wrestling bout with the Prophet; Ibn Hajar in al-Isaba says he became a Muslim at the conquest of Mecca, or by another view right after the bout, and quotes Ibn Hibban that the chain of the report needs examining, while Abu Nu'aym gives the report in several versions with the report of his divorce. {cite:ibn-hajar-isaba p. 481} {cite:marifat-sahaba-abu-nuaym p. 1113}"
