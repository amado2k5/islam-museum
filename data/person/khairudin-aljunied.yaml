summary:
  ar: "مؤرخ سنغافوري متخصص في تاريخ الإسلام في جنوب شرق آسيا. أستاذ مشارك بالجامعة الوطنية في سنغافورة وزميل أول بمركز الوليد للتفاهم الإسلامي المسيحي بجامعة جورجتاون؛ من مؤلفاته «Hamka and Islam» و«Islam in Malaysia»."
  en: "Singaporean historian of Islam in Southeast Asia. Associate professor at the National University of Singapore and senior fellow at Georgetown University's Alwaleed Center; author of Hamka and Islam and Islam in Malaysia."
  ur: "سنگاپوری مورخ، جنوب مشرقی ایشیا میں اسلام کے تاریخ دان۔ نیشنل یونیورسٹی آف سنگاپور میں ایسوسی ایٹ پروفیسر اور جارج ٹاؤن یونیورسٹی کے الولید سینٹر میں سینئر فیلو؛ «Hamka and Islam» اور «Islam in Malaysia» کے مصنف۔"
  es: "Historiador singapurense especializado en el islam en el sudeste asiático. Profesor asociado en la Universidad Nacional de Singapur e investigador principal en el Centro Alwaleed de la Universidad de Georgetown; autor de Hamka and Islam e Islam in Malaysia."
  fr: "Historien singapourien spécialiste de l'islam en Asie du Sud-Est. Professeur associé à l'Université nationale de Singapour et chercheur principal au Centre Alwaleed de l'Université de Georgetown; auteur de Hamka and Islam et de Islam in Malaysia."
  tr: "Güneydoğu Asya'da İslam tarihi üzerine uzmanlaşmış Singapurlu bir tarihçidir. Singapur Ulusal Üniversitesi'nde doçent ve Georgetown Üniversitesi Alwaleed İslam-Hristiyan Anlayış Merkezi'nde kıdemli araştırmacıdır; çalışmaları arasında \"Hamka ve İslam\" ile \"Malezya'da İslam\" bulunmaktadır."
  id: "Seorang sejarawan Singapura yang mengkhususkan diri dalam sejarah Islam di Asia Tenggara. Associate Professor di National University of Singapore dan senior fellow di Alwaleed Center for Islamic-Christian Understanding di Georgetown University; karyanya meliputi \"Hamka and Islam\" dan \"Islam in Malaysia.\""
