summary:
  ar: "لاعب كرة قدم أمريكية (وُلد سنة 1989) من ليندن في نيوجيرسي، نجم جامعة تمبل الذي اختاره نيويورك جتس في الجولة الأولى من درافت NFL سنة 2011؛ اختير لبرو بول مرة ولفريق أول-برو الثاني مرتين مع الجتس، قبل موسم أخير مع غرين باي سنة 2018. يُعرف بلقب «مو»."
  en: "American football defensive end (born 1989) from Linden, New Jersey, a Temple standout taken by the New York Jets in the first round of the 2011 NFL draft; a Pro Bowl selection and two-time Second-team All-Pro with the Jets before a final season with Green Bay in 2018. He is known as 'Mo'."
