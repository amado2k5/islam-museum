summary:
  ar: "لاعب كرة قدم أمريكية ⁦(وُلد سنة 1989)⁩ من ليندن في نيوجيرسي، نجم جامعة تمبل الذي اختاره نيويورك جتس في الجولة الأولى من درافت NFL سنة 2011؛ اختير لبرو بول مرة ولفريق أول-برو الثاني مرتين مع الجتس، قبل موسم أخير مع غرين باي سنة 2018. يُعرف بلقب «مو»."
  en: "American football defensive end (born 1989) from Linden, New Jersey, a Temple standout taken by the New York Jets in the first round of the 2011 NFL draft; a Pro Bowl selection and two-time Second-team All-Pro with the Jets before a final season with Green Bay in 2018. He is known as 'Mo'."
  ur: "امریکی فٹ بال کھلاڑی ⁦(پیدائش 1989)⁩ جن کا تعلق لنڈن، نیو جرسی سے ہے؛ ٹیمپل کے ممتاز کھلاڑی جنھیں نیویارک جیٹس نے 2011ء کے NFL ڈرافٹ کے پہلے راؤنڈ میں منتخب کیا، اور جو جیٹس کے ساتھ پرو باؤل اور دو بار آل پرو رہے۔"
  es: "Ala defensiva de fútbol americano (nacido en 1989) originario de Linden, Nueva Jersey, jugador destacado de Temple, seleccionado por los New York Jets en la primera ronda del draft de la NFL de 2011; fue seleccionado para el Pro Bowl y dos veces All-Pro del segundo equipo con los Jets antes de su última temporada con Green Bay en 2018. Es conocido como 'Mo'."
  fr: "Ailier défensif de football américain (né en 1989) originaire de Linden, New Jersey, un joueur vedette de Temple sélectionné par les Jets de New York au premier tour du repêchage de la NFL de 2011; une sélection au Pro Bowl et deux fois dans la deuxième équipe All-Pro avec les Jets avant une dernière saison avec Green Bay en 2018. Il est connu sous le nom de 'Mo'."
  tr: "Linden, New Jersey'den Amerikan futbolu oyuncusu (1989 doğumlu), Temple Üniversitesi'nde yıldız olan ve 2011 NFL Draftı'nın ilk turunda New York Jets tarafından seçilen; Jets ile bir kez Pro Bowl ve iki kez All-Pro takımı için seçilmiş, ardından 2018'de Green Bay'deki son sezonunu tamamlamıştır. 'Moe' lakabıyla bilinir."
  id: "Seorang pemain sepak bola Amerika (lahir 1989) dari Linden, New Jersey, bintang di Temple University yang dipilih oleh New York Jets pada putaran pertama NFL Draft 2011; terpilih sekali untuk Pro Bowl dan dua kali untuk tim All-Pro bersama Jets, sebelum musim terakhirnya bersama Green Bay pada 2018. Dia dikenal dengan julukan 'Moe.'"
