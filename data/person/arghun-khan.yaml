summary:
  ar: "صاحب العراق وخراسان وأذربيجان؛ تملك بعد عمه الملك أحمد ⁦(تكودر)⁩، وكان شهماً مقداماً شديد البأس سفاكاً للدماء عظيم الجبروت؛ هلك سنة تسعين وستمائة فيقال إنه سمّ فاتهم المغل وزيرَه سعد الدولة اليهودي بقتله فمالوا على اليهود قتلاً ونهباً وسبياً {cite:shadharat-dhahab p. 720}."
  en: "Ilkhan — lord of Iraq, Khurasan and Azerbaijan after his uncle Ahmad Tekuder; died this year, said to be poisoned, whereupon the Mongols accused his Jewish vizier Sa'd al-Dawla and fell upon the Jews killing, plundering and enslaving {cite:shadharat-dhahab p. 720}."
  es: "Ilkhan — señor de Irak, Jorasán y Azerbaiyán después de su tío Ahmad Tekuder; murió este año, se dice que envenenado, tras lo cual los mongoles acusaron a su visir judío Sa'd al-Dawla y atacaron a los judíos matándolos, saqueándolos y esclavizándolos {cite:shadharat-dhahab p. 720}."
  fr: "Ilkhan — seigneur d'Irak, du Khorasan et d'Azerbaïdjan après son oncle Ahmad Tekuder; est mort cette année, dit-on, empoisonné, sur quoi les Mongols ont accusé son vizir juif Sa'd al-Dawla et se sont jetés sur les Juifs en les tuant, les pillant et les réduisant en esclavage {cite:shadharat-dhahab p. 720}."
  ur: "الخان - اپنے چچا احمد تکودر کے بعد عراق، خراسان اور آذربائیجان کا آقا؛ اس سال اس کی موت زہر دی گئی تھی، جس پر منگولوں نے اپنے یہودی وزیر سعد الدولہ پر الزام لگایا اور یہودیوں کے قتل، لوٹ مار اور غلامی پر برس پڑے۔ 720}۔"
