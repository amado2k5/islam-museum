names:
  - { value: "أبو نصر بن الصباغ صاحب الشامل", kind: full }
summary:
  ar: "الفقيه الشافعي صاحب كتاب الشامل؛ لما فُرغت المدرسة النظامية ببغداد سنة تسع وخمسين وأربعمائة وقُرّر للتدريس فيها أبو إسحاق الشيرازي فاختفى لقوله إن الموضع مغصوب، درّس ابن الصباغ فيها عشرين يومًا حتى أجاب الشيرازي {cite:muntazam-ibn-al-jawzi j.8 p.246; shadharat-dhahab p. 315}. ولما تكلّم بعضهم في جواز جلوس ابن الصباغ في المدرسة وهو الذي قال «لولا أني ما أديت فيها الفرض لكنت من الهالكين» بلغ نظامَ الملك فقامت عليه القيامة {cite:muntazam-ibn-al-jawzi j.8 p.598}."
  en: "The Shafi'i jurist, author of al-Shamil: when Baghdad's Nizamiyya opened in 459 and its appointed teacher Abu Ishaq al-Shirazi went into hiding over the 'usurped ground', Ibn al-Sabbagh taught the first twenty days until al-Shirazi relented; he himself admitted 'had I not performed the obligatory prayer in it, I would have been among the lost' {cite:muntazam-ibn-al-jawzi j.8 p.246,598}."
  es: "El jurista shafi'í, autor de al-Shamil: cuando la Nizamiyya de Bagdad abrió sus puertas en 459 y su maestro designado, Abu Ishaq al-Shirazi, se ocultó en el \"terreno usurpado\", Ibn al-Sabbagh impartió clases durante los primeros veinte días hasta que al-Shirazi cedió; él mismo admitió: \"Si no hubiera realizado la oración obligatoria en ella, habría estado entre los perdidos\" {cite:muntazam-ibn-al-jawzi j.8 p.246,598}."
  fr: "Le juriste chaféite, auteur d'al-Shamil: lorsque la Nizamiyya de Bagdad ouvrit ses portes en 459 et que son enseignant désigné, Abu Ishaq al-Shirazi, se cacha à cause du « terrain usurpé », Ibn al-Sabbagh enseigna les vingt premiers jours jusqu'à ce qu'al-Shirazi cède; il admit lui-même: « Si je n'y avais pas accompli la prière obligatoire, j'aurais été parmi les perdus » {cite: muntazam-ibn-al-jawzi j.8 p.246,598}."
  ur: "شافعی فقیہ، الشمل کا مصنف: جب بغداد کا نظامیہ 459 میں کھلا اور اس کے مقرر کردہ استاد ابو اسحاق الشیرازی 'ہتھیلی ہوئی زمین' پر چھپ گئے، ابن الصباغ نے پہلے بیس دن تک پڑھایا یہاں تک کہ الشرازی نے استعفیٰ دیا۔ اس نے خود اعتراف کیا کہ اگر میں اس میں فرض نماز نہ پڑھتا تو میں گمشدہ لوگوں میں شامل ہوتا۔"
  tr: "Şafii hukukçu, El-Şamil'in yazarı, Bağdat'taki Nizamiyye Okulu 459 Hicri yılında tamamlandığında ve Ebu İshaq el-Şirazi orada öğretmen olarak atandığında, yerin gasp edildiğini söyleyerek ortadan kayboldu. İbn el-Sabbağ yirmi gün orada okudu; ta ki el-Şirazi şöyle yanıt verene kadar; {atıf:Muntazam-ibn-al-jawzi j.8 s.246; şadharat-dhahab s. 315}. Bazıları, İbn el-Sebbağ'ın okulda oturmasının caizinden bahsettiğinde, 'Orada zorunlu namazları yerine getirmeseydim, bozulanlar arasında olurdum,' dediğinde, Nizam al-Mulk kralın emri yaşına ulaştı ve Kıyamet Günü onun üzerine gelecek {atıf:Muntazam-ibn-al-jawzi j.8 s.598}."
  id: "Ahli hukum Shafi'i, penulis Al-Shamil, ketika Sekolah Nizamiyya di Baghdad selesai pada tahun 459 Hh dan Abu Ishaq al-Shirazi diangkat mengajar di sana, ia menghilang karena mengatakan tempat itu telah direbut. Ibn al-Sabbagh belajar di sana selama dua puluh hari hingga al-Shirazi menjawab {cite:Muntazam-ibn-al-jawzi j.8 hlm.246; shadharat-dhahab hlm. 315}. Ketika beberapa dari mereka berbicara tentang izinnya Ibn al-Sabbagh duduk di sekolah, yang berkata, 'Seandainya aku tidak memenuhi doa wajib di sana, aku akan berada di antara yang mudah binasa,' Nizam al-Mulk mencapai usia titah raja dan Hari Penghakiman akan tiba kepadanya {cite:Muntazam-ibn-al-jawzi j.8 hlm.598}."
