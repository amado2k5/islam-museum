summary:
  ar: "الفقيه الشافعي صاحب كتاب الشامل؛ لما فُرغت المدرسة النظامية ببغداد سنة تسع وخمسين وأربعمائة وقُرّر للتدريس فيها أبو إسحاق الشيرازي فاختفى لقوله إن الموضع مغصوب، درّس ابن الصباغ فيها عشرين يومًا حتى أجاب الشيرازي {cite:muntazam-ibn-al-jawzi j.8 p.246; shadharat-dhahab p. 315}. ولما تكلّم بعضهم في جواز جلوس ابن الصباغ في المدرسة وهو الذي قال «لولا أني ما أديت فيها الفرض لكنت من الهالكين» بلغ نظامَ الملك فقامت عليه القيامة {cite:muntazam-ibn-al-jawzi j.8 p.598}."
  en: "The Shafi'i jurist, author of al-Shamil: when Baghdad's Nizamiyya opened in 459 and its appointed teacher Abu Ishaq al-Shirazi went into hiding over the 'usurped ground', Ibn al-Sabbagh taught the first twenty days until al-Shirazi relented; he himself admitted 'had I not performed the obligatory prayer in it, I would have been among the lost' {cite:muntazam-ibn-al-jawzi j.8 p.246,598}."
