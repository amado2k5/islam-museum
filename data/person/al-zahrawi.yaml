summary:
  ar: "طبيب وجراح أندلسي ارتبط بقرطبة، صاحب موسوعة التصريف التي اكتملت نحو390/1000 وتضم ثلاثين مقالة، آخرها في الجراحة ورسوم أدواتها {cite:tdv-zehravi pp. 189–191} {cite:tdv-tasrif-zehravi pp. 132–133}. الأخبار المبكرة عن حياته قليلة، والصلة بالبلاط خبر لا تثبته تلك الأخبار الأولى {cite:tdv-zehravi pp. 189–191}."
  en: "Andalusian physician and surgeon associated with Cordoba, author of the30-book al-Tasrif completed around390/1000, whose final book illustrates surgery and instruments {cite:tdv-zehravi pp. 189–191} {cite:tdv-tasrif-zehravi pp. 132–133}. Early biographical evidence is sparse; court service is not established by that early testimony {cite:tdv-zehravi pp. 189–191}."
  ur: "قرطبہ سے وابستہ اندلسی طبیب و جراح، تیس مقالات کی التصریف کے مصنف، جو تقریباً390/1000 میں مکمل ہوئی اور آخری مقالہ جراحی و آلات کے خاکوں پر ہے {cite:tdv-zehravi pp. 189–191} {cite:tdv-tasrif-zehravi pp. 132–133}۔ ابتدائی سوانحی شہادت محدود ہے اور اس سے درباری ملازمت ثابت نہیں ہوتی {cite:tdv-zehravi pp. 189–191}۔"
