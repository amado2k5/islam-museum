summary:
  ar: "فؤاد باشا (1835 – 17 أبريل 1931)، المعروف بـ«دلي فؤاد باشا» لجرأته وصراحته، مشير عثماني شركسي الأصل قاتل في حرب 1877–1878 ولقّب بـ«بطل إلينا»، وكان سفير الدولة في برلين (1913–1915) وعضوًا مؤسسًا في حزب الحرية والائتلاف ومن مؤسسي نادي بشكتاش. وهو غير كجه جي زاده فؤاد باشا الصدر الأعظم."
  en: "Fuad Pasha (1835 – 17 April 1931), known as Deli Fuad Pasha — 'Mad Fuad' — for his boldness and outspokenness, was an Ottoman marshal of Circassian origin who fought in the Russo-Turkish War of 1877–78, where he was hailed as the Hero of Elena. He was ambassador in Berlin (1913–1915), a founding member of the Freedom and Accord Party and a founder of Beşiktaş JK. He is not Keçecizade Fuad Pasha, the grand vizier."
  ur: "فواد پاشا (1835ء – 17 اپریل 1931ء)، جو اپنی دلیری اور صاف گوئی کی وجہ سے «دلی فواد پاشا» کہلائے، چرکسی الاصل عثمانی مشیر تھے؛ 1877–1878ء کی جنگ میں لڑے اور «ایلینا کے ہیرو» کہلائے، برلن میں سفیر رہے (1913–1915ء)، حزبِ آزادی و ائتلاف کے بانی ارکان اور بشکتاش کلب کے بانیوں میں سے تھے۔ یہ صدرِ اعظم کیچہ جی زادہ فواد پاشا سے مختلف شخص ہیں۔"
