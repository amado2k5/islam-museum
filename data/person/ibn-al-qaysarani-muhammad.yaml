summary:
  ar: "أبو عبد الله ابن القيسراني محمد بن نصر الأديب حامل لواء الشعر في عصره؛ ولد بعكا سنة سبع وثمانين وأربعمائة وتولى إدارة الساعات التي بدمشق مدة ثم سكن حلب وكان عارفاً بالهيئة والنجوم والهندسة والحساب مدح الملوك والكبار، وكانت بينه وبين ابن منير مكاتبات وأجوبة ومهاجاة؛ توفي ليلة الأربعاء حادي عشري شعبان بدمشق ودفن بمقبرة باب الفراديس {cite:shadharat-dhahab p. 630-631}."
  en: "Abu Abdallah Ibn al-Qaysarani Muhammad ibn Nasr, the littérateur who bore poetry's banner in his age; b. Acre 477, he administered the Damascus bureau then settled at Aleppo — versed in astronomy, geometry and reckoning, panegyrist of kings and grandees, and Ibn Munir's epistolary rival; d. the eve of Wednesday 21 Sha'ban at Damascus, buried at Bab al-Faradis {cite:shadharat-dhahab p. 630-631}."
