  - { value: "أبو عبد الله محمد بن نصر بن صغير بن خالد القيسراني العكي الأديب", kind: full }
summary:
  ar: "أبو عبد الله ابن القيسراني محمد بن نصر الأديب حامل لواء الشعر في عصره؛ ولد بعكا سنة سبع وثمانين وأربعمائة وتولى إدارة الساعات التي بدمشق مدة ثم سكن حلب وكان عارفاً بالهيئة والنجوم والهندسة والحساب مدح الملوك والكبار، وكانت بينه وبين ابن منير مكاتبات وأجوبة ومهاجاة؛ توفي ليلة الأربعاء حادي عشري شعبان بدمشق ودفن بمقبرة باب الفراديس {cite:shadharat-dhahab p. 630-631}."
  en: "Abu Abdallah Ibn al-Qaysarani Muhammad ibn Nasr, the littérateur who bore poetry's banner in his age; b. Acre 477, he administered the Damascus bureau then settled at Aleppo — versed in astronomy, geometry and reckoning, panegyrist of kings and grandees, and Ibn Munir's epistolary rival; d. the eve of Wednesday 21 Sha'ban at Damascus, buried at Bab al-Faradis {cite:shadharat-dhahab p. 630-631}."
  es: "Abu Abdallah Ibn al-Qaysarani Muhammad ibn Nasr, el literato que llevó el estandarte de la poesía en su época; b. En Acre 477, administró la oficina de Damasco y luego se estableció en Alepo: versado en astronomía, geometría y cálculo, panegirista de reyes y grandes, y rival epistolar de Ibn Munir; d. la víspera del miércoles 21 Sha'ban en Damasco, enterrado en Bab al-Faradis {cita: shadharat-dhahab p. 630-631}."
  fr: "Abu Abdallah Ibn al-Qaysarani Muhammad ibn Nasr, le littérateur qui portait l'étendard de la poésie à son époque; b. Acre 477, il administre le bureau de Damas puis s'installe à Alep — versé en astronomie, géométrie et calcul, panégyriste des rois et des grands, et rival épistolaire d'Ibn Munir; d. la veille du mercredi 21 Sha'ban à Damas, enterré à Bab al-Faradis {cite:shadharat-dhahab p. 630-631}."
  ur: "ابو عبداللہ ابن القیسرانی محمد بن نصر، وہ ادبی شخصیت جنہوں نے اپنی عمر میں شاعری کا جھنڈا اٹھایا تھا۔ ب ایکڑ 477 میں، اس نے دمشق بیورو کا انتظام کیا پھر حلب میں سکونت اختیار کی — فلکیات، جیومیٹری اور حساب کتاب میں ماہر، بادشاہوں اور بزرگوں کے علمبردار، اور ابن منیر کے خطاطی کے حریف؛ d 21 شعبان بروز بدھ دمشق میں باب الفرادیس میں مدفون 630-631}۔"
