id: person/zuhayr-ibn-qays-al-balawi
class: person
label: { ar: "زهير بن قيس البلوي", en: "Zuhayr ibn Qays al-Balawi", es: "Zuhayr ibn Qays al-Balawi", fr: "Zuhayr ibn Qays al-Balawi", ur: "زہیر بن قیس البلاوی" }
summary:
  ar: "زهير بن قيس البلوي؛ ولّاه عبد العزيز بن مروان إفريقية ففتح توتس ثم انصرف إلى برقة فبلغه أن جماعة من الروم خرجوا من مراكب لهم فعاثوا فتوجه إليهم في جريدة خيل فلقيهم فاستشهد ومن معه فقُبر هناك وقبورهم تدعى قبور الشهداء. استشهد مع أصحابه في معركة مع البيزنطيين في درنة بشرق ليبيا سنة 71هـ، ودفنوا هناك، وتعرف قبورهم إلى اليوم بمقبرة الشهداء، وكان لاستشهادهم أثر كبير عند عبد الملك الذي وجه بعدها جيشاً كبيراً إلى شمال إفريقية بقيادة حسان بن النعمان. {cite:salabi-umayyad-state-2020 p.58}"
  en: "Zuhayr ibn Qays al-Balawi; Abd al-Aziz ibn Marwan gave him Ifriqiya — he opened Tutus, then turned back to Barqa where word came of Romans landed from ships and ravaging; he rode out with a light cavalry band, met them, and was martyred with those with him, buried where their graves are called Qubur al-Shuhada."
  es: "Zuhayr ibn Qays al-Balawi; Abd al-Aziz ibn Marwan le dio Ifriqiya; abrió Tutus, luego regresó a Barqa donde llegaron noticias de que los romanos habían desembarcado de barcos y estaban causando estragos; salió con una banda de caballería ligera, los encontró y fue martirizado con los que estaban con él, enterrado donde sus tumbas se llaman Qubur al-Shuhada."
  fr: "Zuhayr ibn Qays al-Balawi; Abd al-Aziz ibn Marwan lui donna Ifriqiya — il ouvrit Tutus, puis retourna à Barqa où parvint la nouvelle que les Romains avaient débarqué de navires et ravageaient; il partit avec une bande de cavalerie légère, les rencontra et fut martyrisé avec ceux qui l'accompagnaient, enterré à l'endroit où leurs tombes sont appelées Qubur al-Shuhada."
  ur: "زہیر بن قیس البلاوی؛ عبد العزیز ابن مروان نے اسے افریقیہ دیا - اس نے توطس کو کھولا، پھر برقع کی طرف لوٹے جہاں رومیوں کی طرف سے بحری جہازوں سے اترنے اور تباہی پھیلانے کا لفظ آیا۔ وہ ہلکے گھڑسوار دستے کے ساتھ نکلا، ان سے ملاقات کی، اور اپنے ساتھ والوں کے ساتھ شہید ہوئے، جہاں ان کی قبروں کو قبور الشہداء کہا جاتا ہے، وہاں دفن کیا گیا۔"
  tr: "Zuhayr ibn Qays al-Balawi; Abd al-Aziz ibn Marwan onu İfrikiye valisi olarak atadı, Tutus'u fethetti, ardından Cyrenaika'ya geçti ve burada bir grup Romalı'nın gemilerinden inip yıkım yarattığı bildirildi. Onlara bir at gazetesinde yaklaştı, onlarla karşılaştı ve şehit oldu. O ve yanındakiler şehit oldu. Orada defnedildiler ve mezarlarına Şehitler Mezarları denir. 71 Hicri'de doğu Libya'da Derna'da Bizanslılarla yapılan bir savaşta yoldaşlarıyla birlikte şehit edildi. Orada gömüldü ve mezarları bugün hâlâ Şehitler Mezarlığı olarak bilinmektedir. Şehitlikleri, daha sonra Hasan ibn al-Nu'man liderliğinde Kuzey Afrika'ya büyük bir ordu gönderen Abd al-Malik üzerinde büyük bir etki yaptı. {alıntı:) Salabi-Umayyad-State-2020 s.58}"
  id: "Zuhayr ibn Qays al-Balawi; Abd al-Aziz ibn Marwan mengangkatnya sebagai gubernur Ifriqiya, menaklukkan Tutus, lalu pindah ke Cyrenaica, di mana ia diberitahu bahwa sekelompok orang Romawi telah keluar dari kapal mereka dan menyebabkan kekacauan. Ia mendekati mereka dengan koran kuda, bertemu mereka, dan menjadi martir. Ia dan orang-orang yang bersamanya menjadi syahid. Mereka dimakamkan di sana, dan makam mereka disebut Makam Para Martir. Ia menjadi martir bersama rekan-rekannya dalam pertempuran melawan Bizantium di Derna, Libya timur pada tahun 71 H. Mereka dimakamkan di sana, dan makam mereka masih dikenal hingga kini sebagai Pemakaman Para Syuhada. Kematian mereka sangat berdampak pada Abd al-Malik, yang kemudian mengirim pasukan besar ke Afrika Utara yang dipimpin oleh Hassan ibn al-Nu'man. {cite:Salabi-Umayyad-State-2020 hlm.58}"
