label: { ar: "زهير بن قيس البلوي", en: "Zuhayr ibn Qays al-Balawi" }
summary:
  ar: "زهير بن قيس البلوي؛ ولّاه عبد العزيز بن مروان إفريقية ففتح توتس ثم انصرف إلى برقة فبلغه أن جماعة من الروم خرجوا من مراكب لهم فعاثوا فتوجه إليهم في جريدة خيل فلقيهم فاستشهد ومن معه فقُبر هناك وقبورهم تدعى قبور الشهداء. استشهد مع أصحابه في معركة مع البيزنطيين في درنة بشرق ليبيا سنة 71هـ، ودفنوا هناك، وتعرف قبورهم إلى اليوم بمقبرة الشهداء، وكان لاستشهادهم أثر كبير عند عبد الملك الذي وجه بعدها جيشاً كبيراً إلى شمال إفريقية بقيادة حسان بن النعمان. {cite:salabi-umayyad-state-2020 p.58}"
  en: "Zuhayr ibn Qays al-Balawi; Abd al-Aziz ibn Marwan gave him Ifriqiya — he opened Tutus, then turned back to Barqa where word came of Romans landed from ships and ravaging; he rode out with a light cavalry band, met them, and was martyred with those with him, buried where their graves are called Qubur al-Shuhada."
