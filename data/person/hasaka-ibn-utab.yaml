summary:
  ar: "حسكة بن عتاب الحبطي؛ خرج بعد وقعة الجمل هو وعمران بن الفصيل البرجمي في صماليك من العرب إلى سجستان فأصابوا من زالق مالاً وأخذوا جد البختري ودخلوا زرنج وقتل حسكة عبد الرحمن بن جزء الطائي رسول علي إليها فأرسل علي ربعي بن الكاس في أربعة آلاف فقتلوه."
  en: "Hasaka ibn Utab al-Habati; after the Camel he and Imran ibn al-Fasil led Arab desperadoes into Sijistan — plundered Zaliq, captured al-Bakhtari's grandfather, entered Zaranj — and he killed Ali's envoy Ibn Jaza' al-Ta'i, till Rubay'i ibn al-Kas came with four thousand and killed him."
