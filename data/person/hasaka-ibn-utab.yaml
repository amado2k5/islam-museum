label: { ar: "حسكة بن عتاب الحبطي", en: "Hasaka ibn Utab al-Habati", es: "Hasaka ibn Utab al-Habati", fr: "Hasaka ibn Utab al-Habati", ur: "حسقہ بن عتاب الحباتی" }
summary:
  ar: "حسكة بن عتاب الحبطي؛ خرج بعد وقعة الجمل هو وعمران بن الفصيل البرجمي في صماليك من العرب إلى سجستان فأصابوا من زالق مالاً وأخذوا جد البختري ودخلوا زرنج وقتل حسكة عبد الرحمن بن جزء الطائي رسول علي إليها فأرسل علي ربعي بن الكاس في أربعة آلاف فقتلوه."
  en: "Hasaka ibn Utab al-Habati; after the Camel he and Imran ibn al-Fasil led Arab desperadoes into Sijistan — plundered Zaliq, captured al-Bakhtari's grandfather, entered Zaranj — and he killed Ali's envoy Ibn Jaza' al-Ta'i, till Rubay'i ibn al-Kas came with four thousand and killed him."
  es: "Hasaka ibn Utab al-Habati; después del Camello, él e Imran ibn al-Fasil dirigieron a forajidos árabes a Sijistan —saquearon Zaliq, capturaron al abuelo de al-Bakhtari, entraron en Zaranj— y mató al enviado de Ali, Ibn Jaza' al-Ta'i, hasta que Rubay'i ibn al-Kas llegó con cuatro mil y lo mató."
  fr: "Hasaka ibn Utab al-Habati; après le Chameau, lui et Imran ibn al-Fasil ont mené des desperados arabes au Sijistan — ont pillé Zaliq, capturé le grand-père d'al-Bakhtari, sont entrés à Zaranj — et il a tué l'envoyé d'Ali, Ibn Jaza' al-Ta'i, jusqu'à ce que Rubay'i ibn al-Kas vienne avec quatre mille hommes et le tue."
  ur: "حسقہ بن عتاب الحباتی؛ اونٹ کے بعد اس نے اور عمران بن الفصل نے عرب مایوسیوں کو سجستان میں لے جایا - زلیق کو لوٹ لیا، البختاری کے دادا کو پکڑ لیا، زرنج میں داخل ہوا - اور اس نے علی کے ایلچی ابن جزع الطائی کو قتل کر دیا، یہاں تک کہ روبی ابن الکاس چار ہزار کے ساتھ آیا اور اسے قتل کر دیا۔"
  tr: "Hasakah ibn Atab al-Hubati; Deve Savaşı'ndan sonra, o ve İmran ibn al-Fasil al-Barjami Araplardan Samalik'te Sijistan'a gittiler, burada Zalq Mal'ı ele geçirdiler, Bakhtari büyükbabasını ele geçirdiler, Zaranj'a girdiler ve oradaki Ali'nin elçisi Hasakah Abd al-Rahman ibn Juz'al-Tai'yi öldürdüler. Ali, Rabi' ibn al-Kass'ı dört bin ile gönderip öldürdü."
  id: "Hasakah ibn Atab al-Hubati; setelah Pertempuran Unta, ia dan Imran ibn al-Fasil al-Barjami pergi ke Samalik dari bangsa Arab ke Sijistan, di mana mereka menangkap Zalq Mal, menangkap kakek Bakhtari, memasuki Zaranj, dan membunuh Hasakah Abd al-Rahman ibn Juz' al-, utusan Ali di sana. Ali mengirim Rabi' ibn al-Kass dengan empat ribu orang dan membunuhnya."
