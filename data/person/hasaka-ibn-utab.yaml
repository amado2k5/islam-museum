label: { ar: "حسكة بن عتاب الحبطي", en: "Hasaka ibn Utab al-Habati", es: "Hasaka ibn Utab al-Habati", fr: "Hasaka ibn Utab al-Habati" }
summary:
  ar: "حسكة بن عتاب الحبطي؛ خرج بعد وقعة الجمل هو وعمران بن الفصيل البرجمي في صماليك من العرب إلى سجستان فأصابوا من زالق مالاً وأخذوا جد البختري ودخلوا زرنج وقتل حسكة عبد الرحمن بن جزء الطائي رسول علي إليها فأرسل علي ربعي بن الكاس في أربعة آلاف فقتلوه."
  en: "Hasaka ibn Utab al-Habati; after the Camel he and Imran ibn al-Fasil led Arab desperadoes into Sijistan — plundered Zaliq, captured al-Bakhtari's grandfather, entered Zaranj — and he killed Ali's envoy Ibn Jaza' al-Ta'i, till Rubay'i ibn al-Kas came with four thousand and killed him."
  es: "Hasaka ibn Utab al-Habati; después del Camello, él e Imran ibn al-Fasil dirigieron a forajidos árabes a Sijistan —saquearon Zaliq, capturaron al abuelo de al-Bakhtari, entraron en Zaranj— y mató al enviado de Ali, Ibn Jaza' al-Ta'i, hasta que Rubay'i ibn al-Kas llegó con cuatro mil y lo mató."
  fr: "Hasaka ibn Utab al-Habati; après le Chameau, lui et Imran ibn al-Fasil ont mené des desperados arabes au Sijistan — ont pillé Zaliq, capturé le grand-père d'al-Bakhtari, sont entrés à Zaranj — et il a tué l'envoyé d'Ali, Ibn Jaza' al-Ta'i, jusqu'à ce que Rubay'i ibn al-Kas vienne avec quatre mille hommes et le tue."
