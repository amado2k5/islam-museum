summary:
  ar: "لاعب كرة قدم ألماني سابق من أصل تونسي، وُلد في شتوتغارت سنة 1987؛ لاعب وسط بدأ مع شتوتغارت وفاز معه بالدوري الألماني (2007)، ثم لعب لريال مدريد ففاز بدوري أبطال أوروبا (2014)، ثم ليوفنتوس ففاز معه بخمسة ألقاب متتالية في الدوري الإيطالي، وختم مسيرته مع هرتا برلين سنة 2021. دولي ألماني خاض 77 مباراة وكان من أبطال كأس العالم 2014، ويعمل اليوم مساعدًا لمدرب ريال مدريد."
  en: "German former professional footballer of Tunisian descent, born in Stuttgart in 1987. A central midfielder who began at VfB Stuttgart, winning the Bundesliga in 2007, then played for Real Madrid, winning the UEFA Champions League in 2014, and for Juventus, winning five consecutive Serie A titles, before ending his playing career at Hertha BSC in 2021. A Germany international with 77 caps, he was part of the squad that won the 2014 FIFA World Cup, and he now works as an assistant coach at Real Madrid."
  ur: "تیونسی نژاد سابق جرمن پیشہ ور فٹبالر، 1987 میں شٹوٹگارٹ میں پیدا ہوئے؛ مڈفیلڈر جنہوں نے وی ایف بی شٹوٹگارٹ سے آغاز کر کے 2007 میں بنڈس لیگا جیتی، پھر ریال میڈرڈ کے ساتھ 2014 میں یوئیفا چیمپئنز لیگ اور یوونٹس کے ساتھ لگاتار پانچ سیری آ خطاب جیتے، اور 2021 میں ہرتھا برلن میں اپنے کھیل کا سفر ختم کیا۔ جرمنی کے لیے 77 بین الاقوامی میچ کھیلے اور 2014 کا فیفا ورلڈ کپ جیتنے والی ٹیم کے رکن رہے؛ آج کل ریال میڈرڈ میں اسسٹنٹ کوچ ہیں۔"
