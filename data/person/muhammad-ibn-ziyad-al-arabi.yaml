summary:
  ar: "لغوي، سأله المأمون عن بنات طارق في شعر هند بنت عتبة فلم يعرفه في نسبها فأجاب المأمون إنما أرادت النجم وانتسبت إليه لحسنها فقال فائدة يا أمير المؤمنين فقال أنا بؤبؤ هذا الأمر وابن بؤبئه ودحا إليه بعنبرة كان يقلبها في يده فباعها بخمسة آلاف درهم {cite:tarikh-khulafa-minhaj-1434 p. 501-502}."
  en: "A linguist; asked about 'Banat Tariq' in Hind bint Utba's verse he found no such ancestor — al-Ma'mun explained she meant the star Tariq, claimed for her beauty, then gave him the ambergris he was rolling in his hand, worth five thousand dirhams {cite:tarikh-khulafa-minhaj-1434 p. 501-502}."
