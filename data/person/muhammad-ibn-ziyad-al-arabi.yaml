id: person/muhammad-ibn-ziyad-al-arabi
class: person
label:
  ar: محمد بن زياد الأعرابي
summary:
  ar: لغوي، سأله المأمون عن بنات طارق في شعر هند بنت عتبة فلم يعرفه في نسبها فأجاب المأمون إنما أرادت النجم وانتسبت إليه لحسنها فقال فائدة يا أمير المؤمنين فقال أنا بؤبؤ هذا الأمر وابن بؤبئه ودحا إليه بعنبرة كان يقلبها في يده فباعها بخمسة آلاف درهم {cite:tarikh-khulafa-minhaj-1434 p. 501-502}.
  en: A linguist; asked about 'Banat Tariq' in Hind bint Utba's verse he found no such ancestor — al-Ma'mun explained she meant the star Tariq, claimed for her beauty, then gave him the ambergris he was rolling in his hand, worth five thousand dirhams {cite:tarikh-khulafa-minhaj-1434 p. 501-502}.
  es: "Un lingüista, al ser preguntado sobre 'Banat Tariq' en el verso de Hind bint Utba, no encontró tal antepasado; al-Ma'mun explicó que se refería a la estrella Tariq, reclamada por su belleza, y luego le dio el ámbar gris que estaba haciendo rodar en su mano, valorado en cinco mil dirhams {cite:tarikh-khulafa-minhaj-1434 p. 501-502}."
  fr: "Un linguiste; interrogé sur « Banat Tariq » dans le vers de Hind bint Utba, il n'a trouvé aucun ancêtre de ce nom — al-Ma'mun a expliqué qu'elle faisait référence à l'étoile Tariq, a revendiqué sa beauté, puis lui a donné l'ambre gris qu'il roulait dans sa main, d'une valeur de cinq mille dirhams {cite:tarikh-khulafa-minhaj-1434 p. 501-502}."
  ur: "ماہر لسانیات؛ ہند بنت عتبہ کی آیت میں 'بنات طارق' کے بارے میں پوچھا تو اسے ایسا کوئی اجداد نہیں ملا - المامون نے وضاحت کی کہ اس سے مراد ستارہ طارق ہے، جس نے اس کی خوبصورتی کا دعویٰ کیا تھا، پھر اسے وہ عنبر دیا جو وہ اپنے ہاتھ میں لپیٹ رہا تھا، جس کی قیمت پانچ ہزار درہم تھی۔ 501-502}۔"
  tr: "Dilbilimci. Al-Ma'mun, Hind bint Utbah'ın şiirinde Tariq'ın kızları hakkında soru sormuş, ancak soyunu bilmemektedir. Al-Ma'mun, sadece yıldızı istediğini ve güzelliği nedeniyle ona atfettiğini söylemiştir. Şöyle demiştir: 'Fayda et, ey Sadıkların Komutanı.' Dedi ki, 'Ben bu işin öğrencisiyim ve onun öğrencisinin oğluyum.' Elinde çevirdiği bir kehribarla ona koştu ve onu beş bin dirhem karşılığında sattı. {atıf:Tarikh-khulafa-minhaj-1434, s. 501-502}."
  id: "ahli bahasa. Al-Ma'mun bertanya kepadanya tentang putri-putri Tariq dalam puisi Hind bint Utbah, tetapi ia tidak mengetahui garis keturunannya. Al-Ma'mun menjawab bahwa ia hanya menginginkan bintang itu dan menganggapnya sebagai milik Al-Ma'mun karena kecantikannya. Ia berkata, 'Manfaat, wahai Panglima Orang Beriman.' Ia berkata, 'Aku adalah murid dalam hal ini, dan putra muridnya.' Ia berlari ke arahnya dengan kuning yang biasa ia putar di tangannya, sehingga ia menjualnya seharga lima ribu dirham. {cite:Tarikh-khulafa-minhaj-1434, hlm. 501-502}."
