summary:
  ar: "علي بن علي الشبراملسي، أبو الضياء نور الدين، فقيه شافعي مصري من أهل شبراملس بالغربية، كُفّ بصره في طفولته وتعلم وعلّم بالأزهر، وصاحب حواش على المواهب اللدنية والشمائل ونهاية المحتاج؛ توفي سنة 1087 هـ الموافقة 1676م."
  en: "Ali ibn Ali al-Shabramallisi, Abu al-Diya, Nur al-Din, an Egyptian Shafi'i jurist from Shabramall in al-Gharbiyya, blind from childhood, who studied and taught at al-Azhar and wrote glosses on al-Mawahib al-Laduniyya, al-Shama'il and Nihayat al-Muhtaj; he died in 1087 AH (1676 CE)."
