summary:
  ar: "علي بن علي الشبراملسي، أبو الضياء نور الدين، فقيه شافعي مصري من أهل شبراملس بالغربية، كُفّ بصره في طفولته وتعلم وعلّم بالأزهر، وصاحب حواش على المواهب اللدنية والشمائل ونهاية المحتاج؛ توفي سنة 1087 هـ الموافقة 1676م."
  en: "Ali ibn Ali al-Shabramallisi, Abu al-Diya, Nur al-Din, an Egyptian Shafi'i jurist from Shabramall in al-Gharbiyya, blind from childhood, who studied and taught at al-Azhar and wrote glosses on al-Mawahib al-Laduniyya, al-Shama'il and Nihayat al-Muhtaj; he died in 1087 AH (1676 CE)."
  fr: "Ali ibn Ali al-Shabramallisi, Abu al-Diya, Nur al-Din, un juriste égyptien Shafi'i de Shabramall dans al-Gharbiyya, aveugle d'enfance, qui a étudié et enseigné à al-Azhar et a écrit des gloses sur al-Mawahib al-Laduniya, al-Shama'il et Nihayat al-Muhtaj ; Il meurt en 1087 de l'hégire (1676)."
  es: "Ali ibn Ali al-Shabramallisi, Abu al-Diya, Nur al-Din, un jurista egipcio Shafi'i de Shabramall en al-Gharbiyya, ciego desde la infancia, que estudió y enseñó en al-Azhar y escribió glosas sobre al-Mawahib al-Laduniyya, al-Shama'il y Nihayat al-Muhtaj; Murió en 1087 d. H. (1676 d. C.)."
  ur: "علی ابن علی الشبرملیسی، ابو الدیہ، نورالدین، الغربیہ میں شبرمل سے تعلق رکھنے والے ایک مصری شافعی فقیہ، بچپن سے نابینا تھے، جنہوں نے الازہر میں تعلیم حاصل کی اور پڑھایا اور المواحب الدونیہ، المحاجات، المحتاج، المصاحب پر تصانیف لکھیں۔ ان کی وفات 1087ھ ⁦(1676ء)⁩ میں ہوئی۔"
