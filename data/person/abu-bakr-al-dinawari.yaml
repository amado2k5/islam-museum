summary:
  ar: "أبو بكر أحمد بن محمد الدينوري الحنبلي؛ كان شيخاً جليلاً يناظر ويحتج ويحضره ابن الجوزي؛ توفي في جمادى الأولى سنة اثنتين وثلاثين وخمسمائة {cite:shadharat-dhahab p. 582-583}."
  en: "Abu Bakr Ahmad ibn Muhammad al-Dinawari the Hanbali; a venerable shaykh who debated and argued, whose sessions Ibn al-Jawzi attended; d. Jumada I 532 {cite:shadharat-dhahab p. 582-583}."
  fr: "Abu Bakr Ahmad ibn Muhammad al-Dinawari le hanbalite ; shaykh vénérable qui débattait et argumentait, dont Ibn al-Jawzi fréquenta les séances ; mort en Jumada I 532 {cite:shadharat-dhahab p. 582-583}."
  es: "Abu Bakr Ahmad ibn Muhammad al-Dinawari el Hanbali; un venerable shaykh que debatía y discutía, a cuyas sesiones asistía Ibn al-Jawzi; d. Viernes I 532 {cita: shadharat-dhahab p. 582-583}."
  ur: "ابو بکر احمد بن محمد الدنوری حنبلی؛ ایک قابل احترام شیخ جس نے بحث اور بحث کی، جس کی نشستوں میں ابن الجوزی نے شرکت کی۔ d جمادی الثانی 532 {حوالہ: شدارت ذہب ص۔ 582-583}۔"
  tr: "Ebu Bekir Ahmed ibn Muhammed el-Dinawari el-Hanbeli; tartışmacı ve münazaracı seçkin bir şeyhti ve İbn el-Cevzi onun derslerine katılırdı; Hicri 532 yılında Cemâde el-Ula ayında vefat etti. {Kaynak: Şadharat-Dhaba s. 582-583}"
  id: "Abu Bakr Ahmad ibn Muhammad al-Dinawari al-Hanbali; beliau adalah seorang syekh terkemuka yang gemar berdebat dan berargumen, dan Ibnu al-Jawzi biasa menghadiri ceramahnya; beliau wafat di Jumada al-Ula pada tahun 532 H {cite:shadharat-dhahab p. 582-583}."
