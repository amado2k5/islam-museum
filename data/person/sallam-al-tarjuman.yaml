class: person
label: { ar: "سلام الترجمان", en: "Sallam al-Tarjuman", es: "Sallam al-Tarjuman", fr: "Sallam al-Tarjuman" }
summary:
  ar: "سلام الترجمان مولى واسع الرقعة بن جرير؛ كان يتكلم بثلاثين لساناً فلمّا رأى الواثق مناماً اضطرب منه أمر سدّ يأجوج ومأجوج لم يجد من يصلح للخروج إليه إلا سلاماً، فجهّزه بخمسين رجلاً وخمسة آلاف دينار وعشرة آلاف درهم نفقة وألف درهم لكل رجل ورزق سنة ولبابيد مغشاة بالأدم وكستباذات بالفراء وركب خشب ومائتي بغل للزاد والماء، وسار بكتاب الواثق إلى إسحاق بن إسماعيل صاحب أرمينية بتفليس فكتب له إلى صاحب السرير فإلى ملك اللان فإلى فيلان شاه فإلى طرخان ملك الخزر، ثم سار من عنده نحو سبعة وعشرين يوماً حتى انتهى إلى أرض سوداء منتنة الرائحة ومدن خربت بها يأجوج ومأجوج فوصل إلى الحصون القريبة من شعبة الجبل التي فيها السد ووصف الباب الحديد والقفل والمفتاح والحصنين وقرع القفل يومي الاثنين والخميس، وأملى الخبر جملة على ابن خرداذبه {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
  en: "Sallam the Interpreter — fluent in thirty tongues, and the only man al-Wathiq judged fit when a dream unsettled him about the barrier of Gog and Magog: fitted out with fifty young men, five thousand dinars and ten thousand dirhams for his own costs, a thousand dirhams and a year's rations per man, felt-lined leathers, fur kishtabads, wooden saddles and two hundred pack-mules, he carried al-Wathiq's letter to Ishaq ibn Isma'il governor of Armenia at Tiflis, whose letters passed him on to the lord of Sarir, the king of the Alans, Filan Shah and Tarkhan king of the Khazars, then some twenty-seven days on to the black evil-smelling land and the cities Gog and Magog had ruined, until he reached the forts by the mountain cleft holding the barrier — describing its iron gate, lock, key and twin forts and the Monday-and-Thursday knocking on the lock; Ibn Khurdadhbih heard the whole report from him and took it down {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
  es: "Sallam el Intérprete, fluido en treinta lenguas, y el único hombre que al-Wathiq consideró apto cuando un sueño lo inquietó acerca de la barrera de Gog y Magog: provisto de cincuenta jóvenes, cinco mil dinares y diez mil dirhams para sus propios gastos, mil dirhams y raciones para un año por hombre, cueros forrados de fieltro, kishtabads de piel, sillas de montar de madera y doscientas mulas de carga, llevó la carta de al-Wathiq a Ishaq ibn Isma'il, gobernador de Armenia en Tiflis, cuyas cartas lo pusieron en contacto con el señor de Sarir, el rey de los alanos, Filan Shah y Tarkhan, rey de los jázaros, luego unos veintisiete días más adelante hacia la tierra negra y maloliente y las ciudades que Gog y Magog habían arruinado, hasta que llegó a los fuertes junto a la hendidura de la montaña que sostenía la barrera, describiendo su puerta de hierro, cerradura, llave y fuertes gemelos y el golpeteo de los lunes y jueves en la puerta. cerradura; Ibn Khurdadhbih escuchó todo el informe de él y lo transcribió {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
  fr: "Sallam l'Interprète — parlant couramment trente langues, et le seul homme qu'al-Wathiq jugea apte à l'accompagner lorsqu'un rêve le troubla au sujet de la barrière de Gog et Magog: équipé de cinquante jeunes hommes, de cinq mille dinars et dix mille dirhams pour ses propres frais, de mille dirhams et de rations pour un an par homme, de cuirs doublés de feutre, de kishtabads en fourrure, de selles en bois et de deux cents mules de bât, il porta la lettre d'al-Wathiq à Ishaq ibn Isma'il, gouverneur d'Arménie à Tiflis, dont les lettres le transmirent au seigneur de Sarir, au roi des Alains, Filan Shah, et à Tarkhan, roi des Khazars, puis pendant quelque vingt-sept jours, il traversa la terre noire et malodorante et les villes que Gog et Magog avaient ruinées, jusqu'à atteindre les forts situés près de la faille montagneuse qui gardait la barrière — décrivant sa porte de fer, sa serrure, sa clé et ses forts jumeaux, ainsi que les coups frappés à la serrure les lundis et jeudis; Ibn Khurdadhbih a entendu tout le rapport de sa part et l'a noté {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
