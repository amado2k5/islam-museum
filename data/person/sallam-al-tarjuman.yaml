id: person/sallam-al-tarjuman
class: person
label: { ar: "سلام الترجمان", en: "Sallam al-Tarjuman" }
summary:
  ar: "سلام الترجمان مولى واسع الرقعة بن جرير؛ كان يتكلم بثلاثين لساناً فلمّا رأى الواثق مناماً اضطرب منه أمر سدّ يأجوج ومأجوج لم يجد من يصلح للخروج إليه إلا سلاماً، فجهّزه بخمسين رجلاً وخمسة آلاف دينار وعشرة آلاف درهم نفقة وألف درهم لكل رجل ورزق سنة ولبابيد مغشاة بالأدم وكستباذات بالفراء وركب خشب ومائتي بغل للزاد والماء، وسار بكتاب الواثق إلى إسحاق بن إسماعيل صاحب أرمينية بتفليس فكتب له إلى صاحب السرير فإلى ملك اللان فإلى فيلان شاه فإلى طرخان ملك الخزر، ثم سار من عنده نحو سبعة وعشرين يوماً حتى انتهى إلى أرض سوداء منتنة الرائحة ومدن خربت بها يأجوج ومأجوج فوصل إلى الحصون القريبة من شعبة الجبل التي فيها السد ووصف الباب الحديد والقفل والمفتاح والحصنين وقرع القفل يومي الاثنين والخميس، وأملى الخبر جملة على ابن خرداذبه {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
  en: "Sallam the Interpreter — fluent in thirty tongues, and the only man al-Wathiq judged fit when a dream unsettled him about the barrier of Gog and Magog: fitted out with fifty young men, five thousand dinars and ten thousand dirhams for his own costs, a thousand dirhams and a year's rations per man, felt-lined leathers, fur kishtabads, wooden saddles and two hundred pack-mules, he carried al-Wathiq's letter to Ishaq ibn Isma'il governor of Armenia at Tiflis, whose letters passed him on to the lord of Sarir, the king of the Alans, Filan Shah and Tarkhan king of the Khazars, then some twenty-seven days on to the black evil-smelling land and the cities Gog and Magog had ruined, until he reached the forts by the mountain cleft holding the barrier — describing its iron gate, lock, key and twin forts and the Monday-and-Thursday knocking on the lock; Ibn Khurdadhbih heard the whole report from him and took it down {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
