summary:
  ar: "الملك المسعود صاحب آمد؛ حاصره الملك الكامل سنة ثلاثين وستمائة وضرب مدينته بالمجانيق فلما رأى الغلبة خرج وفي رقبته منديل فرسم عليه وتسلم منه البلد، وطلب منه تسليم القلاع فسلم الجميع إلا حصن كيفا فعذبه بأنواع العذاب وكان يبغضه؛ وكان المسعود فاسقاً يأخذ الحرم غصباً حتى وجدوا في قصره خمسمائة حرة من بنات الناس {cite:shadharat-dhahab p. 135}."
  en: "al-Malik al-Mas'ud, lord of Amid — battered by al-Kamil's mangonels in 630 he surrendered with the suppliant's kerchief round his neck, gave up every fortress save Kayfa, and was tortured for it; a fasiq who seized women by force — five hundred free-born were found in his palace {cite:shadharat-dhahab p. 135}."
