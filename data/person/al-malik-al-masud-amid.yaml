id: person/al-malik-al-masud-amid
class: person
label: { ar: "الملك المسعود صاحب آمد", en: "al-Malik al-Mas'ud, lord of Amid", es: "al-Malik al-Mas'ud, lord of Amid", fr: "al-Malik al-Mas'ud, lord of Amid", ur: "الملک المسعود، امید کا رب" }
summary:
  ar: "الملك المسعود صاحب آمد؛ حاصره الملك الكامل سنة ثلاثين وستمائة وضرب مدينته بالمجانيق فلما رأى الغلبة خرج وفي رقبته منديل فرسم عليه وتسلم منه البلد، وطلب منه تسليم القلاع فسلم الجميع إلا حصن كيفا فعذبه بأنواع العذاب وكان يبغضه؛ وكان المسعود فاسقاً يأخذ الحرم غصباً حتى وجدوا في قصره خمسمائة حرة من بنات الناس {cite:shadharat-dhahab p. 135}."
  en: "al-Malik al-Mas'ud, lord of Amid — battered by al-Kamil's mangonels in 630 he surrendered with the suppliant's kerchief round his neck, gave up every fortress save Kayfa, and was tortured for it; a fasiq who seized women by force — five hundred free-born were found in his palace {cite:shadharat-dhahab p. 135}."
  es: "al-Malik al-Mas'ud, señor de Amid —golpeado por los mangoneles de al-Kamil en 630, se rindió con el pañuelo del suplicante alrededor del cuello, entregó todas las fortalezas excepto Kayfa, y fue torturado por ello; un fasiq que tomaba mujeres por la fuerza — quinientas mujeres libres fueron encontradas en su palacio {cite:shadharat-dhahab p. 135}."
  fr: "al-Malik al-Mas'ud, seigneur d'Amid — battu par les mangonneaux d'al-Kamil en 630, il se rendit avec le mouchoir du suppliant autour du cou, abandonna toutes les forteresses sauf Kayfa, et fut torturé pour cela; un fasiq qui s'emparait de femmes par la force — cinq cents femmes libres furent trouvées dans son palais {cite:shadharat-dhahab p. 135}."
  ur: "الملک المسعود، لارڈ آف امید - 630 میں الکامل کے منگونوں سے مارا پیٹا گیا، اس نے دعا کرنے والے کے رومال کو اپنے گلے میں ڈال کر ہتھیار ڈال دیے، کیفہ کے علاوہ ہر قلعہ چھوڑ دیا، اور اس کے لیے اذیتیں دی گئیں۔ ایک فاسق جس نے عورتوں کو زبردستی چھین لیا - اس کے محل میں پانچ سو آزاد پیدا ہوئے۔ 135}۔"
  tr: "Amed hükümdarı Kral el-Mes'ud; 630 Hicri yılında Kral el-Kamil tarafından kuşatıldı ve şehrine mancınıklarla vurdu. Zaferi görünce boynunda bir mendil ile dışarı çıktı, bir atkı çekip şehri ele geçirdi. Kaleleri teslim etmesini istedi, ancak Kifa kalesi hariç hepsini teslim etti; kaleler onu çeşitli işkencelerle işkence etti ve nefret etti. El-Mes'ud, sarayında halkın kızlarından beş yüz özgür kadın bulana kadar zorla kutsal alanı ele geçiren bir günahkârdı {atıf:shadharat-dhahab, s. 135}."
  id: "Raja al-Mas'ud, penguasa Amad; ia dikepung oleh Raja al-Kamil pada tahun 630 H dan menghantam kotanya dengan katapel. Ketika ia melihat kemenangan, ia keluar dengan sapu tangan di lehernya, lalu ia mengeluarkan syal dan mengambil alih kota. Ia menuntut agar ia menyerahkan kastil-kastil, tetapi ia menyerahkan semua kecuali benteng Kifa, yang menyiksanya dengan berbagai siksaan dan membencinya. Al-Mas'ud adalah seorang pendosa yang memaksa merebut tempat suci sampai mereka menemukan di istananya lima ratus wanita bebas dari putri-putri rakyat {cite:shadharat-dhahab, hlm. 135}."
