summary:
  ar: "محمد بن معاوية الصوفي، التزم لصيحة الحكيم فصفي وعُوفي. يروي قصة حكيم مرّ بفتية جلوس على روضة معشبة، فحذّرهم من الركون إلى ما ترك من أعطاهم الحياة."
  en: "Muhammad ibn Mu'awiya al-Sufi, who kept to the call of the wise and was cleansed and made whole; he relates how a wise man passed youths sitting on a grassy meadow and warned them not to incline to what the One who gave them life has abandoned."
  ur: "محمد بن معاویہ صوفی حکیم کی پکار پر قائم رہے اور پاک و صاف ہوئے۔ وہ ایک حکیم کا واقعہ بیان کرتے ہیں جو سبزہ زار میں بیٹھے نوجوانوں کے پاس سے گزرا اور انہیں اس چیز کی طرف مائل ہونے سے خبردار کیا جسے زندگی دینے والے نے چھوڑ دیا ہے۔"
  es: "Muhammad ibn Mu'awiya al-Sufi, quien siguió el llamado de los sabios y fue purificado y sanado; relata cómo un hombre sabio pasó junto a unos jóvenes sentados en un prado y les advirtió que no se inclinaran hacia aquello que Aquel que les dio la vida había abandonado."
  fr: "Muhammad ibn Mu'awiya al-Sufi, qui a suivi l'appel des sages et a été purifié et guéri, raconte comment un sage est passé devant des jeunes gens assis dans une prairie et les a avertis de ne pas s'incliner vers ce que Celui qui leur a donné la vie a abandonné."
  tr: "Muhammed bin Muaviye, bilge adamın çağrısına uydu, bu yüzden sadık ve mantıksızdı. Bir bilge adamın, çimenli bir çayırda oturan genç bir adamın yanından geçip, geride bıraktığı hayat verene güvenmemeleri konusunda uyardığı hikayeyi anlatır."
  id: "Muhammad ibn Muawiya sang Sufi mengikuti panggilan orang bijak, sehingga ia setia dan tidak masuk akal. Ia menceritakan kisah seorang bijak yang melewati seorang pemuda yang duduk di padang rumput, dan memperingatkan mereka agar tidak bergantung pada apa yang ia tinggalkan yang memberi mereka kehidupan."
