summary:
  ar: "كاتب فروسية شامي أواخر القرن السابع الهجري ⁦(ت 1294-1295م)⁩؛ صنّف «كتاب الفروسية والمناصب الحربية» وفيه أول بيان واضح معروف عند بارتينغتون لتطهير الملح ⁦(البارود)⁩ برماد الخشب والتبلور، وتركيبات نارية كثيرة، دون أي ذكر لاستعمال البارود دافعاً أو لسلاح ناري {cite:partington-greek-fire-gunpowder-1960}."
  en: "A Syrian furusiyya writer of the late thirteenth century ⁦(d. 1294-95)⁩ who compiled the Kitab al-Furusiyya wa'l-manasib al-harbiyya; it contains the first clear account known to Partington of purifying saltpetre with wood ashes and crystallisation, many pyrotechnic compositions, and no mention of gunpowder as a propellant or of any firearm {cite:partington-greek-fire-gunpowder-1960}."
  ur: "تیرہویں صدی کے آخر کا شامی فروسیہ مصنف ⁦(وفات 1294-95)⁩ جس کی کتاب الفروسیۃ والمناصب الحربیۃ میں پارٹنگٹن کے نزدیک ملحِ بارود کی تصفیہ کا پہلا واضح بیان، بہت سی نیرنگی ترکیبیں ہیں، مگر بارود کو محرک یا کسی اسلحے کا ذکر نہیں {cite:partington-greek-fire-gunpowder-1960}۔"
  es: "Un escritor sirio de la tradición furusiyya de finales del siglo XIII (m. 1294-95) que compiló el Kitab al-Furusiyya wa'l-manasib al-harbiyya; contiene el primer relato claro conocido por Partington sobre la purificación del salitre con cenizas de madera y la cristalización, muchas composiciones pirotécnicas y ninguna mención de la pólvora como propulsor o de cualquier arma de fuego {cite:partington-greek-fire-gunpowder-1960}."
