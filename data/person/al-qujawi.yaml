summary:
  ar: "المولى محيي الدين محمد بن مصطفى القوجوي الحنفي؛ اشتغل وحصل ثم خدم المولى ابن فضل الدين ثم درس بمدرسة خواجه خير الدين بالقسطنطينية ثم آثر العزلة فترك التدريس وتقاعد بخمسة عشر عثمانياً وكان يستكثرها على نفسه ويقول يكفيني منها عشرة، ولازم بيته وأقبل على العلم والعبادة وكان متواضعاً يحب أهل الصلاح، وكان يُروى التفسير في مسجده فيجتمع إليه أهل البلد يسمعون كلامه ويتبركون بأنفاسه وانتفع به كثيرون؛ وكان يقول: إذا شككت في آية من القرآن أتوجه إلى الله تعالى فيتسع صدري حتى يصير قدر الدنيا ويطلع فيه قمران لا أدري هما أي ثم يظاهر نور فيكون دليلاً إلى اللوح المحفوظ فأستخرج منه معنى الآية؛ ومن أخذ عنه صاحب الشقائق قال وهو من جلة من افتخرت به وما اخترت منصب القضاء إلا بوصية منه؛ وله حواشٍ على البيضاوي جامعة لما تفرق من الفوائد في كتب التفسير سهلة قريبة، وشرح على الوقاية في الفقه، وشرح الفرائض السراجية، وشرح المفتاح للسكاكي، وشرح البردة {cite:shadharat-dhahab p. 702}."
  en: "The recluse of the fifteen uthmani — 'ten is enough for me'; he gave up teaching for his house and mosque, where townsfolk gathered to hear his tafsir and seek baraka in his breath; his method: 'when I doubt a verse I turn to God — my breast widens to the world's size, two moons rise in it, then a light guides me to the Preserved Tablet from which I draw the meaning'; Taskoprulizade's own teacher who counselled him into the qadiship; works: a digest gloss on Baydawi, sharhs of the Wiqaya, the Sirajiyya fara'id, al-Sakkaki's Miftah and the Burda {cite:shadharat-dhahab p. 702}."
