summary:
  ar: "المولى محيي الدين محمد بن مصطفى القوجوي الحنفي؛ اشتغل وحصل ثم خدم المولى ابن فضل الدين ثم درس بمدرسة خواجه خير الدين بالقسطنطينية ثم آثر العزلة فترك التدريس وتقاعد بخمسة عشر عثمانياً وكان يستكثرها على نفسه ويقول يكفيني منها عشرة، ولازم بيته وأقبل على العلم والعبادة وكان متواضعاً يحب أهل الصلاح، وكان يُروى التفسير في مسجده فيجتمع إليه أهل البلد يسمعون كلامه ويتبركون بأنفاسه وانتفع به كثيرون؛ وكان يقول: إذا شككت في آية من القرآن أتوجه إلى الله تعالى فيتسع صدري حتى يصير قدر الدنيا ويطلع فيه قمران لا أدري هما أي ثم يظاهر نور فيكون دليلاً إلى اللوح المحفوظ فأستخرج منه معنى الآية؛ ومن أخذ عنه صاحب الشقائق قال وهو من جلة من افتخرت به وما اخترت منصب القضاء إلا بوصية منه؛ وله حواشٍ على البيضاوي جامعة لما تفرق من الفوائد في كتب التفسير سهلة قريبة، وشرح على الوقاية في الفقه، وشرح الفرائض السراجية، وشرح المفتاح للسكاكي، وشرح البردة {cite:shadharat-dhahab p. 702}."
  en: "The recluse of the fifteen uthmani — 'ten is enough for me'; he gave up teaching for his house and mosque, where townsfolk gathered to hear his tafsir and seek baraka in his breath; his method: 'when I doubt a verse I turn to God — my breast widens to the world's size, two moons rise in it, then a light guides me to the Preserved Tablet from which I draw the meaning'; Taskoprulizade's own teacher who counselled him into the qadiship; works: a digest gloss on Baydawi, sharhs of the Wiqaya, the Sirajiyya fara'id, al-Sakkaki's Miftah and the Burda {cite:shadharat-dhahab p. 702}."
  fr: "Le reclus des quinze uthmani – « dix me suffisent  »  ; il a abandonné l’enseignement pour sa maison et sa mosquée, où les citadins se sont réunis pour entendre son tafsir et chercher la baraka dans son souffle  ; sa méthode : « quand je doute d'un verset je me tourne vers Dieu - ma poitrine s'élargit à la taille du monde, deux lunes s'élèvent en elle, puis une lumière me guide vers la tablette préservée dont je tire le sens » ; Le propre professeur de Tascoprulizade qui l'a conseillé dans le qadiship ; œuvres : un glose condensé sur Baydawi, les sharhs de la Wiqaya, la fara'id Sirajiyya, la Miftah d'al-Sakkaki et la Burda {cite:shadharat-dhahab p. 702}."
  es: "El ermitaño de los quince uthmani — 'diez me bastan'; abandonó la enseñanza por su casa y mezquita, donde los habitantes del pueblo se reunían para escuchar su tafsir y buscar baraka en su aliento; su método: 'cuando dudo de un versículo, me dirijo a Dios; mi pecho se ensancha hasta alcanzar el tamaño del mundo, dos lunas se elevan en él, y entonces una luz me guía a la Tabla Preservada de la que extraigo el significado'; el propio maestro de Taskoprulizade que lo aconsejó para el cadí; obras: un resumen glosario sobre Baydawi, sharhs de la Wiqaya, el fara'id Sirajiyya, la Miftah de al-Sakkaki y la Burda {cite:shadharat-dhahab p. 702}."
  ur: "پندرہ عثمانی کی تنہائی - 'میرے لیے دس کافی ہے'؛ اس نے اپنے گھر اور مسجد کے لیے درس دینا چھوڑ دیا، جہاں شہر کے لوگ اس کی تفسیر سننے اور اس کی سانسوں میں برکت حاصل کرنے کے لیے جمع ہوتے تھے۔ اس کا طریقہ: 'جب مجھے کسی آیت پر شک ہوتا ہے تو میں خدا کی طرف متوجہ ہوتا ہوں - میرا سینہ دنیا کے سائز کا ہو جاتا ہے، اس میں دو چاند طلوع ہوتے ہیں، پھر ایک نور مجھے اس محفوظ شدہ تختی کی طرف لے جاتا ہے جس سے میں معنی نکالتا ہوں'؛ Taskoprulizade کے اپنے استاد جنہوں نے اسے قادیش میں مشورہ دیا؛ کام: بیضاوی پر ایک ڈائجسٹ گلوس، فقیہ کی شرح، سراجیہ فریاد، السکاکی کی مفتاح اور بردہ 702}۔"
  tr: "Mevle Muhyiddin Muhammed bin Mustafa el-Kavcavi el-Hanafi; çalıştı ve başarıya ulaştı, sonra Mevlay İbn Fadl-Din'e hizmet etti, ardından Konstantinopolis'te Khwaja Hayreddin okulunda eğitim gördü. Inzivayı tercih etti, bu yüzden öğretmenliği bıraktı ve kendini fazla küçümseyip 'On tanesi bana yeter' derdi. Evde kaldı ve kendini bilgi ve ibadete adadı. Alçakgönüllüydü ve doğruları severdi. Camisinde tefsir okuyordu, kasaba halkı sözlerini dinlemek ve nefesinden bereket almak için toplanırdı, birçok kişi ondan faydalanırdı; derdi ki: Kur'an'dan bir ayete şüpheyle yaklaşırsam, Allah'a yönelirim, göğsüm dünya kadar genişledi ve içinde bilmediğim iki ay belirdi, sonra bir ışık belirir ve Korunan Tablet'e kanıt olarak hizmet eder. Ondan ayetin anlamını çıkarırım. El-Şakaiq'in yazarını ondan alan kişi şöyle der: O, gurur duyduğum büyük kişilerden biridir ve yargıç pozisyonunu onun iradesi dışında seçtim. El-Baydavi hakkında çeşitli faydalar için ayrıntılı kenar notları vardır; tefsir kitaplarında bulunan faydalar, kolay ve yakın, fıkıhta koruma yorumları, Sirajiyya'nın miras açıklaması, El-Sakkaki'nin El-Miftah açıklaması ve El-Burda yorumları {kaynak: şadharat-zehab, s. 702}."
  id: "Mawla Muhyiddin Muhammad ibn Mustafa al-Qawjawi al-Hanafi; ia bekerja dan meraih kesuksesan, kemudian melayani Mawlay Ibn Fadl al-Din, kemudian belajar di sekolah Khwaja Khayr al-Din di Konstantinopel. Ia lebih memilih untuk menyendiri, sehingga ia meninggalkan dunia mengajar dan pensiun bersama lima belas Ottoman, yang ia gunakan untuk melebih-lebihkan dirinya dan berkata, 'Sepuluh di antaranya sudah cukup bagiku.' Ia tinggal di rumah dan mendedikasikan dirinya pada pengetahuan dan ibadah. Ia rendah hati dan mencintai orang benar. Ia biasa menceritakan tafsir di masjidnya, dan penduduk kota berkumpul untuk mendengarkan kata-katanya dan mencari berkah dari napasnya, dan banyak yang mendapat manfaat darinya; ia biasa berkata: Jika saya meragukan suatu ayat dari Al-Qur'an, saya berbalik kepada Allah Yang Maha Kuasa, dan dada saya membesar hingga menjadi seluas dunia, dan dua bulan muncul di dalamnya, yang tidak saya ketahui, maka cahaya muncul dan menjadi bukti bagi Tablet yang Terjaga. Saya mengambil makna ayat tersebut. Siapa pun yang mengambil dari dia penulis Al-Shaqa'iq berkata: Dia termasuk di antara orang-orang besar yang saya banggakan, dan saya memilih posisi hakim kecuali atas kehendaknya. Dia memiliki catatan pinggir yang komprehensif tentang Al-Baydawi untuk berbagai manfaat yang ditemukan dalam buku-buku tafsir, mudah dan dekat, komentar tentang perlindungan dalam fijer, penjelasan warisan oleh Sirajiyya, penjelasan tentang Al-Miftah oleh Al-Sakkaki, dan komentar tentang Al-Burda {cite:shadharat-dhahab, hlm. 702}."
