summary:
  ar: "تيمور شاه الدراني (ديسمبر 1746، وتذكر رواية أخرى 1748 – 18 مايو 1793) ثاني حكام الدولة الدرانية في أفغانستان من نوفمبر 1772 حتى وفاته، والابن الثاني لمؤسس الدولة أحمد شاه الدراني. كان في صباه نائبًا لأبيه على البنجاب وكشمير وسيرهند في 1757–1758، وبعد اعتلائه العرش نقل العاصمة من قندهار إلى كابل وجعل بيشاور عاصمة شتوية، وقمع تمرد فيض الله خان خليل في بيشاور وثورة آزاد خان في كشمير (1786)، واسترد ملتان من السيخ سنة 1780، وزحف شمالًا ضد شاه مراد صاحب بخارى في 1788–1789. مات في كابل ودُفن فيها، وضريحه من معالم المدينة."
  en: "Timur Shah Durrani (December 1746, with 1748 also given – 18 May 1793) was the second ruler of the Durrani Empire in Afghanistan, reigning from November 1772 until his death, and the second son of the empire's founder, Ahmad Shah Durrani. As a boy he was his father's viceroy of the Punjab, Kashmir and Sirhind in 1757–1758; after his accession he moved the capital from Kandahar to Kabul, made Peshawar his winter capital, crushed the revolt of Fayz Allah Khan Khalil at Peshawar and Azad Khan's rebellion in Kashmir (1786), recovered Multan from the Sikhs in 1780, and marched north against Shah Murad of Bukhara in 1788–1789. He died at Kabul and was buried there, his mausoleum becoming a landmark of the city."
  ur: "تیمور شاہ درانی (دسمبر 1746ء، بعض روایات میں 1748ء – 18 مئی 1793ء) افغانستان کی درانی سلطنت کے دوسرے حکمران تھے؛ نومبر 1772ء سے وفات تک حکمران رہے اور سلطنت کے بانی احمد شاہ درانی کے دوسرے فرزند تھے۔ بچپن میں 1757ء–1758ء میں والد کی طرف سے پنجاب، کشمیر اور سرہند کے نائب رہے؛ تخت نشینی کے بعد دارالحکومت قندہار سے کابل منتقل کیا اور پشاور کو سرمائی دارالحکومت بنایا، پشاور میں فیض اللہ خان خلیل کی بغاوت اور کشمیر میں آزاد خان کی شورش (1786ء) کو کچلا، 1780ء میں ملتان سکھوں سے واپس لیا، اور 1788ء–1789ء میں بخارا کے شاہ مراد کے خلاف شمال کی طرف لشکر کشی کی۔ کابل میں وفات پائی اور وہیں دفن ہوئے؛ ان کا مزار شہر کے نمایاں آثار میں شمار ہوتا ہے۔"

