  ar: "الحارث بن مرة العبدي؛ توجه متطوعاً إلى ثغر الهند بإذن علي فظفر وأصاب مغنماً وسبياً وقسم في يوم ألف رأس ثم قتل ومن معه بأرض القيقان سنة ٤٢.، وعند المسعودي بعثه علي إلى خوارج النهروان يدعوهم إلى الرجوع فقتلوه، وبعثوا إلى علي إن تبت من حكومتك وشهدت على نفسك بالكفر بايعناك وإن أبيت اعتزلناك {cite:muruj-al-dhahab p. 695}"
  en: "al-Harith ibn Murra al-Abdi; Ali-sanctioned volunteer of the Indian frontier — a thousand heads' booty in one day — killed with his men at al-Qiqan in 42h."
