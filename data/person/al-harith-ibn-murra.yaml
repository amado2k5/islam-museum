id: person/al-harith-ibn-murra
class: person
label: { ar: "الحارث بن مرة العبدي", en: "al-Harith ibn Murra al-Abdi", es: "al-Harith ibn Murra al-Abdi", fr: "al-Harith ibn Murra al-Abdi", ur: "حارث بن مرہ العبدی" }
summary:
  ar: "الحارث بن مرة العبدي؛ توجه متطوعاً إلى ثغر الهند بإذن علي فظفر وأصاب مغنماً وسبياً وقسم في يوم ألف رأس ثم قتل ومن معه بأرض القيقان سنة ٤٢. وعند المسعودي بعثه علي إلى خوارج النهروان يدعوهم إلى الرجوع فقتلوه، وبعثوا إلى علي إن تبت من حكومتك وشهدت على نفسك بالكفر بايعناك وإن أبيت اعتزلناك {cite:muruj-al-dhahab p. 695}"
  en: "al-Harith ibn Murra al-Abdi; Ali-sanctioned volunteer of the Indian frontier — a thousand heads' booty in one day — killed with his men at al-Qiqan in 42h."
  es: "al-Harith ibn Murra al-Abdi, voluntario de la frontera india con el respaldo de Ali, que obtuvo un botín de mil cabezas en un solo día, murió junto con sus hombres en al-Qiqan en 42 horas."
  fr: "al-Harith ibn Murra al-Abdi; volontaire sanctionné par Ali à la frontière indienne — butin de mille têtes en un jour — tué avec ses hommes à al-Qiqan en 42h."
  ur: "الحارث بن مرہ العبدی؛ ہندوستانی سرحد کا علی منظور شدہ رضاکار - ایک دن میں ایک ہزار سروں کا مال غنیمت - 42ھ میں الققان میں اپنے آدمیوں کے ساتھ مارا گیا۔"
  tr: "Al-Harit bin Murrah el-Abdi; Ali'nin izniyle gönüllü olarak Hindistan sınırına gitti, burada zafer kazandı, esir alındı ve bir gün bin başa bölündü, ardından 42. yılda El-Kayqan topraklarında yanında olanlarla birlikte öldürüldü. El-Mes'udi'ye göre, Ali onu Nahrawan'daki Haricilere gönderdi ve onları geri çağırdı, ancak onlar onu öldürdü. Ali'ye gönderdiler, eğer senin yönetiminden pişman olursa ve kendine karşı kâfir olarak tanıklık ederse, sana bağlılık yemini ettik, reddedersen senden çekilirdik. {alıntı:Muruj-al-Dhahab, s. 695}"
  id: "Al-Harith ibn Murrah al-Abdi; secara sukarela pergi ke perbatasan India atas izin Ali, di mana ia menang, ditangkap dan ditawan, dan dibagi menjadi seribu kepala pada hari itu, kemudian dibunuh bersama mereka yang bersamanya di tanah Al-Qayqan pada tahun 42. Menurut al-Mas'udi, Ali mengirimnya kepada Kharijit Nahrawan untuk mendesak mereka kembali, tetapi mereka membunuhnya. Mereka mengirim surat kepada Ali; jika ia bertobat dari pemerintahanmu dan bersaksi melawan dirinya sebagai orang kafir, kami bersumpah setia kepadamu, dan jika engkau menolak, kami akan menarik diri darimu. {cite:muruj-al-dhahab, hlm. 695}"
