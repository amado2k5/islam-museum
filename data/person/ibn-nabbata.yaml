summary:
  ar: "أبو يحيى بن نباتة خطيب الخطباء عبد الرحيم بن محمد بن إسماعيل بن نباتة الفارقي اللخمي العسقلاني المولد المصري الدار؛ ولي خطابة حلب لسيف الدولة وفي خطبه دلالة على قوة علمه وسعته وقوة قريحته، وأجمعوا أنه ما عمل مثل خطبه قط، وهو الذي حثّ سيف الدولة بخطبه في الجهاد على التوسع فيه، وسمع على المتنبي بعض ديوانه؛ ومولده وموته ميا فارقين {cite:shadharat-dhahab p. 83-84}."
  en: "Abu Yahya Ibn Nabbata al-Fariqi (d. 374, before forty) — 'preacher of preachers', Sayf al-Dawla's khatib at Aleppo whose sermons on jihad were said to be unmatched; he heard part of al-Mutanabbi's diwan {cite:shadharat-dhahab p. 83-84}."
