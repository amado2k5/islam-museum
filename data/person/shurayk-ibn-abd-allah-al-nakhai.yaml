summary:
  ar: "أبو عبد الله شريك بن عبد الله بن أبي شريك النخعي، ولد ببخارى سنة خمس وتسعين ومات بالكوفة سنة سبع وسبعين ومائة، وولي القضاء بالكوفة ثم بالأهواز {cite:tabaqat-fuqaha-abbas-1981 p. 46}. قال ابن عيينة: ما أدركت بالكوفة أحضر جواباً من شريك بن عبد الله {cite:tabaqat-fuqaha-abbas-1981 p. 46}."
  tr: "Ebu Abdullah Şerik bin Abdullah ibn Ebi Şerik el-Nakhai, doksan beşinci yılda Buhara'da doğdu ve yüz yetmiş yedinci yılında Kufa'da öldü. Kufe'de ve ardından Ahvaz'da yargıç olarak atandı {cite:tabaqat-fuqaha-abbas-1981, s. 46}. İbn Uyaynah şöyle dedi: Kufe'de ne bulduysam, Şerik ibn Abdullah'tan bir yanıt getirdim {cite:tabaqat-fuqaha-abbas-1981, s. 46}."
  id: "Abu Abdullah Sharik ibn Abdullah ibn Abi Sharik al-Nakha'i lahir di Bukhara pada tahun sembilan puluh lima dan meninggal di Kufa pada tahun seratus tujuh puluh tujuh. Ia diangkat sebagai hakim di Kufa dan kemudian di Ahvaz {cite:tabaqat-fuqaha-abbas-1981, hlm. 46}. Ibn Uyaynah berkata: Apa pun yang saya temukan di Kufa, saya membawa tanggapan dari Sharik ibn Abdullah {cite:tabaqat-fuqaha-abbas-1981, hlm. 46}."
