summary:
  ar: "لات ديور (لات جور نغوني لاتير جوب، 1842 – 26 أكتوبر 1886)، دامل (ملك) كايور، الدولة الولوفية في السنغال الحالية، وبطل السنغال الوطني لمقاومته الاستعمار الفرنسي خمسة وعشرين عاما. وُلد في كور أمادو يالا في وسط مسلم اسميا ودرس في مدرسة قرآنية، وانتُخب داملا شابا فهُزم ونُفي، فلجأ إلى المرابط مابا دياخو با في سالوم واعتنق الإسلام عنده — أخذ اسم سيلماخا ديوب في الرواية الفرنسية — وبقي مسلما ممارسا بقية حياته وقاد جيوش مابا، ثم استعاد كايور وحكمها، وقاوم بشدة بناء سكة حديد داكار-سان لوي، وخاض حرب عصابات ثلاث سنوات بعد عزله سنة 1883 حتى قُتل في معركة ديخيلي في أكتوبر 1886 فسقطت كايور نهائيا."
  en: "Lat Dior (Lat Jor Ngoné Latir Jop, 1842 – 26 October 1886), damel (king) of Cayor, the Wolof state in present-day Senegal, and a national hero of Senegal for twenty-five years of resistance to French colonialism. Born at Keur Amadou Yalla, raised in a nominally Muslim milieu and schooled in a Quranic school, he was elected damel as a youth, defeated and exiled; he took refuge with the marabout Maba Diakhou Ba in Saloum and embraced Islam under him — taking the name Silmakha Diop in the French account — remained a practicing Muslim for the rest of his life and led Maba's armies, then recovered Cayor and ruled it, fought the Dakar–Saint-Louis railway with all his might, and after his deposition in 1883 waged a three-year guerrilla war until he was killed at Dekhele in October 1886, when Cayor ceased to exist."
  ur: "لات دیور (لات جور نگونے لاتیر جوپ، 1842ء – 26 اکتوبر 1886ء)، موجودہ سینیگال کی وولوف ریاست کایور کے «دامل» (بادشاہ) اور پچیس برس فرانسیسی استعمار کی مزاحمت پر سینیگال کے قومی ہیرو۔ کیور امادو یالا میں پیدا ہوئے، برائے نام مسلم ماحول میں پلے اور قرآنی مکتب میں پڑھے، جوانی میں دامل منتخب ہوئے، شکست کھا کر جلاوطن ہوئے؛ سالوم میں مرابط مابا دیاخو با کی پناہ لی اور ان کے پاس اسلام قبول کیا — فرانسیسی روایت میں نام «سیلماخا دیوپ» لیا — عمر بھر عامل مسلمان رہے اور مابا کی فوجوں کی قیادت کی، پھر کایور واپس لے کر حکومت کی، ڈاکار–سینٹ لوئی ریلوے کی پوری قوت سے مخالفت کی، اور 1883ء میں معزولی کے بعد تین برس چھاپہ مار جنگ لڑی یہاں تک کہ اکتوبر 1886ء میں دیخیلے کی لڑائی میں مارے گئے اور کایور ختم ہو گیا۔"
