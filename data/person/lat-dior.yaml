    note: "No two independent sources name a school or order for Lat Dior personally, so he is left unclassified (doubt rule). What the sources give, in full: the English article's infobox alone gives his religion as 'Islam (Tijaniyyah)' — an order named in that one field, uncited there, and nowhere in the article's body. The French article's infobox gives his religion as Islam with no order, and neither biography attests a Tijani initiation of Lat Dior himself. What both articles do attest is his conversion and practice: raised in a nominally Muslim milieu and Quranic-schooled as a child (English article), he fled to the marabout Maba Diakhou Ba, formally became his talibe (disciple) to seal their alliance and remained a practicing Muslim for the rest of his life (English article, citing Monteil 1963); the French article says Maba, a disciple of El Hadj Omar Tall, required his conversion as the price of help, that the ceddo Lat Dior converted and took the name Silmakha Diop. Maba's own standing in the Tijani tradition descending from Umar Tall is Maba's attestation, not Lat Dior's, and discipleship to a marabout is not by itself a documented order affiliation for the disciple. The Tijaniyyah claim is therefore recorded here as a single-infobox tradition, not as a value."
