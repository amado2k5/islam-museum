summary:
  ar: "مغنٍّ ومؤلف أغانٍ وممثل سنغالي، وُلد في دوغوندوتشي بالنيجر في 30 أغسطس 1956 لأب سنغالي وأم نيجيرية، ونشأ في روفيسك قرب داكار. انفصل عن فرقة «سوبر ديامونو» سنة 1984 لمسيرة فردية، وأطلق أغنيته «تاجابون» (1990) إلى قوائم أوروبا، ولُقّب بـ«بوب ديلان أفريقيا» لعزفه على الهارمونيكا والغيتار."
  en: "Senegalese singer, songwriter and actor, born at Dogondoutchi, Niger, on 30 August 1956 to a Senegalese father and a Nigerien mother, and raised at Rufisque near Dakar. He left the group Super Diamono in 1984 for a solo career; his song 'Tajabone' (1990) reached the European charts, and his harmonica and guitar earned him the description 'the Bob Dylan of Africa'."
  ur: "سینیگال کے گلوکار، گیت نگار و اداکار، جو 30 اگست 1956 کو نائجر کے دوگوندوچی میں سینیگالی والد اور نائجیری والدہ کے ہاں پیدا ہوئے اور ڈاکار کے قریب روفسک میں پلے بڑھے۔ 1984 میں گروپ «سپر دیامونو» سے الگ ہو کر انفرادی کیریئر شروع کیا؛ ان کا گانا «تاجابون» (1990) یورپی چارٹس تک پہنچا اور انہیں «افریقا کا باب ڈیلن» کہا گیا۔"
