  ar: نايف المطوع ⁦(1971–)⁩ طبيب نفسي وكاتب كويتي، مبتكر سلسلة القصص المصورة «THE 99» ذات المرجعية الإسلامية، وأستاذ علم النفس الإكلينيكي بجامعة الكويت ومؤسس منصة Tuhoon للصحة النفسية.
