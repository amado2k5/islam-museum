  es: "Naif al-Mutawa (nacido en 1971) es un psicólogo clínico y escritor kuwaití, creador de la serie de cómics de inspiración islámica THE 99, profesor de la Universidad de Kuwait y fundador de la plataforma de salud mental Tuhoon."
  fr: "Naif al-Mutawa (né en 1971) est un psychologue clinicien et écrivain koweïtien, créateur de la série de bandes dessinées d'inspiration islamique THE 99, professeur à l'Université du Koweït et fondateur de la plateforme de santé mentale Tuhoon."
