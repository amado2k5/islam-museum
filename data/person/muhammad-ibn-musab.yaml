label: { ar: "محمد بن مصعب الثقفي", en: "Muhammad ibn Mus'ab al-Thaqafi", es: "Muhammad ibn Mus'ab al-Thaqafi", fr: "Muhammad ibn Mus'ab al-Thaqafi", ur: "محمد بن مصعب ثقفی" }
summary:
  ar: "محمد بن مصعب بن عبد الرحمن الثقفي؛ بعثه محمد بن القاسم إلى سدوسان في خيل وحمرات فطلب أهلها الأمان وسفرت السمنية فأمنهم ووظف عليهم خراجاً وأخذ رهناً وانصرف ومعه من الزط أربعة آلاف."
  en: "Muhammad ibn Mus'ab ibn Abd al-Rahman al-Thaqafi; sent on Sadusan he took the samaniyya-brokered aman — kharaj, hostages, and four thousand Zutt auxiliaries."
  es: "Muhammad ibn Mus'ab ibn Abd al-Rahman al-Thaqafi; Enviado a Sadusan, tomó a los aman negociados por samaniyya: kharaj, rehenes y cuatro mil auxiliares zutt."
  fr: "Muhammad ibn Mus'ab ibn Abd al-Rahman al-Thaqafi; envoyé sur Sadusan, il prit les aman négociés par samaniyya – kharaj, des otages et quatre mille auxiliaires Zutt."
  ur: "محمد بن مصعب بن عبدالرحمٰن ثقفی؛ سدوسن پر بھیجا اس نے سامانیہ کی دلالی اماں - خوارج، یرغمالی اور چار ہزار زٹ معاونین لے لیے۔"
  tr: "Muhammed bin Mus'ab bin Abd al-Rahman al-Thaqafi; Muhammed ibn al-Kasim onu at ve eşeklerle Sadusan'a gönderdi. Halkı güvenlik aradı, Samniye onları güvence altına almak için yola çıktı, vergi mükellefi olarak atadı, bir rehin verdi ve dört bin bin Zat'ı getirerek ayrıldı."
  id: "Muhammad ibn Mus'ab ibn Abd al-Rahman al-Thaqafi; Muhammad ibn al-Qasim mengirimnya ke Sadusan dengan kuda dan keledai. Kaumnya mencari perlindungan, dan Samniyah melakukan perjalanan untuk mengamankan mereka, mengangkat mereka sebagai pembayar pajak, mengambil gadai, dan pergi membawa empat ribu Zat."
