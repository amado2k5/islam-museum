summary:
  ar: "مولى رسول الله، يقال إن اسمه إبراهيم، وقيل سنان، وقيل يسار، وأشهر ما قيل في اسمه أسلم، وقد مات في عهد علي بن أبي طالب. يذكره الصلابي في الصحابة الذين رووا عن علي ⁦⁦(ص 70)⁩⁩ نقلاً عن ابن عبد البر."
  en: "Freedman of the Prophet, named Ibrahim, Sinan or Yasar in various reports, though the best known name is Aslam; he died in Ali's time and al-Sallabi lists him among those who narrated from Ali (p. 70)."
  ur: "نبی کے آزاد کردہ غلام، جس کا نام بعض روایات میں ابراہیم، سنان یا یسار آیا ہے، مگر سب سے مشہور نام اسلم ہے؛ وہ علی بن ابی طالب کے عہد میں فوت ہوا اور صلابی نے اسے علی سے روایت کرنے والے صحابہ میں شمار کیا ⁦(ص 70)⁩۔"
  fr: "Affranchi du Prophète, nommé Ibrahim, Sinan ou Yasar selon les récits, bien que le nom le plus connu soit Aslam ; il mourut au temps d'Ali et al-Sallabi le range parmi ceux qui rapportèrent d'Ali (p. 70)."
  es: "Liberto del Profeta, llamado Ibrahim, Sinan o Yasar en varios relatos, aunque el nombre más conocido es Aslam; murió en tiempos de Ali y al-Sallabi lo incluye entre los que narraron de Ali (p. 70)."
  tr: "Adının İbrahim, Sinan veya Yasar olduğu söylenen, ancak en yaygın kabul gören adı Aslam olan, Allah Resulü'nün azatlı kölesi, Ali ibn Abi Talib'in halifeliği döneminde vefat etmiştir. El-Sallabi, İbn Abd el-Barr'a atıfta bulunarak, onu Ali'den rivayet eden Sahabeler arasında sayar (s. 70)."
  id: "Budak yang dibebaskan oleh Rasulullah, yang namanya konon adalah Ibrahim, Sinan, atau Yasar, tetapi nama yang paling umum diterima adalah Aslam, meninggal dunia pada masa kekhalifahan Ali bin Abi Talib. Al-Sallabi menyebutkannya di antara para Sahabat yang meriwayatkan dari Ali (hlm. 70), mengutip Ibnu Abd al-Barr."
