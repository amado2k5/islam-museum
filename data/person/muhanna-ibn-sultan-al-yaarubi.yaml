summary:
  ar: "مهنا بن سلطان بن ماجد بن مبارك بن بلعرب اليعربي، سادس الأئمة اليعاربة في عمان، بويع له بحصن الحزم بعد وفاة سلطان بن سيف، ثم خرج عليه يعرب بن بلعرب فقبض عليه وقتله؛ توفي سنة 1133 هـ بحسب الزركلي."
  en: "Muhanna ibn Sultan ibn Majid ibn Mubarak ibn Bil'arab al-Ya'rubi, the sixth Ya'rubi imam of Oman, given the oath at the fort of al-Hazm after Sultan ibn Sayf; Ya'rub ibn Bil'arab rose against him, seized and killed him; died 1133 AH (1720) according to al-Zirikli."
  es: "Muhanna ibn Sultan ibn Majid ibn Mubarak ibn Bil'arab al-Ya'rubi, el sexto imán Ya'rubi de Omán, prestó juramento en el fuerte de al-Hazm después de Sultan ibn Sayf; Ya'rub ibn Bil'arab se levantó contra él, lo apresó y lo mató; murió en 1133 AH (1720) según al-Zirikli."
  fr: "Muhanna ibn Sultan ibn Majid ibn Mubarak ibn Bil'arab al-Ya'rubi, le sixième imam Ya'rubi d'Oman, prêta serment au fort d'al-Hazm après Sultan ibn Sayf; Ya'rub ibn Bil'arab se souleva contre lui, le captura et le tua; mourut en 1133 AH (1720) selon al-Zirikli."
