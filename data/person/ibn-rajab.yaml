summary:
  ar: "الإمام الحافظ زين الدين أبو الفرج عبد الرحمن بن أحمد الحنبلي، المعروف بابن رجب على لقب جده رجب بن الحسن؛ ولد ببغداد سنة 736هـ وقدم دمشق مع والده سنة 744هـ، ورحل في طلب العلم إلى مصر والحجاز والقدس، وصار من أعلام المذهب الحنبلي جامعاً بين الحديث والفقه، وتوفي بدمشق سنة 795هـ. من كتبه «جامع العلوم والحكم» شرح خمسين حديثاً."
  en: "The Hanbali hadith master and jurist Zayn al-Din Abu al-Faraj Abd al-Rahman ibn Ahmad, known as Ibn Rajab after his grandfather Rajab; born in Baghdad in 736 AH, moved to Damascus in 744, travelled for learning to Egypt, the Hijaz and Jerusalem, and died in Damascus in 795 AH. Author of 'Jami' al-Ulum wal-Hikam'."
  ur: "حنبلی حافظ حدیث اور فقیہ زین الدین ابو الفرج عبد الرحمن بن احمد، اپنے دادا رجب کے لقب سے ابن رجب معروف؛ 736ھ میں بغداد میں پیدا ہوئے، 744ھ میں دمشق آئے، علم کی طلب میں مصر، حجاز اور بیت المقدس کے سفر کیے اور 795ھ میں دمشق میں فوت ہوئے۔ «جامع العلوم والحکم» کے مصنف۔"
