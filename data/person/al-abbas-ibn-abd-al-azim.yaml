summary:
  ar: "العباس بن عبد العظيم العنبري البصري، أبو الفضل، حافظ واسع الرحلة وصفه الذهبي بالحجة الإمام، وقال النسائي ثقة مأمون، وتوفي سنة 246 هـ."
  en: "Al-Abbas ibn Abd al-Azim al-Anbari al-Basri, Abu al-Fadl, widely travelled memoriser whom al-Dhahabi calls a proof and an imam and whom al-Nasa'i called trustworthy and reliable; he died in 246 AH."
  fr: "Al-Abbas ibn Abd al-Azim al-Anbari al-Basri, Abu al-Fadl, mémorisateur ayant beaucoup voyagé qu’al-Dhahabi qualifie de preuve et d’imam, et qu’al-Nasa’i disait digne de confiance et fiable ; il mourut en 246 H."
  es: "Al-Abbas ibn Abd al-Azim al-Anbari al-Basri, Abu al-Fadl, memorizador que viajó mucho, a quien al-Dhahabi llama una prueba y un imán, y a quien al-Nasa'i llamó digno de confianza y fidedigno; murió en el año 246 de la Hégira."
  ur: "العباس بن عبد العظیم الانباری البصری، ابو الفضل، بڑے پیمانے پر سفر کرنے والے حافظ ہیں جنہیں الذہبی نے ثبوت اور امام کہا ہے اور جسے نسائی نے ثقہ اور قابل اعتماد کہا ہے۔ آپ کی وفات 246ھ میں ہوئی۔"
  tr: "El-Abbas ibn Abdülazim el-Enberi el-Basri, Ebu el-Fadl, geniş çapta seyahat etmiş bir ezberciydi. El-Dhahabi onu otorite sahibi imam olarak tanımlamış, el-Nasa'i ise güvenilir ve itimat edilebilir biri olduğunu söylemiştir. Hicri 246 yılında vefat etmiştir."
  id: "Al-Abbas ibn Abd al-Azim al-Anbari al-Basri, Abu al-Fadl, seorang penghafal Al-Quran yang banyak melakukan perjalanan. Al-Dhahabi menggambarkannya sebagai imam yang berwibawa, dan al-Nasa’i mengatakan bahwa ia dapat dipercaya dan diandalkan. Ia wafat pada tahun 246 Hijriah."
