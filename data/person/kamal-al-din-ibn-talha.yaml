summary:
  ar: "المفتي الرحال، مصنف كتاب العقد الفريد، وأحد الصدور والرؤساء المعظمين؛ سمع بنيسابور من المؤيد وزينب الشعرية وتفقه فبرع في الفقه والأصول والخلاف وترسل عن الملوك؛ وفي سنة ثمان وأربعين وستمائة كتب تقليده بالوزارة فاعتذر فلم يقبل منه فتولاها يومين ثم انسل خفية وترك الأموال والموجود ولبس ثوباً قطنياً وذهب فلم يدر أين ذهب؛ وولي قضاء نصيبين ثم خطابة دمشق ثم زهد في الدنيا فحج وأقام بدمشق قليلاً ثم سار إلى حلب فتوفي بها في رجب؛ وله الدر المنظم في اسم الله الأعظم وأبيات في رد قضاء المنجمين {cite:shadharat-dhahab p. 267-268}."
  en: "The wandering mufti and author of al-Iqd al-Farid (b. 582, d. Rajab 652 Aleppo) — in 648 his patent as vizier was drawn up; he bore the office two days, slipped away in a cotton gown leaving every dinar behind, and was never traced; earlier qadi of Nisibis and khatib of Damascus, and a versifier against astrologers' decrees {cite:shadharat-dhahab p. 267-268}."
  es: "El mufti errante y autor de al-Iqd al-Farid (n. 582, m. Rajab 652 Alepo) — en 648 se redactó su patente como visir; ocupó el cargo dos días, se escapó con una bata de algodón dejando atrás cada dinar y nunca fue localizado; cadí anterior de Nisibis y khatib de Damasco, y versificador contra los decretos de los astrólogos {citar: shadharat-dhahab p. 267-268}."
  fr: "Le mufti errant et auteur d'al-Iqd al-Farid (né en 582, décédé à Rajab en 652 à Alep) — en 648, son brevet de vizir fut rédigé; il a assumé cette fonction pendant deux jours, s'est enfui dans une robe de coton, laissant derrière lui chaque dinar, et n'a jamais été retrouvé; un ancien cadi de Nisibis et khatib de Damas, et un versificateur contre les décrets des astrologues {cite: shadharat-dhahab p. 267-268}."
  ur: "آوارہ مفتی اور العقد الفرید کے مصنف ⁦(پیدائش 582، وفات رجب 652 حلب)⁩ - 648 میں بطور وزیر اس کا پیٹنٹ تیار کیا گیا تھا۔ وہ دفتر میں دو دن بور ہوا، ہر رات کے کھانے کو پیچھے چھوڑ کر سوتی گاؤن میں پھسل گیا، اور اس کا کبھی پتہ نہیں چلا۔ نصیبیوں کے پہلے قاضی اور دمشق کے خطیب، اور نجومیوں کے احکام کے خلاف تصدیق کرنے والے 267-268}۔"
