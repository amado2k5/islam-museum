summary:
  ar: "المفتي الرحال، مصنف كتاب العقد الفريد، وأحد الصدور والرؤساء المعظمين؛ سمع بنيسابور من المؤيد وزينب الشعرية وتفقه فبرع في الفقه والأصول والخلاف وترسل عن الملوك؛ وفي سنة ثمان وأربعين وستمائة كتب تقليده بالوزارة فاعتذر فلم يقبل منه فتولاها يومين ثم انسل خفية وترك الأموال والموجود ولبس ثوباً قطنياً وذهب فلم يدر أين ذهب؛ وولي قضاء نصيبين ثم خطابة دمشق ثم زهد في الدنيا فحج وأقام بدمشق قليلاً ثم سار إلى حلب فتوفي بها في رجب؛ وله الدر المنظم في اسم الله الأعظم وأبيات في رد قضاء المنجمين {cite:shadharat-dhahab p. 267-268}."
  en: "The wandering mufti and author of al-Iqd al-Farid (b. 582, d. Rajab 652 Aleppo) — in 648 his patent as vizier was drawn up; he bore the office two days, slipped away in a cotton gown leaving every dinar behind, and was never traced; earlier qadi of Nisibis and khatib of Damascus, and a versifier against astrologers' decrees {cite:shadharat-dhahab p. 267-268}."
