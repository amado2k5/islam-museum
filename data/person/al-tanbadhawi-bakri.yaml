summary:
  ar: "شهاب الدين أحمد الطيب الطنبداوي البكري الصديقي الشافعي، شيخ الإسلام الحبر الإمام العارف القانت الأوّاه؛ ولد بعد السبعين وثمانمائة تقريباً وتفقه بالنور السمهودي والقاضي أحمد المزجد وغيرهما، وكان في أهل عصره بمنزلة الشمس من النجوم وتميز في معرفة المنطق والمفهوم، وكان شديد التصلب في الدين والصدع بالحق لا يخاف في الله لومة لائم، وكان يقول لتلميذه ابن زياد: أنتم نفعكم أحد المزجد ونحن بلحظه ولفظه؛ وأخذ عنه خلق منهم شيخ الإسلام ابن زياد والحافظ شهاب الدين أحمد الخزرجي وعبد الملك بن النقيب وصالح الماري، وانتهت إليه رياسة الفتوى والتدريس وانتفع به الخاص والعام؛ ومن مصنفاته فتاوى مشهورة عليها الاعتماد بزبيد وشرح التنبيه في أربع مجلدات وحاشية مفيدة على العباب. وقال الشيخ صالح النماري: من عجيب ما سمعته منه أنه قال طالعت جميع الإيضاح شرح الحاوي للناشري في ليلة واحدة وهو مجلدان ضخمان وعلّقت من كل باب فائدة وهذا خرق عادة، وقال الخولاني: سمعته يقول كانت الفوائد التي كتبتها تلك الليلة ثلاثة كراريس، وكان مفرط الذكاء يحفظ الإرشاد {cite:shadharat-dhahab p. 688-689}."
  en: "Zabid's riyasa of fatwa and teaching — 'the sun among his generation's stars', fierce for truth; Ibn Ziyad's own teacher (who told him 'you have one of the Muzjaj's profit, we have his glance and his tongue'); he skimmed both huge volumes of the Idah in a single night writing three notebooks of notes — 'a breach of the norm'; works: the relied-upon Zabid fatawa, Sharh al-Tanbih in four volumes, a gloss on al-'Ubab {cite:shadharat-dhahab p. 688-689}."
