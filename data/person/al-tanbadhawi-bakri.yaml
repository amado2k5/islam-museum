summary:
  ar: "شهاب الدين أحمد الطيب الطنبداوي البكري الصديقي الشافعي، شيخ الإسلام الحبر الإمام العارف القانت الأوّاه؛ ولد بعد السبعين وثمانمائة تقريباً وتفقه بالنور السمهودي والقاضي أحمد المزجد وغيرهما، وكان في أهل عصره بمنزلة الشمس من النجوم وتميز في معرفة المنطق والمفهوم، وكان شديد التصلب في الدين والصدع بالحق لا يخاف في الله لومة لائم، وكان يقول لتلميذه ابن زياد: أنتم نفعكم أحد المزجد ونحن بلحظه ولفظه؛ وأخذ عنه خلق منهم شيخ الإسلام ابن زياد والحافظ شهاب الدين أحمد الخزرجي وعبد الملك بن النقيب وصالح الماري، وانتهت إليه رياسة الفتوى والتدريس وانتفع به الخاص والعام؛ ومن مصنفاته فتاوى مشهورة عليها الاعتماد بزبيد وشرح التنبيه في أربع مجلدات وحاشية مفيدة على العباب. وقال الشيخ صالح النماري: من عجيب ما سمعته منه أنه قال طالعت جميع الإيضاح شرح الحاوي للناشري في ليلة واحدة وهو مجلدان ضخمان وعلّقت من كل باب فائدة وهذا خرق عادة، وقال الخولاني: سمعته يقول كانت الفوائد التي كتبتها تلك الليلة ثلاثة كراريس، وكان مفرط الذكاء يحفظ الإرشاد {cite:shadharat-dhahab p. 688-689}."
  en: "Zabid's riyasa of fatwa and teaching — 'the sun among his generation's stars', fierce for truth; Ibn Ziyad's own teacher (who told him 'you have one of the Muzjaj's profit, we have his glance and his tongue'); he skimmed both huge volumes of the Idah in a single night writing three notebooks of notes — 'a breach of the norm'; works: the relied-upon Zabid fatawa, Sharh al-Tanbih in four volumes, a gloss on al-'Ubab {cite:shadharat-dhahab p. 688-689}."
  fr: "Le riyâsa de Zabid de fatwa et d'enseignement - « le soleil parmi les étoiles de sa génération », féroce pour la vérité ; Le propre maître d'Ibn Ziyad (qui lui a dit : « Tu as un des bénéfices de Muzjaj, nous avons son regard et sa langue ») ; Il a écrémé les deux énormes volumes de l'Idah en une seule nuit en écrivant trois cahiers de notes - « une violation de la norme » ; œuvres : le Zabid fatawa, Sharh al-Tanbih en quatre volumes, un glose sur al-'Ubab {cite:shadharat-dhahab p. 688-689}."
  es: "La riyasa de fatwa y enseñanza de Zabid — 'el sol entre las estrellas de su generación', feroz en defensa de la verdad; el propio maestro de Ibn Ziyad (quien le dijo 'tienes una de las ventajas del Muzjaj, nosotros tenemos su mirada y su lengua'); hojeó los dos enormes volúmenes del Idah en una sola noche escribiendo tres cuadernos de notas — 'una ruptura de la norma'; obras: las fatwas de Zabid, en las que se confía, Sharh al-Tanbih en cuatro volúmenes, una glosa sobre al-'Ubab {cite:shadharat-dhahab p. 688-689}."
  ur: "زبید کا فتویٰ اور تعلیم کا ریاض - 'اپنی نسل کے ستاروں کے درمیان سورج'، سچائی کے لیے شدید؛ ابن زیاد کا اپنا استاد ⁦(جس نے اس سے کہا تھا کہ 'تمہارے پاس مستج کا ایک نفع ہے، ہمارے پاس اس کی نظر اور اس کی زبان ہے')⁩؛ اس نے ایک ہی رات میں Idah کی دونوں بڑی جلدوں کو نوٹوں کی تین نوٹ بکیں لکھیں - 'معمول کی خلاف ورزی'؛ تصانیف: زبید فتاویٰ پر انحصار، شرح التنبیح چار جلدوں میں، العباب پر ایک تالیف 688-689}۔"
  tr: "Şihabeddin Ahmed el-Tayyib el-Tenbedavi el-Bakri el-Siddiqi el-Şafii, Şeyh el-İslam, alim, bilgili İmam Qanat al-Awwah, yaklaşık sekiz yüz yetmiş yıl sonra doğdu ve el-Nur el-Samhudi, Kadı Ahmed el-Muzjad ve diğerlerinin yanında eğitim aldı. Çağdaşları arasında, yıldızlar arasındaki güneş gibiydi, mantık ve kavramı anlamada öne çıkıyordu. Dine derin bir bağlılık ve gerçeğinde kararlıydı, Allah uğruna suçlanmadan korkmuyordu. O öğrencisi İbn Ziyad'a şöyle derdi: 'Bir Muzjadd'dan fayda sağlarsınız, biz de onu anında ifade edebileceğiz.' Şeyh al-İslam İbn Ziyad, ezberci Şihabeddin Ahmed el-Hazraci, Abdülmelik bin Nekib ve Salih el-Mari gibi birçok kişi ondan derdi. Fetvaların ve öğretilerin liderliğini üstlendi ve hem seçkinlere hem de halka fayda sağladı. Eserleri arasında Zabid'in dayandığı ünlü fetvalar, dört ciltlik Şerh el-Tanbih ve yazıcılar üzerine faydalı bir kenar tefsiri yer alır. Şeyh Salih el-Namari şöyle dedi: Ondan duyduğum garip şeylerden biri, şöyle dedi: El-Hawi'nin Al-Nashiri'nin tüm açıklamalarını bir gecede okudum, ki bu iki büyük ciltten oluşuyor ve faydanın her bölümüne yorum yaptım, bu da geleneği ihlal etmek. Al-Khawlani şöyle dedi: O gece yazdığım faydaların üç defter olduğunu, son derece zeki olduğunu ve rehberliği ezberlediğini {atıf:shadharat-dhahab, s. 688-689} demişti."
  id: "Shihab al-Din Ahmad al-Tayyib al-Tanbadawi al-Bakri al-Siddiqi al-Shafi'i, Sheikh al-Islam, seorang ulama, Imam yang berpengetahuan, Qanat al-Awwah, lahir setelah sekitar delapan ratus tujuh puluh tahun dan belajar di bawah bimbingan al-Nur al-Samhudi, Qadi Ahmad al-Muzjad, dan lainnya. Di antara sezamannya, ia seperti matahari di antara bintang-bintang, dikenal dalam pemahaman logika dan konsep. Ia sangat teguh dalam agama dan teguh pada kebenarannya, tidak takut menyalahkan demi Tuhan. Ia biasa berkata untuk muridnya Ibn Ziyad: 'Anda mendapat manfaat dari salah satu Muzjadd, dan kami akan dapat mengungkapkannya pada saatnya.' Banyak orang lain belajar darinya, termasuk Sheikh al-Islam Ibn Ziyad, pengapal Shihab al-Din Ahmad al-Khazraji, Abd al-Malik ibn al-Naqib, dan Salih al-Mari. Ia memimpin fatwa dan pengajaran serta memberikan manfaat baik bagi elit maupun masyarakat. Di antara karya-karyanya terdapat fatwa terkenal yang diandalkan oleh Zabid, Sharh al-Tanbih dalam empat jilid, dan komentar pinggiran yang berguna tentang para juru tulis. Sheikh Saleh al-Namari berkata: Salah satu hal aneh yang saya dengar darinya adalah dia berkata: Saya membaca semua klarifikasi komentar Al-Hawi oleh Al-Nashiri dalam satu malam, yang terdiri dari dua jilid besar, dan saya mengomentari setiap bagian manfaat, yang merupakan pelanggaran kebiasaan. Al-Khawlani berkata: Saya mendengar dia mengatakan bahwa manfaat yang saya tulis malam itu adalah tiga buku catatan, dan dia sangat cerdas dan menghafal bimbingan {cite:shadharat-dhahab, hlm. 688-689}."
