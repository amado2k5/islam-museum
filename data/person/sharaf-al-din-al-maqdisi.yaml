summary:
  ar: "الفقيه الحنبلي؛ سمع الكثير من أبي اليمن الكندي وجماعة بعده وتفقه على الشيخ الموفق وبرع وأفتى ودرس بالجوزية مدة؛ قال أبو شامة كان رجلاً خيراً؛ توفي ليلة ثامن المحرم بدمشق ودفن بالجبل {cite:shadharat-dhahab p. 306}."
  en: "The Salihi Hanbali jurist (b. 605) — al-Muwaffaq's pupil, mufti and Jawziyya mudarris; Abu Shama: 'a good man'; d. night of 8 Muharram 659, buried on the mountain {cite:shadharat-dhahab p. 306}."
  es: "El jurista hanbalí Salihi (n. 605) — discípulo, muftí y jurista de al-Muwaffaq; Abu Shama: 'un buen hombre'; murió la noche del 8 de Muharram de 659, enterrado en la montaña {cita: shadharat-dhahab p. 306}."
  fr: "Le juriste hanbalite Salihi (né en 605) — élève, mufti et juriste d'al-Muwaffaq; Abu Shama: « un homme bon »; mort dans la nuit du 8 Muharram 659, enterré sur la montagne {cite: shadharat-dhahab p. 306}."
  ur: "صالحی حنبلی فقیہ ⁦(متوفی 605)⁩ - الموفق کا شاگرد، مفتی اور جوزیہ مدارس؛ ابو شمع: 'ایک اچھا آدمی'؛ d 8 محرم 659 کی رات، پہاڑ پر دفن 306}۔"
  tr: "Hanbali hukukçu; Ebu el-Yaman el-Kindi ve ondan sonraki bir gruptan çok şey duydu, Şeyh el-Muvafık'ın yanında fıkıh okudu, üstün başarı gösterdi, fetvalar verdi ve bir süre el-Cevziye'de eğitim aldı; Ebu Şama onun iyi bir adam olduğunu söyledi; Şam'da Muharrem ayının sekizinci gecesi öldü ve dağa gömüldü {kaynak: Shadharat-Dhahab, s. 306}."
  id: "Ahli hukum Hanbali; ia banyak mendengar dari Abu al-Yaman al-Kindi dan kelompok setelahnya, belajar hukum di bawah Sheikh al-Muwaffaq, unggul, mengeluarkan fatwa, dan belajar di al-Jawziyyah untuk sementara waktu; Abu Shama berkata ia adalah orang baik; ia meninggal pada malam tanggal delapan Muharram di Damaskus dan dimakamkan di gunung {cite:shadharat-dhahab, hlm. 306}."
