summary:
  ar: "أحد فضلاء الأندلس وحفاظها المتقنين، نسبة إلى بياسة مدينة كبيرة من كورجيان؛ كان أديباً بارعاً مطلعاً على أقسام كلام العرب من النظم والنثر وراوية لوقائعها وحروبها وأيامها، قال ابن خلكان بلغني أنه كان يحفظ كتاب الحماسة وديوان المتنبي وسقط الزند؛ وتنقل في بلاد الأندلس وطاف أكثرها، وألف لصاحب إفريقية كتاب الإعلام بالحروب الواقعة في صدر الإسلام في مجلدين ابتدأه بقتل عمر بن الخطاب وختمه بخروج الوليد بن طريف الشاري على هارون الرشيد، وله كتاب الحماسة في مجلدين أيضاً {cite:shadharat-dhahab p. 270-271}."
  en: "Andalusi hafiz and adib of Biyasa in the Coriana district (b. 573, d. Tunis 4 Dhu al-Qa'da 653) — he knew the Hamasa, the Mutanabbi diwan and Saqt al-Zand by heart, and wrote for the Hafsid ruler al-I'lam bi-al-Hurub al-Waqi'a fi Sadr al-Islam in two volumes, from Umar's killing to al-Walid b. Tarif's revolt {cite:shadharat-dhahab p. 270-271}."
