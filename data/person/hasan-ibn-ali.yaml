    summary: { en: "Sunni tradition reveres Hasan as the Prophet's beloved grandson and counts his abdication an act of reconciliation that ended the first civil war — 'the year of unity'.", ar: "تُجِلّ السنة الحسنَ سبط النبي، وتعدّ تنازله مصالحة أنهت الفتنة الأولى، فيُذكر عامه «عام الجماعة»." }
