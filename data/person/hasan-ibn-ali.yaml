  - tradition: academic
    id: academic
    summary: { en: "Historians describe a caliphate that lacked the military and political base to continue, so that the abdication was as much a consequence of weakness as of peacemaking.", ar: "يصف المؤرخون خلافة فقدت القاعدة العسكرية والسياسية للاستمرار، فكان التنازل نتيجة ضعف بقدر ما كان صلحًا." }
    sources: [source/madelung-1997]
