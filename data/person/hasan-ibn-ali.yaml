summary:
  en: "Elder grandson of the Prophet through Fatima and Ali; briefly caliph in 661 CE before abdicating in favor of Muawiya, an act understood differently across the traditions."
  ar: "حفيد النبي الأكبر من فاطمة وعلي، تولّى الخلافة فترة وجيزة سنة 661م قبل أن يتنازل عنها لمعاوية، وهو أمر تفهمه التقاليد بصورة مختلفة. وصلى على أبيه مكبراً سبعاً وقيل غير ذلك، وقال لقد قبض فيكم الليلة رجل ما سبقه الأولون إلا بفضل النبوة ولا يدركه الآخرون {cite:muruj-al-dhahab p. 703-704}، ومن خطبه نحن حزب الله المفلحون وعترة رسوله الأقربون وأحد الثقلين اللذين خلفهما، وأمره أبوه أن يصلي بالناس يوم الجمعة حين اعتل فقال لا تكون علينا دولة إلا وتكون لنا العاقبة {cite:muruj-al-dhahab p. 721}، وفي مسلم أدخله النبي تحت المرط المرحل مع أخيه وأبويه وتلا آية التطهير {cite:sahih-muslim 2424}، وروى البراء أنه رأى الحسن على عاتق النبي وهو يقول «اللهم إني أحبه فأحبه» {cite:sahih-muslim 2421}"
