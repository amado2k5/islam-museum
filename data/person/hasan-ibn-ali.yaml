summary:
  en: "Elder grandson of the Prophet through Fatima and Ali; briefly caliph in 661 CE before abdicating in favor of Muawiya, an act understood differently across the traditions. The Encyclopaedia of Islam reports that after Ali was killed he received allegiance in Kufa, that his army weakened through defections near al-Mada'in, and that he renounced the office on terms the sources report differently. It also records that Shi'is count him their second imam, and that he died in Medina around 49 AH, by illness or by poisoning according to the sources."
  ar: "حفيد النبي الأكبر من فاطمة وعلي، تولّى الخلافة فترة وجيزة سنة 661م قبل أن يتنازل عنها لمعاوية، وهو أمر تفهمه التقاليد بصورة مختلفة. وصلى على أبيه مكبراً سبعاً وقيل غير ذلك، وقال لقد قبض فيكم الليلة رجل ما سبقه الأولون إلا بفضل النبوة ولا يدركه الآخرون {cite:muruj-al-dhahab p. 703-704}، ومن خطبه نحن حزب الله المفلحون وعترة رسوله الأقربون وأحد الثقلين اللذين خلفهما، وأمره أبوه أن يصلي بالناس يوم الجمعة حين اعتل فقال لا تكون علينا دولة إلا وتكون لنا العاقبة {cite:muruj-al-dhahab p. 721}، وفي مسلم أدخله النبي تحت المرط المرحل مع أخيه وأبويه وتلا آية التطهير {cite:sahih-muslim 2424}، وروى البراء أنه رأى الحسن على عاتق النبي وهو يقول «اللهم إني أحبه فأحبه» {cite:sahih-muslim 2421}. وتذكر دائرة المعارف الإسلامية أنه بُويع في الكوفة بعد مقتل علي، وأن جنده ضعف بالانشقاقات قرب المدائن، وأنه تخلى عن الخلافة بشروط تختلف فيها المصادر، وأن الشيعة يعدونه إمامهم الثاني، وأنه توفي في المدينة نحو سنة 49هـ بمرض أو بسم بحسب المصادر"
  ur: "علی بن ابی طالب اور فاطمہ کے بیٹے؛ علی کے بعد بیعت لی اور پھر معاویہ کے ساتھ صلح کے ذریعے اقتدار سے الگ ہوئے۔ {cite:ibn-sad-tabaqat-bewley} دائرۃ المعارف اسلامیہ کے مطابق علی کے قتل کے بعد کوفہ میں ان کی بیعت ہوئی، مدائن کے قریب ساتھ چھوڑنے سے ان کا لشکر کمزور ہوا، اور انہوں نے ان شرائط پر خلافت چھوڑی جنہیں ماخذ مختلف طرح بیان کرتے ہیں۔ شیعہ انہیں اپنا دوسرا امام مانتے ہیں، اور ماخذ کے مطابق وہ تقریباً 49ھ میں مدینہ میں بیماری یا زہر سے فوت ہوئے۔"
  es: "Nieto mayor del Profeta por medio de Fátima y Alí; califa por un breve período en el año 661 d. C. antes de abdicar en favor de Muawiya, un acto cuya interpretación varía según las tradiciones. La Enciclopedia del Islam informa que, tras la muerte de Alí, recibió lealtad en Kufa, que su ejército se debilitó por deserciones cerca de al-Mada'in y que renunció al cargo en términos que las fuentes describen de manera diferente. También registra que los chiíes lo consideran su segundo imán y que murió en Medina alrededor del año 49 d. H., por enfermedad o envenenamiento, según las fuentes."
  fr: "Petit-fils aîné du Prophète par Fatima et Ali, Ali fut brièvement calife en 661 avant d'abdiquer en faveur de Muawiya, un acte dont l'interprétation varie selon les traditions. L'Encyclopédie de l'Islam rapporte qu'après sa mort, Ali reçut l'allégeance de Kufa, que son armée s'affaiblit suite à des défections près d'al-Mada'in, et qu'il renonça à sa charge dans des conditions dont les sources divergent. Elle indique également que les chiites le considèrent comme leur second imam, et qu'il mourut à Médine vers l'an 49 de l'Hégire, de maladie ou d'empoisonnement selon les sources."
  tr: "Peygamber'in Fatima ve Ali'den en büyük oğlunun torununun torunu olan Sher, 661 yılında kısa bir süreliğine halifeliği üstlendikten sonra Muaviye'ye devretti; gelenekler farklı yorum yapar. Babası için yedi kez tekbirle dua etti, bazıları ise aksi dedi. Dedi ki: Bu gece, aranızdan geçmiş bir adam var, ondan önce sadece peygamberlik sayesinde vardı, diğerleri ona ulaşamayacak. {alıntı:Muruj-al-Dhahab s. 703-704} Ve vaazları arasında, Allah'ın başarılı tarafı, Elçi'nin en yakın soyundan biri ve arkasındaki en etkili iki kişiden biri, babası tarafından hastalandığında cuma günü halkı namaza götürmesi emredildi ve şöyle dedi: 'Üzerimizde sadece sonuca ulaşacağız' {cite:Muruj-al-Dhahab s. 721}. Başka bir Müslüman'da Peygamber, onu kardeşi ve ailesiyle birlikte sürgün edilmiş martabın altına koydu ve Temizlenme Ayetini okudu {cite:sahih-muslim 2424}. Al-Bar', Hasan'ı Peygamber'in omuzlarında \"Ey Allah, onu seviyorum, öyle sev\" dediğini gördüğünü rivayet etti {cite:sahih-muslim 2421}. İslami Ansiklopedi, Ali'nin suikastından sonra Kufe'ye bağlılık yemini ettiğini, ordusunun şehir yakınlarındaki kaçmalar nedeniyle zayıfladığını, halifeliği kaynaklar açısından farklı koşullarda bıraktığını, Şiilerin onu ikinci imamları olarak gördüğünü ve kaynaklara göre yaklaşık 49 Hicri yılında Medine'de hastalık veya zehirden öldüğünü belirtir"
  id: "Cicit dari anak sulung Nabi dari Fatima dan Ali, ia sempat mengambil alih kekhalifahan pada tahun 661 M sebelum menyerahkannya kepada Muawiya, yang menurut tradisi tersebut berbeda penafsirannya. Dia berdoa untuk ayahnya dengan takbir tujuh kali, dan beberapa berkata lain. Dia berkata: Malam ini, seorang pria telah meninggal di antara kalian yang telah didahului oleh orang leluhur kecuali karena kenabian, dan yang lain tidak akan mencapainya. {cite:muruj-al-dhahab hlm. 703-704} Dan di antara khotbah-khotbahnya, kami, pihak yang berhasil dari Allah, keturunan terdekat Rasul-Nya, dan salah satu dari dua orang paling berpengaruh di belakang mereka, diperintahkan oleh ayahnya untuk memimpin umat dalam shalat pada hari Jumat ketika dia sakit, dengan berkata: 'Tidak akan ada negara atas kita kecuali kita akan mendapatkan hasilnya' {cite:muruj-al-dhahab hlm. 721}. Dalam Muslim lain, Nabi menempatkannya di bawah martab yang diasingkan bersama saudara dan orang tuanya dan melafalkan Ayat Penyucian {cite:sahih-muslim 2424}. Al-Bara' menceritakan bahwa dia melihat Hasan di atas bahu Nabi berkata, \"Ya Allah, aku mencintainya, maka kasihi dia\" {cite:sahih-muslim 2421}. Ensiklopedia Islam menyebutkan bahwa ia telah bersumpah setia di Kufa setelah pembunuhan Ali, bahwa pasukannya melemah akibat pembelotan di dekat kota, bahwa ia turun tahta dari kekhalifahan dengan kondisi sumber yang berbeda, bahwa Syiah menganggapnya sebagai Imam kedua mereka, dan bahwa ia meninggal di Madinah sekitar tahun 49 Hm karena penyakit atau racun menurut sumber"
