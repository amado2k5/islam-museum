label:
  ar: أبو ثابت عامر بن عبد الرحمن
  en: Abu Thabit Amir ibn Abd al-Rahman
summary:
  ar: "أبو ثابت عامر بن عبد الرحمن بن أبي يحيى بن يغمراسن؛ شارك أخاه أبا سعيد في استرداد ملك تلمسان بعد نكبة القيروان سنة 748هـ، ولقيه الناصر ابن السلطان أبي عنان في حروب عرفت بها وقائعه، وحاربا مغراوة واستولى على بلادهم، ثم تقبض عليه الحفصيون بوطن بجاية فأغفل من بينهم أمر ابن أخيه أبي حمو موسى فنجا إلى تونس، ودام شأنه حتى استولى السلطان أبو عنان على تلمسان وانقرض ملكه بها."
  en: "Abu Thabit Amir ibn Abd al-Rahman ibn Abi Yahya ibn Yaghmurasan; co-restorer with his brother Abu Sa'id of the Tlemcen kingship after the Qayrawan disaster of 748 — he met al-Nasir son of Sultan Abu Inan in famous encounters, warred on Maghrawa and took their lands, until the Hafsids seized him in the Béjaïa country while his nephew Abu Hammu Musa slipped through to Tunis — his rule ending when Sultan Abu Inan took Tlemcen and extinguished the kingdom there."
