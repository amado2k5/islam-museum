id: person/abu-thabit-amir-zayyanid
class: person
label:
  ar: أبو ثابت عامر بن عبد الرحمن
  en: Abu Thabit Amir ibn Abd al-Rahman
  fr: "Abu Thabit Amir ibn Abd al-Rahman"
  es: "Abu Thabit Amir ibn Abd al-Rahman"
  ur: "ابو ثابت عامر بن عبدالرحمٰن"
summary:
  ar: "أبو ثابت عامر بن عبد الرحمن بن أبي يحيى بن يغمراسن؛ شارك أخاه أبا سعيد في استرداد ملك تلمسان بعد نكبة القيروان سنة 748هـ، ولقيه الناصر ابن السلطان أبي عنان في حروب عرفت بها وقائعه، وحاربا مغراوة واستولى على بلادهم، ثم تقبض عليه الحفصيون بوطن بجاية فأغفل من بينهم أمر ابن أخيه أبي حمو موسى فنجا إلى تونس، ودام شأنه حتى استولى السلطان أبو عنان على تلمسان وانقرض ملكه بها."
  en: "Abu Thabit Amir ibn Abd al-Rahman ibn Abi Yahya ibn Yaghmurasan; co-restorer with his brother Abu Sa'id of the Tlemcen kingship after the Qayrawan disaster of 748 — he met al-Nasir son of Sultan Abu Inan in famous encounters, warred on Maghrawa and took their lands, until the Hafsids seized him in the Béjaïa country while his nephew Abu Hammu Musa slipped through to Tunis — his rule ending when Sultan Abu Inan took Tlemcen and extinguished the kingdom there."
  fr: "Abu Thabit Amir ibn Abd al-Rahman ibn Abi Yahya ibn Yaghmurasan ; il rétablit avec son frère Abu Sa'id la royauté de Tlemcen après le désastre de Kairouan de 748. Il affronta al-Nasir, fils du sultan Abu Inan, dans des rencontres célèbres, combattit les Maghrawa et prit leurs terres, jusqu'à sa capture par les Hafsides dans la région de Béjaïa, tandis que son neveu Abu Hammu Musa s'échappait vers Tunis. Son pouvoir prit fin lorsque le sultan Abu Inan prit Tlemcen et y éteignit le royaume."
  es: "Abu Thabit Amir ibn Abd al-Rahman ibn Abi Yahya ibn Yaghmurasan; co-restaurador junto con su hermano Abu Sa'id del reino de Tlemcen tras el desastre de Qayrawan en 748, se enfrentó a al-Nasir, hijo del sultán Abu Inan, en famosos encuentros, guerreó contra Maghrawa y se apoderó de sus tierras, hasta que los Hafsidas lo capturaron en la región de Béjaïa mientras su sobrino Abu Hammu Musa escapaba a Túnez; su reinado terminó cuando el sultán Abu Inan tomó Tlemcen y extinguió el reino allí."
  ur: "ابو ثابت عامر بن عبدالرحمن ابن ابی یحییٰ بن یغموراسن۔ 748 کی قیروان آفت کے بعد اپنے بھائی ابو سعید کے ساتھ ٹیلمسن بادشاہی کا شریک بحال کرنے والا - اس نے مشہور معرکوں میں سلطان ابو عنان کے بیٹے النصیر سے ملاقات کی، مغراوہ سے جنگ کی اور ان کی زمینوں پر قبضہ کیا، یہاں تک کہ حفصیوں نے اسے بیجائیہ کے ملک میں قبضہ کر لیا جب کہ اس کے بھتیجے ابوسعان کے ذریعے اس کے بھتیجے ابو معنون کی حکومت ہوئی۔ انان نے Tlemcen کو لے لیا اور وہاں کی سلطنت کو بجھا دیا۔"
  tr: "Ebu Sabit Amer bin Abdül Rahman bin Ebu Yahya bin Yaghmurasen; Hicri 748 yılında Kayrevan felaketinden sonra Tlemcen krallığını yeniden kurmada kardeşi Ebu Said ile birlikte yer aldı ve savaşlarda Sultan Ebu Anan'ın oğlu Nasır ile karşılaştı; bu savaşlardaki başarıları biliniyordu ve Mağrava ile savaştılar ve topraklarını ele geçirdiler. Daha sonra Hafsidler onu Bejaia'daki memleketinde yakaladılar, bu yüzden yeğeni Ebu Hammu Musa'nın meselesini ihmal etti ve Tunus'a kaçtı. Durumu, Sultan Ebu Anan'ın Tlemcen'i ele geçirmesi ve oradaki krallığının sona ermesine kadar devam etti."
  id: "Abu Thabit Amer bin Abdul Rahman bin Abi Yahya bin Yaghmurasen; ia bersama saudaranya Abu Saeed turut serta dalam memulihkan kerajaan Tlemcen setelah bencana Kairouan pada tahun 748 H, dan ia bertemu dengan Al-Nasir bin Sultan Abu Anan dalam peperangan di mana keberaniannya dikenal, dan mereka berperang melawan Maghrawa dan merebut tanah mereka, kemudian kaum Hafsid menangkapnya di tanah kelahirannya di Bejaia, sehingga ia mengabaikan masalah keponakannya Abu Hammu Musa di antara mereka, sehingga ia melarikan diri ke Tunisia, dan situasinya berlanjut hingga Sultan Abu Anan merebut Tlemcen dan kerajaannya di sana berakhir."
