summary:
  en: "The Arab warden appointed by Ardashir over al-Hira and the desert Arabs of Iraq and the Jazira — the Persian experiment of ruling the nomads through one of their own, which became the Lakhmid system; he died around 268 CE."
  ar: "الوالي العربي الذي نصبه أردشير على الحيرة وسائر من ببادية العراق والجزيرة من ربيعة ومضر؛ تجربة حكم البادية برجل منهم له عصبية، وهي التي صارت نظام المناذرة؛ مات نحو سنة 268م.، وعند المسعودي أقام ملكاً خمساً وتسعين سنة في زمن ملوك الطوائف وثلاثاً وعشرين سنة في ملك أردشير بن بابك وسابور الجنود فكان ملكه مائة وثمانية عشرة سنة، وكان يكنى أبا مالك، وقتلته الزباء بنت عمرو بعد أن أطمعته في نفسها {cite:muruj-al-dhahab p. 409}"
