summary:
  en: "The Arab warden appointed by Ardashir over al-Hira and the desert Arabs of Iraq and the Jazira — the Persian experiment of ruling the nomads through one of their own, which became the Lakhmid system; he died around 268 CE."
  ar: "الوالي العربي الذي نصبه أردشير على الحيرة وسائر من ببادية العراق والجزيرة من ربيعة ومضر؛ تجربة حكم البادية برجل منهم له عصبية، وهي التي صارت نظام المناذرة؛ مات نحو سنة 268م. وعند المسعودي أقام ملكاً خمساً وتسعين سنة في زمن ملوك الطوائف وثلاثاً وعشرين سنة في ملك أردشير بن بابك وسابور الجنود فكان ملكه مائة وثمانية عشرة سنة، وكان يكنى أبا مالك، وقتلته الزباء بنت عمرو بعد أن أطمعته في نفسها {cite:muruj-al-dhahab p. 409}"
  es: "El carcelero árabe designado por Ardashir sobre al-Hira y los árabes del desierto de Irak y Jazira —el experimento persa de gobernar a los nómadas a través de uno de los suyos, que se convirtió en el sistema Lakhmid— murió alrededor del año 268 d.C."
  fr: "Le gardien arabe nommé par Ardashir sur al-Hira et les Arabes du désert d'Irak et de la Jazira — l'expérience perse de gouverner les nomades par l'intermédiaire de l'un des leurs, qui devint le système Lakhmid; il mourut vers 268 de notre ère."
  ur: "اردشیر کے ذریعہ الحیرہ اور عراق کے صحرائی عربوں اور جزیرہ پر مقرر کردہ عرب وارڈن - خانہ بدوشوں پر ان کے اپنے ایک کے ذریعے حکومت کرنے کا فارسی تجربہ، جو لخمی نظام بن گیا۔ اس کی وفات 268 عیسوی کے قریب ہوئی۔"
  tr: "Ardaşir tarafından Al-Hirah ve Irak ile Cezira bölgesinin tüm çöllerine, Rabi'ah ve Mudar dahil olmak üzere atanan Arap vali; aralarından bir aşiret bağlantısı olan biriyle çölü yönetmeyi deneyimledi ve bu kişi Muhadhiraların tarikatı haline geldi; yaklaşık 268 yılında öldü. Al-Mas'udi, Taifa kralları döneminde doksan beş yıl ve Ardashir ibn Babak ile Sabur al-Junud'un hükümdarlığında yirmi üç yıl hüküm sürdü, böylece hükümdarlığı yüz on sekiz yıl sürdü. Adı Ebu Malikti. El-Zaba'bin Amr tarafından ona gözlendikten sonra öldürüldü {atıf:Muruj-al-Dhahab, s. 409}"
  id: "Gubernur Arab yang diangkat oleh Ardashir atas Al-Hirah dan semua gurun Irak serta wilayah Jazira, termasuk Rabi'ah dan Mudar; ia mengalami pemerintahan gurun bersama seorang pria dari antara mereka yang memiliki afiliasi suku, yang kemudian menjadi tatanan Muhadhira; ia meninggal sekitar tahun 268 M. Al-Mas'udi memerintah selama sembilan puluh lima tahun pada masa pemerintahan raja-raja Taifa dan dua puluh tiga tahun di bawah Ardashir ibn Babak dan Sabur al-Junud, sehingga pemerintahannya berlangsung seratus delapan belas tahun. Ia disebut Abu Malik. Ia dibunuh oleh al-Zaba' bint Amr setelah ia menginginkannya {cite:Muruj-al-dhahab, hlm. 409}"
