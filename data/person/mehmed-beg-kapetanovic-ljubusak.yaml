summary:
  ar: "كاتب وجامع تراث شعبي وسياسي بوسني من فيتينا قرب ليوبوشكي، ثاني عمدة لسراييفو (1893–1899): قائمقام عثماني سابق جلب لسراييفو الإنارة الكهربائية وأول ترام كهربائي، وأسس مجلة «بوشنياك» سنة 1891، وجمع نحو خمسة آلاف مثل شعبي في «الكنز الشعبي» (1887)، وكتب باسم محبي."
  en: "Bosnian writer, folklorist and politician from Vitina near Ljubuški, second mayor of Sarajevo (1893–1899): a former Ottoman kaymakam who brought electric lighting and the first electric tram to Sarajevo, founded the journal Bošnjak (1891), and collected some 5,000 folk proverbs in Narodno blago (1887), writing as Muhibi."
  ur: "ویتینا (نزد لیوبوشکی) سے تعلق رکھنے والے بوسنیائی ادیب، لوک ادب کے جامع اور سیاست دان، سرائیوو کے دوسرے میئر (1893ء–1899ء): سابق عثمانی قائم مقام جنھوں نے سرائیوو میں بجلی کی روشنی اور پہلی برقی ٹرام لائی، 1891ء میں جریدہ «بوشنیاک» نکالا، اور «نارودنو بلاگو» (1887ء) میں تقریباً پانچ ہزار لوک کہاوتیں جمع کیں؛ تخلص محبی تھا۔"
