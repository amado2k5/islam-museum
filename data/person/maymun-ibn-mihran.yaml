label: { ar: "ميمون بن مهران", en: "Maymun ibn Mihran", es: "Maymun ibn Mihran", fr: "Maymun ibn Mihran", ur: "میمون بن مہران" }
summary:
  ar: "ميمون بن مهران الجزري الرقي، من فقهاء التابعين وقضاة الجزيرة في العصر الأموي؛ عند البلاذري عنه — بسند داود بن عبد الحميد قاضي الرقة عن أبيه عن جده — قوله «الجزيرة كلها فتوح إياد بن غنم بعد وفاة أبي عبيدة»، وهو من أهلها وأعلم الناس بأخبارها. ويذكر الكتاب أنه كان من المقربين إلى عمر بن عبد العزيز ومن مستشاريه، وأنه كان على خراج الجزيرة وقضائها، وأن عمر قال إنه إذا ذهب مثل ميمون وأضرابه صار الناس رجراجة. {cite:salabi-umayyad-state-2020 p.272-274}"
  en: "Maymun ibn Mihran of the Jazira and al-Raqqa, a jurist of the Followers and judge of the Jazira in the Umayyad age; in al-Baladhuri, through the Raqqa judge Dawud ibn Abd al-Hamid's family chain, his saying 'the whole Jazira is Iyad ibn Ghanm's conquest after Abu Ubayda's death' — he being of that country and among those most knowing of its reports."
  es: "Maymun ibn Mihran de Jazira y al-Raqqa, jurista de los Seguidores y juez de Jazira en la época omeya; en al-Baladhuri, a través de la cadena familiar del juez de Raqqa Dawud ibn Abd al-Hamid, su dicho \"toda Jazira es conquistada por Iyad ibn Ghanm después de la muerte de Abu Ubayda\" —siendo él de ese país y uno de los que mejor conocían sus relatos."
  fr: "Maymun ibn Mihran de la Jazira et d'al-Raqqa, juriste des Suprêmes et juge de la Jazira à l'époque omeyyade; dans al-Baladhuri, à travers la chaîne familiale du juge de Raqqa Dawud ibn Abd al-Hamid, son affirmation « toute la Jazira est la conquête d'Iyad ibn Ghanm après la mort d'Abu Ubayda » — étant originaire de ce pays et parmi ceux qui connaissent le mieux ses récits."
  ur: "جزیرہ کا میمون بن مہران اور الرقہ، پیروکاروں کا ایک فقیہ اور اموی دور میں جزیرہ کا قاضی؛ البلادوری میں، رقہ کے جج داؤد بن عبد الحمید کے خاندانی سلسلے کے ذریعے، ان کا یہ قول 'پورا جزیرہ ابو عبیدہ کی موت کے بعد عیاض بن غنم کی فتح ہے' - وہ اس ملک کا رہنے والا ہے اور اس کی رپورٹوں کو سب سے زیادہ جاننے والوں میں ہے۔"
  tr: "Tebi'in hukukçularından ve Emevi döneminde yarımadanın yargıçlarından biri olan Maymun ibn Mihran al-Jazari al-Ruqayy; el-Baladhuri'nin kendisinden anlattığına göre—Rakka hakimi Davud bin Abd al-Hamid'in anlatım zinciriyle, babasından büyükbabasından gelen—şu ifadesi: 'Adanın tamamı, Ebu Ubeyde'nin ölümünden sonra İyad bin Ghanam'ın fetihleriydi,' ve kendisi halkından biri ve haberleri konusunda en iyi bilgiye sahip olan kişiydi. Kitapta, Ömer bin Abdülaziz ve danışmanlarından birine yakın olduğu, yarımadanın hazinesi ve yargısından sorumlu olduğu ve Ömer'in, Maymun ve kabileleri giderse halkın huzursuzlanacağını söylediği belirtilir. {alıntı:Selabi-Emevî-devlet-2020 s.272-274}"
  id: "Maymun ibn Mihran al-Jazari al-Ruqayy, salah satu ahli hukum Tabi'in dan hakim semenanjung pada era Umayyah; menurut al-Baladhuri darinya—dengan rantai narasi Dawud ibn Abd al-Hamid, hakim Raqqa, dari ayahnya dari kakeknya—pernyataannya: 'Seluruh pulau itu adalah penaklukan Iyad ibn Ghanam setelah kematian Abu Ubaidah,' dan dia termasuk di antara penduduknya dan paling mengetahui kabarnya. Buku itu menyebutkan bahwa dia dekat dengan Umar ibn Abd al-Aziz dan salah satu penasihatnya, bahwa dia bertanggung jawab atas perbendaharaan dan peradilan semenanjung, dan bahwa Umar berkata bahwa jika seseorang seperti Maymun dan suku-sukunya pergi, orang-orang akan menjadi gelisah. {cite:salabi-umayyad-state-2020 hlm.272-274}"
