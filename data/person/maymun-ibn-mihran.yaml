label: { ar: "ميمون بن مهران", en: "Maymun ibn Mihran" }
summary:
  ar: "ميمون بن مهران الجزري الرقي، من فقهاء التابعين وقضاة الجزيرة في العصر الأموي؛ عند البلاذري عنه — بسند داود بن عبد الحميد قاضي الرقة عن أبيه عن جده — قوله «الجزيرة كلها فتوح إياد بن غنم بعد وفاة أبي عبيدة»، وهو من أهلها وأعلم الناس بأخبارها. ويذكر الكتاب أنه كان من المقربين إلى عمر بن عبد العزيز ومن مستشاريه، وأنه كان على خراج الجزيرة وقضائها، وأن عمر قال إنه إذا ذهب مثل ميمون وأضرابه صار الناس رجراجة. {cite:salabi-umayyad-state-2020 p.272-274}"
  en: "Maymun ibn Mihran of the Jazira and al-Raqqa, a jurist of the Followers and judge of the Jazira in the Umayyad age; in al-Baladhuri, through the Raqqa judge Dawud ibn Abd al-Hamid's family chain, his saying 'the whole Jazira is Iyad ibn Ghanm's conquest after Abu Ubayda's death' — he being of that country and among those most knowing of its reports."
