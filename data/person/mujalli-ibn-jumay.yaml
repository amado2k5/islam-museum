summary:
  ar: "مجلي بن جميع بن نجا، أبو المعالي القرشي المخزومي الأرسوفي الأصل المصري، قاضي القضاة، تولى قضاء الديار المصرية سنة ٥٤٧ه، وإليه ترجع الفتيا بمصر، قال السبكي إنه من أئمة الأصحاب، ومن تصانيفه الذخائر المبسوط في فقه الشافعية، والعمدة في أدب القضاء. ⁦(؟-٥٥٠ه)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13358}"
  en: "Mujalli ibn Jumay ibn Naja, Abu al-Ma'ali al-Qurashi al-Makhzumi, of Arsuf origin and Egyptian residence. He was chief judge of Egypt from 547 H, and fatwas in Egypt were referred to him. Al-Subki called him one of the imams of the school. His works are al-Dhakha'ir, a broad treatise on Shafi'i fiqh, and al-Umda fi adab al-qada'. Death 550 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13358}"
  es: "Mujalli ibn Jumay ibn Naja, Abu al-Ma'ali al-Qurashi al-Makhzumi, originario de Arsuf y residente en Egipto. Fue juez principal de Egipto desde el año 547 de la Hégira, y las fatuas en Egipto se remitían a él. Al-Subki lo consideró uno de los imanes de la escuela. Sus obras son al-Dhakha'ir, un extenso tratado sobre el fiqh shafi'í, y al-Umda fi adab al-qada'. Falleció en el año 550 de la Hégira (según la versión impresa). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13358}"
  fr: "Mujalli ibn Jumay ibn Naja, Abu al-Ma'ali al-Qurashi al-Makhzumi, d'origine arsuf et résidant en Égypte, fut juge suprême d'Égypte à partir de 547 H et les fatwas égyptiennes lui étaient soumises. Al-Subki le considérait comme l'un des imams de l'école. Ses œuvres principales sont al-Dhakha'ir, un vaste traité de fiqh shafi'ite, et al-Umda fi adab al-qada'. Il mourut en 550 H (date indiquée). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13358}"
  ur: "مجلّی ابن جمعہ ابن نجا، ابو المعالی القرشی المخزومی، عرسوف نژاد اور مصری رہنے والے۔ وہ 547 ہجری سے مصر کے چیف جج تھے، اور مصر میں فتوے ان کے حوالے کیے جاتے تھے۔ السبکی نے اسے مکتب کے اماموں میں سے ایک کہا۔ ان کی تصانیف الذخائر، شافعی فقہ پر ایک وسیع مقالہ اور العمدہ فی ادب القضا ہیں۔ وفات 550ھ جیسا کہ مطبوعہ ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص13358}"
  tr: "Mısır kökenli baş yargıç Majli ibn Cami ibn Naja, Mısır kökenli Ebu el-Ma'ali el-Kuraşi el-Makhzumi el-Arsufi, 547 Hicri yılında Mısır yargıcı olarak göreve gelmiştir ve Mısır'daki fetvalar da ona aittir. El-Subki, kendisinin Sahabelerin önde gelen alimlerinden biri olduğunu ve eserleri arasında El-Dakha'ir el-Mabsut fi fi al-Şafiiyye ve el-'Umdah fi Adab el-Kada' olduğunu söylemiştir. (?-550 Hj). {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.13358}"
  id: "Majli ibn Jami' ibn Naja, Abu al-Ma'ali al-Qurashi al-Makhzumi al-Arsufi yang berasal dari Mesir, hakim ketua, mengambil jabatan hakim Mesir pada tahun 547 H, yang menjadi dasar fatwa di Mesir. Al-Subki mengatakan bahwa ia termasuk di antara ulama terkemuka para Sahabat, dan di antara karyanya adalah Al-Dhakha'ir al-Mabsut fi fi al-Shafi'iyyah, dan al-'Umdah fi Adab al-Qada'. (?-550 H). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13358}"
