summary:
  ar: "مجلي بن جميع بن نجا، أبو المعالي القرشي المخزومي الأرسوفي الأصل المصري، قاضي القضاة، تولى قضاء الديار المصرية سنة ٥٤٧ه، وإليه ترجع الفتيا بمصر، قال السبكي إنه من أئمة الأصحاب، ومن تصانيفه الذخائر المبسوط في فقه الشافعية، والعمدة في أدب القضاء. (؟-٥٥٠ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13358}"
  en: "Mujalli ibn Jumay ibn Naja, Abu al-Ma'ali al-Qurashi al-Makhzumi, of Arsuf origin and Egyptian residence. He was chief judge of Egypt from 547 H, and fatwas in Egypt were referred to him. Al-Subki called him one of the imams of the school. His works are al-Dhakha'ir, a broad treatise on Shafi'i fiqh, and al-Umda fi adab al-qada'. Death 550 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13358}"
