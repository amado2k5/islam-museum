summary:
  ar: "العلامة الفارسي الشافعي؛ كان فقيهاً صوفياً إماماً في الأصلين، ورد دمشق ودرّس بالغزالية وشرح منطق «مختصر ابن الحاجب»، ثم سافر إلى مصر فولي مشيخة الشيوخ بها فتكلم فيه الصوفية فخرج منها وعاد إلى دمشق؛ ورماه الإمام أبو حيان بالإلحاد وعدّه فيمن اشتهر بذلك — على ما نقله ابن العماد مع قوله والله أعلم {cite:shadharat-dhahab p. 767-768}."
  en: "The learned Persian Shafi'i, a Sufi jurist and imam in both foundational disciplines; he came to Damascus and taught at the Ghazaliyya, expounding the logic of Ibn al-Hajib's *Mukhtasar*; then he went to Egypt and held the headship of the shaykhs there, but the Sufis spoke against him, so he left and returned to Damascus. The imam Abu Hayyan branded him a heretic and counted him among those known for it, as Ibn al-Imad reports, adding 'and God knows best' {cite:shadharat-dhahab p. 767-768}."
  fr: "Savant persan chaféite, juriste soufi et imam des deux disciplines fondamentales ; il vint à Damas et enseigna à la Ghazaliyya, expliquant la logique du Mukhtasar d’Ibn al-Hajib ; il alla ensuite en Égypte et y dirigea les cheikhs, mais les soufis parlèrent contre lui, si bien qu’il quitta le pays et revint à Damas. L’imam Abu Hayyan le qualifia d’hérétique et le compta parmi ceux qui étaient connus pour cela, selon Ibn al-Imad, qui ajoute : « Et Dieu sait mieux » {cite:shadharat-dhahab p. 767-768}."
  es: "El erudito persa shafi'í, jurista sufí e imán en ambas disciplinas fundamentales, llegó a Damasco y enseñó en la Ghazaliyya, exponiendo la lógica del *Mukhtasar* de Ibn al-Hajib. Posteriormente, se trasladó a Egipto y dirigió a los shaykhs de allí, pero los sufíes se opusieron a él, por lo que se marchó y regresó a Damasco. El imán Abu Hayyan lo tildó de hereje y lo incluyó entre los conocidos por ello, como relata Ibn al-Imad, añadiendo: «Y Dios sabe mejor» {cita: shadharat-dhahab, págs. 767-768}."
  ur: "فارسی کے ماہر شافعی، ایک صوفی فقیہ اور دونوں بنیادی شعبوں میں امام؛ وہ دمشق آیا اور غزالیہ میں پڑھایا، ابن الحجیب کے *مختصر* کی منطق کو بیان کیا۔ پھر وہ مصر گئے اور وہاں کے شیوخ کی سربراہی پر فائز ہوئے، لیکن صوفیوں نے اس کے خلاف بات کی، چنانچہ وہ وہاں سے چلا گیا اور دمشق واپس چلا گیا۔ امام ابو حیان نے اسے بدعتی قرار دیا اور اسے ان لوگوں میں شمار کیا جو اس کے لیے مشہور ہیں، جیسا کہ ابن عماد بیان کرتے ہیں، انہوں نے مزید کہا کہ ''اور خدا بہتر جانتا ہے''۔ 767-768}۔"
  tr: "İranlı âlim Şafiî, bir hukukçu, bir sufi ve iki temel konuda da bir imamdı. Şam'a gelip Gazaliyye'de ders verdi ve \"Muhtasar İbn Hacib\"in mantığını açıkladı. Daha sonra Mısır'a gitti ve orada şeyhlerin şeyhi olarak atandı; bu yüzden sufiler ona karşı çıktılar ve Mısır'ı terk edip Şam'a döndü. İmam Ebu Hayyan onu sapkınlıkla suçladı ve onu bu konuda bilinenler arasında saydı -İbn İmad'ın rivayet ettiği gibi, \"Allah en iyisini bilir.\" sözüyle. {kaynak: Şadharat-dahab s. 767-768}"
  id: "Ulama Persia Al-Shafi’i adalah seorang ahli hukum, seorang Sufi, dan seorang imam dalam dua bidang utama. Ia datang ke Damaskus dan mengajar di Al-Ghazaliyya serta menjelaskan logika “Mukhtasar Ibn Al-Hajib.” Kemudian ia pergi ke Mesir dan diangkat sebagai syekh para syekh di sana, sehingga para Sufi menentangnya, dan ia meninggalkan Mesir dan kembali ke Damaskus. Imam Abu Hayyan menuduhnya sesat dan menganggapnya termasuk di antara orang-orang yang dikenal karena hal itu — sebagaimana diriwayatkan oleh Ibn Al-Imad, dengan pernyataannya, “Dan Allah Maha Mengetahui.” {cite:shadharat-dhahab hlm. 767-768}"
