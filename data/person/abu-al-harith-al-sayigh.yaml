  ur: "ابو الحارث صیغ"
summary:
  ar: "أحمد بن محمد، أبو الحارث الصايغ، من أصحاب الإمام أحمد بن حنبل، وأكثر رواية المسائل عنه. قال أبو بكر الخلال إن أحمد كان يأنس به ويكرمه ويقدمه، وروى عنه مسائل كثيرة جداً في نحو عشرة أجزاء، وجوّد الرواية عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  en: "Ahmad ibn Muhammad, Abu al-Harith al-Sayigh, one of the companions of Ahmad ibn Hanbal, from whom he transmitted most of the recorded questions. Abu Bakr al-Khallal says that Ahmad liked him, honoured him and placed him high, and that he related many questions in about a dozen parts and transmitted them well. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  fr: "Ahmad ibn Muhammad, Abu al-Harith al-Sayigh, l'un des compagnons d'Ahmad ibn Hanbal, de qui il transmit la plupart des questions consignées. Abu Bakr al-Khallal dit qu'Ahmad l'aimait, l'honorait et le plaçait haut, et qu'il rapporta de nombreuses questions en une douzaine de parties et les transmit bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  es: "Ahmad ibn Muhammad, Abu al-Harith al-Sayigh, uno de los compañeros de Ahmad ibn Hanbal, de quien transmitió la mayoría de las preguntas registradas. Abu Bakr al-Khallal afirma que Ahmad lo apreciaba, lo honraba y lo consideraba de gran importancia, y que relató muchas preguntas en aproximadamente una docena de partes, transmitiéndolas con precisión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  ur: "احمد بن محمد، ابو الحارث الصیغ، احمد بن حنبل کے اصحاب میں سے ایک، جن سے اس نے زیادہ تر درج سوالات کو منتقل کیا۔ ابو بکر الخلال کہتے ہیں کہ احمد نے انہیں پسند کیا، ان کی عزت کی اور انہیں بلند مقام پر پہنچایا، اور یہ کہ انہوں نے بہت سے سوالات کو تقریباً ایک درجن حصوں میں بیان کیا اور انہیں اچھی طرح منتقل کیا۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 15400}"
  tr: "Ahmed ibn Muhammed, Ebu el-Harith el-Sayiğ, İmam Ahmed ibn Hanbel'in sahabelerindendi ve ondan birçok fıkıh hükmünü nakletmiştir. Ebu Bekr el-Hallal, Ahmed'in ona düşkün olduğunu, ona saygı duyduğunu ve ona öncelik verdiğini söylemiştir. Ondan yaklaşık on ciltlik çok sayıda fıkıh hükmü nakletmiş ve bunları nakletmede titiz davranmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  id: "Ahmad ibn Muhammad, Abu al-Harith al-Sayigh, adalah sahabat Imam Ahmad ibn Hanbal, dan beliau meriwayatkan sebagian besar hukum fiqh darinya. Abu Bakr al-Khallal berkata bahwa Ahmad menyayanginya, menghormatinya, dan mendahulukannya. Beliau meriwayatkan banyak sekali hukum fiqh darinya, dalam sekitar sepuluh jilid, dan beliau sangat teliti dalam meriwayatkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
