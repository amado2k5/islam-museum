summary:
  ar: "أحمد بن محمد، أبو الحارث الصايغ، من أصحاب الإمام أحمد بن حنبل، وأكثر رواية المسائل عنه. قال أبو بكر الخلال إن أحمد كان يأنس به ويكرمه ويقدمه، وروى عنه مسائل كثيرة جداً في نحو عشرة أجزاء، وجوّد الرواية عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  en: "Ahmad ibn Muhammad, Abu al-Harith al-Sayigh, one of the companions of Ahmad ibn Hanbal, from whom he transmitted most of the recorded questions. Abu Bakr al-Khallal says that Ahmad liked him, honoured him and placed him high, and that he related many questions in about a dozen parts and transmitted them well. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
