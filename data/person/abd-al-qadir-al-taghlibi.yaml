summary:
  ar: "عبد القادر بن عمر بن عبد القادر بن عمر بن أبي تغلب، أبو التقى التغلبي الشيباني الحنبلي الدمشقي، فقيه فرضي، أخذ عن عبد الباقي الحنبلي وولده أبي المواهب وقرأ على محمد البلبائي والنجم الفرضي ومنصور الفرضي، وكان يرتزق من تجليد الكتب ويلازم الدرس بالجامع الأموي، وكان ديناً صالحاً. من تصانيفه نيل المآرب بشرح دليل الطالب. (تاريخ الوفاة غير مذكور في النص). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13360}"
  en: "Abd al-Qadir ibn Umar ibn Abd al-Qadir al-Taghlibi al-Shaybani al-Hanbali al-Dimashqi, Abu al-Tuqa, a Hanbali jurist and expert in inheritance. He studied with Abd al-Baqi al-Hanbali and his son Abu al-Mawahib and read with several scholars of his time. He earned his living binding books and taught at the Umayyad mosque. His work Nayl al-Ma'arib is a commentary on Dalil al-Talib. The book gives no death date here. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13360}"
