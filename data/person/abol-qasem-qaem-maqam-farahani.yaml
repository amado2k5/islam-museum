summary:
  ar: "ميرزا أبو القاسم قائم مقام الفراهاني (1779 – 1835) رجل دولة وأديب إيراني من أوائل العصر القاجاري. كان ابن الوزير ميرزا بزرك ⁦(ميرزا عيسى)⁩ قائم مقام، فخلف أباه وزيرًا لولي العهد عباس ميرزا، وشارك في مفاوضات معاهدتي أرضروم (1823) وتركمانجاي (1828)، ثم صار أول صدر أعظم لمحمد شاه سنة 1834، ولم يمضِ عام حتى أمر الشاه بقتله خنقًا في قصر نگارستان بطهران. وتُعدّ «منشآته» من أعلام النثر الفارسي، وعلى يديه دخل أمير كبير خدمة الدولة."
  en: "Mirza Abol-Qasem Qa'em-Maqam Farahani (1779 – 1835) was an Iranian statesman and prose writer of the early Qajar period. The son of the minister Mirza Bozorg (Mirza Isa) Qa'em-Maqam, he succeeded his father as minister to the crown prince Abbas Mirza, took part in negotiating the treaties of Erzurum (1823) and Turkmenchay (1828), and became the first grand vizier of Mohammad Shah in 1834; within a year the shah had him strangled in Tehran's Negarestan palace. His Monsha'at is a landmark of Persian prose, and Amir Kabir entered government service under his patronage."
  ur: "مرزا ابوالقاسم قائم مقام فراہانی ⁦(1779ء – 1835ء)⁩ ابتدائی قاجار دور کے ایرانی اہلِ ریاست اور نثر نگار تھے۔ وزیر مرزا بزرگ ⁦(مرزا عیسیٰ)⁩ قائم مقام کے بیٹے تھے؛ والد کے بعد ولی عہد عباس مرزا کے وزیر بنے، ارضروم ⁦(1823ء)⁩ اور ترکمان چائے ⁦(1828ء)⁩ کے معاہدوں کی گفت و شنید میں شریک رہے، پھر 1834ء میں محمد شاہ کے پہلے وزیرِ اعظم بنے، مگر ایک سال کے اندر شاہ کے حکم پر تہران کے نگارستان محل میں گلا گھونٹ کر قتل کر دیے گئے۔ ان کی «منشآت» فارسی نثر کا سنگِ میل ہے اور امیر کبیر انہی کی سرپرستی میں سرکاری خدمت میں داخل ہوئے۔"
  fr: "Mirza Abol-Qasem Qa'em-Maqam Farahani (1779 – 1835) fut un homme d'État et prosateur iranien du début de l'époque qadjare. Fils du ministre Mirza Bozorg (Mirza Isa) Qa'em-Maqam, il succéda à son père comme ministre du prince héritier Abbas Mirza, prit part aux négociations des traités d'Erzurum (1823) et de Turkmantchaï (1828), et devint en 1834 le premier grand vizir de Mohammad Shah ; moins d'un an plus tard, le shah le fit étrangler au palais Negarestan de Téhéran. Ses Monsha'at sont un monument de la prose persane, et Amir Kabir entra au service de l'État sous son patronage."
  es: "Mirza Abol-Qasem Qa'em-Maqam Farahani (1779-1835) fue un estadista y prosista iraní de principios del período Qajar. Hijo del ministro Mirza Bozorg (Mirza Isa) Qa'em-Maqam, sucedió a su padre como ministro del príncipe heredero Abbas Mirza, participó en la negociación de los tratados de Erzurum (1823) y Turkmenchay (1828), y se convirtió en el primer gran visir de Mohammad Shah en 1834; al cabo de un año, el sha lo mandó estrangular en el palacio de Negarestan en Teherán. Su Monsha'at es una obra cumbre de la prosa persa, y Amir Kabir ingresó al servicio gubernamental bajo su patrocinio."
  tr: "Mirza Ebu el-Kasım Kaym Makam el-Farahani (1779–1835), erken Kaçar döneminden İranlı bir devlet adamı ve yazardı. Vezir Mirza Bozorg'un (Mirza İsa) oğlu olan Mirza, babasının yerine Veliaht Prens Abbas Mirza'nın veziri oldu ve Erzurum (1823) ve Türkmençay (1828) Antlaşmaları'nın müzakerelerine katıldı. Daha sonra 1834'te Muhammed Şah'ın ilk sadrazamı oldu, ancak bir yıldan kısa bir süre sonra Şah, Tahran'daki Negarestan Sarayı'nda boğularak idam edilmesini emretti. Eserleri Farsça düzyazının başyapıtları olarak kabul edilir ve Emir Kabir'in devlet hizmetine girmesi onun aracılığıyla olmuştur."
  id: "Mirza Abu al-Qasim Qaim Maqam al-Farahani (1779–1835) adalah seorang negarawan dan penulis Iran dari era Qajar awal. Putra dari wazir Mirza Bozorg (Mirza Isa), ia menggantikan ayahnya sebagai wazir untuk Putra Mahkota Abbas Mirza dan berpartisipasi dalam negosiasi Perjanjian Erzurum (1823) dan Turkmenchay (1828). Ia kemudian menjadi Wazir Agung pertama untuk Mohammad Shah pada tahun 1834, tetapi kurang dari setahun kemudian, Shah memerintahkan eksekusinya dengan cara dicekik di Istana Negarestan di Teheran. Karya-karyanya dianggap sebagai mahakarya prosa Persia, dan melalui dialah Amir Kabir memasuki dinas sipil."

