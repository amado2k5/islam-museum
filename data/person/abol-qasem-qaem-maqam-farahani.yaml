    note: >-
      No source read names a religion or a legal school for the man
      himself, and Wikidata carries no religion value for him at all.
      The tradition he served is stated in full — he was minister to
      the crown prince Abbas Mirza and then grand vizier of the
      Twelver Shia Qajar monarchy, and at Tabriz he compiled the
      Jehadiyeh, a collection of the fatwas that two distinguished
      Shia jurists of Iraq had issued on the necessity of jihad
      against the Russian invasion, writing its introduction himself
      and arguing there that defence of the Guarded Domains of Iran
      was a collective religious duty. Service to a Shia court and
      the compilation of its jihad fatwas are dynastic and official
      context, not a naming of the man's own school, so his faith is
      recorded as unknown.
