summary:
  ar: "ميرزا أبو القاسم قائم مقام الفراهاني (1779 – 1835) رجل دولة وأديب إيراني من أوائل العصر القاجاري. كان ابن الوزير ميرزا بزرك (ميرزا عيسى) قائم مقام، فخلف أباه وزيرًا لولي العهد عباس ميرزا، وشارك في مفاوضات معاهدتي أرضروم (1823) وتركمانجاي (1828)، ثم صار أول صدر أعظم لمحمد شاه سنة 1834، ولم يمضِ عام حتى أمر الشاه بقتله خنقًا في قصر نگارستان بطهران. وتُعدّ «منشآته» من أعلام النثر الفارسي، وعلى يديه دخل أمير كبير خدمة الدولة."
  en: "Mirza Abol-Qasem Qa'em-Maqam Farahani (1779 – 1835) was an Iranian statesman and prose writer of the early Qajar period. The son of the minister Mirza Bozorg (Mirza Isa) Qa'em-Maqam, he succeeded his father as minister to the crown prince Abbas Mirza, took part in negotiating the treaties of Erzurum (1823) and Turkmenchay (1828), and became the first grand vizier of Mohammad Shah in 1834; within a year the shah had him strangled in Tehran's Negarestan palace. His Monsha'at is a landmark of Persian prose, and Amir Kabir entered government service under his patronage."
  ur: "مرزا ابوالقاسم قائم مقام فراہانی (1779ء – 1835ء) ابتدائی قاجار دور کے ایرانی اہلِ ریاست اور نثر نگار تھے۔ وزیر مرزا بزرگ (مرزا عیسیٰ) قائم مقام کے بیٹے تھے؛ والد کے بعد ولی عہد عباس مرزا کے وزیر بنے، ارضروم (1823ء) اور ترکمان چائے (1828ء) کے معاہدوں کی گفت و شنید میں شریک رہے، پھر 1834ء میں محمد شاہ کے پہلے وزیرِ اعظم بنے، مگر ایک سال کے اندر شاہ کے حکم پر تہران کے نگارستان محل میں گلا گھونٹ کر قتل کر دیے گئے۔ ان کی «منشآت» فارسی نثر کا سنگِ میل ہے اور امیر کبیر انہی کی سرپرستی میں سرکاری خدمت میں داخل ہوئے۔"

