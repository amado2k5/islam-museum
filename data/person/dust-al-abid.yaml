summary:
  ar: "أبو محمد القاسم بن نصر بن سالم المعروف بدوست العابد؛ كان من خيار المسلمين وأعيان المتعبدين، حدث عن سريج بن النعمان الجوهري وعمرو بن عون الواسطي وعبيد بن هاشم، وروى عنه عبد الصمد بن علي الطستي وأبو سهل بن زياد القطان وجعفر الخلدي؛ كان ينزل في سيب القاضي من الجانب الشرقي، توفي يوم الأربعاء لست بقين من رمضان سنة إحدى وثمانين ومائتين ودفن بمقبرة الخيزران {cite:tarikh-baghdad-khatib j.10 p.435-436}."
  en: "Abu Muhammad 'Dust' al-Abid — one of Baghdad's noted ascetics and transmitters; he died on Wednesday with six nights left of Ramadan 281 and was buried in the Khayzuran cemetery {cite:tarikh-baghdad-khatib j.10 p.435-436}."
