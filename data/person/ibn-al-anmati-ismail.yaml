summary:
  ar: "الحافظ تقي الدين أبو الطاهر إسماعيل بن عبد الله بن عبد المحسن المصري الشافعي المعروف بابن الأنماطي؛ قال عمر بن الحاجب كان إماماً ثقة حافظاً مبرزاً واسع الرواية وعنده فقه وأدب ومعرفة بالشعر وأخبار الناس، وقال ابن البخاري ولد سنة سبعين وخمسمائة واشتغل من صباه وتفقه وأقرأ الأدب وسمع الكثير وقدم دمشق سنة ثلاث وتسعين ثم حج سنة إحدى وستمائة وقدم مع الركب وكانت له همة وافرة وجد واجتهاد ومعرفة كاملة وحفظ وفصاحة وفقه وسرعة فهم واقتدار على النظم والنثر وكان معدوم النظير في وقته؛ قال الضياء بات صحيحاً فأصبح لا يقدر على الكلام أياماً واتصل به ذلك حتى مات في رجب سنة تسع عشرة وستمائة {cite:shadharat-dhahab p. 84-85}."
