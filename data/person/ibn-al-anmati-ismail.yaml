id: person/ibn-al-anmati-ismail
class: person
label: { ar: "ابن الأنماطي" }
summary:
  ar: "الحافظ تقي الدين أبو الطاهر إسماعيل بن عبد الله بن عبد المحسن المصري الشافعي المعروف بابن الأنماطي؛ قال عمر بن الحاجب كان إماماً ثقة حافظاً مبرزاً واسع الرواية وعنده فقه وأدب ومعرفة بالشعر وأخبار الناس، وقال ابن البخاري ولد سنة سبعين وخمسمائة واشتغل من صباه وتفقه وأقرأ الأدب وسمع الكثير وقدم دمشق سنة ثلاث وتسعين ثم حج سنة إحدى وستمائة وقدم مع الركب وكانت له همة وافرة وجد واجتهاد ومعرفة كاملة وحفظ وفصاحة وفقه وسرعة فهم واقتدار على النظم والنثر وكان معدوم النظير في وقته؛ قال الضياء بات صحيحاً فأصبح لا يقدر على الكلام أياماً واتصل به ذلك حتى مات في رجب سنة تسع عشرة وستمائة {cite:shadharat-dhahab p. 84-85}."
  tr: "Ezberci Taqi al-Din Ebu el-Tahir İsmail ibn Abdullah ibn Abd al-Muhsin al-Masri al-Shafi'i, yani İbn al-Anmatī, şöyle demiştir: Umar ibn al-Hacib, geniş bir yelpazede rivayet eden, fıkıh, edebiyat ve şiir ile halk haberleri bilgisine sahip güvenilir, önde gelen bir ezberciydi. İbn al-Buhari, 570 H yılında doğduğunu ve gençliğinden itibaren Hukuk alanında çalıştı, edebiyat okudu ve çok şey duydu. 1993'te Şam'a geldi, ardından 6101 Hicri'nde Hac yaptı ve kervanlarla birlikte geldi. Büyük hırs, gayreti, tam bilgi, ezberleme, hitabet yeteneği, hızlı anlayış ve hem şiir hem de düzyazıda yeteneğe sahipti. Kendi zamanında eşsizdi. Al-Diya', onun samimi olduğunu ve günlerce konuşamadığını söyledi; bu durum 1965 yılında Rajab'da vefat edene kadar onunla kaldı {atıf: Shadharat-Dhahab, s. 84-85}."
  id: "Pengapal Taqi al-Din Abu al-Tahir Ismail ibn Abdullah ibn Abd al-Muhsin al-Masri al-Shafi'i, yang dikenal sebagai Ibn al-Anmatī, berkata: Umar ibn al-Hajib adalah seorang penghafal yang terpercaya dan terkemuka dengan beragam narasi, memiliki yurisprudensi, sastra, serta pengetahuan tentang puisi dan berita rakyat. Ibn al-Bukhari mengatakan bahwa ia lahir pada tahun 570 H, dan sejak muda ia bekerja di bidang hukum, belajar sastra, dan banyak mendengar. Ia tiba di Damaskus pada tahun 1993, lalu melaksanakan Haji pada tahun 6101 H dan datang bersama para karavan. Ia memiliki ambisi besar, ketekunan, pengetahuan lengkap, hafalan, kefasihan, pemahaman cepat, dan kemampuan dalam puisi maupun prosa. Ia tiada tandingan pada zamannya. Al-Diya mengatakan ia menjadi otentik dan tidak bisa berbicara selama beberapa hari, dan hal ini tetap bersamanya hingga ia meninggal di Rajab pada tahun 1965 {cite:Shadhat-Dhahab, hlm. 84-85}."
