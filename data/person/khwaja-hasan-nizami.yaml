summary:
  ar: "متصوف وأديب أردي هندي (1878–1955)، وُلد في دلهي عند ضريح نظام الدين أولياء وتوفي فيها. من أعلام السلسلة الجشتية النظامية، أدار حلقة للبيعة والإرشاد وكتب مئات المؤلفات في المقالة والفكاهة والتاريخ، ومن أشهرها «بيغمات کے آنسو» في مآسي ثورة 1857، وبعد تقسيم الهند أحيا بنفسه مجالس محرم في دلهي."
  en: "Indian Sufi and Urdu writer (1878–1955), born in Delhi at the shrine of Nizamuddin Auliya and died there. A figure of the Chishti-Nizami silsila, he kept a circle of initiation and discipleship and wrote hundreds of works of essay, humour and history, among them Begumat Kay Ansoo on the sufferings of 1857; after Partition he personally revived Delhi's Muharram gatherings."
  ur: "ہندوستانی صوفی اور اردو ادیب (1878ء–1955ء)، دہلی میں نظام الدین اولیاء کی درگاہ پر پیدا ہوئے اور وہیں وفات پائی۔ سلسلہ چشتیہ نظامیہ کے بزرگ تھے، پیری مریدی کا سلسلہ جاری رکھا اور انشا، مزاح اور تاریخ پر سیکڑوں تصانیف چھوڑیں، جن میں «بیگمات کے آنسو» مشہور ہے؛ تقسیم کے بعد دہلی کی مجالسِ محرم انھوں نے خود آباد کیں۔"
