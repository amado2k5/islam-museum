summary:
  ar: "عالم مسلم أمريكي وُلد سنة 1958 باسم مارك هانسون في ولاية واشنطن، واعتنق الإسلام سنة 1977، ودرس العلوم الشرعية عقدًا في الإمارات وشمال أفريقيا وموريتانيا، وأسس معهد زيتونة سنة 1996 الذي صار كلية الزيتونة في بيركلي، أول كلية مسلمة معتمدة في الولايات المتحدة، وله ترجمات وكتب ومحاضرات واسعة الانتشار في العالم الناطق بالإنجليزية."
  en: "American Muslim scholar born in 1958 as Mark Hanson in Washington State. He converted to Islam in 1977, studied the Islamic sciences for a decade in the Emirates, North Africa and Mauritania, and in 1996 co-founded the Zaytuna Institute, which became Zaytuna College in Berkeley — the first accredited Muslim liberal arts college in the United States. His translations, books and lectures reach a wide English-speaking audience."
  ur: "امریکی مسلمان عالم، جو 1958 میں ریاست واشنگٹن میں مارک ہینسن کے نام سے پیدا ہوا۔ اس نے 1977 میں اسلام قبول کیا، ایک دہائی تک امارات، شمالی افریقا اور موریطانیہ میں اسلامی علوم پڑھے، اور 1996 میں زیتونہ انسٹیٹیوٹ کی مشترکہ بنیاد رکھی، جو برکلے میں زیتونہ کالج بنا — امریکا کا پہلا باقاعدہ منظور شدہ مسلم لبرل آرٹس کالج۔ اس کی ترجمہ شدہ و تصنیف کردہ کتابیں اور لیکچرز انگریزی دنیا میں وسیع پیمانے پر پڑھے اور سنے جاتے ہیں۔"
