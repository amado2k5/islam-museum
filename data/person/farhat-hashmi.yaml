summary:
  ar: "عالمة وداعية باكستانية كندية، وُلدت في سرغودا سنة 1957، وحصلت على الدكتوراه في الدراسات الإسلامية من جامعة غلاسكو، ودرّست في الجامعة الإسلامية العالمية في إسلام آباد، ثم أسّست سنة 1994 مؤسسة الهدى الدولية التي تدير شبكة مدارس ومعاهد لتعليم النساء القرآن والحديث في باكستان وكندا والخارج. هاجرت إلى كندا سنة 2005 وقدّمت برامج دينية على قناة جيو."
  en: "A Pakistani-Canadian Islamic scholar and preacher, born in Sargodha in 1957. She took her PhD in Islamic studies at the University of Glasgow, taught at the International Islamic University in Islamabad, and in 1994 founded the Al-Huda International Welfare Foundation, which runs a network of schools and institutes teaching women the Qur'an and Hadith in Pakistan, Canada and abroad. She emigrated to Canada in 2005 and has presented religious programmes on Geo TV."
  ur: "پاکستانی کینیڈیائی عالمہ اور داعیہ، 1957 میں سرگودھا میں پیدا ہوئیں۔ انہوں نے گلاسگو یونیورسٹی سے اسلامی علوم میں پی ایچ ڈی کی، بین الاقوامی اسلامی یونیورسٹی اسلام آباد میں تدریس کی، اور 1994 میں الہدٰی انٹرنیشنل ویلفیئر فاؤنڈیشن کی بنیاد رکھی جو پاکستان، کینیڈا اور دیگر ممالک میں خواتین کو قرآن و حدیث کی تعلیم دینے والے مدارس اور اداروں کا جال چلاتی ہے۔ وہ 2005 میں کینیڈا منتقل ہوئیں اور جیو ٹی وی پر دینی پروگرام پیش کر چکی ہیں۔"
