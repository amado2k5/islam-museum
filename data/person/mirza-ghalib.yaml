summary:
  ar: "شاعر الأردية والفارسية الأبرز في أواخر عصر المغول (1797–1869). وُلد في أغرة وانتقل صغيرًا إلى دلهي، وعاش معظم عمره في فقر منازعًا على معاش أسرته. ألّف ديوانين بالأردية والفارسية، وكان شاعر بلاط بهادر شاه ظفر وأستاذه في الشعر، وتُعدّ غزلياته ذروة الشعر الأردي."
  en: "The pre-eminent Urdu and Persian poet of the late Mughal age (1797–1869). Born in Agra, he settled in Delhi as a boy and lived most of his life in straitened circumstances, contesting his family pension. He wrote divans in both Urdu and Persian, served Bahadur Shah Zafar as court poet and poetry tutor, and his ghazals are regarded as the summit of Urdu poetry."
  ur: "متاخر مغل دور کے سب سے بڑے اردو و فارسی شاعر (1797ء–1869ء)۔ آگرہ میں پیدا ہوئے، بچپن میں دہلی آ بسے، اور بیشتر زندگی تنگ دستی میں خاندانی وظیفے کے مقدمے میں گزاری۔ اردو و فارسی دونوں میں دیوان چھوڑے، بہادر شاہ ظفر کے درباری شاعر اور استاد رہے، اور ان کی غزلیں اردو شاعری کی معراج سمجھی جاتی ہیں۔"
