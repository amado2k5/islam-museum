    note: "Recorded as Shia, mapped to Twelver, on the English article's text, which states that he 'followed Shia theology and had said many verses in praise of Ali ibn Abi Talib', citing Zahra Sabri's study 'Three Shi'a Poets: Sect-Related Themes in Pre-Modern Urdu Poetry' (Indian Ocean World Centre Working Paper Series, 2016) among its references; Wikidata's religion value is likewise Shia Islam. The mapping is stated here as the rule requires: what is attested is Shia theology centred on devotion to Ali, and elegies on Karbala (marsiya) form part of his recorded output — the Twelver tradition. Counter-readings are preserved, not suppressed: the Urdu article's categories file him under 'Indian Sunni Muslims', which is a filing and never an attestation, and the same English article stresses that he placed the seeking of God above ritual practice and was sceptical of some clerical readings of scripture; the Arabic article makes no statement of his affiliation. His poetry's Sufi imagery is not used as evidence either way: imagery is not affiliation."
    sources: [source/wikipedia-ghalib-en, source/wikipedia-ghalib-ur, source/wikidata-ghalib]
