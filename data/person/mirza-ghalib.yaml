summary:
  ar: "شاعر الأردية والفارسية الأبرز في أواخر عصر المغول (1797–1869). وُلد في أغرة وانتقل صغيرًا إلى دلهي، وعاش معظم عمره في فقر منازعًا على معاش أسرته. ألّف ديوانين بالأردية والفارسية، وكان شاعر بلاط بهادر شاه ظفر وأستاذه في الشعر، وتُعدّ غزلياته ذروة الشعر الأردي."
  en: "The pre-eminent Urdu and Persian poet of the late Mughal age (1797–1869). Born in Agra, he settled in Delhi as a boy and lived most of his life in straitened circumstances, contesting his family pension. He wrote divans in both Urdu and Persian, served Bahadur Shah Zafar as court poet and poetry tutor, and his ghazals are regarded as the summit of Urdu poetry."
  ur: "متاخر مغل دور کے سب سے بڑے اردو و فارسی شاعر ⁦(1797ء–1869ء)⁩۔ آگرہ میں پیدا ہوئے، بچپن میں دہلی آ بسے، اور بیشتر زندگی تنگ دستی میں خاندانی وظیفے کے مقدمے میں گزاری۔ اردو و فارسی دونوں میں دیوان چھوڑے، بہادر شاہ ظفر کے درباری شاعر اور استاد رہے، اور ان کی غزلیں اردو شاعری کی معراج سمجھی جاتی ہیں۔"
  es: "El poeta más destacado en urdu y persa de finales de la época mogol (1797-1869). Nacido en Agra, se estableció en Delhi siendo niño y vivió la mayor parte de su vida en la pobreza, disputando la pensión familiar. Escribió divanes en urdu y persa, sirvió a Bahadur Shah Zafar como poeta de la corte y tutor de poesía, y sus gazales son considerados la cumbre de la poesía urdu."
  fr: "Poète ourdou et persan de premier plan de la fin de l'époque moghole (1797-1869), il naquit à Agra et s'installa à Delhi dès son enfance. Il y vécut la majeure partie de sa vie dans la pauvreté, contestant la pension familiale. Il composa des divans en ourdou et en persan, fut poète de cour et précepteur de poésie auprès de Bahadur Shah Zafar, et ses ghazals sont considérés comme le sommet de la poésie ourdou."
  tr: "Geç Babür döneminin (1797–1869) en önde gelen Urduca ve Fars şairidir. Agra'da doğdu ve çocukken Delhi'ye taşındı; hayatının çoğunu yoksulluk içinde geçirdi ve ailesinin geçimini sağlamak için mücadele etti. Urduca ve Farsça iki divan yazdı, Bahadur Şah Zafar'ın saray şairi ve şiir öğretmeniydi. Gazelleri Urdu şiirinin zirvesi olarak kabul edilir."
  id: "Penyair Urdu dan Persia paling terkemuka pada akhir era Mughal (1797–1869). Ia lahir di Agra dan pindah ke Delhi saat masih anak-anak, menghabiskan sebagian besar hidupnya dalam kemiskinan, berjuang untuk mencari nafkah keluarganya. Ia menulis dua diwan dalam bahasa Urdu dan Persia, serta menjadi penyair istana Bahadur Shah Zafar dan gurunya dalam puisi. Ghazal-ghazalnya dianggap sebagai puncak puisi Urdu."
