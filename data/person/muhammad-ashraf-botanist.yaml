summary:
  ar: "عالم نبات باكستاني في فسيولوجيا الإجهاد النباتي، من أكثر علماء النبات استشهادًا بأعمالهم في العالم لبحوثه في تحسين تحمّل المحاصيل للملوحة والجفاف وغيرهما من الإجهادات. نال الدكتوراه من جامعة ليفربول سنة 1986، وشغل منصب نائب رئيس جامعة الزراعة في فيصل آباد ثم رئيس جامعة لاهور. من أوسمته جائزة الإنجاز مدى الحياة من هيئة التعليم العالي (2013) وهلال الامتياز (2016)."
  en: "Pakistani botanist and plant stress physiologist, among the most-cited plant scientists in the world for his work on improving crops' tolerance of salinity, drought and other stresses. He took his PhD at the University of Liverpool in 1986, served as Vice Chancellor of the University of Agriculture, Faisalabad, and later as Rector of the University of Lahore. His honours include the Higher Education Commission's Lifetime Achievement Award (2013) and the Hilal-i-Imtiaz (2016)."
  ur: "پاکستانی ماہرِ نباتیات اور پودوں کے تناؤ کی فعلیات کے عالم، جو نمکیات، خشک سالی اور دیگر تناؤں کے مقابل فصلوں کی برداشت بہتر بنانے کی تحقیق پر دنیا کے سب سے زیادہ حوالہ دیے جانے والے سائنس دانوں میں شامل ہیں۔ انھوں نے 1986ء میں یونیورسٹی آف لیورپول سے پی ایچ ڈی کیا، یونیورسٹی آف ایگریکلچر فیصل آباد کے وائس چانسلر رہے اور بعد میں یونیورسٹی آف لاہور کے ریکٹر بنے۔ ان کے اعزازات میں ایچ ای سی کا لائف ٹائم اچیومنٹ ایوارڈ (2013ء) اور ہلالِ امتیاز (2016ء) شامل ہیں۔"
