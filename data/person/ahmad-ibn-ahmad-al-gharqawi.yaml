id: person/ahmad-ibn-ahmad-al-gharqawi
class: person
gender: male
label:
  ar: أحمد بن أحمد الغرقاوي الفيومي
  en: Ahmad ibn Ahmad al-Gharqawi al-Fayyumi (Maliki jurist)
summary:
  ar: فقيه مالكي مشارك في بعض العلوم، المعروف بالغرقاوي، من الفيوم؛ من تصانيفه رسالة في مسألة الخلو عن الأوقاف، وكشف النقاب والران عن وجوه مخدرات (أسئلة في بعض سور القرآن)، والقول التام في أطوار آدم، وحسن السلوك في معرفة آداب الملك والملوك. ويذكر المطبوع وفاته سنة 1101 أو 1069 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7842}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7843}
  en: A Maliki jurist learned in several sciences, of al-Fayyum, known as al-Gharqawi; works include a treatise on the question of khullu in endowments, Kashf al-Niqab on questions in some surahs, al-Qawl al-Tamm on the stages of Adam, and Husn al-Suluk on the manners of kings. The printed death year is 1101 or 1069 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7842}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7843}
  ur: مالکی فقیہ، فیوم کے، غرقاوی کے نام سے مشہور؛ وقف کے خلو پر رسالہ اور کشف النقاب سمیت تصانیف ہیں؛ وفات مطبوعہ میں 1101 یا 1069ھ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7842}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7843}
