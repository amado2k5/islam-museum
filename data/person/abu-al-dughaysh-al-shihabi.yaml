summary:
  ar: من الشهابيين، كان يجبي بلد وسحة، ثم منع الصدقات وجمع جمعاً فحاربه عامل الهادي وعبد الله بن الحسين سنة 285هـ ثم استأمن.
  en: Of the Shihabis, who levied the town of Wasaha, then withheld the alms and gathered a force, fought by al-Hadi's governor and Abdullah ibn al-Husayn in 285 AH and then sought security.
  ur: شہابیوں میں سے، جو وسحہ کی بستی سے محصول لیتا تھا، پھر اس نے صدقات روکے اور جمعیت جمع کی، 285ھ میں ہادی کے عامل اور عبد اللہ بن الحسین نے اس سے جنگ کی، پھر اس نے امان مانگی۔
