id: person/abu-al-dughaysh-al-shihabi
class: person
label:
  ar: أبو الدغيش الشهابي
  en: Abu al-Dughaysh al-Shihabi
  ur: ابو الدغیش شہابی
  fr: "Abu al-Dughaysh al-Shihabi"
  es: "Abu al-Dughaysh al-Shihabi"
summary:
  ar: من الشهابيين، كان يجبي بلد وسحة، ثم منع الصدقات وجمع جمعاً فحاربه عامل الهادي وعبد الله بن الحسين سنة 285هـ ثم استأمن.
  en: Of the Shihabis, who levied the town of Wasaha, then withheld the alms and gathered a force, fought by al-Hadi's governor and Abdullah ibn al-Husayn in 285 AH and then sought security.
  ur: شہابیوں میں سے، جو وسحہ کی بستی سے محصول لیتا تھا، پھر اس نے صدقات روکے اور جمعیت جمع کی، 285ھ میں ہادی کے عامل اور عبد اللہ بن الحسین نے اس سے جنگ کی، پھر اس نے امان مانگی۔
  fr: "Des Shihabites, qui prélevait l'impôt sur la ville de Wasaha, puis retint l'aumône et rassembla une troupe ; combattu par le gouverneur d'al-Hadi et Abdullah ibn al-Husayn en 285 H, il demanda ensuite la sauvegarde."
  es: "De los Shihabíes, que saquearon la ciudad de Wasaha, retuvieron las limosnas y reunieron una fuerza, combatieron contra el gobernador de al-Hadi y Abdullah ibn al-Husayn en el año 285 AH y luego buscaron seguridad."
