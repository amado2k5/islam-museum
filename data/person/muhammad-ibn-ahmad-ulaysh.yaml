summary:
  ar: "محمد بن أحمد بن محمد عليش، أبو عبد الله، من أهل طرابلس الغرب، ولد بالقاهرة وتوفي بها، شيخ المالكية بمصر ومفتيها، فقيه مشارك في عدة علوم، تعلم في الأزهر وولي مشيخة المالكية فيه، وأخذ عن الشيخ الأمير الصغير ومصطفى البولاقي وآخرين، وامتحن بالسجن حين احتلت الدولة الإنكليزية مصر ومات بأثر ذلك. من تصانيفه «منح الجليل على مختصر خليل» في أربعة أجزاء، و«هداية السالك» حاشية على الشرح الصغير للدردير. عاش بين 1217 و1299هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2063}"
  en: "Muhammad ibn Ahmad ibn Muhammad Ulaysh, Abu Abd Allah, from Tripoli in the West, born and died in Cairo. The head and mufti of the Malikis in Egypt, a jurist who took part in several sciences, he studied at al-Azhar, held the headship of the Malikis there, and studied with al-Amir al-Saghir and Mustafa al-Bulaqi among others. He was imprisoned when the British occupied Egypt and died soon after. His works include 'Minah al-jalil' on the abridgement of Khalil in four volumes, and 'Hidayat al-salik', glosses on al-Dardir's commentary. He lived from 1217 to 1299 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2063}"
sources: [source/fiqh-mawsua-kuwaitiyya-noor-v3]
