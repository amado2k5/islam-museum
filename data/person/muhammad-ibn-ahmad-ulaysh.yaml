summary:
  ar: "محمد بن أحمد بن محمد عليش، أبو عبد الله، من أهل طرابلس الغرب، ولد بالقاهرة وتوفي بها، شيخ المالكية بمصر ومفتيها، فقيه مشارك في عدة علوم، تعلم في الأزهر وولي مشيخة المالكية فيه، وأخذ عن الشيخ الأمير الصغير ومصطفى البولاقي وآخرين، وامتحن بالسجن حين احتلت الدولة الإنكليزية مصر ومات بأثر ذلك. من تصانيفه «منح الجليل على مختصر خليل» في أربعة أجزاء، و«هداية السالك» حاشية على الشرح الصغير للدردير. عاش بين 1217 و1299هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2063}"
  en: "Muhammad ibn Ahmad ibn Muhammad Ulaysh, Abu Abd Allah, from Tripoli in the West, born and died in Cairo. The head and mufti of the Malikis in Egypt, a jurist who took part in several sciences, he studied at al-Azhar, held the headship of the Malikis there, and studied with al-Amir al-Saghir and Mustafa al-Bulaqi among others. He was imprisoned when the British occupied Egypt and died soon after. His works include 'Minah al-jalil' on the abridgement of Khalil in four volumes, and 'Hidayat al-salik', glosses on al-Dardir's commentary. He lived from 1217 to 1299 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2063}"
  es: "Muhammad ibn Ahmad ibn Muhammad Ulaysh, Abu Abd Allah, originario de Trípoli, en Occidente, nació y murió en El Cairo. Fue el jefe y muftí de los malikíes en Egipto, un jurista que se dedicó a diversas ciencias. Estudió en Al-Azhar, donde dirigió la escuela malikí, y entre otros, estudió con Al-Amir Al-Saghir y Mustafa Al-Bulaqi. Fue encarcelado durante la ocupación británica de Egipto y falleció poco después. Entre sus obras destacan «Minah Al-Jalil», un compendio del Khalil en cuatro volúmenes, y «Hidayat Al-Salik», glosas sobre el comentario de Al-Dardir. Vivió entre 1217 y 1299 d. H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2063}"
  fr: "Muhammad ibn Ahmad ibn Muhammad Ulaysh, dit Abu Abd Allah, originaire de Tripoli, en Égypte, est né et mort au Caire. Chef et mufti de l'école malikite d'Égypte, juriste érudit, il étudia à al-Azhar, où il dirigea l'école malikite, et fut l'élève d'al-Amir al-Saghir et de Mustafa al-Bulaqi, entre autres. Il fut emprisonné lors de l'occupation britannique de l'Égypte et mourut peu après. Parmi ses œuvres figurent « Minah al-jalil », un abrégé de Khalil en quatre volumes, et « Hidayat al-salik », un commentaire d'al-Dardir. Il vécut de 1217 à 1299 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2063}"
  ur: "محمد بن احمد بن محمد الیش، ابو عبد اللہ، مغرب میں طرابلس سے، قاہرہ میں پیدا ہوئے اور وفات پائی۔ مصر میں مالکیوں کے سربراہ اور مفتی، ایک فقیہ جس نے متعدد علوم میں حصہ لیا، اس نے الازہر میں تعلیم حاصل کی، وہاں مالکیوں کی سربراہی کی، اور امیر الصغیر اور مصطفیٰ البلاقی کے علاوہ دیگر سے بھی تعلیم حاصل کی۔ جب انگریزوں نے مصر پر قبضہ کیا تو اسے قید کیا گیا اور اس کے فوراً بعد ہی ان کا انتقال ہوگیا۔ ان کی تصانیف میں خلیل کی اختصار پر چار جلدوں میں 'منہ الجلیل' اور 'ہدایت السالک'، الدردیر کی تفسیر پر روشنی ڈالی گئی ہے۔ وہ 1217 سے 1299 ہجری تک زندہ رہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2063}"
  tr: "Muhammed bin Ahmed ibn Muhammed 'Alish, batıdaki Trablus'tan Ebu Abdullah, Kahire'de doğup ölmüş, Mısır'daki Malikilerin şeyhi ve müftüsü, çeşitli bilimlerde çalışan bir hukukçu, El-Ezher'de eğitim görmüş, Maliki şeyhliğini elinde tutmuş, Şeyh Emir el-Saghir, Mustafa el-Bulaki ve diğerlerinin yanında eğitim görmüştür. İngilizler Mısır'ı işgal ettiğinde hapiste sınanmış ve bu nedenle ölmüştür. Eserleri arasında dört ciltlik 'Manah al-Jalil 'ala Mukhtasar Khalil' ve al-Dardir'in al-Sharh al-Saghir üzerine kenar tefsiri olan 'Hidayat al-Salik' bulunmaktadır. 1217 ile 1299 Hicri yılları arasında yaşamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2063}"
  id: "Muhammad ibn Ahmad ibn Muhammad 'Alish, Abu Abdullah, dari Tripoli di barat, lahir dan meninggal di Kairo, adalah sheikh dan mufti Malik di Mesir, seorang ahli hukum yang terlibat dalam berbagai ilmu pengetahuan, belajar di Al-Azhar, memegang jabatan sheikh Maliki di sana, belajar di bawah Sheikh Amir al-Saghir, Mustafa al-Bolaqi, dan lainnya. Ia diuji di penjara ketika Inggris menduduki Mesir dan meninggal akibatnya. Di antara karyanya adalah 'Manah al-Jalil 'ala Mukhtasar Khalil' dalam empat jilid, dan 'Hidayat al-Salik', sebuah komentar marginal tentang al-Sharh al-Saghir oleh al-Dardir. Ia hidup antara tahun 1217 dan 1299 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2063}"
