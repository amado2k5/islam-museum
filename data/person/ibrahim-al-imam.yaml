  ur: "ابراہیم الامام"
roles: [ruler]
gender: male
summary:
  ar: "إبراهيم بن محمد بن علي بن عبد الله بن عباس، إبراهيم الإمام، رأس دعوة بني العباس؛ غيّر اسم أبي مسلم وساقه إلى خراسان وزوّجه فيها، وأسند أمر الدعوة إلى أبي سلمة حفص بن سليمان."
  en: "Ibrahim b. Muhammad b. Ali b. Abd Allah b. Abbas — Ibrahim al-Imam — head of the Abbasid da'wa; he renamed and dispatched Abu Muslim to Khurasan and appointed Abu Salama Hafs b. Sulayman to lead the mission."
  es: "Ibrahim b. Muhammad b. Ali b. Abd Allah b. Abbas — Ibrahim al-Imam — jefe de la da'wa abasí; cambió el nombre de Abu Muslim y lo envió a Jorasán, y nombró a Abu Salama Hafs b. Sulayman para dirigir la misión."
  fr: "Ibrahim b. Muhammad b. Ali b. Abd Allah b. Abbas — Ibrahim al-Imam — chef de la da'wa abbasside; il renomma et envoya Abu Muslim au Khorasan et nomma Abu Salama Hafs b. Sulayman pour diriger la mission."
  ur: "ابراہیم بی۔ محمد بی علی بی عبداللہ بی۔ عباس - ابراہیم الامام - عباسی دعوت کے سربراہ؛ اس نے اپنا نام بدل کر ابو مسلم کو خراسان روانہ کیا اور ابو سلمہ حفص کو مقرر کیا۔ سلیمان مشن کی قیادت کریں گے۔"
  tr: "İbrahim ibn Muhammed ibn Ali ibn Abdullah ibn Abbas, Abbasi misyonunun lideri İmam İbrahim; Ebu Müslim'in adını değiştirdi, onu Horasan'a götürdü, orada evlendi ve çağrı işlerini Ebu Selame Hafs ibn Süleyman'a emanet etti."
  id: "Ibrahim ibn Muhammad ibn Ali ibn Abdullah ibn Abbas, Ibrahim sang Imam, pemimpin misi Abbasiyah; ia mengubah nama Abu Muslim dan membawanya ke Khurasan, menikahinya di sana, dan mempercayakan urusan panggilan kepada Abu Salamah Hafs ibn Sulayman."
