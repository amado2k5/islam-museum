summary:
  ar: "عالم وشاعر ورجل دولة ليبي إباضي (نحو 1870–1940)؛ من جبل نفوسة، درس بالزيتونة والأزهر والمزاب، وكان نائبًا في مجلس المبعوثان العثماني، وقائدًا في مقاومة الغزو الإيطالي، وواليًا على طرابلس الغرب، ثم وزيرًا للمالية في عُمان، وتوفي في مومباي."
  en: "Libyan Ibadi scholar, poet and statesman (c. 1870–1940). From the Jabal Nafusa, he studied at the Zitouna, al-Azhar and in the M'zab, sat in the Ottoman Chamber of Deputies, fought in the resistance to the Italian invasion, served as wali of Tripolitania and later as finance minister in Oman, and died in Mumbai."
  ur: "لیبیائی اباضی عالم، شاعر اور ریاستی رہنما (تقریباً 1870–1940)؛ جبل نفوسہ سے تعلق، زیتونہ، الازہر اور مزاب میں تعلیم پائی، عثمانی ایوانِ نمایندگان کے رکن رہے، اطالوی حملے کی مزاحمت میں حصہ لیا، طرابلس کے والی اور بعد میں عمان کے وزیرِ خزانہ رہے؛ وفات ممبئی میں ہوئی۔"
