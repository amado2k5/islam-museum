summary:
  ar: "مترجم القرآن الكريم إلى الإنجليزية (1872-1953)؛ موظف في الخدمة المدنية الهندية ومدير الكلية الإسلامية بلاهور لفترتين، وصاحب «القرآن الكريم: النص والترجمة والشرح» (1934-1938)، إحدى أوسع ترجمات القرآن انتشاراً في العالم الناطق بالإنجليزية."
  en: "Translator of the Qur'an into English (1872-1953); an Indian Civil Service officer and twice principal of Islamia College, Lahore, whose 'The Holy Qur'an: Text, Translation and Commentary' (1934-1938) remains one of the two most widely used English versions."
  ur: "قرآن مجید کے انگریزی مترجم (1872ء–1953ء)؛ انڈین سول سروس کے افسر اور اسلامیہ کالج لاہور کے دو بار پرنسپل، جن کی «قرآن مجید: متن، ترجمہ و شرح» (1934ء–1938ء) انگریزی دنیا میں سب سے زیادہ استعمال ہونے والی تراجم میں سے ہے۔"
