summary:
  ar: "محمد باي المرادي (ت. 14 تشرين الأول 1696) باي تونس المرادي والابن الأكبر لمراد باي الثاني؛ لا تذكر المقالات المقروءة سنة ميلاده {cite:wikipedia-mohamed-bey-el-mouradi-ar}. استهلكت الحروب الأهلية المرادية حكمه: هزمه أخوه علي في الكريمة سنة 1677 وأمسك تونس وهو محاصَر في القيروان، وبطل صلح 1679، ونهبت الجزائر تونس سنة 1686 فقتل عليّاً وانفرد بالسلطة؛ وفي 1694–1695 ضمّ داي الجزائر تونس ثم استعيدت بالثورة {cite:wikipedia-mohamed-bey-el-mouradi-en}. لذلك تحسب المقالان الفرنسية والعربية ولايته الفعلية من 1686 {cite:wikipedia-mohamed-bey-el-mouradi-fr}. وفي قلب الاضطراب بنى جامع سيدي محرز بتونس وجوامع ومدارس في أنحاء الإيالة وجسر طبربة وسدّها سنة 1690، وخلفه أخوه رمضان باي لصغر ابنيه مراد وحسن {cite:wikipedia-mohamed-bey-el-mouradi-ar}."
  en: "Mohamed Bey El Mouradi (died 14 October 1696) was a Muradid Bey of Tunis, eldest son of Murad II Bey; no article read gives his birth year {cite:wikipedia-mohamed-bey-el-mouradi-en}. His rule was consumed by the Muradid civil wars: his brother Ali defeated him at El Kerima in 1677 and held Tunis while he was besieged in Kairouan, a 1679 treaty failed, Algiers sacked Tunis in 1686, and he then killed Ali and seized sole power; in 1694–1695 Tunis was annexed by the Dey of Algiers and restored after revolt {cite:wikipedia-mohamed-bey-el-mouradi-en}. The French and Arabic articles accordingly count his effective tenure from 1686 {cite:wikipedia-mohamed-bey-el-mouradi-fr}. Amid the turmoil he built the Sidi Mahrez Mosque in Tunis, mosques and madrasas across the regency and the Tebourba bridge-dam of 1690, and was succeeded by his brother Ramadan Bey, his sons Mourad and Hassan being too young {cite:wikipedia-mohamed-bey-el-mouradi-fr}."
  ur: "محمد بای المرادی (وفات 14 اکتوبر 1696ء) تونس کے مرادی بای اور مراد دوم بای کے سب سے بڑے بیٹے تھے؛ پڑھے گئے مضامین میں ان کی پیدائش کا سال نہیں ملتا {cite:wikipedia-mohamed-bey-el-mouradi-ar}۔ ان کا دور مرادی خانہ جنگیوں میں گزرا: بھائی علی نے 1677ء میں الکریمہ میں انہیں شکست دے کر تونس لیا اور وہ قیروان میں محصور رہے، 1679ء کا صلح نامہ ناکام رہا، 1686ء میں الجزائر نے تونس لوٹا تو انہوں نے علی کو قتل کر کے اقتدار سنبھالا؛ 1694–1695ء میں دایِ الجزائر نے تونس ضم کیا اور بغاوت سے بحالی ہوئی {cite:wikipedia-mohamed-bey-el-mouradi-en}۔ اسی لیے فرانسیسی و عربی مضامین ان کی اصل ولایت 1686ء سے گنتے ہیں {cite:wikipedia-mohamed-bey-el-mouradi-fr}۔ شورش کے باوجود تونس میں سیدی محرز مسجد، ملک بھر میں مساجد و مدارس اور 1690ء میں طبربہ کا پل تعمیر کیا؛ جانشین بھائی رمضان بای ہوئے کیونکہ بیٹے مراد و حسن کم عمر تھے {cite:wikipedia-mohamed-bey-el-mouradi-ar}۔"

