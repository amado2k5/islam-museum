id: person/al-barbari-al-muharrir
class: person
label: { ar: "البربري المحرر", en: "al-Barbari the calligrapher" }
summary:
  ar: "إسحاق بن إبراهيم بن عبد الله بن الصباح بن بشر بن سويد بن الأسود التميمي ثم السعدي، المعروف بالبربري المحرر وكان أبوه إبراهيم أحول وكان محرراً أيضاً، وكان إسحاق يعلم المقتدر وأولاده وهو أستاذ ابن مقلة ويكنى أبا الحسين وله رسالة في الخط والكتابة سماها تحفة الوامق لم ير في زمانه مثلها {cite:fihrist-ibn-al-nadim p. 22}."
  en: "Ishaq b. Ibrahim al-Barbari — teacher of al-Muqtadir's sons and of Ibn Muqla, author of Tuhfat al-Wamiq on calligraphy {cite:fihrist-ibn-al-nadim p. 22}."
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
