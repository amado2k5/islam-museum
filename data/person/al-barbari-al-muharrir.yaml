id: person/al-barbari-al-muharrir
class: person
tags: [qiraat-browser, qiraat-people, qiraat-khatt]
label: { ar: "البربري المحرر", en: "al-Barbari the calligrapher", fr: "Al-Barbari le calligraphe", es: "al-Barbari the calligrapher", ur: "البرباری خطاط" }
summary:
  ar: "إسحاق بن إبراهيم بن عبد الله بن الصباح بن بشر بن سويد بن الأسود التميمي ثم السعدي، المعروف بالبربري المحرر وكان أبوه إبراهيم أحول وكان محرراً أيضاً، وكان إسحاق يعلم المقتدر وأولاده وهو أستاذ ابن مقلة ويكنى أبا الحسين وله رسالة في الخط والكتابة سماها تحفة الوامق لم ير في زمانه مثلها {cite:fihrist-ibn-al-nadim p. 22}."
  en: "Ishaq b. Ibrahim al-Barbari — teacher of al-Muqtadir's sons and of Ibn Muqla, author of Tuhfat al-Wamiq on calligraphy {cite:fihrist-ibn-al-nadim p. 22}."
  fr: "Ishaq ibn Ibrahim al-Barbari — maître des fils d’al-Muqtadir et d’Ibn Muqla, auteur de Tuhfat al-Wamiq sur la calligraphie {cite:fihrist-ibn-al-nadim p. 22}."
  es: "Ishaq b. Ibrahim al-Barbari - maestro de los hijos de al-Muqtadir y de Ibn Muqla, autor de Tuhfat al-Wamiq sobre caligrafía {citar:fihrist-ibn-al-nadim p. 22}."
  ur: "اسحاق بی۔ ابراہیم البرباری - المقتدیر کے بیٹوں اور ابن مقلہ کے استاد، خطاطی پر تحفۃ الوامق کے مصنف۔ 22}۔"
  tr: "İshak ibn İbrahim ibn Abdullah ibn el-Sabah ibn Bişr ibn Suveyd ibn el-Esved el-Tamimi, daha sonra el-Saadi olarak bilinen, özgür Berberi. Babası İbrahim şaşıydı ve o da özgürdü. İshak, el-Muktadir'e ve oğullarına hocalık yaptı. İbn Mukla'nın hocasıydı ve Ebu el-Hüseyin olarak biliniyordu. Hat sanatı ve yazı üzerine, zamanında benzeri görülmemiş bir eser olan Tuhfat el-Vamiq adlı bir risalesi vardı. {cite:fihrist-ibn-al-nadim s. 22}"
  id: "Ishaq ibn Ibrahim ibn Abdullah ibn al-Sabah ibn Bishr ibn Suwaid ibn al-Aswad al-Tamimi, kemudian al-Saadi, dikenal sebagai Berber yang dibebaskan. Ayahnya, Ibrahim, juling dan juga dibebaskan. Ishaq mengajar al-Muqtadir dan putra-putranya. Ia adalah guru Ibn Muqlah dan dikenal sebagai Abu al-Husayn. Ia memiliki risalah tentang kaligrafi dan tulisan yang disebut Tuhfat al-Wamiq, yang belum pernah ada sebelumnya pada zamannya. {cite:fihrist-ibn-al-nadim p. 22}."
