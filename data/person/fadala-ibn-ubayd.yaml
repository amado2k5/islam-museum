  ar: صحابي من الأوس؛ أسلم قديماً ولم يشهد بدراً وشهد أحداً وما بعدها، وفتح مصر والشام، وولاه معاوية قضاء دمشق بعد أبي الدرداء، ومات في خلافة معاوية سنة 53هـ في قول المدائني.
  en: A Companion of the Aws who embraced Islam early; he missed Badr but fought at Uhud and after, took part in the conquests of Egypt and Syria, was made judge of Damascus by Mu'awiya after Abu al-Darda, and died in Mu'awiya's caliphate, in
    53 AH according to al-Mada'ini.
