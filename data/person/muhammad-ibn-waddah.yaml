summary:
  ar: "محمد بن وضاح بن بزيع، أبو عبد الله القرطبي مولى عبد الرحمن بن معاوية بن هشام الأموي، رحل إلى المشرق رحلتين وسمع من نحو مائة وخمسة وستين شيخا وتفقه بسحنون، ونشر الحديث في الأندلس حتى قال ابن الفرضي إنه وبقي بن مخلد جعلا الأندلس دار حديث؛ ولد سنة 199 هـ على ما ذكر، وتوفي في المحرم سنة 287 هـ وقيل سنة 286 هـ، وأثنى عليه ابن الفرضي وغيره بالورع والزهد، وفي رواية أخرى عند ابن عساكر أُخذ عليه رده كثيرا من الأحاديث {cite:tarikh-dimashq-ibn-asakir-fikr-1995 vol. 56 pp. 179-183}."
  en: "Muhammad ibn Waddah ibn Bazi', Abu Abd Allah al-Qurtubi, a client of the Umayyad Abd al-Rahman ibn Mu'awiya ibn Hisham, who made two journeys to the East, heard from about a hundred and sixty-five teachers and studied law under Sahnun, and spread hadith in al-Andalus until Ibn al-Faradi could say that he and Baqi ibn Makhlad made it a house of hadith. He was born in 199 AH according to the report, and died in Muharram 287 AH (others say 286 AH); the sources praise his scrupulousness and asceticism, and one report also records objections to his frequent rejection of hadiths {cite:tarikh-dimashq-ibn-asakir-fikr-1995 vol. 56 pp. 179-183}."
