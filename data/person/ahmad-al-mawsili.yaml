summary:
  ar: "أحمد الموصلي، من عباد الشاميين، متآخٍ مع أحمد الميموني، سمع منه حديث أبي العالية في دار النعيم فاصفر ثم اسود ثم غشي عليه."
  en: "Ahmad al-Mawsili, one of the worshippers of Syria, a sworn brother of Ahmad al-Maymuni, who heard from him Abu al-Aliya's report about the abode of bliss, turned yellow, then black, and fainted."
  fr: "Ahmad al-Mawsili, l'un des dévots de Syrie, frère juré d'Ahmad al-Maymuni, entendit de lui le récit d'Abu al-Aliya sur la demeure de félicité, devint jaune puis noir et s'évanouit."
  ur: "احمد موصلی شام کے عابدوں میں سے تھے، احمد میمونی کے بھائی۔ انہوں نے ان سے ابو العالیہ کی دار النعیم والی خبر سنی تو زرد ہو گئے، پھر سیاہ، اور بے ہوش ہو گئے۔"
  es: "Ahmad al-Mawsili, uno de los fieles de Siria, hermano jurado de Ahmad al-Maymuni, que escuchó de él el relato de Abu al-Aliya sobre la morada de la dicha, se puso amarillo, luego negro, y se desmayó."
  tr: "Levantlıların cemaatinden Ahmed el-Mevsili, Ahmed el-Mevsimini'nin kardeşiydi. Dar el-Na'im'de ondan Ebu el-Aliya'nın hadisini işitince önce sarardı, sonra karardı ve bayıldı."
  id: "Ahmad al-Mawsili, dari kalangan penyembah di Levant, adalah saudara dari Ahmad al-Maimuni. Ia mendengar hadits Abu al-Aliya darinya di Dar al-Na’im, sehingga ia menjadi pucat, kemudian hitam, lalu pingsan."
