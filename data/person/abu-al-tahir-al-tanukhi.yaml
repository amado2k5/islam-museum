label: { ar: "أبو الطاهر التنوخي", en: "Abu al-Tahir al-Tanukhi" }
gender: male
roles: [jurist, scholar, writer]
summary:
  ar: "إبراهيم بن عبد الصمد بن بشير، أبو الطاهر التنوخي المهدوي، محدث ولغوي وفقيه مالكي، من المبرزين في المذهب الذين ارتقوا من التقليد إلى الاختيار والترجيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} تفقه على أبي الحسن اللخمي والسيوري وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} من تصانيفه «الأنوار البديعة إلى أسرار الشريعة» و«التنبيه» و«التذهيب على التهذيب» و«المختصر»، وذكر أنه أكمله سنة 526 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} وهو حيّ عام 526 هـ بحسب المعجم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951}"
  en: "Ibrahim ibn Abd al-Samad ibn Bashir, Abu al-Tahir al-Tanukhi al-Mahdawi, a hadith scholar, philologist and Maliki jurist, one of the leading figures of the school who moved from following tradition to independent choice and weighing of opinions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} He studied under Abu al-Hasan al-Lakhmi, al-Suyuri and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} His works include al-Anwar al-badi'a ila asrar al-shari'a, al-Tanbih, al-Tadhhib 'ala al-Tahdhib and an abridgement, which he said he completed in 526 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} The scan notes he was alive in 526 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951}"
