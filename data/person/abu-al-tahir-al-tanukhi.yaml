id: person/abu-al-tahir-al-tanukhi
class: person
label: { ar: "أبو الطاهر التنوخي", en: "Abu al-Tahir al-Tanukhi", fr: "Abu al-Tahir al-Tanukhi", es: "Abu al-Tahir al-Tanukhi", ur: "ابو الطاہر التنوخی" }
gender: male
roles: [jurist, scholar, writer]
summary:
  ar: "إبراهيم بن عبد الصمد بن بشير، أبو الطاهر التنوخي المهدوي، محدث ولغوي وفقيه مالكي، من المبرزين في المذهب الذين ارتقوا من التقليد إلى الاختيار والترجيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} تفقه على أبي الحسن اللخمي والسيوري وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} من تصانيفه «الأنوار البديعة إلى أسرار الشريعة» و«التنبيه» و«التذهيب على التهذيب» و«المختصر»، وذكر أنه أكمله سنة 526 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} وهو حيّ عام 526 هـ بحسب المعجم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951}"
  en: "Ibrahim ibn Abd al-Samad ibn Bashir, Abu al-Tahir al-Tanukhi al-Mahdawi, a hadith scholar, philologist and Maliki jurist, one of the leading figures of the school who moved from following tradition to independent choice and weighing of opinions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} He studied under Abu al-Hasan al-Lakhmi, al-Suyuri and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} His works include al-Anwar al-badi'a ila asrar al-shari'a, al-Tanbih, al-Tadhhib 'ala al-Tahdhib and an abridgement, which he said he completed in 526 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} The scan notes he was alive in 526 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951}"
  fr: "Ibrahim ibn Abd al-Samad ibn Bashir, Abu al-Tahir al-Tanukhi al-Mahdawi, traditionniste, philologue et juriste malikite, l'une des figures de premier plan de l'école qui passèrent de l'imitation au choix personnel et à la pondération des opinions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} Il étudia auprès d'Abu al-Hasan al-Lakhmi, d'al-Suyuri et d'autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} Ses œuvres comprennent al-Anwar al-badi'a ila asrar al-shari'a, al-Tanbih, al-Tadhhib 'ala al-Tahdhib et un abrégé, qu'il dit avoir achevé en 526 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} Le scan note qu'il était vivant en 526 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951}"
  es: "Ibrahim ibn Abd al-Samad ibn Bashir, Abu al-Tahir al-Tanukhi al-Mahdawi, erudito en hadices, filólogo y jurista Maliki, una de las figuras destacadas de la escuela que pasó de seguir la tradición a elegir y sopesar opiniones de forma independiente. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} Estudió con Abu al-Hasan al-Lakhmi, al-Suyuri y otros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} Sus obras incluyen al-Anwar al-badi'a ila asrar al-shari'a, al-Tanbih, al-Tadhhib 'ala al-Tahdhib y un resumen, que dijo que completó en 526 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951} El escaneo señala que estaba vivo en 526 AH. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14951}"
  ur: "ابراہیم بن عبد الصمد بن بشیر، ابو الطاہر التنوخی المہدوی، ایک حدیث کے اسکالر، ماہر فلکیات اور مالکی فقیہ، مکتب کی سرکردہ شخصیات میں سے ایک جو روایت کی پیروی سے آزاد انتخاب اور رائے کے وزن کی طرف منتقل ہوئے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 14951} اس نے ابو الحسن الخمی، السوری اور دیگر سے تعلیم حاصل کی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 14951} ان کی تصانیف میں الانوار البدیع الا اسرار الشریعہ، التنبیح، التذہیب عالی التہذیب اور ایک مختصر تحریر شامل ہے، جسے انہوں نے 526ھ میں مکمل کیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 14951} اسکین نوٹ بتاتا ہے کہ وہ 526 ہجری میں زندہ تھے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص14951}"
  tr: "İbrahim ibn Abdülsamed ibn Beşir, Ebu el-Tahir el-Tanukhi el-Mahdavi, hadis âlimi, dilbilimci ve Maliki fıkıhçısıydı. Sadece taklitten bağımsız akıl yürütmeye ve tercihe doğru ilerleyen mezhebin önde gelen isimlerindendi. Fıkıh eğitimini Ebu el-Hasan el-Lakhmi, el-Sayyuri ve diğerlerinden aldı. Eserleri arasında \"El-Enver el-Bedi'ah ila Asrar el-Şeriat\" (İslam Hukukunun Sırları Üzerine Muhteşem Işıklar), \"El-Tanbih\" (Nasihat), \"El-Tadhbib 'ala el-Tahdhib\" (İyiliğin İyiliği) ve 526 Hicri yılında tamamladığını belirttiği \"El-Mukhtasar\" (Özet) bulunmaktadır. Sözlüğe göre, 526 Hicri yılında hayattaydı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14951}"
  id: "Ibrahim ibn Abd al-Samad ibn Bashir, Abu al-Tahir al-Tanukhi al-Mahdawi, adalah seorang ulama hadits, ahli bahasa, dan ahli hukum Maliki. Beliau termasuk tokoh terkemuka dalam mazhab tersebut yang berkembang dari sekadar meniru menjadi penalaran dan preferensi yang mandiri. Beliau mempelajari ilmu hukum di bawah bimbingan Abu al-Hasan al-Lakhmi, al-Sayyuri, dan lainnya. Di antara karya-karyanya adalah \"Al-Anwar al-Badi'ah ila Asrar al-Shari'ah\" (Cahaya-Cahaya Agung Rahasia Hukum Islam), \"Al-Tanbih\" (Nasihat), \"Al-Tadhhib 'ala al-Tahdhib\" (Penyempurnaan dari Penyempurnaan), dan \"Al-Mukhtasar\" (Ringkasan), yang menurut pernyataannya diselesaikan pada tahun 526 H. Menurut kamus, beliau hidup pada tahun 526 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.14951}"
