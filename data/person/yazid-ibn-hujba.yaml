summary:
  ar: "يزيد بن حجبة بن عامر بن تيم الله بن ثعلبة بن عكابة؛ ولاه علي الري ودستبى فكسر الخراج ونقصه فحبسه علي فخرج من الحبس فلحق بمعاوية بالشام."
  en: "Yazid ibn Hujba ibn Amir of Taym Allah ibn Tha'laba ibn Ukaba; Ali made him governor of Rayy and Dastaba, he cheated and shorted the kharaj, Ali jailed him, he broke out and fled to Mu'awiya in Syria."
  es: "Yazid ibn Hujba ibn Amir de Taym Allah ibn Tha'laba ibn Ukaba; Ali lo nombró gobernador de Rayy y Dastaba, engañó y acortó al kharaj, Ali lo encarceló, se escapó y huyó a Mu'awiya en Siria."
  fr: "Yazid ibn Hujba ibn Amir de Taym Allah ibn Tha'laba ibn Ukaba; Ali l'a nommé gouverneur de Rayy et Dastaba, il a triché et court-circuité le kharaj, Ali l'a emprisonné, il s'est évadé et s'est enfui à Mu'awiya en Syrie."
  ur: "یزید بن حجبہ بن عامر تیم اللہ بن ثعلبہ ابن عقبہ۔ علی نے اسے رے اور دستبہ کا گورنر بنایا، اس نے دھوکہ دیا اور خرج کو مختصر کیا، علی نے اسے جیل میں ڈال دیا، وہ پھوٹ پڑا اور شام میں معاویہ کے پاس بھاگ گیا۔"
  tr: "Yezid ibn Hujbah ibn Amir ibn Teymullah ibn Tha'laba ibn 'Ukaba; onu Rayy ve Dastaba'nın üzerine atadı, ancak vergiyi bozdu ve azalttı, bu yüzden Ali onu hapse attı. Hapisten çıktı ve Levant'ta Muaviye'ye katıldı."
  id: "Yazid ibn Hujbah ibn Amir ibn Taymullah ibn Tha'laba ibn 'Ukaba; ia menunjuknya atas Rayy dan Dastaba, tetapi ia melanggar dan mengurangi pajak, sehingga Ali memenjarakannya. Ia dibebaskan dari penjara dan bergabung dengan Muawiyah di Levant."
