id: person/muhammad-ibn-abdallah-al-qummi
class: person
label: { ar: "محمد بن عبد الله القمي" }
summary:
  ar: "عند البلاذري: ولّاه المتوكل المعدن بمصر والقلزم وطريق الحجاز وحاج مصر فحارب البجة في عدد يسير فقلد خيله الأجراس فنفرت إبلهم وقتل ملكهم وصالح خلفه سنة إحدى وأربعين ومائتين على الأتاوة والبقط وفي رواية المقريزي عاد إلى بغداد ومعه ملكهم علي بابا ثم ولّاه سعد الخادم البجة وطريق مكة فعاد إليها فنزل أسوان ومات بها."
  en: "In al-Baladhuri: al-Mutawakkil gave him Egypt's mine, the Qulzum, the Hijaz road and Egypt's hajj command; he warred on the Buja in small numbers, hung bells on his horses so their camels bolted, killed their king and made peace with his successor in 241 on tribute and baqt — in al-Maqrizi's version he returned to Baghdad with their king Ali Baba, then Sa'd al-Khadim gave him the Buja and the Mecca road; he settled at Aswan and died there."
  es: "En al-Baladhuri: al-Mutawakkil le dio la mina de Egipto, el Qulzum, el camino del Hiyaz y el mando del Hajj de Egipto; guerreó contra los Buja en pequeño número, colgó campanas en sus caballos para que sus camellos huyeran, mató a su rey e hizo la paz con su sucesor en 241 a cambio de tributo y baqt; en la versión de al-Maqrizi regresó a Bagdad con su rey Ali Baba, luego Sa'd al-Khadim le dio los Buja y el camino a La Meca; se estableció en Asuán y murió allí."
  fr: "Selon al-Baladhuri: al-Mutawakkil lui donna la mine d’Égypte, le Qulzum, la route du Hedjaz et le commandement du pèlerinage à La Mecque en Égypte; il fit la guerre aux Buja en petit nombre, attacha des clochettes à ses chevaux pour que leurs chameaux s’emballent, tua leur roi et fit la paix avec son successeur en 241 sur un tribut et un baqt — selon la version d’al-Maqrizi, il retourna à Bagdad avec leur roi Ali Baba, puis Sa’d al-Khadim lui donna le Buja et la route de La Mecque; il s’installa à Assouan et y mourut."
  ur: "البلادوری میں ہے: المتوکل نے اسے مصر کی کان، قلزم، حجاز کی سڑک اور مصر کا حج کا حکم دیا۔ اس نے بوجہ پر کم تعداد میں جنگ کی، اپنے گھوڑوں پر گھنٹیاں لٹکائیں تو ان کے اونٹ بولے، ان کے بادشاہ کو مار ڈالا اور خراج اور بکت پر 241 میں اپنے جانشین کے ساتھ صلح کی - المکرزی کے ورژن میں وہ اپنے بادشاہ علی بابا کے ساتھ بغداد واپس آیا، پھر سعد الخادم نے اسے بوجہ اور مکہ کا راستہ دیا۔ اسوان میں سکونت اختیار کی اور وہیں وفات پائی۔"
  tr: "Al-Baladhuri'ye göre: Al-Mutawakkil Al-Ma'dan onu Mısır'a, Qulzim'e, Hicaz yoluna atadı ve Mısır'a hacı olarak atandı. Bajalarla az sayıda savaştı, süvarilerini taklit etti, develeri kovuldu ve kralları öldürüldü. Salih, 241 Hicri yılında haraç ve el-Bakt ile onun yerine geçti. Al-Maqrizi'ye göre, kralları Ali Baba ile birlikte Bağdat'a döndü, ardından Sa'd al-Khadim onu Baja ve Mekke yoluna atadı. Oraya döndü, Asvan'a yerleşti ve orada öldü."
  id: "Menurut Al-Baladhuri: Al-Mutawakkil Al-Ma'dan menunjuknya di Mesir, Qulzim, jalur Hijaz, dan dia adalah seorang peziarah ke Mesir. Dia bertempur melawan Bajas dalam jumlah kecil, meniru kavalerinya, unta mereka diusir, dan raja mereka terbunuh. Saleh menggantikannya pada tahun 241 H dengan upeti dan al-Baqt. Menurut Al-Maqrizi, dia kembali ke Baghdad bersama raja mereka Ali Baba, kemudian Sa'd al-Khadim menunjuknya ke Baja dan jalan ke Mekah. Dia kembali ke sana, menetap di Aswan, dan meninggal di sana."
