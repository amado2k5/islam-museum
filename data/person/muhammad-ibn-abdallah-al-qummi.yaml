id: person/muhammad-ibn-abdallah-al-qummi
class: person
label: { ar: "محمد بن عبد الله القمي" }
summary:
  ar: "عند البلاذري: ولّاه المتوكل المعدن بمصر والقلزم وطريق الحجاز وحاج مصر فحارب البجة في عدد يسير فقلد خيله الأجراس فنفرت إبلهم وقتل ملكهم وصالح خلفه سنة إحدى وأربعين ومائتين على الأتاوة والبقط وفي رواية المقريزي عاد إلى بغداد ومعه ملكهم علي بابا ثم ولّاه سعد الخادم البجة وطريق مكة فعاد إليها فنزل أسوان ومات بها."
  en: "In al-Baladhuri: al-Mutawakkil gave him Egypt's mine, the Qulzum, the Hijaz road and Egypt's hajj command; he warred on the Buja in small numbers, hung bells on his horses so their camels bolted, killed their king and made peace with his successor in 241 on tribute and baqt — in al-Maqrizi's version he returned to Baghdad with their king Ali Baba, then Sa'd al-Khadim gave him the Buja and the Mecca road; he settled at Aswan and died there."
