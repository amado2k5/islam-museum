label: { ar: "هرثمة بن أعين" }
summary:
  ar: "بعد فراغه من أمر أبي السرايا في سنة مائتين، سار هرثمة من الكوفة إلى خراسان لملاقاة المأمون {cite:tabari-tarikh-abu-al-fadl j.8 p.542}، ومضى رغم كتب المأمون التي أمرته بالرجوع إلى الشام أو الحجاز {cite:tabari-tarikh-abu-al-fadl j.8 p.542}. وقال للأمين حين شاوره في خلع أخيه لن ينصحك من كذبك ولن يغشك من صدقك لا تجريء القواد على الخلع فيخلعوك ولا تحملهم على نكث العهد فينكثوا عهدك فإن الغادر مخذول والناكث مغلول {cite:muruj-al-dhahab p. 375}"
  tr: "200 yılında Ebu el-Saraya'nın işlerini bitirdikten sonra, Harthama Kufa'dan Horasan'a yürüyerek el-Me'mun ile buluştu {cite:tabari-tarikh-abu-al-fadl j.8 s.542} ve el-Ma'mun'un kendisini Levant'a veya Hicaz'a dönmesi için yazdığı mektuplara rağmen devam etti {cite:tabari-tarikh-abu-al-fadl j.8 s.542}. El-Amin'e, kardeşini tahttan indirmek için danıştığında, yalanlarınız için sizi tavsiye etmeyeceğini ve dürüstlüğünü kandırmayacağını söyledi. Liderleri tahttan indirmeye yönlendirmeye cesaret etmeyin, onları vaatlerini bozmaya ve antınızı bozmaya zorlamayın, çünkü hain yenilir ve bozan bağlanır {cite:muruj-al-dhahab s. 375}"
  id: "Setelah menyelesaikan urusan Abu al-Saraya pada tahun 200, Harthama berbaris dari Kufa ke Khurasan untuk bertemu al-Ma'mun {cite:tabari-tarikh-abu-al-fadl j.8 hlm.542}, dan ia terus melanjutkan meskipun surat dari al-Ma'mun memerintahkannya kembali ke Levant atau Hijaz {cite:tabari-tarikh-abu-al-fadl j.8 hlm.542}. Ia berkata kepada al-Amin, ketika berkonsultasi tentang menggulingkan saudaranya, ia tidak akan menasihati kebohonganmu atau menipu kejujuranmu. Jangan berani memimpin pemimpin untuk menggulingkanmu, dan jangan paksa mereka mengingkari janji dan melanggar perjanjianmu, karena pengkhianat akan dikalahkan dan yang melanggar akan terikat {cite:muruj-al-dhahab hlm. 375}"
