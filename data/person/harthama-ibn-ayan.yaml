summary:
  ar: "بعد فراغه من أمر أبي السرايا في سنة مائتين، سار هرثمة من الكوفة إلى خراسان لملاقاة المأمون {cite:tabari-tarikh-abu-al-fadl j.8 p.542}، ومضى رغم كتب المأمون التي أمرته بالرجوع إلى الشام أو الحجاز {cite:tabari-tarikh-abu-al-fadl j.8 p.542}. وقال للأمين حين شاوره في خلع أخيه لن ينصحك من كذبك ولن يغشك من صدقك لا تجريء القواد على الخلع فيخلعوك ولا تحملهم على نكث العهد فينكثوا عهدك فإن الغادر مخذول والناكث مغلول {cite:muruj-al-dhahab p. 375}"
