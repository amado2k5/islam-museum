summary:
  ar: "سياسي ورجل دولة سوري، وُلد في دمشق سنة 1891 لأسرة تجارية، ناضل من أجل استقلال سورية ووحدة الأراضي العربية، وصار أول رئيس لسورية بعد الاستقلال، فتولى الرئاسة 1943–1949 ثم 1955–1958، وقاد بلاده إلى الاستقلال التام سنة 1946، وتنازل سنة 1958 ليخلفه جمال عبد الناصر رئيسا للجمهورية العربية المتحدة، وتوفي في بيروت سنة 1967."
  en: "Syrian politician and statesman, born in Damascus in 1891 to a mercantile family. He worked for Syria's independence and Arab unity, became the first president of post-independence Syria, serving 1943–1949 and again 1955–1958, led the country to full independence in 1946, and stepped down in 1958 for Gamal Abdel Nasser to head the United Arab Republic. He died in Beirut in 1967."
  ur: "شامی سیاست دان اور ریاست کار، جو 1891 میں دمشق میں پیدا ہوئے۔ وہ آزادیِ شام کے رہنما اور اس کے پہلے صدر بنے (1943–1949، پھر 1955–1958)، ان کی قیادت میں شام کو 1946 میں مکمل آزادی ملی، اور 1958 میں وہ متحدہ عرب جمہوریہ کے حق میں دستبردار ہو گئے۔ ان کا انتقال 1967 میں بیروت میں ہوا۔"
