summary:
  ar: "مسند الوقت، رجل مبارك؛ سمع من أبي الوقت وسعيد بن البنا وطائفة وأجاز له مسعود الثقفي والأصبهانيون، وكان آخر من روى حديث البغوي بعلو؛ نشر حديثه بالشام ورجع منها في آخر سنة أربع وثلاثين فتوفي ببغداد {cite:shadharat-dhahab p. 171}."
  en: "Ibn al-Latti (545–635) — musnid of his age and the last living man to transmit al-Baghawi's hadith by a high chain; he spread his hearing through Syria and returned to die at Baghdad {cite:shadharat-dhahab p. 171}."
  es: "Ibn al-Latti (545–635) — musnid de su época y el último hombre vivo en transmitir el hadiz de al-Baghawi mediante una cadena de transmisión alta; difundió su difusión por Siria y regresó a Bagdad para morir {cite:shadharat-dhahab p. 171}."
  fr: "Ibn al-Latti (545–635) — mustinid de son époque et le dernier homme vivant à transmettre le hadith d'al-Baghawi par une chaîne élevée; il a étendu son audience à travers la Syrie et est retourné mourir à Bagdad {cite:shadharat-dhahab p. 171}."
  ur: "ابن لاطی (545-635) - اپنی عمر کا مسنید اور البغوی کی حدیث کو ایک اعلیٰ سلسلہ سے منتقل کرنے والا آخری زندہ آدمی؛ اس نے اپنی سماعت کو شام تک پھیلایا اور بغداد میں مرنے کے لیے واپس آیا۔ 171}۔"
  tr: "Musnad al-Waqt, kutsanmış bir adamdı; Ebu el-Zaman, Said bin el-Banna ve bir gruptan haber aldı ve Mes'ud el-Tekafi ile İsfahanlılar tarafından yetki aldı. El-Baghavi'nin hadislerini yüksek bir statüyle en son anlatan oydu; hadislerini Levant'ta yaydı ve otuz dördüncü yılın sonunda oradan dönerek Bağdat'ta öldü {atıf:shadharat-dhahab, s. 171}."
  id: "Musnad al-Waqt, seorang pria yang diberkati; ia mendengar dari Abu al-Waqt, Sa'id ibn al-Banna, dan kelompoknya, dan diberi wewenang oleh Mas'ud al-Thaqafi dan Isfahani. Ia adalah yang terakhir menceritakan hadis al-Baghawi dengan status tinggi; ia menyebarkan hadis di Levant dan kembali dari sana pada akhir tahun tiga puluh empat, di mana ia wafat di Baghdad {cite:shadharat-dhahab, hlm. 171}."
