summary:
  ar: "أبو العباس أحمد بن عمر بن إبراهيم القرطبي، الحافظ الإمام صاحب «المفهم لما أشكل من تلخيص كتاب مسلم»؛ وُلد سنة 578هـ وتوفي سنة 656هـ بحسب عنوان الجزء السابع من المفهم."
  en: "Abu al-Abbas Ahmad ibn Umar ibn Ibrahim al-Qurtubi, the hadith master and author of al-Mufhim li-ma Ashkala min Talkhis Kitab Muslim; born 578 AH, died 656 AH according to the title page of vol. 7."
  es: "Abu al-Abbas Ahmad ibn Umar ibn Ibrahim al-Qurtubi, maestro de hadices y autor de al-Mufhim li-ma Ashkala min Talkhis Kitab Muslim; nació en 578 AH y murió en 656 AH según la página del título del vol. 7."
  fr: "Abu al-Abbas Ahmad ibn Umar ibn Ibrahim al-Qurtubi, le maître du hadith et auteur d'al-Mufhim li-ma Ashkala min Talkhis Kitab Muslim; né en 578 AH, mort en 656 AH selon la page de titre du vol. 7."
  ur: "ابو العباس احمد بن عمر بن ابراہیم القرطبی، حدیث کے ماسٹر اور المفہم لما اشکلا من تلخیص کتاب مسلم کے مصنف؛ پیدائش 578ھ، وفات 656ھ بمطابق جلد صفحہ اول۔ 7۔"
  tr: "Ebu el-Abbas Ahmed ibn Ömer ibn İbrahim el-Kurtubi, ezberci ve imam, “El-Mufhim lima Aşkala min Talkhis Kitab Muslim” adlı eserin yazarı; El-Mufhim'in yedinci bölümünün başlığına göre 578 Hicri yılında doğmuş ve 656 Hicri yılında vefat etmiştir."
  id: "Abu al-Abbas Ahmad ibn Umar ibn Ibrahim al-Qurtubi, seorang penghafal dan imam, penulis kitab “Al-Mufhim lima Ashkala min Talkhis Kitab Muslim”; beliau lahir pada tahun 578 H dan wafat pada tahun 656 H, sesuai dengan judul bagian ketujuh dari Al-Mufhim."
