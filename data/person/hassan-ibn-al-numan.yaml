summary:
  ar: "قائد وإداري أموي تولى فتح شمال إفريقيا بعد أبي المهاجر؛ يذكر الكتاب أنه قضى على الوجود البيزنطي وحطم قرطاجنة وبنى تونس مكانها، وانتصر على الكاهنة زعيمة البربر، وجدد القيروان وأنشأ بها المسجد الجامع، وأنشأ الدواوين ورتب الخراج والجزية {cite:umayyad-birth-to-fall-2006 p. 40}{cite:umayyad-birth-to-fall-2006 p. 41}."
  tr: "Ebu el-Muhacir'den sonra Kuzey Afrika'yı fetheden bir Emevi komutanı ve yöneticisi; kitapta Bizans varlığını ortadan kaldırdığı, Kartaca'yı yok ettiği, yerine Tunus'u inşa ettiği, Berberi lider Kahine'yi yendiği, Kairuan'ı yenilediği, orada Büyük Camii'yi kurduğu, divanlar kurduğu ve vergiler ile cizye düzenlediği belirtilir {cite:umayyad-birth-to-fall-2006 s. 40}."
  id: "Seorang komandan dan administrator Umayyah yang menaklukkan Afrika Utara setelah Abu al-Muhajir; buku tersebut menyebutkan bahwa ia menghilangkan kehadiran Bizantium, menghancurkan Kartago, membangun Tunisia sebagai gantinya, mengalahkan Kahineh, pemimpin Berber, merenovasi Kairouan, mendirikan Masjid Besar di sana, mendirikan diwan, dan mengatur pajak serta jizya {cite:umayyad-birth-to-fall-2006 hlm. 40}."
