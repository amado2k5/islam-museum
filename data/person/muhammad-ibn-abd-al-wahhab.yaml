summary:
  ar: "محمد بن عبد الوهاب بن سليمان التميمي (1115–1206هـ)، مؤلف «كتاب التوحيد الذي هو حق الله على العبيد»، وهو كتاب في توحيد العبادة وما ينافيه في ستة وستين باباً؛ وتصفه نشرة جامعة الإمام محمد بن سعود الإسلامية لمؤلفاته بـ«شيخ الإسلام» و«مجدد الدعوة»، وكانت الجامعة قد عقدت ندوة عن دعوته وأعادت تحقيق مؤلفاته وطبعها {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 5-6}."
  en: "Muhammad ibn 'Abd al-Wahhab ibn Sulayman al-Tamimi (1115–1206 AH), author of Kitab al-Tawhid alladhi huwa Haqq Allah 'ala al-'Abid, a book in sixty-six chapters on the oneness of worship and what contradicts it; the Imam Muhammad ibn Saud Islamic University edition of his works calls him 'Shaykh al-Islam' and 'the renewer of the call', the university having held a symposium on his call and re-edited and reprinted his works {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 5-6}."
  ur: "محمد بن عبد الوہاب بن سلیمان تمیمی (1115–1206ھ)، «کتاب التوحید الذی ہو حق اللہ علی العبید» کے مصنف، جو توحیدِ عبادت اور اس کے منافی امور پر چھیاسٹھ ابواب کی کتاب ہے؛ جامعہ امام محمد بن سعود اسلامیہ کا ان کی تصانیف کا ایڈیشن انہیں «شیخ الاسلام» اور «مجددِ دعوت» کہتا ہے، اور جامعہ نے ان کی دعوت پر سیمینار منعقد کر کے ان کی تصانیف کی ازسرِنو تحقیق اور طباعت کی {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 5-6}۔"
