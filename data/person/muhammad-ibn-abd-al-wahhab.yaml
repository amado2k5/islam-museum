summary:
  ar: "محمد بن عبد الوهاب بن سليمان التميمي ⁦(1115–1206هـ)⁩، مؤلف «كتاب التوحيد الذي هو حق الله على العبيد»، وهو كتاب في توحيد العبادة وما ينافيه في ستة وستين باباً؛ وتصفه نشرة جامعة الإمام محمد بن سعود الإسلامية لمؤلفاته بـ«شيخ الإسلام» و«مجدد الدعوة»، وكانت الجامعة قد عقدت ندوة عن دعوته وأعادت تحقيق مؤلفاته وطبعها {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 5-6}."
  en: "Muhammad ibn 'Abd al-Wahhab ibn Sulayman al-Tamimi (1115–1206 AH), author of Kitab al-Tawhid alladhi huwa Haqq Allah 'ala al-'Abid, a book in sixty-six chapters on the oneness of worship and what contradicts it; the Imam Muhammad ibn Saud Islamic University edition of his works calls him 'Shaykh al-Islam' and 'the renewer of the call', the university having held a symposium on his call and re-edited and reprinted his works {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 5-6}."
  ur: "محمد بن عبد الوہاب بن سلیمان تمیمی ⁦(1115–1206ھ)⁩، «کتاب التوحید الذی ہو حق اللہ علی العبید» کے مصنف، جو توحیدِ عبادت اور اس کے منافی امور پر چھیاسٹھ ابواب کی کتاب ہے؛ جامعہ امام محمد بن سعود اسلامیہ کا ان کی تصانیف کا ایڈیشن انہیں «شیخ الاسلام» اور «مجددِ دعوت» کہتا ہے، اور جامعہ نے ان کی دعوت پر سیمینار منعقد کر کے ان کی تصانیف کی ازسرِنو تحقیق اور طباعت کی {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 5-6}۔"
  es: "Muhammad ibn 'Abd al-Wahhab ibn Sulayman al-Tamimi (1115–1206 AH), autor de Kitab al-Tawhid alladhi huwa Haqq Allah 'ala al-'Abid, un libro de sesenta y seis capítulos sobre la unicidad de la adoración y lo que la contradice; la edición de sus obras de la Universidad Islámica Imam Muhammad ibn Saud lo llama 'Shaykh al-Islam' y 'el renovador del llamado', habiendo la universidad celebrado un simposio sobre su llamado y reeditado y reimpreso sus obras {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 5-6}."
  fr: "Muhammad ibn 'Abd al-Wahhab ibn Sulayman al-Tamimi (1115–1206 AH), auteur du Kitab al-Tawhid alladhi huwa Haqq Allah 'ala al-'Abid, un livre en soixante-six chapitres sur l'unicité du culte et ce qui la contredit; l'édition de ses œuvres de l'Université islamique Imam Muhammad ibn Saud le qualifie de « Cheikh al-Islam » et de « rénovateur de l'appel », l'université ayant organisé un symposium sur son appel et réédité et réimprimé ses œuvres {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university p. 5-6}."
  tr: "Muhammed ibn Abdülvahhab ibn Süleyman el-Temimi (1115–1206 H) 'Allah'ın Hizmetçiler Üzerindeki Hakkı olan Tek Tanrıcılık Kitabı'nın yazarıdır; bu kitap ibadet tekarlığı ve onun çelişkileri üzerine altmış altı bölümden oluşur. İmam Muhammed bin Saud İslam Üniversitesi Bülteni onu 'Şeyh al-İslam' ve 'Davah'ın Yenileyicisi' olarak tanımlar. Üniversite onun çağrısı üzerine bir seminer düzenlemiş, eserlerini yeniden düzenlemiş ve basmıştır {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university, s. 5-6}."
  id: "Muhammad ibn Abd al-Wahhab ibn Suleiman al-Tamimi (1115–1206 H), penulis 'The Book of Monotheism, which is the Right of Allah atas para Servant,' sebuah buku tentang monoteisme ibadah dan kontradiksinya dalam enam puluh enam bab. Buletin Universitas Islam Imam Muhammad ibn Saud menggambarkannya sebagai 'Sheikh al-Islam' dan 'Pembaharu Da'wah.' Universitas telah mengadakan seminar tentang seruannya, menyunting ulang dan mencetak karya-karyanya {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university} {cite:kitab-al-tawhid-ibn-abd-al-wahhab-imam-university, hlm. 5-6}."
