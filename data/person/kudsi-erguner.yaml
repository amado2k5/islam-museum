summary:
  ar: "عازف ناي ومؤلف تركي ⁦(وُلد 1952 في ديار بكر)⁩، من أبرز أساتذة الموسيقى الصوفية المولوية، بدأ في إذاعة إسطنبول في 1969، وأسس في باريس معهد مولانا لتعليم الموسيقى الصوفية الكلاسيكية، وعُيّن فنانًا لليونسكو من أجل السلام في 2016."
  en: "Turkish ney player and composer (born 1952 in Diyarbakır), one of the leading masters of Mevlevi Sufi music, who began at Istanbul Radio in 1969, founded the Mevlana Institute in Paris for the teaching of classical Sufi music, and was named a UNESCO Artist for Peace in 2016."
  ur: "ترک نے نواز اور موسیقار ⁦(پیدائش 1952ء، دیار بکر)⁩، مولوی صوفی موسیقی کے ممتاز اساتذہ میں سے، جنھوں نے 1969ء میں استنبول ریڈیو سے آغاز کیا، پیرس میں کلاسیکی صوفی موسیقی کی تعلیم کے لیے مولانا انسٹی ٹیوٹ قائم کیا، اور 2016ء میں یونیسکو کے آرٹسٹ برائے امن مقرر ہوئے۔"
