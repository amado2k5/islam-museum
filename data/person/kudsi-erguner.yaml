  en: "Turkish ney player and composer (born 1952 in Diyarbak\u0131r), one of the leading masters of Mevlevi Sufi music, who began at Istanbul Radio in 1969, founded the Mevlana Institute in Paris for the teaching of classical Sufi music, and was named a UNESCO Artist for Peace in 2016."
