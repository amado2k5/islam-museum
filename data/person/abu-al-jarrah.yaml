label: { ar: "أبو الجراح القاضي", en: "Abu al-Jarrah the Qadi", fr: "Abu al-Jarrah le cadi", es: "Abu al-Jarrah the Qadi", ur: "ابو الجراح قادی" }
summary:
  ar: "أبو الجراح القاضي صاحب سجن ابن الزبير؛ هرب من سجنه فاشترى له سلم بن زياد دار خالد بن طليق الخزاعي بالبصرة."
  en: "Abu al-Jarrah the qadi, keeper of Ibn al-Zubayr's prison; he escaped it and Sallam ibn Ziyad bought him Khalid ibn Tulayq's Basra house."
  fr: "Abu al-Jarrah le cadi, gardien de la prison d'Ibn al-Zubayr ; il s'en échappa, et Sallam ibn Ziyad lui acheta la maison de Khalid ibn Tulayq à Bassora."
  es: "Abu al-Jarrah, el cadí, era el guardián de la prisión de Ibn al-Zubayr; escapó de ella y Sallam ibn Ziyad le compró la casa de Khalid ibn Tulayq en Basora."
  ur: "ابو الجراح قادی، ابن الزبیر کی جیل کا محافظ؛ وہ اس سے بچ نکلا اور سلام ابن زیاد نے اسے خالد بن طلیق کا بصرہ گھر خرید لیا۔"
  tr: "İbn el-Zübeyr'in hapishanesinin sorumlusu olan kadı Ebu el-Cerre hapishaneden kaçınca, Salim bin Ziyad ona Basra'da Halid bin Talık el-Huzai'nin evini satın aldı."
  id: "Abu al-Jarrah, hakim yang bertanggung jawab atas penjara Ibn al-Zubayr, melarikan diri dari penjaranya, sehingga Salim bin Ziyad membelikan rumah Khalid bin Taliq al-Khuza’i di Basra untuknya."
