summary:
  ar: "بطاقة أولية لشاهزاده جهانكير، ابن سليمان القانوني وهرم سلطان الذي مات بعد إعدام أخيه مصطفى، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Şehzade Cihangir, son of Suleiman the Magnificent and Hürrem who died after his brother Mustafa's execution, named from an open reference description (Wikidata); his entry in al-Salabi's history of the Ottoman state is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Şehzade Cihangir, hijo de Solimán el Magnífico y Hürrem, que murió después de la ejecución de su hermano Mustafa, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de convocation du prince Cihangir, fils de Soliman le Magnifique et de Hürrem, décédé après l'exécution de son frère Mustafa, nommé d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "شہزادہ چہانگیر، سلیمان دی میگنیفیشنٹ کے بیٹے اور حریم کے لیے ڈرافٹ کارڈ جو اپنے بھائی مصطفیٰ کی پھانسی کے بعد مر گیا، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے لیا گیا؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Kardeşi Mustafa'nın idamından sonra ölen Süleyman Yüce ve Haram Sultan'ın oğlu Prens Cihangir'in ön kartı açık bir referans tanımında (Wikidata) belirtilmiştir. El-Sallabi'nin Osmanlı İmparatorluğu Tarihi adlı eserinin çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan Pangeran Jahangir, putra Suleiman yang Agung dan Haram Sultan yang meninggal setelah eksekusi saudaranya Mustafa, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya atas Sejarah Kekaisaran Ottoman karya Al-Sallabi belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
