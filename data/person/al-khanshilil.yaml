summary:
  ar: "الخنشليل أبو الحسن أحمد والخنشليل لقب وكان لابن النديم صديقا وزعم له دفعات أن الصناعة صحت له ولم ير ابن النديم آثار ذلك عليه لأنه لا يراه إلا فقيرا وشيخا محارفا وكان سمجا، وله من الكتب كتاب شرح نكت الرموز وكتاب الشمس وكتاب القمر وكتاب مسعف الفقراء وكتاب الأعمال على رأس الكور {cite:fihrist-ibn-al-nadim p. 507}."
  en: "Al-Khanshilil — Ibn al-Nadim's own friend who claimed alchemy yet stayed poor {cite:fihrist-ibn-al-nadim}"
