id: person/al-khanshilil
class: person
label: { ar: "الخنشليل", en: "Al Khanshilil", es: "Al Khanshilil", fr: "Al Khanshilil", ur: "الخنشلیل" }
summary:
  ar: "الخنشليل أبو الحسن أحمد والخنشليل لقب وكان لابن النديم صديقا وزعم له دفعات أن الصناعة صحت له ولم ير ابن النديم آثار ذلك عليه لأنه لا يراه إلا فقيرا وشيخا محارفا وكان سمجا، وله من الكتب كتاب شرح نكت الرموز وكتاب الشمس وكتاب القمر وكتاب مسعف الفقراء وكتاب الأعمال على رأس الكور {cite:fihrist-ibn-al-nadim p. 507}."
  en: "Al-Khanshilil — Ibn al-Nadim's own friend who claimed alchemy yet stayed poor {cite:fihrist-ibn-al-nadim}"
  es: "Al-Khanshilil — Amigo del propio Ibn al-Nadim que afirmaba practicar la alquimia pero seguía siendo pobre {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Khanshilil — L'ami d'Ibn al-Nadim qui prétendait pratiquer l'alchimie mais restait pauvre {cite:fihrist-ibn-al-nadim}"
  ur: "الخنشلیل - ابن الندیم کا اپنا دوست جس نے کیمیا کا دعویٰ کیا لیکن پھر بھی غریب ہی رہا۔"
  tr: "El-Hanşalil Ebu el-Hasan Ahmed ve El-Hanşalil bir lakaptı. İbn el-Nadim'in bir arkadaşı vardı ve birkaç grup tarafından bu zanaatın kendisi için doğru olduğu suçlandı. İbn el-Nadim ise bunun hiçbir izini görmedi çünkü onu sadece fakir, yaşlı ve yozlaşmış biri olarak görüyordu. Kitapları arasında Şerh Nukat el-Ramuz, Güneş Kitabı, Ay Kitabı, Fakirlerin Yardımcısı kitabı ve tepelerin başındaki eylem kitabı yer alır {atıf:Fihrist-ibn-al-Nadim s. 507}."
  id: "Al-Khanshalil Abu al-Hasan Ahmad dan Al-Khanshalil adalah julukan. Ibn al-Nadim memiliki seorang teman, dan beberapa kelompok menuduh bahwa kerajinan itu tepat untuknya. Ibn al-Nadim tidak melihat jejak hal ini padanya karena dia hanya melihatnya sebagai orang miskin, tua, dan orang korup. Di antara bukunya adalah buku Sharh Nukat al-Ramuz, Kitab Matahari, Kitab Bulan, buku Penolong Orang Miskin, dan kitab perbuatan di kepala bukit {cite:fihrist-ibn-al-nadim hlm. 507}."
