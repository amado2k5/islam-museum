summary:
  ar: "كاتب وشاعر وطبيب سوري من حلب (1836–1874)، من أعلام النهضة العربية؛ صاحب «غابة الحق» (نحو 1865) و«رحلة باريس» (1867)، ومن أوائل من كتبوا الشعر المنثور وقصيدة النثر في الأدب العربي الحديث، وداعية إلى الإصلاح والتعليم وحرية الإنسان."
  en: "Syrian writer, poet and physician from Aleppo (1836–1874), a leading figure of the Nahda; author of Ghabat al-haqq (c. 1865) and Rihlat Baris (1867), among the first to write prose poetry in modern Arabic literature, and an advocate of reform, education and human liberty."
  ur: "حلب سے تعلق رکھنے والے سوری مصنف، شاعر اور طبیب (1836–1874)، نہضہ کی سرکردہ شخصیت؛ «غابة الحق» (تقریباً 1865) اور «رحلة باريس» (1867) کے مصنف، جدید عربی ادب میں نثری شاعری کے اولین لکھنے والوں میں سے ایک، اور اصلاح، تعلیم اور انسانی آزادی کے داعی۔"
