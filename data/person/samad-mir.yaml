summary:
  ar: "شاعر صوفي كشميري أمي من ناروارا ونمبلهار، عمل أجيراً في قصر هاري نيواس، وأملى أكثر من مئتي قصيدة جمعها موتي لال ساقي في «كليات صمد مير»، وأشهر قصائده «أكناندن»."
  en: "Illiterate Kashmiri Sufi poet of Narwara and Nambalhar who worked as a labourer at the Hari Niwas Palace and dictated more than two hundred poems, collected by Moti Lal Saqi in the Kulyaat-e-Samad Mir; his best-known poem is Aknandun."
  ur: "ناروارہ اور نمبلہار کے ناخواندہ کشمیری صوفی شاعر، جنھوں نے ہری نواس محل میں مزدوری کی اور دو سو سے زائد نظمیں املا کرائیں، جنھیں موتی لال ساقی نے «کلیاتِ صمد میر» میں جمع کیا؛ ان کی مشہور ترین نظم «اکناندن» ہے۔"
