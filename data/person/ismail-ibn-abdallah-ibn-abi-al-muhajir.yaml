id: person/ismail-ibn-abdallah-ibn-abi-al-muhajir
class: person
label: { ar: "إسماعيل بن عبد الله بن أبي المهاجر" }
summary:
  ar: "عند البلاذري: مولى بني مخزوم ولّاه عمر بن عبد العزيز المغرب فسار أحسن سيرة ودعا البربر إلى الإسلام وقرأ عليهم كتب عمر الدعوة في النواحي فغلب الإسلام على المغرب. ويذكر الكتاب أن عمر ولاه إفريقية في المحرم سنة 99هـ، وأنه أرسل معه عشرة من فقهاء التابعين يفقهون الناس، وأن البربر أسلموا كلهم في أيامه. {cite:salabi-umayyad-state-2020 p.338} ويذكر الكتاب أنه كان صالحاً فاضلاً زاهداً، وأنه كان يُرسل إليه عمر بالرسائل لدعوة أهل الذمة إلى الإسلام فيقرؤها عليهم، وأنه توفي سنة 132هـ. {cite:salabi-umayyad-state-2020 p.388}"
  en: "In al-Baladhuri: mawla of Banu Makhzum; Umar ibn Abd al-Aziz gave him the Maghreb — he walked the best of paths, called the Berbers to Islam, and read Umar's missionary letters out to them through the districts until Islam mastered the Maghreb."
