id: person/ismail-ibn-abdallah-ibn-abi-al-muhajir
class: person
label: { ar: "إسماعيل بن عبد الله بن أبي المهاجر" }
summary:
  ar: "عند البلاذري: مولى بني مخزوم ولّاه عمر بن عبد العزيز المغرب فسار أحسن سيرة ودعا البربر إلى الإسلام وقرأ عليهم كتب عمر الدعوة في النواحي فغلب الإسلام على المغرب. ويذكر الكتاب أن عمر ولاه إفريقية في المحرم سنة 99هـ، وأنه أرسل معه عشرة من فقهاء التابعين يفقهون الناس، وأن البربر أسلموا كلهم في أيامه. {cite:salabi-umayyad-state-2020 p.338} ويذكر الكتاب أنه كان صالحاً فاضلاً زاهداً، وأنه كان يُرسل إليه عمر بالرسائل لدعوة أهل الذمة إلى الإسلام فيقرؤها عليهم، وأنه توفي سنة 132هـ. {cite:salabi-umayyad-state-2020 p.388}"
  en: "In al-Baladhuri: mawla of Banu Makhzum; Umar ibn Abd al-Aziz gave him the Maghreb — he walked the best of paths, called the Berbers to Islam, and read Umar's missionary letters out to them through the districts until Islam mastered the Maghreb."
  es: "En al-Baladhuri: mawla de Banu Makhzum; Umar ibn Abd al-Aziz le dio el Magreb; recorrió los mejores caminos, llamó a los bereberes al Islam y les leyó las cartas misioneras de Umar por los distritos hasta que el Islam dominó el Magreb."
  fr: "Dans al-Baladhuri: mawla de Banu Makhzum; Umar ibn Abd al-Aziz lui a donné le Maghreb — il a suivi les meilleurs chemins, a appelé les Berbères à l'Islam et leur a lu les lettres missionnaires d'Umar à travers les districts jusqu'à ce que l'Islam maîtrise le Maghreb."
  ur: "البلادوری میں ہے: بنو مخزوم کا مولا؛ عمر بن عبد العزیز نے اسے مغرب دیا - اس نے بہترین راستوں پر چلتے ہوئے بربروں کو اسلام کی طرف بلایا، اور عمر کے مشنری خطوط کو اضلاع میں پڑھ کر سنایا یہاں تک کہ اسلام مغرب پر عبور حاصل کر لیا۔"
  tr: "Al-Baladhuri'ye göre: O, Banu Makhzum'un özgür bir adamıydı; Ömer bin Abdülaziz onu Magrip valisi olarak atadı, en iyi davranışları izledi, Berberileri İslam'a davet etti ve çeşitli bölgelerde Ömer'in çağrı üzerine kitaplarını onlara okudu; bu da İslam'ın Mağrip'te hakim olmasına yol açtı. Kitapta, Umar'ın onu 99 Hicri yılında Muharrım'daki İfrikiye'ye atadığı, Tabi'in'den on hukukçu gönderdiği ve tüm Berberilerin onun döneminde İslam'ı benimsediği belirtilir. {alıntı:] salabi-umayyad-state-2020 s.338} Kitapta onun dindar, erdemli ve münzevi olduğu, Umar'ın ona zimmileri İslam'a davet eden mektuplar gönderdiği ve bunları onlara okuduğu, ayrıca 132 Hicri yılında öldüğü belirtilir. {cite:Salabi-umayyad-state-2020 s.388}"
  id: "Menurut Al-Baladhuri: Ia adalah mantan Banu Makhzum, yang diangkat Umar ibn Abd al-Aziz sebagai gubernur Maghreb, mengikuti perilaku terbaik, mengundang orang Berber ke Islam, dan membacakan kepada mereka buku-buku Umar tentang panggilan di berbagai wilayah, yang menyebabkan dominasi Islam di Maghreb. Kitab tersebut menyebutkan bahwa Umar mengangkatnya menjadi Ifriqiya pada Muharram pada tahun 99 H, dan bahwa ia mengirim sepuluh ahli hukum dari Tabi'in untuk membimbing rakyat, dan bahwa semua orang Berber memeluk Islam pada masanya. {cite:salabi-umayyad-state-2020 hlm.338} Buku tersebut menyebutkan bahwa ia saleh, berbudi luhur, dan pertapa kepadanya, dan bahwa Umar biasa mengirimkan surat mengundang para dhimmi ke Islam dan membacakan surat itu kepada mereka, dan bahwa ia meninggal pada tahun 132 H. {sitasi:salabi-umayyad-state-2020 hlm.388}"
