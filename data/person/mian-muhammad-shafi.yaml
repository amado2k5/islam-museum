summary:
  ar: "محامٍ وسياسي من لاهور (10 آذار 1869 – 7 كانون الثاني 1932)، من مؤسسي رابطة مسلمي عموم الهند. من أسرة ميان في باغبانبورا، تعلّم في لاهور ولندن وتدرّب في المعبد الأوسط، وأسس فرع البنجاب للرابطة أمينًا عامًا له (1907)، وكان عضوًا في وفد سيملا (1906) وفي المجلس التنفيذي للوالي عضوًا للتعليم ثم القانون (1919–1924). هو والد جهان آرا شاه نواز، ودُفن في مقبرة أسلافه في باغبانبورا."
  en: "Lahore barrister and politician (10 March 1869 – 7 January 1932), a founding member of the All-India Muslim League. Of the Mian family of Baghbanpura, he was educated at Lahore and London and called to the Bar at the Middle Temple, founded the League's Punjab branch as its general secretary (1907), sat on the Simla Deputation (1906), and served on the Viceroy's Executive Council as member for education and later law (1919–1924). He was the father of Jahanara Shahnawaz, and was buried in his ancestral graveyard at Baghbanpura."
  ur: "لاہور کے وکیل اور سیاست دان (10 مارچ 1869 – 7 جنوری 1932)، آل انڈیا مسلم لیگ کے بانی ارکان میں سے ایک۔ باغبان پورہ کے میاں خاندان سے تعلق تھا؛ لاہور اور لندن سے تعلیم پائی اور مڈل ٹیمپل سے بیرسٹر بنے، 1907 میں لیگ کی پنجاب شاخ کے جنرل سیکرٹری کی حیثیت سے اس کی بنیاد رکھی، شملہ وفد (1906) کے رکن رہے اور وائسرائے کی ایگزیکٹو کونسل میں تعلیم اور بعد ازاں قانون کے رکن رہے (1919–1924)۔ وہ جہاں آرا شاہ نواز کے والد تھے اور باغبان پورہ کے آبائی قبرستان میں دفن ہوئے۔"
