label:
  ar: طوشي بن جنكزخان
  en: Jochi (Tushi) ibn Genghis Khan
summary:
  ar: "طوشي ويقال دوشي بن جنكزخان، أكبر أولاده؛ عين له أبوه من الممالك بلاد فيلاق إلى بلغار وهي دست القفجاق، وأضاف إليه أران وهمذان وتبريز ومراغة وعيرلان، ومات في حياة أبيه وخلف من الولد ناخوا وبركة فاستقر الملك في أعقابه بدشت القفجاق."
  en: "Jochi ibn Genghis Khan, his eldest son; his father assigned him the realms from Filak to Bulgar — the Dasht-i Qipchaq — and added Arran, Hamadan, Tabriz, Maragha and Iran, but he died in his father's lifetime leaving his sons Naju (Batu) and Berke, in whose line the Dasht kingship settled."
