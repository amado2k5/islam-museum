summary:
  ar: "قارئ قرآن سعودي وإمام وخطيب المسجد الحرام بمكة. وُلد بمكة سنة 1975 (1395هـ)، وحفظ القرآن صغيرًا، ودرس الفقه بجامعة أم القرى والجامعة الإسلامية بالمدينة حتى نال الدكتوراه سنة 2008. عُيّن إمامًا رسميًا للحرم سنة 2013 وخطيبًا بأمر ملكي سنة 2019، وصار عضوًا في هيئة كبار العلماء سنة 2020، وألقى خطبة يوم عرفة سنة 2021."
  en: "Saudi Qur'an reciter and imam and khatib of Masjid al-Haram in Mecca. Born in Mecca in 1975 (1395 AH), he memorised the Qur'an as a boy and studied fiqh at Umm al-Qura University and the Islamic University of Madinah, taking his doctorate in 2008. He was appointed an official imam of the Haram in 2013 and a khatib by royal decree in 2019, joined the Council of Senior Scholars in 2020, and delivered the Arafat sermon in 2021."
  ur: "سعودی قاریِ قرآن اور مکہ میں مسجد حرام کے امام و خطیب۔ 1975ء (1395ھ) میں مکہ میں پیدا ہوئے، بچپن میں قرآن حفظ کیا، جامعہ ام القریٰ اور جامعہ اسلامیہ مدینہ میں فقہ کی تعلیم حاصل کی اور 2008ء میں ڈاکٹریٹ مکمل کی۔ 2013ء میں حرم کے باقاعدہ امام اور 2019ء میں شاہی فرمان سے خطیب مقرر ہوئے، 2020ء میں مجلسِ کبار علما کے رکن بنے اور 2021ء میں خطبۂ عرفات دیا۔"
