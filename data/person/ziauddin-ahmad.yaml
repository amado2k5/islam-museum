provenance:
  layer: own-research
  source: "English Wikipedia 'Ziauddin Ahmad' (revision 1376353391), Arabic Wikipedia 'ضياء الدين أحمد' (revision 75578459) and Urdu Wikipedia 'ضیاء الدین احمد' (revision 11800816), each fetched by its recorded revision id through the MediaWiki API with the returned id asserted equal before use, and Wikidata item Q8071382 (item revision 2519018363, queried twice with identical results). Existence checks by name fragments (ziauddin, ضياء الدين, ضیاء الدین), by biography (mathematician, Aligarh vice-chancellor), by QID across data/person, and by record provenances found no prior record for this man; ziauddin-sardar is a different, living person. One relation is written, and its direction is stated here in words: Ziauddin Ahmad SUCCEEDED Nawab Mohammad Ismail Khan as Vice-Chancellor of Aligarh Muslim University for the term that began on 19 April 1935, so this record carries successor_of pointing at person/nawab-mohammad-ismail-khan. The sequence is attested on both sides: Ziauddin's own English and Urdu articles' succession boxes name Ismail Khan immediately before him (and Zahid Hussain after him), and Ismail Khan's English and Urdu articles' boxes name Ziauddin immediately after him (and Ross Masood before Ismail Khan). The fuller history, kept honest rather than smoothed: he had been the university's first pro-vice-chancellor from 1920; his first vice-chancellor term ran 19 April 1935 to 30 April 1938 and was followed by Shah Muhammad Sulaiman (1938–1941); he was appointed again on 24 April 1941, served again thereafter, and resigned in December 1946, after which Ismail Khan held the office a second time (1947–1948) and was in post when Ziauddin died. A loose passage in his own English article ('elected vice-chancellor in 1934, remaining until 1946', with an unresolved clarification flag about 1940) is noted in that source's reliability note; the succession-box sequence on both sides is what the edge rests on. His birth year is contested (1873 in the English and Arabic texts; 1878 in the Urdu infobox and one Wikidata value — the lane queue's 'Dr. Ziauddin Ahmad (1878–1947)' carries the 1878 error; the death year 1947 is confirmed by every source)."
