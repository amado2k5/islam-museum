summary:
  ar: "ضياء الدين أحمد (1873–1947) رياضياتي وبرلماني هندي من ميروت، من أركان حركة عليكرة، تولّى نيابة رئاسة جامعة عليكرة الإسلامية فترات عدة — خلفًا لنواب محمد إسماعيل خان في الفترة التي بدأت سنة 1935 — وكان عضوًا في الجمعية التشريعية المركزية حتى 1947."
  en: "Ziauddin Ahmad (1873–1947) was an Indian mathematician and parliamentarian from Meerut, a central figure of the Aligarh Movement who served several terms as Vice-Chancellor of Aligarh Muslim University — succeeding Nawab Mohammad Ismail Khan for the term beginning in 1935 — and sat in the Central Legislative Assembly until 1947."
  ur: "ضیاء الدین احمد (1873ء–1947ء) میرٹھ کے ہندوستانی ریاضی دان اور پارلیمنٹیرین تھے، علی گڑھ تحریک کے مرکزی رہنما، جو علی گڑھ مسلم یونیورسٹی کے کئی مدتوں تک وائس چانسلر رہے — نواب محمد اسماعیل خان کے بعد 1935ء سے شروع ہونے والی مدت میں — اور 1947ء تک مرکزی قانون ساز اسمبلی کے رکن رہے۔"
