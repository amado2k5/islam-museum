  ur: "زکریا بن محمد الانصاری، شافعی شیخ الاسلام، سولہویں صدی کے مصر کے چیف قاضی اور حدیث کے ماسٹر کے لیے ڈرافٹ کارڈ، ڈی۔ 1520; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
