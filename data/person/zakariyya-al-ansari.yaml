  ar: "بطاقة أولية لزكريا بن محمد الأنصاري، شيخ الإسلام الشافعي بمصر وقاضي قضاتها ومحدثها في القرن السادس عشر، توفي سنة ١٥٢٠م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
