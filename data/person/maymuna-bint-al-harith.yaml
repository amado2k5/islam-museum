summary:
  ar: أم المؤمنين، أخت أم الفضل لبابة؛ كان اسمها برة فسماها النبي ميمونة، وتزوجها في عمرة القضاء سنة 7هـ، وقال ابن سعد إنها آخر امرأة تزوجها ممن دخل بها؛ واختُلف هل كان النبي محرماً حين العقد.
  en: A Mother of the Believers and sister of Umm al-Fadl Lubaba; she was named Barra and the Prophet called her Maymuna; he married her at the 'umrat al-qada' in 7 AH, and Ibn Sa'd says she was the last wife he took whom he consummated with;
    whether he was in ihram at the contract is disputed.
