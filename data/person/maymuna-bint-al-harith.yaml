id: person/maymuna-bint-al-harith
education:
  did_you_know:
    ar: "ميمونة بنت الحارث أم المؤمنين، أخت أم الفضل؛ كان اسمها برة فسماها النبي ميمونة، وتزوجها في عمرة القضاء سنة ٧هـ وهي آخر امرأة تزوجها ممن دخل بها."
    en: "Maymuna bint al-Harith, Mother of the Believers and Umm al-Fadl's sister: her name was Barra until the Prophet renamed her; he married her at the compensatory umrah in year 7 — the last wife he wed and consummated."
    ur: "میمونہ بنت حارث، ام المومنین اور ام الفضل کی بہن: نام برہ تھا جو نبی نے میمونہ رکھا؛ سن ۷ھ میں عمرۂ قضا پر نکاح ہوا — آخری بیوی جن سے خلوت ہوئی۔"
    sources: [source/ibn-hajar-isaba, source/mubarakpuri-raheeq]
