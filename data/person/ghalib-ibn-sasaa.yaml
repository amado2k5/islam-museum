label: { ar: "غالب بن صعصعة", en: "Ghalib ibn Sa'sa'a", es: "Ghalib ibn Sa'sa'a", fr: "Ghalib ibn Sa'sa'a", ur: "غالب ابن صاع" }
summary:
  ar: "غالب بن صعصعة بن ناجية التميمي؛ والد الفرزدق؛ كان من جلّة قومه وسرواتهم وأمه ليلى بنت حابس أخت الأقرع بن حابس؛ ولآبيه مناقب مشهورة ومحامد مأثورة منها أنه أصاب أهل الكوفة مجاعة فكان هو رئيس القوم فعقر لأهله في المنافرة المشهورة مع سحيم بن وثيل الرياحي حتى بلغ مائة ناقة في يوم واحد {cite:wafayat-ayan}."
  en: "Ghalib b. Sa'sa'a al-Tamimi — al-Farazdaq's father and a chief of his people; his mother was al-Aqra' b. Habis's sister; hero of the famine-year slaughter contest with Suhaym b. Wathil {cite:wafayat-ayan}."
  es: "Ghalib b. Sa'sa'a al-Tamimi — padre de al-Farazdaq y jefe de su pueblo; su madre era hermana de al-Aqra' b. Habis; héroe del concurso de matanza del año de la hambruna con Suhaym b. Wathil {cite:wafayat-ayan}."
  fr: "Ghalib b. Sa'sa'a al-Tamimi — père d'al-Farazdaq et chef de son peuple; sa mère était la sœur d'al-Aqra' b. Habis; héros du massacre de l'année de famine avec Suhaym b. Wathil {cite:wafayat-ayan}."
  ur: "غالب بی۔ صعصاء التمیمی — الفرازدق کے والد اور اس کی قوم کا ایک سردار؛ ان کی والدہ کا نام الاقراء تھا۔ حبس کی بہن؛ قحط سال کے ذبح کے مقابلے کا ہیرو سہیم بی کے ساتھ۔ وثیل {حوالہ: وفایت-عیان}۔"
  tr: "El-Farazdaq'ın babası Ghalib ibn Sa'sa'ah ibn Najiyah al-Tamimi, halkının önde gelen ve soylu figürlerinden biriydi. Annesi, el-Aqra' ibn Habi'nin kız kardeşi Leyla bint Habis'ti. Babası, Küfe halkı arasında kıtlığa sebep olması gibi ünlü erdemlere ve övgülere sahipti; bu yüzden halkın lideri oldu ve halkını Suhaym bin Wathil al-Riyahi ile ünlü bir tartışmaya dahil etti; bir günde yüz deve yetiştirdi {alıntı:wafayat-ayan}."
  id: "Ghalib ibn Sa'sa'ah ibn Najiyah al-Tamimi, ayah al-Farazdaq, adalah salah satu tokoh terkemuka dan mulia di kalangan bangsanya. Ibunya adalah Layla bint Habis, saudari al-Aqra' ibn Habis. Ayahnya memiliki kebajikan terkenal dan pujian yang terkenal, termasuk bahwa ia menyebabkan kelaparan di kalangan masyarakat Kufa, sehingga ia menjadi pemimpin rakyat dan terlibat dalam perselisihan terkenal dengan Suhaym ibn Wathil al-Riyahi, mencapai seratus unta dalam satu hari {cite:wafayat-ayan}."
