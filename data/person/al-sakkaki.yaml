  ar: "أبو يعقوب يوسف بن أبي بكر بن محمد السكاكي صاحب «مفتاح العلوم»؛ كان حنفياً إماماً كبيراً عالماً بارعاً متبحراً في النحو والتصريف وعلم المعاني والبيان والعروض والشعر؛ أخذ عن شيخ الإسلام محمود بن صاعد الحارثي وعن سديد بن محمد الحناطي، وأخذ عنه علم الكلام مختار بن محمود الزاهد صاحب القنية؛ توفي سنة ست وعشرين وستمائة {cite:shadharat-dhahab p. 122}."
  en: "Abu Ya'qub Yusuf al-Sakkaki — the great Hanafi master of grammar, rhetoric and prosody whose Miftah al-Ulum became the standard gateway to the language sciences; pupil of Shams al-A'imma line and teacher of the Qunya's author; died 626 {cite:shadharat-dhahab p. 122}."
