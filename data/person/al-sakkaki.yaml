id: person/al-sakkaki
class: person
label: { ar: "سراج الدين السكاكي صاحب المفتاح", en: "Siraj al-Din al-Sakkaki, author of al-Miftah", fr: "Siraj al-Din al-Sakkaki, auteur d’al-Miftah", es: "Siraj al-Din al-Sakkaki, author of al-Miftah", ur: "المفتاح کے مصنف سراج الدین السکاکی" }
summary:
  ar: "أبو يعقوب يوسف بن أبي بكر بن محمد السكاكي صاحب «مفتاح العلوم»؛ كان حنفياً إماماً كبيراً عالماً بارعاً متبحراً في النحو والتصريف وعلم المعاني والبيان والعروض والشعر؛ أخذ عن شيخ الإسلام محمود بن صاعد الحارثي وعن سديد بن محمد الحناطي، وأخذ عنه علم الكلام مختار بن محمود الزاهد صاحب القنية؛ توفي سنة ست وعشرين وستمائة {cite:shadharat-dhahab p. 122}."
  en: "Abu Ya'qub Yusuf al-Sakkaki — the great Hanafi master of grammar, rhetoric and prosody whose Miftah al-Ulum became the standard gateway to the language sciences; pupil of Shams al-A'imma line and teacher of the Qunya's author; died 626 {cite:shadharat-dhahab p. 122}."
  fr: "Abu Ya'qub Yusuf al-Sakkaki - le grand maître hanafite de grammaire, de rhétorique et de prosodie dont la Miftah al-Ulum est devenue la porte d'entrée standard des sciences du langage ; élève de Shams al-A'imma ligne et professeur de l'auteur de la Qunya ; mort 626 {cite:shadharat-dhahab p. 122}."
  es: "Abu Ya'qub Yusuf al-Sakkaki, el gran maestro hanafí de gramática, retórica y prosodia cuya Miftah al-Ulum se convirtió en la puerta de entrada estándar a las ciencias del lenguaje; alumno de la línea Shams al-A'imma y maestro del autor del Qunya; murió en 626 {cita: shadharat-dhahab p. 122}."
  ur: "ابو یعقوب یوسف السکاکی - گرائمر، بیان بازی اور پرسوڈی کے عظیم حنفی ماہر جن کا مفتاح العلوم زبان کے علوم کا معیاری گیٹ وے بن گیا۔ شمس الائمہ سطر کے شاگرد اور قنیہ کے مصنف کے استاد؛ وفات 626۔ 122}۔"
  tr: "Ebu Ya'qub Yusuf ibn Ebi Bekir ibn Muhammed el-Sakaki, 'Miftah al-Ulum'un yazarı; Hanefi âlimi, büyük bir imam, dilbilgisi, morfoloji, anlambilim, retorik, prozodi ve şiirde yetkin bir alimdi; Şeyh el-İslam Mahmud bin Seyid el-Harthi ve Sadid ibn Muhammed el-Hanati'den eğitim aldı; ondan ise el-Kudya'nın yazarı Mukhtar ibn Mahmud el-Zahid'i aldı; 626 Hicri yılında vefat etti {atıf:Shadharat-Dhahab, s. 122}."
  id: "Abu Ya'qub Yusuf ibn Abi Bakr ibn Muhammad al-Sakaki, penulis 'Miftah al-Ulum'; ia adalah seorang ulama Hanafi, imam besar, ulama terampil dalam tata bahasa, morfologi, semantik, retorika, prosodi, dan puisi; ia belajar di bawah Shaykh al-Islam Mahmoud ibn Sa'id al-Harthi dan dari Sadid ibn Muhammad al-Hanati, serta dari beliau Mukhtar ibn Mahmoud al-Zahid, penulis al-Qunya; ia wafat pada tahun 626 H {cite:shadharat-dhahab, hlm. 122}."
