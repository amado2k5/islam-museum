summary:
  ar: "جلال الدين بن شمس الدين الخوارزمي الكرلاني، من فقهاء الحنفية، عالم فاضل، أخذ عن حسام الدين الحسن السغناقي وغيره، وأخذ عنه ناصر الدين محمد بن شهاب وطاهر بن إسلام بن قاسم الخوارزمي الشهير بسعد غديوش وآخرون. من تصانيفه «الكفاية شرح الهداية»، وقد اختلفت الآراء في مؤلفه، ورجح اللكنوي أنه من تصانيفه. توفي سنة 767هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2068}"
  en: "Jalal al-Din ibn Shams al-Din al-Khwarazmi al-Karlani, a Hanafi jurist and learned scholar, who studied with Husam al-Din al-Hasan al-Sighnaqi and others; Nasir al-Din Muhammad ibn Shihab and Tahir ibn Islam ibn Qasim al-Khwarazmi, known as Sa'd Ghadiyush, studied with him. His work is 'al-Kifaya', a commentary on the Hidaya; opinions differ on its author, and al-Laknawi held it to be his. He died in 767 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2068}"
  es: "Jalal al-Din ibn Shams al-Din al-Khwarazmi al-Karlani, jurista hanafí y erudito, estudió con Husam al-Din al-Hasan al-Sighnaqi y otros; Nasir al-Din Muhammad ibn Shihab y Tahir ibn Islam ibn Qasim al-Khwarazmi, conocido como Sa'd Ghadiyush, estudiaron con él. Su obra es «al-Kifaya», un comentario sobre la Hidaya; existen diferentes opiniones sobre su autor, y al-Laknawi lo atribuyó a él. Falleció en el año 767 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2068}"
  fr: "Jalal al-Din ibn Shams al-Din al-Khwarazmi al-Karlani, juriste hanafite et érudit, fut l'élève de Husam al-Din al-Hasan al-Sighnaqi et d'autres. Nasir al-Din Muhammad ibn Shihab et Tahir ibn Islam ibn Qasim al-Khwarazmi, connu sous le nom de Sa'd Ghadiyush, furent également ses élèves. Son œuvre, « al-Kifaya », est un commentaire de la Hidaya. L'attribution de son auteur fait débat; al-Laknawi le considérait comme le sien. Il mourut en 767 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2068}"
