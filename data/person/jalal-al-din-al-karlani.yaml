summary:
  ar: "جلال الدين بن شمس الدين الخوارزمي الكرلاني، من فقهاء الحنفية، عالم فاضل، أخذ عن حسام الدين الحسن السغناقي وغيره، وأخذ عنه ناصر الدين محمد بن شهاب وطاهر بن إسلام بن قاسم الخوارزمي الشهير بسعد غديوش وآخرون. من تصانيفه «الكفاية شرح الهداية»، وقد اختلفت الآراء في مؤلفه، ورجح اللكنوي أنه من تصانيفه. توفي سنة 767هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2068}"
  en: "Jalal al-Din ibn Shams al-Din al-Khwarazmi al-Karlani, a Hanafi jurist and learned scholar, who studied with Husam al-Din al-Hasan al-Sighnaqi and others; Nasir al-Din Muhammad ibn Shihab and Tahir ibn Islam ibn Qasim al-Khwarazmi, known as Sa'd Ghadiyush, studied with him. His work is 'al-Kifaya', a commentary on the Hidaya; opinions differ on its author, and al-Laknawi held it to be his. He died in 767 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2068}"
