summary:
  ar: "ممثل هندي ⁦(وُلد سنة 1974)⁩ من بدهانا، تدرّب في المدرسة الوطنية للدراما وعمل سنوات في أدوار صغيرة قبل أن يبرز مع «عصابات واسيبور» (2012) و«كاهاني»، ونال جائزة لجنة التحكيم الخاصة في جوائز الفيلم الوطنية (2012)، واشتهر بأعمال مثل «صندوق الغداء» و«مانتو» و«ألعاب مقدسة»."
  en: "Indian actor (born 1974) from Budhana, trained at the National School of Drama, who worked for years in small parts before his breakthrough with Gangs of Wasseypur (2012) and Kahaani; he received the National Film Award's Special Jury Award (2012) and acclaim for The Lunchbox, Manto and Sacred Games."
  ur: "بھارتی اداکار ⁦(پیدائش 1974)⁩ جن کا تعلق بڑھانا سے ہے؛ نیشنل اسکول آف ڈراما سے تربیت کے بعد برسوں چھوٹے کردار کیے، پھر «گینگز آف واسے پور» (2012) اور «کہانی» سے شہرت پائی، قومی فلم ایوارڈ کا خصوصی جیوری ایوارڈ (2012) ملا اور «دی لنچ باکس»، «منٹو» اور «سیکرڈ گیمز» میں سراہا گیا۔"
  es: "Actor indio (nacido en 1974) de Budhana, formado en la Escuela Nacional de Arte Dramático, que trabajó durante años en papeles secundarios antes de su gran éxito con Gangs of Wasseypur (2012) y Kahaani; recibió el Premio Especial del Jurado de los Premios Nacionales de Cine (2012) y elogios por The Lunchbox, Manto y Sacred Games."
  fr: "Acteur indien (né en 1974) de Budhana, formé à l'École nationale d'art dramatique, qui a travaillé pendant des années dans de petits rôles avant sa percée avec Gangs of Wasseypur (2012) et Kahaani; il a reçu le Prix spécial du jury du National Film Award (2012) et a été acclamé pour The Lunchbox, Manto et Sacred Games."
  tr: "Badhana'lı bir Hintli oyuncu olan Dramon, Ulusal Drama Okulu'nda eğitim aldı ve yıllarca küçük rollerde çalıştıktan sonra 'Wasipor Gangs' (2012) ve 'Kahani' ile ortaya çıktı, Ulusal Film Ödülleri'nde (2012) Özel Jüri Ödülü'nü kazandı ve 'Lunchbox', 'Manto' ve 'Sacred Games' gibi eserleriyle ünlendi."
  id: "Seorang aktor India (lahir tahun 1974) dari Badhana, ia berlatih di National School of Drama dan bekerja bertahun-tahun dalam peran kecil sebelum tampil di 'Wasipor Gangs' (2012) dan 'Kahani', serta memenangkan Special Jury Prize di National Film Awards (2012), dan menjadi terkenal lewat karya-karya seperti 'Lunchbox', 'Manto', dan 'Sacred Games'."
