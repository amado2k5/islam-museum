summary:
  ar: "ممثل هندي (وُلد سنة 1974) من بدهانا، تدرّب في المدرسة الوطنية للدراما وعمل سنوات في أدوار صغيرة قبل أن يبرز مع «عصابات واسيبور» (2012) و«كاهاني»، ونال جائزة لجنة التحكيم الخاصة في جوائز الفيلم الوطنية (2012)، واشتهر بأعمال مثل «صندوق الغداء» و«مانتو» و«ألعاب مقدسة»."
  en: "Indian actor (born 1974) from Budhana, trained at the National School of Drama, who worked for years in small parts before his breakthrough with Gangs of Wasseypur (2012) and Kahaani; he received the National Film Award's Special Jury Award (2012) and acclaim for The Lunchbox, Manto and Sacred Games."
  ur: "بھارتی اداکار (پیدائش 1974) جن کا تعلق بڑھانا سے ہے؛ نیشنل اسکول آف ڈراما سے تربیت کے بعد برسوں چھوٹے کردار کیے، پھر «گینگز آف واسے پور» (2012) اور «کہانی» سے شہرت پائی، قومی فلم ایوارڈ کا خصوصی جیوری ایوارڈ (2012) ملا اور «دی لنچ باکس»، «منٹو» اور «سیکرڈ گیمز» میں سراہا گیا۔"
