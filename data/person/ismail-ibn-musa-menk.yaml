summary:
  ar: "داعية وعالم مسلم من زيمبابوي، يُعرف بالمفتي منك، وُلد سنة 1975 في سالزبوري ⁦(هراري اليوم)⁩. وهو المفتي الأكبر في زيمبابوي ورئيس إدارة الفتوى في مجلس علماء زيمبابوي، واشتهر عالميا بمحاضراته التحفيزية القصيرة التي تنتشر عبر المنصات الرقمية وتصل إلى جمهور واسع بلغات عدة."
  en: "Zimbabwean Muslim preacher and scholar, known as Mufti Menk, born in 1975 in Salisbury (now Harare). He is the Grand Mufti of Zimbabwe and head of the fatwa department of the Council of Islamic Scholars of Zimbabwe, known worldwide for short motivational lectures that spread through digital platforms to a large audience in several languages."
  ur: "زمبابوے کے مسلمان مبلغ اور عالم، جو مفتی منک کے نام سے معروف ہیں، 1975 میں سیلسبری ⁦(موجودہ ہرارے)⁩ میں پیدا ہوئے۔ وہ زمبابوے کے مفتی اعظم اور زمبابوے کی کونسل آف اسلامک اسکالرز کے شعبۂ فتویٰ کے سربراہ ہیں، اور اپنی مختصر پُرجوش تقاریر کے لیے دنیا بھر میں معروف ہیں جو ڈیجیٹل پلیٹ فارموں کے ذریعے کئی زبانوں میں وسیع سامعین تک پہنچتی ہیں۔"
  es: "El muftí Menk, predicador y erudito musulmán zimbabuense, nació en 1975 en Salisbury (actualmente Harare). Es el Gran Muftí de Zimbabue y jefe del departamento de fatuas del Consejo de Eruditos Islámicos de Zimbabue. Es conocido mundialmente por sus breves conferencias motivacionales que se difunden a través de plataformas digitales a un amplio público en varios idiomas."
  fr: "Le mufti Menk, prédicateur et érudit musulman zimbabwéen, est né en 1975 à Salisbury (aujourd'hui Harare). Il est le grand mufti du Zimbabwe et dirige le département des fatwas du Conseil des oulémas du Zimbabwe. Il est mondialement connu pour ses courtes conférences de motivation diffusées sur les plateformes numériques et accessibles à un large public en plusieurs langues."
  tr: "Zimbabveli Müslüman vaiz ve alim, Mufti Minak olarak bilinir, 1975 yılında Salisbury'de (bugünkü Harare) doğmuştur. Zimbabve Büyük Müftüsü ve Zimbabve Alimler Konseyi'nde Fetva Bölümü başkanıdır ve dijital platformlara yayılan ve birçok dilde geniş kitlelere ulaşan kısa motivasyon konferanslarıyla uluslararası alanda tanınır."
  id: "Seorang pengkhotbah dan ulama Muslim dari Zimbabwe, dikenal sebagai Mufti Minak, lahir pada tahun 1975 di Salisbury (sekarang Harare). Ia adalah Grand Mufti Zimbabwe dan kepala Departemen Fatwa di Dewan Cendekiawan Zimbabwe, serta dikenal secara internasional atas kuliah motivasi singkatnya yang tersebar di berbagai platform digital dan menjangkau audiens luas dalam berbagai bahasa."
