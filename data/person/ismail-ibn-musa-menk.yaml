summary:
  ar: "داعية وعالم مسلم من زيمبابوي، يُعرف بالمفتي منك، وُلد سنة 1975 في سالزبوري (هراري اليوم). وهو المفتي الأكبر في زيمبابوي ورئيس إدارة الفتوى في مجلس علماء زيمبابوي، واشتهر عالميا بمحاضراته التحفيزية القصيرة التي تنتشر عبر المنصات الرقمية وتصل إلى جمهور واسع بلغات عدة."
  en: "Zimbabwean Muslim preacher and scholar, known as Mufti Menk, born in 1975 in Salisbury (now Harare). He is the Grand Mufti of Zimbabwe and head of the fatwa department of the Council of Islamic Scholars of Zimbabwe, known worldwide for short motivational lectures that spread through digital platforms to a large audience in several languages."
  ur: "زمبابوے کے مسلمان مبلغ اور عالم، جو مفتی منک کے نام سے معروف ہیں، 1975 میں سیلسبری (موجودہ ہرارے) میں پیدا ہوئے۔ وہ زمبابوے کے مفتی اعظم اور زمبابوے کی کونسل آف اسلامک اسکالرز کے شعبۂ فتویٰ کے سربراہ ہیں، اور اپنی مختصر پُرجوش تقاریر کے لیے دنیا بھر میں معروف ہیں جو ڈیجیٹل پلیٹ فارموں کے ذریعے کئی زبانوں میں وسیع سامعین تک پہنچتی ہیں۔"
