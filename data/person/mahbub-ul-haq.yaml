summary:
  ar: "محبوب الحق (24 فبراير 1934 – 16 يوليو 1998) اقتصادي باكستاني ومنظّر للتنمية الدولية، وُلد في غورداسبور في أسرة مسلمة بنجابية وهاجر مع أسرته إلى لاهور عند التقسيم، فعمل كبير اقتصاديي لجنة التخطيط في الستينيات واشتهر بخطابه عن «22 أسرة» المهيمنة على اقتصاد باكستان، ثم مديرًا لتخطيط السياسات في البنك الدولي، ووزيرًا للمالية في الثمانينيات، فأنشأ في برنامج الأمم المتحدة الإنمائي تقرير التنمية البشرية ومؤشر التنمية البشرية (HDI) الذي غيّر قياس التنمية عالميًا."
  en: "Mahbub ul Haq (24 February 1934 – 16 July 1998) was a Pakistani economist and international development theorist, born at Gurdaspur into a Punjabi Muslim family, who migrated with his family to Lahore at Partition, served as chief economist of the Planning Commission in the 1960s — famous for his '22 families' speech on the concentration of Pakistan's wealth — then directed policy planning at the World Bank, served as finance minister in the 1980s, and at the United Nations Development Programme created the Human Development Report and the Human Development Index (HDI), which changed how development is measured worldwide."
  ur: "محبوب الحق (24 فروری 1934ء – 16 جولائی 1998ء) پاکستانی ماہر اقتصادیات اور بین الاقوامی ترقی کے نظریہ ساز تھے، گورداسپور میں ایک پنجابی مسلم خاندان میں پیدا ہوئے اور تقسیم کے وقت خاندان کے ساتھ لاہور ہجرت کی، 1960ء کی دہائی میں پلاننگ کمیشن کے چیف اکانومسٹ رہے اور اپنی ”22 خاندانوں“ والی تقریر سے مشہور ہوئے، پھر عالمی بینک میں ڈائریکٹر پالیسی پلاننگ، 1980ء کی دہائی میں وزیر خزانہ رہے، اور اقوام متحدہ کے ترقیاتی پروگرام میں انسانی ترقی رپورٹ اور انسانی ترقی اشاریہ (HDI) بنایا جس نے دنیا بھر میں ترقی کی پیمائش بدل دی۔"
