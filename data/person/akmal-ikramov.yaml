summary:
  ar: "سياسي أوزبكي سوفييتي (1898–1938)، السكرتير الأول للجنة المركزية للحزب الشيوعي الأوزبكي من 1929 إلى 1937 وأول أوزبكي عرقيا في هذا المنصب، قاد التجميع الزراعي وحملة القطن وصمّم إجراءات مناهضة الإسلام في الخطة الخمسية الأولى في أوزبكستان. قُدّم لمحاكمة الواحد والعشرين وأُعدم في كوموناركا في مارس 1938 ورُدّ اعتباره سنة 1957."
  en: "Uzbek Soviet politician (1898–1938), first secretary of the Central Committee of the Communist Party of Uzbekistan from 1929 to 1937 and the first ethnic Uzbek in that post, who drove collectivisation and the cotton campaign in Uzbekistan and designed the anti-Islamic measures of the first five-year plan there. A defendant at the Trial of the Twenty-One, he was shot at Kommunarka in March 1938 and rehabilitated in 1957."
  ur: "ازبک سوویت سیاست دان (1898–1938)، 1929 سے 1937 تک ازبکستان کی کمیونسٹ پارٹی کی مرکزی کمیٹی کے پہلے سیکرٹری اور اس عہدے پر پہلے نسلی ازبک، جنہوں نے ازبکستان میں اجتماعی کاشت اور کپاس کی مہم چلائی اور پہلے پانچ سالہ منصوبے کے اسلام مخالف اقدامات ڈیزائن کیے۔ اکیس افراد کے مقدمے میں پیش ہوئے، مارچ 1938 میں کومونارکا میں گولی مار دیے گئے اور 1957 میں بحالِ حیثیت ہوئے۔"
