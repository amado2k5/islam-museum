summary:
  ar: "مربٍّ هندي تولى نيابة رئاسة جامعة عليكرة الإسلامية من سنة 1929 حتى وفاته سنة 1937. ابن سيد محمود وحفيد السيد أحمد خان، تعلّم في عليكرة وأكسفورد، وأدار التعليم العام في حيدرآباد من 1916 إلى 1928، وشارك في تأسيس الجامعة العثمانية، وكتب «اليابان ونظامها التعليمي» (1923)؛ وأهداه الروائي إ. م. فورستر روايته «ممر إلى الهند»."
  en: "Indian educationist who served as vice-chancellor of Aligarh Muslim University from 1929 until his death in 1937. Son of Syed Mahmood and grandson of Syed Ahmad Khan, he was educated at Aligarh and Oxford, directed public instruction in Hyderabad from 1916 to 1928, helped found Osmania University, and wrote Japan and its Educational System (1923); E. M. Forster dedicated A Passage to India to him."
  ur: "ہندوستانی ماہر تعلیم جو 1929 سے 1937 میں وفات تک علی گڑھ مسلم یونیورسٹی کے وائس چانسلر رہے۔ سید محمود کے بیٹے اور سر سید احمد خان کے پوتے تھے؛ علی گڑھ اور آکسفورڈ سے تعلیم پائی، 1916 سے 1928 تک حیدرآباد میں ڈائریکٹر پبلک انسٹرکشن رہے، جامعہ عثمانیہ کے بانیوں میں شامل تھے اور «جاپان اور اس کا تعلیمی نظام» (1923) لکھی؛ ای. ایم. فورسٹر نے اپنا ناول «اے پیسج ٹو انڈیا» ان کے نام منسوب کیا۔"
  es: "Educador indio que se desempeñó como vicerrector de la Universidad Musulmana de Aligarh desde 1929 hasta su muerte en 1937. Hijo de Syed Mahmood y nieto de Syed Ahmad Khan, se educó en Aligarh y Oxford, dirigió la instrucción pública en Hyderabad de 1916 a 1928, ayudó a fundar la Universidad de Osmania y escribió Japón y su sistema educativo (1923); E. M. Forster le dedicó Un pasaje a la India."
  fr: "Éducateur indien qui a été vice-chancelier de l'Université musulmane d'Aligarh de 1929 jusqu'à sa mort en 1937. Fils de Syed Mahmood et petit-fils de Syed Ahmad Khan, il a fait ses études à Aligarh et à Oxford, a dirigé l'instruction publique à Hyderabad de 1916 à 1928, a contribué à la fondation de l'Université Osmania et a écrit Japan and its Educational System (1923); EM Forster lui a dédié A Passage to India."
  tr: "Hintli bir eğitimci olan Swes, 1929'dan 1937'deki ölümüne kadar Aligarh İslam Üniversitesi'nde başkan yardımcısı olarak görev yaptı. Syed Mahmood'un oğlu ve Sayyid Ahmed Khan'ın torunu olan Han, Aligarh ve Oxford'da eğitim gördü, 1916'dan 1928'e kadar Haydarabad'da kamu eğitimini yönetti, Osmanlı Üniversitesi'nin kuruluşuna katıldı ve 'Japonya ve Eğitim Sistemi' (1923) adlı eserini yazdı; ayrıca romancı E. M. Forster tarafından 'Hindistan'a Geçiş' adlı romanıyla hediye edildi."
  id: "Sebagai pendidik India, ia menjabat sebagai wakil presiden Universitas Islam Aligarh dari tahun 1929 hingga wafat pada tahun 1937. Putra Syed Mahmood dan cucu Sayyid Ahmed Khan, ia belajar di Aligarh dan Oxford, mengelola pendidikan publik di Hyderabad dari tahun 1916 hingga 1928, berpartisipasi dalam pendirian Universitas Ottoman, dan menulis 'Japan and Its Educational System' (1923); dan dianugerahi oleh novelis E. M. Forster dengan novelnya 'A Passage to India.'"
