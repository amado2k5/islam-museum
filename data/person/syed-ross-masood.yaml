summary:
  ar: "مربٍّ هندي تولى نيابة رئاسة جامعة عليكرة الإسلامية من سنة 1929 حتى وفاته سنة 1937. ابن سيد محمود وحفيد السيد أحمد خان، تعلّم في عليكرة وأكسفورد، وأدار التعليم العام في حيدرآباد من 1916 إلى 1928، وشارك في تأسيس الجامعة العثمانية، وكتب «اليابان ونظامها التعليمي» (1923)؛ وأهداه الروائي إ. م. فورستر روايته «ممر إلى الهند»."
  en: "Indian educationist who served as vice-chancellor of Aligarh Muslim University from 1929 until his death in 1937. Son of Syed Mahmood and grandson of Syed Ahmad Khan, he was educated at Aligarh and Oxford, directed public instruction in Hyderabad from 1916 to 1928, helped found Osmania University, and wrote Japan and its Educational System (1923); E. M. Forster dedicated A Passage to India to him."
  ur: "ہندوستانی ماہر تعلیم جو 1929 سے 1937 میں وفات تک علی گڑھ مسلم یونیورسٹی کے وائس چانسلر رہے۔ سید محمود کے بیٹے اور سر سید احمد خان کے پوتے تھے؛ علی گڑھ اور آکسفورڈ سے تعلیم پائی، 1916 سے 1928 تک حیدرآباد میں ڈائریکٹر پبلک انسٹرکشن رہے، جامعہ عثمانیہ کے بانیوں میں شامل تھے اور «جاپان اور اس کا تعلیمی نظام» (1923) لکھی؛ ای. ایم. فورسٹر نے اپنا ناول «اے پیسج ٹو انڈیا» ان کے نام منسوب کیا۔"
