label: { ar: "أشجع السلمي", en: "Ashja' al-Sulami", es: "Ashja' al-Sulami", fr: "Ashja' al-Sulami", ur: "اشجع السلمی۔" }
summary:
  ar: "شاعر، استحسن المسعودي رثاءه للبرامكة من قصيدته الآن أرحنا واستراحت ركابنا وقوله ودونك سيفاً برمكياً مهنداً أصيب بسيف هاشمي مهند، وقوله ولى عن الدنيا بنو برمك فلو توالى على الناس ما زادا {cite:muruj-al-dhahab p. 367-369}."
  en: "The elegist whose 'a Barmakid blade struck down by a Hashimi blade' Mas'udi singled out among the mourning odes {cite:muruj-al-dhahab p. 367-369}."
  es: "El autor de la elegía, cuya \"espada Barmakid derribada por una espada Hashimi\" Mas'udi destacó entre las odas de duelo {cite:muruj-al-dhahab p. 367-369}."
  fr: "L'élégiste dont « une lame Barmakid abattue par une lame Hashimi » Mas'udi a distingué parmi les odes de deuil {cite:muruj-al-dhahab p. 367-369}."
  ur: "وہ مہتمم جس کا 'برمکیڈ بلیڈ ہاشمی بلیڈ سے ٹکرا گیا' مسعودی نے ماتمیوں میں شامل کیا {حوالہ: مروج الذہب صفحہ۔ 367-369}۔"
  tr: "Bir şair olan Al-Mas'udi, 'Şimdi Bizi ve Binicilerimizi Dinlendirin' şiirinden Barmamaklar için yazdığı ağıtı ve şu sözünden övdü: 'Ve yanınızda Bramak taşıyan bir kılıç, Haşimi kılıcı Haşimi kılıcıyla vurulmuş ve şu sözü: 'Banu Barmaklar dünyayı terk etti, eğer halkla birleşselerdi, artmazdı' {atıf:Muruj-al-Dhahab, s. 367-369}."
  id: "Seorang penyair, Al-Mas'udi memuji eleginya untuk Barmamak dari puisinya 'Sekarang Beristirahatlah Kami dan Penunggang-Penunggangnya' dan perkataannya: 'Dan di dekatmu adalah pedang yang memegang Bramak, pedang Hasyemit yang dipukul pedang Hasyamik, dan perkataannya: 'Banu Barmak telah meninggalkan dunia, jadi jika mereka bergabung dengan rakyat, tidak akan bertambah' {cite:Muruj-al-Dhahab, hlm. 367-369}."
