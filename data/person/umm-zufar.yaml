summary:
  ar: 'امرأة سوداء طويلة شكت إلى النبي أنها تصرع وتنكشف، فخيّرها بين أن تصبر ولها الجنة وأن يدعو لها بالعافية فاختارت الصبر وطلبت ألا تنكشف فدعا لها؛ قال ابن عباس: «هذه المرأة من أهل الجنة»، ورآها عطاء على سلم الكعبة.'
  en: A tall black woman who complained to the Prophet that she suffered seizures and her body was exposed; he gave her the choice between patience, with Paradise, and a prayer for cure, and she chose patience and asked that she not be exposed,
    so he prayed for that; Ibn Abbas said 'This woman is of the people of Paradise', and Ata' saw her on the steps of the Kaaba.
  ur: "لمبی سیاہ عورت جس نے نبی سے شکایت کی کہ اسے دورے پڑتے ہیں اور جسم کھلتا ہے؛ انہوں نے اسے صبر اور دعا میں انتخاب دیا۔"
  es: "Una mujer alta y negra se quejó al Profeta de que sufría ataques epilépticos y su cuerpo quedaba expuesto; él le dio a elegir entre la paciencia, con el Paraíso, y una oración por la curación, y ella eligió la paciencia y pidió que no la expusieran, así que él oró por ello; Ibn Abbas dijo: \"Esta mujer es de la gente del Paraíso\", y Ata' la vio en las escaleras de la Kaaba."
  fr: "Une grande femme noire se plaignit au Prophète de souffrir de crises d'épilepsie et d'avoir le corps exposé; il lui laissa le choix entre la patience, avec le Paradis, et une prière pour la guérison, et elle choisit la patience et demanda à ne pas être exposée, alors il pria pour cela; Ibn Abbas dit: « Cette femme est des gens du Paradis », et Ata' la vit sur les marches de la Kaaba."
  tr: "Uzun boylu siyahi bir kadın, Peygamber'e vurulduğunu ve açığa çıktığını şikayet etti, bu yüzden sabırlı olmakla cenneti yaşamak ve kendi iyiliği için dua etmek arasında seçim yapmak zorunda kaldı. Sabrı seçti ve açılmamak istedi, o da onun için dua etti; İbn Abbas dedi ki: \"Bu kadın cennet halkı arasındadır,\" ve onu Kabe'nin basamaklarında bir hediye olarak gördü."
  id: "Seorang wanita kulit hitam tinggi mengeluh kepada Nabi bahwa dia sedang dipukul dan terekspos, sehingga dia harus memilih antara bersabar dan menikmati Surga serta berdoa untuk kesejahteraannya. Dia memilih kesabaran dan meminta agar tidak terbongkar, sehingga dia mendoakan dirinya; Ibn Abbas berkata: \"Wanita ini ada di antara umat Surga,\" dan dia melihatnya sebagai hadiah di tangga Ka'bah."
