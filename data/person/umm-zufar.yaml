summary:
  ar: 'امرأة سوداء طويلة شكت إلى النبي أنها تصرع وتنكشف، فخيّرها بين أن تصبر ولها الجنة وأن يدعو لها بالعافية فاختارت الصبر وطلبت ألا تنكشف فدعا لها؛ قال ابن عباس: «هذه المرأة من أهل الجنة»، ورآها عطاء على سلم الكعبة.'
  en: A tall black woman who complained to the Prophet that she suffered seizures and her body was exposed; he gave her the choice between patience, with Paradise, and a prayer for cure, and she chose patience and asked that she not be exposed,
    so he prayed for that; Ibn Abbas said 'This woman is of the people of Paradise', and Ata' saw her on the steps of the Kaaba.
