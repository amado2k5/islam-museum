label: { ar: "صول التركي", en: "Sul al-Turki", es: "Sul al-Turki", fr: "Sul al-Turki", ur: "سل الترکی" }
summary:
  ar: "صول التركي ملك سمّته الترك على ملكه بعد أن غلبت على حائط جرجان؛ عرض ليزيد بن المهلب في طريق خراسان فحصره بدهستان ثم بالبحيرة ستة أشهر حتى صالحه على أمان نفسه وماله وثلاثمائة من أهل بيته وتسليم البحيرة وقال أبو عبيدة معمر بن المثنى إن صولاً قتل."
  en: "Sul al-Turki, the king the Turks named after seizing Jurjan's wall; he met Yazid ibn al-Muhallab on the Khurasan road, was besieged at Dihistan then six months at al-Buhayra till he treated for his life, property and three hundred household against surrendering the town — Abu Ubayda reports him killed."
  es: "Sul al-Turki, el rey al que los turcos nombraron tras apoderarse de la muralla de Jurjan, se encontró con Yazid ibn al-Muhallab en el camino de Jorasán, fue asediado en Dihistan y luego durante seis meses en al-Buhayra hasta que amenazó con su vida, sus propiedades y las de trescientas familias si no entregaba la ciudad. Abu Ubayda informa que fue asesinado."
  fr: "Sul al-Turki, le roi que les Turcs nommèrent après la prise du mur de Jurjan; il rencontra Yazid ibn al-Muhallab sur la route du Khorasan, fut assiégé à Dihistan puis pendant six mois à al-Buhayra jusqu'à ce qu'il lutte pour sa vie, ses biens et trois cents membres de sa famille contre la reddition de la ville — Abu Ubayda rapporte qu'il fut tué."
  ur: "سل الترکی، ترکوں کا بادشاہ جس کا نام جرجان کی دیوار پر قبضے کے بعد رکھا گیا تھا۔ اس کی ملاقات خراسان کی سڑک پر یزید بن المحلب سے ہوئی، اسے دہستان کا محاصرہ کیا گیا پھر البحیرہ میں چھ ماہ تک اس نے اپنی جان، مال اور تین سو گھر والوں کے ساتھ قصبہ کو ہتھیار ڈالنے کے خلاف علاج کیا - ابو عبیدہ نے اسے قتل کر دیا۔"
