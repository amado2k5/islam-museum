  en: "Sul al-Turki, the king the Turks named after seizing Jurjan's wall; he met Yazid ibn al-Muhallab on the Khurasan road, was besieged at Dihistan then six months at al-Buhayra till he treated for his life, property and three hundred household against surrendering the town — Abu Ubayda reports him killed."
