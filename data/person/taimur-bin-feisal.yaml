summary:
  ar: "تيمور بن فيصل آل سعيد (وُلد في مسقط سنة 1886 – توفي في بومباي في 28 يناير 1965)، سلطان عُمان من أكتوبر 1913 إلى 10 فبراير 1932، وابن السلطان فيصل بن تركي من زوجته الأولى علياء بنت ثويني؛ شهد عهده معاهدة السيب سنة 1920 وأول مجلس وزراء، وتنازل لابنه الأكبر سعيد، وهو جد السلطانين قابوس وهيثم."
  en: "Taimur bin Feisal Al Said (born at Muscat in 1886 – died at Bombay on 28 January 1965), Sultan of Oman from October 1913 to 10 February 1932 and the son of Sultan Faisal bin Turki by his first wife Aliyah bint Thuwaini; his reign saw the 1920 Treaty of Seeb and the first council of ministers, he abdicated in favour of his eldest son Said, and he was the grandfather of Sultans Qaboos and Haitham."
  ur: "تیمور بن فیصل آل سعید (پیدائش: مسقط، 1886ء – وفات: بمبئی، 28 جنوری 1965ء)، اکتوبر 1913ء سے 10 فروری 1932ء تک سلطانِ عمان اور سلطان فیصل بن ترکی کے بیٹے؛ ان کے عہد میں 1920ء کا معاہدۂ سیب اور پہلی وزراء کونسل قائم ہوئی، وہ بڑے بیٹے سعید کے حق میں دستبردار ہوئے، اور سلطان قابوس و سلطان ہیثم کے دادا تھے۔"
