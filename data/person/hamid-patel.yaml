  ar: تربوي بريطاني مسلم، الرئيس التنفيذي لأكاديميات ستار ⁦(Star Academies)⁩ وهي من أكبر شبكات المدارس ذات الأداء العالي في إنجلترا؛ خريج دار العلوم ببري يحمل لقب مفتي، ومُنح لقب فارس سنة 2021 لخدماته التعليمية.
  en: British Muslim educationist, Chief Executive of Star Academies, one of England's highest-performing multi-academy school trusts. A graduate of Darul Uloom in Bury holding the title Mufti, he was knighted
    in 2021 for services to education.
  ur: برطانوی مسلم ماہرِ تعلیم اور اسٹار اکیڈمیز کے چیف ایگزیکٹو، جو انگلینڈ کے کارکردگی میں سب سے نمایاں کثیرالاکادمی اسکول ٹرسٹوں میں ہے۔ بری کی دار العلوم کے فارغ التحصیل اور مفتی کے لقب کے حامل، انہیں
    2021 میں خدماتِ تعلیم پر سر کا لقب ملا۔
  es: "Educador musulmán británico, director ejecutivo de Star Academies, una de las redes de escuelas concertadas de mayor rendimiento en Inglaterra. Graduado de Darul Uloom en Bury, donde ostentó el título de Mufti, fue nombrado caballero en 2021 por sus servicios a la educación."
  fr: "Pédagogue musulman britannique, directeur général de Star Academies, l'un des réseaux d'établissements scolaires multi-académiques les plus performants d'Angleterre. Diplômé de Darul Uloom à Bury, où il détient le titre de mufti, il a été anobli en 2021 pour services rendus à l'éducation."
