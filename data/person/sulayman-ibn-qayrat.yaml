id: person/sulayman-ibn-qayrat
class: person
label: { ar: "سليمان بن قيراط", en: "Sulayman ibn Qayrat", es: "Sulayman ibn Qayrat", fr: "Sulayman ibn Qayrat", ur: "سلیمان بن قیراط" }
summary:
  ar: "مولى المهدي صاحب صحراء قيراط بمدينة السلام؛ عند البلاذري كان عليه مروج دواب الهدي وأغنامه بسيسر فكتب إليه بخبر الصعاليك فأمره ببناء مدينة سيسر فبناها مع شريكه سلام الطيفوري وحصناها."
  en: "al-Mahdi's mawla, owner of Sahrat Qayrat at Madinat al-Salam; in al-Baladhuri keeper of the caliph's meadows and flocks at Sisar — on his report of the brigands al-Mahdi ordered Sisar built, which he and Salam al-Tayfuri fortified."
  es: "Mawla de al-Mahdi, propietario de Sahrat Qayrat en Madinat al-Salam; en al-Baladhuri, guardián de los prados y rebaños del califa en Sisar — tras su informe sobre los bandidos, al-Mahdi ordenó construir Sisar, que él y Salam al-Tayfuri fortificaron."
  fr: "Le mawla d'al-Mahdi, propriétaire de Sahrat Qayrat à Madinat al-Salam; à al-Baladhuri, gardien des prairies et des troupeaux du calife à Sisar — sur son rapport sur les brigands, al-Mahdi ordonna la construction de Sisar, qu'il fortifia avec Salam al-Tayfuri."
  ur: "المہدی کے مولا، مدینۃ السلام میں صاحب قرات کے مالک؛ البلادوری میں سیسار میں خلیفہ کے کھیتوں اور ریوڑ کے رکھوالے - اس کی بریگینڈوں کی اطلاع پر المہدی نے سیسار کو تعمیر کرنے کا حکم دیا، جسے اس نے اور سلام الطیفوری نے مضبوط کیا۔"
  tr: "Barış şehrinde Qirat çölünün sahibi olan el-Mehdi'nin özgür adamı; el-Baladhuri'ye göre, Sisur'da kurban hayvanları ve koyunlardan oluşan bir sürüsü vardı. Serseriler hakkında haber yazdı, Sissar şehrini inşa etmesini emretti; şehri ortağı Salam al-Tayfuri ile birlikte inşa etti ve tahkim etti."
  id: "Mantan al-Mahdi, pemilik gurun Qirat di kota damai; menurut al-Baladhuri, ia memiliki kawanan hewan dan domba korban di Sisur. Ia menulis kepada Sädhu dengan kabar tentang para gelandangan, memerintahkan Sär membangun kota Sissar, yang ia bangun bersama rekannya Salam al-Tayfuri dan memperkuatnya."
