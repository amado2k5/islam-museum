label: { ar: "أبو مسلم الخراساني", en: "Abu Muslim al-Khurasani" }
summary:
  ar: "دخل مرو في جمادى الآخرة سنة ثلاثين ومائة وبويع بها {cite:tabari-tarikh-abu-al-fadl j.7 p.377}، وقُتل في سنة سبع وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.479}. وعند المسعودي قتل سلم بن أحوز قاتل يحيى بن زيد وأنزل جثته من الصلب فصلى عليها في جماعة أصحابه وأظهر أهل خراسان النياحة عليه سبعة أيام {cite:muruj-al-dhahab p. 200}، وعند المسعودي لما رد يقطيناً عن الخزائن قال أؤتمن على الدماء ولا أؤتمن على الأموال، ولما قال له الجريري طلبت بثأر قوم ثم نقضت بيعتهم أراد الرجوع فنهاه مالك بن الهيثم فقال له لقد بليت بإبليس وما بليت بمثل هذا {cite:muruj-al-dhahab p. 279-280}. وعند طقّوش اختاره الإمام إبراهيم بن محمد بعد أن اعتذر سليمان بن كثير الخزاعي نقيب النقباء وإبراهيم بن سلمة عن قيادة الدعوة، فقلّده الأمر ممثلاً له في خراسان؛ ومزج أبو مسلم بين السياسة والقوة العسكرية فأبقى على العداء بين نصر بن سيار وخصومه وتعاون مع جديع الكرماني وشيبان الحروري ثم تخلص منهم جميعاً وتفرد بحكم خراسان واتخذ لنفسه لقب أمير آل محمد {cite:tarikh-dawla-abbasiyya-taqqush p. 23-26}"
  en: "He entered Merv in Jumada II of 130 AH and was given the oath of allegiance there {cite:tabari-tarikh-abu-al-fadl j.7 p.377}, and he was killed in 137 AH {cite:tabari-tarikh-abu-al-fadl j.7 p.479}. According to al-Mas'udi, Salm ibn Ahwaz, the killer of Yahya ibn Zayd, was killed; his body was taken down from the cross and prayed over by a company of his companions, and the people of Khurasan showed mourning for him for seven days {cite:muruj-al-dhahab p. 200}. Also according to al-Mas'udi, when he turned Yaqtin back from the treasuries he said: 'I am trusted with blood, but I am not trusted with wealth'; and when al-Jurayri said to him, 'You sought vengeance for one people and then broke the pledge to them', he wished to return, but Malik ibn al-Haytham forbade him, and he said to him: 'I have been tried by Iblis, and I have not been tried by the like of this' {cite:muruj-al-dhahab p. 279-280}. According to Taqqush, Imam Ibrahim ibn Muhammad chose him, after Sulayman ibn Kathir al-Khuza'i, chief of chiefs (naqib al-nuqaba'), and Ibrahim ibn Salama had excused themselves from leading the da'wa; he entrusted him with the command as his representative in Khurasan. Abu Muslim combined politics with military force: he kept alive the enmity between Nasr ibn Sayyar and his rivals, and cooperated with Jadi' al-Kirmani and Shayban al-Haruri, then rid himself of all of them and became sole ruler of Khurasan, taking for himself the title Amir of the House of Muhammad {cite:tarikh-dawla-abbasiyya-taqqush p. 23-26}"
