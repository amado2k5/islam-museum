summary:
  ar: "دخل مرو في جمادى الآخرة سنة ثلاثين ومائة وبويع بها {cite:tabari-tarikh-abu-al-fadl j.7 p.377}، وقُتل في سنة سبع وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.479}.، وعند المسعودي قتل سلم بن أحوز قاتل يحيى بن زيد وأنزل جثته من الصلب فصلى عليها في جماعة أصحابه وأظهر أهل خراسان النياحة عليه سبعة أيام {cite:muruj-al-dhahab p. 200}، وعند المسعودي لما رد يقطيناً عن الخزائن قال أؤتمن على الدماء ولا أؤتمن على الأموال، ولما قال له الجريري طلبت بثأر قوم ثم نقضت بيعتهم أراد الرجوع فنهاه مالك بن الهيثم فقال له لقد بليت بإبليس وما بليت بمثل هذا {cite:muruj-al-dhahab p. 279-280}"
