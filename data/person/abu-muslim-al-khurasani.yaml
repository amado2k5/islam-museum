id: person/abu-muslim-al-khurasani
education:
  did_you_know:
    ar: "دخل أبو مسلم مرو في جمادى الآخرة سنة ١٣٠هـ فبويع بها للعباسيين، وقُتل سنة ١٣٧هـ — الرجل الذي أطلق من خراسان الدعوة التي قلبت الدولة."
    en: "Abu Muslim entered Merv in Jumada II of 130 AH and took its pledge for the Abbasids; killed in 137, he was the man whose Khurasan call overturned the state."
    ur: "ابومسلم 130ھ جمادی الثانی میں مرو میں داخل ہوا اور عباسیوں کے لیے بیعت لی؛ 137ھ میں قتل ہوا — وہ شخص جس کی خراسانی دعوت نے سلطنت پلٹ دی۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/muruj-al-dhahab]
class: person
label: { ar: "أبو مسلم الخراساني", en: "Abu Muslim al-Khurasani", fr: "Abu Muslim al-Khurasani", es: "Abu Muslim al-Khurasani", ur: "ابو مسلم الخراسانی" }
summary:
  ar: "دخل مرو في جمادى الآخرة سنة ثلاثين ومائة وبويع بها {cite:tabari-tarikh-abu-al-fadl j.7 p.377}، وقُتل في سنة سبع وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.479}. وعند المسعودي قتل سلم بن أحوز قاتل يحيى بن زيد وأنزل جثته من الصلب فصلى عليها في جماعة أصحابه وأظهر أهل خراسان النياحة عليه سبعة أيام {cite:muruj-al-dhahab p. 200}، وعند المسعودي لما رد يقطيناً عن الخزائن قال أؤتمن على الدماء ولا أؤتمن على الأموال، ولما قال له الجريري طلبت بثأر قوم ثم نقضت بيعتهم أراد الرجوع فنهاه مالك بن الهيثم فقال له لقد بليت بإبليس وما بليت بمثل هذا {cite:muruj-al-dhahab p. 279-280}. وعند طقّوش اختاره الإمام إبراهيم بن محمد بعد أن اعتذر سليمان بن كثير الخزاعي نقيب النقباء وإبراهيم بن سلمة عن قيادة الدعوة، فقلّده الأمر ممثلاً له في خراسان؛ ومزج أبو مسلم بين السياسة والقوة العسكرية فأبقى على العداء بين نصر بن سيار وخصومه وتعاون مع جديع الكرماني وشيبان الحروري ثم تخلص منهم جميعاً وتفرد بحكم خراسان واتخذ لنفسه لقب أمير آل محمد {cite:tarikh-dawla-abbasiyya-taqqush p. 23-26}"
  en: "He entered Merv in Jumada II of 130 AH and was given the oath of allegiance there {cite:tabari-tarikh-abu-al-fadl j.7 p.377}, and he was killed in 137 AH {cite:tabari-tarikh-abu-al-fadl j.7 p.479}. According to al-Mas'udi, Salm ibn Ahwaz, the killer of Yahya ibn Zayd, was killed; his body was taken down from the cross and prayed over by a company of his companions, and the people of Khurasan showed mourning for him for seven days {cite:muruj-al-dhahab p. 200}. Also according to al-Mas'udi, when he turned Yaqtin back from the treasuries he said: 'I am trusted with blood, but I am not trusted with wealth'; and when al-Jurayri said to him, 'You sought vengeance for one people and then broke the pledge to them', he wished to return, but Malik ibn al-Haytham forbade him, and he said to him: 'I have been tried by Iblis, and I have not been tried by the like of this' {cite:muruj-al-dhahab p. 279-280}. According to Taqqush, Imam Ibrahim ibn Muhammad chose him, after Sulayman ibn Kathir al-Khuza'i, chief of chiefs (naqib al-nuqaba'), and Ibrahim ibn Salama had excused themselves from leading the da'wa; he entrusted him with the command as his representative in Khurasan. Abu Muslim combined politics with military force: he kept alive the enmity between Nasr ibn Sayyar and his rivals, and cooperated with Jadi' al-Kirmani and Shayban al-Haruri, then rid himself of all of them and became sole ruler of Khurasan, taking for himself the title Amir of the House of Muhammad {cite:tarikh-dawla-abbasiyya-taqqush p. 23-26}"
  fr: "Il entra à Merv en jumada II de l'an 130 H et y reçut le serment d'allégeance {cite:tabari-tarikh-abu-al-fadl j.7 p.377}, et il fut tué en 137 H {cite:tabari-tarikh-abu-al-fadl j.7 p.479}. Selon al-Mas'udi, Salm ibn Ahwaz, le meurtrier de Yahya ibn Zayd, fut tué ; le corps de Yahya fut descendu de la croix et une troupe de ses compagnons pria sur lui, et les gens du Khurasan prirent le deuil pour lui sept jours {cite:muruj-al-dhahab p. 200}. Toujours selon al-Mas'udi, quand il refusa à Yaqtin l'accès aux trésors, il dit : « On me confie le sang, mais on ne me confie pas l'argent » ; et quand al-Jurayri lui dit : « Tu as cherché vengeance pour un peuple puis tu as rompu ton engagement envers lui », il voulut revenir, mais Malik ibn al-Haytham l'en empêcha, et il lui dit : « J'ai été éprouvé par Iblis, et je n'ai jamais été éprouvé par rien de pareil » {cite:muruj-al-dhahab p. 279-280}. Selon Taqqush, l'imam Ibrahim ibn Muhammad le choisit après que Sulayman ibn Kathir al-Khuza'i, chef des chefs (naqib al-nuqaba'), et Ibrahim ibn Salama se furent excusés de diriger la da'wa ; il lui confia le commandement comme son représentant au Khurasan. Abu Muslim allia la politique à la force militaire : il entretint l'hostilité entre Nasr ibn Sayyar et ses rivaux, coopéra avec Jadi' al-Kirmani et Shayban al-Haruri, puis se débarrassa d'eux tous et devint seul maître du Khurasan, prenant pour lui le titre d'émir de la Maison de Muhammad {cite:tarikh-dawla-abbasiyya-taqqush p. 23-26}"
  es: "Entró en Merv en Jumada II de 130 AH y prestó juramento de lealtad allí {cite:tabari-tarikh-abu-al-fadl j.7 p.377}, y fue asesinado en 137 AH {cite:tabari-tarikh-abu-al-fadl j.7 p.479}. Según al-Mas'udi, Salm ibn Ahwaz, el asesino de Yahya ibn Zayd, fue asesinado; su cuerpo fue bajado de la cruz y orado por una compañía de sus compañeros, y la gente de Jorasán mostró luto por él durante siete días {cite:muruj-al-dhahab p. 200}. También según al-Mas'udi, cuando hizo que Yaqtin se alejara de los tesoros dijo: 'Se me confía la sangre, pero no se me confía la riqueza'; y cuando al-Jurayri le dijo: 'Buscaste venganza por un pueblo y luego rompiste la promesa que les hiciste', quiso regresar, pero Malik ibn al-Haytham se lo prohibió y le dijo: 'He sido probado por Iblis, y no he sido probado por alguien como este' {cite:muruj-al-dhahab p. 279-280}. Según Taqqush, el Imam Ibrahim ibn Muhammad lo eligió, después de que Sulayman ibn Kathir al-Khuza'i, jefe de jefes (naqib al-nuqaba'), e Ibrahim ibn Salama se hubieran excusado de dirigir la da'wa; le confió el mando como su representante en Jorasán. Abu Muslim combinó la política con la fuerza militar: mantuvo viva la enemistad entre Nasr ibn Sayyar y sus rivales, y cooperó con Jadi' al-Kirmani y Shayban al-Haruri, para luego deshacerse de todos ellos y convertirse en el único gobernante de Jorasán, asumiendo el título de Emir de la Casa de Muhammad {cite:tarikh-dawla-abbasiyya-taqqush p. 23-26}."
  ur: "وہ 130 ہجری جمادی الثانی میں مرو میں داخل ہوئے اور وہاں آپ کو بیعت کی گئی {حوالہ:طبری تاریخ ابو الفضل ج.7 ص377}، اور آپ 137ھ میں قتل ہوئے۔ المسعودی کے مطابق، یحییٰ بن زید کا قاتل سالم بن احواز مارا گیا۔ اس کی لاش کو صلیب سے اتارا گیا اور اس کے ساتھیوں کی ایک جماعت نے اس پر دعا کی اور خراسان کے لوگوں نے سات دن تک اس پر سوگ منایا۔ 200}۔ نیز المسعودی کے مطابق، جب اس نے یقطین کو خزانوں سے واپس کیا تو اس نے کہا: 'میرے پاس خون کے اعتبار سے امانت ہے، لیکن مال کے اعتبار سے میرا بھروسہ نہیں ہے۔' اور جب الجریری نے اس سے کہا کہ تم نے ایک قوم کا بدلہ لیا اور پھر ان سے عہد توڑ دیا، تو اس نے واپس آنا چاہا، لیکن مالک بن الہیثم نے اسے منع کیا، اور اس سے کہا: مجھے ابلیس نے آزمایا ہے اور مجھے اس طرح آزمایا نہیں گیا ہے۔ 279-280}۔ تقوش کے مطابق، امام ابراہیم بن محمد نے انہیں سلیمان بن کثیر الخزاعی، سرداروں کے سردار ⁦(نقیب النقبہ)⁩ کے بعد منتخب کیا، اور ابراہیم بن سلامہ نے دعوت کی امامت سے معذرت کر لی تھی۔ اس نے اسے خراسان میں اپنے نمائندے کے طور پر کمان سونپی۔ ابو مسلم نے سیاست کو عسکری قوت کے ساتھ جوڑ دیا: اس نے نصر بن سیار اور اس کے حریفوں کے درمیان دشمنی کو زندہ رکھا اور جدی الکرمانی اور شیبان الحروری کے ساتھ تعاون کیا، پھر ان سب سے جان چھڑائی اور خراسان کا واحد حکمران بن گیا، اپنے لیے ایوانِ محمدی کا امیر کہلایا۔ 23-26}"
