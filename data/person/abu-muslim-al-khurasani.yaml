    ar: "دخل أبو مسلم مرو في جمادى الآخرة سنة ١٣٠هـ فبويع بها للعباسيين، وقُتل سنة ١٣٧هـ — الرجل الذي أطلق من خراسان الدعوة التي قلبت الدولة."
    en: "Abu Muslim entered Merv in Jumada II of 130 AH and took its pledge for the Abbasids; killed in 137, he was the man whose Khurasan call overturned the state."
