summary:
  ar: "أبو كبير الهذلي، شاعر جاهلي من قبيلة هذيل، ثاني أشعرها بعد أبي ذؤيب، من بني سعد، واشتهر بكنيته، والموسوعة تتحفظ على حكاية زواجه من أم طعابطة شرًا. {cite:encyclopaedia-of-islam-2 vol. 1 p. 149}"
  en: "Abu Kabir al-Hudhali, a pre-Islamic poet of the Hudhayl, the second greatest poet of his tribe after Abu Dhu'ayb, known by his kunya, who flourished in the second half of the sixth and the early seventh century. {cite:encyclopaedia-of-islam-2 vol. 1 p. 149}"
  ur: "ابو کبیر الہذلی، قبیلہ ہذیل کے قبل از اسلام کے شاعر، ابو ذؤیب کے بعد اپنے قبیلے کے دوسرے بڑے شاعر، جو اپنی کنیت سے مشہور تھے، اور چھٹی صدی کے دوسرے نصف اور ساتویں صدی کے آغاز میں تھے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 149}"
