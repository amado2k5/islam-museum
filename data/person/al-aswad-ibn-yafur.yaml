summary:
  ar: "شاعر جاهلي من أهل نجران، صاحب القصيدة المشهورة في رثاء آل محرق التي مطلعها «ما ذا أومل بعد آل محرق تركوا منازلهم وبعد إياد»، وفيها ذكر أهل الخورنق والسدير ومأرب وقصر سنداد {cite:umari-masalik-1924 p. 229}."
  en: "A jahili poet of Najran, author of the celebrated elegy for the house of Muharriq opening 'what can I hope for after the house of Muharriq left their dwellings, and after Iyad', in which he named the folk of al-Khawarnaq, al-Sadir, Marib and the palace of Sindad {cite:umari-masalik-1924 p. 229}."
