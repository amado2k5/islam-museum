class: person
label: { ar: "الأسود بن يعفر", en: "al-Aswad ibn Ya'fur", fr: "Al-Aswad ibn Ya’fur", es: "al-Aswad ibn Ya'fur", ur: "اسود بن یعفور" }
summary:
  ar: "شاعر جاهلي من أهل نجران، صاحب القصيدة المشهورة في رثاء آل محرق التي مطلعها «ما ذا أومل بعد آل محرق تركوا منازلهم وبعد إياد»، وفيها ذكر أهل الخورنق والسدير ومأرب وقصر سنداد {cite:umari-masalik-1924 p. 229}."
  en: "A jahili poet of Najran, author of the celebrated elegy for the house of Muharriq opening 'what can I hope for after the house of Muharriq left their dwellings, and after Iyad', in which he named the folk of al-Khawarnaq, al-Sadir, Marib and the palace of Sindad {cite:umari-masalik-1924 p. 229}."
  fr: "Poète de la jahiliyya originaire de Najran, auteur de la célèbre élégie sur la maison de Muharriq s’ouvrant sur « que puis-je espérer après que la maison de Muharriq a quitté ses demeures, et après Iyad », où il nomma les gens d’al-Khawarnaq, d’al-Sadir, de Marib et du palais de Sindad {cite:umari-masalik-1924 p. 229}."
  es: "Un poeta jahili de Najran, autor de la célebre elegía a la casa de Muharriq que comienza con \"¿qué puedo esperar después de que la casa de Muharriq abandonara sus moradas, y después de Iyad?\", en la que nombró a la gente de al-Khawarnaq, al-Sadir, Marib y el palacio de Sindad {cite:umari-masalik-1924 p. 229}."
  ur: "نجران کے ایک جاہلی شاعر، محررق کے گھر کے لیے مشہور افسانہ کے مصنف نے \"محرق کے گھر کے گھر چھوڑنے کے بعد، اور عیاد کے بعد میں کیا امید رکھ سکتا ہوں\"، جس میں اس نے الخوارنق، الصدیر، ماریب اور سنداد کے محل کا نام دیا ہے۔ 229}۔"
