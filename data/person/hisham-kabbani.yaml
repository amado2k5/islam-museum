summary:
  ar: "عالم وشيخ صوفي لبناني أمريكي ⁦(28 يناير 1945 – 4 ديسمبر 2024)⁩، من أعلام الطريقة النقشبندية الحقانية في الولايات المتحدة؛ وُلد في بيروت ودرس الكيمياء في الجامعة الأميركية فيها والفقه في دمشق، وتزوّج ابنة مرشد الطريقة محمد ناظم الحقاني وحمل إجازة منه بتدريسها، وانتقل إلى الولايات المتحدة سنة 1990 فأسّس المجلس الإسلامي الأعلى في أمريكا، واشتهر بتحذيره من التطرف وبفتاويه وكتبه الكثيرة."
  en: "Lebanese-American Sufi scholar and shaykh (28 January 1945 – 4 December 2024) of the Naqshbandi Haqqani order in the United States. Born in Beirut, he studied chemistry at the American University of Beirut and fiqh in Damascus, married the daughter of the order's guide Nazim Al-Haqqani and holds his ijaza to teach the order, moved to the United States in 1990 and founded the Islamic Supreme Council of America; he was known for his warnings against violent extremism, his fatwas and his many books."
  ur: "لبنانی-امریکی صوفی عالم و شیخ ⁦(28 جنوری 1945 – 4 دسمبر 2024)⁩، امریکا میں نقشبندی حقانی سلسلے کی نمایاں شخصیت؛ بیروت میں پیدا ہوئے، امریکی یونیورسٹی بیروت سے کیمسٹری اور دمشق سے فقہ پڑھی، شیخ ناظم الحقانی کی صاحبزادی سے شادی کی اور ان سے سلسلے کی تدریس کی اجازت پائی، 1990 میں امریکا منتقل ہو کر مجلسِ اعلیٰ اسلامی قائم کی۔"
  es: "Erudito sufí y jeque libanés-estadounidense (28 de enero de 1945 - 4 de diciembre de 2024) de la orden Naqshbandi Haqqani en los Estados Unidos. Nacido en Beirut, estudió química en la Universidad Americana de Beirut y fiqh en Damasco, se casó con la hija del guía de la orden, Nazim Al-Haqqani, y posee la ijaza para enseñar la orden. Se mudó a los Estados Unidos en 1990 y fundó el Consejo Supremo Islámico de América; fue conocido por sus advertencias contra el extremismo violento, sus fatuas y sus numerosos libros."
  fr: "Érudit soufi et cheikh libano-américain (28 janvier 1945 – 4 décembre 2024) de l'ordre Naqshbandi Haqqani aux États-Unis. Né à Beyrouth, il étudia la chimie à l'Université américaine de Beyrouth et le fiqh à Damas. Il épousa la fille du guide spirituel de l'ordre, Nazim Al-Haqqani, et détenait l'ijaza pour enseigner au sein de cet ordre. Il s'installa aux États-Unis en 1990 et fonda le Conseil suprême islamique d'Amérique. Il était connu pour ses mises en garde contre l'extrémisme violent, ses fatwas et ses nombreux ouvrages."
  tr: "Lübnanlı-Amerikalı bir Sufi alimi ve şeyhi (28 Ocak 1945 – 4 Aralık 2024), Amerika Birleşik Devletleri'ndeki Nakşibendi Haqqani tarikatının önde gelen isimlerinden biridir; Beyrut doğumlu olan Leo, oradaki Amerikan Üniversitesi'nde kimya ve Şam'da fıkıh eğitimi aldı. Sufi rehber Muhammed Nazim el-Haqqani'nin kızıyla evlendi ve bu eğitimi vermek için ondan lisans aldı. 1990 yılında Amerika Birleşik Devletleri'ne taşındı ve Amerika'da Yüksek İslam Konseyi'ni kurdu; aşırılığa karşı uyarıları, sayısız fetva ve kitabı ile ünlendi."
  id: "Seorang ulama Sufi Lebanon-Amerika dan sheikh (28 Januari 1945 – 4 Desember 2024), salah satu tokoh terkemuka dari ordo Naqshbandi Haqqani di Amerika Serikat; lahir di Beirut, ia belajar kimia di American University di sana dan ilmu hukum di Damaskus. Ia menikahi putri pembimbing Sufi Muhammad Nazim al-Haqqani dan memiliki izin darinya untuk mengajarkannya. Ia pindah ke Amerika Serikat pada tahun 1990 dan mendirikan Supreme Islamic Council di Amerika, menjadi terkenal karena memperingatkan terhadap ekstremisme serta banyak fatwa dan bukunya."
