summary:
  ar: "عالم وشيخ صوفي لبناني أمريكي (28 يناير 1945 – 4 ديسمبر 2024)، من أعلام الطريقة النقشبندية الحقانية في الولايات المتحدة؛ وُلد في بيروت ودرس الكيمياء في الجامعة الأميركية فيها والفقه في دمشق، وتزوّج ابنة مرشد الطريقة محمد ناظم الحقاني وحمل إجازة منه بتدريسها، وانتقل إلى الولايات المتحدة سنة 1990 فأسّس المجلس الإسلامي الأعلى في أمريكا، واشتهر بتحذيره من التطرف وبفتاويه وكتبه الكثيرة."
  en: "Lebanese-American Sufi scholar and shaykh (28 January 1945 – 4 December 2024) of the Naqshbandi Haqqani order in the United States. Born in Beirut, he studied chemistry at the American University of Beirut and fiqh in Damascus, married the daughter of the order's guide Nazim Al-Haqqani and holds his ijaza to teach the order, moved to the United States in 1990 and founded the Islamic Supreme Council of America; he was known for his warnings against violent extremism, his fatwas and his many books."
  ur: "لبنانی-امریکی صوفی عالم و شیخ (28 جنوری 1945 – 4 دسمبر 2024)، امریکا میں نقشبندی حقانی سلسلے کی نمایاں شخصیت؛ بیروت میں پیدا ہوئے، امریکی یونیورسٹی بیروت سے کیمسٹری اور دمشق سے فقہ پڑھی، شیخ ناظم الحقانی کی صاحبزادی سے شادی کی اور ان سے سلسلے کی تدریس کی اجازت پائی، 1990 میں امریکا منتقل ہو کر مجلسِ اعلیٰ اسلامی قائم کی۔"
