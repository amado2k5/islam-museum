summary:
  ar: "هينا جيلاني (وُلدت في 19 ديسمبر 1953) محامية في المحكمة العليا الباكستانية وناشطة حقوق إنسان من لاهور، شاركت في تأسيس أول مكتب محاماة نسائي ومركز مساعدة قانونية في باكستان مع أختها أسماء جهانجير، وهي من مؤسسي لجنة حقوق الإنسان في باكستان ومنتدى العمل النسائي، وشغلت مناصب أممية رفيعة منها الممثلة الخاصة للأمين العام المعنية بالمدافعين عن حقوق الإنسان، وهي عضو في منظمة الشيوخ (The Elders)."
  en: "Hina Jilani (born 19 December 1953) is a Pakistani Supreme Court lawyer and human-rights advocate from Lahore who co-founded Pakistan's first all-women law firm and legal aid centre with her sister Asma Jahangir, is a founder of the Human Rights Commission of Pakistan and the Women's Action Forum, served as the UN Secretary-General's Special Representative on human rights defenders, and is a member of The Elders."
  ur: "حنا جیلانی (پیدائش 19 دسمبر 1953ء) لاہور سے تعلق رکھنے والی پاکستانی سپریم کورٹ کی وکیل اور انسانی حقوق کی فعالیت پسند ہیں جنھوں نے اپنی بہن عاصمہ جہانگیر کے ساتھ پاکستان کی پہلی خواتین لا فرم اور لیگل ایڈ مرکز کی مشترکہ بنیاد رکھی، وہ انسانی حقوق کمیشن آف پاکستان اور ویمن ایکشن فورم کی بانیوں میں سے ہیں، اقوام متحدہ کے سیکرٹری جنرل کی خصوصی نمائندہ برائے انسانی حقوق کے محافظین رہیں، اور دی ایلڈرز کی رکن ہیں۔"
