summary:
  ar: "معالجة أمريكية مرخّصة في علاج الزواج والأسرة، وصاحبة عيادة «سكينة كاونسلنغ» في مقاطعة أورانج بكاليفورنيا الموجهة للمجتمع المسلم؛ تُدرّس التربية الإسلامية من خلال منهج الانضباط الإيجابي الذي تحمل فيه صفة مدرّبة قيادية معتمدة، وشاركت في تأليف كتاب «التربية الإيجابية في البيت المسلم» (2017)، وتنشر ورشها ومحاضراتها عبر قناة عيادتها على يوتيوب."
  en: "American licensed marriage and family therapist and the practitioner behind Sakina Counseling, a private practice in Orange County, California serving the Muslim community. She teaches Islamic parenting through Positive Discipline, in which she is a certified lead trainer, co-authored Positive Parenting in the Muslim Home (2017), and publishes her workshops and talks on her practice's YouTube channel."
  ur: "امریکی مرخص شادی و خاندانی معالجہ اور مقاطعہ اورنج، کیلیفورنیا میں مسلم کمیونٹی کی خدمت کرنے والی نجی عيادت «سکینہ کاؤنسلنگ» کی صاحبہ؛ وہ مثبت نظم و ضبط (پازیٹو ڈسپلن) کے ذریعے اسلامی تربیت پڑھاتی ہیں جس میں وہ مصدقہ لیڈ ٹرینر ہیں، انہوں نے کتاب «پازیٹو پیرنٹنگ ان دی مسلم ہوم» (2017) کی تصنیف میں حصہ لیا، اور اپنی ورکشاپس اور تقاریر اپنی عيادت کے یوٹیوب چینل پر شائع کرتی ہیں۔"
