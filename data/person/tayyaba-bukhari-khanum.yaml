summary:
  ar: "عالمة دين باكستانية من قلة من النساء في التدريس الديني، وُلدت في 15 أغسطس 1974 في فيصل آباد، ودرست منذ سنة 1984 في قم بإيران ثم واصلت دراستها في باكستان. تجيد ست لغات وتخطب في المجالس والقنوات، وأسست مؤسسة بخاري الإغاثية لمساعدة متضرري الكوارث."
  en: "Pakistani religious scholar, one of very few women in religious teaching, born on 15 August 1974 in Faisalabad; she studied in Qom, Iran, from 1984 and continued her studies in Pakistan. A speaker in six languages on platforms and television, she founded the Bukhari Relief Foundation to aid people displaced by natural disasters."
  ur: "پاکستانی مذہبی عالمہ جو دینی تدریس میں چند خواتین میں شمار ہوتی ہیں، 15 اگست 1974 کو فیصل آباد میں پیدا ہوئیں؛ 1984 سے ایران کے شہر قم میں تعلیم پائی اور پھر پاکستان میں جاری رکھی۔ وہ چھ زبانوں میں خطبہ اور تقریر کرتی ہیں اور قدرتی آفات کے متاثرین کے لیے بخاری ریلیف فاؤنڈیشن قائم کی۔"
  es: "Erudita religiosa pakistaní, una de las pocas mujeres dedicadas a la enseñanza religiosa, nació el 15 de agosto de 1974 en Faisalabad. Estudió en Qom, Irán, a partir de 1984 y continuó sus estudios en Pakistán. Hablante en seis idiomas en diversos foros y en televisión, fundó la Fundación Bukhari Relief para ayudar a las personas desplazadas por desastres naturales."
  fr: "Érudite religieuse pakistanaise, l'une des rares femmes enseignant les religions, née le 15 août 1974 à Faisalabad, elle a étudié à Qom, en Iran, à partir de 1984, puis a poursuivi ses études au Pakistan. Intervenante en six langues à la télévision et sur diverses tribunes, elle a fondé la Fondation Bukhari pour venir en aide aux personnes déplacées par des catastrophes naturelles."
