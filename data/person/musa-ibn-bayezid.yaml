summary:
  ar: "الأمير موسى بن بايزيد الأول؛ أحد أبناء بايزيد الخمسة، أُسر مع أبيه في معركة أنقرة سنة ٨٠٤هـ/١٤٠٢م، ثم أطلقه تيمورلنك ليؤجج به نار الفتنة ويزيدها ضراءً وشدة، فأخذ يحرّض المتنازعين على القتال {cite:dawlat-uthmaniyya-salabi p. 70-71}. تسلّطن في الروملي وكان الشيخ بدر الدين قاضي عسكره، ويذكر صاحب الشقائق النعمانية أن أخاه محمداً قتله وحبس الشيخ بدر الدين مع أهله في أزنيق {cite:dawlat-uthmaniyya-salabi p. 74}."
  en: "Musa Çelebi, son of Bayezid I — captured with his father at Ankara in 804/1402, then released by Timur expressly 'to stoke the fire of strife' among the rival princes {cite:dawlat-uthmaniyya-salabi p. 70-71}. He established himself in Rumelia with Sheikh Badr al-Din as his qadi 'askar; the Shaqa'iq al-Nu'maniyya records that his brother Muhammad killed him and confined Badr al-Din at Iznik {cite:dawlat-uthmaniyya-salabi p. 74}."
