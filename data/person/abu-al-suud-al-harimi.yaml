summary:
  ar: "أبو السعود أحمد بن المبارك الزاهد الحرّمي؛ كان عطاراً فأقامه الله فانقطع إلى الله وصحب الشيخ عبد القادر الجيلاني وله كرامات، وكان لا يأكل حتى يُطعم ولا يشرب حتى يُسقى ولا يلبس ثوباً حتى يُجعل في عنقه ولا يتكلم إلا جواباً ولا يزال على طهارة مستقبل القبلة؛ وقع عليه سقف فجاء جذع فكسر رؤوس أضلاعه فلم يتحرك حتى جاء أصحابه فأزالوا السقف عنه، فأقام عشرين سنة لا يعلم أحد أن أضلاعه مكسورة حتى مات فوجدوها على المغتسل مكسورة؛ توفي سنة اثنتين وثمانين وخمسمائة {cite:shadharat-dhahab p. 754}."
  en: "Abu al-Su'ud Ahmad b. al-Mubarak the ascetic of the Haram; a druggist till God set him aright — he cut himself off to God and kept the company of Abd al-Qadir al-Jilani, and marvels are told of him. He would not eat till fed, drink till given drink, wear a garment till it was put round his neck, nor speak but in answer, keeping always to purity and facing the qibla. A roof fell on him and a beam broke the heads of his ribs, yet he did not stir till his companions lifted it off; he lived twenty more years with no one knowing his ribs were broken — they found them so on the washing slab. He died in 582 {cite:shadharat-dhahab p. 754}."
