summary:
  ar: "سباع الموصلي، له الحظ النفيس في التمتع برياض التأنيس، سأله مضاء بن عيسى عن المآل الذي يفضي إليه الزهد، فأجاب بأنه يفضي إلى الأنس بالله."
  en: "Sabba' al-Mawsili, who enjoyed the gardens of intimacy; Mada' ibn Isa asked him where asceticism leads, and he answered that it leads to intimacy with God."
  ur: "سباع موصلی انس کے باغوں سے بھرپور لطف اٹھانے والے تھے۔ مضاء بن عیسیٰ نے ان سے پوچھا کہ زہد کس چیز کی طرف لے جاتا ہے، تو انہوں نے کہا کہ اللہ کے انس کی طرف۔"
  es: "Sabba' al-Mawsili, que disfrutaba de los jardines de la intimidad, se encontró con Mada' ibn Isa, a quien le preguntó adónde conducía el ascetismo, y él respondió que conducía a la intimidad con Dios."
  fr: "Sabba' al-Mawsili, qui appréciait les jardins de l'intimité, Mada' ibn Isa lui demanda où menait l'ascétisme, et il répondit qu'il menait à l'intimité avec Dieu."
  tr: "Siba' al-Mawsili, yakınlık bahçelerinin tadını çıkarma şansına sahipti. Mudha ibn İsa ona, münzeviliğin sonucunu sordu ve o da bunun Tanrı ile yakınlığa yol açtığını söyledi."
  id: "Siba' al-Mawsili memiliki keberuntungan berharga untuk menikmati taman keintiman. Mudha ibn Isa menanyakan kepadanya tentang hasil yang ditimbulkan oleh asketisme, dan ia menjawab bahwa hal itu membawa pada keintiman dengan Tuhan."
