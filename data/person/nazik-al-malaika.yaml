summary:
  ar: "نازك الملائكة ⁦(1923–2007)⁩ شاعرة وناقدة عراقية، رائدة حركة الشعر الحر في العربية مع بدر شاكر السياب، وصاحبة «قضايا الشعر المعاصر». من دواوينها «عاشقة الليل» و«شظايا ورماد» وقصيدتها الشهيرة «الكوليرا»."
  en: "Nazik al-Malaika (1923–2007) was an Iraqi poet and literary critic, co-pioneer with Badr Shakir al-Sayyab of the free verse movement in Arabic, and author of Issues of Contemporary Poetry. Her collections include 'Ashiqat al-Layl and Shazaya wa Ramad, and her famous poem 'Cholera'."
  ur: "نازک ملائکہ ⁦(1923–2007)⁩ عراقی شاعرہ اور ادبی ناقد تھیں، بدر شاکر سیاب کے ساتھ عربی آزاد نظم کی تحریک کی راہنما اور «قضايا الشعر المعاصر» کی مصنفہ۔ مجموعوں میں «عاشقة الليل» اور «شظايا ورماد» اور مشہور نظم «الكوليرا» شامل ہیں۔"
