summary:
  ar: "نازك الملائكة ⁦(1923–2007)⁩ شاعرة وناقدة عراقية، رائدة حركة الشعر الحر في العربية مع بدر شاكر السياب، وصاحبة «قضايا الشعر المعاصر». من دواوينها «عاشقة الليل» و«شظايا ورماد» وقصيدتها الشهيرة «الكوليرا»."
  en: "Nazik al-Malaika (1923–2007) was an Iraqi poet and literary critic, co-pioneer with Badr Shakir al-Sayyab of the free verse movement in Arabic, and author of Issues of Contemporary Poetry. Her collections include 'Ashiqat al-Layl and Shazaya wa Ramad, and her famous poem 'Cholera'."
  ur: "نازک ملائکہ ⁦(1923–2007)⁩ عراقی شاعرہ اور ادبی ناقد تھیں، بدر شاکر سیاب کے ساتھ عربی آزاد نظم کی تحریک کی راہنما اور «قضايا الشعر المعاصر» کی مصنفہ۔ مجموعوں میں «عاشقة الليل» اور «شظايا ورماد» اور مشہور نظم «الكوليرا» شامل ہیں۔"
  es: "Nazik al-Malaika (1923-2007) fue una poeta y crítica literaria iraquí, cofundadora, junto con Badr Shakir al-Sayyab, del movimiento del verso libre en árabe, y autora de *Temas de poesía contemporánea*. Entre sus colecciones destacan *Ashiqat al-Layl* y *Shazaya wa Ramad*, así como su famoso poema *Cholera*."
  fr: "Nazik al-Malaika (1923-2007) était une poétesse et critique littéraire irakienne, co-pionnière avec Badr Shakir al-Sayyab du mouvement du vers libre en arabe, et auteure de « Issues of Contemporary Poetry ». Parmi ses recueils figurent « Ashiqat al-Layl » et « Shazaya wa Ramad », ainsi que son célèbre poème « Cholera »."
  tr: "Nazik Al-Malaika (1923–2007), Iraklı bir şair ve eleştirmen, Badr Shakir Al-Sayyab ile Arapça özgür şiir hareketinin öncüsü ve \"Çağdaş Şiir Meseleleri\" adlı kitabın yazarıydı. Koleksiyonları arasında \"Gecenin Aşığı\", \"Kırıklar ve Küller\" ve ünlü şiiri \"Kolera\" bulunmaktadır."
  id: "Nazik Al-Malaika (1923–2007) adalah seorang penyair dan kritikus Irak, pelopor gerakan puisi bebas dalam bahasa Arab bersama Badr Shakir Al-Sayyab, dan penulis \"Issues of Contemporary Poetry.\" Di antara koleksinya adalah \"Lover of the Night,\" \"Shards and Ashes,\" dan puisinya yang terkenal \"Cholera.\""
