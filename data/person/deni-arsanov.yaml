summary:
  ar: "ديني أرسانوف (1851–1917)، شيخ صوفي شيشاني، مؤسس أحد أكبر الإخوانيات الويناخية (الوِرد) المنتمية إلى التيار النقشبندي؛ بنى مدرسة عربية في غروزني سنة 1904، وكان من أبرز مندوبي رجال الدين في مؤتمرات الشيشان سنة 1917، وقُتل مع أكثر من ثلاثين من مريديه في غروزني في 27 ديسمبر 1917 أثناء مهمة صلحية خلال الاشتباكات بين القوزاق والشيشان."
  en: "Deni Arsanov (1851–1917) was a Chechen Sufi sheikh, founder of one of the largest Vainakh brotherhoods (virds), belonging to the Naqshbandi current. He built an Arabic school at Grozny in 1904, was a leading clerical delegate at the Chechen congresses of 1917, and was killed with more than thirty of his murids at Grozny on 27 December 1917 while on a peacemaking mission during Cossack–Chechen clashes."
  ur: "دینی ارسانوف (1851–1917) چیچن صوفی شیخ تھے، جو نقشبندی سلسلے سے منسوب سب سے بڑی ویناخ برادریوں (وردوں) میں سے ایک کے بانی تھے۔ انہوں نے 1904 میں گروزنی میں ایک عربی اسکول بنایا، 1917 کی چیچن کانگریسوں میں نمایاں مذہبی مندوب رہے، اور 27 دسمبر 1917 کو قزاق-چیچن جھڑپوں کے دوران امن مشن پر گروزنی میں اپنے تیس سے زائد مریدوں سمیت قتل کیے گئے۔"
