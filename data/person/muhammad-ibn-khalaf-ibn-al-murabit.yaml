  ur: "ابن المربت ⁦(محمد ابن خلف)⁩"
summary:
  ar: "محمد بن خلف بن سعيد بن وهب، أبو عبد الله، الأندلسي المرّي، المعروف بابن المرابط، فقيه مالكي ومفتي مدينة المرية وقاضيها، كان من أهل الرواية والفهم. أجاز له أبو عمر الطلمنكي وأبو عمرو الداني، وسمع من أبي القاسم المهلب بن أبي صفرة وأبي الوليد بن مقبل، وارتحل إليه الناس، وأخذ عنه أبو عبد الله التميمي وأبو علي بن سكرة وأبو محمد السبتي. من تصانيفه شرح كبير على صحيح البخاري، وتعليقة على المدونة، وكتاب الوصول إلى الغرض المطلوب. توفي سنة 485 هـ على ما أثبته العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  en: "Muhammad ibn Khalaf ibn Sa'id ibn Wahb, Abu Abd Allah, of al-Mariyya in al-Andalus, known as Ibn al-Murabit, a Maliki jurist who was mufti and judge of Almeria, and a scholar of transmission and understanding. Abu Umar al-Talamanki and Abu Amr al-Dani gave him licences to transmit, and he heard from Abu al-Qasim al-Muhallab ibn Abi Sufra and Abu al-Walid ibn Muqbil. People travelled to him, and his students included Abu Abd Allah al-Tamimi, Abu Ali ibn Sakara and Abu Muhammad al-Sabti. His works include a large commentary on Sahih al-Bukhari, a gloss on al-Mudawwana and al-Wusul ila al-gharad. The header gives 485 AH as his death year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  es: "Muhammad ibn Khalaf ibn Sa'id ibn Wahb, Abu Abd Allah, de al-Mariyya en al-Ándalus, conocido como Ibn al-Murabit, fue un jurista malikí, muftí y juez de Almería, y un erudito en transmisión y comprensión de textos sagrados. Abu Umar al-Talamanki y Abu Amr al-Dani le otorgaron licencias para transmitir, y recibió enseñanzas de Abu al-Qasim al-Muhallab ibn Abi Sufra y Abu al-Walid ibn Muqbil. Numerosos discípulos viajaban para visitarlo, y entre ellos se encontraban Abu Abd Allah al-Tamimi, Abu Ali ibn Sakara y Abu Muhammad al-Sabti. Sus obras incluyen un extenso comentario sobre Sahih al-Bukhari, una glosa sobre al-Mudawwana y al-Wusul ila al-gharad. El encabezado indica el año 485 de la Hégira como su año de fallecimiento. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  fr: "Muhammad ibn Khalaf ibn Sa'id ibn Wahb, dit Abu Abd Allah, d'al-Mariyya en al-Andalus, connu sous le nom d'Ibn al-Murabit, était un juriste malikite, mufti et juge d'Almeria, et un érudit reconnu pour son enseignement et sa capacité à transmettre le savoir. Il reçut l'autorisation de transmettre le savoir d'Abu Umar al-Talamanki et d'Abu Amr al-Dani, et fut l'élève d'Abu al-Qasim al-Muhallab ibn Abi Sufra et d'Abu al-Walid ibn Muqbil. De nombreux érudits venaient le consulter, et parmi ses élèves figuraient Abu Abd Allah al-Tamimi, Abu Ali ibn Sakara et Abu Muhammad al-Sabti. Son œuvre comprend un important commentaire du Sahih al-Bukhari, une glose sur al-Mudawwana et al-Wusul ila al-gharad. La notice biographique indique l'an 485 de l'Hégire comme année de son décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  ur: "محمد بن خلف بن سعید بن وھب، ابو عبد اللہ، المریہ، الاندلس میں، ابن المربیت کے نام سے جانا جاتا ہے، ایک مالکی فقیہ جو المیریا کا مفتی اور قاضی تھا، اور ترسیل و تفہیم کا عالم تھا۔ ابو عمر التلمانکی اور ابو عمرو الدانی نے اسے ترسیل کا لائسنس دیا، اور اس نے ابو القاسم المحلب ابن ابی صفرا اور ابو الولید ابن مقبل سے سنا۔ لوگ ان کے پاس جاتے تھے، اور ان کے شاگردوں میں ابو عبد اللہ التمیمی، ابو علی ابن سقرہ اور ابو محمد السبطی شامل تھے۔ ان کی تصانیف میں صحیح البخاری کی ایک بڑی تفسیر، المدوانہ اور الوصول الغراد پر ایک تالیف شامل ہے۔ سرخی 485ھ کو ان کی وفات کا سال بتاتی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 15810}"
  tr: "Muhammed bin Halef ibn Sa'id ibn Wahb, El-Merri'nin Endülüslüsü, İbn el-Murabit olarak bilinen, Maliki hukukçusu, Almeriya şehrinin müftüsü ve yargıcı Ebu Abdullah, anlatıcı ve anlayışlı bir insandı. Ebu Ömer el-Telimanki ve Ebu Amr el-Dani ona yetki verdi ve Ebu el-Kasım el-Muhallab bin Ebi Sufra ile Ebu el-Velid bin Mukbil'den dinledi. İnsanlar ona yolculuk etti ve Ebu Abdullah el-Tamimi, Ebu Ali ibn Sukra ve Ebu Muhammed el-Sabti onun yanında eğitim aldı. Eserleri arasında Sahih al-Buhari üzerine önemli bir yorum, Mudavwana üzerine bir tefsir ve 'El-Usul ila el-Makd el-Mebbi' adlı kitap bulunmaktadır. Başlıkla doğrulandığı üzere, 485 Hicri yılında öldü. {alıntı:] fiqh-mawsua-kuwaitiyya-noor-v3 s.15810}"
  id: "Muhammad ibn Khalaf ibn Sa'id ibn Wahb, Abu Abdullah, orang Andalusia dari Al-Marri, dikenal sebagai Ibn al-Murabit, ahli hukum Maliki, mufti kota Almeria, dan hakimnya, adalah seorang yang pandai bercerita dan memahami dirinya. Abu Umar al-Talimanki dan Abu Amr al-Dani memberinya wewenang, dan ia mendengar dari Abu al-Qasim al-Muhallab ibn Abi Sufra dan Abu al-Walid ibn Muqbil. Orang-orang datang kepadanya, dan Abu Abdullah al-Tamimi, Abu Ali ibn Sukra, serta Abu Muhammad al-Sabti belajar di bawah bimbingannya. Di antara karyanya terdapat komentar utama tentang Sahih al-Bukhari, komentar atas Mudawwana, dan buku 'Al-Wusul ila al-Maqd al-Ma'bbi'. Ia meninggal pada tahun 485 H, sebagaimana dikonfirmasi oleh judulnya. {cite:Fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
