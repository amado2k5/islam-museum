label:
  ar: "ابن المرابط (محمد بن خلف)"
  en: "Ibn al-Murabit (Muhammad ibn Khalaf)"
summary:
  ar: "محمد بن خلف بن سعيد بن وهب، أبو عبد الله، الأندلسي المرّي، المعروف بابن المرابط، فقيه مالكي ومفتي مدينة المرية وقاضيها، كان من أهل الرواية والفهم. أجاز له أبو عمر الطلمنكي وأبو عمرو الداني، وسمع من أبي القاسم المهلب بن أبي صفرة وأبي الوليد بن مقبل، وارتحل إليه الناس، وأخذ عنه أبو عبد الله التميمي وأبو علي بن سكرة وأبو محمد السبتي. من تصانيفه شرح كبير على صحيح البخاري، وتعليقة على المدونة، وكتاب الوصول إلى الغرض المطلوب. توفي سنة 485 هـ على ما أثبته العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
  en: "Muhammad ibn Khalaf ibn Sa'id ibn Wahb, Abu Abd Allah, of al-Mariyya in al-Andalus, known as Ibn al-Murabit, a Maliki jurist who was mufti and judge of Almeria, and a scholar of transmission and understanding. Abu Umar al-Talamanki and Abu Amr al-Dani gave him licences to transmit, and he heard from Abu al-Qasim al-Muhallab ibn Abi Sufra and Abu al-Walid ibn Muqbil. People travelled to him, and his students included Abu Abd Allah al-Tamimi, Abu Ali ibn Sakara and Abu Muhammad al-Sabti. His works include a large commentary on Sahih al-Bukhari, a gloss on al-Mudawwana and al-Wusul ila al-gharad. The header gives 485 AH as his death year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15810}"
