summary:
  ar: "باحثة أمريكية من أصل مصري متخصصة في دراسة المجتمعات المسلمة، وُلدت في القاهرة وهاجرت إلى الولايات المتحدة في الرابعة من عمرها. ترأست مركز غالوب للدراسات الإسلامية (2006–2012)، وشاركت جون إسبوزيتو تأليف كتاب «من يتحدث باسم الإسلام؟ ما يفكر به مليار مسلم» (2008) المبني على أكثر من 50 ألف مقابلة، وعيّنها الرئيس أوباما مستشارة في مجلس الأديان بالبيت الأبيض، وتعمل مديرة للأبحاث في معهد السياسات الاجتماعية والتفاهم."
  en: "American researcher of Egyptian origin specialising in the study of Muslim communities, born in Cairo and brought to the United States at the age of four. She chaired the Gallup Center for Muslim Studies (2006–2012), co-authored with John Esposito the book Who Speaks for Islam? What a Billion Muslims Really Think (2008), based on more than 50,000 interviews, was appointed by President Obama as an advisor to the White House Office of Faith-Based and Neighborhood Partnerships, and is director of research at the Institute for Social Policy and Understanding (ISPU)."
  ur: "مصری نژاد امریکی محققہ جو مسلم معاشروں کے مطالعے کی ماہر ہیں، قاہرہ میں پیدا ہوئیں اور چار برس کی عمر میں امریکہ منتقل ہوئیں۔ انھوں نے گیلپ سینٹر فار مسلم اسٹڈیز کی سربراہی کی (2006ء–2012ء)، جان ایسپوزیٹو کے ساتھ کتاب «اسلام کی نمائندگی کون کرتا ہے؟» لکھی جو پچاس ہزار سے زائد انٹرویوز پر مبنی ہے، صدر اوباما نے انھیں وائٹ ہاؤس کے مشاورتی بورڈ میں شامل کیا، اور وہ انسٹی ٹیوٹ فار سوشل پالیسی اینڈ انڈراسٹینڈنگ میں ڈائریکٹر ریسرچ ہیں۔"
