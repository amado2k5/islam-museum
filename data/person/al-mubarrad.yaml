id: person/al-mubarrad
class: person
label: { ar: "المبرد", en: "al-Mubarrad" }
summary:
  ar: "محمد بن يزيد المبرد النحوي، قال للمسعودي حين سأله عن أبي تمام والبحتري أيهما أشعر لأبي تمام استخراجات لطيفة ومعان ظريفة وجيده أجود من شعر البحتري وشعر البحتري أحسن استواء لأنه يقول القصيدة كلها سليمة وأبو تمام يقول البيت النادر ويتبعه البيت السخيف فهو كغائص يخرج الدرة والمخشلبة فيجعلهما في نظام واحد، وبالبحتري يختم الشعر {cite:muruj-al-dhahab p. 458-459}. وعند المسعودي بعثه المتوكل إلى عامل البصرة في منازعة بينه وبين الفتح بن خاقان في تأويل آية فمر بدير هرقل فرأى مجنوناً بائناً عن المجانين فأنشده من شعره حتى قال له فتى معه ماتوا فسقط المجنون ميتاً فغسله المبرد وكفنه وصل عليه ودفنه {cite:muruj-al-dhahab p. 476-478}. وعند ابن الجوزي هو علي بن يزيد بن عبد الأكبر الأزدي الثمالي المعروف بالمبرد، له المعرفة التامة باللغة وكان في نحو البصريين آية، ولد سنة عشر ومائتين وقيل سنة ست ومائتين، وسُئل لم سُمّي المبرد {cite:muntazam-ibn-al-jawzi p. 297}."
  en: "The Basran grammarian whose verdict on Abu Tammam vs al-Buhturi — 'a diver who sets the pearl and the shell-shard in one string' — became the standard comparison {cite:muruj-al-dhahab p. 458-459}."
