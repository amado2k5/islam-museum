  ar: "محمد بن يزيد المبرد النحوي، قال للمسعودي حين سأله عن أبي تمام والبحتري أيهما أشعر لأبي تمام استخراجات لطيفة ومعان ظريفة وجيده أجود من شعر البحتري وشعر البحتري أحسن استواء لأنه يقول القصيدة كلها سليمة وأبو تمام يقول البيت النادر ويتبعه البيت السخيف فهو كغائص يخرج الدرة والمخشلبة فيجعلهما في نظام واحد، وبالبحتري يختم الشعر {cite:muruj-al-dhahab p. 458-459}."
