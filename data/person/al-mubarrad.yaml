label: { ar: "المبرد", en: "al-Mubarrad", fr: "al-Mubarrad", es: "al-Mubarrad", ur: "المبراد" }
summary:
  ar: "محمد بن يزيد المبرد النحوي، قال للمسعودي حين سأله عن أبي تمام والبحتري أيهما أشعر لأبي تمام استخراجات لطيفة ومعان ظريفة وجيده أجود من شعر البحتري وشعر البحتري أحسن استواء لأنه يقول القصيدة كلها سليمة وأبو تمام يقول البيت النادر ويتبعه البيت السخيف فهو كغائص يخرج الدرة والمخشلبة فيجعلهما في نظام واحد، وبالبحتري يختم الشعر {cite:muruj-al-dhahab p. 458-459}. وعند المسعودي بعثه المتوكل إلى عامل البصرة في منازعة بينه وبين الفتح بن خاقان في تأويل آية فمر بدير هرقل فرأى مجنوناً بائناً عن المجانين فأنشده من شعره حتى قال له فتى معه ماتوا فسقط المجنون ميتاً فغسله المبرد وكفنه وصل عليه ودفنه {cite:muruj-al-dhahab p. 476-478}. وعند ابن الجوزي هو علي بن يزيد بن عبد الأكبر الأزدي الثمالي المعروف بالمبرد، له المعرفة التامة باللغة وكان في نحو البصريين آية، ولد سنة عشر ومائتين وقيل سنة ست ومائتين، وسُئل لم سُمّي المبرد {cite:muntazam-ibn-al-jawzi p. 297}."
  en: "The Basran grammarian whose verdict on Abu Tammam vs al-Buhturi — 'a diver who sets the pearl and the shell-shard in one string' — became the standard comparison {cite:muruj-al-dhahab p. 458-459}."
  fr: "Le grammairien Basran dont le verdict sur Abu Tammam vs al-Buhturi - « un plongeur qui met la perle et la coquille-éclat dans une chaîne » - est devenu la comparaison standard {cite:muruj-al-dhahab p. 458-459}."
  es: "El gramático de Basora cuyo veredicto sobre Abu Tammam contra al-Buhturi —'un buceador que coloca la perla y el fragmento de concha en una sola cuerda'— se convirtió en la comparación estándar {cite:muruj-al-dhahab p. 458-459}."
  ur: "بصری گرامر جس کا ابو تمام بمقابلہ البطوری پر فیصلہ - 'ایک غوطہ خور جو موتی اور خول کو ایک تار میں رکھتا ہے' - معیاری موازنہ بن گیا {حوالہ: مروج الذہب صفحہ 458-459}۔"
  tr: "Dilbilgisi uzmanı Muhammed bin Yezid el-Mübared, el-Mes'udi'ye Abu Temmam ve el-Buhturi hakkında sorduğunda, hangi şiir Ebu Tammam için daha şiirseldir, dedi. Nazik çıkarımlar ve hoş anlamlar el-Buhturi'nin şiirinden daha iyidir ve el-Buhturi'nin şiirleri en iyi seviyededir çünkü tüm şiirin sağlam olduğunu söyler, Ebu Temmam nadir bir dizeyi okur, ardından inci ve makhşalbeyi çıkaran ve onları tek bir sıraya koyan dalış gibi olan saçma dizeyi okur. El-Buhturi ile şiiri sonlandırır {atıf:muruj-al-dhahab, s. 458-459}. al-Mas'udi'ye göre, al-Mutawakkil onu Basra valisine gönderdi, bir ayetin yorumu üzerine el-Feth bin Kagan ile bir anlaşmazlık için. Herakleios Manastırı'nın yanından geçti ve akıl hastalarından kaybolan bir deli gördü, şiirlerinden okudu ve ona 'Yanında bir çocuk öldü.' dedi. Deli adam öldü, bu yüzden el-Mubarrad onu yıkadı, kefenledi, dua etti ve gömdü {alıntı: Muric-al-Dhahab, s. 476-478}. İbn el-Cevzi'ye göre, kendisi Ali ibn Yazid ibn Abd al-Ekber el-Azdi el-Thamali, diğer adıyla al-Mubarrad'dır; dili tam olarak bilirdi ve Basranlılar arasında bir ayet olarak kabul edilirdi. 200 H yılında, bazılarına göre 2600 yılında doğdu. Neden kendisine al-Mubarrad denildiği soruldu {atıf:Muntazam-ibn-al-jawzi, s. 297}."
  id: "Muhammad ibn Yazid al-Mubarrad, seorang ahli tata bahasa, berkata kepada al-Mas'udi ketika ia bertanya tentang Abu Tammam dan al-Buhturi, puisi mana yang lebih puitis bagi Abu Tammam? Ekstraksi yang halus dan makna yang menyenangkan semakin baik daripada puisi al-Buhturi, dan puisi al-Buhturi berada pada tingkat terbaik karena ia mengatakan seluruh puisi itu benar, dan Abu Tammam membacakan bait langka, diikuti oleh bait konyol, yang seperti menyelam yang mengeluarkan mutiara dan makhshalba lalu menyusunnya dalam satu urutan. Dengan al-Buhturi, ia mengakhiri puisi {cite:muruj-al-dhahab, hlm. 458-459}. Menurut al-Mas'udi, al-Mutawakkil mengirimnya kepada gubernur Basra dalam perselisihan dengan al-Fath ibn Khagan mengenai penafsiran sebuah bait. Ia melewati Biara Heraclius dan melihat seorang gila yang telah menghilang dari orang gila, sehingga ia membaca puisinya sampai berkata kepadanya, 'Seorang anak laki-laki bersamanya meninggal.' Orang gila itu jatuh mati, sehingga al-Mubarrad membasuhnya, menutupinya, berdoa untuknya, dan menguburnya {cite:Muruj-al-Dhahab, hlm. 476-478}. Menurut Ibn al-Jawzi, ia adalah Ali ibn Yazid ibn Abd al-Akbar al-Azdi al-Thamali, dikenal sebagai al-Mubarrad, yang memiliki pengetahuan lengkap tentang bahasa tersebut dan dianggap sebagai salah satu Basranis, sebuah bait. Ia lahir pada tahun 200 H, atau beberapa orang mengatakan 2600. Ia ditanya mengapa ia disebut al-Mubarrad {cite:Muntazam-ibn-al-jawzi, hlm. 297}."
