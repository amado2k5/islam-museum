summary:
  ar: "توقتوغول ساتيلغانوف (1864–1933)، أقين وشاعر وملحن قرغيزي من وادي كتمن توبو، اتُّهم ظلمًا بالمشاركة في ثورة أنديجان 1898 ونُفي إلى سيبيريا، ثم صار في العهد السوفيتي أشهر موسيقيي قرغيزستان الشعبيين؛ تحمل مدينة وورقة المئة سوم اسمه وصورته."
  en: "Toktogul Satylganov (1864–1933) was a Kyrgyz akyn, poet and composer from the Ketmen-Töbö valley who was jailed on a false accusation of taking part in the 1898 Andijan revolt and exiled to Siberia, and who in the Soviet era became Kyrgyzstan's best-known folk musician; a town and the 100 som note bear his name and portrait."
  ur: "توقتوغول ساتیلغانوف (1864–1933) وادی کتمن توبو کے کرغیز عقین، شاعر اور موسیقار تھے؛ 1898 کی اندیجان بغاوت میں شرکت کے جھوٹے الزام میں سائبیریا جلاوطن ہوئے، اور سوویت دور میں کرغیزستان کے مشہور ترین لوک موسیقار بنے۔"
  es: "Toktogul Satylganov (1864-1933) fue un akyn kirguís, poeta y compositor del valle de Ketmen-Töbö que fue encarcelado bajo una falsa acusación de participar en la revuelta de Andiján de 1898 y exiliado a Siberia, y que en la era soviética se convirtió en el músico folclórico más conocido de Kirguistán; una ciudad y el billete de 100 soms llevan su nombre y su retrato."
  fr: "Toktogul Satylganov (1864–1933) était un akyn, poète et compositeur kirghize de la vallée de Ketmen-Töbö qui fut emprisonné sur la base d'une fausse accusation de participation à la révolte d'Andijan de 1898 et exilé en Sibérie, et qui, à l'époque soviétique, devint le musicien folklorique le plus connu du Kirghizistan; une ville et le billet de 100 som portent son nom et son portrait."
  tr: "Katamenobu Vadisi'nden Kırgız şair, şair ve besteci Tokhtogol Satilganov (1864–1933), 1898 Andican Devrimi'ne katılmakla haksız yere suçlandı ve Sibirya'ya sürgün edildi. Daha sonra, Sovyet döneminde, Kırgızistan'ın en ünlü halk müzisyenlerinden biri oldu; şehir ve 100-som banknot onun adını ve imajını taşımaktadır."
  id: "Tokhtogol Satilganov (1864–1933), seorang penyair, penyair, dan komposer Kyrgyz dari Lembah Katamenobu, secara tidak adil dituduh ikut serta dalam Revolusi Andijan tahun 1898 dan diasingkan ke Siberia. Kemudian, selama era Soviet, ia menjadi salah satu musisi populer paling terkenal di Kyrgyzstan; kota dan uang kertas 100 som itu memuat nama dan citranya."
