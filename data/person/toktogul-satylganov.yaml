summary:
  ar: "توقتوغول ساتيلغانوف (1864–1933)، أقين وشاعر وملحن قرغيزي من وادي كتمن توبو، اتُّهم ظلمًا بالمشاركة في ثورة أنديجان 1898 ونُفي إلى سيبيريا، ثم صار في العهد السوفيتي أشهر موسيقيي قرغيزستان الشعبيين؛ تحمل مدينة وورقة المئة سوم اسمه وصورته."
  en: "Toktogul Satylganov (1864–1933) was a Kyrgyz akyn, poet and composer from the Ketmen-Töbö valley who was jailed on a false accusation of taking part in the 1898 Andijan revolt and exiled to Siberia, and who in the Soviet era became Kyrgyzstan's best-known folk musician; a town and the 100 som note bear his name and portrait."
  ur: "توقتوغول ساتیلغانوف (1864–1933) وادی کتمن توبو کے کرغیز عقین، شاعر اور موسیقار تھے؛ 1898 کی اندیجان بغاوت میں شرکت کے جھوٹے الزام میں سائبیریا جلاوطن ہوئے، اور سوویت دور میں کرغیزستان کے مشہور ترین لوک موسیقار بنے۔"
