summary:
  ar: "محمد بن أبي بكر بن عبد الرزاق بن داسة التمار، تلميذ أبي داود السجستاني وأحد الراويين اللذين تروى عنهما سنن أبي داود، وهو ناقل قول أبي داود إنه انتخب كتابه من خمسمائة ألف حديث {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  en: "Muhammad ibn Abi Bakr ibn 'Abd al-Razzaq ibn Dasa al-Tammar, a student of Abu Dawud al-Sijistani and one of the two transmitters through whom Abu Dawud's Sunan is handed down; it is he who relays Abu Dawud's statement that he selected his book from five hundred thousand reports {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  ur: "محمد بن ابی بکر بن عبد الرزاق بن داسہ التمار، ابو داؤد سجستانی کے شاگرد اور ان دو راویوں میں سے ایک جن کے ذریعے سنن ابی داؤد روایت ہوتی ہے؛ ابو داؤد کا یہ قول کہ انہوں نے اپنی کتاب پانچ لاکھ حدیثوں میں سے چنی، انہی سے منقول ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}۔"
