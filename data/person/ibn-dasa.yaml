summary:
  ar: "محمد بن أبي بكر بن عبد الرزاق بن داسة التمار، تلميذ أبي داود السجستاني وأحد الراويين اللذين تروى عنهما سنن أبي داود، وهو ناقل قول أبي داود إنه انتخب كتابه من خمسمائة ألف حديث {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  en: "Muhammad ibn Abi Bakr ibn 'Abd al-Razzaq ibn Dasa al-Tammar, a student of Abu Dawud al-Sijistani and one of the two transmitters through whom Abu Dawud's Sunan is handed down; it is he who relays Abu Dawud's statement that he selected his book from five hundred thousand reports {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  ur: "محمد بن ابی بکر بن عبد الرزاق بن داسہ التمار، ابو داؤد سجستانی کے شاگرد اور ان دو راویوں میں سے ایک جن کے ذریعے سنن ابی داؤد روایت ہوتی ہے؛ ابو داؤد کا یہ قول کہ انہوں نے اپنی کتاب پانچ لاکھ حدیثوں میں سے چنی، انہی سے منقول ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}۔"
  es: "Muhammad ibn Abi Bakr ibn 'Abd al-Razzaq ibn Dasa al-Tammar, discípulo de Abu Dawud al-Sijistani y uno de los dos transmisores a través de los cuales se transmite el Sunan de Abu Dawud; es él quien relata la afirmación de Abu Dawud de que seleccionó su libro de quinientos mil informes {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  fr: "Muhammad ibn Abi Bakr ibn 'Abd al-Razzaq ibn Dasa al-Tammar, un élève d'Abu Dawud al-Sijistani et l'un des deux transmetteurs par lesquels le Sunan d'Abu Dawud est transmis; c'est lui qui relaie la déclaration d'Abu Dawud selon laquelle il a sélectionné son livre parmi cinq cent mille rapports {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 10}."
  tr: "Muhammed ibn Ebi Bekir ibn Abdül-Razzak ibn Dasa el-Tammar, Ebu Davud el-Sijasti'nin öğrencisi ve Sunan Abi Dawud'un anlatıldığı iki rivayetçiden biridir. Ebu Davud'un kitabını beş yüz bin hadis arasından seçtiğine dair ifadesinin iletilicisidir {atıf:sunan-abi-dawud-ibn-hazm-1997-v1, s. 10}."
  id: "Muhammad ibn Abi Bakr ibn Abd al-Razzaq ibn Dasa al-Tammar, seorang murid Abu Dawud al-Sijistani dan salah satu dari dua narator yang menjadi sumber cerita Sunan Abi Dawud. Ia adalah penyampai pernyataan Abu Dawood bahwa ia memilih bukunya dari lima ratus ribu hadis {sitasi: sunan-abi-dawud-ibn-hazm-1997-v1, hlm. 10}."
