  ar: "شاعر كوفي من بني حنيفة في العصر الأموي، مدح المهلب وأبناءه وأبان بن الوليد، وله نادرة مع عبد الملك بن بشر بن مروان. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 63-64}"
  en: "A Kufan poet of Banu Hanifa in the Umayyad period, who praised al-Muhallab and his sons and Aban ibn al-Walid; an anecdote involves Abd al-Malik ibn Bishr ibn Marwan. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 63-64}"
  ur: "بنو حنیفہ کے کوفی شاعر، اموی دور میں؛ مہلب اور ان کے بیٹوں اور ابان بن ولید کی مدح کی، اور عبد الملک بن بشر بن مروان کے ساتھ ایک واقعہ ہے۔ {cite:nihayat-al-arab-nuwayri-vol4-scan p. 63-64}"
