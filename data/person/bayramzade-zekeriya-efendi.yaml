    note: "No text read for this record names a madhhab for Zekeriya Efendi personally. He rose through the Ottoman learned hierarchy to the Shaykh al-Islamate — the chief mufti's office of a Hanafi establishment — but office and milieu are not attestation, so his faith is recorded unknown. The Hanafi character of the institution he headed is stated in the prose, not in this field. His son's record (person/zekeriyazade-yahya) records unknown on the same ground."
