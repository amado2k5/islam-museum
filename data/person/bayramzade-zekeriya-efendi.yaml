  ar: "بيرم زاده زكريا أفندي ⁦(١٥١٤–١٥٩٣م)⁩، عالم وفقيه عثماني من أنقرة، تدرّج في التدريس والقضاء حتى صار قاضي عسكر الأناضول ثم الروملي وتولّى مشيخة الإسلام سنة ١٥٩٢م؛ وهو والد شيخ الإسلام زكريا زاده يحيى أفندي."
  en: "Bayramzade Zekeriya Efendi (1514–1593) was an Ottoman scholar and jurist from Ankara who rose through the medreses and the judiciary to the kazaskerliks of Anatolia and Rumelia and held the Shaykh al-Islamate from 1592 until his sudden death; he was the father of Shaykh al-Islam Zekeriyazade Yahya Efendi."
