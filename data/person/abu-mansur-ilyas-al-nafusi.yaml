summary:
  ar: "أبو منصور إلياس النفوسي، والي جبل نفوسة وطرابلس باسم الإمام الرستمي في تاهرت أبي اليقظان محمد بن أفلح ⁦(ت. 281هـ/894-895م)⁩، من قرية تيندميرة بجبل نفوسة، وفي سنة 266هـ/879-880م دافع عن طرابلس ضد أحمد بن طولون. {cite:encyclopaedia-of-islam-2 vol. 1 p. 158}"
  en: "Abu Mansur Ilyas al-Nafusi, governor of the Nafusa mountains and Tripolitania for the Rustamid imam of Tahart, Abu l-Yaqzan Muhammad b. Aflah (d. 281/894-5), from the village of Tindemira in the Nafusa; in 266/879-80 he came to the help of Tripoli against Ahmad b. Tulun. {cite:encyclopaedia-of-islam-2 vol. 1 p. 158}"
  ur: "ابو منصور الیاس النفوسی، جبل نفوسہ اور طرابلس کے گورنر، جو تاہرت کے رستمی امام ابو الیقظان محمد بن افلح ⁦(281ھ/894-95ء میں وفات)⁩ کی طرف سے مقرر تھے، تِندمیرہ گاؤں ⁦(جبل نفوسہ)⁩ کے رہنے والے؛ 266ھ/879-80ء میں انہوں نے احمد بن طولون کے مقابلے میں طرابلس کی مدد کی۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 158}"
  fr: "Abu Mansur Ilyas al-Nafusi, gouverneur du djebel Nafusa et de la Tripolitaine pour l'imam rustamide de Tahart, Abu l-Yaqzan Muhammad b. Aflah (m. 281/894-5), originaire du village de Tindemira dans le Nafusa ; en 266/879-80, il vint au secours de Tripoli contre Ahmad b. Tulun. {cite:encyclopaedia-of-islam-2 vol. 1 p. 158}"
  es: "Abu Mansur Ilyas al-Nafusi, gobernador de las montañas de Nafusa y Tripolitania para el imán rustamí de Tahart, Abu l-Yaqzan Muhammad b. Aflah (m. 281/894-5), de la aldea de Tindemira en Nafusa; en 266/879-80 acudió en ayuda de Trípoli contra Ahmad b. Tulun. {cite:encyclopaedia-of-islam-2 vol. 1 p. 158}"
  tr: "Tahert'teki Rustamid İmamı Ebu el-Yakzan Muhammed ibn Aflah (ö. 281 Hicri/894-895 Miladi) adına Cebel Nafusa ve Trablus valisi olan Ebu Mansur İlyas el-Nafusi, Cebel Nafusa'daki Tindamira köyündendi. 266 Hicri/879-880 Miladi yılında Trablus'u Ahmed ibn Tulun'a karşı savundu. {cite:encyclopaedia-of-islam-2 cilt 1 s. 158}"
  id: "Abu Mansur Ilyas al-Nafusi, gubernur Jabal Nafusa dan Tripoli atas nama Imam Rustamid di Tahert, Abu al-Yaqzan Muhammad ibn Aflah (wafat 281 H/894-895 M), berasal dari desa Tindamira di Jabal Nafusa. Pada tahun 266 H/879-880 M, ia mempertahankan Tripoli dari Ahmad ibn Tulun. {cite:encyclopaedia-of-islam-2 vol. 1 p. 158}"
