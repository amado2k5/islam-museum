summary:
  ar: "أبو منصور إلياس النفوسي، والي جبل نفوسة وطرابلس باسم الإمام الرستمي في تاهرت أبي اليقظان محمد بن أفلح (ت. 281هـ/894-895م)، من قرية تيندميرة بجبل نفوسة، وفي سنة 266هـ/879-880م دافع عن طرابلس ضد أحمد بن طولون. {cite:encyclopaedia-of-islam-2 vol. 1 p. 158}"
  en: "Abu Mansur Ilyas al-Nafusi, governor of the Nafusa mountains and Tripolitania for the Rustamid imam of Tahart, Abu l-Yaqzan Muhammad b. Aflah (d. 281/894-5), from the village of Tindemira in the Nafusa; in 266/879-80 he came to the help of Tripoli against Ahmad b. Tulun. {cite:encyclopaedia-of-islam-2 vol. 1 p. 158}"
  ur: "ابو منصور الیاس النفوسی، جبل نفوسہ اور طرابلس کے گورنر، جو تاہرت کے رستمی امام ابو الیقظان محمد بن افلح (281ھ/894-95ء میں وفات) کی طرف سے مقرر تھے، تِندمیرہ گاؤں (جبل نفوسہ) کے رہنے والے؛ 266ھ/879-80ء میں انہوں نے احمد بن طولون کے مقابلے میں طرابلس کی مدد کی۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 158}"
