summary:
  ar: "داعية مصري وصانع محتوى، وُلد في القاهرة سنة 1993، وهو صيدلي حاصل على بكالوريوس الصيدلة. قناته الرسمية على يوتيوب بدأت سنة 2014 وتجاوز مشتركوها 2.4 مليون مشترك، وفيها دروسه وسلاسله مثل «أبواب الجنة» و«الساعة سبعة». أثار ترويجه سنة 2023 لتطبيق «عمرة البدل» جدلًا واسعًا وانتقادات من علماء ومؤسسات دينية مصرية."
  en: "Egyptian preacher and content creator, born in Cairo in 1993; he is a pharmacist holding a bachelor's degree in pharmacy. His official YouTube channel began in 2014 and has passed 2.4 million subscribers, carrying his lessons and series such as Abwab al-Janna (The Gates of Paradise) and Al-Sa'a Sab'a (The Seven O'Clock). His 2023 promotion of an 'Umra-by-proxy' application drew wide controversy and criticism from Egyptian scholars and religious institutions."
  ur: "مصری مبلغ اور مواد ساز، جو 1993 میں قاہرہ میں پیدا ہوئے؛ وہ فارماسسٹ ہیں اور فارمیسی میں بیچلر کی ڈگری رکھتے ہیں۔ ان کا رسمی یوٹیوب چینل 2014 میں شروع ہوا اور اس کے سبسکرائبرز چوبیس لاکھ سے تجاوز کر گئے، جس میں ان کے دروس اور «أبواب الجنة» و «الساعة سبعة» جیسی سلسلے شامل ہیں۔ 2023 میں «عمرة البدل» ایپ کی ان کی تشہیر نے وسیع تنازع اور مصری علماء و دینی اداروں کی تنقید کو جنم دیا۔"
