id: person/abu-bakr-al-farisi-shafii
class: person
label:
  ar: "أبو بكر الفارسي"
  en: "Abu Bakr al-Farisi (Shafi'i jurist)"
  fr: "Abu Bakr al-Farisi (juriste shafi'ite)"
  es: "Abu Bakr al-Farisi (Shafi'i jurist)"
  ur: "ابوبکر الفارسی ⁦(شافعی فقیہ)⁩"
roles: [scholar, jurist]
gender: male
summary:
  ar: "أحمد بن الحسين بن سهل، أبو بكر الفارسي، فقيه شافعي، تفقه على المزني وابن سريج، وتولى قضاء بلاد فارس، وأقام ببخارى ثم بنيسابور، ومن تصانيفه «عيون المسائل في نصوص الشافعي» و«الذخيرة في أصول الفقه» و«الانتقاد على المزني». توفي في حدود سنة 350هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  en: "Ahmad ibn al-Husayn ibn Sahl, Abu Bakr al-Farisi, Shafi'i jurist; he studied with al-Muzani and Ibn Surayj, held the judgeship of the lands of Fars, lived in Bukhara and then Nishapur; his works include 'The Essentials of al-Shafi'i's Texts', 'The Treasury of Usul al-Fiqh' and 'Criticism of al-Muzani'. He died around 350 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  fr: "Ahmad ibn al-Husayn ibn Sahl, Abu Bakr al-Farisi, juriste shafi'ite ; il étudia avec al-Muzani et Ibn Surayj, exerça la judicature dans le pays de Fars, vécut à Boukhara puis à Nichapour ; ses œuvres comprennent « L'essentiel des textes d'al-Shafi'i », « Le trésor des fondements du droit » et « La critique d'al-Muzani ». Il mourut vers 350 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  es: "Ahmad ibn al-Husayn ibn Sahl, Abu Bakr al-Farisi, jurista shafi'í; estudió con al-Muzani e Ibn Surayj, fue juez de las tierras de Fars, vivió en Bujará y luego en Nishapur; entre sus obras destacan «Los fundamentos de los textos de al-Shafi'i», «El tesoro de Usul al-Fiqh» y «Crítica de al-Muzani». Falleció alrededor del año 350 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  ur: "احمد بن الحسین ابن سہل، ابوبکر الفارسی، شافعی فقیہ؛ اس نے المزانی اور ابن سریج کے ساتھ تعلیم حاصل کی، فارس کی سرزمین پر قاضی رہے، بخارا اور پھر نیشاپور میں مقیم رہے۔ ان کی تصانیف میں 'الشافعی کے نصوص کے لوازمات'، 'اصول الفقہ کا خزانہ' اور 'المزانی کی تنقید' شامل ہیں۔ ان کی وفات 350ھ کے لگ بھگ ہوئی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 9957}"
  tr: "Şafiî fıkıhçısı Ahmed ibn el-Hüseyni ibn Sahl, Ebu Bekir el-Ferisi, el-Muzani ve İbn Surayj'ın öğrencisiydi. İran'da kadı olarak görev yaptı ve önce Buhara'da, daha sonra Nişapur'da ikamet etti. Eserleri arasında \"Uyun el-Masa'il fi Nusus el-Şafiî\" (Şafiî Metinlerindeki Soruların Özü), \"el-Dhakhira fi Usul el-Fıkıh\" (Fıkıh İlkelerinin Hazinesi) ve \"el-İntikad 'ala el-Muzani\" (Muzani'nin Eleştirisi) bulunmaktadır. Hicri 350 yılı civarında vefat etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9957}"
  id: "Ahmad ibn al-Husayn ibn Sahl, Abu Bakr al-Farisi, seorang ahli hukum mazhab Syafi'i, belajar di bawah bimbingan al-Muzani dan Ibn Surayj. Ia menjabat sebagai hakim di Persia dan tinggal di Bukhara dan kemudian Nishapur. Di antara karya-karyanya adalah \"Uyun al-Masa'il fi Nusus al-Shafi'i\" (Intisari Pertanyaan dalam Teks al-Shafi'i), \"al-Dhakhira fi Usul al-Fiqh\" (Harta Karun Prinsip-Prinsip Fiqih), dan \"al-Intiqad 'ala al-Muzani\" (Kritik terhadap al-Muzani). Ia wafat sekitar tahun 350 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
