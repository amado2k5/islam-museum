summary:
  ar: "أحمد بن الحسين بن سهل، أبو بكر الفارسي، فقيه شافعي، تفقه على المزني وابن سريج، وتولى قضاء بلاد فارس، وأقام ببخارى ثم بنيسابور، ومن تصانيفه «عيون المسائل في نصوص الشافعي» و«الذخيرة في أصول الفقه» و«الانتقاد على المزني». توفي في حدود سنة 350هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
  en: "Ahmad ibn al-Husayn ibn Sahl, Abu Bakr al-Farisi, Shafi'i jurist; he studied with al-Muzani and Ibn Surayj, held the judgeship of the lands of Fars, lived in Bukhara and then Nishapur; his works include 'The Essentials of al-Shafi'i's Texts', 'The Treasury of Usul al-Fiqh' and 'Criticism of al-Muzani'. He died around 350 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9957}"
