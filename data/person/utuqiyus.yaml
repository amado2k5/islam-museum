id: person/utuqiyus
class: person
label: { ar: "أوطوقيوس", en: "Utuqiyus", es: "Utuqiyus", fr: "Utuqiyus" }
summary:
  ar: "أوطوقيوس رجل بعسقلان مبرز في علم الهندسة جمع ما قدر عليه من كتاب أبلونيوس في المخروطات فأصلح منه أربع مقالات، قال بنو موسى إن لهذا الرجل كتبا حسنة في الهندسة لم يخرج إلينا منها شيء البتة، وله كتاب شرح المقالة الأولى من كتاب أرشميدس في الكرة والأسطوانة {cite:fihrist-ibn-al-nadim p. 373-374}."
  en: "Eutocius of Ascalon — who restored four books of the Conics {cite:fihrist-ibn-al-nadim}"
  es: "Eutocio de Ascalón — quien restauró cuatro libros de las Cónicas {cite:fihrist-ibn-al-nadim}"
  fr: "Eutocius d'Ascalon — qui a restauré quatre livres des Coniques {cite:fihrist-ibn-al-nadim}"
  ur: "اسکالون کے یوٹوشیئس - جس نے کونکس کی چار کتابیں بحال کیں"
  tr: "Ascalon'un önde gelen isimlerinden Otoketius, Apollonius'un koniler kitabından olabildiğince çok şey topladı ve oradaki dört incelemeyi düzeltti. Musa'nın oğulları, bu adamın geometri üzerine mükemmel kitapları olduğunu, ancak hiçbirinin bize ulaşmadığını söylediler. Ayrıca Arşimet'in küre ve silindir üzerine kitabındaki ilk makaleye bir yorum yazdı {cite:fihrist-ibn-al-nadim s. 373-374}."
  id: "Otoketius, seorang tokoh terkemuka di Ascalon, mengumpulkan sebanyak mungkin dari buku Apollonius tentang kerucut dan mengoreksi empat risalah darinya. Anak-anak Musa mengatakan bahwa pria ini memiliki buku-buku geometri yang sangat baik, yang tidak ada yang sampai kepada kita. Ia juga menulis komentar atas artikel pertama dari buku Archimedes tentang bola dan silinder {cite:fihrist-ibn-al-nadim hlm. 373-374}."
