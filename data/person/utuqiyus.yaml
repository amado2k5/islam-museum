summary:
  ar: "أوطوقيوس رجل بعسقلان مبرز في علم الهندسة جمع ما قدر عليه من كتاب أبلونيوس في المخروطات فأصلح منه أربع مقالات، قال بنو موسى إن لهذا الرجل كتبا حسنة في الهندسة لم يخرج إلينا منها شيء البتة، وله كتاب شرح المقالة الأولى من كتاب أرشميدس في الكرة والأسطوانة {cite:fihrist-ibn-al-nadim p. 373-374}."
  en: "Eutocius of Ascalon — who restored four books of the Conics {cite:fihrist-ibn-al-nadim}"
