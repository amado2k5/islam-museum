summary:
  ar: "محمد طاهر (1628 – 1671)، المعروف بلقبه عناية خان، مؤرخ هندي في سلطنة مغول الهند، صاحب «شاهجهان نامه»، وهو تلخيص لتاريخ شاه جهان مستمد من تقليد البادشاه نامه. كان ابن الوزير ظفر خان، حاكم كابل وكشمير في عهد شاه جهان، وخدم داروغا ومسؤولًا في المكتبة السلطانية، وكان من المقربين إلى الإمبراطور، ثم اعتزل إلى كشمير حيث توفي."
  en: "Muhammad Tahir (1628 - 1671), known by his title Inayat Khan, was an Indian historian of the Mughal Empire, author of the Shahjahannama, an abridged history of Shah Jahan drawn from the Badshahnama tradition. He was the son of Zafar Khan, Jahangir's wazir and under Shah Jahan governor of Kabul and of Kashmir; he served as a darogha and as an officer of the Imperial Library, was a close companion of the emperor, and retired to Kashmir, where he died."
  ur: "محمد طاہر (1628ء – 1671ء)، جو اپنے خطاب عنایت خان سے معروف ہیں، مغلیہ سلطنت کے مؤرخ تھے اور «شاہ جہاں نامہ» کے مصنف، جو بادشاہ نامہ کی روایت سے ماخوذ شاہ جہاں کی مختصر تاریخ ہے۔ وہ وزیر ظفر خان کے بیٹے تھے، جو جہانگیر کے وزیر اور شاہ جہاں کے عہد میں کابل و کشمیر کے صوبیدار رہے؛ عنایت خان داروغہ اور شاہی کتب خانے کے افسر رہے، شہنشاہ کے قریبی ساتھی تھے، اور پھر کشمیر میں اقامت اختیار کی جہاں ان کا انتقال ہوا۔"

