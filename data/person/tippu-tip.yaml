summary:
  ar: "تاجر عاج ورقيق ومستكشف زنجباري من أصل عربي عُماني، بنى في حوض الكونغو الشرقي دولة تجارية في ظل سلاطين زنجبار، وجمع العبيد لمزارع القرنفل فيها حتى صار بحلول 1895 مالك سبع مزارع وعشرة آلاف عبد وفقًا لعبد الشريف، وقبِل سنة 1887 ولاية مقاطعة شلالات ستانلي في دولة الكونغو الحرة، وأملى سيرته الذاتية — أول سيرة ذاتية باللغة السواحلية."
  en: "Zanzibari ivory and slave trader and explorer of Arab-Omani descent who built a trading state in the eastern Congo basin under the sultans of Zanzibar, gathered slaves for its clove plantations until by 1895 he held seven plantations and 10,000 slaves according to Abdul Sheriff, accepted the governorship of the Stanley Falls District in the Congo Free State in 1887, and dictated his life account — the first autobiography in the Swahili language."
  ur: "عرب عمانی النسل زنجباری ہاتھی دانت اور غلاموں کے تاجر اور مہم جو، جنہوں نے زنجبار کے سلاطین کے زیر سایہ مشرقی کانگو کے طاس میں ایک تجارتی ریاست قائم کی، لونگ کے باغات کے لیے غلام جمع کیے حتیٰ کہ عبد الشریف کے مطابق 1895 تک ان کے پاس سات باغات اور دس ہزار غلام تھے، 1887 میں کانگو فری اسٹیٹ کے اسٹینلے فالز ضلع کی گورنری قبول کی، اور اپنی سوانح لکھوائی — جو سواحلی زبان کی پہلی خود نوشت ہے۔"
