summary:
  ar: حقوقية وأكاديمية سنغالية. دكتورة في القانون الدستوري من جامعة الشيخ أنتا ديوب في داكار، ورئيسة جناح النساء في التجمع الإسلامي في السنغال ⁦(RIS-Alwahda)⁩، أكبر منظمة إسلامية في البلاد.
  en: Senegalese constitutional lawyer and academic. Doctor of law from Cheikh Anta Diop University in Dakar and president of the women's wing of the Rassemblement Islamique du Sénégal (RIS-Alwahda), the
    country's largest Islamic organisation.
  ur: سینیگال کی آئینی قانون دان اور ماہر تعلیمات۔ ڈاکار کی شیخ انتا دیوپ یونیورسٹی سے ڈاکٹریٹ، اور راسمبلمن اسلامیک دو سینیگال ⁦(RIS-Alwahda)⁩ — ملک کی سب سے بڑی اسلامی تنظیم — کے خواتین شعبے کی صدر۔
  es: "Abogada constitucionalista y académica senegalesa. Doctora en Derecho por la Universidad Cheikh Anta Diop de Dakar y presidenta del ala femenina de la Rassemblement Islamique du Sénégal (RIS-Alwahda), la mayor organización islámica del país."
  fr: "Avocate constitutionnaliste et universitaire sénégalaise. Docteur en droit de l'Université Cheikh Anta Diop de Dakar et présidente de la branche féminine du Rassemblement Islamique du Sénégal (RIS-Alwahda), la plus grande organisation islamique du pays."
  tr: "Bir avukat ve Senegalli akademisyen. Dakar'daki Cheikh Anta Diop Üniversitesi'nden anayasa hukuku alanında doktora derecesine sahiptir ve ülkenin en büyük İslami örgütü olan Senegal İslami Birliği'nin (RIS-Alwahda) kadın kanadının başkanıdır."
  id: "Seorang pengacara dan akademisi Senegal. Meraih gelar PhD dalam hukum konstitusi dari Universitas Cheikh Anta Diop di Dakar, dan kepala sayap perempuan dari Rally Islam di Senegal (RIS-Alwahda), organisasi Islam terbesar di negara ini."
