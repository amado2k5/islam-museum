summary:
  ar: "سلطان بني مرين بالمغرب (1286–1307)، ابن السلطان أبي يوسف يعقوب بن عبد الحق وخليفته. تنازل عن معظم مواقع المرينيين في الأندلس، ثم وجّه قوته إلى بني عبد الواد فحاصر تلمسان سنوات طوال وبنى قبالتها مدينة المنصورة، حتى اغتاله أحد الخصيان في معسكر الحصار سنة 1307 وهو على وشك إسقاطها."
  en: "Marinid sultan of Morocco (1286–1307), son and successor of Sultan Abu Yusuf Yaqub ibn Abd al-Haqq. He gave up most of the Marinid positions in al-Andalus, then turned his strength against the Abdalwadids of Tlemcen, besieging their capital for years from the counter-city of al-Mansura he built facing it, until a eunuch assassinated him in the siege camp in 1307 with the city near to falling."
  ur: "مرین خاندان کے سلطانِ مغرب (1286–1307)، سلطان ابو یوسف یعقوب بن عبد الحق کے بیٹے اور جانشین۔ انھوں نے اندلس میں مرینیوں کے بیشتر مقامات چھوڑ دیے، پھر اپنی قوت بنو عبد الواد کی طرف موڑی اور تلمسان کا برسوں محاصرہ کیا، جس کے بالمقابل انھوں نے المنصورہ کا شہر بسایا، یہاں تک کہ 1307 میں محاصرے کے پڑاؤ میں ایک خواجہ سرا نے انھیں قتل کر دیا جب شہر گرنے کے قریب تھا۔"
