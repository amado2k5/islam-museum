id: person/adud-al-dawla
class: person
label: { ar: "عضد الدولة فناخسرو بن ركن الدولة" }
summary:
  ar: "أعظم سلاطين بني بويه، قدم بغداد سنة أربع وستين لنصرة عز الدولة على سبكتكين فأعجبته وملكها، وفي سنة سبع وستين التقاه وظفر عليه وأخذه أسيراً وقتله، وخلع عليه الطائع خلع السلطنة وتوجه بتاج مجوهر وطوقه وسوره وقلده سيفاً وعقد له لواءين أحدهما مفضض والآخر مذهب ولم يعقد هذا اللواء لغيره قبله، وضربت له الدبادب على بابه وخطب له على منابر الحضرة، وجلس الطائع بمصحف عثمان بين يديه والبردة على كتفه والقضيب بيده متقلداً بسيف رسول الله فقبل عضد الدولة الأرض سبع مرات ثم رجله وقال له الطائع قد رأيت أن أفوض إليك ما وكل الله إلي من أمور الرعية في شرق الأرض وغربها سوى خاصتي وأسبابي، ومات سنة اثنتين وسبعين فولي الطائع مكانه ابنه صمصام الدولة {cite:tarikh-khulafa-minhaj-1434 p. 626-630}. وعند ابن الأثير استنجد به بختيار سنة 362هـ على سبكتكين فسار من فارس واقتتل مع الأتراك بين ديالى والمدائن وانهزموا فغرق أكثرهم من السباحة ودخل بغداد لثلاث خلون من رجب فامتلأت دجلة بالسميريات حتى كان المار يعبر على سطوحها، وطمع في العراق واستضعف بختياراً فوضع جنده على أن يثوروا به ويشغبوا عليه ويطالبوه بأموالهم ففعلوا {cite:kamil-ibn-al-athir p. 475-477}"
  en: "Greatest of the Buyid sultans; he came to Baghdad in 364 'aiding' Izz al-Dawla, liked it and took it, beat and killed him in 367. Al-Ta'i' crowned him jewelled, gave two standards — the gilded heir's standard unprecedented — drums at his gate, and at the famous audience, seated behind Uthman's mushaf and the Prophet's sword, delegated to him 'the subjects' affairs east and west, save my household'. He died in 372, succeeded by his son Samsam al-Dawla {cite:tarikh-khulafa-minhaj-1434 p. 626-630}."
