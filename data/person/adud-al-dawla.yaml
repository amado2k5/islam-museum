education:
  did_you_know:
    ar: "عضد الدولة أعظم سلاطين بني بويه: قدم بغداد سنة ٣٦٤هـ لنصرة عز الدولة فملكها، وظفر عليهم جميعاً وخلع عليه الطائع خلع السلطنة وتوجّه بالتاج المجوهر."
    en: "Adud al-Dawla, the greatest of the Buyid sultans, entered Baghdad in 364 AH to back Izz al-Dawla and ended master of it — overcoming them all while the caliph al-Ta'i' draped him in the sultanate's robes and jewelled crown."
    ur: "عضدالدولہ، بویہی سلاطین کا عظیم ترین، 364ھ میں عزالدولہ کی نصرت کے لیے بغداد آیا اور اس پر قابض ہوا — سب پر غالب آیا اور خلیفہ طائع نے اسے سلطنت کا خلعت اور جواہرات کا تاج پہنایا۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/tarikh-khulafa-minhaj-1434]
