summary:
  ar: "أحمد شاه الدراني، مؤسس الدولة الدرانية في أفغانستان. كان من عبدالي، وانتخبه الأفغان زعيمًا بعد مقتل نادر شاه سنة 1160هـ/1747م، ولقّب بدرّ دُرّان، وغزا الهند تسع مرات بين 1747 و1769م، وأخذ لاهور ودلهي وأقاليم من خراسان وبلخ وكشمير، وتوفي سنة 1184هـ/1773م {cite:encyclopaedia-of-islam-2 vol. 1 p. 317}."
  en: "Ahmad Shah Durrani, founder of the Durrani empire in Afghanistan. A leader of the Abdali tribe, he was elected chief by the Afghans on Nadir Shah's assassination in 1160/1747 and took the title Durr-i Durran. He invaded India nine times between 1747 and 1769, and his empire covered Kashmir, Peshawar, Multan, Sind, Baluchistan, Khurasan, Herat, Kandahar, Kabul and Balkh. He died in 1184/1773 {cite:encyclopaedia-of-islam-2 vol. 1 p. 317}."
