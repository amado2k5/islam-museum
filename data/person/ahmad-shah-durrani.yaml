summary:
  ar: "أحمد شاه الدراني، مؤسس الدولة الدرانية في أفغانستان. كان من عبدالي، وانتخبه الأفغان زعيمًا بعد مقتل نادر شاه سنة 1160هـ/1747م، ولقّب بدرّ دُرّان، وغزا الهند تسع مرات بين 1747 و1769م، وأخذ لاهور ودلهي وأقاليم من خراسان وبلخ وكشمير، وتوفي سنة 1184هـ/1773م {cite:encyclopaedia-of-islam-2 vol. 1 p. 317}."
  en: "Ahmad Shah Durrani, founder of the Durrani empire in Afghanistan. A leader of the Abdali tribe, he was elected chief by the Afghans on Nadir Shah's assassination in 1160/1747 and took the title Durr-i Durran. He invaded India nine times between 1747 and 1769, and his empire covered Kashmir, Peshawar, Multan, Sind, Baluchistan, Khurasan, Herat, Kandahar, Kabul and Balkh. He died in 1184/1773 {cite:encyclopaedia-of-islam-2 vol. 1 p. 317}."
  es: "Ahmad Shah Durrani, fundador del imperio Durrani en Afganistán. Líder de la tribu Abdali, fue elegido jefe por los afganos tras el asesinato de Nadir Shah en 1160/1747 y adoptó el título de Durr-i Durran. Invadió la India nueve veces entre 1747 y 1769, y su imperio abarcó Cachemira, Peshawar, Multán, Sind, Baluchistán, Jorasán, Herat, Kandahar, Kabul y Balkh. Falleció en 1184/1773 {cite:encyclopaedia-of-islam-2 vol. 1 p. 317}."
  fr: "Ahmad Shah Durrani, fondateur de l'empire durrani en Afghanistan, était un chef de la tribu Abdali. Après l'assassinat de Nadir Shah en 1160/1747, il fut élu chef par les Afghans et prit le titre de Durr-i Durran. Il envahit l'Inde à neuf reprises entre 1747 et 1769, et son empire s'étendait sur le Cachemire, Peshawar, Multan, le Sind, le Baloutchistan, le Khorasan, Hérat, Kandahar, Kaboul et Balkh. Il mourut en 1184/1773 (source: Encyclopaedia of Islam, vol. 1, p. 317)."
  ur: "احمد شاہ درانی، افغانستان میں درانی سلطنت کا بانی۔ ابدالی قبیلے کے ایک رہنما، وہ افغانوں کی طرف سے 1160/1747 میں نادر شاہ کے قتل پر سردار منتخب ہوئے اور انہوں نے دورِ دران کا لقب اختیار کیا۔ اس نے 1747 سے 1769 کے درمیان ہندوستان پر نو بار حملہ کیا اور اس کی سلطنت کشمیر، پشاور، ملتان، سندھ، بلوچستان، خراسان، ہرات، قندھار، کابل اور بلخ پر محیط تھی۔ ان کی وفات 1184/1773 میں ہوئی۔ 1 ص۔ 317}۔"
  tr: "Ahmed Şah Durrani, Afganistan'daki Durrani devletinin kurucusudur. Abdali kabilesindendi ve Afganlar, Nader Şah'ın 1160 Hicri/1747 Miladi yılında ölümünden sonra onu liderleri olarak seçtiler. Dur Durran lakabıyla anılan Durrani, 1747 ile 1769 yılları arasında Hindistan'ı dokuz kez işgal ederek Lahor, Delhi ve Horasan, Belh ve Keşmir bölgelerini ele geçirdi. 1184 Hicri/1773 Miladi yılında öldü."
  id: "Ahmad Shah Durrani, pendiri negara Durrani di Afghanistan. Ia berasal dari klan Abdali, dan rakyat Afghanistan memilihnya sebagai pemimpin mereka setelah kematian Nader Shah pada tahun 1160 H/1747 M. Ia dijuluki Dur Durran, dan ia menginvasi India sembilan kali antara tahun 1747 dan 1769 M, merebut Lahore, Delhi, dan wilayah Khorasan, Balkh, dan Kashmir. Ia meninggal pada tahun 1184 H/1773 M {cite:encyclopaedia-of-islam-2 vol. 1 p. 317}."
