summary:
  ar: "حسين سلامي ⁦(١٩٦٠ – ١٣ حزيران ٢٠٢٥)⁩ لواء إيراني قاد الحرس الثوري الإسلامي من ٢٠١٩ حتى مقتله في غارة إسرائيلية في طهران عند بدء حرب الاثني عشر يومًا؛ التحق بالحرس مع اندلاع الحرب العراقية الإيرانية، وقاد قوته الجوية وبرامجه الصاروخية، وعُرف بخطبه النارية ضد الولايات المتحدة وإسرائيل والسعودية."
  en: "Hossein Salami (1960 - 13 June 2025) was an Iranian major general who commanded the Islamic Revolutionary Guard Corps from 2019 until he was killed in an Israeli airstrike in Tehran at the start of the Twelve-Day War; he joined the IRGC at the outbreak of the Iran-Iraq War, commanded its aerospace force and missile programmes, and was known for fiery speeches against the United States, Israel and Saudi Arabia."
  ur: "حسین سلامی (1960 – 13 جون 2025) ایرانی میجر جنرل تھے جنھوں نے 2019 سے بارہ روزہ جنگ کے آغاز میں تہران پر اسرائیلی فضائی حملے میں ہلاکت تک سپاہ پاسداران کی قیادت کی؛ وہ ایران عراق جنگ کے آغاز پر پاسداران میں شامل ہوئے، اس کی فضائی قوت اور میزائل پروگراموں کی قیادت کی، اور امریکہ، اسرائیل و سعودی عرب کے خلاف پرجوش تقریروں کے لیے معروف تھے۔"
