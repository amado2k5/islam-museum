summary:
  ar: "حيي بن أخطب في السيرة سيد بني النضير وأحد سادات يهود المدينة: أجلاه النبي مع قومه إلى خيبر فجعل يحرض الأحزاب على النبي وكان من أمر الخندق، ثم جاء إلى بني قريظة يزعزع عهدهم فنزل بهم ما نزل وقُتل معهم كما تقص السيرة والمغازي {cite:ibn-hisham-sira} {cite:maghazi-waqidi} {cite:mubarakpuri-raheeq}."
  en: "Huyayy ibn Akhtab in the Sira is the chief of Banu al-Nadir and one of the lords of Medina's Jews: the Prophet exiled him with his people to Khaybar, whence he stirred the Confederates against him and was of the affair of the Trench; he then went down to Banu Qurayza to shake their pact, so their fate befell them and he was killed among them, as the Sira and Maghazi recount {cite:ibn-hisham-sira} {cite:maghazi-waqidi} {cite:mubarakpuri-raheeq}."
  ur: "حیی بن اخطب سیرت میں بنو نضیر کا سردار اور مدینہ کے یہود کے بزرگوں میں سے ہے: نبی نے اسے اس کی قوم کے ساتھ خیبر جلاوطن کیا، وہاں سے وہ اتحادیوں کو بھڑکاتا رہا اور خندق کے معاملے میں شامل تھا؛ پھر وہ بنو قریظہ کے معاہدہ کو توڑانے آیا تو ان پر وہی نازل ہوا اور وہ ان کے ساتھ مارا گیا جیسا کہ سیرت اور مغازی بیان کرتی ہیں۔"
  es: "Huyayy ibn Akhtab en la Sira es el jefe de Banu al-Nadir y uno de los señores de los judíos de Medina: el Profeta lo exilió con su gente a Khaybar, desde donde incitó a los confederados contra él y estuvo en el asunto de la Trinchera; luego bajó a Banu Qurayza para romper su pacto, así que su destino les sobrevino y murió entre ellos, como relatan la Sira y Maghazi {cite:ibn-hisham-sira} {cite:maghazi-waqidi} {cite:mubarakpuri-raheeq}."
