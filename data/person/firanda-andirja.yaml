summary:
  ar: "عالم وداعية إندونيسي، وُلد في سورابايا في 28 أكتوبر 1979، درس في الجامعة الإسلامية بالمدينة المنورة حتى نال الدكتوراه في العقيدة سنة 2016، وألقى الدروس باللغة الإندونيسية في المسجد النبوي بين 2012 و2018 بتكليف من الحكومة السعودية، وهو من أعلام إذاعة وتلفزيون رودجا، وله عشرات الكتب في العقيدة والفقه والتفسير، وقناته الرسمية على يوتيوب يتابعها نحو 853 ألف مشترك."
  en: "Indonesian scholar and preacher, born in Surabaya on 28 October 1979. He studied at the Islamic University of Madinah through a doctorate in aqidah (2016), delivered the Indonesian-language studies at the Prophet's Mosque in Madinah from 2012 to 2018 on a Saudi government appointment, is a regular voice of Radio Rodja and Rodja TV, and has written dozens of books on creed, jurisprudence and Qur'an commentary; his official YouTube channel has about 853,000 subscribers."
  ur: "انڈونیشی عالم اور مبلغ، جو 28 اکتوبر 1979ء کو سورابایا میں پیدا ہوئے۔ انہوں نے مدینہ منورہ کی اسلامی یونیورسٹی سے عقیدے میں ڈاکٹریٹ ⁦(2016ء)⁩ کیا، 2012ء سے 2018ء تک سعودی حکومت کی تقرری پر مسجد نبوی میں انڈونیشی زبان کے دروس دیے، ریڈیو روجا اور روجا ٹی وی کی باقاعدہ آواز ہیں، اور عقیدہ، فقہ و تفسیر پر درجنوں کتابیں لکھیں؛ ان کے سرکاری یوٹیوب چینل کے تقریباً 8 لاکھ 53 ہزار سبسکرائبر ہیں۔"
