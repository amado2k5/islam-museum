summary:
  ar: "عالم وداعية إندونيسي، وُلد في سورابايا في 28 أكتوبر 1979، درس في الجامعة الإسلامية بالمدينة المنورة حتى نال الدكتوراه في العقيدة سنة 2016، وألقى الدروس باللغة الإندونيسية في المسجد النبوي بين 2012 و2018 بتكليف من الحكومة السعودية، وهو من أعلام إذاعة وتلفزيون رودجا، وله عشرات الكتب في العقيدة والفقه والتفسير، وقناته الرسمية على يوتيوب يتابعها نحو 853 ألف مشترك."
  en: "Indonesian scholar and preacher, born in Surabaya on 28 October 1979. He studied at the Islamic University of Madinah through a doctorate in aqidah (2016), delivered the Indonesian-language studies at the Prophet's Mosque in Madinah from 2012 to 2018 on a Saudi government appointment, is a regular voice of Radio Rodja and Rodja TV, and has written dozens of books on creed, jurisprudence and Qur'an commentary; his official YouTube channel has about 853,000 subscribers."
  ur: "انڈونیشی عالم اور مبلغ، جو 28 اکتوبر 1979ء کو سورابایا میں پیدا ہوئے۔ انہوں نے مدینہ منورہ کی اسلامی یونیورسٹی سے عقیدے میں ڈاکٹریٹ ⁦(2016ء)⁩ کیا، 2012ء سے 2018ء تک سعودی حکومت کی تقرری پر مسجد نبوی میں انڈونیشی زبان کے دروس دیے، ریڈیو روجا اور روجا ٹی وی کی باقاعدہ آواز ہیں، اور عقیدہ، فقہ و تفسیر پر درجنوں کتابیں لکھیں؛ ان کے سرکاری یوٹیوب چینل کے تقریباً 8 لاکھ 53 ہزار سبسکرائبر ہیں۔"
  es: "Erudito y predicador indonesio, nacido en Surabaya el 28 de octubre de 1979. Estudió en la Universidad Islámica de Medina, donde obtuvo un doctorado en aqidah (2016). Impartió clases de lengua indonesia en la Mezquita del Profeta en Medina entre 2012 y 2018 por encargo del gobierno saudí. Es colaborador habitual de Radio Rodja y Rodja TV, y ha escrito decenas de libros sobre credo, jurisprudencia y comentarios del Corán. Su canal oficial de YouTube cuenta con unos 853.000 suscriptores."
  fr: "Érudit et prédicateur indonésien, né à Surabaya le 28 octobre 1979. Il a étudié à l'Université islamique de Médine où il a obtenu un doctorat en aqidah (2016), a enseigné les études en langue indonésienne à la Mosquée du Prophète à Médine de 2012 à 2018 sur nomination du gouvernement saoudien, est une voix régulière de Radio Rodja et Rodja TV, et a écrit des dizaines de livres sur la croyance, la jurisprudence et le commentaire du Coran; sa chaîne YouTube officielle compte environ 853 000 abonnés."
  tr: "28 Ekim 1979'da Surabaya'da doğan Endonezyalı bir alim ve vaiz olan Sher, 2016'da İnanç doktorasını alana kadar Medine İslam Üniversitesi'nde eğitim gördü. 2012-2018 yılları arasında Suudi hükümetinin talebi üzerine Peygamber Camii'nde Endonezce dersler verdi. Rodja Radyo ve Televizyonu'nda önde gelen bir figürdür; inanç, fıkıh ve tefsir üzerine onlarca kitap yazmıştır. Resmi YouTube kanalını yaklaşık 853.000 abone takip etmektedir."
  id: "Seorang cendekiawan dan pengkhotbah Indonesia, lahir di Surabaya pada 28 Oktober 1979, ia belajar di Universitas Islam Madinah hingga meraih gelar doktor dalam kredo pada tahun 2016. Ia memberikan kuliah dalam bahasa Indonesia di Masjid Nabi antara tahun 2012 dan 2018 atas permintaan pemerintah Saudi. Ia adalah tokoh terkemuka di Radio dan Televisi Rodja, menulis puluhan buku tentang kredo, hukum, dan tafsir. Saluran YouTube resminya diikuti oleh sekitar 853.000 pelanggan."
