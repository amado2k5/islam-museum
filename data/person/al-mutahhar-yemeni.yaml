summary:
  ar: "محمد المطهر بن يحيى شرف الدين بن أحمد، فخر الدين، من أئمة الزيدية في اليمن، حاصر أباه ثم بويع له بعد وفاته سنة 964 هـ وملك أعالي اليمن وحاربه العثمانيون ثم صالحوه على صعدة وكوكبان، توفي سنة 980 هـ."
  en: "Muhammad al-Mutahhar ibn Yahya Sharaf al-Din ibn Ahmad, Fakhr al-Din, a Zaydi imam of Yemen; pledged to after his father's death in 964 AH, he ruled the Yemeni highlands, fought the Ottomans for years and then made peace keeping Sa'da and Kawkaban; died 980 AH (1572)."
  fr: "Muhammad al-Mutahhar ibn Yahya Sharaf al-Din ibn Ahmad, Fakhr al-Din, un imam zaydi du Yémen ; Après la mort de son père en 964 de l’hégire, il a gouverné les hauts plateaux yéménites, a combattu les Ottomans pendant des années et a ensuite fait la paix en gardant Saada et Kawkaban ; est mort en 980 de l’hégire (1572)."
  es: "Muhammad al-Mutahhar ibn Yahya Sharaf al-Din ibn Ahmad, Fakhr al-Din, un imán zaidí de Yemen; tras la muerte de su padre en el año 964 de la Hégira, gobernó las tierras altas de Yemen, luchó contra los otomanos durante años y luego estableció el mantenimiento de la paz en Sa'da y Kawkaban; murió en el año 980 de la Hégira (1572)."
  ur: "محمد المطہر بن یحییٰ شرف الدین ابن احمد، فخر الدین، یمن کے زیدی امام؛ 964 ہجری میں اپنے والد کی وفات کے بعد عہد کیا، اس نے یمنی پہاڑی علاقوں پر حکومت کی، برسوں تک عثمانیوں سے جنگ کی اور پھر سعدہ اور کوکبان میں امن قائم کیا۔ وفات 980ھ (1572)۔"
  tr: "Muhammed el-Mütahhar ibn Yahya Şeraf el-Din ibn Ahmed, Fakhr al-Din, Yemen'in önde gelen Zeydi âlimlerinden biriydi. Babasını kuşattı, ardından babasının ölümünden sonra 964 Hicri ona bağlılık yemini etti. Yukarı Yemen kralı oldu, Osmanlılara karşı savaştı ve ardından Sa'de ve Kawkban konusunda onunla barıştı. 980 Hicri'de öldü."
  id: "Muhammad al-Mutahhar ibn Yahya Sharaf al-Din ibn Ahmad, Fakhr al-Din, adalah salah satu ulama Zaydi terkemuka di Yaman. Ia mengepung ayahnya, lalu bersumpah setia kepadanya setelah kematiannya pada tahun 964 H. Ia menjadi raja Yaman Atas, berperang melawan Ottoman, lalu berdamai dengannya atas Sa'dah dan Kawkban. Ia meninggal pada tahun 980 H."
