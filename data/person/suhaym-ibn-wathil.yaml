class: person
label: { ar: "سحيم بن وثيل الرياحي", en: "Suhaym ibn Wathil", es: "Suhaym ibn Wathil", fr: "Suhaym ibn Wathil", ur: "سہیم بن واثل" }
summary:
  ar: "سحيم بن وثيل الرياحي؛ رئيس بني رياح؛ اشتهرت منافرته مع غالب بن صعصعة والد الفرزدق في مجاعة أصابت أهل الكوفة فعقر غالب لأهله ناقة فعقر سحيم مثلها ثم زادا حتى عقر غالب في اليوم الرابع مائة ناقة فلم يكن عند سحيم هذا القدر؛ فلما دخل الناس الكوفة عقر سحيم ثلثمائة ناقة وقال للناس: شأنكم والأكل؛ وكان ذلك في خلافة علي بن أبي طالب فاستُفتي في حل الأكل منها فقضى بحرمتها وقال: هذه ذُبحت لغير مأكلة {cite:wafayat-ayan}."
  en: "Suhaym b. Wathil al-Riyahi — chief of Banu Riyah, al-Farazdaq's grandfather-in-rivalry; the famous camel-slaughter contest with Ghalib b. Sa'sa'a during a Kufa famine, ended when Ali b. Abi Talib ruled the meat unlawful for having been slaughtered for vainglory, not food {cite:wafayat-ayan}."
  es: "Suhaym b. Wathil al-Riyahi — jefe de Banu Riyah, abuelo rival de al-Farazdaq; el famoso concurso de sacrificio de camellos con Ghalib b. Sa'sa'a durante una hambruna en Kufa, terminó cuando Ali b. Abi Talib dictaminó que la carne era ilícita por haber sido sacrificada por vanagloria, no por alimento {cite:wafayat-ayan}."
  fr: "Suhaym b. Wathil al-Riyahi — chef des Banu Riyah, grand-père rival d'al-Farazdaq; le célèbre concours d'abattage de chameaux avec Ghalib b. Sa'sa'a pendant une famine à Kufa, s'est terminé lorsqu'Ali b. Abi Talib a déclaré la viande illicite car elle avait été abattue par vanité, et non pour se nourrir {cite:wafayat-ayan}."
  ur: "سہیم بی۔ واثل الریاضی - بنو ریا کا سردار، الفرازدق کے دادا کی دشمنی؛ غالب کے ساتھ اونٹ ذبح کرنے کا مشہور مقابلہ۔ صعصع کوفہ کے قحط کے دوران اس وقت ختم ہوا جب علی بن۔ ابی طالب نے اس گوشت کو حرام قرار دیا کیونکہ اس کا ذبیحہ شوخی کے لیے کیا گیا تھا، نہ کہ کھانے کو۔"
