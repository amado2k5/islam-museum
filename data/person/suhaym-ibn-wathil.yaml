label: { ar: "سحيم بن وثيل الرياحي", en: "Suhaym ibn Wathil" }
summary:
  ar: "سحيم بن وثيل الرياحي؛ رئيس بني رياح؛ اشتهرت منافرته مع غالب بن صعصعة والد الفرزدق في مجاعة أصابت أهل الكوفة فعقر غالب لأهله ناقة فعقر سحيم مثلها ثم زادا حتى عقر غالب في اليوم الرابع مائة ناقة فلم يكن عند سحيم هذا القدر؛ فلما دخل الناس الكوفة عقر سحيم ثلثمائة ناقة وقال للناس: شأنكم والأكل؛ وكان ذلك في خلافة علي بن أبي طالب فاستُفتي في حل الأكل منها فقضى بحرمتها وقال: هذه ذُبحت لغير مأكلة {cite:wafayat-ayan}."
  en: "Suhaym b. Wathil al-Riyahi — chief of Banu Riyah, al-Farazdaq's grandfather-in-rivalry; the famous camel-slaughter contest with Ghalib b. Sa'sa'a during a Kufa famine, ended when Ali b. Abi Talib ruled the meat unlawful for having been slaughtered for vainglory, not food {cite:wafayat-ayan}."
