label:
  ar: "كسرو أبرويز ⁦(كسرى)⁩"
  en: "Khosrow II Parviz (Kisra)"
  ur: "کسریٰ پرویز"
  es: "Khosrow II Parviz (Kisra)"
  fr: "Khosrow II Parviz (Kisra)"
summary:
  ar: "كسرى أبرويز في المصادر آخر ملوك فارس الأقوياء من ساسان: مزق مكتوب النبي حين قُرئ عليه وقال «أيغزوني وأنا عبد الله»، فقال النبي بقوله المشهور في سقوط ملكه، ومات مقتولاً في فتنة ابنه شيرويه، وكانت أيامه آخر ملك ساسان قبل الفتوح {cite:ibn-hisham-sira} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
  en: "Khosrow II Parviz in the sources is the last strong king of Sasanian Persia: he tore the Prophet's letter when it was read to him and said 'they raid me while I am the servant of God'?, and the Prophet's saying about the fall of his rule is famous; he was killed in the revolt of his son Shirawayh, and his days closed the Sasanian kingship before the conquests {cite:ibn-hisham-sira} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
  ur: "کسریٰ پرویز مصادر میں ساسانی فارس کا آخری طاقتور بادشاہ ہے: اس نے نبی کا خط پڑھے جانے پر پھاڑ دیا، اور نبی کا اس کی سلطنت کے زوال کے بارے میں قول مشہور ہے؛ وہ اپنے بیٹے شیرویہ کی بغاوت میں مارا گیا اور اس کے زمانے کے ساتھ ساسانی بادشاہت فتوحات سے پہلے ختم ہوئی۔"
  es: "Según las fuentes, Khosrow II Parviz es el último rey fuerte de la Persia sasánida: rompió la carta del Profeta cuando se la leyeron y dijo: «¿Me atacan mientras soy el siervo de Dios?», y es famosa la frase del Profeta sobre la caída de su gobierno; murió en la revuelta de su hijo Shirawayh, y sus días pusieron fin a la monarquía sasánida antes de las conquistas {cite:ibn-hisham-sira} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
  fr: "Khosrow II Parviz est, selon les sources, le dernier roi puissant de la Perse sassanide: il déchira la lettre du Prophète lorsqu'on la lui lut et dit: « Ils me pillent alors que je suis le serviteur de Dieu ? » La parole du Prophète concernant la chute de son règne est célèbre; il fut tué lors de la révolte de son fils Shirawayh, et ses jours marquèrent la fin de la royauté sassanide avant les conquêtes {cite:ibn-hisham-sira} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
  tr: "Kaynaklarda Husrov Abruiz, Sasan'dan gelen son güçlü Persler kralıdır: Peygamber'in mektubu ona okunduğunda parçalandı ve \"Ben Abdullah iken beni işgal edecekler mi?\" dedi. Peygamber, hükümdarlığının düşüşüne dair ünlü sözünü söyledi ve oğlu Şiruyeh'in karmaşasında öldü. Günleri, fetihlerden önceki son Sasani kralıydı {cit:ibn-hisham-sira} {cite:Tarikh-al-tabari} {cite:Mubarakpuri-raheeq}."
  id: "Khosrow Abruiz dalam sumber-sumber adalah raja terakhir yang berkuasa di Persia dari Sassan: Surat Nabi dihancurkan ketika dibacakan kepadanya dan ia berkata, \"Apakah mereka akan menyerang saya saat saya masih Abdullah?\" Nabi berkata dengan ucapan terkenalnya tentang jatuhnya pemerintahannya, dan ia meninggal tewas dalam kekacauan putranya Shiruyeh. Hari-harinya adalah raja Sasanian terakhir sebelum penaklukan {cite:ibn-hisham-sira} {cite:Tarikh-al-tabari} {cite:Mubarakpuri-raheeq}."
