label:
  ar: "كسرو أبرويز (كسرى)"
  en: "Khosrow II Parviz (Kisra)"
  ur: "کسریٰ پرویز"
summary:
  ar: "كسرى أبرويز في المصادر آخر ملوك فارس الأقوياء من ساسان: مزق مكتوب النبي حين قُرئ عليه وقال «أيغزوني وأنا عبد الله»، فقال النبي بقوله المشهور في سقوط ملكه، ومات مقتولاً في فتنة ابنه شيرويه، وكانت أيامه آخر ملك ساسان قبل الفتوح {cite:ibn-hisham-sira} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
  en: "Khosrow II Parviz in the sources is the last strong king of Sasanian Persia: he tore the Prophet's letter when it was read to him and said 'they raid me while I am the servant of God'?, and the Prophet's saying about the fall of his rule is famous; he was killed in the revolt of his son Shirawayh, and his days closed the Sasanian kingship before the conquests {cite:ibn-hisham-sira} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
  ur: "کسریٰ پرویز مصادر میں ساسانی فارس کا آخری طاقتور بادشاہ ہے: اس نے نبی کا خط پڑھے جانے پر پھاڑ دیا، اور نبی کا اس کی سلطنت کے زوال کے بارے میں قول مشہور ہے؛ وہ اپنے بیٹے شیرویہ کی بغاوت میں مارا گیا اور اس کے زمانے کے ساتھ ساسانی بادشاہت فتوحات سے پہلے ختم ہوئی۔"
