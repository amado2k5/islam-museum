id: person/jawad-ibn-sad-al-kazimi
class: person
label:
  ar: "جواد بن سعد الكاظمي"
  en: "Jawad ibn Sa'd al-Kazimi"
  es: "Jawad ibn Sa'd al-Kazimi"
  fr: "Jawad ibn Sa'd al-Kazimi"
  ur: "جواد بن سعد کاظمی"
roles: [jurist, scholar]
gender: male
summary:
  ar: "جواد بن سعد، أو سعيد، بن جواد البغدادي الكاظمي، فقيه من أهل الكاظمين ببغداد، رحل إلى إيران وبلغ مرتبة شيخ الإسلام في أستراباد ثم طرده أهلها، وتوفي سنة 1065 هـ الموافقة 1655 م."
  en: "Jawad ibn Sa'd (or Sa'id) ibn Jawad al-Baghdadi al-Kazimi, a jurist of al-Kazimayn in Baghdad who went to Iran, reached the rank of shaykh al-Islam in Astarabad and was driven out by its people; he died in 1065 AH (1655 CE)."
  es: "Jawad ibn Sa'd (o Sa'id) ibn Jawad al-Baghdadi al-Kazimi, jurista de al-Kazimayn en Bagdad que fue a Irán, alcanzó el rango de shaykh al-Islam en Astarabad y fue expulsado por su gente; murió en 1065 AH (1655 d. C.)."
  fr: "Jawad ibn Sa'd (ou Sa'id) ibn Jawad al-Baghdadi al-Kazimi, un juriste d'al-Kazimayn à Bagdad qui se rendit en Iran, atteignit le rang de cheikh al-Islam à Astarabad et fut chassé par ses habitants; il mourut en 1065 AH (1655 CE)."
  ur: "جواد بن سعد ⁦(یا سعید)⁩ ابن جواد البغدادی الکاظمی، جو بغداد میں الکظیمین کے ایک فقیہ تھے جو ایران گئے، استرآباد میں شیخ الاسلام کے عہدے پر پہنچے اور وہاں کے لوگوں نے انہیں نکال باہر کیا۔ ان کی وفات 1065ھ ⁦(1655ء)⁩ میں ہوئی۔"
  tr: "Cavad bin Sad ya da Said, ibn Cawad el-Bağdadi el-Kazimi, Bağdat'taki el-Kazima halkından bir hukukçuydu. İran'a seyahat etti ve Astrabad'da Şeyh al-İslam rütbesine ulaştı, ancak oradaki halk tarafından sürgün edildi. 1065 Hicri'de, yani 1655 M.S. yılında öldü."
  id: "Jawad ibn Sa'd, atau Sa'id, ibn Jawad al-Baghdadi al-Kadhimi, adalah seorang ahli hukum dari masyarakat al-Kadhima di Baghdad. Ia melakukan perjalanan ke Iran dan mencapai pangkat Sheikh al-Islam di Astrabad, namun diusir oleh rakyatnya. Ia meninggal pada tahun 1065 H, yang bertepatan dengan tahun 1655 M."
