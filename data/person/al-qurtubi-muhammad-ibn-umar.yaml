summary:
  ar: "الرجل الصالح المالكي؛ حج وسمع من عبد المنعم بن الفراوي وطائفة، وقرأ القراءات على أبي القاسم الشاطبي، وكان إماماً زاهداً متقناً بارعاً في عدة علوم كالفقه والقراءات والعربية، طويل الباع في التفسير؛ توفي بالمدينة المنورة في صفر {cite:shadharat-dhahab p. 145}."
  en: "al-Qurtubi Abu Abdallah Muhammad b. Umar (d. Safar 631) — the Maliki muqri' who read the seven readings under al-Shatibi himself; ascetic imam, long of reach in tafsir; died at Medina {cite:shadharat-dhahab p. 145}."
  fr: "al-Qurtubi Abu Abdallah Muhammad b. Umar (d. Safar 631) – le Maliki muqri' qui a lu les sept lectures sous al-Shatibi lui-même ; imam ascétique, longue portée en tafsir ; est mort à Médine {cite:shadharat-dhahab p. 145}."
  es: "al-Qurtubi Abu Abdallah Muhammad b. Umar (m. Safar 631): el muqri' de Maliki que leyó las siete lecturas bajo la dirección del propio al-Shatibi; imán asceta, de largo alcance en tafsir; murió en Medina {citar: shadharat-dhahab p. 145}."
  ur: "القرطبی ابو عبداللہ محمد بن عمر ⁦(متوفی صفر 631)⁩ - مالکی مقری جو خود الشاطبی کے تحت سات قراءتیں پڑھتے ہیں۔ سنیاسی امام، تفسیر میں طویل رسائی؛ مدینہ میں وفات پائی۔ 145}۔"
  tr: "Doğru Maliki adamı; Hac yaptı ve Abdülmunim bin Feravi ile bir gruptan dinledi, Kur'an okumalarını Ebu el-Kasım el-Şatibi'nin yanında inceledi ve fıkıh, Kur'an okumaları ve Arapça gibi çeşitli bilimlerde yetenekli, münzevi, yetenekli bir imamdı. Tafsirde çok yetkindi; Medine'de Sefer'de vefat etti {kaynak: şadharat-dhahab, s. 145}."
  id: "Seorang Malki yang berwibawa; ia melaksanakan Haji dan mendengar dari Abd al-Mun'im ibn al-Farawi serta kelompoknya, mempelajari bacaan Al-Qur'an di bawah bimbingan Abu al-Qasim al-Shatibi, dan merupakan seorang pertapa yang terampil dalam berbagai ilmu seperti firitur, bacaan Al-Qur'an, dan bahasa Arab. Ia sangat mahir dalam tafsir; ia meninggal di Madinah di Safar {cite:shadharat-dhahab, hlm. 145}."
