summary:
  ar: "بطاقة أولية لسلطان حسين، تاسع شاهات الدولة الصفوية الذي سقطت أصفهان في عهده بيد الأفغان، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Sultan Husayn, ninth Safavid shah in whose reign Isfahan fell to the Afghans, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para el sultán Husayn, noveno shah safávida durante cuyo reinado Isfahán cayó en manos de los afganos, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de projet du sultan Husayn, neuvième shah safavide sous le règne duquel Ispahan tomba aux mains des Afghans, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "سلطان حسین، نویں صفوید شاہ کے لیے ڈرافٹ کارڈ جس کے دور حکومت میں اصفہان افغانوں کے قبضے میں چلا گیا، جس کا نام ایک کھلے حوالہ سے بیان کیا گیا ⁦(وکی ڈیٹا)⁩؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
