summary:
  ar: "الملا مصنفك الشاهرودي البسطامي من أولاد الإمام فخر الدين الرازي؛ لقب بمصنفك لاشتغاله بالتصنيف في حداثة سنه، ولد سنة ثلاث وثمانمائة وسافر مع أخيه إلى هراة لتحصيل العلوم سنة اثنتي عشرة وثمانمائة وقرأ على جلال الدين يوسف الأوبهي تلميذ التفتازاني وعلى قطب الدين الهروي وفقه الشافعي على عبد العزيز الأبهري والحنفي على فصيح الدين، ثم لما أتى بلاد الروم صار مدرساً بسابقونية فعرض له الصمم فأتى قسطنطينية فعين له السلطان محمد كل يوم ثمانين درهماً، وروى عنه أنه لقى بعض مشايخ بلاد العجم وجازاه بقوله أسأت الأدب عندي وإنك تجازى بالصمم وبأن لا يبقى بعدك عقب، وكان إماماً علامة صوفياً أجيز له بالإرشاد من بعض خلفاء زين الدين الخوافي وكان سريع الكتابة يكتب كل يوم كراساً، ومن تصانيفه شرح الإرشاد وشرح المصباح في النحو وشرح آداب البحث وشرح اللباب وشرح المطول وشرح شرح المفتاح للتفتازاني وحاشية على التلويح وشرح البزدوي وشرح القصيدة الروحية لابن سينا وشرح الوقاية والهداية وحدائق الإيمان لأهل العرفان وشرح مصابيح البغوي وشرح الكشاف وصنف باللسان الفارسي أنوار الأحداق وتحفة السلاطين والتفسير الفارسي آحاد في ترتيبه اعتذر عن تأليفه بهذا اللسان أنه أمره بذلك السلطان محمد خان، وتوفي بالقسطنطينية ودفن قرب مقام أبي أيوب الأنصاري سنة خمس وسبعين وثمانمائة {cite:shadharat-dhahab p. 319-321}."
  en: "Musannifak (b. 803, of Fakhr al-Din al-Razi's line) — the deaf Ottoman polymath: Mehmed II granted him 80 dirhams daily, he wrote a kurrasa a day; sharhs on al-Mutawwal, the Kashshaf, Ibn Sina's spiritual qasida and a Persian tafsir 'written at the sultan's command'; died at Constantinople 875, buried near Abu Ayyub's shrine {cite:shadharat-dhahab p. 319-321}."
  es: "Musannifak (n. 803, de la línea de Fakhr al-Din al-Razi) — el polímata otomano sordo: Mehmed II le concedió 80 dirhams diarios, escribió una kurrasa al día; sharhs sobre al-Mutawwal, el Kashshaf, la qasida espiritual de Ibn Sina y un tafsir persa 'escrito por orden del sultán'; murió en Constantinopla en 875, enterrado cerca del santuario de Abu Ayyub {cite:shadharat-dhahab p. 319-321}."
  fr: "Musannifak (né en 803, de la lignée de Fakhr al-Din al-Razi) — le polymathe ottoman sourd: Mehmed II lui accorda 80 dirhams par jour, il écrivit une kurrasa par jour; des sharhs sur al-Mutawwal, le Kashshaf, la qasida spirituelle d'Ibn Sina et un tafsir persan « écrit sur l'ordre du sultan »; mourut à Constantinople en 875, enterré près du mausolée d'Abu Ayyub {cite: shadharat-dhahab p. 319-321}."
  ur: "مسنیفک ⁦(وفات: 803، فخر الدین الرازی کے سلسلے میں)⁩ - بہرے عثمانی پولیمتھ: محمد دوم نے اسے 80 درہم یومیہ دیا، اس نے روزانہ ایک قرصہ لکھا؛ شرح المتوال، کشف، ابن سینا کا روحانی قصیدہ اور فارسی تفسیر 'سلطان کے حکم پر لکھی گئی'؛ قسطنطنیہ 875 میں وفات پائی، ابو ایوب کے مزار کے قریب دفن ہوئے۔ 319-321}۔"
  tr: "Molla Musannafak el-Şehrudi el-Bastami, İmam Fakhr al-Din al-Razi'nin soyundan geliyordu; erken dönem yazılı çalışmaları nedeniyle Musannafak lakabını aldı. 803 Hicri yılında doğdu ve 812 Hicri'de kardeşiyle birlikte bilgi edinmek için Herat'a gitti. Celaleddin Yusuf el-Ubahi'nin öğrencisi, el-Teftizani'nin öğrencisi olan Kutsubdin el-Haravi, Abdülaziz el-Abhari'nin yanında el-Şafii ve Fasih al-Din döneminde el-Hanefi eğitimi aldı. Sonra Romalıların topraklarına geldiğinde Saqisconiya'da öğretmen oldu, bu yüzden sağırdı. Konstantinopolis'e giderek Sultan Muhammed ona günde seksen dirhem verdi. Kendisinden rivayet edildiği gibi, Fars topraklarının bazı şeyhleriyle karşılaştı ve onu, 'Adaklarımı mahvettin, sağır oldun ve senden sonra hiçbir soy kalmayacak.' diyerek cezalandırdı. O, bir imam, bir tasavvuf âlimdi, Zeydin el-Khawafi'nin bazı halifeleri tarafından rehberlik etmeye yetkili ve her gün bir defter yazarak hızlıca yazırdı. Eserleri arasında Şerh el-İrşad, Şerh el-Misbah fi el-Nahv, Şerh Adab el-Bahth, Şerh al-Lubab, Şerh al-Matwul, Şerh Şerh el-Miftah, el-Taftazani'nin Şerh Şerh el-Miftah, İbn Sina'nın Şerh al-Bazdavi, Şerh al-Ruhiyye, Şerh al-Vaqaya, el-Hidayah ve Hada'iq al-İman üzerine kenar tefsiri yer alır Ahl al-Irfan, Sharh Masabih al-Baghawi, Sharh al-Kashaf adlı eserleri yazdı ve Farsça olarak Enver el-Ahdak, Tuhfat el-Sultanateen ve Farsça Tafsir Ahad eserlerini kaleme aldı. Düzenlemesinde, Sultan Muhammed Han emrettiği için bu dilde yazmaktan muaf göründü. Konstantinopolis'te öldü ve 875 Hicri yılında Ebu Eyyüb el-Ensari türbesinin yakınında defnedildi {atıf:şadharat-dhahab, s. 319-321}."
  id: "Mulla Musannafak al-Shahrudi al-Bastami adalah keturunan Imam Fakhr al-Din al-Razi; ia dijuluki Musannafak karena karya awalnya dalam menulis. Ia lahir pada tahun 803 H dan melakukan perjalanan bersama saudaranya ke Herat untuk mempelajari ilmu pada tahun 812 H. Ia belajar di bawah bimbingan Jalal al-Din Yusuf al-Ubahi, murid al-Taftazani, Qutb al-Din al-Harawi, dan yurisprudensi al-Shafi'i di bawah Abd al-Aziz al-Abhari, serta al-Hanafi di bawah Fasih al-Din. Kemudian, ketika ia datang ke tanah Romawi, ia menjadi guru di Saqisconiya, sehingga ia tuli. Ia pergi ke Konstantinopel, di mana Sultan Muhammad memberinya delapan puluh dirham setiap hari. Ia diceritakan bahwa ia bertemu beberapa sheikh dari tanah Persia dan menghukumnya dengan berkata, 'Kamu telah merusak tata krama saya dan kamu diberi hadiah tuli dan tidak akan ada keturunan yang tersisa setelah kamu.' Dia adalah seorang imam, ulama Sufi, diberi wewenang untuk membimbing oleh beberapa khalifah Zain al-Din al-Khawafi, dan cepat menulis, menulis buku catatan setiap hari. Di antara karyanya adalah Sharh al-Irshad, Sharh al-Misbah fi al-Nahw, Sharh Adab al-Bahth, Sharh al-Lubab, Sharh al-Matwul, Sharh Sharh al-Miftah oleh al-Taftazani, komentar pinggiran tentang al-Talawih, Sharh al-Bazdawi, Sharh al-Ruhiyyah oleh Ibn Sina, Sharh al-Waqaya, al-Hidayah, dan Hada'iq al-Iman Ia menulis Ahl al-Irfan, Sharh Masabih al-Baghawi, Sharh al-Kashaf, dan menulis dalam bahasa Persia karya-karya Anwar al-Ahdaq, Tuhfat al-Sultanateen, dan Tafsir Ahad Persia. Dalam peraturannya, ia meminta izin untuk menulisnya dalam bahasa ini karena Sultan Muhammad Khan memerintahkannya. Ia meninggal di Konstantinopel dan dimakamkan di dekat makam Abu Ayyub al-Ansari pada tahun 875 H {cite:shadharat-dhahab, hlm. 319-321}."
