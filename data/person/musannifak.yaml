summary:
  ar: "الملا مصنفك الشاهرودي البسطامي من أولاد الإمام فخر الدين الرازي؛ لقب بمصنفك لاشتغاله بالتصنيف في حداثة سنه، ولد سنة ثلاث وثمانمائة وسافر مع أخيه إلى هراة لتحصيل العلوم سنة اثنتي عشرة وثمانمائة وقرأ على جلال الدين يوسف الأوبهي تلميذ التفتازاني وعلى قطب الدين الهروي وفقه الشافعي على عبد العزيز الأبهري والحنفي على فصيح الدين، ثم لما أتى بلاد الروم صار مدرساً بسابقونية فعرض له الصمم فأتى قسطنطينية فعين له السلطان محمد كل يوم ثمانين درهماً، وروى عنه أنه لقى بعض مشايخ بلاد العجم وجازاه بقوله أسأت الأدب عندي وإنك تجازى بالصمم وبأن لا يبقى بعدك عقب، وكان إماماً علامة صوفياً أجيز له بالإرشاد من بعض خلفاء زين الدين الخوافي وكان سريع الكتابة يكتب كل يوم كراساً، ومن تصانيفه شرح الإرشاد وشرح المصباح في النحو وشرح آداب البحث وشرح اللباب وشرح المطول وشرح شرح المفتاح للتفتازاني وحاشية على التلويح وشرح البزدوي وشرح القصيدة الروحية لابن سينا وشرح الوقاية والهداية وحدائق الإيمان لأهل العرفان وشرح مصابيح البغوي وشرح الكشاف وصنف باللسان الفارسي أنوار الأحداق وتحفة السلاطين والتفسير الفارسي آحاد في ترتيبه اعتذر عن تأليفه بهذا اللسان أنه أمره بذلك السلطان محمد خان، وتوفي بالقسطنطينية ودفن قرب مقام أبي أيوب الأنصاري سنة خمس وسبعين وثمانمائة {cite:shadharat-dhahab p. 319-321}."
  en: "Musannifak (b. 803, of Fakhr al-Din al-Razi's line) — the deaf Ottoman polymath: Mehmed II granted him 80 dirhams daily, he wrote a kurrasa a day; sharhs on al-Mutawwal, the Kashshaf, Ibn Sina's spiritual qasida and a Persian tafsir 'written at the sultan's command'; died at Constantinople 875, buried near Abu Ayyub's shrine {cite:shadharat-dhahab p. 319-321}."
