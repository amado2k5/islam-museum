summary:
  ar: "إبراهيم بن سعد بن أبي وقاص الزهري المدني، ابن الصحابي سعد بن أبي وقاص، روى عن أبيه وعن أسامة بن زيد في حديث الطاعون، وأفرده البخاري بترجمة مستقلة عن إبراهيم بن سعد بن إبراهيم بن عبد الرحمن بن عوف الزهري؛ ولا تُعرف له سنة ولادة ولا وفاة في المصادر التي قُرئت {cite:tarikh-kabir-dabbasi-v1 p. 699}."
  en: "Ibrahim ibn Sa'd ibn Abi Waqqas al-Zuhri al-Madani, a son of the Companion Sa'd ibn Abi Waqqas, narrated from his father and from Usama ibn Zayd the hadith on the plague. Al-Bukhari gives him an entry of his own, separate from Ibrahim ibn Sa'd ibn Ibrahim ibn 'Abd al-Rahman ibn 'Awf al-Zuhri, and the sources read give neither a birth nor a death date. The dates 726 to 799 formerly on this card belong to that other man (see person/ibrahim-ibn-sad-al-zuhri) {cite:tarikh-kabir-dabbasi-v1 p. 699}."
  es: "Ibrahim ibn Sa'd ibn Abi Waqqas al-Zuhri al-Madani, hijo del Compañero Sa'd ibn Abi Waqqas, narró de su padre y de Usama ibn Zayd el hadiz sobre la peste. Al-Bujari le dedica una entrada propia, separada de Ibrahim ibn Sa'd ibn Ibrahim ibn 'Abd al-Rahman ibn 'Awf al-Zuhri, y las fuentes consultadas no proporcionan ni fecha de nacimiento ni de muerte. Las fechas 726 a 799 que figuran anteriormente en esta ficha pertenecen a ese otro hombre (véase person/ibrahim-ibn-sad-al-zuhri) {cite:tarikh-kabir-dabbasi-v1 p. 699}."
  fr: "Ibrahim ibn Sa'd ibn Abi Waqqas al-Zuhri al-Madani, fils du Compagnon Sa'd ibn Abi Waqqas, a rapporté de son père et d'Usama ibn Zayd le hadith relatif à la peste. Al-Bukhari lui consacre une entrée distincte, séparée de celle d'Ibrahim ibn Sa'd ibn Ibrahim ibn 'Abd al-Rahman ibn 'Awf al-Zuhri, et les sources consultées ne précisent ni sa date de naissance ni sa date de décès. Les dates 726 à 799, figurant auparavant sur cette fiche, correspondent à cet autre homme (voir personne/ibrahim-ibn-sad-al-zuhri) {cite:tarikh-kabir-dabbasi-v1 p. 699}."
  ur: "صحابی سعد بن ابی وقاص کے بیٹے ابراہیم بن سعد بن ابی وقاص الزہری المدنی نے اپنے والد سے اور اسامہ بن زید سے طاعون کی حدیث روایت کی ہے۔ البخاری نے اسے ابراہیم بن سعد بن ابراہیم بن عبدالرحمٰن بن عوف الزہری سے الگ ان کا اپنا ایک اندراج دیا ہے اور جو ماخذ پڑھے گئے ہیں ان میں نہ تو پیدائش کی تاریخ ہے اور نہ ہی تاریخ وفات۔ اس کارڈ پر 726 تا 799 تاریخیں پہلے اس دوسرے آدمی کی ہیں ⁦(دیکھیں شخص/ابراہیم ابن سعد الزہری)⁩ 699}۔"
  tr: "İbrahim ibn Said ibn Abi Vakkas el-Zühri el-Medeni, sahabe Said ibn Ebi Vakqas'ın oğlu, babasından ve Usama ibn Zayd'den veba hadisinde rivayet etmiştir. El-Buhari tek başına İbrahim ibn Sa'd ibn İbrahim ibn İbrahim ibn Abdülrahman ibn Avf al-Zuhri'den bağımsız bir biyografi ile anlatmıştır; doğum veya ölüm yılı okunan kaynaklarda bilinmemektedir {atıf:Tarikh-kabir-dabbasi-v1, s. 699}."
  id: "Ibrahim ibn Sa'd ibn Abi Waqqas al-Zuhri al-Madani, putra sahabat Sa'd ibn Abi Waqqas, menceritakan dari ayahnya dan dari Usama ibn Zayd dalam hadis wabah. Hanya Al-Bukhari yang menceritakannya beserta biografi independen dari Ibrahim ibn Sa'd ibn Abd al-Rahman ibn Awf al-Zuhri; tahun kelahiran atau kematiannya tidak diketahui dalam sumber-sumber yang telah dibaca {cite:Tarikh-kabir-dabbasi-v1, hlm. 699}."
