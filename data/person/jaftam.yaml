summary:
  ar: رجل ذكره الراويان في خبر دعاء الهادي عليه أن يخرجه الله من اليمن، فخرج قبل أن يحول الحول بحسب روايتهما.
  en: A man named by the two narrators in the report of al-Hadi's prayer that God drive him out of Yemen, who left before the year turned according to their account.
  ur: ایک شخص جس کا ذکر دونوں راوی ہادی کی اس دعا کی خبر میں کرتے ہیں کہ اللہ اسے یمن سے نکال دے، اور ان کے بیان کے مطابق وہ سال گزرنے سے پہلے نکل گیا۔
  es: "Un hombre mencionado por los dos narradores en el relato de la oración de al-Hadi para que Dios lo expulsara de Yemen, quien se marchó antes de que terminara el año, según su versión."
  fr: "Un homme cité par les deux narrateurs dans le récit de la prière d'al-Hadi demandant à Dieu de le chasser du Yémen, qui est parti avant la fin de l'année selon leur récit."
  tr: "İki anlatıcının al-Hadi'nin Yemen'den Tanrı'nın onu kovması için yaptığı yalvarışın raporunda bir adamın bahsettiği, bu yüzden yıl geçmeden ayrıldığı anlatıma göre bu kişi gerçekleşti."
  id: "Seorang pria yang disebutkan oleh kedua narator dalam laporan permohonan al-Hadi agar Tuhan mengusirnya dari Yaman, sehingga ia pergi sebelum tahun berlalu menurut narasi mereka."
