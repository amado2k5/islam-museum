summary:
  ar: "أبو عيسى محمد بن سورة الترمذي من بلدة ترمذ على نهر جيحون، من كبار جامعي الحديث ومؤلف «الجامع الصحيح»، أحد الكتب الستة. رحل في طلب الحديث إلى خراسان والعراق والحجاز وتتلمذ على البخاري، وأُصيب بالعمى في أواخر عمره وتوفي في ترمذ سنة 279هـ. وبيّن في كتاب العلل طريقته في تصنيف الحديث بالصحيح والحسن والغريب، وجمع أيضاً كتاب الشمائل."
  en: "Abu Isa Muhammad ibn Sawra al-Tirmidhi, from the town of Tirmidh on the Oxus, was a great collector of hadith and the author of the Jami' al-Sahih, one of the Six Books. He travelled for traditions through Khurasan, Iraq and the Hijaz, studied under al-Bukhari, went blind late in life and died in Tirmidh in 279 AH. In his Kitab al-Ilal he set out his method of classifying hadith as sahih, hasan and gharib, and he also compiled the Shama'il."
  ur: "ابو عیسیٰ محمد بن سورہ ترمذی دریائے جیحون کے کنارے شہر ترمذ کے رہنے والے، حدیث کے بڑے جامع اور کتبِ ستہ میں شامل «الجامع الصحیح» کے مؤلف تھے۔ انہوں نے خراسان، عراق اور حجاز کے سفر کیے، بخاری سے پڑھا، آخر عمر میں نابینا ہوئے اور 279ھ میں ترمذ میں فوت ہوئے۔ کتاب العلل میں انہوں نے حدیث کو صحیح، حسن اور غریب میں تقسیم کرنے کا طریقہ بیان کیا اور شمائل بھی مرتب کی۔"
