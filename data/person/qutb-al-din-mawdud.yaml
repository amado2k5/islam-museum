roles: [ruler]
gender: male
summary:
  ar: "قطب الدين مودود بن زنكي بن آقسنقر، صاحب الموصل وديار الجزيرة إحدى وعشرين سنة؛ قبض على سليمان شاه وأسنده إلى سلطنة همذان، وتوفي سنة 565هـ وخلفه ابنه سيف الدين غازي؛ وصفه ابن الأثير بأنه من أحسن الملوك سيرة."
  en: "Qutb al-Din Mawdud b. Zangi, lord of Mosul and the Jazira for twenty-one years; he held Sultan Sulayman Shah then sent him to the sultanate of Hamadan, died 565 AH and was succeeded by his son Sayf al-Din Ghazi — Ibn al-Athir calls him one of the best kings in conduct."
  es: "Qutb al-Din Mawdud b. Zangi, señor de Mosul y Jazira durante veintiún años; mantuvo al sultán Sulayman Shah y luego lo envió al sultanato de Hamadán, murió en el año 565 de la Hégira y fue sucedido por su hijo Sayf al-Din Ghazi. Ibn al-Athir lo considera uno de los mejores reyes en cuanto a conducta."
  fr: "Qutb al-Din Mawdud b. Zangi, seigneur de Mossoul et de la Jazira pendant vingt et un ans; il a tenu le sultan Sulayman Shah puis l'a envoyé au sultanat de Hamadan, est mort en 565 AH et a été remplacé par son fils Sayf al-Din Ghazi — Ibn al-Athir le considère comme l'un des meilleurs rois en matière de conduite."
  ur: "قطب الدین مودود زنگی، اکیس سال سے موصل اور جزیرہ کا مالک؛ اس نے سلطان سلیمان شاہ کو سنبھالا پھر اسے ہمدان کی سلطنت میں بھیجا، اس کی وفات 565 ہجری میں ہوئی اور اس کے بعد اس کا بیٹا سیف الدین غازی تخت نشین ہوا - ابن الثیر اسے اخلاق کے لحاظ سے بہترین بادشاہوں میں سے ایک کہتا ہے۔"
  tr: "Musul ve Cazire topraklarının yirmi bir yıl hükümdarı olan Kutbeddin Mevdud bin Zengi bin Aksankar, Süleyman Şah'ı ele geçirip Hamadan Sultanlığı'na atadı. 565 Hicri yılında öldü, yerine oğlu Seyfeddin Gazi geçti; İbn el-Athir onu en tanınmış krallardan biri olarak tanımladı."
  id: "Qutb al-Din Mawdud ibn Zangi ibn Aqsanqar, penguasa Mosul dan wilayah Jazira selama dua puluh satu tahun, menangkap Suleiman Shah dan mengangkatnya sebagai Kesultanan Hamadan. Ia meninggal pada tahun 565 H, digantikan oleh putranya Sayf al-Din Ghazi; Ibn al-Athir menggambarkannya sebagai salah satu raja yang paling terkenal."
