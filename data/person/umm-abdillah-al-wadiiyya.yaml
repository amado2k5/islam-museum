summary:
  ar: "أم عبد الله الوادعية، واسمها عائشة بنت مقبل بن هادي الوادعي، محدّثة ومعلّمة يمنية معاصرة، بنت عالم الحديث مقبل الوادعي وربيبة دار الحديث بدماج. درّست الحديث وعلومه للنساء في دماج وألّفت للنساء والأطفال، ومن كتبها «الجامع الصحيح» و«نصيحتي للنساء»."
  en: "Umm Abdillah al-Wadi'iyya (Aisha bint Muqbil al-Wadi'i) is a contemporary Yemeni female hadith scholar and teacher, daughter of the hadith scholar Muqbil al-Wadi'i, raised in the Dar al-Hadith institute at Dammaj. She taught hadith and its sciences to women at Dammaj and wrote for women and children; her books include Al-Jami' al-Sahih and Nasihati lil-Nisa' (My Advice to Women)."
  ur: "ام عبد اللہ الوادعیہ ⁦(عائشہ بنت مقبل الوادعی)⁩ معاصر یمنی محدثہ اور معلمہ ہیں، محدث مقبل الوادعی کی صاحبزادی، جو دماج کے دار الحدیث ادارے میں پلیں بڑھیں۔ انہوں نے دماج میں خواتین کو حدیث اور اس کے علوم پڑھائے اور خواتین و بچوں کے لیے لکھا؛ ان کی کتابوں میں «الجامع الصحیح» اور «نصیحتی للنساء» شامل ہیں۔"
  es: "Umm Abdillah al-Wadi'iyya (Aisha bint Muqbil al-Wadi'i) es una erudita y maestra de hadices yemení contemporánea, hija del también erudito Muqbil al-Wadi'i, y criada en el instituto Dar al-Hadith de Dammaj. Impartió clases de hadices y sus ciencias a mujeres en Dammaj y escribió para mujeres y niños; entre sus libros destacan Al-Jami' al-Sahih y Nasihati lil-Nisa' (Mi consejo para las mujeres)."
