summary:
  ar: "السلطان محمود بن السلطان محمد بن ملكشاه السلجوقي الملقب مغيث الدين؛ ولي بعد أبيه سنة اثنتي عشرة وخمسمائة وخُطب له ببغداد وغيرها ولعمه سنجر ميامناً، وكان له معرفة بالشعر والنحو والتاريخ وكان متوقد الذكاء قوي المعرفة بالعربية حافظاً للأشعار والأمثال عارفاً بالتواريخ والسير شديد الميل إلى أهل العلم والخير، ومدحه الحيص بيص الشاعر بقصيدته الدالية المشهورة وأجازه عليها جائزة سنية؛ وكانت السلطنة في آخر أيامه قد ضعفت وقلت أموالها حتى عجزوا عن إقامة وظيفة الفقعي، وتوفي يوم الخميس منتصف شوال سنة خمس وعشرين وخمسمائة بباب أصبهان ودفن بها {cite:shadharat-dhahab p. 556-557}."
  en: "Sultan Mahmud ibn Sultan Muhammad ibn Malikshah the Saljuq, styled Mughith al-Din; enthroned after his father in 512 with the khutba at Baghdad, a client of his uncle Sanjar; he knew poetry, grammar and history — a quick mind, strong in Arabic, keeper of poems and proverbs, fond of scholars, praised by the poet al-Haysa Baysa in the famous Daliyya and richly rewarded; in his last days the sultanate weakened till the army's pay could not be met; d. Thursday mid-Shawwal 525 at Bab Isfahan, buried there {cite:shadharat-dhahab p. 556-557}."
