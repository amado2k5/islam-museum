summary:
  ar: "السلطان محمود بن السلطان محمد بن ملكشاه السلجوقي الملقب مغيث الدين؛ ولي بعد أبيه سنة اثنتي عشرة وخمسمائة وخُطب له ببغداد وغيرها ولعمه سنجر ميامناً، وكان له معرفة بالشعر والنحو والتاريخ وكان متوقد الذكاء قوي المعرفة بالعربية حافظاً للأشعار والأمثال عارفاً بالتواريخ والسير شديد الميل إلى أهل العلم والخير، ومدحه الحيص بيص الشاعر بقصيدته الدالية المشهورة وأجازه عليها جائزة سنية؛ وكانت السلطنة في آخر أيامه قد ضعفت وقلت أموالها حتى عجزوا عن إقامة وظيفة الفقعي، وتوفي يوم الخميس منتصف شوال سنة خمس وعشرين وخمسمائة بباب أصبهان ودفن بها {cite:shadharat-dhahab p. 556-557}."
  en: "Sultan Mahmud ibn Sultan Muhammad ibn Malikshah the Saljuq, styled Mughith al-Din; enthroned after his father in 512 with the khutba at Baghdad, a client of his uncle Sanjar; he knew poetry, grammar and history — a quick mind, strong in Arabic, keeper of poems and proverbs, fond of scholars, praised by the poet al-Haysa Baysa in the famous Daliyya and richly rewarded; in his last days the sultanate weakened till the army's pay could not be met; d. Thursday mid-Shawwal 525 at Bab Isfahan, buried there {cite:shadharat-dhahab p. 556-557}."
  es: "El sultán Mahmud ibn Sultan Muhammad ibn Malikshah el Selyúcida, llamado Mughith al-Din, fue entronizado después de su padre en 512 con la jutba en Bagdad, cliente de su tío Sanjar. Era versado en poesía, gramática e historia; de mente ágil, con gran dominio del árabe, guardián de poemas y proverbios, aficionado a los eruditos, elogiado por el poeta al-Haysa Baysa en la famosa Daliyya y ricamente recompensado. En sus últimos días, el sultanato se debilitó hasta el punto de que no se pudo pagar al ejército. Murió el jueves a mediados de Shawwal de 525 en Bab Isfahan, donde fue enterrado {cite:shadharat-dhahab p. 556-557}."
  fr: "Le sultan Mahmud ibn Sultan Muhammad ibn Malikshah le Seldjoukide, dit Mughith al-Din, accéda au trône après son père en 512, avec le sermon de Bagdad. Client de son oncle Sanjar, il était un homme d'une grande érudition, versé en poésie, en grammaire et en histoire. Doté d'un esprit vif et d'une excellente maîtrise de l'arabe, il était un gardien de poèmes et de proverbes, et appréciait la compagnie des érudits. Loué par le poète al-Haysa Baysa dans la célèbre Daliyya, il fut richement récompensé. À la fin de son règne, le sultanat s'affaiblit au point que la solde de l'armée ne put plus être versée. Il mourut le jeudi de la mi-Shawwal 525 à Bab Ispahan, où il fut inhumé (voir: shadharat-dhahab, p. 556-557)."
  ur: "سلطان محمود بن سلطان محمد بن مالکشاہ سلجوق، سٹائلڈ مغیث الدین؛ 512 میں اپنے والد کے بعد بغداد میں خطبہ کے ساتھ تخت نشین ہوا، جو اپنے چچا سنجر کے مؤکل تھے۔ وہ شاعری، گرامر اور تاریخ جانتے تھے - تیز دماغ، عربی میں مضبوط، نظموں اور کہاوتوں کے رکھوالے، اسکالرز کے دلدادہ، مشہور دلیہ میں شاعر الحیصہ بایصہ نے ان کی تعریف کی اور بہت زیادہ انعامات سے نوازا؛ اس کے آخری ایام میں سلطنت کمزور پڑ گئی یہاں تک کہ فوج کی تنخواہ پوری نہ ہو سکی۔ d جمعرات کے وسط شوال 525 کو باب اصفہان میں دفن کیا گیا۔ 556-557}۔"
  tr: "Sultan Mahmud bin Sultan Muhammed bin Malikşah Selçuk, lakabı Muğıt-Din, 500 Hicri yılında babasının yerine geçti ve Bağdat'ta ve başka yerlerde ona vaaz verdi, amcası Sancar ise oldukça bilgiliydi. Şiir, dilbilgisi ve tarih konusunda güçlü bir bilgiye sahipti, keskin zekaya sahipti, Arapçayı iyi biliyordu, şiir ve atasözlerini ezberliyordu, tarihi biliyordu ve alimlere ve hayırseverlere karşı güçlü bir eğilimi vardı. Şair Al-Hays Bays tarafından ünlü Dalya şiiriyle övüldü ve bu nedenle Sünni ödülü verildi. Son günlerinde sultanlık zayıfladı ve serveti azaldı, böylece el-Fukai konumunu sağlamlaştıramadı. 525 Hile Perşembe günü, Şavval ortasında Bab İsfahan'da öldü ve orada defnedildi {atış:Shadharat-Dhahab, s. 556-557}."
  id: "Sultan Mahmud bin Sultan Muhammad bin Malikshah Seljuk, yang dijuluki Mughith al-Din, menggantikan ayahnya pada tahun 500 H dan memberikan khotbah kepadanya di Baghdad dan tempat lain, dan pamannya Sanjar sangat berpengalaman. Ia memiliki pengetahuan kuat tentang puisi, tata bahasa, dan sejarah, sangat cerdas, memiliki pengetahuan Arab yang kuat, menghafal puisi dan perisal, mengetahui sejarah, dan memiliki kecenderungan kuat terhadap para sarjana dan dermawan. Ia dipuji oleh penyair Al-Hays Bays dengan puisi Dalia terkenalnya dan memberinya penghargaan Sunni karenanya. Pada hari-hari terakhirnya, kesultanan melemah dan kekayaannya menyusut hingga mereka tidak mampu menetapkan posisi al-Fuqa'i. Ia meninggal pada hari Kamis, pertengahan Shawwal, 525 H, di Bab Isfahan dan dimakamkan di sana {cite:shadharat-dhahab, hlm. 556-557}."
