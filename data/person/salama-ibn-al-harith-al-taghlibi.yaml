summary:
  ar: "سلمة بن الحارث بن عمرو الكندي، أصغر بني الحارث؛ ملكه أبوه على تغلب والنمر بن قاسط وبني سعد بن زيد مناة من تميم، فأخرجته تغلب عنها فالتجأ إلى بكر بن وائل فأذعنوا له وقالوا لا يملكنا غيرك، فدعاهم المنذر بن امرئ القيس إلى طاعته فأبوا فكانت من وراء ذلك يوم أوارة الأول، وفي حرب إخوته بعد هلاك أبيه زحف بتغلب والصنائع إلى ماء الكلاب فكان له الغلب يوم الكلاب الأول {cite:kamil-ibn-al-athir p. 410-412}."
  en: "Salama ibn al-Harith al-Kindi, youngest of al-Harith's sons: set over Taghlib, expelled by them, then taken as king by Bakr ibn Wa'il — the adoption al-Mundhir ibn Imru' al-Qays answered with the first day of Awara; at al-Kullab he led Taghlib and the sana'i' to victory over his brother Shurahbil {cite:kamil-ibn-al-athir p. 410-412}."
