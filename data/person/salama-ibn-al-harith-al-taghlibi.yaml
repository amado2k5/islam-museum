summary:
  ar: "سلمة بن الحارث بن عمرو الكندي، أصغر بني الحارث؛ ملكه أبوه على تغلب والنمر بن قاسط وبني سعد بن زيد مناة من تميم، فأخرجته تغلب عنها فالتجأ إلى بكر بن وائل فأذعنوا له وقالوا لا يملكنا غيرك، فدعاهم المنذر بن امرئ القيس إلى طاعته فأبوا فكانت من وراء ذلك يوم أوارة الأول، وفي حرب إخوته بعد هلاك أبيه زحف بتغلب والصنائع إلى ماء الكلاب فكان له الغلب يوم الكلاب الأول {cite:kamil-ibn-al-athir p. 410-412}."
  en: "Salama ibn al-Harith al-Kindi, youngest of al-Harith's sons: set over Taghlib, expelled by them, then taken as king by Bakr ibn Wa'il — the adoption al-Mundhir ibn Imru' al-Qays answered with the first day of Awara; at al-Kullab he led Taghlib and the sana'i' to victory over his brother Shurahbil {cite:kamil-ibn-al-athir p. 410-412}."
  es: "Salama ibn al-Harith al-Kindi, el menor de los hijos de al-Harith: puesto sobre Taghlib, expulsado por ellos, luego tomado como rey por Bakr ibn Wa'il — la adopción al-Mundhir ibn Imru' al-Qays respondió con el primer día de Awara; en al-Kullab condujo a Taghlib y a los sana'i' a la victoria sobre su hermano Shurahbil {cite:kamil-ibn-al-athir p. 410-412}."
  fr: "Salama ibn al-Harith al-Kindi, le plus jeune des fils d'al-Harith: placé sur Taghlib, expulsé par eux, puis pris comme roi par Bakr ibn Wa'il — l'adoption à laquelle al-Mundhir ibn Imru' al-Qays répondit par le premier jour d'Awara; à al-Kullab, il mena Taghlib et les sana'i' à la victoire sur son frère Shurahbil {cite:kamil-ibn-al-athir p. 410-412}."
  ur: "سلامہ بن حارث الکندی، الحارث کے بیٹوں میں سب سے چھوٹے: تغلب پر مقرر، ان کے ذریعہ بے دخل کیا گیا، پھر بکر بن وائل نے بادشاہ بنا لیا - گود لینے والے المنذر بن عمرو القیس نے آوارہ کے پہلے دن کے ساتھ جواب دیا؛ الکلب میں اس نے تغلب اور صنعاء کو اپنے بھائی شورابیل پر فتح دلایا۔ 410-412}۔"
