summary:
  ar: "عالم مصلح هندي وقائد عسكري (1786–1831)، وُلد في رائي بريلي وتتلمذ على الشاه عبد العزيز الدهلوي، وقاد حركة «الطريقة المحمدية» الإصلاحية التي حاربت تقديس الأولياء والعادات المتأثرة بالشيعة. بعد حجه (1821–1823) قاد المجاهدين إلى وادي بيشاور، وبويع إمامًا وخليفة في يناير 1827، وحارب إمبراطورية السيخ حتى قُتل في بالاكوت في 6 مايو 1831؛ ويُعدّ شهيدًا وسلفًا لحركتي أهل الحديث وديوبند."
  en: "Indian revivalist scholar and military commander (1786–1831), born at Rae Bareli and a disciple of Shah Abdul Aziz Dehlavi, who founded and led the reform movement Tariqah-i-Muhammadiya, campaigning against saint veneration and Shi'i-influenced customs. After his Hajj (1821–1823) he led the mujahidin to the Peshawar valley, was proclaimed imam and caliph in January 1827, fought the Sikh Empire, and was killed at Balakot on 6 May 1831. He is revered as a shahid (martyr) and claimed as a forerunner by the Ahl-i Hadith and Deobandi movements."
  ur: "ہندوستانی مصلح عالم اور عسکری قائد (1786ء–1831ء)، رائے بریلی میں پیدا ہوئے اور شاہ عبدالعزیز دہلوی کے شاگرد تھے؛ اصلاحی تحریک «طریقۂ محمدیہ» کے بانی و قائد کے طور پر انہوں نے اولیاء پرستی اور شیعہ اثرات والی رسوم کے خلاف مہم چلائی۔ حج (1821ء–1823ء) کے بعد مجاہدین کو وادیِ پشاور لے گئے، جنوری 1827ء میں امام و خلیفہ قرار پائے، سکھ سلطنت سے لڑے اور 6 مئی 1831ء کو بالاکوٹ میں مارے گئے۔ انہیں شہید مانا جاتا ہے اور اہلِ حدیث و دیوبندی تحریکیں انہیں اپنا پیش رو کہتی ہیں۔"
