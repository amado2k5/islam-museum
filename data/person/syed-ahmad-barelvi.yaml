faith:
  - value: sunni-hanafi
    basis: documented
    note: "The English article's text states that he was 'a traditional Sunni who adhered to the Hanafi school', citing Juan Campo's Encyclopedia of Islam entry (2009), and quotes Waleed Ziad (Hidden Caliphate, Harvard University Press, 2021) that Sayyid Ahmad 'consistently called himself a staunch Sunni and follower of the Hanafi school of law'; the article's infobox jurisprudence field (Hanafi) is referenced to Ziad and to Mukhtar Ahmad Ali (2000: the two leaders 'strictly remained within the Hanafi School'). The counter-reading is preserved here, not suppressed: the same infobox carries a second value, 'Independent', referenced to Muhammad Hedayetullah's McGill thesis (1968), which holds that he rejected taqlid, condemned the muqallidin and declared himself a ghayr muqallid, rejecting the authority of the four schools. The Arabic and Urdu articles name no madhhab in their texts (both file him in Hanafi categories, which are filings and do not count), and Wikidata gives only Islam. The value is recorded on the two independent scholarly attestations stated in the English article's text, with the debate carried in this note."
    sources: [source/wikipedia-syed-ahmad-barelvi-en]
  - value: sufi
    basis: documented
    note: "Independent article texts attest his personal Sufi standing as both disciple and murshid. The English article's lead calls him a 'Naqshbandi Sufi murshid', and its text (Metcalf 1982; Gaborieau 2021; Ziad 2021) says he was a Sufi saint and guide who initiated his followers into the traditional Sufi orders — the Chishtiyya, Qadiriyya, Naqshbandiyya and Naqshbandiyya-Mujaddidiyya — that his Mujaddidi credentials were well established, and that he was a disciple of Shah Abdul Aziz Dehlvi. The Arabic article records that he gave bay'ah to Shah Abdul Aziz and took the tariqa from him. The Urdu article calls him a Sufi in its lead and prints his spiritual chain (silsila) running from him through Shah Abdul Aziz and Shah Waliullah back to Ahmad Sirhindi. On those texts his personal Sufi affiliation is documented."
    sources: [source/wikipedia-syed-ahmad-barelvi-en, source/wikipedia-ahmad-irfan-ar, source/wikipedia-syed-ahmad-barelvi-ur]
