summary:
  ar: "شاعر قرطبي كثير الشعر سريع القول؛ كان كثير من شيوخ الأدب في وقته يقولون فتح الشعر بكندة وختم بكندة يعنون امرأ القيس والمتنبي ويوسف بن هرون، واكتسب صناعة الأدب من شيخه أبي بكر يحيى بن هذيل الكفيف عالم أدباء الأندلس، وأخذ عنه أبو عمر ابن عبد البر قطعة من شعره وضمنها بعض تأليفه، وطال عمره حتى أدرك الفتنة فلحقته فيها فاقة نهكته وبعدت عنه الإفاقة حتى أهلكته، وتوفي سنة أربعمائة وثلاث {cite:nafh-tib-maqqari p. 40-41}."
  en: "Cordoba's great poet al-Ramadi — 'poetry was opened by Kinda and sealed by Kinda' said the critics, meaning Imru' al-Qays, al-Mutanabbi and Yusuf b. Harun; long-lived into the fitna whose famine wasted him to death in 403 {cite:nafh-tib-maqqari p. 40-41}."
