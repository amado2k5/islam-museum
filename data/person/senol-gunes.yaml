summary:
  ar: "مدرب كرة قدم تركي وحارس مرمى سابق، وُلد في طرابزون سنة 1952. لعب لطرابزون سبور اثني عشر عامًا وفاز معه بستة ألقاب دوري، ويحمل الرقم القياسي للدوري التركي في الحفاظ على نظافة الشباك (1,110 دقيقة). كمدرب قاد تركيا إلى المركز الثالث في كأس العالم 2002 — أفضل نتيجة في تاريخها — وفاز بلقبي دوري مع بشكتاش، ودرّب أيضًا منتخب تركيا مجددًا وسيول وطرابزون سبور."
  en: "Turkish football manager and former goalkeeper, born in Trabzon in 1952. He played for Trabzonspor for twelve years, winning six league titles, and set the Süper Lig clean-sheet record of 1,110 minutes. As a manager he took Turkey to third place at the 2002 FIFA World Cup — their best-ever finish — won two Süper Lig titles with Beşiktaş, and also coached FC Seoul, Trabzonspor and Turkey again."
  ur: "ترک فٹبال مینیجر اور سابق گول کیپر، 1952 میں ترابزون میں پیدا ہوئے۔ ترابزون سپور کے لیے بارہ سال کھیلے، چھ لیگ خطاب جیتے، اور سپر لیگ میں 1,110 منٹ کا کلین شیٹ ریکارڈ قائم کیا۔ مینیجر کے طور پر ترکی کو 2002 فیفا ورلڈ کپ میں تیسرے مقام تک پہنچایا — اس کی تاریخ کی بہترین کارکردگی — بیشکتاش کے ساتھ دو سپر لیگ خطاب جیتے، اور ایف سی سیول، ترابزون سپور اور دوبارہ ترکی کی کوچنگ بھی کی۔"
