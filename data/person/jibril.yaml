id: person/jibril
class: person
label:
  ar: جبريل
  en: Jibril (Gabriel)
  es: "Jibril (Gabriel)"
  fr: "Jibril (Gabriel)"
  ur: "جبرائیل"
summary:
  ar: 'الملك الذي ائتمنه الله على الوحي؛ سأله النبي في حديث الإيمان المشهور عن الإسلام والإيمان والإحسان والساعة وأماراتها، فكان يسأل والنبي يجيب حتى قال عمر: فعجبنا أنه يسأله ويصدقه {cite:sahih-muslim 8}، وهو الذي جاءه بالوحي في غار حراء فقال «اقرأ» {cite:sahih-al-bukhari 3}، وعرج به ليلة المعراج حتى سدرة المنتهى {cite:sahih-muslim 162}، وكان يلقاه في رمضان فيدارسه القرآن {cite:sahih-muslim 2308}.'
  en: The angel entrusted with revelation; in the famous hadith he asked the Prophet about islam, iman, ihsan and the Hour and its signs {cite:sahih-muslim 8}; he brought the revelation in the cave of Hira {cite:sahih-al-bukhari 3}, ascended with him on the Mi'raj night to the Lote Tree {cite:sahih-muslim 162}, and met him each Ramadan to review the Qur'an {cite:sahih-muslim 2308}.
  es: "El ángel encargado de la revelación; en el famoso hadiz preguntó al Profeta sobre el islam, el iman, el ihsan y la Hora y sus signos {cite:sahih-muslim 8}; trajo la revelación a la cueva de Hira {cite:sahih-al-bukhari 3}, ascendió con él en la noche del Mi'raj al Árbol del Loto {cite:sahih-muslim 162}, y se reunió con él cada Ramadán para repasar el Corán {cite:sahih-muslim 2308}."
  fr: "L'ange chargé de la révélation; dans le hadith célèbre, il interrogea le Prophète sur l'islam, la foi, l'excellence et l'Heure et ses signes {cite:sahih-muslim 8}; il apporta la révélation dans la grotte de Hira {cite:sahih-al-bukhari 3}, monta avec lui la nuit du Mi'raj jusqu'au Lotus {cite:sahih-muslim 162}, et le rencontra chaque Ramadan pour réviser le Coran {cite:sahih-muslim 2308}."
  ur: "فرشتہ وحی کے ساتھ سپرد; مشہور حدیث میں انہوں نے نبی سے اسلام، ایمان، احسان اور قیامت اور اس کی نشانیوں کے بارے میں پوچھا۔ وہ غار حرا میں وحی لے کر آئے {حوالہ: صحیح البخاری 3}، معراج کی رات اپنے ساتھ لوط کے درخت پر چڑھ گئے، اور قرآن کا جائزہ لینے کے لیے ہر رمضان میں ان سے ملاقات کرتے تھے۔"
  tr: "Allah'ın vahiyle emanet ettiği melek, ünlü bir iman hadisinde İslam, iman, iyilik, Saat ve onun işaretleri hakkında sordu. O sorardı, Peygamber cevap verirdi, ta ki Ömer şöyle dese ki: Ona sorup inanmasına şaşırdık {cite:sahih-muslim 8} ve ona vahiyi Hira Mağarası'nda getiren oydu ve dedi ki, \"Oku\" {atı:sahih-al-bukhari 3} ve Mi'raj gecesinde onu En Büyük Sınırın Lota Ağacı'na götürecekti {cite:sahih-muslim 162} ve Ramazan'da Kur'an'ı incelemek için buluşacaktı {cite:sahih-muslim 2308}."
  id: "Malaikat yang dipercayakan Allah dengan wahyu bertanya kepadanya dalam hadits iman yang terkenal tentang Islam, iman, kebaikan, Jam, dan tanda-tandanya. Dia akan bertanya dan Nabi akan menjawab sampai Umar berkata: Kami terkejut karena dia bertanya dan percaya kepadanya {cite:sahih-muslim 8}, dan dialah yang membawa wahyu itu kepadanya di Gua Hira, dan dia berkata, \"Bacalah\" {cite:sahih-al-bukhari 3}, dan dia akan membawanya pada malam Mi'raj ke Pohon Lote di Batas Tertinggi {cite:sahih-muslim 162}, dan dia akan bertemu dengannya pada Ramadan untuk mempelajari Al-Qur'an {cite:sahih-muslim 2308}."
