id: person/jibril
class: person
label: { ar: "جبريل", en: "Jibril (Gabriel)" }
summary:
  ar: "الملك الذي ائتمنه الله على الوحي؛ سأله النبي في حديث الإيمان المشهور عن الإسلام والإيمان والإحسان والساعة وأماراتها، فكان يسأل والنبي يجيب حتى قال عمر: فعجبنا أنه يسأله ويصدقه {cite:sahih-muslim 8}، وهو الذي جاءه بالوحي في غار حراء فقال «اقرأ» {cite:sahih-al-bukhari 3}، وعرج به ليلة المعراج حتى سدرة المنتهى {cite:sahih-muslim 162}، وكان يلقاه في رمضان فيدارسه القرآن {cite:sahih-muslim 2308}."
  en: "The angel entrusted with revelation; in the famous hadith he asked the Prophet about islam, iman, ihsan and the Hour and its signs {cite:sahih-muslim 8}; he brought the revelation in the cave of Hira {cite:sahih-al-bukhari 3}, ascended with him on the Mi'raj night to the Lote Tree {cite:sahih-muslim 162}, and met him each Ramadan to review the Qur'an {cite:sahih-muslim 2308}."
