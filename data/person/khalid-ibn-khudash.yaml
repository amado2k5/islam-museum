died: { edtf: "0838", hijri: "0223", calendar: julian, precision: month, status: tradition, derived: true, note: "مات في جمادى الآخرة سنة ثلاث وعشرين ومائتين {cite:wafayat-ayan}." }
summary:
  ar: "أبو الهيثم خالد بن خداش بن عجلان المهلبي، مولى آل المهلب بن أبي صفرة؛ من أهل البصرة سكن بغداد وحدث بها عن مالك بن أنس والمفضل بن عبد الرحمن ومهدي بن ميمون وحماد بن زيد؛ وروى عنه أحمد بن حنبل وأحمد بن إبراهيم الدورقي وإبراهيم بن العلاء الجوهري؛ وقال فيه أبو حاتم: صدوق {cite:wafayat-ayan}."
  en: "Khalid b. Khudash al-Muhallabi (d. 223) — Basran traditionist resident in Baghdad, mawla of the Muhallabids; transmitted from Malik b. Anas and Hammad b. Zayd; Ahmad b. Hanbal narrated from him; Abu Hatim called him truthful {cite:wafayat-ayan}."
  es: "Jalid b. Khudash al-Muhallabi (m. 223): tradicionalista de Basrán residente en Bagdad, mawla de los muhalabidas; transmitido desde Malik b. Anas y Hammad b. Zayd; Ahmad b. Hanbal narró de él; Abu Hatim lo llamó veraz {cita:wafayat-ayan}."
  fr: "Khalid b. Khudash al-Muhallabi (mort en 223) — traditionniste basran résidant à Bagdad, mawla des Muhallabids; transmis de Malik b. Anas et Hammad b. Zayd; Ahmad b. Hanbal a raconté de lui; Abu Hatim l'a qualifié de véridique {cite: wafayat-ayan}."
  ur: "خالد بی۔ خداش المحلبی ⁦(متوفی 223)⁩ — بغداد میں رہنے والے بصران روایت پرست، محلہ والوں کے مولا؛ ملک ب سے منتقل انس اور حماد بی۔ زید; احمد بی۔ حنبل نے ان سے روایت کی ہے۔ ابو حاتم نے اسے سچا کہا۔"
  tr: "Ebu el-Heytham Halid bin Khaddash ibn Ajlan al-Muhallabi, El-Muhallab ailesinin özgür kaderi ibn Abi Safra; Basra'dan Bağdat'ta yaşadı ve orada Malik ibn Anas, el-Mufaddal ibn Abd al-Rahman, Mehdi ibn Maymun ve Hammad ibn Zayd'den rivayet etti; Ahmed ibn Hanbal, Ahmed ibn İbrahim el-Davaqi ve İbrahim ibn al-Ala' al-Jawhari ondan rivayet etti; Abu Hatim onun hakkında şöyle dedi: dürüst {alıntı:wafayat-ayan}."
  id: "Abu al-Haytham Khalid ibn Khaddash ibn Ajlan al-Muhallabi, mantan keluarga Al-Muhallab ibn Abi Safra; dari Basra, ia tinggal di Baghdad dan menceritakan di sana dari Malik ibn Anas, al-Mufaddal ibn Abd al-Rahman, Mahdi ibn Maymun, dan Hammad ibn Zayd; Ahmad ibn Hanbal, Ahmad ibn Ibrahim al-Dawraqi, dan Ibrahim ibn al-Ala' al-Jawhari menceritakan darinya; Abu Hatim berkata tentangnya: benar {cite:wafayat-ayan}."
