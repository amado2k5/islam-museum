gender: female
roles: [prophet-household]
summary:
  ar: "زوج إبراهيم؛ حاول فرعون مصر كيداً بها فردّ الله كيده، وعرف ما لها من الصلة القوية بالله فأخدمها هاجر اعترافاً بفضلها، فزوّجتها سارة إبراهيم، ثم غارت من هاجر بعد ولادة إسماعيل حتى ألجأت إبراهيم إلى الخروج بهاجر وولدها إلى الحجاز، في رواية الرحيق المختوم عن البخاري ورحمة للعالمين."
  en: "Ibrahim's wife; Pharaoh plotted against her and God turned his plot back, and recognising her closeness to God he gave her Hajar as a servant, whom Sarah gave to Ibrahim in marriage; after Ismail's birth her jealousy led Ibrahim to take Hajar and the child to the Hijaz, in al-Raheeq al-Makhtum's account after al-Bukhari and Rahma lil-Alamin."
  es: "La esposa de Ibrahim; el faraón conspiró contra ella y Dios frustró su plan, y reconociendo su cercanía a Dios le dio a Agar como sirvienta, a quien Sara le dio a Ibrahim en matrimonio; después del nacimiento de Ismail, sus celos llevaron a Ibrahim a llevarse a Agar y al niño al Hiyaz, según el relato de al-Raheeq al-Makhtum, basado en al-Bukhari y Rahma lil-Alamin."
  fr: "L'épouse d'Ibrahim; Pharaon complota contre elle et Dieu déjoua son complot, et reconnaissant sa proximité avec Dieu, il lui donna Hajar comme servante, que Sarah donna en mariage à Ibrahim; après la naissance d'Ismaël, sa jalousie poussa Ibrahim à emmener Hajar et l'enfant au Hedjaz, selon le récit d'al-Raheeq al-Makhtum d'après al-Bukhari et Rahma lil-Alamin."
  ur: "ابراہیم کی بیوی؛ فرعون نے اس کے خلاف سازش کی اور خدا نے اس کی سازش کو پلٹ دیا، اور خدا کے ساتھ اس کی قربت کو پہچانتے ہوئے اس نے اسے حجر کو ایک خادم کے طور پر دیا، جس کا نکاح سارہ نے ابراہیم سے کیا تھا۔ اسماعیل کی پیدائش کے بعد اس کے حسد نے ابراہیم کو حجر اور بچے کو حجاز لے جانے پر مجبور کیا، البخاری اور رحمۃ للعالمین کے بعد الرحیق المختم کے بیان میں۔"
  tr: "İbrahim'in kocası; Mısır Firavunu ona karşı komplo kurmaya çalıştı, ancak Allah onun planını geri püskürttü. Onun Tanrı ile güçlü bağını fark etti ve Hacer, onun erdemini takdir etmek için ona hizmet etti. Sarah'ı İbrahim ile evlendirdi, ardından İsmail doğduktan sonra Hacer'e kıskandı; ta ki İbrahim Hacer'i ve oğlunu Hicaz'a götürene kadar; bu, El-Buhari'den gelen mühürlü nektarın rivayetine göre ve dünyalara merhamettir."
  id: "Suami Abraham; Firaun Mesir mencoba merencanakan sesuatu melawannya, tetapi Tuhan menggagalkan rencananya. Ia menyadari hubungan eratnya dengan Tuhan, sehingga Hagar melayaninya sebagai pengakuan atas kebajikannya. Dia menikahkan Sarah dengan Ibrahim, lalu dia menjadi cemburu pada Hagar setelah kelahiran Ismail sampai Abraham membawa Hagar dan putranya ke Hijaz, menurut narasi nektar tersegel dari Al-Bukhari, dan belas kasihan bagi dunia."
