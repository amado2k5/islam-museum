summary:
  ar: "زوج إبراهيم؛ حاول فرعون مصر كيداً بها فردّ الله كيده، وعرف ما لها من الصلة القوية بالله فأخدمها هاجر اعترافاً بفضلها، فزوّجتها سارة إبراهيم، ثم غارت من هاجر بعد ولادة إسماعيل حتى ألجأت إبراهيم إلى الخروج بهاجر وولدها إلى الحجاز، في رواية الرحيق المختوم عن البخاري ورحمة للعالمين."
  en: "Ibrahim's wife; Pharaoh plotted against her and God turned his plot back, and recognising her closeness to God he gave her Hajar as a servant, whom Sarah gave to Ibrahim in marriage; after Ismail's birth her jealousy led Ibrahim to take Hajar and the child to the Hijaz, in al-Raheeq al-Makhtum's account after al-Bukhari and Rahma lil-Alamin."
