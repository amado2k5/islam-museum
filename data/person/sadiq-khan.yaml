summary:
  ar: "سياسي بريطاني من حزب العمال، وُلد في توتينغ بلندن سنة 1970 لأسرة باكستانية مهاجرة من الطبقة العاملة، وعمل محاميًا متخصصًا في حقوق الإنسان قبل أن يُنتخب نائبًا عن توتينغ سنة 2005، ثم أصبح سنة 2016 أول مسلم يتولى رئاسة بلدية لندن، وأعيد انتخابه سنة 2021 وسنة 2024 ليكون أول عمدة للندن يفوز بثلاث ولايات، ونال لقب فارس سنة 2025 ورُفع إلى مجلس اللوردات بوصفه عضوًا مدى الحياة سنة 2026."
  en: "British Labour Party politician, born in Tooting, London, in 1970 into a working-class Pakistani immigrant family. He practised as a human-rights solicitor before his election as MP for Tooting in 2005, became in 2016 the first Muslim Mayor of London, was re-elected in 2021 and 2024 as the first London mayor to win three terms, was knighted in 2025, and was raised to the House of Lords as a life peer in 2026."
  ur: "برطانوی لیبر پارٹی کے سیاست دان، جو 1970 میں لندن کے ٹوٹنگ میں ایک محنت کش پاکستانی مہاجر خاندان میں پیدا ہوئے۔ انسانی حقوق کے وکیل کے طور پر کام کرنے کے بعد 2005 میں ٹوٹنگ سے رکن پارلیمنٹ منتخب ہوئے، 2016 میں لندن کے پہلے مسلم میئر بنے، 2021 اور 2024 میں دوبارہ منتخب ہو کر تین مرتبہ جیتنے والے پہلے میئر بنے، 2025 میں نائٹ کا خطاب پایا اور 2026 میں تاحیات رکنیت کے ساتھ ایوان بالا میں شامل ہوئے۔"
