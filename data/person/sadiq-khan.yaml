summary:
  ar: "سياسي بريطاني من حزب العمال، وُلد في توتينغ بلندن سنة 1970 لأسرة باكستانية مهاجرة من الطبقة العاملة، وعمل محاميًا متخصصًا في حقوق الإنسان قبل أن يُنتخب نائبًا عن توتينغ سنة 2005، ثم أصبح سنة 2016 أول مسلم يتولى رئاسة بلدية لندن، وأعيد انتخابه سنة 2021 وسنة 2024 ليكون أول عمدة للندن يفوز بثلاث ولايات، ونال لقب فارس سنة 2025 ورُفع إلى مجلس اللوردات بوصفه عضوًا مدى الحياة سنة 2026."
  en: "British Labour Party politician, born in Tooting, London, in 1970 into a working-class Pakistani immigrant family. He practised as a human-rights solicitor before his election as MP for Tooting in 2005, became in 2016 the first Muslim Mayor of London, was re-elected in 2021 and 2024 as the first London mayor to win three terms, was knighted in 2025, and was raised to the House of Lords as a life peer in 2026."
  ur: "برطانوی لیبر پارٹی کے سیاست دان، جو 1970 میں لندن کے ٹوٹنگ میں ایک محنت کش پاکستانی مہاجر خاندان میں پیدا ہوئے۔ انسانی حقوق کے وکیل کے طور پر کام کرنے کے بعد 2005 میں ٹوٹنگ سے رکن پارلیمنٹ منتخب ہوئے، 2016 میں لندن کے پہلے مسلم میئر بنے، 2021 اور 2024 میں دوبارہ منتخب ہو کر تین مرتبہ جیتنے والے پہلے میئر بنے، 2025 میں نائٹ کا خطاب پایا اور 2026 میں تاحیات رکنیت کے ساتھ ایوان بالا میں شامل ہوئے۔"
  es: "Político británico del Partido Laborista, nacido en Tooting, Londres, en 1970 en el seno de una familia de inmigrantes pakistaníes de clase trabajadora. Ejerció como abogado de derechos humanos antes de ser elegido diputado por Tooting en 2005, se convirtió en 2016 en el primer alcalde musulmán de Londres, fue reelegido en 2021 y 2024 como el primer alcalde de Londres en ganar tres mandatos, fue nombrado caballero en 2025 y fue elevado a la Cámara de los Lores como par vitalicio en 2026."
  fr: "Homme politique britannique du Parti travailliste, né à Tooting (Londres) en 1970 dans une famille ouvrière d'immigrés pakistanais. Il a exercé comme avocat spécialisé dans les droits de l'homme avant d'être élu député de Tooting en 2005. En 2016, il est devenu le premier maire musulman de Londres, a été réélu en 2021 et 2024, devenant ainsi le premier maire de Londres à effectuer trois mandats. Il a été anobli en 2025 et élevé à la Chambre des lords en tant que pair à vie en 2026."
  tr: "İşçi Partisi'nden İngiliz bir politikacı, 1970 yılında Londra'nın Tooting kentinde işçi sınıfı Pakistanlı göçmen bir ailede doğdu, 2005'te Tooting milletvekili seçilmeden önce insan hakları avukatı olarak çalıştı. 2016'da Londra'nın belediye başkanı olan ilk Müslüman oldu. 2021 ve 2024'te yeniden seçilerek üç dönem kazanan ilk Londra Belediye Başkanı oldu. 2025'te şövalye unvanı aldı ve 2026'da ömür boyu Lordlar Kamarası'na yükseltildi."
  id: "Seorang politisi Inggris dari Partai Buruh, lahir di Tooting, London pada tahun 1970 dari keluarga imigran kelas pekerja Pakistan, bekerja sebagai pengacara hak asasi manusia sebelum terpilih sebagai anggota parlemen untuk Tooting pada tahun 2005. Pada tahun 2016, ia menjadi Muslim pertama yang menjadi walikota London. Ia terpilih kembali pada tahun 2021 dan 2024 untuk menjadi Wali Kota London pertama yang memenangkan tiga periode. Ia dianugerahi gelar kebangsawanan pada tahun 2025 dan diangkat ke House of Lords sebagai anggota seumur hidup pada tahun 2026."
