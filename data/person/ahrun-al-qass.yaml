  id: "Ahrun sang imam hidup di zaman awal dan menulis bukunya dalam bahasa Suryani, dan Masarjis menerjemahkannya. Ia juga menulis buku Al-Kunnash, yang ia buat menjadi tiga puluh artikel, dan Masarjis menambahkan dua artikel lagi ke dalamnya. {cite:fihrist-ibn-al-nadim p. 413}."
