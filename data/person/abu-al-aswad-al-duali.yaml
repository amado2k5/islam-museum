    ar: "أبو الأسود الدؤلي لغوي يُنسب إليه ضبط المصحف ووضع النحو؛ وعند ابن النديم زعم أكثر العلماء أن النحو أُخذ عنه وأنه أخذه عن علي بن أبي طالب."
    en: "Abu al-Aswad al-Du'ali, the linguist credited with dotting the mushaf and founding grammar; Ibn al-Nadim says most scholars held grammar was taken from him — and that he took it from Ali ibn Abi Talib."
