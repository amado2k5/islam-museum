summary:
  ar: "لغوي وراوية، يُنسب إليه ضبط المصحف ووضع النحو، ويرجع نسبه إلى الدؤل بن بكر بن كنانة. وعند ابن النديم زعم أكثر العلماء أن النحو أخذ عنه وأنه أخذه عن علي بن أبي طالب، ومنه نقط أبي الأسود للفتح والضم والكسر والغنة، وقيل إن الداعي كان سماعه قارئا يكسر رسوله في براءة أو قول سعد الفارسي فرسي ضالع يريد ظالعا {cite:fihrist-ibn-al-nadim p. 103-106}"
  en: "A philologist and transmitter credited with the vowel-pointing of the Qur'an and the founding of Arabic grammar. His lineage goes back to al-Du'al ibn Bakr ibn Kinana."
  fr: "Philologue et transmetteur à qui l'on attribue la vocalisation du Coran et la fondation de la grammaire arabe. Sa généalogie remonte à al-Du'al ibn Bakr ibn Kinana."
  es: "Filólogo y transmisor a quien se le atribuye la fonética vocálica del Corán y la fundación de la gramática árabe. Su linaje se remonta a al-Du'al ibn Bakr ibn Kinana."
  ur: "ایک ماہر فلکیات اور ٹرانسمیٹر جس کو قرآن کے حرف کی نشاندہی اور عربی گرامر کی بنیاد کا سہرا دیا جاتا ہے۔ ان کا سلسلہ نسب الدول بن بکر بن کنانہ سے جا ملتا ہے۔"
  tr: "Kur'an'ı standartlaştırmak ve grameri kurmakla tanınan bir dilbilimci ve rivayetçi olan Ebu el-Du'al ibn Bakr ibn Kinanah'ın soyu, el-Du'al ibn Bakr ibn Kinanah'a kadar uzanır. İbn el-Nadim'e göre, çoğu âlim grameri ondan öğrendiğini ve onun da Ali ibn Abi Talib'den öğrendiğini iddia etmiştir. Ebu el-Aswad, ondan fatha, damma, kesra ve genizden telaffuz için diyakritik işaretleri getirmiştir. Bunun sebebinin, Tevbe Suresi'nde rasul harfine kesra koyarak Kur'an okumasını veya Sa'd el-Farisi'nin \"Atım topaldır\" (topal) sözünü duyması olduğu söylenir. {cite:fihrist-ibn-al-nadim s. 103-106}"
  id: "Seorang ahli bahasa dan perawi, yang berjasa menstandarisasi Al-Quran dan menetapkan tata bahasa, garis keturunannya dapat ditelusuri kembali ke al-Du'al ibn Bakr ibn Kinanah. Menurut Ibn al-Nadim, sebagian besar ulama mengklaim bahwa tata bahasa dipelajari darinya, dan bahwa ia mempelajarinya dari Ali ibn Abi Talib. Darinya, Abu al-Aswad memperkenalkan tanda diakritik untuk fatha, damma, kasra, dan nasalisasi. Dikatakan bahwa alasannya adalah karena ia mendengar Abu al-Aswad membaca Al-Quran dengan kasra pada huruf rasul dalam Surah At-Tawbah, atau ucapan Sa'd al-Farisi, \"Kudaku pincang,\" yang berarti \"pincang.\" {cite:fihrist-ibn-al-nadim hlm. 103-106}"
