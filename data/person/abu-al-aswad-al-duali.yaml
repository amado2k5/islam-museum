  ar: "لغوي وراوية، يُنسب إليه ضبط المصحف ووضع النحو، ويرجع نسبه إلى الدؤل بن بكر بن كنانة.، وعند ابن النديم زعم أكثر العلماء أن النحو أخذ عنه وأنه أخذه عن علي بن أبي طالب، ومنه نقط أبي الأسود للفتح والضم والكسر والغنة، وقيل إن الداعي كان سماعه قارئا يكسر رسوله في براءة أو قول سعد الفارسي فرسي ضالع يريد ظالعا {cite:fihrist-ibn-al-nadim p. 103-106}"
