summary:
  ar: "سلطان يوغياكارتا التاسع وسياسي إندونيسي، وُلد في يوغياكارتا سنة 1912 باسم غوستي رادن ماس دورودجاتون. تُوّج سنة 1940، وأيّد الجمهورية سنة 1945 واحتضن حكومتها، وتولى وزارة الدفاع ومناصب عليا، فكان ثاني نائب رئيس لإندونيسيا (1973–1978) وأول حاكم للمنطقة الخاصة ليوغياكارتا، وتوفي في واشنطن سنة 1988."
  en: "Ninth Sultan of Yogyakarta and Indonesian statesman, born at Yogyakarta in 1912 as Gusti Raden Mas Dorodjatun. Crowned in 1940, he backed the republic in 1945 and sheltered its government, served as defence minister and in senior economic offices, and was Indonesia's second vice president (1973–1978) and first governor of the Special Region of Yogyakarta; he died at Washington, D.C., in 1988."
  ur: "یوگیاکارتا کے نویں سلطان اور انڈونیشی سیاست دان، جو 1912ء میں یوگیاکارتا میں گوستی رادن ماس دورودجاتون کے نام سے پیدا ہوئے۔ 1940ء میں تاج پوشی ہوئی، 1945ء میں جمہوریہ کی حمایت کی اور اس کی حکومت کو پناہ دی، وزیرِ دفاع اور اعلیٰ عہدوں پر رہے، انڈونیشیا کے دوسرے نائب صدر (1973ء–1978ء) اور یوگیاکارتا کے خصوصی علاقے کے پہلے گورنر بنے؛ 1988ء میں واشنگٹن میں وفات پائی۔"
