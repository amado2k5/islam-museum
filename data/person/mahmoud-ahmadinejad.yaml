summary:
  ar: "محمود أحمدي نجاد (وُلد 28 تشرين الأول 1956، واسمه عند الولادة محمود صباغيان) سياسي ومهندس إيراني، رئيس إيران من 3 آب 2005 إلى 3 آب 2013 وعمدة طهران قبلها (2003–2005). في شباط 2026 ضُرب بيته في طهران في أول أيام حرب إيران 2026 وأُشيع مقتله، ثم أظهرت تقارير لاحقة أنه حي."
  en: "Mahmoud Ahmadinejad (born 28 October 1956, birth name Mahmoud Sabbaghian) is an Iranian politician and engineer who served as president of Iran from 3 August 2005 to 3 August 2013, after serving as mayor of Tehran (2003–2005). In February 2026 his Tehran house was struck on the first day of the 2026 Iran war and he was erroneously reported killed; later reports established that he had survived."
