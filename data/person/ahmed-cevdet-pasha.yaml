summary:
  ar: "أحمد جودت باشا (وُلد في لوفجا سنة 1822 – توفي في إسطنبول في مايو 1895)، عالم ومؤرخ وفقيه ورجل دولة عثماني، ترأس لجنة مجلة الأحكام العدلية التي دوّنت الفقه الإسلامي في قانون مدني من 1851 مادة صدرت أجزاؤها حتى 1876، وألّف «تاريخ جودت» في اثني عشر مجلدًا و«قصص الأنبياء»، وتولى نظارات الحقانية والمعارف والأوقاف والداخلية والتجارة مرات، وهو أبو فاطمة عالية أول روائية تركية."
  en: "Ahmed Cevdet Pasha (born at Lovech in 1822 – died in Istanbul in May 1895) was an Ottoman scholar, historian, jurist and statesman who chaired the commission of the Mecelle, the codification of Islamic law in a civil code of 1,851 articles completed in 1876; he wrote the twelve-volume Tarih-i Cevdet and the Kısas-ı Enbiya, held the ministries of justice, education, pious foundations, interior and commerce in turn, and was the father of Fatma Aliye, the first Turkish woman novelist."
  ur: "احمد جودت پاشا (پیدائش: لوفچہ، 1822ء – وفات: استنبول، مئی 1895ء)، عثمانی عالم، مورخ، فقیہ اور سیاست دان، مجلہ احکامِ عدلیہ کی تدوین کرنے والے کمیشن کے سربراہ، «تاریخِ جودت» کے مصنف اور کئی وزارتوں کے ناظر رہے۔"
