    note: "What each source gives, stated exactly. The English article's religious-biography infobox gives religion Islam, denomination Sunni and jurisprudence Hanafi, the jurisprudence field citing Kızılkaya's 2011 article on the historical evolution of qawāʿid literature; but the article's text nowhere names his personal school — 'Hanafi' appears in that article only in the infobox and in its Hanafi-scholars and Maturidi navboxes, all one article, one family. The Turkish article's text says that Cevdet and those who thought like him defended systematising and codifying Hanafi fiqh, a branch of Islamic law — a statement about the code he championed. The Arabic article's text likewise says his draft legislation rested on Hanafi fiqh, going beyond the ideas Âli Pasha favoured. Wikidata carries no religion (P140) value at all. Under the lane brief the Mecelle is his professional scholarship, and a school is recorded only when two independent sources name it as his own; under the doubt rule his faith is therefore left unknown, with all the readings preserved here for any future sourced enrichment."
