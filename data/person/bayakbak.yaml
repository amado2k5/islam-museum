label: { ar: "باكباك" }
summary:
  ar: "من أمراء الأتراك، رحل مع موسى بن بغا إلى السن في طلب مساور فكتب إليه المهتدي أن يقتل موسى ومفلحاً ويكون هو الأمير على الأتراك كلهم فأوقف باكباك موسى على كتابه وقال إني لست أفرح بهذا وإنما هذا يعمل علينا كلنا فأجمعوا على قتل المهتدي {cite:tarikh-khulafa-minhaj-1434 p. 563}. وعند المسعودي وقع بيد المهتدي فضرب عنقه ورمى به إلى أصحابه وقيل قتل في حرب جسر سامرا، وكان حنق الأتراك على المهتدي بسبب قتله إياه {cite:muruj-al-dhahab p. 559-560}"
  en: "A Turkish amir; marching with Musa ibn Bugha to al-Sin after Musawwar, he got al-Muhtadi's letter to kill Musa and Muflih and command all the Turks — he showed it to Musa: 'this works on us all' — and they resolved the caliph's death {cite:tarikh-khulafa-minhaj-1434 p. 563}."
