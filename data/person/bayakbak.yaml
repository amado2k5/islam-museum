class: person
label: { ar: "باكباك" }
summary:
  ar: "من أمراء الأتراك، رحل مع موسى بن بغا إلى السن في طلب مساور فكتب إليه المهتدي أن يقتل موسى ومفلحاً ويكون هو الأمير على الأتراك كلهم فأوقف باكباك موسى على كتابه وقال إني لست أفرح بهذا وإنما هذا يعمل علينا كلنا فأجمعوا على قتل المهتدي {cite:tarikh-khulafa-minhaj-1434 p. 563}. وعند المسعودي وقع بيد المهتدي فضرب عنقه ورمى به إلى أصحابه وقيل قتل في حرب جسر سامرا، وكان حنق الأتراك على المهتدي بسبب قتله إياه {cite:muruj-al-dhahab p. 559-560}"
  en: "A Turkish amir; marching with Musa ibn Bugha to al-Sin after Musawwar, he got al-Muhtadi's letter to kill Musa and Muflih and command all the Turks — he showed it to Musa: 'this works on us all' — and they resolved the caliph's death {cite:tarikh-khulafa-minhaj-1434 p. 563}."
  es: "Un emir turco; marchando con Musa ibn Bugha hacia al-Sin después de Musawwar, obtuvo la carta de al-Muhtadi para matar a Musa y Muflih y dar órdenes a todos los turcos; se la mostró a Musa: 'esto nos afecta a todos', y resolvieron la muerte del califa {cite:tarikh-khulafa-minhaj-1434 p. 563}."
  fr: "Un émir turc; marchant avec Musa ibn Bugha vers al-Sin après Musawwar, il reçut la lettre d'al-Muhtadi lui ordonnant de tuer Musa et Muflih et de commander à tous les Turcs — il la montra à Musa: « ceci fonctionne sur nous tous » — et ils décidèrent de la mort du calife {cite:tarikh-khulafa-minhaj-1434 p. 563}."
  ur: "ایک ترک امیر؛ مصور کے بعد موسیٰ ابن بوغہ کے ساتھ السین کی طرف روانہ ہوئے، اسے المحتدی کا خط ملا کہ وہ موسیٰ اور مفلح کو قتل کرے اور تمام ترکوں کو حکم دے- اس نے موسیٰ کو دکھایا: 'یہ ہم سب پر کام کرتا ہے' - اور انہوں نے خلیفہ کی موت کا فیصلہ کر لیا۔ 563}۔"
  tr: "Türk prenslerinden biriydi, Musa ibn Bagha ile birlikte bir mızrak aramak için Günahlar'a gitti. Al-Muhtadi ona Musa ve Muflih'i öldürmesini ve tüm Türklerin prensi olmasını yazdı. Musa'yı mektubu ile durdurdu ve şöyle dedi: 'Bundan memnun değilim ama bu hepimize karşı işliyor.' Bunun üzerine el-Muhtadi'yi öldürmeye karar verdiler {atıf:Tarikh-khulafa-minhaj-1434, s. 563}. El-Mes'udi'de el-Muhtadi'nin eline düştü, boynunu vurdu ve onu yoldaşlarına attı. Sırf Samarra köprüsü savaşında öldüğü söylenir. Türkler, el-Muhtadi'nin öldürülmesi yüzünden ona kızgındı {atıf:Muruj-al-Dhahab, s. 559-560}"
  id: "Salah satu pangeran Turki, ia melakukan perjalanan bersama Musa ibn Bagha ke Dosa-dosa untuk mencari tombak. Al-Muhtadi menulis kepadanya untuk membunuh Musa dan Muflih serta menjadi pangeran atas semua orang Turki. Ia menghentikan Musa dengan suratnya dan berkata, 'Saya tidak senang dengan ini, tapi ini merugikan kita semua.' Jadi mereka sepakat untuk membunuh al-Muhtadi {cite:Tarikh-khulafa-minhaj-1434, hlm. 563}. Di al-Mas'udi, ia jatuh ke tangan al-Muhtadi, memukul lehernya, dan melemparkannya ke arah teman-temannya. Dikatakan ia tewas dalam pertempuran di jembatan Samarra. Orang Turki marah kepada al-Muhtadi karena pembunuhannya {cite:Muruj-al-dhahab, hlm. 559-560}"
