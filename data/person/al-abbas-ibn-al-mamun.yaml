label: { ar: "العباس بن المأمون", en: "al-'Abbas ibn al-Ma'mun", fr: "Al-Abbas ibn al-Ma'mun", es: "al-'Abbas ibn al-Ma'mun", ur: "العباس ابن الممون" }
summary:
  ar: "ابن المأمون، كاتب ملك الروم وبايعه ناس في عسكر المعتصم وهو على عمورية سنة ثلاث وعشرين ومائتين، فأعجل المعتصم في مسيره وحبسه وشيعته ومات في هذه السنة {cite:muruj-al-dhahab p. 450}."
  en: "Al-Ma'mun's son whose correspondence with the emperor and oath-ring in the army cut short the march on Constantinople — imprisoned and dead within the year {cite:muruj-al-dhahab p. 450}."
  fr: "Fils d’al-Ma’mun dont la correspondance avec l’empereur et le cercle d’allégeance dans l’armée interrompirent la marche sur Constantinople — emprisonné et mort dans l’année {cite:muruj-al-dhahab p. 450}."
  es: "El hijo de Al-Ma'mun, cuya correspondencia con el emperador y su juramento al ejército truncaron la marcha sobre Constantinopla, fue encarcelado y murió en el plazo de un año {cite:muruj-al-dhahab p. 450}."
  ur: "المامون کا بیٹا جس کی شہنشاہ کے ساتھ خط و کتابت اور فوج میں حلف برداری نے قسطنطنیہ پر مارچ کو مختصر کر دیا - سال کے اندر قید اور مر گیا {حوالہ: مروج الذہب ص۔ 450}۔"
  tr: "Roma Kralı'nın kâtibi İbn el-Ma'mun, 223 yılında Amorium'dayken el-Mu'tasim'in ordusundaki kişiler tarafından biat aldı. El-Mu'tasim onun ayrılışını hızlandırdı, onu hapse attı ve cenazesine gönderdi. Bu yıl öldü. {cite:muruj-al-dhahab s. 450}"
  id: "Ibn al-Ma’mun, juru tulis Raja Romawi, menerima sumpah setia dari orang-orang di pasukan al-Mu’tasim ketika ia berada di Amorium pada tahun 223. Al-Mu’tasim mempercepat kepergiannya, memenjarakannya, dan mengirimnya ke pemakamannya. Ia meninggal pada tahun ini. {cite:muruj-al-dhahab p. 450}"
