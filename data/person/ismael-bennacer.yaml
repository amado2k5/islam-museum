summary:
  ar: "لاعب كرة قدم جزائري محترف (وُلد سنة 1997 في آرل بفرنسا لأب مغربي وأم جزائرية)، لاعب وسط دفاعي لعب لأرسنال وإمبولي وميلان الذي فاز معه بالدوري الإيطالي سنة 2022، وخاض أكثر من خمسين مباراة دولية مع الجزائر وفاز بكأس الأمم الأفريقية 2019 واختير أفضل لاعب في تلك البطولة."
  en: "Algerian professional footballer (born 1997 in Arles, France, to a Moroccan father and an Algerian mother). A defensive midfielder who played for Arsenal, Empoli and AC Milan — winning Serie A with Milan in 2022 — he has won over fifty caps for Algeria, won the 2019 Africa Cup of Nations with them and was named that tournament's Player of the Tournament."
  ur: "الجزائری پیشہ ور فٹبالر (پیدائش 1997، آرل، فرانس، مراکشی والد اور الجزائری والدہ کے ہاں)۔ دفاعی مڈفیلڈر جو آرسنل، ایمپولی اور اے سی میلان کے لیے کھیلے — میلان کے ساتھ 2022 میں سیری اے جیتی — انہوں نے الجزائر کے لیے پچاس سے زائد بین الاقوامی میچ کھیلے، 2019 افریقہ کپ آف نیشنز جیتا اور اس ٹورنامنٹ کے بہترین کھلاڑی قرار پائے۔"
