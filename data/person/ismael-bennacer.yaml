summary:
  ar: "لاعب كرة قدم جزائري محترف ⁦(وُلد سنة 1997 في آرل بفرنسا لأب مغربي وأم جزائرية)⁩، لاعب وسط دفاعي لعب لأرسنال وإمبولي وميلان الذي فاز معه بالدوري الإيطالي سنة 2022، وخاض أكثر من خمسين مباراة دولية مع الجزائر وفاز بكأس الأمم الأفريقية 2019 واختير أفضل لاعب في تلك البطولة."
  en: "Algerian professional footballer (born 1997 in Arles, France, to a Moroccan father and an Algerian mother). A defensive midfielder who played for Arsenal, Empoli and AC Milan — winning Serie A with Milan in 2022 — he has won over fifty caps for Algeria, won the 2019 Africa Cup of Nations with them and was named that tournament's Player of the Tournament."
  ur: "الجزائری پیشہ ور فٹبالر ⁦(پیدائش 1997، آرل، فرانس، مراکشی والد اور الجزائری والدہ کے ہاں)⁩۔ دفاعی مڈفیلڈر جو آرسنل، ایمپولی اور اے سی میلان کے لیے کھیلے — میلان کے ساتھ 2022 میں سیری اے جیتی — انہوں نے الجزائر کے لیے پچاس سے زائد بین الاقوامی میچ کھیلے، 2019 افریقہ کپ آف نیشنز جیتا اور اس ٹورنامنٹ کے بہترین کھلاڑی قرار پائے۔"
  es: "Futbolista profesional argelino (nacido en 1997 en Arles, Francia, de padre marroquí y madre argelina). Centrocampista defensivo que jugó en el Arsenal, el Empoli y el AC Milan —ganando la Serie A con el Milan en 2022—, ha sido internacional con Argelia en más de cincuenta ocasiones, con la que ganó la Copa Africana de Naciones de 2019 y fue nombrado mejor jugador del torneo."
  fr: "Footballeur professionnel algérien (né en 1997 à Arles, en France, d'un père marocain et d'une mère algérienne). Milieu défensif ayant évolué à Arsenal, Empoli et l'AC Milan – remportant la Serie A avec Milan en 2022 – il compte plus de cinquante sélections en équipe nationale d'Algérie, avec laquelle il a remporté la Coupe d'Afrique des Nations 2019 et a été élu meilleur joueur du tournoi."
  tr: "Cezayirli profesyonel futbolcu (1997'de Fransa'nın Arles kentinde doğdu, Fas kökenli bir baba ve Cezayirli bir annenin çocuğu), Arsenal, Empoli ve Milan'da oynamış defansif orta saha oyuncusudur; 2022'de Milan ile İtalya ligini kazanmıştır. Cezayir ile elliden fazla uluslararası maç oynadı, 2019 Afrika Uluslar Kupası'nı kazandı ve o turnuvanın en iyi oyuncusu seçildi."
  id: "Seorang pesepakbola profesional Aljazair (lahir pada 1997 di Arles, Prancis, dari ayah asal Maroko dan ibu Aljazair), gelandang bertahan yang bermain untuk Arsenal, Empoli, dan Milan, dengan siapa ia memenangkan liga Italia pada 2022. Ia bermain lebih dari lima puluh pertandingan internasional bersama Aljazair, memenangkan Piala Afrika 2019, dan dinobatkan sebagai pemain terbaik turnamen tersebut."
