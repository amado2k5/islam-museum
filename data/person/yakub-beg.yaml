    note: "No source read names a legal school or Sufi order for him. The English article's infobox carries a religion field 'Sunni Islam' — one infobox in one source family, uncorroborated by any text; the Chinese article's infobox and Wikidata (P140) give only 'Islam' in general. His administration of Yettishar enforced Islamic law, dissolved non-Islamic institutions and pressed conversions by decree, but those are acts of state policy by a ruler, not attestations of his personal school affiliation, and his title Ataliq Ghazi ('Champion Father of the Faithful') is a regnal styling, not an attestation. Hanafi convention among Central Asian Muslims is not an attestation. The single-infobox Sunni reading is preserved here; on the museum's two-source rule his faith segment is unknown."
