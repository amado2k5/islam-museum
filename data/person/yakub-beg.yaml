summary:
  ar: "أمير دولة يتشهر (كاشغاريا) في سنجان من 1865 إلى 1877 بلقب أطاليق غازي؛ جاء من كوكند، وُلد نحو 1820 في بسكند، ومات في كورلا في أواخر مايو 1877 في ظروف متنازع عليها."
  en: "Emir of the Yettishar (Kashgaria) state in Xinjiang from 1865 to 1877, under the title Ataliq Ghazi; a Kokandi commander born about 1820 at Pskent who died at Korla in late May 1877 in disputed circumstances."
  ur: "یتشار (کاشغریا) ریاست کے امیر (1865ء تا 1877ء) بعنوان اطالق غازی؛ کوکند کے سپہ سالار، تقریباً 1820ء میں پسکنت میں پیدا ہوئے اور مئی 1877ء کے اواخر میں کورلا میں متنازع حالات میں وفات پائی۔"
