  note: "Born at Pskent in the Khanate of Kokand. The English article's biography gives the year 1820 outright (Kim 2004, p. 77) and its lead 'c. 1820'; the Chinese article's infobox and Wikidata likewise give 1820; the Arabic article gives 1820 or 1825, the 1825 variant recorded here. No source read gives a Hijri pairing for his birth, so no hijri key is carried."
