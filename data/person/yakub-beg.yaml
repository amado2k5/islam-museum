died:
  edtf: "1877-05"
  calendar: gregorian
  precision: month
  status: debated
  derived: false
  note: "Died at Korla in late May 1877; the day and the manner are both contested in the English article's death section: Sayrami's 28 April is impossible (Przewalski met him on 9 May), Chinese sources usually give 22 May, Kuropatkin thought 29 May (the day Wikidata carries), and Sayrami's tradition gives 30 May (the day the English lead and the Chinese article carry); the manner is given variously as poisoning, suicide, death in battle, or a natural death from a stroke, which modern historians following Kim judge most plausible. The date is therefore carried at month precision as debated. No Hijri pairing is attested in the sources read, so no hijri key is carried."
  sources: [source/wikipedia-yakub-beg-en, source/wikipedia-yakub-beg-zh, source/wikidata-yakub-beg]
