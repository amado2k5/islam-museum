summary:
  ar: "أم المؤمنين، ابنة جحش بن رئاب من بني أسد وأمها أميمة بنت عبد المطلب عمة النبي. كانت زوجة مولاه زيد بن حارثة ثم تزوجها النبي، وتذكر دائرة المعارف الإسلامية أن مهرها كان أربعمئة درهم وأن آية الحجاب يقال إنها نزلت وقت وليمة عرسها. اشتهرت بصدقتها، وتوفيت سنة 20هـ بحسب ابن سعد، وهي أول نساء النبي موتاً بعده."
  en: "A Mother of the Believers, daughter of Jahsh son of Ri'ab of the Asad tribe, whose mother Umayma bint Abd al-Muttalib was the Prophet's aunt. She was married to his freedman Zayd ibn Haritha and then to the Prophet; the Encyclopaedia of Islam gives her dowry as 400 dirhams and says the verse of veiling is said to have been revealed at her wedding feast. She was famed for her charity and died in 20 AH according to Ibn Sa'd, the first of his wives to die after him."
  ur: "ام المومنین، قبیلہ اسد کے جحش بن رئاب کی بیٹی، جن کی والدہ امیمہ بنت عبد المطلب نبی کی پھوپھی تھیں۔ پہلے وہ نبی کے آزاد کردہ غلام زید بن حارثہ کے نکاح میں تھیں اور پھر نبی کے نکاح میں آئیں؛ اسلامی دائرۃ المعارف کے مطابق ان کا مہر چار سو درہم تھا اور آیت حجاب ان کی دعوت ولیمہ کے وقت نازل ہوئی بتائی جاتی ہے۔ وہ اپنے صدقے کے لیے مشہور تھیں اور ابن سعد کے مطابق سن 20ھ میں وفات پائی، نبی کے بعد وفات پانے والی ازواج میں سب سے پہلی۔"
