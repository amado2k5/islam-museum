summary:
  ar: "فنانة بصرية باكستانية-أمريكية، وُلدت في لاهور سنة 1969. أحيت فنّ المنمنمات الإندو-فارسية الذي كان منسيًا بين فناني جيلها، إذ درسته في الكلية الوطنية للفنون بلاهور على يد المعلّم بشير أحمد، وكان عمل تخرّجها «المخطوطة» (1989–1990) انطلاقتها وانطلاقة ما سُمّي المنمنمة الجديدة. نالت الماجستير من مدرسة رود آيلاند للتصميم سنة 1995 وتقيم في نيويورك، وامتدّ عملها إلى الرسوم المتحركة والنحت والتركيب، ومنه منحوتتا «الآن» و«الشاهدة» (2023)، ونالت زمالة ماك آرثر سنة 2006."
  en: "Pakistani-American visual artist, born in Lahore in 1969. She revived the Indo-Persian miniature painting that younger artists of her generation had abandoned, studying it at the National College of Arts in Lahore under the master miniaturist Bashir Ahmad; her thesis work The Scroll (1989-90) was her breakthrough and launched what came to be called the neo-miniature. She took her MFA at the Rhode Island School of Design in 1995 and lives in New York; her work has expanded into animation, sculpture and installation, including the sculptures NOW and Witness (2023). She received a MacArthur Fellowship in 2006."
  ur: "پاکستانی-امریکی بصری فنکارہ، 1969 میں لاہور میں پیدا ہوئیں۔ انھوں نے ہند-فارسی منی ایچر مصوری کو زندہ کیا جسے ان کی نسل کے فنکار ترک کر چکے تھے: اسے لاہور کے نیشنل کالج آف آرٹس میں استاد بشیر احمد سے سیکھا، اور ان کے تھیسس کام «دی اسکرول» (1989ء–1990ء) نے انھیں شہرت دی اور نو-منی ایچر کی بنیاد رکھی۔ انھوں نے 1995 میں رہوڈ آئی لینڈ اسکول آف ڈیزائن سے ایم ایف اے کیا اور نیویارک میں رہتی ہیں؛ ان کا کام اینیمیشن، مجسمہ سازی اور تنصیب تک پھیل گیا، جس میں مجسمے «ناؤ» اور «وٹنس» (2023) شامل ہیں۔ انھیں 2006 میں میک آرتھر فیلوشپ ملی۔"
