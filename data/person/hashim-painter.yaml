id: person/hashim-painter
class: person
label: { ar: "هاشم ⁦(مير هاشم، مصور مغولي)⁩", en: "Hashim (Mir Hashim, Mughal painter)", ur: "ہاشم ⁦(میر ہاشم، مغل مصور)⁩", es: "Hashim (Mir Hashim, Mughal painter)", fr: "Hashim (Mir Hashim, Mughal painter)" }
summary:
  ar: "مصور بورتريه مغولي في عهدي جهانگير وشاه جهان، كل أعماله المنسوبة صور أشخاص، أكثرها مفردة على أرضية سادة، ومنها «شاه جهان في شيخوخته» نحو 1650–1655م و«حبشي» نحو 1633م {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 126}."
  en: "Mughal portraitist under Jahangir and Shah Jahan; all works ascribable to him are portraits, mostly single figures on plain grounds, among them Shah Jahan in Old Age (about 1650–55) and An Abyssinian (about 1633) {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 126}."
  ur: "جہانگیر اور شاہ جہان کے دور کے مغل شبیہ نگار؛ ان سے منسوب سب کام شبیہیں ہیں، زیادہ تر سادہ زمین پر اکیلے پیکر، جن میں «بڑھاپے میں شاہ جہان» ⁦(تقریباً 1650–55ء)⁩ اور «ایک حبشی» ⁦(تقریباً 1633ء)⁩ ہیں {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 126}۔"
  es: "Retratista mogol bajo Jahangir y Shah Jahan; todas las obras que se le atribuyen son retratos, en su mayoría figuras individuales sobre fondos lisos, entre ellos Shah Jahan en la vejez (alrededor de 1650–55) y Un abisinio (alrededor de 1633) {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 126}."
  fr: "Portraitiste moghol sous Jahangir et Shah Jahan; toutes les œuvres qui lui sont attribuables sont des portraits, principalement des figures uniques sur des fonds unis, parmi lesquels Shah Jahan dans sa vieillesse (vers 1650-55) et Un Abyssinien (vers 1633) {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 126}."
  tr: "Jahangir ve Shah Cihan döneminde Babür portre ressamı olan Şah'ın tüm eserleri insanların portreleridir; çoğu sade bir zemin üzerinde bireysel olarak tasvir edilmiştir; bunlar arasında 'Şah Cihan'ın Yaşlılığı' (M.S. 1650–1655 civarı) ve 'Habeş' (1633 civarı) {cite:beach-grand-mogul-1978 s. 25} {cite:beach-grand-mogul-1978 s. 126} yer alır."
  id: "Sebagai pelukis potret Mughal pada era Jahangir dan Shah Jahan, semua karya yang dikaitkannya adalah potret orang-orang, sebagian besar individu di latar belakang polos, termasuk 'Shah Jahan in His Old Age' sekitar 1650–1655 M dan 'Abyssinian' sekitar 1633 M {cite:beach-grand-mogul-1978 hlm. 25} {cite:beach-grand-mogul-1978 hlm. 126}."
