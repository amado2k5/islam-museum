label: { ar: "هاشم ⁦(مير هاشم، مصور مغولي)⁩", en: "Hashim (Mir Hashim, Mughal painter)", ur: "ہاشم (میر ہاشم، مغل مصور)" }
summary:
  ar: "مصور بورتريه مغولي في عهدي جهانگير وشاه جهان، كل أعماله المنسوبة صور أشخاص، أكثرها مفردة على أرضية سادة، ومنها «شاه جهان في شيخوخته» نحو 1650–1655م و«حبشي» نحو 1633م {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 126}."
  en: "Mughal portraitist under Jahangir and Shah Jahan; all works ascribable to him are portraits, mostly single figures on plain grounds, among them Shah Jahan in Old Age (about 1650–55) and An Abyssinian (about 1633) {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 126}."
  ur: "جہانگیر اور شاہ جہان کے دور کے مغل شبیہ نگار؛ ان سے منسوب سب کام شبیہیں ہیں، زیادہ تر سادہ زمین پر اکیلے پیکر، جن میں «بڑھاپے میں شاہ جہان» (تقریباً 1650–55ء) اور «ایک حبشی» (تقریباً 1633ء) ہیں {cite:beach-grand-mogul-1978 p. 25} {cite:beach-grand-mogul-1978 p. 126}۔"
