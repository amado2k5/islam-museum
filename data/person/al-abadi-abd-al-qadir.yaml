gender: male
summary:
  ar: "محيي الدين عبد القادر العبادي المالكي النحوي نحوي مكة؛ قال السيوطي في بغية الوعاة أما التفسير فكشاف خفياته وأما الحديث فإليه الرحلة في رواياته وأما الفقه فمالك زمامه وأما النحو فمحيي مداره ولو رآه سيبويه لأقر له، ولد في ثامن عشر ربيع الآخر سنة أربع عشرة وثمانمائة بمكة ونشأ بها وسمع من التقي الفاسي وأبي الحسن بن سلامة وجماعة وأجازت له عائشة بنت عبد الهادي وابن الكويك وعبد القادر الأرموي والبدر الدماميني وتفقه على جماعة وأجاز له البساطي بالإفتاء والتدريس وكتب الخط المنسوب وتصدر بمكة للإفتاء وتدريس الفقه والتفسير والعربية، توفي سنة ثمانين وثمانمائة {cite:shadharat-dhahab p. 329-330}."
  en: "Al-'Abadi (b. Mecca 18 Rabi' II 814) — the Maliki nahwi of Mecca, recipient of al-Suyuti's praise litany ('had Sibawayh seen him he would have owned him'); heard al-Fasi, was licensed by al-Bisati; died 880 {cite:shadharat-dhahab p. 329-330}."
