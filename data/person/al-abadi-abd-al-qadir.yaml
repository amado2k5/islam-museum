summary:
  ar: "محيي الدين عبد القادر العبادي المالكي النحوي نحوي مكة؛ قال السيوطي في بغية الوعاة أما التفسير فكشاف خفياته وأما الحديث فإليه الرحلة في رواياته وأما الفقه فمالك زمامه وأما النحو فمحيي مداره ولو رآه سيبويه لأقر له، ولد في ثامن عشر ربيع الآخر سنة أربع عشرة وثمانمائة بمكة ونشأ بها وسمع من التقي الفاسي وأبي الحسن بن سلامة وجماعة وأجازت له عائشة بنت عبد الهادي وابن الكويك وعبد القادر الأرموي والبدر الدماميني وتفقه على جماعة وأجاز له البساطي بالإفتاء والتدريس وكتب الخط المنسوب وتصدر بمكة للإفتاء وتدريس الفقه والتفسير والعربية، توفي سنة ثمانين وثمانمائة {cite:shadharat-dhahab p. 329-330}."
  en: "Al-'Abadi (b. Mecca 18 Rabi' II 814) — the Maliki nahwi of Mecca, recipient of al-Suyuti's praise litany ('had Sibawayh seen him he would have owned him'); heard al-Fasi, was licensed by al-Bisati; died 880 {cite:shadharat-dhahab p. 329-330}."
  fr: "Al-‘Abadi (né à La Mecque le 18 Rabi’ II 814 H) — grammairien malikite de La Mecque, destinataire des éloges d’al-Suyuti (« si Sibawayh l’avait vu, il aurait reconnu son mérite ») ; il entendit al-Fasi et reçut l’autorisation d’al-Bisati ; mort en 880 H {cite:shadharat-dhahab p. 329-330}."
  es: "Al-'Abadi (n. La Meca 18 Rabi' II 814) — el nahwi malikí de La Meca, receptor de la letanía de alabanza de al-Suyuti ('si Sibawayh lo hubiera visto, lo habría reconocido'); escuchó a al-Fasi, fue autorizado por al-Bisati; murió en 880 {cita: shadharat-dhahab p. 329-330}."
  ur: "العبادی ⁦(پیدائش مکہ 18 ربیع الثانی 814)⁩ - مکہ کے مالکی نحوی، السیوطی کی تعریفی لطافت کا وصول کنندہ ⁦('اگر سیبویہ اسے دیکھتا تو وہ اس کا مالک ہوتا')⁩؛ الفاسی کو سنا، البساتی نے لائسنس یافتہ تھا۔ وفات 880۔ 329-330}۔"
  tr: "Mekke'nin dilbilgisi uzmanı Muhyi al-Din Abd al-Qadir al-Abadi al-Maliki al-Nahwi hakkında Al-Suyuti, Bughyat al-Wu’at adlı eserinde şöyle demiştir: Tefsir konusunda o, gizli anlamlarını açığa çıkarandır; hadis konusunda insanlar rivayetleri için ona gelirler; fıkıh konusunda o, dizginlerinin efendisidir; dilbilgisi konusunda o, yörüngesini yeniden canlandırandır ve eğer Sibawayh onu görmüş olsaydı, onu tanırdı. O, 814 yılında Rebiü'l-Ahir ayının 18. gününde Mekke'de doğdu, orada büyüdü ve Takî el-Fasi, Ebu el-Hasan ibn Seleme ve bir grup insandan ilim öğrendi. Ayşe bint Abdül-Hadi, İbn el-Kuveyk, Abdülkadir el-Armavi ve Bedr el-Damamini ona öğretme izni verdi. Bir grupla fıkıh eğitimi aldı ve Basati ona fetva verme ve öğretme izni verdi. Rivayet edilen metni yazdı ve Mekke'de fetva verme, fıkıh, tefsir ve Arapça öğretme konusunda önde gelen otorite oldu. 880 yılında vefat etti. {Kaynak: Şadharat-Dhaba, s. 329-330}"
  id: "Muhyi al-Din Abd al-Qadir al-Abadi al-Maliki al-Nahwi, ahli tata bahasa Mekah; Al-Suyuti berkata dalam Bughyat al-Wu’at: Adapun soal tafsir, dialah yang menyingkap makna-makna tersembunyinya, adapun soal hadits, orang-orang mendatanginya untuk mendapatkan riwayat-riwayatnya, adapun soal fiqih, dialah yang menguasai bidangnya, adapun soal tata bahasa, dialah yang menghidupkan kembali bidangnya, dan seandainya Sibawayh melihatnya, dia pasti akan mengakuinya. Beliau lahir pada tanggal 18 Rabi' al-Akhir tahun 8014 di Mekah, dan dibesarkan di sana serta belajar dari al-Taqi al-Fasi, Abu al-Hasan ibn Salamah dan sekelompok orang, dan Aisyah binti Abd al-Hadi, Ibn al-Kuwaik, Abd al-Qadir al-Armawi dan al-Badr al-Damamini memberinya izin untuk mengajar, dan beliau mempelajari fiqih bersama sekelompok orang, dan al-Basati memberinya izin untuk mengeluarkan fatwa dan mengajar, dan beliau menulis kitab yang dinisbahkan, dan beliau menjadi otoritas terkemuka di Mekah dalam mengeluarkan fatwa dan mengajar fiqih, tafsir dan bahasa Arab. Beliau wafat pada tahun 8018. {cite:shadharat-dhahab hlm. 329-330}."
