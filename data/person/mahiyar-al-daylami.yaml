label:
  ar: "مهيار بن مرزويه الديلمي الكاتب"
  en: "Mahiyar al-Daylami"
summary:
  ar: "أبو الحسن مهيار بن مرزويه الكاتب الفارسي؛ كان مجوسيًّا فأسلم سنة أربع وتسعين وثلاثمائة وصار رافضيًّا غاليًّا، وفي شعره لطف إلا أنه يذكر الصحابة بما لا يصلح. قال له أبو القاسم ابن برهان: «يا مهيار انتقلت بإسلامك في النار من زاوية إلى زاوية، لأنك كنت مجوسيًّا فأسلمت فصرت تسبّ الصحابة». كان منزله بدرب رياح بالكرخ، وقد خبأ في هِميان ثوبه ألف دينار فدلّت عليه خادمته فسُعي به إلى جلال الدولة فقُبض عليه ثم أُطلقه. توفي في جمادى الآخرة سنة ثمان وعشرين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.436-437}."
  en: "Abu'l-Hasan Mahiyar ibn Marzuya, the Persian katib and poet — a Magian who converted to Islam in 294 and became an extreme Rafidi; Ibn Burhan told him his conversion had only moved him 'from one corner of the fire to another'. His servant betrayed a thousand dinars hidden in his hem to Jalal al-Dawla, who arrested then released him. Died Jumada II 428 {cite:muntazam-ibn-al-jawzi j.8 p.436-437}."
