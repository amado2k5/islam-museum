    note: "Recorded on his attested affiliation with the Bektashiyya, the Sufi order, stated here in full so the reader can judge the basis: three independently edited articles record that he sat on the Albanian High Council of Regency as the Bektashi community's own representative — the English article: 'elected member of Albanian High Council of Regency as a representative of the Bektashi community in December 1921'; the Albanian article: he 'replaced Aqif Pasha Elbasani as representative of the Bektashi element' on the council; the Turkish article: 'elected member of the High Council of Regency as representative of the Bektashi community' (Bektaşi cemaatinin temsilcisi). The regency's four seats were allotted by religious community and held by members of each, so the three statements attest his affiliation with the order, not merely an office he happened to fill; on two-plus independent attestations of the affiliation itself, the sufi segment is recorded, as the lane's counting rule allows. No source names a madhhab or a personal creed for him beyond this, and Wikidata carries no religion statement for him at all. He is not to be confused with his grandfather and namesake Omer Vrioni (d. after 1828), whose own articles (Albanian and Turkish, without the 'II') describe the commander of Alamana, Gravia and the first siege of Missolonghi; the two men have separate articles in both Wikipedias and separate Wikidata items (Q3352014 and Q719844)."
