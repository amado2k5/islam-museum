summary:
  ar: "أرستقراطي وسياسي عثماني-ألباني (1839-1928) من أسرة فريوني أصحاب الأراضي في بيرات وفيير وميزيكيه. ارتبط اسمه بمدينة فيير التي أسسها أبوه — أو أسسها هو بحسب روايات أخرى — وبرابطة بريزرن سنة 1878، وبمجلس الوصاية العالي الألباني الذي جلس فيه ممثلا للطائفة البكتاشية من ديسمبر 1921. وهو غير جدّه وشريكه في الاسم عمر فريوني، القائد العثماني في حرب الاستقلال اليونانية (ت. بعد 1828)."
  en: "Ottoman-Albanian landowner and politician (1839–1928) of the Vrioni family of Berat, Fier and Myzeqe. His name is tied to the city of Fier — founded by his father, or by him, on conflicting accounts — to the League of Prizren of 1878, and to the Albanian High Council of Regency, where he sat from December 1921 as the representative of the Bektashi community. He is not his grandfather and namesake Omer Vrioni, the Ottoman commander of the Greek War of Independence (d. after 1828)."
  ur: "عثمانی۔البانوی زمیندار اور سیاست دان (1839-1928)، بیرات، فیئر اور میزیکے کے وریونی خاندان سے۔ ان کا نام شہرِ فیئر سے جڑا ہے — جسے متضاد روایات کے مطابق ان کے والد یا خود انہوں نے قائم کیا — 1878 کی لیگ آف پریزرن سے، اور البانوی مجلسِ وصایتِ عالیہ سے، جہاں وہ دسمبر 1921 سے بکتاشی برادری کے نمائندے کے طور پر بیٹھے۔ یہ یونانی جنگِ آزادی کے عثمانی سپہ سالار، ان کے ہم نام دادا عمر وریونی (وفات 1828 کے بعد) سے الگ شخص ہیں۔"
