summary:
  ar: "بلقيس بانو إيدهي (14 أغسطس 1947 – 15 أبريل 2022) ممرضة وفاعلة خير باكستانية، وُلدت في بانتفا وانتقلت مع أسرتها إلى كراتشي بعد التقسيم، فعملت ممرضة في مستوصف إيدهي بميثادر وتزوجت عبد الستار إيدهي سنة 1965، وشاركته رئاسة مؤسسة إيدهي وقادت مشروع المهد (جھولا) الذي أقام أكثر من 300 مهد لاستقبال الرضّع المتروكين في أنحاء باكستان، ونالت جائزة رامون ماغسايساي للخدمة العامة سنة 1986 وهلال الامتياز."
  en: "Bilquis Bano Edhi (14 August 1947 – 15 April 2022) was a Pakistani nurse and philanthropist, born at Bantva, who moved with her family to Karachi after Partition, worked as a nurse at the Edhi dispensary in Mithadar, married Abdul Sattar Edhi in 1965, co-chaired the Edhi Foundation with him and led the jhoola cradle project that placed more than 300 cradles for surrendered infants across Pakistan; she received the 1986 Ramon Magsaysay Award for Public Service and the Hilal-i-Imtiaz."
  ur: "بلقیس بانو ایدھی (14 اگست 1947ء – 15 اپریل 2022ء) پاکستانی نرس اور فلاحی شخصیت تھیں، بانٹوا میں پیدا ہوئیں اور تقسیم کے بعد خاندان کے ساتھ کراچی منتقل ہوئیں، میٹھادر میں ایدھی ڈسپنسری میں نرس کے طور پر کام کیا، 1965ء میں عبد الستار ایدھی سے شادی ہوئی، ان کے ساتھ ایدھی فاؤنڈیشن کی شریک چیئر رہیں اور جھولا منصوبے کی قیادت کی جس نے پاکستان بھر میں چھوڑے گئے نومولودوں کے لیے 300 سے زائد جھولے قائم کیے؛ انھیں 1986ء کا رومن میگسیسی ایوارڈ برائے عوامی خدمت اور ہلال امتیاز ملا۔"
