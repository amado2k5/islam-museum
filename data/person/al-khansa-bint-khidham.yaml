summary:
  ar: 'أنصارية من بني عمرو بن عوف، ثبت حديثها في الموطأ: زوّجها أبوها وهي كارهة فأتت النبي فردّ نكاحها، وتزوجت بعد ذلك أبا لبابة بن عبد المنذر فولدت له السائب.'
  en: 'An Ansari woman of Banu Amr ibn Awf whose hadith is established in the Muwatta'': her father married her off against her wishes, she went to the Prophet and he annulled the marriage; she later married Abu Lubaba ibn Abd al-Mundhir and
    bore him al-Sa''ib.'
  ur: "بنو عمرو بن عوف کی انصاری خاتون جن کی حدیث موطا میں ثابت ہے: ان کے والد نے ان کی مرضی کے خلاف شادی کی تو انہوں نے نبی سے شکایت کی۔"
