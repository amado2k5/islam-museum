summary:
  ar: 'أنصارية من بني عمرو بن عوف، ثبت حديثها في الموطأ: زوّجها أبوها وهي كارهة فأتت النبي فردّ نكاحها، وتزوجت بعد ذلك أبا لبابة بن عبد المنذر فولدت له السائب.'
  en: 'An Ansari woman of Banu Amr ibn Awf whose hadith is established in the Muwatta'': her father married her off against her wishes, she went to the Prophet and he annulled the marriage; she later married Abu Lubaba ibn Abd al-Mundhir and
    bore him al-Sa''ib.'
  ur: "بنو عمرو بن عوف کی انصاری خاتون جن کی حدیث موطا میں ثابت ہے: ان کے والد نے ان کی مرضی کے خلاف شادی کی تو انہوں نے نبی سے شکایت کی۔"
  es: "Una mujer ansari de Banu Amr ibn Awf cuyo hadiz está establecido en el Muwatta': su padre la casó en contra de su voluntad, ella fue al Profeta y él anuló el matrimonio; más tarde se casó con Abu Lubaba ibn Abd al-Mundhir y le dio a luz a al-Sa'ib."
  fr: "Une femme Ansari de Banu Amr ibn Awf dont le hadith est établi dans le Muwatta': son père l'a mariée contre son gré, elle est allée voir le Prophète et il a annulé le mariage; elle a ensuite épousé Abu Lubaba ibn Abd al-Mundhir et lui a donné al-Sa'ib."
  tr: "Banu Amr bin Avf'tan gelen Ensariye, hadisi Al-Muwatta'da doğrulanmıştır: Babası hoşnutsuzluktan evlendi, bu yüzden Peygamber'e gelip evliliğini kararlaştırdı. Bundan sonra Ebu Lubabah bin Abdül-Mundhir ile evlendi ve ona El-Seyip doğurdu."
  id: "Ansariyyah dari Banu Amr ibn Awf, yang haditsnya disahkan dalam Al-Muwatta': Ayahnya menikahinya karena tidak suka, sehingga dia datang kepada Nabi dan memutuskan pernikahannya. Setelah itu, dia menikahi Abu Lubabah ibn Abd al-Mundhir dan melahirkan Al-Sa'ib."
