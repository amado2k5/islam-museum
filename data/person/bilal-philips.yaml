summary:
  ar: "عالم وداعية كندي وُلد في كينغستون بجامايكا سنة 1947 باسم دنيس برادلي فيليبس، ونشأ مسيحيا ثم اعتنق الإسلام سنة 1972؛ نال البكالوريوس من الجامعة الإسلامية بالمدينة المنورة (1979) والماجستير من جامعة الملك سعود (1985) والدكتوراه من جامعة ويلز، وهو مؤسس الجامعة الإسلامية المفتوحة عبر الإنترنت (International Open University) ومستشارها، ويقيم في قطر، وله أكثر من خمسين كتابا مترجمة إلى لغات عدة."
  en: "Canadian Islamic scholar and preacher born Dennis Bradley Philips in Kingston, Jamaica, in 1947; raised Christian, he converted to Islam in 1972, took a bachelor's degree at the Islamic University of Madinah (1979), a master's at King Saud University (1985) and a PhD at the University of Wales, and is the founder and chancellor of the International Open University (Islamic Online University); he lives in Qatar and has written, translated and commented on over fifty books."
  ur: "کینیڈین ماہرِ اسلامیات و مبلغ، 1947 میں کنگسٹن، جمیکا میں ڈینس بریڈلی فلپس کے نام سے پیدا ہوئے؛ مسیحی ماحول میں پرورش پائی اور 1972 میں اسلام قبول کیا، جامعہ اسلامیہ مدینہ منورہ سے بیچلر (1979)، جامعہ شاہ سعود سے ماسٹرز (1985) اور جامعہ ویلز سے پی ایچ ڈی کی، اور وہ انٹرنیشنل اوپن یونیورسٹی (اسلامک آن لائن یونیورسٹی) کے بانی و چانسلر ہیں؛ وہ قطر میں مقیم ہیں اور ان کی پچاس سے زائد کتابیں کئی زبانوں میں ترجمہ ہو چکی ہیں۔"
