summary:
  ar: صحابي من بني النجار ابن أخي حسان بن ثابت؛ وصفه عبادة بن الصامت بأنه ممن أوتي العلم والحلم، وسكن حمص ثم فلسطين، ودُفن ببيت المقدس سنة 58هـ على الراجح.
  en: A Companion of Banu al-Najjar and nephew of Hassan ibn Thabit; Ubada ibn al-Samit described him as one given both knowledge and forbearance; he lived in Homs and then Palestine and was buried in Jerusalem, most likely in 58 AH.
  ur: "بنو نجار کا صحابی اور حسان بن ثابت کا بھانجا؛ عبادہ بن صامت نے اسے علم اور بہادری دونوں دینے والا بتایا۔"
  es: "Compañero de Banu al-Najjar y sobrino de Hassan ibn Thabit; Ubada ibn al-Samit lo describió como alguien dotado de conocimiento y paciencia; vivió en Homs y luego en Palestina y fue enterrado en Jerusalén, muy probablemente en el año 58 de la Hégira."
  fr: "Compagnon des Banu al-Najjar et neveu de Hassan ibn Thabit; Ubada ibn al-Samit le décrit comme doté à la fois de savoir et de patience; il vécut à Homs puis en Palestine et fut enterré à Jérusalem, très probablement en 58 AH."
  tr: "Hasan ibn Tebit'in yeğeni Banu el-Neccer'den bir yoldaş; Ubadah ibn al-Samit, onu bilgi ve sabırla donanmış, önce Homs'ta ve ardından Filistin'de yaşayan ve en doğru görüşe göre 58 Hicri Kudüs'te gömülmüş biri olarak tanımlamıştır."
  id: "Seorang sahabat dari Banu al-Najjar, keponakan Hassan ibn Thabit; Ubadah ibn al-Samit menggambarkannya sebagai seseorang yang dianugerahi pengetahuan dan kesabaran, yang tinggal di Homs saat itu Palestina, dan dimakamkan di Yerusalem pada tahun 58 H menurut pendapat yang paling benar."
