id: person/abd-al-haqq-ibn-mahyu
class: person
label:
  ar: عبد الحق بن محيو
  en: Abd al-Haqq ibn Mahyu
summary:
  ar: "عبد الحق بن محيو بن أبي بكر بن حمامة الزناتي المريني؛ أكبر ولد محيو فقام بأمر بني مرين بعده، وكان خير أمير عليهم قياماً بمصالحهم وتعففاً عما في أيديهم وتقويماً لهم على الجادة ونظراً في العواقب فاستمرت أيامهم، وكانوا يطرقون جهات كرسيف إلى وطاط في صعودهم من القفار ويأنسون ببقايا زناتة الأولى، ولما أظلم الجو بينهم وبين دولة الموحدين التقوا بعساكر الرشيد بسوادي نكور فكان الظهور لهم عام المشغلة، ثم لما ثاروا إلى المغرب تولى الصبر حربهم مع بني محمد ومظاهرتهم أوليساء سنة أربع عشرة وستمائة فهلك فيها عبد الحق وكبير بنيه إدريس، وكان له عشرة من الولد تسعة ذكور منهم عثمان ومحمد وأبو يحيى."
  en: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hammama al-Zanati al-Marini; eldest of Mahyu's sons, he led Banu Marin after him — 'the best amir over them in serving their interests, holding back from their goods, keeping them to the course and weighing outcomes' — grazing the steppe between Figuig and Mulwiya, winning the 'year of al-Mushaghghala' rout of al-Rashid's armies at the Nekur plain, then falling in the year-614 war against Banu Muhammad's confederation, he and his eldest son Idris together, leaving ten children of whom Uthman, Muhammad and Abu Yahya would carry the house."
