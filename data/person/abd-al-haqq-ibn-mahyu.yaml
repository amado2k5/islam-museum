id: person/abd-al-haqq-ibn-mahyu
class: person
label:
  ar: عبد الحق بن محيو
  en: Abd al-Haqq ibn Mahyu
  fr: "Abd al-Haqq ibn Mahyu"
  es: "Abd al-Haqq ibn Mahyu"
  ur: "عبد الحق بن ماہیو"
summary:
  ar: "عبد الحق بن محيو بن أبي بكر بن حمامة الزناتي المريني؛ أكبر ولد محيو فقام بأمر بني مرين بعده، وكان خير أمير عليهم قياماً بمصالحهم وتعففاً عما في أيديهم وتقويماً لهم على الجادة ونظراً في العواقب فاستمرت أيامهم، وكانوا يطرقون جهات كرسيف إلى وطاط في صعودهم من القفار ويأنسون ببقايا زناتة الأولى، ولما أظلم الجو بينهم وبين دولة الموحدين التقوا بعساكر الرشيد بسوادي نكور فكان الظهور لهم عام المشغلة، ثم لما ثاروا إلى المغرب تولى الصبر حربهم مع بني محمد ومظاهرتهم أوليساء سنة أربع عشرة وستمائة فهلك فيها عبد الحق وكبير بنيه إدريس، وكان له عشرة من الولد تسعة ذكور منهم عثمان ومحمد وأبو يحيى."
  en: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hammama al-Zanati al-Marini; eldest of Mahyu's sons, he led Banu Marin after him — 'the best amir over them in serving their interests, holding back from their goods, keeping them to the course and weighing outcomes' — grazing the steppe between Figuig and Mulwiya, winning the 'year of al-Mushaghghala' rout of al-Rashid's armies at the Nekur plain, then falling in the year-614 war against Banu Muhammad's confederation, he and his eldest son Idris together, leaving ten children of whom Uthman, Muhammad and Abu Yahya would carry the house."
  fr: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hammama al-Zanati al-Marini ; aîné des fils de Mahyu, il dirigea les Banu Marin après lui — « le meilleur émir qu'ils eurent pour servir leurs intérêts, s'abstenir de leurs biens, les maintenir sur la voie et peser les conséquences » —, faisant paître la steppe entre Figuig et la Moulouya, remportant l'« année d'al-Mushaghghala » la déroute des armées d'al-Rashid dans la plaine de Nekor, puis tombant dans la guerre de l'an 614 contre la confédération des Banu Muhammad, lui et son fils aîné Idris ensemble, laissant dix enfants dont Uthman, Muhammad et Abu Yahya porteraient la maison."
  es: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hammama al-Zanati al-Marini, el mayor de los hijos de Mahyu, lideró a los Banu Marin después de él —«el mejor emir sobre ellos en servir a sus intereses, conteniéndose de sus bienes, manteniéndolos en el camino correcto y sopesando las consecuencias»— pastoreando la estepa entre Figuig y Mulwiya, ganando la derrota del «año de al-Mushaghghala» de los ejércitos de al-Rashid en la llanura de Nekur, para luego caer en la guerra del año 614 contra la confederación de Banu Muhammad, él y su hijo mayor Idris juntos, dejando diez hijos de los cuales Uthman, Muhammad y Abu Yahya continuarían con la casa."
  ur: "عبد الحق ابن ماہیو ابن ابی بکر ابن ہمامہ الزناتی المرینی ; ماہیو کے سب سے بڑے بیٹوں میں سے اس نے بنو مارین کی قیادت کی - 'ان کے مفادات کو پورا کرنے میں، ان کے سامان سے باز رکھنے، انھیں راستے پر رکھنے اور نتائج کو تولنے میں ان پر بہترین امیر' - فگویگ اور مولویہ کے درمیان میدان چراتے ہوئے، 'المشاغلہ کا سال' جیت کر میدان الرشیس کے زوال کے مقام پر فتح حاصل کی۔ سال 614 میں بنو محمد کی کنفیڈریشن کے خلاف جنگ ہوئی، وہ اور اس کے بڑے بیٹے ادریس ایک ساتھ، دس بچے چھوڑ گئے جن میں سے عثمان، محمد اور ابو یحییٰ گھر کو سنبھالیں گے۔"
  tr: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hamama al-Zanati al-Marini; Mahyu'nun en büyük oğlu, kendisinden sonra Beni Marin'in işlerini devraldı ve onların çıkarlarını gözetme, ellerine geçen işlerden uzak durma, onları doğru yola yönlendirme ve sonuçları dikkate alma konusunda en iyi emir oldu. Günleri böyle devam etti ve çöllerden yükselirken Karsif bölgelerine, Watāt'a doğru yolculuk ederlerdi ve ilk Zenata'nın kalıntıları tarafından teselli edilirlerdi. Onlarla Almohadlar devleti arasında hava karardığında, Nekor vadisinde Raşid'in askerleriyle karşılaştılar ve işgal yılında onlara göründü. Sonra Mağrip'e isyan ettiklerinde, sabrı Beni Muhammed ile olan savaşlarında ve Ulaysa'ya desteklerinde 14600 yılında devreye girdi ve Abdülhakk ile en büyük oğlu İdris öldü. İdris'in on çocuğu vardı, dokuzu erkekti; Osman, Muhammed ve Ebu Yahya da bunlardan bazılarıydı."
  id: "Abd al-Haqq ibn Mahyu ibn Abi Bakr ibn Hamama al-Zanati al-Marini; Putra tertua Mahyu, yang mengambil alih urusan Bani Marin setelahnya, dan dia adalah emir terbaik atas mereka dalam hal menjaga kepentingan mereka, menahan diri dari apa yang ada di tangan mereka, mengoreksi mereka di jalan yang benar, dan mempertimbangkan konsekuensinya, sehingga hari-hari mereka berlanjut, dan mereka biasa melakukan perjalanan ke daerah Karsif menuju Watāt ketika mereka naik dari padang pasir dan mereka dihibur oleh sisa-sisa Zenata pertama, dan ketika suasana menjadi gelap antara mereka dan negara Almohad, mereka bertemu dengan tentara al-Rashid di lembah Nekor, dan kemunculan mereka terjadi pada tahun pendudukan, kemudian ketika mereka memberontak ke Maghreb, kesabaran menguasai perang mereka dengan Bani Muhammad dan dukungan mereka untuk Ulaysa pada tahun 14600, dan Abd al-Haqq dan putra tertuanya Idris meninggal dalam perang itu, dan dia memiliki sepuluh anak, sembilan di antaranya laki-laki, termasuk Utsman, Muhammad, dan Abu Yahya."
