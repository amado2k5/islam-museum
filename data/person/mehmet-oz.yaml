summary:
  ar: "طبيب ومقدم تلفزيوني ومسؤول حكومي أمريكي من أصل تركي، وُلد في كليفلاند سنة 1960 لأبوين تركيين مهاجرين، وتدرّب جرّاحًا للقلب حتى صار أستاذًا للجراحة في جامعة كولومبيا، ثم عرفه الجمهور العالمي من ظهوره في برنامج أوبرا وينفري ومن «برنامج دكتور أوز» الذي استمر 13 موسمًا ونال عشر جوائز إيمي نهارية، وقد واجه نقدًا علميًا واسعًا لترويجه ما وصفه ناقدوه بالعلم الزائف، وترشح سنة 2022 لمجلس الشيوخ عن بنسلفانيا فكان أول مسلم يرشحه حزب كبير للمجلس وخسر السباق، ثم عيّنه الرئيس ترامب سنة 2025 مديرًا لمراكز الرعاية الصحية والخدمات الطبية (CMS)."
  en: "Turkish-American physician, television presenter and government official, born in Cleveland in 1960 to Turkish immigrant parents. He trained as a cardiac surgeon and became a professor of surgery at Columbia University, then reached a global audience through The Oprah Winfrey Show and The Dr. Oz Show, which ran 13 seasons and won ten Daytime Emmy Awards; his promotion of what critics call pseudoscience drew sustained scientific criticism. In 2022 he ran for the U.S. Senate in Pennsylvania as the first Muslim nominated for the Senate by a major party and lost, and in 2025 President Trump appointed him administrator of the Centers for Medicare & Medicaid Services (CMS)."
  ur: "ترک نژاد امریکی طبیب، ٹیلی ویژن میزبان اور حکومتی عہدے دار، جو 1960 میں کلیو لینڈ میں ترک مہاجر والدین کے ہاں پیدا ہوئے۔ دل کے سرجن کے طور پر کولمبیا یونیورسٹی میں جراحی کے پروفیسر بنے، پھر اوپرا ونفرے شو اور «دی ڈاکٹر اوز شو» سے دنیا بھر میں مشہور ہوئے؛ ان کے بعض طبی دعووں پر سائنسی حلقوں نے سخت تنقید کی۔ 2022 میں وہ سینیٹ کے لیے کسی بڑی پارٹی کے پہلے مسلم امیدوار بنے اور ہار گئے، اور 2025 میں صدر ٹرمپ نے انہیں سینٹرز فار میڈیکیئر اینڈ میڈیکیڈ سروسز کا سربراہ مقرر کیا۔"
