summary:
  ar: "أبو بكر محمد بن عبد الله بن محمد المعافري الأندلسي الإشبيلي الحافظ المشهور؛ قال فيه شيخه ابن بشكوال في الصلة «هو الحافظ المستبحر ختام علماء الأندلس وآخر أعلامها وحفاظها»؛ رحل إلى المشرق مع أبيه سنة خمس وثمانين وأربعمائة فتفقه على الطرطوشي ودخل بغداد وصحب أبا بكر الشاشي وأبا حامد الغزالي، وحج ودخل مصر فكتب عن علمائها ثم عاد إلى الأندلس سنة ثلاث وتسعين؛ استُقضي ببلده فنفع أهلها ثم صُرف عن القضاء فأقبل على نشر العلم؛ له مصنفات منها كتاب «عارضة الأحوذي في شرح الترمذي» {cite:wafayat-ayan}."
