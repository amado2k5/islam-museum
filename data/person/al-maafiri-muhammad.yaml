summary:
  ar: "أبو بكر محمد بن عبد الله بن محمد المعافري الأندلسي الإشبيلي الحافظ المشهور؛ قال فيه شيخه ابن بشكوال في الصلة «هو الحافظ المستبحر ختام علماء الأندلس وآخر أعلامها وحفاظها»؛ رحل إلى المشرق مع أبيه سنة خمس وثمانين وأربعمائة فتفقه على الطرطوشي ودخل بغداد وصحب أبا بكر الشاشي وأبا حامد الغزالي، وحج ودخل مصر فكتب عن علمائها ثم عاد إلى الأندلس سنة ثلاث وتسعين؛ استُقضي ببلده فنفع أهلها ثم صُرف عن القضاء فأقبل على نشر العلم؛ له مصنفات منها كتاب «عارضة الأحوذي في شرح الترمذي» {cite:wafayat-ayan}."
  en: "Abu Bakr Muhammad ibn Abd Allah ibn Muhammad al-Ma'afiri al-Andalusi al-Ishbili, the well-known hafiz. His teacher Ibn Bashkuwal said of him in the Silah: 'He was the wide-ranging hafiz, the last of the scholars of al-Andalus and the last of its masters and hafizs.' He travelled to the East with his father in 485, studied fiqh under al-Turtushi, entered Baghdad and kept company with Abu Bakr al-Shashi and Abu Hamid al-Ghazali. He performed the pilgrimage and entered Egypt, where he wrote down from its scholars. He returned to al-Andalus in 493. He was appointed judge in his town and benefited its people, then was removed from judgeship and turned fully to spreading knowledge. His works include 'Aridat al-Ahwadhi fi sharh al-Tirmidhi' {cite:wafayat-ayan}."
  es: "Abu Bakr Muhammad ibn Abd Allah ibn Muhammad al-Ma'afiri al-Andalusi al-Ishbili, el renombrado hafiz. Su maestro Ibn Bashkuwal dijo de él en el Silah: «Fue el hafiz de amplio conocimiento, el último de los eruditos de al-Ándalus y el último de sus maestros y hafiz». Viajó a Oriente con su padre en 485, estudió fiqh con al-Turtushi, entró en Bagdad y se relacionó con Abu Bakr al-Shashi y Abu Hamid al-Ghazali. Realizó la peregrinación y entró en Egipto, donde transcribió las enseñanzas de sus eruditos. Regresó a al-Ándalus en 493. Fue nombrado juez en su ciudad y benefició a sus habitantes; posteriormente fue destituido del cargo y se dedicó por completo a la difusión del conocimiento. Entre sus obras se encuentra «Aridat al-Ahwadhi fi sharh al-Tirmidhi» {cite:wafayat-ayan}."
  fr: "Abou Bakr Muhammad ibn Abd Allah ibn Muhammad al-Ma'afiri al-Andalusi al-Ishbili, le célèbre hafiz. Son maître, Ibn Bashkuwal, dit de lui dans la Silah: « Il était le hafiz le plus érudit, le dernier des savants d'al-Andalus et le dernier de ses maîtres et hafiz. » Il voyagea en Orient avec son père en 485, étudia le fiqh auprès d'al-Turtushi, entra à Bagdad et fréquenta Abou Bakr al-Shashi et Abou Hamid al-Ghazali. Il accomplit le pèlerinage et se rendit en Égypte, où il consigna les enseignements des savants. Il retourna en al-Andalus en 493. Nommé juge dans sa ville, il œuvra pour le bien de ses habitants, puis fut démis de ses fonctions et se consacra pleinement à la diffusion du savoir. Parmi ses œuvres figure « Aridate al-Ahwadhi fi sharh al-Tirmidhi » (voir: wafayat-ayan)."
  ur: "ابو بکر محمد بن عبد اللہ ابن محمد المافری الاندلسی العشبیلی المعروف حافظ۔ ان کے استاد ابن بشکوال نے سلاح میں ان کے بارے میں کہا: 'وہ وسیع القلب حافظ تھے، اندلس کے علماء میں سے آخری اور اس کے آقا و حافظ میں سے آخری تھے۔' اس نے 485 میں اپنے والد کے ساتھ مشرق کا سفر کیا، الطرطوشی کے تحت فقہ کی تعلیم حاصل کی، بغداد میں داخل ہوئے اور ابو بکر الشاشی اور ابو حامد الغزالی کے ساتھ صحبت کی۔ اس نے حج کیا اور مصر میں داخل ہوا، جہاں اس نے اس کے علماء سے لکھا۔ وہ 493 میں اندلس واپس آیا۔ اسے اپنے قصبے میں قاضی مقرر کیا گیا اور اس نے وہاں کے لوگوں کو فائدہ پہنچایا، پھر قاضی کے عہدے سے ہٹا دیا گیا اور علم پھیلانے کی طرف پوری طرح سے رجوع کر لیا۔ ان کی تصانیف میں 'اردات الاحوادی فی شرح الترمذی' شامل ہیں۔"
  tr: "Ebu Bekir Muhammed bin Abdullah ibn Muhammed el-Ma'aferi el-Endülüs el-İşbili ünlü bir hafizdi; hocası İbn Başkuwal onun hakkında El-Sila'da şöyle demiştir: \"O, ezberleyen ve ustadır, Endülüs'ün son alimi ve önde gelen alimleri ve ezbercilerinden sonuncusudur.\" 485 Hicri yılında babasıyla birlikte Doğu'ya seyahat etti, el-Türtüşi'nin yanında fıkıh eğitimi aldı, Bağdat'a girdi, Ebu Bekir el-Şaşi ve Ebu Hamid el-Gazali'ye eşlik etti, hac yolculuğu yaptı, Mısır'a girdi, alimleri hakkında yazdı, ardından 1993'te Endülüs'e döndü; şehrinde yargı yaptı ve halkına fayda sağladı, sonra yargıdan uzaklaşıp bilgi yaymaya kendini adadı. 'Aridat al-Ahwazi fi Şerhül-Tirmidi' gibi eserler yazdı {alıntı::Wafayat-ayan}."
  id: "Abu Bakr Muhammad ibn Abdullah ibn Muhammad al-Ma'afiri al-Andalusi al-Ishbili adalah seorang hafiz terkenal; gurunya Ibn Bashkuwal berkata tentangnya dalam Al-Sila: \"Dia adalah penghafal dan guru, ulama terakhir al-Andalus, dan terakhir dari para ulama dan penghafal terkemuka di sana.\" Dia melakukan perjalanan ke Timur bersama ayahnya pada tahun 485 H, belajar hukum di bawah bimbingan al-Turtushi, masuk ke Baghdad, menemani Abu Bakr al-Shashi dan Abu Hamid al-Ghazali, melakukan ziarah, memasuki Mesir, menulis tentang para cendekiawan, lalu kembali ke al-Andalus pada tahun 1993; dia mengadili di kotanya dan memberi manfaat bagi rakyatnya, kemudian berpaling dari peradilan dan mendedikasikan dirinya untuk menyebarkan pengetahuan. Dia menulis karya termasuk buku 'Aridat al-Ahwazi fi Sharh al-Tirmidhi' {cite:wafayat-ayan}."
