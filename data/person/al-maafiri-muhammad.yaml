summary:
  ar: "أبو بكر محمد بن عبد الله بن محمد المعافري الأندلسي الإشبيلي الحافظ المشهور؛ قال فيه شيخه ابن بشكوال في الصلة «هو الحافظ المستبحر ختام علماء الأندلس وآخر أعلامها وحفاظها»؛ رحل إلى المشرق مع أبيه سنة خمس وثمانين وأربعمائة فتفقه على الطرطوشي ودخل بغداد وصحب أبا بكر الشاشي وأبا حامد الغزالي، وحج ودخل مصر فكتب عن علمائها ثم عاد إلى الأندلس سنة ثلاث وتسعين؛ استُقضي ببلده فنفع أهلها ثم صُرف عن القضاء فأقبل على نشر العلم؛ له مصنفات منها كتاب «عارضة الأحوذي في شرح الترمذي» {cite:wafayat-ayan}."
  en: "Abu Bakr Muhammad ibn Abd Allah ibn Muhammad al-Ma'afiri al-Andalusi al-Ishbili, the well-known hafiz. His teacher Ibn Bashkuwal said of him in the Silah: 'He was the wide-ranging hafiz, the last of the scholars of al-Andalus and the last of its masters and hafizs.' He travelled to the East with his father in 485, studied fiqh under al-Turtushi, entered Baghdad and kept company with Abu Bakr al-Shashi and Abu Hamid al-Ghazali. He performed the pilgrimage and entered Egypt, where he wrote down from its scholars. He returned to al-Andalus in 493. He was appointed judge in his town and benefited its people, then was removed from judgeship and turned fully to spreading knowledge. His works include 'Aridat al-Ahwadhi fi sharh al-Tirmidhi' {cite:wafayat-ayan}."
