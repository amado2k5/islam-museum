summary:
  ar: "محاضر إسلامي وُلد ونشأ في كندا من أصول مصرية، ويقيم في بيرث بغرب أستراليا. حفظ القرآن في السادسة عشرة ونال إجازة في تعليمه، وبدأ إلقاء المحاضرات في السابعة عشرة، وهو ناشط في العمل المجتمعي منذ سنة 1993. مدرّس ومدير في معهد المغرب، متخصص في التزكية والقرآن، وحاصل على جائزة غرب أستراليا لخدمة المجتمع متعدد الثقافات."
  en: "Canadian-born Islamic lecturer of Egyptian ancestry, based in Perth, Western Australia. He memorised the Qur'an at sixteen and received an ijazah to teach it, began lecturing at seventeen, and has been active in community work since 1993. He is an instructor and director with AlMaghrib Institute, specialising in spirituality and the Qur'an, and received the West Australian Multicultural Community Service Award for Individual Excellence."
  ur: "کینیڈا میں پیدا ہونے والے مصری النسل اسلامی مبلغ، جو پرتھ، مغربی آسٹریلیا میں مقیم ہیں۔ انہوں نے سولہ برس کی عمر میں قرآن حفظ کر کے اس کی تدریس کی اجازہ حاصل کی، سترہ برس کی عمر میں خطاب شروع کیا، اور 1993 سے سماجی خدمت میں سرگرم ہیں۔ وہ المغرب انسٹیٹیوٹ کے مدرس اور ڈائریکٹر ہیں، روحانیت اور قرآن کے ماہر ہیں، اور انہیں ویسٹ آسٹریلین ملٹی کلچرل کمیونٹی سروس ایوارڈ ملا ہے۔"
