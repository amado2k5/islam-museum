    note: "One prose text read in this build names a school for him: an Indonesian thesis biography chapter (UIN Sunan Ampel) states 'Habib Syekh bermadzhabkan Syafi'i, beraqidahkan Asy'ari, dan mengikuti sufi dari Al Imam Ghazali' — Shafi'i in school, Ash'ari in creed, following al-Ghazali's Sufi way. The peer-reviewed study by Woodward and colleagues (2012) describes him as rooted in the Ba'Alawi Sufism of the Hadhrami diaspora and in the Tariqa 'Alawiyya — a description of his tradition, not a second attestation naming a school. His seat as A'wan of Nahdlatul Ulama's central board (2022–2027) is an office, and office never counts as personal attestation in this lane. With only one prose attestation, his school stays unknown under the two-source rule, and the attestation is preserved here."
