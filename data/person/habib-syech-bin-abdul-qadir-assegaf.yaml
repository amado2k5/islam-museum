summary:
  ar: "سيد إندونيسي وقائد صلوات من سوراكارتا ⁦(سولو)⁩، وُلد في 20 سبتمبر 1961. تربّى على يد أبيه، إمام مسجد جامع السقاف، ودرس على الحبيب أنيس بن علوي الحبشي، ويقود مجلس أحباب المصطفى الذي تأسّس نحو سنة 1998 وجلسات الصلوات الجماهيرية في أنحاء جاوة. بلغت قناته على يوتيوب 1,430,000 مشترك بحسب vidIQ كما في 11 نوفمبر 2026، وتصفه الكتابة الأكاديمية بأنه متجذر في التصوف الباعلوي في الشتات الحضرمي."
  en: "Indonesian sayyid and sholawat leader from Surakarta (Solo), born on 20 September 1961. Raised by his father, the imam of the Jami' Assegaf mosque, and taught by Habib Anis bin Alwi al-Habsyi, he leads the Majlis Ahbaabul Musthofa, founded about 1998, and mass sholawat gatherings across Java. His YouTube channel counted 1,430,000 subscribers by vidIQ as of 11 November 2026, and academic writing describes him as rooted in the Ba'Alawi Sufism of the Hadhrami diaspora."
  ur: "انڈونیشیائی سید اور صلوٰۃ خوان جو سوراکارتا ⁦(سولو)⁩ سے ہے، 20 ستمبر 1961ء کو پیدا ہوا۔ اس کی پرورش اس کے والد نے کی جو جامع السقاف مسجد کے امام تھے، اور اس نے حبیب انیس بن علوی الحبشی سے تعلیم پائی؛ وہ مجلس احباب المصطفیٰ کی قیادت کرتا ہے جو تقریباً 1998ء میں قائم ہوئی، اور جاوا بھر میں بڑے صلوٰۃ اجتماعات منعقد کرتا ہے۔ اس کے یوٹیوب چینل کے سبسکرائبر vidIQ کے مطابق 11 نومبر 2026ء کو 1,430,000 تھے، اور علمی تحریریں اسے حضرمی شتات کے باعلوی تصوف میں جڑا ہوا بیان کرتی ہیں۔"
