summary:
  ar: "الفقيه المحدث الزاهد؛ قرأ القرآن على خاله قاضي بعلبك، وحفظ كتاب «علوم الحديث» وعرضه من حفظه على مؤلفه الحافظ ابن الصلاح، وصحب الشيخ اليونيني وإبراهيم البطائحي والنووي، وكان اليونيني يحبه ويقدمه على أولاده؛ وكان دائم البشر يلازم قيام الليل من الثلث الأخير ويصوم الأيام البيض وستاً من شوال وعشر ذي الحجة والمحرم لا يخل بذلك؛ وقال لولده في صحته: أنا أعيش عمر الإمام أحمد، لكن شتان ما بيني وبينه، فكان كما قال {cite:shadharat-dhahab p. 707-708}."
  en: "The Baalbek Hanbali — recited Ibn al-Salah's Ulum al-Hadith back to its author from memory; al-Yunini loved him above his own sons; foretold 'I shall live Imam Ahmad's age' — and died at seventy-seven {cite:shadharat-dhahab p. 707-708}."
