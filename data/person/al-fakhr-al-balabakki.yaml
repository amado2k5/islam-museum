summary:
  ar: "الفقيه المحدث الزاهد؛ قرأ القرآن على خاله قاضي بعلبك، وحفظ كتاب «علوم الحديث» وعرضه من حفظه على مؤلفه الحافظ ابن الصلاح، وصحب الشيخ اليونيني وإبراهيم البطائحي والنووي، وكان اليونيني يحبه ويقدمه على أولاده؛ وكان دائم البشر يلازم قيام الليل من الثلث الأخير ويصوم الأيام البيض وستاً من شوال وعشر ذي الحجة والمحرم لا يخل بذلك؛ وقال لولده في صحته: أنا أعيش عمر الإمام أحمد، لكن شتان ما بيني وبينه، فكان كما قال {cite:shadharat-dhahab p. 707-708}."
  en: "The Baalbek Hanbali — recited Ibn al-Salah's Ulum al-Hadith back to its author from memory; al-Yunini loved him above his own sons; foretold 'I shall live Imam Ahmad's age' — and died at seventy-seven {cite:shadharat-dhahab p. 707-708}."
  fr: "Hanbalite de Baalbek — il récita de mémoire les Ulum al-Hadith d’Ibn al-Salah devant leur auteur ; al-Yunini l’aimait plus que ses propres fils ; il prédit : « Je vivrai autant que l’imam Ahmad », et mourut à soixante-dix-sept ans {cite:shadharat-dhahab p. 707-708}."
  es: "El hanbalí de Baalbek recitó de memoria el Ulum al-Hadith de Ibn al-Salah a su autor; al-Yunini lo amó más que a sus propios hijos; predijo \"Viviré la edad del Imam Ahmad\" y murió a los setenta y siete años {cite:shadharat-dhahab p. 707-708}."
  ur: "بعلبک حنبلی نے ابن الصلاح کی علم الحدیث کو اپنے مصنف کو یادداشت سے سنایا۔ ال یونی نے اسے اپنے بیٹوں سے زیادہ پیار کیا۔ پیشگوئی کی کہ 'میں امام احمد کی عمر میں زندہ رہوں گا' - اور ستر سال میں وفات پائی 707-708}۔"
  tr: "Hadis ilimlerinde uzmanlaşmış, çileci bir âlimdi; Baalbek kadısı olan amcasına Kur'an okur, \"Hadis İlimleri\" kitabını ezberler ve yazarı, ezberci İbn el-Salah'a ezberden sunardı; Şeyh el-Yunini, İbrahim el-Bata'ihi ve el-Nawawi'ye eşlik ederdi ve el-Yunini onu sever, kendi çocuklarından bile üstün tutardı; her zaman neşeliydi, gecenin son üçte birinde namaz kılardı ve Şevval ayının altı günü, Zilhicce ayının on günü ve Muharrem aylarını hiç aksatmadan oruç tutardı; ve sağlıklı iken oğluna şöyle demişti: \"İmam Ahmed'in hayatını yaşıyorum, ama benimle onun arasında büyük bir fark var.\" Ve dediği gibi oldu. {Kaynak: Şadharat-Dhaba, s. 707-708}"
  id: "Ulama hadits yang khusyuk; ia membacakan Al-Qur'an kepada pamannya, hakim Baalbek, dan menghafal kitab \"Ilmu-ilmu Hadits\" dan menyampaikannya dari hafalan kepada penulisnya, penghafal Ibnu al-Salah, dan ia menemani Syekh al-Yunini, Ibrahim al-Bata'ihi dan al-Nawawi, dan al-Yunini menyayanginya dan lebih mengutamakannya daripada anak-anaknya sendiri; ia selalu ceria, ia akan berdiri shalat pada sepertiga malam terakhir, dan ia akan berpuasa pada Hari Putih, enam hari di bulan Syawal, sepuluh hari di bulan Dzul Hijjah dan Muharram tanpa mengabaikannya; dan ia berkata kepada putranya ketika sehat: Aku menjalani kehidupan Imam Ahmad, tetapi ada perbedaan besar antara aku dan dia, dan seperti yang dia katakan {kutip:shadharat-dhahab hlm. 707-708}."
