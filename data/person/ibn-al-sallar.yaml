names:
  - { value: "الملك العادل علي بن السلار الكردي ثم المصري وزير الظافر", kind: full }
summary:
  ar: "الملك العادل علي بن السلار الكردي ثم المصري وزير الظافر بالله الفاطمي؛ أقبل من ولاية الإسكندرية إلى القاهرة ليأخذ الوزارة بالقهر فدخل وحكم ففر الوزير نجم الدين سليم بن مصال وجمع العساكر فجهز ابن السلار جيشاً لحربه فالتقوا بدلاص فقتل ابن مصال وطيف برأسه سنة أربع وأربعين؛ وكان ابن السلار سنياً شافعياً شجاعاً مقداماً بنى للسلفية مدرسة معروفة لكنه كان جباراً عنيداً ظالماً شديد البأس صعب المراس، وكان زوج أم عباس بن باديس فقتله نصر بن عباس هذا على فراشه بالقاهرة في المحرم سنة تسع وأربعين وخمسمائة وولى عباس الملك {cite:shadharat-dhahab p. 629}."
  en: "Al-Malik al-Adil Ali ibn al-Sallar, the Kurd turned Egyptian, wazir of the Fatimid al-Zafir; he swept in from the Alexandria governorate to seize the vizierate by force, drove out wazir Najm al-Din Salim ibn Masal, and when Ibn Masal gathered an army Ibn al-Sallar met him at Dalas, killed him and paraded his head (544); a Sunni Shafi'i, brave and bold, who built the well-known Salafi madrasa — yet an overbearing tyrant of harsh rule; being wed to the mother of Abbas ibn Badis, this Nasr ibn Abbas killed him on his bed at Cairo in Muharram 549 and Abbas took the kingship {cite:shadharat-dhahab p. 629}."
  es: "Al-Malik al-Adil Ali ibn al-Sallar, el kurdo convertido en egipcio, visir del fatimí al-Zafir; irrumpió desde la gobernación de Alejandría para apoderarse del visir por la fuerza, expulsó al visir Najm al-Din Salim ibn Masal, y cuando Ibn Masal reunió un ejército, Ibn al-Sallar lo encontró en Dalas, lo mató y exhibió su cabeza (544); un shafi'i sunita, valiente y audaz, que construyó la conocida madrasa salafista, pero un tirano autoritario de gobierno severo; casado con la madre de Abbas ibn Badis, este Nasr ibn Abbas lo mató en su cama en El Cairo en Muharram 549 y Abbas tomó el trono {cite:shadharat-dhahab p. 629}."
  fr: "Al-Malik al-Adil Ali ibn al-Sallar, le Kurde devenu Égyptien, vizir du Fatimide al-Zafir; il a déferlé du gouvernorat d'Alexandrie pour s'emparer du vizirat par la force, a chassé le vizir Najm al-Din Salim ibn Masal, et lorsque Ibn Masal a rassemblé une armée, Ibn al-Sallar l'a rencontré à Dalas, l'a tué et a exhibé sa tête (544); un sunnite chaféite, brave et audacieux, qui a construit la célèbre madrasa salafiste — mais un tyran autoritaire au règne dur; étant marié à la mère d'Abbas ibn Badis, ce Nasr ibn Abbas l'a tué dans son lit au Caire en Muharram 549 et Abbas a pris le trône {cite:shadharat-dhahab p. 629}."
  ur: "الملک العدل علی ابن السلر، کرد مصری، فاطمی الظافر کا وزیر؛ وہ اسکندریہ کی گورنری سے زبردستی قبضہ کرنے کے لیے داخل ہوا، وزیر نجم الدین سالم ابن مسال کو نکال باہر کیا، اور جب ابن مسال نے ایک لشکر جمع کیا تو ابن السلر نے دلاس میں اس سے ملاقات کی، اسے قتل کر دیا اور اس کا سر چڑھایا (544)؛ ایک سنی شافعی، بہادر اور بے باک، جس نے معروف سلفی مدرسہ تعمیر کیا - پھر بھی سخت حکمرانی کا ایک دبنگ ظالم؛ عباس ابن بدیس کی والدہ سے شادی کی وجہ سے، اس نصر ابن عباس نے محرم 549 میں قاہرہ میں ان کے بستر پر اسے قتل کر دیا اور عباس نے بادشاہی سنبھال لی۔ 629}۔"
