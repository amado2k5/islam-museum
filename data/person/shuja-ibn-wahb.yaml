summary:
  en: "An early Muhajir Companion from Banu Asad ibn Khuzayma who migrated to Abyssinia and fought at Badr and Uhud; chosen as the Prophet's envoy to al-Harith ibn Abi Shimr al-Ghassani, ruler of Damascus; later martyred at the battle of al-Yamama."
  ar: "صحابي بدري ومهاجري من السابقين الأولين من بني أسد بن خزيمة؛ هاجر إلى الحبشة وشهد بدراً وأحداً والمشاهد كلها، واختاره النبي سفيراً بكتابه إلى الحارث بن أبي شمر الغساني صاحب دمشق؛ واستشهد يوم اليمامة في خلافة أبي بكر. وعند البلاذري بعثه النبي إلى الحارث بن أبي شمر الغساني في سنة سبع {cite:ansab-al-ashraf p. 531}"
  ur: "بنو اسد بن خزیمہ کا ابتدائی مہاجر صحابی جو حبشہ ہجرت کیا اور بدر و احد میں لڑا؛ نبی نے اسے قاصد چنا۔"
  es: "Fue uno de los primeros compañeros muhajires de Banu Asad ibn Khuzayma, quien emigró a Abisinia y luchó en Badr y Uhud; fue elegido enviado del Profeta ante al-Harith ibn Abi Shimr al-Ghassani, gobernante de Damasco; y posteriormente fue martirizado en la batalla de al-Yamama."
  fr: "Un des premiers compagnons Muhajir de Banu Asad ibn Khuzayma qui a émigré en Abyssinie et a combattu à Badr et Uhud; choisi comme envoyé du Prophète auprès d'al-Harith ibn Abi Shimr al-Ghassani, dirigeant de Damas; plus tard martyrisé à la bataille d'al-Yamama."
  tr: "Bedri'nin bir sahabesi ve Banu Asad bin Huzeymah'tan en eski Muhaciri olan Baba, Habeşistan'a göç etti ve Bedr, Uhud ve tüm türbelere tanıklık etti. Peygamber, Şam hükümdarı Al-Haris ibn Abi Şemmar El-Gasani'ye yazdığı mektup aracılığıyla onu elçi olarak seçti; Ebu Bekir halifeliği sırasında El-Yamamah gününde şehit edildi. El-Baladri'ye göre, Peygamber onu 7. yılda El-Haris bin Ebi Şemmar el-Gasani'ye gönderdi {alıntı:Ensab-al-Ashraf, s. 531}"
  id: "Seorang sahabat Badri dan Muhajiri di antara yang paling awal dari Banu Asad ibn Khuzaymah; ia bermigrasi ke Abyssinia dan menyaksikan Badr, Uhud, dan semua makam. Nabi memilihnya sebagai duta melalui suratnya kepada Al-Harith ibn Abi Shammar Al-Ghasani, penguasa Damaskus; ia gugur pada hari Al-Yamamah selama kekhalifahan Abu Bakr. Menurut Al-Baladhuri, Nabi mengirimnya kepada Al-Harith ibn Abi Shammar Al-Ghassani pada tahun 7 {cite:Ansab-al-Ashraf, hlm. 531}"
