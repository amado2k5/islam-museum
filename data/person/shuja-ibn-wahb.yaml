summary:
  en: "An early Muhajir Companion from Banu Asad ibn Khuzayma who migrated to Abyssinia and fought at Badr and Uhud; chosen as the Prophet's envoy to al-Harith ibn Abi Shimr al-Ghassani, ruler of Damascus; later martyred at the battle of al-Yamama."
  ar: "صحابي بدري ومهاجري من السابقين الأولين من بني أسد بن خزيمة؛ هاجر إلى الحبشة وشهد بدراً وأحداً والمشاهد كلها، واختاره النبي سفيراً بكتابه إلى الحارث بن أبي شمر الغساني صاحب دمشق؛ واستشهد يوم اليمامة في خلافة أبي بكر. وعند البلاذري بعثه النبي إلى الحارث بن أبي شمر الغساني في سنة سبع {cite:ansab-al-ashraf p. 531}"
