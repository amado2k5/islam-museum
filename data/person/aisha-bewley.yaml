    note: "Islam is attested for Bewley herself as documented practice, with no school named by two sources. She converted to Islam in 1968, and her life's work is the translation of classical Islamic texts — among them the foundational Maliki corpus (the Muwatta, Ibn Taymiyya's Madinan Way) and the letters of Mawlay al-Darqawi — but translating a school's or an order's texts is work, not attestation of her own adherence. Wikidata's structured value gives Islam only. One scholarly overview of women Qur'an translators (Bokhari & Shah, Abhath, 2021) describes the Bewleys jointly as Maliki in jurisprudence and as Sufis of the Habibiyya branch of the Shadhili-Darqawi order; that is a single scholarly family, preserved here, and on its own it does not carry a value. The settlement is the documented-practice-without-a-school configuration, unknown."
