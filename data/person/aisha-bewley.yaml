summary:
  ar: "مترجمة أمريكية المولد (1948) للنصوص الإسلامية الكلاسيكية، حاصلة على الليسانس في الفرنسية والماجستير في لغات الشرق الأدنى من جامعة كاليفورنيا بيركلي، ودرست في الجامعة الأمريكية بالقاهرة. اعتنقت الإسلام سنة 1968، وترجمت الموطأ (1989) و«الطريقة الدرقاوية» وتفسير القرطبي، ومع زوجها عبد الحق بيولي ترجمة معاني القرآن (1999)، وألّفت «قاموسًا سيريًا للنساء المسلمات» (2004)."
  en: "American-born translator (1948) of classical Islamic texts, with a BA in French and an MA in Near Eastern Languages from the University of California, Berkeley, and fellowship study at the American University in Cairo. She converted to Islam in 1968. Her translations include The Darqawi Way (1981), Al-Muwatta of Imam Malik (1989), the Tafsir al-Qurtubi (from 2003) and, with her husband Abdalhaqq Bewley, The Noble Qur'an (1999); her own books include Muslim Women: A Biographical Dictionary (2004)."
  ur: "امریکہ میں پیدا ہونے والی (1948ء) کلاسیکی اسلامی متون کی مترجمہ؛ یونیورسٹی آف کیلیفورنیا، برکلے سے فرانسیسی میں بی اے اور مشرقِ قریب کی زبانوں میں ایم اے، اور امریکن یونیورسٹی قاہرہ میں فیلوشپ پر مطالعہ کیا۔ 1968ء میں اسلام قبول کیا۔ ان کے ترجموں میں «الطریقہ الدرقاویہ» (1981ء)، موطا امام مالک (1989ء)، تفسیر قرطبی (2003ء سے) اور اپنے شوہر عبد الحق بیولی کے ساتھ «قرآن کی نئی ترجمانی» (1999ء) شامل ہیں؛ ان کی اپنی کتابوں میں «مسلم خواتین: سوانحی لغت» (2004ء) شامل ہے۔"
