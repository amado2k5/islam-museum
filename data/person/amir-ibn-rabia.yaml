summary:
  ar: "صحابي عنزي، حليف بني عدي بن الخطاب؛ من السابقين الأولين، هاجر إلى الحبشة مع امرأته ليلى بنت أبي خيثمة ثم إلى المدينة، وشهد بدراً وما بعدها، واستخلفه عثمان على المدينة لما حج."
  en: "An Anzi Companion, an ally of Banu Adi ibn al-Khattab; among the earliest Muslims. He emigrated to Abyssinia with his wife Layla bint Abi Khath'ama, then to Medina, witnessed Badr and the battles after, and Uthman left him in charge of Medina when he went on hajj."
  ur: "عنزی صحابی، بنو عدي بن خطاب کے حلیف؛ ابتدائی مسلمانوں میں سے، بیوی لیلی بنت ابی خثعمہ کے ساتھ حبشہ ہجرت کیے۔"
