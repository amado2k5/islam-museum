summary:
  ar: "امرأة من ضبة من بني معاوية بن كعب بن ثعلبة بن سعد بن ضبة من المهاجرات؛ عند البلاذري كانت لها سن بالجبل فسمي سن سميرة."
  en: "a Dubba woman of the Muhajirat; in al-Baladhuri she held a turret in the Jibal whence Sinn Sumayra is named."
  es: "una mujer Dubba del Muhajirat; en al-Baladhuri sostuvo una torreta en el Jibal de donde lleva el nombre Sinn Sumayra."
  fr: "une femme Dubba du Muhajirat; à al-Baladhuri, elle tenait une tourelle dans le Jibal d'où le nom de Sinn Sumayra."
  ur: "مہاجرت کی ایک دوبہ عورت؛ البلادوری میں اس نے جبل میں ایک برج رکھا تھا جہاں سے سن سمیرہ کا نام دیا گیا ہے۔"
  tr: "Banu Muaviye ibn Ka'b ibn Tha'laba ibn Sa'd ibn Dhabba'dan Dhuba'dan bir kadın, göçmenlerden biri; al-Baladhuri'ye göre, dağda bir dişi vardı, bu yüzden Samira çağı olarak adlandırıldı."
  id: "Seorang wanita dari Dhuba dari Banu Muawiyah ibn Ka'b ibn Tha'laba ibn Sa'd ibn Dhabba, salah satu imigran; menurut al-Baladhuri, dia memiliki gigi di gunung, sehingga disebut zaman Samira."
