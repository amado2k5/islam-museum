id: person/abu-ubayd-al-qasim-ibn-sallam
education:
  did_you_know:
    ar: "أبو عبيد القاسم بن سلام وُلد بهراة لأب رومي، وطلب العلم على إسماعيل بن جعفر وشريك وسفيان بن عيينة وغيرهم حتى صار من أئمة اللغة والحديث."
    en: "Abu Ubayd al-Qasim ibn Sallam was born in Herat to a Byzantine father; he sought knowledge under Isma'il ibn Ja'far, Sharik, Sufyan ibn Uyayna and others until he stood among the imams of language and hadith."
    ur: "ابوعبید قاسم بن سلام ہرات میں ایک رومی باپ کے ہاں پیدا ہوا؛ اس نے اسماعیل بن جعفر، شریک، سفیان بن عیینہ اور دوسروں سے علم حاصل کیا یہاں تک کہ لغت و حدیث کے ائمہ میں شمار ہوا۔"
    sources: [source/tabaqat-ibn-sad, source/encyclopaedia-of-islam-2]
class: person
label: { ar: "أبو عبيد القاسم بن سلام", en: "Abu Ubayd al-Qasim ibn Sallam" }
summary:
  ar: "أبو عبيد القاسم بن سلام؛ ولد بهراة وكان أبوه سلام عبداً رومياً لرجل من أهلها يتولى الأزد. طلب العلم وسمع إسماعيل بن جعفر وشريكاً وإسماعيل بن عياش وهشيم بن بشير وسفيان بن عيينة وإسماعيل بن علية ويزيد بن هارون ويحيى بن سعيد القطان وحجاج بن محمد وأبا معاوية الضرير وصفوان بن عيسى وعبد الرحمن بن مهدي وحماد بن مسعدة ومروان بن معاوية وأبا بكر بن عياش وعمرو بن يونس وإسحاق الأزرق وغيرهم، وروى عنه محمد بن إسحاق الصاغاني والحسن بن مكرم وأبو بكر بن أبي الدنيا والحارث بن أبي أسامة ومحمد بن يحيى المروزي وعلي بن عبد العزيز البغوي وآخرون. أقام ببغداد مدة فكان مؤدباً لآل هرون ثم صار في ناحية عبد الله بن طاهر، وولي قضاء طرطوس، وخرج إلى مكة سنة أربع وعشرين ومائتين فسكنها حتى مات بها؛ قال ابن درستويه: من جمع صنوفاً من العلم وصنف الكتب في كل فن فأكثر وأشهر: أبو عبيد القاسم بن سلام، وروي الناس من كتبه المصنفة بضعة وعشرون كتاباً في القرآن والفقه وغريب الحديث والأمثال ومعاني الشعر وغير ذلك {cite:tarikh-baghdad-khatib j.10 p.403-404}."
  en: "Abu Ubayd al-Qasim ibn Sallam — b. Herat, son of a Roman mawla of the Azd; tutor to Harun al-Rashid's sons, then in Abd Allah ibn Tahir's circle, qadi of Tarsus, and finally settled in Mecca in 224 where he died; Ibn Durustawayh counted him the most prolific author of Baghdad in every field — some twenty books transmitted on Qur'an, fiqh, gharib al-hadith, proverbs and poetry {cite:tarikh-baghdad-khatib j.10 p.403-404}."
