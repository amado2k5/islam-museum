summary:
  ar: "أبو عبيد القاسم بن سلام؛ ولد بهراة وكان أبوه سلام عبداً رومياً لرجل من أهلها يتولى الأزد. طلب العلم وسمع إسماعيل بن جعفر وشريكاً وإسماعيل بن عياش وهشيم بن بشير وسفيان بن عيينة وإسماعيل بن علية ويزيد بن هارون ويحيى بن سعيد القطان وحجاج بن محمد وأبا معاوية الضرير وصفوان بن عيسى وعبد الرحمن بن مهدي وحماد بن مسعدة ومروان بن معاوية وأبا بكر بن عياش وعمرو بن يونس وإسحاق الأزرق وغيرهم، وروى عنه محمد بن إسحاق الصاغاني والحسن بن مكرم وأبو بكر بن أبي الدنيا والحارث بن أبي أسامة ومحمد بن يحيى المروزي وعلي بن عبد العزيز البغوي وآخرون. أقام ببغداد مدة فكان مؤدباً لآل هرون ثم صار في ناحية عبد الله بن طاهر، وولي قضاء طرطوس، وخرج إلى مكة سنة أربع وعشرين ومائتين فسكنها حتى مات بها؛ قال ابن درستويه: من جمع صنوفاً من العلم وصنف الكتب في كل فن فأكثر وأشهر: أبو عبيد القاسم بن سلام، وروي الناس من كتبه المصنفة بضعة وعشرون كتاباً في القرآن والفقه وغريب الحديث والأمثال ومعاني الشعر وغير ذلك {cite:tarikh-baghdad-khatib j.10 p.403-404}."
  en: "Abu Ubayd al-Qasim ibn Sallam — b. Herat, son of a Roman mawla of the Azd; tutor to Harun al-Rashid's sons, then in Abd Allah ibn Tahir's circle, qadi of Tarsus, and finally settled in Mecca in 224 where he died; Ibn Durustawayh counted him the most prolific author of Baghdad in every field — some twenty books transmitted on Qur'an, fiqh, gharib al-hadith, proverbs and poetry {cite:tarikh-baghdad-khatib j.10 p.403-404}."
  fr: "Abu Ubayd al-Qasim ibn Sallam, né à Hérat, fils d'un mawla romain des Azd ; précepteur des fils de Harun al-Rashid, puis dans l'entourage d'Abd Allah ibn Tahir, cadi de Tarse et enfin installé à La Mecque en 224, où il mourut. Ibn Durustawayh le comptait comme l'auteur bagdadien le plus fécond dans tous les domaines : une vingtaine de livres transmis sur le Coran, le fiqh, le gharib al-hadith, les proverbes et la poésie {cite:tarikh-baghdad-khatib j.10 p.403-404}."
  es: "Abu Ubayd al-Qasim ibn Sallam — nacido en Herat, hijo de un mawla romano de Azd; tutor de los hijos de Harun al-Rashid, luego en el círculo de Abd Allah ibn Tahir, cadí de Tarso, y finalmente establecido en La Meca en 224, donde murió; Ibn Durustawayh lo consideró el autor más prolífico de Bagdad en todos los campos: unos veinte libros transmitidos sobre el Corán, fiqh, gharib al-hadith, proverbios y poesía {cite:tarikh-baghdad-khatib j.10 p.403-404}."
  ur: "ابو عبید القاسم بن سلام - بی۔ ہرات، ازد کے ایک رومی مولا کا بیٹا؛ ہارون الرشید کے بیٹوں کے استاد، پھر عبد اللہ ابن طاہر کے حلقے میں، ترسوس کے قاضی، اور آخر کار 224 میں مکہ میں سکونت اختیار کی جہاں ان کی وفات ہوئی۔ ابن درستاویہ نے انہیں ہر میدان میں بغداد کا سب سے مشہور مصنف شمار کیا - قرآن، فقہ، غریب الحدیث، امثال اور اشعار پر منتقل کی گئی تقریباً بیس کتابیں"
  tr: "Ebu Ubeyd el-Kasım ibn Sallam Herat'ta doğdu. Babası Sallam, Ezd kabilesinin başında bulunan Heratlı bir adamın Romalı kölesiydi. İsmail bin Cafer, Şerik, İsmail bin Ayyaş, Hüseyin bin Beşir, Süfyan bin Uyeynah, İsmail bin Uleyyah, Yezid bin Harun, Yahya bin Sa'id el-Kattan, Haccac bin Muhammed, Ebu Muaviye el-Darir, Safvan ibn İsa, Abd el-Rahman ibn Mehdi, Hammad ibn Mes'adah, Mervan ibn'den ilim araştırdı ve hadis dinledi. Muaviye, Ebu Bekir ibn Ayyaş, Amr ibn Yunus, İshak el-Azrak ve diğerleri. Ondan rivayet edenler arasında Muhammed ibn İshak el-Saghani, el-Hasan ibn Makram, Ebu Bekr ibn Abi el-Dunya, el-Harith ibn Abi Usame, Muhammed ibn Yahya el-Marwazi, Ali ibn Abd el-Aziz el-Baghawi ve diğerleri bulunmaktadır. Bir süre Bağdat'ta ikamet etmiş ve Harun ailesine öğretmenlik yapmıştır. Daha sonra Abd Allah ibn Tahir bölgesine taşınmış ve Tartus'a kadı olarak atanmıştır. Hicri 224 yılında Mekke'ye gitmiş ve vefatına kadar orada yaşamıştır. İbn Durustawayh şöyle demiştir: Çeşitli ilimleri toplayıp her alanda kitaplar derleyen ve bunların en ünlüsü Ebu Ubeyd el-Kasım ibn Sallam'dır. İnsanlar onun derlediği kitaplardan Kur'an, fıkıh, nadir hadisler, atasözleri, şiir anlamları ve diğer konularda yirmi küsur kitap rivayet etmişlerdir. {cite:tarikh-baghdad-khatib j.10 s.403-404}."
  id: "Abu Ubayd al-Qasim ibn Sallam lahir di Herat. Ayahnya, Sallam, adalah seorang budak Romawi milik seorang pria dari Herat yang memimpin suku Azd. Ia mencari ilmu dan mendengar hadits dari Ismail bin Ja`far, Sharik, Ismail bin Ayyash, Hushaym bin Bashir, Sufyan bin Uyaynah, Ismail bin Ulayyah, Yazid bin Harun, Yahya bin Sa`id al-Qattan, Hajjaj bin Muhammad, Abu Mu`awiyah al-Darir, Safwan bin Isa, Abd al-Rahman bin Mahdi, Hammad bin Mas`adah, Marwan bin Mu`awiyah, Abu Bakar bin Ayyash, Amr bin Yunus, Ishaq al-Azraq, dan lain-lain. Mereka yang meriwayatkan darinya antara lain Muhammad ibn Ishaq al-Saghani, al-Hasan ibn Makram, Abu Bakr ibn Abi al-Dunya, al-Harith ibn Abi Usamah, Muhammad ibn Yahya al-Marwazi, Ali ibn Abd al-Aziz al-Baghawi, dan lain-lain. Ia tinggal di Baghdad untuk sementara waktu, menjadi guru bagi keluarga Harun. Kemudian ia pindah ke distrik Abd Allah ibn Tahir dan diangkat menjadi hakim Tartus. Ia berangkat ke Mekah pada tahun 224 H dan menetap di sana hingga wafatnya. Ibn Durustawayh berkata: Orang yang mengumpulkan berbagai macam ilmu dan menyusun buku-buku dalam setiap bidang ilmu, dan yang paling terkenal di antaranya, adalah Abu Ubaid al-Qasim ibn Sallam. Orang-orang meriwayatkan dari buku-buku yang disusunnya lebih dari dua puluh buku tentang Al-Qur'an, fiqih, hadits langka, peribahasa, makna puisi, dan hal-hal lainnya. {mengutip:tarikh-baghdad-khatib j.10 hal.403-404}."
