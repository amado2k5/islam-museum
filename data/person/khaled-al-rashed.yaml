summary:
  ar: "داعية سعودي وإمام وخطيب في الخبر، وُلد سنة 1970م (1390هـ)، عُرف بخطبته «يا أمة محمد» احتجاجا على الرسوم الدنماركية، ثم اعتُقل في منتصف العقد الأول من القرن الحادي والعشرين وتصاعد حكمه بالسجن عبر إعادة المحاكمة والاستئناف حتى بلغ أربعين سنة، وما يزال مسجونا بحسب قاعدة بيانات اللجنة الأمريكية للحرية الدينية الدولية."
  en: "Saudi preacher and imam-khateeb in al-Khobar, born in 1970 (1390 AH). He became known for his sermon 'Ya Ummat Muhammad' protesting the Danish cartoons, was arrested in the mid-2000s, and saw his prison sentence escalated through retrial and appeal to forty years; he remains imprisoned according to the USCIRF victims database."
  ur: "سعودی مبلغ اور الخبر میں امام و خطیب، جو 1970 (1390ھ) میں پیدا ہوئے۔ وہ ڈنمارک کے کارٹونوں کے خلاف اپنے خطبہ «یا امۃ محمد» سے مشہور ہوئے، پھر 2000 کی دہائی کے وسط میں گرفتار ہوئے اور دوبارہ مقدمہ و اپیل کے ذریعے ان کی سزا بڑھ کر چالیس برس تک جا پہنچی؛ USCIRF کے متاثرین ڈیٹا بیس کے مطابق وہ اب بھی قید ہیں۔"
