summary:
  ar: "داعية سعودي وإمام وخطيب في الخبر، وُلد سنة 1970م ⁦(1390هـ)⁩، عُرف بخطبته «يا أمة محمد» احتجاجا على الرسوم الدنماركية، ثم اعتُقل في منتصف العقد الأول من القرن الحادي والعشرين وتصاعد حكمه بالسجن عبر إعادة المحاكمة والاستئناف حتى بلغ أربعين سنة، وما يزال مسجونا بحسب قاعدة بيانات اللجنة الأمريكية للحرية الدينية الدولية."
  en: "Saudi preacher and imam-khateeb in al-Khobar, born in 1970 (1390 AH). He became known for his sermon 'Ya Ummat Muhammad' protesting the Danish cartoons, was arrested in the mid-2000s, and saw his prison sentence escalated through retrial and appeal to forty years; he remains imprisoned according to the USCIRF victims database."
  ur: "سعودی مبلغ اور الخبر میں امام و خطیب، جو 1970 ⁦(1390ھ)⁩ میں پیدا ہوئے۔ وہ ڈنمارک کے کارٹونوں کے خلاف اپنے خطبہ «یا امۃ محمد» سے مشہور ہوئے، پھر 2000 کی دہائی کے وسط میں گرفتار ہوئے اور دوبارہ مقدمہ و اپیل کے ذریعے ان کی سزا بڑھ کر چالیس برس تک جا پہنچی؛ USCIRF کے متاثرین ڈیٹا بیس کے مطابق وہ اب بھی قید ہیں۔"
  es: "Predicador saudí e imán-khateeb en al-Khobar, nacido en 1970 (1390 AH). Se hizo conocido por su sermón \"Ya Ummat Muhammad\" en protesta contra las caricaturas danesas, fue arrestado a mediados de la década de 2000 y su condena a prisión se incrementó a cuarenta años tras un nuevo juicio y una apelación; según la base de datos de víctimas de la USCIRF, permanece encarcelado."
  fr: "Prédicateur et imam saoudien à al-Khobar, né en 1970 (1390 AH). Il s'est fait connaître pour son sermon « Ya Ummat Muhammad » protestant contre les caricatures danoises. Arrêté au milieu des années 2000, sa peine de prison a été alourdie à quarante ans suite à un nouveau procès et à un appel; il demeure incarcéré selon la base de données des victimes de l'USCIRF."
  tr: "1970 yılında (1390 Hicri) doğmuş, Hobar'da Suudi vaiz, imam ve vaiz olarak görev yapmıştır. Danimarka karikatürlerine karşı protesto olarak yaptığı \"Ey Muhammed'in Ulusu\" başlıklı vaazıyla tanınmıştır. 2000'lerin ortalarında tutuklandı ve hapis cezası yeniden yargılamalar ve temyizlerle artarak kırk yaşına kadar arttı. Amerikan Uluslararası Dini Özgürlük Komisyonu veri tabanına göre hâlâ hapiste kalmaktadır."
  id: "Seorang pengkhotbah, imam, dan pengkhotbah Saudi di Khobar, lahir pada tahun 1970 M (1390 H). Ia dikenal karena khotbahnya berjudul \"O Nation of Muhammad\" sebagai protes terhadap kartun Denmark. Ia kemudian ditangkap pada pertengahan 2000-an, dan hukuman penjaranya meningkat melalui persidangan ulang dan banding hingga usianya mencapai empat puluh tahun. Ia masih dipenjara menurut basis data Komisi Amerika untuk Kebebasan Beragama Internasional."
