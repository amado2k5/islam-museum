id: person/baha-al-din-sam-bamiyani
class: person
label: { ar: "بهاء الدين سام البامياني", en: "Baha al-Din Sam of Bamiyan", es: "Baha al-Din Sam of Bamiyan", fr: "Baha al-Din Sam of Bamiyan", ur: "بہاء الدین سام بامیان" }
summary:
  ar: "بهاء الدين سام بن محمد بن مسعود ابن أخت غياث الدين وشهاب الدين الغوريين، صاحب باميان؛ ملك مدينة بلخ سنة أربع وتسعين وخمسمائة لما توفي صاحبها التركي أزيه الذي كان يحمل الخراج كل سنة إلى الخطا، فقطع الحمل عنهم وخطب لغياث الدين فصارت من جملة بلاد الإسلام {cite:kamil-ibn-al-athir p. 252}."
  en: "Nephew of both Ghurid sultans and lord of Bamiyan — seized Balkh in 594 on its tribute-lord's death, cut the Qara Khitai's yearly payment and raised the khutba for Ghiyath al-Din {cite:kamil-ibn-al-athir p. 252}."
  es: "Sobrino de ambos sultanes Ghurid y señor de Bamiyán, se apoderó de Balkh en 594 tras la muerte de su señor tributario, redujo el pago anual del Qara Khitai y elevó la jutba para Ghiyath al-Din {cite:kamil-ibn-al-athir p. 252}."
  fr: "Neveu des deux sultans ghurides et seigneur de Bamiyan — s'empara de Balkh en 594 à la mort de son seigneur tributaire, réduisit le paiement annuel du Qara Khitai et leva le khutba pour Ghiyath al-Din {cite:kamil-ibn-al-athir p. 252}."
  ur: "غورید سلاطین اور بامیان کے آقا دونوں کے بھتیجے - نے 594 میں بلخ پر اس کے خراج عقیدت پیش کرنے والے کی موت پر قبضہ کر لیا، قرہ خیطائی کی سالانہ ادائیگی کاٹ دی اور غیاث الدین کے لیے خطبہ اٹھایا۔ 252}۔"
  tr: "Baha'eddin Sam ibn Muhammed ibn Mesud, Ghiyath al-Din ve Bamiyan'ın hükümdarı Şihabeddin el-Guriyyin'in yeğeni; 594 Hicri yılında Balkh şehrinin kralı, her yıl vergi toplayan Türk sahibi Azih'in vefatıyla vefat etti. Yük onlar için durduruldu ve Ghiyath al-Din'e bir vaaz verildi; böylece İslam topraklarının bir parçası oldu {cite:kamil-ibn-al-athir s. 252}."
  id: "Baha' al-Din Sam ibn Muhammad ibn Mas'ud, keponakan Ghiyath al-Din dan Shihab al-Din al-Ghuriyyin, penguasa Bamiyan; raja kota Balkh pada tahun 594 H, ketika pemiliknya yang berbangsa Turki, Azih, yang biasa memungut pajak setiap tahun, meninggal dunia. Beban itu dihentikan bagi mereka dan sebuah khotbah diberikan kepada Ghiyath al-Din, sehingga kota itu menjadi bagian dari tanah Islam {cite:kamil-ibn-al-athir hlm. 252}."
