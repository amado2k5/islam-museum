summary:
  ar: "بهاء الدين سام بن محمد بن مسعود ابن أخت غياث الدين وشهاب الدين الغوريين، صاحب باميان؛ ملك مدينة بلخ سنة أربع وتسعين وخمسمائة لما توفي صاحبها التركي أزيه الذي كان يحمل الخراج كل سنة إلى الخطا، فقطع الحمل عنهم وخطب لغياث الدين فصارت من جملة بلاد الإسلام {cite:kamil-ibn-al-athir p. 252}."
  en: "Nephew of both Ghurid sultans and lord of Bamiyan — seized Balkh in 594 on its tribute-lord's death, cut the Qara Khitai's yearly payment and raised the khutba for Ghiyath al-Din {cite:kamil-ibn-al-athir p. 252}."
