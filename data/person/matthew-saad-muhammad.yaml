summary:
  ar: "ملاكم محترف أمريكي، وُلد في فيلادلفيا سنة 1954 باسم ماكسويل أنطونيو لوتش وتوفي فيها سنة 2014. تربّى يتيماً بعد أن تُرك طفلاً في الخامسة، وحمل اسم ماثيو فرانكلين قبل أن يعتنق الإسلام ويتخذ اسمه المعروف. حمل لقب المجلس العالمي للملاكمة في وزن خفيف الثقيل من 1979 إلى 1981، وأنهى مسيرته بسجل 39 فوزاً و16 خسارة و3 تعادلات، ودخل قاعة مشاهير الملاكمة الدولية سنة 1998."
  en: "American professional boxer, born in Philadelphia in 1954 as Maxwell Antonio Loach and died there in 2014. Raised an orphan after being abandoned at the age of five, he fought as Matthew Franklin before converting to Islam and taking the name he is known by. He held the WBC light heavyweight title from 1979 to 1981, retired with a record of 39 wins, 16 losses and 3 draws, and entered the International Boxing Hall of Fame in 1998."
  ur: "امریکی پیشہ ور باکسر، 1954 میں فلاڈیلفیا میں میکسویل انتونیو لوچ کے نام سے پیدا ہوئے اور 2014 میں وہیں وفات پائی۔ پانچ برس کی عمر میں چھوڑ دیے جانے کے بعد یتیمی میں پلے، میتھیو فرینکلن کے نام سے کھیلے، پھر اسلام قبول کر کے اپنا معروف نام اختیار کیا۔ 1979 سے 1981 تک ڈبلیو بی سی لائٹ ہیوی ویٹ ٹائٹل اپنے پاس رکھا، 39 فتوحات، 16 شکستیں اور 3 برابر مقابلوں کے ساتھ ریٹائر ہوئے، اور 1998 میں انٹرنیشنل باکسنگ ہال آف فیم میں شامل ہوئے۔"
