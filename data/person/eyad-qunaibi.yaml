summary:
  ar: "أكاديمي وداعية أردني، وُلد في السالمية بالكويت سنة 1975 لأسرة أردنية، أستاذ علم الأدوية بجامعة جرش، عُرف جماهيريا بسلسلته المرئية «رحلة اليقين» على يوتيوب التي تناولت أسئلة الإيمان ونقد نظرية التطور، واعتُقل وسُجن في الأردن أكثر من مرة على خلفية منشوراته."
  en: "Jordanian academic and preacher, born in al-Salmiya, Kuwait, in 1975 to a Jordanian family. A professor of pharmacology at Jerash University, he became widely known for his YouTube video series 'Journey of Certainty' (Rihlat al-Yaqin), on questions of faith and criticism of the theory of evolution, and he was arrested and imprisoned in Jordan more than once over his published views."
  ur: "اردنی ماہر تعلیم اور مبلغ، جو 1975 میں کویت کے علاقے سالمیہ میں اردنی خاندان میں پیدا ہوئے۔ وہ جامعہ جرش میں علم الادویہ کے استاذ ہیں اور یوٹیوب پر اپنی ویڈیو سلسلہ «رحلة اليقين» کی وجہ سے معروف ہوئے، جس میں ایمان کے سوالات اور نظریۂ ارتقا پر نقد پیش کیا گیا، اور وہ اردن میں اپنے منشورات کی بنا پر متعدد بار گرفتار و قید ہوئے۔"
  es: "Académico y predicador jordano, nacido en al-Salmiya, Kuwait, en 1975 en el seno de una familia jordana. Profesor de farmacología en la Universidad de Jerash, se hizo ampliamente conocido por su serie de vídeos de YouTube «Viaje de la certeza» (Rihlat al-Yaqin), sobre cuestiones de fe y críticas a la teoría de la evolución, y fue arrestado y encarcelado en Jordania en más de una ocasión por sus opiniones publicadas."
  fr: "Universitaire et prédicateur jordanien, né à al-Salmiya, au Koweït, en 1975 dans une famille jordanienne. Professeur de pharmacologie à l'université de Jerash, il s'est fait connaître grâce à sa série de vidéos YouTube « Voyage vers la certitude » (Rihlat al-Yaqin), traitant de questions de foi et de critiques de la théorie de l'évolution. Il a été arrêté et emprisonné à plusieurs reprises en Jordanie en raison de ses prises de position publiées."
  tr: "1975 yılında Kuveyt'in Salmiya kentinde Ürdünlü bir ailede doğan Ürdünlü akademisyen ve vaiz olan Shern, Jerash Üniversitesi'nde farmakoloji profesörüdür. Evrim teorisinin inanç sorularını ve eleştirilerini ele alan YouTube video serisi \"Kesinlik Yolculuğu\" ile geniş çapta tanınır. Paylaşımları nedeniyle Ürdün'de defalarca tutuklanıp hapse atıldı."
  id: "Seorang akademisi dan pengkhotbah asal Yordania, lahir di Salmiya, Kuwait pada tahun 1975 dari keluarga Yordania, ia adalah profesor farmakologi di Universitas Jerash. Ia dikenal luas melalui seri video YouTube-nya \"The Journey of Certainty,\" yang membahas pertanyaan tentang iman dan kritik terhadap teori evolusi. Ia beberapa kali ditangkap dan dipenjara di Yordania karena postingannya."
