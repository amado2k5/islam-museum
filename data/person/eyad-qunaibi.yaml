summary:
  ar: "أكاديمي وداعية أردني، وُلد في السالمية بالكويت سنة 1975 لأسرة أردنية، أستاذ علم الأدوية بجامعة جرش، عُرف جماهيريا بسلسلته المرئية «رحلة اليقين» على يوتيوب التي تناولت أسئلة الإيمان ونقد نظرية التطور، واعتُقل وسُجن في الأردن أكثر من مرة على خلفية منشوراته."
  en: "Jordanian academic and preacher, born in al-Salmiya, Kuwait, in 1975 to a Jordanian family. A professor of pharmacology at Jerash University, he became widely known for his YouTube video series 'Journey of Certainty' (Rihlat al-Yaqin), on questions of faith and criticism of the theory of evolution, and he was arrested and imprisoned in Jordan more than once over his published views."
  ur: "اردنی ماہر تعلیم اور مبلغ، جو 1975 میں کویت کے علاقے سالمیہ میں اردنی خاندان میں پیدا ہوئے۔ وہ جامعہ جرش میں علم الادویہ کے استاذ ہیں اور یوٹیوب پر اپنی ویڈیو سلسلہ «رحلة اليقين» کی وجہ سے معروف ہوئے، جس میں ایمان کے سوالات اور نظریۂ ارتقا پر نقد پیش کیا گیا، اور وہ اردن میں اپنے منشورات کی بنا پر متعدد بار گرفتار و قید ہوئے۔"
