id: person/al-malik-al-adil-ayyub
class: person
label: { ar: "الملك العادل سيف الدين أبو بكر بن أيوب" }
summary:
  ar: "أخو صلاح الدين، لما مات الملك العزيز بمصر سنة خمس وتسعين وأقيم ابنه المنصور وثب العادل وتملكها ثم أقام بها ابنه الملك الكامل {cite:tarikh-khulafa-minhaj-1434 p. 694}، وتوفي سابع جمادى الآخرة سنة خمس عشرة وستمائة بعلاقين وهو في نوبة دمياط وعمره خمس وسبعون سنة وشهور وحمل فدفن بتربته بدمشق؛ ويذكر ابن الأثير أنه لم يملك ابن أخيه الأفضل مملكة قط إلا وأخذها منه العادل أولها حران والرها وميافارقين ثم دمشق ثم مصر ثم صرخد، وقسم البلاد في حياته بين أولاده فالكامل محمد بمصر والمعظم عيسى بدمشق والقدس وطبرية والأردن والكرك والأشرف موسى ببعض الجزيرة وميافارقين وخلاط وشهاب الدين غازي بالرها والحافظ أرسلان شاه بقلعة جعفر، فثبتوا كل في مملكته واتفقوا كالنفس الواحد وزاد ملكهم ونالوا من نفاذ الأمر ما لم يره أبوهم {cite:kamil-ibn-al-athir p. 393-394}."
  en: "Salah al-Din's brother; when al-Aziz died in 595 leaving the boy al-Mansur, al-Adil seized Egypt then placed his son al-Kamil over it {cite:tarikh-khulafa-minhaj-1434 p. 694}."
