  ar: "داعية وواعظ وخطيب مصري من حلوان جنوب القاهرة، وُلد في نحو سنة 1976، عُرف بخطبه وسلاسل دروسه في التزكية وأعمال القلوب من منبر مسجد الحق بحلوان، واعتُقل سنة 2017 وما زال محتجَزا على ذمة قضية لم يُفصَل فيها بحكم."
  en: "Egyptian preacher and sermon-giver from Helwan, south of Cairo, born in about 1976. He became known for his sermons and lesson series on devotion and the works of the heart from the pulpit of the al-Haqq Mosque in Helwan; he was arrested in 2017 and remains detained in a case in which no verdict has been issued."
  ur: "قاہرہ کے جنوب میں حلوان سے تعلق رکھنے والے مصری مبلغ و خطیب، جو تقریباً 1976 میں پیدا ہوئے۔ وہ حلوان کی مسجد الحق کے منبر سے تزکیہ و اعمالِ قلوب پر اپنے خطبات اور درسی سلسلوں کے لیے مشہور ہوئے؛ 2017 میں گرفتار ہوئے اور ایک مقدمے میں زیرِ حراست ہیں جس میں اب تک کوئی فیصلہ نہیں آیا۔"
