summary:
  ar: "أبو النضر جد قريش؛ عنده تتلاقى أنساب قريش وبني كنانة وبني أسد بن خزيمة وبني عمرو {cite:mubarakpuri-raheeq p.48} {cite:tarikh-al-tabari}، ومن كنانة بن النضر ولده حي بني كنانة."
  en: "Father of al-Nadr, the ancestor of Quraysh; the genealogies of Quraysh, Banu Kinana, Banu Asad ibn Khuzayma and Banu Amr meet at him {cite:mubarakpuri-raheeq p.48} {cite:tarikh-al-tabari}; through his grandson Kinana ibn al-Nadr come the Banu Kinana clans."
  es: "Padre de al-Nadr, el antepasado de Quraysh; las genealogías de Quraysh, Banu Kinana, Banu Asad ibn Khuzayma y Banu Amr se encuentran en él {cita:mubarakpuri-raheeq p.48} {cita:tarikh-al-tabari}; a través de su nieto Kinana ibn al-Nadr vienen los clanes Banu Kinana."
  fr: "Père d'al-Nadr, l'ancêtre de Quraysh; les généalogies de Quraysh, Banu Kinana, Banu Asad ibn Khuzayma et Banu Amr se rencontrent chez lui {cite:mubarakpuri-raheeq p.48} {cite:tarikh-al-tabari}; grâce à son petit-fils Kinana ibn al-Nadr viennent les clans Banu Kinana."
  ur: "قریش کے آباؤ اجداد الندر کا باپ؛ قریش، بنو کنانہ، بنو اسد بن خزیمہ اور بنو عمرو کے نسب اس سے ملتے ہیں {حوالہ:مبارکپوری الرحیق صفحہ 48} اپنے پوتے کنانہ ابن الندر کے ذریعے قبیلہ بنو کنانہ آیا۔"
  tr: "Ebu el-Nadr, Qureyş'in atasıdır; onunla birlikte Qurayş, Banu Kinanah, Banu Asad ibn Khuzaymah ve Banu Amr'ın soyları (kaynak:mubarakpuri-raheeq s.48} {alıntı:Tarikh-al-tabari} iç içe geçmiştir. Kinana ibn al-Nadr'dan oğlu Hayy Banu Kinana'dır."
  id: "Abu al-Nadr adalah leluhur Quraisy; dengan beliau, garis keturunan Quraisy, Banu Kinanah, Banu Asad ibn Khuzaymah, dan Banu Amr (kutip: mubarakpuri-raheeq hlm.48} {cite:Tarikh-al-tabari} saling terkait. Dari Kinana ibn al-Nadr adalah putranya Hayy Banu Kinana."
