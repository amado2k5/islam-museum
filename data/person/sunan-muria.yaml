summary:
  ar: "أحد الأولياء التسعة في جاوة (ت. 1560 بحسب المرويات الإندونيسية)، ابن سونن كاليجاغا وتلميذه، اتخذ مقامه عند جبل موريا شمال قدوس فدُفن في قرية تشولو على سفحه. تميّز عن سائر الأولياء بقربه من عامة الناس: علّم أهل القرى والنواحي النائية الزراعة والصيد وسائر شؤون معاشهم، ودعا إلى الإسلام عبر الويانغ والتمبانغ القصيرة (سينوم وكينانتي) والتقاليد المحلية بعد أسلمتها، فانتشرت دعوته في جيبارا وتايو وجوانا ونواحي قدوس."
  en: "One of the nine Wali Songo of Java (d. 1560 in the Indonesian tradition), son and student of Sunan Kalijaga, who made his seat by Mount Muria north of Kudus and was buried at Colo on its slope. He stood apart from the other wali for his closeness to common people: he taught villagers and remote districts agriculture, fishing and other livelihoods, and preached Islam through wayang puppet theatre, the short tembang metres Sinom and Kinanthi that tradition credits him with creating, and local customs Islamised — carrying his preaching through Jepara, Tayu, Juwana and the Kudus region."
  ur: "جاوا کے نو اولیا میں سے ایک (انڈونیشی روایت کے مطابق وفات 1560ء)، سونن کالی جاگا کے بیٹے اور شاگرد، جنھوں نے قدوس کے شمال میں پہاڑ موریا کے پاس اپنا مرکز بنایا اور اسی کے دامن میں چولو میں دفن ہوئے۔ وہ دوسرے اولیا سے عوام سے قربت میں ممتاز تھے: گاؤں والوں اور دور دراز علاقوں کے لوگوں کو زراعت، ماہی گیری اور دیگر معاشی امور سکھائے، اور وایانگ کٹھ پتلی تماشے، چھوٹے تمنبانگ بحور سینوم اور کینانتی — جن کی ایجاد روایت ان سے منسوب کرتی ہے — اور مقامی رسوم کو اسلامی رنگ دے کر تبلیغ کی، یوں ان کی دعوت جیپارا، تایو، جوانا اور قدوس کے نواح میں پھیلی۔"

