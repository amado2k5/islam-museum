gender: female
roles: [agent]
summary:
  en: "Khadija's confidante to whom she disclosed her wish to marry Muhammad; Nafisa broached the matter with him, he consented, and the match proceeded through their uncles."
  ar: "صديقة خديجة التي أفضت إليها بما في نفسها من الرغبة في الزواج بمحمد؛ فذهبت إليه تفاتحه في ذلك فرضي، وكلم أعمامه فخطبوها إليه من عمها وتم الزواج."
  es: "Nafisa era la confidente de Khadija, a quien ella le reveló su deseo de casarse con Muhammad; Nafisa le planteó el asunto, él accedió y el matrimonio se concretó a través de sus tíos."
  fr: "Khadija confia à sa confidente son désir d'épouser Muhammad; Nafisa aborda le sujet avec lui, il y consentit, et le mariage fut officialisé par l'intermédiaire de leurs oncles."
  ur: "خدیجہ کی معتمد جس سے اس نے محمد سے شادی کرنے کی خواہش ظاہر کی تھی۔ نفیسہ نے اس سے بات کی، اس نے رضامندی ظاہر کی، اور میچ ان کے چچا کے ذریعے آگے بڑھا۔"
  tr: "Hadijah'ın arkadaşı, ona Muhammed ile evlenme konusunda derin bir arzu ifade etti; bu konuyu konuşmak için ona gitti ve Khadijah, amcaları aracılığıyla evlenme teklif eden amcalarıyla konuştu ve evlilik gerçekleşti."
  id: "Teman Khadijah, yang kepadanya dia menyatakan keinginan mendalam untuk menikah dengan Muhammad; dia pergi kepadanya untuk membahas masalah ini, dan Muhammad berbicara dengan pamannya, yang melamarnya melalui pamannya, dan pernikahan pun terjadi."
