summary:
  ar: "جلال الدين ابن العليف المكي؛ ولد بحلى سنة اثنتين وأربعين وسبعمائة ونزل مكة وسمع من المزي وابن جماعة وكان غالياً في التشيع وتعانى النظم فبرع فيه وافق لقرنائه الغالية، مدح ملوك اليمن وأمراء مكة وينبع وانقطع إلى حسن بن عجلان بمكة وله في الناصر لدين الله صاحب صنعاء قصائد، توفي في سابع رجب {cite:shadharat-dhahab p. 120-121}."
  en: "Jalal al-Din Ibn al-'Ulayf (b. 742 at Hali in Yemen) — Meccan poet described by the source as an extreme Shi'i; praised the rulers of Yemen, Mecca and Yanbu and attached himself to Hasan b. 'Ajlan; died 7 Rajab 815 {cite:shadharat-dhahab p. 120-121}."
  es: "Jalal al-Din Ibn al-'Ulayf (n. 742 en Hali, Yemen) — Poeta mecano descrito por la fuente como un chiíta extremista; alabó a los gobernantes de Yemen, La Meca y Yanbu y se adhirió a Hasan b. 'Ajlan; murió en el año 7 de Rajab del 815 {cita: shadharat-dhahab págs. 120-121}."
  fr: "Jalal al-Din Ibn al-'Ulayf (né en 742 à Hali au Yémen) — poète mecquois décrit par la source comme un chiite extrémiste; il a fait l'éloge des dirigeants du Yémen, de La Mecque et de Yanbu et s'est attaché à Hasan b. 'Ajlan; mort le 7 Rajab 815 {cite: shadharat-dhahab p. 120-121}."
  ur: "جلال الدین ابن العلیف ⁦(پیدائش 742 یمن میں حلی)⁩ - مکی شاعر جسے ماخذ نے انتہائی شیعہ قرار دیا ہے۔ اس نے یمن، مکہ اور ینبو کے حکمرانوں کی تعریف کی اور اپنے آپ کو حسن بن سے جوڑ دیا۔ 'اجلان؛ 7 رجب وفات 815۔ 120-121}۔"
  tr: "Celaleddin İbn el-'Alif el-Makki; 742 Hicri yılında Hala'da doğdu, Mekke'ye yerleşti ve el-Mizzi ile İbn Cema'ah'tan dinledi. Şiilikte önde gelen bir figürdü ve şiirle mücadele etti, şiirde üstün başarı gösterdi ve saygıdeğer meslektaşlarıyla aynı fikirde oldu. Yemen krallarını, Mekke ve Yanbu prenslerini övdü, daha sonra Mekke'de Hasan ibn Eclan ile ilişki kurdu. Ayrıca Sana'a'nın yazarı El-Nasir li-Din Allah üzerine şiirler yazdı. Recep'in yedinci gününde vefat etti {atıf: şadharat-dhahab, s. 120-121}."
  id: "Jalal al-Din Ibn al-'Alif al-Makki; lahir di Hala pada tahun 742 H, ia menetap di Mekah dan mendengar dari al-Mizzi dan Ibn Jama'ah. Ia adalah tokoh terkemuka dalam Syiah dan berjuang dalam puisi, unggul dalam puisi dan sejalan dengan rekan-rekannya yang terhormat. Ia memuji raja-raja Yaman dan para pangeran Mekah dan Yanbu, dan kemudian berhubungan dengan Hasan ibn Ajlan di Mekah. Ia juga menulis puisi tentang Al-Nasir li-Din Allah, penulis Sana'a. Ia meninggal pada tanggal tujuh Rajab {cite:shadharat-dhahab, hlm. 120-121}."
