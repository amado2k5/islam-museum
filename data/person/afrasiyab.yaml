summary:
  ar: "ملك أسطوري للتوارنيين عند الإيرانيين، عدو كيخسرو، قتل سياوش غدرًا، ثم قتله كيخسرو بيده؛ وجعله المؤرخون الإسلاميون تركيًا، وادّعت به بعض الأسر التركية نسبها {cite:encyclopaedia-of-islam-2 vol. 1 p. 258}."
  en: "Legendary king of the Turanians in Iranian tradition, enemy of Kay Khusraw, who treacherously murdered Siyawush; Kay Khusraw killed him with his own hand. Islamic authors made him a Turk, and some Turkish dynasties claimed descent from him {cite:encyclopaedia-of-islam-2 vol. 1 p. 258}."
  fr: "Roi légendaire des Touraniens dans la tradition iranienne, ennemi de Kay Khusraw et meurtrier par traîtrise de Siyawush ; Kay Khusraw le tua de sa propre main. Les auteurs musulmans en firent un Turc, et certaines dynasties turques revendiquèrent sa descendance {cite:encyclopaedia-of-islam-2 vol. 1 p. 258}."
  es: "Rey legendario de los turanios en la tradición iraní, enemigo de Kay Khusraw, quien asesinó traicioneramente a Siyawush; Kay Khusraw lo mató con sus propias manos. Autores islámicos lo identificaron como turco, y algunas dinastías turcas afirmaron descender de él {cite:encyclopaedia-of-islam-2 vol. 1 p. 258}."
  ur: "ایرانی روایت میں تورانیوں کا مشہور بادشاہ، کی خسرو کا دشمن، جس نے غداری سے سیاوش کو قتل کیا؛ کی خسرو نے اسے اپنے ہاتھ سے قتل کیا۔ اسلامی مصنفین نے اسے ترک بنایا، اور کچھ ترک خاندانوں نے ان کی نسل کا دعویٰ کیا۔ 1 ص۔ 258}۔"
