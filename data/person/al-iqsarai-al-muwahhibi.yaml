summary:
  ar: "برهان الدين أبو الطيب إبراهيم بن محمود الأقصرائي الأصل القاهري الشافعي المواهبي — نسبة إلى تلقينه أبي المواهب التونسي؛ قرأ طرفاً من العلم على شيوخ عصره بالسخاوي وغيره وصحب الشيخ الكامل أبا الفتوح محمد الشهير بابن المغربي وأخذ في التصوف، ثم أخذ بإذنه عن الولي الكبير أبي المواهب محمد التونسي فعادت عليه بركات عوارفه وفُتح له على يديه؛ قال جار الله بن فهد: وقد جاور صاحب الترجمة بمكة سنة أربع وتسعمائة وأقام بها ثلاث سنين؛ ألّف شرحاً على الحكم لابن عطاء الله سماه «أحكام الحكم لشرح الحكم» وشرح رسالته المسماة «أصول مقدمات الوصول» وشرح كلمات «يا مولانا يا واحد يا أحد» سماه «شرح التمويل في بيان مشاهد يا مولانا يا واحد يا أحد» وشرح الرسالة السنوسية في أصول الدين، وله ديوان نظم وعدة رسائل وسبعة أحزاب ومؤلفات في الزيارات النبوية، وأخذ الناس عنه التصوف؛ توفي ليلة الخميس ثامن عشر جمادى الآخرة سنة ثمان وتسعمائة {cite:shadharat-dhahab p. 453-454}."
  en: "Named 'al-Muwahhibi' after his initiator Abu al-Mawahib al-Tunisi — 'the great saint' whose grace, the source says, opened hearts through him; Ibn Fahd notes his three years' residence at Mecca from 904; author of Ihkam al-Hikam on Ibn 'Ata' Allah's Hikam, a sharh on the Sanusiyya in usul, Sharh al-Tamwil on the litany 'Ya mawlana ya Wahid ya Ahad', a diwan, seven ahzab and works on the Prophetic visitation; d. Thursday night 18 Jumada II 908 {cite:shadharat-dhahab p. 453-454}."
died: { edtf: "1502-12-11~", hijri: "0908-06-18", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي ليلة الخميس 18 جمادى الآخرة 908 {cite:shadharat-dhahab p. 454}", sources: [source/shadharat-dhahab] }
