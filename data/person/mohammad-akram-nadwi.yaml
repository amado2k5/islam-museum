summary:
  ar: "محدث بريطاني من أصل هندي، وُلد سنة 1964، مؤسس كلية كامبريدج الإسلامية ورئيسها. ألّف معجمًا تراجميًا في 43 مجلدًا وثّق فيه نحو عشرة آلاف محدثة، ومن كتبه «الوفاء بأسماء النساء» و«المحدثات» و«أبو حنيفة: حياته ومنهجه الفقهي»."
  en: "India-born British hadith scholar, born in 1964, founder and principal of Cambridge Islamic College. He authored a 43-volume biographical dictionary documenting nearly 10,000 female hadith scholars, with books including al-Wafa’ bi-Asma’ al-Nisa’, al-Muhaddithat and Abu Hanifa: His Life and Legal Method."
  ur: "برطانوی محدث، بھارت میں 1964 کو پیدا ہوئے، کیمبرج اسلامک کالج کے بانی اور پرنسپل۔ انہوں نے 43 جلدوں کا تراجمی معجم تحریر کیا جس میں تقریباً دس ہزار محدثات کا ذکر ہے؛ کتب میں «الوفاء بأسماء النساء»، «المحدثات» اور Abu Hanifa: His Life and Legal Method شامل ہیں۔"
  es: "Erudito británico de hadices, nacido en la India en 1964, fundador y director del Cambridge Islamic College. Es autor de un diccionario biográfico de 43 volúmenes que documenta a casi 10 000 eruditas de hadices, entre cuyos libros destacan al-Wafa' bi-Asma' al-Nisa', al-Muhaddithat y Abu Hanifa: Su vida y método jurídico."
  fr: "Érudit britannique en hadiths, né en Inde en 1964, fondateur et directeur du Cambridge Islamic College. Il est l'auteur d'un dictionnaire biographique en 43 volumes recensant près de 10 000 femmes spécialistes du hadiths, parmi lesquelles figurent al-Wafa' bi-Asma' al-Nisa', al-Muhaddithat et Abu Hanifa: His Life and Legal Method."
