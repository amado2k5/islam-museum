summary:
  ar: "محمد بن عبد الرحمن بن ثوبان القرشي العامري. روى عن أبي هريرة وأبي سعيد وفاطمة بنت قيس وزيد بن ثابت وجابر وابن عباس وابن عمر، وروى عنه أخوه سليمان ويحيى بن أبي كثير ويحيى بن سعيد الأنصاري والزهري. قال أبو حاتم: من التابعين، وقال ابن سعد وأبو زرعة والنسائي: ثقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  en: "Muhammad ibn Abd al-Rahman ibn Thawban al-Qurashi al-Amiri. He transmitted from Abu Hurayra, Abu Sa'id, Fatima bint Qays, Zayd ibn Thabit, Jabir, Ibn Abbas and Ibn Umar. His brother Sulayman, Yahya ibn Abi Kathir, Yahya ibn Sa'id al-Ansari and al-Zuhri transmitted from him. Abu Hatim calls him a Successor; Ibn Sa'd, Abu Zur'a and al-Nasa'i call him trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
