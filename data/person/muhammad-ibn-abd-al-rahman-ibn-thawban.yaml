summary:
  ar: "محمد بن عبد الرحمن بن ثوبان القرشي العامري. روى عن أبي هريرة وأبي سعيد وفاطمة بنت قيس وزيد بن ثابت وجابر وابن عباس وابن عمر، وروى عنه أخوه سليمان ويحيى بن أبي كثير ويحيى بن سعيد الأنصاري والزهري. قال أبو حاتم: من التابعين، وقال ابن سعد وأبو زرعة والنسائي: ثقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  en: "Muhammad ibn Abd al-Rahman ibn Thawban al-Qurashi al-Amiri. He transmitted from Abu Hurayra, Abu Sa'id, Fatima bint Qays, Zayd ibn Thabit, Jabir, Ibn Abbas and Ibn Umar. His brother Sulayman, Yahya ibn Abi Kathir, Yahya ibn Sa'id al-Ansari and al-Zuhri transmitted from him. Abu Hatim calls him a Successor; Ibn Sa'd, Abu Zur'a and al-Nasa'i call him trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  es: "Muhammad ibn Abd al-Rahman ibn Thawban al-Qurashi al-Amiri. Transmitió desde Abu Hurayra, Abu Sa'id, Fatima bint Qays, Zayd ibn Thabit, Jabir, Ibn Abbas e Ibn Umar. Su hermano Sulayman, Yahya ibn Abi Kathir, Yahya ibn Sa'id al-Ansari y al-Zuhri transmitieron de él. Abu Hatim lo llama Sucesor; Ibn Sa'd, Abu Zur'a y al-Nasa'i lo consideran digno de confianza. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  fr: "Muhammad ibn Abd al-Rahman ibn Thawban al-Qurashi al-Amiri. Il a transmis d'Abu Hurayra, Abu Sa'id, Fatima bint Qays, Zayd ibn Thabit, Jabir, Ibn Abbas et Ibn Umar. Son frère Sulayman, Yahya ibn Abi Kathir, Yahya ibn Sa'id al-Ansari et al-Zuhri lui ont transmis. Abu Hatim l'appelle un successeur; Ibn Sa'd, Abu Zur'a et al-Nasa'i le considèrent comme digne de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15418}"
  ur: "محمد بن عبدالرحمٰن بن ثوبان القرشی الامیری۔ انہوں نے ابوہریرہ، ابو سعید، فاطمہ بنت قیس، زید بن ثابت، جابر، ابن عباس اور ابن عمر سے روایت کی ہے۔ ان کے بھائی سلیمان، یحییٰ بن ابی کثیر، یحییٰ بن سعید الانصاری اور الزہری نے ان سے روایت کی ہے۔ ابو حاتم نے اسے جانشین کہا۔ ابن سعد، ابو زرعہ اور نسائی نے اسے ثقہ کہا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 15418}"
