summary:
  ar: "حيدر جواد كاظم العبادي (وُلد 25 نيسان 1952)، سياسي عراقي، رئيس وزراء العراق من 8 أيلول 2014 إلى 25 تشرين الأول 2018، قاد البلاد في الحرب ضد تنظيم الدولة وأعلن النصر النهائي عليه في كانون الأول 2017. مهندس كهرباء درس في بغداد ومانشستر، انضم إلى حزب الدعوة سنة 1967 وعاش منفيًا في بريطانيا، وكان وزيرًا للاتصالات 2003–2004 قبل رئاسته للحكومة."
  en: "Haider Jawad Kadhim al-Abadi (born 25 April 1952) is an Iraqi politician who was prime minister of Iraq from 8 September 2014 to 25 October 2018, leading the country through the war against the Islamic State and announcing final victory over it in December 2017. An electrical engineer educated at Baghdad and Manchester, he joined the Islamic Dawa Party in 1967, lived in exile in Britain, and was Minister of Communications in 2003–2004 before his premiership."
  ur: "حیدر جواد کاظم العبادی (پیدائش 25 اپریل 1952ء) ایک عراقی سیاست دان ہیں جو 8 ستمبر 2014ء سے 25 اکتوبر 2018ء تک عراق کے وزیرِ اعظم رہے اور داعش کے خلاف جنگ میں ملک کی قیادت کی، دسمبر 2017ء میں اس پر حتمی فتح کا اعلان کیا۔ وہ بغداد اور مانچسٹر سے تعلیم یافتہ الیکٹریکل انجینئر ہیں، 1967ء میں حزب الدعوۃ میں شامل ہوئے، برطانیہ میں جلاوطنی گزاری اور 2003ء–2004ء میں وزیرِ مواصلات رہے۔"
