summary:
  ar: "حيدر جواد كاظم العبادي ⁦(وُلد 25 نيسان 1952)⁩، سياسي عراقي، رئيس وزراء العراق من 8 أيلول 2014 إلى 25 تشرين الأول 2018، قاد البلاد في الحرب ضد تنظيم الدولة وأعلن النصر النهائي عليه في كانون الأول 2017. مهندس كهرباء درس في بغداد ومانشستر، انضم إلى حزب الدعوة سنة 1967 وعاش منفيًا في بريطانيا، وكان وزيرًا للاتصالات 2003–2004 قبل رئاسته للحكومة."
  en: "Haider Jawad Kadhim al-Abadi (born 25 April 1952) is an Iraqi politician who was prime minister of Iraq from 8 September 2014 to 25 October 2018, leading the country through the war against the Islamic State and announcing final victory over it in December 2017. An electrical engineer educated at Baghdad and Manchester, he joined the Islamic Dawa Party in 1967, lived in exile in Britain, and was Minister of Communications in 2003–2004 before his premiership."
  ur: "حیدر جواد کاظم العبادی ⁦(پیدائش 25 اپریل 1952ء)⁩ ایک عراقی سیاست دان ہیں جو 8 ستمبر 2014ء سے 25 اکتوبر 2018ء تک عراق کے وزیرِ اعظم رہے اور داعش کے خلاف جنگ میں ملک کی قیادت کی، دسمبر 2017ء میں اس پر حتمی فتح کا اعلان کیا۔ وہ بغداد اور مانچسٹر سے تعلیم یافتہ الیکٹریکل انجینئر ہیں، 1967ء میں حزب الدعوۃ میں شامل ہوئے، برطانیہ میں جلاوطنی گزاری اور 2003ء–2004ء میں وزیرِ مواصلات رہے۔"
  es: "Haider Jawad Kadhim al-Abadi (nacido el 25 de abril de 1952) es un político iraquí que fue primer ministro de Irak desde el 8 de septiembre de 2014 hasta el 25 de octubre de 2018, liderando al país durante la guerra contra el Estado Islámico y anunciando la victoria final sobre este en diciembre de 2017. Ingeniero eléctrico formado en Bagdad y Manchester, se unió al Partido Islámico Dawa en 1967, vivió exiliado en Gran Bretaña y fue ministro de Comunicaciones entre 2003 y 2004 antes de su mandato como primer ministro."
  fr: "Haider Jawad Kadhim al-Abadi (né le 25 avril 1952) est un homme politique irakien qui a été Premier ministre d'Irak du 8 septembre 2014 au 25 octobre 2018, dirigeant le pays pendant la guerre contre l'État islamique et annonçant la victoire finale sur ce dernier en décembre 2017. Ingénieur électricien formé à Bagdad et à Manchester, il a rejoint le parti islamique Dawa en 1967, a vécu en exil en Grande-Bretagne et a été ministre des Communications en 2003-2004 avant d'accéder au poste de Premier ministre."
  tr: "Haider Jawad Kazem al-Abadi (d. 25 Nisan 1952), Iraklı bir siyasetçidir, 8 Eylül 2014'ten 25 Ekim 2018'e kadar Irak Başbakanı olarak görev yapmıştır. Ülkeyi IŞİD'e karşı savaşta yönetti ve Aralık 2017'de IŞİD üzerinde nihai zaferini ilan etti. Bağdat ve Manchester'da eğitim görmüş, 1967'de Dawa Partisi'ne katılmış, sürgünde Britanya'da yaşamış ve 2003-2004 yılları arasında İletişim Bakanı olarak görev yapmış, ardından Başbakan olmuştur."
  id: "Haider Jawad Kazem al-Abadi (lahir 25 April 1952) adalah seorang politikus Irak, Perdana Menteri Irak dari 8 September 2014 hingga 25 Oktober 2018. Ia memimpin negara dalam perang melawan ISIS dan menyatakan kemenangan akhir atas ISIS pada Desember 2017. Seorang insinyur listrik yang belajar di Baghdad dan Manchester, bergabung dengan Partai Dawa pada tahun 1967, hidup dalam pengasingan di Inggris, dan menjabat sebagai Menteri Komunikasi dari tahun 2003 hingga 2004 sebelum menjadi Perdana Menteri."
