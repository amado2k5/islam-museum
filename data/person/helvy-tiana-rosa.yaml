    پڑھاتی ہیں۔
  es: "Escritora y académica indonesia nacida en Medan en 1970; en 1997 fundó el colectivo de escritores Forum Lingkar Pena, que impulsó la literatura popular islámica indonesia moderna, y ha publicado más de cien libros mientras impartía clases de literatura en la Universidad de Indonesia."
