  ar: كاتبة وأكاديمية إندونيسية وُلدت سنة 1970 في ميدان؛ أسست سنة 1997 «منتدى لينغكار بينا» فأشعلت أدبًا إسلاميًا شعبيًا حديثًا، ولها أكثر من مئة كتاب وتُدرّس الأدب في جامعة إندونيسيا.
  en: Indonesian writer and academic born in Medan in 1970; in 1997 she founded the Forum Lingkar Pena writers' collective that ignited modern Indonesian Islamic popular literature, and she has published
    over a hundred books while teaching literature at the University of Indonesia.
