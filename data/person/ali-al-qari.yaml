summary:
  ar: "نور الدين ملا علي بن سلطان محمد القاري الهروي ثم المكي الحنفي ⁦(ت شوال 1014هـ)⁩، ولد بهراة وتعلم بها القرآن والقراءات، ثم رحل إلى مكة بين سنتي 952 و973هـ وجاورها أكثر من أربعين عاماً، وأخذ عن ابن حجر الهيتمي وعلي المتقي الهندي وغيرهما، وصنّف فوق مائة كتاب منها «مرقاة المفاتيح» و«شرح الشفا» و«شرح الفقه الأكبر» و«جمع الوسائل في شرح الشمائل»؛ ودفن بالمعلاة."
  en: "Nur al-Din Mulla Ali ibn Sultan Muhammad al-Qari of Herat, later of Mecca, Hanafi (d. Shawwal 1014 AH). Born in Herat, where he learned the Qur'an and its readings, he moved to Mecca between 952 and 973 AH and lived there more than forty years, studying with Ibn Hajar al-Haytami, Ali al-Muttaqi al-Hindi and others; he wrote over a hundred works, among them Mirqat al-Mafatih, a commentary on al-Shifa, a commentary on al-Fiqh al-Akbar and Jam' al-Wasa'il fi Sharh al-Shama'il, and was buried in al-Ma'la."
