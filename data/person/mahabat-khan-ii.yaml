summary:
  ar: "مهابة خان الثاني (ت. 2 يناير 1675)، المولود ميرزا لهراسب، نبيل مغولي في عهدي شاه جهان وأورنكزيب، والابن الثاني لزمانة بك مهابة خان الأول. صار مير بخشي الإمبراطورية سنة 1651 وورث لقب أبيه سنة 1652، وحكم كابل مرارًا وكجرات من 1662 إلى 1668، واشتهر بصراحته في نقد تنامي نفوذ القضاء والفقهاء السياسي في عهد أورنكزيب، وتُنسب إليه عمارة مسجد مهابة خان في بيشاور."
  en: "Mahabat Khan II (d. 2 January 1675), born Mirza Luhrasp, was a Mughal noble under Shah Jahan and Aurangzeb and the second son of Zamana Beg, the first Mahabat Khan. He became mir bakhshi of the empire in 1651, inherited his father's title in 1652, governed Kabul repeatedly and Gujarat from 1662 to 1668, was known for outspoken criticism of the growing political power of the Islamic clergy under Aurangzeb, and has been credited by scholars with Peshawar's Mahabat Khan Mosque."
  ur: "مہابت خان دوم (وفات 2 جنوری 1675ء)، اصل نام مرزا لہراسپ، شاہ جہاں اور اورنگزیب کے دور کے مغل امیر اور زمانہ بیگ، پہلے مہابت خان، کے دوسرے بیٹے تھے۔ وہ 1651ء میں سلطنت کے میر بخشی بنے، 1652ء میں والد کا لقب ورثے میں پایا، کابل کے بار بار حاکم رہے اور 1662ء سے 1668ء تک گجرات کی حکومت کی؛ اورنگزیب کے دور میں اسلامی علما کے بڑھتے سیاسی اثر پر کھلی تنقید کے لیے مشہور تھے، اور پشاور کی مہابت خان مسجد کی تعمیر محققین نے انہی سے منسوب کی ہے۔"

