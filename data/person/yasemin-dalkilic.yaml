  ar: "غوّاصة حرة تركية، وُلدت في أنقرة سنة 1979. حطّمت ثمانية أرقام قياسية عالمية في الغوص الحر، منها غوصة «بلا حدود» بلغت 120 مترًا سنة 2000، وأول رقم قياسي عالمي رسمي في فئة الوزن الثابت دون زعانف (40 مترًا) سنة 2001."
