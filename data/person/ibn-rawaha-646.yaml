label: { ar: "ابن رواحة الشافعي" }
names:
  - { kind: full, lang: ar, value: عز الدين أبو القاسم عبد الله بن الحسين بن عبد الله الأنصاري الحوي }
summary:
  ar: "ابن رواحة عز الدين أبو القاسم عبد الله بن الحسين بن عبد الله الأنصاري الحوي الشافعي ولد بصقلية وأبواه في الأسر سنة ستين وخمسمائة وسمعه أبوه بالإسكندرية من السافي الكبير ومن جماعة توفي في ثامن جمادى الآخرة سنة ست وأربعين وست مئة وله خمس وثمانون سنة {cite:shadharat-dhahab p. 234}."
  en: "Ibn Rawaha — born in Sicily in 560 while his parents were captives — heard his father's recitations at Alexandria from al-Safi the Elder and others; died 8 Jumada II 646 at eighty-five {cite:shadharat-dhahab p. 234}."
  es: "Ibn Rawaha — nacido en Sicilia en 560 mientras sus padres eran cautivos — escuchó las recitaciones de su padre en Alejandría de al-Safi el Viejo y otros; murió el 8 de Jumada II de 646 a los ochenta y cinco años {cite:shadharat-dhahab p. 234}."
  fr: "Ibn Rawaha — né en Sicile en 560 alors que ses parents étaient captifs — a entendu les récitations de son père à Alexandrie d'al-Safi l'Ancien et d'autres; est mort le 8 Jumada II 646 à quatre-vingt-cinq ans {cite:shadharat-dhahab p. 234}."
  ur: "ابن رواحہ - 560 میں سسلی میں پیدا ہوا جب اس کے والدین اسیر تھے - نے اسکندریہ میں اپنے والد کی تلاوت الصفی بزرگ اور دیگر لوگوں سے سنی۔ وفات 8 جمادی الثانی 646 کو پچاسی میں 234}۔"
  tr: "İbn Rawaha İzz-el-Din Ebu el-Kasım Abdullah ibn el-Hüseyin ibn Abdullah el-Ansari el-Havi el-Şafi'i, Sicilya'da doğdu ve ebeveynleri 560 Hicri yılında esaret altındaydı. Babası onu İskenderiye'de el-Safi el-Kabir'den ve 646 Hicri yılının 8'inde ölen ve seksen beş yaşında olan bir gruptan dinlemiştir {cite:shadharat-dhahab, s. 234}."
  id: "Ibn Rawaha Izz al-Din Abu al-Qasim Abdullah ibn al-Husayn ibn Abdullah al-Ansari al-Hawi al-Shafi'i lahir di Sisilia dan orang tuanya ditahan pada tahun 560 H. Ayahnya mendengarnya di Alexandria dari al-Safi al-Kabir dan dari kelompok yang meninggal pada tanggal 8 Jumada al-Akhirah tahun 646 H dan berusia delapan puluh lima tahun {cite:shadharat-dhahab, hlm. 234}."
