class: person
label: { ar: "سمّاك بن تخرمة الأسدي", en: "Simak ibn Takhrama al-Asadi", es: "Simak ibn Takhrama al-Asadi", fr: "Simak ibn Takhrama al-Asadi", ur: "سماک ابن تکرمہ الاسدی" }
summary:
  ar: "سمّاك بن تخرمة بن حمين الأسدي من بني الهالك بن عمرو بن أسد؛ عند البلاذري نسب إليه مسجد سماك بالكوفة وهو الذي هجاه الأخطل في بنائه بيتاً لأسرته فقال له ويحك ما أعياك أردت أن تمدحني فهجوتني وكان الهالك أول من عمل الحديد وكان ولده يعيرون بذلك وكان سماك قد هرب من علي بن أبي طالب من الكوفة ونزل الرقة."
  en: "Simak ibn Takhrama ibn Humayn al-Asadi of Banu al-Halik; in al-Baladhuri Kufa's Simak mosque is named for him — he whom al-Akhtal lampooned for building his family a house, telling him 'you meant to praise me and satirized me'; al-Halik was the first to work iron, for which his sons were taunted; Simak had fled Ali ibn Abi Talib from Kufa and settled at al-Raqqa."
  es: "Simak ibn Takhrama ibn Humayn al-Asadi de Banu al-Halik; en al-Baladhuri, la mezquita Simak de Kufa lleva su nombre; fue él a quien al-Akhtal ridiculizó por construirle una casa a su familia, diciéndole: \"Querías elogiarme y me satirizaste\"; al-Halik fue el primero en trabajar el hierro, por lo que sus hijos fueron objeto de burlas; Simak había huido de Ali ibn Abi Talib de Kufa y se estableció en al-Raqqa."
  fr: "Simak ibn Takhrama ibn Humayn al-Asadi de Banu al-Halik; la mosquée Simak de Kufa porte son nom dans le livre al-Baladhuri — celui-là même qu'al-Akhtal railla pour avoir construit une maison pour sa famille, lui disant « tu voulais me louer et tu m'as satirisé »; al-Halik fut le premier à travailler le fer, ce qui valut à ses fils d'être raillés; Simak avait fui Ali ibn Abi Talib de Kufa et s'était installé à al-Raqqa."
  ur: "بنو الحلک کے سماک بن تکرمہ بن ہمین الاسدی؛ البلادھوری کوفہ کی سماک مسجد میں اس کے نام سے منسوب ہے - وہ جسے الاخلاص نے اپنے خاندان کو ایک گھر بنانے کے لیے چراغ پا کر اس سے کہا کہ 'تمہارا مقصد میری تعریف کرنا ہے اور مجھ پر طنز کیا ہے'؛ الحلک لوہے کا کام کرنے والا پہلا شخص تھا جس کے لیے اس کے بیٹوں کو طعنہ دیا جاتا تھا۔ سماک علی ابن ابی طالب کوفہ سے بھاگ کر الرقہ میں جا بسا تھا۔"
