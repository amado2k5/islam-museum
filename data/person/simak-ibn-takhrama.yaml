label: { ar: "سمّاك بن تخرمة الأسدي", en: "Simak ibn Takhrama al-Asadi" }
summary:
  ar: "سمّاك بن تخرمة بن حمين الأسدي من بني الهالك بن عمرو بن أسد؛ عند البلاذري نسب إليه مسجد سماك بالكوفة وهو الذي هجاه الأخطل في بنائه بيتاً لأسرته فقال له ويحك ما أعياك أردت أن تمدحني فهجوتني وكان الهالك أول من عمل الحديد وكان ولده يعيرون بذلك وكان سماك قد هرب من علي بن أبي طالب من الكوفة ونزل الرقة."
  en: "Simak ibn Takhrama ibn Humayn al-Asadi of Banu al-Halik; in al-Baladhuri Kufa's Simak mosque is named for him — he whom al-Akhtal lampooned for building his family a house, telling him 'you meant to praise me and satirized me'; al-Halik was the first to work iron, for which his sons were taunted; Simak had fled Ali ibn Abi Talib from Kufa and settled at al-Raqqa."
