label: { ar: "أبو محمد ابن حزم الأندلسي" }
summary:
  ar: "الحافظ أبو محمد علي بن أحمد بن حزم الأندلسي، إمام الظاهرية وصاحب طوق الحمامة والفصل في الملل والأهواء والنحل؛ ورد في نفح الطيب أن أديباً كتب إليه فأجابه ابن حزم وأنشد فيه يصف خيالاً طرقه {cite:nafh-tib-maqqari}. وذكر ابن غالب أن بني حزم بيت غير البيت الذي منه أبو محمد بن حزم الحافظ الظاهري وهو فارسي الأصل {cite:nafh-tib-maqqari p. 327}. وقال ابن حيان وغيره: كان صاحب حديث وفقه وجدل وله كتب كثيرة في المنطق والفلسفة، وكان شافعي المذهب يناضل الفقهاء عن مذهبه ثم صار ظاهرياً فوضع الكتب في هذا المذهب وثبت عليه إلى أن مات، وشنع عليه الفقهاء وأقصاه الملوك، وقال صاعد في تاريخه: كان ابن حزم أجمع أهل الأندلس قاطبة لعلوم الإسلام وأوسعهم معرفة، وأخبره ابنه الفضل أنه اجتمع عنده بخط أبيه من تواليفه نحو أربعمائة مجلد، وقال الغزالي: وجدت في أسماء الله كتاباً لأبي محمد ابن حزم يدل على عظم حفظه وسيلان ذهنه؛ ولد بقرطبة بربض منية المغيرة آخر ليلة الأربعاء آخر يوم من رمضان سنة أربع وثمانين وثلاثمائة وتوفي بالبادية بقرية منت لشم عشية الأحد لليلتين بقيتا من شعبان سنة ست وخمسين وأربعمائة {cite:nafh-tib-maqqari p. 80-81}."
  en: "Abu Muhammad Ali b. Ahmad Ibn Hazm, the Zahiri imam of al-Andalus, author of Tawq al-Hamama and al-Fisal {cite:nafh-tib-maqqari}."
