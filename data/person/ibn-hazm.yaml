id: person/ibn-hazm
class: person
tags: [madhahib-browser, mh-ukhra]
label: { ar: "أبو محمد ابن حزم الأندلسي" }
summary:
  ar: "الحافظ أبو محمد علي بن أحمد بن حزم الأندلسي، إمام الظاهرية وصاحب طوق الحمامة والفصل في الملل والأهواء والنحل؛ ورد في نفح الطيب أن أديباً كتب إليه فأجابه ابن حزم وأنشد فيه يصف خيالاً طرقه {cite:nafh-tib-maqqari}. وذكر ابن غالب أن بني حزم بيت غير البيت الذي منه أبو محمد بن حزم الحافظ الظاهري وهو فارسي الأصل {cite:nafh-tib-maqqari p. 327}. وقال ابن حيان وغيره: كان صاحب حديث وفقه وجدل وله كتب كثيرة في المنطق والفلسفة، وكان شافعي المذهب يناضل الفقهاء عن مذهبه ثم صار ظاهرياً فوضع الكتب في هذا المذهب وثبت عليه إلى أن مات، وشنع عليه الفقهاء وأقصاه الملوك، وقال صاعد في تاريخه: كان ابن حزم أجمع أهل الأندلس قاطبة لعلوم الإسلام وأوسعهم معرفة، وأخبره ابنه الفضل أنه اجتمع عنده بخط أبيه من تواليفه نحو أربعمائة مجلد، وقال الغزالي: وجدت في أسماء الله كتاباً لأبي محمد ابن حزم يدل على عظم حفظه وسيلان ذهنه؛ ولد بقرطبة بربض منية المغيرة آخر ليلة الأربعاء آخر يوم من رمضان سنة أربع وثمانين وثلاثمائة وتوفي بالبادية بقرية منت لشم عشية الأحد لليلتين بقيتا من شعبان سنة ست وخمسين وأربعمائة {cite:nafh-tib-maqqari p. 80-81}. وتصفه دائرة المعارف الإسلامية بأنه شاعر ومؤرخ وفقيه وفيلسوف ومتكلم أندلسي، وزر في السنوات المضطربة الأخيرة من الخلافة الأموية في قرطبة ثم تفرغ للدرس والتأليف والتعليم."
  en: "Abu Muhammad Ali b. Ahmad Ibn Hazm, the Zahiri imam of al-Andalus, author of Tawq al-Hamama and al-Fisal {cite:nafh-tib-maqqari}. Born at Cordoba in 384/994 and died at Manta Lisham in 456/1064, he was an Andalusian poet, historian, jurist, philosopher and theologian. He served as vizier in the troubled last years of the Umayyad caliphate of Cordoba, then withdrew to study, writing and teaching. The Encyclopaedia of Islam says he applied the Zahiri method to law, logic, theology and the history of religions."
  ur: "ابو محمد علی بن احمد بن حزم، اندلس کے ظاہری امام، طوق الحمامہ اور الفصل کے مصنف۔ وہ 384ھ/994ء میں قرطبہ میں پیدا ہوئے اور 456ھ/1064ء میں منت لشم میں فوت ہوئے؛ شاعر، مؤرخ، فقیہ، فلسفی اور متکلم تھے۔ اموی خلافت قرطبہ کے آخری پرآشوب برسوں میں وزیر رہے، پھر مطالعے، تصنیف اور تدریس کی طرف لوٹ گئے۔ انسائیکلوپیڈیا آف اسلام کے مطابق انہوں نے ظاہری طریقہ فقہ، منطق، کلام اور ادیان کی تاریخ پر لاگو کیا."
  es: "Abu Muhammad Ali b. Ahmad Ibn Hazm, imán zahirí de al-Ándalus, autor de Tawq al-Hamama y al-Fisal {cite:nafh-tib-maqqari}. Nacido en Córdoba en 384/994 y fallecido en Manta Lisham en 456/1064, fue poeta, historiador, jurista, filósofo y teólogo andalusí. Sirvió como visir durante los turbulentos últimos años del califato omeya de Córdoba, tras lo cual se retiró al estudio, la escritura y la enseñanza. La Enciclopedia del Islam afirma que aplicó el método zahirí al derecho, la lógica, la teología y la historia de las religiones."
  fr: "Abou Muhammad Ali ben Ahmad Ibn Hazm, imam zahirite d'al-Andalus, auteur de Tawq al-Hamama et d'al-Fisal (source: Nafh-Tib-Maqqari), naquit à Cordoue en 384/994 et mourut à Manta Lisham en 456/1064. Poète, historien, juriste, philosophe et théologien andalou, il exerça la fonction de vizir durant les dernières années troublées du califat omeyyade de Cordoue, avant de se retirer pour se consacrer à l'étude, à l'écriture et à l'enseignement. L'Encyclopédie de l'Islam indique qu'il appliqua la méthode zahirite au droit, à la logique, à la théologie et à l'histoire des religions."
  tr: "Zahiri mezhebi imamı ve Tawq al-Hamama ile Fasl fi al-Milal wa al-Ahwa' wal-Nihal'in yazarı Ebu Muhammed Ali ibn Ahmed ibn Hazm al-Andalusi, Nefh al-Tib'de bir edebi figürün ona yazdığı ve İbn Hazm'ın yollarının hayal gücünü anlattığı ve yanıt verdiği belirtilir. İbn Ghalib, Banu Hazm'ın evinin Fars kökenli Ebu Muhammed bin Hazm el-Hafız el-Zahiri'nin evinden farklı olduğunu belirtmiştir {cite:nafh-tib-maqqari, s. 327}. İbn Hayyan ve diğerleri şöyle demiştir: O, hadis, fıkıh ve münazara adamıydı ve mantık ile felsefe üzerine birçok kitap yazdı. Bir Şafii âlimdi, kendi öğretisine karşı fahhikatlara meydan okuyan ancak sonrasında bu okul hakkında kitaplar yazan ve ölümüne kadar kuran bir alim oldu. Hukukçular ve en uzak krallar onu eleştirdi. Said, tarihinde şöyle der: İbn Hazm, Endülüs halkı arasında en bilgili ve en bilgili olanıydı. Oğlu El-Fadl, babasının el yazısıyla eserlerinin yaklaşık dört yüz cildini derlediğini anlattı. El-Gazali şöyle dedi: Allah'ın İsimleri'nde, onun büyük ezberlemesini ve zihninin akışını gösteren Ebu Muhammed bin Hazm'ın bir kitabını buldum; 384 Hicri yılının Ramazan ayının son günü olan Çarşamba gecesi Cordoba'da, Minyat al-Mughira banliyösünde doğdu ve 456 Hicri yılında Şaban'da iki gece kalarak Mint Lashim köyünde Pazar akşamı çölde öldü {atıf:nafh-tib-maqqari, s. 80-81}. İslami Ansiklopedi, onu Endülüslü bir şair, tarihçi, hukukçu, filozof ve ilahiyatçı olarak tanımlar; Emevi Halifeliği'nin çalkantılı son yıllarında Cordoba'yı ziyaret etmiş ve ardından öğretim, yazma ve öğretmeye kendini adamıştır."
  id: "Pengapal Abu Muhammad Ali ibn Ahmad ibn Hazm al-Andalusi, Imam mazhab Zahiri dan penulis Tawq al-Hamama serta Fasl fi al-Milal wa al-Ahwa' wal-Nihal; disebutkan dalam Nafh al-Tib bahwa seorang tokoh sastra menulis kepadanya, dan Ibn Hazm membalas serta membacakan di dalamnya tentang imajinasi jalannya {cite:nafh-tib-maqqari}. Ibn Ghalib menyebutkan bahwa Banu Hazm memiliki rumah yang berbeda dari rumah Abu Muhammad ibn Hazm al-Hafiz al-Zahiri, yang berasal dari Persia {cite:nafh-tib-maqqari, hlm. 327}. Ibn Hayyan dan lainnya berkata: Ia adalah seorang ahli hadis, yurisprudensi, dan debat, serta menulis banyak buku tentang logika dan filsafat. Ia adalah ulama Shafi'i yang menantang para ahli hukum menentang doktrinnya, namun kemudian menjadi seorang ulama yang tampak nyata, menulis buku-buku tentang aliran ini dan mendirikannya hingga wafat. Para ahli hukum dan raja-raja terjauh mengkritiknya. Sa'id berkata dalam sejarahnya: Ibn Hazm adalah yang paling berpengetahuan dan berpengetahuan di antara semua orang al-Andalus. Putranya Al-Fadl mengatakan bahwa ia mengumpulkan sekitar empat ratus jilid karya ayahnya dengan tulisan tangan ayahnya. Al-Ghazali berkata: Saya menemukan dalam Nama-nama Allah sebuah kitab karya Abu Muhammad ibn Hazm yang menunjukkan hafalan besar dan aliran pikirannya; ia lahir di Cordoba, di pinggiran Minyat al-Mughira, pada malam terakhir Rabu, hari terakhir Ramadan tahun 384 H, dan ia meninggal di gurun di desa Mint Lashim pada Minggu malam, dua malam tersisa di Sha'ban pada tahun 456 H. {cite:nafh-tib-maqqari, hlm. 80-81}. Ensiklopedia Islam menggambarkannya sebagai seorang penyair, sejarawan, ahli hukum, filsuf, dan teolog Andalusia, yang mengunjungi Cordoba selama tahun-tahun terakhir yang penuh gejolak di masa Kekhalifahan Umayyah dan kemudian mendedikasikan dirinya untuk mengajar, menulis, dan mengajar."
