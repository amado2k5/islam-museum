label: { ar: "أبو محمد ابن حزم الأندلسي" }
summary:
  ar: "الحافظ أبو محمد علي بن أحمد بن حزم الأندلسي، إمام الظاهرية وصاحب طوق الحمامة والفصل في الملل والأهواء والنحل؛ ورد في نفح الطيب أن أديباً كتب إليه فأجابه ابن حزم وأنشد فيه يصف خيالاً طرقه {cite:nafh-tib-maqqari}. وذكر ابن غالب أن بني حزم بيت غير البيت الذي منه أبو محمد بن حزم الحافظ الظاهري وهو فارسي الأصل {cite:nafh-tib-maqqari p. 327}. وقال ابن حيان وغيره: كان صاحب حديث وفقه وجدل وله كتب كثيرة في المنطق والفلسفة، وكان شافعي المذهب يناضل الفقهاء عن مذهبه ثم صار ظاهرياً فوضع الكتب في هذا المذهب وثبت عليه إلى أن مات، وشنع عليه الفقهاء وأقصاه الملوك، وقال صاعد في تاريخه: كان ابن حزم أجمع أهل الأندلس قاطبة لعلوم الإسلام وأوسعهم معرفة، وأخبره ابنه الفضل أنه اجتمع عنده بخط أبيه من تواليفه نحو أربعمائة مجلد، وقال الغزالي: وجدت في أسماء الله كتاباً لأبي محمد ابن حزم يدل على عظم حفظه وسيلان ذهنه؛ ولد بقرطبة بربض منية المغيرة آخر ليلة الأربعاء آخر يوم من رمضان سنة أربع وثمانين وثلاثمائة وتوفي بالبادية بقرية منت لشم عشية الأحد لليلتين بقيتا من شعبان سنة ست وخمسين وأربعمائة {cite:nafh-tib-maqqari p. 80-81}. وتصفه دائرة المعارف الإسلامية بأنه شاعر ومؤرخ وفقيه وفيلسوف ومتكلم أندلسي، وزر في السنوات المضطربة الأخيرة من الخلافة الأموية في قرطبة ثم تفرغ للدرس والتأليف والتعليم."
  en: "Abu Muhammad Ali b. Ahmad Ibn Hazm, the Zahiri imam of al-Andalus, author of Tawq al-Hamama and al-Fisal {cite:nafh-tib-maqqari}. Born at Cordoba in 384/994 and died at Manta Lisham in 456/1064, he was an Andalusian poet, historian, jurist, philosopher and theologian. He served as vizier in the troubled last years of the Umayyad caliphate of Cordoba, then withdrew to study, writing and teaching. The Encyclopaedia of Islam says he applied the Zahiri method to law, logic, theology and the history of religions."
  ur: "ابو محمد علی بن احمد بن حزم، اندلس کے ظاہری امام، طوق الحمامہ اور الفصل کے مصنف۔ وہ 384ھ/994ء میں قرطبہ میں پیدا ہوئے اور 456ھ/1064ء میں منت لشم میں فوت ہوئے؛ شاعر، مؤرخ، فقیہ، فلسفی اور متکلم تھے۔ اموی خلافت قرطبہ کے آخری پرآشوب برسوں میں وزیر رہے، پھر مطالعے، تصنیف اور تدریس کی طرف لوٹ گئے۔ انسائیکلوپیڈیا آف اسلام کے مطابق انہوں نے ظاہری طریقہ فقہ، منطق، کلام اور ادیان کی تاریخ پر لاگو کیا."
