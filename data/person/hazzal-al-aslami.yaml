summary:
  ar: "هزال بن ذئاب الأسلمي، من بني سلامان بن أسلم، روى عنه ابنه ومحمد بن المنكدر حديثاً واحداً فيما يظن ابن عبد البر، وهو قول النبي: «يا هزال، لو سترته بردائك»، وقيل إن بين ابن المنكدر وهزال نعيم بن هزال {cite:istiab-alam-2002 p. 745}."
  en: "Hazzal ibn Dhi'ab al-Aslami, of Banu Salaman ibn Aslam; his son and Muhammad ibn al-Munkadir narrated from him what Ibn 'Abd al-Barr thinks is his only hadith, the Prophet's words 'O Hazzal, had you covered him with your cloak'; some say Nu'aym ibn Hazzal stands between Ibn al-Munkadir and Hazzal {cite:istiab-alam-2002 p. 745}."
  ur: "ہزال بن ذئاب اسلمی، بنو سلامان بن اسلم سے؛ ان سے ان کے بیٹے اور محمد بن المنکدر نے وہ روایت کی جسے ابن عبد البر ان کی واحد حدیث سمجھتے ہیں، یعنی نبی کا فرمان: «اے ہزال، اگر تم اسے اپنی چادر سے ڈھانپ دیتے»؛ اور کہا گیا کہ ابن المنکدر اور ہزال کے درمیان نعیم بن ہزال ہیں {cite:istiab-alam-2002 p. 745}۔"
  es: "Hazzal ibn Dhi'ab al-Aslami, de Banu Salaman ibn Aslam; su hijo y Muhammad ibn al-Munkadir narraron de él lo que Ibn 'Abd al-Barr piensa que es su único hadiz, las palabras del Profeta 'Oh Hazzal, si lo hubieras cubierto con tu manto'; algunos dicen que Nu'aym ibn Hazzal se encuentra entre Ibn al-Munkadir y Hazzal {cite:istiab-alam-2002 p. 745}."
  fr: "Hazzal ibn Dhi'ab al-Aslami, de Banu Salaman ibn Aslam; son fils et Muhammad ibn al-Munkadir ont rapporté de lui ce qu'Ibn 'Abd al-Barr considère comme son seul hadith, les paroles du Prophète: « Ô Hazzal, si tu l'avais couvert de ton manteau ! »; certains disent que Nu'aym ibn Hazzal se situe entre Ibn al-Munkadir et Hazzal {cite: istiab-alam-2002 p. 745}."
  tr: "Hazal ibn Dhi'ab al-Aslami, Banu Salaman ibn Aslam'dan, oğlu Muhammed ibn al-Munkadir tarafından, Peygamber'in şöyle sözünü anlatmıştır: \"Ey Hazal, onu pelerininle örtseydin.\" Ayrıca İbn al-Munkadir ile Hazal arasında Nu'eym ibn Hazal olduğu da söylenir {cite:istiab-alam-2002, s. 745}."
  id: "Hazal ibn Dhi'ab al-Aslami, dari Banu Salaman ibn Aslam, diceritakan darinya oleh putranya Muhammad ibn al-Munkadir, menurut Ibn Abd al-Barr, pepatah Nabi: \"Wahai Hazal, seandainya kamu menutupi dia dengan jubahmu.\" Juga dikatakan bahwa antara Ibn al-Munkadir dan Hazal terdapat Nu'aym ibn Hazal {cite:istiab-alam-2002, hlm. 745}."
