summary:
  ar: "هزال بن ذئاب الأسلمي، من بني سلامان بن أسلم، روى عنه ابنه ومحمد بن المنكدر حديثاً واحداً فيما يظن ابن عبد البر، وهو قول النبي: «يا هزال، لو سترته بردائك»، وقيل إن بين ابن المنكدر وهزال نعيم بن هزال {cite:istiab-alam-2002 p. 745}."
  en: "Hazzal ibn Dhi'ab al-Aslami, of Banu Salaman ibn Aslam; his son and Muhammad ibn al-Munkadir narrated from him what Ibn 'Abd al-Barr thinks is his only hadith, the Prophet's words 'O Hazzal, had you covered him with your cloak'; some say Nu'aym ibn Hazzal stands between Ibn al-Munkadir and Hazzal {cite:istiab-alam-2002 p. 745}."
  ur: "ہزال بن ذئاب اسلمی، بنو سلامان بن اسلم سے؛ ان سے ان کے بیٹے اور محمد بن المنکدر نے وہ روایت کی جسے ابن عبد البر ان کی واحد حدیث سمجھتے ہیں، یعنی نبی کا فرمان: «اے ہزال، اگر تم اسے اپنی چادر سے ڈھانپ دیتے»؛ اور کہا گیا کہ ابن المنکدر اور ہزال کے درمیان نعیم بن ہزال ہیں {cite:istiab-alam-2002 p. 745}۔"
