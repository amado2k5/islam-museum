summary:
  ar: "أبو الفضل الدوري التاجر، سمع أبا عامر العقدي وروح بن عبادة وأبا داود الطيالسي في خلط كثير، روى عنه ابن صاعد وغيره وهو ثقة صدوق؛ توفي في جمادى الأولى سنة أربع وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 136}."
  en: "Abu'l-Fadl al-Duri the merchant, trustworthy transmitter from Abu 'Amir al-'Aqdi, Ruh ibn 'Ubada and Abu Dawud al-Tayalisi; he died in Jumada I 264 {cite:muntazam-ibn-al-jawzi p. 136}."
  es: "Abu'l-Fadl al-Duri el comerciante, transmisor confiable de Abu 'Amir al-'Aqdi, Ruh ibn 'Ubada y Abu Dawud al-Tayalisi; murió en Jumada I 264 {citar:muntazam-ibn-al-jawzi p. 136}."
  fr: "Abu'l-Fadl al-Duri le marchand, émetteur fiable d'Abu 'Amir al-'Aqdi, Ruh ibn 'Ubada et Abu Dawud al-Tayalisi; il mourut à Joumada I 264 {cite: muntazam-ibn-al-jawzi p. 136}."
  ur: "ابو الفضل الدوری تاجر، ابو امیر العقدی، روح بن عبادہ اور ابو داؤد الطیالسی سے ثقہ ٹرانسمیٹر؛ آپ کی وفات جمادی الثانی 264 میں ہوئی۔ 136}۔"
  tr: "Ebu el-Fadl el-Duri el-Taccer, Ebu Amir el-Uqdi, Ruh ibn Ubadah ve Ebu Davud el-Tayalisi'yi birçok karışık biçimde dinlemiştir. İbn Said ve diğerleri ondan rivayet etmiş, o güvenilir ve güvenilirdi; 264 Hicri yılında Cumada-evval'de ölmüştür {citasyon:Muntazam-ibn-al-Jawzi, s. 136}."
  id: "Abu al-Fadl al-Duri al-Tajjar mendengar Abu Amir al-'Uqdi, Ruh ibn Ubadah, dan Abu Dawud al-Tayalisi dalam berbagai bentuk campuran. Ibn Sa'id dan lainnya menceritakan darinya, dan ia dapat dipercaya dan dapat dipercaya; ia meninggal di Jumada al-Awwal pada tahun 264 H {cite:muntazam-ibn-al-jawzi, hlm. 136}."
