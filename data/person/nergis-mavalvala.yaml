summary:
  ar: "عالمة فيزياء فلكية باكستانية أمريكية، وُلدت في لاهور سنة 1968 ونشأت في كراتشي. تشغل كرسي كورتيس وكاثلين ماربل للفيزياء الفلكية في معهد ماساتشوستس للتكنولوجيا وعمادة كليته للعلوم، واشتُهرت بدورها في أول رصد لموجات الجاذبية ضمن مشروع ليغو وبأعمالها الرائدة في حدود القياس الكمومية. نالت زمالة ماك آرثر سنة 2010."
  en: "Pakistani-American astrophysicist, born in Lahore in 1968 and raised in Karachi. She holds the Curtis and Kathleen Marble chair of astrophysics at MIT and is dean of its School of Science, known for her role in the first observation of gravitational waves with LIGO and for pioneering work on the quantum limits of measurement. She received a MacArthur Fellowship in 2010."
  ur: "پاکستانی نژاد امریکی ماہر فلکی طبیعیات، جو 1968ء میں لاہور میں پیدا ہوئیں اور کراچی میں پلی بڑھیں۔ وہ ایم آئی ٹی میں فلکی طبیعیات کی کرٹس اور کیتھلین ماربل پروفیسر اور اس کے اسکول آف سائنس کی ڈین ہیں، اور LIGO کے ذریعے کشش ثقل کی لہروں کے پہلے مشاہدے میں اپنے کردار اور کوانٹم پیمائش کی حدود پر اہم کام کے لیے جانی جاتی ہیں۔ انہیں 2010ء میں میک آرتھر فیلوشپ ملی۔"
