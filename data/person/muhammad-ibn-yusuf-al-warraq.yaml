summary:
  ar: "مؤرخ وجغرافي أندلسي (904-973)، وُلد في وادي الحجارة ونشأ في القيروان ثم استقر في قرطبة في بلاط الخليفة الحكم الثاني المستنصر، فألف له كتاباً ضخماً في جغرافية إفريقية وتواريخ ملوكها وحروبهم. لم تصل كتبه كاملة، لكن أبا عبيد البكري حفظ في «المسالك والممالك» قطعاً واسعة منها، ويُعد الوراق أول من مزج في الكتابة بين الجغرافيا والتاريخ. ذكر ابن حزم أن أصوله من زناتة البربر."
  en: "Andalusi historian and geographer (904–973/4), born at Guadalajara (Wadi al-Hijara), formed in Kairouan and settled at Cordoba in the service of the caliph al-Hakam II, for whom he wrote a large geography of North Africa and histories of its kingdoms and wars. His works survive only in fragments, extensively preserved in al-Bakri's Book of Roads and Kingdoms, and he is regarded as the first author to fuse geographical description with historical narrative. Ibn Hazm reported that his roots lay in the Berber confederation of the Zenata."
  ur: "اندلسی مورخ اور جغرافیہ دان (904ء–973/4ء)، وادی الحجارہ میں پیدا ہوئے، قیروان میں پرورش پائی اور قرطبہ میں خلیفہ الحکم ثانی کی خدمت میں رہے، جن کے لیے انھوں نے شمالی افریقا کی ایک ضخیم جغرافیہ اور اس کی سلطنتوں کی تواریخ لکھیں۔ ان کی کتابیں مکمل صورت میں نہیں بچیں، البتہ البکری کی «المسالک والممالک» میں ان کے وسیع اقتباسات محفوظ ہیں، اور وہ پہلے مصنف مانے جاتے ہیں جنھوں نے جغرافیائی بیان کو تاریخی روایت سے جوڑا۔ ابن حزم کے مطابق ان کی اصل بربر قبیلۂ زناتہ سے تھی۔"

