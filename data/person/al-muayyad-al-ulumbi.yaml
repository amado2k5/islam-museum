summary:
  ar: "أبو سعيد المؤيد بن محمد بن علي بن محمد الألومبي، الشاعر المشهور؛ ولد بألوس قرية قرب الحديثة ونشأ بدجيل ودخل بغداد فصار جاويشاً في أيام المسترشد بالله ثم نظم الشعر فأكثر منه حتى عُرف به؛ كان من أعيان شعراء عصره كثير الغزل والهجاء ومدح جماعة من رؤساء العراق وانقطع إلى الوزير عون الدين يحيى بن هبيرة، وكان قد لازم خدمة السلطان مسعود بن محمد بن ملكشاه؛ بقي في حبس الإمام إلى خلافة المستنجد ولقيه ابن خلكان سنة خمس وخمسين وقد غُشي بصره من ظلمة المطمورة التي كان فيها محبوساً {cite:wafayat-ayan}."
  en: "Al-Mu'ayyad al-Ulumbi (494–557) — poet of Baghdad; born at Alus near al-Haditha, a javish under al-Mustarshid before turning to verse; attached to the vizier Ibn Hubayra and Sultan Mas'ud b. Malikshah; imprisoned until al-Mustanjid's accession; Ibn Khallikan met him in 555 {cite:wafayat-ayan}."
