summary:
  ar: "شاعر ومؤرخ وناقد كشميري، وُلد باسم عبد الأحد دار في رانغار بتشادورا، يُعد أول شعراء كشمير الثوريين ومؤسس نقدها الأدبي، وصاحب «كشميري زبان اور شاعري» أول تاريخ للغة الكشميرية وشعرها في ثلاثة مجلدات."
  en: "Kashmiri poet, historian and literary critic, born Abdul Ahad Dar at Rangar, Chadoora; regarded as the first revolutionary poet of Kashmiri literature and the founder of its literary criticism, and author of the three-volume Kashmiri Zaban aur Shairi, the first history of the Kashmiri language and its poetry."
  ur: "کشمیری شاعر، مورخ اور ادبی نقاد، پیدائشی نام عبد الاحد ڈار، رنگر چاڈورہ کے رہنے والے؛ کشمیری ادب کے پہلے انقلابی شاعر اور اس کی ادبی تنقید کے بانی سمجھے جاتے ہیں، اور «کشمیری زبان اور شاعری» کے مصنف، جو کشمیری زبان و شاعری کی پہلی تاریخ ہے۔"
