    note: "No source names a school for him, and his Wikidata item carries no religion value; his madrassa schooling and his years teaching Arabic are education, which never counts. What the scholarship gives is a contested later-life reading, preserved here unclassified and FLAGGED for a founder ruling. Prem Nath Bazaz, who knew him, held that after his four-year-old son died — a death he could not attend while posted at Tral — he 'became a skeptic and a rationalist' and was, though he did not confess it even to himself, 'on way to agnosticism', and that he went on to question 'the need of religion, the infallibility of scriptures and the existence of God' (The History of Struggle for Freedom in Kashmir, 1954, pp. 299–300). His Shikwa-i-Iblis put a critique of God's existence in Satan's mouth and orthodox circles talked of a fatwa declaring him an apostate. Trilokinath Raina wrote that he 'courageously preached scientific humanism' and 'remained a Radical Marxist throughout his life' (A History of Kashmiri Literature, 2002, pp. 105–106), and Hafsa Kanjwal that he 'identified as a Marxist' (Colonizing Kashmir, 2023, p. 205). Against the atheist limb of that reading, a 2026 Kashmir Times essay warns that calling him an atheist mistakes his spiritual crisis — his quarrel was never with God but with God's gatekeepers, and his own reply to the orthodox kept a diin whose beloved 'feels delighted in unity, affection and sympathy'. Two-source attestation of unbelief is therefore not clean, and under the doubt rule the value stays unknown."
    sources: [source/wikipedia-abdul-ahad-azad-en, source/wikidata-abdul-ahad-azad, source/bazaz-history-struggle-freedom-kashmir, source/raina-history-kashmiri-literature, source/kanjwal-colonizing-kashmir, source/kashmir-times-azad-river-revolution]
