summary:
  ar: "محمد بن مسافر من كبار الديلم، صاحب قلعة الطرم؛ أصهر في الأكراد إلى بعض رؤسائهم فولد له ابنه رستم، وكان له أولاد كثيرون منهم سلار وصعلوك ووهشودان والمرزبان، ومن بيته قامت دولة بني مسافر باذربيجان."
  en: "Muhammad ibn Musafir, a Daylamite magnate and master of al-Tarum castle; he married into the Kurdish chiefs who bore him his son Rustam, and among his many sons were Salar, Sa'luk, Wahsudan and al-Marzuban — from his house rose the Musafirid state in Azerbaijan."
