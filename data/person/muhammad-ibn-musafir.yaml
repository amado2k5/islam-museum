id: person/muhammad-ibn-musafir
class: person
label:
  ar: محمد بن مسافر الطرمي
  en: Muhammad ibn Musafir al-Tarumi
  es: "Muhammad ibn Musafir al-Tarumi"
  fr: "Muhammad ibn Musafir al-Tarumi"
  ur: "محمد بن مسافر الطرومی۔"
summary:
  ar: "محمد بن مسافر من كبار الديلم، صاحب قلعة الطرم؛ أصهر في الأكراد إلى بعض رؤسائهم فولد له ابنه رستم، وكان له أولاد كثيرون منهم سلار وصعلوك ووهشودان والمرزبان، ومن بيته قامت دولة بني مسافر باذربيجان."
  en: "Muhammad ibn Musafir, a Daylamite magnate and master of al-Tarum castle; he married into the Kurdish chiefs who bore him his son Rustam, and among his many sons were Salar, Sa'luk, Wahsudan and al-Marzuban — from his house rose the Musafirid state in Azerbaijan."
  es: "Muhammad ibn Musafir, un magnate daylamita y señor del castillo de al-Tarum, se casó con una jefa kurda que le dio a luz a su hijo Rustam, y entre sus muchos hijos se encontraban Salar, Sa'luk, Wahsudan y al-Marzuban; de su casa surgió el estado musafirí en Azerbaiyán."
  fr: "Muhammad ibn Musafir, un magnat daylamite et maître du château d'al-Tarum; il épousa une cheffe kurde qui lui donna son fils Rustam, et parmi ses nombreux fils figuraient Salar, Sa'luk, Wahsudan et al-Marzuban — de sa lignée naquit l'État musafiride en Azerbaïdjan."
  ur: "محمد بن مسافر، ایک دیلامائٹ عظیم اور الطرم قلعہ کا ماسٹر؛ اس نے کرد سرداروں سے شادی کی جن سے اس کا بیٹا رستم پیدا ہوا، اور اس کے بہت سے بیٹوں میں سالار، سالوک، وحسودان اور المرزوبان شامل تھے - اس کے گھر سے آذربائیجان میں مصفیری ریاست قائم ہوئی۔"
  tr: "Muhammed bin Musafir, Daylamlıların önde gelen figürlerinden biri ve Tarm Kalesi'nin sahibiydi; Kürtler arasında bazı reislerle evlendi ve Rustam adında bir oğlu oldu. Salar, Sa'luk, Vahşudan ve El-Marzban dahil birçok oğlu vardı. Onun ailesinden Azerbaycan'da Banu Musafir devleti kuruldu."
  id: "Muhammad ibn Musafir adalah salah satu tokoh terkemuka Daylamit dan pemilik Benteng Tarm; ia menikah campur di antara orang Kurdi dengan beberapa kepala suku mereka dan memiliki seorang putra bernama Rustam. Ia memiliki banyak putra, termasuk Salar, Sa'luk, Wahshudan, dan Al-Marzban. Dari keluarganya, negara Banu Musafir di Azerbaijan didirikan."
