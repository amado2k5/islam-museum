label: { ar: "خسروشاه الغزنوي" }
names:
  - { value: "خسروشاه ملك غزنة بن بهرام شاه بن مسعود بن إبراهيم بن مسعود بن محمود بن سبكتكين", kind: full }
summary:
  ar: "خسروشاه ملك غزنة بعد أبيه بهرام شاه بن مسعود بن إبراهيم بن محمود بن سبكتكين؛ كان عادلاً سائساً مقرباً للعلماء ودامت مُلكَه تسع سنين وتملك بعده ولده ملكشاه؛ ترجمته في أخبار سنة خمس وخمسين وخمسمائة {cite:shadharat-dhahab p. 655}."
  en: "Khusrawshah, king of Ghazna after his father Bahramshah, of Sabuktigin's line; a just ruler and good shepherd who drew the scholars near; his reign lasted nine years and his son Malikshah succeeded; his notice falls in year 555 {cite:shadharat-dhahab p. 655}."
  es: "Khusrawshah, rey de Ghazna después de su padre Bahramshah, de la línea de Sabuktigin; un gobernante justo y buen pastor que atrajo a los eruditos; su reinado duró nueve años y le sucedió su hijo Malikshah; su mención se remonta al año 555 {cita: shadharat-dhahab p. 655}."
  fr: "Khusrawshah, roi de Ghazna après son père Bahramshah, de la lignée de Sabuktigin; un souverain juste et un bon berger qui attirait les érudits; son règne dura neuf ans et son fils Malikshah lui succéda; sa mention se trouve en l'an 555 {cite: shadharat-dhahab p. 655}."
  ur: "خسروشاہ، اپنے والد بہرام شاہ کے بعد غزنہ کا بادشاہ، سبوکتگین کی نسل سے؛ ایک عادل حکمران اور اچھا چرواہا جس نے علما کو قریب کیا۔ اس کی حکومت نو سال رہی اور اس کا بیٹا ملک شاہ کامیاب ہوا۔ اس کا نوٹس 555 میں آتا ہے 655}۔"
  tr: "Gazni Kralı Khosrow Shah, babası Bahram Şah ibn Mas'ud ibn İbrahim ibn Mahmud ibn Sabaktakin'den sonra; alimlere yakın adil bir siyasetçiydi ve hükümdarlığı dokuz yıl sürdü, ardından oğlu Malikşah geldi; biyografisi 555 yılında Akhbar'da {atıf:shadharat-dhahab, s. 655}."
  id: "Khosrow Shah, Raja Ghazni, setelah ayahnya Bahram Shah ibn Mas'ud ibn Ibrahim ibn Mahmud ibn Sabaktakin; ia adalah seorang politikus yang adil dan dekat dengan para cendekiawan, dan pemerintahannya berlangsung sembilan tahun, diikuti oleh putranya Malikshah; biografinya dalam Akhbar tahun 555 {cite:shadharat-dhahab, hlm. 655}."
