summary:
  ar: "أبو العباس أحمد بن عبد السيد بن شعبان بن محمد بن حائر بن قحطان الإربلي الملقب صلاح الدين؛ كان حجاماً عند الملك المعظم مظفر الدين بن زين الدين صاحب إربل فتغير عليه واعتقله مدة؛ فلما أُفرج عنه خرج قاصداً بلاد الشام سنة ثلاث وستمائة صحبة الملك القاهر بهاء الدين أيوب ابن الملك العادل فاتصل بخدمة الملك المغيث؛ فلما توفي المغيث انتقل إلى الديار المصرية وخدم الملك الكامل فعظمت منزلته عنده ووصل منه إلى صاحب البدارقة؛ وكان ذا فضيلة تامة ومشاركات حسنة {cite:wafayat-ayan}. وفي الشذرات تغير عليه الكامل فاعتقله وكان ذا فضيلة ونظماً حسناً فعمل دوبيتاً وأملاه على بعض القيان فغنت به فلما سئلت قالت للصلاح الإربلي فأطلقه وعادت منزلته أحسن ما كانت، وهو الذي أصلح قضية أخي الكامل الفائز إبراهيم وكتب إليه في ذلك؛ توفي سنة إحدى وثلاثين وستمائة {cite:shadharat-dhahab p. 143-144}."
  en: "Salah al-Din al-Irbili — a cupper at the Begteginid court of Irbil who emigrated to Syria in 603, served the Ayyubids of Karak, then rose under al-Kamil in Egypt to head the courier corps {cite:wafayat-ayan}."
  es: "Salah al-Din al-Irbili — un cuprero de la corte begteginí de Erbil que emigró a Siria en 603, sirvió a los ayubíes de Karak, luego ascendió bajo al-Kamil en Egipto para dirigir el cuerpo de mensajeros {cite:wafayat-ayan}."
  fr: "Salah al-Din al-Irbili — un cuivrier à la cour des Begteginides d'Erbil qui a émigré en Syrie en 603, a servi les Ayyoubides de Karak, puis s'est élevé sous al-Kamil en Égypte pour diriger le corps des courriers {cite:wafayat-ayan}."
  ur: "صلاح الدین العربیلی - اربیل کے بیگتیگینیڈ دربار میں ایک کپپر جو 603 میں شام ہجرت کر گیا، کراک کے ایوبیوں کی خدمت کی، پھر مصر میں الکامل کے تحت کورئیر کور کی سربراہی کے لیے اٹھا۔"
  tr: "Ebu el-Abbas Ahmed ibn Abd al-Sayyid ibn Sha'ban ibn Muhammad ibn Hair ibn Qahtan al-Irbali, lakaplı adı Salah al-Din, büyük Kral Muzaffar al-Din ibn Zeyn al-Din'in berberiydi. Fikrini değiştirdi ve onu bir süre hapse attı. Serbest bırakıldığında, 603 Hicri yılında, fatih Kral Baha'eddin Ayyub, el-Malik el-Adil'in oğlu ile birlikte Şam'a doğru yola çıktı ve Kral el-Mughit hizmetine katıldı. Al-Mughit öldükten sonra Mısır'a taşındı ve kendisiyle yüksek statü sahibi olan Kral el-Kamil'e hizmet etti; ondan el-Badariqa'nın yoldaşına ulaştı. Tam erdem ve iyi katkılara sahipti {atıf:wafayat-ayan}. Al-Shadharat'ta Al-Kamil fikrini değiştirdi ve onu tutukladı. O erdemli ve iyi bir şekilde dağılıyordu. Dubita yaptı ve ona bazı dizeler dikte etti, o da bunun hakkında şarkı söyledi. Sorulduğunda, Al-Salah al-Irbali'ye söyledi, o da onu serbest bıraktı ve statüsü eski haline döndü. Kazanan İbrahim kardeşim Al-Kamil'in davasını uzlaştıran ve ona yazan oydu; 631 Hicri yılında öldü {cite:shadharat-dhahab, s. 143-144}."
  id: "Abu al-Abbas Ahmad ibn Abd al-Sayyid ibn Sha'ban ibn Muhammad ibn Ha'ir ibn Qahtan al-Irbali, yang dijuluki Salah al-Din, adalah seorang tukang cukur di bawah Raja besar Muzaffar al-Din ibn Zayn al-Din, penguasa Erbil. Ia berubah pikiran dan memenjarakannya untuk sementara waktu. Setelah dibebaskan, ia berangkat ke Levant pada tahun 603 H bersama Raja penakluk Baha' al-Din Ayyub, putra al-Malik al-Adil, dan bergabung dalam pelayanan Raja al-Mughith. Setelah al-Mughith wafat, ia pindah ke Mesir dan melayani Raja al-Kamil, yang statusnya tinggi bersamanya, dan dari sana ia bertemu dengan sahabat al-Badariqa. Ia memiliki kebajikan penuh dan kontribusi baik {cite:wafayat-ayan}. Di Al-Shadharat, Al-Kamil berubah pikiran dan menangkapnya. Ia berbudi luhur dan terkendali dengan baik. Ia melakukan dubita dan mendiktekan beberapa bait untuknya, dan dia menyanyikannya. Ketika ditanya, dia memberitahu Al-Salah al-Irbali, yang membebaskannya, dan statusnya kembali ke keadaan semula. Dialah yang mendamaikan kasus saudara saya Al-Kamil, Ibrahim yang menang, dan menulis surat kepadanya tentang hal itu; dia meninggal pada tahun 631 H {cite:shadharat-dhahab, hlm. 143-144}."
