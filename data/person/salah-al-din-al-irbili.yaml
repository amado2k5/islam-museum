summary:
  ar: "أبو العباس أحمد بن عبد السيد بن شعبان بن محمد بن حائر بن قحطان الإربلي الملقب صلاح الدين؛ كان حجاماً عند الملك المعظم مظفر الدين بن زين الدين صاحب إربل فتغير عليه واعتقله مدة؛ فلما أُفرج عنه خرج قاصداً بلاد الشام سنة ثلاث وستمائة صحبة الملك القاهر بهاء الدين أيوب ابن الملك العادل فاتصل بخدمة الملك المغيث؛ فلما توفي المغيث انتقل إلى الديار المصرية وخدم الملك الكامل فعظمت منزلته عنده ووصل منه إلى صاحب البدارقة؛ وكان ذا فضيلة تامة ومشاركات حسنة {cite:wafayat-ayan}."
  en: "Salah al-Din al-Irbili — a cupper at the Begteginid court of Irbil who emigrated to Syria in 603, served the Ayyubids of Karak, then rose under al-Kamil in Egypt to head the courier corps {cite:wafayat-ayan}."
