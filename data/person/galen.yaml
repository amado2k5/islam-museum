summary:
  ar: "طبيب قديم يسميه ابن سينا في «القانون» «فاضل الأطباء» وينقل عنه في أشكال الرأس وفي حسّ الأسنان {cite:canon-ibn-sina-print-v1 p.44} {cite:canon-ibn-sina-print-v1 p.47}. وهو غير جالينوس قائد الفرات في سجل [[person/jalinus|جالينوس]] الذي ورد عند المسعودي."
  en: "An ancient physician whom Ibn Sina in the Canon calls the most excellent of physicians, and whom he cites on the shapes of the head and on the sensation of the teeth {cite:canon-ibn-sina-print-v1 p.44} {cite:canon-ibn-sina-print-v1 p.47}. He is not the Jalinus of the Euphrates battle recorded in the separate record [[person/jalinus|Jalinus]], which comes from al-Mas'udi."
  es: "Un médico antiguo a quien Ibn Sina llama en el Canon el más excelente de los médicos, y a quien cita sobre las formas de la cabeza y la sensación de los dientes {cite:canon-ibn-sina-print-v1 p.44} {cite:canon-ibn-sina-print-v1 p.47}. No es el Jalinus de la batalla del Éufrates registrado en el registro aparte [[person/jalinus|Jalinus]], que proviene de al-Mas'udi."
  fr: "Un médecin de l'Antiquité qu'Ibn Sina, dans le Canon, qualifie d'excellent médecin et qu'il cite à propos de la forme de la tête et de la sensation des dents {cite:canon-ibn-sina-print-v1 p.44} {cite:canon-ibn-sina-print-v1 p.47}. Il ne s'agit pas du Jalinus de la bataille de l'Euphrate mentionné dans le récit séparé [[person/jalinus|Jalinus]], qui provient d'al-Mas'udi."
