id: person/kamal-al-din-ibn-al-sharishi
class: person
label: { ar: "كمال الدين ابن الشريشي", en: "Kamal al-Din Ibn al-Sharishi", ur: "کمال الدین ابن الشریشی", es: "Kamal al-Din Ibn al-Sharishi", fr: "Kamal al-Din Ibn al-Sharishi" }
summary:
  ar: "عالم دمشقي كان شيخ دار الحديث وشيخ الرباط الناصري، ولد سنة 653هـ وتوفي في شوال سنة 718هـ متوجهاً إلى الحج؛ تولى نظارة الجامع الأموي مدة يسيرة سنة 703هـ، وعيّن للمدرسة الشامية البرانية ودار الحديث بإشارة ابن تيمية، ثم ألف رداً على كتابه «درء تعارض العقل والنقل» أجاب عنه ابن تيمية في نحو مجلد."
  en: "A Damascene scholar, shaykh of the Dar al-Hadith and of the Ribat al-Nasiri, born in 653 and died in Shawwal 718 AH on his way to the pilgrimage. He was briefly superintendent of the Umayyad Mosque in 703 AH, was appointed to the Shamiyya Barraniyya and the Dar al-Hadith on Ibn Taymiyya's advice, and later wrote objections to Ibn Taymiyya's Dar' Ta'arud al-'Aql wa'l-Naql, which Ibn Taymiyya answered in about a volume."
  es: "Erudito damasceno, jeque de Dar al-Hadith y de Ribat al-Nasiri, nacido en 653 y muerto en Shawwal en 718 d.H. de camino a la peregrinación. Fue brevemente superintendente de la Mezquita Omeya en 703 AH, fue designado para Shamiyya Barraniyya y Dar al-Hadith por consejo de Ibn Taymiyya, y más tarde escribió objeciones al Dar' Ta'arud al-'Aql wa'l-Naql de Ibn Taymiyya, a las que Ibn Taymiyya respondió en aproximadamente un volumen."
  fr: "Savant damascène, cheikh du Dar al-Hadith et du Ribat al-Nasiri, né en 653 et mort à Shawwal 718 AH alors qu'il se rendait au pèlerinage. Il fut brièvement surintendant de la mosquée des Omeyyades en 703 AH, fut nommé à la Shamiyya Barraniyya et au Dar al-Hadith sur les conseils d'Ibn Taymiyya, et écrivit plus tard des objections au Dar 'Ta'arud al-'Aql wa'l-Naql d'Ibn Taymiyya, auxquelles Ibn Taymiyya répondit dans environ un volume."
  ur: "دمشقی عالم، دارالحدیث اور رباط النصیری کے شیخ، آپ 653 میں پیدا ہوئے اور شوال 718 ہجری میں زیارت کے لیے جاتے ہوئے انتقال کر گئے۔ وہ 703 ہجری میں مختصر طور پر اموی مسجد کے مہتمم رہے، ابن تیمیہ کے مشورے پر شامیہ برانیہ اور دار الحدیث میں مقرر ہوئے، اور بعد میں ابن تیمیہ کے دارالعلوم والنقل پر اعتراضات لکھے، جس کے بارے میں ایک جلد میں جواب دیا ہے۔"
