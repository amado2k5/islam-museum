summary:
  ar: "عالم دمشقي كان شيخ دار الحديث وشيخ الرباط الناصري، ولد سنة 653هـ وتوفي في شوال سنة 718هـ متوجهاً إلى الحج؛ تولى نظارة الجامع الأموي مدة يسيرة سنة 703هـ، وعيّن للمدرسة الشامية البرانية ودار الحديث بإشارة ابن تيمية، ثم ألف رداً على كتابه «درء تعارض العقل والنقل» أجاب عنه ابن تيمية في نحو مجلد."
  en: "A Damascene scholar, shaykh of the Dar al-Hadith and of the Ribat al-Nasiri, born in 653 and died in Shawwal 718 AH on his way to the pilgrimage. He was briefly superintendent of the Umayyad Mosque in 703 AH, was appointed to the Shamiyya Barraniyya and the Dar al-Hadith on Ibn Taymiyya's advice, and later wrote objections to Ibn Taymiyya's Dar' Ta'arud al-'Aql wa'l-Naql, which Ibn Taymiyya answered in about a volume."
