summary:
  ar: "سياسي من شعب المورو وقائد مسلح سابق، وُلد في كوتاباتو باسم آهود بالاواغ إبراهيم. ترك دراسة الهندسة وانضم إلى الحركة السرية المورية سنة 1968 واتخذ «مراد» اسما حربيا، فتدرج في الجبهة الوطنية لتحرير مورو ثم في الجبهة الإسلامية لتحرير مورو التي يرأسها منذ 2003، وتولى منصب أول رئيس وزراء مؤقت لمنطقة بانجسامورو ذاتية الحكم في مينداناو المسلمة من 2019 إلى 2025."
  en: "Moro politician and former guerrilla commander, born Ahod Balawag Ebrahim at Cotabato. He left his engineering studies to join the Moro underground in 1968 and took 'Murad' as his nom de guerre, rose through the Moro National Liberation Front and then the Moro Islamic Liberation Front, which he has chaired since 2003, and served as the first interim chief minister of the Bangsamoro Autonomous Region in Muslim Mindanao from 2019 to 2025."
  ur: "مورو سیاست دان اور سابق گوریلا کمانڈر، کوٹاباٹو میں احد بلاواگ ابراہیم کے نام سے پیدا ہوئے۔ انھوں نے انجینئرنگ کی تعلیم چھوڑ کر 1968ء میں مورو زیرِ زمین تحریک میں شمولیت اختیار کی اور «مراد» کو اپنا جنگی نام بنایا، مورو نیشنل لبریشن فرنٹ اور پھر مورو اسلامک لبریشن فرنٹ میں ترقی کی، جس کی صدارت وہ 2003ء سے کر رہے ہیں، اور 2019ء سے 2025ء تک بانگسامورو خود مختار علاقے کے پہلے عبوری وزیرِ اعلیٰ رہے۔"
