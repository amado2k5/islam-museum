summary:
  ar: "النجار صاحب المصلى: عمران بن موسى النجار مولى غافق؛ وقيل إن النجار المذكور هو أبو الطيب محمد بن جعفر البغدادي النجار ويعرف بغندر؛ توفي قبل دخول القائد جوهر مصر {cite:wafayat-ayan}."
  en: "Al-Najjar 'Sahib al-Musalla' (d. 358, before Jawhar's conquest of Egypt) — the saint remembered at Cairo's prayer-ground; Ibn Khallikan records two identifications: Imran b. Musa, mawla of Ghafiq, or Abu al-Tayyib Muhammad b. Ja'far 'Ghundur' {cite:wafayat-ayan}."
  fr: "Al-Najjar 'Sahib al-Musalla' (mort en 358, avant la conquête de l'Égypte par Jawhar) - le saint rappelé au sol de prière du Caire ; Ibn Khallikan enregistre deux identifications : Imran b. Musa, mawla de Ghafiq, ou Abu al-Tayyib Muhammad b. Ja'far 'Ghundur' {cite:wafayat-ayan}."
  es: "Al-Najjar 'Sahib al-Musalla' (muerto en 358, antes de la conquista de Egipto por parte de Jawhar), el santo recordado en el lugar de oración de El Cairo; Ibn Khallikan registra dos identificaciones: Imran b. Musa, mawla de Ghafiq, o Abu al-Tayyib Muhammad b. Ja'far 'Ghundur' {cita:wafayat-ayan}."
  ur: "النجر 'صاحب المصلہ' ⁦(متوفی 358، مصر کی جوہر کی فتح سے پہلے)⁩ - قاہرہ کے نماز گاہ میں ولی کو یاد کیا گیا؛ ابن خلیقان نے دو شناختیں درج کی ہیں: عمران ب۔ موسیٰ، مولا غفیق، یا ابو الطیب محمد بن۔ جعفر غندور {حوالہ: وفایت آیان}"
