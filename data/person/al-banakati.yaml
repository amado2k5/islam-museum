summary:
  ar: "مؤرخ فارسي من مدينة بناكت في ما وراء النهر، ألف موجزا عاما في التاريخ سماه بناكتي، وكان يرجع إليه المؤرخون بعده {cite:jami-al-tawarikh-khashshab-1960 p. 153}. ويرى الخشاب أنه أدرج في تاريخه القطعة المنسوبة إلى عبد الله البيضاوي، فإما نقلها كما هي وإما اختصرها، وأن القطعة تتصل بجامع التواريخ {cite:jami-al-tawarikh-khashshab-1960 p. 153}. ومخطوطة كتابه وقعت في مجموعة ريتش التي اشترتها الحكومة البريطانية {cite:jami-al-tawarikh-khashshab-1960 p. 154}."
  en: "A Persian historian from Banakat in Transoxiana who wrote a general history called Banakati, to which later historians often turned {cite:jami-al-tawarikh-khashshab-1960 p. 153}. The editor argues that he included the passage attributed to al-Baydawi, copied or abridged, and that the passage belongs to the Jami' al-Tawarikh {cite:jami-al-tawarikh-khashshab-1960 p. 153}. The manuscript of his book passed through the Rich collection, which the British government bought {cite:jami-al-tawarikh-khashshab-1960 p. 154}."
  es: "Historiador persa de Banakat, en Transoxiana, autor de una historia general llamada Banakati, a la que recurrieron después los historiadores {cite:jami-al-tawarikh-khashshab-1960 p. 153}. El editor sostiene que incluyó el pasaje atribuido a al-Baydawi, copiado o abreviado, y que ese pasaje pertenece al Jami' al-Tawarikh {cite:jami-al-tawarikh-khashshab-1960 p. 153}. El manuscrito de su obra pasó por la colección Rich, que compró el gobierno británico {cite:jami-al-tawarikh-khashshab-1960 p. 154}."
  fr: "Historien persan de Banakat, en Transoxiane, auteur d'une histoire générale appelée Banakati, à laquelle les historiens postérieurs eurent souvent recours {cite:jami-al-tawarikh-khashshab-1960 p. 153}. L'éditeur soutient qu'il a inclus le passage attribué à al-Baydawi, copié ou abrégé, et que ce passage relève du Jami' al-Tawarikh {cite:jami-al-tawarikh-khashshab-1960 p. 153}. Le manuscrit de son livre est passé par la collection Rich, achetée par le gouvernement britannique {cite:jami-al-tawarikh-khashshab-1960 p. 154}."
  ur: "ماوراء النہر کے شہر بناکت کا فارسی مؤرخ، جس نے بناکتی کے نام سے ایک عمومی تاریخ لکھی، جس کی طرف بعد کے مؤرخ رجوع کرتے رہے {cite:jami-al-tawarikh-khashshab-1960 p. 153}۔ مرتب کے مطابق اس نے البیضاوی سے منسوب ٹکڑا نقل یا مختصر کر کے شامل کیا، اور یہ ٹکڑا جامع التواریخ سے متعلق ہے {cite:jami-al-tawarikh-khashshab-1960 p. 153}۔ اس کتاب کا نسخہ ریچ کے مجموعے سے گزرا جسے برطانوی حکومت نے خریدا {cite:jami-al-tawarikh-khashshab-1960 p. 154}۔"
