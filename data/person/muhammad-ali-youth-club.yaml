summary:
  ar: "معلّم ومدرّب وخطيب تحفيزي باكستاني مرتبط بـ«يوث كلوب» في لاهور، تصل قناته على يوتيوب إلى أكثر من مليون مشترك ببيانات ومحاضرات موجهة للشباب بالأردية؛ درس الهندسة الميكانيكية في معهد GIK وعلم النفس التطبيقي، ويدرس العلوم الإسلامية. هو غير الملاكم محمد علي وغير المهندس محمد علي ميرزا."
  en: "Pakistani teacher, trainer and motivational speaker associated with Youth Club in Lahore, whose YouTube channel reaches more than a million subscribers with Urdu reminders and youth lectures. He studied mechanical engineering at the GIK Institute and applied psychology, and is studying Islamic sciences. He is not the boxer Muhammad Ali and not Engineer Muhammad Ali Mirza."
  ur: "لاہور کے «یوتھ کلب» سے وابستہ پاکستانی استاد، ٹرینر اور موٹیویشنل اسپیکر، جن کے یوٹیوب چینل کے سبسکرائبرز دس لاکھ سے زائد ہیں اور جو اردو میں نوجوانوں کے لیے بیانات و لیکچرز پیش کرتے ہیں۔ انہوں نے جی آئی کے انسٹی ٹیوٹ سے مکینیکل انجینئرنگ اور اطلاقی نفسیات کی تعلیم حاصل کی اور اسلامی علوم کی تعلیم جاری رکھے ہوئے ہیں۔ یہ باکسر محمد علی نہیں اور انجینئر محمد علی مرزا بھی نہیں۔"
