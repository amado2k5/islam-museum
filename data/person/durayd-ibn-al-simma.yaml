summary:
  en: "A legendary pre-Islamic knight, tribal champion and poet of Banu Jusham (Hawazin); an old, blind veteran carried in a litter at Hunayn, he vehemently criticized Malik ibn Awf's strategy of bringing women and herds into battle, and was slain at Awtas."
  ar: "فارس هوازن وشاعرها وسيد بني جشم في الجاهلية؛ شيخ كبير كفيف حُمل في هودجه يوم حنين، وأنكر على مالك بن عوف سوق الأموال والنساء قائلاً «وهل يرد المنهزم شيء؟»، وقُتل بأوطاس."
  es: "Un legendario caballero preislámico, campeón tribal y poeta de Banu Jusham (Hawazin); un anciano veterano ciego transportado en una litera en Hunayn, criticó vehementemente la estrategia de Malik ibn Awf de llevar mujeres y rebaños a la batalla, y fue asesinado en Awtas."
  fr: "Chevalier légendaire préislamique, champion tribal et poète des Banu Jusham (Hawazin); un vieux vétéran aveugle transporté dans une litière à Hunayn, il a critiqué avec véhémence la stratégie de Malik ibn Awf consistant à amener des femmes et des troupeaux au combat, et a été tué à Awtas."
  ur: "ایک مشہور زمانہ قبل از اسلام نائٹ، قبائلی چیمپئن اور بنو جشام ⁦(حوازین)⁩ کا شاعر؛ ایک بوڑھا، نابینا تجربہ کار حنین میں ایک کوڑا کرکٹ میں لے گیا، اس نے مالک بن عوف کی عورتوں اور ریوڑ کو جنگ میں لانے کی حکمت عملی پر سخت تنقید کی، اور اسے اوطاس میں قتل کر دیا گیا۔"
  tr: "Hawazin'in şövalyesi, şairi ve İslam öncesi dönemde Banu Jashm'ın ustası; Hunayn gününde çemberinde hamile kalan kör bir yaşlı, Malik ibn Awf'u zenginlik ve kadın pazarı için eleştirerek, \"Ve yenilen adam bir şey geri verir mi?\" ve Utas'ta öldürüldü."
  id: "Ksatria Hawazin, penyairnya, dan guru Banu Jashm pada era pra-Islam; seorang tetua buta yang sedang hamil di lingkarannya pada hari Hunayn, dan mengkritik Malik ibn Awf atas kekayaan dan pasar wanita, dengan berkata, \"Dan apakah orang yang kalah mengembalikan sesuatu?\", dan ia dibunuh di Utas."
