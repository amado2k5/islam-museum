summary:
  en: "A legendary pre-Islamic knight, tribal champion and poet of Banu Jusham (Hawazin); an old, blind veteran carried in a litter at Hunayn, he vehemently criticized Malik ibn Awf's strategy of bringing women and herds into battle, and was slain at Awtas."
