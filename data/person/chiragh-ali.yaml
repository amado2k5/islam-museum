summary:
  ar: "عالم هندي مسلم (1844–1895) من دائرة عليكره، زميل السير سيد أحمد خان وموظف كبير في حكومة نظام حيدر آباد، صاحب «عرض نقدي للجهاد الشائع» (1885) الذي ذهب فيه إلى أن حروب النبي كانت دفاعية كلها، و«الإصلاحات السياسية والقانونية والاجتماعية المقترحة في ظل الحكم الإسلامي» (1883)، ومن أبرز أصوات الحداثة الإسلامية في الهند البريطانية ونقد الحديث عندها."
  en: "Indian Muslim scholar (1844–1895) of the Aligarh circle, a colleague of Sir Sayyid Ahmad Khan and a senior official in the Nizam of Hyderabad's government. His A Critical Exposition of the Popular Jihad (1885) argued that the Prophet's wars were all defensive, and his Proposed Political, Legal and Social Reforms Under Moslem Rule (1883) set out a modernist programme; he is a leading voice of British India's Muslim modernism and of its criticism of hadith."
  ur: "ہندوستانی مسلمان عالم (1844–1895)، علی گڑھ حلقے سے وابستہ، سر سید احمد خان کے رفیق اور نظام حیدر آباد کی حکومت کے اعلیٰ اہلکار؛ ان کی کتاب «اے کرٹیکل ایکسپوزیشن آف دی پاپولر جہاد» (1885) میں استدلال ہے کہ نبی کی تمام جنگیں دفاعی تھیں، اور «مجوزہ سیاسی، قانونی و سماجی اصلاحات» (1883) ان کا جدیدیت پسند پروگرام ہے۔"
