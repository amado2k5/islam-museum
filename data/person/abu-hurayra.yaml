summary:
  ar: "صحابي من قبيلة دوس اليمنية، قدم المدينة في عام غزوة خيبر وعاش بين أهل الصفة، وكان اسمه عبد شمس فغُيّر إلى عبد الله أو عبد الرحمن، وكُني أبا هريرة لهرة صغيرة كانت معه. ولّاه عمر البحرين، وتختلف الروايات في وفاته بين 57 و59هـ. اشتهر بكثرة ما يُروى عنه من الحديث، وتقدّر دائرة المعارف الإسلامية عدد أحاديثه بنحو ثلاثة آلاف وخمسمئة، وتعرض إلى جانب رواية التراث رأيًا أكاديميًا يتشكك في صحة كثير مما نُسب إليه. وتذكر الإصابة في ترجمة كنيته رقم ١٠٧٢٥ أن اسمه واسم أبيه مختلف فيهما؛ روي أنه كان اسمه في الجاهلية عبد شمس بن صخر فسماه النبي عبد الرحمن وكناه أبا هريرة لوجد هرة فحملها في كمه {cite:ibn-hajar-isaba p. 1786}."
  en: "A Companion from the tribe of Daws who reached Medina in the year of the Khaybar expedition and lived among the Ahl al-Suffa. His name Abd Shams was changed to Abd Allah or Abd al-Rahman, and he was called Abu Hurayra after a kitten he kept. Umar appointed him governor of Bahrayn, and reports place his death in 57 to 59 AH. He is noted for the very large number of traditions transmitted from him, estimated by the Encyclopaedia of Islam at 3,500; the tradition's own account of his memory stands beside an academic view that questions the genuineness of much attributed to him. Al-Isaba's kunya entry (no. 10725) records the dispute over his name and his father's: one report has him named Abd Shams ibn Sakhr in the Jahiliyya until the Prophet named him Abd al-Rahman and gave him the kunya Abu Hurayra for the kitten he carried in his sleeve {cite:ibn-hajar-isaba p. 1786}."
  ur: "یمن کے قبیلہ دوس کے صحابی جو غزوۂ خیبر کے سال مدینہ پہنچے اور اہلِ صفہ میں رہے۔ ان کا نام عبد شمس تھا جو عبد اللہ یا عبد الرحمٰن کر دیا گیا، اور ایک بلی کے بچے کی نسبت سے ابو ہریرہ کہلائے۔ عمر نے انہیں بحرین کا گورنر مقرر کیا، اور وفات 57 سے 59ھ کے درمیان بتائی جاتی ہے۔ ان سے کثیر احادیث مروی ہیں، جن کا اندازہ دائرۃ المعارف الاسلامیہ ساڑھے تین ہزار لگاتا ہے؛ روایت کا اپنا بیان ان کے حافظے کے بارے میں ایک علمی رائے کے ساتھ آتا ہے جو ان سے منسوب بہت سی باتوں کی صحت پر سوال اٹھاتی ہے۔ {cite:ibn-sad-tabaqat-bewley}"
