summary:
  ar: "صحابي من قبيلة دوس اليمنية، قدم المدينة في عام غزوة خيبر وعاش بين أهل الصفة، وكان اسمه عبد شمس فغُيّر إلى عبد الله أو عبد الرحمن، وكُني أبا هريرة لهرة صغيرة كانت معه. ولّاه عمر البحرين، وتختلف الروايات في وفاته بين 57 و59هـ. اشتهر بكثرة ما يُروى عنه من الحديث، وتقدّر دائرة المعارف الإسلامية عدد أحاديثه بنحو ثلاثة آلاف وخمسمئة، وتعرض إلى جانب رواية التراث رأيًا أكاديميًا يتشكك في صحة كثير مما نُسب إليه. وتذكر الإصابة في ترجمة كنيته رقم ١٠٧٢٥ أن اسمه واسم أبيه مختلف فيهما؛ روي أنه كان اسمه في الجاهلية عبد شمس بن صخر فسماه النبي عبد الرحمن وكناه أبا هريرة لوجد هرة فحملها في كمه {cite:ibn-hajar-isaba p. 1786}."
  en: "A Companion from the tribe of Daws who reached Medina in the year of the Khaybar expedition and lived among the Ahl al-Suffa. His name Abd Shams was changed to Abd Allah or Abd al-Rahman, and he was called Abu Hurayra after a kitten he kept. Umar appointed him governor of Bahrayn, and reports place his death in 57 to 59 AH. He is noted for the very large number of traditions transmitted from him, estimated by the Encyclopaedia of Islam at 3,500; the tradition's own account of his memory stands beside an academic view that questions the genuineness of much attributed to him. Al-Isaba's kunya entry (no. 10725) records the dispute over his name and his father's: one report has him named Abd Shams ibn Sakhr in the Jahiliyya until the Prophet named him Abd al-Rahman and gave him the kunya Abu Hurayra for the kitten he carried in his sleeve {cite:ibn-hajar-isaba p. 1786}."
  ur: "یمن کے قبیلہ دوس کے صحابی جو غزوۂ خیبر کے سال مدینہ پہنچے اور اہلِ صفہ میں رہے۔ ان کا نام عبد شمس تھا جو عبد اللہ یا عبد الرحمٰن کر دیا گیا، اور ایک بلی کے بچے کی نسبت سے ابو ہریرہ کہلائے۔ عمر نے انہیں بحرین کا گورنر مقرر کیا، اور وفات 57 سے 59ھ کے درمیان بتائی جاتی ہے۔ ان سے کثیر احادیث مروی ہیں، جن کا اندازہ دائرۃ المعارف الاسلامیہ ساڑھے تین ہزار لگاتا ہے؛ روایت کا اپنا بیان ان کے حافظے کے بارے میں ایک علمی رائے کے ساتھ آتا ہے جو ان سے منسوب بہت سی باتوں کی صحت پر سوال اٹھاتی ہے۔ {cite:ibn-sad-tabaqat-bewley}"
  fr: "Compagnon de la tribu de Daws arrivé à Médine l'année de l'expédition de Khaybar, qui vécut parmi les Ahl al-Suffa. Son nom Abd Shams fut changé en Abd Allah ou Abd al-Rahman, et on l'appela Abu Hurayra d'après un chaton qu'il gardait. Umar le nomma gouverneur de Bahrayn, et les récits placent sa mort entre 57 et 59 H. Il est connu pour le très grand nombre de traditions transmises de lui, estimé par l'Encyclopaedia of Islam à 3 500 ; le récit que la tradition donne de sa mémoire se tient à côté d'un point de vue académique qui met en doute l'authenticité d'une grande part de ce qui lui est attribué. La notice de kunya de l'Isaba (n° 10725) consigne le désaccord sur son nom et celui de son père : un récit le nomme Abd Shams ibn Sakhr dans la Jahiliyya jusqu'à ce que le Prophète le nomme Abd al-Rahman et lui donne la kunya Abu Hurayra pour le chaton qu'il portait dans sa manche {cite:ibn-hajar-isaba p. 1786}."
  es: "Un compañero de la tribu de Daws que llegó a Medina en el año de la expedición de Khaybar y vivió entre los Ahl al-Suffa. Su nombre, Abd Shams, fue cambiado a Abd Allah o Abd al-Rahman, y se le conocía como Abu Hurayra por un gatito que cuidaba. Umar lo nombró gobernador de Baréin, y se dice que murió entre los años 57 y 59 de la Hégira. Se le reconoce por la gran cantidad de tradiciones transmitidas a partir de él, estimadas por la Enciclopedia del Islam en 3500; el relato de la tradición sobre su memoria contrasta con la visión académica que cuestiona la autenticidad de gran parte de lo que se le atribuye. La entrada de kunya de Al-Isaba (n.º 10725) registra la disputa sobre su nombre y el de su padre: un informe dice que se llamaba Abd Shams ibn Sakhr en la época Jahiliyya hasta que el Profeta lo llamó Abd al-Rahman y le dio la kunya Abu Hurayra por el gatito que llevaba en la manga {cita:ibn-hajar-isaba p. 1786}."
  tr: "Yemenli Daws kabilesinden, Peygamber Muhammed'in sahabelerinden biri olan bu kişi, Hayber Savaşı sırasında Medine'ye gelmiş ve Süfhe Sahabeleri arasında yaşamıştır. Adı Abd Şems olup, daha sonra Abdullah veya Abd el-Rahman olarak değiştirilmiştir. Yanında taşıdığı küçük bir kedi yavrusu nedeniyle Ebu Hurayra lakabını almıştır. Ömer onu Bahreyn valisi olarak atamıştır. Ölüm tarihi konusunda farklı rivayetler bulunmakta olup, 57 ile 59 Hicri yılları arasında olduğu belirtilmektedir. Kendisinden rivayet edilen çok sayıda hadis ile ünlüdür. İslam Ansiklopedisi, kendisine atfedilen hadis sayısını yaklaşık 3500 olarak tahmin etmektedir. Geleneksel rivayetlerin yanı sıra, kendisine atfedilenlerin çoğunun doğruluğunu sorgulayan akademik bir bakış açısı da sunmaktadır. El-İsabe, lakabıyla ilgili maddesinde (10725 numaralı madde), adının ve babasının adının tartışmalı olduğunu belirtmektedir. Rivayetlere göre, İslam öncesi dönemdeki adı Abd Şems ibn Sakhr idi, fakat Peygamber ona Abd el-Rahman adını verdi ve bir kedi yavrusu bulup kolunda taşıdığı için ona Ebu Hurayra lakabını taktı."
  id: "Seorang sahabat Nabi Muhammad dari suku Daws di Yaman, ia tiba di Madinah selama Perang Khaybar dan hidup di antara para Sahabat Suffah. Namanya adalah Abd Shams, yang kemudian diubah menjadi Abdullah atau Abd al-Rahman. Ia diberi julukan Abu Hurayrah karena seekor anak kucing kecil yang dibawanya. Umar mengangkatnya sebagai gubernur Bahrain. Riwayat mengenai tanggal kematiannya berbeda-beda, menempatkannya antara tahun 57 dan 59 Hijriah. Ia terkenal karena banyaknya hadits yang diriwayatkan darinya. Ensiklopedia Islam memperkirakan jumlah hadits yang dinisbahkan kepadanya sekitar 3.500. Di samping riwayat tradisional, ensiklopedia tersebut menyajikan perspektif akademis yang mempertanyakan keaslian sebagian besar hadits yang dinisbahkan kepadanya. Al-Isabah, dalam entri tentang julukannya (nomor 10725), menyebutkan bahwa nama dan nama ayahnya masih diperdebatkan. Diriwayatkan bahwa namanya di zaman pra-Islam adalah Abd Shams ibn Sakhr, tetapi Nabi memberinya nama Abd al-Rahman dan memberinya julukan Abu Hurayrah karena ia menemukan seekor anak kucing dan membawanya di lengan bajunya."
