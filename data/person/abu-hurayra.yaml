  - tradition: academic
    id: academic
    summary: { en: "Historians and hadith critics note that many reports in his name are later attributions; the sheer volume, produced in about three years of companionship, is treated as a phenomenon of the tradition's growth.", ar: "يشير المؤرخون ونقاد الحديث إلى أن كثيرًا من رواياته إسناد متأخر؛ وحجمه الهائل في ثلاث سنين ظاهرة من نمو التراث." }
