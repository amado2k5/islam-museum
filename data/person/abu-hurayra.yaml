    summary: { en: "Sunni tradition venerates Abu Hurayra as the foremost narrator of hadith: a man who devoted himself to memorizing the Prophet's words, with thousands of reports transmitted through him.", ar: "تُجِلّه السنة أعلى الرواة — رجلًا وهب نفسه لحفظ كلام النبي." }
