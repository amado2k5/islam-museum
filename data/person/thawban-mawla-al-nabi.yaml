summary:
  ar: صحابي مشهور يقال إنه من حكم بن سعد حمير وقيل من السراة؛ اشتراه النبي ثم أعتقه فخدمه إلى أن مات، ثم سكن الرملة ثم حمص وتوفي بها سنة 54هـ.
  en: A well-known Companion said to be of the Hakam ibn Sa'd of Himyar, or from the Sarat; the Prophet bought and freed him, and he served him until his death, then lived in al-Ramla and Homs, where he died in 54 AH.
  ur: "مشہور صحابی، حمیر کے حکم بن سعد سے یا سراة سے کہا جاتا ہے؛ نبی نے خریدا اور آزاد کیا اور وہ خدمت کرتا رہا۔"
  es: "Un conocido Compañero, del que se dice que era del clan Hakam ibn Sa'd de Himyar o de Sarat; el Profeta lo compró y lo liberó, y le sirvió hasta su muerte, luego vivió en al-Ramla y Homs, donde murió en el año 54 de la Hégira."
  fr: "Un Compagnon bien connu, que l'on dit être du Hakam ibn Sa'd de Himyar, ou de Sarat; le Prophète l'acheta et l'affranchit, et il le servit jusqu'à sa mort, puis vécut à al-Ramla et Homs, où il mourut en 54 AH."
  tr: "Ünlü bir yoldaşın Hakam ibn Sa'd Himyar'dan olduğu söylenir ve Sarat kabilesinden olduğu söylenir; Peygamber onu satın aldı, sonra özgürleştirdi ve ölene kadar ona hizmet etti. Daha sonra Ramla'ya, ardından Homs'a yerleşti ve 54 H yılında orada öldü."
  id: "Seorang sahabat terkenal dikatakan berasal dari Hakam ibn Sa'd Himyar, dan dikatakan berasal dari suku Sarat; Nabi membelinya, lalu membebaskannya dan melayaninya hingga ia meninggal. Ia kemudian menetap di Ramla, kemudian Homs, dan meninggal di sana pada tahun 54 H."
