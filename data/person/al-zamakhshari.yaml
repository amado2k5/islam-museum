summary:
  ar: "الإمام الكبير في التفسير والحديث والنحو واللغة وعلم البيان، معتزلي الاعتقاد متظاهراً به حتى كان إذا قصد صاحباً واستأذن قال قل له أبو القاسم المعتزلي بالباب؛ جاور بمكة زماناً فصار يقال له جار الله فكان هذا الاسم علماً عليه، وسقطت رجله فكان يمشي في جفن خشب وكان بيده محضر فيه شهادة خلق كثير خوفاً من أن يظن من يعلم الحال أنها قطعت لريبة، وحكى في تاريخ المتأخرين أنه قال للدامغاني إن سببها دعاء الوالدة لأنه أمسك في صباه عصفوراً ربطه بخيط في رجله ففلت فجذبه فانقطعت رجله في الخيط فقالت والدته قطع الله رجل الأبد كما قطعت رجله؛ توفي سنة ثمان وثلاثين وخمس مئة وله إحدى وسبعون سنة {cite:shadharat-dhahab p. 598-600}."
  en: "Mahmud b. 'Umar al-Zamakhshari, the uncontested imam of tafsir, hadith, grammar and bayan — openly Mu'tazili, announcing himself at doors as 'Abu l-Qasim the Mu'tazili'; 'Jar Allah' for his years at Mecca; he walked on a wooden socket after losing a leg, carrying written attestations so none would think it cut for crime, and told al-Damaghani the cause was his mother's curse over a tethered sparrow {cite:shadharat-dhahab p. 598-600}."
