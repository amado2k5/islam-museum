id: person/al-zamakhshari
education:
  did_you_know:
    ar: "الزمخشري إمام التفسير والنحو والبيان، معتزلي الاعتقاد متظاهراً به حتى كان يقول للمستأذن قل أبو القاسم المعتزلي بالباب؛ جاور بمكة زمناً."
    en: "Al-Zamakhshari, imam of tafsir, grammar and eloquence, bore his Mu'tazili creed openly — he'd tell the doorkeeper 'tell them Abu al-Qasim the Mu'tazili is at the door'; he settled by Mecca a while."
    ur: "زمخشری، تفسیر، نحو اور بیان کے امام، اپنے معتزلی عقیدے کو کھلے عام ظاہر کرتے تھے — دربان سے کہتے «کہو ابوالقاسم معتزلی دروازے پر ہے»؛ وہ کچھ عرصہ مکہ میں مقیم رہے۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/encyclopaedia-of-islam-2]
