id: person/al-zamakhshari
education:
  did_you_know:
    ar: "الزمخشري إمام التفسير والنحو والبيان، معتزلي الاعتقاد متظاهراً به حتى كان يقول للمستأذن قل أبو القاسم المعتزلي بالباب؛ جاور بمكة زمناً."
    en: "Al-Zamakhshari, imam of tafsir, grammar and eloquence, bore his Mu'tazili creed openly — he'd tell the doorkeeper 'tell them Abu al-Qasim the Mu'tazili is at the door'; he settled by Mecca a while."
    ur: "زمخشری، تفسیر، نحو اور بیان کے امام، اپنے معتزلی عقیدے کو کھلے عام ظاہر کرتے تھے — دربان سے کہتے «کہو ابوالقاسم معتزلی دروازے پر ہے»؛ وہ کچھ عرصہ مکہ میں مقیم رہے۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/encyclopaedia-of-islam-2]
class: person
label: { ar: "الزمخشري" }
names:
  - { value: "أبو القاسم محمود بن عمر بن محمد الزمخشري الخوارزمي", kind: full }
gender: male
summary:
  ar: "الإمام الكبير في التفسير والحديث والنحو واللغة وعلم البيان، معتزلي الاعتقاد متظاهراً به حتى كان إذا قصد صاحباً واستأذن قال قل له أبو القاسم المعتزلي بالباب؛ جاور بمكة زماناً فصار يقال له جار الله فكان هذا الاسم علماً عليه، وسقطت رجله فكان يمشي في جفن خشب وكان بيده محضر فيه شهادة خلق كثير خوفاً من أن يظن من يعلم الحال أنها قطعت لريبة، وحكى في تاريخ المتأخرين أنه قال للدامغاني إن سببها دعاء الوالدة لأنه أمسك في صباه عصفوراً ربطه بخيط في رجله ففلت فجذبه فانقطعت رجله في الخيط فقالت والدته قطع الله رجل الأبد كما قطعت رجله؛ توفي سنة ثمان وثلاثين وخمس مئة وله إحدى وسبعون سنة {cite:shadharat-dhahab p. 598-600}."
  en: "Mahmud b. 'Umar al-Zamakhshari, the uncontested imam of tafsir, hadith, grammar and bayan — openly Mu'tazili, announcing himself at doors as 'Abu l-Qasim the Mu'tazili'; 'Jar Allah' for his years at Mecca; he walked on a wooden socket after losing a leg, carrying written attestations so none would think it cut for crime, and told al-Damaghani the cause was his mother's curse over a tethered sparrow {cite:shadharat-dhahab p. 598-600}."
  ur: "محمود بن عمر زمخشری: تفسیر، حدیث، نحو اور علم بیان کے مسلمہ امام — کھلے معتزلی، دروازے پر اپنا تعارف «ابوالقاسم معتزلی» کرواتے؛ مکہ میں برسوں مجاورت کے سبب «جار اللہ» کہلائے؛ ایک ٹانگ بری ہونے کے بعد لکڑی کے موچے پر چلتے اور ساتھ گواہیوں کا محضر رکھتے تاکہ کوئی نہ سمجھے کہ جرم کی سزا میں کاٹی گئی؛ انہوں نے دامغانی کو بتایا کہ اصل سبب ماں کا بددعا کرنا تھا جو بچپن میں ڈور سے باندھی گئی چڑیا کے ٹانگ ٹوٹ جانے پر دی گئی تھی {cite:shadharat-dhahab p. 598-600}۔"
