id: person/al-zamakhshari
education:
  did_you_know:
    ar: "الزمخشري إمام التفسير والنحو والبيان، معتزلي الاعتقاد متظاهراً به حتى كان يقول للمستأذن قل أبو القاسم المعتزلي بالباب؛ جاور بمكة زمناً."
    en: "Al-Zamakhshari, imam of tafsir, grammar and eloquence, bore his Mu'tazili creed openly — he'd tell the doorkeeper 'tell them Abu al-Qasim the Mu'tazili is at the door'; he settled by Mecca a while."
    ur: "زمخشری، تفسیر، نحو اور بیان کے امام، اپنے معتزلی عقیدے کو کھلے عام ظاہر کرتے تھے — دربان سے کہتے «کہو ابوالقاسم معتزلی دروازے پر ہے»؛ وہ کچھ عرصہ مکہ میں مقیم رہے۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/encyclopaedia-of-islam-2]
class: person
label: { ar: "الزمخشري", fr: "al-Zamakhshari" }
names:
  - { value: "أبو القاسم محمود بن عمر بن محمد الزمخشري الخوارزمي", kind: full }
gender: male
summary:
  ar: "الإمام الكبير في التفسير والحديث والنحو واللغة وعلم البيان، معتزلي الاعتقاد متظاهراً به حتى كان إذا قصد صاحباً واستأذن قال قل له أبو القاسم المعتزلي بالباب؛ جاور بمكة زماناً فصار يقال له جار الله فكان هذا الاسم علماً عليه، وسقطت رجله فكان يمشي في جفن خشب وكان بيده محضر فيه شهادة خلق كثير خوفاً من أن يظن من يعلم الحال أنها قطعت لريبة، وحكى في تاريخ المتأخرين أنه قال للدامغاني إن سببها دعاء الوالدة لأنه أمسك في صباه عصفوراً ربطه بخيط في رجله ففلت فجذبه فانقطعت رجله في الخيط فقالت والدته قطع الله رجل الأبد كما قطعت رجله؛ توفي سنة ثمان وثلاثين وخمس مئة وله إحدى وسبعون سنة {cite:shadharat-dhahab p. 598-600}."
  en: "Mahmud b. 'Umar al-Zamakhshari, the uncontested imam of tafsir, hadith, grammar and bayan — openly Mu'tazili, announcing himself at doors as 'Abu l-Qasim the Mu'tazili'; 'Jar Allah' for his years at Mecca; he walked on a wooden socket after losing a leg, carrying written attestations so none would think it cut for crime, and told al-Damaghani the cause was his mother's curse over a tethered sparrow {cite:shadharat-dhahab p. 598-600}."
  fr: "'Umar al-Zamakhshari, l'imam incontesté du tafsir, du hadith, de la grammaire et du bayan - ouvertement Mu'tazili, s'annonçant lui-même aux portes comme 'Abu l-Qasim le Mu'tazili' ; 'Jar Allah' pour ses années à La Mecque ; il a marché sur une prise en bois après avoir perdu une jambe, portant des attestations écrites pour que personne ne pense qu'il coupe pour le crime, et a dit à al-Damaghani la cause était la malédiction de sa mère sur un moineau attaché {cite:shadharat-dhahab p. 598-600}."
  ur: "محمود بن عمر زمخشری: تفسیر، حدیث، نحو اور علم بیان کے مسلمہ امام — کھلے معتزلی، دروازے پر اپنا تعارف «ابوالقاسم معتزلی» کرواتے؛ مکہ میں برسوں مجاورت کے سبب «جار اللہ» کہلائے؛ ایک ٹانگ بری ہونے کے بعد لکڑی کے موچے پر چلتے اور ساتھ گواہیوں کا محضر رکھتے تاکہ کوئی نہ سمجھے کہ جرم کی سزا میں کاٹی گئی؛ انہوں نے دامغانی کو بتایا کہ اصل سبب ماں کا بددعا کرنا تھا جو بچپن میں ڈور سے باندھی گئی چڑیا کے ٹانگ ٹوٹ جانے پر دی گئی تھی {cite:shadharat-dhahab p. 598-600}۔"
  es: "Mahmud b. 'Umar al-Zamakhshari, el imán indiscutible de tafsir, hadiz, gramática y bayan, abiertamente mu'tazili, se anunciaba en las puertas como 'Abu l-Qasim el Mu'tazili'; 'Jar Allah' por sus años en La Meca; caminaba sobre una prótesis de madera después de perder una pierna, llevando consigo testimonios escritos para que nadie pensara que se trataba de un crimen, y le dijo a al-Damaghani que la causa fue la maldición de su madre sobre un gorrión atado {cita: shadharat-dhahab pág. 598-600}."
  tr: "Tefsir, hadis, dilbilgisi, dil ve retorik alanındaki büyük imam olan Mu'tazilciler, izin istediğinde 'Ebu al-Kasim el-Mu'tazili kapıda' derdi, ona şöyle derdi: Bir süre Mekke yakınlarında yaşadı ve Jar Allah olarak adlandırıldı. Bu isim onun bilgisi haline geldi ve bacağı düştü, bu yüzden elinde tahta bir göz kapağıyla yürüyor, birçok ahlaki tanıklık kaydı taşıyordu ve korkuyla durumu bilenler, şüpheden kesildiğini düşünebilirler. Daha sonraki alimlerin tarihinde, el-Damghani'ye sebebinin annesinin duası olduğunu, gençliğinde bacağına ip ile bağladığı bir kuş yakaladığını ve kuşun kayıp onu çekip götürdüğünü ve bacağını iplikle kestiğini söylediği anlatılır. Annesi dedi ki, 'Allah ebedi bacağı kestiğim gibi, ben de bacağını kestim.' 538 Hicri yılında öldü ve yetmiş bir yaşındaydı."
  id: "Imam besar dalam tafsir, hadits, tata bahasa, bahasa, dan retorika, Mu'tazilite, yang berpura-pura memilikinya sampai setiap kali meminta izin, ia berkata, 'Abu al-Qasim al-Mu'tazili di gerbang' akan berkata kepadanya: Ia pernah tinggal dekat Mekah dan dipanggil Jar Allah. Nama ini menjadi pengetahuannya, dan kakinya jatuh, sehingga ia berjalan dengan kelopak mata kayu di tangan, memegang catatan banyak kesaksian moral, takut bahwa mereka yang mengetahui situasinya mungkin mengira nama itu dipotong karena kecurigaan. Dalam sejarah para ulama kemudian diceritakan bahwa ia mengatakan kepada al-Damghani bahwa alasannya adalah doa ibunya karena ia menangkap seekor burung saat muda yang diikat dengan tali di kakinya, dan burung itu tergelincir dan menariknya, sehingga kakinya terpotong oleh benang. Ibunya berkata, 'Semoga Allah memotong kaki abadi seperti aku memotong kakinya.' Ia meninggal pada tahun 538 H dan berusia tujuh puluh satu tahun."
