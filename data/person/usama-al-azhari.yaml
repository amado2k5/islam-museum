summary:
  ar: "عالم مصري، وُلد في الإسكندرية سنة 1976، من خريجي الأزهر وحملة الدكتوراه في الحديث. تتلمذ على علي جمعة وانشغل بالرد على الخطاب المتطرف وبالتصوف السني، وعمل مستشارًا دينيًا للرئاسة قبل تعيينه وزيرًا للأوقاف في يوليو 2024."
  en: "Egyptian scholar, born in Alexandria in 1976, an Al-Azhar graduate with a doctorate in hadith. A student of Ali Gomaa, he built his career refuting extremist discourse and defending Sunni Sufism, and served as religious adviser to the presidency before being appointed minister of endowments (awqaf) in July 2024."
  ur: "مصری عالم، 1976 میں اسکندریہ میں پیدا ہوئے، الازہر کے فارغ اور حدیث میں پی ایچ ڈی۔ علی جمہ کے شاگرد کے طور پر انھوں نے انتہا پسند خطاب کے رد اور سنی تصوف کے دفاع میں اپنا کارنامہ بنایا اور جولائی 2024 میں وزیرِ اوقاف مقرر ہونے سے پہلے صدارت کے مذہبی مشیر رہے۔"
  es: "Erudito egipcio, nacido en Alejandría en 1976, licenciado por la Universidad de Al-Azhar y doctor en hadices. Discípulo de Ali Gomaa, forjó su carrera refutando el discurso extremista y defendiendo el sufismo suní. Fue asesor religioso de la presidencia antes de ser nombrado ministro de Asuntos Religiosos (awqaf) en julio de 2024."
  fr: "Érudit égyptien, né à Alexandrie en 1976, diplômé d'Al-Azhar et docteur en hadith, il fut l'élève d'Ali Gomaa. Il a consacré sa carrière à réfuter les discours extrémistes et à défendre le soufisme sunnite. Il a été conseiller religieux de la présidence avant d'être nommé ministre des dotations (awqaf) en juillet 2024."
