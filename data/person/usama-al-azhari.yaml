  ar: "عالم مصري، وُلد في الإسكندرية سنة 1976، من خريجي الأزهر وحملة الدكتوراه في الحديث. تتلمذ على علي جمعة وانشغل بالرد على الخطاب المتطرف وبالتصوف السني، وعمل مستشارًا دينيًا للرئاسة قبل تعيينه وزيرًا للأوقاف في يوليو 2024."
