summary:
  ar: "قارئ قرآن سعودي وإمام وخطيب المسجد الحرام بمكة. وُلد بالمدينة المنورة في 13 يناير 1976 (11 محرم 1396هـ)، وحفظ القرآن صغيرًا وفاز بالمركز الأول في مسابقة دولية للقرآن بمكة وهو في السادسة عشرة. درس بالجامعة الإسلامية بالمدينة ثم نال الماجستير والدكتوراه في التفسير بجامعة أم القرى، ويؤم صلاة التراويح بالحرم منذ 2005 وعُيّن إمامًا دائمًا سنة 2007."
  en: "Saudi Qur'an reciter and imam and khatib of Masjid al-Haram in Mecca. Born in Medina on 13 January 1976 (11 Muharram 1396 AH), he memorised the Qur'an as a boy and took a tied first place in the international Qur'an competition in Mecca at sixteen. He studied at the Islamic University of Madinah and took a master's and a doctorate in tafsir at Umm al-Qura University; he has led the Tarawih prayers at the Haram since 2005 and was appointed a permanent imam in 2007."
  ur: "سعودی قاریِ قرآن اور مکہ میں مسجد حرام کے امام و خطیب۔ 13 جنوری 1976ء (11 محرم 1396ھ) کو مدینہ منورہ میں پیدا ہوئے، بچپن میں قرآن حفظ کیا اور سولہ برس کی عمر میں مکہ کے بین الاقوامی مقابلۂ قرآن میں مشترکہ اول پوزیشن حاصل کی۔ جامعہ اسلامیہ مدینہ میں تعلیم پائی، پھر جامعہ ام القریٰ سے تفسیر میں ایم اے اور پی ایچ ڈی کی؛ 2005ء سے حرم میں تراویح کی امامت کر رہے ہیں اور 2007ء میں مستقل امام مقرر ہوئے۔"
