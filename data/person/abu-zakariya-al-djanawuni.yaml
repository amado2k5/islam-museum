summary:
  ar: "فقيه إباضي من جبل نفوسة، من أهل إيدناون، عاش على الأرجح في النصف الأول من القرن السادس للهجرة، وترك مؤلفات في الفقه تتعلق بالصيام والنكاح والطلاق والوصايا والأحكام، وأشهرها كتاب النكاح."
  en: "An Ibadi jurist of the Djabal Nafusa, from Idinawun, probably active in the first half of the 6th/12th century. His works on jurisprudence cover fasting, marriage, divorce, testaments and judgments {cite:encyclopaedia-of-islam-2 vol. 1 p. 185}."
  fr: "Juriste ibadite du Djebel Nefoussa, originaire d'Idinawun, probablement actif dans la première moitié du VIe/XIIe siècle. Ses ouvrages juridiques traitent du jeûne, du mariage, du divorce, des testaments et des jugements {cite:encyclopaedia-of-islam-2 vol. 1 p. 185}."
  es: "Un jurista ibadí del Djabal Nafusa, originario de Idinawun, probablemente activo en la primera mitad del siglo VI/XII. Sus obras sobre jurisprudencia abarcan el ayuno, el matrimonio, el divorcio, los testamentos y las sentencias {cite:encyclopaedia-of-islam-2 vol. 1 p. 185}."
  ur: "جبل نفوسہ کا ایک عبادی فقیہ، ادناون سے، غالباً 6ویں/12ویں صدی کے پہلے نصف میں سرگرم تھا۔ فقہ پر ان کے کاموں میں روزے، نکاح، طلاق، وصیت نامے اور فیصلوں کا احاطہ کیا گیا ہے۔ 1 ص۔ 185}۔"
