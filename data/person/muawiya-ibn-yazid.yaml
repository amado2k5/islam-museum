id: person/muawiya-ibn-yazid
class: person
label: { ar: "معاوية بن يزيد بن معاوية" }
summary:
  ar: "أبو عبد الرحمن ويقال أبو يزيد وأبو ليلى، ثالث خلفاء بني أمية، استخلف بعهد أبيه ربيع الأول سنة أربع وستين وكان شاباً صالحاً، ودامت خلافته أربعين يوماً إلى ثلاثة أشهر مريضاً لا يخرج إلى الناس ولا يصلي بهم، وامتنع أن يستخلف قائلاً ما أصبت من حلاوتها فلم أتحمل مرارتها، ومات وله نحو إحدى وعشرين سنة {cite:tarikh-khulafa-minhaj-1434 p. 347}. وعند المسعودي ملك أربعين يوماً وقيل شهرين وكني أبا ليلى وهي كنية المستضعف من العرب، ولما حضرته الوفاة قال لبني أمية والله ما ذقت حلاوة خلافتكم فكيف أتقلد وزرها فقالت أمه ليت أني خرقة حيضة ولم أسمع منك هذا الكلام فقال ليتني يا أماه خرقة حيض ولم أتقلد هذا الأمر، وتنوزع في موته فقيل سقي شربة وقيل مات حتف أنفه وقيل طعن، وقبض وهو ابن اثنتين وعشرين سنة {cite:muruj-al-dhahab p. 70}"
  en: "Third Umayyad caliph, succeeded by his father's testament in Rabi' I 64 — a righteous youth whose forty-day (or three-month) caliphate passed in illness without public appearance; he refused to name a successor, saying 'I tasted none of its sweetness — why should I shoulder its bitterness?', and died about twenty-one {cite:tarikh-khulafa-minhaj-1434 p. 347}."
  es: "Tercer califa omeya, sucedido por testamento de su padre en Rabi' I 64, un joven justo cuyo califato de cuarenta días (o tres meses) transcurrió en enfermedad sin aparición pública; se negó a nombrar un sucesor, diciendo 'No probé nada de su dulzura, ¿por qué debería cargar con su amargura?', y murió alrededor de los veintiún años {cite:tarikh-khulafa-minhaj-1434 p. 347}."
  fr: "Troisième calife omeyyade, remplacé par le testament de son père en Rabi' I 64 — un jeune homme juste dont le califat de quarante jours (ou trois mois) s'est déroulé dans la maladie sans apparition publique; il a refusé de nommer un successeur, disant « Je n'ai goûté aucune de ses douceurs — pourquoi devrais-je en supporter l'amertume ? », et est mort vers vingt et un ans {cite:tarikh-khulafa-minhaj-1434 p. 347}."
  ur: "تیسرا اموی خلیفہ، ربیع الثانی 64 میں اپنے والد کے وصیت سے کامیاب ہوا - ایک صالح نوجوان جس کی چالیس روزہ ⁦(یا تین ماہ)⁩ خلافت علالت کے بغیر بیماری میں گزری۔ اس نے جانشین کا نام لینے سے انکار کرتے ہوئے کہا کہ 'میں نے اس کی کوئی مٹھاس نہیں چکائی - میں اس کی کڑواہٹ کو کیوں برداشت کروں؟'، اور اکیس کے قریب وفات پائی۔ 347}۔"
  tr: "Ebu Abdülrahman, diğer adıyla Ebu Yezid ve Ebu Leyla, Emevi hanedanının üçüncü halifesiydi. Altmış dördüncü yılda babası Rabi'al-Awwal'ın saltanatı sırasında vekil olarak atandı. Doğru bir gençti. Halifeliği kırk günden üç aya kadar sürdü, hastaydı, ne halka çıktı ne de onlarla dua etti. Onu atamayı reddetti ve 'Onun acısına katlanamadım' dedi ve yaklaşık yirmi bir yaşında vefat etti {cite:History-Khulafa-minhaj-1434, s. 347}. El-Mes'udi kırk gün, bazıları iki ay hüküm sürdü ve Araplar arasında ezilenlerin lakabı olan Ebu Leyla lakabını aldı. Ölüm yaklaştığında Banu Umeyye'ye şöyle dedi: Tanrı aşkına, halifeliğinin tatlılığını hiç tatmadım, o halde onun yükünü nasıl taşıyabilirim? Annesi dedi ki, 'Keşke adet bezi olsaydım ve bunu senden duymasaydım.' O dedi ki, 'Keşke anne, bir adet bezi içseydim ve bu konuyu üstlenmeseydim. Söylenir ki, içmesi için bir içki verilmiş, bazıları burnu bıçaklandıktan sonra ölmüş, bazıları ise bıçaklandığını söylemiş. Yirmi iki yaşında vefat etmiş {cite:muruj-al-dhahab, s. 70}"
  id: "Abu Abd al-Rahman, juga dikenal sebagai Abu Yazid dan Abu Layla, adalah khalifah ketiga dari dinasti Umayyah. Ia diangkat sebagai wakil pada masa pemerintahan ayahnya Rabi' al-Awwal pada tahun enam puluh empat. Ia adalah pemuda yang benar. Khalifahnya bertahan selama empat puluh hari hingga tiga bulan, ia sakit, tidak keluar kepada rakyat maupun berdoa bersama mereka. Ia menolak mengangkatnya, dengan berkata, 'Aku belum menanggung kepahitannya,' dan ia meninggal pada usia sekitar dua puluh satu tahun {cite:History-Khulafa-minhaj-1434, hlm. 347}. Al-Mas'udi memerintah selama empat puluh hari, beberapa mengatakan dua bulan, dan dijuluki Abu Layla, yang merupakan julukan orang yang tertindas di antara orang Arab. Ketika kematian mendekat, dia berkata kepada Banu Umayyah: Demi Tuhan, aku belum pernah merasakan manisnya kekhalifahanmu, jadi bagaimana aku bisa menanggung bebannya? Ibunya berkata, 'Aku berharap aku menjadi kain menstruasi dan aku tidak mendengar ini darimu.' Dia berkata, 'Aku berharap aku memiliki, ibu, kain menstruasi dan tidak mengambil perhatian tentang hal ini. Dikatakan bahwa dia diberi minuman untuk diminum, beberapa meninggal setelah hidungnya ditusuk, dan beberapa mengatakan dia ditusuk. Dia meninggal pada usia dua puluh dua {cite:muruj-al-dhahab, hlm. 70}"
