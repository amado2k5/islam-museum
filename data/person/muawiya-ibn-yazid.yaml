id: person/muawiya-ibn-yazid
class: person
label: { ar: "معاوية بن يزيد بن معاوية" }
summary:
  ar: "أبو عبد الرحمن ويقال أبو يزيد وأبو ليلى، ثالث خلفاء بني أمية، استخلف بعهد أبيه ربيع الأول سنة أربع وستين وكان شاباً صالحاً، ودامت خلافته أربعين يوماً إلى ثلاثة أشهر مريضاً لا يخرج إلى الناس ولا يصلي بهم، وامتنع أن يستخلف قائلاً ما أصبت من حلاوتها فلم أتحمل مرارتها، ومات وله نحو إحدى وعشرين سنة {cite:tarikh-khulafa-minhaj-1434 p. 347}.، وعند المسعودي ملك أربعين يوماً وقيل شهرين وكني أبا ليلى وهي كنية المستضعف من العرب، ولما حضرته الوفاة قال لبني أمية والله ما ذقت حلاوة خلافتكم فكيف أتقلد وزرها فقالت أمه ليت أني خرقة حيضة ولم أسمع منك هذا الكلام فقال ليتني يا أماه خرقة حيض ولم أتقلد هذا الأمر، وتنوزع في موته فقيل سقي شربة وقيل مات حتف أنفه وقيل طعن، وقبض وهو ابن اثنتين وعشرين سنة {cite:muruj-al-dhahab p. 70}"
  en: "Third Umayyad caliph, succeeded by his father's testament in Rabi' I 64 — a righteous youth whose forty-day (or three-month) caliphate passed in illness without public appearance; he refused to name a successor, saying 'I tasted none of its sweetness — why should I shoulder its bitterness?', and died about twenty-one {cite:tarikh-khulafa-minhaj-1434 p. 347}."
