summary:
  ar: ابنة عم النبي، أسلمت وهاجرت؛ ويُروى بأسانيد ضعيفة أن نساء من بني زريق عيّرنها بأبيها فغضب النبي وقال إن شفاعته تنال قرابته.
  en: A cousin of the Prophet who embraced Islam and emigrated; reports with weak chains say women of Banu Zurayq taunted her over her father and the Prophet, angered, said that his intercession reaches his kin.
  ur: "نبی کی چچا زاد جو مسلمان ہوئی اور ہجرت کی؛ کمزور سند کی روایات کہتی ہیں کہ بنو زریق کی عورتیں اسے اس کے والد پر طعنہ دیتی تھیں۔"
  es: "Una prima del Profeta que abrazó el Islam y emigró; según relatos con cadenas de transmisión débiles, las mujeres de Banu Zurayq la insultaron por su padre y el Profeta, enfadado, dijo que su intercesión llega a sus parientes."
  fr: "Une cousine du Prophète qui embrassa l'islam et émigra; selon des récits aux chaînes de transmission faibles, des femmes de Banu Zurayq la raillèrent au sujet de son père et le Prophète, irrité, déclara que son intercession atteignait sa famille."
  tr: "Peygamber'in kuzeni İslam'ı benimsedi ve göç etti; zayıf zincirlerle rivayet edilir ki, Banu Zurayq'tan kadınlar onu babasıyla suçladı, bu da Peygamber'i kızdırdı ve onun aracılığının akrabalığına zarar vereceğini söyledi."
  id: "Sepupu Nabi memeluk Islam dan bermigrasi; diceritakan dengan rantai lemah bahwa wanita dari Banu Zurayq menuduhnya tentang ayahnya, yang membuat Nabi marah dan mengatakan bahwa perantaraan Nabi akan merugikan keluarganya."
