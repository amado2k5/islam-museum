summary:
  ar: "الشيخ الأكبر محيي الدين بن العربي، صاحب الفتوحات المكية وفصوص الحكم، من أعظم المتصوفة في الإسلام. وُلد بمرسية ونشأ في إشبيلية، ثم رحل إلى المغرب ومكة والأناضول وبغداد، واستقر أخيراً بدمشق حيث توفي سنة 638هـ ودُفن بسفح قاسيون. وتذكر دائرة المعارف الإسلامية أن له نحو أربعمائة مؤلف، وأن آراءه لقيت نقداً من فقهاء مثل ابن تيمية والسبكي ودفاعاً من آخرين مثل السيوطي والشعراني، وأن كتبه صارت مقررات في المدارس العثمانية. وفي ميزان الاعتدال يورد الذهبي الخلاف في شأنه ويبين رأيه."
  en: "The 'Greatest Shaykh' Muhyi al-Din Ibn al-Arabi, author of the Futuhat al-Makkiyya and the Fusus al-hikam, is counted by the Encyclopaedia of Islam among the greatest Sufis of Islam. Born at Murcia and raised at Seville, he travelled to North Africa, Mecca, Anatolia and Baghdad and settled at Damascus, where he died in 638 AH and was buried on the slope of Qasiyun. The article credits him with some 400 works and reports both fatwas against his ideas, by scholars such as Ibn Taymiyya and al-Subki, and defences by others such as al-Suyuti and al-Sha'rani; his books became textbooks in Ottoman madrasas. Al-Dhahabi records the dispute over him in Mizan al-I'tidal and gives his own view."
  ur: "شیخ اکبر محیی الدین ابن العربی، الفتوحات المکیہ اور فصوص الحکم کے مصنف، اسلامی دائرۃ المعارف کے مطابق اسلام کے عظیم ترین صوفیہ میں سے ہیں۔ وہ مرسیہ میں پیدا ہوئے اور اشبیلیہ میں پلے، پھر شمالی افریقہ، مکہ، اناطولیہ اور بغداد کا سفر کیا اور آخر دمشق میں ٹھہرے جہاں 638ھ میں فوت ہوئے اور قاسیون کے دامن میں دفن ہوئے۔ مقالہ ان کی تقریباً چار سو تصانیف بتاتا ہے اور نقل کرتا ہے کہ ابن تیمیہ اور سبکی جیسے علما نے ان کے خیالات کے خلاف فتوے دیے اور سیوطی اور شعرانی جیسوں نے دفاع کیا؛ ان کی کتابیں عثمانی مدرسوں میں نصاب بنیں۔ ذہبی میزان الاعتدال میں ان کے بارے میں اختلاف نقل کرتے ہیں اور اپنی رائے دیتے ہیں."
