summary:
  ar: "الشيخ الأكبر محيي الدين بن العربي صاحب الفتوحات والفصوص؛ ولد بمرسية سنة ستين وخمسمائة ونشأ بها وانتقل إلى إشبيلية سنة ثمان وسبعين ثم ارتحل وطاف البلدان فطرق الشام والروم والمشرق ودخل بغداد وحدث بها، وإذا أُطلق «الشيخ الأكبر» في عرف القوم فهو المراد؛ تفرق الناس في شأنه شيعاً — ذهبت طائفة إلى أنه زنديق واعتقد آخرون أنه واسطة عقد الأولياء، وقال السيوطي في تنبيه الغبي إن الصوفية تواضعوا على ألفاظ اصطلاحية لا يصح حملها على متعارفها، ووُصفت فتاوى تكفير من أنكره ومن شك في كفر طائفته وقوفاً بين الطرفين، وكتب ابن كمال باشا وابن عبد السلام فيه ما نُقش فوق ضريحه؛ توفي بدمشق في دار القاضي محيي الدين بن الزكي وحمل إلى قاسيون {cite:shadharat-dhahab p. 190-202}؛ ودفن سعد الدين ابنه عنده بسفح قاسيون {cite:nafh-tib-maqqari p. 172-173}."
  en: "The 'Greatest Shaykh' Muhyi al-Din Ibn Arabi (b. Murcia 560, d. 22 Rabi' II 638, Damascus, buried at Qasiyun) — author of the Futuhat and Fusus; the Shadharat dossier records the full controversy, from Ibn Abd al-Salam's first 'lying shaykh of evil' to his later qutb verdict and Ibn Kamal Pasha's tomb-inscribed fatwa {cite:shadharat-dhahab p. 190-202}."
