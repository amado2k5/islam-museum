summary:
  ar: "عالم دين ومربٍّ تتري (1857–1921)، اسمه الحقيقي غالييف. درس في قازان وبخارى، وأسس مدرسة «محمدية» في قازان سنة 1882 فصارت أكبر مدارس الجديد، وحرّر مجلة «الدين والأدب»، ونُفي بتهمة الجامعة الإسلامية، ثم انتُخب سنة 1917 مفتيًا للإدارة الدينية المركزية لمسلمي روسيا، وتوفي في موسكو أثناء عمله في إغاثة المجاعة."
  en: "Tatar theologian and educator (1857–1921), born with the surname Galeyev. Educated in Kazan and Bukhara, in 1882 he founded the Muhammadiya madrasa in Kazan, which became the largest Jadid school in Russia; he edited the journal ad-Din wa-l-adab, was exiled on pan-Islamism charges, and in 1917 was elected mufti of the central spiritual administration of Russia's Muslims, dying at Moscow during famine-relief work."
  ur: "تاتار عالمِ دین اور ماہرِ تعلیم (1857–1921)، ولدیت کا نام غالییف۔ قازان اور بخارا میں تعلیم پائی، 1882 میں قازان میں مدرسہ «محمدیہ» قائم کیا جو روس کا سب سے بڑا جدید مدرسہ بنا؛ مجلہ «الدین و الادب» نکالا، جامعہ اسلامیہ کے الزام میں جلاوطن ہوئے، اور 1917 میں روس کے مسلمانوں کی مرکزی دینی انتظامیہ کے مفتی منتخب ہوئے؛ قحط زدگان کی امداد کے کام کے دوران ماسکو میں وفات پائی۔"
