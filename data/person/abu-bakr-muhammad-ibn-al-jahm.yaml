summary:
  ar: "القاضي أبو بكر محمد بن أحمد بن الجهم، يعرف بابن الوراق المروزي، إمام ثقة فاضل عالم بأصول الفقه، وقاض عادل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} سمع من القاضي إسماعيل وتفقه به، وألّف كتباً جليلة في مذهب مالك، منها كتاب في بيان السنة، وكتاب مسائل الخلاف، وكتاب «الحجة في مذهب مالك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} ونقل الكتاب عن شجرة النور الزكية أنه من علماء المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} وتاريخ وفاته في رأس الترجمة غير واضح في المسح، فلا يُذكر هنا."
  en: "Abu Bakr Muhammad ibn Ahmad ibn al-Jahm, known as Ibn al-Warraq al-Marwazi, was a trusted and excellent imam, learned in the principles of fiqh, and a just judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} He heard from the judge Isma'il and studied fiqh under him, and wrote weighty books in the Maliki school, among them a book on the explanation of the Sunna, a book of disputed questions, and «al-Hujja fi madhhab Malik». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} The Mawsu'a, citing Shajarat al-Nur al-Zakiyya, counts him among the Maliki scholars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} The date of death in the heading is not legible in the scan, so none is stated here."
