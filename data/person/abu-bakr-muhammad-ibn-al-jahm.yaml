summary:
  ar: "القاضي أبو بكر محمد بن أحمد بن الجهم، يعرف بابن الوراق المروزي، إمام ثقة فاضل عالم بأصول الفقه، وقاض عادل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} سمع من القاضي إسماعيل وتفقه به، وألّف كتباً جليلة في مذهب مالك، منها كتاب في بيان السنة، وكتاب مسائل الخلاف، وكتاب «الحجة في مذهب مالك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} ونقل الكتاب عن شجرة النور الزكية أنه من علماء المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} وتاريخ وفاته في رأس الترجمة غير واضح في المسح، فلا يُذكر هنا."
  en: "Abu Bakr Muhammad ibn Ahmad ibn al-Jahm, known as Ibn al-Warraq al-Marwazi, was a trusted and excellent imam, learned in the principles of fiqh, and a just judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} He heard from the judge Isma'il and studied fiqh under him, and wrote weighty books in the Maliki school, among them a book on the explanation of the Sunna, a book of disputed questions, and «al-Hujja fi madhhab Malik». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} The Mawsu'a, citing Shajarat al-Nur al-Zakiyya, counts him among the Maliki scholars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} The date of death in the heading is not legible in the scan, so none is stated here."
  fr: "Abu Bakr Muhammad ibn Ahmad ibn al-Jahm, dit Ibn al-Warraq al-Marwazi, était un imam digne de confiance et excellent, savant en fondements du fiqh, et un juge équitable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} Il entendit le cadi Isma'il et étudia le fiqh auprès de lui, et écrivit des livres importants dans l'école malikite, parmi lesquels un livre sur l'explication de la Sunna, un livre de questions controversées, et «al-Hujja fi madhhab Malik». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} La Mawsu'a, citant la Shajarat al-Nur al-Zakiyya, le compte parmi les savants malikites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} La date de mort de l'en-tête n'est pas lisible dans le scan, aucune n'est donc indiquée ici."
  es: "Abu Bakr Muhammad ibn Ahmad ibn al-Jahm, conocido como Ibn al-Warraq al-Marwazi, fue un imán confiable y excelente, versado en los principios del fiqh y un juez justo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} Escuchaba al juez Isma'il y estudió fiqh con él, y escribió libros importantes en la escuela Maliki, entre ellos un libro sobre la explicación de la Sunna, un libro de cuestiones controvertidas y «al-Hujja fi madhhab Malik». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} El Mawsu'a, citando a Shajarat al-Nur al-Zakiyya, lo cuenta entre los eruditos Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17696} La fecha de muerte en el encabezado no es legible en el escaneo, por lo que no se indica aquí."
  ur: "ابوبکر محمد بن احمد بن الجہم، جسے ابن الوراق المروازی کے نام سے جانا جاتا ہے، ایک قابل بھروسہ اور بہترین امام، اصول فقہ کے ماہر اور عادل جج تھے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17696} انہوں نے قاضی اسماعیل سے سنا اور ان کے ماتحت فقہ کی تعلیم حاصل کی، اور مالکی مکتب میں وزنی کتابیں لکھیں، جن میں سنت کی تفسیر پر مشتمل کتاب، متنازعہ سوالات کی کتاب، اور \"الحجۃ فی مذھب مالکی\" ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17696} موصوفہ نے شجرۃ النور الزکیہ کا حوالہ دیتے ہوئے انہیں مالکی علماء میں شمار کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17696} اسکین میں سرخی میں موت کی تاریخ قابل مطالعہ نہیں ہے، اس لیے یہاں کوئی بیان نہیں کیا گیا ہے۔"
  tr: "İbn el-Varrak el-Mervezi olarak da bilinen Kadı Ebu Bekir Muhammed ibn Ahmed ibn el-Cahm, güvenilir ve erdemli bir imam, fıkıh ilkeleri konusunda uzman bir âlim ve adil bir kadıydı. Kadı İsmail'in yanında eğitim gördü ve onun öğrencisi olarak fıkıhçı oldu. Maliki mezhebi üzerine önemli kitaplar yazdı; bunlar arasında Sünnetin açıklaması, ihtilaf noktaları ve \"Maliki Mezhebinde Tartışma\" adlı kitaplar yer almaktadır. \"Şecarî el-Nur el-Zakiyye\" adlı kitapta Maliki âlimlerinden biri olduğu belirtilmektedir. Biyografinin başında ölüm tarihi belirsiz olduğundan burada belirtilmemiştir."
  id: "Hakim Abu Bakr Muhammad ibn Ahmad ibn al-Jahm, yang dikenal sebagai Ibn al-Warraq al-Marwazi, adalah seorang imam yang terpercaya dan berbudi luhur, seorang ahli prinsip-prinsip fiqih, dan seorang hakim yang adil. Ia belajar di bawah bimbingan Hakim Ismail dan menjadi ahli hukum di bawah bimbingannya. Ia menulis buku-buku penting tentang mazhab Maliki, termasuk sebuah buku tentang penjelasan Sunnah, sebuah buku tentang poin-poin perbedaan pendapat, dan sebuah buku berjudul \"Argumen dalam Mazhab Maliki\". Buku \"Shajarat al-Nur al-Zakiyya\" menyatakan bahwa ia adalah salah satu ulama Maliki. Tanggal kematiannya tidak jelas di awal biografi dan karena itu tidak disebutkan di sini."
