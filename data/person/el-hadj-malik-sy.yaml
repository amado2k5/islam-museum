summary:
  ar: "شيخ تيجاني سنغالي (1855-1922) نشر الطريقة التيجانية في بلاد الولوف وبنى زاويته في تيفاوان (1902) فصارت مركزا للتعليم الإسلامي ومحجا سنويا في المولد (الگامو)، وخلفه ابنه سيدي أبابكر سي خليفة عاما للتيجانيين. ألّف في الدفاع عن التيجانية وفي الفقه والأشعار، منها «كفاية الراغبين» و«خلاص الذهب» في السيرة."
  en: "Senegalese Tijani sheikh (1855–1922) who spread the Tijaniyya order through the Wolof country and built his zawiya at Tivaouane (1902), which became a centre of Islamic education and the destination of the annual Gamou (Mawlid) gathering; his son Seydi Ababacar Sy succeeded him as Caliph-General of the Tijanis. He wrote in defence of the Tijaniyya and on jurisprudence and poetry, among his works Kifayat ar-Raghibin and the rhymed Prophet biography Khilasu ez-Zahab."
  ur: "سینگالی تیجانی شیخ (1855ء–1922ء) جنھوں نے وولوف علاقے میں تیجانی سلسلہ پھیلایا اور تیواوان میں اپنی زاویہ بنائی (1902ء) جو اسلامی تعلیم کا مرکز اور سالانہ گامو (میلاد) اجتماع کی منزل بنی؛ ان کے بیٹے سیدی ابابکر سی تیجانیوں کے خلیفہ عام کے طور پر ان کے جانشین ہوئے۔ انھوں نے تیجانی سلسلے کے دفاع، فقہ اور شاعری پر کتابیں لکھیں، جن میں «کفایۃ الراغبین» اور سیرت پر منظوم «خلاص الذہب» شامل ہیں۔"

