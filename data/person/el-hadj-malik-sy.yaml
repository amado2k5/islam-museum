    basis: documented
    sources: [source/wikipedia-el-hadj-malik-sy-fr, source/wikipedia-el-hadj-malik-sy-en]
    note: "His Tijaniyya sheikhdom is attested by two independent articles: the French article's lead names him 'un érudit de la Tariqa Tijaniyya, une voie soufie orthodoxe qu'il contribua largement à diffuser au Sénégal et en Afrique noire' (a scholar of the Tijaniyya tariqa, an orthodox Sufi path which he contributed greatly to spreading in Senegal and Black Africa); the English article names him 'a religious leader and teacher in the Tijaniyya Sufi... brotherhood', states that in Senegal's Wolof country 'the Tijānī Order was spread primarily by El-Hajj Malick Sy', and records that on his death his son Seydi Ababacar Sy succeeded him as 'khalife général des Tidjanes' (1922–1957) — the succession attests the father's own tenure of the Sy branch's caliphate, the office his son inherited. The segment is recorded as sufi on this attested leadership of the order itself, following the precedent of person/ali-al-mirghani (Khatmiyya headship attested in three articles); his own books include a primer on the Tijaniyya (Faakihatul Tullab) and a defence of it (Ifham al-Munkir). The school is another matter: the French lead names him of 'l'école de jurisprudence Malikite et l'école de théologie Asharite', and the English lead likewise says 'Malikite and Ash'arite' — but the English article's own bibliography states that it derives in part from a translation of the French article, so for the school the two articles are ONE source family, and under the lane's two-source rule no sunni segment is recorded; the attestation is stated here so the reader can judge it. Wikidata's religion statement is Islam generically."

