label: { ar: "الراشد بالله منصور بن المسترشد" }
summary:
  ar: "خليفة عباسي [٥٢٩–٥٣٠هـ]، أبو جعفر منصور بن المسترشد، ولد سنة اثنتين وخمس مئة وأمه أم ولد ويقال إنه ولد مسدوداً ففتح له الأطباء مخرجاً بآلة من ذهب، وخطب له أبوه بولاية العهد سنة ثلاث عشرة وبويع عند قتل أبيه، وكان فصيحاً أديباً شاعراً شجاعاً سمحاً، وخلعه السلطان مسعود بمحضر فقهي سنة ثلاثين فخرج إلى أذربيجان فعاث بمراغة وهمدان وأصبهان وقتله فراشوه العجم سنة اثنتين وثلاثين وقال العماد كان له الحسن اليوسفي والكرم الحاتمي {cite:tarikh-khulafa-minhaj-1434 p. 669-670}."
  en: "Abbasid caliph [529–530], hailed on his father's murder; deposed by Mas'ud's judicial instrument in 530, he ravaged Azerbaijan till his own attendants killed him in 532 — 'Joseph's beauty and Hatim's bounty' {cite:tarikh-khulafa-minhaj-1434 p. 669-670}."
