summary:
  ar: "أبو نصر أحمد بن محمد بن علي بن رستم الكلاباذي الحافظ المتقن؛ كان أحد أئمة الحديث وكان ثقة، وكلاباذ محلة ببخارا؛ قال ابن خلكان إن الحافظ أبا سعد السمعاني أخّر تاريخ مولده عن تاريخ وفاته فصحّفه من جهات عديدة {cite:wafayat-ayan}."
  en: "Abu Nasr Ahmad ibn Muhammad ibn Ali ibn Rustam al-Kalabadhi, the precise hafiz, one of the leading imams of hadith and a trustworthy transmitter. Kalabadh is a quarter of Bukhara. Ibn Khallikan says that the hafiz Abu Sa'd al-Sam'ani put the date of his birth after the date of his death and garbled it in several respects {cite:wafayat-ayan}."
  es: "Abu Nasr Ahmad ibn Muhammad ibn Ali ibn Rustam al-Kalabadhi, el hafiz preciso, uno de los imanes más importantes del hadiz y un transmisor fidedigno. Kalabadh es un barrio de Bujará. Ibn Khallikan dice que el hafiz Abu Sa'd al-Sam'ani puso la fecha de su nacimiento después de la de su muerte y la distorsionó en varios aspectos {cite:wafayat-ayan}."
  fr: "Abu Nasr Ahmad ibn Muhammad ibn Ali ibn Rustam al-Kalabadhi, le hafiz précis, l'un des plus grands imams du hadith et un transmetteur digne de confiance. Kalabadh est un quartier de Boukhara. Ibn Khallikan rapporte que le hafiz Abu Sa'd al-Sam'ani a placé sa date de naissance après celle de son décès et l'a déformée à plusieurs égards {cite:wafayat-ayan}."
