summary:
  ar: "سياسي ورجل دولة سوري (1877–1962) من مؤسسي الجمهورية السورية. شغل وزارة المالية في الحكومات السورية الأولى، وترأس مجلس النواب أربع مرات، ورأس الوزراء مرتين (1944–1945 و1954–1955)، وكان أول مندوب دائم لسوريا لدى الأمم المتحدة، وهو أعلى منصب سياسي بلغه مسيحي سوري."
  en: "Syrian politician and statesman (1877–1962) and a founding father of the Syrian republic. He was finance minister in the first Syrian governments, president of the Chamber of Deputies four times, prime minister twice (1944–1945 and 1954–1955), and Syria's first permanent representative to the United Nations — the highest political office a Syrian Christian has reached."
  ur: "سوری سیاست دان اور ریاستی شخصیت (1877–1962) اور سوری جمہوریہ کے بانیوں میں سے ایک۔ وہ پہلی سوری حکومتوں میں وزیرِ خزانہ رہے، چار مرتبہ ایوانِ نمائندگان کے صدر بنے، دو مرتبہ وزیرِ اعظم رہے (1944–1945 اور 1954–1955)، اور اقوامِ متحدہ میں سوریہ کے پہلے مستقل مندوب تھے — یہ سب سے اعلیٰ سیاسی عہدہ ہے جو کسی سوری مسیحی کو ملا۔"
