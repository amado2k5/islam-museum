id: person/busbuhra-ibn-saluba
class: person
label: { ar: "بصبهرى بن صلوبا" }
summary:
  ar: "عند البلاذري: خرج إلى جرير بن عبد الله البجلي عن أهل بانقيا فاعتذر من القتال وعرض الصلح فصالحه على ألف درهم وطيلسان وكتب له خالد كتاباً ووجّه بالطيلسان إلى أبي بكر فوهبه للحسين بن علي."
  en: "In al-Baladhuri: he came out to Jarir ibn Abdallah al-Bajali for Baniqya's people, excused himself from fighting and offered peace — made on a thousand dirhams and a taylasan; Khalid wrote him a document and sent the taylasan to Abu Bakr who gifted it to al-Husayn ibn Ali."
  es: "En al-Baladhuri: salió a ver a Jarir ibn Abdallah al-Bajali en nombre del pueblo de Baniqya, se excusó de luchar y ofreció la paz, a cambio de mil dirhams y un taylasan; Khalid le escribió un documento y envió el taylasan a Abu Bakr, quien se lo regaló a al-Husayn ibn Ali."
  fr: "Dans al-Baladhuri: il est venu voir Jarir ibn Abdallah al-Bajali pour le peuple de Baniqya, s'est excusé de combattre et a offert la paix — faite sur mille dirhams et un taylasan; Khalid lui a écrit un document et a envoyé le taylasan à Abu Bakr qui l'a offert à al-Husayn ibn Ali."
  ur: "البلادوری میں ہے: وہ جریر بن عبداللہ البجلی کے پاس بنیقیہ کے لوگوں کے لیے آیا، لڑائی سے معذرت کی اور صلح کی پیشکش کی - ایک ہزار درہم اور ایک طیلسان پر؛ خالد نے اسے ایک دستاویز لکھ کر ابوبکر کو بھیجا جس نے اسے حسین ابن علی کو تحفہ میں دیا۔"
