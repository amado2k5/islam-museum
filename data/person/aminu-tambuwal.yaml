summary:
  ar: "محام وسياسي نيجيري وُلد في تامبوال سنة 1966. مثّل دائرة تامبوال/كيبي في مجلس النواب (2003–2015) وترأس المجلس (2011–2015)، ثم حكم ولاية صكتو (2015–2023)، ويشغل منذ 2023 مقعد صكتو الجنوبية في مجلس الشيوخ."
  en: "Nigerian lawyer and politician born in Tambuwal in 1966. He represented Tambuwal/Kebbe in the House of Representatives (2003–2015) and was its Speaker (2011–2015), then governed Sokoto State (2015–2023), and has sat in the Senate for Sokoto South since 2023."
