summary:
  ar: "سلطان المغرب من الأسرة العلوية (حكم 1908–1912)؛ ابن الحسن الأول، كان خليفة بمراكش وعالِمًا وشاعرًا ومؤلفًا، قاد «الحفيظية» ضد أخيه عبد العزيز، ثم وقّع معاهدة فاس 1912 التي قامت بها الحماية الفرنسية وتنازل عن العرش، وقضى سنواته الأخيرة بين طنجة وفرنسا حتى توفي بأنجيان لي بان ودُفن بفاس."
  en: "Sultan of Morocco of the Alawi dynasty (reigned 1908–1912). A son of Hassan I, he was governor of Marrakesh and a scholar, poet and author; he led the Hafidiya against his brother Abdelaziz, then signed the Treaty of Fes in 1912, which established the French protectorate, and abdicated; he spent his last years between Tangier and France, dying at Enghien-les-Bains and being buried at Fez."
  ur: "علوی سلسلے کے سلطانِ مراکش (دورِ حکومت 1908–1912)؛ حسن اول کے صاحبزادے، مراکش کے خلیفہ اور عالم، شاعر و مصنف تھے؛ اپنے بھائی عبد العزیز کے خلاف «حفیظیہ» کی قیادت کی، پھر 1912 میں معاہدۂ فاس پر دستخط کیے جس سے فرانسیسی زیرِ حمایت نظام قائم ہوا اور تخت سے دستبردار ہو گئے؛ آخری سال طنجہ و فرانس میں گزارے اور اینگیاں لے بان میں وفات پا کر فاس میں دفن ہوئے۔"
