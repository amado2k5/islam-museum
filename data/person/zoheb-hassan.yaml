summary:
  ar: "مغنٍّ وكاتب أغاني ومنتج بوب باكستاني (وُلد سنة 1966)، وُلد باسم سيد زوهيب الدين حسن؛ كوّن مع أخته الكبرى نازية ثنائي «نازية وزوهيب» الذي باعت ألبوماته أكثر من 65 مليون أسطوانة حول العالم؛ وبعد وفاتها سنة 2000 ابتعد إلى حد كبير عن الغناء، ثم عاد لاحقًا بأعمال منفردة."
  en: "Pakistani pop singer, songwriter and producer, born in 1966 as Syed Zoheb-u-Din Hassan. With his elder sister Nazia he formed the duo Nazia and Zoheb, whose albums sold over 65 million records worldwide; after her death in 2000 he largely withdrew from singing, and later returned with solo work."
  ur: "پاکستانی پاپ گلوکار، نغمہ نگار اور پروڈیوسر (پیدائش 1966)، اصل نام سید زوہیب الدین حسن؛ اپنی بڑی بہن نازیہ کے ساتھ «نازیہ اور زوہیب» کی جوڑی بنائی جس کے البم دنیا بھر میں ساڑھے چھ کروڑ سے زائد فروخت ہوئے؛ بہن کی 2000 میں وفات کے بعد وہ بڑی حد تک گلوکاری سے کنارہ کش رہے اور بعد میں سولو کام کے ساتھ واپس آئے۔"
