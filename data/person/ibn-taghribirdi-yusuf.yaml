summary:
  ar: "مؤرخ ظاهري حنفي في مصر، صاحب «النجوم الزاهرة». جمال الدين أبو المحاسن يوسف بن الأمير الكبير سيف الدين تغري بردي الجنبي، ولد بالقاهرة سنة اثنتي عشرة وثمانمائة ورباه زوج أخته قاضي القضاة ناصر الدين بن العديم الحنفي ثم جلال الدين البلقيني، وتفقه بشمس الدين محمد الرومي وبالعيني وأخذ النحو عن التقي الشمني وحضر على ابن حجر العسقلاني ولازم مؤرخي عصره كالعيني والمقريزي، وانتهت إليه رياسة التاريخ في عصره، ومن مصنفاته المنهل الصافي والمستوفى بعد الوافي في ست مجلدات ومختصره الذيل الشافي ومورد اللطافة فيمن ولي السلطنة والخلافة والنجوم الزاهرة في ملوك مصر والقاهرة والبشارة في تكملة الإشارة وحلية الصفات في الأسماء والصناعات، توفي في ذي الحجة سنة أربع وسبعين وثمانمائة {cite:shadharat-dhahab p. 317-318}."
  en: "A Mamluk-era Hanafi historian in Egypt, author of al-Nujum al-Zahira — the amir Tughri Birdi's son, raised by his brothers-in-law Ibn al-'Udaym and al-Bulqini, companion of Ibn Hajar, al-'Ayni and al-Maqrizi; author also of the six-volume al-Manhal al-Safi and Mawrid al-Latafa on the succession of kings and caliphs; died Dhu'l-Hijja 874 {cite:shadharat-dhahab p. 317-318}."
