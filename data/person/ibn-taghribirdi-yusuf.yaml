summary:
  ar: "مؤرخ ظاهري حنفي في مصر، صاحب «النجوم الزاهرة». جمال الدين أبو المحاسن يوسف بن الأمير الكبير سيف الدين تغري بردي الجنبي، ولد بالقاهرة سنة اثنتي عشرة وثمانمائة ورباه زوج أخته قاضي القضاة ناصر الدين بن العديم الحنفي ثم جلال الدين البلقيني، وتفقه بشمس الدين محمد الرومي وبالعيني وأخذ النحو عن التقي الشمني وحضر على ابن حجر العسقلاني ولازم مؤرخي عصره كالعيني والمقريزي، وانتهت إليه رياسة التاريخ في عصره، ومن مصنفاته المنهل الصافي والمستوفى بعد الوافي في ست مجلدات ومختصره الذيل الشافي ومورد اللطافة فيمن ولي السلطنة والخلافة والنجوم الزاهرة في ملوك مصر والقاهرة والبشارة في تكملة الإشارة وحلية الصفات في الأسماء والصناعات، توفي في ذي الحجة سنة أربع وسبعين وثمانمائة {cite:shadharat-dhahab p. 317-318}."
  en: "A Mamluk-era Hanafi historian in Egypt, author of al-Nujum al-Zahira — the amir Tughri Birdi's son, raised by his brothers-in-law Ibn al-'Udaym and al-Bulqini, companion of Ibn Hajar, al-'Ayni and al-Maqrizi; author also of the six-volume al-Manhal al-Safi and Mawrid al-Latafa on the succession of kings and caliphs; died Dhu'l-Hijja 874 {cite:shadharat-dhahab p. 317-318}."
  es: "Historiador hanafí de la era mameluca en Egipto, autor de al-Nujum al-Zahira, hijo del emir Tughri Birdi; autor también de los seis volúmenes de al-Manhal al-Safi y Mawrid al-Latafa sobre la sucesión de reyes y califas; murió Dhu'l-Hijjah 874 {cita: shadharat-dhahab p. 317-318}."
  fr: "Historien Hanafi de l'époque mamelouke en Égypte, auteur d'al-Nujum al-Zahira — fils de l'émir Tughri Birdi; auteur également des six volumes al-Manhal al-Safi et Mawrid al-Latafa sur la succession des rois et des califes; mort Dhu'l-Hijjah 874 {cite: shadharat-dhahab p. 317-318}."
  ur: "مصر میں مملوک دور کا ایک حنفی مورخ، النجم الزہرہ کا مصنف - امیر طغری بردی کا بیٹا، جس کی پرورش ان کے بہنوئی ابن العدیم اور البقینی، ابن حجر، العینی اور المقری کے ساتھی؛ بادشاہوں اور خلفاء کی جانشینی پر چھ جلدوں پر مشتمل المنحل الصفی اور مرید الطفا کے مصنف بھی۔ وفات ذی الحجہ 874 317-318}۔"
  tr: "Mısır'da Zahiri Hanefi tarihçisi, 'Al-Nujum Al-Zahira' kitabının yazarı. Cemaleddin Ebu el-Mahasin Yusuf bin el-Emir el-Kabir Seyf-eddin Taghri Bardi el-Janbi, 812 Hicri yılında Kahire'de doğdu ve kız kardeşinin eşi, baş yargıç Nasir al-Din ibn al-Adim al-Hanafi, o zamanlar Celaleddin el-Balqini tarafından büyütüldü. Fıkıh eğitimini Şemseddin Muhammed-el-Rumi ve el-Eyni'den aldı, el-Taqi el-Şemni'den dilbilgisi aldı, İbn Hacer el-Eskelani'den çalıştı ve döneminin tarihçileri olan el-Eyni ve el-Eyni ile el-Eyni'yi yakından takip etti. Maqrizi. Kendi döneminde tarihin liderliğini elinde tuttu. Eserleri arasında altı ciltlik al-Manhal al-Safi ve al-Mustafa Ba'd al-Wafi, özetleri al-Dhayl al-Shafi, Mawrid al-Latafa fi Man Wali al-Sultana wa al-Khilafa, ve al-Nujum al-Zahira fi Muluk Misr wa al-Qahira wa al-Bishara fi Takmilat al-Ishara wa Hilyat al-Sifat fi al-Asma' wa al-San'a'at bulunmaktadır. 874 Hicce yılında öldü {alıntı:Shadharat-Dhahab, s. 317-318}."
  id: "Seorang sejarawan Hanafi Zahiri di Mesir, penulis 'Al-Nujum Al-Zahira'. Jamal al-Din Abu al-Mahasin Yusuf ibn al-Amir al-Kabir Sayf al-Din Taghri Bardi al-Janbi lahir di Kairo pada tahun 812 H dan dibesarkan oleh suami saudara perempuannya, ketua hakim Nasir al-Din ibn al-Adim al-Hanafi, kemudian Jalal al-Din al-Balqini. Ia mempelajari hukum di bawah bimbingan Shams al-Din Muhammad al-Rumi dan al-'Ayni, mempelajari tata bahasa dari al-Taqi al-Shamni, belajar di bawah Ibn Hajar al-Asqalani, dan mengikuti dengan dekat sejarawan zamannya seperti al-Ayni dan al-Maqrizi. Ia memegang kepemimpinan sejarah pada zamannya. Di antara karya-karyanya adalah al-Manhal al-Safi dan al-Mustafa Ba'd al-Wafi dalam enam jilid, ringkasannya al-Dhayl al-Shafi, Mawrid al-Latafa fi Man Wali al-Sultana wa al-Khilafa, dan al-Nujum al-Zahira fi Muluk Misr wa al-Qahira wa al-Bishara fi Takmilat al-Ishara wa Hilyat al-Sifat fi al-Asma' wa al-San'a'at. Ia meninggal pada Dhu al-Hijjah 874 H {cite:Shadharat-Dhahab, hlm. 317-318}."
