summary:
  ar: "روائية ومربية سينغالية ⁦(1929–1981)⁩ كتبت بالفرنسية، من رائدات الأدب الأفريقي النسائي. نالت روايتها «رسالة طويلة جدًا» ⁦(Une si longue lettre)⁩ أول جائزة نوما للنشر في أفريقيا سنة 1980، وتلتها «نشيدة قرمزية»، وجمعت في كتابتها بين نقد أوضاع المرأة والحساسية الاجتماعية."
  en: "Senegalese novelist and educator (1929–1981) writing in French, a pioneer of African women's literature. Her epistolary novel So Long a Letter (Une si longue lettre) won the first Noma Award for Publishing in Africa in 1980, followed by Scarlet Song; her writing joined a critique of women's condition to social sensitivity."
  ur: "سینیگالی ناول نگار اور مربیہ ⁦(1929–1981)⁩ جو فرانسیسی میں لکھتی تھیں اور افریقی خواتین کے ادب کی رائدوں میں شمار ہیں۔ ان کا خطوطی ناول «Une si longue lettre» ⁦(اتنا لمبا خط)⁩ نے 1980 میں افریقہ میں اشاعت کا پہلا نوما ایوارڈ جیتا، جس کے بعد «Scarlet Song» آیا؛ ان کی تحریر میں خواتین کے حالات کی تنقید اور سماجی حساسیت شامل ہے۔"
  es: "Novelista y pedagoga senegalesa (1929-1981), que escribía en francés, fue una pionera de la literatura femenina africana. Su novela epistolar So Long a Letter (Une si longue lettre) ganó el primer Premio Noma de Publicaciones en África en 1980, seguida de Scarlet Song; su obra combinó una crítica de la condición de la mujer con una gran sensibilidad social."
