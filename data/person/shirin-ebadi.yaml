summary:
  ar: "محامية إيرانية وقاضية سابقة ومدافعة عن حقوق الإنسان، وُلدت في همدان سنة 1947، وكانت من أوائل القاضيات في إيران ورأست محكمة مدينة طهران منذ 1975 حتى أقصتها ثورة 1979 عن القضاء، فعملت محامية ودافعت عن المعارضين والأطفال والنساء، وأسست مركز الدفاع عن حقوق الإنسان، ونالت جائزة نوبل للسلام سنة 2003 فكانت أول إيرانية وأول مسلمة تنالها، وتعيش في المنفى في لندن منذ 2009."
  en: "Iranian lawyer, former judge and human rights defender, born in Hamadan in 1947. She was one of Iran's first female judges and presided over the Tehran city court from 1975 until the 1979 revolution removed women from the judiciary; she then practised law, defended dissidents, children and women, founded the Defenders of Human Rights Center, and received the 2003 Nobel Peace Prize — the first Iranian and the first Muslim woman to receive it. She has lived in exile in London since 2009."
  ur: "ایرانی وکیل، سابق جج اور انسانی حقوق کی محافظ، جو 1947 میں ہمدان میں پیدا ہوئیں۔ وہ ایران کی پہلی خاتون ججوں میں سے تھیں اور 1975 سے تہران کی سٹی کورٹ کی صدر رہیں، حتیٰ کہ 1979 کے انقلاب نے خواتین کو عدلیہ سے ہٹا دیا؛ پھر انہوں نے وکالت کی، مخالفین، بچوں اور خواتین کا دفاع کیا، انسانی حقوق کے دفاع کا مرکز قائم کیا، اور 2003 میں نوبل امن انعام پایا — یہ انعام پانے والی پہلی ایرانی اور پہلی مسلم خاتون بنیں۔ وہ 2009 سے لندن میں جلاوطنی کی زندگی گزار رہی ہیں۔"
