summary:
  ar: "أبو علي يحيى بن عيسى بن جزلة الطبيب، من أهل أسبوط بالصعيد الأعلى؛ كان نصرانياً فأسلم وصنّف رسالة في الرد على النصارى وإثبات أن الإسلام هو الدين الحق، وكان سبب إسلامه ملازمته أبا علي بن الوليد حتى هداه الله على يده، وتلمذ لأبي الحسن علي بن رضوان هبة الله بن الحسن وبه اشتغل في الطب؛ وصنّف للإمام المقتدي بأمر الله كتاباً منه تقويم الأبدان وكتاب منهاج البيان فيما يستعمله الإنسان وكتاب الإشارة في تلخيص العبارة ورسالة في مدح الطب وموافقته للشرع {cite:wafayat-ayan}."
  en: "Abu Ali Yahya b. Isa b. Jazla of Asyut — physician who converted from Christianity and wrote a refutation of Christians; student of Ibn Ridwan; authored Taqwim al-Abdan, Minhaj al-Bayan and a defence of medicine for al-Muqtadi {cite:wafayat-ayan}."
