summary:
  ar: "كاتب وصحفي تركي، وُلد سنة 1972. درس العلاقات الدولية والتاريخ في جامعة بوغازيتشي بإسطنبول، وكتب أعمدة في صحف تركية وعالمية، واشتهر عالميًا بكتابه «الإسلام بلا تطرف: حجة مسلمة من أجل الحرية» (2011) الذي دافع فيه عن توافق الإسلام مع الحرية، وبكتابه «يسوع الإسلامي» (2017)، وهو زميل أقدم في معهد كاتو منذ 2018."
  en: "Turkish writer and journalist, born in 1972. He studied international relations and history at Boğaziçi University in Istanbul, wrote columns for Turkish and international newspapers, and became known internationally for Islam without Extremes: A Muslim Case for Liberty (2011) and The Islamic Jesus (2017); he has been a senior fellow at the Cato Institute since 2018."
  ur: "ترک مصنف و صحافی، 1972 میں پیدا ہوئے۔ انھوں نے استنبول کی بوغازیچی یونیورسٹی میں بین الاقوامی تعلقات و تاریخ پڑھی، ترک و عالمی اخبارات میں کالم لکھے، اور اپنی کتاب «اسلام وِد آؤٹ ایکسٹریمز» (2011) اور «دی اسلامک جیسس» (2017) سے عالمی شہرت پائی؛ 2018 سے کیٹو انسٹی ٹیوٹ کے سینئر فیلو ہیں۔"
