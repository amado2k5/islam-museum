summary:
  ar: "سقراط بن سقراطيس من أهل مدينة إثينة مدينة العلماء والحكماء، قيل سقراطيس معناه ماسك الضحة، وكان زاهدا خطيبا حكيما وقتله اليونانيون لأنه خالفهم وخيره معروف وكان الملك الذي تولى قتله أرطخشت، ومن أصحابه أفلاطون، ومن خط إسحاق بن حنين عاش سقراط قريبا مما عاش أفلاطون {cite:fihrist-ibn-al-nadim p. 343}."
  en: "Socrates — the Athenian sage put to death, Plato's master {cite:fihrist-ibn-al-nadim}"
