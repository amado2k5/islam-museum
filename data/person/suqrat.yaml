label: { ar: "سقراط", en: "Suqrat", es: "Suqrat", fr: "Suqrat", ur: "سقراط" }
summary:
  ar: "سقراط بن سقراطيس من أهل مدينة إثينة مدينة العلماء والحكماء، قيل سقراطيس معناه ماسك الضحة، وكان زاهدا خطيبا حكيما وقتله اليونانيون لأنه خالفهم وخيره معروف وكان الملك الذي تولى قتله أرطخشت، ومن أصحابه أفلاطون، ومن خط إسحاق بن حنين عاش سقراط قريبا مما عاش أفلاطون {cite:fihrist-ibn-al-nadim p. 343}."
  en: "Socrates — the Athenian sage put to death, Plato's master {cite:fihrist-ibn-al-nadim}"
  es: "Sócrates, el sabio ateniense ejecutado, maestro de Platón {cite:fihrist-ibn-al-nadim}"
  fr: "Socrate — le sage athénien mis à mort, maître de Platon {cite:fihrist-ibn-al-nadim}"
  ur: "سقراط - ایتھنیائی بابا کو موت کے گھاٹ اتار دیا گیا، افلاطون کا استاد"
  tr: "Sokrates'in oğlu Sokrates, bilginlerin ve bilgelerin şehri olan Atina şehrindendi. Sokrates'in 'gülümsemeyi maskeleyen' anlamına geldiği söylenir. Zihin, hitabetli, bilgeydi ve Yunanlılara karşı çıktığı ve iyi işleriyle tanındığı için öldürüldü. Onu öldüren kral Artakserkses'ti ve yoldaşları arasında Platon da vardı. Sokrates, Hunayn'ın oğlu İshaq'ın soyuna yakın yaşıyordu. Sokrates, Platon'a yakın yaşıyordu. {cite:Fihrist-ibn-al-nadim s. 343}."
  id: "Socrates, putra Socrates, berasal dari kota Athena, kota para sarjana dan orang bijak. Dikatakan bahwa Socrates berarti 'penyembunyikan senyum.' Ia seorang pertapa yang fasih, fasih, bijaksana, dan dibunuh oleh orang Yunani karena menentang mereka dan dikenal atas perbuatan baiknya. Raja yang membunuhnya adalah Artaxerxes, dan di antara teman-temannya adalah Plato. Socrates tinggal dekat garis keturunan Ishaq putra Hunayn. Socrates tinggal dekat dengan Plato. {cite:fihrist-ibn-al-nadim hlm. 343}."
