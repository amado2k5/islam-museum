id: person/al-muqallad-ibn-al-musayyib
class: person
label:
  ar: المقلد بن المسيب العقيلي حسام الدولة
  en: Al-Muqallad ibn al-Musayyib (Husam al-Dawla)
summary:
  ar: "المقلد بن المسيب العقيلي الملقب حسام الدولة؛ استمال الديلم بالموصل وكتب إلى بهاء الدولة يضمنها بألفي ألف درهم كل سنة فتملكها، وجلس له القادر باللّه ولقبه حسام الدولة وقطع له الموصل والكوفة والقصر والجامعين، وملك دقوقا بعدما كانت لنصرانيين، وقبض على أخيه علي وحبسه ثم وقع الصلح بينهما."
  en: "Al-Muqallad ibn al-Musayyib al-Uqayli, titled Husam al-Dawla; he won over the Daylamites at Mosul and wrote to Baha' al-Dawla contracting the city for two million dirhams yearly, took it, and was seated by the caliph al-Qadir who enfeoffed him Mosul, Kufa, al-Qasr and the two congregational towns; he took Daquqa from its two Christian lords, imprisoned his brother Ali then reconciled, and was father of Qirwash and Badran."
