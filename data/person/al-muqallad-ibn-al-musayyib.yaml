label:
  ar: المقلد بن المسيب العقيلي حسام الدولة
  en: Al-Muqallad ibn al-Musayyib (Husam al-Dawla)
  fr: "Al-Muqallad ibn al-Musayyib (Husam al-Dawla)"
  es: "Al-Muqallad ibn al-Musayyib (Husam al-Dawla)"
summary:
  ar: "المقلد بن المسيب العقيلي الملقب حسام الدولة؛ استمال الديلم بالموصل وكتب إلى بهاء الدولة يضمنها بألفي ألف درهم كل سنة فتملكها، وجلس له القادر باللّه ولقبه حسام الدولة وقطع له الموصل والكوفة والقصر والجامعين، وملك دقوقا بعدما كانت لنصرانيين، وقبض على أخيه علي وحبسه ثم وقع الصلح بينهما."
  en: "Al-Muqallad ibn al-Musayyib al-Uqayli, titled Husam al-Dawla; he won over the Daylamites at Mosul and wrote to Baha' al-Dawla contracting the city for two million dirhams yearly, took it, and was seated by the caliph al-Qadir who enfeoffed him Mosul, Kufa, al-Qasr and the two congregational towns; he took Daquqa from its two Christian lords, imprisoned his brother Ali then reconciled, and was father of Qirwash and Badran."
  fr: "Al-Muqallad ibn al-Musayyib al-Uqayli, intitulé Husam al-Dawla ; il a conquis les Daylamites à Mossoul et a écrit à Baha' al-Dawla pour contracter la ville pour deux millions de dirhams par an, et était assis près du calife al-Qadir qui l'entoura de Mossoul, de Koufa, d'al-Qasr et des deux villes de la congrégation ; il prit Daquqa de ses deux seigneurs chrétiens, emprisonna son frère Ali puis se réconcilia, et fut père de Qirwash et Badran."
  es: "Al-Muqallad ibn al-Musayyib al-Uqayli, con el título de Husam al-Dawla, se ganó a los daylamitas en Mosul y escribió a Baha' al-Dawla contratando la ciudad por dos millones de dirhams anuales. La tomó y fue entronizado por el califa al-Qadir, quien le otorgó Mosul, Kufa, al-Qasr y las dos ciudades congregacionales. Tomó Daquqa de sus dos señores cristianos, encarceló a su hermano Ali, luego se reconcilió con él y fue padre de Qirwash y Badran."
