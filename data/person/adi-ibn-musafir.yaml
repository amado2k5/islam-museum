summary:
  ar: "شيخ صوفي أموي النسب من بيت فار قرب بعلبك، أسس طريقة العدوية في لالش قرب الموصل، وكانت أقواله العقدية سنية، وتعظمه الطائفة الكردية، ونُبش قبره وأُحرقت عظامه في القرن التاسع للهجرة."
  en: "A Sufi of Umayyad descent from Bayt Far near Baalbek, who founded the 'Adawiyya order at Laylash near Mosul. His creed is orthodox and he opposed the Mu'tazila; the Kurdish followers venerated his tomb, which was destroyed and its bones burned in 817/1414 {cite:encyclopaedia-of-islam-2 vol. 1 p. 214}."
  fr: "Soufi d'ascendance omeyyade de Bayt Far près de Baalbek, fondateur de la confrérie 'Adawiyya à Laylash près de Mossoul. Son credo est orthodoxe et il s'opposait aux mu'tazilites ; ses disciples kurdes vénéraient son tombeau, détruit en 817 H/1414 ap. J.-C., ses os étant brûlés {cite:encyclopaedia-of-islam-2 vol. 1 p. 214}."
