summary:
  ar: "شيخ صوفي أموي النسب من بيت فار قرب بعلبك، أسس طريقة العدوية في لالش قرب الموصل، وكانت أقواله العقدية سنية، وتعظمه الطائفة الكردية، ونُبش قبره وأُحرقت عظامه في القرن التاسع للهجرة."
  en: "A Sufi of Umayyad descent from Bayt Far near Baalbek, who founded the 'Adawiyya order at Laylash near Mosul. His creed is orthodox and he opposed the Mu'tazila; the Kurdish followers venerated his tomb, which was destroyed and its bones burned in 817/1414 {cite:encyclopaedia-of-islam-2 vol. 1 p. 214}."
  fr: "Soufi d'ascendance omeyyade de Bayt Far près de Baalbek, fondateur de la confrérie 'Adawiyya à Laylash près de Mossoul. Son credo est orthodoxe et il s'opposait aux mu'tazilites ; ses disciples kurdes vénéraient son tombeau, détruit en 817 H/1414 ap. J.-C., ses os étant brûlés {cite:encyclopaedia-of-islam-2 vol. 1 p. 214}."
  es: "Sufí de ascendencia omeya de Bayt Far, cerca de Baalbek, que fundó la orden 'Adawiyya en Laylash, cerca de Mosul. Su credo era ortodoxo y se opuso a los Mu'tazila; los seguidores kurdos veneraban su tumba, que fue destruida y sus huesos quemados en 817/1414 {cite:encyclopaedia-of-islam-2 vol. 1 p. 214}."
  ur: "بعلبیک کے قریب بیت دور سے تعلق رکھنے والا اموی نسل کا ایک صوفی جس نے موصل کے قریب لیلش میں عدویہ کی بنیاد رکھی۔ اس کا عقیدہ راسخ العقیدہ ہے اور اس نے معتزلہ کی مخالفت کی۔ کرد پیروکار اس کے مقبرے کی تعظیم کرتے تھے، جو 817/1414 میں تباہ ہو گئی اور اس کی ہڈیاں جلا دی گئیں۔ 1 ص۔ 214}۔"
  tr: "Baalbek yakınlarındaki Beyt Far'dan Emevi soyundan bir Sufi şeyhi olan bu kişi, Musul yakınlarındaki Laliş'te Adaviyye tarikatını kurmuştur. Doktrinsel açıklamaları Sünni idi ve Kürt mezhebi tarafından saygı görüyordu. Mezarı kazılıp kemikleri Hicri 9. yüzyılda yakılmıştır."
  id: "Seorang syekh Sufi dari garis keturunan Umayyah dari Beit Far dekat Baalbek, ia mendirikan tarekat Adawiyya di Lalish dekat Mosul. Pernyataan doktrinalnya adalah Sunni, dan ia dihormati oleh sekte Kurdi. Makamnya digali dan tulang-tulangnya dibakar pada abad kesembilan Hijriah."
