id: person/kusayla-ibn-lamzam
class: person
label: { ar: "كسيلة بن لمزم الأوربي" }
summary:
  ar: "رئيس برابرة أوربة بالمغرب زمن الفتح؛ كان أميراً على قومه واستخف به حسان بن النعمان في أول أمره فأظهر الإسلام واستبقاه ثم نزل على عيون تلمسان وجمع سائر البرير ولقيه بجيش وملك إفريقية خمس سنين ونزل القيروان حتى أثخنه زهير بن قيس البلوي سنة 79هـ فقتله ومن لا يحصى من البربر وأتبعهم إلى مرمحنة وملوية {cite:tarikh-ibn-khaldun-ibar p. 1607-1608}."
  en: "Kusayla ibn Lamzam, chief of the Awraba Berbers at the conquest; after submitting he rallied the Berbers, ruled Ifriqiya five years from Kairouan, and was killed with numberless Berbers by Zuhayr ibn Qays at the battle of Marmanna/Moulouya in 79 {cite:tarikh-ibn-khaldun-ibar p. 1607-1608}."
  es: "Kusayla ibn Lamzam, jefe de los bereberes Awraba en la conquista; después de someterse, reagrupó a los bereberes, gobernó Ifriqiya durante cinco años desde Kairouan y fue asesinado junto con innumerables bereberes por Zuhayr ibn Qays en la batalla de Marmanna/Moulouya en el año 79 {cite:tarikh-ibn-khaldun-ibar p. 1607-1608}."
  fr: "Kusayla ibn Lamzam, chef des Berbères Awraba lors de la conquête; après sa soumission, il rassembla les Berbères, gouverna l'Ifriqiya pendant cinq ans depuis Kairouan, et fut tué avec d'innombrables Berbères par Zuhayr ibn Qays à la bataille de Marmanna/Moulouya en 79 {cite:tarikh-ibn-khaldun-ibar p. 1607-1608}."
  ur: "کسیلہ بن لامزم، فتح کے وقت عروبہ بربروں کے سربراہ؛ تسلیم کرنے کے بعد اس نے بربروں سے مقابلہ کیا، کیروان سے پانچ سال افریقیہ پر حکومت کی، اور 79 میں مرمنہ/مولویہ کی لڑائی میں زہیر بن قیس کے ہاتھوں بے شمار بربروں کے ساتھ مارا گیا۔ 1607-1608}۔"
