label: { ar: "كسيلة بن لمزم الأوربي" }
summary:
  ar: "رئيس برابرة أوربة بالمغرب زمن الفتح؛ كان أميراً على قومه واستخف به حسان بن النعمان في أول أمره فأظهر الإسلام واستبقاه ثم نزل على عيون تلمسان وجمع سائر البرير ولقيه بجيش وملك إفريقية خمس سنين ونزل القيروان حتى أثخنه زهير بن قيس البلوي سنة 79هـ فقتله ومن لا يحصى من البربر وأتبعهم إلى مرمحنة وملوية {cite:tarikh-ibn-khaldun-ibar p. 1607-1608}."
  en: "Kusayla ibn Lamzam, chief of the Awraba Berbers at the conquest; after submitting he rallied the Berbers, ruled Ifriqiya five years from Kairouan, and was killed with numberless Berbers by Zuhayr ibn Qays at the battle of Marmanna/Moulouya in 79 {cite:tarikh-ibn-khaldun-ibar p. 1607-1608}."
