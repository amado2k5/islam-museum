summary:
  ar: "الحسن بن الحافظ لدين الله عبد المجيد العبيدي؛ ولي عهد أبيه ووزيره، ولي ثلاثة أعوام فظلم وغشم وفتك حتى إنه قتل في ليلة أربعين أميراً فخافه أبوه وجهز لحربه جماعة فالتقاهم واختلطت مصر، ثم دس عليه أبوه من سقاه سماً فهلك سنة تسع وعشرين وخمسمائة {cite:shadharat-dhahab p. 570}."
  en: "Al-Hasan ibn al-Hafiz li-Din Allah Abd al-Majid, the Ubaydid; his father's heir-apparent and vizier for three years — tyrannical and violent, killing forty amirs in a single night until his father feared him and armed men against him; Egypt was convulsed, then the father sent him a poisoner who made him drink, and he perished in 529 {cite:shadharat-dhahab p. 570}."
  es: "Al-Hasan ibn al-Hafiz li-Din Allah Abd al-Majid, el Ubaydid; heredero aparente de su padre y visir durante tres años, tiránico y violento, mató a cuarenta emires en una sola noche hasta que su padre le temió y armó hombres contra él; Egipto se convulsionó, entonces el padre le envió un envenenador que le hizo beber y pereció en 529 {cite:shadharat-dhahab p. 570}."
  fr: "Al-Hasan ibn al-Hafiz li-Din Allah Abd al-Majid, l'Ubaydid; héritier présomptif et vizir de son père pendant trois ans — tyrannique et violent, tuant quarante émirs en une seule nuit jusqu'à ce que son père le craigne et arme des hommes contre lui; l'Égypte fut convulsée, puis le père lui envoya un empoisonneur qui le fit boire, et il périt en 529 {cite:shadharat-dhahab p. 570}."
  ur: "الحسن بن الحافظ لدین اللہ عبد الماجد، عبیدیت؛ تین سال تک اس کے والد کا وارث اور ظاہری وزیر - جابر اور متشدد، ایک ہی رات میں چالیس امیروں کو قتل کر دیا یہاں تک کہ اس کے والد اس سے ڈر گئے اور اس کے خلاف مسلح افراد کو مسلح کیا۔ مصر کو آہستگی ہوئی، پھر باپ نے اسے زہر بھیجا جس نے اسے پلایا اور وہ 529 میں ہلاک ہو گیا۔ 570}۔"
