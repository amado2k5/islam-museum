summary:
  ar: "الحسن بن الحافظ لدين الله عبد المجيد العبيدي؛ ولي عهد أبيه ووزيره، ولي ثلاثة أعوام فظلم وغشم وفتك حتى إنه قتل في ليلة أربعين أميراً فخافه أبوه وجهز لحربه جماعة فالتقاهم واختلطت مصر، ثم دس عليه أبوه من سقاه سماً فهلك سنة تسع وعشرين وخمسمائة {cite:shadharat-dhahab p. 570}."
  en: "Al-Hasan ibn al-Hafiz li-Din Allah Abd al-Majid, the Ubaydid; his father's heir-apparent and vizier for three years — tyrannical and violent, killing forty amirs in a single night until his father feared him and armed men against him; Egypt was convulsed, then the father sent him a poisoner who made him drink, and he perished in 529 {cite:shadharat-dhahab p. 570}."
