summary:
  ar: "قوّال وموسيقي وباحث في الموسيقى (1912–2003) من غرانة قوال بچوں کا دہلی، غنّى في بلاط نظام حيدر آباد ثم في كراتشي بعد 1948، ونال وسام حسن الأداء في 1967، وعلّم أبناءه فريد أياز وأبا محمد الذين خلفوه، ويحمل اسمه شارع في «قوالی گلی» بكراتشي."
  en: "Qawwal, classical musician and scholar of music (1912–2003) of the Qawwal Bachon ka Gharana of Delhi, who sang at the court of the Nizam of Hyderabad and then in Karachi after 1948, received the Pride of Performance in 1967, and trained his sons Fareed Ayaz and Abu Muhammad, who succeeded him; a street in Karachi's 'Qawwali Gali' bears his name."
  ur: "قوال، کلاسیکی موسیقار اور موسیقی کے محقق ⁦(1912ء–2003ء)⁩ قوال بچوں کے دہلی گھرانے سے، جنھوں نے نظامِ حیدرآباد کے دربار اور 1948ء کے بعد کراچی میں گایا، 1967ء میں تمغۂ حسنِ کارکردگی پایا، اور اپنے بیٹوں فرید ایاز اور ابو محمد کو تربیت دی جو ان کے جانشین ہوئے؛ کراچی کی «قوالی گلی» میں ایک گلی ان کے نام سے ہے۔"
