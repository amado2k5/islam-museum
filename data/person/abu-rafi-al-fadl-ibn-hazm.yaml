summary:
  ar: "أبو رافع الفضل بن أبي عمر أحمد بن حزم؛ ولد أبي عمر والد الفقيه ابن حزم الظاهري؛ كان نبيهاً سرياً فاضلاً في خدمة المعتمد بن عباد صاحب إشبيلية؛ وقد غضب المعتمد على عمه أبي طالب عبد الجبار وهمّ بقتله فاستحضر وزراءه وسألهم: من يعرف من الخلفاء أو ملوك الطوائف من قتل عمه عندما همّ بالقيام عليه؟ فتقدم أبو رافع وقال: ما نعرف أيدك الله إلا من عفا عن عمه بعد قيامه عليه وهو إبراهيم بن المهدي عم المأمون؛ فقبل المعتمد قوله وشكره وأحضر عمه وبسطه وأحسن إليه؛ وقُتل أبو رافع في وقعة الزلاقة مع مخدومه المعتمد {cite:wafayat-ayan}."
  en: "Abu Rafi' al-Fadl b. Ahmad b. Hazm — son of Ibn Hazm the Zahiri's father and a katib of al-Mu'tamid Ibn Abbad; saved the ruler's uncle with the single precedent 'we know none who killed his uncle — only Ibrahim b. al-Mahdi's pardon'; died at the ruler's side at Zallaqa in Rajab 479 {cite:wafayat-ayan}."
