summary:
  ar: "أبو رافع الفضل بن أبي عمر أحمد بن حزم؛ ولد أبي عمر والد الفقيه ابن حزم الظاهري؛ كان نبيهاً سرياً فاضلاً في خدمة المعتمد بن عباد صاحب إشبيلية؛ وقد غضب المعتمد على عمه أبي طالب عبد الجبار وهمّ بقتله فاستحضر وزراءه وسألهم: من يعرف من الخلفاء أو ملوك الطوائف من قتل عمه عندما همّ بالقيام عليه؟ فتقدم أبو رافع وقال: ما نعرف أيدك الله إلا من عفا عن عمه بعد قيامه عليه وهو إبراهيم بن المهدي عم المأمون؛ فقبل المعتمد قوله وشكره وأحضر عمه وبسطه وأحسن إليه؛ وقُتل أبو رافع في وقعة الزلاقة مع مخدومه المعتمد {cite:wafayat-ayan}."
  en: "Abu Rafi' al-Fadl b. Ahmad b. Hazm — son of Ibn Hazm the Zahiri's father and a katib of al-Mu'tamid Ibn Abbad; saved the ruler's uncle with the single precedent 'we know none who killed his uncle — only Ibrahim b. al-Mahdi's pardon'; died at the ruler's side at Zallaqa in Rajab 479 {cite:wafayat-ayan}."
  fr: "Abu Rafi' al-Fadl b. Ahmad b. Hazm — fils du père d'Ibn Hazm le zahirite et katib d'al-Mu'tamid Ibn Abbad ; il sauva l'oncle du souverain par un seul précédent : « nous ne connaissons personne qui ait tué son oncle — seulement le pardon d'Ibrahim b. al-Mahdi » ; il mourut aux côtés du souverain à Zallaqa en rajab 479 {cite:wafayat-ayan}."
  es: "Abu Rafi' al-Fadl b. Ahmad b. Hazm — hijo de Ibn Hazm, padre del Zahiri, y katib de al-Mu'tamid Ibn Abbad; salvó al tío del gobernante con el único precedente de que 'no conocemos a nadie que haya matado a su tío, solo el perdón de Ibrahim b. al-Mahdi'; murió al lado del gobernante en Zallaqa en Rajab 479 {cite:wafayat-ayan}."
  ur: "ابو رافع الفضل ب۔ احمد بی۔ حزم — ابن حزم ظاہری کے والد کا بیٹا اور المتمید ابن عباد کا کاتب؛ حکمران کے چچا کو ایک نظیر کے ساتھ بچایا 'ہم کسی کو نہیں جانتے کہ ان کے چچا کو کس نے مارا ہے - صرف ابراہیم بن۔ المہدی کی معافی؛ رجب 479 میں ذلقا کے مقام پر حاکم کے پاس وفات پائی۔"
  tr: "Ebu Rafi el-Fadl ibn Ebu Ömer Ahmed ibn Hazm; hukukçu İbn Hazm el-Zahiri'nin babası Ebu Ömer'in oğlu; Sevilla hükümdarı el-Mu'tamid ibn Abbad'ın hizmetinde zeki, sağduyulu ve erdemli bir adamdı. El-Mu'tamid, amcası Ebu Talib Abd el-Cebber'e kızmış ve onu öldürmeyi niyet etmişti. Bunun üzerine vezirlerini çağırıp onlara sordu: \"Taifaların halifeleri veya kralları arasında, amcası kendisine karşı ayaklanmaya kalkıştığında onu kimin öldürdüğünü bilen var mı?\" Bunun üzerine Ebu Rafi öne çıktı ve dedi ki: \"Allah size yardım etsin, amcası kendisine karşı ayaklandıktan sonra onu affeden bir kişi dışında kimse tanımıyoruz. O da el-Ma'mun'un amcası İbrahim ibn el-Mehdi'dir.\" Bunun üzerine el-Mu'tamid onun sözlerini kabul etti, teşekkür etti ve amcasını getirip ona saygı gösterdi ve iyi davrandı. Ebu Rafi’, efendisi el-Mu’tamid ile birlikte Zallaqa Muharebesi’nde öldürüldü. {Kaynak:wafayat-ayan}"
  id: "Abu Rafi’ al-Fadl ibn Abi ‘Umar Ahmad ibn Hazm; putra Abi ‘Umar, ayah dari ahli hukum Ibn Hazm al-Zahiri; beliau adalah seorang pria yang cerdas, bijaksana, dan berbudi luhur yang mengabdi kepada al-Mu’tamid ibn ‘Abbad, penguasa Sevilla; dan al-Mu’tamid marah kepada pamannya Abu Talib ‘Abd al-Jabbar dan bermaksud membunuhnya, maka beliau memanggil para menterinya dan bertanya kepada mereka: Siapakah di antara para khalifah atau raja Taifas yang mengetahui siapa yang membunuh pamannya ketika ia bermaksud memberontak melawannya? Maka Abu Rafi’ maju dan berkata: Kami tidak tahu, semoga Allah mendukung kalian, kecuali seseorang yang memaafkan pamannya setelah ia memberontak melawannya, dan itu adalah Ibrahim ibn al-Mahdi, paman dari al-Ma’mun; maka al-Mu’tamid menerima perkataannya dan berterima kasih kepadanya, lalu beliau membawa pamannya, menghormatinya, dan memperlakukannya dengan baik; dan Abu Rafi’ gugur dalam Perang Zallaqa bersama tuannya, al-Mu’tamid {cite:wafayat-ayan}."
