id: person/ibn-hubaysh-hafiz
class: person
label: { ar: "ابن حبيش الحافظ" }
summary:
  ar: "عبد الرحمن بن حبيش الأنصاري المريي آخر الحفاظ بالأندلس؛ قال: كنت في قلعة المرية لما وقع الاستيلاء عليها فتقدمت إلى زعيم الروم السليطين وهو ابن بنت الأذفونش وقلت له إني أحفظ نسبك منك إلى هرقل فقال لي قل فذكرته له فقال لي اخرج أنت وأهلك ومن معك طلقاء بلا شيء {cite:nafh-tib-maqqari p. 467}. وهو شيخ ابن دحية وابن حوط الله وأبي الربيع الكلاعي {cite:nafh-tib-maqqari p. 467}."
  en: "Abd al-Rahman ibn Hubaysh al-Ansari of Almeria — 'the last of the huffaz in al-Andalus'; caught in the citadel in the sack of 542, he told Emperor Alfonso VII 'I know your pedigree better than you — back to Heraclius,' recited it, and won free departure for his household; teacher of Ibn Dihya, Ibn Hawt Allah and Abu al-Rabi al-Kila'i {cite:nafh-tib-maqqari p. 467}."
  es: "Abd al-Rahman ibn Hubaysh al-Ansari de Almería — 'el último de los huffaz en al-Ándalus'; capturado en la ciudadela durante el saqueo de 542, le dijo al emperador Alfonso VII: 'Conozco tu linaje mejor que tú, hasta Heraclio', lo recitó y obtuvo la libertad de su familia; maestro de Ibn Dihya, Ibn Hawt Allah y Abu al-Rabi al-Kila'i {cite:nafh-tib-maqqari p. 467}."
  fr: "Abd al-Rahman ibn Hubaysh al-Ansari d'Almeria — « le dernier des huffaz d'al-Andalus »; pris dans la citadelle lors du sac de 542, il dit à l'empereur Alphonse VII: « Je connais votre pedigree mieux que vous-même — jusqu'à Héraclius », le récita et obtint le libre départ pour sa famille; maître d'Ibn Dihya, d'Ibn Hawt Allah et d'Abu al-Rabi al-Kila'i {cite: nafh-tib-maqqari p. 467}."
  ur: "عبدالرحمن بن حبیش الانصاری المیریا - 'اندلس میں حفاظ کا آخری'؛ 542 کی بوری میں قلعہ میں پکڑے گئے، اس نے شہنشاہ الفانسو VII سے کہا 'میں آپ سے بہتر جانتا ہوں کہ آپ کا سلسلہ نسب آپ سے بہتر ہے - واپس ہیراکلس کے پاس،' اسے سنایا، اور اپنے گھر والوں کے لیے مفت روانگی جیت لی؛ ابن دحیہ، ابن حوث اللہ اور ابو الربیع الکلائی کے استاد {حوالہ: ناف تبع مقری ص۱۱۔ 467}۔"
