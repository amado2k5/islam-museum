summary:
  ar: "عبد الرحمن بن حبيش الأنصاري المريي آخر الحفاظ بالأندلس؛ قال: كنت في قلعة المرية لما وقع الاستيلاء عليها فتقدمت إلى زعيم الروم السليطين وهو ابن بنت الأذفونش وقلت له إني أحفظ نسبك منك إلى هرقل فقال لي قل فذكرته له فقال لي اخرج أنت وأهلك ومن معك طلقاء بلا شيء {cite:nafh-tib-maqqari p. 467}. وهو شيخ ابن دحية وابن حوط الله وأبي الربيع الكلاعي {cite:nafh-tib-maqqari p. 467}."
  en: "Abd al-Rahman ibn Hubaysh al-Ansari of Almeria — 'the last of the huffaz in al-Andalus'; caught in the citadel in the sack of 542, he told Emperor Alfonso VII 'I know your pedigree better than you — back to Heraclius,' recited it, and won free departure for his household; teacher of Ibn Dihya, Ibn Hawt Allah and Abu al-Rabi al-Kila'i {cite:nafh-tib-maqqari p. 467}."
