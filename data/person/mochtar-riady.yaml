summary:
  ar: "مختار ريادي (وُلد باسم لي مو تيه في 12 أيار 1929 في مالانغ بجاوة الشرقية) مصرفي ورجل أعمال إندونيسي من أصل صيني، مؤسس مجموعة ليبو؛ شارك في كفاح الاستقلال ودرس الفلسفة في جامعة نانجينغ، ثم بنى مسيرته المصرفية من متجر صغير في جمبر إلى إحياء بنوك كيماكموران وبوانا وبانين ورفع بنك سنترال آسيا، قبل أن يؤسس بنك ليبو سنة 1989 ومجموعة ليبو المتنوعة في المال والعقار والصحة والتعليم، ولُقب «ساحر تسويق البنوك»."
  en: "Mochtar Riady (born Lie Mo Tie on 12 May 1929 at Malang, East Java) is an Indonesian banker and business magnate of Chinese descent, founder of the Lippo Group; he took part in the independence struggle and studied philosophy at the University of Nanking, then built a banking career from a small shop in Jember to reviving Bank Kemakmuran, Buana and Panin and raising Bank Central Asia, before founding Lippobank in 1989 and the diversified Lippo Group across finance, property, health and education, earning the name 'the Magic Man of Bank Marketing'."
  ur: "مختار ریادی (پیدائش بطور لی مو تیے 12 مئی 1929، ملانگ، مشرقی جاوا) چینی نسل کے انڈونیشیائی بینکر و کاروباری ہیں، لیپو گروپ کے بانی؛ انھوں نے جدوجہد آزادی میں حصہ لیا اور نانکنگ یونیورسٹی میں فلسفہ پڑھا، پھر جمبر کی چھوٹی دکان سے بینک کیماکموران، بوانا و پانین کو زندہ کرنے اور بینک سنٹرل ایشیا کو اٹھانے تک بینکاری کیریئر بنایا، قبل اس کے کہ 1989 میں لیپو بینک اور مالیات، جائیداد، صحت و تعلیم پر مشتمل متنوع لیپو گروپ قائم کیا، اور «بینک مارکیٹنگ کے جادوگر» کہلائے۔"
