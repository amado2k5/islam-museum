summary:
  ar: "مختار ريادي ⁦(وُلد باسم لي مو تيه في 12 أيار 1929 في مالانغ بجاوة الشرقية)⁩ مصرفي ورجل أعمال إندونيسي من أصل صيني، مؤسس مجموعة ليبو؛ شارك في كفاح الاستقلال ودرس الفلسفة في جامعة نانجينغ، ثم بنى مسيرته المصرفية من متجر صغير في جمبر إلى إحياء بنوك كيماكموران وبوانا وبانين ورفع بنك سنترال آسيا، قبل أن يؤسس بنك ليبو سنة 1989 ومجموعة ليبو المتنوعة في المال والعقار والصحة والتعليم، ولُقب «ساحر تسويق البنوك»."
  en: "Mochtar Riady (born Lie Mo Tie on 12 May 1929 at Malang, East Java) is an Indonesian banker and business magnate of Chinese descent, founder of the Lippo Group; he took part in the independence struggle and studied philosophy at the University of Nanking, then built a banking career from a small shop in Jember to reviving Bank Kemakmuran, Buana and Panin and raising Bank Central Asia, before founding Lippobank in 1989 and the diversified Lippo Group across finance, property, health and education, earning the name 'the Magic Man of Bank Marketing'."
  ur: "مختار ریادی ⁦(پیدائش بطور لی مو تیے 12 مئی 1929، ملانگ، مشرقی جاوا)⁩ چینی نسل کے انڈونیشیائی بینکر و کاروباری ہیں، لیپو گروپ کے بانی؛ انھوں نے جدوجہد آزادی میں حصہ لیا اور نانکنگ یونیورسٹی میں فلسفہ پڑھا، پھر جمبر کی چھوٹی دکان سے بینک کیماکموران، بوانا و پانین کو زندہ کرنے اور بینک سنٹرل ایشیا کو اٹھانے تک بینکاری کیریئر بنایا، قبل اس کے کہ 1989 میں لیپو بینک اور مالیات، جائیداد، صحت و تعلیم پر مشتمل متنوع لیپو گروپ قائم کیا، اور «بینک مارکیٹنگ کے جادوگر» کہلائے۔"
  es: "Mochtar Riady (nacido como Lie Mo Tie el 12 de mayo de 1929 en Malang, Java Oriental) es un banquero y magnate indonesio de ascendencia china, fundador del Grupo Lippo; participó en la lucha por la independencia y estudió filosofía en la Universidad de Nanking, luego construyó una carrera bancaria desde una pequeña tienda en Jember hasta revivir Bank Kemakmuran, Buana y Panin y crear Bank Central Asia, antes de fundar Lippobank en 1989 y el diversificado Grupo Lippo en finanzas, bienes raíces, salud y educación, ganándose el apodo de \"el mago del marketing bancario\"."
  fr: "Mochtar Riady (né Lie Mo Tie le 12 mai 1929 à Malang, Java oriental) est un banquier et magnat des affaires indonésien d'origine chinoise, fondateur du groupe Lippo; il a participé à la lutte pour l'indépendance et a étudié la philosophie à l'université de Nankin, puis a bâti une carrière bancaire en partant d'une petite boutique à Jember pour relancer les banques Kemakmuran, Buana et Panin et créer la Bank Central Asia, avant de fonder Lippobank en 1989 et le groupe Lippo, diversifié dans les secteurs de la finance, de l'immobilier, de la santé et de l'éducation, ce qui lui a valu le surnom de « magicien du marketing bancaire »."
  tr: "Mukhtar Riyadi (doğum adıyla Li Mo Teh, 12 Mayıs 1929, Malang, Doğu Java) Çin kökenli Endonezyalı bir bankacı ve iş insanıdır, Lipu Grubu'nun kurucusudur; bağımsızlık mücadelesine katılmış ve Nanjing Üniversitesi'nde felsefe okudu. Daha sonra Gember'daki küçük bir mağazadan başlayıp Kimamoran, Buana ve Banin bankalarını canlandırmak için bankacılık kariyerini kurdu ve Central Asia Bank'ı kurdu; ardından 1989'da Lipu Bank'ı ve finans, gayrimenkul, sağlık ve eğitim alanlarında çeşitli olan Lipu Group'u kurdu ve 'Banka Pazarlamasının Sihirbazı' lakabını kazandı."
  id: "Mukhtar Riyadi (lahir dengan nama Li Mo Teh pada 12 Mei 1929, di Malang, Jawa Timur) adalah seorang bankir dan pengusaha Indonesia keturunan Tionghoa, pendiri Grup Lipu; ia ikut serta dalam perjuangan kemerdekaan dan belajar filsafat di Universitas Nanjing. Kemudian ia membangun karier perbankannya dari sebuah toko kecil di Gember untuk menghidupkan kembali bank Kimamoran, Buana, dan Banin, serta mendirikan Bank Asia Tengah, sebelum mendirikan Bank Lipu pada tahun 1989 dan Grup Lipu, yang beragam di bidang keuangan, properti, kesehatan, dan pendidikan, sehingga mendapat julukan 'Pesulap Pemasaran Bank.'"
