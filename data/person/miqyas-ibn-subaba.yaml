summary:
  en: "A man of Banu Sahm who came to Medina feigning Islam to claim blood money for his brother killed accidentally; after accepting the wergild, he murdered his brother's killer and fled back to Mecca an apostate; proscribed on the day of the Conquest and slain by Numayla ibn Abdullah."
  ar: "رجل من بني سهم أظهر الإسلام ليأخذ دية أخيه الذي قُتل خطأ؛ فلما أخذ الدية غدر بالقاتل فقتله وارتد إلى مكة مشركًا، فأهدر دمه يوم الفتح وقتله نُميلة بن عبد الله من قومه."
  es: "Un hombre de Banu Sahm que llegó a Medina fingiendo ser musulmán para reclamar una indemnización por la muerte accidental de su hermano; tras aceptar la compensación, asesinó al asesino de su hermano y huyó de regreso a La Meca como apóstata; fue proscrito el día de la Conquista y asesinado por Numayla ibn Abdullah."
  fr: "Un homme de Banu Sahm venu à Médine en feignant l'islam pour réclamer le prix du sang pour son frère tué accidentellement; après avoir accepté le wergeld, il assassina le meurtrier de son frère et s'enfuit à La Mecque en apostat; proscrit le jour de la Conquête et tué par Numayla ibn Abdullah."
  ur: "بنو سہم کا ایک شخص جو اپنے بھائی کے خون کا دعویٰ کرنے کے لیے اسلام کا دعویٰ کرنے کے لیے مدینہ آیا تھا، اتفاقاً مارا گیا۔ ورگلڈ کو قبول کرنے کے بعد، اس نے اپنے بھائی کے قاتل کو قتل کر دیا اور واپس مکہ فرار ہو کر مرتد ہو گیا۔ فتح کے دن ممنوع قرار دیا اور نعمائلہ بن عبداللہ کے ہاتھوں قتل ہوا۔"
  tr: "Banu Sahm'den bir adam, yanlışlıkla öldürülen kardeşi için kan parasını almak üzere İslam'ı ilan etti; parayı aldığında katili sattı, öldürdü ve putperest olarak Mekke'ye döndü. Fetih günü, kanı döküldü ve Namila ibn Abdullah kendi adamlarından biri tarafından öldürüldü."
  id: "Seorang pria dari Banu Sahm menyatakan Islam untuk mengambil uang darah untuk saudaranya, yang terbunuh secara tidak sengaja; ketika dia mengambil uang itu, dia mengkhianati pembunuh, membunuhnya, dan kembali ke Mekah sebagai seorang musyrik. Pada hari penaklukan, darahnya tertumpah dan Namila ibn Abdullah dibunuh oleh salah satu kaumnya."
