summary:
  en: "A man of Banu Sahm who came to Medina feigning Islam to claim blood money for his brother killed accidentally; after accepting the wergild, he murdered his brother's killer and fled back to Mecca an apostate; proscribed on the day of the Conquest and slain by Numayla ibn Abdullah."
  ar: "رجل من بني سهم أظهر الإسلام ليأخذ دية أخيه الذي قُتل خطأ؛ فلما أخذ الدية غدر بالقاتل فقتله وارتد إلى مكة مشركًا، فأهدر دمه يوم الفتح وقتله نُميلة بن عبد الله من قومه."
