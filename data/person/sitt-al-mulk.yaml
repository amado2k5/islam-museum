id: person/sitt-al-mulk
class: person
label: { ar: "ست الملك أخت الحاكم بأمر الله", en: "Sitt al-Mulk", es: "Sitt al-Mulk", fr: "Sitt al-Mulk", ur: "سیٹ الملک" }
summary:
  ar: "أخت الحاكم بأمر الله الفاطمي وابنة العزيز بالله. يروي ابن الجوزي عن أهل مصر أنها اصطنعت بين أخيها وقاعده ابن دوّاس الذي كان يخافه الحاكم، فلما قُتل الحاكم ليلًا على جبل المقطم حُمل إليها فدفنته في مجلسها وسترت الأمر ثلاثة أيام ونشرت أنه غائب، ثم بويع علي بن الحاكم الظاهر لإعزاز دين الله فنصبته وألبسته تاج المعز، ثم أماتت ابن دوّاس على يد نسيم صاحب الستر والسيف وأماتت من علم من الخدم، فعظم هيبها في الدولة {cite:muntazam-ibn-al-jawzi j.7 p.302-305}."
  tr: "O, el-Hakim bi-Amr Allah el-Fatimi'nin kız kardeşi ve el-Aziz Billah'ın kızıdır. İbn el-Ceviz, Mısır halkına, kardeşi ile onun alçak İbn Davas arasında bir anlaşmazlık uydurduğunu anlatır; hükümdar korkmuştur. El-Hakim gece Mokattam Dağı'nda öldürüldüğünde, oraya götürüldü, onun sarayına gömüldü ve olay üç gün boyunca gizlendi, onun yokluğu duyuruldu. Sonra Ali bin el-Hakim el-Zahir, Tanrı'nın dinine saygı göstermek için bağlılık yemini etti, bu yüzden onu atadı ve el-Muizz tacıyla süsledi. Daha sonra Perde ve kılıcın sahibi Nasim'in elinden İbn Davisi öldürdü ve hizmetçiler arasında öldü; bu da devletteki itibarını büyük ölçüde artırdı {alıntı::Muntazam-ibn-al-Jawzi J.7 s.302-305}."
  id: "Dia adalah saudara perempuan al-Hakim bi-Amr Allah al-Fatimi dan putri al-Aziz Billah. Ibn al-Jawzi menceritakan kepada rakyat Mesir bahwa dia mengarang perselisihan antara saudaranya dan bawahannya Ibn Dawas, yang ditakuti penguasa. Ketika al-Hakim dibunuh pada malam hari di Gunung Mokattam, dia dibawa ke sana, dikubur di halaman Iz, dan masalah itu disembunyikan selama tiga hari, menyebarkan kabar bahwa dia tidak ada. Kemudian Ali ibn al-Hakim al-Zahir bersumpah setia untuk menghormati agama Tuhan, sehingga dia mengangkatnya dan menghiasi dengan mahkota al-Mu'izz. Dia kemudian membunuh Ibn Dawas di tangan Nasim, pemilik tirai dan pedang, dan meninggal di antara para pelayan, yang sangat meningkatkan prestisenya di negara {cite:muntazam-ibn-al-jawzi j.7 hlm.302-305}."
