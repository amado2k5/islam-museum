summary:
  ar: "أخت الحاكم بأمر الله الفاطمي وابنة العزيز بالله. يروي ابن الجوزي عن أهل مصر أنها اصطنعت بين أخيها وقاعده ابن دوّاس الذي كان يخافه الحاكم، فلما قُتل الحاكم ليلًا على جبل المقطم حُمل إليها فدفنته في مجلسها وسترت الأمر ثلاثة أيام ونشرت أنه غائب، ثم بويع علي بن الحاكم الظاهر لإعزاز دين الله فنصبته وألبسته تاج المعز، ثم أماتت ابن دوّاس على يد نسيم صاحب الستر والسيف وأماتت من علم من الخدم، فعظم هيبها في الدولة {cite:muntazam-ibn-al-jawzi j.7 p.302-305}."
