summary:
  ar: "مصارع مصري في المصارعة الرومانية، وُلد في الإسكندرية سنة 1979. فاز بذهبية وزن 96 كجم في أولمبياد أثينا 2004 — أول ذهبية أولمبية لمصر منذ 1948 — وبفضية أولمبياد لندن 2012، وحمل علم مصر في أولمبياد بكين 2008."
