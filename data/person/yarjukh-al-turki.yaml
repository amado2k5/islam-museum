id: person/yarjukh-al-turki
class: person
label: { ar: "يارجوج التركي", en: "Yarjukh the Turk", es: "Yarjukh the Turk", fr: "Yarjukh the Turk", ur: "یارجوخ ترک" }
summary:
  ar: "قائد تركي كان في كمين بايكيال على المهتدي بسامرا، فلما انكشف بايكيال خرج الكمين فولى المهتدى وأصحابه ودخل سامرا مستغيثاً بالعامة فحمل إلى دار يارجوج، وكان يارجوج وموسى بن بغا غير داخلين في فعل الأتراك بقتله {cite:muruj-al-dhahab p. 559-560}."
  en: "The Turkish commander in Bayakbak's ambush whose house received the fleeing al-Muhtadi {cite:muruj-al-dhahab p. 559-560}."
  es: "El comandante turco en la emboscada de Bayakbak cuya casa recibió al fugitivo al-Muhtadi {cite:muruj-al-dhahab p. 559-560}."
  fr: "Le commandant turc dans l'embuscade de Bayakbak dont la maison a reçu al-Muhtadi en fuite {cite:muruj-al-dhahab p. 559-560}."
  ur: "بیاکبک کی گھات میں موجود ترک کمانڈر جس کے گھر فرار ہونے والے المحتدی کو موصول ہوا {حوالہ: مروج الذہاب ص۔ 559-560}۔"
  tr: "Bir Türk komutanı, Samarra'da dönmüş kişiye karşı Baykyal'da pusuya düşürülmüştü. Baykyal ortaya çıkınca, pusu ortaya çıktı; bu yüzden dönen ve arkadaşları halktan yardım istemek için Samarra'ya girdiler, bu yüzden Yarjuj'un evine götürüldü. Yarjuj ve Musa ibn Bagha, Türklerin öldürülmesine karışmadılar {cite:muruj-al-dhahab, s. 559-560}."
  id: "Seorang komandan Turki sedang melakukan penyergapan di Baykyal terhadap mualaf di Samarra. Ketika Baykyal terbongkar, penyergapan itu terbongkar, sehingga sang mualaf dan rekan-rekannya masuk ke Samarra mencari bantuan dari rakyat biasa, sehingga ia dibawa ke rumah Yarjuj. Yarjuj dan Musa ibn Bagha tidak terlibat dalam pembunuhan orang Turki {cite:muruj-al-dhahab, hlm. 559-560}."
