id: person/sima-al-saji
class: person
label: { ar: "سيماء الساجي" }
summary:
  ar: "رئيس الساجية ومقدمهم ببغداد؛ خافه القاهر بالله فنقل إليه أنه يريد قتله فأعطاهم السلاح وكاتب الحجرية فتكافلوا على اجتماع الكلمة وقتل من خالف، واجتمع الساجية والحجرية عنده يوم الأربعاء تسع خلون من جمادى الأولى سنة 322هـ فزحفوا إلى الدار وقبضوا على القاهر وسملوه {cite:kamil-ibn-al-athir p. 209-210}."
  en: "Chief of the Sajiyya regiment of Baghdad; warned that al-Qahir meant to kill him, he armed the Sajiyya and swore them with the Hujariyya to one word — they stormed the palace, seized the caliph and blinded him in 322 {cite:kamil-ibn-al-athir p. 209-210}."
  es: "Jefe del regimiento Sajiyya de Bagdad; advertido de que al-Qahir pretendía matarlo, armó a los Sajiyya y les hizo jurar junto con los Hujariyya una palabra: asaltaron el palacio, capturaron al califa y lo cegaron en 322 {cite:kamil-ibn-al-athir p. 209-210}."
  fr: "Chef du régiment Sajiyya de Bagdad; averti qu'al-Qahir avait l'intention de le tuer, il arma les Sajiyya et leur fit jurer avec les Hujariyya un seul mot — ils prirent d'assaut le palais, s'emparèrent du calife et l'aveuglèrent en 322 {cite:kamil-ibn-al-athir p. 209-210}."
  ur: "بغداد کی سجیہ رجمنٹ کے سربراہ؛ متنبہ کیا کہ القاہر کا مقصد اسے قتل کرنا ہے، اس نے سجیہ کو مسلح کیا اور ہجریہ کے ساتھ ایک لفظ کی قسم کھائی - انہوں نے محل پر دھاوا بولا، خلیفہ کو پکڑ لیا اور 322 میں اندھا کر دیا۔ 209-210}۔"
  tr: "Bağdat'taki Sajiyyah'ın lideri ve lideri; el-Kahir Billah ondan korktu ve onu öldürmeyi planladığını söyledi. Onlara silahlar ve el-Hujariyah'ın yazıcısını verdi, onlar da sözü birleştirip karşı çıkanları öldürmeye karar verdiler. Saciyye ve el-Hujariye, 322 Hicri yılının Cumadeliu-avval'ın dokuzuncusu Çarşamba günü onunla görüştü. Eve yürüdüler, el-Kahir'i yakaladılar ve teslim ettiler {cite:kamil-ibn-al-athir s. 209-210}."
  id: "Pemimpin dan pemimpin Sajiyyah di Baghdad; al-Qahir Billah takut kepadanya dan mengatakan bahwa ia berniat membunuhnya. Ia memberikan senjata dan juru tulis al-Hujariyah, dan mereka sepakat untuk menyatukan firman dan membunuh siapa pun yang tidak setuju. Sajiyyah dan al-Hujariyah bertemu dengannya pada hari Rabu, tanggal sembilan Jumada al-Awwal, 322 H. Mereka berjalan ke rumah, menangkap al-Qahir, dan menyerahkannya {cite:kamil-ibn-al-athir hlm. 209-210}."
