summary:
  ar: "رئيس الساجية ومقدمهم ببغداد؛ خافه القاهر بالله فنقل إليه أنه يريد قتله فأعطاهم السلاح وكاتب الحجرية فتكافلوا على اجتماع الكلمة وقتل من خالف، واجتمع الساجية والحجرية عنده يوم الأربعاء تسع خلون من جمادى الأولى سنة 322هـ فزحفوا إلى الدار وقبضوا على القاهر وسملوه {cite:kamil-ibn-al-athir p. 209-210}."
  en: "Chief of the Sajiyya regiment of Baghdad; warned that al-Qahir meant to kill him, he armed the Sajiyya and swore them with the Hujariyya to one word — they stormed the palace, seized the caliph and blinded him in 322 {cite:kamil-ibn-al-athir p. 209-210}."
