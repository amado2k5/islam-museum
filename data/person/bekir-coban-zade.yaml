label:
  ar: "بكير جوبان زاده"
  en: "Bekir Çoban-zade"
  ur: "بکیر چوبان زادہ"
summary:
  ar: "شاعر وعالم تركيات تتاري قرمي، وُلد في قره صوبازار بالقرم سنة 1893 وتعلّم في القرم وإسطنبول وبودابست، وتولى كرسي علم التركيات في جامعة القرم ثم في جامعة باكو الحكومية، وكتب نحو 150 عملا علميا في اللغات التركية وآدابها، وأُعدم في باكو في 13 أكتوبر 1937 في التطهير الكبير ثم رُدّ إليه اعتباره بعد وفاته."
  en: "Crimean Tatar poet and Turkologist, born at Qarasuvbazar in Crimea in 1893 and educated in Crimea, Istanbul and Budapest. He held the chair of Turkology at the Crimean University and then at Baku State University, wrote some 150 scholarly works on Turkic languages and literature, and was executed at Baku on 13 October 1937 in the Great Purge; he was posthumously rehabilitated."
  ur: "کریمیائی تاتاری شاعر اور ماہرِ ترکیات، جو 1893 میں کریمیا کے قاراسو بازار میں پیدا ہوئے اور کریمیا، استنبول اور بوڈاپسٹ میں تعلیم پائی۔ وہ کریمیا یونیورسٹی اور پھر باکو اسٹیٹ یونیورسٹی میں ترکیات کے پروفیسر رہے، ترک زبانوں اور ادب پر تقریباً 150 علمی کام لکھے، اور 13 اکتوبر 1937 کو عظیم صفائی (گریٹ پرج) میں باکو میں پھانسی دیے گئے؛ بعد از مرگ ان کی عزت بحال کی گئی۔"
