summary:
  ar: "ضابط بحري عثماني ومؤلف، خدم في الحجاز واليمن، وألّف «مرآة الحرمين» و«تاريخ الوهابيين»، وتوفي في إسطنبول سنة 1308هـ ⁦(1890م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 845}."
  en: "Ottoman naval officer and author who served in the Hijaz and Yemen; wrote the Mir'at al-Haramayn and a history of the Wahhabis; died in Istanbul in 1308 AH (1890) {cite:encyclopaedia-of-islam-2 vol. 1 p. 845}."
  es: "Oficial naval otomano y autor que sirvió en el Hiyaz y Yemen; escribió el Mir'at al-Haramayn y una historia de los wahabíes; murió en Estambul en 1308 AH (1890) {cite:encyclopaedia-of-islam-2 vol. 1 p. 845}."
  fr: "Officier de marine ottoman et auteur ayant servi dans le Hedjaz et le Yémen; auteur du Mir'at al-Haramayn et d'une histoire des Wahhabites; mort à Istanbul en 1308 AH (1890) {cite:encyclopaedia-of-islam-2 vol. 1 p. 845}."
  ur: "عثمانی بحریہ کے افسر اور مصنف جنہوں نے حجاز اور یمن میں خدمات انجام دیں۔ مراۃ الحرمین اور وہابیوں کی تاریخ لکھی۔ استنبول میں 1308ھ (1890) میں وفات پائی۔ 1 ص۔ 845}۔"
  tr: "Osmanlı deniz subayı ve yazar olan Sher, Hicaz ve Yemen'de görev yaptı, 'Mirat al-Harameyn' ve 'Vahhabilerin Tarihi' adlı eserleri yazdı ve 1308 Hicri (1890 AD) yılında İstanbul'da öldü {atıf:İslam Ansiklopedisi-2 cilt 1, s. 845}."
  id: "Sebagai perwira angkatan laut Ottoman dan penulis, ia bertugas di Hejaz dan Yaman, menulis 'Mirat al-Haramayn' dan 'History of the Wahhabis,' dan meninggal di Istanbul pada tahun 1308 H (1890 M) {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 845}."
