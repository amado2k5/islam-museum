  es: "Científico planetario y geofísico de radar egipcio-estadounidense, nacido en 1975. Se especializa en el sondeo de radar del subsuelo de Marte, la Luna y los acuíferos áridos de la Tierra, y ha contribuido a misiones de la NASA y europeas, como Phoenix y Rosetta."
