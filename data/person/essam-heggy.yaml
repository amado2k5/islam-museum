  ar: "عالم كواكب وجيوفيزيائي راداري مصري أمريكي، وُلد سنة 1975. يتخصص في الاستكشاف الراداري لباطن المريخ والقمر وطبقات المياه الجوفية في المناطق الجافة على الأرض، وأسهم في بعثات لناسا ووكالة الفضاء الأوروبية منها فونكس وروزيتا."
