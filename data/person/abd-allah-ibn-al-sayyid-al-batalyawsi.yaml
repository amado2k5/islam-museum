summary:
  ar: "عبد الله بن محمد بن السيد البطليوسي، أبو محمد، من أهل بطليوس، انتقل إلى بلنسية وتوفي بها، عالم بالآداب واللغات، حسن التعليم، ثقة ضابط. من تصانيفه «الإنصاف في التنبيه على الأسباب التي أوجبت الاختلاف بين المسلمين في آرائهم». وُلد سنة 444هـ وتوفي سنة 521هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2048}"
  en: "Abd Allah ibn Muhammad ibn al-Sayyid, Abu Muhammad, from Batalyawsa, who moved to Valencia and died there; a scholar of letters and languages, a good teacher and a reliable, precise transmitter. His work includes «al-Insaf», on the causes of disagreement among Muslims in their opinions. Born 444 AH, died 521 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2048}"
  fr: "Abd Allah ibn Muhammad ibn al-Sayyid, Abu Muhammad, de Badajoz, qui s'installa à Valence et y mourut ; savant des lettres et des langues, bon enseignant et transmetteur fiable et précis. Son œuvre comprend « al-Insaf », sur les causes du désaccord entre musulmans dans leurs opinions. Né en 444 H, mort en 521 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2048}"
  es: "Abd Allah ibn Muhammad ibn al-Sayyid, Abu Muhammad, originario de Batalyawsa, se trasladó a Valencia, donde falleció. Fue un erudito en letras y lenguas, un buen maestro y un transmisor fiable y preciso. Entre sus obras destaca «al-Insaf», sobre las causas de las discrepancias entre los musulmanes. Nació en el año 444 de la Hégira y falleció en el 521 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2048}"
