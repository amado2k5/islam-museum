summary:
  ar: "عبد الله بن محمد بن السيد البطليوسي، أبو محمد، من أهل بطليوس، انتقل إلى بلنسية وتوفي بها، عالم بالآداب واللغات، حسن التعليم، ثقة ضابط. من تصانيفه «الإنصاف في التنبيه على الأسباب التي أوجبت الاختلاف بين المسلمين في آرائهم». وُلد سنة 444هـ وتوفي سنة 521هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2048}"
  en: "Abd Allah ibn Muhammad ibn al-Sayyid, Abu Muhammad, from Batalyawsa, who moved to Valencia and died there; a scholar of letters and languages, a good teacher and a reliable, precise transmitter. His work includes «al-Insaf», on the causes of disagreement among Muslims in their opinions. Born 444 AH, died 521 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2048}"
