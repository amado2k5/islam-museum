summary:
  ar: "م. أ. يوسف علي (وُلد في 15 تشرين الثاني 1955 في ناتيكا بولاية كيرالا)، رجل أعمال وملياردير هندي يرأس مجموعة لولو الدولية وشركة لولو ريتيل القابضة المشغّلة لسلسلة لولو هايبر ماركت. هاجر إلى أبوظبي سنة 1973 ليعمل في شركة عمّه، ثم قاد توسّع المجموعة في تجارة التجزئة حتى أُدرجت ذراعها التجارية في بورصة أبوظبي سنة 2024. حصل على وسام بادما شري سنة 2008 وعلى جائزة أبوظبي، أرفع وسام مدني في الإمارة، سنة 2021."
  en: "M. A. Yusuff Ali (born 15 November 1955 at Nattika, Kerala) is an Indian businessman and billionaire who chairs LuLu Group International and Lulu Retail Holdings, operator of the LuLu Hypermarket chain. He emigrated to Abu Dhabi in 1973 to join his uncle's business and led the group's expansion into retail, whose arm listed on the Abu Dhabi Securities Exchange in 2024. He received the Padma Shri in 2008 and the Abu Dhabi Award, the emirate's highest civilian honour, in 2021."
  ur: "ایم اے یوسف علی (پیدائش 15 نومبر 1955، ناتیکا، کیرالا) بھارتی تاجر اور ارب پتی ہیں جو لولو گروپ انٹرنیشنل اور لولو ہائپر مارکیٹ سلسلے کو چلانے والی لولو ریٹیل ہولڈنگز کے چیئرمین ہیں۔ وہ 1973 میں اپنے چچا کے کاروبار میں شامل ہونے کے لیے ابوظہبی چلے گئے اور گروپ کی ریٹیل توسیع کی قیادت کی، جس کا شعبہ 2024 میں ابوظہبی سیکیورٹیز ایکسچینج میں درج ہوا۔ انہیں 2008 میں پدم شری اور 2021 میں ابوظہبی ایوارڈ، امارت کا سب سے بڑا شہری اعزاز، ملا۔"

