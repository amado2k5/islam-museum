summary:
 ar: "آدم بن أبي إياس، واسم أبيه عبد الرحمن بن محمد بن شعيب، أبو الحسن العسقلاني الخراساني المروذي، إمام حافظ شيخ الشام، مشهور بالسنة وشديد التمسك بها، سمع من أبي ذئب ومبارك بن فضالة وشعبة وغيرهم، وروى عنه البخاري وأحمد بن الأزهر وأبو زرعة وأبو حاتم. قال أبو حاتم ثقة مأمون، ووصفه أحمد بن حنبل بالمكانة عند شعبة. طلب الحديث ببغداد ثم رحل إلى الكوفة والبصرة والحجاز ومصر والشام، واستوطن عسقلان حتى مات بها. ذكر الكتاب تاريخ مولده ووفاته (132-220 ه) كما أثبته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13742}."
 en: "Adam ibn Abi Iyas, whose father was Abd al-Rahman ibn Muhammad ibn Shu'ayb, Abu al-Hasan al-Asqalani al-Khurasani al-Marwazi, a memorizer and imam called the shaykh of Sham, known for holding fast to the Sunna. He narrated from Abu Dhi'b, Mubarak ibn Fadala and Shu'ba, and al-Bukhari, Ahmad ibn al-Azhar, Abu Zur'a and Abu Hatim narrated from him. Abu Hatim called him trustworthy and reliable; Ahmad ibn Hanbal said he held a strong place with Shu'ba. He sought hadith in Baghdad, travelled to Kufa, Basra, the Hijaz, Egypt and Sham, and settled in Asqalan until he died there. The book gives his dates as 132-220 AH {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13742}."
 ur: "آدم بن ابی ایاس، جن کے والد کا نام عبد الرحمن بن محمد بن شعیب تھا، ابو الحسن عسقلانی خراسانی مروزی، حافظ اور امام، شام کے شیخ، سنت پر سختی سے قائم رہنے والے۔ انہوں نے ابو ذئب، مبارک بن فضالہ اور شعبہ سے روایت کی، اور بخاری، احمد بن ازہر، ابو زرعہ اور ابو حاتم نے ان سے روایت کی۔ ابو حاتم نے انہیں ثقہ اور مامون کہا۔ انہوں نے بغداد میں حدیث طلب کی، کوفہ، بصرہ، حجاز، مصر اور شام کا سفر کیا، اور عسقلان میں مقیم ہو کر وہیں وفات پائی۔ کتاب ان کی تاریخ پیدائش و وفات 132 تا 220 ہجری بیان کرتی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13742}۔"
