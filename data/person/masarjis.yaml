  tr: "Masergis, Süryaniceden Arapçaya aktarıcı olan bir hekimdi. 'Yiyeceklerin Gücü, Faydaları ve Zararları' ve 'Yiyeceklerin Gücü, Faydaları ve Zararları' adlı kitabı yazdı. Ayrıca Süryanice'den 'Aharn the Priest Al-Kanash' kitabından alıntı yaparak otuz makalesine iki makale ekledi {cite:fihrist-ibn-al-nadim s. 413}."
  id: "Masergis adalah seorang dokter yang menjadi pemancar dari bahasa Siria ke bahasa Arab. Ia menulis buku 'Kekuatan Makanan, Manfaat dan Kerugian Mereka,' dan buku 'Kekuatan Makanan, Manfaat dan Bahayanya.' Ia juga mengutip buku 'Aharn the Priest Al-Kanash' dari bahasa Siria, menambahkan dua artikel ke tiga puluh artikelnya {cite:fihrist-ibn-al-nadim hlm. 413}."
