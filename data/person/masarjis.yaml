  ar: "ماسرجيس من الأطباء وكان ناقلا من السرياني إلى العربي وله كتاب قوى الأطعمة ومنافعها ومضارها وكتاب قوى المقاقير ومنافعها ومضارها، ونقل كتاب أهرن القس الكناش من السريانية وزاد على مقالاته الثلاثين مقالتين {cite:fihrist-ibn-al-nadim p. 413}."
