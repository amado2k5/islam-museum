summary:
  ar: "راجا محمود آباد في أوده ⁦(4 حزيران 1878 – 23 آذار 1931)⁩، من كبار ملّاك الأراضي والسياسيين في الهند البريطانية. خلف أباه محمد أمير حسن خان سنة 1903 على واحدة من أكبر إقطاعيات المقاطعات المتحدة، وشارك في تأسيس جامعة لكهنؤ، وكان أول نائب رئيس لجامعة عليكرة الإسلامية (1920–1923)، ورأس مؤتمرات رابطة مسلمي عموم الهند ⁦(1917 و1918 و1928)⁩، وأسس سنة 1919 مدرسة الواعظين في لكهنؤ — مركزًا للتعليم الإسلامي الشيعي — تخليدًا لذكرى أخيه، وكتب المراثي بتخلّص «محب»."
  en: "Raja of Mahmudabad in Oudh (4 June 1878 – 23 March 1931), among the largest landholders and a noted politician of British India. He succeeded his father Mohammad Amir Hasan Khan in 1903 to one of the largest estates of the United Provinces, helped found Lucknow University, was the first vice-chancellor of Aligarh Muslim University (1920–1923), presided over Muslim League conferences (1917, 1918, 1928), founded in 1919 the Madrasatul Waizeen in Lucknow — a centre of Shia Islamic education — in memory of his brother, and wrote marsia poetry under the pen name Mohib."
  ur: "اودھ کے راجا صاحب محمود آباد ⁦(4 جون 1878 – 23 مارچ 1931)⁩، برطانوی ہندوستان کے بڑے زمینداروں اور مشہور سیاست دانوں میں سے ایک۔ 1903 میں والد محمد امیر حسن خان کے جانشین بنے؛ لکھنؤ یونیورسٹی کے قیام میں حصہ لیا، علی گڑھ مسلم یونیورسٹی کے پہلے وائس چانسلر رہے (1920–1923)، مسلم لیگ کے اجلاسوں کی صدارت کی، 1919 میں اپنے بھائی کی یاد میں لکھنؤ میں مدرسۃ الواعظین قائم کیا — اہل تشیع کی تعلیم کا مرکز — اور «محب» تخلص سے مرثیے لکھے۔"
  es: "Raja de Mahmudabad en Oudh (4 de junio de 1878 - 23 de marzo de 1931), uno de los mayores terratenientes y un destacado político de la India británica. Sucedió a su padre, Mohammad Amir Hasan Khan, en 1903, en una de las mayores propiedades de las Provincias Unidas, ayudó a fundar la Universidad de Lucknow, fue el primer vicerrector de la Universidad Musulmana de Aligarh (1920-1923), presidió conferencias de la Liga Musulmana (1917, 1918, 1928), fundó en 1919 la Madrasatul Waizeen en Lucknow —un centro de educación islámica chiíta— en memoria de su hermano, y escribió poesía marsia bajo el seudónimo de Mohib."
  fr: "Raja de Mahmudabad dans l'Oudh (4 juin 1878 – 23 mars 1931), l'un des plus grands propriétaires terriens et un homme politique de renom de l'Inde britannique. Il succéda à son père, Mohammad Amir Hasan Khan, en 1903, à la tête de l'un des plus vastes domaines des Provinces-Unies, contribua à la fondation de l'université de Lucknow, fut le premier vice-chancelier de l'université musulmane d'Aligarh (1920-1923), présida les conférences de la Ligue musulmane (1917, 1918, 1928), fonda en 1919 la Madrasatul Waizeen à Lucknow – un centre d'éducation islamique chiite – en mémoire de son frère, et écrivit de la poésie marsia sous le pseudonyme de Mohib."
  tr: "Oudh'daki Raja Mahmudabad (4 Haziran 1878 – 23 Mart 1931), Britanya Hindistanı'nın önde gelen toprak sahipleri ve siyasetçilerinden biriydi. 1903'te babası Muhammed Emir Hassan Khan'ın yerine Birleşik Eyaletler'in en büyük topraklarından biri oldu, Lucknow Üniversitesi'nin kuruluşuna katıldı, Aligarh İslam Üniversitesi'nin ilk başkan yardımcısı oldu (1920–1923), Tüm Hindistan Müslüman Birliği konferanslarına başkanlık etti (1917, 1918 ve 1928) ve 1919'da kardeşinin anısına Lucknow'da Şii İslami eğitim merkezi olan Vaizler Okulu'nu kurdu. Khulsaf 'Mohib' ile birlikte ağıtlar yazdı."
  id: "Raja Mahmudabad di Oudh (4 Juni 1878 – 23 Maret 1931), adalah salah satu pemilik tanah dan politisi terkemuka di India Britania. Pada tahun 1903, ia menggantikan ayahnya Muhammad Amir Hassan Khan sebagai salah satu wilayah terbesar di United Provinces, berpartisipasi dalam pendirian Universitas Lucknow, menjadi wakil presiden pertama Aligarh Islamic University (1920–1923), memimpin konferensi All India Muslim League (1917, 1918, dan 1928), dan pada tahun 1919 mendirikan School of Preachers di Lucknow—sebuah pusat pendidikan Islam Syiah—untuk mengenang saudaranya. Ia menulis elegi bersama khulsaf 'Mohib'."
