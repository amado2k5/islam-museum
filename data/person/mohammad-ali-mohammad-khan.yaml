summary:
  ar: "راجا محمود آباد في أوده (4 حزيران 1878 – 23 آذار 1931)، من كبار ملّاك الأراضي والسياسيين في الهند البريطانية. خلف أباه محمد أمير حسن خان سنة 1903 على واحدة من أكبر إقطاعيات المقاطعات المتحدة، وشارك في تأسيس جامعة لكهنؤ، وكان أول نائب رئيس لجامعة عليكرة الإسلامية (1920–1923)، ورأس مؤتمرات رابطة مسلمي عموم الهند (1917 و1918 و1928)، وأسس سنة 1919 مدرسة الواعظين في لكهنؤ — مركزًا للتعليم الإسلامي الشيعي — تخليدًا لذكرى أخيه، وكتب المراثي بتخلّص «محب»."
  en: "Raja of Mahmudabad in Oudh (4 June 1878 – 23 March 1931), among the largest landholders and a noted politician of British India. He succeeded his father Mohammad Amir Hasan Khan in 1903 to one of the largest estates of the United Provinces, helped found Lucknow University, was the first vice-chancellor of Aligarh Muslim University (1920–1923), presided over Muslim League conferences (1917, 1918, 1928), founded in 1919 the Madrasatul Waizeen in Lucknow — a centre of Shia Islamic education — in memory of his brother, and wrote marsia poetry under the pen name Mohib."
  ur: "اودھ کے راجا صاحب محمود آباد (4 جون 1878 – 23 مارچ 1931)، برطانوی ہندوستان کے بڑے زمینداروں اور مشہور سیاست دانوں میں سے ایک۔ 1903 میں والد محمد امیر حسن خان کے جانشین بنے؛ لکھنؤ یونیورسٹی کے قیام میں حصہ لیا، علی گڑھ مسلم یونیورسٹی کے پہلے وائس چانسلر رہے (1920–1923)، مسلم لیگ کے اجلاسوں کی صدارت کی، 1919 میں اپنے بھائی کی یاد میں لکھنؤ میں مدرسۃ الواعظین قائم کیا — اہل تشیع کی تعلیم کا مرکز — اور «محب» تخلص سے مرثیے لکھے۔"
