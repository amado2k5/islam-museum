id: person/al-izz-ibn-abd-al-ghani
class: person
label: { ar: "العز بن عبد الغني", en: "al-Izz ibn Abd al-Ghani", es: "al-Izz ibn Abd al-Ghani", fr: "al-Izz ibn Abd al-Ghani", ur: "العز بن عبد الغنی" }
summary:
  ar: "العز محمد بن الحافظ عبد الغني بن عبد الواحد المقدسي الحافظ ابن الحافظ أبو الفتح؛ ولد سنة ست وستين وخمسمائة ورحل إلى بغداد وهو مراهق فسمع من ابن شامل وطبقته وسمع بدمشق وارتحل إلى أصبهان وكان موصوفاً بحسن القراءة وجودة الحفظ والفهم؛ قال الضياء كان حافظاً فقيهاً حنبلياً ذا فنون ثم وصفه بالديانة المتينة والمروءة التامة، وقال أبو شامة صحب الملك المعظم عيسى وسمع بقراءته الكثير وكان حافظاً ديناً زاهداً ورعاً؛ روى عنه ابنا تقي الدين أحمد وعز الدين عبد الرحمن والضياء والشهاب القوصي وشمس الدين عبد الرحمن بن أبي عمر وابن البخاري؛ توفي ليلة الاثنين تاسع عشر شوال سنة ثلاث عشرة وستمائة ودفن بسفح قاسيون، وقال الضياء كنا نقرأ عنده ليلة مات فرأيت على بطنه نوراً مثل السراج {cite:shadharat-dhahab p. 56-57}."
  en: "Al-Izz Muhammad, Abu al-Fath, son of the hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi, himself a hafiz and son of a hafiz. Born in 566, he travelled to Baghdad as a youth and heard from Ibn Shamil and his generation; he also heard in Damascus and then travelled to Isfahan. He was described as fine in recitation and sound in memory and understanding. Al-Diya said he was a hafiz, a Hanbali jurist and versed in many fields, and then described him as firmly pious and of complete integrity. Abu Shama said he accompanied al-Malik al-Mu'azzam Isa and heard much through his recitation, a pious, ascetic and scrupulous hafiz. Narrating from him were the two sons, Taqi al-Din Ahmad and Izz al-Din Abd al-Rahman, al-Diya, al-Shihab al-Qusi, Shams al-Din Abd al-Rahman ibn Abi Umar and Ibn al-Bukhari. He died on the night of Monday, 19 Shawwal 613, and was buried at the foot of Qasiyun. Al-Diya said: 'We were reading with him on the night he died, and I saw on his belly a light like a lamp' {cite:shadharat-dhahab p. 56-57}."
  es: "Al-Izz Muhammad, Abu al-Fath, hijo del hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi, también hafiz e hijo de otro hafiz. Nacido en 566, viajó a Bagdad en su juventud y escuchó a Ibn Shamil y a su generación; también escuchó en Damasco y luego viajó a Isfahán. Se le describió como un maestro de recitación, con una memoria y comprensión sólidas. Al-Diya afirmó que era un hafiz, un jurista hanbalí y versado en muchos campos, y lo describió como un hombre profundamente piadoso y de completa integridad. Abu Shama dijo que acompañó a al-Malik al-Mu'azzam Isa y aprendió mucho a través de su recitación; era un hafiz piadoso, ascético y escrupuloso. Narraron sus relatos sus dos hijos, Taqi al-Din Ahmad e Izz al-Din Abd al-Rahman, al-Diya, al-Shihab al-Qusi, Shams al-Din Abd al-Rahman ibn Abi Umar e Ibn al-Bukhari. Falleció la noche del lunes 19 de Shawwal de 613 y fue enterrado al pie de Qasiyun. Al-Diya dijo: «Estábamos leyendo con él la noche de su muerte, y vi en su vientre una luz como la de una lámpara» {cita: shadharat-dhahab, págs. 56-57}."
  fr: "Al-Izz Muhammad, Abu al-Fath, fils du hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi, lui-même hafiz et fils de hafiz, naquit en 566. Jeune homme, il se rendit à Bagdad où il reçut l'enseignement d'Ibn Shamil et de sa génération. Il poursuivit son enseignement à Damas, puis se rendit à Ispahan. On le disait excellent en récitation, doté d'une mémoire et d'une compréhension remarquables. Al-Diya le décrit comme un hafiz, un juriste hanbalite versé dans de nombreux domaines, et le présente comme un homme profondément pieux et d'une intégrité sans faille. Abu Shama rapporte avoir accompagné al-Malik al-Mu'azzam Isa et avoir beaucoup appris de sa récitation; il s'agissait d'un hafiz pieux, ascétique et scrupuleux. Ont rapporté de lui ses deux fils, Taqi al-Din Ahmad et Izz al-Din Abd al-Rahman, ainsi qu'al-Diya, al-Shihab al-Qusi, Shams al-Din Abd al-Rahman ibn Abi Umar et Ibn al-Bukhari. Il mourut dans la nuit du lundi 19 Shawwal 613 et fut enterré au pied du mont Qasiyun. Al-Diya dit: « Nous lisions avec lui la nuit de sa mort, et j'aperçus sur son ventre une lumière semblable à une lampe. » (Voir: Hadharat-Dhahab, p. 56-57)."
  ur: "العز محمد، ابو الفتح، حافظ عبد الغنی بن عبد الواحد المقدسی کا بیٹا، خود ایک حافظ اور حافظ کا بیٹا ہے۔ 566 میں پیدا ہوئے، اس نے جوانی میں بغداد کا سفر کیا اور ابن شمل اور اس کی نسل سے سنا۔ اس نے دمشق میں بھی سنا اور پھر اصفہان کا سفر کیا۔ اسے تلاوت میں عمدہ اور یادداشت اور سمجھ میں آواز میں بیان کیا گیا تھا۔ الدیہ نے کہا کہ وہ ایک حافظ، ایک حنبلی فقیہ اور بہت سے شعبوں میں مہارت رکھتا ہے، اور پھر اسے پختہ تقویٰ اور مکمل دیانت دار قرار دیا۔ ابو شمع نے کہا کہ وہ المالک المعظم عیسیٰ کے ساتھ گئے اور ان کی تلاوت کے ذریعے بہت کچھ سنا، ایک متقی، پرہیزگار اور پرہیزگار حافظ۔ ان سے دو بیٹے تقی الدین احمد اور عزالدین عبدالرحمٰن، الدیہ، الشہاب القوسی، شمس الدین عبد الرحمن ابن ابی عمر اور ابن البخاری روایت کرتے ہیں۔ آپ کا انتقال پیر کی رات 19 شوال 613 کو ہوا اور قصیون کے دامن میں دفن ہوئے۔ الدیہ نے کہا: جس رات ان کی وفات ہوئی ہم اس کے ساتھ پڑھ رہے تھے اور میں نے ان کے پیٹ پر چراغ کی طرح روشنی دیکھی۔ 56-57}۔"
  tr: "El-'İzz Muhammed bin el-Hafız Abdül-Gani ibn Abd al-Wahid al-Maqdisi, el-Hafız bin el-Hafız Ebu el-Feth; 566 Hicri yılında doğdu, gençliğinde Bağdat'a seyahat etti. İbn Şamil'den haber aldı, onunla çalıştı ve İsfahan'a gitti. İyi bir okuma, mükemmel ezberleme ve anlayışa sahip olduğu söylendi; El-Diya onun bir ezberci, Hanbali hukukçusu ve çeşitli bilimlerin alimi olduğunu söyledi. Onu güçlü bir dine ve tam bir şövalyeliğe sahip biri olarak tanımladı. Ebu Şama şöyle dedi: Büyük Kral İsa'ya eşlik etti, onun okunmasından çok şey duydu, ezberci, zahi ve dindar biriydi; ondan dindar bir oğul anlatıldı. El-Din Ahmed, İzzeddin Abdülrahman, el-Diya, el-Şihab el-Kusi, Şemseddin Abdülrahman bin Ebi Ömer ve İbn el-Buhari; 600 Hile yılında, Şevval'ın on dokuzuncusu Pazartesi gecesi vefat etti ve Kasiun eteğine defnedildi. El-Diya' şöyle dedi: Ölüm gecesi evinde okuyorduk ve karnında bir lamba gibi bir ışık gördüm {atıf:şadharat-dhahab, s. 56-57}."
  id: "Al-'Izz Muhammad ibn al-Hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi, al-Hafiz ibn al-Hafiz Abu al-Fath; lahir pada tahun 566 H, ia melakukan perjalanan ke Baghdad saat remaja. Ia mendengar kabar dari Ibn Shamil, belajar bersamanya, dan pergi ke Isfahan. Ia digambarkan memiliki kemampuan membaca yang baik, hafalan yang sangat baik, dan pemahaman; Al-Diya mengatakan ia adalah seorang penghafal, ahli hukum Hanbali, dan sarjana berbagai ilmu. Ia menggambarkan Shamil sebagai seorang yang memiliki agama yang kuat dan kesatria yang sempurna. Abu Shama berkata: Ia menemani Raja Isa yang agung, banyak mendengar dari bacaannya, dan merupakan seorang hafal, pertapa yang taat, dan taat; seorang putra yang saleh menceritakan darinya. Al-Din Ahmad, Izz al-Din Abd al-Rahman, al-Diya, al-Shihab al-Qusi, Shams al-Din Abd al-Rahman ibn Abi Umar, dan Ibn al-Bukhari; ia meninggal pada malam Senin, tanggal 19 Shawwal, tahun 600 H, dan dimakamkan di kaki Qasioun. Al-Diya berkata: Kami biasa membaca di tempatnya pada malam kematiannya, dan aku melihat cahaya di perutnya seperti lampu {cite:shadharat-dhahab, hlm. 56-57}."
