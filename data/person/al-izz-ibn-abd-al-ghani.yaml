label: { ar: "العز بن عبد الغني", en: "al-Izz ibn Abd al-Ghani" }
summary:
  ar: "العز محمد بن الحافظ عبد الغني بن عبد الواحد المقدسي الحافظ ابن الحافظ أبو الفتح؛ ولد سنة ست وستين وخمسمائة ورحل إلى بغداد وهو مراهق فسمع من ابن شامل وطبقته وسمع بدمشق وارتحل إلى أصبهان وكان موصوفاً بحسن القراءة وجودة الحفظ والفهم؛ قال الضياء كان حافظاً فقيهاً حنبلياً ذا فنون ثم وصفه بالديانة المتينة والمروءة التامة، وقال أبو شامة صحب الملك المعظم عيسى وسمع بقراءته الكثير وكان حافظاً ديناً زاهداً ورعاً؛ روى عنه ابنا تقي الدين أحمد وعز الدين عبد الرحمن والضياء والشهاب القوصي وشمس الدين عبد الرحمن بن أبي عمر وابن البخاري؛ توفي ليلة الاثنين تاسع عشر شوال سنة ثلاث عشرة وستمائة ودفن بسفح قاسيون، وقال الضياء كنا نقرأ عنده ليلة مات فرأيت على بطنه نوراً مثل السراج {cite:shadharat-dhahab p. 56-57}."
  en: "Al-Izz Muhammad, Abu al-Fath, son of the hafiz Abd al-Ghani ibn Abd al-Wahid al-Maqdisi, himself a hafiz and son of a hafiz. Born in 566, he travelled to Baghdad as a youth and heard from Ibn Shamil and his generation; he also heard in Damascus and then travelled to Isfahan. He was described as fine in recitation and sound in memory and understanding. Al-Diya said he was a hafiz, a Hanbali jurist and versed in many fields, and then described him as firmly pious and of complete integrity. Abu Shama said he accompanied al-Malik al-Mu'azzam Isa and heard much through his recitation, a pious, ascetic and scrupulous hafiz. Narrating from him were the two sons, Taqi al-Din Ahmad and Izz al-Din Abd al-Rahman, al-Diya, al-Shihab al-Qusi, Shams al-Din Abd al-Rahman ibn Abi Umar and Ibn al-Bukhari. He died on the night of Monday, 19 Shawwal 613, and was buried at the foot of Qasiyun. Al-Diya said: 'We were reading with him on the night he died, and I saw on his belly a light like a lamp' {cite:shadharat-dhahab p. 56-57}."
