names:
  - { value: "هلال بن المحسن بن إبراهيم بن هلال أبو الحسين الكاتب الصابئ", kind: full }
summary:
  ar: "كاتب ومؤرخ، ابن المؤرخ المحسن بن إبراهيم الصابئ وابن أخ المؤرخ الشهير غرس النعمة هلال بن المحسن؛ وُلد سنة تسع وخمسين وثلاثمائة، وسمع أبا علي الفارسي وعلي بن عيسى الرماني، وكان صدوقًا. ذكر سبب إسلامه على لسانه: أن أباه المحسن كان صابئًا فأسلم هلال متأخرًا بعد رؤيا في المنام سنة ٣٩٩ رأى فيها أنه يتوضأ ويصلي خلف رسول الله، ثم رآه ثانية على دجلة في مشرعة باب البستان يعاتبه على التوقف، فاغتسل وجثا إلى المشهد وصلى وزال عنه الشك؛ وأسلم رسميًا سنة ٤٠٣ فاستحسن الناس إسلامه، وبعث إليه فخر الملك بدست ثياب ومائتي دينار فردّها وقال ما أحب أن أخلط بفعلي شيئًا من الدنيا. صنّف التكملة في التاريخ — تكملة تاريخ الطبري من حيث انتهى إلى أيامه — وكانت له يد في الأدب والشعر. توفي في رمضان سنة ثمان وأربعين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.518-521}."
  en: "The last historian of the great Sabi' katib family — son of the historian al-Muhassin and nephew of Ghars al-Ni'ma Hilal: born 359, raised Sabian, he converted to Islam in 403 after a series of dreams he related himself, refusing the vizier Fakhr al-Mulk's celebratory gift 'lest he mix worldly things in the deed'; author of the Takmila continuing al-Tabari's annals to his own day. Died Ramadan 448 {cite:muntazam-ibn-al-jawzi j.8 p.518-521}."
