id: person/khattan-ibn-munqidh
class: person
label: { ar: "حطان بن منقذ", en: "Khattan ibn Munqidh", es: "Khattan ibn Munqidh", fr: "Khattan ibn Munqidh", ur: "خطان بن منقد" }
summary:
  ar: "حطان بن منقذ من أهل اليمن، تقوّى بالبلاد على عز الدين عثمان الزنجبيلي متولي عدن حتى خافه وكتب إلى صلاح الدين يشير بإرسال أهله إليها؛ فلما قدم سيف الإسلام طغتكين سنة ثمان وسبعين وخمسمائة تحصن حطان في بعض القلاع فلم يزل يؤمنه ويهدي إليه ويتلطفه حتى نزل إليه، فأحسن صحبته وعمل معه ما لم يكن يتوقعه من الإحسان، فلم يثق به وطلب دستوراً ليقصد الشام فامتنع إظهاراً للرغبة في كونه عنده حتى أذن له، فأخرج أثقاله وأمواله ودوابه وأهله وأصحابه وسير الجميع بين يديه، فلما دخل ليودعه قبض عليه واسترجع جميع ماله — وكان فيه الذهب العين في سبعين غلافاً زردية — ثم سجنه في بعض القلاع وكان آخر العهد به وقيل إنه قتله {cite:kamil-ibn-al-athir p. 111-112}."
  en: "Khattan ibn Munqidh, the Yemeni strongman who overshadowed Aden's governor — won down from his fort by Tughrakin's feigned generosity, granted leave to go to Syria, then seized on his farewell visit and stripped of everything including seventy mail-bags of gold; he ended in a citadel prison, killed it was said {cite:kamil-ibn-al-athir p. 111-112}."
  es: "Khattan ibn Munqidh, el caudillo yemení que eclipsó al gobernador de Adén, fue persuadido para que bajara de su fortaleza por la fingida generosidad de Tughrakin, se le concedió permiso para ir a Siria, pero aprovechó su visita de despedida y lo despojó de todo, incluyendo setenta sacos de correo llenos de oro; terminó en una prisión de la ciudadela, donde, según se dice, fue asesinado {cite:kamil-ibn-al-athir p. 111-112}."
  fr: "Khattan ibn Munqidh, le puissant homme yéménite qui éclipsait le gouverneur d'Aden, fut conquis et chassé de son fort par la fausse générosité de Tughrakin, qui lui accorda la permission d'aller en Syrie, puis profita de sa visite d'adieu pour le dépouiller de tout, y compris de soixante-dix sacs postaux d'or; il finit dans une prison de citadelle, tué, dit-on {cite:kamil-ibn-al-athir p. 111-112}."
  ur: "عدن کے گورنر کو زیر سایہ کرنے والا یمنی طاقت ور ختن ابن منقذ - طغرکین کی فراخ دلی سے اپنے قلعے سے گرا، شام جانے کی اجازت دی، پھر اس کے الوداعی دورے پر قبضہ کر لیا اور سونے کے ستر میل تھیلوں سمیت ہر چیز چھین لی۔ اس کا خاتمہ قلعہ کی جیل میں ہوا، اسے قتل کر دیا گیا۔ 111-112}۔"
  tr: "Yemenli Hattan ibn Munqidh, Aden valisi İzzeddin Osman el-Zencebili karşısında ülkede güçlüydü; ta ki ondan korkup Salahdin'e halkını oraya göndermesini emreden bir mektup yazana kadar. Seyf el-İslam 578 Hicri yılında Tuğtekin'e geldiğinde, Hattan bazı kalelerde kendini tahkim etti, ancak onu korumaya, rehberlik etmeye ve nazikçe davranmaya devam etti, ta ki ona gelene kadar. Onunla iyi dost oldu ve beklemediği iyilikleri yaptı. Ona güvenmedi ve Levant'a gitmek için bir anayasa talep etti, ancak Seyf reddetti, izin verilene kadar yanında kalmak istediğini göstererek sınır dışı edildi. Yükleri, serveti, hayvanları, ailesi, yoldaşları ve tüm yolculukları önündeydi. Veda etmek için içeri girdiğinde onu tutukladı ve tüm eşyalarını—yetmiş sarı kılıflı altını dahil—geri aldı, ardından bazı kalelere hapsetti; bu kaleler onun saltanatının sonuydu ve söylenir ki onu öldürdü {atıf:Kamil-ibn-al-Athir s. 111-112}."
  id: "Hattan ibn Munqidh dari Yaman sangat kuat di negara itu melawan Izz al-Din Uthman al-Zanjabili, gubernur Aden, sampai ia takut kepadanya dan menulis surat kepada Salah al-Din untuk mengirim rakyatnya ke sana. Ketika Saif al-Islam tiba di Tughtekin pada tahun 578 H, Hattan memperkuat dirinya di beberapa benteng, tetapi ia terus melindungi, membimbing, dan menyayanginya sampai ia datang kepadanya. Ia berteman baik dengannya dan melakukan apa yang tidak ia harapkan dalam hal kebaikan. Ia tidak mempercayainya dan meminta konstitusi untuk pergi ke Levant, tetapi ia menolak, menunjukkan keinginannya untuk tinggal bersamanya sampai izin diberikan, sehingga ia diusir. Bebannya, kekayaan, hewan, keluarga, teman, dan semua perjalanannya ada di hadapannya. Ketika ia masuk untuk mengucapkan selamat tinggal, ia menangkapnya dan mengambil kembali semua hartanya—termasuk emas dalam tujuh puluh sarung kuning—lalu memenjarakannya di beberapa benteng, yang merupakan yang terakhir dari masa pemerintahannya, dan dikatakan ia membunuhnya {cite:kamil-ibn-al-athir hlm. 111-112}."
