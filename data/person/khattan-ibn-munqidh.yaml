id: person/khattan-ibn-munqidh
class: person
label: { ar: "حطان بن منقذ", en: "Khattan ibn Munqidh" }
summary:
  ar: "حطان بن منقذ من أهل اليمن، تقوّى بالبلاد على عز الدين عثمان الزنجبيلي متولي عدن حتى خافه وكتب إلى صلاح الدين يشير بإرسال أهله إليها؛ فلما قدم سيف الإسلام طغتكين سنة ثمان وسبعين وخمسمائة تحصن حطان في بعض القلاع فلم يزل يؤمنه ويهدي إليه ويتلطفه حتى نزل إليه، فأحسن صحبته وعمل معه ما لم يكن يتوقعه من الإحسان، فلم يثق به وطلب دستوراً ليقصد الشام فامتنع إظهاراً للرغبة في كونه عنده حتى أذن له، فأخرج أثقاله وأمواله ودوابه وأهله وأصحابه وسير الجميع بين يديه، فلما دخل ليودعه قبض عليه واسترجع جميع ماله — وكان فيه الذهب العين في سبعين غلافاً زردية — ثم سجنه في بعض القلاع وكان آخر العهد به وقيل إنه قتله {cite:kamil-ibn-al-athir p. 111-112}."
  en: "Khattan ibn Munqidh, the Yemeni strongman who overshadowed Aden's governor — won down from his fort by Tughrakin's feigned generosity, granted leave to go to Syria, then seized on his farewell visit and stripped of everything including seventy mail-bags of gold; he ended in a citadel prison, killed it was said {cite:kamil-ibn-al-athir p. 111-112}."
