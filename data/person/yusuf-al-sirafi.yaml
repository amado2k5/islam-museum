summary:
  ar: "أبو محمد يوسف بن أبي سعيد السيرافي، النحوي اللغوي الأخباري الفاضل ابن الفاضل؛ تصدر في مجلس أبيه بعد موته وخلفه على ما كان عليه، وأكمل كتاب أبيه «الإقناع» الذي مات قبل إتمامه فكأنه ثمرة استفادة أبيه حال تصنيف شرح كتاب سيبويه، فإذا تأمله المنصف لم يجد بين اللفظين والقصدين تفاوتاً كثيراً؛ وصنف عدة كتب في شرح أبيات استشهادات الكتب المشهورة مثل «شرح أبيات كتاب سيبويه» وهو الغاية في بابه وبسطه، و«شرح أبيات إصلاح المنطق» وأجاد فيه، و«شرح أبيات المجاز» لأبي عبيدة وأبيات معاني الزجاج، و«شرح أبيات غريب المصنف» لأبي عبيد القاسم بن سلام {cite:wafayat-ayan p. 72-73}. وحكى المعري أنه كان سماناً فلما تغير وجهه يوم صوّب أباه في مجلسه نهض إلى دكانه فباعها واشتغل بالعلم حتى برع فيه وبلغ الغاية، وحدث المعري من رآه وبين يديه أربعمائة ديوان وهو يعمل شرح إصلاح المنطق {cite:wafayat-ayan p. 73}."
  en: "Abu Muhammad Yusuf al-Sirafi — 'the excellent son of the excellent', who succeeded his father Abu Sa'id in his majlis, completed his al-Iqna', and wrote the indispensable commentary on Sibawayh's verses plus shuruh on Islah al-Mantiq, al-Majaz and Gharib al-Musannaf; al-Ma'arri tells he abandoned his grocer's shop in a flash of wounded pride and worked with four hundred diwans open before him {cite:wafayat-ayan p. 72-74}."
  es: "Abu Muhammad Yusuf al-Sirafi — 'el excelente hijo del excelente', quien sucedió a su padre Abu Sa'id en su majlis, completó su al-Iqna' y escribió el indispensable comentario sobre los versos de Sibawayh, además de shuruh sobre Islah al-Mantiq, al-Majaz y Gharib al-Musannaf; al-Ma'arri dice que abandonó su tienda de comestibles en un destello de orgullo herido y trabajó con cuatrocientos diwanes abiertos ante él {cite:wafayat-ayan p. 72-74}."
  fr: "Abu Muhammad Yusuf al-Sirafi — « l'excellent fils de l'excellent », qui succéda à son père Abu Sa'id dans son majlis, acheva son al-Iqna' et écrivit le commentaire indispensable sur les versets de Sibawayh ainsi que le shuruh sur Islah al-Mantiq, al-Majaz et Gharib al-Musannaf; al-Ma'arri raconte qu'il abandonna son épicerie dans un éclair de fierté blessée et travailla avec quatre cents diwans ouverts devant lui {cite:wafayat-ayan p. 72-74}."
  ur: "ابو محمد یوسف السرافی - 'بہترین کا بہترین بیٹا'، جس نے اپنی مجلس میں اپنے والد ابو سعید کے بعد اپنا الاقنا مکمل کیا، اور سباویہ کی آیات کے علاوہ اصلاح المنطق، المجاز اور غریب المصنف پر ناگزیر تفسیر لکھی۔ المعری بتاتا ہے کہ اس نے زخمی فخر کے عالم میں اپنی پنساری کی دکان چھوڑ دی اور اس کے سامنے چار سو دیوان کھلے رکھ کر کام کیا۔ 72-74}۔"
  tr: "Ebu Muhammed Yusuf bin Abi Seyid el-Sirafi, erdemli dilbilimci, dilbilimci ve haber değeri taşıyan el-Fadil'in oğlu, babasının ölümünden sonra sarayda liderliği üstlendi ve olduğu gibi onun yerine geçti. Babası tarafından yazılmış yorum yazan babasının yararının meyvesiymiş gibi bitirmeden önce öldüğü \"El-İkna'\" kitabını tamamladı. Adil sınav bunu düşündüğünde, iki kelime ile niyet arasında çok az fark buldu. Yazarı \"Şerh Ayat al-Kitab Sibawayh\" gibi ünlü atıfların dizelerini açıklayan birkaç kitap, bölümü ve kapsamı açısından en üst düzeydir; \"Şerh Ayat İslah el-Mantiq\" ve bu kitapta üstün başarı göstermiştir; Abu Ubeyde'nin \"Şerh Abyaat el-Majaz\" ve Ma'ani al-Zajjaj'ın dizeleri, Ebu Ubeyd el-Kasım bin Selam'ın \"Şerh Abat Harib el-Musannaf\" (alıntı:) Wafayat-Ayan, s. 72-73}. Al-Ma'arri, şişman olduğunu anlattı. Bir gün yüzü değiştiğinde, babasını toplantıya yönlendirdi, dükkanına gitti, sattı ve bilgiye kendini adadı, sonunda üstün olup en yüksek seviyeye ulaştı. Al-Ma'arri, mantığın reformunu açıklamaya çalışırken elinde dört yüz koleksiyonla gördüklerine anlattı {atıf:wafayat-ayan, s. 73}."
  id: "Abu Muhammad Yusuf ibn Abi Sa'id al-Sirafi, seorang ahli tata bahasa, ahli bahasa, dan putra al-Pamil yang berbudi luhur, memimpin di istana ayahnya setelah kematiannya dan menggantikannya sebagaimana mestinya. Ia menyelesaikan buku ayahnya \"Al-Iqna\", yang ia wafat sebelum menyelesaikannya, seolah-olah itu adalah buah dari manfaat ayahnya saat menulis komentar atas buku Sibawayh. Jika pemeriksa yang adil memikirkannya, ia menemukan sedikit perbedaan antara kedua kata dan niat tersebut. Ia menulis beberapa buku yang menjelaskan ayat-ayat kutipan terkenal seperti \"Sharh Ayat al-Kitab Sibawayh,\" yang merupakan yang paling unggul dalam bab dan cakupannya, \"Sharh Ayat Ayat Islah al-Mantiq\" dan unggul dalam hal itu, \"Sharh Abyaat al-Majaz\" oleh Abu Ubaidah dan bait-bait Ma'ani al-Zajjaj, serta \"Sharh Abat Gharib al-Musannaf\" oleh Abu Ubayd al-Qasim ibn Salam {cite:Wafayat-Ayan, hlm. 72-73}. Al-Ma'arri menceritakan bahwa ia gemuk. Ketika wajahnya berubah suatu hari, ia memimpin ayahnya dalam pertemuan, ia pergi ke tokonya, menjualnya, dan mendedikasikan diri pada pengetahuan hingga ia unggul dan mencapai tingkat tertinggi. Al-Ma'arri menceritakan kepada mereka yang dilihatnya membawa empat ratus koleksi di tangannya saat ia sedang menjelaskan reformasi logika {cite:wafayat-ayan, hlm. 73}."
