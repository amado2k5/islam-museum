summary:
  ar: "أبو محمد يوسف بن أبي سعيد السيرافي، النحوي اللغوي الأخباري الفاضل ابن الفاضل؛ تصدر في مجلس أبيه بعد موته وخلفه على ما كان عليه، وأكمل كتاب أبيه «الإقناع» الذي مات قبل إتمامه فكأنه ثمرة استفادة أبيه حال تصنيف شرح كتاب سيبويه، فإذا تأمله المنصف لم يجد بين اللفظين والقصدين تفاوتاً كثيراً؛ وصنف عدة كتب في شرح أبيات استشهادات الكتب المشهورة مثل «شرح أبيات كتاب سيبويه» وهو الغاية في بابه وبسطه، و«شرح أبيات إصلاح المنطق» وأجاد فيه، و«شرح أبيات المجاز» لأبي عبيدة وأبيات معاني الزجاج، و«شرح أبيات غريب المصنف» لأبي عبيد القاسم بن سلام {cite:wafayat-ayan p. 72-73}. وحكى المعري أنه كان سماناً فلما تغير وجهه يوم صوّب أباه في مجلسه نهض إلى دكانه فباعها واشتغل بالعلم حتى برع فيه وبلغ الغاية، وحدث المعري من رآه وبين يديه أربعمائة ديوان وهو يعمل شرح إصلاح المنطق {cite:wafayat-ayan p. 73}."
  en: "Abu Muhammad Yusuf al-Sirafi — 'the excellent son of the excellent', who succeeded his father Abu Sa'id in his majlis, completed his al-Iqna', and wrote the indispensable commentary on Sibawayh's verses plus shuruh on Islah al-Mantiq, al-Majaz and Gharib al-Musannaf; al-Ma'arri tells he abandoned his grocer's shop in a flash of wounded pride and worked with four hundred diwans open before him {cite:wafayat-ayan p. 72-74}."
