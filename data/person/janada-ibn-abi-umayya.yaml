id: person/janada-ibn-abi-umayya
class: person
label: { ar: "جنادة بن أبي أمية الأزدي" }
summary:
  ar: "عند البلاذري: أحد من رُوي عنه الحديث ولقي أبا بكر وعمر ومعاذ بن جبل ومات في سنة ثمانين؛ بعثه معاوية إلى رودس ففتحها عنوة سنة ثلاث وخمسين وأنزلها قوماً من المسلمين وفتح أرواد سنة أربع وخمسين وغزا إقريطش فلما مات معاوية كتب إليه يزيد يأمره بهدم حصن رودس والقفل."
  en: "In al-Baladhuri: a hadith transmitter who met Abu Bakr, Umar and Mu'adh ibn Jabal and died in year 80; Mu'awiya sent him to Rhodes which he opened by force in year 53, settling Muslims in it, opened Arwad in year 54, and raided Crete — when Mu'awiya died Yazid wrote him ordering the fort's demolition and return."
  es: "En al-Baladhuri: un transmisor de hadices que conoció a Abu Bakr, Umar y Mu'adh ibn Jabal y murió en el año 80; Mu'awiya lo envió a Rodas, que abrió por la fuerza en el año 53, asentando musulmanes en ella, abrió Arwad en el año 54 y saqueó Creta; cuando Mu'awiya murió, Yazid le escribió ordenando la demolición y la devolución de la fortaleza."
  fr: "Dans al-Baladhuri: un transmetteur de hadiths qui a rencontré Abu Bakr, Umar et Mu'adh ibn Jabal et est mort en l'an 80; Mu'awiya l'a envoyé à Rhodes qu'il a ouverte par la force en l'an 53, y installant des musulmans, a ouvert Arwad en l'an 54 et a pillé la Crète — lorsque Mu'awiya est mort, Yazid lui a écrit pour lui ordonner la démolition du fort et son retour."
  ur: "البلاذری میں ہے: ایک حدیث کا ٹرانسمیٹر جو ابوبکر، عمر اور معاذ بن جبل سے ملا اور 80 میں فوت ہوا۔ معاویہ نے اسے روڈس بھیجا جسے اس نے سنہ 53 میں زبردستی کھولا، اس میں مسلمانوں کو آباد کیا، 54 میں ارواد کو کھولا، اور کریٹ پر چھاپہ مارا - جب معاویہ کا انتقال ہوا تو یزید نے اسے قلعہ کے انہدام اور واپسی کا حکم لکھا۔"
