summary:
  ar: "عند البلاذري: أحد من رُوي عنه الحديث ولقي أبا بكر وعمر ومعاذ بن جبل ومات في سنة ثمانين؛ بعثه معاوية إلى رودس ففتحها عنوة سنة ثلاث وخمسين وأنزلها قوماً من المسلمين وفتح أرواد سنة أربع وخمسين وغزا إقريطش فلما مات معاوية كتب إليه يزيد يأمره بهدم حصن رودس والقفل."
  en: "In al-Baladhuri: a hadith transmitter who met Abu Bakr, Umar and Mu'adh ibn Jabal and died in year 80; Mu'awiya sent him to Rhodes which he opened by force in year 53, settling Muslims in it, opened Arwad in year 54, and raided Crete — when Mu'awiya died Yazid wrote him ordering the fort's demolition and return."
