label: { ar: "بوران بنت الحسن بن سهل" }
summary:
  ar: "بوران بنت الحسن بن سهل، وعند ابن الجوزي توفيت في ربيع الأول سنة 271هـ وقد بلغت ثمانين سنة وكان لها الفطنة والذكاء {cite:muntazam-ibn-al-jawzi p. 82}"
  en: "زوجة المأمون، تزوجها سنة عشر بجهاز بلغ أربعين تكة مجوهرة وصناديق لآلئ ويواقيت ونثر أبوها صينية جوهراً بين يدي المأمون عند زفافها {cite:tarikh-khulafa-minhaj-1434 p. 487-488}."
  es: "La esposa de Al-Ma’mun, se casó con ella en el año diez con una dote de cuarenta brazaletes enjoyados y cajas de perlas y rubíes, y su padre esparció una bandeja de joyas en las manos de Al-Ma’mun en su boda {cite:tarikh-khulafa-minhaj-1434 p. 487-488}."
  fr: "L'épouse d'Al-Ma'mun, il l'épousa en l'an dix avec une dot de quarante bracelets ornés de bijoux et de boîtes de perles et de rubis, et son père répandit un plateau de bijoux dans les mains d'Al-Ma'mun lors de son mariage {cite:tarikh-khulafa-minhaj-1434 p. 487-488}."
  ur: "المامون کی بیوی، اس نے دس سال میں اس سے چالیس جواہر کنگنوں اور موتیوں اور یاقوت کے صندوقوں کے جہیز کے ساتھ شادی کی اور اس کے والد نے اس کی شادی میں المامون کے ہاتھ میں زیورات کی ایک ٹرے بکھیر دی۔ 487-488}۔"
  tr: "Buran bint al-Hasan ibn Sahl'a göre, 271 Hicri yılında Rabi el-Avval'da seksen yaşında öldü. Zekaya ve zekaya sahipti {alıntı:muntazam-ibn-al-jawzi, s. 82}"
  id: "Buran bint al-Hasan ibn Sahl, dan menurut Ibn al-Jawzi, ia meninggal di Rabi' al-Awwal pada tahun 271 H pada usia delapan puluh tahun. Ia memiliki kecerdasan dan kecerdasan {cite:muntazam-ibn-al-jawzi, hlm. 82}"
