summary:
  ar: "ماريت باشا، المعروف باسم أوغست ماريت، عالم آثار فرنسي مهتم بمصر القديمة. تذكر دائرة المعارف الإسلامية أن الخديوي إسماعيل أنشأ متحفاً بإدارته، وأن متحف الآثار المصرية القديمة الذي أسسه في بولاق يشغل مقره الحالي في ميدان التحرير منذ 1902 {cite:encyclopaedia-of-islam-2 vol. 4 p. 205} {cite:encyclopaedia-of-islam-2 vol. 4 p. 465}."
  en: "Mariette Pasha, Auguste Mariette, was a French archaeologist of ancient Egypt. The Encyclopaedia of Islam says the khedive Ismail founded a museum under his direction, and that the Museum of Egyptology he founded at Bulaq has stood in its present home in Midan al-Tahrir since 1902 {cite:encyclopaedia-of-islam-2 vol. 4 p. 205} {cite:encyclopaedia-of-islam-2 vol. 4 p. 465}."
  ur: "ماریٹ پاشا، یعنی اگست ماریٹ، قدیم مصر کے ماہرِ آثار فرانسیسی تھے۔ دائرۃ المعارف الاسلامیہ کے مطابق خدیو اسماعیل نے ان کی نگرانی میں عجائب گھر قائم کیا، اور بولاق میں ان کا قائم کردہ مصریات کا عجائب گھر 1902ء سے میدان التحریر میں اپنی موجودہ عمارت میں ہے {cite:encyclopaedia-of-islam-2 vol. 4 p. 205} {cite:encyclopaedia-of-islam-2 vol. 4 p. 465}."
