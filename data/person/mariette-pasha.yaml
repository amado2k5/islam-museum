summary:
  ar: "ماريت باشا، المعروف باسم أوغست ماريت، عالم آثار فرنسي مهتم بمصر القديمة. تذكر دائرة المعارف الإسلامية أن الخديوي إسماعيل أنشأ متحفاً بإدارته، وأن متحف الآثار المصرية القديمة الذي أسسه في بولاق يشغل مقره الحالي في ميدان التحرير منذ 1902 {cite:encyclopaedia-of-islam-2 vol. 4 p. 205} {cite:encyclopaedia-of-islam-2 vol. 4 p. 465}."
  en: "Mariette Pasha, Auguste Mariette, was a French archaeologist of ancient Egypt. The Encyclopaedia of Islam says the khedive Ismail founded a museum under his direction, and that the Museum of Egyptology he founded at Bulaq has stood in its present home in Midan al-Tahrir since 1902 {cite:encyclopaedia-of-islam-2 vol. 4 p. 205} {cite:encyclopaedia-of-islam-2 vol. 4 p. 465}."
  ur: "ماریٹ پاشا، یعنی اگست ماریٹ، قدیم مصر کے ماہرِ آثار فرانسیسی تھے۔ دائرۃ المعارف الاسلامیہ کے مطابق خدیو اسماعیل نے ان کی نگرانی میں عجائب گھر قائم کیا، اور بولاق میں ان کا قائم کردہ مصریات کا عجائب گھر 1902ء سے میدان التحریر میں اپنی موجودہ عمارت میں ہے {cite:encyclopaedia-of-islam-2 vol. 4 p. 205} {cite:encyclopaedia-of-islam-2 vol. 4 p. 465}."
  es: "Mariette Pasha, Auguste Mariette, fue un arqueólogo francés especializado en el antiguo Egipto. La Enciclopedia del Islam afirma que el jedive Ismail fundó un museo bajo su dirección, y que el Museo de Egiptología que fundó en Bulaq se encuentra en su ubicación actual en Midan al-Tahrir desde 1902 {cite:encyclopaedia-of-islam-2 vol. 4 p. 205} {cite:encyclopaedia-of-islam-2 vol. 4 p. 465}."
  fr: "Mariette Pacha, Auguste Mariette, était un archéologue français spécialiste de l'Égypte antique. L'Encyclopédie de l'Islam indique que le khédive Ismaïl fonda un musée sous sa direction, et que le Musée d'égyptologie qu'il créa à Boulaq se trouve à son emplacement actuel, place Tahrir, depuis 1902 {cite:encyclopaedia-of-islam-2 vol. 4 p. 205} {cite:encyclopaedia-of-islam-2 vol. 4 p. 465}."
  tr: "Marit Paşa, Auguste Maret olarak bilinen, antik Mısır ile ilgilenen Fransız bir arkeologdu. İslam Ansiklopedisi, Hidiv İsmail'in kendi yönetiminde bir müze kurduğunu ve Bulak'ta kurduğu Antik Mısır Antikaları Müzesi'nin 1902'den beri Tahrir Meydanı'nda bulunduğunu belirtmektedir {cite:Encyclopaedia-of-Islam-2 cilt 4, s. 205} {cite:Encyclopaedia-of-Islam-2 cilt 4, s. 465}."
  id: "Marit Pasha, yang dikenal sebagai Auguste Maret, adalah seorang arkeolog Prancis yang tertarik pada Mesir kuno. Ensiklopedia Islam mencatat bahwa Khedive Ismail mendirikan sebuah museum di bawah pengelolaannya, dan bahwa Museum Antik Mesir Kuno yang didirikannya di Bulaq saat ini telah berlokasi di Lapangan Tahrir sejak 1902 {cite:Encyclopaedia-of-Islam-2 vol. 4, hlm. 205} {cite:Encyclopaedia-of-Islam-2 vol. 4, hlm. 465}."
