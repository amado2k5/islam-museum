summary:
  ar: "سياسي سندي (1890–1975) من بير جو گوٺ في دادو: من قادة حركة الخلافة في السند، ووزير التعليم لنحو عشر سنوات في حكومات الله بخش سومرو، ورئيس وزراء السند (1948–1949) بترشيح من محمد علي جناح، وصاحب الفضل في قانون جامعة السند وكليات كراتشي، ولذلك لُقّب بـ«سرسيد السند»."
  en: "Sindhi politician (1890–1975) from Pir Jo Goth in Dadu: a Khilafat-movement leader in Sindh, education minister for some ten years in Allah Bux Soomro's cabinets, and Chief Minister of Sindh (1948–1949) on Muhammad Ali Jinnah's nomination — the man behind the University of Sindh Act and Karachi's colleges, remembered as the 'Sir Syed of Sindh'."
  ur: "Sindhi politician (1890–1975) from Pir Jo Goth in Dadu: a Khilafat-movement leader in Sindh, education minister for some ten years in Allah Bux Soomro's cabinets, and Chief Minister of Sindh (1948–1949) on Muhammad Ali Jinnah's nomination — the man behind the University of Sindh Act and Karachi's colleges, remembered as the 'Sir Syed of Sindh'."
