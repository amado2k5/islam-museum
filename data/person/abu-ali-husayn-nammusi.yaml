summary:
  ar: "أبو علي حسين الصوفي المدفون بساحل بولاق؛ قال المناوي في طبقاته هو من أهل التصريف صوفي كامل وشيخ لأنواع اللطف والكمال شامل بهي الصورة كان عليه مخايل الولاية مقصورة وكان كثير التحول يدخل عليه إنسان فيجده سبعاً ثم يدخل عليه آخر فيجده جندياً ثم يدخل عليه آخر فيجده فلاحاً أو فيلاً وهكذا وقال آخرون كان التحول دأبه ليلاً ونهاراً حتى في صورة السباع والبهائم ودخل عليه أعداؤه ليقتلوه فقطعوه بالسيوف ليلاً ودموه على كوم بعيد فأصبحوا فوجدوه قائماً يصلي بزاويته ومكث بخلوة في غيط خارج باب البحر أربعين سنة لا يأكل ولا يشرب وباب الخلوة مبني ليس له إلا طاق يدخل منه الهواء فقال الناس هو يعمل الكيمياء والسيميا ثم خرج بعدها وأظهر الكرامات والخوارق وكان إذا سأله أحد شيئاً أخرجه من الهواء وأعطاه إياه وكان جماعته يأخذون أولاد النموس ويربونهم فسموا بالنموسية وضرب قايتباي رقاب بعضهم لما شطحوا ونطقوا بما يخالف الشريعة انتهى كلام المناوي، توفي في حدود سنة إحدى وتسعين وثمانمائة {cite:shadharat-dhahab p. 350-351}."
  en: "Abu 'Ali Husayn — al-Manawi's 'Sufi of transformation': found as a lion, a soldier, an elephant to successive visitors; cut to pieces at night and found praying whole at dawn; forty years sealed in a riverside khalwa eating and drinking nothing; his followers reared foundlings as the 'Nummusiyya' until Qaytbay beheaded some for exceeding the shari'a; died ~891 {cite:shadharat-dhahab p. 350-351}."
  fr: "Abu 'Ali Husayn — le « soufi des transformations » d'al-Manawi : trouvé tour à tour en lion, en soldat, en éléphant par des visiteurs successifs ; taillé en pièces la nuit et retrouvé entier, en prière, à l'aube ; quarante ans scellé dans une retraite au bord du fleuve sans manger ni boire ; ses disciples élevaient des enfants trouvés sous le nom de « Nammusiyya », jusqu'à ce que Qaytbay en fasse décapiter certains pour avoir outrepassé la charia ; mort vers 891 {cite:shadharat-dhahab p. 350-351}."
  es: "Abu 'Ali Husayn — el 'sufí de la transformación' de al-Manawi: encontrado como león, soldado y elefante por sucesivos visitantes; descuartizado por la noche y encontrado rezando íntegro al amanecer; cuarenta años sellado en un khalwa a orillas de un río sin comer ni beber nada; sus seguidores criaron niños expósitos como los 'Nummusiyya' hasta que Qaytbay decapitó a algunos por exceder la sharia; murió alrededor del año 891 {cita: shadharat-dhahab págs. 350-351}."
  ur: "ابو علی حسین - المناوی کا 'تبدیلی کا صوفی': یکے بعد دیگرے آنے والوں کے لیے ایک شیر، ایک سپاہی، ایک ہاتھی کے طور پر پایا جاتا ہے۔ رات کو ٹکڑے ٹکڑے کیے اور فجر کے وقت پوری نماز پڑھتے پائے گئے۔ چالیس سال دریا کے کنارے بند کر کے کھایا پیا کچھ نہیں اس کے پیروکاروں نے بنیادوں کو 'نعموسیہ' کے طور پر پالا یہاں تک کہ قیتبے نے شریعت سے تجاوز کرنے پر بعض کا سر قلم کر دیا۔ متوفی ~ 891 {حوالہ: شدارت ذہاب صفحہ 350-351}۔"
  tr: "Bulaq kıyısında defnedilen Ebu Ali Hüseyin el-Sufi hakkında, El-Manavi \"Tabakat\" (Biyografik Sözlük) adlı eserinde şunları söylemiştir: \"O, manevi rehberlik eden, mükemmel bir Sufi ve her türlü lütuf ve mükemmelliğin ustasıydı. Yakışıklıydı ve veliliğin dışsal işaretlerine sahipti. Sık sık şekil değiştirirdi; biri içeri girdiğinde onu aslan, diğeri asker, bir başkası da çiftçi veya fil olarak bulurdu ve bu böyle devam ederdi. Başkaları, vahşi hayvanlar ve canavarlar şeklinde bile olsa, gece gündüz sürekli şekil değiştirme pratiği olduğunu söylerdi. Düşmanları onu öldürmek için içeri girdiler, ancak onu gece kılıçlarla parçalara ayırdılar ve kanını uzaktaki bir tepeye bıraktılar. Sabahleyin onu köşesinde namaz kılarken buldular. Kırk yıl boyunca Bab el-Bahr (Deniz Kapısı) dışındaki bir tarlada inzivada kaldı, ne yedi ne de içti. İnzivasının girişi, sadece havanın girdiği küçük bir açıklıkla inşa edilmişti. İnsanlar onun simya ve kimya ile uğraştığını söylerdi.\" Sonra ortaya çıktı ve mucizeler ve harikalar gösterdi. Birisi ondan bir şey istediğinde, onu havadan çıkarıp ona verirdi. Takipçileri sivrisinek yavrularını alıp yetiştirirlerdi ve bunlara \"Sivrisinekler\" denirdi. Kaytbey, sapkınlığa düşen ve İslam hukukuna aykırı şeyler söyleyen bazılarını başlarını keserek öldürdü. Bu, El-Menavi'nin anlatımını sonlandırır. Hicri 891 yılı civarında vefat etti. {kaynak: Şadharat-dahab s. 350-351}"
  id: "Abu Ali Hussein Al-Sufi, yang dimakamkan di pantai Bulaq; Al-Manawi berkata dalam bukunya \"Tabaqat\" (Kamus Biografi): Dia adalah seorang pembimbing spiritual, seorang Sufi yang sempurna, dan ahli dalam segala macam rahmat dan kesempurnaan. Dia tampan dan memiliki tanda-tanda lahiriah kesalehan. Dia sering mengubah wujudnya; seseorang akan masuk dan mendapati dia sebagai singa, yang lain sebagai tentara, dan yang lain lagi sebagai petani atau gajah, dan seterusnya. Yang lain mengatakan bahwa transformasi adalah praktik tetapnya, siang dan malam, bahkan dalam bentuk binatang buas dan hewan. Musuh-musuhnya masuk untuk membunuhnya, tetapi mereka memotong-motongnya dengan pedang di malam hari dan meninggalkan darahnya di gundukan yang jauh. Di pagi hari, mereka menemukannya sedang berdoa di tempat persembunyiannya. Dia tetap mengasingkan diri di sebuah ladang di luar Bab al-Bahr (Gerbang Laut) selama empat puluh tahun, tidak makan dan tidak minum. Pintu masuk ke tempat persembunyiannya dibangun hanya dengan lubang kecil tempat udara masuk. Orang-orang mengatakan dia mempraktikkan alkimia dan kimia. Kemudian dia muncul dan menunjukkan mukjizat dan keajaiban. Jika seseorang meminta sesuatu kepadanya, dia akan mengeluarkannya dari udara dan memberikannya kepada mereka. Para pengikutnya akan mengambil keturunan nyamuk dan membesarkannya, dan mereka disebut \"Nyamuk\". Qaitbay memenggal kepala beberapa dari mereka ketika mereka sesat dan mengucapkan hal-hal yang bertentangan dengan hukum Islam. Ini menyimpulkan pernyataan Al-Manawi. Dia meninggal sekitar tahun 891 H. {cite:shadharat-dhahab p. 350-351}."
