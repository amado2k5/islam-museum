summary:
  ar: "أبو علي حسين الصوفي المدفون بساحل بولاق؛ قال المناوي في طبقاته هو من أهل التصريف صوفي كامل وشيخ لأنواع اللطف والكمال شامل بهي الصورة كان عليه مخايل الولاية مقصورة وكان كثير التحول يدخل عليه إنسان فيجده سبعاً ثم يدخل عليه آخر فيجده جندياً ثم يدخل عليه آخر فيجده فلاحاً أو فيلاً وهكذا وقال آخرون كان التحول دأبه ليلاً ونهاراً حتى في صورة السباع والبهائم ودخل عليه أعداؤه ليقتلوه فقطعوه بالسيوف ليلاً ودموه على كوم بعيد فأصبحوا فوجدوه قائماً يصلي بزاويته ومكث بخلوة في غيط خارج باب البحر أربعين سنة لا يأكل ولا يشرب وباب الخلوة مبني ليس له إلا طاق يدخل منه الهواء فقال الناس هو يعمل الكيمياء والسيميا ثم خرج بعدها وأظهر الكرامات والخوارق وكان إذا سأله أحد شيئاً أخرجه من الهواء وأعطاه إياه وكان جماعته يأخذون أولاد النموس ويربونهم فسموا بالنموسية وضرب قايتباي رقاب بعضهم لما شطحوا ونطقوا بما يخالف الشريعة انتهى كلام المناوي، توفي في حدود سنة إحدى وتسعين وثمانمائة {cite:shadharat-dhahab p. 350-351}."
  en: "Abu 'Ali Husayn — al-Manawi's 'Sufi of transformation': found as a lion, a soldier, an elephant to successive visitors; cut to pieces at night and found praying whole at dawn; forty years sealed in a riverside khalwa eating and drinking nothing; his followers reared foundlings as the 'Nummusiyya' until Qaytbay beheaded some for exceeding the shari'a; died ~891 {cite:shadharat-dhahab p. 350-351}."
