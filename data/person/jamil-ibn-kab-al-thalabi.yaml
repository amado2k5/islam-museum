label: { ar: "جميل بن كعب الثعلبي", en: "Jamil ibn Ka'b al-Tha'labi", es: "Jamil ibn Ka'b al-Tha'labi", fr: "Jamil ibn Ka'b al-Tha'labi", ur: "جمیل بن کعب الثعلبی" }
summary:
  ar: "من سادات ربيعة وشيعة علي، أسره معاوية فلما أمر بضرب عنقه قال اللهم اشهد أن معاوية لم يقتلني فيك ولا لأنك ترضى قتلي ولكن قتلني على حطام الدنيا، فقال معاوية قاتلك الله لقد سببت فأبلغت ودعوت فبالغت ثم أطلقه وتمثل بأبيات النعمان بن المنذر تعفو الملوك عن الجليل من الأمور بفضلها {cite:muruj-al-dhahab p. 48-49}."
  en: "A chief of Rabi'a and Ali's partisan — spared at the block by Mu'awiya, who admired his curse-prayer and capped it with al-Nu'man ibn al-Mundhir's verses on royal clemency {cite:muruj-al-dhahab p. 48-49}."
  es: "Un jefe de Rabi'a y partidario de Ali, perdonado en el cadalso por Mu'awiya, quien admiró su oración de maldición y la remató con los versos de al-Nu'man ibn al-Mundhir sobre la clemencia real {cite:muruj-al-dhahab p. 48-49}."
  fr: "Un chef des partisans de Rabi'a et d'Ali — épargné au bloc par Mu'awiya, qui admira sa prière de malédiction et la couronna des vers d'al-Nu'man ibn al-Mundhir sur la clémence royale {cite:muruj-al-dhahab p. 48-49}."
  ur: "ربیعہ کا ایک سردار اور علی کا متعصب - معاویہ نے بلاک پر بچایا، جس نے اس کی بددعا کی تعریف کی اور اسے نعمان بن المنذر کی شاہی عافیت سے متعلق آیات کے ساتھ بند کر دیا۔ 48-49}۔"
  tr: "O, Rabi'ah'ın liderlerinden biri ve Ali'nin bir Şiisiydi. Muaviye onun tarafından yakalandı. Başının kesilmesini emrettiğinde, dedi ki: Ey Allah, Muaviyet'in beni Senin yüzünden ya da öldürmemi kabul ettiğin için öldürdüğüne şahit ol, beni bu dünyanın harabelerinde öldürdü. Muaviye dedi ki: Allah seni öldürsün. Bir sebep yarattım, aktardım ve dua ettim, sonra abarttım, sonra serbest bırakıldı. El-Nu'man bin el-Mundir'in ayetleri ona örnek alındı: 'Krallar büyük işleri bunun sayesinde affeder' {atı: Muruj-al-Dhahab, s. 48-49}."
  id: "Dia adalah salah satu pemimpin Rabi'ah dan Syiah Ali. Muawiyah ditangkap olehnya. Ketika dia memerintahkan pemenggalan kepalanya, dia berkata: Ya Allah, bersaksilah bahwa Muawiyah tidak membunuhku karena Engkau, juga tidak karena Engkau mau menerima pembunuhanku, tetapi dia membunuhku di reruntuhan dunia ini. Muawiyah berkata: Semoga Allah membunuhmu. Aku membuat alasan dan menyampaikan serta berdoa, lalu melebih-lebihkan, lalu dia dibebaskan. Dia ditiru oleh ayat-ayat al-Nu'man ibn al-Mundhir: 'Raja-raja mengampuni perkara besar karenanya' {cite:muruj-al-dhahab, hlm. 48-49}."
