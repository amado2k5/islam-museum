summary:
  ar: "عبد الوهاب بن أحمد بن وهبان الحارثي الدمشقي، أمين الدين، فقيه حنفي أديب ولي قضاء حماة وتوفي في نحو الأربعين من عمره، له قيد الشرائد وعقد القائد وأحاسن الأخبار في محاسن السبعة الأخيار؛ توفي سنة 768 هـ الموافقة 1367م."
  en: "Abd al-Wahhab ibn Ahmad ibn Wahban al-Harithi al-Dimashqi, Amin al-Din, a Hanafi jurist and man of letters who held the judgeship of Hama and died at about forty, author of Qayd al-Shara'id, Iqd al-Qa'id and Ahasin al-Akhbar fi Mahasin al-Sab'a al-Akhyar; he died in 768 AH (1367 CE)."
