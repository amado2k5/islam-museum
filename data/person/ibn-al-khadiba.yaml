id: person/ibn-al-khadiba
class: person
label: { ar: "أبو بكر بن الخاضبة مفيد بغداد" }
summary:
  ar: "أبو بكر بن الخاضبة محمد بن أحمد بن عبد الباقي البغدادي الحافظ مفيد بغداد؛ روى عن أبي بكر الخطيب وابن المسلمة وطبقتهما ورحل إلى الشام؛ كان كبير القدر ناقداً علامة محبباً إلى الناس كلهم لدينه وتواضعه ومسارعته في قضاء حوائجهم مع طيب القراءة — قال ابن طاهر ما كان في الدنيا أحد أحسن قراءة للحديث منه، وقال الفصيحي ما رأيت في المحدثين أقوم باللغة من ابن الخاضبة؛ توفي في ربيع الأول سنة تسع وثمانين وأربعمائة {cite:shadharat-dhahab p. 393}."
  en: "Abu Bakr Ibn al-Khadiba Muhammad b. Ahmad b. Abd al-Baqi, Baghdad's mufid-hafiz; transmitted from al-Khatib and Ibn al-Muslima; beloved for his deen and humble eagerness to serve — Ibn Tahir said none on earth read hadith more beautifully, and al-Fasihi knew no muhaddith sounder in lugha; died Rabi' I 489 {cite:shadharat-dhahab p. 393}."
  es: "Abu Bakr Ibn al-Khadiba Muhammad b. Ahmad b. Abd al-Baqi, mufid-hafiz de Bagdad; transmitido de al-Khatib e Ibn al-Muslima; amado por su deen y su humilde afán de servir — Ibn Tahir dijo que nadie en la tierra leía hadices con mayor belleza, y al-Fasihi no conocía a ningún muhaddith más sólido en lugha; murió Rabi' I 489 {cite:shadharat-dhahab p. 393}."
  fr: "Abu Bakr Ibn al-Khadiba Muhammad b. Ahmad b. Abd al-Baqi, mufid-hafiz de Bagdad; transmis par al-Khatib et Ibn al-Muslima; aimé pour sa religion et son humble empressement à servir — Ibn Tahir a dit que personne sur terre ne lisait les hadiths plus magnifiquement, et al-Fasihi ne connaissait pas de muhaddith plus sonore en lugha; mort Rabi' I 489 {cite:shadharat-dhahab p. 393}."
  ur: "ابو بکر ابن الخدیبہ محمد بن۔ احمد بی۔ عبد الباقی، بغداد کے مفید حافظ؛ الخطیب اور ابن المسلمہ سے منقول؛ اپنے دین اور خدمت کے عاجزانہ شوق کے لیے محبوب - ابن طاہر نے کہا کہ روئے زمین پر اس سے زیادہ خوبصورت حدیث کسی نے نہیں پڑھی، اور الفصیحی لغا میں کسی محدث کو نہیں جانتا تھا۔ متوفی ربیع الثانی 489 393}۔"
  tr: "Ebu Bekir bin Khadibah Muhammed bin Ahmed ibn Abdülbaki-Bağdadi, hadis âlimi Mufid Bağdat; Ebu Bekir el-Hatib ve İbn Meslemeh'ten rivayet etti, onlarla çalıştı ve Levant'a seyahat etti. Büyük bir itibara sahipti, eleştirmen ve diniyle herkesin sevilen bir âlimiydi, alçakgönüllülüğü ve ihtiyaçlarını hızlıca yerine getirmesi ile zarif okumasıyla — İbn Tahir şöyle dedi: Dünyada hadis okumada ondan daha iyi kimse yoktu. El-Fasihi şöyle dedi: İbn el-Hadibe'den daha etkili hadis alimleri arasında hiç görmedim; o, dört yüz seksen dokuzuncu yılda Rabi'al-Awwal'da öldü {atıf: şadharat-zehab, s. 393}."
  id: "Abu Bakr ibn al-Khadibah Muhammad ibn Ahmad ibn Abd al-Baqi al-Baghdadi, ulama hadis Mufid Baghdad; ia menceritakan dari Abu Bakr al-Khatib dan Ibn al-Maslamah, belajar bersama mereka, dan melakukan perjalanan ke Levant. Ia memiliki kedudukan tinggi, seorang kritikus, dan ulama yang dicintai semua orang karena agamanya, kerendahan hati, dan pemenuhan kebutuhan mereka dengan cepat serta pembacaan yang halus — Ibn Tahir berkata: Tidak ada yang lebih baik di dunia dalam pembacaan hadis selain dirinya. Al-Fasihi berkata: Saya belum pernah melihat di antara ulama hadis yang lebih fasih daripada Ibn al-Khadibah; ia wafat di Rabi' al-Awwal pada tahun empat ratus delapan puluh sembilan {cite:shadharat-dhahab, hlm. 393}."
