label: { ar: "أبو بكر بن الخاضبة مفيد بغداد" }
summary:
  ar: "أبو بكر بن الخاضبة محمد بن أحمد بن عبد الباقي البغدادي الحافظ مفيد بغداد؛ روى عن أبي بكر الخطيب وابن المسلمة وطبقتهما ورحل إلى الشام؛ كان كبير القدر ناقداً علامة محبباً إلى الناس كلهم لدينه وتواضعه ومسارعته في قضاء حوائجهم مع طيب القراءة — قال ابن طاهر ما كان في الدنيا أحد أحسن قراءة للحديث منه، وقال الفصيحي ما رأيت في المحدثين أقوم باللغة من ابن الخاضبة؛ توفي في ربيع الأول سنة تسع وثمانين وأربعمائة {cite:shadharat-dhahab p. 393}."
  en: "Abu Bakr Ibn al-Khadiba Muhammad b. Ahmad b. Abd al-Baqi, Baghdad's mufid-hafiz; transmitted from al-Khatib and Ibn al-Muslima; beloved for his deen and humble eagerness to serve — Ibn Tahir said none on earth read hadith more beautifully, and al-Fasihi knew no muhaddith sounder in lugha; died Rabi' I 489 {cite:shadharat-dhahab p. 393}."
