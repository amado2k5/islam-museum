summary:
  ar: "أبو القاسم الحسين بن محمد بن المفضل، المعروف بالراغب الأصفهاني؛ أديب وعالم من أهل أصفهان عاش في زمن مجلس الصاحب بن عباد ومن بعده أبي العباس الدبّي، ولم يذكره شيء يثبت أنه فارق وطنه. اشتهر بـ«محاضرات الأدباء» و«مفردات ألفاظ القرآن» و«الذريعة إلى مكارم الشريعة» التي أخذ الغزالي عنها نحو نصف «ميزان العمل»، وتوفي على الأرجح في ربيع الآخر سنة ٤١٢هـ {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390} {cite:kashf-zunun-furqan p. 197-198}."
  en: "Abu al-Qasim al-Husayn ibn Muhammad ibn al-Mufaddal, known as al-Raghib al-Isfahani; a man of letters and religious scholar of Isfahan who flourished in the age of al-Sahib Ibn Abbad's literary circle and his successor Abu al-Abbas al-Dabbi, with no sound evidence that he ever left his native city. Famed for the Muhadarat al-udaba', the Mufradat alfaz al-Qur'an, and al-Dhari'a ila makarim al-shari'a — al-Ghazali's direct source for a good half of his Mizan al-'amal — he died most probably in Rabi' II 412 {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390} {cite:kashf-zunun-furqan p. 197-198}."
  ur: "ابو القاسم حسین بن محمد بن مفضل، راغب اصفہانی کے نام سے معروف؛ اصفہان کے اديب اور ماہر دینیات جو صاحب بن عباد کے ادبی مجلس اور اس کے جانشین ابو العباس دبّی کے زمانے میں رہے، اور کوئی مستند شہادت نہیں کہ وہ اپنے وطن سے نکلے۔ «محاضرات الادباء»، «مفردات الفاظ القرآن» اور «الذریعہ الی مکارم الشریعہ» کے باعث مشہور — آخری کتاب سے غزالی نے اپنے «میزان العمل» کا نصف حصہ لیا — غالباً ربیع الآخر 412ھ میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390} {cite:kashf-zunun-furqan p. 197-198}۔"
