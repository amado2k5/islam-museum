summary:
  ar: "أبو القاسم الحسين بن محمد بن المفضل، المعروف بالراغب الأصفهاني؛ أديب وعالم من أهل أصفهان عاش في زمن مجلس الصاحب بن عباد ومن بعده أبي العباس الدبّي، ولم يذكره شيء يثبت أنه فارق وطنه. اشتهر بـ«محاضرات الأدباء» و«مفردات ألفاظ القرآن» و«الذريعة إلى مكارم الشريعة» التي أخذ الغزالي عنها نحو نصف «ميزان العمل»، وتوفي على الأرجح في ربيع الآخر سنة ٤١٢هـ {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390} {cite:kashf-zunun-furqan p. 197-198}."
  en: "Abu al-Qasim al-Husayn ibn Muhammad ibn al-Mufaddal, known as al-Raghib al-Isfahani; a man of letters and religious scholar of Isfahan who flourished in the age of al-Sahib Ibn Abbad's literary circle and his successor Abu al-Abbas al-Dabbi, with no sound evidence that he ever left his native city. Famed for the Muhadarat al-udaba', the Mufradat alfaz al-Qur'an, and al-Dhari'a ila makarim al-shari'a — al-Ghazali's direct source for a good half of his Mizan al-'amal — he died most probably in Rabi' II 412 {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390} {cite:kashf-zunun-furqan p. 197-198}."
  fr: "Abu al-Qasim al-Husayn ibn Muhammad ibn al-Mufaddal, connu sous le nom d'al-Raghhib al-Isfahani ; un homme de lettres et savant religieux d'Ispahan qui a prospéré à l'époque du cercle littéraire d'al-Sahib Ibn Abbad et de son successeur Abu al-Abbas al-Dabbi, sans preuve solide qu'il ait jamais quitté sa ville natale. Célèbre pour le Muhadarat al-udaba', le Mufradat alfaz al-Qur'an, et al-Dhari'a ila makarim al-shari'a - source directe d'al-Ghazali pour une bonne moitié de son Mizan al-'amal - il est mort très probablement dans Rabi' II 412 {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390} {cite:kashf-zunun-furqan p. 197-198}."
  ur: "ابو القاسم حسین بن محمد بن مفضل، راغب اصفہانی کے نام سے معروف؛ اصفہان کے اديب اور ماہر دینیات جو صاحب بن عباد کے ادبی مجلس اور اس کے جانشین ابو العباس دبّی کے زمانے میں رہے، اور کوئی مستند شہادت نہیں کہ وہ اپنے وطن سے نکلے۔ «محاضرات الادباء»، «مفردات الفاظ القرآن» اور «الذریعہ الی مکارم الشریعہ» کے باعث مشہور — آخری کتاب سے غزالی نے اپنے «میزان العمل» کا نصف حصہ لیا — غالباً ربیع الآخر 412ھ میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390} {cite:kashf-zunun-furqan p. 197-198}۔"
  es: "Abu al-Qasim al-Husayn ibn Muhammad ibn al-Mufaddal, conocido como al-Raghib al-Isfahani; un hombre de letras y erudito religioso de Isfahán que floreció en la época del círculo literario de al-Sahib Ibn Abbad y su sucesor Abu al-Abbas al-Dabbi, sin pruebas sólidas de que alguna vez abandonó su ciudad natal. Famoso por el Muhadarat al-udaba', el Mufradat alfaz al-Qur'an y al-Dhari'a ila makarim al-shari'a, la fuente directa de al-Ghazali de una buena mitad de su Mizan al-'amal, murió muy probablemente en Rabi' II 412 {cite:encyclopaedia-of-islam-2 vol. 8 págs. 389-390} {citar:kashf-zunun-furqan p. 197-198}."
  tr: "Ebu el-Kasım el-Hüseyin ibn Muhammed bin el-Mufaddal, Raghib al-Isfahani olarak bilinir, İsfahanlı bir edebi figür ve alimdi; Sahib bin Abbad'ın meclisi zamanında ve ondan sonra Ebu el-Abbas el-Dubai döneminde yaşamıştı; memleketini terk ettiğine dair hiçbir kanıt yoktur. 'Yazarların Dersleri', 'Mufradat Alfaz al-Qur'an' ve 'El-Dhari'ah ila Makerim al-Şeri'ah' ile ünlüdür; bu eserlerden Hazazali 'Mizan al-Amal'in yaklaşık yarısını almıştır. Muhtemelen Rabi' al-Akhir 412 Hicri'de öldü {cite:Encyclopaedia-of-Islam-2 cilt 8, s. 389-390} {atıf:kashf-zunun-furqan, s. 197-198}."
  id: "Abu al-Qasim al-Husayn ibn Muhammad ibn al-Mufaddal, yang dikenal sebagai Raghib al-Isfahani, adalah tokoh sastra dan ulama dari Isfahan yang hidup pada masa konsili Sahib ibn Abbad dan setelahnya Abu al-Abbas al-Dubai, dan tidak ada yang disebutkan bahwa ia meninggalkan tanah airnya. Ia terkenal dengan 'Kuliah Penulis,' 'Mufradat Alfaz al-Qur'an,' dan 'Al-Dhari'ah ila Makarim al-Shari'ah,' dari mana al-Ghazali mengambil sekitar setengah dari 'Mizan al-Amal.' Kemungkinan besar ia meninggal pada Rabi' al-Akhir 412 AH {cite:Encyclopaedia-of-Islam-2 vol. 8, hlm. 389-390} {cite:kashf-zunun-furqan, hlm. 197-198}."
