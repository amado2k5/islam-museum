summary:
  ar: "نظام الملك مسعود بن علي وزير خوارزم شاه علاء الدين تكش؛ وثبت عليه الملاحدة — أي الإسماعيلية — فقتلوه في جمادى الآخرة سنة ثلاث وتسعين وخمسمائة، فأمر تكش ولده قطب الدين محمد بقصد قلاعهم فحصر قلعة ترشيش حتى صالحوه على مائة ألف دينار {cite:kamil-ibn-al-athir p. 263}."
  en: "Mas'ud ibn Ali, vizier of the Khwarazmshah Ala al-Din Takish — assassinated by the Ismailis in Jumada II 593; Takish sent his son Qutb al-Din against their castles and Turshish bought its peace for a hundred thousand dinars {cite:kamil-ibn-al-athir p. 263}."
  es: "Mas'ud ibn Ali, visir del shah de Corasmia Ala al-Din Takish, fue asesinado por los ismaelitas en Jumada II 593; Takish envió a su hijo Qutb al-Din contra sus castillos y Turshish compró la paz por cien mil dinares {cite:kamil-ibn-al-athir p. 263}."
  fr: "Mas'ud ibn Ali, vizir du Khwarezmshah Ala al-Din Takish — assassiné par les Ismaéliens en Jumada II 593; Takish envoya son fils Qutb al-Din contre leurs châteaux et Turshish acheta la paix pour cent mille dinars {cite:kamil-ibn-al-athir p. 263}."
  ur: "مسعود ابن علی، خوارزمشاہ علاء الدین تکش کے وزیر - جمعہ II 593 میں اسماعیلیوں کے ہاتھوں قتل؛ تکیش نے اپنے بیٹے قطب الدین کو ان کے قلعوں کے خلاف بھیجا اور ترکوں نے اس کا امن ایک لاکھ دینار میں خرید لیا۔ 263}۔"
