summary:
  ar: "أبو يعقوب يوسف بن أيوب الهمذاني، الفقيه الزاهد الجليل صاحب المقامات والكرامات؛ من أهل بوزنجرد قرية من قرى همذان، قدم بغداد في صباه بعد الستين وأربعمائة ولازم الشيخ أبا إسحاق الشيرازي وتفقه عليه حتى برع في أصول الفقه والمذهب والخلاف وكان الشيرازي يقدمه على جماعة من أصحابه مع صغر سنه لعلمه بزهده، ثم زهد في ذلك كله واشتغل بالزهد والعبادة والرياضة والمجاهدة حتى صار علماً من أعلام الدين؛ وقدم بغداد سنة خمس عشرة وخمسمائة وعقد بها مجلس الوعظ بالمدرسة النظامية وصادف قبولاً عظيماً، وقيل فيه حين آذاه فقيه يعرف بابن السقاء عن مسألة: اجلس فإني أجد من كلامك رائحة الكفر ولعلك تموت على غير دين الإسلام — فاتفق أن ابن السقاء التحق بعدها برسول ملك الروم فتنصر ومات على النصرانية بالقسطنطينية {cite:wafayat-ayan p. 78-79}. ونزل مرو وسكنها واجتمع برباطه بها جماعة من المنقطعين إلى الله ما لا يتصور أن يكون في غيره من الربط مثلهم، وإليه انتهت تربية المريدين الصادقين كما قال ابن السمعاني، وخرج إلى هراة وأقام بها مدة ثم عزم على الرجوع إلى مرو فأدركته منيته بباميين بين هراة وبغشور في ربيع الأول سنة خمس وثلاثين وخمسمائة ودفن ثم نقل إلى مرو {cite:wafayat-ayan p. 79-80}."
  en: "Abu Ya'qub Yusuf al-Hamadhani — the ascetic jurist of Buzanjird who outshone his peers in Abu Ishaq al-Shirazi's Baghdad circle, then abandoned disputation for devotion, preached at the Nizamiyya in 515, and gathered at his Merv ribat such a company of seekers that al-Sam'ani said the training of sincere murids ended with him; died at Bamiyyin in Rabi' I 535 and was carried back to Merv {cite:wafayat-ayan p. 78-80}."
  es: "Abu Ya'qub Yusuf al-Hamadhani, el jurista asceta de Buzanjird que sobresalió entre sus compañeros en el círculo de Abu Ishaq al-Shirazi en Bagdad, abandonó la disputa por la devoción, predicó en la Nizamiyya en 515 y reunió en su ribat de Merv a tal compañía de buscadores que al-Sam'ani dijo que la formación de murids sinceros terminó con él; murió en Bamiyyin en Rabi' I de 535 y fue llevado de regreso a Merv {cite:wafayat-ayan p. 78-80}."
  fr: "Abu Ya'qub Yusuf al-Hamadhani — le juriste ascétique de Buzanjird qui surpassa ses pairs dans le cercle de Bagdad d'Abu Ishaq al-Shirazi, puis abandonna la dispute pour la dévotion, prêcha à la Nizamiyya en 515, et rassembla dans son ribat de Merv une telle compagnie de chercheurs qu'al-Sam'ani dit que la formation des murids sincères prit fin avec lui; mourut à Bamiyyin en Rabi' I 535 et fut ramené à Merv {cite:wafayat-ayan p. 78-80}."
  ur: "ابو یعقوب یوسف الحمدانی - بوزنجرد کے فقیہ تھے جنہوں نے ابو اسحاق الشیرازی کے بغداد کے حلقہ میں اپنے ہم عصروں کو پیچھے چھوڑ دیا، پھر عقیدت کے لیے جھگڑا ترک کر دیا، 515 میں نظامیہ میں تبلیغ کی، اور اس کے مرو پر جمع ہوئے کہ چونکہ اس طرح کی تربیت کے طالب علموں نے کہا تھا اس کے ساتھ ختم ہوا؛ ربیع الثانی 535 میں بامیان میں وفات پائی اور مرو میں واپس لے جایا گیا۔ 78-80}۔"
  tr: "Ebu Ya'qub Yusuf bin Eyyub el-Hamadhani, rütbeleri ve mucizeleriyle tanınan münzevi, saygın bir hukukçu; Hamadan'daki Bouzanger köyünden. Gençliğinde dört yüz altmış yaşında Bağdat'a geldi, Şeyh Ebu İshaq el-Şirazi'yi takip etti, onunla hukuk eğitimi aldı ve fıkıhın temellerinde, düşünce okulunda ve anlaşmazlıkta üstün başarı gösterdi. El-Şirazi, genç yaşına rağmen onun münzevilik bilgisi sayesinde bir grup yoldaşının önüne geçerdi. Sonra tüm bunlarda münzevi oldu, kendini münzeviyet, ibadete, spora ve mücadeleye adadı ve sonunda din alanının önde gelen âlimlerinden biri oldu; beş yüz on beş hicri yılında Bağdat'a geldi Nizamiyya okulunda bir vaaz verdi ve büyük kabul gördü. İbn al-Saqqa adlı bir hukukçu ona şu soru yüzünden kızdığında: 'Otur, çünkü sözlerinde inançsızlık kokusunu alıyorum ve belki İslam dışında bir şey için öleceksin.' Sonradan İbn al-Saqqa'nın Roma kralının elçisine katıldığı, Hristiyanlığa geçtiği ve Konstantinopolis'e dönen biri olarak öldüğü söylenmiştir {atıf:wafayat-ayan, s. 78-79}. Marw'a yerleşti ve bağı sayesinde Allah'a dönen bir grup orada toplandı; bu, onların gibi başka bir bağlantıda hayal edilemez bir şeydi. İbn al-Sam'ani'nin dediği gibi, samimi öğrenciler yetiştiren oydu. Herat'a gitti, bir süre orada kaldı, sonra Marw'a dönmeye karar verdi. Ölümü, 535 H. yılında Rabi'al-Awwal'da Herat ile Baghushur arasında Bamiyyin'de onu yakaladı, defnedildi ve ardından Marw'a nakledildi. {cite:wafayat-ayan, s. 79-80}."
  id: "Abu Ya'qub Yusuf ibn Ayyub al-Hamadhani, seorang pertapa dan ahli hukum terhormat yang dikenal karena pangkat dan mukjizatnya; dari Bouzangerd, sebuah desa di Hamadan. Ia tiba di Baghdad saat muda setelah empat ratus enam puluh tahun, mengikuti Sheikh Abu Ishaq al-Shirazi, belajar hukum bersamanya, dan unggul dalam dasar-dasar hukum, aliran pemikiran, dan perselisihan. Al-Shirazi biasa memimpinnya dibandingkan sekelompok temannya meskipun usianya masih muda karena pengetahuannya tentang asketisme. Ia kemudian menjadi pertapa dalam semua ini, mendedikasikan diri pada asketisme, ibadah, olahraga, dan perjuangan hingga menjadi salah satu ulama agama terkemuka; ia tiba di Baghdad pada tahun lima ratus lima belas H Ia mengadakan sesi khotbah di sekolah Nizamiyya dan sangat diterima. Dikatakan bahwa ketika seorang ahli hukum bernama Ibn al-Saqqa menyinggungnya atas pertanyaan: 'Duduklah, karena aku mencium aroma ketidakpercayaan dalam kata-katamu, dan mungkin kau akan mati untuk sesuatu selain Islam.' Kebetulan Ibn al-Saqqa kemudian bergabung dengan utusan raja Romawi, memeluk agama Kristen, dan meninggal sebagai mualaf ke Konstantinopel {cite:wafayat-ayan, hlm. 78-79}. Ia menetap di Marw, dan melalui ikatannya, sekelompok orang yang telah berpaling kepada Tuhan berkumpul di sana, sesuatu yang tak terbayangkan dalam hubungan lain seperti mereka. Dialah yang membesarkan murid-murid yang tulus, seperti yang dikatakan Ibn al-Sam'ani. Ia pergi ke Herat, tinggal di sana untuk sementara waktu, lalu memutuskan untuk kembali ke Marw. Kematiannya menimpa dirinya di Bamiyyin antara Herat dan Baghushur di Rabi' al-Awwal pada tahun 535 H, dan ia dimakamkan lalu dipindahkan ke Marw. {cite:wafayat-ayan, hlm. 79-80}."
