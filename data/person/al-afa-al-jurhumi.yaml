class: person
label: { ar: "الأفعى بن الأفعى الجرهمي", en: "al-Af'a al-Jurhumi" }
summary:
  ar: "الأفعى بن الأفعى الجرهمي ملك نجران، لما حضرت نزار بن معد الوفاة قسم لولده إياداً وأنماراً وربيعة ومضر قسمة رمزية بالجارية الشمطاء والقبة الحمراء والفرس الأدهم والبدرة وقال إن أشكلت عليكم القسمة فأتوا الأفعى يقسم بينكم، فركب الأولاد نحو نجران فصادفوا في الطريق صاحب بعير ضال فنعتوه على أثره نعتاً أعور أبتر أزور شروداً دون أن يروه حتى استفصل الأفعى أمرهم وحكم في القسمة {cite:muruj-al-dhahab p. 431-432}. ولما نزلوا ضيافته بعث وصيفاً يعي أقوالهم فقال إياد في الشهد لولا أن نحله ألقاه في هامة جبار، وأنمار في الشاة لولا أنها غذيت بلبن كلبة، وربيعة في الخمر لولا أن كرمها نبت على قبر، ومضر لولا أنه لغير أبيه، فتحقق الأفعى الأمر فوجد العسل من جمجمة بجبل والسخلة رضعت كلبة والكرم على قبر أبيه، وسأل أمه فأخبرته أنه من شاب من أبناء الملوك خشيت خروج الملك عن أهل البيت، ثم فصل القسمة فجعل لإياد الغنم البرشاء ولأنمار الرقة والحرث ولربيعة الخيل الدهم والسلاح ولمضر الإبل الحمر والذهب {cite:muruj-al-dhahab p. 433-435}"
  en: "Jurhumite king of Najran appointed by the dying Nizar ibn Ma'add to arbitrate his sons' riddling bequest — the episode famed for the brothers deducing a lost camel's traits (one-eyed, docked, wall-eyed, stray) from its track alone {cite:muruj-al-dhahab p. 431-432}."
