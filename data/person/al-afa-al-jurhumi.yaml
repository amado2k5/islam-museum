class: person
label: { ar: "الأفعى بن الأفعى الجرهمي", en: "al-Af'a al-Jurhumi", fr: "Al-Af’a al-Jurhumi", es: "al-Af'a al-Jurhumi", ur: "الافضاء الجرحومی" }
summary:
  ar: "الأفعى بن الأفعى الجرهمي ملك نجران، لما حضرت نزار بن معد الوفاة قسم لولده إياداً وأنماراً وربيعة ومضر قسمة رمزية بالجارية الشمطاء والقبة الحمراء والفرس الأدهم والبدرة وقال إن أشكلت عليكم القسمة فأتوا الأفعى يقسم بينكم، فركب الأولاد نحو نجران فصادفوا في الطريق صاحب بعير ضال فنعتوه على أثره نعتاً أعور أبتر أزور شروداً دون أن يروه حتى استفصل الأفعى أمرهم وحكم في القسمة {cite:muruj-al-dhahab p. 431-432}. ولما نزلوا ضيافته بعث وصيفاً يعي أقوالهم فقال إياد في الشهد لولا أن نحله ألقاه في هامة جبار، وأنمار في الشاة لولا أنها غذيت بلبن كلبة، وربيعة في الخمر لولا أن كرمها نبت على قبر، ومضر لولا أنه لغير أبيه، فتحقق الأفعى الأمر فوجد العسل من جمجمة بجبل والسخلة رضعت كلبة والكرم على قبر أبيه، وسأل أمه فأخبرته أنه من شاب من أبناء الملوك خشيت خروج الملك عن أهل البيت، ثم فصل القسمة فجعل لإياد الغنم البرشاء ولأنمار الرقة والحرث ولربيعة الخيل الدهم والسلاح ولمضر الإبل الحمر والذهب {cite:muruj-al-dhahab p. 433-435}"
  en: "Jurhumite king of Najran appointed by the dying Nizar ibn Ma'add to arbitrate his sons' riddling bequest — the episode famed for the brothers deducing a lost camel's traits (one-eyed, docked, wall-eyed, stray) from its track alone {cite:muruj-al-dhahab p. 431-432}."
  fr: "Roi jurhumite de Najran désigné par Nizar ibn Ma’add mourant pour arbitrer le legs énigmatique destiné à ses fils — épisode célèbre où les frères déduisent les caractéristiques d’un chameau perdu (borgne, à la queue coupée, à l’œil vairon, égaré) de ses seules traces {cite:muruj-al-dhahab p. 431-432}."
  es: "El rey jurhumita de Najran, designado por el moribundo Nizar ibn Ma'add para arbitrar el legado enigmático de sus hijos, el episodio famoso por los hermanos que dedujeron las características de un camello perdido (tuerto, amputado, bizco, extraviado) solo por su huella {cite:muruj-al-dhahab p. 431-432}."
  ur: "نجران کے جورومائٹ بادشاہ کو مرنے والے نزار ابن معد نے اپنے بیٹوں کی چھلنی وصیت کو ثالثی کرنے کے لیے مقرر کیا تھا - یہ واقعہ ایک گمشدہ اونٹ کی خصلت ⁦(ایک آنکھ والی، گودی والی، دیوار کی آنکھ والی، بھٹکی ہوئی)⁩ کو اکیلے راستے سے نکالنے کے لیے مشہور ہے۔ 431-432}۔"
  tr: "Necran kralı El-Af'a bin El-Af'a El-Curhumi, Nizar bin Ma'ad ölmek üzereyken, oğulları İyad, Enmar, Rabia ve Mudar'ı sembolik bir şekilde, ak saçlı kız, kırmızı kubbe, siyah at ve kese ile paylaştırdı ve \"Eğer bu paylaşım size açık değilse, El-Af'a'ya gidin ki o aranızda paylaşsın\" dedi. Oğullar Necran'a doğru yola çıktılar ve yolda başıboş bir devenin sahibiyle karşılaştılar. Onu görmeden, tek gözlü, kuyruksuz, şaşı ve başıboş olarak tarif ettiler. El-Af'a onların durumunu sordu ve paylaşımı doğru bir şekilde değerlendirdi. {Kaynak: Muruj-al-Dhahab s. 431-432}. Misafir olarak geldiklerinde, sözlerini kaydetmesi için bir hizmetçi gönderdi. İyad, bal hakkında, \"Keşke arı onu bir zalimin başına atmasaydı,\" dedi. Enmar, koyun hakkında, \"Keşke köpek sütüyle beslenmeseydi,\" dedi. Rabi'ah, şarap hakkında, \"Keşke asması bir mezarın üzerinde yetişmeseydi,\" dedi. Mudar ise, \"Keşke babasından başkası için olmasaydı,\" dedi. Yılan meseleyi araştırdı ve balın dağdaki bir kafatasından, kuzunun köpek sütünden ve asmanın babasının mezarından geldiğini gördü. Annesine sordu ve annesi ona, krallığın aileden ayrılmasından korkarak, kralların oğullarından genç bir adam olduğunu söyledi. Sonra ganimetleri paylaştırdı; İyad'a alevli koyunu, Enmar'a araziyi ve mahsulleri, Rabi'ah'a siyah atları ve silahları, Mudar'a ise kırmızı develeri ve altını verdi. {cite:muruj-al-dhahab s. 433-435}"
  id: "Al-Af’a bin Al-Af’a Al-Jurhumi, raja Najran, ketika Nizar bin Ma’ad hendak meninggal, membagi putra-putranya, Iyad, Anmar, Rabi’a, dan Mudar secara simbolis dengan seorang gadis berambut abu-abu, kubah merah, kuda hitam, dan dompet. Ia berkata, “Jika pembagian ini tidak jelas bagi kalian, pergilah kepada Al-Af’a agar ia dapat membaginya di antara kalian.” Maka putra-putranya pun pergi menuju Najran, dan di tengah jalan mereka bertemu dengan pemilik unta yang tersesat. Mereka menggambarkan unta tersebut sebagai unta bermata satu, tanpa ekor, juling, dan tersesat, tanpa pernah melihatnya, hingga Al-Af’a menanyakan masalah mereka dan memutuskan pembagian tersebut. Ketika mereka tiba sebagai tamunya, ia mengirim seorang pelayan untuk mencatat perkataan mereka. Iyad berkata, mengenai madu, \"Seandainya saja lebah itu tidak melemparkannya ke kepala seorang tiran,\" Anmar berkata, mengenai domba, \"Seandainya saja ia tidak diberi makan susu anjing,\" Rabi'ah berkata, mengenai anggur, \"Seandainya saja tanaman anggurnya tidak tumbuh di atas kuburan,\" dan Mudar berkata, \"Seandainya saja itu bukan untuk orang lain selain ayahnya.\" Ular itu menyelidiki masalah tersebut dan menemukan bahwa madu itu berasal dari tengkorak di gunung, domba itu menyusu dari anjing, dan tanaman anggur itu berada di kuburan ayahnya. Ia bertanya kepada ibunya, dan ibunya mengatakan kepadanya bahwa ia adalah seorang pemuda dari keturunan raja-raja, karena takut kerajaan akan meninggalkan keluarga. Kemudian ia membagi rampasan perang, memberikan Iyad domba yang berkobar, Anmar tanah dan hasil panen, Rabi'ah kuda hitam dan senjata, dan Mudar unta merah dan emas. {cite:muruj-al-dhahab hlm. 433-435}"
