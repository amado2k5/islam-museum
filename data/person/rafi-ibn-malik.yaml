summary:
  ar: أنصاري من بني زريق، شهد العقبة وكان أحد النقباء، وقال سعد بن عبد الحميد إنه أول من أسلم من الخزرج؛ ويُروى أنه أول من قدم المدينة بسورة يوسف وأن مسجد بني زريق أول مسجد قُرئ فيه القرآن؛ واختُلف هل شهد بدراً.
  en: An Ansari of Banu Zurayq, he was at al-Aqaba and one of the naqibs, and Sa'd ibn Abd al-Hamid said he was the first of the Khazraj to embrace Islam; it is reported he was the first to bring the sura of Yusuf to Medina and that the mosque
    of Banu Zurayq was the first in which the Qur'an was recited; whether he was at Badr is disputed.
