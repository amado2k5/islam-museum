  ar: "محمد بن سليمان الكردي، فقيه الشافعية بالديار الحجازية في عصره، ولد بدمشق ونشأ في المدينة وتولى فيها إفتاء الشافعية إلى وفاته، له الفتاوى والحواشي المدنية وعقود الدرر؛ توفي سنة 1194 هـ الموافقة 1780م."
