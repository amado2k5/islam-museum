summary:
  ar: "رجل من يهود خيبر كان يجمع غطفان لغزو النبي؛ أرسل إليه النبي عبد الله بن رواحة في نفر فاستدرجوه إلى المدينة، فلما ندم في الطريق وأراد السيف قتله عبد الله بن أنيس بالقرقرة على ستة أميال من خيبر."
  en: "A Jew of Khaybar who was gathering Ghatafan to attack the Prophet; the Prophet sent Abdullah ibn Rawaha with a party who drew him toward Medina, and when he repented on the road and reached for the sword Abdullah ibn Unays killed him at al-Qarqara, six miles from Khaybar."
  fr: "Un Juif de Khaybar qui rassemblait Ghatafan pour attaquer le Prophète ; le Prophète a envoyé Abdullah ibn Rawaha avec un parti qui l'a attiré vers Médine, et quand il s'est repenti sur la route et a atteint l'épée Abdullah ibn Unays l'a tué à al-Qarqara, à six miles de Khaybar."
  es: "Un judío de Khaybar que estaba reuniendo a Ghatafan para atacar al Profeta; el Profeta envió a Abdullah ibn Rawaha con un grupo que lo atrajo hacia Medina, y cuando se arrepintió en el camino y extendió la mano para tomar la espada, Abdullah ibn Unays lo mató en al-Qarqara, a seis millas de Khaybar."
  ur: "خیبر کا ایک یہودی جو غطفان کو نبی پر حملہ کرنے کے لیے جمع کر رہا تھا۔ رسول اللہ نے عبداللہ بن رواحہ کو ایک جماعت کے ساتھ بھیجا جس نے انہیں مدینہ کی طرف کھینچا اور جب وہ راستے میں توبہ کر کے تلوار کے لیے پہنچے تو عبداللہ بن انیس نے انہیں خیبر سے چھ میل کے فاصلے پر قرقرہ کے مقام پر قتل کر دیا۔"
