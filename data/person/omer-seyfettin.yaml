summary:
  ar: "كاتب وضابط ومعلم تركي، وُلد في غونن سنة 1884 وتوفي في إسطنبول سنة 1920 بالسكري عن ستة وثلاثين عامًا. تخرج في المدرسة الحربية وخدم على حدود الدولة الغربية وأُسر في حرب البلقان، وشارك زيا كوك ألب وعلي جانيب في إصدار مجلة «كنج قلملر» سنة 1911، ويُعد من مؤسسي القصة القصيرة التركية الحديثة ومن رواد تبسيط اللغة التركية."
  en: "Turkish writer, officer and teacher, born at Gönen in 1884 and died of diabetes at Istanbul in 1920, aged thirty-six. He graduated from the Military Academy, served on the empire's western borders and was a prisoner of war in the Balkan War; in 1911 he co-founded the magazine Genç Kalemler with Ziya Gökalp and Ali Canip, and he is counted a founder of the modern Turkish short story and a pioneer of simplifying the Turkish language."
  ur: "ترک مصنف، فوجی افسر اور استاد، 1884ء میں گونن میں پیدا ہوئے اور 1920ء میں استنبول میں ذیابیطس سے وفات پائی۔ 1911ء میں ضیا گوک الپ کے ساتھ «گنج قلملر» جاری کیا؛ جدید ترک افسانے کے بانیوں اور زبان کی سادگی کے علمبرداروں میں شمار ہوتے ہیں۔"
