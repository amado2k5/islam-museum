summary:
  ar: "أمير جهانغير مدير إعلامي وخبير سياسات عامة باكستاني مقيم في إسلام آباد. هو مؤسس «مشعل باكستان» ورئيسها التنفيذي، وهي المعهد الشريك للمنتدى الاقتصادي العالمي في باكستان، وكُرّم قياديا شابا عالميا في المنتدى سنة 2010. ترأس قبل ذلك قناة ساما و«سي إن بي سي باكستان»، وكان في الحادية والثلاثين أصغر رئيس تنفيذي لأي امتياز لسي إن بي سي في العالم، وأسس جوائز أغاهي للتميز الصحفي ومؤشر مصداقية الإعلام، وترأس منصة «دي بي تي في» و«رينسترا»."
  en: "Amir Jahangir is a Pakistani media executive and public-policy professional based in Islamabad. He is the founder and chief executive of Mishal Pakistan, the World Economic Forum's partner institute in Pakistan, and was named a Forum Young Global Leader in 2010. He earlier served as chief executive of SAMAA TV and of CNBC Pakistan, at 31 the youngest chief executive of any CNBC franchise in the world, founded the AGAHI Awards for journalism excellence and the Media Credibility Index, and has headed DBTV and RINSTRA."
  ur: "امیر جہانگیر پاکستانی میڈیا ایگزیکٹو اور عوامی پالیسی کے ماہر ہیں، جو اسلام آباد میں مقیم ہیں۔ وہ «مشعل پاکستان» کے بانی اور چیف ایگزیکٹو ہیں، جو عالمی اقتصادی فورم کا پاکستان میں شراکت دار ادارہ ہے، اور 2010 میں فورم نے انہیں ینگ گلوبل لیڈر کا اعزاز دیا۔ اس سے پہلے وہ سما ٹی وی اور سی این بی سی پاکستان کے چیف ایگزیکٹو رہے، 31 سال کی عمر میں کسی بھی سی این بی سی فرنچائز کے دنیا کے سب سے کم عمر چیف ایگزیکٹو تھے، صحافتی امتیاز کے آگہی ایوارڈز اور میڈیا کریڈیبیلٹی انڈیکس کی بنیاد رکھی، اور ڈی بی ٹی وی اور رِنسٹرا کی سربراہی کی۔"

