  ar: "محمد حسنين هيكل ⁦(1923–2016)⁩ صحفي ومؤرخ سياسي مصري، رئيس تحرير الأهرام ⁦(1957–1974)⁩ ومستشار مقرّب من عبد الناصر ثم ناقد له. وثّق السياسة العربية الحديثة في كتب منها «خريف الغضب» و«أوراق القاهرة» و«الإمبراطورية الأمريكية»."
  en: "Mohamed Hassanein Heikal (1923–2016) was an Egyptian journalist and political historian, editor-in-chief of Al-Ahram (1957–1974) and confidant of Gamal Abdel Nasser who later became his critic. He documented modern Arab politics in books including Autumn of Fury, The Cairo Documents and The American Empire."
  ur: "محمد حسنین ہیکل ⁦(1923–2016)⁩ مصری صحافی اور سیاسی مؤرخ تھے، الاہرام کے مدیر اعلیٰ ⁦(1957–1974)⁩ اور جمال عبدالناصر کے قریبی مشیر جو بعد میں ان کے ناقد بنے۔ انہوں نے جدید عرب سیاست کی دستاویزی تحریریں لکھیں جن میں «خريف الغضب»، «أوراق القاهرة» اور «الإمبراطورية الأمريكية» شامل ہیں۔"
