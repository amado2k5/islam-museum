summary:
  ar: "ماري إلكا بانغيستو (وُلدت فانغ هوي لان في 23 تشرين الأول 1956 في جاكرتا) اقتصادية إندونيسية، أول امرأة من أصل صيني تتولى وزارة في إندونيسيا؛ وزيرة التجارة (2004–2011) ثم وزيرة السياحة والاقتصاد الإبداعي (2011–2014)، ودرست في الجامعة الوطنية الأسترالية ونالت الدكتوراه من جامعة كاليفورنيا ديفيس سنة 1986، وكانت مديرة إدارية في البنك الدولي (2020–2023)، وعُينت سنة 2024 مستشارة خاصة للرئيس ونائبة رئيس المجلس الاقتصادي الوطني."
  en: "Mari Elka Pangestu (born Phang Hoei Lan on 23 October 1956 in Jakarta) is an Indonesian economist, the first woman of Chinese descent to hold a cabinet post in Indonesia; she was minister of trade (2004-2011) and then minister of tourism and creative economy (2011-2014), studied at the Australian National University and took her doctorate at UC Davis in 1986, was a World Bank managing director (2020-2023), and in 2024 was appointed a presidential special advisor and vice chair of the National Economic Council."
  ur: "ماری ایلکا پانگیستو (پیدائش فانگ ہوئی لان، 23 اکتوبر 1956، جکارتہ) انڈونیشیائی ماہر معاشیات ہیں، انڈونیشیا میں وزارتی عہدہ پانے والی چینی نسل کی پہلی خاتون؛ وزیر تجارت (2004–2011) اور پھر وزیر سیاحت و تخلیقی معیشت (2011–2014) رہیں، آسٹریلین نیشنل یونیورسٹی سے تعلیم حاصل کی اور 1986 میں یو سی ڈیوس سے ڈاکٹریٹ کیا، ورلڈ بینک کی منیجنگ ڈائریکٹر (2020–2023) رہیں، اور 2024 میں صدارتی خصوصی مشیر اور قومی اقتصادی کونسل کی نائب صدر مقرر ہوئیں۔"
