summary:
  ar: "طبيب وسياسي ألباني (1887-1954). درس الطب في إسطنبول وعمل طبيبا في فيينا وبالش وتيرانا ودوريس، وشارك في النضال ضد أحمد زوغو ثم ضد الاحتلال الفاشي، فصار رئيس مجلس التحرير الوطني المناهض للفاشية سنة 1944 ووزير الخارجية، ثم أول رئيس هيئة رئاسة الجمعية الشعبية — أي أول رئيس دولة — في جمهورية ألبانيا الشعبية من 1946 إلى 1953 من غير أن يكون عضوا في الحزب الحاكم."
  en: "Albanian physician and politician (1887–1954). He studied medicine in Istanbul and practised in Vienna, Ballsh, Tirana and Durrës, took part in the struggle against Ahmet Zogu and then against the fascist occupation, chaired the Anti-Fascist National Liberation Council in 1944 with the foreign-affairs portfolio, and served as first Chairman of the Presidium of the People's Assembly — the first head of state — of the People's Republic of Albania from 1946 to 1953, without being a member of the ruling party."
  ur: "البانوی طبیب اور سیاست دان (1887-1954)۔ انہوں نے استنبول میں طب کی تعلیم حاصل کی اور ویانا، بالش، تیرانا اور دراج میں طبیب رہے؛ احمد زوگو کے خلاف اور پھر فاشسٹ قبضے کے خلاف جدوجہد میں حصہ لیا، 1944 میں انسدادِ فاشسٹ قومی آزادی کونسل کے صدر بنے، اور 1946 سے 1953 تک عوامی جمہوریہ البانیہ کے پہلے سربراہِ ریاست رہے — حکمران جماعت کے رکن ہوئے بغیر۔"
  es: "Médico y político albanés (1887-1954). Estudió medicina en Estambul y ejerció en Viena, Ballsh, Tirana y Durrës, participó en la lucha contra Ahmet Zogu y luego contra la ocupación fascista, presidió el Consejo Nacional de Liberación Antifascista en 1944 con la cartera de asuntos exteriores, y fue el primer presidente del Presidium de la Asamblea Popular —el primer jefe de Estado— de la República Popular de Albania desde 1946 hasta 1953, sin ser miembro del partido gobernante."
  fr: "Médecin et homme politique albanais (1887-1954). Il étudia la médecine à Istanbul et exerça à Vienne, Ballsh, Tirana et Durrës. Il participa à la lutte contre Ahmet Zogu puis contre l'occupation fasciste, présida le Conseil national de libération antifasciste en 1944, chargé des affaires étrangères, et fut le premier président du Présidium de l'Assemblée populaire – le premier chef d'État – de la République populaire d'Albanie de 1946 à 1953, sans être membre du parti au pouvoir."
  tr: "Arnavut hekim ve siyasetçi (1887-1954). İstanbul'da tıp eğitimi aldı ve Viyana, Balc, Tiran ve Durrës'te doktor olarak çalıştı. Ahmet Zogu'ya karşı mücadeleye, ardından faşist işgalete karşı mücadeleye katıldı. 1944'te anti-faşist Ulusal Kurtuluş Konseyi'nin başkanı oldu ve ardından Dışişleri Bakanı oldu; ardından 1946-1953 yılları arasında Arnavutluk Halk Cumhuriyeti'nde iktidar partisi üyesi olmadan Halk Meclisi Başkanlığı'nın ilk başkanı—yani ilk devlet başkanı oldu."
  id: "Dokter dan politisi Albania (1887-1954). Ia belajar kedokteran di Istanbul dan bekerja sebagai dokter di Wina, Balc, Tirana, dan Durrës. Ia ikut serta dalam perjuangan melawan Ahmet Zogu dan kemudian melawan pendudukan fasis. Ia menjadi kepala Dewan Pembebasan Nasional anti-fasis pada tahun 1944 dan Menteri Luar Negeri, kemudian ketua pertama Presidium Majelis Rakyat—yaitu kepala negara pertama—di Republik Rakyat Albania dari tahun 1946 hingga 1953 tanpa menjadi anggota partai yang berkuasa."
