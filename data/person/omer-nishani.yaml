summary:
  ar: "طبيب وسياسي ألباني (1887-1954). درس الطب في إسطنبول وعمل طبيبا في فيينا وبالش وتيرانا ودوريس، وشارك في النضال ضد أحمد زوغو ثم ضد الاحتلال الفاشي، فصار رئيس مجلس التحرير الوطني المناهض للفاشية سنة 1944 ووزير الخارجية، ثم أول رئيس هيئة رئاسة الجمعية الشعبية — أي أول رئيس دولة — في جمهورية ألبانيا الشعبية من 1946 إلى 1953 من غير أن يكون عضوا في الحزب الحاكم."
  en: "Albanian physician and politician (1887–1954). He studied medicine in Istanbul and practised in Vienna, Ballsh, Tirana and Durrës, took part in the struggle against Ahmet Zogu and then against the fascist occupation, chaired the Anti-Fascist National Liberation Council in 1944 with the foreign-affairs portfolio, and served as first Chairman of the Presidium of the People's Assembly — the first head of state — of the People's Republic of Albania from 1946 to 1953, without being a member of the ruling party."
  ur: "البانوی طبیب اور سیاست دان (1887-1954)۔ انہوں نے استنبول میں طب کی تعلیم حاصل کی اور ویانا، بالش، تیرانا اور دراج میں طبیب رہے؛ احمد زوگو کے خلاف اور پھر فاشسٹ قبضے کے خلاف جدوجہد میں حصہ لیا، 1944 میں انسدادِ فاشسٹ قومی آزادی کونسل کے صدر بنے، اور 1946 سے 1953 تک عوامی جمہوریہ البانیہ کے پہلے سربراہِ ریاست رہے — حکمران جماعت کے رکن ہوئے بغیر۔"
