summary:
  ar: "عالمة سعودية أمريكية في النانوميديسن والكيمياء، وُلدت سنة 1976. تدير مركز التميز في النانوميديسن بجامعة كاليفورنيا سان دييغو، وابتكرت جسيمات نانوية بوليمرية تستجيب للالتهاب لاستهداف توصيل الأدوية، ومن أعمالها جسيمات قابلة للتحلل في نطاق الأشعة تحت الحمراء القريبة."
  en: "Saudi-American chemist and nanomedicine researcher, born in 1976. She directs the Center of Excellence in Nanomedicine at the University of California, San Diego, and invented inflammation-responsive polymeric nanoparticles for targeted drug delivery, including near-infrared degradable polymers."
  ur: "سعودی نژاد امریکی کیمیا دان اور نینو میڈیسن محقق، 1976 میں پیدا ہوئیں۔ وہ یونیورسٹی آف کیلیفورنیا سان ڈیگو میں سینٹر آف ایکسیلنس اِن نینو میڈیسن کی سربراہ ہیں اور انہوں نے دواؤں کی ہدف بند ترسیل کے لیے سوزش سے متاثر ہونے والے پولیمرک نینو ذرّات ایجاد کیے، جن میں قریبِ زیریں سرخ شعاعوں میں تحلیل ہونے والے پولیمر بھی شامل ہیں۔"
  es: "Química saudí-estadounidense e investigadora en nanomedicina, nacida en 1976. Dirige el Centro de Excelencia en Nanomedicina de la Universidad de California en San Diego e inventó nanopartículas poliméricas sensibles a la inflamación para la administración dirigida de fármacos, incluidos polímeros degradables por infrarrojo cercano."
  fr: "Chimiste et chercheuse en nanomédecine saoudo-américaine, née en 1976. Elle dirige le Centre d'excellence en nanomédecine de l'Université de Californie à San Diego et a inventé des nanoparticules polymères sensibles à l'inflammation pour l'administration ciblée de médicaments, notamment des polymères dégradables dans le proche infrarouge."
