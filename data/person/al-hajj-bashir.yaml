summary:
  ar: "القائد الذي برزت بطولاته في الدفاع عن الجزائر ضد حملة شارل الخامس سنة ٩٤٨هـ/١٥٤١م؛ يصفه الصلابي بأنه استطاع بجنوده أن يحصد رؤوس المهاجمين بشجاعة فائقة وبسالة نادرة {cite:dawlat-uthmaniyya-salabi p. 225}."
  en: "The commander whose exploits stood out in Algiers' 948/1541 defence against Charles V's expedition — al-Salabi credits him with cutting down the attackers 'with supreme courage and rare gallantry' {cite:dawlat-uthmaniyya-salabi p. 225}."
  fr: "Commandant dont les exploits se distinguèrent dans la défense d’Alger en 948 H/1541 contre l’expédition de Charles Quint ; al-Salabi lui attribue d’avoir abattu les assaillants « avec un courage suprême et une bravoure rare » {cite:dawlat-uthmaniyya-salabi p. 225}."
  es: "El comandante cuyas hazañas destacaron en la defensa de Argel en 948/1541 contra la expedición de Carlos V, al-Salabi le atribuye haber abatido a los atacantes \"con supremo coraje y rara gallardía\" {cite:dawlat-uthmaniyya-salabi p. 225}."
  ur: "وہ کمانڈر جس کے کارنامے چارلس پنجم کی مہم کے خلاف الجزائر کے 948/1541 کے دفاع میں نمایاں تھے - السلابی نے اسے 'عالی ہمت اور غیر معمولی بہادری کے ساتھ حملہ آوروں کو کاٹنے کا سہرا دیا'۔ 225}۔"
  tr: "948 Hicri/1541 Miladi yılında V. Karl'ın seferine karşı Cezayir'in savunmasında kahramanlığı açıkça görülen komutan; El-Salabi onu, askerleriyle birlikte, saldırganların kafalarını olağanüstü cesaret ve nadir bir kahramanlıkla kesebilen biri olarak tanımlar {cite:dawlat-uthmaniyya-salabi s. 225}."
  id: "Komandan yang kepahlawanannya terbukti dalam mempertahankan Aljazair dari serangan Charles V pada tahun 948 H/1541 M; Al-Salabi menggambarkannya sebagai sosok yang, bersama tentaranya, mampu memenggal kepala para penyerang dengan keberanian luar biasa dan kegagahan yang langka {cite:dawlat-uthmaniyya-salabi p. 225}."
