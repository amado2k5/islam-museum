summary:
  ar: "لاعب كرة قدم ألماني محترف (وُلد سنة 1990 في غيلسنكيرشن لأبوين تركيين). وسط فاز مع بوروسيا دورتموند بثنائية الدوري الألماني وكأس ألمانيا سنة 2012، ثم قاد مانشستر سيتي إلى ثلاثية قارية في 2022–23، ولعب لبرشلونة، وانضم إلى غلطة سراي سنة 2025؛ خاض 82 مباراة دولية مع ألمانيا وقادها في أمم أوروبا 2024."
  en: "German professional footballer (born 1990 in Gelsenkirchen to Turkish parents). A midfielder who won the Bundesliga and DFB-Pokal double with Borussia Dortmund in 2012 and captained Manchester City to a continental treble in 2022–23, before playing for Barcelona and joining Galatasaray in 2025; he won 82 caps for Germany and captained them at Euro 2024."
  ur: "جرمن پیشہ ور فٹبالر (پیدائش 1990، گیلزن کیرشن، ترک والدین کے ہاں)۔ مڈفیلڈر جنہوں نے 2012 میں بوروسیا ڈورٹمنڈ کے ساتھ بنڈس لیگا اور جرمن کپ کی ڈبل جیتی، پھر مانچسٹر سٹی کی کپتانی میں 2022–23 میں براعظمی ٹریبل جیتا، بارسلونا کے لیے کھیلے اور 2025 میں گالاتاسرائے میں شامل ہوئے؛ جرمنی کے لیے 82 بین الاقوامی میچ کھیلے اور یورو 2024 میں اس کی کپتانی کی۔"
