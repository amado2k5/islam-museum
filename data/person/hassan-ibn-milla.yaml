summary:
  ar: "من الضبيب رهط رفاعة بن زيد من جذام؛ صحب دحية الكلبي قبل الإغارة عليه فعلّمه أم الكتاب، وكان متكلم ركب الضبيب حين لقوا جيش زيد بن حارثة فقال: إنا قوم مسلمون، وقرأ أم الكتاب على زيد، وهو الذي قال لرفاعة: إنك لجالس تحلب المعزى ونساء جذام أسارى؛ قال ابن هشام: ويقال حيان بن ملة."
  en: "Of the Dubayb, Rifa'a ibn Zayd's clan of Judham; he had accompanied Dihya al-Kalbi before the robbery and taught him Umm al-Kitab, spoke for the Dubayb riders who met Zayd ibn Haritha's army, saying we are Muslims, recited Umm al-Kitab to Zayd, and told Rifa'a he sat milking goats while Judham's women were captives; Ibn Hisham: also said to be Hayyan ibn Milla."
