summary:
  ar: "من الضبيب رهط رفاعة بن زيد من جذام؛ صحب دحية الكلبي قبل الإغارة عليه فعلّمه أم الكتاب، وكان متكلم ركب الضبيب حين لقوا جيش زيد بن حارثة فقال: إنا قوم مسلمون، وقرأ أم الكتاب على زيد، وهو الذي قال لرفاعة: إنك لجالس تحلب المعزى ونساء جذام أسارى؛ قال ابن هشام: ويقال حيان بن ملة."
  en: "Of the Dubayb, Rifa'a ibn Zayd's clan of Judham; he had accompanied Dihya al-Kalbi before the robbery and taught him Umm al-Kitab, spoke for the Dubayb riders who met Zayd ibn Haritha's army, saying we are Muslims, recited Umm al-Kitab to Zayd, and told Rifa'a he sat milking goats while Judham's women were captives; Ibn Hisham: also said to be Hayyan ibn Milla."
  ur: "ضبیب سے، جذام میں رفاعہ بن زید کا قبیلہ؛ لوٹ سے پہلے دحیہ الکلبی کے ساتھ رہا اور اسے ام الکتاب سکھایا اور اس کے لیے بولا۔"
  es: "De los Dubayb, el clan de Rifa'a ibn Zayd de Judham; había acompañado a Dihya al-Kalbi antes del robo y le enseñó Umm al-Kitab, habló en nombre de los jinetes Dubayb que se encontraron con el ejército de Zayd ibn Haritha, diciendo que somos musulmanes, recitó Umm al-Kitab a Zayd y le dijo a Rifa'a que se sentó a ordeñar cabras mientras las mujeres de Judham estaban cautivas; Ibn Hisham: también se dice que es Hayyan ibn Milla."
  fr: "Ibn Hisham, du clan Dubayb de Rifa'a ibn Zayd de Judham, avait accompagné Dihya al-Kalbi avant le vol et lui avait enseigné Umm al-Kitab, avait parlé au nom des cavaliers Dubayb qui rencontrèrent l'armée de Zayd ibn Haritha, disant que nous sommes musulmans, avait récité Umm al-Kitab à Zayd et avait dit à Rifa'a qu'il était assis à traire des chèvres pendant que les femmes de Judham étaient captives; Ibn Hisham: également considéré comme Hayyan ibn Milla."
  tr: "Dhubaib'den Jadham'dan Rifa'ah ibn Zayd grubu vardı; baskından önce Dihyah al-Kalbi'ye eşlik etti ve ona Ümm'i Kitab'ı öğretti. Zayda bin Haritha'nın ordusuyla karşılaştıklarında el-Dhubayb'a binen bir konuşmacıydı ve dedi ki: Biz bir Müslümanız. Ümmül-Kitab'ı Zayd'a okudu, Zayd ise Rifa'ah'a şöyle dedi: \"Sen keçi sağıyorsun ve Jadham'ın kadınları esir kaldı; İbn Hisham dedi ki: Hayyan ibn Millah da söylenir.\""
  id: "Dari Dhubaib adalah kelompok Rifa'ah ibn Zayd dari Jadham; ia menemani Dihyah al-Kalbi sebelum serangan dan mengajarinya um al-Kitab. Ia adalah seorang pembicara yang menunggang al-Dhubayb ketika mereka bertemu pasukan Zayd ibn Haritha dan berkata: Kami adalah bangsa Muslim. Ia membacakan um al-Kitab kepada Zayd, yang berkata kepada Rifa'ah: Kamu sedang duduk memerah susu kambing dan wanita-wanita Jadham adalah tawanan; Ibn Hisham berkata: Juga dikatakan Hayyan ibn Millah."
