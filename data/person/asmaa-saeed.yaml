summary:
  ar: «استشارية صحة نفسية مصرية تدير قناة «أكاديمية نفس مطمئنة» على يوتيوب وموقعًا رسميًا ودورات مسجلة، وتقدّم إرشادًا نفسيًا مؤطرًا بالإيمان يجمع بين الصحة النفسية وتعميق الصلة بالله، وكثير من مقاطعها موجّه إلى النساء.»
  en: "An Egyptian mental-health consultant who runs the YouTube channel 'Nafs Mutma'inna Academy' (The Tranquil Soul Academy), an official website and recorded courses, offering faith-framed psychological guidance that combines mental health with deepening the connection with God; many of her videos are addressed to women."
  ur: «مصری ماہرِ نفسیاتی صحت جو یوٹیوب چینل «أكاديمية نفس مطمئنة» (مطمئن روح اکیڈمی)، ایک رسمی ویب سائٹ اور ریکارڈ شدہ کورسز چلاتی ہیں، اور ایمان کے دائرے میں نفسیاتی رہنمائی پیش کرتی ہیں جو نفسیاتی صحت کو خدا سے تعلق گہرا کرنے کے ساتھ جوڑتی ہے؛ ان کی بہت سی ویڈیوز خواتین سے مخاطب ہیں۔»
