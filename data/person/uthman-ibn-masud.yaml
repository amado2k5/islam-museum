class: person
label: { ar: "عثمان بن مسعود", en: "Uthman ibn Mas'ud", es: "Uthman ibn Mas'ud", fr: "Uthman ibn Mas'ud", ur: "عثمان بن مسعود" }
summary:
  ar: "عثمان بن مسعود؛ وجهه المفضل بن المهلب إلى الترمذ في خمسة عشر ألفاً فنزل جزيرة تدعى اليوم جزيرة عثمان فضيق على موسى بن عبد الله بن خازم وكتب إلى طرخون فقدم عليه فلما خرج موسى قال وثبة موسى ورب الكعبة وقصد له حتى قتل سنة ٨٥."
  en: "Uthman ibn Mas'ud; sent by al-Mufaddal with fifteen thousand he camped on 'Uthman's Island' by Tirmidh, tightened on Musa with Tarkhun's coming, and marked him — 'Musa's leap, by the Lord of the Ka'ba' — to his death in 85h."
  es: "Uthman ibn Mas'ud, enviado por al-Mufaddal con quince mil hombres, acampó en la 'Isla de Uthman', cerca de Tirmidh, se acercó a Musa con la llegada de Tarkhun y lo marcó —'el salto de Musa, por el Señor de la Kaaba'— hasta su muerte en el año 85 h."
  fr: "Uthman ibn Mas'ud; envoyé par al-Mufaddal avec quinze mille hommes, il campa sur « l'île d'Uthman » selon Tirmidh, se resserra sur Musa avec l'arrivée de Tarkhun, et le marqua — « le saut de Musa, par le Seigneur de la Ka'ba » — jusqu'à sa mort en 85 h."
  ur: "عثمان بن مسعود؛ المفضل کی طرف سے پندرہ ہزار کے ساتھ بھیجا گیا، اس نے ترمذ کے ذریعہ عثمان کے جزیرے پر ڈیرہ ڈالا، ترخون کے آنے کے ساتھ ہی موسیٰ پر سختی کی، اور اسے نشان زد کیا - 'موسیٰ کی چھلانگ، رب کعبہ کی طرف سے' - 85ھ میں ان کی موت ہوگئی۔"
  tr: "Osman bin Mes'ud; el-Mufaddal ibn el-Muhallab onu on beş bin yıl sonra Tirmidh'e gönderdi, böylece şimdi Osman Adası olarak bilinen bir adaya yerleşti ve Musa ibn Abdullah ibn Khazim'e saldırdı ve Tarkhun'a yazdı, o da yanına geldi. Musa dışarı çıktığında, 'Musa'dan ve Kabe'nin Efendisinden atla' dedi ve 85 yılında öldürülene kadar ona doğru yürüdü."
  id: "Uthman ibn Mas'ud; al-Mufaddal ibn al-Muhallab mengirimnya ke al-Tirmidh dalam lima belas ribu tahun, sehingga ia menetap di sebuah pulau yang sekarang disebut Pulau Uthman, dan menyerang Musa ibn Abdullah ibn Khazim dan menulis surat kepada Tarkhun, yang datang kepadanya. Ketika Musa keluar, ia berkata, 'Lompat dari Musa dan Tuhan Ka'bah,' dan menuju ke arahnya hingga ia terbunuh pada tahun 85."
