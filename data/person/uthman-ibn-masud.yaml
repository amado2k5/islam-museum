summary:
  ar: "عثمان بن مسعود؛ وجهه المفضل بن المهلب إلى الترمذ في خمسة عشر ألفاً فنزل جزيرة تدعى اليوم جزيرة عثمان فضيق على موسى بن عبد الله بن خازم وكتب إلى طرخون فقدم عليه فلما خرج موسى قال وثبة موسى ورب الكعبة وقصد له حتى قتل سنة ٨٥."
  en: "Uthman ibn Mas'ud; sent by al-Mufaddal with fifteen thousand he camped on 'Uthman's Island' by Tirmidh, tightened on Musa with Tarkhun's coming, and marked him — 'Musa's leap, by the Lord of the Ka'ba' — to his death in 85h."
