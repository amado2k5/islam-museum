summary:
  ar: "إدريس بن السلطان يعقوب بن يوسف أبو العلاء المأمون؛ بايعوه بالأندلس ثم جاء إلى مراكش فملكها وعظم سلطانه وكان بطلاً شجاعاً ذا هيبة شديدة وسفك للدماء، قطع ذكر ابن تومرت من الخطبة، ومات غازياً سنة ثلاثين وستمائة {cite:shadharat-dhahab p. 136}."
  en: "Idris b. Ya'qub al-Ma'mun — acclaimed in al-Andalus then master of Marrakesh, a warrior of fierce awe and bloodshed who struck Ibn Tumart's name from the khutba; he died a ghazi in 630 {cite:shadharat-dhahab p. 136}."
  es: "Idris b. Ya'qub al-Ma'mun — aclamado en al-Ándalus, entonces señor de Marrakech, un guerrero de feroz temor y derramamiento de sangre que eliminó el nombre de Ibn Tumart de la jutba; murió como un gazi en 630 {cite:shadharat-dhahab p. 136}."
  fr: "Idris b. Ya'qub al-Ma'mun — acclamé en al-Andalus puis maître de Marrakech, guerrier d'une férocité et d'un sang-froid remarquables, qui a rayé le nom d'Ibn Tumart de la khutba; il est mort ghazi en 630 {cite:shadharat-dhahab p. 136}."
