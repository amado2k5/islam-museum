summary:
  ar: "إسحاق بن أحمد بن شيث، أبو نصر الصفار، وقيل إن اسمه أحمد بن إسحاق. فقيه حنفي من أهل بخارى. قال السمعاني إن لأسرته علماً ببخارى، وسكن مكة، وكثرت تصانيفه وانتشر علمه بها، ومات بالطائف. وذكره الحاكم في تاريخ نيسابور فوصفه بالفقه والأدب والحفظ، وذكر أنه طلب الحديث مع أنواع من العلم. توفي سنة 405 للهجرة بحسب عنوان المدخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
  en: "Ishaq ibn Ahmad ibn Shayth, Abu Nasr al-Saffar, though some name him Ahmad ibn Ishaq. A Hanafi jurist from Bukhara. al-Sam'ani says his family had standing in learning in Bukhara; he settled in Mecca, where his writings multiplied and his learning spread, and he died at al-Ta'if. al-Hakim, in his History of Nishapur, describes him as a jurist, a man of letters and a memoriser, who also sought hadith with other kinds of learning. The heading gives his death as 405 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
