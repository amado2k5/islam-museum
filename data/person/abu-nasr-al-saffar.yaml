summary:
  ar: "إسحاق بن أحمد بن شيث، أبو نصر الصفار، وقيل إن اسمه أحمد بن إسحاق. فقيه حنفي من أهل بخارى. قال السمعاني إن لأسرته علماً ببخارى، وسكن مكة، وكثرت تصانيفه وانتشر علمه بها، ومات بالطائف. وذكره الحاكم في تاريخ نيسابور فوصفه بالفقه والأدب والحفظ، وذكر أنه طلب الحديث مع أنواع من العلم. توفي سنة 405 للهجرة بحسب عنوان المدخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
  en: "Ishaq ibn Ahmad ibn Shayth, Abu Nasr al-Saffar, though some name him Ahmad ibn Ishaq. A Hanafi jurist from Bukhara. al-Sam'ani says his family had standing in learning in Bukhara; he settled in Mecca, where his writings multiplied and his learning spread, and he died at al-Ta'if. al-Hakim, in his History of Nishapur, describes him as a jurist, a man of letters and a memoriser, who also sought hadith with other kinds of learning. The heading gives his death as 405 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
  fr: "Ishaq ibn Ahmad ibn Shayth, Abu Nasr al-Saffar, que certains nomment Ahmad ibn Ishaq. Juriste hanafite de Boukhara. Al-Sam'ani dit que sa famille avait un rang dans le savoir à Boukhara ; il s'établit à La Mecque, où ses écrits se multiplièrent et son savoir se répandit, et il mourut à al-Ta'if. Al-Hakim, dans son Histoire de Nishapur, le décrit comme juriste, homme de lettres et mémorisateur, qui rechercha aussi le hadith avec d'autres savoirs. L'en-tête donne sa mort en 405 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
  es: "Ishaq ibn Ahmad ibn Shayth, Abu Nasr al-Saffar, aunque algunos lo llaman Ahmad ibn Ishaq. Un jurista hanafí de Bujará. Al-Sam'ani afirma que su familia gozaba de prestigio intelectual en Bujará; se estableció en La Meca, donde sus escritos se multiplicaron y su saber se difundió, y falleció en al-Ta'if. Al-Hakim, en su Historia de Nishapur, lo describe como un jurista, un hombre de letras y un memorizador, que también buscaba hadices junto con otros tipos de conocimiento. El encabezado indica que falleció en el año 405 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17457}"
