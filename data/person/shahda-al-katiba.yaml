  en: "Fakhr al-Nisa' Shahda bt. Ahmad al-Ibri (d. c. 574, aged over 90) — Baghdad's celebrated woman calligrapher and high-isnad muhadditha; taught crowds, her chains passing through al-Batri, Ibn al-Talha al-Nu'ali and Ibn al-Zayni {cite:wafayat-ayan}."
