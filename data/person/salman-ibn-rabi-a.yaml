summary:
  ar: "سلمان بن ربيعة الباهلي؛ عند البلاذري ص 361: غزا الشام مع أبي أمامة الصدي بن عجلان الباهلي فشهد مشاهد المسلمين ثم خرج إلى العراق فيمن خرج من المدد إلى القادسية متنجلاً فشهد الوقعة وأقام بالكوفة وقتل ببلنجر وقال الواقدي خدّ قوم من الأعاجم رايتهم وقالوا لا نبرح موضعنا حتى نموت فحمل عليهم فقتلهم وأخذ الراية. وعنده أيضاً ص 204: قيل إنه كان في جيش أبي عبيدة مع أبي أمامة الصدي بن عجلان صاحب رسول الله فنزل حصناً بقورس فنسب إليه وهو يعرف بحصن سلمان ثم قفل من الشام فيمن أُمدّ به سعد بن أبي وقاص وهو بالعراق؛ وقيل بل كان غزا الروم بعد فتح العراق وقبل شخوصه إلى أرمينية فعسكر عند هذا الحصن وقد خرج من ناحية مرعش فنسب إليه؛ وقيل إن سلمان وزياد من الصقالبة الذين رتّبهم مروان بن محمد في الثغور وسمع من يذكر أن سلمان هذا رجل من الصقالبة نسب إليه الحصن والله أعلم."
  en: "Salman ibn Rabi'a al-Bahili; in al-Baladhuri: it is said he was in Abu Ubayda's army with Abu Umama al-Suddi ibn Ajlan, companion of the Messenger of God, and lodged at a fortress in Qurus that was named after him — known as Hisn Salman — then returned from Syria among the reinforcements sent to Sa'd ibn Abi Waqqas in Iraq; others say he raided the Byzantines after Iraq's conquest and before his march on Armenia, camping by this fortress which he had reached from the Mar'ash side, whence the name; yet others hold that this Salman — with Ziyad — was of the Saqaliba whom Marwan ibn Muhammad stationed in the marches, and that the fortress was named for that man; God knows best."
  ur: "الباہلی سپہ سالار جو آرمینیا اور اران کی مہمات اور بلنجر سے وابستہ تھا؛ بلاذری اس کے سفر، معاہدوں اور وفات کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
  es: "Salman ibn Rabi'a al-Bahili; en al-Baladhuri: se dice que estuvo en el ejército de Abu Ubayda con Abu Umama al-Suddi ibn Ajlan, compañero del Mensajero de Dios, y se alojó en una fortaleza en Qurus que recibió su nombre —conocida como Hisn Salman—, luego regresó de Siria entre los refuerzos enviados a Sa'd ibn Abi Waqqas en Irak; otros dicen que asaltó a los bizantinos después de la conquista de Irak y antes de su marcha sobre Armenia, acampando junto a esta fortaleza a la que había llegado desde el lado de Mar'ash, de donde proviene el nombre; otros sostienen que este Salman —con Ziyad— era de los Saqaliba a quienes Marwan ibn Muhammad acantonó en las marcas, y que la fortaleza recibió su nombre en honor a ese hombre; Dios sabe mejor."
  fr: "Salman ibn Rabi'a al-Bahili; selon al-Baladhuri: il aurait servi dans l'armée d'Abu Ubayda avec Abu Umama al-Suddi ibn Ajlan, compagnon du Messager de Dieu, et aurait séjourné dans une forteresse de Qurus qui portait son nom – connue sous le nom de Hisn Salman – avant de revenir de Syrie avec les renforts envoyés à Sa'd ibn Abi Waqqas en Irak. D'autres affirment qu'il aurait mené des raids contre les Byzantins après la conquête de l'Irak et avant sa marche sur l'Arménie, campant près de cette forteresse qu'il avait rejointe depuis Mar'ash, d'où son nom. D'autres encore soutiennent que ce Salman – avec Ziyad – appartenait à la tribu des Saqaliba que Marwan ibn Muhammad avait postée dans les Marches, et que la forteresse aurait été nommée en l'honneur de cet homme. Dieu est le plus savant."
  tr: "Salman ibn Rabi'ah al-Bahili; el-Baladhuri'ye göre, s. 361: Ebu Umamah el-Saddi ibn Eclan el-Behili ile Suriye'yi işgal etti, Müslümanların savaşlarına tanık oldu, sonra Irak'a gitti. Bazı askerler saklanarak el-Kadisiye'ye gitti, savaşa tanık oldu, Kufe'de kaldı ve Balnagar'da öldürüldü. El-Vaqidi dedi ki: Sancaklarını gördüğüm bir grup Arap olmayanları aldım, onlar da 'Ölene kadar mevzilerimizi terk etmeyeceğiz.' dediler. Bunun üzerine onlara saldırdı, öldürdü ve bayrağı aldı. Ve ayrıca s. 204'te: Ebu Ubeyde ordusunda, Allah'ın Elçisi'nin sahabesi Ebu Umeme el-Saddi ibn Eclan ile birlikte olduğu söylenir. Kendisine atfedilen Kürus'taki bir kalede, Selman'ın kalesinde kamp kurmuş, ardından Irak'tayken Şam'dan onu destekleyenlerle sınırlandırılmıştır. Ayrıca, Irak'ı fethettikten sonra ve Ermenistan'a gitmeden önce bu kalenin yakınında kamp kurarak Mareş bölgesinden ayrılarak Romalıları işgal ettiği ve ona atfedildiği söylenir. Ayrıca Selman ve Ziyad'ın sınırda Mervan bin Muhammed'in düzenlediği Slavlardan olduğu da söylenir. Ayrıca Salman'ın kalenin Slav kökenli olduğu ve Allah'ın en iyisini bildiği de belirtilir."
  id: "Salman ibn Rabi'ah al-Bahili; menurut al-Baladhuri, hlm. 361: Ia menyerbu Suriah bersama Abu Umamah al-Saddi ibn Ajlan al-Bahili, menyaksikan pertempuran Muslim, lalu pergi ke Irak. Beberapa pasukan bersembunyi ke al-Qadisiyyah, menyaksikan pertempuran, tinggal di Kufa, dan tewas di Balnagar. Al-Waqidi berkata: Saya membawa sekelompok non-Arab yang panjinya saya lihat, dan mereka berkata, 'Kami tidak akan meninggalkan posisi kami sampai mati.' Jadi ia menyerang mereka, membunuh mereka, dan mengambil panji itu. Dan juga di hlm. 204: Dikatakan bahwa ia berada di tentara Abu Ubaidah bersama Abu Umamah al-Saddi ibn Ajlan, sahabat Rasulullah. Ia berkemah di sebuah benteng di Qurus, yang dikaitkan dengannya, dikenal sebagai benteng Salman, kemudian ia dikurung dari Levant hanya untuk mereka yang mendukungnya Sa'd ibn Abi Waqqas saat berada di Irak. Dikatakan juga bahwa ia menyerang Romawi setelah menaklukkan Irak dan sebelum berangkat ke Armenia, di mana ia berkemah di dekat benteng ini, meninggalkan wilayah Marash dan dikaitkan dengannya. Dikatakan juga bahwa Salman dan Ziyad berasal dari bangsa Slavia yang diatur Marwan ibn Muhammad di perbatasan. Juga disebutkan bahwa Salman adalah orang dari bangsa Slavia yang benteng itu dikaitkan dengan benteng, dan Allah yang paling tahu."
