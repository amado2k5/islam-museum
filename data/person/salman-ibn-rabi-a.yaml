summary:
  ar: "سلمان بن ربيعة الباهلي؛ عند البلاذري ص 361: غزا الشام مع أبي أمامة الصدي بن عجلان الباهلي فشهد مشاهد المسلمين ثم خرج إلى العراق فيمن خرج من المدد إلى القادسية متنجلاً فشهد الوقعة وأقام بالكوفة وقتل ببلنجر وقال الواقدي خدّ قوم من الأعاجم رايتهم وقالوا لا نبرح موضعنا حتى نموت فحمل عليهم فقتلهم وأخذ الراية. وعنده أيضاً ص 204: قيل إنه كان في جيش أبي عبيدة مع أبي أمامة الصدي بن عجلان صاحب رسول الله فنزل حصناً بقورس فنسب إليه وهو يعرف بحصن سلمان ثم قفل من الشام فيمن أُمدّ به سعد بن أبي وقاص وهو بالعراق؛ وقيل بل كان غزا الروم بعد فتح العراق وقبل شخوصه إلى أرمينية فعسكر عند هذا الحصن وقد خرج من ناحية مرعش فنسب إليه؛ وقيل إن سلمان وزياد من الصقالبة الذين رتّبهم مروان بن محمد في الثغور وسمع من يذكر أن سلمان هذا رجل من الصقالبة نسب إليه الحصن والله أعلم."
  en: "Salman ibn Rabi'a al-Bahili; in al-Baladhuri: it is said he was in Abu Ubayda's army with Abu Umama al-Suddi ibn Ajlan, companion of the Messenger of God, and lodged at a fortress in Qurus that was named after him — known as Hisn Salman — then returned from Syria among the reinforcements sent to Sa'd ibn Abi Waqqas in Iraq; others say he raided the Byzantines after Iraq's conquest and before his march on Armenia, camping by this fortress which he had reached from the Mar'ash side, whence the name; yet others hold that this Salman — with Ziyad — was of the Saqaliba whom Marwan ibn Muhammad stationed in the marches, and that the fortress was named for that man; God knows best."
  ur: "الباہلی سپہ سالار جو آرمینیا اور اران کی مہمات اور بلنجر سے وابستہ تھا؛ بلاذری اس کے سفر، معاہدوں اور وفات کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
