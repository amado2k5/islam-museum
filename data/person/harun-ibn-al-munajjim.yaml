summary:
  ar: "أبو عبد الله هارون بن علي بن يحيى بن أبي منصور المنجم البغدادي الأديب الفاضل؛ كان حافظاً راوية للأشعار حسن المؤانسة لطيف المجالسة؛ صنف كتاب «البارع» في أخبار الشعراء المولدين وجمع فيه مائة وواحداً وستين شاعراً افتتحه بذكر بشار بن برد وختمه بمحمد بن عبد الملك ابن صالح، واختار فيه من شعر كل واحد عيونه وقال في أوله إن اختيار الرجل قطعة من علمه {cite:wafayat-ayan}."
  en: "Harun b. al-Munajjim — Baghdadi man of letters, memoriser and transmitter of verse; author of Kitab al-Bari' selecting choice lines from 161 modern poets {cite:wafayat-ayan}."
