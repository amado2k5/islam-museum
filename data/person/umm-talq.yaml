roles: [mystic]
summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، يروي عن شعبة بن دخان أنها كانت تصلي في اليوم والليلة أربعمائة ركعة، وعن عاصم الجحدري قولها: «النفس ملك إن أتبعتها، ومملوك إن أتعبتها»، وقالت لابنها طلق: ما أحسن صوتك بالقرآن، فليته لا يكون عليك وبالاً يوم القيامة."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa: Shu'ba ibn Dukhan reported that she prayed four hundred rak'as each day and night, and Asim al-Jahdari quotes her: 'The soul is a king if you follow it, and a slave if you tire it.' She told her son Talq, 'How beautiful your voice in the Qur'an is — may it not be a burden on you on the Day of Resurrection.'"
  es: "Una mujer devota de Basora, registrada por Ibn al-Jawzi en Sifat al-Safwa, Shu'ba ibn Dukhan relató que rezaba cuatrocientas rak'as cada día y noche. Asim al-Jahdari la cita diciendo: «El alma es un rey si la sigues, y una esclava si la cansas». Le dijo a su hijo Talq: «¡Qué hermosa es tu voz en el Corán! Que no sea una carga para ti el Día de la Resurrección»."
  fr: "Une femme pieuse de Bassora, mentionnée par Ibn al-Jawzi dans son ouvrage Sifat al-Safwa, rapporte que Shu'ba ibn Dukhan priait quatre cents rak'as chaque jour et chaque nuit. Asim al-Jahdari la cite: « L'âme est reine si on la suit, et esclave si on la fatigue. » Elle dit à son fils Talq: « Que ta voix est belle dans le Coran ! Puisse-t-elle ne pas te peser le Jour de la Résurrection. »"
