roles: [mystic]
summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، يروي عن شعبة بن دخان أنها كانت تصلي في اليوم والليلة أربعمائة ركعة، وعن عاصم الجحدري قولها: «النفس ملك إن أتبعتها، ومملوك إن أتعبتها»، وقالت لابنها طلق: ما أحسن صوتك بالقرآن، فليته لا يكون عليك وبالاً يوم القيامة."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa: Shu'ba ibn Dukhan reported that she prayed four hundred rak'as each day and night, and Asim al-Jahdari quotes her: 'The soul is a king if you follow it, and a slave if you tire it.' She told her son Talq, 'How beautiful your voice in the Qur'an is — may it not be a burden on you on the Day of Resurrection.'"
