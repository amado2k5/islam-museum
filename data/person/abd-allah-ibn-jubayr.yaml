id: person/abd-allah-ibn-jubayr
class: person
label: { ar: "عبد الله بن جبير بن النعمان الأنصاري الأوسي", en: "Abd Allah ibn Jubayr ibn al-Numan al-Ansari" , ur: "عبد اللہ بن جبیر انصاری"}
summary:
  ar: "صحابي أنصاري أوسي بدري. عيّنه النبي قائداً لفصيلة الرماة الخمسين في غزوة أحد وأوصاهم بألا يبرحوا موقفهم على الجبل نصراً كان أم هزيمة. لما تركه أغلب أصحابه طمعاً في الغنيمة ثبت هو وتسعة معه في الجبل. قُتل على يد خالد بن الوليد وفرسانه لما نفّذوا الالتفاف. كان بدرياً وهو شرف رفيع {cite:mubarakpuri-raheeq p.255}."
  en: "An Ansari Companion of the Aws who fought at Badr. The Prophet appointed him commander of the fifty-archer detachment at Uhud and charged them not to leave their position on the hill in victory or defeat. When most of his men left seeking spoils, he held firm with nine others on the hill. He was killed by Khalid ibn al-Walid and his cavalry when they executed the flanking manoeuvre. He was a Badri, which is a high honour {cite:mubarakpuri-raheeq p.255}."
  ur: "اوس کے انصاری صحابی اور بدر کے شریک؛ احد میں پچاس تیر اندازوں کے قائد مقرر ہوئے، اپنے ساتھیوں کی اکثریت کے چلے جانے کے بعد نو افراد کے ساتھ ڈٹے رہے اور گھڑ سواروں کے حملے میں مارے گئے۔ {cite:mubarakpuri-raheeq}"
