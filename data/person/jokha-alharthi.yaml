summary:
  ar: "كاتبة وأكاديمية عُمانية وُلدت سنة 1978، أستاذة مشاركة في الأدب العربي بجامعة السلطان قابوس في مسقط، نالت الدكتوراه في الأدب العربي الكلاسيكي من جامعة إدنبرة سنة 2011. فازت روايتها «سيدات القمر» بجائزة مان بوكر العالمية سنة 2019 في ترجمتها الإنجليزية «أجرام سماوية»، فكانت أول كاتب عربي يفوز بها؛ ومن رواياتها «منامات» و«نارنجة» و«حرير الغزالة»."
  en: "Omani writer and academic, born in 1978; associate professor of Arabic literature at Sultan Qaboos University in Muscat, with a doctorate in classical Arabic literature from the University of Edinburgh (2011). Her novel Sayyidat al-Qamar, in Marilyn Booth's English translation Celestial Bodies, won the Man Booker International Prize in 2019, making her the first Arab author to win it; her other novels include Manamat, Narinjah (Bitter Orange Tree) and Harir al-Ghazala (Silken Gazelles)."
  ur: "عمانی مصنفہ اور استاد، 1978 میں پیدا ہوئیں؛ مسقط کی سلطان قابوس یونیورسٹی میں عربی ادب کی ایسوسی ایٹ پروفیسر ہیں اور ایڈنبرا یونیورسٹی سے کلاسیکی عربی ادب میں ڈاکٹریٹ (2011) حاصل کی۔ ان کے ناول «سيدات القمر» کے انگریزی ترجمے «Celestial Bodies» نے 2019 میں مین بکر انٹرنیشنل پرائز جیتا اور وہ یہ انعام پانے والی پہلی عرب مصنفہ بنیں۔"
