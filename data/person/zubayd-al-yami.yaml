summary:
  ar: "زبيد بن الحارث بن عبد الكريم بن عمرو بن كعب، أبو عبد الرحمن اليامي، روى عن مرة بن شراحيل وسعد بن عبيدة وعبد الرحمن أبي ليلى، وعنه ابناه عبد الله وعبد الرحمن وجرير بن حازم والثوري. قال ابن معين وأبو حاتم والنسائي: ثقة، وذكره ابن حبان في الثقات، وتوفي سنة 122هـ على قول، وقيل غير ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3487}"
  en: "Zubayd ibn al-Harith al-Yami, Abu Abd al-Rahman, who narrated from Murra ibn Sharahil, Sa'd ibn Ubayda and Abd al-Rahman Abi Layla, and whose narrators included his two sons, Jarir ibn Hazim and al-Thawri. Ibn Ma'in, Abu Hatim and al-Nasa'i called him reliable; the page gives his death as 122 AH on one account, with other dates also reported. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3487}"
