summary:
  ar: "زبيد بن الحارث بن عبد الكريم بن عمرو بن كعب، أبو عبد الرحمن اليامي، روى عن مرة بن شراحيل وسعد بن عبيدة وعبد الرحمن أبي ليلى، وعنه ابناه عبد الله وعبد الرحمن وجرير بن حازم والثوري. قال ابن معين وأبو حاتم والنسائي: ثقة، وذكره ابن حبان في الثقات، وتوفي سنة 122هـ على قول، وقيل غير ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3487}"
  en: "Zubayd ibn al-Harith al-Yami, Abu Abd al-Rahman, who narrated from Murra ibn Sharahil, Sa'd ibn Ubayda and Abd al-Rahman Abi Layla, and whose narrators included his two sons, Jarir ibn Hazim and al-Thawri. Ibn Ma'in, Abu Hatim and al-Nasa'i called him reliable; the page gives his death as 122 AH on one account, with other dates also reported. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3487}"
  es: "Zubayd ibn al-Harith al-Yami, Abu Abd al-Rahman, quien narró de Murra ibn Sharahil, Sa'd ibn Ubayda y Abd al-Rahman Abi Layla, y entre cuyos narradores se encontraban sus dos hijos, Jarir ibn Hazim y al-Thawri. Ibn Ma'in, Abu Hatim y al-Nasa'i lo consideraron fiable; la página indica que falleció en el año 122 de la Hégira en una ocasión, aunque también se mencionan otras fechas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3487}"
  fr: "Zubayd ibn al-Harith al-Yami, Abu Abd al-Rahman, qui rapporta de Murra ibn Sharahil, Sa'd ibn Ubayda et Abd al-Rahman Abi Layla, et dont les narrateurs comprenaient ses deux fils, Jarir ibn Hazim et al-Thawri. Ibn Ma'in, Abu Hatim et al-Nasa'i le considéraient comme digne de confiance; la page indique sa mort en 122 AH selon un récit, d'autres dates étant également rapportées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3487}"
  ur: "زبید بن حارث ال یمی، ابو عبدالرحمن، جنہوں نے مرہ بن شراحل، سعد بن عبیدہ اور عبدالرحمٰن ابی لیلیٰ سے روایت کی ہے اور جن کے راویوں میں ان کے دو بیٹے جریر بن حازم اور الثوری شامل ہیں۔ ابن معین، ابو حاتم اور نسائی نے اسے معتبر کہا ہے۔ ایک صفحہ میں ان کی وفات 122ھ بتائی گئی ہے، دوسری تاریخوں کے ساتھ۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص3487}"
