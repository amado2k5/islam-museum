  es: "La última otorgante de ijaza viva de su tiempo — 'el recurso de los transmisores', murió en Safar 647 a los noventa y tres años {cite:shadharat-dhahab p. 246}."
  ur: "اپنے وقت کے آخری زندہ اعجاز دینے والے - 'منتقل کرنے والوں کا سہارا'، صفر 647 میں ترانوے میں وفات پاگئے۔ 246}۔"
  tr: "Dünyada (rivayetleri) dinleme yetkisine sahip son kişiydi ve rivayetçiler için temel dayanak noktasıydı. Safer'de doksan üç yaşında vefat etti. {cite:shadharat-dhahab s. 246}"
  id: "Orang terakhir di dunia yang berwenang untuk mendengar (riwayat) — dan dialah penopang bagi para perawi. Dia meninggal di Safar pada usia sembilan puluh tiga tahun. {cite:shadharat-dhahab p. 246}."
