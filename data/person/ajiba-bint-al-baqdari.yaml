  ar: "آخر من أجاز في الدنيا سماعاً — وهي العمدة للرواة، توفيت في صفر عن ثلاث وتسعين سنة {cite:shadharat-dhahab p. 246}."
  en: "The last living ijaza-granter of her time — 'the recourse of the transmitters', dead in Safar 647 at ninety-three {cite:shadharat-dhahab p. 246}."
