summary:
  ar: "جناح سعودي محترف، وُلد في جدة سنة 1991 لأسرة من الأفلاج، وهو قائد نادي الهلال ومنتخب السعودية. قضى مسيرته كلها مع الهلال باستثناء إعارة قصيرة إلى فياريال الإسباني سنة 2018. اشتهر عالميًا بهدف الفوز على الأرجنتين في كأس العالم 2022، وعادل بسجله في كؤوس العالم (ثلاثة أهداف) رقم سامي الجابر القياسي سعوديًا."
  en: "Saudi Arabian professional footballer (left winger), born in Jeddah in 1991 to a family from Al-Aflaj, who captains both Al-Hilal and the Saudi Arabia national team. He has spent his whole career at Al-Hilal apart from a short loan at Villarreal in Spain in 2018. He is best known worldwide for the winning goal against Argentina at the 2022 FIFA World Cup, and his three World Cup goals equal Sami Al-Jaber's Saudi record."
  ur: "سعودی پیشہ ور فٹبالر (بائیں ونگر)، 1991 میں جدہ میں الافلاج سے تعلق رکھنے والے خاندان میں پیدا ہوئے؛ وہ الہلال اور سعودی عرب کی قومی ٹیم دونوں کے کپتان ہیں۔ انہوں نے اپنا پورا کیریئر الہلال میں گزارا سوائے 2018 میں اسپین کے ویاریال میں مختصر قرض کے۔ وہ 2022 فیفا ورلڈ کپ میں ارجنٹائن کے خلاف جیت کا گول کرنے کے لیے دنیا بھر میں مشہور ہیں، اور ان کے تین ورلڈ کپ گول سامی الجابر کے سعودی ریکارڈ کے برابر ہیں۔"
