summary:
  ar: "كاتب وشاعر وصحفي فلسطيني ⁦(وُلد في حي الشيخ جراح بالقدس سنة 1998)⁩. عُرف عالمياً بتوثيقه قضية إخلاء عائلات الحي سنة 2021 مع شقيقته التوأم منى، وأُدرجا معاً في قائمة تايم 100. من أعماله ديوان «رفقة» (2021) وكتاب «ضحايا كاملون» (2025)."
  en: "Palestinian writer, poet and journalist (born 1998 in Sheikh Jarrah, Jerusalem). He came to world attention documenting the Sheikh Jarrah evictions in 2021 alongside his twin sister Muna, with whom he was named to the Time 100. His works include the poetry collection Rifqa (2021) and Perfect Victims (2025)."
  ur: "فلسطینی مصنف، شاعر اور صحافی ⁦(پیدائش 1998ء، شیخ جراح، قدس)⁩۔ 2021ء میں شیخ جراح کے اخراج کی دستاویز سازی سے اپنی جڑواں بہن مونا کے ساتھ عالمی شہرت پائی اور دونوں ٹائم 100 میں شامل ہوئے۔ ان کے کاموں میں شعری مجموعہ «رفقہ» ⁦(2021ء)⁩ اور کتاب «کامل متاثرین» ⁦(2025ء)⁩ شامل ہیں۔"
  es: "Escritor, poeta y periodista palestino (nacido en 1998 en Sheikh Jarrah, Jerusalén). Saltó a la fama mundial al documentar los desalojos de Sheikh Jarrah en 2021 junto a su hermana gemela Muna, con quien fue incluido en la lista Time 100. Entre sus obras destacan el poemario Rifqa (2021) y Perfect Victims (2025)."
  fr: "Écrivain, poète et journaliste palestinien (né en 1998 à Sheikh Jarrah, Jérusalem). Il s'est fait connaître internationalement en documentant les expulsions de Sheikh Jarrah en 2021 avec sa sœur jumelle Muna, avec laquelle il a figuré dans le classement Time 100. Parmi ses œuvres figurent le recueil de poésie Rifqa (2021) et Perfect Victims (2025)."
  tr: "Filistinli bir yazar, şair ve gazeteci (1998'de Kudüs'ün Şeyh Jarrah mahallesinde doğdu). 2021'de ikiz kız kardeşi Mona ile birlikte mahalle ailelerinin tahliyesini belgelemesiyle uluslararası alanda tanındı ve birlikte Time 100 listesine dahil edildiler. Eserleri arasında \"Rifqa\" (2021) adlı derleme ve 2025'te yayımlanan \"Complete Victims\" kitabı yer almaktadır."
  id: "Seorang penulis, penyair, dan jurnalis Palestina (lahir di lingkungan Sheikh Jarrah, Yerusalem pada tahun 1998). Ia dikenal secara internasional karena mendokumentasikan evakuasi keluarga di lingkungan sekitar pada tahun 2021 bersama saudara kembarnya Mona, dan bersama-sama mereka masuk dalam daftar Time 100. Karya-karyanya meliputi kumpulan \"Rifqa\" (2021) dan buku \"Complete Victims\" (2025)."
