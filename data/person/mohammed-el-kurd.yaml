summary:
  ar: "كاتب وشاعر وصحفي فلسطيني (وُلد في حي الشيخ جراح بالقدس سنة 1998). عُرف عالمياً بتوثيقه قضية إخلاء عائلات الحي سنة 2021 مع شقيقته التوأم منى، وأُدرجا معاً في قائمة تايم 100. من أعماله ديوان «رفقة» (2021) وكتاب «ضحايا كاملون» (2025)."
  en: "Palestinian writer, poet and journalist (born 1998 in Sheikh Jarrah, Jerusalem). He came to world attention documenting the Sheikh Jarrah evictions in 2021 alongside his twin sister Muna, with whom he was named to the Time 100. His works include the poetry collection Rifqa (2021) and Perfect Victims (2025)."
  ur: "فلسطینی مصنف، شاعر اور صحافی (پیدائش 1998ء، شیخ جراح، قدس)۔ 2021ء میں شیخ جراح کے اخراج کی دستاویز سازی سے اپنی جڑواں بہن مونا کے ساتھ عالمی شہرت پائی اور دونوں ٹائم 100 میں شامل ہوئے۔ ان کے کاموں میں شعری مجموعہ «رفقہ» (2021ء) اور کتاب «کامل متاثرین» (2025ء) شامل ہیں۔"
