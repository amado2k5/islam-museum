label: { ar: "فرخ خزاذ خسروا" }
summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك فرخ خزاذ خسروا» {cite:tabari-tarikh-abu-al-fadl j.2 p.234}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "Sasani Pers kralları arasında bir kral, el-Tabari'nin \"Khazad'ın bir civcivinin kralından bahsediler, kaybettiler\" başlığıyla anılır {cite:tabari-tarikh-abu-al-fadl j.2 s.234}. Bu yerde, saltanatının yaşı ve haberleri hakkında söylenenler anlatılır."
  id: "Seorang raja di antara raja-raja Persia Sasanian, yang disebut oleh al-Tabari dengan judul \"Penyebutan raja anak Khazad, mereka hilang\" {cite:tabari-tarikh-abu-al-fadl j.2 hlm.234}. Di tempat ini, apa yang dikatakan tentang usia dan berita pemerintahannya diceritakan."
