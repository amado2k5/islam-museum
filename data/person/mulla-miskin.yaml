summary:
  ar: "معين الدين الهروي، المعروف بمسكين ومنلا مسكين، فقيه حنفي. نقل ابن عابدين عن شرح الأشباه أن كتابه على الكنز من الكتب الغريبة لعدم الاطلاع على حال مؤلفه. من تصانيفه شرح «كنز الدقائق» للنسفي في فروع الفقه الحنفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
  en: "Mu'in al-Din al-Harawi, known as Miskin or Mulla Miskin, a Hanafi jurist. Ibn Abidin, quoting a commentary on al-Ashbah, calls his gloss on the Kanz strange because little is known of its author. His work includes a commentary on al-Nasafi's Kanz al-daqa'iq on Hanafi law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
  es: "Mu'in al-Din al-Harawi, conocido como Miskin o Mulla Miskin, un jurista hanafí. Ibn Abidin, citando un comentario sobre al-Ashbah, califica de extraña su glosa sobre el Kanz porque se sabe poco de su autor. Su trabajo incluye un comentario sobre Kanz al-daqa'iq de al-Nasafi sobre la ley Hanafi. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
  fr: "Mu'in al-Din al-Harawi, connu sous le nom de Miskin ou Mulla Miskin, un juriste Hanafi. Ibn Abidin, citant un commentaire sur al-Ashbah, qualifie sa glose sur le Kanz d'étrange car on sait peu de choses sur son auteur. Son travail comprend un commentaire sur le Kanz al-daqa'iq d'al-Nasafi sur la loi Hanafi. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
  ur: "معین الدین الحروی، جسے مسکین یا ملا مسکین کے نام سے جانا جاتا ہے، ایک حنفی فقیہ ہے۔ ابن عابدین، العشبہ کی ایک تفسیر کا حوالہ دیتے ہوئے، کنز پر اپنی چمک کو عجیب کہتے ہیں کیونکہ اس کے مصنف کے بارے میں بہت کم معلوم ہے۔ ان کے کام میں حنفی قانون پر النصفی کی کنز الدقائق کی تفسیر شامل ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1645}"
  tr: "Mu'in al-Din al-Harawi, Miskeen ve Manla Miskin olarak bilinen, bir Hanefi hukukçusuydu. İbn Abidin, Sharh al-Ashbah'dan alıntı yapmıştır: 'ala al-Kanz' adlı eser, yazarın durumu hakkında bilgi eksikliği nedeniyle nadir bir kitap olarak kabul edilir. Eserleri arasında, Hanefi fıkıh dallarında al-Nasafi tarafından yazılmış 'Kanz al-Daqa'iq' üzerine yapılan yorum da vardır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1645}"
  id: "Mu'in al-Din al-Harawi, yang dikenal sebagai Miskeen dan Manla Miskin, adalah seorang ahli hukum Hanafi. Ibn Abidin mengutip dari Sharh al-Ashbah bahwa bukunya 'ala al-Kanz dianggap sebagai buku langka karena kurangnya pengetahuan tentang kondisi penulisnya. Di antara karyanya terdapat komentar tentang 'Kanz al-Daqa'iq' oleh al-Nasafi dalam cabang-cabang yurisprudensi Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1645}"
