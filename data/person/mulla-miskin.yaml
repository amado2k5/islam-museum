summary:
  ar: "معين الدين الهروي، المعروف بمسكين ومنلا مسكين، فقيه حنفي. نقل ابن عابدين عن شرح الأشباه أن كتابه على الكنز من الكتب الغريبة لعدم الاطلاع على حال مؤلفه. من تصانيفه شرح «كنز الدقائق» للنسفي في فروع الفقه الحنفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
  en: "Mu'in al-Din al-Harawi, known as Miskin or Mulla Miskin, a Hanafi jurist. Ibn Abidin, quoting a commentary on al-Ashbah, calls his gloss on the Kanz strange because little is known of its author. His work includes a commentary on al-Nasafi's Kanz al-daqa'iq on Hanafi law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
