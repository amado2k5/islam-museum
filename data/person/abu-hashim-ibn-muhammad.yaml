label: { ar: "أبو هاشم عبد الله بن محمد بن الحنفية", en: "Abu Hashim Abd Allah ibn Muhammad ibn al-Hanafiyya" }
summary:
  ar: "ابن محمد بن الحنفية بن علي بن أبي طالب، خرج إلى الشام فلقي محمد بن علي بن عبد الله بن عباس فقال له يا ابن عم إن عندي علماً أريد أن أنبذه إليك فلا تطلعن عليه أحداً إن هذا الأمر الذي يرتجيه الناس فيكم قال قد علمته فلا يسمعنه منك أحد، وفي هذا الأثر أصل دعوى الوصية بالإمامة من آل علي إلى آل العباس {cite:tarikh-khulafa-minhaj-1434 p. 418}."
  en: "Son of Muhammad ibn al-Hanafiyya ibn Ali; on a journey to Syria he met Muhammad ibn Ali ibn Abdallah ibn Abbas and said, 'Cousin, I hold a knowledge I wish to cast to you — reveal it to no one: this affair the people hope for is among you.' 'I already know it,' he replied — 'let no one hear it from you.' This report is the root of the claimed bequest of the imamate from the Alids to the Abbasids {cite:tarikh-khulafa-minhaj-1434 p. 418}."
