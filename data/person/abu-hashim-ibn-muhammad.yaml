id: person/abu-hashim-ibn-muhammad
class: person
label: { ar: "أبو هاشم عبد الله بن محمد بن الحنفية", en: "Abu Hashim Abd Allah ibn Muhammad ibn al-Hanafiyya", fr: "Abu Hashim Abd Allah ibn Muhammad ibn al-Hanafiyya", es: "Abu Hashim Abd Allah ibn Muhammad ibn al-Hanafiyya" }
summary:
  ar: "ابن محمد بن الحنفية بن علي بن أبي طالب، خرج إلى الشام فلقي محمد بن علي بن عبد الله بن عباس فقال له يا ابن عم إن عندي علماً أريد أن أنبذه إليك فلا تطلعن عليه أحداً إن هذا الأمر الذي يرتجيه الناس فيكم قال قد علمته فلا يسمعنه منك أحد، وفي هذا الأثر أصل دعوى الوصية بالإمامة من آل علي إلى آل العباس {cite:tarikh-khulafa-minhaj-1434 p. 418}."
  en: "Son of Muhammad ibn al-Hanafiyya ibn Ali; on a journey to Syria he met Muhammad ibn Ali ibn Abdallah ibn Abbas and said, 'Cousin, I hold a knowledge I wish to cast to you — reveal it to no one: this affair the people hope for is among you.' 'I already know it,' he replied — 'let no one hear it from you.' This report is the root of the claimed bequest of the imamate from the Alids to the Abbasids {cite:tarikh-khulafa-minhaj-1434 p. 418}."
  fr: "Fils de Muhammad ibn al-Hanafiyya ibn Ali ; lors d'un voyage en Syrie, il rencontra Muhammad ibn Ali ibn Abdallah ibn Abbas et lui dit : « Cousin, je détiens un savoir que je veux te transmettre — ne le révèle à personne : cette affaire que les gens espèrent est parmi vous. » « Je le sais déjà, répondit-il — que personne ne l'entende de toi. » Ce récit est la racine du prétendu legs de l'imamat des Alides aux Abbassides {cite:tarikh-khulafa-minhaj-1434 p. 418}."
  es: "Hijo de Muhammad ibn al-Hanafiyya ibn Ali; en un viaje a Siria se encontró con Muhammad ibn Ali ibn Abdallah ibn Abbas y le dijo: «Primo, tengo un conocimiento que deseo compartir contigo; no se lo reveles a nadie: este asunto que el pueblo espera está entre vosotros». «Ya lo sé», respondió él; «que nadie lo oiga de ti». Este relato es la raíz de la supuesta transmisión del imamato de los Alíes a los Abasíes {cite:tarikh-khulafa-minhaj-1434 p. 418}."
