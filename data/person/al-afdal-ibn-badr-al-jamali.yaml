summary:
  ar: "وزير فاطمي ولد نحو 458 للهجرة، واشتهر بلقب الأفضل، تولى الوزارة بعد أبيه بدر الجمالي، وحكم نحو سبع وعشرين سنة، واغتاله الحشاشون سنة 515 للهجرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 236}."
  en: "Fatimid vizier, born about 458/1066, known as al-Afdal. He succeeded his father Badr al-Jamali as vizier and held office for twenty-seven years, until he was killed by assassins in 515/1121. His dictatorial rule saw the Crusader conquest of Palestine {cite:encyclopaedia-of-islam-2 vol. 1 p. 236}."
  fr: "Vizir fatimide né vers 458 H/1066, connu comme al-Afdal. Il succéda à son père Badr al-Jamali comme vizir et exerça cette fonction pendant vingt-sept ans, jusqu’à son assassinat en 515 H/1121. La conquête de la Palestine par les croisés eut lieu sous son pouvoir dictatorial {cite:encyclopaedia-of-islam-2 vol. 1 p. 236}."
  es: "Visir fatimí, nacido alrededor del año 458/1066, conocido como al-Afdal. Sucedió a su padre Badr al-Jamali como visir y ocupó el cargo durante veintisiete años, hasta que fue asesinado por sicarios en el año 515/1121. Durante su gobierno dictatorial se produjo la conquista de Palestina por los cruzados {cite:encyclopaedia-of-islam-2 vol. 1 p. 236}."
  ur: "فاطمی وزیر، تقریباً 458/1066 میں پیدا ہوا، جسے الفضل کہا جاتا ہے۔ وہ اپنے والد بدر الجمالی کے بعد وزیر بنا اور ستائیس سال تک اس عہدے پر فائز رہے، یہاں تک کہ وہ 515/1121 میں قاتلوں کے ہاتھوں مارے گئے۔ اس کی آمرانہ حکومت نے فلسطین پر صلیبی فتح کو دیکھا۔ 1 ص۔ 236}۔"
  tr: "Hicri 458 civarında doğan Fatımi veziri, El-Afdal unvanıyla tanınıyordu. Babası Bedir el-Cemali'den sonra vezirlik görevini devraldı ve yaklaşık yirmi yedi yıl hüküm sürdü. Hicri 515 yılında Haşhaşiler tarafından suikaste uğradı. {cite:encyclopaedia-of-islam-2 vol. 1 p. 236}"
  id: "Menteri Fatimiyah, lahir sekitar tahun 458 H, dikenal dengan gelar Al-Afdal. Ia mengambil alih kementerian setelah ayahnya, Badr Al-Jamali, dan memerintah selama sekitar dua puluh tujuh tahun. Ia dibunuh oleh kelompok Assassin pada tahun 515 H. {cite:encyclopaedia-of-islam-2 vol. 1 p. 236}."
