summary:
  ar: "قيس سعيد (وُلد سنة 1958)، فقيه دستوري وسياسي تونسي درّس القانون الدستوري في جامعة تونس وترأس الجمعية التونسية للقانون الدستوري، وفاز بانتخابات 2019 الرئاسية مستقلا فصار رئيسا لتونس في 23 أكتوبر 2019، ثم علّق عمل البرلمان في يوليو 2021 وحكم بالمراسيم، وأقرّ دستور 2022، وأعيد انتخابه سنة 2024."
  en: "Kais Saied (born 1958) is a Tunisian constitutional jurist and politician who taught constitutional law at the University of Tunis and headed the Tunisian Association of Constitutional Law. Running as an independent, he won the 2019 presidential election and became president of Tunisia on 23 October 2019; in July 2021 he suspended parliament and ruled by decree, carried the 2022 constitution, and was re-elected in 2024."
  ur: "قیس سعید (پیدائش 1958ء) تیونس کے آئینی فقیہ اور سیاست دان ہیں جنہوں نے جامعہ تیونس میں آئینی قانون پڑھایا اور تیونسی ایسوسی ایشن برائے آئینی قانون کی صدارت کی۔ انہوں نے آزاد امیدوار کے طور پر 2019ء کا صدارتی انتخاب جیتا اور 23 اکتوبر 2019ء کو تیونس کے صدر بنے؛ جولائی 2021ء میں انہوں نے پارلیمنٹ معطل کر دی اور فرمانوں کے ذریعے حکومت کی، 2022ء کا آئین منظور کرایا اور 2024ء میں دوبارہ منتخب ہوئے۔"
