summary:
  ar: "سياسي ألباني عثماني (1839-1892) وأكبر الإخوة فراشري الثلاثة، وأبرز قادة عصبة بريزرن المؤسِّسة للحركة الوطنية الألبانية. مثّل يانينا في أول برلمان عثماني، وأسس اللجنة المركزية للدفاع عن الحقوق الألبانية في إسطنبول، وقاد وفود العصبة إلى عواصم أوروبا، فحُكم عليه بالإعدام بعد قمع العصبة ثم خُفّف الحكم إلى السجن مع الأشغال الشاقة، وأُفرج عنه سنة 1886."
  en: "Albanian-Ottoman politician (1839–1892), the eldest of the three Frashëri brothers and the leading political organiser of the League of Prizren, the founding movement of Albanian nationalism. He sat for Yanina in the first Ottoman parliament, founded the Central Committee for Defending Albanian Rights in Istanbul, led the League's delegations to the European capitals, and after the League's suppression was sentenced to death, the sentence commuted to prison with hard labour, until his release in 1886."
  ur: "البانوی عثمانی سیاست دان (1839ء–1892ء)، تینوں فراشری بھائیوں میں سب سے بڑے، اور لیگ آف پریزرین کے نمایاں سیاسی قائد، جو البانوی قوم پرستی کی بانی تحریک تھی۔ وہ پہلی عثمانی پارلیمنٹ میں یانینا کے نمائندے رہے، استنبول میں البانوی حقوق کے دفاع کی مرکزی کمیٹی قائم کی، لیگ کے وفود کی یورپی دارالحکومتوں میں قیادت کی، اور لیگ کی سرکوبی کے بعد انھیں سزائے موت سنائی گئی جو بعد میں مشقت کے ساتھ قید میں بدل دی گئی؛ وہ 1886ء میں رہا ہوئے۔"

