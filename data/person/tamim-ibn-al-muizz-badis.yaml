id: person/tamim-ibn-al-muizz-badis
class: person
label: { ar: "تميم بن المعز بن باديس" }
names:
  - { value: "أبو يحيى تميم بن المعز بن باديس الصنهاجي", kind: full }
summary:
  ar: "سلطان إفريقية الزيري، ملك بعد أبيه المعز بن باديس وكانت دولته ستة وخمسين عاماً؛ كان حسن السيرة محباً للعلماء مقصداً للشعراء كامل الشجاعة وافر الهيبة، وخلف أكثر من مائة ولد وتملك بعده ابنه يحيى؛ ولد بالمنصورية سنة اثنتين وعشرين وأربعمائة وتوفي ليلة السبت متع رجب سنة إحدى وخمسمائة عن تسع وسبعين سنة {cite:shadharat-dhahab p. 482-483}."
  en: "The Zirid sultan of Ifriqiya — fifty-six years on the throne after his father al-Mu'izz b. Badis; a patron of scholars and poets, famed for courage and majesty, who left over a hundred sons; d. Rajab 501 at seventy-nine {cite:shadharat-dhahab p. 482-483}."
  es: "El sultán Zirid de Ifriqiya — cincuenta y seis años en el trono después de su padre al-Mu'izz b. Badis; un mecenas de eruditos y poetas, famoso por su valentía y majestad, que dejó más de cien hijos; murió en Rajab 501 a los setenta y nueve años {cite:shadharat-dhahab p. 482-483}."
  fr: "Le sultan ziride d'Ifriqiya — cinquante-six ans sur le trône après son père al-Mu'izz b. Badis; un mécène des érudits et des poètes, célèbre pour son courage et sa majesté, qui laissa plus d'une centaine de fils; mort en Rajab 501 à soixante-dix-neuf ans {cite: shadharat-dhahab p. 482-483}."
  ur: "افریقیہ کا زرد سلطان - اپنے والد المعز بن کے بعد تخت پر چھپن سال۔ بادیس; اہل علم اور شاعروں کا سرپرست، جرأت اور عظمت کے لیے مشہور، جس نے سو سے زائد بیٹے چھوڑے؛ d رجب 501 اناسی میں 482-483}۔"
  tr: "İfrikiye el-Ziri Sultanı, babası el-Muizz bin Badis'ten sonra hüküm süren ve elli altı yıl süren Efriqiye el-Ziri Sultanı; iyi huylu olan, alimleri seven ve büyük cesaret ile prestije sahip şairlerin uğradığı bir yerdi. Yüzün üzerinde oğlu bıraktı ve ondan sonra oğlu Yahya krallığı yönetti; dört yüz yirmi iki yılında Mansuriya'da doğdu ve 501 Hicri yılının Cumartesi gecesi, yetmiş dokuz yaşında vefat etti {atıf:shadharat-dhahab, s. 482-483}."
  id: "Sultan Ifriqiya al-Ziri, yang memerintah setelah ayahnya al-Mu'izz ibn Badis, yang pemerintahannya berlangsung lima puluh enam tahun; ia berperilaku baik, menyukai para cendekiawan, dan menjadi tujuan bagi penyair yang sangat berani dan bergengsi. Ia meninggalkan lebih dari seratus putra, dan setelah itu putranya Yahya memerintah kerajaan; ia lahir di Mansuriya pada tahun empat ratus dua puluh dua dan meninggal pada malam Sabtu, tahun 501 H, pada usia tujuh puluh sembilan {cite:shadharat-dhahab, hlm. 482-483}."
