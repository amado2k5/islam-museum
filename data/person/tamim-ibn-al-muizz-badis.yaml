summary:
  ar: "سلطان إفريقية الزيري، ملك بعد أبيه المعز بن باديس وكانت دولته ستة وخمسين عاماً؛ كان حسن السيرة محباً للعلماء مقصداً للشعراء كامل الشجاعة وافر الهيبة، وخلف أكثر من مائة ولد وتملك بعده ابنه يحيى؛ ولد بالمنصورية سنة اثنتين وعشرين وأربعمائة وتوفي ليلة السبت متع رجب سنة إحدى وخمسمائة عن تسع وسبعين سنة {cite:shadharat-dhahab p. 482-483}."
  en: "The Zirid sultan of Ifriqiya — fifty-six years on the throne after his father al-Mu'izz b. Badis; a patron of scholars and poets, famed for courage and majesty, who left over a hundred sons; d. Rajab 501 at seventy-nine {cite:shadharat-dhahab p. 482-483}."
