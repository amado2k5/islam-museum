summary:
  ar: "براهماغوبتا فلكي ورياضي هندي من بهيلاملا قرب ملتان، وُلد سنة 598م بحسب دائرة المعارف الإسلامية، وكتب البراهماسفوتاسيدهانتا سنة 628م والخندكهاديكا سنة 665م. وتذكر المقالات أن كتبه كانت أساساً للتراث الهندي الذي نُقل إلى العربية، وأن قيم الحركة في جداول الخوارزمي الفلكية مأخوذة عنه {cite:encyclopaedia-of-islam-2 vol. 2 p. 603} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1169} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  en: "Brahmagupta was an Indian astronomer and mathematician of Bhillamala, near Multan, born in 598 according to the Encyclopaedia of Islam, who wrote the Brahmasphutasiddhanta in 628 and the Khandakhadyaka in 665. The articles say his books underlay the Indian tradition translated into Arabic and that the motion values in al-Khwarizmi's astronomical tables come from him {cite:encyclopaedia-of-islam-2 vol. 2 p. 603} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1169} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
  ur: "برہم گپت ملتان کے قریب بھلّمال کے ہندی ماہرِ فلکیات اور ریاضی دان تھے، جو دائرۃ المعارف الاسلامیہ کے مطابق 598ء میں پیدا ہوئے، اور جنہوں نے 628ء میں برہمسپھٹسِدھانت اور 665ء میں کھنڈکھادیک لکھی۔ مضامین کے مطابق ان کی کتابیں اس ہندی روایت کی بنیاد تھیں جو عربی میں منتقل ہوئی، اور خوارزمی کے فلکیاتی جدولوں میں حرکت کی قدریں انہی سے لی گئی ہیں {cite:encyclopaedia-of-islam-2 vol. 2 p. 603} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1169} {cite:encyclopaedia-of-islam-2 vol. 4 p. 1112}."
