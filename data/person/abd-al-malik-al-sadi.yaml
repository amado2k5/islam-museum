summary:
  ar: "السلطان السعدي الهارب إلى الباب العالي؛ أمدّه العثمانيون بخمسة آلاف مقاتل بأحسن الأسلحة فدخل فاس منتصراً على ابن أخيه المتوكل، ثم أمدّوه بالمدربين والأسلحة وفيلق عسكري لصد الغزو البرتغالي. أقام إصلاحاته: تجديد السفن وصنع المراكب، وإنعاش التجارة البحرية، وبناء جيش نظامي على القدوة العثمانية في التسليح والرتب، وتقوية الدواوين وتشكيل جهاز شوري عالم بأمور الدولة وسياستها الدولية، وكان أخوه أحمد المنصور ساعده الأيمن. واستحق إجلال عصره حتى من الأوروبيين — وصفه الشاعر الفرنسي المعاصر أغريبا دوبيني بأنه أجمل قومه نير الفكر يحسن الأسبانية والإيطالية والأرمنية والروسية وشاعر مجيد بالعربية. وفي وادي المخازن عزل عدوه عن أسطوله ونسف القنطرة ورد الهجوم الأول شاهراً سيفه وهو مريض قائلاً «ومتى كان المرض يثني المسلمين عن الجهاد»، ثم فاضت روحه في خيمته وسبابته على فمه إشارة لكتمان الأمر حتى يتم النصر {cite:dawlat-uthmaniyya-salabi p. 258-265}."
  en: "The Sa'di sultan who had fled to the Porte; the Ottomans armed him with five thousand well-equipped fighters to take Fez from his nephew al-Mutawakkil, then sent trainers, weapons and a corps against the Portuguese invasion. His reforms: renewed shipbuilding, maritime trade, a modern army on the Ottoman model of arms and ranks, strengthened diwans and a consultative body versed in home and foreign affairs — his brother Ahmad al-Mansur his right hand. He won the awe of his age even among Europeans; the contemporary French poet Agrippa d'Aubigné called him his people's fairest, sharp of mind, versed in Spanish, Italian, Armenian and Russian, an excellent Arabic poet. At Wadi al-Makhazin he cut the enemy from his fleet, blew the bridge, and repelled the first charge sword drawn though ill — 'since when does sickness bar Muslims from jihad?' — then died in his tent, finger to his lips: conceal it until victory {cite:dawlat-uthmaniyya-salabi p. 258-265}."
  fr: "Le sultan saadien qui s'était réfugié auprès de la Porte ; les Ottomans l'armèrent de cinq mille combattants bien équipés pour prendre Fès à son neveu al-Mutawakkil, puis envoyèrent instructeurs, armes et un corps contre l'invasion portugaise. Ses réformes : renouveau de la construction navale, commerce maritime, armée moderne sur le modèle ottoman des armes et des grades, diwans renforcés et un corps consultatif versé dans les affaires intérieures et extérieures — son frère Ahmad al-Mansur était son bras droit. Il inspira le respect de son temps jusque chez les Européens ; le poète français contemporain Agrippa d'Aubigné le dit le plus beau de son peuple, d'esprit vif, versé en espagnol, en italien, en arménien et en russe, excellent poète arabe. À l'oued al-Makhazin, il coupa l'ennemi de sa flotte, fit sauter le pont et repoussa la première charge sabre au clair malgré la maladie — « depuis quand la maladie empêche-t-elle les musulmans du jihad ? » —, puis mourut sous sa tente, le doigt sur les lèvres : le cacher jusqu'à la victoire {cite:dawlat-uthmaniyya-salabi p. 258-265}."
  es: "El sultán Sa'di, que había huido a la Sublime Puerta, fue armado por los otomanos con cinco mil combatientes bien equipados para tomar Fez de manos de su sobrino al-Mutawakkil. Posteriormente, enviaron instructores, armas y un cuerpo de ejército contra la invasión portuguesa. Sus reformas incluyeron la renovación de la construcción naval, el comercio marítimo, un ejército moderno según el modelo otomano de armamento y rangos, el fortalecimiento de los diwanes y un órgano consultivo experto en asuntos internos y externos; su hermano Ahmad al-Mansur era su mano derecha. Se ganó el respeto de su época incluso entre los europeos; el poeta francés contemporáneo Agrippa d'Aubigné lo describió como el más noble de su pueblo, de mente aguda, versado en español, italiano, armenio y ruso, y un excelente poeta árabe. En Wadi al-Makhazin, separó al enemigo de su flota, voló el puente y repelió la primera carga con la espada desenvainada a pesar de estar enfermo: \"¿Desde cuándo la enfermedad impide a los musulmanes participar en la yihad?\". — luego murió en su tienda, con el dedo en los labios: ocultándolo hasta la victoria {cite:dawlat-uthmaniyya-salabi p. 258-265}."
