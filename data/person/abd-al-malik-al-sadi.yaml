summary:
  ar: "السلطان السعدي الهارب إلى الباب العالي؛ أمدّه العثمانيون بخمسة آلاف مقاتل بأحسن الأسلحة فدخل فاس منتصراً على ابن أخيه المتوكل، ثم أمدّوه بالمدربين والأسلحة وفيلق عسكري لصد الغزو البرتغالي. أقام إصلاحاته: تجديد السفن وصنع المراكب، وإنعاش التجارة البحرية، وبناء جيش نظامي على القدوة العثمانية في التسليح والرتب، وتقوية الدواوين وتشكيل جهاز شوري عالم بأمور الدولة وسياستها الدولية، وكان أخوه أحمد المنصور ساعده الأيمن. واستحق إجلال عصره حتى من الأوروبيين — وصفه الشاعر الفرنسي المعاصر أغريبا دوبيني بأنه أجمل قومه نير الفكر يحسن الأسبانية والإيطالية والأرمنية والروسية وشاعر مجيد بالعربية. وفي وادي المخازن عزل عدوه عن أسطوله ونسف القنطرة ورد الهجوم الأول شاهراً سيفه وهو مريض قائلاً «ومتى كان المرض يثني المسلمين عن الجهاد»، ثم فاضت روحه في خيمته وسبابته على فمه إشارة لكتمان الأمر حتى يتم النصر {cite:dawlat-uthmaniyya-salabi p. 258-265}."
  en: "The Sa'di sultan who had fled to the Porte; the Ottomans armed him with five thousand well-equipped fighters to take Fez from his nephew al-Mutawakkil, then sent trainers, weapons and a corps against the Portuguese invasion. His reforms: renewed shipbuilding, maritime trade, a modern army on the Ottoman model of arms and ranks, strengthened diwans and a consultative body versed in home and foreign affairs — his brother Ahmad al-Mansur his right hand. He won the awe of his age even among Europeans; the contemporary French poet Agrippa d'Aubigné called him his people's fairest, sharp of mind, versed in Spanish, Italian, Armenian and Russian, an excellent Arabic poet. At Wadi al-Makhazin he cut the enemy from his fleet, blew the bridge, and repelled the first charge sword drawn though ill — 'since when does sickness bar Muslims from jihad?' — then died in his tent, finger to his lips: conceal it until victory {cite:dawlat-uthmaniyya-salabi p. 258-265}."
