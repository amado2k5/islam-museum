summary:
  ar: "داعية ومقدم برامج ومنتج مصري، وُلد سنة 1978، درس الاقتصاد في الجامعة الأمريكية بالقاهرة ثم الماجستير في كامبريدج. قدّم برامج بالإنجليزية ثم «الطريق الصح» بالعربية سنة 2007، وأسس معهدًا يحمل الاسم نفسه، وأنتج فيلم «اشتباك»، وصنّفته ذي إيكونومست سنة 2011 ضمن أكثر مقدمي التراث الإسلامي تأثيرًا."
  en: "Egyptian preacher, television presenter and producer, born in 1978; he studied economics at the American University in Cairo, then an MPhil at Cambridge. After English-language shows he launched the Arabic series Al-Tareeq al-Sahh in 2007, founded an institute of the same name, and produced the film Clash; The Economist named him in 2011 among the most influential presenters of the Islamic tradition."
  ur: "مصری مبلغ، ٹیلی ویژن میزبان اور پروڈیوسر، 1978 میں پیدا ہوئے؛ امریکن یونیورسٹی قاہرہ سے معاشیات اور پھر کیمبرج سے ایم فل کیا۔ انگریزی پروگراموں کے بعد 2007 میں عربی سیریز «الطريق الصح» شروع کی، اسی نام کا ادارہ قائم کیا اور فلم «اشتباک» بنائی؛ دی اکانومسٹ نے 2011 میں انہیں اسلامی روایت کے مؤثر ترین پیش کرنے والوں میں شمار کیا۔"
  es: "Predicador, presentador y productor de televisión egipcio, nacido en 1978. Estudió economía en la Universidad Americana de El Cairo y posteriormente obtuvo un máster en Filosofía en Cambridge. Tras programas en inglés, lanzó la serie árabe Al-Tareeq al-Sahh en 2007, fundó un instituto con el mismo nombre y produjo la película Clash. En 2011, The Economist lo incluyó entre los presentadores más influyentes de la tradición islámica."
  fr: "Prédicateur, présentateur de télévision et producteur égyptien, né en 1978, il a étudié l'économie à l'Université américaine du Caire, puis obtenu un master de recherche à Cambridge. Après des émissions en anglais, il a lancé la série arabe Al-Tareeq al-Sahh en 2007, fondé un institut du même nom et produit le film Clash. En 2011, The Economist l'a classé parmi les présentateurs les plus influents de la tradition islamique."
