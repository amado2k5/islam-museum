id: person/urwa-ibn-al-zubayr
class: person
label: { ar: "عروة بن الزبير", en: "Urwa ibn al-Zubayr" }
summary:
  ar: "عروة بن الزبير بن العوام، ابن الزبير وأسماء بنت أبي بكر، محدّث جليل وأحد الفقهاء السبعة في المدينة، وتعدّه دائرة المعارف الإسلامية مؤسس الدراسة التاريخية في الإسلام. ولد في المدينة على الأرجح سنة 23هـ وتوفي فيها على الأرجح سنة 93 أو 94هـ، وانحاز إلى أخيه عبد الله بن الزبير في خلافته المنافسة. وتنسب إليه روايات في السيرة والمغازي والفقه، يرجع ثلثاها إلى عائشة. وعن الواقدي عن عبد الحميد بن جعفر عن أبيه أنه قال إنه أقام بمصر سبع سنين، وهو خبر تعدّه المقالة موضع شك كبير."
  en: "Urwa ibn al-Zubayr ibn al-Awwam, son of al-Zubayr and Asma bint Abi Bakr, was an eminent traditionist and one of the Seven Jurists of Medina, called by the Encyclopaedia of Islam the founder of historical study in Islam. Born in Medina very probably in 23 AH and dying there probably in 93 or 94 AH, he sided with his brother Abd Allah ibn al-Zubayr in the rival caliphate. Traditions on the Sira, the Maghazi and law are attributed to him, two thirds of them through Aisha. A report through al-Waqidi has him saying he lived seven years in Egypt, which the article thinks highly doubtful."
  ur: "عروہ بن زبیر بن عوام، زبیر اور اسماء بنت ابی بکر کے بیٹے، ایک ممتاز محدث اور مدینہ کے سات فقہاء میں سے ایک تھے، جنہیں انسائیکلوپیڈیا آف اسلام اسلام میں تاریخی مطالعے کا بانی کہتا ہے۔ وہ غالباً 23ھ میں مدینہ میں پیدا ہوئے اور غالباً 93 یا 94ھ میں وہیں وفات پائی، اور مخالف خلافت میں اپنے بھائی عبداللہ بن زبیر کا ساتھ دیا۔ سیرت، مغازی اور فقہ کی روایات ان سے منسوب ہیں، جن کی دو تہائی عائشہ کے واسطے سے ہیں۔ واقدی کے واسطے سے ایک روایت میں وہ مصر میں سات سال رہنے کا ذکر کرتے ہیں، جسے مضمون بہت مشکوک سمجھتا ہے۔"
