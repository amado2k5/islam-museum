label: { ar: "عروة بن الزبير", en: "Urwa ibn al-Zubayr" }
summary:
  ar: "عروة بن الزبير بن العوّام؛ عن الواقدي عن عبد الحميد بن جعفر عن أبيه قال سمعت عروة يقول: أقمت بمصر سبع سنين وتزوّجت بها فرأيت أهلها مجاهيد قد حُمل عليهم فوق طاقتهم وإنما فتحها عمرو بصلح وعهد وشيء مفروض عليهم. ويذكر الكتاب أن قطعت رجله من نصف الساق في سفره إلى الوليد بعد أن ظهرت به قرحة، وأن ابنه محمداً قتلته الدواب في ذلك السفر، وأنه توفي سنة 93هـ. {cite:salabi-umayyad-state-2020 p.135-136}"
  en: "Urwa ibn al-Zubayr ibn al-Awwam; al-Waqidi reports through Abd al-Hamid ibn Ja'far from his father: I heard Urwa say 'I dwelt seven years in Egypt and married there, and found its people fighters bearing more than their strength — for Amr conquered it only by treaty, covenant and a levy fixed upon them'."
