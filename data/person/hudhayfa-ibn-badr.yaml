id: person/hudhayfa-ibn-badr
class: person
label: { ar: "حذيفة بن بدر الفزاري" }
summary:
  ar: "سيد بني فزارة من غطفان؛ قتلته بنو عبس بن بغيض يوم الهباءة حين كانوا وبنو ذبيان حلفاء وكانت بنو عبس قتلته ودست لسانه في استه، فكان قتله من سبب حرب داحس والغبراء {cite:ansab-al-ashraf p. 15-16}."
  en: "Hudhayfa ibn Badr al-Fazari, chief of Fazara; Banu Abs killed him on the day of al-Haba'a — they set his tongue in his behind — the spark that lit the forty-year war of Dahis and Ghabra' {cite:ansab-al-ashraf p. 15-16}."
  es: "Hudhayfa ibn Badr al-Fazari, jefe de Fazara; Banu Abs lo mató el día de al-Haba'a —le metieron la lengua en el trasero— la chispa que encendió la guerra de cuarenta años de Dahis y Ghabra' {cite:ansab-al-ashraf p. 15-16}."
  fr: "Hudhayfa ibn Badr al-Fazari, chef de Fazara; Banu Abs le tua le jour d'al-Haba'a — ils lui mirent la langue dans le derrière — l'étincelle qui alluma la guerre de quarante ans des Dahis et Ghabra' {cite:ansab-al-ashraf p. 15-16}."
  ur: "حذیفہ بن بدر الفزاری، فزارہ کے سربراہ؛ بنو عباس نے اسے ہبہ کے دن قتل کر دیا - انہوں نے اس کی زبان اس کے پیچھے رکھ دی - وہ چنگاری جس نے دحیس اور غبرہ کی چالیس سالہ جنگ کو روشن کیا تھا۔ 15-16}۔"
  tr: "Ghatafan'dan Seyyid Banu Fazara; El-Haba'ah günü, Banu Dhubyan ile müttefikken Banu Abs ibn Baghaidh tarafından öldürüldü ve Banu Abs onu öldürüp dilini boğazına soktu. Onun öldürülmesi, Dahiler ile Al-Ghabra arasındaki savaşın nedenlerinden biriydi {atıf:ansab-al-ashraf s. 15-16}."
  id: "Sayyid Banu Fazara dari Ghatafan; ia dibunuh oleh Banu Abs ibn Baghaidh pada hari Al-Haba'ah ketika mereka dan Banu Dhubyan menjadi sekutu, dan Banu Abs membunuhnya dan mencampurkan lidahnya ke tenggorokannya. Pembunuhannya adalah salah satu alasan perang antara Dahis dan Al-Ghabra {cite:ansab-al-ashraf hlm. 15-16}."
