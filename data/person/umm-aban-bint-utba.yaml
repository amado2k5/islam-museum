summary:
  en: "A Qurashi noblewoman, daughter of Utba ibn Rabi'a, who came to Syria and witnessed the conquest, was widowed when her husband Aban ibn Sa'id fell at Ajnadayn, and is remembered for refusing the proposals of Umar, al-Zubayr and Ali each on her own sharp grounds, and for her verses mourning her sons Mus'ab and Janah."
  ar: "سيدة قرشية ابنة عتبة بن ربيعة بن عبد شمس؛ قدمت الشام وشهدت الفتح، وتأيمت على زوجها أبان بن سعيد بن العاص حين قُتل يوم أجنادين، وخُطبت من عمر بن الخطاب ثم الزيبر بن العوام ثم علي فردّت كل واحد بحجة، وتُروى لها أبيات ترثي ابنها مصعباً وجناحاً قتلهما بنو تيم."
  es: "Una noble de la tribu Qurashi, hija de Utba ibn Rabi'a, que llegó a Siria y presenció la conquista, enviudó cuando su esposo Aban ibn Sa'id cayó en Ajnadayn, y es recordada por rechazar las propuestas de Umar, al-Zubayr y Ali, cada uno por sus propios y firmes razones, y por sus versos en los que lamentaba la muerte de sus hijos Mus'ab y Janah."
  fr: "Une noble qurashi, fille d'Utba ibn Rabi'a, venue en Syrie et témoin de la conquête, devint veuve lorsque son mari Aban ibn Sa'id tomba à Ajnadayn. On se souvient d'elle pour avoir refusé les propositions d'Umar, d'al-Zubayr et d'Ali, chacun pour des raisons bien précises, et pour ses vers pleurant ses fils Mus'ab et Janah."
  ur: "عتبہ بن ربیعہ کی بیٹی، ایک قریشی رئیس، جو شام آئی اور فتح کی گواہی دی، بیوہ ہو گئی تھی جب اس کے شوہر ابان بن سعید اجنادین میں گرے تھے، اور انہیں عمر، الزبیر اور علی کی تجویز کو اپنی اپنی تیز بنیادوں پر انکار کرنے، اور اس کے بیٹے مُعَنَّا وَعَلَیْہِ الصَّلٰوۃُ وَالسَّلَام کی بیوہ کی وجہ سے یاد کیا جاتا ہے۔"
