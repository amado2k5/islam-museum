summary:
  en: "A Qurashi noblewoman, daughter of Utba ibn Rabi'a, who came to Syria and witnessed the conquest, was widowed when her husband Aban ibn Sa'id fell at Ajnadayn, and is remembered for refusing the proposals of Umar, al-Zubayr and Ali each on her own sharp grounds, and for her verses mourning her sons Mus'ab and Janah."
  ar: "سيدة قرشية ابنة عتبة بن ربيعة بن عبد شمس؛ قدمت الشام وشهدت الفتح، وتأيمت على زوجها أبان بن سعيد بن العاص حين قُتل يوم أجنادين، وخُطبت من عمر بن الخطاب ثم الزيبر بن العوام ثم علي فردّت كل واحد بحجة، وتُروى لها أبيات ترثي ابنها مصعباً وجناحاً قتلهما بنو تيم."
