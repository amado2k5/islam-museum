summary:
  ar: "من فقهاء الكوفة، الحارث الأعور؛ قال أبو إسحاق إنه لم يكن بالكوفة أحد أعلم بالفريضة من عبيدة والحارث الأعور، وذكر ابن سيرين أربعة من فقهاء الكوفة في زمانه هم الحارث وعبيدة وعلقمة وشريح، واختلف ترتيب الحارث وعبيدة في روايته {cite:tabaqat-fuqaha-abbas-1981 p. 43}."
  en: "A jurist of Kufa. Abu Ishaq said that no one in Kufa knew the law of inheritance (al-fara'id) better than Ubayda and al-Harith al-A'war; Ibn Sirin named four Kufan jurists of his time, al-Harith, Ubayda, Alqama and Shurayh, and the order of al-Harith and Ubayda differs in the narration {cite:tabaqat-fuqaha-abbas-1981 p. 43}."
