summary:
  ar: "من فقهاء الكوفة، الحارث الأعور؛ قال أبو إسحاق إنه لم يكن بالكوفة أحد أعلم بالفريضة من عبيدة والحارث الأعور، وذكر ابن سيرين أربعة من فقهاء الكوفة في زمانه هم الحارث وعبيدة وعلقمة وشريح، واختلف ترتيب الحارث وعبيدة في روايته {cite:tabaqat-fuqaha-abbas-1981 p. 43}."
  en: "A jurist of Kufa. Abu Ishaq said that no one in Kufa knew the law of inheritance (al-fara'id) better than Ubayda and al-Harith al-A'war; Ibn Sirin named four Kufan jurists of his time, al-Harith, Ubayda, Alqama and Shurayh, and the order of al-Harith and Ubayda differs in the narration {cite:tabaqat-fuqaha-abbas-1981 p. 43}."
  fr: "Juriste de Koufa. Abu Ishaq dit que personne à Koufa ne connaissait mieux le droit successoral (al-fara’id) qu’Ubayda et al-Harith al-A’war ; Ibn Sirin nomma quatre juristes de Koufa de son époque, al-Harith, Ubayda, Alqama et Shurayh, l’ordre d’al-Harith et d’Ubayda variant selon la transmission {cite:tabaqat-fuqaha-abbas-1981 p. 43}."
  es: "Un jurista de la muerte. Abu Ishaq dijo que nadie en Kufa conocía la ley de herencia (al-fara'id) mejor que 'Ubayda y al-Harith al-A'war; Ibn Sirin nombró a cuatro juristas de Kufa de su tiempo, al-Harith, Ubayda, Alqama y Shurayh, y el orden de al-Harith y Ubayda difiere en la narración {cite:tabaqat-fuqaha-abbas-1981 p. 43}."
  ur: "موت کا ایک فقیہ۔ ابو اسحاق نے کہا کہ کوفہ میں وراثت کے قانون کو عبیدہ اور حارث الاوار سے بہتر کوئی نہیں جانتا تھا۔ ابن سیرین نے اپنے زمانے کے کوفان کے چار فقہا کے نام حارث، عبیدہ، علقمہ اور شوریٰ رکھے ہیں اور حارث اور عبیدہ کی ترتیب روایت میں مختلف ہے۔ 43}۔"
  tr: "Kufe'nin hukukçuları arasında Al-Haris Al-A'war vardı; Ebu İshaq, Kufa'da dini görevler hakkında Ubeyde ve Tek Gözlü El-Haris'ten daha bilgili kimse olmadığını söyledi. İbn Sirin, kendi döneminde Kufe'nin dört hukukçusundan bahsetti: El-Haris, Ubeyde, Alkame ve Şurayh. El-Haris ve Ubeyde tarikatı onun rivayetinde farklılık gösterdi {atıf:tabaqat-fuqaha-abbas-1981, s. 43}."
  id: "Di antara para ahli hukum Kufa adalah Al-Harith Al-A'war; Abu Ishaq mengatakan bahwa tidak ada seorang pun di Kufa yang lebih memahami kewajiban keagamaan daripada Ubaidah dan Al-Harith si Bermata Satu. Ibn Sirin menyebutkan empat ahli hukum Kufa pada masanya: Al-Harith, Ubaidah, Alqamah, dan Shurayh. Urutan Al-Harith dan Ubaidah berbeda dalam riwayatnya {cite:tabaqat-fuqaha-abbas-1981, hlm. 43}."
