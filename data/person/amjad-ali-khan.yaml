summary:
  ar: "عازف سرود هندي (وُلد سنة 1945) في غواليور، ابن عازف السرود حافظ علي خان وتلميذه، من سلالة بانغاش الموسيقية المنحدرة من بلاط أكبر؛ قدّم أول حفل منفرد في السادسة، وانتقل مع أسرته إلى دلهي (1957)، ونال بادما شري (1975) وبادما بوشان (1991) وبادما فيبوشان (2001)."
  en: "Indian sarod maestro (born 1945) at Gwalior, son and pupil of the sarod player Hafiz Ali Khan and heir to the Bangash line of sarod players descending from Akbar's court; he gave his first solo concert at six, moved with his family to Delhi in 1957, and received the Padma Shri (1975), Padma Bhushan (1991) and Padma Vibhushan (2001)."
  ur: "بھارتی سرود نواز (پیدائش 1945) جو گوالیار میں پیدا ہوئے، سرود نواز حافظ علی خان کے بیٹے اور شاگرد اور اکبر کے دربار سے چلی آنے والی بنگش موسیقار نسل کے وارث ہیں؛ چھ برس کی عمر میں پہلا انفرادی کنسرٹ دیا، 1957 میں خاندان کے ساتھ دہلی آ گئے اور پدم شری (1975)، پدم بھوشن (1991) اور پدم وبھوشن (2001) سے نوازے گئے۔"
