id: person/harith-ibn-masud-al-qarmati
class: person
label: { ar: "حريث بن مسعود القرمطي" }
summary:
  ar: "من ظهر بسواد العراق من القرامطة؛ اجتمع إليه بسواد واسط أكثر من عشرة آلاف رجل ممن يعتقد مذهب القرامطة فيكتمه فأظهروا اعتقادهم وسار إلى أعمال الموفقية وبنى بها داراً سماها دار الهجرة واستولى على تلك الناحية وكانوا ينهبون ويسبون ويقتلون وهزموا بني بن نفيس {cite:kamil-ibn-al-athir p. 137}."
  en: "Qarmatian emir of the Wasit sawad; after Abu Tahir's raid ten thousand cryptic sympathisers declared themselves, and he built a Dar al-Hijra in the Muwaffaqiyya lands ruling that tract {cite:kamil-ibn-al-athir p. 137}."
  es: "Emir de Qarmatia del Wasit Sawad; después de la incursión de Abu Tahir, diez mil simpatizantes crípticos se declararon, y construyó un Dar al-Hijra en las tierras de Muwaffaqiyya que gobernaban ese territorio {cite:kamil-ibn-al-athir p. 137}."
  fr: "Émir qarmate du Wasit sawad; après le raid d'Abu Tahir, dix mille sympathisants cryptiques se déclarèrent, et il construisit un Dar al-Hijra dans les terres de Muwaffaqiyya, gouvernant ce territoire {cite:kamil-ibn-al-athir p. 137}."
  ur: "قرمتی امیر وسط سواد؛ ابو طاہر کے چھاپے کے بعد دس ہزار خفیہ ہمدردوں نے اپنے آپ کو اعلان کیا، اور اس نے موفقیہ کی سرزمین پر ایک دارالحجرہ بنایا جس کی حکومت تھی۔ 137}۔"
  tr: "Karmatlılardan Irak'ın karanlığında görünenler, Qarmatya doktrinine inanan ve gizli tutan on binden fazla adamı Wasit'in karanlığında topladılar. İnançlarını açıkladılar ve o Muwafqiyya fabrikalarına giderek orada Göç Evi adında bir ev inşa etti ve o bölgeyi ele geçirdi. Yağmaladılar, lanetlediler, öldürdüler ve Banu ibn Nafis'i yendi {atıf:kamil-ibn-al-athir, s. 137}."
  id: "Siapa pun yang muncul di hitam Irak dari Qarmatian mengumpulkan lebih dari sepuluh ribu orang yang percaya pada doktrin Qarmatian dan menyembunyikannya. Mereka mengungkapkan keyakinan mereka, dan ia melanjutkan ke pekerjaan Muwafqiyya, membangun rumah di sana yang disebut Rumah Migrasi, merebut wilayah itu. Mereka menjarah, mengutuk, membunuh, dan mengalahkan Banu ibn Nafis {cite:kamil-ibn-al-athir, hlm. 137}."
