summary:
  en: "A Thaqafi leader allied to Banu Zuhra who marched with the Meccan army, then judged a battle against Medina unnecessary after the caravan escaped and led the whole Zuhra contingent — some 300 men — home before Badr."
  fr: "Chef thaqafite allié des Banu Zuhra qui marcha avec l’armée mecquoise, puis jugea inutile de combattre Médine une fois la caravane hors de danger et ramena chez eux tout le contingent des Zuhra — quelque 300 hommes — avant Badr."
  ar: "زعيم ثقفي حليف بني زهرة ورئيس عليهم في نفير بدر؛ رأى أن لا حاجة بقريش إلى القتال بعد نجاة العير، فردّ بني زهرة كلهم — نحو ثلاثمائة رجل — فلم يشهد بدر زهريٌّ واحد."
  es: "Un líder Thaqafi aliado de Banu Zuhra, que marchó con el ejército de La Meca, consideró innecesaria una batalla contra Medina después de que la caravana escapara y condujo a todo el contingente Zuhra —unos 300 hombres— de regreso a casa ante Badr."
  ur: "ایک ثقفی رہنما نے بنو زہرہ کے ساتھ اتحاد کیا جس نے مکہ کی فوج کے ساتھ مارچ کیا، پھر قافلہ کے فرار ہونے کے بعد مدینہ کے خلاف جنگ کو غیر ضروری قرار دیا اور زہرہ کے پورے دستے - تقریباً 300 افراد - کو بدر سے پہلے گھر لے گئے۔"
