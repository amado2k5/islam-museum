summary:
  ar: "مؤلف موسيقي ومغنٍّ هندي، وُلد في مدراس (تشيناي) باسم أ. س. دليب كومار في أسرة هندوسية، واعتنق الإسلام مع أسرته وهو في الثالثة والعشرين من عمره سنة 1989؛ غيّرت موسيقاه لفيلم «روجا» (1992) وجه الموسيقى السينمائية الهندية، وحملته موسيقى «مليونير العشوائيات» (2008) إلى جائزتي أوسكار وجائزتي غرامي، فصار يُلقّب بـ«عاصفة الموسيقى» و«موتسارت مدراس»."
  en: "Indian composer and singer, born in Madras (now Chennai) as A. S. Dileep Kumar into a Hindu family; he converted to Islam with his family at the age of twenty-three, in 1989. His score for Roja (1992) transformed Indian film music, and Slumdog Millionaire (2008) carried him to two Academy Awards and two Grammy Awards. He is nicknamed Isai Puyal ('Musical Storm') and 'the Mozart of Madras'."
  ur: "ہندوستانی موسیقار و گلوکار، مدراس (چینئی) میں اے ایس دلیپ کمار کے نام سے ایک ہندو گھرانے میں پیدا ہوئے؛ 1989 میں تیئیس برس کی عمر میں اپنے خاندان کے ساتھ اسلام قبول کیا۔ ان کی فلم «روجا» (1992) کی موسیقی نے ہندوستانی فلمی موسیقی کا رخ بدل دیا، اور «سلم ڈاگ ملینیئر» (2008) پر انہیں دو اکیڈمی ایوارڈز اور دو گریمی ایوارڈز ملے۔"
