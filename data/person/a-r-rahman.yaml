summary:
  ar: "مؤلف موسيقي ومغنٍّ هندي، وُلد في مدراس ⁦(تشيناي)⁩ باسم أ. س. دليب كومار في أسرة هندوسية، واعتنق الإسلام مع أسرته وهو في الثالثة والعشرين من عمره سنة 1989؛ غيّرت موسيقاه لفيلم «روجا» (1992) وجه الموسيقى السينمائية الهندية، وحملته موسيقى «مليونير العشوائيات» (2008) إلى جائزتي أوسكار وجائزتي غرامي، فصار يُلقّب بـ«عاصفة الموسيقى» و«موتسارت مدراس»."
  en: "Indian composer and singer, born in Madras (now Chennai) as A. S. Dileep Kumar into a Hindu family; he converted to Islam with his family at the age of twenty-three, in 1989. His score for Roja (1992) transformed Indian film music, and Slumdog Millionaire (2008) carried him to two Academy Awards and two Grammy Awards. He is nicknamed Isai Puyal ('Musical Storm') and 'the Mozart of Madras'."
  fr: "Compositeur et chanteur indien, né à Madras (aujourd'hui Chennai) sous le nom d'A. S. Dileep Kumar dans une famille hindoue ; il se convertit à l'islam avec sa famille à vingt-trois ans, en 1989. Sa partition pour Roja (1992) transforma la musique de film indienne, et Slumdog Millionaire (2008) lui valut deux Oscars et deux Grammy Awards. On le surnomme Isai Puyal (« Tempête musicale ») et « le Mozart de Madras »."
  ur: "ہندوستانی موسیقار و گلوکار، مدراس ⁦(چینئی)⁩ میں اے ایس دلیپ کمار کے نام سے ایک ہندو گھرانے میں پیدا ہوئے؛ 1989 میں تیئیس برس کی عمر میں اپنے خاندان کے ساتھ اسلام قبول کیا۔ ان کی فلم «روجا» (1992) کی موسیقی نے ہندوستانی فلمی موسیقی کا رخ بدل دیا، اور «سلم ڈاگ ملینیئر» (2008) پر انہیں دو اکیڈمی ایوارڈز اور دو گریمی ایوارڈز ملے۔"
  es: "Compositor y cantante indio, nacido en Madrás (actualmente Chennai) con el nombre de AS Dileep Kumar en el seno de una familia hindú, se convirtió al islam junto con su familia a los veintitrés años, en 1989. Su banda sonora para Roja (1992) transformó la música del cine indio, y Slumdog Millionaire (2008) le valió dos premios Óscar y dos premios Grammy. Es conocido como Isai Puyal («Tormenta Musical») y «el Mozart de Madrás»."
  tr: "Hindistanlı besteci ve şarkıcı A. S. Dilip Kumar, Madras'ta (Chennai) Hindu bir ailede doğdu ve 1989'da 23 yaşında ailesiyle birlikte İslamiyet'i kabul etti. \"Rooga\" (1992) filmi için yaptığı müzik, Hint film müziğinin çehresini değiştirdi ve \"Slumdog Millionaire\" (2008) filmi için yaptığı müzik ona iki Oscar ve iki Grammy Ödülü kazandırdı; bu da ona \"Müzikal Fırtına\" ve \"Madras'ın Mozart'ı\" lakaplarını getirdi."
  id: "Seorang komposer dan penyanyi India, lahir di Madras (Chennai) dengan nama A. S. Dilip Kumar dalam keluarga Hindu, ia masuk Islam bersama keluarganya pada usia 23 tahun pada tahun 1989. Musiknya untuk film \"Rooga\" (1992) mengubah wajah musik film India, dan musik untuk \"Slumdog Millionaire\" (2008) memberinya dua Oscar dan dua Grammy Awards, yang memberinya julukan \"Badai Musik\" dan \"Mozart dari Madras.\""
