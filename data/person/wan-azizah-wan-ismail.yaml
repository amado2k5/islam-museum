  es: "Política y oftalmóloga malasia, nacida en 1952 en Singapur. Fue la primera mujer viceprimera ministra de Malasia (2018-2020), presidenta del Partido de la Justicia Popular y esposa del primer ministro Anwar Ibrahim."
  fr: "Femme politique et ophtalmologue malaisienne, née en 1952 à Singapour. Première femme vice-première ministre de Malaisie (2018-2020), présidente du Parti de la justice populaire et épouse du Premier ministre Anwar Ibrahim."
  tr: "1952 yılında Singapur'da doğan Malezyalı politikacı ve göz doktoru. Malezya'nın ilk kadın Başbakan Yardımcısı (2018–2020), Halk Adalet Partisi lideri ve Başbakan Anwar İbrahim'in eşi."
  id: "Politikus dan dokter mata Malaysia, lahir pada tahun 1952 di Singapura. Wanita pertama yang menjabat sebagai Wakil Perdana Menteri Malaysia (2018–2020), pemimpin Partai Keadilan Rakyat, dan istri Perdana Menteri Anwar Ibrahim."
