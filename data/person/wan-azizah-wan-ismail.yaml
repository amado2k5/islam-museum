summary:
  ar: "سياسية وطبيبة عيون ماليزية، وُلدت سنة 1952 في سنغافورة. أول امرأة تتولى منصب نائب رئيس وزراء ماليزيا ⁦(2018–2020)⁩، ورئيسة حزب عدالة الشعب، وزوجة رئيس الوزراء أنور إبراهيم."
  en: "Malaysian politician and ophthalmologist, born 1952 in Singapore. Malaysia's first female deputy prime minister (2018–2020), president of the People's Justice Party, and wife of Prime Minister Anwar Ibrahim."
