label: { ar: "سليمان المستعين الأندلسي" }
summary:
  ar: "سليمان ابن أخي هشام المؤيد والمهدي؛ لحق بجنود البربر وقد اجتمعوا بظاهر قرطبة فبايعوه ولقبوه المستعين بالله فنهض بهم إلى ثغر طليطلة واستجاش بابن أذفونش فاستلحم من أهل قرطبة ما يزيد على عشرين ألفاً ودخل قرطبة ختام المائة الرابعة، ثم هزمه المهدي بعقبة البقر ثم كر البرابرة على المهدي وابن أذفونش فانهزما وحاصر المستعين قرطبة حتى دخلها عنوة سنة 403هـ وقتل هشام المؤيد سراً ولحق بيوتات قرطبة معرة في نسائهم وأبنائهم {cite:nafh-tib-maqqari p. 464-465}."
  en: "Sulayman al-Musta'in, the Umayyad claimant who led the Berbers against Cordoba, took it at the close of the fourth century, lost it to al-Mahdi at Uqbat al-Baqar, then re-entered by force in 403 — the sack in which Hisham al-Mu'ayyad was secretly killed {cite:nafh-tib-maqqari p. 464-465}."
