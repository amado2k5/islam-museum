  ar: أحد الستة الذين شهدوا العقبة الأولى، وذكره موسى بن عقبة وأبو الأسود عن عروة فيمن شهد بدراً؛ غير جابر بن عبد الله بن عمرو بن حرام الراوي المعروف؛ ويرى ابن حجر أن له أحاديث من طرق ضعيفة.
