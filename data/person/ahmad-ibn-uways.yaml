label: { ar: "أحمد بن أويس الجلائري", en: "Ahmad ibn Uways al-Jalayiri", es: "Ahmad ibn Uways al-Jalayiri", fr: "Ahmad ibn Uways al-Jalayiri", ur: "احمد بن اویس الجلیری" }
names:
  - { kind: full, lang: ar, value: "غياث الدين أحمد بن أويس بن الشيخ حسن بن حسين بن أقبغا ابن إيلكان" }
summary:
  ar: "غياث الدين أحمد بن أويس الجلائري سلطان بغداد وتبريز وغيرهما من بلاد العراق ملك بعد موت أخيه الشيخ حسين بن أويس سنة أربع وثمانين وسبع مئة وكان سلطاناً فاتكاً له سطوة على الرعية مقداماً شجاعاً مهاباً سفاكاً للدماء وعنده جور وظلم على أمرائه وجنده وكانت له مشاركة في عدة علوم ومعرفة تامة بعلم النجوم ويد في معرفة الموسيقى وفي تأديته يجيد ذلك إلى الغاية منهمكاً في اللذات التي تهواها الأنفس فأكرمه برقوق غاية الإكرام وأنعم عليه أجل الإنعام وأعطاه تقليد نيابة السلطنة ببغداد فأهوى ابن أويس لتقبيل الأرض فلم يمكنه الظاهر من ذلك إجلالاً له ثم سار إلى بغداد فدخلها {cite:shadharat-dhahab p. 100-101}، وعند ابن خلدون لما زحف تمر إلى بغداد هرب ولحق بالسلطان الظاهر برقوق مستصرخاً فخرج معه في العساكر إلى الفرات وبعث الظاهر العساكر مدداً له فملك بغداد من شرذمة عسكر تمر {cite:tarikh-ibn-khaldun-ibar p. 1542}."
  en: "Ahmad ibn Uways the Jalayirid, sultan of Baghdad, Tabriz and the Iraqi lands after his brother Shaykh Husayn (784) — a dreaded, blood-spilling sultan with tyranny over his amirs and troops, yet versed in several sciences, complete in astronomy, and an accomplished musician in knowledge and performance, immersed in the pleasures souls desire; Barquq honoured him exceedingly, gave him the vice-sultanate patent of Baghdad, and would not let him kiss the ground, out of reverence {cite:shadharat-dhahab p. 100-101}."
  es: "Ahmad ibn Uways el Jalayirid, sultán de Bagdad, Tabriz y las tierras iraquíes después de su hermano Shaykh Husayn (784), un sultán temido y sanguinario que ejercía tiranía sobre sus emires y tropas, pero versado en varias ciencias, completo en astronomía y un músico consumado en conocimiento e interpretación, inmerso en los placeres que las almas desean; Barquq lo honró enormemente, le otorgó la patente del vicesultanato de Bagdad y no le permitió besar el suelo, por reverencia {cite:shadharat-dhahab p. 100-101}."
  fr: "Ahmad ibn Uways le Jalayirid, sultan de Bagdad, de Tabriz et des terres irakiennes après son frère Cheikh Husayn (784) — un sultan redouté et sanguinaire, tyrannique envers ses émirs et ses troupes, mais versé dans plusieurs sciences, parfait en astronomie et musicien accompli, tant par sa connaissance que par son interprétation, plongé dans les plaisirs que les âmes désirent; Barquq l'honora extrêmement, lui donna le brevet de vice-sultanat de Bagdad et ne le laissa pas embrasser le sol, par révérence {cite:shadharat-dhahab p. 100-101}."
  ur: "احمد بن اویس جلیرید، بغداد، تبریز اور عراقی سرزمین کا سلطان اپنے بھائی شیخ حسین (784) کے بعد - ایک خوفناک، خون بہانے والا سلطان جو اپنے امیروں اور فوجوں پر ظلم و جبر کرتا تھا، پھر بھی کئی علوم میں مہارت رکھتا تھا، فلکیات میں مکمل، فن موسیقی میں ماہر اور ماہر موسیقی کا ماہر تھا۔ لذت روح کی خواہش؛ برقوق نے اس کی بہت عزت کی، اسے بغداد کا نائب سلطانی پیٹنٹ دیا، اور اسے احترام کے ساتھ زمین کو چومنے نہیں دیا۔ 100-101}۔"
  tr: "Bağdat, Tebriz ve Irak'ın diğer bölgelerinin sultanı Gıyat-Din Ahmed ibn Uveys el-Celari, 784 Hicri yılında kardeşi Şeyh Hüseyin ibn Uveys'in ölümünden sonra hükümdar oldu. Halkı üzerinde gücü olan, acımasız, cesur ve korkulan bir lider, kana susamış bir tiran olan İbn Uveys, emirlerine ve askerlerine karşı adaletsiz ve baskıcıydı. Birçok bilim dalında bilgi sahibiydi, astronomi konusunda tam bir bilgiye sahipti ve müzik ve icra konusunda da yetenekliydi. Ruhun arzuladığı zevklere düşkündü, bu yüzden Barkuk ona en büyük onuru bahşetti ve Bağdat'ta vekil sultan olarak atadı. İbn Uveys yere öpmek üzereydi, ancak el-Zahir ona duyduğu saygıdan dolayı buna izin vermedi. Sonra Bağdat'a yürüdü ve şehre girdi. İbn Haldun'a göre, Timur Bağdat'a doğru ilerlerken, o kaçarak Sultan Zahir Barquq'a katıldı ve ondan yardım istedi. Böylece onunla birlikte Fırat'a kadar askerleriyle birlikte gitti ve Zahir ona takviye olarak asker gönderdi, böylece Timur'un askerlerinden bir grubun elinden Bağdat'ın kontrolünü ele geçirdi. {cite:tarikh-ibn-khaldun-ibar s. 1542}"
  id: "Ghiyath al-Din Ahmad ibn Uways al-Jalairi, Sultan Baghdad, Tabriz, dan beberapa wilayah Irak lainnya, menjadi penguasa setelah kematian saudaranya, Syekh Hussein ibn Uways, pada tahun 784 H. Ia adalah seorang sultan yang kejam dan berkuasa atas rakyatnya, seorang pemimpin yang berani, gagah, dan ditakuti, seorang tiran yang haus darah, dan ia tidak adil serta menindas para emir dan tentaranya. Ia menguasai beberapa ilmu pengetahuan, memiliki pengetahuan lengkap tentang astronomi, dan mahir dalam musik dan pertunjukannya. Ia sangat menikmati kesenangan yang diinginkan jiwa, sehingga Barquq menghormatinya dengan kehormatan tertinggi dan memberinya banyak keistimewaan, serta memberinya jabatan sebagai wakil sultan di Baghdad. Ibn Uways hendak mencium tanah, tetapi al-Zahir tidak mengizinkannya karena rasa hormat kepadanya. Kemudian ia berbaris ke Baghdad dan memasukinya. 100-101}, dan menurut Ibn Khaldun, ketika Tamer bergerak menuju Baghdad, ia melarikan diri dan bergabung dengan Sultan Al-Zahir Barquq, meminta bantuannya. Maka ia pergi bersamanya dengan pasukan ke Efrat, dan Al-Zahir mengirim pasukan untuk memperkuatnya, sehingga ia menguasai Baghdad dari sekelompok pasukan Tamer {cite:tarikh-ibn-khaldun-ibar p. 1542}."
