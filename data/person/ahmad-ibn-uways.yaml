summary:
  ar: "غياث الدين أحمد بن أويس الجلائري سلطان بغداد وتبريز وغيرهما من بلاد العراق ملك بعد موت أخيه الشيخ حسين بن أويس سنة أربع وثمانين وسبع مئة وكان سلطاناً فاتكاً له سطوة على الرعية مقداماً شجاعاً مهاباً سفاكاً للدماء وعنده جور وظلم على أمرائه وجنده وكانت له مشاركة في عدة علوم ومعرفة تامة بعلم النجوم ويد في معرفة الموسيقى وفي تأديته يجيد ذلك إلى الغاية منهمكاً في اللذات التي تهواها الأنفس فأكرمه برقوق غاية الإكرام وأنعم عليه أجل الإنعام وأعطاه تقليد نيابة السلطنة ببغداد فأهوى ابن أويس لتقبيل الأرض فلم يمكنه الظاهر من ذلك إجلالاً له ثم سار إلى بغداد فدخلها {cite:shadharat-dhahab p. 100-101}."
  en: "Ahmad ibn Uways the Jalayirid, sultan of Baghdad, Tabriz and the Iraqi lands after his brother Shaykh Husayn (784) — a dreaded, blood-spilling sultan with tyranny over his amirs and troops, yet versed in several sciences, complete in astronomy, and an accomplished musician in knowledge and performance, immersed in the pleasures souls desire; Barquq honoured him exceedingly, gave him the vice-sultanate patent of Baghdad, and would not let him kiss the ground, out of reverence {cite:shadharat-dhahab p. 100-101}."
