id: person/al-mutamid
class: person
label: { ar: "المعتمد على الله", en: "al-Mu'tamid ala Allah" }
summary:
  ar: "خليفة عباسي، بويع له في رجب سنة ست وخمسين ومائتين باسم المعتمد على الله بعد وفاة المهتدى {cite:tabari-tarikh-abu-al-fadl j.9 p.474}، وعند السيوطي هو أحمد بن المتوكل أمه فتيان، لما قتل المهتدي كان محبوساً بالجوسق فأخرجوه وبايعوه فاستعمل أخاه الموفق على المشرق وصير ابنه جعفراً ولي عهده ولقبه المفوض إلى الله، وانهمك في اللهو واللذات واشتغل عن الرعية فكرهه الناس وأحبوا أخاه طلحة {cite:tarikh-khulafa-minhaj-1434 p. 564}. وعند المسعودي هو أحمد بن جعفر المتوكل يكنى أبا العباس وأمه أم ولد كوفية يقال لها فتيان، بويع يوم الثلاثاء لأربع عشرة ليلة بقيت من رجب سنة ست وخمسين ومائتين وهو ابن خمس وعشرين سنة، ومات في رجب سنة تسع وسبعين ومائتين وهو ابن ثمان وأربعين فكانت خلافته ثلاثاً وعشرين سنة، واستوزر عبيد الله بن يحيى بن خاقان ثم الحسن بن مخلد ثم سليمان بن وهب ثم صاعداً {cite:muruj-al-dhahab p. 571}، وعند المسعودي كان مشغوفاً بالطرب والغالب عليه المعاقرة ومحبة أنواع اللهو والملاهي، وسأل عبيد الله بن خرداذبه عن أول من اتخذ العود {cite:muruj-al-dhahab p. 588}، وعند ابن خلدون وتقبض عليه يوسف بن تاشفين وقاده أسيراً إلى مراكش فلم يزل في اعتقاله ، وعند ابن الجوزي لعن عمرو بن الليث بحضرة حجاج خراسان سنة ٢٧١ وأمر بلعنه على المنابر بعد أن عزله عمّا كان قلّده وقلّد خراسان محمد بن طاهر {cite:muntazam-ibn-al-jawzi p. 83}، وقدم المعتمد بغداد لخمس بقين من شوال سنة ٢٧٢ فنزل الزعفرانية وعبد الله بن طاهر بين يديه بالحربة {cite:muntazam-ibn-al-jawzi p. 85}"
  en: "Abbasid caliph, given the oath in Rajab 256 under the name al-Mu'tamid ala Allah after the death of al-Muhtadi {cite:tabari-tarikh-abu-al-fadl j.9 p.474}. According to al-Suyuti he was Ahmad ibn al-Mutawakkil, his mother Fatyan. When al-Muhtadi was killed he had been confined in al-Jawsaq; they brought him out and gave him the oath. He made his brother al-Muwaffaq governor of the East, made his son Ja'far his heir with the title al-Mufawwad ila Allah, and became absorbed in pleasure and neglected his subjects, so people disliked him and loved his brother Talha {cite:tarikh-khulafa-minhaj-1434 p. 564}. According to al-Mas'udi he was Ahmad ibn Ja'far al-Mutawakkil, kunya Abu al-Abbas, and his mother was a slave-mother from Kufa called Fatyan. He was given the oath on Tuesday, fourteen nights before the end of Rajab 256, aged twenty-five, and died in Rajab 279 aged forty-eight, so his caliphate lasted twenty-three years. He appointed as viziers 'Ubayd Allah ibn Yahya ibn Khaqan, then al-Hasan ibn Makhlad, then Sulayman ibn Wahb, then Sa'id {cite:muruj-al-dhahab p. 571}. According to al-Mas'udi he was passionately fond of music; drinking and all kinds of pleasures and entertainments dominated him, and he asked 'Ubayd Allah ibn Khurradadhbih who first took up the 'ud {cite:muruj-al-dhahab p. 588}. According to Ibn Khaldun, Yusuf ibn Tashfin seized him, led him captive to Marrakesh, and kept him in confinement there. According to Ibn al-Jawzi, in 271 he cursed 'Amr ibn al-Layth in the presence of the pilgrims of Khurasan and ordered him cursed from the pulpits, after dismissing him from the post he had given him and granting Khurasan to Muhammad ibn Tahir {cite:muntazam-ibn-al-jawzi p. 83}. He came to Baghdad five nights before the end of Shawwal 272 and alighted at al-Za'faraniyya, with 'Abd Allah ibn Tahir going before him with the spear {cite:muntazam-ibn-al-jawzi p. 85}."
