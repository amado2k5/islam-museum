label: { ar: "المعتمد على الله" }
summary:
  ar: "خليفة عباسي، بويع له في رجب سنة ست وخمسين ومائتين باسم المعتمد على الله بعد وفاة المهتدى {cite:tabari-tarikh-abu-al-fadl j.9 p.474}، وعند السيوطي هو أحمد بن المتوكل أمه فتيان، لما قتل المهتدي كان محبوساً بالجوسق فأخرجوه وبايعوه فاستعمل أخاه الموفق على المشرق وصير ابنه جعفراً ولي عهده ولقبه المفوض إلى الله، وانهمك في اللهو واللذات واشتغل عن الرعية فكرهه الناس وأحبوا أخاه طلحة {cite:tarikh-khulafa-minhaj-1434 p. 564}."
