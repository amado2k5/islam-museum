id: person/al-mutamid
class: person
label: { ar: "المعتمد على الله", en: "al-Mu'tamid ala Allah", fr: "al-Mu'tamid ala Allah", es: "al-Mu'tamid ala Allah", ur: "المتمد الا اللہ" }
summary:
  ar: "خليفة عباسي، بويع له في رجب سنة ست وخمسين ومائتين باسم المعتمد على الله بعد وفاة المهتدى {cite:tabari-tarikh-abu-al-fadl j.9 p.474}، وعند السيوطي هو أحمد بن المتوكل أمه فتيان، لما قتل المهتدي كان محبوساً بالجوسق فأخرجوه وبايعوه فاستعمل أخاه الموفق على المشرق وصير ابنه جعفراً ولي عهده ولقبه المفوض إلى الله، وانهمك في اللهو واللذات واشتغل عن الرعية فكرهه الناس وأحبوا أخاه طلحة {cite:tarikh-khulafa-minhaj-1434 p. 564}. وعند المسعودي هو أحمد بن جعفر المتوكل يكنى أبا العباس وأمه أم ولد كوفية يقال لها فتيان، بويع يوم الثلاثاء لأربع عشرة ليلة بقيت من رجب سنة ست وخمسين ومائتين وهو ابن خمس وعشرين سنة، ومات في رجب سنة تسع وسبعين ومائتين وهو ابن ثمان وأربعين فكانت خلافته ثلاثاً وعشرين سنة، واستوزر عبيد الله بن يحيى بن خاقان ثم الحسن بن مخلد ثم سليمان بن وهب ثم صاعداً {cite:muruj-al-dhahab p. 571}، وعند المسعودي كان مشغوفاً بالطرب والغالب عليه المعاقرة ومحبة أنواع اللهو والملاهي، وسأل عبيد الله بن خرداذبه عن أول من اتخذ العود {cite:muruj-al-dhahab p. 588}، وعند ابن خلدون وتقبض عليه يوسف بن تاشفين وقاده أسيراً إلى مراكش فلم يزل في اعتقاله ، وعند ابن الجوزي لعن عمرو بن الليث بحضرة حجاج خراسان سنة ٢٧١ وأمر بلعنه على المنابر بعد أن عزله عمّا كان قلّده وقلّد خراسان محمد بن طاهر {cite:muntazam-ibn-al-jawzi p. 83}، وقدم المعتمد بغداد لخمس بقين من شوال سنة ٢٧٢ فنزل الزعفرانية وعبد الله بن طاهر بين يديه بالحربة {cite:muntazam-ibn-al-jawzi p. 85}"
  en: "Abbasid caliph, given the oath in Rajab 256 under the name al-Mu'tamid ala Allah after the death of al-Muhtadi {cite:tabari-tarikh-abu-al-fadl j.9 p.474}. According to al-Suyuti he was Ahmad ibn al-Mutawakkil, his mother Fatyan. When al-Muhtadi was killed he had been confined in al-Jawsaq; they brought him out and gave him the oath. He made his brother al-Muwaffaq governor of the East, made his son Ja'far his heir with the title al-Mufawwad ila Allah, and became absorbed in pleasure and neglected his subjects, so people disliked him and loved his brother Talha {cite:tarikh-khulafa-minhaj-1434 p. 564}. According to al-Mas'udi he was Ahmad ibn Ja'far al-Mutawakkil, kunya Abu al-Abbas, and his mother was a slave-mother from Kufa called Fatyan. He was given the oath on Tuesday, fourteen nights before the end of Rajab 256, aged twenty-five, and died in Rajab 279 aged forty-eight, so his caliphate lasted twenty-three years. He appointed as viziers 'Ubayd Allah ibn Yahya ibn Khaqan, then al-Hasan ibn Makhlad, then Sulayman ibn Wahb, then Sa'id {cite:muruj-al-dhahab p. 571}. According to al-Mas'udi he was passionately fond of music; drinking and all kinds of pleasures and entertainments dominated him, and he asked 'Ubayd Allah ibn Khurradadhbih who first took up the 'ud {cite:muruj-al-dhahab p. 588}. According to Ibn Khaldun, Yusuf ibn Tashfin seized him, led him captive to Marrakesh, and kept him in confinement there. According to Ibn al-Jawzi, in 271 he cursed 'Amr ibn al-Layth in the presence of the pilgrims of Khurasan and ordered him cursed from the pulpits, after dismissing him from the post he had given him and granting Khurasan to Muhammad ibn Tahir {cite:muntazam-ibn-al-jawzi p. 83}. He came to Baghdad five nights before the end of Shawwal 272 and alighted at al-Za'faraniyya, with 'Abd Allah ibn Tahir going before him with the spear {cite:muntazam-ibn-al-jawzi p. 85}."
  fr: "calife abbasside, a prêté serment dans Rajab 256 sous le nom al-Mu'tamid ala Allah après la mort d'al-Muhtadi {cite:tabari-tarikh-abu-al-fadl j.9 p.474}. Selon al-Suyuti, il était Ahmad ibn al-Mutawakkil, sa mère Fatyan. Quand al-Muhtadi a été tué, il avait été confiné à al-Jawsaq ; ils l'ont fait sortir et lui ont prêté serment. Il a fait de son frère al-Muwaffaq le gouverneur de l'Orient, a fait de son fils Ja'far son héritier avec le titre al-Mufawwad ila Allah, et s'est absorbé dans le plaisir et a négligé ses sujets, de sorte que les gens l'aimaient et aimaient son frère Talha {cite:tarikh-khulafa-minhaj-1434 p. 564}. Selon al-Mas'udi, il était Ahmad ibn Ja'far al-Mutawakkil, kunya Abu al-Abbas, et sa mère était une esclave-mère de Kufa appelée Fatyan. Il a prêté serment mardi, quatorze nuits avant la fin de Rajab 256, âgé de vingt-cinq ans, et est mort à Rajab 279 âgé de quarante-huit ans, de sorte que son califat a duré vingt-trois ans. Il a nommé comme vizirs 'Ubayd Allah ibn Yahya ibn Khaqan, puis al-Hasan ibn Makhlad, puis Sulayman ibn Wahb, puis Sa'id {cite:muruj-al-dhahab p. 571}. Selon al-Mas'udi, il aimait passionnément la musique ; boire et toutes sortes de plaisirs et de divertissements le dominaient, et il a demandé 'Ubayd Allah ibn Khurradadhbih qui a pris le premier {cite:muruj-al-dhahab p. 588}. Selon Ibn Khaldoun, Yusuf ibn Tashfin l'a capturé, conduit captif à Marrakech et l'y a gardé en détention. Selon Ibn al-Jawzi, en 271, il maudit 'Amr ibn al-Layth en présence des pèlerins de Khurasan et lui ordonna de le maudire des chaires, après l'avoir congédié du poste qu'il lui avait donné et avoir accordé Khurasan à Muhammad ibn Tahir {cite:muntazam-ibn-al-jawzi p. 83}. Il est venu à Bagdad cinq nuits avant la fin de Shawwal 272 et descendit à al-Za'faraniyya, avec 'Abd Allah ibn Tahir le précédant avec la lance {cite:muntazam-ibn-al-jawzi p. 85}."
  es: "Califa abasí, prestó juramento en Rajab 256 con el nombre de al-Mu'tamid ala Allah tras la muerte de al-Muhtadi {cite:tabari-tarikh-abu-al-fadl j.9 p.474}. Según al-Suyuti, era Ahmad ibn al-Mutawakkil, y su madre Fatyan. Cuando al-Muhtadi fue asesinado, estaba confinado en al-Jawsaq; lo sacaron y le tomaron juramento. Nombró a su hermano al-Muwaffaq gobernador del Este, designó a su hijo Ja'far como su heredero con el título de al-Mufawwad ila Allah, y se entregó a los placeres descuidó a sus súbditos, por lo que la gente lo detestaba y amaba a su hermano Talha {cite:tarikh-khulafa-minhaj-1434 p. 564}. Según al-Mas'udi, era Ahmad ibn Ja'far al-Mutawakkil, kunya Abu al-Abbas, y su madre era una esclava de Kufa llamada Fatyan. Prestó juramento un martes, catorce noches antes del final de Rajab 256, a la edad de veinticinco años, y murió en Rajab 279 a la edad de cuarenta y ocho, por lo que su califato duró veintitrés años. Nombró como visires a 'Ubayd Allah ibn Yahya ibn Khaqan, luego a al-Hasan ibn Makhlad, luego a Sulayman ibn Wahb, luego a Sa'id {cite:muruj-al-dhahab p. 571}. Según al-Mas'udi, era un apasionado de la música; La bebida y toda clase de placeres y entretenimientos lo dominaban, y preguntó a 'Ubayd Allah ibn Khurradadhbih quién fue el primero en tomar el 'ud {cite:muruj-al-dhahab p. 588}. Según Ibn Khaldun, Yusuf ibn Tashfin lo apresó, lo llevó cautivo a Marrakech y lo mantuvo confinado allí. Según Ibn al-Jawzi, en 271 maldijo a 'Amr ibn al-Layth en presencia de los peregrinos de Jorasán y ordenó que lo maldijeran desde los púlpitos, después de destituirlo del cargo que le había dado y conceder Jorasán a Muhammad ibn Tahir {cite:muntazam-ibn-al-jawzi p. 83}. Llegó a Bagdad cinco noches antes del final de Shawwal 272 y desembarcó en al-Za'faraniyya, con 'Abd Allah ibn Tahir yendo delante de él con la lanza {cite:muntazam-ibn-al-jawzi p. 85}."
  ur: "عباسی خلیفہ نے المحتدی کی وفات کے بعد رجب 256 میں المتمد الا اللہ کے نام سے حلف اٹھایا۔ سیوطی کے مطابق وہ احمد بن المتوکل تھے، ان کی والدہ فتیان تھیں۔ جب المتدی مارا گیا تو اسے الجوساق میں قید کر دیا گیا تھا۔ وہ اُسے باہر لے آئے اور اُسے قسم کھائی۔ اس نے اپنے بھائی الموفق کو مشرق کا گورنر بنایا، اپنے بیٹے جعفر کو المفواد الہٰی کے لقب سے اپنا وارث بنایا اور لذت میں مشغول ہو گیا اور اپنی رعایا کو نظرانداز کر دیا، اس لیے لوگ اسے ناپسند کرنے لگے اور ان کے بھائی طلحہ سے محبت کرنے لگے۔ 564}۔ المسعودی کے مطابق وہ احمد بن جعفر المتوکل، کنیہ ابو العباس تھے، اور ان کی والدہ کوفہ کی ایک لونڈی تھی جسے فتیان کہا جاتا تھا۔ آپ کو رجب 256 کے اختتام سے چودہ راتیں قبل منگل کو بیعت دی گئی، پچیس سال کی عمر میں، اور رجب 279 میں اڑتالیس سال کی عمر میں وفات پائی، چنانچہ آپ کی خلافت تئیس سال تک جاری رہی۔ اس نے عبید اللہ بن یحییٰ بن خاقان، پھر حسن بن مخلد، پھر سلیمان بن وہب، پھر سعید کو وزیر مقرر کیا۔ 571}۔ المسعودی کے مطابق وہ موسیقی کا شوقین تھا۔ شراب نوشی اور ہر طرح کی لذتیں اور تفریحات اس پر حاوی ہو گئے اور انہوں نے عبید اللہ بن خرد ذہبی سے پوچھا کہ سب سے پہلے عود کس نے اٹھایا۔ 588}۔ ابن خلدون کے مطابق، یوسف بن تاشفین نے اسے پکڑ لیا، اسیر بنا کر مراکش لے گئے، اور اسے وہاں قید رکھا۔ ابن الجوزی کے مطابق اس نے 271 میں خراسان کے زائرین کے سامنے عمرو بن لیث پر لعنت کی اور اسے منبروں سے ملعون کرنے کا حکم دیا، اسے اس عہدے سے برطرف کرنے اور محمد ابن طاہر کو خراسان دینے کے بعد۔ 83}۔ وہ شوال 272 کے اختتام سے پانچ راتیں پہلے بغداد آیا اور الظفرانیہ پر اترا، عبد اللہ بن طاہر نیزہ لے کر اس کے آگے آگے بڑھ رہے تھے۔ 85}۔"
