  fr: "Safi al-Din al-Hindi"
  ur: "صفی الدین الہندی"
roles: [scholar]
gender: male
summary:
  ar: "محمد بن عبد الرحيم بن محمد الأرموي، أبو عبد الله، صفي الدين الهندي، فقيه أصولي وُلد بالهند واستوطن دمشق وتوفي بها ووقف كتبه بدار الحديث الأشرفية؛ يذكر الزركلي 644-715 هـ، 1246-1315 م {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 200}."
  en: "Muhammad ibn Abd al-Rahim ibn Muhammad al-Armawi, Abu Abd Allah, Safi al-Din al-Hindi, a jurist and legal theorist born in India who settled in Damascus, died there and endowed his books to the Ashrafiyya Dar al-Hadith; al-Zirikli prints 644-715 AH, 1246-1315 CE {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 200}."
  es: "Muhammad ibn Abd al-Rahim ibn Muhammad al-Armawi, Abu Abd Allah, Safi al-Din al-Hindi, jurista y teórico legal nacido en la India que se estableció en Damasco, murió allí y legó sus libros a la Ashrafiyya Dar al-Hadith; al-Zirikli imprime 644-715 AH, 1246-1315 CE {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 200}."
  fr: "Muhammad ibn Abd al-Rahim ibn Muhammad al-Armawi, Abu Abd Allah, Safi al-Din al-Hindi, juriste et théoricien du droit né en Inde, installé à Damas, y est mort et a légué ses livres à l'Ashrafiyya Dar al-Hadith; al-Zirikli imprimés 644-715 AH, 1246-1315 CE {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 200}."
  ur: "محمد بن عبد الرحیم ابن محمد العرموی، ابو عبد اللہ، صفی الدین الہندی، ہندوستان میں پیدا ہونے والے ایک فقیہ اور قانونی نظریہ دان جو دمشق میں آباد ہوئے، وہیں انتقال کر گئے اور اپنی کتابیں اشرفیہ دار الحدیث کو عطا کیں۔ الزرکلی پرنٹس 644-715 ہجری، 1246-1315 عیسوی 6ص۔ 200}۔"
  tr: "Hindistan doğumlu ilkeler hukukçusu Muhammed bin Abdülrahim bin Muhammed el-Armavi, Ebu Abdullah, Safi al-Din el-Hindi, Şam'da yerleşmiş, orada ölmüş ve kitaplarını Ashrafiyya Hadis Evi'nde bağışlamıştır; el-Zerkali 644-715 H., 1246-1315 M.S. {cit: alam-zirikli-dar-al-ilm-2002 cilt 6, s. 200} belirtir."
  id: "Muhammad ibn Abd al-Rahim ibn Muhammad al-Armawi, Abu Abdullah, Safi al-Din al-Hindi, seorang ahli hukum yang lahir di India, menetap di Damaskus, meninggal di sana, dan mendonasikan bukunya di Rumah Hadis Ashrafiyya; al-Zarkali menyebutkan 644-715 H, 1246-1315 M {cite:alam-zirikli-dar-al-ilm-2002 vol. 6, hlm. 200}."
