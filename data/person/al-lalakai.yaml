summary:
  ar: "أبو القاسم هبة الله بن الحسن الطبري اللالكائي، الحافظ الفقيه الشافعي محدث بغداد؛ تفقه على الشيخ أبي حامد وسمع من المخلص وطبقته وبالري من جعفر بن محمد؛ صنف كتاباً في شرح السنة في مجلدين وكتاب رجال الصحيحين، ثم خرج في آخر أيامه إلى الدينور فمات بها في رمضان كهلاً {cite:shadharat-dhahab p. 211}."
  en: "Hibat Allah b. al-Hasan al-Lalaka'i — Baghdad's Shafi'i hadith master, author of a two-volume Sharh al-Sunna and a work on the men of the two Sahihs; travelled late in life to Dinawar and died there in Ramadan 418 {cite:shadharat-dhahab p. 211}."
