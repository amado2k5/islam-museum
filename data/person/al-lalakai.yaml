summary:
  ar: "أبو القاسم هبة الله بن الحسن الطبري اللالكائي، الحافظ الفقيه الشافعي محدث بغداد؛ تفقه على الشيخ أبي حامد وسمع من المخلص وطبقته وبالري من جعفر بن محمد؛ صنف «شرح أصول اعتقاد أهل السنة والجماعة» وكتاب رجال الصحيحين، ثم خرج في آخر أيامه إلى الدينور فمات بها في رمضان سنة 418هـ."
  en: "Abu al-Qasim Hibat Allah ibn al-Hasan al-Tabari al-Lalaka'i, Baghdad's Shafi'i hadith master and jurist; he studied law with Abu Hamid al-Isfarayini and heard hadith from al-Mukhallis and his generation and, at Rayy, from Ja'far ibn Muhammad; author of Sharh Usul I'tiqad Ahl al-Sunna and a book on the men of the two Sahihs; he went late in life to Dinawar and died there in Ramadan 418 AH."
