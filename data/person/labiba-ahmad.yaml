summary:
  ar: "ناشطة إسلامية ومحسنة ورحّالة وكاتبة مصرية (نحو 1870–1951)، وُلدت لبيبة أحمد عبد النبي في القاهرة. شاركت في مظاهرات السيدات سنة 1919، وأسّست «جمعية نهضة السيدات المصريات» ومجلتها «النهضة النسائية» لتصوغ نهضة المرأة بمفاهيم إسلامية، وأصبحت سنة 1933 أول رئيسة لقسم الأخوات المسلمات في جماعة الإخوان المسلمين."
  en: "Egyptian Islamic activist, philanthropist, traveller and writer (c. 1870–1951), born Labiba Ahmad Abd al-Nabi in Cairo. She marched in the women's demonstrations of 1919, founded the Society of Egyptian Ladies' Awakening and its journal al-Nahda al-Nisa'iyya to frame women's advancement in Islamic terms, and in 1933 became the first head of the Muslim Brotherhood's women's section."
  ur: "مصری اسلامی ناشطہ، فلاحی کارکن، سیاح اور مصنفہ (تقریباً 1870–1951)، قاہرہ میں لبیبہ احمد عبد النبی کے نام سے پیدا ہوئیں۔ 1919 کے خواتین کے مظاہروں میں شریک ہوئیں، «جمعیۃ نہضۃ السیدات المصریات» اور اس کا رسالہ «النہضۃ النسائیہ» قائم کیا تاکہ خواتین کی ترقی کو اسلامی تناظر میں پیش کیا جا سکے، اور 1933 میں اخوان المسلمین کے خواتین شعبے کی پہلی سربراہ بنیں۔"
