summary:
  ar: "سياسي وكاتب جزائري (1899–1985)؛ صيدلي من سطيف أسس الاتحاد الديمقراطي للبيان الجزائري، وانضم إلى جبهة التحرير الوطني 1956 فكان أول رئيس للحكومة المؤقتة للجمهورية الجزائرية (1958–1961)، ثم أول رئيس للمجلس الوطني التأسيسي بعد الاستقلال."
  en: "Algerian politician and writer (1899–1985). A pharmacist from Sétif, he founded the Democratic Union of the Algerian Manifesto, joined the FLN in 1956 and became the first president of the Provisional Government of the Algerian Republic (1958–1961), then the first president of the National Constituent Assembly after independence."
  ur: "جزائری سیاست دان اور مصنف (1899–1985)؛ سطیف کے فارماسسٹ، جنہوں نے جزائری منشور کی جمہوری یونین کی بنیاد رکھی، 1956 میں جبهة التحرير الوطني میں شامل ہوئے اور جمہوریہ جزائر کی عبوری حکومت کے پہلے صدر (1958–1961) بنے، پھر آزادی کے بعد قومی آئین ساز اسمبلی کے پہلے صدر ہوئے۔"
