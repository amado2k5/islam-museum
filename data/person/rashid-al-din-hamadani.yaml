summary:
  ar: "رشيد الدين فضل الله الهمذاني ⁦(1247 – 13 يوليو 1318)⁩، وزير الإيلخانيين وطبيبهم ومؤرخهم، صاحب «جامع التواريخ» أوسع تاريخ عالمي كُتب في عصره. وُلد في همدان لأسرة يهودية فارسية واعتنق الإسلام في نحو الثلاثين من عمره، فارتقى في بلاط أباقا ثم صار الوزير الأعظم لغازان وأولجايتو، وأشرف على إصلاحات مالية وعمرانية واسعة وأسس بتبريز مجمع الربع الرشيدي العلمي. وبعد وفاة أولجايتو اتُّهم بتسميمه فأُعدم سنة 718 هـ وخلفه ابنه غياث الدين وزيرًا لفترة وجيزة."
  en: "Rashid al-Din Fadl Allah Hamadani (1247 - 13 July 1318) was the Ilkhanid vizier, physician and historian whose Jami' al-Tawarikh ('Compendium of Chronicles') is the most comprehensive world history of its age. Born at Hamadan into a Persian Jewish family, he converted to Islam at about the age of thirty, rose at the court of Abaqa, and became grand vizier under Ghazan and Oldjaitu, directing fiscal and building reforms and founding the Rab'-i Rashidi scholarly complex at Tabriz. After Oldjaitu's death he was charged with poisoning him and executed in 718 AH; his son Ghiyath al-Din briefly held the vizierate after him."
  ur: "رشید الدین فضل اللہ ہمدانی (1247ء – 13 جولائی 1318ء) ایل خانیوں کے وزیر، طبیب اور مؤرخ تھے، جن کی «جامع التواریخ» اپنے دور کی سب سے جامع عالمی تاریخ ہے۔ ہمدان کے ایک یہودی خاندان میں پیدا ہوئے، تیس برس کی عمر میں اسلام قبول کیا، اور غازان و اولجایتو کے وزیر اعظم بنے۔ 718ھ میں ان پر اولجایتو کو زہر دینے کا الزام لگا اور انھیں پھانسی دے دی گئی۔"

