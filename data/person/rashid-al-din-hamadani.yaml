      Hanafi school for him in a single passage, glossing Oldjaitu's
      change of school as a turn away from the school Rashid was
      upon; the English article describes him as an ardent Sunni
      Muslim, but on the strength of his Letters, whose authenticity
      the same article reports as disputed and probably forged.
      One text naming the school, joined to a second attestation
      that is itself doubted, does not meet the founder's two-text
      rule, and the doubt rule is absolute. His faith is therefore
      recorded as unknown, with the conversion and both readings
