      His conversion is documented practice and is stated here in
      full: all three article texts agree that he was born into a
      Jewish family — of Hamadan, his father an apothecary-physician
      at the Ilkhanid court — and that he embraced Islam at about
      the age of thirty, in 1277 by the English article's dating.
      The Arabic article's religion section preserves a minority
      scholarly view that he was born Muslim, against the majority
      it quotes from Ibn Kathir, al-Dhahabi and Ibn Hajar. No
