summary:
  ar: "صحفي مواطن ومصوّر ومنشد فلسطيني من غزة ⁦(22 نوفمبر 1997 – 12 أكتوبر 2025)⁩؛ تخرّج في الإعلام بالجامعة الإسلامية بغزة سنة 2019، ووثّق حياة المدنيين في القطاع بفيديوهات ميدانية جمعت ملايين المتابعين وكان معروفًا أيضًا بأغانيه الوطنية؛ قُتل بالرصاص وهو يرتدي سترة الصحافة في حي الصبرة بمدينة غزة خلال اشتباكات بين مجموعة مسلحة وقوات الأمن بعد أيام من وقف إطلاق النار، في حادثة ندّدت بها لجنة حماية الصحفيين."
  en: "Palestinian citizen journalist, photographer and singer from Gaza ⁦(22 November 1997 – 12 October 2025)⁩. A 2019 media graduate of the Islamic University of Gaza, he documented civilian life in the Strip with frontline videos that drew millions of followers and was also known for his patriotic songs; he was shot dead while wearing a press vest in Gaza City's Sabra neighbourhood during clashes between an armed group and security forces days after the ceasefire, a killing condemned by the Committee to Protect Journalists."
  ur: "غزہ کا فلسطینی شہری صحافی، فوٹوگرافر اور نغمہ سرا ⁦(22 نومبر 1997 – 12 اکتوبر 2025)⁩۔ 2019 میں اسلامی یونیورسٹی آف غزہ سے میڈیا کی ڈگری لی، علاقے میں شہری زندگی کو میدانی ویڈیوز سے محفوظ کیا جنھیں لاکھوں نے دیکھا اور انقلابی نغموں کے لیے بھی معروف رہے؛ جنگ بندی کے چند روز بعد غزہ شہر کے محلہ صبرہ میں ایک مسلح گروہ اور سکیورٹی فورسز کے درمیان جھڑپوں کے دوران پریس جیکٹ پہنے گولی سے مارے گئے؛ قتل کی کمیٹی ٹو پروٹیکٹ جرنلسٹس نے مذمت کی۔"
  es: "Periodista ciudadano palestino, fotógrafo y cantante de Gaza (22 de noviembre de 1997 - 12 de octubre de 2025). Graduado en 2019 en Comunicación por la Universidad Islámica de Gaza, documentó la vida civil en la Franja con vídeos desde el frente que atrajeron a millones de seguidores y también fue conocido por sus canciones patrióticas; fue asesinado a tiros mientras vestía un chaleco de prensa en el barrio de Sabra, en la ciudad de Gaza, durante enfrentamientos entre un grupo armado y las fuerzas de seguridad días después del alto el fuego, un asesinato condenado por el Comité para la Protección de los Periodistas."
  fr: "Journaliste citoyen, photographe et chanteur palestinien originaire de Gaza (22 novembre 1997 – 12 octobre 2025). Diplômé en médias de l'Université islamique de Gaza en 2019, il documentait la vie civile dans la bande de Gaza à travers des vidéos tournées en direct, suivies par des millions de personnes. Il était également connu pour ses chansons patriotiques. Il a été abattu alors qu'il portait un gilet de presse dans le quartier de Sabra, à Gaza, lors d'affrontements entre un groupe armé et les forces de sécurité, quelques jours après le cessez-le-feu. Ce meurtre a été condamné par le Comité pour la protection des journalistes."
  tr: "Gazze'den Filistinli bir vatandaş gazeteci, fotoğrafçı ve şarkıcı (22 Kasım 1997 – 12 Ekim 2025); 2019'da Gazze İslam Üniversitesi'nden medya mezunu oldu, Şerit'teki sivillerin hayatlarını milyonlarca takipçi toplayan saha videolarıyla belgeledi ve vatansever şarkılarıyla da tanındı. Ateşkesten günler sonra Gazze Şehri'nin Sabra mahallesinde silahlı bir grup ile güvenlik güçleri arasındaki çatışmalarda basın ceketi giyerken vuruldu; bu olay Gazetecileri Koruma Komitesi tarafından kınandı."
  id: "Seorang jurnalis warga Palestina, fotografer, dan penyanyi asal Gaza (22 November 1997 – 12 Oktober 2025); lulus di bidang media dari Universitas Islam Gaza pada tahun 2019, mendokumentasikan kehidupan warga sipil di Jalur tersebut dengan video lapangan yang mengumpulkan jutaan pengikut, dan juga dikenal karena lagu-lagu patriotiknya. Ia ditembak saat mengenakan jaket pers di lingkungan Sabra, Kota Gaza, dalam bentrokan antara kelompok bersenjata dan pasukan keamanan beberapa hari setelah gencatan senjata, dalam insiden yang dikecam oleh Komite Perlindungan Jurnalis."
