summary:
  ar: "صحفي مواطن ومصوّر ومنشد فلسطيني من غزة ⁦(22 نوفمبر 1997 – 12 أكتوبر 2025)⁩؛ تخرّج في الإعلام بالجامعة الإسلامية بغزة سنة 2019، ووثّق حياة المدنيين في القطاع بفيديوهات ميدانية جمعت ملايين المتابعين وكان معروفًا أيضًا بأغانيه الوطنية؛ قُتل بالرصاص وهو يرتدي سترة الصحافة في حي الصبرة بمدينة غزة خلال اشتباكات بين مجموعة مسلحة وقوات الأمن بعد أيام من وقف إطلاق النار، في حادثة ندّدت بها لجنة حماية الصحفيين."
  en: "Palestinian citizen journalist, photographer and singer from Gaza ⁦(22 November 1997 – 12 October 2025)⁩. A 2019 media graduate of the Islamic University of Gaza, he documented civilian life in the Strip with frontline videos that drew millions of followers and was also known for his patriotic songs; he was shot dead while wearing a press vest in Gaza City's Sabra neighbourhood during clashes between an armed group and security forces days after the ceasefire, a killing condemned by the Committee to Protect Journalists."
  ur: "غزہ کا فلسطینی شہری صحافی، فوٹوگرافر اور نغمہ سرا ⁦(22 نومبر 1997 – 12 اکتوبر 2025)⁩۔ 2019 میں اسلامی یونیورسٹی آف غزہ سے میڈیا کی ڈگری لی، علاقے میں شہری زندگی کو میدانی ویڈیوز سے محفوظ کیا جنھیں لاکھوں نے دیکھا اور انقلابی نغموں کے لیے بھی معروف رہے؛ جنگ بندی کے چند روز بعد غزہ شہر کے محلہ صبرہ میں ایک مسلح گروہ اور سکیورٹی فورسز کے درمیان جھڑپوں کے دوران پریس جیکٹ پہنے گولی سے مارے گئے؛ قتل کی کمیٹی ٹو پروٹیکٹ جرنلسٹس نے مذمت کی۔"
