label: { ar: "مخلص الدولة الكناني", en: "Mukhlis al-Dawla al-Kinani" }
summary:
  ar: "أبو المتوج مقلد بن نصر بن منقذ الكناني، الملقب مخلص الدولة؛ والد الأمير صديق الدولة أبي الحسن علي صاحب قلعة شيزر، ومنه آل منقذ أصحاب شيزر؛ كان رجلاً نسيّ القدر مسيّر الذكر؛ وكان مع أهل بيته مقيمين بالقرب من قلعة شيزر يترددون إلى حلب وحماة، لهم الأنفس الكريمة والأملاك المثمنة، وملوك الشام يكرمونهم ويبجلون أقدارهم، وشعراء عصرهم يقصدونهم ويمدحونهم {cite:wafayat-ayan}."
  en: "Muqallad b. Nasr b. Munqidh 'Mukhlis al-Dawla' — father of the lords of Shayzar and forebear of Usama's house; the Banu Munqidh were honoured neighbours of Aleppo and Hama before they took Shayzar {cite:wafayat-ayan}."
