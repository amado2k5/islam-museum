id: person/muqallad-ibn-nasr-al-kinani
class: person
label: { ar: "مخلص الدولة الكناني", en: "Mukhlis al-Dawla al-Kinani", es: "Mukhlis al-Dawla al-Kinani", fr: "Mukhlis al-Dawla al-Kinani", ur: "مخلص الدولہ الکنانی" }
summary:
  ar: "أبو المتوج مقلد بن نصر بن منقذ الكناني، الملقب مخلص الدولة؛ والد الأمير صديق الدولة أبي الحسن علي صاحب قلعة شيزر، ومنه آل منقذ أصحاب شيزر؛ كان رجلاً نسيّ القدر مسيّر الذكر؛ وكان مع أهل بيته مقيمين بالقرب من قلعة شيزر يترددون إلى حلب وحماة، لهم الأنفس الكريمة والأملاك المثمنة، وملوك الشام يكرمونهم ويبجلون أقدارهم، وشعراء عصرهم يقصدونهم ويمدحونهم {cite:wafayat-ayan}."
  en: "Muqallad b. Nasr b. Munqidh 'Mukhlis al-Dawla' — father of the lords of Shayzar and forebear of Usama's house; the Banu Munqidh were honoured neighbours of Aleppo and Hama before they took Shayzar {cite:wafayat-ayan}."
  es: "Muqallad b. Nasr b. Munqidh 'Mukhlis al-Dawla' — padre de los señores de Shayzar y antepasado de la casa de Usama; los Banu Munqidh eran vecinos honrados de Alepo y Hama antes de que tomaran Shayzar {cite:wafayat-ayan}."
  fr: "Muqallad b. Nasr b. Munqidh 'Mukhlis al-Dawla' — père des seigneurs de Shayzar et ancêtre de la maison d'Usama; les Banu Munqidh étaient des voisins honorés d'Alep et de Hama avant de prendre Shayzar {cite:wafayat-ayan}."
  ur: "مقلد ب۔ نصر بی۔ منقید 'مخلص الدولہ' - شیزار کے رب کا باپ اور اسامہ کے گھر کے پیشوا؛ بنو منقّد حلب اور حما کے ہمسایہ تھے اس سے پہلے کہ انہوں نے شیزر کو لیا تھا۔"
  tr: "Ebu el-Mutawaj Muqallid ibn Nasr ibn Munqidh al-Kinani, lakabı Mukhlis al-Dawla; Prens Siddiq al-Dawla'nın babası, Şizar Kalesi'nin sahibi ve ondan Munqidh ailesi, Şizar'ın takipçileri, kaderi unutmuş ve hatırlanan bir adamdı; o ve ailesi, Şizar Kalesi yakınlarında yaşar, Halep ve Hama'ya asil ruhlar ve değerli mülklerle seyahat ederlerdi. Levant kralları kaderlerini onurlandırır ve saygı gösterir, dönemlerinin şairleri onları ziyaret edip övmüştür {atıf:wafayat-ayan}."
  id: "Abu al-Mutawaj Muqallid ibn Nasr ibn Munqidh al-Kinani, dijuluki Mukhlis al-Dawla; ayah dari Pangeran Siddiq al-Dawla Abu al-Hasan Ali, pemilik Benteng Shizar, dan dari keluarganya keluarga Munqidh, pengikut Shizar, adalah seorang pria yang telah melupakan takdir dan dikenang; ia dan keluarganya tinggal dekat Benteng Shizar, melakukan perjalanan ke Aleppo dan Hama, dengan jiwa-jiwa mulia dan harta berharga. Para raja Levant menghormati dan menghormati takdir mereka, dan para penyair pada zamannya mengunjungi dan memuji mereka {cite:wafayat-ayan}."
