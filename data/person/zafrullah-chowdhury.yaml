summary:
  ar: "طبيب وناشط صحي بنغلاديشي ⁦(27 ديسمبر 1941 – 11 أبريل 2023)⁩. شارك في حرب الاستقلال سنة 1971 وساعد في تشغيل المستشفى الميداني البنغلاديشي، ثم أسس سنة 1972 منظمة غونوشاستايا كندرا للصحة الريفية التي رادت تدريب النساء على الرعاية الصحية الأولية. كان القوة الدافعة وراء السياسة الوطنية للأدوية في بنغلاديش سنة 1982، ونال جائزة الاستقلال سنة 1977 وجائزة رامون ماغسيساي سنة 1985 وجائزة رايت ليفليهود سنة 1992."
  en: "Bangladeshi physician and public-health activist (27 December 1941 – 11 April 2023). A freedom fighter in the 1971 Liberation War, he helped run the Bangladesh Field Hospital and in 1972 founded Gonoshasthaya Kendra, the rural health organisation that pioneered training women as primary health workers. He was the driving force behind Bangladesh's 1982 National Drug Policy, and received the Independence Award in 1977, the Ramon Magsaysay Award in 1985 and the Right Livelihood Award in 1992."
  ur: "بنگلہ دیشی طبیب اور عوامی صحت کے کارکن ⁦(27 دسمبر 1941ء – 11 اپریل 2023ء)⁩۔ انھوں نے 1971ء کی جنگ آزادی میں حصہ لیا اور بنگلہ دیش فیلڈ ہسپتال چلانے میں مدد کی، پھر 1972ء میں گونوشاستھایا کیندر قائم کیا، جو دیہی صحت کی وہ تنظیم ہے جس نے خواتین کو بنیادی صحت کارکن کے طور پر تربیت دینے کی ابتدا کی۔ وہ 1982ء کی قومی ادویات پالیسی کے اصل محرک تھے اور انھیں 1977ء میں یوم آزادی ایوارڈ، 1985ء میں ریمن میگسیس ایوارڈ اور 1992ء میں رائٹ لائیولی ہڈ ایوارڈ ملا۔"
  es: "Médico bangladesí y activista de la salud pública (27 de diciembre de 1941 - 11 de abril de 2023). Combatiente por la libertad en la Guerra de Liberación de 1971, ayudó a dirigir el Hospital de Campaña de Bangladesh y en 1972 fundó Gonoshasthaya Kendra, la organización de salud rural pionera en la formación de mujeres como trabajadoras de atención primaria. Fue el principal impulsor de la Política Nacional de Medicamentos de Bangladesh de 1982 y recibió el Premio a la Independencia en 1977, el Premio Ramon Magsaysay en 1985 y el Premio Right Livelihood en 1992."
  fr: "Médecin et militant de la santé publique bangladais (27 décembre 1941 – 11 avril 2023). Combattant pour l'indépendance lors de la guerre de libération de 1971, il a contribué à la gestion de l'hôpital de campagne du Bangladesh et a fondé en 1972 le Gonoshasthaya Kendra, organisation de santé rurale pionnière dans la formation des femmes comme agentes de santé primaires. Il a joué un rôle déterminant dans l'élaboration de la politique nationale des médicaments du Bangladesh en 1982 et a reçu le prix de l'Indépendance en 1977, le prix Ramon Magsaysay en 1985 et le prix Right Livelihood en 1992."
  tr: "Bangladeşli doktor ve sağlık aktivisti (27 Aralık 1941 – 11 Nisan 2023). 1971'de Bağımsızlık Savaşı'na katıldı ve Bangladeş Sahra Hastanesi'nin işletilmesine yardımcı oldu, ardından 1972'de kadınları birincil sağlık hizmetlerinde eğitmeyi amaçlayan Gonushastaya Kendra Kırsal Sağlık Organizasyonu'nu kurdu. 1982'de Bangladeş'in ulusal ilaç politikasının itici gücü oldu; 1977'de Bağımsızlık Ödülü, 1985'te Ramon Magsaysay Ödülü ve 1992'de Right Livehood Ödülü'nü aldı."
  id: "Dokter dan aktivis kesehatan Bangladesh (27 Desember 1941 – 11 April 2023). Ia berpartisipasi dalam Perang Kemerdekaan pada tahun 1971 dan membantu mengoperasikan Rumah Sakit Lapangan Bangladesh, kemudian mendirikan Organisasi Kesehatan Pedesaan Gonushastaya Kendra pada tahun 1972, yang bertujuan melatih perempuan dalam layanan kesehatan primer. Ia menjadi kekuatan pendorong di balik kebijakan farmasi nasional Bangladesh pada tahun 1982, menerima Penghargaan Kemerdekaan pada tahun 1977, Penghargaan Ramon Magsaysay pada tahun 1985, dan Penghargaan Kehidupan Kanan pada tahun 1992."
