summary:
  ar: "طبيب وناشط صحي بنغلاديشي (27 ديسمبر 1941 – 11 أبريل 2023). شارك في حرب الاستقلال سنة 1971 وساعد في تشغيل المستشفى الميداني البنغلاديشي، ثم أسس سنة 1972 منظمة غونوشاستايا كندرا للصحة الريفية التي رادت تدريب النساء على الرعاية الصحية الأولية. كان القوة الدافعة وراء السياسة الوطنية للأدوية في بنغلاديش سنة 1982، ونال جائزة الاستقلال سنة 1977 وجائزة رامون ماغسيساي سنة 1985 وجائزة رايت ليفليهود سنة 1992."
  en: "Bangladeshi physician and public-health activist (27 December 1941 – 11 April 2023). A freedom fighter in the 1971 Liberation War, he helped run the Bangladesh Field Hospital and in 1972 founded Gonoshasthaya Kendra, the rural health organisation that pioneered training women as primary health workers. He was the driving force behind Bangladesh's 1982 National Drug Policy, and received the Independence Award in 1977, the Ramon Magsaysay Award in 1985 and the Right Livelihood Award in 1992."
  ur: "بنگلہ دیشی طبیب اور عوامی صحت کے کارکن (27 دسمبر 1941ء – 11 اپریل 2023ء)۔ انھوں نے 1971ء کی جنگ آزادی میں حصہ لیا اور بنگلہ دیش فیلڈ ہسپتال چلانے میں مدد کی، پھر 1972ء میں گونوشاستھایا کیندر قائم کیا، جو دیہی صحت کی وہ تنظیم ہے جس نے خواتین کو بنیادی صحت کارکن کے طور پر تربیت دینے کی ابتدا کی۔ وہ 1982ء کی قومی ادویات پالیسی کے اصل محرک تھے اور انھیں 1977ء میں یوم آزادی ایوارڈ، 1985ء میں ریمن میگسیس ایوارڈ اور 1992ء میں رائٹ لائیولی ہڈ ایوارڈ ملا۔"
