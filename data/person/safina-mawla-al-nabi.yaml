summary:
  ar: "سفينة مولى رسول الله، أبو عبد الرحمن؛ يروي الحاكم عنه أن اسمه كان قيساً فسماه النبي سفينة لأنه حمّله متاع أصحابه في سفر، وأن أم سلمة أعتقته واشترطت عليه أن يخدم النبي ما عاش، وخبر الأسد الذي أخرجه من أجمة بعد أن انكسرت به سفينته في البحر {cite:mustadrak-ilmiyya-ata-v3 p. 701-702}."
  en: "Safina, the Prophet's freedman, Abu 'Abd al-Rahman. Al-Hakim reports from him that his name had been Qays and the Prophet called him Safina ('ship') because he loaded his companions' baggage on him during a journey; that Umm Salama freed him on condition that he serve the Prophet for as long as he lived; and the story of the lion that led him out of a thicket after a shipwreck {cite:mustadrak-ilmiyya-ata-v3 p. 701-702}."
  ur: "سفینہ، نبی کے آزاد کردہ غلام، ابو عبد الرحمن۔ حاکم ان سے روایت کرتے ہیں کہ ان کا نام قیس تھا اور نبی نے ایک سفر میں اپنے اصحاب کا سامان ان پر لدوانے کی وجہ سے ان کا نام سفینہ ⁦(کشتی)⁩ رکھا؛ کہ ام سلمہ نے انہیں اس شرط پر آزاد کیا کہ وہ زندگی بھر نبی کی خدمت کریں؛ اور اس شیر کا واقعہ جو ایک سمندری حادثے کے بعد انہیں جھاڑی سے نکال لایا {cite:mustadrak-ilmiyya-ata-v3 p. 701-702}۔"
