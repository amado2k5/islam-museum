summary:
  ar: "لاعب اسكواش مصري محترف سابق، وُلد في القاهرة سنة 1987. بطل العالم ثلاث مرات (2008 و2012 و2014) وأول لاعب يفوز ببطولة العالم للناشئين مرتين، وصل إلى صدارة التصنيف العالمي في يناير 2010 واعتزل في أبريل 2019."
