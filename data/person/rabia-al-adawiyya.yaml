summary:
  ar: "رابعة بنت إسماعيل العدوية، صوفية كبيرة وعابدة شهيرة من أهل البصرة، استفتاها كبار المتصوفة في دقائق التصوف وكان سفيان الثوري يسميها «المؤدبة»، ويرى مصطفى عبد الرازق أنها السابقة إلى وضع قواعد الحب والحزن في التصوف الإسلامي؛ يذكر كحالة أنها توفيت سنة 135هـ ودفنت ببيت المقدس، وفي «النجوم الزاهرة» سنة 180هـ، وفي رواية 185هـ."
  en: "Rabi'a bint Isma'il al-Adawiyya, a great Sufi and famous devout woman of the Basran school, consulted by leading Sufis of her time on fine points of the path; Sufyan al-Thawri called her 'the teacher of manners', and Mustafa Abd al-Raziq held her the first to lay down the themes of love and sorrow in Islamic Sufism. Kahhala gives her death as 135 AH with burial in Jerusalem; al-Nujum al-Zahira gives 180 AH, and another report 185 AH."
