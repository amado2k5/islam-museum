summary:
  ar: "رابعة بنت إسماعيل العدوية، صوفية كبيرة وعابدة شهيرة من أهل البصرة، استفتاها كبار المتصوفة في دقائق التصوف وكان سفيان الثوري يسميها «المؤدبة»، ويرى مصطفى عبد الرازق أنها السابقة إلى وضع قواعد الحب والحزن في التصوف الإسلامي؛ يذكر كحالة أنها توفيت سنة 135هـ ودفنت ببيت المقدس، وفي «النجوم الزاهرة» سنة 180هـ، وفي رواية 185هـ."
  en: "Rabi'a bint Isma'il al-Adawiyya, a great Sufi and famous devout woman of the Basran school, consulted by leading Sufis of her time on fine points of the path; Sufyan al-Thawri called her 'the teacher of manners', and Mustafa Abd al-Raziq held her the first to lay down the themes of love and sorrow in Islamic Sufism. Kahhala gives her death as 135 AH with burial in Jerusalem; al-Nujum al-Zahira gives 180 AH, and another report 185 AH."
  es: "Rabi'a bint Isma'il al-Adawiyya, una gran sufí y reconocida devota de la escuela de Basora, fue consultada por destacados sufíes de su tiempo sobre los aspectos más sutiles del camino. Sufyan al-Thawri la llamó \"la maestra de las buenas maneras\", y Mustafa Abd al-Raziq la consideró la primera en establecer los temas del amor y el dolor en el sufismo islámico. Kahhala sitúa su muerte en el año 135 de la Hégira, con sepultura en Jerusalén; al-Nujum al-Zahira indica el año 180 de la Hégira, y otro informe también el año 185 de la Hégira."
  fr: "Rabi'a bint Isma'il al-Adawiyya, grande soufie et pieuse figure emblématique de l'école de Bassorah, était consultée par les plus éminents soufis de son temps sur les subtilités de la voie. Sufyan al-Thawri la surnommait « la maîtresse des bonnes manières », et Mustafa Abd al-Raziq la considérait comme la première à avoir exposé les thèmes de l'amour et du deuil dans le soufisme islamique. Kahhala situe sa mort en 135 AH, avec inhumation à Jérusalem; al-Nujum al-Zahira mentionne 180 AH, et une autre source 185 AH."
  ur: "ربیعہ بنت اسماعیل العدویہ، ایک عظیم صوفی اور بصران مکتبہ کی مشہور دیندار خاتون، اپنے زمانے کے معروف صوفیاء سے راہ کے عمدہ نکات پر مشورہ کرتی تھیں۔ سفیان الثوری نے انہیں 'آداب کی معلم' کہا، اور مصطفی عبدالرازق نے انہیں اسلامی تصوف میں محبت اور غم کے موضوعات کو سب سے پہلے پیش کیا۔ قہالہ نے اپنی وفات 135 ہجری کو یروشلم میں تدفین کے ساتھ بتائی۔ النجوم الظہرہ 180ھ اور دوسری روایت 185ھ بتاتی ہے۔"
  tr: "Rabia bint İsmail el-Adaviyye, büyük bir Sufi ve Basra'dan ünlü bir ibadet edendi. Önde gelen Sufiler tarafından tasavvufun incelikleri konusunda danışıldı ve Sufyan al-Thawri ona 'kibar olan' dedi. Mustafa Abdul Raziq, onun İslami Sufizmde sevgi ve keder kurallarını ilk koyan kişi olduğuna inanır; Kahhala, onun 135 Hicri'de öldüğünü ve Kudüs'te, 180 Hicri 'El-Nujum el-Zahira' ve 185 Hicri bir rivayetinde defnedildiğini belirtir."
  id: "Rabia bint Ismail al-Adawiyyah adalah seorang Sufi besar dan pemuja terkenal dari Basra. Ia dikonsultasikan oleh para Sufi terkemuka tentang seluk-beluk Sufisme, dan Sufyan al-Thawri menyebutnya 'yang sopan.' Mustafa Abdul Raziq percaya bahwa ia adalah yang pertama menetapkan aturan cinta dan duka dalam Sufisme Islam; Kahhala menyebutkan bahwa ia meninggal pada tahun 135 H dan dimakamkan di Yerusalem, di 'Al-Nujum al-Zahira' pada tahun 180 H, dan dalam satu narasi 185 H."
