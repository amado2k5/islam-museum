summary:
  ar: "الزغبي؛ قال في الكواكب: وكان شيخاً جليلاً كثير الكرامات والأحوال مشهوراً بالمجذوبية، صحبه الشيخ الوالد قُدّس سره وسُرّ بصحبته ومرافقته، وكان لا يزال متعبداً لا يتكلم إلا عند الضرورة؛ توفي في المستشفى [بالقاهرة] {cite:shadharat-dhahab p. 387}."
  en: "Al-Zughbi — a great shaykh 'famous for majdhubiyya, rich in miracles and states'; the author's father kept his company and delighted in it; ever-devout, speaking only at need; died at the Cairo bimaristan 978 {cite:shadharat-dhahab p. 387}."
  fr: "Al-Zughbi - un grand shaykh « célèbre pour majdhubiyya, riche en miracles et les États » ; le père de l'auteur a gardé sa compagnie et se réjouissait ; toujours avare, ne parlant qu'au besoin ; est mort au bimaristan du Caire 978 {cite:shadharat-dhahab p. 387}."
  es: "Al-Zughbi — un gran shaykh 'famoso por su majdhubiyya, rico en milagros y estados'; el padre del autor lo frecuentaba y se deleitaba con su compañía; siempre devoto, hablaba solo cuando era necesario; murió en el bimaristán de El Cairo en 978 {cite:shadharat-dhahab p. 387}."
  ur: "الزغبی - ایک عظیم شیخ 'مذہبی کے لیے مشہور، معجزات اور ریاستوں سے مالا مال'؛ مصنف کے والد نے اس کی صحبت رکھی اور اس میں خوش ہوئے۔ ہمیشہ متقی، صرف ضرورت کے وقت بولنا۔ قاہرہ بمرستان 978 میں وفات پائی۔ 387}۔"
  tr: "El-Zoghbi; El-Kavakib'de şöyle dedi: O, mucizelerle ve devletlerle dolu, Majdubiyyah'ı ile ünlü, saygın bir şeyhti. Ruhu kutsal olsun, bilge şeyh ona eşlik etti ve her zaman onun yanında ve arkadaşlığında oldu. Dindar kaldı ve sadece gerektiğinde konuştu; hastanede [Kahire'de] vefat etti {cite:shadharat-dhahab, s. 387}."
  id: "Al-Zoghbi; ia berkata dalam Al-Kawakib: Ia adalah seorang sheikh yang mulia penuh mukjizat dan kejayaan, terkenal karena Majdubiyyah-nya. Sheikh yang bijaksana, semoga jiwanya disucikan, menemaninya dan selalu berada di kebersamaan serta kebersamaannya. Ia tetap taat dan hanya berbicara ketika diperlukan; ia meninggal di rumah sakit [di Kairo] {cite:shadharat-dhahab, hlm. 387}."
