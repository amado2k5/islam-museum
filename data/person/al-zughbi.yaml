  ar: "الزغبي؛ قال في الكواكب: وكان شيخاً جليلاً كثير الكرامات والأحوال مشهوراً بالمجذوبية، صحبه الشيخ الوالد قُدّس سره وسُرّ بصحبته ومرافقته، وكان لا يزال متعبداً لا يتكلم إلا عند الضرورة؛ توفي في المستشفى [بالقاهرة] {cite:shadharat-dhahab p. 387}."
