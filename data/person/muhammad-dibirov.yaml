summary:
  ar: قارئ قرآن أذربيجاني؛ اشتهر بصوته الرنان وتلاواته المسجلة التي جالت القوقاز وما وراءه، ويُنسب إليه إحياء عادة تلاوة القرآن في المجتمع الأذربيجاني بعد الحقبة السوفياتية.
  en: Azerbaijani Qur'an reciter; celebrated for a resonant voice, his recordings circulated across the Caucasus and beyond, and he is credited with helping revive Qur'anic recitation in Azerbaijani society
    after the Soviet era.
  ur: آذربائیجانی قاری؛ گونجتی آواز کے لیے مشہور، اس کی ریکارڈنگز قفقاز اور اس سے باہر پھلیں، اور سوویت دور کے بعد آذربائیجانی معاشرے میں تلاوت کے احیاء کا سہرا اسے دیا جاتا ہے۔
  es: "Recitador azerbaiyano del Corán; célebre por su voz resonante, sus grabaciones circularon por todo el Cáucaso y más allá, y se le atribuye haber ayudado a revivir la recitación coránica en la sociedad azerbaiyana después de la era soviética."
  fr: "Récitation du Coran azerbaïdjanaise; célèbre pour sa voix profonde, ses enregistrements ont circulé dans tout le Caucase et au-delà, et on lui attribue le mérite d'avoir contribué à la renaissance de la récitation coranique dans la société azerbaïdjanaise après l'ère soviétique."
