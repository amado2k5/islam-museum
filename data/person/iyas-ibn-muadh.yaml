summary:
  en: "A young Awsite lad from Yathrib who came to Mecca in an alliance-seeking delegation before the battle of Bu'ath; when the Prophet presented Islam to the delegation, Iyas declared it better than their tribal cause, but was struck down by his leader Abu al-Haysar; he died shortly thereafter in Yathrib praising God."
  ar: "غلام حدث من الأوس قدم مكة في وفد يطلب الحلف ضد الخزرج قبل بعاث؛ فلما عرض النبي عليهم الإسلام قال إياس: هذا والله خير مما جئتم له، فزجره أبو الحيسر؛ ثم مات بيثرب وهو يهلل ويكبّر ويحمد الله."
  ur: "یثرب کا اوسی نوجوان جو بعاث کی جنگ سے پہلے اتحاد مانگنے والے وفد میں مکہ آیا؛ نبی نے پیش کیا تو وہ پہلا مسلمان ہوا۔"
  es: "Un joven awsita de Yathrib que llegó a La Meca en una delegación que buscaba alianzas antes de la batalla de Bu'ath; cuando el Profeta presentó el Islam a la delegación, Iyas declaró que era mejor que su causa tribal, pero fue asesinado por su líder Abu al-Haysar; murió poco después en Yathrib alabando a Dios."
  fr: "Un jeune garçon awsite de Yathrib venu à La Mecque dans une délégation en quête d'alliance avant la bataille de Bu'ath; lorsque le Prophète présenta l'Islam à la délégation, Iyas déclara qu'il était meilleur que leur cause tribale, mais fut abattu par son chef Abu al-Haysar; il mourut peu après à Yathrib en louant Dieu."
  tr: "Aws'tan genç bir adam, Baas öncesinde Hazraj'a karşı ittifak kurmak için bir heyetle Mekke'ye geldi; Peygamber onlara İslam'ı sunduğunda, Iyas şöyle dedi: Allah'a yemin ederim, bu sizin geldiğinizden daha iyidir. Ebu el-Haysar onu azarladı; sonra Yatrib'te Allah'ı yücelterek, yücelterek ve övgüyle öldü."
  id: "Seorang pemuda dari Aws datang ke Mekah dengan delegasi yang mencari aliansi melawan Khazraj di hadapan Ba'ath; ketika Nabi mempersembahkan Islam kepada mereka, Iyas berkata: Demi Allah, ini lebih baik daripada apa yang kalian datangkan. Abu al-Haysar menegurnya; kemudian dia meninggal di Yathrib sambil melantun, memuliakan, dan memuji Allah."
