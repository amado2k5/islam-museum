summary:
  en: "A young Awsite lad from Yathrib who came to Mecca in an alliance-seeking delegation before the battle of Bu'ath; when the Prophet presented Islam to the delegation, Iyas declared it better than their tribal cause, but was struck down by his leader Abu al-Haysar; he died shortly thereafter in Yathrib praising God."
  ar: "غلام حدث من الأوس قدم مكة في وفد يطلب الحلف ضد الخزرج قبل بعاث؛ فلما عرض النبي عليهم الإسلام قال إياس: هذا والله خير مما جئتم له، فزجره أبو الحيسر؛ ثم مات بيثرب وهو يهلل ويكبّر ويحمد الله."
