summary:
  ar: "منوّر قاري عبد الرشيدخانوف (1878–1931)، مربٍّ وكاتب أوزبكي من قادة الجديدية في تركستان، أسّس أول مدرسة بالطريقة الجديدة في طشقند سنة 1901 وألّف كتبًا دراسية وأصدر صحفًا، فقُبض عليه ونُفي سنة 1925 وأُعدم في موسكو سنة 1931."
  en: "Munawwar Qari Abdurashidkhanov (1878–1931) was an Uzbek educator and writer, a leader of Jadidism in Turkestan, who founded Tashkent's first new-method school in 1901, wrote textbooks and ran newspapers, was arrested and deported in 1925, and was shot in Moscow in 1931."
  ur: "منور قاری عبد الرشید خانوف (1878–1931) ازبک معلم اور مصنف، ترکستان میں جدیدیت کے رہنماؤں میں سے تھے؛ انہوں نے 1901 میں طشقند کا پہلا جدید طرز کا اسکول قائم کیا، درسی کتابیں لکھیں اور اخبارات نکالے، 1925 میں گرفتار اور جلاوطن ہوئے اور 1931 میں ماسکو میں گولی مار کر ہلاک کیے گئے۔"
