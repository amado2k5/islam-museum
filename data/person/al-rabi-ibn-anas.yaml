summary:
  ar: "الربيع بن أنس البكري البصري ثم الخراساني، مفسر من التابعين توفي سنة 139هـ؛ روى عن أبي العالية والحسن البصري، ونقل الطبري تفسيره في جامع البيان بإسناد عمار بن الحسن عن عبد الله بن أبي جعفر الرازي عن أبيه عنه."
  en: "Al-Rabi' ibn Anas al-Bakri of Basra, later of Khurasan, an exegete among the Successors who died in 139 AH; he transmitted from Abu al-Aliya and al-Hasan al-Basri, and al-Tabari quotes his commentary in Jami' al-Bayan through Ammar ibn al-Hasan, from Abd Allah ibn Abi Ja'far, from his father, from him."
  ur: "ربیع بن انس بکری بصری، بعد میں خراسانی، مفسر جن کی وفات 139ھ میں ہوئی؛ انہوں نے ابو العالیہ اور حسن بصری سے روایت کی، اور طبری جامع البیان میں ان کی تفسیر عمار بن حسن از عبد اللہ بن ابی جعفر از ان کے والد از ربیع کی سند سے نقل کرتے ہیں۔"
