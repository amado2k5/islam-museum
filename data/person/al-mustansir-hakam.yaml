label: { ar: "المستنصر بالله الحكم بن الناصر الأموي", en: "al-Mustansir bi'llah al-Hakam ibn al-Nasir al-Umawi", fr: "al-Mustansir bi'llah al-Hakam ibn al-Nasir al-Umawi", es: "al-Mustansir bi'llah al-Hakam ibn al-Nasir al-Umawi" }
summary:
  ar: "خليفة قرطبة الأموي ⁦(سنة ٣٥٠–٣٦٦هـ)⁩، الحكم بن الناصر لدين الله، مات سنة ست وستين وقام بعده ابنه المؤيد بالله هشام {cite:tarikh-khulafa-minhaj-1434 p. 628}. وكان محباً للعلوم مكرماً لأهلها جامعاً للكتب في أنواعها بما لم يجمعه أحد من الملوك قبله: عدد فهارس خزانة دار بني مروان أربع وأربعون فهرسة في كل فهرسة عشرون ورقة ليس فيها إلا أسماء الدواوين، وكان يبعث في الكتب إلى الأقطار رجالاً من التجار ويرسل إليهم الأموال لشرائها، وبعث في كتاب الأغاني إلى مصنفه أبي الفرج الأصفهاني بألف دينار فبعث إليه بنسخة قبل أن يخرجه إلى العراق، وجمع بداره الحذاق في صناعة النسخ والإجادة في التجليد، فاجتمعت بالأندلس خزائن لم تكن لأحد قبله ولا بعده حتى بيع أكثرها في حصار البربر {cite:nafh-tib-maqqari pp. 421–422}. وفتحت في أيامه قلعرة وشنته الشتيين وعاث قواده في بلاد البشكنس وبرشلونة وجليقية {cite:nafh-tib-maqqari p. 420}."
  en: "The Umayyad caliph of Cordoba al-Hakam al-Mustansir (AH 350–366): lover of learning who gathered books as no king before him — the palace library's catalogues alone ran to forty-four volumes of twenty folios each naming titles only; he sent book-buyers with gold to every land and a thousand dinars to Abu al-Faraj al-Isfahani for a pre-publication Aghani, kept guilds of copyists and binders, and the collection stood until it was sold and looted in the Berber siege {cite:nafh-tib-maqqari pp. 421–422}."
  fr: "Le calife omeyyade de Cordoue al-Hakam al-Mustansir (350 de l’hégire-366) : amoureux de l'apprentissage qui a rassemblé des livres comme aucun roi avant lui - les catalogues de la bibliothèque du palais seul courut à quarante-quatre volumes de vingt folios chacun nommant des titres seulement ; Il envoya des acheteurs de livres avec de l'or dans chaque pays et mille dinars à Abu al-Faraj al-Isfahani pour une pré-publication Aghani, gardé des guildes de copistes et de reliures, et la collection resta jusqu'à ce qu'elle soit vendue et pillée dans le siège berbère {cite:nafh-tib-maqqari pp. 421–422}."
  es: "El califa omeya de Córdoba, al-Hakam al-Mustansir (AH 350–366): amante del saber que reunió libros como ningún otro rey antes que él; los catálogos de la biblioteca del palacio, por sí solos, llegaban a cuarenta y cuatro volúmenes de veinte folios cada uno, que solo mencionaban los títulos; enviaba compradores de libros con oro a todas las tierras y mil dinares a Abu al-Faraj al-Isfahani para un Aghani previo a la publicación, mantenía gremios de copistas y encuadernadores, y la colección permaneció hasta que fue vendida y saqueada en el asedio bereber {cite:nafh-tib-maqqari pp. 421–422}."
