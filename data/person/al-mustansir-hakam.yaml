id: person/al-mustansir-hakam
class: person
label: { ar: "المستنصر بالله الحكم بن الناصر الأموي" }
summary:
  ar: "خليفة قرطبة الأموي (سنة ٣٥٠–٣٦٦هـ)، الحكم بن الناصر لدين الله، مات سنة ست وستين وقام بعده ابنه المؤيد بالله هشام {cite:tarikh-khulafa-minhaj-1434 p. 628}. وكان محباً للعلوم مكرماً لأهلها جامعاً للكتب في أنواعها بما لم يجمعه أحد من الملوك قبله: عدد فهارس خزانة دار بني مروان أربع وأربعون فهرسة في كل فهرسة عشرون ورقة ليس فيها إلا أسماء الدواوين، وكان يبعث في الكتب إلى الأقطار رجالاً من التجار ويرسل إليهم الأموال لشرائها، وبعث في كتاب الأغاني إلى مصنفه أبي الفرج الأصفهاني بألف دينار فبعث إليه بنسخة قبل أن يخرجه إلى العراق، وجمع بداره الحذاق في صناعة النسخ والإجادة في التجليد، فاجتمعت بالأندلس خزائن لم تكن لأحد قبله ولا بعده حتى بيع أكثرها في حصار البربر {cite:nafh-tib-maqqari pp. 421–422}. وفتحت في أيامه قلعرة وشنته الشتيين وعاث قواده في بلاد البشكنس وبرشلونة وجليقية {cite:nafh-tib-maqqari p. 420}."
  en: "The Umayyad caliph of Cordoba al-Hakam al-Mustansir (AH 350–366): lover of learning who gathered books as no king before him — the palace library's catalogues alone ran to forty-four volumes of twenty folios each naming titles only; he sent book-buyers with gold to every land and a thousand dinars to Abu al-Faraj al-Isfahani for a pre-publication Aghani, kept guilds of copyists and binders, and the collection stood until it was sold and looted in the Berber siege {cite:nafh-tib-maqqari pp. 421–422}."
