id: person/al-mustansir-hakam
class: person
label: { ar: "المستنصر بالله الحكم بن الناصر الأموي", en: "al-Mustansir bi'llah al-Hakam ibn al-Nasir al-Umawi", fr: "al-Mustansir bi'llah al-Hakam ibn al-Nasir al-Umawi", es: "al-Mustansir bi'llah al-Hakam ibn al-Nasir al-Umawi", ur: "المستنصر باللہ الحکم ابن الناصر العماوی" }
summary:
  ar: "خليفة قرطبة الأموي ⁦(سنة ٣٥٠–٣٦٦هـ)⁩، الحكم بن الناصر لدين الله، مات سنة ست وستين وقام بعده ابنه المؤيد بالله هشام {cite:tarikh-khulafa-minhaj-1434 p. 628}. وكان محباً للعلوم مكرماً لأهلها جامعاً للكتب في أنواعها بما لم يجمعه أحد من الملوك قبله: عدد فهارس خزانة دار بني مروان أربع وأربعون فهرسة في كل فهرسة عشرون ورقة ليس فيها إلا أسماء الدواوين، وكان يبعث في الكتب إلى الأقطار رجالاً من التجار ويرسل إليهم الأموال لشرائها، وبعث في كتاب الأغاني إلى مصنفه أبي الفرج الأصفهاني بألف دينار فبعث إليه بنسخة قبل أن يخرجه إلى العراق، وجمع بداره الحذاق في صناعة النسخ والإجادة في التجليد، فاجتمعت بالأندلس خزائن لم تكن لأحد قبله ولا بعده حتى بيع أكثرها في حصار البربر {cite:nafh-tib-maqqari pp. 421–422}. وفتحت في أيامه قلعرة وشنته الشتيين وعاث قواده في بلاد البشكنس وبرشلونة وجليقية {cite:nafh-tib-maqqari p. 420}."
  en: "The Umayyad caliph of Cordoba al-Hakam al-Mustansir (AH 350–366): lover of learning who gathered books as no king before him — the palace library's catalogues alone ran to forty-four volumes of twenty folios each naming titles only; he sent book-buyers with gold to every land and a thousand dinars to Abu al-Faraj al-Isfahani for a pre-publication Aghani, kept guilds of copyists and binders, and the collection stood until it was sold and looted in the Berber siege {cite:nafh-tib-maqqari pp. 421–422}."
  fr: "Le calife omeyyade de Cordoue al-Hakam al-Mustansir (350 de l’hégire-366) : amoureux de l'apprentissage qui a rassemblé des livres comme aucun roi avant lui - les catalogues de la bibliothèque du palais seul courut à quarante-quatre volumes de vingt folios chacun nommant des titres seulement ; Il envoya des acheteurs de livres avec de l'or dans chaque pays et mille dinars à Abu al-Faraj al-Isfahani pour une pré-publication Aghani, gardé des guildes de copistes et de reliures, et la collection resta jusqu'à ce qu'elle soit vendue et pillée dans le siège berbère {cite:nafh-tib-maqqari pp. 421–422}."
  es: "El califa omeya de Córdoba, al-Hakam al-Mustansir (AH 350–366): amante del saber que reunió libros como ningún otro rey antes que él; los catálogos de la biblioteca del palacio, por sí solos, llegaban a cuarenta y cuatro volúmenes de veinte folios cada uno, que solo mencionaban los títulos; enviaba compradores de libros con oro a todas las tierras y mil dinares a Abu al-Faraj al-Isfahani para un Aghani previo a la publicación, mantenía gremios de copistas y encuadernadores, y la colección permaneció hasta que fue vendida y saqueada en el asedio bereber {cite:nafh-tib-maqqari pp. 421–422}."
  ur: "قرطبہ الحکم المستنصر کا اموی خلیفہ (350-366): علم کا شوقین جس نے کتابیں اکٹھی کیں جیسا کہ اس سے پہلے کوئی بادشاہ نہیں تھا - محل کے کتب خانے کے کیٹلاگ میں صرف 20 فولیو کی 44 جلدیں تھیں جن میں سے ہر ایک کو صرف نام دیا گیا تھا۔ اس نے کتاب خریداروں کو ہر زمین پر سونا اور ایک ہزار دینار ابو الفراج اصفہانی کو قبل از اشاعت آغاخانی کے لیے بھیجے، نقل کرنے والوں اور باندنے والوں کی جماعتیں رکھی اور یہ ذخیرہ بربر کے محاصرے میں فروخت اور لوٹنے تک قائم رہا۔"
  tr: "Cordoba Emevi Halifesi (350–366 H) el-Hakam ibn el-Nasır li-Din Allah, altmış altıncı yılında vefat etti ve yerine oğlu el-Mueyyad Billah Hişam geçti {atıf:Tarih-Khulafa-minhaj-1434, s. 628}. Bilimlere düşkündü, halkını onurlandırdı ve her türlü kitabı daha önceki hiçbir kralın toplamadığı şekilde topladı: Banu Mervan Hanedanı'nın hazinesinin katalogları kırk dört adetliydi, her katalogda yirmi sayfa vardı ve sadece diwanların isimleri yer alıyordu. Tüccarları çeşitli ülkelere kitap için gönderdi ve onları satın almaları için para gönderdi. 'El-Ağani' kitabının bir kopyasını yazarı Ebu el-Faraj el-İsfahani'ye bin dinara gönderdi, o da Irak'a göndermeden önce bir kopyasını gönderdi. El yazması ustalığı ve ciltleme ustalığı konusunda yetenekli yazarlar topladı. Böylece, Berberi kuşatması sırasında satılana kadar kendisinden önce ya da sonra kimsenin sahip olmadığı hazineler Endülüs'te birikti {cite:nafh-tib-maqqari, s. 421–422}. Onun döneminde bir kale açıldı, kışlar onu bir kenara bıraktı ve liderleri Basklar, Barselona ve Galiçya topraklarını yağmaladı {cite:nafh-tib-maqqari, s. 420}."
  id: "Khalifah Umayyah dari Cordoba (350–366 H), al-Hakam ibn al-Nasir li-Din Allah, wafat pada tahun enam puluh enam, dan digantikan oleh putranya al-Mu'ayyad Billah Hisham {cite:History-Khulafa-minhaj-1434, hlm. 628}. Ia adalah pecinta ilmu pengetahuan, menghormati rakyatnya, dan mengumpulkan berbagai jenis buku dengan cara yang belum pernah dikumpulkan oleh raja sebelumnya: katalog perbendaharaan Wangsa Banu Marwan berjumlah empat puluh empat, setiap katalog berisi dua puluh halaman, hanya berisi nama-nama para diwan. Ia mengirim pedagang ke berbagai negara untuk membeli buku dan mengirimkan uang untuk membelinya. Ia mengirimkan salinan buku 'Al-Aghani' kepada penulisnya Abu al-Faraj al-Isfahani seharga seribu dinar, yang mengirimkan salinannya sebelum mengirimkannya ke Irak. Ia mengumpulkan penulis terampil dalam keahlian manuskrip dan penguasaan penjilidan. Dengan demikian, harta karun terkumpul di al-Andalus yang tidak dimiliki siapa pun sebelum atau sesudahnya, hingga sebagian besar dijual selama pengepungan Berber {cite:nafh-tib-maqqari, hlm. 421–422}. Pada masa kehidupannya, sebuah kastil dibuka, musim dingin menyingkirkannya, dan para pemimpinnya merusak wilayah Basque, Barcelona, dan Galicia {cite:nafh-tib-maqqari, hlm. 420}."
