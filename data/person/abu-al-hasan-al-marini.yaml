id: person/abu-al-hasan-al-marini
class: person
label: { ar: "أبو الحسن المريني سلطان المغرب" }
summary:
  ar: "أبو الحسن علي بن عثمان المريني سلطان المغرب الذي لقب نفسه أمير المسلمين وسلطان البرين وحامي العدوتين؛ كتب بخطه ثلاثة مصاحف شريفة وأرسلها إلى المساجد الثلاثة التي تشد إليها الرحال وأوقف عليها أوقافاً جليلة، وكتب توقيعه لسلطان مصر والشام بمسامحتها من إنشاء جمال الدين ابن نباتة المصري، وأرسل معها للملك الناصر بن قلاوون من أحجار الياقوت العظيم القدر والثمن ثلاثمائة وخمسة وعشرين ومن الزمرد مائة وثمانية وعشرين ومن الزبرجد مائة وثمانية وعشرين، وقد رأى المقري أحد المصاحف المذكورة وهو الذي ببيت المقدس وروعته في غاية الصنعة {cite:nafh-tib-maqqari p. 403-404}. وقال بعض المشارقة فيه: ملك أضاء المغرب بأنوار هلاله وجرت إلى المشرق أنواء نواله، كان حسن الكتابة كثير الإنابة ذا بلاغة وبراعة وشهامة وشجاعة، وأقام في الملك عشر سنين وسبعة أيام ثم صرف بولده أبي عنان بعد حروب يطول شرحها {cite:nafh-tib-maqqari p. 404}."
  en: "Abu al-Hasan Ali ibn Uthman al-Marini, sultan of the Maghreb, who styled himself amir al-mu'minin, 'sultan of the two shores, guardian of both banks'; he copied three noble mushafs in his own hand for the three mosques to which journeys are made, endowed waqfs on them whose titulature the great chancery writer Ibn Nubata composed, and sent al-Nasir Muhammad 325 great rubies, 128 emeralds and 128 zabarjads — al-Maqqari himself saw the Jerusalem copy in finest workmanship; he ruled ten years and seven days before his son Abu Inan deposed him {cite:nafh-tib-maqqari p. 403-404}."
