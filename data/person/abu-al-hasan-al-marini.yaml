id: person/abu-al-hasan-al-marini
class: person
label: { ar: "أبو الحسن المريني سلطان المغرب", en: "Abu al-Hasan al-Marini, sultan of the Maghrib" , ur: "ابو الحسن علی بن عثمان مرینی", fr: "Abu al-Hasan al-Marini, sultan du Maghreb", es: "Abu al-Hasan al-Marini, sultan of the Maghrib" }
summary:
  ar: "أبو الحسن علي بن عثمان المريني سلطان المغرب الذي لقب نفسه أمير المسلمين وسلطان البرين وحامي العدوتين؛ كتب بخطه ثلاثة مصاحف شريفة وأرسلها إلى المساجد الثلاثة التي تشد إليها الرحال وأوقف عليها أوقافاً جليلة، وكتب توقيعه لسلطان مصر والشام بمسامحتها من إنشاء جمال الدين ابن نباتة المصري، وأرسل معها للملك الناصر بن قلاوون من أحجار الياقوت العظيم القدر والثمن ثلاثمائة وخمسة وعشرين ومن الزمرد مائة وثمانية وعشرين ومن الزبرجد مائة وثمانية وعشرين، وقد رأى المقري أحد المصاحف المذكورة وهو الذي ببيت المقدس وروعته في غاية الصنعة {cite:nafh-tib-maqqari p. 403-404}. وقال بعض المشارقة فيه: ملك أضاء المغرب بأنوار هلاله وجرت إلى المشرق أنواء نواله، كان حسن الكتابة كثير الإنابة ذا بلاغة وبراعة وشهامة وشجاعة، وأقام في الملك عشر سنين وسبعة أيام ثم صرف بولده أبي عنان بعد حروب يطول شرحها {cite:nafh-tib-maqqari p. 404}."
  en: "Abu al-Hasan Ali ibn Uthman al-Marini, sultan of the Maghreb, who styled himself amir al-mu'minin, 'sultan of the two shores, guardian of both banks'; he copied three noble mushafs in his own hand for the three mosques to which journeys are made, endowed waqfs on them whose titulature the great chancery writer Ibn Nubata composed, and sent al-Nasir Muhammad 325 great rubies, 128 emeralds and 128 zabarjads — al-Maqqari himself saw the Jerusalem copy in finest workmanship; he ruled ten years and seven days before his son Abu Inan deposed him {cite:nafh-tib-maqqari p. 403-404}."
  ur: "مغرب کے مرینی سلطان؛ ماخذ ان کے لکھے ہوئے مصاحف، تین مساجد کے لیے اوقاف، سفارتی تحائف اور ان کے بیٹے ابو عنان کے ہاتھوں معزولی کا ذکر کرتے ہیں۔ {cite:nafh-tib-maqqari}"
  fr: "Abu al-Hasan Ali ibn Uthman al-Marini, sultan du Maghreb, qui se faisait appeler commandeur des croyants, « sultan des deux rives, gardien des deux bords » ; il copia de sa main trois nobles mushafs pour les trois mosquées vers lesquelles on voyage, constitua sur eux des waqfs dont le grand rédacteur de chancellerie Ibn Nubata composa la titulature, et envoya à al-Nasir Muhammad 325 grands rubis, 128 émeraudes et 128 péridots — al-Maqqari lui-même vit l'exemplaire de Jérusalem, d'un travail des plus fins ; il régna dix ans et sept jours avant que son fils Abu Inan ne le dépose {cite:nafh-tib-maqqari p. 403-404}."
  es: "Abu al-Hasan Ali ibn Uthman al-Marini, sultán del Magreb, que se autodenominó amir al-mu'minin, 'sultán de las dos orillas, guardián de ambas riberas'; copió tres magníficos mushafs de su puño y letra para las tres mezquitas a las que se realizan peregrinaciones, les otorgó waqfs cuya titulación compuso el gran escritor de la cancillería Ibn Nubata, y envió a al-Nasir Muhammad 325 grandes rubíes, 128 esmeraldas y 128 zabarjads; el propio al-Maqqari vio la copia de Jerusalén en la más fina artesanía; gobernó diez años y siete días antes de que su hijo Abu Inan lo depusiera {cite:nafh-tib-maqqari p. 403-404}."
