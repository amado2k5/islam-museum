id: person/dhu-l-kifl
education:
  did_you_know:
    ar: "ذو الكفل مذكور في القرآن ضمن الصابرين وضمن الأخيار؛ عدّه ابن كثير ضمن الأنبياء، وذكر الثعلبي أنه بشر بن أيوب."
    en: "Dhu al-Kifl is named in the Qur'an among the patient and among the righteous; Ibn Kathir counts him among the prophets, and al-Tha'labi makes him Bishr son of Ayyub."
    ur: "ذوالکفل قرآن میں صابرین اور نیکوکاروں میں مذکور ہیں؛ ابن کثیر انہیں انبیا میں گنتے ہیں اور ثعلبی کے مطابق وہ بشر بن ایوب ہیں۔"
    sources: [source/tafsir-ibn-kathir, source/qisas-anbiya-thaalabi-edition]
