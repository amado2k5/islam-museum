summary:
  ar: "ذو الكفل، مذكور في القرآن ضمن الصابرين وضمن «الأخيار»؛ عده ابن كثير في المفسرين ضمن الأنبياء {cite:tafsir-ibn-kathir}، وذكر الثعلبي أنه بشر بن أيوب، نبي بعث بعد أبيه إلى أرض الروم، وأنه أقام بالشام حتى مات عن خمس وتسعين سنة {cite:qisas-anbiya-thaalabi-edition}."
  en: "Dhu'l-Kifl, named in the Qur'an among the patient and among 'the righteous'; Ibn Kathir counts him among the prophets in the commentators' view {cite:tafsir-ibn-kathir}, and al-Tha'labi names him Bishr ibn Ayyub, a prophet sent after his father to the land of the Romans, who dwelt in Syria until he died aged ninety-five {cite:qisas-anbiya-thaalabi-edition}."
  es: "Dhu'l-Kifl, nombrado en el Corán entre los pacientes y entre los \"justos\"; Ibn Kathir lo cuenta entre los profetas en la opinión de los comentaristas {cite:tafsir-ibn-kathir}, y al-Tha'labi lo nombra Bishr ibn Ayyub, un profeta enviado después de su padre a la tierra de los romanos, que habitó en Siria hasta que murió a los noventa y cinco años {cite:qisas-anbiya-thaalabi-edition}."
  fr: "Dhu'l-Kifl, cité dans le Coran parmi les patients et parmi les vertueux; Ibn Kathir le compte parmi les prophètes selon l'avis des commentateurs {cite:tafsir-ibn-kathir}, et al-Tha'labi le nomme Bishr ibn Ayyub, un prophète envoyé après son père au pays des Romains, qui vécut en Syrie jusqu'à sa mort à l'âge de quatre-vingt-quinze ans {cite:qisas-anbiya-thaalabi-edition}."
  ur: "ذوالکفل جس کا نام قرآن میں مریض اور نیک لوگوں میں رکھا گیا ہے۔ ابن کثیر نے اسے مفسرین کے نزدیک انبیاء میں شمار کیا ہے اور الثعلبی نے ان کا نام بشر بن ایوب رکھا ہے، جو ان کے والد کے بعد رومیوں کی سرزمین پر بھیجا گیا تھا، جو شام میں مقیم رہے یہاں تک کہ وہ پچانوے سال کی عمر میں فوت ہو گئے۔"
