  ur: ذوالکفل
gender: male
summary:
  ar: "ذو الكفل، مذكور في القرآن ضمن الصابرين وضمن «الأخيار»؛ عده ابن كثير في المفسرين ضمن الأنبياء {cite:tafsir-ibn-kathir}، وذكر الثعلبي أنه بشر بن أيوب، نبي بعث بعد أبيه إلى أرض الروم، وأنه أقام بالشام حتى مات عن خمس وتسعين سنة {cite:qisas-anbiya-thaalabi-edition}."
  en: "Dhu'l-Kifl, named in the Qur'an among the patient and among 'the righteous'; Ibn Kathir counts him among the prophets in the commentators' view {cite:tafsir-ibn-kathir}, and al-Tha'labi names him Bishr ibn Ayyub, a prophet sent after his father to the land of the Romans, who dwelt in Syria until he died aged ninety-five {cite:qisas-anbiya-thaalabi-edition}."
