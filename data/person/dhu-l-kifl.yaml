perspectives:
- tradition: sunni
  id: classical-tafsir
  stance:
    ar: نبي عند الجمهور من المفسرين، وقيل رجل صالح كفل بالقضاء
    en: A prophet to the majority of commentators; some say a righteous man who undertook judgment
  summary:
    ar: "يذكر ابن كثير ذا الكفل في أصحاب الأخيار مع إسماعيل واليسع ويونس ولوط، ويعده المفسرون عنده في الأنبياء {cite:tafsir-ibn-kathir}؛ ويروي الثعلبي عن بعضهم أنه بشر بن أيوب بُعث رسولًا إلى أرض الروم بعد أبيه، وأنه أقام بالشام حتى مات عن خمس وتسعين سنة {cite:qisas-anbiya-thaalabi-edition}."
    en: "Ibn Kathir lists Dhu'l-Kifl among 'the righteous' with Ismail, al-Yasa', Yunus and Lut, counting him among the prophets in the commentators' reading {cite:tafsir-ibn-kathir}; al-Tha'labi reports some hold him to be Bishr son of Ayyub, sent as messenger to the Romans' land after his father, dwelling in Syria until he died aged ninety-five {cite:qisas-anbiya-thaalabi-edition}."
  sources: [source/tafsir-ibn-kathir, source/qisas-anbiya-thaalabi-edition]
