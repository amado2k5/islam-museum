summary:
  ar: "شاعرة ومؤرخة كردية (1805–1847/1848) عُرفت بلقب مستوره، مؤلفة «تاريخ الأردلانيين» وديوان شعر ورسالة في العقائد والشرعيات، وتُعدّ أول مؤرخة في إيران."
  en: "Kurdish poet and historian (1805-1847/48), known by her pen name Mastoureh; author of the Chronicle of the House of Ardalan, a Divan of some 2,000 surviving verses, and a treatise on belief and religious law - counted the first woman historian of Iran."
