    note: "The sources conflict, so no school is recorded. Wikidata's only religion value is the generic Islam (Q432) and names no school; English Wikipedia makes no statement of her religion. Persian Wikipedia describes her own creed treatise (Aqa'id-i Mastoureh, the Shar'iyyat) as written in the Sunni Shafi'i school - a personal attestation drawn from her own work - but a peer-reviewed Iranian literary study (A. Radfar, Didactic Literature Review, 2010) calls her a Shiite poet whose verse mourns Imam Husayn and praises the Imams. Two independent traditions point to different affiliations and neither is corroborated; the doubt rule applies: unclassified, with both readings preserved here."
