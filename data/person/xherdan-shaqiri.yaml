summary:
  ar: "لاعب كرة قدم سويسري من أصل ألباني كوسوفي، وُلد في جيلان سنة 1991 وهاجر طفلًا إلى سويسرا؛ جناح بدأ مع بازل وفاز معه بثلاثة ألقاب في الدوري السويسري، ثم لعب لبايرن ميونيخ وإنتر ميلان وستوك سيتي، وفاز مع ليفربول بدوري أبطال أوروبا (2019) والدوري الإنجليزي (2020)، وعاد إلى بازل سنة 2024. دولي سويسري خاض 125 مباراة وسجل 32 هدفًا ومثّل بلاده في أربع بطولات لكأس العالم."
  en: "Swiss professional footballer of Kosovar Albanian descent, born in Gjilan in 1991 and brought to Switzerland as a child. A winger who rose through Basel, winning three Swiss Super League titles, then played for Bayern Munich, Inter Milan and Stoke City, and won the UEFA Champions League (2019) and the Premier League (2020) with Liverpool, before returning to Basel in 2024. A Switzerland international from 2010 to 2024, he earned 125 caps and scored 32 goals, representing his country at four FIFA World Cups."
  ur: "کوسوو کے البانوی نژاد سوئس پیشہ ور فٹبالر، 1991 میں گیلان میں پیدا ہوئے اور بچپن میں سوئٹزرلینڈ آئے؛ ونگر جنہوں نے بازل سے ابھر کر تین سوئس سپر لیگ خطاب جیتے، پھر بائرن میونخ، انٹر میلان اور سٹوک سٹی کے لیے کھیلے، اور لیورپول کے ساتھ 2019 میں یوئیفا چیمپئنز لیگ اور 2020 میں پریمیئر لیگ جیتی، اور 2024 میں بازل واپس آئے۔ 2010 سے 2024 تک سوئٹزرلینڈ کے بین الاقوامی کھلاڑی رہے، 125 میچوں میں 32 گول کیے اور چار فیفا ورلڈ کپ کھیلے۔"
