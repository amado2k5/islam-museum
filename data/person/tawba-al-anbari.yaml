summary:
  ar: "توبة بن أبي الأسد كيسان العنبري البصري، أبو المورع، أحد الولاة ومن رجال الحديث، أصله من سجستان ومولده ومنشؤه باليمامة ثم تحول إلى البصرة، وهو مولى أيوب بن أزهر، ولاه يوسف بن عمر سابور ثم الأهواز، ومات في الطاعون؛ ٥٧ إلى ١٣١هـ الموافقة ٦٧٧ إلى ٧٤٨م."
  en: "Tawba ibn Abi al-Asad Kaysan al-Anbari al-Basri, Abu al-Muwarri', a governor and a man of hadith, of Sijistani origin, born and raised in al-Yamama before moving to Basra; a client of Ayyub ibn Azhar, appointed by Yusuf ibn Umar over Sabur and then al-Ahwaz, he died in the plague. 57 to 131 AH, 677 to 748 CE."
