summary:
  ar: "شيبان الحروري، زعيم قوة الخوارج الحرورية في خراسان إبان الثورة العباسية؛ تعاون أبو مسلم معه للإطاحة بالأمويين إلى جانب جديع الكرماني وابنه علي، ثم تخلص أبو مسلم منه آخر الأمر في تصفية زعماء القوى المتنافسة التي أفضت به إلى التفرد بحكم خراسان {cite:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
  en: "Shayban al-Haruri — the Haruri Khariji chief whom Abu Muslim used against the Umayyads and then eliminated {cite:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
  es: "Shayban al-Haruri, el jefe Haruri Khariji a quien Abu Muslim usó contra los omeyas y luego eliminó {citar:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
  fr: "Shayban al-Haruri — le chef Haruri Khariji qu'Abu Muslim a utilisé contre les Omeyyades puis éliminé {cite:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
  ur: "شیبان الحروری - حروری خارجی سردار جسے ابو مسلم نے امویوں کے خلاف استعمال کیا اور پھر ختم کر دیا 24-25}۔"
  tr: "Abbasi devrimi sırasında Horasan'daki Harici gücünün lideri Şeyban el-Haruri, Ebu Müslim ile birlikte Cedi' el-Kirmani ve oğlu Ali ile birlikte Emevilileri devirmek için iş birliği yaptı. Sonunda, Ebu Müslim, Horasan'ın yönetimini tekelleştiren rakip güçleri ortadan kaldırarak onu ortadan kaldırdı {cite:history-dawla-abbasiyya-taqqush s. 24-25}."
  id: "Shayban al-Haruri, pemimpin kekuatan Kharij di Khorasan selama revolusi Abbasiyah, bekerja sama dengan Abu Muslim untuk menggulingkan Umayyah bersama Jadi' al-Kirmani dan putranya Ali. Akhirnya, Abu Muslim mengeliminasinya dengan menyingkirkan kekuatan saingan yang membuatnya memonopoli pemerintahan Khorasan {cite:history-dawla-abbasiyya-taqqush hlm. 24-25}."
