summary:
  ar: "عبد الله بن عبيد الله بن أبي مليكة التميمي المكي، تابعي ثقة كثير الحديث، كان إمام الحرم ومؤذنه الأمين، أدرك نحو ثلاثين من الصحابة، وولاه ابن الزبير قضاء الطائف. توفي سنة 117 وقيل 118هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2047}"
  en: "Abd Allah ibn Ubayd Allah ibn Abi Mulayka al-Tamimi al-Makki, a trustworthy follower of the Companions and a prolific transmitter of hadith. He was imam and trusted muezzin of the sanctuary, met about thirty Companions, and was appointed judge of al-Ta'if by Ibn al-Zubayr. He died in 117 or 118 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2047}"
  fr: "Abd Allah ibn Ubayd Allah ibn Abi Mulayka al-Tamimi al-Makki, Suivant digne de confiance et transmetteur prolifique de hadith. Il fut imam et muezzin de confiance du sanctuaire, rencontra une trentaine de Compagnons, et fut nommé cadi de Ta'if par Ibn al-Zubayr. Il mourut en 117 ou 118 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2047}"
  es: "Abd Allah ibn Ubayd Allah ibn Abi Mulayka al-Tamimi al-Makki, un fiel seguidor de los Compañeros y prolífico transmisor de hadices. Fue imán y muecín de confianza del santuario, conoció a unos treinta Compañeros y fue nombrado juez de al-Ta'if por Ibn al-Zubayr. Falleció en el año 117 o 118 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2047}"
  ur: "عبد اللہ بن عبید اللہ ابن ابی ملیکہ التمیمی المکی، صحابہ کرام کے ثقہ پیروکار اور حدیث کا بہت زیادہ ٹرانسمیٹر۔ وہ حرم کے امام اور معتمد مؤذن تھے، تقریباً تیس صحابہ سے ملے، اور ابن الزبیر نے انہیں الطائف کا قاضی مقرر کیا۔ ان کی وفات 117 یا 118 ہجری میں ہوئی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2047}"
  tr: "Abdullah ibn Ubeydullah ibn Abi Malikah el-Tamimi el-Mekki, Sahabelerin güvenilir bir takipçisi ve hadis rivayetinde oldukça üretken bir kişiydi. Haram'da (Mekke'deki Kutsal Mescid) imam ve müezzin olarak görev yaptı. Peygamberin yaklaşık otuz Sahabesiyle görüştü ve İbn el-Zübeyr onu Taif'e kadı olarak atadı. Hicri 117 yılında, bazı kaynaklara göre ise 118 yılında vefat etti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2047}"
  id: "Abdullah ibn Ubaydullah ibn Abi Malikah al-Tamimi al-Makki, seorang pengikut setia para Sahabat, adalah perawi hadits yang produktif. Ia menjabat sebagai imam dan muazin di Haram (Masjid Suci di Mekah). Ia bertemu dengan sekitar tiga puluh Sahabat Nabi, dan Ibnu al-Zubayr mengangkatnya sebagai hakim di Ta'if. Ia wafat pada tahun 117 H, atau menurut beberapa pendapat tahun 118 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2047}"
