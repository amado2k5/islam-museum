summary:
  ar: "عبد الله بن عبيد الله بن أبي مليكة التميمي المكي، تابعي ثقة كثير الحديث، كان إمام الحرم ومؤذنه الأمين، أدرك نحو ثلاثين من الصحابة، وولاه ابن الزبير قضاء الطائف. توفي سنة 117 وقيل 118هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2047}"
  en: "Abd Allah ibn Ubayd Allah ibn Abi Mulayka al-Tamimi al-Makki, a trustworthy follower of the Companions and a prolific transmitter of hadith. He was imam and trusted muezzin of the sanctuary, met about thirty Companions, and was appointed judge of al-Ta'if by Ibn al-Zubayr. He died in 117 or 118 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2047}"
