summary:
  ar: "بطاقة أولية لماه فيروز سلطان، الحسكة سلطان في عهد أحمد الأول، وردت في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمتها في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Mahfiruz Hatice Sultan, haseki sultan in the reign of Ahmed I, named from an open reference description (Wikidata); her entry in al-Salabi's history of the Ottoman state is not yet checked on the page, so no dates are given."
  es: "Ficha preliminar de Mahfiruz Hatice Sultan, sultana haseki durante el reinado de Ahmed I, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de candidature de Mahfiruz Hatice Sultan, sultane haseki sous le règne d'Ahmed Ier, nommée d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "احمد اول کے دور حکومت میں مہفیروز حاتس سلطان، حسکی سلطان کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے لیا گیا؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Ahmed I döneminde Mah Fairuz Sultan, Hasakah Sultan'ın ön kartı açık bir referans açıklamasında (Wikidata) bahsedilmiştir. Al-Sallabinin 'Osmanlı İmparatorluğu Tarihi'ndeki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan Mah Fairuz Sultan, Hasakah Sultan pada masa pemerintahan Ahmed I, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam 'Sejarah Kekaisaran Ottoman' oleh Al-Sallabi belum ditinjau di halaman tersebut, sehingga tanggal-tanggal tidak disebutkan di sini."
