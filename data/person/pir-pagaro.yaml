summary:
  ar: "صبغت الله شاه الراشدي الثاني (1910–1943)، پير پگارو السادس، الزعيم الروحي الوراثي لجماعة الحُرّ في السند. خلف أباه في المقام وهو في نحو الثانية عشرة، وأيّد وحدة الهندوس والمسلمين واستقلال الهند، وأمر أتباعه المسلحين بحماية الهندوس في أحداث منزلكاه، فأعدمته الحكومة الاستعمارية شنقا في سجن حيدرآباد المركزي في 20 مارس 1943 وظل موضع دفنه مجهولا."
  en: "Sibghatullah Shah Rashdi II (1910–1943), the sixth Pir Pagaro, hereditary spiritual leader of the Hur community in Sindh. He succeeded his father to the seat at about the age of twelve, championed Hindu-Muslim unity and Indian independence, and ordered his armed followers to protect Hindus during the Manzilgah riots; the colonial government hanged him in Hyderabad Central Jail on 20 March 1943, and his burial place remains unknown."
  ur: "صبغت اللہ شاہ راشدی دوم (1910ء–1943ء)، چھٹے پیر پگارو، سندھ کی حُر جماعت کے موروثی روحانی پیشوا۔ وہ تقریباً بارہ برس کی عمر میں والد کے جانشین بنے، ہندو مسلم اتحاد اور ہندوستان کی آزادی کی حمایت کی، اور منزل گاہ فسادات میں اپنے مسلح مریدوں کو ہندوؤں کی حفاظت کا حکم دیا؛ استعماری حکومت نے 20 مارچ 1943ء کو حیدرآباد کی مرکزی جیل میں انھیں پھانسی دی اور ان کی تدفین کی جگہ نامعلوم رہی۔"
