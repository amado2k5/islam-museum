summary:
  ar: "كاتب وناشط قومي بلوشي (1908 – 31 مايو 1935) من جهل مگسي: مقالته «فرياد بلوشستان» سنة 1929 كلّفته سنة من الحبس الانفرادي، فصار رئيس «أنجمن اتحاد البلوش وبلوشستان»، وعقد مؤتمري البلوش لعموم الهند في جيكب آباد (1932) وحيدر آباد (1933)، وصار رئيس قبيلة المگسي، وتوفي في زلزال كويته سنة 1935 عن سبعة وعشرين عاما."
  en: "Baloch nationalist writer and activist (1908 – 31 May 1935) from Jhal Magsi: his 1929 article 'Balochistan's Lament' earned him a year of solitary confinement; he became president of the Anjuman-e-Ittehad-e-Balochan, convened the All-India Baloch Conferences at Jacobabad (1932) and Hyderabad (1933), became chief of the Magsi tribe, and died in the Quetta earthquake of 1935, aged twenty-seven."
  ur: "بلوچ قوم پرست ادیب اور کارکن (1908ء – 31 مئی 1935ء) جن کا تعلق جھل مگسی سے تھا: ان کے 1929ء کے مضمون «فریادِ بلوچستان» پر انھیں ایک سال قیدِ تنہائی کاٹنا پڑی؛ وہ انجمن اتحادِ بلوچان کے صدر بنے، جیکب آباد (1932ء) اور حیدر آباد (1933ء) کی کل ہند بلوچ کانفرنسوں کے محرک رہے، مگسی قبیلے کے سردار بنے، اور 1935ء کے کوئٹہ زلزلے میں ستائیس برس کی عمر میں جاں بحق ہوئے۔"
