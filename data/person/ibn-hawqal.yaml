summary:
  ar: "أبو القاسم ابن حوقل النصيبي، جغرافي ورحالة تاجر من القرن الرابع الهجري (العاشر الميلادي)، صاحب «صورة الأرض»؛ بدأ أسفاره من بغداد يوم الخميس 7 رمضان 331هـ وهو في حداثة السن، وطاف بلاد الإسلام من المشرق إلى المغرب والأندلس وصقلية، وكتب عنها إقليماً إقليماً مع صورة لكل إقليم {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 1} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 4} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 9-10}."
  en: "Abu al-Qasim Ibn Hawqal al-Nasibi, a geographer and travelling merchant of the fourth Islamic (tenth Christian) century, author of Surat al-Ard. He set out from Baghdad on Thursday 7 Ramadan 331 AH while still young, travelled the lands of Islam from the east to the Maghrib, al-Andalus and Sicily, and described them province by province, with an image of each {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 1} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 4} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 9-10}."
  ur: "ابو القاسم ابن حوقل نصیبی، چوتھی صدی ہجری (دسویں صدی عیسوی) کے جغرافیہ دان اور سیاح تاجر، «صورۃ الارض» کے مصنف۔ انہوں نے جوانی میں جمعرات 7 رمضان 331ھ کو بغداد سے سفر شروع کیا، مشرق سے مغرب، اندلس اور صقلیہ تک اسلامی ممالک کی سیاحت کی، اور ہر اقلیم کی صورت کے ساتھ ان کا ایک ایک کر کے حال لکھا {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 1} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 4} {cite:surat-al-ard-ibn-hawqal-dar-maktabat-al-hayat-1992 p. 9-10}۔"
