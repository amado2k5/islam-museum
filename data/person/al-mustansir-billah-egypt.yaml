label: { ar: "المستنصر بالله الثاني أحمد بن الظاهر" }
summary:
  ar: "أول خلفاء بني العباس بمصر، أحمد أبو القاسم بن الظاهر، كان محبوساً ببغداد فأطلق لما أخذتها التتار فهرب إلى عرب العراق ثم وفد على بيبرس فبويع له في ثالث عشر رجب سنة تسع وخمسين بعد انقطاع الخلافة ثلاث سنين ونصف، وعزم على التوجه إلى العراق فجهزه السلطان بألف ألف دينار وستين ألف درهم وفتح الحديثة وهيت ثم لقي التتار فعدم في الوقعة في الثالث من المحرم سنة ستين فقيل قتل وقيل سلم وهرب فأضمرته البلاد {cite:tarikh-khulafa-minhaj-1434 p. 723-724}."
  en: "First of the Cairo Abbasids; freed from Baghdad's prison, he was hailed at Cairo 13 Rajab 659, then vanished against the Tatars beyond Hit on 3 Muharram 660 — most say killed {cite:tarikh-khulafa-minhaj-1434 p. 723-724}."
