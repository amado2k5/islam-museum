id: person/al-mustansir-billah-egypt
class: person
label: { ar: "المستنصر بالله الثاني أحمد بن الظاهر", en: "al-Mustansir bi'llah II Ahmad ibn al-Zahir", fr: "al-Mustansir bi'llah II Ahmad ibn al-Zahir", es: "al-Mustansir bi'llah II Ahmad ibn al-Zahir", ur: "المستنصر باللہ ثانی احمد بن الظاہر" }
summary:
  ar: "أول خلفاء بني العباس بمصر، أحمد أبو القاسم بن الظاهر، كان محبوساً ببغداد فأطلق لما أخذتها التتار فهرب إلى عرب العراق ثم وفد على بيبرس فبويع له في ثالث عشر رجب سنة تسع وخمسين بعد انقطاع الخلافة ثلاث سنين ونصف، وعزم على التوجه إلى العراق فجهزه السلطان بألف ألف دينار وستين ألف درهم وفتح الحديثة وهيت ثم لقي التتار فعدم في الوقعة في الثالث من المحرم سنة ستين فقيل قتل وقيل سلم وهرب فأضمرته البلاد {cite:tarikh-khulafa-minhaj-1434 p. 723-724}."
  en: "First of the Cairo Abbasids; freed from Baghdad's prison, he was hailed at Cairo 13 Rajab 659, then vanished against the Tatars beyond Hit on 3 Muharram 660 — most say killed {cite:tarikh-khulafa-minhaj-1434 p. 723-724}."
  fr: "D'abord des Abbassides du Caire ; libéré de la prison de Bagdad, il a été salué au Caire 13 Rajab 659, puis disparu contre les Tatars au-delà de Hit sur 3 Muharram 660 - la plupart disent tués {cite:tarikh-khulafa-minhaj-1434 p. 723-724}."
  es: "Primero de los abasíes de El Cairo; liberado de la prisión de Bagdad, fue aclamado en El Cairo el 13 de Rajab de 659, luego desapareció contra los tártaros más allá de Hit el 3 de Muharram de 660; la mayoría dice que murió {cite:tarikh-khulafa-minhaj-1434 p. 723-724}."
  ur: "قاہرہ عباسیوں کا پہلا بغداد کی قید سے آزاد ہوئے، قاہرہ 13 رجب 659 میں اس کی تعظیم کی گئی، پھر 3 محرم 660 کو ہٹ سے آگے تاتاریوں کے خلاف غائب ہو گئے - زیادہ تر کہتے ہیں کہ ہلاک ہو گیا {حوالہ:تاریخ-خلفاء منہاج-1434 ص۔ 723-724}۔"
  tr: "Mısır'daki ilk Abbasi halifesi Ahmed Ebu el-Kasım bin el-Zahir, Bağdat'ta hapsedildi ve Tatarlar burayı ele geçirince serbest bırakıldı. Irak'taki Araplara kaçtı, ardından Baybars'ı ziyaret etti ve halifelik üç buçuk yıl sona erdikten sonra, 59 Hicri yılının 13'ünde sadakat yemini etti. Irak'a gitmeye karar verdi, ancak Sultan ona 1.060 dinar ve altmış bin dirhem verdi, modern şehri ve Hit'i fethetti, ardından Tatarlarla karşılaştı ve 60 yılının 3'ündeki Muharrem savaşında ortadan kayboldu. Bazıları öldürüldüğünü ve kaçtığını, ancak toprakların onu yok ettiğini söyler. {Cit: Tarikh-khulafa-minhaj-1434, s. 723-724}."
  id: "Khalifah Abbasiyah pertama di Mesir, Ahmad Abu al-Qasim ibn al-Zahir, dipenjara di Baghdad dan dibebaskan ketika Tatar merebutnya. Ia melarikan diri ke Arab Irak, lalu mengunjungi Baybars, di mana ia disumpah setia pada tanggal 13 Rajab tahun 59 H, setelah kekhalifahan berakhir selama tiga setengah tahun. Ia memutuskan untuk pergi ke Irak, tetapi Sultan mempersiapkannya dengan 1.060 dinar dan enam puluh ribu dirham, menaklukkan kota modern dan Hit, kemudian bertemu Tatar dan menghilang dalam pertempuran pada tanggal 3 Muharram tahun 60. Konon ia tewas, kata orang lain, dan melarikan diri, tetapi tanah itu menghancurkannya {cite:Tarikh-khulafa-minhaj-1434, hlm. 723-724}."
