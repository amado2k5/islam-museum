summary:
  ar: "عالم ومؤرخ وشاعر هندي مسلم (1857–1914)، أستاذ العربية والفارسية في عليكره ستة عشر عامًا، والقوة المحرّكة لندوة العلماء في لكنو، ومؤسس دار المصنفين في أعظم كره، يُلقَّب بأبي التأريخ الأردي، صاحب «سيرة النبي» التي أكملها تلميذه سليمان الندوي و«الفاروق» و«شعر العجم» ومشروع علم الكلام الجديد."
  en: "Indian Muslim scholar, historian and poet (1857–1914): professor of Arabic and Persian at Aligarh for sixteen years, the driving force of Nadwatul Ulama at Lucknow, and founder of the Darul Musannefin academy at Azamgarh. Called the father of Urdu historiography, he authored the Sirat-un-Nabi that his disciple Sulaiman Nadvi completed, Al-Faruq, Sher-ul-Ajam, and a project for a new kalam."
  ur: "ہندوستانی مسلمان عالم، مورخ اور شاعر (1857–1914): علی گڑھ میں سولہ برس عربی و فارسی کے استاد، لکھنؤ میں ندوۃ العلما کی محرک شخصیت، اور اعظم گڑھ میں دار المصنفین کے بانی؛ انہیں اردو تاریخ نگاری کا باپ کہا جاتا ہے؛ «سیرت النبی» (جسے شاگرد سلیمان ندوی نے مکمل کیا)، «الفاروق» اور «شعر العجم» کے مصنف اور علم کلام جدید کے منصوبے کے حامل۔"
