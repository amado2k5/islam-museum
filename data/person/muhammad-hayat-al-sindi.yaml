summary:
  ar: "محمد حياة بن إبراهيم السندي المدني، عالم بالحديث، مولده في السند وإقامته ووفاته في المدينة المنورة، له شرح الترغيب والترهيب للمنذري وتحفة المحبين في شرح الأربعين النووية؛ توفي سنة 1163 هـ الموافقة 1750 م."
  en: "Muhammad Hayat ibn Ibrahim al-Sindi al-Madani, a hadith scholar born in al-Sind who lived and died in Medina; author of a commentary on al-Mundhiri's al-Targhib wa-l-tarhib and of Tuhfat al-muhibbin on the Forty of al-Nawawi; died 1163 AH (1750)."
  es: "Muhammad Hayat ibn Ibrahim al-Sindi al-Madani, un erudito de hadices nacido en al-Sind que vivió y murió en Medina; autor de un comentario sobre al-Targhib wa-l-tarhib de al-Mundhiri y de Tuhfat al-muhibbin sobre los Cuarenta de al-Nawawi; murió en 1163 AH (1750)."
  fr: "Muhammad Hayat ibn Ibrahim al-Sindi al-Madani, un érudit du hadith né à al-Sind qui a vécu et est mort à Médine; auteur d'un commentaire sur al-Targhib wa-l-tarhib d'al-Mundhiri et de Tuhfat al-muhibbin sur les Quarante d'al-Nawawi; mort en 1163 AH (1750)."
