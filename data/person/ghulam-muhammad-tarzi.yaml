summary:
  ar: "سردار وشاعر أفغاني من بيت محمدزاي في قندهار (1830-1900)، ابن سردار رحيم دل خان. جندي في شبابه ثم شاعر بلاط، شارك في الحرب الإنجليزية الأفغانية الثانية ونفاه الأمير عبد الرحمن سنة 1881، فعاش متنقلا بين كراتشي والهند وبغداد وإسطنبول ودمشق يكتب الشعر الديني والصوفي والدنيوي بلقبه القلمي «طرزي» الذي صار اسم أسرته. وهو والد المفكر والصحفي محمود طرزي وجدّ الملكة ثريا لأبيها."
  en: "Afghan sardar and poet of the Mohammadzai house of Kandahar (1830–1900), a son of Sardar Rahim Dil Khan. A soldier in his youth and then a court poet, he fought in the Second Anglo-Afghan War and was expelled by Emir Abdur Rahman in 1881; he lived thereafter between Karachi, India, Baghdad, Istanbul and Damascus, writing religious, mystic and secular poetry under the pen name Tarzi, which became his family's name. He was the father of the thinker and journalist Mahmud Tarzi and the grandfather of Queen Soraya."
  ur: "قندھار کے محمدزئی گھرانے کے افغان سردار اور شاعر (1830ء–1900ء)، سردار رحیم دل خان کے بیٹے۔ جوانی میں سپاہی، پھر درباری شاعر؛ دوسری اینگلو افغان جنگ میں شریک ہوئے اور امیر عبدالرحمن نے 1881ء میں انہیں جلاوطن کر دیا، جس کے بعد وہ کراچی، ہندوستان، بغداد، استنبول اور دمشق کے درمیان رہے اور اپنے قلمی نام «طرزی» سے دینی، صوفیانہ اور دنیوی شاعری کی، جو نام بعد میں ان کے خاندان کا نام بن گیا۔ وہ مفکر و صحافی محمود طرزی کے والد اور ملکہ ثریا کے دادا تھے۔"
