summary:
  ar: "داعية مصري سلفي، وُلد في المعتمدية بإمبابة في محافظة الجيزة سنة 1956. حفظ القرآن صغيرا، وطلب العلم في مصر والسعودية على شيوخ منها ابن باز وابن عثيمين، واشتهر بدروسه في المساجد وبرامجه على قناتي الناس والرحمة، وله مؤلفات ومحاضرات كثيرة في التزكية والدعوة."
  en: "Egyptian Salafi preacher, born at Al-Mu'tamadiya in Imbaba, Giza Governorate, in 1956. He memorised the Qur'an young, studied in Egypt and Saudi Arabia with teachers including Ibn Baz and Ibn Uthaymin, and became known for his mosque lessons and his programmes on the Al-Nas and Al-Rahma channels; he has many books and lectures on devotion and preaching."
  ur: "مصری سلفی مبلغ، جو 1956 میں امبابہ کے علاقے المعتمدیہ (محافظہ جیزہ) میں پیدا ہوئے۔ انہوں نے بچپن میں قرآن حفظ کیا، مصر اور سعودی عرب میں ابن باز اور ابن عثیمین سمیت اساتذہ سے علم حاصل کیا، اور مساجد کے دروس اور الناس و الرحمہ چینلوں پر پروگراموں سے مشہور ہوئے؛ تزکیہ و دعوت پر ان کی کئی کتابیں اور بے شمار محاضرات ہیں۔"
