id: person/karima-umm-al-kiram
class: person
label: { ar: "كريمة بنت أحمد المروزية أم الكرام" }
summary:
  ar: "كريمة بنت أحمد بن محمد بن حاتم أم الكرام المروزية المجاورة بمكة؛ روت الصحيح من الكشميهني وروت عن زاهر السرخسي، وكانت تضع كتابها فتقابل بنسخها لها فهم وتبصير، وما تزوجت قط وقد بلغت المائة؛ توفيت سنة ثلاث وستين وأربعمائة، وحدّث عنها ابن الأهدل من الحفاظ {cite:shadharat-dhahab p. 314}."
  en: "Karima bint Ahmad b. Muhammad b. Hatim, 'Umm al-Kiram' — the Marwazi long-resident of Mecca who transmitted Sahih al-Bukhari from al-Kushmihani and narrated from Zahir al-Sarakhsi; she would lay her codex down and collate the copies against it with sure knowledge, never married, and neared a hundred; died 463 {cite:shadharat-dhahab p. 314}."
  es: "Karima bint Ahmad b. Muhammad b. Hatim, 'Umm al-Kiram' — la marwazi que residió durante mucho tiempo en La Meca, quien transmitió Sahih al-Bukhari de al-Kushmihani y narró de Zahir al-Sarakhsi; ella dejaba su códice y cotejaba las copias con él con conocimiento certero, nunca se casó y vivió cerca de los cien años; murió en 463 {cite:shadharat-dhahab p. 314}."
  fr: "Karima bint Ahmad b. Muhammad b. Hatim, 'Umm al-Kiram' — la Marwazi résidente de longue date de La Mecque qui a transmis le Sahih al-Bukhari d'al-Kushmihani et a rapporté de Zahir al-Sarakhsi; elle posait son codex et collait les copies contre lui avec une connaissance sûre, ne s'est jamais mariée et a frôlé la centaine; est décédée en 463 {cite: shadharat-dhahab p. 314}."
  ur: "کریمہ بنت احمد بی۔ محمد بی حاتم، 'ام الکرام' - مروازی طویل مکہ مکہ جس نے صحیح البخاری کو الکشمہانی سے نقل کیا اور ظاہر السرخسی سے روایت کی؛ وہ اپنا کوڈیکس نیچے رکھ دیتی اور یقینی علم کے ساتھ اس کے خلاف کاپیاں جمع کرتی، کبھی شادی نہیں کی، اور سو کے قریب پہنچ گئی۔ متوفی 463۔ 314}۔"
  tr: "Kerima bint Ahmed ibn Muhammed ibn Hatim, Mekke yakınlarındaki um al-Keram el-Marwaziye; el-Keşmihani'den ve Zahir el-Sarakhsi'den orijinal rivayetler anlattı. Kitabını derler ve kopyalarını kendisine anlayış ve anlayışla karşılaştırırdı. Hiç evlenmedi ve yüz yaşına ulaştı; dört yüz altmış üç yaşında vefat etti. İbn el-Ahdal ezbercilerden anlattı {kaynak: şadharat-dhahab, s. 314}."
  id: "Karima bint Ahmad ibn Muhammad ibn Hatim, um al-Karam al-Marwaziyyah dekat Mekah; ia menceritakan kisah asli dari al-Kashmihani dan menceritakan dari Zahir al-Sarakhsi. Ia biasa menyusun bukunya dan membandingkan salinan dengan pemahaman dan wawasan kepadanya. Ia tidak pernah menikah dan mencapai usia seratus; ia meninggal pada tahun empat ratus enam puluh tiga. Ibn al-Ahdal menceritakan dari para penghafal {sitasi:shadharat-dhahab, hlm. 314}."
