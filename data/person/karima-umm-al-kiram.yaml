summary:
  ar: "كريمة بنت أحمد بن محمد بن حاتم أم الكرام المروزية المجاورة بمكة؛ روت الصحيح من الكشميهني وروت عن زاهر السرخسي، وكانت تضع كتابها فتقابل بنسخها لها فهم وتبصير، وما تزوجت قط وقد بلغت المائة؛ توفيت سنة ثلاث وستين وأربعمائة، وحدّث عنها ابن الأهدل من الحفاظ {cite:shadharat-dhahab p. 314}."
  en: "Karima bint Ahmad b. Muhammad b. Hatim, 'Umm al-Kiram' — the Marwazi long-resident of Mecca who transmitted Sahih al-Bukhari from al-Kushmihani and narrated from Zahir al-Sarakhsi; she would lay her codex down and collate the copies against it with sure knowledge, never married, and neared a hundred; died 463 {cite:shadharat-dhahab p. 314}."
