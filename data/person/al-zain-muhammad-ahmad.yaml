summary:
  ar: "\u0642\u0627\u0631\u0626 \u0648\u0625\u0645\u0627\u0645 \u0633\u0648\u062f\u0627\u0646\u064a \u2066(\u0648\u064f\u0644\u062f 1982)\u2069 \u0645\u0646 \u0634\u0645\u0627\u0644 \u0643\u0631\u062f\u0641\u0627\u0646\u060c \u062d\u0641\u0638 \u0627\u0644\u0642\u0631\u0622\u0646 \u0641\u064a \u062e\u0644\u0648\u0629 \u062e\u0631\u0633\u064a \u0628\u0628\u0627\u0631\u0627 \u0648\u062e\u062a\u0645\u0647 \u0628\u0631\u0648\u0627\u064a\u062a\u064a \u0627\u0644\u062f\u0648\u0631\u064a \u0648\u062d\u0641\u0635\u060c \u0648\u0646\u0627\u0644 \u0625\u062c\u0627\u0632\u0629 \u0627\u0644\u0623\u0632\u0647\u0631 \u0639\u0644\u0649 \u0623\u062d\u0645\u062f \u0639\u064a\u0633\u0649 \u0627\u0644\u0645\u0639\u0635\u0631\u0627\u0648\u064a \u0641\u064a 2008\u060c \u0648\u064a\u0624\u0645\u0651 \u0645\u0633\u062c\u062f \u0627\u0644\u0633\u064a\u062f\u0629 \u0633\u0646\u0647\u0648\u0631\u064a \u0628\u0627\u0644\u062e\u0631\u0637\u0648\u0645 \u0645\u0646\u0630 2001 \u0641\u064a\u0642\u0635\u062f\u0647 \u0627\u0644\u0622\u0644\u0627\u0641 \u0641\u064a \u0627\u0644\u062a\u0631\u0627\u0648\u064a\u062d \u0648\u0627\u0644\u062a\u0647\u062c\u062f."
  en: "Sudanese reciter and imam (born 1982) from North Kordofan who memorised the Qur'an at the Khursi khalwa in Bara in the Duri and Hafs transmissions, received an al-Azhar ijaza from Ahmad Isa al-Ma'sarawi in 2008, and has led the Sayyida Sanhouri Mosque in Khartoum since 2001, drawing thousands to its tarawih and tahajjud."
