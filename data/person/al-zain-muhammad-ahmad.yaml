summary:
  ar: "قارئ وإمام سوداني ⁦(وُلد 1982)⁩ من شمال كردفان، حفظ القرآن في خلوة خرسي ببارا وختمه بروايتي الدوري وحفص، ونال إجازة الأزهر على أحمد عيسى المعصراوي في 2008، ويؤمّ مسجد السيدة سنهوري بالخرطوم منذ 2001 فيقصده الآلاف في التراويح والتهجد."
  en: "Sudanese reciter and imam (born 1982) from North Kordofan who memorised the Qur'an at the Khursi khalwa in Bara in the Duri and Hafs transmissions, received an al-Azhar ijaza from Ahmad Isa al-Ma'sarawi in 2008, and has led the Sayyida Sanhouri Mosque in Khartoum since 2001, drawing thousands to its tarawih and tahajjud."
  ur: "شمالی کردفان کے سوڈانی قاری اور امام ⁦(پیدائش 1982ء)⁩، جنھوں نے بارا کی خلوہ خرسی میں روایتِ دوری اور حفص میں قرآن حفظ کیا، 2008ء میں احمد عیسیٰ المعصراوی سے ازہر کی اجازت لی، اور 2001ء سے خرطوم کی مسجد السیدہ سنہوری کے امام ہیں جہاں تراویح اور تہجد میں ہزاروں لوگ آتے ہیں۔"
