summary:
  ar: "رحمان تشيشتي (وُلد في 4 تشرين الأول 1978 في مظفر آباد، آزاد كشمير)، سياسي ومحامٍ بريطاني من حزب المحافظين. جاء إلى المملكة المتحدة في السادسة من عمره ليلتحق بوالده، إمام مسجد غيلينغهام، وقُبل في نقابة المحامين سنة 2001، وعمل مستشارًا سياسيًا لبينظير بوتو 1999–2007، وكان عضو البرلمان عن غيلينغهام ورينهام 2010–2024. وعمل مبعوثًا خاصًا لرئيس الوزراء لحرية الدين أو المعتقد 2019–2020، واستقال من المنصب احتجاجًا على مشروع قانون السوق الداخلية."
  en: "Rehman Chishti (born 4 October 1978 in Muzaffarabad, Azad Kashmir) is a British Conservative politician and barrister. He came to the United Kingdom aged six to join his father, an imam in Gillingham, was called to the Bar in 2001, advised Benazir Bhutto from 1999 to 2007, and was MP for Gillingham and Rainham from 2010 to 2024. He served as the Prime Minister's Special Envoy for Freedom of Religion or Belief from 2019 to 2020, resigning from the post over the Internal Market Bill."
  ur: "رحمان چشتی (پیدائش 4 اکتوبر 1978، مظفر آباد، آزاد کشمیر) برطانوی کنزرویٹو سیاست دان اور بیرسٹر ہیں۔ وہ چھ سال کی عمر میں اپنے والد، جو گلنگھم کے امام تھے، کے پاس برطانیہ آئے، 2001 میں بار میں داخل ہوئے، 1999 سے 2007 تک بینظیر بھٹو کے سیاسی مشیر رہے، اور 2010 سے 2024 تک گلنگھم اور رینہم کے رکن پارلیمنٹ رہے۔ وہ 2019 سے 2020 تک وزیرِ اعظم کے خصوصی ایلچی برائے آزادیِ مذہب یا عقیدہ رہے اور انٹرنل مارکیٹ بل پر اس عہدے سے مستعفی ہوئے۔"

