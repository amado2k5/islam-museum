label: { ar: "مالك بن فهم الأزدي", en: "Malik ibn Fahm", es: "Malik ibn Fahm", fr: "Malik ibn Fahm", ur: "مالک بن فہم" }
summary:
  ar: "مالك بن فهم بن دوس الأزدي، عند المسعودي أول من ملك الحيرة، سار من اليمن مع ولد جفنة بن عمرو بن عامر مزيقياء فسار بنو جفنة نحو الشام وانفصل مالك نحو العراق فملك على مضر بن نزار اثنتي عشرة سنة ثم ملك بعده ابنه جذيمة {cite:muruj-al-dhahab p. 409}."
  en: "First king of al-Hira in al-Mas'udi's account — the Azdi who split from the Jafnids' march to Syria and ruled Mudar in Iraq twelve years before his son Jadhima {cite:muruj-al-dhahab p. 409}."
  es: "Primer rey de al-Hira en el relato de al-Mas'udi: el Azdi que se separó de la marcha de los Jafnids hacia Siria y gobernó Mudar en Irak doce años antes que su hijo Jadhima {cite:muruj-al-dhahab p. 409}."
  fr: "Premier roi d'al-Hira selon le récit d'al-Mas'udi — l'Azdi qui s'est séparé de la marche des Jafnides vers la Syrie et a régné sur Mudar en Irak douze ans avant son fils Jadhima {cite:muruj-al-dhahab p. 409}."
  ur: "المسعودی کے بیان میں الحیرہ کا پہلا بادشاہ - ازدی جو جافنیوں کے شام کی طرف مارچ سے الگ ہو گیا اور اپنے بیٹے جدیمہ سے بارہ سال پہلے عراق میں مدر پر حکومت کی۔ 409}۔"
  tr: "El-Mes'udi'ye göre, Malik ibn Fahm ibn Daws al-Azdi, el-Hirah'ı ilk yöneten kişiydi. Yemen'den Jafna ibn Amr ibn Amir Muziqiyya'nın soyundan gelenlerle birlikte yürüdü. Banu Cafna Levant'a doğru yürüdü, Malik Irak'a doğru ayrıldı, on iki yıl boyunca Mudar ibn Nizar'ı yönetti, ardından oğlu Yehudim ondan sonra hüküm sürdü {atıf:muruj-al-dhahab, s. 409}."
  id: "Malik ibn Fahm ibn Daws al-Azdi, menurut al-Mas'udi, adalah yang pertama memerintah al-Hirah. Ia berangkat dari Yaman bersama keturunan Jafna ibn Amr ibn Amir Muziqiyya. Banu Jafna bergerak menuju Levant, Malik berpisah menuju Irak, memerintah Mudar ibn Nizar selama dua belas tahun, kemudian putranya Judhimah memerintah setelahnya {cite:muruj-al-dhahab, hlm. 409}."
