summary:
  ar: "سلطان فيرق من سنة 1984 حتى 2014 وتاسع ملوك ماليزيا (يانغ دي-برتوان أغونغ، 1989–1994). وُلد في باتو غاجه سنة 1928 وتدرّج في قضاء مالايا حتى صار سنة 1965 أصغر قاضٍ في المحكمة العليا وسنة 1982 أصغر رئيس للمحكمة الاتحادية، قبل أن يعتلي عرش فيرق؛ وقد أيّدت المحاكم رفضه حلّ مجلس فيرق التشريعي سنة 2009، وعُرف بلقب أبي الهوكي الماليزي."
  en: "Sultan of Perak from 1984 to 2014 and the ninth Yang di-Pertuan Agong of Malaysia (1989–1994). Born at Batu Gajah in 1928, he rose through Malaya's judiciary to become, in 1965, the youngest judge appointed to the High Court and, in 1982, the youngest Lord President of the Federal Court, before ascending the Perak throne on the death of his cousin Sultan Idris Shah II; his refusal to dissolve the Perak state assembly in 2009 was upheld by the courts, and he was known as the Father of Malaysian Hockey."
  ur: "1984ء سے 2014ء تک سلطانِ پیراک اور ملائیشیا کے نویں یانگ دی پرتوان آگونگ (1989ء–1994ء)۔ 1928ء میں باتو گاجہ میں پیدا ہوئے، ملایا کی عدلیہ میں ترقی کر کے 1965ء میں ہائی کورٹ کے سب سے کم عمر جج اور 1982ء میں فیڈرل کورٹ کے سب سے کم عمر لارڈ پریذیڈنٹ بنے، پھر پیراک کے تخت پر بیٹھے؛ 2009ء میں پیراک اسمبلی تحلیل کرنے سے ان کے انکار کو عدالتوں نے برقرار رکھا، اور وہ ملائیشیائی ہاکی کے بانی کے طور پر معروف ہوئے۔"
