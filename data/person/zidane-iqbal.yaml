  ar: "لاعب وسط وُلد في مانشستر سنة 2003 لأب باكستاني وأم عراقية، وهو من خريجي أكاديمية مانشستر يونايتد وأول بريطاني من جنوب آسيا يلعب للنادي في دوري أبطال أوروبا، ثم انتقل إلى أوتريخت الهولندي ودندي يونايتد، ويمثّل منتخب العراق الأول."
  en: "Midfielder born in Manchester in 2003 to a Pakistani father and an Iraqi mother. A Manchester United academy product, he became the first British South Asian to play for the club in the Champions League, then moved to Utrecht in the Netherlands and to Dundee United. He represents Iraq at senior level."
