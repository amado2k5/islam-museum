summary:
  ar: "فيلسوف ومفكر جزائري (وُلد في مليانة سنة 1950). وزير الجامعات (1990–1991) وسفير الجزائر في مصر (1994–2001)، ومؤسس مجموعة الصداقة الإسلامية المسيحية (1993)، ومن أبرز دعاة حوار الحضارات والأديان؛ نال جائزة اليونسكو–الشارقة للثقافة العربية سنة 2012."
  en: "Algerian philosopher and thinker (born 1950 in Miliana). Minister of universities (1990–1991) and Algeria's ambassador to Egypt (1994–2001), founder of the Groupe d'amitié islamo-chrétienne (1993) and a leading voice for dialogue among civilisations and religions; he received the UNESCO-Sharjah Prize for Arab Culture in 2012."
  ur: "الجزائری فلسفی اور مفکر (پیدائش 1950ء، ملیانہ)۔ وزیرِ جامعات (1990–1991ء) اور مصر میں الجزائر کے سفیر (1994–2001ء) رہے؛ اسلامی مسیحی دوستی گروپ (1993ء) کے بانی اور تہذیبوں و مذاہب کے مکالمے کی نمایاں آواز؛ 2012ء میں یونیسکو–شارجہ انعام برائے عرب ثقافت سے نوازے گئے۔"
