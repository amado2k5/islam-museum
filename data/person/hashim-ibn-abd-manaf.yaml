summary:
  en: "Son of Abd Manaf who drew the siqaya and rifada in the division of offices and held them all his life; eponym of Banu Hashim, the house from which the Prophet came."
  ar: "ابن عبد مناف، خرجت له السقاية والرفادة في قرعة بني عبد مناف فوليهما طول حياته؛ إليه تنسب بنو هاشم، البيت الذي اصطفى الله منه النبي محمد.، وعند البلاذري نافره أمية بن عبد شمس على خمسين ناقة سود الحدق وعلى الجلاء عشر سنين فحكم له الكاهن الخزاعي فنحر الإبل وأطعم لحمها وخرج أمية إلى الشام عشر سنين فتلك أول عداوة وقعت بين هاشم وأمية {cite:ansab-al-ashraf p. 61-62}"
