summary:
  ar: "قاضٍ وسياسي ليبي من البيضاء، وُلد سنة 1952. كان أمين اللجنة الشعبية العامة للعدل في نظام القذافي (2007–2011) فاستقال احتجاجًا في فبراير 2011، ثم ترأس المجلس الوطني الانتقالي من مارس 2011 إلى أغسطس 2012، وكان في تلك الفترة رئيس دولة ليبيا بحكم الواقع."
  en: "Libyan judge and politician from Bayda, born in 1952. He was Gaddafi's secretary of the General People's Committee for Justice (2007–2011), resigned in protest in February 2011, and then chaired the National Transitional Council from March 2011 to August 2012, when he was Libya's de facto head of state."
  ur: "بیضاء سے تعلق رکھنے والے لیبیائی قاضی اور سیاست دان، جو 1952 میں پیدا ہوئے۔ وہ قذافی کے دور میں عدل کی عمومی عوامی کمیٹی کے سیکرٹری رہے (2007–2011)، فروری 2011 میں احتجاجاً مستعفی ہوئے، پھر مارچ 2011 سے اگست 2012 تک قومی عبوری کونسل کے چیئرمین رہے، جب وہ لیبیا کے درحقیقت سربراہِ مملکت تھے۔"
