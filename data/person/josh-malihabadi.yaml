summary:
  ar: "شاعر أردي (1898–1982)، وُلد باسم شبير حسن خان في مليح آباد، وعُرف بلقب «شاعر الثورة». كان من أبرز أصوات حركة الكتاب التقدميين، وهاجر إلى باكستان سنة 1956، وترك أكثر من مئة ألف بيت من الشعر."
  en: "Urdu poet (1898–1982), born Shabbir Hasan Khan in Malihabad and known as Shayar-e-Inqalab ('Poet of the Revolution'). A leading voice of the Progressive Writers' Movement, he migrated to Pakistan in 1956 and left more than 100,000 couplets."
