label: { ar: "سلمة بن عمرو الضبي", en: "Salama ibn Amr al-Dabbi", es: "Salama ibn Amr al-Dabbi", fr: "Salama ibn Amr al-Dabbi", ur: "سلمہ بن عمرو الدبی" }
summary:
  ar: "سلمة بن عمرو بن ضرار الضبي ويقال البراء بن عازب؛ بعثه حذيفة بن اليمان على جيش الري بعد انصراف عروة ووجّهه إلى قومس ويقال سليمان بن عمرو فلم يمتنعوا وفتحوا أبواب الدامغان."
  en: "Salama ibn Amr ibn Dirar al-Dabbi — some say al-Bara' ibn Azib; Hudhayfa sent him over the Rayy army after Urwa withdrew and dispatched him to Qumis — they did not resist and opened Damaghan's gates."
  es: "Salama ibn Amr ibn Dirar al-Dabbi —algunos dicen al-Bara' ibn Azib; Hudhayfa lo envió al ejército de Rayy después de que Urwa se retirara y lo envió a Qumis— no opusieron resistencia y abrieron las puertas de Damaghan."
  fr: "Salama ibn Amr ibn Dirar al-Dabbi — certains disent al-Bara' ibn Azib; Hudhayfa l'envoya par-dessus l'armée de Rayy après le retrait d'Urwa et l'expulsa vers Qumis — ils ne résistèrent pas et ouvrirent les portes de Damaghan."
  ur: "سلمہ بن عمرو بن دیر الدبی - بعض کہتے ہیں براء بن عازب؛ عروہ کے پیچھے ہٹنے کے بعد حذیفہ نے اسے رائی کی فوج پر بھیجا اور اسے قمیس کی طرف روانہ کیا - انہوں نے مزاحمت نہیں کی اور دمغان کے دروازے کھول دیئے۔"
  tr: "Salamah ibn Amr ibn Dirar al-Dabi, diğer adıyla al-Bara' ibn 'Azib, Urwah geri çekildikten sonra Hudhayfah ibn al-Yaman'ı Rayy'nin ordusuna gönderdi ve Qumus'a, yani Sulayman ibn Amr'a yöneldi, ancak reddetmediler ve Damghan'ın kapılarını açtılar."
  id: "Salamah ibn Amr ibn Dirar al-Dhabi, juga disebut al-Bara' ibn 'Azib, mengirim Hudhayfah ibn al-Yaman ke pasukan Rayy setelah Urwah mundur dan menuju Qumus, yang juga disebut Sulayman ibn Amr, tetapi mereka tidak menolak dan membuka gerbang Damghan."
