summary:
  ar: "سعيد بن أحمد بن سعيد بن سلم الباهلي، متقدم الباهليين؛ كانوا قد طمعوا في البطائح بعد خروج الزنج منها وأظهروا فيها الفساد فقبض عليه ونقل إلى بغداد فأمر به المعتمد على الله أن يضرب سبعمائة سوط فضرب وصلب في ربيع الآخر سنة 258هـ فانضم بقيّ رؤسائهم إلى الزنج {cite:muntazam-ibn-al-jawzi p. 100}."
  en: "Sa'id ibn Ahmad al-Bahili, headman of the Bahila band who coveted the Batayih after the Zanj quit it; haled to Baghdad he died under seven hundred lashes and was crucified — driving the rest of his chiefs into the Zanj {cite:muntazam-ibn-al-jawzi p. 100}."
