label: { ar: "سعيد بن أحمد الباهلي" }
summary:
  ar: "سعيد بن أحمد بن سعيد بن سلم الباهلي، متقدم الباهليين؛ كانوا قد طمعوا في البطائح بعد خروج الزنج منها وأظهروا فيها الفساد فقبض عليه ونقل إلى بغداد فأمر به المعتمد على الله أن يضرب سبعمائة سوط فضرب وصلب في ربيع الآخر سنة 258هـ فانضم بقيّ رؤسائهم إلى الزنج {cite:muntazam-ibn-al-jawzi p. 100}."
  en: "Sa'id ibn Ahmad al-Bahili, headman of the Bahila band who coveted the Batayih after the Zanj quit it; haled to Baghdad he died under seven hundred lashes and was crucified — driving the rest of his chiefs into the Zanj {cite:muntazam-ibn-al-jawzi p. 100}."
  es: "Sa'id ibn Ahmad al-Bahili, jefe de la banda Bahila que codiciaba Batayih después de que los Zanj la abandonaran; llevado a Bagdad murió bajo setecientos latigazos y fue crucificado, empujando al resto de sus jefes a unirse a los Zanj {cite:muntazam-ibn-al-jawzi p. 100}."
  fr: "Sa'id ibn Ahmad al-Bahili, chef de la bande Bahila qui convoitait les Batayih après que les Zanj les aient quittés; conduit à Bagdad, il mourut sous sept cents coups de fouet et fut crucifié — poussant le reste de ses chefs dans les Zanj {cite:muntazam-ibn-al-jawzi p. 100}."
