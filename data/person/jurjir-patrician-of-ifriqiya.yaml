id: person/jurjir-patrician-of-ifriqiya
class: person
label:
  ar: جرجير صاحب إفريقية
  en: Jurjir (Gregory), patrician of Ifriqiya
  ur: جرجیر، افریقیہ کا حاکم
gender: male
roles:
- politician
summary:
  ar: حاكم إفريقية الذي استخلفه هرقل ثم خلعه وضرب الدنانير على وجهه، وكان سلطانه ما بين أطرابلس إلى طنجة ومقره قرطاجنة، فيما يذكر ابن عبد الحكم؛ قُتل في غزوة عبد الله بن سعد بن أبي سرح، وتولى قتله فيما يزعمون عبد الله بن الزبير {cite:futuh-misr-amir-1999 p. 246}.
  en: The ruler of Ifriqiya whom Heraclius had made his deputy and who then renounced him and struck dinars with his own face, ruling from Tripoli to Tangier with his seat at Qartajanna, according to Ibn Abd al-Hakam; he was killed in Abd Allah ibn Sa'd ibn Abi Sarh's campaign, by Abd Allah ibn al-Zubayr 'as they claim' {cite:futuh-misr-amir-1999 p. 246}.
  ur: افریقیہ کا حاکم جسے ہرقل نے نائب بنایا تھا اور جس نے پھر اس کی اطاعت ترک کر کے اپنی تصویر والے دینار ڈھالے؛ ابن عبد الحکم کے مطابق اس کی حکومت طرابلس سے طنجہ تک تھی اور مرکز قرطاجنہ؛ وہ عبد اللہ بن سعد بن ابی سرح کی مہم میں قتل ہوا، اور لوگوں کے گمان میں اسے عبد اللہ بن زبیر نے قتل کیا {cite:futuh-misr-amir-1999 p. 246}۔
