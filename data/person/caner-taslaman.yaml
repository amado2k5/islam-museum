summary:
  ar: "أكاديمي تركي وأستاذ فلسفة الدين في جامعة يلدز التقنية وباحث في القرآن وكاتب، وُلد سنة 1968 في إسطنبول، عُرف بكتاباته وبرامجه في العلاقة بين العلم والدين، من نظرية الانفجار العظيم وبنية القرآن إلى نظرية التطور والفيزياء الكمومية. بلغت قناته على يوتيوب 244,000 مشترك كما في 16 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish academic, professor of philosophy of religion at Yıldız Technical University, Qur'an researcher and writer, born in 1968 in Istanbul, known for his writings and programmes on the relation of science and religion, from the Big Bang theory and the structure of the Qur'an to the evolution theory and quantum physics. His YouTube channel counted 244,000 subscribers as of 16 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک ماہرِ تعلیم، یلدز ٹیکنیکل یونیورسٹی میں فلسفۂ مذہب کے استاد، قرآن کے محقق اور مصنف، جو 1968ء میں استنبول میں پیدا ہوئے، سائنس اور مذہب کے تعلق پر اپنی تحریروں اور پروگراموں کے لیے جانے جاتے ہیں۔ vidIQ کے مطابق 16 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 244,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Académico turco, profesor de filosofía de la religión en la Universidad Técnica de Yıldız, investigador y escritor del Corán, nacido en 1968 en Estambul, conocido por sus escritos y programas sobre la relación entre ciencia y religión, desde la teoría del Big Bang y la estructura del Corán hasta la teoría de la evolución y la física cuántica. Su canal de YouTube contaba con 244 000 suscriptores al 16 de noviembre de 2026, según vidIQ (dato desactualizado de la plataforma, no verificado por un museo)."
