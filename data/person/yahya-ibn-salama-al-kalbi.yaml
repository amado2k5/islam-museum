id: person/yahya-ibn-salama-al-kalbi
class: person
label: { ar: "يحيى بن سلمة الكلبي" }
gender: male
summary:
  ar: "أول ولاة الأندلس من قبل أمراء إفريقية؛ أنفذه بشر بن صفوان الكلبي والي إفريقية لما استدعى منه أهل الأندلس والياً بعد مقتل عنبسة بن سحيم، فقدمها آخر سنة سبع وأقام في ولايتها سنتين ونصفاً ولم يغز {cite:nafh-tib-maqqari p. 272}."
  en: "First of the governors al-Andalus received from the amirs of Ifriqiya; sent by Bishr b. Safwan after Anbasa's death, he entered at the end of 107 and governed two and a half years without campaigning {cite:nafh-tib-maqqari p. 272}."
  es: "Primero de los gobernadores que al-Andalus recibió de los emires de Ifriqiya; enviado por Bishr b. Safwan después de la muerte de Anbasa, entró a finales del 107 y gobernó dos años y medio sin hacer campaña {cite:nafh-tib-maqqari p. 272}."
  fr: "Premier des gouverneurs qu'al-Andalus reçut des émirs d'Ifriqiya; envoyé par Bishr b. Safwan après la mort d'Anbasa, il entra à la fin de l'année 107 et gouverna pendant deux ans et demi sans campagne {cite:nafh-tib-maqqari p. 272}."
  ur: "اندلس کے پہلے گورنر عفریقیہ کے امیروں سے ملے۔ بشر ب نے بھیجا انبسہ کی وفات کے بعد صفوان 107 کے آخر میں داخل ہوا اور بغیر مہم چلائے ڈھائی سال حکومت کی۔ 272}۔"
  tr: "Endülüs'ün İfrikiye prensleri tarafından ilk valisi olarak atanmıştır; Endülüs halkı tarafından Enbaşı bin Suhaym'ın öldürülmesinden sonra vali olarak çağrıldığında, İfrikiye valisi Bişr bin Safvan el-Kalbi tarafından atanmıştır. Yedinci yılın sonunda gelmiş ve iki buçuk yıl boyunca baskın yapmadan valilik görevinde kalmıştır {atıf:nafh-tib-maqqari, s. 272}."
  id: "Gubernur pertama al-Andalus oleh para pangeran Ifriqiya; ia diangkat oleh Bishr ibn Safwan al-Kalbi, gubernur Ifriqiya, ketika rakyat al-Andalus memanggilnya sebagai gubernur setelah pembunuhan Anbasa ibn Suhaym. Ia tiba pada akhir tahun ketujuh dan menjabat sebagai gubernur selama dua setengah tahun tanpa serangan {cite:nafh-tib-maqqari, hlm. 272}."
