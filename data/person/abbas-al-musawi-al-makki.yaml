summary:
  ar: "عباس بن علي بن نور الدين المكي الحسيني الموسوي، أديب رحالة غزير العلم بالأخبار واللطائف، ولد وعاش بمكة وجال في العراق والهند واليمن واستقر في المخا سنة ١١٤٥هـ، ١١١١ إلى ١١٨٠هـ؛ صاحب نزهة الجليس ومنية الأديب الأنيس."
  en: "Abbas ibn Ali ibn Nur al-Din al-Makki al-Husayni al-Musawi, a travelling man of letters rich in reports and anecdotes, born and raised in Mecca, who toured Iraq, India and Yemen and settled at al-Mokha in 1145 AH, 1111 to 1180 AH (1699 to 1766); author of Nuzhat al-jalis wa munyat al-adib al-anis."
