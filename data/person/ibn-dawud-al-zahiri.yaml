died: { edtf: "0908~", hijri: "0296", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي يوم الاثنين تاسع شهر رمضان سنة ست وتسعين ومائتين وعمره اثنتان وأربعون سنة على قراءة المسح {cite:wafayat-ayan}." }
summary:
  ar: "أبو بكر محمد بن داود بن علي بن خلف الأصبهاني المعروف بالظاهري؛ كان فقيهاً أديباً شاعراً ظريفاً على مذهب والده، ولما توفي أبوه جلس في حلقته فاستصغروه فقدموا إليه رجلاً يسأله عن حد السكر فأجاب عن سؤاله بما أعجبهم؛ له كتاب سماه «الزاهرة» جمع أدباً أتى فيه بكل غريبة ونادرة وشعر رائق؛ وناظر أبا العباس ابن سريج في مجلس الوزير ابن الجراح في الإيلاء {cite:wafayat-ayan}."
  tr: "Ebu Bekir Muhammed bin Davud ibn Ali ibn Halef el-İsfahani, namıdiğer el-Zahiri, babasının okulunu takip eden bir hukukçu, edebi figür ve esprili bir şairdi. Babası öldüğünde, onun çevresinde oturdu ve onu küçümsediler. Ona sarhoşluğun sınırı hakkında bir adam getirdiler ve o da hoşlarına giden cevabı verdi. 'El-Zahira' adında, her türlü tuhaf ve nadir şeyi ve zarif şiiri sunduğu edebiyatı içeren bir kitap yazdı. Bakan İbn el-Cerrah'ın meclisinde Ebu el-Abbas bin Surayc ile İla' {atıf:vafayat-ayan} üzerine tartıştı."
  id: "Abu Bakr Muhammad ibn Dawud ibn Ali ibn Khalaf al-Isfahani, yang dikenal sebagai al-Zahiri, adalah seorang ahli hukum, tokoh sastra, dan penyair cerdas yang mengikuti sekolah ayahnya. Ketika ayahnya meninggal, ia duduk di lingkarannya, dan mereka merendahkannya. Mereka membawakan seorang pria untuk menanyakan tentang batas mabuk, dan ia menjawab apa yang mereka suka. Ia menulis sebuah buku berjudul 'Al-Zahira,' yang mengumpulkan sastra di mana ia menyajikan segala hal aneh dan langka serta puisi yang elegan. Ia berdebat dengan Abu al-Abbas ibn Surayj dalam dewan menteri Ibn al-Jarrah tentang Ila' {cite:wafayat-ayan}."
