summary:
  ar: "سلطان أيوبي بمصر، تملكها بعد أخيه العادل قلامة لما خلع، وبنى المدرسة التي بين القصرين والقلعة التي بالروضة سنة تسع وثلاثين ثم أخرب غلمانه القلعة سنة إحدى وخمسين، ومات ليلة نصف شعبان سنة سبع وأربعين والفرنج أخذوا دمياط فأخفت جاريته شجر الدر موته {cite:tarikh-khulafa-minhaj-1434 p. 705,709}."
  en: "Ayyubid sultan of Egypt, builder of the madrasa between the palaces and the Rawda citadel; he died mid-Sha'ban 647 as the Franks took Damietta, Shajar al-Durr hiding his death {cite:tarikh-khulafa-minhaj-1434 p. 705,709}."
