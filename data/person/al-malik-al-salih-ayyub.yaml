id: person/al-malik-al-salih-ayyub
education:
  did_you_know:
    ar: "الملك الصالح أيوب سلطان أيوبي بمصر، بنى المدرسة التي بين القصرين والقلعة بالروضة سنة ٦٣٩هـ، ومات ليلة النصف من شعبان."
    en: "Al-Malik al-Salih Ayyub, the Ayyubid sultan of Egypt, built the madrasa between the two palaces and the Roda citadel in 639 AH; he died on the night of mid-Sha'ban."
    ur: "ملک صالح ایوب، مصر کا ایوبی سلطان، نے 639ھ میں دو قصروں کے درمیان مدرسہ اور جزیرہ روضہ کا قلعہ بنایا؛ نصف شعبان کی رات فوت ہوا۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/ahsan-al-taqasim]
