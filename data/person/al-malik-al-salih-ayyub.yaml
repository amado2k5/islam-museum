died: { edtf: "1249-11", hijri: "0647-08-15", calendar: julian, precision: day, status: tradition, derived: true, note: "مات ليلة نصف شعبان سنة سبع وأربعين وكتم موته أياماً حتى قدم ولده توران شاه {cite:tarikh-khulafa-minhaj-1434 p. 705,709}. والمقريزي يذكر أنه مات يوم الأحد رابع عشر شعبان {cite:khitat-maqrizi-1998 p.1912}.", sources: [source/khitat-maqrizi-1998, source/tarikh-khulafa-minhaj-1434, source/shadharat-dhahab] }
summary:
  ar: "سلطان أيوبي بمصر، تملكها بعد أخيه العادل قلامة لما خلع، وبنى المدرسة التي بين القصرين والقلعة التي بالروضة سنة تسع وثلاثين ثم أخرب غلمانه القلعة سنة إحدى وخمسين، ومات ليلة نصف شعبان سنة سبع وأربعين والفرنج أخذوا دمياط فأخفت جاريته شجر الدر موته {cite:tarikh-khulafa-minhaj-1434 p. 705,709}. وكان على المنصورة لما ملك الفرنج دمياط سنة سبع وأربعين فغضب على أهلها لتركهم إياها حتى شنق ستين نفساً من أعيانهم ومات ليلة نصف شعبان وكتم موته أياماً حتى قدم ولده الملك المعظم توران شاه، وكان مولده سنة ثلاث وست مئة بالقاهرة وسلطنه أبوه على آمد وحران وسنجار وحصن كيفا وكان وافر الحرمة عظيم الهيبة طاهر الذيل خليقاً للملك ظاهر الجبروت {cite:shadharat-dhahab p. 246}."
  en: "Ayyubid sultan of Egypt, builder of the madrasa between the palaces and the Rawda citadel; he died mid-Sha'ban 647 as the Franks took Damietta, Shajar al-Durr hiding his death {cite:tarikh-khulafa-minhaj-1434 p. 705,709}."
