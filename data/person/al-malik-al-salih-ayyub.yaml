summary:
  ar: "سلطان أيوبي بمصر، تملكها بعد أخيه العادل قلامة لما خلع، وبنى المدرسة التي بين القصرين والقلعة التي بالروضة سنة تسع وثلاثين ثم أخرب غلمانه القلعة سنة إحدى وخمسين، ومات ليلة نصف شعبان سنة سبع وأربعين والفرنج أخذوا دمياط فأخفت جاريته شجر الدر موته {cite:tarikh-khulafa-minhaj-1434 p. 705,709}. وكان على المنصورة لما ملك الفرنج دمياط سنة سبع وأربعين فغضب على أهلها لتركهم إياها حتى شنق ستين نفساً من أعيانهم ومات ليلة نصف شعبان وكتم موته أياماً حتى قدم ولده الملك المعظم توران شاه، وكان مولده سنة ثلاث وست مئة بالقاهرة وسلطنه أبوه على آمد وحران وسنجار وحصن كيفا وكان وافر الحرمة عظيم الهيبة طاهر الذيل خليقاً للملك ظاهر الجبروت {cite:shadharat-dhahab p. 246}."
  en: "Ayyubid sultan of Egypt, builder of the madrasa between the palaces and the Rawda citadel; he died mid-Sha'ban 647 as the Franks took Damietta, Shajar al-Durr hiding his death {cite:tarikh-khulafa-minhaj-1434 p. 705,709}."
  fr: "Sultan ayyoubide d’Égypte, il fit bâtir la madrasa entre les deux palais et la citadelle de Rawda. Il mourut à la mi-chaabane 647, alors que les Francs prenaient Damiette, et Shajar al-Durr dissimula sa mort {cite:tarikh-khulafa-minhaj-1434 p. 705,709}."
  ur: "مصر کے ایوبی سلطان، جنہوں نے مدرسہ اور روضہ کا قلعہ تعمیر کیا؛ دمیاط پر فرنگیوں کے قبضے کے زمانے میں وفات پائی اور شجر الدر نے ان کی وفات پوشیدہ رکھی۔ {cite:khitat-maqrizi-1998}"
  es: "Sultan ayubí de Egipto, constructor de la madrasa entre los palacios y la ciudadela de Rawda; murió a mediados de Sha'ban 647 cuando los francos tomaron Damietta, Shajar al-Durr ocultó su muerte {cite:tarikh-khulafa-minhaj-1434 p. 705,709}."
  tr: "Mısır'daki Eyyubi Sultanı, kardeşi el-Adil Kalama tarafından tahttan indirildikten sonra kaleyi ele geçirdi. 39. yılda iki saray ile kalenin arasına Al-Rawda'da okulu inşa etti, ardından 1951'de hizmetkarları tarafından kaleyi yıktı. 47 yılının Şaban ortası gecesi öldü, Franklar Damietta'yı aldı ve onun köle kızı Shajar al-Durr ölümünü gizledi {cite:History-Khulafa-minhaj-1434, s. 705,709}. Franklar 1947'de Damietta'yı yönettiğinde, halkını terk ettikleri için öfkelendi, altmış soylularını astı ve Şaban ortası gecesi öldü, ölümünü günlerce gizledi, ta ki oğlu büyük Kral Turan Şah gelene kadar. 603 Hicri yılında Kahire'de doğdu ve babası Amed, Harran, Sinjar ve Kifa kalesine hükmetti. Çok saygı duyulan, muazzam ve saf kuyrukluydu; kralın yarattığı bir güç, kudretin manifestosu {cite:shadharat-dhahab, s. 246}."
  id: "Sultan Ayyubiyah di Mesir mengambil alih kastil ini setelah saudaranya al-Adil Qalama ketika ia menggulingkannya. Ia membangun sekolah di antara dua istana dan kastil di Al-Rawda pada tahun 39, lalu menghancurkan kastil itu oleh para pelayannya pada tahun 1951. Ia meninggal pada malam pertengahan Sha'ban tahun 47, dan bangsa Franka mengambil Damietta, dan budak perempuannya Shajar al-Durr menyembunyikan kematiannya {cite:History-Khulafa-minhaj-1434, hlm. 705,709}. Ketika bangsa Frank memerintah Damietta pada tahun 1947, ia marah kepada rakyatnya karena meninggalkan mereka, menggantung enam puluh tokoh mereka dan meninggal pada malam pertengahan Sha'ban, menyembunyikan kematiannya selama beberapa hari hingga putranya, Raja besar Turan Shah, tiba. Ia lahir pada tahun 603 H di Kairo, dan ayahnya memerintah Amed, Harran, Sinjar, dan benteng Kifa. Ia sangat dihormati, sangat besar, dan berekor murni, ciptaan raja, manifestasi kekuatan {cite:shadharat-dhahab, hlm. 246}."
