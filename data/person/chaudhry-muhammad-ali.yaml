summary:
  ar: "موظف مدني وسياسي باكستاني (1905–1982)، من مهندسي بيروقراطية باكستان الأولى وميزانيتها، تولى وزارة المالية (1951–1955) ثم رئاسة الوزراء من أغسطس 1955 إلى سبتمبر 1956 فأعلن في عهده أول دستور باكستاني سنة 1956، ثم اعتزل وخلّف كتاب «نشوء باكستان» (1967). توفي في كراتشي في 2 ديسمبر 1982."
  en: "Pakistani civil servant and politician (1905–1982), a builder of Pakistan's first civil bureaucracy and budgets, who served as finance minister (1951–1955) and then as prime minister from August 1955 to September 1956, promulgating Pakistan's first constitution in 1956, and in retirement wrote The Emergence of Pakistan (1967). He died at Karachi on 2 December 1982."
  ur: "پاکستانی سرکاری افسر اور سیاست دان (1905ء–1982ء)، پاکستان کی پہلی سول بیوروکریسی اور بجٹ کے معمار، وزیرِ خزانہ (1951ء–1955ء) اور پھر اگست 1955ء سے ستمبر 1956ء تک وزیرِ اعظم رہے جن کے عہد میں 1956ء میں پاکستان کا پہلا آئین نافذ ہوا، ریٹائرمنٹ میں «پاکستان کا ظہور» (1967ء) لکھی۔ 2 دسمبر 1982ء کو کراچی میں وفات پائی۔"
