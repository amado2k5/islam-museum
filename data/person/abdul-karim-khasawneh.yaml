summary:
  ar: "عالم ومفتٍ أردني وُلد سنة 1944 في بلدة أيدون بمحافظة إربد. تخرّج في كلية الشريعة بجامعة دمشق سنة 1973 وخدم مرشدًا دينيًا في القوات المسلحة الأردنية ثم مفتيًا لها برتبة لواء، وعُيّن مفتيًا عامًا للمملكة ⁦(2010–2017 ثم 2019–2023)⁩ وقاضيًا للقضاة سنة 2017، وهو عضو مجلس الإفتاء الأردني ومجلس أمناء جامعة العلوم الإسلامية العالمية ⁦(WISE)⁩."
  en: "Jordanian scholar and mufti, born 1944 in the town of Eydoun in Irbid Governorate. A 1973 graduate of the Faculty of Sharia at Damascus University, he served as religious guide then Mufti of the Jordanian Armed Forces with the rank of major general, was twice Grand Mufti of the Kingdom ⁦(2010–2017 and 2019–2023)⁩ and Chief Islamic Justice in 2017, and sits on the Jordanian Ifta Council and the board of the World Islamic Sciences and Education University ⁦(WISE)⁩."
  fr: "Savant et mufti jordanien, né en 1944 dans la ville d'Eydoun, dans le gouvernorat d'Irbid. Diplômé en 1973 de la faculté de charia de l'université de Damas, il fut guide religieux puis mufti des forces armées jordaniennes avec le grade de général de division, deux fois grand mufti du royaume ⁦(2010–2017 et 2019–2023)⁩ et grand cadi en 2017, et siège au Conseil jordanien de l'ifta et au conseil de la World Islamic Sciences and Education University ⁦(WISE)⁩."
  ur: "اردنی عالم اور مفتی، 1944 میں محافظہ اربد کے قصبہ ایدون میں پیدا ہوئے۔ 1973 میں جامعہ دمشق کی فیکلٹی آف شریعہ سے فارغ التحصیل ہوئے، اردنی مسلح افواج میں مذہبی رہنما اور پھر میجر جنرل کے عہدے پر مفتی رہے، دو بار مملکت کے مفتیِ اعظم ⁦(2010–2017 اور 2019–2023)⁩ اور 2017 میں قاضی القضاة رہے؛ مجلسِ افتائے اردن اور جامعہ العلوم الاسلامیہ العالمية ⁦(WISE)⁩ کے بورڈ کے رکن ہیں۔"
  es: "Erudito y muftí jordano, nacido en 1944 en la ciudad de Eydoun, en la gobernación de Irbid. Graduado en 1973 de la Facultad de Sharia de la Universidad de Damasco, se desempeñó como guía religioso y luego como muftí de las Fuerzas Armadas jordanas con el rango de general de división, fue dos veces Gran Muftí del Reino (2010-2017 y 2019-2023) y Juez Islámico Jefe en 2017, y forma parte del Consejo de Ifta jordano y de la junta directiva de la Universidad Mundial de Ciencias y Educación Islámicas (WISE)."
  tr: "Ürdünlü bir alim ve müftü olan bu kişi, 1944 yılında İrbid Valiliği'ne bağlı Aidoun kasabasında doğmuştur. 1973 yılında Şam Üniversitesi Şeriat Fakültesi'nden mezun olmuş ve Ürdün Silahlı Kuvvetleri'nde dinî rehber, ardından da tümgeneral rütbesiyle müftü olarak görev yapmıştır. 2010-2017 ve 2019-2023 yılları arasında Krallığın Büyük Müftüsü ve 2017 yılında Baş Yargıç olarak atanmıştır. Ürdün Fetva Konseyi ve Dünya İslam Bilimleri ve Eğitim Üniversitesi (WISE) Mütevelli Heyeti üyesidir."
  id: "Seorang cendekiawan dan mufti Yordania, lahir pada tahun 1944 di kota Aidoun di Kegubernuran Irbid. Beliau lulus dari Fakultas Syariah di Universitas Damaskus pada tahun 1973 dan bertugas sebagai pembimbing agama di Angkatan Bersenjata Yordania, kemudian sebagai mufti dengan pangkat mayor jenderal. Beliau diangkat sebagai Mufti Agung Kerajaan (2010–2017 dan kemudian 2019–2023) dan Ketua Mahkamah Agung pada tahun 2017. Beliau adalah anggota Dewan Fatwa Yordania dan Dewan Pengawas Universitas Ilmu dan Pendidikan Islam Dunia (WISE)."
