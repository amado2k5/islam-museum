summary:
  ar: "أم الحسن فاطمة الحسينية الحلبية أخت نقيب الأشراف؛ ولدت سنة اثنتين أو ثلاث وثلاثين وسبعمائة وسمعت على جدها لأمها جمال الدين إبراهيم بن الشهاب محمود وأجاز لها المزي وجماعة وحدثت بحلب وتوفيت في العشر الأول من المحرم وقد جاوزت الثمانين سنة {cite:shadharat-dhahab p. 112}."
  en: "Umm al-Hasan Fatima al-Husayniyya of Aleppo, sister of the naqib al-ashraf (b. 732/733) — heard hadith on her maternal grandfather and taught it at Aleppo with al-Mizzi's ijaza; died in the first ten days of Muharram 812, past eighty {cite:shadharat-dhahab p. 112}."
  es: "Umm al-Hasan Fatima al-Husayniyya de Alepo, hermana del naqib al-ashraf (n. 732/733), escuchó hadices sobre su abuelo materno y los enseñó en Alepo con la ijaza de al-Mizzi; murió en los primeros diez días de Muharram 812, pasados los ochenta {citar: shadharat-dhahab p. 112}."
  fr: "Umm al-Hasan Fatima al-Husayniyya d'Alep, sœur du naqib al-ashraf (née en 732/733) — entendit des hadiths sur son grand-père maternel et les enseigna à Alep avec l'ijaza d'al-Mizzi; est décédé dans les dix premiers jours de Muharram 812, après quatre-vingts {cite: shadharat-dhahab p. 112}."
