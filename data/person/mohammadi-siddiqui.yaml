    کی نمائندگی کی۔
  es: "Política musulmana nepalí y activista de derechos humanos. Fundó la Fundación Fátima en 2003 para defender los derechos de las mujeres musulmanas en Nepal y promover su posición social y económica, y ha representado a su comunidad en la vida pública nacional."
