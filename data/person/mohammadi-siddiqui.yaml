  ar: سياسية وناشطة حقوقية نيبالية مسلمة، أسست سنة 2003 «مؤسسة فاطمة» للدفاع عن حقوق المرأة المسلمة في نيبال وتمكينها اجتماعيًا واقتصاديًا، وشغلت مقعدًا في الجمعية الوطنية لتمثيل مجتمعها.
  en: Nepali Muslim politician and human-rights activist. She founded the Fatima Foundation in 2003 to defend the rights of Muslim women in Nepal and advance their social and economic standing, and has
    represented her community in national public life.
