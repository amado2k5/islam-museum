summary:
  ar: "المغيرة بن عبد الله بن معرض الأسدي، أبو معرض، المعروف بالأقيشر: شاعر هجاء من بادية الكوفة، كان يتردد إلى الحيرة، أدرك أول الإسلام ودولة عبد الملك بن مروان، وقتل قرب الكوفة نحو سنة 80هـ."
  en: "Al-Mughira ibn Abdallah ibn Mu'arrid al-Asadi, Abu Mu'arrid, known as al-Aqayshar: a satirical poet from the Bedouin country of Kufa who frequented al-Hira, reached the early days of Islam and the state of Abd al-Malik ibn Marwan, and was killed near Kufa about 80 AH."
  ur: "مغیرہ بن عبداللہ بن معرض اسدی، ابو معرض، المعروف اقیشر: کوفہ کے بادیہ کے ہجو گو شاعر، حیرہ آتے جاتے تھے، اسلام کا ابتدائی دور اور عبدالملک بن مروان کی حکومت پائی، اور تقریباً 80ھ میں کوفہ کے نواح میں قتل ہوئے۔"
