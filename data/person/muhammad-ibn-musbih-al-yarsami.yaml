summary:
  ar: "يرسمي أتى الهادي قبل صعود علاف يحذّره من حمل أصحابه على المكروه، فأجابه الهادي بأنه سيسرّه بعد قليل، ثم أتاه بعد فتح النميص."
  en: "A Yarsami who came to al-Hadi before the climb of Allaf to warn him against leading his men into danger, was told he would be gladdened shortly, and came to him again after al-Numays."
  ur: "ایک یرسمی جو علاف کی چڑھائی سے پہلے ہادی کے پاس آئے کہ انہیں خطرے میں نہ ڈالیں، ہادی نے جواب دیا کہ تھوڑی دیر میں انہیں خوش کر دیں گے، اور النمیص کے بعد پھر ان کے پاس آئے۔"
