label:
  ar: "محمد بن مصبح اليرسمي"
  en: "Muhammad ibn Musbih al-Yarsami"
  ur: "محمد بن مصبح یرسمی"
  es: "Muhammad ibn Musbih al-Yarsami"
  fr: "Muhammad ibn Musbih al-Yarsami"
summary:
  ar: "يرسمي أتى الهادي قبل صعود علاف يحذّره من حمل أصحابه على المكروه، فأجابه الهادي بأنه سيسرّه بعد قليل، ثم أتاه بعد فتح النميص."
  en: "A Yarsami who came to al-Hadi before the climb of Allaf to warn him against leading his men into danger, was told he would be gladdened shortly, and came to him again after al-Numays."
  ur: "ایک یرسمی جو علاف کی چڑھائی سے پہلے ہادی کے پاس آئے کہ انہیں خطرے میں نہ ڈالیں، ہادی نے جواب دیا کہ تھوڑی دیر میں انہیں خوش کر دیں گے، اور النمیص کے بعد پھر ان کے پاس آئے۔"
  es: "Un Yarsami que acudió a al-Hadi antes de la ascensión al Allaf para advertirle que no condujera a sus hombres al peligro, recibió la respuesta de que pronto se alegraría, y volvió a visitarlo después de al-Numays."
  fr: "Un Yarsami qui était venu voir al-Hadi avant l'ascension d'Allaf pour le mettre en garde contre le fait d'entraîner ses hommes dans le danger, s'est vu dire qu'il serait bientôt réjoui, et est revenu le voir après al-Numays."
  tr: "Allaf tahta çıkmadan önce resmi olarak Al-Hadi'ye geldi ve yoldaşlarına zarar vermemesi konusunda onu uyardı. Al-Hadi, kısa süre içinde memnun olacağını söyledi, ardından Al-Numays'ın fethinden sonra geldi."
  id: "Ia secara resmi datang kepada Al-Hadi sebelum Allaf naik takhta, memperingatkannya agar tidak menyakiti rekan-rekannya. Al-Hadi menjawab bahwa ia akan segera merasa senang, lalu datang setelah penaklukan Al-Numays."
