summary:
  ar: "عبد الستار إيدهي (28 فبراير 1928 – 8 يوليو 2016) فاعل خير باكستاني وُلد في بانتفا بغوجارات في أسرة ميمون مسلمة وهاجر إلى كراتشي بعد تقسيم الهند، فأسس مؤسسة إيدهي التي تدير أكبر شبكة إسعاف تطوعية في العالم وملاجئ ودور أيتام ومراكز تأهيل في أنحاء باكستان، وعاش زاهدًا دون راتب من مؤسسته، ونال جوائز دولية منها جائزة رامون ماغسايساي وجائزة لينين للسلام ونشان الامتياز."
  en: "Abdul Sattar Edhi (28 February 1928 – 8 July 2016) was a Pakistani humanitarian born at Bantva, Gujarat, into a Memon Muslim family, who migrated to Karachi after Partition and founded the Edhi Foundation, which runs the world's largest volunteer ambulance network together with shelters, orphanages and rehabilitation centres across Pakistan; he lived ascetically, took no salary from his foundation, and received the Ramon Magsaysay Award, the Lenin Peace Prize and the Nishan-e-Imtiaz, among many honours."
  ur: "عبد الستار ایدھی (28 فروری 1928ء – 8 جولائی 2016ء) پاکستانی فلاحی شخصیت تھے جو گجرات کے بانٹوا میں ایک میمن مسلم خاندان میں پیدا ہوئے اور تقسیم ہند کے بعد کراچی منتقل ہو گئے، انھوں نے ایدھی فاؤنڈیشن قائم کی جو دنیا کا سب سے بڑا رضاکار ایمبولینس نیٹ ورک اور پاکستان بھر میں پناہ گاہیں، یتیم خانے اور بحالی مراکز چلاتی ہے؛ وہ زاہدانہ زندگی گزارتے، فاؤنڈیشن سے تنخواہ نہ لیتے، اور رومن میگسیسی ایوارڈ، لینن امن انعام اور نشان امتیاز سمیت متعدد اعزازات پائے۔"
