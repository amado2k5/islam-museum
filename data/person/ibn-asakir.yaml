names:
  - { value: "أبو القاسم علي بن الحسن بن هبة الله الدمشقي", kind: full }
gender: male
summary:
  ar: "محدث الشام ثقة الدين صاحب تاريخ دمشق الثمانين مجلدة؛ قال ابن شهبة فخر الشافعية وإمام أهل الحديث في زمانه وحامل لوائهم، مولده في مستهل سنة تسع وتسعين وأربع مئة رحل إلى بلاد كثيرة وسمع الكثير من نحو ألف وثلاث مئة شيخ وثمانين امرأة وتفقه بدمشق وبغداد وكان ديناً خيراً يختم القرآن في كل جمعة وأما في رمضان ففي كل يوم، معرضاً عن المناصب بعد عرضها عليه كثير الأمر بالمعروف، قال السمعاني جمع بين معرفة المتون والأسانيد رحل وبالغ في الطلب إلى أن جمع ما لم يجمع غيره، توفي في رجب سنة إحدى وسبعين وخمس مئة ودفن بمقبرة باب الصغير؛ ومن تصانيفه التاريخ الكبير ثمان مئة جزء في ثمانين مجلداً والموافقات اثنان وسبعون جزءاً والأطراف للسنن الأربعة ثمانية وأربعون جزءاً ومعجم شيوخه اثنا عشر جزءاً ومناقب الشافعي خمسة عشر جزءاً وفضل أصحاب الحديث أحد عشر جزءاً وتبيين كذب المفتري على الشيخ أبي الحسن الأشعري مجلدة {cite:shadharat-dhahab p. 719-720}. ورحل إلى بغداد سنة عشرين فأقام بها خمس سنين وحج سنة إحدى وعشرين ورحل الثانية سنة تسع وعشرين إلى أصبهان وخراسان نحو أربع سنين وشرع في الإملاء سنة ثلاث وثلاثين {cite:tarikh-islam-dhahabi p. 71-79}، وبنى له نور الدين أول دار حديث بدمشق وشجعه على إتمام التاريخ {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "Damascus' muhaddith, author of the eighty-volume Tarikh Dimashq — Ibn Shuhba: 'the glory of the Shafi'is, imam and standard-bearer of the hadith-folk'; he heard from some 1,300 shaykhs and eighty women, completed the Qur'an weekly and daily in Ramadan, declined office, and rests at Bab al-Saghir {cite:shadharat-dhahab p. 719-720}. He went to Baghdad in 520 for five years, made the hajj in 521, journeyed east to Isfahan and Khurasan for some four years from 529, and began dictating hadith in 533 {cite:tarikh-islam-dhahabi p. 71-79}; Nur al-Din built him Damascus' first dar al-hadith and urged him to finish the Tarikh {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "شام کے حافظِ حدیث، اسی جلدوں کی «تاریخ دمشق» کے مصنف — ابن شہبہ کے الفاظ میں شافعیوں کا فخر اور اہلِ حدیث کے امام و علم بردار؛ تیرہ سو شیوخ اور اسّی خواتین سے سماعت کی، ہر جمعہ اور رمضان میں روز قرآن ختم کرتے، مناصب سے اعراض کیا اور باب الصغیر میں مدفون ہوئے {cite:shadharat-dhahab p. 719-720}۔ 520ھ میں بغداد گئے اور پانچ برس رہے، 521ھ میں حج کیا، 529ھ سے اصفہان و خراسان کے چار سالہ سفر پر نکلے اور 533ھ میں املا شروع کیا {cite:tarikh-islam-dhahabi p. 71-79}؛ نور الدین نے ان کے لیے دمشق کی پہلی دار الحدیث بنائی اور تاریخ مکمل کرنے کی ترغیب دی {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
  es: "Muhaddith de Damasco, autor del Tarikh Dimashq de ochenta volúmenes — Ibn Shuhba: 'la gloria de los shafi'íes, imán y abanderado de la gente del hadiz'; escuchó a unos 1300 shaykhs y ochenta mujeres, completó el Corán semanalmente y diariamente en Ramadán, rechazó el cargo y descansa en Bab al-Saghir {cite:shadharat-dhahab p. 719-720}. Fue a Bagdad en 520 por cinco años, hizo el Hajj en 521, viajó al este a Isfahán y Jorasán por unos cuatro años a partir de 529, y comenzó a dictar hadices en 533 {cite:tarikh-islam-dhahabi p. 71-79}; Nur al-Din le construyó el primer dar al-hadith de Damasco y le instó a terminar el Tarikh {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  fr: "Le muhaddith de Damas, auteur du Tarikh Dimashq en quatre-vingts volumes — Ibn Shuhba: « la gloire des Shafi'ites, imam et porte-étendard des spécialistes du hadith »; il a reçu l'enseignement de quelque 1 300 cheikhs et quatre-vingts femmes, a achevé la récitation hebdomadaire et quotidienne du Coran pendant le Ramadan, a refusé une charge et repose à Bab al-Saghir {cite:shadharat-dhahab p. 719-720}. Il se rend à Bagdad en 520 pour cinq ans, accomplit le hajj en 521, voyage vers l'est à Ispahan et au Khorasan pendant environ quatre ans à partir de 529, et commence à dicter des hadiths en 533 {cite:tarikh-islam-dhahabi p. 71-79}; Nur al-Din lui construisit le premier dar al-hadith de Damas et l'exhorta à terminer le Tarikh {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  tr: "Şam'ın hadis âlimi, dini konusunda güvenilir ve seksen ciltlik Şam Tarihi'nin yazarı şöyle dedi: Zamanının önde gelen hadis âlimi ve onların bayrak taşıyıcısı olan İbn Şehbe Fakhr al-Shafi'i, dört yüz doksan dokuz yılın başında doğdu. Birçok ülkeye seyahat etti ve yaklaşık bin üç yüz şeyh ile seksen kadından birçok şey dinledi. Şam ve Bağdat'ta fıkıh eğitimi aldı. Her Cuma Kur'an'ı tamamlayan dindar ve iyi bir adamdı ve Ramazan ayında her gün kendisine sunulduktan sonra görev almayı reddetti, sık sık iyilik çağrısında bulundu. Al-Sam'ani, metinleri bildiğini söyledi Daha önce derlemediği bilgileri toplayana kadar yol gezdi ve aktarım zincirlerini geniş çapta aradı. 571 Hicri yılında Rajab'da öldü ve Bab al-Saghir mezarlığına defnedildi. Eserleri arasında 'El-Tarih el-Kabir' (800 cilt) seksen cilt, 'El-Müvafakat' (yetmiş iki cilt), Dört Sünnet için 'El-Tarif' (kırk seksen), öğretmenlerinin 'Mu'cam'ı on iki cilt, 'Manaqib al-Şafi'i' (on beş cilt), 'Hadis Sahabelerinin Erdemleri' (Fadl'al-Hadis) on bir cilt ve 'Tayin al-Muftar al-Muftar' (Şeyh Ebu el-Hasan el-Eş'ari'ye karşı iftiranın yalancıları) cilt {alıntı:] Shadharat-Dhahab, ss. 719-720}. Yirmi yılda Bağdat'a seyahat etti, orada beş yıl kaldı, yirmi bir yılda Hac yaptı ve yirmi dokuzuncu yılda yaklaşık dört yıl boyunca İsfahan ve Horasan'a tekrar seyahat etti, otuz üçüncü yılda dikte etmeye başladı {atıf:Tarikh-Islam-dhahabi, s. 71-79} ve Nureddin onun için Şam'daki ilk hadis evini inşa etti ve tarihi tamamlaması için teşvik etti {cite:Encyclopaedia-of-Islam-2 cilt 3, s. 746}."
  id: "Ulama hadis al-Sham, yang dapat dipercaya dalam agama, penulis Sejarah Damaskus delapan puluh jilid, berkata: Ibn Shahba Fakhr al-Shafi'i, ulama hadis terkemuka pada zamannya dan pembawa panjinya, lahir pada awal tahun empat ratus sembilan puluh sembilan. Ia melakukan perjalanan ke banyak negeri dan mendengar banyak dari sekitar seribu tiga ratus sheikh dan delapan puluh wanita. Ia mempelajari hukum di Damaskus dan Baghdad. Ia adalah orang yang taat dan baik, menyelesaikan Al-Qur'an setiap Jumat, dan selama Ramadan, setiap hari, ia menolak memegang jabatan setelah diperkenalkan kepadanya, sering kali memerintahkan kebaikan. Al-Sam'ani mengatakan ia menggabungkan pengetahuan tentang teks-teks tersebut Ia melakukan perjalanan dan mencari rantai transmisi secara luas hingga mengumpulkan apa yang belum pernah ia kumpulkan sebelumnya. Ia meninggal di Rajab pada tahun 571 H dan dimakamkan di pemakaman Bab al-Saghir. Di antara karya-karyanya adalah 'Al-Tarikh al-Kabir' (800 jilid) dalam delapan puluh jilid, 'Al-Muwafaqat' (tujuh puluh dua jilid), 'Al-Tarif' untuk Empat Sunnah (empat puluh delapan puluh), 'Mu'jam' dari gurunya dua belas jilid, 'Manaqib al-Shafi'i' (lima belas jilid), 'Kebajikan Para Sahabat Hadis' (Fadl' al-Hadith) sebelas jilid, dan 'Tayin al-Muftar al-Muftar' (pembohong fitnah terhadap Sheikh Abu al-Hasan al-Ash'ari), jilid {cite:shadharat-dhahab, hlm. 719-720}. Ia melakukan perjalanan ke Baghdad pada tahun dua puluh, tinggal di sana selama lima tahun, melaksanakan Haji pada tahun dua puluh satu, dan kembali melakukan perjalanan pada tahun dua puluh sembilan ke Isfahan dan Khorasan selama sekitar empat tahun, memulai dikte pada tahun tiga puluh tiga {cite:Tarikh-Islam-dhahabi, hlm. 71-79}, dan Nur al-Din membangun untuknya rumah hadis pertama di Damaskus dan mendorongnya untuk menyelesaikan sejarah {cite:Encyclopaedia-of-Islam-2 vol. 3, hlm. 746}."
