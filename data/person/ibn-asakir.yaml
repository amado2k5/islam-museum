names:
  - { value: "أبو القاسم علي بن الحسن بن هبة الله الدمشقي", kind: full }
gender: male
summary:
  ar: "محدث الشام ثقة الدين صاحب تاريخ دمشق الثمانين مجلدة؛ قال ابن شهبة فخر الشافعية وإمام أهل الحديث في زمانه وحامل لوائهم، مولده في مستهل سنة تسع وتسعين وأربع مئة رحل إلى بلاد كثيرة وسمع الكثير من نحو ألف وثلاث مئة شيخ وثمانين امرأة وتفقه بدمشق وبغداد وكان ديناً خيراً يختم القرآن في كل جمعة وأما في رمضان ففي كل يوم، معرضاً عن المناصب بعد عرضها عليه كثير الأمر بالمعروف، قال السمعاني جمع بين معرفة المتون والأسانيد رحل وبالغ في الطلب إلى أن جمع ما لم يجمع غيره، توفي في رجب سنة إحدى وسبعين وخمس مئة ودفن بمقبرة باب الصغير؛ ومن تصانيفه التاريخ الكبير ثمان مئة جزء في ثمانين مجلداً والموافقات اثنان وسبعون جزءاً والأطراف للسنن الأربعة ثمانية وأربعون جزءاً ومعجم شيوخه اثنا عشر جزءاً ومناقب الشافعي خمسة عشر جزءاً وفضل أصحاب الحديث أحد عشر جزءاً وتبيين كذب المفتري على الشيخ أبي الحسن الأشعري مجلدة {cite:shadharat-dhahab p. 719-720}. ورحل إلى بغداد سنة عشرين فأقام بها خمس سنين وحج سنة إحدى وعشرين ورحل الثانية سنة تسع وعشرين إلى أصبهان وخراسان نحو أربع سنين وشرع في الإملاء سنة ثلاث وثلاثين {cite:tarikh-islam-dhahabi p. 71-79}، وبنى له نور الدين أول دار حديث بدمشق وشجعه على إتمام التاريخ {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "Damascus' muhaddith, author of the eighty-volume Tarikh Dimashq — Ibn Shuhba: 'the glory of the Shafi'is, imam and standard-bearer of the hadith-folk'; he heard from some 1,300 shaykhs and eighty women, completed the Qur'an weekly and daily in Ramadan, declined office, and rests at Bab al-Saghir {cite:shadharat-dhahab p. 719-720}. He went to Baghdad in 520 for five years, made the hajj in 521, journeyed east to Isfahan and Khurasan for some four years from 529, and began dictating hadith in 533 {cite:tarikh-islam-dhahabi p. 71-79}; Nur al-Din built him Damascus' first dar al-hadith and urged him to finish the Tarikh {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "شام کے حافظِ حدیث، اسی جلدوں کی «تاریخ دمشق» کے مصنف — ابن شہبہ کے الفاظ میں شافعیوں کا فخر اور اہلِ حدیث کے امام و علم بردار؛ تیرہ سو شیوخ اور اسّی خواتین سے سماعت کی، ہر جمعہ اور رمضان میں روز قرآن ختم کرتے، مناصب سے اعراض کیا اور باب الصغیر میں مدفون ہوئے {cite:shadharat-dhahab p. 719-720}۔ 520ھ میں بغداد گئے اور پانچ برس رہے، 521ھ میں حج کیا، 529ھ سے اصفہان و خراسان کے چار سالہ سفر پر نکلے اور 533ھ میں املا شروع کیا {cite:tarikh-islam-dhahabi p. 71-79}؛ نور الدین نے ان کے لیے دمشق کی پہلی دار الحدیث بنائی اور تاریخ مکمل کرنے کی ترغیب دی {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
