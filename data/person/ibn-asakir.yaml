summary:
  ar: "محدث الشام ثقة الدين صاحب تاريخ دمشق الثمانين مجلدة؛ قال ابن شهبة فخر الشافعية وإمام أهل الحديث في زمانه وحامل لوائهم، مولده في مستهل سنة تسع وتسعين وأربع مئة رحل إلى بلاد كثيرة وسمع الكثير من نحو ألف وثلاث مئة شيخ وثمانين امرأة وتفقه بدمشق وبغداد وكان ديناً خيراً يختم القرآن في كل جمعة وأما في رمضان ففي كل يوم، معرضاً عن المناصب بعد عرضها عليه كثير الأمر بالمعروف، قال السمعاني جمع بين معرفة المتون والأسانيد رحل وبالغ في الطلب إلى أن جمع ما لم يجمع غيره، توفي في رجب سنة إحدى وسبعين وخمس مئة ودفن بمقبرة باب الصغير؛ ومن تصانيفه التاريخ الكبير ثمان مئة جزء في ثمانين مجلداً والموافقات اثنان وسبعون جزءاً والأطراف للسنن الأربعة ثمانية وأربعون جزءاً ومعجم شيوخه اثنا عشر جزءاً ومناقب الشافعي خمسة عشر جزءاً وفضل أصحاب الحديث أحد عشر جزءاً وتبيين كذب المفتري على الشيخ أبي الحسن الأشعري مجلدة {cite:shadharat-dhahab p. 719-720}."
  en: "Damascus' muhaddith, author of the eighty-volume Tarikh Dimashq — Ibn Shuhba: 'the glory of the Shafi'is, imam and standard-bearer of the hadith-folk'; he heard from some 1,300 shaykhs and eighty women, completed the Qur'an weekly and daily in Ramadan, declined office, and rests at Bab al-Saghir {cite:shadharat-dhahab p. 719-720}."
