summary:
  ar: "ممثلة باكستانية (وُلدت سنة 1984)، من أبرز ممثلات التلفزيون والسينما في بلدها، اشتهرت بمسلسلات «داستان» و«معات» و«ڈائجسٹ رائٹر» وبفيلم «ہندی میڈیم» (2017) في الهند، ونالت وسامي التكريم «تمغۂ امتیاز» (2012) و«پرائیڈ آف پرفارمنس» (2016)."
  en: "Pakistani actress (born 1984), among her country's most prominent television and film performers, known for the dramas Dastaan, Maat and Digest Writer and the Indian film Hindi Medium (2017); she received the Tamgha-e-Imtiaz in 2012 and the Pride of Performance in 2016."
  ur: "پاکستانی اداکارہ (پیدائش 1984)، اپنے ملک کی ممتاز ترین ٹیلی ویژن و فلمی اداکاراؤں میں سے ایک، جو ڈراموں «داستان»، «معات» اور «ڈائجسٹ رائٹر» اور بھارتی فلم «ہندی میڈیم» (2017) کے لیے جانی جاتی ہیں؛ انہیں 2012 میں تمغۂ امتیاز اور 2016 میں پرائیڈ آف پرفارمنس ملا۔"
