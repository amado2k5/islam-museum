summary:
  ar: "اقتصادي وكاتب مصري أمريكي، وُلد في القاهرة سنة 1958. كان رئيسًا تنفيذيًا وكبير مسؤولي الاستثمار في شركة بيمكو ⁦(2007–2014)⁩، وهو كبير المستشارين الاقتصاديين في مجموعة أليانز ورئيس كوينز كوليدج بجامعة كامبريدج، ومن أبرز أصوات تحليل الاقتصاد العالمي في الإعلام."
  en: "Egyptian-American economist and author, born in Cairo in 1958. Chief executive and co-chief investment officer of PIMCO ⁦(2007–2014)⁩, he is chief economic adviser at Allianz and President of Queens' College, Cambridge, and one of the most heard voices on the global economy."
  ur: "مصری نژاد امریکی ماہر معاشیات اور مصنف، 1958 میں قاہرہ میں پیدا ہوئے۔ وہ 2007 تا 2014 پمکو کے چیف ایگزیکٹو اور شریک سربراہ سرمایہ کاری رہے، اب الیانز کے چیف اکنامک ایڈوائزر اور کیمبرج کے کوئینز کالج کے صدر ہیں اور عالمی معیشت کے معروف مبصر شمار ہوتے ہیں۔"
  es: "Economista y autor egipcio-estadounidense, nacido en El Cairo en 1958. Director ejecutivo y codirector de inversiones de PIMCO (2007-2014), es asesor económico principal de Allianz y presidente del Queens' College de Cambridge, y una de las voces más influyentes en la economía global."
