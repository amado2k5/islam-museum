summary:
  ar: "عالم ومناظر وبير صوفي بنغلاديشي، وهو البير الجالس على سجادة عباسي منزل، الدربار الجونبوري في سيدرغانج بنارايانغانج، وقد تولى المقام سنة 2006 بعد وفاة أبيه. عدّته صحيفة ذا بزنس ستاندرد بين أشهر خمسة دعاة في بنغلاديش، وبلغت قناة منظمته «Abbasi Tv LTD.» نحو 656 ألف مشترك على يوتيوب في نوفمبر 2026، وهو أمير حركة تحريك ختم النبوة في بنغلاديش."
  en: "Bangladeshi scholar, debater and Sufi pir — the sitting pir of Abbasi Manzil, the Jaunpuri darbar at Siddhirganj, Narayanganj, a seat he took up in 2006 after his father's death. The Business Standard named him among Bangladesh's five most popular preachers; his organisation's channel, Abbasi Tv LTD., counted some 656,000 YouTube subscribers in November 2026. He is amir of Tahrike Khatme Nubuwat Bangladesh."
  ur: "بنگلہ دیشی عالم، مناظر اور صوفی پیر — عباسی منزل، جونپوری دربار ⁦(سدھیر گنج، نارائن گنج)⁩ کے گدی نشین پیر، یہ مقام انہوں نے 2006 میں اپنے والد کی وفات کے بعد سنبھالا۔ دی بزنس اسٹینڈرڈ نے انہیں بنگلہ دیش کے پانچ مقبول ترین مبلغین میں شمار کیا؛ ان کی تنظیم کے چینل «Abbasi Tv LTD.» کے نومبر 2026 میں یوٹیوب پر تقریباً 656 ہزار سبسکرائبر تھے۔ وہ تحریکِ ختمِ نبوت بنگلہ دیش کے امیر ہیں۔"
