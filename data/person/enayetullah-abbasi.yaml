summary:
  ar: "عالم ومناظر وبير صوفي بنغلاديشي، وهو البير الجالس على سجادة عباسي منزل، الدربار الجونبوري في سيدرغانج بنارايانغانج، وقد تولى المقام سنة 2006 بعد وفاة أبيه. عدّته صحيفة ذا بزنس ستاندرد بين أشهر خمسة دعاة في بنغلاديش، وبلغت قناة منظمته «Abbasi Tv LTD.» نحو 656 ألف مشترك على يوتيوب في نوفمبر 2026، وهو أمير حركة تحريك ختم النبوة في بنغلاديش."
  en: "Bangladeshi scholar, debater and Sufi pir — the sitting pir of Abbasi Manzil, the Jaunpuri darbar at Siddhirganj, Narayanganj, a seat he took up in 2006 after his father's death. The Business Standard named him among Bangladesh's five most popular preachers; his organisation's channel, Abbasi Tv LTD., counted some 656,000 YouTube subscribers in November 2026. He is amir of Tahrike Khatme Nubuwat Bangladesh."
  ur: "بنگلہ دیشی عالم، مناظر اور صوفی پیر — عباسی منزل، جونپوری دربار ⁦(سدھیر گنج، نارائن گنج)⁩ کے گدی نشین پیر، یہ مقام انہوں نے 2006 میں اپنے والد کی وفات کے بعد سنبھالا۔ دی بزنس اسٹینڈرڈ نے انہیں بنگلہ دیش کے پانچ مقبول ترین مبلغین میں شمار کیا؛ ان کی تنظیم کے چینل «Abbasi Tv LTD.» کے نومبر 2026 میں یوٹیوب پر تقریباً 656 ہزار سبسکرائبر تھے۔ وہ تحریکِ ختمِ نبوت بنگلہ دیش کے امیر ہیں۔"
  es: "Erudito, orador y pir sufí bangladesí, es el pir titular de Abbasi Manzil, el Jaunpuri darbar en Siddhirganj, Narayanganj, cargo que asumió en 2006 tras la muerte de su padre. El Business Standard lo incluyó entre los cinco predicadores más populares de Bangladesh; el canal de su organización, Abbasi TV LTD., contaba con unos 656.000 suscriptores en YouTube en noviembre de 2026. Es amir de Tahrike Khatme Nubuwat Bangladesh."
  fr: "Érudit, orateur et maître soufi bangladais, il est le pir en fonction d'Abbasi Manzil, le darbar Jaunpuri de Siddhirganj, à Narayanganj, poste qu'il occupe depuis 2006 après le décès de son père. Le Business Standard l'a classé parmi les cinq prédicateurs les plus populaires du Bangladesh; la chaîne de son organisation, Abbasi TV Ltd., comptait quelque 656 000 abonnés sur YouTube en novembre 2026. Il est l'émir de Tahrike Khatme Nubuwat Bangladesh."
  tr: "Bangladeşli bir Sufi alimi, teorisyeni ve refah uzmanı olan Sher, babasının ölümünden sonra 2006 yılında göreve başlayan Narayangang, Sidargang'daki Gonpuri sarayının Abbasi secadesinde oturan kişidir. Business Standard gazetesi onu Bangladeş'in en ünlü beş vaizinden biri olarak sıraladı ve kuruluşunun \"Abbasi TV LTD\" kanalı Kasım 2026'da YouTube'da yaklaşık 656.000 aboneye ulaştı. Bangladeş'teki Peygamberlik Mührü hareketinin lideridir."
  id: "Sebagai ulama, teoritikus, dan kesejahteraan Sufi Bangladesh, ia adalah sosok yang duduk di atas karpet salat Abbashi di istana Gonpuri di Sidargang, Narayangang, yang menjabat pada tahun 2006 setelah kematian ayahnya. Surat kabar Business Standard menempatkannya di antara lima pengkhotbah paling terkenal di Bangladesh, dan saluran organisasinya \"Abbasi TV LTD\" mencapai sekitar 656.000 pelanggan di YouTube pada November 2026. Ia adalah pemimpin gerakan Seal of Prophethood di Bangladesh."
