summary:
  ar: "صحابي من الأشعريين، حليف آل عتبة بن ربيعة بن عبد شمس. كان ممن حمل النجاشي في السفينتين إلى النبي بخيبر. مشهور بفقهه وقراءته للقرآن وتولّيه إمارة البصرة والكوفة في خلافة عمر. وعند المسعودي كان يحدث قبل صفين أن هذه الأمة لا تزال بها الفتن حتى يبعثوا حكمين فنهاه سويد بن غفلة أن يكون أحدهما فكان يقول لا جعل الله لي في السماء مصعداً ولا في الأرض مقعداً ثم رضي حكماً من جانب أهل العراق ولم يرضه علي لكن الأشعث وجماعته أصروا {cite:muruj-al-dhahab p. 682-683}"
  en: "Companion from the Ashari tribe, a client of the family of Utba ibn Rabi'a; came to the Prophet on the two ships from Abyssinia. Known as a jurist, expert Qur'an reciter and governor of Basra and Kufa under Umar."
  ur: "قبیلہ اشعر کے صحابی؛ حبشہ سے آنے والے دو جہازوں کے مسافروں کے ساتھ نبی کے پاس پہنچے۔ {cite:ibn-hisham-saqqa} فقہ، قراءت قرآن اور عمر کے عہد میں بصرہ و کوفہ کی گورنری کے لیے معروف ہیں۔ {cite:encyclopaedia-of-islam-2}"
  fr: "Compagnon de la tribu des Ash'ar, client de la famille d'Utba ibn Rabi'a ; il vint auprès du Prophète sur les deux navires venus d'Abyssinie. Connu comme juriste, récitant expert du Coran et gouverneur de Bassora et de Koufa sous Umar."
  es: "Compañero de la tribu Ashari, cliente de la familia de Utba ibn Rabi'a; llegó al Profeta en los dos barcos procedentes de Abisinia. Conocido como jurista, experto recitador del Corán y gobernador de Basora y Kufa bajo el reinado de Umar."
  tr: "Eş'ari kabilesinden, Beni Utbe ibn Rabi'ah ibn Abd Şems'in müttefiki olan Peygamber'in bir sahabesiydi. Negus'u iki gemiyle Hayber'de Peygamber'e götürenler arasındaydı. Fıkıh bilgisi, Kur'an okuması ve Ömer'in halifeliği döneminde Basra ve Kufa valiliğiyle tanınıyordu. El-Mas'udi'ye göre, Siffin Savaşı'ndan önce, bu milletin iki hakem atanana kadar sıkıntılarla boğuşmaya devam edeceğini anlatırdı. Suveyd ibn Gafleh ona hakem olmayı yasaklayınca, \"Allah bana ne cennette ne de yeryüzünde bir makam versin\" dedi. Sonra Irak halkının yanından bir hakemi kabul etti, ancak Ali onu kabul etmedi. Ancak el-Eş'at ve grubu ısrar etti. {kaynak: Muruj-al-Dhahab s. 682-683}"
  id: "Seorang sahabat Nabi dari suku Asy'ari, sekutu Bani Utbah ibn Rabi'ah ibn Abd Shams. Ia termasuk di antara mereka yang membawa Negus dengan dua kapal kepada Nabi di Khaybar. Ia terkenal karena ilmu hukumnya, pembacaan Al-Quran, dan jabatannya sebagai gubernur Basra dan Kufa selama kekhalifahan Umar. Menurut al-Mas'udi, sebelum Perang Siffin ia biasa menceritakan bahwa bangsa ini akan terus dilanda cobaan sampai dua penengah ditunjuk. Suwayd ibn Ghaflah melarangnya menjadi salah satu dari mereka, sehingga ia berkata, \"Semoga Allah tidak memberiku tempat di surga maupun tempat duduk di bumi.\" Kemudian ia menerima seorang penengah dari pihak penduduk Irak, tetapi Ali tidak menerimanya. Namun, al-Ash'ath dan kelompoknya bersikeras. {cite:muruj-al-dhahab hlm. 682-683}"
