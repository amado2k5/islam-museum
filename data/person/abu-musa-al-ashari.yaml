summary:
  ar: "صحابي من الأشعريين، حليف آل عتبة بن ربيعة بن عبد شمس. كان ممن حمل النجاشي في السفينتين إلى النبي بخيبر. مشهور بفقهه وقراءته للقرآن وتولّيه إمارة البصرة والكوفة في خلافة عمر. وعند المسعودي كان يحدث قبل صفين أن هذه الأمة لا تزال بها الفتن حتى يبعثوا حكمين فنهاه سويد بن غفلة أن يكون أحدهما فكان يقول لا جعل الله لي في السماء مصعداً ولا في الأرض مقعداً ثم رضي حكماً من جانب أهل العراق ولم يرضه علي لكن الأشعث وجماعته أصروا {cite:muruj-al-dhahab p. 682-683}"
  en: "Companion from the Ashari tribe, a client of the family of Utba ibn Rabi'a; came to the Prophet on the two ships from Abyssinia. Known as a jurist, expert Qur'an reciter and governor of Basra and Kufa under Umar."
