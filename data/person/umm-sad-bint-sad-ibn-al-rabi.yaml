summary:
  ar: ابنة سعد بن الربيع الذي قُتل يوم أحد وهي حمل؛ نشأت يتيمة في حجر أبي بكر، وتزوجها زيد بن ثابت فولدت له خارجة وسعداً وعثمان وسليمان وأم زيد؛ وبسببها وبسبب ميراثها ورد خبر في توريث الحمل.
  en: Daughter of Sa'd ibn al-Rabi', who was killed at Uhud while she was in the womb; she grew up an orphan in Abu Bakr's care and married Zayd ibn Thabit, bearing him Kharija, Sa'd, Uthman, Sulayman and Umm Zayd; a report on the inheritance
    of an unborn child is linked to her.
