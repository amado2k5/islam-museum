summary:
  ar: "السلطان عبد العزيز بن محمود الثاني ⁦(١٢٧٧–١٢٩٣هـ/١٨٦١–١٨٧٦م)⁩؛ عُزل ثم قُتل عام ١٢٩٣هـ/١٨٧٦م في انقلاب دبّره رجال الدولة. ينسب الصلابي المؤامرة إلى تخطيط القناصل وممثلي الدول الأوروبية عبر عملاء من رجال الدولة، وعلى رأسهم مدحت باشا الذي اعترف في محاكمته باشتراكه في عزله وقتله، وهذا أمر معروف تاريخياً ومدوَّن في الوثائق {cite:dawlat-uthmaniyya-salabi p. 394}."
  en: "Abdülaziz (r. 1277–1293/1861–1876) — deposed and then killed in the 1876 palace coup. Al-Salabi attributes the plot to European consuls and diplomats working through officials, led by Midhat Pasha, who admitted at his trial to taking part in the deposition and killing; he calls this 'a matter known to history and recorded in the documents' {cite:dawlat-uthmaniyya-salabi p. 394}."
  fr: "Abdülaziz (r. 1277–1293/1861–1876) — déposé puis tué lors du coup de palais de 1876. Al-Salabi attribue le complot à des consuls et diplomates européens agissant par l'intermédiaire de responsables, menés par Midhat Pacha, qui reconnut à son procès avoir pris part à la déposition et au meurtre ; il qualifie cela de « fait connu de l'histoire et consigné dans les documents » {cite:dawlat-uthmaniyya-salabi p. 394}."
  es: "Abdülaziz (r. 1277–1293/1861–1876) fue depuesto y asesinado en el golpe de palacio de 1876. Al-Salabi atribuye la conspiración a cónsules y diplomáticos europeos que actuaban a través de funcionarios, liderados por Midhat Pasha, quien admitió en su juicio haber participado en la deposición y el asesinato; él lo denomina «un asunto conocido por la historia y registrado en los documentos» {cite:dawlat-uthmaniyya-salabi p. 394}."
