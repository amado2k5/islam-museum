summary:
  ar: صحفية وإعلامية أويغورية أمريكية وُلدت سنة 1973 في أورومتشي؛ قدّمت أول برنامج تلفزيوني للأطفال بالأويغورية في الصين، ثم هاجرت إلى الولايات المتحدة سنة 2001 وصارت من أبرز صحفيي إذاعة آسيا الحرة في تغطية
    أوضاع الأويغور.
  en: Uyghur-American journalist born in Urumqi in 1973; she hosted China's first Uyghur-language children's television programme, emigrated to the United States in 2001, and became a leading Radio Free
    Asia reporter on the Uyghur situation.
  ur: اویغور امریکی صحافہ جو 1973 میں ارمچی میں پیدا ہوئی؛ چین میں پہلے اویغور بچوں کے ٹی وی پروگرام کی میزبان رہی، 2001 میں امریکہ منتقل ہوئی اور اویغور صورتحال پر ریڈیو فری ایشیا کی نمایاں رپورٹر بنی۔
  es: "Periodista uigur-estadounidense nacida en Urumqi en 1973; presentó el primer programa de televisión infantil en lengua uigur de China, emigró a Estados Unidos en 2001 y se convirtió en una destacada reportera de Radio Free Asia sobre la situación de los uigures."
  fr: "Journaliste ouïghoure-américaine née à Urumqi en 1973; elle a animé la première émission de télévision chinoise pour enfants en langue ouïghoure, a émigré aux États-Unis en 2001 et est devenue une reporter de premier plan pour Radio Free Asia sur la situation ouïghoure."
  tr: "1973 yılında Urumçi'de doğan Uygur-Amerikalı gazeteci ve medya profesyoneli olan Sher, Çin'deki ilk Uygur çocuk televizyon programını sundu, ardından 2001'de Amerika Birleşik Devletleri'ne göç etti ve Uygur durumunu takip eden Özgür Asya Radyosu'nun önde gelen gazetecilerinden biri oldu."
  id: "Seorang jurnalis dan profesional media Uyghur-Amerika yang lahir pada tahun 1973 di Urumqi; ia membawakan program televisi anak-anak berbahasa Uyghur pertama di Tiongkok, lalu pindah ke Amerika Serikat pada tahun 2001 dan menjadi salah satu jurnalis terkemuka untuk Radio Free Asia yang meliput situasi Uyghur."
