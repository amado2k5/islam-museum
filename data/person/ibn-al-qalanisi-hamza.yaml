summary:
  ar: "العميد بن القلانسي أبو يعلى حمزة بن أرشد التميمي الدمشقي الكاتب صاحب تاريخ دمشق الذي انتهى به إلى سنة خمس وخمسين وخمسمائة؛ حدث عن سهل بن بشر الإسفرائيني وولي رئاسة البلد مرتين وكان يسعى أيضاً المسلك؛ توفي في ربيع الأول سنة خمس وخمسين وخمسمائة عن بضع وثمانين سنة {cite:shadharat-dhahab p. 654}."
  en: "Al-Umayd Ibn al-Qalanisi Abu Ya'la Hamza ibn Arshad al-Tamimi of Damascus, chancery man and author of the Tarikh Dimashq which he carried down to the year 555; he transmitted from Sahl ibn Bishr al-Isfarayini, twice held the city's headship, and died in Rabi' I 555 at eighty-odd {cite:shadharat-dhahab p. 654}."
