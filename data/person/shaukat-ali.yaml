summary:
  ar: "سياسي هندي (1873–1938) من قادة حركة الخلافة، وهو الأخ الأكبر لمحمد علي جوهر. تعلم في جامعة عليكرة الإسلامية وعمل في الخدمة المدنية سبعة عشر عامًا، وساعد أخاه في إصدار «همدرد» و«كومريد»، وانتُخب آخر رئيس لمؤتمر الخلافة سنة 1919 وهو في السجن، وسُجن 1921–1923. عارض تقرير نهرو، وحضر مؤتمري المائدة المستديرة، ونظم المؤتمر الإسلامي العالمي في القدس بعد وفاة أخيه، وانضم إلى العصبة الإسلامية سنة 1936 وكان عضوًا في الجمعية المركزية حتى وفاته في دلهي."
  en: "Indian politician (1873–1938), a leader of the Khilafat movement and the elder brother of Muhammad Ali Jauhar. Educated at Aligarh Muslim University, he served seventeen years in the civil service, helped his brother publish Hamdard and Comrade, was elected the last president of the Khilafat Conference in 1919 while in jail, and was imprisoned again from 1921 to 1923. He opposed the Nehru Report, attended the Round Table Conferences, organised the World Muslim Conference in Jerusalem after his brother's death, joined the Muslim League in 1936, and sat in the Central Assembly until his death at Delhi."
  ur: "ہندوستانی سیاست دان ⁦(1873ء–1938ء)⁩، تحریک خلافت کے رہنما اور محمد علی جوہر کے بڑے بھائی۔ جامعہ علی گڑھ سے تعلیم پائی اور سترہ سال سرکاری ملازمت کی، بھائی کے «ہمدرد» اور «کامریڈ» کی اشاعت میں مدد کی، 1919ء میں قید کے دوران خلافت کانفرنس کے آخری صدر منتخب ہوئے اور 1921ء سے 1923ء تک پھر قید رہے۔ نہرو رپورٹ کی مخالفت کی، گول میز کانفرنسوں میں شریک ہوئے، بھائی کی وفات کے بعد بیت المقدس میں عالمی مسلم کانفرنس منعقد کی، 1936ء میں مسلم لیگ میں شامل ہوئے اور دہلی میں وفات تک مرکزی اسمبلی کے رکن رہے۔"
  es: "Político indio (1873-1938), líder del movimiento Khilafat y hermano mayor de Muhammad Ali Jauhar. Estudió en la Universidad Musulmana de Aligarh, sirvió diecisiete años en la administración pública, ayudó a su hermano a publicar Hamdard y Camarada, fue elegido último presidente de la Conferencia Khilafat en 1919 mientras estaba en prisión, y fue encarcelado nuevamente de 1921 a 1923. Se opuso al Informe Nehru, asistió a las Conferencias de Mesa Redonda, organizó la Conferencia Mundial Musulmana en Jerusalén tras la muerte de su hermano, se unió a la Liga Musulmana en 1936 y ocupó un escaño en la Asamblea Central hasta su fallecimiento en Delhi."
  fr: "Homme politique indien (1873-1938), figure de proue du mouvement Khilafat et frère aîné de Muhammad Ali Jauhar. Après des études à l'Université musulmane d'Aligarh, il travailla dix-sept ans dans la fonction publique, aida son frère à publier Hamdard et Comrade, fut élu dernier président de la Conférence du Khilafat en 1919 alors qu'il était emprisonné, et fut de nouveau incarcéré de 1921 à 1923. Opposé au rapport Nehru, il participa aux Conférences de la Table ronde, organisa la Conférence musulmane mondiale à Jérusalem après la mort de son frère, rejoignit la Ligue musulmane en 1936 et siégea à l'Assemblée centrale jusqu'à son décès à Delhi."
  tr: "Hindistanlı bir politikacı (1873–1938), Hilafe Hareketi'nin liderlerinden biri ve Muhammed Ali Johar'ın ağabeyi. Aligarh İslam Üniversitesi'nde eğitim gördü ve on yedi yıl boyunca kamu hizmetinde çalıştı, kardeşine 'Hamdard' ve 'Yoldaş' isimlerini çıkarmasına yardımcı oldu. 1919'da hapisteyken Hilafe Kongresi'nin son başkanı seçildi ve 1921'den 1923'e kadar hapis kaldı. Nehru Raporu'na karşı çıktı, Yuvarlak Masa Konferanslarına katıldı, kardeşinin ölümünden sonra Kudüs'te Dünya İslam Konferansı'nı düzenledi, 1936'da Müslüman Birliği'ne katıldı ve Delhi'deki ölümüne kadar Merkez Meclis üyesiydi."
  id: "Seorang politikus India (1873–1938), salah satu pemimpin Gerakan Khilafa, dan kakak dari Muhammad Ali Johar. Ia belajar di Universitas Islam Aligarh dan bekerja di dinas sipil selama tujuh belas tahun, membantu saudaranya menerbitkan 'Hamdard' dan 'Comrade'. Ia terpilih sebagai presiden terakhir Khilafa Congress pada tahun 1919 saat di penjara, dan dipenjara dari tahun 1921 hingga 1923. Ia menentang Laporan Nehru, menghadiri Konferensi Meja Bundar, mengorganisir Konferensi Islam Dunia di Yerusalem setelah kematian saudaranya, bergabung dengan Liga Muslim pada tahun 1936, dan menjadi anggota Majelis Pusat hingga wafat di Delhi."
