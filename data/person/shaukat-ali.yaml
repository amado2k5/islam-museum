summary:
  ar: "سياسي هندي (1873–1938) من قادة حركة الخلافة، وهو الأخ الأكبر لمحمد علي جوهر. تعلم في جامعة عليكرة الإسلامية وعمل في الخدمة المدنية سبعة عشر عامًا، وساعد أخاه في إصدار «همدرد» و«كومريد»، وانتُخب آخر رئيس لمؤتمر الخلافة سنة 1919 وهو في السجن، وسُجن 1921–1923. عارض تقرير نهرو، وحضر مؤتمري المائدة المستديرة، ونظم المؤتمر الإسلامي العالمي في القدس بعد وفاة أخيه، وانضم إلى العصبة الإسلامية سنة 1936 وكان عضوًا في الجمعية المركزية حتى وفاته في دلهي."
  en: "Indian politician (1873–1938), a leader of the Khilafat movement and the elder brother of Muhammad Ali Jauhar. Educated at Aligarh Muslim University, he served seventeen years in the civil service, helped his brother publish Hamdard and Comrade, was elected the last president of the Khilafat Conference in 1919 while in jail, and was imprisoned again from 1921 to 1923. He opposed the Nehru Report, attended the Round Table Conferences, organised the World Muslim Conference in Jerusalem after his brother's death, joined the Muslim League in 1936, and sat in the Central Assembly until his death at Delhi."
  ur: "ہندوستانی سیاست دان (1873ء–1938ء)، تحریک خلافت کے رہنما اور محمد علی جوہر کے بڑے بھائی۔ جامعہ علی گڑھ سے تعلیم پائی اور سترہ سال سرکاری ملازمت کی، بھائی کے «ہمدرد» اور «کامریڈ» کی اشاعت میں مدد کی، 1919ء میں قید کے دوران خلافت کانفرنس کے آخری صدر منتخب ہوئے اور 1921ء سے 1923ء تک پھر قید رہے۔ نہرو رپورٹ کی مخالفت کی، گول میز کانفرنسوں میں شریک ہوئے، بھائی کی وفات کے بعد بیت المقدس میں عالمی مسلم کانفرنس منعقد کی، 1936ء میں مسلم لیگ میں شامل ہوئے اور دہلی میں وفات تک مرکزی اسمبلی کے رکن رہے۔"
