summary:
  ar: "مصلح ديني مجاهد من مسلمي الهند، ولد في بريلي سنة 1201هـ/1786م، وتتلمذ في دلهي على شاه عبد العزيز، وغزا البنجاب ضد السيخ، وقُتل في بالاكوت سنة 1246هـ/1831م. كان يدعو إلى إسلام خالص بعيد عن البدع وتعظيم الأولياء، وكانت تعاليمه قريبة من تعاليم الوهابيين في الجزيرة العربية {cite:encyclopaedia-of-islam-2 vol. 1 p. 304}."
  en: "A militant religious reformer of Muslim India, born at Bareilly on 6 Safar 1201/28 November 1786. He studied at Delhi under Shah 'Abd al-'Aziz and served in the army of Amir Khan of Tonk. He led a jihad against the Sikhs, and was killed at Balakot in 1246/1831. His call to a pure and simple religion, free of innovation and of exaggerated veneration of saints, resembled that of the Arabian Wahhabis {cite:encyclopaedia-of-islam-2 vol. 1 p. 304}."
