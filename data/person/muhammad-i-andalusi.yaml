id: person/muhammad-i-andalusi
class: person
label: { ar: "محمد الأول بن عبد الرحمن" }
summary:
  ar: "سادس أمراء بني أمية بقرطبة (سنة ٢٣٨–٢٧٣هـ)؛ لما استمدّ أهل طليطلة المخالفون بملكي جليقية والبشكنس لقيهم على وادي سليطة وقد أكمن لهم فأوقع بهم وبلغت عدة القتلى من أهل طليطلة والمشركين عشرين ألفاً {cite:nafh-tib-maqqari p. 386}. وفي سنة ٢٤٥هـ ظهرت مراكب المجوس فلقيهم مراكبه فقاتلوهم وغنموا منهم مركبين {cite:nafh-tib-maqqari p. 387}. وسنة ٢٤٧هـ أغزى إلى نواحي بنبلونة فأسر فرتون ابن صاحبها فبقي أسيراً بقرطبة عشرين سنة، وفي أيامه خربت ماردة وهدمت ولم يبق لها أثر {cite:nafh-tib-maqqari p. 387}."
  en: "Sixth Umayyad emir of Córdoba (AH 238–273): he ambushed Toledo and its Galician-Pamplonan allies at Wadi Salit leaving twenty thousand dead, beat off the Majus ships in 245, held Fortún of Pamplona captive in Córdoba for twenty years, and saw Mérida razed to no trace {cite:nafh-tib-maqqari pp. 386–387}."
