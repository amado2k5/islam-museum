id: person/muhammad-i-andalusi
class: person
label: { ar: "محمد الأول بن عبد الرحمن" }
summary:
  ar: "سادس أمراء بني أمية بقرطبة ⁦(سنة ٢٣٨–٢٧٣هـ)⁩؛ لما استمدّ أهل طليطلة المخالفون بملكي جليقية والبشكنس لقيهم على وادي سليطة وقد أكمن لهم فأوقع بهم وبلغت عدة القتلى من أهل طليطلة والمشركين عشرين ألفاً {cite:nafh-tib-maqqari p. 386}. وفي سنة ٢٤٥هـ ظهرت مراكب المجوس فلقيهم مراكبه فقاتلوهم وغنموا منهم مركبين {cite:nafh-tib-maqqari p. 387}. وسنة ٢٤٧هـ أغزى إلى نواحي بنبلونة فأسر فرتون ابن صاحبها فبقي أسيراً بقرطبة عشرين سنة، وفي أيامه خربت ماردة وهدمت ولم يبق لها أثر {cite:nafh-tib-maqqari p. 387}."
  en: "Sixth Umayyad emir of Córdoba (AH 238–273): he ambushed Toledo and its Galician-Pamplonan allies at Wadi Salit leaving twenty thousand dead, beat off the Majus ships in 245, held Fortún of Pamplona captive in Córdoba for twenty years, and saw Mérida razed to no trace {cite:nafh-tib-maqqari pp. 386–387}."
  es: "Sexto emir omeya de Córdoba (AH 238–273): emboscó a Toledo y a sus aliados gallegos-pamplonanos en Wadi Salit, dejando veinte mil muertos; rechazó los barcos de Majus en 245; mantuvo cautivo a Fortún de Pamplona en Córdoba durante veinte años; y vio cómo Mérida quedaba reducida a cenizas {cite:nafh-tib-maqqari pp. 386–387}."
  fr: "Sixième émir omeyyade de Cordoue (AH 238–273): il tendit une embuscade à Tolède et à ses alliés galiciens-pamploniens à Wadi Salit, laissant vingt mille morts, repoussa les navires majus en 245, tint Fortún de Pampelune captif à Cordoue pendant vingt ans et vit Mérida rasée jusqu'à la dernière trace {cite:nafh-tib-maqqari pp. 386–387}."
  ur: "قرطبہ کا چھٹا اموی امیر ⁦(اے ایچ 238-273)⁩: اس نے ٹولیڈو اور اس کے گالیشین-پیمپلون اتحادیوں پر وادی سالیت پر گھات لگا کر بیس ہزار افراد کو ہلاک کر دیا، 245 میں مجوس کے جہازوں کو شکست دی، پامپلونا کے فورٹون کو قرطبہ میں قید کر لیا، اور دو سال تک مریدان کو اسیر کر لیا۔ {حوالہ: نفح تبع مقری صفحہ 386-387}۔"
  tr: "Cordoba'daki altıncı Emevi prensi (238–273 Hj); Toledo'nun karşıt halkı Galiçya ve Başkanların krallıklarını ele geçirdiğinde, Salita Vadisi'nde onları pusuya düşürdü ve onları esaret altına aldı. Toledo halkı ve müşrikləri arasında ölü sayısı yirmi bine ulaştı {cite:nafh-tib-maqqari s. 386}. 245 Hicri yılında, Magi gemileri ortaya çıktı ve gemileri onlarla karşılaştı, savaştı ve iki gemiyi ele geçirdi {cite:nafh-tib-maqqari s. 387}. 247 Hicri yılında, Benbolona bölgelerine baskın düzenledi, sahibinin oğlu Ferton'u esir aldı ve yirmi yıl boyunca Cordoba'da esir kaldı. Hayatı boyunca Mareda yok edildi ve yok edildi, hiçbir iz bırakmadı {cite:nafh-tib-maqqari, s. 387}."
  id: "Pangeran Umayyah keenam di Cordoba (238–273 H); ketika rakyat Toledo yang berlawanan menguasai kerajaan Galicia dan Bashkan, ia bertemu mereka di Lembah Salita dan menyergap, menyebabkan mereka tertawa. Jumlah korban tewas di antara rakyat Toledo dan para musyrik mencapai dua puluh ribu {cite:nafh-tib-maqqari hlm. 386}. Pada tahun 245 H, kapal-kapal Majus muncul, dan kapal-kapalnya bertemu mereka, bertempur, dan merebut dua kapal {cite:nafh-tib-maqqari hlm. 387}. Pada tahun 247 H, ia menyerang wilayah Benbolona, menangkap Ferton, putra pemiliknya, dan menjadi tawanan di Cordoba selama dua puluh tahun. Selama masa kehidupannya, Mareda dihancurkan dan dihancurkan, tanpa meninggalkan jejak {cite:nafh-tib-maqqari, hlm. 387}."
