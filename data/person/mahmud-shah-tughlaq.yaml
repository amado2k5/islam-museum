summary:
  ar: "آخر سلاطين آل تغلق في دلهي ⁦(حكم 1394-1413)⁩، ابن السلطان ناصر الدين محمد شاه الثالث. اعتلى العرش بعد أخيه علاء الدين سكندر شاه سنة 1394، فنازعه قريبه نصرت شاه ثلاث سنين؛ كان محمود في دلهي ونصرت على فيروز آباد. وفي عهده غزا تيمور الهند فهُزم عند دلهي سنة 1398 ودخل تيمور المدينة ونهبها، فتفرّقت أقاليم السلطنة مستقلةً. توفي في فبراير 1413 ⁦(ذو القعدة 815هـ في الترجمة العربية)⁩، وبوفاته انتهت الدولة التغلقية وخلفه السادات. لا تُعرف له سنة ولادة."
  en: "The last Tughlaq sultan of Delhi (r. 1394–1413), son of Sultan Nasir al-Din Muhammad Shah III. He succeeded his brother Ala al-Din Sikandar Shah in 1394 and was challenged for three years by his relative Nusrat Shah, Mahmud ruling from Delhi and Nusrat from Firozabad. In 1398 Timur invaded India, defeated him before Delhi and sacked the city, after which province after province broke away from the shrunken sultanate. He died in February 1413 — Dhu al-Qa'da 815 AH in the Arabic biography — and with him the Tughlaq dynasty ended, the Sayyids succeeding at Delhi. No birth year is recorded for him."
  ur: "دہلی کے آخری تغلق سلطان ⁦(دورِ حکومت 1394ء–1413ء)⁩، سلطان ناصر الدین محمد شاہ ثالث کے بیٹے۔ وہ 1394ء میں اپنے بھائی علاء الدین سکندر شاہ کے بعد تخت نشین ہوئے اور تین برس تک ان کے رشتے دار نصرت شاہ نے ان سے تخت کا تنازع رکھا؛ محمود دہلی سے اور نصرت فیروز آباد سے حکومت کرتا رہا۔ 1398ء میں تیمور نے ہندوستان پر حملہ کیا، دہلی کے سامنے انھیں شکست دی اور شہر کو لوٹا، جس کے بعد سلطنت کے صوبے یکے بعد دیگرے آزاد ہوتے گئے۔ وہ فروری 1413ء ⁦(عربی سوانح میں ذی القعدہ 815ھ)⁩ میں فوت ہوئے، اور ان کے ساتھ تغلق خاندان کا خاتمہ ہوا اور دہلی میں سید خاندان برسرِ اقتدار آیا۔ ان کا سالِ ولادت معلوم نہیں۔"
  es: "El último sultán Tughlaq de Delhi (r. 1394–1413), hijo del sultán Nasir al-Din Muhammad Shah III. Sucedió a su hermano Ala al-Din Sikandar Shah en 1394 y fue desafiado durante tres años por su pariente Nusrat Shah, Mahmud gobernando desde Delhi y Nusrat desde Firozabad. En 1398, Timur invadió la India, lo derrotó antes de llegar a Delhi y saqueó la ciudad, tras lo cual provincia tras provincia se independizó del reducido sultanato. Murió en febrero de 1413 —Dhu al-Qa'da 815 AH en la biografía árabe— y con él terminó la dinastía Tughlaq, siendo sucedidos los Sayyid en Delhi. No se registra su año de nacimiento."
  fr: "Le dernier sultan Tughlaq de Delhi (r. 1394-1413), fils du sultan Nasir al-Din Muhammad Shah III, succéda à son frère Ala al-Din Sikandar Shah en 1394. Son pouvoir fut contesté pendant trois ans par son parent Nusrat Shah, Mahmud régnant depuis Delhi et Nusrat depuis Firozabad. En 1398, Timour Ier envahit l'Inde, le vainquit aux portes de Delhi et pilla la ville. Suite à cela, plusieurs provinces se séparèrent du sultanat affaibli. Il mourut en février 1413 (Dhu al-Qa'da 815 AH selon la biographie arabe), marquant la fin de la dynastie Tughlaq et l'accession au pouvoir des Sayyids à Delhi. Sa date de naissance n'est pas connue."
  tr: "Delhi'deki Taghlaq ailesinin son sultanı (1394-1413 yılları arasında hüküm sürdü), Sultan Nasiruddin Muhammed Şah III'ün oğluydu. 1394'te kardeşi Alauddin Sikandar Şah'tan sonra tahta çıktı; akrabası Nusrat Şah üç yıl boyunca onunla tartışmaya girdiğinde; Mahmud Delhi'deydi ve Nusrat Firozabad'ı fethetti. Saltanatı sırasında Timur Hindistan'ı işgal etti ve 1398'de Delhi'de yenildi. Timur şehre girdi ve yağmaladı, bu da Sultanlık topraklarının dağılmasına yol açtı. Şubat 1413'te öldü (Arapça çevirisinde Dhu al-Qi'dah 815 Hj) ve ölümüyle birlikte Tughlaqid devleti sona erdi ve yerine Sedat geçti. Doğum yılı bilinmemektedir."
  id: "Sultan terakhir keluarga Taghlaq di Delhi (memerintah 1394-1413), putra Sultan Nasiruddin Muhammad Shah III. Ia naik takhta setelah saudaranya Alauddin Sikandar Shah pada tahun 1394, ketika kerabatnya Nusrat Shah berseterha selama tiga tahun; Mahmud berada di Delhi, dan Nusrat menaklukkan Firozabad. Selama pemerintahannya, Timur menyerbu India dan dikalahkan di Delhi pada tahun 1398. Timur memasuki kota dan menjarahnya, yang menyebabkan tersebarnya wilayah Kesultanan. Ia meninggal pada Februari 1413 (Dhu al-Qi'dah 815 AH dalam terjemahan Arab), dan dengan kematiannya, negara Tughlaqid berakhir dan ia digantikan oleh Sadat. Tahun kelahirannya tidak diketahui."

