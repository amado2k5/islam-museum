summary:
  ar: "آخر سلاطين آل تغلق في دلهي (حكم 1394-1413)، ابن السلطان ناصر الدين محمد شاه الثالث. اعتلى العرش بعد أخيه علاء الدين سكندر شاه سنة 1394، فنازعه قريبه نصرت شاه ثلاث سنين؛ كان محمود في دلهي ونصرت على فيروز آباد. وفي عهده غزا تيمور الهند فهُزم عند دلهي سنة 1398 ودخل تيمور المدينة ونهبها، فتفرّقت أقاليم السلطنة مستقلةً. توفي في فبراير 1413 (ذو القعدة 815هـ في الترجمة العربية)، وبوفاته انتهت الدولة التغلقية وخلفه السادات. لا تُعرف له سنة ولادة."
  en: "The last Tughlaq sultan of Delhi (r. 1394–1413), son of Sultan Nasir al-Din Muhammad Shah III. He succeeded his brother Ala al-Din Sikandar Shah in 1394 and was challenged for three years by his relative Nusrat Shah, Mahmud ruling from Delhi and Nusrat from Firozabad. In 1398 Timur invaded India, defeated him before Delhi and sacked the city, after which province after province broke away from the shrunken sultanate. He died in February 1413 — Dhu al-Qa'da 815 AH in the Arabic biography — and with him the Tughlaq dynasty ended, the Sayyids succeeding at Delhi. No birth year is recorded for him."
  ur: "دہلی کے آخری تغلق سلطان (دورِ حکومت 1394ء–1413ء)، سلطان ناصر الدین محمد شاہ ثالث کے بیٹے۔ وہ 1394ء میں اپنے بھائی علاء الدین سکندر شاہ کے بعد تخت نشین ہوئے اور تین برس تک ان کے رشتے دار نصرت شاہ نے ان سے تخت کا تنازع رکھا؛ محمود دہلی سے اور نصرت فیروز آباد سے حکومت کرتا رہا۔ 1398ء میں تیمور نے ہندوستان پر حملہ کیا، دہلی کے سامنے انھیں شکست دی اور شہر کو لوٹا، جس کے بعد سلطنت کے صوبے یکے بعد دیگرے آزاد ہوتے گئے۔ وہ فروری 1413ء (عربی سوانح میں ذی القعدہ 815ھ) میں فوت ہوئے، اور ان کے ساتھ تغلق خاندان کا خاتمہ ہوا اور دہلی میں سید خاندان برسرِ اقتدار آیا۔ ان کا سالِ ولادت معلوم نہیں۔"

