label: { ar: "سليمان بن الحسن الوزير" }
summary:
  ar: "وزير عباسي قُبض عليه في سنة تسع عشرة وثلاثمائة، وذلك بعد أن ضاق المال في أيامه، وقُلّد أبو القاسم عبيد الله بن محمد الكلواذي الوزارة بعده {cite:tabari-tarikh-abu-al-fadl j.11 p.138}."
  tr: "Bir Abbasi veziri, 1300 Hicri yılında, zamanında serveti azaldıktan sonra tutuklandı. Ebu el-Kasım Ubeyd Allah ibn Muhammed el-Kalwadhi onun yerine geçti {atıf:tabari-tarikh-abu-al-fadl j.11 s.138}."
  id: "Seorang wazir Abbasiyah ditangkap pada tahun 1300 H, setelah kekayaan menjadi langka selama masa jabatannya. Abu al-Qasim Ubayd Allah ibn Muhammad al-Kalwadhi menggantikannya {cite:tabari-tarikh-abu-al-fadl j.11 hlm.138}."
