summary:
  ar: "حاكم إمارة الشارقة وعضو المجلس الأعلى لاتحاد الإمارات منذ 25 يناير 1972 ⁦(مولود 1939)⁩، مؤرخ وكاتب ومسرحي، أول وزير للتربية في الإمارات (1971)، أسس الجامعة الأمريكية بالشارقة وجامعة الشارقة ورأسهما، وألّف أكثر من ثمانين كتابًا في التاريخ والأدب والمسرح، ونال جائزة الملك فيصل لخدمة الإسلام (2002)."
  en: "Ruler of Sharjah and member of the UAE Federal Supreme Council since 25 January 1972 (born 1939); historian, author and playwright, the UAE's first Minister of Education (1971), founder and president of the American University of Sharjah and the University of Sharjah, author of more than eighty books of history, literature and drama; King Faisal Prize for Service to Islam (2002)."
  ur: "امارتِ شارجہ کے حکمران اور 25 جنوری 1972ء سے متحدہ عرب امارات کی وفاقی سپریم کونسل کے رکن ⁦(پیدائش 1939ء)⁩؛ مؤرخ، مصنف اور ڈراما نگار، امارات کے پہلے وزیرِ تعلیم ⁦(1971ء)⁩، امریکن یونیورسٹی آف شارجہ اور یونیورسٹی آف شارجہ کے بانی اور سربراہ، تاریخ، ادب اور ڈرامے پر اسّی سے زیادہ کتب کے مصنف؛ شاہ فیصل انعام برائے خدمتِ اسلام ⁦(2002ء)⁩۔"
