summary:
  ar: "حاكم إمارة الشارقة وعضو المجلس الأعلى لاتحاد الإمارات منذ 25 يناير 1972 ⁦(مولود 1939)⁩، مؤرخ وكاتب ومسرحي، أول وزير للتربية في الإمارات (1971)، أسس الجامعة الأمريكية بالشارقة وجامعة الشارقة ورأسهما، وألّف أكثر من ثمانين كتابًا في التاريخ والأدب والمسرح، ونال جائزة الملك فيصل لخدمة الإسلام (2002)."
  en: "Ruler of Sharjah and member of the UAE Federal Supreme Council since 25 January 1972 (born 1939); historian, author and playwright, the UAE's first Minister of Education (1971), founder and president of the American University of Sharjah and the University of Sharjah, author of more than eighty books of history, literature and drama; King Faisal Prize for Service to Islam (2002)."
  ur: "امارتِ شارجہ کے حکمران اور 25 جنوری 1972ء سے متحدہ عرب امارات کی وفاقی سپریم کونسل کے رکن ⁦(پیدائش 1939ء)⁩؛ مؤرخ، مصنف اور ڈراما نگار، امارات کے پہلے وزیرِ تعلیم ⁦(1971ء)⁩، امریکن یونیورسٹی آف شارجہ اور یونیورسٹی آف شارجہ کے بانی اور سربراہ، تاریخ، ادب اور ڈرامے پر اسّی سے زیادہ کتب کے مصنف؛ شاہ فیصل انعام برائے خدمتِ اسلام ⁦(2002ء)⁩۔"
  es: "Gobernante de Sharjah y miembro del Consejo Supremo Federal de los EAU desde el 25 de enero de 1972 (nacido en 1939); historiador, autor y dramaturgo, primer Ministro de Educación de los EAU (1971), fundador y presidente de la Universidad Americana de Sharjah y de la Universidad de Sharjah, autor de más de ochenta libros de historia, literatura y teatro; Premio Rey Faisal al Servicio del Islam (2002)."
  fr: "Émir de Sharjah et membre du Conseil suprême fédéral des Émirats arabes unis depuis le 25 janvier 1972 (né en 1939); historien, auteur et dramaturge, premier ministre de l'Éducation des Émirats arabes unis (1971), fondateur et président de l'Université américaine de Sharjah et de l'Université de Sharjah, auteur de plus de quatre-vingts ouvrages d'histoire, de littérature et de théâtre; Prix du roi Faisal pour services rendus à l'islam (2002)."
  tr: "Sharjah Emirliği'nin hükümdarı ve 25 Ocak 1972'den beri (d. 1939) Emirlikler Birliği Yüksek Konseyi üyesi, tarihçi, yazar ve oyun yazarı, BAE'nin ilk Eğitim Bakanı (1971), Amerikan Sharjah Üniversitesi ve Sharjah Üniversitesi'ni kurup yönetti, tarih, edebiyat ve tiyatro alanında seksenden fazla kitap yazdı ve İslam'a Hizmet için Kral Faysal Ödülü'nü (2002) aldı."
  id: "Penguasa Emirat Sharjah dan anggota Dewan Tertinggi Uni Emirat sejak 25 Januari 1972 (lahir 1939), sejarawan, penulis, dan dramawan, Menteri Pendidikan pertama di UEA (1971), mendirikan dan memimpin American University of Sharjah dan University of Sharjah, menulis lebih dari delapan puluh buku dalam sejarah, sastra, dan teater, serta menerima King Faisal Prize for Service to Islam (2002)."
