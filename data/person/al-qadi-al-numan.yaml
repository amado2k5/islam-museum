summary:
  ar: "أبو حنيفة النعمان بن أبي عبد الله محمد بن منصور بن أحمد بن حيون، القاضي النعمان الداعي؛ أحد أئمة الفقه الإسماعيلي وقاضي المعز لدين الله الفاطمي وداعيه؛ كان مالكي المذهب ثم انتقل إلى مذهب الإمامية؛ لازم المعز في إفريقية ودخل معه الديار المصرية؛ له تصانيف كثيرة منها كتاب دعائم الإسلام وكتاب افتتاح الدعوة وكتاب اختلاف أصول المذاهب وكتاب الأخبار في الفقه؛ ذكره المسبحي في تاريخه فوصفه بالعلم والفقه والدين والنبل {cite:wafayat-ayan}."
  en: "Abu Hanifa al-Nu'man b. Muhammad — al-Qadi al-Nu'man; chief jurist and da'i of the Fatimid caliph al-Mu'izz; moved from Maliki law to the Ismaili school; author of Da'a'im al-Islam, Iftitah al-Da'wa and many other works {cite:wafayat-ayan}."
