label: { ar: "عبد الله بن محمد الأزدي" }
summary:
  ar: "أبو عبد الرحمن شيخ أبي داوود والنسائي، حمل إلى الواثق مكبلاً بالحديد في المحنة فسأل ابن أبي دؤاد عن القول الذي دعوا الناس إليه أعلمه رسول الله فلم يدع إليه أم شيء لم يعلمه فقال بل علمه قال فكان يسعه ألا يدعو الناس إليه وأنتم لا يسعكم فبهتوا وضحك الواثق وقال وسع النبي أن يسكت عنه ولا يسعنا فأمر أن يعطى ثلاث مئة دينار وأن يرد إلى بلده ولم يمتحن أحداً بعدها ومقت ابن أبي دؤاد من يومئذ {cite:tarikh-khulafa-minhaj-1434 p. 531}."
  en: "Abu Abd al-Rahman, shaykh of Abu Dawud and al-Nasa'i; hauled in irons to al-Wathiq he asked Ibn Abi Du'ad: did the Prophet know this doctrine and leave it alone, or not know it? — 'He knew it' — 'then it sufficed him not to call people to it, but it does not suffice you?' They were dumbfounded; al-Wathiq laughed, gave him three hundred dinars, sent him home, examined no one after, and loathed Ibn Abi Du'ad from that day {cite:tarikh-khulafa-minhaj-1434 p. 531}."
