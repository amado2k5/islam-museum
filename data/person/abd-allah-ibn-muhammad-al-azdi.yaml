id: person/abd-allah-ibn-muhammad-al-azdi
class: person
label: { ar: "عبد الله بن محمد الأزدي", en: "Abdallah ibn Muhammad al-Azdi", fr: "Abdallah ibn Muhammad al-Azdi", es: "Abdallah ibn Muhammad al-Azdi", ur: "عبداللہ بن محمد ازدی" }
summary:
  ar: "أبو عبد الرحمن شيخ أبي داوود والنسائي، حمل إلى الواثق مكبلاً بالحديد في المحنة فسأل ابن أبي دؤاد عن القول الذي دعوا الناس إليه أعلمه رسول الله فلم يدع إليه أم شيء لم يعلمه فقال بل علمه قال فكان يسعه ألا يدعو الناس إليه وأنتم لا يسعكم فبهتوا وضحك الواثق وقال وسع النبي أن يسكت عنه ولا يسعنا فأمر أن يعطى ثلاث مئة دينار وأن يرد إلى بلده ولم يمتحن أحداً بعدها ومقت ابن أبي دؤاد من يومئذ {cite:tarikh-khulafa-minhaj-1434 p. 531}."
  en: "Abu Abd al-Rahman, shaykh of Abu Dawud and al-Nasa'i; hauled in irons to al-Wathiq he asked Ibn Abi Du'ad: did the Prophet know this doctrine and leave it alone, or not know it? — 'He knew it' — 'then it sufficed him not to call people to it, but it does not suffice you?' They were dumbfounded; al-Wathiq laughed, gave him three hundred dinars, sent him home, examined no one after, and loathed Ibn Abi Du'ad from that day {cite:tarikh-khulafa-minhaj-1434 p. 531}."
  fr: "Abu Abd al-Rahman, maître d'Abu Dawud et d'al-Nasa'i ; amené enchaîné devant al-Wathiq, il demanda à Ibn Abi Du'ad : le Prophète connaissait-il cette doctrine et la laissa-t-il de côté, ou ne la connaissait-il pas ? — « Il la connaissait » — « alors il lui suffisait de ne pas y appeler les gens, mais cela ne te suffit pas ? » Ils restèrent interdits ; al-Wathiq rit, lui donna trois cents dinars, le renvoya chez lui, n'éprouva plus personne ensuite, et détesta Ibn Abi Du'ad à partir de ce jour {cite:tarikh-khulafa-minhaj-1434 p. 531}."
  es: "Abu Abd al-Rahman, jeque de Abu Dawud y al-Nasa'i, llevó encadenado a al-Wathiq y le preguntó a Ibn Abi Du'ad: ¿Acaso el Profeta conocía esta doctrina y la dejó de lado, o no la conocía? — «La conocía». — «Entonces le bastó con no llamar a la gente a ella, ¿pero a ti no te basta?». Se quedaron estupefactos; al-Wathiq se rió, le dio trescientos dinares, lo envió a casa, no volvió a interrogar a nadie y desde ese día detestó a Ibn Abi Du'ad {cite:tarikh-khulafa-minhaj-1434 p. 531}."
  ur: "ابو عبدالرحمٰن، ابوداؤد اور النسائی کے شیخ؛ اس نے ابن ابی دعد سے پوچھا: کیا نبی اس عقیدہ کو جانتے تھے اور اسے چھوڑ دیتے تھے یا نہیں جانتے تھے؟ - 'وہ یہ جانتا تھا' - 'پھر یہ کافی تھا کہ وہ لوگوں کو اس کی طرف نہ بلائے، لیکن یہ آپ کے لیے کافی نہیں ہے؟' وہ ہکا بکا رہ گئے۔ الوثیق ہنسا، اسے تین سو دینار دیے، گھر بھیج دیا، اس کے بعد کسی کی جانچ نہیں کی، اور اس دن سے ابن ابی داؤد سے نفرت کی۔ 531}۔"
  tr: "Ebu Davud ve Nesai'nin şeyhi Ebu Abdülrahman, imtihan sırasında zincire vurulmuş halde Vatikak'ın huzuruna getirildi. İbn Ebu Duad'a, insanları çağırdıkları söz hakkında sordu: \"Allah'ın Resulü bunu biliyor muydu da çağırmadı mı, yoksa bilmediği bir şey miydi?\" İbn Ebu Duad, \"Hayır, biliyordu\" dedi. İbn Ebu Duad, \"Öyleyse, insanları çağırmaması caizdi, ama sizin için caiz değil\" dedi. İnsanlar şaşırdılar ve Vatikak gülerek, \"Peygamberin bu konuda sessiz kalması caizdi, ama bizim için caiz değil\" dedi. Bunun üzerine İbn Ebu Duad'a üç yüz dinar verilmesini ve ülkesine geri gönderilmesini emretti ve ondan sonra kimseyi sınamadı ve o günden itibaren İbn Ebu Duad'dan nefret etti. {Kaynak:tarikh-khulafa-minhaj-1434 s. 531}"
  id: "Abu Abd al-Rahman, syekh Abu Dawud dan al-Nasa’i, dibawa ke hadapan al-Wathiq dalam keadaan terikat selama cobaan itu. Ia bertanya kepada Ibn Abi Du’ad tentang ucapan yang mereka serukan kepada orang-orang: Apakah Rasulullah mengetahuinya tetapi tidak menyerukannya, atau apakah itu sesuatu yang tidak beliau ketahui? Ia menjawab: Lebih tepatnya, beliau mengetahuinya. Al-Wathiq berkata: Maka diperbolehkan baginya untuk tidak menyerukannya kepada orang-orang, tetapi tidak diperbolehkan bagi kalian. Mereka tercengang, dan al-Wathiq tertawa dan berkata: Diperbolehkan bagi Nabi untuk tetap diam tentang hal itu, tetapi tidak diperbolehkan bagi kita. Maka ia memerintahkan agar Ibn Abi Du’ad diberi tiga ratus dinar dan dikembalikan ke negaranya, dan ia tidak menguji siapa pun setelah itu, dan ia membenci Ibn Abi Du’ad sejak hari itu. {cite:tarikh-khulafa-minhaj-1434 p. 531}."
