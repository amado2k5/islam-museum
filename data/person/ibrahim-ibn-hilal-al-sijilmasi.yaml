summary:
  ar: "إبراهيم بن هلال بن علي، أبو إسحاق الصنهاجي الفلالي السجلماسي، فقيه مالكي، مفتي سجلماسة وعالمها، من كتبه النوازل وشرح البخاري وشرح مختصر خليل، توفي بها، ويذكر الزركلي وفاته سنة 903 هـ."
  en: "Ibrahim ibn Hilal ibn Ali, Abu Ishaq al-Sanhaji al-Falali al-Sijilmasi, a Maliki jurist, mufti and scholar of Sijilmasa; his books include al-Nawazil and commentaries on al-Bukhari and the Mukhtasar of Khalil; died there; al-Zirikli gives his death as 903 AH."
  es: "Ibrahim ibn Hilal ibn Ali, Abu Ishaq al-Sanhaji al-Falali al-Sijilmasi, jurista maliki, mufti y erudito de Sijilmasa; sus libros incluyen al-Nawazil y comentarios sobre al-Bukhari y el Mukhtasar de Khalil; murió allí; al-Zirikli da su muerte en el año 903 AH."
