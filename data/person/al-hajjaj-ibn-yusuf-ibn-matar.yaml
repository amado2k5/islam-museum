summary:
  ar: "بطاقة أولية للحجاج بن يوسف بن مطر، مترجم كتاب إقليدس و«المجسطي» إلى العربية في عصر المأمون في القرن التاسع؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for al-Hajjaj ibn Yusuf ibn Matar, the ninth-century translator of Euclid's Elements and Ptolemy's Almagest into Arabic in al-Ma'mun's age; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar de al-Hajjaj ibn Yusuf ibn Matar, traductor del siglo IX de los Elementos de Euclides y del Almagesto de Ptolomeo al árabe en la época de al-Ma'mun; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche provisoire d'al-Hajjaj ibn Yusuf ibn Matar, le traducteur au IXe siècle des Éléments d'Euclide et de l'Almageste de Ptolémée en arabe à l'époque d'al-Ma'mun; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "الحجاج ابن یوسف ابن مطر کے لیے ڈرافٹ کارڈ جو نویں صدی کے یوکلڈ کے عناصر اور بطلیموس کی الماجسٹ کا عربی میں المامون کے دور میں مترجم تھا۔ بائیوگرافیکل اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Dokuzuncu yüzyılda El-Ma'mun döneminde Öklid'in kitabını ve \"Almagest\"i Arapçaya çeviren Haccac bin Yusuf bin Matar'ın ön profili; biyografik kitaplarda adı geçmektedir ve çevirisi henüz bu sayfada incelenmemiştir."
  id: "Profil pendahuluan Hajjaj bin Yusuf bin Matar, penerjemah buku Euclid dan \"Almagest\" ke dalam bahasa Arab pada masa pemerintahan Al-Ma'mun di abad kesembilan; ia disebutkan dalam buku-buku biografi dan terjemahannya belum diulas di halaman ini."
