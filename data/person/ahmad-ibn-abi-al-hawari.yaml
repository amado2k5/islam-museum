roles: [mystic, scholar]
summary:
  ar: "أحمد بن أبي الحواري ⁦(ميمون)⁩، أبو الحسن، زاهد من أهل دمشق وتلميذ أبي سليمان الداراني، سماه الجنيد «ريحانة الشام»؛ روى عن حفص بن غياث وأبي معاوية ووكيع، وتوفي سنة 230هـ بحسب ابن الجوزي في «صفة الصفوة»."
  en: "Ahmad ibn Abi al-Hawari (Maymun), Abu al-Hasan, an ascetic of Damascus and disciple of Abu Sulayman al-Darani, whom al-Junayd called 'the sweet basil of Syria'; he transmitted from Hafs ibn Ghiyath, Abu Mu'awiya and Waki', and died in 230 AH according to Ibn al-Jawzi's Sifat al-Safwa."
  ur: "احمد بن ابی الحواری ⁦(میمون)⁩، ابو الحسن، دمشق کے ایک زاہد اور ابو سلیمان دارانی کے شاگرد، جنہیں جنید نے «شام کا ریحان» کہا؛ انہوں نے حفص بن غیاث، ابو معاویہ اور وکیع سے روایت کی، اور ابن الجوزی کی «صفۃ الصفوہ» کے مطابق 230ھ میں فوت ہوئے۔"
