gender: female
roles: [poet]
summary:
  ar: "شاعرة من مذحج قالت شعراً في نصرة علي ورثائه، ثم خرجت إلى معاوية تشكو مروان بن الحكم وقد حبس حفيدها بالمدينة، فكتب بإطلاقه وأمر لها براحلة وخمسة آلاف درهم؛ يروي خبرها كحالة عن بلاغات النساء."
  en: "A poet of Madhhij who composed verses supporting Ali and mourning him, and later travelled to Mu'awiya to complain of Marwan ibn al-Hakam, who had imprisoned her grandson at Medina; Mu'awiya ordered the boy released and gave her a mount and five thousand dirhams. Kahhala tells her story from Balaghat al-Nisa'."
  ur: "مذحج کی ایک شاعرہ جنہوں نے علی کی حمایت اور مرثیے میں اشعار کہے، پھر مروان بن الحکم کی شکایت لے کر معاویہ کے پاس گئیں جس نے مدینہ میں ان کے پوتے کو قید کیا تھا؛ معاویہ نے رہائی کا حکم لکھا اور انہیں سواری اور پانچ ہزار درہم دیے۔ کحالہ بلاغات النساء سے نقل کرتے ہیں۔"
