summary:
  ar: "حفص الفرد أبو عمرو من المجبرة ومن أكابرهم تظير النجار وكان من أهل مرو قدم البصرة فسمع بأبي الهذيل واجتمع معه وناظره فقطعه أبو الهذيل وكان أولا معتزليا ثم قال بخلق الأفعال، وله كتاب الاستطاعة وكتاب التوحيد وكتاب في المخلوق على أبي الهذيل وكتاب الرد على النصارى وكتاب الرد على المعتزلة وكتاب الأبواب في المخلوق {cite:fihrist-ibn-al-nadim p. 255}."
  en: "Hafs al-Fard — the scale-maker who left the Mu'tazila after Abu'l-Hudhayl bested him {cite:fihrist-ibn-al-nadim}"
  es: "Hafs al-Fard — el fabricante de balanzas que abandonó a los Mu'tazila después de que Abu'l-Hudhayl lo venciera {cite:fihrist-ibn-al-nadim}"
  fr: "Hafs al-Fard — le fabricant de balances qui a quitté les Mu'tazilites après avoir été vaincu par Abu'l-Hudhayl {cite:fihrist-ibn-al-nadim}"
  ur: "حفص الفارد - وہ پیمانہ بنانے والا جس نے ابوالہذیل کے بعد معتزلہ کو چھوڑ دیا"
  tr: "El-Majbara'dan Hafs al-Fard Abu Amr ve en önde gelenlerinden biri Tazir el-Necjar'dı. Marw'dan olup Basra'ya gelmişti. Ebu el-Hudhayl'i duydu, onunla görüştü ve tartıştı. Ebu el-Hudhayl onu sözünü kesti. Başlangıçta bir Mu'tazilitti ve daha sonra eylemlerin yaratılmasından bahsetti. Yetenek Kitabı, Tek Tanrıcılık Kitabı, Ebu el-Hudhayl için Yaratılış Kitabı, Hristiyanların Reddi Kitabı, Mu'tazillerin Reddi Kitabı ve Yaratılış Bölümleri Kitabı {cite:fihrist-ibn-al-nadim s. 255} adlı eserleri yazdı."
  id: "Hafs al-Fard Abu Amr dari Al-Majbara, dan di antara yang paling menonjol adalah Tazir al-Najjar. Ia berasal dari Marw, yang datang ke Basra. Ia mendengar tentang Abu al-Hudhayl, bertemu dengannya, dan berdebat dengannya. Abu al-Hudhayl menyela. Awalnya ia adalah seorang Mu'tazilite dan kemudian berbicara tentang penciptaan tindakan. Ia menulis Buku Kemampuan, Kitab Monoteisme, Kitab Penciptaan untuk Abu al-Hudhayl, Kitab Penolakan Orang Kristen, Kitab Penolakan Mu'tazilit, dan Kitab Bab tentang Orang yang Diciptakan {cite:fihrist-ibn-al-nadim hlm. 255}."
