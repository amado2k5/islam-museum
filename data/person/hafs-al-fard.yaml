label: { ar: "حفص الفرد", en: "Hafs Al Fard" }
summary:
  ar: "حفص الفرد أبو عمرو من المجبرة ومن أكابرهم تظير النجار وكان من أهل مرو قدم البصرة فسمع بأبي الهذيل واجتمع معه وناظره فقطعه أبو الهذيل وكان أولا معتزليا ثم قال بخلق الأفعال، وله كتاب الاستطاعة وكتاب التوحيد وكتاب في المخلوق على أبي الهذيل وكتاب الرد على النصارى وكتاب الرد على المعتزلة وكتاب الأبواب في المخلوق {cite:fihrist-ibn-al-nadim p. 255}."
  en: "Hafs al-Fard — the scale-maker who left the Mu'tazila after Abu'l-Hudhayl bested him {cite:fihrist-ibn-al-nadim}"
