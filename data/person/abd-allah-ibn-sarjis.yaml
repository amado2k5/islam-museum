summary:
  ar: "عبد الله بن سرجس المزني الصحابي المعمر، سكن البصرة، روى عن النبي وعن عمر وأبي هريرة وغيرهم، وعنه عاصم الأحول وقتادة وعثمان بن حكيم ومسلم بن أبي مريم، وذكره البخاري وابن حبان في الثقات، وروى عن النبي سبعة عشر حديثاً رواه مسلم منها ثلاثة. (؟ - نيف وثمانين ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13361}"
  en: "Abd Allah ibn Sarjis al-Muzani, a long-lived Companion who lived in Basra. He narrated from the Prophet, Umar, Abu Hurayra and others; Asim al-Ahwal, Qatada and Uthman ibn Hakim narrated from him. Al-Bukhari and Ibn Hibban mention him, and he transmitted seventeen reports from the Prophet, three of them in Muslim. Death given as over eighty H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13361}"
