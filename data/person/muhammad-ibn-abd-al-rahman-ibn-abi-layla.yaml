  ar: "محمد بن عبد الرحمن بن أبي ليلى، قاضي الكوفة؛ ولد سنة أربع وسبعين وتوفي سنة ثمان وأربعين ومائة، وهو ابن اثنتين وسبعين سنة {cite:tabaqat-fuqaha-abbas-1981 p. 45}. تفقه بالشعبي والحكم بن عتيبة، وأخذ عنه سفيان الثوري والحسن بن صالح بن حي {cite:tabaqat-fuqaha-abbas-1981 p. 45}. قال سفيان الثوري: فقهاؤنا ابن أبي ليلى وابن شبرمة {cite:tabaqat-fuqaha-abbas-1981 p. 45}."
