summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك بهرام جور» {cite:tabari-tarikh-abu-al-fadl j.2 p.68}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره. وعند البلاذري هو بهرام جور بن يزدجرد بن بهرام بن سابور ذي الأكتاف وكان في حجرة النعمان بن امرئ القيس ملك الحيرة حين ترك ملكه وساح وبنى له النعمان الخورنق فذكره عدي بن زيد العبادي في شعره."
