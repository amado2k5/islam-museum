id: person/bahram-v-gur
class: person
label: { ar: "بهرام جور" }
summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك بهرام جور» {cite:tabari-tarikh-abu-al-fadl j.2 p.68}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره. وعند البلاذري هو بهرام جور بن يزدجرد بن بهرام بن سابور ذي الأكتاف وكان في حجرة النعمان بن امرئ القيس ملك الحيرة حين ترك ملكه وساح وبنى له النعمان الخورنق فذكره عدي بن زيد العبادي في شعره."
  tr: "O, Sasani Perslerinin kralıydı ve el-Tabari'nin \"Bahram Jur Kralı'nın Anılması\" başlığıyla anılmıştır {cite:tabari-tarikh-abu-al-fadl j.2 s.68}. Bu yerde, saltanatı yılları ve hikayeleri hakkında söylenenler anlatılır. al-Baladhuri'ye göre, o, Bahram Jur ibn Yazdegerd ibn Bahram ibn Bahram ibn Sabur Dhu al-Aktaf'tır; al-Nu'man el-Hirah kralı al-Nu'man ibn Imru' al-Qais'in odasındaydı; o krallığından ayrılıp taşındı ve al-Nu'man onun için Khurnag'ı inşa etti; bu, Uday bin Zayd al-'Abadi'nin şiirlerinde belirttiği gibi."
  id: "Ia adalah raja Persia Sasanian, yang disebut oleh al-Tabari dengan judul \"Sebutan Raja Bahram Jur\" {cite:tabari-tarikh-abu-al-fadl j.2 hlm.68}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kisahnya diceritakan. Menurut al-Baladhuri, ia adalah Bahram Jur ibn Yazdegerd ibn Bahram ibn Sabur Dhu al-Aktaf, yang berada di kamar al-Nu'man ibn Imru' al-Qais, raja al-Hirah, ketika ia meninggalkan kerajaannya dan pindah dan al-Nu'man membangun Khurnag untuknya, seperti yang disebutkan oleh Uday ibn Zayd al-'Abadi dalam puisinya."
