summary:
  ar: "أم البهاء فاطمة مسندة أصبهان؛ سمعت البخاري على العيار وسماعها مشهور، وتوفيت في رمضان سنة تسع وثلاثين وخمسمائة وقد ناهزت أربعاً وتسعين سنة {cite:shadharat-dhahab p. 601}."
  en: "Umm al-Baha' Fatima, musnida of Isfahan; she heard Bukhari under al-Ayyar — her samā' is famous — and died in Ramadan 539 approaching ninety-four years of age {cite:shadharat-dhahab p. 601}."
  es: "Umm al-Bahá' Fátima, musnida de Isfahán; escuchó a Bujari bajo la tutela de al-Ayyar —su samā' es famosa— y murió en Ramadán 539, cerca de los noventa y cuatro años de edad {cita: shadharat-dhahab p. 601}."
  fr: "Umm al-Baha' Fatima, musnida d'Ispahan; elle a entendu Bukhari sous al-Ayyar — son samā' est célèbre — et est décédée en Ramadan 539, approchant les quatre-vingt-quatorze ans {cite:shadharat-dhahab p. 601}."
  ur: "ام البہاء فاطمہ، اصفہان کی مسندہ؛ اس نے بخاری کو العیار کے تحت سنا - اس کا سماع مشہور ہے - اور رمضان المبارک 539 میں چورانوے سال کی عمر میں فوت ہوگئی۔ 601}۔"
  tr: "Ümmü el-Baha' Fatimah Musnad İsfahan; Bukhari'yi kademesine göre duydu ve işitmesi iyi bilinir. Ramazan ayında, beş yüz otuz dokuz yılında, neredeyse doksan dört yaşında vefat etti {atıf: shadharat-dhahab, s. 601}."
  id: "um al-Baha' Fatimah Musnad Isfahan; dia mendengar al-Bukhari berdasarkan kaliber dan pendengarannya sangat terkenal. Dia meninggal pada bulan Ramadan tahun lima ratus tiga puluh sembilan, hampir sembilan puluh empat tahun {cite:shadharat-dhahab, hlm. 601}."
