summary:
  ar: "عالم وقاض مصري (1881-1945) تولى مشيخة الأزهر مرتين (1928-1929 و1935-1945)، وكان قبلها قاضي القضاة في السودان (1908-1919) فرئيسا للمحكمة الشرعية العليا في القاهرة. من تلاميذ محمد عبده، وداعية للإصلاح والاجتهاد والتقريب بين المذاهب، وصاحب قانون الأحوال الشخصية لسنة 1920 ومؤسس لجنة الفتوى بالأزهر ذات التمثيل المذهبي المتعدد."
  en: "Egyptian scholar and judge (1881–1945) who served twice as Grand Imam (Sheikh) of al-Azhar (1928–1929 and 1935–1945), after a career as Grand Qadi of the Sudan (1908–1919) and president of Cairo's Supreme Sharia Court. A pupil of Muhammad Abduh, he championed reform, ijtihad and rapprochement between the legal schools; he authored the 1920 personal-status law and founded al-Azhar's cross-madhhab Fatwa Committee."
  ur: "مصری عالم و قاضی (1881-1945) جو دو مرتبہ شیخ الازہر رہے (1928-1929 اور 1935-1945)، اس سے پہلے سوڈان کے قاضی القضاة (1908-1919) اور قاہرہ کی عدالتِ شرعیہ علیا کے صدر رہے۔ محمد عبدہ کے شاگرد، اصلاح، اجتہاد اور مذاہب کے تقریب کے داعی، 1920 کے قانونِ احوالِ شخصیہ کے مصنف اور الازہر کی کثیرالمذاہب دارالافتاء کمیٹی کے بانی۔"
