  note: "Died on the night of Wednesday 14 Ramadan 1364 AH, i.e. 22 August 1945, at Alexandria — the Arabic article's infobox gives Alexandria as the place of death, and its narrative has him ill at the city's Mowasat hospital, where the confrontation with King Farouk over the refused fatwa took place; the English and Urdu articles agree on 22 August 1945. The TDV entry dates the death 23 August 1945 and records the body taken to Hulwan, the funeral at al-Azhar Mosque and burial at the Sayyida Nafisa cemetery in Cairo. Wikidata carries two conflicting death years, 1944 and 1945, of which 1944 is rejected by every article. The Hijri year 1364 is source-given in the Arabic article's dating of the death night."
