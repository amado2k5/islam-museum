    basis: tradition
    note: "No source consulted names a fiqh school for him, so he is left unclassified. What each source gives: Wikidata records Islam (Q432) only. The Arabic article's infobox gives his religion as Islam, generically, and names no madhhab; the Urdu infobox likewise names no madhhab; the English article names none; the German article — resting on Zeghal, Brunner and Costet-Tardieu — names none; and the TDV İslâm Ansiklopedisi entry by Ali Gomaa, the fullest scholarly notice consulted, names none either. The evidence runs the other way from a single-school attachment: as Grand Qadi of the Sudan he won for his judges the right to apply whichever school's opinion served the case, and in Egypt his July 1920 personal-status legislation expressly freed the courts from the former Hanafi-only constraint where another school's ruling better served the public interest; the Fatwa Committee he founded in 1935 was deliberately composed across the four schools (3 Hanafi, 3 Maliki, 3 Shafi'i, 2 Hanbali); and in his treatise on translating the Qur'an he invoked a Hanafi argument — a position taken in an argument, not an affiliation. A pupil-of-Abduh or Azhar-rector affiliation is an institutional fact, which by the lane rule never counts as a school attestation. Unknown is therefore the honest value."
