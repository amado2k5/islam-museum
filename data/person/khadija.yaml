summary:
  en: "A wealthy Meccan merchant who was the Prophet Muhammad's first wife and, in tradition, the first person to believe in his message. Usd al-Ghaba's entry on her (no. 6877) identifies her as the Prophet's wife and the first woman he married, and reports a group counting her the first of God's creation to embrace Islam by consensus of the Muslims, no man or woman preceding her {cite:usd-ghaba p.1502}."
  ar: "تاجرة مكية ثرية، كانت أول أزواج النبي محمد، وهي في الرواية أول من آمن برسالته؛ فلما رجع من غار حراء يرجف فؤاده قال «زملوني زملوني» فزمّلته وقالت كلمتها المشهورة «كلا والله ما يخزيك الله أبداً، إنك لتصل الرحم وتحمل الكل وتكسب المعدوم وتقري الضيف وتعين على نوائب الحق» ثم انطلقت به إلى ابن عمها ورقة بن نوفل {cite:sahih-al-bukhari 3}. وأمر الله نبيه أن يبشرها ببيت في الجنة من قصب لا صخب فيه ولا نصب {cite:sahih-al-bukhari 3819}، وقال «خير نسائها مريم بنت عمران وخير نسائها خديجة بنت خويلد» {cite:sahih-al-bukhari 3815}، وفي مسلم أتى جبريل النبي فقال له أن بلّغ خديجة سلاماً من ربها ومن جبريل وبشّرها «ببيت في الجنة من قصب لا صخب فيه ولا نصب» {cite:sahih-muslim 2432}. ويذكر أسد الغابة في ترجمتها رقم ٦٨٧٧ أنها زوج النبي وأول امرأة تزوجها، ونقل أن طائفة عدّتها أول خلق الله أسلم بإجماع المسلمين دون تقدم رجل أو امرأة عليها {cite:usd-ghaba p.1502}."
  ur: "مکی امیر تاجر خاتون جو نبی محمد کی پہلی بیوی تھیں اور روایت میں ان کے پیغام پر ایمان لانے والی پہلی شخص۔ اسلامی دائرۃ المعارف کا مضمون انھیں قریش کے خاندان اسد کے خویلد کی بیٹی بتاتا ہے، جنھوں نے محمد سے پہلے دو نکاح کیے اور شام کے تجارتی سفر کے بعد ان کے ساتھ نکاح کی پیشکش کی۔ مضمون کے مطابق ان کے کم از کم پانچ بچے ہوئے۔"
  es: "Una rica comerciante de La Meca que fue la primera esposa del profeta Mahoma y, según la tradición, la primera persona en creer en su mensaje. La entrada de Usd al-Ghaba sobre ella (n.º 6877) la identifica como la esposa del Profeta y la primera mujer con la que se casó, e informa que un grupo la considera la primera de la creación de Dios en abrazar el Islam por consenso de los musulmanes, sin que ningún hombre ni mujer la precediera {cite:usd-ghaba p.1502}."
  fr: "Une riche marchande mecquoise, première épouse du prophète Mahomet et, selon la tradition, la première personne à croire en son message. L'entrée qui lui est consacrée dans l'ouvrage d'Usd al-Ghaba (n° 6877) la désigne comme l'épouse du Prophète et la première femme qu'il épousa. Elle est également mentionnée par un groupe qui la considère comme la première créature de Dieu à embrasser l'islam, selon le consensus des musulmans, aucun homme ni femme ne l'ayant précédée (cite: Usd al-Ghaba, p. 1502)."
  tr: "Zengin bir Mekkeli tüccar olan Mekkeli Peygamber, Peygamber Muhammed'in ilk eşiydi ve rivayete göre, onun mesajına ilk inanan oydu. Hira Mağarasından döndüğünde, kalbi titreyerek \"Onlar bana katılacak, bana katılacaklar,\" dedi. O da ona cevap verdi ve ünlü sözünü söyledi: \"Hayır, Allah yemin ederim, Allah seni asla küçük düşürmez. Sen akrabalık bağlarını sürdürürsün, herkesi desteklersin, yoksulları desteklersin, misafirleri onurlandırır ve gerçeğin felaketlerinde yardım edersin.\" Sonra onu kuzeni Varaka ibn Nevfal'e götürdü {atı: sahih-al-bukhari 3}. Allah, Peygamberine gürültü yapmadan, kamışlardan yapılmış bir cennetin müjdesini ona iletmesini emretti. sahih-al-bukhari 3819} ve şöyle dedi: \"Kadınlarının en iyisi Meryem bint İmran'dır, en iyi kadın ise Khadice bint Khuwaylid'dir\" {atıf:sahih-al-bukhari 3815}. Müslüman olarak, Cebrail Peygamber'e geldi ve Khadice'nin Rabbinden ve Cebrail'den selam aldığını söyledi ve ona müjdede bulundu: \"Gürültü ve dikilme olmadan, kamışlardan yapılmış cennet evi\" {cite:sahih-muslim 2432}. Orman Aslanı, biyografisi numarası 6877'de Peygamber'in kocası ve onunla evlenen ilk kadın olduğunu belirtir ve Allah'ın ilk yaratılışından oluşan bir grubun, Müslümanların uzlaşmasıyla İslam'ı kabul ettiğini, önünde hiçbir erkek ya da kadının gelmediği bildirilir {cite:usd-ghaba s.1502}."
  id: "Seorang pedagang kaya dari Mekah, dia adalah istri pertama Nabi Muhammad, dan menurut riwayat, dia adalah yang pertama percaya pada pesannya. Ketika dia kembali dari Gua Hira, hatinya bergetar, dia berkata, \"Mereka akan bergabung denganku, mereka akan bergabung denganku.\" Dia menjawab dan berkata dengan ucapan terkenalnya, \"Tidak, demi Tuhan, Tuhan tidak akan pernah mempermalukanmu. Kamu menjaga ikatan kekerabatan, mendukung semua, mendukung yang miskin, menghormati tamu, dan membantu menghadapi bencana kebenaran.\" Kemudian dia membawanya kepada sepupunya Waraqah ibn Nawfal {cite:sahih-al-bukhari 3}. Allah memerintahkan Nabi-Nya untuk memberinya kabar gembira tentang sebuah rumah di surga yang terbuat dari alang-alang, tanpa suara atau berdiri {cite:sahih-al-bukhari 3819}, dan Dia berkata: \"Wanita terbaik di sana adalah Maria bint Imran, dan wanita terbaik di antara wanitanya adalah Khadijah bint Khuwaylid\" {cite:sahih-al-bukhari 3815}. Dalam bahasa Muslim, Jibril datang kepada Nabi dan memberitahunya bahwa Khadijah telah menerima damai dari Tuhannya dan dari Gabriel, dan memberinya kabar gembira: \"Sebuah rumah di surga yang terbuat dari alang-alang, tanpa suara atau ereksi\" {cite:sahih-muslim 2432}. Singa Hutan menyebutkan dalam biografinya nomor 6877 bahwa dia adalah suami Nabi dan wanita pertama yang menikahinya, dan dilaporkan bahwa sekelompok yang dihitung oleh ciptaan pertama Allah menerima Islam atas kesepakatan umat Muslim tanpa ada pria atau wanita yang datang ke hadapannya {cite:usd-ghaba hlm.1502}."
