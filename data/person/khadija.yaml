education:
  did_you_know:
    ar: "خديجة تاجرة مكية ناجحة وأول أزواج النبي، وهي في الرواية أول من آمن برسالته حين عاد من غار حراء."
    en: "Khadija was a successful Meccan merchant, the Prophet's first wife, and by the tradition's account the very first to believe in his message when he returned from the cave of Hira."
