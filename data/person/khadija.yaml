summary:
  en: "A wealthy Meccan merchant who was the Prophet Muhammad's first wife and, in tradition, the first person to believe in his message."
  ar: "تاجرة مكية ثرية، كانت أول أزواج النبي محمد، وهي في الرواية أول من آمن برسالته؛ فلما رجع من غار حراء يرجف فؤاده قال «زملوني زملوني» فزمّلته وقالت كلمتها المشهورة «كلا والله ما يخزيك الله أبداً، إنك لتصل الرحم وتحمل الكل وتكسب المعدوم وتقري الضيف وتعين على نوائب الحق» ثم انطلقت به إلى ابن عمها ورقة بن نوفل {cite:sahih-al-bukhari 3}. وأمر الله نبيه أن يبشرها ببيت في الجنة من قصب لا صخب فيه ولا نصب {cite:sahih-al-bukhari 3819}، وقال «خير نسائها مريم بنت عمران وخير نسائها خديجة بنت خويلد» {cite:sahih-al-bukhari 3815}، وفي مسلم أتى جبريل النبي فقال له أن بلّغ خديجة سلاماً من ربها ومن جبريل وبشّرها «ببيت في الجنة من قصب لا صخب فيه ولا نصب» {cite:sahih-muslim 2432}."
