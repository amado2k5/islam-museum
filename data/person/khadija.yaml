summary:
  en: "A wealthy Meccan merchant who was the Prophet Muhammad's first wife and, in tradition, the first person to believe in his message. Usd al-Ghaba's entry on her (no. 6877) identifies her as the Prophet's wife and the first woman he married, and reports a group counting her the first of God's creation to embrace Islam by consensus of the Muslims, no man or woman preceding her {cite:usd-ghaba p.1502}."
  ar: "تاجرة مكية ثرية، كانت أول أزواج النبي محمد، وهي في الرواية أول من آمن برسالته؛ فلما رجع من غار حراء يرجف فؤاده قال «زملوني زملوني» فزمّلته وقالت كلمتها المشهورة «كلا والله ما يخزيك الله أبداً، إنك لتصل الرحم وتحمل الكل وتكسب المعدوم وتقري الضيف وتعين على نوائب الحق» ثم انطلقت به إلى ابن عمها ورقة بن نوفل {cite:sahih-al-bukhari 3}. وأمر الله نبيه أن يبشرها ببيت في الجنة من قصب لا صخب فيه ولا نصب {cite:sahih-al-bukhari 3819}، وقال «خير نسائها مريم بنت عمران وخير نسائها خديجة بنت خويلد» {cite:sahih-al-bukhari 3815}، وفي مسلم أتى جبريل النبي فقال له أن بلّغ خديجة سلاماً من ربها ومن جبريل وبشّرها «ببيت في الجنة من قصب لا صخب فيه ولا نصب» {cite:sahih-muslim 2432}. ويذكر أسد الغابة في ترجمتها رقم ٦٨٧٧ أنها زوج النبي وأول امرأة تزوجها، ونقل أن طائفة عدّتها أول خلق الله أسلم بإجماع المسلمين دون تقدم رجل أو امرأة عليها {cite:usd-ghaba p.1502}."
  ur: "مکی امیر تاجر خاتون جو نبی محمد کی پہلی بیوی تھیں اور روایت میں ان کے پیغام پر ایمان لانے والی پہلی شخص۔"
