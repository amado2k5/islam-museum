summary:
  ar: "قائد فتح إفريقية، ولاّه معاوية بعد عزل عقبة بن نافع؛ سلك سياسة اللين مع البربر وتسامح مع زعيمهم كسيلة حتى أسلم وأسلم معه قوم كثير، وحقق نصراً على البيزنطيين فتقدم في المغرب الأوسط حتى وصل تلمسان {cite:umayyad-birth-to-fall-2006 p. 16}{cite:umayyad-birth-to-fall-2006 p. 17}. ذكر الكتاب أن حسان بن النعمان سار على السياسة نفسها التي سار عليها أبو المهاجر، وهي تأليف البربر وإشراكهم في الفتوح. {cite:salabi-umayyad-state-2020 p.61}"
  en: "Commander of the conquest of Ifriqiya, appointed by Mu'awiya after 'Uqba ibn Nafi' was removed. He followed a policy of gentleness toward the Berbers and was tolerant toward their leader Kusayla until he converted, and many people converted with him; he won a victory over the Byzantines and advanced in the central Maghrib as far as Tlemcen {cite:umayyad-birth-to-fall-2006 p. 16}{cite:umayyad-birth-to-fall-2006 p. 17}. The book notes that Hassan ibn al-Nu'man followed the same policy as Abu al-Muhajir, namely winning over the Berbers and involving them in the conquests. {cite:salabi-umayyad-state-2020 p.61}"
