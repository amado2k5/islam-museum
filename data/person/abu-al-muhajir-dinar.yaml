label: { ar: "أبو المهاجر دينار", en: "Abu al-Muhajir Dinar", fr: "Abu al-Muhajir Dinar", es: "Abu al-Muhajir Dinar", ur: "ابو المہاجر دینار" }
gender: male
summary:
  ar: "قائد فتح إفريقية، ولاّه معاوية بعد عزل عقبة بن نافع؛ سلك سياسة اللين مع البربر وتسامح مع زعيمهم كسيلة حتى أسلم وأسلم معه قوم كثير، وحقق نصراً على البيزنطيين فتقدم في المغرب الأوسط حتى وصل تلمسان {cite:umayyad-birth-to-fall-2006 p. 16}{cite:umayyad-birth-to-fall-2006 p. 17}. ذكر الكتاب أن حسان بن النعمان سار على السياسة نفسها التي سار عليها أبو المهاجر، وهي تأليف البربر وإشراكهم في الفتوح. {cite:salabi-umayyad-state-2020 p.61}"
  en: "Commander of the conquest of Ifriqiya, appointed by Mu'awiya after 'Uqba ibn Nafi' was removed. He followed a policy of gentleness toward the Berbers and was tolerant toward their leader Kusayla until he converted, and many people converted with him; he won a victory over the Byzantines and advanced in the central Maghrib as far as Tlemcen {cite:umayyad-birth-to-fall-2006 p. 16}{cite:umayyad-birth-to-fall-2006 p. 17}. The book notes that Hassan ibn al-Nu'man followed the same policy as Abu al-Muhajir, namely winning over the Berbers and involving them in the conquests. {cite:salabi-umayyad-state-2020 p.61}"
  fr: "Commandant de la conquête de l'Ifriqiya, nommé par Mu'awiya après la destitution de 'Uqba ibn Nafi'. Il suivit une politique de douceur envers les Berbères et fut tolérant envers leur chef Kusayla jusqu'à ce qu'il se convertisse, et beaucoup de gens se convertirent avec lui ; il remporta une victoire sur les Byzantins et avança dans le Maghreb central jusqu'à Tlemcen {cite:umayyad-birth-to-fall-2006 p. 16}{cite:umayyad-birth-to-fall-2006 p. 17}. Le livre note que Hassan ibn al-Nu'man suivit la même politique qu'Abu al-Muhajir, à savoir gagner les Berbères et les associer aux conquêtes. {cite:salabi-umayyad-state-2020 p.61}"
  es: "Comandante de la conquista de Ifriqiya, nombrado por Mu'awiya tras la destitución de Uqba ibn Nafi. Adoptó una política de benevolencia hacia los bereberes y fue tolerante con su líder Kusayla hasta su conversión, a la que se unieron muchos otros. Obtuvo una victoria sobre los bizantinos y avanzó por el Magreb central hasta Tlemcen {cite:umayyad-birth-to-fall-2006 p. 16}{cite:umayyad-birth-to-fall-2006 p. 17}. El libro señala que Hassan ibn al-Nu'man siguió la misma política que Abu al-Muhajir, es decir, ganarse el favor de los bereberes e involucrarlos en las conquistas. {cite:salabi-umayyad-state-2020 p.61}"
  ur: "عقبہ بن نافع کے بعد معاویہ نے عفریقیہ کی فتح کے کمانڈر کو ہٹا دیا تھا۔ اس نے بربروں کے ساتھ نرمی کی پالیسی پر عمل کیا اور ان کے رہنما کوسیلا کے ساتھ رواداری کا مظاہرہ کیا جب تک کہ وہ تبدیل نہ ہو گئے، اور بہت سے لوگ اس کے ساتھ تبدیل ہو گئے۔ اس نے بازنطینیوں پر فتح حاصل کی اور وسطی مغرب میں Tlemcen تک آگے بڑھا۔ 16}{حوالہ:امیاد-پیدائش سے زوال-2006 صفحہ۔ 17}۔ کتاب میں لکھا ہے کہ حسن بن النعمان نے ابو المہاجر کی طرح کی پالیسی پر عمل کیا، یعنی بربروں پر فتح حاصل کرنا اور انہیں فتوحات میں شامل کرنا۔ {حوالہ: سلبی-امیاد-ریاست-2020 صفحہ 61}"
  tr: "Ukba ibn Nafi'nin görevden alınmasının ardından Muaviye tarafından Kuzey Afrika'nın fethinin komutanı olarak atanan Hasan ibn el-Nu'man, Berberilere karşı hoşgörülü bir politika izledi ve liderleri Kuşayla'ya, diğer birçok kişiyle birlikte İslam'ı kabul edene kadar müsamaha gösterdi. Bizanslılara karşı zafer kazandı ve Tlemcen'e ulaşana kadar Orta Mağrip'e doğru ilerledi. Kitapta, Hasan ibn el-Nu'man'ın da Ebu el-Muhacir ile aynı politikayı izlediği, yani Berberileri kazanıp onları fetihlere dahil ettiği belirtiliyor."
  id: "Komandan penaklukan Afrika Utara, yang diangkat oleh Mu'awiya setelah pemecatan Uqba ibn Nafi, menjalankan kebijakan lunak terhadap Berber dan menunjukkan toleransi terhadap pemimpin mereka, Kusayla, hingga ia masuk Islam, bersama dengan banyak orang lainnya. Ia meraih kemenangan atas Bizantium dan maju ke Maghreb tengah hingga mencapai Tlemcen. Buku tersebut menyatakan bahwa Hassan ibn al-Nu'man mengikuti kebijakan yang sama dengan Abu al-Muhajir, yaitu memenangkan hati Berber dan melibatkan mereka dalam penaklukan."
