summary:
  ar: "الشيخ الصوفي، من بيت الجويني؛ صحب خاله شيخ الإسلام ابن هموية وسافر معه إلى مصر في ركاب فخر الدين بن الشيخ؛ وصف الأسرى يوم فوز المنصورة بأنهم نيفاً وعشرين ألفاً فيهم ملوك وكبار والقتلى سبعة آلاف؛ من مشايخ الطريق وله أحوال وكلمات {cite:shadharat-dhahab p. 248, 259}."
  en: "The Sufi of the Juwayni house (d. 650) — accompanied his uncle shaykh al-islam Ibn Hamuwayh to Egypt in Fakhr al-Din's suite; his eyewitness count of the Mansura captives — twenty-five thousand, kings among them — is the figure Shadharat reports {cite:shadharat-dhahab p. 248, 259}."
  es: "El sufí de la casa Juwayni (m. 650) acompañó a su tío shaykh al-islam Ibn Hamuwayh a Egipto en el séquito de Fakhr al-Din; su recuento de testigos presenciales de los cautivos de Mansura —veinticinco mil, entre ellos reyes— es la cifra que informa Shadharat {cite:shadharat-dhahab p. 248, 259}."
  fr: "Le soufi de la maison Juwayni (mort en 650) — a accompagné son oncle cheikh al-islam Ibn Hamuwayh en Égypte dans la suite de Fakhr al-Din; son décompte de témoins oculaires des captifs de Mansoura — vingt-cinq mille, des rois parmi eux — est le chiffre rapporté par Shadharat {cite:shadharat-dhahab p. 248, 259}."
  ur: "جوینی گھر کا صوفی ⁦(متوفی 650)⁩ - اپنے چچا شیخ الاسلام ابن حمویہ کے ساتھ فخرالدین کے کمرے میں مصر گیا۔ منصورہ کے اسیروں کی اس کے چشم دید گواہوں کی تعداد - پچیس ہزار، ان میں سے بادشاہ - یہ اعداد و شمار شدھارت کی رپورٹوں کے مطابق ہے {حوالہ: شدھارت ذہاب ص۔ 248، 259}۔"
