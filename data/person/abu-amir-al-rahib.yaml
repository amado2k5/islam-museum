id: person/abu-amir-al-rahib
class: person
label: { ar: "أبو عامر الراهب", en: "Abu 'Amir al-Rahib", fr: "Abu 'Amir al-Rahib", es: "Abu 'Amir al-Rahib", ur: "ابو عامر الرحیب" }
summary:
  ar: "أبو عامر عبد عمرو بن صيفي بن النعمان الأوسي من بني ضبيعة بن زيد، المعروف بالراهب، والد حنظلة غسيل الملائكة؛ كان له صيت في الجاهلية بيثرب وكان مع الأوس يوم بعاث، وكان قد ترهّب ولبس المسوح {cite:samhudi-wafa-al-wafa p. 230-231}. وعند السمهودي عن أهل السير: لما قدم النبي المدينة سأله عن الدين فقال «جئت بالحنيفية دين إبراهيم» فزعم أنه عليها فقيل له «إنك لست عليها»، فأنكر وقال أدخلت فيها ما ليس منها، فقال النبي «ما فعلت ولكني جئت بها بيضاء نقية»، فدعا أبو عامر على الكاذب منهما بالموت طريداً غريباً وحيداً فأمّن النبي، فخرج إلى مكة مفارقاً فسمّاه النبي الفاسق، فلما فُتحت مكة خرج إلى الطائف، فلما أسلم أهلها لحق بالشام فمات بها طريداً غريباً وحيداً {cite:samhudi-wafa-al-wafa p. 231-232}. وعند المقريزي كان من قساوسة العرب وهاجر إلى الحبشة فراراً بدينه وإليه تنسب حفرة أبي عامر التي وقع فيها المسلمون يوم أحد."
  en: "Abu 'Amir 'Abd 'Amr ibn Sayfi al-Awsi, known as 'the Monk', father of Hanzala 'the one washed by the angels'; a man of standing in Jahiliyya Yathrib who fought with the Aws at Bu'ath, then showed open hostility to Islam after the Hijra until the Prophet named him al-Fasiq — the reprobate {cite:samhudi-wafa-al-wafa p. 230}. In al-Maqrizi he was one of the Arabs' priests, emigrated to Abyssinia for his faith, and to him is ascribed Abu 'Amir's pit into which the Muslims fell at Uhud."
  fr: "Abu 'Amir 'Abd 'Amr ibn Sayfi al-Awsi, dit « le Moine », père de Hanzala « celui que lavèrent les anges » ; homme considéré à Yathrib au temps de la Jahiliyya, qui combattit avec les Aws à Bu'ath, puis manifesta ouvertement son hostilité à l'islam après l'Hégire, jusqu'à ce que le Prophète le nomme al-Fasiq — le dévoyé {cite:samhudi-wafa-al-wafa p. 230}. Chez al-Maqrizi, il était l'un des devins des Arabes, émigra en Abyssinie avec sa religion, et on lui attribue la fosse d'Abu 'Amir dans laquelle tombèrent les musulmans à Uhud."
  es: "Abu 'Amir 'Abd 'Amr ibn Sayfi al-Awsi, conocido como 'el Monje', padre de Hanzala 'el lavado por los ángeles'; un hombre de prestigio en la época preislámica de Yathrib que luchó con los Aws en Bu'ath, y luego mostró abierta hostilidad hacia el Islam después de la Hégira hasta que el Profeta lo nombró al-Fasiq — el réprobo {cite:samhudi-wafa-al-wafa p. 230}. En al-Maqrizi fue uno de los sacerdotes árabes, emigró a Abisinia por su fe, y a él se le atribuye el pozo de Abu 'Amir en el que cayeron los musulmanes en Uhud."
  ur: "ابو عامر 'عبد عمرو بن سیفی العوسی، جو 'راہب' کے نام سے جانا جاتا ہے، حنظلہ کے والد 'جس کو فرشتوں نے دھویا'؛ جاہلیہ یثرب میں کھڑا ایک شخص جس نے بعثت میں اوس سے جنگ کی، پھر ہجرت کے بعد اسلام سے کھلی دشمنی کا مظاہرہ کیا یہاں تک کہ نبی نے اس کا نام الفاسق رکھا۔ 230}۔ المکرزی میں وہ عربوں کے پادریوں میں سے ایک تھے، اپنے ایمان کی وجہ سے حبشہ کی طرف ہجرت کر گئے تھے، اور ان کی طرف ابو عامر کا وہ حوض منسوب کیا جاتا ہے جس میں مسلمان احد میں گرے تھے۔"
  tr: "Beni Dabi'ah ibn Zayd kabilesinden Ebu'Amir Abd Amr ibn Sayfi ibn el-Nu'man el-Evsi, Keşiş lakabıyla bilinen, melekler tarafından yıkanan Hanzalah'ın babasıdır. İslam öncesi dönemde Yathrib'de bir üne sahipti ve Bu'ath günü Evs kabilesiyle birlikteydi. Keşiş olmuş ve kaba giysiler giymişti. {kaynak:samhudi-wafa-al-wafa s. 230-231}. El-Samhudi'ye göre, biyografi yazarlarından rivayetle: Peygamber Medine'ye vardığında ona din hakkında sordu ve o da, \"İbrahim'in saf tevhidini getirdim\" dedi. Bunun üzerinde olduğunu iddia etti, bunun üzerine ona, \"Sen bunun üzerinde değilsin\" denildi. Bunu reddetti ve \"Ona ait olmayan şeyleri soktum\" dedi. Peygamber, \"Ben bunu yapmadım, ama onu saf ve temiz olarak getirdim\" dedi. Ebu Amir, yalan söyleyenin sürgün, yabancı ve yalnız başına ölmesi için dua etti. Peygamber \"Âmin\" dedi. Bunun üzerine Mekke'ye gitti ve Peygamber onu \"hain\" olarak nitelendirdi. Mekke fethedilince Taif'e gitti. Taif halkı İslam'ı kabul edince Suriye'ye gitti ve orada sürgün, yabancı ve yalnız başına öldü. {Kaynak: Samhudi-vefa-el-vefa s. 231-232}. El-Makrizi'ye göre, o Arap din adamlarından biriydi ve dinini korumak için Habeşistan'a göç etti ve Uhud günü Müslümanların düştüğü Ebu Amir'in çukuru ona atfedilir."
  id: "Abu 'Amir 'Abd 'Amr ibn Sayfi ibn al-Nu'man al-Awsi, dari Bani Dabi'ah ibn Zayd, yang dikenal sebagai Sang Rahib, adalah ayah dari Hanzalah, orang yang dimandikan oleh malaikat. Ia memiliki reputasi di zaman pra-Islam di Yathrib dan bersama suku Aws pada hari Bu'ath. Ia telah menjadi seorang rahib dan mengenakan pakaian kasar. {kutip:samhudi-wafa-al-wafa hlm. 230-231}. Menurut al-Samhudi, berdasarkan riwayat para penulis biografi: Ketika Nabi tiba di Madinah, beliau bertanya kepadanya tentang agama, dan dia berkata, \"Aku telah membawa tauhid murni Ibrahim.\" Dia mengklaim bahwa dia berada di atasnya, maka dikatakan kepadanya, \"Kamu tidak berada di atasnya.\" Dia menyangkal ini dan berkata, \"Aku telah memasukkan ke dalamnya apa yang bukan bagiannya.\" Nabi berkata, \"Aku tidak melakukan itu, tetapi aku membawanya dalam keadaan murni dan jelas.\" Abu 'Amir kemudian berdoa agar orang yang berbohong itu mati sebagai orang buangan, orang asing, dan sendirian. Nabi berkata, \"Amin.\" Maka ia pergi ke Mekah, dan Nabi menyebutnya sebagai orang yang melanggar. Ketika Mekah ditaklukkan, ia pergi ke Ta'if. Ketika penduduknya memeluk Islam, ia pergi ke Suriah dan meninggal di sana sebagai orang buangan, orang asing, dan sendirian. {kutip:samhudi-wafa-al-wafa hlm. 231-232}. Menurut Al-Maqrizi, ia adalah salah satu pendeta Arab dan ia berhijrah ke Abyssinia untuk menyelamatkan agamanya, dan lubang Abu Amir, tempat kaum Muslim jatuh pada hari Uhud, dinisbahkan kepadanya."
