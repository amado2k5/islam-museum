id: person/abu-amir-al-rahib
class: person
label: { ar: "أبو عامر الراهب", en: "Abu 'Amir al-Rahib" }
summary:
  ar: "أبو عامر عبد عمرو بن صيفي بن النعمان الأوسي من بني ضبيعة بن زيد، المعروف بالراهب، والد حنظلة غسيل الملائكة؛ كان له صيت في الجاهلية بيثرب وكان مع الأوس يوم بعاث، وكان قد ترهّب ولبس المسوح {cite:samhudi-wafa-al-wafa p. 230-231}. وعند السمهودي عن أهل السير: لما قدم النبي المدينة سأله عن الدين فقال «جئت بالحنيفية دين إبراهيم» فزعم أنه عليها فقيل له «إنك لست عليها»، فأنكر وقال أدخلت فيها ما ليس منها، فقال النبي «ما فعلت ولكني جئت بها بيضاء نقية»، فدعا أبو عامر على الكاذب منهما بالموت طريداً غريباً وحيداً فأمّن النبي، فخرج إلى مكة مفارقاً فسمّاه النبي الفاسق، فلما فُتحت مكة خرج إلى الطائف، فلما أسلم أهلها لحق بالشام فمات بها طريداً غريباً وحيداً {cite:samhudi-wafa-al-wafa p. 231-232}. وعند المقريزي كان من قساوسة العرب وهاجر إلى الحبشة فراراً بدينه وإليه تنسب حفرة أبي عامر التي وقع فيها المسلمون يوم أحد."
  en: "Abu 'Amir 'Abd 'Amr ibn Sayfi al-Awsi, known as 'the Monk', father of Hanzala 'the one washed by the angels'; a man of standing in Jahiliyya Yathrib who fought with the Aws at Bu'ath, then showed open hostility to Islam after the Hijra until the Prophet named him al-Fasiq — the reprobate {cite:samhudi-wafa-al-wafa p. 230}. In al-Maqrizi he was one of the Arabs' priests, emigrated to Abyssinia for his faith, and to him is ascribed Abu 'Amir's pit into which the Muslims fell at Uhud."
