label: { ar: "حمدان قرمط", en: "Hamdan Qarmat", es: "Hamdan Qarmat", fr: "Hamdan Qarmat", ur: "ہمدان قرمت" }
summary:
  ar: "حمدان بن الأشعث ويلقب بقرمط لقصر كان في متنه وساقه، أجاب دعوة عبد الله بن ميمون في سواد الكوفة وكان قرمط أكارا بقارا في القرية المعروفة بقس بهرام ورأس قرمط وكان داهية، وأقام بكلواذى ونصب له عبد الله بن ميمون رجلا من ولده يكاتبه من الطالقان وذلك في سنة إحدى وستين ومائتين {cite:fihrist-ibn-al-nadim p. 265}."
  en: "Hamdan Qarmat — the donkey-driver of Kuss Bihram who seeded the da'wa in Kufa's countryside {cite:fihrist-ibn-al-nadim}"
  es: "Hamdan Qarmat: el conductor de burros de Kuss Bihram que sembró la da'wa en el campo de Kufa {cita:fihrist-ibn-al-nadim}"
  fr: "Hamdan Qarmat - le conducteur d'âne de Kuss Bihram qui a semé la da'wa dans la campagne de Kufa {cite: fihrist-ibn-al-nadim}"
  ur: "حمدان قرمت — کس بہرام کا گدھا چلانے والا جس نے کوفہ کے دیہی علاقوں میں دعوت کا بیج لگایا"
  tr: "Bedeninde ve bacağında bir saray olduğu için Qarmat lakabı verilen Hamdan ibn al-Ash'ath, Kufa'nın karanlığında Abdullah ibn Maymun'un davetine yanıt verdi. Karmat, Bahram ve Ras Qarmat kabileleri olarak bilinen köyde bir hayvancıydı ve kurnaz bir adamdı. Klawadhi'de kaldı ve Abdullah ibn Maymun, 261 yılında oğlundan Talaqan'dan kendisiyle mektup göndermesi için bir adam atadı {cite:fihrist-ibn-al-nadim s. 265}."
  id: "Hamdan ibn al-Ash'ath, dijuluki Qarmat karena ada istana di tubuh dan kakinya, ia menjawab undangan Abdullah ibn Maymun dalam kegelapan Kufa. Qarmat adalah seorang peternak di desa yang dikenal sebagai suku Bahram dan Ras Qarmat, dan ia adalah orang yang cerdik. Ia tinggal di Klawadhi, dan Abdullah ibn Maymun menunjuk seorang pria dari putranya untuk berkorespondensi dengannya dari Talaqan pada tahun 261 {cite:fihrist-ibn-al-nadim hlm. 265}."
