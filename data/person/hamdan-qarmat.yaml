label: { ar: "حمدان قرمط", en: "Hamdan Qarmat" }
summary:
  ar: "حمدان بن الأشعث ويلقب بقرمط لقصر كان في متنه وساقه، أجاب دعوة عبد الله بن ميمون في سواد الكوفة وكان قرمط أكارا بقارا في القرية المعروفة بقس بهرام ورأس قرمط وكان داهية، وأقام بكلواذى ونصب له عبد الله بن ميمون رجلا من ولده يكاتبه من الطالقان وذلك في سنة إحدى وستين ومائتين {cite:fihrist-ibn-al-nadim p. 265}."
  en: "Hamdan Qarmat — the donkey-driver of Kuss Bihram who seeded the da'wa in Kufa's countryside {cite:fihrist-ibn-al-nadim}"
