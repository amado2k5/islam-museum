summary:
  ar: "المقرئ، كانت له واقعة مشهورة سنة ثلاث وعشرين واستتيب عن القراءة بالشاذ والمحضر الذي كتب عليه بحضرة الوزير ابن مقلة، ودعا على الوزير بأن يقطع الله يده فقطعت يده وذاق الذل، ومات في أيام الراضي {cite:tarikh-khulafa-minhaj-1434 p. 604,607}."
  en: "The Qur'an-reader whose famous affair came in 323: forced to repent the shadh readings before the vizier Ibn Muqla. His prayer that God sever the vizier's hand was answered — the hand was cut and Ibn Muqla tasted humiliation. He died under al-Radi {cite:tarikh-khulafa-minhaj-1434 p. 604,607}."
