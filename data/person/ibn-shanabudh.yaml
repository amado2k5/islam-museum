label: { ar: "ابن شنبوذ القارئ" }
summary:
  ar: "المقرئ، كانت له واقعة مشهورة سنة ثلاث وعشرين واستتيب عن القراءة بالشاذ والمحضر الذي كتب عليه بحضرة الوزير ابن مقلة، ودعا على الوزير بأن يقطع الله يده فقطعت يده وذاق الذل، ومات في أيام الراضي {cite:tarikh-khulafa-minhaj-1434 p. 604,607}."
  en: "The Qur'an-reader whose famous affair came in 323: forced to repent the shadh readings before the vizier Ibn Muqla. His prayer that God sever the vizier's hand was answered — the hand was cut and Ibn Muqla tasted humiliation. He died under al-Radi {cite:tarikh-khulafa-minhaj-1434 p. 604,607}."
  es: "El recitador del Corán cuyo famoso escándalo ocurrió en el año 323: fue obligado a arrepentirse de las lecturas del shadh ante el visir Ibn Muqla. Su súplica para que Dios le cortara la mano al visir fue escuchada: la mano fue cortada e Ibn Muqla sufrió una humillación. Murió bajo el reinado de al-Radi {cite:tarikh-khulafa-minhaj-1434 p. 604,607}."
  fr: "Le lecteur du Coran dont la célèbre affaire eut lieu en 323: contraint de se repentir de ses lectures du shadh devant le vizir Ibn Muqla, sa prière demandant à Dieu de trancher la main du vizir fut exaucée; la main fut coupée et Ibn Muqla connut l’humiliation. Il mourut sous le règne d’al-Radi (voir: Tarikh-Khulafa-Minhaj-1434, p. 604, 607)."
