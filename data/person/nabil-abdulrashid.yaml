summary:
  ar: "كوميدي بريطاني نيجيري وُلد في لندن سنة 1985. صار سنة 2010 أصغر كوميدي أسود يقدم عرضًا في هامرسميث أبولو، وجال بعرضه «لا داعي للذعر، أنا مسلم!»، وحلّ رابعًا في نهائي برنامج «بريطانيا غوت تالنت» سنة 2020، وظهر في برامج «لايف آت ذي أبولو» و«كيو آي» و«8 أوت أوف 10 كاتس داز كاونتداون»."
  en: "British-Nigerian stand-up comedian, born in London in 1985. In 2010 he became the youngest black comedian to perform stand-up at the Hammersmith Apollo, toured his show Don't Panic, I'm Islamic!, finished fourth in the Britain's Got Talent final of 2020, and has appeared on Live at the Apollo, QI and 8 Out of 10 Cats Does Countdown."
  ur: "برطانوی نائجیرین اسٹینڈ اپ کامیڈین، جو 1985 میں لندن میں پیدا ہوئے۔ 2010 میں وہ ہیمرسمتھ اپولو میں اسٹینڈ اپ پیش کرنے والے سب سے کم عمر سیاہ فام کامیڈین بنے، اپنے شو «ڈونٹ پینک، آئی ایم اسلامک!» کے ساتھ دورے کیے، 2020 میں «برطانیہ گاٹ ٹیلنٹ» کے فائنل میں چوتھے نمبر پر رہے، اور «لائیو ایٹ دی اپولو»، «کیو آئی» اور «8 آؤٹ آف 10 کیٹس ڈز کاؤنٹ ڈاؤن» میں نظر آئے۔"

