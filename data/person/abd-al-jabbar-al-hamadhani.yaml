summary:
  ar: "متكلم معتزلي شافعي الفقه، أبو الحسن، وُلد نحو سنة 325هـ، ودُعي إلى الري سنة 367هـ / 978م، وتوفي سنة 415هـ / 1025م. صنّف «المغني» الذي بقي أغلبه، و«تثبيت دلائل النبوة». {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
  en: "Mu'tazili theologian, a Shafi'i in law, Abu l-Hasan. He was born about 325, was called to Rayy in 367/978 by Ibn 'Abbad, and was appointed chief qadi of the province. He died in 415/1025. His major work al-Mughni has largely survived, and his treatise on prophecy is extant. He is described as the chief figure of the last phase of Mu'tazilism. {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
  ur: "معتزلی متکلم، شافعی فقیہ، جو 325 کے قریب پیدا ہوئے، 367/978 میں رے بلائے گئے اور 415/1025 میں وفات پائی۔ ان کی المغنی کا بیشتر حصہ محفوظ ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 78}"
