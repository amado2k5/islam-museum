class: person
label: { ar: "الأحمر النحوي", en: "al-Ahmar the grammarian", fr: "Al-Ahmar le grammairien", es: "al-Ahmar the grammarian", ur: "الاحمر گرامر" }
summary:
  ar: "بعث إليه الرشيد لتأديب ولده محمد الأمين فأوصاه أن يقرئه القرآن ويعرفه الآثار ويرويه الأشعار ويعلمه السنن ويبصره مواقع الكلام ويمنعه الضحك إلا في أوقاته ويأخذه بتعظيم مشايخ بني هاشم ورفع مجالس القواد ولا تمر به ساعة إلا مغتنم فيها فائدة من غير أن يخرق به فيميت ذهنه {cite:muruj-al-dhahab p. 338}."
  en: "Al-Amin's tutor — briefed by al-Rashid to teach Qur'an, athar, verse and sunna 'without killing his mind' {cite:muruj-al-dhahab p. 338}."
  fr: "Précepteur d’al-Amin — chargé par al-Rashid d’enseigner le Coran, les traditions, les vers et la sunna « sans tuer son esprit » {cite:muruj-al-dhahab p. 338}."
  es: "El tutor de Al-Amin, encargado por Al-Rashid de enseñar el Corán, el Athar, los versículos y la Sunna \"sin matar su mente\" {cita: Muruj-al-Dhahab p. 338}."
  ur: "الامین کے ٹیوٹر - کو الرشید نے 'اپنے دماغ کو مارے بغیر' قرآن، اطہر، آیت اور سنت کی تعلیم دینے کے لیے بتایا۔ 338}۔"
  tr: "Raşid, oğlu Muhammed el-Amin'i terbiye etmesi için onu gönderdi ve ona Kur'an'ı öğretmesini, hadisleri bilmesini sağlamasını, ona şiir okumasını, sünneti öğretmesini, sözlerin anlamını anlamasını sağlamasını, uygun zamanlar dışında gülmesini engellemesini, Beni Haşim'in büyüklerine saygı duymasını ve komutanların tavsiyelerini yükseltmesini, bir saat bile fayda görmeden geçirmemesini, ona karşı kayıtsız kalmamasını ve böylece aklını öldürmemesini emretti. {Kaynak: Muruj-al-Dhahab s. 338}"
  id: "Al-Rashid mengutusnya untuk mendisiplinkan putranya, Muhammad al-Amin, sehingga ia memerintahkannya untuk mengajarinya Al-Qur'an, membuatnya menyadari tradisi, membacakan puisi kepadanya, mengajarinya Sunnah, membuatnya memahami konteks ucapan, mencegahnya tertawa kecuali pada waktu yang tepat, membuatnya menghormati para tetua Banu Hasyim dan meninggikan musyawarah para komandan, dan tidak membiarkan satu jam pun berlalu tanpa ia memperoleh manfaat, tanpa bersikap sembrono terhadapnya dan dengan demikian merusak pikirannya. {kutipan:muruj-al-dhahab hlm. 338}."
