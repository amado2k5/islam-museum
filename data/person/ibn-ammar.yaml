summary:
  ar: "أبو بكر محمد بن عمار الشاعر الوزير بإشبيلية، الملقب ذا الوزارتين؛ كان وزير المعتمد بن عباد ونديمه، وحكي أن المعتمد ركب في النهر ومعه ابن عمار وقد زردت الريح الماء فقال له أجز صنع الريح من الماء زرد فأطال الفكرة فقالت امرأة من الغسالات أي درع لقتال لو جمد فتزوجها المعتمد وهي الرميكية أم أولاده؛ ولما قال ابن عمار قصيدته اللامية الشهيرة في المعتمد والرميكية التي فيها رميكية ما تساوي عقالا أغرت المعتمد به حتى قتله وضربه بالطبرزين فشق رأسه وترك الطبرزين في رأسه فقالت الرميكية قد بقي ابن عمار مدهناً، ومن شعره قرأت كتابك مستشفعاً بوجه أبي الحسن من رده ومن قبل فض ختام الكتاب قرأت الشفاعة في خده، وقال الحجاري إكثار ابن عمار في المعذرين وإحسانه فيهم يدلك على أنه كان مشغوفاً بالكأس والاستلقاء من غير نعاس {cite:nafh-tib-maqqari p. 73, 211-212}."
  en: "Abu Bakr ibn Ammar, poet and wazir of al-Mu'tamid at Seville, also styled Dhu'l-Wizaratayn; present at the river-meeting where the washerwoman Rimaykiyya capped the king's verse — but his famous Lamiyya sneering 'a Rimaykiyya worth not a sandal-strap' set al-Mu'tamid against him until the king killed him, burying the axe-head in his skull, at which she quipped 'Ibn Ammar is still anointed' {cite:nafh-tib-maqqari p. 211-212}."
gender: male
