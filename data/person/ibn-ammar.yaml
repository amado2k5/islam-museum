summary:
  ar: "أبو بكر محمد بن عمار الشاعر الوزير بإشبيلية، الملقب ذا الوزارتين؛ كان وزير المعتمد بن عباد ونديمه، وحكي أن المعتمد ركب في النهر ومعه ابن عمار وقد زردت الريح الماء فقال له أجز صنع الريح من الماء زرد فأطال الفكرة فقالت امرأة من الغسالات أي درع لقتال لو جمد فتزوجها المعتمد وهي الرميكية أم أولاده؛ ولما قال ابن عمار قصيدته اللامية الشهيرة في المعتمد والرميكية التي فيها رميكية ما تساوي عقالا أغرت المعتمد به حتى قتله وضربه بالطبرزين فشق رأسه وترك الطبرزين في رأسه فقالت الرميكية قد بقي ابن عمار مدهناً، ومن شعره قرأت كتابك مستشفعاً بوجه أبي الحسن من رده ومن قبل فض ختام الكتاب قرأت الشفاعة في خده، وقال الحجاري إكثار ابن عمار في المعذرين وإحسانه فيهم يدلك على أنه كان مشغوفاً بالكأس والاستلقاء من غير نعاس {cite:nafh-tib-maqqari p. 73, 211-212}."
  en: "Abu Bakr ibn Ammar, poet and wazir of al-Mu'tamid at Seville, also styled Dhu'l-Wizaratayn; present at the river-meeting where the washerwoman Rimaykiyya capped the king's verse — but his famous Lamiyya sneering 'a Rimaykiyya worth not a sandal-strap' set al-Mu'tamid against him until the king killed him, burying the axe-head in his skull, at which she quipped 'Ibn Ammar is still anointed' {cite:nafh-tib-maqqari p. 211-212}."
  es: "Abu Bakr ibn Ammar, poeta y visir de al-Mu'tamid en Sevilla, también llamado Dhu'l-Wizaratayn; presente en el encuentro del río donde la lavandera Rimaykiyya remató el verso del rey, pero su famosa Lamiyya burlándose \"una Rimaykiyya que no vale ni una correa de sandalia\" puso a al-Mu'tamid en su contra hasta que el rey lo mató, enterrando la cabeza del hacha en su cráneo, ante lo cual ella bromeó \"Ibn Ammar todavía está ungido\" {cite:nafh-tib-maqqari p. 211-212}."
  fr: "Abu Bakr ibn Ammar, poète et vizir d'al-Mu'tamid à Séville, également appelé Dhu'l-Wizaratayn; présent à la rencontre du fleuve où la lavandière Rimaykiyya conclut le vers du roi — mais sa célèbre remarque sarcastique de Lamiyya « une Rimaykiyya ne vaut pas une lanière de sandale » mit al-Mu'tamid contre lui jusqu'à ce que le roi le tue, enfonçant la tête de hache dans son crâne, ce à quoi elle lança avec humour « Ibn Ammar est toujours oint » {cite: nafh-tib-maqqari p. 211-212}."
  ur: "ابوبکر بن عمار، شاعر اور سیویل میں المتمید کے وزیر، نے بھی ذوال وزارتین کا انداز بنایا۔ دریا کی میٹنگ میں موجود تھی جہاں دھوبی ریمیکیہ نے بادشاہ کی آیت کو ڈھانپ دیا تھا - لیکن اس کی مشہور لامیہ نے 'ایک رمائیکیہ جو چندن کا پٹا نہیں ہے' کا طعنہ دیتے ہوئے اس کے خلاف المتمد کو کھڑا کردیا یہاں تک کہ بادشاہ نے اسے قتل کردیا اور کلہاڑی کا سر اس کی کھوپڑی میں دفن کردیا، جس پر وہ اب بھی عمارات میں موجود ہے۔ {حوالہ: نفح تبع مقری ص۔ 211-212}۔"
  tr: "Sevilla'nın şair ve bakanı Ebu Bekir Muhammed bin Ammar, İki Vezirin Sahibi lakabıyla anılır, el-Mu'tamid bin Abbad'ın bakanı ve yoldaşıydı. Rivayete göre, el-Mu'tamid rüzgar suyu savururken İbn Ammar ile birlikte nehirde sürmüştür. Ondan rüzgarın sudan yapılmasına izin vermesini istemiştir. Fikrini uzatmıştır. Çamaşır makinesinden bir kadın, 'Donarsa hangi zırhla savaşmalı?' dedi. El-Mu'tamid onunla evlendi ve çocuklarının annesi oldu. İbn Ammar, ünlü Lamiyye şiirini al-Mu'tamid ve başbantla eşdeğer bir ramikiya içeren rumaikiyya'yı okuduğunda, el-Mu'tamid'i bununla baştan çıkarana kadar Onu öldürdü ve iki barbarla vurdu, başını yardı ve başında iki çubuk bıraktı. El-Rumeyye şöyle dedi: 'İbn Ammar yağlı kaldı ve şiirlerinden, Ebu al-Hasan'ın reddinden dolayı yüzünden aracılık dileyen kitabınızı okudum, kitabın sonuna kadar yanağında ise aracılık okudum.' El-Haciri, İbn Ammar'ın bolca bahanesi ve onlara gösterdiği iyiliğin, onun kâseye ve uykusuz yatmaya tutkulu olduğunu gösterdiğini söyledi {atı:nafh-tib-maqqari s. 73, 211-212}."
  id: "Abu Bakr Muhammad ibn Ammar, penyair dan menteri di Sevilla, yang dijuluki Penguasa Dua Waziri, adalah menteri dan teman al-Mu'tamid ibn Abbad. Konon al-Mu'tamid menunggang sungai bersama Ibn Ammar saat angin meniup air. Ia memintanya untuk mengizinkan pembuatan angin dari air. Ia melanjutkan dengan memperpanjang gagasan tersebut. Seorang wanita dari mesin cuci berkata, 'Baju zirah apa yang harus dilawan jika membeku?' Al-Mu'tamid menikahinya, dan ia adalah ibu dari anak-anaknya. Ketika Ibn Ammar membacakan puisi Lamiyyah terkenalnya tentang al-Mu'tamid, dan rumaikiyya, yang berisi ramikiya setara dengan ikat kepala, menggoda al-Mu'tamid dengan itu hingga Ia membunuhnya dan memukulnya dengan dua barbar, membelah kepalanya dan meninggalkan dua batang itu di kepalanya. Al-Rumayyyah berkata, 'Ibn Ammar tetap berminyak, dan dari puisinya saya membaca buku Anda yang memohon perantaraan dari wajah Abu al-Hasan atas penolakannya, dan sebelum akhir buku, saya membaca perantaraan di pipinya.' Al-Hajjari mengatakan banyaknya alasan dan kebaikannya kepada mereka menunjukkan bahwa ia sangat bersemangat terhadap cawan dan berbaring tanpa kantuk {cite:nafh-tib-maqqari hlm. 73, 211-212}."
