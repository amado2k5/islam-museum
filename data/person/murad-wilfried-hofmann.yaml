summary:
  ar: "دبلوماسي وحقوقي وكاتب ألماني وُلد سنة 1931 في أشافنبورغ ببافاريا لأسرة كاثوليكية، وخدم في السلك الدبلوماسي الألماني من 1961 إلى 1994، وكان سفيرًا لبلاده في الجزائر ثم المغرب. اعتنق الإسلام سنة 1980، وكتب «الإسلام كبديل» و«رحلة إلى مكة»، وكان مستشارًا وعضوًا فخريًا في المجلس المركزي لمسلمي ألمانيا. توفي في بون سنة 2020."
  en: "German diplomat, jurist and author, born in 1931 at Aschaffenburg, Bavaria, into a Catholic family. He served in the German Foreign Service from 1961 to 1994, as ambassador to Algeria and then to Morocco. He embraced Islam in 1980, wrote Islam: The Alternative and Journey to Makkah, and was an honorary member and adviser of the Central Council of Muslims in Germany. He died at Bonn in 2020."
  ur: "جرمن سفارت کار، قانون دان اور مصنف جو 1931 میں باویریا کے شہر اشافنبرگ میں ایک کیتھولک گھرانے میں پیدا ہوئے۔ انھوں نے 1961 سے 1994 تک جرمن فارن سروس میں کام کیا اور الجزائر اور پھر مراکش میں سفیر رہے۔ انھوں نے 1980 میں اسلام قبول کیا، «اسلام: متبادل» اور «سفر مکہ» لکھیں اور جرمنی کی مسلم مرکزی کونسل کے اعزازی رکن اور مشیر رہے۔ 2020 میں بون میں وفات پائی۔"
  fr: "Diplomate, juriste et auteur allemand, né en 1931 à Aschaffenburg (Bavière) dans une famille catholique. Il servit dans le service diplomatique allemand de 1961 à 1994, comme ambassadeur en Algérie puis au Maroc. Il embrassa l'islam en 1980, écrivit *L'Islam comme alternative* et *Voyage à La Mecque*, et fut membre d'honneur et conseiller du Conseil central des musulmans d'Allemagne. Il mourut à Bonn en 2020."
  es: "Diplomático, jurista y autor alemán, nacido en 1931 en Aschaffenburg (Baviera) en una familia católica. Sirvió en el servicio exterior alemán de 1961 a 1994, como embajador en Argelia y luego en Marruecos. Abrazó el islam en 1980, escribió *El islam como alternativa* y *Viaje a La Meca*, y fue miembro honorario y asesor del Consejo Central de los Musulmanes de Alemania. Murió en Bonn en 2020."
