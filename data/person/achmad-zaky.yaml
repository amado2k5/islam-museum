summary:
  ar: "أحمد زكي سيف الدين (وُلد في 24 آب 1986 في سراغين بجاوة الوسطى) رائد أعمال ومستثمر إندونيسي في الإنترنت، شارك في تأسيس سوق التجارة الإلكترونية بوكالاباك سنة 2010 وتولى إدارتها التنفيذية حتى كانون الثاني 2020؛ فاز في أولمبياد العلوم الوطني في علوم الحاسوب وهو في المدرسة الثانوية في سولو، ودرس هندسة المعلوماتية في معهد باندونغ للتكنولوجيا، ونال وسام ساتيالانكانا ويرا كاريا سنة 2016، ثم شارك بعد مغادرته بوكالاباك في تأسيس صندوق الاستثمار الجريء للشركات الناشئة إنيت6."
  en: "Achmad Zaky (born Achmad Zaky Syaifudin on 24 August 1986 in Sragen, Central Java) is an Indonesian internet entrepreneur and investor, co-founder of the e-commerce marketplace Bukalapak in 2010 and its chief executive until January 2020; a National Science Olympiad winner in computer science while at high school in Solo, he studied informatics engineering at the Bandung Institute of Technology, received the Satyalancana Wira Karya award in 2016, and after leaving Bukalapak co-founded the early-stage venture fund Init6."
  ur: "احمد زکی سیف الدین (پیدائش 24 اگست 1986، سراگین، وسطی جاوا) انڈونیشیائی انٹرنیٹ کاروباری و سرمایہ کار ہیں، 2010 میں ای کامرس بازار بوکالاپاک کے شریک بانی اور جنوری 2020 تک اس کے چیف ایگزیکٹو رہے؛ سولو میں ہائی اسکول کے دوران کمپیوٹر سائنس میں قومی سائنس اولمپیاڈ جیتا، بانڈونگ انسٹی ٹیوٹ آف ٹیکنالوجی سے انفارمیٹکس انجینئرنگ پڑھی، 2016 میں انھیں ساتیالانچانا ویرا کاریا اعزاز ملا، اور بوکالاپاک چھوڑنے کے بعد انھوں نے ابتدائی مرحلے کے سرمایہ کاری صندوق انٹ6 کی شریک بنیاد رکھی۔"
