summary:
  ar: "لاعبة تايكوندو بلغارية مولودة في إيران، وُلدت في كرج سنة 1998. جعلتها برونزيتها في ريو 2016 أول إيرانية تفوز بميدالية في أولمبياد صيفي. غادرت إيران في يناير 2020، ونافست مع فريق اللاجئين الأولمبي في طوكيو 2020، وحصلت على الجنسية البلغارية سنة 2024 وفازت ببرونزية لبلغاريا في باريس 2024."
  en: "Iranian-born Bulgarian taekwondo athlete, born in Karaj in 1998. Her bronze medal at Rio 2016 made her the first Iranian woman to win a Summer Olympic medal. She left Iran in January 2020, competed for the Refugee Olympic Team at Tokyo 2020, took Bulgarian citizenship in 2024 and won bronze for Bulgaria at Paris 2024."
  ur: "ایرانی نژاد بلغاریہ کی تائیکوانڈو کھلاڑی، 1998 میں کرج میں پیدا ہوئیں۔ ریو 2016 میں ان کے کانسی کے تمغے نے انہیں سمر اولمپکس میں تمغہ جیتنے والی پہلی ایرانی خاتون بنایا۔ وہ جنوری 2020 میں ایران سے چلی گئیں، ٹوکیو 2020 میں مہاجر اولمپک ٹیم کی طرف سے کھیلیں، 2024 میں بلغاریہ کی شہریت حاصل کی اور پیرس 2024 میں بلغاریہ کے لیے کانسی کا تمغہ جیتا۔"
