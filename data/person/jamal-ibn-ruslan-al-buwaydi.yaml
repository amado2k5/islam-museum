summary:
  ar: "جمال الدين عبد الله بن عبد الله بن رسلان البويضي من قرية البويضة من أعمال دمشق؛ ولد سنة إحدى وخمسين وثمانمائة وكان رفيقاً للشيخ تقي الدين البلاطنسي على مشايخه، وأخذ عنه الشيخ موسى الكنّاوي صحيح البخاري وغيره؛ توفي بالبيمارستان النوري يوم الخميس سادس أو سابع ذي القعدة وصلى عليه إماماً رفيقه البلاطنسي ودُفن بمقبرة باب الصغير جوار الشيخ حماد {cite:shadharat-dhahab p. 560}."
  en: "Of Buwayda village outside Damascus (b. 851) — companion-in-study to Taqi al-Din al-Balatinsi, from whom Musa al-Kinnawi took Sahih al-Bukhari; died at the Nuri hospital Thursday 6 or 7 Dhu'l-Qa'da, al-Balatinsi leading his prayer, buried at Bab al-Saghir near Shaykh Hammad {cite:shadharat-dhahab p. 560}."
