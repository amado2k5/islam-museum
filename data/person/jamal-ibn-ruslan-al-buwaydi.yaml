summary:
  ar: "جمال الدين عبد الله بن عبد الله بن رسلان البويضي من قرية البويضة من أعمال دمشق؛ ولد سنة إحدى وخمسين وثمانمائة وكان رفيقاً للشيخ تقي الدين البلاطنسي على مشايخه، وأخذ عنه الشيخ موسى الكنّاوي صحيح البخاري وغيره؛ توفي بالبيمارستان النوري يوم الخميس سادس أو سابع ذي القعدة وصلى عليه إماماً رفيقه البلاطنسي ودُفن بمقبرة باب الصغير جوار الشيخ حماد {cite:shadharat-dhahab p. 560}."
  en: "Of Buwayda village outside Damascus (b. 851) — companion-in-study to Taqi al-Din al-Balatinsi, from whom Musa al-Kinnawi took Sahih al-Bukhari; died at the Nuri hospital Thursday 6 or 7 Dhu'l-Qa'da, al-Balatinsi leading his prayer, buried at Bab al-Saghir near Shaykh Hammad {cite:shadharat-dhahab p. 560}."
  es: "De la aldea de Buwayda en las afueras de Damasco (n. 851): compañero de estudios de Taqi al-Din al-Balatinsi, de quien Musa al-Kinnawi tomó a Sahih al-Bukhari; murió en el hospital de Nuri el jueves 6 o 7 Dhu'l-Qa'da, al-Balatinsi dirigiendo su oración, enterrado en Bab al-Saghir cerca de Shaykh Hammad {cita:shadharat-dhahab p. 560}."
  fr: "Du village de Buwayda à l'extérieur de Damas (né en 851) — compagnon d'étude de Taqi al-Din al-Balatinsi, de qui Musa al-Kinnawi prit Sahih al-Bukhari; est décédé à l'hôpital de Nouri jeudi 6 ou 7 Dhu'l-Qa'da, al-Balatinsi dirigeant sa prière, enterré à Bab al-Saghir près de Shaykh Hammad {cite:shadharat-dhahab p. 560}."
  ur: "دمشق کے باہر بوویدہ گاؤں کا ⁦(وفات 851)⁩ - تقی الدین البالطینسی کے ساتھی، جن سے موسیٰ الکنوی نے صحیح البخاری لی۔ نوری ہسپتال میں جمعرات 6 یا 7 ذوالقعدہ میں انتقال ہوا، البالتنسی نے اپنی نماز پڑھائی، شیخ حماد کے قریب باب الصغیر میں دفن کیا گیا۔ 560}۔"
  tr: "Cemaleddin Abdullah bin Abdullah bin Ruslan el-Buwaidi, Şam'ın bir ilçesindeki el-Buveyde köyündendir; 851 Hicri yılında doğmuş, öğretmenleri arasında Şeyh Taqi al-Din el-Baltansi'nin yoldaşıydı. Şeyh Musa el-Kanawi, Sahih al-Bukhari ve diğerlerini ondan öğrenmiştir. Perşembe günü, Zulü Kı'dah'ın altıncı veya yedinci günü Nuri Hastanesi'nde vefat etmiştir. Yoldaşı el-Baltansi onun üzerine cenaze namazını kaçırmış ve Şeyh Hammad'ın yanındaki Bab al-Saghir mezarlığında defnedilmiştir {alıntı:şadharat-dhahab, s. 560}."
  id: "Jamal al-Din Abdullah ibn Abdullah ibn Ruslan al-Buwaidi berasal dari desa al-Buwaydah, sebuah distrik di Damaskus; lahir pada tahun 851 H, ia adalah sahabat Sheikh Taqi al-Din al-Baltansi di antara para gurunya. Sheikh Musa al-Kanawi mempelajari Sahih al-Bukhari dan lainnya darinya. Ia meninggal di Rumah Sakit Nuri pada hari Kamis, tanggal enam atau ketujuh Dhu al-Qi'dah. Rekannya al-Baltansi memimpin doa pemakaman untuknya, dan ia dimakamkan di pemakaman Bab al-Saghir di sebelah Sheikh Hammad {cite:shadharat-dhahab, hlm. 560}."
