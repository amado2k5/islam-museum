label: { ar: "غيلان الدمشقي" }
summary:
  ar: "رأس القدرية في الشام؛ قال الذهبي أظهر غيلان القدر في خلافة عمر بن عبد العزيز فاستتابه عمر فقال لقد كنت ضالاً فهديتني فقال عمر اللهم إن كان صادقاً وإلا فاصليه واقطع يديه ورجليه، فنفذت دعوته فيه فأخذ في خلافة هشام بن عبد الملك وقطعت أربعته وصلب بدمشق في القدر {cite:tarikh-khulafa-minhaj-1434 p. 394}.، وغيلان أبو مروان ولرسائله مجموع نحو ألفي ورقة {cite:fihrist-ibn-al-nadim p. 171,178}"
  en: "Head of the Qadariyya in Damascus; per al-Dhahabi, Ghaylan proclaimed qadar in Umar ibn Abd al-Aziz's caliphate and Umar demanded his repentance — 'I was astray and you guided me,' he said, and Umar prayed that if he lied he be crucified and his limbs cut. The prayer took effect: under Hisham ibn Abd al-Malik he was seized, his four limbs cut, and he was crucified in Damascus over qadar {cite:tarikh-khulafa-minhaj-1434 p. 394}."
