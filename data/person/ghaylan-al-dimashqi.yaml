id: person/ghaylan-al-dimashqi
class: person
label: { ar: "غيلان الدمشقي" }
summary:
  ar: "رأس القدرية في الشام؛ قال الذهبي أظهر غيلان القدر في خلافة عمر بن عبد العزيز فاستتابه عمر فقال لقد كنت ضالاً فهديتني فقال عمر اللهم إن كان صادقاً وإلا فاصليه واقطع يديه ورجليه، فنفذت دعوته فيه فأخذ في خلافة هشام بن عبد الملك وقطعت أربعته وصلب بدمشق في القدر {cite:tarikh-khulafa-minhaj-1434 p. 394}. وغيلان أبو مروان ولرسائله مجموع نحو ألفي ورقة {cite:fihrist-ibn-al-nadim p. 171,178}"
  en: "Head of the Qadariyya in Damascus; per al-Dhahabi, Ghaylan proclaimed qadar in Umar ibn Abd al-Aziz's caliphate and Umar demanded his repentance — 'I was astray and you guided me,' he said, and Umar prayed that if he lied he be crucified and his limbs cut. The prayer took effect: under Hisham ibn Abd al-Malik he was seized, his four limbs cut, and he was crucified in Damascus over qadar {cite:tarikh-khulafa-minhaj-1434 p. 394}."
  es: "Jefe de la Qadariyya en Damasco; según al-Dhahabi, Ghaylan proclamó el qadar en el califato de Umar ibn Abd al-Aziz y Umar le exigió arrepentimiento: «Estaba extraviado y me guiaste», dijo, y Umar oró para que, si mentía, fuera crucificado y le cortaran las extremidades. La oración surtió efecto: bajo el califato de Hisham ibn Abd al-Malik fue apresado, le cortaron las cuatro extremidades y fue crucificado en Damasco por el qadar {cite:tarikh-khulafa-minhaj-1434 p. 394}."
  fr: "Chef de la Qadariyya à Damas, Ghaylan, selon al-Dhahabi, proclama le qadar sous le califat d'Umar ibn Abd al-Aziz. Umar exigea alors son repentir: « J'étais égaré et tu m'as guidé », dit-il. Umar pria pour que, s'il avait menti, il soit crucifié et mutilé. Sa prière fut exaucée: sous Hisham ibn Abd al-Malik, il fut arrêté, mutilé et crucifié à Damas pour qadar (voir: Tarikh-Khulafa-Minhaj-1434, p. 394)."
  ur: "دمشق میں قادریہ کے سربراہ؛ الذہبی کے مطابق، غیلان نے عمر بن عبدالعزیز کی خلافت میں قدر کا اعلان کیا اور عمر نے ان سے توبہ کا مطالبہ کیا - 'میں گمراہ تھا اور تم نے میری رہنمائی کی'، اس نے کہا، اور عمر نے دعا کی کہ اگر وہ جھوٹ بولے تو اسے سولی پر چڑھایا جائے اور اس کے اعضاء کاٹے جائیں۔ نماز کا اثر ہوا: ہشام بن عبد الملک کے ماتحت اسے پکڑ لیا گیا، اس کے چار اعضاء کاٹے گئے، اور اسے دمشق میں قدر کے لیے سولی پر چڑھایا گیا۔ 394}۔"
