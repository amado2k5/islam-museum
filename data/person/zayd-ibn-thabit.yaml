summary:
  en: "A young Ansari who became the Prophet's scribe of revelation; Abu Bakr set him to gather the Qur'an, and Uthman's committee under him produced the standard recension still read today."
  ar: "أنصاري شاب صار كاتب وحي النبي؛ كلفه أبو بكر بجمع القرآن، وترأس لجنة عثمان فخرج منها المصحف المعتمد الذي يُقرأ اليوم. وأورد ابن النديم إسناده إلى زيد في خبر جمع القرآن حين أرسل إليه أبو بكر وعمر عنده بعد استحرار القتل بالقراء يوم اليمامة فقال فوالله لنقل جبل من الجبال ما كان أثقل عليّ من الذي أمرني به من جمع القرآن فاتبع القرآن يجمعه من الرقاع واللخاف والعسب وصدور الرجال حتى وجد آخر سورة التوبة مع أبي خزيمة الأنصاري {cite:fihrist-ibn-al-nadim p. 59-60} ويذكره الصحيح في الأنصاريين الأربعة الذين جمعوا القرآن على عهد النبي: أبي بن كعب ومعاذ بن جبل وأبو زيد وزيد بن ثابت {cite:sahih-al-bukhari 3810}."
