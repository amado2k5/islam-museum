summary:
  ar: "زيد بن ثابت صحابي أنصاري من بني النجار من الخزرج، قُتل أبوه يوم بعاث وكان في الحادية عشرة عند الهجرة. كان من كتّاب النبي يكتب الآيات والرسائل إلى الملوك، واشتهر بعلم الفرائض والحساب. وتولى في عهد أبي بكر وعمر وعثمان ثم معاوية مهام مالية وإدارية منها بيت المال وديوان المدينة، ويُذكر دوره في جمع القرآن وفي إعداد النسخة الرسمية في عهد عثمان. وأورد ابن النديم إسناده إلى زيد في خبر جمع القرآن حين أرسل إليه أبو بكر وعمر عنده بعد استحرار القتل بالقراء يوم اليمامة، فاتبع القرآن يجمعه من الرقاع واللخاف والعسب وصدور الرجال حتى وجد آخر سورة التوبة مع أبي خزيمة الأنصاري {cite:fihrist-ibn-al-nadim p. 59-60} ويذكره الصحيح في الأنصاريين الأربعة الذين جمعوا القرآن على عهد النبي: أبي بن كعب ومعاذ بن جبل وأبو زيد وزيد بن ثابت {cite:sahih-al-bukhari 3810}."
  en: "Zayd ibn Thabit was an Ansari Companion of the Banu al-Najjar of the Khazraj, orphaned at Bu'ath and eleven at the Hijra. He was one of the Prophet's scribes, writing verses and letters to rulers, and was a noted expert on inheritance shares and calculation. Under Abu Bakr, Umar, Uthman and later Muawiya he held financial and administrative duties, including the treasury and the diwan of Medina, and he is remembered for his role in the collection of the Qur'an and in the official edition under Uthman."
  ur: "زید بن ثابت خزرج کی شاخ بنو نجار کے انصاری صحابی تھے، جن کے والد جنگِ بُعاث میں مارے گئے اور ہجرت کے وقت وہ گیارہ برس کے تھے۔ وہ نبی کے کاتب تھے جو آیات اور بادشاہوں کے نام خطوط لکھتے تھے، اور وراثت اور حساب کے مشہور ماہر تھے۔ ابو بکر، عمر، عثمان اور بعد میں معاویہ کے دور میں انہوں نے بیت المال اور مدینہ کے دیوان سمیت مالی اور انتظامی ذمہ داریاں نبھائیں، اور قرآن کے جمع کیے جانے اور عثمان کے سرکاری نسخے میں ان کا کردار یاد کیا جاتا ہے۔"
