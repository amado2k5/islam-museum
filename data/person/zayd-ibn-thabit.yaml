summary:
  ar: "زيد بن ثابت صحابي أنصاري من بني النجار من الخزرج، قُتل أبوه يوم بعاث وكان في الحادية عشرة عند الهجرة. كان من كتّاب النبي يكتب الآيات والرسائل إلى الملوك، واشتهر بعلم الفرائض والحساب. وتولى في عهد أبي بكر وعمر وعثمان ثم معاوية مهام مالية وإدارية منها بيت المال وديوان المدينة، ويُذكر دوره في جمع القرآن وفي إعداد النسخة الرسمية في عهد عثمان. وأورد ابن النديم إسناده إلى زيد في خبر جمع القرآن حين أرسل إليه أبو بكر وعمر عنده بعد استحرار القتل بالقراء يوم اليمامة، فاتبع القرآن يجمعه من الرقاع واللخاف والعسب وصدور الرجال حتى وجد آخر سورة التوبة مع أبي خزيمة الأنصاري {cite:fihrist-ibn-al-nadim p. 59-60} ويذكره الصحيح في الأنصاريين الأربعة الذين جمعوا القرآن على عهد النبي: أبي بن كعب ومعاذ بن جبل وأبو زيد وزيد بن ثابت {cite:sahih-al-bukhari 3810}."
  en: "Zayd ibn Thabit was an Ansari Companion of the Banu al-Najjar of the Khazraj, orphaned at Bu'ath and eleven at the Hijra. He was one of the Prophet's scribes, writing verses and letters to rulers, and was a noted expert on inheritance shares and calculation. Under Abu Bakr, Umar, Uthman and later Muawiya he held financial and administrative duties, including the treasury and the diwan of Medina, and he is remembered for his role in the collection of the Qur'an and in the official edition under Uthman."
  ur: "زید بن ثابت خزرج کی شاخ بنو نجار کے انصاری صحابی تھے، جن کے والد جنگِ بُعاث میں مارے گئے اور ہجرت کے وقت وہ گیارہ برس کے تھے۔ وہ نبی کے کاتب تھے جو آیات اور بادشاہوں کے نام خطوط لکھتے تھے، اور وراثت اور حساب کے مشہور ماہر تھے۔ ابو بکر، عمر، عثمان اور بعد میں معاویہ کے دور میں انہوں نے بیت المال اور مدینہ کے دیوان سمیت مالی اور انتظامی ذمہ داریاں نبھائیں، اور قرآن کے جمع کیے جانے اور عثمان کے سرکاری نسخے میں ان کا کردار یاد کیا جاتا ہے۔"
  es: "Zayd ibn Thabit fue un compañero ansarí de los Banu al-Najjar de Khazraj, huérfano en Bu'ath y con once años en la Hégira. Fue uno de los escribas del Profeta, escribiendo versículos y cartas a los gobernantes, y un reconocido experto en herencias y su cálculo. Bajo los reinados de Abu Bakr, Umar, Uthman y posteriormente Muawiya, desempeñó funciones financieras y administrativas, incluyendo la tesorería y el diwan de Medina, y se le recuerda por su papel en la recopilación del Corán y en la edición oficial bajo el reinado de Uthman."
  fr: "Zayd ibn Thabit était un Ansar, Compagnon de la tribu des Banu al-Najjar, appartenant à la dynastie Khazraj. Orphelin à Bu'ath, il avait onze ans à l'Hégire. Scribe du Prophète, il rédigeait des versets et des lettres aux souverains et était un expert reconnu en matière de partage et de calcul des héritages. Sous Abou Bakr, Omar, Othman et plus tard Mu'awiya, il exerça des fonctions financières et administratives, notamment la gestion du trésor et du diwan de Médine. On se souvient de lui pour son rôle dans la compilation du Coran et dans l'édition officielle sous Othman."
  tr: "Zayd ibn Tabit, Hazraj'ın Banu al-Najjar'ından bir Ansari yoldaşıydı. Babası, on bir yaşındayken Babası Baba Baba gününde, Hicre sırasında öldürüldü. Peygamber'in yazıcıları arasındaydı, krallara şiirler ve mektuplar yazdı ve miras ile aritmetik bilgisiyle tanındı. Ebu Bekir, Ömer, Osman ve ardından Muaviye dönemlerinde hazine ve belediye meclisi dahil olmak üzere mali ve idari görevlerde bulundu. Osman'ın saltanatı sırasında Kur'an'ın toplanmasında ve resmi nüshasının hazırlanmasında rol aldığı belirtilir. İbn el-Nadim, Kur'an'ın derlenmesinin raporunda, Ebu Bekir ve Ömer Yamama gününde okuyanları öldürmeye teşvik edildikten sonra kendisine gönderildiğinde Zayd'a yaptığı aktarım zincirini aktarmıştır. Kur'an'ı takip ederek onu Ruka'dan, Lahhaf'tan, 'Asb'dan ve insan sandıklarından topladı; ta ki Ebu Huzeyme el-Ensari'nin son Et-Tevbe suresini bulana kadar {cite:Fihrist-ibn-al-Nadim s. 59-60}. Peygamber'in zamanında Kur'an'ı derleyen dört Ensari'nin özgün rivayetinde bahsedilir: Ubeyy ibn Ka'b, Mu'adh ibn Jabal, Ebu Zayd ve Zayd ibn Tabit {cite:sahih-al-bukhari 3810}."
  id: "Zayd ibn Thabit adalah seorang sahabat Ansari dari Banu al-Najjar dari Khazraj. Ayahnya dibunuh pada hari Ba'ath saat berusia sebelas tahun selama Hijrah. Ia termasuk di antara juru taurat Nabi, menulis ayat-ayat dan surat kepada raja, dan terkenal karena pengetahuannya tentang warisan dan aritmatika. Ia memegang jabatan keuangan dan administratif selama masa pemerintahan Abu Bakr, Umar, Uthman, dan kemudian Muawiya, termasuk perbendaharaan dan dewan kota. Perannya dalam mengumpulkan Al-Qur'an dan menyiapkan salinan resmi selama masa pemerintahan Utsman disebutkan. Ibn al-Nadim mengutip rantai transmisinya kepada Zayd dalam laporan penyusunan Al-Qur'an ketika Abu Bakr dan Umar dikirim kepadanya setelah hasutan untuk membunuh para pembaca pada hari Yamama. Ia mengikuti Al-Qur'an, mengumpulkannya dari Ruqa', Lakhaf, 'Asb, dan peti-peti manusia' hingga ia menemukan Surah terakhir At-Tawbah bersama Abu Khuzaymah al-Ansari {cite:fihrist-ibn-al-nadim hlm. 59-60}. Surah ini disebutkan dalam riwayat otentik dari empat Ansari yang menyusun Al-Qur'an pada masa Nabi: Ubayy ibn Ka'b, Mu'adh ibn Jabal, Abu Zayd, dan Zayd ibn Thabit {cite:sahih-al-bukhari 3810}."
