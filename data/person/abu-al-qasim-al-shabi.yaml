summary:
  ar: "شاعر تونس الوطني (1909–1934)، وُلد في الشابية بولاية توزر وتعلّم في الزيتونة حيث نال إجازة الحقوق سنة 1930، ومات شابًا بمرض القلب في تونس العاصمة. صاحب قصيدتي «إرادة الحياة» و«إلى طغاة العالم»، ومن أبياته خُتم النشيد الوطني التونسي، وصارت قصائده شعارًا لثورات الربيع العربي سنة 2011."
  en: "Tunisia's national poet (1909–1934), born at al-Shabiya in the Tozeur region and educated at the Zaytuna, where he took a law diploma in 1930; he died young of heart disease in Tunis. He wrote 'The Will to Live' and 'To the Tyrants of the World', supplied the closing verses of Tunisia's national anthem, and saw his poems become slogans of the 2011 Arab Spring."
  ur: "تیونس کے قومی شاعر (1909–1934)، جو توزر کے علاقے الشابیہ میں پیدا ہوئے اور جامع زیتونہ میں تعلیم پائی جہاں 1930ء میں قانون کی سند لی؛ کم عمری میں تونس شہر میں دل کی بیماری سے انتقال ہوا۔ وہ «ارادۂ حیات» اور «دنیا کے ظالموں کے نام» کے خالق ہیں، تیونس کے قومی ترانے کے آخری اشعار انہی کے ہیں، اور 2011ء کے عرب بہار میں ان کی نظمیں نعروں کی صورت اختیار کر گئیں۔"
