summary:
  ar: "شاعر تونس الوطني (1909–1934)، وُلد في الشابية بولاية توزر وتعلّم في الزيتونة حيث نال إجازة الحقوق سنة 1930، ومات شابًا بمرض القلب في تونس العاصمة. صاحب قصيدتي «إرادة الحياة» و«إلى طغاة العالم»، ومن أبياته خُتم النشيد الوطني التونسي، وصارت قصائده شعارًا لثورات الربيع العربي سنة 2011."
  en: "Tunisia's national poet (1909–1934), born at al-Shabiya in the Tozeur region and educated at the Zaytuna, where he took a law diploma in 1930; he died young of heart disease in Tunis. He wrote 'The Will to Live' and 'To the Tyrants of the World', supplied the closing verses of Tunisia's national anthem, and saw his poems become slogans of the 2011 Arab Spring."
  ur: "تیونس کے قومی شاعر (1909–1934)، جو توزر کے علاقے الشابیہ میں پیدا ہوئے اور جامع زیتونہ میں تعلیم پائی جہاں 1930ء میں قانون کی سند لی؛ کم عمری میں تونس شہر میں دل کی بیماری سے انتقال ہوا۔ وہ «ارادۂ حیات» اور «دنیا کے ظالموں کے نام» کے خالق ہیں، تیونس کے قومی ترانے کے آخری اشعار انہی کے ہیں، اور 2011ء کے عرب بہار میں ان کی نظمیں نعروں کی صورت اختیار کر گئیں۔"
  fr: "Poète national de la Tunisie (1909–1934), né à al-Shabiya dans la région de Tozeur et formé à la Zaytuna, où il obtint un diplôme de droit en 1930 ; il mourut jeune d'une maladie cardiaque à Tunis. Il écrivit « La Volonté de vivre » et « Aux tyrans du monde », fournit les derniers vers de l'hymne national tunisien, et vit ses poèmes devenir des slogans du Printemps arabe de 2011."
  es: "Poeta nacional de Túnez (1909-1934), nacido en al-Shabiya, en la región de Tozeur, y educado en Zaytuna, donde se licenció en Derecho en 1930; falleció joven de una enfermedad cardíaca en Túnez. Escribió «La voluntad de vivir» y «A los tiranos del mundo», compuso los versos finales del himno nacional tunecino y sus poemas se convirtieron en lemas de la Primavera Árabe de 2011."
  tr: "Tunus'un ulusal şairi (1909-1934), Tozeur Valiliği'ne bağlı Çebba'da doğdu, Zitouna Üniversitesi'nde hukuk eğitimi aldı ve 1930'da hukuk diploması kazandı. Tunus'ta kalp hastalığından genç yaşta vefat etti. \"Yaşama İsteği\" ve \"Dünyanın Tiranlarına\" şiirlerinin yazarıdır ve dizeleri Tunus milli marşının giriş bölümünü oluşturmaktadır. Şiirleri ayrıca 2011 Arap Baharı ayaklanmalarının marşı haline geldi."
  id: "Penyair nasional Tunisia (1909–1934), lahir di Chebba, Kegubernuran Tozeur, belajar di Universitas Zitouna, tempat ia memperoleh gelar sarjana hukum pada tahun 1930. Ia meninggal muda karena penyakit jantung di Tunis. Ia adalah penulis puisi \"Keinginan untuk Hidup\" dan \"Kepada Para Tirani Dunia,\" dan bait-bait puisinya menjadi pembuka lagu kebangsaan Tunisia. Puisi-puisinya juga menjadi lagu kebangsaan untuk pemberontakan Musim Semi Arab tahun 2011."
