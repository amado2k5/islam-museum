summary:
  ar: مصممة أزياء تركية وُلدت سنة 1967 في أضنة؛ من أبرز أسماء الهوت كوتور التركية، تُشتهر بفساتين تجمع زخارف التراث العثماني بالقصّات المعاصرة، وصممت لشخصيات عالمية وللأميرة ديانا حسب التقارير.
  en: Turkish haute-couture designer born in Adana in 1967; one of the leading names of Turkish couture, known for gowns fusing Ottoman heritage motifs with contemporary cuts, she has reportedly dressed
    international figures including Princess Diana.
  ur: ترک ہوت کوتور ڈیزائنر جو 1967 میں اضنہ میں پیدا ہوئی؛ ترک کوتور کے نمایاں ناموں میں، عثمانی ورثہ نقش اور جدید کٹ ملانے والے جوڑوں سے مشہور، اور رپورٹوں کے مطابق شہزادی ڈیانا سمیت بین الاقوامی شخصیات
    کے لیے ڈیزائن کیا۔
  es: "Diseñadora turca de alta costura nacida en Adana en 1967; uno de los nombres más destacados de la alta costura turca, conocida por sus vestidos que fusionan motivos de la herencia otomana con cortes contemporáneos, según se informa, ha vestido a figuras internacionales, incluida la princesa Diana."
  fr: "Créatrice de haute couture turque née à Adana en 1967; l'une des figures de proue de la couture turque, connue pour ses robes fusionnant les motifs de l'héritage ottoman avec des coupes contemporaines, elle aurait habillé des personnalités internationales, dont la princesse Diana."
  tr: "1967 yılında Adana'da doğmuş Türk moda tasarımcısı; Türk haute couture'unun en önde gelen isimlerinden biri, Osmanlı kökenli süslemeleri çağdaş kesimlerle birleştiren elbiseleriyle tanınıyor ve uluslararası figürler ile Prenses Diana için tasarlandığı bildiriliyor."
  id: "Seorang desainer busana Turki yang lahir pada tahun 1967 di Adana; salah satu nama paling menonjol dalam haute couture Turki, dikenal dengan gaun yang menggabungkan hiasan warisan Ottoman dengan potongan kontemporer, dan dilaporkan dirancang untuk tokoh internasional serta Putri Diana."
