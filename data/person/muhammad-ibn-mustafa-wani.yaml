summary:
  ar: "محمد بن مصطفى الواني، ويعرف بوان قولي، فقيه حنفي رومي تولى التدريس والقضاء في بلاده، له إثبات المسموعات ونقد الدرر، وترجم إلى التركية الصحاح للجوهري وكيمياء السعادة للغزالي؛ توفي سنة 1000 هـ الموافقة 1592م."
  en: "Muhammad ibn Mustafa al-Wani, known as Wan Quli, a Hanafi jurist of Rum who taught and served as judge in his country, author of Ithbat al-Masmu'at and Naqd al-Durar, and translator into Turkish of al-Jawhari's Sihah and al-Ghazali's Kimiya al-Sa'ada; he died in 1000 AH (1592 CE)."
  es: "Muhammad ibn Mustafa al-Wani, conocido como Wan Quli, un jurista hanafi de Rum que enseñó y sirvió como juez en su país, autor de Ithbat al-Masmu'at y Naqd al-Durar, y traductor al turco de Sihah de al-Jawhari y Kimiya al-Sa'ada de al-Ghazali; Murió en el año 1000 d. H. (1592 d. C.)."
  fr: "Muhammad ibn Mustafa al-Wani, connu sous le nom de Wan Quli, juriste hanafi de Rum qui a enseigné et exercé les fonctions de juge dans son pays, auteur d'Ithbat al-Masmu'at et de Naqd al-Durar, et traducteur en turc du Sihah d'al-Jawhari et du Kimiya al-Sa'ada d'al-Ghazali; il mourut en 1000 AH (1592 CE)."
