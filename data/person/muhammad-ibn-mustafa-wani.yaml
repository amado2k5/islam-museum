summary:
  ar: "محمد بن مصطفى الواني، ويعرف بوان قولي، فقيه حنفي رومي تولى التدريس والقضاء في بلاده، له إثبات المسموعات ونقد الدرر، وترجم إلى التركية الصحاح للجوهري وكيمياء السعادة للغزالي؛ توفي سنة 1000 هـ الموافقة 1592م."
  en: "Muhammad ibn Mustafa al-Wani, known as Wan Quli, a Hanafi jurist of Rum who taught and served as judge in his country, author of Ithbat al-Masmu'at and Naqd al-Durar, and translator into Turkish of al-Jawhari's Sihah and al-Ghazali's Kimiya al-Sa'ada; he died in 1000 AH (1592 CE)."
