summary:
  ar: "المحدث الحنبلي؛ حضر على أبي حفص بن طبرزد وسمع من الكندي وطبقته وارتحل إلى بغداد فسمع من الفتح بن عبد السلام وطائفة ثم إلى مصر، وكتب الكثير وعني بالحديث وتفقه على الشيخ الموفق، وكان فاضلاً صالحاً ثقةً انتفع به جماعة وحدث؛ توفي في نصف ذي الحجة ودفن بسفح قاسيون {cite:shadharat-dhahab p. 530}."
  en: "The Maqdisi hafiz (b. 602) — Ibn Tabarzad, al-Kindi, Baghdad's Fath b. Abd al-Salam, then Egypt; Ibn Qudama's pupil in fiqh, devoted to hadith; d. mid-Dhu al-Hijja 661, buried at Qasyun's foot {cite:shadharat-dhahab p. 530}."
  es: "El Maqdisi hafiz (n. 602) - Ibn Tabarzad, al-Kindi, Fath de Bagdad b. Abd al-Salam, luego Egipto; alumno de fiqh de Ibn Qudama, devoto del hadiz; d. mediados de Dhu al-Hijja 661, enterrado a los pies de Qasyun {cita: shadharat-dhahab p. 530}."
  fr: "Le Maqdisi hafiz (né en 602) — Ibn Tabarzad, al-Kindi, Fath b. Abd al-Salam, puis l'Égypte; Élève d'Ibn Qudama en fiqh, dévoué au hadith; d. mi-Dhu al-Hijja 661, enterré au pied de Qasyun {cite: shadharat-dhahab p. 530}."
  ur: "مقدیسی حافظ ⁦(متوفی 602)⁩ - ابن تبرزاد، الکندی، بغداد فتح ب۔ عبد السلام، پھر مصر؛ فقہ میں ابن قدامہ کے شاگرد، حدیث کے لیے وقف؛ d نصف ذی الحجہ 661، قصیون کے دامن میں مدفون 530}۔"
