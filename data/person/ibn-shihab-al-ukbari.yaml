summary:
  ar: "أبو علي الحسن بن شهاب بن الحسن بن علي العكبري؛ ولد بعكبرا في محرم سنة خمس وثلاثين وثلاثمائة، سمع الحديث على كبر، وكان فقيهًا فاضلًا على مذهب أحمد يقرئ القراءات ويعرف الأدب ويقول الشعر، قال البرقاني هو ثقة أمين. واكتسب في الوراقة خمسة وعشرين ألف درهم — كان يشتري كاغدًا بخمسة دراهم فيكتب فيه ديوان المتنبي في ثلاث ليال ويبيعه بمائة وخمسين درهمًا؛ وأخذ السلطان من تركته ما قدره ألف دينار سوى ما خلفه من العقار، وكان أوصى بثلث ماله لمتفقهة الحنابلة فلم يُعطوا شيئًا. توفي ليلة النصف من رجب سنة ثمان وعشرين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.433-434}."
  en: "Draft card for Ibn Shihab al-Ukbari, the eleventh-century Iraqi scholar, poet and muhaddith, d. 1037; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Ibn Shihab al-Ukbari, erudito, poeta y muhaddith iraquí del siglo XI, fallecido en 1037; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet d'Ibn Shihab al-Ukbari, érudit, poète et muhaddith irakien du XIe siècle, mort en 1037; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "گیارہویں صدی کے عراقی عالم، شاعر اور محدث ابن شہاب الاکبری کے لیے ڈرافٹ کارڈ۔ 1037; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Ebu Ali el-Hasan ibn Şihab ibn el-Hasan ibn Ali el-Ekbari; 335 H. yılında Muharrem'de Ekber'de doğdu. Büyük yaşta hadis duydu ve Ahmedi mezhebi inancını takip eden, okunan erdemli bir hukukçuydu; edebiyat biliyor ve şiir okuyordu. El-Barqani onun güvenilir ve güvenilir olduğunu söyledi. Evrak işlerinden yirmi beş bin dirhem kazandı — üç gecede el-Mutanabbi Divanı'nı yazmak için beş dirheme bir kağıt alır ve yüz elli dirheme satardı; sultan, bıraktığı mülke ek olarak yaklaşık bin dinar aldı ve servetinin üçte birini Hanbali hukukçusuna bıraktı, o da hiçbir şey vermedi. Dört yüz yirmi sekiz yılın Recep ortası gecesi öldü {alıntı::] Muntazam-ibn-al-jawzi J.8 s.433-434}."
  id: "Abu Ali al-Hasan ibn Shihab ibn al-Hasan ibn Ali al-Akbari; ia lahir di Akbar pada Muharram pada tahun 335 H. Ia mendengar hadis pada usia lanjut dan merupakan ahli hukum yang berbudi luhur mengikuti aliran pemikiran Ahmadi, yang membaca bacaan, mengetahui sastra, dan membaca puisi. Al-Barqani mengatakan ia dapat dipercaya dan dapat dipercaya. Ia memperoleh dua puluh lima ribu dirham dari dokumen — ia membeli kertas seharga lima dirham untuk menulis Diwan al-Mutanabbi dalam tiga malam dan menjualnya seharga seratus lima puluh dirham; sultan mengambil dari hartanya sekitar seribu dinar selain harta yang ditinggalkannya, dan ia mewariskan sepertiga hartanya kepada ahli hukum Hanbali, yang tidak memberikan apa pun. Ia meninggal pada malam pertengahan Rajab tahun empat ratus dua puluh delapan {cite:Muntazam-ibn-al-jawzi J.8 hlm.433-434}."
