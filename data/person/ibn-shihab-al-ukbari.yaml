summary:
  ar: "أبو علي الحسن بن شهاب بن الحسن بن علي العكبري؛ ولد بعكبرا في محرم سنة خمس وثلاثين وثلاثمائة، سمع الحديث على كبر، وكان فقيهًا فاضلًا على مذهب أحمد يقرئ القراءات ويعرف الأدب ويقول الشعر، قال البرقاني هو ثقة أمين. واكتسب في الوراقة خمسة وعشرين ألف درهم — كان يشتري كاغدًا بخمسة دراهم فيكتب فيه ديوان المتنبي في ثلاث ليال ويبيعه بمائة وخمسين درهمًا؛ وأخذ السلطان من تركته ما قدره ألف دينار سوى ما خلفه من العقار، وكان أوصى بثلث ماله لمتفقهة الحنابلة فلم يُعطوا شيئًا. توفي ليلة النصف من رجب سنة ثمان وعشرين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.433-434}."
