summary:
  ar: "مقاتل بن سليمان من الزيدية والمحدثين والقراء، وله من الكتب كتاب التفسير الكبير وكتاب الناسخ والمنسوخ وكتاب تفسير الخمس مائة آية وكتاب القراءات وكتاب متشابه القرآن وكتاب نوادر التفسير وكتاب الوجوه والنظائر وكتاب الجوابات في القرآن وكتاب الرد على القدرية وكتاب الأقسام واللغات وكتاب التقديم والتأخير وكتاب الآيات والمتشابهات {cite:fihrist-ibn-al-nadim p. 253-254}."
  en: "Muqatil ibn Sulayman — Zaydi muhaddith and qur'anic exegete {cite:fihrist-ibn-al-nadim}"
  es: "Muqatil ibn Sulayman - Zaydi muhaddith y exégeta coránico {cita:fihrist-ibn-al-nadim}"
  fr: "Muqatil ibn Sulayman — Zaydi muhaddith et exégète coranique {cite: fihrist-ibn-al-nadim}"
  ur: "مقاتل ابن سلیمان - زیدی محدث اور مفسر قرآن"
  tr: "Muqatil bin Süleyman bir Zeydi, hadis alimi ve şiirciydi. Kitapları arasında El-Tefsir-El-Kabir, El-Nasikh ve El-Abrochu, Tefsir-al-Hums (Yüz Ayet), Kitab Kıra'at, Kitab Mutahabih El-Kur'an, Nevadir Tefsir, Kitab El-Vajve ve Nazair, Kitab Al-Jawabat fi al-Qur'an, Kitab Al-Radd 'ala al-Qadariyyah, Kitab al-Aqdah, Kitab al-Ta'tihawat, Kitab al-Ayat wa al-Mutahashabihat {atıf:Fihrist-ibn-al-Nadim s. 253-254} bulunmaktadır."
  id: "Muqatil ibn Sulayman adalah seorang Zaydi, ulama hadis, dan pembaca. Di antara bukunya adalah Al-Tafsir Al-Kabir, Al-Nasikh wa Al-Abrochu, Tafsir Al-Khums (Seratus Ayat), Kitab Al-Qira'at, Kitab Mutahabih Al-Qur'an, Nawadir Al-Tafsir, Kitab Al-Wajwah wa Nazair, Kitab Al-Jawabat fi al-Qur'an, Kitab Al-Radd 'ala al-Qadariyyah, Kitab al-Aqdah, Kitab al-Taqdim wa al-Ta'tihawat, Kitab al-Ayat wa al-Mutahashabihat {cite:fihrist-ibn-al-nadim hlm. 253-254}."
