  ar: "مقاتل بن سليمان من الزيدية والمحدثين والقراء، وله من الكتب كتاب التفسير الكبير وكتاب الناسخ والمنسوخ وكتاب تفسير الخمس مائة آية وكتاب القراءات وكتاب متشابه القرآن وكتاب نوادر التفسير وكتاب الوجوه والنظائر وكتاب الجوابات في القرآن وكتاب الرد على القدرية وكتاب الأقسام واللغات وكتاب التقديم والتأخير وكتاب الآيات والمتشابهات {cite:fihrist-ibn-al-nadim p. 253-254}."
