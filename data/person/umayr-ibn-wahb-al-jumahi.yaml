label: { ar: "عمير بن وهب الجمحي ⁦(صاحب تبوك)⁩", en: "Umayr ibn Wahb al-Jumahi (of Tabuk)", es: "Umayr ibn Wahb al-Jumahi (of Tabuk)", fr: "Umayr ibn Wahb al-Jumahi (of Tabuk)" }
summary:
  ar: "عمير بن وهب من بني جمح؛ ذكره ابن إسحاق في خبر أبي خيثمة بغزوة تبوك: لقيه في الطريق وهو يطلب النبي فترافقا حتى دنوا من تبوك فتخلف عنه أبو خيثمة بطلبه ليأتي النبي أولاً. ولا ينصّ ابن إسحاق هنا على أنه عمير بن وهب المعروف الذي أسلم بعد بدر فلم يُدمجا."
  en: "Umayr ibn Wahb of Banu Jumah; Ibn Ishaq mentions him in Abu Khaythama's Tabuk report — met on the road seeking the Prophet, they travelled together until nearing Tabuk, where Abu Khaythama asked him to hang back so he might reach the Prophet first. Ibn Ishaq does not state here that he is the famous Umayr ibn Wahb who embraced Islam after Badr, and the two have not been merged."
  es: "Umayr ibn Wahb de Banu Jumah; Ibn Ishaq lo menciona en el relato de Abu Khaythama sobre Tabuk. Se encontraron en el camino buscando al Profeta y viajaron juntos hasta cerca de Tabuk, donde Abu Khaythama le pidió que se quedara atrás para poder llegar primero al Profeta. Ibn Ishaq no afirma aquí que se trate del famoso Umayr ibn Wahb que abrazó el Islam después de Badr, y ambos no han sido confundidos."
  fr: "Umayr ibn Wahb, de la tribu des Banu Jumah, est mentionné par Ibn Ishaq dans le récit d'Abu Khaythama concernant Tabuk. Rencontrés sur la route menant au Prophète, ils voyagèrent ensemble jusqu'aux abords de Tabuk, où Abu Khaythama lui demanda de rester en retrait afin de pouvoir rencontrer le Prophète en premier. Ibn Ishaq ne précise pas ici qu'il s'agit du célèbre Umayr ibn Wahb qui se convertit à l'islam après Badr, et les deux personnages ne sont pas confondus."
