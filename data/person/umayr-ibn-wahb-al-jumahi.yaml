summary:
  ar: "عمير بن وهب من بني جمح؛ ذكره ابن إسحاق في خبر أبي خيثمة بغزوة تبوك: لقيه في الطريق وهو يطلب النبي فترافقا حتى دنوا من تبوك فتخلف عنه أبو خيثمة بطلبه ليأتي النبي أولاً. ولا ينصّ ابن إسحاق هنا على أنه عمير بن وهب المعروف الذي أسلم بعد بدر فلم يُدمجا."
  en: "Umayr ibn Wahb of Banu Jumah; Ibn Ishaq mentions him in Abu Khaythama's Tabuk report — met on the road seeking the Prophet, they travelled together until nearing Tabuk, where Abu Khaythama asked him to hang back so he might reach the Prophet first. Ibn Ishaq does not state here that he is the famous Umayr ibn Wahb who embraced Islam after Badr, and the two have not been merged."
