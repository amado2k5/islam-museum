label:
  ar: "أبو سعيد الإصطخري"
  en: "Abu Sa'id al-Istakhri"
  fr: "Abu Sa'id al-Istakhri"
  es: "Abu Sa'id al-Istakhri"
  ur: "ابو سعید استخری"
roles: [scholar, jurist, qadi]
gender: male
summary:
  ar: "أبو سعيد الحسن بن أحمد بن يزيد بن عيسى بن الفضل الإصطخري، فقيه شافعي وشيخ الشافعية بالعراق مع ابن سريج، ولي قضاء قم وسجستان وحسبة بغداد، وله «آداب القضاء»، ولد سنة 244 هـ وتوفي ببغداد سنة 328 هـ."
  en: "Abu Sa'id al-Hasan ibn Ahmad ibn Yazid ibn Isa ibn al-Fadl al-Istakhri, a Shafi'i jurist and, with Ibn Surayj, shaykh of the Shafi'is in Iraq; qadi of Qumm and Sijistan and muhtasib of Baghdad, author of Adab al-Qada'; born 244 AH, died in Baghdad in 328 AH (940)."
  fr: "Abu Sa'id al-Hasan ibn Ahmad ibn Yazid ibn Isa ibn al-Fadl al-Istakhri, juriste shafi'ite et, avec Ibn Surayj, shaykh des shafi'ites d'Irak ; cadi de Qumm et du Sijistan et muhtasib de Bagdad, auteur de l'Adab al-Qada' ; né en 244 H, mort à Bagdad en 328 H (940)."
  es: "Abu Sa'id al-Hasan ibn Ahmad ibn Yazid ibn Isa ibn al-Fadl al-Istakhri, jurista shafi'i y, con Ibn Surayj, jeque de los shafi'is en Irak; cadí de Qumm y Sijistán y muhtasib de Bagdad, autor de Adab al-Qada'; nacido en 244 AH, muerto en Bagdad en 328 AH (940)."
  ur: "ابو سعید الحسن بن احمد بن یزید بن عیسیٰ بن الفضل الاستخری، ایک شافعی فقیہ اور ابن سریج کے ساتھ، عراق میں شافعیوں کے شیخ؛ قم اور سجستان کے قاضی اور بغداد کے محتسب، ادیب القضاء کے مصنف؛ 244ھ میں پیدا ہوئے، بغداد میں 328ھ (940) میں وفات پائی۔"
