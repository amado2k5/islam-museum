summary:
  ar: "قاضي القضاة الشافعي؛ ولد في جمادى الأولى سنة تسعين وخمسمائة واشتغل في العجم ثم قدم مصر وولي قضاءها وطلب وحصل وبالغ في علوم الأوائل حتى تفرد برياسة ذلك في زمانه وأفتى وناظر، وصنف الموجز والجمل وكشف الأسرار وكتاب أدوار الحياة؛ ورثاه تلميذه العز الأربلي الضرير؛ وكان تلحقه غفلة فيما يفكر فيه من المسائل العقلية حتى أدخل يده في رزة إبريق عند السلطان ونسى نفسه في الفكرة فقام الجماعة وبقي جالساً تمنعه أصبعه من القيام فأحضر حداداً فخلص أصبعه {cite:shadharat-dhahab p. 244-245}."
  en: "The Shafi'i qadi al-qudat and logician (b. 590, d. Ramadan 646, Muqattam) — alone in his age's headship of the ancients' sciences; author of al-Mujaz, al-Jumal and Kashf al-Asrar; so abstracted that his finger once had to be freed by a blacksmith from the sultan's ewer-spout while he lost himself in a problem {cite:shadharat-dhahab p. 244-245}."
