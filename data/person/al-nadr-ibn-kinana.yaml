label: { ar: "النضر بن كنانة", en: "al-Nadr ibn Kinana", fr: "al-Nadr ibn Kinana", es: "al-Nadr ibn Kinana", ur: "الندر بن کنانہ" }
gender: male
roles: []
summary:
  ar: "هو «قريش» عند جمهور النسابين: قريش هم بنو النضر بن كنانة، فمن داناه من ولده فهو قرشي؛ أبو مالك بن النضر ومن أولاده الآخرين كنانة وعبد مناة وملكان وقند {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48}."
  en: "He is 'Quraysh' in the genealogists' definition: Quraysh are the sons of al-Nadr ibn Kinana, and whoever draws close to his line is Qurashi; father of Malik ibn al-Nadr, and of Kinana, Abd Manat, Milkan and Qind {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48}."
  fr: "Il est 'Quraysh' dans la définition des généalogistes : Quraysh sont les fils d'al-Nadr ibn Kinana, et celui qui s'approche de sa ligne est Qurashi ; père de Malik ibn al-Nadr, et de Kinana, Abd Manat, Milkan et Qind {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48}."
  es: "Él es 'Quraysh' según la definición de los genealogistas: los Quraysh son los hijos de al-Nadr ibn Kinana, y quien se acerca a su linaje es Qurashi; padre de Malik ibn al-Nadr, y de Kinana, Abd Manat, Milkan y Qind {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48}."
  ur: "اہل نسب کی تعریف میں وہ 'قریش' ہے: قریش النادر بن کنانہ کے بیٹے ہیں، اور جو اس کے سلسلے کے قریب آتا ہے وہ قریشی ہے۔ مالک بن النضر کے والد، اور کنانہ، عبد منات، ملکان اور قند {حوالہ: ابن ہشام سیرہ 1/1-4} {حوالہ: مبارک پوری-رحیق صفحہ 48}۔"
  tr: "Soybilimcilerin çoğuna göre 'Qurayş'tır: Qureyşler, el-Nadir bin Kinana'nın oğullarıdır. Soyundan gelen yakınları bir Qurayşidir; Ebu Malik ibn el-Nadr. Diğer soyundan gelenler arasında Kinana, Abd Manat, Malikan ve Qand {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq s.48} bulunmaktadır."
  id: "Menurut mayoritas ahli silsilah, ia adalah 'Quraisy': Quraisy adalah putra al-Nadr ibn Kinana. Siapa pun yang dekat dengannya dari keturunannya adalah seorang Quraisy; Abu Malik ibn al-Nadr. Di antara keturunannya lainnya adalah Kinana, Abd Manat, Malikan, dan Qand {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq hlm.48}."
