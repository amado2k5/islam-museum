summary:
  ar: "مفكر وكاتب وصحفي لبناني المولد ⁦(1936 أو 1939)⁩، الأمين العام للجنة الوطنية الإسلامية المسيحية للحوار وللقمة الروحية الإسلامية في لبنان، ومستشار مفتي الجمهورية اللبنانية، وعضو مجلس إدارة مركز الملك عبد الله العالمي للحوار بين أتباع الأديان والثقافات، نال جائزة الملك فيصل لخدمة الإسلام (2024)."
  en: "Lebanese-born thinker, writer and journalist (born 1936 or 1939), secretary-general of the National Islamic-Christian Committee for Dialogue and of the Islamic Spiritual Summit in Lebanon, adviser to the Mufti of Lebanon and board member of the King Abdullah International Centre for Interreligious and Intercultural Dialogue; King Faisal Prize for Service to Islam (2024)."
  ur: "لبنان میں پیدا ہونے والے مفکر، مصنف اور صحافی ⁦(پیدائش 1936ء یا 1939ء)⁩، لبنان کی قومی اسلامی مسیحی مکالمہ کمیٹی اور اسلامی روحانی سربراہی اجلاس کے سیکرٹری جنرل، مفتیِ لبنان کے مشیر اور شاہ عبد اللہ بین الاقوامی مرکز برائے بین المذاہب و بین الثقافتی مکالمہ کے بورڈ کے رکن؛ شاہ فیصل انعام برائے خدمتِ اسلام ⁦(2024ء)⁩۔"
  es: "Pensador, escritor y periodista nacido en el Líbano (en 1936 o 1939), secretario general del Comité Nacional Islámico-Cristiano para el Diálogo y de la Cumbre Espiritual Islámica en el Líbano, asesor del Muftí del Líbano y miembro de la junta directiva del Centro Internacional Rey Abdullah para el Diálogo Interreligioso e Intercultural; Premio Rey Faisal al Servicio del Islam (2024)."
  fr: "Penseur, écrivain et journaliste d'origine libanaise (né en 1936 ou 1939), secrétaire général du Comité national islamo-chrétien pour le dialogue et du Sommet spirituel islamique au Liban, conseiller du mufti du Liban et membre du conseil d'administration du Centre international du roi Abdallah pour le dialogue interreligieux et interculturel; Prix du roi Faisal pour services rendus à l'islam (2024)."
  tr: "Lübnan doğumlu düşünür, yazar ve gazeteci (1936 veya 1939), Lübnan'daki Ulusal İslam-Hristiyan Diyaloğu ve İslami Manevi Zirvesi Genel Sekreteri, Lübnan Cumhuriyeti Büyük Müftüsü'nün danışmanı ve Kral Abdullah Uluslararası Dinlerarası ve Kültürlerarası Diyalog Merkezi yönetim kurulu üyesi. İslam'a Hizmet Kral Faysal Ödülü'nü (2024) aldı."
  id: "Pemikir, penulis, dan jurnalis kelahiran Lebanon (1936 atau 1939), Sekretaris Jenderal Dialog Islam-Kristen Nasional dan KTT Spiritual Islam di Lebanon, penasihat Grand Mufti Republik Lebanon, dan anggota dewan King Abdullah International Center for Interreligious and Intercultural Dialogue. Ia menerima King Faisal Prize for Service to Islam (2024)."
