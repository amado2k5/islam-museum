summary:
  ar: "مفكر وكاتب وصحفي لبناني المولد ⁦(1936 أو 1939)⁩، الأمين العام للجنة الوطنية الإسلامية المسيحية للحوار وللقمة الروحية الإسلامية في لبنان، ومستشار مفتي الجمهورية اللبنانية، وعضو مجلس إدارة مركز الملك عبد الله العالمي للحوار بين أتباع الأديان والثقافات، نال جائزة الملك فيصل لخدمة الإسلام (2024)."
  en: "Lebanese-born thinker, writer and journalist (born 1936 or 1939), secretary-general of the National Islamic-Christian Committee for Dialogue and of the Islamic Spiritual Summit in Lebanon, adviser to the Mufti of Lebanon and board member of the King Abdullah International Centre for Interreligious and Intercultural Dialogue; King Faisal Prize for Service to Islam (2024)."
  ur: "لبنان میں پیدا ہونے والے مفکر، مصنف اور صحافی ⁦(پیدائش 1936ء یا 1939ء)⁩، لبنان کی قومی اسلامی مسیحی مکالمہ کمیٹی اور اسلامی روحانی سربراہی اجلاس کے سیکرٹری جنرل، مفتیِ لبنان کے مشیر اور شاہ عبد اللہ بین الاقوامی مرکز برائے بین المذاہب و بین الثقافتی مکالمہ کے بورڈ کے رکن؛ شاہ فیصل انعام برائے خدمتِ اسلام ⁦(2024ء)⁩۔"
