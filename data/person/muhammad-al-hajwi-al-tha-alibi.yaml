summary:
  ar: "محمد بن الحسن الحجوي الثعالبي الزينبي، مالكي المذهب، تلقى علومه بفاس على والده وغيره، ثم تخرج بجامع القرويين وبدأ بإلقاء الدروس فيه. تولى عدة وظائف في أواخر الدولة العزيزية بالمغرب، منها وزارة المعارف، ووزارة العدل، ورئاسة الاستئناف الشرعي الأعلى. من تصانيفه «الفكر السامي في تاريخ الفقه الإسلامي»، و«رسالة في الطلاق»، و«النظام الاجتماعي في الإسلام». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1619}"
  en: "Muhammad ibn al-Hasan al-Hajwi al-Tha'alibi al-Zaynabi, a Maliki of Fez. He studied in Fez under his father and others, graduated from the Qarawiyyin mosque and began teaching there. Late in the Alawite state in Morocco he held several offices, among them ministries of education and of justice and the presidency of the supreme sharia appeal court. His works include al-Fikr al-sami fi tarikh al-fiqh al-islami, a treatise on divorce, and al-Nizam al-ijtima'i fi al-Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1619}"
