summary:
  ar: محمد بن عبد الواحد بن إبراهيم الغافقي الملاحي، أبو القاسم، مؤرخ من حفاظ الحديث، أندلسي توفي بغرناطة؛ ٥٤٩ إلى ٦١٩هـ.
  en: Muhammad ibn Abd al-Wahid ibn Ibrahim al-Ghafiqi al-Mallahi, Abu al-Qasim, a historian and hadith memoriser of al-Andalus who died at Granada; 549 to 619 AH.
  es: "Muhammad ibn Abd al-Wahid ibn Ibrahim al-Ghafiqi al-Mallahi, Abu al-Qasim, historiador y memorizador de hadices de al-Andalus que murió en Granada; 549 al 619 AH."
  fr: "Muhammad ibn Abd al-Wahid ibn Ibrahim al-Ghafiqi al-Mallahi, Abu al-Qasim, historien et mémorisateur de hadiths d'al-Andalus décédé à Grenade; 549 à 619 AH."
  ur: "محمد بن عبد الواحد بن ابراہیم الغفیقی الملحی، ابو القاسم، ایک مورخ اور حدیث کے حافظ، الاندلس جو غرناطہ میں فوت ہوئے؛ 549 تا 619 ہجری۔"
  tr: "Muhammed ibn Abd al-Wahid ibn İbrahim el-Ghafiqi al-Mallahi, tarihçi ve hadis ezbercilerinden biri olan Endülüslü, Granada'da öldü; 549 ila 619 H."
  id: "Muhammad ibn Abd al-Wahid ibn Ibrahim al-Ghafiqi al-Mallahi, Abu al-Qasim, sejarawan dan salah satu penghafal hadis Andalusia, wafat di Granada; 549 hingga 619 H."
