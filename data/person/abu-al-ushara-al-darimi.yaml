label: { ar: "أبو العشراء الدارمي", en: "Abu al-Ushara al-Darimi", fr: "Abu al-Ushara al-Darimi", es: "Abu al-Ushara al-Darimi", ur: "ابو العشرہ الدارمی" }
names:
  - { value: "أبو العشراء الدارمي التميمي، قيل: اسمه يسار بن بكر بن مسعود", kind: full }
summary:
  ar: "راوٍ روى عن أبيه، وعنه حماد بن سلمة، ونُسب إليه خمسة عشر حديثا عن النبي، قال ابن حجر إن أسانيدها مظلمة، وذكره ابن حبان في الثقات، وقال ابن سعد إنه مجهول، وقال البخاري إن في اسمه وحديثه وسماعه من أبيه نظرا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
  en: "A transmitter who narrated from his father, and from whom Hammad ibn Salama narrated. Fifteen reports from the Prophet are attributed to him. Ibn Hajar said their chains are dark, Ibn Hibban counted him among the trustworthy, Ibn Sa'd called him unknown, and al-Bukhari said his name, his report and his hearing from his father are open to doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
  fr: "Transmetteur qui rapporta de son père, et de qui Hammad ibn Salama rapporta. Quinze récits remontant au Prophète lui sont attribués. Ibn Hajar dit que leurs chaînes sont obscures, Ibn Hibban le compta parmi les dignes de confiance, Ibn Sa'd le dit inconnu, et al-Bukhari dit que son nom, son récit et son audition de son père sont sujets à caution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
  es: "Un transmisor que narró de su padre, y de quien narró Hammad ibn Salama. Se le atribuyen quince relatos del Profeta. Ibn Hajar dijo que sus cadenas de transmisión son oscuras, Ibn Hibban lo consideró digno de confianza, Ibn Sa'd lo llamó desconocido, y al-Bujari dijo que su nombre, su relato y el haberlo escuchado de su padre son dudosos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
  ur: "ایک ٹرانسمیٹر جس نے اپنے والد سے روایت کی ہے اور جس سے حماد بن سلمہ نے روایت کی ہے۔ آپ سے پندرہ روایتیں منسوب ہیں۔ ابن حجر نے کہا کہ ان کی زنجیریں سیاہ ہیں، ابن حبان نے اسے ثقہ کہا، ابن سعد نے ان کو نامعلوم کہا، اور بخاری نے ان کا نام، اس کی روایت اور اس کے والد سے اس کی سماعت شکوک و شبہات کو ظاہر کیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5142}"
  tr: "Babasından rivayet eden ve Hammad ibn Salamah'ın da kendisinden rivayet ettiği, Peygamberimizden on beş hadis isnad edilen bir ravi. İbn Hacer, rivayet zincirlerinin belirsiz olduğunu söylemiş, İbn Hibban ise onu güvenilir raviler arasında saymıştır. İbn Sa'd, onun bilinmediğini, Buhari ise ismi, hadisleri ve babasından rivayet ettiği konusunda şüpheler olduğunu belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
  id: "Seorang perawi yang meriwayatkan dari ayahnya, dan dari siapa Hammad ibn Salamah meriwayatkan, dan lima belas hadits dinisbatkan kepadanya dari Nabi. Ibn Hajar mengatakan bahwa sanadnya tidak jelas, dan Ibn Hibban menyebutnya sebagai salah satu perawi yang terpercaya. Ibn Sa'd mengatakan bahwa ia tidak dikenal, dan al-Bukhari mengatakan bahwa ada keraguan mengenai namanya, hadits-haditsnya, dan pendengarannya dari ayahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
