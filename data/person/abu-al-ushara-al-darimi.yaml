summary:
  ar: "راوٍ روى عن أبيه، وعنه حماد بن سلمة، ونُسب إليه خمسة عشر حديثا عن النبي، قال ابن حجر إن أسانيدها مظلمة، وذكره ابن حبان في الثقات، وقال ابن سعد إنه مجهول، وقال البخاري إن في اسمه وحديثه وسماعه من أبيه نظرا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
  en: "A transmitter who narrated from his father, and from whom Hammad ibn Salama narrated. Fifteen reports from the Prophet are attributed to him. Ibn Hajar said their chains are dark, Ibn Hibban counted him among the trustworthy, Ibn Sa'd called him unknown, and al-Bukhari said his name, his report and his hearing from his father are open to doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143}"
