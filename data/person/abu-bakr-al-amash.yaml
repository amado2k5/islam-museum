label:
  ar: "أبو بكر الأعمش"
  en: "Abu Bakr al-A'mash"
  fr: "Abu Bakr al-A'mash"
  es: "Abu Bakr al-A'mash"
  ur: "ابوبکر العماش"
summary:
  ar: "محمد بن سعيد بن محمد بن عبد الله، أبو بكر، المعروف بالأعمش، فقيه حنفي. تفقه على أبي بكر محمد بن أحمد الإسكاف، وتفقه عليه ولده أبو القاسم عبيد الله والفقيه أبو جعفر الهندواني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  en: "Muhammad ibn Sa'id ibn Muhammad ibn Abd Allah, Abu Bakr, known as al-A'mash, a Hanafi jurist. He studied under Abu Bakr Muhammad ibn Ahmad al-Iskaf; his son Abu al-Qasim Ubayd Allah and the jurist Abu Ja'far al-Hindawani studied under him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  fr: "Muhammad ibn Sa'id ibn Muhammad ibn Abd Allah, Abu Bakr, dit al-A'mash, juriste hanafite. Il étudia auprès d'Abu Bakr Muhammad ibn Ahmad al-Iskaf ; son fils Abu al-Qasim Ubayd Allah et le juriste Abu Ja'far al-Hindawani étudièrent auprès de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  es: "Muhammad ibn Sa'id ibn Muhammad ibn Abd Allah, Abu Bakr, conocido como al-A'mash, un jurista hanafi. Estudió con Abu Bakr Muhammad ibn Ahmad al-Iskaf; su hijo Abu al-Qasim Ubayd Allah y el jurista Abu Ja'far al-Hindawani estudiaron con él. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
  ur: "محمد بن سعید بن محمد بن عبد اللہ، ابو بکر، العمش کے نام سے مشہور، حنفی فقیہ۔ اس نے ابوبکر محمد بن احمد الاسکاف سے تعلیم حاصل کی۔ ان کے بیٹے ابو القاسم عبید اللہ اور فقیہ ابو جعفر الہندوانی نے ان سے تعلیم حاصل کی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 15400}"
  tr: "Muhammed ibn Sa'id ibn Muhammed ibn Abdullah, Ebu Bekir, el-A'maş olarak da bilinir, Hanefi fıkıhçısıdır. Fıkıh eğitimini Ebu Bekir Muhammed ibn Ahmed el-İskafi'den almıştır ve oğlu Ebu el-Kasım Ubeyd Allah ile fıkıhçı Ebu Cafer el-Hinduvani de ondan eğitim almıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15400}"
  id: "Muhammad ibn Sa'id ibn Muhammad ibn Abdullah, Abu Bakr, yang dikenal sebagai al-A'mash, adalah seorang ahli hukum Hanafi. Ia belajar fiqh di bawah bimbingan Abu Bakr Muhammad ibn Ahmad al-Iskafi, dan putranya Abu al-Qasim Ubayd Allah serta ahli hukum Abu Ja'far al-Hinduwani juga belajar di bawah bimbingannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15400}"
