summary:
  ar: "أبو القاسم سعيد بن أبي سعيد الجنابي (ت 361هـ)، حاكم القرامطة بهجر؛ مات في جمادى الآخرة سنة إحدى وستين وثلثمائة وقام من بعده بالأمر أخوه أبو يعقوب يوسف، ولم يبقَ من أولاد أبي سعيد الجنابي غيره، وعُقد لقرامطة الأمر بعد أبي يعقوب لستة نفر من أولادهم شركة بينهم {cite:muntazam-ibn-al-jawzi j.7 p.61}."
  en: "Abu'l-Qasim Sa'id b. Abi Sa'id al-Jannabi (d. 361), the Qarmatian ruler at Hajar: he died Jumada II 361 and his brother Abu Ya'qub Yusuf — the last surviving son of Abu Sa'id al-Jannabi — took command; after Abu Ya'qub the Qarmatian rule was contracted jointly to six of their sons {cite:muntazam-ibn-al-jawzi j.7 p.61}."
