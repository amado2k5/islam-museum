summary:
  ar: "مقدمة بودكاست ومتحدثة أمريكية في حوار الأديان، مؤسِّسة بودكاست «الأمومة على الطريقة المسلمة» (Mommying While Muslim) ومقدمته مع صديقتها الطبيبة عظمى جعفري، وهو بودكاست يدعم الأمهات المسلمات في الولايات المتحدة. وُلدت ونشأت في شيكاغو من أصل أيرلندي باكستاني ونشأة بين الأديان، وأطلقت البودكاست بعد أن أوقف ابنها المراهق في مطار بوصفه مسلمًا فبحثت عن موارد للأمهات مثلها."
  en: "American podcast host and interfaith speaker, founder of the Mommying While Muslim podcast, which she co-hosts with her friend Dr Uzma Jafri in support of Muslim mothers in the United States. Born and raised in Chicago, of Irish and Pakistani heritage and an interfaith upbringing, she started the podcast after her teenage son was stopped at an airport as a Muslim male and she went looking for resources for mothers like herself."
  ur: "امریکی پوڈکاسٹ میزبان اور بین المذاہب مکالمے کی مقررہ، «ممنگ وائل مسلم» (Mommying While Muslim) پوڈکاسٹ کی بانی جسے وہ اپنی دوست ڈاکٹر عظمیٰ جعفری کے ساتھ ریاستہائے متحدہ کی مسلم ماؤں کی حمایت میں پیش کرتی ہیں۔ شکاگو میں پیدا ہوئیں اور وہیں پرورش پائی، آئرش و پاکستانی ورثے اور بین المذاہب ماحول میں پلی بڑھیں، اور انہوں نے یہ پوڈکاسٹ اس وقت شروع کیا جب ان کے نوعمر بیٹے کو ایک ہوائی اڈے پر مسلم مرد کے طور پر روکا گیا اور وہ اپنے جیسی ماؤں کے لیے وسائل تلاش کرنے نکلیں۔"
