summary:
  ar: "عبد العزيز بن أبي حازم سلمة بن دينار، أبو تمام المدني، فقيه محدث، توفي سنة 184هـ. روى عن أبيه وسهيل بن أبي صالح وهشام بن عروة، وعنه ابن مهدي وابن وهب. قال ابن حنبل: لم يكن بالمدينة بعد مالك أفقه من ابن أبي حازم، وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  en: "Abd al-Aziz ibn Abi Hazim Salama ibn Dinar, Abu Tammam al-Madani, a jurist and hadith scholar of Medina (d. 184 AH). Ahmad ibn Hanbal said that after Malik no one in Medina was more learned in law than him; Ibn Hibban counted him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  fr: "Abd al-Aziz ibn Abi Hazim Salama ibn Dinar, Abu Tammam al-Madani, juriste et traditionniste de Médine (m. 184 H). Ahmad ibn Hanbal dit qu'après Malik personne à Médine n'était plus savant que lui en droit ; Ibn Hibban le compta parmi les dignes de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  es: "Abd al-Aziz ibn Abi Hazim Salama ibn Dinar, Abu Tammam al-Madani, jurista y erudito en hadices de Medina (m. 184 d. H.). Ahmad ibn Hanbal dijo que después de Malik, nadie en Medina tenía más conocimientos de derecho que él; Ibn Hibban lo contaba entre los dignos de confianza. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  ur: "عبد العزیز ابن ابی حازم سلمہ ابن دینار، ابو تمام المدنی، مدینہ کے فقیہ اور حدیث کے عالم ⁦(متوفی 184ھ)⁩۔ احمد بن حنبل کہتے ہیں کہ مالک کے بعد مدینہ میں ان سے زیادہ قانون کا کوئی عالم نہیں تھا۔ ابن حبان نے اسے ثقہ لوگوں میں شمار کیا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص3478}"
  tr: "Fıkıhçı ve hadis âlimi Abdul Aziz ibn Abi Hazim Salama ibn Dinar, Ebu Tamam el-Medani, Hicri 184 yılında vefat etmiştir. Babası Suhayl ibn Abi Salih ve Hişam ibn Urva'dan rivayet etmiş, İbn Mehdi ve İbn Vahb da ondan rivayet etmişlerdir. İbn Hanbel şöyle demiştir: \"Malik'ten sonra Medine'de fıkıh konusunda İbn Abi Hazim'den daha bilgili kimse yoktu.\" İbn Hibban, güvenilir râvîler kitabında ondan bahsetmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3478}"
  id: "Abdul Aziz ibn Abi Hazim Salama ibn Dinar, Abu Tamam al-Madani, seorang ahli fiqih dan ulama hadits, wafat pada tahun 184 H. Beliau meriwayatkan hadits dari ayahnya, Suhayl ibn Abi Salih, dan Hisham ibn Urwa, serta Ibn Mahdi dan Ibn Wahb juga meriwayatkan hadits darinya. Ibn Hanbal berkata: \"Setelah Malik, tidak ada seorang pun di Madinah yang lebih berilmu fiqih daripada Ibn Abi Hazim.\" Ibn Hibban menyebutkannya dalam kitabnya tentang para perawi terpercaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
