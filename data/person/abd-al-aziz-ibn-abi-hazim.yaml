summary:
  ar: "عبد العزيز بن أبي حازم سلمة بن دينار، أبو تمام المدني، فقيه محدث، توفي سنة 184هـ. روى عن أبيه وسهيل بن أبي صالح وهشام بن عروة، وعنه ابن مهدي وابن وهب. قال ابن حنبل: لم يكن بالمدينة بعد مالك أفقه من ابن أبي حازم، وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  en: "Abd al-Aziz ibn Abi Hazim Salama ibn Dinar, Abu Tammam al-Madani, a jurist and hadith scholar of Medina (d. 184 AH). Ahmad ibn Hanbal said that after Malik no one in Medina was more learned in law than him; Ibn Hibban counted him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
