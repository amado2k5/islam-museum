label: { ar: "محمد بن حسن الطيبي ⁦(الخطاط)⁩", en: "Muhammad ibn Hasan al-Tayyibi (calligrapher)", fr: "Muhammad ibn Hasan al-Tayyibi (calligraphe)", ur: "محمد بن حسن الطیبی ⁦(خطاط)⁩", es: "Muhammad ibn Hasan al-Tayyibi (calligrapher)" }
summary:
  ar: "خطاط مملوكي شافعي جمع سنة 908هـ/1503م للسلطان قانصوه الغوري أول مرقّع لنماذج الخط باقٍ من العالم العربي، وفيه تسعة عشر قلمًا مصورة {cite:blair-islamic-calligraphy-2006 p. 357}."
  en: "Shafi'i Mamluk calligrapher who in 908/1503 compiled for Sultan Qansawh al-Ghawri the first surviving album of calligraphic specimens from the Arab world, illustrating nineteen scripts {cite:blair-islamic-calligraphy-2006 p. 357}."
  fr: "Le calligraphe mamelouk Shafi'i qui en 908/1503 compila pour le sultan Qansawh al-Ghawri le premier album survivant de spécimens calligraphiques du monde arabe, illustrant dix-neuf scripts {cite:blair-islamic-calligraphy-2006 p. 357}."
  ur: "شافعی مملوک خطاط جنہوں نے 908ھ/1503ء میں سلطان قانصوہ الغوری کے لیے عرب دنیا سے خطاطی کے نمونوں کا پہلا باقی مرقع مرتب کیا، جس میں انیس قلم مصور ہیں {cite:blair-islamic-calligraphy-2006 p. 357}۔"
  es: "Calígrafo mameluco shafi'i que en 908/1503 compiló para el sultán Qansawh al-Ghawri el primer álbum superviviente de muestras caligráficas del mundo árabe, que ilustra diecinueve escrituras {cite:blair-islamic-calligraphy-2006 p. 357}."
  tr: "Bir Memlük Şafii hattatı 908 Hicri/1503 M.S. yılında Sultan Qansuh al-Ghuri için toplanmıştır; bu, Arap dünyasından kalan ilk kaligrafi modellerinin yamalı bohçasıdır ve on dokuz resimli kalem içerir {cite:blair-Islamic-calligraphy-2006, s. 357}."
  id: "Seorang kaligrafer Shafi'i Mamluk mengumpulkan pada tahun 908 H/1503 M untuk Sultan Qansuh al-Ghuri, sebuah tambalan sulam pertama model kaligrafi dari dunia Arab, yang berisi sembilan belas pena bergambar {cite:blair-Islamic-calligraphy-2006, hlm. 357}."
