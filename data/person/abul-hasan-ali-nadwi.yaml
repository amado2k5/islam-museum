summary:
  ar: "أبو الحسن علي الحسني الندوي ⁦(1914–1999)⁩ عالم ومفكر إسلامي هندي، رئيس ندوة العلماء بلكنو، من أبرز من كتب بالعربية في الهند المعاصرة وجسر الفكر الإسلامي الهندي-العربي. من كتبه «ماذا خسر العالم بانحطاط المسلمين» و«السيرة النبوية» و«الأركان الأربعة»."
  en: "Abul Hasan Ali al-Hasani al-Nadwi (1914–1999) was an Indian Islamic scholar and thinker, rector of Nadwatul Ulama in Lucknow, among the foremost contemporary Indian writers in Arabic and a bridge between Indian and Arab Islamic thought. His books include Madha Khasira al-'Alam bi-Inhitat al-Muslimin (What the World Lost with the Muslims' Decline), Al-Sira al-Nabawiyya and Al-Arkan al-Arba'a."
  fr: "Abul Hasan Ali al-Hasani al-Nadwi (1914–1999), savant et penseur islamique indien, recteur de Nadwatul Ulama à Lucknow, parmi les principaux écrivains indiens contemporains de langue arabe et pont entre les pensées islamiques indienne et arabe. Ses ouvrages comprennent Madha Khasira al-'Alam bi-Inhitat al-Muslimin (Ce que le monde a perdu avec le déclin des musulmans), Al-Sira al-Nabawiyya et Al-Arkan al-Arba'a."
  ur: "ابوالحسن علی ندوی ⁦(1914–1999)⁩ بھارتی اسلامی عالم اور مفکر تھے، لکھنؤ کی ندوۃ العلماء کے ریکٹر، عربی میں لکھنے والے معاصر بھارتیوں اور بھارتی-عرب اسلامی فکر کے پل میں نمایاں ترین۔ کتب میں «ماذا خسر العالم بانحطاط المسلمين»، «السيرة النبوية» اور «الأركان الأربعة» شامل ہیں۔"
  es: "Abul Hasan Ali al-Hasani al-Nadwi (1914-1999) fue un erudito y pensador islámico indio, rector de Nadwatul Ulama en Lucknow, uno de los escritores indios contemporáneos más destacados en árabe y un puente entre el pensamiento islámico indio y árabe. Sus libros incluyen Madha Khasira al-'Alam bi-Inhitat al-Muslimin (Lo que el mundo perdió con la decadencia de los musulmanes), Al-Sira al-Nabawiyya y Al-Arkan al-Arba'a."
  tr: "Ebu el-Hasan Ali el-Hasani el-Nadvi (1914–1999), Lucknow'daki Nadwatul Ulama'nın başkanı olan Hintli bir İslam alimi ve düşünürdü. Çağdaş Hindistan'da Arapça yazan en önde gelen yazarlardan biriydi ve Hint ve Arap İslam düşüncesi arasında bir köprü görevi görüyordu. Kitapları arasında \"Müslümanların Gerilemesiyle Dünyanın Kaybettikleri\", \"Peygamberin Hayatı\" ve \"Dört Şart\" bulunmaktadır."
  id: "Abu al-Hasan Ali al-Hasani al-Nadwi (1914–1999) adalah seorang cendekiawan dan pemikir Islam India, kepala Nadwatul Ulama di Lucknow. Beliau adalah salah satu penulis terkemuka dalam bahasa Arab di India kontemporer dan jembatan antara pemikiran Islam India dan Arab. Buku-bukunya antara lain \"Apa yang Hilang dari Dunia Akibat Kemunduran Umat Islam,\" \"Biografi Nabi,\" dan \"Empat Rukun Islam.\""
