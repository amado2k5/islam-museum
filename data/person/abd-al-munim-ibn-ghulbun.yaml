label: { ar: "عبد المنعم بن غلبون", en: "Abd al-Mun'im ibn Ghulbun" }
summary:
  ar: "أبو الطيب عبد المنعم بن عبد الله بن غلبون الحلبي المقرئ؛ نزل مصر في أول سنة ثمان وسبعين وثلاثمائة، وقرأ عليه مكي بن أبي طالب القراءات سنة ثمانين حين قدمها أول مرة؛ وذكره الثعالبي في كتاب الملحة فقال: كان على دينه وفضله وعلمه بالقرآن ومعانيه راناً متفنناً في علوم الأدب، وأنشد له قصيدة منها «عليك بإقلال الزيارة إنهما إذا كثرت كانت إلى الهجر مسلكا» {cite:wafayat-ayan}."
  en: "Abd al-Mun'im b. Ghulbun (fl. 378–380) — the Aleppine qari' who settled in Egypt and taught Makki b. Abi Talib the readings; al-Tha'alibi praised his Qur'an learning and adab {cite:wafayat-ayan}."
