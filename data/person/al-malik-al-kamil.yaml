summary:
  ar: "سلطان أيوبي، أقامه أبوه الملك العادل بمصر بعد ما تملكها لما مات الملك العزيز سنة خمس وتسعين وضعف عن مقاومة الفرنج لما أخذوا دمياط سنة ست عشرة وست مئة فابتنى مدينة عند مفرق البحرين وسماها المنصورة ونزلها بجيشه {cite:tarikh-khulafa-minhaj-1434 p. 694,696}؛ وتملك المصرية عشرين سنة تحت جناح والده وعشرين بعده، وملك دمشق قبل موته بشهرين بعد أن حصرها وأخذها من ابن أخيه الصالح إسماعيل، وملك حران وآمد وديار الجزيرة؛ قال ابن خلكان كان سلطاناً عظيم القدر محباً للعلماء يبيت عنده كل ليلة جمعة جماعة من الفضلاء وهو معهم كواحد منهم، وخطب له بمكة «صاحب مكة وعبيدها واليمن وزييدها ومصر وصعيدها والشام وصناديدها والجزيرة ووليدها سلطان القبلتين ورب العلامتين خادم الحرمين الشريفين»؛ وبنى بالقاهرة دار حديث ورتب لها وقفاً وبنى على قبر الإمام الشافعي قبة عظيمة؛ توفي بدمشق في رجب سنة خمس وثلاثين {cite:shadharat-dhahab p. 172-173}."
  en: "Ayyubid sultan, set over Egypt by his father al-Adil in 595; when the Franks took Damietta in 616 he founded al-Mansura at the seas' fork and camped there {cite:tarikh-khulafa-minhaj-1434 p. 694,696}."
