summary:
  ar: "سلطان أيوبي، أقامه أبوه الملك العادل بمصر بعد ما تملكها لما مات الملك العزيز سنة خمس وتسعين وضعف عن مقاومة الفرنج لما أخذوا دمياط سنة ست عشرة وست مئة فابتنى مدينة عند مفرق البحرين وسماها المنصورة ونزلها بجيشه {cite:tarikh-khulafa-minhaj-1434 p. 694,696}؛ وتملك المصرية عشرين سنة تحت جناح والده وعشرين بعده، وملك دمشق قبل موته بشهرين بعد أن حصرها وأخذها من ابن أخيه الصالح إسماعيل، وملك حران وآمد وديار الجزيرة؛ قال ابن خلكان كان سلطاناً عظيم القدر محباً للعلماء يبيت عنده كل ليلة جمعة جماعة من الفضلاء وهو معهم كواحد منهم، وخطب له بمكة «صاحب مكة وعبيدها واليمن وزييدها ومصر وصعيدها والشام وصناديدها والجزيرة ووليدها سلطان القبلتين ورب العلامتين خادم الحرمين الشريفين»؛ وبنى بالقاهرة دار حديث ورتب لها وقفاً وبنى على قبر الإمام الشافعي قبة عظيمة؛ توفي بدمشق في رجب سنة خمس وثلاثين {cite:shadharat-dhahab p. 172-173}."
  en: "Ayyubid sultan, set over Egypt by his father al-Adil in 595; when the Franks took Damietta in 616 he founded al-Mansura at the seas' fork and camped there {cite:tarikh-khulafa-minhaj-1434 p. 694,696}."
  ur: "ایوبی سلطان، جنہیں ان کے والد العادل نے 595ھ میں مصر پر مقرر کیا؛ فرنگیوں کے دمیاط لینے کے بعد انہوں نے منصورہ قائم کیا۔ {cite:khitat-maqrizi-1998}"
  es: "Sultan ayubí, puesto al frente de Egipto por su padre al-Adil en 595; cuando los francos tomaron Damietta en 616 fundó al-Mansura en la bifurcación de los mares y acampó allí {cite:tarikh-khulafa-minhaj-1434 p. 694,696}."
  fr: "Sultan ayyoubide, placé sur l'Égypte par son père al-Adil en 595; lorsque les Francs prirent Damiette en 616, il fonda al-Mansura à la confluence des mers et y campa {cite:tarikh-khulafa-minhaj-1434 p. 694,696}."
  tr: "Bir Eyyubi sultan olan babası Al-Malik Al-Adil, 1995'te Kral Al-Aziz öldüğünde Mısır'ın kontrolünü ele geçirdikten sonra onu Mısır'a yerleştirdi ve 1660 Hicri'de Frankların Damietta'yı ele geçirmesiyle direnişini zayıflattı. Bahreyn'in kavşağında bir şehir inşa etti, adını Al-Mansura koydu ve ordusuyla orada konakladı {cite:History-Khulafa-Minhaj-1434, s. 694,696}; babasının himayesinde yirmi yıl ve ondan sonra yirmi yıl Mısır'ı yönetti; ölümünden iki ay önce Şam'ı kuşatıp doğru yeğeni İsmail'den aldıktan sonra yönetti. Harran, Amed ve adanın topraklarını yönetti; İbn Hallikan onun Saygın bir sultan, sevgi dolu alimler olarak, her Cuma gecesi erdemli bir grupla geceyi geçirirdi ve onlarla birlikteydi. Mekke'de ona vaazlar verdi: \"Mekke ve köleleri, Yemen ve Zayd'i, Mısır, Yukarı Mısır, Şam ve destekçileri, Cazire ve onun soyundan, İki Kible Sultanı ve İki Müsait Efendisi, İki Kutsal Caminin Koruyucusu\"; Kahire'de bir hadis evi inşa etti, ona bir bağış ayarladı ve İmam Şafii'nin mezarının üzerine büyük bir kubbe inşa etti; otuz beşinci yılda Şam'da Recep'te öldü {atıf: şadharat-dhahab, s. 172-173}."
  id: "Seorang sultan Ayyubiyah, ayahnya Al-Malik Al-Adil menetapkannya di Mesir setelah ia mengambil alih wilayah itu ketika Raja Al-Aziz wafat pada tahun 1995 dan melemahkan perlawanan bangsa Franka ketika mereka merebut Damietta pada tahun 1660 H. Ia membangun sebuah kota di persimpangan Bahrain, menamainya Al-Mansura, dan menetap di sana bersama pasukannya {cite:History-Khulafa-Minhaj-1434, hlm. 694,696}; ia memerintah Mesir selama dua puluh tahun di bawah naungan ayahnya dan dua puluh tahun setelahnya, serta memerintah Damaskus dua bulan sebelum wafat setelah mengepungnya dan merebutnya dari keponakannya yang benar, Ismail. Ia memerintah Harran, Amed, dan tanah-tanah di pulau itu; Ibn Khallikan mengatakan bahwa ia adalah Seorang sultan besar yang penuh kehormatan, ulama yang penuh kasih, ia menghabiskan malam bersama sekelompok orang berbudi luhur setiap Jumat malam, dan ia bersama mereka sebagai salah satu dari mereka. Ia menyampaikan khotbah kepadanya di Mekah: \"penguasa Mekah dan budaknya, Yaman dan Zayd-nya, Mesir, Mesir Atas, Levant dan para pendukungnya, Jazira dan keturunannya, Sultan Dua Qiblas dan Tuhan Dua Tanda, Penjaga Dua Masjid Suci\"; ia membangun sebuah rumah hadis di Kairo, mengatur wakaf untuknya, dan membangun kubah besar di atas makam Imam Al-Shafi'i; ia meninggal di Damaskus di Rajab pada tahun tiga puluh lima {cite:shadharat-dhahab, hlm. 172-173}."
