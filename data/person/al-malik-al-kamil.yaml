    ar: "الملك الكامل أقامه أبوه العادل بمصر؛ لما أخذ الفرنج دمياط سنة ٦١٦هـ ابتنى مدينة عند مفرق البحرين وصمد أمامهم حتى جلَوا."
    en: "Al-Malik al-Kamil was seated in Egypt by his father al-Adil; when the Franks took Damietta in 616 AH he built a city at the two branches' fork and stood fast until they withdrew."
    ur: "ملک کامل کو اس کے باپ عادل نے مصر میں مقرر کیا؛ جب 616ھ میں افرنج نے دمیاط لیا تو اس نے دو شاخوں کی تقسیم کے مقام پر شہر بسایا اور انہیں نکالنے تک ثابت قدم رہا۔"
