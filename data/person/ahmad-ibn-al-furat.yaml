summary:
  ar: "أحمد بن الفرات بن خالد الضبي الرازي، أبو مسعود، حافظ حجة ومحدث أصبهان، روى عنه أبو داود في سننه؛ توفي سنة ٢٥٨هـ."
  en: "Ahmad ibn al-Furat ibn Khalid al-Dabbi al-Razi, Abu Mas'ud, a memoriser and authority and the hadith scholar of Isfahan, from whom Abu Dawud narrated in his Sunan; he died in 258 AH."
  fr: "Ahmad ibn al-Furat ibn Khalid al-Dabbi al-Razi, Abu Mas'ud, mémorisateur, autorité et spécialiste du hadith d'Ispahan, d'après lequel Abu Dawud transmit dans ses Sunan ; mort en 258 H."
  es: "Ahmad ibn al-Furat ibn Khalid al-Dabbi al-Razi, Abu Mas'ud, memorizador y autoridad, y erudito de hadices de Isfahán, de quien Abu Dawud narró en su Sunan; murió en el año 258 de la Hégira."
  ur: "احمد بن الفرات بن خالد الدبی الرازی، ابو مسعود، ایک حافظ و مقتدر اور اصفہان کے محدث حدیث، جن سے ابو داؤد نے اپنی سنن میں روایت کی ہے۔ آپ کی وفات 258ھ میں ہوئی۔"
  tr: "İsfahanlı, güvenilir bir ezberci ve hadis âlimi olan Ahmed ibn el-Furat ibn Halid el-Dabbi el-Razi (Ebu Mesud), Ebu Davud'un Sünen'inde kendisinden rivayet ettiği kişidir; Hicri 258 yılında vefat etmiştir."
  id: "Ahmad ibn al-Furat ibn Khalid al-Dabbi al-Razi, Abu Masoud, seorang penghafal dan ahli hadits terpercaya dari Isfahan, yang riwayatnya dimuat oleh Abu Dawud dalam kitab Sunannya; beliau wafat pada tahun 258 Hijriah."
