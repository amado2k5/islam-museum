label: { ar: "غيلان بن خرشة الضبي", en: "Ghaylan ibn Kharasha al-Dabbi", es: "Ghaylan ibn Kharasha al-Dabbi", fr: "Ghaylan ibn Kharasha al-Dabbi" }
summary:
  ar: "غيلان بن خرشة الضبي؛ تولى لعبد الله بن عامر حفر نهر أم عبد الله دجاجة وهو النهر الذي قال فيه حارثة بن بدر الغداني لابن عامر وقد سايره لم أر أعظم بركة من هذا النهر يستقي منه الضعفاء من أبواب دورهم ثم ساير زياداً فقال ما رأيت نهراً شراً منه يغرق فيه صبيانهم وروى قوم أن القائل هذا غيلان."
  en: "Ghaylan ibn Kharasha al-Dabbi; he ran Ibn Amir's digging of the Umm Abdallah Dajaja canal — the one Haritha ibn Badr praised riding with Ibn Amir ('never a greater blessing — the weak drink at their own doors') then damned riding with Ziyad ('never a worse canal — their boys drown in it'); some say the two-tongued speaker was Ghaylan himself."
  es: "Ghaylan ibn Kharasha al-Dabbi dirigió la excavación del canal Umm Abdallah Dajaja por parte de Ibn Amir, el mismo que Haritha ibn Badr elogió al viajar con Ibn Amir («nunca hubo mayor bendición: los débiles beben en sus propias puertas») y luego maldijo al viajar con Ziyad («nunca hubo un canal peor: sus muchachos se ahogan en él»); algunos dicen que el orador de dos lenguas era el propio Ghaylan."
  fr: "Ghaylan ibn Kharasha al-Dabbi; il dirigea le creusement du canal Umm Abdallah Dajaja par Ibn Amir — celui-là même que Haritha ibn Badr loua pour avoir voyagé avec Ibn Amir (« jamais de plus grande bénédiction — les faibles boivent à leurs propres portes ») puis maudit pour avoir voyagé avec Ziyad (« jamais de pire canal — leurs garçons s'y noient »); certains disent que celui qui parlait à deux langues était Ghaylan lui-même."
