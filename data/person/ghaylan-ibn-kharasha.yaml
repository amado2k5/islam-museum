label: { ar: "غيلان بن خرشة الضبي", en: "Ghaylan ibn Kharasha al-Dabbi" }
summary:
  ar: "غيلان بن خرشة الضبي؛ تولى لعبد الله بن عامر حفر نهر أم عبد الله دجاجة وهو النهر الذي قال فيه حارثة بن بدر الغداني لابن عامر وقد سايره لم أر أعظم بركة من هذا النهر يستقي منه الضعفاء من أبواب دورهم ثم ساير زياداً فقال ما رأيت نهراً شراً منه يغرق فيه صبيانهم وروى قوم أن القائل هذا غيلان."
  en: "Ghaylan ibn Kharasha al-Dabbi; he ran Ibn Amir's digging of the Umm Abdallah Dajaja canal — the one Haritha ibn Badr praised riding with Ibn Amir ('never a greater blessing — the weak drink at their own doors') then damned riding with Ziyad ('never a worse canal — their boys drown in it'); some say the two-tongued speaker was Ghaylan himself."
