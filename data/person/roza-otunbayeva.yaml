summary:
  ar: "سياسية ودبلوماسية قيرغيزية وُلدت سنة 1950 في فرونزه؛ أستاذة فلسفة صارت سفيرة بلادها الأولى لدى واشنطن ولندن ومبعوثة أممية، ثم قادت الحكومة الانتقالية بعد ثورة أبريل 2010 وتولّت رئاسة قيرغيزستان حتى ديسمبر 2011، أول امرأة ترأس دولة في آسيا الوسطى، وعملت لاحقًا ممثلة خاصة للأمين العام للأمم المتحدة في أفغانستان."
  en: "Kyrgyz politician and diplomat born in 1950 at Frunze. A philosophy lecturer who became her country's first ambassador to Washington and London and a UN envoy, she led the interim government after the April 2010 revolution and served as President of Kyrgyzstan until December 2011 — Central Asia's first woman head of state — and later worked as the UN Secretary-General's Special Representative for Afghanistan."
  ur: "کرغیز سیاست دان و سفارت کار، پیدائش 1950ء فرونزے میں۔ فلسفے کی استاد جو اپنے ملک کی واشنگٹن اور لندن میں پہلی سفیر اور اقوام متحدہ کی مندوب رہیں، پھر اپریل 2010ء کے انقلاب کے بعد عبوری حکومت کی قیادت کی اور دسمبر 2011ء تک کرغیزستان کی صدر رہیں — وسطی ایشیا کی پہلی خاتون سربراہِ مملکت — اور بعد میں افغانستان میں اقوام متحدہ کے سیکرٹری جنرل کی خصوصی نمائندہ کے طور پر کام کیا۔"
