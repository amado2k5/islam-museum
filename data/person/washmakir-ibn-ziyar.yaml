summary:
  ar: "وشمكير بن زيار، أخو مرداويج بن زيار من الجيل إخوة الديلم؛ بعث عنه مرداويج من بلاد كيلان سنة 320هـ فاستظهر به على أمره وولاه الأعمال الجليلة، فلما قتل مرداويج ملك وشمكير طبرستان وجرجان، وتنازع الري وأصفهان مع ركن الدولة بن بويه: طرده من أصفهان سنة 327هـ ثم استردها، وانهزم عن الري لأبي علي بن محتاج صاحب خراسان فلحق بطبرستان، واستنجد بنوح بن سامان حتى ملك جرجان من الحسن بن الفيرزان، وظل ينازع ابن بويه الجبال وجرجان."
  en: "Washmakir ibn Ziyar, brother of Mardawij ibn Ziyar of the Gilanite brothers of the Daylam; summoned from Gilan in 320 AH to back his brother and given the great commands, he took Tabaristan and Jurjan after Mardawij's killing and contested Rayy and Isfahan with Rukn al-Dawla ibn Buya — expelled from Isfahan in 327 then recovered it, lost Rayy to Abu Ali ibn Muhtaj of Khurasan and fell back on Tabaristan, and won Jurjan from al-Hasan ibn al-Fayruzan with Nuh ibn Saman's aid, staying locked in rivalry with the Buyids over the Jibal and Jurjan."
  es: "Washmakir ibn Ziyar, hermano de Mardawij ibn Ziyar de los hermanos gilanitas de Daylam; llamado desde Gilan en el 320 AH para apoyar a su hermano y dado a los grandes mandos, tomó Tabaristán y Jurjan después del asesinato de Mardawij y disputó Rayy e Isfahán con Rukn al-Dawla ibn Buya - expulsado de Isfahán en el 327 luego lo recuperó, perdió Rayy a Abu Ali ibn Muhtaj de Jorasán y se replegó sobre Tabaristán, y ganó Jurjan a al-Hasan ibn al-Fayruzan con la ayuda de Nuh ibn Saman, permaneciendo enfrascado en una rivalidad con los Buyíes por Jibal y Jurjan."
  fr: "Washmakir ibn Ziyar, frère de Mardawij ibn Ziyar, des frères gilanites de la tribu Daylam, fut appelé de Gilan en 320 AH pour soutenir son frère et reçut les grands commandements. Après la mort de Mardawij, il prit le Tabaristan et le Jurjan, puis contesta le Rayy et Ispahan avec Rukn al-Dawla ibn Buya. Expulsé d'Ispahan en 327, il la reconquit, perdit le Rayy au profit d'Abu Ali ibn Muhtaj du Khorasan et se replia sur le Tabaristan. Avec l'aide de Nuh ibn Saman, il gagna le Jurjan à al-Hasan ibn al-Fayruzan, tout en restant en conflit avec les Bouyides au sujet du Jibal et du Jurjan."
  ur: "واشمکر ابن زیار، دیلام کے گیلانی بھائیوں کے مردویج ابن زیار کا بھائی؛ 320 ہجری میں اپنے بھائی کی پشت پناہی کے لیے گیلان سے بلوایا اور عظیم حکم دیا، مردویج کے قتل کے بعد اس نے طبرستان اور جرجان پر قبضہ کیا اور رکن الدولہ ابن بویا کے ساتھ رے اور اصفہان کا مقابلہ کیا - 327 میں اصفہان سے نکال دیا گیا اور پھر اسے واپس حاصل کیا، ابو علی ابن مہتاج کے ہاتھوں رے کو کھو دیا اور تاجستان سے فتح حاصل کی اور واپس فتح کیا۔ الحسن بن الفیروزان نوح بن سمعان کی مدد کے ساتھ جبل اور جرجان پر خریداروں کے ساتھ دشمنی میں بند رہے۔"
  tr: "Şemkir ibn Ziyar, Daylamlıların kardeşlerinden olan Mardawij ibn Ziyar'ın kardeşi; Mardawij, 320 Hicri'de Kilan topraklarından onu çağırdı, komutasına atadı ve soylu görevlere atadı. Mardavij öldürüldüğünde, Şamkir, Tabaristan ve Jurjan kralı ve Rayy ile İsfahan arasındaki Rukn al-Dawla ibn Buyid arasındaki anlaşmazlık: 327 Hicri'de onu İsfahan'dan kovdu, ardından geri aldı. Rayın Rayy'den Horasan'ın hükümdarı Ebu Ali ibn Muhtac tarafından yenildi ve ardından Tabaristan'a katılarak Nuh ibn Saman'dan yardım istedi, ta ki Jurjan el-Hasan ibn el-Furzan'dan hüküm sürene kadar. İbn Büyid dağlar ve Jurcan arasında anlaşmazlık yaşamaya devam etti."
  id: "Shamkir ibn Ziyar, saudara Mardawij ibn Ziyar dari generasi saudara Daylamit; Mardawij memanggilnya dari tanah Kilan pada tahun 320 H, mengangkatnya ke komando dan menunjuknya ke posisi bangsawan. Ketika Mardavij terbunuh, raja Shamkir, Tabaristan dan Jurjan, serta perselisihan antara Rayy dan Isfahan dengan Rukn al-Dawla ibn Buyid: dia mengusirnya dari Isfahan pada tahun 327 H, lalu merebut kembali wilayah itu. Dia dikalahkan dari Rayy oleh Abu Ali ibn Muhtaj, penguasa Khorasan, lalu bergabung dengan Tabaristan, mencari bantuan dari Nuh ibn Saman hingga Jurjan memerintah dari al-Hasan ibn al-Furzan. Ibn Buyid terus memperebutkan pegunungan dan Jurjan."
