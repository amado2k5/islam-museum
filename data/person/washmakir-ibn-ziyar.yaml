id: person/washmakir-ibn-ziyar
class: person
label:
  ar: وشمكير بن زيار
  en: Washmakir ibn Ziyar
summary:
  ar: "وشمكير بن زيار، أخو مرداويج بن زيار من الجيل إخوة الديلم؛ بعث عنه مرداويج من بلاد كيلان سنة 320هـ فاستظهر به على أمره وولاه الأعمال الجليلة، فلما قتل مرداويج ملك وشمكير طبرستان وجرجان، وتنازع الري وأصفهان مع ركن الدولة بن بويه: طرده من أصفهان سنة 327هـ ثم استردها، وانهزم عن الري لأبي علي بن محتاج صاحب خراسان فلحق بطبرستان، واستنجد بنوح بن سامان حتى ملك جرجان من الحسن بن الفيرزان، وظل ينازع ابن بويه الجبال وجرجان."
  en: "Washmakir ibn Ziyar, brother of Mardawij ibn Ziyar of the Gilanite brothers of the Daylam; summoned from Gilan in 320 AH to back his brother and given the great commands, he took Tabaristan and Jurjan after Mardawij's killing and contested Rayy and Isfahan with Rukn al-Dawla ibn Buya — expelled from Isfahan in 327 then recovered it, lost Rayy to Abu Ali ibn Muhtaj of Khurasan and fell back on Tabaristan, and won Jurjan from al-Hasan ibn al-Fayruzan with Nuh ibn Saman's aid, staying locked in rivalry with the Buyids over the Jibal and Jurjan."
