summary:
  ar: "أبو علي الحسين بن شعيب المروزي السنجي الشافعي، عالم أهل مرو في وقته، تفقه بالقفال المروزي، وشرح فروع ابن الحداد والتلخيص لابن القاص، وله «المجموع»، وهو أول من جمع بين طريقتي العراق وخراسان، توفي نحو سنة 430 هـ."
  en: "Abu Ali al-Husayn ibn Shu'ayb al-Marwazi al-Sinji, the Shafi'i jurist who was the leading scholar of Merv in his time; pupil of al-Qaffal al-Marwazi, commentator on Ibn al-Haddad's Furu' and Ibn al-Qass's Talkhis, author of al-Majmu', and the first to combine the Iraqi and Khurasani methods; died about 430 AH (1039 CE)."
  fr: "Abu Ali al-Husayn ibn Shu'ayb al-Marwazi al-Sinji, juriste shafi'ite qui fut le premier savant de Merv en son temps ; élève d'al-Qaffal al-Marwazi, commentateur des Furu' d'Ibn al-Haddad et du Talkhis d'Ibn al-Qass, auteur d'al-Majmu', et le premier à réunir les méthodes irakienne et khurasanienne ; mort vers 430 H (1039 ap. J.-C.)."
  es: "Abu Ali al-Husayn ibn Shu'ayb al-Marwazi al-Sinji, el jurista shafi'i que fue el principal estudioso de Merv en su época; alumno de al-Qaffal al-Marwazi, comentarista de Furu' de Ibn al-Haddad y Talkhis de Ibn al-Qass, autor de al-Majmu', y el primero en combinar los métodos iraquí y jurasani; murió alrededor del 430 AH (1039 CE)."
  ur: "ابو علی الحسین بن شعیب المروازی السنجی، شافعی فقیہ جو اپنے زمانے میں مرو کے معروف عالم تھے۔ القفل المروازی کے شاگرد، ابن الحداد کے فرو اور ابن القاس کے تلخیص پر مفسر، المجمو کے مصنف، اور عراقی اور خراسانی طریقوں کو یکجا کرنے والے پہلے شخص؛ تقریباً 430ھ ⁦(1039ء)⁩ میں وفات پائی۔"
