summary:
  ar: مغنية إندونيسية وُلدت سنة 1990 في لوموك؛ اشتهرت طفلةً بألبومات النشيد مع حداد علوي منها «سينتا راسول»، وصارت صوتًا محبوبًا للغناء الديني الإندونيسي وتواصل الإصدار والغناء.
  en: Indonesian singer born in Lombok in 1990; she rose to fame as a child on Haddad Alwi's devotional albums such as Cinta Rasul, becoming a beloved voice of Indonesian religious song, and continues to
    record and perform.
  ur: انڈونیشی گلوکارہ جو 1990 میں لومبوک میں پیدا ہوئی؛ حداد علوی کے مذہبی البموں مثل Cinta Rasul سے بچپن میں مشہور ہوئی اور انڈونیشی مذہبی غناء کی محبوب آواز بنی، آج بھی ریکارڈ اور پرفارم کرتی ہے۔
  es: "Cantante indonesia nacida en Lombok en 1990; saltó a la fama siendo niña con los álbumes devocionales de Haddad Alwi, como Cinta Rasul, convirtiéndose en una voz muy querida de la música religiosa indonesia, y continúa grabando y actuando."
  fr: "Chanteuse indonésienne née à Lombok en 1990, elle a accédé à la célébrité dès son enfance grâce aux albums dévotionnels de Haddad Alwi, tels que Cinta Rasul, devenant une voix appréciée de la chanson religieuse indonésienne, et continue d'enregistrer et de se produire sur scène."
