  ar: "التاجر الكاتب؛ ولي حسبة دمشق فأحسن السيرة واستصغرها الناس عليه فلم ينشب أن ولي الوزارة ودخل دمشق في دست عظيم لم يعهد مثله، وكان قبل ذلك يكثر الصيام والذكر فلما تولى الوزارة تكبر على الناس لا سيما الأمراء وآذى الذي أوصله إلى السلطان؛ فلما قُتل الملك الأشرف مُسك واستُأصلت أمواله وأقاربه، وكان قد كُتب إليه يُحذَّر نهش الشجاعي فمات منها عاقبه إلى أن مات {cite:shadharat-dhahab p. 740}."
  en: "The merchant-scribe vizier — Damascus's model muhtasib, then al-Ashraf's vizier in a procession 'the like unseen'; after the sultan's murder he was seized, and died as the warning verse foretold, of al-Shuja'i's 'bite' {cite:shadharat-dhahab p. 740}."
