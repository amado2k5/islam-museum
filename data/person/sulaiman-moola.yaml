summary:
  ar: "عالم ومحاضر من جنوب أفريقيا؛ حفظ القرآن في الرابعة عشرة من عمره، ثم درس سبع سنوات العلوم الشرعية ومنها الفقه متخصصا في المذهب الحنفي، ونال إجازات من كبار علماء جنوب أفريقيا وشبه القارة الهندية، ودرّس في دار العلوم زكريا بليناسيا، ويحاضر في الإذاعة وخطب الجمعة في أنحاء جنوب أفريقيا، وله كتابا «صدى من الكهف» و«الشمس التي لا تغيب أبدا»، وهو مستشار أول ومدرّس في مؤسسة مثابة."
  en: "South African Islamic scholar and lecturer: he memorised the Qur'an at fourteen, then studied the sacred sciences for seven years, including fiqh with a specialisation in the Hanafi school, received ijazahs from senior scholars of South Africa and the Indian subcontinent, taught at Dar al-Uloom Zakariyya in Lenasia, and addresses radio programmes and Friday congregations across South Africa; his books include Echoes from the Cave and The Sun That Never Set, and he is a senior advisor and teacher at Mathabah."
  ur: "جنوبی افریقی عالم و مقرر؛ انہوں نے چودہ برس کی عمر میں قرآن حفظ کیا، پھر سات برس علومِ شرعیہ کی تعلیم حاصل کی جن میں فقہ بھی شامل تھی جس میں انہوں نے حنفی مکتب میں تخصص کیا، جنوبی افریقہ اور برصغیر کے بزرگ علما سے اجازے حاصل کیے، لیناسیا کے دار العلوم زکریا میں تدریس کی، اور وہ جنوبی افریقہ بھر میں ریڈیو پروگراموں اور جمعہ کے خطبوں میں خطاب کرتے ہیں؛ ان کی کتابوں میں Echoes from the Cave اور The Sun That Never Set شامل ہیں، اور وہ مثابہ میں سینئر مشیر و استاد ہیں۔"
