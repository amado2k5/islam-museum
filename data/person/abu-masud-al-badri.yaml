summary:
  ar: "صحابي بدري يروي عنه حديث «إن مما أدرك الناس من كلام النبوة الأولى: إذا لم تستح فاصنع ما شئت» وهو الحديث العشرون من الأربعين النووية، أخرجه البخاري من رواية منصور بن المعتمر عن ربعي بن حراش عنه، واختُلف في إسناده فقيل عن ربعي عن حذيفة، لكن أكثر الحفاظ — منهم البخاري وأبو زرعة والدارقطني — رجحوا قول من قال عن أبي مسعود وعضده إسناد مسروق عنه. وروى عنه أبو مسعود البدري لا يبقى على وجه الأرض بعد مائة أحد إلا مات فاستفاضت الرواية فجزع الأكثر فأفضى ذلك إلى علي فقال إنما مراده ألا يبقى بعد رأس مائة ممن رآه إلا مات {cite:muruj-al-dhahab p. 594}"
  en: "A Companion of Badr who transmits 'what people have retained of the speech of the first prophethood: if you feel no shame, do as you wish', the twentieth hadith of al-Nawawi's Forty, transmitted by al-Bukhari through Mansur ibn al-Mu'tamir from Rib'i ibn Hirash from him; its chain was disputed — some said Rib'i from Hudhayfa — but most of the memorising critics, al-Bukhari, Abu Zur'a and al-Daraqutni among them, ruled for the Abu Masud version, corroborated by Masruq's route from him."
