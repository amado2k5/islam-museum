summary:
  ar: "صحابي بدري يروي عنه حديث «إن مما أدرك الناس من كلام النبوة الأولى: إذا لم تستح فاصنع ما شئت» وهو الحديث العشرون من الأربعين النووية، أخرجه البخاري من رواية منصور بن المعتمر عن ربعي بن حراش عنه، واختُلف في إسناده فقيل عن ربعي عن حذيفة، لكن أكثر الحفاظ — منهم البخاري وأبو زرعة والدارقطني — رجحوا قول من قال عن أبي مسعود وعضده إسناد مسروق عنه. وروى عنه أبو مسعود البدري لا يبقى على وجه الأرض بعد مائة أحد إلا مات فاستفاضت الرواية فجزع الأكثر فأفضى ذلك إلى علي فقال إنما مراده ألا يبقى بعد رأس مائة ممن رآه إلا مات {cite:muruj-al-dhahab p. 594}"
  en: "A Companion of Badr who transmits 'what people have retained of the speech of the first prophethood: if you feel no shame, do as you wish', the twentieth hadith of al-Nawawi's Forty, transmitted by al-Bukhari through Mansur ibn al-Mu'tamir from Rib'i ibn Hirash from him; its chain was disputed — some said Rib'i from Hudhayfa — but most of the memorising critics, al-Bukhari, Abu Zur'a and al-Daraqutni among them, ruled for the Abu Masud version, corroborated by Masruq's route from him."
  ur: "بدری صحابی جن سے «اگر شرم نہیں کرتے تو جو چاہو کرو» کی حدیث منقول ہے، جو پہلی نبوت کی باتوں کی باقیات میں ہے۔"
  fr: "Compagnon de Badr qui transmet « ce que les gens ont retenu de la parole de la première prophétie : si tu n'as pas de pudeur, fais ce que tu veux », le vingtième hadith des Quarante d'al-Nawawi, transmis par al-Bukhari par Mansur ibn al-Mu'tamir d'après Rib'i ibn Hirash d'après lui ; sa chaîne fut discutée — certains dirent Rib'i d'après Hudhayfa —, mais la plupart des critiques mémorisateurs, dont al-Bukhari, Abu Zur'a et al-Daraqutni, tranchèrent en faveur de la version d'Abu Masud, corroborée par la voie de Masruq d'après lui."
  es: "Un Compañero de Badr que transmite \"lo que la gente ha conservado del discurso de la primera profecía: si no sientes vergüenza, haz lo que quieras\", el vigésimo hadiz de los Cuarenta de al-Nawawi, transmitido por al-Bujari a través de Mansur ibn al-Mu'tamir de Rib'i ibn Hirash de él; su cadena fue disputada —algunos dijeron que Rib'i de Hudhayfa— pero la mayoría de los críticos memorizadores, al-Bujari, Abu Zur'a y al-Daraqutni entre ellos, se decantaron por la versión de Abu Masud, corroborada por la ruta de Masruq desde él."
