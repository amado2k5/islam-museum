id: person/toqtamish-khan
class: person
label:
  ar: طغطمش بن بردبيك صاحب صراي
  en: Toqtamish ibn Burdbik, lord of Saray
  es: "Toqtamish ibn Burdbik, lord of Saray"
  fr: "Toqtamish ibn Burdbik, lord of Saray"
summary:
  ar: "طغطمش بن بردبيك من بني دوشي خان، صاحب التخت بصراي؛ استوسق له الملك بصراي وأعمالها بعد ماماي، وأغرا الشيخ ولي ملك مازندران بالانتقاض على تمر فحسم تمر علته وقرر الزحف إليه، فسار طغطمش للقائه وداخله تمر وجماعة الأمراء فاستراب بهم وقد حان اللقاء فتصافحوا للحرب وانهزم طغطمش وتبدد عياله، ثم عاد فاسترجع صراي، ولم تزل الحرب بينه وبين تمر إلى أن بلغ الخبر آخر سنة 797هـ أن تمر ظفر به وقتله واستولى على سائر أعماله."
  en: "Toqtamish ibn Burdbik of the Jochids, holder of the throne at Saray; he secured the Dasht kingship after Mamay — incited by the dispossessed Shaykh Wali of Mazandaran he rose against Timur, who marched on him; they met in battle and Toqtamish broke, his household scattered, yet he regained Saray — and the war ran on until word came late in 797 AH that Timur had crushed and killed him and seized all his domains."
  es: "Toqtamish ibn Burdbik de los Jochids, poseedor del trono de Saray; se aseguró el reinado de Dasht después de Mamay; instigado por el desposeído Shaykh Wali de Mazandaran, se alzó contra Timur, quien marchó contra él; se enfrentaron en batalla y Toqtamish fue derrotado, su casa se dispersó, pero recuperó Saray; y la guerra continuó hasta que a finales del año 797 AH llegó la noticia de que Timur lo había aplastado y matado y se había apoderado de todos sus dominios."
  fr: "Toqtamish ibn Burdbik, de la tribu des Jochides, détenteur du trône à Saray, s'assura la royauté Dasht après Mamay. Incité par le cheikh Wali de Mazandaran, dépossédé de ses biens, il se souleva contre Timour, qui marcha sur lui. Ils s'affrontèrent au combat et Toqtamish fut vaincu, sa maison dispersée, mais il reprit Saray. La guerre se poursuivit jusqu'à ce que la nouvelle parvienne, fin 797 AH, que Timour l'avait écrasé et tué et s'était emparé de tous ses domaines."
