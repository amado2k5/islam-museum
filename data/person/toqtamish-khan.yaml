id: person/toqtamish-khan
class: person
label:
  ar: طغطمش بن بردبيك صاحب صراي
  en: Toqtamish ibn Burdbik, lord of Saray
summary:
  ar: "طغطمش بن بردبيك من بني دوشي خان، صاحب التخت بصراي؛ استوسق له الملك بصراي وأعمالها بعد ماماي، وأغرا الشيخ ولي ملك مازندران بالانتقاض على تمر فحسم تمر علته وقرر الزحف إليه، فسار طغطمش للقائه وداخله تمر وجماعة الأمراء فاستراب بهم وقد حان اللقاء فتصافحوا للحرب وانهزم طغطمش وتبدد عياله، ثم عاد فاسترجع صراي، ولم تزل الحرب بينه وبين تمر إلى أن بلغ الخبر آخر سنة 797هـ أن تمر ظفر به وقتله واستولى على سائر أعماله."
  en: "Toqtamish ibn Burdbik of the Jochids, holder of the throne at Saray; he secured the Dasht kingship after Mamay — incited by the dispossessed Shaykh Wali of Mazandaran he rose against Timur, who marched on him; they met in battle and Toqtamish broke, his household scattered, yet he regained Saray — and the war ran on until word came late in 797 AH that Timur had crushed and killed him and seized all his domains."
