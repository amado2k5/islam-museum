class: person
label: { ar: "عبد الملك بن صالح", en: "Abd al-Malik ibn Salih", fr: "Abd al-Malik ibn Salih", es: "Abd al-Malik ibn Salih", ur: "عبد الملک بن صالح" }
summary:
  ar: "عبد الملك بن صالح بن علي بن عبد الله بن العباس، أمير عباسي ولّي الثغور في العصر الرشيدي؛ عند البلاذري: أحدث أهل قبرس حدثاً في ولايته فأراد نقض صلحهم والفقهاء متوافرون فكتب إلى الليث بن سعد ومالك بن أنس وسفيان بن عيينة وموسى بن أعين وإسماعيل بن عياش ويحيى بن حمزة وأبي إسحاق الفزاري ومخلد بن الحسين في أمرهم فأجابوه — وهو نموذج مبكر لاستشارة الوالي فقهاءَ عصره في أحكام أهل العهد. وعند المسعودي أتى به الرشيد يرفل في قيوده سنة ثمان وثمانين فلما قال له يحيى بن خالد بلغني أنك حقود قال إن يكن الحقد بقاء الخير والشر عندي فإنهما لباقيان في قلبي، فقال الرشيد للأصمعي حررها ما احتج أحد للحقد بمثل ما احتج به، وقال لقد نظرت إلى موضع السيف من عنقه مراراً يمنعني إبقائي على قومي في مثله {cite:muruj-al-dhahab p. 331-332}"
  en: "Abd al-Malik ibn Salih ibn Ali ibn Abdullah ibn al-Abbas, the Abbasid prince who governed the frontier marches in al-Rashid's era; in al-Baladhuri: when the people of Cyprus gave fresh offence under his governorship he wished to annul their treaty, the jurists being accessible, and wrote to al-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyayna, Musa ibn A'yun, Isma'il ibn Ayyash, Yahya ibn Hamza, Abu Ishaq al-Fazari and Makhlad ibn al-Husayn for their rulings — an early instance of a governor formally consulting the age's jurists on the law of treaty-peoples."
  fr: "Abd al-Malik ibn Salih ibn Ali ibn Abdullah ibn al-Abbas, prince abbasside qui gouverna les marches frontalières à l'époque d'al-Rashid ; chez al-Baladhuri : lorsque les gens de Chypre commirent une nouvelle offense sous son gouvernement, il voulut annuler leur traité, les juristes étant accessibles, et écrivit à al-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyayna, Musa ibn A'yun, Isma'il ibn Ayyash, Yahya ibn Hamza, Abu Ishaq al-Fazari et Makhlad ibn al-Husayn pour avoir leurs avis — un exemple précoce de gouverneur consultant formellement les juristes de son temps sur le droit des peuples sous traité."
  es: "Abd al-Malik ibn Salih ibn Ali ibn Abdullah ibn al-Abbas, el príncipe abasí que gobernó las marcas fronterizas en la era de al-Rashid; en al-Baladhuri: cuando el pueblo de Chipre volvió a cometer una ofensa bajo su gobierno, quiso anular su tratado, teniendo acceso a los juristas, y escribió a al-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyayna, Musa ibn A'yun, Isma'il ibn Ayyash, Yahya ibn Hamza, Abu Ishaq al-Fazari y Makhlad ibn al-Husayn para que emitieran sus dictamen, un ejemplo temprano de un gobernador que consultó formalmente a los juristas de la época sobre la ley de los pueblos que habían firmado tratados."
  ur: "عبد الملک ابن صالح ابن علی ابن عبداللہ ابن العباس، عباسی شہزادہ جس نے الراشد کے دور میں سرحدی مارچوں پر حکومت کی تھی۔ البلادوری میں ہے: جب قبرص کے لوگوں نے اس کی گورنری کے تحت تازہ جرم کیا تو اس نے ان کے معاہدے کو منسوخ کرنے کی خواہش کی، فقہاء قابل رسائی تھے، اور لیث بن سعد، مالک بن انس، سفیان ابن عیینہ، موسیٰ بن عیون، اسماعیل بن یحییٰ عیاض، ابو شعیب کو خط لکھا۔ اور مقلد ابن الحسین اپنے احکام کے لیے - ایک گورنر کی ابتدائی مثال جو کہ معاہدہ لوگوں کے قانون کے بارے میں عمر کے فقہاء سے باضابطہ طور پر مشورہ کرتا ہے۔"
  tr: "Raşidun Halifeliği döneminde sınır bölgelerini yöneten Abbasi emiri Abdülmalik ibn Salih ibn Ali ibn Abd Allah ibn el-Abbas, el-Baladhuri tarafından şöyle anlatılmaktadır: Kıbrıs halkı onun valiliği sırasında bir saldırıda bulundu, bu yüzden barış antlaşmalarını bozmaya çalıştı. Hukukçular hazır bulunduğu için, durumları hakkında el-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyaynah, Musa ibn A'yan, İsmail ibn Ayyash, Yahya ibn Hamza, Ebu İshak el-Fazari ve Mukhallad ibn el-Hüseyn'e yazdı ve onlar da ona cevap verdiler - bu, bir valinin antlaşma altındakilerin hükümleri konusunda zamanının hukukçularına danışmasının erken bir örneğidir. El-Mas'udi'ye göre, Raşid onu Hicri 88 yılında zincire vurulmuş halde huzuruna getirdi. Yahya ibn Halid ona, \"Senin kinci olduğunu duydum\" dediğinde, o şöyle cevap verdi: \"Eğer kinci olmak içimde iyilik ve kötülüğün bir arada bulunmasıysa, o zaman ikisi de kalbimde mevcuttur.\" Bunun üzerine Raşid, el-Esmaî'ye, \"Bunu yaz: Hiç kimse kinci olmayı bu kadar ikna edici bir argümanla savunmamıştır\" dedi. Şöyle ekledi: \"Kılıcın boynuna dayanacağı yeri defalarca inceledim ve bu durum, böyle bir durumda halkımı esirgememi engelliyor.\" 331-332"
  id: "Abd al-Malik ibn Salih ibn Ali ibn Abd Allah ibn al-Abbas, seorang emir Abbasiyah yang memerintah wilayah perbatasan selama Kekhalifahan Rasyidin, digambarkan oleh al-Baladhuri sebagai berikut: Penduduk Siprus melakukan tindakan agresi selama masa pemerintahannya, sehingga ia berusaha untuk membatalkan perjanjian damai mereka. Dengan adanya para ahli hukum yang siap sedia, ia menulis surat kepada al-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyaynah, Musa ibn A'yan, Ismail ibn Ayyash, Yahya ibn Hamzah, Abu Ishaq al-Fazari, dan Mukhallad ibn al-Husayn mengenai situasi mereka, dan mereka menjawabnya—sebuah contoh awal seorang gubernur yang berkonsultasi dengan para ahli hukum pada zamannya mengenai hukum-hukum mereka yang terikat perjanjian. Menurut al-Mas'udi, Rasyidin membawanya ke hadapannya dalam keadaan terbelenggu pada tahun 88 Hijriah. Ketika Yahya ibn Khalid berkata kepadanya, \"Aku telah mendengar bahwa engkau pendendam,\" dia menjawab, \"Jika pendendam adalah kehadiran kebaikan dan kejahatan dalam diriku, maka keduanya tetap ada di hatiku.\" Rashid kemudian berkata kepada al-Asma'i, \"Tuliskan ini: tidak ada seorang pun yang pernah berargumen tentang pendendam dengan argumen yang begitu meyakinkan.\" Dia menambahkan, \"Aku telah berulang kali melihat tempat di mana pedang akan diletakkan di lehernya, dan itu mencegahku untuk mengampuni kaumku dalam situasi seperti itu.\" 331-332"
