id: person/abd-al-malik-ibn-salih
class: person
label: { ar: "عبد الملك بن صالح", en: "Abd al-Malik ibn Salih" }
summary:
  ar: "عبد الملك بن صالح بن علي بن عبد الله بن العباس، أمير عباسي ولّي الثغور في العصر الرشيدي؛ عند البلاذري: أحدث أهل قبرس حدثاً في ولايته فأراد نقض صلحهم والفقهاء متوافرون فكتب إلى الليث بن سعد ومالك بن أنس وسفيان بن عيينة وموسى بن أعين وإسماعيل بن عياش ويحيى بن حمزة وأبي إسحاق الفزاري ومخلد بن الحسين في أمرهم فأجابوه — وهو نموذج مبكر لاستشارة الوالي فقهاءَ عصره في أحكام أهل العهد. وعند المسعودي أتى به الرشيد يرفل في قيوده سنة ثمان وثمانين فلما قال له يحيى بن خالد بلغني أنك حقود قال إن يكن الحقد بقاء الخير والشر عندي فإنهما لباقيان في قلبي، فقال الرشيد للأصمعي حررها ما احتج أحد للحقد بمثل ما احتج به، وقال لقد نظرت إلى موضع السيف من عنقه مراراً يمنعني إبقائي على قومي في مثله {cite:muruj-al-dhahab p. 331-332}"
  en: "Abd al-Malik ibn Salih ibn Ali ibn Abdullah ibn al-Abbas, the Abbasid prince who governed the frontier marches in al-Rashid's era; in al-Baladhuri: when the people of Cyprus gave fresh offence under his governorship he wished to annul their treaty, the jurists being accessible, and wrote to al-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyayna, Musa ibn A'yun, Isma'il ibn Ayyash, Yahya ibn Hamza, Abu Ishaq al-Fazari and Makhlad ibn al-Husayn for their rulings — an early instance of a governor formally consulting the age's jurists on the law of treaty-peoples."
