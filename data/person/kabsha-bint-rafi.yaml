summary:
  ar: "كبشة بنت رافع الأنصارية، أم سعد بن معاذ وعمرو بن معاذ، من بني عبد الأشهل؛ يذكر غضنفر أنها أول الأنصاريات مبايعةً للنبي حين قدم المدينة، وأنها سقت الجرحى وشهدت أحداً واستُشهد ابنها عمرو فيها، وكانت في حصن بني حارثة يوم الخندق، وبكت سعداً لما مات فعزّاها النبي."
  en: "Kabsha bint Rafi' al-Ansariyya of Banu Abd al-Ashhal, mother of Sa'd ibn Mu'adh and Amr ibn Mu'adh. Ghadanfar says she was the first Ansari woman to pledge allegiance to the Prophet when he reached Medina, carried water to the wounded, was present at Uhud where her son Amr was killed, stayed in the fort of Banu Haritha during the Trench, and wept for Sa'd at his death, when the Prophet consoled her."
  ur: "بنو عبد الاشہل کی انصاریہ کبشہ بنت رافع، سعد بن معاذ اور عمرو بن معاذ کی والدہ؛ غضنفر کہتا ہے وہ پہلی انصاریہ تھیں جنہوں نے بیعت کی۔"
  es: "Kabsha bint Rafi' al-Ansariyya de Banu Abd al-Ashhal, madre de Sa'd ibn Mu'adh y Amr ibn Mu'adh. Ghadanfar afirma que fue la primera mujer Ansari en jurar lealtad al Profeta cuando llegó a Medina, llevó agua a los heridos, estuvo presente en Uhud donde murió su hijo Amr, permaneció en la fortaleza de Banu Haritha durante la Batalla de la Trinchera y lloró por Sa'd tras su muerte, momento en que el Profeta la consoló."
  fr: "Kabsha bint Rafi' al-Ansariyya, de la tribu des Banu Abd al-Ashhal, mère de Sa'd ibn Mu'adh et d'Amr ibn Mu'adh, fut, selon Ghadanfar, la première femme Ansari à prêter allégeance au Prophète à son arrivée à Médine. Elle apporta de l'eau aux blessés, était présente à Uhud où son fils Amr trouva la mort, resta dans la forteresse des Banu Haritha durant la bataille du Fossé et pleura la mort de Sa'd, avant d'être consolée par le Prophète."
  tr: "Kabsha bint Rafi' al-Ansariyyah, Banu Abd al-Ashhal'dan Sa'd ibn Muadh ve Amr ibn Muadh'ın annesi; Ghadanfar, Peygamber Medine'ye geldiğinde Ansaritler arasında ilk kez ona bağlılık yemini eden, yaralılara su verdiğini, Uhud'a tanıklık ettiğini ve oğlu Amr'in orada şehit olduğunu belirtir. Hendek günü Banu Haritha kalesindeydi ve Sa'd öldüğünde onun için ağladı, bu yüzden Peygamber onu teselli etti."
  id: "Kabsha bint Rafi' al-Ansariyyah, ibu dari Sa'd ibn Muadh dan Amr ibn Muadh, dari Banu Abd al-Ashhal; Ghadanfar menyebutkan bahwa dia adalah orang pertama dari Ansarite yang bersumpah setia kepada Nabi ketika dia tiba di Madinah, dan bahwa dia memberikan air kepada yang terluka, menyaksikan Uhud, dan putranya Amr gugur di sana. Dia berada di benteng Banu Haritha pada hari Parit, dan dia menangis untuk Sa'd ketika dia wafat, sehingga Nabi menghiburnya."
