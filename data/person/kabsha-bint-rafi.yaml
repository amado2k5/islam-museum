summary:
  ar: "كبشة بنت رافع الأنصارية، أم سعد بن معاذ وعمرو بن معاذ، من بني عبد الأشهل؛ يذكر غضنفر أنها أول الأنصاريات مبايعةً للنبي حين قدم المدينة، وأنها سقت الجرحى وشهدت أحداً واستُشهد ابنها عمرو فيها، وكانت في حصن بني حارثة يوم الخندق، وبكت سعداً لما مات فعزّاها النبي."
  en: "Kabsha bint Rafi' al-Ansariyya of Banu Abd al-Ashhal, mother of Sa'd ibn Mu'adh and Amr ibn Mu'adh. Ghadanfar says she was the first Ansari woman to pledge allegiance to the Prophet when he reached Medina, carried water to the wounded, was present at Uhud where her son Amr was killed, stayed in the fort of Banu Haritha during the Trench, and wept for Sa'd at his death, when the Prophet consoled her."
