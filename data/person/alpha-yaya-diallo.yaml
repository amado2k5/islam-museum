summary:
  ar: "ألفا يايا ديالو (1830 – 1912)، حاكم لابي، إحدى المقاطعات التسع لإمامة فوتا جالون الإسلامية في غينيا الحالية، وابن حاكمها ألفا إبراهيما ديالو. صعد مع تقدم الفرنسيين في الداخل الغيني فاتفق معهم، وبعد هزيمة فوتا جالون سنة 1896 وقّع معهم اتفاق 10 فبراير 1897 فصارت أراضيه مستقلة فعليًا عن الإمامة. ساءت علاقته بهم حين تنازلوا سنة 1904 عن جزء من لابي لغينيا البرتغالية، فاعتقلوه سنة 1905 ونفوه إلى داهومي، ثم أطلقوه سنة 1910 فاعتقلوه ثانية سنة 1911 ورحّلوه إلى بورت إتيان حيث توفي سنة 1912 — في 10 أغسطس عند المقالة الإنجليزية وفي 10 أكتوبر عند الفرنسية وويكيداتا — وأُعيد رفاته إلى غينيا سنة 1968 فدُفن في ضريح كامايان بجوار الجامع الكبير في كوناكري؛ ونشيد غينيا الوطني مقتبس من أغنية نُظمت في مدحه نحو سنة 1903."
  en: "Alpha Yaya Diallo (1830 – 1912), ruler of Labé, one of the nine provinces of the Islamic Imamate of Futa Jallon in present-day Guinea, and son of its ruler Alfa Ibrahima Diallo. He rose as the French advanced into the Guinean interior and came to terms with them; after Futa Jallon's defeat in 1896 he signed an accord with them on 10 February 1897 that made his domains effectively independent of the imamate. Relations soured when the French ceded part of Labé to Portuguese Guinea in 1904; they arrested him in 1905 and deported him to Dahomey, released him in 1910, arrested him again in 1911 and deported him to Port-Étienne, where he died in 1912 — on 10 August by the English article, on 10 October by the French article and Wikidata. His remains were returned to Guinea in 1968 and buried at the Camayenne Mausoleum beside the Grand Mosque of Conakry, and Guinea's national anthem is adapted from a song composed in his honour around 1903."
  ur: "الفا یایا ڈیالو (1830ء – 1912ء)، موجودہ گنی میں فوتا جالون کی اسلامی امامت کی نو صوبوں میں سے ایک لابے کے حکمران، اور اس کے حکمران الفا ابراہیما ڈیالو کے بیٹے۔ فرانسیسی پیش قدمی کے ساتھ وہ ابھرے اور ان سے سمجھوتا کیا؛ 1896ء میں فوتا جالون کی شکست کے بعد 10 فروری 1897ء کے معاہدے نے ان کے علاقوں کو عملاً امامت سے آزاد کر دیا۔ 1904ء میں لابے کا ایک حصہ پرتگالی گنی کو دینے پر تعلقات بگڑ گئے؛ 1905ء میں وہ گرفتار کر کے داہومی جلاوطن کیے گئے، 1910ء میں رہا ہوئے، 1911ء میں دوبارہ گرفتار ہو کر پورٹ ایٹین بھیجے گئے جہاں 1912ء میں وفات پائی — انگریزی مقالے کے مطابق 10 اگست اور فرانسیسی مقالے و وکی ڈیٹا کے مطابق 10 اکتوبر۔ 1968ء میں ان کی باقیات گنی واپس لائی گئیں اور کوناکری کی جامع مسجد کے پاس کامایین مقبرے میں دفن کی گئیں؛ گنی کا قومی ترانہ تقریباً 1903ء میں ان کی مدح میں کہی گئی ایک نظم سے ماخوذ ہے۔"
