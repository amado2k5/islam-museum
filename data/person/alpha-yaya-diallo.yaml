summary:
  ar: "ألفا يايا ديالو (1830 – 1912)، حاكم لابي، إحدى المقاطعات التسع لإمامة فوتا جالون الإسلامية في غينيا الحالية، وابن حاكمها ألفا إبراهيما ديالو. صعد مع تقدم الفرنسيين في الداخل الغيني فاتفق معهم، وبعد هزيمة فوتا جالون سنة 1896 وقّع معهم اتفاق 10 فبراير 1897 فصارت أراضيه مستقلة فعليًا عن الإمامة. ساءت علاقته بهم حين تنازلوا سنة 1904 عن جزء من لابي لغينيا البرتغالية، فاعتقلوه سنة 1905 ونفوه إلى داهومي، ثم أطلقوه سنة 1910 فاعتقلوه ثانية سنة 1911 ورحّلوه إلى بورت إتيان حيث توفي سنة 1912 — في 10 أغسطس عند المقالة الإنجليزية وفي 10 أكتوبر عند الفرنسية وويكيداتا — وأُعيد رفاته إلى غينيا سنة 1968 فدُفن في ضريح كامايان بجوار الجامع الكبير في كوناكري؛ ونشيد غينيا الوطني مقتبس من أغنية نُظمت في مدحه نحو سنة 1903."
  en: "Alpha Yaya Diallo (1830 – 1912), ruler of Labé, one of the nine provinces of the Islamic Imamate of Futa Jallon in present-day Guinea, and son of its ruler Alfa Ibrahima Diallo. He rose as the French advanced into the Guinean interior and came to terms with them; after Futa Jallon's defeat in 1896 he signed an accord with them on 10 February 1897 that made his domains effectively independent of the imamate. Relations soured when the French ceded part of Labé to Portuguese Guinea in 1904; they arrested him in 1905 and deported him to Dahomey, released him in 1910, arrested him again in 1911 and deported him to Port-Étienne, where he died in 1912 — on 10 August by the English article, on 10 October by the French article and Wikidata. His remains were returned to Guinea in 1968 and buried at the Camayenne Mausoleum beside the Grand Mosque of Conakry, and Guinea's national anthem is adapted from a song composed in his honour around 1903."
  ur: "الفا یایا ڈیالو ⁦(1830ء – 1912ء)⁩، موجودہ گنی میں فوتا جالون کی اسلامی امامت کی نو صوبوں میں سے ایک لابے کے حکمران، اور اس کے حکمران الفا ابراہیما ڈیالو کے بیٹے۔ فرانسیسی پیش قدمی کے ساتھ وہ ابھرے اور ان سے سمجھوتا کیا؛ 1896ء میں فوتا جالون کی شکست کے بعد 10 فروری 1897ء کے معاہدے نے ان کے علاقوں کو عملاً امامت سے آزاد کر دیا۔ 1904ء میں لابے کا ایک حصہ پرتگالی گنی کو دینے پر تعلقات بگڑ گئے؛ 1905ء میں وہ گرفتار کر کے داہومی جلاوطن کیے گئے، 1910ء میں رہا ہوئے، 1911ء میں دوبارہ گرفتار ہو کر پورٹ ایٹین بھیجے گئے جہاں 1912ء میں وفات پائی — انگریزی مقالے کے مطابق 10 اگست اور فرانسیسی مقالے و وکی ڈیٹا کے مطابق 10 اکتوبر۔ 1968ء میں ان کی باقیات گنی واپس لائی گئیں اور کوناکری کی جامع مسجد کے پاس کامایین مقبرے میں دفن کی گئیں؛ گنی کا قومی ترانہ تقریباً 1903ء میں ان کی مدح میں کہی گئی ایک نظم سے ماخوذ ہے۔"
  es: "Alpha Yaya Diallo (1830-1912), gobernante de Labé, una de las nueve provincias del Imamato Islámico de Futa Jallon en la actual Guinea, e hijo de su gobernante, Alfa Ibrahima Diallo. Ascendió al poder cuando los franceses avanzaron hacia el interior de Guinea y llegó a un acuerdo con ellos; tras la derrota de Futa Jallon en 1896, firmó un acuerdo con ellos el 10 de febrero de 1897 que hizo que sus dominios fueran efectivamente independientes del imamato. Las relaciones se deterioraron cuando los franceses cedieron parte de Labé a la Guinea Portuguesa en 1904; lo arrestaron en 1905 y lo deportaron a Dahomey, lo liberaron en 1910, lo arrestaron de nuevo en 1911 y lo deportaron a Port-Étienne, donde murió en 1912 — el 10 de agosto según el artículo en inglés, el 10 de octubre según el artículo en francés y Wikidata. Sus restos fueron repatriados a Guinea en 1968 y enterrados en el Mausoleo de Camayenne, junto a la Gran Mezquita de Conakry. El himno nacional de Guinea está adaptado de una canción compuesta en su honor alrededor de 1903."
  fr: "Alpha Yaya Diallo (1830-1912), souverain du Labé, l'une des neuf provinces de l'imamat islamique du Fouta-Djalon, dans l'actuelle Guinée, et fils de son souverain Alfa Ibrahima Diallo, accéda au pouvoir au moment de l'avancée française à l'intérieur des terres guinéennes. Il conclut alors un accord avec les Français; après la défaite du Fouta-Djalon en 1896, il signa un traité le 10 février 1897 qui rendait ses territoires de facto indépendants de l'imamat. Les relations se détériorèrent lorsque les Français cédèrent une partie du Labé à la Guinée portugaise en 1904; ils l'arrêtèrent en 1905 et le déportèrent au Dahomey, le libérèrent en 1910, l'arrêtèrent de nouveau en 1911 et le déportèrent à Port-Étienne, où il mourut en 1912 (le 10 août selon l'article anglais, le 10 octobre selon l'article français et Wikidata). Sa dépouille a été rapatriée en Guinée en 1968 et inhumée au mausolée de Camayenne, à côté de la Grande Mosquée de Conakry, et l'hymne national de la Guinée est adapté d'une chanson composée en son honneur vers 1903."
  tr: "Alpha Yaya Diallo (1830–1912), günümüz Gine'deki Fota Galloon İslam İmamı'nın dokuz eyaletinden biri olan Labey valisi ve hükümdarı Alpha İbrahim Diallo'nun oğlu. Fransızlar Gine içinde ilerledikçe yükseldi ve onlarla anlaşmaya vardı. 1896'da Fota Gallon'un yenilgisinden sonra, 10 Şubat 1897'de topraklarını İmamatlıktan fiilen bağımsız hale getiren bir anlaşma imzaladı. Onlarla ilişkisi, 1904'te Labi'nin bir kısmını Portekiz Ginesi'ne devretmeleri, 1905'te tutuklamaları, Dahomey'e sürgün etmeleri, 1910'da serbest bırakılması, 1911'de tekrar tutuklanması ve Port Étienne'e sürgün edilmesiyle bozuldu; burada 1912'de öldü—10 Ağustos'ta İngilizce makalede, 10 Ekim'de Fransızca ve Wikidata'da—ve naaşı 1968'de Gine'ye geri getirildi; burada Conakry'deki Büyük Camii'nin yanındaki Kamayan türbesine defnedildi; Gine'nin milli marşı, 1903 civarında ona övgü için bestelenen bir şarkıdan alınmıştır."
  id: "Alpha Yaya Diallo (1830–1912), gubernur Labey, salah satu dari sembilan provinsi Imamat Islam Fota Galloon di Guinea saat ini, dan putra penguasanya Alpha Ibrahim Diallo. Ia bangkit saat Prancis maju ke dalam Guinea dan mencapai kesepakatan dengan mereka. Setelah kekalahan Fota Gallon pada 1896, ia menandatangani perjanjian pada 10 Februari 1897, yang membuat wilayahnya secara efektif merdeka dari Imamat. Hubungannya dengan mereka memburuk ketika, pada tahun 1904, mereka menyerahkan sebagian wilayah Labi kepada Guinea Portugis, menangkapnya pada tahun 1905, mengasingkannya ke Dahomey, dibebaskan pada tahun 1910, ditangkap lagi pada tahun 1911, dan dideportasi ke Port Étienne, di mana ia meninggal pada tahun 1912—pada 10 Agustus di artikel bahasa Inggris, pada 10 Oktober di French dan Wikidata—dan jenazahnya dikembalikan ke Guinea pada tahun 1968, di mana ia dimakamkan di mausoleum Kamayan di sebelah Masjid Besar di Conakry; lagu kebangsaan Guinea diambil dari sebuah lagu yang diciptakan untuk memujinya sekitar tahun 1903."
