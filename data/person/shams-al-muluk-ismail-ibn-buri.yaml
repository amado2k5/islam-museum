summary:
  ar: "شمس الملوك أبو الفتح إسماعيل بن تاج الملوك بوري بن طغتكين؛ ولي دمشق بعد أبيه وكان وافر الحرمة موصوفاً بالشجاعة كثير الإغارة على الفرنج أخذ منهم عدة حصون، وحاصر أخاه ببعلبك مدة، لكنه كان ظالماً مصادراً جباراً فدبّرت أمه زمرة دخاتون قتلوه بقلعة دمشق في ربيع الأول سنة تسع وعشرين وخمسمائة وكانت دولته نحو ثلاث سنين، وترتب بعده في الملك أخوه محمود وصار أتابكه معين الدين أنر {cite:shadharat-dhahab p. 570-571}."
  en: "Shams al-Muluk Abu al-Fath Ismail ibn Taj al-Muluk Buri ibn Tughtigin; ruled Damascus after his father — majestic, brave, a constant raider who took several fortresses from the Franks, though he besieged his own brother at Baalbek; a tyrant and expropriator, so his mother Zumurrud Khatun arranged for court ladies to kill him in Damascus's citadel in Rabi' I 529 after about three years' rule; succeeded by his brother Mahmud under the atabeg Mu'in al-Din Unur {cite:shadharat-dhahab p. 570-571}."
  es: "Shams al-Muluk Abu al-Fath Ismail ibn Taj al-Muluk Buri ibn Tughtigin; gobernó Damasco después de su padre: majestuoso, valiente, un asaltante constante que tomó varias fortalezas de los francos, aunque asedió a su propio hermano en Baalbek; un tirano y expropiador, por lo que su madre Zumurrud Khatun dispuso que damas de la corte lo mataran en la ciudadela de Damasco en Rabi' I 529 después de unos tres años de gobierno; sucedido por su hermano Mahmud bajo el atabeg Mu'in al-Din Unur {cite:shadharat-dhahab p. 570-571}."
  fr: "Shams al-Muluk Abu al-Fath Ismail ibn Taj al-Muluk Buri ibn Tughtigin; gouverna Damas après son père — majestueux, courageux, un pillard constant qui prit plusieurs forteresses aux Francs, bien qu'il ait assiégé son propre frère à Baalbek; un tyran et un expropriateur, si bien que sa mère Zumurrud Khatun fit en sorte que des dames de la cour le tuent dans la citadelle de Damas en Rabi' I 529 après environ trois ans de règne; succédé par son frère Mahmud sous l'atabeg Mu'in al-Din Unur {cite:shadharat-dhahab p. 570-571}."
  ur: "شمس الملوک ابو الفتح اسماعیل بن تاج الملوک بری ابن تغتگین۔ اپنے والد کے بعد دمشق پر حکومت کی - شاندار، بہادر، ایک مستقل حملہ آور جس نے فرینکوں سے کئی قلعے چھین لیے، حالانکہ اس نے بعلبیک میں اپنے ہی بھائی کا محاصرہ کر لیا تھا۔ ایک ظالم اور غاصب، اس لیے اس کی ماں زمرود خاتون نے تقریباً تین سال کی حکمرانی کے بعد ربیع اول 529 میں دمشق کے قلعہ میں اسے قتل کرنے کے لیے درباری خواتین کا بندوبست کیا۔ اس کے بھائی محمود نے عتاب معین الدین اونور کے ماتحت جانشین بنایا۔ 570-571}۔"
  tr: "Şems el-Mülük Ebu el-Feth İsmail bin Tac el-Mülük Buri ibn Tughtekin; babasından sonra Şam valisiydi. Çok saygı gören ve cesur olarak tanımlanan Ebu el-Feth Franklara sık sık baskın düzenledi, onlardan birkaç kale aldı ve bir süre Baalbek'teki kardeşini kuşattı. Ancak baskıcı ve güçlü bir el koyucuydu. Annesi, 529 Hicri yılında Rabi'al-Awwal'daki Şam Kalesi'nde onu öldüren bir grup Daktunlu düzenledi. Yönetimi yaklaşık üç yıl sürdü. Ondan sonra kardeşi Mahmud tahta geçti ve Atabeg Mu'in al-Din Anr oldu {atıf: shadharat-dhahab, s. 570-571}."
  id: "Shams al-Muluk Abu al-Fath Ismail ibn Taj al-Muluk Buri ibn Tughtekin; ia adalah gubernur Damaskus setelah ayahnya. Ia sangat dihormati dan digambarkan sebagai pemberani, sering menyerang bangsa Franka, merebut beberapa benteng dari mereka, dan mengepung saudaranya di Baalbek untuk sementara waktu. Namun, ia menindas dan menjadi penyita yang tangguh. Ibunya mengatur sekelompok Dakhtun yang membunuhnya di Benteng Damaskus di Rabi' al-Awwal pada tahun 529 H. Pemerintahannya berlangsung sekitar tiga tahun. Setelah itu, saudaranya Mahmoud menggantikannya di tahta dan menjadi Atabeg Mu'in al-Din Anr {cite:shadharat-dhahab, hlm. 570-571}."
