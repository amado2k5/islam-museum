summary:
  ar: "شمس الملوك أبو الفتح إسماعيل بن تاج الملوك بوري بن طغتكين؛ ولي دمشق بعد أبيه وكان وافر الحرمة موصوفاً بالشجاعة كثير الإغارة على الفرنج أخذ منهم عدة حصون، وحاصر أخاه ببعلبك مدة، لكنه كان ظالماً مصادراً جباراً فدبّرت أمه زمرة دخاتون قتلوه بقلعة دمشق في ربيع الأول سنة تسع وعشرين وخمسمائة وكانت دولته نحو ثلاث سنين، وترتب بعده في الملك أخوه محمود وصار أتابكه معين الدين أنر {cite:shadharat-dhahab p. 570-571}."
  en: "Shams al-Muluk Abu al-Fath Ismail ibn Taj al-Muluk Buri ibn Tughtigin; ruled Damascus after his father — majestic, brave, a constant raider who took several fortresses from the Franks, though he besieged his own brother at Baalbek; a tyrant and expropriator, so his mother Zumurrud Khatun arranged for court ladies to kill him in Damascus's citadel in Rabi' I 529 after about three years' rule; succeeded by his brother Mahmud under the atabeg Mu'in al-Din Unur {cite:shadharat-dhahab p. 570-571}."
