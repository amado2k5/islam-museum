summary:
  ar: "صاحب الصبيبة وبانياس؛ تملك سنة إحدى وثلاثين بعد أخيه الملك الظاهر إلى سنة بضع وأربعين فأخذ الصبيبة منه الملك الصالح وأعطاه إمرة مصر؛ فلما قتل المعظم ابن الصالح ساق إلى غزة وأخذ ما فيها وأخذ الصبيبة فتسلمها، فلما تملك الملك الناصر دمشق قبض عليه وسجنه بالبيرة، فلما أخذ هلاكو البيرة أحضره إليه بقيوده فأطلقه وخلع عليه وسلم إليه الصبيبة وبقي في خدمة كتبغا بدمشق، وكان بطلاً شجاعاً قاتل يوم عين جالوت فلما انهزمت التتار جيء به إلى الملك المظفر فضرب عنقه {cite:shadharat-dhahab p. 300}."
  en: "Lord of al-Subayba and Banias (r. 631–640s) — stripped by al-Salih, jailed at al-Bira by al-Nasir, freed in his chains by Hulagu and restored to Subayba in Kitbugha's service; he fought at Ayn Jalut on the Tatar side and al-Muzaffar Qutuz struck off his head {cite:shadharat-dhahab p. 300}."
  es: "Señor de al-Subayba y Banias (r. 631–640s) — despojado por al-Salih, encarcelado en al-Bira por al-Nasir, liberado encadenado por Hulagu y restituido a Subayba al servicio de Kitbugha; luchó en Ayn Jalut del lado tártaro y al-Muzaffar Qutuz le cortó la cabeza {cite:shadharat-dhahab p. 300}."
  fr: "Seigneur d'al-Subayba et de Banias (r. 631-640) — dépouillé par al-Salih, emprisonné à al-Bira par al-Nasir, libéré de ses chaînes par Hulagu et rétabli dans ses fonctions à Subayba au service de Kitbugha; il a combattu à Ayn Jalut du côté tatar et al-Muzaffar Qutuz lui a tranché la tête {cite:shadharat-dhahab p. 300}."
  ur: "الصبیبہ اور بنیاس کا رب (r. 631-640s) - الصالح کے ہاتھوں چھین لیا گیا، البیرا میں النصیر نے جیل میں ڈال دیا، ہلاگو کے ذریعہ اس کی زنجیروں میں جکڑا گیا اور کتبغہ کی خدمت میں سبیبہ کو بحال کیا گیا۔ اس نے تاتاریوں کی طرف سے عین جالوت میں جنگ کی اور المظفر قطوز نے اس کا سر مارا۔ 300}۔"
