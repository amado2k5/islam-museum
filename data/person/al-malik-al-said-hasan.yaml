summary:
  ar: "صاحب الصبيبة وبانياس؛ تملك سنة إحدى وثلاثين بعد أخيه الملك الظاهر إلى سنة بضع وأربعين فأخذ الصبيبة منه الملك الصالح وأعطاه إمرة مصر؛ فلما قتل المعظم ابن الصالح ساق إلى غزة وأخذ ما فيها وأخذ الصبيبة فتسلمها، فلما تملك الملك الناصر دمشق قبض عليه وسجنه بالبيرة، فلما أخذ هلاكو البيرة أحضره إليه بقيوده فأطلقه وخلع عليه وسلم إليه الصبيبة وبقي في خدمة كتبغا بدمشق، وكان بطلاً شجاعاً قاتل يوم عين جالوت فلما انهزمت التتار جيء به إلى الملك المظفر فضرب عنقه {cite:shadharat-dhahab p. 300}."
  en: "Lord of al-Subayba and Banias (r. 631–640s) — stripped by al-Salih, jailed at al-Bira by al-Nasir, freed in his chains by Hulagu and restored to Subayba in Kitbugha's service; he fought at Ayn Jalut on the Tatar side and al-Muzaffar Qutuz struck off his head {cite:shadharat-dhahab p. 300}."
