summary:
  ar: "سياسي أفغاني وعالم إنسان واقتصادي، رئيس أفغانستان من 29 سبتمبر 2014 حتى 15 أغسطس 2021 حين غادر البلاد مع سيطرة طالبان على كابل. كان كبير علماء الإنسان في البنك الدولي، وشغل وزارة المالية (2002–2004) ورئاسة جامعة كابل (2004–2008)، وشارك في تأليف كتاب «إصلاح الدول الفاشلة» (2008). انتهت رئاسته وسط انتقادات بأنه تخلى عن البلاد، وتسجل المقالة الإنجليزية اتهامه بالفساد أثناء إدارته؛ وقال إنه غادر حقناً للدماء."
  en: "Afghan politician, anthropologist and economist, president of Afghanistan from 29 September 2014 until 15 August 2021, when he left the country as the Taliban took Kabul. Formerly the World Bank's lead anthropologist, he served as finance minister (2002–2004) and chancellor of Kabul University (2004–2008), and co-authored Fixing Failed States (2008). His presidency ended amid criticism that he had abandoned the country; the English article records that he was accused of corruption during his administration, and that he said he left to avoid bloodshed."
  ur: "افغان سیاست دان، ماہر انسانیات اور ماہر معاشیات، 29 ستمبر 2014ء سے 15 اگست 2021ء تک افغانستان کے صدر، جب طالبان کے کابل پر قبضے پر وہ ملک چھوڑ گئے۔ عالمی بنک کے سرکردہ ماہر انسانیات رہنے کے بعد وہ وزیر خزانہ (2002ء–2004ء) اور جامعہ کابل کے چانسلر (2004ء–2008ء) رہے اور «ناکام ریاستوں کی اصلاح» (2008ء) کے شریک مصنف ہیں۔ ان کی صدارت اس تنقید کے درمیان ختم ہوئی کہ انھوں نے ملک چھوڑ دیا، اور انگریزی مضمون درج کرتا ہے کہ ان کے دور حکومت میں ان پر بدعنوانی کا الزام لگا؛ ان کا کہنا تھا کہ وہ خون خرابہ روکنے کے لیے گئے۔"
