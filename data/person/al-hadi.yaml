summary:
  ar: "بطاقة أولية لموسى الهادي، رابع خلفاء بني العباس، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الخلفاء والكامل لابن الأثير على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Musa al-Hadi, fourth Abbasid caliph, named from an open reference description (Wikidata); his entries in Tarikh al-Khulafa and Ibn al-Athir's al-Kamil are not yet checked on the page, so no dates are given."
  fr: "Notice provisoire de Musa al-Hadi, quatrième calife abbasside, nommé d’après une description dans une référence ouverte (Wikidata) ; ses notices dans Tarikh al-Khulafa et al-Kamil d’Ibn al-Athir n’ont pas encore été vérifiées sur la page, aussi aucune date n’est-elle donnée."
  es: "Ficha preliminar de Musa al-Hadi, cuarto califa abasí, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); sus entradas en Tarikh al-Khulafa y al-Kamil de Ibn al-Athir aún no se han verificado en la página, por lo que no se proporcionan fechas."
  ur: "موسیٰ الہادی، چوتھے عباسی خلیفہ کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ کی تفصیل سے ⁦(وکی ڈیٹا)⁩؛ تاریخ الخلفاء اور ابن اثیر کے الکامل میں ان کے اندراجات ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Dördüncü Abbasi halifesi Musa el-Hadi'nin ön profili açık bir kaynakta (Wikidata) yer almaktadır. Halifeler Tarihi ve İbn el-Athir'in El-Kamil adlı eserindeki biyografisi bu sayfada henüz incelenmediğinden, burada tarih verilmemiştir."
  id: "Profil awal Musa al-Hadi, khalifah Abbasiyah keempat, disertakan dalam referensi terbuka (Wikidata). Biografinya dalam Sejarah Para Khalifah dan Al-Kamil karya Ibn al-Athir belum ditinjau di halaman ini, oleh karena itu tidak ada tanggal yang diberikan di sini."
