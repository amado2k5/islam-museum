label: { ar: "مهذب الدين الدخوار شيخ الطب", en: "Muhadhdhib al-Din al-Dakhwar, shaykh of medicine", fr: "Muhadhdhib al-Din al-Dakhwar, cheikh de médecine", es: "Muhadhdhib al-Din al-Dakhwar, shaykh of medicine" }
summary:
  ar: "المهذب الدخوار عبد الرحيم بن علي بن حامد الدمشقي شيخ الطب وواقف المدرسة التي بالصاغة العتيقة على الأطباء؛ ولد سنة خمس وستين وخمسمائة وأخذ عن الموفق بن المطران والرضي الرحبي وأخذ الأدب عن الكندي وانتهت إليه معرفة الطب وصنف التصانيف فيه وحظي عند الملوك؛ وكان دخله في الشهر مائة وخمسون ديناراً وله أقطاع تعدل ستة آلاف وخمسمائة دينار؛ ولما تجاوز سن الكهولة عرض له طرف خرس حتى بقي لا يكاد يفهم كلامه واجتهد في علاج نفسه فما أفاد بل ولد له أمراضاً، وكان الجماعة يبحثون بين يديه فيكتب لهم ما أشكل عليهم في اللوح، واستعمل المعاجين الحادة فعرضت له حمى قوية أضعفت قوته وزادت إلى أن سالت عينه؛ توفي سنة ثمان وعشرين وستمائة {cite:shadharat-dhahab p. 127-128}."
  en: "al-Muhadhdhib al-Dakhwar — Damascus's shaykh of medicine, pupil of Ibn al-Matran and al-Radi al-Rahbi, who endowed the physicians' madrasa at the old goldsmiths' quarter; his income ran to 150 dinars a month plus an iqta' worth 6,500. Late in life an aphonia struck until his speech could scarce be understood — he wrote his answers on a tablet — and his harsh self-treatment brought fevers that drained him till his eye ran and he died, in 628 {cite:shadharat-dhahab p. 127-128}."
  fr: "Al-Muhadhdhib al-Dakhwar — cheikh de médecine de Damas, élève d’Ibn al-Matran et d’al-Radi al-Rahbi, qui dota la madrasa des médecins dans l’ancien quartier des orfèvres ; ses revenus atteignaient 150 dinars par mois, plus un iqta’ de 6 500. Vers la fin de sa vie, une aphonie le frappa au point qu’on comprenait à peine ses paroles — il écrivait ses réponses sur une tablette —, et ses traitements vigoureux provoquèrent des fièvres qui l’épuisèrent jusqu’à ce que son œil coule et qu’il meure, en 628 H {cite:shadharat-dhahab p. 127-128}."
  es: "al-Muhadhdhib al-Dakhwar — shaykh de medicina de Damasco, discípulo de Ibn al-Matran y al-Radi al-Rahbi, quien dotó la madrasa de médicos en el antiguo barrio de los orfebres; sus ingresos ascendían a 150 dinares al mes más un iqta' por valor de 6.500. Al final de su vida, sufrió afonía hasta el punto de que su habla apenas se entendía —escribía sus respuestas en una tablilla— y su duro tratamiento le provocó fiebres que lo debilitaron hasta que le lagrimearon los ojos y murió en 628 {cite:shadharat-dhahab p. 127-128}."
