id: person/al-dakhwar
class: person
label: { ar: "مهذب الدين الدخوار شيخ الطب", en: "Muhadhdhib al-Din al-Dakhwar, shaykh of medicine", fr: "Muhadhdhib al-Din al-Dakhwar, cheikh de médecine", es: "Muhadhdhib al-Din al-Dakhwar, shaykh of medicine", ur: "محدث الدین الدخوار، طب کے شیخ" }
summary:
  ar: "المهذب الدخوار عبد الرحيم بن علي بن حامد الدمشقي شيخ الطب وواقف المدرسة التي بالصاغة العتيقة على الأطباء؛ ولد سنة خمس وستين وخمسمائة وأخذ عن الموفق بن المطران والرضي الرحبي وأخذ الأدب عن الكندي وانتهت إليه معرفة الطب وصنف التصانيف فيه وحظي عند الملوك؛ وكان دخله في الشهر مائة وخمسون ديناراً وله أقطاع تعدل ستة آلاف وخمسمائة دينار؛ ولما تجاوز سن الكهولة عرض له طرف خرس حتى بقي لا يكاد يفهم كلامه واجتهد في علاج نفسه فما أفاد بل ولد له أمراضاً، وكان الجماعة يبحثون بين يديه فيكتب لهم ما أشكل عليهم في اللوح، واستعمل المعاجين الحادة فعرضت له حمى قوية أضعفت قوته وزادت إلى أن سالت عينه؛ توفي سنة ثمان وعشرين وستمائة {cite:shadharat-dhahab p. 127-128}."
  en: "al-Muhadhdhib al-Dakhwar — Damascus's shaykh of medicine, pupil of Ibn al-Matran and al-Radi al-Rahbi, who endowed the physicians' madrasa at the old goldsmiths' quarter; his income ran to 150 dinars a month plus an iqta' worth 6,500. Late in life an aphonia struck until his speech could scarce be understood — he wrote his answers on a tablet — and his harsh self-treatment brought fevers that drained him till his eye ran and he died, in 628 {cite:shadharat-dhahab p. 127-128}."
  fr: "Al-Muhadhdhib al-Dakhwar — cheikh de médecine de Damas, élève d’Ibn al-Matran et d’al-Radi al-Rahbi, qui dota la madrasa des médecins dans l’ancien quartier des orfèvres ; ses revenus atteignaient 150 dinars par mois, plus un iqta’ de 6 500. Vers la fin de sa vie, une aphonie le frappa au point qu’on comprenait à peine ses paroles — il écrivait ses réponses sur une tablette —, et ses traitements vigoureux provoquèrent des fièvres qui l’épuisèrent jusqu’à ce que son œil coule et qu’il meure, en 628 H {cite:shadharat-dhahab p. 127-128}."
  es: "al-Muhadhdhib al-Dakhwar — shaykh de medicina de Damasco, discípulo de Ibn al-Matran y al-Radi al-Rahbi, quien dotó la madrasa de médicos en el antiguo barrio de los orfebres; sus ingresos ascendían a 150 dinares al mes más un iqta' por valor de 6.500. Al final de su vida, sufrió afonía hasta el punto de que su habla apenas se entendía —escribía sus respuestas en una tablilla— y su duro tratamiento le provocó fiebres que lo debilitaron hasta que le lagrimearon los ojos y murió en 628 {cite:shadharat-dhahab p. 127-128}."
  ur: "المحدث الدخوار — دمشق کے شیخ طب، ابن المطران کے شاگرد اور الرادی الرحبی، جنہوں نے پرانے سناروں کے کوارٹر میں طبیبوں کا مدرسہ عطا کیا؛ اس کی آمدنی ماہانہ 150 دینار اور 6,500 مالیت کا اقطاء تک پہنچ گئی۔ زندگی کے آخر میں ایک فونیا آیا یہاں تک کہ اس کی بات سمجھ میں نہیں آتی تھی - اس نے اپنے جوابات ایک گولی پر لکھے تھے - اور اس کے سخت خود علاج نے اسے بخار لایا جس سے اس کی آنکھ نکل گئی اور وہ مر گیا، 628 میں 127-128}۔"
  tr: "Zarif ve belagatli Abdülrahim ibn Ali ibn Hamid el-Dimaşki, tıp üstadı ve eski kuyumcular mahallesindeki hekimler okulunu vakfeden kişi; Hicri 565 yılında doğmuş, el-Muvaffak ibn el-Matran ve el-Radi el-Rahbi'nin yanında eğitim görmüş, el-Kindi'den edebiyat öğrenmiş ve tıp bilgisi onunla zirveye ulaşmış, bu konuda kitaplar yazmış ve kralların gözdesi olmuştur; aylık geliri yüz elli dinar, mal varlığı ise altı bin beş yüz dinar değerindedir. Orta yaşını geçtiğinde kısmi dilsizliğe yakalandı ve konuşmasını neredeyse hiç anlayamadı. Kendini tedavi etmek için çok çaba sarf etti, ancak fayda etmedi; aksine hastalıklara yakalandı. İnsanlar onun yanında kendi aralarında konuşur, anlamadıkları şeyleri tablete yazardı. Güçlü merhemler kullandığı için şiddetli bir ateşe yakalandı, bu ateş gücünü zayıflattı ve gözünden kan gelmesine kadar yükseldi. Hicri 628 yılında vefat etti. {Kaynak: Şadharat-dahab s. 127-128}"
  id: "Abd al-Rahim ibn Ali ibn Hamid al-Dimashqi yang berilmu dan fasih berbicara, seorang ahli kedokteran dan orang yang mewakafkan sekolah kedokteran di kawasan pengrajin emas kuno; beliau lahir pada tahun 565 H dan belajar di bawah bimbingan al-Muwaffaq ibn al-Matran dan al-Radi al-Rahbi, serta mempelajari sastra di bawah bimbingan al-Kindi, dan ilmu kedokteran mencapai puncaknya bersamanya, serta ia menulis buku-buku tentang kedokteran dan disukai oleh raja-raja; dan penghasilannya dalam sebulan adalah seratus lima puluh dinar, dan ia memiliki harta senilai enam ribu lima ratus dinar; Dan ketika ia melewati usia paruh baya, ia menderita bisu sebagian hingga hampir tidak dapat memahami ucapannya sendiri, dan ia berusaha keras mengobati dirinya sendiri tetapi itu tidak membantu, malah ia menderita berbagai penyakit, dan orang-orang akan berdiskusi di hadapannya, dan ia akan menuliskan apa yang tidak jelas bagi mereka di atas tablet, dan ia menggunakan salep yang kuat, sehingga ia menderita demam tinggi yang melemahkan kekuatannya dan meningkat hingga matanya berdarah; ia meninggal pada tahun 628 H {cite:shadharat-dhahab p. 127-128}."
