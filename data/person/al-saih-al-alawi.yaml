id: person/al-saih-al-alawi
class: person
label: { ar: "السائح العلوي", en: "Al Saih Al Alawi" }
summary:
  ar: "السائح العلوي أبو بكر علي بن محمد الخراساني العلوي الصوفي من ولد الحسن بن علي ممن صحت له صناعة الكيمياء على ما ذكر أهل هذا الشأن، وكان يتنقل في البلدان خوفا على نفسه من السلطان، وكتبه وصلت إلى ابن النديم من نواحي الجبال: كتاب رسالة اليتيم وكتاب الحجر الطاهر وكتاب الحقير النافع وكتاب الطاهر الخفي وكتاب الأصول وكتاب الشعر والدم والبيض وعمل مياهها {cite:fihrist-ibn-al-nadim p. 506}."
  en: "The wandering Alid alchemist of Khurasan who hid from the sultan {cite:fihrist-ibn-al-nadim}"
