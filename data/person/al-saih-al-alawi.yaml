id: person/al-saih-al-alawi
class: person
label: { ar: "السائح العلوي", en: "Al Saih Al Alawi", fr: "Al Saih Al Alawi", es: "Al Saih Al Alawi", ur: "السیح العلوی۔" }
summary:
  ar: "السائح العلوي أبو بكر علي بن محمد الخراساني العلوي الصوفي من ولد الحسن بن علي ممن صحت له صناعة الكيمياء على ما ذكر أهل هذا الشأن، وكان يتنقل في البلدان خوفا على نفسه من السلطان، وكتبه وصلت إلى ابن النديم من نواحي الجبال: كتاب رسالة اليتيم وكتاب الحجر الطاهر وكتاب الحقير النافع وكتاب الطاهر الخفي وكتاب الأصول وكتاب الشعر والدم والبيض وعمل مياهها {cite:fihrist-ibn-al-nadim p. 506}."
  en: "The wandering Alid alchemist of Khurasan who hid from the sultan {cite:fihrist-ibn-al-nadim}"
  fr: "L'alchimiste Alid errant du Khurasan qui s'est caché du sultan {cite:fihrist-ibn-al-nadim}"
  es: "El alquimista errante Alid de Jorasán que se escondió del sultán {cite:fihrist-ibn-al-nadim}"
  ur: "خراسان کا آوارہ الید کیمیا دان جو سلطان سے چھپا ہوا تھا"
  tr: "El-Hasan bin Ali'nin soyundan gelen Alevi gezgin Ebu Bekir Ali bin Muhammed el-Hurasani el-Alavi Sufi, bu alandaki kişilere göre simya alanında eğitim almıştır. Kendi güvenliği için çeşitli ülkelerden seyahat etmiş ve kitapları dağlardan İbn el-Nadim'e ulaşmıştır: 'Yetim Mesajı' kitabı, Saf Taş Kitabı, Alçakgönüllü ve Faydalı Kitap, Gizli Tahir Kitabı, İlkeler Kitabı, Şiir Kitabı, Kan, Yumurta ve Sularının Oluşumu {atı:Fihrist-ibn-al-Nadim s. 506}."
  id: "Pengelana Alawite Abu Bakr Ali ibn Muhammad al-Khurasani al-Alawi Sufi, keturunan al-Hasan ibn Ali, dididik dalam bidang alkimia menurut mereka yang berada di bidang ini. Ia melakukan perjalanan dari berbagai negeri karena takut akan keselamatannya sendiri, dan buku-bukunya sampai kepada Ibn al-Nadim dari pegunungan: buku 'Pesan Yatim Piatu,' Buku Batu Murni, Kitab Orang Rendah Hati dan Bermanfaat, Kitab Tahir Tersembunyi, Kitab Prinsip, Buku Puisi, Darah, Telur, dan Pembuatan Airnya {cite:fihrist-ibn-al-nadim hlm. 506}."
