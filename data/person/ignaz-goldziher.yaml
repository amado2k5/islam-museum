summary:
  ar: "مستشرق مجري يهودي الأصل. يصفه زقزوق بأنه زعيم علماء الإسلاميات في أوروبا بلا منازع، ويذكر أن كتبه ما زالت تحظى بالتقدير، ويعدّه ممن رأوا أن الشريعة الإسلامية مستمدة من القانون الروماني. دخل الميدان، بحسب الكتاب، بوصفه أوروبياً لا يهودياً. هذه أحكام من الكتاب، وتُنسب إليه."
  en: "Hungarian-born Jewish orientalist. Zaqzuq calls him the undisputed leader of Islamic studies in Europe, says his works are still esteemed, and names him among those who held that Islamic law derives from Roman law. The book says he entered the field as a European rather than as a Jew. These are the author's judgements, attributed to him."
