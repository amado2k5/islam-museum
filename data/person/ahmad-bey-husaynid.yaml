summary:
  ar: "أحمد باي، العاشر من أسرة الحسينيين في تونس، حكم من 1837م إلى 1855م. حاول تحديث الجيش وأنشأ مدرسة عسكرية ⁦(1838م)⁩، ولم تفلح المحاولات، ثم ألغى الرق سنة 1846م، وفتح باب التعليم والإرساليات، وأنفق بإسراف على قصر محمدية الذي بقي ناقصًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 303}."
  en: "Ahmad Bey, tenth ruler of the Husaynid dynasty of Tunis (1837–1855). He tried to modernise the army and founded a polytechnic in 1838, but its officers could not discipline the troops. He formally abolished slavery in the Regency in 1846, and his extravagance, including the unfinished Muhammadiyya palace, drained the treasury {cite:encyclopaedia-of-islam-2 vol. 1 p. 303}."
  fr: "Ahmad Bey, dixième souverain husseinite de Tunis (1837–1855), tenta de moderniser l'armée et fonda une école polytechnique en 1838, mais ses officiers ne purent discipliner les troupes. Il abolit officiellement l'esclavage dans la Régence en 1846 ; son extravagance, dont le palais inachevé de la Muhammadiyya, épuisa le trésor {cite:encyclopaedia-of-islam-2 vol. 1 p. 303}."
  es: "Ahmad Bey, décimo gobernante de la dinastía Husaynid de Túnez (1837-1855). Intentó modernizar el ejército y fundó un politécnico en 1838, pero sus oficiales no lograron disciplinar a las tropas. Abolió formalmente la esclavitud durante la Regencia en 1846, y su extravagancia, incluyendo el inacabado palacio Muhammadiyya, agotó las arcas del Estado {cite:encyclopaedia-of-islam-2 vol. 1 p. 303}."
  ur: "احمد بے، تیونس کے حسینی خاندان کے دسویں حکمران (1837–1855)۔ اس نے فوج کو جدید بنانے کی کوشش کی اور 1838 میں ایک پولی ٹیکنک کی بنیاد رکھی، لیکن اس کے افسران فوجیوں کو نظم و ضبط نہ بنا سکے۔ اس نے 1846 میں ریجنسی میں غلامی کو باضابطہ طور پر ختم کر دیا، اور نامکمل محمدیہ محل سمیت اس کی اسراف نے خزانے کو خالی کر دیا۔ 1 ص۔ 303}۔"
  tr: "Tunus'taki Hüseyini hanedanlığının onuncu hükümdarı Ahmed Bey, 1837'den 1855'e kadar hüküm sürdü. Orduyu modernize etmeye çalıştı ve bir askeri okul kurdu (1838), ancak bu girişimler başarısız oldu. Daha sonra 1846'da köleliği kaldırdı, eğitime ve misyonlara kapı açtı ve tamamlanmamış kalan Muhammediye Sarayı'na büyük harcamalar yaptı."
  id: "Ahmad Bey, penguasa kesepuluh dinasti Husaynid di Tunisia, memerintah dari tahun 1837 hingga 1855. Ia mencoba memodernisasi angkatan bersenjata dan mendirikan sekolah militer (1838), tetapi upaya tersebut tidak berhasil. Kemudian ia menghapuskan perbudakan pada tahun 1846, membuka pintu bagi pendidikan dan misi, serta menghabiskan banyak uang untuk Istana Muhammadia, yang hingga kini belum selesai."
