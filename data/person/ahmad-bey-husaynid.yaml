summary:
  ar: "أحمد باي، العاشر من أسرة الحسينيين في تونس، حكم من 1837م إلى 1855م. حاول تحديث الجيش وأنشأ مدرسة عسكرية (1838م)، ولم تفلح المحاولات، ثم ألغى الرق سنة 1846م، وفتح باب التعليم والإرساليات، وأنفق بإسراف على قصر محمدية الذي بقي ناقصًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 303}."
  en: "Ahmad Bey, tenth ruler of the Husaynid dynasty of Tunis (1837–1855). He tried to modernise the army and founded a polytechnic in 1838, but its officers could not discipline the troops. He formally abolished slavery in the Regency in 1846, and his extravagance, including the unfinished Muhammadiyya palace, drained the treasury {cite:encyclopaedia-of-islam-2 vol. 1 p. 303}."
