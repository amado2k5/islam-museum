summary:
  ar: "مدرّس ونائب وناشط ديمقراطي ألباني من ليبوهوفا، اغتال أسعد باشا توبتاني في باريس سنة 1920، وأسّس جمعيتي «أتدهيو» و«باشكيمي»، واغتيل هو نفسه في تيرانا سنة 1924."
