  id: "Kartu pendahuluan untuk Al-Harith bin Rabi’ Abu Qatada Al-Ansari, ksatria Madinah dan ulama haditsnya, salah satu orang yang berperang di Badr, yang meninggal pada tahun 656 M; ia disebutkan dalam buku-buku biografi dan biografinya belum ditinjau di halaman ini."
