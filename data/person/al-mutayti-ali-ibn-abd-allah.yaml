label:
  ar: المتيطي (علي بن عبد الله)
  en: Al-Mutayti, Ali ibn Abd Allah, Maliki notary-jurist and judge
  ur: متیطی (علی بن عبداللہ)
summary:
  ar: 'علي بن عبد الله بن إبراهيم بن محمد، أبو الحسن، الأنصاري المالكي المتيطي، نسبة
    إلى متيطة قرية بأحواز الجزيرة الخضراء، فقيه، قاض، ولي قضاء شريش، توفي سنة 570ه
    بحسب ما ذكر المدخل. من تصانيفه: النهاية والتمام في معرفة الوثائق والأحكام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7523} '
  en: 'Ali ibn Abd Allah ibn Ibrahim ibn Muhammad, Abu al-Hasan, al-Ansari al-Maliki
    al-Mutayti, from the village of Mutayta near al-Jazira al-Khadra; a jurist and
    judge who held the judgeship of Shari''sh; the entry gives his death as 570 AH.
    His work is al-Nihaya wa-l-Tamam on documents and judgements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7523} '
  ur: 'علی بن عبداللہ بن ابراہیم بن محمد، ابوالحسن انصاری مالکی متیطی، جزیرہ خضراء
    کے نواح کی بستی متیطہ کی نسبت سے؛ فقیہ اور قاضی جو شریش کے قضاء پر فائز رہے؛ مدخل
    کے مطابق وفات 570ھ ہے، اور ان کی تصنیف «النہایۃ والتمام فی معرفۃ الوثائق والاحکام»
    ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7523} '
