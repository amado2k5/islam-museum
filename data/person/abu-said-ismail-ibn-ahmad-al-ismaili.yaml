summary:
  ar: "أبو سعد إسماعيل بن أحمد الإسماعيلي، فقيه أديب جواد، جمع بين رياسة الدين والدنيا بجرجان، وأخذ العلم عن أبيه أبي بكر الإسماعيلي، ومات سنة ست وتسعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 63}. ذكر الصاحب بن عباد في رسالة مدحه ومدح أخيه أبي نصر وأبيهما {cite:tabaqat-fuqaha-abbas-1981 p. 63}."
  en: "Abu Sa'd Isma'il ibn Ahmad al-Isma'ili, a jurist, man of letters and generous; in Jurjan he combined religious leadership with worldly authority. He took knowledge from his father Abu Bakr al-Isma'ili and died in 396 AH {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Sahib ibn Abbad mentioned him in an epistle praising him, his brother Abu Nasr and their father {cite:tabaqat-fuqaha-abbas-1981 p. 63}."
