summary:
  ar: "أبو سعد إسماعيل بن أحمد الإسماعيلي، فقيه أديب جواد، جمع بين رياسة الدين والدنيا بجرجان، وأخذ العلم عن أبيه أبي بكر الإسماعيلي، ومات سنة ست وتسعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 63}. ذكر الصاحب بن عباد في رسالة مدحه ومدح أخيه أبي نصر وأبيهما {cite:tabaqat-fuqaha-abbas-1981 p. 63}."
  en: "Abu Sa'd Isma'il ibn Ahmad al-Isma'ili, a jurist, man of letters and generous; in Jurjan he combined religious leadership with worldly authority. He took knowledge from his father Abu Bakr al-Isma'ili and died in 396 AH {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Sahib ibn Abbad mentioned him in an epistle praising him, his brother Abu Nasr and their father {cite:tabaqat-fuqaha-abbas-1981 p. 63}."
  fr: "Abu Sa'd Isma'il ibn Ahmad al-Isma'ili, juriste et homme de lettres généreux ; à Jurjan, il réunissait autorité religieuse et temporelle. Il étudia auprès de son père Abu Bakr al-Isma'ili et mourut en 396 H {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Sahib ibn Abbad le mentionna dans une épître faisant son éloge, celui de son frère Abu Nasr et celui de leur père {cite:tabaqat-fuqaha-abbas-1981 p. 63}."
  es: "Abu Sa'd Isma'il ibn Ahmad al-Isma'ili, jurista, hombre de letras y generoso, combinó el liderazgo religioso con la autoridad mundana en Jurjan. Recibió sus conocimientos de su padre, Abu Bakr al-Isma'ili, y falleció en el año 396 de la Hégira (cita: tabaqat-fuqaha-abbas-1981, p. 63). Al-Sahib ibn Abbad lo mencionó en una epístola en la que lo elogiaba a él, a su hermano Abu Nasr y a su padre (cita: tabaqat-fuqaha-abbas-1981, p. 63)."
  ur: "ابو سعد اسماعیل بن احمد الاسماعیلی، ایک فقیہ، خطیب اور سخی آدمی؛ جرجان میں اس نے مذہبی قیادت کو دنیاوی اختیار کے ساتھ جوڑ دیا۔ انہوں نے اپنے والد ابو بکر الاسماعیلی سے علم حاصل کیا اور 396ھ میں وفات پائی۔ 63}۔ الصاحب ابن عباد نے ایک خط میں ان کا تذکرہ ان کے بھائی ابو نصر اور ان کے والد کی تعریف کرتے ہوئے کیا ہے۔ 63}۔"
  tr: "Hukukçu, bilgin ve cömert bir insan olan Ebu Sa'd İsmail ibn Ahmed el-İsmaili, Cürcan'da dini ve dünyevi liderliği birleştirdi. İlimini babası Ebu Bekir el-İsmaili'den aldı ve Hicri 396 yılında vefat etti. {Kaynak: tabaqat-fuqaha-abbas-1981 s. 63}. Sahib ibn Abbad, onu, kardeşi Ebu Nasr'ı ve babalarını öven bir mektubunda ondan bahsetmiştir. {Kaynak: tabaqat-fuqaha-abbas-1981 s. 63}"
  id: "Abu Sa'd Isma'il ibn Ahmad al-Isma'ili, seorang ahli hukum, sastrawan, dan dermawan, menggabungkan kepemimpinan agama dan duniawi di Jurjan. Ia memperoleh ilmu dari ayahnya, Abu Bakr al-Isma'ili, dan wafat pada tahun 396 H {cite:tabaqat-fuqaha-abbas-1981 p. 63}. Al-Sahib ibn Abbad menyebutkannya dalam sebuah surat yang memujinya, saudaranya Abu Nasr, dan ayah mereka {cite:tabaqat-fuqaha-abbas-1981 p. 63}."
