  fr: "Ahmad al-Maymuni, l'un des dévots de Syrie, frère juré d'Ahmad al-Mawsili ; il lui transmit un récit d'Abu al-Aliya sur la demeure de félicité et son compagnon s'évanouit."
  ur: "احمد میمونی شام کے عابدوں میں سے تھے، احمد موصلی کے بھائی تھے۔ انہوں نے ابو العالیہ سے دار النعیم کے بارے میں ایک خبر سنائی تو ان کے ساتھی پر غشی طاری ہو گئی۔"
  es: "Ahmad al-Maymuni, uno de los fieles de Siria, que era hermano jurado de Ahmad al-Mawsili, le relató un informe de Abu al-Aliya sobre la morada de la dicha, y su compañero se desmayó."
