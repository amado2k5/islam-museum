summary:
  ar: "علان الشعوبي، راوية نسابة فارسي الأصل، كان ينسخ في بيت الحكمة للرشيد والمأمون والبرامكة على ما ذكر ابن النديم."
  en: "Allan al-Shu'ubi, a Persian-descended traditionist and genealogist, who copied in the House of Wisdom for al-Rashid, al-Ma'mun and the Barmakids, as Ibn al-Nadim records."
  es: "Allan al-Shu'ubi, un tradicionalista y genealogista de ascendencia persa, copió en la Casa de la Sabiduría para al-Rashid, al-Ma'mun y los Barmakids, como relata Ibn al-Nadim."
  fr: "Allan al-Shu'ubi, un traditionaliste et généalogiste d'origine perse, qui a copié à la Maison de la Sagesse pour al-Rashid, al-Ma'mun et les Barmakids, comme le rapporte Ibn al-Nadim."
  ur: "ایلن الشوبی، فارسی نژاد روایت دان اور نسب دان، جس نے الرشید، المامون اور برمکیوں کے لیے ہاؤس آف وزڈم میں نقل کیا، جیسا کہ ابن الندیم ریکارڈ کرتے ہیں۔"
