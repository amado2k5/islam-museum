summary:
  ar: "السيد عثمان المروندي، المعروف بلعل شهباز قلندر ⁦(1177 – 19 فبراير 1274)⁩، صوفي وشاعر وُلد في مروند وجال في البلاد ثم استقر في سيهون بالسند، ويُعد ضريحه فيها من أشهر مزارات الصوفية؛ وُصف بأنه من أتباع السهروردية وأنه قلندر جوّال."
  en: "Sayyid Uthman al-Marwandi, known as Lal Shahbaz Qalandar (1177 - 19 February 1274), was a Sufi saint and poet born in Marwand who travelled widely before settling at Sehwan in Sindh, where his shrine is among the most visited in Sufism; he is described as a follower of the Suhrawardi order and as a wandering Qalandar."
  ur: "سید عثمان مروندی، معروف لعل شہباز قلندر (1177ء – 19 فروری 1274ء) صوفی بزرگ اور شاعر تھے جو مروند میں پیدا ہوئے، سیاحت کے بعد سیہون، سندھ میں مقیم ہوئے، جہاں ان کا مزار مشہور ہے؛ انہیں سہروردی سلسلے کا پیرو اور قلندر بتایا جاتا ہے۔"
