summary:
  ar: "محمد أمين بن عمر بن عبد العزيز عابدين، الدمشقي، فقيه الديار الشامية وإمام الحنفية في عصره، صاحب «رد المحتار على الدر المختار» المشهور بحاشية ابن عابدين. وذكر المدخل ابنه محمد علاء الدين ⁦(1244-1306 هـ)⁩، المعروف أيضاً بابن عابدين، صاحب «قرة عيون الأخيار» تكملة حاشية أبيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1603}"
  en: "Muhammad Amin ibn Umar ibn Abd al-Aziz Ibn Abidin of Damascus, the leading Hanafi of the Levant in his time, author of Radd al-muhtar 'ala al-Durr al-mukhtar, known as Hashiyat Ibn Abidin. The entry also names his son Muhammad 'Ala' al-Din (1244-1306 AH), author of Qurrat 'uyun al-akhyar, a supplement to the father's gloss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1603}"
