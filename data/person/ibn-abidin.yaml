summary:
  ar: "محمد أمين بن عمر بن عبد العزيز عابدين، الدمشقي، فقيه الديار الشامية وإمام الحنفية في عصره، صاحب «رد المحتار على الدر المختار» المشهور بحاشية ابن عابدين. وذكر المدخل ابنه محمد علاء الدين ⁦(1244-1306 هـ)⁩، المعروف أيضاً بابن عابدين، صاحب «قرة عيون الأخيار» تكملة حاشية أبيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1603}"
  en: "Muhammad Amin ibn Umar ibn Abd al-Aziz Ibn Abidin of Damascus, the leading Hanafi of the Levant in his time, author of Radd al-muhtar 'ala al-Durr al-mukhtar, known as Hashiyat Ibn Abidin. The entry also names his son Muhammad 'Ala' al-Din (1244-1306 AH), author of Qurrat 'uyun al-akhyar, a supplement to the father's gloss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1603}"
  es: "Muhammad Amin ibn Umar ibn Abd al-Aziz Ibn Abidin de Damasco, el principal Hanafi del Levante en su época, autor de Radd al-muhtar 'ala al-Durr al-mukhtar, conocido como Hashiyat Ibn Abidin. La entrada también nombra a su hijo Muhammad 'Ala' al-Din (1244-1306 AH), autor de Qurrat 'uyun al-akhyar, un suplemento a la glosa del padre. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1603}"
  fr: "Muhammad Amin ibn Umar ibn Abd al-Aziz Ibn Abidin de Damas, le principal Hanafi du Levant de son temps, auteur de Radd al-muhtar 'ala al-Durr al-mukhtar, connu sous le nom de Hashiyat Ibn Abidin. L'entrée nomme également son fils Muhammad 'Ala' al-Din (1244-1306 AH), auteur du Qurrat 'uyun al-akhyar, un supplément à la glose du père. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1603}"
  ur: "محمد امین بن عمر بن عبد العزیز ابن عابدین دمشق کے، اپنے وقت کے معروف حنفی، رد المحتار عالیہ الدر المختار کے مصنف، حشیات ابن عابدین کے نام سے مشہور ہیں۔ اندراج میں ان کے بیٹے محمد 'علا' الدین ⁦(1244-1306 ہجری)⁩ کا نام بھی لیا گیا ہے، جو کہ قرات 'ایون الاخیار' کے مصنف ہیں، جو والد کی چمک کا ایک ضمیمہ ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 1603}"
  tr: "Muhammed Amin ibn Ömer ibn Abdülaziz Abidin, el-Dimashqi, Levant topraklarının hukukçusu ve kendi döneminde Hanafi imamı, İbn Abidin'in kenar notlarıyla ünlü 'Radd al-Muhtar 'ala al-Durr al-Mukhtar' adlı eserin yazarıdır. Kayıtta, babasının kenar notlarını tamamlayan oğlu Muhammed Ala'ddin (1244-1306 H) adı geçen ve 'Kurrat Uyoon al-Akhyar'ın yazarı olarak da bilinen İbn Edindir' adı verilmiştir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1603}"
  id: "Muhammad Amin ibn Umar ibn Abd al-Aziz Abidin, al-Dimashqi, seorang ahli hukum dari tanah Levant dan imam Hanafi pada masanya, penulis 'Radd al-Muhtar 'ala al-Durr al-Mukhtar,' yang terkenal dengan catatan pinggir karya Ibn Abidin. Entri tersebut menyebutkan putranya Muhammad Ala' al-Din (1244-1306 H), juga dikenal sebagai Ibn Abidin, penulis 'Qurrat Uyoon al-Akhyar,' yang melengkapi catatan pinggir ayahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1603}"
