summary:
  ar: "خزيمة أبو محمد العابد، غلب عليه ترك الاختيار ولزوم العجز والافتقار، وحكى عنه أن نبيًّا مرّ برجل نبذه أهله من البلاء، فقال الرجل إنه لا يختار على الله."
  en: "Khuzayma Abu Muhammad al-Abid, whose states were marked by leaving off his own choice and by constant helplessness and need; a story is told of him in which a prophet passes a man abandoned by his family in affliction, and the man refuses to choose over God."
  ur: "خزیمہ ابو محمد عابد کی حالت یہ تھی کہ وہ اپنا اختیار چھوڑ دیتے اور عاجزی و محتاجی پر قائم رہتے۔ ان سے ایک حکایت ہے کہ ایک نبی ایک ایسے شخص کے پاس سے گزرے جسے گھر والوں نے آزمائش میں چھوڑ دیا تھا، تو اس نے اللہ کے مقابلے میں اختیار کرنے سے انکار کیا۔"
  es: "Khuzayma Abu Muhammad al-Abid, cuyos estados se caracterizaron por renunciar a su propia elección y por una constante impotencia y necesidad; se cuenta sobre él una historia en la que un profeta pasa junto a un hombre abandonado por su familia en medio de la aflicción, y el hombre se niega a elegir por encima de Dios."
  fr: "Khuzayma Abu Muhammad al-Abid, dont la vie fut marquée par le renoncement à ses propres choix et par une impuissance et un besoin constants; une histoire est racontée à son sujet dans laquelle un prophète croise un homme abandonné par sa famille dans l'affliction, et l'homme refuse de choisir autre chose que Dieu."
  tr: "Hozeymah Ebu Muhammed el-Abid, seçimi terk etmekle zayıflık ve yoksulluğa bağlı kalmakla boğuştu. Onun hakkında, bir peygamberin ailesi tarafından sıkıntıdan reddedilmiş bir adamın yanından geçtiği ve adamın Tanrı'yı tercih etmediğini söylediği rivayet edildi."
  id: "Khuzaymah Abu Muhammad al-'Abid kewalahan karena meninggalkan pilihan dan berpegang pada kelemahan serta kemiskinan. Ada cerita tentang dirinya bahwa seorang nabi melewati seorang pria yang telah ditolak oleh keluarganya karena penderitaan, dan pria itu berkata bahwa dia tidak memilih atas Tuhan."
