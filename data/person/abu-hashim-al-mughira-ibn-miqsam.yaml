summary:
  ar: "أبو هاشم المغيرة بن مقسم الضبي، مولى لبني ضبة، راوية إبراهيم النخعي {cite:tabaqat-fuqaha-abbas-1981 p. 44}. وتوفي سنة 133 أو بعدها، على ما في التهذيب، وقد يُطبع اسمه في بعض النسخ «أبو هشام» {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
  en: "Abu Hashim al-Mughira ibn Miqsam al-Dabbi, a client of the Banu Dabba and transmitter of Ibrahim al-Nakha'i {cite:tabaqat-fuqaha-abbas-1981 p. 44}. He died in 133 or later, according to al-Tahdhib; in some copies his name is printed as 'Abu Hisham' {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
  fr: "Abu Hashim al-Mughira ibn Miqsam al-Dabbi, client des Banu Dabba et transmetteur d'Ibrahim al-Nakha'i {cite:tabaqat-fuqaha-abbas-1981 p. 44}. Il mourut en 133 ou plus tard, selon al-Tahdhib ; dans certaines copies, son nom est imprimé « Abu Hisham » {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
  es: "Abu Hashim al-Mughira ibn Miqsam al-Dabbi, cliente de los Banu Dabba y transmisor de Ibrahim al-Nakha'i {cita:tabaqat-fuqaha-abbas-1981 p. 44}. Murió en 133 o más tarde, según al-Tahdhib; en algunas copias su nombre aparece impreso como 'Abu Hisham' {cita:tabaqat-fuqaha-abbas-1981 p. 44}."
  ur: "ابو ہاشم المغیرہ بن مقسم الدبی، بنو ڈبہ کا مؤکل اور ابراہیم النخعی کا نقل کرنے والا۔ 44}۔ التہذیب کے مطابق 133 یا اس کے بعد میں وفات پائی۔ بعض نسخوں میں ان کا نام 'ابو ہشام' کے نام سے چھاپا گیا ہے۔ 44}۔"
  tr: "Ebu Haşim el-Muğire ibn Muksim el-Dabbi, İbrahim el-Nekha'i'nin anlatıcılarından Banu Dabba'nın müşterisi {cite:tabaqat-fuqaha-abbas-1981 s. 44}. et-Tahzib'e göre 133 yılında veya daha sonra vefat etmiştir ve ismi bazı nüshalarda \"Ebu Hişam\" {cite:tabaqat-fuqaha-abbas-1981 s. 44}."
  id: "Abu Hashim al-Mughira ibn Muqsim al-Dabbi, klien Banu Dabba, narator Ibrahim al-Nakha'i {cite:tabaqat-fuqaha-abbas-1981 hal. 44}. Beliau wafat pada tahun 133 atau setelahnya, menurut apa yang ada dalam al-Tahdhib, dan namanya mungkin tercetak dalam beberapa salinan sebagai “Abu Hisyam” {cite:tabaqat-fuqaha-abbas-1981 hal. 44}."
