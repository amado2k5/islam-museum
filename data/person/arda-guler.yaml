summary:
  ar: "لاعب كرة قدم تركي محترف (وُلد سنة 2005 في ألتن داغ بأنقرة). وسط هجومي برز مع فنربخشة وفاز معه بكأس تركيا سنة 2023، ثم انضم إلى ريال مدريد وفاز في موسمه الأول بالدوري الإسباني ودوري أبطال أوروبا؛ وفي أمم أوروبا 2024 صار أول شاب يسجّل في أول ظهور له في البطولة منذ كريستيانو رونالدو."
  en: "Turkish professional footballer (born 2005 in Altındağ, Ankara). An attacking midfielder who broke through at Fenerbahçe, winning the Turkish Cup in 2023, then joined Real Madrid and won La Liga and the Champions League in his first season; at Euro 2024 he became the first teenager to score on his European Championship debut since Cristiano Ronaldo."
  ur: "ترک پیشہ ور فٹبالر (پیدائش 2005، التن داغ، انقرہ)۔ حملہ آور مڈفیلڈر جو فنربخشے سے ابھرے اور 2023 میں ترک کپ جیتا، پھر ریال میڈرڈ میں شامل ہو کر پہلے ہی سیزن میں لا لیگا اور چیمپیئنز لیگ جیتے؛ یورو 2024 میں وہ کرسٹیانو رونالڈو کے بعد یورپی چیمپیئن شپ میں اپنے ڈیبیو پر گول کرنے والے پہلے نوجوان بنے۔"
