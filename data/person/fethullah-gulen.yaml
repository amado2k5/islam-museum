summary:
  ar: "واعظ ومفكر ومربٍّ تركي ⁦(27 أبريل 1941 – 20 أكتوبر 2024)⁩، أبرز أعلام حركة «الخدمة» ⁦(Hizmet)⁩ المتأثرة بتراث سعيد النورسي، التي بنت شبكة عابرة للبلدان من المدارس والجمعيات الخيرية والإعلام امتدت إلى أكثر من 160 دولة. عاش في المنفى الذاتي ببنسلفانيا منذ 1999، واتهمته أنقرة بتدبير محاولة انقلاب 2016 — وهو اتهام ظل ينفيه وتروجه الدولة التركية وتشكك فيه حكومات ومحللون آخرون — وتوفي في الولايات المتحدة."
  en: "Turkish preacher, intellectual and educator ⁦(27 April 1941 – 20 October 2024)⁩, the leading figure of the Nurcu-inspired 'Hizmet' (Service) movement, which built a transnational network of schools, charities and media spanning more than 160 countries. He lived in self-imposed exile in Pennsylvania from 1999; Ankara accused him of directing the 2016 coup attempt — an accusation he denied, promoted by the Turkish state and disputed by other governments and analysts — and he died in the United States."
  ur: "ترک مبلغ، مفکر اور مربی ⁦(27 اپریل 1941 – 20 اکتوبر 2024)⁩، نورجو روایات سے متاثر تحریک «خدمت» ⁦(Hizmet)⁩ کی نمایاں ترین شخصیت، جس نے 160 سے زائد ممالک میں اسکولوں، فلاحی اداروں اور میڈیا کا بین الاقوامی جال بچھایا۔ 1999 سے پنسلوینیا میں خود ساختہ جلاوطنی میں رہے؛ انقرہ نے انہیں 2016 کی بغاوت کی سازش کا طراح قرار دیا — الزام جسے انہوں نے مسترد کیا، ترک ریاست نے پرچارا اور دیگر حکومتوں و ماہرین نے مشکوک قرار دیا — اور امریکا میں انتقال ہوا۔"
  es: "Predicador, intelectual y educador turco (27 de abril de 1941 - 20 de octubre de 2024), figura principal del movimiento \"Hizmet\" (Servicio), inspirado en Nurcu, que construyó una red transnacional de escuelas, organizaciones benéficas y medios de comunicación en más de 160 países. Vivió en un exilio autoimpuesto en Pensilvania desde 1999; Ankara lo acusó de dirigir el intento de golpe de Estado de 2016 —una acusación que él negó, promovida por el Estado turco y refutada por otros gobiernos y analistas— y falleció en Estados Unidos."
