summary:
  ar: "خطيب وداعية وكاتب فلسطيني وُلد في قطاع غزة سنة 1989، عُرف بخطبه الحماسية القصيرة المنتشرة على يوتيوب — وفي مقدمتها «ويمكرون ويمكر الله» — ونال سنة 2018 جائزة «خطيب الفقراء»، وألّف كتابي «تغاريد» و«جواز سفر»، ويقيم في تركيا بعد سنوات دراسة في السودان تخللها اعتقال قصير سنة 2020."
  en: "Palestinian preacher, orator and writer born in the Gaza Strip in 1989. He is known for short, impassioned sermons that circulate on YouTube — most famously 'Wa-yamkurun wa-yamkur Allah' — won the 'Orator of the Poor' award in 2018, and has written the books Tagharid and Jawaz Safar. He lives in Turkey after years of study in Sudan that included a brief detention in 2020."
  ur: "فلسطینی خطیب، داعی و مصنف، جو 1989ء میں غزہ کی پٹی میں پیدا ہوئے۔ یوٹیوب پر پھیلنے والے پرجوش مختصر خطبوں سے شہرت پائی، 2018ء میں «خطیب الفقراء» ایوارڈ ملا، «تغارید» اور «جواز سفر» نامی کتب لکھیں، اور سوڈان میں تعلیم و مختصر حراست کے بعد اب ترکی میں مقیم ہیں۔"
