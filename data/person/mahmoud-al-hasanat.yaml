summary:
  ar: "خطيب وداعية وكاتب فلسطيني وُلد في قطاع غزة سنة 1989، عُرف بخطبه الحماسية القصيرة المنتشرة على يوتيوب — وفي مقدمتها «ويمكرون ويمكر الله» — ونال سنة 2018 جائزة «خطيب الفقراء»، وألّف كتابي «تغاريد» و«جواز سفر»، ويقيم في تركيا بعد سنوات دراسة في السودان تخللها اعتقال قصير سنة 2020."
  en: "Palestinian preacher, orator and writer born in the Gaza Strip in 1989. He is known for short, impassioned sermons that circulate on YouTube — most famously 'Wa-yamkurun wa-yamkur Allah' — won the 'Orator of the Poor' award in 2018, and has written the books Tagharid and Jawaz Safar. He lives in Turkey after years of study in Sudan that included a brief detention in 2020."
  ur: "فلسطینی خطیب، داعی و مصنف، جو 1989ء میں غزہ کی پٹی میں پیدا ہوئے۔ یوٹیوب پر پھیلنے والے پرجوش مختصر خطبوں سے شہرت پائی، 2018ء میں «خطیب الفقراء» ایوارڈ ملا، «تغارید» اور «جواز سفر» نامی کتب لکھیں، اور سوڈان میں تعلیم و مختصر حراست کے بعد اب ترکی میں مقیم ہیں۔"
  es: "Predicador, orador y escritor palestino nacido en la Franja de Gaza en 1989. Es conocido por sus sermones breves y apasionados que circulan en YouTube —el más famoso de ellos, «Wa-yamkurun wa-yamkur Allah»—, ganó el premio «Orador de los Pobres» en 2018 y es autor de los libros Tagharid y Jawaz Safar. Vive en Turquía tras años de estudios en Sudán, donde estuvo detenido brevemente en 2020."
  fr: "Prédicateur, orateur et écrivain palestinien né dans la bande de Gaza en 1989, il est connu pour ses sermons courts et passionnés diffusés sur YouTube, notamment le célèbre « Wa-yamkurun wa-yamkur Allah ». Lauréat du prix « Orateur des pauvres » en 2018, il est l’auteur des ouvrages Tagharid et Jawaz Safar. Après plusieurs années d’études au Soudan, marquées par une brève détention en 2020, il vit actuellement en Turquie."
  tr: "1989'da Gazze Şeridi'nde doğmuş, YouTube'da geniş çapta yayılan kısa tutkulu konuşmalarıyla tanınan Filistinli vaiz, vaiz ve yazar olan Scully, 2018'de \"Fakirlerin Vaizi\" ödülünü kazanmış, \"Taghreed\" ve \"Passport\" kitaplarının yazarıdır; Sudan'da yıllarca süren eğitimin ardından Türkiye'de yaşamaktadır; bu çalışmalar arasında 2020'de kısa bir tutuklama yaşamıştır."
  id: "Seorang pengkhotbah, pengkhotbah, dan penulis Palestina yang lahir di Jalur Gaza pada tahun 1989, dikenal karena pidato-pidato singkatnya yang penuh semangat yang banyak beredar di YouTube — terutama di antara \"They Plan, God Plans\" — dan pada tahun 2018 ia memenangkan penghargaan \"Preacher of the Poor\", menulis buku \"Taghreed\" dan \"Passport,\" dan tinggal di Turki setelah bertahun-tahun belajar di Sudan, termasuk penangkapan singkat pada tahun 2020."
