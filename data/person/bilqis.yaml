label:
  ar: بلقيس
  en: Bilqis, Queen of Sheba
  ur: ملکہ سبا
  es: "Bilqis, Queen of Sheba"
  fr: "Bilqis, Queen of Sheba"
summary:
  ar: "ملكة سبأ في الرواية الإسلامية؛ لم يسمّها القرآن وسمّاها المؤرخون بلقيس بنت الهدهاد، وتروي كتب القصص والأخبار قصة ملكها ولقائها بسليمان {cite:muruj-al-dhahab}."
  en: "The queen of Sheba in the Islamic narrative; the Qur'an does not name her, while the historians name her Bilqis daughter of al-Hadhad, recounting her reign and her encounter with Sulayman {cite:muruj-al-dhahab}."
  es: "La reina de Saba en la narrativa islámica; el Corán no la nombra, mientras que los historiadores la llaman Bilqis, hija de al-Hadhad, relatando su reinado y su encuentro con Sulayman {cite:muruj-al-dhahab}."
  fr: "La reine de Saba dans le récit islamique; le Coran ne la nomme pas, tandis que les historiens la nomment Bilqis, fille d'al-Hadhad, relatant son règne et sa rencontre avec Sulayman {cite:muruj-al-dhahab}."
  ur: "اسلامی بیانیہ میں شیبا کی ملکہ؛ قرآن نے اس کا نام نہیں لیا، جب کہ مورخین نے اس کا نام بلقیس بیٹی الحدد رکھا ہے، اس کے دور حکومت اور سلیمان کے ساتھ اس کی ملاقات کا ذکر کرتے ہوئے {حوالہ: مروج الذہب}۔"
  tr: "İslami anlatımda Seba Kraliçesi; Kur'an ona adını vermemiştir, ancak tarihçiler ona Bilqis bint al-Had adını vermiştir. Hikâye kitapları ve hikayeler onun hükümdarlığını ve Süleyman ile görüşmesini anlatır {atıf:muruj-al-dhahab}."
  id: "Ratu Sheba dalam narasi Islam; Al-Qur'an tidak menyebutkan namanya, tetapi para sejarawan menamainya Bilqis bint al-Hadhad. Kitab-kitab cerita dan cerita menceritakan kisah pemerintahannya dan pertemuannya dengan Salomo {cite:muruj-al-dhahab}."
