summary:
  en: "A pious woman of Syria who endowed a house she had inherited near the Hanbali congregational mosque in Damascus, a waqf venerated especially among the Rum until the grand vizier Iyas Pasha sent dirhams from Constantinople to restore her dwelling; she died in Muharram 946 AH."
  ar: "عابدة من عابدات الشام ذات بر وإحسان؛ وقفت بيتاً ورثته من أبيها على جامع الحنابلة بدمشق، وكان للناس اعتقاد فيها وخصوصاً الأروام، حتى إن الوزير الأعظم إياس باشا أرسل من الروم دراهم لتعمير سكنها في الزاوية الداودية؛ وتوفيت في المحرم سنة 946هـ."
  es: "Una mujer piadosa de Siria que donó una casa que había heredado cerca de la mezquita congregacional Hanbali en Damasco, un waqf venerado especialmente entre los Rum hasta que el gran visir Iyas Pasha envió dirhams desde Constantinopla para restaurar su vivienda; murió en Muharram del año 946 de la Hégira."
  fr: "Une pieuse Syrienne qui avait doté une maison héritée près de la mosquée congrégationaliste Hanbalite de Damas, un waqf vénéré particulièrement parmi les Roum jusqu'à ce que le grand vizir Iyas Pacha envoie des dirhams de Constantinople pour restaurer sa demeure; elle mourut en Muharram 946 AH."
