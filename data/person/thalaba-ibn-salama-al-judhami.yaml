id: person/thalaba-ibn-salama-al-judhami
class: person
label: { ar: "ثعلبة بن سلامة الجذامي" }
gender: male
summary:
  ar: "أمير الأندلس بعد مهلك بلج بن بشر؛ انحاز عنه الفهريون فلم يطيعوه، وولي سنتين أظهر فيهما العدل ودانت له الأندلس عشرة أشهر حتى مالت به العصبية في يمانيته ففسد أمره، وقفل بعد ذلك إلى المشرق ولحق بمروان بن محمد وحضر حروبه {cite:nafh-tib-maqqari p. 273}."
  en: "Governor of al-Andalus after Balj's death; two years of justice until Yamani partisanship ruined his rule — he then sailed east and joined Marwan b. Muhammad's wars {cite:nafh-tib-maqqari p. 273}."
  es: "Gobernador de al-Andalus tras la muerte de Balj; dos años de justicia hasta que el partidismo de Yamani arruinó su gobierno; luego navegó hacia el este y se unió a las guerras de Marwan b. Muhammad {cite:nafh-tib-maqqari p. 273}."
  fr: "Gouverneur d'al-Andalus après la mort de Balj; deux années de justice jusqu'à ce que le parti pris yamani ruine son règne — il navigua ensuite vers l'est et rejoignit les guerres de Marwan b. Muhammad {cite:nafh-tib-maqqari p. 273}."
  ur: "بلج کی موت کے بعد الاندلس کا گورنر؛ انصاف کے دو سال یہاں تک کہ یمنی کی طرف داری نے اس کی حکومت کو برباد کر دیا - پھر وہ مشرق کی طرف روانہ ہوا اور مروان بن کے ساتھ شامل ہوا۔ محمد کی جنگیں {حوالہ دیں:نفح تبع مقری ص۔ 273}۔"
  tr: "Endülüs Emiri, Bilj bin Bişr'in ölümünden sonra onun tarafını tuttu ve itaat etmedi. İki yıl süreyle atandı; bu süre zarfında adalet gösterdi; el-Endülüs ise Yemen'deki aşiret anlaşmazlıkları nedeniyle çöküşüne kadar on ay geçirdi. Bundan sonra doğuda hapsedildi, Mervan ibn Muhammed'e katıldı ve onun savaşlarına katıldı {atıf:nafh-tib-maqqari, s. 273}."
  id: "Emir al-Andalus, setelah kematian Bilj ibn Bishr, berpihak padanya dan tidak mematuhinya. Ia diangkat selama dua tahun di mana ia menunjukkan keadilan, dan al-Andalus menghabiskan sepuluh bulan sampai perselisihan suku di Yamannya menyebabkan kehancurannya. Setelah itu, ia terkunci di Timur, bergabung dengan Marwan ibn Muhammad, dan menghadiri perangnya {cite:nafh-tib-maqqari, hlm. 273}."
