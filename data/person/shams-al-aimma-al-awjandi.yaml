summary:
  ar: "محمود بن عبد العزيز الأوزجندي، القاضي، فقيه حنفي، يلقب بشمس الأئمة وبشيخ الإسلام، وهو جد قاضي خان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16249} تفقه على شمس الأئمة السرخسي المتوفى سنة 483هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16249} لم يذكر النص تاريخي ولادته ووفاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16249}"
  en: "Mahmud ibn Abd al-Aziz al-Awjandi, the qadi, a Hanafi jurist bearing the titles Shams al-A'imma and Shaykh al-Islam, and the grandfather of Qadi Khan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16249} He studied fiqh under Shams al-A'imma al-Sarakhsi, who died in 483 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16249} The text gives no dates of birth or death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16249}"
  ur: "محمود بن عبد العزیز الاوزجندی، قاضی، حنفی فقیہ جنہیں شمس الائمہ اور شیخ الاسلام کے القاب ملے، اور وہ قاضی خان کے دادا تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16249} انھوں نے شمس الائمہ سرخسی (متوفی 483ھ) سے فقہ پڑھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16249} متن نے ولادت اور وفات کی کوئی تاریخ نہیں دی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16249}"
