summary:
  ar: "وردة بنت ناصيف اليازجي ⁦(١٨٣٨–١٩٢٤م)⁩؛ أديبة من أهل كفرشيما بلبنان. تعلمت في مدرسة البنات الأميركية ببيروت وقرأت الأدب على أبيها ونظمت الشعر فاجتمع لها ديوان صغير سمته «حديقة الورد»، واقترنت بفرنسيس شمعون سنة ١٨٦٦م وسكنت الإسكندرية وتوفيت فيها. أكثر شعرها في المراثي {cite:al-aalam tarjama}."
  en: "Warda al-Yaziji (1838–1924 CE) — the Lebanese poetess of Kafarshima, author of the diwan Hadiqat al-Ward {cite:al-aalam tarjama}."
  es: "Warda al-Yaziji (1838-1924 d.C.): la poetisa libanesa de Kafarshima, autora del diwan Hadiqat al-Ward {cita:al-aalam tarjama}."
  fr: "Warda al-Yaziji (1838-1924 CE) — la poétesse libanaise de Kafarshima, auteur du diwan Hadiqat al-Ward {cite: al-aalam tarjama}."
  ur: "وردہ ال یازیجی ⁦(1838-1924 عیسوی)⁩ - کافرشیما کی لبنانی شاعرہ، دیوان حدیقۃ الورد کی مصنفہ۔"
  tr: "Warda bint Nassif Al-Yazji (1838–1924); Lübnan'ın Kfar Shema halkından bir edebi figür. Beyrut'taki Amerikan Kızlar Okulu'nda eğitim gördü, babasından edebiyat okudu ve şiirler besteledi. 'Güller Bahçesi' adlı küçük bir koleksiyon derledi. 1866'da Francis Chamoun ile evlendi, İskenderiye'ye yerleşti ve orada vefat etti. Şiirlerinin çoğu ağıtlar {cite:al-aalam tarjama} içindedir."
  id: "Warda bint Nassif Al-Yazji (1838–1924 M); tokoh sastra dari masyarakat Kfar Shema, Lebanon. Ia belajar di American Girls' School di Beirut, belajar sastra di bawah bimbingan ayahnya, dan menulis puisi. Ia menyusun kumpulan kecil berjudul 'The Garden of the Roses.' Ia menikah dengan Francis Chamoun pada tahun 1866, menetap di Alexandria, dan meninggal di sana. Sebagian besar puisinya berbentuk elegi {cite:al-aalam tarjama}."
