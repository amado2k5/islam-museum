id: person/abu-ishaq-al-saffar-al-bukhari
class: person
label:
  ar: "أبو إسحاق الصفار البخاري"
  en: "Abu Ishaq al-Saffar al-Bukhari"
  fr: "Abu Ishaq al-Saffar al-Bukhari"
  es: "Abu Ishaq al-Saffar al-Bukhari"
  ur: "ابو اسحاق الصفر البخاری"
roles: [faqih]
gender: male
summary:
  ar: "إبراهيم بن إسماعيل، أبو إسحاق ركن الإسلام البخاري الصفار، فقيه حنفي زاهد من أهل بخارى نفاه السلطان سنجر إلى مرو، توفي ببخارى سنة 534 هـ الموافقة 1139 م، وله تلخيص الأدلة لقواعد التوحيد."
  en: "Ibrahim ibn Ismail, Abu Ishaq Rukn al-Islam al-Bukhari al-Saffar, a Hanafi jurist and ascetic of Bukhara whom the sultan Sanjar banished to Marw, died in Bukhara in 534 AH (1139); author of Talkhis al-adilla li-qawa'id al-tawhid."
  fr: "Ibrahim ibn Ismail, Abu Ishaq Rukn al-Islam al-Bukhari al-Saffar, juriste hanafite et ascète de Boukhara que le sultan Sanjar bannit à Marw, mort à Boukhara en 534 H (1139) ; auteur du Talkhis al-adilla li-qawa'id al-tawhid."
  es: "Ibrahim ibn Ismail, Abu Ishaq Rukn al-Islam al-Bukhari al-Saffar, jurista hanafi y asceta de Bukhara a quien el sultán Sanjar desterró a Marw, murió en Bukhara en 534 d.H. (1139); autor de Talkhis al-adilla li-qawa'id al-tawhid."
  ur: "ابراہیم بن اسماعیل، ابو اسحاق رکن الاسلام البخاری الصفار، بخارا کے ایک حنفی فقیہ اور سنیاسی جنہیں سلطان سنجار نے مرو کی طرف جلاوطن کر دیا تھا، بخارا میں 534 ہجری (1139) میں فوت ہوا؛ تلخیص العدل لِقواعد التوحید کے مصنف۔"
  tr: "İbrahim ibn İsmail, Ebu İshak Rukn el-İslam el-Buhari el-Saffar, Buharalı bir Hanefi hukukçu ve zahit olup Sultan Sancar tarafından Merv'e sürgün edilmiştir. Hicri 534 yılında (miladi 1139) Buhara'da vefat etmiştir. Kendisi, tevhid kurallarının delillerinin bir özetini sunmaktadır."
  id: "Ibrahim ibn Ismail, Abu Ishaq Rukn al-Islam al-Bukhari al-Saffar, seorang ahli hukum Hanafi dan seorang pertapa dari Bukhara, diasingkan oleh Sultan Sanjar ke Merv. Ia meninggal di Bukhara pada tahun 534 H, yang bertepatan dengan tahun 1139 M. Ia memiliki ringkasan bukti-bukti untuk kaidah-kaidah monoteisme."
