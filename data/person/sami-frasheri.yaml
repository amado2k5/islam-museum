summary:
  ar: "كاتب ومعجمي ألباني عثماني (1850-1904) عُرف في المصادر التركية باسم شمس الدين سامي، وأحد الإخوة فراشري الثلاثة ومنظّري الصحوة الوطنية الألبانية. وضع أول موسوعة مطبوعة بالتركية «قاموس الأعلام» في ستة مجلدات و«القاموس التركي»، وصمّم الأبجدية الألبانية المعروفة بأبجدية إسطنبول، وكتب كتيّب «ألبانيا: ما كانت وما هي وما ستكون» (1899) الذي تُنازع نسبته إليه."
  en: "Albanian-Ottoman writer and lexicographer (1850–1904), known in Turkish sources as Şemseddin Sami, one of the three Frashëri brothers and an ideologue of the Albanian National Awakening. He compiled the first encyclopedia printed in Turkish, the six-volume Kâmûsü'l-A'lâm, and the Kâmûs-ı Türkî dictionary, designed the 'Istanbul alphabet' for Albanian, and is credited with the 1899 manifesto Albania: What she has been, What she is, What she shall be — an attribution Turkish historians generally dispute."
  ur: "البانوی عثمانی مصنف اور لغت نویس (1850ء–1904ء)، جو ترکی مصادر میں شمس الدین سامی کے نام سے معروف ہیں، تینوں فراشری بھائیوں میں سے ایک اور البانوی قومی بیداری کے نظریہ ساز۔ انھوں نے ترکی میں چھپنے والی پہلی انسائیکلوپیڈیا «قاموس الاعلام» چھ جلدوں میں اور «قاموس ترکی» مرتب کی، البانوی کے لیے «استنبول حروفِ تہجی» وضع کی، اور 1899ء کا رسالہ «البانیہ: کیا تھی، کیا ہے، کیا ہوگی» ان سے منسوب ہے۔"

