class: person
label: { ar: "الفضل بن ماهان", en: "al-Fadl ibn Mahan", fr: "Al-Fadl ibn Mahan", es: "al-Fadl ibn Mahan", ur: "الفضل بن مہان" }
summary:
  ar: "الفضل بن ماهان مولى بني سامة؛ فتح سندان وغلب عليها وبعث إلى المأمون بفيل ودعا له في مسجد جامع اتخذه بها ثم قام ابناه محمد وماهان بعده فقتل أحدهما وصلب وغلبت الهند على سندان."
  en: "al-Fadl ibn Mahan, mawla of Banu Sama; Sindan's conqueror who sent al-Ma'mun an elephant and kept him in the mosque's dua — after him his sons Muhammad and Mahan fought over it till Hind retook it."
  fr: "Al-Fadl ibn Mahan, mawla des Banu Sama ; conquérant de Sindan, qui envoya un éléphant à al-Ma’mun et le garda dans les invocations de la mosquée — après lui, ses fils Muhammad et Mahan se disputèrent la ville jusqu’à sa reprise par les Indiens."
  es: "al-Fadl ibn Mahan, mawla de Banu Sama; conquistador de Sindan, quien envió un elefante a al-Ma'mun y lo mantuvo en la mezquita, tras lo cual sus hijos Muhammad y Mahan lucharon por ella hasta que Hind la reconquistó."
  ur: "الفضل بن مہان، بنو سماع کے مولا؛ سندان کا فاتح جس نے المامون کو ہاتھی بھیجا اور اسے مسجد کی دعا میں رکھا - اس کے بعد اس کے بیٹے محمد اور مہان اس پر لڑے یہاں تک کہ ہند نے اسے واپس لے لیا۔"
  tr: "Beni Samah kabilesinden azatlı bir köle olan El-Fadl ibn Mahan, Sindan'ı fethetti ve kontrolü ele geçirdi. El-Ma'mun'a bir fil gönderdi ve orada inşa ettirdiği bir camide onun için dua etti. Daha sonra iki oğlu Muhammed ve Mahan onun ardından ayaklandı; oğullarından biri öldürüldü ve çarmıha gerildi, böylece Hindistan Sindan'ın kontrolünü ele geçirdi."
  id: "Al-Fadl ibn Mahan, seorang budak yang telah dibebaskan dari Banu Samah, menaklukkan Sindan dan menguasainya. Ia mengirim seekor gajah kepada Al-Ma'mun dan berdoa untuknya di sebuah masjid yang telah dibangunnya di sana. Kemudian kedua putranya, Muhammad dan Mahan, bangkit menggantikannya, dan salah satu dari mereka terbunuh dan disalib, dan India menguasai Sindan."
