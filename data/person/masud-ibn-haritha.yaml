label: { ar: "مسعود بن حارثة", en: "Mas'ud ibn Haritha", es: "Mas'ud ibn Haritha", fr: "Mas'ud ibn Haritha", ur: "مسعود بن حارثہ" }
summary:
  ar: "أخو المثنى بن حارثة الشيباني؛ قتل يوم مهران فقال المثنى يا معشر المسلمين لا يرعكم مصرع أخي فإن مصارع خياركم هكذا فحملوا حملة رجل واحد."
  en: "Brother of al-Muthanna ibn Haritha al-Shaybani; killed at the Day of Mihran, prompting al-Muthanna's saying 'let not my brother's fall dismay you — the falls of your best are such', after which they charged as one."
  es: "Hermano de al-Muthanna ibn Haritha al-Shaybani; murió el Día de Mihran, lo que provocó que al-Muthanna dijera: \"No dejes que la caída de mi hermano te desanime; las caídas de los mejores son así\", tras lo cual cargaron como uno solo."
  fr: "Frère d'al-Muthanna ibn Haritha al-Shaybani; tué le jour de Mihran, ce qui a incité al-Muthanna à dire: « Que la chute de mon frère ne vous désole pas — les chutes de vos meilleurs sont telles », après quoi ils ont chargé comme un seul homme."
  ur: "المثنیٰ ابن حارثہ الشیبانی کے بھائی؛ مہران کے دن مارا گیا، المثنا کے کہنے پر اکسایا کہ 'میرے بھائی کے زوال سے آپ کو مایوس نہ ہونے دیں - آپ کے بہترین زوال ایسے ہیں'، جس کے بعد انہوں نے ایک الزام لگایا۔"
  tr: "Al-Muthanna ibn Haritha Al-Shaybani'nin kardeşi; Mehran gününde öldürüldü. Al-Muthanna dedi ki, ey Müslümanlar, kardeşimin ölümünden korkmayın, çünkü en iyi güreşçileriniz böyledir. O halde bir adamın taşıyıcısını taşıyın."
  id: "Saudara Al-Muthanna ibn Haritha Al-Shaybani; dia dibunuh pada hari Mehran. Al-Muthanna berkata, wahai umat Islam, janganlah takut akan kematian saudaraku, karena para pegulat terbaik kalian seperti ini. Maka bawalah pembawa satu orang."
