label: { ar: "جعفر بن محمد الصادق", en: "Ja'far ibn Muhammad al-Sadiq" }
summary:
  ar: "أبو عبد الله جعفر بن محمد بن علي بن الحسين بن علي، إمام أهل البيت وراوٍ للحديث بالمدينة يُستشهد به باحترام في أسانيد أهل السنة، وآخر إمام اعترف به الشيعة الاثنا عشرية والإسماعيلية معاً، وتذكر دائرة المعارف الإسلامية أنه قاد أتباعاً شيعة غير مسلحين في الانتقال من الأمويين إلى العباسيين وأن الخلاف على من يخلفه فرّق أتباعه، وهو أيضاً أحد أعلام الهدى، روى عنه المسعودي بإسناده عن أبيه وصية علي لأولاده صبيحة الليلة التي ضربه فيها ابن ملجم، وهي من أطول وصاياه المروية {cite:muruj-al-dhahab p. 713-714}. وعند المسعودي دعا رسول أبي سلمة بسراج فوضع كتابه عليه حتى احترق قبل أن يقرأه وقال عرف صاحبك بما رأيت وتمثل بأيا موقداً ناراً لغيرك ضوؤها، ولما أتاه عبد الله بن الحسن مبتهجاً بكتابه قال ومتى كان أهل خراسان شيعة لك أنت بعثت أبا مسلم، ولما قال إنما يريد القوم ابني محمداً لأنه مهدي هذه الأمة قال والله ما هو مهديها ولئن شهر سيفه ليقتلن، فلما رماه بالحسد قال ما هذا إلا نصح مني لك {cite:muruj-al-dhahab p. 240-241}. وعند أحمد أمين هو أكبر شخصيات العصر في التشريع الشيعي وربما أكبر الشخصيات فيه في العصور المختلفة: عاصر آخر الدولة الأموية وصدراً من الدولة العباسية، ولد سنة ٨٣ وتوفي سنة ١٤٨ في خلافة أبي جعفر المنصور، وأمه أم فروة بنت القاسم بن أبي بكر الصديق؛ كان بعيداً عن غمار السياسة — أو كما يرى أمين أنه طبق مذهب التقية في دقة وإتقان {cite:duha-islam p. 887-888}"
  en: "Abu 'Abd Allah Ja'far al-Sadiq, a Medinan transmitter of hadith cited with respect in Sunni chains, and the last imam recognised by both the Twelver and the Isma'ili Shi'is, who regard him as sixth and fifth imam respectively. The Encyclopaedia of Islam gives his birth as 80 or 83 AH in Medina and his death as 148 AH, with burial in the Baqi cemetery; it says he led a non-militant Shi'i following through the Umayyad-Abbasid transition and that the dispute over his succession split his following. Through him al-Mas'udi transmits Ali's long death-morning wasiyya to his sons {cite:muruj-al-dhahab p. 713-714}."
  ur: "ابو عبداللہ جعفر صادق مدینہ کے راوی حدیث تھے جن کا ذکر سنی اسناد میں احترام سے آتا ہے، اور وہ آخری امام ہیں جنہیں اثنا عشری اور اسماعیلی دونوں شیعہ مانتے ہیں، جن کے ہاں وہ بالترتیب چھٹے اور پانچویں امام ہیں۔ انسائیکلوپیڈیا آف اسلام ان کی پیدائش مدینہ میں 80 یا 83 ہجری اور وفات 148 ہجری بتاتا ہے، اور تدفین بقیع میں۔ وہ کہتا ہے کہ انہوں نے اموی عباسی منتقلی میں غیر مسلح شیعہ پیروکاروں کی قیادت کی اور ان کی جانشینی کے تنازع سے ان کے پیروکار تقسیم ہو گئے۔"
