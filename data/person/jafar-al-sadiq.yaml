id: person/jafar-al-sadiq
class: person
label: { ar: "جعفر بن محمد الصادق", en: "Ja'far ibn Muhammad al-Sadiq" }
summary:
  ar: "أبو عبد الله جعفر بن محمد بن علي بن الحسين بن علي، إمام أهل البيت وأحد أعلام الهدى، روى عنه المسعودي بإسناده عن أبيه وصية علي لأولاده صبيحة الليلة التي ضربه فيها ابن ملجم، وهي من أطول وصاياه المروية {cite:muruj-al-dhahab p. 713-714}.، وعند المسعودي دعا رسول أبي سلمة بسراج فوضع كتابه عليه حتى احترق قبل أن يقرأه وقال عرف صاحبك بما رأيت وتمثل بأيا موقداً ناراً لغيرك ضوؤها، ولما أتاه عبد الله بن الحسن مبتهجاً بكتابه قال ومتى كان أهل خراسان شيعة لك أنت بعثت أبا مسلم، ولما قال إنما يريد القوم ابني محمداً لأنه مهدي هذه الأمة قال والله ما هو مهديها ولئن شهر سيفه ليقتلن، فلما رماه بالحسد قال ما هذا إلا نصح مني لك {cite:muruj-al-dhahab p. 240-241}"
  en: "Abu 'Abd Allah Ja'far al-Sadiq, the Alid imam — through him Mas'udi transmits Ali's long death-morning wasiyya to his sons {cite:muruj-al-dhahab p. 713-714}."
