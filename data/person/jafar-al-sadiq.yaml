summary:
  ar: "أبو عبد الله جعفر بن محمد بن علي بن الحسين بن علي، إمام أهل البيت وراوٍ للحديث بالمدينة يُستشهد به باحترام في أسانيد أهل السنة، وآخر إمام اعترف به الشيعة الاثنا عشرية والإسماعيلية معاً، وتذكر دائرة المعارف الإسلامية أنه قاد أتباعاً شيعة غير مسلحين في الانتقال من الأمويين إلى العباسيين وأن الخلاف على من يخلفه فرّق أتباعه، وهو أيضاً أحد أعلام الهدى، روى عنه المسعودي بإسناده عن أبيه وصية علي لأولاده صبيحة الليلة التي ضربه فيها ابن ملجم، وهي من أطول وصاياه المروية {cite:muruj-al-dhahab p. 713-714}. وعند المسعودي دعا رسول أبي سلمة بسراج فوضع كتابه عليه حتى احترق قبل أن يقرأه وقال عرف صاحبك بما رأيت وتمثل بأيا موقداً ناراً لغيرك ضوؤها، ولما أتاه عبد الله بن الحسن مبتهجاً بكتابه قال ومتى كان أهل خراسان شيعة لك أنت بعثت أبا مسلم، ولما قال إنما يريد القوم ابني محمداً لأنه مهدي هذه الأمة قال والله ما هو مهديها ولئن شهر سيفه ليقتلن، فلما رماه بالحسد قال ما هذا إلا نصح مني لك {cite:muruj-al-dhahab p. 240-241}. وعند أحمد أمين هو أكبر شخصيات العصر في التشريع الشيعي وربما أكبر الشخصيات فيه في العصور المختلفة: عاصر آخر الدولة الأموية وصدراً من الدولة العباسية، ولد سنة ٨٣ وتوفي سنة ١٤٨ في خلافة أبي جعفر المنصور، وأمه أم فروة بنت القاسم بن أبي بكر الصديق؛ كان بعيداً عن غمار السياسة — أو كما يرى أمين أنه طبق مذهب التقية في دقة وإتقان {cite:duha-islam p. 887-888}"
  en: "Abu 'Abd Allah Ja'far al-Sadiq, a Medinan transmitter of hadith cited with respect in Sunni chains, and the last imam recognised by both the Twelver and the Isma'ili Shi'is, who regard him as sixth and fifth imam respectively. The Encyclopaedia of Islam gives his birth as 80 or 83 AH in Medina and his death as 148 AH, with burial in the Baqi cemetery; it says he led a non-militant Shi'i following through the Umayyad-Abbasid transition and that the dispute over his succession split his following. Through him al-Mas'udi transmits Ali's long death-morning wasiyya to his sons {cite:muruj-al-dhahab p. 713-714}."
  ur: "ابو عبداللہ جعفر صادق مدینہ کے راوی حدیث تھے جن کا ذکر سنی اسناد میں احترام سے آتا ہے، اور وہ آخری امام ہیں جنہیں اثنا عشری اور اسماعیلی دونوں شیعہ مانتے ہیں، جن کے ہاں وہ بالترتیب چھٹے اور پانچویں امام ہیں۔ انسائیکلوپیڈیا آف اسلام ان کی پیدائش مدینہ میں 80 یا 83 ہجری اور وفات 148 ہجری بتاتا ہے، اور تدفین بقیع میں۔ وہ کہتا ہے کہ انہوں نے اموی عباسی منتقلی میں غیر مسلح شیعہ پیروکاروں کی قیادت کی اور ان کی جانشینی کے تنازع سے ان کے پیروکار تقسیم ہو گئے۔"
  es: "Abu 'Abd Allah Ja'far al-Sadiq, transmisor medinense de hadices citados con respeto en cadenas sunitas, y último imán reconocido tanto por los chiíes duodecimanos como por los ismaelitas, quienes lo consideran sexto y quinto imán respectivamente. La Enciclopedia del Islam sitúa su nacimiento en Medina en el año 80 o 83 de la Hégira y su muerte en el año 148 de la Hégira, con sepultura en el cementerio de Baqi; afirma que dirigió una corriente chií no militante durante la transición omeya-abasí y que la disputa por su sucesión dividió a sus seguidores. A través de él, al-Mas'udi transmite la larga oración matutina de Ali a sus hijos {cite:muruj-al-dhahab p. 713-714}."
  fr: "Abou 'Abd Allah Ja'far al-Sadiq, transmetteur de hadiths médinois cité avec respect dans les chaînes sunnites, est le dernier imam reconnu à la fois par les chiites duodécimains et ismaéliens, qui le considèrent respectivement comme le sixième et le cinquième imam. L'Encyclopédie de l'Islam situe sa naissance en 80 ou 83 AH à Médine et sa mort en 148 AH, avec inhumation au cimetière de Baqi. Elle précise qu'il a dirigé une communauté chiite non militante durant la transition omeyyade-abbasside et que la querelle concernant sa succession a divisé ses fidèles. C'est par son intermédiaire qu'al-Mas'udi a transmis à ses fils la longue wasiyya d'Ali, prononcée au matin de sa mort (voir Muruj al-Dhahab, p. 713-714)."
  tr: "Ehl-el-Beyt'in imamı ve Medine'de hadis rivayetçisi olan Ebu Abdullah Cafer bin Muhammed bin Ali bin Muhammed ibn Ali ibn el-Hüseyin ibn Ali, Ehl-sünnet'in aktarım zincirlerinde saygıyla anılır. Hem On İki Şiiler hem de İsmaililer tarafından tanınan son imamdır. İslami Ansiklopedi, silahsız Şii takipçilerini Emeviliden Abbasilere geçişte yönettiğini, halefinin kim olacağı üzerine anlaşmazlık olduğunu ve aynı zamanda önde gelen rehber figürlerden biri olduğunu kaydeder. El-Mes'udi, babasından gelen aktarma zinciriyle, Ali'nin çocuklarına vasiyetini, İbn Mulcam'ın vurduğu gece sabahı anlattı; bu, onun en uzun ilettiği vasiyetlerinden biridir {atıf:Muruj-al-Dhahab, s. 713-714}. El-Mes'udi'ye göre, Ebu Sela'nın Elçisi bir lamba çağırdı, kitabını üzerine koydu ve o okumadan önce yandı. Dedi ki: Sahabeni gördüklerinden tanı, ışığı olan başkaları için her ateşi yakacaksın. Abdullah ibn el-Hasan mektubunu neşeyle yanına getirdiğinde şöyle dedi: 'Ve Horasan halkı sizin için Şii olduğunda, Ebu Müslümü gönderdiniz.' Şöyle dedi: 'Halk sadece oğlum Muhammed'i istiyor çünkü o bu ulusun Mehdi'sidir,' dedi: 'Allah aşkına, o onun Mehdisi değildir. Kılıcını çekerse onları öldürür.' Kıskançlıkla suçladığında, 'Bu sadece benim size verdiğim öğüttür.' dedi. {Kaynak:Muruj-al-Dhahab, s. 240-241}. Ahmed Amin'e göre, dönemin Şii yasalarında en büyük figürdür ve belki de çeşitli dönemlerde en büyüğüdür: son Emevi devletinin çağdaşı ve Abbasi devletinin yöneticisiydi. 83 Hicri yılında doğdu ve 148 Hicri'de Ebu Ca'fer el-Mansur'un halifeliği sırasında öldü. Annesi Um Farwah bint al-Kasim ibn Epey Bekir el-Siddiq'ti; siyasetten uzaktı—ya da Amin'in gördüğüne göre, tekiye doktrinini kesin ve ustalıkla uyguladı {atıf:Duha-İslam, s. 887-888}"
  id: "Abu Abdullah Ja'far ibn Muhammad ibn Ali ibn al-Husayn ibn Ali, Imam Ahl al-Bayt dan narator hadits di Madinah, dikutip dengan hormat dalam rantai transmisi Ahl al-Sunnah. Ia adalah Imam terakhir yang diakui oleh Syiah Dua Belas dan Ismaili. Ensiklopedia Islam mencatat bahwa ia memimpin pengikut Syiah yang tidak bersenjata dalam transisi dari Umayyah ke Abbasiyah, dan bahwa perselisihan adalah siapa yang akan menggantikannya, serta bahwa ia juga merupakan salah satu tokoh utama pengajaran. Al-Mas'udi menceritakan dari dirinya, dengan rantai transmisi dari ayahnya, wasiat Ali kepada anak-anaknya pada pagi malam ketika Ibn Muljam menghantamnya, yang merupakan salah satu wasiat terpanjang yang dikirimkan {cite:muruj-al-dhahab, hlm. 713-714}. Menurut al-Mas'udi, Rasulullah Abu Salamah memanggil sebuah lampu, meletakkan bukunya di atasnya, dan lampu-lampunya terbakar sebelum ia sempat membacanya. Ia berkata: Kenalilah sahabatmu dari apa yang telah kau lihat, dan engkau akan menyalakan api untuk orang lain yang menjadi cahayanya. Ketika Abdullah ibn al-Hasan datang kepadanya dengan sukacita membawa suratnya, ia berkata: 'Dan ketika orang-orang Khurasan menjadi Syiah untukmu, kau mengirim Abu Muslim.' Ketika ia berkata, 'Rakyat hanya menginginkan putraku Muhammad karena ia adalah Mahdi bangsa ini,' ia berkata, 'Demi Allah, ia bukanlah Mahdi-nya. Jika ia menghunus pedangnya, ia akan membunuh mereka.' Ketika ia menuduh Abdullah ibn al-Hasan iri hati, ia berkata, 'Ini hanyalah nasihat dariku untukmu.' {cite:muruj-al-dhahab, hlm. 240-241}. Menurut Ahmad Amin, ia adalah tokoh terbesar pada era tersebut dalam legislasi Syiah, dan mungkin yang terbesar di dalamnya di berbagai era: ia sezaman dengan negara Umayyah terakhir dan penguasa negara Abbasiyah. Ia lahir pada tahun 83 H dan meninggal pada tahun 148 H selama kekhalifahan Abu Ja'far al-Mansur. Ibunya adalah um Farwah bint al-Qasim ibn Abi Bakr al-Siddiq; ia jauh dari dunia politik—atau, menurut Amin, ia menerapkan doktrin taqiyya dengan ketelitian dan penguasaan {cite:Duha-Islam, hlm. 887-888}"
