class: person
label: { ar: "مهران بن مهربنداذ الهمذاني", en: "Mihran ibn Mihrbandadh al-Hamadhani", es: "Mihran ibn Mihrbandadh al-Hamadhani", fr: "Mihran ibn Mihrbandadh al-Hamadhani", ur: "مہران ابن مھربندھ الحمدانی" }
summary:
  ar: "قائد فارسي بعثته بوران بنت كسرى إلى المسلمين في اثني عشر ألفاً فعبر الجسر إلى البويب فقتله المسلمون يوم مهران سنة أربع عشرة وتنازع في قتله جرير بن عبد الله والمنذر بن حسان الضبي فأخذ المنذر منطقته وأخذ جرير سائر سلبه ويقال كان الحصن بن معبد التميمي ممن قتله."
  en: "Persian commander sent by Buran bint Kisra against the Muslims in twelve thousand; killed at al-Buwayb in year 14, Jarir ibn Abdallah and al-Mundhir ibn Hassan al-Dabbi disputing his kill — Mundhir took his belt, Jarir the rest."
  es: "Comandante persa enviado por Buran bint Kisra contra los musulmanes en doce mil hombres; muerto en al-Buwayb en el año 14, Jarir ibn Abdallah y al-Mundhir ibn Hassan al-Dabbi disputaron su muerte: Mundhir tomó su cinturón, Jarir el resto."
  fr: "Commandant perse envoyé par Buran bint Kisra contre les musulmans en douze mille; tué à al-Buwayb en l'an 14, Jarir ibn Abdallah et al-Mundhir ibn Hassan al-Dabbi se disputant sa mort — Mundhir a pris sa ceinture, Jarir le reste."
  ur: "بران بنت کسریٰ کی طرف سے بارہ ہزار میں مسلمانوں کے خلاف فارسی کمانڈر بھیجا گیا۔ سنہ 14 میں البویب میں مارا گیا، جریر ابن عبداللہ اور المنذر ابن حسن الدبی نے اس کے قتل پر اختلاف کیا - منذر نے اپنی پٹی لے لی، باقی جریر نے۔"
