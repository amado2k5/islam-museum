class: person
label: { ar: "فرفوريس الحكيم", en: "Porphyry (Furfuris)", es: "Porphyry (Furfuris)", fr: "Porphyry (Furfuris)", ur: "پورفیری ⁦(فرفورس)⁩" }
summary:
  ar: "الحكيم صاحب كتاب إيساغوجي وهو المدخل إلى علم المنطق والكتاب بهذا الرجل يعرف؛ عند المسعودي أن قبره في الأطمة المعروفة بأطمة صقلية {cite:muruj-al-dhahab p. 357}."
  en: "The philosopher Porphyry, author of the Isagoge — the gateway to logic, a book known by his name; al-Mas'udi places his tomb in the fire-vent (atma) of Sicily {cite:muruj-al-dhahab p. 357}."
  es: "El filósofo Porfirio, autor de la Isagoge —la puerta de entrada a la lógica—, un libro conocido por su nombre; al-Mas'udi sitúa su tumba en el atma (fuego) de Sicilia {cite:muruj-al-dhahab p. 357}."
  fr: "Le philosophe Porphyre, auteur de l'Isagoge — la porte de la logique, un livre connu sous son nom; al-Mas'udi place sa tombe dans l'évent de feu (atma) de Sicile {cite:muruj-al-dhahab p. 357}."
  ur: "فلسفی پورفیری، اساگوج کے مصنف — منطق کا گیٹ وے، ایک کتاب جسے اس کے نام سے جانا جاتا ہے۔ المسعودی نے اپنا مقبرہ سسلی کے آتش گیر مقام ⁦(آتما)⁩ میں رکھا۔ 357}۔"
  tr: "Al-Hakim, mantığa giriş olan Isagoji kitabının yazarıdır ve bu kitap, Al-Mas'udi tarafından Sicilya'nın Atma'sı olarak bilinen Atma'daki mezarı olarak bilinir {cite:muruj-al-dhahab, s. 357}."
  id: "Al-Hakim, penulis buku Isagoji, yang merupakan pengantar logika, dan buku ini dikenal oleh Al-Mas'udi sebagai makamnya dalam Atma yang dikenal sebagai Atma Sisilia {cite:muruj-al-dhahab, hlm. 357}."
