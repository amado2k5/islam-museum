class: person
label: { ar: "أبو العباس الناشئ", en: "Abu'l-'Abbas al-Nashi'", fr: "Abu'l-'Abbas al-Nashi'", es: "Abu'l-'Abbas al-Nashi'", ur: "ابو العباس الناشی" }
summary:
  ar: "عبد الله بن محمد الناشئ الكاتب الأنباري، صنف على الخليل بن أحمد كتاباً ذكر فيه أنواعاً خرج فيها الخليل عن تقليد العرب إلى باب التعسف، وله قصيدة نونية منصوبة نحو أربعة آلاف بيت بقافية واحدة يذكر فيها أهل الآراء والنحل والمذاهب والملل، ومصنفات واسعة في أنواع العلوم، سار من العراق إلى مصر وبها مات سنة ثلاث وتسعين ومائتين {cite:muruj-al-dhahab p. 433}."
  en: "The Anbari secretary — critic of al-Khalil's prosody, author of a four-thousand-line nuniyya on the sects, dead in Egypt 293 {cite:muruj-al-dhahab p. 433}."
  fr: "Le secrétaire d'al-Anbar — critique de la prosodie d'al-Khalil, auteur d'une nuniyya de quatre mille vers sur les sectes, mort en Égypte en 293 {cite:muruj-al-dhahab p. 433}."
  es: "El secretario de Anbari, crítico de la prosodia de al-Khalil, autor de una nuniyya de cuatro mil líneas sobre las sectas, murió en Egipto 293 {cite:muruj-al-dhahab p. 433}."
  ur: "انباری سکریٹری - الخلیل کے نقاد، فرقوں پر چار ہزار سطروں پر مشتمل نونیہ کے مصنف، مصر 293 میں فوت ہوئے۔ 433}۔"
  tr: "Abdullah bin Muhammed el-Nash'i el-Katib el-Anbari, el-Halil bin Ahmed hakkında bir kitap yazmış ve bu kitapta el-Halil'in Arapların taklidinden keyfiliğe varan yönlerini ele almıştır. Yaklaşık dört bin mısradan oluşan, tek kafiyeli bir nuni şiir biçiminde bir eseri vardır; bu eserde görüş ehli, mezhepler, düşünce okulları ve dinlerden bahsetmekte ve ilim dalları üzerine kapsamlı çalışmalar yapmaktadır. Irak'tan Mısır'a seyahat etmiş ve 293 yılında orada vefat etmiştir. {cite:muruj-al-dhahab s. 433}"
  id: "Abdullah bin Muhammad Al-Nash’i Al-Katib Al-Anbari menulis sebuah buku tentang Al-Khalil bin Ahmad di mana ia menyebutkan berbagai macam pemikiran yang melampaui peniruan orang Arab hingga mencapai tingkat kesewenang-wenangan. Ia memiliki sebuah puisi dalam bentuk nun (puisi panjang) sekitar empat ribu bait dengan satu rima di mana ia menyebutkan berbagai pendapat, sekte, aliran pemikiran dan agama, serta karya-karya luas dalam berbagai jenis ilmu pengetahuan. Ia melakukan perjalanan dari Irak ke Mesir dan meninggal di sana pada tahun 293. {cite:muruj-al-dhahab p. 433}."
