summary:
  ar: "بارون نفط ومحسن أذربيجاني (1840–1913)، فلاح من أميرجان صار من كبار مصدّري نفط باكو وأول من استخدم السفن النهرية لنقله عبر بحر قزوين؛ موّل مبنى مدرسة باكو الحقيقية ومنحًا دراسية ووهب قصره في موسكو لمسلميها (دار أسد الله يف)."
  en: "Azerbaijani oil baron and philanthropist (1840–1913), a farmer's son from Amirjan who became a leading exporter of Baku oil and the first to ship it out by barge across the Caspian. He funded the Baku Real School building and scholarships, and gave his Moscow mansion to the city's Muslim community as the Asadullayev House."
  ur: "آذربائیجانی تیل کے بڑے تاجر اور مخیر (1840–1913)؛ امیرجان کے کسان زادے جو باکو کے تیل کے صفِ اول کے برآمد کنندہ بنے اور سب سے پہلے بحرِ قزوین کے راستے کشتیوں سے تیل برآمد کیا؛ باکو ریئل اسکول کی عمارت اور وظائف کے کفیل، اور ماسکو میں اپنا محلہ وہاں کی مسلم برادری کو عطیہ کیا (دارِ اسد اللہ یف)۔"
