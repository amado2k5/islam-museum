id: person/al-hasan-ibn-makula
class: person
label: { ar: "أبو علي الحسن بن ماكولا الوزير", en: "al-Hasan ibn Makula", es: "al-Hasan ibn Makula", fr: "al-Hasan ibn Makula", ur: "الحسن بن مکلہ" }
summary:
  ar: "أبو علي الحسن بن علي بن جعفر ابن ماكولا، وزير جلال الدولة بعد حبس ابن عمه أبي سعد سنة ٤١٧؛ قتله غلامه بالأهواز في ذي الحجة سنة ٤٢٢ وله ست وخمسون سنة {cite:muntazam-ibn-al-jawzi j.8 p.403}."
  en: "Abu Ali al-Hasan ibn Ali ibn Ja'far ibn Makula, vizier of Jalal al-Dawla after his cousin Abu Sa'd was imprisoned in 417; his own slave killed him at al-Ahwaz in Dhu al-Hijja 422, at the age of 56 {cite:muntazam-ibn-al-jawzi j.8 p.403}."
  es: "Abu Ali al-Hasan ibn Ali ibn Ja'far ibn Makula, visir de Jalal al-Dawla después de que su primo Abu Sa'd fuera encarcelado en 417; su propio esclavo lo mató en al-Ahwaz en Dhu al-Hijja 422, a la edad de 56 años {cita:muntazam-ibn-al-jawzi j.8 p.403}."
  fr: "Abu Ali al-Hasan ibn Ali ibn Ja'far ibn Makula, vizir de Jalal al-Dawla après l'emprisonnement de son cousin Abu Sa'd en 417; son propre esclave l'a tué à al-Ahwaz à Dhu al-Hijja 422, à l'âge de 56 ans {cite:muntazam-ibn-al-jawzi j.8 p.403}."
  ur: "ابو علی الحسن بن علی ابن جعفر ابن ماکولہ، جلال الدولہ کا وزیر، اس کے چچا زاد بھائی ابو سعد کو 417 میں قید کر دیا گیا۔ اس کے اپنے غلام نے اسے 56 سال کی عمر میں ذی الحجہ 422 میں الاہواز میں قتل کر دیا۔"
  tr: "Abu Ali al-Hasan ibn Ali ibn Ja'far ibn Makula, kuzeni Ebu Sa'd'ın 417'de hapsedilmesinden sonra Celal-Devle'nin veziri; hizmetçisi onu 422 Hicce'de Dhu al-Hicjah'da Ahvaz'da elli altı yaşında öldürdü {atıf:Muntazam-ibn-al-Jawzi j.8 s.403}."
  id: "Abu Ali al-Hasan ibn Ali ibn Ja'far ibn Makula, wazir Jalal al-Dawla setelah sepupunya Abu Sa'd dipenjara pada tahun 417; hambanya membunuhnya dalam Ahvaz di Dhu al-Hijjah 422 H, pada usia lima puluh enam {cite:muntazam-ibn-al-jawzi j.8 hlm.403}."
