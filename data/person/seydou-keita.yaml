summary:
  ar: "لاعب كرة قدم مالي معتزل، وُلد في باماكو سنة 1980. لاعب وسط لعب في فرنسا لمرسيليا ولوريان ولانس، ثم لإشبيلية وبرشلونة في إسبانيا — وكان أول لاعب مالي يمثّل برشلونة — ولاحقًا لروما الإيطالي، ومثّل منتخب مالي سنوات طويلة."
  en: "Malian retired footballer, born in Bamako in 1980. A midfielder who played in France for Marseille, Lorient and Lens, then for Sevilla and Barcelona in Spain — he was the first Malian to play for Barcelona — and later for Roma in Italy; he represented Mali for many years."
  ur: "مالی کے ریٹائرڈ فٹبالر، 1980 میں باماکو میں پیدا ہوئے۔ مڈفیلڈر جو فرانس میں مارسیلے، لوریاں اور لانس کے لیے، پھر اسپین میں سیویلا اور بارسلونا کے لیے کھیلے — بارسلونا کے لیے کھیلنے والے پہلے مالی کھلاڑی — اور بعد میں اٹلی میں روما کے لیے؛ برسوں مالی کی نمائندگی کی۔"
