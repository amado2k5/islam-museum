summary:
  ar: "بطاقة أولية لميران شاه بن تيمور، ابن تيمور الذي حكم الغرب ونازع على الخلافة بعد أبيه، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Miran Shah ibn Timur, Timur's son who ruled the west and disputed the succession, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Miran Shah ibn Timur, hijo de Timur que gobernó Occidente y disputó la sucesión, nombrado a partir de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de candidature de Miran Shah ibn Timur, fils de Timur qui régna sur l'ouest et contesta la succession, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "میران شاہ ابن تیمور کے لیے ڈرافٹ کارڈ، تیمور کے بیٹے، جس نے مغرب پر حکومت کی اور جانشینی پر اختلاف کیا، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
