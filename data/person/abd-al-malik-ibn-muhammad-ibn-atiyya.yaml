label: { ar: "عبد الملك بن محمد بن عطية السعدي", en: "'Abd al-Malik ibn Muhammad ibn 'Atiyya", fr: "'Abd al-Malik ibn Muhammad ibn 'Atiyya", es: "'Abd al-Malik ibn Muhammad ibn 'Atiyya", ur: "عبد الملک بن محمد بن عطیہ" }
summary:
  ar: "جهزه مروان بن محمد سنة ثلاثين ومائة في جيش فقتل بلخ بن عقبة بوادي القرى ثم لحق أبا حمزة فقتله وأكثر من معه، ثم التقى عبد الله بن يحيى الكندي بجرش فقتله وأكثر أصحابه، ونزل صنعاء {cite:muruj-al-dhahab p. 229}."
  en: "Marwan's commander who destroyed the Hijazi-Yemeni Ibadis — Balakh at Wadi al-Qura, Abu Hamza at Mecca, Talib al-Haqq at Jurash — and entered San'a' {cite:muruj-al-dhahab p. 229}."
  fr: "Le commandant de Marwan qui écrasa les ibadites du Hedjaz et du Yémen — Balakh à Wadi al-Qura, Abu Hamza à La Mecque, Talib al-Haqq à Jurash — et entra à Sanaa {cite:muruj-al-dhahab p. 229}."
  es: "El comandante de Marwan que destruyó a los ibadis hijazi-yemeníes (Balakh en Wadi al-Qura, Abu Hamza en La Meca, Talib al-Haqq en Jurash) y entró en San'a' {cita:muruj-al-dhahab p. 229}."
  ur: "مروان کا کمانڈر جس نے حجازی یمنی عبادیوں کو تباہ کیا - وادی القراء میں بلخ، مکہ میں ابو حمزہ، جورش میں طالب الحق - اور صنعاء میں داخل ہوا۔ 229}۔"
  tr: "Mervan bin Muhammed, 130 yılında ona bir ordu verdi; böylece Vadi el-Kura'da Belh bin Ukba'yı öldürdü, sonra Ebu Hamza'yı yakalayıp onu ve yanındakilerin çoğunu öldürdü, ardından Ceraş'ta Abdullah bin Yahya el-Kindi ile karşılaştı ve onu ve arkadaşlarının çoğunu öldürdü ve Sana'a'ya indi. {Kaynak: Muruj el-Dhahab s. 229}"
  id: "Marwan bin Muhammad melengkapinya pada tahun seratus tiga puluh dengan pasukan, sehingga ia membunuh Balkh bin Uqba di Wadi al-Qura, kemudian ia mengejar Abu Hamza dan membunuhnya beserta sebagian besar pengikutnya, lalu ia bertemu Abdullah bin Yahya al-Kindi di Jarash dan membunuhnya beserta sebagian besar pengikutnya, dan ia turun ke Sana'a {kutip:muruj-al-dhahab hlm. 229}."
