summary: {ar: 'منصور بن نصر الحراني ثم البغدادي، أبو بكر، ظهير الدين ابن العطار: وزير كاتب وصاحب المخزن، ولي الوزارة للمستضيء سنة ٥٧٣ هـ ثم قبض عليه الناصر وأخرج من محبسه ميتاً سنة ٥٧٥ هـ الموافقة ١١٨٠ م.', en: 'Mansur ibn Nasr al-Harrani then al-Baghdadi, Abu Bakr, Zahir al-Din ibn al-Attar: a secretary and vizier, keeper of the Makhzan, vizier of al-Mustadi'' from 573 AH, seized by al-Nasir and brought out of prison dead in 575 AH (1180 CE).', es: "Mansur ibn Nasr al-Harrani, luego al-Baghdadi, Abu Bakr, Zahir al-Din ibn al-Attar: un secretario y visir, guardián del Makhzan, visir de al-Mustadi' desde 573 AH, apresado por al-Nasir y sacado de prisión muerto en 575 AH (1180 CE).", fr: "Mansur ibn Nasr al-Harrani puis al-Baghdadi, Abu Bakr, Zahir al-Din ibn al-Attar: un secrétaire et vizir, gardien du Makhzan, vizir d'al-Mustadi' à partir de 573 AH, saisi par al-Nasir et sorti de prison mort en 575 AH (1180 CE).", ur: "منصور بن نصر الحرانی پھر البغدادی، ابوبکر، ظاہر الدین ابن العطار: ایک سیکرٹری اور وزیر، مخزن کا رکھوالا، 573 ہجری سے المستدی کا وزیر، جسے النصیر نے پکڑا اور 575 ہجری میں مردہ حالت میں جیل سے باہر لایا (1111)۔", tr: "Mansur bin Nasr el-Harrani o zaman el-Bağdadi, Ebu Bekir, Zahir al-Din ibn al-Attar: vezir, yazıcı ve makhzenin sahibi, 573 Hicri'de el-Mustadi'ye vezir olarak atadı, ardından el-Nasir onu tutukladı ve 575 Hicri yılında, yani 1180 M.S. yılına denk gelirken hapisten serbest bıraktı.", id: "Mansur ibn Nasr al-Harrani kemudian al-Baghdadi, Abu Bakr, Zahir al-Din ibn al-Attar: wazir, juru tulis, dan pemilik makhzen, diangkat sebagai wazir al-Mustadi' pada tahun 573 H, kemudian al-Nasir menangkapnya dan membebaskannya dari penjara dalam keadaan tewas pada tahun 575 H, yang bertepatan dengan tahun 1180 M."}
