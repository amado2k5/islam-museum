label: { ar: "سعيد بن العاص بن سعيد بن العاص بن أمية", en: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya" , ur: "سعید بن عاص"}
summary:
  ar: "سعيد بن العاص بن سعيد بن العاص بن أمية؛ عند البلاذري: كان عامل عثمان بن عفان على الكوفة فكتب إليه عثمان يأمره بإمداد حبيب بن مسلمة بأرمينية بجيش عليه سلمان بن ربيعة الباهلي فسار إليه في ستة آلاف رجل من أهل الكوفة. ولما دخل الكوفة والياً أبى أن يصعد المنبر حتى يغسل وقال إن الوليد كان نجساً رجساً {cite:muruj-al-dhahab p. 631} وكان أحد القرشيين الثلاثة في لجنة عثمان لنسخ المصاحف مع زيد بن ثابت {cite:sahih-al-bukhari 4987}."
  en: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya; in al-Baladhuri: he was Uthman ibn Affan's governor of Kufa, to whom Uthman wrote ordering him to reinforce Habib ibn Maslama in Armenia with an army under Salman ibn Rabi'a al-Bahili, who marched to him with six thousand Kufans."
  ur: "عثمان بن عفان کے دور میں کوفہ کے گورنر؛ آرمینیا میں حبیب بن مسلمہ کی مدد کے لیے سلمان بن ربیعہ کی قیادت میں فوج بھیجنے کا حکم انہیں ملا تھا۔ {cite:futuh-buldan-maarif-1407}"
