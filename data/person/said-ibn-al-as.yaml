label: { ar: "سعيد بن العاص بن سعيد بن العاص بن أمية", en: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya" , ur: "سعید بن عاص", es: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya", fr: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya"}
summary:
  ar: "سعيد بن العاص بن سعيد بن العاص بن أمية؛ عند البلاذري: كان عامل عثمان بن عفان على الكوفة فكتب إليه عثمان يأمره بإمداد حبيب بن مسلمة بأرمينية بجيش عليه سلمان بن ربيعة الباهلي فسار إليه في ستة آلاف رجل من أهل الكوفة. ولما دخل الكوفة والياً أبى أن يصعد المنبر حتى يغسل وقال إن الوليد كان نجساً رجساً {cite:muruj-al-dhahab p. 631} وكان أحد القرشيين الثلاثة في لجنة عثمان لنسخ المصاحف مع زيد بن ثابت {cite:sahih-al-bukhari 4987}."
  en: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya; in al-Baladhuri: he was Uthman ibn Affan's governor of Kufa, to whom Uthman wrote ordering him to reinforce Habib ibn Maslama in Armenia with an army under Salman ibn Rabi'a al-Bahili, who marched to him with six thousand Kufans."
  ur: "عثمان بن عفان کے دور میں کوفہ کے گورنر؛ آرمینیا میں حبیب بن مسلمہ کی مدد کے لیے سلمان بن ربیعہ کی قیادت میں فوج بھیجنے کا حکم انہیں ملا تھا۔ {cite:futuh-buldan-maarif-1407}"
  es: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya; en al-Baladhuri: fue gobernador de Kufa por Uthman ibn Affan, a quien Uthman le escribió ordenándole que reforzara a Habib ibn Maslama en Armenia con un ejército bajo el mando de Salman ibn Rabi'a al-Bahili, quien marchó hacia él con seis mil kufanos."
  fr: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya; dans al-Baladhuri: il était le gouverneur de Kufa d'Uthman ibn Affan, à qui Uthman écrivit pour lui ordonner de renforcer Habib ibn Maslama en Arménie avec une armée sous le commandement de Salman ibn Rabi'a al-Bahili, qui marcha vers lui avec six mille Kufans."
  tr: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayyah; el-Baladhuri'ye göre: O, Osman bin Affan'ın Kufe üzerindeki valisiydi ve Osman ona Habib bin Maslama'ya Salman bin Rabi'ah el-Behili komutasındaki bir Ermeni ordusu sağlamasını emretti, böylece altı bin adamla Kufe'den yürüdü. Kufe'ye girdiğinde, vali kürsüye çıkıp kendini yıkamayı reddetti; el-Velid'in kirli ve kirli olduğunu söyledi {atıf:Muruj-al-Dhahab, s. 631}} ve Osman'ın Kur'anları Zeyd bin Tebit ile kopyalama komitesindeki üç Kureyşiden biri olduğunu {cite:sahih-al-bukhari 4987}."
  id: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayyah; menurut al-Baladhuri: Ia adalah gubernur Uthman ibn Affan atas Kufa, dan Uthman menulis kepadanya memerintahkan agar Habib ibn Maslama menyediakan pasukan Armenia yang dipimpin oleh Salman ibn Rabi'ah al-Bahili, sehingga ia berbaris dengan enam ribu orang dari Kufa. Ketika ia memasuki Kufa, gubernur menolak naik ke mimbar untuk mandi, mengatakan bahwa al-Walid tidak murni dan tidak murni {cite:muruj-al-dhahab, hlm. 631}, dan ia adalah salah satu dari tiga Quraiyah dalam komite Uthman untuk menyalin Al-Qur'an bersama Zayd ibn Thabit {cite:sahih-al-bukhari 4987}."
