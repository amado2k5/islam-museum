summary:
  ar: "سعيد بن العاص بن سعيد بن العاص بن أمية؛ عند البلاذري: كان عامل عثمان بن عفان على الكوفة فكتب إليه عثمان يأمره بإمداد حبيب بن مسلمة بأرمينية بجيش عليه سلمان بن ربيعة الباهلي فسار إليه في ستة آلاف رجل من أهل الكوفة.، ولما دخل الكوفة والياً أبى أن يصعد المنبر حتى يغسل وقال إن الوليد كان نجساً رجساً {cite:muruj-al-dhahab p. 631}"
  en: "Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya; in al-Baladhuri: he was Uthman ibn Affan's governor of Kufa, to whom Uthman wrote ordering him to reinforce Habib ibn Maslama in Armenia with an army under Salman ibn Rabi'a al-Bahili, who marched to him with six thousand Kufans."
