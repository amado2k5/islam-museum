  fr: "Fils d'al-Abbas ibn Abd al-Muttalib, frère d'Abdallah, de Qutham et de Tammam, il est cité dans l'ouvrage comme gouverneur du Yémen et de Bahreïn par Ali (voir: Sallabi Ali, vol. 1, p. 358), parmi les fils d'al-Abbas qu'il nomma (voir: Sallabi Ali, vol. 1, p. 357)."
