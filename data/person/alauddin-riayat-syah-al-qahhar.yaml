summary:
  ar: "ثالث سلاطين آتشيه (حكم 1537/1539–1571)، الابن الثاني لمؤسسها علي مغيات شاه. انتزع العرش من أخيه صلاح الدين، ونظّم الدولة الأتشيهية، وحارب البرتغاليين وحلفاءهم من الملايويين فنهب جوهر عام 1564، وافتتح سفارة آتشيه الشهيرة إلى السلطان العثماني سليمان القانوني فوصلت مدافع ومدفعيون عثمانيون إلى آتشيه في ستينيات القرن السادس عشر."
  en: "Third sultan of Aceh (r. 1537/1539–1571), younger son of the founder Ali Mughayat Syah. He seized the throne from his brother Salahuddin, organised the Acehnese state, campaigned against the Portuguese and their Malay allies, sacked Johor in 1564, and opened Aceh's celebrated embassy to the Ottoman sultan Suleiman the Magnificent, whose gunners and cannon reached Aceh in the 1560s."
  ur: "آچے کے تیسرے سلطان (دورِ حکومت 1537/1539ء–1571ء)، بانی علی مغایت شاہ کے دوسرے بیٹے۔ انھوں نے تخت اپنے بھائی صلاح الدین سے چھینا، آچے ریاست کو منظم کیا، پرتگالیوں اور ان کے ملائی اتحادیوں سے جنگ کی، 1564ء میں جوہر کو لوٹا اور عثمانی سلطان سلیمان عالیشان کے دربار میں آچے کی مشہور سفارت کا آغاز کیا، جس سے 1560ء کی دہائی میں عثمانی توپچی اور توپیں آچے پہنچیں۔"

