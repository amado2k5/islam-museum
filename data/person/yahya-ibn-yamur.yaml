summary:
  ar: "يحيى بن يعمر، أبو سليمان الليثي البصري، من علماء التابعين، عارف بالحديث والفقه ولغات العرب. روى عن عثمان وعلي وعمار وأبي ذر وأبي هريرة، وعنه يحيى بن عقيل وعطاء الخراساني وقتادة وعكرمة. وهو أول من نقط المصاحف، وولاه الحجاج قضاء مرو، وكان يقضي بالشاهد واليمين. توفي سنة 129هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3496}"
  en: "Yahya ibn Yamur, Abu Sulayman al-Layti al-Basri, one of the Successors, learned in hadith, fiqh and the Arabic tongues. He narrated from Uthman, Ali, Ammar, Abu Dharr and Abu Hurayra; Yahya ibn Uqayl, Ata al-Khurasani, Qatada and Ikrima narrated from him. He was the first to dot the copies of the Qur'an, and al-Hajjaj appointed him judge of Marw, where he judged by one witness and an oath. He died in 129 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3496}"
sources: [source/fiqh-mawsua-kuwaitiyya-noor-v3]
