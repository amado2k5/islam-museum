summary:
  ar: "يحيى بن يعمر، أبو سليمان الليثي البصري، من علماء التابعين، عارف بالحديث والفقه ولغات العرب. روى عن عثمان وعلي وعمار وأبي ذر وأبي هريرة، وعنه يحيى بن عقيل وعطاء الخراساني وقتادة وعكرمة. وهو أول من نقط المصاحف، وولاه الحجاج قضاء مرو، وكان يقضي بالشاهد واليمين. توفي سنة 129هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3496}"
  en: "Yahya ibn Yamur, Abu Sulayman al-Layti al-Basri, one of the Successors, learned in hadith, fiqh and the Arabic tongues. He narrated from Uthman, Ali, Ammar, Abu Dharr and Abu Hurayra; Yahya ibn Uqayl, Ata al-Khurasani, Qatada and Ikrima narrated from him. He was the first to dot the copies of the Qur'an, and al-Hajjaj appointed him judge of Marw, where he judged by one witness and an oath. He died in 129 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3496}"
  es: "Yahya ibn Yamur, Abu Sulayman al-Layti al-Basri, uno de los Sucesores, era un erudito en hadices, fiqh y lengua árabe. Narró de Uthman, Ali, Ammar, Abu Dharr y Abu Hurayra; Yahya ibn Uqayl, Ata al-Khurasani, Qatada e Ikrima narraron de él. Fue el primero en puntear las copias del Corán, y al-Hajjaj lo nombró juez de Marw, donde juzgaba con un solo testigo y un juramento. Murió en el año 129 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3496}"
  fr: "Yahya ibn Yamur, Abu Sulayman al-Layti al-Basri, l'un des Successeurs, était un érudit en hadith, en fiqh et en langues arabes. Il rapporta des hadiths d'après Uthman, Ali, Ammar, Abu Dharr et Abu Hurayra; Yahya ibn Uqayl, Ata al-Khurasani, Qatada et Ikrima rapportèrent également des hadiths de lui. Il fut le premier à annoter les copies du Coran, et al-Hajjaj le nomma juge de Marw, où il rendait la justice sur la base d'un seul témoin et d'un serment. Il mourut en 129 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3496}"
  ur: "یحییٰ بن یمور، ابو سلیمان لیتی البصری، جو جانشینوں میں سے تھے، حدیث، فقہ اور عربی زبانیں سیکھتے تھے۔ انہوں نے عثمان، علی، عمار، ابوذر اور ابو ہریرہ سے روایت کی ہے۔ ان سے یحییٰ بن عقیل، عطاء خراسانی، قتادہ اور عکرمہ نے روایت کی ہے۔ وہ قرآن کے نسخوں پر نقطے لگانے والے پہلے شخص تھے، اور الحجاج نے اسے مرو کا قاضی مقرر کیا، جہاں اس نے ایک گواہ اور حلف کے ذریعے فیصلہ کیا۔ ان کی وفات 129ھ میں ہوئی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص3496}"
