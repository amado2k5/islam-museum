summary:
  ar: "علي بن موسى بن يزداد، من أهل قم ثم قدم نيسابور، إمام الحنفية في عصره، وله كتب في الرد على أصحاب الشافعي، ومن تصانيفه «كتاب الضحايا». توفي سنة 305هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2066}"
  en: "Ali ibn Musa ibn Yazdad, from Qum, later of Nishapur, the leading Hanafi of his time, who wrote books refuting the followers of al-Shafi'i; his work includes 'Kitab al-dahaya' on sacrifices. He died in 305 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2066}"
  es: "Ali ibn Musa ibn Yazdad, originario de Qom y posteriormente residente de Nishapur, fue el principal hanafí de su época y autor de libros que refutaban a los seguidores de al-Shafi'i. Entre sus obras destaca el «Kitab al-dahaya» sobre los sacrificios. Falleció en el año 305 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2066}"
  fr: "Ali ibn Musa ibn Yazdad, originaire de Qom, puis de Nishapur, fut le principal hanafite de son temps. Il écrivit des ouvrages réfutant les disciples d'al-Shafi'i; parmi ses œuvres figure le « Kitab al-dahaya » sur les sacrifices. Il mourut en 305 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2066}"
  ur: "علی بن موسیٰ بن یزداد، قم سے، بعد میں نیشاپور کے، اپنے وقت کے معروف حنفی، جنہوں نے شافعی کے پیروکاروں کی تردید میں کتابیں لکھیں۔ ان کے کام میں قربانیوں پر 'کتاب الضحیٰ' شامل ہے۔ ان کی وفات 305ھ میں ہوئی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2066}"
  tr: "Kum'lu ve daha sonra Nişapur'a gelen Ali ibn Musa ibn Yezdad, kendi döneminde Hanefi mezhebinin imamı olmuştur. El-Şafii'nin sahabelerini çürüten kitaplar yazmış ve eserleri arasında 'Kitab al-Dhabana' adlı kitap bulunmaktadır. 305 Hicri yılında vefat etmiştir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.2066}"
  id: "Ali ibn Musa ibn Yazdad, dari Qom dan kemudian datang ke Nishapur, adalah imam mazhab Hanafi pada masanya. Ia menulis buku-buku yang membantah para sahabat al-Shafi'i, dan di antara karyanya adalah buku 'Kitab al-Dhabana'. Ia meninggal pada tahun 305 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2066}"
