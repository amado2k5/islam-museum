label:
  ar: موسى بن أبي العافية
  en: Musa ibn Abi al-Afiya
  es: "Musa ibn Abi al-Afiya"
  fr: "Musa ibn Abi al-Afiya"
  ur: "موسیٰ ابن ابی العفیہ"
summary:
  ar: "موسى بن أبي العافية المكناسي، أكبر ملوك بطنه على الإطلاق؛ دخل أولاً في مظاهرة الأدارسة وولّاه ابن إدريس على تاهرت والمغرب الأوسط، ثم دعا لعبيد الله المهدي الشيعي وطرد يحيى بن إدريس عن فاس وملك المغرب باسم القيروان، وحارب الحسن بن محمد الإدريسي الحجّام فكانت له العاقبة بوادي المطاحن بين تازا وفاس؛ ثم زحف إليه ميسور الخصي سنة 323هـ فاعتصم بحصن وأُجلي عن أعماله إلى نواحي ملوية ووطاط، وعاد من الصحراء فملك أعماله مرة أخرى وحاصر مدينة نكور، وبقي رأس مكناسة وموالياً لبني زيري إلى أن انقرض أمر بنيه على يد المرابطين."
  en: "Musa ibn Abi al-Afiya al-Miknasi, the greatest king of his branch; first an Idrisid client holding Tahert and the Middle Maghreb, then he proclaimed Ubaydallah al-Mahdi's da'wa, expelled Yahya ibn Idris from Fez and ruled the Maghreb for Qayrawan, beat the Idrisid al-Hajjam at Wadi al-Matahin between Taza and Fez — until the eunuch Maysur marched in 323 and exiled him to the Malwiyya desert; he returned, besieged Nekour, and remained chief of Miknasa as a Zirid client until the Almoravids destroyed his house."
  es: "Musa ibn Abi al-Afiya al-Miknasi, el rey más grande de su rama; primero un vasallo idrisí que controlaba Tahert y el Magreb Medio, luego proclamó la da'wa de Ubaydallah al-Mahdi, expulsó a Yahya ibn Idris de Fez y gobernó el Magreb para Qayrawan, derrotó al idrisí al-Hajjam en Wadi al-Matahin entre Taza y Fez, hasta que el eunuco Maysur marchó en 323 y lo exilió al desierto de Malwiyya; regresó, sitió Nekour y permaneció como jefe de Miknasa como vasallo zirí hasta que los almorávides destruyeron su casa."
  fr: "Musa ibn Abi al-Afiya al-Miknasi, le plus grand roi de sa branche; d'abord client des Idrissides, il détenait Tahert et le Maghreb moyen, puis il proclama la da'wa d'Ubaydallah al-Mahdi, expulsa Yahya ibn Idris de Fès et gouverna le Maghreb pour Qayrawan, vainquit l'Idrisside al-Hajjam à Wadi al-Matahin entre Taza et Fès — jusqu'à ce que l'eunuque Maysur marche en 323 et l'exile dans le désert de Malwiyya; il revint, assiégea Nekour et resta chef de Miknasa en tant que client des Zirides jusqu'à ce que les Almoravides détruisent sa maison."
  ur: "موسیٰ بن ابی العفیہ المکناسی، اس کی شاخ کا سب سے بڑا بادشاہ؛ سب سے پہلے ایک ادریسی گاہک جس نے طہرت اور درمیانی مغرب پر قبضہ کیا، پھر اس نے عبیداللہ المہدی کی دعوت کا اعلان کیا، یحییٰ بن ادریس کو فیز سے نکال دیا اور مغرب پر قیروان کے لیے حکومت کی، ادریسید الحجام کو وادی المطحین کے مقام پر شکست دی، تازہ اور فزیل 3 سے مارچ 3 تک۔ مالویہ صحرا؛ وہ واپس آیا، نیکور کا محاصرہ کر لیا، اور ایک زیرد کلائنٹ کے طور پر مکناسا کا سربراہ رہا یہاں تک کہ الموراویڈز نے اس کے گھر کو تباہ کر دیا۔"
  tr: "Musa ibn Abi el-Afiyye el-Miknasi, kabilesinin açık ara en büyük kralı; önce İdrisi protestolarına katıldı ve İbn İdris tarafından Tahir ve merkezi Mağrip'in başına atandı. Sonra Şii Ubeydullah el-Mehdi'yi çağırdı, Yahya bin İdris'i Fez'den kovdu ve Mağrip'i Kayruan olarak yönetti. Marangoz el-Hasan ibn Muhammed el-İdrisi ile savaştı ter, sonunda Taza ile Fez arasındaki Wadi al-Matahin'de sona erdi. Sonra Maysur al-Khasi 323 Hicri'de ona doğru ilerledi, bir kaleye sığındı ve ordusundan Moulouya ve Watat bölgelerine tahliye edildi. Çölden döndü, işlerini geri aldı ve Nakur şehrini kuşattı. Meknassa'nın başında kaldı ve oğulları Almoravidler tarafından yok edilene kadar Banu Ziri'ye sadık kaldı."
  id: "Musa ibn Abi al-Afiyyah al-Miknasi, raja terbesar dari sukunya; ia pertama kali bergabung dengan protes Idriyah dan diangkat oleh Ibn Idris atas Tahirt dan Maghreb tengah. Kemudian ia memanggil Ubayd Allah al-Mahdi si Syiah dan mengusir Yahya ibn Idris dari Fez, serta memerintah Maghreb sebagai Kairouan. Ia bertempur melawan al-Hasan ibn Muhammad al-Idrisi si tukang kayu, yang akhirnya berakhir di Wadi al-Matahin antara Taza dan Fez. Kemudian Maysur al-Khasi maju kepadanya pada tahun 323 H, berlindung di sebuah benteng, dan dievakuasi dari pasukannya ke wilayah Moulouya dan Watat. Ia kembali dari gurun dan merebut kembali urusannya serta mengepung kota Nakur. Ia tetap memimpin Meknassa dan setia kepada Banu Ziri hingga putra-putranya dimusnahkan oleh Almoravid."
