label:
  ar: موسى بن أبي العافية
  en: Musa ibn Abi al-Afiya
summary:
  ar: "موسى بن أبي العافية المكناسي، أكبر ملوك بطنه على الإطلاق؛ دخل أولاً في مظاهرة الأدارسة وولّاه ابن إدريس على تاهرت والمغرب الأوسط، ثم دعا لعبيد الله المهدي الشيعي وطرد يحيى بن إدريس عن فاس وملك المغرب باسم القيروان، وحارب الحسن بن محمد الإدريسي الحجّام فكانت له العاقبة بوادي المطاحن بين تازا وفاس؛ ثم زحف إليه ميسور الخصي سنة 323هـ فاعتصم بحصن وأُجلي عن أعماله إلى نواحي ملوية ووطاط، وعاد من الصحراء فملك أعماله مرة أخرى وحاصر مدينة نكور، وبقي رأس مكناسة وموالياً لبني زيري إلى أن انقرض أمر بنيه على يد المرابطين."
  en: "Musa ibn Abi al-Afiya al-Miknasi, the greatest king of his branch; first an Idrisid client holding Tahert and the Middle Maghreb, then he proclaimed Ubaydallah al-Mahdi's da'wa, expelled Yahya ibn Idris from Fez and ruled the Maghreb for Qayrawan, beat the Idrisid al-Hajjam at Wadi al-Matahin between Taza and Fez — until the eunuch Maysur marched in 323 and exiled him to the Malwiyya desert; he returned, besieged Nekour, and remained chief of Miknasa as a Zirid client until the Almoravids destroyed his house."
