summary:
  ar: "آخر خلفاء بني عبد المؤمن الموحدين؛ دخل مراكش في الحادي والعشرين من المحرم سنة خمس وستين وست مئة فهرب المرتضى إلى آزمور فقبض عليه عامله وقتله بموضع يقال له كتامة، وأقام الواثق ثلاث سنين وقتل في الحرب بينه وبين بني مرين ملوك تلمسان في المحرم سنة ثمان وستين بموضع بينه وبين مراكش مسيرة ثلاثة أيام في جهتها الشمالية، فانقرضت دولة بني عبد المؤمن واستولى بنو مرين على ملكهم {cite:wafayat-ayan p. 15-16}."
  en: "The last Almohad caliph, Abu Dabus al-Wathiq — he took Marrakesh in Muharram 665 and had al-Murtada killed at Kutama, then fell in the war with the Marinids in Muharram 668, whereupon the house of 'Abd al-Mu'min ended and the Marinids took their kingdom {cite:wafayat-ayan p. 15-16}."
