label: { ar: "عبد الله بن الربيع بن زياد", en: "Abdallah ibn al-Rabi' ibn Ziyad", fr: "Abdallah ibn al-Rabi' ibn Ziyad", es: "Abdallah ibn al-Rabi' ibn Ziyad", ur: "عبداللہ بن ربیع ابن زیاد" }
summary:
  ar: "عبد الله بن الربيع بن زياد الحارثي؛ استخلفه أبوه على خراسان سنة ٥٣ فقاتل أهل آمل وهي آموية وزم ثم صالحهم ورجع إلى مرو فمكث بها شهرين ثم مات."
  en: "Abdallah ibn al-Rabi' ibn Ziyad al-Harithi; succeeded his father over Khurasan in 53h, fought Amul and Zamm into a sulh, and died at Marw two months later."
  fr: "Abdallah ibn al-Rabi' ibn Ziyad al-Harithi ; il succéda à son père sur le Khorassan en 53 H, combattit Amul et Zamm jusqu'à un accord de paix, et mourut à Merv deux mois plus tard."
  es: "Abdallah ibn al-Rabi' ibn Ziyad al-Harithi sucedió a su padre en el gobierno de Jorasán en el año 53 de la Hégira, libró una contienda por Amul y Zamm, y murió en Marw dos meses después."
  ur: "عبداللہ بن الربیع ابن زیاد الحارثی؛ 53ھ میں خراسان پر اپنے والد کی جانشینی کی، امول اور زم سے جنگ کی اور دو ماہ بعد مرو میں وفات پائی۔"
  tr: "Abdullah ibn al-Rabi’ ibn Ziyad al-Harithi; babası onu 53 yılında Horasan'da vekili olarak atadı. Emevi olan Amul ve Zam halkıyla savaştı, sonra onlarla barıştı ve Merv'e döndü. Orada iki ay kaldıktan sonra öldü."
  id: "Abdullah ibn al-Rabi’ ibn Ziyad al-Harithi; ayahnya mengangkatnya sebagai wakilnya atas Khorasan pada tahun 53. Ia berperang melawan penduduk Amul, yang merupakan keturunan Umayyah, dan Zam, kemudian ia berdamai dengan mereka dan kembali ke Merv, tempat ia tinggal selama dua bulan, lalu ia meninggal dunia."
