summary:
  ar: "عالم دين ولاهوتي بوسني من أبرز علماء الإصلاح في يوغوسلافيا الاشتراكية. درس في سراييفو ثم في كلية الشريعة بالأزهر، وعمل بعد الحرب العالمية وسجنه بسبب خدمته إمامًا في فرقة هاندجار داخل مؤسسات الجماعة الإسلامية، فرأس جمعية العلماء وأسّس صحيفة «بريپورود» ودرّس تفسير القرآن في كلية الدراسات الإسلامية بسراييفو، واشتهرت فتاواه المنشورة في عمود «فتاوى دوزو»؛ أعيد اعتباره رسميًا سنة 1990."
  en: "Bosnian Islamic theologian and reformist scholar, among the leading Muslim thinkers of socialist Yugoslavia. Trained in Sarajevo and at al-Azhar's Sharia faculty, he was imprisoned after the Second World War for his service as an imam in the Handžar Division, then rose within the Islamic Community — president of the Ulema Association, founder of the newspaper Preporod, professor of Qur'anic interpretation at Sarajevo's Islamic Theological Faculty, and author of the widely read 'Đozo's fatwas' column. He was officially rehabilitated in 1990."
  ur: "بوسنیائی مسلمان عالمِ دین اور مصلح، اشتراکی یوگوسلاویہ کے نمایاں مسلم مفکرین میں سے ایک۔ سرائیوو اور جامعہ ازہر کی کلیۃ الشریعہ سے تعلیم پائی؛ دوسری جنگِ عظیم میں ہاندجار ڈویژن میں امام کی حیثیت سے خدمت پر جنگ کے بعد قید ہوئے، پھر اسلامی برادری کے اداروں میں نمایاں ہوئے: علماء ایسوسی ایشن کے صدر، اخبار «پریپورود» کے بانی، سرائیوو کی اسلامک تھیولوجیکل فیکلٹی میں تفسیرِ قرآن کے پروفیسر، اور مشہور کالم «دوزو کے فتاوے» کے مصنف۔ 1990 میں سرکاری طور پر ان کی بحالیِ عزت ہوئی۔"
