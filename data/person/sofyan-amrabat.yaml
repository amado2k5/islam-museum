summary:
  ar: "لاعب كرة قدم مغربي محترف (وُلد سنة 1996 في هاوزن بهولندا). لاعب وسط دفاعي تدرّج في أوترخت ولعب لفينورد وكلوب بروج وهيلاس فيرونا وفيورنتينا ومانشستر يونايتد وفنربخشة قبل أن ينضم إلى أياكس سنة 2026؛ دولي مغربي شارك في ثلاث كؤوس عالم وفاز مع بلاده بكأس أمم أفريقيا 2025."
  en: "Moroccan professional footballer (born 1996 in Huizen, Netherlands). A defensive midfielder who came through Utrecht and played for Feyenoord, Club Brugge, Hellas Verona, Fiorentina, Manchester United and Fenerbahçe before joining Ajax in 2026; a Morocco international who played at three World Cups and won the 2025 Africa Cup of Nations with his country."
  ur: "مراکشی پیشہ ور فٹبالر (پیدائش 1996، ہاؤزن، نیدرلینڈز)۔ دفاعی مڈفیلڈر جو اوٹریخت سے ابھرے اور فینورڈ، کلب بروج، ہیلاس ویرونا، فیورنٹینا، مانچسٹر یونائیٹڈ اور فنربخشے کے بعد 2026 میں ایاکس میں شامل ہوئے؛ مراکش کے بین الاقوامی کھلاڑی جنہوں نے تین ورلڈ کپ کھیلے اور 2025 افریقہ کپ آف نیشنز جیتا۔"
