summary:
  ar: "محمد صديق خان بن حسن بن علي بن لطف الله، أبو الطيب، الحسيني البخاري القنوجي، عالم أمير شارك في أنواع من العلوم، وله نحو ستين مصنفا بالعربية والفارسية والهندية، ولقب بنواب عالي الجاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} من تصانيفه: حسن الأسوة، وفتح البيان في مقاصد القرآن، ونيل المرام في تفسير آيات الأحكام، والروضة الندية، وعون الباري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8518}"
  en: "Muhammad Siddiq Khan ibn Hasan ibn Ali, Abu al-Tayyib, of the Husayni family, al-Bukhari, al-Qannawji, a scholar and prince who worked in many fields and wrote some sixty works in Arabic, Persian and Hindi. He studied at Delhi, moved to Bhopal to earn a living, grew wealthy, married the ruler of Bhopal and held the title of Nawwab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} His works include Husn al-Uswa, Fath al-Bayan fi maqasid al-Qur'an, Nayl al-Maram fi tafsir ayat al-ahkam, al-Rawda al-nadiyya, and 'Awn al-Bari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8518}"
  es: "Muhammad Siddiq Khan ibn Hasan ibn Ali, Abu al-Tayyib, de la familia Husayni, al-Bukhari, al-Qannawji, un erudito y príncipe que trabajó en muchos campos y escribió unas sesenta obras en árabe, persa e hindi. Estudió en Delhi, se mudó a Bhopal para ganarse la vida, se enriqueció, se casó con la gobernante de Bhopal y ostentó el título de Nawwab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} Sus obras incluyen Husn al-Uswa, Fath al-Bayan fi maqasid al-Qur'an, Nayl al-Maram fi tafsir ayat al-ahkam, al-Rawda al-nadiyya y 'Awn al-Bari. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8518}"
  fr: "Muhammad Siddiq Khan ibn Hasan ibn Ali, Abu al-Tayyib, de la famille Husayni, al-Bukhari, al-Qannawji, était un érudit et prince aux multiples talents, auteur d'une soixantaine d'ouvrages en arabe, en persan et en hindi. Après des études à Delhi, il s'installa à Bhopal pour subvenir à ses besoins, où il fit fortune. Il épousa la souveraine de Bhopal et reçut le titre de Nawwab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} Parmi ses œuvres figurent Husn al-Uswa, Fath al-Bayan fi maqasid al-Qur'an, Nayl al-Maram fi tafsir ayat al-ahkam, al-Rawda al-nadiyya et 'Awn al-Bari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8518}"
