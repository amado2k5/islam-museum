  en: "Muhammad Siddiq Hasan Khan al-Qannawji"
summary:
  ar: "محمد صديق خان بن حسن بن علي بن لطف الله، أبو الطيب، الحسيني البخاري القنوجي، عالم أمير شارك في أنواع من العلوم، وله نحو ستين مصنفا بالعربية والفارسية والهندية، ولقب بنواب عالي الجاه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} من تصانيفه: حسن الأسوة، وفتح البيان في مقاصد القرآن، ونيل المرام في تفسير آيات الأحكام، والروضة الندية، وعون الباري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8518}"
  en: "Muhammad Siddiq Khan ibn Hasan ibn Ali, Abu al-Tayyib, of the Husayni family, al-Bukhari, al-Qannawji, a scholar and prince who worked in many fields and wrote some sixty works in Arabic, Persian and Hindi. He studied at Delhi, moved to Bhopal to earn a living, grew wealthy, married the ruler of Bhopal and held the title of Nawwab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} His works include Husn al-Uswa, Fath al-Bayan fi maqasid al-Qur'an, Nayl al-Maram fi tafsir ayat al-ahkam, al-Rawda al-nadiyya, and 'Awn al-Bari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8518}"
