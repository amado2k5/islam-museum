summary:
  en: "The aged, honoured chief of Taym ibn Murra in whose house the Fudul pact was sworn — a byword in Mecca for hospitality."
  ar: "شيخ تيم بن مرة الكبير صاحب الشرف؛ في داره اجتمع حالفو الفضول وتعاقدوا على نصرة المظلوم بمكة. وعند المسعودي كان نخاساً في الجاهلية بياعاً للجواري وكان على قريش يوم حرب الفجار {cite:muruj-al-dhahab p. 584}"
  fr: "Le chef âgé et honoré des Taym ibn Murra dans la maison duquel fut juré le pacte d'al-Fudul — une référence à La Mecque en matière d'hospitalité."
  es: "El anciano y respetado jefe de Taym ibn Murra, en cuya casa se juró el pacto de Fudul, sinónimo de hospitalidad en La Meca."
  ur: "تیم ابن مرہ کے بزرگ، معزز سربراہ جن کے گھر میں فضول معاہدہ ہوا تھا - مکہ میں مہمان نوازی کے لیے ایک لفظ۔"
  tr: "Taym ibn Murrah'ın büyük şeyhi, şerefli bir adamdı; evinde Fudul'un müttefikleri toplandı ve Mekke'deki mazlumlara destek sözü verdiler. El-Mas'udi'ye göre, İslam öncesi dönemde köle ticareti yapan, cariye satan ve Ficar Savaşı günü Kureyş'in komutanı olan bir kişiydi. {cite:muruj-al-dhahab s. 584}"
  id: "Syekh besar Taym ibn Murrah, seorang pria terhormat; di rumahnya sekutu Fudul berkumpul dan berjanji untuk mendukung kaum tertindas di Mekah. Menurut al-Mas'udi, ia adalah seorang pedagang budak di era pra-Islam, menjual budak perempuan, dan ia bertanggung jawab atas kaum Quraisy pada hari Perang Fijar. {cite:muruj-al-dhahab hlm. 584}"
