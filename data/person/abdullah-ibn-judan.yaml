education:
  did_you_know:
    ar: "عبد الله بن جدعان شيخ تيم بن مرة الكبير صاحب الشرف؛ في داره اجتمع حالفو الفضول وتعاقدوا على نصرة المظلوم بمكة."
    en: "Abd Allah ibn Jud'an, the great shaykh of Taym ibn Murra and lord of honour — in his house the parties of the Fudul pact gathered and covenanted to back the wronged in Mecca."
    ur: "عبداللہ بن جدعان، تیم بن مرہ کے بزرگ شیخ اور صاحبِ شرف — اس کے گھر میں حلف الفضول کے شرکا جمع ہوئے اور مکہ میں مظلوم کی نصرت کا عہد کیا۔"
    sources: [source/ibn-hisham-sira, source/muruj-al-dhahab]
