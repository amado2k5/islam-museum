summary:
  ar: ناشطة فلبينية مسلمة ورئيسة المركز الفلبيني للإسلام والديمقراطية ⁦(PCID)⁩، وعضوة سابقة في الحكومة؛ شاركت في تأسيس مؤسسة «ماغباسا كيتا» لمحو الأمية، وتعمل على حقوق المرأة المسلمة والسلام في مينداناو.
  en: Filipina Muslim activist and president of the Philippine Center for Islam and Democracy (PCID), and a former member of government. She co-founded the Magbassa Kita Foundation for literacy and works
    on Muslim women's rights and peace in Mindanao.
  ur: فلپینی مسلم کارکن اور فلپائن سینٹر فار اسلام اینڈ ڈیموکریسی ⁦(PCID)⁩ کی صدر، سابقہ حکومت کی رکن۔ انہوں نے خواندگی کے لیے مگباسا کتا فاؤنڈیشن کی مشترک بنیاد رکھی اور مسلم خواتین کے حقوق اور مینداناؤ
    میں امن پر کام کرتی ہیں۔
  es: "Activista musulmana filipina y presidenta del Centro Filipino para el Islam y la Democracia (PCID), además de exmiembro del gobierno. Cofundó la Fundación Magbassa Kita para la alfabetización y trabaja por los derechos de las mujeres musulmanas y la paz en Mindanao."
  fr: "Militante musulmane philippine et présidente du Centre philippin pour l'islam et la démocratie (PCID), elle a également été membre du gouvernement. Elle a cofondé la Fondation Magbassa Kita pour l'alphabétisation et œuvre pour les droits des femmes musulmanes et la paix à Mindanao."
  tr: "Filipinli Müslüman aktivist, Filipinler İslam ve Demokrasi Merkezi (PCID) başkanı ve eski hükümet üyesi; Magbasa Keita Okuryazarlık Vakfı'nın kurucu ortaklarından olup, Mindanao'da Müslüman kadınların hakları ve barışı için çalışmaktadır."
  id: "Aktivis Muslim Filipina, presiden Philippine Center for Islam and Democracy (PCID), dan mantan anggota pemerintah; ia ikut mendirikan Magbasa Keita Literacy Foundation dan bekerja untuk hak-hak dan perdamaian perempuan Muslim di Mindanao."
