summary:
  ar: "أبو القاسم شاهنشاه الملقب الملك الأفضل بن أمير الجيوش بدر الجمالي؛ ولي الوزارة موضع أبيه في حياته لما مرض؛ وأقام المستعلي أحمد مقام أبيه المستنصر واستمر على الوزارة؛ وكان حسن التدبير فحل الرأي؛ وهو الذي أقام الآمر بن المستعلي موضع أبيه في المملكة ودبّر دولته وحجر عليه ومنعه من ارتكاب الشهوات فحمله ذلك على أن عمل على قتله فأُوثب عليه جماعة فقتلوه؛ وكان يسكن بمصر في دار الملك التي على نحر النيل {cite:wafayat-ayan}."
  en: "Al-Afdal Shahanshah b. Badr al-Jamali (k. 515) — Fatimid vizier who installed al-Musta'li then al-Amir; restrained the caliph until al-Amir had him cut down; killed at Ramadan's close {cite:wafayat-ayan}."
