summary:
  ar: "عبد الرحمن الحبري (أيار 1604 – 1659)، مؤرخ وعالم وشاعر عثماني من أدرنة، ابن المدرّس المشهور حبّاز زاده حسن أفندي الملقّب بصالباش. درس في أدرنة وإسطنبول وقضى حياته مدرّسًا في مدارس أدرنة متدرّجًا حتى دار الحديث سنة 1658، وحجّ سنة 1632. أشهر آثاره «أنيس المسامرين» في تاريخ أدرنة وطبوغرافيتها وتراجم أعيانها، وله «دفتر أخبار» في التاريخ العثماني وتاريخا فتح روان وبغداد و«مناسك المسالك» في رحلة حجه."
  en: "Abdurrahman Hibri (May 1604 – 1659) was an Ottoman historian, scholar and poet of Edirne, son of the noted müderris Habbazzâde Hasan Efendi, called Salbaş. Educated at Edirne and Istanbul, he spent his life teaching in Edirne's madrasas, rising to the Dârülhadis in 1658, and made the hajj in 1632. His chief work is the Enîsü'l-müsâmirîn, a history, topography and biographical survey of Edirne; he also wrote the Defter-i Ahbâr, histories of the conquests of Revan and Baghdad, and the Menâsik-i Mesâlik on his hajj journey."
  ur: "عبد الرحمن حبری (مئی 1604ء – 1659ء) ادرنہ کے عثمانی مؤرخ، عالم اور شاعر تھے، مشہور مدرس حباز زادہ حسن آفندی عرف صالباش کے بیٹے۔ ادرنہ اور استنبول میں تعلیم پائی اور عمر بھر ادرنہ کے مدارس میں پڑھاتے رہے، 1658ء میں دار الحدیث کے مدرس بنے اور 1632ء میں حج کیا۔ ان کی مشہور ترین تصنیف «انیس المسامرین» ہے جو ادرنہ کی تاریخ، جغرافیہ اور اعیان کی سوانح پر ہے؛ اس کے علاوہ «دفترِ اخبار»، فتحِ روان و بغداد کی تواریخ اور حج کے سفر پر «مناسک المسالک» لکھی۔"

