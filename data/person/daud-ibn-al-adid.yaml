  ur: "تیرھویں صدی میں حافظ اسماعیلیت کے پچیسویں امام، داؤد الحامد لِلّہ ابن العدید کے لیے مسودہ کارڈ۔ 1207; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "13. yüzyılda Hafız'ın yirmi beşinci imamı olan Davud El-Hamid Allah ibn El-Adhid'in ön kartı 1207 yılında vefat etti; tarih kitaplarında anılmakta ve biyografisi henüz sayfada gözden geçirilmemiştir."
  id: "Kartu pendahuluan Dawud Al-Hamid Allah ibn Al-Adhid, Imam Hafiz ke-25 pada abad ke-13, meninggal pada tahun 1207 M; ia dikenang dalam buku sejarah, dan biografinya belum pernah diulas di halaman."
