id: person/abu-al-wajih-of-banu-al-harith-killed-at-najran-286
class: person
label:
  ar: أبو الوجيه من رؤساء بني الحارث، قُتل بنجران سنة 286هـ
  en: Abu al-Wajih, a chief of Banu al-Harith, killed at Najran in 286 AH
  ur: ابو الوجیہ، بنو حارث کے سرداروں میں سے، نجران میں 286ھ میں مارا گیا
  fr: "Abu al-Wajih, un chef des Banu al-Harith, tué à Najran en 286 H"
  es: "Abu al-Wajih, a chief of Banu al-Harith, killed at Najran in 286 AH"
summary:
  ar: رجل من رجال بني الحارث وصناديدهم يعرف بالشجاعة، قتله الهادي في زقاق بالحجر وأُلقي رأسه إلى قومه فانهزموا.
  en: A man of Banu al-Harith, one of their chiefs, known for courage, whom al-Hadi killed in a lane of al-Hajar; his head was thrown to his people, who fled.
  ur: بنو حارث کا ایک شخص، ان کے سرداروں میں سے، بہادری کے لیے معروف، جسے ہادی نے الحجر کی ایک گلی میں مارا؛ اس کا سر اس کی قوم کی طرف پھینکا گیا اور وہ بھاگ گئے۔
  fr: "Un homme des Banu al-Harith, l'un de leurs chefs, connu pour son courage, qu'al-Hadi tua dans une ruelle d'al-Hajar ; sa tête fut jetée aux siens, qui s'enfuirent."
  es: "Un hombre de Banu al-Harith, uno de sus jefes, conocido por su valentía, fue asesinado por al-Hadi en un callejón de al-Hajar; su cabeza fue arrojada a su gente, que huyó."
  tr: "Beni Al-Harith kabilesinin mensuplarından ve liderlerinden, cesaretiyle tanınan bir adam, Al-Hadi tarafından bir sokakta taşlarla öldürüldü ve başı kabilesinin önüne atıldı, böylece kabile yenilgiye uğradı."
  id: "Seorang pria dari Bani Al-Harith dan para pemimpin mereka, yang dikenal karena keberaniannya, dibunuh oleh Al-Hadi di sebuah gang dengan batu, dan kepalanya dilemparkan ke kaumnya, sehingga mereka dikalahkan."
