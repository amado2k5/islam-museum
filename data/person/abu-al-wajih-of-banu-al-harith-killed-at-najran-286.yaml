id: person/abu-al-wajih-of-banu-al-harith-killed-at-najran-286
class: person
label:
  ar: أبو الوجيه من رؤساء بني الحارث، قُتل بنجران سنة 286هـ
  en: Abu al-Wajih, a chief of Banu al-Harith, killed at Najran in 286 AH
  ur: ابو الوجیہ، بنو حارث کے سرداروں میں سے، نجران میں 286ھ میں مارا گیا
summary:
  ar: رجل من رجال بني الحارث وصناديدهم يعرف بالشجاعة، قتله الهادي في زقاق بالحجر وأُلقي رأسه إلى قومه فانهزموا.
  en: A man of Banu al-Harith, one of their chiefs, known for courage, whom al-Hadi killed in a lane of al-Hajar; his head was thrown to his people, who fled.
  ur: بنو حارث کا ایک شخص، ان کے سرداروں میں سے، بہادری کے لیے معروف، جسے ہادی نے الحجر کی ایک گلی میں مارا؛ اس کا سر اس کی قوم کی طرف پھینکا گیا اور وہ بھاگ گئے۔
