summary:
  ar: "معلّق وكاتب ومجادل مسلم أمريكي، وُلد في هيوستن بولاية تكساس سنة 1985 أو 1986 لأبوين إيرانيين. أسس موقع وقناة «مسلم سكيبتيك» (The Muslim Skeptic) سنة 2015 ومعهد الأسنى سنة 2019، وله كتاب «خطر الحداثة على الإسلام» (2020)."
  en: "American Muslim commentator, writer and debater, born in Houston, Texas, in 1985 or 1986 to Iranian parents. He founded the Muslim Skeptic website and YouTube channel in 2015 and the Alasna Institute in 2019, and is the author of The Modernist Menace to Islam (2020)."
