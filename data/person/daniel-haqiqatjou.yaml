summary:
  ar: "معلّق وكاتب ومجادل مسلم أمريكي، وُلد في هيوستن بولاية تكساس سنة 1985 أو 1986 لأبوين إيرانيين. أسس موقع وقناة «مسلم سكيبتيك» (The Muslim Skeptic) سنة 2015 ومعهد الأسنى سنة 2019، وله كتاب «خطر الحداثة على الإسلام» (2020)."
  en: "American Muslim commentator, writer and debater, born in Houston, Texas, in 1985 or 1986 to Iranian parents. He founded the Muslim Skeptic website and YouTube channel in 2015 and the Alasna Institute in 2019, and is the author of The Modernist Menace to Islam (2020)."
  ur: "امریکی مسلمان مبصر، مصنف اور مناظر، جو 1985 یا 1986 میں ٹیکساس کے شہر ہیوسٹن میں ایرانی والدین کے ہاں پیدا ہوئے۔ انہوں نے 2015 میں «مسلم سکیپٹک» ویب سائٹ اور یوٹیوب چینل اور 2019 میں الأسنی انسٹی ٹیوٹ قائم کیا، اور وہ کتاب The Modernist Menace to Islam (2020) کے مصنف ہیں۔"
  es: "Comentarista, escritor y orador musulmán estadounidense, nacido en Houston, Texas, en 1985 o 1986 de padres iraníes. Fundó el sitio web y el canal de YouTube Muslim Skeptic en 2015 y el Instituto Alasna en 2019, y es autor de The Modernist Menace to Islam (2020)."
  fr: "Commentateur, écrivain et orateur musulman américain, né à Houston (Texas) en 1985 ou 1986 de parents iraniens. Il a fondé le site web et la chaîne YouTube Muslim Skeptic en 2015 et l'Alasna Institute en 2019. Il est l'auteur de The Modernist Menace to Islam (2020)."
  tr: "Amerikalı Müslüman yorumcu, yazar ve tartışmacı olan Ismi, 1985 veya 1986 yılında Houston, Teksas'ta İranlı ebeveynlerin çocuğu olarak doğmuştur. 2015 yılında 'The Muslim Skeptic' adlı web sitesi ve kanalını, 2019'da ise Al-Asna Enstitüsü'nü kurmuştur. 'Modernitenin İslam'a Tehlikesi' (2020) adlı kitabı yazmıştır."
  id: "Seorang komentator, penulis, dan debater Muslim Amerika, lahir di Houston, Texas, pada tahun 1985 atau 1986 dari orang tua Iran. Ia mendirikan situs web dan saluran 'The Muslim Skeptic' pada tahun 2015 dan Al-Asna Institute pada tahun 2019. Ia menulis buku 'The Danger of Modernity to Islam' (2020)."
