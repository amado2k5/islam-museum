label: { ar: "خالد بن يزيد بن معاوية" }
summary:
  ar: "عند البلاذري: دعاه عبد الملك بن مروان يا أبا هاشم إحدى بنات طبق لما كتب إليه ملك الروم في أمر الكتاب على القراطيس فأشار عليه بتحريم دنانيرهم وضرب سكك للناس وعدم الإعفاء عن الطوامير فقال له فرجتها عني فرج الله عنك وضرب الدنانير وعن المدائني أنه أشار أيضاً بمنع دخول القراطيس بلاد الروم."
  en: "In al-Baladhuri: 'Abu Hashim, one of Tabaq's daughters' — so Abd al-Malik ibn Marwan addressed him when Rome's king wrote about the inscription on the papyri; he counselled forbidding their dinars, striking coinage for the people, and not relieving them on the scrolls — 'you have relieved me, may God relieve you' — and the dinars were struck; via al-Mada'ini he also counselled barring papyrus from Roman lands."
