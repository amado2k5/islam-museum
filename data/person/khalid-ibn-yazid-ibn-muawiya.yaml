class: person
label: { ar: "خالد بن يزيد بن معاوية", en: "Khalid Ibn Yazid Ibn Muawiya", es: "Khalid Ibn Yazid Ibn Muawiya", fr: "Khalid Ibn Yazid Ibn Muawiya", ur: "خالد بن یزید ابن معاویہ" }
summary:
  ar: "خالد بن يزيد بن معاوية بن أبي سفيان، قال ابن النديم الذي عني بإخراج كتب القدماء في الصنعة وكان خطيبا شاعرا فصيحا حازما ذا رأي وهو أول من ترجمت له كتب الطب والنجوم وكتب الكيمياء، وقيل له لقد فعلت أكثر شغلك في طلب الصنعة فقال ما أطلب بذاك إلا أن أغنى أصحابي وإخواني إني طمعت في الخلافة فاختزلت دوني فلم أجد منها عوضا إلا أن أبلغ آخر هذه الصناعة فلا أحوج أحدا من عرقي إلى أن يقف بباب سلطان رغبة أو رهبة، وصح له عمل الصناعة وله في ذلك كتب ورسائل وشعر كثير رأى ابن النديم منه نحو خمسمائة ورقة ومن كتبه كتاب الحرارات وكتاب الصحيفة الكبير وكتاب الصحيفة الصغير وكتاب وصيته إلى ابنه في الصنعة {cite:fihrist-ibn-al-nadim p. 497-498}."
  en: "The Umayyad prince-alchemist — first patron of translated medical, astronomical and alchemical books {cite:fihrist-ibn-al-nadim}"
  es: "El príncipe alquimista omeya — primer mecenas de las traducciones de libros médicos, astronómicos y alquímicos {cite:fihrist-ibn-al-nadim}"
  fr: "Le prince-alchimiste omeyyade — premier mécène des livres médicaux, astronomiques et alchimiques traduits {cite:fihrist-ibn-al-nadim}"
  ur: "اموی شہزادہ کیمیا دان - ترجمہ شدہ طبی، فلکیاتی اور کیمیا سے متعلق کتابوں کا پہلا سرپرست"
  tr: "Eski zanaatkarlık kitaplarını yayımlamaktan sorumlu olan Halid bin Yezid ibn Muaviye ibn Muaviye ibn Ebi Sufyan, İbn el-Nadim, hatip, hitabetli, etkileyici ve kararlı bir şairdi. Tıp, astronomi ve kimya üzerine kitapları çeviren ilk kişiydi. Kendisine, 'Çalışmalarının çoğunu zanaatkarlık aramaya adadın.' denildi. Şöyle dedi: 'Ben sadece yoldaşlarımı ve kardeşlerimi zenginleştirmek istiyorum. Halifeliği arzuladım ve kendimi alçalttım, bu yüzden bu zanaatın sonuna ulaşmaktan başka bir alternatif bulamadım. Soyumdan kimsenin arzu ya da hayranlıkla Sultan'ın kapısında durmasına ihtiyacım yok.' Zanaatkârlığında haklıydı ve bu alanda birçok kitabı, mektubu ve şiiri vardı. İbn el-Nadim bunun yaklaşık beş yüz sayfasını gördü, bunlar arasında 'El-Harat' adlı kitap da vardı: 'Büyük Kitap', 'Küçük Kitap' ve oğluna zanaattaki vasiyeti {atıf:Fihrist-ibn-al-Nadim s. 497-498}."
  id: "Khalid ibn Yazid ibn Muawiyah ibn Abi Sufyan, Ibn al-Nadim, yang bertanggung jawab menerbitkan buku-buku para leluhur dalam kerajinan, adalah seorang orator, fasih, fasih, dan penyair tegas dengan pendapat. Dia adalah yang pertama menerjemahkan buku tentang kedokteran, astronomi, dan kimia. Dia diberitahu, 'Kamu telah mendedikasikan sebagian besar pekerjaanmu untuk mencari keahlian.' Dia berkata: 'Aku tidak mencari apa pun selain memperkaya sahabat dan saudaraku. Aku menginginkan kekhalifahan dan merendahkan diri, sehingga aku tidak menemukan pengganti selain mencapai akhir dari keahlian ini. Aku tidak menginginkan siapa pun dari rasiku berdiri di pintu Sultan karena keinginan atau kekaguman.' Dia dibenarkan dalam keahlian, dan dia memiliki banyak buku, surat, dan banyak puisi di bidang ini. Ibn al-Nadim melihat sekitar lima ratus halaman, termasuk buku 'Al-Hararat,' 'Kitab Agung,' 'Buku Kecil,' dan wasiatnya kepada putranya dalam seni {cite::' Fihrist-ibn-al-Nadim hlm. 497-498}."
