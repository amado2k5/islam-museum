label: { ar: "خالد بن يزيد بن معاوية", en: "Khalid Ibn Yazid Ibn Muawiya" }
summary:
  ar: "خالد بن يزيد بن معاوية بن أبي سفيان، قال ابن النديم الذي عني بإخراج كتب القدماء في الصنعة وكان خطيبا شاعرا فصيحا حازما ذا رأي وهو أول من ترجمت له كتب الطب والنجوم وكتب الكيمياء، وقيل له لقد فعلت أكثر شغلك في طلب الصنعة فقال ما أطلب بذاك إلا أن أغنى أصحابي وإخواني إني طمعت في الخلافة فاختزلت دوني فلم أجد منها عوضا إلا أن أبلغ آخر هذه الصناعة فلا أحوج أحدا من عرقي إلى أن يقف بباب سلطان رغبة أو رهبة، وصح له عمل الصناعة وله في ذلك كتب ورسائل وشعر كثير رأى ابن النديم منه نحو خمسمائة ورقة ومن كتبه كتاب الحرارات وكتاب الصحيفة الكبير وكتاب الصحيفة الصغير وكتاب وصيته إلى ابنه في الصنعة {cite:fihrist-ibn-al-nadim p. 497-498}."
  en: "The Umayyad prince-alchemist — first patron of translated medical, astronomical and alchemical books {cite:fihrist-ibn-al-nadim}"
