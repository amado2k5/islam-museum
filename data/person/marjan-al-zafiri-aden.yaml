summary:
  ar: "الأمير مرجان بن عبد الله الظافري الذي عمّر قبة العيدروس بعدن وهو مدفون معه فيها؛ قال العلّامة باحرق في حقه: الأمير المؤيد بتوفيق الله وعنايته الذي فتح الله بنور الإيمان عين بصيرته وطهّر عن سوء العقيدة باطن سريرته وصار معدوداً من الأولياء، وحاز من بين الولاة والحكام من التواضع لله والرفق بالفقراء والمساكين حظاً وافراً؛ توفي سنة ثلاث وعشرين وتسعمائة تقريباً {cite:shadharat-dhahab p. 561}."
  en: "Aden's amir who built the dome over al-'Aydarus and lies buried with him in it — per Ba Haruq, 'counted among the saints, the humblest of rulers, most generous to the poor'; d. about 923 {cite:shadharat-dhahab p. 561}."
  es: "El emir de Adén que construyó la cúpula sobre al-'Aydarus y yace enterrado con él en ella — según Ba Haruq, 'contado entre los santos, el más humilde de los gobernantes, el más generoso con los pobres'; murió alrededor del 923 {cita: shadharat-dhahab p. 561}."
  fr: "L'émir d'Aden qui a construit le dôme au-dessus d'al-'Aydarus et qui y est enterré avec lui — selon Ba Haruq, « compté parmi les saints, le plus humble des dirigeants, le plus généreux envers les pauvres »; mort vers 923 {cite: shadharat-dhahab p. 561}."
  ur: "عدن کا امیر جس نے العیدارس پر گنبد تعمیر کیا اور اس میں اپنے ساتھ دفن ہے - فی با ہاروق، 'اولیاء میں شمار ہوتا ہے، حکمرانوں میں سب سے عاجز، غریبوں کے لیے سب سے زیادہ سخی'؛ d تقریباً 923 {حوالہ: شدھارت ذہاب ص۔ 561}۔"
