summary:
  ar: "الأمير مرجان بن عبد الله الظافري الذي عمّر قبة العيدروس بعدن وهو مدفون معه فيها؛ قال العلّامة باحرق في حقه: الأمير المؤيد بتوفيق الله وعنايته الذي فتح الله بنور الإيمان عين بصيرته وطهّر عن سوء العقيدة باطن سريرته وصار معدوداً من الأولياء، وحاز من بين الولاة والحكام من التواضع لله والرفق بالفقراء والمساكين حظاً وافراً؛ توفي سنة ثلاث وعشرين وتسعمائة تقريباً {cite:shadharat-dhahab p. 561}."
  en: "Aden's amir who built the dome over al-'Aydarus and lies buried with him in it — per Ba Haruq, 'counted among the saints, the humblest of rulers, most generous to the poor'; d. about 923 {cite:shadharat-dhahab p. 561}."
