label: { ar: "يحيى بن سعيد بن العاص", en: "Yahya ibn Sa'id ibn al-'As", es: "Yahya ibn Sa'id ibn al-'As", fr: "Yahya ibn Sa'id ibn al-'As", ur: "یحییٰ بن سعید بن العاص" }
summary:
  ar: "أخو عمرو بن سعيد الأشدق، وافى إلى باب دار عبد الملك بمن معه ليكسره حين قتل أخاه، واختلف مع الوليد بن عبد الملك فضربه بالسيف على يده فانصرع، فألقوا رأس عمرو إلى الناس فتفرقوا {cite:muruj-al-dhahab p. 97}."
  en: "al-Ashdaq's brother — rushed the palace door to break it as his brother was slaughtered, striking the prince al-Walid's hand before the thrown head scattered the crowd {cite:muruj-al-dhahab p. 97}."
  es: "El hermano de al-Ashdaq se abalanzó sobre la puerta del palacio para derribarla mientras su hermano era asesinado, golpeando la mano del príncipe al-Walid antes de que la cabeza lanzada dispersara a la multitud {cite:muruj-al-dhahab p. 97}."
  fr: "Le frère d'al-Ashdaq — s'est précipité vers la porte du palais pour la briser alors que son frère était massacré, frappant la main du prince al-Walid avant que la tête jetée ne disperse la foule {cite:muruj-al-dhahab p. 97}."
  ur: "اشدق کا بھائی - محل کے دروازے کو توڑنے کے لیے بھاگا جب اس کے بھائی کو ذبح کر دیا گیا، شہزادہ الولید کے ہاتھ پر مارا اس سے پہلے کہ پھینکا ہوا سر ہجوم کو پراگندہ کر دے {حوالہ: مروج الذہب ص۔ 97}۔"
  tr: "Amr ibn Sa'id al-Ashdaq'ın kardeşi, kardeşi öldürüldüğünde yoldaşlarıyla birlikte Abd al-Malik'in evinin kapısını kırmak için geldi. El-Velid bin Abdül-Malik ile tartıştı, eline kılıçla vurdu ve mağlup oldu. Amr, Amr'in başını halka fırlattı ve halk dağıldı {atıf:muruj-al-dhahab, s. 97}."
  id: "Saudara Amr ibn Sa'id al-Ashdaq datang ke pintu rumah Abd al-Malik bersama teman-temannya untuk memecahkannya ketika saudaranya terbunuh. Ia berselisih dengan al-Walid ibn Abd al-Malik, memukulnya dengan pedang di tangannya, dan ia kalah. Amr melemparkan kepala Amr ke arah rakyat, dan mereka pun bubar-bar {cite:muruj-al-dhahab, hlm. 97}."
