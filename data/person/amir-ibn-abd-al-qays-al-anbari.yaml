summary:
  ar: "عامر بن عبد القيس العنبري، زاهد بصري، لفت زهده انتباه وكيل عثمان حمران بن أبان، فوشى به إلى الخليفة، وأُخضع للاستجواب ونُفي إلى دمشق حيث مات غالبًا في خلافة معاوية، وتعدّه الصوفية من كبار الزهاد {cite:encyclopaedia-of-islam-2 vol. 1 p. 463}."
  en: "Amir b. 'Abd al-Qays al-'Anbari, an ascetic of Basra whose way of life drew the attention of Humran b. Aban, the agent of 'Uthman, who denounced him to the caliph. He was interrogated, exiled to Damascus and died there, probably in the caliphate of Mu'awiya. Sufism counts him among the principal zuhhad {cite:encyclopaedia-of-islam-2 vol. 1 p. 463}."
