summary:
  ar: "عامر بن عبد القيس العنبري، زاهد بصري، لفت زهده انتباه وكيل عثمان حمران بن أبان، فوشى به إلى الخليفة، وأُخضع للاستجواب ونُفي إلى دمشق حيث مات غالبًا في خلافة معاوية، وتعدّه الصوفية من كبار الزهاد {cite:encyclopaedia-of-islam-2 vol. 1 p. 463}."
  en: "Amir b. 'Abd al-Qays al-'Anbari, an ascetic of Basra whose way of life drew the attention of Humran b. Aban, the agent of 'Uthman, who denounced him to the caliph. He was interrogated, exiled to Damascus and died there, probably in the caliphate of Mu'awiya. Sufism counts him among the principal zuhhad {cite:encyclopaedia-of-islam-2 vol. 1 p. 463}."
  es: "Amir b. 'Abd al-Qays al-'Anbari, un asceta de Basora cuyo estilo de vida llamó la atención de Humran b. Aban, agente de 'Uthman, quien lo denunció ante el califa. Fue interrogado, exiliado a Damasco y murió allí, probablemente durante el califato de Mu'awiya. El sufismo lo considera uno de los principales zuhhad {cite:encyclopaedia-of-islam-2 vol. 1 p. 463}."
  fr: "Amir b. 'Abd al-Qays al-'Anbari, ascète de Bassora, dont le mode de vie attira l'attention de Humran b. Aban, agent d'Uthman, qui le dénonça au calife. Interrogé, il fut exilé à Damas où il mourut, probablement sous le califat de Mu'awiya. Le soufisme le compte parmi les principaux zuhhad (ascètes)."
  ur: "عامر بی عبد القیس الانباری، بصرہ کا ایک سنیاسی جس کے طرز زندگی نے حمران بن کی توجہ مبذول کرائی۔ ابان، عثمان کا ایجنٹ، جس نے اسے خلیفہ سے ملامت کی۔ ان سے پوچھ گچھ کی گئی، دمشق جلاوطن کر دیا گیا اور وہیں غالباً معاویہ کے دور خلافت میں وفات پائی۔ تصوف ان کا شمار پرنسپل زہد میں کرتا ہے۔ 1 ص۔ 463}۔"
  tr: "Basri keşisi Emir bin Abdül-Kays el-Anbari, Osman Hamran bin Aban'ın ajanının dikkatini çekti; Halife'yi halifeye götürdü, sorguya tabi tuttu ve Şam'a sürgün edildi; burada sık sık Muaviye halifeliği sırasında öldü. Sufiler onu büyük münzevilerden biri olarak kabul eder {cite:encyclopaedia-of-Islam-2 cilt 1, s. 463}."
  id: "Amir ibn Abd al-Qays al-Anbari, seorang pertapa Basri, menarik perhatian wakil Uthman Hamran ibn Aban, yang membawanya kepada khalifah, menginterogasinya, dan diasingkan ke Damaskus, di mana ia sering meninggal selama kekhalifahan Muawiya. Para Sufi menganggapnya sebagai salah satu pertapa besar {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 463}."
