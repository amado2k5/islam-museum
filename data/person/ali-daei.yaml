summary:
  ar: "لاعب كرة قدم إيراني سابق ومدرب ⁦(وُلد سنة 1969 في أردبيل)⁩. مهاجم وقائد للمنتخب الإيراني سجّل 108 أهداف دولية، وهو رقم قياسي عالمي احتفظ به حتى سنة 2021، وأول رجل يبلغ مائة هدف دولي؛ لعب لبرسيبوليس وبايرن ميونخ وهيرتا برلين، وصار أول آسيوي يلعب ويسجل في دوري أبطال أوروبا، ثم درّب المنتخب الإيراني وأندية عدة."
  en: "Iranian former footballer and manager (born 1969 in Ardabil). A striker who captained Iran and scored 108 international goals — a world record he held until 2021 and the first man to reach a hundred — he played for Persepolis, Bayern Munich and Hertha Berlin, becoming the first Asian to play and score in the UEFA Champions League, and later managed the Iranian national team and several clubs."
  fr: "Ancien footballeur et entraîneur iranien (né en 1969 à Ardabil). L’attaquant qui a été capitaine de l’Iran et a marqué 108 buts internationaux – un record du monde qu’il a détenu jusqu’en 2021 et le premier homme à en atteindre une centaine – a joué pour Persepolis, le Bayern Munich et Hertha Berlin, devenant ainsi le premier Asiatique à jouer et à marquer en UEFA Champions League, puis a dirigé l’équipe nationale iranienne et plusieurs clubs."
  ur: "ایرانی سابق فٹبالر اور مینیجر ⁦(پیدائش 1969، اردبیل)⁩۔ اسٹرائیکر جنہوں نے ایران کی کپتانی کی اور 108 بین الاقوامی گول کیے — عالمی ریکارڈ جو 2021 تک ان کے پاس رہا اور سو گول کرنے والے پہلے کھلاڑی — پرسپولیس، بائرن میونخ اور ہرتھا برلن کے لیے کھیلے، یوئیفا چیمپیئنز لیگ کھیلنے اور گول کرنے والے پہلے ایشیائی بنے، اور بعد میں ایران کی قومی ٹیم اور کئی کلبوں کی کوچنگ کی۔"
  es: "Exfutbolista y entrenador iraní (nacido en 1969 en Ardabil). Delantero que fue capitán de Irán y marcó 108 goles internacionales —un récord mundial que mantuvo hasta 2021 y el primer hombre en alcanzar los cien—, jugó en el Persepolis, el Bayern de Múnich y el Hertha de Berlín, convirtiéndose en el primer asiático en jugar y marcar en la Liga de Campeones de la UEFA, y posteriormente dirigió a la selección nacional iraní y a varios clubes."
  tr: "Eski İranlı futbolcu ve teknik direktör (1969 doğumlu Ardabil). Bir forvet ve İran milli takımının kaptanı olan Sher, 2021'e kadar elinde tuttuğu dünya rekoru olan 108 uluslararası gol attı. 100 uluslararası gollere ulaşan ilk oyuncu oldu; Persepolis, Bayern Münih ve Hertha Berlin takımlarında oynadı ve Şampiyonlar Ligi'nde oynayan ve gol atan ilk Asyalı oldu. Daha sonra İran milli takımını ve çeşitli kulüpleri çalıştırdı."
  id: "Mantan pemain dan pelatih sepak bola Iran (lahir tahun 1969 di Ardabil). Sebagai penyerang dan kapten tim nasional Iran, ia mencetak 108 gol internasional, rekor dunia yang dipegangnya hingga 2021. Ia adalah orang pertama yang mencapai 100 gol internasional; ia bermain untuk Persepolis, Bayern Munich, dan Hertha Berlin, menjadi orang Asia pertama yang bermain dan mencetak gol di Liga Champions. Ia kemudian melatih tim nasional Iran dan beberapa klub."
