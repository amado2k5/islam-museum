summary:
  ar: "لاعب كرة قدم إيراني سابق ومدرب (وُلد سنة 1969 في أردبيل). مهاجم وقائد للمنتخب الإيراني سجّل 108 أهداف دولية، وهو رقم قياسي عالمي احتفظ به حتى سنة 2021، وأول رجل يبلغ مائة هدف دولي؛ لعب لبرسيبوليس وبايرن ميونخ وهيرتا برلين، وصار أول آسيوي يلعب ويسجل في دوري أبطال أوروبا، ثم درّب المنتخب الإيراني وأندية عدة."
  en: "Iranian former footballer and manager (born 1969 in Ardabil). A striker who captained Iran and scored 108 international goals — a world record he held until 2021 and the first man to reach a hundred — he played for Persepolis, Bayern Munich and Hertha Berlin, becoming the first Asian to play and score in the UEFA Champions League, and later managed the Iranian national team and several clubs."
  ur: "ایرانی سابق فٹبالر اور مینیجر (پیدائش 1969، اردبیل)۔ اسٹرائیکر جنہوں نے ایران کی کپتانی کی اور 108 بین الاقوامی گول کیے — عالمی ریکارڈ جو 2021 تک ان کے پاس رہا اور سو گول کرنے والے پہلے کھلاڑی — پرسپولیس، بائرن میونخ اور ہرتھا برلن کے لیے کھیلے، یوئیفا چیمپیئنز لیگ کھیلنے اور گول کرنے والے پہلے ایشیائی بنے، اور بعد میں ایران کی قومی ٹیم اور کئی کلبوں کی کوچنگ کی۔"
