  ar: "واعظ جمعة كردي سوراني في مسجد حاجي فتاح في كفري بمنطقة گرمیان في كردستان العراق، كما تنسب أوصاف مقاطع قناته خطبته إلى ذلك المسجد. منصّته الرئيسة صفحته على فيسبوك، وبلغت 280,000 متابع بحسب بيانات منشوراتها المؤرخة في 13 و21 فبراير و22 أكتوبر 2026 كما قرأها حصاد الموجة 199 في 9 نوفمبر 2026، وخطب جمعته على قناته في يوتيوب مؤرخة في سبتمبر وأكتوبر ونوفمبر 2026. لا يوجد له عدد مؤرخ على يوتيوب أو إنستغرام، فلا يُطبع أيّ رقم سوى رقم فيسبوك المؤرخ."
  en: "Sorani Kurdish Friday preacher at the Haji Fattah mosque in Kifri, in the Garmian area of Iraqi Kurdistan, as his own channel's video descriptions place his preaching there. His main platform is his Facebook page, which counted 280,000 followers by post metadata on posts dated 13 and 21 February and 22 October 2026, as read by the wave-199 harvest on 9 November 2026; his Friday sermons on his YouTube channel are dated September, October and November 2026. No dated YouTube or Instagram count for him exists in any source read, so no figure other than the dated Facebook count is printed."
  ur: "عراقی کردستان کے گرمیان علاقے کے شہر کفری کی حاجی فتاح مسجد کے سورانی کرد خطیبِ جمعہ، جیسا کہ ان کے اپنے چینل کی ویڈیو تفصیلات ان کی خطابت کو اسی مسجد سے منسوب کرتی ہیں۔ ان کا اصل پلیٹ فارم ان کا فیس بک پیج ہے جس کے فالوور 13 اور 21 فروری اور 22 اکتوبر 2026ء کی پوسٹوں کی میٹا ڈیٹا کے مطابق 280,000 تھے، جیسا کہ موج 199 کے جائزے نے 9 نومبر 2026ء کو پڑھا؛ ان کے یوٹیوب چینل پر خطباتِ جمعہ ستمبر، اکتوبر اور نومبر 2026ء کی تاریخوں کے ہیں۔ ان کا کوئی مؤرخ یوٹیوب یا انسٹاگرام عدد کسی ماخذ میں نہیں ملا، اس لیے مؤرخ فیس بک عدد کے سوا کوئی رقم درج نہیں کی گئی۔"
