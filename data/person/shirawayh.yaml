  ar: "شيرويه الأسواري؛ تزوج مرجانة أم عبيد الله بن زياد وبنى لها قصراً فيه أبواب كثيرة فسمي هزاردر وقيل سمي لأن شيرويه اتخذ فيه ألف باب وقيل نزل ذلك الموضع ألف أسور في ألف بيت أنزلهم كسرى فقيل هزاردر."
  en: "Shirawayh the Aswari; he married Marjana, mother of Ubaydallah ibn Ziyad, and built her a palace of many doors — called Hazārdir — for the thousand doors it held, or the thousand asāwira Kisra lodged there in a thousand houses."
