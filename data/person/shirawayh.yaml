label: { ar: "شيرويه الأسواري", en: "Shirawayh al-Aswari", es: "Shirawayh al-Aswari", fr: "Shirawayh al-Aswari", ur: "شیراویہ العسویری" }
summary:
  ar: "شيرويه الأسواري؛ تزوج مرجانة أم عبيد الله بن زياد وبنى لها قصراً فيه أبواب كثيرة فسمي هزاردر وقيل سمي لأن شيرويه اتخذ فيه ألف باب وقيل نزل ذلك الموضع ألف أسور في ألف بيت أنزلهم كسرى فقيل هزاردر."
  en: "Shirawayh the Aswari; he married Marjana, mother of Ubaydallah ibn Ziyad, and built her a palace of many doors — called Hazārdir — for the thousand doors it held, or the thousand asāwira Kisra lodged there in a thousand houses."
  es: "Shirawayh el Aswari; se casó con Marjana, madre de Ubaydallah ibn Ziyad, y le construyó un palacio de muchas puertas —llamado Hazārdir— por las mil puertas que tenía, o por los mil asāwira Kisra que se alojaron allí en mil casas."
  fr: "Shirawayh l'Aswari; il épousa Marjana, mère d'Ubaydallah ibn Ziyad, et lui construisit un palais aux mille portes — appelé Hazārdir — en raison des mille portes qu'il contenait, ou des mille asāwira Kisra qui y logeaient dans mille maisons."
  ur: "شیراویہ اسواری؛ اس نے عبیداللہ ابن زیاد کی والدہ مرجانہ سے شادی کی اور اس کے لیے کئی دروازوں پر مشتمل ایک محل تعمیر کروایا جسے ہزاردر کہا جاتا ہے، اس کے لیے ہزار دروازے تھے، یا ہزار اساویرہ کسریٰ نے ایک ہزار گھروں میں قیام کیا۔"
  tr: "Şiruyah el-Aswari; Ubayd Allah ibn Ziyad'ın annesi Marjana ile evlendi ve ona birçok kapılı bir saray inşa etti, bu yüzden Hazardar adını aldı. Ayrıca Şiruyah'ın oraya bin kapı aldığı için bu isim verildiği söylenir. Ayrıca o yerde bin duvar inşa edildiği ve bunların Khosrow tarafından inşa edildiği söylenir, bu yüzden Hazardar denir."
  id: "Shiruyah al-Aswari; ia menikahi Marjana, ibu Ubayd Allah ibn Ziyad, dan membangun sebuah istana dengan banyak gerbang untuknya, sehingga ia dinamai Hazardar. Nama ini juga dikatakan karena Shiruyah memiliki seribu gerbang di sana. Dikatakan juga bahwa seribu tembok dibangun di tempat itu, yang dibangun oleh Khosrow, sehingga disebut Hazardar."
