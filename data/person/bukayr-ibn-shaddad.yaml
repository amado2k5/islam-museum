summary:
  ar: "بكير بن شداد بن عامر من بني كنانة فارس أطلال وهو اسم فرسه؛ كان مع سعيد بن العاص في غزوة أذربيجان وفيه قال الشماخ بن ضرار: وغنيت عن خيل بموقان أسلمت بكير بني الشداخ فارس أطلال وهو الذي سمع يهودياً في خلافة عمر ينشد فقتله."
  en: "Bukayr ibn Shaddad ibn Amir of Kinana, rider of the horse Atlal; he rode with Sa'id ibn al-As on the Azerbaijan raid — al-Shammakh's verse ransoms 'Bukayr of the Shaddakh sons, knight of Atlal' — and he it was who heard a Jew reciting poetry in Umar's caliphate and killed him."
