id: person/bukayr-ibn-shaddad
class: person
label: { ar: "بكير بن شداد", en: "Bukayr ibn Shaddad", es: "Bukayr ibn Shaddad", fr: "Bukayr ibn Shaddad", ur: "بکر بن شداد" }
summary:
  ar: "بكير بن شداد بن عامر من بني كنانة فارس أطلال وهو اسم فرسه؛ كان مع سعيد بن العاص في غزوة أذربيجان وفيه قال الشماخ بن ضرار: وغنيت عن خيل بموقان أسلمت بكير بني الشداخ فارس أطلال وهو الذي سمع يهودياً في خلافة عمر ينشد فقتله."
  en: "Bukayr ibn Shaddad ibn Amir of Kinana, rider of the horse Atlal; he rode with Sa'id ibn al-As on the Azerbaijan raid — al-Shammakh's verse ransoms 'Bukayr of the Shaddakh sons, knight of Atlal' — and he it was who heard a Jew reciting poetry in Umar's caliphate and killed him."
  es: "Bukayr ibn Shaddad ibn Amir de Kinana, jinete del caballo Atlal; cabalgó con Sa'id ibn al-As en la incursión azerbaiyana —el verso de al-Shammakh rescata a 'Bukayr de los hijos de Shaddakh, caballero de Atlal'— y fue él quien escuchó a un judío recitando poesía en el califato de Umar y lo mató."
  fr: "Bukayr ibn Shaddad ibn Amir de Kinana, cavalier du cheval Atlal; il chevaucha avec Sa'id ibn al-As lors du raid en Azerbaïdjan — les vers d'al-Shammakh rançonnent « Bukayr des fils de Shaddakh, chevalier d'Atlal » — et c'est lui qui entendit un Juif réciter de la poésie dans le califat d'Umar et le tua."
  ur: "بکر بن شداد بن عامر کنانہ، گھوڑے اطلال پر سوار؛ وہ سعید بن العاص کے ساتھ آذربائیجان کے چھاپے پر سوار ہوا - الشمخ کی آیت 'شدخ کے بیٹوں کا بکیر، اطلال کا نائٹ' - اور یہ وہی تھا جس نے عمر کی خلافت میں ایک یہودی کو اشعار پڑھتے ہوئے سنا اور اسے قتل کردیا۔"
  tr: "Banu Kinana'dan Bukayr ibn Shaddad ibn Amir, atının adı olan harabe şövalyesiydi; Azerbaycan seferinde Seyid ibn el-As ile birlikteydi. El-Şemmak ibn Zirar şöyle dedi: Muqan'ın süvarileri için şarkı söyledim, harabelerin şövalyesi Bukir bin el-Şeddak ise İslam'ı benimsedi ve Ömer halifeliği sırasında bir Yahudi'nin okunduğunu duyan ve onu öldüren oydu."
  id: "Bukayr ibn Shaddad ibn Amir dari Banu Kinana adalah seorang ksatria reruntuhan, itulah nama kudanya; ia bersama Sa'id ibn al-As dalam kampanye Azerbaijan. Al-Shammakh ibn Dhirar berkata: Saya bernyanyi untuk kavaleri Muqan, dan Bukir ibn al-Shaddakh, ksatria reruntuhan, memeluk Islam, dan dialah yang mendengar seorang Yahudi saat kekhalifahan Umar mengucapkan dan membunuhnya."
