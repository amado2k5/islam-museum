summary:
  ar: "إمام وشخصية عامة ألباني ⁦(المولود 1977 في تيرانا)⁩، إمام وخطيب جامع دینه خوجا في تيرانا وعضو مجلس مفتي تيرانا منذ أكثر من خمسة عشر عاما؛ درس في دمشق والمدينة المنورة، وأطروحته في جامعة إيست أنغليا (2017) تناولت دور رجال الدين المسلمين في الوئام بين الأديان في ألبانيا. بلغ عدد متابعي صفحته على فيسبوك 326 ألفا في أكتوبر 2024 بحسب دراسة «كونتكست»."
  en: "Albanian imam and public figure (born 16 April 1977 in Tirana), imam-khatib of Tirana's Dine Hoxha Mosque and a member of the Tirana Council of Muftis for over fifteen years; trained in Damascus and Medina, and author of a 2017 University of East Anglia dissertation on Muslim clergy and interreligious harmony in Albania. His Facebook page counted 326,000 followers in October 2024 (Context study)."
  ur: "احمد کالایا (پیدائش 1977ء، تیرانا) البانوی امام اور عوامی شخصیت ہیں، تیرانا کی دینے خوجا مسجد کے امام و خطیب اور پندرہ برس سے زائد عرصے سے تیرانا مفتی کونسل کے رکن؛ دمشق اور مدینہ منورہ میں تعلیم حاصل کی اور 2017ء میں یونیورسٹی آف ایسٹ اینگلیا سے البانیا میں بین المذاہب ہم آہنگی پر مقالہ لکھا۔ اکتوبر 2024ء میں ان کے فیس بک صفحے کے فالوورز 326 ہزار تھے (کانٹیکسٹ مطالعہ)۔"
