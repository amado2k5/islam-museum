summary:
  ar: "إمام وشخصية عامة ألباني ⁦(المولود 1977 في تيرانا)⁩، إمام وخطيب جامع دینه خوجا في تيرانا وعضو مجلس مفتي تيرانا منذ أكثر من خمسة عشر عاما؛ درس في دمشق والمدينة المنورة، وأطروحته في جامعة إيست أنغليا (2017) تناولت دور رجال الدين المسلمين في الوئام بين الأديان في ألبانيا. بلغ عدد متابعي صفحته على فيسبوك 326 ألفا في أكتوبر 2024 بحسب دراسة «كونتكست»."
  en: "Albanian imam and public figure (born 16 April 1977 in Tirana), imam-khatib of Tirana's Dine Hoxha Mosque and a member of the Tirana Council of Muftis for over fifteen years; trained in Damascus and Medina, and author of a 2017 University of East Anglia dissertation on Muslim clergy and interreligious harmony in Albania. His Facebook page counted 326,000 followers in October 2024 (Context study)."
  ur: "احمد کالایا ⁦(پیدائش 1977ء، تیرانا)⁩ البانوی امام اور عوامی شخصیت ہیں، تیرانا کی دینے خوجا مسجد کے امام و خطیب اور پندرہ برس سے زائد عرصے سے تیرانا مفتی کونسل کے رکن؛ دمشق اور مدینہ منورہ میں تعلیم حاصل کی اور 2017ء میں یونیورسٹی آف ایسٹ اینگلیا سے البانیا میں بین المذاہب ہم آہنگی پر مقالہ لکھا۔ اکتوبر 2024ء میں ان کے فیس بک صفحے کے فالوورز 326 ہزار تھے ⁦(کانٹیکسٹ مطالعہ)⁩۔"
  es: "Imán y figura pública albanesa (nacido el 16 de abril de 1977 en Tirana), imán-khatib de la mezquita Dine Hoxha de Tirana y miembro del Consejo de Muftíes de Tirana durante más de quince años; se formó en Damasco y Medina, y es autor de una tesis doctoral de 2017 para la Universidad de East Anglia sobre el clero musulmán y la armonía interreligiosa en Albania. Su página de Facebook contaba con 326 000 seguidores en octubre de 2024 (Estudio de Contexto)."
  fr: "Imam et personnalité publique albanaise (né le 16 avril 1977 à Tirana), imam-khatib de la mosquée Dine Hoxha de Tirana et membre du Conseil des muftis de Tirana depuis plus de quinze ans; formé à Damas et à Médine, il est l’auteur d’une thèse de doctorat (2017) de l’Université d’East Anglia sur le clergé musulman et l’harmonie interreligieuse en Albanie. Sa page Facebook comptait 326 000 abonnés en octobre 2024 (étude de contexte)."
  tr: "1977'de Tiran'da doğan Arnavut bir imam ve kamu figürü olan bu kişi, Tiran'daki Dinh Hoxha Camii'nin imamı ve vaizidir ve on beş yıldan fazla bir süredir Tiran Müftüler Konseyi üyesidir. Şam ve Medine'de eğitim görmüş olup, Doğu Anglia Üniversitesi'ndeki doktora tezinde (2017) Arnavutluk'ta dinler arası uyumda Müslüman dinî liderlerin rolünü ele almıştır. Contact tarafından yapılan bir araştırmaya göre, Ekim 2024'te Facebook sayfasının 326.000 takipçisi bulunmaktaydı."
  id: "Seorang imam dan tokoh masyarakat Albania (lahir 1977 di Tirana), ia adalah imam dan penceramah Masjid Dinh Hoxha di Tirana dan telah menjadi anggota Dewan Mufti Tirana selama lebih dari lima belas tahun. Ia belajar di Damaskus dan Madinah, dan disertasinya di Universitas East Anglia (2017) membahas peran para pemimpin agama Muslim dalam kerukunan antaragama di Albania. Halaman Facebook-nya memiliki 326.000 pengikut pada Oktober 2024, menurut sebuah studi oleh Contact."
