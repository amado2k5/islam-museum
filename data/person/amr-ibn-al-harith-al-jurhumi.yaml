summary:
  ar: "الجرهمي الذي خرج عند جلاء جرهم عن مكة بغزالي الكعبة وحجر الركن الأسود فدفنهما في بئر زمزم، وانطلق بقومه إلى اليمن وقال في الحزن على مكة شعره المشهور؛ وهو غير مضاض بن عمرو الأكبر صهر إسماعيل، في رواية ابن إسحاق التي ينقلها الرحيق المختوم."
  en: "The Jurhumite who, when Jurhum was driven from Mecca, carried off the Kaaba's two gazelles and the Black Stone and buried them in the well of Zamzam, then led his people to Yemen and composed the famous lament for Mecca; not to be confused with the elder Mudad ibn Amr, Ismail's father-in-law, in Ibn Ishaq's account as cited by al-Raheeq al-Makhtum."
