summary:
  ar: "فارس بني عبس وشاعرها الشهير عبدُ أمه أسود، عدّه عمرو بن معد يكرب عند عمر بن الخطاب فيمن يخشى لقاءه وقال عبداها عنترة العبسي وسليك المناقب مع حرّي العرب عامر بن الطفيل وعيينة بن الحارث التميمي {cite:muruj-al-dhahab p. 621}."
  en: "'Abs's celebrated slave-born knight-poet — counted by 'Amr ibn Ma'dikarib among the four men he would fear to meet {cite:muruj-al-dhahab p. 621}."
  es: "'Abs, el célebre caballero-poeta nacido esclavo, contado por 'Amr ibn Ma'dikarib entre los cuatro hombres a los que temería encontrarse {cite:muruj-al-dhahab p. 621}."
  fr: "Le célèbre chevalier-poète né esclave d'Abs — compté par 'Amr ibn Ma'dikarib parmi les quatre hommes qu'il craignait de rencontrer {cite:muruj-al-dhahab p. 621}."
  ur: "'عبس کے مشہور غلام میں پیدا ہونے والا نائٹ شاعر - عمرو بن معدکریب نے ان چار آدمیوں میں شمار کیا ہے جن سے وہ ملنے سے ڈرتا ہے {حوالہ: مروج الذہب صفحہ 621}۔"
  tr: "Banu Abs şövalyesi ve ünlü şairi Abd Amah Asvad, Amr ibn Ma'ad tarafından kendisiyle karşılaşmaktan korkanların Ömer ibn El-Hattab'tan dolayı üzgün olduğunu düşündü. Hizmetkârı Antarah Al-Absi ve erdemlerin İpek Arapların özgür adamları Emir ibn el-Tufey ve Uyaynah ibn al-Harit al-Tamimi ile birlikte konuştu {atıf:Muruj-al-Dhahab, s. 621}."
  id: "Ksatria Banu Abs dan penyair terkenalnya, Abd Amah Aswad, menganggapnya oleh Amr ibn Ma'ad sebagai orang yang terganggu oleh Umar ibn Al-Khattab terhadap mereka yang takut bertemu dengannya. Pelayannya Antarah Al-Absi dan Sutra yang berbakat-budi berbicara kepada orang-orang Arab yang merdeka, Amir ibn al-Tufayl, dan Uyaynah ibn al-Harith al-Tamimi {cite:muruj-al-dhahab, hlm. 621}."
