summary:
  ar: "محدث هندي ⁦(1901–1992)⁩ من كبار محققي كتب السنة في القرن العشرين. اشتهر بتحقيقه الموسوعي لمصنّفي عبد الرزاق وابن أبي شيبة، وهما من أوسع مصادر الحديث المبكر، فضلًا عن تحقيقات أخرى نشرتها المكتبة السلفية والمجلس العلمي بالهند."
  en: "Indian hadith scholar (1901–1992), among the foremost editors of hadith compilations in the twentieth century. He is famed for his monumental critical editions of the Musannafs of Abd al-Razzaq and Ibn Abi Shayba, two of the widest sources of early hadith, besides other editions published in India."
  ur: "ہندوستانی محدث ⁦(1901–1992)⁩ جو بیسویں صدی میں کتبِ حدیث کے محققین میں سرِفہرست ہیں۔ وہ عبد الرزاق اور ابن ابی شیبہ کے مصنفوں کی عظیم تحقیق و تدوین کے لیے مشہور ہیں جو ابتدائی حدیث کے وسیع ترین ماخذوں میں ہیں، اس کے علاوہ ہندوستان میں شائع ہونے والی دیگر تحقیقیں بھی ان سے منسوب ہیں۔"
  es: "Erudito indio de hadices (1901-1992), uno de los editores más destacados de compilaciones de hadices del siglo XX. Es famoso por sus monumentales ediciones críticas de los Musannafs de Abd al-Razzaq e Ibn Abi Shayba, dos de las fuentes más extensas de hadices antiguos, además de otras ediciones publicadas en la India."
  fr: "Érudit indien du hadith (1901-1992), il compte parmi les plus éminents éditeurs de compilations de hadiths du XXe siècle. Il est célèbre pour ses éditions critiques monumentales des Musannafs d'Abd al-Razzaq et d'Ibn Abi Shayba, deux des sources les plus importantes de hadiths anciens, ainsi que pour d'autres éditions publiées en Inde."
