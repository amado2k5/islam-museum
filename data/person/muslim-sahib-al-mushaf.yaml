id: person/muslim-sahib-al-mushaf
class: person
label: { ar: "مسلم صاحب المصحف", en: "Muslim, the mushaf-bearer", es: "Muslim, the mushaf-bearer", fr: "Muslim, the mushaf-bearer", ur: "مسلمان، مصحف اٹھانے والا" }
summary:
  ar: "رجل من أصحاب علي بعثه إلى أهل الجمل معه مصحف يدعوهم إلى الله فرموه بسهم فقتلوه فحمل إلى علي وقالت أمه يا رب إن مسلماً أتاهم يتلو كتاب الله لا يخشاهم {cite:muruj-al-dhahab p. 654-655}."
  en: "Ali's envoy bearing the codex to the Camel camp, shot dead mid-call — his mother's lament preserved: 'a Muslim came to them reciting God's book, fearing them not' {cite:muruj-al-dhahab p. 654-655}."
  es: "El enviado de Ali que llevaba el códice al campamento de Camellos fue asesinado a tiros en plena visita; el lamento de su madre se conservó: \"Un musulmán vino a ellos recitando el libro de Dios, sin temerles\" {cite:muruj-al-dhahab p. 654-655}."
  fr: "L'envoyé d'Ali portant le codex au camp des Chameaux, abattu en plein appel — les lamentations de sa mère préservées: « un musulman est venu à eux en récitant le livre de Dieu, sans les craindre » {cite: muruj-al-dhahab p. 654-655}."
  ur: "علی کا ایلچی اونٹ کیمپ میں کوڈیکس لے کر جا رہا تھا، مڈ کال پر گولی مار کر ہلاک کر دیا گیا - اس کی والدہ کا نوحہ محفوظ ہے: 'ایک مسلمان ان کے پاس آیا جو خدا کی کتاب کی تلاوت کرتا تھا، ان سے ڈرتا نہیں تھا'۔ 654-655}۔"
  tr: "Ali'nin yoldaşlarından bir adam onu bir Kur'an ile deve halkına gönderdi ve onları Allah'a çağırdı, onlar da onu bir okla vurup öldürdü ve Ali'ye götürüldü. Annesi, 'Ey Rabbim, gerçekten bir Müslüman onlara Allah'ın Kitabı'nı korkmadan okuyarak geldi.' dedi. {alıntı:Muruj-al-Dhahab s. 654-655}."
  id: "Seorang pria dari sahabat Ali mengirimnya kepada orang-orang Unta dengan Al-Qur'an memanggil mereka kepada Allah, sehingga mereka menembaknya dengan panah dan membunuhnya, sehingga dia dibawa kepada Ali. Ibunya berkata, 'Ya Tuhan, memang seorang Muslim datang kepada mereka sambil membaca Kitab Allah tanpa takut kepada mereka.' {cite:muruj-al-dhahab hlm. 654-655}."
