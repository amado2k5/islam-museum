id: person/al-majusi-hafsi
class: person
label:
  ar: المجوسي
  en: al-Majusi
summary:
  ar: "أندلسي جاء إلى تونس فخدم في أعمال السلطان أبي زكريا الحفصي، ونبه على أن أعمال الدولة منضبطة لا محصلة في ديوان فدُفعت إليه فأنمى جبايتها وقرّر ديوانها، واستعمله السلطان في الأشغال وهي خطة لا يليها إلا كبير من مشيخة الموحدين، فاتخذ شارة أرباب السيوف وارتبط الخيل، حتى قيل له ذات يوم: «عندي ببابك ألف من الجنود أرم بهم من تشاء من أمثالهم»، فأعرض عنه السلطان وسطا به وتقبض عليه سنة 689هـ ووكل امتحانه إلى أعدائه."
  en: "An Andalusi who entered Sultan Abu Zakariya's service at Tunis, showed him the state's revenues were unaccounted in any diwan, and was put in charge — enlarging the tax yield and fixing the register until appointed to the Ashghal office that only a senior Almohad shaykh had held; he took the insignia of the sword-lords and kept his own cavalry until, having boasted of a thousand soldiers at his door, the Sultan arrested him in 689 AH and handed his torture to his enemies."
