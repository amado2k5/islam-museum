  en: al-Majusi
  es: "al-Majusi"
  fr: "al-Majusi"
  ur: "المجوسی"
summary:
  ar: "أندلسي جاء إلى تونس فخدم في أعمال السلطان أبي زكريا الحفصي، ونبه على أن أعمال الدولة منضبطة لا محصلة في ديوان فدُفعت إليه فأنمى جبايتها وقرّر ديوانها، واستعمله السلطان في الأشغال وهي خطة لا يليها إلا كبير من مشيخة الموحدين، فاتخذ شارة أرباب السيوف وارتبط الخيل، حتى قيل له ذات يوم: «عندي ببابك ألف من الجنود أرم بهم من تشاء من أمثالهم»، فأعرض عنه السلطان وسطا به وتقبض عليه سنة 689هـ ووكل امتحانه إلى أعدائه."
  en: "An Andalusi who entered Sultan Abu Zakariya's service at Tunis, showed him the state's revenues were unaccounted in any diwan, and was put in charge — enlarging the tax yield and fixing the register until appointed to the Ashghal office that only a senior Almohad shaykh had held; he took the insignia of the sword-lords and kept his own cavalry until, having boasted of a thousand soldiers at his door, the Sultan arrested him in 689 AH and handed his torture to his enemies."
  es: "Un andalusí que entró al servicio del sultán Abu Zakariya en Túnez le demostró que los ingresos del estado no estaban contabilizados en ningún diwan, y fue puesto a cargo, aumentando la recaudación de impuestos y arreglando el registro hasta que fue nombrado para el cargo de Ashghal, que solo un jeque almohade de alto rango había ostentado; tomó las insignias de los señores de la espada y mantuvo su propia caballería hasta que, después de jactarse de tener mil soldados a su puerta, el sultán lo arrestó en el año 689 de la Hégira y entregó su tortura a sus enemigos."
  fr: "Un Andalou entré au service du sultan Abu Zakariya à Tunis lui montra que les revenus de l'État n'étaient comptabilisés dans aucun diwan et fut chargé de cette tâche. Il augmenta les recettes fiscales et fixa le registre jusqu'à sa nomination au poste d'Ashghal, fonction jusque-là réservée aux cheikhs almohades de haut rang. Il adopta les insignes des seigneurs de l'épée et conserva sa propre cavalerie jusqu'à ce que, se vantant d'avoir mille soldats à sa porte, le sultan l'arrête en 689 AH et confie son supplice à ses ennemis."
  ur: "ایک اندلسی جو تیونس میں سلطان ابو زکریا کی خدمت میں داخل ہوا، اس نے اسے دکھایا کہ ریاست کی آمدنی کسی بھی دیوان میں بے حساب تھی، اور اسے انچارج بنایا گیا - ٹیکس کی پیداوار کو بڑھانا اور رجسٹر کو درست کرنا یہاں تک کہ اشغل کے دفتر میں مقرر کیا گیا جو صرف ایک سینئر الموحد شیخ کے پاس تھا۔ اس نے تلواروں کے سرداروں کا نشان لے لیا اور اپنے گھڑ سواروں کو رکھا یہاں تک کہ اس کے دروازے پر ایک ہزار سپاہیوں کا فخر کر کے سلطان نے اسے 689 ہجری میں گرفتار کر کے دشمنوں کے حوالے کر دیا۔"
  tr: "Bir Endülüslü Tunus'a geldi ve Sultan Ebu Zekeriye el-Hafsi'nin işlerinde görev yaptı. Devlet işlerinin disiplinli olduğunu ve divanda yapılamayacağını söyledi, bu yüzden ona ödedi, vergileri artırdı ve divanını kurdu. Sultan onu görevlerde çalıştırdı; bu görevi yalnızca kıdemli bir Muhammed şeyhi takip etti. Kılıç ustalarının rozetini aldı ve süvarileri bağladı, ta ki bir gün ona: \"Kapında binlerce asker var, istediğin gibi götüreceğim\" denildi. Sultan müdahale etmeyi reddetti ve 689 Hicri'de tutuklandı, incelemesini düşmanlarına emanet etti."
  id: "Seorang Andalusia datang ke Tunis dan melayani dalam urusan Sultan Abu Zakariya al-Hafsi. Ia memperingatkan bahwa urusan negara diatur dan tidak tercapai dalam diwan, sehingga ia membayarkannya, lalu menaikkan pajak dan mendirikan diwan. Sultan mempekerjakannya dalam jabatan, posisi yang hanya diikuti oleh seorang sheikh Almohad senior. Ia mengambil lambang pendekar pedang dan mengikat kavaleri, hingga suatu hari dikatakan kepadanya: \"Di depan pintumu, aku punya seribu tentara untuk dilemparkan siapa pun yang kau inginkan.\" Sultan menolak campur tangan, dan ia ditangkap pada tahun 689 H, mempercayakan pemeriksaannya kepada musuh-musuhnya."
