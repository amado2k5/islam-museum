  ur: "آمد (دیار بکر) کے عثمانی عالم، سلیمانیہ کی فہرستوں کے مطابق 1000ھ میں فوت؛ اہلِ سنت کے عقیدے پر «اسلامی ہیئت» کی بکثرت نقل ہونے والی کتابوں کے مصنف، جن کا مواد سیوطی سے ماخوذ ہے {cite:heinen-islamic-cosmology p. 17}."
