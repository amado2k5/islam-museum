  ar: "عالم عثماني من آمد (ديار بكر)، تذكر فهارس السليمانية وفاته سنة 1000هـ، صاحب كتب كثيرة النسخ في «الهيئة الإسلامية» على اعتقاد أهل السنة دون الفلاسفة، أخذ مادتها من السيوطي {cite:heinen-islamic-cosmology p. 17} {cite:heinen-islamic-cosmology p. 19}."
