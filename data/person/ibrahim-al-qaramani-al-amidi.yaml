summary:
  ar: "عالم عثماني من آمد ⁦(ديار بكر)⁩، تذكر فهارس السليمانية وفاته سنة 1000هـ، صاحب كتب كثيرة النسخ في «الهيئة الإسلامية» على اعتقاد أهل السنة دون الفلاسفة، أخذ مادتها من السيوطي {cite:heinen-islamic-cosmology p. 17} {cite:heinen-islamic-cosmology p. 19}."
  en: "Ottoman scholar from Amida (Diyarbakir), dated by the Süleymaniye catalogues to 1000 AH, author of widely copied treatises on 'Islamic astronomy' following the tenets of the People of the Sunna rather than the philosophers, drawn from al-Suyuti {cite:heinen-islamic-cosmology p. 17} {cite:heinen-islamic-cosmology p. 19}."
  ur: "آمد ⁦(دیار بکر)⁩ کے عثمانی عالم، سلیمانیہ کی فہرستوں کے مطابق 1000ھ میں فوت؛ اہلِ سنت کے عقیدے پر «اسلامی ہیئت» کی بکثرت نقل ہونے والی کتابوں کے مصنف، جن کا مواد سیوطی سے ماخوذ ہے {cite:heinen-islamic-cosmology p. 17}."
  es: "Erudito otomano de Amida (Diyarbakir), datado por los catálogos de Süleymaniye en el año 1000 AH, autor de tratados ampliamente copiados sobre \"astronomía islámica\" que seguían los principios de la Gente de la Sunna en lugar de los filósofos, extraídos de al-Suyuti {cite:heinen-islamic-cosmology p. 17} {cite:heinen-islamic-cosmology p. 19}."
  fr: "Érudit ottoman d'Amida (Diyarbakir), daté par les catalogues de Süleymaniye à l'an 1000 AH, auteur de traités largement copiés sur « l'astronomie islamique » suivant les principes des Gens de la Sunna plutôt que ceux des philosophes, tirés d'al-Suyuti {cite:heinen-islamic-cosmology p. 17} {cite:heinen-islamic-cosmology p. 19}."
  tr: "Amid (Diyarbakır) kökenli bir Osmanlı âlimi olan Süleymaniye dizinleri, onun 1000 Hicri yılında ölümünü belirtir; 'İslami Otorite' üzerine birçok kopya yazarı, filozoflardan ziyade Ehl-sünnet inançlarına göre ve materyallerini el-Suyuti'den almıştır {atı:heinen-İslamik-kozmoloji, s. 17} {atı:heinen-İslam-kozmoloji, s. 19}}."
  id: "Seorang ulama Ottoman dari Amid (Diyarbakir), indeks Sulaymaniyah menyebutkan kematiannya pada tahun 1000 H, penulis banyak salinan tentang 'Otoritas Islam' menurut kepercayaan Ahl al-Sunnah, bukan filsuf, mengambil materi dari al-Suyuti {cite:heinen-Islamic-cosmology, hlm. 17} {cite:heinen-islamic-cosmology, hlm. 19}."
