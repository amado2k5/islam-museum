summary:
  ar: "خطيب حران وابن خطيبها الفخر؛ سمع بها من والده فخر الدين وعبد القادر الرهاوي وغيرهما ورحل إلى بغداد فسمع من ابن سكينة وابن طبرزد وغيرهما، وأخذ الفقه عن غلام ابن المني، ورجع إلى حران وقام مقام أبيه بعد وفاته فكان يخطب ويعظ ويدرس ويلقي التفسير في الجامع على الكرسي؛ قال ابن حمدان كان خطيباً نصيحاً رئيساً ثابتاً رزين العقل، وله تصنيف الزوائد على تفسير الوالد وإهداء القرب إلى ساكني الترب {cite:shadharat-dhahab p. 205}."
  en: "Sayf al-Din Abd al-Ghani b. Fakhr al-Din Ibn Taymiyya (b. Safar 581, d. 7 Muharram 639, Harran) — succeeded his father as Harran's khatib, preaching and giving tafsir from the chair; uncle-line of Taqi al-Din Ibn Taymiyya {cite:shadharat-dhahab p. 205}."
  es: "Sayf al-Din Abd al-Ghani b. Fakhr al-Din Ibn Taymiyya (n. Safar 581, m. 7 Muharram 639, Harran) - sucedió a su padre como khatib de Harran, predicando y dando tafsir desde la silla; línea de tío de Taqi al-Din Ibn Taymiyya {cita: shadharat-dhahab p. 205}."
  fr: "Sayf al-Din Abd al-Ghani b. Fakhr al-Din Ibn Taymiyya (né Safar 581, décédé le 7 Muharram 639, Harran) — succéda à son père en tant que khatib d'Harran, prêchant et donnant le tafsir depuis la chaise; lignée oncle de Taqi al-Din Ibn Taymiyya {cite: shadharat-dhahab p. 205}."
  ur: "سیف الدین عبد الغنی فخر الدین ابن تیمیہ ⁦(پیدائش صفر 581، وفات 7 محرم 639، حران)⁩ - اپنے والد کے بعد حران کے خطیب کے طور پر، کرسی سے تبلیغ اور تفسیر دیتے تھے۔ تقی الدین ابن تیمیہ کے ماموں سطر {حوالہ: شدارت ذہاب صفحہ 14۔ 205}۔"
  tr: "Harran'ın vaizi ve vaizi El-Fahr'ın oğlu; bunu babası Fakhr al-Din, Abdül-Kadır el-Rahhavi ve diğerlerinden duydu. Bağdat'a seyahat etti ve İbn Sukayna, İbn Tabarzad ve diğerlerinden dinledi. İbn el-Münni'nin hizmetkarından fıkıh aldı, Harran'a döndü ve babasının ölümünden sonra onun yerine geçti. Kürsüde camide vaaz verir, vaaz verir, öğretir ve tefsir okuyordu; İbn Hamdan ise vaiz, lider, kararlı ve babasının yorumuna göre fazlalıklarla dolu ve toprak sakinlerine yakınlık adayan biri olduğunu söylemiştir {atıf: shadharat-dhahab, s. 205}."
  id: "Pengkhotbah Harran dan putra pendakwahnya Al-Fakhr; ia mendengarnya dari ayahnya Fakhr al-Din, Abd al-Qadir al-Rahhawi, dan lainnya. Ia pergi ke Baghdad dan mendengar dari Ibn Sukayna, Ibn Tabarzad, dan lainnya. Ia belajar hukum di bawah pelayan Ibn al-Munni, kembali ke Harran, dan menggantikan ayahnya setelah kematiannya. Ia biasa berkhotbah, berkhotbah, mengajar, dan menyampaikan tafsir di masjid di kursi; Ibn Hamdan mengatakan ia adalah seorang pengkhotbah, pemimpin, teguh, dan terdiri dari kelebihan penafsiran ayahnya serta mendedikasikan kedekatan dengan penduduk tanah itu {cite:shadharat-dhahab, hlm. 205}."
