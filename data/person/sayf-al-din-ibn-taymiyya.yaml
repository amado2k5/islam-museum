summary:
  ar: "خطيب حران وابن خطيبها الفخر؛ سمع بها من والده فخر الدين وعبد القادر الرهاوي وغيرهما ورحل إلى بغداد فسمع من ابن سكينة وابن طبرزد وغيرهما، وأخذ الفقه عن غلام ابن المني، ورجع إلى حران وقام مقام أبيه بعد وفاته فكان يخطب ويعظ ويدرس ويلقي التفسير في الجامع على الكرسي؛ قال ابن حمدان كان خطيباً نصيحاً رئيساً ثابتاً رزين العقل، وله تصنيف الزوائد على تفسير الوالد وإهداء القرب إلى ساكني الترب {cite:shadharat-dhahab p. 205}."
  en: "Sayf al-Din Abd al-Ghani b. Fakhr al-Din Ibn Taymiyya (b. Safar 581, d. 7 Muharram 639, Harran) — succeeded his father as Harran's khatib, preaching and giving tafsir from the chair; uncle-line of Taqi al-Din Ibn Taymiyya {cite:shadharat-dhahab p. 205}."
