summary:
  ar: "يعرب بن قحطان بن عابر بن شالخ بن أرفخشذ بن سام بن نوح، سار بمن تبعه من ولده وغيره فحل باليمن وهو يقول أنا ابن قحطان الهمام الأفضل الأيمن المعرب ذي المهلل أنا البدي باللسان المسهل، وكان ممن تكلم بالعربية يعرب وجرهم وعاد وعبيل وجديس وثمود وعملاق وطسم ووبار وعبد ضخم {cite:muruj-al-dhahab p. 448}."
  en: "Son of Qahtan who led his following into Yemen chanting his own verses — the first, in this genealogy, of the Arabic-speaking nations alongside Jurhum, 'Ad, 'Abil, Jadis, Thamud, 'Amaliq, Tasm, Wabar and Abd Dakhmi {cite:muruj-al-dhahab p. 448}."
