id: person/yarub-ibn-qahtan
class: person
label: { ar: "يعرب بن قحطان", en: "Ya'rub ibn Qahtan", es: "Ya'rub ibn Qahtan", fr: "Ya'rub ibn Qahtan", ur: "یثرب بن قحطان" }
summary:
  ar: "يعرب بن قحطان بن عابر بن شالخ بن أرفخشذ بن سام بن نوح، سار بمن تبعه من ولده وغيره فحل باليمن وهو يقول أنا ابن قحطان الهمام الأفضل الأيمن المعرب ذي المهلل أنا البدي باللسان المسهل، وكان ممن تكلم بالعربية يعرب وجرهم وعاد وعبيل وجديس وثمود وعملاق وطسم ووبار وعبد ضخم {cite:muruj-al-dhahab p. 448}."
  en: "Son of Qahtan who led his following into Yemen chanting his own verses — the first, in this genealogy, of the Arabic-speaking nations alongside Jurhum, 'Ad, 'Abil, Jadis, Thamud, 'Amaliq, Tasm, Wabar and Abd Dakhmi {cite:muruj-al-dhahab p. 448}."
  es: "Hijo de Qahtan que condujo a sus seguidores a Yemen recitando sus propios versos; el primero, en esta genealogía, de las naciones de habla árabe junto con Jurhum, 'Ad, 'Abil, Jadis, Thamud, 'Amaliq, Tasm, Wabar y Abd Dakhmi {cite:muruj-al-dhahab p. 448}."
  fr: "Fils de Qahtan qui a conduit ses disciples au Yémen en chantant ses propres versets — le premier, dans cette généalogie, des nations arabophones aux côtés de Jurhum, 'Ad, 'Abil, Jadis, Thamud, 'Amaliq, Tasm, Wabar et Abd Dakhmi {cite:muruj-al-dhahab p. 448}."
  ur: "قحطان کا بیٹا جس نے اپنی آیات پڑھتے ہوئے یمن میں اپنے پیروکاروں کی رہنمائی کی - اس نسب میں سب سے پہلے، عربی بولنے والی قوموں میں سے جورم، عاد، ابیل، جدیس، ثمود، عمالیق، تسم، وبر اور عبد الدخمی {حوالہ: مروج الذہب ص۔ 448}۔"
  tr: "Ya'rub ibn Kahtan ibn Abir ibn Shalakh ibn Arfakhshd ibn Sam ibn Noah, kendisinden sonra gelenleri kendi soyundan ve diğerlerinden yöneten ve Yemen'de bir aygır olarak şöyle demiştir: Ben Qahtan'ın oğluyum, soylu, en iyi, sağ elini kullanan, Araplaşmış, konuşan benim, Arapça konuşan benim; Arapça konuşanlar arasında Ya'rub, Jarhum, 'Ad, Abil, Jadis, Thamud, Gimel, Tasm, Wabar ve Abd Kahmid vardı. {atıf:Muruj-al-Dhahab, s. 448}."
  id: "Ya'rub ibn Qahtan ibn Abir ibn Shalakh ibn Arfakhshd ibn Sam ibn Noah, yang memimpin mereka yang mengikutinya dari keturunannya dan lainnya, dan dia adalah kuda jantan di Yaman yang berkata: Aku adalah putra Qahtan, yang mulia, yang terbaik, yang tangan kanan, yang telah diarabiskan, yang fasih, aku yang berbicara bahasa Arab, dan di antara mereka yang berbicara bahasa Arab adalah Ya'rub, Jarhum, 'Ad, Abil, Jadis, Thamud, Gimel, Tasm, Wabar, dan Abd Kahmid. {cite:Muruj-al-Dhahab, hlm. 448}."
