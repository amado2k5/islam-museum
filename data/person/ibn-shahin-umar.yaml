summary:
  ar: "عمر بن عثمان أبو حفص الواعظ المعروف بابن شاهين ⁦(297–385هـ)⁩، محدث بغداد بالجانب الشرقي؛ قال إن أول ما كتب الحديث بيده سنة ثمان وثلاثمائة وله إحدى عشرة سنة، وقال إنه صنّف ثلاثة وثلاثين مصنفاً أحدها التفسير الكبير في ألف جزء والمسند في ألف وخمسمائة جزء والتاريخ في مائة وخمسين جزءاً والزهد في مائة جزء، وحسب ما اشترى من الحبر فكان سبعمائة درهم؛ توفي في الحادي والعشرين من ذي الحجة سنة خمس وثمانين ودفن بمقبرة باب حرب {cite:muntazam-ibn-al-jawzi j.7 p.186-187}."
  en: "'Umar b. 'Uthman Abu Hafs the preacher, known as Ibn Shahin (297–385), muhaddith of eastern Baghdad: he first wrote hadith with his own hand at eleven, in 308, and counted thirty-three works to his name — among them a great tafsir of a thousand parts, a Musnad of fifteen hundred, a Tarikh of a hundred and fifty, and a Zuhd of a hundred; he reckoned he had spent seven hundred dirhams on ink. He died 21 Dhu'l-Hijja 385, buried at Bab Harb cemetery {cite:muntazam-ibn-al-jawzi j.7 p.186-187}."
  es: "'Umar b. 'Uthman Abu Hafs, el predicador, conocido como Ibn Shahin (297-385), muhaddith del este de Bagdad: escribió hadices de su puño y letra por primera vez a los once años, en el año 308, y se le atribuyen treinta y tres obras, entre ellas un gran tafsir de mil partes, un Musnad de mil quinientos, un Tarikh de ciento cincuenta y un Zuhd de cien; calculó haber gastado setecientos dirhams en tinta. Murió el 21 de Dhu'l-Hijja del año 385 y fue enterrado en el cementerio de Bab Harb {cite:muntazam-ibn-al-jawzi j.7 p.186-187}."
  fr: "'Umar b. 'Uthman Abu Hafs, le prédicateur connu sous le nom d'Ibn Shahin (297-385), muhaddith de l'est de Bagdad: il écrivit pour la première fois un hadith de sa propre main à l'âge de onze ans, en 308, et compta trente-trois ouvrages à son actif — parmi lesquels un grand tafsir de mille parties, un musnad de quinze cents, un tarikh de cent cinquante et un zuhd de cent; il estima avoir dépensé sept cents dirhams en encre. Il mourut le 21 Dhu'l-Hijja 385 et fut enterré au cimetière de Bab Harb (voir: muntazam-ibn-al-jawzi j.7 p.186-187)."
  ur: "عمر بی۔ عثمان ابو حفص مبلغ جو ابن شاہین (297-385) کے نام سے مشہور ہیں، مشرقی بغداد کے محدث: انہوں نے سب سے پہلے 308 میں گیارہ پر اپنے ہاتھ سے حدیث لکھی، اور اپنے نام سے تینتیس تصانیف شمار کیں، ان میں سے ایک ہزار حصوں پر مشتمل ایک عظیم تفسیر، ایک مسند، ایک سو 50 اور تذکرہ کی ایک بڑی تفسیر۔ سو میں سے اس نے سوچا کہ اس نے سیاہی پر سات سو درہم خرچ کیے ہیں۔ آپ کی وفات 21 ذی الحجہ 385 کو ہوئی، باب حرب قبرستان میں دفن ہوئے۔"
