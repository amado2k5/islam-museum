summary:
  ar: "عمر بن عثمان أبو حفص الواعظ المعروف بابن شاهين (297–385هـ)، محدث بغداد بالجانب الشرقي؛ قال إن أول ما كتب الحديث بيده سنة ثمان وثلاثمائة وله إحدى عشرة سنة، وقال إنه صنّف ثلاثة وثلاثين مصنفاً أحدها التفسير الكبير في ألف جزء والمسند في ألف وخمسمائة جزء والتاريخ في مائة وخمسين جزءاً والزهد في مائة جزء، وحسب ما اشترى من الحبر فكان سبعمائة درهم؛ توفي في الحادي والعشرين من ذي الحجة سنة خمس وثمانين ودفن بمقبرة باب حرب {cite:muntazam-ibn-al-jawzi j.7 p.186-187}."
  en: "'Umar b. 'Uthman Abu Hafs the preacher, known as Ibn Shahin (297–385), muhaddith of eastern Baghdad: he first wrote hadith with his own hand at eleven, in 308, and counted thirty-three works to his name — among them a great tafsir of a thousand parts, a Musnad of fifteen hundred, a Tarikh of a hundred and fifty, and a Zuhd of a hundred; he reckoned he had spent seven hundred dirhams on ink. He died 21 Dhu'l-Hijja 385, buried at Bab Harb cemetery {cite:muntazam-ibn-al-jawzi j.7 p.186-187}."
