summary:
  ar: "عمرو بن جرير البجلي، كان مجذوبًا ثم صار محبوبًا، وكان سبب توبته أنه خرج مع أحداث بالكوفة فلما همّ بالمعصية سمع هاتفًا يتلو معنى: كل نفس بما كسبت رهينة."
  en: "Amr ibn Jarir al-Bajali, first drawn in, then beloved; the cause of his repentance was that when he went out with youths in Kufa and meant to commit a sin, a voice recited to him the sense that every soul is held in pledge for what it has earned."
  ur: "عمرو بن جریر بجلی پہلے مجذوب تھے پھر محبوب ہو گئے۔ ان کی توبہ کا سبب یہ ہوا کہ وہ کوفہ میں نوجوانوں کے ساتھ نکلے، اور جب گناہ کا ارادہ کیا تو ایک آواز نے اس مفہوم کی آیت پڑھی کہ ہر جان اپنے کیے کے بدلے گروی ہے۔"
