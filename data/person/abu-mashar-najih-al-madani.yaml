summary:
  ar: "أبو معشر نجيح بن عبد الرحمن السندي المدني، مولى من اليمن من أصل هندي على الأرجح، عاش بالمدينة، وصنف كتاب المغازي الذي حفظ الواقدي وابن سعد أجزاء منه، وتوفي ببغداد سنة 170هـ/787م. {cite:encyclopaedia-of-islam-2 vol. 1 p. 159}"
  en: "Abu Ma'shar Najih b. Abd al-Rahman al-Sindi al-Madani, a freed slave from the Yaman, possibly of Indian parentage, who lived in Medina and wrote the Kitab al-Maghazi, of which al-Waqidi and Ibn Sa'd preserved fragments; he died in Baghdad in 170/787. {cite:encyclopaedia-of-islam-2 vol. 1 p. 159}"
  ur: "ابو معشر نجیح بن عبدالرحمن السندی المدنی، یمن کے آزاد کردہ غلام، غالباً ہندوستانی نسل کے، جو مدینہ میں رہے اور کتاب المغازی لکھی، جس کے ٹکڑے واقدی اور ابن سعد نے محفوظ کیے؛ بغداد میں 170ھ/787ء میں وفات پائی۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 159}"
