summary:
  ar: "كاتب ووجيه أوسيتي (1882–1928)، زعيم منشفي وصوت بارز لمسلمي روسيا سنة 1917: خطب في مؤتمر مسلمي عموم روسيا بموسكو، ورشّحه المجلس الإسلامي لعموم روسيا لمقعد في الحكومة المؤقتة، وجلس في الجمعية التأسيسية. وبعد استيلاء السوفيات على القوقاز هاجر إلى تشيكوسلوفاكيا وبولندا، حيث كتب رواية «أخ على أخ» وتوفي في وارسو سنة 1928."
  en: "Ossetian writer and public figure (1882–1928), a Menshevik leader and a leading voice of Russia's Muslims in 1917: he addressed the All-Russian Muslim Congress in Moscow, was proposed by the All-Russian Muslim Council for a seat in the Provisional Government, and sat in the Constituent Assembly. After the Soviet takeover of the Caucasus he emigrated to Czechoslovakia and Poland, where he wrote the novel 'Brother against Brother' and died at Warsaw in 1928."
  ur: "اوسیتی مصنف اور عوامی شخصیت (1882–1928)، مینشویک رہنما اور 1917 میں روس کے مسلمانوں کی نمایاں آواز: انہوں نے ماسکو میں آل روسی مسلم کانگریس سے خطاب کیا، آل روسی مسلم کونسل نے انہیں عبوری حکومت میں نشست کے لیے نامزد کیا، اور وہ دستور ساز اسمبلی کے رکن رہے۔ قفقاز پر سوویت قبضے کے بعد وہ چیکوسلواکیہ اور پولینڈ ہجرت کر گئے، جہاں انہوں نے ناول «بھائی بمقابلہ بھائی» لکھا اور 1928 میں وارسا میں انتقال کیا۔"
