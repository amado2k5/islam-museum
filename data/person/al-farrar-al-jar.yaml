summary:
  ar: "الفرار الجار، لقب لشخص لم يُذكر اسمه، لا يقرّ له قرار خوفًا من الملامة والاغترار. روى عمرو بن عثمان المكي أنه لقيه بين قرى مصر يدور، فقال له: وكيف يقرّ في مكان واحد من هو مطلوب؟ وقال: أخاف أن أستوطن الأوطان فيأخذني على غرة الاستيطان مع المغرورين."
  en: "al-Farrar al-Jar, an epithet for a person whose name the report does not give, who never settled, out of fear of blame and of delusion. Amr ibn Uthman al-Makki relates meeting him wandering among the villages of Egypt: he asked why he never stayed in one place; he answered: how can one settle in one place who is sought? When asked whether he was not in God's grip everywhere, he said yes, but he feared to make a home of the lands, lest God take him unawares in the security of settling, among the deluded."
  ur: "فرار جار، ایک ایسے شخص کا لقب جس کا نام روایت میں نہیں دیا گیا، جو ملامت اور دھوکے کے خوف سے کہیں نہیں ٹھہرتا تھا۔ عمرو بن عثمان مکی نے مصر کے گاؤں کے درمیان ان سے ملاقات نقل کی: انہوں نے پوچھا کہ تم ایک جگہ کیوں نہیں ٹھہرتے؟ انہوں نے کہا: جس کی تلاش ہو وہ ایک جگہ کیسے ٹھہر سکتا ہے؟ کہا گیا: کیا تم ہر جگہ اس کی گرفت میں نہیں؟ کہا: ہاں، مگر مجھے ڈر ہے کہ کہیں وطن نہ بنا لوں اور وہ مجھے غافل کر کے دھوکے والوں کے ساتھ پکڑ لے۔"
