summary:
  ar: "الفرار الجار، لقب لشخص لم يُذكر اسمه، لا يقرّ له قرار خوفًا من الملامة والاغترار. روى عمرو بن عثمان المكي أنه لقيه بين قرى مصر يدور، فقال له: وكيف يقرّ في مكان واحد من هو مطلوب؟ وقال: أخاف أن أستوطن الأوطان فيأخذني على غرة الاستيطان مع المغرورين."
  en: "al-Farrar al-Jar, an epithet for a person whose name the report does not give, who never settled, out of fear of blame and of delusion. Amr ibn Uthman al-Makki relates meeting him wandering among the villages of Egypt: he asked why he never stayed in one place; he answered: how can one settle in one place who is sought? When asked whether he was not in God's grip everywhere, he said yes, but he feared to make a home of the lands, lest God take him unawares in the security of settling, among the deluded."
  fr: "Al-Farrar al-Jar, épithète d’une personne dont le récit ne donne pas le nom, qui ne s’établissait jamais, par crainte du blâme et de l’illusion. Amr ibn Uthman al-Makki raconte l’avoir rencontré errant dans les villages d’Égypte : il lui demanda pourquoi il ne restait jamais au même endroit ; il répondit : comment celui qui est recherché pourrait-il s’établir quelque part ? À la question de savoir s’il n’était pas partout sous l’emprise de Dieu, il répondit oui, mais qu’il craignait de faire des pays son foyer, de peur que Dieu ne le saisisse à l’improviste dans la sécurité de l’installation, parmi les dupes."
  ur: "فرار جار، ایک ایسے شخص کا لقب جس کا نام روایت میں نہیں دیا گیا، جو ملامت اور دھوکے کے خوف سے کہیں نہیں ٹھہرتا تھا۔ عمرو بن عثمان مکی نے مصر کے گاؤں کے درمیان ان سے ملاقات نقل کی: انہوں نے پوچھا کہ تم ایک جگہ کیوں نہیں ٹھہرتے؟ انہوں نے کہا: جس کی تلاش ہو وہ ایک جگہ کیسے ٹھہر سکتا ہے؟ کہا گیا: کیا تم ہر جگہ اس کی گرفت میں نہیں؟ کہا: ہاں، مگر مجھے ڈر ہے کہ کہیں وطن نہ بنا لوں اور وہ مجھے غافل کر کے دھوکے والوں کے ساتھ پکڑ لے۔"
  es: "Al-Farrar al-Jar, un epíteto para una persona cuyo nombre no se menciona en el relato, que nunca se estableció por temor a la culpa y al engaño. Amr ibn Uthman al-Makki relata haberlo encontrado vagando por las aldeas de Egipto: le preguntó por qué nunca se quedaba en un solo lugar; él respondió: ¿cómo puede establecerse en un solo lugar quien es buscado? Cuando se le preguntó si no estaba en todas partes bajo la protección de Dios, dijo que sí, pero que temía hacer de las tierras su hogar, no fuera que Dios lo sorprendiera en la seguridad de establecerse, entre los engañados."
  tr: "Kaçak komşu, adı açıklanmayan ve suçlanma ve kibir korkusuyla asla bir yere yerleşmeyen kişi için kullanılan bir lakaptır. Amr ibn Uthman al-Makki, Mısır köyleri arasında dolaşırken ona rastladığını ve \"Aranan biri nasıl bir yerde yerleşebilir?\" diye sorduğunu anlatmıştır. O da şöyle cevap vermiştir: \"Korkarım ki, eğer yerleşirsem, kibirlilerin yerleşme kolaylığı karşısında hazırlıksız yakalanırım.\""
  id: "Tetangga buronan, julukan untuk seseorang yang tidak disebutkan namanya, adalah seseorang yang tidak pernah menetap karena takut dicela dan sombong. Amr ibn Uthman al-Makki menceritakan bahwa ia bertemu dengannya saat ia berkeliaran di antara desa-desa di Mesir dan bertanya kepadanya: \"Bagaimana mungkin seseorang yang dicari bisa menetap di satu tempat?\" Ia menjawab: \"Saya khawatir jika saya menetap, saya akan lengah karena kemudahan menetap bersama orang-orang yang sombong.\""
