id: person/ibn-zuhra-al-husayni
class: person
label: { ar: "ابن زهرة الحسيني" }
summary:
  ar: "الشيخ أبو علي الحسن بن زهرة الحسيني النقيب؛ رأس الشيعة بحلب وعزهم وجاههم وعالمهم، كان عارفاً بالقراءات والعربية والأخبار والفقه على رأي القوم، وكان متعيناً للوزارة ونفذ رسولاً إلى العراق وغيرها؛ توفي سنة عشرين وستمائة واندكت الشيعة بموته {cite:shadharat-dhahab p. 87}."
  tr: "Şeyh Ebu Ali el-Hasan bin Zehra el-Hüseyni el-Nekib; Halep'teki Şiilerin başı, onların onuru, prestiji ve bilimsel bilgisi. Kur'an okumaları, Arapça, haberler ve halkın görüşüne göre fıkıh bilgisine sahipti. Vaizliğe atandı ve Irak ile başka yerlere elçiler gönderdi; 620 Hicri yılında öldü ve Şiiler onun ölümüne yas tuttu {cite:shadharat-dhahab, s. 87}."
  id: "Sheikh Abu Ali al-Hasan ibn Zahra al-Husseini al-Naqeeb; kepala Syiah di Aleppo, kehormatan, prestise, dan pengetahuan ilmiah mereka. Ia menguasai bacaan Al-Qur'an, bahasa Arab, berita, dan fiksi menurut pendapat rakyat. Ia diangkat menjadi menteri dan mengirim utusan ke Irak dan tempat lain; ia wafat pada tahun 620 H, dan Syiah berduka atas kematiannya {cite:shadharat-dhahab, hlm. 87}."
