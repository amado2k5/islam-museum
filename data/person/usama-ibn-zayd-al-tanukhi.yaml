id: person/usama-ibn-zayd-al-tanukhi
class: person
label: { ar: "أسامة بن زيد التنوخي" }
gender: male
roles: [emir]
summary:
  ar: "صاحب خراج مصر في عهد سليمان بن عبد الملك، ويذكر الكتاب أنه كان غاشماً ظلوماً يقطع الأيدي في العقوبات دون تحقق شروط القطع، فعزله عمر بن عبد العزيز وأمر بحبسه سنة بمصر وسنة بفلسطين، ثم أعاده يزيد بن عبد الملك إلى عمله بعد وفاة عمر {cite:salabi-umayyad-state-2020 p.202}. ويذكر الكتاب أن يزيد بن عبد الملك أعاده على خراج مصر بعد وفاة عمر، فهو من الولاة الذين فُصل بين السلطة الإدارية والمالية فيهم. {cite:salabi-umayyad-state-2020 p.435-436}"
  tr: "Süleyman bin Abdülmelik'in saltanatı sırasında Mısır vergisinin sahibiydi. Kitapta, onun zalim ve zorba olduğu, ceza olarak ellerini kestiği ve kesim koşullarını yerine getirmediği belirtilir. Ömer bin Abdülaziz onu görevden aldı ve bir yıl Mısır'da, bir yıl Filistin'de hapis cezası verdi. Daha sonra Yazid bin Abdülmelik, Umar'ın ölümünden sonra onu yeniden göreve getirdi {cite:selabi-umayyad-state-2020 s.202}. Kitapta, Yazid bin Abd al-Malik'in Ömer'in ölümünden sonra onu Mısır vergisine geri verdiği belirtilir; çünkü o, idari ve mali otoriteyi ayıran valiler arasında yer almıştır. {cite:salabi-umayyad-state-2020 s.435-436}"
  id: "Ia adalah pemilik pajak Mesir selama masa pemerintahan Sulayman ibn Abd al-Malik. Buku tersebut menyebutkan bahwa ia kejam dan tiran, memotong tangan dalam hukuman tanpa memenuhi syarat amputasi. Umar ibn Abd al-Aziz memecatnya dan memerintahkan agar ia dipenjara selama satu tahun di Mesir dan satu tahun di Palestina. Kemudian Yazid ibn Abd al-Malik mengembalikannya setelah kematian Umar {cite:salabi-umayyad-state-2020 hlm.202}. Buku tersebut menyebutkan bahwa Yazid ibn Abd al-Malik mengembalikannya ke pajak Mesir setelah kematian Umar, karena ia termasuk di antara gubernur yang memisahkan otoritas administratif dan keuangan. {cite:salabi-umayyad-state-2020 hlm.435-436}"
