summary:
  ar: "صاحب خراج مصر في عهد سليمان بن عبد الملك، ويذكر الكتاب أنه كان غاشماً ظلوماً يقطع الأيدي في العقوبات دون تحقق شروط القطع، فعزله عمر بن عبد العزيز وأمر بحبسه سنة بمصر وسنة بفلسطين، ثم أعاده يزيد بن عبد الملك إلى عمله بعد وفاة عمر {cite:salabi-umayyad-state-2020 p.202}. ويذكر الكتاب أن يزيد بن عبد الملك أعاده على خراج مصر بعد وفاة عمر، فهو من الولاة الذين فُصل بين السلطة الإدارية والمالية فيهم. {cite:salabi-umayyad-state-2020 p.435-436}"
