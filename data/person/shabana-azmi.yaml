summary:
  ar: "ممثلة وناشطة هندية (وُلدت سنة 1950) في حيدر آباد، ابنة الشاعر كيفي أعظمي، من أبرز وجوه السينما الموازية منذ «أنكور» (1974)، حازت جائزة الفيلم الوطنية لأفضل ممثلة خمس مرات — رقم قياسي — وكانت عضواً مرشحاً في مجلس الشيوخ (1997–2003)، ونالت بادما شري وبادما بوشان (2012)."
  en: "Indian actress and activist (born 1950) at Hyderabad, daughter of the poet Kaifi Azmi; a leading face of parallel cinema since Ankur (1974), she won the National Film Award for Best Actress a record five times, served as a nominated member of the Rajya Sabha (1997–2003), and received the Padma Shri and the Padma Bhushan (2012)."
  ur: "بھارتی اداکارہ اور سماجی کارکن (پیدائش 1950) جو حیدر آباد میں پیدا ہوئیں، شاعر کیفی اعظمی کی بیٹی ہیں؛ «انکر» (1974) سے متوازی سنیما کا نمایاں چہرہ رہیں، بہترین اداکارہ کا قومی فلم ایوارڈ ریکارڈ پانچ مرتبہ جیتا، راجیہ سبھا کی نامزد رکن (1997–2003) رہیں اور پدم شری اور پدم بھوشن (2012) سے نوازی گئیں۔"
