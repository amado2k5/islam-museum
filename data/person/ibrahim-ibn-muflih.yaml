summary:
  ar: "شيخ الحنابلة ورئيسهم وقاضي قضاتهم بدمشق؛ من تصانيفه كتاب فضل الصلاة على النبي وكتاب الملائكة وشرح المقنع وطبقات أصحاب الإمام أحمد، وتلف غالبها في فتنة تيمور؛ ولما وقعت فتنة التتار كان آخر من تأخر بدمشق ثم خرج إلى تيمور ومعه جماعة ووقع بينه وبين عبد الجبار المعتزلي إمام تيمور مناظرات وإلزامات بحضرة تمرلنك فأعجبه ومال إليه فتكلم معه في الصلح فأجاب إلى ذلك ثم غيّر، فتألم صاحب الترجمة إلى أن توفي {cite:shadharat-dhahab p. 30-31}."
  en: "Shaykh of the Hanbalis — last to leave Damascus in Timur's fitna, he debated Abd al-Jabbar the Mu'tazili before Timur himself and won the sulh that Timur then reneged on; the grief killed him within the year {cite:shadharat-dhahab p. 30-31}."
