id: person/al-hadi-yahya-al-rassi
education:
  did_you_know:
    ar: "يحيى بن الحسين الرسي الملقب بالهادي أول من دعا لنفسه بصعدة فبويع بها إماماً للزيدية، وكان مجتهداً في الأحكام وله في الفقه رأي."
    en: "Yahya ibn al-Husayn al-Rassi, called al-Hadi, was the first to raise his own call at Sa'da and was pledged there as the Zaydis' imam — a mujtahid in the rulings with his own fiqh opinion."
    ur: "یحییٰ بن حسین رسّی، ہادی کے لقب سے، صعدہ میں پہلے شخص تھے جنھوں نے اپنی دعوت کی اور وہاں زیدیوں کے امام قرار پائے — وہ اجتہاد رکھتے تھے اور فقہ میں ان کا اپنا رائے تھا۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/encyclopaedia-of-islam-2]
class: person
label:
  ar: يحيى الهادي الرسي
  en: Yahya al-Hadi al-Rassi
summary:
  ar: "يحيى بن الحسين بن القاسم الرسي العلوي، الملقب بالهادي؛ أول من دعا لنفسه بصعدة من بني الرسي فبويع بها إماماً للزيدية، وكان مجتهداً في الأحكام الشرعية وله في الفقه رأي، قال ابن حزم لما ذكر ولد أبي القاسم الرسي: منهم القائمون بصعدة من أرض اليمن أولهم يحيى الهادي له رأي في الفقه وقد رأيته ولم يبعد فيه عن الجماعة كل البعد، وولي بعده ابنه محمد المرتضى ثم أخوه الناصر أحمد فاطرد ملكهم في بنيه."
  en: "Yahya ibn al-Husayn ibn al-Qasim al-Rassi, laqab al-Hadi; the first of Banu al-Rassi to summon Sa'da to himself and be sworn there as imam of the Zaydiyya — a mujtahid in the legal rulings with a fiqh of his own, Ibn Hazm recording of him 'he has an opinion in fiqh which I have seen, and it is not far removed from the community's way'; his son Muhammad al-Murtada then his brother al-Nasir Ahmad carried the line after him."
