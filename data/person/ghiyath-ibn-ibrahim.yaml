id: person/ghiyath-ibn-ibrahim
class: person
label: { ar: "غياث بن إبراهيم" }
summary:
  ar: "ممن حدث المهدي، زاد في حديث أبي هريرة لا سبق إلا في حافر أو نصل كلمة أو جناح طمعاً في الجائزة فأمر له بعشرة آلاف درهم ثم قال له أشهد أن قفاك قفا كذاب وأمر بذبح الحمام {cite:tarikh-khulafa-minhaj-1434 p. 445}."
  en: "A hadith-transmitter to al-Mahdi who grafted 'or wing' onto Abu Hurayra's 'no wager save on hoof or arrowhead' to win the prize; granted ten thousand dirhams, then exposed — 'the back of your head is a liar's' — and the pigeons slaughtered {cite:tarikh-khulafa-minhaj-1434 p. 445}."
  es: "Un transmisor de hadices a al-Mahdi que injertó 'o ala' en el 'ninguna apuesta salvo en pezuña o punta de flecha' de Abu Hurayra para ganar el premio; se le concedieron diez mil dirhams, luego fue expuesto — 'la parte posterior de tu cabeza es la de un mentiroso' — y las palomas fueron sacrificadas {cite:tarikh-khulafa-minhaj-1434 p. 445}."
  fr: "Un transmetteur de hadiths à al-Mahdi qui a greffé « ou une aile » sur le « pas de pari sauf sur le sabot ou la pointe de flèche » d'Abu Hurayra pour gagner le prix; a reçu dix mille dirhams, puis a été exposé — « l'arrière de ta tête est celle d'un menteur » — et les pigeons ont été abattus {cite:tarikh-khulafa-minhaj-1434 p. 445}."
