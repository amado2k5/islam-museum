  en: "A hadith-transmitter to al-Mahdi who grafted 'or wing' onto Abu Hurayra's 'no wager save on hoof or arrowhead' to win the prize; granted ten thousand dirhams, then exposed — 'the back of your head is a liar's' — and the pigeons slaughtered {cite:tarikh-khulafa-minhaj-1434 p. 445}."
