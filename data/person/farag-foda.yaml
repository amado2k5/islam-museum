summary:
  ar: "كاتب ومفكر مصري ⁦(1945–1992)⁩ عُرف بمناصرته للعلمانية ونقده العلني لتيارات الإسلام السياسي. من كتبه «الحقيقة الغائبة» و«قبل السقوط» و«حوار حول العلمانية». اغتيل في القاهرة سنة 1992 على يد متطرفين، فصار اغتياله علامة فارقة في النقاش العام المصري حول حرية الفكر."
  en: "Egyptian writer and thinker (1945–1992) known for his advocacy of secularism and public criticism of political-Islam currents. His books include The Absent Truth, Before the Fall and Dialogue on Secularism. He was assassinated in Cairo in 1992 by extremists, and his killing became a landmark in Egypt's public debate on freedom of thought."
  ur: "مصری مصنف اور مفکر ⁦(1945–1992)⁩ جو سیکولرازم کی حمایت اور سیاسی اسلام کے رجحانات پر علانیہ تنقید کے لیے جانے جاتے ہیں۔ ان کی کتابوں میں «الحقیقۃ الغائبہ»، «قبل السقوط» اور «حوار حول العلمانیہ» شامل ہیں۔ 1992 میں قاہرہ میں شدت پسندوں نے انہیں قتل کیا، اور یہ واقعہ آزادیِ فکر پر مصری عوامی مباحث کی ایک سنگِ میل بنا۔"
  es: "Escritor y pensador egipcio (1945-1992), conocido por su defensa del laicismo y su crítica pública de las corrientes político-islámicas. Entre sus libros destacan La verdad ausente, Antes de la caída y Diálogo sobre el laicismo. Fue asesinado en El Cairo en 1992 por extremistas, y su muerte se convirtió en un hito en el debate público egipcio sobre la libertad de pensamiento."
  fr: "Écrivain et penseur égyptien (1945-1992), connu pour sa défense de la laïcité et ses critiques publiques des courants islamistes. Parmi ses ouvrages figurent « La Vérité absente », « Avant la chute » et « Dialogue sur la laïcité ». Il fut assassiné au Caire en 1992 par des extrémistes, et son assassinat marqua un tournant dans le débat public égyptien sur la liberté de pensée."
