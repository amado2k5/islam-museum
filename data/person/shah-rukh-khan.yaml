summary:
  ar: "ممثل ومنتج هندي، وُلد في نيودلهي سنة 1965؛ من أشهر نجوم السينما الهندية في العالم، إذ هيمن على شاشتها منذ التسعينيات بأدوار الشرير ثم البطل الرومانسي، وحملته أفلام مثل «دلوالي دولهانيا لي جايينغي» (1995) و«اسمي خان» (2010) إلى جمهور عالمي، ثم عاد سنة 2023 بفيلمي «باتهان» و«جوان» إلى قمة شباك التذاكر، ونال عن «جوان» جائزة الفيلم الوطني لأفضل ممثل. يُعرف بـ«الملك خان»."
  en: "Indian actor and producer, born in New Delhi in 1965 and known as 'King Khan'. He is among the most famous Indian film stars in the world: from the 1990s he dominated the Indian screen first as a villain and then as the defining romantic hero, films such as Dilwale Dulhania Le Jayenge (1995) and My Name Is Khan (2010) carried him to a global audience, and in 2023 Pathaan and Jawan returned him to the top of the box office, Jawan winning him the National Film Award for Best Actor."
  ur: "ہندوستانی اداکار و فلم ساز، 1965 میں نئی دہلی میں پیدا ہوئے؛ دنیا کے مشہور ترین ہندوستانی فلمی ستاروں میں سے ایک، جنہوں نے نوے کی دہائی سے پہلے منفی کرداروں اور پھر رومانوی ہیرو کے طور پر پردے پر چھا جانے والی شہرت پائی، اور 2023 میں «پٹھان» اور «جوان» سے باکس آفس کی چوٹی پر لوٹے۔ «کنگ خان» کے لقب سے مشہور ہیں۔"
