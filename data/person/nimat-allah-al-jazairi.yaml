summary:
  ar: "نعمة الله بن عبد الله الحسيني الجزائري، أديب مدرس من فقهاء الإمامية، نسبته إلى جزائر البصرة وقرأ بشيراز وأصفهان، توفي بقرية جايدر، من كتبه زهر الربيع والأنوار النعمانية ومقصود الأنام؛ 1050 إلى 1112 هـ."
  en: "Ni'mat Allah ibn Abd Allah al-Husayni al-Jaza'iri, a man of letters and teacher among the Imami (Twelver Shi'i) jurists, from the Jaza'ir of Basra, who studied in Shiraz and Isfahan and died in the village of Jayidar; author of Zahr al-Rabi, al-Anwar al-Numaniyya and Maqsud al-Anam; 1050 to 1112 AH (1640 to 1701)."
  es: "Ni'mat Allah ibn Abd Allah al-Husayni al-Jaza'iri, un hombre de letras y maestro entre los juristas imamíes (chiíes duodecimanos), del Jaza'ir de Basora, que estudió en Shiraz e Isfahán y murió en la aldea de Jayidar; autor de Zahr al-Rabi, al-Anwar al-Numaniyya y Maqsud al-Anam; 1050 a 1112 AH (1640 a 1701)."
  fr: "Ni'mat Allah ibn Abd Allah al-Husayni al-Jaza'iri, homme de lettres et enseignant parmi les juristes Imami (Douze-Chiites), de la famille Jaza'ir de Bassora, qui étudia à Shiraz et Ispahan et mourut dans le village de Jayidar; auteur de Zahr al-Rabi, al-Anwar al-Numaniyya et Maqsud al-Anam; 1050 à 1112 AH (1640 à 1701)."
  ur: "نعمت اللہ ابن عبد اللہ الحسینی الجزائری، امامی ⁦(بارہ شیعہ)⁩ فقہاء میں سے ایک خطاط اور استاد، بصرہ کے جزائر سے، جس نے شیراز اور اصفہان میں تعلیم حاصل کی اور جیدر کے گاؤں میں وفات پائی؛ ظہر الربیع، الانوار النعمانیہ اور مقصود الانعم کے مصنف؛ 1050 تا 1112 ہجری ⁦(1640 تا 1701)⁩۔"
  tr: "Imamiyye hukukçuları arasında edebi bir figür ve öğretmen olan Ni'matullah ibn Abdullah al-Husayni al-Jaza'iri, Basra'daki Cezayirlilere atfedilen bir edebiyatçı ve öğretmen olarak Şiraz ve İsfahan'da eğitim görmüştür. Hayatını Jaydar köyünde vefat etmiştir. Kitapları arasında Zahr al-Rabi', al-Anwar al-Numaniyah ve Maqsud al-Anam; 1050'den 1112 Hicri'ye kadar yer almaktadır."
  id: "Ni'matullah ibn Abdullah al-Husayni al-Jaza'iri, seorang tokoh sastra dan guru di antara para ahli hukum Imamiyya yang dikaitkan dengan orang Aljazair di Basra, belajar di Shiraz dan Isfahan. Ia meninggal di desa Jaydar. Di antara bukunya adalah Zahr al-Rabi', al-Anwar al-Numaniyah, dan Maqsud al-Anam; 1050 hingga 1112 H."
