summary:
  ar: "نعمة الله بن عبد الله الحسيني الجزائري، أديب مدرس من فقهاء الإمامية، نسبته إلى جزائر البصرة وقرأ بشيراز وأصفهان، توفي بقرية جايدر، من كتبه زهر الربيع والأنوار النعمانية ومقصود الأنام؛ 1050 إلى 1112 هـ."
  en: "Ni'mat Allah ibn Abd Allah al-Husayni al-Jaza'iri, a man of letters and teacher among the Imami (Twelver Shi'i) jurists, from the Jaza'ir of Basra, who studied in Shiraz and Isfahan and died in the village of Jayidar; author of Zahr al-Rabi, al-Anwar al-Numaniyya and Maqsud al-Anam; 1050 to 1112 AH (1640 to 1701)."
