summary:
  ar: "محمد بن علي بن جعفر، أبو عبد الله البلالي العجلوني ثم القاهري الشافعي، شمس الدين، محدث فقيه، لازم أبا بكر الموصلي ولازم النظر في الإحياء، واختصره، وصنف السول في شيء من أحاديث الرسول، ومختصر الروضة ومختصر الشفاء. ⁦(٨٢٠-٧٥٠ه)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  en: "Muhammad ibn Ali ibn Ja'far, Abu Abd Allah al-Balali al-Ajluni then al-Qahiri al-Shafi'i, Shams al-Din, a hadith scholar and jurist. He studied with Abu Bakr al-Mawsili, read Ihya' Ulum al-Din closely and abridged it, and wrote al-Sawl fi shay' min ahadith al-Rasul and abridgements of al-Rawda and al-Shifa'. Dates 750 to 820 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  fr: "Muhammad ibn Ali ibn Ja'far, Abu Abd Allah al-Balali al-Ajluni puis al-Qahiri al-Shafi'i, Shams al-Din, traditionniste et juriste. Il étudia auprès d'Abu Bakr al-Mawsili, lut attentivement l'Ihya' Ulum al-Din et l'abrégea, et écrivit al-Sawl fi shay' min ahadith al-Rasul ainsi que des abrégés d'al-Rawda et d'al-Shifa'. Dates : 750 à 820 H selon l'imprimé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  es: "Muhammad ibn Ali ibn Ja'far, Abu Abd Allah al-Balali al-Ajluni y luego al-Qahiri al-Shafi'i, Shams al-Din, jurista y erudito en hadices. Estudió con Abu Bakr al-Mawsili, leyó atentamente Ihya' Ulum al-Din y lo resumió, y escribió al-Sawl fi shay' min hadith al-Rasul y compendio de al-Rawda y al-Shifa'. Fechas 750 a 820 H impresas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  ur: "محمد بن علی ابن جعفر، ابو عبد اللہ البلالی العجلونی پھر القاہری الشافعی، شمس الدین، ایک محدث اور فقیہ۔ اس نے ابوبکر الموسیلی سے تعلیم حاصل کی، احیاء علم الدین کو قریب سے پڑھا اور اس کا اختصار کیا، اور السوال فی شیء من احادیث الرسول اور الرودہ اور الشفاء کا اختصار لکھا۔ تاریخیں 750 تا 820 H جیسا کہ مطبوعہ ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص13346}"
