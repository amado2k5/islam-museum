summary:
  ar: "محمد بن علي بن جعفر، أبو عبد الله البلالي العجلوني ثم القاهري الشافعي، شمس الدين، محدث فقيه، لازم أبا بكر الموصلي ولازم النظر في الإحياء، واختصره، وصنف السول في شيء من أحاديث الرسول، ومختصر الروضة ومختصر الشفاء. (٨٢٠-٧٥٠ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
  en: "Muhammad ibn Ali ibn Ja'far, Abu Abd Allah al-Balali al-Ajluni then al-Qahiri al-Shafi'i, Shams al-Din, a hadith scholar and jurist. He studied with Abu Bakr al-Mawsili, read Ihya' Ulum al-Din closely and abridged it, and wrote al-Sawl fi shay' min ahadith al-Rasul and abridgements of al-Rawda and al-Shifa'. Dates 750 to 820 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13346}"
