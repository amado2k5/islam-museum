summary:
  ar: "محمد العبار (وُلد في 8 تشرين الثاني 1956) رجل أعمال إماراتي من دبي، مؤسس شركة إعمار العقارية مطوّرة برج خليفة ودبي مول. تخرج في جامعة سياتل وبدأ مسيرته في البنك المركزي الإماراتي، وكان المدير العام المؤسس لدائرة التنمية الاقتصادية في دبي سنة 1992 وصار من كبار المستشارين الاقتصاديين لحاكم دبي. أسس أيضًا إيجل هيلز ومنصة نون للتجارة الإلكترونية ويرأس مجموعة أمريكانا."
  en: "Mohamed Alabbar (born 8 November 1956) is an Emirati businessman from Dubai, founder of Emaar Properties, the developer of the Burj Khalifa and the Dubai Mall. A Seattle University graduate who began at the UAE Central Bank, he was the founding director general of Dubai's Department of Economic Development in 1992 and became a chief economic adviser to the Ruler of Dubai. He also founded Eagle Hills and the e-commerce platform Noon.com and chairs the Americana Group."
  ur: "محمد العبار (پیدائش 8 نومبر 1956) دبئی سے تعلق رکھنے والے اماراتی تاجر ہیں، ایمار پراپرٹیز کے بانی جس نے برج خلیفہ اور دبئی مال تعمیر کیے۔ سیئٹل یونیورسٹی کے فارغ التحصیل، انھوں نے اماراتی مرکزی بینک سے آغاز کیا، 1992 میں دبئی کے محکمہ اقتصادی ترقی کے بانی ڈائریکٹر جنرل بنے اور حاکم دبئی کے ممتاز اقتصادی مشیروں میں شامل ہوئے۔ انھوں نے ایگل ہلز اور ای کامرس پلیٹ فارم نون ڈاٹ کام بھی قائم کیے اور وہ امیریکانا گروپ کے چیئرمین ہیں۔"
