summary:
  ar: "محمد العبار ⁦(وُلد في 8 تشرين الثاني 1956)⁩ رجل أعمال إماراتي من دبي، مؤسس شركة إعمار العقارية مطوّرة برج خليفة ودبي مول. تخرج في جامعة سياتل وبدأ مسيرته في البنك المركزي الإماراتي، وكان المدير العام المؤسس لدائرة التنمية الاقتصادية في دبي سنة 1992 وصار من كبار المستشارين الاقتصاديين لحاكم دبي. أسس أيضًا إيجل هيلز ومنصة نون للتجارة الإلكترونية ويرأس مجموعة أمريكانا."
  en: "Mohamed Alabbar (born 8 November 1956) is an Emirati businessman from Dubai, founder of Emaar Properties, the developer of the Burj Khalifa and the Dubai Mall. A Seattle University graduate who began at the UAE Central Bank, he was the founding director general of Dubai's Department of Economic Development in 1992 and became a chief economic adviser to the Ruler of Dubai. He also founded Eagle Hills and the e-commerce platform Noon.com and chairs the Americana Group."
  ur: "محمد العبار ⁦(پیدائش 8 نومبر 1956)⁩ دبئی سے تعلق رکھنے والے اماراتی تاجر ہیں، ایمار پراپرٹیز کے بانی جس نے برج خلیفہ اور دبئی مال تعمیر کیے۔ سیئٹل یونیورسٹی کے فارغ التحصیل، انھوں نے اماراتی مرکزی بینک سے آغاز کیا، 1992 میں دبئی کے محکمہ اقتصادی ترقی کے بانی ڈائریکٹر جنرل بنے اور حاکم دبئی کے ممتاز اقتصادی مشیروں میں شامل ہوئے۔ انھوں نے ایگل ہلز اور ای کامرس پلیٹ فارم نون ڈاٹ کام بھی قائم کیے اور وہ امیریکانا گروپ کے چیئرمین ہیں۔"
  es: "Mohamed Alabbar (nacido el 8 de noviembre de 1956) es un empresario emiratí originario de Dubái, fundador de Emaar Properties, la promotora del Burj Khalifa y el Dubai Mall. Graduado de la Universidad de Seattle, comenzó su carrera en el Banco Central de los Emiratos Árabes Unidos. Fue director general fundador del Departamento de Desarrollo Económico de Dubái en 1992 y posteriormente se convirtió en asesor económico principal del gobernante de Dubái. También fundó Eagle Hills y la plataforma de comercio electrónico Noon.com, y preside el Grupo Americana."
  fr: "Mohamed Alabbar (né le 8 novembre 1956) est un homme d'affaires émirati originaire de Dubaï, fondateur d'Emaar Properties, promoteur du Burj Khalifa et du Dubai Mall. Diplômé de l'Université de Seattle, il a débuté sa carrière à la Banque centrale des Émirats arabes unis. En 1992, il a été le premier directeur général du Département du développement économique de Dubaï et est devenu conseiller économique principal du souverain de Dubaï. Il a également fondé Eagle Hills et la plateforme de commerce électronique Noon.com, et préside le groupe Americana."
  tr: "Mohammed Alabbar (d. 8 Kasım 1956), Dubai'den bir Emirlik iş insanı, Emaar Properties'in kurucusu, Burj Khalifa ve Dubai Mall'un geliştiricisidir. Seattle Üniversitesi'nden mezun olmuş ve kariyerine BAE Merkez Bankası'nda başlamıştır. 1992'de Dubai Ekonomik Kalkınma Departmanı'nın kurucu Genel Müdürü olmuş ve Dubai Hükümdarı'nın kıdemli ekonomik danışmanlarından biri olmuştur. Ayrıca Eagle Hills ve Noon e-ticaret platformunu kurdu ve Americana Group'un başkanlığını yürütmektedir."
  id: "Mohammed Alabbar (lahir 8 November 1956) adalah seorang pengusaha Emirat dari Dubai, pendiri Emaar Properties, pengembang Burj Khalifa dan Dubai Mall. Ia lulus dari Universitas Seattle dan memulai kariernya di Bank Sentral UEA. Ia adalah Direktur Jenderal pendiri Departemen Pengembangan Ekonomi Dubai pada tahun 1992 dan menjadi salah satu penasihat ekonomi senior bagi Penguasa Dubai. Ia juga mendirikan Eagle Hills dan platform e-commerce Noon, serta memimpin Americana Group."
