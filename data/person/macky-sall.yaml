summary:
  ar: "سياسي سنغالي (وُلد 1961) من فاتيك، رئيس بلدية فاتيك ورئيس وزراء السنغال (2004–2007) ورئيس جمعيتها الوطنية (2007–2008) في عهد عبد الله واد، انشق عنه وأسس حزب التحالف من أجل الجمهورية، فصار رئيس السنغال الرابع (2012–2024) بعد هزيمته واد، وأُعيد انتخابه سنة 2019، واستبعد ولاية ثالثة سنة 2023 وغادر المنصب في أبريل 2024."
  en: "Senegalese politician (born 1961) from Fatick; mayor of Fatick, prime minister of Senegal (2004–2007) and president of its National Assembly (2007–2008) under Abdoulaye Wade, he broke with Wade and founded the Alliance for the Republic, then became Senegal's fourth president (2012–2024) by defeating Wade in 2012, was re-elected in 2019, ruled out a third term in 2023 and left office in April 2024."
  ur: "سینیگال کے سیاست دان (پیدائش 1961ء) جن کا تعلق فاتک سے ہے؛ فاتک کے میئر، سینیگال کے وزیر اعظم (2004ء–2007ء) اور عبداللہ واد کے دور میں قومی اسمبلی کے صدر (2007ء–2008ء) رہے، واد سے الگ ہو کر جمہوریت کے لیے اتحاد نامی جماعت بنائی، پھر 2012ء میں واد کو شکست دے کر سینیگال کے چوتھے صدر (2012ء–2024ء) بنے، 2019ء میں دوبارہ منتخب ہوئے، 2023ء میں تیسری مدت سے انکار کیا اور اپریل 2024ء میں عہدہ چھوڑا۔"
