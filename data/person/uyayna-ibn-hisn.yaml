summary:
  en: "A powerful, mercurial chieftain of Banu Fazara in Najd (dubbed 'the foolish chief obeyed by ten thousand swords'); he witnessed the conquest of Mecca, Hunayn and al-Ta'if with the Prophet, was granted one hundred camels at al-Ji'rana among al-Mu'allafa Qulubuhum, came with the Banu Tamim delegation in 9 AH, and later faltered during the Ridda wars before repenting and returning to Islam."
  ar: "سيد بني فزارة وغطفان في نجد؛ قاد الأحزاب يوم الخندق، وشهد مع النبي فتح مكة وحنيناً والطائف، وأعطاه النبي مئة بعير بالجعرانة تأليفاً لقلبه، وقدم مع وفد بني تميم سنة 9هـ؛ ارتد مع طليحة ثم أسر وتاب وحسن إسلامه في خلافة أبي بكر وعمر. وعدّه عمرو بن معد يكرب عند عمر في حرّي العرب الذين يخشى لقاءهم وسماه المسعودي عيينة بن الحارث بن شهاب التميمي {cite:muruj-al-dhahab p. 621}"
  ur: "نجد کے بنو فزارہ کے سردار؛ فتح مکہ، حنین اور طائف میں شریک ہوئے اور جعرانہ میں غنائم پانے والوں میں تھے۔ {cite:ibn-hisham-saqqa}"
