label:
  ar: يحيى بن البطريق
  en: Yahya ibn al-Bitriq
  es: "Yahya ibn al-Bitriq"
  fr: "Yahya ibn al-Bitriq"
  ur: "یحییٰ بن البترق"
summary:
  ar: "يحيى بن البطريق، من بعثة المأمون إلى ملك الروم في طلب العلوم القديمة المخزونة ببلد الروم مع الحجاج بن مطر وسلم صاحب بيت الحكمة، وكان ممن نقل كتب اليونان إلى العربية."
  en: "Yahya ibn al-Bitriq, of al-Ma'mun's embassy to the Byzantine emperor for the stored ancient sciences — with al-Hajjaj ibn Matar and Salm master of the House of Wisdom — one of the translators who carried Greek books into Arabic."
  es: "Yahya ibn al-Bitriq, de la embajada de al-Ma'mun ante el emperador bizantino para la custodia de las ciencias antiguas almacenadas, junto con al-Hajjaj ibn Matar y Salm, maestro de la Casa de la Sabiduría, fue uno de los traductores que llevaron libros griegos al árabe."
  fr: "Yahya ibn al-Bitriq, de l'ambassade d'al-Ma'mun auprès de l'empereur byzantin pour les sciences anciennes conservées — avec al-Hajjaj ibn Matar et Salm, maître de la Maison de la Sagesse — l'un des traducteurs qui ont traduit des livres grecs en arabe."
  ur: "یحییٰ بن البترق، بازنطینی شہنشاہ کے پاس المامون کے سفارت خانے سے ذخیرہ شدہ قدیم علوم کے لیے - الحجاج ابن مطر اور ہاؤس آف وزڈم کے سالم ماسٹر کے ساتھ - یونانی کتابوں کو عربی میں لے جانے والے مترجموں میں سے ایک۔"
