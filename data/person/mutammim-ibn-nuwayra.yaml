summary:
  ar: "شاعر من بني حنظلة بن مالك من تميم، أخو مالك بن نويرة؛ دخل على عمر بن الخطاب بعد قتل أخيه فسأله عن وجده فأجاب «بكيته حولاً حتى أسعدت عيني الذاهبة عيني الصحيحة» ثم وصفه له وصف الكرم، وأنشده مرثيته التي مطلعها «وكنا كندماني جذيمة حقبة من الدهر حتى قيل لن يتصدعا»، ولما قال عمر «لو كنت أحسن قول الشعر لرثيت أخي زيداً» أجاب «ولا سواء يا أمير المؤمنين، لو كان أخي صُرع مصرع أخيك ما بكيته» فقال عمر «ما عزاني أحد بأحسن مما عزيتني»."
  en: "A poet of Banu Hanzala ibn Malik of Tamim, brother of Malik ibn Nuwayra; he came to Umar ibn al-Khattab after his brother's killing and when asked of his grief answered 'I wept for him a year until my failing eye aided my sound one', then described his generosity, and recited his elegy beginning 'we were like Jadhima's two drinking-companions for an age until it was said they would never be split'; when Umar said 'had I been good at verse I would have elegized my brother Zayd', he answered 'not equal, commander of the faithful — had my brother fallen where yours fell I would not have wept him', and Umar said 'no one has consoled me better than you consoled me'."
  es: "Un poeta de Banu Hanzala ibn Malik de Tamim, hermano de Malik ibn Nuwayra; fue a ver a Umar ibn al-Khattab después del asesinato de su hermano y cuando se le preguntó por su dolor respondió: \"Lloré por él durante un año hasta que mi ojo debilitado ayudó al sano\", luego describió su generosidad y recitó su elegía que comenzaba con \"Fuimos como los dos compañeros de bebida de Jadhima durante una era hasta que se dijo que nunca se separarían\"; cuando Umar dijo: \"Si hubiera sido bueno en poesía, habría escrito una elegía para mi hermano Zayd\", respondió: \"No soy igual, comandante de los creyentes; si mi hermano hubiera caído donde cayó el tuyo, no lo habría llorado\", y Umar dijo: \"Nadie me ha consolado mejor que tú\"."
  fr: "Poète de la tribu Banu Hanzala ibn Malik de Tamim, frère de Malik ibn Nuwayra, il vint trouver Umar ibn al-Khattab après la mort de son frère et, interrogé sur son chagrin, répondit: « J'ai pleuré pour lui pendant un an, jusqu'à ce que mon œil défaillant vienne en aide à mon œil valide », puis décrivit sa générosité et récita son élégie commençant par: « Nous étions comme les deux compagnons de beuverie de Jadhima pendant une éternité, jusqu'à ce qu'on dise qu'ils ne seraient jamais séparés »; quand Umar dit: « Si j'étais doué pour la poésie, j'aurais fait l'élégie de mon frère Zayd », il répondit: « Je n'en suis pas capable, Commandeur des croyants — si mon frère était tombé là où est tombé le vôtre, je ne l'aurais pas pleuré », et Umar dit: « Personne ne m'a mieux consolé que vous ne l'avez fait »."
  ur: "بنو حنظلہ بن مالک تمیم کے ایک شاعر، مالک بن نویرہ کے بھائی؛ وہ اپنے بھائی کے قتل کے بعد عمر بن الخطاب کے پاس آئے اور جب ان کے غم کے بارے میں پوچھا تو جواب دیا کہ 'میں اس کے لیے ایک سال تک روتا رہا یہاں تک کہ میری کمزور آنکھ نے میری آواز کو سہارا دے دیا'، پھر اپنی سخاوت بیان کی، اور اس کی خوبصورتی کا آغاز کرتے ہوئے کہا کہ 'ہم جدھما کے دو شراب نوشی کے ساتھیوں کی طرح تھے جب تک یہ کہا نہ جائے کہ وہ کبھی جدا نہیں ہوں گے'۔ جب عمر نے کہا کہ اگر میں آیت میں اچھا ہوتا تو میں اپنے بھائی زید کو مبعوث کرتا، تو انہوں نے جواب دیا: \"برابر نہیں، امیر المؤمنین، اگر میرا بھائی جہاں آپ کا گرا تھا، میں اسے نہ روتا\"، اور عمر نے کہا، \"تم نے مجھے تسلی دی اس سے بہتر مجھے کسی نے تسلی نہیں دی\"۔"
