summary:
  ar: "شاعر من بني حنظلة بن مالك من تميم، أخو مالك بن نويرة؛ دخل على عمر بن الخطاب بعد قتل أخيه فسأله عن وجده فأجاب «بكيته حولاً حتى أسعدت عيني الذاهبة عيني الصحيحة» ثم وصفه له وصف الكرم، وأنشده مرثيته التي مطلعها «وكنا كندماني جذيمة حقبة من الدهر حتى قيل لن يتصدعا»، ولما قال عمر «لو كنت أحسن قول الشعر لرثيت أخي زيداً» أجاب «ولا سواء يا أمير المؤمنين، لو كان أخي صُرع مصرع أخيك ما بكيته» فقال عمر «ما عزاني أحد بأحسن مما عزيتني»."
  en: "A poet of Banu Hanzala ibn Malik of Tamim, brother of Malik ibn Nuwayra; he came to Umar ibn al-Khattab after his brother's killing and when asked of his grief answered 'I wept for him a year until my failing eye aided my sound one', then described his generosity, and recited his elegy beginning 'we were like Jadhima's two drinking-companions for an age until it was said they would never be split'; when Umar said 'had I been good at verse I would have elegized my brother Zayd', he answered 'not equal, commander of the faithful — had my brother fallen where yours fell I would not have wept him', and Umar said 'no one has consoled me better than you consoled me'."
