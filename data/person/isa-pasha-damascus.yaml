summary:
  ar: "المولى عيسى باشا بن إبراهيم الرومي الحنفي أمير أمراء دمشق؛ كان له أولاً اشتغال بالعلم وصار مدرساً بعدة مدارس حتى اتصل إلى إحدى الثمان، ثم صار موقعاً بالديوان السلطاني ثم ولي الإمارة في بعض البلاد ثم إمارة حلب فأحسن فيها السيرة ثم إمارة دمشق وعُزل منها ثم أعيد إليها ورسخ فيها؛ وكان عالماً بعدة من العلوم ولم يترك المطالعة أيام الإمارة، وكان له حسن أدب ولطف معاشرة إلا أنه كان إذا اشتد غضبه خمش يديه فيدميها وهو لا يدري، وأبطل كثيراً من الظلامات وعاش أهل القرى أيام ولايته عيشة طيبة، وكان مكرماً لأهل العلم ومشايخ الصوفية ولبس الخرقة القادرية من الشيخ حسن الكيلاني لما قدم دمشق يوم الأحد تاسع صفر، وأوصى أن يُلقن فلقّنه الشيخ أبو الفتح المالكي، وأوصى أن يُسحب على الأرض قبل الدفن إلى قبره تعريراً لنفسه، فحمل سريره إلى الصالحية فلما قرب من قبره سُحب على الأرض قليلاً تنفيذاً لوصيته، ودُفن في حوش الشيخ محيي الدين العربي عند شباكه الشرقي بوصية منه {cite:shadharat-dhahab p. 698-699}."
  en: "The scholar-amir of Damascus — a madrasa man first (to the Eight Colleges), then muwaqqi' of the imperial diwan, then amir of Aleppo 'where his conduct was praised', then of Damascus, reseated after dismissal; he never left reading in office, abolished many wrongs and 'the villagers lived well in his days', took the Qadiri khirqa from Hasan al-Kilani; by his will he was dragged a little on the ground before burial 'in self-abasement' and buried in Ibn 'Arabi's hawsh at its eastern window {cite:shadharat-dhahab p. 698-699}."
  es: "El erudito-emir de Damasco —primero un hombre de madrasa (de los Ocho Colegios), luego muwaqqi' del diwan imperial, luego emir de Alepo 'donde su conducta fue elogiada', luego de Damasco, restituido en su puesto tras su destitución; nunca dejó de leer en el cargo, abolió muchas injusticias y 'los aldeanos vivieron bien en sus días', tomó el khirqa Qadiri de Hasan al-Kilani; por su voluntad fue arrastrado un poco por el suelo antes del entierro 'en un acto de humildad' y enterrado en el hawsh de Ibn 'Arabi en su ventana oriental {cite:shadharat-dhahab p. 698-699}."
  fr: "L'émir érudit de Damas — d'abord homme de madrasa (aux Huit Collèges), puis muwaqqi' du diwan impérial, puis émir d'Alep « où sa conduite fut louée », puis de Damas, réintégré après sa destitution; il ne cessa jamais de lire dans ses fonctions, abolit de nombreux torts et « les villageois vécurent bien de son vivant », prit la khirqa Qadiri à Hasan al-Kilani; selon sa volonté, il fut traîné un peu au sol avant d'être enterré « dans l'humilité » et enterré dans le hawsh d'Ibn 'Arabi à sa fenêtre orientale {cite: shadharat-dhahab p. 698-699}."
  ur: "دمشق کا عالم امیر - پہلے ⁦(آٹھ کالجوں تک)⁩ ایک مدرسے کا آدمی، پھر شاہی دیوان کا متقی، پھر حلب کا امیر 'جہاں اس کے طرز عمل کی تعریف کی جاتی تھی'، پھر دمشق کا، برطرفی کے بعد دوبارہ بحال ہوا۔ اس نے دفتر میں پڑھنا کبھی نہیں چھوڑا، بہت سی غلطیاں ختم کیں اور 'ان کے زمانے میں گاؤں والے اچھے رہتے تھے'، حسن الکلانی سے قادری خرقہ لیا۔ اس کی وصیت سے اسے 'خود کشی' میں دفن کرنے سے پہلے زمین پر تھوڑا سا گھسیٹ لیا گیا اور اس کی مشرقی کھڑکی پر ابن عربی کے حوض میں دفن کیا گیا۔ 698-699}۔"
  tr: "Şam Prenslerinin Emiri Mewla İsa Paşa ibn İbrahim el-Rumi el-Hanafi, başlangıçta bilgiyle ilgilendi ve sekiz okuldan birine ulaşana kadar birkaç okulda öğretmenlik yaptı. Sonra Kraliyet Sarayında imza attı, bazı ülkelerde vali olarak görev yaptı, ardından Halep'te başarılı oldu, ardından Şam valiliğini görevden aldı, ardından geri dönüp orada yerleşti. Birçok bilimde bilgiliydi ve yönetimi boyunca okumayı hiç bırakmadı. Sosyal ilişkilerinde iyi terbiyeli ve nezaket gösterdi, ancak sinirlendiğinde ellerini kavuşturardı Farkında olmadan kan döktü, birçok zulmü ortadan kaldırdı ve köylüler onun yönetimi sırasında iyi bir hayat sürdü. Alimler ve Sufi şeyhler tarafından onurlandırıldı ve Şem Hasan el-Kilani'nin Pazar günü, Safar'ın dokuzuncusu Şam'a vardığında Kadiriye pelerinini giydi. Kendisine öğretilmesini emretti, Şeyh Ebu el-Feth el-Maliki ona öğretti; gömülmeden önce kendini açığa çıkarmak için yerde sürüklenmesini tavsiye etti. Tabutunu el-Salihiye'ye taşıdı ve mezarına yaklaştığında, vasiyetini yerine getirmek için biraz yere sürükledi ve Şeyh Muhyiddin el-Arabi'nin avlusuna defnedildi. Doğu penceresinde, kendisinin vasiyetiyle {atıf:shadharat-dhahab, s. 698-699}."
  id: "Mawla Isa Pasha ibn Ibrahim al-Rumi al-Hanafi, Emir Pangeran Damaskus, awalnya terlibat dalam ilmu pengetahuan dan menjadi guru di beberapa sekolah hingga mencapai salah satu dari delapan sekolah. Kemudian ia menjadi penandatangan di Istana Kerajaan, kemudian menjabat sebagai gubernur di beberapa negara, kemudian di Aleppo, di mana ia unggul, kemudian menjadi gubernur Damaskus, diberhentikan, kemudian kembali dan didirikan di sana. Ia memiliki pengetahuan dalam berbagai ilmu pengetahuan dan tidak pernah berhenti membaca selama masa pemerintahannya. Ia memiliki sopan santun dan kebaikan dalam hubungan sosialnya, tetapi ketika marah, ia akan menyilangkan tangan Tanpa sadar, ia menumpahkan darah, dan ia menimbang banyak penindasan, dan penduduk desa menjalani kehidupan yang baik selama pemerintahannya. Ia dihormati oleh para ulama dan para syekh Sufi, dan mengenakan jubah Qadiriya dari Sheikh Hassan al-Kilani saat tiba di Damaskus pada hari Minggu, tanggal sembilan Safar. Ia memerintahkan agar ia diajar, dan Sheikh Abu al-Fath al-Maliki mengajarinya, yang merekomendasikan agar ia diseret ke tanah sebelum dimakamkan ke makamnya untuk memperlihatkan diri. Ia membawa peti matinya ke al-Salihiyah, dan ketika mendekati makamnya, ia menyeret sedikit di tanah sebagai pelaksanaan kehendaknya, dan ia dimakamkan di halaman Sheikh Muhyiddin al-Arabi. Di jendela timurnya, melalui wasiat darinya {cite:shadharat-dhahab, hlm. 698-699}."
