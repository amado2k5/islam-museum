summary:
  ar: أخو عثمان بن عفان لأمه، أسلم يوم الفتح؛ يذكر ابن عبد البر أن أهل التأويل لا يختلفون في نزول آية الحجرات 6 فيه حين بعثه النبي مصدّقاً إلى بني المصطلق، ويبين ابن حجر ضعف أسانيد القصة؛ ولاه عثمان الكوفة سنة 25هـ ثم عزله بعد جلده في شرب الخمر، وفي رواية المسعودي كان يشرب مع ندمائه إلى الصباح فلما آذن المؤذنون بالصلاة صلى بالناس الصبح أربعاً وقال أتريدون أن أزيدكم وقيل قال في سجوده اشرب واسقني، وشهدوا عليه عند عثمان فدفع الشهود فقال له علي دفعت الشهود وأبطلت الحدود، فلما أقيمت الشهادة ألقى عثمان السوط إلى علي فامتنع الناس توقياً لغضب عثمان فأخذه علي وضرب به الأرض وعلاه بالسوط وقد سبه الوليد يا صاحب مكس وقال عقيل إنك لتتكلم يا ابن أبي معيط كأنك لا تدري من أنت وأنت علج من أهل صفورية، وفي ذلك قالت الحطيئة أبياته {cite:muruj-al-dhahab p. 630-631}
    وفق ما يرويه الصحيحان، واعتزل الفتنة وأقام بالرقة إلى أن مات في خلافة معاوية.
  en: A maternal half-brother of Uthman ibn Affan, he embraced Islam on the day of the conquest; Ibn Abd al-Barr says the commentators do not disagree that verse 6 of al-Hujurat was revealed about him when the Prophet sent him to collect alms
    from Banu al-Mustaliq, and Ibn Hajar points to the weakness of the chains of that story; Uthman made him governor of Kufa in 25 AH and removed him after he was flogged for drinking wine, as the two collections report; he withdrew from the
    civil strife and stayed at al-Raqqa until he died in Mu'awiya's caliphate.
  fr: "Un demi-frère maternel d'Uthman ibn Affan, il a embrassé l'Islam le jour de la conquête ; Ibn Abd al-Barr dit que les commentateurs ne sont pas en désaccord que le verset 6 d'al-Hujurat a été révélé à son sujet lorsque le Prophète l'a envoyé pour recueillir l'aumône de Banu al-Mustaliq, et Ibn Hajar souligne la faiblesse des chaînes de cette histoire ; Uthman l'a fait gouverneur de Kufa en 25 de l’hégire et l'a enlevé après qu'il ait été fouetté pour avoir bu du vin, comme le rapportent les deux collections ; Il se retira de la guerre civile et resta à al-Raqqa jusqu'à sa mort dans le califat de Mu'awiya."
  ur: "عثمان بن عفان کے مادری بھائی اور کوفہ کے والی؛ ابن حجر ان کی اسلام میں آمد، حکومتی ذمہ داریوں، معزولی اور بعد میں فتنہ سے الگ رہنے کا ذکر کرتے ہیں۔ {cite:ibn-hajar-isaba}"
  es: "Hermano por parte de madre de Uthman ibn Affan, abrazó el Islam el día de la conquista; Ibn Abd al-Barr afirma que los comentaristas coinciden en que el versículo 6 de al-Hujurat fue revelado acerca de él cuando el Profeta lo envió a recoger limosnas de Banu al-Mustaliq, e Ibn Hajar señala la debilidad de las cadenas de transmisión de esa historia; Uthman lo nombró gobernador de Kufa en el año 25 de la Hégira y lo destituyó después de que fuera azotado por beber vino, según informan las dos colecciones; se retiró de la contienda civil y permaneció en al-Raqqa hasta su muerte durante el califato de Mu'awiya."
  tr: "Osman bin Affan'ın anne tarafından kardeşi olan Osman, fetih gününde İslam'ı kabul etmiştir. İbn Abdülbar, tercümanların Peygamber'in Banu el-Mustaliq'a onaylamak için gönderdiği El-Hujurat6 ayetinin vahyinde tartışmadıklarını belirtir. İbn Hajar, rivayet zincirlerinin zayıflığını açıklar; Osman onu 25 Hicri yılında Kufe'ye atamış ve şarap içtiği için kırbaçlandıktan sonra görevden almıştır. El-Mes'udi'ye göre, sabaha kadar yoldaşlarıyla birlikte içerdi. Müezzinler namaz kılındığında, halkı sabah namazına dört kez götürüp, 'Sizi artırmamı ister misiniz?' der. Secde ederken, 'İç ve bana su ver.' der. Onlar Osman'ın önünde ona karşı tanıklık ettiler, Osman şahitleri savundu. Ali ona, 'Tanıkları görevden aldım, hudud cezalarını iptal ettim.' dedi. Tanıklık kesinleştiğinde, Osman Ali'ye kırbaç fırlattı, ancak halk Osman'ın öfkesinden korkarak kırbaç etmedi. Ali onu aldı, yere vurdu ve kırbaçla kaldırdı. El-Velid ona hakaret etti, ey karışık yoldaş, Akil dedi ki, 'Ey Ebu Mu'ayt'in oğlu, kim olduğunu bilmiyormuş gibi konuşuyorsun, oysa sen Safuriya halkından inatçısın.' El-Hutayyah iki Sahih'e göre ayetlerini {atıf:Muruj-al-Dhahab s. 630-631} okudu. İsyandan çekildi ve Muaviye halifeliği sırasında ölene kadar Rakka'da yaşadı."
  id: "Uthman ibn Affan, saudara dari pihak ibu, ia memeluk Islam pada hari penaklukan. Ibn Abd al-Barr menyebutkan bahwa para penafsir tidak berselisih tentang wahyu ayat Al-Hujurat6 di dalamnya ketika Nabi mengirimnya untuk menegaskannya kepada Banu al-Mustaliq. Ibn Hajar menjelaskan kelemahan rantai riwayat dalam cerita itu; Uthman menunjuknya menjadi Kufa pada tahun 25 H dan kemudian memecatnya setelah dicambuk karena minum anggur. Menurut Al-Mas'udi, ia minum bersama sahabatnya hingga pagi. Ketika para muezzin memanggil shalat, ia memimpin umat dalam shalat pagi sebanyak empat kali dan berkata, 'Apakah kalian ingin aku menambah kalimu?' Dikatakan saat sujud, 'Minumlah dan berikan aku air.' Mereka bersaksi melawannya di hadapan Uthman, yang membela para saksi. Ali berkata kepadanya, 'Aku telah memberhentikan para saksi dan membatalkan hukuman hudud.' Ketika kesaksian itu terbukti, Uthman melemparkan cambuk kepada Ali, tetapi rakyat menolak karena takut akan kemarahan Uthman. Ali menangkapnya, memukul tanah dengan cambuk itu, dan mengangkatnya dengan cambuk. Al-Walid menghina dia, wahai sahabat campuran, dan Aqil berkata, 'Kau berbicara, wahai putra Abu Mu'ayt, seolah-olah kau tidak tahu siapa dirimu, sementara engkau adalah orang keras kepala dari bangsa Safuriya.' Al-Hutayyah membacakan ayat-ayatnya {cite:muruj-al-dhahab hlm. 630-631} menurut kedua Sahih. Ia menarik diri dari hasutan dan tinggal di Raqqa hingga wafat pada masa kekhalifahan Muawiyah."
