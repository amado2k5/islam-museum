summary:
  ar: أخو عثمان بن عفان لأمه، أسلم يوم الفتح؛ يذكر ابن عبد البر أن أهل التأويل لا يختلفون في نزول آية الحجرات 6 فيه حين بعثه النبي مصدّقاً إلى بني المصطلق، ويبين ابن حجر ضعف أسانيد القصة؛ ولاه عثمان الكوفة سنة 25هـ ثم عزله بعد جلده في شرب الخمر، وفي رواية المسعودي كان يشرب مع ندمائه إلى الصباح فلما آذن المؤذنون بالصلاة صلى بالناس الصبح أربعاً وقال أتريدون أن أزيدكم وقيل قال في سجوده اشرب واسقني، وشهدوا عليه عند عثمان فدفع الشهود فقال له علي دفعت الشهود وأبطلت الحدود، فلما أقيمت الشهادة ألقى عثمان السوط إلى علي فامتنع الناس توقياً لغضب عثمان فأخذه علي وضرب به الأرض وعلاه بالسوط وقد سبه الوليد يا صاحب مكس وقال عقيل إنك لتتكلم يا ابن أبي معيط كأنك لا تدري من أنت وأنت علج من أهل صفورية، وفي ذلك قالت الحطيئة أبياته {cite:muruj-al-dhahab p. 630-631}
    وفق ما يرويه الصحيحان، واعتزل الفتنة وأقام بالرقة إلى أن مات في خلافة معاوية.
  en: A maternal half-brother of Uthman ibn Affan, he embraced Islam on the day of the conquest; Ibn Abd al-Barr says the commentators do not disagree that verse 6 of al-Hujurat was revealed about him when the Prophet sent him to collect alms
    from Banu al-Mustaliq, and Ibn Hajar points to the weakness of the chains of that story; Uthman made him governor of Kufa in 25 AH and removed him after he was flogged for drinking wine, as the two collections report; he withdrew from the
    civil strife and stayed at al-Raqqa until he died in Mu'awiya's caliphate.
