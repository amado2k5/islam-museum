education:
  did_you_know:
    ar: "الوليد بن عقبة أخو عثمان بن عفان لأمه، أسلم يوم الفتح وبعثه النبي مصدّقاً إلى بني المصطلق، ولّاه عثمان الكوفة سنة ٢٥هـ."
    en: "Al-Walid ibn Uqba, Uthman's maternal half-brother, embraced Islam at the Conquest; the Prophet sent him to Banu al-Mustaliq as alms-collector, and Uthman appointed him over Kufa in 25 AH."
