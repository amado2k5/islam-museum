summary:
  ar: "أكاديمي وباحث ومؤلف وداعية وجرّاح عام كردي عراقي، وُلد في 1 يوليو 1973 في السليمانية. هو أستاذ في كلية الطب بجامعة السليمانية ومؤسس «سمارت هيلث تاور»، ويمارس الدعوة منذ سنة 1992 بموازاة عمله الطبي. صفحته على فيسبوك هي منصّته الكبرى وبلغت 1,700,000 متابع بحسب بيانات منشوراتها حتى 10 مارس 2026، وبلغت قناته على يوتيوب 113,000 مشترك و5,627,815 مشاهدة و1,318 مقطعًا بحسب vidIQ كما في 8 نوفمبر 2026، وحسابه على إنستغرام 820,000 متابع بحسب منشورات فبراير ومارس 2026."
  en: "Kurdish Iraqi academic, researcher, author, Islamic preacher and general surgeon, born on 1 July 1973 in Sulaymaniyah. He is a professor at the College of Medicine, University of Sulaymaniyah and the founder of Smart Health Tower, and he has preached Islam since 1992 alongside his medical career. His Facebook page is his main platform, at 1,700,000 followers by post metadata to 10 March 2026; his YouTube channel counted 113,000 subscribers, 5,627,815 views and 1,318 videos as read by vidIQ on 8 November 2026, and his Instagram account 820,000 followers by posts of February–March 2026."
  ur: "کرد عراقی عالم، محقق، مصنف، داعی اور جنرل سرجن، جو یکم جولائی 1973ء کو سلیمانیہ میں پیدا ہوئے۔ وہ سلیمانیہ یونیورسٹی کے کالج آف میڈیسن میں پروفیسر اور «سمارٹ ہیلتھ ٹاور» کے بانی ہیں، اور 1992ء سے اپنے طبی کام کے ساتھ ساتھ دعوت کا کام بھی کر رہے ہیں۔ ان کا فیس بک پیج ان کا سب سے بڑا پلیٹ فارم ہے جس کے فالوور 10 مارچ 2026ء تک کی پوسٹ میٹا ڈیٹا کے مطابق 1,700,000 تھے؛ ان کے یوٹیوب چینل کے سبسکرائبر 8 نومبر 2026ء کی vidIQ قرأت کے مطابق 113,000، ویوز 5,627,815 اور ویڈیوز 1,318 تھے، اور انسٹاگرام اکاؤنٹ کے فالوور فروری و مارچ 2026ء کی پوسٹوں کے مطابق 820,000 تھے۔"
