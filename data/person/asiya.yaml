gender: female
summary:
  ar: "آسية بنت مزاحم امرأة فرعون التي ربت موسى. عند البخاري أدرجها النبي في كاملات النساء: «كمل من الرجال كثير ولم يكمل من النساء إلا آسية امرأة فرعون ومريم بنت عمران» {cite:sahih-al-bukhari 3411}، وللحديث نفسه رواية في مسلم عن أبي موسى الأشعري {cite:sahih-muslim 2430}."
  en: "Pharaoh's wife who raised Musa — counted by the Prophet among the perfected women {cite:sahih-al-bukhari 3411}."
  es: "La esposa del faraón que crió a Musa — contada por el Profeta entre las mujeres perfectas {cite:sahih-al-bukhari 3411}."
  fr: "L'épouse du Pharaon qui a élevé Moïse — comptée par le Prophète parmi les femmes parfaites {cite:sahih-al-bukhari 3411}."
  ur: "فرعون کی بیوی جس نے موسیٰ کی پرورش کی جسے نبی نے کامل عورتوں میں شمار کیا۔"
  tr: "Musa'yı dirilten Firavun'un eşi Asiya bint Muzahim. El-Buhari'ye göre, Peygamber onu tam kadınlar arasında saymıştır: \"Birçok erkek mükemmelleşti, ancak kadınlar arasında sadece Firavun'un eşi Asiyah ve Meryem bint İmran vardı\" {atıf:sahih-al-bukhari 3411} ve aynı hadis Müslüman'da Ebu Musa el-Eş'ari'den rivayet edilmiştir {atı:sahih-müslim 2430}."
  id: "Asiya bint Muzahim, istri Firaun yang membangkitkan Musa. Menurut Al-Bukhari, Nabi memasukkannya di antara wanita utuh: \"Banyak pria yang sempurna, tetapi di antara wanita hanya Asiyah, istri Firaun, dan Maria bint Imran\" {cite:sahih-al-bukhari 3411}, dan hadits yang sama diceritakan dalam bahasa Muslim dari Abu Musa al-Ash'ari {cite:sahih-muslim 2430}."
