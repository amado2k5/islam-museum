summary:
  ar: "آسية بنت مزاحم امرأة فرعون التي ربت موسى. عند البخاري أدرجها النبي في كاملات النساء: «كمل من الرجال كثير ولم يكمل من النساء إلا آسية امرأة فرعون ومريم بنت عمران» {cite:sahih-al-bukhari 3411}، وللحديث نفسه رواية في مسلم عن أبي موسى الأشعري {cite:sahih-muslim 2430}."
  en: "Pharaoh's wife who raised Musa — counted by the Prophet among the perfected women {cite:sahih-al-bukhari 3411}."
