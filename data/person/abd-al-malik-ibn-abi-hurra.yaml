  ar: "راوٍ عن أبيه الذي كان أخبر الناس بالسواد؛ عند البلاذري عدّ عن أبيه صوافي عمر العشر وبلوغ خراجها سبعة آلاف ألف درهم وحريق ديوانها في الجماجم."
  en: "Narrator from his father, 'the most knowledgeable man on the Sawad'; in al-Baladhuri he lists from him Umar's ten sawafi heads, their seven-million-dirham yield, and the register's burning in the Jamajim."
  fr: "Transmetteur rapportant de son père, « l'homme le plus savant sur le Sawad » ; chez al-Baladhuri, il énumère d'après lui les dix catégories de sawafi d'Umar, leur rendement de sept millions de dirhams et l'incendie du registre lors d'al-Jamajim."
  es: "El narrador, a partir de las palabras de su padre, \"el hombre más versado en el Sawad\", en al-Baladhuri enumera las diez cabezas sawafi de Umar, su producción de siete millones de dirhams y la quema del registro en los Jamajim."
