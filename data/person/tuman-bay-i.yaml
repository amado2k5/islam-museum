summary:
  ar: "الملك العادل سيف الدين طومان باي من أعيان مماليك قايتباي؛ تغلب في الشام ثم بويع بالسلطنة بعد خلع جان بلاط وجلس على السرير بعد ظهر يوم السبت ثامن عشر جمادى الآخرة سنة ست وتسعمائة، فكانت مدته من حين تغلبه بالشام أربعة أشهر وخمسة عشر يوماً ومن حين بيعته بقلعة الجبل ثلاثة أشهر وثلاثة وعشرون يوماً، وبنى مدرسة العادلية وتربته خارج باب النصر، ثم هجم عليه العسكر وقتلوه {cite:shadharat-dhahab p. 443}."
  en: "A leading mamluk of Qaytbay; seized power in Syria, then was acclaimed sultan after Jan Balat's deposition, mounting the throne on Saturday 18 Jumada II 906 — four months and fifteen days from his Syrian takeover, three months and twenty-three from his Citadel investiture; built the 'Adiliyya madrasa and his turba outside Bab al-Nasr, then the army stormed him and killed him {cite:shadharat-dhahab p. 443}."
