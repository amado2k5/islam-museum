  en: "Abu Abd al-Rahman al-Sulami (the Kufan Qur'an reader)"
  ur: "ابو عبد الرحمن السلمی (کوفی قاری)"
names:
  - { kind: full, lang: ar, value: "عبد الله بن حبيب السلمي" }
  - { kind: full, lang: ar-Latn, value: "Abd Allah ibn Habib al-Sulami" }
gender: male
roles: [teacher, scholar]
summary:
  ar: "عبد الله بن حبيب، أبو عبد الرحمن السلمي، من كبار قرّاء الكوفة: قرأ على عثمان وابن مسعود وعلي، وأخذ عنه عاصم بن بهدلة، وأقرأ أربعين سنة من زمن عثمان إلى زمن الحجاج بحسب أبي إسحاق الحويني؛ وهو غير الصوفي النيسابوري الذي يحمل الكنية نفسها."
  en: "Abd Allah ibn Habib, Abu Abd al-Rahman al-Sulami, one of the great Qur'an readers of Kufa: he read with Uthman, Ibn Mas'ud and Ali, Asim ibn Bahdala took the reading from him, and he taught for forty years, from Uthman's time to al-Hajjaj's, according to Abu Ishaq al-Heweny; not to be confused with the later Sufi of Nishapur who bears the same kunya."
  ur: "عبد اللہ بن حبیب، ابو عبد الرحمن السلمی، کوفہ کے بڑے قاریوں میں سے: انہوں نے عثمان، ابن مسعود اور علی سے پڑھا، عاصم بن بہدلہ نے ان سے قراءت لی، اور ابو اسحاق حوینی کے مطابق وہ عثمان کے زمانے سے حجاج کے زمانے تک چالیس سال پڑھاتے رہے؛ یہ نیشاپور کے بعد کے صوفی سے الگ ہیں جو اسی کنیت کے حامل ہیں۔"
