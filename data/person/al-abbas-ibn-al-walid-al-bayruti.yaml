summary:
  ar: "أبو الفضل العباس بن الوليد البيروتي، مقرئ الشام، صاحب عبد الحميد بن بكار؛ ولد سنة 169هـ وتوفي سنة 270هـ بحسب ابن حجر. قرأ عليه الطبري القرآن ببيروت وأخذ عنه الحروف."
  en: "Abu al-Fadl al-Abbas ibn al-Walid of Beirut, a master reciter of Syria and companion of Abd al-Hamid ibn Bakkar; born in 169 AH and died in 270 AH according to Ibn Hajar. Al-Tabari read the Qur'an with him in Beirut and took the readings from him."
  fr: "Abu al-Fadl al-Abbas ibn al-Walid de Beyrouth, maître de récitation de Syrie et compagnon d’Abd al-Hamid ibn Bakkar ; né en 169 H et mort en 270 H selon Ibn Hajar. Al-Tabari récita le Coran auprès de lui à Beyrouth et recueillit de lui les lectures."
  ur: "ابو الفضل عباس بن الولید بیروتی، شام کے مقری، عبد الحمید بن بکار کے رفیق؛ ابن حجر کے مطابق 169ھ میں پیدا ہوئے اور 270ھ میں فوت ہوئے۔ طبری نے بیروت میں ان سے قرآن پڑھا اور حروف لیے۔"
  es: "Abu al-Fadl al-Abbas ibn al-Walid de Beirut, maestro recitador de Siria y compañero de Abd al-Hamid ibn Bakkar, nació en el año 169 de la Hégira y falleció en el año 270 de la Hégira, según Ibn Hajar. Al-Tabari recitó el Corán con él en Beirut y aprendió de él las recitaciones."
  tr: "Ebu el-Fadl el-Abbas ibn el-Valid el-Beyruti, Levant Kur'an okuyucusu, Abdülhamid ibn Bakkar'ın sahabesi; İbn Hacer'e göre 169 Hicri yılında doğmuş ve 270 Hicri yılında vefat etmiştir. Taberi, Beyrut'ta ona Kur'an okumuş ve ondan harfleri öğrenmiştir."
  id: "Abu al-Fadl al-Abbas ibn al-Walid al-Bayruti, seorang qari dari Levant, sahabat Abd al-Hamid ibn Bakkar; beliau lahir pada tahun 169 H dan wafat pada tahun 270 H menurut Ibn Hajar. Al-Tabari membacakan Al-Quran kepadanya di Beirut dan mempelajari huruf-huruf Al-Quran darinya."
