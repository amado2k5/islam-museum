summary:
  ar: "محمد بن علي بن محمد، أبو عبد الله شمس الدين الغرناطي المالكي، فقيه من القضاة، تولى القضاء بغرناطة إلى أن استولى عليها الإفرنج، فانتقل إلى تلمسان ثم إلى المشرق يستنفر ملوك الأرض لنجدة صاحب غرناطة، وتولى قضاء القضاة ببيت المقدس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8505}"
  en: "Muhammad ibn Ali ibn Muhammad, Abu Abd Allah Shams al-Din al-Gharnati, a Maliki jurist and judge. He held the judgeship at Granada until the Christians took it, then moved to Tlemcen and then to the East, seeking help from the rulers for the king of Granada, and became chief judge at Jerusalem. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8505}"
