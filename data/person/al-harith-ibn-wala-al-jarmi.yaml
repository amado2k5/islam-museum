summary:
  ar: "شاعر جاهلي من جرم بن ريان من قضاعة، وأبوه وعلة من فرسان قضاعة، ويميزه شرح الحماسة من الحارث بن وعلة الشيباني {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  en: "A pre-Islamic poet of Jarm ibn Rayyan of Quda'a, whose father Wa'la was among the horsemen of Quda'a; the Hamasa commentary distinguishes him from al-Harith ibn Wa'la al-Shaybani {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  es: "Poeta preislámico de Jarm ibn Rayyan de Quda'a, cuyo padre Wa'la estaba entre los jinetes de Quda'a; el comentario de Hamasa lo distingue de al-Harith ibn Wa'la al-Shaybani {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  fr: "Poète préislamique de Jarm ibn Rayyan de Quda'a, dont le père Wa'la était parmi les cavaliers de Quda'a; le commentaire du Hamasa le distingue d'al-Harith ibn Wa'la al-Shaybani {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  ur: "قدعہ کے جرم بن ریان کا ایک قبل از اسلام شاعر، جس کے والد والا قدعہ کے گھڑ سواروں میں سے تھے۔ حماسہ کی تفسیر اسے حارث بن ولاء الشیبانی سے ممتاز کرتی ہے {{حوالہ: حماسہ ابو تمام ایڈ-1916 صفحہ 57}}۔"
