label: { ar: "إبراهيم الإمام", en: "the Imam Ibrahim" }
summary:
  ar: "إبراهيم بن محمد بن علي بن عبد الله بن العباس إمام الدعوة العباسية، احتال مروان على رسوله إلى أبي مسلم فبعث به إليه يستنطق جوابه، فلما أتاه الجواب بخطه كتب إلى عامله يأخذه بقرية الكرار والحميمة وهو جالس في مسجدها ملففاً فحبسه بحران شهرين، فلما أغلظ له في المحاورة وأنكر أخرج له الرسول فعلم أنه أتي من مأمنه، ثم هجم عليه موالي مروان فجعلوا رأسه في جراب فيه نورة مسحوقة فخمد، وقتل معه العباس بن الوليد وعبد الله بن عمر بن عبد العزيز تحت المخاد {cite:muruj-al-dhahab p. 230-231}."
  en: "Ibrahim ibn Muhammad ibn 'Ali, the Abbasid da'wa's imam — trapped by Marwan's returned courier, seized praying in al-Humayma's mosque, smothered in Harran prison with quicklime while his Umayyad fellow-captives died under pillows {cite:muruj-al-dhahab p. 230-231}."
