id: person/ibrahim-ibn-muhammad-al-imam
class: person
label: { ar: "إبراهيم الإمام", en: "the Imam Ibrahim", es: "the Imam Ibrahim", fr: "the Imam Ibrahim", ur: "امام ابراہیم" }
summary:
  ar: "إبراهيم بن محمد بن علي بن عبد الله بن العباس إمام الدعوة العباسية، احتال مروان على رسوله إلى أبي مسلم فبعث به إليه يستنطق جوابه، فلما أتاه الجواب بخطه كتب إلى عامله يأخذه بقرية الكرار والحميمة وهو جالس في مسجدها ملففاً فحبسه بحران شهرين، فلما أغلظ له في المحاورة وأنكر أخرج له الرسول فعلم أنه أتي من مأمنه، ثم هجم عليه موالي مروان فجعلوا رأسه في جراب فيه نورة مسحوقة فخمد، وقتل معه العباس بن الوليد وعبد الله بن عمر بن عبد العزيز تحت المخاد {cite:muruj-al-dhahab p. 230-231}."
  en: "Ibrahim ibn Muhammad ibn 'Ali, the Abbasid da'wa's imam — trapped by Marwan's returned courier, seized praying in al-Humayma's mosque, smothered in Harran prison with quicklime while his Umayyad fellow-captives died under pillows {cite:muruj-al-dhahab p. 230-231}."
  es: "Ibrahim ibn Muhammad ibn 'Ali, el imán de la da'wa abasí, fue atrapado por el mensajero de Marwan, apresado mientras rezaba en la mezquita de al-Humayma y asfixiado con cal viva en la prisión de Harran, mientras sus compañeros cautivos omeyas morían bajo almohadas {cite:muruj-al-dhahab p. 230-231}."
  fr: "Ibrahim ibn Muhammad ibn 'Ali, l'imam de la da'wa abbasside — piégé par le messager de Marwan de retour, saisi en train de prier dans la mosquée d'al-Humayma, étouffé dans la prison de Harran avec de la chaux vive tandis que ses compagnons captifs omeyyades mouraient sous des oreillers {cite:muruj-al-dhahab p. 230-231}."
  ur: "ابراھیم بن محمد ابن علی، عباسی دعوے کے امام - مروان کے واپس آنے والے کورئیر کے ذریعہ پھنس گئے، الحمیمہ کی مسجد میں نماز پڑھتے ہوئے پکڑے گئے، حران کی جیل میں جلدی سے دب گئے جب کہ اس کے اموی ساتھی اسیر تکیوں کے نیچے مر گئے۔ 230-231}۔"
  tr: "Abbasi misyonunun imamı İbrahim ibn Muhammed ibn Ali ibn Abdullah ibn al-Abbas, elçisini Ebu Müslüme kandırdı ve Ebu Müslüm onu cevabını istemesi için gönderdi. Cevabı el yazısıyla alınca, valisine yazdı, kendisi camide sarılı otururken onu El-Karrar ve El-Hümaymah köylerine götürmesini istedi. İki ay hapsedildi. Sert davranıp konuşmayı reddedince, elçi onu dışarı gönderdi ve güvenli yerinden geldiğini fark etti. Sonra Mervan'ın takipçileri ona saldırdı, başını toz ışık içeren bir keseye koydu ve öldürüldü. Abbas ibn el-Velid ve Abdullah ibn Ömer bin Abdülaziz yastıkların altında öldürüldü {atıf:Muruj-al-Dhahab, s. 230-231}."
  id: "Ibrahim ibn Muhammad ibn Ali ibn Abdullah ibn al-Abbas, Imam misi Abbasiyah, menipu utusannya kepada Abu Muslim, yang kemudian mengirimnya untuk mencari jawabannya. Ketika menerima balasan dengan tulisan tangannya, ia menulis kepada gubernurnya untuk membawanya ke desa Al-Karrar dan Al-Humaymah saat ia duduk di masjid mereka dengan keadaan terbungkus. Ia dipenjara selama dua bulan. Ketika ia keras dan menolak percakapan itu, utusan mengusirnya keluar, dan ia menyadari bahwa ia datang dari tempat amannya. Kemudian para pengikut Marwan menyerangnya, memasukkan kepalanya ke dalam kantong berisi cahaya bubuk, dan ia dibunuh. Abbas ibn al-Walid dan Abdullah ibn Umar ibn Abd al-Aziz dibunuh di bawah bantal {cite:muruj-al-dhahab, hlm. 230-231}."
