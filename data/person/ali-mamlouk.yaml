  ar: "ضابط مخابرات سوري، من مؤسسي الاستخبارات الجوية، ترأس إدارة المخابرات العامة ثم مكتب الأمن الوطني (2012–2019)، وعُيّن نائبًا للرئيس للشؤون الأمنية سنة 2019 ومستشارًا للأمن القومي سنة 2024، وكان من أقرب مستشاري الرئيس السابق بشار الأسد."
