summary:
  ar: "أديب وصحفي لبناني (توفي 1884)؛ وُلد في بيروت وانتقل إلى الإسكندرية سنة 1876، فأصدر مع صديقه أديب إسحاق جرائد «مصر» (1877) و«التجارة» (1878) و«المحروسة» (1880)، وألّف كتاب «مصر للمصريين أو حوادث الفتنة العرابية» في تسعة أجزاء، وتوفي في الإسكندرية."
  en: "Lebanese writer and journalist (died 1884). Born in Beirut, he moved to Alexandria in 1876 and with his friend Adib Ishaq published the newspapers Misr (1877), al-Tijara (1878) and al-Mahrousa (1880); he wrote Misr lil-Misriyyin ('Egypt for the Egyptians'), an account of the Urabi revolt in nine parts, and died in Alexandria."
  ur: "لبنانی ادیب اور صحافی (وفات 1884)؛ بیروت میں پیدا ہوئے اور 1876 میں اسکندریہ منتقل ہو گئے، جہاں انہوں نے اپنے دوست ادیب اسحاق کے ساتھ اخبارات «مصر» (1877)، «التجارہ» (1878) اور «المحروسہ» (1880) جاری کیے؛ انہوں نے عرابی بغاوت پر نو حصوں میں کتاب «مصر للمصریین» لکھی، اور اسکندریہ ہی میں انتقال ہوا۔"
