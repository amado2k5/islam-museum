summary:
  ar: "أديب وصحفي لبناني ⁦(توفي 1884)⁩؛ وُلد في بيروت وانتقل إلى الإسكندرية سنة 1876، فأصدر مع صديقه أديب إسحاق جرائد «مصر» (1877) و«التجارة» (1878) و«المحروسة» (1880)، وألّف كتاب «مصر للمصريين أو حوادث الفتنة العرابية» في تسعة أجزاء، وتوفي في الإسكندرية."
  en: "Lebanese writer and journalist (died 1884). Born in Beirut, he moved to Alexandria in 1876 and with his friend Adib Ishaq published the newspapers Misr (1877), al-Tijara (1878) and al-Mahrousa (1880); he wrote Misr lil-Misriyyin ('Egypt for the Egyptians'), an account of the Urabi revolt in nine parts, and died in Alexandria."
  ur: "لبنانی ادیب اور صحافی ⁦(وفات 1884)⁩؛ بیروت میں پیدا ہوئے اور 1876 میں اسکندریہ منتقل ہو گئے، جہاں انہوں نے اپنے دوست ادیب اسحاق کے ساتھ اخبارات «مصر» (1877)، «التجارہ» (1878) اور «المحروسہ» (1880) جاری کیے؛ انہوں نے عرابی بغاوت پر نو حصوں میں کتاب «مصر للمصریین» لکھی، اور اسکندریہ ہی میں انتقال ہوا۔"
  es: "Escritor y periodista libanés (fallecido en 1884). Nacido en Beirut, se trasladó a Alejandría en 1876 y, junto con su amigo Adib Ishaq, publicó los periódicos Misr (1877), al-Tijara (1878) y al-Mahrousa (1880); escribió Misr lil-Misriyyin («Egipto para los egipcios»), un relato de la revuelta de Urabi en nueve partes, y falleció en Alejandría."
  fr: "Écrivain et journaliste libanais (mort en 1884). Né à Beyrouth, il s'installe à Alexandrie en 1876 et publie avec son ami Adib Ishaq les journaux Misr (1877), al-Tijara (1878) et al-Mahrousa (1880); il écrit Misr lil-Misriyyin (« L'Égypte aux Égyptiens »), un récit de la révolte d'Urabi en neuf parties, et meurt à Alexandrie."
  tr: "Lübnanlı bir yazar ve gazeteci (1884'te öldü); Beyrut'ta doğdu ve 1876'da İskenderiye'ye taşındı. Arkadaşı Adeeb Ishaq ile birlikte \"Mısır\" (1877), \"El-Tijara\" (1878) ve \"El-Mahrousa\" (1880) gazetelerini yayımladı. \"Mısırlılar için Mısır veya İlahi İsyan Olayları\" adlı dokuz ciltlik kitabı yazdı ve İskenderiye'de hayatını kaybetti."
  id: "Seorang penulis dan jurnalis Lebanon (meninggal 1884); lahir di Beirut dan pindah ke Alexandria pada tahun 1876. Bersama temannya Adeeb Ishaq, ia menerbitkan surat kabar \"Egypt\" (1877), \"Al-Tijara\" (1878), dan \"Al-Mahrousa\" (1880). Ia menulis buku \"Egypt for Egyptians or the Events of the Divine Scient\" dalam sembilan jilid, dan meninggal di Alexandria."
