summary:
  ar: "شاعر جاهلي، يُضرب به المثل في يوم البؤس؛ يذكر النويري أن يوم عبيد مثل لليوم المنحوس لا يفلح من لقيه فيه، وأورد لأبي تمام بيتاً في ذلك {cite:nihayat-al-arab-nuwayri-vol1-scan p. 173}."
  en: "A pre-Islamic poet. Al-Nuwayri records 'the day of Ubayd' as a proverb for an unlucky day on which no one who meets it prospers, and quotes Abu Tammam on it {cite:nihayat-al-arab-nuwayri-vol1-scan p. 173}."
  ur: "جاہلی شاعر۔ نویری بیان کرتے ہیں کہ 'یوم عبید' نحوست کے دن کی مثل ہے، جس دن جس کا سامنا ہو وہ کامیاب نہیں ہوتا؛ اور ابو تمام کا ایک شعر اس پر نقل کیا ہے {cite:nihayat-al-arab-nuwayri-vol1-scan p. 173}۔"
