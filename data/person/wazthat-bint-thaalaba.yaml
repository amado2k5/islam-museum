summary:
  ar: "امرأة من بني ثعلبة في الجاهلية، قالت 'بخ بخ ساق بخلخال' حين رأت ضرّتها تمشي بخلخالين، فصارت الكلمة مثلاً. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 19}"
  en: "A woman of Banu Tha'laba in pre-Islamic times who said 'Bakh bakh, a leg with an anklet' on seeing a co-wife in two anklets; the phrase became a proverb. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 19}"
  ur: "جاہلیت میں بنو ثعلبہ کی ایک عورت؛ اپنی سوکن کو دو پازیب پہنے دیکھ کر کہا 'بخ بخ، پازیب والی ٹانگ'، اور یہ جملہ مثل بن گیا۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 19}"
