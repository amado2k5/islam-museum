summary:
  ar: "امرأة من بني ثعلبة في الجاهلية، قالت 'بخ بخ ساق بخلخال' حين رأت ضرّتها تمشي بخلخالين، فصارت الكلمة مثلاً. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 19}"
  en: "A woman of Banu Tha'laba in pre-Islamic times who said 'Bakh bakh, a leg with an anklet' on seeing a co-wife in two anklets; the phrase became a proverb. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 19}"
  ur: "جاہلیت میں بنو ثعلبہ کی ایک عورت؛ اپنی سوکن کو دو پازیب پہنے دیکھ کر کہا 'بخ بخ، پازیب والی ٹانگ'، اور یہ جملہ مثل بن گیا۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 19}"
  es: "Una mujer de Banu Tha'laba, en tiempos preislámicos, dijo «Bakh bakh, una pierna con una tobillera» al ver a una coesposa con dos tobilleras; la frase se convirtió en un proverbio. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 19}"
  fr: "Une femme de la tribu Banu Tha'laba, à l'époque préislamique, aurait dit « Bakh bakh, une jambe avec un bracelet de cheville » en voyant une de ses coépouses porter deux bracelets de cheville; cette expression est devenue un proverbe. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 19}"
  tr: "İslam öncesi dönemde Banu Tha'labah'dan bir kadın, eşini bileklikle yürürken gördüğünde 'Bukh Bukh Saq bileklikli' dedi, böylece kelime bir örnek oldu. {cite:nihayat-al-arab-nuwayri-vol3-scan s. 19}"
  id: "Seorang wanita dari Banu Tha'labah pada era pra-Islam berkata 'Bukh Bukh Saq dengan gelang kaki' ketika melihat istrinya berjalan dengan gelang kaki, sehingga kata itu menjadi contoh. {cite:nihayat-al-arab-nuwayri-vol3-scan hlm. 19}"
