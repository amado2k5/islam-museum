summary:
  ar: "سياسي ودبلوماسي باكستاني (1909–1963) من أسرة نواب بكرغانج، رئيس وزراء باكستان الثالث (1953–1955). عمل سفيراً لباكستان لدى بورما وكندا والولايات المتحدة واليابان، واشتهر بـ«صيغة بوغرا» الدستورية وسياسة الوحدة الواحدة، وخلَف خواجة ناظم الدين في رئاسة الوزراء ثم خلَفه تشودري محمد علي."
  en: "Pakistani politician and diplomat (1909–1963) of the Backergunge nawab family, the third prime minister of Pakistan (1953–1955). He served as Pakistan's ambassador to Burma, Canada, the United States and Japan, and is known for the constitutional Bogra formula and the One Unit policy; he succeeded Khawaja Nazimuddin as prime minister and was succeeded by Chaudhry Muhammad Ali."
  ur: "پاکستانی سیاستدان اور سفارتکار (1909ء–1963ء) جن کا تعلق بکرگنج کے نواب خاندان سے تھا، پاکستان کے تیسرے وزیر اعظم (1953ء–1955ء)۔ برما، کینیڈا، امریکا اور جاپان میں پاکستان کے سفیر رہے، اور «بوگرہ فارمولا» اور ون یونٹ پالیسی کے لیے مشہور ہوئے؛ خواجہ ناظم الدین کے بعد وزیر اعظم بنے اور ان کے بعد چودھری محمد علی آئے۔"
