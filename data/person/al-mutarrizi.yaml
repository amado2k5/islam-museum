summary:
  ar: "ناصر الدين المطرزي، وُلد سنة ٥٣٨هـ، ١١٤٣م، في الجرجانية عاصمة خوارزم وتوفي فيها في ٨ أكتوبر ١٢١٣م. تتلمذ على تلامذة الزمخشري وسُمّي خليفة الزمخشري. وهو معتزلي في العقيدة حنفي في العمل بحسب موسوعة الإسلام التركية TDV، وصاحب «المغرب في ترتيب المعرب»."
  en: "Nasir al-Din al-Mutarrizi, born in 538 AH (1143) at Jurjaniyya, capital of Khwarazm, and died there on 8 October 1213. He studied under pupils of al-Zamakhshari and was called al-Zamakhshari's successor. According to the TDV İslâm Ansiklopedisi he was Mu'tazili in creed and Hanafi in practice; author of al-Mughrib fi tartib al-mu'rib."
  es: "Nasir al-Din al-Mutarrizi, nacido en 538 AH (1143) en Yurjaniyya, capital de Jorezm, y fallecido allí el 8 de octubre de 1213. Estudió con discípulos de al-Zamajshari y fue llamado su sucesor. Según la TDV İslâm Ansiklopedisi era mutazilí en el credo y hanafí en la práctica; autor del al-Mughrib fi tartib al-mu'rib."
  fr: "Nasir al-Din al-Mutarrizi, né en 538 AH (1143) à Jurjaniyya, capitale du Khwarezm, mort là le 8 octobre 1213. Il étudia auprès d'élèves d'al-Zamakhshari et fut appelé son successeur. Selon la TDV İslâm Ansiklopedisi il était mutazilite de credo et hanafite de pratique ; auteur d'al-Mughrib fi tartib al-mu'rib."
  ur: "ناصر الدین مطرزی، 538ھ، 1143ء میں خوارزم کے دارالحکومت جرجانیہ میں پیدا ہوئے اور وہیں 8 اکتوبر 1213ء کو فوت ہوئے۔ انہوں نے زمخشری کے شاگردوں سے پڑھا اور خلیفۃ الزمخشری کہلائے۔ TDV İslâm Ansiklopedisi کے مطابق وہ عقیدے میں معتزلی اور عمل میں حنفی تھے؛ المغرب فی ترتیب المعرب کے مصنف۔"
  tr: "Nasir al-Din al-Mutarzi, 538 Hicri (1143 M.S.) yılında Harezm'in başkenti Al-Jurcaniyah'da doğdu ve 8 Ekim 1213'te orada öldü. El-Zemakşeri'nin öğrencilerinden eğitim aldı ve el-Zemakşeri'nin halifesi olarak atandı. İnanç olarak bir mütazilikti, Türk İslam Ansiklopedisi'ne (TDV) göre pratikte Hanefi ve 'Al-Maghrib fi Tartib al-Mu'arrab' adlı eserin yazarıydı."
  id: "Nasir al-Din al-Mutarzi lahir pada tahun 538 H (1143 M) di Al-Jurjaniyah, ibu kota Khwarezm, dan meninggal di sana pada 8 Oktober 1213 M. Ia belajar di bawah bimbingan murid-murid al-Zamakhshari dan dinobatkan sebagai khalifah al-Zamakhshari. Ia adalah seorang Mu'tazilite dalam kepercayaan, Hanafi dalam praktiknya menurut Ensiklopedia Islam Turki (TDV), dan penulis 'Al-Maghrib fi Tartib al-Mu'arrab'."
