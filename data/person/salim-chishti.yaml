summary:
  ar: "بطاقة أولية للشيخ سليم جشتي، صوفي فتحبور سكري الذي اتصل بأكبر وبُني له الضريح المشهور فيه، توفي سنة ١٥٧٢م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Shaykh Salim Chishti, the Sufi of Fatehpur Sikri associated with Akbar and entombed in its celebrated shrine, d. 1572; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Shaykh Salim Chishti, el sufí de Fatehpur Sikri asociado con Akbar y sepultado en su célebre santuario, fallecido en 1572; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature pour le cheikh Salim Chishti, le soufi de Fatehpur Sikri associé à Akbar et enterré dans son célèbre sanctuaire, décédé en 1572; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "اکبر سے وابستہ فتح پور سیکری کے صوفی شیخ سلیم چشتی کے لیے ڈرافٹ کارڈ اور اس کے مشہور مزار میں دفن ہوئے، ڈی۔ 1572; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
