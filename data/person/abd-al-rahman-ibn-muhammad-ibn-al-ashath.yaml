id: person/abd-al-rahman-ibn-muhammad-ibn-al-ashath
class: person
label: { ar: "عبد الرحمن بن محمد بن الأشعث", en: "Abd al-Rahman ibn Muhammad ibn al-Ash'ath", fr: "Abd al-Rahman ibn Muhammad ibn al-Ash'ath", es: "Abd al-Rahman ibn Muhammad ibn al-Ash'ath", ur: "عبدالرحمٰن بن محمد بن اشعث" }
summary:
  ar: "قاد الخروج على الحجاج في سنة إحدى وثمانين، فاجتمع الناس إليه وكان أول من بويع له {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. وعند المسعودي حارب من سجستان أنواعاً من الترك يقال لهم العوز والخلج ومن يلي تلك البلاد من ملوك الهند مثل رتبيل، وانقاد إلى طاعته بعد خلعه أهل البصرة والجبال مما يلي الكوفة والبصرة، وفيه يقول الشاعر خلع الملوك وصار تحت لوائه شجر العرى وعراعر الأقوام {cite:muruj-al-dhahab p. 122-123}"
  en: "He led the revolt against al-Hajjaj in the year 81 AH, and people gathered to him; he was the first to receive the oath of allegiance {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. According to al-Mas'udi, he fought in Sistan against several Turkish peoples called al-Awz and al-Khalaj, and against the kings of India who ruled those lands, such as Ratbil; after his deposition, the people of Basra and the highlands bordering Kufa and Basra submitted to his obedience. A poet said of him that he deposed kings, and beneath his banner stood the thorny trees of the wasteland and the chieftains of the peoples {cite:muruj-al-dhahab p. 122-123}."
  fr: "Il mena la révolte contre al-Hajjaj en l'an 81 H, et les gens se rassemblèrent autour de lui ; il fut le premier à recevoir le serment d'allégeance {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. Selon al-Mas'udi, il combattit au Sistan contre plusieurs peuples turcs appelés al-Awz et al-Khalaj, et contre les rois de l'Inde qui régnaient sur ces terres, tel Ratbil ; après sa rupture, les gens de Bassora et des hautes terres bordant Koufa et Bassora se soumirent à son obéissance. Un poète dit de lui qu'il déposa des rois, et que sous sa bannière se tenaient les arbres épineux du désert et les chefs des peuples {cite:muruj-al-dhahab p. 122-123}."
  es: "Lideró la revuelta contra al-Hajjaj en el año 81 AH, y el pueblo se congregó a su alrededor; fue el primero en recibir el juramento de lealtad {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. Según al-Mas'udi, luchó en Sistán contra varios pueblos turcos llamados al-Awz y al-Khalaj, y contra los reyes de la India que gobernaban esas tierras, como Ratbil; tras su deposición, la gente de Basora y las tierras altas que limitaban con Kufa y Basora se sometieron a su obediencia. Un poeta dijo de él que depuso a reyes, y bajo su estandarte se alzaban los árboles espinosos del páramo y los jefes de los pueblos {cite:muruj-al-dhahab p. 122-123}."
  ur: "اس نے 81 ہجری میں الحجاج کے خلاف بغاوت کی قیادت کی اور لوگ اس کے پاس جمع ہوئے۔ وہ سب سے پہلے بیعت لینے والے تھے {حوالہ: طبری-تاریخ-ابو الفضل ج.6 صفحہ 338}۔ المسعودی کے مطابق، اس نے سیستان میں العوز اور الخلج نامی متعدد ترکوں کے خلاف اور ہندوستان کے بادشاہوں کے خلاف جنگ کی جنہوں نے ان سرزمین پر حکومت کی، جیسے رتبیل؛ اس کی معزولی کے بعد بصرہ اور کوفہ اور بصرہ سے متصل پہاڑی علاقوں کے لوگ اس کی اطاعت کے لیے سرتسلیم خم ہوگئے۔ ایک شاعر نے ان کے بارے میں کہا ہے کہ اس نے بادشاہوں کو معزول کیا اور اس کے جھنڈے کے نیچے بنجر زمین کے کانٹے دار درخت اور قوموں کے سردار کھڑے تھے۔ 122-123}۔"
  tr: "81 yılında Haccac'a karşı isyanı yönetti ve halk onun etrafında toplandı; biat edilen ilk kişi o oldu. {Kaynak: Tabari-tarikh-ebu-al-fadl c.6 s.338}. El-Mas'udi'ye göre, Sijistan'dan çeşitli Türk türlerine (Awz ve Halec olarak adlandırılanlar) ve Ratbil gibi o toprakları yöneten Hindistan krallarına karşı savaştı. Basra halkını ve Kufa ile Basra yakınlarındaki dağları tahttan indirdikten sonra, onlar onun otoritesine boyun eğdiler. Şair onun hakkında şöyle der: Kralları tahttan indirdi ve sancağı altında Ara ağaçları ve halkların Ara'ları geldi. {Kaynak: Muruj-al-dhahab s. 122-123}"
  id: "Ia memimpin pemberontakan melawan al-Hajjaj pada tahun 81, dan orang-orang berkumpul di sekelilingnya, dan ia adalah orang pertama yang diberi baiat {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. Menurut al-Mas'udi, ia berperang dari Sijistan melawan berbagai jenis Turki yang disebut 'Awz dan Khalaj, dan melawan raja-raja India yang memerintah wilayah tersebut, seperti Ratbil. Setelah ia menggulingkan penduduk Basra dan pegunungan dekat Kufa dan Basra, mereka tunduk pada kekuasaannya. Penyair berkata tentangnya: Ia menggulingkan raja-raja, dan di bawah panjinya datanglah pohon-pohon 'Ara dan 'Ara' dari berbagai bangsa {cite:muruj-al-dhahab p. 122-123}"
