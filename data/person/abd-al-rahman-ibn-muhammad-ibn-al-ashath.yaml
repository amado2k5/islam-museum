label: { ar: "عبد الرحمن بن محمد بن الأشعث", en: "Abd al-Rahman ibn Muhammad ibn al-Ash'ath" }
summary:
  ar: "قاد الخروج على الحجاج في سنة إحدى وثمانين، فاجتمع الناس إليه وكان أول من بويع له {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. وعند المسعودي حارب من سجستان أنواعاً من الترك يقال لهم العوز والخلج ومن يلي تلك البلاد من ملوك الهند مثل رتبيل، وانقاد إلى طاعته بعد خلعه أهل البصرة والجبال مما يلي الكوفة والبصرة، وفيه يقول الشاعر خلع الملوك وصار تحت لوائه شجر العرى وعراعر الأقوام {cite:muruj-al-dhahab p. 122-123}"
  en: "He led the revolt against al-Hajjaj in the year 81 AH, and people gathered to him; he was the first to receive the oath of allegiance {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. According to al-Mas'udi, he fought in Sistan against several Turkish peoples called al-Awz and al-Khalaj, and against the kings of India who ruled those lands, such as Ratbil; after his deposition, the people of Basra and the highlands bordering Kufa and Basra submitted to his obedience. A poet said of him that he deposed kings, and beneath his banner stood the thorny trees of the wasteland and the chieftains of the peoples {cite:muruj-al-dhahab p. 122-123}."
