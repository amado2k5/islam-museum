roles: [poet]
summary:
  ar: "شاعر من بني العنبر؛ تفتتح بقصيدته «لو كنت من مازن لم تستبح إبلي» باب الحماسة في ديوان الحماسة، وتنقل الطبعة أن الحماسة نسبته إلى «بعض شعراء بالعنبر» ثم يسمّيه التبريزي قريط بن أنيف {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  en: "A poet of Banu al-Anbar; his ode \"Had you been of Mazin, Banu al-Laqita would not have taken my camels\" opens the chapter of valour in the Diwan al-Hamasa; the edition notes that the Hamasa ascribes it to \"some poet of al-Anbar\", whom al-Tibrizi names Qurayt ibn Unayf {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  es: "Un poeta de Banu al-Anbar; su oda \"Si hubieras sido de Mazin, Banu al-Laqita no habría tomado mis camellos\" abre el capítulo de valor en el Diwan al-Hamasa; la edición señala que la Hamasa se la atribuye a \"algún poeta de al-Anbar\", a quien al-Tibrizi nombra Qurayt ibn Unayf {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  fr: "Un poète des Banu al-Anbar; son ode « Si tu avais été de Mazin, les Banu al-Laqita n'auraient pas pris mes chameaux » ouvre le chapitre de la vaillance dans le Diwan al-Hamasa; l'édition note que le Hamasa l'attribue à « un poète d'al-Anbar », qu'al-Tibrizi nomme Qurayt ibn Unayf {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  ur: "بنو الانبار کا ایک شاعر؛ اس کا قول \"اگر تم مازن میں سے ہوتے تو بنو لقیطہ میرے اونٹ نہ لے جاتے\" دیوان الحمسہ میں بہادری کا باب کھولتا ہے۔ ایڈیشن نوٹ کرتا ہے کہ حماسہ نے اسے \"الانبار کے کچھ شاعر\" سے منسوب کیا ہے، جسے تبریزی نے قریت ابن عنیف کا نام دیا ہے"
