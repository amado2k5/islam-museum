summary:
  ar: "شاعر من بني العنبر؛ تفتتح بقصيدته «لو كنت من مازن لم تستبح إبلي» باب الحماسة في ديوان الحماسة، وتنقل الطبعة أن الحماسة نسبته إلى «بعض شعراء بالعنبر» ثم يسمّيه التبريزي قريط بن أنيف {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  en: "A poet of Banu al-Anbar; his ode \"Had you been of Mazin, Banu al-Laqita would not have taken my camels\" opens the chapter of valour in the Diwan al-Hamasa; the edition notes that the Hamasa ascribes it to \"some poet of al-Anbar\", whom al-Tibrizi names Qurayt ibn Unayf {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
