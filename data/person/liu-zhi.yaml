summary:
  ar: "ليو تشي (نحو 1660 – نحو 1739) عالم مسلم صيني من نانجينغ في عهد أسرة تشينغ، وأبرز كتّاب «هان كتاب» الذين شرحوا الفكر الإسلامي بمصطلحات كونفوشيوسية لقارئ صيني. من أشهر أعماله «تيانفانغ شينغلي» في أصول الإسلام و«تيانفانغ ديانلي» في شعائره و«تيانفانغ جيشنغ شيلو» في سيرة النبي محمد."
  en: "Liu Zhi (c. 1660 – c. 1739) was a Chinese Muslim scholar of Nanjing under the Qing dynasty and the most prominent of the Han Kitab writers, who expounded Islamic thought in Neo-Confucian terms for a Chinese audience. His best-known works are the Tianfang Xingli on the principles of Islam, the Tianfang Dianli on its rites and the Tianfang Zhisheng Shilu, a life of the Prophet Muhammad."
  ur: "لیو ژی (تقریباً 1660ء – تقریباً 1739ء) چنگ دور کے چینی مسلمان عالم تھے جن کا تعلق نانجنگ سے تھا۔ وہ ہان کتاب کے مصنفین میں سب سے نمایاں تھے، جنھوں نے چینی قارئین کے لیے اسلامی فکر کو نو کنفیوشسی اصطلاحات میں پیش کیا۔ ان کی مشہور تصانیف میں اصولِ اسلام پر «تیان فانگ زنگلی»، شعائر پر «تیان فانگ دیانلی» اور سیرتِ نبوی پر «تیان فانگ ژی شینگ شیلو» شامل ہیں۔"

