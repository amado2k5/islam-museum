label: { ar: "محمد بن البعيث", en: "Muhammad ibn al-Ba'ith" }
summary:
  ar: "محمد بن البعيث بن حلبس صاحب مرند بأذربيجان؛ حصنها وبنى بها قصوراً وخالف في خلافة المتوكل فحاربه بنا الصغير مولى أمير المؤمنين حتى ظفر به وحمله إلى سر من رأى وهدم حائط مرند وقصره وعند البلاذري نزل جده حلبس أبو البعيث مرند ثم حصنها البعيث ثم ابنه محمد والبعيثيون من ولد عتيب بن عمرو بن وهب بن أفصى بن دعمي بن جديلة بن أسد بن ربيعة ويقال عتيب بن عوف بن سنان وهرب في سنة أربع وثلاثين ومائتين وذكر الطبري خبر هربه {cite:tabari-tarikh-abu-al-fadl j.9 p.164}."
  en: "Muhammad ibn al-Ba'ith ibn Halbas, lord of Marand in Azerbaijan; he fortified it and raised palaces, broke away under al-Mutawakkil, and Buna al-Saghir took him to Samarra and razed his works — the Ba'ithids of Utayb ibn Amr of Asad ibn Rabi'a; al-Tabari records his flight in 234 AH."
