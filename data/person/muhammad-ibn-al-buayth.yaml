id: person/muhammad-ibn-al-buayth
class: person
label: { ar: "محمد بن البعيث", en: "Muhammad ibn al-Ba'ith", es: "Muhammad ibn al-Ba'ith", fr: "Muhammad ibn al-Ba'ith", ur: "محمد بن البیث" }
summary:
  ar: "محمد بن البعيث بن حلبس صاحب مرند بأذربيجان؛ حصنها وبنى بها قصوراً وخالف في خلافة المتوكل فحاربه بنا الصغير مولى أمير المؤمنين حتى ظفر به وحمله إلى سر من رأى وهدم حائط مرند وقصره وعند البلاذري نزل جده حلبس أبو البعيث مرند ثم حصنها البعيث ثم ابنه محمد والبعيثيون من ولد عتيب بن عمرو بن وهب بن أفصى بن دعمي بن جديلة بن أسد بن ربيعة ويقال عتيب بن عوف بن سنان وهرب في سنة أربع وثلاثين ومائتين وذكر الطبري خبر هربه {cite:tabari-tarikh-abu-al-fadl j.9 p.164}."
  en: "Muhammad ibn al-Ba'ith ibn Halbas, lord of Marand in Azerbaijan; he fortified it and raised palaces, broke away under al-Mutawakkil, and Buna al-Saghir took him to Samarra and razed his works — the Ba'ithids of Utayb ibn Amr of Asad ibn Rabi'a; al-Tabari records his flight in 234 AH."
  es: "Muhammad ibn al-Ba'ith ibn Halbas, señor de Marand en Azerbaiyán; la fortificó y construyó palacios, se separó de al-Mutawakkil, y Buna al-Saghir lo llevó a Samarra y arrasó sus obras —los baítas de Utayb ibn Amr de Asad ibn Rabi'a; al-Tabari registra su huida en el año 234 de la Hégira."
  fr: "Muhammad ibn al-Ba'ith ibn Halbas, seigneur de Marand en Azerbaïdjan; il la fortifia et y fit construire des palais, se sépara sous al-Mutawakkil, et Buna al-Saghir l'emmena à Samarra et rasa ses ouvrages — les Ba'ithides d'Utayb ibn Amr d'Asad ibn Rabi'a; al-Tabari relate sa fuite en 234 AH."
  ur: "محمد بن البیث ابن حلباس، آذربائیجان میں مرند کا سردار؛ اس نے اسے مضبوط کیا اور محلات بنائے، المتوکل کے ماتحت ٹوٹ گئے، اور بونا الصغیر اسے سامرہ لے گیا اور اس کے کاموں کو مسمار کر دیا - اسد ابن ربیعہ کے عطیب بن عمرو کے بیعت؛ الطبری نے اس کی پرواز 234 ہجری میں درج کی ہے۔"
  tr: "Azerbaycan'daki Marand hükümdarı Muhammed bin Bait bin Halbas; burayı tahkim etti, saraylar inşa etti ve el-Mutavakkil halifeliğine karşı çıktı. Sadıklar Komutanı'nın özgür adamı Bana el-Saçhir, onu yakalayıp görenlerin sırrına götürene kadar onunla savaştı. El-Baladhuri'deki Marand duvarını ve sarayını yıktı. Dedesi Halbaş Ebu el-Bait Marand ikamet etti, ardından Al-Bay -Bait burayı tahkim etti, ardından oğlu Muhammed. Baithiyunlar, Utaib ibn Amr ibn Wahb ibn Wahb ibn Afsa ibn Da'ami ibn Da'ami ibn Judayla ibn Asad ibn Rabi'ah'ın soyundan geliyordu; diğer adıyla 'Utaib ibn 'Awf ibn Sinan'. 234 Hicri yılında kaçtı. Al-Tabari, kaçışını haberleştirdi {cite:tabari-history-abu-al-fadl j. 9, s.164}."
  id: "Muhammad ibn al-Ba'ith ibn Halbas, penguasa Marand di Azerbaijan; ia memperkuatnya, membangun istana di sana, dan menentang kekhalifahan al-Mutawakkil. Bana al-Saghir, mantan Komandan Orang Beriman, melawannya hingga ia berhasil menaklukkannya dan membawanya ke rahasia siapa pun yang melihatnya. Ia merobohkan tembok dan istana Marand di al-Baladhuri. Kakeknya Halbas Abu al-Ba'ith Marand tinggal, kemudian al-Ba'ith memperkuatnya, lalu putranya Muhammad. Keluarga Baithiyun adalah keturunan Utaib ibn Amr ibn Wahb ibn Afsa ibn Da'ami ibn Da'ami ibn Judayla ibn Asad ibn Rabi'ah, juga disebut 'Utaib ibn 'Awf ibn Sinan. Ia melarikan diri pada tahun 234 H. Al-Tabari menyebutkan kabar pelariannya {cite:Tabari-history-abu-al-Fadl J.9, hlm.164}."
