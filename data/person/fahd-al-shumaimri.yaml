summary:
  ar: "رجل أعمال وكاتب سعودي، وُلد في مكة المكرمة سنة 1390هـ ⁦(1970م)⁩، أسّس شبكة المجد الفضائية ذات التوجه الإسلامي وكان رئيس مجلس إدارتها ورئيسها التنفيذي عشر سنوات، وفي عهده تأسست قناة المجد العلمية وغيرها من قنوات الباقة، ثم باع حصته كاملة في المشروع سنة 2009."
  en: "Saudi businessman and writer, born in Makkah in 1390 AH (1970). He founded the Islamic-oriented Al-Majd satellite network and was its chairman of the board and chief executive for ten years; the Al-Majd Scientific Channel and the bouquet's other channels were founded in his tenure, and he sold his entire stake in the project in 2009."
  ur: "سعودی کاروباری شخصیت اور مصنف، جو 1390ھ (1970) میں مکہ مکرمہ میں پیدا ہوئے؛ انہوں نے اسلامی رجحان کے حامل المجد سیٹلائٹ نیٹ ورک کی بنیاد رکھی اور دس سال اس کے چیئرمین اور چیف ایگزیکٹو رہے؛ ان کے دور میں المجد العلمية سمیت بکے کے دیگر چینلز قائم ہوئے، اور 2009 میں انہوں نے منصوبے میں اپنا پورا حصہ فروخت کر دیا۔"
  es: "Empresario y escritor saudí, nacido en La Meca en 1390 AH (1970). Fundó la cadena de televisión por satélite Al-Majd, de orientación islámica, y fue su presidente del consejo de administración y director ejecutivo durante diez años; el Canal Científico Al-Majd y los demás canales del paquete se fundaron durante su gestión, y vendió la totalidad de su participación en el proyecto en 2009."
  fr: "Homme d'affaires et écrivain saoudien, né à La Mecque en 1390 AH (1970). Il a fondé le réseau satellitaire Al-Majd à vocation islamique et en a été le président du conseil d'administration et le directeur général pendant dix ans; la chaîne scientifique Al-Majd et les autres chaînes du bouquet ont été créées pendant son mandat, et il a vendu la totalité de sa participation dans le projet en 2009."
  tr: "1390 Hicri (1970 AD) yılında Mekke'de doğan Suudi iş insanı ve yazar olan Suud, İslami yönelimli Al-Majd uydu ağını kurdu ve on yıl boyunca başkan ve CEO olarak görev yaptı. Görev süresi boyunca Al-Majd Bilimsel Kanalı ve diğer Al-Baqa kanalları kuruldu, ardından 2009'da projedeki tüm hissesini sattı."
  id: "Seorang pengusaha dan penulis Saudi, lahir di Mekah pada tahun 1390 H (1970 M), ia mendirikan jaringan satelit Al-Majd dengan orientasi Islam dan menjabat sebagai ketua serta CEO selama sepuluh tahun. Selama masa jabatannya, Al-Majd Scientific Channel dan saluran Al-Baqa lainnya didirikan, kemudian ia menjual seluruh sahamnya di proyek tersebut pada tahun 2009."
