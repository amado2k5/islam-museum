summary:
  ar: "رجل أعمال وكاتب سعودي، وُلد في مكة المكرمة سنة 1390هـ (1970م)، أسّس شبكة المجد الفضائية ذات التوجه الإسلامي وكان رئيس مجلس إدارتها ورئيسها التنفيذي عشر سنوات، وفي عهده تأسست قناة المجد العلمية وغيرها من قنوات الباقة، ثم باع حصته كاملة في المشروع سنة 2009."
  en: "Saudi businessman and writer, born in Makkah in 1390 AH (1970). He founded the Islamic-oriented Al-Majd satellite network and was its chairman of the board and chief executive for ten years; the Al-Majd Scientific Channel and the bouquet's other channels were founded in his tenure, and he sold his entire stake in the project in 2009."
  ur: "سعودی کاروباری شخصیت اور مصنف، جو 1390ھ (1970) میں مکہ مکرمہ میں پیدا ہوئے؛ انہوں نے اسلامی رجحان کے حامل المجد سیٹلائٹ نیٹ ورک کی بنیاد رکھی اور دس سال اس کے چیئرمین اور چیف ایگزیکٹو رہے؛ ان کے دور میں المجد العلمية سمیت بکے کے دیگر چینلز قائم ہوئے، اور 2009 میں انہوں نے منصوبے میں اپنا پورا حصہ فروخت کر دیا۔"
