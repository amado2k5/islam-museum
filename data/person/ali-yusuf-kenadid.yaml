summary:
  ar: "علي يوسف كيناديد (توفي في مقديشو، انظر خلاف تاريخ وفاته في البيانات)، ثاني سلاطين هوبيو وآخرهم. هو ابن مؤسس السلطنة يوسف علي كيناديد وأخو عثمان يوسف كيناديد مخترع الخط العثماني للغة الصومالية. كان ولي عهد والده، فنُفي معه إلى عدن ثم إريتريا حين ساءت علاقة والده بإيطاليا بعد رفضه إنزال قوة بريطانية في السلطنة لمطاردة الدراويش. خلف والده عند وفاته سنة 1911، وتُوّج في 5 أكتوبر من تلك السنة بحسب مقالته، وحكم من 28 سبتمبر 1911 إلى 1925، حين أنهت حملة إيطاليا على السلطنات حكمه، ودُمجت هوبيو في الصومال الإيطالي سنة 1927 فانتهت السلطنة. لا يذكر أي مصدر مقروء تاريخ ميلاده، وفي سنة وفاته خلاف بين مصادر مقالته نفسها (1927 في المتن و1936 في صندوق المعلومات استنادا إلى صفحة قبره)، والخط الزمني في قائمة الحصاد (1880-1940) لا يؤيده أي مصدر."
  en: "Ali Yusuf Kenadid (died at Mogadishu; see the death-date conflict in his data), second and last Sultan of Hobyo. He was a son of the sultanate's founder, Yusuf Ali Kenadid, and a brother of Osman Yusuf Kenadid, inventor of the Osmanya script for Somali. As his father's heir apparent he was exiled with him to Aden and then Eritrea when the elder Kenadid's relations with Italy soured over his refusal to let a British contingent land in the sultanate to pursue the Dervishes. He succeeded his father on his death in 1911, was crowned on 5 October of that year according to his article, and reigned from 28 September 1911 to 1925, when Italy's Campaign of the Sultanates ended his rule; Hobyo was integrated into Italian Somaliland in 1927 and the sultanate ceased to exist. No source read gives his birth date, and his own article's sources disagree on his death year (1927 in its lead, 1936 in its infobox on the authority of a page about his tomb); the harvest queue's dates for him (1880–1940) are attested by no source read."
  ur: "علی یوسف کینادید (وفات مقدیشو؛ تاریخ وفات کے اختلاف کے لیے اعداد و شمار دیکھیں)، ہوبیو کے دوسرے اور آخری سلطان۔ وہ سلطنت کے بانی یوسف علی کینادید کے بیٹے اور صومالی کے عثمانیہ رسم الخط کے موجد عثمان یوسف کینادید کے بھائی تھے۔ ولی عہد کی حیثیت سے والد کے ساتھ عدن پھر اریٹریا جلا وطن ہوئے جب درویشوں کے تعاقب کے لیے برطانوی دستے کو اترنے کی اجازت سے والد کے انکار پر اٹلی سے تعلقات بگڑ گئے۔ 1911ء میں والد کے جانشین بنے اور 28 ستمبر 1911ء سے 1925ء تک حکمران رہے، جب اٹلی کی مہم نے ان کا دور ختم کیا اور 1927ء میں ہوبیو اطالوی صومالی لینڈ میں ضم ہو گئی۔ کسی مأخذ میں ان کی تاریخ پیدائش نہیں ملتی اور ان کی وفات کے سال میں ان کے اپنے مضمون کے مآخذ میں اختلاف ہے (متن میں 1927ء، صندوق اطلاعات میں قبر کے صفحے کے حوالے سے 1936ء)۔"
