summary:
  ar: "علي يوسف كيناديد ⁦(توفي في مقديشو، انظر خلاف تاريخ وفاته في البيانات)⁩، ثاني سلاطين هوبيو وآخرهم. هو ابن مؤسس السلطنة يوسف علي كيناديد وأخو عثمان يوسف كيناديد مخترع الخط العثماني للغة الصومالية. كان ولي عهد والده، فنُفي معه إلى عدن ثم إريتريا حين ساءت علاقة والده بإيطاليا بعد رفضه إنزال قوة بريطانية في السلطنة لمطاردة الدراويش. خلف والده عند وفاته سنة 1911، وتُوّج في 5 أكتوبر من تلك السنة بحسب مقالته، وحكم من 28 سبتمبر 1911 إلى 1925، حين أنهت حملة إيطاليا على السلطنات حكمه، ودُمجت هوبيو في الصومال الإيطالي سنة 1927 فانتهت السلطنة. لا يذكر أي مصدر مقروء تاريخ ميلاده، وفي سنة وفاته خلاف بين مصادر مقالته نفسها ⁦(1927 في المتن و1936 في صندوق المعلومات استنادا إلى صفحة قبره)⁩، والخط الزمني في قائمة الحصاد (1880-1940) لا يؤيده أي مصدر."
  en: "Ali Yusuf Kenadid (died at Mogadishu; see the death-date conflict in his data), second and last Sultan of Hobyo. He was a son of the sultanate's founder, Yusuf Ali Kenadid, and a brother of Osman Yusuf Kenadid, inventor of the Osmanya script for Somali. As his father's heir apparent he was exiled with him to Aden and then Eritrea when the elder Kenadid's relations with Italy soured over his refusal to let a British contingent land in the sultanate to pursue the Dervishes. He succeeded his father on his death in 1911, was crowned on 5 October of that year according to his article, and reigned from 28 September 1911 to 1925, when Italy's Campaign of the Sultanates ended his rule; Hobyo was integrated into Italian Somaliland in 1927 and the sultanate ceased to exist. No source read gives his birth date, and his own article's sources disagree on his death year (1927 in its lead, 1936 in its infobox on the authority of a page about his tomb); the harvest queue's dates for him (1880–1940) are attested by no source read."
  ur: "علی یوسف کینادید ⁦(وفات مقدیشو؛ تاریخ وفات کے اختلاف کے لیے اعداد و شمار دیکھیں)⁩، ہوبیو کے دوسرے اور آخری سلطان۔ وہ سلطنت کے بانی یوسف علی کینادید کے بیٹے اور صومالی کے عثمانیہ رسم الخط کے موجد عثمان یوسف کینادید کے بھائی تھے۔ ولی عہد کی حیثیت سے والد کے ساتھ عدن پھر اریٹریا جلا وطن ہوئے جب درویشوں کے تعاقب کے لیے برطانوی دستے کو اترنے کی اجازت سے والد کے انکار پر اٹلی سے تعلقات بگڑ گئے۔ 1911ء میں والد کے جانشین بنے اور 28 ستمبر 1911ء سے 1925ء تک حکمران رہے، جب اٹلی کی مہم نے ان کا دور ختم کیا اور 1927ء میں ہوبیو اطالوی صومالی لینڈ میں ضم ہو گئی۔ کسی مأخذ میں ان کی تاریخ پیدائش نہیں ملتی اور ان کی وفات کے سال میں ان کے اپنے مضمون کے مآخذ میں اختلاف ہے ⁦(متن میں 1927ء، صندوق اطلاعات میں قبر کے صفحے کے حوالے سے 1936ء)⁩۔"
  es: "Ali Yusuf Kenadid (fallecido en Mogadiscio; véase la discrepancia en la fecha de su muerte en sus datos), segundo y último sultán de Hobyo. Era hijo del fundador del sultanato, Yusuf Ali Kenadid, y hermano de Osman Yusuf Kenadid, inventor de la escritura osmanya para el somalí. Como heredero aparente de su padre, fue exiliado con él a Adén y luego a Eritrea cuando las relaciones del anciano Kenadid con Italia se deterioraron debido a su negativa a permitir que un contingente británico desembarcara en el sultanato para perseguir a los derviches. Sucedió a su padre tras su muerte en 1911, fue coronado el 5 de octubre de ese año según su artículo y reinó desde el 28 de septiembre de 1911 hasta 1925, cuando la Campaña de los Sultanatos de Italia puso fin a su mandato; Hobyo se integró en la Somalia italiana en 1927 y el sultanato dejó de existir. Ninguna fuente consultada indica su fecha de nacimiento, y las fuentes de su propio artículo discrepan sobre el año de su muerte (1927 en la introducción, 1936 en el recuadro informativo, según una página sobre su tumba); las fechas que aparecen en la lista de espera para su muerte (1880-1940) no están respaldadas por ninguna fuente consultada."
  fr: "Ali Yusuf Kenadid (décédé à Mogadiscio; voir la divergence concernant la date de son décès dans les données biographiques) fut le deuxième et dernier sultan de Hobyo. Fils du fondateur du sultanat, Yusuf Ali Kenadid, il était le frère d'Osman Yusuf Kenadid, inventeur de l'alphabet osmanya pour le somali. Héritier présomptif de son père, il fut exilé avec lui à Aden, puis en Érythrée, lorsque les relations de Kenadid père avec l'Italie se détériorèrent suite à son refus d'autoriser un contingent britannique à débarquer dans le sultanat pour poursuivre les derviches. Il succéda à son père à sa mort en 1911, fut couronné le 5 octobre de la même année, selon sa biographie, et régna du 28 septembre 1911 à 1925, date à laquelle la campagne italienne contre les sultanats mit fin à son règne. Hobyo fut intégré à la Somalie italienne en 1927 et le sultanat cessa d'exister. Aucune source consultée ne donne sa date de naissance, et les sources de son propre article divergent quant à son année de décès (1927 dans son introduction, 1936 dans son encadré d'information se basant sur une page concernant sa tombe); les dates de la file d'attente des récoltes le concernant (1880-1940) ne sont attestées par aucune source consultée."
  tr: "Ali Yusuf Kinnadid (Mogadişu'da öldü; ölüm tarihi farklı olarak belirtilmiştir), Hubyo sultanlarının ikinci ve sonuncusuydu. Sultanlığın kurucusu Yusuf Ali Kinnadid'in oğlu ve Osmanlı alfabesinin Somali dilini icat eden Osman Yusuf Kinnadid'in kardeşiydi. Babası taç prensi olduğundan, babasının İtalya ile ilişkileri bozulduğunda, babası dervişleri takip etmek için İngiliz kuvveti göndermeyi reddedince onunla birlikte Aden'e, ardından Eritre'ye sürgün edildi. 1911'de babasının ölümünden sonra onun yerine geçti ve makalesine göre o yılın 5 Ekim'inde taç giydi. 28 Eylül 1911'den 1925'e kadar hüküm sürdü; İtalya'nın sultanlıklara karşı yürüttüğü kampanya yönetimini sona erdirdi ve Hubio 1927'de İtalyan Somalisi'ne katılarak sultanlığı sona erdirdi. Güvenilir bir kaynak doğum tarihinden bahsetmemekte ve ölüm yılı, kendi makalesinin kaynakları arasında (ana metinde 1927 ve mezar sayfasına dayanan bilgi kutusunda 1936) tartışmalıdır; hasat listesindeki zaman çizelgesi (1880-1940) ise herhangi bir kaynakla desteklenmemektedir."
  id: "Ali Yusuf Kinnadid (meninggal di Mogadishu; lihat tanggal kematian berbeda dalam pernyataan), sultan Hubyo kedua dan terakhir. Ia adalah putra pendiri Kesultanan, Yusuf Ali Kinnadid, dan saudara dari Uthman Yusuf Kinnadid, penemu aksara Ottoman untuk bahasa Somalia. Ia adalah putra mahkota ayahnya, sehingga ia diasingkan bersamanya ke Aden dan kemudian ke Eritrea ketika hubungan ayahnya dengan Italia memburuk setelah ia menolak mengirim pasukan Inggris ke Kesultanan untuk mengejar para derwish. Ia menggantikan ayahnya setelah kematiannya pada tahun 1911 dan dinobatkan pada 5 Oktober tahun itu menurut artikelnya. Ia memerintah dari 28 September 1911 hingga 1925, ketika kampanye Italia melawan kesultanan mengakhiri pemerintahannya, dan Hubio dimasukkan ke dalam Somalia Italia pada tahun 1927, mengakhiri kesultanan. Tidak ada sumber yang dapat dipercaya yang menyebutkan tanggal lahirnya, dan tahun kematiannya diperdebatkan di antara sumber artikelnya sendiri (1927 di teks utama dan 1936 di infobox berdasarkan halaman makamnya), dan garis waktu dalam daftar panen (1880-1940) tidak didukung oleh sumber mana pun."
