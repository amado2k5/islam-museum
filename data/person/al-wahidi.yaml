summary:
  ar: "الشيخ الإمام أبو الحسن علي بن أحمد الواحدي المفسر المتوفى سنة ٤٦٨هـ؛ كتابه أسباب النزول أشهر ما صنف فيه، واختصره برهان الدين إبراهيم بن عمر الجعبري {cite:kashf-zunun-furqan p. 381}."
  en: "Abu al-Hasan Ali ibn Ahmad al-Wahidi, d. AH 468 — the mufassir whose Asbab al-Nuzul is 'the most famous composed in the genre' {cite:kashf-zunun-furqan p. 381}."
  fr: "Abu al-Hasan Ali ibn Ahmad al-Wahidi, mort en 468 H – le moufassir dont Asbab al-Nuzul est « le plus célèbre composé du genre » {cite:kashf-zunun-furqan p. 381}."
  es: "Abu al-Hasan Ali ibn Ahmad al-Wahidi, m. 468 H.H.: el mufassir cuyo Asbab al-Nuzul es 'la composición más famosa del género' {citar:kashf-zunun-furqan p. 381}."
  ur: "ابو الحسن علی ابن احمد الواحیدی، د. 468ھ - مفسر جس کی اصباب النزول 'نوع میں سب سے زیادہ مشہور تالیف ہے'۔ 381}۔"
  tr: "468 H.M. yılında vefat eden tefsir Şeyh İmam Ebu el-Hasan Ali ibn Ahmed al-Wahidi; 'Asbab al-Nuzul' adlı kitabı en ünlü eseridir ve Burhan al-Din İbrahim ibn Ömer el-Ca'bari tarafından kısaltılmıştır {kaynak: kaşf-zunun-furqan, s. 381}."
  id: "Sheikh Imam Abu al-Hasan Ali ibn Ahmad al-Wahidi, ahli tafsir, yang meninggal pada tahun 468 H; bukunya 'Asbab al-Nuzul' adalah karya paling terkenal yang ia tulis, dan diringkas oleh Burhan al-Din Ibrahim ibn Umar al-Ja'bari {cite:kashf-zunun-furqan, hlm. 381}."
