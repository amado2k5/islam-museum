summary:
  en: "A Meccan nobleman of Banu Amir ibn Lu'ayy who witnessed the Treaty of al-Hudaybiyya on Quraysh's side; he embraced Islam at the conquest of Mecca, was granted one hundred camels at al-Ji'rana among al-Mu'allafa Qulubuhum, and lived to a very advanced age."
  ar: "شريف قرشي من بني عامر بن لؤي شهد صلح الحديبية مع قريش؛ أسلم عام فتح مكة وأعطاه النبي مئة من الإبل بالجعرانة في المؤلفة قلوبهم، وعُمّر حتى تجاوز مائة سنة."
  ur: "بنو عامر بن لوی کا مکی سردار جو حدیبیہ معاہدے میں قریش کی طرف موجود تھا؛ فتح مکہ پر مسلمان ہوا۔"
