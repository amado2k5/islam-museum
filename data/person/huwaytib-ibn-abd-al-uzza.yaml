summary:
  en: "A Meccan nobleman of Banu Amir ibn Lu'ayy who witnessed the Treaty of al-Hudaybiyya on Quraysh's side; he embraced Islam at the conquest of Mecca, was granted one hundred camels at al-Ji'rana among al-Mu'allafa Qulubuhum, and lived to a very advanced age."
  ar: "شريف قرشي من بني عامر بن لؤي شهد صلح الحديبية مع قريش؛ أسلم عام فتح مكة وأعطاه النبي مئة من الإبل بالجعرانة في المؤلفة قلوبهم، وعُمّر حتى تجاوز مائة سنة."
  ur: "بنو عامر بن لوی کا مکی سردار جو حدیبیہ معاہدے میں قریش کی طرف موجود تھا؛ فتح مکہ پر مسلمان ہوا۔"
  es: "Un noble mecano de Banu Amir ibn Lu'ayy que presenció el Tratado de al-Hudaybiyya del lado de los Quraysh; abrazó el Islam en la conquista de La Meca, recibió cien camellos en al-Ji'rana entre al-Mu'allafa Qulubuhum y vivió hasta una edad muy avanzada."
  fr: "Un noble mecquois de Banu Amir ibn Lu'ayy qui a été témoin du traité d'al-Hudaybiyya du côté de Quraysh; il embrassa l'islam lors de la conquête de La Mecque, reçut cent chameaux à al-Ji'rana parmi al-Mu'allafa Qulubuhum, et vécut jusqu'à un âge très avancé."
  tr: "Banu Emir bin Lu'eyy'den Şerif Kuraşi, Kureyş ile Hudeybiye Antlaşması'na tanıklık etti; Mekke'nin fethi yılında İslam'ı benimsedi ve Peygamber ona 'Ja'ranah'ta yüz deve verdi, bu da kalplerini barıştırdı ve yüz yılı aşana kadar yaşadı."
  id: "Sharif Qurashi dari Banu Amir ibn Lu'ayy menyaksikan Perjanjian Hudaybiyyah dengan Quraisy; ia memeluk Islam pada tahun penaklukan Mekah, dan Nabi memberinya seratus unta dalam 'Ja'ranah, yang mendamaikan hati mereka, dan hidup hingga ia melewati seratus tahun."
