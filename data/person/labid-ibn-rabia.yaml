    ar: "لبيد بن ربيعة شاعر مخضرم من بني كلاب قال الشعر في الجاهلية ثم أسلم؛ جاء أن أصدق كلمة قالها الشاعر كلمة لبيد، ونزل الكوفة حتى مات."
    en: "Labid ibn Rabi'a, the celebrated Mukhadram poet of Banu Kilab, versified through the jahiliyya then embraced Islam; the truest word a poet spoke is said to be Labid's — he settled in Kufa until death."
