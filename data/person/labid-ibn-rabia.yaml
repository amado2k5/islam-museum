summary:
  ar: شاعر مخضرم مشهور من بني كلاب، قال الشعر في الجاهلية دهراً ثم أسلم، ونزل الكوفة حتى مات؛ جاء في الحديث أن أصدق كلمة قالها الشاعر كلمة لبيد، واختُلف في سنة وفاته وفي عمره.
  en: A celebrated poet who lived in both eras, of the Banu Kilab; he composed in the pre-Islamic period for a long time, then embraced Islam and settled in Kufa until his death. A hadith calls his line the truest word a poet ever spoke; his
    date of death and his age are disputed.
