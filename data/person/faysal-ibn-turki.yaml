summary:
  ar: "فيصل بن تركي بن عبد الله بن محمد بن سعود (ت ١٨٦٥م)؛ من أمراء نجد. ثار على مشاري بن عبد الرحمن سنة ١٢٤٩هـ وقتله وتولى الإمارة فسار سيرة حسنة وجعل تخت الإمارة في الرياض، وظلت نجد مضطربة فخرج عليه ابن عمه خالد بن سعود في عسكر مصر وقبض عليه خالد في قلعة الخرج بعد حروب ووقائع كثيرة وسيّر إلى مصر سنة ١٢٥٠هـ فأقام سجيناً إلى سنة ١٢٥٩هـ وفرّ من سجنه فعاد إلى نجد فدانت له إلى أن توفي بالرياض {cite:al-aalam tarjama}."
  en: "Faysal ibn Turki (d. 1865 CE) — the Saudi amir who made Riyadh the seat of the emirate: captured by Egyptian forces at al-Kharj, imprisoned in Egypt 1250–1259 AH, escaped and ruled Najd until his death {cite:al-aalam tarjama}."
