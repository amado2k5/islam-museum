summary:
  ar: "فيصل بن تركي بن عبد الله بن محمد بن سعود ⁦(ت ١٨٦٥م)⁩؛ من أمراء نجد. ثار على مشاري بن عبد الرحمن سنة ١٢٤٩هـ وقتله وتولى الإمارة فسار سيرة حسنة وجعل تخت الإمارة في الرياض، وظلت نجد مضطربة فخرج عليه ابن عمه خالد بن سعود في عسكر مصر وقبض عليه خالد في قلعة الخرج بعد حروب ووقائع كثيرة وسيّر إلى مصر سنة ١٢٥٠هـ فأقام سجيناً إلى سنة ١٢٥٩هـ وفرّ من سجنه فعاد إلى نجد فدانت له إلى أن توفي بالرياض {cite:al-aalam tarjama}."
  en: "Faysal ibn Turki (d. 1865 CE) — the Saudi amir who made Riyadh the seat of the emirate: captured by Egyptian forces at al-Kharj, imprisoned in Egypt 1250–1259 AH, escaped and ruled Najd until his death {cite:al-aalam tarjama}."
  es: "Faysal ibn Turki (m. 1865 d. C.) — el emir saudí que convirtió a Riad en la sede del emirato: capturado por las fuerzas egipcias en al-Kharj, encarcelado en Egipto entre 1250 y 1259 AH, escapó y gobernó Najd hasta su muerte {cite:al-aalam tarjama}."
  fr: "Faysal ibn Turki (décédé en 1865 CE) — l'émir saoudien qui fit de Riyad le siège de l'émirat: capturé par les forces égyptiennes à al-Kharj, emprisonné en Égypte de 1250 à 1259 AH, s'échappa et régna sur le Najd jusqu'à sa mort {cite:al-aalam tarjama}."
  ur: "فیصل ابن ترکی ⁦(متوفی 1865 عیسوی)⁩ - سعودی امیر جس نے ریاض کو امارت کا تختہ بنایا: الخرج کے مقام پر مصری افواج کے ہاتھوں پکڑا گیا، مصر میں قید 1250-1259 ہجری، فرار ہو گیا اور اپنی موت تک نجد پر حکومت کرتا رہا۔"
  tr: "Faysal bin Turki bin Abdullah bin Muhammed bin Saud (ö. 1865); Necd prenslerinden biriydi. 1249 Hicri'de Mishari bin Abdulrahman'a karşı isyan etti, onu öldürdü ve emirliği devraldı. İyi bir üne sahip oldu ve Riyad'da emirlik tahtını kurdu. Najd çalkantılı kaldı, bu yüzden kuzeni Halid bin Suud, Mısır ordusunda ona karşı isyan etti ve Halid birçok savaş ve olaydan sonra onu Al-Kharj kalesinde yakaladı. 1250 Hicri'de Mısır'a gitti, burada 1259 H.C.'ye kadar hapis kaldı, ardından hapishanesinden kaçtı ve Necd'e döndü ve Riyad'da ölene kadar itaatkâr kaldı."
  id: "Faisal bin Turki bin Abdullah bin Muhammad bin Saud (wafat 1865 M); salah satu pangeran Najd. Ia memberontak melawan Mishari bin Abdul Rahman pada tahun 1249 H, membunuhnya, dan mengambil alih emirat tersebut. Ia memiliki reputasi baik dan mendirikan tahta emirat di Riyadh. Najd tetap bergolak, sehingga sepupunya Khalid bin Saud memberontak melawannya di tentara Mesir, dan Khalid menangkapnya di benteng Al-Kharj setelah banyak pertempuran dan peristiwa. Ia pergi ke Mesir pada tahun 1250 H, di mana ia tetap dipenjara hingga 1259 H, lalu melarikan diri dari penjaranya, kembali ke Najd, di mana ia tunduk hingga meninggal di Riyadh {cite:al-aalam tarjama}."
