summary:
  ar: "مهاجم سعودي معتزل، وُلد سنة 1982. بدأ مع القادسية ثم انتقل إلى الهلال سنة 2005 وقاده سنوات طويلة، مع إعارة إلى العين الإماراتي (2011–2012)، واعتزل سنة 2018. كان قائد منتخب السعودية، وخاض 108 مباريات دولية سجل فيها 42 هدفًا، واختير أفضل لاعب في آسيا سنة 2007 بعد قيادته المنتخب إلى نهائي كأس آسيا."
  en: "Saudi Arabian former professional footballer (forward), born in 1982. He began at Al-Qadsiah, moved to Al-Hilal in 2005 and played there until 2018 apart from a loan season at Al Ain in the Emirates (2011–2012). He captained Saudi Arabia, won 108 caps and scored 42 goals, and was named Asian Footballer of the Year in 2007 after leading his country to the AFC Asian Cup final."
  ur: "سعودی سابق پیشہ ور فٹبالر (فارورڈ)، 1982 میں پیدا ہوئے۔ انہوں نے القادسیہ سے آغاز کیا، 2005 میں الہلال منتقل ہوئے اور 2018 تک وہیں کھیلے، سوائے العین (متحدہ عرب امارات) میں ایک قرض سیزن (2011–2012) کے۔ وہ سعودی عرب کے کپتان رہے، 108 بین الاقوامی میچوں میں 42 گول کیے، اور 2007 میں اپنے ملک کو اے ایف سی ایشین کپ فائنل تک پہنچانے پر ایشیا کے بہترین فٹبالر قرار پائے۔"
