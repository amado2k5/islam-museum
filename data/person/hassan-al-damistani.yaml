summary:
  ar: "حسن بن محمد بن علي بن خلف الدمستاني، فاضل إمامي من أهل دمستان في البحرين، انتقل إلى القطيف وتوفي بها سنة 1181 هـ، من كتبه «انتخاب الجيد من تنبيهات السيد»."
  en: "Hasan ibn Muhammad ibn Ali ibn Khalaf al-Damistani, an Imami scholar from Damistan in Bahrain who moved to al-Qatif and died there in 1181 AH, author of 'Intikhab al-Jayyid min Tanbihat al-Sayyid'."
  es: "Hasan ibn Muhammad ibn Ali ibn Khalaf al-Damistani, un erudito Imami de Damistán en Bahrein que se mudó a al-Qatif y murió allí en 1181 AH, autor de 'Intikhab al-Jayyid min Tanbihat al-Sayyid'."
  fr: "Hasan ibn Muhammad ibn Ali ibn Khalaf al-Damistani, un érudit Imami du Damistan à Bahreïn qui a déménagé à al-Qatif et y est mort en 1181 AH, auteur de « Intikhab al-Jayyid min Tanbihat al-Sayyid »."
  ur: "حسن بن محمد بن علی ابن خلف الدمستانی، بحرین کے دمستان سے تعلق رکھنے والے ایک امامی عالم جو القطیف چلے گئے اور وہاں 1181 ہجری میں وفات پائی، 'انتخاب الجیید من تنبیہات السید' کے مصنف۔"
  tr: "Bahreyn'in Damistan kentinden İmam alimi Hasan ibn Muhammed ibn Ali ibn Halef el-Damstani, Katif'e taşındı ve 1181 Hicri'de orada öldü. Kitapları arasında 'Ankhāb al-Jayd min Tanbihat al-Sayyid' de bulunmaktadır."
  id: "Hasan ibn Muhammad ibn Ali ibn Khalaf al-Damstani, seorang ulama Imami dari Damistan di Bahrain, pindah ke Qatif dan meninggal di sana pada tahun 1181 H. Di antara bukunya adalah 'Ankhāb al-Jayd min Tanbihat al-Sayyid'."
