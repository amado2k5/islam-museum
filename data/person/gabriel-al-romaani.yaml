summary:
  ar: "داعية ومدرّس روماني المولد: وُلد لأسرة مسيحية في رومانيا، وهاجر إلى كندا سنة 1998 واعتنق الإسلام سنة 2003، وشارك في تأسيس منظمة ICRAA الدعوية، وينشر محاضراته على الإنترنت منذ 2007؛ وهو مؤلف كتاب «يوميات مسلم جديد»."
  en: "Romanian-born dawah speaker and teacher: born to a Christian family in Romania, he migrated to Canada in 1998 and converted to Islam in 2003, co-founded the ICRAA da'wah organisation, and has published his lectures online since 2007; he is the author of Journal of a New Muslim."
  ur: "رومانیہ میں پیدا ہونے والے داعی اور مدرس: ایک مسیحی خاندان میں پیدا ہوئے، 1998 میں کینیڈا ہجرت کی اور 2003 میں اسلام قبول کیا، دعوتی تنظیم ICRAA کی تاسیس میں شریک ہوئے، اور 2007 سے اپنے خطبات آن لائن شائع کر رہے ہیں؛ وہ کتاب Journal of a New Muslim کے مصنف ہیں۔"
  es: "Orador y maestro de dawah nacido en Rumania: nació en una familia cristiana en Rumania, emigró a Canadá en 1998 y se convirtió al Islam en 2003, cofundó la organización de da'wah ICRAA y ha publicado sus conferencias en línea desde 2007; es autor de Journal of a New Muslim."
  fr: "Prédicateur et enseignant de da'wa d'origine roumaine: né dans une famille chrétienne en Roumanie, il a immigré au Canada en 1998 et s'est converti à l'islam en 2003, a cofondé l'organisation de da'wa ICRAA et publie ses conférences en ligne depuis 2007; il est l'auteur du Journal d'un nouveau musulman."
  tr: "Romanya doğumlu bir vaiz ve öğretmen: Romanya'da Hristiyan bir ailede doğmuş, 1998'de Kanada'ya göç etmiş ve 2003'te İslam'a geçmiştir. ICRAA savunuculuk organizasyonunun kurulmasına katılmış ve 2007'den beri derslerini çevrimiçi yayımlamaktadır; \"Yeni Bir Müslümanın Günlüğü\" adlı kitabın yazarıdır."
  id: "Seorang pengkhotbah dan guru yang lahir di Rumania: lahir dalam keluarga Kristen di Rumania, ia berimigrasi ke Kanada pada tahun 1998 dan memeluk Islam pada tahun 2003. Ia berpartisipasi dalam pendirian organisasi advokasi ICRAA dan telah mempublikasikan kuliahnya secara daring sejak 2007; ia adalah penulis buku \"Diary of a New Muslim.\""
