summary:
  ar: "رسّام فرنسي استشراقي ⁦(باريس 1861 – باريس 24 ديسمبر 1929)⁩، زار بوسعادة في الجزائر منذ 1884 واستقر فيها منذ مطلع القرن العشرين، وأعلن إسلامه في رسالة خاصة سنة 1908 وأتمّه رسميًا سنة 1913 متسمّيًا ناصر الدين، وحجّ سنة 1929 قبل وفاته بأشهر، ودُفن في مقبرة المسلمين في بوسعادة بحسب وصيته."
  en: "French Orientalist painter (Paris 1861 – Paris, 24 December 1929). He first visited Bou Saâda in Algeria in 1884 and settled there from the early twentieth century, announced his conversion to Islam in a private letter in 1908 and completed it formally in 1913 under the name Nasr ad-Din, made the Hajj in 1929 a few months before his death, and was buried in the Muslim cemetery of Bou Saâda at his own request."
  ur: "فرانسیسی مستشرقانہ مصور ⁦(پیرس 1861 – پیرس، 24 دسمبر 1929)⁩۔ انھوں نے 1884 میں الجزائر کے بو سعادہ کا پہلا دورہ کیا اور بیسویں صدی کے آغاز سے وہیں مقیم رہے، 1908 میں ایک نجی خط میں اسلام لانے کا اعلان کیا اور 1913 میں ناصر الدین نام کے ساتھ اسے باقاعدہ مکمل کیا، وفات سے چند ماہ پہلے 1929 میں حج کیا، اور اپنی خواہش کے مطابق بو سعادہ کے مسلم قبرستان میں دفن ہوئے۔"
  fr: "Peintre orientaliste français (Paris 1861 – Paris, 24 décembre 1929). Il visita Bou Saâda, en Algérie, pour la première fois en 1884 et s'y fixa dès le début du XXe siècle, annonça sa conversion à l'islam dans une lettre privée en 1908 et l'acheva formellement en 1913 sous le nom de Nasr ad-Din, fit le pèlerinage en 1929 quelques mois avant sa mort et fut inhumé, selon son vœu, dans le cimetière musulman de Bou Saâda."
  es: "Pintor orientalista francés (París 1861 – París, 24 de diciembre de 1929). Visitó por primera vez Bou Saâda, en Argelia, en 1884 y se estableció allí desde principios del siglo XX, anunció su conversión al islam en una carta privada en 1908 y la completó formalmente en 1913 con el nombre de Nasr ad-Din, hizo la peregrinación en 1929 pocos meses antes de morir y fue enterrado, por deseo propio, en el cementerio musulmán de Bou Saâda."
