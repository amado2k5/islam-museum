summary:
  ar: "محمد سيد طنطاوي ⁦(1928–2010)⁩ شيخ الأزهر ⁦(1996–2010)⁩ ومفتي مصر قبلها ⁦(1986–1996)⁩، ترأس أعلى المؤسسات السنية المصرية. أثارت فتاواه في فوائد البنوك والنقاب وخلافه مع البابا شنودة جدلاً؛ وله «التفسير الوسيط» في 15 مجلداً."
  en: "Muhammad Sayyid Tantawy (1928–2010) was Grand Imam of al-Azhar (1996–2010) and before it Grand Mufti of Egypt (1986–1996), heading Egypt's senior Sunni institutions. His fatwas on bank interest and the niqab and his positions drew controversy; his works include the 15-volume tafsir Al-Tafsir al-Wasit."
  ur: "محمد سید طنطاوی ⁦(1928–2010)⁩ شیخ الازہر ⁦(1996–2010)⁩ اور اس سے قبل مصر کے مفتیِ اعظم ⁦(1986–1996)⁩ تھے، مصر کی اعلیٰ سنی اداروں کے سربراہ۔ بینک سود اور نقاب پر ان کے فتویٰ جاتی فیصلوں نے بحث چھڑی؛ تصانیف میں پندرہ جلدوں کی «التفسير الوسيط» شامل ہے۔"
