label: { ar: "مروان بن محمد بن مروان" }
summary:
  ar: "ذكر الطبري خلافة مروان بن محمد {cite:tabari-tarikh-abu-al-fadl j.7 p.664}، وهزيمته بالزاب سنة اثنتين وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.432}، ثم قتله {cite:tabari-tarikh-abu-al-fadl j.7 p.437}. وعند المسعودي أقبل سنة سبع وعشرين ومائة من الجزيرة فدخل دمشق وخرج إبراهيم بن الوليد هارباً ثم ظفر به فقتله وصلبه وقتل عبد العزيز بن الحجاج ويزيد بن خالد القسري وبدأ أمر بني أمية يؤول إلى ضعف {cite:muruj-al-dhahab p. 212}، وبويع بدمشق يوم الاثنين لأربع عشرة ليلة خلت من صفر سنة سبع وعشرين ومائة وقيل دعا لنفسه بحران، وأمه أم ولد يقال لها ريا وقيل طرونة كانت لمصعب بن الزبير ثم لمحمد بن مروان أبيه، ويكنى أبا عبد الملك، وقتل ببوصير من قرى الفيوم في أول سنة اثنتين وثلاثين ومائة والمتنازع في سنه بين ثمان وخمسين وسبعين سنة {cite:muruj-al-dhahab p. 220-221}، وكان أهل حران داره قد امتنعوا سنة عن إزالة لعن أبي تراب من المنابر حين أزيل وقالوا لا صلاة إلا بلعن أبي تراب، ومنعته الموصل من دخولها في هزيمته، وكان قد أمر خادمه إذا قتل أن يضرب رقاب بناته ونسائه {cite:muruj-al-dhahab p. 232-233}، ونسبه ابن النديم إلى مؤدبه الجعد بن درهم الذي أدخله في الزندقة فيقال مروان الجعدي {cite:fihrist-ibn-al-nadim p. 472}"
