    ar: "مروان بن محمد آخر خلفاء بني أمية، هُزم جيشه على الزاب سنة ١٣٢هـ فانتقلت الخلافة إلى العباسيين كما يحقق الطبري."
    en: "Marwan ibn Muhammad, the last Umayyad caliph, saw his army broken at the Zab in 132 AH, when the caliphate passed to the Abbasids, as Tabari records."
    ur: "مروان بن محمد، آخری اموی خلیفہ، جس کا لشکر 132ھ میں زاب پر شکست کھا گیا اور خلافت عباسیوں کو منتقل ہوئی، جیسا کہ طبری لکھتا ہے۔"
