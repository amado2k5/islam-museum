id: person/marwan-ibn-muhammad
education:
  did_you_know:
    ar: "مروان بن محمد آخر خلفاء بني أمية، هُزم جيشه على الزاب سنة ١٣٢هـ فانتقلت الخلافة إلى العباسيين كما يحقق الطبري."
    en: "Marwan ibn Muhammad, the last Umayyad caliph, saw his army broken at the Zab in 132 AH, when the caliphate passed to the Abbasids, as Tabari records."
    ur: "مروان بن محمد، آخری اموی خلیفہ، جس کا لشکر 132ھ میں زاب پر شکست کھا گیا اور خلافت عباسیوں کو منتقل ہوئی، جیسا کہ طبری لکھتا ہے۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/umayyad-birth-to-fall-2006]
class: person
label: { ar: "مروان بن محمد بن مروان" , ur: "مروان بن محمد بن مروان", en: "Marwan ibn Muhammad ibn Marwan", es: "Marwan ibn Muhammad ibn Marwan", fr: "Marwan ibn Muhammad ibn Marwan"}
summary:
  ar: "ذكر الطبري خلافة مروان بن محمد {cite:tabari-tarikh-abu-al-fadl j.7 p.664}، وهزيمته بالزاب سنة اثنتين وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.432}، ثم قتله {cite:tabari-tarikh-abu-al-fadl j.7 p.437}. وعند المسعودي أقبل سنة سبع وعشرين ومائة من الجزيرة فدخل دمشق وخرج إبراهيم بن الوليد هارباً ثم ظفر به فقتله وصلبه وقتل عبد العزيز بن الحجاج ويزيد بن خالد القسري وبدأ أمر بني أمية يؤول إلى ضعف {cite:muruj-al-dhahab p. 212}، وبويع بدمشق يوم الاثنين لأربع عشرة ليلة خلت من صفر سنة سبع وعشرين ومائة وقيل دعا لنفسه بحران، وأمه أم ولد يقال لها ريا وقيل طرونة كانت لمصعب بن الزبير ثم لمحمد بن مروان أبيه، ويكنى أبا عبد الملك، وقتل ببوصير من قرى الفيوم في أول سنة اثنتين وثلاثين ومائة والمتنازع في سنه بين ثمان وخمسين وسبعين سنة {cite:muruj-al-dhahab p. 220-221}، وكان أهل حران داره قد امتنعوا سنة عن إزالة لعن أبي تراب من المنابر حين أزيل وقالوا لا صلاة إلا بلعن أبي تراب، ومنعته الموصل من دخولها في هزيمته، وكان قد أمر خادمه إذا قتل أن يضرب رقاب بناته ونسائه {cite:muruj-al-dhahab p. 232-233}، ونسبه ابن النديم إلى مؤدبه الجعد بن درهم الذي أدخله في الزندقة فيقال مروان الجعدي {cite:fihrist-ibn-al-nadim p. 472}"
  ur: "طبری مروان بن محمد کی خلافت، 132 ہجری میں زاب پر ان کی شکست اور اس کے بعد ان کے قتل کا ذکر کرتے ہیں۔ {cite:umayyad-birth-to-fall-2006}"
  en: "Al-Tabari records Marwan ibn Muhammad's caliphate, his defeat at the Zab in 132 AH and his subsequent killing. {cite:umayyad-birth-to-fall-2006}"
  es: "Al-Tabari narra el califato de Marwan ibn Muhammad, su derrota en el Zab en el año 132 de la Hégira y su posterior asesinato. {cite:umayyad-birth-to-fall-2006}"
  fr: "Al-Tabari relate le califat de Marwan ibn Muhammad, sa défaite au Zab en 132 AH et sa mise à mort. {cite:umayyad-birth-to-fall-2006}"
  tr: "El-Taberi, Mervan bin Muhammed'in halifeliğinden {cite:tabari-tarikh-abu-al-fadl J.7 s.664} ve 132 Hicri yılında El-Zab'daki yenilgisinden bahsetmiş {cite:tabari-tarikh-abu-al-fadl j.7 s.432} ardından onu öldürmüştür {cite:tabari-tarikh-abu-al-fadl j.7 s.437}. El-Mes'udi ile birlikte, yüz yirmi yedinci yılda el-Cezire'den geldi, Şam'a girdi ve İbrahim bin Velid kaçtı, sonra onu yakaladı, öldürdü, çarmıha gerdi ve Abdülaziz ibn el-Haccac ile Yezid ibn Halid el-Kasri'yi öldürdü. Emevi olayı zayıflamaya başladı {atıf:muruj-al-dhahab, s. 212}. Pazartesi günü, Safar'den on dört gece önce, yüz yirmi yedi yıl önce, Şam'da bağlılık yemini etti. Bahran'ı kendisi için çağırdığı söylenir. Annesi Riya adında bir oğlu vardı ve Taruna'nın önce Musab bin Zubeyr'e, sonra Muhammed ibn'e ait olduğu söylenir Mervan, babası Ebu Abd al-Malik olarak bilinir. Fayoum'un köylerinden biri olan Busir'de, 132 H.C. ilk yılında öldürüldü. Elli sekiz ile yetmiş sekiz yaşları arasında tartışma vardı {atıf:muruj-al-dhahab s. 220-221}. Harran halkı, Ebu Turab'ın lanetini vaaz kürsülerinden kaldırmaktan bir yıl boyunca kaçınmış, sadece Ebu Turab'a lanet ederek namaz kıldığını söylemişti. Musul, yenilgisi sırasında onun köye girmesini engelledi. Hizmetkarına, öldürülürse, kızlarının ve eşlerinin boynuna vurmasını emretmişti {atıf: Muruj-al-Dhahab s. 232-233} ve İbn al-Nadim bunu öğretmeni al-Ja'd ibn Dirham'a atfeder; Dirham onu sapkınlığa dahil etmiştir, bu yüzden Marwan al-Jaadi denir {atıf:fihrist-ibn-al-nadim s. 472}"
  id: "Al-Tabari menyebutkan kekhalifahan Marwan ibn Muhammad {cite:tabari-tarikh-abu-al-fadl J.7 hlm.664}, dan kekalahannya di Al-Zab pada tahun 132 H {cite:tabari-tarikh-abu-al-fadl j.7 hlm.432}, lalu membunuhnya {cite:tabari-tarikh-abu-al-fadl j.7 hlm.437}. Bersama al-Mas'udi, ia tiba pada tahun seratus dua puluh tujuh dari al-Jazira, memasuki Damaskus, dan Ibrahim ibn al-Walid melarikan diri, lalu menangkapnya, membunuhnya, menyalibkannya, dan membunuh Abd al-Aziz ibn al-Hajjaj dan Yazid ibn Khalid al-Qasri. Peristiwa Umayyah mulai melemah {cite:muruj-al-dhahab, hlm. 212}. Ia diikrarkan setia di Damaskus pada hari Senin, empat belas malam sebelum Safar, seratus dua puluh tujuh. Konon ia memanggil Bahran untuk dirinya sendiri. Ibunya adalah ibu dari seorang putra bernama Riya, dan dikatakan Taruna milik Mus'ab ibn al-Zubayr, kemudian Muhammad ibn Marwan adalah ayahnya, yang dikenal sebagai Abu Abd al-Malik. Ia dibunuh di Busir, salah satu desa di Fayoum, pada tahun pertama 132 H. Ia diperdebatkan antara usia lima puluh delapan hingga tujuh puluh delapan tahun {cite:muruj-al-dhahab hlm. 220-221}. Orang-orang Harran selama setahun menahan diri untuk tidak menghapus kutukan Abu Turab dari mimbar saat dicabut, dengan alasan tidak ada doa kecuali dengan mengutuk Abu Turab. Mosul mencegahnya masuk ke sana selama kekalahannya. Ia memerintahkan pelayannya, jika terbunuh, untuk memukul leher putri-putri dan istrinya {cite: Muruj-al-Dhahab hlm. 232-233}, dan Ibn al-Nadim mengaitkannya dengan gurunya al-Ja'd ibn Dirham, yang memasukkannya ke dalam bid'ah, demikian dikatakan Marwan al-Jaadi {cite:fihrist-ibn-al-nadim hlm. 472}"
