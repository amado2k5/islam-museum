summary:
  ar: "عمرو بن عبد الله، أبو إسحاق السبيعي، من أئمة التابعين بالكوفة وأثباتهم كما يقول الذهبي في «ميزان الاعتدال»: ولد في أيام عثمان، ورأى علياً وأسامة بن زيد، وقال أبو حاتم: ثقة يشبه الزهري في الكثرة. وهو من المعدودين فيمن تغيّر من الثقات: قيل اختلط، وأنكر الذهبي ذلك وقال: شاخ ونسي ولم يختلط، ويقال إن سماع ابن عيينة منه كان بعد تغيّره. وروى له الشيخان من طريق أصحابه القدماء {cite:mizan-itidal-bijawi-v3 p. 270}{cite:tadrib-rawi-awwama-v5 p. 556-560}."
  en: "Amr ibn Abd Allah, Abu Ishaq al-Sabi'i, one of the leading and most reliable Successors of Kufa, as al-Dhahabi puts it in Mizan al-I'tidal: born in the days of Uthman, he saw Ali and Usama ibn Zayd, and Abu Hatim called him trustworthy, like al-Zuhri in the abundance of his narration. He is counted among the trustworthy men whose memory changed: some said he became confused (ikhtalata), which al-Dhahabi denied, saying he grew old and forgetful but was not confused; Ibn Uyayna's hearing from him is said to date from after the change. Al-Bukhari and Muslim narrate from him through his earlier students."
  fr: "Amr ibn Abd Allah, Abu Ishaq al-Sabi'i, l'un des Successeurs de Koufa les plus éminents et les plus fiables, selon al-Dhahabi dans le Mizan al-I'tidal : né au temps d'Uthman, il vit Ali et Usama ibn Zayd, et Abu Hatim le dit digne de confiance, semblable à al-Zuhri par l'abondance de ses récits. Il est compté parmi les hommes dignes de confiance dont la mémoire changea : certains dirent qu'il devint confus (ikhtalata), ce que nia al-Dhahabi, disant qu'il vieillit et devint oublieux mais ne fut pas confus ; l'audition d'Ibn Uyayna auprès de lui daterait d'après le changement. Al-Bukhari et Muslim rapportent de lui par ses élèves les plus anciens."
  es: "Amr ibn Abd Allah, Abu Ishaq al-Sabi'i, uno de los principales y más fiables sucesores de Kufa, como lo describe al-Dhahabi en Mizan al-I'tidal: nacido en tiempos de Uthman, conoció a Ali y Usama ibn Zayd, y Abu Hatim lo consideró digno de confianza, al igual que al-Zuhri en la abundancia de sus narraciones. Se le cuenta entre los hombres de confianza cuya memoria se vio afectada: algunos decían que se había vuelto confuso (ikhtalata), lo cual al-Dhahabi negó, afirmando que envejeció y se volvió olvidadizo, pero no confuso; se dice que la narración de Ibn Uyayna data de después de este cambio. Al-Bujari y Muslim narran de él a través de sus primeros discípulos."
  ur: "عمرو بن عبد اللہ، ابو اسحاق السبیعی، کوفہ کے سرکردہ اور معتبر جانشینوں میں سے ایک، جیسا کہ الذہبی نے اسے میزان الاعتدال میں لکھا ہے: عثمان کے زمانے میں پیدا ہوئے، انہوں نے علی اور اسامہ بن زید کو دیکھا، اور ابو حاتم نے انہیں الزندر کی طرح ثقہ کہا۔ ان کا شمار ان ثقہ آدمیوں میں ہوتا ہے جن کی یادداشت میں تبدیلی آئی: بعض نے کہا کہ وہ کنفیوز ہو گئے ⁦(اختلتا)⁩، جس کی تردید الذہبی نے کی، اور کہا کہ وہ بوڑھا ہو گیا اور بھول گیا لیکن وہ الجھن میں نہیں رہا۔ ابن عیینہ کی اس سے سماع تبدیلی کے بعد کی بتائی جاتی ہے۔ بخاری اور مسلم نے ان سے اپنے پہلے شاگردوں سے روایت کی ہے۔"
