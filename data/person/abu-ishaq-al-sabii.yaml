summary:
  ar: "عمرو بن عبد الله، أبو إسحاق السبيعي، من أئمة التابعين بالكوفة وأثباتهم كما يقول الذهبي في «ميزان الاعتدال»: ولد في أيام عثمان، ورأى علياً وأسامة بن زيد، وقال أبو حاتم: ثقة يشبه الزهري في الكثرة. وهو من المعدودين فيمن تغيّر من الثقات: قيل اختلط، وأنكر الذهبي ذلك وقال: شاخ ونسي ولم يختلط، ويقال إن سماع ابن عيينة منه كان بعد تغيّره. وروى له الشيخان من طريق أصحابه القدماء {cite:mizan-itidal-bijawi-v3 p. 270}{cite:tadrib-rawi-awwama-v5 p. 556-560}."
  en: "Amr ibn Abd Allah, Abu Ishaq al-Sabi'i, one of the leading and most reliable Successors of Kufa, as al-Dhahabi puts it in Mizan al-I'tidal: born in the days of Uthman, he saw Ali and Usama ibn Zayd, and Abu Hatim called him trustworthy, like al-Zuhri in the abundance of his narration. He is counted among the trustworthy men whose memory changed: some said he became confused (ikhtalata), which al-Dhahabi denied, saying he grew old and forgetful but was not confused; Ibn Uyayna's hearing from him is said to date from after the change. Al-Bukhari and Muslim narrate from him through his earlier students."
