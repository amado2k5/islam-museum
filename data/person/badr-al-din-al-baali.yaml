  fr: "Badr al-Din al-Ba'li"
  ur: "بدر الدین البالی"
roles: [mufti, scholar]
gender: male
summary:
  ar: "محمد بن علي بن أحمد بن عمر بن يعلى، أبو عبد الله، بدر الدين البعلي، شيخ الحنابلة في بعلبك وعليه مدار الفتوى فيها، له مختصر الفتاوى المصرية سماه التسهيل، توفي سنة 778 هـ."
  en: "Muhammad ibn Ali ibn Ahmad ibn Umar ibn Ya'la, Abu Abd Allah, Badr al-Din al-Ba'li, shaykh of the Hanbalis in Baalbek on whom legal opinions there turned; author of an abridgement of the Egyptian fatwas called al-Tashil; died 778 AH (1376)."
  es: "Muhammad ibn Ali ibn Ahmad ibn Umar ibn Ya'la, Abu Abd Allah, Badr al-Din al-Ba'li, shaykh de los hanbalíes en Baalbek en quien se basaban las opiniones legales de la región; autor de un compendio de las fatuas egipcias llamado al-Tashil; murió en el año 778 de la Hégira (1376)."
  fr: "Muhammad ibn Ali ibn Ahmad ibn Umar ibn Ya'la, Abu Abd Allah, Badr al-Din al-Ba'li, cheikh des Hanbalites à Baalbek sur lequel se tournaient les opinions juridiques; auteur d'un abrégé des fatwas égyptiennes appelé al-Tashil; mort en 778 AH (1376)."
  ur: "محمد بن علی بن احمد بن عمر بن یعلی، ابو عبد اللہ، بدر الدین البالی، بعلبک میں حنبلیوں کے شیخ جن کے بارے میں قانونی آراء تبدیل ہوگئیں۔ التشیل نامی مصری فتاویٰ کے اختصار کے مصنف؛ وفات 778ھ (1376)۔"
