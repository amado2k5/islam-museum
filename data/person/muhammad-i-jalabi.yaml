summary:
  ar: "السلطان محمد الأول (٧٨١–٨٢٤هـ/١٣٧٩–١٤٢١م)، المعروف بمحمد جلبي؛ تولى أمر الأمة بعد وفاة والده بايزيد وتغلب على إخوته واحداً واحداً حتى خلص له الأمر وقضى سنّي حكمه الثماني في إعادة بناء الدولة وتوطيد أركانها، ويعتبره بعض المؤرخين المؤسس الثاني للدولة العثمانية. اشترك أثناء حكمه في أربع وعشرين حرباً وأُصيب بأربعين جرحاً، واستعمل الحزم مع الحلم فيمن قهرهم، وسالم إمبراطور القسطنطينية وحالفه. وهو أول سلطان عثماني أرسل الهدية السنوية إلى أمير مكة المعروفة بالصرّة توزع على فقراء مكة والمدينة. أحبه شعبه وأطلقوا عليه لقب «بهلوان» أي البطل لنشاطه الجمّ وشجاعته، وقال له على فراش الموت: عينت ابني مراد خليفة لي فأطعه {cite:dawlat-uthmaniyya-salabi p. 76-77}. وكان أصغر أبناء بايزيد الخمسة، انسحب بعد أنقرة إلى أماسيا ثم غلب إخوته حتى انفرد بالحكم سنة ١٤١٣م بعد عشر سنوات من الحرب الأهلية {cite:dawlat-uthmaniyya-salabi p. 70-73}. وتصدى بنفسه لحركة الشيخ بدر الدين السماوني فهُزمت قواتها وأُسر زعيمها وأُعدم {cite:dawlat-uthmaniyya-salabi p. 75-76}. ونقل عاصمة الدولة من أدرنة «مدينة الغزاة» إلى بروسة «مدينة الفقهاء»، وتوفي بأدرنة سنة ٨٢٤هـ/١٤٢١م عن ثلاثة وأربعين عاماً فأخفى وزيراه إبراهيم وبايزيد موته واحداً وأربعين يوماً حتى وصل ابنه مراد الثاني {cite:dawlat-uthmaniyya-salabi p. 77-78}."
  en: "Mehmed I (1379–1421 CE) — the youngest of Bayezid's sons, who fell back on Amasya after Ankara and beat his brothers one by one to reign sole from 1413; 'the second founder' who spent his eight years reunifying the state, personally broke Sheikh Badr al-Din's rising, moved the capital from 'warriors' Edirne' to 'jurists' Bursa', and first sent the annual surra gift to the Amir of Mecca {cite:dawlat-uthmaniyya-salabi p. 70-78}. He died at Edirne in 824/1421 aged forty-three, his viziers concealing the death forty-one days until Murad II arrived {cite:dawlat-uthmaniyya-salabi p. 77-78}."
