summary:
  ar: "السلطان محمد الأول ⁦(٧٨١–٨٢٤هـ/١٣٧٩–١٤٢١م)⁩، المعروف بمحمد جلبي؛ تولى أمر الأمة بعد وفاة والده بايزيد وتغلب على إخوته واحداً واحداً حتى خلص له الأمر وقضى سنّي حكمه الثماني في إعادة بناء الدولة وتوطيد أركانها، ويعتبره بعض المؤرخين المؤسس الثاني للدولة العثمانية. اشترك أثناء حكمه في أربع وعشرين حرباً وأُصيب بأربعين جرحاً، واستعمل الحزم مع الحلم فيمن قهرهم، وسالم إمبراطور القسطنطينية وحالفه. وهو أول سلطان عثماني أرسل الهدية السنوية إلى أمير مكة المعروفة بالصرّة توزع على فقراء مكة والمدينة. أحبه شعبه وأطلقوا عليه لقب «بهلوان» أي البطل لنشاطه الجمّ وشجاعته، وقال له على فراش الموت: عينت ابني مراد خليفة لي فأطعه {cite:dawlat-uthmaniyya-salabi p. 76-77}. وكان أصغر أبناء بايزيد الخمسة، انسحب بعد أنقرة إلى أماسيا ثم غلب إخوته حتى انفرد بالحكم سنة ١٤١٣م بعد عشر سنوات من الحرب الأهلية {cite:dawlat-uthmaniyya-salabi p. 70-73}. وتصدى بنفسه لحركة الشيخ بدر الدين السماوني فهُزمت قواتها وأُسر زعيمها وأُعدم {cite:dawlat-uthmaniyya-salabi p. 75-76}. ونقل عاصمة الدولة من أدرنة «مدينة الغزاة» إلى بروسة «مدينة الفقهاء»، وتوفي بأدرنة سنة ٨٢٤هـ/١٤٢١م عن ثلاثة وأربعين عاماً فأخفى وزيراه إبراهيم وبايزيد موته واحداً وأربعين يوماً حتى وصل ابنه مراد الثاني {cite:dawlat-uthmaniyya-salabi p. 77-78}."
  en: "Mehmed I (1386/1387–1421 CE) — the youngest of Bayezid's sons, who fell back on Amasya after Ankara and beat his brothers one by one to reign sole from 1413; 'the second founder' who spent his eight years reunifying the state, personally broke Sheikh Badr al-Din's rising, moved the capital from 'warriors' Edirne' to 'jurists' Bursa', and first sent the annual surra gift to the Amir of Mecca {cite:dawlat-uthmaniyya-salabi p. 70-78}. He died at Edirne in 824/1421 aged forty-three, his viziers concealing the death forty-one days until Murad II arrived {cite:dawlat-uthmaniyya-salabi p. 77-78}."
  ur: "عثمانی سلطان جس نے خانہ جنگی کے بعد حکومت کو یکجا کیا؛ اس کے عہد سے بورصہ کی سبز مسجد اور ادرنہ میں سلطنت کا مرکز وابستہ ہیں۔ {cite:dawlat-uthmaniyya-salabi}"
  es: "Mehmed I (1386/1387–1421 d. C.), el menor de los hijos de Bayezid, se replegó sobre Amasya tras Ankara y derrotó a sus hermanos uno por uno para reinar en solitario desde 1413; «el segundo fundador», que dedicó sus ocho años a reunificar el estado, sofocó personalmente la rebelión del jeque Badr al-Din, trasladó la capital de Edirne, la ciudad de los guerreros, a Bursa, la ciudad de los juristas, y fue el primero en enviar el regalo anual de la surra al emir de La Meca {cite:dawlat-uthmaniyya-salabi p. 70-78}. Murió en Edirne en 824/1421 a la edad de cuarenta y tres años; sus visires ocultaron su muerte durante cuarenta y un días hasta la llegada de Murad II {cite:dawlat-uthmaniyya-salabi p. 77-78}."
  fr: "Mehmed Ier (1386/1387–1421) – le plus jeune des fils de Bayezid, se replia sur Amasya après Ankara et vainquit ses frères un à un pour régner seul à partir de 1413. Considéré comme le second fondateur, il consacra huit années de son règne à la réunification de l'État, réprima personnellement le soulèvement du cheikh Badr al-Din, transféra la capitale d'Edirne, « ville des guerriers », à Bursa, « ville des juristes », et fut le premier à envoyer le don annuel de la surra à l'émir de La Mecque (voir: Dawlat-Uthmaniyya-Salabi, p. 70-78). Il mourut à Edirne en 824/1421 à l'âge de quarante-trois ans, ses vizirs dissimulant sa mort pendant quarante et un jours, jusqu'à l'arrivée de Murad II (voir: Dawlat-Uthmaniyya-Salabi, p. 77-78)."
  tr: "Sultan I. Mehmed (781–824 Hicri / 1379–1421), nam-ı diğer Mehmed Çelebi, babası Bayezid'in ölümünden sonra ülkenin yönetimini devraldı ve kardeşlerini teker teker yendi, zafer kazandı ve sekiz yıl boyunca devleti yeniden inşa edip pekiştirdi. Bazı tarihçiler onu Osmanlı devletinin ikinci kurucusu olarak kabul eder. Saltanatı sırasında yirmi dört savaşa katıldı ve kırk kez yaralandı, fethettiklerine, Konstantinopolis İmparatoru Salem'e ve müttefikine karşı kararlılık ve hoşgörü gösterdi. Mekke Emiri olan Al-Surrah'a yıllık bir hediye gönderen ilk Osmanlı sultanıydı ve bu hediye Mekke ve Medine'nin yoksullarına dağıtıldı. Halkı onu çok sevdi ve büyük gayri ve cesareti nedeniyle 'Khulwan' unvanını verdi. Ölüm döşeğinde şöyle dedi: Oğlumu halefim olarak atadım, ona itaat et {cite:dawlat-uthmaniyya-salabi s. 76-77}. Bayezid'in beş oğlunun en küçüğüydü. Ankara'dan sonra Amasya'ya çekildi, ardından kardeşlerini yendi ve iç savaştan on yıl sonra, 1413 yılında tek başına iktidara geçene kadar kardeşlerini yendi {cite:dawlat-uthmaniyya-salabi s. 70-73}. Kendisi Şeyh Badr al-Din al-Samawani'nin hareketine karşı çıktı; orduları yenildi, liderleri esir alındı ve idam edildi {cite:dawlat-uthmaniyya-salabi s. 75-76}. Devletin başkentini \"İstilacılar Şehri\" olan Edirne'den, \"Hukukçuların Şehri\" Brosa'ya taşıdı. 824 Hicri / 1421 yılında kırk üç yaşında Edirne'de öldü; ardından İbrahim ve Bayezid, oğlu II. Murad gelene kadar ölümünü kırk bir gün boyunca gizlediler {cite:dawlat-uthmaniyya-salabi, s. 77-78}."
  id: "Sultan Mehmed I (781–824 AH / 1379–1421 M), yang dikenal sebagai Mehmed Çelebi, mengambil alih pemerintahan negara setelah kematian ayahnya Bayezid dan mengalahkan saudara-saudaranya satu per satu hingga ia menang dan menghabiskan delapan tahun pemerintahannya untuk membangun kembali dan memperkuat negara. Beberapa sejarawan menganggapnya sebagai pendiri kedua negara Ottoman. Selama pemerintahannya, ia ikut serta dalam dua puluh empat perang dan terluka empat puluh kali, menggunakan ketegasan dan kesabaran terhadap mereka yang ia taklukkan, serta Salem, Kaisar Konstantinopel, dan sekutunya. Ia adalah sultan Ottoman pertama yang mengirimkan hadiah tahunan kepada Emir Mekah, yang dikenal sebagai Al-Surrah, dibagikan kepada kaum miskin di Mekah dan Madinah. Kaumnya mencintainya dan memberinya gelar 'Khulwan,' yang berarti pahlawan karena keberaniannya yang besar. Di ranjang kematiannya, ia berkata: Aku menunjuk putraku Murad sebagai penerusku, jadi patuhilah {cite:dawlat-uthmaniyya-salabi hlm. 76-77}. Ia adalah anak bungsu dari lima putra Bayezid. Setelah Ankara, ia mundur ke Amasya, lalu mengalahkan saudara-saudaranya hingga ia mengambil alih kekuasaan tunggal pada tahun 1413 M, sepuluh tahun setelah perang saudara {cite:dawlat-uthmaniyya-salabi hlm. 70-73}. Ia sendiri menghadapi gerakan Sheikh Badr al-Din al-Samawani, yang pasukannya dikalahkan, pemimpinnya ditangkap, dan ia dieksekusi {cite:dawlat-uthmaniyya-salabi hlm. 75-76}. Ia memindahkan ibu kota negara dari Edirne, \"Kota Para Penjajah,\" ke Brosa, \"Kota Para Ahli Hukum.\" Ia meninggal di Edirne pada tahun 824 H / 1421 M pada usia empat puluh tiga tahun, setelah itu Ibrahim dan Bayezid menyembunyikan kematiannya selama empat puluh satu hari hingga putranya Murad II tiba {cite:dawlat-uthmaniyya-salabi, hlm. 77-78}."
