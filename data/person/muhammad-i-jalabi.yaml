summary:
  ar: "السلطان محمد الأول (٧٨١–٨٢٤هـ/١٣٧٩–١٤٢١م)، المعروف بمحمد جلبي؛ تولى أمر الأمة بعد وفاة والده بايزيد وتغلب على إخوته واحداً واحداً حتى خلص له الأمر وقضى سنّي حكمه الثماني في إعادة بناء الدولة وتوطيد أركانها، ويعتبره بعض المؤرخين المؤسس الثاني للدولة العثمانية. اشترك أثناء حكمه في أربع وعشرين حرباً وأُصيب بأربعين جرحاً، واستعمل الحزم مع الحلم فيمن قهرهم، وسالم إمبراطور القسطنطينية وحالفه. وهو أول سلطان عثماني أرسل الهدية السنوية إلى أمير مكة المعروفة بالصرّة توزع على فقراء مكة والمدينة. أحبه شعبه وأطلقوا عليه لقب «بهلوان» أي البطل لنشاطه الجمّ وشجاعته، وقال له على فراش الموت: عينت ابني مراد خليفة لي فأطعه {cite:dawlat-uthmaniyya-salabi p. 76-77}."
  en: "Mehmed I (1379–1421 CE) — 'the second founder' who reunified the Ottoman state after the Timurid interregnum, fought in twenty-four wars, and first sent the annual surra gift to the Amir of Mecca {cite:dawlat-uthmaniyya-salabi p. 76-77}."
