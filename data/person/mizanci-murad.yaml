summary:
  ar: "صحفي ومؤرخ وسياسي عثماني (1854–1917) من داغستان، اشتهر بصحيفته «ميزان» (من 1886)، وقاد جمعية الاتحاد والترقي من جنيف سنة 1896 ثم عارضها، ودافع عن العثمانية والوحدة الإسلامية، وكتب تاريخه المتعدد الأجزاء «تاريخ أبي الفاروق»."
  en: "Ottoman journalist, historian and politician (1854-1917) from Dagestan, known for his newspaper Mizan (from 1886), who led the Committee of Union and Progress from Geneva in 1896, then opposed it, defended Ottomanism and Islamic unity, and wrote the multi-volume Tarih-i Ebulfaruk."
