    ar: "أروى بنت عبد المطلب عمة النبي، ولدت طليباً لعمير بن وهب؛ يذكر ابن إسحاق أنه لم يسلم من عماته إلا صفية ويتعقبه ابن حجر بقصة أروى وإسلامها."
    en: "Arwa bint Abd al-Muttalib, the Prophet's aunt and mother of Tulayb to Umayr ibn Wahb: Ibn Ishaq says only Safiyya among the aunts embraced Islam, while Ibn Hajar follows up with Arwa's own story of accepting Islam."
    ur: "اروی بنت عبدالمطلب، نبی کی پھوپھی اور عمیر بن وہب سے طلیب کی ماں: ابن اسحاق کہتے ہیں پھوپھیوں میں صرف صفیہ مسلمان ہوئیں، لیکن ابن حجر اروی کے اسلام کی روایت پیش کرتے ہیں۔"
    sources: [source/ibn-hajar-isaba, source/ibn-hisham-saqqa]
