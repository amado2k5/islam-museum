summary:
  ar: عمة النبي، كانت تحت عمير بن وهب فولدت له طليباً، ثم تزوجها كلدة بن عبد مناف فولدت له أروى؛ يذكر ابن إسحاق أنه لم يسلم من عمات النبي إلا صفية، ويتعقبه ابن حجر بقصة أروى وإسلامها بعد إسلام ابنها طليب.
  en: An aunt of the Prophet; she was married to Umayr ibn Wahb and bore Tulayb, then to Kalda ibn Abd Manaf and bore Arwa; Ibn Ishaq says none of the Prophet's aunts embraced Islam except Safiyya, and Ibn Hajar answers with Arwa's story, her
    embracing Islam after her son Tulayb did.
