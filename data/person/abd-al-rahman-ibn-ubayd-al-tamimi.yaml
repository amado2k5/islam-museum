label: { ar: "عبد الرحمن بن عبيد التميمي", en: "Abd al-Rahman ibn Ubayd al-Tamimi", fr: "Abd al-Rahman ibn Ubayd al-Tamimi", es: "Abd al-Rahman ibn Ubayd al-Tamimi", ur: "عبدالرحمٰن بن عبید تمیمی۔" }
gender: male
summary:
  ar: "رجل اختاره الحجاج بن يوسف صاحباً للشرطة في العراق والمشرق؛ يذكر الكتاب أنه اشترط أن يكفيه الحجاج أمر عياله وحاشيته. وينقل الكتاب عن الشعبي أخباراً عن شدته في الضبط، منها قطع يد من شهر السلاح على الناس، ومنها أنه ضم إليه الحجاج شرطة البصرة مع شرطة الكوفة {cite:umayyad-birth-to-fall-2006 p. 133}{cite:umayyad-birth-to-fall-2006 p. 134}."
  en: "A man whom al-Hajjaj ibn Yusuf chose as chief of police in Iraq and the East. The book notes that he stipulated that al-Hajjaj should take care of his dependants and household. The book reports, citing al-Sha'bi, accounts of his severity in keeping order, including cutting off the hand of anyone who drew a weapon against people, and that al-Hajjaj placed the police of Basra under him together with the police of Kufa {cite:umayyad-birth-to-fall-2006 p. 133}{cite:umayyad-birth-to-fall-2006 p. 134}."
  fr: "Homme qu'al-Hajjaj ibn Yusuf choisit comme chef de la police en Irak et en Orient. Le livre note qu'il exigea qu'al-Hajjaj prenne soin des personnes à sa charge et de sa maisonnée. Le livre rapporte, citant al-Sha'bi, des récits de sa sévérité dans le maintien de l'ordre, dont l'amputation de la main de quiconque tirait une arme contre les gens, et qu'al-Hajjaj plaça sous son autorité la police de Bassora en même temps que celle de Koufa {cite:umayyad-birth-to-fall-2006 p. 133}{cite:umayyad-birth-to-fall-2006 p. 134}."
  es: "Un hombre a quien al-Hajjaj ibn Yusuf eligió como jefe de policía en Irak y Oriente. El libro señala que estipuló que al-Hajjaj debía cuidar de sus dependientes y su hogar. El libro relata, citando a al-Sha'bi, su severidad para mantener el orden, incluyendo la amputación de la mano de cualquiera que empuñara un arma contra la gente, y que al-Hajjaj puso bajo su mando a la policía de Basora junto con la de Kufa {cite:umayyad-birth-to-fall-2006 p. 133}{cite:umayyad-birth-to-fall-2006 p. 134}."
  ur: "ایک شخص جسے الحجاج ابن یوسف نے عراق اور مشرق میں پولیس کا سربراہ منتخب کیا۔ کتاب نوٹ کرتی ہے کہ اس نے یہ شرط رکھی کہ الحجاج کو اپنے زیر کفالت افراد اور گھر والوں کا خیال رکھنا چاہیے۔ کتاب میں الشعبی کا حوالہ دیتے ہوئے بتایا گیا ہے کہ نظم و ضبط میں اس کی سختی کا ذکر ہے، جس میں لوگوں کے خلاف ہتھیار اٹھانے والے کا ہاتھ کاٹنا بھی شامل ہے، اور یہ کہ الحجاج نے بصرہ کی پولیس کو کوفہ کی پولیس کے ساتھ مل کر اپنے ماتحت کر دیا تھا۔ 133}{حوالہ دیں:امیاد-پیدائش سے زوال-2006 صفحہ۔ 134}۔"
