gender: male
summary:
  ar: "رجل اختاره الحجاج بن يوسف صاحباً للشرطة في العراق والمشرق؛ يذكر الكتاب أنه اشترط أن يكفيه الحجاج أمر عياله وحاشيته. وينقل الكتاب عن الشعبي أخباراً عن شدته في الضبط، منها قطع يد من شهر السلاح على الناس، ومنها أنه ضم إليه الحجاج شرطة البصرة مع شرطة الكوفة {cite:umayyad-birth-to-fall-2006 p. 133}{cite:umayyad-birth-to-fall-2006 p. 134}."
  en: "A man whom al-Hajjaj ibn Yusuf chose as chief of police in Iraq and the East. The book notes that he stipulated that al-Hajjaj should take care of his dependants and household. The book reports, citing al-Sha'bi, accounts of his severity in keeping order, including cutting off the hand of anyone who drew a weapon against people, and that al-Hajjaj placed the police of Basra under him together with the police of Kufa {cite:umayyad-birth-to-fall-2006 p. 133}{cite:umayyad-birth-to-fall-2006 p. 134}."
