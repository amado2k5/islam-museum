summary:
  ar: "اقتصادي ومصرفي بنغلاديشي، وُلد قرب شيتاجونج سنة 1940، وأسس بنك غرامين سنة 1983 رائدا فكرة القروض متناهية الصغر للفقراء، فنال مع البنك جائزة نوبل للسلام سنة 2006 فكان أول بنغلاديشي ينالها، ثم تولى رئاسة الحكومة المؤقتة في بنغلاديش بصفة كبير المستشارين من أغسطس 2024 إلى فبراير 2026."
  en: "Bangladeshi economist and banker, born near Chittagong in 1940. He founded Grameen Bank in 1983, pioneering microcredit for the poor, and received the 2006 Nobel Peace Prize jointly with the bank, the first Bangladeshi laureate; he then headed Bangladesh's interim government as Chief Adviser from August 2024 to February 2026."
  ur: "بنگلہ دیشی ماہرِ معاشیات اور بینکار، جو 1940 میں چٹاگانگ کے قریب پیدا ہوئے۔ انہوں نے 1983 میں گرامین بینک قائم کر کے غریبوں کے لیے چھوٹے قرضوں (مائیکرو کریڈٹ) کی بنیاد رکھی، اور بینک کے ساتھ مشترکہ طور پر 2006 کا امن کا نوبل انعام پایا، جو کسی بنگلہ دیشی کے لیے پہلا تھا؛ پھر اگست 2024 سے فروری 2026 تک بنگلہ دیش کی عبوری حکومت کے سربراہ بطور چیف ایڈوائزر رہے۔"
