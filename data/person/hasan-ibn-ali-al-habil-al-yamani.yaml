roles: [poet]
gender: male
summary:
  ar: "حسن بن علي بن جابر الهبل اليمني، شاعر زيدي من أهل صنعاء ولادة ووفاة، أصله من قرية بني الهبل في هجر خولان، له ديوان شعر مخطوط، وتوفي سنة 1079 هـ."
  en: "Hasan ibn Ali ibn Jabir al-Habil al-Yamani, a Zaydi poet from Sanaa, where he was born and died; his family came from the village of Bani al-Habil, a hijra of Khawlan; he left a manuscript diwan and died in 1079 AH (1668)."
  es: "Hasan ibn Ali ibn Jabir al-Habil al-Yamani, poeta zaidí de Sanaa, donde nació y murió; su familia provenía del pueblo de Bani al-Habil, una hijra de Khawlan; dejó un manuscrito diwan y murió en 1079 AH (1668)."
  fr: "Hasan ibn Ali ibn Jabir al-Habil al-Yamani, poète zaydite de Sanaa, où il est né et mort; sa famille venait du village de Bani al-Habil, une hijra de Khawlan; il a laissé un diwan manuscrit et est mort en 1079 AH (1668)."
  ur: "حسن بن علی ابن جابر الحبیل ال یمانی، صنعاء کے ایک زیدی شاعر، جہاں وہ پیدا ہوئے اور وفات پائی؛ اس کا خاندان بنی الحبیل گاؤں سے آیا تھا، جو خولان کا ایک حجرہ تھا۔ انہوں نے ایک مخطوطہ دیوان چھوڑا اور 1079ھ (1668) میں وفات پائی۔"
