summary:
  ar: "محمد النويري يدعى الخضر الشافعي؛ ولد في ربيع الآخر سنة اثنتين وستين وسبعمائة وأسمع على العز بن جماعة وابن حبيب وابن عبد المعطي والأميوطي وأجاز له المال الاستوي وأبو البقاء السبكي وغيرهم وناب في الحكم عن قريبه عز الدين بن محب الدين وولي قضاء المدينة مدة يسيرة ولم يصل إليها بل استناب ابن المطري وصرف وكان ضخماً جداً وانصلح بآخره وهو والد أبي اليمن خطيب الحرم، توفي في رابع عشر ذي الحجة سنة اثنتين وثلاثين وثمانمائة {cite:shadharat-dhahab p. 200}."
  en: "Muhammad 'called al-Khidr' al-Nuwayri (b. 762) — transmitted to Ibn Jama'a, Ibn Habib, al-Umyuti's circle; qadi of Medina briefly by deputy (Ibn al-Mutri served in his place); father of Abu al-Yaman, khatib of the Haram; died 14 Dhu al-Hijja 832 {cite:shadharat-dhahab p. 200}."
