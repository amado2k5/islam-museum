summary:
  ar: "خليفة القاهرة، زكريا بن إبراهيم بن المستمسك بن الحاكم، استقر خليفة بغير مبايعة ولا إجماع لما خلع عليه أتابك أينبك البدري سنة تسع وسبعين فكانت خلافته الأولى خمسة عشر يوماً حتى عاد المتوكل، ثم بايعه برقوق بعد موت أخيه الواثق عمر فاستمر إلى سنة إحدى وتسعين حتى ندم برقوق وأعاد المتوكل وخلعه فاستمر بداره إلى أن مات مخلوعاً {cite:tarikh-khulafa-minhaj-1434 p. 759-761}."
  en: "Twice-set Cairo caliph: fifteen days under Aynbak in 779 'without bay'a or consensus', then under Barquq till 791 when the repenting sultan restored al-Mutawakkil; died deposed at home {cite:tarikh-khulafa-minhaj-1434 p. 759-761}."
