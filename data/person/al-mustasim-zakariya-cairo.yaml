id: person/al-mustasim-zakariya-cairo
class: person
label: { ar: "المستعصم بالله زكريا بن إبراهيم", en: "al-Musta'sim bi'llah Zakariya ibn Ibrahim", fr: "al-Musta'sim bi'llah Zakariya ibn Ibrahim", es: "al-Musta'sim bi'llah Zakariya ibn Ibrahim", ur: "المستسم باللہ زکریا ابن ابراہیم" }
summary:
  ar: "خليفة القاهرة، زكريا بن إبراهيم بن المستمسك بن الحاكم، استقر خليفة بغير مبايعة ولا إجماع لما خلع عليه أتابك أينبك البدري سنة تسع وسبعين فكانت خلافته الأولى خمسة عشر يوماً حتى عاد المتوكل، ثم بايعه برقوق بعد موت أخيه الواثق عمر فاستمر إلى سنة إحدى وتسعين حتى ندم برقوق وأعاد المتوكل وخلعه فاستمر بداره إلى أن مات مخلوعاً {cite:tarikh-khulafa-minhaj-1434 p. 759-761}."
  en: "Twice-set Cairo caliph: fifteen days under Aynbak in 779 'without bay'a or consensus', then under Barquq till 791 when the repenting sultan restored al-Mutawakkil; died deposed at home {cite:tarikh-khulafa-minhaj-1434 p. 759-761}."
  fr: "Calife du Caire à deux reprises : quinze jours sous Aynbak en 779 'sans bay'a ou consensus', puis sous Barquq jusqu'en 791 lorsque le sultan repentant restaura al-Mutawakkil ; mort déposé à la maison {cite:tarikh-khulafa-minhaj-1434 p. 759-761}."
  es: "Califa de El Cairo en dos ocasiones: quince días bajo Aynbak en 779 'sin bay'a o consenso', luego bajo Barquq hasta 791 cuando el sultán arrepentido restauró al-Mutawakkil; murió depuesto en su casa {cite:tarikh-khulafa-minhaj-1434 p. 759-761}."
  ur: "قاہرہ کا دو مرتبہ خلیفہ: 779 میں عینبک کے تحت پندرہ دن 'بغیر بیع یا اجماع کے'، پھر برقوق کے تحت 791 تک جب توبہ کرنے والے سلطان نے المتوکل کو بحال کیا۔ گھر میں معزول انتقال کر گئے {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 759-761}۔"
  tr: "Kahire Halifesi Zakeriye bin İbrahim ibn el-Mustamsak ibn el-Hakim, yetmiş dokuzuncu yılda Atabeg Ayanbek el-Bedri'yi tahttan indirene kadar hiçbir söz veya uzlaşma olmadan halife olarak yerleşti. İlk halifeliği on beş gün sürdü ve el-Mutavakkil döndü. Barquq, kardeşi el-Vetik'in ölümünden sonra ona bağlılık yemini etti ve Barquq doksan bir yıla kadar kaldı; ta ki Barquq pişman olup el-Mutawakkil'i tahttan indirene kadar, o da evinde kaldı ve tahttan indirilerek ölene kadar evinde kaldı. {alıntı:Tarikh-Khulafa-minhaj-1434, s. 759-761}."
  id: "Khalifah Kairo, Zakariya ibn Ibrahim ibn al-Mustamsak ibn al-Hakim, menetap sebagai khalifah tanpa janji atau konsensus hingga ia menggulingkan Atabeg Ayanbek al-Badri pada tahun tujuh puluh sembilan. Khalifah pertamanya berlangsung lima belas hari hingga al-Mutawakkil kembali. Kemudian Barquq bersumpah setia kepadanya setelah kematian saudaranya al-Wathiq Umar, dan ia tetap berada hingga tahun sembilan puluh satu, hingga Barquq menyesal dan mengembalikan al-Mutawakkil, mencopotkannya, dan ia tetap tinggal di rumahnya hingga ia meninggal dalam keadaan digulingkan. {cite:Tarikh-Khulafa-minhaj-1434, hlm. 759-761}."
