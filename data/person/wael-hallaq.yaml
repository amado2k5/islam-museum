summary:
  ar: "باحث فلسطيني كندي في الشريعة والتاريخ الفكري الإسلامي، وُلد سنة 1955، أستاذ بجامعة كولومبيا. يشتهر بنقده للاستشراق وأطروحته أن الحكم الشرعي الكلاسيكي غير متوافق بنيويًا مع الدولة القومية الحديثة، ومن كتبه «الدولة المستحيلة» و«الشريعة: نظرية وممارسة وتحولات»."
  en: "Palestinian-Canadian scholar of Islamic law and intellectual history, born in 1955, professor at Columbia University. Known for his critique of Orientalism and his thesis that classical sharia governance is structurally incompatible with the modern nation-state; books include The Impossible State and Shari’a: Theory, Practice, Transformations."
  ur: "فلسطینی نژاد کینیڈین محققِ شریعت و فکری تاریخِ اسلام، 1955 میں پیدا ہوئے، کولمبیا یونیورسٹی کے پروفیسر۔ وہ استشراق کے نقد اور اس مؤقف کے لیے مشہور ہیں کہ کلاسیکی شرعی حکومت جدید قومی ریاست سے ساختی طور پر ناسازگار ہے؛ کتب میں The Impossible State اور Shari’a: Theory, Practice, Transformations شامل ہیں۔"
