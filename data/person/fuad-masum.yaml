summary:
  ar: "محمد فؤاد معصوم (وُلد 1 يوليو 1938)، سياسي كردي عراقي، ثاني رئيس غير عربي لجمهورية العراق، تولى الرئاسة من 2014 إلى 2018 خلفًا لجلال طالباني. نشأ في بيت علم ديني، ودرس القانون والشريعة في بغداد وحصل على الدكتوراه في الفلسفة الإسلامية من الأزهر سنة 1975، وكان من قيادات الاتحاد الوطني الكردستاني ومن أوائل رؤساء وزراء إقليم كردستان."
  en: "Muhammad Fuad Masum (born 1 July 1938) is an Iraqi Kurdish politician, the second non-Arab president of the Republic of Iraq, holding the presidency from 2014 to 2018 in succession to Jalal Talabani. Raised in a family of religious scholars, he studied law and Sharia at Baghdad and took a doctorate in Islamic philosophy from Al-Azhar in 1975; he was a leading figure of the Patriotic Union of Kurdistan and an early prime minister of the Kurdistan Region."
  ur: "محمد فؤاد معصوم (پیدائش 1 جولائی 1938ء) ایک عراقی کرد سیاست دان اور جمہوریۂ عراق کے دوسرے غیر عرب صدر ہیں؛ وہ 2014ء سے 2018ء تک جلال طالبانی کے جانشین کے طور پر صدر رہے۔ دینی علماء کے گھرانے میں پرورش پائی، بغداد میں قانون و شریعت کی تعلیم حاصل کی اور 1975ء میں الازہر سے اسلامی فلسفے میں ڈاکٹریٹ کیا؛ وہ پٹریاٹک یونین آف کردستان کے نمایاں رہنما اور کردستان ریجن کے ابتدائی وزرائے اعظم میں سے تھے۔"
