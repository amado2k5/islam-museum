summary:
  ar: "الملك الصالح صلاح الدين أحمد بن الملك الظاهر غازي بن صلاح الدين؛ صاحب عينتاب؛ الأخ الأكبر للملك العزيز غياث الدين صاحب حلب لكنه أُخر عن الملك لأن أمه كانت جارية بينما أم أخيه صفية خاتون بنت الملك العادل؛ توفي بعينتاب {cite:wafayat-ayan}."
  en: "Al-Malik al-Salih Salah al-Din Ahmad (600–651) — Ayyubid lord of Ayntab, elder brother of al-Aziz of Aleppo, passed over for the succession because his mother was a concubine {cite:wafayat-ayan}."
  fr: "Al-Malik al-Salih Salah al-Din Ahmad (600-651) – seigneur ayyoubide d’Ayntab, frère aîné d’al-Aziz d’Alep, est passé pour la succession parce que sa mère était une concubine {cite:wafayat-ayan}."
  es: "Al-Malik al-Salih Salah al-Din Ahmad (600–651) — Señor ayubí de Ayntab, hermano mayor de al-Aziz de Alepo, fue excluido de la sucesión porque su madre era concubina {cite:wafayat-ayan}."
  ur: "المالک الصالح صلاح الدین احمد (600-651) - ایوبید رب العینتاب، حلب کے العزیز کے بڑے بھائی، جانشینی کے لیے انتقال کر گئے کیونکہ اس کی ماں ایک لونڈی تھی۔"
  tr: "Kral Salih al-Din Ahmed ibn al-Malik al-Zahir Ghazi ibn Salah al-Din; Ayntab'ın hükümdarı; sevgili Kral Ghiyath al-Din'in en büyük kardeşi, Halep hükümdarı, ancak annesi köle kız olduğu için tahttan ayrılmadı, kardeşinin annesi ise adil kralın kızı Safiya Khatun'du; Ayntab'da öldü {atıf:wafayat-ayan}."
  id: "Raja Salih al-Din Ahmad ibn al-Malik al-Zahir Ghazi ibn Salah al-Din; penguasa Ayntab; kakak tertua dari Raja Ghiyath al-Din yang tercinta, penguasa Aleppo, tetapi ia tertunda dari tahta karena ibunya adalah seorang gadis budak, sementara ibu dari saudaranya adalah Safiya Khatun, putri raja yang adil; ia meninggal di Ayntab {cite:wafayat-ayan}."
