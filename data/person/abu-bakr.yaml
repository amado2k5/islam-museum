summary:
  en: Close companion of the Prophet and the first caliph (r. 632–634 CE); his succession is understood differently in Sunni and Shia tradition.
  ar: "صاحب النبي وأول الخلفاء (حكم 632–634م)، ويُفهم تولّيه الخلافة بصورة مختلفة في التقليدين السني والشيعي. وفي الصحيح قال النبي «لو كنت متخذاً من أمتي خليلاً لاتخذت أبا بكر ولكن أخي وصاحبي» {cite:sahih-al-bukhari 3656}، وسئل عمرو بن العاص أي الناس أحب إليك فقال «عائشة» فقيل من الرجال فقال «أبوها» {cite:sahih-al-bukhari 3662}، وقال عمر «أبو بكر سيدنا وأعتق سيدنا» يعني بلالاً {cite:sahih-al-bukhari 3754}. وفي الصحيح أنه هو الذي دفع عقبة بن أبي معيط عن النبي يوم خنقه بردائه وهو يصلي، وقال «أتقتلون رجلاً أن يقول ربي الله وقد جاءكم بالبينات من ربكم» {cite:sahih-al-bukhari 3678}، وفي مسلم قال النبي قبل موته بخمس «لو كنت متخذا من أمتي خليلا لاتخذت أبا بكر خليلا» {cite:sahih-muslim 532}، وقال أيضاً «إن أمن الناس علي في ماله وصحبته أبو بكر... لا تبقين في المسجد خوخة إلا سدت إلا خوخة أبي بكر» {cite:sahih-muslim 2382}، وأبو بكر نفسه راوي حديث الغار «ما ظنك باثنين الله ثالثهما» {cite:sahih-muslim 2381}."
