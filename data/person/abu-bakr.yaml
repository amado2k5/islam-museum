summary:
  en: Close companion of the Prophet and the first caliph (r. 632–634 CE); his succession is understood differently in Sunni and Shia tradition. Usd al-Ghaba's entry on him (no. 3067) describes him as one of Quraysh's leaders in the Jahiliyya who held their bloodwits, companion of the Prophet in the cave and the Hijra, and caliph after him {cite:usd-ghaba p.701}. Abu Nu'aym's Ma'rifat entry on his lineage, birth and death has al-Zuhri give his name as Abd Allah ibn Uthman ibn Amir ibn Amr ibn Ka'b, and Aisha report that Abu Quhafa had three sons of whom one he named Atiq, Mu'tiq and Mu'taq {cite:marifat-sahaba-abu-nuaym p.22} {cite:marifat-sahaba-abu-nuaym p.23}.
  ar: "صاحب النبي وأول الخلفاء ⁦(حكم 632–634م)⁩، ويُفهم تولّيه الخلافة بصورة مختلفة في التقليدين السني والشيعي. وفي الصحيح قال النبي «لو كنت متخذاً من أمتي خليلاً لاتخذت أبا بكر ولكن أخي وصاحبي» {cite:sahih-al-bukhari 3656}، وسئل عمرو بن العاص أي الناس أحب إليك فقال «عائشة» فقيل من الرجال فقال «أبوها» {cite:sahih-al-bukhari 3662}، وقال عمر «أبو بكر سيدنا وأعتق سيدنا» يعني بلالاً {cite:sahih-al-bukhari 3754}. وفي الصحيح أنه هو الذي دفع عقبة بن أبي معيط عن النبي يوم خنقه بردائه وهو يصلي، وقال «أتقتلون رجلاً أن يقول ربي الله وقد جاءكم بالبينات من ربكم» {cite:sahih-al-bukhari 3678}، وفي مسلم قال النبي قبل موته بخمس «لو كنت متخذا من أمتي خليلا لاتخذت أبا بكر خليلا» {cite:sahih-muslim 532}، وقال أيضاً «إن أمن الناس علي في ماله وصحبته أبو بكر»، و«لا تبقين في المسجد خوخة إلا سدت إلا خوخة أبي بكر» {cite:sahih-muslim 2382}، وأبو بكر نفسه راوي حديث الغار «ما ظنك باثنين الله ثالثهما» {cite:sahih-muslim 2381}. ويذكر أسد الغابة في ترجمته رقم ٣٠٦٧ أنه كان من رؤساء قريش في الجاهلية وأليها الأشناق، وأنه صاحب النبي في الغار والهجرة والخليفة بعده {cite:usd-ghaba p.701}، وتذكر «معرفة الصحابة» لأبي نعيم في ترجمة نسبه ومولده ووفاته أن الزهري قال اسمه عبد الله بن عثمان بن عامر بن عمرو بن كعب، وأن عائشة قالت إن أبا قحافة كان له ثلاثة فسمى واحداً عتيقاً ومعتيقاً ومعتقاً {cite:marifat-sahaba-abu-nuaym p.22} {cite:marifat-sahaba-abu-nuaym p.23}."
  ur: "نبی کے قریبی ساتھی اور پہلے خلیفہ ⁦(632–634ء)⁩؛ ان کی خلافت کو سنی اور شیعہ روایت مختلف طور پر سمجھتے ہیں۔"
  fr: "Compagnon intime du Prophète et premier calife (r. 632–634 ap. J.-C.) ; sa succession est comprise différemment dans les traditions sunnite et chiite. La notice que lui consacre l'Usd al-Ghaba (n° 3067) le décrit comme l'un des chefs de Quraysh pendant la Jahiliyya, qui avait la charge des prix du sang, compagnon du Prophète dans la grotte et lors de l'Hégire, et calife après lui {cite:usd-ghaba p.701}. La notice de la Ma'rifat d'Abu Nu'aym sur sa généalogie, sa naissance et sa mort rapporte qu'al-Zuhri donne son nom comme Abd Allah ibn Uthman ibn Amir ibn Amr ibn Ka'b, et qu'Aisha rapporte qu'Abu Quhafa eut trois fils, qu'il nomma Atiq, Mu'tiq et Mu'taq {cite:marifat-sahaba-abu-nuaym p.22} {cite:marifat-sahaba-abu-nuaym p.23}."
  es: "Compañero cercano del Profeta y primer califa (r. 632–634 d. C.); su sucesión se interpreta de manera diferente en la tradición sunita y chiita. La entrada sobre él en Usd al-Ghaba (n.º 3067) lo describe como uno de los líderes de Quraysh en la época preislámica (Jahiliyya), que poseía su sabiduría ancestral, compañero del Profeta en la cueva y la Hégira, y califa después de él {cite:usd-ghaba p.701}. La entrada de Ma'rifat de Abu Nu'aym sobre su linaje, nacimiento y muerte tiene al-Zuhri que da su nombre como Abd Allah ibn Uthman ibn Amir ibn Amr ibn Ka'b, y Aisha informa que Abu Quhafa tuvo tres hijos, de los cuales a uno llamó Atiq, Mu'tiq y Mu'taq {cite:marifat-sahaba-abu-nuaym p.22} {cite:marifat-sahaba-abu-nuaym p.23}."
  tr: "Peygamberin sahabesi ve ilk halifesi (632-634 yılları arasında hüküm sürmüştür), halifeliği üstlenmesi Sünni ve Şii geleneklerinde farklı şekillerde anlaşılmaktadır. Bir hadiste Peygamber şöyle buyurmuştur: \"Ümmetimden yakın bir dost seçmem gerekseydi, Ebu Bekir'i seçerdim, fakat o benim kardeşim ve sahabemdir\" (Sahih Buhari 3656). Amr ibn al-As'a insanlar arasında en çok kimi sevdiği sorulduğunda, \"Aişe\" diye cevap vermiştir. Erkekler arasında en çok kimi sevdiği sorulduğunda ise, \"Babası\" diye cevap vermiştir (Sahih Buhari 3662). Ömer şöyle buyurmuştur: \"Ebu Bekir bizim efendimizdir ve o, efendimiz Bilal'i azat etmiştir\" (Sahih Buhari 3754). Rivayetlere göre, Peygamber namaz kılarken Ukba ibn Ebu Muayt'ı cübbesiyle boğmaya çalıştığı gün, onu Peygamber'den uzaklaştıran kişi Ebu Bekir'di ve şöyle demişti: \"Rabbiniz Allah'tır diyen bir adamı, size Rabbinizden açık deliller getirdiği halde öldürür müsünüz?\" {Sahih Buhari 3678}. Müslim'de, Peygamberimiz vefatından beş gün önce şöyle buyurmuştur: \"Ümmetimden yakın bir dost seçmem gerekseydi, Ebu Bekir'i seçerdim.\" {Sahih Müslim 532}. Ayrıca şöyle buyurmuştur: \"Malmı ve arkadaşlığıyla bana en güvenilir insan Ebu Bekir'dir\" ve \"Mescitte Ebu Bekir'in kapısı dışında hiçbir kapı açık bırakılmasın.\" {Sahih Müslim 2382}. Ebu Bekir'in kendisi, \"Allah üçüncü kişi iken iki kişi hakkında ne düşünüyorsunuz?\" hadisinin ravîsidir. {cite:sahih-muslim 2381}. Usd al-Ghaba, 3067 numaralı biyografisinde, İslam öncesi dönemde Kureyş'in liderlerinden biri olduğunu, Peygamber'e mağarada ve Hicret sırasında eşlik ettiğini ve ondan sonra halife olduğunu belirtir. {cite:usd-ghaba s.701}. Ebu Nuaym'ın \"Ma'rifat al-Sahaba\" adlı biyografisinde, soyu, doğumu ve ölümüyle ilgili olarak, el-Zuhri'nin adının Abdullah bin Uthman bin Amer bin Amr bin Ka'b olduğunu söylediği ve Aişe'nin Ebu Kuhafa'nın üç oğlu olduğunu ve bunlardan birine Atık, birine Mu'tiq ve birine de Mu'taq adını verdiğini söylediği belirtilir. {cite:marifat-sahaba-abu-nuaym s.22} {cite:marifat-sahaba-abu-nuaym s.23}."
  id: "Sahabat Nabi dan Khalifah pertama (memerintah 632–634 M), pengangkatannya sebagai Khalifah dipahami secara berbeda dalam tradisi Sunni dan Syiah. Dalam sebuah hadits, Nabi bersabda, \"Jika aku harus memilih seorang sahabat dekat dari kalangan umatku, aku akan memilih Abu Bakar, tetapi dia adalah saudaraku dan sahabatku\" (Sahih al-Bukhari 3656). Amr bin al-As ditanya siapa yang paling dicintainya di antara manusia, dan dia menjawab, \"Aisyah.\" Ketika ditanya siapa di antara laki-laki yang paling dicintainya, dia menjawab, \"Ayahnya\" (Sahih al-Bukhari 3662). Umar berkata, \"Abu Bakar adalah pemimpin kami, dan dia membebaskan pemimpin kami,\" yang berarti Bilal (Sahih al-Bukhari 3754). Diriwayatkan secara sahih bahwa dialah yang mendorong Uqba ibn Abi Mu’ayt menjauh dari Nabi pada hari ketika ia mencekiknya dengan jubahnya saat Nabi sedang shalat, dan beliau berkata, “Apakah kalian membunuh seseorang karena mengucapkan, ‘Tuhanku adalah Allah,’ padahal ia telah membawakan kalian bukti-bukti yang jelas dari Tuhan kalian?” {kutipan:sahih-al-bukhari 3678}. Dalam Muslim, Nabi bersabda lima hari sebelum wafatnya, “Jika aku harus mengambil seorang sahabat dekat dari umatku, aku akan mengambil Abu Bakr sebagai sahabat dekatku.” {kutipan:sahih-muslim 532}. Beliau juga bersabda, “Orang yang paling dapat dipercaya bagiku dengan harta dan persahabatannya adalah Abu Bakr,” dan “Jangan biarkan pintu masjid terbuka kecuali pintu Abu Bakr.” {kutipan:sahih-muslim 2382}. Abu Bakr sendiri adalah perawi hadits gua, “Apa pendapat kalian tentang dua orang, padahal Allah adalah pihak ketiga?” {cite:sahih-muslim 2381}. Usd al-Ghaba menyebutkan dalam biografinya No. 3067 bahwa ia adalah salah satu pemimpin Quraisy di era pra-Islam dan bahwa dialah yang menemani Nabi di gua dan selama Hijrah dan menjadi Khalifah setelahnya {cite:usd-ghaba hlm. 701}. “Ma’rifat al-Sahaba” karya Abu Nu’aym menyebutkan dalam biografi silsilah, kelahiran, dan kematiannya bahwa al-Zuhri mengatakan namanya adalah Abdullah bin Uthman bin Amer bin Amr bin Ka’b, dan bahwa Aisyah mengatakan bahwa Abu Quhafa memiliki tiga putra dan ia menamai salah satunya Atiq, Mu’tiq, dan Mu’taq {cite:marifat-sahaba-abu-nuaym hlm. 22} {cite:marifat-sahaba-abu-nuaym hlm. 23}."
