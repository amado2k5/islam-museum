summary:
  ar: "فقيه شيعي اثنا عشري من قاجار إيران (1843–1909)، درس في عتبات العراق عند ميرزا حسن الشيرازي وغدا أبرز علماء طهران وفقهائها، وأيّد الثورة الدستورية أولًا مشترطًا قيدها بالشريعة ثم انقلب عليها، فأعدمه الدستوريون شنقًا في طهران سنة 1909."
  en: "Twelver Shia jurist of Qajar Iran (1843–1909). He studied in the shrine cities of Iraq under Mirza Hasan Shirazi and became Tehran's leading scholar and jurist; he first supported the Constitutional Revolution on condition it be bound by the shari'a, then turned against it, and was hanged by the constitutionalists at Tehran in 1909."
  ur: "قاجاری ایران کے اثنا عشری شیعہ فقیہ (1843–1909)۔ انہوں نے عراق کے عتبات میں مرزا حسن شیرازی سے تعلیم پائی اور تہران کے سب سے نمایاں عالم و فقیہ بنے؛ پہلے شریعت سے مشروط آئینی انقلاب کی حمایت کی، پھر اس کے خلاف ہو گئے، اور 1909 میں آئین پسندوں نے انہیں تہران میں پھانسی دی۔"
