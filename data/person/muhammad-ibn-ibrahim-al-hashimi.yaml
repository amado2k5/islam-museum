id: person/muhammad-ibn-ibrahim-al-hashimi
class: person
label: { ar: "محمد بن إبراهيم بن محمد بن علي", en: "Muhammad ibn Ibrahim ibn Muhammad ibn Ali", es: "Muhammad ibn Ibrahim ibn Muhammad ibn Ali", fr: "Muhammad ibn Ibrahim ibn Muhammad ibn Ali", ur: "محمد بن ابراہیم بن محمد ابن علی" }
summary:
  ar: "محمد بن إبراهيم بن محمد بن علي الهاشمي؛ عند البلاذري: أغزي إلى ملطية سنة 141 في جند من أهل خراسان وعلى شرطته المسيب بن زهير فرابط بها لئلا يطمع فيها العدو فتراجع إليها من كان باقياً من أهلها؛ ثم ولّاه موسى الهادي الجزيرة وقنسرين خلفاً لعلي بن سليمان ففرض لمدينة الحدث فرضاً من أهل الشام والجزيرة وخراسان في أربعين ديناراً من العطاء وأقطعهم المساكن وأعطى كل امرئ ثلاثمائة درهم وكان الفراغ منها سنة 169؛ وبنى زبطرة على يده الرشيد وشحنها وجرى أمر عمارة مدينة الحدث من قبل الرشيد على يده أيضاً ثم عُزل."
  en: "Muhammad ibn Ibrahim ibn Muhammad ibn Ali al-Hashimi; in al-Baladhuri: sent to Malatya in year 141 at the head of a Khurasani force with al-Musayyab ibn Zuhayr over his police, garrisoning it lest the enemy covet it until its remaining people returned; then Musa al-Hadi gave him the Jazira and Qinnasrin in place of Ali ibn Sulayman, and he levied for Madinat al-Hadath a contingent of Syrians, Jazirans and Khurasanis at forty dinars' pay, granting house-lots and three hundred dirhams a man — completed in year 169; al-Rashid built and garrisoned Zibatra by his hand, and the works of Madinat al-Hadath likewise ran on his authority for al-Rashid until he was removed."
  es: "Muhammad ibn Ibrahim ibn Muhammad ibn Ali al-Hashimi; en al-Baladhuri: enviado a Malatya en el año 141 al frente de una fuerza de Jorasán con al-Musayyab ibn Zuhayr al mando de su policía, guarnecándola para que el enemigo no la codiciara hasta que regresara su gente restante; luego Musa al-Hadi le dio Jazira y Qinnasrin en lugar de Ali ibn Sulayman, y él reclutó para Madinat al-Hadath un contingente de sirios, jaziranos y jorasaníes con un pago de cuarenta dinares, otorgando lotes de casas y trescientos dirhams por hombre, completado en el año 169; al-Rashid construyó y guarneció Zibatra por su mano, y las obras de Madinat al-Hadath también funcionaron bajo su autoridad para al-Rashid hasta que fue destituido."
  fr: "Muhammad ibn Ibrahim ibn Muhammad ibn Ali al-Hashimi; selon al-Baladhuri: envoyé à Malatya en l'an 141 à la tête d'une force khurasani avec al-Musayyab ibn Zuhayr à la tête de sa police, la garnisonnant de peur que l'ennemi ne la convoite jusqu'au retour de ses habitants restants; puis Musa al-Hadi lui donna la Jazira et Qinnasrin à la place d'Ali ibn Sulayman, et il leva pour Madinat al-Hadath un contingent de Syriens, de Jazirans et de Khurasanis avec une solde de quarante dinars, accordant des parcelles de terrain et trois cents dirhams par homme — achevé en l'an 169; al-Rashid construisit et garnit Zibatra de sa main, et les travaux de Madinat al-Hadath furent également menés sous son autorité pour al-Rashid jusqu'à sa destitution."
  ur: "محمد بن ابراہیم بن محمد بن علی الہاشمی ; البلادوری میں: سال 141 میں ایک خراسانی فوج کے سربراہ المصیاب ابن زہیر کے ساتھ ملطیہ کو اس کی پولیس پر بھیجا گیا، اسے اس وقت تک گھیرے میں لے لیا گیا جب تک کہ اس کے باقی ماندہ لوگ واپس نہ آ جائیں دشمن اس کا لالچ نہ کرے۔ پھر موسیٰ الہدی نے اسے علی بن سلیمان کی جگہ جزیرہ اور کنسرین دیا، اور اس نے مدینۃ الحدیث کے لیے شامیوں، جزیریوں اور خراسانیوں کا ایک دستہ چالیس دینار کی تنخواہ پر مقرر کیا، مکانات اور تین سو درہم ایک آدمی کو دیے جو کہ 169 میں مکمل ہوا۔ الرشید نے اپنے ہاتھ سے زبطرہ کو تعمیر کیا اور اس کی چوکیداری کی اور اسی طرح مدینۃ الحدث کے کام بھی الرشید کے لیے اس کے اختیار پر چلتے رہے یہاں تک کہ اسے ہٹا دیا گیا۔"
