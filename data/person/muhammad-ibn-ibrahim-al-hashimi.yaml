id: person/muhammad-ibn-ibrahim-al-hashimi
class: person
label: { ar: "محمد بن إبراهيم بن محمد بن علي", en: "Muhammad ibn Ibrahim ibn Muhammad ibn Ali" }
summary:
  ar: "محمد بن إبراهيم بن محمد بن علي الهاشمي؛ عند البلاذري: أغزي إلى ملطية سنة 141 في جند من أهل خراسان وعلى شرطته المسيب بن زهير فرابط بها لئلا يطمع فيها العدو فتراجع إليها من كان باقياً من أهلها؛ ثم ولّاه موسى الهادي الجزيرة وقنسرين خلفاً لعلي بن سليمان ففرض لمدينة الحدث فرضاً من أهل الشام والجزيرة وخراسان في أربعين ديناراً من العطاء وأقطعهم المساكن وأعطى كل امرئ ثلاثمائة درهم وكان الفراغ منها سنة 169؛ وبنى زبطرة على يده الرشيد وشحنها وجرى أمر عمارة مدينة الحدث من قبل الرشيد على يده أيضاً ثم عُزل."
  en: "Muhammad ibn Ibrahim ibn Muhammad ibn Ali al-Hashimi; in al-Baladhuri: sent to Malatya in year 141 at the head of a Khurasani force with al-Musayyab ibn Zuhayr over his police, garrisoning it lest the enemy covet it until its remaining people returned; then Musa al-Hadi gave him the Jazira and Qinnasrin in place of Ali ibn Sulayman, and he levied for Madinat al-Hadath a contingent of Syrians, Jazirans and Khurasanis at forty dinars' pay, granting house-lots and three hundred dirhams a man — completed in year 169; al-Rashid built and garrisoned Zibatra by his hand, and the works of Madinat al-Hadath likewise ran on his authority for al-Rashid until he was removed."
