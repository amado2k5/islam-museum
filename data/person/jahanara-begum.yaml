faith:
  - value: sufi
    basis: documented
    note: >-
      Two independent texts attest a completed personal discipleship
      for Jahanara herself. The English article's Sufism section
      states that, along with her brother Dara Shikoh, she was a
      disciple of Mullah Shah Badakhshi, who initiated her into the
      Qadiriyya Sufi order in 1641, that she made such progress on the
      Sufi path that Mullah Shah would have named her his successor in
      the Qadiriyya had the rules of the order allowed it, and that her
      own Risala-i Sahibiyya describes her initiation by him. The Urdu
      article's dedicated Sufi section, in its own text, independently
      states that she and her brother Dara Shikoh were disciples of
      Mullah Shah Badakhshi, who inducted them into the Qadiri order in
      1641, and that he wished to leave her the charge of the silsila
      after him but the order's rules did not permit it. A completed
      discipleship attested for the person herself counts under the
      founder rulings, so sufi is settled as documented. Her devotion
      to Muinuddin Chishti, whose biography she wrote and whom she
      regarded as her spiritual master although he died four centuries
      before her, is reverence for a long-dead saint and is not the
      attestation relied on. No text read names a legal school for her,
      and the Mughal court's Hanafi establishment is dynastic context
      that settles nothing, so no madhhab segment is recorded. Wikidata
      also files Sufism among her structured religion values;
      structured data never settles faith and is not relied on here.
    sources: [source/wikipedia-jahanara-begum-en, source/wikipedia-jahanara-begum-ur]

