summary:
  ar: "جهنرا بيغوم (1614 – 16 سبتمبر 1681) أميرة مغولية، أكبر بنات الإمبراطور شاه جهان والممتاز محل الباقيات، حملت ختم الإمبراطورية ولقب «بادشاه بيغوم» بعد وفاة أمها سنة 1631، وكانت أقوى نساء عصرها في البلاط. وهي أيضًا أديبة صوفية، مريدة ملا شاه البدخشي في الطريقة القادرية منذ 1641، ومؤلفة «مونس الأرواح» في سيرة معين الدين الجشتي و«رسالة صاحبية» في سيرة مرشدها."
  en: "Jahanara Begum (1614 – 16 September 1681) was a Mughal princess, the eldest surviving daughter of Emperor Shah Jahan and Mumtaz Mahal, who held the imperial seal and the title Padshah Begum after her mother's death in 1631 and was the most powerful woman of the imperial court. She was also a Sufi author — a disciple of Mullah Shah Badakhshi in the Qadiriyya order from 1641, and author of the Munis al-Arwah, a biography of Muinuddin Chishti, and the Risala-i Sahibiyya, a biography of her master."
  ur: "جہاں آرا بیگم (1614ء – 16 ستمبر 1681ء) مغل شہزادی تھیں، شہنشاہ شاہ جہاں اور ممتاز محل کی سب سے بڑی زندہ بچ جانے والی صاحبزادی، جنھوں نے 1631ء میں والدہ کی وفات کے بعد شاہی مہر اور «پادشاہ بیگم» کا لقب سنبھالا اور دربار کی سب سے طاقتور خاتون قرار پائیں۔ وہ صوفی مصنف بھی تھیں — 1641ء سے سلسلہ قادریہ میں ملا شاہ بدخشی کی مرید، اور معین الدین چشتی کی سوانح «مونس الارواح» اور اپنے مرشد کی سوانح «رسالہ صاحبیہ» کی مصنف۔"

