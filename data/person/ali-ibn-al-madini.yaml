summary:
  ar: "علي بن عبد الله بن جعفر بن نجيح السعدي، أبو الحسن الملقب بابن المديني، أحد أئمة الحديث وعلمائه ممن انعقد الإجماع على جلالته وإمامته، وله التصانيف الحسان. ولد سنة 161 وسمع ابن عيينة وحماد بن زيد وهشيمًا وابن وهب وعبد الرزاق ويحيى القطان وعبد الرحمن بن مهدي وخلقًا، وروى عنه البخاري وأبو داود وأحمد بن حنبل والذهلي وصالح جزرة وأبو يعلى الموصلي. قال أبو حاتم: كان ابن المديني علمًا في الناس في معرفة الحديث والعلل، وقال ابن عيينة: لولا ابن المديني ما جلست، وقال البخاري: ما استصغرت نفسي عند أحد إلا عند ابن المديني. أجاب في المحنة على خلق القرآن خشية السيف، وقال قبل موته بشهرين: القرآن كلام الله غير مخلوق ومن قال مخلوق فهو كافر. مات ليومين بقيا من ذي القعدة سنة 234 {cite:tabaqat-shafiiyya-subki p. 265-267}."
  en: "Ali ibn Abd Allah ibn Ja'far al-Sa'di, Abu'l-Hasan Ibn al-Madini (d. 234) — a hadith master on whose eminence consensus held; author of fine works. Heard Ibn 'Uyayna, Hammad b. Zayd, Hushaym, Ibn Wahb, 'Abd al-Razzaq, Yahya al-Qattan, Ibn Mahdi; transmitted to al-Bukhari, Abu Dawud, Ahmad, al-Dhuhli, Abu Ya'la. Abu Hatim: 'Ibn al-Madini was a landmark among men in hadith and its defects'; Ibn 'Uyayna: 'were it not for Ibn al-Madini I would not have sat'; al-Bukhari: 'I never felt small before anyone but Ibn al-Madini'. He answered in the mihna out of fear of the sword, then declared a month before his death: 'the Qur'an is the uncreated speech of God' {cite:tabaqat-shafiiyya-subki p. 265-267}."
  ur: "علی بن عبد اللہ بن جعفر سعدی، ابو الحسن المعروف ابن مدینی (مت 234ھ) — ائمۂ حدیث میں سے جن کی جلالت پر اجماع منعقد تھا۔ ابن عینہ، حماد بن زید، ہشیم، عبد الرزاق، یحییٰ قتان و ابن مہدی سے سنا؛ بخاری، ابو داؤد، احمد بن حنبل اور ابو یعلیٰ موصلی ان سے روایت کرتے ہیں۔ ابو حاتم کا کہنا ہے: ابن مدینی علمِ حدیث و علل میں لوگوں میں علم تھے؛ بخاری: میں نے ابن مدینی کے سوا کسی کے سامنے خود کو چھوٹا نہیں پایا۔ محنہ میں تلویر کے خوف سے جواب دیا، پھر وفات سے دو مہینے پہلے کہا: قرآن اللہ کا غیر مخلوق کلام ہے {cite:tabaqat-shafiiyya-subki p. 265-267}."
