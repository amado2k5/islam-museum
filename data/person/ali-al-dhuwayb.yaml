summary:
  ar: "الشيخ علي المعروف بالذويب الصالح المكاشف؛ أقام بمصر نحو عشرين سنة ثم نزل إلى الريف وظهرت له كرامات وخوارق، أخذ عن الشيخ محمد العدل الطناخي وغيره، وكان ملامياً يلبس تارة لباس الحمالين وتارة لباس الطراشين، ولما مات وجدوا في داره نحو ثمانين ألف دينار مع أنه كان متجرداً من الدنيا. قال الشعراني: اجتمعت به مرة واحدة عقب منام رأيته، وذلك أني سمعت قائلاً يقول لي في المنام: الشيخ علي الذويب قطب الشرقية، ولم أكن أسمع به أبداً فسألت الناس عنه فقالوا لي هذا رجل من أولياء الله؛ وكان يمشي كثيراً على الماء فإذا أبصره أحد اختفى، وكان يُرى كل سنة بعرفة ويختفي من الناس إذا عرفوه {cite:shadharat-dhahab p. 684-685}."
  en: "Qutb of the East per al-Sha'rani's dream — twenty years in Cairo then the countryside; he dressed sometimes as a porter, sometimes as a sweeper, walked on water vanishing when spotted, seen every year at 'Arafa; though utterly detached from the world they found about eighty thousand dinars in his house after his death {cite:shadharat-dhahab p. 684-685}."
