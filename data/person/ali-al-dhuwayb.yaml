summary:
  ar: "الشيخ علي المعروف بالذويب الصالح المكاشف؛ أقام بمصر نحو عشرين سنة ثم نزل إلى الريف وظهرت له كرامات وخوارق، أخذ عن الشيخ محمد العدل الطناخي وغيره، وكان ملامياً يلبس تارة لباس الحمالين وتارة لباس الطراشين، ولما مات وجدوا في داره نحو ثمانين ألف دينار مع أنه كان متجرداً من الدنيا. قال الشعراني: اجتمعت به مرة واحدة عقب منام رأيته، وذلك أني سمعت قائلاً يقول لي في المنام: الشيخ علي الذويب قطب الشرقية، ولم أكن أسمع به أبداً فسألت الناس عنه فقالوا لي هذا رجل من أولياء الله؛ وكان يمشي كثيراً على الماء فإذا أبصره أحد اختفى، وكان يُرى كل سنة بعرفة ويختفي من الناس إذا عرفوه {cite:shadharat-dhahab p. 684-685}."
  en: "Qutb of the East per al-Sha'rani's dream — twenty years in Cairo then the countryside; he dressed sometimes as a porter, sometimes as a sweeper, walked on water vanishing when spotted, seen every year at 'Arafa; though utterly detached from the world they found about eighty thousand dinars in his house after his death {cite:shadharat-dhahab p. 684-685}."
  fr: "Qutb de l'Est par le rêve d'al-Sha'rani - vingt ans au Caire puis à la campagne ; Il s'habillait tantôt comme un porteur, tantôt comme un balayeur, marchait sur l'eau qui disparaissait quand il était repéré, vu chaque année à 'Arafa ; bien que complètement détaché du monde, ils ont trouvé environ quatre-vingt mille dinars dans sa maison après sa mort {cite:shadharat-dhahab p. 684-685}."
  es: "Qutb del Este según el sueño de al-Sha'rani: veinte años en El Cairo y luego en el campo; a veces vestía de portero, a veces de barrendero, caminaba sobre el agua desapareciendo al ser visto, se le veía todos los años en Arafa; aunque estaba completamente desapegado del mundo, encontraron unos ochenta mil dinares en su casa después de su muerte {cita: shadharat-dhahab págs. 684-685}."
  ur: "قطب مشرق فی الشرانی کا خواب - بیس سال قاہرہ میں پھر دیہی علاقوں میں۔ وہ کبھی پورٹر کے طور پر، کبھی جھاڑو دینے والے کے طور پر، پانی پر چلتے ہوئے غائب ہو جاتے ہیں، ہر سال عرفہ میں دیکھا جاتا ہے؛ دنیا سے بالکل لاتعلق ہونے کے باوجود ان کی وفات کے بعد ان کے گھر سے تقریباً اسی ہزار دینار ملے۔ 684-685}۔"
  tr: "Şeyh Ali, Al-Dhuwayb Al-Salih Al-Makashif olarak bilinir, yaklaşık yirmi yıl Mısır'da yaşadıktan sonra kırsala taşındı; burada mucizeler ve doğaüstü olaylar ortaya çıktı. Şeyh Muhammed Al-Adl Al-Tanakhi ve diğerlerinin yanında eğitim aldı. Bazen hamal, bazen de hamal kıyafetleri giyen azarlayıcı bir adamdı. Öldüğünde, dünyadan kopuk olmasına rağmen evinde yaklaşık seksen bin dinar bulundu. Al-Sha'rani şöyle dedi: Onu bir kez rüyamda gördüm, çünkü rüyamda biri bana şöyle demişti: Şeyh Ali Al-Dhuwaib Doğu Kutbu'dur ve daha önce hiç duymamıştım. İnsanlara onun hakkında sordum, bana Tanrı'nın dostları arasında biri olduğunu, sık sık su üzerinde yürüdüğünü ve biri onu gördüğünde kaybolduğunu söylediler. Her yıl Arafah'ı görür ve insanlar onu tanıdıklarında kaybolurdu {cite::) Shadharat-Dhahab s. 684-685}."
  id: "Sheikh Ali, yang dikenal sebagai Al-Dhuwayb Al-Salih Al-Makashif, tinggal di Mesir selama sekitar dua puluh tahun sebelum pindah ke pedesaan, di mana mukjizat dan peristiwa supranatural muncul. Ia belajar di bawah bimbingan Sheikh Muhammad Al-Adl Al-Tanakhi dan lainnya. Ia adalah orang yang suka menegur, kadang mengenakan pakaian penjaga dan kadang pakaian penjaga barang. Ketika ia meninggal, mereka menemukan sekitar delapan puluh ribu dinar di rumahnya, meskipun ia terlepas dari dunia. Al-Sha'rani berkata: Saya pernah bertemu dengannya setelah bermimpi dan melihatnya, karena saya mendengar seseorang berkata kepada saya dalam mimpi: Sheikh Ali Al-Dhuwaib adalah Kutub Timur, dan saya belum pernah mendengarnya sebelumnya. Saya bertanya kepada orang-orang tentang dia, dan mereka mengatakan bahwa ia adalah pria di antara sahabat Tuhan; ia sering berjalan di atas air, dan setiap kali ada yang melihatnya, ia akan menghilang. Setiap tahun ia melihat Arafah dan menghilang dari orang-orang ketika mereka mengenalinya {cite:Shadharat-Dhahab hlm. 684-685}."
