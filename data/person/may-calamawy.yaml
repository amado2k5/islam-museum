summary:
  ar: "ممثلة مصرية-فلسطينية، وُلدت في البحرين سنة 1986 لأب مصري وأم فلسطينية-أردنية ونشأت بين البحرين وقطر والولايات المتحدة؛ عُرفت بدور دينا حسن في مسلسل «رامي» (2019–2022)، ثم بدور ليلى الفولي / الجعران القرمزي في «فارس القمر» (2022)، فكانت أول بطلة خارقة مصرية وعربية في عالم مارفل السينمائي، وأُدمجت إصابتها بداء الثعلبة في خط شخصيتها في «رامي»."
  en: "Egyptian-Palestinian actress, born in Bahrain in 1986 to an Egyptian father and a Palestinian-Jordanian mother and raised across Bahrain, Qatar and the United States. She is known for playing Dena Hassan in the Hulu series Ramy (2019–2022) and Layla El-Faouly / Scarlet Scarab in Moon Knight (2022), the first Egyptian and Arab superhero in the Marvel Cinematic Universe; her alopecia areata was written into her Ramy character's storyline."
  ur: "مصری-فلسطینی اداکارہ، 1986 میں بحرین میں ایک مصری والد اور فلسطینی-اردنی والدہ کے ہاں پیدا ہوئیں اور بحرین، قطر اور امریکا میں پلی بڑھیں؛ ہولو سلسلے «رامی» (2019–2022) میں دینا حسن اور «مون نائٹ» (2022) میں لیلیٰ الفولی / اسکارلٹ اسکریب کے کرداروں کے لیے معروف ہیں — مارول سنیماٹک یونیورس میں پہلی مصری اور عرب سپر ہیرو — اور ان کی ایلوپیشیا کو «رامی» میں ان کے کردار کی کہانی میں شامل کیا گیا۔"
