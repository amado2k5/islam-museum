summary:
  ar: "ممثلة مصرية-فلسطينية، وُلدت في البحرين سنة 1986 لأب مصري وأم فلسطينية-أردنية ونشأت بين البحرين وقطر والولايات المتحدة؛ عُرفت بدور دينا حسن في مسلسل «رامي» (2019–2022)، ثم بدور ليلى الفولي / الجعران القرمزي في «فارس القمر» (2022)، فكانت أول بطلة خارقة مصرية وعربية في عالم مارفل السينمائي، وأُدمجت إصابتها بداء الثعلبة في خط شخصيتها في «رامي»."
  en: "Egyptian-Palestinian actress, born in Bahrain in 1986 to an Egyptian father and a Palestinian-Jordanian mother and raised across Bahrain, Qatar and the United States. She is known for playing Dena Hassan in the Hulu series Ramy (2019–2022) and Layla El-Faouly / Scarlet Scarab in Moon Knight (2022), the first Egyptian and Arab superhero in the Marvel Cinematic Universe; her alopecia areata was written into her Ramy character's storyline."
  ur: "مصری-فلسطینی اداکارہ، 1986 میں بحرین میں ایک مصری والد اور فلسطینی-اردنی والدہ کے ہاں پیدا ہوئیں اور بحرین، قطر اور امریکا میں پلی بڑھیں؛ ہولو سلسلے «رامی» (2019–2022) میں دینا حسن اور «مون نائٹ» (2022) میں لیلیٰ الفولی / اسکارلٹ اسکریب کے کرداروں کے لیے معروف ہیں — مارول سنیماٹک یونیورس میں پہلی مصری اور عرب سپر ہیرو — اور ان کی ایلوپیشیا کو «رامی» میں ان کے کردار کی کہانی میں شامل کیا گیا۔"
  es: "Actriz egipcio-palestina, nacida en Bahréin en 1986 de padre egipcio y madre palestina-jordana, y criada en Bahréin, Catar y Estados Unidos. Es conocida por interpretar a Dena Hassan en la serie de Hulu Ramy (2019-2022) y a Layla El-Faouly / Scarlet Scarab en Moon Knight (2022), la primera superheroína egipcia y árabe del Universo Cinematográfico de Marvel; su alopecia areata se incorporó a la trama de su personaje en Ramy."
  fr: "Actrice égypto-palestinienne, née à Bahreïn en 1986 d'un père égyptien et d'une mère palestino-jordanienne, elle a grandi entre Bahreïn, le Qatar et les États-Unis. Elle est connue pour ses rôles de Dena Hassan dans la série Ramy (2019-2022) diffusée sur Hulu et de Layla El-Faouly / Scarlet Scarab dans Moon Knight (2022), la première super-héroïne égyptienne et arabe de l'univers cinématographique Marvel; son alopécie areata a été intégrée à l'histoire de son personnage dans Ramy."
  tr: "1986'da Bahreyn'de Mısırlı bir baba ve Filistin-Ürdünlü bir annenin çocuğu olarak doğan Mısırlı-Filistinli bir oyuncu olan Sherly, Bahreyn, Katar ve Amerika Birleşik Devletleri arasında büyüdü. \"Rami\" (2019–2022) dizisinde Dina Hassan rolüyle, ardından \"The Moon Knight\" (2022) dizisinde Laila El-Foly / Kızıl Scarab rolüyle tanındı. Marvel Sinematik Evreni'ndeki ilk Mısırlı ve Arap süper kahraman oldu ve alopesi teşhisi \"Rami\" karakterine entegre edildi."
  id: "Seorang aktris Mesir-Palestina, lahir di Bahrain pada tahun 1986 dari ayah Mesir dan ibu Palestina-Yordania, ia tumbuh di antara Bahrain, Qatar, dan Amerika Serikat. Ia dikenal lewat perannya sebagai Dina Hassan dalam serial \"Rami\" (2019–2022), lalu sebagai Laila El-Foly / The Scarlet Scarab dalam \"The Moon Knight\" (2022). Ia adalah pahlawan wanita Mesir dan Arab pertama di Marvel Cinematic Universe, dan diagnosis alopecia yang didiagnosis dalam karakternya di \"Rami.\""
