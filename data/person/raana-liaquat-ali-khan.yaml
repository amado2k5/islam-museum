summary:
  ar: "سيدة دولة وخبيرة اقتصاد باكستانية (1905–1990)، زوجة لياقت علي خان وأول سيدة أولى لباكستان (1947–1951). وُلدت شيلا إيرين بانت في ألمورا لأسرة مسیحیة، واعتنقت الإسلام عند زواجها سنة 1932. أسست جمعية المرأة الباكستانية (أبوا) سنة 1949، وكانت أول مندوبة مسلمة لدى الأمم المتحدة (1952) وأول سفيرة لباكستان (هولندا، 1954–1961)، وأول امرأة تتولى حاكمية إقليم باكستاني (السند، 1973–1976)."
  en: "Pakistani stateswoman and economist (1905–1990), the wife of Liaquat Ali Khan and Pakistan's first First Lady (1947–1951). Born Sheila Irene Pant at Almora into a Christian family, she converted to Islam at her marriage in 1932. She founded the All Pakistan Women's Association (APWA) in 1949, was the first Muslim woman delegate to the United Nations (1952) and Pakistan's first woman ambassador (the Netherlands, 1954–1961), and the first woman governor of a Pakistani province (Sindh, 1973–1976)."
  ur: "پاکستانی خاتون مدبر اور ماہرِ معاشیات (1905ء–1990ء)، لیاقت علی خان کی اہلیہ اور پاکستان کی پہلی خاتونِ اول (1947ء–1951ء)۔ وہ المورا میں ایک مسیحی خاندان میں شیلا آئرین پنت کے نام سے پیدا ہوئیں اور 1932ء میں اپنی شادی کے موقع پر اسلام قبول کیا۔ انھوں نے 1949ء میں آل پاکستان ویمنز ایسوسی ایشن (اپوا) قائم کی، 1952ء میں اقوامِ متحدہ میں پہلی مسلم خاتون مندوب بنیں، پاکستان کی پہلی خاتون سفیر (ہالینڈ، 1954ء–1961ء) اور کسی پاکستانی صوبے کی پہلی خاتون گورنر (سندھ، 1973ء–1976ء) رہیں۔"
