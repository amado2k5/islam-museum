summary:
  ar: "المحدث أبو عمر محمد بن العباس بن حيويه البغدادي الخزاز، راوي كتاب الزهد عن ابن صاعد؛ قال الخطيب ثقة كتب طول عمره وروى المصنفات الكبار، وتوفي في ربيع الآخر سنة 382 وله سبع وثمانون سنة كما ينقل ابن العماد {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 304}."
  en: "The hadith transmitter Abu Umar Muhammad ibn al-Abbas ibn Hayyuya al-Baghdadi al-Khazzaz, who transmitted Kitab al-Zuhd from Ibn Sa'id; al-Khatib called him trustworthy, writing all his life and transmitting the great compilations; he died in Rabi' al-Akhir 382 aged eighty-seven, as Ibn al-Imad reports {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 304}."
  ur: "محدث ابو عمر محمد بن عباس بن حیویہ بغدادی خزاز، ابن صاعد سے کتاب الزہد کے راوی؛ خطیب نے انہیں ثقہ کہا، عمر بھر لکھتے رہے اور بڑی تصانیف روایت کیں؛ ابن العماد کے مطابق ربیع الآخر 382 میں ستاسی برس کی عمر میں وفات پائی {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 304}۔"
  es: "El transmisor de hadices Abu Umar Muhammad ibn al-Abbas ibn Hayyuya al-Baghdadi al-Khazzaz, quien transmitió Kitab al-Zuhd de Ibn Sa'id; al-Khatib lo llamó digno de confianza, escribió toda su vida y transmitió las grandes compilaciones; murió en Rabi' al-Akhir 382 a la edad de ochenta y siete años, como informa Ibn al-Imad {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 304}."
  fr: "Le transmetteur de hadiths Abu Umar Muhammad ibn al-Abbas ibn Hayyuya al-Baghdadi al-Khazzaz, qui a transmis le Kitab al-Zuhd d'Ibn Sa'id; al-Khatib l'a qualifié de digne de confiance, écrivant toute sa vie et transmettant les grandes compilations; il est mort en Rabi' al-Akhir 382 à l'âge de quatre-vingt-sept ans, comme le rapporte Ibn al-Imad {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 304}."
  tr: "Hadis âlimi Ebu Ömer Muhammed bin el-Abbas ibn Hayvey-el-Bağdadi el-Hazaz, İbn Seyid'den al-Zuhd kitabının anlatıcısı; vaiz, güvenilir olduğunu, hayatı boyunca yazdığını, önemli eserleri rivayet ettiğini ve İbn el-İmad'ın aktardığına göre 382 yılında Rebi'l-Akhir'de seksen yedi yaşında öldüğünü {cite:zuhd-ibn-mubarak-farid-1995-v1, s. 101} {cite:zuhd-ibn-mubarak-azami-scan s. 304} tarafından aktarılmıştır."
  id: "Ulama hadis Abu Umar Muhammad ibn al-Abbas ibn Haywayh al-Baghdadi al-Khazzaz, narator kitab al-Zuhd dari Ibn Sa'id; pendakwah mengatakan bahwa ia dapat dipercaya, menulis sepanjang hidupnya, menceritakan karya-karya utama, dan meninggal di Rabi' al-Akhir pada tahun 382 pada usia delapan puluh tujuh tahun sebagaimana dilaporkan oleh Ibn al-Imad {cite:zuhd-ibn-mubarak-farid-1995-v1, hlm. 101} {cite:zuhd-ibn-mubarak-azami-scan hlm. 304}."
