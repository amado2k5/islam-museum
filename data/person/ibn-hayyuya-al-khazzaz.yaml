summary:
  ar: "المحدث أبو عمر محمد بن العباس بن حيويه البغدادي الخزاز، راوي كتاب الزهد عن ابن صاعد؛ قال الخطيب ثقة كتب طول عمره وروى المصنفات الكبار، وتوفي في ربيع الآخر سنة 382 وله سبع وثمانون سنة كما ينقل ابن العماد {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 304}."
  en: "The hadith transmitter Abu Umar Muhammad ibn al-Abbas ibn Hayyuya al-Baghdadi al-Khazzaz, who transmitted Kitab al-Zuhd from Ibn Sa'id; al-Khatib called him trustworthy, writing all his life and transmitting the great compilations; he died in Rabi' al-Akhir 382 aged eighty-seven, as Ibn al-Imad reports {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 304}."
  ur: "محدث ابو عمر محمد بن عباس بن حیویہ بغدادی خزاز، ابن صاعد سے کتاب الزہد کے راوی؛ خطیب نے انہیں ثقہ کہا، عمر بھر لکھتے رہے اور بڑی تصانیف روایت کیں؛ ابن العماد کے مطابق ربیع الآخر 382 میں ستاسی برس کی عمر میں وفات پائی {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 101} {cite:zuhd-ibn-mubarak-azami-scan p. 304}۔"
