summary:
  ar: "تركي بن سعيد بن سلطان البوسعيدي ⁦(وُلد في مسقط سنة 1832 – توفي فيها في 4 يونيو 1888)⁩، سلطان مسقط وعمان من 30 يناير 1871 إلى وفاته، وابن السلطان سعيد بن سلطان من أم إثيوبية. عُيّن واليًا على صحار سنة 1854، وثار على أخيه السلطان ثويني سنة 1861 فسُجن مرتين وتدخلت بريطانيا لإطلاقه، ونُفي إلى بومباي على معاش، ثم عاد بأموال أخيه ماجد سلطان زنجبار وتحالفات القبائل فهزم الإمام عزان بن قيس في معركة ضنك ودخل مسقط سنة 1871، وأعاد بناء إدارة الدولة بعد مرضه وإنابة أخيه عبد العزيز، وحكم حتى وفاته فخلفه ابنه الثاني فيصل."
  en: "Turki bin Said bin Sultan Al Busaidi (born at Muscat in 1832 – died there on 4 June 1888) was Sultan of Muscat and Oman from 30 January 1871 until his death, a son of Sultan Said bin Sultan by an Ethiopian mother. Appointed Wali of Sohar in 1854, he revolted against his brother Sultan Thuwaini in 1861, was twice imprisoned and twice released through British intervention, and lived in exile in Bombay on an annuity; he then returned with money from his brother Majid, Sultan of Zanzibar, and tribal alliances, defeated Imam Azzan bin Qais at the Battle of Dhank and entered Muscat in 1871, rebuilt the state's administration after his illness and his brother Abd al-Aziz's deputyship, and ruled until his death, when his second son Faisal succeeded him."
  ur: "ترکی بن سعید بن سلطان البوسعیدی ⁦(پیدائش: مسقط، 1832ء – وفات: مسقط، 4 جون 1888ء)⁩، 30 جنوری 1871ء سے وفات تک مسقط و عمان کے سلطان اور سلطان سعید بن سلطان کے بیٹے تھے۔ وہ 1854ء میں صحار کے والی بنے، بھائی ثوینی سے بغاوت پر دو بار قید ہوئے، بمبئی میں جلاوطنی گزاری، پھر بھائی ماجد کی مالی مدد سے واپس آ کر امام عزان بن قیس کو ضنک میں شکست دی اور 1871ء میں مسقط میں داخل ہوئے؛ ان کے بعد ان کے بیٹے فیصل سلطان بنے۔"
  es: "Turki bin Said bin Sultan Al Busaidi (nacido en Mascate en 1832 y fallecido allí el 4 de junio de 1888) fue sultán de Mascate y Omán desde el 30 de enero de 1871 hasta su muerte. Era hijo del sultán Said bin Sultan y de una madre etíope. Nombrado gobernador de Sohar en 1854, se rebeló contra su hermano, el sultán Thuwaini, en 1861. Fue encarcelado dos veces y liberado dos veces gracias a la intervención británica. Vivió en el exilio en Bombay con una renta vitalicia. Posteriormente, regresó con dinero de su hermano Majid, sultán de Zanzíbar, y con alianzas tribales. Derrotó al imán Azzan bin Qais en la batalla de Dhank y entró en Mascate en 1871. Reconstruyó la administración del estado tras su enfermedad y la sucesión de su hermano Abd al-Aziz como lugarteniente, y gobernó hasta su muerte, cuando le sucedió su segundo hijo, Faisal."
  fr: "Turki bin Said bin Sultan Al Busaidi (né à Mascate en 1832 – décédé dans la même ville le 4 juin 1888) fut sultan de Mascate et d'Oman du 30 janvier 1871 jusqu'à sa mort. Fils du sultan Said bin Sultan et d'une mère éthiopienne, il fut nommé wali de Sohar en 1854. En 1861, il se révolta contre son frère, le sultan Thuwaini, et fut emprisonné à deux reprises, puis libéré deux fois grâce à l'intervention britannique. Il vécut en exil à Bombay, bénéficiant d'une rente. De retour au pays avec l'aide financière de son frère Majid, sultan de Zanzibar, et grâce à des alliances tribales, il vainquit l'imam Azzan bin Qais à la bataille de Dhank et entra à Mascate en 1871. Après sa maladie et la succession de son frère Abd al-Aziz, il reconstruisit l'administration de l'État et régna jusqu'à sa mort, à laquelle son second fils, Faisal, lui succéda."
  tr: "Turki bin Saeed bin Sultan Al-Busaidi (1832'de Muskat'ta doğdu – 4 Haziran 1888'de orada vefat etti), 30 Ocak 1871'den ölümüne kadar Muskat ve Umman Sultanı ve Etiyopyalı bir anneden olan Sultan Said bin Sultan'ın oğluydu. 1854'te Sohar valisi olarak atandı ve 1861'de kardeşi Sultan Thuwaini'ye karşı isyan etti, iki kez hapsedildi ve Britanya müdahale ederek serbest bırakıldı. Emekli maaşıyla Bombay'a sürgün edildi. Daha sonra kardeşi Majid, Zanzibar Sultanı ve kabile ittifaklarıyla geri döndü, İmam Azan bin Qais'i Dhank Savaşı'nda yendi ve 1871'de Maskat'a girdi. Hastalığından sonra devletin yönetimini yeniden inşa etti ve kardeşi Abdul Aziz'in yerine geçti; Abdul Aziz'in ölümüne kadar hüküm sürdü, ardından ikinci oğlu Faisal geçti."
  id: "Turki bin Saeed bin Sultan Al-Busaidi (lahir di Muscat pada 1832 – meninggal di sana pada 4 Juni 1888), Sultan Muscat dan Oman dari 30 Januari 1871 hingga kematiannya, dan putra Sultan Said bin Sultan dari ibu Ethiopia. Ia diangkat menjadi gubernur Sohar pada 1854, dan memberontak melawan saudaranya Sultan Thuwaini pada 1861, dipenjara dua kali, dan Inggris turun tangan untuk membebaskannya. Ia diasingkan ke Bombay dengan pensiun. Ia kemudian kembali dengan kekayaan saudaranya Majid, Sultan Zanzibar, dan aliansi suku, mengalahkan Imam Azan bin Qais dalam Pertempuran Dhank dan memasuki Muscat pada 1871. Setelah sakit, ia membangun kembali administrasi negara dan menggantikan saudaranya Abdul Aziz, memerintah hingga kematiannya, setelah itu digantikan oleh putra keduanya Faisal."
