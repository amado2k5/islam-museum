summary:
  ar: "تركي بن سعيد بن سلطان البوسعيدي (وُلد في مسقط سنة 1832 – توفي فيها في 4 يونيو 1888)، سلطان مسقط وعمان من 30 يناير 1871 إلى وفاته، وابن السلطان سعيد بن سلطان من أم إثيوبية. عُيّن واليًا على صحار سنة 1854، وثار على أخيه السلطان ثويني سنة 1861 فسُجن مرتين وتدخلت بريطانيا لإطلاقه، ونُفي إلى بومباي على معاش، ثم عاد بأموال أخيه ماجد سلطان زنجبار وتحالفات القبائل فهزم الإمام عزان بن قيس في معركة ضنك ودخل مسقط سنة 1871، وأعاد بناء إدارة الدولة بعد مرضه وإنابة أخيه عبد العزيز، وحكم حتى وفاته فخلفه ابنه الثاني فيصل."
  en: "Turki bin Said bin Sultan Al Busaidi (born at Muscat in 1832 – died there on 4 June 1888) was Sultan of Muscat and Oman from 30 January 1871 until his death, a son of Sultan Said bin Sultan by an Ethiopian mother. Appointed Wali of Sohar in 1854, he revolted against his brother Sultan Thuwaini in 1861, was twice imprisoned and twice released through British intervention, and lived in exile in Bombay on an annuity; he then returned with money from his brother Majid, Sultan of Zanzibar, and tribal alliances, defeated Imam Azzan bin Qais at the Battle of Dhank and entered Muscat in 1871, rebuilt the state's administration after his illness and his brother Abd al-Aziz's deputyship, and ruled until his death, when his second son Faisal succeeded him."
  ur: "ترکی بن سعید بن سلطان البوسعیدی (پیدائش: مسقط، 1832ء – وفات: مسقط، 4 جون 1888ء)، 30 جنوری 1871ء سے وفات تک مسقط و عمان کے سلطان اور سلطان سعید بن سلطان کے بیٹے تھے۔ وہ 1854ء میں صحار کے والی بنے، بھائی ثوینی سے بغاوت پر دو بار قید ہوئے، بمبئی میں جلاوطنی گزاری، پھر بھائی ماجد کی مالی مدد سے واپس آ کر امام عزان بن قیس کو ضنک میں شکست دی اور 1871ء میں مسقط میں داخل ہوئے؛ ان کے بعد ان کے بیٹے فیصل سلطان بنے۔"
