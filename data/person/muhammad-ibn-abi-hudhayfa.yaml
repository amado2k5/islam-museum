summary:
  ar: "ولد بأرض الحبشة لأبيه أبي حذيفة، ذكره ابن إسحاق في «أبنائهم بالحبشة» من بني عبد شمس."
  en: Born in the land of Abyssinia to his father Abu Hudhayfa; Ibn Ishaq names him among 'their children in Abyssinia' of Banu Abd Shams.
  ur: "حبشہ میں اپنے والد ابو حذیفہ سے پیدا ہوا؛ ابن اسحاق اسے بنو عبد شمس کے «وہاں پیدا ہونے والے بچوں» میں گنتا ہے۔"
  es: "Nacido en la tierra de Abisinia, hijo de Abu Hudhayfa, Ibn Ishaq lo menciona entre \"sus hijos en Abisinia\" de Banu Abd Shams."
  fr: "Né en Abyssinie, fils d'Abu Hudhayfa, Ibn Ishaq le cite parmi « leurs enfants en Abyssinie » des Banu Abd Shams."
  tr: "Babası Abu Hudhayfah'ın oğlu olarak Habeşistan topraklarında doğdu; babası Banu Abd Shams'ın 'Onların Habeşistan'daki Oğulları'nda İbn İshaq tarafından bahsedilmiştir."
  id: "Ia lahir di tanah Abyssinia dari ayahnya Abu Hudhayfah, yang disebutkan oleh Ibn Ishaq dalam 'Anak-anak Mereka di Abyssinia' dari Banu Abd Shams."
