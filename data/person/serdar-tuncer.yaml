summary:
  ar: "شاعر وكاتب ومقدّم تلفزيوني تركي، وُلد في 16 أغسطس 1978 في ألتينداغ بأنقرة، بدأ مسيرته الإعلامية سنة 1996 في إذاعة بيرق بأنقرة، وقدّم برامج ثقافية ورمضانية على قنوات تركية عدة، وألّف كتبًا شعرية وقصصية وأصدر ألبومات شعرية، وهو الوجه المعروف لقناة ماي مجرا على يوتيوب. بلغت قناته الخاصة على يوتيوب 249,000 مشترك كما في 13 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish poet, writer and television presenter, born on 16 August 1978 in Altındağ, Ankara. He began his broadcasting career in 1996 at Ankara Bayrak Radio, presented cultural and Ramadan programmes on several Turkish channels, wrote poetry and story books and released poetry albums, and is the best-known face of the MyMecra YouTube channel. His own YouTube channel counted 249,000 subscribers as of 13 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک شاعر، مصنف اور ٹیلی ویژن میزبان، جو 16 اگست 1978ء کو انقرہ کے علاقے التینداغ میں پیدا ہوئے، 1996ء میں انقرہ بیرق ریڈیو سے نشریاتی زندگی شروع کی، کئی ترک چینلوں پر ثقافتی اور رمضان پروگرام پیش کیے، شاعری اور کہانیوں کی کتابیں لکھیں اور شعری البم جاری کیے، اور مائی میجرا یوٹیوب چینل کا معروف چہرہ ہیں۔ vidIQ کے مطابق 13 نومبر 2026ء کو ان کے اپنے یوٹیوب چینل کے سبسکرائبر 249,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Poeta, escritor y presentador de televisión turco, nacido el 16 de agosto de 1978 en Altındağ, Ankara. Inició su carrera en la radiodifusión en 1996 en Ankara Bayrak Radio, presentó programas culturales y de Ramadán en varios canales turcos, escribió libros de poesía y cuentos, publicó álbumes de poesía y es el rostro más conocido del canal de YouTube MyMecra. Su propio canal de YouTube contaba con 249 000 suscriptores al 13 de noviembre de 2026, según vidIQ (dato desactualizado de la plataforma, no verificado por ningún museo)."
  fr: "Poète, écrivain et présentateur de télévision turc, né le 16 août 1978 à Altındağ, Ankara. Il a débuté sa carrière audiovisuelle en 1996 à la radio Ankara Bayrak, a animé des émissions culturelles et des programmes pour le Ramadan sur plusieurs chaînes turques, a écrit des recueils de poésie et de nouvelles, et a publié des albums de poésie. Il est la figure emblématique de la chaîne YouTube MyMecra. Sa propre chaîne YouTube comptait 249 000 abonnés au 13 novembre 2026 selon vidIQ – un chiffre ancien, non vérifié par un musée."
  tr: "Türk şair, yazar ve televizyon sunucusu, 16 Ağustos 1978'de Ankara'nın Altındağ'da doğdu. Medya kariyerine 1996'da Ankara'daki Bayrak Radyo'da başladı, çeşitli Türk kanallarında kültürel ve Ramazan programları sundu, şiir ve hikaye kitapları yazdı, şiir albümleri çıkardı. YouTube'daki My Majra kanalının tanınmış yüzü. Kendi YouTube kanalı, müze olarak doğrulanmayan tarihçi platform numarasına göre 13 Kasım 2026 itibarıyla 249.000 aboneye ulaştı."
  id: "Seorang penyair, penulis, dan pembawa acara televisi Turki, lahir pada 16 Agustus 1978 di Altındağ, Ankara. Ia memulai karier medianya pada tahun 1996 di Bayrak Radio di Ankara, membawakan program budaya dan Ramadan di beberapa saluran Turki, menulis puisi dan buku cerita, serta merilis album puisi. Ia adalah wajah terkenal dari saluran My Majra di YouTube. Saluran YouTube-nya sendiri mencapai 249.000 pelanggan per 13 November 2026, menurut vidIQ, nomor platform sejarawan yang belum terverifikasi sebagai museum."
