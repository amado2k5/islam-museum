summary:
  ar: "إبراهيم رئيسي (14 كانون الأول 1960 – 19 أيار 2024) فقيه وسياسي إيراني، رئيس إيران من 3 آب 2021 خلفًا لحسن روحاني حتى وفاته في تحطم مروحية قرب ورزقان، وقبلها رئيس السلطة القضائية (2019–2021) وعضو مجلس الخبراء وسادن العتبة الرضوية في مشهد حيث وُلد ودُفن."
  en: "Ebrahim Raisi (14 December 1960 – 19 May 2024) was an Iranian jurist and politician who served as president of Iran from 3 August 2021, succeeding Hassan Rouhani, until his death in a helicopter crash near Varzaqan. He had earlier been chief justice (2019–2021), a member of the Assembly of Experts and custodian of the Imam Reza shrine at Mashhad, where he was born and is buried."
