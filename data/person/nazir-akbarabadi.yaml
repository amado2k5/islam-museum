summary:
  ar: "نظير أكبر آبادي (1735 – 1830)، المولود ولي محمد، شاعر هندي باللغة الأردية يُلقَّب بأبي النظم. وُلد في دلهي وانتقل صبياً مع أمه وجدته إلى أكبر آباد (أغرة) سنة 1757، فعاش فيها وكتب غزليات ونظومات بلغة الناس اليومية عن أعياد المسلمين والهندوس والأسواق والفقر، فصار شاعر العامة، ومن أشهر نظوماته «بنجار نامه». توفي سنة 1830 عن نحو خمسة وتسعين عاماً."
  en: "Nazeer Akbarabadi (1735–1830), born Wali Muhammad, was an Indian Urdu poet known as the Father of Nazm. Born in Delhi, he migrated as a boy with his mother and grandmother to Akbarabad (Agra) in 1757 and lived there, writing ghazals and nazms in the everyday language of the common people about Muslim and Hindu festivals, markets and poverty, becoming the poet of the masses; his Banjaranama is his best remembered poem. He died in 1830 at about ninety-five."
  ur: "نظیر اکبر آبادی (1735ء – 1830ء)، اصل نام ولی محمد، ہندوستانی اردو شاعر تھے جنھیں ”نظم کا باپ“ کہا جاتا ہے۔ دہلی میں پیدا ہوئے اور 1757ء میں والدہ اور نانی کے ہمراہ اکبر آباد (آگرہ) منتقل ہو گئے، وہیں عمر گزاری اور عوام کی روزمرہ زبان میں غزلیں اور نظمیں لکھیں جن میں مسلمانوں اور ہندوؤں کے تہوار، بازار اور مفلسی جیسے موضوعات آئے؛ ان کی نظم ”بنجار نامہ“ سب سے مشہور ہے۔ 1830ء میں تقریباً پچانوے برس کی عمر میں انتقال ہوا۔"

