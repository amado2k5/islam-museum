label: { ar: "المعتز بالله", en: "al-Mu'tazz bi-llah", fr: "al-Mu'tazz bi-llah", es: "al-Mu'tazz bi-llah", ur: "المعتز باللہ" }
summary:
  ar: "خليفة عباسي، بويع له في المحرم سنة اثنتين وخمسين ومائتين بعد خلع المستعين {cite:tabari-tarikh-abu-al-fadl j.9 p.348}، ثم خُلع في رجب سنة خمس وخمسين ومات في شعبان {cite:tabari-tarikh-abu-al-fadl j.9 p.389} {cite:tabari-tarikh-abu-al-fadl j.9 p.390}، وعند السيوطي كان ثاني الأعهد بعد المنتصر وقبل المؤيد، وأراد المتوكل تقديمه لمحبته لأمه قبيحة التي كان مشغوفاً بها لا يصبر عنها {cite:tarikh-khulafa-minhaj-1434 p. 543}، وعند السيوطي بويع له عند خلع المستعين سنة اثنتين وخمسين وله تسع عشرة سنة ولم يل الخلافة قبله أحد أصغر منه، وأول سنة تولى مات أشناس وخلف خمس مئة ألف دينار فأخذها، وأول خليفة أحدث الركوب بحلية الذهب وكان الخلفاء قبله يركبون بالحلية الخفيفة من الفضة، وخلع خلعة الملك على محمد بن عبد الله بن طاهر ثم عزله ثم على أخيه أبي أحمد وتوجه بتاج ووشاحين وسيفين ثم عزله ونفاه إلى واسط ثم على بغا الشرابي فخرج عليه بعد سنة فقتل، وفي رجب خلع أخاه المؤيد وضربه وقيده فمات {cite:tarikh-khulafa-minhaj-1434 p. 557-558}. وعند المسعودي كان المتوكل أقامه ثانياً في ولاية العهد بعد المنتصر فخلعه المنتصر وأخوه إبراهيم سنة ثمان وأربعين ومائتين {cite:muruj-al-dhahab p. 519}، وعند المسعودي هو الزبير بن جعفر المتوكل وأمه أم ولد يقال لها قبيحة، بويع يوم الخميس لليلتين خلتا من المحرم سنة اثنتين وخمسين ومائتين وله ثماني عشرة سنة، ثم خلع نفسه يوم الاثنين لثلاث بقين من رجب سنة خمس وخمسين ومات بعدها بستة أيام وله أربع وعشرون سنة فدفن بسامرا، وقال البحتري في خلع المستعين لينبت في لحم الدجاج مخالب إلى واسط خلف الدجاج {cite:muruj-al-dhahab p. 547-548}، وعند المسعودي صار إليه الأتراك بأجمعهم لأربع بقين من رجب سنة خمس وخمسين ومائتين يقودهم صالح بن وصيف يقرعونه بذنوبه ويطالبونه بالأموال فأجاب إلى الخلع على الأمان وقتل في محبسه بعد خلعه بستة أيام، وكان أول خليفة أظهر الركوب بحلية الذهب بعد أن كان الخلفاء يركبون بالحلية الخفيفة من الفضة {cite:muruj-al-dhahab p. 553-554}"
  en: "Abbasid caliph, given the oath in Muharram 252 after al-Musta'in was deposed {cite:tabari-tarikh-abu-al-fadl j.9 p.348}; he was deposed in Rajab 255 and died in Sha'ban {cite:tabari-tarikh-abu-al-fadl j.9 p.389} {cite:tabari-tarikh-abu-al-fadl j.9 p.390}. According to al-Suyuti he was second in succession after al-Muntasir and before al-Mu'ayyad; al-Mutawakkil wished to advance him, out of love for his mother Qabiha, without whom he could not be patient {cite:tarikh-khulafa-minhaj-1434 p. 543}. According to al-Suyuti he was given the oath when al-Musta'in was deposed in 252, at nineteen; no caliph before him had come to the throne younger. In the first year of his reign Ashnas died leaving five hundred thousand dinars, which he took. He was the first caliph to ride with gold trappings; the caliphs before him had ridden with light silver trappings. He conferred the robe of rule on Muhammad ibn Abd Allah ibn Tahir, then dismissed him; then on his brother Abu Ahmad, who was crowned with a crown, two sashes and two swords; then he dismissed him and exiled him to Wasit; then he conferred it on Baga al-Sharabi, who rose against him a year later and was killed. In Rajab he deposed his brother al-Mu'ayyad, beat him and shackled him, and he died {cite:tarikh-khulafa-minhaj-1434 p. 557-558}. According to al-Mas'udi, al-Mutawakkil had made him second in succession after al-Muntasir, and al-Muntasir and his brother Ibrahim deposed him in 248 {cite:muruj-al-dhahab p. 519}. According to al-Mas'udi he is al-Zubayr ibn Ja'far al-Mutawakkil, and his mother was a slave-mother called Qabiha. He was given the oath on Thursday, two nights into Muharram 252, at eighteen; he deposed himself on Monday, three nights before the end of Rajab 255, and died six days later at twenty-four and was buried at Samarra. Al-Buhturi, on the deposition of al-Musta'in, composed a jibe sending him off to Wasit: 'Let claws grow in the flesh of chickens, as far as Wasit, behind the chicken' {cite:muruj-al-dhahab p. 547-548}. According to al-Mas'udi, all the Turks came to him on four nights before the end of Rajab 255, led by Salih ibn Wasif, rebuking him for his sins and demanding money; he agreed to abdicate on terms of safe-conduct, and was killed in his confinement six days after his deposition. He was the first caliph to display riding with gold trappings, when the caliphs before him had ridden with light silver trappings {cite:muruj-al-dhahab p. 553-554}."
  fr: "calife abbasside, a prêté serment dans Muharram 252 après qu'al-Musta'in a été déposé {cite:tabari-tarikh-abu-al-fadl j.9 p.348}; il fut déposé à Rajab 255 et mourut à chaabane {cite:tabari-tarikh-abu-al-fadl j.9 p.389} {cite:tabari-tarikh-abu-al-fadl j.9 p.390}. Selon al-Suyuti, il était le deuxième après al-Muntasir et avant al-Mu'ayyad ; al-Mutawakkil voulait l'avancer, par amour pour sa mère Qabiha, sans qui il ne pourrait pas être patient {cite:tarikh-khulafa-minhaj-1434 p. 543}. Selon al-Suyuti, il a prêté serment quand al-Musta'in a été déposé en 252, à dix-neuf ans ; Aucun calife avant lui n'était monté sur le trône plus jeune. La première année de son règne, Ashnas mourut en laissant cinq cent mille dinars qu'il prit. Il fut le premier calife à chevaucher avec des pièges en or  ; les califes avant lui avaient chevauché avec de légers pièges en argent. Il a conféré la robe de règle à Muhammad ibn Abd Allah ibn Tahir, puis l'a renvoyé. puis sur son frère Abou Ahmad, qui fut couronné d'une couronne, de deux ceintures et de deux épées ; Puis il le congédia et l'exila à Wasit  ; puis il le confia à Baga al-Sharabi, qui se leva contre lui un an plus tard et fut tué. A Rajab, il déposa son frère al-Mu'ayyad, le battit et le ligota {cite:tarikh-khulafa-minhaj-1434 p. 557-558}. Selon al-Mas'udi, al-Mutawakkil l'avait fait deuxième de suite après al-Muntasir, et al-Muntasir et son frère Ibrahim l'avaient déposé en 248 {cite:muruj-al-dhahab p. 519}. Selon al-Mas'udi, il est al-Zubayr ibn Ja'far al-Mutawakkil, et sa mère était une esclave-mère appelée Qabiha. Il a prêté serment le jeudi, deux nuits dans Muharram 252, à dix-huit ans ; il s'est déposé le lundi, trois nuits avant la fin de Rajab 255, et est mort six jours plus tard à vingt-quatre ans et a été enterré à Samarra. Al-Buhturi, sur la déposition d'al-Musta'in, a composé un jibe l'envoyant à Wasit : « Que les griffes poussent dans la chair des poulets, jusqu'à Wasit, derrière le poulet » {cite:muruj-al-dhahab p. 547-548}. Selon al-Mas'udi, tous les Turcs sont venus à lui quatre nuits avant la fin du Rajab 255, dirigés par Salih ibn Wasif, le réprimandant pour ses péchés et exigeant de l'argent ; Il a accepté d'abdiquer sur les termes de la sécurité-conduite, et a été tué dans son confinement six jours après sa déposition. Il a été le premier calife à monter avec des pièges en or, alors que les califes avant lui avaient monté avec des pièges en argent clair {cite:muruj-al-dhahab p. 553-554}."
  es: "Califa abasí, prestó juramento en Muharram 252 después de la deposición de al-Musta'in {cite:tabari-tarikh-abu-al-fadl j.9 p.348}; fue depuesto en Rajab 255 y murió en Sha'ban {cite:tabari-tarikh-abu-al-fadl j.9 p.389} {cite:tabari-tarikh-abu-al-fadl j.9 p.390}. Según al-Suyuti, era el segundo en la sucesión después de al-Muntasir y antes de al-Mu'ayyad; al-Mutawakkil deseaba ascenderlo, por amor a su madre Qabiha, sin la cual no podía ser paciente {cite:tarikh-khulafa-minhaj-1434 p. 543}. Según al-Suyuti, prestó juramento cuando al-Musta'in fue depuesto en 252, a la edad de diecinueve años; ningún califa anterior había ascendido al trono a una edad más temprana. En el primer año de su reinado, Ashnas falleció dejando quinientos mil dinares, que él se apropió. Fue el primer califa en cabalgar con arreos de oro; los califas anteriores habían cabalgado con ligeros arreos de plata. Confirió la túnica de gobierno a Muhammad ibn Abd Allah ibn Tahir, para luego destituirlo; después a su hermano Abu Ahmad, quien fue coronado con una corona, dos fajas y dos espadas; luego lo destituyó y lo exilió a Wasit; finalmente se la confirió a Baga al-Sharabi, quien se rebeló contra él un año después y fue asesinado. En Rajab depuso a su hermano al-Mu'ayyad, lo golpeó y lo encadenó, y este murió {cite:tarikh-khulafa-minhaj-1434 p. 557-558}. Según al-Mas'udi, al-Mutawakkil lo había hecho segundo en la sucesión después de al-Muntasir, y al-Muntasir y su hermano Ibrahim lo depusieron en 248 {cite:muruj-al-dhahab p. 519}. Según al-Mas'udi, él es al-Zubayr ibn Ja'far al-Mutawakkil, y su madre era una esclava llamada Qabiha. Prestó juramento el jueves, dos noches después del inicio de Muharram 252, a los dieciocho años; se depuso a sí mismo el lunes, tres noches antes del final de Rajab 255, y murió seis días después a los veinticuatro años y fue enterrado en Samarra. Al-Buhturi, en la deposición de al-Musta'in, compuso una burla enviándolo a Wasit: 'Que crezcan garras en la carne de los pollos, hasta Wasit, detrás del pollo' {cite:muruj-al-dhahab p. 547-548}. Según al-Mas'udi, todos los turcos acudieron a él durante las cuatro noches previas al final de Rajab 255, encabezados por Salih ibn Wasif, para reprenderlo por sus pecados y exigirle dinero; él accedió a abdicar bajo la condición de un salvoconducto y fue asesinado en su cautiverio seis días después de su deposición. Fue el primer califa en exhibir un atuendo de oro al montar a caballo, mientras que los califas anteriores habían usado atuendos de plata ligera {cite:muruj-al-dhahab p. 553-554}."
  ur: "عباسی خلیفہ، المستعین کے معزول ہونے کے بعد 252 محرم میں حلف دیا گیا {حوالہ: طبری-تاریخ-ابو الفضل ج.9 ص348}؛ رجب 255 میں معزول ہوئے اور شعبان میں وفات پائی۔ سیوطی کے مطابق وہ المنتصر کے بعد اور المعیاد سے پہلے دوسرے نمبر پر تھے۔ متوکل نے اپنی والدہ قبیحہ کی محبت میں اسے آگے بڑھانا چاہا، جس کے بغیر وہ صبر نہیں کر سکتا تھا۔ 543}۔ السیوطی کے مطابق انہیں یہ حلف اس وقت دیا گیا تھا جب المستعین 252 میں انیس میں معزول ہوئے تھے۔ ان سے پہلے کوئی خلیفہ تخت نشین نہیں ہوا۔ اپنی حکومت کے پہلے سال اشناس کا انتقال ہو گیا جس نے پانچ لاکھ دینار چھوڑے جو اس نے لے لیے۔ وہ پہلا خلیفہ تھا جس نے سونے کے جالوں کے ساتھ سواری کی۔ اس سے پہلے کے خلفاء نے چاندی کے ہلکے پھندوں کے ساتھ سواری کی تھی۔ اس نے محمد بن عبد اللہ ابن طاہر کو حکمرانی کا لباس عطا کیا، پھر اسے برطرف کر دیا۔ پھر اس کے بھائی ابو احمد پر، جس کو تاج پہنایا گیا تھا، دو تختیاں اور دو تلواریں تھیں۔ پھر اس نے اسے برطرف کر دیا اور اسے وصیت میں جلاوطن کر دیا۔ پھر اس نے اسے بگا الشرابی سے نوازا جو ایک سال بعد اس کے خلاف کھڑا ہوا اور مارا گیا۔ رجب میں اس نے اپنے بھائی المعیاد کو معزول کر دیا، اسے مارا پیٹا اور بیڑیاں ڈال دیں، اور اس کی موت ہو گئی۔ 557-558}۔ المسعودی کے مطابق متوکل نے اسے المنتصر کے بعد یکے بعد دیگرے بنا دیا تھا اور المنتصر اور اس کے بھائی ابراہیم نے اسے 248 میں معزول کر دیا تھا۔ 519}۔ المسعودی کے مطابق وہ الزبیر بن جعفر المتوکل ہیں، اور ان کی والدہ ایک لونڈی تھی جسے قبیحہ کہا جاتا تھا۔ انہیں جمعرات 252 محرم کی دو راتیں اٹھارہ بجے حلف دیا گیا۔ اس نے سوموار کو، رجب 255 کے اختتام سے تین راتیں پہلے اپنے آپ کو معزول کیا، اور چھ دن بعد چوبیس سال کی عمر میں انتقال کر گئے اور سامرہ میں دفن ہوئے۔ المستعین کے بیان پر البطوری نے اسے وصیت کی طرف روانہ کرتے ہوئے ایک طنزیہ تحریر کیا: 'مرغی کے گوشت میں پنجے بڑھنے دیں، مرغی کے پیچھے وسط تک'۔ 547-548}۔ المسعودی کے مطابق، رجب 255 کے اختتام سے چار راتوں کو تمام ترک اس کے پاس آئے، صالح بن واصف کی قیادت میں، اس کے گناہوں کی سرزنش کی اور رقم کا مطالبہ کیا۔ وہ محفوظ سلوک کی شرائط پر دستبردار ہونے پر راضی ہوا، اور اس کی معزولی کے چھ دن بعد اس کی قید میں مارا گیا۔ وہ پہلا خلیفہ تھا جس نے سونے کے پھندوں کے ساتھ سواری کا مظاہرہ کیا، جب کہ ان سے پہلے کے خلفاء چاندی کے ہلکے پھندے کے ساتھ سواری کر چکے تھے۔ 553-554}۔"
  tr: "Bir Abbasi halifesi, 252 Hicri yılında El-Musta'in'in görevden alınmasından sonra Muharrem'de ona bağlılık yemini etti {atıf:tabari-tarikh-abu-al-fadl j.9 s.348}, ardından elli beşinci yılda Recep'te tahttan indirildi ve Şaban'da öldü {cite:tabari-tarikh-abu-al-fadl j.9 s.389} {cite:tabari-tarikh-abu-al-fadl j.9 s.390}. Al-Suyuti'ye göre, Al-Muntasir'den sonra ve Al-Mu'ayyad'dan önce ikinci komutandı. Al-Mutawakkil, onu tutkulu olduğu ve dayanamadığı çirkin annesine tanıtmak istedi {alıntı: Tarikh-Khulafa-minhaj-1434, s. 543} ve Al-Suyuti'ye göre, 52 Hicri yılında El-Musta'in tarafından tahttan indirildiğinde ona bağlılık yemini etmişti ve o on dokuz yaşındaydı. Ondan önce hiç genç kişi tahta çıkmadı. İlk yılında öldü ve beş yüz bin dinar bıraktı, bunları aldı. Altın takılarla binmeyi getiren ilk halifeydi, oysa kendisinden önceki halifeler hafif gümüş takılar takıyordu. Muhammed bin Abdullah ibn Tahir'in kraliyet giysisini çıkardı, sonra onu, kardeşi Ebu Ahmed'i görevden aldı ve taç, iki atkı ve kılıçla gitti, ardından onu tahttan indirip sürgüne gönderdi O zaman Ali Bugha al-Sharabi vardı; bir yıl sonra ona karşı isyan etti ve öldürüldü. Recep'te, kardeşi el-Mueyyad onu tahttan indirdi, dövdü ve bağladı; öldü {alıntı:Tarikh-khulafa-minhaj-1434, s. 557-558}. al-Mas'udi'ye göre, al-Mutawakkil onu al-Muntasir'den sonra ikinci veliaht prens olarak atadı, böylece al-Muntasir ve kardeşi İbrahim onu 248 Hicri yılında tahttan indirdi {cite:muruj-al-dhahab, s. 519}. Al-Mas'udi'ye göre, o, annesi Qubaha'dan bir oğlunun annesi olan el-Zubeyr ibn Ja'far al-Mutawakkil'di. Perşembe günü, 252 Hicri'den iki gece önce, on sekiz yaşında bağlılık yemini etti. Daha sonra Pazartesi günü, 55 yılında, Rajab'dan üç gün sonra tahttan feragat etti ve altı gün sonra yirmi dört yaşında öldü, Samarra'da defnedildi. Şöyle dedi: 'Khula' al-Musta'in'de el-Buhturi, tavukların arkasındaki Wasit'e tavuk etinde pençe yetiştirmek için kullanılır {atıf:muruj-al-dhahab s. 547-548}. al-Mas'udi'ye göre, 255 Hicri yılının Recep'inde tüm Türkler ona dört gün boyunca geldiler; Salih ibn Waseef liderliğinde, günahları için onu dövdü ve para istedi. Güvenlik için abdest almayı reddetti ve tahttan indirildikten altı gün sonra hapishanesinde öldürüldü. Halifelerin hafif gümüş süslerle bindiği ilk halifeydi {cite:muruj-al-dhahab s. 553-554}"
  id: "Seorang khalifah Abbasiyah bersumpah setia kepadanya pada Muharram tahun 252 HH, setelah Al-Musta'in digulingkan {cite:tabari-tarikh-abu-al-fadl j.9 hlm.348}, kemudian ia digulingkan di Rajab pada tahun lima puluh lima dan meninggal di Sha'ban {cite:tabari-tarikh-abu-al-fadl j.9 hlm.389} {cite:tabari-tarikh-abu-al-fadl j.9 hlm.390}. Menurut Al-Suyuti, ia adalah wakil komandan setelah Al-Muntasir dan sebelum Al-Mu'ayyad. Al-Mutawakkil ingin memperkenalkannya kepada ibunya yang jelek, yang sangat ia cintai dan tidak tahan {cite: Tarikh-Khulafa-minhaj-1434, hlm. 543}, dan menurut Al-Suyuti, ia telah disumpah setia kepadanya ketika ia digulingkan oleh Al-Musta'in pada tahun 52 H, dan ia berusia sembilan belas tahun. Tidak ada orang yang lebih muda yang menggantikan sebelum dia. Pada tahun pertama ia berasumsi, ia meninggal dan meninggalkan lima ratus ribu dinar yang ia terima. Ia adalah khalifah pertama yang memperkenalkan kuda dengan perhiasan emas, sedangkan khalifah sebelumnya mengenakan perhiasan perak ringan. Ia melepas jubah kerajaan dari Muhammad ibn Abdullah ibn Tahir, kemudian memecatnya, lalu menggantikan saudaranya Abu Ahmad, dan pergi dengan mahkota, dua syal, dan pedang, lalu menurunkan dan mengasingkannya ke Kemudian Ali Bugha al-Sharabi, yang memberontak melawannya setelah setahun dan dibunuh. Di Rajab, saudaranya al-Mu'ayyad menggulingkannya, memukulinya, dan mengikatnya, dan ia meninggal {cite:Tarikh-khulafa-minhaj-1434, hlm. 557-558}. Menurut al-Mas'udi, al-Mutawakkil mengangkatnya sebagai putra mahkota kedua setelah al-Muntasir, sehingga al-Muntasir dan saudaranya Ibrahim menggulingkannya pada tahun 248 H {cite:muruj-al-dhahab, hlm. 519}. Menurut al-Mas'udi, ia adalah al-Zubayr ibn Ja'far al-Mutawakkil, yang ibunya adalah ibu dari seorang anak laki-laki bernama Qubaha. Ia bersumpah setia pada hari Kamis, dua malam sebelum Muharram, 252 H, pada usia delapan belas tahun. Ia kemudian turun tahta pada hari Senin, tiga hari setelah Rajab pada tahun 55, dan meninggal enam hari kemudian pada usia dua puluh empat tahun, dan dimakamkan di Samarra. Ia berkata Al-Buhturi dalam 'Khula' al-Musta'in untuk menanam cakar daging ayam ke Wasit di belakang ayam {cite:muruj-al-dhahab hlm. 547-548}. Menurut al-Mas'udi, semua orang Turki datang kepadanya selama empat hari tersisa di Rajab tahun 255 H, dipimpin oleh Salih ibn Waseef, yang memukulnya atas dosanya dan menuntut uang. Ia menolak untuk mandi demi keselamatan dan dibunuh di penjara enam hari setelah digulingkan. Ia adalah khalifah pertama yang menunjukkan tunggangan dengan perhiasan emas, setelah khalifah biasa menunggang perhiasan perak ringan {cite:muruj-al-dhahab hlm. 553-554}"
