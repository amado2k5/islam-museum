label: { ar: "المعتز بالله", en: "al-Mu'tazz bi-llah" }
summary:
  ar: "خليفة عباسي، بويع له في المحرم سنة اثنتين وخمسين ومائتين بعد خلع المستعين {cite:tabari-tarikh-abu-al-fadl j.9 p.348}، ثم خُلع في رجب سنة خمس وخمسين ومات في شعبان {cite:tabari-tarikh-abu-al-fadl j.9 p.389} {cite:tabari-tarikh-abu-al-fadl j.9 p.390}، وعند السيوطي كان ثاني الأعهد بعد المنتصر وقبل المؤيد، وأراد المتوكل تقديمه لمحبته لأمه قبيحة التي كان مشغوفاً بها لا يصبر عنها {cite:tarikh-khulafa-minhaj-1434 p. 543}، وعند السيوطي بويع له عند خلع المستعين سنة اثنتين وخمسين وله تسع عشرة سنة ولم يل الخلافة قبله أحد أصغر منه، وأول سنة تولى مات أشناس وخلف خمس مئة ألف دينار فأخذها، وأول خليفة أحدث الركوب بحلية الذهب وكان الخلفاء قبله يركبون بالحلية الخفيفة من الفضة، وخلع خلعة الملك على محمد بن عبد الله بن طاهر ثم عزله ثم على أخيه أبي أحمد وتوجه بتاج ووشاحين وسيفين ثم عزله ونفاه إلى واسط ثم على بغا الشرابي فخرج عليه بعد سنة فقتل، وفي رجب خلع أخاه المؤيد وضربه وقيده فمات {cite:tarikh-khulafa-minhaj-1434 p. 557-558}. وعند المسعودي كان المتوكل أقامه ثانياً في ولاية العهد بعد المنتصر فخلعه المنتصر وأخوه إبراهيم سنة ثمان وأربعين ومائتين {cite:muruj-al-dhahab p. 519}، وعند المسعودي هو الزبير بن جعفر المتوكل وأمه أم ولد يقال لها قبيحة، بويع يوم الخميس لليلتين خلتا من المحرم سنة اثنتين وخمسين ومائتين وله ثماني عشرة سنة، ثم خلع نفسه يوم الاثنين لثلاث بقين من رجب سنة خمس وخمسين ومات بعدها بستة أيام وله أربع وعشرون سنة فدفن بسامرا، وقال البحتري في خلع المستعين لينبت في لحم الدجاج مخالب إلى واسط خلف الدجاج {cite:muruj-al-dhahab p. 547-548}، وعند المسعودي صار إليه الأتراك بأجمعهم لأربع بقين من رجب سنة خمس وخمسين ومائتين يقودهم صالح بن وصيف يقرعونه بذنوبه ويطالبونه بالأموال فأجاب إلى الخلع على الأمان وقتل في محبسه بعد خلعه بستة أيام، وكان أول خليفة أظهر الركوب بحلية الذهب بعد أن كان الخلفاء يركبون بالحلية الخفيفة من الفضة {cite:muruj-al-dhahab p. 553-554}"
  en: "Abbasid caliph, given the oath in Muharram 252 after al-Musta'in was deposed {cite:tabari-tarikh-abu-al-fadl j.9 p.348}; he was deposed in Rajab 255 and died in Sha'ban {cite:tabari-tarikh-abu-al-fadl j.9 p.389} {cite:tabari-tarikh-abu-al-fadl j.9 p.390}. According to al-Suyuti he was second in succession after al-Muntasir and before al-Mu'ayyad; al-Mutawakkil wished to advance him, out of love for his mother Qabiha, without whom he could not be patient {cite:tarikh-khulafa-minhaj-1434 p. 543}. According to al-Suyuti he was given the oath when al-Musta'in was deposed in 252, at nineteen; no caliph before him had come to the throne younger. In the first year of his reign Ashnas died leaving five hundred thousand dinars, which he took. He was the first caliph to ride with gold trappings; the caliphs before him had ridden with light silver trappings. He conferred the robe of rule on Muhammad ibn Abd Allah ibn Tahir, then dismissed him; then on his brother Abu Ahmad, who was crowned with a crown, two sashes and two swords; then he dismissed him and exiled him to Wasit; then he conferred it on Baga al-Sharabi, who rose against him a year later and was killed. In Rajab he deposed his brother al-Mu'ayyad, beat him and shackled him, and he died {cite:tarikh-khulafa-minhaj-1434 p. 557-558}. According to al-Mas'udi, al-Mutawakkil had made him second in succession after al-Muntasir, and al-Muntasir and his brother Ibrahim deposed him in 248 {cite:muruj-al-dhahab p. 519}. According to al-Mas'udi he is al-Zubayr ibn Ja'far al-Mutawakkil, and his mother was a slave-mother called Qabiha. He was given the oath on Thursday, two nights into Muharram 252, at eighteen; he deposed himself on Monday, three nights before the end of Rajab 255, and died six days later at twenty-four and was buried at Samarra. Al-Buhturi, on the deposition of al-Musta'in, composed a jibe sending him off to Wasit: 'Let claws grow in the flesh of chickens, as far as Wasit, behind the chicken' {cite:muruj-al-dhahab p. 547-548}. According to al-Mas'udi, all the Turks came to him on four nights before the end of Rajab 255, led by Salih ibn Wasif, rebuking him for his sins and demanding money; he agreed to abdicate on terms of safe-conduct, and was killed in his confinement six days after his deposition. He was the first caliph to display riding with gold trappings, when the caliphs before him had ridden with light silver trappings {cite:muruj-al-dhahab p. 553-554}."
