label: { ar: "المعتز بالله" }
summary:
  ar: "خليفة عباسي، بويع له في المحرم سنة اثنتين وخمسين ومائتين بعد خلع المستعين {cite:tabari-tarikh-abu-al-fadl j.9 p.348}، ثم خُلع في رجب سنة خمس وخمسين ومات في شعبان {cite:tabari-tarikh-abu-al-fadl j.9 p.389} {cite:tabari-tarikh-abu-al-fadl j.9 p.390}، وعند السيوطي كان ثاني الأعهد بعد المنتصر وقبل المؤيد، وأراد المتوكل تقديمه لمحبته لأمه قبيحة التي كان مشغوفاً بها لا يصبر عنها {cite:tarikh-khulafa-minhaj-1434 p. 543}، وعند السيوطي بويع له عند خلع المستعين سنة اثنتين وخمسين وله تسع عشرة سنة ولم يل الخلافة قبله أحد أصغر منه، وأول سنة تولى مات أشناس وخلف خمس مئة ألف دينار فأخذها، وأول خليفة أحدث الركوب بحلية الذهب وكان الخلفاء قبله يركبون بالحلية الخفيفة من الفضة، وخلع خلعة الملك على محمد بن عبد الله بن طاهر ثم عزله ثم على أخيه أبي أحمد وتوجه بتاج ووشاحين وسيفين ثم عزله ونفاه إلى واسط ثم على بغا الشرابي فخرج عليه بعد سنة فقتل، وفي رجب خلع أخاه المؤيد وضربه وقيده فمات {cite:tarikh-khulafa-minhaj-1434 p. 557-558}."
