summary:
  ar: "الشاعر الفتاك صاحب القول المشهور في الغول فأصبحت والغول لي جارة، أورده المسعودي في باب أخبار العرب في الغيلان وتغولها {cite:muruj-al-dhahab p. 469}. وقال لخاله الشنفرى حين سأله عن قتيل قتله كيف كانت قصته ألجمته عضباً فسالت نفسه سكباً، يستشهد به المسعودي في باب مذاهب الجاهلية في النفوس {cite:muruj-al-dhahab p. 468}"
  en: "The outlaw-poet whose ghul verses — 'I awoke and the ghul was my neighbour' — head al-Mas'udi's chapter on the Arabs' ghul lore {cite:muruj-al-dhahab p. 469}."
  es: "El poeta forajido cuyos versos sobre el ghul —'Desperté y el ghul era mi vecino'— encabezan el capítulo de al-Mas'udi sobre la tradición árabe del ghul {cite:muruj-al-dhahab p. 469}."
  fr: "Le poète hors-la-loi dont les vers sur les ghuls — « Je me suis réveillé et le ghul était mon voisin » — sont en tête du chapitre d'al-Mas'udi sur la tradition arabe des ghuls {cite:muruj-al-dhahab p. 469}."
  ur: "غیر قانونی شاعر جس کی غزل کے اشعار - 'میں جاگ گیا اور غُل میرا پڑوسی تھا' - سربراہ المسعودی کا باب عربوں کی علمِ ذہب پر {حوالہ: مروج الذہب ص۔ 469}۔"
