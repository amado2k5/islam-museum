  hijri: "1314"
  calendar: gregorian
  precision: day
  status: historical
  derived: true
  note: "Died at Ahsan Manzil, Dhaka, on 24 August 1896 (a Monday, per Banglapedia): the English article, Banglapedia and Wikidata agree. He was succeeded by his second son Khwaja Ahsanullah. Burial is recorded two ways: the English article names the Kartalab Khan Mosque, Dhaka; Banglapedia gives the family graveyard at Begum Bazaar — the mosque stands in Begum Bazaar, and both are recorded. The Hijri year (1314) is derived by tabular conversion (24 August 1896 falls in Rabi' al-Awwal 1314)."
