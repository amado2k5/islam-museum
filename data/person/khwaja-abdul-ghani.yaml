summary:
  ar: "ثاني نواب دكا (1813-1896) وأول من صار اللقب في أسرته وراثيًّا باعتراف الراج البريطاني. ورث أملاك أبيه خواجة عليم الله سنة 1846 فوسّعها، وبنى قصر منزل إحسان مقرًّا للأسرة، وأدخل إلى دكا مصابيح الغاز وشبكة المياه ونظام البانشايات وحديقة الحيوان والصحافة، واشتهر بالتحكيم بين الناس وبالبذل الواسع في الأعمال الخيرية."
  en: "Second Nawab of Dhaka (1813–1896) and the first of his family to hold the title as hereditary, recognised by the British Raj. He inherited his father Khwaja Alimullah's estate in 1846 and enlarged it, built Ahsan Manzil as the family's seat, and brought gas lighting, piped water, the panchayat system, a zoological garden and a newspaper to Dhaka; he was famed as an arbiter of disputes and for large-scale charity."
  ur: "ڈھاکہ کے دوسرے نواب (1813ء–1896ء) اور اپنے خاندان کے پہلے فرد جن کا یہ خطاب انگریز حکومت کی منظوری سے موروثی ہوا۔ انھوں نے 1846ء میں والد خواجہ علیم اللہ کی جائیداد سنبھالی اور اسے بڑھایا، احسن منزل کو خاندان کی رہائش گاہ بنایا، اور ڈھاکہ میں گیس کی روشنی، پانی کی فراہمی، پنچایت نظام، چڑیا گھر اور اخبار متعارف کرائے؛ وہ تنازعات کے ثالث اور بڑے خیراتی کاموں کے لیے مشہور تھے۔"
