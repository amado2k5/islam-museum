  note: "Born at Begum Bazaar, Dhaka, on 30 July 1813: the English article, Banglapedia and Wikidata agree. Second son of Khwaja Alimullah (his predecessor as head of the family; d. 1854 per Banglapedia) and Zinat Begum. The Hijri year (1228) is derived by tabular conversion (30 July 1813 falls in Rajab 1228)."
