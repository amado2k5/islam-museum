  ar: "داعية كويتي وُلد سنة 1985، يعمل إماما وخطيبا في وزارة الأوقاف والشؤون الإسلامية بالكويت، عُرف بدروسه في مسجد الكويت الكبير حول التلذذ بالصلاة، وبسلسلتيه التلفزيونيتين «كيف تتلذذ بالصلاة» و«كيف تتعامل مع الله» اللتين حضر محاضرتهما الأصلية عشرات الألوف."
