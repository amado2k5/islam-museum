summary:
  ar: "سياسي أمريكي ديمقراطي، وُلد في إنديانابوليس سنة 1974، وهو حفيد سلفه في الكونغرس جوليا كارسون. عمل ضابطًا في شرطة الولاية وفي وحدة مكافحة الإرهاب التابعة لوزارة الأمن الداخلي في إنديانا، ثم عضوًا في مجلس مدينة إنديانابوليس، وفاز سنة 2008 في انتخاب خاص بمقعد جدته فأصبح ثاني مسلم يُنتخب لكونغرس الولايات المتحدة بعد كيث إليسون، وما زال يمثل الدائرة السابعة في إنديانا وعميد وفدها في الكونغرس."
  en: "American Democratic politician, born in Indianapolis in 1974, the grandson of his predecessor in Congress, Julia Carson. He worked as a state excise police officer and in the Indiana Department of Homeland Security's anti-terrorism unit, then on the Indianapolis City-County Council, and in 2008 won the special election for his grandmother's seat, becoming the second Muslim elected to the United States Congress, after Keith Ellison. He still represents Indiana's 7th district and is dean of Indiana's congressional delegation."
  ur: "امریکی ڈیموکریٹ سیاست دان، جو 1974 میں انڈیاناپولس میں پیدا ہوئے اور کانگریس میں اپنی پیش رو جولیا کارسن کے پوتے ہیں۔ انھوں نے ریاستی پولیس اور انڈیانا کے محکمہ ہوم لینڈ سکیورٹی کی انسدادِ دہشت گردی یونٹ میں کام کیا، انڈیاناپولس سٹی کونسل کے رکن رہے، اور 2008 میں اپنی دادی کی نشست کے ضمنی انتخاب میں کامیاب ہو کر کیتھ ایلیسن کے بعد کانگریس کے لیے منتخب ہونے والے دوسرے مسلمان بنے۔"
