id: person/mun-al-muzaffar
class: person
label: { ar: "مؤنس المظفر" }
summary:
  ar: "قائد عسكري عباسي خرج من الموصل في شوال سنة عشرين وثلاثمائة متجهاً إلى بغداد، ووقعت المواجهة عند الشماسية فقُتل المقتدر فيها، وذكر الطبري أن مؤنساً اشتد جزعه حين حُمل إليه الجثمان {cite:tabari-tarikh-abu-al-fadl j.11 p.148} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}."
  tr: "Bir Abbasi askeri komutanı, 320 Hicri yılında Musul'dan Şevval'den ayrılarak Bağdat'a yöneldi. Çatışma El-Şamasiyah'da gerçekleşti ve bu çatışmada El-Muktadir öldürüldü. El-Taberi, Mu'nasa'nın cesedi kendisine getirildiğinde derin bir üzüntü yaşadığını belirtti {cite:tabari-tarikh-abu-al-fadl j.11 s.148} {cite:tabari-tarikh-abu-al-fadl j.11 s.152}."
  id: "Seorang komandan militer Abbasiyah meninggalkan Mosul di Shawwal pada tahun 320 H, menuju Baghdad. Konfrontasi terjadi di Al-Shamasiyah, di mana Al-Muqtadir tewas. Al-Tabari menyebutkan bahwa Mu'nasa sangat tertekan ketika jenazah dibawa kepadanya {cite:tabari-tarikh-abu-al-fadl j.11 hlm.148} {cite:tabari-tarikh-abu-al-fadl j.11 hlm.152}."
