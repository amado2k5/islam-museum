roles: [scholar]
gender: male
summary:
  ar: "محمد بن يوسف بن علي بن سعيد، شمس الدين الكرماني، عالم بالحديث أصله من كرمان، اشتهر في بغداد وأقام مدة بمكة وفرغ فيها من «الكواكب الدراري في شرح صحيح البخاري»، ومات راجعاً من الحج ودفن في بغداد؛ توفي سنة 786 هـ الموافقة 1384 م."
  en: "Muhammad ibn Yusuf ibn Ali ibn Sa'id, Shams al-Din al-Kirmani, a hadith scholar of Kirmani origin, well known in Baghdad, who stayed in Mecca and finished there his commentary on Sahih al-Bukhari, al-Kawakib al-Darari; he died on his way back from the pilgrimage and was buried in Baghdad; died 786 AH (1384)."
  es: "Muhammad ibn Yusuf ibn Ali ibn Sa'id, Shams al-Din al-Kirmani, un erudito de hadices de origen Kirmani, muy conocido en Bagdad, que se quedó en La Meca y terminó allí su comentario sobre Sahih al-Bukhari, al-Kawakib al-Darari; murió en su camino de regreso de la peregrinación y fue enterrado en Bagdad; murió en el año 786 de la Hégira (1384)."
  fr: "Muhammad ibn Yusuf ibn Ali ibn Sa'id, Shams al-Din al-Kirmani, un érudit du hadith d'origine kirmani, bien connu à Bagdad, qui séjourna à La Mecque et y termina son commentaire sur Sahih al-Bukhari, al-Kawakib al-Darari; il mourut sur le chemin du retour du pèlerinage et fut enterré à Bagdad; mort en 786 AH (1384)."
  ur: "محمد بن یوسف ابن علی ابن سعید، شمس الدین الکرمانی، کرمانی نژاد حدیث کے عالم، بغداد میں مشہور ہیں، جنہوں نے مکہ میں قیام کیا اور وہیں صحیح البخاری، الکوکیب الداراری، پر اپنی تفسیر ختم کی۔ زیارت سے واپسی پر ان کا انتقال ہوا اور بغداد میں دفن ہوئے۔ وفات 786ھ (1384)۔"
