summary:
  ar: "أبو جعفر يزيد بن القعقاع المخزومي المدني، تابعي وإمام قراء المدينة، صاحب القراءة الثامنة من العشر في ترتيب «النشر»؛ قرأ على مولاه عبد الله بن عياش بن أبي ربيعة وعبد الله بن عباس وأبي هريرة، وتوفي سنة 130هـ على الأصح {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  en: "Abu Ja'far Yazid ibn al-Qa'qa' al-Makhzumi of Medina, a successor to the Companions and imam of the readers of Medina, whose reading is the eighth of the ten in the order of al-Nashr; he read on his patron 'Abd Allah ibn 'Ayyash ibn Abi Rabi'a, on 'Abd Allah ibn 'Abbas and on Abu Hurayra, and died in 130 AH on the soundest view {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  ur: "ابو جعفر یزید بن القعقاع مخزومی مدنی، تابعی اور مدینہ کے قراء کے امام، «النشر» کی ترتیب میں دس قراءتوں میں آٹھویں قراءت کے صاحب؛ انہوں نے اپنے مولیٰ عبد اللہ بن عیاش بن ابی ربیعہ، عبد اللہ بن عباس اور ابو ہریرہ پر پڑھا، اور صحیح تر قول کے مطابق 130ھ میں فوت ہوئے {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  fr: "Abu Ja'far Yazid ibn al-Qa'qa' al-Makhzumi de Médine, Successeur des Compagnons et imam des lecteurs de Médine, dont la lecture est la huitième des dix dans l'ordre d'al-Nashr ; il lut auprès de son patron 'Abd Allah ibn 'Ayyash ibn Abi Rabi'a, auprès de 'Abd Allah ibn 'Abbas et auprès d'Abu Hurayra, et mourut en 130 H selon l'avis le plus sûr {cite:nashr-dahman-damascus-1345-v1 p. 189}."
