id: person/ibn-hubayra
class: person
label: { ar: "ابن هبيرة وزير المقتفي" }
summary:
  ar: "وزير المقتفي، قال لما تطاول على المقتفي أصحاب مسعود وأساؤوا الأدب ولم يمكن المجاهرة بالمحاربة اتفق الرأي على الدعاء عليه شهراً كما دعا النبي على رعل وذكوان شهراً فابتدأ هو والخليفة سراً يدعوان سحراً من ليلة تسع وعشرين من جمادى الأولى فلما تكامل الشهر مات مسعود على سريره لم يزد على الشهر يوماً ولا نقص يوماً {cite:tarikh-khulafa-minhaj-1434 p. 674-675}."
  en: "Al-Muqtafi's vizier; when Mas'ud's men overreached and open war was impossible, he and the caliph cursed him secretly at dawn each night for a month from 29 Jumada I — and when the month completed Mas'ud died on his bed, neither a day more nor less {cite:tarikh-khulafa-minhaj-1434 p. 674-675}."
  es: "El visir de Al-Muqtafi; cuando los hombres de Mas'ud se extralimitaron y la guerra abierta se volvió imposible, él y el califa lo maldijeron en secreto al amanecer cada noche durante un mes a partir del 29 de Jumada I, y cuando se completó el mes, Mas'ud murió en su cama, ni un día más ni menos {cite:tarikh-khulafa-minhaj-1434 p. 674-675}."
  fr: "Le vizir d'Al-Muqtafi; lorsque les hommes de Mas'ud ont dépassé les bornes et qu'une guerre ouverte était impossible, lui et le calife l'ont maudit secrètement à l'aube chaque soir pendant un mois à partir du 29 Jumada I — et lorsque le mois s'est terminé, Mas'ud est mort sur son lit, ni un jour de plus ni un jour de moins {cite:tarikh-khulafa-minhaj-1434 p. 674-675}."
  ur: "المقطفی کا وزیر؛ جب مسعود کے آدمی حد سے بڑھ گئے اور کھلی جنگ ناممکن تھی تو اس نے اور خلیفہ نے 29 جمادی الثانی سے ایک ماہ تک ہر رات فجر کے وقت چپکے سے اس پر لعنت بھیجی اور جب مہینہ پورا ہوا تو مسعود اپنے بستر پر فوت ہو گئے، نہ ایک دن زیادہ اور نہ ہی کم۔ 674-675}۔"
