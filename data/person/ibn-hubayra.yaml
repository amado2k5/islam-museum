label: { ar: "ابن هبيرة وزير المقتفي" }
summary:
  ar: "وزير المقتفي، قال لما تطاول على المقتفي أصحاب مسعود وأساؤوا الأدب ولم يمكن المجاهرة بالمحاربة اتفق الرأي على الدعاء عليه شهراً كما دعا النبي على رعل وذكوان شهراً فابتدأ هو والخليفة سراً يدعوان سحراً من ليلة تسع وعشرين من جمادى الأولى فلما تكامل الشهر مات مسعود على سريره لم يزد على الشهر يوماً ولا نقص يوماً {cite:tarikh-khulafa-minhaj-1434 p. 674-675}."
  en: "Al-Muqtafi's vizier; when Mas'ud's men overreached and open war was impossible, he and the caliph cursed him secretly at dawn each night for a month from 29 Jumada I — and when the month completed Mas'ud died on his bed, neither a day more nor less {cite:tarikh-khulafa-minhaj-1434 p. 674-675}."
