summary:
  ar: "عمرو بن الأسود أبو عياض العنسي، ويقال الهمداني، الدمشقي، تابعي، روى عن عمرو بن مسعود ومعاذ بن جبل وعبادة بن الصامت وعبد الله بن عمرو بن العاص وأبي هريرة وعائشة، وعنه مجاهد وخالد بن معدان وشريح بن عبيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} قال ابن حبان كان من عباد أهل الشام وزهادهم، وقال ابن سعد كان ثقة قليل الحديث، وقال ابن عبد البر أجمعوا على أنه كان من العلماء الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8520}"
  en: "Amr ibn al-Aswad Abu Iyad al-Anasi, also called al-Hamdani, from Damascus, a Successor. He narrated from Amr ibn Mas'ud, Mu'adh ibn Jabal, Ubada ibn al-Samit, Abd Allah ibn Amr ibn al-As, Abu Hurayra and Aisha; Mujahid, Khalid ibn Ma'dan and Shurayh ibn Ubayd narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} Ibn Hibban called him one of the worshippers and ascetics of Syria, Ibn Sa'd called him trustworthy and of few reports, and Ibn Abd al-Barr said that the scholars agree he was among the trustworthy scholars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8520}"
