summary:
  ar: "عمرو بن الأسود أبو عياض العنسي، ويقال الهمداني، الدمشقي، تابعي، روى عن عمرو بن مسعود ومعاذ بن جبل وعبادة بن الصامت وعبد الله بن عمرو بن العاص وأبي هريرة وعائشة، وعنه مجاهد وخالد بن معدان وشريح بن عبيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} قال ابن حبان كان من عباد أهل الشام وزهادهم، وقال ابن سعد كان ثقة قليل الحديث، وقال ابن عبد البر أجمعوا على أنه كان من العلماء الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8520}"
  en: "Amr ibn al-Aswad Abu Iyad al-Anasi, also called al-Hamdani, from Damascus, a Successor. He narrated from Amr ibn Mas'ud, Mu'adh ibn Jabal, Ubada ibn al-Samit, Abd Allah ibn Amr ibn al-As, Abu Hurayra and Aisha; Mujahid, Khalid ibn Ma'dan and Shurayh ibn Ubayd narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} Ibn Hibban called him one of the worshippers and ascetics of Syria, Ibn Sa'd called him trustworthy and of few reports, and Ibn Abd al-Barr said that the scholars agree he was among the trustworthy scholars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8520}"
  es: "Amr ibn al-Aswad Abu Iyad al-Anasi, también llamado al-Hamdani, de Damasco, un Sucesor. Narró de Amr ibn Mas'ud, Mu'adh ibn Jabal, Ubada ibn al-Samit, Abd Allah ibn Amr ibn al-As, Abu Hurayra y Aisha; Mujahid, Khalid ibn Ma'dan y Shurayh ibn Ubayd narraron de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} Ibn Hibban lo llamó uno de los adoradores y ascetas de Siria, Ibn Sa'd lo llamó digno de confianza y de pocos informes, e Ibn Abd al-Barr dijo que los eruditos coinciden en que estaba entre los eruditos dignos de confianza. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8520}"
  fr: "Amr ibn al-Aswad Abu Iyad al-Anasi, également appelé al-Hamdani, originaire de Damas, était un successeur. Il a rapporté des hadiths d'Amr ibn Mas'ud, Mu'adh ibn Jabal, Ubada ibn al-Samit, Abd Allah ibn Amr ibn al-As, Abu Hurayra et Aisha; Mujahid, Khalid ibn Ma'dan et Shurayh ibn Ubayd ont également rapporté des hadiths de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} Ibn Hibban le qualifiait d'un des adorateurs et ascètes de Syrie, Ibn Sa'd le considérait comme digne de confiance et dont les hadiths étaient peu nombreux, et Ibn Abd al-Barr affirmait que les savants s'accordaient à le classer parmi les savants dignes de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8520}"
  ur: "عمرو بن الاسود ابو عیاض الانسی، جسے الحمدانی بھی کہا جاتا ہے، دمشق سے، ایک جانشین۔ انہوں نے عمرو بن مسعود، معاذ بن جبل، عبادہ بن الصامت، عبد اللہ بن عمرو بن العاص، ابو ہریرہ اور عائشہ م سے روایت کی ہے۔ ان سے مجاہد، خالد بن معدان اور شریح بن عبید نے روایت کی ہے۔ ابن حبان نے انہیں شام کے عبادت گزاروں اور زاہدوں میں سے ایک کہا ہے، ابن سعد نے انہیں ثقہ اور چند روایتوں میں کہا ہے، اور ابن عبد البر نے کہا ہے کہ علماء کا اتفاق ہے کہ وہ ثقہ علماء میں سے تھے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 8519}"
  tr: "Amr ibn al-Aswad Abu 'Iyad al-'Ansi, aynı zamanda al-Hamdani, al-Dimashqi olarak da bilinir, bir Tab'i, Amr ibn Mas'ud, Mu'adh ibn Jabal, Ubadah ibn al-Samit, Abdullah ibn Amr ibn al-As, Abu Huraira ve Aisha'dan ayrıca Mücahid, Halid ibn Ma'dan ve Shurayh ibn Ubayd'den rivayet etmiştir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.8519} İbn Hibban, kendisinin el-Şam halkının ibadet edenleri ve münzevileri arasında olduğunu, İbn Sa'd ise güvenilir olduğunu ama az konuştuğunu söyledi. İbn Abd al-Barr, onun güvenilir alimler arasında olduğu konusunda oybirliğiyle hemfikir olduklarını söyledi. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.8519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8520}"
  id: "Amr ibn al-Aswad Abu 'Iyad al-'Ansi, juga disebut al-Hamdani, al-Dimashqi, seorang Tabi'i, diceritakan dari Amr ibn Mas'ud, Mu'adh ibn Jabal, Ubadah ibn al-Samit, Abdullah ibn Amr ibn al-As, Abu Huraira, dan Aisha, serta Mujahid, Khalid ibn Ma'dan, dan Shurayh ibn Ubayd. {kutip:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8519} Ibn Hibban mengatakan bahwa ia termasuk di antara para penyembah dan pertapa umat al-Sham, dan Ibn Sa'd mengatakan ia dapat dipercaya tetapi jarang berbicara. Ibn Abd al-Barr mengatakan mereka sepakat bahwa ia termasuk di antara ulama yang dapat dipercaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8520}"
