summary:
  ar: "صاحب الموصل وابن صاحبها عماد الدين زنكي، كان فيه دين وخير وشجاعة وإقدام، توفي في جمادى الآخرة سنة أربع وأربعين وخمس مئة وقد نيف على الأربعين وتملك بعده أخوه قطب الدين مودود {cite:shadharat-dhahab p. 619}."
  en: "Sayf al-Din Ghazi I b. Zangi, lord of Mosul — a man of religion, courage and enterprise; he died in Jumada al-Akhira 544 past forty, succeeded by his brother Qutb al-Din Mawdud {cite:shadharat-dhahab p. 619}."
  es: "Sayf al-Din Ghazi I b. Zangi, señor de Mosul, un hombre de religión, coraje y emprendimiento; murió en Jumada al-Akhira 544, pasados los cuarenta años, y fue sucedido por su hermano Qutb al-Din Mawdud {cite:shadharat-dhahab p. 619}."
  fr: "Sayf al-Din Ghazi I b. Zangi, seigneur de Mossoul — un homme de religion, de courage et d'entreprise; il mourut en Jumada al-Akhira 544 après quarante ans, remplacé par son frère Qutb al-Din Mawdud {cite:shadharat-dhahab p. 619}."
  ur: "سیف الدین غازی اول زنگی، موصل کا مالک - ایک مذہب، جرات اور کاروبار کا آدمی؛ ان کی وفات جمادی الآخرہ 544 میں چالیس کے قریب ہوئی، ان کے بعد ان کے بھائی قطب الدین مودود نے وفات پائی۔ 619}۔"
  tr: "Musul'un hükümdarı ve sahibinin oğlu İmadeddin Zangi, dindar, erdemli, cesur ve yiğitti. Beş yüz kırk yılında Cumada'd-Ahira'da öldü ve ardından kardeşi Kutbeddin Mevdud (kaynak:şadharat-dhahab, s. 619}."
  id: "Penguasa Mosul dan putra pemiliknya, Imad al-Din Zangi, adalah seorang yang religius, berbudi luhur, berani, dan berani. Ia meninggal di Jumada al-Akhirah pada tahun lima ratus empat puluh tahun, dan setelahnya meninggal saudaranya Qutb al-Din Mawdud {cite:shadharat-dhahab, hlm. 619}."
