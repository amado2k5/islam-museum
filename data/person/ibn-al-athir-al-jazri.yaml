summary:
  ar: "المحدث والفقيه مجد الدين أبو السعادات المبارك بن محمد الجزري الشيباني؛ أكبر أخوة ابن الأثير الثلاثة، عمل بدواوين الجزيرة والموصل وأصابه النقرس فأقعده فأنجز أكثر مؤلفاته إملاءً على طلابه، ومن آثاره «النهاية في غريب الحديث والأثر» و«جامع الأصول من أحاديث الرسول»."
  en: "The hadith scholar and jurist Majd al-Din Abu al-Sa'adat al-Mubarak ibn Muhammad al-Jazari al-Shaybani, the eldest of the three Ibn al-Athir brothers; he served the chanceries of the Jazira and Mosul, and after gout crippled him he produced most of his works by dictation, among them 'al-Nihaya fi Gharib al-Hadith' and 'Jami' al-Usul'."
