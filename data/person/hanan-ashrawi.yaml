summary:
  ar: "حنان عشراوي (وُلدت 8 أكتوبر 1946) أكاديمية وسياسية فلسطينية وُلدت في نابلس لأبوين فلسطينيين مسيحيين ونشأت في رام الله، ودرست الأدب الإنجليزي في الجامعة الأمريكية ببيروت وحصلت على الدكتوراه في الأدب المقارن من جامعة فيرجينيا. درّست في جامعة بيرزيت وعمّدت كليتها للآداب، وذاع صيتها عالميًا متحدثةً رسمية باسم الوفد الفلسطيني في مؤتمر مدريد للسلام سنة 1991، وصارت وزيرة للتعليم العالي سنة 1996، وأول امرأة تُنتخب لعضوية اللجنة التنفيذية لمنظمة التحرير (2009 و2018)، وأسّست مؤسستي «مفتاح» و«أمان» وكتبت «هذا الجانب من السلام» (1995)."
  en: "Hanan Ashrawi (born 8 October 1946) is a Palestinian scholar and politician born in Nablus to Palestinian Christian parents and raised in Ramallah; she studied English literature at the American University of Beirut and took her doctorate in comparative literature at the University of Virginia. She taught at Birzeit University and deaned its faculty of arts, came to world attention as the official spokesperson of the Palestinian delegation at the 1991 Madrid Peace Conference, served as Minister of Higher Education in 1996, and became the first woman elected to the PLO Executive Committee (2009 and 2018). She founded the MIFTAH and AMAN initiatives and wrote This Side of Peace (1995)."
  ur: "حنان اشراوی (پیدائش 8 اکتوبر 1946ء) فلسطینی دانشور اور سیاست دان ہیں جو نابلس میں فلسطینی عیسائی والدین کے ہاں پیدا ہوئیں اور رام اللہ میں پلی بڑھیں؛ بیروت کی امریکن یونیورسٹی سے انگریزی ادب پڑھا اور ورجینیا یونیورسٹی سے تقابلی ادب میں ڈاکٹریٹ کی۔ برزیت یونیورسٹی میں تدریس کی، 1991ء میں میڈرڈ امن کانفرنس میں فلسطینی وفد کی سرکاری ترجمان کی حیثیت سے عالمی شہرت پائی، 1996ء میں وزیرِ اعلیٰ تعلیم بنیں اور 2009ء و 2018ء میں تنظیم آزادی فلسطین کی انتظامی کمیٹی کی پہلی خاتون رکن منتخب ہوئیں۔"
