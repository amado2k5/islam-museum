  ar: "عند البلاذري: من أهل مرو الروذ فيمن قدم مع الدعاة العباسيين من خراسان ولّاه موسى الهادي المغرب فحصره حريش من جند الثغر من تونس بقيروان إفريقية فخرج إليه فقاتله فأصابه سهم في المعركة فسقط ميتاً وأصحابه لا يعلمون بمصابه فسمّي الأغلب الشهيد."
  en: "In al-Baladhuri: of Marw al-Rudh's people among the Masawwida from Khurasan; Musa al-Hadi gave him the Maghreb, Harish of the Tunis frontier army besieged him at Qayrawan, he sallied and fought, an arrow struck him in battle and he fell dead, his companions unaware — so he was called al-Aghlab al-Shahid."
