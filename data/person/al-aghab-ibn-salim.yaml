label: { ar: "الأغلب بن سالم التميمي", en: "al-Aghlab ibn Salim al-Tamimi", fr: "Al-Aghlab ibn Salim al-Tamimi", es: "al-Aghlab ibn Salim al-Tamimi" }
summary:
  ar: "عند البلاذري: من أهل مرو الروذ فيمن قدم مع الدعاة العباسيين من خراسان ولّاه موسى الهادي المغرب فحصره حريش من جند الثغر من تونس بقيروان إفريقية فخرج إليه فقاتله فأصابه سهم في المعركة فسقط ميتاً وأصحابه لا يعلمون بمصابه فسمّي الأغلب الشهيد."
  en: "In al-Baladhuri: of Marw al-Rudh's people among the Masawwida from Khurasan; Musa al-Hadi gave him the Maghreb, Harish of the Tunis frontier army besieged him at Qayrawan, he sallied and fought, an arrow struck him in battle and he fell dead, his companions unaware — so he was called al-Aghlab al-Shahid."
  fr: "Chez al-Baladhuri : originaire de Marw al-Rudh, parmi les Masawwida du Khorassan ; Musa al-Hadi lui confia le Maghreb. Harish, de l’armée frontalière de Tunis, l’assiégea à Kairouan ; il sortit combattre, fut frappé d’une flèche et tomba mort sans que ses compagnons le sachent — d’où son nom d’al-Aghlab al-Shahid."
  es: "En al-Baladhuri: de la gente de Marw al-Rudh entre los Masawwida de Jorasán; Musa al-Hadi le dio el Magreb, Harish del ejército fronterizo de Túnez lo sitió en Qayrawan, salió y luchó, una flecha lo alcanzó en la batalla y cayó muerto, sus compañeros no lo sabían, por lo que fue llamado al-Aghlab al-Shahid."
