summary:
  ar: "حاكم دبي (1958–1990) وأحد الآباء المؤسسين لدولة الإمارات العربية المتحدة، وأول نائب لرئيسها (1971–1990) ورئيس وزرائها من 30 أبريل 1979 حتى وفاته. أدار شؤون الإمارة فعليًا منذ أواخر الثلاثينيات، وقاد تحويل دبي من بلدة صغيرة على الخور إلى ميناء ومركز تجاري حديث: حفر الخور وتوسعته، وميناء راشد بعد اكتشاف النفط في حقل فتح سنة 1966، وكان مع زايد بن سلطان ركيزة قيام الاتحاد في 2 ديسمبر 1971. توفي في دبي في 7 أكتوبر 1990 وخلفه ابنه مكتوم."
  en: "Ruler of Dubai (1958–1990), a founding father of the United Arab Emirates, its first Vice President (1971–1990) and its Prime Minister from 30 April 1979 until his death. He had effectively run the emirate since the late 1930s and led Dubai's transformation from a small creek settlement into a modern port and trading hub: the dredging and expansion of the Creek, Port Rashid after the 1966 Fateh oil discovery, and, with Zayed bin Sultan, the creation of the federation on 2 December 1971. He died at Dubai on 7 October 1990 and was succeeded by his son Maktoum."
  ur: "دبئی کے حکمران (1958ء–1990ء)، متحدہ عرب امارات کے بانیان میں سے ایک، اس کے پہلے نائب صدر (1971ء–1990ء) اور 30 اپریل 1979ء سے وفات تک اس کے وزیرِ اعظم۔ وہ 1930ء کی دہائی کے آخر سے عملی طور پر امارت کے امور چلا رہے تھے، اور انہوں نے دبئی کو کھور کے کنارے ایک چھوٹی بستی سے جدید بندرگاہ اور تجارتی مرکز میں بدلنے کی قیادت کی؛ 1966ء میں فتح تیل فیلڈ کی دریافت کے بعد پورٹ راشد تعمیر ہوا، اور زاید بن سلطان کے ساتھ 2 دسمبر 1971ء کو وفاق کے قیام میں کلیدی کردار ادا کیا۔ 7 اکتوبر 1990ء کو دبئی میں وفات پائی اور ان کے صاحبزادے مکتوم جانشین بنے۔"
