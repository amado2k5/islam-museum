label:
  ar: "أحمد بن يحيى، ابن الهادي"
  en: "Ahmad ibn Yahya, son of al-Hadi"
  ur: "احمد بن یحییٰ، ہادی کے بیٹے"
  es: "Ahmad ibn Yahya, son of al-Hadi"
  fr: "Ahmad ibn Yahya, son of al-Hadi"
summary:
  ar: "ابن الإمام الهادي، صحبه إلى نجران سنة 294هـ، وأرسله لصرف بني ربيعة من راحة فصرفهم وجاء بهم إليه."
  en: "Son of the imam al-Hadi, who accompanied him to Najran in 294 AH; sent to turn Banu Rabi'a away from Raha, he brought them back to his father."
  ur: "امام ہادی کے بیٹے؛ 294ھ میں نجران میں ان کے ساتھ گئے، اور بنی ربیعہ کو راحہ سے موڑنے کے لیے بھیجے گئے تو انہیں واپس ہادی کے پاس لائے۔"
  es: "Hijo del imán al-Hadi, quien lo acompañó a Najran en el año 294 de la Hégira; enviado para alejar a los Banu Rabi'a de Raha, los trajo de regreso con su padre."
  fr: "Fils de l'imam al-Hadi, qui l'accompagna à Najran en 294 AH; envoyé pour éloigner les Banu Rabi'a de Raha, il les ramena à son père."
