summary:
  en: "Chief of Tayy' whose delegation came to Medina in the Year of Delegations; the Prophet renamed him Zayd al-Khayr ('the good') and said no Arab praised to him had ever fallen short of the praise except this man."
  ar: "سيد طيء الذي قدم في وفد قومه على النبي في عام الوفود فأسلم وحسن إسلامه؛ سمّاه النبي زيد الخير وقال: ما ذُكر لي رجل من العرب بفضل ثم جاءني إلا رأيته دون ما يُقال فيه إلا زيد الخيل."
  ur: "قبیلہ طیء کے سردار جو عام الوفود میں اپنی قوم کے وفد کے ساتھ مدینہ آئے؛ نبی نے ان کا نام زید الخیر رکھا اور فرمایا کہ عربوں میں جس کسی کی تعریف ان کے سامنے کی گئی وہ ملاقات پر تعریف سے کم نکلا سوائے اس شخص کے۔"
