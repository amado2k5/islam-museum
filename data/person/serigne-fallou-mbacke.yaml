summary:
  ar: "عالم سنغالي (1888–1968)، الابن الثاني لأحمدو بمبا والخليفة الثاني للمريدية من سنة 1945 حتى وفاته. أكمل بناء الجامع الكبير في طوبى ودشّنه سنة 1963، وكان مقصودًا بالدعاء عند أتباعه، وما يزال المگل السنوي في طوبى يُقام في ذكرى مولده."
  en: "Senegalese scholar (1888-1968), second son of Amadou Bamba and second caliph of the Mourides from 1945 until his death. He completed the Great Mosque of Touba and inaugurated it in 1963; his followers sought his prayers, and the annual Magal at Touba is still held on his birthday."
  ur: "سینیگال کے عالم (1888ء–1968ء)، احمد بمبا کے دوسرے فرزند اور مریدیہ کے دوسرے خلیفہ، 1945ء سے اپنی وفات تک۔ انہوں نے طوبیٰ کی جامع مسجد مکمل کرائی اور 1963ء میں اس کا افتتاح کیا؛ ان کے پیروکار ان کی دعا کے طالب ہوتے تھے، اور طوبیٰ کا سالانہ مگل آج بھی ان کے یوم پیدائش پر منعقد ہوتا ہے۔"
