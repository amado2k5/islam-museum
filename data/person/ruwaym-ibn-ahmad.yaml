summary:
  ar: "أبو محمد رويم بن أحمد البغدادي، يعدّه القشيري في الرسالة «من جلة المشايخ»، وكان مقرئاً فقيهاً على مذهب داود، ومات سنة 303هـ؛ ومن قوله إن من حكم الحكيم أن يوسع على إخوانه في الأحكام ويضيق على نفسه فيها {cite:risala-qushayriyya-minhaj-2017 p. 163}."
  en: "Abu Muhammad Ruwaym ibn Ahmad of Baghdad, whom al-Qushayri in the Risala counts 'among the great shaykhs'; a Qur'an reciter and jurist of Dawud's school, he died in 303 AH; among his sayings is that the wise man is lenient with his brethren in rulings and strict with himself {cite:risala-qushayriyya-minhaj-2017 p. 163}."
  ur: "ابو محمد رویم بن احمد بغدادی، جنہیں قشیری رسالے میں «بڑے مشائخ میں سے» شمار کرتے ہیں؛ قاری اور داود کے مسلک کے فقیہ، 303ھ میں فوت ہوئے؛ ان کا قول ہے کہ دانا آدمی احکام میں اپنے بھائیوں پر وسعت اور اپنے نفس پر تنگی رکھتا ہے {cite:risala-qushayriyya-minhaj-2017 p. 163}۔"
