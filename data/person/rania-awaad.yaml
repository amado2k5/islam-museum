summary:
  ar: "طبيبة نفسية مصرية أمريكية في جامعة ستانفورد، حيث تشغل منصب أستاذة سريرية في الطب النفسي وتدير مختبر ستانفورد للصحة النفسية للمسلمين وعلم النفس الإسلامي. وهي رئيسة «مارستان» وإحدى مؤسِّسيها، وهي منظمة غير ربحية للصحة النفسية الشاملة تخدم المجتمعات المسلمة، وكانت المديرة السريرية المؤسِّسة لفرع مركز خليل في منطقة الخليج. وقبل دراسة الطب درست العلوم الشرعية الكلاسيكية في دمشق وتحمل إجازات منها إجازة في القراءات القرآنية العشر."
  en: "Egyptian-American psychiatrist at Stanford University, where she is a Clinical Professor of Psychiatry and directs the Stanford Muslim Mental Health and Islamic Psychology Lab. She is President and Co-Founder of Maristan, a holistic mental health nonprofit serving Muslim communities, and was the founding Clinical Director of the Khalil Center's Bay Area branch. Before medicine she pursued classical Islamic studies in Damascus and holds ijazas including one in all ten canonical Qur'anic recitations."
  ur: "اسٹینفورڈ یونیورسٹی میں مصری نژاد امریکی ماہرِ نفسیات؛ وہ نفسیات کی کلینیکل پروفیسر ہیں اور اسٹینفورڈ مسلم مینٹل ہیلتھ و اسلامک سائیکالوجی لیب کی ڈائریکٹر ہیں۔ وہ «مارستان» کی صدر اور شریک بانی ہیں، جو مسلم برادریوں کی خدمت کرنے والا کلی صحتِ نفسی کا غیر منفعتی ادارہ ہے، اور خلیل سینٹر کی خلیجی شاخ کی بانی کلینیکل ڈائریکٹر رہیں۔ طب سے پہلے انہوں نے دمشق میں کلاسیکی اسلامی علوم پڑھے اور دس قرآنی قراءتوں سمیت متعدد اجازے رکھتی ہیں۔"
