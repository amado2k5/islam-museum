summary:
  ar: "الحسن بن محمد بن الحسين، نظام الدين القمي النيسابوري، المعروف بالأعرج. مفسر وفقيه، له اشتغال بالحكمة والرياضيات، ذكره إبراهيم عطوة من أعلام القرن الثامن الهجري. من تصانيفه غرائب القرآن ورغائب الفرقان في تفسير القرآن، وأوقاف القرآن، ولب التأويل، وشرح الشافية في الصرف المعروف بشرح النظام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  en: "al-Hasan ibn Muhammad ibn al-Husayn, Nizam al-Din al-Qummi al-Nisaburi, known as al-A'raj: a Qur'an commentator and jurist with interests in philosophy and mathematics. Ibrahim Atwa, in the introduction to his Gharayib al-Qur'an, places him among the scholars of the eighth century AH. His works include Gharayib al-Qur'an wa Raghaib al-Furqan, known as the Tafsir of al-Nisaburi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
