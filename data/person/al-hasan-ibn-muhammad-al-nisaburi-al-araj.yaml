id: person/al-hasan-ibn-muhammad-al-nisaburi-al-araj
class: person
label: { ar: "الحسن بن محمد النيسابوري الأعرج", en: "al-Hasan ibn Muhammad al-Nisaburi al-A'raj", es: "al-Hasan ibn Muhammad al-Nisaburi al-A'raj", fr: "al-Hasan ibn Muhammad al-Nisaburi al-A'raj", ur: "الحسن بن محمد النسابوری العراج" }
summary:
  ar: "الحسن بن محمد بن الحسين، نظام الدين القمي النيسابوري، المعروف بالأعرج. مفسر وفقيه، له اشتغال بالحكمة والرياضيات، ذكره إبراهيم عطوة من أعلام القرن الثامن الهجري. من تصانيفه غرائب القرآن ورغائب الفرقان في تفسير القرآن، وأوقاف القرآن، ولب التأويل، وشرح الشافية في الصرف المعروف بشرح النظام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  en: "al-Hasan ibn Muhammad ibn al-Husayn, Nizam al-Din al-Qummi al-Nisaburi, known as al-A'raj: a Qur'an commentator and jurist with interests in philosophy and mathematics. Ibrahim Atwa, in the introduction to his Gharayib al-Qur'an, places him among the scholars of the eighth century AH. His works include Gharayib al-Qur'an wa Raghaib al-Furqan, known as the Tafsir of al-Nisaburi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  es: "al-Hasan ibn Muhammad ibn al-Husayn, Nizam al-Din al-Qummi al-Nisaburi, conocido como al-A'raj: comentarista y jurista del Corán interesado en filosofía y matemáticas. Ibrahim Atwa, en la introducción a su Gharayib al-Qur'an, lo ubica entre los eruditos del siglo VIII d.H. Sus obras incluyen Gharayib al-Qur'an wa Raghaib al-Furqan, conocido como el Tafsir de al-Nisaburi. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  fr: "al-Hasan ibn Muhammad ibn al-Husayn, Nizam al-Din al-Qummi al-Nisaburi, connu sous le nom d'al-A'raj: commentateur du Coran et juriste s'intéressant à la philosophie et aux mathématiques. Ibrahim Atwa, dans l'introduction de son Gharayib al-Coran, le place parmi les savants du huitième siècle de l'hégire. Ses œuvres incluent Gharayib al-Qur'an wa Raghaib al-Furqan, connu sous le nom de Tafsir d'al-Nisaburi. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.7165}"
  ur: "الحسن بن محمد بن الحسین، نظام الدین القمی النسابوری، جسے العراج کے نام سے جانا جاتا ہے: فلسفہ اور ریاضی میں دلچسپی رکھنے والے قرآن کے مفسر اور فقیہ۔ ابراہیم عطوہ نے اپنے غریب القرآن کے تعارف میں انہیں آٹھویں صدی ہجری کے علماء میں شمار کیا ہے۔ ان کی تصانیف میں غرائب القرآن و راغب الفرقان شامل ہے، جسے النسابوری کی تفسیر کہا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7165}"
