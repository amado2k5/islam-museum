summary:
  ar: "أحمد بن الحسين بن علي أبو حامد المروزي المعروف بابن الطبري ⁦(ت 377هـ)⁩؛ كان أبوه من أهل همذان، وسمع من جماعة من المحدثين وكان أحد العباد المجتهدين والعلماء المتقنين حافظاً للحديث بصيراً بالأثر، ورد بغداد في حداثته فتفقه بها ودرس على أبي الحسن الكرخي مذهب أبي حنيفة، ثم عاد إلى خراسان فولي بها قضاء القضاة وصنّف الكتب والتاريخ، ثم دخل بغداد وقد علت سنّه فحدّث بها وكتب الناس عنه بانتخاب الدارقطني، ووثّقه البرقاني؛ توفي بمرو في صفر سنة سبع وسبعين وبعضهم يقول سنة ثلاث وسبعين {cite:muntazam-ibn-al-jawzi j.7 p.137}."
  en: "Ahmad b. al-Husayn Abu Hamid al-Marwazi, known as Ibn al-Tabari (d. 377): son of a Hamadani father, he trained in Baghdad under Abu'l-Hasan al-Karkhi in Abu Hanifa's school, returned to Khurasan as its chief qadi, composed books and a chronicle, then re-entered Baghdad in old age to transmit — taken up by al-Daraqutni and certified by al-Barqani; he died at Marw in Safar 377, some say 373 {cite:muntazam-ibn-al-jawzi j.7 p.137}."
  es: "Ahmad b. al-Husayn Abu Hamid al-Marwazi, conocido como Ibn al-Tabari (m. 377): hijo de un padre hamadani, se formó en Bagdad con Abu'l-Hasan al-Karkhi en la escuela de Abu Hanifa, regresó a Jorasán como su cadí principal, compuso libros y una crónica, luego volvió a entrar en Bagdad en la vejez para transmitirla, recogida por al-Daraqutni y certificada por al-Barqani; murió en Marw en Safar 377, algunos dicen 373 {cite:muntazam-ibn-al-jawzi j.7 p.137}."
  fr: "Ahmad b. al-Husayn Abu Hamid al-Marwazi, connu sous le nom d'Ibn al-Tabari (d. 377): fils d'un père Hamadani, il se forma à Bagdad auprès d'Abu'l-Hasan al-Karkhi dans l'école d'Abu Hanifa, retourna au Khorasan comme son cadi en chef, composa des livres et une chronique, puis retourna à Bagdad à un âge avancé pour transmettre — repris par al-Daraqutni et certifié par al-Barqani; il mourut à Marw en Safar 377, certains disent 373 {cite:muntazam-ibn-al-jawzi j.7 p.137}."
  ur: "احمد بی۔ الحسین ابو حامد المروازی، جسے ابن الطبری کے نام سے جانا جاتا ہے ⁦(متوفی 377)⁩: ایک ہمدانی والد کے بیٹے، اس نے بغداد میں ابوحنیفہ کے مکتب میں ابوالحسن الکرخی کے ماتحت تربیت حاصل کی، خراسان واپس اس کے سربراہ قادی کی حیثیت سے واپس آئے، کتابیں مرتب کیں اور ایک تاریخ کو بعثت میں لے جایا گیا۔ الدارقطنی اور البرقانی سے سند یافتہ؛ ان کی وفات صفر 377 میں مروہ میں ہوئی، بعض کہتے ہیں کہ 373 {حوالہ:منتظم ابن الجوزی ج7 ص137}۔"
  tr: "Ahmed ibn al-Hüseyin bin Ali Ebu Hamid el-Mervazi, İbn el-Tabari olarak bilinir (ö. 377 H.), babası Hamazan'dan idi ve bir grup hadis aliminden dinlendi. O, gayretli alimlerden ve titiz alimlerden biriydi, hadis ezbercisi ve gelenekte anlayışlıydı. Gençliğinde Bağdat'a döndü, orada eğitim aldı ve Ebu Hasan el-Karhi'nin yanında eğitim aldı, Ebu Hanife'nin okulunda eğitim aldı. Sonra Horasan'a döndü, burada yargıç olarak görev yaptı ve kitaplar ile tarih yazdı. Daha sonra ileri yaşta Bağdat'a girdi, orada rivayet etti ve insanlar onun hakkında yazdılar, el-Daraqutni'yi seçerek. El-Barqani ona güvendi; yetmiş yedinci yılda Merw'de ve bazıları yetmiş üçüncü yılda öldü {atıf:Muntazam-ibn-al-Jawzi j.7 s.137}."
  id: "Ahmad ibn al-Husayn ibn Ali Abu Hamid al-Marwazi, dikenal sebagai Ibn al-Tabari (wafat 377 H); ayahnya berasal dari Hamadhan, dan ia mendengar dari sekelompok ulama hadis. Ia adalah salah satu ulama yang rajin dan teliti, menghafal hadits, dan tajam dalam tradisi. Ia kembali ke Baghdad saat muda, belajar di sana dan belajar di bawah Abu al-Hasan al-Karkhi, sekolah Abu Hanifa. Kemudian ia kembali ke Khorasan, di mana ia menjabat sebagai hakim dan menulis buku serta sejarah. Ia kemudian memasuki Baghdad pada usia lanjut, bercerita di sana, dan orang-orang menulis tentangnya dengan memilih al-Daraqutni. Al-Barqani mempercayainya; ia meninggal di Marw di Safar pada tahun tujuh puluh tujuh, dan beberapa orang mengatakan pada tahun tujuh puluh tiga {cite:muntazam-ibn-al-jawzi j.7 hlm.137}."
