summary:
  ar: "أحمد بن الحسين بن علي أبو حامد المروزي المعروف بابن الطبري (ت 377هـ)؛ كان أبوه من أهل همذان، وسمع من جماعة من المحدثين وكان أحد العباد المجتهدين والعلماء المتقنين حافظاً للحديث بصيراً بالأثر، ورد بغداد في حداثته فتفقه بها ودرس على أبي الحسن الكرخي مذهب أبي حنيفة، ثم عاد إلى خراسان فولي بها قضاء القضاة وصنّف الكتب والتاريخ، ثم دخل بغداد وقد علت سنّه فحدّث بها وكتب الناس عنه بانتخاب الدارقطني، ووثّقه البرقاني؛ توفي بمرو في صفر سنة سبع وسبعين وبعضهم يقول سنة ثلاث وسبعين {cite:muntazam-ibn-al-jawzi j.7 p.137}."
  en: "Ahmad b. al-Husayn Abu Hamid al-Marwazi, known as Ibn al-Tabari (d. 377): son of a Hamadani father, he trained in Baghdad under Abu'l-Hasan al-Karkhi in Abu Hanifa's school, returned to Khurasan as its chief qadi, composed books and a chronicle, then re-entered Baghdad in old age to transmit — taken up by al-Daraqutni and certified by al-Barqani; he died at Marw in Safar 377, some say 373 {cite:muntazam-ibn-al-jawzi j.7 p.137}."
