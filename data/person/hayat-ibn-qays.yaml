summary:
  ar: "الشيخ الكبير الولي الشهير حياة بن قيس الحراني، أحد الأربعة الذين قال فيهم أبو عبد الله القرشي «أربعة من المشايخ يتصرفون في قبورهم لحياتهم»: الشيخ معروف الكرخي والشيخ عبد القادر الجيلاني والشيخ عقيل المنبجي والشيخ حياة بن قيس الحراني؛ تخرج به كثير من المريدين وأنجبوا وله من الكرامات أحوال تذهل العقول، وحكى الشيخ غانم بن يعلى أنه رآه في جزيرة ببحر الهند يصلي بالمتوحدين ثم طويت له الأرض فصلى الصبح بحران، وتوفي سنة إحدى وثمانين وخمسمائة بحران {cite:shadharat-dhahab p. 749}."
  en: "The great and famous saint Hayat b. Qays of Harran, one of the four shaykhs of whom Abu Abdallah al-Qurashi said 'four shaykhs act freely from their graves as in life': Ma'ruf al-Karkhi, Abd al-Qadir al-Jilani, Aqil al-Manbiji and Hayat b. Qays; many aspirants trained under him and flourished, and marvels that stagger the mind are told of him — Ghanim b. Ya'la saw him lead a night prayer on an Indian Ocean island, then the earth folded for him and he prayed dawn at Harran; he died at Harran in 581 {cite:shadharat-dhahab p. 749}."
