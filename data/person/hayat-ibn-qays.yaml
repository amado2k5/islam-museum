summary:
  ar: "الشيخ الكبير الولي الشهير حياة بن قيس الحراني، أحد الأربعة الذين قال فيهم أبو عبد الله القرشي «أربعة من المشايخ يتصرفون في قبورهم لحياتهم»: الشيخ معروف الكرخي والشيخ عبد القادر الجيلاني والشيخ عقيل المنبجي والشيخ حياة بن قيس الحراني؛ تخرج به كثير من المريدين وأنجبوا وله من الكرامات أحوال تذهل العقول، وحكى الشيخ غانم بن يعلى أنه رآه في جزيرة ببحر الهند يصلي بالمتوحدين ثم طويت له الأرض فصلى الصبح بحران، وتوفي سنة إحدى وثمانين وخمسمائة بحران {cite:shadharat-dhahab p. 749}."
  en: "The great and famous saint Hayat b. Qays of Harran, one of the four shaykhs of whom Abu Abdallah al-Qurashi said 'four shaykhs act freely from their graves as in life': Ma'ruf al-Karkhi, Abd al-Qadir al-Jilani, Aqil al-Manbiji and Hayat b. Qays; many aspirants trained under him and flourished, and marvels that stagger the mind are told of him — Ghanim b. Ya'la saw him lead a night prayer on an Indian Ocean island, then the earth folded for him and he prayed dawn at Harran; he died at Harran in 581 {cite:shadharat-dhahab p. 749}."
  es: "El gran y famoso santo Hayat b. Qays de Harran, uno de los cuatro jeques de los que Abu Abdallah al-Qurashi dijo que \"cuatro jeques actúan libremente desde sus tumbas como en vida\": Ma'ruf al-Karkhi, Abd al-Qadir al-Jilani, Aqil al-Manbiji y Hayat b. Qays; muchos aspirantes se formaron con él y prosperaron, y se cuentan sobre él maravillas que asombran la mente: Ghanim b. Ya'la lo vio dirigir una oración nocturna en una isla del Océano Índico, luego la tierra se plegó para él y oró al amanecer en Harran; murió en Harran en 581 {cite:shadharat-dhahab p. 749}."
  fr: "Le grand et célèbre saint Hayat b. Qays de Harran, l'un des quatre cheikhs dont Abu Abdallah al-Qurashi disait qu'« ils agissent librement depuis leurs tombes comme de leur vivant »: Ma'ruf al-Karkhi, Abd al-Qadir al-Jilani, Aqil al-Manbiji et Hayat b. Qays; de nombreux aspirants furent formés sous sa tutelle et s'épanouirent, et des prodiges stupéfiants sont rapportés à son sujet — Ghanim b. Ya'la le vit diriger une prière nocturne sur une île de l'océan Indien, puis la terre se replia sur lui et il pria à l'aube à Harran; il mourut à Harran en 581 {cite: shadharat-dhahab p. 749}."
