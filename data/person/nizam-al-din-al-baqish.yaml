class: person
label: { ar: "نظام الدين البقش", en: "Nizam al-Din al-Baqish", es: "Nizam al-Din al-Baqish", fr: "Nizam al-Din al-Baqish", ur: "نظام الدین البقیش" }
summary:
  ar: "نظام الدين البقش مملوك قطب الدين أيلغازي صاحب ماردين؛ رتبه شاه أرمن صاحب خلاط على تربية ابن مولاه حسام الدين بولق أرسلان وتدبير مملكته، وكان ديناً خيراً عادلاً حسن السيرة فأحسن تربية الولد وتزوج أمه، فلما كبر الولد لم يمكنه النظام من مملكته، وكان لمملوكه لؤلؤ — الذي تحكم في دولته — يحمله على ما يفعل؛ فلما مات الولد رتب أخاه الأصغر الملقب طب الدين في الملك وليس له منه إلا الاسم والحكم للنظام ولؤلؤ إلى سنة إحدى وستمائة، فمرض النظام فأتاه قطب الدين يعوده فضرب لؤلؤ بسكين فقتله ثم دخل على النظام فقتله أيضاً وألقى الرأسين إلى الأجناد فأذعنوا له بالطاعة {cite:kamil-ibn-al-athir p. 129}."
  en: "Al-Baqish, Ilghazi's mamluk and the virtuous regent of Mardin — pious, just, he raised the child Yuluq Arslan and married his mother, yet never let the grown prince rule; his own mamluk Lu'lu' drove him, and when he set Yuluq's infant brother Taj al-Din as a name-only king, the young Qutb al-Din ended the regency in 601 with a dagger — both heads thrown to the troops {cite:kamil-ibn-al-athir p. 129}."
  es: "Al-Baqish, mameluco de Ilghazi y virtuoso regente de Mardin, piadoso y justo, crió al niño Yuluq Arslan y se casó con su madre, pero nunca dejó que el príncipe adulto gobernara; su propio mameluco Lu'lu' lo expulsó, y cuando nombró al hermano pequeño de Yuluq, Taj al-Din, rey solo de nombre, el joven Qutb al-Din puso fin a la regencia en 601 con una daga; ambas cabezas fueron arrojadas a las tropas {cite:kamil-ibn-al-athir p. 129}."
  fr: "Al-Baqish, le mamelouk d'Ilghazi et le vertueux régent de Mardin — pieux, juste, il éleva l'enfant Yuluq Arslan et épousa sa mère, mais ne laissa jamais le prince adulte régner; son propre mamelouk Lu'lu' le chassa, et lorsqu'il fit du jeune frère de Yuluq, Taj al-Din, un roi de nom seulement, le jeune Qutb al-Din mit fin à la régence en 601 avec un poignard — les deux têtes jetées aux troupes {cite:kamil-ibn-al-athir p. 129}."
  ur: "البقیش، الغازی کا مملوک اور ماردین کا نیک حکمران - پرہیزگار، انصاف پسند، اس نے بچے یولوق ارسلان کی پرورش کی اور اس کی ماں سے شادی کی، پھر بھی بڑے شہزادے کو کبھی حکومت کرنے نہیں دیا۔ اس کے اپنے مملوک لولو نے اسے بھگا دیا، اور جب اس نے یولق کے شیرخوار بھائی تاج الدین کو صرف نام کا بادشاہ مقرر کیا تو نوجوان قطب الدین نے 601 میں خنجر سے حکومت کا خاتمہ کر دیا - دونوں کے سر فوجیوں کی طرف پھینک دیے گئے۔ 129}۔"
  tr: "Nizam al-Baqsh al-Baqsh Memlük Kutb al-Din İlghazi, Mardin'in hükümdarı; Şah Arman Sahib Khalat tarafından, efendisi oğlu Hussam al-Din Bulaq Arslan'ı büyütmek ve krallığını yönetmek üzere atandı. O, iyi ve adil bir dindardı; çocuğu iyi yetiştirdi ve annesiyle evlendi. Çocuk büyüdüğünde, tarikatı krallığından miras alamadı ve memlüklerinin Lulu'su vardı—o da devletini yönetiyordu —eylemlerinde ona destek olmak için. Çocuk öldüğünde, küçük kardeşi Tibb al-Din'in yerine geçmesini ve sadece Nizam ve Lulu'nun adını ve yönetimini elinde tutmasını sağladı, ta ki 601 yılına kadar. Nizam hastalandı ve Qutb al-Din onu ziyaret etti, Lulu'yu bıçakla vurdu ve öldürdü. Sonra Nizam'a saldırdı, onu da öldürdü ve her iki başını da askerlere attı; askerler itaat ederek ona boyun eğdiler {alıntı:Kamil-ibn-al-Athir s. 129}."
  id: "Nizam al-Din al-Baqsh Mamluk Qutb al-Din Ilghazi, penguasa Mardin; ia ditunjuk oleh Shah Arman Sahib Khalat untuk membesarkan putra tuannya Hussam al-Din Bulaq Arslan dan mengelola kerajaannya. Ia adalah agama yang baik, adil, dan beradab yang membesarkan anak itu dengan baik dan menikahi ibunya. Ketika anak itu dewasa, ia tidak dapat mewarisi ordo dari kerajaannya, dan mamluknya didukung oleh Lulu'—yang memerintah negaranya—dalam tindakannya. Ketika anak itu meninggal, ia mengatur agar adik laki-lakinya, yang dijuluki Tibb al-Din, menggantikannya dan hanya memegang nama serta kekuasaan Nizam dan Lulu', hingga tahun 601. Nizam jatuh sakit, dan Qutb al-Din datang mengunjunginya, memukul Lulu' dengan pisau dan membunuhnya. Kemudian ia menyerang Nizam dan membunuhnya juga, lalu melemparkan kedua kepala kepada para prajurit, yang tunduk padanya sebagai ketaatan {cite:Kamil-ibn-al-Athir hlm. 129}."
