id: person/nizam-al-din-al-baqish
class: person
label: { ar: "نظام الدين البقش", en: "Nizam al-Din al-Baqish" }
summary:
  ar: "نظام الدين البقش مملوك قطب الدين أيلغازي صاحب ماردين؛ رتبه شاه أرمن صاحب خلاط على تربية ابن مولاه حسام الدين بولق أرسلان وتدبير مملكته، وكان ديناً خيراً عادلاً حسن السيرة فأحسن تربية الولد وتزوج أمه، فلما كبر الولد لم يمكنه النظام من مملكته، وكان لمملوكه لؤلؤ — الذي تحكم في دولته — يحمله على ما يفعل؛ فلما مات الولد رتب أخاه الأصغر الملقب طب الدين في الملك وليس له منه إلا الاسم والحكم للنظام ولؤلؤ إلى سنة إحدى وستمائة، فمرض النظام فأتاه قطب الدين يعوده فضرب لؤلؤ بسكين فقتله ثم دخل على النظام فقتله أيضاً وألقى الرأسين إلى الأجناد فأذعنوا له بالطاعة {cite:kamil-ibn-al-athir p. 129}."
  en: "Al-Baqish, Ilghazi's mamluk and the virtuous regent of Mardin — pious, just, he raised the child Yuluq Arslan and married his mother, yet never let the grown prince rule; his own mamluk Lu'lu' drove him, and when he set Yuluq's infant brother Taj al-Din as a name-only king, the young Qutb al-Din ended the regency in 601 with a dagger — both heads thrown to the troops {cite:kamil-ibn-al-athir p. 129}."
