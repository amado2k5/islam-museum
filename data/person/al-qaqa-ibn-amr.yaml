label: { ar: "القعقاع بن عمرو", en: "al-Qa'qa' ibn 'Amr" }
summary:
  ar: "بطل القادسية، قدم مع هاشم بن عتبة في المدد من الشام في خمسة آلاف فارس من ربيعة ومضر وألف من اليمن بعد فتح دمشق بشهر، فبرز أمام الصف ونادى هل من مبارز فخرج إليه بهمن بن جاذويه وهو ذو الحاجب فنادى يا لثارات أبي عبيد وسليط وأصحابهم يوم الجسر فقتله، وقيل إنه قتل ذلك اليوم ثلاثين رجلاً في ثلاثين حملة كل حملة يقتل فيها رجلاً وكان آخر من قتل بزرجمهر {cite:muruj-al-dhahab p. 609-610}."
  en: "The champion who came with the Syria relief, called for single combat, and killed Dhu'l-Hajib Bahman ibn Jadhawayh crying 'for the vengeance of Abu 'Ubayd, Sulayt and the Bridge' — thirty men in thirty charges that day {cite:muruj-al-dhahab p. 609-610}."
