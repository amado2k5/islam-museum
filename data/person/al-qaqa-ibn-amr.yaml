label: { ar: "القعقاع بن عمرو", en: "al-Qa'qa' ibn 'Amr", fr: "al-Qa'qa' ibn 'Amr", es: "al-Qa'qa' ibn 'Amr", ur: "قعقاع بن عمرو" }
summary:
  ar: "بطل القادسية، قدم مع هاشم بن عتبة في المدد من الشام في خمسة آلاف فارس من ربيعة ومضر وألف من اليمن بعد فتح دمشق بشهر، فبرز أمام الصف ونادى هل من مبارز فخرج إليه بهمن بن جاذويه وهو ذو الحاجب فنادى يا لثارات أبي عبيد وسليط وأصحابهم يوم الجسر فقتله، وقيل إنه قتل ذلك اليوم ثلاثين رجلاً في ثلاثين حملة كل حملة يقتل فيها رجلاً وكان آخر من قتل بزرجمهر {cite:muruj-al-dhahab p. 609-610}."
  en: "The champion who came with the Syria relief, called for single combat, and killed Dhu'l-Hajib Bahman ibn Jadhawayh crying 'for the vengeance of Abu 'Ubayd, Sulayt and the Bridge' — thirty men in thirty charges that day {cite:muruj-al-dhahab p. 609-610}."
  fr: "Le champion qui est venu avec l'aide de la Syrie, a appelé à un combat unique, et a tué Dhu'l-Hajib Bahman ibn Jadhawayh criant \"pour la vengeance d'Abu 'Ubayd, Sulayt et le pont\" - trente hommes dans trente charges ce jour-là {cite:muruj-al-dhahab p. 609-610}."
  es: "El campeón que llegó con el socorro de Siria pidió un combate singular y mató a Dhu'l-Hajib Bahman ibn Jadhawayh clamando \"por la venganza de Abu 'Ubayd, Sulayt y el Puente\" — treinta hombres en treinta cargas ese día {cite:muruj-al-dhahab p. 609-610}."
  ur: "فاتح جو شام کی امداد کے ساتھ آیا تھا، اس نے ایک ہی لڑائی کا مطالبہ کیا، اور ذوالحجیب بہمن بن جداویہ کو 'ابو عبید، سلیط اور پل کے انتقام کا رونا روتے ہوئے' مار ڈالا - اس دن تیس افراد پر تیس الزامات میں {حوالہ: مروج الذہب صفحہ 609-610}۔"
