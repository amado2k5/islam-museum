id: person/ibn-asim-al-gharnati
class: person
label:
  ar: "ابن عاصم الغرناطي"
  en: "Ibn Asim al-Gharnati"
  es: "Ibn Asim al-Gharnati"
  fr: "Ibn Asim al-Gharnati"
  ur: "ابن عاصم الغرناطی۔"
roles: [scholar, qadi]
gender: male
summary:
  ar: "محمد بن محمد بن محمد، أبو بكر ابن عاصم القيسي الغرناطي، قاض من فقهاء المالكية بالأندلس، ولد وتوفي بغرناطة، كان يجلد الكتب في صباه ثم ولي قضاء القضاة ببلده، صاحب «تحفة الحكام في نكت العقود والأحكام» المعروفة بالعاصمية ووالد أبي يحيى ابن عاصم، 760 إلى 829 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 7 p. 45}."
  en: "Muhammad ibn Muhammad ibn Muhammad, Abu Bakr Ibn Asim al-Qaysi al-Gharnati, a judge and Maliki jurist of al-Andalus, born and died in Granada; he bound books in his youth and rose to chief judge of his city, wrote Tuhfat al-Hukkam fi nukat al-uqud wa-l-ahkam, known as al-Asimiyya, and was the father of Abu Yahya Ibn Asim, 760 to 829 AH (1359 to 1426 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 7 p. 45}."
  es: "Muhammad ibn Muhammad ibn Muhammad, Abu Bakr ibn Asim al-Qaysi al-Gharnati, juez y jurista maliki de al-Andalus, nacido y fallecido en Granada; encuadernó libros en su juventud y ascendió a juez principal de su ciudad, escribió Tuhfat al-Hukkam fi nukat al-uqud wa-l-ahkam, conocido como al-Asimiyya, y fue el padre de Abu Yahya Ibn Asim, 760 a 829 d. H. (1359 a 1426 d. C.) {cite:alam-zirikli-dar-al-ilm-2002 vol. 7p. 45}."
  fr: "Muhammad ibn Muhammad ibn Muhammad, Abu Bakr Ibn Asim al-Qaysi al-Gharnati, juge et juriste malékite d'al-Andalus, né et mort à Grenade; il a relié des livres dans sa jeunesse et est devenu juge en chef de sa ville, a écrit Tuhfat al-Hukkam fi nukat al-uqud wa-l-ahkam, connu sous le nom d'al-Asimiyya, et était le père d'Abu Yahya Ibn Asim, 760 à 829 AH (1359 à 1426 CE) {cite: alam-zirikli-dar-al-ilm-2002 vol. 19h. 45}."
  ur: "محمد بن محمد بن محمد، ابوبکر ابن عاصم القیسی الغرناتی، الاندلس کے ایک جج اور مالکی فقیہ، غرناطہ میں پیدا ہوئے اور فوت ہوئے۔ اس نے جوانی میں کتابیں باندھی اور اپنے شہر کے چیف منصف کے عہدے پر فائز ہوئے، تحفۃ الحکم فی نکات العقود والاحکام لکھی جسے العاصمیہ کہا جاتا ہے، اور ابو یحییٰ ابن عاصم کے والد تھے، 760 تا 829 ہجری ⁦(1359 تا 1426 عیسوی)⁩ {حوالہ:عالم-زرقلی-در-العلم-2002 جلد۔ 7 ص۔ 45}۔"
