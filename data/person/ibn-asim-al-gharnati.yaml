summary:
  ar: "محمد بن محمد بن محمد، أبو بكر ابن عاصم القيسي الغرناطي، قاض من فقهاء المالكية بالأندلس، ولد وتوفي بغرناطة، كان يجلد الكتب في صباه ثم ولي قضاء القضاة ببلده، صاحب «تحفة الحكام في نكت العقود والأحكام» المعروفة بالعاصمية ووالد أبي يحيى ابن عاصم، 760 إلى 829 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 7 p. 45}."
  en: "Muhammad ibn Muhammad ibn Muhammad, Abu Bakr Ibn Asim al-Qaysi al-Gharnati, a judge and Maliki jurist of al-Andalus, born and died in Granada; he bound books in his youth and rose to chief judge of his city, wrote Tuhfat al-Hukkam fi nukat al-uqud wa-l-ahkam, known as al-Asimiyya, and was the father of Abu Yahya Ibn Asim, 760 to 829 AH (1359 to 1426 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 7 p. 45}."
