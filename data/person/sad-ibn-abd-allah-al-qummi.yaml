label:
  ar: سعد بن عبد الله القمي
  en: Sa'd ibn 'Abd Allah al-Qummi
  es: "Sa'd ibn 'Abd Allah al-Qummi"
  fr: "Sa'd ibn 'Abd Allah al-Qummi"
  ur: "سعد بن عبد اللہ القمی"
roles:
- jurist
- scholar
gender: male
summary:
  ar: سعد بن عبد الله الأشعري القمي، أبو القاسم، فقيه إمامي من أهل قم سافر كثيراً في طلب الحديث، من كتبه «مقالات الإمامية» و«فضل قم والكوفة»، توفي سنة 300هـ.
  en: Imami (Shi'i) jurist Sa'd ibn Abd Allah al-Ash'ari al-Qummi, Abu al-Qasim, of Qum, who travelled much for hadith, whose books include Maqalat al-Imamiyya and Fadl Qum wa al-Kufa, d. 300 AH.
  es: "El jurista imami (chiíta) Sa'd ibn Abd Allah al-Ash'ari al-Qummi, Abu al-Qasim, de Qum, que viajó mucho en busca de hadices, cuyos libros incluyen Maqalat al-Imamiyya y Fadl Qum wa al-Kufa, d. 300 AH."
  fr: "Le juriste imami (chiite) Sa'd ibn Abd Allah al-Ash'ari al-Qummi, Abu al-Qasim, de Qum, qui a beaucoup voyagé pour les hadiths, dont les livres incluent Maqalat al-Imamiyya et Fadl Qum wa al-Kufa, d. 300AH."
  ur: "امامی ⁦(شیعہ)⁩ فقیہ سعد بن عبد اللہ العشری القمی، ابو القاسم، قم، جنہوں نے حدیث کے لیے بہت زیادہ سفر کیا، جن کی کتابوں میں مقالات الامامیہ اور فضل قم و الکوفہ شامل ہیں۔ 300ھ۔"
  tr: "Sa'd ibn Abdullah al-Ash'ari al-Qummi, Ebu el-Ksim, Kumlu bir İmam fihildi ve hadis arayışıyla geniş çapta seyahat etti. Kitapları arasında 'Mekalatü'l-İmamiyye' ve 'Kum ve Kufe'nin Erdemleri' bulunmaktadır. 300 Hicri yılında vefat etti."
  id: "Sa'd ibn Abdullah al-Ash'ari al-Qummi, Abu al-Qasim, adalah seorang ahli hukum Imami dari Qom yang banyak melakukan perjalanan mencari hadits. Di antara bukunya adalah 'Maqalat al-Imamiyyah' dan 'Kebajikan Qom dan Kufa.' Ia meninggal pada tahun 300 H."
