summary:
  ar: "إسماعيل بن الجواليقي الأديب ابن الأديب أبو القاسم بن أبي منصور الحنبلي؛ ولد في شعبان سنة اثنتي عشرة وخمسمائة وسمع من أبي الحسين وقرأ القرآن والأدب على أبيه وكان عالماً باللغة والعربية والأدب وله سمت حسن وقام مقام أبيه في دار الخلافة؛ قال ابن الجوزي ما رأينا ولداً أشبه أباه مثله حتى في مشيه وأفعاله، وقال ابن النجار كان من أعيان العلماء بالأدب صحيح النقل كثير المحفوظ حجة ثقة نبيلاً مليح الخط؛ توفي يوم الجمعة منتصف شوال سنة خمس وسبعين وخمسمائة ودفن بمقبرة الإمام أحمد {cite:shadharat-dhahab p. 729-730}."
  en: "Isma'il ibn al-Jawaliqi, the adab-man son of the adab-man Abu al-Mansur, Hanbali; b. Sha'ban 512, read Qur'an and adab on his father and took his place at the court — Ibn al-Jawzi: 'we never saw a son so like his father, even in walk and gestures', Ibn al-Najjar: 'sound in transmission, much memorised, a fine hand'; d. mid-Shawwal 575, buried at Imam Ahmad's cemetery {cite:shadharat-dhahab p. 729-730}."
