id: person/ismael-ibn-al-jawaliqi
class: person
label: { ar: "إسماعيل بن الجواليقي" }
names:
  - { value: "إسماعيل بن موهوب بن أحمد بن محمد بن الخضر بن الحسن بن محمد بن الجواليقي الأديب ابن الأديب أبو القاسم بن أبي منصور الحنبلي", kind: full }
summary:
  ar: "إسماعيل بن الجواليقي الأديب ابن الأديب أبو القاسم بن أبي منصور الحنبلي؛ ولد في شعبان سنة اثنتي عشرة وخمسمائة وسمع من أبي الحسين وقرأ القرآن والأدب على أبيه وكان عالماً باللغة والعربية والأدب وله سمت حسن وقام مقام أبيه في دار الخلافة؛ قال ابن الجوزي ما رأينا ولداً أشبه أباه مثله حتى في مشيه وأفعاله، وقال ابن النجار كان من أعيان العلماء بالأدب صحيح النقل كثير المحفوظ حجة ثقة نبيلاً مليح الخط؛ توفي يوم الجمعة منتصف شوال سنة خمس وسبعين وخمسمائة ودفن بمقبرة الإمام أحمد {cite:shadharat-dhahab p. 729-730}."
  en: "Isma'il ibn al-Jawaliqi, the adab-man son of the adab-man Abu al-Mansur, Hanbali; b. Sha'ban 512, read Qur'an and adab on his father and took his place at the court — Ibn al-Jawzi: 'we never saw a son so like his father, even in walk and gestures', Ibn al-Najjar: 'sound in transmission, much memorised, a fine hand'; d. mid-Shawwal 575, buried at Imam Ahmad's cemetery {cite:shadharat-dhahab p. 729-730}."
  es: "Isma'il ibn al-Jawaliqi, hijo del también adab-man Abu al-Mansur, Hanbali; n. Sha'ban 512, leyó el Corán y el adab de su padre y ocupó su lugar en la corte — Ibn al-Jawzi: 'nunca vimos un hijo tan parecido a su padre, incluso en andares y gestos', Ibn al-Najjar: 'buena transmisión, muy memorizado, una mano fina'; m. mediados de Shawwal 575, enterrado en el cementerio del Imam Ahmad {cite:shadharat-dhahab p. 729-730}."
  fr: "Isma'il ibn al-Jawaliqi, fils de l'érudit Abu al-Mansur, hanbalite; né en Sha'ban 512, il étudia le Coran et les arts martiaux auprès de son père et prit sa place à la cour — Ibn al-Jawzi: « Nous n'avons jamais vu un fils aussi semblable à son père, même dans sa démarche et ses gestes », Ibn al-Najjar: « Excellente transmission, grande mémoire, belle écriture »; mort au milieu du Shawwal 575, enterré au cimetière de l'imam Ahmad {cite: shadharat-dhahab p. 729-730}."
  ur: "اسمٰعیل ابن الجولیکی، ادیب انسان ابو المنصور، حنبلی کا بیٹا۔ ب شعبان 512، اپنے والد پر قرآن اور ادب پڑھا اور دربار میں ان کی جگہ لے لی - ابن الجوزی: 'ہم نے کبھی باپ جیسا بیٹا نہیں دیکھا، حتیٰ کہ چلنے پھرنے اور اشاروں میں بھی'، ابن النجار: 'نصیحت میں آواز، بہت زیادہ حافظ، عمدہ ہاتھ'؛ d وسط شوال 575، امام احمد کے قبرستان میں دفن 729-730}۔"
  tr: "İsmail bin cavalı, edebi figür Ebu el-Kasim bin Ebi Mansur el-Hanbali'nin oğlu; 570 Hicri yılında Şaban'da doğmuş, Ebu el-Hüseyin'den haberdar olup babasının yanında Kur'an ve edebiyat çalışmıştır. Dil, Arapça ve edebiyat bilgisine sahipti, iyi bir üne sahipti ve halifelikte babasının yerinde durdu. İbn el-Cevzi şöyle demiştir: Babasına benzeyen bir oğulun, yürüyüşünde ve davranışlarında bile görmedik. İbn el-Neccar şöyle demiştir: Edebiyatın önde gelen alimlerindendi, aktarımı doğru, sıkça kanıt olarak korunan, güvenilir, soylu ve konuşurdu. 575 Hicri yılında, Şema günü Şevval'ın ortasında vefat etti ve İmam Ahmed mezarlığına defnedildi {alıntı:şadharat-dhahab, s. 729-730}."
  id: "Ismail ibn al-Jawaliqi, tokoh sastra putra sastra Abu al-Qasim ibn Abi Mansur al-Hanbali; lahir di Sha'ban pada tahun 570 H, ia mendengar dari Abu al-Husayn dan mempelajari Al-Qur'an serta sastra di bawah bimbingan ayahnya. Ia menguasai bahasa, Arab, dan sastra, memiliki reputasi baik, dan berdiri menggantikan ayahnya di kekhalifahan. Ibn al-Jawzi berkata: Kita belum pernah melihat putra yang mirip ayahnya seperti dia, bahkan dalam langkah dan tindakannya. Ibn al-Najjar berkata: Ia adalah salah satu ulama terkemuka dalam sastra, otentik dalam transmisi, sering dijadikan bukti, dapat dipercaya, mulia, dan fasih. Ia meninggal pada hari Jumat di tengah Syayawa tahun 575 H dan dimakamkan di pemakaman Imam Ahmad {cite:shadharat-dhahab, hlm. 729-730}."
