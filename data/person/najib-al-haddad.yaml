  ar: "نجيب بن سليمان الحداد ⁦(١٨٦٧–١٨٩٩م)⁩؛ صحافي. ولد في بيروت وانتقل إلى القاهرة فكتب مدة عشر سنوات في جريدة «الأهرام» ونشر روايات كثيرة ترجم أكثرها عن الفرنسية، منها رواية «صلاح الدين الأيوبي» و«شهداء الغرام» و«هدان» و«السيد» و«غصن البان». توفي بالقاهرة {cite:al-aalam tarjama}."
