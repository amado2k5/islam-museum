summary:
  en: "The Laythi tracker hired as guide for the Hijra — 'a skilled guide' still on Quraysh's religion, whom they nonetheless entrusted; he led the party by the little-used coastal road to Medina."
  ar: "الدليل الليثي الذي استأجره النبي وأبو بكر للهجرة — «هادياً خريتاً» ماهراً بالطريق وكان على دين كفار قريش فأمنّاه على ذلك؛ سلك بهم طريق الساحل الذي لم يكن يسلكه أحد إلا نادراً."
  fr: "Le pisteur laythite engagé comme guide pour l'hégire — « un guide habile » encore attaché à la religion de Quraysh, à qui l'on se fia pourtant ; il conduisit le groupe par la route côtière peu fréquentée jusqu'à Médine."
  es: "El rastreador Laythi contratado como guía para la Hégira —un \"guía experto\" que aún profesaba la religión de los Quraysh, a quien, no obstante, confiaron— condujo al grupo por el camino costero poco transitado hacia Medina."
  ur: "لیتھی ٹریکر کو حجرے کے لیے گائیڈ کے طور پر رکھا گیا تھا - 'ایک ہنر مند رہنما' جو اب بھی قریش کے مذہب پر ہے، جسے انہوں نے بہرحال سونپا۔ اس نے پارٹی کی قیادت مدینہ کے لیے چھوٹی استعمال شدہ ساحلی سڑک سے کی۔"
