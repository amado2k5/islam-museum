summary:
  ar: "عالم لبناني المولد مقيم في لندن، مؤسس مؤسسة أترجة ومدرّسها الرئيسي ورئيس دار الفتوى اللبنانية في المملكة المتحدة؛ درس في دمشق، وكان محاضرا أول في الجامعة الإسلامية في بيروت، ويحمل إجازات عالية في القرآن والحديث والفقه، ويدير «حلول الشريعة»."
  en: "Lebanese-born scholar based in London, founder and main teacher of the Utrujj Foundation and chairman of the Lebanese Dar Al-Fatwa in the United Kingdom; he studied in Damascus, was a senior lecturer at the Islamic University of Beirut, holds high ijazas in Qur'an, hadith and fiqh, and directs Shariah Solutions."
  ur: "لندن میں مقیم لبنانی نژاد عالم، اترجہ فاؤنڈیشن کے بانی و مرکزی مدرس اور برطانیہ میں لبنانی دار الفتویٰ کے چیئرمین؛ انہوں نے دمشق میں تعلیم حاصل کی، بیروت کی اسلامک یونیورسٹی میں سینئر لیکچرر رہے، قرآن و حدیث و فقہ میں اعلیٰ اجازے رکھتے ہیں، اور شریعہ سولیوشنز کے ڈائریکٹر ہیں۔"
