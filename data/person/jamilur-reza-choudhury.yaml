summary:
  ar: "مهندس مدني وأكاديمي بنغلاديشي، وُلد في سيلهيت سنة 1943 وتوفي في دكا سنة 2020. أستاذ الهندسة الإنشائية في جامعة بنغلاديش للهندسة والتكنولوجيا لعقود، وأول نائب رئيس لجامعة براك، ونائب رئيس جامعة آسيا والمحيط الهادئ حتى وفاته، ومستشار في حكومة تصريف الأعمال سنة 1996، ونال لقب الأستاذ الوطني سنة 2018."
  en: "Bangladeshi civil engineer and academic, born in Sylhet in 1943 and died in Dhaka in 2020. A professor of structural engineering at BUET for decades, he was the first vice-chancellor of BRAC University and vice-chancellor of the University of Asia Pacific until his death, served as an adviser to the 1996 caretaker government, and was named a National Professor in 2018."
  ur: "بنگلہ دیشی سول انجینئر اور ماہر تعلیم، جو 1943ء میں سلہٹ میں پیدا ہوئے اور 2020ء میں ڈھاکہ میں وفات پائے۔ وہ کئی دہائیوں تک بویٹ میں اسٹرکچرل انجینئرنگ کے پروفیسر رہے، براک یونیورسٹی کے پہلے وائس چانسلر اور یونیورسٹی آف ایشیا پیسیفک کے وائس چانسلر رہے، 1996ء میں نگران حکومت کے مشیر بنے، اور 2018ء میں انہیں قومی پروفیسر کا خطاب ملا۔"
