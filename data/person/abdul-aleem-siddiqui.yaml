summary:
  ar: "عالم وداعية متنقل (1892–1954)، وُلد في ميروت بالهند وتوفي في المدينة المنورة ودُفن في البقيع. تلميذ أحمد رضا خان البريلوي وخليفته في الطريقة القادرية الرضوية، جاب العالم أربعين عاماً داعية، فأسس جمعية التبليغ الإسلامي لعموم الملايو في سنغافورة (1932) وأطلق البعثة الإسلامية العالمية في ترينيداد (1950)، وهو والد شاه أحمد نوراني."
  en: "Scholar and travelling preacher (1892–1954), born at Meerut in India, died in Medina and buried in al-Baqi. A student of Ahmed Raza Khan Barelvi and his khalifa in the Qadiriyya Razviya order, he preached across the world for forty years, founded the All-Malaya Muslim Missionary Society in Singapore (1932) and launched the World Islamic Mission in Trinidad (1950); he was the father of Shah Ahmad Noorani."
  ur: "عالم اور مبلغ (1892ء–1954ء)، میرٹھ میں پیدا ہوئے اور مدینہ منورہ میں وصال ہوا، جنت البقیع میں مدفون ہیں۔ احمد رضا خان بریلوی کے شاگرد اور سلسلہ قادریہ رضویہ میں ان کے خلیفہ تھے؛ چالیس برس دنیا بھر میں تبلیغ کی، 1932ء میں آل ملایا مسلم مشنری سوسائٹی (سنگاپور) اور 1950ء میں ٹرینیڈاڈ میں ورلڈ اسلامک مشن کی بنیاد رکھی۔ مولانا شاہ احمد نورانی کے والد تھے۔"
