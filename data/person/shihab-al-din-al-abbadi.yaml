summary:
  ar: "الفقيه الحنفي؛ تفقه على السراج الهندي وفضل ودرّس واشتغل ثم صاهر القايجي وناب في الحكم ووقع على القضاء ودرّس مدرسة الظاهر حسن وكان يجمع الطلبة ويحسن إليهم، وحصلت له مخنة مع السالمي وأخرى مع الملك الظاهر {cite:shadharat-dhahab p. 11-12}."
  tr: "Hanefi hukukçu; Al-Siraj al-Hindi'nin yanında eğitim aldı, üstün başarı gösterdi, öğretti ve çalıştı, ardından El-Kaiji'nin kayınbiraderi oldu, yönetimde vekil olarak atandı, yargıç oldu ve El-Zahir Hasan'ın okulunda öğretmenlik yaptı. Öğrencileri bir araya getirdi ve onlara iyi davrandı. El-Selmi ile ve Al-Malik El-Zahir'de başka bir görev yaptı {cite:shadharat-dhahab, s. 11-12}."
  id: "Ahli hukum Hanafi; ia belajar di bawah Al-Siraj al-Hindi, unggul, mengajar, dan bekerja, kemudian menjadi ipar Al-Qaiji, diangkat sebagai wakil pemerintahan, menjadi hakim, dan mengajar di sekolah Al-Zahir Hasan. Ia mengumpulkan murid-murid dan memperlakukan mereka dengan baik. Ia pernah menjabat di Al-Salmi dan satu lagi di Al-Malik Al-Zahir {cite:shadharat-dhahab, hlm. 11-12}."
