summary:
  ar: طبيب وسياسي جنوب أفريقي، وُلد في كروغرسدورب سنة 1909 وتوفي في منفاه بلندن سنة 1983. رئيس المؤتمر الهندي لجنوب أفريقيا (1950–1952)، ومن قادة حملة التحدي سنة 1952، ورئيس الحزب الشيوعي لجنوب أفريقي من 1972 حتى وفاته، ومن بناة التحالف بين الحزب والمؤتمر الوطني الأفريقي والمؤتمر الهندي.
  en: South African physician and politician, born in Krugersdorp in 1909 and died in exile in London in 1983. President of the South African Indian Congress (1950–1952), a leader of the 1952 Defiance Campaign, and chairman of the South African Communist Party from 1972 until his death, he was a principal builder of the alliance between the SACP, the ANC and the Indian congresses.
  ur: جنوبی افریقی معالج اور سیاست دان، جو 1909 میں کروگرسڈورپ میں پیدا ہوئے اور 1983 میں لندن میں جلاوطنی کے دوران وفات پائے۔ ساؤتھ افریقن انڈین کانگریس کے صدر (1950–1952)، 1952 کی ڈیفائنس مہم کے رہنما، اور 1972 سے وفات تک ساؤتھ افریقن کمیونسٹ پارٹی کے چیئرمین رہے۔
