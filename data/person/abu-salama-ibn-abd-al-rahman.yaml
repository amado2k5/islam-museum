  ar: "أبو سلمة بن عبد الرحمن بن عوف الزهري، من كبار التابعين بالمدينة، ثقة فقيه كثير الحديث، ولي قضاء المدينة. قيل اسمه عبد الله، وقيل إسماعيل، وقيل اسمه كنيته. توفي سنة 94هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2053}"
