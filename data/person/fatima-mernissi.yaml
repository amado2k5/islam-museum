  ar: "فاطمة المرنيسي ⁦(1940–2015)⁩ عالمة اجتماع وكاتبة مغربية، من رواد النقد النسوي الإسلامي، فحصت نصوص الحديث والسلطة السياسية والجندر. من كتبها «الحريم السياسي» و«الخوف من الحداثة» و«الإسلام والديمقراطية»."
  en: "Fatima Mernissi (1940–2015) was a Moroccan sociologist and writer, a pioneer of Islamic feminist critique, who examined hadith texts, political authority and gender. Her books include The Veil and the Male Elite (Le Harem politique), Beyond the Veil and Islam and Democracy."
  ur: "فاطمہ مرنیسی ⁦(1940–2015)⁩ مراکشی ماہرِ سماجیات اور مصنفہ تھیں، اسلامی فیمینسٹ نقد کی پیش رو، جنہوں نے احادیث کے متون، سیاسی اختیار اور صنفی مسائل کا جائزہ لیا۔ کتب میں «الحريم السياسي»، «Beyond the Veil» اور «Islam and Democracy» شامل ہیں۔"
