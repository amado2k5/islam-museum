summary:
  ar: "ابن الملك العادل؛ كان فارساً شجاعاً وشهماً مهيباً وملكاً جواداً، وكان صاحب ميافارقين وخلاط وحصن منصور وغير ذلك؛ حج من بغداد ثم توفي في هذه السنة وتملك بعده ابنه الشهيد الملك الكامل ناصر الدين {cite:shadharat-dhahab p. 241}."
  en: "Al-Adil's son (d. 645) — the bold, awe-inspiring lord of Mayyafariqin, Khilat and Hisn Mansur, who performed the hajj out of Baghdad; succeeded by his son the martyred al-Kamil Nasir al-Din {cite:shadharat-dhahab p. 241}."
  es: "El hijo de Al-Adil (m. 645), el audaz e imponente señor de Mayyafariqin, Khilat e Hisn Mansur, que realizó el Hajj desde Bagdad; sucedido por su hijo, el mártir al-Kamil Nasir al-Din {cite:shadharat-dhahab p. 241}."
  fr: "Le fils d'Al-Adil (mort en 645) — le seigneur audacieux et impressionnant de Mayyafariqin, Khilat et Hisn Mansur, qui a accompli le hajj hors de Bagdad; remplacé par son fils le martyr al-Kamil Nasir al-Din {cite: shadharat-dhahab p. 241}."
  ur: "العادل کا بیٹا ⁦(وفات 645)⁩ - مایافارکین، خلعت اور حسن منصور کا دلیر، خوفناک رب، جس نے بغداد سے حج کیا؛ ان کے بعد ان کے بیٹے شہید الکامل ناصر الدین نے وفات پائی۔ 241}۔"
  tr: "Adil kralın oğlu; cesur, soylu ve görkemli bir şövalye, cömert bir kral, Miyyafariqin'in ustası, Mansur kalesi ve diğerlerinin ustasıydı; Bağdat'tan Hac yaptı ve o yıl öldü, ardından oğlu, şehit Kral el-Kamil Nasir el-Din geçti {kaynak:shadharat-dhahab, s. 241}."
  id: "Putra raja yang adil; ia adalah ksatria yang berani, mulia, dan megah, raja yang murah hati, serta ahli Miyyafariqin, penginadah, benteng Mansur, dan lainnya; ia melaksanakan Haji dari Baghdad dan meninggal pada tahun itu, dan setelahnya digantikan oleh putranya, Raja al-Kamil Nasir al-Din yang gugur (cite:shadharat-dhahab, hlm. 241}."
