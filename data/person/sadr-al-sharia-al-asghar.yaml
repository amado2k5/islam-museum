summary:
  ar: "بطاقة أولية لعبيد الله بن مسعود صدر الشريعة الأصغر، فقيه الحنفية ومنجم بخارى في القرن الرابع عشر صاحب «التنوير»، توفي سنة ١٣٤٦م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ubayd Allah ibn Mas'ud Sadr al-Shari'a al-Asghar, the fourteenth-century Hanafi jurist and astronomer of Bukhara author of al-Tanwir, d. 1346; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Ubayd Allah ibn Mas'ud Sadr al-Shari'a al-Asghar, jurista y astrónomo hanafí del siglo XIV de Bujará, autor de al-Tanwir, fallecido en 1346; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet pour Ubayd Allah ibn Mas'ud Sadr al-Shari'a al-Asghar, juriste et astronome hanafite du XIVe siècle de Boukhara, auteur d'al-Tanwir, mort en 1346; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "عبید اللہ ابن مسعود صدر الشریعہ الاصغر کے لیے ڈرافٹ کارڈ، چودھویں صدی کے حنفی فقیہ اور بخارا کے ماہر فلکیات مصنف التنویر، ڈی۔ 1346; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "14. yüzyılda Buhara'da yaşayan Hanefi hukukçu ve astrolog Ubeyd Allah bin Mesud Sadr el-Şeriat el-Asghar için ön kart, 1346 yılında vefat eden 'Al-Tanwir' kitabının yazarı; biyografik kitaplarda kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Ubayd Allah bin Mas'ud Sadr al-Shari'ah al-Asghar, seorang ahli hukum dan astrolog Hanafi dari Bukhara pada abad ke-14, penulis 'Al-Tanwir', yang meninggal pada tahun 1346 M; buku biografi menyebutkannya, dan biografinya belum diulas di halaman tersebut."
