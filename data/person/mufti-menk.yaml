summary:
  ar: "داعية ومفتٍ زيمبابوي من أصل هندي، وُلد سنة 1975 وتلقى تعليمه الشرعي في المدينة المنورة. يُعد المفتي العام لزيمبابوي، واشتهر بمحاضراته الميسّرة ومنشوراته التحفيزية عبر وسائل التواصل حتى صار من أكثر العلماء السنة متابعةً في العالم."
  en: "Zimbabwean preacher and mufti of Indian descent, born in 1975 and trained in Islamic studies in Madinah. Grand Mufti of Zimbabwe, he became known for accessible lectures and motivational posts on social media that made him one of the most followed Sunni clerics in the world."
  ur: "زمبابوے کے مبشر اور مفتی، ہندوستانی نسل سے، 1975 میں پیدا ہوئے اور مدینہ منورہ میں دینی تعلیم حاصل کی۔ وہ زمبابوے کے مفتِی اعظم ہیں اور آسان محاورے کی تقریروں اور سوشل میڈیا پر تحریکی پیغامات کی وجہ سے دنیا کے سب سے زیادہ پیروی کیے جانے والے اہلِ سنت علماء میں شمار ہوتے ہیں۔"
