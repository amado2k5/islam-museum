id: person/artuq-ibn-aksak
class: person
label:
  ar: أرتق بن أكسك
  en: Artuq ibn Aksak
  es: "Artuq ibn Aksak"
  fr: "Artuq ibn Aksak"
  ur: "ارطوق ابن عسک"
summary:
  ar: "أرتق بن أكسك، من مماليك السلطان ملك شاه بن ألب أرسلان وله مقام محمود في دولتهم؛ كان على حلوان وما إليها من أعمال العراق، وبعثه ملك شاه في عسكر أردفه على حصار الموصل مع فخر الدولة بن جهير سنة 477هـ فهزمه مسلم بن قريش وحاصره بآمد، ثم لحق بتتش فلقيه تتش وهزمه وكان له في تلك الواقعة المقام المحمود، واستجار مقدم حلب ابن الحسين به فأجاره من تتش، وهلك سنة 483هـ بالقدس وملكه من بعده ابناه أبو الغازي وسقمان."
  en: "Artuq ibn Aksak, a mamluk of Sultan Malikshah ibn Alp Arslan held in high esteem in their state; set over Hillwan and the Iraqi marches, he was sent in the 477 AH army against Mosul under Fakhr al-Dawla ibn Jahir, was defeated and besieged by Muslim ibn Quraysh at Amid, then joined Tutush — beaten by him yet acquitting himself well — interceded for Aleppo's defender Ibn al-Husayn, and died in Jerusalem in 483 leaving his sons Abu al-Ghazi and Sukman to succeed him."
  es: "Artuq ibn Aksak, un mameluco del sultán Malikshah ibn Alp Arslan, gozaba de gran prestigio en su estado; puesto al mando de Hillwan y las fronteras iraquíes, fue enviado en el ejército de 477 AH contra Mosul bajo el mando de Fakhr al-Dawla ibn Jahir, fue derrotado y asediado por Muslim ibn Quraysh en Amid, luego se unió a Tutush —derrotado por él pero defendiéndose bien— intercedió por el defensor de Alepo, Ibn al-Husayn, y murió en Jerusalén en 483, dejando a sus hijos Abu al-Ghazi y Sukman como sucesores."
  fr: "Artuq ibn Aksak, un mamelouk du sultan Malikshah ibn Alp Arslan, tenu en haute estime dans leur État; placé sur Hillwan et les marches irakiennes, il fut envoyé dans l'armée de 477 AH contre Mossoul sous Fakhr al-Dawla ibn Jahir, fut vaincu et assiégé par Muslim ibn Quraysh à Amid, puis rejoignit Tutush — battu par lui mais se comportant bien — intercéda pour le défenseur d'Alep Ibn al-Husayn, et mourut à Jérusalem en 483 laissant ses fils Abu al-Ghazi et Sukman pour lui succéder."
  ur: "سلطان ملک شاہ ابن الپ ارسلان کے مملوک ارطوق ابن اکساک کو ان کی ریاست میں بہت عزت دی جاتی تھی۔ ہلوان اور عراقی مارچوں پر مقرر، اسے فخر الدولہ ابن جہر کے ماتحت موصل کے خلاف 477 ہجری کی فوج میں بھیجا گیا، اسے شکست ہوئی اور مسلم ابن قریش نے آمید کے مقام پر محاصرہ کیا، پھر توتش میں شامل ہو گیا - اس کے ہاتھوں مارا پیٹا پھر بھی خود کو بری کر دیا- حلب کے محافظ کے لیے شفاعت کی اور ابن العین 48 میں اس کا انتقال ہو گیا۔ ان کے بیٹے ابو الغازی اور سقمان ان کے جانشین ہوں گے۔"
  tr: "Sultan Malik Şah ibn Alp Arslan'ın Memlüklerinden Artuq ibn Aksk, devletlerinde saygın bir konumdaydı; Helwan ve çevresindeki Irak'taki topraklar üzerinde görev yapıyordu. Malik Şah, onu 477 Hicri ile birlikte Fakhr bin Juhayr ile birlikte Musul'u kuşatması için bir orduyla gönderdi. Müslüm ibn Kureyş onu yendi ve Amad'da kuşattı. Sonra Batch'ı takip etti, karşılaştı ve yendi. O savaşta övgü dolu türbeyi elinde tuttu. Halep komutanı İbn al-Hüseyin'i yanında tuttu, o da onu Tuch'tan korudu. 483 Hicri'de Kudüs'te öldü ve halefleri Ebu el-Gazi ile Saqman oldu."
  id: "Artuq ibn Aksk, salah satu Mamluk di bawah Sultan Malik Shah ibn Alp Arslan, memegang posisi terhormat di negara mereka; ia menguasai Helwan dan wilayah sekitarnya di Irak. Malik Shah mengirimnya dengan pasukan untuk mengepung Mosul bersama Fakhr ibn Juhayr pada tahun 477 H. Muslim ibn Quraysh mengalahkannya dan mengepungnya di Amad. Kemudian ia mengejar Batch, bertemu dengannya, dan mengalahkannya. Ia memegang tempat suci yang dipuji dalam pertempuran itu. Ia menyewa komandan Aleppo Ibn al-Husayn bersamanya, yang melindunginya dari Tuch. Ia meninggal pada tahun 483 H di Yerusalem, dan penerusnya adalah Abu al-Ghazi dan Saqman."
