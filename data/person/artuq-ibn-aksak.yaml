label:
  ar: أرتق بن أكسك
  en: Artuq ibn Aksak
summary:
  ar: "أرتق بن أكسك، من مماليك السلطان ملك شاه بن ألب أرسلان وله مقام محمود في دولتهم؛ كان على حلوان وما إليها من أعمال العراق، وبعثه ملك شاه في عسكر أردفه على حصار الموصل مع فخر الدولة بن جهير سنة 477هـ فهزمه مسلم بن قريش وحاصره بآمد، ثم لحق بتتش فلقيه تتش وهزمه وكان له في تلك الواقعة المقام المحمود، واستجار مقدم حلب ابن الحسين به فأجاره من تتش، وهلك سنة 483هـ بالقدس وملكه من بعده ابناه أبو الغازي وسقمان."
  en: "Artuq ibn Aksak, a mamluk of Sultan Malikshah ibn Alp Arslan held in high esteem in their state; set over Hillwan and the Iraqi marches, he was sent in the 477 AH army against Mosul under Fakhr al-Dawla ibn Jahir, was defeated and besieged by Muslim ibn Quraysh at Amid, then joined Tutush — beaten by him yet acquitting himself well — interceded for Aleppo's defender Ibn al-Husayn, and died in Jerusalem in 483 leaving his sons Abu al-Ghazi and Sukman to succeed him."
