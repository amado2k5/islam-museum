summary:
  ar: "أبو الحسن علي بن مسلم بن سعيد الطوسي؛ سكن بغداد وحدّث بها عن عبد الرحمن بن زيد بن أسلم ويوسف بن الماجشون وهشيم وعبد الله بن المبارك وسفيان بن عيينة وجرير بن عبد الحميد وعباد بن العوام وإسماعيل بن علية ومحمد بن بكر البرساني وعبد الله بن غرار وأبي داود الطيالسي وهبان بن هلال وعبد الصمد بن عبد الوارث ووهب بن جرير وروح بن عبادة، وروى عنه محمد بن إسحاق الصاغاني ومحمد بن إسماعيل البخاري في صحيحه وأبو بكر الأثرم ومعاذ بن المثنى وعبد الله بن أحمد بن حنبل وأبو العباس البغوي وإبراهيم بن حماد القاضي وإبراهيم بن موسى النوري ويحيى بن صاعد والقاضي المحاملي وابن عياش القطان وغيرهم {cite:tarikh-baghdad-khatib j.10 p.108}."
  en: "Abu'l-Hasan al-Tusi, settled at Baghdad — a transmitter whom al-Bukhari cites in the Sahih; his teachers include Ibn al-Mubarak, Ibn 'Uyayna, Jarir b. 'Abd al-Hamid and Abu Dawud al-Tayalisi {cite:tarikh-baghdad-khatib j.10 p.108}."
