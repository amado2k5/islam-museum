label: { ar: "علي بن مسلم الطوسي", en: "Ali ibn Muslim al-Tusi", es: "Ali ibn Muslim al-Tusi", fr: "Ali ibn Muslim al-Tusi", ur: "علی بن مسلم الطوسی" }
roles: [scholar]
gender: male
summary:
  ar: "أبو الحسن علي بن مسلم بن سعيد الطوسي؛ سكن بغداد وحدّث بها عن عبد الرحمن بن زيد بن أسلم ويوسف بن الماجشون وهشيم وعبد الله بن المبارك وسفيان بن عيينة وجرير بن عبد الحميد وعباد بن العوام وإسماعيل بن علية ومحمد بن بكر البرساني وعبد الله بن غرار وأبي داود الطيالسي وهبان بن هلال وعبد الصمد بن عبد الوارث ووهب بن جرير وروح بن عبادة، وروى عنه محمد بن إسحاق الصاغاني ومحمد بن إسماعيل البخاري في صحيحه وأبو بكر الأثرم ومعاذ بن المثنى وعبد الله بن أحمد بن حنبل وأبو العباس البغوي وإبراهيم بن حماد القاضي وإبراهيم بن موسى النوري ويحيى بن صاعد والقاضي المحاملي وابن عياش القطان وغيرهم {cite:tarikh-baghdad-khatib j.10 p.108}."
  en: "Abu'l-Hasan al-Tusi, settled at Baghdad — a transmitter whom al-Bukhari cites in the Sahih; his teachers include Ibn al-Mubarak, Ibn 'Uyayna, Jarir b. 'Abd al-Hamid and Abu Dawud al-Tayalisi {cite:tarikh-baghdad-khatib j.10 p.108}."
  es: "Abu'l-Hasan al-Tusi, establecido en Bagdad, un transmisor a quien al-Bukhari cita en el Sahih; sus maestros incluyen a Ibn al-Mubarak, Ibn 'Uyayna, Jarir b. 'Abd al-Hamid y Abu Dawud al-Tayalisi {citar:tarikh-baghdad-khatib j.10 p.108}."
  fr: "Abu'l-Hasan al-Tusi, installé à Bagdad — un émetteur cité par al-Bukhari dans le Sahih; ses professeurs incluent Ibn al-Mubarak, Ibn 'Uyayna, Jarir b. 'Abd al-Hamid et Abu Dawud al-Tayalisi {cite:tarikh-baghdad-khatib j.10 p.108}."
  ur: "ابوالحسن الطوسی، بغداد میں مقیم تھے - ایک ٹرانسمیٹر جس کو بخاری نے صحیح میں نقل کیا ہے۔ ان کے اساتذہ میں ابن المبارک، ابن عیینہ، جریر بن شامل ہیں۔ عبد الحامد اور ابوداؤد الطیالسی {حوالہ: تاریخ بغداد خطیب ج.10 ص108}۔"
  tr: "Ebu el-Hasan Ali bin Müslim bin Seyid el-Tusi; Bağdat'ta ikamet etmiş ve orada Abd al-Rahman ibn Zayd ibn Aslam, Yusuf ibn al-Majshoon, Hushaym, Abdullah ibn al-Mubarak, Sufyan ibn Uyaynah, Jarir ibn Abd al-Hamid, 'Abbad ibn al-Awwam, İsmail ibn 'Ulayyah, Muhammed ibn Bakr al-Barsani, Abdullah ibn Ghurar, Abu Dawud al-Tayalisi, Hibban ibn Hilal, Abd al-Samad ibn Rahm'den rivayet edilmiştir n Abd al-Warith, Wahb ibn Jarir, Ruh ibn 'Ubadah. Muhammed ibn İshaqani, Sahih'inde ondan rivayet etmiştir: Ebu Bekir el-Atrim, Muad ibn el-Muthanna, Abdullah ibn Ahmed ibn Hanbal, Ebu el-Abbas el-Baghawi, İbrahim ibn Hammad el-Kadi, İbrahim ibn Musa el-Nuri, Yahya ibn Sa'id, el-Kaddi el-Mahamili, İbn Ayyiş el-Qattan ve diğerleri {atıf:Tarikh-baghdad-khatib J. 10 s.10}."
  id: "Abu al-Hasan Ali ibn Muslim ibn Sa'id al-Tusi; tinggal di Baghdad dan diceritakan di sana dari Abd al-Rahman ibn Zayd ibn Aslam, Yusuf ibn al-Majshoon, Hushaym, Abdullah ibn al-Mubarak, Sufyan ibn Uyaynah, Jarir ibn Abd al-Hamid, 'Abbad ibn al-Awwam, Ismail ibn 'Ulayyah, Muhammad ibn Bakr al-Barsani, Abdullah ibn Ghurar, Abu Dawud al-Tayalisi, Hibban ibn Hilal, Abd al-Samad ibn Abd al-Warith, Wahb ibn Jarir, Ruh ibn 'Ubadah. Muhammad ibn Ishaqani menceritakan darinya dalam Sahih-nya, Abu Bakr al-Athrim, Mu'adh ibn al-Muthanna, Abdullah ibn Ahmad ibn Hanbal, Abu al-Abbas al-Baghawi, Ibrahim ibn Hammad al-Qadi, Ibrahim ibn Musa al-Nuri, Yahya ibn Sa'id, al-Qadi al-Mahamili, Ibn Ayyash al-Qattan, dan lainnya {cite:Tarikh-baghdad-khatib J.] 10 hlm.10}."
