summary:
  ar: "شاهد رفيق خان ⁦(وُلد في ١٨ تموز ١٩٥٠ في لاهور)⁩ رجل أعمال باكستاني أمريكي يملك شركة فليكس-إن-غيت لقطع السيارات ونادي جاكسونفيل جاغوارز في دوري كرة القدم الأمريكية ونادي فولهام الإنجليزي؛ انتقل إلى الولايات المتحدة سنة ١٩٦٧ طالبًا للهندسة في جامعة إلينوي، واشترى فليكس-إن-غيت سنة ١٩٨٠ وبنى منها واحدة من أكبر شركات قطع السيارات الخاصة، وأصبح سنة ٢٠١٢ أول مالك لفريق في الدوري الأمريكي من أقلية عرقية."
  en: "Shahid Rafiq Khan (born 18 July 1950 in Lahore) is a Pakistani-American businessman who owns the Flex-N-Gate auto-parts company, the Jacksonville Jaguars of the NFL and Fulham F.C.; he moved to the United States in 1967 to study engineering at the University of Illinois, bought Flex-N-Gate in 1980 and built it into one of the largest private auto-parts suppliers, and in 2012 became the first ethnic-minority owner of an NFL team."
  ur: "شاہد رفیق خان (پیدائش 18 جولائی 1950، لاہور) پاکستانی نژاد امریکی کاروباری ہیں، فلیکس-این-گیٹ، جیکسن وِل جیگوارز اور فلہم فٹبال کلب کے مالک؛ وہ 1967 میں انجینئرنگ پڑھنے امریکہ گئے، 1980 میں فلیکس-این-گیٹ خرید کر اسے آٹو پارٹس کی بڑی نجی کمپنی بنایا، اور 2012 میں این ایف ایل ٹیم کے پہلے نسلی اقلیتی مالک بنے۔"
