summary:
  ar: "شاهد رفيق خان ⁦(وُلد في ١٨ تموز ١٩٥٠ في لاهور)⁩ رجل أعمال باكستاني أمريكي يملك شركة فليكس-إن-غيت لقطع السيارات ونادي جاكسونفيل جاغوارز في دوري كرة القدم الأمريكية ونادي فولهام الإنجليزي؛ انتقل إلى الولايات المتحدة سنة ١٩٦٧ طالبًا للهندسة في جامعة إلينوي، واشترى فليكس-إن-غيت سنة ١٩٨٠ وبنى منها واحدة من أكبر شركات قطع السيارات الخاصة، وأصبح سنة ٢٠١٢ أول مالك لفريق في الدوري الأمريكي من أقلية عرقية."
  en: "Shahid Rafiq Khan (born 18 July 1950 in Lahore) is a Pakistani-American businessman who owns the Flex-N-Gate auto-parts company, the Jacksonville Jaguars of the NFL and Fulham F.C.; he moved to the United States in 1967 to study engineering at the University of Illinois, bought Flex-N-Gate in 1980 and built it into one of the largest private auto-parts suppliers, and in 2012 became the first ethnic-minority owner of an NFL team."
  ur: "شاہد رفیق خان ⁦(پیدائش 18 جولائی 1950، لاہور)⁩ پاکستانی نژاد امریکی کاروباری ہیں، فلیکس-این-گیٹ، جیکسن وِل جیگوارز اور فلہم فٹبال کلب کے مالک؛ وہ 1967 میں انجینئرنگ پڑھنے امریکہ گئے، 1980 میں فلیکس-این-گیٹ خرید کر اسے آٹو پارٹس کی بڑی نجی کمپنی بنایا، اور 2012 میں این ایف ایل ٹیم کے پہلے نسلی اقلیتی مالک بنے۔"
  es: "Shahid Rafiq Khan (nacido el 18 de julio de 1950 en Lahore) es un empresario paquistaní-estadounidense propietario de la empresa de autopartes Flex-N-Gate, los Jacksonville Jaguars de la NFL y el Fulham FC; se mudó a los Estados Unidos en 1967 para estudiar ingeniería en la Universidad de Illinois, compró Flex-N-Gate en 1980 y la convirtió en uno de los mayores proveedores privados de autopartes, y en 2012 se convirtió en el primer propietario perteneciente a una minoría étnica de un equipo de la NFL."
  fr: "Shahid Rafiq Khan (né le 18 juillet 1950 à Lahore) est un homme d'affaires pakistano-américain qui possède la société de pièces automobiles Flex-N-Gate, les Jaguars de Jacksonville de la NFL et le Fulham FC; il a déménagé aux États-Unis en 1967 pour étudier l'ingénierie à l'Université de l'Illinois, a acheté Flex-N-Gate en 1980 et en a fait l'un des plus grands fournisseurs privés de pièces automobiles, et est devenu en 2012 le premier propriétaire issu d'une minorité ethnique d'une équipe de la NFL."
  tr: "Shahid Rafiq Khan (18 Temmuz 1950, Lahor doğumlu), Amerikan Futbol Ligi'nde Flex-N-Gate Auto Parts ve Jacksonville Jaguars'ın sahibi olan Pakistan-Amerikalı bir iş insanıdır; 1967'de Illinois Üniversitesi'nde mühendislik öğrencisi olarak Amerika Birleşik Devletleri'ne taşındı, 1980'de Flex-N-Gate'i satın aldı ve oradan en büyük özel otomobil parça şirketlerinden birini kurdu. 2012 yılında, etnik azınlıktan bir Amerikan Ligi takımının ilk sahibi oldu."
  id: "Shahid Rafiq Khan (lahir 18 Juli 1950 di Lahore) adalah seorang pengusaha Pakistan-Amerika yang memiliki Flex-N-Gate Auto Parts dan Jacksonville Jaguars di American Football League serta Fulham di Inggris; ia pindah ke Amerika Serikat pada tahun 1967 sebagai mahasiswa teknik di University of Illinois, membeli Flex-N-Gate pada tahun 1980, dan membangun salah satu perusahaan suku cadang mobil pribadi terbesar dari sana. Pada tahun 2012, ia menjadi pemilik pertama tim American League dari kelompok etnis minoritas."
